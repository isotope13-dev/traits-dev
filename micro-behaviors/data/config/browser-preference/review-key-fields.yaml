defaults:
  for:
  - scripts
  - binaries
  - source
traits:
- id: chromium-app-bound-encrypted-key-field
  desc: References Chromium App-Bound key field
  crit: notable
  conf: 0.85
  if:
    type: text
    word: app_bound_encrypted_key
  platforms:
  - windows
composite_rules:
- platforms:
  - linux
  - macos
  - windows
  id: chromium-encrypted-key-metadata
  desc: Chromium Local State key metadata references
  conf: 0.9
  all:
  - id: micro-behaviors/fs/path/application/browser::local-state
  - id: micro-behaviors/data/config/schema::encrypted-key-field-reference
  - id: micro-behaviors/data/config/browser-preference::chromium-os-crypt-reference
  unless:
  - id: well-known/tool/media/
  - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path
  - id: well-known/lib/platform/browser-automation/drivers/selenium::google-flow-browser-auth-client
  - id: well-known/app/ai/tool-server/linkedin-mcp-server::browser-import-source-context
  - id: well-known/app/ai/tool-server/linkedin-mcp-server::browser-import-archive-context
  - id: well-known/lib/platform/browser-automation/drivers/selenium::browser-profile-import-workflow
  - id: well-known/app/ai/coding-agent/kombai::kombai-browser-session-import-context
  - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
  - id: well-known/app/ai/agent-runtime/composio/
  crit: notable
