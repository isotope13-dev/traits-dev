composite_rules:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - pe
  - elf
  - macho
  id: search-engine-id
  desc: Browser search engine identifier reference
  crit: notable
  conf: 0.7
  needs: 2
  not:
  - substr: web_search
  - substr: WebSearch
  - SearchProviderSearchGuide
  - defaultSearchBase
  - DefaultSearchBase
  unless:
  - id: well-known/app/utility/macos-cleaners::macos-cleaner-app
  - id: well-known/app/utility/macos-cleaners::pearcleaner-bundle-member
  any:
  - id: micro-behaviors/data/config/browser-preference::search-provider-token
  - id: micro-behaviors/data/config/browser-preference::search-engine-token
  - id: micro-behaviors/data/config/browser-preference::default-search-engine-key
  - id: micro-behaviors/data/config/browser-preference::default-search-keyword-key
  - id: micro-behaviors/data/config/browser-preference::search-provider-camel-token
  - id: micro-behaviors/data/config/browser-preference::search-engine-camel-token
