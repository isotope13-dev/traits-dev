# Search-provider preference-key vocabulary, relocated from
# objectives/discovery/host/browser/identity (derived.yaml). These are the
# preference KEY spellings browsers and their policy templates use for the
# default search engine; a key name is not discovery. The browser identity
# composite `search-engine-id` needs two of them.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 1.0
  for: [scripts, binaries]

traits:
  - id: search-provider-token
    desc: SearchProvider settings token
    if:
      type: text
      exact: SearchProvider
  - id: search-engine-token
    desc: SearchEngine settings token
    if:
      type: text
      word: SearchEngine
    unless:
      - id: well-known/tool/reverse-engineering/dede::generated-file-banner
    not:
      - substr: EnableLUA
      - substr: This file is generated by DeDe
  - id: default-search-engine-key
    desc: Default search engine, provider or URL key
    if:
      type: text
      regex: '[dD]efaultSearch(Engine|Provider|URL)'
  - id: default-search-keyword-key
    desc: Default search keyword or homepage key
    if:
      type: text
      regex: '[dD]efaultSearch(Keyword|Homepage|HomePage)'
  - id: search-provider-camel-token
    desc: searchProvider camelCase settings token
    if:
      type: text
      substr: searchProvider
  # Key or property position only. The old bare substring matched any
  # identifier containing it -- mixpanel's referrer parser
  # `_searchEngine:function(e){...}` in Element Call scored as a search
  # engine setting.
  - id: search-engine-camel-token
    desc: Assigns a searchEngine key or property
    if:
      type: text
      regex: '\bsearchEngine["'']?\s*[:=][^=]'
