# Browser preference stores and the integrity machinery around them:
# Chromium's Secure Preferences MAC fields and the helper functions that
# compute them, the tracked-prefs reset and sideload-exemption keys, and
# Firefox's startup/search preference names. These are preference KEYS and
# FIELD names, not filesystem paths -- which is why they never belonged
# under fs/path/. Neutral here; forging a preference MAC to sideload an
# extension is intent, and lives in the objectives composites that use them.

defaults:
  platforms: [windows, unix]
  for: [scripts, source, data, pe, dll, elf]
  conf: 0.82

traits:
- id: chromium-secure-prefs-super-mac
  desc: Chromium Secure Preferences super_mac
  crit: notable
  conf: 0.9
  if:
    type: text
    word: super_mac
- id: chromium-secure-prefs-protection-macs
  desc: Chromium Secure Preferences protection.macs
  crit: notable
  conf: 0.92
  if:
    # The MAC tree Chromium keeps for its tracked preferences. Nothing outside
    # the browser reads or writes it except code recomputing the MACs, so the
    # dotted spelling is worth surfacing on its own.
    type: text
    substr: protection.macs
- id: chromium-secure-prefs-encrypted-hash
  desc: Chromium encrypted hash field
  crit: notable
  conf: 0.9
  if:
    # Leading `_` is a word character, so `word:` would not match the
    # `settings_encrypted_hash` spelling Chromium actually writes.
    type: text
    substr: _encrypted_hash
- id: chromium-local-network-content-setting
  desc: Chromium local network content setting
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'content_settings\.exceptions\.(local|loopback)_network'
- id: chromium-tracked-prefs-reset
  desc: Chromium tracked prefs reset
  crit: notable
  conf: 0.86
  if:
    type: text
    exact: prefs.tracked_preferences_reset
- id: chromium-json-mac-helper--computemacleaf
  desc: Chromium JSON MAC helper (ComputeMacLeaf)
  crit: notable
  conf: 0.86
  if:
    type: text
    word: ComputeMacLeaf
- id: chromium-json-mac-helper--computemacmissing
  desc: Chromium JSON MAC helper (ComputeMacMissing)
  crit: notable
  conf: 0.86
  if:
    type: text
    word: ComputeMacMissing
- id: chromium-json-mac-helper--calculateencryptedhash
  desc: Chromium JSON MAC (CalculateEncryptedHash)
  crit: notable
  conf: 0.86
  if:
    type: text
    word: CalculateEncryptedHash

# Preference names Chromium keeps for its *own* defenses against side-loaded
# extensions. None of them is a setting a user or an application configures:
# the browser writes them and the browser reads them. They are named here
# because code outside Chromium that spells one of them out is reaching into
# that defensive state, and no rule in the tree named them before.
#
# Notable individually -- Chromium's own source and a preference-inspection
# tool reference them legitimately -- with the intent supplied by the composite
# in objectives/persistence/login/browser-extension/chromium.yaml.
- id: chromium-sideload-wipeout-exemption
  desc: Chromium sideload wipeout exemption pref
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: exclude_from_sideload_wipeout
- id: chromium-enable-warning-suppression
  desc: Chromium extension enable-warning pref
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: install_warning_on_enable
- id: chromium-known-disabled-extensions
  desc: Chromium known-disabled extensions pref
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: extensions.known_disabled
composite_rules:
- id: chromium-profile-user-data-path-built
  desc: Builds a Chromium User Data path
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/fs/path/construct::source-path-builder-call
  - id: micro-behaviors/fs/path/app-data::chromium-browser-product-path-component
  - id: micro-behaviors/fs/path/app-data::chromium-user-data-path-component
  near_bytes: 256
- id: chromium-profile-secure-preferences-path
  desc: Chromium profile Secure Preferences path
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/app-data::chromium-secure-preferences-file
  any:
  - id: micro-behaviors/fs/path/app-data::chromium-profile-user-data-path
  - id: micro-behaviors/fs/path/app-data::chromium-profile-secure-preferences-name
  - id: chromium-profile-user-data-path-built
  near_bytes: 256
- id: chromium-json-mac-helper
  desc: Chromium JSON MAC helper
  crit: component
  conf: 0.86
  any:
  - id: chromium-json-mac-helper--computemacleaf
  - id: chromium-json-mac-helper--computemacmissing
  - id: chromium-json-mac-helper--calculateencryptedhash
- id: chromium-secure-prefs-mac-fields
  desc: Chromium Secure Preferences MAC fields
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/fs/path/app-data::chromium-secure-preferences-file
  any:
  - id: chromium-secure-prefs-super-mac
  - id: chromium-secure-prefs-protection-macs
  - id: chromium-secure-prefs-encrypted-hash
  - id: chromium-tracked-prefs-reset
  - id: chromium-json-mac-helper
  needs: 2
