defaults:
  platforms:
  - windows
  for:
  - rust
traits:
- id: rust-appb-byte-prefix
  desc: Rust byte string names APPB format
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: ((string_literal) @tag (#eq? @tag "b\"APPB\""))
- id: rust-v20-byte-prefix
  desc: Rust byte string names v20 format
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: ((string_literal) @tag (#eq? @tag "b\"v20\""))
