defaults:
  for:
  - scripts
  - binaries
  - source
  - -mirc
  - -ircii
  - -beam
  platforms:
  - linux
  - macos
  - windows
traits:
- id: chromium-os-crypt-common-formats
  desc: References Chromium os_crypt structure
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)\bos_crypt\s*(::|\.|\()
- id: chromium-os-crypt-additional-formats
  for:
  - beam
  - mirc
  - ircii
  desc: References Chromium os_crypt structure
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)\bos_crypt\s*(\(|\.|::)
- id: chromium-os-crypt-field
  desc: References bare Chromium os_crypt field
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: os_crypt
composite_rules:
- id: chromium-os-crypt-reference
  for:
  - scripts
  - binaries
  - source
  desc: References Chromium os_crypt structure
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/data/config/browser-preference::chromium-os-crypt-common-formats
  - id: micro-behaviors/data/config/browser-preference::chromium-os-crypt-additional-formats
  - id: micro-behaviors/data/config/browser-preference::chromium-os-crypt-field
