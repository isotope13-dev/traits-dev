composite_rules:
- id: app-bound-field-elevation-interface
  desc: App-bound key field and elevation interface coexist
  crit: notable
  conf: 0.97
  for:
  - pe
  - dll
  platforms:
  - windows
  all:
  - id: micro-behaviors/data/config/browser-preference::chromium-app-bound-encrypted-key-field
  any:
  - id: micro-behaviors/os/com/invoke::chromium-ielevator-service-guid
  - id: micro-behaviors/os/com/invoke::chromium-ielevator-service-guid-readonly
  - id: micro-behaviors/os/com/invoke::edge-ielevator-interface-guid
  unless:
  - id: metadata/signed/platform/
  - id: well-known/lib/ui/cef::cef-browser-engine
