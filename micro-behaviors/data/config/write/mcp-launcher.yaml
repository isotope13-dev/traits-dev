defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: mcp-package-launcher-near-config-write
    desc: MCP package launcher configuration near file write
    crit: notable
    conf: 0.93
    scope: file
    near_bytes: 2500
    all:
      - id: metadata/file/profile/file-write-api::node-write-file-sync-call
    any:
      - id: metadata/file/profile/agent-config::mcp-package-launcher-configuration
      - id: metadata/file/profile/mcp::remote-mcp-server-over-npx
