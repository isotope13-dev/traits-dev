traits:
- id: claude-autoupdater-disabled
  for:
  - javascript
  - typescript
  - json
  - text
  desc: Assigns disabled Claude updater setting
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: autoUpdaterStatus["']?\s*[=:]\s*["']disabled
  unless:
  - id: metadata/package/testing/presence/path::test-fixture-directory-path
  - id: metadata/package/testing/presence/test-home::test-home-directory-path
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/package/testing/presence/fixture::test-underscore-js-filename
- id: claude-onboarding-complete
  for:
  - javascript
  - typescript
  - json
  - text
  desc: Assigns completed Claude onboarding setting
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: hasCompletedOnboarding["']?\s*[=:]\s*true
composite_rules:
- id: codex-provider-credential-write
  for:
  - javascript
  desc: Codex provider and key fields co-occur with file writes
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/data/llm/wire-marker::model-provider-field
  - id: micro-behaviors/os/env/ai-provider::openai-api-key-name-reference
  - id: micro-behaviors/fs/path/token::codex-auth-json
  - id: micro-behaviors/fs/write/file/full::js-file-write
  unless:
  - id: well-known/tool/detection/
defaults:
  platforms:
  - windows
  - unix
