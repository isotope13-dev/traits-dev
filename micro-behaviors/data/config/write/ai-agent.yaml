traits:
- id: claude-autoupdater-disabled
  for:
  - javascript
  - typescript
  - json
  - text
  desc: Assigns disabled Claude updater setting
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: autoUpdaterStatus["']?\s*[=:]\s*["']disabled
- id: claude-onboarding-complete
  for:
  - javascript
  - typescript
  - json
  - text
  desc: Assigns completed Claude onboarding setting
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: hasCompletedOnboarding["']?\s*[=:]\s*true
- id: claude-trust-dialog-accepted-assignment
  for:
  - javascript
  - typescript
  - json
  - text
  desc: Assigns accepted Claude folder-trust setting
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: hasTrustDialogAccepted["']?\s*[:=]\s*true
- id: claude-md-includes-approved-assignment
  for:
  - javascript
  - typescript
  - json
  - text
  desc: Assigns approved Claude MD-includes setting
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: hasClaudeMdExternalIncludesApproved["']?\s*[:=]\s*true
composite_rules:
- id: codex-provider-credential-write
  for:
  - javascript
  desc: Codex provider and key fields co-occur with file writes
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/data/llm/wire-marker::model-provider-field
  - id: micro-behaviors/os/env/ai-provider::openai-api-key-name-reference
  - id: micro-behaviors/fs/path/token::codex-auth-json
  - id: metadata/file/profile/file-write-context::js-file-write
defaults:
  platforms:
  - windows
  - unix
