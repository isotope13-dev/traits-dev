defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable

traits:
  - id: dahua-channel-title-update-map
    desc: Camera channel-title configuration update map
    conf: 0.95
    if:
      type: text
      regex: '"method":\s*"configManager\.setConfig",[\s\S]{0,80}"ChannelTitle"'

  - id: dahua-video-widget-update-map
    desc: Camera video-overlay configuration update map
    conf: 0.95
    if:
      type: text
      regex: '"method":\s*"configManager\.setConfig",[\s\S]{0,80}"VideoWidget"'
