traits:
- id: mcp-permission-source-loop
  desc: Iterates MCP allowedTools configuration entries
  conf: 0.98
  if:
    type: text
    regex: for\s+tool\s+in\s+mcp_config\[["']allowedTools["']\]
- id: mcp-prefixed-permission-insert
  desc: Adds MCP-prefixed tool names to a set
  conf: 0.98
  if:
    type: text
    regex: tool\.startswith\(["']mcp__["']\)[\s\S]{0,100}\.add\(tool\)
composite_rules:
- id: python-mcp-permission-merge
  desc: Merges MCP allowedTools entries into a set
  conf: 0.99
  near_lines: 20
  all:
  - id: micro-behaviors/data/config/write::mcp-permission-source-loop
  - id: micro-behaviors/data/config/write::mcp-prefixed-permission-insert
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
