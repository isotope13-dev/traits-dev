# Declared provider routing is neutral. A third-party gateway and a subagent
# check establish neither interception, credential theft nor a malicious trigger.
# Preserve the three original evidence sets and format scopes.
defaults:
  platforms: [windows, unix]
composite_rules:
  - id: agent-provider-base-url-subagent-cooccurrence
    desc: Agent provider settings co-occur with subagent instructions
    crit: notable
    conf: 0.99
    for: [markdown, javascript, typescript, python, shell, json]
    all:
      - id: micro-behaviors/fs/path/agent-config/file::ai-agent-config-file-target
      - id: micro-behaviors/os/env/ai-provider::ai-provider-base-url-external-override
      - id: micro-behaviors/os/env/ai-provider::json-env-block-ai-base-url-override
      - id: micro-behaviors/process/create/workers::claude-task-tool-subagent-spawn

  - id: agent-instructions-provider-base-url-setting
    desc: Agent instructions contain external provider settings
    crit: notable
    conf: 0.98
    for: [markdown]
    all:
      - id: metadata/package/agent-skill::agent-instructions-md-basename
      - id: micro-behaviors/fs/path/agent-config/file::ai-agent-config-file-target
      - id: micro-behaviors/os/env/ai-provider::ai-provider-base-url-external-override
      - id: micro-behaviors/os/env/ai-provider::json-env-block-ai-base-url-override

  - id: claude-settings-base-url-subagent-cooccurrence
    desc: Claude settings path, external URL and subagent instructions
    crit: notable
    conf: 0.99
    for: [markdown]
    all:
      - id: micro-behaviors/fs/path/agent-config/file::claude-settings-path-reference
      - id: micro-behaviors/os/env/ai-provider::anthropic-base-url-external-url-assignment
      - id: micro-behaviors/process/create/workers::claude-task-tool-subagent-spawn
      - id: metadata/package/agent-skill::agent-instructions-md-basename
