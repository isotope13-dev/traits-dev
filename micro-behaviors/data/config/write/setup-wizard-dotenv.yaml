# Neutral setup-wizard observation: an interactive CLI wizard (inquirer-style
# prompts) that collects the operator's own answers and writes them to a
# dotenv file. CLIs use this shape to collect the user's own service
# credential at setup time; the operator types their own secret into their own
# terminal, so the write is self-provisioning, not credential theft or
# planting. Backdoored-library and stealer kits do not stop to run an
# interactive questionnaire before writing a dotenv file.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: interactive-prompt-call
    desc: Interactive CLI prompt call
    conf: 0.9
    if:
      type: text
      regex: 'inquirer\.prompt\s*\('
composite_rules:
  - id: setup-wizard-saves-dotenv
    desc: Interactive setup wizard writes dotenv file
    conf: 0.9
    all:
      - id: interactive-prompt-call
      - id: micro-behaviors/fs/path/secret-config::dotenv-filename-literal
      - id: micro-behaviors/fs/write/file/full::js-fs-write-sync
    # No near_* proximity: type:text matches carry string-table coordinates
    # that proximity bucketing cannot span against symbol positions, so
    # co-occurrence in one file is the correlation. The three-leg
    # conjunction (interactive prompt, dotenv path, fs write) is precise
    # without a window.
