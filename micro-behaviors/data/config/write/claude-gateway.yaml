# Endpoint/key assignment, file writing and a branded origin are neutral.
# These composites correlate observations; they do not bind writes to a path
# or establish theft, deception, private-key access or a supply-chain compromise.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: claude-gateway-assignment-write-cooccurrence
    desc: Claude gateway assignments co-occur with file writes
    conf: 0.97
    scope: file
    all:
      - id: micro-behaviors/os/env/ai-provider::js-anthropic-base-url-assignment
      - id: micro-behaviors/os/env/ai-provider::js-anthropic-gateway-credential-assignment
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: micro-behaviors/communications/http/llm::anthropic-branded-off-vendor-origin-literal
    any:
      - id: micro-behaviors/fs/path/agent-config/file::claude-settings-json
      - id: micro-behaviors/data/llm/agent::agent-identity-claude
  - id: npm-claude-code-third-party-gateway-config
    desc: npm CLI contains Claude gateway configuration and file writes
    conf: 0.97
    for: [npm, tar, zip, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/entrypoint::has-bin-field
      - id: micro-behaviors/communications/http/llm::anthropic-branded-off-vendor-origin-literal
      # Modular CLIs keep the origin, configuration merge, and atomic writer
      # in separate modules. Require their roles within the same archive.
      - id: micro-behaviors/os/env/ai-provider::js-anthropic-base-url-assignment
      - id: micro-behaviors/os/env/ai-provider::js-anthropic-gateway-credential-assignment
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: micro-behaviors/data/llm/agent::agent-identity-claude
