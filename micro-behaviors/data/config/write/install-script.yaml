defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

composite_rules:
  - id: claude-tool-hook-config-write-cooccurrence
    desc: Claude hook config paths co-occur with tool hooks and writes
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/path/agent-config/file::claude-hooks-json-path
      - id: micro-behaviors/communications/ipc/agent-hook::agent-tool-hook-config-key
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
