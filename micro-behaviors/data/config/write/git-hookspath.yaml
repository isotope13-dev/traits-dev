defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: git-unsets-hookspath
    desc: Git command removes configured hooksPath
    if:
      type: symbol
      kind: call
      exact: git
      args:
        - kind: identifier
          name: config
        - kind: identifier
          name: --unset-all
        - kind: identifier
          name: core.hooksPath
