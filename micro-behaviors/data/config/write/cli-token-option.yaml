# Neutral configuration-write observation: command guidance pointing a CLI
# `config set` command at a token-bearing option. Vendored CLIs use this shape
# to store the user's own service credential; attack guidance uses the same
# shape to plant a credential before repointing the tool. The instruction
# alone establishes neither. markdown scope: agent-skill files carry these
# commands in fenced install guidance, and SKILL.md members are typed markdown
# or shell by content heuristics, so the instruction should surface under
# either typing.
defaults:
  platforms: [unix, windows]
  for: [shell, markdown]
  crit: notable
traits:
- id: cli-config-set-token-option
  desc: CLI config command sets a token-bearing option
  conf: 0.85
  if:
    type: text
    regex: (?i)\bconfig\s+set\b[^;\r\n]{0,80}\s--(token|auth[-_]token|access[-_]token|api[-_]key)\b
