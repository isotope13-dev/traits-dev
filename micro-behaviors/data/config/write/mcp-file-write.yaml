defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: mcp-config-with-node-file-write
    desc: MCP configuration and Node file writes co-occur
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/write/file/full::node-write-file-promise-destructured
    any:
      - id: micro-behaviors/communications/mcp::mcp-client-config-key--mcp-servers-toml
      - id: micro-behaviors/communications/mcp::mcp-servers-config-key-access
