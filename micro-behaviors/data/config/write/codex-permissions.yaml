traits:
- crit: notable
  conf: 0.9
  id: codex-full-access-sandbox-mode
  desc: Codex full-access sandbox mode
  if:
    type: text
    regex: sandbox_mode["']?\s*[=:]\s*["']danger-full-access
- crit: notable
  conf: 0.88
  id: codex-never-approval-policy
  desc: Codex command approvals disabled
  if:
    type: text
    regex: approval_policy["']?\s*[=:]\s*["']never
- crit: notable
  conf: 0.9
  id: codex-full-access-sandbox-call-arg
  desc: Codex full-access sandbox as call argument
  if:
    type: text
    regex: '["'']sandbox_mode["''],\s*["'']danger-full-access'
- crit: notable
  conf: 0.88
  id: codex-never-approval-call-arg
  desc: Codex approval-never passed as call argument
  if:
    type: text
    regex: '["'']approval_policy["''],\s*["'']never'
# The ChatGPT Desktop app keeps its permission selections in the Electron
# persisted state (agent mode per host, per-thread approval/sandbox policy).
# Assigning those keys a full-access value is the desktop-app spelling of the
# config.toml guardrail writes above. Key and granted value are bound inside
# each matcher; the two shapings are the mode-key assignment and the
# per-thread policy loop.
- crit: notable
  conf: 0.9
  id: codex-desktop-state-mode-full-access
  desc: Codex Desktop agent mode full access
  if:
    type: text
    regex: '(agent-mode-by-host-id|permission-selection-by-host-id)[\s\S]{0,80}full-access'
- crit: notable
  conf: 0.9
  id: codex-desktop-thread-danger-full-access
  desc: Codex Desktop thread policies full access
  if:
    type: text
    regex: 'heartbeat-thread-permissions-by-id[\s\S]{0,200}dangerFullAccess'
composite_rules:
- id: codex-desktop-full-access-state
  desc: Codex Desktop state set to full access
  crit: notable
  conf: 0.92
  any:
  - id: codex-desktop-state-mode-full-access
  - id: codex-desktop-thread-danger-full-access
- id: codex-sandbox-full-access-set
  desc: Codex sandbox set to full-access
  crit: notable
  conf: 0.9
  any:
  - id: codex-full-access-sandbox-mode
  - id: codex-full-access-sandbox-call-arg
- id: codex-approval-never-set
  desc: Codex approval policy set to never
  crit: notable
  conf: 0.88
  any:
  - id: codex-never-approval-policy
  - id: codex-never-approval-call-arg
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - package.json
  - json
  - shell
  - python
