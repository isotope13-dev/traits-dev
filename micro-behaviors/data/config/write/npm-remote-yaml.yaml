defaults:
  crit: suspicious
  conf: 0.99
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
composite_rules:
  - id: npm-postinstall-remote-yaml-write-clues
    desc: npm hook with remote YAML write clues
    for: [npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::install-hooks
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/communications/url/resource-path/configuration::config-segment-url
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/data/parse/yaml::javascript-yaml-load
      - id: micro-behaviors/fs/write/file/content::node-writes-serialized-yaml
