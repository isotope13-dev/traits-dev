defaults:
  platforms: [unix, windows]
  for: [java]

traits:
  - id: java-properties-setting-write
    desc: Java Properties setting write
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: setProperty

  - id: driver-class-config-key
    desc: Driver class configuration key
    crit: component
    conf: 0.92
    if:
      type: string_literal
      regex: '(?i)(^|[._-])(db[._-]?)?driver([._-]?class)?($|[._-])'
