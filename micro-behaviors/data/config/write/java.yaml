defaults:
  platforms: [unix, windows]
  for: [java]

traits:
  - id: java-properties-setting-write
    desc: Java Properties setting write
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: setProperty

  - id: driver-class-config-key
    desc: Driver class configuration key
    crit: component
    conf: 0.92
    if:
      type: string_literal
      # Match configuration-key forms, not a fully-qualified JDBC class such
      # as com.mysql.jdbc.Driver.
      regex: '(?i)^((db|jdbc|database)[._-])?driver([._-]?class([._-]?name)?)?$'

  - id: property-write-before-permission-check
    desc: Property write precedes permission check
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\.setProperty.{0,900}\b(checkPermission|requireAdmin|verifyAuthorization)\w*\s*\('
