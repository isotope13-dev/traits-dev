# Neutral observations relocated during pinned-release triage.
defaults:
  platforms: [unix]
  for: [scripts]
traits:
- id: git-global-hookspath
  desc: Sets global Git core.hooksPath
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bgit\s+config\s+--global\b[^\n]{0,48}\bcore\.hooksPath\b
- id: git-global-templatedir
  desc: Sets global Git init.templatedir
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bgit\s+config\s+--global\b[^\n]{0,48}\binit\.templatedir\b
