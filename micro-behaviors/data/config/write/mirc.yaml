defaults:
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, binaries, objectivec, lua, data, dos_com]
traits:
  - id: mirc-writeini-command
    desc: Detects mIRC writeini command
    crit: notable
    if:
      type: text
      case_insensitive: true
      substr: /writeini

  - id: mirc-enable-remote-scripts
    desc: mIRC command enables remote event scripts
    for: [text, mirc]
    platforms: [windows]
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^n\d+=/\.?remote[ \t]+on[ \t]*\r?$'
