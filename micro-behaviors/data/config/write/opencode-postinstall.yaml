defaults:
  platforms: [unix, windows]
  for: [shell, javascript, package.json]
composite_rules:
  - id: postinstall-opencode-config-write-clues
    desc: Postinstall file and OpenCode config write clues
    crit: notable
    conf: 0.97
    for: [javascript]
    scope: file
    all:
      - id: metadata/package/files/lifecycle::postinstall-js-file
      - id: micro-behaviors/fs/path/agent-config/file::opencode-config-json-path
      - id: micro-behaviors/fs/write/file/content::node-write-file-promise-destructured
  - id: postinstall-plugin-path-write-clues
    desc: Postinstall file with plugin path write clues
    crit: notable
    conf: 0.96
    for: [javascript]
    scope: file
    near_bytes: 4096
    all:
      - id: metadata/package/files/lifecycle::postinstall-js-file
      - id: micro-behaviors/fs/path/construct::node-join-plugins-directory
      - id: micro-behaviors/fs/write/file/content::node-write-file-promise-destructured
  - id: npm-postinstall-opencode-config-plugin-clues
    desc: npm postinstall with agent config and plugin
    crit: suspicious
    conf: 0.98
    for: [npm, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/data/config/write::postinstall-opencode-config-write-clues
      - id: micro-behaviors/data/config/write::postinstall-plugin-path-write-clues
