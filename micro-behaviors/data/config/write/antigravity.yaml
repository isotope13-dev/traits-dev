defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: antigravity-eager-execution-assignment
    desc: Assigns Antigravity eager execution policy
    if:
      type: text
      regex: '\["autoExecutionPolicy"\]\s*=\s*"[^"]{0,40}AUTO_EXECUTION_EAGER"'

  - id: agent-sandbox-disabled-config
    desc: Sets sandboxMode false in Python configuration
    if:
      type: text
      regex: '["'']sandboxMode["'']\s*:\s*False\b'
