defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.98

traits:
  - id: wordpress-update-option
    desc: Writes a WordPress configuration option
    if:
      type: symbol
      kind: call
      exact: update_option

  - id: wordpress-stores-created-user-id
    desc: Stores newly created user ID in option
    # Bind the option value to the account-creation result. Co-occurrence with
    # an unrelated user creation or a reassigned local does not establish this.
    # Provisioning can legitimately retain an account ID; this is not hostile.
    if:
      type: symbol
      kind: call
      exact: update_option
      arg:
        index: 1
        from:
          call: '^wp_(create|insert)_user$'
