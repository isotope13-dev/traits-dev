defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.98

traits:
  - id: wordpress-update-option
    desc: Writes a WordPress configuration option
    if:
      type: symbol
      kind: call
      exact: update_option

  - id: wordpress-stores-created-user-id
    desc: Stores newly created user ID in option
    # Bind the option value to the account-creation result. Co-occurrence with
    # an unrelated user creation or a reassigned local does not establish this.
    # Provisioning can legitimately retain an account ID; this is not hostile.
    if:
      type: symbol
      kind: call
      exact: update_option
      arg:
        index: 1
        from:
          call: '^wp_(create|insert)_user$'

  - id: wordpress-stores-response-command
    desc: Stores decoded response command in option
    conf: 0.85
    # A command, cmd, or task field of a decoded reply is persisted for a later
    # run. Settings code can store reply fields, so this is only a clue.
    if:
      type: text
      regex: 'update_option\s*\([^,]{1,50},\s*(\(string\)\s*)?\$\w{1,20}\[\s*.(cmd|command|task)'
