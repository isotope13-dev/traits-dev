defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # These config.get calls establish reads, rather than field declarations.
  - id: javascript-telegram-bot-setting-read
    desc: JavaScript reads Telegram bot settings
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: config.get
      arg:
        kind: string
        regex: '^telegram(BotToken|ChatId)$'

  - id: javascript-telegram-opt-in-setting-read
    desc: JavaScript reads Telegram opt-in setting
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: config.get
      arg:
        kind: string
        exact: telegramEnabled
