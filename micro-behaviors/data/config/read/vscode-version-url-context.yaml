# Source co-occurrence does not prove a private update channel.
defaults:
  platforms: [unix, windows]
  for: [vsix, zip]

composite_rules:
  - id: vscode-version-access-and-manifest-url
    desc: Version access alongside version-manifest URL
    crit: notable
    conf: 0.88
    scope: archive
    for: [vsix, zip, package.json, javascript]
    all:
      - id: metadata/package/runtime::vscode-extension
      - id: micro-behaviors/data/config/read::vscode-extension-manifest-version-syntax
      - id: micro-behaviors/communications/http/url/api-path::version-manifest-url
