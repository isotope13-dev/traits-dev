defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # Reads the project's own dependency manifest (package.json
  # devDependencies) to introspect the local project -- framework detection,
  # scaffolders, audit tooling. Relocated from
  # objectives/exfiltration/http/report (as js-node-infrastructure-profile),
  # where every dependency read rendered as exfiltration staging. Sending the
  # profile remotely is a separate claim made by the consuming composite, not
  # by this read.
  - id: node-project-dependency-read
    desc: Reads project devDependencies manifest
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'process\.cwd\(\)[\s\S]{0,500}readFileSync[\s\S]{0,220}devDependencies'
