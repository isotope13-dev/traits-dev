defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # Reads the project's own dependency manifest (package.json
  # devDependencies) to introspect the local project -- framework detection,
  # scaffolders, audit tooling. Relocated from
  # objectives/exfiltration/http/report (as js-node-infrastructure-profile),
  # where every dependency read rendered as exfiltration staging. Sending the
  # profile remotely is a separate claim made by the consuming composite, not
  # by this read.
  - id: node-project-dependency-read
    desc: Reads project devDependencies manifest
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'process\.cwd\(\)[\s\S]{0,500}readFileSync[\s\S]{0,220}devDependencies'

  # Reading a package manifest is a neutral capability; enumerating its
  # development-dependency keys is a more specific form used by inventory
  # scripts. The consumer supplies any collection or transfer intent.
  - id: node-project-dev-dependency-enumeration
    desc: Enumerates package devDependencies
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bObject\.(keys|entries)\s*\(\s*[\w$.]+(\.|\[\s*[''"])devDependencies\b'

  - id: node-project-dependency-enumeration
    desc: Enumerates package dependencies
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bObject\.(keys|entries)\s*\(\s*[\w$.]+(\.|\[\s*[''"])dependencies\b'

composite_rules:
  - id: node-package-dependency-inventory
    desc: Enumerates runtime and development dependencies
    crit: notable
    conf: 0.98
    near_bytes: 300
    all:
      - id: node-project-dependency-enumeration
      - id: node-project-dev-dependency-enumeration
