defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: python-manifest-urlopen-error-handler
    desc: Manifest URL fetch with exception handler
    crit: notable
    conf: 0.96
    # Bind the manifest URL to the request within this function's try block.
    # A job downloader beside a separate argument-manifest writer is unrelated.
    if:
      type: tree-sitter
      query: |
        ((function_definition body: (block
          (expression_statement (assignment
            left: (identifier) @url right: (string) @manifest))
          (try_statement body: (block
            (with_statement (with_clause (with_item value: (as_pattern
              (call function: (attribute) @fetch
                arguments: (argument_list . (identifier) @requested)))))))
            (except_clause)))) @handler
          (#match? @manifest "manifest\\.json")
          (#eq? @url @requested)
          (#match? @fetch "(^|\\.)urlopen$"))
