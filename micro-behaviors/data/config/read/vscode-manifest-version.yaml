defaults:
  platforms: [unix, windows]
traits:
  - id: vscode-extension-manifest-version-syntax
    desc: Extension lookup near manifest version access
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'getExtension\([^)]{0,60}\)[^;\n]{0,40}\.packageJSON\.version'

