# Evidence-specific placement; matching does not imply attacker intent.
traits:
- id: openwrt-uci-export-command
  desc: OpenWrt UCI export command
  if:
    type: text
    regex: \buci\s+export\b
- id: openwrt-uci-show-command
  desc: OpenWrt UCI show command
  if:
    type: text
    regex: \buci\s+show\b
defaults:
  platforms:
  - openwrt
  for:
  - scripts
  - binaries
  - pyc
  - source
  crit: notable
  conf: 0.88
