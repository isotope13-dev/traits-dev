# A bare get_model_config() call reads a model's configuration object; the
# helper name is shared across the pydantic ecosystem (vendored compat
# shims define their own), so it establishes no product identity on its own.
# Relocated from well-known/lib/ai/ultralytics (as model-config-call), where
# it misattributed any same-named helper to Ultralytics.
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.98
  size_max: 5000000
traits:
- id: get-model-config-call
  desc: Calls get_model_config helper
  if:
    type: symbol
    kind: call
    regex: '(^|\.)get_model_config$'
