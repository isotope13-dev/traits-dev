# A missing-field diagnostic records a value lookup, not a declared schema.
defaults:
  for: [elf, macho, pe]
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.96
traits:
  - id: metadata-website-lookup-diagnostic
    desc: Metadata website field lookup diagnostic
    if:
      type: hex
      section: any
      pattern: 4E 6F 20 77 65 62 73 69 74 65 20 66 6F 75 6E 64 20 69 6E 20 6D 65 74 61 64 61 74 61
