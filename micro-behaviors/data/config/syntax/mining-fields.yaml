defaults:
  platforms: [unix, windows]
  for: [scripts, pe, elf, macho, data]
  conf: 0.9
traits:
  - id: json-pools-array-field
    desc: JSON pools-array configuration key
    crit: notable
    if:
      type: text
      regex: '"pools"\s*:\s*\['
  - id: json-donate-level-field
    desc: JSON donation-level configuration key
    crit: notable
    if:
      type: text
      regex: '"donate-level"\s*:'
