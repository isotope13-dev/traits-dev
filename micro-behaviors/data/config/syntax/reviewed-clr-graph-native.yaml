traits:
- id: xmrig-embedded-pools-config
  desc: Embedded JSON mining-pool configuration array
  if:
    type: raw
    regex: '"pools"\s*:\s*\[\s*\{\s*"(algo|coin|url)"'
- id: xmrig-donate-level-zero-config
  desc: Embedded JSON donate-level setting equals zero
  if:
    type: raw
    regex: '"donate-level"\s*:\s*0\b'
defaults:
  platforms:
  - windows
  - unix
  for:
  - elf
  - pe
  - macho
  crit: notable
  conf: 0.9
