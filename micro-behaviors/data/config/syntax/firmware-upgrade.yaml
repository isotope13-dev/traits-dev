# Metadata fields of the MicroHard IPx21-family firmware upgrade package
# format: a `lockfile` member whose LOCK_NAME the installer compares
# against the device product string, and a `file` member naming the inner
# archive applied to the root filesystem. Both names are fixed by the
# installer, in the shipped package and in any builder for it.
defaults:
  platforms: [unix]
  for: [scripts, source, text]
  crit: notable
  conf: 0.95

traits:
  - id: upgrade-lock-name-field
    desc: Firmware upgrade LOCK_NAME field assignment
    if:
      type: text
      regex: '\bLOCK_NAME\s*='

  - id: upgrade-inner-archive-name
    desc: Firmware upgrade inner archive filename
    if:
      type: text
      substr: upgradepkg.tar
