# Fixed schema elements, upload handler parameters, and integrity secret of the
# Barracuda Backup2 / bayesian_upload archive format (`backup.xml`, `Spam_Config`,
# `pu_bayesian_upload`, and the hardcoded MD5 salt in `Backup2.pm`).
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]
  crit: notable

traits:
  - id: barracuda-backup-spam-config-manifest
    desc: Backup XML Spam_Config component
    conf: 0.96
    for: [scripts, source, xml, tar, text]
    if:
      type: text
      regex: '<component\s+name\s*=\s*["'']Spam_Config["'']'

  - id: barracuda-backup-mysql-file-entry
    desc: Backup XML mysql checksum entry
    conf: 0.96
    for: [scripts, source, xml, tar, text]
    if:
      type: text
      regex: '<file\s+[^>]{0,120}\bid\s*=\s*["'']mysql["''][^>]{0,160}\bchecksum\s*='

  - id: barracuda-bayesian-upload-action
    desc: CGI pu_bayesian_upload parameter
    conf: 0.96
    if:
      type: text
      word: pu_bayesian_upload

  - id: barracuda-bayesian-upload-field
    desc: Multipart bayesian upload field
    conf: 0.92
    if:
      type: text
      regex: 'name\s*=\s*\\?["'']bayesian\\?["'']|["'']bayesian["'']\s*([:=,)]|=>)|-F\s*["'']?bayesian\s*='

  - id: barracuda-backup-checksum-secret
    desc: Barracuda Backup2 checksum secret
    conf: 0.99
    if:
      type: text
      substr: Barracuda Networks is your new best friend

composite_rules:
  - id: barracuda-backup-md5-checksum
    desc: Computes MD5 with Barracuda backup secret
    crit: suspicious
    conf: 0.98
    for: [scripts, source]
    all:
      - id: barracuda-backup-checksum-secret
    any:
      - id: micro-behaviors/crypto/hash/digest/md5/
      - id: micro-behaviors/crypto/hash/digest/unnamed-algorithm::source-digest-call
