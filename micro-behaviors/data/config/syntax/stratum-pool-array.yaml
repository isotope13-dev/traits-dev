defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.96

composite_rules:
  - id: stratum-pool-array-references
    desc: Pool-array JSON with Stratum references
    # These references coexist; neither data flow, XMRig identity nor
    # unauthorized mining follows from a pool key and a URL scheme.
    all:
      - id: micro-behaviors/data/config/syntax::json-pools-array-field
    any:
      - id: micro-behaviors/communications/rpc::stratum-subscribe-method
      - id: micro-behaviors/communications/url/scheme::stratum-tcp-url
      - id: micro-behaviors/communications/url/scheme::stratum-ssl-url
    needs: 1
