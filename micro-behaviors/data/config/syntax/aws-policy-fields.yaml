defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.97

traits:
  # The Action field alone does not establish an Allow effect or grant.
  - id: s3-wildcard-action-field
    desc: AWS S3 wildcard action field text
    if:
      type: text
      regex: '(?i)["'']Action["'']?\s*:\s*(["'']s3:\*["'']|\[[^\]]{0,160}["'']s3:\*["''])'
    unless:
      # A copy of AWS's own managed-policy catalog contains every permissive
      # grant AWS publishes; shipping the reference data is not making the grant.
      - id: metadata/file/catalog/policy::aws-managed-policy-catalog
      # Schema definitions/examples documenting `s3:*` actions are not grants.
      - id: metadata/file/format/structured::json-schema-document

  # This names the condition key but does not prove how a statement uses it.
  # Some wildcard-principal policies use it for deny-unless-TLS controls, so
  # objectives that infer intent from a wildcard principal exclude this context.
  - id: aws-secure-transport-condition-key
    desc: AWS SecureTransport condition key text
    if:
      type: text
      regex: '(?i)"aws:SecureTransport"'

  # In AWS KMS key policies, a wildcard principal paired with a CallerAccount,
  # PrincipalAccount, or PrincipalOrgID condition scopes access to the named
  # account or organization rather than granting open access.
  - id: aws-caller-account-condition-key
    desc: AWS CallerAccount condition key text
    if:
      type: text
      regex: '(?i)"(kms:CallerAccount|aws:PrincipalAccount|aws:PrincipalOrgID)"'
