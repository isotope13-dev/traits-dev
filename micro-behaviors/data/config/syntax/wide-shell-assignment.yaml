defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: wide-shell-executable-value
    desc: UTF-16 Shell assignment names an EXE-like value
    crit: notable
    conf: 0.95
    if:
      # Short multiline UTF-16 strings can be absent from the decoded-text
      # view. Match their actual assignment syntax, with no execution claim.
      type: yara
      source: |
        rule wide_shell_executable_value {
          strings:
            $assignment = /\bShell[ \t]*=[ \t]*[a-zA-Z0-9_.$-]{1,64}\.(exe|com|bat)/ wide nocase
          condition:
            $assignment
        }
