---
defaults:
  platforms:
  - unix
  for:
  - scripts
  - binaries
traits:
- id: port-directive-line
  desc: Configuration Port directive
  crit: component
  conf: 0.75
  if:
    type: text
    regex: "(?mi)^\\s*Port\\s+[1-9][0-9]{1,4}\\s*(#[^\\n]{0,120})?\\s*$"
- id: login-url-config-key
  desc: Login URL configuration key
  crit: notable
  conf: 0.9
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: "(?i)[A-Za-z0-9_$]*LOGIN[_-]?URL[A-Za-z0-9_]*"
- id: oidc-logout-url-config-key
  desc: Logout URL configuration key
  crit: notable
  conf: 0.9
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: "(?i)[A-Za-z0-9_$]*LOGOUT[_-]?URL[A-Za-z0-9_]*"
composite_rules:
- id: oidc-login-logout-url-config-context
  desc: Login and logout URLs configured
  crit: exception
  conf: 0.96
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  near_bytes: 1024
  all:
  - id: micro-behaviors/data/config/syntax::login-url-config-key
  - id: micro-behaviors/data/config/syntax::oidc-logout-url-config-key
