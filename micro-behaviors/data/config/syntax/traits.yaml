defaults:
  platforms: [unix]
  for: [scripts, binaries]
traits:
- id: port-directive-line
  desc: Configuration Port directive
  crit: component
  conf: 0.75
  if:
    type: text
    regex: '(?mi)^\s*Port\s+[1-9][0-9]{1,4}\s*(#[^\n]{0,120})?\s*$'

- id: service-endpoint-key
  desc: Service endpoint configuration key
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  if:
    type: string_literal
    # Identifier shape avoids matching prose while covering product-specific
    # endpoint, base_url, and server_url configuration keys.
    regex: '(?i)^[a-z][a-z0-9.]*([_-][a-z0-9]+){1,8}[_-](endpoint|base_url|server_url)$'

# An identity provider's configured sign-in/out URLs (`ZITADEL_OIDC_
# DEFAULTLOGOUTURLV2`, Auth0 `logoutUrl`, Keycloak `logout-url`): declaring
# where the provider sends a user is ordinary SSO configuration, not a
# navigation target. The identifier-bounded match keeps prose ("logout URL")
# out while covering SNAKE, camel and kebab spellings.
- id: oidc-login-url-config-key
  desc: Login URL configuration key
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  if:
    type: text
    regex: '(?i)[A-Za-z0-9_$]*LOGIN[_-]?URL[A-Za-z0-9_]*'
- id: oidc-logout-url-config-key
  desc: Logout URL configuration key
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  if:
    type: text
    regex: '(?i)[A-Za-z0-9_$]*LOGOUT[_-]?URL[A-Za-z0-9_]*'

composite_rules:
  # A file that declares both sides of an identity provider's sign-in/out
  # pair (Zitadel's DEFAULTLOGINURLV2 beside DEFAULTLOGOUTURLV2) is
  # configuring the provider, not choosing a navigation destination at run
  # time. Requiring the pair keeps a lone logout-URL string -- the shape a
  # query-driven redirector also holds -- scoring.
  - id: oidc-login-logout-url-config-context
    desc: Login and logout URLs configured
    crit: exception
    conf: 0.96
    platforms: [windows, unix]
    for: [javascript, typescript, html]
    near_bytes: 1024
    all:
      - id: oidc-login-url-config-key
      - id: oidc-logout-url-config-key
