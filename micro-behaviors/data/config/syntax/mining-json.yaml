defaults:
  platforms:
  - windows
  - unix
  for:
  - elf
  - pe
  - macho
traits:
- id: monero-shaped-json-user-field
  desc: JSON user field contains a Monero-shaped address
  crit: notable
  conf: 0.9
  if:
    type: raw
    regex: '"user"\s*:\s*"[48][0-9AB][1-9A-HJ-NP-Za-km-z]{93}"'
- id: cryptonight-json-algorithm
  desc: Embedded JSON names a cn/* mining algorithm
  crit: notable
  conf: 0.88
  if:
    type: raw
    regex: '"algo"\s*:\s*"cn/'
composite_rules:
- id: wallet-json-donations-disabled
  desc: Wallet-shaped JSON user and disabled donations co-occur
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/data/config/syntax::monero-shaped-json-user-field
  - id: micro-behaviors/data/config/syntax::xmrig-donate-level-zero-config
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: cryptonight-pool-json
  desc: Embedded pool array and CryptoNight algorithm JSON
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/data/config/syntax::xmrig-embedded-pools-config
  - id: micro-behaviors/data/config/syntax::cryptonight-json-algorithm
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
