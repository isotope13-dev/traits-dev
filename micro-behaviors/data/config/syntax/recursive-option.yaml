# Code-forge subject review; original matchers and effective defaults preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - ruby
  crit: notable
traits:
- id: recursive-option-enabled-text
  desc: Text enabling a recursive option
  crit: component
  conf: 0.9
  for:
  - scripts
  - source
  - binaries
  - github-actions
  if:
    type: text
    regex: \brecursive["'`]?\s*(=|:)\s*["'`]?(1|true)\b
