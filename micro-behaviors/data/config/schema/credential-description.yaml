defaults:
  platforms: [unix, windows]
traits:
- id: credential-description-field
  unless:
    - id: metadata/package/testing/corpus::inert-security-input-module
  for: [scripts, source]
  desc: Description field mentions credential terms
  crit: notable
  conf: 0.95
  # `[^"\n]` keeps the credential word inside the description string. With a
  # bare `.` the window ran past the closing quote into the next field, so an
  # ordinary command table (`description:"Set a context variable",usage:"set
  # <key> <value>"`) read as a secret-pattern catalog entry.
  if:
    type: text
    # Trailing `([^-]|$)`: hyphenated compounds ("token-owned",
    # "secret-sharing", "password-protected") name concepts, not credential
    # material. The exclusion must live here, not in `not:` — a `not` pattern
    # only sees the `if` match span, which ends at the keyword, so anything
    # past it (like `-owned`) is invisible there.
    regex: '(?i)description:\s*"[^"\n]{0,80}(secret|token|key|password)\b([^-]|$)'
  not:
    # Design-system vocabulary is not credential vocabulary: "gap token" and
    # "semantic foreground tokens" describe design tokens in component
    # catalogs, not authentication material.
    - regex: '(?i)(design|radius|gap|space|semantic)[ -]?tokens?'
    # An object or table key is not a credential either: "{ key, label }"
    # destructuring and column keys ("{ key} entries") name data fields.
    - regex: '\{\s*key\b'
    # A word token is not an auth token: line-breaking prose ("an over-long
    # unbroken token may break") describes text layout, not credentials.
    - regex: '(?i)unbroken[\s-]+tokens?\b'
