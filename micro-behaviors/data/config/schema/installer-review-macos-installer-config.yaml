defaults:
  for: [plist]
  platforms: [macos]
traits:
- id: installer-redirect-banner
  desc: Banner jump URL field
  crit: baseline
  if:
    type: value
    path: "BannerJumpURL"
- id: installer-redirect-code
  desc: Install jump-code field
  crit: baseline
  if:
    type: value
    path: "InstallJumpCode"
- id: bugsplat-reporting
  desc: BugSplat server URL field
  crit: baseline
  if:
    type: value
    path: "BugsplatServerURL"
- id: auto-download-launch--1
  desc: Numeric auto-download-on-launch option
  crit: notable
  conf: 1.0
  if:
    type: value
    path: "AllowedDownloadImmediatelyWhenApplicationLaunch"
    exact: '1'
- id: auto-download-launch--true
  desc: Boolean auto-download-on-launch option
  crit: notable
  conf: 1.0
  if:
    type: value
    path: "AllowedDownloadImmediatelyWhenApplicationLaunch"
    exact: 'true'
composite_rules:
- id: auto-download-launch
  desc: Auto-download-on-launch setting enabled
  crit: notable
  conf: 1.0
  any:
  - id: micro-behaviors/data/config/schema::auto-download-launch--1
  - id: micro-behaviors/data/config/schema::auto-download-launch--true
