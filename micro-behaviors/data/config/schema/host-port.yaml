defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: javascript-host-port-object
    desc: Object declaration contains host or port field
    conf: 0.86
    if:
      type: text
      regex: '(?i)(const|let|var)\s+[A-Za-z_$][A-Za-z0-9_$]*\s*=\s*\{[^}]{0,220}\b(hostname|port)\s*:'
