# Uppercase configuration labels: `NAME =` / `NAME:` assignments whose
# identifier is a conventional SCREAMING_CASE settings key. The matcher proves
# only that a config-shaped constant of that name is assigned -- URL parsers,
# lockfile writers and ordinary settings modules all produce them. Composites
# such as objectives/anti-static/obfuscation/payload/config/ supply the intent
# by pairing a label with an encoded value on the same span.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: component
  conf: 0.6

traits:
  - id: uppercase-auth-assignment-label
    desc: Uppercase AUTH assignment label
    if:
      type: text
      regex: '\bAUTH(_[A-Z0-9_]{1,48})?\s*[:=]'

  - id: uppercase-host-assignment-label
    desc: Uppercase HOST assignment label
    for: [python, javascript, typescript, ruby, php]
    if:
      type: text
      regex: '\bHOST(_[A-Z0-9_]{1,48})?\s*[:=]'

  - id: uppercase-platform-assignment-label
    desc: Uppercase PLATFORM assignment label
    for: [python, javascript, typescript, ruby, php]
    # Anchored to an assignment or key-value colon. A bare `PLATFORM` substring
    # matched Bundler's `add_section("PLATFORMS", ...)` lockfile writer, which
    # is a section heading, not a configuration key.
    if:
      type: text
      regex: '\bPLATFORM(_[A-Z0-9_]{1,48})?\s*[:=]'
