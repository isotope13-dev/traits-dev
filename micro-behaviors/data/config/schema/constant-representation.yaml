defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - ruby
  - php
  - go
  - rust
traits:
- for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: api-named-byte-array-const--rx-3
  desc: DOMAIN identifier with encoded value
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bDOMAIN(_[A-Z0-9_]+)?\s*[:=]\s*(\[|Uint8Array)


- for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: arch-keyed-hex-blob-dict--rx-15
  desc: Quoted android platform dict key
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?m)(^|[{,])\s*["']android["']\s*(:|=>)
- for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: arch-keyed-hex-blob-dict--rx-19
  desc: arm64 architecture config key marker
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '["'']arm64["'']\s*(=>|:\s*\[|:\s*0x)'
- for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: macos-platform-config-key
  desc: macOS platform config key marker
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: macos
composite_rules:
- id: byte-array-config-cooccurrence
  desc: Config names co-occur with byte-array literals
  crit: notable
  conf: 0.92
  any:
  - id: micro-behaviors/data/config/schema::config-label-near-byte-array
  - id: micro-behaviors/data/encode/hex::arch-keyed-hex-blob-dict
  - id: micro-behaviors/data/encode/hex::cred-named-hex-string-const
- id: config-and-codec-cooccurrence
  desc: Config constants with encoding or decoding APIs
  crit: notable
  conf: 0.97
  size_max: 50000
  all:
  - id: micro-behaviors/data/config/schema::byte-array-config-cooccurrence
  any:
  - id: metadata/lang/encoding/hex::js-dense-hex-escapes
  - id: micro-behaviors/data/decode/hex::python-fromhex
- for:
  - python
  - javascript
  - typescript
  id: byte-array-constructor-group
  desc: Byte-array literal constructor reference
  crit: notable
  conf: 0.92
  any:
  - id: micro-behaviors/data/buffer/alloc::js-uint8array-list-constructor
  - id: micro-behaviors/data/buffer/alloc::js-buffer-from-int-list
  - id: micro-behaviors/data/buffer/alloc::python-bytes-list-constructor
- for:
  - python
  - javascript
  - typescript
  - scripts
  id: config-label-near-byte-array
  desc: Config identifier near a byte-array literal
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/data/config/schema::byte-array-constructor-group
  any:
  - id: metadata/lang/source/syntax/assignment/name::endpoint-named-assignment
  - id: micro-behaviors/data/config/schema::api-named-byte-array-const--rx-3
  - id: "metadata/lang/source/shape::schema-named-array-initializer"
  - id: "metadata/lang/source/shape::target-named-array-initializer"
  - id: metadata/lang/source/syntax/assignment/name::uppercase-token-equals-label
  - id: metadata/lang/source/syntax/key-value::uppercase-token-colon-label
  - id: micro-behaviors/data/config/schema::uppercase-auth-assignment-label
  near_bytes: 384
- for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: schema-endpoint-label-cooccurrence
  desc: Schema and endpoint component assignment labels
  crit: notable
  conf: 0.92
  all:
  - id: "metadata/lang/source/shape::schema-named-array-initializer"
  any:
  - id: metadata/lang/source/syntax/assignment/name::endpoint-named-assignment
  - id: micro-behaviors/data/config/schema::api-named-byte-array-const--rx-3
  - id: micro-behaviors/data/config/schema::uppercase-host-assignment-label
