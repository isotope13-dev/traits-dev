defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - ruby
  - php
  - go
  - rust
traits:
- for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: api-named-byte-array-const--rx-2
  desc: ENDPOINT identifier (config name)
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bENDPOINT(_[A-Z0-9_]+)?\s*[:=]
- for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: api-named-byte-array-const--rx-3
  desc: DOMAIN identifier with encoded value
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bDOMAIN(_[A-Z0-9_]+)?\s*[:=]\s*(\[|Uint8Array)
- for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: api-named-byte-array-const--rx-4
  desc: SCHEMA identifier (config name)
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bSCHEMA(_[A-Z0-9_]+)?\s*[:=]
  not:
  - regex: \bSCHEMA[A-Z0-9_]*_SYMBOL\b
- for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: api-named-byte-array-const--rx-5
  desc: TARGET identifier (config name)
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bTARGET(_[A-Z0-9_]+)?\s*[:=]
- for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: api-named-byte-array-const--rx-7
  desc: TOKEN := assignment (config-style)
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \bTOKEN\s*[:=]
- for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: arch-keyed-hex-blob-dict--rx-15
  desc: Quoted android platform dict key
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?m)(^|[{,])\s*["']android["']\s*(:|=>)
- for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: arch-keyed-hex-blob-dict--rx-18
  desc: amd64 architecture config key marker
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '(?m)(["'']?amd64["'']?)\s*:'
- for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: arch-keyed-hex-blob-dict--rx-19
  desc: arm64 architecture config key marker
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '["'']arm64["'']\s*(=>|:\s*\[|:\s*0x)'
- for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: arch-keyed-hex-blob-dict--rx-21
  desc: Regex component marker
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: macos
composite_rules:
- id: byte-array-config-cooccurrence
  desc: Config names co-occur with byte-array literals
  crit: notable
  conf: 0.92
  any:
  - id: micro-behaviors/data/config/schema::config-label-near-byte-array
  - id: micro-behaviors/data/encode/hex::arch-keyed-hex-blob-dict
  - id: micro-behaviors/data/encode/hex::cred-named-hex-string-const
- id: config-and-codec-cooccurrence
  desc: Config constants with encoding or decoding APIs
  crit: notable
  conf: 0.97
  size_max: 50000
  all:
  - id: micro-behaviors/data/config/schema::byte-array-config-cooccurrence
  any:
  - id: micro-behaviors/data/encode/hex::js-dense-hex-escapes
  - id: micro-behaviors/data/decode/hex::python-fromhex
- for:
  - python
  - javascript
  - typescript
  id: byte-array-constructor-group
  desc: Byte-array literal constructor reference
  crit: notable
  conf: 0.92
  any:
  - id: micro-behaviors/data/buffer/alloc::js-uint8array-list-constructor
  - id: micro-behaviors/data/buffer/alloc::js-buffer-from-int-list
  - id: micro-behaviors/data/buffer/alloc::python-bytes-list-constructor
- for:
  - python
  - javascript
  - typescript
  - scripts
  id: config-label-near-byte-array
  desc: Config identifier near a byte-array literal
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/data/config/schema::byte-array-constructor-group
  any:
  - id: micro-behaviors/data/config/schema::api-named-byte-array-const--rx-2
  - id: micro-behaviors/data/config/schema::api-named-byte-array-const--rx-3
  - id: micro-behaviors/data/config/schema::api-named-byte-array-const--rx-4
  - id: micro-behaviors/data/config/schema::api-named-byte-array-const--rx-5
  - id: micro-behaviors/data/config/schema::api-named-byte-array-const--rx-7
  - id: micro-behaviors/data/config/schema::uppercase-auth-assignment-label
  near_bytes: 384
- for:
  - python
  - javascript
  - typescript
  - ruby
  - php
  id: schema-endpoint-label-cooccurrence
  desc: Schema and endpoint component assignment labels
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/data/config/schema::api-named-byte-array-const--rx-4
  any:
  - id: micro-behaviors/data/config/schema::api-named-byte-array-const--rx-2
  - id: micro-behaviors/data/config/schema::api-named-byte-array-const--rx-3
  - id: micro-behaviors/data/config/schema::uppercase-host-assignment-label
