defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
- id: connection-defaults-config-merge
  desc: Merges default connection configuration
  conf: 0.98
  if:
    type: text
    regex: '\.\.\.DEFAULT_CONNECTION_CONFIG\s*,\s*\.\.\.config\b'

  # A low-level `iq` stanza against the `newsletter` namespace carrying a
  # subscribe tag. The public `newsletterFollow(jid)` helper builds this
  # internally, so user-driven follows show the helper call; injected
  # auto-follows hand-roll the stanza to stay off the usual call graph.
  # Neutral on its own: any newsletter client subscribes.
