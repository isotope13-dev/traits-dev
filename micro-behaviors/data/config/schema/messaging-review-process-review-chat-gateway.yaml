defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, shell, python]
  crit: notable
  conf: 0.88

traits:
- id: agent-gateway-setting-key
  desc: Agent gateway configuration key
  crit: notable
  conf: 0.9
  for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
  if:
    type: text
    regex: '(?i)["'']?(agent|assistant)[_-]?gateway["'']?\s*[:=]'

  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog
- id: control-channel-setting-key
  desc: Control-channel configuration key
  crit: notable
  conf: 0.9
  for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
  if:
    type: text
    regex: '["'']?(operator|control)[_-]?channel["'']?\s*[:=]'

composite_rules:
- id: agent-gateway-messaging-settings
  desc: Agent gateway settings with messaging indications
  crit: notable
  conf: 0.92
  for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
  all:
  - id: micro-behaviors/data/config/schema::agent-gateway-setting-key
  any:
  - id: micro-behaviors/data/config/schema::control-channel-setting-key
  - id: micro-behaviors/communications/messaging/service-reference::chat-service-domain-reference
  - id: micro-behaviors/communications/messaging/service-reference::whatsapp-or-matrix-name-reference
  - id: micro-behaviors/communications/messaging/service-reference::signal-service-name-reference
  - id: micro-behaviors/data/collection/map::quoted-email-field-key
  - id: micro-behaviors/communications/http/webhook::webhook-configuration-key
  - id: micro-behaviors/communications/http/webhook::webhook-registration-call
  - id: micro-behaviors/communications/http/webhook::webhook-route-declaration
    # A minified bundle may be one multi-megabyte line. Byte proximity keeps
    # unrelated payment gateway settings and chat integrations from joining.
  near_bytes: 800

  # Proximity is in bytes, not lines: a minified bundle is a handful of
  # 700 KB lines, so `near_lines` put the whole file in one window and let a
  # chat URL anywhere pair with a receive verb anywhere.
