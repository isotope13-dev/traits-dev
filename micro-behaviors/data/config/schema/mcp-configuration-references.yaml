# These fields describe configuration; they do not establish a launched process.
---
defaults:
  for:
  - javascript
  - typescript
  - python
  - lua
  - markdown
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: mcp-stdio-connection-type-field
  desc: Configuration selects stdio connection type
  crit: notable
  conf: 0.97
  for:
  - text
  - data
  - scripts
  - source
  if:
    type: text
    regex: '["'']connection_type["'']\s*:\s*["'']stdio["'']'
- id: mcp-stdio-config-command-field
  desc: stdio_config command field
  crit: notable
  conf: 0.97
  for:
  - text
  - data
  - scripts
  - source
  if:
    type: text
    regex: '["'']stdio_config["'']\s*:\s*\{[^{}]{0,400}["'']command["'']\s*:'
- id: mcp-stdio-config-args-field
  desc: stdio_config argument field
  crit: notable
  conf: 0.97
  for:
  - text
  - data
  - scripts
  - source
  if:
    type: text
    regex: '["'']stdio_config["'']\s*:\s*\{[^{}]{0,600}["'']args["'']\s*:'
