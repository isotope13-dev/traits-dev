defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: javascript-telegram-enabled-field
    desc: Telegram notifications enabled field
    crit: notable
    conf: 0.9
    if:
      type: text
      word: telegramEnabled

  - id: telegram-bot-token-config-field
    desc: Telegram bot token config field
    crit: notable
    conf: 0.9
    for: [javascript, typescript, macho, swift, objc]
    if:
      type: text
      word: telegramBotToken

  # Native clients can ship the same user-facing setting in an embedded UI.
  # The field name records configuration shape, not credential theft or
  # message transmission.
  - id: native-telegram-channel-id-config-field
    desc: Native app Telegram channel ID config field
    crit: notable
    conf: 0.9
    for: [macho, swift, objc]
    platforms: [macos]
    if:
      type: text
      word: telegramChannelID

  - id: javascript-telegram-chat-id-field
    desc: Telegram chat ID config field
    crit: notable
    conf: 0.9
    if:
      type: text
      word: telegramChatId

  - id: javascript-development-secret-config
    desc: JavaScript development secret config fields
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?s)\bDEV_API_KEY\s*:[\s\S]{0,100}\bDEV_SECRET_KEY\s*:[\s\S]{0,100}\bDEV_SECRET_VALUE\s*:'

  # These are weak configuration fragments.  Keep them neutral and only use
  # them as supporting evidence for the stronger Node remote-agent composite.
  - id: javascript-relay-control-config-key
    desc: JavaScript relay or control config key
    crit: component
    conf: 0.8
    if:
      type: literal
      kind: string
      regex: '\b(relay|c2|control)[_-][a-z][a-z0-9_-]*\b'
      case_insensitive: true
    not:
      - regex: '(?i)^access-control-'

  - id: javascript-admin-secret-config-key
    desc: JavaScript admin or secret config key
    crit: component
    conf: 0.8
    if:
      type: literal
      kind: string
      regex: '\b(admin|secret|private)[_-][a-z][a-z0-9_-]*\b'
      case_insensitive: true
    not:
      - regex: '(?i)^access-control-'

  - id: javascript-privilege-state-config-key
    desc: JavaScript privilege-state config key
    crit: component
    conf: 0.8
    if:
      type: literal
      kind: string
      regex: '\b(privilege|elevat[a-z]*)[_-][a-z][a-z0-9_-]*\b'
      case_insensitive: true
