defaults:
  for: [text, mirc]
  platforms: [windows]
traits:
  - id: mirc-scr-extension-script-entry
    desc: mIRC script list declares SCR-suffixed files
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[rfiles\][^\[]{0,900}\bn[0-9]+=[^\r\n]{1,200}\.scr\r?$'
  - id: mirc-dll-extension-script-entry
    desc: mIRC script list declares DLL-suffixed files
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[(rfiles|afiles)\][^\[]{0,900}\bn[0-9]+=[^\r\n]{1,200}\.dll\r?$'
  - id: mirc-bot-server-variable
    desc: Saved mIRC bot server and port
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^%bot[.]server [^\s]{1,120} [0-9]{1,5}\r?$'
  - id: mirc-bot-channel-variable
    desc: Saved mIRC variable declares a bot channel
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^%botchan #[^\s]{1,80}\r?$'
  - id: mirc-subseven-connection-state
    desc: Saved mIRC SubSeven connection banner
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^%sub7[.]\w{1,24} connected[.] time/date:'
  - id: mirc-backdoor-port-scan-variable
    desc: Saved mIRC backdoor port scan targets
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^%portscan[.]ports [0-9.]{7,15} [0-9 ]{0,40}\b(27374|1243|30100)\b'
  - id: mirc-scan-active-variable
    desc: Saved mIRC active port scan flag
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^%portscan[.]active \$true\r?$'
  - id: mirc-server-endpoint-declaration
    desc: mIRC INI declares server endpoint
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^host=.{1,100}SERVER:[^\s:]{1,100}:\d{1,5}(GROUP:.{1,100})?\r?$'
  - id: mirc-windows-app-title
    desc: mIRC window title claims Microsoft Windows
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^aptitle=Microsoft Windows[ \t]*\r?$'
  - id: mirc-svchost-dde-name
    desc: mIRC DDE section declares svchost service name
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\[dde\][^\[]{0,160}\nServiceName=svchost\r?$'
