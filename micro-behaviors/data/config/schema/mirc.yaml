---
defaults:
  for:
  - text
  - mirc
  platforms:
  - windows
traits:
- id: ini-accept-executable-glob
  desc: INI accept list includes EXE filename glob
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: "(?im)^accept=[^\\r\\n]{0,300}\\*\\.exe(,|\\r?$)"
- id: mirc-authentication-state-variable
  desc: Saved mIRC bot authentication value
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?m)^%passauth2? [0-9 ]{1,100}\\r?$"
- id: ini-ascii-binary-bitstring-fields
  desc: INI keys store ASCII binary bitstring values
  crit: notable
  conf: 0.96
  count_min: 3
  if:
    type: text
    regex: "(?im)^[a-z][a-z0-9_]{1,15}=(0[01]{7}){5,40}\\r?$"
composite_rules: []
