defaults:
  for: [text, mirc]
  platforms: [windows]
traits:
  - id: mirc-scr-extension-script-entry
    desc: mIRC script list declares SCR-suffixed files
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[rfiles\][^\[]{0,900}\bn[0-9]+=[^\r\n]{1,200}\.scr\r?$'
  - id: mirc-dll-extension-script-entry
    desc: mIRC script list declares DLL-suffixed files
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[(rfiles|afiles)\][^\[]{0,900}\bn[0-9]+=[^\r\n]{1,200}\.dll\r?$'
  - id: mirc-bot-server-variable
    desc: Saved mIRC bot server and port
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^%bot[.]server [^\s]{1,120} [0-9]{1,5}\r?$'
  - id: mirc-bot-channel-variable
    desc: Saved mIRC variable declares a bot channel
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^%botchan #[^\s]{1,80}\r?$'
  - id: mirc-subseven-connection-state
    desc: Saved mIRC SubSeven connection banner
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^%sub7[.]\w{1,24} connected[.] time/date:'
  - id: mirc-backdoor-port-scan-variable
    desc: Saved scan targets include backdoor ports
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^%portscan[.]ports [0-9.]{7,15} [0-9 ]{0,40}\b(27374|1243|30100)\b'
  - id: mirc-scan-active-variable
    desc: Saved mIRC active port scan flag
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^%portscan[.]active \$true\r?$'
  - id: mirc-server-endpoint-declaration
    desc: mIRC INI declares server endpoint
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^host=.{1,100}SERVER:[^\s:]{1,100}:\d{1,5}(GROUP:.{1,100})?\r?$'
  - id: mirc-image-extension-script-entry
    desc: mIRC script list declares image-suffixed files
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[rfiles\][^\[]{0,900}\bn[0-9]+=[^\r\n]{1,200}\.(jpe?g|png|gif)\r?$'
  # Letter-digit identity fields are config values, not a file-format marker.
  # Generated nicks are common in ordinary clients, so each field stays notable.
  - id: mirc-random-identity-expression
    desc: IRC identity declares random expression
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\[mirc\][^\[]{0,800}\n(user|email|nick|anick)=\$rand\(a,z\)'
  - id: mirc-alphanumeric-nick-field
    desc: IRC nick field contains letter-digit token
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[mirc\][^\[]{0,800}\nnick=[a-z][a-z\d]{6,20}\d[a-z\d]{0,20}\r?$'
  - id: mirc-alphanumeric-anick-field
    desc: IRC anick field contains letter-digit token
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[mirc\][^\[]{0,800}\nanick=[a-z][a-z\d]{6,20}\d[a-z\d]{0,20}\r?$'
  - id: mirc-alphanumeric-user-field
    desc: IRC user field contains letter-digit token
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[mirc\][^\[]{0,800}\nuser=[a-z][a-z\d]{6,20}\d[a-z\d]{0,20}\r?$'
  - id: mirc-alphanumeric-email-field
    desc: IRC email field contains letter-digit token
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[mirc\][^\[]{0,800}\nemail=[a-z][a-z\d]{6,20}\d[a-z\d]{0,20}\r?$'
composite_rules:
  - id: mirc-alphanumeric-identity-fields
    desc: Four IRC fields declare letter-digit identities
    crit: notable
    conf: 0.95
    all:
      - id: mirc-alphanumeric-nick-field
      - id: mirc-alphanumeric-anick-field
      - id: mirc-alphanumeric-user-field
      - id: mirc-alphanumeric-email-field
