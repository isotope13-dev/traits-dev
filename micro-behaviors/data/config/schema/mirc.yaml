defaults:
  for: [text, mirc]
  platforms: [windows]
traits:
  - id: mirc-dcc-warnings-disabled
    desc: mIRC config disables DCC warnings
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\[warn\][^\[]{0,160}^dcc=off\r?$'
  - id: ini-accept-executable-glob
    desc: INI accept list includes EXE filename glob
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^accept=[^\r\n]{0,300}\*\.exe(,|\r?$)'
  - id: mirc-scr-extension-script-entry
    desc: mIRC script list declares SCR-suffixed files
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[rfiles\][^\[]{0,900}\bn[0-9]+=[^\r\n]{1,200}\.scr\r?$'
  - id: mirc-dll-extension-script-entry
    desc: mIRC script list declares DLL-suffixed files
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[(rfiles|afiles)\][^\[]{0,900}\bn[0-9]+=[^\r\n]{1,200}\.dll\r?$'
  - id: mirc-bot-server-variable
    desc: Saved mIRC bot server and port
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^%(bot[.]server|server_port[.]bot) [^\s]{1,120} [0-9]{1,5}\r?$'
  - id: mirc-bot-channel-variable
    desc: Saved mIRC variable declares a bot channel
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^%botchan #[^\s]{1,80}\r?$'
  - id: mirc-subseven-connection-state
    desc: Saved mIRC SubSeven connection banner
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^%sub7[.]\w{1,24} connected[.] time/date:'
  - id: mirc-backdoor-port-scan-variable
    desc: Saved scan targets include backdoor ports
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^%portscan[.]ports [0-9.]{7,15} [0-9 ]{0,40}\b(27374|1243|30100)\b'
  - id: mirc-scan-active-variable
    desc: Saved mIRC active port scan flag
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^%portscan[.]active \$true\r?$'
  - id: mirc-server-endpoint-declaration
    desc: mIRC INI declares server endpoint
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^host=.{1,100}SERVER:[^\s:]{1,100}:\d{1,5}(GROUP:.{1,100})?\r?$'
  - id: mirc-image-extension-script-entry
    desc: mIRC script list declares image-suffixed files
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[rfiles\][^\[]{0,900}\bn[0-9]+=[^\r\n]{1,200}\.(jpe?g|png|gif)\r?$'
  # Letter-digit identity fields are config values, not a file-format marker.
  # Generated nicks are common in ordinary clients, so each field stays notable.
  - id: mirc-random-identity-expression
    desc: IRC identity declares random expression
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\[mirc\][^\[]{0,800}\n(user|email|nick|anick)=\$rand\(a,z\)'
  - id: mirc-alphanumeric-nick-field
    desc: IRC nick field contains letter-digit token
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[mirc\][^\[]{0,800}\nnick=[a-z][a-z\d]{6,20}\d[a-z\d]{0,20}\r?$'
  - id: mirc-alphanumeric-anick-field
    desc: IRC anick field contains letter-digit token
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[mirc\][^\[]{0,800}\nanick=[a-z][a-z\d]{6,20}\d[a-z\d]{0,20}\r?$'
  - id: mirc-alphanumeric-user-field
    desc: IRC user field contains letter-digit token
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[mirc\][^\[]{0,800}\nuser=[a-z][a-z\d]{6,20}\d[a-z\d]{0,20}\r?$'
  - id: mirc-alphanumeric-email-field
    desc: IRC email field contains letter-digit token
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[mirc\][^\[]{0,800}\nemail=[a-z][a-z\d]{6,20}\d[a-z\d]{0,20}\r?$'
  - id: mirc-numbered-variable-assign
    for: [mirc, text, data]
    platforms: [unix, windows]
    desc: mIRC numbered variable assignment
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?m)^n\d+=%[A-Za-z][\w.]{0,24} '
  - id: mirc-sys-extension-script-entry
    desc: mIRC script list declares SYS-suffixed files
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[rfiles\][^\[]{0,900}\bn[0-9]+=[^\r\n]{1,200}\.sys\r?$'
  - id: mirc-dde-server-enabled
    desc: mIRC INI enables its DDE command server
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\[dde\][^\[]{0,160}^ServerStatus=on\r?$'
  - id: mirc-dde-custom-service-name
    desc: mIRC config declares nondefault DDE name
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[dde\][^\[]{0,160}^ServiceName=[^\r\n]{1,80}'
      not:
        - regex: '(?i)ServiceName=mirc\r?$'
  - id: mirc-ocx-extension-script-entry
    desc: mIRC script list declares OCX-suffixed files
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[rfiles\][^\[]{0,900}\bn[0-9]+=[^\r\n]{1,200}\.ocx\r?$'
  - id: mirc-exe-extension-script-entry
    desc: mIRC script list declares EXE-suffixed files
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[rfiles\][^\[]{0,900}\bn[0-9]+=[^\r\n]{1,200}\.exe\r?$'
  - id: mirc-authentication-state-variable
    desc: Saved mIRC bot authentication value
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^%passauth2? [0-9 ]{1,100}\r?$'
  - id: mirc-scan-work-range-variable
    desc: Saved mIRC scanner dotted-address range
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^%\w{0,12}scan[.]work [0-9.]{7,15} - [0-9.]{7,15}\r?$'
  - id: mirc-scan-report-channel-variable
    desc: Saved mIRC scanner reporting channel
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^%\w{0,12}scan[.]chan #[^\s]{1,80}\r?$'
  - id: mirc-channel-takeover-count-variable
    desc: Saved mIRC channel takeover counter
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^%count[.]takeover [1-9][0-9]{0,5}\r?$'
  - id: mirc-clone-channel-variable
    desc: Saved mIRC clone target channel
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^%clone[.]chan(el)? #[^\s]{1,80}\r?$'
  - id: mirc-drv-extension-script-entry
    desc: mIRC script list declares DRV-suffixed files
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[rfiles\][^\[]{0,900}\bn[0-9]+=[^\r\n]{1,200}\.drv\r?$'
  - id: mirc-saved-server-variable
    desc: Saved mIRC variable declares IRC server
    for: [text, mirc, data]
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^%server[0-9]{0,3} irc\.[a-z0-9.-]{1,100}(:[0-9]{1,5})?\r?$'
  - id: mirc-windows-update-app-title
    desc: INI application title claims Windows Update
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^aptitle=[^\r\n]{0,120}Windows Update[^\r\n]{0,250}\r?$'
  - id: mirc-dot-only-log-directory
    desc: mIRC log directory is a dot-only path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[dirs\][^\[]{0,160}^logdir=\.{3,32}\\\r?$'
  - id: mirc-scan-found-count-variable
    desc: Saved mIRC scanner positive result count
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^%\w{0,12}scan[.]found [1-9][0-9]{0,6}\r?$'
composite_rules:
  - id: mirc-dcc-executables-without-warning
    for: [text]
    desc: mIRC permits executable DCC files without warnings
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/file/format/structured::mirc-client-config-section
      - id: mirc-dcc-warnings-disabled
      - id: ini-accept-executable-glob
  - id: mirc-alphanumeric-identity-fields
    desc: Four IRC fields declare letter-digit identities
    crit: notable
    conf: 0.95
    all:
      - id: mirc-alphanumeric-nick-field
      - id: mirc-alphanumeric-anick-field
      - id: mirc-alphanumeric-user-field
      - id: mirc-alphanumeric-email-field
