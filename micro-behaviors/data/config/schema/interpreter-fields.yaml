defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - xml
  - text
traits:
- id: data-extension-field
  desc: Extension field names a data-file suffix
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)(<extension>|["']extension["']\s*[:=])\s*["']?\.?(log|txt|bak|tmp|dat)\b
- id: root-vpath-field
  desc: Virtual-path field names the root
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?i)(<vpath>\s*/\s*</vpath>|["']vpath["']\s*[:=]\s*["']/["'])
