defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: remote-config-reference
    desc: Literal references a remote configuration name
    crit: notable
    conf: 0.7
    if:
      type: string_literal
      regex: shepherd\.|config\.service|remote-config
    not:
      - exact: "config.service"

