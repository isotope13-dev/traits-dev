---
traits:
- platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
  - source
  - "-beam"
  - "-mirc"
  - "-ircii"
  id: encrypted-key-field-common-formats
  desc: References an encrypted_key configuration field
  conf: 0.85
  if:
    type: text
    regex: (?m)(^|[\x00"'`.])encrypted_key\b
- id: encrypted-key-field-irc-formats
  desc: References an encrypted_key configuration field
  conf: 0.85
  platforms:
  - linux
  - macos
  - windows
  for:
  - mirc
  - ircii
  if:
    type: text
    regex: (?m)([\x00"'`.]|^)encrypted_key\b
- id: jwe-context-common-formats
  desc: JWE serialization or algorithm diagnostics
  conf: 0.95
  platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
  - source
  - "-beam"
  - "-mirc"
  - "-ircii"
  if:
    type: text
    regex: "(JWE Compact Serialization|Unsupported JWE alg requested)"
- id: jwe-context-irc-formats
  desc: JWE serialization or algorithm diagnostics
  conf: 0.95
  platforms:
  - linux
  - macos
  - windows
  for:
  - mirc
  - ircii
  if:
    type: text
    regex: Unsupported JWE alg requested|JWE Compact Serialization
- platforms:
  - macos
  for:
  - scripts
  - binaries
  id: launchservices-url-scheme-key
  desc: LaunchServices URL scheme configuration key
  conf: 0.86
  if:
    type: text
    substr: LSHandlerURLScheme
defaults:
  crit: notable
composite_rules:
- id: jwe-encrypted-key-context
  desc: JWE serialization or algorithm diagnostics
  conf: 0.95
  platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
  - source
  - "-beam"
  any:
  - id: micro-behaviors/data/config/schema::jwe-context-common-formats
  - id: micro-behaviors/data/config/schema::jwe-context-irc-formats
- id: encrypted-key-field-reference
  desc: References an encrypted_key configuration field
  conf: 0.85
  platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
  - source
  - "-beam"
  any:
  - id: micro-behaviors/data/config/schema::encrypted-key-field-common-formats
  - id: micro-behaviors/data/config/schema::encrypted-key-field-irc-formats
