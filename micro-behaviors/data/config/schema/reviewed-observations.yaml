traits:
# Disjoint scanner scopes preserve the 35-type union within the text cap.
# Both branches use the same exclusions; consumers use the canonical composite.
- platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
  - source
  - -beam
  - -mirc
  - -ircii
  id: encrypted-key-field-common-formats
  desc: References an encrypted_key configuration field
  conf: 0.85
  if:
    type: text
    regex: (?m)(^|[\x00"'`.])encrypted_key\b
  unless: &encrypted-key-exclusions
  - id: jwe-encrypted-key-context
  - id: well-known/game/overwolf::overwolf-vendor-string
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  downgrade: &encrypted-key-downgrade
    any:
    - id: metadata/signed/platform::apple
- id: encrypted-key-field-irc-formats
  desc: References an encrypted_key configuration field
  conf: 0.85
  platforms: [linux, macos, windows]
  for: [mirc, ircii]
  if:
    type: text
    regex: (?m)([\x00"'`.]|^)encrypted_key\b
  unless: *encrypted-key-exclusions
  downgrade: *encrypted-key-downgrade
- id: jwe-context-common-formats
  desc: JWE serialization or algorithm diagnostics
  conf: 0.95
  platforms: [linux, macos, windows]
  for: [scripts, binaries, source, -beam, -mirc, -ircii]
  if:
    type: text
    regex: (JWE Compact Serialization|Unsupported JWE alg requested)
- id: jwe-context-irc-formats
  desc: JWE serialization or algorithm diagnostics
  conf: 0.95
  platforms: [linux, macos, windows]
  for: [mirc, ircii]
  if:
    type: text
    regex: Unsupported JWE alg requested|JWE Compact Serialization
- platforms:
  - macos
  for:
  - scripts
  - binaries
  id: launchservices-url-scheme-key
  desc: LaunchServices URL scheme configuration key
  conf: 0.86
  if:
    type: text
    substr: LSHandlerURLScheme
defaults:
  crit: notable
composite_rules:
- id: jwe-encrypted-key-context
  desc: JWE serialization or algorithm diagnostics
  conf: 0.95
  platforms: [linux, macos, windows]
  for: [scripts, binaries, source, -beam]
  any:
  - id: jwe-context-common-formats
  - id: jwe-context-irc-formats
- id: encrypted-key-field-reference
  desc: References an encrypted_key configuration field
  conf: 0.85
  platforms: [linux, macos, windows]
  for: [scripts, binaries, source, -beam]
  any:
  - id: encrypted-key-field-common-formats
  - id: encrypted-key-field-irc-formats
  unless:
  - id: jwe-encrypted-key-context
  - id: well-known/game/overwolf::overwolf-vendor-string
  - id: metadata/lang/scripted::dts-declaration-file
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  downgrade:
    any:
    - id: metadata/signed/platform::apple
