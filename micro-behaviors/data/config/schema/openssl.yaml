defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  conf: 0.94

traits:
  - id: openssl-randfile-directive
    desc: OpenSSL RANDFILE seed path directive
    if:
      type: text
      regex: '(?m)^\s*RANDFILE\s*=\s*\S+'

  - id: openssl-v3-ca-section
    desc: OpenSSL v3_ca extension section header
    if:
      type: text
      regex: '(?m)^\s*\[\s*v3_ca\s*\]'
