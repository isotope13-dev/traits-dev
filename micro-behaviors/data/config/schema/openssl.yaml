defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  conf: 0.94

traits:
  - id: openssl-randfile-directive
    desc: OpenSSL random seed file path
    if:
      type: text
      regex: '(?m)^\s*RANDFILE\s*=\s*\S+'

  # These settings describe weak legacy cryptographic defaults. Keep them as
  # configuration observations: the config alone does not prove a key or
  # certificate was generated with them.
  - id: openssl-low-key-size-default
    desc: OpenSSL low key size default (512–1024 bits)
    if:
      type: text
      regex: '(?mi)^[ \t]*default_bits[ \t]*=[ \t]*(512|768|1024)\b'

  - id: openssl-sha1-digest-default
    desc: OpenSSL SHA-1 signing digest default
    if:
      type: text
      regex: '(?mi)^[ \t]*default_md[ \t]*=[ \t]*sha-?1([ \t]+#.{0,200})?[ \t]*$'

  - id: openssl-v3-ca-section
    desc: OpenSSL v3_ca extension section header
    if:
      type: text
      regex: '(?m)^\s*\[\s*v3_ca\s*\]'

  # dynamic_path names the shared-object file an OpenSSL engine module is
  # loaded from. Ordinary in HSM/PKCS#11 and GOST engine setups; also the
  # shape used to make OpenSSL load an arbitrary module from an attacker
  # chosen path (e.g. via OPENSSL_CONF). Directive presence only.
  - id: openssl-engine-module-directive
    desc: OpenSSL engine module path directive
    if:
      type: text
      regex: '(?m)^\s*dynamic_path\s*=\s*\S+'
