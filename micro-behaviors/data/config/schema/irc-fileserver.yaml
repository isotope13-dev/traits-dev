---
defaults:
  for:
  - text
  platforms:
  - windows
  - linux
  - macos
  crit: notable
  conf: 0.95
traits:
- id: pid-file-dll-suffix
  desc: Configured PID filename uses DLL suffix
  if:
    type: text
    regex: "(?im)^pidfile[ \\t]+[^\\r\\n]{1,120}\\.dll[ \\t]*\\r?$"
- id: message-file-dll-suffix
  desc: Configured message filename uses DLL suffix
  if:
    type: text
    regex: "(?im)^messagefile[ \\t]+[^\\r\\n]{1,120}\\.dll[ \\t]*\\r?$"
- id: ignore-file-dll-suffix
  desc: Configured ignore list uses DLL suffix
  if:
    type: text
    regex: "(?im)^ignorefile[ \\t]+[^\\r\\n]{1,120}\\.dll[ \\t]*\\r?$"
composite_rules:
- id: state-files-dll-suffix
  desc: Multiple configured data files use DLL suffixes
  needs: 3
  any:
  - id: micro-behaviors/communications/irc/configure::irc-xdcc-file-dll-suffix
  - id: micro-behaviors/data/config/schema::pid-file-dll-suffix
  - id: micro-behaviors/data/config/schema::message-file-dll-suffix
  - id: micro-behaviors/data/config/schema::ignore-file-dll-suffix
