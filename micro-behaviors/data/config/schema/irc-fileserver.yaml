defaults:
  for: [text]
  platforms: [windows, linux, macos]
  crit: notable
  conf: 0.95
traits:
  - id: xdcc-pack-list-file
    desc: XDCC configuration declares a pack-list file
    if:
      type: text
      regex: '(?im)^xdccfile[ \t]+[^\r\n]{1,160}'
  - id: xdcc-pack-slot-limit
    desc: XDCC configuration sets per-pack transfer slots
    if:
      type: text
      regex: '(?im)^slotsmaxpack[ \t]+[0-9]+[ \t]*\r?$'
  - id: irc-server-host-port-setting
    desc: IRC configuration declares server host and port
    if:
      type: text
      regex: '(?im)^server[ \t]+[a-z0-9.-]+[ \t]+[0-9]{1,5}[ \t]*\r?$'
  - id: xdcc-upload-enabled-setting
    desc: XDCC configuration enables incoming file uploads
    if:
      type: text
      regex: '(?im)^uploadallowed[ \t]+yes[ \t]*\r?$'
  - id: irc-admin-unrestricted-hostmask
    desc: IRC admin hostmask accepts all peers
    if:
      type: text
      regex: '(?im)^adminhost[ \t]+\*!\*@\*[ \t]*\r?$'
  - id: irc-xdcc-file-dll-suffix
    desc: IRC pack list filename uses DLL suffix
    if:
      type: text
      regex: '(?im)^xdccfile[ \t]+[^\r\n]{1,120}\.dll[ \t]*\r?$'
  - id: irc-pid-file-dll-suffix
    desc: IRC PID filename uses DLL suffix
    if:
      type: text
      regex: '(?im)^pidfile[ \t]+[^\r\n]{1,120}\.dll[ \t]*\r?$'
  - id: irc-message-file-dll-suffix
    desc: IRC message filename uses DLL suffix
    if:
      type: text
      regex: '(?im)^messagefile[ \t]+[^\r\n]{1,120}\.dll[ \t]*\r?$'
  - id: irc-ignore-file-dll-suffix
    desc: IRC ignore list filename uses DLL suffix
    if:
      type: text
      regex: '(?im)^ignorefile[ \t]+[^\r\n]{1,120}\.dll[ \t]*\r?$'
composite_rules:
  - id: irc-state-files-dll-suffix
    desc: Multiple IRC data filenames use DLL suffixes
    needs: 3
    any:
      - id: irc-xdcc-file-dll-suffix
      - id: irc-pid-file-dll-suffix
      - id: irc-message-file-dll-suffix
      - id: irc-ignore-file-dll-suffix
