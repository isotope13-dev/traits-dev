# Plugin and module registration entry points. Modular implants register
# their modules this way, and so do IIS (webengine.dll's RegisterModule
# export), native extension hosts and plugin frameworks.
defaults:
  platforms: [windows, unix]
  for: [binaries]
traits:
- id: registermodule-name
  desc: RegisterModule function name
  crit: notable
  conf: 0.92
  if:
    type: text
    word: RegisterModule
