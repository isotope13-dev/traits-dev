defaults:
  for: [data, text]
  platforms: [macos, windows, linux]

traits:
- id: shellcommands-data-json--rx-1
  desc: Obsidian Shell Commands plugin identifier
  crit: component
  conf: 0.94
  if:
    type: text
    regex: '(?i)"(id|plugin)"\s*:\s*"obsidian-shellcommands"'
  count_max: 1012047
- id: shellcommands-data-json--rx-2
  desc: Shell Commands configuration field
  crit: component
  conf: 0.94
  if:
    type: text
    regex: '"shellCommands"\s*:'
  count_max: 1012048
- id: shellcommands-data-json--rx-3
  desc: Platform-specific shell command field
  crit: component
  conf: 0.94
  if:
    type: text
    regex: '"platformSpecificCommands"\s*:'
  count_max: 1012049
- id: shellcommands-powershell-stager--rx-4
  desc: PowerShell web-download command sequence
  crit: component
  conf: 0.96
  if:
    type: text
    regex: '(?i)\b(powershell|pwsh)\b[\s\S]{0,500}\b(iwr|Invoke-WebRequest)\b'
  count_max: 1012050
- id: shellcommands-powershell-stager--rx-5
  desc: PowerShell download-and-evaluate sequence
  crit: component
  conf: 0.96
  if:
    type: text
    regex: '(?i)\b(Invoke-Expression|iex)\b[\s\S]{0,500}\b(iwr|Invoke-WebRequest)\b'
  count_max: 1012051
- id: shellcommands-powershell-stager--rx-6
  desc: PowerShell file-download command sequence
  crit: component
  conf: 0.96
  if:
    type: text
    regex: '(?i)\b(powershell|pwsh)\b[\s\S]{0,500}\b(Start-BitsTransfer|OutFile)\b'
  count_max: 1012052
- id: shellcommands-powershell-stager--rx-7
  desc: PowerShell download-and-evaluate sequence
  crit: component
  conf: 0.96
  if:
    type: text
    regex: '(?i)\b(Invoke-Expression|iex)\b[\s\S]{0,500}\b(Start-BitsTransfer|OutFile)\b'
  count_max: 1012053
- id: shellcommands-osascript-stager
  desc: Obsidian osascript download stager
  crit: suspicious
  conf: 0.96
  platforms: [macos]
  if:
    type: text
    regex: '(?i)(curl|osascript)[^\n]{0,500}\|\s*osascript'

composite_rules:
- id: obsidian-plugin-download-execution
  desc: Obsidian plugin download execution
  crit: suspicious
  conf: 0.98
  all:
  - id: shellcommands-data-json
  any:
  - id: shellcommands-powershell-stager
  - id: shellcommands-osascript-stager
- id: shellcommands-data-json
  desc: Obsidian shellcommands data JSON
  crit: notable
  conf: 0.94
  any:
  - id: shellcommands-data-json--rx-1
  - id: shellcommands-data-json--rx-2
  - id: shellcommands-data-json--rx-3
- id: shellcommands-powershell-stager
  desc: Obsidian PowerShell download stager
  crit: suspicious
  conf: 0.96
  any:
  - id: shellcommands-powershell-stager--rx-4
  - id: shellcommands-powershell-stager--rx-5
  - id: shellcommands-powershell-stager--rx-6
  - id: shellcommands-powershell-stager--rx-7
