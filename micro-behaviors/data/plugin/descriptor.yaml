# Keys that name a loadable module's entry point in a descriptor or manifest.
# App manifests (Azure Sphere `app_manifest.json`), plugin registries and
# remotely staged loaders all carry one; the staged-loader objective pairs it
# with a class field, a remote URL and a digest.
defaults:
  platforms: [android, unix, windows]
  for: [json, javascript, typescript, python, java, kotlin, csharp, go, rust]
  crit: notable
  conf: 0.94

traits:
  # Relocated from objectives/command-and-control/dropper/staged-loader, where
  # it was `remote-module-method-field` ("Remote module entry method field").
  # Nothing in the matcher sees a remote module.
  - id: entry-point-field
    desc: entryPoint or entryMethod field
    if:
      type: text
      regex: '(?i)["''](entryMethod|entryPoint)["'']\s*:\s*["'']'
