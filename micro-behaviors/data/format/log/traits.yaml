# Machine-generated log, alert, and error-report record schemas.
#
# Recognising the carrier is neutral: these field names appear in every edge
# firewall export, APM event body, and crash report an operations team handles.
# The reason they are worth naming is that the request-derived fields of such a
# record are attacker-controlled by construction — an edge firewall stores the
# request that tripped it verbatim — so a composite can ask what is sitting
# inside them. Intent lives in that composite, never in these atoms.
defaults:
  platforms: [unix, windows]
  for: [json, text, markdown, scripts, source]
  conf: 0.92

traits:
  - id: edge-request-log-field
    desc: Edge request-log clientRequest field
    crit: notable
    if:
      type: text
      regex: '\bclientRequest(UserAgent|HTTPHost|Path|Method|Scheme|Query)\b'

  - id: edge-ray-id-field
    desc: Edge log ray-identifier field
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '"(rayName|ray_?id)"\s*:'
      case_insensitive: true

  - id: waf-block-action-field
    desc: WAF log blocked-action verdict field
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '"action"\s*:\s*"(block|challenge|managed_challenge|jschallenge)"'

  - id: apm-event-alert-field
    desc: APM event alert or source field
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\b(alert_type|ddsource|ddtags|dd\.trace_id)\b\s*[:=]'

  - id: error-report-culprit-field
    desc: Error-report culprit or breadcrumb field
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '"(culprit|breadcrumbs|logentry|sentry\.interfaces\.\w{1,20})"\s*:'

composite_rules:
  - id: edge-firewall-event-record
    desc: Edge firewall event record fields
    crit: notable
    conf: 0.93
    any:
      - id: edge-request-log-field
      - id: edge-ray-id-field

  - id: waf-blocked-request-log-record
    desc: WAF log record for a blocked request
    crit: notable
    conf: 0.94
    all:
      - id: edge-firewall-event-record
      - id: waf-block-action-field

  - id: observability-alert-record
    desc: APM alert or error-report record fields
    crit: notable
    conf: 0.9
    any:
      - id: apm-event-alert-field
      - id: error-report-culprit-field
