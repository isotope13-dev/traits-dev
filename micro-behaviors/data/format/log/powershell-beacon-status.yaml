defaults:
  platforms: [windows]
  for: [powershell]

traits:
  # A report caption is context, not proof that a beacon ran or data left.
- id: powershell-beacon-commandline-report-label
  desc: Beacon command-line report caption
  crit: notable
  conf: 0.98
  if:
    type: literal
    regex: '(?i)\bbeacon\b[^\r\n]{0,32}\b(cmdline|command.?line)\b'

  # Identifies the collected report variable flowing into the POST wrapper;
  # the parent composites supply the beacon/process/network collection context.
