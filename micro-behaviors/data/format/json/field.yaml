defaults:
  platforms: [unix, windows, android]
  for: [binaries, scripts]
traits:
  - id: json-command-field
    desc: JSON command or task field key
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '["''](cmd|command|task|action)["'']\s*:'

  - id: json-result-field
    desc: JSON result or response field key
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '["''](result|output|status|response)["'']\s*:'

  - id: go-json-command-tag
    desc: Go JSON command or task field tag
    crit: component
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '`json:"(cmd|command|task|action)(,[^"]{1,30})?"`'

  - id: go-json-result-tag
    desc: Go JSON result or response field tag
    crit: component
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '`json:"(result|output|status|response)(,[^"]{1,30})?"`'

  - id: native-command-result-field
    desc: Native command result field
    crit: component
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?i)\b(cmdResult|command[_-]?result|stdout|stderr)\b\s*[:=]'

  - id: json-result-output-field
    desc: JSON result or output field key
    crit: component
    conf: 0.8
    for: [pe, dll, c, cpp, rust, go]
    if:
      type: text
      regex: '(?i)["''](result|output|stdout|stderr)["'']\s*:'
  - id: status-json-field
    desc: JSON status field key
    crit: baseline
    conf: 0.4
    if:
      type: text
      regex: '",\s*"status"\s*:'
      section: .text
  - id: peer-list-json-field
    desc: Quoted peer or relay JSON key
    crit: baseline
    conf: 0.9
    for: [source]
    if:
      type: text
      regex: '(?i)"(peers|relays)"\s*:'

  - id: json-bandwidth-mbps-field
    desc: JSON bandwidth in megabits-per-second field key
    crit: component
    conf: 0.84
    for: [python, javascript, typescript]
    if:
      type: text
      regex: '(?i)["'']bandwidth_mbps["'']\s*:'
