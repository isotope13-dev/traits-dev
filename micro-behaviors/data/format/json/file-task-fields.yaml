defaults:
  platforms:
  - unix
  - windows
  for:
  - binaries
  - go
  - javascript
  - python
  - rust
  - c
  - cpp
  - csharp
  conf: 0.9
traits:
- id: file-path-field
  crit: notable
  desc: file_path field-name token
  if:
    type: text
    regex: '^file_path$|json:\s*["\x27]file_path["\x27]|["\x27]file_path["\x27]\s*:'
- id: local-path-field
  crit: notable
  desc: local_path field-name token
  if:
    type: text
    regex: '^local_path$|json:\s*["\x27]local_path["\x27]|["\x27]local_path["\x27]\s*:'
- id: server-path-field
  crit: notable
  desc: server_path field-name token
  if:
    type: text
    regex: '^server_path$|json:\s*["\x27]server_path["\x27]|["\x27]server_path["\x27]\s*:'
- id: executed-field
  crit: notable
  desc: executed field-name token
  if:
    type: text
    regex: '^executed$|json:\s*["\x27]executed["\x27]|["\x27]executed["\x27]\s*:'
- id: last-access-field
  crit: notable
  desc: last_access field-name token
  if:
    type: text
    regex: '^last_access$|json:\s*["\x27]last_access["\x27]|["\x27]last_access["\x27]\s*:'
- id: command-field
  crit: notable
  desc: command field-name token
  if:
    type: text
    regex: '^command$|json:\s*["\x27]command["\x27]|["\x27]command["\x27]\s*:'
composite_rules:
- id: file-task-path-fields
  desc: File, local and server path field tokens
  crit: notable
  conf: 0.94
  all:
  - id: file-path-field
  - id: local-path-field
  - id: server-path-field
- id: command-state-fields
  desc: Command, executed and last-access field tokens
  crit: notable
  conf: 0.94
  all:
  - id: command-field
  - id: executed-field
  - id: last-access-field
