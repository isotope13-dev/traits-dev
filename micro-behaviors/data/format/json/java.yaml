defaults:
  crit: notable
  platforms: [android, unix, windows]
  for: [java]

traits:
  # javac parses these as separate string literals around runtime values.
  # Each fragment is incomplete alone; together they identify a compact JSON
  # object that serializes host and user fields.
  - id: java-json-host-field-prefix
    desc: Java JSON host field fragment
    conf: 0.96
    for: [java, groovy]
    if:
      type: text
      substr: '{\"host\":\"'

  - id: java-json-user-field-separator
    desc: Java JSON user field fragment
    conf: 0.96
    for: [java, groovy]
    if:
      type: text
      substr: '\",\"user\":\"'

  # A bare Gson JSON write. It was filed as a Minecraft "profile builder"
  # under credential-access and fired on every mod that saves its config.
  - id: gson-jsonobject-add-property
    desc: Gson JsonObject.addProperty call
    conf: 0.9
    for: [class, java_class]
    if:
      type: import
      exact: com/google/gson/JsonObject.addProperty

composite_rules:
  - id: java-host-user-json-fields
    desc: Java serializes host and user fields
    conf: 0.97
    near_bytes: 256
    all:
      - id: java-json-host-field-prefix
      - id: java-json-user-field-separator
