# A key occurrence does not establish profiling or a build-script trigger.
defaults:
  platforms: [unix, windows]
  for: [rust]

traits:
  - id: rust-host-identity-key-text
    desc: Rust text names hostname/user/cwd object key
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"(hostname|user|cwd)"\s*:'
