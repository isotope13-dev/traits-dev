              uint8(@field[s]+1) == uint8(@field[s]+49) and
              uint8(@field[s]+1) == uint8(@field[s]+61) and
              uint8(@field[s]+1) == uint8(@field[s]+73) and
              uint8(@field[s]+1) == uint8(@field[s]+86) and
