# Immediate subtraction stores recover positions in {"sessionId":".
# Constant-pool operands remain unknown: this is a field-fragment fact.
defaults:
  platforms: [unix, windows]
  for: [class]
traits:
  - id: jvm-difference-session-id-json-fragments
    desc: Difference-built sessionId JSON field fragments
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        rule difference_session_id_json {
          strings:
            $builder = "java/lang/StringBuilder"
            $field = {
              19 ?? 03 ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 55
              19 ?? 04 ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 55
              19 ?? 05 ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 55
              19 ?? 06 ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 55
              19 ?? 07 ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 55
              19 ?? 08 ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 55
              19 ?? 10 06 ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 55
              19 ?? 10 07 ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 55
              19 ?? 10 08 ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 55
              19 ?? 10 09 ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 55
              19 ?? 10 0A ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 55
              19 ?? 10 0B ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 55
              19 ?? 10 0C ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 55
              19 ?? 10 0D ( 11 | 13 ) ?? ?? ( 11 | 13 ) ?? ?? 64 92 55
            }
          condition:
            uint32be(0) == 0xcafebabe and $builder and
            for any s in (1..#field) : (
              uint8(@field[s]+3) == 0x11 and
              uint8(@field[s]+6) == 0x11 and
              (uint16be(@field[s]+4) - uint16be(@field[s]+7)) == 123 and
              uint8(@field[s]+39) == 0x11 and
              uint8(@field[s]+42) == 0x11 and
              (uint16be(@field[s]+40) - uint16be(@field[s]+43)) == 101 and
              uint8(@field[s]+51) == 0x11 and
              uint8(@field[s]+54) == 0x11 and
              (uint16be(@field[s]+52) - uint16be(@field[s]+55)) == 115 and
              uint8(@field[s]+63) == 0x11 and
              uint8(@field[s]+66) == 0x11 and
              (uint16be(@field[s]+64) - uint16be(@field[s]+67)) == 115 and
              uint8(@field[s]+102) == 0x11 and
              uint8(@field[s]+105) == 0x11 and
              (uint16be(@field[s]+103) - uint16be(@field[s]+106)) == 110 and
              uint8(@field[s]+115) == 0x11 and
              uint8(@field[s]+118) == 0x11 and
              (uint16be(@field[s]+116) - uint16be(@field[s]+119)) == 73 and
              uint8(@field[s]+128) == 0x11 and
              uint8(@field[s]+131) == 0x11 and
              (uint16be(@field[s]+129) - uint16be(@field[s]+132)) == 100 and
              uint8(@field[s]+167) == 0x11 and
              uint8(@field[s]+170) == 0x11 and
              (uint16be(@field[s]+168) - uint16be(@field[s]+171)) == 34 and
              uint8(@field[s]+1) == uint8(@field[s]+13) and
              uint8(@field[s]+1) == uint8(@field[s]+25) and
