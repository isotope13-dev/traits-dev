# Field names identify a data schema; they do not establish remote tasking.
defaults:
  platforms:
  - windows
  - unix
  for:
  - go
  - elf
  - pe
  - macho
traits:
- id: filename-field
  desc: JSON "filename" field name
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '["'']filename["'']\s*:'
- id: target-path-field
  desc: JSON "target_path" field name
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '["'']target_path["'']\s*:|json:"target_path"'
- id: content-field
  desc: JSON "content" field name
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '["'']content["'']\s*:|json:"content"'
- id: encoding-field
  desc: JSON "encoding" field name
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '["'']encoding["'']\s*:|json:"encoding"'
composite_rules:
- id: file-content-field-cluster
  desc: File path and content field cluster
  crit: notable
  conf: 0.91
  needs: 4
  near_bytes: 4096
  any:
  - id: micro-behaviors/data/format/json::filename-field
  - id: micro-behaviors/data/format/json::target-path-field
  - id: micro-behaviors/data/format/json::content-field
  - id: micro-behaviors/data/format/json::encoding-field
  - id: micro-behaviors/data/format/json::json-data-field
  unless:
  - id: well-known/tool/development/vcs/glab::glab-cli-binary
