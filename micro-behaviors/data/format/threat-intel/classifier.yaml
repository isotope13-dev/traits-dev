# Regex sources that classify threat-intelligence entities: CVE identifiers and
# MD5/SHA-1/SHA-256 digests. OSINT and threat-intel tools type a query by
# matching it against a table of these patterns, with crypto addresses as
# another row. Each atom matches the pattern text itself, not data that happens
# to look like an identifier. A table that also recognizes CVE ids and file
# digests is an entity classifier; see the downgrade on
# objectives/impact/crypto-manipulation/hijack-transfer::multi-chain-address-matcher-table.
defaults:
  crit: notable
  conf: 0.88
  platforms: [windows, unix]
  for: [javascript, typescript, python, go, java, ruby, php]

traits:
  - id: cve-id-regex
    desc: Regex recognizes CVE identifiers
    if:
      type: text
      substr: 'CVE-\d{4}-\d{4,7}'

  - id: file-digest-regex
    desc: Regex recognizes MD5, SHA-1 or SHA-256
    # The bracket class must not sit directly behind a word character: an
    # Ethereum address pattern (`0x[a-fA-F0-9]{40}`) or transaction-hash
    # pattern (`0x[a-fA-F0-9]{64}`) carries the same quantifier but the `0x`
    # prefix makes it an address shape, not a bare file-digest pattern. A
    # literal `\b` word-boundary escape is not a word character for this
    # purpose: well-formed digest patterns are routinely written
    # `\b[a-fA-F0-9]{32}\b`, and excluding them blinds the OSINT-downgrade
    # gate to ordinary entity-extraction tables.
    if:
      type: text
      regex: '([^A-Za-z0-9_]|\\b)\[a-fA-F0-9\]\{(32|40|64)\}'

composite_rules:
  - id: threat-intel-entity-regex-catalog
    desc: Regexes classify CVE ids and file digests
    all:
      - id: cve-id-regex
      - id: file-digest-regex
