defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - php
  - go
  - csharp
  - powershell
traits:
- id: windows-executable-media-type
  desc: Windows executable MIME media type
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: application/x-msdownload
- id: windows-executable-media-type-pe
  desc: PE contains executable MIME media type
  crit: notable
  conf: 0.89
  size_min: 1024
  for:
  - pe
  if:
    type: text
    exact: application/x-msdownload
