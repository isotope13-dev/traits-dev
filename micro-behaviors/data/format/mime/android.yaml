defaults:
  platforms: [android]
  for: [java, kotlin]

traits:
  - id: pdf-word-mime-literal
    desc: PDF or Word MIME type literal
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: "application/(pdf|msword|vnd\\.ms-)"
  - id: ooxml-mime-literal
    desc: OOXML document MIME type literal
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      substr: application/vnd.openxmlformats-officedocument
  - id: javascript-mime-literal
    desc: JavaScript MIME type literal
    crit: notable
    conf: 0.86
    if:
      type: string_literal
      substr: text/javascript
  - id: image-mime-literal
    desc: Image MIME type literal
    crit: notable
    conf: 0.88
    unless:
      - id: well-known/tool/development/docs/pandoc::package-path
    if:
      type: string_literal
      regex: "image/[a-z0-9.+_-]{1,40}"
  - id: audio-mime-literal
    desc: Audio MIME type literal
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      regex: "audio/[A-Za-z0-9.+_-]{1,40}"
    not:
    - regex: 'audio/[^"'';\s]{1,40}\.(wav|mp3|ogg|aac|flac|m4a)'
    unless:
    - id: well-known/lib/development/vscode-webview::acquire-vscode-api
    - id: micro-behaviors/process/interpreter/vm/
  - id: video-mime-literal
    desc: Video MIME type literal
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      regex: "video/[A-Za-z0-9.+_-]{1,40}"
  - id: zip-rar-mime-literal
    desc: ZIP or RAR MIME type literal
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      regex: "application/(zip|x-rar-compressed)"
  - id: 7z-tar-mime-literal
    desc: 7z or tar MIME type literal
    crit: notable
    conf: 0.88
    if:
      type: string_literal
      regex: "application/(x-7z-compressed|x-tar)"
