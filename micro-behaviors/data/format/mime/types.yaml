# Media-type strings that name a payload format without saying which
# protocol carries it: the same literal appears in HTTP Content-Type
# headers, download responses, multipart bodies and email attachments.
defaults:
  platforms: [windows, unix]
traits:
  - id: mime-octet-stream
    desc: Uses the application/octet-stream MIME type
    crit: notable
    conf: 0.85
    for: [scripts, source, class]
    if:
      type: text
      substr: application/octet-stream
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
