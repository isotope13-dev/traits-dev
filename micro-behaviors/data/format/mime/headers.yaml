# MIME field syntax is shared by email and HTTP. It establishes no transport.
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]
  crit: notable
  conf: 0.5

traits:
  - id: content-type-header
    desc: References a MIME Content-Type header
    if:
      type: text
      substr: 'Content-Type:'
  - id: boundary-param
    desc: References a MIME multipart boundary parameter
    if:
      type: text
      # Excludes compiler switches (-x86-align-branch-boundary=) and source
      # variable assignments (`const boundary = ...`).
      regex: '(?i)(^|[;\s/"''])boundary=[A-Za-z0-9"''_\-/{$%]'
