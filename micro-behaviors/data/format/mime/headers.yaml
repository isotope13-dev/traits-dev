# MIME field syntax is shared by email and HTTP. It establishes no transport.
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]
  crit: notable
  conf: 0.5

traits:
  - id: content-type-header
    desc: References a MIME Content-Type header
    if:
      type: text
      substr: 'Content-Type:'
  - id: boundary-param
    desc: Multipart media type specifies a boundary
    if:
      type: text
      # Require the media type: BOUNDARY="..." in a loader is a shell
      # assignment, not MIME. Bare /boundary=/ parser vocabulary also does
      # not establish a multipart parameter in an artifact.
      regex: '(?i)multipart/[^;\s"'']{1,40};[ \t]*boundary\s*='
