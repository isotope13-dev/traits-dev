defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [javascript, typescript]

traits:
  - id: message-rfc822-media-type
    desc: References message/rfc822 media type
    conf: 0.95
    if:
      type: text
      substr: message/rfc822
  - id: rar-compressed-media-type
    desc: References RAR compressed media type
    conf: 0.95
    if:
      type: text
      substr: application/x-rar-compressed
  - id: office-openxml-media-type
    desc: References Office OpenXML media type
    conf: 0.95
    if:
      type: text
      substr: application/vnd.openxmlformats-officedocument

  - id: rfc822-extension-map-entry
    desc: RFC822 MIME entry declares filename extensions
    conf: 0.98
    if:
      type: text
      regex: '["'']message/rfc822["'']\s*:\s*\{[^}]{0,180}["'']extensions["'']\s*:'

# Co-occurrence describes a media-type table; no specific library is inferred.
composite_rules:
  - id: mime-types-with-extension-map
    desc: MIME types co-occur with extension-map entries
    conf: 0.98
    all:
      - id: message-rfc822-media-type
      - id: rar-compressed-media-type
      - id: office-openxml-media-type
      - id: rfc822-extension-map-entry
