# Reference inside code; this does not identify the containing file as PDF.
defaults:
  platforms: [unix, windows]
  # Exclude bytecode/container scopes with no reviewed PDF-reference fixture.
  for: [binaries, scripts, source, -beam, -wasm, -static-lib]
  crit: notable
  conf: 0.9

traits:
  - id: pdf-format-reference
    desc: References the PDF signature or media type
    if:
      type: text
      regex: '(?i)application/pdf|%PDF-[0-9.-]+'
