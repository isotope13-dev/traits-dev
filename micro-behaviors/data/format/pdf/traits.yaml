defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe, python]
traits:
  - id: pdf-invisible-text-rendering
    desc: PDF uses invisible text rendering
    crit: notable
    conf: 0.96
    for: [pdf]
    if:
      type: raw
      regex: '(?m)(^|\s)3\s+Tr\b'

  - id: pdf-hidden-text-show-operator
    desc: PDF hidden text uses a text-showing operator
    crit: notable
    conf: 0.94
    for: [pdf]
    if:
      type: raw
      regex: '(?is)3\s+Tr[\s\S]{0,400}\bTj\b'

  # A fill-color operator is neutral until it is combined with text operators.
  # Match decoded streams so compressed PDFs are covered as well as plaintext
  # content streams. Near-white values cover generators that avoid exact 1.0.
  - id: pdf-near-white-rgb-fill
    desc: PDF content sets near-white RGB fill
    crit: baseline
    conf: 0.94
    for: [pdf]
    if:
      type: value
      path: pdf.streams[*].decoded_text
      regex: '(?m)(^|\s)(1|0\.99\d*)\s+(1|0\.99\d*)\s+(1|0\.99\d*)\s+rg\b'

  - id: pdf-near-white-grayscale-fill
    desc: PDF content sets near-white grayscale fill
    crit: baseline
    conf: 0.94
    for: [pdf]
    if:
      type: value
      path: pdf.streams[*].decoded_text
      regex: '(?m)(^|\s)(1|0\.99\d*)\s+g\b'

  - id: pdf-tiny-text-font
    desc: PDF text uses three-point or smaller font
    crit: notable
    conf: 0.94
    for: [pdf]
    if:
      type: value
      path: pdf.streams[*].decoded_text
      # Exclude bare `1 Tf`: Acrobat PDFMaker uses unit size 1 then scales via Tm.
      regex: '(?m)(^|\s)/\S+\s+(0(\.\d+)?|[23](\.0+)?)\s+Tf\b'
    unless:
      # Xcode asset-catalog vector PDFs often use tiny fonts for icons.
      - type: path
        regex: '(?i)\.imageset/|/Assets\.xcassets/'

  - id: pdf-literal-text-show-operator
    desc: PDF decoded stream shows literal text
    crit: notable
    conf: 0.92
    for: [pdf]
    if:
      type: value
      path: pdf.streams[*].decoded_text
      regex: '\)\s+(Tj|TJ)\b'

  - id: pdf-array-text-show-operator
    desc: PDF decoded stream shows text array
    crit: notable
    conf: 0.92
    for: [pdf]
    if:
      type: value
      path: pdf.streams[*].decoded_text
      regex: '\]\s+TJ\b'

  - id: pdf-remote-destination
    desc: Hidden PDF text has a remote destination
    crit: notable
    conf: 0.92
    for: [pdf]
    if:
      type: raw
      regex: '(?is)3\s+Tr[\s\S]{0,400}(https?://|[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,})'

  - id: pdf-office-file-target
    desc: Hidden PDF text names an Office file
    crit: notable
    conf: 0.92
    for: [pdf]
    if:
      type: raw
      regex: '(?is)3\s+Tr[\s\S]{0,400}(\.(xlsx?|xlsm)\b|\b(xlsx?|xlsm)\s+files?\b)'

  - id: read-fitz
    desc: Imports Fitz/PyMuPDF for PDF processing
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: fitz
  - id: read-pypdf2
    desc: Imports PyPDF2 for PDF processing
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: PyPDF2
  - id: read-pypdf
    desc: Imports pypdf for PDF processing
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: pypdf
  - id: read-pdfminer
    desc: Imports pdfminer for PDF processing
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: pdfminer

  - id: pdf-javascript-action-construction
    desc: Constructs a PDF JavaScript action dictionary
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: 'NameObject\(S\).{0,80}JavaScript'

  - id: jspdf-generate-pdf
    desc: Generates PDF with jsPDF
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    platforms: [windows, unix]
    if:
      type: text
      regex: 'new\s+jsPDF\s*\('

  - id: jspdf-save-pdf
    desc: Saves PDF with jsPDF
    crit: notable
    conf: 0.86
    for: [javascript, typescript]
    platforms: [windows, unix]
    if:
      type: text
      regex: '\.save\s*\(\s*["''`][^"''`]{0,120}\.pdf'

  # Source-level PDF writers are not PDF documents: they construct the file
  # format and then write it. Keep the individual markers as incomplete
  # evidence and emit the analyst-useful capability only for the combination.
  - id: python-pdf-header-marker
    desc: Python PDF header marker
    crit: component
    conf: 0.9
    for: [python]
    if:
      type: literal
      substr: "%PDF-"

  - id: python-pdf-xref-marker
    desc: Python PDF cross-reference marker
    crit: component
    conf: 0.9
    for: [python]
    if:
      type: literal
      substr: startxref

composite_rules:
  - id: pdf-text-show-operator
    desc: PDF decoded stream shows text
    crit: notable
    conf: 0.94
    for: [pdf]
    any:
      - id: pdf-literal-text-show-operator
      - id: pdf-array-text-show-operator

  - id: pdf-near-white-tiny-text-block
    desc: PDF conceals text with tiny near-white styling
    crit: suspicious
    conf: 0.97
    for: [pdf]
    all:
      - id: pdf-tiny-text-font
      - id: pdf-text-show-operator
    any:
      - id: pdf-near-white-rgb-fill
      - id: pdf-near-white-grayscale-fill
    needs: 1

  - id: python-manual-pdf-serialization
    desc: Python serializes PDF bytes
    crit: notable
    conf: 0.93
    for: [python]
    all:
      - id: python-pdf-header-marker
      - id: python-pdf-xref-marker
    any:
      - id: micro-behaviors/fs/write/file/direct::python-pathlib-write-bytes
      - id: micro-behaviors/fs/write/file/direct::python-open-write-binary
