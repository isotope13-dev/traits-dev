defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.85
traits:
  - id: bech32-validation-regex-literal
    desc: Bitcoin bech32 validation regex literal
    if:
      type: text
      regex: '\^\(?bc1\[a-z0-9\]\{25,|\^\(?(bc1\|\[13\])'
  - id: ethereum-validation-regex-literal
    desc: Ethereum validation regex literal
    if:
      type: raw
      regex: '\^\(?0x\[a-fA-F0-9\]\{40\}'
  - id: tron-validation-regex-literal
    desc: Tron validation regex literal
    if:
      type: text
      regex: '\^T\[[A-Za-z0-9_-]{2,30}\]\{33\}'
  - id: monero-validation-regex-literal
    desc: Monero validation regex literal
    if:
      type: text
      regex: '\^[48][^\r\n]{1,30}\{93\}'
  - id: litecoin-validation-regex-literal
    desc: Litecoin validation regex literal
    if:
      type: text
      regex: '\^\(?(\[LM3\]|L\|M\|ltc1)'
  - id: base58-legacy-btc-validation-regex-literal
    desc: Legacy Bitcoin validation regex literal
    if:
      type: text
      substr: '^(1|3)[a-km-zA-HJ-NP-Z1-9]{25,34}'
composite_rules:
  - id: multi-chain-address-validation-regex-set
    desc: Validation regex literals for three or more chains
    crit: notable
    conf: 0.85
    needs: 3
    any:
      - id: bech32-validation-regex-literal
      - id: ethereum-validation-regex-literal
      - id: tron-validation-regex-literal
      - id: monero-validation-regex-literal
      - id: litecoin-validation-regex-literal
      - id: base58-legacy-btc-validation-regex-literal
