---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.8
traits:
- for:
  - python
  - javascript
  - powershell
  - shell
  id: wallet-address-btc-marker
  desc: Bitcoin wallet address literal
  if:
    type: text
    regex: "\\b(wallet|address)\\b.{0,80}\\b[13][a-km-zA-HJ-NP-Z1-9]{25,34}\\b"
    is: bitcoin_addr
- for:
  - javascript
  id: js-wallet-address-btc
  desc: JavaScript named Bitcoin address
  if:
    type: text
    regex: "\\b(wallet|address)\\b[\\s\\S]{0,100}\\b[13][a-km-zA-HJ-NP-Z1-9]{25,34}\\b"
    is: bitcoin_addr
