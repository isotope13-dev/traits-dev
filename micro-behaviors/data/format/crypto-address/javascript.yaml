defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
- id: hardcoded-eth-wallet-constant
  desc: Defines hardcoded Ethereum address constant
  if:
    type: text
    regex: '\b[A-Z][A-Z0-9_]*(WALLET|RECIPIENT|ADDRESS)[A-Z0-9_]*\s*=\s*["'']0x[a-fA-F0-9]{40}["'']'
  not:
    - regex: '0x0{40}'
    - regex: '(?i)0xf{39}e'
    - regex: '\b(SYSTEM|ZERO|NULL|DEAD|BURN|EMPTY)_ADDRESS\b'
