defaults:
  platforms: [linux, macos, windows]
  for: [scripts, pe, elf, macho]

traits:
- id: monero-wallet-4
  desc: Monero wallet value with marker
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?i)(wallet|xmr|monero|address)[\s:=\"']{0,16}4[1-9A-HJ-NP-Za-km-z]{94}\b
- id: monero-wallet-8
  desc: Monero subaddress value with marker
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?i)(wallet|xmr|monero|address)[\s:=\"']{0,16}8[1-9A-HJ-NP-Za-km-z]{94}\b
# HTML carriers hide the label-to-address gap behind markup (an anchor close
# tag, a bold open tag); a currency label followed across those few tags by a
# 94/95-character base58 address is the same labeled-address fact.
- id: monero-wallet-4-markup-gap
  desc: Labeled Monero address across HTML markup
  for: [html]
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?i)(xmr|monero)(</?[a-z0-9]+>|[\s:=\"''>]){0,20}4[1-9A-HJ-NP-Za-km-z]{94}\b'
- id: monero-wallet-8-markup-gap
  desc: Labeled Monero subaddress across HTML markup
  for: [html]
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?i)(xmr|monero)(</?[a-z0-9]+>|[\s:=\"''>]){0,20}8[1-9A-HJ-NP-Za-km-z]{94}\b'
composite_rules:
- id: marked-monero-wallet
  desc: Monero-shaped address beside a wallet or currency label
  crit: notable
  conf: 0.8
  any:
  - id: monero-wallet-4
  - id: monero-wallet-8
  - id: monero-wallet-4-markup-gap
  - id: monero-wallet-8-markup-gap
