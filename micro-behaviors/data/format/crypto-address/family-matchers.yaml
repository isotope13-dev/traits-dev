# Address family recognition does not establish transfer hijacking.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, php, ruby, shell, go, rust]

composite_rules:
  # Grouped by chain family so the table below references three matchers rather
  # than nine, and so an analyst sees which families a file can recognise.
  - id: btc-family-address-matcher
    desc: Matches Bitcoin-family addresses
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/data/format/crypto-address::btc-base58-range-regex
      - id: micro-behaviors/data/format/crypto-address::btc-bech32-regex
      - id: micro-behaviors/data/format/crypto-address::bch-address-regex
  - id: account-model-address-matcher
    desc: Matches account-model chain addresses
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/data/format/crypto-address::eth-address-regex
      - id: micro-behaviors/data/format/crypto-address::trx-address-regex
      - id: micro-behaviors/data/format/crypto-address::sol-address-regex
  - id: altcoin-address-matcher
    desc: Matches alternative-coin addresses
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/data/format/crypto-address::ltc-address-regex
      - id: micro-behaviors/data/format/crypto-address::xmr-address-regex
      - id: micro-behaviors/data/format/crypto-address::doge-address-regex

  - id: multi-chain-address-matcher-table
    desc: Address matchers for several chains
    crit: notable
    conf: 0.92
    scope: file
    any:
      - id: btc-family-address-matcher
      - id: account-model-address-matcher
      - id: altcoin-address-matcher
    needs: 2
    unless:
      # Test-file guards, deliberately NOT the fixture-directory context:
      # the validation corpus itself lives under testdata/, and a directory
      # reference here would suppress the rule on every fixture too.
      - id: metadata/package/testing/presence/harness::test-directory
      - id: "metadata/file/naming::test-directory-component"
      - id: well-known/app/finance/myetherwallet/
