---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - javascript
  conf: 0.8
  id: javascript-ethereum-address-reference
  desc: JavaScript named Ethereum address
  unless:
  - id: well-known/lib/crypto/ethjs-format::ethjs-format-library
  - id: well-known/lib/crypto/ethjs-contract::ethjs-contract-library
  - id: well-known/lib/crypto/metamask-core::metamask-core-library
  if:
    type: text
    regex: "\\b(wallet|address)\\b[\\s\\S]{0,100}0x[a-fA-F0-9]{40}"
  not:
  - regex: 0x0{40}
  - regex: 0x1{40}
  - regex: 0x[fF]{40}
  - regex: '(?i)0x1234567890abcdef'
