traits:
- id: ethereum-address-variable-assignment
  desc: Address variable assigned an Ethereum address
  if:
    type: text
    regex: address\s*=\s*["\'"]0x[a-fA-F0-9]{40}
  not:
  - regex: 0x0{40}
  - regex: 0x1{40}
  - regex: 0x[fF]{40}
  - regex: (?i)0x1234567890abcdef
- id: ethereum-wallet-variable-assignment
  desc: Wallet/address assigned an Ethereum address
  if:
    type: text
    regex: (?i)\b(wallet|address)\b\s*=\s*["']0x[a-fA-F0-9]{40}
  not:
  - regex: 0x0{40}
  - regex: 0x1{40}
  - regex: 0x[fF]{40}
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - powershell
  - shell
  crit: notable
  conf: 0.8
