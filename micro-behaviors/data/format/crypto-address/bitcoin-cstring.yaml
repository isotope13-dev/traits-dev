defaults:
  platforms: [unix, windows]
  for: [scripts, pe, macho]

traits:
  - id: btc-address-hardcoded
    desc: Bitcoin address-shaped text in cstring
    crit: baseline
    conf: 0.7
    if:
      type: text
      regex: \b(1|3)[1-9A-HJ-NP-Za-km-z]{25,34}\b
      section: __cstring
    not:
      - regex: ^\\.\\?\\?@
      - regex: '[13][A-Fa-f0-9]{25,34}'
      - regex: ^[13]([A-Z][a-z0-9]+){2,}$
      - regex: (.)\1\1\1
      - substr: _ZN
      - substr: ::h
