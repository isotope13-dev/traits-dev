defaults:
  platforms: [linux, macos, windows]
  for: [html, javascript, typescript]
  conf: 0.9

traits:
- id: ethereum-address-literal
  desc: Ethereum address literal or matching regex
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)(/0x\[a-f0-9\]\{40\}/|\b0x[a-f0-9]{40}\b)'
  not:
    - regex: '(?i)\b0x0{40}\b'
    # Numeric constants, not addresses: bignum/math libraries render large
    # powers as hex words padded with long zero runs; uniform-random
    # addresses never carry 12+ trailing zero nibbles.
    - regex: '(?i)\b0x[a-f0-9]{8,}0{12,}\b'
