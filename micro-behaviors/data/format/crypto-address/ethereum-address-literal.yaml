defaults:
  platforms: [linux, macos, windows]
  for: [html, javascript, typescript]
  conf: 0.9

traits:
- id: ethereum-address-literal
  desc: Ethereum address literal
  crit: notable
  conf: 0.9
  unless:
    - id: well-known/lib/data/subsquid::subsquid-evm-validation-schema-module
    - id: well-known/lib/crypto/ethjs-format::ethjs-format-library
    - id: well-known/lib/crypto/ethjs-contract::ethjs-contract-library
    - id: well-known/lib/crypto/metamask-core::metamask-core-library
  if:
    type: text
    regex: '(?i)\b0x[a-f0-9]{40}\b'
  not:
    - regex: '(?i)\b0x0{40}\b'
