# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  for:
  - scripts
  - source
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: gsql-print-to-file
  desc: GSQL PRINT TO_CSV file-output statement
  conf: 0.98
  if:
    type: string_literal
    regex: (?i)(^|[;{])\s*PRINT\s+\w+\s+TO_CSV\s+\w+\s*;
composite_rules:
- id: remote-file-query-submit
  desc: GSQL file-output query with submission endpoint
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/data/db/query::gsql-file-content-query-parameters
  - id: micro-behaviors/data/format/csv/export::gsql-print-to-file
  - id: micro-behaviors/communications/http/request/route::gsql-statements-api
  near_bytes: 2048
