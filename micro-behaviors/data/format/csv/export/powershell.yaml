# PowerShell's object-to-CSV serializer. The call is a neutral data-formatting
# capability; objectives decide whether the objects being exported are
# sensitive or were gathered through reconnaissance.
defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.95

traits:
  - id: powershell-export-csv-call
    desc: PowerShell serializes objects to CSV
    if:
      type: symbol
      kind: call
      exact: Export-Csv

  - id: powershell-convertto-csv-call
    desc: PowerShell converts objects to CSV
    if:
      type: symbol
      kind: call
      exact: ConvertTo-Csv
