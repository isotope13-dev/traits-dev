defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, csharp]
  crit: notable
  conf: 0.85

traits:
  - id: base64-password-element
    desc: Base64 password XML element
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: <Pass encoding="base64">[^<]{4,}</Pass>
    unless:
      - id: well-known/tool/detection/security-scanner::titus-defensive-secret-scanner-context
