defaults:
  for: [python, javascript, shell]
  platforms: [unix, windows]
traits:
  - id: x2t-source-path-element
    desc: X2T source-path task element
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: '<m_sFileFrom>'
  - id: x2t-destination-path-element
    desc: X2T destination-path task element
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: '<m_sFileTo>'
  - id: x2t-zip-format-element
    desc: X2T ZIP source-format task element
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '<m_nFormatFrom>\s*2057\s*</m_nFormatFrom>'
