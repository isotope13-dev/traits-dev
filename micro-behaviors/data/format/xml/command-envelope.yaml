defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: xml-attack-command-envelope
  desc: XML Attack command envelope delimiters
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: text
    regex: ^</?Attack>$
    section: .text
- id: xml-download-command-envelope
  desc: XML Download command envelope delimiters
  crit: notable
  conf: 0.95
  count_min: 2
  if:
    type: text
    regex: ^</?Download>$
    section: .text
- id: xml-xcommand-close-tag
  desc: xCommand task-envelope closing tag
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: </xCommand>
    section: .text
