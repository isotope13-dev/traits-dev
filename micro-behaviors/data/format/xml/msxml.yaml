traits:
- for:
  - python
  - javascript
  - powershell
  - pe
  - oledoc
  - ooxml
  - vbs
  - html
  id: msxml-datatype-bin-base64
  desc: Sets XML node type to bin.base64
  conf: 0.9
  if:
    type: text
    regex: (?i)dataType\s*=\s*['"]bin\.base64['"]
- for:
  - javascript
  - vbs
  - powershell
  - pe
  - oledoc
  - ooxml
  - mp3
  id: msxml-bin-base64-token
  desc: References XML bin.base64 data type
  conf: 0.9
  if:
    type: text
    substr: bin.base64
    case_insensitive: true
- for:
  - javascript
  - vbs
  - powershell
  - pe
  - oledoc
  - ooxml
  - mp3
  id: msxml-node-typed-value
  desc: References XML nodeTypedValue property
  conf: 0.9
  if:
    type: text
    substr: nodeTypedValue
    case_insensitive: true
- for:
  - oledoc
  - ooxml
  id: node-typed-value-in-document
  desc: nodeTypedValue reference in document bytes
  conf: 0.94
  if:
    type: raw
    regex: (?i)NodeTypedValue
  unless:
  - id: well-known/tool/offensive/metasploit::framework-context
composite_rules:
- for:
  - python
  - javascript
  - powershell
  - pe
  - oledoc
  - ooxml
  id: base64data-element-and-type
  desc: Base64Data element and bin.base64 type
  conf: 0.95
  all:
  - id: micro-behaviors/data/collection/dom::create-element-base64data
  - id: micro-behaviors/data/format/xml::msxml-datatype-bin-base64
- for:
  - javascript
  - vbs
  - powershell
  - pe
  - oledoc
  - ooxml
  id: msxml-base64-type-and-value
  desc: MSXML Base64 type and typed-value references
  conf: 0.86
  all:
  - id: micro-behaviors/data/parse/xml::msxml-domdocument-progid
  - id: micro-behaviors/data/format/xml::msxml-bin-base64-token
  - id: micro-behaviors/data/format/xml::msxml-node-typed-value
- for:
  - oledoc
  - ooxml
  id: document-base64-type-and-value
  desc: XML type and value tokens in document bytes
  conf: 0.96
  all:
  - id: micro-behaviors/data/format/xml::msxml-bin-base64-token
  - id: micro-behaviors/data/parse/xml::domdocument-token-in-document
  - id: micro-behaviors/data/format/xml::node-typed-value-in-document
defaults:
  platforms:
  - windows
  crit: notable
