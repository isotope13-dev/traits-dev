defaults:
  for: [php, html, text]
  platforms: [windows, unix]
traits:
  - id: htmlview-param-element
    desc: Markup declares an HTMLView parameter
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '<param\b[^>]{0,80}\bname\s*=\s*["'']HTMLView["'']'
      case_insensitive: true
