defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: unsigned-pe-parser-memory-api-set
    desc: Unsigned PE parser with memory and resolver APIs
    crit: notable
    conf: 0.9
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
      - id: micro-behaviors/data/format/pe-parser::inline-pe-signature-check
      - id: micro-behaviors/data/format/pe-parser::x64-mov-e-lfanew-read
      - id: micro-behaviors/mem/combined::virtual-memory-allocation-protection-api-pair
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
