# C declarations of the PE-COFF on-disk structures. Anything that reads or
# writes PE files -- linkers, packers, AV engines, debuggers, YARA's pe module
# -- declares these; the capability is "this code models the PE format".
#
# Relocated from objectives/command-and-control/dropper/execution/loader
# (2026-08), where a struct typedef claimed dropper-loader intent and fired on
# libyara/include/yara/pe.h. Both atoms were only ever used from an `unless:`
# clause there, i.e. as evidence that a file is a PE *parser*; that composite
# now references them across directories.
defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.9

traits:
  - id: image-file-header-reference
    desc: References IMAGE_FILE_HEADER
    if:
      type: text
      word: IMAGE_FILE_HEADER

  - id: coff-symbol-table-reference
    desc: Reads COFF symbol table fields
    conf: 0.94
    if:
      type: text
      regex: '\bIMAGE_SYMBOL\b[^;\r\n]{0,180}\bPointerToSymbolTable\b'

  - id: coff-module-init-symbol-lookup
    desc: Looks up module_init in COFF symbols
    conf: 0.97
    if:
      type: text
      regex: '(?s)\b(PointerToSymbolTable|NumberOfSymbols)\b.{0,900}["'']module_init["'']'

  - id: image-nt-headers-typedef
    desc: Declares the IMAGE_NT_HEADERS structure
    if:
      type: text
      substr: typedef struct _IMAGE_NT_HEADERS

  - id: image-section-header-typedef
    desc: Declares the IMAGE_SECTION_HEADER structure
    if:
      type: text
      substr: typedef struct _IMAGE_SECTION_HEADER

composite_rules:
  - id: coff-symbol-table-parser-source
    desc: Parses COFF sections and symbols
    conf: 0.97
    near_bytes: 2048
    all:
      - id: image-file-header-reference
      - id: micro-behaviors/fs/file/section::image-section-header-reference
      - id: coff-symbol-table-reference
