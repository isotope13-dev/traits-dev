defaults:
  for: [pe, dll]
  platforms: [windows]

composite_rules:
- id: dynamic-wininet-pe-parser
  desc: PE parsing, dynamic WinInet and indirect calls
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/client/wininet::internet-open-url-a-name
  - id: micro-behaviors/data/format/pe-parser::inline-pe-signature-check
  - id: micro-behaviors/data/control-flow/dispatch/indirect::indirect-call-r13-x64
  any:
  - id: micro-behaviors/mem/alloc/executable::executable-allocation-indicator
  - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
