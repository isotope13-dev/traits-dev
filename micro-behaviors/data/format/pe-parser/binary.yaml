# Neutral PE-format structure references found in binaries. These are common in
# parsers, debuggers, packers, and loaders; intent-bearing composites add the
# surrounding execution or injection evidence.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: nt-headers-structure-reference
    desc: References PE NT header structure
    if:
      type: text
      regex: '\b(IMAGE_NT_HEADERS(32|64)?|NT_HEADERS(32|64)?)\b'

  - id: mz-nop-header-scan
    desc: Bounded bytewise scan for MZ-NOP header
    conf: 0.97
    arch: [x86]
    if:
      type: hex
      # Compare, advance the input pointer and counter, then loop while the
      # counter is below its bound. A lone magic comparison is not a scan.
      pattern: 81 38 4D 5A 90 00 74 ?? 40 41 81 F9 ?? ?? ?? ?? 7C EE
      offset_range: [0, null]

  # Moved from objectives/anti-static/obfuscation/imports: the MSVC CRT and
  # every PE loader read these fields, so they are PE-parsing observations;
  # the API-hashing and manual-map composites supply the intent.
  - id: pe-header-walk-x64
    desc: Reads PE e_lfanew using x64 movsxd
    crit: notable
    conf: 0.75
    arch: [x86-64]
    if:
      type: hex
      section: text
      pattern: 48 63 ?? 3C
    unless:
    - id: well-known/app/
    - id: well-known/lib/
    - id: well-known/tool/
  - id: mz-magic-check
    desc: Loads MZ header magic in code
    crit: notable
    conf: 0.85
    for: [pe]
    arch: [x86, x86-64]
    size_max: 524288
    if:
      type: hex
      section: text
      pattern: B8 4D 5A 00 00
    unless:
    - id: well-known/app/
    - id: well-known/lib/
    - id: well-known/tool/
