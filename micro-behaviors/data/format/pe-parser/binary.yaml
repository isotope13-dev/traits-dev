defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
  conf: 0.9
traits:
- id: nt-headers-structure-reference
  desc: References PE NT header structure
  if:
    type: text
    regex: \b(IMAGE_NT_HEADERS(32|64)?|NT_HEADERS(32|64)?)\b
- id: mz-nop-header-scan
  desc: Bounded bytewise scan for MZ-NOP header
  conf: 0.97
  arch:
  - x86
  if:
    type: hex
    pattern: 81 38 4D 5A 90 00 74 ?? 40 41 81 F9 ?? ?? ?? ?? 7C EE
    offset_range:
    - 0
    - null
- id: mz-magic-check
  desc: Loads MZ header magic in code
  conf: 0.85
  for:
  - pe
  arch:
  - x86
  - x86-64
  size_max: 524288
  if:
    type: hex
    section: text
    pattern: B8 4D 5A 00 00
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
