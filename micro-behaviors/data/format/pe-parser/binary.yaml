# Neutral PE-format structure references found in binaries. These are common in
# parsers, debuggers, packers, and loaders; intent-bearing composites add the
# surrounding execution or injection evidence.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: nt-headers-structure-reference
    desc: References PE NT header structure
    if:
      type: text
      regex: '\b(IMAGE_NT_HEADERS(32|64)?|NT_HEADERS(32|64)?)\b'

  - id: mz-nop-header-scan
    desc: Scans for MZ-NOP PE header
    conf: 0.9
    if:
      type: hex
      pattern: 81 38 4D 5A 90 00
      offset_range: [0, null]
