defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
- id: inline-pe-signature-check
  desc: Inline PE signature validation constant
  crit: notable
  conf: 0.85
  for:
  - pe
  if:
    type: hex
    section: .text
    pattern: '81 3C ?? 50 45 00 00'
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: x64-mov-e-lfanew-read
  desc: x64 offset-0x3c read near PE signature check
  crit: notable
  conf: 0.9
  arch:
  - x86-64
  if:
    type: hex
    section: .text
    # A structure field at 0x3c alone is not e_lfanew. Require a nearby
    # PE-signature comparison as well; CRT locale structures use 0x3c too.
    pattern: 41 8B (40|41|42|43|45|46|47|48|49|4A|4B|4D|4E|4F|50|51|52|53|55|56|57|58|59|5A|5B|5D|5E|5F|60|61|62|63|65|66|67|68|69|6A|6B|6D|6E|6F|70|71|72|73|75|76|77|78|79|7A|7B|7D|7E|7F) 3C [0-32] 81 (38|39|3A|3B|3E|3F) 50 45 00 00
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
