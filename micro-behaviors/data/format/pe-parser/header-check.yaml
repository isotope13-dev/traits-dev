defaults:
  for:
  - pe
  platforms:
  - unix
  - windows
traits:
- size_max: 52428800
  id: pe-header-compare-immediate-multiple
  desc: MZ and PE constants within code
  crit: notable
  conf: 0.8
  if:
    type: raw
    section: .text
    regex: MZ\x00\x00.{0,48}PE\x00\x00
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- size_max: 52428800
  id: inline-mz-magic-check
  desc: x86 MZ validation constant instruction
  crit: notable
  conf: 0.85
  if:
    type: hex
    section: .text
    pattern: B8 4D 5A 00 00
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
