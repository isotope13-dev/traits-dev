defaults:
  for:
  - pe
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: upx0-pe-header-validation
  desc: PE header validation in UPX0 code
  conf: 0.99
  if:
    type: hex
    section: UPX0
    pattern: 4D 5A 74 03 33 C0 C3 8B 41 3C 03 C1 81 38 50 45 00 00
- size_max: 52428800
  id: pe-header-compare-immediate-multiple
  desc: MZ and PE constants within code
  conf: 0.8
  if:
    type: raw
    section: .text
    regex: MZ\x00\x00.{0,48}PE\x00\x00
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- size_max: 52428800
  id: inline-mz-magic-check
  desc: x86 MZ validation constant instruction
  conf: 0.85
  if:
    type: hex
    section: .text
    pattern: B8 4D 5A 00 00
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
