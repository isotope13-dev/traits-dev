defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
composite_rules:
  - id: unsigned-pe-parser-debugger-api-set
    desc: Unsigned PE parser with debugger API import
    crit: notable
    conf: 0.9
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
      - id: micro-behaviors/data/format/pe-parser::inline-pe-signature-check
      - id: micro-behaviors/data/format/pe-parser::x64-mov-e-lfanew-read
      - id: metadata/file/profile/memory-protection-context::virtual-memory-allocation-protection-api-pair
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
