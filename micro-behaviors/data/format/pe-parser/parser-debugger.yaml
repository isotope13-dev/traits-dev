defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: unsigned-pe-parser-debugger-api-set
  desc: Unsigned PE parser with debugger API import
  crit: notable
  conf: 0.9
  all:
    - id: metadata/signed/trust-level::unsigned-missing-signature-record
    - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
    - id: micro-behaviors/data/embedded/payload/header::inline-pe-signature-check
    - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-walk-x64
    - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair
    - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  unless:
    - id: metadata/signed/platform/
    - id: metadata/binary/installer/family/
    - id: metadata/binary/framework::dotnet-metadata
    # NativeAOT runtime support supplies both the PE-mapping primitives and
    # debugger API without implying debugger-gated application behavior.
    - id: metadata/lang/compiler/aot::nativeaot-runtime-markers
    - id: metadata/lang/compiled::rust-backtrace-symbolizer
    - id: well-known/app/
    - id: well-known/game/mod/
    - id: well-known/lib/
    - id: well-known/tool/
