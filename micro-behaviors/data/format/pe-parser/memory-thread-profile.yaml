defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: pe-header-memory-thread-api-profile
    desc: PE header constants and reads coexist with memory and thread APIs
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
      - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
  # These independent matches do not bind parsed bytes to an allocation or
  # thread entry, and establish neither remote injection nor evasion.
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/protect/modify/api-reference::integer-loads-protection-thread-apis
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/process/thread/create::create-thread
