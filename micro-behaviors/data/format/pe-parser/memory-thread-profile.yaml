defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
- id: pe-header-memory-thread-api-profile
  desc: PE header constants and reads coexist with memory and thread APIs
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
  - id: micro-behaviors/data/format/pe-parser::pe-header-walk-x64
  # These independent matches do not bind parsed bytes to an allocation or
  # thread entry, and establish neither remote injection nor evasion.
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  - id: micro-behaviors/mem/protect/modify::integer-loads-protection-thread-apis
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: micro-behaviors/process/create/thread::create-thread
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework::dotnet-metadata
  - id: well-known/tool/reverse-engineering/
  # Compiler tools also inspect image headers and use worker threads.
  - id: well-known/tool/development/build/cmake::cmake-toolchain-context
