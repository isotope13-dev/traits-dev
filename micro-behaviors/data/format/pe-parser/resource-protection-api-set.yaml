# These independent matches establish co-occurrence, not payload data flow,
# encryption, execution of resource bytes, or malware identity.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
- id: high-entropy-resource-pe-validation-api-set
  desc: PE validation and protection APIs with high-entropy resources
  crit: notable
  conf: 0.97
  size_min: 131072
  all:
  - id: metadata/binary/section/permission::very-high-entropy-rsrc-section
  - id: metadata/binary/instruction/operand::mz-words-in-code
  - id: micro-behaviors/data/format/pe-parser::inline-pe-signature-check
  - id: metadata/binary/layout/checksum::pe-checksum-mismatch
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/

