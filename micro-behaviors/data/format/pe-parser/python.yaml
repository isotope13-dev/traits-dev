# Python scripts that read e_lfanew (the PE header offset at 0x3C) with struct.
defaults:
  platforms: [windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-struct-read-e-lfanew
    desc: Reads PE e_lfanew at 0x3C via struct
    if:
      type: text
      regex: 'unpack_from\(\s*["''][<=]?[LIl]["'']\s*,\s*\w+\s*,\s*0x3[Cc]\s*\)'
