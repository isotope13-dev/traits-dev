defaults:
  platforms: [windows]
  for: [scripts, source]
traits:
  - id: pe-relocations-marked-stripped
    desc: Marks PE relocations as stripped
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'Characteristics\s*\|=\s*[^\n;]{0,80}IMAGE_FILE_RELOCS_STRIPPED'
  # A relocation block entry is 16 bits: type in the top 4, page offset in
  # the low 12. Shifting right by 12 and comparing with 10
  # (IMAGE_REL_BASED_DIR64) or 3 (IMAGE_REL_BASED_HIGHLOW) is the type
  # dispatch every manual PE mapper performs. Page-number arithmetic shifts by
  # 12 too, but does not compare the result against a relocation type.
  - id: x86-base-relocation-type-dispatch
    desc: Native code dispatches PE relocation types
    crit: notable
    conf: 0.85
    for: [pe, dll]
    if:
      type: hex
      section: .text
      pattern: "(66 C1 E? 0C | C1 E? 0C) [0-16] (66 83 F? | 83 F? | 3C) (0A|03) 7?"
