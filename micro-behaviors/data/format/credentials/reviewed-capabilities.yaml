traits:
- platforms:
  - windows
  - macos
  - linux
  for:
  - javascript
  - typescript
  - python
  - pe
  - elf
  - macho
  id: discord-token-shaped-text
  desc: Discord token-shaped text
  conf: 0.75
  if:
    type: text
    regex: (^|[^A-Za-z0-9_-])[A-Za-z0-9_-]{24}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27}([^A-Za-z0-9_-]|$)
- platforms: &id001
  - unix
  - windows
  for: &id002
  - scripts
  - binaries
  id: groq-key-shaped-literal
  desc: Quoted Groq API key-shaped text
  conf: 0.93
  if:
    type: text
    regex: '["'']gsk_[A-Za-z0-9]{20,}["'']'
  not:
    - regex: '(?i)gsk_[A-Za-z0-9]*(Example|Test|Fake|Placeholder|Sample)'
- platforms: *id001
  for: *id002
  id: huggingface-token-shaped-literal
  desc: Quoted Hugging Face token-shaped text
  conf: 0.93
  if:
    type: text
    regex: '["'']hf_[A-Za-z0-9]{20,}["'']'
  not:
    - regex: '(?i)hf_[A-Za-z0-9]*(Example|Test|Fake|Placeholder|Sample)'
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  id: vault-token-shaped-text
  desc: HashiCorp Vault token-shaped text
  conf: 0.9
  if:
    type: text
    regex: \bhv[sbr]\.[A-Za-z0-9_-]{24,}
  unless:
  - id: metadata/build/bundler/vscode::vscode-extension-generated-asset
defaults:
  crit: notable
