defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  # Bare USER_TOKEN is a config field name. Discord selfbots are the
  # composites that also require the users/@me call or a webhook post.
  - id: user-token-config-field
    desc: USER_TOKEN configuration field
    if:
      type: text
      word: USER_TOKEN
