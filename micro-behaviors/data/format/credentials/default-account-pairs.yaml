# Credential-shaped text, including decoded Basic-auth values, proves neither
# SSH use nor password guessing. Preserve the pair evidence for consumers.
defaults:
  platforms: [unix, windows]
traits:
- id: admin-1234-cred
  desc: Delimited admin:1234 credential text
  crit: notable
  for: [python, javascript, powershell, pe, elf]
  unless:
    - id: well-known/tool/offensive/pentestkit/
  conf: 0.7
  if:
    type: text
    regex: '(^|[^A-Za-z0-9_])admin:1234([^A-Za-z0-9_]|$)'

- id: common-account-weak-password-pair
  desc: Delimited common account and weak password text
  crit: notable
  conf: 0.86
  for: [scripts]
  if:
    type: text
    # Trailing ||/&& is folded into the span so the `not:` below can tell
    # a code fallback (`user: user || 'anon'`) from a static pair. The
    # regex engine has no lookaround, so this cannot be an assertion.
    # A pair needs a list separator (colon, comma, tab); 'admin password'
    # with only a space between is documentation prose.
    regex: '\b(admin|operator|root)\b[ \t]*[,:|\t][ \t,:|]{0,10}\b(password|1234)\b(\s*(\|\||&&))?'
    case_insensitive: true
  unless:
    - id: metadata/package/testing/corpus::inert-security-input-module
    - id: metadata/build/recognized-contexts::password-strength-blocklist-context
    - id: well-known/lib/ai/pyaigis/
    - id: well-known/tool/detection/llm-scanner/
    - id: well-known/tool/detection/security-scanner/
  not:
    - regex: '(?i)\b(admin|operator|root)\b\s*[/|]'
    # `user: password || 'anon'` is a default expression, not a pair.
    - regex: '(?i)\b(password|1234)\s*(\|\||&&)'

