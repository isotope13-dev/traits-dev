# Reviewed source observations; no malicious intent is implied.
defaults:
  platforms:
  - unix
  - windows
traits:
- for:
  - javascript
  - typescript
  size_min: 64
  id: slack-secret-env-name
  desc: Slack token env name or xox prefix
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    regex: ^SLACK_(BOT_TOKEN|TOKEN|API_KEY)$|xox[baprs]-[0-9A-Za-z]{8,}
- for:
  - javascript
  - typescript
  size_min: 64
  id: vault-secret-env-name
  desc: Vault token env name or hvs prefix
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    regex: ^VAULT_TOKEN$|hvs\.[A-Za-z0-9]{20,}
composite_rules:
- for:
  - documents
  - scripts
  - source
  - manifests
  - markdown
  - text
  - html
  id: api-key-near-chat-submission-wording
  desc: API-key and chat-submission wording co-occur
  crit: component
  conf: 0.9
  near_bytes: 160
  all:
  - id: micro-behaviors/data/format/credentials::api-key-mention
  any:
  - id: metadata/lang/natural/phrasing::send-paste-near-chat-wording
  - id: metadata/lang/natural/phrasing::chat-before-send-paste-wording
  - id: metadata/lang/natural/phrasing::send-paste-to-agent-wording
  - id: metadata/lang/natural/phrasing::agent-before-send-paste-wording
  - id: metadata/lang/natural/phrasing::send-paste-to-assistant-wording
- for:
  - markdown
  - text
  - documents
  id: api-key-chat-submission-prompt
  desc: API-key and chat-submission wording co-occur
  crit: notable
  conf: 0.92
  near_bytes: 160
  unless:
  - id: well-known/app/ai/coding-agent/bandit-stealth::bandit-stealth-extension-context
  all:
  - id: micro-behaviors/data/format/credentials::api-key-mention
  - id: micro-behaviors/data/format/credentials::api-key-near-chat-submission-wording
