defaults:
  platforms: [unix, windows]
  for: [python]

traits:
- id: python-groq-api-key-argument
  desc: Groq client takes an API key
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: Groq\(\s*api_key\s*=

composite_rules:
- id: python-groq-client-key-cooccurrence
  desc: Groq key literal and key argument coexist
  crit: notable
  conf: 0.96
  scope: file
  all:
  - id: micro-behaviors/data/format/credentials::groq-key-shaped-literal
  - id: python-groq-api-key-argument
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
  - id: micro-behaviors/data/string/redact::sensitive-data-scanner
