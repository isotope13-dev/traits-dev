traits:
- id: admin-admin-pair
  desc: Text references the admin:admin credential pair
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: (^|[^A-Za-z0-9_])admin:admin([^A-Za-z0-9_]|$)
  unless:
  - id: well-known/tool/offensive/pentestkit/
  - id: well-known/tool/offensive/bbot::package-tree-member
  - id: well-known/tool/offensive/decepticon::package-tree-member
  - id: well-known/tool/offensive/nmap::nmap-source-tree
  - id: well-known/tool/sysadmin/netdoc-collector::netdoc-collector-library
  - id: metadata/package/testing/presence/harness::python-test-file
  - type: text
    substr: Defaulting to admin:admin
  - type: text
    substr: default admin:admin
- id: guest-guest-pair
  desc: Text references the guest:guest credential pair
  crit: notable
  unless:
  - id: well-known/tool/offensive/pentestkit/
  - id: well-known/tool/offensive/bbot::package-tree-member
  conf: 0.7
  if:
    type: text
    substr: guest:guest
  not:
  - regex: ://guest:guest@
defaults:
  for:
  - python
  - javascript
  - powershell
  - pe
  - elf
  platforms:
  - unix
  - windows
