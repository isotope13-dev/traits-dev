traits:
- id: admin-admin-pair
  desc: Text references the admin:admin credential pair
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: (^|[^A-Za-z0-9_])admin:admin([^A-Za-z0-9_]|$)
- id: guest-guest-pair
  desc: Text references the guest:guest credential pair
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: guest:guest
  not:
  - regex: ://guest:guest@
defaults:
  for:
  - python
  - javascript
  - powershell
  - pe
  - elf
  platforms:
  - unix
  - windows
