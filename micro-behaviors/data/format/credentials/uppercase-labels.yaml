defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: component
  conf: 0.45

traits:
- id: secret-upper
  desc: SECRET credential label
  if:
    type: text
    substr: SECRET
- id: token-upper
  desc: TOKEN credential label
  if:
    type: text
    regex: '\bTOKEN(_[A-Z0-9_]{1,48})?\s*[:=]'
- id: password-upper
  crit: component
  desc: PASSWORD credential label
  if:
    type: text
    regex: '\b([A-Z][A-Z0-9]{1,32}_PASSWORD|PASSWORD_[A-Z0-9_]{1,48})\b'

composite_rules:
- id: credential-label-upper
  desc: Uppercase credential label
  conf: 0.9
  any:
  - id: secret-upper
  - id: token-upper
  - id: password-upper
