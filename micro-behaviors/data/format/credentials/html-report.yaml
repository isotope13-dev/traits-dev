defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  - id: html-username-report-label
    desc: HTML username report field label
    conf: 0.97
    if:
      type: text
      exact: '<br>Username: '
      section: .text
  - id: html-password-report-label
    desc: HTML password report field label
    conf: 0.97
    if:
      type: text
      exact: '<br>Password: '
      section: .text
composite_rules:
  - id: html-credential-report-labels
    desc: HTML username and password report field labels
    conf: 0.97
    all:
      - id: html-username-report-label
      - id: html-password-report-label
