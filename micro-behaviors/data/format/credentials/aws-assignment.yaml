defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - -elf
  - -macho
  - -pe
  crit: suspicious
  conf: 0.85
traits:
- id: aws-key-assignment
  desc: AWS-shaped access key assignment
  if:
    type: text
    case_insensitive: true
    regex: (```\w*\nconst )?\baws[_-]access[_-]key([_-]id)?\s*[:=]\s*["']?AKIA[0-9A-Z]{16}
  not: &id001
  - regex: ^```
  - substr: AKIAIOSFODNN7EXAMPLE
  - regex: AKIA[0-9A-Z]{12}EXAMPLE
  - substr: AKIAI6X4TYCIXM2B7MUQ
  - substr: HONEYTOKEN
  # Issued key IDs are random; a run of 8+ identical characters marks a
  # hand-typed placeholder (secret-scanner fixtures such as AKIAZZ7NN7ZZZZZZZZZZ).
  - regex: AKIA[0-9A-Z]*(A{8}|B{8}|C{8}|D{8}|E{8}|F{8}|G{8}|H{8}|I{8}|J{8}|K{8}|L{8}|M{8})
  - regex: AKIA[0-9A-Z]*(N{8}|O{8}|P{8}|Q{8}|R{8}|S{8}|T{8}|U{8}|V{8}|W{8}|X{8}|Y{8}|Z{8})
  - regex: AKIA[0-9A-Z]*(0{8}|1{8}|2{8}|3{8}|4{8}|5{8}|6{8}|7{8}|8{8}|9{8})
  - regex: AKIA[0-9A-Z]*(012345|123456|234567|345678|456789|567890|678901|789012|890123|901234|987654|876543|765432|654321|543210|432109|321098|210987|109876|098765)
  unless: &id002
  - id: metadata/package/documentation/security-testing::python-rule-exploit-example
  - id: micro-behaviors/data/string/redact::sensitive-data-scanner
  - id: well-known/tool/detection/mcp-fence::context
  - id: well-known/tool/detection/xgrep::xgrep-scanner-context
  - id: well-known/tool/detection/llm-scanner::loom-canary-context
  - type: value
    path: elf.type
    exact: core
- id: native-aws-key-assignment
  desc: Native binary AWS-shaped key assignment
  for:
  - elf
  - macho
  - pe
  if:
    type: raw
    case_insensitive: true
    regex: (```\w*\nconst )?\baws[_-]access[_-]key([_-]id)?\s*[:=]\s*["']?AKIA[0-9A-Z]{16}
  not: *id001
  unless: *id002
- id: native-decoded-aws-key-assignment
  desc: Native decoded AWS-shaped key assignment
  for:
  - elf
  - macho
  - pe
  if:
    type: encoded
    case_insensitive: true
    regex: (```\w*\nconst )?\baws[_-]access[_-]key([_-]id)?\s*[:=]\s*["']?AKIA[0-9A-Z]{16}
  not: *id001
  unless: *id002
