traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  id: slack-xoxb-token
  desc: Hardcoded Slack bot OAuth token
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: xoxb-\d{10,}-\d{10,}-[a-zA-Z0-9]{20,}
  unless:
  - id: metadata/file/catalog/pattern-rules::secret-pattern-example-catalog
  - id: well-known/tool/detection/security-scanner::titus-defensive-secret-scanner-context
  - id: well-known/tool/sysadmin/atuin::atuin-binary
  - id: well-known/tool/detection/checkmarx::ast-scanner-pattern-catalog
  - id: well-known/tool/detection/xgrep::xgrep-scanner-context
  - id: metadata/package/testing/
  - id: metadata/package/testing/harness/fixture::secret-scanner-demo-context
  - id: metadata/path::test-directory-component
