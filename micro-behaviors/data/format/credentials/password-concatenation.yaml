defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]

traits:
  - id: password-labelled-value-concatenation
    desc: Password label concatenates a value expression
    crit: notable
    conf: 0.96
    # A literal/markup/record boundary excludes password error suffixes
    # and DOM IDs such as "new-password-".
    # The expression may encode the value or format authorized credentials;
    # this observation establishes neither plaintext nor a report or send.
    if:
      type: text
      regex: '(?i)["''>;|]\s*password\s*[:=](\s|<[^>\r\n]{1,40}>){0,5}["'']\s*\+\s*[\w$]+'
