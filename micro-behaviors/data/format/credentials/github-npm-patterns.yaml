defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: npm-token-regex-format
    desc: npm token regex pattern
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: npm_[A-Za-z0-9]{36,}

  - id: github-oauth-token-regex-pattern
    desc: GitHub OAuth token regex pattern
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bgh\[op\]_\[A-Za-z0-9\]\{36\}'

  - id: github-oauth-token-prefix-reference
    desc: GitHub OAuth token prefix marker
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: "gho_"

  - id: github-pat-regex-format
    desc: GitHub PAT regex pattern
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: ghp_[A-Za-z0-9]{36}
composite_rules:
  - id: github-token-pattern-reference
    desc: GitHub token pattern or prefix reference
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/data/format/credentials::github-pat-regex-format
      - id: micro-behaviors/data/format/credentials::github-oauth-token-prefix-reference
      - id: micro-behaviors/data/format/credentials::github-oauth-token-regex-pattern
