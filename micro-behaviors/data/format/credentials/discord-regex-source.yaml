traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - python
  - pe
  - dll
  crit: notable
  id: discord-token-regex-source
  desc: Discord token-shaped regex
  conf: 0.96
  if:
    type: text
    # Accept normal and source-escaped backslashes, plus the current variable
    # first-segment length. This is a format reference, not proof of theft.
    regex: '\[\\{1,2}w-\]\{24(,26)?\}\\{1,2}\.\[\\{1,2}w-\]\{6\}\\{1,2}\.\[\\{1,2}w-\]'
