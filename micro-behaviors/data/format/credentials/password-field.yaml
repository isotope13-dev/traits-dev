traits:
- id: password-value-text
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.8
  desc: Password-labelled quoted field value text
  if:
    type: text
    regex: \b(passwd|password)\b['"]?[ \t]{0,12}[:=][ \t]*['"][A-Za-z0-9._-]{3,}['"]
    case_insensitive: true
  not:
  - regex: ^-
  - regex: (?i)\bpassword[ \t]+is[ \t]+(passed|sent|provided|used)\b
  - regex: (?i)\b(passwd|password)\b.{0,12}(is|:|=)\s*['"]?%[a-z]
  - regex: (?i)\buser(name)?\s+password\s+isadmin\b
  - regex: (?i)password\s+in\s+\.netrc\s+is\b
  - regex: (?i)password\s+is\s+(bad|too|invalid|incorrect|required|empty|corrupt)\b
  - regex: (?i)\bpassword\b[ \t]{0,12}:[ \t]*['"]?(blank|null|none|empty)\b
  - regex: (?i)password\s+is\s+missing\b
  - regex: --password\s+request
  - regex: password\s+file
  - regex: password\s+given
  - regex: password\s+manager
  - regex: (?i)stored\s+password\s+is\s+corrupt
  - regex: (?i)master\s+password
  - regex: (?i)password\s+is\s+pswd\b
  - regex: (?i)password.{0,12}is\s+(unchanged|already)
  - regex: (?i)password\s*=\s*None\b
  - regex: (?i)password\s*:\s*Forgotten\b
  - regex: (?i)['\"]?(passwd|password)['\"]?\s*[:=]\s*['\"](passwd|password)['\"]
  - regex: (?i)\bpassword\b[ \t]*:[ \t]*["']string["']
  - regex: '(?i)[''"]current-password[''"]\s*:'
  - regex: '(?i)[''"]new-password[''"]\s*:'
  - regex: '(?i)[''"]password-new[''"]\s*:'
  unless:
    - id: metadata/lang/source::js-exported-object-cluster
  downgrade:
    any:
    - id: metadata/signed/platform::apple
    - id: metadata/binary/vendor/
