# Credential vocabulary as it appears in prose — a README, a setup guide, a chat
# transcript — rather than in code. Any product that talks to an authenticated
# API documents the key it needs, so the bare phrase is component evidence and a
# composite has to supply the intent (who is being asked to hand the key over,
# and where it goes).
defaults:
  platforms: [unix, windows]
  for: [markdown, text, documents]
traits:
- id: api-key-phrase
  desc: Names an API, access, or secret key
  crit: component
  conf: 0.86
  if:
    type: text
    regex: '(?i)\b(api|access|secret)[ -]?key\b'

- id: sk-prefixed-secret-token
  # Only three of the pattern's characters are literal, so it is kept to the two
  # plain-text carriers where a pasted key shows up (README, transcript) rather
  # than every parsed document format.
  desc: OpenAI-style sk- secret token literal
  crit: notable
  conf: 0.8
  for: [markdown, text]
  if:
    type: text
    # Require a long unbroken secret body before any optional suffix. This
    # excludes hyphenated model/package names such as sk-kogptv2-kormath-causal.
    regex: '\bsk-(proj-)?[A-Za-z0-9_]{20,80}([._-][A-Za-z0-9_]{8,40})?\b'

composite_rules:
# Either shape of "this text is about a specific API credential", for composites
# that add the intent (an agent instructed to fetch the key, a destination the
# key is directed to).
- id: api-key-mention
  desc: Text names an API key or carries one
  crit: component
  conf: 0.86
  any:
  - id: api-key-phrase
  - id: sk-prefixed-secret-token
