defaults:
  platforms: [windows, macos, linux]
  crit: notable
  conf: 0.98

traits:
- id: discord-encrypted-token-prefix-source
  desc: Discord encrypted-token format prefix
  for: [javascript, typescript, python, batch]
  if:
    type: text
    substr: 'dQw4w9WgXcQ:'
- id: discord-encrypted-token-prefix-bytes
  desc: Discord encrypted-token prefix in binary bytes
  for: [pe, elf, macho]
  if:
    # Scan bytes directly: the binary-string extractor can filter this
    # high-entropy marker when it adjoins a token-search expression.
    type: yara
    source: |
      rule discord_encrypted_token_format_prefix {
        strings:
          $prefix = "dQw4w9WgXcQ:"
        condition:
          $prefix
      }

composite_rules:
- id: discord-encrypted-token-prefix
  desc: Discord encrypted-token format prefix
  for: [javascript, typescript, python, pe, elf, macho, batch]
  any:
  - id: discord-encrypted-token-prefix-source
  - id: discord-encrypted-token-prefix-bytes
