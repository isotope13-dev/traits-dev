---
traits:
- platforms:
  - unix
  - windows
  crit: notable
  for:
  - data
  - text
  id: dotenv-api-key-assignment
  desc: Dotenv API key with long value
  conf: 0.88
  if:
    type: text
    regex: "(?m)^[A-Z0-9_]{0,64}API_?KEY[A-Z0-9_]*=[A-Za-z0-9._/-]{32,128}$"
  not:
  - regex: "(?i)generate"
  - regex: "(?i)your-"
  - regex: "(?i)example"
  - regex: "(?i)placeholder"
  - regex: "(?i)changeme"
