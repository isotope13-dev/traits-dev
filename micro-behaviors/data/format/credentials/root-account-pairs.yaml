defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: common-account-root-password-pair
    desc: Literal account pair containing root or toor
    crit: notable
    conf: 0.86
    if:
      type: literal
      regex: '^(admin|operator|root)\s*[,:|]{1,3} *(root|toor)\s*$'
      case_insensitive: true
    not:
      - regex: '(?i)\b(admin|operator|root)\b\s*[/|]'
      # Owner/group arguments such as `chown root:root` are not credentials.
      - regex: '(?i)^chown '
      - regex: '^:param '
      - regex: '\.$'
      # Self-named root fields and tree-walk arguments are ambiguous.
      - regex: '(?i)\broot\s*[:,]\s*root\b'
      # `root: root || dir` is a default expression, not a pair.
      - regex: '(?i)\b(root|toor)\s*(\|\||&&)'

composite_rules:
  - id: embedded-default-account-pairs
    desc: Contains multiple default credential-pair shapes
    crit: notable
    conf: 0.86
    needs: 2
    any:
      - id: micro-behaviors/data/format/credentials::common-account-weak-password-pair
      - id: micro-behaviors/os/security/auth/password::common-account-pair-literal
      - id: micro-behaviors/data/format/credentials::common-account-root-password-pair

