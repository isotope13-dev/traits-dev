# An ENC field is configuration syntax, not evidence of theft by itself.
defaults:
  platforms: [fortios, unix, windows]
  for: [scripts, binaries, typescript, go, csharp, java, c, cpp, rust]
  crit: notable
  conf: 0.95

traits:
  - id: fortios-enc-password-field
    desc: FortiOS ENC password field syntax
    if:
      type: text
      # Literal whitespace or source-regex separators, not intervening prose.
      regex: '\b(password|passwd)[ \t\\s+)*?]{1,24}ENC\b'
