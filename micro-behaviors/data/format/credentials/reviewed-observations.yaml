traits:
- for:
  - scripts
  - binaries
  id: github-pat-format-scan-regex
  desc: GitHub fine-grained PAT format regex
  if:
    type: text
    regex: github_pat_[0-9A-Za-z\[\]:_-]{0,20}\+
- for:
  - scripts
  - binaries
  id: slack-token-format-scan-regex
  desc: Slack token format regex
  if:
    type: text
    regex: xox\[?[abprs\]]{0,8}-\S{0,16}\+
- for:
  - scripts
  - source
  - binaries
  - -pyc
  - -beam
  - -wasm
  id: github-token-format-pattern
  desc: GitHub token-format scan pattern
  if:
    type: text
    regex: github_pat_[\[\\]|gh[opusr]_[\[\\]
- for:
  - scripts
  - source
  - binaries
  - -pyc
  - -beam
  - -wasm
  id: gitlab-token-format-pattern
  desc: GitLab token-format scan pattern
  if:
    type: text
    substr: glpat-[
- for:
  - scripts
  - source
  - binaries
  - -pyc
  - -beam
  - -wasm
  id: npm-token-format-pattern
  desc: npm token-format scan pattern
  if:
    type: text
    substr: npm_[
- for:
  - scripts
  - source
  - binaries
  - -pyc
  - -beam
  - -wasm
  id: huggingface-token-format-pattern
  desc: Hugging Face token-format pattern
  if:
    type: text
    substr: hf_[
- for:
  - scripts
  - source
  - binaries
  - -pyc
  - -beam
  - -wasm
  id: slack-token-format-pattern
  desc: Slack token-format scan pattern
  if:
    type: text
    regex: xox[abprs]-\[
defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
