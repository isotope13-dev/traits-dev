defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -wasm, -beam, -static-lib]
  crit: notable
  conf: 0.9

traits:
  - id: pypi-token-format-pattern
    desc: PyPI token-format scan pattern
    if:
      type: text
      substr: pypi-[
  - id: vault-token-format-pattern
    desc: Vault token-format scan pattern
    if:
      type: text
      substr: hvs.[
  - id: stripe-token-format-pattern
    desc: Stripe token-format scan pattern
    if:
      type: text
      substr: sk_live_[
  - id: sendgrid-token-format-pattern
    desc: SendGrid token-format scan pattern
    if:
      type: text
      substr: SG.[
composite_rules:
  # Breadth of token recognition is shared by auditors and credential collectors.
  - id: multi-provider-token-format-scan
    desc: Token formats for four plus unrelated providers
    crit: notable
    conf: 0.92
    needs: 4
    any:
    - id: micro-behaviors/data/format/credentials::github-token-format-pattern
    - id: micro-behaviors/data/format/credentials::gitlab-token-format-pattern
    - id: micro-behaviors/data/format/credentials::npm-token-format-pattern
    - id: pypi-token-format-pattern
    - id: micro-behaviors/data/format/credentials::huggingface-token-format-pattern
    - id: vault-token-format-pattern
    - id: micro-behaviors/data/format/credentials::slack-token-format-pattern
    - id: stripe-token-format-pattern
    - id: sendgrid-token-format-pattern
    - id: micro-behaviors/data/format/credentials::aws-access-key-pattern-prefix
    - id: micro-behaviors/data/format/credentials::jwt-pattern-prefix
  - id: token-patterns-with-input-access
    desc: Token patterns beside env or file access
    crit: notable
    conf: 0.95
    near_bytes: 8192
    all:
    - id: multi-provider-token-format-scan
    any:
    - id: micro-behaviors/os/env/enumerate/
    - id: micro-behaviors/fs/directory/traverse/
    - id: micro-behaviors/fs/directory/enumerate::findfirst
    - id: micro-behaviors/fs/directory/enumerate::findnext
    - id: micro-behaviors/fs/read/
    - id: micro-behaviors/fs/search/command::find-app-bundle
