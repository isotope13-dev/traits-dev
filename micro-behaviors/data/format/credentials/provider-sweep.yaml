defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -wasm, -beam, -static-lib]
  crit: notable
  conf: 0.9

traits:
  - id: pypi-token-format-pattern
    desc: PyPI token-format scan pattern
    if:
      type: text
      substr: pypi-[
    unless:
    - id: well-known/tool/detection/security-scanner::pre-commit-secret-scanner-context
    - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
    - id: metadata/package/documentation/agent-safety::security-example-documentation
  - id: vault-token-format-pattern
    desc: Vault token-format scan pattern
    if:
      type: text
      substr: hvs.[
  - id: stripe-token-format-pattern
    desc: Stripe token-format scan pattern
    if:
      type: text
      substr: sk_live_[
  - id: sendgrid-token-format-pattern
    desc: SendGrid token-format scan pattern
    if:
      type: text
      substr: SG.[
composite_rules:
  # Breadth of token recognition is shared by auditors and credential collectors.
  - id: multi-provider-token-format-scan
    desc: Token formats for four plus unrelated providers
    crit: notable
    conf: 0.92
    needs: 4
    any:
    - id: micro-behaviors/data/format/credentials::github-token-format-pattern
    - id: micro-behaviors/data/format/credentials::gitlab-token-format-pattern
    - id: micro-behaviors/data/format/credentials::npm-token-format-pattern
    - id: pypi-token-format-pattern
    - id: micro-behaviors/data/format/credentials::huggingface-token-format-pattern
    - id: vault-token-format-pattern
    - id: micro-behaviors/data/format/credentials::slack-token-format-pattern
    - id: stripe-token-format-pattern
    - id: sendgrid-token-format-pattern
    - id: micro-behaviors/data/format/credentials::aws-access-key-pattern-prefix
    - id: micro-behaviors/data/format/credentials::jwt-pattern-prefix
    unless:
    - id: well-known/tool/detection/defensive-scanner-context::rust-configurable-secret-detector-context
    - id: well-known/tool/detection/redaction/
    - id: well-known/tool/detection/security-scanner/
    - id: well-known/tool/detection/gitleaks/
    - id: well-known/tool/detection/ai-guardrail/
    - id: well-known/app/ai/coding-agent/
    # Known scanner tooling plus programs that build their own credential
    # matchers (the folded pre-commit, masked-output, and compile-context
    # exceptions live in well-known/tool/detection/security-scanner/).
    - id: well-known/tool/detection/security-scanner::secret-scanner-construction-context
    - id: metadata/package/documentation/agent-safety::scoped-security-test-documentation
  - id: token-patterns-with-input-access
    desc: Token patterns beside env or file access
    crit: notable
    conf: 0.95
    near_bytes: 8192
    all:
    - id: multi-provider-token-format-scan
    any:
    - id: micro-behaviors/os/env/enumeration/
    - id: micro-behaviors/fs/directory/traverse/
    - id: micro-behaviors/fs/read/
    - id: micro-behaviors/fs/search::find-app-bundle
    unless:
    - id: well-known/tool/detection/redaction/
    - id: well-known/tool/detection/security-scanner/
    - id: well-known/tool/detection/gitleaks/
    - id: well-known/tool/detection/ai-guardrail/
    - id: well-known/app/ai/coding-agent/
    - id: well-known/tool/detection/security-scanner::pre-commit-secret-scanner-context
    - id: well-known/tool/detection/security-scanner::masked-or-redacted-secret-output-context
    - id: well-known/tool/detection/security-scanner::secret-scanner-construction-context
    - id: micro-behaviors/data/parse/regex::credential-format-regex-compile
