defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: github-pat-template-construction
    desc: Builds GitHub PAT from variable suffix
    if:
      type: text
      regex: '`github_pat_\$\{[A-Za-z_$][A-Za-z0-9_$]{0,63}\}`'
      exclude_comments: true
