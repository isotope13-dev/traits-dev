defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95

traits:
  - id: username-password-report-format
    desc: Username and password printf report format
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: "name:\\s*'%s'\\s+pass:\\s*'%s'"

  - id: password-hash-export-format
    desc: Three-field password-hash printf export format
    crit: notable
    conf: 0.95
    if:
      type: text
      section: .rdata
      regex: '%l?[sS]:%l?s:%l?s:::'
  - id: empty-password-hash-placeholder
    desc: NO PASSWORD placeholder in password-hash reports
    crit: notable
    conf: 0.95
    if:
      type: text
      section: .rdata
      exact: NO PASSWORD*********************
composite_rules:
  - id: password-hash-report-marker
    desc: Password-hash report format or empty-hash placeholder
    crit: notable
    conf: 0.95
    any:
      - id: password-hash-export-format
      - id: empty-password-hash-placeholder
