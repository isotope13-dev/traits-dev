# Neutral observations and discriminating identities.
traits:
- for: &id001
  - scripts
  - binaries
  id: aws-access-key-length-pattern
  desc: AWS access key regex length quantifier
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: AKIA[0-9A-Z|()\[\]-]{0,14}\{16\}
  unless:
  - id: well-known/lib/format/stacksjs-stacks::stacks-package-context
  - id: well-known/lib/format/stacksjs-stacks::stacks-database-query-log-redaction
  - id: well-known/tool/detection/security-scanner::masked-or-redacted-secret-output-context
- for: *id001
  id: jwt-length-pattern
  desc: JWT format regex with length quantifier
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: eyJ\S{0,26}\{8,\}
- for:
  - scripts
  - source
  - binaries
  - -pyc
  - -beam
  - -wasm
  crit: notable
  conf: 0.9
  id: aws-access-key-pattern-prefix
  desc: AWS access key regex prefix reference
  if:
    type: text
    regex: (AKIA|ASIA)\[
  unless:
  - id: well-known/lib/format/stacksjs-stacks::stacks-package-context
  - id: well-known/lib/format/stacksjs-stacks::stacks-database-query-log-redaction
  - id: well-known/tool/detection/security-scanner::masked-or-redacted-secret-output-context
- for:
  - scripts
  - source
  - binaries
  - -pyc
  - -beam
  - -wasm
  crit: notable
  conf: 0.9
  id: jwt-pattern-prefix
  desc: JWT regex prefix reference
  if:
    type: text
    substr: eyJ[
defaults:
  platforms:
  - unix
  - windows
