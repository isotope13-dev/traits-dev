defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.93

traits:
  - id: discord-token-quantified-regex-shape
    desc: Discord token regex segment shape
    if:
      type: text
      # Token stealer variants may use digit/word character classes instead
      # of the simpler [\\w-] spelling used by the older atom.
      regex: '\{24\}.{0,80}\{6\}.{0,80}\{27\}'

composite_rules:
  - id: discord-token-regex-source-variants
    desc: Discord token regex source variants
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/data/format/credentials::discord-token-regex-source
      - id: discord-token-quantified-regex-shape
