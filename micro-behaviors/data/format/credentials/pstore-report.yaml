defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: pstore-pass-sites-report-label
    desc: PStore credential report pass_sites label
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: pass_sites
  - id: pstore-autocomplete-password-report-label
    desc: PStore autocomplete password report label
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: auto_complete_pass
