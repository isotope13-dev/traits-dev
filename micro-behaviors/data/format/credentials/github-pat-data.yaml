defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: javascript-padded-github-pat-construction
    desc: Constructs padded GitHub PAT-shaped data
    crit: notable
    conf: 0.98
    # GitHub's credential prefix is platform syntax, not a campaign marker.
    # Mock-token generators can do this too; the construction is neutral.
    # Bind both slices to the same source. An ordinary token reference, token
    # redaction, or unrelated padding operation cannot satisfy this query.
    if:
      type: tree-sitter
      query: |
        (binary_expression
          left: (binary_expression
            left: (binary_expression
              left: (string (string_fragment) @prefix)
              operator: "+"
              right: (call_expression
                function: [
                  (member_expression object: (identifier) @data1
                    property: (property_identifier) @slice1)
                  (subscript_expression object: (identifier) @data1
                    index: (string (string_fragment) @slice1))]))
            operator: "+"
            right: (string (string_fragment) @separator))
          operator: "+"
          right: (call_expression
            function: [
              (member_expression
                object: (call_expression function: [
                  (member_expression object: (identifier) @data2
                    property: (property_identifier) @slice2)
                  (subscript_expression object: (identifier) @data2
                    index: (string (string_fragment) @slice2))])
                property: (property_identifier) @pad)
              (subscript_expression
                object: (call_expression function: [
                  (member_expression object: (identifier) @data2
                    property: (property_identifier) @slice2)
                  (subscript_expression object: (identifier) @data2
                    index: (string (string_fragment) @slice2))])
                index: (string (string_fragment) @pad))])
          (#match? @prefix "^github_pat_")
          (#eq? @data1 @data2)
          (#eq? @slice1 "slice") (#eq? @slice2 "slice")
          (#eq? @separator "_") (#eq? @pad "padEnd")) @match
