defaults:
  platforms: [unix, windows]
  for: [python, javascript, powershell, pe, elf]
traits:
- id: user-user-pair
  desc: Standalone user:user credential-pair literal
  crit: notable
  conf: 0.7
  if:
    type: text
    # JavaScript object-member punctuation is not credential-list evidence;
    # retain plain or quoted standalone pairs and common list delimiters.
    regex: '(^|[^A-Za-z0-9_])user:user($|[\t\r\n ;|&''"])'
  unless:
  - id: well-known/tool/offensive/decepticon::package-tree-member
  - id: well-known/tool/offensive/sqlmap::source-tree-member
  - id: well-known/lib/platform/wine/
  - id: well-known/tool/development/toolchain/deno::deno-runtime-binary
  - id: well-known/tool/offensive/nmap::nmap-source-tree
  - id: well-known/tool/sysadmin/netdoc-collector::netdoc-collector-library
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/lang/compiler/generated::pulumi-language-python-generated
