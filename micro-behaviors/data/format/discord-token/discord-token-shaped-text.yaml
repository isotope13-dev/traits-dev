defaults:
  platforms:
    - windows
    - macos
    - linux
traits:
  - for: [pe, elf, macho]
    id: discord-token-shaped-text-command
    desc: Discord token-shaped text
    crit: component
    conf: 0.75
    if:
      type: text
      regex: (^|[^A-Za-z0-9_-])[A-Za-z0-9_-]{24}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27}([^A-Za-z0-9_-]|$)
  - id: discord-token-shaped-text-string
    desc: Discord token-shaped text
    crit: component
    conf: 0.75
    for: [javascript, typescript, python]
    if:
      type: literal
      regex: (^|[^A-Za-z0-9_-])[A-Za-z0-9_-]{24}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27}([^A-Za-z0-9_-]|$)
composite_rules:
  - id: discord-token-shaped-text
    desc: Discord token-shaped text
    conf: 0.75
    for: [javascript, typescript, python, pe, elf, macho]
    any:
      - id: discord-token-shaped-text-command
      - id: discord-token-shaped-text-string
