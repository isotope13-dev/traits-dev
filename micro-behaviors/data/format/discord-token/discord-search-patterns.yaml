defaults:
  platforms: [windows, macos, linux]
  for: [javascript, typescript, python, pe, elf, macho, batch]
  crit: notable
  conf: 0.94

traits:
  - id: discord-standard-token-regex-source
    desc: Source regex for Discord tokens
    crit: notable
    conf: 0.94
    if:
      type: text
      # [\w-]{24} and [A-Za-z\d]{24} are the same token-shaped source pattern.
      regex: '\[(\\w-|A-Za-z\\d)\]\{24\}\\.\[\\w-\]\{6\}\\.\[\\w-\]\{27\}'
  - id: discord-mfa-token-regex-source
    desc: Source regex for MFA tokens
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'mfa\\.[\\w-]{84}'

composite_rules:
  - id: discord-token-search-regex-source
    desc: Discord token-search pattern syntax
    crit: notable
    conf: 0.96
    any:
      - id: discord-standard-token-regex-source
      - id: discord-mfa-token-regex-source
      - id: micro-behaviors/fs/search/command::batch-findstr-discord-token-pattern
