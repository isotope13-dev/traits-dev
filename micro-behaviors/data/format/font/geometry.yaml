defaults:
  platforms: [linux, macos, windows]
  for: [python]

traits:
  - id: suppress-bounds-recalculation
    desc: Disables font bounding-box recalculation
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '\.recalcBBoxes\s*=\s*False\b'

  - id: override-glyph-bounds
    desc: Overrides glyph horizontal bounds
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\.xMin\s*=.{0,60}[\r\n][\s\S]{0,100}\.xMax\s*='

  - id: chained-composite-transform
    desc: Builds composite glyphs in a chaining loop
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'for \w+ in [^\n]{1,60}:[\s\S]{0,160}\.addComponent\(\w+,[\s\S]{0,180}\n\s+\w+ = \w+'

  - id: large-glyph-coordinate
    desc: Draws glyph paths near 16-bit limits
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\.(moveTo|lineTo)\(\s*\(\s*-?3[0-2][0-9]{3}\s*,'
