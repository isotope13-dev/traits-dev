defaults:
  platforms: [unix, windows]
  for: [c, cpp, csharp]
traits:
  - id: pe-entrypoint-field
    conf: 0.8
    crit: notable
    desc: PE entry point header field
    if:
      type: text
      word: AddressOfEntryPoint
    downgrade:
      any:
        - id: micro-behaviors/fs/file/section::pe-viewer-machine-types
        - id: micro-behaviors/data/format/pe-parser::image-section-header-reference
  - id: pe-image-size-field
    conf: 0.8
    crit: notable
    desc: PE header SizeOfImage reference
    if:
      type: text
      word: SizeOfImage
  - id: pe-section-count-field
    conf: 0.8
    crit: notable
    desc: PE NumberOfSections reference
    if:
      type: text
      word: NumberOfSections
  - id: pe-virtual-address-field
    conf: 0.8
    crit: notable
    desc: PE VirtualAddress reference
    if:
      type: text
      word: VirtualAddress
