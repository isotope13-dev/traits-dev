defaults:
  for:
  - c
  - cpp
traits:
- id: elf-note-type-comparison
  desc: Compares a program-header type with PT_NOTE
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: p_type\s*==\s*PT_NOTE
  platforms:
  - unix
- id: elf-load-type-assignment
  desc: Assigns PT_LOAD to a program header
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: p_type\s*=\s*PT_LOAD
  platforms:
  - unix
- id: elf-rx-segment-assignment
  desc: Assigns read-execute program-header flags
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: p_flags\s*=\s*PF_R\s*\|\s*PF_X
  platforms:
  - unix
- id: elf-exec-section-assignment
  desc: Assigns allocated executable section flags
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: sh_flags\s*=\s*SHF_ALLOC\s*\|\s*SHF_EXECINSTR
  platforms:
  - unix
- id: elf-entry-assignment
  desc: Assigns an ELF entry-point field
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (\.|->)e_entry\s*=[^=;\n][^;\n]{0,60};
  platforms:
  - unix
- id: elf-dot-section-comparison
  desc: Compares a dot-prefixed section name
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: sh_name\s*,\s*"\.[A-Za-z]
  platforms:
  - unix
composite_rules:
- id: elf-header-entry-rewrite
  desc: ELF header handling with entry-point assignment
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/data/format/executable/header::elf64-headers
  - id: micro-behaviors/data/format/executable/header::elf-entry-assignment
  unless:
  - id: well-known/tool/development/patchelf/
  - id: well-known/tool/reverse-engineering/
  platforms:
  - unix
- id: uefi-image-converter-source
  desc: UEFI ELF-to-PE image conversion source
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/data/format/executable/header::elf64-structure-reference
  - id: metadata/build/toolchain::uefi-export-format-reference
  - id: metadata/build/toolchain::coff-image-conversion-reference
  platforms:
  - unix
  - windows
