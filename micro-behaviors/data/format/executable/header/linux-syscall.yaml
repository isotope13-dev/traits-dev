defaults:
  platforms: [linux]
  for: [elf]

composite_rules:
  - id: elf-header-read-rewrite-syscalls
    desc: Inspects ELF64 identifiers and rewrites file headers
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/data/format/executable/magic::x64-load-elf64-magic
      - id: micro-behaviors/fs/file/read::pread-file-header-syscall
      - id: micro-behaviors/fs/file/write/header::pwrite-file-header-syscall
    any:
      - id: micro-behaviors/fs/file/open::open-read-write-syscall
      - id: micro-behaviors/fs/file/open::openat-read-write-syscall

