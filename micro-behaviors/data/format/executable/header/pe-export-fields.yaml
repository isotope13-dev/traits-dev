defaults:
  for: [c, cpp, pe, dll]
  platforms: [windows]
traits:
  - id: export-directory
    desc: PE export directory type reference
    crit: notable
    conf: 0.85
    if:
      type: text
      word: IMAGE_EXPORT_DIRECTORY
  - id: export-name-ordinals
    desc: PE export name ordinal field reference
    crit: notable
    conf: 0.85
    if:
      type: text
      word: AddressOfNameOrdinals
  - id: export-name-table
    desc: PE export name table field reference
    crit: notable
    conf: 0.85
    if:
      type: text
      word: AddressOfNames
  - id: export-ordinal-table-reference
    desc: PE export ordinal table field reference
    crit: notable
    conf: 0.9
    for: [binaries, scripts, c]
    platforms: [unix, windows]
    if:
      type: text
      word: AddressOfOrdinals
  - id: export-function-table
    desc: PE export function table field reference
    crit: notable
    conf: 0.85
    if:
      type: text
      word: AddressOfFunctions
composite_rules:
  - id: export-directory-field-set
    desc: PE export directory field references
    crit: notable
    conf: 0.92
    needs: 3
    any:
      - id: export-directory
      - id: export-name-ordinals
      - id: export-name-table
      - id: export-function-table
    unless:
      - id: metadata/file/extension/executable::dotnet-native-image
      - id: well-known/lib/native/memory-module::memory-module-source
      - id: well-known/tool/sysadmin/sandboxie/
      - id: metadata/lang/compiler/managed::delphi
