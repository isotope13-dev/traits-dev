# A parsed member access, shared by image loaders and import-table tools.
# Bare tokens, comments and string constants do not establish this operation.
defaults:
  platforms: [windows]
  for: [c, cpp]
traits:
  - id: pe-first-thunk-member-access
    desc: Accesses a PE FirstThunk member
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: member
      regex: '(^|\.)FirstThunk$'
