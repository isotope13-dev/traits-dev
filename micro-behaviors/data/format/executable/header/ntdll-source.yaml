defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, python, powershell]

traits:
  - id: ntdll-text-section-reference
    desc: Source references the NTDLL text section
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '(?i)\bntdll\b.{0,20}\.text\b|\b\.text\b.{0,20}\bntdll\b'

