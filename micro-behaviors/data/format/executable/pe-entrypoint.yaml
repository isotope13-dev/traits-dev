defaults:
  platforms: [windows]
  for: [c, text]

traits:
  - id: pe-entrypoint-field-assignment
    desc: Assigns the PE entrypoint field in source
    crit: notable
    conf: 0.95
    if:
      type: text
      # Write semantics required: validation and inspection code reads the
      # field (`!= 0`, `JMP_SIZE` constant names) without infecting anything,
      # e.g. the .NET runtime's PEDecoder IL-entry checks.
      regex: 'AddressOfEntryPoint\s*=[^=]'

