# VB6/VB.NET source editing a PE image's section table by hand. The
# section headers follow the 248-byte IMAGE_NT_HEADERS32 at e_lfanew and are
# 40 bytes each, so `(NumberOfSections - 1) * 40` addresses the last one.
defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable

traits:
  - id: vb-last-section-header-offset
    desc: VB computes last PE section header offset
    conf: 0.92
    if:
      type: text
      regex: '(?i)\.NumberOfSections\s*-\s*1\s*\)\s*\*\s*40\b'
  - id: vb-section-raw-size-grown-by-length
    desc: VB grows SizeOfRawData by a data length
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.SizeOfRawData\s*=\s*\w+\.SizeOfRawData\s*\+\s*\(?\s*Len\('
