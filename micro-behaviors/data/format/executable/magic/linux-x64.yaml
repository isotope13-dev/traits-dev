defaults:
  platforms: [linux]
  for: [elf, data]
  crit: notable
  conf: 0.95

traits:
  - id: x64-load-elf64-magic
    desc: Loads ELF64 identification into a register
    if:
      type: hex
      # REX.W MOV r64, imm64; allow every destination register. This is
      # instruction-encoded identification data, not the file's ELF header.
      pattern: (48|49) (B8|B9|BA|BB|BC|BD|BE|BF) 7F 45 4C 46 02 01 00 00
      offset_range: [0, null]
