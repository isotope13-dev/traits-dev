# Neutral names of industrial telemetry fields.  A field name alone identifies
# a data model; ICS targeting requires additional environment or control-surface
# evidence in objectives/discovery/system/ics-environment.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, json]
  crit: notable
  conf: 0.85

traits:
  - id: vcalendar-container
    desc: iCalendar VCALENDAR container
    crit: notable
    conf: 0.98
    for: [text]
    if:
      type: text
      regex: '(?i)^BEGIN:VCALENDAR$'

  - id: ics-event-description-field
    desc: iCalendar event DESCRIPTION property
    crit: notable
    conf: 0.96
    for: [text]
    if:
      type: text
      regex: '(?i)^DESCRIPTION:'

  - id: ics-event-url-field
    desc: iCalendar event URL property
    crit: notable
    conf: 0.95
    for: [text]
    if:
      type: text
      regex: '(?i)^URL:https?://'

  - id: ics-archive-file-name
    desc: iCalendar event names an archive
    crit: component
    conf: 0.9
    for: [text]
    if:
      type: text
      regex: '(?i)\.(zip|7z|tar|gz)\b'

  - id: grid-frequency-field
    desc: Grid frequency measurement field
    if:
      type: text
      regex: '(?i)\bgrid[_-]frequency\b'

  - id: frequency-setpoint-field
    desc: Power-system frequency setpoint field
    if:
      type: text
      regex: '(?i)\bhz[_-]?setpoint\b'

composite_rules:
  - id: ics-event-file-transfer-shape
    desc: iCalendar event archive plus URL
    crit: suspicious
    conf: 0.95
    for: [text]
    all:
      - id: vcalendar-container
      - id: ics-event-description-field
      - id: ics-archive-file-name
      - id: ics-event-url-field
