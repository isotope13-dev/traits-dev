# Neutral names of industrial telemetry fields.  A field name alone identifies
# a data model; ICS targeting requires additional environment or control-surface
# evidence in objectives/discovery/system/ics-environment.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, json]
  crit: notable
  conf: 0.85

traits:
  - id: vcalendar-container
    desc: iCalendar VCALENDAR container
    crit: notable
    conf: 0.98
    for: [text]
    if:
      type: text
      regex: '(?i)^BEGIN:VCALENDAR$'

  - id: ics-event-description-field
    desc: iCalendar event DESCRIPTION property
    crit: notable
    conf: 0.96
    for: [text]
    if:
      type: text
      # Keep the standard uppercase property spelling.  A case-insensitive
      # match mistakes ordinary YAML/JSON `description:` fields for iCalendar.
      regex: '^DESCRIPTION(;.{0,40})?:'

  - id: ics-event-url-field
    desc: iCalendar event URL property
    crit: notable
    conf: 0.95
    for: [text]
    if:
      type: text
      regex: '(?i)^URL:https?://'

  - id: ics-archive-zip-file-name
    desc: iCalendar field names a ZIP archive
    crit: component
    conf: 0.9
    for: [text]
    if:
      type: text
      # Keep this fragment tied to an iCalendar property.  A bare archive
      # suffix in source code is not an iCalendar event field.
      regex: '(?im)^[ \t]*(DESCRIPTION|ATTACH|URL)(;[^:\r\n]{0,40})?:[^\r\n]{0,240}\.zip([ \t]|$)'

  - id: ics-archive-7z-file-name
    desc: iCalendar field names a 7z archive
    crit: component
    conf: 0.9
    for: [text]
    if:
      type: text
      regex: '(?im)^[ \t]*(DESCRIPTION|ATTACH|URL)(;[^:\r\n]{0,40})?:[^\r\n]{0,240}\.7z([ \t]|$)'

  - id: ics-archive-tar-file-name
    desc: iCalendar field names a tar archive
    crit: component
    conf: 0.9
    for: [text]
    if:
      type: text
      regex: '(?im)^[ \t]*(DESCRIPTION|ATTACH|URL)(;[^:\r\n]{0,40})?:[^\r\n]{0,240}\.tar([ \t]|$)'

  - id: ics-archive-gz-file-name
    desc: iCalendar field names a gzip archive
    crit: component
    conf: 0.9
    for: [text]
    if:
      type: text
      regex: '(?im)^[ \t]*(DESCRIPTION|ATTACH|URL)(;[^:\r\n]{0,40})?:[^\r\n]{0,240}\.gz([ \t]|$)'

  - id: grid-frequency-field
    desc: Grid frequency measurement field
    if:
      type: text
      regex: '(?i)\bgrid[_-]frequency\b'

  - id: frequency-setpoint-field
    desc: Power-system frequency setpoint field
    if:
      type: text
      regex: '(?i)\bhz[_-]?setpoint\b'

composite_rules:
  - id: ics-archive-file-name
    desc: iCalendar field names an archive
    crit: component
    conf: 0.9
    for: [text]
    any:
      - id: ics-archive-zip-file-name
      - id: ics-archive-7z-file-name
      - id: ics-archive-tar-file-name
      - id: ics-archive-gz-file-name

  - id: ics-event-file-transfer-shape
    desc: iCalendar event archive plus URL
    crit: suspicious
    conf: 0.95
    for: [text]
    all:
      - id: vcalendar-container
      - id: ics-event-description-field
      - id: ics-archive-file-name
      - id: ics-event-url-field
