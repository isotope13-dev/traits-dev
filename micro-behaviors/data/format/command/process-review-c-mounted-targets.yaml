  - id: c-formats-bootloader-directory-removal
    desc: Formats removal of GRUB and EFI
    if:
      type: tree-sitter
      language: c
      query: |
        ((compound_statement
         (declaration type: (primitive_type) @path_type
           declarator: (init_declarator
             declarator: (pointer_declarator declarator: (array_declarator declarator: (identifier) @paths))
             value: (initializer_list . (string_literal) @grub2 . (string_literal) @grub . (string_literal) @efi .)))
         . (for_statement
           initializer: (declaration declarator: (init_declarator declarator: (identifier) @index value: (number_literal) @start))
           condition: (binary_expression left: (identifier) @tested_index operator: "<" right: (number_literal) @count)
           update: (update_expression argument: (identifier) @updated_index operator: "++")
           body: (compound_statement
             . (declaration type: (primitive_type) @buffer_type declarator: (array_declarator declarator: (identifier) @buffer size: (number_literal) @buffer_size))
             . (expression_statement (call_expression function: (identifier) @formatter
               arguments: (argument_list . (identifier) @output . (sizeof_expression value: (parenthesized_expression (identifier) @sized_buffer)) . (string_literal) @template . (subscript_expression argument: (identifier) @selected_paths index: (identifier) @selected_index) .)) @evidence))))
         (#eq? @path_type "char")
         (#match? @grub2 "^\"/boot/(grub2?|efi)\"$")
         (#match? @grub "^\"/boot/(grub2?|efi)\"$")
         (#match? @efi "^\"/boot/(grub2?|efi)\"$")
         (#not-eq? @grub2 @grub)
         (#not-eq? @grub2 @efi)
         (#not-eq? @grub @efi)
         (#eq? @start "0")
         (#eq? @count "3")
         (#eq? @index @tested_index)
         (#eq? @index @updated_index)
         (#eq? @index @selected_index)
         (#eq? @paths @selected_paths)
         (#eq? @buffer_type "char")
         (#match? @buffer_size "^[1-9][0-9]*$")
         (#eq? @formatter "snprintf")
         (#eq? @template "\"rm -rf -- %s\"")
         (#eq? @buffer @output)
         (#eq? @buffer @sized_buffer)
        )
