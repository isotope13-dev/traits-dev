defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  size_max: 20000000
traits:
- id: apache-service-control-command-text
  desc: Apache service-control command text
  conf: 0.96
  if:
    type: text
    regex: '!start apache.{0,500}!stop apache'
- id: sql-command-help-text
  desc: SQL command help text
  conf: 0.94
  if:
    type: text
    regex: '!db\s+(<db_name>|<name>).{0,80}(<query>|<SQL>)'
