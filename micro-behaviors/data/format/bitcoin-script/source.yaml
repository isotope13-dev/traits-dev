defaults:
  platforms: [windows, unix]
  for: [source, javascript, typescript]
  crit: notable
traits:
  - id: bitcoin-opreturn-source
    desc: References Bitcoin OP_RETURN opcode literal
    crit: notable
    conf: 0.94
    for: [source, php, python, class, ruby, javascript, typescript, perl]
    if:
      type: string_literal
      # An opcode reference alone proves neither network access nor C2.
      regex: '(?i)op_return'

  - id: bitcoin-opreturn-source-text
    desc: References Bitcoin script data representation
    crit: notable
    conf: 0.9
    for: [source, javascript, typescript, perl]
    if:
      type: text
      regex: '(?i)(op_return|scriptpubkey).{0,40}(hex|data|script)'

  - id: bitcoin-scriptpubkey-reference
    desc: References Bitcoin scriptPubKey field
    crit: notable
    conf: 0.88
    for: [source, python, class, ruby, javascript, typescript, perl]
    if:
      type: text
      regex: '(?i)scriptpubkey'


