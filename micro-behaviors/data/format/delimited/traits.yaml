# Opaque command/argument frame separators used by multi-module C2 brokers
# (e.g. CAV3RN `_;;_` between command and args). Neutral capability atom;
# objective / family composites supply intent.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, csharp, c, cpp, go, powershell, pe, dll, text]

traits:
  - id: double-semicolon-underscore-literal
    desc: Double-semicolon underscore delimiter literal
    crit: notable
    conf: 0.94
    for: [scripts, source]
    if:
      type: literal
      exact: '_;;_'

  - id: double-semicolon-underscore-binary-text
    desc: Double-semicolon underscore delimiter string
    crit: notable
    conf: 0.94
    for: [pe, dll, text]
    if:
      type: text
      exact: '_;;_'

composite_rules:
  - id: double-semicolon-underscore-frame
    desc: Double-semicolon underscore delimiter string
    crit: notable
    conf: 0.94
    any:
      - id: double-semicolon-underscore-literal
      - id: double-semicolon-underscore-binary-text
