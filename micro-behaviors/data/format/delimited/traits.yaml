# Opaque command/argument frame separators used by multi-module C2 brokers
# (e.g. CAV3RN `_;;_` between command and args). Neutral capability atom;
# objective / family composites supply intent.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, csharp, c, cpp, go, powershell, pe, dll, text]
  attack: T1071
  mbc: C0002

traits:
  - id: double-semicolon-underscore-frame
    desc: Double-semicolon underscore frame delimiter
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: '_;;_'
