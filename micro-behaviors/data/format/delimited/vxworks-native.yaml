defaults:
  platforms: [appliance, unix]
  for: [c, cpp, objc, elf]
traits:

- id: native-export-frame-passwd-shadow
  desc: Export-frame labels name passwd or shadow
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\b(EXFIL|FILE)\|(passwd|shadow)\b'

- id: native-export-frame-env-version
  desc: Export-frame labels name environment or version
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\b(EXFIL|FILE)\|(environ|version|vxworks)\b'
