# Neutral evidence; intent requires additional context.
traits:
- id: compact-uuid-field
  desc: UUID field contains a 32-character hex value
  crit: notable
  conf: 0.88
  for:
  - go
  - python
  - javascript
  - c
  - cpp
  - text
  - pe
  - json
  platforms:
  - windows
  - unix
  size_max: 50000000
  if:
    case_insensitive: true
    regex: \\?"uuid\\?"\s*:\\?\s*\\?"[0-9a-f]{32}\\?"
    type: text
- id: uuid-from-string-call
  desc: UuidFromStringA/W call
  crit: notable
  conf: 0.95
  for:
  - c
  - cpp
  platforms:
  - windows
  if:
    type: symbol
    kind: call
    regex: '^UuidFromString[AW]$'
