# The object codebase and ADODB ProgID coexist; no clause requires the
# stream-written file to be the object target.
defaults:
  platforms: [windows]
  for: [html]

composite_rules:
  - id: html-adodb-object-codebase-profile
    desc: HTML ADODB.Stream and EXE object-codebase clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/com/automation::html-adodb-stream-progid-reference
      - id: micro-behaviors/data/format/html::object-exe-codebase-reference
