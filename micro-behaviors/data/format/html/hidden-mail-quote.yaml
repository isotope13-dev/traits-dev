# These describe concealed quotation markup, not filter evasion by itself.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.95
traits:
  - id: display-none-quoted-block
    desc: Hidden HTML container wraps a quoted block
    if:
      type: text
      exclude_html_comments: true
      case_insensitive: true
      regex: '<div[^>]{0,99}\sstyle\s*=\s*["''][^"'']{0,99}display\s*:\s*none\b[^>]{0,99}>\s*<blockquote\b'
  - id: hidden-attribute-quoted-block
    desc: Hidden HTML attribute conceals a quotation
    if:
      type: text
      exclude_html_comments: true
      case_insensitive: true
      regex: '<div\s+hidden\s*>\s*<blockquote\b'
