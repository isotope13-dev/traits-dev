defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: native-http-script-and-cookie-html-fragments
    desc: HTTP script and cookie-assignment HTML fragments
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule native_http_script_and_cookie_html_fragments {
          strings:
            $script = "<script src='http://"
            $cookie = "<script>document.cookie="
            $modal = "showModalDialog"
          condition:
            all of them
        }
