defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, svg]

traits:
  - id: html-svg-script-element
    desc: HTML, SVG, or script element string
    crit: baseline
    conf: 0.85
    if:
      type: literal
      kind: string
      regex: '(?is)<(svg|script)\b'

  # A clickable hyperlink inside SVG markup. Diagram exporters (draw.io,
  # Inkscape) emit these routinely, so the atom is a neutral navigation fact;
  # phishing composites in objectives/credential-access/phishing/mfa-relay/
  # supply the authentication-endpoint context that makes it an attack.
  - id: svg-external-xlink-link
    desc: SVG hyperlink targets an external URL
    crit: notable
    conf: 0.92
    for: [svg]
    if:
      type: text
      regex: '(?is)<a\b[^>]{0,260}\bxlink:href\s*=\s*["'']https?://'

  # Remote scripts are also used by SVG-hosted web applications.
  - id: svg-external-script-source
    desc: SVG loads script from a remote host
    crit: notable
    conf: 0.93
    for: [svg]
    if:
      type: text
      regex: '(?i)<script\b[^>]{0,120}\bsrc\s*=\s*["'']https?://'

  # XHTML namespace declaration inside an SVG body.
  - id: svg-xhtml-body-xmlns
    desc: SVG body uses the XHTML namespace
    crit: notable
    conf: 0.9
    for: [svg]
    if:
      type: text
      regex: '<body xmlns="http://www.w3.org/1999/xhtml"'

  # Query parameters can configure loaders or ordinary analytics.
  - id: svg-query-param-script-src
    desc: Remote SVG script URL has a query
    crit: notable
    conf: 0.9
    for: [svg]
    if:
      type: text
      regex: '(?i)<script\b[^>]{0,160}\bsrc\s*=\s*["'']https?://[^"'']{3,160}\?[A-Za-z][A-Za-z0-9_]{0,12}='

  - id: xhtml-namespace-frame-element
    desc: Frame element declares XHTML XML namespace
    crit: notable
    conf: 0.95
    for: [scripts, source, html, svg, xml, text]
    if:
      type: text
      regex: '(?i)<i?frame\b[^<>]{0,120}\bxmlns=["'']https?://www\.w3\.org/1999/xhtml["'']'

  - id: frame-javascript-or-srcdoc-payload
    desc: Frame uses javascript URI or srcdoc
    crit: notable
    conf: 0.94
    for: [scripts, source, html, svg, xml, text]
    if:
      type: text
      regex: '(?i)<i?frame\b[^<>]{0,120}\b(src=["'']\s*javascript:|srcdoc=)'

  - id: svg-animate-href-attribute
    desc: SVG animation targets an href attribute
    crit: notable
    conf: 0.95
    for: [scripts, source, html, svg, xml, text]
    if:
      type: text
      regex: '(?i)<animate\w*\b[^<>]{0,120}\battributeName=["''](xlink:)?href["'']'

  - id: svg-animate-javascript-uri-value
    desc: SVG animation assigns a javascript URI
    crit: notable
    conf: 0.96
    for: [scripts, source, html, svg, xml, text]
    if:
      type: text
      regex: '(?i)<animate\w*\b[^<>]{0,120}\b(values|to)=["''][^"''<>]{0,30}javascript:'

  - id: svg-lowercase-foreignobject-tag
    desc: Lowercase foreignobject tag in SVG markup
    crit: notable
    conf: 0.94
    for: [scripts, source, html, svg, xml, text]
    if:
      type: text
      substr: '<foreignobject'

  - id: svg-inline-error-or-load-handler
    desc: SVG or image inline event handler
    crit: notable
    conf: 0.92
    for: [scripts, source, html, svg, xml, text]
    if:
      type: text
      regex: '(?i)<(svg|image|img)\b[^<>]{0,120}\bon(error|load)\s*='

  - id: http-link-header-xml-data-uri
    desc: HTTP Link header specifies XML data URI
    crit: notable
    conf: 0.95
    for: [scripts, source, html, svg, xml, text]
    if:
      type: text
      regex: '(?i)\bLink:\s*<data:(text/xsl|application/xml),'

  - id: http-link-header-xsl-stylesheet-type
    desc: HTTP Link header sets XSL stylesheet type
    crit: notable
    conf: 0.95
    for: [scripts, source, html, svg, xml, text]
    if:
      type: text
      regex: '(?i)>;\s*rel=["'']?stylesheet["'']?;\s*type=["'']?text/xsl'
