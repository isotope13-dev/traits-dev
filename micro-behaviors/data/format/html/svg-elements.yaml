defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, svg]

traits:
  - id: html-svg-script-element
    desc: HTML, SVG, or script element string
    crit: baseline
    conf: 0.85
    if:
      type: literal
      kind: string
      regex: '(?is)<(svg|script)\b'

  # A clickable hyperlink inside SVG markup. Diagram exporters (draw.io,
  # Inkscape) emit these routinely, so the atom is a neutral navigation fact;
  # phishing composites in objectives/credential-access/phishing/mfa-relay/
  # supply the authentication-endpoint context that makes it an attack.
  - id: svg-external-xlink-link
    desc: SVG hyperlink targets an external URL
    crit: notable
    conf: 0.92
    for: [svg]
    if:
      type: text
      regex: '(?is)<a\b[^>]{0,260}\bxlink:href\s*=\s*["'']https?://'

  # The external-source variant. Every composite in
  # credential-access/phishing/credential/svg.yaml hangs off
  # `inline-svg-script-body` below, which requires a non-empty script body --
  # so `<script src="https://host/?u=script"></script>` satisfies none of
  # them. That is the cheapest possible variation on the technique and it was
  # a complete blind spot: eight abuse.ch samples from one 2025-07 campaign,
  # all around 470 bytes, all invisible.
  #
  # A standalone `.svg` has no reason to fetch script from a host. When SVG is
  # used as an image the script never runs at all; it runs when the file is
  # opened directly or inlined into a page, which is exactly the mail-attachment
  # path these campaigns use.
  - id: svg-external-script-source
    desc: SVG loads script from a remote host
    crit: suspicious
    conf: 0.93
    for: [svg]
    attack: T1059.007,T1566.002
    if:
      type: text
      regex: '(?i)<script\b[^>]{0,120}\bsrc\s*=\s*["'']https?://'

  - id: inline-svg-script-body
    desc: Inline script body in an SVG document
    crit: notable
    conf: 0.8
    for: [svg]
    if:
      type: text
      regex: '<script\b[^>]{0,200}>\s{0,20}(<!\[CDATA\[\s*)?[^\s<]'
    unless:
      - type: text
        # DAPS/DocBook emits XML-declared XHTML.  It contains inline
        # JavaScript but is not an SVG document.
        regex: '(?is)^\s*(?:<\?xml[^>]*>\s*)?<!DOCTYPE\s+html\b[^>]*>\s*<html\b'
