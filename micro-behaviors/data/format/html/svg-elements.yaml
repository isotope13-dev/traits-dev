defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, svg]

traits:
  - id: html-svg-script-element
    desc: HTML, SVG, or script element string
    crit: baseline
    conf: 0.85
    if:
      type: literal
      kind: string
      regex: '(?is)<(svg|script)\b'

  # A clickable hyperlink inside SVG markup. Diagram exporters (draw.io,
  # Inkscape) emit these routinely, so the atom is a neutral navigation fact;
  # phishing composites in objectives/credential-access/phishing/mfa-relay/
  # supply the authentication-endpoint context that makes it an attack.
  - id: svg-external-xlink-link
    desc: SVG hyperlink targets an external URL
    crit: notable
    conf: 0.92
    for: [svg]
    if:
      type: text
      regex: '(?is)<a\b[^>]{0,260}\bxlink:href\s*=\s*["'']https?://'

  # Remote scripts are also used by SVG-hosted web applications.
  - id: svg-external-script-source
    desc: SVG loads script from a remote host
    crit: notable
    conf: 0.93
    for: [svg]
    if:
      type: text
      regex: '(?i)<script\b[^>]{0,120}\bsrc\s*=\s*["'']https?://'

  # A standalone SVG that is itself the page (width/height 100%) is the
  # attachment-open path: the image fills the tab so the foreignObject HTML
  # and its remote script run as a document, not as a picture.
  - id: svg-root-full-size
    desc: SVG root fills the viewport
    crit: notable
    conf: 0.88
    for: [svg]
    if:
      type: text
      regex: '(?is)<svg\b[^>]{0,240}\bwidth\s*=\s*["'']100%["''][^>]{0,120}\bheight\s*=\s*["'']100%'

  # XHTML <body> inside SVG is how foreignObject re-enters the HTML parser.
  - id: svg-xhtml-body-xmlns
    desc: SVG body uses the XHTML namespace
    crit: notable
    conf: 0.9
    for: [svg]
    if:
      type: text
      regex: '<body xmlns="http://www.w3.org/1999/xhtml"'

  # Mobile-viewport meta inside SVG markup: the file is presenting itself as
  # a phone landing page, not a vector graphic.
  - id: svg-embedded-viewport-meta
    desc: SVG embeds a mobile viewport meta
    crit: notable
    conf: 0.88
    for: [svg]
    if:
      type: text
      regex: '(?i)<meta\b[^>]{0,160}name\s*=\s*["'']viewport["'']'

  # Query parameters can configure loaders or ordinary analytics.
  - id: svg-query-param-script-src
    desc: Remote SVG script URL has a query
    crit: notable
    conf: 0.9
    for: [svg]
    if:
      type: text
      regex: '(?i)<script\b[^>]{0,160}\bsrc\s*=\s*["'']https?://[^"'']{3,160}\?[A-Za-z][A-Za-z0-9_]{0,12}='

  - id: inline-svg-script-body
    desc: Inline script body in an SVG document
    crit: notable
    conf: 0.8
    for: [svg]
    if:
      type: text
      regex: '<script\b[^>]{0,200}>\s{0,20}(<!\[CDATA\[\s*)?[^\s<]'
    unless:
      - type: text
        # DAPS/DocBook emits XML-declared XHTML.  It contains inline
        # JavaScript but is not an SVG document.
        regex: '(?is)^\s*(?:<\?xml[^>]*>\s*)?<!DOCTYPE\s+html\b[^>]*>\s*<html\b'
