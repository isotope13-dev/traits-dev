# Inline event-handler attributes on elements whose handlers run when
# content is rendered or fails to load. The attribute alone is ordinary
# HTML; consumers add the handler-body evidence for stronger claims.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, html, json]
  crit: notable
  conf: 0.9

traits:
  - id: html-inline-event-handler-attribute
    desc: HTML tag declares inline event handler
    if:
      type: text
      exclude_html_comments: true
      regex: '<(img|svg|iframe|video|audio|details|input|body)\b[^>]{0,120}\bon\w+\s*='
