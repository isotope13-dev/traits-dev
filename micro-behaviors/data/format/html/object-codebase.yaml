# The HTML attribute refers to an EXE codebase; the matcher does not observe
# a file download, installation, or activation.
defaults:
  platforms: [windows]
  for: [html]

traits:
  - id: object-exe-codebase-reference
    desc: HTML object codebase references an EXE
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)<object.{0,220}codebase\s*=\s*["''][^"'']{1,80}\.exe'
