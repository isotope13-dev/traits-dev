defaults:
  platforms: [windows, unix]
  for: [scripts, source, html, svg, xml, text]
  crit: notable
  conf: 0.98
traits:
  - id: frame-javascript-source-uri
    desc: Frame source uses a JavaScript URI
    if:
      type: text
      regex: '(?i)<i?frame\b[^<>]{0,120}\bsrc=["'']\s*javascript:'
  - id: frame-srcdoc-script-element
    desc: Frame inline document contains script markup
    if:
      type: text
      regex: '(?i)\bsrcdoc=["''][^"'']{0,120}(&lt;|<)script\b'
  - id: frame-srcdoc-event-handler
    desc: Frame inline document contains event handlers
    if:
      type: text
      regex: '(?i)\bsrcdoc=["''][^"'']{0,120}\bon(error|load)\s*='
