defaults:
  platforms: [unix, windows]
  for: [html, markdown, text, xml, rtf, ooxml]

traits:
- id: comment
  desc: HTML or Markdown comment syntax
  crit: component
  conf: 0.72
  for: [html, markdown]
  if:
    type: text
    substr: "<!--"

- id: aria-hidden
  desc: ARIA hidden attribute
  crit: component
  conf: 0.78
  for: [html]
  if:
    type: text
    regex: 'aria-hidden\s*=\s*["'']true["'']'
    case_insensitive: true

- id: aria-visible
  desc: ARIA visible attribute
  crit: component
  conf: 0.78
  for: [html, javascript, typescript]
  if:
    type: text
    regex: 'aria-hidden\s*=\s*["'']false["'']'
    case_insensitive: true

# Parse a complete quoted attribute before `hidden`. A loose `<form... hidden`
# search also finds responsive classes such as `class="hidden md:block"`,
# which do not hide the form unconditionally.
- id: form-hidden-attribute
  desc: Form has HTML hidden attribute
  crit: baseline
  conf: 0.95
  for: [html, javascript, typescript, php]
  if:
    type: text
    regex: '<form\s+hidden(\s|=|>)|<form\b[^>"'']{0,80}["''][^>"'']{0,240}["'']\s+hidden(\s|=|>)'
    case_insensitive: true

- id: opacity-zero-attribute
  desc: Markup element has zero opacity
  crit: baseline
  conf: 0.86
  for: [html]
  if:
    type: text
    regex: 'opacity\s*=\s*["'']0["'']'
    case_insensitive: true

- id: display-none-style-attribute
  desc: HTML style hides content with display:none
  crit: baseline
  conf: 0.86
  for: [html]
  if:
    type: text
    regex: 'style\s*=\s*["''][^"'']{0,240}\bdisplay\s*:\s*none\b'
    case_insensitive: true

- id: zero-font-size-style-attribute
  desc: Zero-font HTML text concealment
  crit: baseline
  conf: 0.84
  for: [html]
  if:
    type: text
    regex: 'style\s*=\s*["''][^"'']{0,240}\bfont-size\s*:\s*0(px)?\b'
    case_insensitive: true

  # Copilot-style indirect injection pages often use 1px white text (CoSnitch)
  # rather than font-size:0 so the node still participates in text extraction.
- id: tiny-font-size-style-attribute
  desc: One-pixel HTML text concealment
  crit: baseline
  conf: 0.84
  for: [html]
  if:
    type: text
    regex: 'style\s*=\s*["''][^"'']{0,240}\bfont-size\s*:\s*1px\b'
    case_insensitive: true

- id: white-text-style
  desc: HTML style declares white text
  crit: baseline
  conf: 0.84
  for: [html]
  if:
    type: text
    regex: 'style.{0,80}\bcolor\s*:\s*(white|#fff)'
    case_insensitive: true

- id: white-background-style
  desc: HTML style declares white background
  crit: baseline
  conf: 0.84
  for: [html]
  if:
    type: text
    regex: 'style.{0,80}\bbackground(-color)?\s*:\s*(white|#fff)'
    case_insensitive: true

- id: image-alt-attribute
  desc: HTML image has an alt attribute
  crit: component
  conf: 0.86
  for: [html]
  if:
    type: text
    regex: '(?is)<img\b[^>]{0,240}\balt\s*=\s*["'']'

- id: image-alt-http-reference
  desc: Image alt attribute contains an HTTP URL
  crit: notable
  conf: 0.9
  for: [html]
  if:
    type: text
    regex: '(?is)<img\b[^>]{0,240}\balt\s*=\s*["''][^"'']{0,200}https?://'

- id: image-alt-text-file-reference
  desc: Image alt names text or CSV files
  crit: notable
  conf: 0.9
  for: [html]
  if:
    type: text
    regex: '(?is)<img\b[^>]{0,240}\balt\s*=\s*["''][^"'']{0,200}\.(txt|csv)\b'

- id: image-alt-office-file-reference
  desc: Image alt names office or ZIP files
  crit: notable
  conf: 0.9
  for: [html]
  if:
    type: text
    regex: '(?is)<img\b[^>]{0,240}\balt\s*=\s*["''][^"'']{0,200}\.(xlsx?|zip)\b'

- id: html-remote-image-source
  desc: HTML references a remote image
  crit: notable
  conf: 0.9
  for: [html]
  if:
    type: text
    regex: '(?i)<img\b[^>]{0,240}\bsrc\s*=\s*["'']https?://'

- id: markdown-remote-image-source
  desc: Markdown references a remote image
  crit: notable
  conf: 0.9
  for: [markdown]
  if:
    type: text
    regex: '(?i)!\[[^\]]{0,120}\]\(\s*https?://[^)\s]{1,220}\.(jpe?g|png|gif|webp)\b'

- id: github-readme-raw-head-image
  desc: GitHub README raw/HEAD markdown image
  crit: component
  conf: 0.95
  for: [markdown]
  if:
    type: text
    regex: '!\[[^\]]{0,120}\]\(\s*https://github\.com/[^)\s]{0,200}/raw/HEAD/'

- id: repeated-zero-width-characters
  desc: Repeated zero-width Unicode characters
  crit: notable
  conf: 0.94
  count_min: 8
  for: [html, markdown, text]
  if:
    type: hex
    pattern: 'E2 80 8B'

- id: html-heading-tag
  desc: Markdown contains an HTML h1 heading
  crit: notable
  conf: 0.85
  for: [markdown]
  if:
    type: text
    substr: "<h1>"
  unless:
    - type: text
      regex: '@status:\s*(enabled|disabled|1|true)'

composite_rules:
- id: image-alt-file-reference
  desc: Image alt attribute names a file type
  crit: notable
  conf: 0.9
  all:
    - id: image-alt-attribute
  any:
    - id: image-alt-text-file-reference
    - id: image-alt-office-file-reference

- id: white-on-white-style
  desc: HTML text hidden by white styling
  crit: notable
  conf: 0.92
  all:
  - id: white-text-style
  - id: white-background-style
  near_bytes: 180

- id: hidden-content
  desc: HTML hidden content or Markdown comment
  crit: component
  conf: 0.78
  any:
  - id: comment
  - id: aria-hidden
  - id: opacity-zero-attribute
  - id: display-none-style-attribute
  - id: zero-font-size-style-attribute
  - id: tiny-font-size-style-attribute
  - id: white-on-white-style
  - id: repeated-zero-width-characters

- id: remote-image-source
  desc: Markup references a remote image
  crit: notable
  conf: 0.9
  for: [html, markdown]
  any:
  - id: html-remote-image-source
  - id: markdown-remote-image-source

- id: remote-image-data-template
  desc: Remote image URL contains a data template
  crit: suspicious
  conf: 0.96
  for: [html, markdown]
  # The description claims the template sits *inside* the image URL, so the
  # window has to be tight enough to make that true. At 600 bytes the legs
  # matched separate constructs several paragraphs apart — a doc that shows a
  # `<PLACEHOLDER>` link in one code fence and a banner image in the next
  # (MegaLinter's release-prep skill) satisfied all three. An <img>/`![]()`
  # whose own URL carries the placeholder fits well inside 120 bytes.
  near_bytes: 120
  unless:
    - id: github-readme-raw-head-image
  all:
  - id: remote-image-source
  - id: micro-behaviors/communications/http/url/path::image-file-url
  - id: micro-behaviors/communications/url/construction/template
