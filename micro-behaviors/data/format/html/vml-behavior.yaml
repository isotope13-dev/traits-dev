defaults:
  platforms: [windows]
  for: [html, javascript, text]

traits:
  - id: vml-default-behavior-binding
    desc: IE VML default behavior bound by CSS
    crit: notable
    conf: 0.9
    attack: T1203
    # Office-exported HTML also binds VML this way, so on its own this is
    # only the legacy IE rendering vector; exploits pair it with a spray.
    if:
      type: text
      regex: '(?i)behavior:\s*url\(\s*#default#VML'
