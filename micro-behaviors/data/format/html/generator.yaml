defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: html-generator-doctype
    desc: HTML doctype in string literal
    # Baseline: `<!DOCTYPE html>` appears in docgen tools, static site
    # generators, test fixture builders, sample package makers, and any code
    # that templates or validates HTML — not a behavior signal on its own.
    crit: baseline
    conf: 0.8
    if:
      type: literal
      kind: string
      substr: <!DOCTYPE html>
  - id: html-document-string-literal
    desc: HTML opening tag in string literal
    crit: baseline
    conf: 0.6
    if:
      type: literal
      kind: string
      regex: '<html[\s>]'
  - id: encoded-html-tag-fragment
    desc: Contains an encoded HTML tag fragment
    crit: component
    conf: 0.7
    for: [elf, pe, macho, python, javascript, shell]
    if:
      type: encoded
      regex: '(?i)</?[a-z][a-z0-9]*(\s|>)'
  - id: html-generator-ext
    desc: Constructs HTML file path
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: '["'']\.html["'']'
  - id: blob-html-document
    desc: Builds text/html Blob object
    crit: notable
    conf: 0.85
    for: [scripts, binaries, html, svg]
    if:
      type: text
      regex: 'new Blob\s*\(\s*\[[^\]]{0,200}\]\s*,\s*\{[^}]{0,80}type\s*:\s*[''"]text/html'
