defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: html-generator-doctype
    desc: Generates HTML content (DOCTYPE)
    # Baseline: `<!DOCTYPE html>` appears in docgen tools, static site
    # generators, test fixture builders, sample package makers, and any code
    # that templates or validates HTML — not a behavior signal on its own.
    crit: baseline
    conf: 0.8
    if:
      type: literal
      kind: string
      substr: <!DOCTYPE html>
    unless:
      - type: text
        substr: _FRONTMATTER_RE
      - type: text
        substr: Vungle Third-Party MRAID Template
      - type: text
        substr: Petite Capitals
    downgrade:
      all:
        - type: symbol
          exact: CreateMdmEnterpriseDiagnosticHTMLReport
        - type: text
          substr: function ToggleTableContent(
  - id: html-document-string-literal
    desc: Contains an HTML document string literal
    crit: notable
    conf: 0.6
    if:
      type: literal
      kind: string
      regex: '<html[\s>]'
    not:
      - substr: <div class="footnotes">
      - substr: (?P<front>
      - substr: (?P<body>
    unless:
      - id: metadata/file/profile/locale::gettext-po-catalog
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - type: text
        substr: Vungle Third-Party MRAID Template
      - type: text
        substr: "<title>Simple IPv6 test</title>"
      - type: text
        substr: "pkginfo.js: Top-level include for the pkginfo module"
      - id: metadata/package/testing/presence/harness::ruby-test-file
      - id: well-known/lib/web/jquery/
    downgrade:
      all:
        - type: symbol
          exact: CreateMdmEnterpriseDiagnosticHTMLReport
        - type: text
          substr: function ToggleTableContent(
  - id: encoded-html-tag-fragment
    desc: Contains an encoded HTML tag fragment
    crit: component
    conf: 0.7
    for: [elf, pe, macho, python, javascript, shell]
    if:
      type: encoded
      regex: '(?i)</?[a-z][a-z0-9]*(\s|>)'
    unless:
      - id: metadata/file/format/
      - id: well-known/app/system/drivers/
      - id: well-known/app/system/drivers/nvidia::ngx-dll-basename
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
      - id: metadata/file/profile/identity::docusaurus-docs-bundle

  - id: html-generator-ext
    desc: Constructs HTML file path
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: '["'']\.html["'']'
  - id: blob-html-document
    desc: Builds text/html Blob object
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'new Blob\s*\(\s*\[[^\]]{0,200}\]\s*,\s*\{[^}]{0,80}type\s*:\s*[''"]text/html'
