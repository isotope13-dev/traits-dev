defaults:
  platforms: [windows, unix]
  for: [svg]

composite_rules:
  - id: svg-foreign-object-remote-script
    desc: SVG opens HTML and loads a remote script
    crit: notable
    conf: 0.97
    all:
      - id: metadata/file/format/markup::svg-foreign-object-element
      - id: micro-behaviors/data/format/html::svg-external-script-source
    near_bytes: 2200

  - id: svg-xhtml-remote-script
    desc: XHTML SVG body loads remote script
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/data/format/html::svg-xhtml-body-xmlns
      - id: micro-behaviors/data/format/html::svg-external-script-source
    near_bytes: 2200

  - id: svg-mobile-viewport-remote-script
    desc: SVG viewport markup accompanies remote script
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/data/format/html::svg-embedded-viewport-meta
      - id: micro-behaviors/data/format/html::svg-query-param-script-src
    near_bytes: 2200
  - id: svg-full-size-remote-script
    desc: Full-size SVG loads a remote script
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/data/format/html::svg-root-full-size
      - id: micro-behaviors/data/format/html::svg-external-script-source

