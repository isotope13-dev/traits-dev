# ASN.1 object identifiers written in dotted-arc form.
#
# The arcs matched here are the registered PKI/X.509 roots — 1.2.840 (US
# ANSI/RSA), 1.3.6.1 (IANA/SNMP), 2.5.4 (X.500 attribute types) and 2.16.840
# (US organizations) — so a string literal starting with one is unambiguously
# an OID table rather than an endpoint. It exists mainly so IPv4-literal rules
# can suppress themselves there: Zig's std/crypto/codecs/asn1/Oid.zig lists
# "1.3.101.112" (Ed25519) beside "1.2.840.113549.1.1.11", and the four-arc one
# is a structurally valid routable quad.
defaults:
  platforms: [unix, windows]
  for: [source, scripts]
  crit: baseline
  conf: 0.9

traits:
  - id: well-known-oid-arc-string
    desc: Registered ASN.1 OID arc prefix
    if:
      type: literal
      kind: string
      regex: '^(1\.2\.840|1\.3\.6\.1|2\.5\.4|2\.16\.840)\.'
  # PKCS#1/RSA implementations (and ASN.1 tooling generally) embed DigestInfo
  # and AlgorithmIdentifier prefixes as hex byte arrays: a nested SEQUENCE
  # opening whose inner SEQUENCE carries an OID tag. Those tables are public
  # format constants, not concealed strings, so the obfuscation composite that
  # pairs hex tables with indexed fromCharCode decoding suppresses itself on
  # them: the EMSA-PKCS1 padding builder converts the table to text with an
  # indexed fromCharCode loop, which is byte assembly, not a string-table
  # decoder.
  - id: der-algorithm-identifier-hex-array
    desc: Hex array holds DER algorithm identifier
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\[0x30,\s?0x\w\w,\s?0x30,\s?0x\w\w,\s?0x06,\s?0x\w\w'
