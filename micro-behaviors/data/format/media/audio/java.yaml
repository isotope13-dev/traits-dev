# Neutral Java Sound API container operations. Encoding PCM into a WAV/AU/AIFF
# file is what every recorder, transcoder, and speech synthesizer does; the
# surveillance objective in objectives/collection/monitor/capture/ supplies the
# capture source (TargetDataLine) that makes it a recording.
defaults:
  platforms: [windows, unix]
  for: [java]
  crit: notable

traits:
  - id: audiosystem-write-file
    desc: Java AudioSystem writes an audio file
    conf: 0.88
    if:
      type: text
      regex: 'AudioSystem\.write\('
  - id: audioinputstream-type
    desc: Java AudioInputStream type reference
    crit: component
    conf: 0.84
    if:
      type: symbol
      kind: identifier
      exact: AudioInputStream
