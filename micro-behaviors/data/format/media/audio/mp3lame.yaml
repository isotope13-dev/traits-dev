# MP3 encode library identity. Legitimate media tools ship libmp3lame; pair
# with microphone capture and HTTP POST before treating as surveillance.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, pe, dll]
  crit: notable
  attack: T1123

traits:
  - id: libmp3lame-dll-name
    desc: Embedded libmp3lame.dll codec name
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\blibmp3lame\.dll\b'

  - id: waveinopen-api-name
    desc: waveInOpen microphone capture API name
    crit: notable
    conf: 0.9
    for: [scripts, source, python, pe, dll, c, cpp]
    if:
      type: text
      word: waveInOpen
