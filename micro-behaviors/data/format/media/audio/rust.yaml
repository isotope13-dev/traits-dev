# Neutral WAV container writes via the Rust `hound` crate. Encoding PCM to a
# WAV file is shared by recorders, transcoders, and speech synthesizers; the
# capture source lives in micro-behaviors/hardware/input/audio/.
defaults:
  platforms: [windows, unix]
  for: [rust]

traits:
  - id: hound-wav-writer
    desc: Rust Hound WAV file writer
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: WavWriter::create
  - id: wav-sample-write
    desc: Writes PCM samples to WAV
    crit: component
    conf: 0.85
    if:
      type: symbol
      exact: writer.write_sample
