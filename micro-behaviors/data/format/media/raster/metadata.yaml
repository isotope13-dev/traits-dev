# Neutral image-type metadata used by loaders and HTTP fixtures. A declared
# MIME type or extension is not evidence of parser confusion by itself; the
# exploit composite supplies the independent HDF5 and file-loader context.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
  conf: 0.82

traits:
  - id: declared-image-mime-type
    desc: Declares an image MIME type
    if:
      type: text
      regex: '(?i)(content[_ -]?type|declared[_ -]?type).{0,80}image/'

  - id: declared-image-extension-type
    desc: Declares an image extension type
    if:
      type: text
      regex: '(?i)(content[_ -]?type|declared[_ -]?type).{0,80}image\.(png|jpe?g|gif)'
