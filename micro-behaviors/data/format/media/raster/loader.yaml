# Image-loader calls are neutral processing capabilities.  Exploit composites
# add the untrusted-input and external-storage context that makes an automatic
# loader handoff dangerous.
defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: image-loader-native-call
    desc: Native image loader call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(new_from_file|load_image)\s*\('

  - id: image-loader-raster-call
    desc: Raster image loader call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(Image\.open|imread|imdecode)\s*\('

composite_rules:
  - id: image-loader-opens-file
    desc: Image loader opens a file
    crit: notable
    conf: 0.9
    any:
      - id: image-loader-native-call
      - id: image-loader-raster-call
