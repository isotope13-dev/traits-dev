# Image-loader calls are neutral processing capabilities.  Exploit composites
# add the untrusted-input and external-storage context that makes an automatic
# loader handoff dangerous.
defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: image-loader-native-call
    desc: Native image loader call
    if:
      type: text
      regex: '(?i)\b(new_from_file|load_image)\s*\('

  - id: raster-image-read-decode-call
    desc: Raster image read/decode call text
    if:
      type: text
      regex: '(?i)\b(imread|imdecode)\s*\('

  - id: python-pil-open-reference
    desc: Python Image.open API reference
    for: [python]
    conf: 0.85
    if:
      type: symbol
      exact: Image.open

composite_rules:
  - id: image-loading-api
    desc: Image loading API references
    any:
      - id: image-loader-native-call
      - id: raster-image-read-decode-call
      - id: python-pil-open-reference
