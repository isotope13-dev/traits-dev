# Native MIME tables and file filters also pack these extensions together.
# The bytes establish file-format vocabulary, not encryption or extortion.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
traits:
  - id: packed-camera-raw-format-extensions
    desc: Packed Canon and Nikon raw-format extensions
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'cr2(cr3)?crwnefnrw'
