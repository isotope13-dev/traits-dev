# Python raster-image libraries. Mirrors the sibling javascript.yaml, which
# already records `sharp` as a notable image-processing import.
#
# Beyond being a capability in its own right, this is the honest separator
# between image *processing* and an image extension used as camouflage: a script
# that downloads a `.png` and hands it to Pillow/OpenCV is doing image work,
# whereas one that base64-decodes or unzips the same response is using the
# extension as cover. The image-carrier composite in
# objectives/command-and-control/dropper/delivery/multistage/ references this
# from its `unless:` for exactly that reason.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-imaging-library-import
    desc: Imports a Python raster imaging library
    if:
      type: text
      regex: '(?m)^\s*(from\s+PIL\b|import\s+(PIL|cv2|imageio)\b)'
