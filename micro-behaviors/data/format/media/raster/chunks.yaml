defaults:
  platforms: [windows, unix]
  for: [scripts]

traits:
  - id: png-idat-chunk-literal
    desc: References PNG image-data chunk marker
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '["'']IDAT["'']'

  - id: png-iend-chunk-literal
    desc: References PNG image-end chunk marker
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '["'']IEND["'']'

  # The eight-byte PNG signature spelled as an escaped byte literal or a byte
  # array: code that compares it is validating a PNG before walking its chunks.
  - id: png-signature-literal
    desc: References the PNG file signature bytes
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\\x89PNG|0x89,\s*0x50,\s*0x4[Ee],\s*0x47'

composite_rules:
  # A chunk walker needs only the signature and the terminator: carriers that
  # hide a stage in an ancillary chunk never touch IDAT at all.
  - id: png-signature-chunk-walker
    desc: Source walks PNG chunks from signature to IEND
    crit: notable
    conf: 0.9
    all:
      - id: png-signature-literal
      - id: png-iend-chunk-literal

  - id: png-chunk-parser
    desc: Source parses PNG image-data and image-end chunks
    crit: notable
    conf: 0.9
    all:
      - id: png-idat-chunk-literal
      - id: png-iend-chunk-literal
