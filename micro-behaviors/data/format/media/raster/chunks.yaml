defaults:
  platforms: [windows, unix]
  for: [scripts]

traits:
  - id: png-idat-chunk-literal
    desc: References PNG image-data chunk marker
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '["'']IDAT["'']'

  - id: png-iend-chunk-literal
    desc: References PNG image-end chunk marker
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '["'']IEND["'']'

composite_rules:
  - id: png-chunk-parser
    desc: Source parses PNG image-data and image-end chunks
    crit: notable
    conf: 0.9
    all:
      - id: png-idat-chunk-literal
      - id: png-iend-chunk-literal
