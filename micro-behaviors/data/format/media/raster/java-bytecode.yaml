defaults:
  platforms: [unix, windows]
  for: [class]
  crit: notable
traits:
  - id: jvm-png-signature-byte-array
    desc: JVM constructs the eight-byte PNG signature
    conf: 0.98
    if:
      type: hex
      pattern: '10 08 BC 08 59 03 10 89 54 59 04 10 50 54 59 05 10 4E 54 59 06 10 47 54 59 07 10 0D 54 59 08 10 0A 54 59 10 06 10 1A 54 59 10 07 10 0A 54'
