defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: javascript-gif-encoder-create
    desc: Creates a JavaScript GIF encoder
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: createGifEncoder

  # Matched as a module specifier, not as the bare name: `sharp` is an ordinary
  # English word and a perfectly good variable — js-beautify declares
  # `var sharp = '#'` for the sharp-variable sigil, and that was reported as
  # use of the image-processing library.
  - id: js-sharp-image-processing
    desc: Uses sharp image processing
    conf: 0.95
    if:
      type: import
      exact: sharp

  - id: javascript-jpeg-app13-segment-parser
    desc: Parses a JPEG APP13 metadata segment
    conf: 0.94
    if:
      type: text
      # APP13 is marker 0xED. Pair it with the JPEG segment-length read so an
      # unrelated numeric comparison to 237 cannot masquerade as image parsing.
      regex: 'readUInt16BE[\s\S]{0,400}===\s*(0xED|237)\b'

  - id: node-package-jpeg-path-join
    desc: Joins package directory to a JPEG filename
    conf: 0.93
    if:
      type: text
      regex: 'join\s*\(\s*__dirname\s*,\s*[''"][^''"]{1,40}\.jpe?g[''"]\s*\)'

  - id: javascript-jpeg-terminator-search
    desc: Searches for a JPEG end marker
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(rfind|lastIndexOf|memmem)\s*\([^\r\n]{0,80}\\x[fF][fF]\\x[dD]9'

  - id: javascript-png-terminator-search
    desc: Searches for a PNG end marker
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(rfind|lastIndexOf|memmem)\s*\([^\r\n]{0,80}(IEND|\\x49\\x45\\x4[eE]\\x44)'

  # Loaders that avoid a PNG parser often spell the complete IEND chunk tail
  # as a byte array before searching for it in a carrier buffer. This is a
  # neutral format operation; the decrypt/write chain supplies malicious intent.
  - id: source-png-iend-byte-prefix
    desc: Source declares PNG IEND byte prefix
    conf: 0.96
    for: [javascript, typescript, powershell]
    if:
      type: text
      regex: '(?i)0x49\s*,\s*0x45\s*,\s*0x4e\s*,\s*0x44\s*,\s*0xae'
