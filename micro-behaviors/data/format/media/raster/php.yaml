defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.98
traits:
  - id: wordpress-image-editor
    desc: Loads an image into WordPress editor
    if:
      type: symbol
      kind: call
      exact: wp_get_image_editor
  - id: php-image-dimension-query
    desc: PHP reads image dimensions and type
    if:
      type: symbol
      kind: call
      exact: getimagesize
