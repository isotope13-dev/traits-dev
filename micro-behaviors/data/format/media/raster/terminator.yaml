# Byte/literal searches for image end markers across source languages.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: source-jpeg-terminator-search
    desc: Searches for a JPEG end marker
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(rfind|lastIndexOf|memmem)\s*\([^\r\n]{0,80}\\x[fF][fF]\\x[dD]9'

  - id: source-png-terminator-search
    desc: Searches for a PNG end marker
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(rfind|lastIndexOf|memmem)\s*\([^\r\n]{0,80}(IEND|\\x49\\x45\\x4[eE]\\x44)'

