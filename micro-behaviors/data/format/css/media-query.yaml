# @media prelude shapes in stylesheet text. Custom-media and comment-terminated
# preludes are neutral alone; objectives combine them with exfil or overlay legs.
defaults:
  platforms: [unix, windows]
  for: [html, text]
  crit: notable
  conf: 0.96

traits:
  - id: css-media-comment-rule-injection
    desc: Media prelude comment rule injection
    if:
      type: text
      # A sanitizer-approved @media prelude ends at ';', then a comment closes
      # the quoted context and the next '.' begins attacker-controlled rules.
      regex: '@media.{0,80};\s*/\*[^*]{0,32}\*/\s*\.[a-zA-Z]'
