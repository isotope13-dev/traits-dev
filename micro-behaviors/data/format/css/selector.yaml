# Selector shapes in stylesheet text. `[value^="a"]` and friends select on the
# *content* a user has typed into an input rather than on markup structure —
# neutral CSS on its own (a few libraries style fields by value prefix), but it
# is the primitive a CSS-only keylogger repeats once per candidate character.
defaults:
  platforms: [unix, windows]
  # Standalone stylesheets are classified as text, an inline `<style>` block as
  # html. Both carry these selectors, and CSS injected into a page (webmail
  # body, stored XSS) only ever arrives as the html half.
  for: [html, text]

traits:
  - id: href-attribute-selector
    desc: Repeated CSS href attribute selectors
    # Documentation themes and client-side routers routinely repeat href
    # prefix/substring selectors for root, hash, and query-fragment links.
    # The selector is only an exfiltration primitive when a consuming
    # objective also proves a nearby attacker-controlled resource load.
    crit: baseline
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*href\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'
    unless:
      - id: metadata/package/testing/corpus::web-page-test-corpus-path

  - id: value-attribute-selector
    desc: CSS value attribute selector
    crit: suspicious
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*value\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: src-attribute-selector
    desc: CSS src attribute selector
    crit: suspicious
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*src\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'
    unless:
      - id: metadata/package/testing/corpus::web-page-test-corpus-path

  # Unlike href/value/src (content a user typed or a URL the page loads),
  # `data-*` is a developer-defined custom attribute almost always set by the
  # page's own script for UI/state styling hooks (`data-theme`, `data-tab`,
  # `data-level`, ...), not populated from raw user input one attempts a
  # CSS-injection sweep against. A UI with a handful of state-driven data
  # attributes (themes, tabs, gamified level/rank styling) routinely clears
  # count_min:4 with no exfiltration involved, so this stays out of the
  # keylogger-sweep composite below and sits at baseline on its own.
  - id: data-attribute-selector
    desc: CSS data attribute selector
    crit: baseline
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*data-[a-z0-9_-]+\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'
    unless:
      - id: metadata/library/semantic-ui::semantic-ui-min-css-path

  - id: token-attribute-selector
    desc: CSS token attribute selector
    crit: suspicious
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*token[a-z0-9_-]*\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: code-attribute-selector
    desc: CSS code attribute selector
    crit: suspicious
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*code[a-z0-9_-]*\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: key-attribute-selector
    desc: CSS key attribute selector
    crit: suspicious
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*key[a-z0-9_-]*\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: secret-attribute-selector
    desc: CSS secret attribute selector
    crit: suspicious
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*secret[a-z0-9_-]*\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: attribute-value-content-selector
    desc: CSS selector matching input value content
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\[\s*value\s*[\^$*]=\s*["'']'

  - id: single-character-value-selector-sweep
    desc: CSS enumerates one-character input values
    crit: suspicious
    conf: 0.95
    count_min: 8
    if:
      type: text
      regex: '\[\s*value\s*[\^$*]=\s*["''].["'']'

composite_rules:
  - id: content-attribute-selector-sweep
    desc: Repeated content-attribute selectors
    # This umbrella preserves a common leg for CSS-oracle objectives, but the
    # selectors alone are neutral stylesheet mechanics. Sensitive intent is
    # supplied by token-bearing selectors or a correlated remote URL fetch.
    crit: baseline
    conf: 0.96
    any:
      - id: href-attribute-selector
      - id: value-attribute-selector
      - id: src-attribute-selector
      - id: token-attribute-selector
      - id: code-attribute-selector
      - id: key-attribute-selector
      - id: secret-attribute-selector

  - id: attribute-selector-family
    desc: Multiple CSS attribute selector families
    crit: notable
    conf: 0.9
    needs: 2
    any:
      - id: href-attribute-selector
      - id: value-attribute-selector
      - id: src-attribute-selector
      - id: data-attribute-selector
      - id: token-attribute-selector
      - id: code-attribute-selector
      - id: key-attribute-selector
      - id: secret-attribute-selector
