# Selector shapes in stylesheet text. `[value^="a"]` and friends select on the
# *content* a user has typed into an input rather than on markup structure —
# neutral CSS on its own (a few libraries style fields by value prefix), but it
# is the primitive a CSS-only keylogger repeats once per candidate character.
defaults:
  platforms: [unix, windows]
  for: [text]

traits:
  - id: href-attribute-selector
    desc: CSS href attribute selector
    crit: notable
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*href\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: value-attribute-selector
    desc: CSS value attribute selector
    crit: notable
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*value\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: src-attribute-selector
    desc: CSS src attribute selector
    crit: notable
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*src\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: data-attribute-selector
    desc: CSS data attribute selector
    crit: notable
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*data-(?!placement)[a-z0-9_-]+\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'
    unless:
      - id: metadata/library/semantic-ui::semantic-ui-min-css-path

  - id: token-attribute-selector
    desc: CSS token attribute selector
    crit: notable
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*token[a-z0-9_-]*\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: code-attribute-selector
    desc: CSS code attribute selector
    crit: notable
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*code[a-z0-9_-]*\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: key-attribute-selector
    desc: CSS key attribute selector
    crit: notable
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*key[a-z0-9_-]*\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: secret-attribute-selector
    desc: CSS secret attribute selector
    crit: notable
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i)\[\s*secret[a-z0-9_-]*\s*[*^$|~]=\s*["''][^"'']{1,160}["'']\]'

  - id: attribute-value-content-selector
    desc: CSS selector matching input value content
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\[\s*value\s*[\^$*]=\s*["'']'

composite_rules:
  - id: attribute-selector-family
    desc: Multiple CSS attribute selector families
    crit: notable
    conf: 0.9
    needs: 2
    any:
      - id: href-attribute-selector
      - id: value-attribute-selector
      - id: src-attribute-selector
      - id: data-attribute-selector
      - id: token-attribute-selector
      - id: code-attribute-selector
      - id: key-attribute-selector
      - id: secret-attribute-selector
