defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  # This shape also occurs in PostCSS's own legacy plugin adapter. It proves
  # neither a scoped import nor a substituted dependency; carrier rules must
  # require the separate dependency and import evidence.
  - id: postcss-plugin-factory-array
    desc: PostCSS array contains plugin factory call
    if:
      type: text
      regex: 'postcss\s*\(\s*\[\s*\w+\s*\('
