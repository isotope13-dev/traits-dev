defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  # This shape also occurs in PostCSS's own legacy plugin adapter. It proves
  # neither a scoped import nor a substituted dependency; carrier rules must
  # require the separate dependency and import evidence.
  - id: postcss-plugin-factory-array
    desc: PostCSS array contains plugin factory call
    if:
      # The array/call structure is not exposed by projected call facts.
      # Parse it so comments cannot hide registration or supply quoted code.
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @postcss
          arguments: (arguments . (array . (call_expression) @factory) .)) @registration
          (#eq? @postcss "postcss")
          (#set! cleave.ignore-comments "true"))

  - id: postcss-use-plugin-factory
    desc: PostCSS use call receives plugin factory
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression
            object: (call_expression function: (identifier) @postcss)
            property: (property_identifier) @use)
          arguments: (arguments . (call_expression) @factory .)) @registration
          (#eq? @postcss "postcss")
          (#eq? @use "use")
          (#set! cleave.ignore-comments "true"))

composite_rules:
  - id: postcss-plugin-factory-registration
    desc: PostCSS registers a plugin factory result
    crit: notable
    any:
      - id: postcss-plugin-factory-array
      - id: postcss-use-plugin-factory
