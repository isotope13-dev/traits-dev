defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: postcss-options-function
    desc: Declares PostCSS options conversion function
    conf: 0.96
    if:
      type: text
      substr: 'function toPostcssOptions(config)'
  - id: motion-base-function
    desc: Declares motion-base construction function
    conf: 0.97
    if:
      type: text
      substr: 'function buildMotionBase(config)'
  # Same template with the base builder renamed: the options function feeds
  # postcss() through a scoped helper, and the builder that calls it is named
  # buildVariables (flare-animate 2.3.6 lib/styles/variables.js).
  - id: motion-variables-function
    desc: Declares motion-variables build function
    conf: 0.95
    if:
      type: text
      substr: 'function buildVariables(config)'

composite_rules:
  # Named here because a disjunction cannot nest inside the template's `all`.
  - id: motion-builder-function
    desc: Declares a motion-base or motion-variables builder
    conf: 0.95
    any:
      - id: motion-base-function
      - id: motion-variables-function

  - id: scoped-motion-helper-build
    desc: PostCSS build with scoped animation helper
    conf: 0.98
    all:
      - id: postcss-options-function
      - id: motion-builder-function
      - id: postcss-plugin-factory-registration
    any:
      - id: micro-behaviors/os/module/require::scoped-postcss-motion-helper
      - id: metadata/import/package::require-scoped-package
