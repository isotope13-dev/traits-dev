defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: postcss-options-function
    desc: Declares PostCSS options conversion function
    conf: 0.96
    if:
      type: text
      substr: 'function toPostcssOptions(config)'
  - id: motion-base-function
    desc: Declares motion-base construction function
    conf: 0.97
    if:
      type: text
      substr: 'function buildMotionBase(config)'
composite_rules:
  - id: scoped-motion-helper-build
    desc: PostCSS build with scoped animation helper
    conf: 0.98
    all:
      - id: micro-behaviors/os/module/require::scoped-postcss-motion-helper
      - id: postcss-options-function
      - id: motion-base-function
      - id: postcss-plugin-factory-registration
