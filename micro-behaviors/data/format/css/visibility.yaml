defaults:
  platforms: [unix, windows]
  # HTML/JavaScript have canonical UI-style atoms elsewhere; keep these
  # text-format observations for stylesheet-like documents and raw text.
  for: [markdown, text, xml, rtf, ooxml]

traits:
- id: display-none
  desc: CSS rule hides elements with display:none
  crit: baseline
  conf: 0.82
  if:
    type: text
    regex: '\bdisplay\s*:\s*none\b'
    case_insensitive: true

- id: visibility-hidden
  desc: Hides elements with CSS visibility:hidden
  crit: baseline
  conf: 0.8
  if:
    type: text
    regex: '\bvisibility\s*:\s*hidden\b'
    case_insensitive: true

# `text-security` replaces rendered glyphs with dots. On an `<input>` that is
# the documented way to build a custom password field; on a `<select>` there is
# nothing to mask — the declaration exists to make a dropdown *look* like a
# password box, which is why this one is called out separately from the
# element-hiding rules above.
- id: select-masked-as-password-field
  desc: Select element styled with password dot masking
  # Unusual form styling, but not input capture or transport by itself.
  crit: notable
  conf: 0.96
  for: [html, text]
  if:
    type: text
    # Anchored on the bare element selector so `.form-select { … }` (a real
    # password input named for its class) is not read as a masked dropdown.
    regex: '(?i)(^|[\s};>])select\s*\{[^}]{0,700}(-webkit-)?text-security\s*:\s*(disc|circle|square)'

- id: opacity-zero
  desc: CSS rule makes elements fully transparent
  crit: baseline
  conf: 0.78
  if:
    type: text
    # `\b` after the 0 is NOT enough: a digit/dot boundary exists inside
    # `opacity:0.42`, so a plain `\bopacity\s*:\s*0\b` claims "fully
    # transparent" for every fractional opacity an SVG or theme declares.
    # Require the value to end right after the 0.
    regex: '\bopacity\s*:\s*0([^.\d]|$)'
    case_insensitive: true
