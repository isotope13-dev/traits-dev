# `@font-face` shapes in stylesheet text.
#
# A per-character font oracle declares one @font-face per candidate character,
# each scoped to exactly one codepoint, so whichever character the page renders
# fetches the font URL that names it. Ordinary webfont subsetting (Google
# Fonts, Fontsource, icon fonts) writes block ranges or comma-separated lists,
# and per-glyph icon fonts sit in the Private Use Area — so requiring the whole
# value to be a lone codepoint *inside the printable ASCII range that secrets
# are written in* (U+30-U+7F: digits, letters, base32/hex/base64 alphabets) is
# what separates the oracle from a normal @font-face stack.
defaults:
  platforms: [unix, windows]
  for: [html, text]

traits:
  - id: single-codepoint-font-face-sweep
    desc: Font faces scoped to single ASCII codepoints
    crit: suspicious
    conf: 0.97
    # A sweep has to cover an alphabet; 8 keeps digits-only variants in range
    # while staying above any hand-written @font-face stack.
    count_min: 8
    if:
      type: text
      # Require a complete singleton token.  A range such as U+0400-045F
      # must not be accepted by matching the U+040 prefix.
      regex: '@font-face[^}]{0,240}unicode-range\s*:\s*U\+0{0,2}[3-7][0-9a-f]\s*;'
      case_insensitive: true
    unless:
      - id: well-known/lib/ui/han-css/

  # `baseline`, not `notable`: a selector block that sets `font-family` is
  # present in very nearly every stylesheet ever written, so it fails the
  # differential-analysis test on its own — no analyst investigates a package
  # version that added a font declaration. It is a clear but universal property,
  # which is exactly what baseline is for, and the oracle intent comes from the
  # single-codepoint sweep and the remote font URL it is composed with.
  - id: css-rule-font-family-use
    desc: CSS rule applies a named font family
    crit: baseline
    conf: 0.9
    if:
      type: text
      # A normal selector block, rather than an @font-face declaration, must
      # apply a family before a font declaration can act as an oracle.
      regex: '(?i)(^|})[^@{}]{0,60}\{[^}]{0,60}font-family\s*:'
