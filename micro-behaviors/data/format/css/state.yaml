# CSS state selectors. These are neutral mechanics; an objective composite
# adds intent when a state-dependent rule also causes a real resource fetch.
defaults:
  platforms: [unix, windows]
  for: [html, text]

traits:
  - id: adjacent-checked-option-selector
    desc: CSS selects adjacent checked options
    crit: notable
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i)option\s*\+\s*option[^{}]{0,100}:\s*checked[^{}]{0,40}\{'

  - id: has-checked-option-selector
    desc: CSS matches checked options with has
    crit: notable
    conf: 0.9
    count_min: 4
    if:
      type: text
      regex: '(?i):has\(\s*option\b[^)]{0,80}:\s*checked[^{}]{0,40}\{'

composite_rules:
  - id: checked-option-state-sweep
    desc: CSS repeats checked-option state selectors
    crit: notable
    conf: 0.9
    any:
      - id: adjacent-checked-option-selector
      - id: has-checked-option-selector
