# CSS parser-boundary syntax used to make a sanitizer and the browser disagree
# about where an at-rule ends.  The marker is structural: a `@media` prelude is
# terminated by `;` (which no valid stylesheet does — a browser drops such an
# at-statement), a comment then closes whatever quoted context the sanitizer
# believed it was in, and the rules that follow are attacker-authored.  It is
# not tied to a particular webmail provider.
defaults:
  platforms: [unix, windows]
  for: [html, text]

traits:
  - id: media-prelude-semicolon-comment-mutation
    desc: Rules follow a semicolon-ended @media
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # `@media <prelude> ; /* … */ <selector>` — the comment may carry the
      # quote (`/*"*/`) that unbalances the sanitizer's parser, but the
      # boundary mutation is the semicolon-then-comment-then-rule shape.
      regex: '(?i)@media[^;{}\n]{0,60};\s*/\*[^*]{0,16}\*/\s*[.#a-z\[]'
