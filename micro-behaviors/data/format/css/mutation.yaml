# CSS parser-boundary syntax used to make a sanitizer and the browser disagree
# about where an at-rule ends.  The marker is structural: a custom media
# prelude is terminated early, then a quote-bearing comment is followed by a
# new selector.  It is not tied to a particular webmail provider.
defaults:
  platforms: [unix, windows]
  for: [html, text]

traits:
  - id: custom-media-selector-boundary-mutation
    desc: CSS media prelude followed by selector
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?is)@media\s+--[a-z0-9_-]+\s*;\s*/\*\s*["''][^*]{0,8}\*/\s*[^{}\n]{1,180}\{[^}]{1,800}\}'
