defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  attack: T1056.001

traits:
  - id: css-input-suffix-image-url
    desc: "Input value suffix selects image URL"
    crit: suspicious
    conf: 0.96
    for: [javascript]
    if:
      type: text
      regex: 'input\[value\$=.{0,80}background-image:\s*url'
