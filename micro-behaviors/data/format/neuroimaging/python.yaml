# Python neuroimaging format libraries (NIfTI, GIFTI, and related volumes).
# Importing nibabel is a clear scientific-format capability, parallel to the
# raster imaging and HDF5 import atoms elsewhere under data/format/.
defaults:
  platforms: [linux, macos, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: nibabel-import
    desc: Imports the nibabel neuroimaging library
    if:
      type: import
      regex: '^nibabel($|\.)'
