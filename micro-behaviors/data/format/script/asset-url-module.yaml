# A bundler asset-loader stub: the entire file is one statement that exports
# the URL or data-URI of an emitted asset (ESM `export default` or CommonJS
# `module.exports`). Anchored to the whole file so any appended or surrounding
# code stops it matching; a stub like this is inert, which is why font-named
# copies of it are build output, not a disguise.
defaults:
  platforms: [unix, windows]
  for: [scripts, text, media, font, data]
  crit: baseline
  conf: 1.0
traits:
  - id: webpack-asset-url-module
    desc: Webpack asset URL export module
    if:
      type: text
      regex: '\A\s*export default __webpack_public_path__ \+ "[^"\n]{1,200}";?\s*\z'

  - id: bundler-font-data-url-esm
    desc: ESM inlined font data URL export module
    if:
      type: text
      regex: '\A\s*export default\s*["'']data:font/\w+;base64,[A-Za-z0-9+/=]+["''];?\s*\z'

  - id: bundler-font-data-url-cjs
    desc: CommonJS inlined font data URL export module
    if:
      type: text
      regex: '\A\s*module\.exports\s*=\s*["'']data:font/\w+;base64,[A-Za-z0-9+/=]+["''];?\s*\z'

composite_rules:
  - id: bundler-font-data-url-module
    desc: Bundler inlined font data URL export module
    any:
      - id: bundler-font-data-url-esm
      - id: bundler-font-data-url-cjs
