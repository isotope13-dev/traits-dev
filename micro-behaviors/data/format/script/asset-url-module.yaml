# A bundler asset-loader stub: the entire file is one ES-module statement that
# exports the public URL of an emitted asset. Anchored to the whole file so
# any appended or surrounding code stops it matching; a stub like this is
# inert, which is why font-named copies of it are build output, not a disguise.
defaults:
  platforms: [unix, windows]
  for: [text, media, font, data]
  crit: baseline
  conf: 1.0
traits:
  - id: webpack-asset-url-module
    desc: Webpack asset URL export module
    if:
      type: text
      regex: '\A\s*export default __webpack_public_path__ \+ "[^"\n]{1,200}";?\s*\z'

  - id: bundler-font-data-url-module
    desc: Bundler inlined font data URL export module
    if:
      type: text
      regex: '\A\s*export default ["'']data:font/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=]+["''];?\s*\z'
