# Source-comment carrier shapes. These atoms intentionally inspect only comment
# syntax, placement density, and size. They do not match the English prose in a
# comment: licenses, documentation, and adversarial prompts can all share words,
# while the attack-relevant interpretation belongs in objective composites that
# also require executable malicious behavior.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

traits:
  - id: contiguous-long-vb-comment-block
    desc: Five contiguous long VB comments
    crit: notable
    conf: 0.9
    for: [vbs]
    if:
      type: text
      # Covers both REM and apostrophe comments. GuardBreaker used a run of REM
      # lines before the operational body; requiring five long contiguous lines
      # captures the carrier shape without depending on its safety topic.
      regex: "(?mi)(^[ \\t]*(REM\\b|')[^\\r\\n]{30,}\\r?\\n){5,}"
