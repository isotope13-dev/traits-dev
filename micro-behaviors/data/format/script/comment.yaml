# Source-comment carrier shapes. These atoms intentionally inspect only comment
# syntax, placement density, and size. They do not match the English prose in a
# comment: licenses, documentation, and adversarial prompts can all share words,
# while the attack-relevant interpretation belongs in objective composites that
# also require executable malicious behavior.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

traits: []
