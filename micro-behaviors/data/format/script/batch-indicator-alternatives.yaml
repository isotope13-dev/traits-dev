defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
composite_rules:
  - id: batch-indicator-alternatives
    desc: Batch indicator alternatives
    crit: component
    any:
      - id: micro-behaviors/os/console/io::batch-echo-variable-command-text
      - id: micro-behaviors/fs/path/extension::bat-dup
      - id: micro-behaviors/fs/path/extension::cmd-dup
