# Windows batch-script content carried inside a *non-batch* file: a here-doc,
# template string, or byte blob that another program writes out as a .bat/.cmd
# and then runs. Recognizing the embedded format is neutral — installers,
# launchers, and test fixtures all do it — so these stay capability facts and
# the dropper intent is inferred by composites that add the write + execute
# legs.
defaults:
  platforms: [windows]
  # Exclude batch itself: `@echo off` in a .bat/.cmd is just the script's own
  # first line, not one format carrying another.
  for: [scripts, source, -batch]
  crit: notable
  conf: 0.85

traits:
  # `@echo off` is the opening line of essentially every generated batch file;
  # a language whose own comment syntax is not `@echo` carrying it means the
  # text is destined for a .bat/.cmd on disk.
  - id: embedded-batch-script-header
    desc: File embeds Windows batch script content
    if:
      type: text
      regex: '(?i)@echo\s+off\b'

  # A polyglot that feeds its own path to findstr on the same command, or
  # passes that path to ReadAllLines, is a loader. A later `del "%~f0"` after
  # `netstat | findstr` is a restart script deleting itself, not a self-read.
  - id: embedded-batch-self-reading-loader
    desc: Embedded batch self-reader loader
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?is)(findstr[^\r\n|]{0,48}%~f0|%~f0.{0,80}ReadAllLines|ReadAllLines.{0,80}%~f0)'
    # Restart-quoting unit tests assert on (and against) these tokens; a
    # `not.toContain("findstr")` assertion is the opposite of a loader.
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"

  - id: embedded-batch-delayed-expansion
    desc: Batch delayed variable expansion enabled
    crit: notable
    conf: 0.9
    for: [batch, scripts, source]
    if:
      type: text
      regex: '(?i)setlocal\s+EnableDelayedExpansion\b'

  # `pause` / `pause > nul` at the tail of embedded batch content keeps the
  # console window up after the commands finish — a deliberately user-visible
  # console, the opposite of what a silent installer step wants.
  - id: embedded-batch-pause-prompt
    desc: Embedded batch script pauses for a keypress
    conf: 0.8
    if:
      type: text
      regex: '(?is)@echo\s+off\b.{0,900}[\r\n]\s*pause\s*(>\s*nul)?[\r\n]'
