defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: js-define-locale-call
    desc: Calls a locale registration method
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)defineLocale$'
  - id: js-locale-formatting-call
    desc: JavaScript locale-aware formatting call
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)toLocale(Date|Time)?String$|^Intl\.'

  # Relocated from well-known/app/system/mdn, where it was the second leg of the
  # MDN-documentation exception. The matcher counts distinct `Date.prototype.X`
  # references, which is what a date LIBRARY looks like, not what MDN is: it
  # fired at notable on moment.js inside Crux's ClojureScript console
  # (`z(Date.prototype.toISOString)?...`), labelling a database UI as a copy of
  # the MDN docs. The MDN identity comes from the other leg of that composite —
  # the "Date time string format" page title — which still gates it.
  - id: js-date-prototype-api-sweep
    desc: Enumerates the Date.prototype method table
    conf: 1.0
    count_min: 8
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
    if:
      type: text
      regex: 'Date\.prototype\.[A-Za-z]'

composite_rules:
  - id: js-locale-registration-without-bundle
    desc: Locale registration without bundle indicators
    conf: 0.95
    # Locale registrations inside general module bundles do not make the
    # entire bundle a locale resource. This role depends on code, not names.
    any:
      - id: js-define-locale-call
      - id: well-known/lib/ui/fullcalendar::fullcalendar-locale-registration
      - id: well-known/lib/ui/fullcalendar::fullcalendar-global-locale-push
      - id: well-known/lib/ui/fullcalendar::fullcalendar-locale-option-set
    unless:
      - id: metadata/build/bundler/wrapper::webpack-jsonp-module-registration
      - id: metadata/build/bundler/wrapper::javascript-chunk-module-registration
      - id: metadata/build/bundler/runtime::webpack-modules-wrapper
      - id: metadata/build/bundler/wrapper::esbuild-bundled--toesm
