defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: js-locale-formatting-call
    desc: JavaScript locale-aware formatting call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)toLocale(Date|Time)?String$|^Intl\.'

  # Relocated from well-known/app/system/mdn, where it was the second leg of the
  # MDN-documentation exception. The matcher counts distinct `Date.prototype.X`
  # references, which is what a date LIBRARY looks like, not what MDN is: it
  # fired at notable on moment.js inside Crux's ClojureScript console
  # (`z(Date.prototype.toISOString)?...`), labelling a database UI as a copy of
  # the MDN docs. The MDN identity comes from the other leg of that composite —
  # the "Date time string format" page title — which still gates it.
  - id: js-date-prototype-api-sweep
    desc: Enumerates the Date.prototype method table
    crit: notable
    conf: 1.0
    count_min: 8
    unless:
      - id: well-known/app/ai/aui-agent-builder/
    if:
      type: text
      regex: 'Date\.prototype\.[A-Za-z]'
