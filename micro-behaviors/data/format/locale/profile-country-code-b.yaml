defaults:
  crit: component
  conf: 0.6
  platforms:
  - windows
  - linux
  - macos
  for:
  - javascript
  - pe
  - elf
  - macho
  - batch
  - powershell
traits:
- id: country-code-kg
  desc: Quoted KG token, possible country code
  crit: component
  conf: 0.6
  if:
    type: text
    regex: "[\"']KG[\"']"
  unless:
  - id: micro-behaviors/ui/controls/form::short-code-label-selector-catalog

- id: country-code-kz
  desc: Quoted KZ token, possible country code
  crit: component
  conf: 0.6
  if:
    type: text
    regex: "[\"']KZ[\"']"
  unless:
  - id: metadata/binary/section/name::fwimage-section
  - id: micro-behaviors/ui/controls/form::short-code-label-selector-catalog

- id: country-code-md
  desc: Quoted MD token, possible country code
  crit: component
  conf: 0.6
  if:
    type: text
    regex: "[\"']MD[\"']"
  unless:
  - id: metadata/binary/section/name::fwimage-section
  - id: micro-behaviors/ui/controls/form::short-code-label-selector-catalog
