defaults:
  crit: component
  conf: 0.6
  platforms:
  - windows
  - linux
  - macos
  for:
  - javascript
  - pe
  - elf
  - macho
  - batch
  - powershell
traits:
- id: country-code-ru
  desc: Quoted RU token, possible country code
  crit: component
  conf: 0.6
  if:
    type: text
    regex: "[\"']RU[\"']"
  unless:
  - id: micro-behaviors/ui/controls/form::short-code-label-selector-catalog

- id: country-code-tj
  desc: Quoted TJ token, possible country code
  crit: component
  conf: 0.6
  if:
    type: text
    regex: "[\"']TJ[\"']"
  unless:
  - id: micro-behaviors/ui/controls/form::short-code-label-selector-catalog
