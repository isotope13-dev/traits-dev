defaults:
  crit: component
  conf: 0.6
  platforms:
  - windows
  - linux
  - macos
  for:
  - javascript
  - pe
  - elf
  - macho
  - batch
  - powershell
traits:
- id: country-code-am
  desc: Quoted AM token, possible country code
  crit: component
  conf: 0.6
  if:
    type: text
    regex: "[\"']AM[\"']"
  unless:
  - id: micro-behaviors/ui/controls/form::short-code-label-selector-catalog

- id: country-code-az
  desc: Quoted AZ token, possible country code
  crit: component
  conf: 0.6
  if:
    type: text
    regex: "[\"']AZ[\"']"
  unless:
  - id: micro-behaviors/ui/controls/form::short-code-label-selector-catalog
  - id: metadata/binary/section/name::fwimage-section

- id: country-code-by
  desc: Quoted BY token, possible country code
  crit: component
  conf: 0.6
  if:
    type: text
    regex: "[\"']BY[\"']"
  unless:
  - id: metadata/binary/section/name::fwimage-section
  - id: micro-behaviors/ui/controls/form::short-code-label-selector-catalog
