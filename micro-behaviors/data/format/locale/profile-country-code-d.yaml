defaults:
  crit: component
  conf: 0.6
  platforms:
  - windows
  - linux
  - macos
  for:
  - javascript
  - pe
  - elf
  - macho
  - batch
  - powershell
traits:
- id: country-code-ua
  desc: Quoted UA token, possible country code
  crit: component
  conf: 0.6
  if:
    type: text
    regex: "[\"']UA[\"']"
  unless:
  - id: micro-behaviors/ui/controls/form::short-code-label-selector-catalog
  - id: metadata/binary/section/name::fwimage-section

- id: country-code-uz
  desc: Quoted UZ token, possible country code
  crit: component
  conf: 0.6
  if:
    type: text
    regex: "[\"']UZ[\"']"
  unless:
  - id: micro-behaviors/ui/controls/form::short-code-label-selector-catalog
  - id: metadata/binary/section/name::fwimage-section
