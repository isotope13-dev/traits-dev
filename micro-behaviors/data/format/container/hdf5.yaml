# HDF5 is a neutral container capability.  The external-storage operation is
# useful to data-processing software, but becomes attack-relevant when a worker
# opens an attacker-controlled container and resolves its local path.
defaults:
  platforms: [unix, windows]
  for: [scripts, data]

traits:
  - id: mat-v73-constant
    desc: References MAT version 7.3 constant
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bMAT_FT_MAT73\b'

  - id: matlab-v73-label
    desc: References MATLAB 7.3 format label
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bMATLAB\s+7\.3\b'

  - id: hdf5-library-reference
    desc: References HDF5 or an HDF5 binding
    crit: notable
    conf: 0.86
    # The H5* branch must look like a real HDF5 C API symbol (interface letter
    # then a lowercase verb: H5Fopen, H5Dread, H5Pset_external). A bare
    # `H5[A-Z]\w*` also matches base64 runs — the standard 1x1 transparent GIF
    # payload contains `...yH5BAEAAAAALA...`, which is not an HDF5 reference.
    if:
      type: text
      regex: '\b(HDF5|h5py|H5[ADEFGILOPRSTZ][a-z]{3,}[A-Za-z0-9_]*)\b'

  # Must look like a FILENAME ending in .h5/.hdf5, not a member access. The old
  # case-insensitive `\.(h5|hdf5)\b` matched `$.H5` — parse5's constant for the
  # HTML <h5> heading tag — and any other `.h5`-suffixed property. Require a
  # filename character before the dot, keep the extension lowercase (the
  # on-disk convention), and require a non-identifier byte after it.
  - id: hdf5-file-reference
    desc: References an HDF5 container file
    crit: notable
    conf: 0.86
    if:
      type: text
      # Require a filename boundary before the basename. This excludes dotted
      # HTML-tag lexicons such as `.h4.h5.h6` in syntax highlighters.
      regex: '(^|[\\/''"=:\s])[\w.-]{1,80}\.(h5|hdf5)([^A-Za-z0-9_]|$)'
    unless:
      - id: metadata/binary/installer/script::install4j-unix-sfx
      - id: metadata/file/metrics::high-byte-script-text
      # Generated MathJax tables can contain incidental H5-like text.
      - id: well-known/lib/ai/mathjax::mathjax-api-access

  - id: hdf5-external-writer-call
    desc: HDF5 external storage writer call
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(H5Pset_external|set_external)\b'

  - id: hdf5-external-reader-call
    desc: HDF5 external storage reader call
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(get_external_count|get_external)\b'

  # HDF5 names this feature the "External File List" (EFL) and exposes it in
  # code with external_raw_* identifiers. Generic external_storage/path names
  # are used by unrelated persistence layers, so require the HDF5-specific raw
  # qualifier or the formal EFL product name.
  - id: hdf5-external-path-marker
    desc: HDF5 external file list or raw-storage marker
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bexternal_raw_(path|storage|file)\b|\bExternal File List\b'

  # The on-disk HDF5 signature (\x89HDF\r\n\x1a\n). At offset 0 this is just a
  # normal HDF5 container.
  - id: hdf5-superblock-at-start
    desc: HDF5 superblock at file start
    crit: baseline
    conf: 1.0
    for: [data, media]
    if:
      type: hex
      pattern: "89 48 44 46 0D 0A 1A 0A"
      offset: 0

  # HDF5 permits a "userblock" of 512/1024/2048... bytes before the superblock,
  # and its contents are entirely attacker-chosen. That is the mechanism that
  # lets one file carry a foreign identity up front and still open as HDF5 —
  # the superblock found past offset 0 is the tell.
  - id: hdf5-superblock-behind-userblock
    desc: HDF5 superblock behind a userblock
    crit: notable
    conf: 0.95
    for: [data, media]
    if:
      type: hex
      pattern: "89 48 44 46 0D 0A 1A 0A"
      offset_range: [512, null]

composite_rules:
  - id: hdf5-external-api-call
    desc: Calls an HDF5 external storage API
    crit: notable
    conf: 0.95
    any:
      - id: hdf5-external-writer-call
      - id: hdf5-external-reader-call

  - id: hdf5-external-storage-call
    desc: HDF5 external storage API
    crit: notable
    conf: 0.95
    any:
      - id: hdf5-external-writer-call
      - id: hdf5-external-reader-call
      - id: hdf5-external-path-marker
