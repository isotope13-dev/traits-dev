defaults:
  platforms: [unix, windows]
  for: [source, scripts]
  crit: notable
  conf: 0.98

traits:
  - id: jpeg-xl-brotli-metadata-box
    desc: References JPEG XL compressed metadata box
    if:
      type: literal
      exact: brob

  - id: jpeg-xl-codestream-box
    desc: References JPEG XL complete codestream box
    if:
      type: literal
      exact: jxlc

composite_rules:
  - id: jpeg-xl-brotli-box-set
    desc: JPEG XL codestream and Brotli metadata boxes
    all:
      - id: jpeg-xl-brotli-metadata-box
      - id: jpeg-xl-codestream-box
    near_bytes: 2048
