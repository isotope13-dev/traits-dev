# ISO Base Media File Format box identifiers used as parsed source literals.
# A single 4CC only identifies ordinary container-handling code; objectives
# combine the specific box sets with write operations before inferring abuse.
defaults:
  platforms: [linux, macos, windows]
  for: [source, scripts]
  crit: notable
  conf: 0.98

traits:
  - id: uncompressed-configuration-box
    desc: References uncompressed image configuration box
    if:
      type: literal
      exact: uncC

  - id: image-spatial-extents-box
    desc: References an image spatial extents box
    if:
      type: literal
      exact: ispe

  - id: media-data-box
    desc: References an ISO media data box
    if:
      type: literal
      exact: mdat

  - id: item-location-before-media-tag
    desc: Item-location tag precedes media-box tag
    if:
      type: text
      regex: '(?s)["'']iloc["''].{0,512}["''](mdat|ispe)["'']'

  - id: media-tag-before-item-location
    desc: Media-box tag precedes item-location tag
    if:
      type: text
      regex: '(?s)["''](mdat|ispe)["''].{0,512}["'']iloc["'']'

composite_rules:
  # Pandas also uses "iloc". Require nearby media-box vocabulary before
  # interpreting that literal as an ISO Base Media item-location tag.
  - id: item-location-box
    desc: ISO item-location tag beside media box
    any:
      - id: item-location-before-media-tag
      - id: media-tag-before-item-location

  - id: uncompressed-image-box-set
    desc: Source handles uncompressed ISO media image boxes
    all:
      - id: uncompressed-configuration-box
      - id: image-spatial-extents-box
      - id: media-data-box
    near_bytes: 1024

  - id: item-payload-box-set
    desc: Source handles ISO media item payload boxes
    all:
      - id: item-location-box
      - id: media-data-box
    near_bytes: 1024
