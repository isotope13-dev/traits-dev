defaults:
  platforms: [windows, unix]
  # Compiled credential tooling carries the same output templates as source.
  # Include native and managed PE artifacts so those format capabilities are
  # not lost at compilation time.
  for: [scripts, source, pe, dll]
  crit: notable
  conf: 0.96

# These prefixes identify interoperable credential-artifact formats. Security
# tools, parsers, reports, and crackers all handle them, so the format alone is
# not a credential-cracking objective.
traits:
  - id: kerberos-tgs-hash-format
    desc: Kerberos TGS hash artifact format
    if:
      type: text
      substr: '$krb5tgs$'

  - id: kerberos-asrep-hash-format
    desc: Kerberos AS-REP hash artifact format
    if:
      type: text
      substr: '$krb5asrep$'

composite_rules:
  - id: kerberos-roastable-hash-format
    desc: Roastable Kerberos hash artifact format
    any:
      - id: kerberos-tgs-hash-format
      - id: kerberos-asrep-hash-format
