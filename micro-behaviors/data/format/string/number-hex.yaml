defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  - id: js-number-to-hex-string
    desc: Calls toString with hexadecimal radix
    if:
      type: symbol
      kind: call
      regex: '\.toString$'
      arg:
        index: 0
        kind: number
        value: 16
