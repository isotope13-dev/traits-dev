defaults:
  platforms:
    - unix
  for: [c, cpp]
traits:
  - id: pipe-delimited-five-string-format
    desc: Pipe-delimited five-string format
    crit: notable
    conf: 0.85
    platforms: [unix, windows]
    for: [c, cpp, source, scripts]
    if:
      type: text
      substr: '%s|%s|%s|%s|%s'

  - id: sprintf-format
    desc: String formatting with format specifiers
    crit: baseline
    conf: 0.75
    if:
      type: text
      word: sprintf
  - id: snprintf-format
    desc: snprintf formatting function
    crit: baseline
    conf: 0.75
    if:
      type: text
      word: snprintf
  - id: wsprintfa-format
    desc: wsprintfA user32 string formatting import
    crit: baseline
    conf: 0.75
    platforms: [windows]
    for: [pe, dll]
    if:
      type: symbol
      exact: wsprintfA
  - id: native-email-record-label
    desc: Native email record label
    crit: notable
    conf: 0.88
    platforms: [openwrt]
    for: [c, cpp, objc, rust, elf]
    if:
      type: text
      regex: 'email:%s|email_count'
  - id: native-account-record-label
    desc: Native account record label
    crit: notable
    conf: 0.88
    platforms: [openwrt]
    for: [c, cpp, objc, rust, elf]
    if:
      type: text
      substr: 'account:%s'
  - id: php-array-non-ascii-display-value
    desc: PHP array maps to non-ASCII display text
    crit: baseline
    conf: 0.9
    for: [php]
    if:
      type: text
      regex: "=>\\s*['\"].{0,80}[^\\x00-\\x7F]"
  # A quoted 17 to 20 digit number: the scale of a Discord snowflake, but
  # also of a WhatsApp newsletter JID, an order ID, or any large account
  # key. The shape alone identifies no platform, so this stays a component
  # fragment for composites that supply the context -- it never convicts.
  - id: long-numeric-id-literal
    desc: Quoted 17 to 20 digit numeric ID
    crit: component
    conf: 0.88
    platforms: [unix, windows]
    for: [javascript, typescript]
    if:
      type: text
      regex: '[''"][0-9]{17,20}[''"]'
