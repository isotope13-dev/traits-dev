defaults:
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.97

traits:
  - id: oversized-axmodel-shard-format-literal
    desc: Model shard uses oversized printf width
    for: [scripts, source]
    if:
      type: literal
      kind: string
      exclude_docstrings: true
      regex: '(^|[^%])%[-0]*[1-9][0-9]{3,}[diu][^%\r\n]{0,96}\.axmodel$'

  - id: oversized-model-layer-template-setting
    desc: Model template declares oversized printf width
    for: [json]
    if:
      type: value
      path: template_filename_axmodel
      regex: '(^|[^%])%[-0]*[1-9][0-9]{3,}[diu]'
