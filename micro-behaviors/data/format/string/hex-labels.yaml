defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
traits:
  # Raw bytes preserve printf's %08x tokens; decoded text can interpret %08
  # as a URL escape. Whole-file scope also covers unparseable PE sections.
  - id: numbered-single-hex-label-template
    desc: Numbered hex label with counter and suffix
    if:
      type: raw
      substr: '%s1%08x%08x.%x%x.%s'
      offset_range: [0, null]
  - id: numbered-four-hex-label-template
    desc: Four hex labels with counter and suffix
    if:
      type: raw
      substr: '%s4%08x%08x%08x%08x%08x.%08x%08x%08x%08x%08x%08x%08x.'
      offset_range: [0, null]
