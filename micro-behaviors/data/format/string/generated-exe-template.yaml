# Printf name of a generated executable. The same literal is the sprintf
# destination used when a carrier writes a mutated copy of its own image
# (`rifaien2-%s.exe`). Packed builds keep `2-%s.exe` as one literal even when
# compression splits the family prefix.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: numbered-executable-printf-template
    desc: Printf template for numbered executable name
    if:
      type: text
      substr: '2-%s.exe'
