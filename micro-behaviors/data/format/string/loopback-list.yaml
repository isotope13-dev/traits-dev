defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: javascript-loopback-host-list
    desc: Joins host list behind loopback address
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((binary_expression
          left: (string (string_fragment) @address)
          operator: "+"
          right: (call_expression
            function: [
              (subscript_expression index: (string (string_fragment) @method))
              (member_expression property: (property_identifier) @method)])) @match
        (#match? @address "^(127\\.0\\.0\\.1|::1) ")
        (#eq? @method "join"))
