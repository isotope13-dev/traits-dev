defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # Resolve the prefix's ldstr token. API names remain file-scoped references;
  # the CIL couples the prefix/local concatenation to a virtual call.
  - id: managed-loopback-line-call-layout
    desc: CLR loopback-prefix line-call layout
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        import "pe"
        rule managed_loopback_line_call_layout {
          strings:
            $root = "BSJB"
            $us = "#US\x00"
            $prefix = { 15 31 00 32 00 37 00 2E 00 30 00 2E 00 30 00 2E 00 31 00 20 00 (00|01) }
            $writer = "WriteLine\x00"
            $concat = "Concat\x00"
            $line = { 72 ?? ?? ?? 70 (06|07|08|09|11 ??)
                      28 ?? ?? ?? 0A 6F ?? ?? ?? 0A }
          condition:
            pe.data_directories[14].virtual_address != 0 and
            all of them and
            for any r in (1..#root) : (
              @root[r] == pe.rva_to_offset(uint32(pe.rva_to_offset(pe.data_directories[14].virtual_address)+8)) and
              for any u in (1..#us) : (
                @us[u] > @root[r] and @us[u] < @root[r]+256 and
                for any l in (1..#line) : (
                  for any p in (1..#prefix) : (
                    @prefix[p] == @root[r]+uint32(@us[u]-8)+(uint32(@line[l]+1)&0x00ffffff)
                  ) and
                  for any s in pe.sections : (
                    s.name == ".text" and
                    @line[l] >= s.raw_data_offset and
                    @line[l]+!line[l] <= s.raw_data_offset+s.raw_data_size and
                    $writer in (s.raw_data_offset .. s.raw_data_offset+s.raw_data_size-1) and
                    $concat in (s.raw_data_offset .. s.raw_data_offset+s.raw_data_size-1)
                  )
                )
              )
            )
        }
