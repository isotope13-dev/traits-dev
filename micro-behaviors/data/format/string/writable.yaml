defaults:
  crit: notable
  platforms: [windows, unix]
  for: [pe, elf]

traits:
- id: multi-format-writable
  desc: Writable data has %n and format specifiers
  crit: notable
  conf: 0.7
  count_min: 1
  if:
    type: text
    section: .data
    regex: '%[0-9*]*n.{0,20}%[0-9*]*[sdxpnuifgec].{0,20}%[0-9*]*[sdxpnuifgec]'
  not:
  - regex: '%[l-n]%[m-o]%[n-p]%[o-q]'
  - regex: '%[j-n]%[l-p]%[n-r]%[p-t]'
  unless:
  # Compiler IR embedded as text: LLVM's `%`-prefixed virtual registers
  # (`%n`, `%n.heap`, `%next`) fill a compiler's .data and read as stacked
  # format specifiers, but no printf surface is behind them.
  - id: metadata/lang/compiled::llvm-ir-text
- id: format-n-writable
  desc: Repeated %n markers in writable data
  crit: notable
  conf: 0.95
  count_min: 3
  if:
    type: text
    section: .data
    regex: '%[0-9$]*n'
  unless:
  # Same embedded-IR coincidence as multi-format-writable above.
  - id: metadata/lang/compiled::llvm-ir-text
  # Radamsa's mutation tables contain writable-looking %n runs.
  - id: well-known/tool/development/testing/radamsa::radamsa-fuzzer-banner
- id: format-width-writable
  desc: Repeated large format widths in writable data
  crit: notable
  conf: 0.75
  count_min: 2
  if:
    type: text
    section: .data
    regex: '%[0-9]{5,}[sdxpn]'
