traits:
- id: go-file-command-templates--basic
  desc: Go command basic file command template
  crit: notable
  conf: 0.88
  if:
    type: string_literal
    kind: string
    regex: ^(ls|cat|rm) --dst %s$
- id: go-file-command-templates--directory-or-copy
  desc: Go command directory or copy template
  crit: notable
  conf: 0.88
  if:
    type: string_literal
    kind: string
    regex: ^(mkdir|cd) --dst %s$|^(cp|mv) --src %s --dst %s$
- id: go-process-command-templates--query
  desc: Go command process query template
  crit: notable
  conf: 0.87
  if:
    type: string_literal
    kind: string
    regex: ^%s --(pid %d|user %s|name %s|cmdline %s)$
- id: go-process-command-templates--terminate
  desc: Go command process termination template
  crit: notable
  conf: 0.87
  if:
    type: string_literal
    kind: string
    exact: kill %s
composite_rules:
- id: go-file-builder-symbols
  desc: Go command file command builders
  crit: component
  conf: 0.88
  any:
  - id: metadata/file/function::go-file-builder-symbols--read-or-copy
  - id: metadata/file/function::go-file-builder-symbols--write-or-directory
  - id: metadata/file/function::go-file-builder-symbols--working-directory
- id: go-file-command-templates
  desc: Go command file command templates
  crit: component
  conf: 0.88
  any:
  - id: micro-behaviors/data/format/string::go-file-command-templates--basic
  - id: micro-behaviors/data/format/string::go-file-command-templates--directory-or-copy
  - id: metadata/lang/source/naming/action::go-file-command-templates--working-directory
- id: go-process-command-templates
  desc: Go command process command templates
  crit: component
  conf: 0.87
  any:
  - id: metadata/file/function::go-process-command-templates--listing
  - id: micro-behaviors/data/format/string::go-process-command-templates--query
  - id: micro-behaviors/data/format/string::go-process-command-templates--terminate
- id: go-agent-control-commands
  desc: Go command agent control commands
  crit: component
  conf: 0.9
  any:
  - id: metadata/lang/source/naming/action::go-agent-control-commands--network-helper
  - id: metadata/lang/source/naming/action::go-agent-control-commands--self-remove
- id: go-filesystem-command-roster
  desc: Go command filesystem template roster
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/data/format/string::go-file-builder-symbols
  - id: micro-behaviors/data/format/string::go-file-command-templates
- id: go-process-control-command-roster
  desc: Go command process template roster
  crit: notable
  conf: 0.92
  all:
  - id: metadata/file/function::go-process-builder-symbols
  - id: micro-behaviors/data/format/string::go-process-command-templates
- id: go-agent-control-command-roster
  desc: Go command agent control roster
  crit: notable
  conf: 0.93
  all:
  - id: metadata/file/function::go-agent-control-builders
  - id: micro-behaviors/data/format/string::go-agent-control-commands
- id: go-full-command-template-roster
  desc: Go command file/process/agent command templates
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/data/format/string::go-filesystem-command-roster
  - id: micro-behaviors/data/format/string::go-process-control-command-roster
  - id: micro-behaviors/data/format/string::go-agent-control-command-roster
defaults:
  for:
  - elf
  - macho
  - pe
  - go
  platforms:
  - windows
  - linux
  - macos
