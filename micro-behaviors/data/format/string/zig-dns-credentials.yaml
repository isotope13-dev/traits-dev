# Encoded bytes are only called DNS exfiltration here when the same source file
# reads a credential artifact, hex-encodes bytes, constructs a dotted label,
# and submits that label to a resolver. None of those capabilities alone is an
# objective.
defaults:
  platforms: [linux, macos, windows]
  for: [zig]
traits:
- id: zig-hex-label-format-reference
  desc: Hexadecimal alphabet and formatted labels
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: '(?is)hex_chars.{0,500}bufPrint.{0,180}\{s\}\.\{s\}'
