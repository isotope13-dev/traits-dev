defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: start-ddos-command-token
    desc: DDoS worker start command token
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: StartDDos
      section: .text
  - id: stop-ddos-command-token
    desc: DDoS worker stop command token
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: StopDDos
      section: .text
