defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.98

traits:
  - id: shell-substitution-format-template
    desc: String template wraps a shell substitution
    if:
      type: literal
      exclude_docstrings: true
      # Some source extractors retain the opening Python f/r-string prefix.
      regex: '^([frFR]{1,2}["''])?\$\((%[0-9$]*s|[$#]?\{[^{}\r\n]{0,48}\})\)$'
