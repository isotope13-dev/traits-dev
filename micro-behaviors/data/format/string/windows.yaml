defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  crit: notable
  conf: 0.9

traits:
  - id: uuid-from-string-api
    desc: Convert UUID text via Windows RPC API
    if:
      type: import
      regex: '^UuidFromString[AW]$'

  # UuidFromStringA writes 16 bytes; loaders that turn a UUID string table into
  # a contiguous shellcode buffer advance the destination by 0x10 and loop.
  # Compilers do not emit this exact post-call stride for ordinary GUID use.
  - id: uuid-decode-16byte-advance-loop-x64
    desc: UuidFromString decode loop with 16-byte step
    crit: suspicious
    conf: 0.96
    for: [pe, dll]
    arch: [x86-64]
    size_max: 10485760
    if:
      type: hex
      section: .text
      # call [rip+rel]; add rdi, 0x10; inc rbx; cmp rbx, imm; jne
      pattern: 'FF 15 ?? ?? ?? ?? 48 83 C7 10 48 FF C3 48 81 FB ?? ?? ?? ?? 75 ??'

  # Shellcode-as-UUIDs stores thousands of hyphenated GUID strings. A handful
  # of COM/RPC GUIDs is normal; a dense table is a payload carrier.
  - id: dense-uuid-hyphen-string-table
    desc: Dense hyphenated UUID string table
    crit: suspicious
    conf: 0.94
    for: [pe, dll]
    size_min: 65536
    size_max: 20971520
    count_min: 512
    # Large Microsoft SQL/DacFx support DLLs carry many schema GUIDs that are
    # not a UUID-shellcode payload table.
    unless:
      - id: well-known/lib/data/microsoft-data-tools/
      - id: well-known/app/enterprise/microsoft-office-c2r::microsoft-office-integrator-content-context
    if:
      type: text
      regex: '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}'
      section: ".rdata"
