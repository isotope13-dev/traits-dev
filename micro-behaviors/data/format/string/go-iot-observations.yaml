defaults:
  platforms: [unix, windows]
  for: [go]

traits:
  - id: go-sprintf-zero-padded-hex
    desc: Go Sprintf zero-padded hexadecimal format
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: fmt.Sprintf
      arg:
        kind: string
        regex: '^%0\d+[Xx]$'
