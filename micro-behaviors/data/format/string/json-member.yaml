# printf-style JSON member construction. The prefix conversion commonly
# supplies an optional comma; the other conversions supply key and value.
# These short printf-only runs are omitted from extracted text facts.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.95

traits:
  - id: json-string-member-format
    desc: printf-style JSON string member format
    if:
      type: hex
      section: rodata
      pattern: "25 73 22 25 73 22 3A 22 25 73 22"
