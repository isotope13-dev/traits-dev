# BitTorrent metainfo is a neutral file/protocol format.  Intent is inferred by
# objectives that combine tracker + web-seed metadata with staged data or a
# known collection path; these atoms deliberately do not key on actor names.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, data]

traits:
  - id: bittorrent-announce-key
    desc: Bencoded BitTorrent announce key
    crit: notable
    conf: 0.94
    for: [data]
    if:
      type: text
      substr: "8:announce"

  - id: bittorrent-web-seed-key
    desc: BitTorrent web-seed metainfo key
    # Bare url-list/httpseeds strings appear in ordinary web UIs; composites
    # that also see announce + info/files supply the torrent intent.
    crit: component
    conf: 0.97
    if:
      type: literal
      kind: string
      regex: '^(url-list|httpseeds?)$'

  - id: javascript-bittorrent-announce-key
    desc: JavaScript announce object field
    crit: component
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        (pair
          key: (property_identifier) @key
          (#eq? @key "announce"))

  - id: javascript-bittorrent-web-seed-key
    desc: JavaScript BitTorrent web-seed object field
    crit: component
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((pair
          key: (string (string_fragment) @key))
         (#match? @key "^(url-list|httpseeds?)$"))

  - id: javascript-bittorrent-info-files-key
    # `info` and `files` are common application object fields. They are only
    # BitTorrent evidence when paired with tracker and web-seed atoms in the
    # composite below.
    desc: Generic JavaScript info/files object field
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)\b(torrent|metainfo|bencode|announce).{0,120}\b(info|files)\s*:'

  - id: bittorrent-announce-endpoint
    desc: BitTorrent tracker announce endpoint
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(https?|udp)://[^\s"''<>]{1,200}/announce\b'

  - id: bittorrent-metainfo-output
    desc: BitTorrent metainfo file output path
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '(?i)(^|[\\/])[^\\/\r\n"'']{1,160}\.torrent$'

  - id: bittorrent-bencode-encoder
    desc: Bencode metainfo encoder call
    crit: notable
    conf: 0.95
    for: [javascript, typescript, python, rust, java, go]
    if:
      type: symbol
      kind: member
      regex: '^(bencode|bencodepy)\.encode$'

  - id: bittorrent-cli-create
    desc: Invokes a BitTorrent metainfo creator
    crit: notable
    conf: 0.95
    for: [shell, powershell]
    if:
      type: text
      regex: '(?m)^\s*(transmission-create|mktorrent|ctorrent)\b'

  - id: bittorrent-cli-tracker-option
    desc: BitTorrent creator receives a tracker option
    crit: notable
    conf: 0.92
    for: [shell, powershell]
    if:
      type: text
      regex: '(?i)\b(transmission-create|mktorrent|ctorrent)\b[^\r\n]{0,120}\s(-t|--tracker)\b'

  - id: bittorrent-cli-web-seed-option
    desc: BitTorrent creator receives a web-seed option
    crit: notable
    conf: 0.96
    for: [shell, powershell]
    if:
      type: text
      regex: '(?is)\b(transmission-create|mktorrent|ctorrent)\b.{0,120}\s(-w|--web[-_]?seed)\b'

  - id: bittorrent-cli-metainfo-output
    desc: CLI torrent creator writes metainfo output
    crit: notable
    conf: 0.94
    for: [shell, powershell]
    if:
      type: text
      regex: '(?is)\b(transmission-create|mktorrent|ctorrent)\b.{0,160}\.torrent\b'

  - id: bittorrent-cli-archive-payload-reference
    desc: CLI torrent creator receives archive payload
    crit: notable
    conf: 0.94
    for: [shell, powershell]
    if:
      type: text
      regex: '(?is)\b(transmission-create|mktorrent|ctorrent)\b.{0,180}\.(tar\.gz|tgz|zip|7z|rar)\b'

  - id: bittorrent-archive-payload-reference
    desc: Archive filename suffix
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?is)\b(torrent|metainfo|bencode|announce|web[-_]seed).{0,120}\.(tar\.gz|tgz|zip|7z|rar)'

composite_rules:
  - id: javascript-bittorrent-metainfo-field-set
    desc: JavaScript BitTorrent metainfo contains tracker and multi-file fields
    crit: notable
    conf: 0.97
    all:
      - id: javascript-bittorrent-announce-key
      - id: javascript-bittorrent-web-seed-key
      - id: javascript-bittorrent-info-files-key
