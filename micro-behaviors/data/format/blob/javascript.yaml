defaults:
  platforms: [unix, windows, ios]
  for: [javascript, typescript, html]

traits:
  - id: browser-javascript-blob
    desc: Creates JavaScript Blob from variable source
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'new\s+Blob\s*\(\s*\[\s*[A-Za-z_$][\w$]*\s*\][^)]{0,80}text/javascript'
