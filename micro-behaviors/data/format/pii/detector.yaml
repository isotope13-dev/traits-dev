# Regex sources that recognise personal and financial identifiers, as found in
# DLP / PII-redaction detector tables (IBAN, US Social Security number). Each
# atom matches the pattern text itself, not data that happens to look like an
# identifier. A table that recognises national IDs and bank accounts is a
# data-classification catalog; see the downgrade on
# objectives/impact/crypto-manipulation/hijack-transfer::multi-chain-address-matcher-table.
defaults:
  crit: notable
  conf: 0.88
  platforms: [windows, unix]
  for: [javascript, typescript, python, go, java, ruby, php]

traits:
  - id: iban-regex
    desc: Regex recognizes IBAN account numbers
    if:
      type: text
      substr: '[A-Z]{2}\d{2}'

  - id: us-ssn-regex
    desc: Regex recognizes US Social Security numbers
    if:
      type: text
      regex: '\\d\{3\}(-|\[[- .]{1,3}\]\??)\\d\{2\}(-|\[[- .]{1,3}\]\??)\\d\{4\}'

composite_rules:
  - id: pii-identifier-regex-catalog
    desc: Regexes recognize bank-account and national IDs
    all:
      - id: iban-regex
      - id: us-ssn-regex
