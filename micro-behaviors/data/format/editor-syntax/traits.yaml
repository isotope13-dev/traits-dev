# Editor syntax and filetype definition tables. A file that *names* formats --
# a Vim filetype table listing `dosini` and `pip.conf`, a Sublime `.sublime-syntax`
# bundle -- is cataloguing them, not opening them. Referenced from `unless:` by
# path traits whose literals such a table inevitably contains.
defaults:
  platforms: [unix, windows]
  # Filetype tables ship as editor config/data, not as compiled binaries.
  for: [data, text, json]

traits:
  - id: editor-filetype-dosini-marker
    desc: Vim dosini filetype identifier
    crit: baseline
    conf: 1.0
    if:
      type: text
      exact: dosini
  - id: editor-filetype-pipconf-marker
    desc: Vim filetype-table pip.conf entry
    crit: baseline
    conf: 1.0
    if:
      type: text
      exact: pip.conf
  # Consistent with pypirc-credentials (notable): a .npmrc path reference is a
  # credential-file capability, not standalone-suspicious (editors/JS tooling like
  # nvim reference it). Theft intent comes from composites.
  - id: syntax-bundle-context
    desc: Embedded syntax bundle/resource context
    crit: notable
    conf: 1.0
    if:
      type: text
      substr: sublime-syntax

composite_rules:
  - id: editor-filetype-detect-context
    desc: Editor filetype table context
    crit: baseline
    conf: 1.0
    all:
      - id: editor-filetype-dosini-marker
      - id: editor-filetype-pipconf-marker
