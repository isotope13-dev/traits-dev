# Stdlib zipfile-based Office OOXML text extraction (no python-docx/pptx).
# Stealers that avoid third-party deps pull cell/paragraph text from the
# package ZIP members directly.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.92

traits:
  - id: python-xlsx-shared-strings-member
    desc: Reads Excel sharedStrings.xml from ZIP
    if:
      type: literal
      kind: string
      regex: '(?i)sharedStrings\.xml$'

  - id: python-docx-document-xml-member
    desc: Reads Word document.xml from ZIP
    if:
      type: literal
      kind: string
      regex: '(?i)(^|/)word/document\.xml$'

  - id: python-pptx-slide-xml-member
    desc: Reads PowerPoint slide XML from ZIP
    if:
      type: literal
      kind: string
      regex: '(?i)ppt/slides/slide'
