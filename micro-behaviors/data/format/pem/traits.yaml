defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: baseline
  conf: 0.8

traits:
  - id: begin-boundary
    desc: References generic PEM begin boundary
    if:
      type: text
      substr: '-----BEGIN'

  - id: end-boundary
    desc: References generic PEM end boundary
    if:
      type: text
      substr: '-----END'
