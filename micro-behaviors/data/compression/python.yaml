# Python LZMA stream opener; the call alone does not establish read or write mode.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
traits:
  - id: lzma-open-stream
    desc: Opens a Python LZMA-compressed stream
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: lzma.open
