defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
composite_rules:
  - id: gzip-with-cipher-context
    desc: Node gzip or gunzip alongside cipher or decipher initialization
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/data/decompress/gzip::node-gzip-functions
    any:
      - id: micro-behaviors/crypto/encrypt/unspecified::createCipheriv
      - id: micro-behaviors/crypto/decrypt/initialize::createDecipheriv
      - id: micro-behaviors/crypto/decrypt/initialize::create-decipher-call
