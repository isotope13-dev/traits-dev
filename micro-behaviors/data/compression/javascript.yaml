defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: javascript-base64-inflate-call
    desc: Calls a Base64 inflation helper
    conf: 0.9
    if:
      # The symbol projection drops the callee of bundler-generated
      # (0, codec.inflateBase64)(data) calls. Keep the invocation relation
      # explicit rather than matching a member reference or string mention.
      type: tree-sitter
      query: |
        ((call_expression
          function: [
            (identifier) @helper
            (member_expression property: (property_identifier) @helper)
            (parenthesized_expression
              (sequence_expression
                (number)
                (member_expression property: (property_identifier) @helper)))
          ]) @call
          (#eq? @helper "inflateBase64"))
