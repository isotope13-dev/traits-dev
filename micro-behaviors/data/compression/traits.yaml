---
defaults:
  crit: component
  conf: 0.9
  platforms:
  - linux
  - macos
  - windows
traits:
- id: decompression-output-text-decode
  desc: Decompressed bytes decoded to text
  crit: notable
  conf: 0.9
  for: [scripts]
  if:
    type: text
    regex: decompress\s*\(.{0,160}\)\s*\.decode\b
- id: php-base64-wrapped-decompression
  desc: PHP decompresses base64-decoded data
  crit: notable
  conf: 0.95
  platforms: [windows, unix]
  for: [php]
  if:
    type: text
    regex: "(gzinflate|gzuncompress|gzdecode)\\s*\\(\\s*@?\\s*base64_decode\\s*\\("
