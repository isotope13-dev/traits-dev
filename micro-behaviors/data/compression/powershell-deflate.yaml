defaults:
  platforms: [windows]
  for: [data, powershell, batch, html]
  crit: notable
  conf: 0.88

traits:
  # DeflateStream supports both compression and decompression. Its name alone
  # cannot establish the direction; operation composites require a mode.
  - id: powershell-deflatestream-reference
    desc: PowerShell DeflateStream reference
    if:
      type: text
      substr: DeflateStream
      case_insensitive: true
