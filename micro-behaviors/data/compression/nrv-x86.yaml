defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-nrv-bitstream-decompressor
    desc: x86 NRV bitstream literal and match decoder
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: any
      # NRV's literal copy and carry-bit refill/offset-building loop.
      # The absolute source address, destination delta and branches vary.
      pattern: '60 BE ?? ?? ?? ?? 8D BE ?? ?? ?? ?? 57 EB ?? [0-4] 8A 06 46 88 07 47 01 DB 75 ?? 8B 1E 83 EE FC 11 DB 72 ?? B8 01 00 00 00 01 DB 75 ?? 8B 1E 83 EE FC 11 DB 11 C0 01 DB'
