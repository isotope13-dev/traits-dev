defaults:
  platforms: [unix, windows]
  for: [scripts]

composite_rules:
  - id: http-response-compression-execution-cooccurrence
    desc: HTTP response, compression and execution co-occur
    crit: notable
    conf: 0.995
    # Proximity does not bind the HTTP response to the decoded/executed bytes.
    size_max: 512000
    all:
    - id: micro-behaviors/communications/http/client/response-body::remote-response-body-read
    - id: micro-behaviors/data/compression::base64-decode-plus-decompression
    any:
    - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
    - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
    - id: micro-behaviors/process/create/subprocess/launch::process-execution
    - id: micro-behaviors/process/create/shell/command-mode::python-os-system
    - id: micro-behaviors/process/create/exec::system-process-call
    - id: micro-behaviors/process/create/exec::js-child-process
    near_lines: 20
