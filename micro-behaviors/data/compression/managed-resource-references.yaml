defaults:
  platforms: [windows]
  for: [pe]

# Compression and crypto coexist; their inputs are not bound to Assembly.Load.
composite_rules:
- id: managed-resource-resolver-with-compression-and-crypto-references
  desc: Resource, resolver, GZip and TripleDES API references
  crit: notable
  conf: 0.99
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: metadata/binary/layout/embedded::pe-embedded
  - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
  - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
  - id: micro-behaviors/crypto/symmetric/3des::triple-des-transform-codec-api-references
  - id: micro-behaviors/data/codec::dotnet-gzip-compression
  - id: micro-behaviors/metaprogramming/reflection::activator
  unless:
  - id: well-known/lib/data/oracle-managed-data-access::oracle-managed-data-access-library
  - id: well-known/app/development/cratis-stage::cratis-stage-assembly
  - id: well-known/tool/reverse-engineering/corvus::corvus-reverse-engineering-tool
  - id: well-known/lib/runtime/managed/dotnet-runtime::framework-reference-assembly-context
