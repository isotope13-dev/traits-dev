defaults:
  platforms: [windows, unix]
  for: [class]
  crit: notable
traits:
  - id: jvm-long-state-xor-byte-transform
    desc: JVM long-state XOR byte transform
    conf: 0.96
    if:
      type: hex
      # ldc2_w multiplier; lmul; ldc2_w increment; ladd; bounded state
      # storage; shift; lushr/l2i; bounded byte-array access; mask/XOR/store.
      # Pool indices, seed, multiplier, increment and shift remain variable.
      pattern: '14 ?? ?? 69 14 ?? ?? 61 [0-80] 10 ?? 7D 88 [0-40] 11 00 FF 7E 82 91 54'
