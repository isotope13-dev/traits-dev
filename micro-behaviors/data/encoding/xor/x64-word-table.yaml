# The same table routine locks and unlocks strings; direction is not proven.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
traits:
  - id: x64-eight-word-four-lane-xor-loop
    desc: Eight-word four-lane table XOR loop
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: >-
        48 89 D0 48 03 06 44 30 10 48 89 D0 48 03 06 44 30 08
        48 89 D0 48 03 06 44 30 00 48 89 D0 48 03 06 40 30 38
        8D 42 01 48 FF C2 0F B7 4E 08 39 C8 7C ??
        49 FF C3 49 83 FB 08 75 ??
