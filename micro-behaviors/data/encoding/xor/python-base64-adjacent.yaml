defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: python-base64-adjacent-xor
  desc: Base64 decoder near indexed XOR bytes
  conf: 0.9
  size_max: 15000
  if:
    type: text
    regex: b64decode[\s\S]{0,120}\^\s*\w{1,20}\[\w{1,3}\s*%
  unless:
  - id: micro-behaviors/metaprogramming/generation::python-execution-template-generator
