# Symmetric transform: callers determine whether this encodes or decodes.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: cil-repeating-key-byte-array-xor-loop
    desc: CIL byte array XOR with repeating key
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # dst[i] = src[i] XOR key[i % key.Length]; advance i and loop
      # until src.Length. Argument and local slots are compiler encodings,
      # not sample-specific addresses or names.
      pattern: '06 07 02 07 91 03 07 03 8E 69 5D 91 61 D2 9C 07 17 58 0B 07 02 8E 69 32 ??'
