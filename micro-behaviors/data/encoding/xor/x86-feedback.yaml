defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-lodsb-feedback-xor-loop
    desc: x86 byte XOR with LODSB feedback
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: any
      # Increment AL, XOR a byte through ESI, load that byte back into AL,
      # then repeat while its sign bit is clear. Accept direct and SIB forms
      # of [ESI]; the backward branch must land on the increment instruction.
      pattern: '40 (30 06 AC 79 FA | 30 04 66 AC 79 F9)'
