defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
traits:
  - id: rust-iterator-xor-transform
    desc: Rust iterator maps values through XOR
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (field_expression field: (field_identifier) @method)
          arguments: (arguments
            (closure_expression
              parameters: (closure_parameters (identifier) @item)
              body: (binary_expression
                left: (identifier) @operand
                operator: "^"
                right: (_) )))) @transform
        (#eq? @method "map")
        (#eq? @item @operand))
