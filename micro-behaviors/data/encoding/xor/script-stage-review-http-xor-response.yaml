defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
  size_max: 2000000
traits:
  - id: xor-charcode-decoder-helper
    desc: XOR character-code operation
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |-
        ((binary_expression
          left: (call_expression function: (member_expression
            property: (property_identifier) @charcode))
          operator: "^")
          (#eq? @charcode "charCodeAt"))

