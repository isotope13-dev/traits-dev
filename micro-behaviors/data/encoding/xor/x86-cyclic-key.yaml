# The key is stored in the first 64 bytes of the record. Its body starts at
# +0x48; the cursor resets at 64 and the loop transforms each body byte in
# place. The same routine can decode a received record or restore its encoded
# representation, so this claims a keyed XOR transform, not a direction.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-inline-64-byte-key-xor-loop
    desc: x86 record-body XOR with inline 64-byte key
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: any
      pattern: '8A 14 30 8A 5C 31 48 32 DA 40 88 5C 31 48 41 83 F8 40 7C 02 33 C0 3B CF 7C ??'
