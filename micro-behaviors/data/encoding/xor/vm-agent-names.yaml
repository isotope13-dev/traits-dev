defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
traits:
  - id: xor-vboxtray-executable-name
    desc: XOR-encoded VirtualBox tray executable name
    if:
      type: encoded
      encoding: xor
      exact: VBoxTray.exe
  - id: xor-vmtoolsd-executable-name
    desc: XOR-encoded VMware tools executable name
    if:
      type: encoded
      encoding: xor
      exact: vmtoolsd.exe
  - id: xor-qemu-ga-executable-name
    desc: XOR-encoded QEMU guest-agent executable name
    if:
      type: encoded
      encoding: xor
      exact: qemu-ga.exe
  - id: xor-prl-tools-executable-name
    desc: XOR-encoded Parallels tools executable name
    if:
      type: encoded
      encoding: xor
      exact: prl_tools.exe
