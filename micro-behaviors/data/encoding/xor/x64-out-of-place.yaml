defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-out-of-place-byte-xor-loop
    desc: Bounded byte-XOR copy between buffers
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # load source[index], XOR key, store destination[index], compare bound
      pattern: '44 0F B6 04 11 41 30 C0 44 88 04 13 48 FF C2 48 39 D6 75 EC'
