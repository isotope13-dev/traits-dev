# Direction-neutral array XOR observations. Neither an indexed assignment nor
# nearby modulo indexing proves a cipher, a repeating key, or a decoder.
# Composite descriptions state co-occurrence where values are not bound.
defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-indexed-xor-assignment
    desc: PowerShell indexed input XOR assignment
    crit: notable
    conf: 0.92
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '\$\w+\[.{1,24}\]\s*=\s*\$\w+\[.{1,24}\]\s*-bxor\b'

  - id: powershell-indexed-xor-variable
    desc: PowerShell indexed input XOR variable operand
    crit: notable
    conf: 0.94
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '\$\w+\s*\[\s*\$\w+\s*\]\s*=\s*\$\w+\s*\[\s*\$\w+\s*\]\s*-bxor\s+\$\w+'

composite_rules:
  - id: powershell-byte-array-xor-references
    desc: Byte-array type near indexed XOR assignment
    crit: notable
    conf: 0.95
    near_lines: 20
    all:
      - id: micro-behaviors/data/buffer/alloc::powershell-byte-array-type
      - id: powershell-indexed-xor-variable

  - id: powershell-indexed-xor-selection-references
    desc: Indexed XOR with modulo or variable operand
    crit: notable
    conf: 0.98
    near_lines: 3
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    all:
      - id: powershell-indexed-xor-assignment
    any:
      - id: micro-behaviors/data/collection/array::powershell-modulo-indexed-selection
      - id: powershell-indexed-xor-variable
      - id: micro-behaviors/crypto/symmetric/xor/loop::indexed-bxor-byte-cast-rhs

  - id: powershell-xor-modulo-access-references
    desc: Modulo-indexed access near XOR assignment
    crit: notable
    conf: 0.95
    near_lines: 8
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    all:
      - id: micro-behaviors/data/collection/array::powershell-modulo-indexed-selection
    any:
      - id: powershell-indexed-xor-assignment
      - id: micro-behaviors/crypto/symmetric/xor/loop::repeating-key-xor-accumulation

  - id: powershell-modulo-xor-references
    desc: PowerShell modulo-indexed XOR expressions
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/crypto/symmetric/xor/loop::repeating-key-indexed-bxor-loop
      - id: micro-behaviors/crypto/symmetric/xor/loop::repeating-key-xor-via-key-variable
      - id: powershell-xor-modulo-access-references

