# The reversible byte transform alone does not establish intent or direction.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
  conf: 0.97
traits:
  - id: x64-rolling-key-byte-transform
    desc: x64 byte transform updates rolling key
    if:
      type: hex
      section: any
      pattern: '0F B6 06 [0-32] 48 81 C6 01 00 00 00 [0-32] 32 C3 [0-32] 34 ?? [0-32] 04 ?? [0-32] D0 C0 [0-16] F6 D0 [0-16] 32 D8'
