defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-signed-remainder-byte-xor-loop
    desc: Byte XOR with remainder-indexed key
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Signed remainder selects a key byte; two byte loads, XOR, output store.
      # Key length, key address and stack slots are deliberately unpinned.
      pattern: 'B9 ?? ?? ?? ?? 89 55 ?? 99 F7 F9 B8 ?? ?? ?? ?? 01 D0 8B 4D ?? 0F BE 09 0F BE 10 31 D1 8B 45 ?? 88 08 EB ??'
