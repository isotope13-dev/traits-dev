defaults:
  for: [pyc, data, pe]
  platforms: [windows]
  crit: notable
traits:
  - id: x64-countdown-byte-xor-add-feedback
    desc: x64 descending byte XOR with additive feedback
    conf: 0.99
    if:
      type: hex
      offset_range: [0, null]
      # XOR [RBX+RCX] with DIL; add resulting byte to DIL; LOOP backwards.
      # The seed, payload length, and file offset are not part of the match.
      pattern: '40 30 3C 0B 40 02 3C 0B E2 F6'
