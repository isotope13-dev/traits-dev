# Byte XOR, indexed output store, and feedback from a state-update helper.
# The transform is symmetric; its execution consumer establishes decoding.
defaults:
  platforms: [macos]
  for: [macho]
  arch: [x86-64]
  crit: notable
traits:
  - id: x64-helper-updated-state-byte-xor
    desc: Byte XOR with helper-updated state
    conf: 0.98
    if:
      type: hex
      # Universal carriers may expose section facts for only the ARM64 slice.
      # Keep the instruction signature within the x86-64 slice via arch, rather
      # than intersecting it with another slice's reported __text range.
      offset_range: [64, null]
      pattern: '0F BE 04 08 33 85 [4] 88 C1 8B 85 [4] 88 8C 05 [4] 8B BD [4] E8 [4] 89 85 [4]'
  - id: arm64-helper-updated-state-byte-xor
    desc: ARM64 byte XOR with helper-updated state
    arch: [aarch64]
    conf: 0.98
    if:
      type: hex
      # Universal Mach-O section facts may describe only the first slice.
      # The arch gate still confines this instruction sequence to ARM64.
      offset_range: [64, null]
      pattern: '08 69 E9 38 ?? ?? 40 B9 08 01 09 4A [8] ?? ?? 40 B9 28 69 2A 38 ?? ?? 40 B9 ?? ?? ?? 94 ?? ?? 00 B9'
