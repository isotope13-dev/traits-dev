defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
traits:
  # Compare the key cursor with its end; reset it using CMOVE; read a key
  # byte, XOR the destination, advance both cursors, and branch back.
  # Bounded gaps admit the published opaque predicates and their removal.
  - id: x64-resource-cyclic-xor-loop
    desc: x64 cyclic XOR loop in resource bytes
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .rsrc
      pattern: '4C 39 D1 49 0F 44 C9 [0-16] 48 0F B6 01 [0-16] 30 02 [0-16] 48 83 C2 01 48 83 C1 01 4C 39 C2 72 ??'
