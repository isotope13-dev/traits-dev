defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-cyclic-word-key-byte-xor-loop
    desc: x86 byte XOR with cyclic word-spaced key
    crit: notable
    conf: 0.98
    if:
      type: hex
      # Also inspect native code inside an embedded PE's containing section.
      section: any
      # Reset the key index, load a buffer byte and a word-spaced key byte,
      # XOR and store, then advance and loop. No key bytes are pinned.
      pattern: '66 83 F9 ?? 75 02 33 C9 8A 1C 38 8B D1 81 E2 FF FF 00 00 8A 54 54 ?? 32 DA 41 88 1C 38 40 3B C6 72 DE'
