# Symmetric transform: callers determine whether this encodes or decodes.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: cil-repeating-key-byte-array-xor-loop
    desc: CIL byte array XOR with repeating key
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # dst[i] = src[i] XOR key[i % key.Length]; advance i and loop
      # until src.Length. Argument and local slots are compiler encodings,
      # not sample-specific addresses or names.
      pattern: '06 07 02 07 91 03 07 03 8E 69 5D 91 61 D2 9C 07 17 58 0B 07 02 8E 69 32 ??'

  - id: cil-inplace-repeating-key-byte-xor-loop
    desc: CIL cyclic-key in-place byte XOR
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # ldelema Byte; dup; ldind.u1; key[i % key.Length]; xor;
      # conv.u1; stind.i1; increment and branch on buffer length.
      pattern: '06 08 8F ?? ?? ?? 01 25 47 07 08 07 8E 69 5D 91 61 D2 52 08 17 58 0C 08 06 8E 69 32 ??'

  - id: cil-remainder-indexed-key-byte-xor
    desc: CIL byte array XOR with remainder-indexed key
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # dst[i] = src[i] XOR key[i % keyLength]. The loop dispatch may
      # be flattened; require the full indexed read/XOR/store expression.
      pattern: '08 09 02 09 91 06 09 07 5D 91 61 D2 9C'

  - id: cil-inplace-cyclic-xor-stobj
    desc: CIL cyclic-key in-place byte XOR via stobj
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # ldelema Byte; dup; ldobj Byte; key[i % key.Length]; xor;
      # conv.u1; stobj Byte; increment and branch on buffer length.
      pattern: '(02 | 06) (07 | 08) 8F ?? ?? ?? 01 25 71 ?? ?? ?? 01 (06 | 07) (07 | 08) (06 | 07) 8E 69 5D 91 61 D2 81 ?? ?? ?? 01 (07 | 08) 17 58 (0B | 0C) (07 | 08) (02 | 06) 8E 69 32 ??'
