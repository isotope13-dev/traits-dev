defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: php-cyclic-xor-string-reconstruction
    desc: PHP appends cyclic-key XOR string data
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        (augmented_assignment_expression
          operator: ".="
          right: (binary_expression
            left: (subscript_expression)
            operator: "^"
            right: (subscript_expression
              (variable_name)
              (binary_expression operator: "%")))) @scramble
