defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  arch:
  - x86-64
  crit: notable
traits:
- id: x64-four-byte-key-xor-copy-loop
  desc: x64 four-byte-key XOR buffer copy
  conf: 0.99
  if:
    type: hex
    section: .text
    pattern: 48 89 C2 83 E2 03 8A 54 15 00 32 14 07 88 14 03 48 FF C0 EB ??
- id: x86-four-byte-key-xor-copy-loop
  desc: x86 four-byte-key XOR buffer copy
  conf: 0.99
  arch:
  - x86
  if:
    type: hex
    section: .text
    pattern: 83 E2 03 8A 14 11 8B 4D ?? 32 14 01 88 14 06 40 EB ??
# MSVC x64 form of `data[i] ^= key[i % n]` over two static tables: the
# remainder is rebuilt with imul-by-length and subtract, then the key byte
# and the data byte are both addressed off the image base (SIB + disp32) and
# the data byte is XORed in place with the same register.
- id: x64-modulo-key-table-xor-in-place
  desc: x64 key-table XOR of static data
  conf: 0.9
  if:
    type: hex
    section: .text
    pattern: 48 6B C0 ?? [3-6] (0F B6 84 ?? ?? ?? ?? ?? 30 84 | 0F B6 8C ?? ?? ?? ?? ?? 30 8C | 0F B6 94 ?? ?? ?? ?? ?? 30 94 | 0F B6 9C ?? ?? ?? ?? ?? 30 9C)
