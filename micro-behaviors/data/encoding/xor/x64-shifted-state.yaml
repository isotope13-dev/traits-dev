defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
traits:
  - id: x64-xorshift-multiply-state-update
    desc: x64 shift-XOR state with multiplication
    conf: 0.97
    if:
      type: hex
      section: .text
      # State ^= state<<13; state ^= state>>7; state ^= state<<CL;
      # multiply the result by a 64-bit constant. Neither state nor multiplier
      # is pinned to one artifact. This alone claims no decryption direction.
      pattern: '4C 89 D0 48 C1 E0 0D 4C 31 D0 (48 8B F8|48 89 C7) 48 C1 EF 07 [0-16] (48 33 F8|48 31 C7) (4C 8B D7|49 89 FA) 49 D3 E2 49 31 FA 48 BF [8] 49 0F AF FA'
  - id: x64-shift-selected-byte-xor
    desc: x64 XORs buffer with selected word byte
    conf: 0.96
    if:
      type: hex
      section: .text
      # Shift count is a byte index times eight; XOR its selected byte into
      # the destination. Require both selection and the actual buffer write.
      pattern: 'C1 E1 03 4C 89 C3 48 D3 EB 30 1E'
