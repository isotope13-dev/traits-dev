defaults:
  platforms: [linux]
  for: [elf]
  arch: [mips]
traits:
  - id: mips-cyclic-byte-xor-mix
    desc: MIPS cyclic byte-XOR mixing loop
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Two cyclic byte arrays, a scalar and a byte key are XORed into output.
      # No particular cipher or direction follows from this operation.
      pattern: '30 68 00 07 [28] 02 62 10 26 00 46 10 26 91 06 00 00 00 46 10 26 14 64 ?? ?? A0 A2 00 00'
