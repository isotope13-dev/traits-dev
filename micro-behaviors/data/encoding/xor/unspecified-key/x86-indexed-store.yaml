defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  # An indexed byte load, XOR, destination address calculation, byte store,
  # and a backward near branch. Stack slots and branch distance may vary.
  # This symmetric transform does not establish a key, encryption, or direction.
  - id: x86-indexed-byte-xor-store
    desc: x86 indexed byte XOR/store with backward branch
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: '0F (B6|BE) 0C 0A 33 C1 8B 55 ?? 03 55 ?? 88 02 E9 ?? ?? FF FF'
