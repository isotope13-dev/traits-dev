# Symmetric transform: the loop alone establishes no encoding direction.
# This existing leaf also holds the Thumb bytewise-XOR transform.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-indexed-byte-xor-stack-key-loop
    desc: x86 byte XOR loop with stack key
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: any
      # buffer[index] -> EAX; XOR with key argument; store AL back to
      # buffer[index] and branch backward. Neither key nor address is fixed.
      pattern: '8B 55 08 03 55 FC 0F BE 02 33 45 0C 8B 4D 08 03 4D FC 88 01 EB (8? | 9? | A? | B? | C? | D? | E? | F?)'
