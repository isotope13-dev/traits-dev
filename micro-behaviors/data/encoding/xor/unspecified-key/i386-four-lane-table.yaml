# Lock and unlock share this transform; the bytes do not establish direction.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]
traits:
  - id: i386-four-lane-table-xor-loop
    desc: x86 four-lane in-place table XOR loop
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: >-
        8B 19 89 D0 01 D8 89 EB 30 18 89 D0 8B 19 01 D8 89 FB
        30 18 89 D0 8B 19 01 D8 89 F3 30 18 89 D0 8B 19 42
        01 D8 8A 1C 24 30 18 8B 41 04 25 FF FF 00 00 39 D0 7F ??
