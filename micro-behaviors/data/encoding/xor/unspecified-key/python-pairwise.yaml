defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]

traits:
  - id: xor-bytes-zip-pairwise
    desc: Pairwise XOR of zipped byte sequences
    conf: 0.94
    # Pairwise byte XOR is symmetric: this may mask network frames,
    # reconstruct keys, encode data, or decode it. Direction and concealment
    # require evidence from a consumer, rather than an algorithm label.
    if:
      type: text
      regex: 'bytes\(\s*\w+\s*\^\s*\w+\s+for\s+\w+\s*,\s*\w+\s+in\s+zip\s*\('
