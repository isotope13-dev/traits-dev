defaults:
  platforms:
  - unix
  - windows
  for:
  - c
  - cpp
  crit: notable
traits:
- id: native-indexed-read-xor-write-loop
  desc: Loop XORs and stores indexed bytes
  conf: 0.98
  if:
    type: tree-sitter
    query: "((for_statement body: (compound_statement\n  (declaration declarator: (init_declarator declarator: (identifier) @byte\n    value: (subscript_expression index: (identifier) @read_index)))\n  (expression_statement (assignment_expression left: (identifier) @xor\n    operator: \"^=\"))\n  (expression_statement (assignment_expression\n    left: (subscript_expression index: (identifier) @write_index)\n    right: (cast_expression value: (identifier) @stored))))) @transform\n (#eq? @byte @xor) (#eq? @byte @stored) (#eq? @read_index @write_index))"
