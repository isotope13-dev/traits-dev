defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
traits:
  - id: x64-counted-byte-xor-cursor-loop
    desc: x64 bounded byte-XOR cursor loop
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      # Increment index, XOR byte [RBP], advance pointer, compare count,
      # branch back. No direction is implied by the reversible operation.
      pattern: 'FF C0 80 75 00 ~00 48 FF C5 41 39 (C4|C5) 75 F2'
  - id: x64-paired-byte-xor-cursor-loop
    desc: x64 paired byte-XOR cursor loop
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      # XOR adjacent bytes, advance by two, compare the end pointer, repeat.
      # The reversible transform does not imply an encoding direction.
      pattern: '80 32 ~00 80 72 01 ~00 48 83 C2 02 48 39 CA 75 F0'
