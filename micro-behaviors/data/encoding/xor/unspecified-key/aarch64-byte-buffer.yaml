# This loop is reversible; receive-to-execution context establishes decoding
# in its consumer, rather than in the instruction pattern itself.
defaults:
  crit: notable
  platforms: [linux]
  for: [elf]
traits:
  - id: aarch64-bytewise-xor-loop
    desc: AArch64 bytewise XOR buffer transform loop
    conf: 0.9
    arch: [aarch64]
    if:
      type: hex
      section: .text
      # Load and store a byte through register-indexed addresses around EOR,
      # then advance an index, compare it with the byte count, and loop.
      pattern: '?? 68 ?? 38 ?? ?? ?? 4A ?? 68 ?? 38 ?? 04 00 91 ?? ?? ?? 6B ?? ?? ?? 54'
