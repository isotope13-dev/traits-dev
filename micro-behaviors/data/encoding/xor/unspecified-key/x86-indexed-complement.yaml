# A reversible transform, not a cipher, payload identity or direction claim.
# Address/index stack slots, key slot and branch displacement are unpinned.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  - id: x86-indexed-xor-complement-byte-stores
    desc: x86 indexed XOR and complement byte stores
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: >-
        8B 85 [4] 03 85 [4] 0F BE 00 0F BE 4D ?? 33 C1
        8B 8D [4] 03 8D [4] 88 01
        8B 85 [4] 03 85 [4] 0F BE 00 F7 D0
        8B 8D [4] 03 8D [4] 88 01 EB (8? | 9? | A? | B? | C? | D? | E? | F?)
