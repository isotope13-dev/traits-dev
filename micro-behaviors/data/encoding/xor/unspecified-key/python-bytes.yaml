# Direction-neutral byte scrambling. Require the comprehension rather than
# treating any XOR argument to bytes() as a cipher or payload decoder.
defaults:
  platforms: [windows, unix]
  for: [python, text]
  crit: notable

traits:
  - id: python-xor-bytes-comprehension
    desc: Constructs bytes from an XOR comprehension
    conf: 0.9
    if:
      type: text
      regex: 'bytes\s*\(\s*\[?\w+\s*\^[^\n]{1,100}\bfor\s+[\w, ]{1,30}\s+in\b'
