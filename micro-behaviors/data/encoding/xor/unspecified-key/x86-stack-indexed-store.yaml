defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  # An indexed byte load feeds XOR and a byte store before the counter
  # increment and backward branch. Frame and state-field offsets vary;
  # no payload key, transform direction or family constant is required.
  - id: x86-stack-indexed-byte-xor-store
    desc: x86 indexed byte XOR and store loop
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: '8B 4D ?? 0F B6 14 0A 33 D0 8B 45 ?? 8B 48 ?? 8B 45 ?? 88 14 01 8B 4D ?? 83 C1 01 89 4D ?? EB ??'
