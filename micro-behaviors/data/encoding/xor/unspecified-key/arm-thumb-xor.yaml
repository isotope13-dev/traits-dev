# The loop itself is symmetric; its consumer supplies reconstruction context.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [arm]
  crit: notable
traits:
  - id: arm-thumb-bytewise-xor-loop
    desc: Thumb bytewise XOR buffer transform loop
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: '19 78 81 F0 ?? 01 03 F8 01 1B 59 1B 91 42 ?? DB'
