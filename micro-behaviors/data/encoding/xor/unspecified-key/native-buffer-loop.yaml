# Load/XOR/store loops, independent of XOR key and sidecar filename.
defaults:
  platforms: [linux, windows]
  for: [elf, pe]
  arch: [x86-64]
  crit: notable
  conf: 0.95

traits:
  - id: x64-vector-buffer-xor-loop
    desc: SIMD buffer load, XOR, store loop
    if:
      type: hex
      section: text
      pattern: '(F3 0F 6F ?? 48 83 C0 10 66 0F EF ?? 0F 11 ?? F0 48 39 ?? 75 ?? | F3 0F 6F ?? E0 48 8D ?? 40 48 83 C1 40 66 0F 6F ?? 0F 57 ?? F3 0F 7F ?? A0)'

  - id: x64-register-byte-xor-cursor-loop
    desc: x64 register-key byte XOR cursor loop
    if:
      type: hex
      section: text
      # XOR [RAX] with DL/BL, increment RAX, compare with RCX/RDI, repeat.
      # This reversible arithmetic alone does not establish decoding.
      pattern: '30 (10|18) 48 83 C0 01 48 39 (C8|F8) 75 F5'

composite_rules:
  - id: x64-buffer-xor-loop
    desc: x64 buffer XOR transform loop
    any:
      - id: x64-vector-buffer-xor-loop
      - id: x64-register-byte-xor-cursor-loop
