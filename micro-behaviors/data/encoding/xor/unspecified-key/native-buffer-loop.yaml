# Load/XOR/store loops, independent of XOR key and sidecar filename.
defaults:
  platforms: [linux, windows]
  for: [elf, pe]
  arch: [x86-64]
  crit: notable
  conf: 0.95

traits:
  - id: x64-vector-buffer-xor-loop
    desc: SIMD buffer load, XOR, store loop
    if:
      type: hex
      section: text
      pattern: '(F3 0F 6F ?? 48 83 C0 10 66 0F EF ?? 0F 11 ?? F0 48 39 ?? 75 ?? | F3 0F 6F ?? E0 48 8D ?? 40 48 83 C1 40 66 0F 6F ?? 0F 57 ?? F3 0F 7F ?? A0)'
