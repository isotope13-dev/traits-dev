defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-xor16-buffer-native-wait-cycle
    desc: XOR-masks buffer across indirect relative wait
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # Both loops use RBX, length RDI and the same 16-byte stack key.
      # Between them is the -10000 conversion to native relative wait units.
      pattern: '0F B6 0C 1A 48 8B C2 83 E0 0F 32 4C 05 ?? 88 0C 1A 48 FF C2 48 3B D7 72 ?? [0-32] 48 69 CE F0 D8 FF FF [0-128] FF 15 [4] [0-64] 0F B6 14 18 48 8B C8 83 E1 0F 32 54 0D ?? 88 14 18 48 FF C0 48 3B C7 72 ??'
