defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  arch:
  - x86
  crit: notable
traits:
- id: x86-unrolled-byte-xor-to-stack
  desc: x86 unrolled XOR byte writes to stack
  conf: 0.96
  if:
    type: yara
    source: "rule x86_unrolled_byte_xor_to_stack {\n  strings:\n    $decoder = { 0F B6 50 ?? 80 F1 ?? 80 F2 ?? 88 4C 24 ??\n\
      \                 0F B6 48 ?? 88 54 24 ?? 0F B6 50 ??\n                 80 F1 ?? 80 F2 ?? 88 4C 24 ?? }\n  condition:\n\
      \    uint16(0) == 0x5a4d and $decoder\n}\n"
