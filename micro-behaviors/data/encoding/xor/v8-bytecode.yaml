defaults:
  platforms: [windows]
  for: [pe]
  crit: notable

traits:
  # V8 12.4: Mod; Star; CallProperty1; BitwiseXor; SetKeyedProperty.
  # Operands are register, feedback-slot and constant-pool indexes. This
  # records the operation shape, without inferring encoding direction.
  - id: v8-modulo-xor-store-sequence
    desc: V8 modulo, call, XOR and indexed-store sequence
    conf: 0.9
    if:
      type: hex
      pattern: "3F F? ?? C? 61 F? F? F? ?? 42 F? ?? 37 F? F? ?? 0B F? 53 ?? C? 8E ?? 00 ??"
      section: overlay

composite_rules:
  - id: v8-modulo-xor-indexed-store
    desc: Cached V8 bytecode contains indexed XOR transform
    conf: 0.95
    all:
      - id: metadata/binary/code/bytecode::embedded-v8-code-cache-header
      - id: v8-modulo-xor-store-sequence
