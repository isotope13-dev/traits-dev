defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: x86-4096-byte-constant-xor-loop
    desc: x86 constant-key XOR over 4096 bytes
    crit: notable
    conf: 0.99
    if:
      type: hex
      # EAX indexes one byte at a time; the backward branch repeats exactly
      # 4096 times. The buffer address and key are deliberately unrestricted.
      offset_range: [0, null]
      pattern: '33 C0 80 B0 ?? ?? ?? ?? ?? 40 3D 00 10 00 00 7C F1'
