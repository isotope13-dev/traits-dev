# The same reversible operation appears on outbound and inbound RAT records.
# These loops alone do not establish encryption or an encoding direction.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  crit: notable
traits:
  - id: x86-constant-byte-xor-copy-loop
    desc: x86 nonzero constant XOR byte-copy loop
    conf: 0.98
    if:
      type: hex
      section: .text
      # Countdown BL/[ECX] and count-up DL/[EAX] variants. Keep the load,
      # nonzero immediate, same-byte store, pointer advance and backward edge.
      pattern: '(8A 1C 08 80 F3 ~00 88 19 41 4A 75 F4 | 8A 14 01 80 F2 ~00 47 88 10 40 3B 3E 72 F2)'
