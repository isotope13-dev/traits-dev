# Direction-neutral: XORing in place can encode or decode. The surrounding
# PE entry stub supplies decoding context in the reviewed Karton specimen.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  crit: notable
  conf: 0.96

traits:
  - id: x86-padded-register-stride-dword-xor-loop
    desc: Padded constant-key dword XOR stride loop
    if:
      type: hex
      section: any
      # mov esi,key; NOP padding; xor [eax],esi; add eax,edi; loop.
      # Keys, addresses and padding lengths are unpinned; require a back edge.
      pattern: 'BE ?? ?? ?? ?? 90 [0-8] 31 30 [0-8] 01 F8 [0-8] E2 (D?|E?|F?)'
