defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-register-bounded-constant-xor-loop
    desc: x86 register-bounded constant-key byte XOR loop
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # XOR byte [EAX+buffer],key; increment EAX; compare to ESI/EDI;
      # signed backward branch targets that same XOR instruction.
      # This reversible transform alone establishes neither decoding nor intent.
      pattern: '80 B0 ?? ?? ?? ?? ?? 40 3B (C6|C7) 7C F4'
