defaults:
  platforms: [windows]
  for: [data]
traits:
  - id: x64-fnv16-feedback-xor
    desc: FNV-mixed word state drives byte XOR
    crit: notable
    conf: 0.99
    if:
      type: hex
      # FNV32 on a two-byte state; avalanche, update state, XOR input,
      # store output and advance both buffer and count. Addresses vary.
      pattern: 'BF C5 9D 1C 81 [0-24] 33 C7 69 F8 93 01 00 01 [0-12] 69 C7 01 20 00 00 8B C8 C1 E9 07 33 C8 8D 04 C9 8B C8 C1 E9 11 66 33 C8 0F B7 C1 6B C8 21 66 33 F1 40 8A C6 66 89 74 24 ?? 42 32 04 0A 41 88 01 4D 03 CB 4D 2B D3'
