defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-byte-keystream-xor-chunks
    desc: XORs byte chunks with a generated keystream
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Load each keystream byte and XOR the target byte, then update the
      # processed-byte count before regenerating the next keystream word.
      pattern: '0F B6 30 41 8D 14 03 48 83 C0 01 40 30 34 11 49 39 C1 75 ?? 45 01 C2 45 39 EA 0F 82 [4]'
