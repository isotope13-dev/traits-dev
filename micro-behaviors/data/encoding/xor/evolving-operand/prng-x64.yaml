defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
traits:
  - id: x64-eight-byte-prng-xor-buffer-loop
    desc: Byte XOR loop with eight-byte PRNG refresh
    conf: 0.97
    if:
      type: hex
      section: .text
      # Either register allocation retains the same state refresh, key-byte
      # selection, in-place XOR, and loop bound. This symmetric transform
      # does not establish a decoding direction by itself.
      pattern: '(4C 89 D1|49 8B CA|4C 89 D9|49 8B CB) 48 83 E1 07 75 ?? 4C 0F AF C8 (49 01 D1|4C 03 CA) [0-32] C1 E1 03 (4C 89 DF|49 8B FB|4C 89 D7|49 8B FA) 48 D3 EF 42 30 3C (16|1E) 49 FF (C2|C3) (4D 39 FA|4D 3B D7|4D 39 FB|4D 3B FB) 75 ??'
