defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: x86-generated-byte-xor-buffer-loop
    desc: x86 generated-byte XOR buffer loop
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: CODE
      # Per byte: obtain a generated byte, XOR [esi], increment the buffer
      # pointer, decrement the remaining length, and loop. The helper's
      # relative address is deliberately unconstrained.
      pattern: 'B8 FF 00 00 00 E8 ?? ?? ?? ?? 30 06 46 4B 75 F0'
