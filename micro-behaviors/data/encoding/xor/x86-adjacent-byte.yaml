# This recurrence can scramble or restore a byte buffer; direction and intent
# come from its caller. No key, address, family string or file size is pinned.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-adjacent-byte-xor-loop
    desc: x86 buffer-byte XOR with preceding byte
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Load buffer[i] and buffer[i-1], XOR, store at buffer[i], advance i,
      # compare the length, and branch back to the first indexed load.
      pattern: '0F B6 1C 0A 0F B6 6C 0A FF 31 DD 95 88 04 11 95 42 39 D0 7F EB'
