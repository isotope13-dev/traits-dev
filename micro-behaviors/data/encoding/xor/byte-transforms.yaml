# Preserve the former encode/xor selector while moving direction-neutral
# implementations to encoding/xor. This group is one alternative in callers.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9
composite_rules:
  - id: xor-byte-transforms
    desc: XOR byte transform implementations
    any:
      - id: micro-behaviors/data/encode/xor
      - id: xor-bytes-zip-pairwise
      - id: c-xor-assign-modulo-operand
      - id: python-literal-key-xor-bytes
      - id: python-xor-bytes-variable-key
      - id: python-base64-adjacent-xor
