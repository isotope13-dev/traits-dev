# Preserve the former encode/xor selector while moving direction-neutral
# implementations to encoding/xor. This group is one alternative in callers.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9
composite_rules:
  - id: xor-byte-transforms
    desc: XOR byte transform implementations
    any:
      # Do not select the whole data/encode/xor parent: its root also holds
      # unrelated shell/ELF string-shape atoms (for example tab-terminated
      # strings), which can make ordinary trailing whitespace look like XOR.
      # Select implementation-bearing branches and the specific root XOR
      # evidence instead.
      - id: micro-behaviors/data/encode/xor::xor-to-system
      - id: micro-behaviors/data/encode/xor::xor-byte-with-cyclic-key
      - id: micro-behaviors/data/encode/xor::xor-key-reset-at-strlen
      - id: micro-behaviors/data/encode/xor::xor-aa55-byte-mask
      - id: micro-behaviors/data/encode/xor::cyclic-xor-string-decrypt
      - id: micro-behaviors/data/encode/xor::perl-xor-decode
      - id: micro-behaviors/data/encode/xor::host-identity-compressed-xor-codec
      - id: micro-behaviors/data/encode/xor::xor-byte-invert-listcomp
      - id: micro-behaviors/data/encode/xor::xor-byte-invert-bytes-listcomp
      - id: micro-behaviors/data/encode/xor::xor-indexed-assign-modulo-key
      - id: micro-behaviors/data/encode/xor::xor-bytearray-mutating-loop
      - id: micro-behaviors/data/encode/xor::xor-itertools-starmap-cycle
      - id: micro-behaviors/data/encode/xor::xor-bytearray-indexed-assign
      - id: micro-behaviors/data/encode/xor::js-xor-variable-assignment
      - id: micro-behaviors/data/encode/xor::js-byte-array-xor-map
      - id: micro-behaviors/data/encode/xor::js-xor-decode-unescape-write-loop
      - id: micro-behaviors/data/encode/xor::js-xor-dynamic-char-at
      - id: micro-behaviors/data/encode/xor::js-byte-buffer-xor-transform
      - id: micro-behaviors/data/encode/xor::x86-xor-copy-write-handoff
      - id: micro-behaviors/data/encode/xor::vba-boolean-identity-xor
      - id: micro-behaviors/data/encode/xor::rb-xor-decode
      - id: micro-behaviors/data/encode/xor::xor-byte-decoder-loop
      - id: micro-behaviors/data/encode/xor::x86-index-modulo-dual-xor-decode-loop
      - id: micro-behaviors/data/encode/xor::x86-xor-add-buffer-decoder-loop
      - id: micro-behaviors/data/encode/xor::x86-xor-add-0x42-decode-loop
      - id: micro-behaviors/data/encode/xor::x64-key-index-dual-xor-copy-loop
      - id: micro-behaviors/data/encode/xor::xor-index-modulo-generic
      - id: micro-behaviors/data/encode/xor::js-indexed-buffer-xor-loop
      - id: micro-behaviors/data/encode/xor::js-chunked-xor-loop
      - id: micro-behaviors/data/encode/xor::xor-hex-encoding-loop
      - id: micro-behaviors/data/encode/xor::embedded-js-xor-character-code
      - id: micro-behaviors/data/encode/xor::python-repeating-key-xor-helper
      - id: micro-behaviors/data/encode/xor::js-wichmann-hill-prng-dup
      - id: micro-behaviors/data/encode/xor::js-cycling-eight-character-xor
      - id: micro-behaviors/data/encode/xor::js-xor-fromcharcode-rebuild
