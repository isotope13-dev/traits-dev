defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-index-mixed-byte-xor-copy
    desc: Index-derived XOR keystream copies bytes
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # multiplier and seed are operands, not fixed campaign constants.
      pattern: '41 69 C0 ?? ?? ?? ?? 49 8B D0 B9 ?? ?? ?? ?? 2B C8 8B C1 C1 E8 0F 33 C1 42 32 44 (04|05) ?? 43 88 04 08 49 FF C0 48 8D 42 02'
