# XOR is reversible; these observations establish no encoding direction.
# Relocated without changing matcher semantics from encode/xor and decode/custom.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

traits:
  - id: python-literal-key-xor-bytes
    desc: Constructs literal-key XOR bytes
    conf: 0.94
    if:
      type: text
      regex: 'bytes\(\s*\w+\s*\^\s*(0x[0-9a-fA-F]{1,3}|[0-9]{1,3})\s+for\s+\w+\s+in\s+'
