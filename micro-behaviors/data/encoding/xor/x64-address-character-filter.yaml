defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
traits:
  - id: x64-xor-decimal-address-character-loop
    desc: XOR byte loop filters decimal-address characters
    crit: notable
    conf: 0.95
    if:
      type: hex
      # XOR one byte, accept ASCII digits or '.', store it and advance.
      # Addresses and RIP-relative operands vary. This is scrambling with
      # an output-character constraint, not evidence of a C2 destination.
      pattern: '0F B6 54 24 ?? 31 EA 8D 72 D0 40 80 FE 09 76 ?? 80 FA 2E 75 ?? 42 88 14 33 49 83 C6 01 49 83 FE ?? 75 ??'
      offset_range: [64, null]
