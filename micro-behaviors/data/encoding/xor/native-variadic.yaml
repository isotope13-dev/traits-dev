defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: native-xor-variadic-positive-values
    desc: Variadic byte XOR skips negative values
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule native_xor_variadic_positive_values {
          strings:
            $loop = { 8B 4A 04 83 C2 04 85 C9 7C ?? 32 CB 88 0E 46 4F 85 FF }
          condition:
            $loop
        }
