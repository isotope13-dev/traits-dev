defaults:
  platforms: [macos]
  for: [macho]
traits:
  - id: x64-stack-indexed-byte-xor-loop
    desc: x64 stack-buffer byte XOR loop
    crit: notable
    conf: 0.98
    arch: [x86-64]
    if:
      type: hex
      section: __text
      # Bounded index comparison, byte load, nonzero XOR, store, increment,
      # and backward edge. Stack locations and the immediate key may vary.
      pattern: '8B 85 [4] 3B 85 [4] 0F 8D [4] 48 63 85 [4] 0F BE 8C 05 [4] 81 F1 ~00 00 00 00 88 8C 05 [4] 8B 85 [4] 83 C0 01 89 85 [4] E9'
  - id: arm64-stack-indexed-byte-xor-loop
    desc: ARM64 stack-buffer byte XOR loop
    crit: notable
    conf: 0.98
    arch: [aarch64]
    if:
      type: hex
      section: __text
      # Bounded index comparison, byte load, XOR, store, increment, and backward branch.
      pattern: '08 01 09 6B [16] 09 01 09 8B 28 01 C0 39 [4] 08 01 0A 4A 28 01 00 39 [8] 08 05 00 11 [4] ?? ?? ?? 17'
composite_rules:
  - id: macho-stack-indexed-byte-xor-loop
    desc: Mach-O stack-buffer byte XOR loop
    crit: notable
    conf: 0.98
    any:
      - id: x64-stack-indexed-byte-xor-loop
      - id: arm64-stack-indexed-byte-xor-loop
