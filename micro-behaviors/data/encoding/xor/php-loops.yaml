defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  # Formerly uuid-xor-array-index under objectives/anti-static. The expression
  # proves no UUID key or concealment; require a loop and retain XOR mechanics.
  - id: php-repeating-key-index-xor
    desc: PHP XOR uses modulo key indexing
    crit: notable
    conf: 0.88
    if:
      type: tree-sitter
      query: |
        ([(for_statement) (foreach_statement) (while_statement)] @loop
          (#match? @loop "\\^\\s*(ord\\s*\\(\\s*)?\\$\\w+\\s*\\[\\s*\\$\\w+\\s*%\\s*strlen"))

  - id: php-byte-xor-transform-loop
    desc: PHP chr/ord XOR byte transform loop
    crit: notable
    conf: 0.93
    if:
      type: tree-sitter
      query: |
        ([(for_statement) (foreach_statement) (while_statement)] @loop
          (#match? @loop "chr\\s*\\(\\s*ord\\s*\\([^;\\r\\n]{1,96}\\^\\s*ord\\s*\\([^;\\r\\n]{1,96}%"))

