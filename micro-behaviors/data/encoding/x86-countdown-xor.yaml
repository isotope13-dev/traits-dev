# Symmetric byte scrambling: no direction is inferred from XOR alone.
defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-countdown-rolling-xor-loop
    desc: x86 countdown and accumulating byte XOR
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: any
      # BL = DL + CL; XOR [EAX], BL; EAX++; ECX--; EDX += EDI.
      # Both operand orders occur; addresses and loop bounds are unpinned.
      pattern: '8A (DA 02 D9 | D9 02 DA) 30 18 85 C9 74 ?? 40 8D 98 ?? ?? ?? ?? 49 03 D7 3B DE 7C ??'
