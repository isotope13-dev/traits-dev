# Scheme implementation evidence: this sequence initializes an inverse
# alphabet table. The matcher does not require a later decode operation.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll, elf, so, macho, dylib]
  arch: [x86]
  crit: notable
  conf: 0.97

traits:
  - id: x86-inverse-alphabet-initialization
    desc: Base64 inverse-alphabet range initialization
    if:
      type: hex
      section: text
      # A-Z -> 0..25, a-z -> 26..51, 0-9 -> 52..61,
      # '+' -> 62, '/' -> 63. Addresses and alignment vary.
      pattern: >-
        B8 41 00 00 00 8D 48 BF 88 88 ?? ?? ?? ?? 40 83 F8 5A 76 F1
        B8 61 00 00 00 [0-12] 8D 50 B9 88 90 ?? ?? ?? ?? 40 83 F8 7A 76 F1
        B8 30 00 00 00 8D 48 04 88 88 ?? ?? ?? ?? 40 83 F8 39 76 F1
        C6 05 ?? ?? ?? ?? 3E C6 05 ?? ?? ?? ?? 3F
