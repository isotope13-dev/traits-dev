# Evidence-based relocations; see testdata/triage/data-taxonomy-audit-20261024/migration.json.
defaults:
  for:
  - source
  - scripts
  conf: 0.9
  attack: T1027
  crit: notable
  platforms:
  - windows
  - linux
  - macos
  mbc: C0026
traits:
- id: custom-base64-alphabet-source-form
  desc: Custom Base64 alphabet source form
  if:
    type: text
    regex: (?i)(NewEncoding\(\s*|\w*alphabet\w*\s*[:=]+\s*)['"][A-Za-z0-9+/]{64}
  not:
  - regex: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789\+/
  - regex: 0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz\+/
