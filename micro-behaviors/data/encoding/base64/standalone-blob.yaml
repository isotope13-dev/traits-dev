# Content that is nothing but Base64 -- a whole file, or a whole line, with no
# surrounding code. That shape says "opaque carrier": an encoded payload rules
# want to see, and equally a reason not to mistake the file for a minified
# bundle.
#
# `is: base64` rather than a `[A-Za-z0-9+/]+={0,2}` character-class regex. The
# hand-written form was what the inline copies used and it is wrong in both
# directions: it accepts runs whose length cannot decode (a 5-character group)
# and rejects URL-safe alphabets outright. The validator checks the canonical
# trailing bits and accepts both alphabets.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, text, data, json]
  crit: component
  conf: 0.9
traits:
  # Carrier scale is the point: a 100 KB unbroken Base64 run is a payload being
  # carried, not an identifier or a short encoded value.
  - id: large-standalone-base64-content
    desc: Large standalone Base64 blob
    if:
      type: text
      # The counted floor is a cheap prefilter and says what the run has to be;
      # `length_min` below carries the real carrier-scale threshold.
      regex: '^[A-Za-z0-9+/_=-]{64,}$'
      is: base64
      length_min: 100000
