defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: node-base64-buffer-clues
    desc: Node Base64 buffer operation clues
    crit: component
    conf: 0.7
    for:
      - javascript
      - typescript
    any:
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
      - id: micro-behaviors/data/decode/base64/unspecified::atob-decode
      - id: micro-behaviors/data/encode/base64/primitive::btoa-symbol
