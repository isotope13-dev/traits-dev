defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
  crit: notable
  conf: 0.8
traits:
- id: preinstall-base64-word
  desc: npm preinstall script references Base64
  if:
    type: value
    path: scripts.preinstall
    substr: base64
  unless:
  - id: metadata/package/files/dependency::node-modules-path
- id: install-base64-word
  desc: npm install script references Base64
  if:
    type: value
    path: scripts.install
    substr: base64
  unless:
  - id: metadata/package/files/dependency::node-modules-path
- id: postinstall-base64-word
  desc: npm postinstall script references Base64
  if:
    type: value
    path: scripts.postinstall
    substr: base64
  unless:
  - id: metadata/package/files/dependency::node-modules-path
