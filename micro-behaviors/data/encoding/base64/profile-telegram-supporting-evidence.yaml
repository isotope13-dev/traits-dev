---
defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
traits:
- id: api-endpoint-b64-fragment
  desc: Base64 API prefix fragment
  crit: component
  conf: 0.9
  for:
  - powershell
  if:
    type: text
    substr: YXBpL
- id: telegram-domain-b64-fragment
  desc: Base64 Telegram domain fragment
  crit: component
  conf: 0.9
  for:
  - powershell
  if:
    type: text
    substr: nRlbGVnc
- id: org-bot-base64-fragment
  desc: Base64 org slash bot fragment
  crit: component
  conf: 0.9
  for:
  - powershell
  if:
    type: text
    substr: m9yZy9ib3Q
- id: send-document-b64-fragment
  desc: Base64 sendDocument fragment
  crit: component
  conf: 0.9
  for:
  - powershell
  if:
    type: text
    substr: VuZERvY3VtZW
- id: seeds-txt-b64-fragment
  desc: Base64 seeds.txt filename fragment
  crit: component
  conf: 0.9
  for:
  - powershell
  if:
    type: text
    substr: lZHMudHh0YC
composite_rules:
- id: encoded-telegram-bot-endpoint-clues
  desc: Encoded Telegram bot endpoint fragments
  crit: notable
  conf: 0.9
  for: [powershell]
  all:
  - id: api-endpoint-b64-fragment
  - id: telegram-domain-b64-fragment
  - id: org-bot-base64-fragment
- id: encoded-seed-document-send-clues
  desc: Encoded seed file and sendDocument fragments
  crit: notable
  conf: 0.9
  for: [powershell]
  all:
  - id: send-document-b64-fragment
  - id: seeds-txt-b64-fragment
