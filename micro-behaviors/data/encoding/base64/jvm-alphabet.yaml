# The JVM initializes char[] elements individually; no contiguous alphabet
# string exists for literal/text matchers. This records the table, not a call
# to an encoder, and is useful on both application and security-tool code.
defaults:
  for: [class]
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
traits:
  - id: jvm-standard-base64-character-array
    desc: JVM initializes the standard Base64 char table
    if:
      type: hex
      pattern: >-
        10 40 BC 05 59 03 10 41 55 59 04 10 42 55 59 05 10 43 55 59 06 10 44 55
        59 07 10 45 55 59 08 10 46 55 59 10 06 10 47 55 59 10 07 10 48 55 59 10
        08 10 49 55 59 10 09 10 4A 55 59 10 0A 10 4B 55 59 10 0B 10 4C 55 59 10
        0C 10 4D 55 59 10 0D 10 4E 55 59 10 0E 10 4F 55 59 10 0F 10 50 55 59 10
        10 10 51 55 59 10 11 10 52 55 59 10 12 10 53 55 59 10 13 10 54 55 59 10
        14 10 55 55 59 10 15 10 56 55 59 10 16 10 57 55 59 10 17 10 58 55 59 10
        18 10 59 55 59 10 19 10 5A 55 59 10 1A 10 61 55 59 10 1B 10 62 55 59 10
        1C 10 63 55 59 10 1D 10 64 55 59 10 1E 10 65 55 59 10 1F 10 66 55 59 10
        20 10 67 55 59 10 21 10 68 55 59 10 22 10 69 55 59 10 23 10 6A 55 59 10
        24 10 6B 55 59 10 25 10 6C 55 59 10 26 10 6D 55 59 10 27 10 6E 55 59 10
        28 10 6F 55 59 10 29 10 70 55 59 10 2A 10 71 55 59 10 2B 10 72 55 59 10
        2C 10 73 55 59 10 2D 10 74 55 59 10 2E 10 75 55 59 10 2F 10 76 55 59 10
        30 10 77 55 59 10 31 10 78 55 59 10 32 10 79 55 59 10 33 10 7A 55 59 10
        34 10 30 55 59 10 35 10 31 55 59 10 36 10 32 55 59 10 37 10 33 55 59 10
        38 10 34 55 59 10 39 10 35 55 59 10 3A 10 36 55 59 10 3B 10 37 55 59 10
        3C 10 38 55 59 10 3D 10 39 55 59 10 3E 10 2B 55 59 10 3F 10 2F 55
