defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - javascript
  - typescript
  id: standard-base64-alphabet
  desc: JavaScript embeds an upper-first Base64 alphabet
  conf: 0.9
  if:
    type: string_literal
    exact: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=
- for:
  - javascript
  - typescript
  id: lower-first-base64-alphabet
  desc: JavaScript embeds a lower-first Base64 alphabet
  conf: 0.9
  if:
    type: string_literal
    exact: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/=
- for:
  - scripts
  - powershell
  - batch
  - lnk
  - javascript
  - typescript
  - python
  - csharp
  - vbs
  - html
  id: standard-base64-alphabet-table
  desc: Embeds the standard Base64 alphabet table
  conf: 0.88
  if:
    type: string_literal
    exact: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/
composite_rules:
- for:
  - javascript
  - typescript
  id: base64-alphabet
  desc: JavaScript embeds a Base64 alphabet
  conf: 0.9
  any:
  - id: micro-behaviors/data/encoding/base64::standard-base64-alphabet
  - id: micro-behaviors/data/encoding/base64::lower-first-base64-alphabet
