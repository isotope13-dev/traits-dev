composite_rules:
- platforms:
  - unix
  - windows
  for:
  - package.json
  crit: notable
  conf: 0.85
  id: npm-script-base64
  desc: npm script references Base64 codec
  any:
  - id: npm-script-base64--base64
  - id: npm-script-base64--atob
  - id: micro-behaviors/data/encode/base64::npm-script-base64--btoa
