defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

traits:
  - id: x64-fixed-dword-add-loop
    desc: Adds a fixed key to buffer dwords
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # add [rax],r9d; advance by a dword; compare with the buffer end.
      pattern: '44 01 08 48 83 C0 04 49 3B C0 72 ??'
