defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]

traits:
  # Search a stack-resident 64-symbol alphabet for each input byte, rotate
  # the matching index modulo 64, and replace the byte from the same table.
  # The loop can run in either direction; no Base64 or crypto claim follows.
  - id: x86-rotated-64-symbol-substitution
    desc: Rotated 64-symbol byte substitution loop
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '0F B6 10 8D 4C 24 14 8B 44 24 58 01 C8 0F B6 00 38 C2 75 20 8B 54 24 58 8B 44 24 54 01 D0 83 E0 3F 0F B6 44 04 14 8B 54 24 5C 81 C2 ?? ?? ?? ?? 88 02 EB 0C 83 44 24 58 01 83 7C 24 58 3F 76 B7'
