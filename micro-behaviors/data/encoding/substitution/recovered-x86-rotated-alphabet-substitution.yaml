defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  - data
traits:
- id: x86-rotated-alphabet-substitution
  desc: x86 substitutes bytes through a rotated alphabet
  crit: notable
  conf: 0.96
  if:
    type: yara
    source: "import \"pe\"\nrule x86_rotated_alphabet_substitution {\n  strings:\n    $substitute = {\n\
      \      8B 54 24 ?? 8B 44 24 ?? 01 D0 83 E0 3F 0F B6 44 04 ??\n      8B 54 24 ?? 81 C2 ?? ?? ?? ??\
      \ 88 02 EB ??\n    }\n  condition:\n    $substitute and\n    (not pe.is_pe or\n     for any s in\
      \ (0..pe.number_of_sections-1) : (\n       pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE\
      \ != 0 and\n       for any i in (1..#substitute) : (\n         @substitute[i] >= pe.sections[s].raw_data_offset\
      \ and\n         @substitute[i]+!substitute[i] <=\n           pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size\n\
      \       )\n     ))\n}\n"
