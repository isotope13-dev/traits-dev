defaults:
  platforms: [windows]
  for: [pe, dll, data]
traits:
  # Direction-neutral table substitution: add the rotation to a found index, mask to 64 entries,
  # load the replacement byte and store it into the input buffer.
  - id: x86-rotated-alphabet-substitution
    desc: x86 substitutes bytes through a rotated alphabet
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        import "pe"
        rule x86_rotated_alphabet_substitution {
          strings:
            $substitute = {
              8B 54 24 ?? 8B 44 24 ?? 01 D0 83 E0 3F 0F B6 44 04 ??
              8B 54 24 ?? 81 C2 ?? ?? ?? ?? 88 02 EB ??
            }
          condition:
            $substitute and
            (not pe.is_pe or
             for any s in (0..pe.number_of_sections-1) : (
               pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
               for any i in (1..#substitute) : (
                 @substitute[i] >= pe.sections[s].raw_data_offset and
                 @substitute[i]+!substitute[i] <=
                   pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size
               )
             ))
        }
