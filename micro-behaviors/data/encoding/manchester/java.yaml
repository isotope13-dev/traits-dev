# Complementary bit values selected by half-bit parity form Manchester pairs.
# Neither the timing constants nor the payload, class or variable names matter.
defaults:
  for: [java]
  platforms: [android]
  crit: notable
traits:
  - id: half-bit-parity-choice
    desc: Selects a branch by half-bit parity
    if:
      type: text
      regex: '\(\w{1,32}\s*(&\s*1|%\s*2)\)\s*==\s*0\s*\?'
      exclude_comments: true
  - id: complementary-bit-choice
    desc: Selects complementary bit comparisons
    if:
      type: text
      regex: '\b\w{1,32}\s*==\s*1\s*:\s*\w{1,32}\s*==\s*0'
      exclude_comments: true
  - id: msb-first-indexed-bit
    desc: Extracts MSB-first indexed bit
    if:
      type: text
      regex: '>>\s*\(7\s*-\s*\(\w{1,32}\s*(&\s*7|%\s*8)\)\)\)\s*&\s*1'
      exclude_comments: true
composite_rules:
  - id: java-half-bit-complement
    desc: Half-bit parity selects complementary bit comparisons
    near_lines: 3
    all:
      - id: msb-first-indexed-bit
      - id: half-bit-parity-choice
      - id: complementary-bit-choice
