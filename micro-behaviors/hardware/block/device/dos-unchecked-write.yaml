# Flat COM images without a .com suffix may be classified as unknown. Match
# the actual instructions; neither their collected name nor a DOS header is
# necessary. This is a risky raw-I/O capability, not a wiper-family identity.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 512

traits:
  - id: dos-unchecked-multiple-sector-writes
    desc: Unchecked BIOS sector writes then DOS exit
    crit: suspicious
    conf: 0.95
    if:
      type: hex
      # Write multiple sectors, reset the buffer and CHS/drive registers,
      # write one sector, and immediately exit successfully. There is no
      # branch or status check on either BIOS result. Addresses/counts vary.
      pattern: "B8 (02|03|04|05|06|07|08|09|0A|0B|0C|0D|0E|0F|1?|2?|3?) 03 CD 13 BB ?? ?? B6 ?? B2 ?? B9 ?? ?? B8 01 03 CD 13 B4 4C B0 00 CD 21"
      offset_range: [0, 128]
