defaults:
  for:
    - elf
    - shell
    - python
  platforms:
    - linux
    - unix
    - windows
    - macos
    - ios
    - android
traits:
  - id: disk-identity-ioctl
    desc: References the Linux disk identity query ioctl
    crit: notable
    conf: 0.8
    attack: T1082
    platforms: [linux]
    if:
      type: text
      substr: HDIO_GET_IDENTITY
  - id: sys-block-dup
    desc: Access block device info via /sys/dev/block
    crit: notable
    conf: 0.75
    attack: T1082
    platforms:
      - linux
    if:
      type: text
      substr: /sys/dev/block
  # NOTE: the /dev/sdX disk path itself is a path reference, not a block-device
  # access mechanism, and lives with the rest of that family as
  # micro-behaviors/fs/path/device/storage::dev-sd.
  - id: dev-dm
    desc: Access LVM device mapper
    crit: notable
    conf: 0.75
    platforms:
      - linux
    if:
      type: text
      regex: /dev/dm-\d
  - id: dev-mapper
    desc: Uses device mapper framework
    crit: notable
    conf: 0.7
    platforms:
      - linux
    if:
      type: text
      substr: /dev/mapper
