defaults:
  crit: notable
  for:
  - elf
  - shell
  - python
  platforms:
  - linux
  - unix
  - windows
  - macos
  - ios
  - android
traits:
- id: disk-identity-ioctl
  desc: References the Linux disk identity query ioctl
  conf: 0.8
  attack: T1082
  platforms: [linux]
  if:
    type: text
    substr: HDIO_GET_IDENTITY
- id: sys-block-dup
  desc: Access block device info via /sys/dev/block
  conf: 0.75
  attack: T1082
  platforms:
  - linux
  if:
    type: text
    substr: /sys/dev/block
- id: dev-sd-python-call
  desc: Passes /dev/sd path to a Python call
  conf: 0.85
  for: [python]
  platforms: [linux]
  if:
    type: tree-sitter
    kind: call
    regex: /dev/sd[a-z]
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: dev-dm
  desc: Access LVM device mapper
  conf: 0.75
  platforms:
  - linux
  if:
    type: text
    regex: /dev/dm-\d
