defaults:
  for:
  - data
  - dos_com
  - pe
  - static-lib
  platforms:
  - windows
  - unix
  size_min: 482
  size_max: 8192
traits:
- id: dos-bpb-backed-read-intercept
  desc: Boot read gate with BPB-sector backup
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule dos_bpb_backed_read_intercept {\n meta:\n filetypes = \"dat,bin,payload,raw,map,com,dos,pe,static-lib\"\n strings:\n$geometry = { 8B 6F 11 C1 ED 04 8B 4F 16 D1 E1 03 CD 41 2B 4F 18 B6 01 CD 40 CB }\n $gate = { 83 F9 01 75 ?? 80 FC 02 75 ?? 3A F5 75 ?? 9C 0E E8 ?? ?? 72 ?? 9C 60 1E 06 1F 81 7F 1F ?? ?? 74 ?? B8 01 03 60 0E E8 ?? ?? }\n condition:\n#gate > 0 and #gate <= 32 and #geometry > 0 and #geometry <= 32 and\n for any g in (1..#gate) : (for any b in (1..#geometry) :\n (@gate[g]+41+uint16(@gate[g]+39) == @geometry[b]+65536))\n}"
- id: dos-cs-body-boot-buffer-replacement
  desc: CS body copy followed by boot write
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule dos_cs_body_boot_buffer_replacement {\n meta:\n filetypes = \"dat,bin,payload,raw,map,com,dos,pe,static-lib\"\n strings:\n$copy = { 8D 7F 1C FC B9 E2 01 E8 00 00 5E 81 EE ?? ?? F3 2E A4 }\n $write = { C7 07 EB ?? 61 CD 40 }\n condition:\n#copy > 0 and #copy <= 32 and #write > 0 and #write <= 32 and\n for any c in (1..#copy) : ( @copy[c]+10-uint16(@copy[c]+13) >= 0 and\n @copy[c]+10-uint16(@copy[c]+13)+482 <= filesize and\n for any w in (1..#write) : (@write[w] >= @copy[c]+18 and @write[w] <= @copy[c]+50 and\n int8(@write[w]+3)+2 >= 28 and int8(@write[w]+3)+2 < 510))\n}"
- id: dos-backup-read-restores-caller-buffer
  desc: Backup sector read into caller buffer
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule dos_backup_read_restores_caller_buffer {\n meta:\n filetypes = \"dat,bin,payload,raw,map,com,dos,pe,static-lib\"\n strings:\n$read = { B8 01 02 8B 6F 11 C1 ED 04 8B 4F 16 D1 E1 03 CD 41 2B 4F 18 B6 01 CD 40 CB }\n $mask = { C7 07 EB ?? 61 CD 40 0E E8 ?? ?? 1F 61 9D FB CA 02 00 }\n condition:\n#read > 0 and #read <= 32 and #mask > 0 and #mask <= 32 and\n for any m in (1..#mask) : (for any r in (1..#read) :\n (@mask[m]+11+uint16(@mask[m]+9) == @read[r]+65536))\n}"
