# Reads cylinder/head 0 sector 1 of drive 80h, copies boot code into that buffer, and writes it back. Replacement stays below the partition table. The operation alone can belong to a boot editor.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-xor-mbr-buffer-replacement
    desc: XOR-hidden hard disk boot-code replacement
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_xor_mbr_buffer_replacement {
          strings:
            $dec = { E8 00 00 (32|30) E4 8B FC CD 1A 36 8B 2D 83 ED ?? 83 C4 02 1E 06 0E 0E 1F 07 8D B6 ?? ?? B9 ?? ?? 80 34 ?? 46 E2 FA }
            $read = "\xb8\x01\x02\x33\xdb\xb9\x01\x00\xba\x80\x00\xcd\x13" xor(1-255)
            $copy = "\x01\xee\x33\xff\xb9" xor(1-255)
            $write = "\xb8\x01\x03\xb9\x01\x00\xba\x80\x00\x33\xdb\xcd\x13" xor(1-255)
          condition:
            for any d in (1..#dec) : (
            for any c in (1..#copy) : (
              @read >= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26) and
              @read+!read <= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@read) ^ 184) == uint8(@dec[d]+33) and
              @copy[c] >= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26) and
              @copy[c]+!copy[c] <= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@copy[c]) ^ 1) == uint8(@dec[d]+33) and
              @write >= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26) and
              @write+!write <= @dec[d]+3-uint8(@dec[d]+14)+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@write) ^ 184) == uint8(@dec[d]+33) and
              @copy[c] > @read and @copy[c]-@read < 64 and @write > @copy[c] and @write-@copy[c] < 64 and
              (uint16(@copy[c]+5) ^ (uint8(@dec[d]+33)*257)) > 0 and
              (uint16(@copy[c]+5) ^ (uint8(@dec[d]+33)*257)) < 446 and
              (uint16(@copy[c]+7) ^ (uint8(@dec[d]+33)*257)) == 0xa4f3
            )
            )
        }
