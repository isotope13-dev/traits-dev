defaults:
  platforms: [unix, android]
  for: [source, scripts]
  crit: notable

traits:
  - id: wpa-network-block-credentials
    desc: WPA network block declares SSID and credentials
    conf: 0.95
    if:
      type: text
      regex: 'network\s*=\s*\{{1,2}[\s\S]{0,240}ssid\s*=[\s\S]{0,120}(psk|key_mgmt)\s*='
  - id: multiple-wpa-network-blocks
    desc: Multiple network blocks each declare SSID
    conf: 0.94
    count_min: 2
    if:
      type: text
      regex: 'network\s*=\s*\{[^}]{0,480}\bssid\s*=[^}]{0,480}\}'

