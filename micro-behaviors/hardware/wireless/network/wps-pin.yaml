defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
  conf: 0.9
  attack: T1110

traits:
  - id: wps-pin-checksum-digit
    desc: WPS PIN checksum digit computation
    if:
      type: text
      regex: '_wps_checksum_digit|format_wps_pin|wps_pin_checksum'

  - id: wps-pin-from-bssid-heuristic
    desc: WPS PIN derived from BSSID heuristics
    if:
      type: text
      regex: 'algo_compute_pin|algo_easybox|algo_arcadyan'

  # The two atoms above only ever matched Python wrappers: they key on the
  # `algo_` prefix wifite and its relatives use for their generator functions.
  # The technique is not Python's — Dumpper, WPSApp, WPSPin, OneShot and
  # Waircut all ship the same table of vendor default-PIN algorithms, and a
  # compiled Windows build presents them as bare model names with nothing to
  # anchor a prefix to. Named separately so the family list stays readable and
  # so the composite can require a wireless context around it.
  - id: wps-default-pin-generator-function
    desc: Names a WPS default-PIN generator
    # Where this tooling actually ships: native Windows/Linux builds, the .NET
    # GUI tools, and the Python/shell wrappers. These four are generator
    # function names invented by the WPS tools themselves; no hardware
    # inventory or driver table carries them.
    for: [pe, elf, macho, csharp, python, shell, c, cpp]
    conf: 0.85
    if:
      type: text
      regex: '(?i)\b(computepin|asuspin|dlinkpin|trendnetpin)\b'

  # `EasyBox`, `Arcadyan` and `Airocon` name the algorithm inside WPS tooling
  # but also name ordinary router and adapter hardware, so on their own they
  # are a vendor string and nothing more. Chromium ships a WiFi adapter model
  # table ("Arcadyan 802.11N Wireless Adapter") beside its networkingPrivate
  # BSSID schema, which satisfied both legs of the recovery composite in every
  # Electron application without a single WPS-related string being present.
  - id: wps-default-pin-vendor-name
    desc: WPS PIN algorithm vendor name
    for: [pe, elf, macho, csharp, python, shell, c, cpp]
    crit: component
    conf: 0.6
    if:
      type: text
      regex: '(?i)\b(easybox|arcadyan|airocon)\b'

  - id: wps-pin-vocabulary
    desc: WPS PIN vocabulary
    for: [pe, elf, macho, csharp, python, shell, c, cpp]
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '(?i)\bwps[ _-]?pin\b'

composite_rules:
  # The vendor brand counts as an algorithm name only where the program also
  # talks about WPS PINs. Proximity is in bytes because a compiled tool keeps
  # its algorithm menu in one resource blob, not on separate lines.
  - id: wps-default-pin-algorithm-name
    desc: Names a WPS default-PIN algorithm
    for: [pe, elf, macho, csharp, python, shell, c, cpp]
    crit: notable
    conf: 0.85
    any:
      - id: wps-default-pin-generator-function
      - id: wps-vendor-default-pin-table

  - id: wps-vendor-default-pin-table
    desc: Vendor name beside WPS PIN vocabulary
    for: [pe, elf, macho, csharp, python, shell, c, cpp]
    crit: component
    conf: 0.8
    all:
      - id: wps-default-pin-vendor-name
      - id: wps-pin-vocabulary
    near_bytes: 200
