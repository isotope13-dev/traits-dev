---
defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
traits:
- id: pin-generator-name-reference
  desc: PIN-generator name reference
  for:
  - pe
  - elf
  - macho
  - csharp
  - python
  - shell
  - c
  - cpp
  conf: 0.85
  if:
    type: text
    regex: "(?i)\\b(computepin|asuspin|dlinkpin|trendnetpin)\\b"
- id: router-vendor-name-reference
  desc: Router vendor name reference
  for:
  - pe
  - elf
  - macho
  - csharp
  - python
  - shell
  - c
  - cpp
  crit: component
  conf: 0.6
  if:
    type: text
    regex: "(?i)\\b(easybox|arcadyan|airocon)\\b"
- id: wps-pin-vocabulary
  desc: WPS PIN vocabulary
  for:
  - pe
  - elf
  - macho
  - csharp
  - python
  - shell
  - c
  - cpp
  crit: component
  conf: 0.7
  if:
    type: text
    regex: "(?i)\\bwps[ _-]?pin\\b"
composite_rules:
- id: pin-generator-or-wps-vendor-reference
  desc: PIN-generator or WPS vendor references
  for:
  - pe
  - elf
  - macho
  - csharp
  - python
  - shell
  - c
  - cpp
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/hardware/wireless/network::pin-generator-name-reference
  - id: micro-behaviors/hardware/wireless/network::wps-vendor-default-pin-table
- id: wps-vendor-default-pin-table
  desc: Vendor name beside WPS PIN vocabulary
  for:
  - pe
  - elf
  - macho
  - csharp
  - python
  - shell
  - c
  - cpp
  crit: notable
  conf: 0.8
  all:
  - id: micro-behaviors/hardware/wireless/network::router-vendor-name-reference
  - id: micro-behaviors/hardware/wireless/network::wps-pin-vocabulary
  near_bytes: 200
