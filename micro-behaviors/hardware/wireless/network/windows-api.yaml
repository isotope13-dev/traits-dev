# Wireless-specific capabilities; language/platform are matcher scope.
defaults:
  for:
  - pe
  - dll
  - c
  - cpp
  platforms:
  - windows
  attack: T1016
traits:
- id: wlan-open-handle
  desc: WlanOpenHandle API reference
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: WlanOpenHandle
- id: wlan-enum-interfaces
  desc: WlanEnumInterfaces API reference
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: WlanEnumInterfaces
- id: wlan-get-available-network-list
  desc: WlanGetAvailableNetworkList API reference
  crit: notable
  conf: 0.95
  if:
    type: symbol
    exact: WlanGetAvailableNetworkList
- id: wlan-get-profile-list
  desc: WlanGetProfileList API reference
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: WlanGetProfileList
- id: wlan-get-profile
  desc: WlanGetProfile API reference
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: WlanGetProfile
- id: wlan-query-interface
  desc: WlanQueryInterface API reference
  crit: notable
  conf: 0.95
  if:
    type: text
    exact: WlanQueryInterface
- id: wlan-api-library-reference
  desc: WLAN API library reference
  crit: notable
  conf: 0.92
  if:
    type: text
    exact: wlanapi.dll
- id: wlan-api-provider
  desc: WLAN API provider library
  crit: notable
  conf: 0.95
  if:
    type: path
    basename: true
    exact: wlanapi.dll
- id: bluetooth-find-first-radio
  desc: BluetoothFindFirstRadio API reference
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: BluetoothFindFirstRadio
- id: bluetooth-find-first-device
  desc: BluetoothFindFirstDevice API reference
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: BluetoothFindFirstDevice
composite_rules:
- id: wlan-network-recon
  desc: WLAN handle, interface and network-list API references
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/hardware/wireless/network::wlan-open-handle
  - id: micro-behaviors/hardware/wireless/network::wlan-enum-interfaces
  - id: micro-behaviors/hardware/wireless/network::wlan-get-available-network-list
  downgrade:
    any:
    - id: micro-behaviors/hardware/wireless/network::wlan-api-provider
- id: wlan-profile-enumeration
  desc: WLAN profile query API references
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/hardware/wireless/network::wlan-api-library-reference
  - id: micro-behaviors/hardware/wireless/network::wlan-get-profile-list
  any:
  - id: micro-behaviors/hardware/wireless/network::wlan-get-profile
  - id: micro-behaviors/hardware/wireless/network::wlan-query-interface
  - id: micro-behaviors/hardware/wireless/network::wlan-get-available-network-list
- id: wlan-profile-bssid-references
  for:
  - pe
  desc: WLAN profile API and BSSID syntax references
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/hardware/wireless/network::wlan-profile-enumeration
  - id: micro-behaviors/hardware/wireless/network::bssid
- id: bluetooth-device-recon
  desc: Bluetooth radio and device query API references
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/hardware/wireless/network::bluetooth-find-first-radio
  - id: micro-behaviors/hardware/wireless/network::bluetooth-find-first-device
  downgrade:
    any:
    - id: well-known/lib/platform/wine/
