---
defaults:
  platforms:
  - windows
  - unix
  - android
  for:
  - source
  - scripts
  crit: notable
  conf: 0.88
traits:
- id: ble-device-discovery-call
  desc: Scans for nearby BLE devices
  if:
    type: text
    regex: "(BleakScanner\\.discover|\\bscanForPeripherals|\\w*(Scanner|Adapter)\\.startScan)\\("
- id: ble-gatt-write-call
  desc: Writes data to a BLE GATT characteristic
  if:
    type: text
    regex: "\\b(write_gatt_char|writeCharacteristic)\\s*\\("
- id: ble-gatt-write-call-alt
  desc: BLE GATT characteristic write method
  if:
    type: text
    regex: "\\b(characteristic|gatt)\\s*\\.\\s*writeValue(WithResponse|WithoutResponse)?\\s*\\("
composite_rules:
- id: ble-gatt-characteristic-write
  desc: BLE GATT characteristic write operation
  crit: notable
  conf: 0.92
  any:
  - id: micro-behaviors/hardware/wireless/network::ble-gatt-write-call
  - id: micro-behaviors/hardware/wireless/network::ble-gatt-write-call-alt
