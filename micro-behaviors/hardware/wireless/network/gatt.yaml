# Bluetooth Low Energy GATT operations. These are neutral hardware/network
# capabilities; exploit and propagation intent is inferred by objective rules.
defaults:
  platforms: [windows, unix, android]
  for: [source, scripts]
  crit: notable
  conf: 0.88

traits:
  - id: ble-device-discovery-call
    desc: Scans for nearby BLE devices
    if:
      type: text
      regex: '\b(BleakScanner\.discover|startScan|scanForPeripherals)\s*\('

  # A bare `writeValue(` is not BLE-specific — pdf.js writes PDF object values
  # through a method of that name. The qualified receiver form is covered by
  # `ble-gatt-write-call-alt` below.
  - id: ble-gatt-write-call
    desc: Writes data to a BLE GATT characteristic
    if:
      type: text
      regex: '\b(write_gatt_char|writeCharacteristic)\s*\('

  - id: ble-gatt-write-call-alt
    desc: BLE GATT characteristic write method
    if:
      type: text
      regex: '\b(characteristic|gatt)\s*\.\s*writeValue(WithResponse|WithoutResponse)?\s*\('

composite_rules:
  - id: ble-gatt-characteristic-write
    desc: BLE GATT characteristic write operation
    crit: notable
    conf: 0.92
    any:
      - id: ble-gatt-write-call
      - id: ble-gatt-write-call-alt
