defaults:
  platforms: [windows]
  for: [python]
traits:
  - id: python-netsh-wlan-profile-list
    desc: Python runs netsh to list Wi-Fi profiles
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (call function: (attribute object: (identifier) @module
            attribute: (identifier) @run)
          arguments: (argument_list (list
            . (string) @program . (string) @wlan
            . (string) @show . (string) @profiles .))
          (#eq? @module "subprocess") (#eq? @run "run")
          (#match? @program "^['\"]netsh['\"]$")
          (#match? @wlan "^['\"]wlan['\"]$")
          (#match? @show "^['\"]show['\"]$")
          (#match? @profiles "^['\"]profiles['\"]$"))
