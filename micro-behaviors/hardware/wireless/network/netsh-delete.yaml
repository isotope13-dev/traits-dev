defaults:
  platforms: [windows]
  for: [pe, dll, powershell, batch]
traits:
  - id: netsh-delete-all-wlan-profiles
    desc: Netsh command deletes all saved WLAN profiles
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bnetsh(\.exe)?\s+wlan\s+delete\s+profile\s+name=\*'
