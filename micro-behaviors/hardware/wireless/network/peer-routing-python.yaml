---
defaults:
  platforms:
  - unix
  - windows
  - android
  for:
  - python
traits:
- id: wifi-direct-p2p-find-command
  desc: Wi-Fi Direct p2p_find command token
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '["'']p2p_find["'']'
- id: wifi-direct-p2p-connect-command
  desc: Wi-Fi Direct p2p_connect command token
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '["'']p2p_connect["'']'
- id: python-wpa-cli-subprocess
  desc: Executes wpa_cli through Python subprocess
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: subprocess\.(run|call|Popen)\s*\(\s*\[[^\]\n]{0,40}["']wpa_cli["']
composite_rules:
- id: python-wifi-direct-peer-routing
  desc: Wi-Fi Direct find/connect command references
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/hardware/wireless/network::python-wpa-cli-subprocess
  - id: micro-behaviors/hardware/wireless/network::wifi-direct-p2p-find-command
  - id: micro-behaviors/hardware/wireless/network::wifi-direct-p2p-connect-command
- id: python-ble-gatt-peer-transfer
  desc: BLE discovery and characteristic write coexist
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/hardware/wireless/network::ble-device-discovery-call
  - id: micro-behaviors/hardware/wireless/network::ble-gatt-characteristic-write
- id: python-multiradio-peer-routing
  desc: Uses multiple proximity-radio transports for peer routing
  crit: suspicious
  conf: 0.96
  any:
  - id: micro-behaviors/hardware/wireless/network::python-wifi-direct-peer-routing
  - id: micro-behaviors/hardware/wireless/bluetooth::python-bluetooth-rfcomm-stream-socket
  - id: micro-behaviors/hardware/wireless/network::python-ble-gatt-peer-transfer
  needs: 2
