# Proximity transports used together as alternate peer routes. Each API is a
# neutral capability; the combination is unusual enough to call out, while the
# exfiltration objective supplies encryption, staging, and Internet egress.
defaults:
  platforms: [unix, windows, android]
  for: [python]

traits:
  - id: python-bluetooth-rfcomm-stream-socket
    desc: Python Bluetooth RFCOMM stream socket
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\bAF_BLUETOOTH\b[^\n]{0,60}\bBTPROTO_RFCOMM\b'

  - id: wifi-direct-p2p-find-command
    desc: Wi-Fi Direct p2p_find command token
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '["'']p2p_find["'']'

  - id: wifi-direct-p2p-connect-command
    desc: Wi-Fi Direct p2p_connect command token
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '["'']p2p_connect["'']'

  - id: python-wpa-cli-subprocess
    desc: Executes wpa_cli through Python subprocess
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'subprocess\.(run|call|Popen)\s*\(\s*\[[^\]\n]{0,40}["'']wpa_cli["'']'

composite_rules:
  - id: python-wifi-direct-peer-routing
    desc: Discovers and connects to Wi-Fi Direct peers through wpa_cli
    crit: notable
    conf: 0.98
    all:
      - id: python-wpa-cli-subprocess
      - id: wifi-direct-p2p-find-command
      - id: wifi-direct-p2p-connect-command

  - id: python-ble-gatt-peer-transfer
    desc: Discovers a BLE peer and writes data to its GATT characteristic
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/hardware/wireless/network::ble-device-discovery-call
      - id: micro-behaviors/hardware/wireless/network::ble-gatt-characteristic-write

  - id: python-multiradio-peer-routing
    desc: Uses multiple proximity-radio transports for peer routing
    crit: suspicious
    conf: 0.96
    any:
      - id: python-wifi-direct-peer-routing
      - id: python-bluetooth-rfcomm-stream-socket
      - id: python-ble-gatt-peer-transfer
    needs: 2
