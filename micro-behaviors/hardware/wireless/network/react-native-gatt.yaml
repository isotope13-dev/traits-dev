# Parsed react-native-ble-plx method calls. Receiver variable names are free;
# comments, example strings and class method declarations are not calls.
defaults:
  platforms: [android, ios]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: react-native-ble-device-scan
    desc: Calls BLE device-scan API
    if:
      type: symbol
      kind: call
      regex: '(^|\.)startDeviceScan$'

  - id: react-native-gatt-characteristic-read
    desc: Reads a BLE GATT characteristic
    if:
      type: symbol
      kind: call
      regex: '(^|\.)readCharacteristicForService$'

  - id: react-native-gatt-characteristic-write
    desc: Writes a BLE GATT characteristic
    if:
      type: symbol
      kind: call
      regex: '(^|\.)writeCharacteristic(With|Without)ResponseForService$'

  - id: react-native-gatt-characteristic-monitor
    desc: Monitors a BLE GATT characteristic
    if:
      type: symbol
      kind: call
      regex: '(^|\.)monitorCharacteristicForService$'
