# Wireless configuration indicators. These support probable wireless
# configuration capability; they do not establish a UI control, a secret read,
# or a completed local radio operation.
defaults:
  platforms: [windows, linux, macos, android, ios]
  for: [source, scripts]
  crit: component
  conf: 0.92

traits:
  - id: wifi-ssid-identifier
    desc: Wireless SSID identifier text
    if:
      type: text
      regex: '(?i)\b(ssid|wifi[_-]?ssid|wlan[_-]?ssid)\b'

  - id: wifi-password-key
    desc: Wireless password key string
    if:
      type: literal
      kind: string
      regex: '(?i)\b(wifi|wlan)[_-]?(password|passwd|pass)\b'
