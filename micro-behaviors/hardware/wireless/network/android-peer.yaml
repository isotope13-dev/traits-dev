# Android nearby-device transports used by peer-to-peer transfer applications.
# Individual APIs are neutral; exfiltration intent is inferred only when the
# objective layer combines several radios with collection and remote egress.
defaults:
  platforms: [android]
  for: [java, kotlin, class, apk, zip, dex]
  crit: notable
  conf: 0.92

traits:
  - id: android-wifi-p2p-manager-reference
    desc: References the Android Wi-Fi P2P manager API
    if:
      type: text
      word: WifiP2pManager

  - id: android-wifi-p2p-peer-discovery-call
    desc: Calls an Android Wi-Fi P2P peer-discovery method
    conf: 0.9
    if:
      type: text
      regex: '\b(discoverPeers|requestPeers)\s*\('

  - id: android-wifi-p2p-group-creation-call
    desc: Calls an Android Wi-Fi P2P group-creation method
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bcreateGroup\s*\('

  - id: android-rfcomm-client-socket
    desc: Creates Android Bluetooth RFCOMM client socket
    conf: 0.97
    if:
      type: text
      word: createRfcommSocketToServiceRecord

  - id: android-rfcomm-listener-socket
    desc: Creates Android Bluetooth RFCOMM listener
    conf: 0.97
    if:
      type: text
      word: listenUsingRfcommWithServiceRecord

  - id: android-ble-gatt-server-open
    desc: Opens an Android BLE GATT server
    conf: 0.96
    if:
      type: text
      word: openGattServer

  - id: android-ble-gatt-server-service-add
    desc: Android BLE GATT service addition
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '\baddService\s*\('

composite_rules:
  - id: android-wifi-direct-peer-discovery
    desc: Discovers nearby peers through Android Wi-Fi Direct
    crit: notable
    conf: 0.96
    all:
      - id: android-wifi-p2p-manager-reference
      - id: android-wifi-p2p-peer-discovery-call

  - id: android-wifi-direct-group-creation
    desc: Creates an Android Wi-Fi Direct peer group
    crit: notable
    conf: 0.95
    all:
      - id: android-wifi-p2p-manager-reference
      - id: android-wifi-p2p-group-creation-call

  - id: android-ble-gatt-peer-transfer
    desc: Discovers a BLE peer and writes data to its GATT characteristic
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/hardware/wireless/network::ble-device-discovery-call
      - id: micro-behaviors/hardware/wireless/network::ble-gatt-characteristic-write

  - id: android-ble-gatt-server
    desc: Opens an Android BLE GATT server and adds a service
    crit: notable
    conf: 0.97
    all:
      - id: android-ble-gatt-server-open
      - id: android-ble-gatt-server-service-add

  - id: android-multiradio-peer-routing
    desc: Android multiradio peer discovery or connection
    crit: suspicious
    conf: 0.96
    any:
      - id: android-wifi-direct-peer-discovery
      - id: android-rfcomm-client-socket
      - id: android-ble-gatt-peer-transfer
    needs: 2

  - id: android-multiradio-peer-relay
    desc: Android multiradio peer listener and routing
    crit: suspicious
    conf: 0.98
    all:
      - id: android-multiradio-peer-routing
    any:
      - id: android-rfcomm-listener-socket
      - id: android-wifi-direct-group-creation
      - id: android-ble-gatt-server
    needs: 1
