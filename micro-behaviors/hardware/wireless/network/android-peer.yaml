---
defaults:
  platforms:
  - android
  for:
  - java
  - kotlin
  - class
  - android_apk
  - zip
  - dex
  crit: notable
  conf: 0.92
traits:
- id: android-wifi-p2p-manager-reference
  desc: References the Android Wi-Fi P2P manager API
  for:
  - java
  - kotlin
  - class
  - dex
  if:
    type: text
    word: WifiP2pManager
- id: peer-discovery-call-text
  desc: Peer discovery method-call text
  conf: 0.9
  for:
  - java
  - kotlin
  - class
  - dex
  if:
    type: text
    regex: "\\b(discoverPeers|requestPeers)\\s*\\("
- id: android-wifi-set-enabled-call
  desc: Calls Android WifiManager setWifiEnabled method
  crit: notable
  conf: 0.94
  for:
  - java
  - kotlin
  - class
  - dex
  if:
    type: text
    exact: setWifiEnabled
composite_rules:
- id: android-wifi-direct-peer-discovery
  desc: Wi-Fi P2P manager and discovery references
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/hardware/wireless/network::android-wifi-p2p-manager-reference
  - id: micro-behaviors/hardware/wireless/network::peer-discovery-call-text
- id: android-wifi-direct-group-creation
  desc: Wi-Fi P2P manager and group-call references
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/hardware/wireless/network::android-wifi-p2p-manager-reference
  - id: metadata/lang/source/syntax/call/invocation::jvm-create-group-call-form
- id: android-ble-gatt-peer-transfer
  desc: BLE discovery and characteristic write coexist
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/hardware/wireless/network::ble-device-discovery-call
  - id: micro-behaviors/hardware/wireless/network::ble-gatt-characteristic-write
- id: android-multiradio-peer-routing
  desc: Android multiradio peer discovery or connection
  crit: suspicious
  conf: 0.96
  any:
  - id: micro-behaviors/hardware/wireless/network::android-wifi-direct-peer-discovery
  - id: micro-behaviors/hardware/wireless/bluetooth::android-rfcomm-client-socket
  - id: micro-behaviors/hardware/wireless/network::android-ble-gatt-peer-transfer
  needs: 2
- id: android-multiradio-peer-relay
  desc: Android multiradio peer listener and routing
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/hardware/wireless/network::android-multiradio-peer-routing
  any:
  - id: micro-behaviors/hardware/wireless/bluetooth::android-rfcomm-listener-socket
  - id: micro-behaviors/hardware/wireless/network::android-wifi-direct-group-creation
  - id: micro-behaviors/hardware/wireless/bluetooth::android-ble-gatt-server
  needs: 1
