# These are command references, including remediation prose. They do not
# establish execution or credential acquisition.
defaults:
  platforms: [windows]
  for: [python, batch, powershell, pe, pyc]
traits:
  - id: netsh-profile-query-command-text
    desc: Netsh saved Wi-Fi profile query text
    crit: notable
    conf: 0.88
    if:
      # No trailing boundary: bytecode members append one marshal type byte
      # to each extracted run, so 'profiles' can be followed by a letter.
      type: text
      regex: 'netsh\s+wlan\s+show\s+profiles?'
  - id: netsh-plaintext-key-command-text
    desc: Netsh plaintext Wi-Fi key query text
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'netsh\s+wlan\s+show\s+profile\b[^\n]{0,180}\bkey\s*\^?=\s*clear\b'
  - id: netsh-wifi-key-output-label
    desc: Netsh Wi-Fi key output label reference
    crit: notable
    conf: 0.9
    if:
      type: text
      # Bound the English words: ContainsKey ContentLength is an API catalog.
      regex: '\bKey Content\b|محتوى المفتاح'
