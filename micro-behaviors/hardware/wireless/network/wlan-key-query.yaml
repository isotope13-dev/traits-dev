defaults:
  platforms: [windows]
  for: [binaries, scripts]
traits:
  # Netsh can be supplied separately from its arguments. This is the query
  # text, not proof of execution or of any returned plaintext passphrase.
  - id: wlan-plaintext-key-query-arguments
    desc: Wi-Fi profile query with plaintext-key flag
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)wlan\s+show\s+profiles?[\s\S]{0,80}\bkey\s*\^?=\s*clear\b'
  - id: wlan-show-profile-arguments
    desc: Saved Wi-Fi profile query arguments
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)^wlan\s+show\s+profiles?\b'
  - id: wlan-plaintext-key-option
    desc: Plaintext WLAN key query option
    crit: notable
    conf: 0.95
    if:
      type: text
      # Includes a separately stored closing quote before key=clear.
      # An option reference alone proves neither execution nor theft.
      regex: '(?i)^[" ]{0,3}key\s*=\s*clear$'
composite_rules:
  - id: split-plaintext-wlan-query-arguments
    desc: Split Wi-Fi query and plaintext-key arguments
    crit: notable
    conf: 0.95
    for: [pe, dll]
    all:
      - id: wlan-show-profile-arguments
      - id: wlan-plaintext-key-option
