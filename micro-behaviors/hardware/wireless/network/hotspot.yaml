# Programmatic access-point / hotspot control: turning the local WiFi radio
# into an AP, or pushing a WiFi configuration onto the device so it associates
# with a named SSID.  These are neutral radio capabilities -- tethering apps,
# ad-hoc file transfer, provisioning tools and setup wizards all use them --
# and the rogue-AP / evil-twin intent is inferred by objective composites that
# add the deception or capture legs.  WiFi *credential* extraction is
# objectives/credential-access/wifi, not here.
defaults:
  platforms: [windows, android, ios]
  for: [source, scripts, binaries]
  crit: notable
  conf: 0.9
  attack: T1016

traits:
  - id: wlan-hosted-network-api
    desc: Windows WLAN hosted-network SoftAP API
    platforms: [windows]
    if:
      type: text
      substr: WlanHostedNetwork

  - id: netsh-hosted-network-configure
    desc: netsh configures a WiFi hosted network
    platforms: [windows]
    if:
      type: text
      regex: '(?i)netsh[^\r\n]{0,40}wlan\s+set\s+hostednetwork\b'

  - id: netsh-hosted-network-start
    desc: netsh starts the WiFi hosted network
    platforms: [windows]
    if:
      type: text
      regex: '(?i)netsh[^\r\n]{0,40}wlan\s+start\s+hostednetwork\b'

  - id: apple-hotspot-configuration-apply
    desc: Applies an Apple NEHotspot WiFi configuration
    platforms: [ios, macos]
    for: [swift, objectivec]
    if:
      type: text
      substr: NEHotspotConfiguration

  - id: android-local-only-hotspot
    desc: Starts an Android local-only WiFi hotspot
    platforms: [android]
    for: [java, kotlin, class]
    if:
      type: text
      regex: '\bstartLocalOnlyHotspot\s*\('

  - id: android-softap-configuration
    desc: Reads an Android SoftAP configuration
    platforms: [android]
    for: [java, kotlin, class]
    if:
      type: text
      word: softApConfiguration
