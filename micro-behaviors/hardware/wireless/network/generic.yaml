defaults:
  for: [scripts, binaries]
  platforms:
    - linux
    - unix
    - windows
    - macos
    - ios
    - android
traits:
  # The bare token, for compiled builds. `bssid` below wants the property or
  # assignment syntax that identifies a real read; an obfuscated .NET binary
  # keeps the word and loses the syntax, so on its own this says only that the
  # program knows what a BSSID is. Composite legs supply the rest.
  - id: bssid-token-reference
    desc: References a BSSID by name
    crit: component
    conf: 0.6
    for: [pe, elf, macho, csharp]
    platforms: [unix, windows]
    if:
      type: text
      word: BSSID
      case_insensitive: true

  - id: bssid
    desc: BSSID property or assignment
    crit: notable
    conf: 0.6
    attack: T1016
    platforms:
      - unix
      - windows
    if:
      type: text
      regex: '(?i)(\.\s*bssid\b|\b["'']?bssid["'']?\s*[:=])'
    unless:
      - id: metadata/library/syntaxhighlighter::prismjs-package-reference
      - id: well-known/lib/ui/highlight-js::bundled-library
