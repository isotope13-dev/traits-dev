defaults:
  crit: notable
  conf: 0.6
  for: [scripts, binaries]
  platforms:
    - linux
    - unix
    - windows
    - macos
    - ios
    - android
traits:
  # These matchers observe BSSID references, not queries or collection.
  - id: bssid-token-reference
    desc: References a BSSID by name
    for: [pe, elf, macho, csharp]
    platforms: [unix, windows]
    if:
      type: text
      word: BSSID
      case_insensitive: true

  - id: bssid
    desc: BSSID property or assignment syntax reference
    platforms:
      - unix
      - windows
    if:
      type: text
      regex: '(?i)(\.\s*bssid\b|\b["'']?bssid["'']?\s*[:=])'
