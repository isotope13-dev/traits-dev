# BlueZ command-line operations against Bluetooth Classic devices. Match the
# management-command structure rather than a product name or fixed device
# address so the traits cover other peripherals with the same pairing flaw.
defaults:
  for: [scripts, binaries]
  platforms: [linux]

traits:
  - id: bluetoothctl-command
    desc: Invokes BlueZ bluetoothctl
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?m)^[ \t]*(sudo[ \t]+)?bluetoothctl([ \t]|$)'

  - id: bluez-management-menu-command
    desc: BlueZ management menu command
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?m)^[ \t]*menu[ \t]+mgmt[ \t]*$'

  - id: bluez-no-io-public-pair-command
    desc: No-I/O public Bluetooth pair request
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '\bpair (-c NoInputNoOutput -t public|-t public -c NoInputNoOutput)\b'

  - id: bluez-device-connect-command
    desc: Connects through bluetoothctl
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\bbluetoothctl[ \t]+connect[ \t]+["$A-Za-z0-9_{]'

  - id: btmon-btsnoop-capture-command
    desc: Captures Bluetooth HCI to BTSnoop
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\bbtmon -i [A-Za-z0-9_-]+ -w .{1,80}\.btsnoop\b'

composite_rules:
  - id: bluez-no-io-public-direct-pair
    desc: BlueZ management forces a public no-I/O pair
    crit: suspicious
    conf: 0.99
    near_bytes: 512
    all:
      - id: bluetoothctl-command
      - id: bluez-management-menu-command
      - id: bluez-no-io-public-pair-command
