# Bluetooth operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - android
  for:
  - java
  - kotlin
  - class
  - android_apk
  - zip
  - dex
  crit: notable
  conf: 0.92
traits:
- id: android-rfcomm-client-socket
  desc: Android RFCOMM client socket API reference
  conf: 0.97
  for:
  - java
  - kotlin
  - class
  - dex
  if:
    type: text
    word: createRfcommSocketToServiceRecord
- id: android-rfcomm-listener-socket
  desc: Android RFCOMM listener API reference
  conf: 0.97
  for:
  - java
  - kotlin
  - class
  - dex
  if:
    type: text
    word: listenUsingRfcommWithServiceRecord
- id: android-ble-gatt-server-open
  desc: Android BLE GATT server API reference
  conf: 0.96
  for:
  - java
  - kotlin
  - class
  - dex
  if:
    type: text
    word: openGattServer
composite_rules:
- id: android-ble-gatt-server
  desc: GATT server and service API references coexist
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/hardware/wireless/bluetooth::android-ble-gatt-server-open
  - id: metadata/lang/source/syntax/call/invocation::jvm-add-service-call-form
