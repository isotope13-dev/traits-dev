# Bluetooth operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
  - android
  for:
  - python
traits:
- id: python-bluetooth-rfcomm-stream-socket
  desc: Python Bluetooth RFCOMM stream socket
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: "\\bAF_BLUETOOTH\\b[^\\n]{0,60}\\bBTPROTO_RFCOMM\\b"
