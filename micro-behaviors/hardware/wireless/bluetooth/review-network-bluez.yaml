# Bluetooth operation review; matcher and effective scope preserved.
---
defaults:
  for:
  - scripts
  - binaries
  platforms:
  - linux
traits:
- id: bluetoothctl-command
  desc: Invokes BlueZ bluetoothctl
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: "(?m)^[ \\t]*(sudo[ \\t]+)?bluetoothctl([ \\t]|$)"
- id: bluez-device-connect-command
  desc: Connects through bluetoothctl
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: \bbluetoothctl[ \t]+connect[ \t]+["$A-Za-z0-9_{]
composite_rules:
- id: bluez-no-io-public-direct-pair
  desc: BlueZ management forces a public no-I/O pair
  crit: suspicious
  conf: 0.99
  near_bytes: 512
  all:
  - id: micro-behaviors/hardware/wireless/bluetooth::bluetoothctl-command
  - id: micro-behaviors/hardware/wireless/network::bluez-management-menu-command
  - id: micro-behaviors/hardware/wireless/network::bluez-no-io-public-pair-command
