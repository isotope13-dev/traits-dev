defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  crit: notable
traits:
- id: js-afplay
  desc: References afplay audio command
  conf: 0.95
  if:
    type: string_literal
    word: afplay
- id: js-aplay
  desc: References aplay audio command
  conf: 0.95
  if:
    type: string_literal
    word: aplay
- id: js-soundplayer
  desc: References PowerShell SoundPlayer API
  conf: 0.95
  if:
    type: string_literal
    substr: Media.SoundPlayer
composite_rules:
- id: js-audio-player-command
  desc: References a platform audio player
  conf: 0.92
  any:
  - id: micro-behaviors/hardware/audio/play::js-afplay
  - id: micro-behaviors/hardware/audio/play::js-aplay
  - id: micro-behaviors/hardware/audio/play::js-soundplayer
- id: js-bundled-audio-player
  desc: Executes bundled audio player file
  conf: 0.93
  all:
  - id: micro-behaviors/fs/path/media::js-audio-file-ref
  - id: micro-behaviors/hardware/audio/play::js-audio-player-command
