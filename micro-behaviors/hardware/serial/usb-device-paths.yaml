defaults:
  platforms: [linux, macos]
  for: [javascript, typescript, python, shell, elf, macho]
  crit: notable
  conf: 0.9

traits:
  - id: usb-serial-device-path
    desc: References USB serial device path
    if:
      type: text
      # Matches plain device nodes (/dev/ttyUSB0, /dev/cu.usbmodem1101) and
      # the escaped spellings inside source-level device-name patterns
      # (/^cu\.usbmodem/i), which enumerate the same USB serial devices.
      regex: 'cu\\?\.(usbmodem|usbserial)|tty(USB|ACM)[0-9]*'
