# USB serial device nodes, as opened by hardware companions and firmware
# tools: macOS cu.usbmodem/cu.usbserial and Linux ttyUSB/ttyACM. The bare
# path is a neutral device-access capability, not evidence of capture or
# exfiltration; intent lives in the composites that reference it.
defaults:
  platforms: [macos, linux]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: usb-serial-device-node
    desc: References a USB serial device node
    if:
      type: text
      # The macOS names also appear backslash-escaped inside JS regex
      # literals (/^cu\.usbmodem/i), so tolerate an escaping backslash.
      regex: '(?i)(cu\\?\.usbmodem|cu\\?\.usbserial|ttyUSB\d*|ttyACM\d*)'
