# Hayes modem dial command written to a serial port. ATD dials, T / P pick
# tone or pulse and a comma pauses before the number.
defaults:
  platforms: [windows, unix]
  for: [batch, scripts]
  conf: 0.9
traits:
  - id: hayes-modem-dial-emergency-number
    desc: Hayes modem dials an emergency number
    crit: suspicious
    if:
      type: text
      regex: '(?i)\bATD[TP,]{0,3}(911|112|999)\b'
