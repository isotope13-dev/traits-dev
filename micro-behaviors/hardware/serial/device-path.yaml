defaults:
  platforms: [linux, macos, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9

traits:
  - id: serial-device-path
    desc: References a serial device path
    if:
      # Bare stems span both spellings: cu.usbmodem in plain strings and
      # cu\.usbmodem in regex literals.
      type: text
      regex: '(^|[^\w])(ttyUSB|ttyACM|ttyS[0-9]|usbmodem|usbserial|COM[0-9])'
