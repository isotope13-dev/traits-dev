defaults:
  platforms: [linux, macos, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9

traits:
  - id: serial-device-name-or-path
    desc: Serial path or reserved COM-name reference
    if:
      # Bare stems span both spellings: cu.usbmodem in plain strings and
      # cu\.usbmodem in regex literals.
      type: text
      regex: '(^|[^\w])(tty(USB|ACM)[0-9]*|ttyS[0-9]+|usbmodem|usbserial|COM[0-9]+)\b'
