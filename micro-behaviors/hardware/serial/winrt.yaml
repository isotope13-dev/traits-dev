defaults:
  platforms: [windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: winrt-serial-device-open
    desc: Opens WinRT serial device by identifier
    if:
      # A TypeScript cast on Windows.Devices makes the projected call target
      # opaque; match the parsed call instead of comments or quoted API text.
      type: tree-sitter
      kind: call
      regex: '\.SerialCommunication\.SerialDevice\.fromIdAsync\s*\('
