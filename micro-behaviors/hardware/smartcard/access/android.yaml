defaults:
  platforms: [android]
  for: [apk, zip, xml]

traits:
  - id: android-nfc-adapter-reference
    desc: Android NFC adapter API reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "Landroid/nfc/NfcAdapter;"

  - id: android-nfc-tech-discovered-intent
    desc: Android NFC TECH_DISCOVERED dispatch intent
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: "android.nfc.action.TECH_DISCOVERED"

  - id: android-isodep-technology-reference
    desc: Android ISO-DEP tag technology reference
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: "Landroid/nfc/tech/IsoDep;"

  - id: android-nfc-transceive-reference
    desc: Android NFC tag transceive method reference
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: transceive

  - id: android-emv-transaction-marker
    desc: EMV payment transaction APDU marker
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)GENERATE[ _-]+AC|GET[ _-]+PROCESSING[ _-]+OPTIONS|REQUEST[ _-]+AID'

  # The AID table an EMV reader SELECTs against, as ISO 7816-5 registered
  # application identifiers under the international 'A' category: A000000003
  # Visa, A000000004 Mastercard/Maestro, A000000025 Amex, A000000065 JCB,
  # A000000152 Discover, A000000333 UnionPay. Neutral — a payment-terminal or
  # card-reader app embeds the same table — but it is the one artifact of EMV
  # tooling that survives identifier obfuscation, so it anchors the relay and
  # tampering composites that reference it. Three distinct schemes keeps a lone
  # hex run from qualifying.
  - id: android-emv-payment-scheme-aid
    desc: EMV payment scheme application identifiers
    crit: notable
    conf: 0.93
    count_min: 3
    if:
      type: text
      regex: '\bA000000[0-9]{3}[0-9A-F]{2,8}\b'
      case_insensitive: true
