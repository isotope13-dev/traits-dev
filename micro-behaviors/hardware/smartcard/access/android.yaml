defaults:
  platforms: [android]
  for: [apk, zip, xml]

traits:
  - id: android-nfc-adapter-reference
    desc: Android NFC adapter API reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "Landroid/nfc/NfcAdapter;"

  - id: android-nfc-tech-discovered-intent
    desc: Android NFC TECH_DISCOVERED dispatch intent
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: "android.nfc.action.TECH_DISCOVERED"

  - id: android-isodep-technology-reference
    desc: Android ISO-DEP tag technology reference
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: "Landroid/nfc/tech/IsoDep;"

  - id: android-nfc-transceive-reference
    desc: Android NFC tag transceive method reference
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: transceive

  - id: android-emv-transaction-marker
    desc: EMV payment transaction APDU marker
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)GENERATE[ _-]+AC|GET[ _-]+PROCESSING[ _-]+OPTIONS|REQUEST[ _-]+AID'
