defaults:
  platforms: [android]
  for: [apk, zip, xml]

traits:
  - id: android-nfc-adapter-reference
    desc: Android NFC adapter API reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "Landroid/nfc/NfcAdapter;"
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog

  - id: android-nfc-tech-discovered-intent
    desc: Android NFC TECH_DISCOVERED dispatch intent
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: "android.nfc.action.TECH_DISCOVERED"

  - id: android-nfc-reader-mode-api
    desc: Android NFC reader-mode API reference
    crit: notable
    conf: 0.94
    for: [apk, zip, xml, java, kotlin]
    if:
      type: text
      word: enableReaderMode

  - id: android-isodep-technology-reference
    desc: Android ISO-DEP tag technology reference
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: "Landroid/nfc/tech/IsoDep;"
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog

  - id: android-nfc-transceive-reference
    desc: Android NFC tag transceive method reference
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: transceive

  # The reader-side atoms above see an app that READS a contactless card. These
  # two see the mirror image: an app that PRESENTS itself as one. HostApduService
  # is the Android Host Card Emulation entry point, and processCommandApdu is the
  # callback the OS invokes with each command APDU the terminal sends, whose
  # return value is what the terminal receives back as the card's answer.
  # Neutral — transit passes, access badges and bank wallets emulate cards the
  # same way — but the tree had no card-emulation atoms at all, so an APK
  # answering a payment terminal read as an ordinary NFC app.
  - id: android-host-card-emulation-service
    desc: Android host card emulation service class
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "Landroid/nfc/cardemulation/HostApduService;"

  - id: android-process-command-apdu-handler
    desc: Android terminal command-APDU handler
    crit: notable
    conf: 0.93
    if:
      type: text
      word: processCommandApdu

  - id: android-emv-transaction-marker
    desc: EMV payment transaction APDU marker
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)GENERATE[ _-]+AC|GET[ _-]+PROCESSING[ _-]+OPTIONS|REQUEST[ _-]+AID'

  # The AID table an EMV reader SELECTs against, as ISO 7816-5 registered
  # application identifiers under the international 'A' category: A000000003
  # Visa, A000000004 Mastercard/Maestro, A000000025 Amex, A000000065 JCB,
  # A000000152 Discover, A000000333 UnionPay. Neutral — a payment-terminal or
  # card-reader app embeds the same table — but it is the one artifact of EMV
  # tooling that survives identifier obfuscation, so it anchors the relay and
  # tampering composites that reference it. Three distinct schemes keeps a lone
  # hex run from qualifying.
  - id: android-emv-payment-scheme-aid
    desc: EMV payment scheme application identifiers
    crit: notable
    conf: 0.93
    count_min: 3
    if:
      type: text
      regex: '\bA000000[0-9]{3}[0-9A-F]{2,8}\b'
      case_insensitive: true

  # Source-level counterparts keep the technique visible before an Android
  # component is packaged, without depending on a family name or endpoint.
  - id: android-source-nfc-adapter-api
    desc: Android source NFC adapter API
    crit: notable
    conf: 0.9
    for: [java, kotlin]
    if:
      type: text
      word: NfcAdapter

  - id: android-source-isodep-api
    desc: Android source ISO-DEP API
    crit: notable
    conf: 0.94
    for: [java, kotlin]
    if:
      type: text
      word: IsoDep

  - id: android-source-nfc-transceive-call
    desc: Android source NFC transceive call
    crit: notable
    conf: 0.95
    for: [java, kotlin]
    if:
      type: text
      regex: '\btransceive\s*\('
