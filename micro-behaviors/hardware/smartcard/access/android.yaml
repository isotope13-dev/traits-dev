defaults:
  platforms: [android]
  for: [apk, zip, xml]

traits:
  - id: android-nfc-card-reader-reference
    desc: Android NFC card-reader reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "Landroid/nfc/NfcAdapter;"

  - id: android-nfc-tech-discovered-intent
    desc: Android NFC TECH_DISCOVERED dispatch intent
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: "android.nfc.action.TECH_DISCOVERED"
