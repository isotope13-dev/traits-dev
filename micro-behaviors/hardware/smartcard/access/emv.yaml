# Protocol atoms shared by EMV tooling across implementation languages and
# host platforms. These identify machine-facing identifiers and byte layouts,
# not prose about payment attacks.
defaults:
  platforms: [android, linux, windows]
  for: [python, java, kotlin]
  crit: notable
  conf: 0.94

traits:
  - id: emv-application-expiry-tlv-tag
    desc: EMV application-expiry TLV tag reference
    conf: 0.97
    if:
      type: text
      regex: '(?i)\b(0x)?5F24\b|0x5F\s*,\s*0x24'

  - id: emv-read-record-command
    desc: EMV READ RECORD APDU command reference
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(EMV|APDU)[ _-]?READ[ _-]?RECORD\b|\b(0x)?00\s*,\s*(0x)?B2\b'

  - id: emv-apdu-relay-routine
    desc: EMV APDU relay routine
    conf: 0.95
    if:
      type: symbol
      kind: function
      regex: '(?i)^(relay|forward|proxy)_?(emv_?)?apdus?$'
