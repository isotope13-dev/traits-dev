# SIM-originating RUN AT exposes the modem's vendor AT command surface to the
# card. These are neutral protocol observations; impact and intent belong in
# objective composites that combine them with a dangerous command or sink.
defaults:
  platforms: [linux, android, appliance]
  for: [source, binaries]
  crit: notable
  conf: 0.92

traits:
  - id: run-at-proactive-command
    desc: SIM proactive RUN AT command marker
    crit: suspicious
    conf: 0.98
    if:
      type: literal
      kind: string
      exact: RUN AT

  - id: modem-at-command-string
    desc: Modem AT command string
    crit: notable
    conf: 0.94
    if:
      type: literal
      kind: string
      regex: '(?i)^(AT(\+|\$)[A-Z][A-Z0-9_]{1,24})([=?!,]|$)'

  - id: sim-apdu-envelope-marker
    desc: SIM APDU ENVELOPE marker
    crit: component
    conf: 0.88
    if:
      type: literal
      kind: string
      exact: ENVELOPE

  - id: sim-apdu-transport-command
    desc: Modem AT+CSIM APDU transport
    crit: notable
    conf: 0.94
    if:
      type: literal
      kind: string
      regex: '^AT(\+)CSIM([=,]|$)'

  - id: modem-filesystem-command
    desc: Vendor AT modem file operation
    crit: notable
    conf: 0.94
    if:
      type: literal
      kind: string
      regex: '(?i)^AT(\+)[A-Z0-9_]{1,12}F(OPEN|READ|WRITE|CLOSE|GET|PUT)([=,]|$)'

  - id: modem-smtp-command
    desc: Vendor AT SMTP transfer command
    crit: notable
    conf: 0.96
    if:
      type: literal
      kind: string
      regex: '(?i)^AT(\+)[A-Z0-9_]{1,12}SMTP([=,]|$)'

  - id: modem-at-path-traversal
    desc: Modem AT command carries traversal
    crit: suspicious
    conf: 0.97
    if:
      type: literal
      kind: string
      regex: '(?i)^AT(\+)[A-Z0-9_]{1,24}[^\r\n]{0,160}(\.\./|/proc/|/sys/)'

  - id: modem-network-generation-restriction
    desc: AT command restricts network to 2G
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '(?i)^AT(\+)COPS\s*=\s*0\s*,\s*\s*,\s*\s*,\s*0\s*$'

  - id: modem-radio-disable-command
    desc: AT command disables modem radio
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '(?i)^AT((\+)CFUN\s*=\s*0|(\$)[A-Z0-9_]*PWRDN)\s*$'

composite_rules:
  - id: sim-at-command-channel
    desc: SIM-originating modem AT channel
    crit: suspicious
    conf: 0.99
    all:
      - id: run-at-proactive-command
      - id: modem-at-command-string

  - id: sim-apdu-at-channel
    desc: SIM APDU transport with RUN AT
    crit: suspicious
    conf: 0.99
    all:
      - id: sim-at-command-channel
    any:
      - id: sim-apdu-envelope-marker
      - id: sim-apdu-transport-command
