# These APIs expose recording capabilities, not covert surveillance.
# Match parsed calls so comments, type annotations and API-name strings do not
# imply recorder construction or a microphone permission request.
defaults:
  platforms: [macos, ios]
  for: [swift]
  crit: notable
  conf: 0.98

traits:
  - id: swift-avaudio-recorder-construction
    desc: Constructs an AVFoundation audio recorder
    if:
      type: symbol
      kind: call
      exact: AVAudioRecorder

  - id: swift-audio-session-record-permission
    desc: Requests AVAudioSession recording permission
    if:
      type: symbol
      kind: call
      regex: '^AVAudioSession\.+sharedInstance\.+requestRecordPermission$'
