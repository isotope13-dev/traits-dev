# Exported media capture/playback helper names (sample capture, wave-memory
# playback, device volume, PCM mapping). Neutral capability: legitimate
# media DLLs export these.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: media-helper-export
    desc: Exports media capture/playback helper
    crit: notable
    conf: 0.97
    if:
      type: symbol
      regex: '(?i)^(CaptureAudioSamples|PlayWaveMemory|GetDeviceVolumeLevel|MapWaveToPCM)$'
