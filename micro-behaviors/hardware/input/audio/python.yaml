defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.82

traits:
  - id: soundcard-module-import
    desc: Python imports the soundcard capture module
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(import\s+soundcard\b|from\s+soundcard\s+import\b)'

  - id: soundcard-recorder-call
    desc: Python opens a soundcard recorder
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b(all_microphones|default_speaker)\s*\(|\.recorder\s*\('

  - id: sounddevice-input-stream
    desc: Opens microphone input stream
    if:
      type: text
      regex: '\bsounddevice\b[\s\S]{0,120}\.InputStream\s*\(|\bsd\.InputStream\s*\('

  - id: microphone-device-env
    desc: Reads microphone device setting
    conf: 0.74
    if:
      type: text
      substr: VOICE_MIC

  - id: silero-vad-model
    desc: Uses Silero VAD model
    conf: 0.8
    if:
      type: text
      regex: 'silero[_-]vad|SileroVAD'

  - id: nemo-asr-stt
    desc: Uses NeMo speech recognition
    conf: 0.84
    if:
      type: text
      regex: 'nemo\.collections\.asr|EncDecCTCModelBPE|parakeet-ctc|parakeet-tdt'

  - id: onnx-audio-model
    desc: Uses ONNX audio model
    conf: 0.76
    if:
      type: text
      regex: '\.onnx\b[\s\S]{0,120}\b(vad|turn)\b'

composite_rules:
  - id: python-microphone-capture
    desc: Python microphone capture
    crit: notable
    conf: 0.88
    any:
      - id: sounddevice-input-stream
      - id: soundcard-capture
      - id: microphone-device-env

  - id: soundcard-capture
    desc: Python captures microphone or loopback audio with soundcard
    crit: notable
    conf: 0.96
    all:
      - id: soundcard-module-import
      - id: soundcard-recorder-call

  - id: python-speech-to-text
    desc: Python speech recognition
    crit: notable
    conf: 0.88
    any:
      - id: nemo-asr-stt
      - id: silero-vad-model
      - id: onnx-audio-model
