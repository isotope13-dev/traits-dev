defaults:
  platforms: [unix]
  for: [elf, scripts, source]
  crit: notable
  conf: 0.95
traits:
  - id: oss-audio-device
    desc: References an OSS audio device
    if:
      type: text
      regex: '/dev/dsp[0-9]*\b'
  - id: alsa-audio-device
    desc: References the ALSA sound-device directory
    if:
      type: text
      substr: /dev/snd/
