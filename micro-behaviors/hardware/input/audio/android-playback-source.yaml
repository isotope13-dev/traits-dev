# Android TextToSpeech is an audio-output surface. The speak method name is
# generic across JVM libraries, so require the platform API import before
# reporting a text-to-speech invocation.
defaults:
  platforms: [android]
  for: [java, kotlin]
  conf: 0.95

traits:
  - id: android-text-to-speech-import
    desc: Imports the Android text-to-speech API
    crit: notable
    if:
      type: symbol
      kind: import
      exact: android.speech.tts.TextToSpeech

  - id: jvm-speak-call
    desc: JVM speak() method call
    crit: notable
    if:
      type: symbol
      kind: call
      exact: speak

composite_rules:
  - id: android-source-text-to-speech-output
    desc: Android source invokes text-to-speech playback
    crit: notable
    conf: 0.97
    all:
      - id: android-text-to-speech-import
      - id: jvm-speak-call
