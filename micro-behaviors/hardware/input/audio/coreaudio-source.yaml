defaults:
  platforms: [macos]
  for: [swift, objectivec]
  crit: notable
  conf: 0.98

traits:
  - id: source-audiounit-render-call
    desc: Calls AudioUnitRender to render audio buffers
    if:
      type: symbol
      kind: call
      exact: AudioUnitRender
  - id: source-audio-output-unit-start-call
    desc: Starts an audio I/O unit
    if:
      type: symbol
      kind: call
      exact: AudioOutputUnitStart
  - id: source-audio-output-unit-stop-call
    desc: Stops an audio I/O unit
    if:
      type: symbol
      kind: call
      exact: AudioOutputUnitStop
