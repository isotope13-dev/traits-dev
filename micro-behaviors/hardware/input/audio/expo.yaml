# Recording setup is an ordinary audio capability. A user-facing recorder
# and a hidden recorder can use this same API; intent belongs to consumers.
defaults:
  platforms: [android, ios]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

composite_rules:
  - id: expo-audio-recording-setup
    desc: Expo audio import and recording setup
    all:
      - id: metadata/import/npm/expo-audio
      - id: js-prepare-to-record-call

traits:
  - id: js-prepare-to-record-call
    desc: Calls asynchronous recording preparation
    if:
      type: symbol
      kind: call
      regex: '(^|\.)prepareToRecordAsync$'
