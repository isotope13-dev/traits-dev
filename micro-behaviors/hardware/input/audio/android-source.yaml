# Source-level Android microphone capture.  The APK rule in android.yaml
# covers manifest/DEX markers; this companion covers Java/Kotlin source so the
# same capability is visible before compilation.
defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1123
  mbc: B0002

traits:
  - id: android-source-media-recorder
    desc: Android source MediaRecorder API
    crit: notable
    conf: 0.94
    if:
      type: text
      word: MediaRecorder

  - id: android-source-microphone-audio-source
    desc: Android source microphone audio source
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\.setAudioSource\s*\([^)]{0,80}\bMIC\b'

composite_rules:
  - id: android-source-audio-capture
    desc: Android source microphone recording capability
    crit: suspicious
    conf: 0.96
    all:
      - id: android-source-media-recorder
      - id: android-source-microphone-audio-source
