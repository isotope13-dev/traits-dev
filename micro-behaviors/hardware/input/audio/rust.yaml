defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1123
traits:
  - id: cpal-default-input-device
    desc: Rust CPAL default input device
    crit: component
    conf: 0.9
    if:
      type: symbol
      exact: host.default_input_device
  - id: cpal-input-config
    desc: Rust CPAL input stream config
    crit: component
    conf: 0.86
    if:
      type: symbol
      exact: input_device.default_input_config
  - id: cpal-build-input-stream
    desc: Rust CPAL input stream builder
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: input_device.build_input_stream
  - id: audio-stream-start
    desc: Starts captured input stream
    crit: component
    conf: 0.82
    if:
      type: symbol
      exact: stream.play
  - id: cpal-input-stream-build-error
    desc: CPAL input stream build failure message
    crit: component
    conf: 0.9
    if:
      type: literal
      exact: Failed to build input stream
composite_rules:
  # The CPAL input device is the discriminator; the WAV-writing legs are neutral
  # container writes that live in micro-behaviors/data/format/media/audio/.
  - id: rust-cpal-audio-recording
    desc: Rust CPAL microphone recording
    crit: suspicious
    conf: 0.93
    all:
      - id: cpal-default-input-device
      - id: cpal-build-input-stream
    any:
      - id: cpal-input-config
      - id: audio-stream-start
      - id: micro-behaviors/data/format/media/audio::hound-wav-writer
      - id: micro-behaviors/data/format/media/audio::wav-sample-write
    unless:
      - id: well-known/lib/platform/cpal::cpal-crate-package-path
