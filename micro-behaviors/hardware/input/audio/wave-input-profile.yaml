defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable

traits:
  - id: wave-in-prepare-header-import
    desc: Imports waveInPrepareHeader audio buffer API
    conf: 0.95
    if:
      type: import
      exact: waveInPrepareHeader
  - id: wave-in-add-buffer-import
    desc: Imports waveInAddBuffer audio buffer API
    conf: 0.95
    if:
      type: import
      exact: waveInAddBuffer

composite_rules:
  - id: wave-input-capture-api-profile
    desc: Wave-input open, buffer, and capture-start APIs
    conf: 0.97
    all:
      - id: waveinopen-api-name
      - id: wave-in-prepare-header-import
      - id: wave-in-add-buffer-import
      - id: wave-in-start-import
