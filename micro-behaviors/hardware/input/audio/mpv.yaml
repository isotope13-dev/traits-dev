defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.98
traits:
  - id: mpv-create-player
    desc: Creates an MPV media-player instance
    if:
      type: import
      exact: mpv_create
  - id: mpv-player-command
    desc: Sends a command to an MPV player
    if:
      type: import
      regex: '^mpv_command(_node|_async|_node_async)?$'
