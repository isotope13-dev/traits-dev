# Synthetic input injection through android.app.Instrumentation. The
# send*Sync methods inject key, pointer, and trackball events into other
# applications' event queues; the method names are platform API. UI test
# frameworks use the same calls, so the atom stays a capability.
defaults:
  crit: notable
  platforms: [android]
  for: [java, kotlin]

traits:
  - id: android-instrumentation-key-injection
    desc: Injects keys via Android Instrumentation
    conf: 0.97
    if:
      type: text
      regex: '\.\s*(sendKeyDownUpSync|sendKeySync|sendCharacterSync)\s*\('

  - id: android-instrumentation-pointer-injection
    desc: Injects pointer via Android Instrumentation
    conf: 0.97
    if:
      type: text
      regex: '\.\s*(sendPointerSync|sendTrackballEventSync)\s*\('
