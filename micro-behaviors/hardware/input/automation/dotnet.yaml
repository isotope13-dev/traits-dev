defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # A normal GUI may expose one recording label or one worker method.  The
  # cluster identifies the recorder/playback state machine instead of any
  # single control name.
  - id: dotnet-macro-recorder-control-cluster
    desc: .NET macro recording/playback controls
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(MacroForm|record(Start|Stop)Button|playBackMacroButton|PlayWorker|TimeSinceLastEvent)'

  - id: dotnet-macro-playback-control-cluster
    desc: .NET macro loop/concealment controls
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(ForeverLoop|Hidewindow|HotkeyActivated|stoponselect)'
