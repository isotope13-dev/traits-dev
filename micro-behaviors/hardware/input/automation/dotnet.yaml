defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # A normal GUI may expose one recording label or one worker method.  The
  # cluster identifies the recorder/playback state machine instead of any
  # single control name.
  - id: dotnet-macro-recorder-control-cluster--form
    desc: Macro recorder control (MacroForm)
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)MacroForm'
  - id: dotnet-macro-recorder-control-cluster--record-start
    desc: Macro recorder control (recordStartButton)
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)recordStartButton'
  - id: dotnet-macro-recorder-control-cluster--record-stop
    desc: Macro recorder control (recordStopButton)
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)recordStopButton'
  - id: dotnet-macro-recorder-control-cluster--playback
    desc: Macro recorder control (playBackMacroButton)
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)playBackMacroButton'
  - id: dotnet-macro-recorder-control-cluster--worker
    desc: Macro recorder control (PlayWorker)
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)PlayWorker'
  - id: dotnet-macro-recorder-control-cluster--last-event
    desc: Macro recorder control (TimeSinceLastEvent)
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)TimeSinceLastEvent'

  - id: dotnet-macro-playback-control-cluster
    desc: .NET macro loop/concealment controls
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(ForeverLoop|Hidewindow|HotkeyActivated|stoponselect)'

composite_rules:
  - id: dotnet-macro-recorder-control-cluster
    desc: .NET macro recording/playback controls
    crit: notable
    conf: 0.94
    any:
      - id: dotnet-macro-recorder-control-cluster--form
      - id: dotnet-macro-recorder-control-cluster--record-start
      - id: dotnet-macro-recorder-control-cluster--record-stop
      - id: dotnet-macro-recorder-control-cluster--playback
      - id: dotnet-macro-recorder-control-cluster--worker
      - id: dotnet-macro-recorder-control-cluster--last-event
