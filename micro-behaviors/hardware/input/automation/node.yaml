# Node desktop-input automation package identity. Library use is dual-use;
# remote-control intent is established by composites under objectives/.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: nut-js-input-import
    desc: Imports nut-js desktop input automation
    if:
      type: string_literal
      exact: "@nut-tree-fork/nut-js"
