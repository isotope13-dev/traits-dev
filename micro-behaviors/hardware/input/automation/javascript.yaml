# Browser and desktop input APIs exposed by JavaScript automation libraries.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1056.003

traits:
  - id: browser-page-mouse-input
    desc: Browser automation synthesizes page mouse input
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '\.page\.mouse\.(click|dblclick|move|down|up|wheel)$'

  - id: browser-page-keyboard-input
    desc: Browser automation synthesizes page keys
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '\.page\.keyboard\.(press|type)$'

  - id: w-mousekey-desktop-input-library
    desc: Imports the w-mousekey desktop input library
    crit: notable
    conf: 0.9
    if:
      type: import
      regex: '^w-mousekey(/|$)'
