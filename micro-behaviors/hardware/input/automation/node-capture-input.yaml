defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: node-desktop-capture-input-automation
  desc: Node captures desktop and synthesizes input
  crit: notable
  conf: 0.99
  for:
  - javascript
  - typescript
  - npm
  scope: archive
  all:
  - id: micro-behaviors/hardware/display/screenshot::node-desktop-screenshot-capture
  any:
  - id: micro-behaviors/hardware/input/automation::nut-js-input-import
  - id: micro-behaviors/hardware/input/automation::nut-js-input-require-path
  - id: micro-behaviors/hardware/input/desktop-automation
