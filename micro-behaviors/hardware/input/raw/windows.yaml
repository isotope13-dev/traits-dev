defaults:
  platforms: [windows]
  for: [pe, c, cpp]

traits:
  - id: get-raw-input-data
    desc: Windows GetRawInputData API
    crit: component
    conf: 0.8
    if:
      type: symbol
      exact: GetRawInputData

  - id: register-raw-input-devices
    desc: Windows RegisterRawInputDevices API
    crit: component
    conf: 0.86
    if:
      type: symbol
      exact: RegisterRawInputDevices

  - id: rawinput-message-token--wm-input
    desc: Windows raw-input message token (WM_INPUT)
    crit: component
    conf: 0.72
    if:
      type: text
      word: WM_INPUT

  - id: rawinput-message-token--rawinputdevice
    desc: Windows raw-input device token (RAWINPUTDEVICE)
    crit: component
    conf: 0.72
    if:
      type: text
      word: RAWINPUTDEVICE

  - id: rawinput-message-token--ridev-inputsink
    desc: Windows raw-input flag token (RIDEV_INPUTSINK)
    crit: component
    conf: 0.72
    if:
      type: text
      word: RIDEV_INPUTSINK

composite_rules:
  - id: rawinput-message-token
    desc: Windows raw-input message token
    crit: component
    conf: 0.72
    any:
      - id: rawinput-message-token--wm-input
      - id: rawinput-message-token--rawinputdevice
      - id: rawinput-message-token--ridev-inputsink

  - id: windows-raw-input
    desc: Windows Raw Input registration and message handling
    crit: notable
    conf: 0.82
    all:
      - id: get-raw-input-data
    any:
      - id: register-raw-input-devices
      - id: rawinput-message-token
