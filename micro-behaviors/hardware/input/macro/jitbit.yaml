defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98

traits:
  - id: play-saved-macro-file
    desc: Jitbit macro invokes saved macro
    if:
      type: raw
      regex: 'PLAY MACRO : [A-Za-z]:\\[^\r\n]{1,240}\.mcr'

  - id: image-conditional
    desc: Jitbit macro tests embedded BMP image
    if:
      type: raw
      regex: '(?m)^IF IMAGE : Qk[0-9A-Za-z+/=]{128,} : [01] : [0-9]{1,3} : [01] :'

composite_rules:
  - id: image-guided-saved-macro
    desc: Jitbit macro uses image matching to guide saved macro playback
    crit: notable
    conf: 0.99
    all:
      - id: play-saved-macro-file
      - id: image-conditional
