# Macro record-and-replay: capture input events for a bounded window, write them
# to a caller-supplied file, then play them back through an automation library.
#
# The recording half looks exactly like a keylogger — a pynput keyboard listener
# whose handler appends key values, plus a file write. What separates the two is
# the other half: a keylogger has no playback, and does not care where the mouse
# was. A recorder captures click coordinates alongside keys because it has to
# reproduce them, and ships a replay function that drives pyautogui.
#
# objectives/collection/keylog/ references this to tell the two apart.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: pynput-click-handler
    desc: pynput mouse click event handler
    if:
      # pynput's on_click signature: (x, y, button, pressed).
      type: text
      regex: '(?m)^\s*def on_click\s*\(\s*\w+\s*,\s*\w+\s*,\s*\w+\s*,\s*\w+'

  - id: automation-replay-call
    desc: Replays input through an automation library
    if:
      type: text
      regex: 'pyautogui\.(press|typewrite|click)\s*\('

composite_rules:
  # Mouse coordinates captured beside the keys, and a replay path for them.
  - id: record-replay-macro
    desc: Input macro recorder with playback
    crit: exception
    conf: 0.93
    all:
      - id: pynput-click-handler
      - id: automation-replay-call
