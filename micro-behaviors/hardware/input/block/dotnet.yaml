defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: block-input-api-name
    desc: BlockInput API name in PE code section
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: BlockInput
      section: .text
composite_rules:
  - id: dotnet-block-input-reference
    desc: Managed assembly references the BlockInput API
    crit: notable
    conf: 0.98
    all:
      - id: block-input-api-name
      - id: metadata/binary/framework::dotnet-assembly
