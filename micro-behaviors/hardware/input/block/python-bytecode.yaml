defaults:
  for: [pyc]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: pyc-keyboard-block-key-reference
    desc: Bytecode references keyboard key blocking
    conf: 0.9
    if:
      type: text
      substr: block_key
  # ctypes calls the Win32 BlockInput export by name; the name survives in the
  # marshalled co_names table of a bytecode module.
  - id: pyc-block-input-api-name
    desc: Bytecode references BlockInput API name
    platforms: [windows]
    conf: 0.9
    if:
      type: text
      substr: BlockInput
