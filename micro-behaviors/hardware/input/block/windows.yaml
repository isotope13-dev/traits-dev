defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562

traits:
  - id: block-input-import
    desc: BlockInput API blocks keyboard and mouse input
    crit: suspicious
    conf: 0.9
    if:
      type: text
      exact: BlockInput
    unless:
      - type: text
        substr: called unimplemented BlockInput
      - id: well-known/tool/sysadmin/sandboxie/
    downgrade:
      any:
        - id: metadata/signed/platform::microsoft-windows
        - id: metadata/lang/compiled::autoit-compiled-script
        - id: metadata/binary/framework::vb6-runtime-library

  - id: block-input-src
    desc: BlockInput API in source
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: 'BlockInput\s+Lib\s+"user32"'

  - id: powershell-block-input-call
    desc: PowerShell blocks keyboard and mouse input
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bBlockInput\s*\(\s*\$(true|false)\s*\)'

composite_rules: []
