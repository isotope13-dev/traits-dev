defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: block-input-import
    desc: Imports the Windows BlockInput API
    crit: notable
    conf: 0.99
    if:
      type: import
      exact: BlockInput
  - id: block-input-src
    desc: BlockInput API in source
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'BlockInput\s+Lib\s+"user32"'

  - id: powershell-block-input-call
    desc: PowerShell blocks keyboard and mouse input
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bBlockInput\s*\(\s*\$(true|false)\s*\)'

composite_rules: []
