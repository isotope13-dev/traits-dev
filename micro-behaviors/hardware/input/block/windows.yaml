defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562

traits:
  - id: block-input-import
    desc: Imports the Windows BlockInput API
    crit: notable
    conf: 0.99
    if:
      type: import
      exact: BlockInput
    unless:
      # A GUI test framework blocks input while it drives the UI: mRemoteNG's
      # NUnitForms libraries under mRemoteNGTests/ import BlockInput for that.
      - id: metadata/package/testing/
      # A reimplementation of the Windows API exports this surface by
      # definition -- Wine and ReactOS ship the very component the rule
      # describes. The narrow carve-out below aged out: it keys on Wine's
      # *stub* message, and Wine 11.9 actually implements BlockInput.
      - id: metadata/binary/vendor/
      - type: text
        substr: called unimplemented BlockInput
      - id: well-known/tool/sysadmin/sandboxie/
      # The string is the User32 declaration, not a call: WinForms and the
      # P/Invoke binding assemblies both name BlockInput because User32
      # exports it.
      - id: metadata/lang/upstream::dotnet-pinvoke-binding-assembly
      # WinForms and System.Private.Windows.Core declare the same User32
      # surface; a verified Microsoft signature identifies the framework.
      - id: metadata/signed/platform/
    downgrade:
      any:
        - id: metadata/signed/platform::microsoft
        - id: metadata/lang/compiled::autoit-compiled-script
        - id: metadata/binary/framework::vb6-runtime-library
  - id: block-input-src
    desc: BlockInput API in source
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: 'BlockInput\s+Lib\s+"user32"'

  - id: powershell-block-input-call
    desc: PowerShell blocks keyboard and mouse input
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bBlockInput\s*\(\s*\$(true|false)\s*\)'

composite_rules: []
