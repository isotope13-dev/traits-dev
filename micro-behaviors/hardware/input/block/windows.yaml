defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1562

traits:
  - id: block-input-import
    desc: Imports the Windows BlockInput API
    crit: notable
    conf: 0.99
    if:
      type: import
      exact: BlockInput
    unless:
      # A GUI test framework blocks input while it drives the UI: mRemoteNG's
      # NUnitForms libraries under mRemoteNGTests/ import BlockInput for that.
      - id: metadata/file/profile/test-indications/
      - id: metadata/binary/vendor/
      - type: text
        substr: called unimplemented BlockInput
      - id: well-known/tool/sysadmin/sandboxie/
      - id: metadata/lang/upstream::dotnet-pinvoke-binding-assembly
      - id: metadata/signed/platform/
    downgrade:
      any:
        - id: metadata/signed/platform::microsoft
        - id: metadata/lang/compiled::autoit-compiled-script
        - id: metadata/binary/framework::vb6-runtime-library
  - id: block-input-src
    desc: BlockInput API in source
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: 'BlockInput\s+Lib\s+"user32"'

  - id: powershell-block-input-call
    desc: PowerShell blocks keyboard and mouse input
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bBlockInput\s*\(\s*\$(true|false)\s*\)'

composite_rules: []
