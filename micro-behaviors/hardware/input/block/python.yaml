# Python input-blocking capabilities.
#
# These are the cross-platform equivalents of Win32 `BlockInput` (see
# windows.yaml): the `keyboard` package suppresses a key globally, and
# `pynput`'s win32 event filter swallows mouse/keyboard messages before any
# other window sees them. Both are neutral mechanics — kiosk shells and
# accessibility tools use them legitimately — so intent comes from the
# composites that pair them with shell termination or forced power-off.
defaults:
  platforms: [linux, macos, windows]
  for: [python]
  crit: notable
  attack: T1562

traits:
  # Relocated from objectives/collection/keylog/capture: `keyboard.block_key`
  # suppresses a keystroke, it never records one — the matcher detects input
  # blocking, not keylogging.
  - id: keyboard-block-key-call
    desc: keyboard library blocks key input
    conf: 0.95
    if:
      type: text
      regex: '\bkeyboard\.block_key\s*\('

  # The escape hatches a user reaches for when a full-screen window will not go
  # away. Blocking any of them is how screen-lockers and "screamer" payloads
  # keep the victim trapped; a kiosk app blocks application keys, not these.
  - id: keyboard-block-escape-key
    desc: Blocks the escape key globally
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bblock_key\s*\(\s*["'']esc(ape)?["'']'

  - id: keyboard-block-task-switch-key
    desc: Blocks a task-switching or shell key
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bblock_key\s*\(\s*["''](alt|tab|windows|win)["'']'

  # `keyboard.unhook_all()` releases every hook the process installed. On its
  # own it is cleanup; it is listed because it marks the block/release pair
  # that distinguishes a temporary lockout from a permanent hook.
  - id: keyboard-unhook-all-call
    desc: Releases all installed keyboard hooks
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\bkeyboard\.unhook_all\s*\('

composite_rules: []
