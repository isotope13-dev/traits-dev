# Go source that resolves Windows global-input APIs dynamically.  Go RATs often
# use syscall.NewLazyDLL/NewProc instead of importing user32 symbols directly,
# so the API names and their dynamic invocation are the stable artifacts.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [go]
  attack: T1056.001
  mbc: E1056.001

traits:
  - id: go-global-key-state-api-resolution
    desc: Go resolves global key APIs
    conf: 0.96
    if:
      type: text
      regex: 'NewProc\(\s*"(GetAsyncKeyState|GetKeyboardState)"\s*\)'

  - id: go-global-pointer-input-api-resolution
    desc: Go resolves cursor/window input APIs
    conf: 0.96
    if:
      type: text
      regex: 'NewProc\(\s*"(GetCursorPos|GetForegroundWindow)"\s*\)'

  - id: go-global-key-api-invocation
    desc: Go invokes resolved key APIs
    conf: 0.96
    if:
      type: text
      regex: '(GetAsyncKeyState|GetKeyboardState)[\s\S]{0,360}\.Call\s*\('

  - id: go-global-pointer-api-invocation
    desc: Go invokes resolved pointer APIs
    conf: 0.96
    if:
      type: text
      regex: '(GetCursorPos|GetForegroundWindow)[\s\S]{0,360}\.Call\s*\('

composite_rules:
  - id: go-global-input-api-cluster
    desc: Go captures keyboard and pointer/window state through dynamic APIs
    conf: 0.98
    all:
      - id: go-global-key-state-api-resolution
      - id: go-global-pointer-input-api-resolution
      - id: go-global-key-api-invocation
      - id: go-global-pointer-api-invocation
