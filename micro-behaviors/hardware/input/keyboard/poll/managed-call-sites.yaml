defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
traits:
  - id: managed-getasynckeystate-call
    desc: Calls GetAsyncKeyState from managed code
    if:
      type: symbol
      kind: call
      exact: GetAsyncKeyState
    # The existing text-only fallback owns cases without a resolved import.
    # Keep its consumers intact; this supplemental call-site observation is
    # for imported calls whose location can be correlated with recording.
    unless:
      - id: get-async-key-state-str
