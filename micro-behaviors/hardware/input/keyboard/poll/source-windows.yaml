defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
  attack: T1056.001
  mbc: E1056.001

traits:
  - id: python-async-key-state-poll
    desc: Python polls asynchronous Windows key state
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)GetAsyncKeyState$'
  - id: cpp-virtual-key-range-loop
    desc: C/C++ scans virtual-key byte range
    crit: notable
    conf: 0.88
    for: [c, cpp]
    if:
      type: text
      regex: 'for\s*\([^)]{0,60}<\s*25[56][\s\S]{0,160}Get(Async)?KeyState'
  # Python spelling of the virtual-key sweep: a range starting at 0x08 (past
  # the mouse-button codes). The polling half lives in
  # python-async-key-state-poll; composites join the two with proximity.
  - id: python-virtual-key-range
    desc: Python virtual-key range loop
    crit: notable
    conf: 0.88
    for: [python]
    if:
      type: text
      regex: '\brange\s*\(\s*0x08\b'
  # `count_min: 4` counted total occurrences, not distinct labels, so a file
  # repeating ONE label four times qualified. Bracketed key names are the
  # conventional notation for keystrokes in prose: Boost.Wave's preprocessor
  # test t_5_006.cpp writes `[TAB]` inline to show where tabs sit, and the same
  # goes for docs on terminal escapes, editor keybindings and CLI help.
  # The real keylogger signal is a *map* spanning the keyboard, so require
  # labels drawn from two disjoint key groups.
