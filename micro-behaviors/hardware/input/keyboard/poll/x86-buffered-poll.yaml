defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-key-state-high-bit-test
    desc: x86 key-state call tests pressed bit
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: .text
      # A virtual key in ESI is passed to the imported state-query API;
      # test AX bit 15. The composite also requires the named import.
      pattern: '56 0F BF F8 FF 15 ?? ?? ?? ?? B9 00 80 00 00 66 85 C1'
