# C source prototypes for keyboard polling and foreground-window lookup. The
# poll call sites in windows.yaml need a call or import. A dynamically resolved
# keyboard poller is declared only as a function-pointer typedef, so these
# prototypes stand in for the call site.
defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.9
  attack: T1056.001

traits:
  - id: keyboard-state-poll-prototype-typedef
    desc: GetAsyncKeyState-shaped prototype typedef
    if:
      type: text
      regex: 'typedef SHORT \(__stdcall ?\*\w+\)\(int\)'
      exclude_comments: true

  - id: foreground-window-prototype-typedef
    desc: GetForegroundWindow-shaped prototype typedef
    if:
      type: text
      regex: 'typedef HWND \(__stdcall ?\*\w+\)\(VOID\)'
      exclude_comments: true

composite_rules:
  - id: keyboard-poll-window-prototypes
    desc: Keyboard poll and foreground-window prototype typedefs
    all:
      - id: keyboard-state-poll-prototype-typedef
      - id: foreground-window-prototype-typedef
