# Native Windows keystroke *polling* APIs.
#
# Hookless polling (a GetAsyncKeyState/GetKeyState loop over virtual key codes)
# is the standard alternative to SetWindowsHookEx: it needs no hook chain, no
# injected DLL, and no message loop, so it evades the hook-focused detections
# that watch user32 hook installation. It is a distinct technique from the
# hook/ sibling and is kept separate so the two produce distinct ML features.
#
# These are neutral capabilities on their own — every GUI toolkit reads key
# state for its own widgets. Keylogging intent is inferred by the composites in
# objectives/collection/keylog/ that pair them with capture loops and storage.
defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
  attack: T1056.001
  mbc: E1056.001
traits:
  - id: get-key-state
    desc: Poll virtual key state
    crit: notable
    conf: 0.85
    if:
      type: import
      exact: GetKeyState
    unless:
      - id: well-known/game/mod/
    downgrade:
      any:
        - id: well-known/lib/web/dioxus
  - id: get-keyboard-state
    desc: Read global keyboard state
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: import
      exact: GetKeyboardState
    unless:
      - id: well-known/game/mod/
  - id: get-async-key-state
    desc: Poll asynchronous virtual key state
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: GetAsyncKeyState
    unless:
      - id: well-known/game/mod/
    downgrade:
      any:
        - id: metadata/binary/metrics/threshold::many-imports-50
        - id: metadata/binary/framework::dotnet-metadata
        - id: well-known/lib/web/dioxus
  - id: get-async-key-state-str
    desc: GetAsyncKeyState API name reference
    crit: component
    conf: 0.85
    for: [pe, c, cpp, csharp, rust, go]
    if:
      type: text
      word: GetAsyncKeyState
  - id: get-keyboard-state-str
    desc: GetKeyboardState P/Invoke string reference
    crit: component
    conf: 0.85
    unless:
      - id: well-known/game/mod/
    for: [pe, rust, c, cpp, csharp, go]
    downgrade:
      any:
        - id: metadata/lang/compiler/managed/
        - id: metadata/lang/compiler/managed::borland-section-code
        - id: well-known/lib/web/dioxus
    if:
      type: text
      word: GetKeyboardState
  # Relocated from metadata/file/format/iso (2026-08) -- see the note on
  # hook::set-windows-hook-a-container-string. These recover key-state polling
  # from carriers cleave cannot descend (ISO-9660 images, SFX bodies); files
  # that parse are covered by the import atoms above.
  - id: get-keyboard-state-container-string
    desc: GetKeyboardState API name in opaque content
    crit: notable
    conf: 0.97
    for: [archive, data]
    if:
      type: text
      exact: GetKeyboardState
  - id: get-key-state-container-string
    desc: GetKeyState API name in opaque content
    crit: notable
    conf: 0.97
    for: [archive, data]
    if:
      type: text
      exact: GetKeyState
composite_rules:
  - id: foreground-window-input-state
    desc: Foreground-window input state checks
    crit: notable
    conf: 0.9
    all:
      - id: get-key-state
      - id: micro-behaviors/ui/window/manage/control::get-foreground-window
  - id: polling-keylogger-api-cluster
    desc: Polling keyboard input API cluster
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/hardware/input/keyboard/layout::map-virtual-key-str
      - id: micro-behaviors/hardware/input/keyboard/hook::to-unicode-ex-str
    any:
      # Managed P/Invoke methods are CLR metadata strings rather than PE
      # imports, so accept the extracted API-name form alongside the native
      # import. Requiring two supporting keyboard APIs keeps the cluster from
      # firing on a lone hotkey check.
      - id: get-async-key-state
      - id: get-async-key-state-str
      - id: get-keyboard-state-str
      - id: micro-behaviors/hardware/input/keyboard/hook::get-keyboard-layout-str
    needs: 2
    unless:
      - id: well-known/game/mod/
      - id: metadata/library/generated::rust-bindings-source
    downgrade:
      any:
        - id: well-known/tool/sysadmin/sandboxie/
        - id: well-known/lib/runtime/slint/
        - id: well-known/lib/web/dioxus
