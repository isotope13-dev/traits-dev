# PowerShell keystroke *polling*: reading key state in a loop instead of
# installing a hook. A script reaches it two ways -- the WPF
# `[Windows.Input.Keyboard]::IsKeyDown` static (loaded with
# `Add-Type -AssemblyName PresentationCore`), or a P/Invoke of user32's
# GetAsyncKeyState compiled through `Add-Type -MemberDefinition`.
#
# Neutral on their own: an interactive script can check whether Shift is held.
# Intent comes from the objectives/ composites that pair a poll with what the
# loop does with it (clipboard capture, a log file, an upload).
defaults:
  crit: notable
  for: [powershell]
  platforms: [windows]
  attack: T1056.001
  mbc: E1056.001
traits:
  - id: wpf-keyboard-is-key-down
    desc: PowerShell polls key state via WPF Keyboard
    conf: 0.9
    if:
      type: text
      regex: '(?i)\[(System\.)?Windows\.Input\.Keyboard\]::(IsKeyDown|IsKeyToggled|GetKeyStates)\s*\('
  - id: forms-control-modifier-keys
    desc: PowerShell reads modifier keys via WinForms
    conf: 0.8
    if:
      type: text
      regex: '(?i)\[(System\.)?Windows\.Forms\.Control\]::ModifierKeys\b'
  # `GetAsyncKeyState` / `GetKeyState` only reach a script through P/Invoke,
  # so the name inside the script is the declaration.
  - id: pinvoke-async-key-state
    desc: PowerShell P/Invokes user32 key-state polling
    conf: 0.9
    if:
      type: text
      regex: '\b(GetAsyncKeyState|GetKeyState|GetKeyboardState)\s*\('
