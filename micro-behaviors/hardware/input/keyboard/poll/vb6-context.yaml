defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: vb6-runkey-shell-key-poll
    desc: VB6 Run-key, shell, and key-poll clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/registry/keys::vb6-shell-runkey-reference
      - id: get-async-key-state-str
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
