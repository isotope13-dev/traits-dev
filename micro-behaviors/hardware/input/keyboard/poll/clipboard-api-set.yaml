defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: keyboard-clipboard-polling-api-set
    desc: Keyboard polling and clipboard API set
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data
    any:
      - id: micro-behaviors/hardware/input/mouse::mouse-event
      - id: micro-behaviors/hardware/input/mouse::get-cursor-pos
      - id: micro-behaviors/os/clipboard/write::set-clipboard-data
    needs: 1
