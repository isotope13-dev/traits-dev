defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: keyboard-clipboard-polling-api-set
    desc: Keyboard polling and clipboard API set
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
      - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state
      - id: micro-behaviors/os/clipboard/read::get-clipboard-data
    any:
      - id: micro-behaviors/hardware/input/mouse/simulate::mouse-event
      - id: micro-behaviors/hardware/input/mouse/position::get-cursor-pos
      - id: micro-behaviors/os/clipboard/write::set-clipboard-data
    needs: 1
    unless:
      # A compiled AutoIt script carries the whole AutoIt runtime, and that runtime
      # is a Windows automation library: clipboard read/write, keyboard and mouse
      # state polling, window enumeration, host and locale queries, and temp-file
      # extraction of its own embedded script. Every compiled .au3 therefore shows
      # the full API surface regardless of what the script does -- Closure
      # Library's CI helper is 30 lines that close a dialog box.
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: metadata/signed/platform/
      - id: polling-input-runtime-known-benign-context
  - id: polling-input-runtime-known-benign-context
    desc: Recognized runtime with polling input surface
    # A suppressor, not a detection: it exists only to be named from
    # keyboard-clipboard-polling-api-set's unless:.
    crit: exception
    conf: 0.95
    any:
      - id: well-known/lib/runtime/scripted/electron/
      - id: well-known/lib/media/sdl/
      # AutoItX is AutoIt's signed automation control. Its public API polls
      # keyboard state and reads/writes the clipboard so callers can drive
      # native Windows applications; the API surface is not a keylogger.
      - id: well-known/tool/sysadmin/autoit::autoitx-official-control
      - id: well-known/tool/sysadmin/autohotkey/
      - id: well-known/app/system/reactos::system-component
      # Official mpv Windows builds expose keyboard polling and clipboard
      # APIs for media controls and text paste, not input capture.
      - id: well-known/app/media/mpv::windows-build-provenance
      # Stripped FFmpeg player builds poll the same APIs through SDL for
      # playback controls and URL paste, not input capture.
      - id: well-known/lib/media/ffmpeg::ffmpeg-player-binary-context
      # Tk's whole widget/text-entry surface is built on GetKeyState /
      # GetAsyncKeyState / GetClipboardData / SetClipboardData / GetCursorPos --
      # tk86.dll ships this cluster in every Tcl/Tk GUI regardless of what the
      # script does, the same way SDL does for games. GNU Readline polls the same
      # keyboard APIs for line-editing key bindings and reads/writes the
      # clipboard for kill-ring yank/paste, and GDB's console/TUI input layer
      # polls both for command-line editing and copy-paste independent of its
      # debugger role (see the anti-analysis debugger-attach-loop exception).
      - id: well-known/lib/runtime/native-platform/tcl-tk::tcl-tk-runtime-component
      - id: well-known/lib/ui/gnu-readline::gnu-readline-library
      - id: well-known/tool/reverse-engineering/windows-debugger::gnu-gdb-debugger-binary
      - id: metadata/binary/vendor/
      - id: well-known/dual-use/remote-admin/tightvnc::tightvnc-viewer-verified-identity
      # Same class as compiled AutoIt: a Lazarus LCL application links the
      # whole Windows widgetset regardless of what it does -- key state for
      # modifiers, clipboard for copy-and-paste -- so PeaZip, a file archiver,
      # presents the full polling-keylogger import set.
      - id: metadata/lang/compiler/systems::lazarus-lcl-gui-application
      - id: well-known/lib/ui/codejock::xtreme-toolkit-pro-runtime-component
      - id: well-known/lib/platform/mfc::mfc-runtime-basename
      - id: metadata/package/tooling::everything-binary
      - id: well-known/app/storage/syncback::syncback-backup-benign-context
      - id: well-known/lib/runtime/native-platform/slint::slint-winit-backend-crate-path
