# Python key-state polling via the `keyboard` package.
#
# `keyboard.is_pressed()` reports whether a key or hotkey combination is
# currently held down. Callers typically poll it in a loop to gate an action
# on a hotkey, which is the hookless polling half of input monitoring: no
# hook installation, just repeated state reads. Like the native
# polling APIs in poll/windows.yaml, this is a neutral capability on its own —
# GUI hotkey handling polls the same way — and keylogging intent is inferred
# by the composites in objectives/collection/keylog/ that pair polling with
# capture loops and storage.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.88
traits:
  - id: keyboard-is-pressed-poll
    desc: Polls key state with is_pressed
    if:
      type: symbol
      kind: call
      regex: '\.is_pressed$'
