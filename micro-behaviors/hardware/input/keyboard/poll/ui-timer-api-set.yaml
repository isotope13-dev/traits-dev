defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: key-state-ui-timer-pe-api-set
  desc: Key-state and UI timer APIs in low-alignment or WX PE
  crit: notable
  conf: 0.91
  all:
  - id: micro-behaviors/hardware/input/keyboard/poll::get-key-state
  - id: micro-behaviors/ui/window/message::set-timer
  - id: micro-behaviors/ui/window/message::kill-timer
  any:
  - id: metadata/binary/layout/size::pe-file-alignment-under-512
  - id: metadata/binary/section/permission::wx-section
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: metadata/filename/identity::p-user-proxy-dll
