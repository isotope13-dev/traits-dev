defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  mbc: B0015
  attack: T1056.001
  crit: suspicious

traits:
  - id: python-hook-keyboard
    desc: Keyboard hook registration
    conf: 0.9
    if:
      type: text
      substr: .HookKeyboard()
composite_rules:
  - id: python-keyboard-hook-setup
    desc: Keyboard hook API registration
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/hardware/input/keyboard/hook::python-hook-keyboard
      - id: micro-behaviors/hardware/input/keyboard/listener::keyboard-hook
