defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  mbc: B0015
  attack: T1056.001
  crit: suspicious

traits:
  - id: python-windows-keyboard-hook-call
    desc: Python installs a Windows keyboard hook
    crit: notable
    conf: 0.96
    platforms: [windows]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SetWindowsHookEx(A|W)?$'
      arg:
        index: 0
        kind: identifier
        name: WH_KEYBOARD_LL
  - id: python-windows-low-level-keyboard-hook-code
    desc: Python installs keyboard hook with code 13
    crit: notable
    conf: 0.96
    platforms: [windows]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SetWindowsHookEx(A|W)?$'
      arg:
        index: 0
        kind: number
        value: 13
  - id: python-hook-keyboard
    desc: Keyboard hook registration
    conf: 0.9
    if:
      type: text
      substr: .HookKeyboard()
composite_rules:
  - id: python-keyboard-hook-setup
    desc: Keyboard hook API registration
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/hardware/input/keyboard/hook::python-hook-keyboard
      - id: micro-behaviors/hardware/input/keyboard/listener::keyboard-hook
