# The Java analyzer emits a built-in keylogger finding for generic keystroke
# vocabulary. This shared hook keeps documented UI/editor libraries from being
# classified as credential capture while leaving the underlying input traits
# and all non-library keylogging findings intact.
defaults:
  platforms: [unix, windows]
  for: [class, java_class]
  crit: suspicious
  conf: 1.0

traits:
  - id: builtin-credential-keylogger
    desc: Built-in Java keylogger finding hook
    if:
      type: basename
      exact: __cleave_builtin_credential_keylogger_hook__
    unless:
      - id: well-known/lib/ui/eclipse-ui/
      - id: well-known/lib/platform/eclipse-gef::gef-namespace
      - id: well-known/app/data/dbeaver::dbeaver-ui-namespace
      - id: well-known/app/ai/tool-server/quarkus-agent-mcp/
      - id: java-input-library-contexts

composite_rules:
  # These libraries use keylog/keystroke vocabulary for editors, TLS session
  # key logging, authentication, or PDF action metadata. Group them so the
  # engine hook has one bounded semantic exception rather than a growing list.
  - id: java-input-library-contexts
    desc: Java input-related library contexts
    crit: exception
    any:
      - id: well-known/lib/format/jline::jline-nano-editor-class
      - id: well-known/lib/runtime/netty::tcnative-tls-keylog-callback
      - id: well-known/lib/network/envoy::xds-tls-keylog-protobuf
      - id: well-known/lib/network/envoy::xds-tls-protobuf-schema
      # Dameng JDBC exposes uKeyLogin; the built-in matcher hits "KeyLog".
      - id: well-known/lib/data/dameng-jdbc::dameng-jdbc-driver-context
      # Tika's ISO 32000 form action is metadata, not captured input.
      - id: well-known/lib/format/apache-tika::pdf-action-extractor-class
