# The Java analyzer emits a built-in keylogger finding for generic keystroke
# vocabulary. This shared hook keeps documented UI/editor libraries from being
# classified as credential capture while leaving the underlying input traits
# and all non-library keylogging findings intact.
defaults:
  platforms: [unix, windows]
  for: [class, java_class]
  crit: suspicious
  conf: 1.0

traits:
  - id: jnativehook-log-disable-method
    desc: Declares JNativeHook log-disable method
    crit: notable
    conf: 0.96
    if:
      type: function
      exact: disableJNHLogger
  - id: jnativehook-key-listener-interface
    desc: Implements a global native-key listener
    crit: notable
    conf: 0.98
    if:
      type: value
      path: class.interfaces[*]
      regex: '^(org/jnativehook|com/github/kwhat/jnativehook)/keyboard/NativeKeyListener$'
  - id: jnativehook-registration-reference
    desc: References global native-key hook registration
    crit: notable
    conf: 0.98
    if:
      type: import
      regex: '/GlobalScreen[.]registerNativeHook$'
  - id: jvm-windows-keyboard-hook-reference
    desc: JVM SetWindowsHookEx member reference
    crit: notable
    conf: 0.96
    if:
      type: import
      regex: '(^|[./])SetWindowsHookEx[AW]?$'

  # A class that implements JNA's WinUser.LowLevelKeyboardProc is the
  # callback SetWindowsHookEx(WH_KEYBOARD_LL, ...) delivers every keystroke
  # to, system-wide. The interface is structural: the class cannot receive
  # the hook without declaring it, and renaming the class does not remove it.
  - id: jna-low-level-keyboard-proc
    desc: Class implements JNA low-level keyboard hook
    crit: notable
    conf: 0.95
    platforms: [windows]
    attack: T1056.001
    if:
      type: value
      path: class.interfaces[*]
      exact: com/sun/jna/platform/win32/WinUser$LowLevelKeyboardProc

  # IntelliJ's keymap schema names the XML elements `keyboard-shortcut` and
  # `first-keystroke`. Settings importers parse those bindings; they do not
  # install a hook or record keys.
  - id: intellij-keymap-keyboard-shortcut
    desc: IntelliJ keymap keyboard-shortcut element
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: keyboard-shortcut
  - id: intellij-keymap-first-keystroke
    desc: IntelliJ keymap first-keystroke attribute
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: first-keystroke

composite_rules:
  - id: intellij-keymap-xml-parser
    desc: IntelliJ keymap XML shortcut parser
    crit: notable
    conf: 0.95
    all:
      - id: intellij-keymap-keyboard-shortcut
      - id: intellij-keymap-first-keystroke
