defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.94

composite_rules:
  # These API sets occur in remote support and desktop UI software. Neither
  # binds a keyboard hook to recorded keystrokes or an unauthorized sink.
  - id: window-station-hook-keystate-api-profile
    desc: Window-station, hook and keyboard-state APIs
    all:
      - id: micro-behaviors/ui/window/hook::set-windows-hook
      - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state
      - id: micro-behaviors/ui/window/station::open-window-station
  - id: desktop-hook-keystate-api-profile
    desc: Desktop, hook and keyboard-state APIs
    all:
      - id: micro-behaviors/ui/window/hook::set-windows-hook
      - id: micro-behaviors/hardware/input/keyboard/poll::get-keyboard-state
      - id: micro-behaviors/ui/window/station::open-desktop-a
