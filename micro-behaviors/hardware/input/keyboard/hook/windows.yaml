defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
  attack: T1056.001
  mbc: E1056.001
traits:
  - id: dotnet-low-level-keyboard-hook-structure
    desc: KBDLLHOOKSTRUCT type name reference
    crit: notable
    conf: 0.96
    for: [pe, dll, csharp]
    if:
      type: text
      exact: KBDLLHOOKSTRUCT
  - id: windows-low-level-keyboard-hook-const
    desc: Windows low-level keyboard hook constant
    crit: notable
    conf: 0.9
    for: [source, powershell, pe, dll, c, cpp]
    if:
      type: text
      regex: '\bWH_?KEYBOARD_?LL\b'
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  - id: windows-low-level-keyboard-hook-numeric-code
    desc: SetWindowsHookEx numeric low-level hook code
    crit: notable
    conf: 0.95
    for: [source, c, cpp, csharp, rust, go]
    if:
      type: text
      regex: '(?i)\bSetWindowsHookEx(A|W)?\s*\(\s*13\s*,'
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  # The pre-WH_KEYBOARD_LL hook type. `word:` keeps the two disjoint --
  # WH_KEYBOARD_LL has a word character after WH_KEYBOARD, so it will not match
  # here. Without this atom an older-style WH_KEYBOARD keylogger had no
  # hook-type evidence at all.
  - id: windows-keyboard-hook-const
    desc: Windows keyboard hook constant
    crit: notable
    conf: 0.9
    for: [source, powershell, pe, dll]
    if:
      type: text
      word: WH_KEYBOARD
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  - id: x64-zero-thread-keyboard-hook-call-setup
    desc: x64 global hook setup with type 13
    crit: notable
    conf: 0.9
    for: [pe, dll]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      # xor r9d,r9d; callback address; module handle; lea ecx,[r9+13]; call.
      pattern: '45 (31|33) C9 48 8D 15 [4] 4C 8B C0 41 8D 49 0D FF 15'
  # MSVC also materializes WH_KEYBOARD_LL with mov ecx, 13 after the
  # callback pointer, instead of lea ecx, [r9+13].
  - id: x64-mov-imm-keyboard-ll-call
    desc: x64 hook call passes type 13
    crit: notable
    conf: 0.93
    for: [pe, dll]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: '45 (31|33) C9 48 8D 15 [4] (4C 8B C0 B9 0D 00 00 00|B9 0D 00 00 00) FF 15'
  - id: x64-gcc-keyboard-ll-call
    desc: GCC x64 hook call passes type 13
    crit: notable
    conf: 0.93
    for: [pe, dll]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: '45 (31|33) C9 B9 0D 00 00 00 48 8D 15 [4] (49 89 C0|4C 8B C0) FF 15'
composite_rules:
  # Compiled managed assemblies expose P/Invoke declarations as metadata text.
  # Requiring installation, removal, and forwarding APIs distinguishes a full
  # hook lifecycle from an isolated GUI API reference. SetClipboardViewer is
  # clipboard monitoring and deliberately does not contribute to this cluster.
  - id: low-level-windows-keyboard-hook
    desc: Low-level Windows keyboard hook setup
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/ui/window/hook::set-windows-hook
      - id: windows-low-level-keyboard-hook-const
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  # SetWindowsHookEx says only "a hook was installed" -- WH_CALLWNDPROC,
  # WH_GETMESSAGE, WH_CBT and WH_MOUSE_LL are all ordinary GUI/window plumbing.
  # Pair it with a KEYBOARD hook type before calling it keyboard interception.
  - id: windows-keyboard-hook-install
    desc: SetWindowsHookEx with a keyboard hook type
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/ui/window/hook::set-windows-hook
    any:
      - id: windows-low-level-keyboard-hook-const
      - id: windows-keyboard-hook-const
      - id: windows-low-level-keyboard-hook-numeric-code
      - id: x64-zero-thread-keyboard-hook-call-setup
      - id: x64-mov-imm-keyboard-ll-call
      - id: x64-gcc-keyboard-ll-call
      - id: x86-iat-low-level-keyboard-hook
      # This form obtains the module handle before pushing callback and
      # WH_KEYBOARD_LL; it has the same zero-thread global-hook semantics.
      - id: x86-global-low-level-keyboard-hook-setup
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
