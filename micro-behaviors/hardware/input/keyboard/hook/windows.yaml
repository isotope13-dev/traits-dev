defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
  attack: T1056.001
  mbc: E1056.001
traits:
  - id: set-windows-hook
    desc: Install Windows event hook
    crit: notable
    conf: 0.9
    downgrade:
      any:
        - id: metadata/lang/compiler/managed/
        - id: metadata/lang/compiler/managed::borland-section-code
    if:
      type: symbol
      regex: ^SetWindowsHookEx(A|W)?$
    unless:
      - id: metadata/library/generated::rust-bindings-source
  - id: unhook-windows-hook
    desc: Remove Windows event hook
    crit: notable
    conf: 0.85
    downgrade:
      any:
        - id: metadata/lang/compiler/managed/
        - id: metadata/lang/compiler/managed::borland-section-code
    if:
      type: symbol
      exact: UnhookWindowsHookEx
    unless:
      - id: metadata/library/generated::rust-bindings-source
  - id: call-next-hook-ex
    desc: Forward events in Windows hook chain
    crit: notable
    conf: 0.8
    downgrade:
      any:
        - id: metadata/lang/compiler/managed/
        - id: metadata/lang/compiler/managed::borland-section-code
    if:
      type: symbol
      exact: CallNextHookEx
    unless:
      - id: metadata/library/generated::rust-bindings-source
  - id: set-windows-hook-text
    desc: SetWindowsHookEx API string
    crit: component
    conf: 0.84
    for: [pe, dll, c, cpp, csharp, rust, archive, data]
    if:
      type: text
      substr: SetWindowsHookEx
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  # Relocated from metadata/file/format/iso::iso-setwindowshookexa (2026-08).
  # A bare "SetWindowsHookExA" run is a hook capability reference wherever it
  # is found -- there is nothing ISO-specific about the matcher, and under a
  # file-format metadata path it reported as an ISO fact on ordinary PEs
  # (yara's tests/data/ca21e1c3..., which already reports the parsed
  # `windows-hook-install`). It covers carriers cleave cannot descend, so the
  # `for:` list deliberately excludes every type that gets a symbol table.
  - id: set-windows-hook-a-container-string
    desc: SetWindowsHookExA API name in opaque content
    crit: notable
    conf: 0.97
    for: [archive, data]
    if:
      type: text
      exact: SetWindowsHookExA
  - id: unhook-windows-hook-text
    desc: UnhookWindowsHookEx API string
    crit: component
    conf: 0.84
    for: [pe, dll, c, cpp, csharp, rust, archive, data]
    if:
      type: text
      substr: UnhookWindowsHookEx
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  - id: call-next-hook-ex-text
    desc: CallNextHookEx API string
    crit: component
    conf: 0.84
    for: [pe, dll, c, cpp, csharp, rust, archive, data]
    if:
      type: text
      substr: CallNextHookEx
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  - id: hookon-hookoff-exports
    desc: HookOn and HookOff export names
    crit: component
    conf: 0.88
    for: [pe, dll]
    if:
      type: text
      regex: 'HookOn[\s\S]{0,160}HookOff|HookOff[\s\S]{0,160}HookOn'
  - id: hookon-export-text
    desc: HookOn export name
    crit: component
    conf: 0.84
    for: [pe, dll]
    if:
      type: text
      substr: HookOn
  - id: hookoff-export-text
    desc: HookOff export name
    crit: component
    conf: 0.84
    for: [pe, dll]
    if:
      type: text
      substr: HookOff
  - id: to-unicode-ex-str
    desc: ToUnicodeEx P/Invoke string reference
    crit: component
    conf: 0.85
    unless:
      - id: well-known/game/mod/
    for: [pe, rust, c, cpp, csharp, go]
    if:
      type: text
      word: ToUnicodeEx
    downgrade:
      any:
        - id: well-known/lib/web/dioxus
  - id: map-virtual-key
    desc: Map virtual key code
    crit: notable
    conf: 0.85
    for: [pe, dll, c, cpp, csharp, rust, go]
    unless:
      - id: well-known/game/mod/
    if:
      type: symbol
      regex: ^MapVirtualKey(A|W)?$
    downgrade:
      any:
        - id: well-known/lib/web/dioxus
  - id: get-keyboard-layout-str
    desc: GetKeyboardLayout P/Invoke string reference
    crit: component
    conf: 0.8
    for: [pe, c, cpp, csharp, rust, go]
    if:
      type: text
      word: GetKeyboardLayout
  - id: keybd-event
    desc: keybd_event API name reference
    crit: component
    conf: 0.8
    if:
      type: text
      word: keybd_event
  - id: python-low-level-keyboard-hook
    desc: Python installs a low-level keyboard hook
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SetWindowsHookExW?$'
  - id: python-async-key-state-poll
    desc: Python polls asynchronous Windows key state
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)GetAsyncKeyState$'
  - id: python-key-event-type
    desc: Python defines a key event type stream
    crit: notable
    conf: 0.88
    for: [python]
    if:
      type: symbol
      exact: KeyEventType
  - id: python-keyboard-dispatcher
    desc: Python exposes a keyboard event dispatcher
    crit: notable
    conf: 0.88
    for: [python]
    if:
      type: symbol
      exact: KeyboardDispatcher
    downgrade:
      any:
        - id: metadata/binary/framework::dotnet-metadata
  - id: virtual-key-label-fkeys
    desc: "Embedded func key labels (keylogger format)"
    crit: component
    conf: 0.85
    # Keylogger VK maps list many distinct F-keys. count_min alone treated
    # six copies of "[F1]" (TUI help footers) as a map — require several
    # different F-numbers within a short window.
    if:
      type: text
      regex: '\[F1\].{0,120}\[F2\].{0,120}\[F3\].{0,120}\[F4\]'
  - id: windows-low-level-keyboard-hook-const
    desc: Windows low-level keyboard hook constant
    crit: component
    conf: 0.9
    for: [source, powershell, pe, dll, c, cpp]
    if:
      type: text
      word: WH_KEYBOARD_LL
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  - id: windows-low-level-keyboard-hook-numeric-code
    desc: SetWindowsHookEx numeric low-level hook code
    crit: notable
    conf: 0.95
    for: [source, c, cpp, csharp, rust, go]
    if:
      type: text
      regex: '(?i)\bSetWindowsHookEx(A|W)?\s*\(\s*13\s*,'
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  # The pre-WH_KEYBOARD_LL hook type. `word:` keeps the two disjoint --
  # WH_KEYBOARD_LL has a word character after WH_KEYBOARD, so it will not match
  # here. Without this atom an older-style WH_KEYBOARD keylogger had no
  # hook-type evidence at all.
  - id: windows-keyboard-hook-const
    desc: Windows keyboard hook constant
    crit: component
    conf: 0.9
    for: [source, powershell, pe, dll]
    if:
      type: text
      word: WH_KEYBOARD
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  - id: virtual-key-label-modifiers
    desc: "Embedded modifier key labels"
    crit: component
    conf: 0.85
    if:
      type: text
      regex: \[(NUM-LOCK|SCROLL-LOCK|CAP-LOCK)\]
  - id: virtual-key-label-extended
    desc: "Embedded extended key labels"
    crit: component
    conf: 0.88
    if:
      type: text
      # LeftWin/RightWin are keylogger VK-map labels. Do not include
      # Enter/Backspace: those appear in ordinary TUI/CLI help strings
      # like "[Enter] select  [F1] help".
      regex: '\[(LeftWin|RightWin)\]'
  # What makes a 0..255 loop a virtual-key scan is the key-state call inside
  # it. Without that anchor this was "any C loop bounded by 255", which is the
  # shape of every palette, byte-table and ASCII loop ever written (ASC's
  # `for (int i = 32; i < 255; ++i)` builds a font glyph table) -- hence the
  # pile of per-project exclusions this rule had accumulated, all of which the
  # anchor makes unnecessary.
  - id: cpp-virtual-key-range-loop
    desc: C/C++ scans virtual-key byte range
    crit: notable
    conf: 0.88
    for: [c, cpp]
    if:
      type: text
      regex: 'for\s*\([^)]{0,60}<\s*25[56][\s\S]{0,160}Get(Async)?KeyState'
  # `count_min: 4` counted total occurrences, not distinct labels, so a file
  # repeating ONE label four times qualified. Bracketed key names are the
  # conventional notation for keystrokes in prose: Boost.Wave's preprocessor
  # test t_5_006.cpp writes `[TAB]` inline to show where tabs sit, and the same
  # goes for docs on terminal escapes, editor keybindings and CLI help.
  # The real keylogger signal is a *map* spanning the keyboard, so require
  # labels drawn from two disjoint key groups.
  - id: cpp-key-label-editing
    desc: Bracketed editing key label in C/C++
    crit: component
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '\[(BACKSPACE|RETURN)\]'
  - id: cpp-key-label-navigation
    desc: Bracketed navigation key label in C/C++
    crit: component
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '\[(TAB|ESC|ARROW [A-Z]+)\]'
  # The ofstream-append matcher moved to
  # micro-behaviors/fs/file/write/append::cpp-ofstream-append-mode. Opening a
  # file in append mode is a filesystem write, not keyboard input: naming it a
  # "keylog stream" here convicted any C++ program that appends to a log (ASC's
  # combat replay writer), and the keylog composites supply the GetAsyncKeyState
  # evidence that makes the write a keystroke log.
  - id: cpp-dll-thread-entry
    desc: C/C++ DLL starts worker thread
    crit: notable
    conf: 0.82
    for: [c, cpp]
    if:
      type: text
      regex: 'DLL_PROCESS_ATTACH[\s\S]{0,160}CreateThread'
composite_rules:
  # Compiled managed assemblies expose P/Invoke declarations as metadata text.
  # Requiring installation, removal, and forwarding APIs distinguishes a full
  # hook lifecycle from an isolated GUI API reference. SetClipboardViewer is
  # clipboard monitoring and deliberately does not contribute to this cluster.
  - id: windows-hook-chain-api-cluster
    desc: Windows event-hook lifecycle API cluster
    crit: notable
    conf: 0.96
    for: [pe, dll, c, cpp, csharp, rust, archive, data]
    all:
      - id: set-windows-hook-text
      - id: unhook-windows-hook-text
      - id: call-next-hook-ex-text
  # Keeps the id the keylog composite already references. These labels are
  # only a supporting fragment: editor grammars and terminal tables also map
  # editing and navigation names, so the hostile keylogger composite supplies
  # the actual keyboard polling and append-write behavior.
  - id: cpp-key-label-map-uppercase
    desc: Bracketed editing and navigation key labels
    crit: component
    conf: 0.9
    for: [c, cpp]
    all:
      - id: cpp-key-label-editing
      - id: cpp-key-label-navigation
  - id: virtual-key-label-map
    desc: Embedded virtual key label map
    crit: suspicious
    conf: 0.85
    all:
      - id: virtual-key-label-fkeys
    any:
      - id: virtual-key-label-modifiers
      - id: virtual-key-label-extended
  - id: windows-hook-lifecycle
    desc: Windows hook install and chain-management APIs
    crit: notable
    conf: 0.85
    all:
      - id: windows-hook-install
    any:
      - id: call-next-hook-ex
      - id: unhook-windows-hook
      - id: call-next-hook-ex-text
      - id: unhook-windows-hook-text
      - id: hookon-hookoff-exports
  - id: windows-hook-install
    desc: Windows hook install API
    crit: notable
    conf: 0.86
    any:
      - id: set-windows-hook
      - id: set-windows-hook-text
  - id: windows-hook-chain-management
    desc: Windows hook chain management API
    crit: component
    conf: 0.86
    any:
      - id: call-next-hook-ex
      - id: unhook-windows-hook
      - id: call-next-hook-ex-text
      - id: unhook-windows-hook-text
      - id: hookon-hookoff-exports
  - id: hookon-hookoff-export-pair
    desc: HookOn and HookOff export pair
    crit: component
    conf: 0.88
    all:
      - id: hookon-export-text
      - id: hookoff-export-text
  - id: low-level-windows-keyboard-hook
    desc: Low-level Windows keyboard hook setup
    crit: notable
    conf: 0.9
    all:
      - id: set-windows-hook
      - id: windows-low-level-keyboard-hook-const
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  # SetWindowsHookEx says only "a hook was installed" -- WH_CALLWNDPROC,
  # WH_GETMESSAGE, WH_CBT and WH_MOUSE_LL are all ordinary GUI/window plumbing.
  # Pair it with a KEYBOARD hook type before calling it keyboard interception.
  - id: windows-keyboard-hook-install
    desc: SetWindowsHookEx with a keyboard hook type
    crit: notable
    conf: 0.92
    all:
      - id: set-windows-hook
    any:
      - id: windows-low-level-keyboard-hook-const
      - id: windows-keyboard-hook-const
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
