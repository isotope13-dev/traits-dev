defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
- id: go-x86-hook-id13-argument-vector
  desc: Go x86 builds hook-ID-13 argument vector
  crit: notable
  conf: 0.94
  if:
    type: hex
    section: .text
    pattern: 'C7 00 0D 00 00 00 8B 4C 24 ?? 89 48 04 C7 40 08 00 00 00 00 C7 40 0C 00 00 00 00 [0-16] 89 44 24 ?? C7 44 24 ?? 04 00 00 00 C7 44 24 ?? 04 00 00 00 E8'
- id: go-x86-hook-id13-argument-vector-upx0
  desc: Go x86 builds hook-ID-13 argument vector
  crit: notable
  conf: 0.94
  if:
    type: hex
    section: UPX0
    pattern: 'C7 00 0D 00 00 00 8B 4C 24 ?? 89 48 04 C7 40 08 00 00 00 00 C7 40 0C 00 00 00 00 [0-16] 89 44 24 ?? C7 44 24 ?? 04 00 00 00 C7 44 24 ?? 04 00 00 00 E8'
composite_rules:
- id: go-x86-keyboard-hook-profile
  desc: Go hook vector and keyboard event-handler code
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/hardware/input/event::x86-keydown-message-branches
  - id: micro-behaviors/ui/window/hook::set-windows-hook-text
  any:
  - id: go-x86-hook-id13-argument-vector
  - id: go-x86-hook-id13-argument-vector-upx0
