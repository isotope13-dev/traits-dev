defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  # Bind the indirect call operand to the actual import. An immediate 13
  # before an unrelated WinAPI call cannot establish a keyboard hook.
  - id: x86-iat-low-level-keyboard-hook
    desc: x86 SetWindowsHookEx call passes type 13
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule x86_iat_keyboard_hook {
          strings:
            $setup = { 5? 5? 68 ?? ?? ?? ?? 6A 0D FF 15 ?? ?? ?? ?? }
          condition:
            pe.is_32bit() and
            for any i in (1..#setup) : (
              for any s in (0..pe.number_of_sections-1) : (
                pe.sections[s].name == ".text" and
                @setup[i] >= pe.sections[s].raw_data_offset and
                @setup[i]+15 <= pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size and
                (uint32(@setup[i]+11) == pe.image_base + pe.import_rva("USER32.dll", "SetWindowsHookExA") or
                 uint32(@setup[i]+11) == pe.image_base + pe.import_rva("USER32.dll", "SetWindowsHookExW"))
              )
            )
        }
