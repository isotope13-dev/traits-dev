defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, c, cpp]
  mbc: B0015
  attack: T1056.001
  crit: suspicious

traits:
- id: x11-grab
  desc: X11 global key grab
  crit: notable
  conf: 0.65
  platforms:
  - linux
  - macos
  for: [elf, macho, c, cpp]
  if:
    type: symbol
    exact: XGrabKey
  unless:
  - type: basename
    regex: ^lib.*\.(so|dylib)(\.\d+)*$
  - type: text
    substr: xorg
  - id: well-known/lib/platform/at-spi2-core::source-context
