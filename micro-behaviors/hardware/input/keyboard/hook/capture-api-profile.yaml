defaults:
  platforms:
  - windows
  for:
  - elf
  - macho
  - pe
  - c
  - cpp

composite_rules:
  - id: windows-keyboard-hook-input-api-profile
    desc: Keyboard-hook and input API references
    crit: notable
    conf: 0.9
    for:
    - c
    - cpp
    all:
    - id: micro-behaviors/hardware/input/keyboard/hook::windows-keyboard-hook-install
    any:
    - id: micro-behaviors/hardware/input/raw::windows-raw-input
    - id: micro-behaviors/hardware/input/keyboard/poll::polling-keyboard-api-cluster
    - id: micro-behaviors/hardware/input/keyboard/label::virtual-key-label-map
    unless:
    - id: well-known/lib
