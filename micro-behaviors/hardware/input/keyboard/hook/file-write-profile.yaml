# Co-occurrence does not bind the write buffer to the hook callback, establish
# a valid output handle, or show concealed recording. Keep the full former
# population as a capability; hidden-file recording retains its objective rule.
defaults:
  platforms: [windows]
  for: [c]

composite_rules:
  - id: numeric-low-level-keyboard-hook-file-write-profile
    desc: Low-level keyboard hook and WriteFile calls
    crit: notable
    conf: 0.98
    all:
      - id: windows-low-level-keyboard-hook-numeric-code
      - id: micro-behaviors/fs/write/file/handle::write-file-source
    near_bytes: 4096
