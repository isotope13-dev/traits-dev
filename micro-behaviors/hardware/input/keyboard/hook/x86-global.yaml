defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
traits:
  # Zero thread ID, current-module handle, callback pointer, hook type 13,
  # then the indirect call. This is WH_KEYBOARD_LL setup, not a GUI hook name.
  - id: x86-global-low-level-keyboard-hook-setup
    desc: x86 global type-13 keyboard hook call setup
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: '(31|33) FF [0-24] 57 57 FF 15 [4] 50 68 [4] 6A 0D FF 15 [4]'
  - id: x86-global-wh-keyboard-install
    desc: x86 global WH_KEYBOARD installation
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: CODE
      pattern: '6A 00 A1 [4] 50 B8 [4] 50 6A 02 E8 [4] A3'
composite_rules:
  - id: global-keyboard-hook-ipc-forwarding
    desc: Global keyboard hook with mapped-window IPC
    crit: notable
    conf: 0.98
    all:
      - id: x86-global-wh-keyboard-install
      - id: micro-behaviors/communications/ipc/message::x86-indirect-window-event-message
      - id: micro-behaviors/communications/ipc/file-mapping::open-file-mapping-a
      - id: micro-behaviors/ui/window/hook::set-windows-hook
      - id: micro-behaviors/os/message/queue::post-message
