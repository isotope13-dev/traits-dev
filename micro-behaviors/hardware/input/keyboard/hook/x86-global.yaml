defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-global-wh-keyboard-install
    desc: x86 global WH_KEYBOARD installation
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: CODE
      pattern: '6A 00 A1 [4] 50 B8 [4] 50 6A 02 E8 [4] A3'
composite_rules:
  - id: global-keyboard-hook-ipc-forwarding
    desc: Global keyboard hook with mapped-window IPC
    crit: notable
    conf: 0.98
    all:
      - id: x86-global-wh-keyboard-install
      - id: micro-behaviors/communications/ipc/message::x86-indirect-window-event-message
      - id: micro-behaviors/communications/ipc/file-mapping::open-file-mapping-a
      - id: micro-behaviors/ui/window/hook::set-windows-hook
      - id: micro-behaviors/os/message/queue::post-message
