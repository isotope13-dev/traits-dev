defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for:
    - java
    - class
traits:
  - id: java-robot-keypress
    desc: Usage of keyPress in Java
    if:
      type: text
      word: keyPress
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: micro-behaviors/hardware/input/robot::jvm-awt-key-press
  - id: java-robot-keyrelease
    desc: Usage of keyRelease in Java
    if:
      type: text
      word: keyRelease
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: micro-behaviors/hardware/input/robot::jvm-awt-key-release
