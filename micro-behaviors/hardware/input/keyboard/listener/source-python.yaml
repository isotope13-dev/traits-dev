defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  mbc: B0015
  attack: T1056.001
  crit: notable

traits:
  - id: import-keyboard
    desc: import keyboard statement
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: import keyboard
  - id: keyboard-on-press-dup
    desc: keyboard.on_press function
    crit: notable
    conf: 0.6
    if:
      type: string_literal
      substr: keyboard.on_press
  - id: keyboard-on-release
    desc: keyboard.on_release function
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: keyboard.on_release
  - id: keyboard-wait
    desc: keyboard.wait function
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: keyboard.wait
  - id: keyboard-hook
    desc: keyboard.hook function
    crit: notable
    conf: 0.6
    if:
      type: string_literal
      substr: keyboard.hook
  - id: keyboard-record
    desc: keyboard.record function
    crit: notable
    conf: 0.6
    if:
      type: string_literal
      substr: keyboard.record
  # keyboard-block-key-call moved to
  # micro-behaviors/hardware/input/block::keyboard-block-key-call — the matcher
  # detects input *suppression*, which is not keystroke capture.
  - id: python-keydown-handler
    desc: KeyDown event handler registration
    conf: 0.85
    if:
      type: string_literal
      regex: \.KeyDown\s*=
composite_rules:
  - id: python-keyboard
    desc: "Python keyboard event interfaces"
    conf: 0.8
    all:
      - id: micro-behaviors/hardware/input/keyboard/listener::import-keyboard
    any:
      - id: micro-behaviors/hardware/input/keyboard/listener::keyboard-on-press-dup
      - id: micro-behaviors/hardware/input/keyboard/listener::keyboard-on-release
      - id: micro-behaviors/hardware/input/keyboard/listener::keyboard-hook
      - id: micro-behaviors/hardware/input/keyboard/listener::keyboard-record
