defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: component

traits:
  - id: document-key-token-pipeline
    desc: Document key handler forwards formatted tokens
    # Bind the event, formatter result and guarded consumer. Facts alone
    # cannot distinguish this pipeline from unrelated calls in a bundle.
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: (member_expression
            object: (identifier) @document
            property: (property_identifier) @listen)
          arguments: (arguments
            (string (string_fragment) @event)
            (arrow_function
              parameters: (formal_parameters (identifier) @param)
              body: (statement_block
                (lexical_declaration
                  (variable_declarator
                    name: (identifier) @token
                    value: (call_expression
                      arguments: (arguments . (identifier) @input .))))
                (if_statement
                  condition: (parenthesized_expression (identifier) @guard)
                  consequence: (expression_statement
                    (call_expression
                      arguments: (arguments . (identifier) @queued .))))))
            (true))
          (#eq? @document "document")
          (#eq? @listen "addEventListener")
          (#match? @event "^key(down|up|press)$")
          (#eq? @param @input)
          (#eq? @token @guard)
          (#eq? @token @queued))
