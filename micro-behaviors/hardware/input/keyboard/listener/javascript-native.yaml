# JavaScript wrappers around native global keyboard listeners.
defaults:
  platforms: [windows, macos, linux]
  for: [javascript, typescript]
  attack: T1056.001
  mbc: B0015

traits:
  - id: global-keyboard-listener-description
    desc: Global keyboard listener description phrase
    crit: notable
    conf: 0.95
    if:
      type: text
      # A remote command named keylogger does not implement a listener.
      regex: '(?i)global\s+(keyboard|key)\s+listener'
