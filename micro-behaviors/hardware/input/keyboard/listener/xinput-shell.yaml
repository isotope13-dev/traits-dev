defaults:
  platforms: [linux]
  for: [shell]
  crit: notable
  conf: 0.97

traits:
  - id: shell-xinput-event-monitor
    desc: Shell invokes XInput event monitoring
    if:
      type: symbol
      kind: call
      regex: '(^|/)xinput$'
      arg:
        index: 0
        kind: identifier
        name_regex: '^test(-xi2)?$'
  - id: shell-xinput-quoted-event-monitor
    desc: Shell invokes quoted XInput event monitoring
    if:
      type: symbol
      kind: call
      regex: '(^|/)xinput$'
      arg:
        index: 0
        kind: string
        regex: '^test(-xi2)?$'
