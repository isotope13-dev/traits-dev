defaults:
  platforms: [unix, windows]
  for: [class]
traits:
  - id: jnativehook-key-text-reference
    desc: References native key-event text conversion
    crit: notable
    conf: 0.98
    if:
      type: import
      regex: '/NativeKeyEvent[.]getKeyText$'
  - id: jvm-tounicode-member-reference
    desc: JVM ToUnicode member reference
    crit: notable
    conf: 0.96
    if:
      type: import
      exact: ToUnicode
  - id: jvm-character-input-reference
    desc: JVM key event character accessor reference
    crit: notable
    conf: 0.94
    if:
      type: import
      exact: getKeyChar
