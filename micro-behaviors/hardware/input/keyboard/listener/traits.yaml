defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, c, cpp]
  mbc: B0015
  attack: T1056.001
  crit: suspicious

traits:
- id: pynput-import-keyboard
  desc: from pynput import keyboard
  conf: 0.5
  if:
    type: text
    substr: from pynput import keyboard
- id: pynput-keyboard-import
  desc: from pynput.keyboard import
  conf: 0.5
  if:
    type: text
    substr: from pynput.keyboard
- id: keycode-camel
  desc: Reads JS keyCode of keypress
  # The identifier alone is the DOM property every UI toolkit exposes
  # (Angular CDK, Monaco, video.js, the `keycode` package). It becomes
  # suspicious only as a leg of jxa-keystroke, next to an automation call.
  crit: notable
  conf: 0.7
  for: [javascript]
  if:
    type: symbol
    exact: keyCode
# The Node AppleScript library atoms that used to live here matched a bare
# library reference and nothing about keystrokes, so they convicted every
# bundle that ships `run-applescript` (the `open`/`default-browser` dependency
# chain) as keylogging. They are now neutral capabilities under
# micro-behaviors/process/create/script/osascript, referenced below.
composite_rules:
- id: python-pynput
  desc: Python pynput keyboard listener
  conf: 0.7
  any:
  - id: micro-behaviors/hardware/input/keyboard/listener::pynput-import-keyboard
  - id: micro-behaviors/hardware/input/keyboard/listener::pynput-keyboard-import
