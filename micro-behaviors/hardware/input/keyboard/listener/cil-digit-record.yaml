defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: cil-digit-key-event-record
    desc: CIL digit-key event to writer code
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule cil_digit_key_event_record {
          strings:
            $key = "get_KeyValue" ascii fullword
            $digit = "IsDigit" ascii fullword
            $writer = "StreamWriter" ascii fullword
            $write = "Write" ascii fullword
            $record = {
              (03|04) 6F ?? ?? ?? 0A D1 0A 06 28 ?? ?? ?? 0A
              2C ?? 02 7B ?? ?? ?? 04 06 6F ?? ?? ?? 0A
            }
          condition:
            uint16(0) == 0x5a4d and all of them
        }
