# Python Keyboard Input Micro-behaviors
# Detects keyboard input processing capabilities
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
traits:
  - id: pynput-keyboard-import
    desc: Python imports pynput keyboard listener
    crit: notable
    conf: 0.95
    if:
      type: import
      regex: '^pynput\.keyboard$'

  - id: pynput-key-space
    desc: "pynput Key.space reference"
    conf: 0.8
    if:
      type: text
      substr: "Key.space"
  - id: pynput-key-enter
    desc: "pynput Key.enter reference"
    conf: 0.8
    if:
      type: text
      substr: "Key.enter"
  - id: pynput-key-shift
    desc: "pynput Key.shift reference"
    conf: 0.8
    if:
      type: text
      regex: "Key\\.shift"
  - id: pynput-key-esc
    desc: "pynput Key.esc reference"
    conf: 0.8
    if:
      type: text
      substr: "Key.esc"
  - id: pynput-listener-constructor
    desc: pynput keyboard listener constructor
    conf: 0.9
    if:
      type: text
      # The pynput API constructs its listener with keyword callbacks
      # (Listener(on_press=..., on_release=...)). Requiring that signature
      # keeps this off every unrelated class merely named Listener (Twisted
      # stream listeners, GUI event listeners, test doubles).
      regex: '\bListener\s*\([^)]{0,200}?\bon_(press|release)\s*='
  - id: pynput-suppress-event-call
    desc: pynput listener suppresses input events
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\.suppress_event\s*\('
