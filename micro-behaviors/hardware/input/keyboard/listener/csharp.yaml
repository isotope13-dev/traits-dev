# Managed helpers may represent global input with a machine-readable event
# schema. The schema is a neutral protocol; capture intent is inferred only
# when it accompanies a complete low-level Windows hook lifecycle.
defaults:
  for: [pe, dll, csharp]
  platforms: [windows]
  crit: notable
  attack: T1056.001
  mbc: E1056.001

traits:
  - id: json-keyboard-action-event
    desc: Structured keyboard action event schema
    conf: 0.98
    if:
      type: text
      substr: '{"type":"keyboard","action":"'
