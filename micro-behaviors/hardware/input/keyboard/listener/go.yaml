# Go source keylogger reference detection.
# Detects Go struct fields or imports that reference a keylogger module,
# indicating the code manages or coordinates keystroke logging.
defaults:
  crit: notable
  for: [go]
  platforms: [windows, linux, macos]
  attack: T1056.001
  mbc: E1056.001

traits:
  - id: keylogger-struct-field
    desc: Keylogger module reference in struct field
    conf: 0.92
    if:
      type: text
      regex: '\\bKeylogger\\s+\\*keylogger\\.'
  - id: keylogger-package-import
    desc: References a Go keyboard-event capture package
    conf: 0.95
    for: [go, go.mod]
    if:
      type: text
      substr: '/keylogger'
    unless:
      # Safety rails and policy prose forbid keyloggers ("Do NOT use ...
      # keyloggers"); that prohibition is not a package reference.
      - type: text
        regex: '(?i)\b(do\s+not|never|don''?t)\s+use\b[^.]{0,200}keylogger'

composite_rules:
  - id: go-keylogger-reference
    desc: Go source references keylogger module
    conf: 0.93
    any:
      - id: keylogger-struct-field
      - id: keylogger-package-import
