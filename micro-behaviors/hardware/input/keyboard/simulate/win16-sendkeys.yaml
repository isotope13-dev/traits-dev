# VB3 SendKeys in 16-bit programs. Key names keep their braces as plain text
# in the string table, so the match needs no compiler-specific structure.
defaults:
  for: [ne]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: win16-sendkeys-key-name
    desc: Win16 program sends named keystrokes
    if:
      type: text
      case_insensitive: true
      regex: '\^?\{(tab|enter)\}'
