defaults:
  platforms: [windows]
  for: [vbs, javascript, powershell, csharp]
  crit: notable
  conf: 0.9

traits:
  - id: sendkeys-ctrl-v-paste
    desc: Simulates Ctrl+V paste via SendKeys
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(\.SendKeys\b|SendKeys\]::Send(Wait)?)\s*\(?\s*["'']\^v["'']'
