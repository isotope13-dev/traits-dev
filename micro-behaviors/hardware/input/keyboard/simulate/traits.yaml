defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, c, cpp]
  mbc: B0015
  attack: T1056.001
  crit: suspicious

traits:
- id: key-down-lower
  desc: AppleScript key down phrase
  crit: notable
  conf: 0.7
  platforms: [macos]
  for: [javascript, applescript, shell]
  size_max: 10485760
  if:
    type: text
    regex: '(?is)["'']System Events["''][\s\S]{0,160}\bkey down\b'
  not:
  - regex: (?i)\bevent\b.{0,20}key down
  - regex: (?i)holding a key down
  - regex: (?i)mouse button.{0,40}key down
  - regex: (?i)\b(ctrl|shift|alt)\s+key down\b
  - regex: (?i)Page\.keyboardDown.{0,80}key down
  unless:
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: well-known/tool/reverse-engineering/resource-hacker/
  - id: well-known/dual-use/remote-admin/rdesktop/
  - id: well-known/lib/platform/browser-automation/automation-context::playwright-trace-viewer-bundle
- id: key-down-title
  desc: AppleScript Key Down phrase
  crit: notable
  conf: 0.7
  platforms: [macos]
  for: [javascript, applescript, shell]
  if:
    type: text
    regex: '(?s)["'']System Events["''][\s\S]{0,160}Key Down'
  unless:
  - id: well-known/lib/platform/browser-automation/automation-context::playwright-trace-viewer-bundle
- id: key-down-upper
  desc: AppleScript KEY DOWN phrase
  crit: notable
  conf: 0.7
  platforms: [macos]
  for: [javascript, applescript, shell]
  if:
    type: text
    regex: '(?s)["'']System Events["''][\s\S]{0,160}KEY DOWN'
  unless:
  - id: well-known/lib/platform/browser-automation/automation-context::playwright-trace-viewer-bundle
composite_rules:
- id: key-down-phrase
  desc: key down phrase (case variants)
  crit: component
  platforms: [macos]
  for: [javascript, applescript, shell]
  any:
  - id: micro-behaviors/hardware/input/keyboard/simulate::key-down-lower
  - id: micro-behaviors/hardware/input/keyboard/simulate::key-down-title
  - id: micro-behaviors/hardware/input/keyboard/simulate::key-down-upper
  unless:
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: metadata/file/string/artifact::linux-syscall-note-license
  - id: metadata/lang/upstream::linux-kernel-header-source-path
  - id: well-known/dual-use/remote-admin/rdesktop/
  - id: well-known/lib/platform/openjfx::openjfx-source-tree
  - id: well-known/lib/platform/openjfx::openjfx-tooling-tree
- id: applescript-keystroke-automation
  desc: "AppleScript keyboard automation"
  crit: suspicious
  conf: 0.95
  platforms: [macos]
  for: [javascript, shell, applescript]
  all:
  - id: micro-behaviors/process/create/script/osascript::osascript-keyword
  - id: micro-behaviors/process/create/script/automation::system-events-phrase
  - id: micro-behaviors/hardware/input/keyboard/label::applescript-keywords
- id: jxa-keystroke-automation
  desc: "JXA keyboard automation references"
  crit: suspicious
  conf: 0.95
  platforms: [macos]
  for: [javascript]
  all:
  - id: micro-behaviors/process/create/script/automation::application-constructor
  - id: micro-behaviors/process/create/script/automation::system-events-phrase
  - id: micro-behaviors/hardware/input/keyboard/label::jxa-keystroke-keywords
