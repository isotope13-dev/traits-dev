defaults:
  platforms: [windows]
  for: [oledoc]
  crit: notable
  conf: 0.9

traits:
  # OleDoc leaves extracted-string index empty (strings=0), so type:text
  # never sees VBA API names. type:raw is rejected for plain ASCII by
  # policy; hex matches the same run in the compound-file bytes.
  - id: vba-sendkeys
    desc: VBA sends simulated keystrokes
    if:
      type: hex
      pattern: "53 65 6E 64 4B 65 79 73"
