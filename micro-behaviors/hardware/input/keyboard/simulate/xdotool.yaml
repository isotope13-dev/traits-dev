defaults:
  crit: notable
  platforms: [linux]
  for: [binaries, scripts]
  attack: T1059.004
traits:
  # xdotool input injection is a complete, analyst-relevant capability. It is
  # notable on its own; hostile intent belongs in composites that add RAT,
  # credential-theft, or other attack context.
  - id: xdotool-key-injection
    desc: xdotool keystroke injection command reference
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(?i)\b(/usr/bin/)?xdotool\s+(key|type|keydown|keyup)\b'
  - id: ydotool-injection
    desc: ydotool Wayland input injection
    # Input injection is a capability used by documented desktop automation;
    # hostile intent requires additional objective-level context.
    conf: 0.9
    if:
      type: text
      regex: '\bydotool\s+(key|type|click|mousemove)\b'
    unless:
      - id: well-known/app/productivity/password-store::passmenu-example-helper
      - id: well-known/app/system/lnxlink::lnxlink-source-module
  - id: node-xdotool-input
    desc: Node invokes xdotool for desktop input
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)\bexecFile(Async)?\s*\(\s*["'']xdotool["'']'
