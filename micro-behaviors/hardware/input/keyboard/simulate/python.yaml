defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.82

traits:
  - id: pynput-controller-import
    desc: Python imports pynput keyboard Controller
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      kind: import
      regex: '\bfrom\s+pynput\.keyboard\s+import[\s\S]{0,160}\bController\b'

  - id: keyboard-type-text
    desc: Synthesizes keyboard text
    if:
      type: text
      regex: '\bkeyboard\.type_text\s*\('

  - id: keyboard-backspace
    desc: Synthesizes keyboard backspace
    conf: 0.78
    if:
      type: text
      regex: '\bkeyboard\.backspace\s*\('

  - id: keyboard-press-enter
    desc: Synthesizes enter keypress
    conf: 0.78
    if:
      type: text
      regex: '\bkeyboard\.press_enter\s*\('

  # pyautogui drives the same outcome through module-level functions
  # (typewrite/write, press, hotkey, keyDown/keyUp) on whatever receiver the
  # caller bound: the plain module or its conventional `pya` alias. Matching
  # the call target instead of source text keeps this off comments and string
  # constants that merely mention these verbs.
  - id: pyautogui-keyboard-output
    desc: Synthesizes keystrokes through pyautogui
    conf: 0.86
    if:
      type: symbol
      kind: call
      regex: '^(pyautogui|pya)\.(typewrite|write|press|hotkey|keyDown|keyUp)$'

composite_rules:
  - id: python-keyboard-text-injection
    desc: Python keyboard text injection
    crit: notable
    conf: 0.86
    any:
      - id: keyboard-type-text
      - id: keyboard-backspace
      - id: keyboard-press-enter
