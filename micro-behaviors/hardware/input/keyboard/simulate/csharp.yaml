# Synthesized keystrokes from C#: a live keybd_event P/Invoke plus
# MapVirtualKey to turn virtual keys into scan codes. Controller-to-keyboard
# mappers, macro tools and remote-desktop clients are built on exactly this
# pair; it injects input into whatever window has focus (UIPI still blocks
# elevated targets). Capturing keys is keyboard/poll or hook, not this.
defaults:
  for: [csharp]
  platforms: [windows]

composite_rules:
  - id: csharp-keyboard-simulation
    desc: C# keyboard input injection via P/Invoke
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/hardware/input/keyboard/poll::keybd-event-pinvoke
      - id: micro-behaviors/hardware/input/keyboard/poll::map-virtual-key-pinvoke
