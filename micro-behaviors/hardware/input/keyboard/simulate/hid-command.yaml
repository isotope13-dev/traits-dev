# HID output is an input-synthesis capability, not keystroke collection.
defaults:
  platforms: [windows]
  crit: notable
  conf: 0.97

traits:
  - id: digispark-run-shortcut
    desc: Digispark sends Windows Run shortcut
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: DigiKeyboard.sendKeyStroke
      args:
        - index: 0
          kind: identifier
          name: KEY_R
        - index: 1
          kind: identifier
          name: MOD_GUI_LEFT

  - id: digispark-enter-keystroke
    desc: Digispark sends Enter keystroke
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: DigiKeyboard.sendKeyStroke
      arg:
        index: 0
        kind: identifier
        name: KEY_ENTER

  - id: digispark-download-eval-output
    desc: Digispark types DownloadString evaluation
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      regex: '^DigiKeyboard\.print(ln)?$'
      arg:
        index: 0
        kind: string
        regex: '(?i)^p(owershell|wsh).{0,99}I(EX|nvoke-Expression) \(.{1,80}\)\.DownloadString\('

  - id: keycode-run-shortcut
    desc: Keyboard sends GUI-R keycodes
    for: [python]
    if:
      # The call projection represents Keycode members as opaque expressions;
      # inspect the call node to bind both keys without matching comments.
      type: tree-sitter
      kind: call
      regex: '\.send\(\s*Keycode\.(GUI|WINDOWS),\s*Keycode\.R\s*\)'

  - id: keycode-enter-keystroke
    desc: Keyboard send call uses Enter keycode
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '\.send\(\s*Keycode\.ENTER\s*\)'

  - id: python-download-eval-text-output
    desc: Keyboard layout types DownloadString eval
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.write$'
      receiver:
        from:
          call: '(^|\.)KeyboardLayout(US)?$'
      arg:
        index: 0
        kind: string
        regex: '(?i)^p(owershell|wsh).{0,99}I(EX|nvoke-Expression) \(.{1,80}\)\.DownloadString\('

  - id: ducky-run-shortcut
    desc: Keyboard script sends Windows Run shortcut
    for: [text, powershell]
    if:
      type: text
      regex: '(?im)^[ \t]*(GUI|WINDOWS)[ \t]+r[ \t]*\r?$'

  - id: ducky-enter-keystroke
    desc: Keyboard script sends Enter keystroke
    for: [text, powershell]
    if:
      type: text
      regex: '(?m)^[ \t]*ENTER[ \t]*\r?$'

  - id: ducky-iex-download-output
    desc: Keyboard script types IEX DownloadString
    for: [text, powershell]
    if:
      type: text
      regex: '(?im)^STRING(LN)? .{0,180}IEX\s*\([^;\r\n]{1,80}\)\.DownloadString\('

  - id: ducky-powershell-command-output
    desc: Keyboard script types PowerShell command
    for: [text, powershell]
    if:
      type: text
      regex: '(?im)^STRING(LN)?[ \t]+(powershell|pwsh)(\.exe)?\b'

  - id: ducky-invoke-expression-download-output
    desc: Keyboard script types Invoke-Expression fetch
    for: [text, powershell]
    if:
      type: text
      regex: '(?im)^STRING(LN)? .{0,99}Invoke-Expression \([^;\r\n]{1,80}\)\.DownloadString\('

composite_rules:
  - id: ducky-download-eval-output
    desc: Keyboard script types DownloadString eval
    for: [text, powershell]
    near_bytes: 1
    all:
      - id: ducky-powershell-command-output
    any:
      - id: ducky-iex-download-output
      - id: ducky-invoke-expression-download-output

  - id: run-dialog-shortcut-output
    desc: Synthesizes the Windows Run shortcut
    for: [c, cpp, python, text, powershell]
    any:
      - id: digispark-run-shortcut
      - id: keycode-run-shortcut
      - id: ducky-run-shortcut

  - id: enter-key-output
    desc: Synthesizes the Enter key
    for: [c, cpp, python, text, powershell]
    any:
      - id: digispark-enter-keystroke
      - id: keycode-enter-keystroke
      - id: ducky-enter-keystroke

  - id: download-eval-command-output
    desc: Keyboard output carries download-eval text
    for: [c, cpp, python, text, powershell]
    any:
      - id: digispark-download-eval-output
      - id: python-download-eval-text-output
      - id: ducky-download-eval-output
