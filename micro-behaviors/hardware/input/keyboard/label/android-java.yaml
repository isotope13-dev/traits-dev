defaults:
  platforms: [android]
  for: [java]
  attack: T1056.001
  mbc: F0006

traits:
  - id: android-keylogger-db-name
    desc: Android keylogger database name
    crit: notable
    conf: 0.9
    if:
      type: literal
      exact: keyLOGgerDB
  - id: android-appwise-keyevents-table
    desc: Android appwise key events table
    crit: notable
    conf: 0.88
    if:
      type: literal
      exact: Appwise_KeyEvents
  - id: android-saved-keyevents-table
    desc: Android saved key events table
    crit: notable
    conf: 0.88
    if:
      type: literal
      exact: Saved_Appwise_KeyEvents
composite_rules:
  - id: android-keyevents-table
    desc: Android key events table source
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/hardware/input/keyboard/label::android-appwise-keyevents-table
      - id: micro-behaviors/hardware/input/keyboard/label::android-saved-keyevents-table
