defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: enter-key-line-record
    desc: Enter key label with record line ending
    crit: notable
    conf: 0.95
    if:
      type: hex
      # Native record labels also reside in writable initialized data.
      section: any
      pattern: "3C 45 6E 74 65 72 3E 0D 0A 00"
