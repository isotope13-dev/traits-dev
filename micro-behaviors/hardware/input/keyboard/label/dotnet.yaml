defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: dotnet-enter-key-line-record
    desc: UTF-16 Enter key record followed by CRLF
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: .text
      pattern: "5B 00 45 00 4E 00 54 00 45 00 52 00 5D 00 0D 00 0A 00"
composite_rules:
  - id: dotnet-keylog-recording-context
    desc: Keylogger label or keystroke line-record format
    crit: notable
    conf: 0.9
    any:
      - id: keylogger-string
      - id: keylog-record-label
      - id: dotnet-enter-key-line-record
