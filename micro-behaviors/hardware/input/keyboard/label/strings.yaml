defaults:
  platforms:
  - linux
  - macos
  - windows
  for: [elf, macho, pe]
traits:
- id: linux-input-device
  desc: Reads raw Linux input event devices
  crit: notable
  conf: 0.75
  platforms:
  - linux
  for: [elf]
  if:
    type: text
    regex: /dev/input/event[0-9]+
- id: dotnet-enable-keylogger-flag
  desc: .NET EnableKeylogger feature flag
  crit: notable
  conf: 0.9
  for: [pe, dll]
  platforms: [windows]
  if:
    type: text
    word: EnableKeylogger
- id: keylogger-string
  desc: Contains keylogger label or routine identifier
  # JVM RATs carry the same labels in class constant pools (rat/multi/java).
  for: [elf, macho, pe, class, java, kotlin]
  crit: notable
  conf: 0.8
  mbc: B0015
  attack: T1056.001
  if:
    type: text
    # A bare `keyLog` is commonly a TLS session-key logging field. Require an
    # explicit keylogger/keylogging label or a keylog lifecycle routine.
    # Go symbols commonly concatenate the lifecycle verb with `Keylogger`.
    regex: '(?i)\b((start|stop|init|run)[_-]?keylog(ger|ging)?|keylog(ger|ging))\b'
  unless:
  - type: path
    substr: Microsoft.Graph.Users.nupkg/bin/Microsoft.Graph.Users.private.dll
  - id: well-known/dual-use/transfer/rclone::rclone-package-path
  - id: well-known/lib/data/cloud-jdbc::jdbc-sdk-bundle-context
- id: init-keylogger-sym
  desc: Keylogger init routine symbol
  crit: suspicious
  conf: 0.8
  if:
    type: symbol
    regex: init_keylogger
- id: special-key-name-a--capslock
  desc: Special key name label (CAPSLOCK)
  crit: notable
  conf: 0.7
  if:
    type: text
    word: CAPSLOCK
- id: special-key-name-a--scrollock
  desc: Special key name label (SCROLLOCK)
  crit: notable
  conf: 0.7
  if:
    type: text
    word: SCROLLOCK
- id: special-key-name-a--numlock
  desc: Special key name label (NUMLOCK)
  crit: notable
  conf: 0.7
  if:
    type: text
    word: NUMLOCK
- id: special-key-name-b--printscreen
  desc: Special key name label (PRINTSCREEN)
  crit: notable
  conf: 0.7
  if:
    type: text
    word: PRINTSCREEN
- id: special-key-name-b--backspace
  desc: Special key name label (BACKSPACE)
  crit: notable
  conf: 0.7
  if:
    type: text
    word: BACKSPACE
composite_rules:
- id: special-key-name-a
  desc: Lock key name labels
  crit: component
  conf: 0.7
  any:
  - id: special-key-name-a--capslock
  - id: special-key-name-a--scrollock
  - id: special-key-name-a--numlock
- id: special-key-name-b
  desc: Action key name labels
  crit: component
  conf: 0.7
  any:
  - id: special-key-name-b--printscreen
  - id: special-key-name-b--backspace
- id: special-key-name
  desc: Lock and action key name labels
  crit: notable
  conf: 0.7
  all:
  - id: special-key-name-a
  - id: special-key-name-b
  unless:
  - id: well-known/app/enterprise/delinea::centrify-management-services-benign-context
