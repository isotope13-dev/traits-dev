defaults:
  for: [pe, dll]
  platforms: [windows]
  conf: 0.98
traits:
  - id: native-log-key-ctrl
    desc: Input log uses CTRL marker
    crit: component
    if:
      type: text
      exact: <CTRL>
  - id: native-log-key-alt
    desc: Input log uses Alt marker
    crit: component
    if:
      type: text
      exact: <Alt>
  - id: native-log-key-caps-lock
    desc: Input log uses Caps Lock marker
    crit: component
    if:
      type: text
      exact: <Caps Lock>
  - id: native-log-key-page-up
    desc: Input log uses Page Up marker
    crit: component
    if:
      type: text
      exact: <Page Up>
  - id: native-log-key-print-screen
    desc: Input log uses Print Screen marker
    crit: component
    if:
      type: text
      exact: <Print Screen>
  - id: native-log-key-num-lock
    desc: Input log uses Num Lock marker
    crit: component
    if:
      type: text
      exact: <Num Lock>
composite_rules:
  - id: native-special-key-html-log-markers
    desc: Special-key names formatted for input logs
    crit: notable
    needs: 4
    any:
      - id: native-log-key-ctrl
      - id: native-log-key-alt
      - id: native-log-key-caps-lock
      - id: native-log-key-page-up
      - id: native-log-key-print-screen
      - id: native-log-key-num-lock
