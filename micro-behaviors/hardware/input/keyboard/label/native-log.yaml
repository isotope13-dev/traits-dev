# Delphi short-string boundaries split space-bearing labels in text extraction.
# Search the validated label bytes together, without claiming a keylogger here.
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: native-special-key-html-log-markers
    desc: Special-key names formatted for input logs
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule native_special_key_log_labels {
          strings:
            $key1 = "<CTRL>" nocase
            $key2 = "<Alt>" nocase
            $key3 = "<Caps Lock>" nocase
            $key4 = "<Page Up>" nocase
            $key5 = "<Print Screen>" nocase
            $key6 = "<Num Lock>" nocase
          condition:
            4 of them
        }
