defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, c, cpp]
  mbc: B0015
  attack: T1056.001
  crit: suspicious

traits:
- id: keystroke-lower
  desc: keystroke keyword (lowercase)
  crit: suspicious
  conf: 0.7
  size_max: 10485760
  if:
    type: text
    word: keystroke
  unless:
  - id: metadata/file/format/source-map::sourcemap
  - id: well-known/lib/ui/jline/
  - id: well-known/lib/runtime/scripted/jruby/
  - id: well-known/app/ai/coding-agent/tabby::tabby-basename
  - type: basename
    regex: ^(hotkeyInputModal\.component|hotkeys\.service)\.ts$
  not:
  - substr: '"name": "tabby-core"'
  - substr: 'Keystroke: '
  - substr: Observable<Keystroke>
  - substr: _keystroke = new Subject<Keystroke>()
  - substr: keyStroke
  - substr: pressedKeystroke
  - substr: lastKeystrokes
  - substr: getKeystrokeName(
- id: keystroke-title
  desc: Keystroke keyword (title case)
  crit: notable
  conf: 0.7
  size_max: 10485760
  count_min: 2
  if:
    type: text
    word: Keystroke
  unless:
  - id: well-known/lib/runtime/scripted/jruby/
  not:
  - substr: '"name": "tabby-core"'
  - substr: 'Keystroke: '
  - substr: Observable<Keystroke>
  - substr: _keystroke = new Subject<Keystroke>()
  - substr: keyStroke
  - substr: pressedKeystroke
  - substr: lastKeystrokes
  - substr: getKeystrokeName(
  - substr: jline/console/ConsoleReader
  - substr: Ljline/console/ConsoleReader;
  - substr: Adobe
  - substr: Form
- id: keystroke-upper
  desc: KEYSTROKE keyword (uppercase)
  crit: notable
  conf: 0.7
  if:
    type: text
    word: KEYSTROKE
composite_rules:
- id: keystroke-keyword
  desc: keystroke keyword (case variants)
  crit: notable
  any:
  - id: micro-behaviors/hardware/input/keyboard/label::keystroke-lower
  - id: micro-behaviors/hardware/input/keyboard/label::keystroke-title
  - id: micro-behaviors/hardware/input/keyboard/label::keystroke-upper
- id: applescript-keywords
  desc: AppleScript keystroke keywords
  crit: notable
  platforms: [macos]
  for: [javascript, applescript, shell]
  any:
  - id: micro-behaviors/hardware/input/keyboard/label::keystroke-keyword
  - id: micro-behaviors/hardware/input/keyboard/simulate::key-down-phrase
- id: jxa-keystroke-keywords
  desc: JXA keystroke keywords
  # Keyword inventory only. Monaco, Angular CDK, and the keycode package
  # all expose a keyCode symbol; jxa-keystroke is the suspicious pairing.
  crit: notable
  for: [javascript]
  any:
  - id: micro-behaviors/hardware/input/keyboard/label::keystroke-lower
  - id: micro-behaviors/hardware/input/keyboard/listener::keycode-camel
- id: keylogger-identity-label
  desc: Program text names keylogger behavior
  crit: notable
  conf: 0.8
  any:
  - id: micro-behaviors/hardware/input/keyboard/label::keylogger-string
  - id: micro-behaviors/hardware/input/keyboard/label::init-keylogger-sym
  unless:
  - id: well-known/tool/detection/innerwarden::innerwarden-defensive-tool-context
  - id: well-known/tool/detection/ascan::ascan-defensive-scanner-context
  - id: well-known/tool/detection/ascan::ascan-package-context
  - id: well-known/tool/detection/ascan::ascan-package-path
