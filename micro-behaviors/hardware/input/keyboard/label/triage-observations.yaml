defaults:
  platforms: [windows]
traits:
- id: keylog-record-label
  desc: Keylog record label, without transport evidence
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '(?i)\bKEYLOG(_BULK)?:'
  for: [pe, dll]
- id: keylog-keyboard-context
  desc: Keylog term near keyboard capture vocabulary
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '(?i)\bkeylog\b.{0,40}\b(keyboard|keystrokes?|keypress)\b'
  for: [scripts, binaries, csharp]
