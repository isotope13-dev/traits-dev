defaults:
  platforms: [windows]
traits:
- id: keylog-record-label
  desc: Keylog record label, without transport evidence
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '(?i)\bKEYLOG(_BULK)?:'
  for: [pe, dll]
- id: keylog-word
  desc: Keylog word, excluding TLS file wording
  crit: notable
  conf: 0.86
  if:
    type: text
    # Capture the following word so TLS key-log wording ("keylog file" in
    # OpenSSL's _ssl error strings) can be excluded; that is SSLKEYLOGFILE
    # support, not keystroke capture.
    regex: \bkeylog\b( \w+)?
  not:
  - regex: ^keylog (file|filename|callback)
  for: [scripts, binaries, csharp]
