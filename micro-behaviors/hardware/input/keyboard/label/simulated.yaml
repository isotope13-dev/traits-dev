defaults:
  for: [binaries, c, cpp, rust, go, csharp]
  platforms: [linux, macos, windows]
  conf: 0.8

traits:
  - id: keylogger-not-implemented
    desc: 'Mentions keylogging is not implemented'
    crit: notable
    if:
      type: text
      regex: '(?i)keylog(ger|ging)?(\s+is)?\s+not\s+implemented'
  - id: keylogger-placeholder-mode
    desc: "Mentions a keylogger running in stub mode"
    crit: suspicious
    if:
      type: text
      regex: '(?i)keylog(ger|ging)?.{0,50}placeholder mode'
composite_rules:
  - id: keylogger-placeholder-disclosure
    desc: "Declares unimplemented or placeholder keylogging"
    crit: suspicious
    all:
      - id: micro-behaviors/hardware/input/keyboard/label::keylogger-not-implemented
      - id: micro-behaviors/hardware/input/keyboard/label::keylogger-placeholder-mode
