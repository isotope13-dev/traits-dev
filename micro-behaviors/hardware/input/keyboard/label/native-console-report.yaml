defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  crit: notable
traits:
- id: native-key-event-report-fields
  desc: Keyboard scan/time/flags/virtual-key fields
  conf: 0.97
  if:
    type: raw
    section: .rdata
    regex: flags=0x.{0,20}time=.{0,20}scan=0x.{0,20}vk=
- id: key-system-up-report-label
  desc: System-key release event report label
  conf: 0.94
  if:
    type: text
    exact: SYSKEYUP
