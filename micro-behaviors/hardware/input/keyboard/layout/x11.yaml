# X11 keymap and key-event translation.
#
# The translation traits moved here out of keyboard/hook/: none of them installs
# a hook. XLookupString and friends turn a raw keycode into a keysym/string
# using the active keyboard layout -- what an X11 input listener does after
# receiving an event, and the same layout machinery x11-query-keymap covers.
defaults:
  platforms: [linux]
  for: [elf, so, c, cpp]

traits:
  # Canonical XQueryKeymap atom. `symbol` rather than `import` so one trait
  # covers both the ELF dynamic-import form and the source-level call form; a
  # duplicate `x11-key-translation-xquery` in keyboard/hook/ carried the call
  # form separately, splitting one API across two directories.
  - id: x11-query-keymap
    desc: Queries the X11 server keyboard map
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: XQueryKeymap

  - id: x11-keysym-to-keycode
    desc: Resolves X11 key symbols to key codes
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: XKeysymToKeycode

  - id: x11-key-event-structure
    desc: Uses X11 XKeyEvent structure
    crit: notable
    conf: 0.9
    attack: T1056.001
    if:
      type: text
      word: XKeyEvent

  - id: x11-key-translation-xlookup
    desc: Calls XLookupString for key translation
    crit: notable
    conf: 0.9
    attack: T1056.001
    if:
      type: symbol
      kind: call
      exact: XLookupString

  - id: x11-key-translation-xutf8
    desc: Calls Xutf8LookupString for key translation
    crit: notable
    conf: 0.9
    attack: T1056.001
    if:
      type: symbol
      kind: call
      exact: Xutf8LookupString

  - id: x11-key-translation-xkeycode
    desc: Calls XKeycodeToKeysym for key translation
    crit: notable
    conf: 0.9
    attack: T1056.001
    if:
      type: symbol
      kind: call
      exact: XKeycodeToKeysym

composite_rules:
  - id: x11-display-keymap-access
    desc: X11 display connection with keyboard-map access
    crit: notable
    conf: 0.86
    all:
      - id: micro-behaviors/hardware/display/connection::x11-open-display
      - id: x11-query-keymap
      - id: x11-keysym-to-keycode

  - id: x11-key-translation-call
    desc: Translates X11 key events to symbols
    crit: notable
    conf: 0.9
    attack: T1056.001
    any:
      - id: x11-key-translation-xlookup
      - id: x11-key-translation-xutf8
      - id: x11-key-translation-xkeycode
      - id: x11-query-keymap
