# API references do not prove that a hook captures or translates keystrokes.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: keyboard-hook-translation-window-station-api-clues
    desc: Hook, key translation and window-station API references
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/ui/window/hook::call-next-hook-ex
      - id: micro-behaviors/hardware/input/keyboard/layout::to-ascii-import
      - id: micro-behaviors/ui/window/station::open-window-station
