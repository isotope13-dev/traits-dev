defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows

traits:
  - id: to-unicode-str
    desc: ToUnicode API name reference
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      word: ToUnicode
  - id: to-unicode-ex-str
    desc: ToUnicodeEx API name reference
    crit: notable
    conf: 0.85
    unless:
      - id: well-known/game/mod/
    for: [pe, rust, c, cpp, csharp, go]
    if:
      type: text
      substr: ToUnicodeEx
    downgrade:
      any:
        - id: well-known/lib/web/client-side/dioxus
  - id: map-virtual-key
    desc: Map virtual key code
    crit: notable
    conf: 0.85
    for: [pe, dll, c, cpp, csharp, rust, go]
    unless:
      - id: well-known/game/mod/
    if:
      type: symbol
      regex: ^MapVirtualKey(A|W)?$
    downgrade:
      any:
        - id: well-known/lib/web/client-side/dioxus
  - id: get-keyboard-layout-str
    desc: GetKeyboardLayout API name reference
    crit: notable
    conf: 0.8
    for: [pe, c, cpp, csharp, rust, go]
    if:
      type: text
      word: GetKeyboardLayout
