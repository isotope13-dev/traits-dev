defaults:
  platforms: [windows]
  for: [batch, data, ne]

# ANSI.SYS key redefinition ends its string with the Enter key code (13) and
# the p final byte. Any remap that runs its string on Enter ends this way, so
# the terminator alone shows the keyboard remap; the key and text are free.
# Binary string extraction drops this quoted run, so match the raw bytes.
traits:
  - id: ansi-key-redefine-enter-terminator
    desc: ANSI key redefinition with Enter terminator
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: '22 3B 31 33 70'
