defaults:
  platforms: [windows]
  for: [pe, c, cpp, rust]
  crit: notable
  conf: 0.8

traits:
  - id: to-ascii-import
    desc: Imports ToAscii keyboard translation API
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: import
      exact: ToAscii

  - id: to-ascii-ex-import
    desc: Imports ToAsciiEx keyboard translation API
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: import
      exact: ToAsciiEx

  - id: map-virtual-key-str
    desc: MapVirtualKey API string reference
    crit: notable
    for: [pe, c, cpp, rust, csharp]
    if:
      type: text
      substr: MapVirtualKey

  - id: ime-status-window-pos
    desc: IME status window position import
    crit: notable
    conf: 0.92
    for: [pe, dll]
    if:
      type: import
      exact: ImmSetStatusWindowPos
