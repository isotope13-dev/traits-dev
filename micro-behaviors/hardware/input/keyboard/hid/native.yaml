defaults:
  platforms: [macos]
  for: [macho]
  crit: notable
  conf: 0.95
traits:
  - id: native-iohid-input-value-callback
    desc: HID input callback registration API reference
    if:
      type: text
      substr: IOHIDManagerRegisterInputValueCallback
  - id: native-iohid-input-integer-value
    desc: HID integer input value API reference
    if:
      type: text
      substr: IOHIDValueGetIntegerValue
