defaults:
  platforms: [android]
composite_rules:
  - id: android-install-attribution-accessibility-configuration
    desc: Installer attribution and Accessibility setup
    crit: notable
    conf: 0.97
    for: [source, binaries]
    all:
      - id: micro-behaviors/os/package-manager/sideload::android-apk-installer-attribution
      - id: micro-behaviors/os/application/desktop-settings::android-accessibility-settings-command-enable
