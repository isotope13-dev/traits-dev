defaults:
  platforms: [android]
  for: [java]
  crit: notable
traits:
  - id: android-uninstall-search-result-bounds
    desc: Queries bounds of Uninstall search results
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((enhanced_for_statement
          name: (identifier) @node
          value: (method_invocation
            name: (identifier) @search
            arguments: (argument_list (string_literal) @label))
          body: (block
            (expression_statement
              (method_invocation object: (identifier) @used
                name: (identifier) @bounds)))) @operation
          (#eq? @search "findAccessibilityNodeInfosByText")
          (#eq? @label "\"Uninstall\"")
          (#eq? @bounds "getBoundsInScreen")
          (#eq? @node @used))
