defaults:
  platforms: [android]
  for: [apk, zip, dex, xml]
composite_rules:
  # Resource and capability co-occurrence does not establish keylogging or
  # covert sensor capture; those require independent behavioral evidence.
  - id: android-accessibility-keyboard-admin-layouts
    desc: Accessibility, keyboard and device-admin layout clues
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-surface-references
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-request-layout
      - id: micro-behaviors/hardware/input/keyboard/layout::android-custom-keyboard-resources
      - id: micro-behaviors/os/privilege/manifest::device-admin-policy
    any:
      - id: micro-behaviors/hardware/input/accessibility::android-miui-accessibility-layout
      - id: micro-behaviors/os/privilege/check::android-oppo-battery-settings-layout
  - id: android-accessibility-camera-screen-clues
    desc: Accessibility, camera and screen capture clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-surface-references
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-request-layout
      - id: micro-behaviors/hardware/display/screenshot/unspecified::android-screen-capture-capability
      - id: micro-behaviors/hardware/display/camera::android-camera-capture-capability
    any:
      - id: micro-behaviors/ui/window/overlay::floating-window-layouts
      - id: micro-behaviors/os/privilege/manifest::device-admin-policy
      - id: micro-behaviors/ui/window/lock::android-screen-lock-layout
  - id: android-accessibility-ime-privilege-clues
    desc: Accessibility and input method with privileged surface
    crit: suspicious
    conf: 0.96
    for: [android_apk, zip, xml]
    all:
      - id: micro-behaviors/os/privilege/manifest::bind-accessibility-service
      - id: micro-behaviors/os/privilege/manifest::bind-input-method
    any:
      - id: metadata/permission/manifest::android-system-alert-window-request
      - id: micro-behaviors/os/privilege/manifest::bind-device-admin
      - id: micro-behaviors/os/privilege/manifest::media-projection-service-type
    needs: 1
    unless:
      - id: well-known/tool/development/mobile/expo::expo-quest-template-manifest
      # System package inventories combine permissions from separate apps.
      - id: metadata/file/format/android-package-database::android-system-package-database
      - id: metadata/permission/manifest::android-framework-manifest
      - id: metadata/permission/identity::android-platform-manifest-header
