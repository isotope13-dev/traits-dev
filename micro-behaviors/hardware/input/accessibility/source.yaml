# Source-level Android UI-tree access.  The APK/resource matcher lives in
# android.yaml; these atoms cover Java/Kotlin implementations before
# compilation has erased the API names.
defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin, apk, zip]
  conf: 0.9

traits:
  - id: android-accessibility-root-read
    desc: Reads the active accessibility window
    crit: component
    if:
      type: text
      regex: '(?i)\b(getRootInActiveWindow|rootInActiveWindow)\b'

  - id: android-accessibility-node-search
    desc: Searches Android accessibility nodes
    crit: component
    if:
      type: text
      regex: '(?i)\bfindAccessibilityNodeInfosBy(Text|ViewIdResourceName)\b'

  - id: android-accessibility-child-count-read
    desc: Reads accessibility child count
    crit: component
    if:
      type: text
      word: getChildCount

  - id: android-accessibility-child-node-read
    desc: Reads an accessibility child node
    crit: component
    if:
      type: text
      word: getChild

  - id: android-accessibility-node-perform-action
    desc: Performs an accessibility node action
    crit: component
    if:
      type: text
      regex: '\bperformAction\s*\('

  - id: android-accessibility-node-click-action
    desc: Clicks or scrolls an accessibility node
    crit: component
    if:
      type: text
      regex: '\bACTION_(CLICK|SCROLL_FORWARD|SCROLL_BACKWARD)\b'

  # Accessibility services used for remote UI control read the rendered text
  # of nodes before deciding which credential or approval step to operate on.
  # The JVM call projection records bare method names with no receiver, so
  # `getText()` on its own is indistinguishable from any other text getter
  # (Dokka/Swing/JavaFX/test helpers all define one) -- it is a fragment like
  # its getChild/getChildCount siblings, and only the node-tree composite
  # supplies the accessibility context.
  - id: ui-node-get-text-call
    desc: getText() element-text getter call
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: getText

  - id: android-accessibility-node-description-read
    desc: Reads Android accessibility content description
    crit: notable
    conf: 0.93
    if:
      type: symbol
      kind: call
      exact: getContentDescription

composite_rules:
  - id: android-accessibility-node-tree-read-source
    desc: Reads Android accessibility UI nodes
    crit: notable
    all:
      - id: android-accessibility-root-read
    any:
      - id: android-accessibility-node-search
      - id: android-accessibility-child-count-read
      - id: android-accessibility-child-node-read

  - id: android-accessibility-node-action-source
    desc: Performs an Android accessibility node action
    crit: notable
    any:
      - id: android-accessibility-node-perform-action
      - id: android-accessibility-node-click-action

  - id: android-accessibility-node-automation
    desc: Reads and operates Android accessibility UI nodes
    crit: notable
    conf: 0.94
    all:
      - id: android-accessibility-node-tree-read-source
      - id: android-accessibility-node-action-source

  - id: android-accessibility-text-extraction
    desc: Android accessibility node text extraction
    crit: notable
    conf: 0.95
    all:
      - id: android-accessibility-node-tree-read-source
    any:
      - id: ui-node-get-text-call
      - id: android-accessibility-node-description-read
