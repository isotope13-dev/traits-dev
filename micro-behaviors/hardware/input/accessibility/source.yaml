# Source-level Android UI-tree access.  The APK/resource matcher lives in
# android.yaml; these atoms cover Java/Kotlin implementations before
# compilation has erased the API names.
defaults:
  crit: notable
  platforms: [android, unix, windows]
  for: [java, kotlin]
  conf: 0.9

traits:
  - id: android-accessibility-node-search
    desc: Searches Android accessibility nodes
    if:
      type: text
      regex: '(?i)\bfindAccessibilityNodeInfosBy(Text|ViewId)'

  # AOSP Settings renders every system toggle with the framework view id
  # `android:id/switch_widget`.  An accessibility service that looks that id up
  # is driving a Settings switch on the user's behalf -- how droppers and
  # bankers self-enable developer options, unknown sources or their own
  # accessibility binding without a tap.
  - id: android-settings-toggle-widget-target
    desc: Targets the Android settings toggle widget
    conf: 0.93
    for: [dex, java, kotlin]
    if:
      type: text
      regex: '\bandroid:id/switch_widget\b'

  # Android browsers expose the address bar under a stable resource id
  # (`com.android.chrome:id/url_bar`, Firefox's Mozilla-Components
  # `mozac_browser_toolbar_url_view`, Samsung Internet's
  # `location_bar_edit_text`).  An accessibility service that looks one up is
  # reading the page the user is on -- the address-bar scraping half of a
  # credential stealer, and it works against any site without an overlay.
  # Android browsers expose the address bar under a stable resource-id suffix:
  # Chromium's `:id/url_bar`, Firefox's Mozilla-Components
  # `:id/mozac_browser_toolbar_url_view`, Samsung Internet's
  # `:id/location_bar_edit_text`. Looking one of these up drives at the page
  # the user is on -- the address-bar scraping half of a credential stealer.
  - id: android-chromium-url-bar-view-id
    desc: Chromium address-bar view id
    crit: notable
    conf: 0.9
    for: [java, kotlin, apk, zip, dex]
    if:
      type: text
      substr: ':id/url_bar'

  - id: android-firefox-url-view-id
    desc: Firefox address-bar view id
    crit: notable
    conf: 0.92
    for: [java, kotlin, apk, zip, dex]
    if:
      type: text
      substr: ':id/mozac_browser_toolbar_url_view'

  - id: android-samsung-url-view-id
    desc: Samsung Internet address-bar view id
    crit: notable
    conf: 0.92
    for: [java, kotlin, apk, zip, dex]
    if:
      type: text
      substr: ':id/location_bar_edit_text'

  - id: android-browser-url-field-view-id
    desc: Browser address-bar field view id
    crit: notable
    conf: 0.88
    for: [java, kotlin, apk, zip, dex]
    if:
      type: text
      substr: ':id/url_field' 

  - id: android-accessibility-child-count-read
    desc: Reads accessibility child count
    if:
      type: text
      word: getChildCount

  - id: android-accessibility-child-node-read
    desc: Reads an accessibility child node
    if:
      type: text
      word: getChild

  # Accessibility services used for remote UI control read the rendered text
  # of nodes before deciding which credential or approval step to operate on.
  # The JVM call projection records bare method names with no receiver, so
  # `getText()` on its own is indistinguishable from any other text getter
  # (Dokka/Swing/JavaFX/test helpers all define one) -- it is a fragment like
  # its getChild/getChildCount siblings, and only the node-tree composite
  # supplies the accessibility context.
  - id: ui-node-get-text-call
    desc: getText() element-text getter call
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: getText

  # Kotlin source call projection currently omits receiver method calls from
  # the symbol table. Keep a syntax-anchored source counterpart so node text
  # extraction remains visible before compilation.
  - id: ui-node-get-text-source-call
    desc: getText() source call
    conf: 0.9
    if:
      type: text
      regex: '\.getText\s*\('

  - id: android-accessibility-node-description-read
    desc: Reads Android accessibility content description
    conf: 0.93
    if:
      type: symbol
      kind: call
      exact: getContentDescription

composite_rules:
  # Any single browser's address-bar id is enough to say code is aiming at the
  # address bar; the multi-target set is a cross-vendor surveillance list.
  - id: android-browser-url-bar-view-target
    desc: Targets an Android browser address-bar view id
    conf: 0.94
    any:
      - id: android-chromium-url-bar-view-id
      - id: android-firefox-url-view-id
      - id: android-samsung-url-view-id
      - id: android-browser-url-field-view-id

  - id: android-browser-url-bar-target-set
    desc: Targets several browsers' address-bar view ids
    conf: 0.96
    needs: 3
    any:
      - id: android-chromium-url-bar-view-id
      - id: android-firefox-url-view-id
      - id: android-samsung-url-view-id
      - id: android-browser-url-field-view-id

  - id: android-accessibility-node-tree-read-source
    desc: Reads and enumerates Android accessibility UI nodes
    all:
      - id: android-accessibility-ui-tree-source
    any:
      - id: android-accessibility-node-search
      - id: android-accessibility-child-count-read
      - id: android-accessibility-child-node-read

  - id: android-accessibility-node-automation
    desc: Reads and operates Android accessibility UI nodes
    conf: 0.94
    all:
      - id: android-accessibility-node-tree-read-source
      - id: android-accessibility-ui-action-source

  - id: android-accessibility-text-extraction
    desc: Android accessibility node text extraction
    conf: 0.95
    all:
      - id: android-accessibility-node-tree-read-source
    any:
      - id: ui-node-get-text-call
      - id: ui-node-get-text-source-call
      - id: android-accessibility-node-description-read
