defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: notable
  conf: 0.96

traits:
  # Require the positive branch: a screen reader that skips password nodes
  # with !node.isPassword() must not become a password collector.
  - id: password-branch-text-read-source
    desc: Reads text inside a password branch
    if:
      type: text
      regex: '(if\s*\(|&&)\s*\w+\.isPassword\(\)\s*\)\s*\{[^{}]{0,180}\.getText\('

  - id: android-node-password-flag-call
    desc: Queries a node password flag
    for: [java]
    if:
      type: symbol
      kind: call
      exact: isPassword

  # Kotlin's call projection omits receiver calls. Keep this code-shaped
  # counterpart until those calls are exposed as structured facts.
  - id: android-kotlin-node-password-flag
    desc: Reads a Kotlin node password flag
    for: [kotlin]
    if:
      type: text
      regex: '\.isPassword\b'

composite_rules:
  - id: android-node-password-flag-read
    desc: Reads an Android node password flag
    any:
      - id: android-node-password-flag-call
      - id: android-kotlin-node-password-flag
