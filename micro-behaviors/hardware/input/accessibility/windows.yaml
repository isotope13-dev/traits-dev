# Windows Microsoft Active Accessibility (MSAA / oleacc) UI-tree access.
# Legitimate screen readers, UI automation, and accessibility tools use
# these APIs, so individual observations and the capability composite stay
# notable. Intent belongs to composites pairing this with malware identity
# or exfiltration.
defaults:
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: msaa-accessible-object-from-window
    desc: Opens window Accessibility object
    for: [pe, c, cpp, csharp, vbs, powershell]
    if:
      type: text
      word: AccessibleObjectFromWindow

  - id: msaa-accessible-children
    desc: Enumerates Accessibility child elements
    for: [pe, c, cpp, csharp, vbs, powershell]
    if:
      type: text
      word: AccessibleChildren

  - id: oleacc-library-reference
    desc: References Windows oleacc library
    for: [c, cpp, csharp, vbs, powershell]
    if:
      type: text
      regex: '(?i)\boleacc(\.dll)?\b'

composite_rules:
  - id: msaa-window-ui-enumeration
    desc: Accesses and enumerates window Accessibility UI tree
    conf: 0.94
    for: [c, cpp, csharp, vbs, powershell]
    all:
      - id: msaa-accessible-object-from-window
      - id: msaa-accessible-children
