defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.98
traits:
  - id: dex-pattern-view-id-check
    desc: Checks Android lock-pattern view identifiers
    if:
      type: symbol
      kind: call
      exact: Ljava/lang/String;->contains
      arg: {index: 0, kind: string, regex: '^(LockPatternView|pattern_view)$'}
  - id: dex-accessibility-node-class-read
    desc: Reads accessibility node widget class
    if:
      type: symbol
      kind: call
      exact: Landroid/view/accessibility/AccessibilityNodeInfo;->getClassName
  - id: dex-accessibility-password-flag-read
    desc: Tests accessibility password field flag
    if:
      type: symbol
      kind: call
      exact: Landroid/view/accessibility/AccessibilityNodeInfo;->isPassword
  - id: dex-system-confirm-button-lookup
    desc: Looks up Android confirmation button
    if:
      type: symbol
      kind: call
      exact: Landroid/view/accessibility/AccessibilityNodeInfo;->findAccessibilityNodeInfosByViewId
      arg: {index: 0, kind: string, exact: 'android:id/button1'}
  - id: dex-packageinstaller-substring-test
    desc: Tests package installer name fragment
    if:
      type: symbol
      kind: call
      exact: Ljava/lang/String;->contains
      arg: {index: 0, kind: string, exact: packageinstaller}
  - id: dex-accessibility-node-text-read
    desc: Reads Android accessibility node text
    if:
      type: symbol
      kind: call
      exact: Landroid/view/accessibility/AccessibilityNodeInfo;->getText
  - id: dex-accessibility-node-action
    desc: Performs Android accessibility node action
    if:
      type: symbol
      kind: call
      exact: Landroid/view/accessibility/AccessibilityNodeInfo;->performAction
  - id: dex-accessibility-node-bounds-call
    desc: Reads accessibility node screen bounds
    if:
      type: symbol
      kind: call
      exact: Landroid/view/accessibility/AccessibilityNodeInfo;->getBoundsInScreen
  - id: dex-accessibility-event-text-call
    desc: DEX reads accessibility event text
    if:
      type: symbol
      kind: call
      exact: Landroid/view/accessibility/AccessibilityRecord;->getText
  - id: dex-enabled-accessibility-services-key
    desc: Android enabled_accessibility_services key
    if:
      type: text
      exact: enabled_accessibility_services
  - id: dex-settings-put-shell-command
    desc: Android settings put shell command
    if:
      type: text
      exact: 'settings put'
