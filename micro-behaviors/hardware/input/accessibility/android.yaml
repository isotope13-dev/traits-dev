defaults:
  platforms: [android]
  for: [apk, zip, xml, dex]
  crit: component
  conf: 0.9

traits:
  - id: android-accessibility-service-class
    desc: Android accessibility service class
    conf: 0.9
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog
    if:
      type: text
      substr: "Landroid/accessibilityservice/AccessibilityService;"

  - id: android-accessibility-gesture-api
    desc: Android accessibility gesture API
    conf: 0.9
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog
    if:
      type: text
      substr: "Landroid/accessibilityservice/GestureDescription;"

  # Source-level counterparts to the APK descriptors below.  These identify
  # the Android accessibility surface without assuming a particular malware
  # family or hardcoded UI layout.
  - id: android-accessibility-service-source
    desc: Android accessibility service implementation
    crit: notable
    conf: 0.94
    for: [java, kotlin]
    if:
      type: text
      regex: '(?i)(extends|:)\s*AccessibilityService\b'

  - id: android-accessibility-ui-tree-root
    desc: Reads Android active accessibility UI tree
    crit: notable
    conf: 0.94
    for: [java, kotlin]
    if:
      type: text
      word: rootInActiveWindow

  - id: android-accessibility-ui-tree-root-method
    desc: Calls Android active accessibility tree getter
    crit: notable
    conf: 0.94
    for: [java, kotlin]
    if:
      type: text
      regex: '\bgetRootInActiveWindow\s*\('

  - id: android-accessibility-ui-tree-dump
    desc: Dumps Android accessibility UI hierarchy
    crit: notable
    conf: 0.94
    for: [java, kotlin]
    if:
      type: text
      regex: '\.\s*dumpWindowHierarchy\s*\('

  - id: android-accessibility-gesture-dispatch
    desc: Injects Android accessibility gestures
    crit: notable
    conf: 0.95
    for: [java, kotlin]
    if:
      type: text
      regex: '\.\s*dispatchGesture\s*\('

  - id: android-accessibility-perform-action
    desc: Performs Android accessibility node actions
    crit: notable
    conf: 0.93
    for: [java, kotlin]
    if:
      type: text
      regex: '\.\s*performAction\s*\('

  - id: android-accessibility-settings-intent
    desc: Android accessibility settings intent
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog
    if:
      type: text
      substr: "android.settings.ACCESSIBILITY_SETTINGS"

  - id: android-accessibility-service-config-resource
    desc: Android accessibility service config
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog
    if:
      type: text
      substr: "res/xml/accessibility_service_config.xml"
      offset_range: [-262144, null]

  - id: android-accessibility-service-config-member
    desc: Android accessibility service config
    if:
      type: value
      path: "archive.members[*].path"
      exact: res/xml/accessibility_service_config.xml

  - id: android-accessibility-config-resource-alt
    desc: Android accessibility service config
    conf: 0.86
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog
    if:
      type: text
      substr: "res/xml/accessdiecrip.xml"
      offset_range: [-262144, null]

  - id: android-accessibility-config-member-alt
    desc: Android accessibility service config
    conf: 0.86
    if:
      type: value
      path: "archive.members[*].path"
      exact: res/xml/accessdiecrip.xml

  - id: android-accessibilityservice-config-resource
    desc: Android accessibilityservice config
    conf: 0.88
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog
    if:
      type: text
      substr: "res/xml/accessibilityservice.xml"
      offset_range: [-262144, null]

  - id: android-accessibilityservice-config-member
    desc: Android accessibilityservice config
    conf: 0.88
    if:
      type: value
      path: "archive.members[*].path"
      exact: res/xml/accessibilityservice.xml

  - id: android-accessibility-request-layout
    desc: Android accessibility request screen
    conf: 0.86
    if:
      type: text
      substr: "res/layout/activity_req_access.xml"
      offset_range: [-262144, null]

  - id: android-miui-accessibility-layout
    desc: Android MIUI accessibility prompt
    conf: 0.84
    if:
      type: text
      substr: "res/layout/miui_access_act.xml"
      offset_range: [-262144, null]

composite_rules:
  - id: android-accessibility-service-config
    desc: Android accessibility service config
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/file/catalog/identity::android-sdk-api-version-catalog
    any:
      - id: android-accessibility-service-config-resource
      - id: android-accessibility-service-config-member
      - id: android-accessibility-config-resource-alt
      - id: android-accessibility-config-member-alt
      - id: android-accessibilityservice-config-resource
      - id: android-accessibilityservice-config-member
      - id: android-accessibility-service-class
      - id: android-accessibility-gesture-api

  # Form-agnostic normalisation of the three ways code reaches the rendered
  # window contents: the Kotlin property, the Java getter, and a full
  # hierarchy dump.
  - id: android-accessibility-ui-tree-source
    desc: Reads or dumps the Android accessibility UI tree
    crit: notable
    conf: 0.94
    for: [apk, zip, xml, java, kotlin]
    any:
      - id: android-accessibility-ui-tree-root
      - id: android-accessibility-ui-tree-root-method
      - id: android-accessibility-ui-tree-dump

  # Synthetic input driven through the accessibility channel, by either route:
  # a dispatched gesture stroke or a node action (ACTION_CLICK and friends).
  # Both operate another app's UI without the user touching the screen.
  - id: android-accessibility-ui-action-source
    desc: Injects UI actions through Android accessibility
    crit: notable
    conf: 0.95
    for: [apk, zip, xml, java, kotlin]
    any:
      - id: android-accessibility-gesture-dispatch
      - id: android-accessibility-perform-action
