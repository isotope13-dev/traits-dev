defaults:
  platforms: [windows]
  for: [python, c, cpp, csharp, powershell]
  crit: notable
  conf: 0.92

traits:
  - id: windows-sendinput-call
    desc: Synthesizes Windows keyboard or mouse input
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SendInput$'
  # The compiled form. `windows-sendinput-call` above resolves a call symbol,
  # which is a source-level view; in a shipped PE the API arrives as an import
  # name in the data the loader reads, so the name itself is the matcher.
  - id: sendinput-api-name
    desc: SendInput input-synthesis API name
    for: [pe, dll]
    conf: 0.9
    if:
      type: text
      exact: SendInput

  - id: javascript-sendinput-ffi
    desc: JavaScript SendInput via native FFI
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(func\s*\([^)]{0,220}\bSendInput\b|SendInput\b[\s\S]{0,220}\.func\s*\()'
