defaults:
  platforms: [macos]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-cgevent-post
    desc: Python posts a macOS synthetic input event
    if:
      type: symbol
      kind: call
      regex: '(^|\.)CGEventPost$'

  - id: python-cgevent-create-keyboard-event
    desc: Python creates a macOS keyboard input event
    if:
      type: symbol
      kind: call
      regex: '(^|\.)CGEventCreateKeyboardEvent$'
