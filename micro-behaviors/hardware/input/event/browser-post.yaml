# Co-occurrence alone does not establish sandbox detection or transmission.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.85

composite_rules:
  - id: recorded-input-and-http-post
    desc: Recorded input alongside HTTP POST
    conf: 0.85
    all:
      - id: micro-behaviors/hardware/input/event::browser-keyboard-event-listener-any-form
      - id: micro-behaviors/hardware/input/event::user-activity-event-listener
      - id: micro-behaviors/communications/http/post::js-fetch-post-request
    any:
      - id: micro-behaviors/hardware/input/event::browser-key-event-value-queued
      - id: micro-behaviors/hardware/input/event::browser-key-event-counted
