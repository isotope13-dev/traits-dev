# DOM user-activity event registration. Relocated from
# micro-behaviors/ui/window/manage/visibility, which described visibility-state
# manipulation -- registering a pointer, scroll or touch handler is input-event
# handling, and it is what cursor-followers, idle timers, analytics and
# behaviour-capture code all do. Neutral: whether the handler steals anything
# is decided by what the callback does, so composites supply that.
#
# The old matchers were single-quote substrings (`addEventListener('mousemove`)
# and silently missed the double-quoted spelling.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9

traits:
  - id: browser-mousemove-listener
    desc: Registers a DOM mousemove listener
    if:
      type: symbol
      kind: call
      regex: '^([A-Za-z_$][A-Za-z0-9_$]*\.)?addEventListener$'
      arg:
        kind: string
        exact: mousemove

  - id: browser-pointermove-listener
    desc: Registers a DOM pointermove listener
    if:
      type: symbol
      kind: call
      regex: '^([A-Za-z_$][A-Za-z0-9_$]*\.)?addEventListener$'
      arg:
        kind: string
        exact: pointermove

  - id: browser-scroll-listener
    desc: Registers a DOM scroll listener
    if:
      type: symbol
      kind: call
      regex: '^([A-Za-z_$][A-Za-z0-9_$]*\.)?addEventListener$'
      arg:
        kind: string
        exact: scroll

  - id: browser-touchstart-listener
    desc: Registers a DOM touchstart listener
    if:
      type: symbol
      kind: call
      regex: '^([A-Za-z_$][A-Za-z0-9_$]*\.)?addEventListener$'
      arg:
        kind: string
        exact: touchstart

composite_rules:
  - id: user-activity-event-listener
    desc: Browser user activity event listener
    crit: notable
    conf: 0.9
    any:
      - id: browser-mousemove-listener
      - id: browser-pointermove-listener
      - id: browser-scroll-listener
      - id: browser-touchstart-listener
      - id: micro-behaviors/hardware/input/event::browser-keyboard-event-listener
