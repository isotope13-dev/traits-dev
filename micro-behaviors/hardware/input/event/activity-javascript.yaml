# DOM user-activity event registration. Relocated from
# micro-behaviors/ui/window/manage/visibility, which described visibility-state
# manipulation -- registering a pointer, scroll or touch handler is input-event
# handling, and it is what cursor-followers, idle timers, analytics and
# behaviour-capture code all do. Neutral: whether the handler steals anything
# is decided by what the callback does, so composites supply that.
#
# The old matchers were single-quote substrings (`addEventListener('mousemove`)
# and silently missed the double-quoted spelling.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9

traits:
  - id: browser-mousemove-listener
    desc: Registers a DOM mousemove listener
    if:
      type: symbol
      kind: call
      regex: '^([A-Za-z_$][A-Za-z0-9_$]*\.)?addEventListener$'
      arg:
        kind: string
        exact: mousemove

  - id: browser-pointermove-listener
    desc: Registers a DOM pointermove listener
    if:
      type: symbol
      kind: call
      regex: '^([A-Za-z_$][A-Za-z0-9_$]*\.)?addEventListener$'
      arg:
        kind: string
        exact: pointermove

  - id: browser-scroll-listener
    desc: Registers a DOM scroll listener
    if:
      type: symbol
      kind: call
      regex: '^([A-Za-z_$][A-Za-z0-9_$]*\.)?addEventListener$'
      arg:
        kind: string
        exact: scroll

  - id: browser-touchstart-listener
    desc: Registers a DOM touchstart listener
    if:
      type: symbol
      kind: call
      regex: '^([A-Za-z_$][A-Za-z0-9_$]*\.)?addEventListener$'
      arg:
        kind: string
        exact: touchstart

  # The call-and-argument atoms above are precise but need a parsed call
  # graph, and an HTML document yields no symbols at all — inline <script> is
  # invisible to them. That left every one of them a dead gate on the file
  # type that matters most here: ClickFix-style lure pages ship their whole
  # payload in an inline handler, so composites requiring a user-activity
  # listener could not fire on the very pages they target. This text form
  # covers that case. Kept as one atom because the four event names are
  # interchangeable spellings of a single signal, not independent findings.
  - id: inline-user-activity-listener
    desc: Registers a DOM user-activity listener inline
    for: [html]
    conf: 0.85
    if:
      type: text
      regex: 'addEventListener\s*\(\s*["''](mousemove|pointermove|scroll|touchstart)'

  # Capture-phase registration is a neutral DOM API used by a11y focus traps,
  # HTML5 drag-and-drop, and editors. Intent (click hijack, TDS) comes from
  # composites in objectives/evasion/decoy/lure — not from this atom alone.
  - id: capture-phase-event-listener
    desc: Registers capture-phase DOM event listener
    conf: 0.9
    if:
      # Bind `true` to the third argument of this parsed call. A cross-text
      # span can start at AbortSignal.addEventListener() and consume an
      # unrelated `true)` hundreds of bytes later.
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: (member_expression
            property: (property_identifier) @method)
          arguments: (arguments
            . (_)
            . (_)
            . (true) @capture)
          (#eq? @method "addEventListener"))

composite_rules:
  - id: user-activity-event-listener
    desc: Browser user activity event listener
    crit: notable
    conf: 0.9
    any:
      - id: browser-mousemove-listener
      - id: browser-pointermove-listener
      - id: browser-scroll-listener
      - id: browser-touchstart-listener
      - id: inline-user-activity-listener
      - id: micro-behaviors/hardware/input/event::browser-keyboard-event-listener
