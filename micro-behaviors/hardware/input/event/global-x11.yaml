# Native X11 global input capture.
defaults:
  platforms: [linux]
  for: [elf, c, cpp]

traits:
  - id: xinput-keyboard-marker
    desc: References XInput2 keyboard event constants
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'XI_(Raw)?Key(Press|Release)\b'

composite_rules:
  - id: x11-global-keyboard-event-handling
    desc: Handles decoded global X11 key events
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/display/connection::x11-open-display
      - id: micro-behaviors/hardware/input/event::x11-read-input-events
      - id: micro-behaviors/hardware/input/event::x11-decode-input-event
      - id: xinput-keyboard-marker
    any:
      - id: micro-behaviors/hardware/input/keyboard/layout::x11-key-event-structure
      - id: micro-behaviors/hardware/input/keyboard/layout::x11-key-translation-call

