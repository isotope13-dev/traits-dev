defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
  attack: T1056

composite_rules:
  - id: synthetic-user-input
    desc: Synthesize keyboard and mouse input
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/hardware/input/mouse/simulate::mouse-event
      - id: micro-behaviors/hardware/input/keyboard/simulate::keybd-event
    unless:
      # user32 is where mouse_event/keybd_event live. A Windows-API
      # reimplementation (Wine, ReactOS) exports them rather than calling them.
      - id: well-known/app/system/reactos::system-component
      - id: metadata/lang/upstream::windows-system-implementer-dll
      # PInvoke.User32 / Vanara.PInvoke.User32 declare mouse_event and
      # keybd_event because User32 exports them.
      - id: metadata/lang/upstream::dotnet-pinvoke-binding-assembly
      - id: well-known/lib/native/pywin32::pywin32-binding-module
      # A compiled AutoIt script is the stock AutoIt3 interpreter with the
      # script appended as a resource. The interpreter links user32's whole
      # input surface -- mouse_event, keybd_event, SendInput, BlockInput --
      # to back its MouseClick/Send builtins, so every AutoIt-compiled EXE
      # imports both names whatever the script does. Constant across the
      # format, so it separates nothing; AutoIt abuse is caught by the
      # embedded script and the behaviour it actually performs.
      - id: metadata/lang/compiled::autoit-compiled-script
      # AutoItX3.dll is that same interpreter surface shipped as a COM control
      # rather than a compiled script, so the paragraph above applies to it
      # verbatim. `autoitx-official-control` exists to identify it -- its own
      # file notes "its exports are exactly the Win32 input ... surface" --
      # and reached this rule's sibling case but not this one. Referenced as
      # the single version-resource leaf rather than the `autoitx-official-control`
      # composite: that composite expands to four suppressions and pushed this
      # rule to 34 against the 32-after-expansion ceiling.
      - id: well-known/tool/sysadmin/autoit::autoitx-original-filename
  - id: synthetic-user-input-src
    desc: "Keyboard and mouse synthesis references"
    crit: suspicious
    conf: 0.88
    for: [csharp]
    all:
      - id: micro-behaviors/hardware/input/mouse/simulate::mouse-event-src
      - id: micro-behaviors/hardware/input/keyboard/poll::keybd-event-pinvoke
