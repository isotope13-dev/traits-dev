defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1056

composite_rules:
# The legs are the PostMessage name and WM_KEY*/WM_*BUTTON* constant names
# as text. Every WinForms/WPF/UI framework carries both (it handles these
# messages), so this cannot tell posting synthetic input from receiving it;
# the HVNC and hidden-desktop objectives supply that context.
- id: postmessage-input-message-names
  desc: PostMessage with keyboard or mouse message names
  crit: notable
  conf: 0.91
  all:
  - id: micro-behaviors/os/message/queue::post-message-text
  any:
  - id: micro-behaviors/hardware/input/mouse/message::windows-mouse-message-constants
  - id: micro-behaviors/hardware/input/keyboard/listener::windows-key-message-constants
  downgrade:
    any:
    - id: metadata/binary/framework/
