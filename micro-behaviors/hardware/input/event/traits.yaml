defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, c, cpp]
  mbc: B0015
  attack: T1056.001
  crit: suspicious

traits:
- id: go-gohook
  desc: "Go global input hook library reference"
  conf: 0.75
  if:
    type: text
    substr: github.com/robotn/gohook
- id: require-iohook
  desc: require("iohook")
  conf: 0.6
  if:
    type: text
    regex: require\(['"]iohook['"]\)
- id: import-iohook
  desc: from "iohook" import
  conf: 0.6
  if:
    type: text
    regex: from ['"]iohook['"]
- id: use-rdev
  desc: 'use rdev:: import statement'
  conf: 0.5
  if:
    type: text
    substr: 'use rdev::'
- id: extern-crate-rdev
  desc: extern crate rdev
  conf: 0.5
  if:
    type: text
    substr: extern crate rdev
- id: node-global-input-hook
  desc: "Node global input hook module reference"
  crit: suspicious
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?i)(require\s*\(\s*["'']iohook["'']\s*\)|from\s+["'']iohook["''])'
composite_rules:
- id: js-iohook
  desc: "Node iohook global input interface"
  conf: 0.75
  any:
  - id: micro-behaviors/hardware/input/event::require-iohook
  - id: micro-behaviors/hardware/input/event::import-iohook
- id: rust-rdev
  desc: "Rust rdev input event library"
  conf: 0.65
  any:
  - id: micro-behaviors/hardware/input/event::use-rdev
  - id: micro-behaviors/hardware/input/event::extern-crate-rdev
