defaults:
  platforms: [android]
  for: [java, kotlin, android_apk, zip, dex]
  conf: 0.94

traits:
  - id: android-view-touch-listener
    desc: Registers an Android view touch listener
    crit: notable
    for: [java, kotlin]
    if:
      type: symbol
      kind: call
      exact: setOnTouchListener

  - id: android-motion-event-import
    desc: Android MotionEvent API import
    crit: notable
    for: [java, kotlin]
    if:
      type: symbol
      kind: import
      exact: android.view.MotionEvent

  - id: android-touch-x-coordinate-read
    desc: Reads a touch event X coordinate
    crit: notable
    for: [java, kotlin]
    if:
      type: symbol
      kind: call
      regex: '^get(Raw)?X$'

  - id: android-touch-y-coordinate-read
    desc: Reads a touch event Y coordinate
    crit: notable
    for: [java, kotlin]
    if:
      type: symbol
      kind: call
      regex: '^get(Raw)?Y$'

  - id: android-view-touch-listener-method
    desc: Android view touch listener method reference
    crit: notable
    for: [dex]
    if:
      type: text
      exact: setOnTouchListener

  - id: android-motion-event-class
    desc: Android MotionEvent class reference
    crit: notable
    for: [dex]
    if:
      type: text
      substr: "Landroid/view/MotionEvent;"

  - id: android-touch-x-coordinate-method
    desc: Touch event X-coordinate method reference
    crit: notable
    for: [dex]
    if:
      type: text
      regex: '^get(Raw)?X$'

  - id: android-touch-y-coordinate-method
    desc: Touch event Y-coordinate method reference
    crit: notable
    for: [dex]
    if:
      type: text
      regex: '^get(Raw)?Y$'

  # MotionEvent.obtain builds a touch event the user never performed. Feeding
  # the result to a view's dispatch path is how code synthesizes taps without
  # a finger on the screen.
  - id: android-synthetic-touch-event-obtain
    desc: Synthesizes an Android touch event
    crit: notable
    conf: 0.93
    for: [java, kotlin]
    if:
      type: text
      regex: '\bMotionEvent\s*\.\s*obtain\s*\('

  # Fraud automation paces its clicks with daily budgets and minimum gaps so
  # the injected engagement looks organic to the ad network.
  - id: android-automated-click-pacing-cap
    desc: Caps automated click volume
    crit: notable
    conf: 0.9
    for: [java, kotlin]
    if:
      type: text
      regex: '(?i)(gesture)?clicks?(count)?\s*>=|MAX_DAILY_CLICKS|CLICK_BUDGET|CLICK_LIMIT'

composite_rules:
  - id: android-view-touch-listener-surface
    desc: Registers an Android view touch listener
    crit: notable
    conf: 0.96
    any:
      - id: android-view-touch-listener
      - id: android-view-touch-listener-method

  - id: android-motion-event-surface
    desc: References Android MotionEvent input
    crit: notable
    any:
      - id: android-motion-event-import
      - id: android-motion-event-class

  - id: android-touch-x-coordinate-access
    desc: Reads a touch event X coordinate
    crit: notable
    any:
      - id: android-touch-x-coordinate-read
      - id: android-touch-x-coordinate-method

  - id: android-touch-y-coordinate-access
    desc: Reads a touch event Y coordinate
    crit: notable
    any:
      - id: android-touch-y-coordinate-read
      - id: android-touch-y-coordinate-method

  - id: android-motion-event-coordinate-read
    desc: Reads Android touch event coordinates
    crit: notable
    conf: 0.97
    all:
      - id: android-motion-event-surface
      - id: android-touch-x-coordinate-access
      - id: android-touch-y-coordinate-access

  - id: android-view-touch-coordinate-capture
    desc: Touch listener and MotionEvent coordinate-read APIs
    crit: notable
    conf: 0.98
    all:
      - id: android-view-touch-listener-surface
      - id: android-motion-event-coordinate-read
