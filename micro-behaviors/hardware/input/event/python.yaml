defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  mbc: B0015
  attack: T1056.001
  crit: suspicious

traits:
  - id: on-press-eq
    desc: on_press= parameter
    crit: notable
    conf: 0.5
    if:
      type: string_literal
      regex: on_press\s*=
  - id: on-release-eq
    desc: on_release= parameter
    crit: notable
    conf: 0.5
    if:
      type: string_literal
      regex: on_release\s*=
  - id: pynput-import
    desc: "Imports the pynput input library"
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(from\s+pynput|import\s+pynput)\b'
    unless:
      - id: well-known/app/utility/ok-script::ok-script-framework-context
  - id: key-value-write-action
    desc: Writes a keyboard event value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(write|append)\s*\([^)]{0,100}\bkey\.(char|vk|name)\b'
  - id: key-value-send-action
    desc: Sends a keyboard event value
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(send|post)\s*\([^)]{0,100}\bkey\.(char|vk|name)\b'
composite_rules:
  - id: pynput-key-value-write
    desc: Writes a value captured by pynput
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/input/event::pynput-import
      - id: micro-behaviors/hardware/input/event::key-value-write-action
  - id: pynput-key-value-send
    desc: Sends a value captured by pynput
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/input/event::pynput-import
      - id: micro-behaviors/hardware/input/event::key-value-send-action
  - id: pynput-key-value-record
    desc: Records or sends pynput key values
    crit: suspicious
    conf: 0.92
    any:
      - id: micro-behaviors/hardware/input/event::pynput-key-value-write
      - id: micro-behaviors/hardware/input/event::pynput-key-value-send
