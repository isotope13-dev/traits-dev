defaults:
  platforms: [windows, unix]
  for: [svg]

traits:
  - id: svg-document-input-listener
    desc: Adds a document input listener
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'document\s*\.\s*addEventListener\s*\(\s*["'']input["'']'

  - id: svg-window-input-listener
    desc: Adds a window input listener
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'window\s*\.\s*addEventListener\s*\(\s*["'']input["'']'

  - id: svg-oninput-handler
    desc: Assigns an oninput handler
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\boninput\s*='

composite_rules:
  - id: svg-browser-input-event-listener
    desc: SVG input event listener
    crit: notable
    conf: 0.92
    any:
      - id: svg-document-input-listener
      - id: svg-window-input-listener
      - id: svg-oninput-handler
