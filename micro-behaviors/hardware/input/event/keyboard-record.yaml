defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: browser-keyboard-event-record
    desc: Records keyboard key, code and keyCode
    # Match actual reads from one receiver into one record, independent of
    # the receiver and output field names. A shortcut comparison or a record
    # of constant key labels is not keyboard-event recording.
    if:
      type: tree-sitter
      query: |
        ((object
          (pair value: (member_expression object: (identifier) @event1
            property: (property_identifier) @key))
          (pair value: (member_expression object: (identifier) @event2
            property: (property_identifier) @code))
          (pair value: (member_expression object: (identifier) @event3
            property: (property_identifier) @keycode))) @record
          (#eq? @key "key")
          (#eq? @code "code")
          (#eq? @keycode "keyCode")
          (#eq? @event1 @event2)
          (#eq? @event1 @event3))
