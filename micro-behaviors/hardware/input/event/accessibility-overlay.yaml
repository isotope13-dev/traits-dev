defaults:
  platforms: [android]
  for: [java, kotlin]

composite_rules:
  # Matches the capture-and-replay mechanism only; nothing here proves the
  # taps are a PIN, so credential claims stay in credential-access.
  - id: accessibility-overlay-touch-and-gesture
    desc: Accessibility overlay with touch and gesture APIs
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-service-source
      - id: micro-behaviors/ui/window/overlay::android-accessibility-overlay-window-type
      - id: micro-behaviors/hardware/input/accessibility::android-accessibility-gesture-dispatch
    any:
      - id: micro-behaviors/hardware/input/event::android-view-touch-coordinate-capture
      - id: micro-behaviors/hardware/input/event::android-view-touch-listener
