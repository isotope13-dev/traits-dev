defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  mbc: B0015
  attack: T1056.001
  crit: suspicious

composite_rules:
  - id: python-input-library-import
    desc: "Imports an input event library"
    crit: component
    conf: 0.8
    any:
      - id: micro-behaviors/hardware/input/event::import-pyhook
      - id: micro-behaviors/hardware/input/event::import-pywinhook
      - id: micro-behaviors/hardware/input/keyboard/listener::import-keyboard
      - id: micro-behaviors/hardware/input/keyboard/listener::pynput-listener-import
