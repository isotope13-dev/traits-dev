defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.98
traits:
  - id: dex-touch-x-read
    desc: Reads motion event horizontal coordinate
    if:
      type: symbol
      kind: call
      exact: Landroid/view/MotionEvent;->getX
  - id: dex-touch-y-read
    desc: Reads motion event vertical coordinate
    if:
      type: symbol
      kind: call
      exact: Landroid/view/MotionEvent;->getY
