defaults:
  platforms: [android]
traits:
  - id: touch-coordinate-keypad-mapping-call
    desc: Calls coordinate-to-keypad mapping helper
    crit: notable
    conf: 0.96
    for: [java, kotlin, go, rust, c, cpp, dex]
    if:
      type: symbol
      kind: call
      regex: '(?i)^(map|match|resolve|convert).*(touch|coord|[^d]point).*(pin($|_)|digit|keypad|pattern)'

