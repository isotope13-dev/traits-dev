defaults:
  platforms: [macos]
  for: [macho, c, cpp]

traits:
  - id: macos-cgevent-tap-create
    desc: CGEvent tap API name reference
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: CGEventTapCreate

  - id: python-cgevent-tap-create
    desc: Python calls the macOS event-tap API
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)CGEventTapCreate$'
