defaults:
  platforms: [macos]
  for: [macho, c, cpp]

traits:
  # Matched as text, not as an import: cleave recovers no import table for
  # small statically-stubbed Mach-O executables (undefined symbols stay in
  # __LINKEDIT), so a `type: import` spelling silently misses the capability
  # in exactly the compiled binaries that matter. The API name is in the
  # string corpus either way.
  - id: macos-cgevent-tap-create
    desc: macOS CGEvent tap creation
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: CGEventTapCreate
