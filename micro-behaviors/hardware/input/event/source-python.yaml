defaults:
  platforms:
    - unix
    - windows
  for:
    - python
  mbc: B0015
  attack: T1056.001
  crit: suspicious

traits:
  - id: import-pyhook
    desc: import pyHook statement
    crit: suspicious
    conf: 0.6
    platforms:
      - windows
    if:
      type: text
      substr: import pyHook
  - id: from-pyhook
    desc: from pyHook import
    crit: suspicious
    conf: 0.6
    platforms:
      - windows
    if:
      type: string_literal
      substr: from pyHook
  - id: pyhook-hookmanager
    desc: pyHook.HookManager
    crit: suspicious
    conf: 0.7
    platforms:
      - windows
    if:
      type: string_literal
      substr: pyHook.HookManager
  - id: import-pywinhook
    desc: import pyWinhook statement
    crit: suspicious
    conf: 0.6
    platforms:
      - windows
    if:
      type: text
      substr: import pyWinhook
  - id: from-pywinhook
    desc: from pyWinhook import
    crit: suspicious
    conf: 0.6
    platforms:
      - windows
    if:
      type: string_literal
      substr: from pyWinhook
  - id: pywinhook-hookmanager
    desc: pyWinhook.HookManager
    crit: suspicious
    conf: 0.7
    platforms:
      - windows
    if:
      type: string_literal
      substr: pyWinhook.HookManager
composite_rules:
  - id: python-pyhook
    desc: "Python pyHook input hook interface"
    conf: 0.85
    platforms:
      - windows
    any:
      - id: micro-behaviors/hardware/input/event::import-pyhook
      - id: micro-behaviors/hardware/input/event::from-pyhook
      - id: micro-behaviors/hardware/input/event::pyhook-hookmanager
  - id: python-pywinhook
    desc: "Python pyWinhook input hook interface"
    conf: 0.85
    platforms:
      - windows
    any:
      - id: micro-behaviors/hardware/input/event::import-pywinhook
      - id: micro-behaviors/hardware/input/event::from-pywinhook
      - id: micro-behaviors/hardware/input/event::pywinhook-hookmanager
