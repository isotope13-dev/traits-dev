# Browser keyboard-event handling
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript, html]

traits:
  - id: browser-keyboard-event-listener
    desc: Registers a DOM keyboard event listener
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '^([A-Za-z_$][A-Za-z0-9_$]*\.)*addEventListener$'
      arg:
        kind: string
        regex: '^(keydown|keyup|keypress)$'

  # Like inline-user-activity-listener next door: the symbol atom above needs a
  # parsed call graph, and an HTML document yields no symbols -- inline
  # <script> keydown/touch handlers in lure pages are invisible to it. This text
  # form covers that case for the keyboard modality.
  - id: inline-keyboard-event-listener
    desc: Registers a DOM keyboard event listener inline
    for: [html]
    conf: 0.85
    if:
      type: text
      regex: 'addEventListener\s*\(\s*["''](keydown|keyup|keypress)'

  - id: on-keyboard-event-handler
    desc: Registers keyboard event handler with on()
    conf: 0.92
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '\.on\s*\(\s*["''](keydown|keyup|keypress)["'']'
  # Card and banking fields reject spaces while ordinary text welcomes
  # them: a keypress handler testing for char 32 is the collection half
  # of a payment form. Stays notable; the harvest composites add the
  # receiver.
  - id: nospace-keypress-field-guard
    desc: Keypress handler blocks the space bar
    conf: 0.88
    if:
      type: text
      regex: '(?i)keypress[^;}]{0,160}(which|keyCode)\s*==\s*32'

  - id: on-mouse-event-handler
    desc: Registers mouse event handler with on()
    conf: 0.92
    if:
      type: text
      regex: '\.on\s*\(\s*["''](mousemove|mousedown)["'']'

  - id: browser-f12-key-comparison
    desc: Compares browser keyboard event to F12
    conf: 0.9
    if:
      type: text
      regex: '[A-Za-z_$][\w$]*\.key\s*===?\s*["'']F12["'']'
    unless:
      - id: well-known/lib/development/vscode-webview::vscode-webview-bundle
      - id: metadata/package/runtime::vscode-webview-extension
      - id: metadata/package/runtime::vscode-extension

  # Legacy spelling of the F12 test: keyCode/which 123 is F12 on keydown,
  # the key that opens browser developer tools. Pages that compare against
  # it are usually swallowing the DevTools shortcut.
  - id: browser-f12-keycode-comparison
    desc: Compares keyboard keyCode to F12 (123)
    conf: 0.85
    if:
      type: text
      regex: '\b(keyCode|which)\s*===?\s*123\b'

composite_rules:
  - id: browser-keyboard-event-listener-any-form
    desc: Registers a DOM keyboard event listener
    crit: notable
    conf: 0.9
    any:
      - id: browser-keyboard-event-listener
      - id: inline-keyboard-event-listener
