defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
- id: x86-keydown-system-keydown-branch
  desc: x86 branches on keyboard-down message codes
  crit: notable
  conf: 0.95
  if:
    type: hex
    section: .text
    pattern: '81 FA 00 01 00 00 74 ?? 81 FA 04 01 00 00 0F 85'
- id: x86-keydown-system-keydown-branch-upx0
  desc: x86 branches on keyboard-down message codes
  crit: notable
  conf: 0.95
  if:
    type: hex
    section: UPX0
    pattern: '81 FA 00 01 00 00 74 ?? 81 FA 04 01 00 00 0F 85'
composite_rules:
- id: x86-keydown-message-branches
  desc: x86 branches on keyboard-down message codes
  crit: notable
  conf: 0.95
  any:
  - id: x86-keydown-system-keydown-branch
  - id: x86-keydown-system-keydown-branch-upx0
