defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]

traits:
  - id: browser-ctrl-u-shortcut
    desc: Handles Ctrl+U browser shortcut
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '[A-Za-z_$][\w$]*\.(ctrlKey|metaKey).{0,80}[A-Za-z_$][\w$]*\.key.{0,22}[''"][uU][''"]'
  - id: browser-ctrl-shift-inspect-shortcut
    desc: Handles Ctrl+Shift+I/J/C browser shortcuts
    crit: notable
    conf: 0.85
    size_max: 100000
    if:
      type: text
      regex: '[A-Za-z_$][\w$]*\.ctrlKey.{0,40}shiftKey.{0,80}(\.key.{0,22}|\[[^\]]{0,10})[''"][IJC][''"]'
    not:
      - substr: "altKey"
