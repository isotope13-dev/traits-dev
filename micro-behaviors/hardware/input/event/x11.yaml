# Generic X11 event-loop capability.  XInput2 keyboard intent is inferred by
# the keyboard-hook composite, not from XNextEvent alone.
defaults:
  platforms: [linux]
  for: [elf, so, c, cpp]

traits:
  - id: x11-event-queue-read
    desc: Reads the X11 event queue
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: XNextEvent
