# Generic X11 event-queue reads. XNextEvent serves every X client (window
# managers, layout tools, games) — not specifically keyboard hooks. Keylog
# objectives compose this with XISelectEvents / raw-key structs.
defaults:
  platforms: [linux]
  for: [elf, so, c, cpp]

traits:
  - id: x11-read-input-events
    desc: Reads X11 events from the queue
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: XNextEvent
