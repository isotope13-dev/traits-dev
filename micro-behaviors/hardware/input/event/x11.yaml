# Generic X11 event-loop capability.  XInput2 keyboard intent is inferred by
# the keyboard-hook composite, not from XNextEvent alone.
defaults:
  platforms: [linux]
  for: [elf, so, c, cpp]

traits:
  - id: x11-event-queue-read
    desc: Reads the X11 event queue
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: XNextEvent

  - id: x11-xinput-extension
    desc: Queries the XInput extension
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: XIQueryVersion

  - id: x11-select-input-events
    desc: Selects XInput2 device events
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: XISelectEvents

  - id: x11-decode-input-event
    desc: Decodes XInput2 event data
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: XGetEventData

  - id: x11-raw-device-event-xiraw
    desc: Uses X11 raw device event structure
    crit: notable
    conf: 0.9
    if:
      type: text
      word: XIRawEvent

  - id: x11-device-event-structure
    desc: Uses X11 device event structure
    crit: notable
    conf: 0.9
    if:
      type: text
      word: XIDeviceEvent

composite_rules:
  - id: x11-read-input-events
    desc: Reads selected XInput2 events from queue
    crit: notable
    conf: 0.95
    all:
      - id: x11-event-queue-read
      - id: x11-xinput-extension
      - id: x11-select-input-events
