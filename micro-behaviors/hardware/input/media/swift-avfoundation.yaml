defaults:
  platforms: [macos, ios]
  for: [swift]
  crit: notable
  conf: 0.97

traits:
  - id: swift-avfoundation-capture-session-create
    desc: Creates an AVFoundation capture session
    if:
      type: symbol
      kind: call
      regex: '^(AVFoundation\.+)?AVCaptureSession$'
  - id: swift-media-permission-request
    desc: Requests camera or microphone access
    if:
      type: symbol
      kind: call
      regex: '(^|\.)AVCaptureDevice\.+requestAccess$'
  - id: swift-media-permission-check
    desc: Checks camera or microphone authorization
    if:
      type: symbol
      kind: call
      regex: '(^|\.)AVCaptureDevice\.+authorizationStatus$'
