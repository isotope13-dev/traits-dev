defaults:
  platforms: [macos, ios]
traits:
  - id: avfoundation-device-import
    desc: Imports an AVFoundation audio/video device
    crit: notable
    conf: 0.9
    for: [macho]
    if:
      type: import
      exact: AVCaptureDevice

  - id: avfoundation-device-source-reference
    desc: References AVFoundation audio/video devices
    crit: notable
    conf: 0.85
    for: [swift, objc, c, cpp]
    if:
      type: text
      substr: AVCaptureDevice
