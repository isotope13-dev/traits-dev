# Browser media acquisition: microphone, camera, or both, as selected by options.
# Neutral mechanic: navigator.mediaDevices.getUserMedia is the canonical web
# API for accessing the webcam/microphone. Legitimate in video chat, audio
# transcription, QR scanning, etc. Lure/exfiltration intent is composed in
# objectives/ by pairing this with meeting-brand lures + media upload loops.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]

traits:
  - id: browser-media-capture-api
    desc: References the browser media-capture API
    crit: notable
    conf: 0.92
    if:
      # Include legacy Firefox/Chrome APIs and member references used when
      # installing compatibility shims. Quoted examples are not API use.
      # A single observation covers both member reads and bare API calls.
      # The symbol projection requires a separate kind for each surface.
      type: tree-sitter
      query: |
        ([
          (member_expression) @api
          (call_expression function: (identifier) @api)
        ]
        (#match? @api "^(navigator[ \t]*[.][ \t]*)?(mediaDevices[ \t]*[.][ \t]*)?(getUserMedia|webkitGetUserMedia|mozGetUserMedia)$"))
