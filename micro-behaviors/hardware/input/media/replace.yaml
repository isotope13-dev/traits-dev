defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: get-user-media-function-replacement
    desc: Replaces a getUserMedia method with a function
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((assignment_expression
          left: (member_expression property: (property_identifier) @api)
          right: [(function_expression) (arrow_function)])
          (#eq? @api "getUserMedia"))
