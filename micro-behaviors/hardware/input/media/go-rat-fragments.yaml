defaults:
  platforms: [windows]
  for: [pe]

traits:
- id: ffmpeg-command-reference
  desc: FFmpeg command construction reference
  crit: component
  conf: 0.92
  if:
    type: text
    substr: ffmpeg

- id: dshow-input-reference
  desc: DirectShow media input reference
  crit: component
  conf: 0.92
  if:
    type: text
    substr: dshow

- id: go-webcam-enumeration-routine
  desc: Go webcam enumeration routine name
  crit: component
  conf: 0.92
  if:
    type: symbol
    exact: main.getWebcams

- id: go-microphone-enumeration-routine
  desc: Go microphone enumeration routine name
  crit: component
  conf: 0.92
  if:
    type: symbol
    exact: main.getMics

- id: webcam-microphone-fragments
  desc: "Webcam or microphone control tokens"
  crit: notable
  conf: 0.85
  if:
    type: text
    # Require the short `mic_` token to begin an identifier; otherwise this
    # matches ordinary runtime symbols such as `atomic_start`.
    regex: 'webcam_(s|l)|(^|[^A-Za-z0-9_])mic_(star|stop)'
  unless:
    - id: well-known/lib/native/openmp::gnu-openmp-runtime-dll

composite_rules:
- id: ffmpeg-dshow-audio-video-input-template
  desc: FFmpeg DirectShow input selects both video and audio devices
  crit: notable
  conf: 0.94
  all:
  - id: ffmpeg-command-reference
  - id: dshow-input-reference
  - id: go-webcam-enumeration-routine
  - id: go-microphone-enumeration-routine
