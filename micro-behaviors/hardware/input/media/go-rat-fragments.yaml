defaults:
  platforms: [windows]
  for: [pe]
  attack: T1113

traits:
- id: webcam-microphone-fragments
  desc: "Webcam or microphone control tokens"
  crit: notable
  conf: 0.85
  if:
    type: text
    # Require the short `mic_` token to begin an identifier; otherwise this
    # matches ordinary runtime symbols such as `atomic_start`.
    regex: 'webcam_(s|l)|(^|[^A-Za-z0-9_])mic_(star|stop)'
  unless:
    - id: well-known/lib/native/openmp::gnu-openmp-runtime-dll
