defaults:
  platforms: [android]
  for: [android_apk, zip]
  crit: component
  conf: 0.88
  attack: T1123

composite_rules:
  - id: android-recording-api-or-audio-authority
    desc: "Android media recording or audio authority"
    for: [android_apk, zip, dex, xml]
    crit: notable
    conf: 0.9
    unless:
      - id: well-known/app/system/ankidroid::package-member
    any:
      - id: micro-behaviors/data/stream/record::android-media-recorder-reference
      - id: micro-behaviors/hardware/input/audio::android-record-audio-permission
      - id: micro-behaviors/hardware/input/audio::android-voice-recorder-class
