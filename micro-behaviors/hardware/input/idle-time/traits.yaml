defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, powershell, pe, elf]

traits:
  - id: get-last-input-info
    desc: Windows GetLastInputInfo idle-state API
    crit: notable
    conf: 0.7
    for: [powershell, pe, python, javascript]
    platforms: [windows]
    if:
      type: text
      substr: GetLastInputInfo

  - id: get-idle-time
    desc: GetIdleTime function reference
    crit: component
    conf: 0.7
    if:
      type: text
      regex: (?i)\bget.?idle.?time\b

composite_rules:
  - id: user-input-idle-query
    desc: Queries elapsed time since the user's last input
    crit: notable
    conf: 0.8
    unless:
      - id: metadata/package/quality/benign-context::stacksjs-stx-framework-context
    any:
      - id: get-last-input-info
      - id: get-idle-time
