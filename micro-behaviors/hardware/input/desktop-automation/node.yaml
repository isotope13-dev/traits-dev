# Individual desktop-input synthesis actions. Kept in one technique directory
# so consumers can require any action without enumerating library APIs.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: nut-js-mouse-position-call
    desc: Moves the pointer through nut-js
    if:
      type: symbol
      kind: call
      exact: mouse.setPosition

  - id: nut-js-mouse-click-call
    desc: Synthesizes a mouse click through nut-js
    if:
      type: symbol
      kind: call
      exact: mouse.click

  - id: nut-js-keyboard-press-call
    desc: Synthesizes a key press through nut-js
    if:
      type: symbol
      kind: call
      exact: keyboard.pressKey

  - id: nut-js-keyboard-release-call
    desc: Synthesizes a key release through nut-js
    if:
      type: symbol
      kind: call
      exact: keyboard.releaseKey
