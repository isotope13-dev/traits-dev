defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
traits:
- id: node-event-pointer-coordinates
  desc: Event coordinates move the desktop pointer
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: |-
      ((program
        (lexical_declaration (variable_declarator name: (identifier) @io
          value: (call_expression function: (identifier) @require
            arguments: (arguments . (string) @module .))))
        (lexical_declaration (variable_declarator name: (identifier) @socket
          value: (call_expression function: (identifier) @connect
            arguments: (arguments . (string) @url .))))
        (expression_statement
      (call_expression function: (member_expression object: (identifier) @listener property: (property_identifier) @on)
        arguments: (arguments . (string) . (arrow_function
          parameters: (formal_parameters . (identifier) @input .)
          body: (statement_block
            (lexical_declaration (variable_declarator
              name: (object_pattern . (shorthand_property_identifier_pattern) @x
                . (shorthand_property_identifier_pattern) @y .)
              value: (identifier) @received))
            (expression_statement (await_expression
              (call_expression function: (member_expression object: (identifier) @mouse
                property: (property_identifier) @set)
                arguments: (arguments . (new_expression constructor: (identifier) @point
                  arguments: (arguments . (identifier) @px . (identifier) @py .)) .)))))))))) @operation
        (#eq? @on "on") (#eq? @input @received)
        (#eq? @mouse "mouse") (#eq? @set "setPosition") (#eq? @point "Point")
        (#eq? @x @px) (#eq? @y @py)
        (#eq? @require "require") (#match? @module "^[\"']socket\\.io-client[\"']$")
        (#eq? @io @connect) (#match? @url "^[\"']https?://")
        (#eq? @socket @listener))
