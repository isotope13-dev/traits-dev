defaults:
  platforms: [windows, unix]
  for: [rust]

traits:
  - id: unix-input-devices-proc
    desc: "Unix input device inventory path"
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /proc/bus/input/devices
  - id: unix-evdev-input-path
    desc: "Unix input event device path"
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /dev/input/event
  - id: rust-dev-input-dir
    desc: "Input device directory reference"
    crit: notable
    conf: 0.9
    platforms: [unix]
    if:
      type: text
      substr: '"/dev/input"'
composite_rules:
  - id: rust-input-device-inventory-paths
    desc: "Input-device inventory and event path references"
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/input/device::unix-input-devices-proc
      - id: micro-behaviors/hardware/input/device::unix-evdev-input-path
  - id: rust-input-device-name-filter
    desc: "Input-device path and event-name filter"
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/input/device::rust-dev-input-dir
      - id: micro-behaviors/data/string/compare::rust-event-prefix-test
  - id: rust-input-device-paths
    desc: "Input-device path selection references"
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/hardware/input/device::rust-input-device-name-filter
      - id: micro-behaviors/hardware/input/device::rust-input-device-inventory-paths
