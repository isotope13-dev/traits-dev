# A raw input monitor is dual-use by itself. Combining its getevent device
# capture with the kernel's X/Y multitouch codes establishes coordinate
# collection; pairing that capture with a remotely tasked self-enrolled ADB
# shell supports touch collection. Typed keys require separate mapping evidence.
defaults:
  platforms: [android]
  for: [source, binaries]
  attack: T1056.001,T1417.001

composite_rules:
  - id: android-raw-touch-coordinate-capture
    desc: Captures raw Android touch coordinates
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/hardware/input/device::android-getevent-device-capture
      - id: micro-behaviors/hardware/input/device::android-multitouch-position-event-pair
