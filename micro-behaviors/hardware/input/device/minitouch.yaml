# The path is tooling evidence, not proof that a touch event was injected.
defaults:
  platforms: [android]
  for: [source, binaries]
  crit: notable
  conf: 0.98
traits:
  - id: android-staged-minitouch-path
    desc: Android shell-staged minitouch path
    if:
      type: text
      regex: '/data/local/tmp/minitouch\b'
