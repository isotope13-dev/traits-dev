# HID devices include programmable boards, not just keyboards and mice.
# This is host-to-device I/O, not input collection or keylogging.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: winrt-hid-output-report
    desc: Calls WinRT HID output-report API
    if:
      # Calls on `this.dev` do not retain a symbol target in current facts.
      # The call node excludes quoted examples and comments.
      type: tree-sitter
      query: |
        (call_expression
          function: (member_expression
            property: (property_identifier) @method
            (#eq? @method "sendOutputReportAsync"))) @call
