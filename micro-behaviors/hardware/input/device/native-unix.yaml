# Reads from Plan 9's keyboard event device. GUI and terminal applications
# consume this stream to implement ordinary input; reading it does not show
# that the program records or stages keystrokes.
defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]

composite_rules:
  - id: dev-kbd-event-read
    desc: Reads the /dev/kbd keyboard event stream
    crit: notable
    conf: 0.92
    for: [c, cpp, elf]
    near_lines: 40
    all:
      - id: micro-behaviors/fs/path/device/special::dev-kbd-path
      - id: micro-behaviors/fs/read/file/descriptor::read

  - id: hex-dev-kbd-nonblocking-open
    desc: Opens the keyboard event device through a hex path
    crit: notable
    conf: 0.9
    for: [c, cpp, objc]
    all:
      - id: micro-behaviors/fs/path/device/special::native-hex-dev-kbd-path
      - id: micro-behaviors/fs/file/open::open-o-nonblock-source
