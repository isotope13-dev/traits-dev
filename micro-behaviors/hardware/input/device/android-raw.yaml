# Raw Android/Linux input capture used by shell-context agents. The getevent
# tool is legitimate in diagnostics, so these are capability observations;
# collection intent is assembled under objectives/collection/keylog/device/.
defaults:
  platforms: [android, linux]
  for: [shell, source, dex, elf, so, apk, zip]
  crit: notable
  conf: 0.96
  attack: T1056.001

traits:
  - id: android-getevent-device-capture
    desc: Captures Android raw input events
    conf: 0.98
    if:
      type: text
      regex: '(?i)(shell(,v2,raw)?:)?getevent[^\n/]{0,24}/dev/input/event[0-9*%{}a-zA-Z_.-]*'

  # The kernel reports a touch's X and Y as two ABS_MT position codes emitted
  # together for each contact. Requiring both near each other identifies code
  # that parses raw multitouch coordinates rather than merely mentioning one.
  - id: android-mt-position-x-code
    desc: Raw multitouch X position code
    crit: component
    conf: 0.95
    if:
      type: text
      substr: ABS_MT_POSITION_X

  - id: android-mt-position-y-code
    desc: Raw multitouch Y position code
    crit: component
    conf: 0.95
    if:
      type: text
      substr: ABS_MT_POSITION_Y

  - id: android-keypad-geometry-mapping
    desc: Maps input coordinates to keypad geometry
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(keypad|pinpad)[A-Za-z0-9_]*(layout|geometry)\b'

composite_rules:
  - id: android-multitouch-position-event-pair
    desc: Parses raw multitouch position events
    conf: 0.99
    all:
      - id: android-mt-position-x-code
      - id: android-mt-position-y-code
    near_bytes: 256
