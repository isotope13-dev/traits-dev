# Source-level USB device emulation.  This is a neutral hardware capability;
# the privilege-escalation objective layer supplies the PnP installer context.
defaults:
  platforms: [linux, windows]
  for: [python]
  crit: notable
  conf: 0.94

traits:
  - id: facedancer-framework-import
    desc: Imports the FaceDancer USB emulation framework
    crit: notable
    conf: 0.98
    if:
      type: import
      exact: facedancer

  - id: usb-device-emulation-class
    desc: Defines a USB device emulation class
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?im)^\s*class\s+[A-Za-z_][A-Za-z0-9_]*\s*\(.{0,80}\bUSBDevice\b.{0,40}\)\s*:'

  - id: usb-composite-interface-definitions
    desc: Defines USB config/interface emulation classes
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?im)^\s*class\s+[A-Za-z_][A-Za-z0-9_]*\s*\(USB(Configuration|Interface|Endpoint)\)\s*:'

  - id: usb-device-disconnect-call
    desc: FaceDancer device or backend disconnect call
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      # Do not turn unrelated application shutdown calls (for example
      # `self.manager.disconnect()`) into USB behavior. FaceDancer examples
      # disconnect the emulated device or its USB backend/board.
      regex: '(?i)\.(usb[_-]?device|device|backend|board)\.disconnect$'

composite_rules:
  - id: facedancer-usb-composite-emulation
    desc: FaceDancer emulates a composite USB device
    crit: suspicious
    conf: 0.99
    all:
      - id: facedancer-framework-import
      - id: usb-device-emulation-class
      - id: usb-composite-interface-definitions
      - id: usb-device-disconnect-call
