# Out-of-band KVM-over-IP console device identifier.
#
# A KVM-over-IP device (PiKVM, TinyPilot, etc.) attaches keyboard/video/mouse
# to a machine and exposes the console over the network at the hardware level:
# the operator gets control before the OS boots, with no software installed and
# nothing in the OS's own process/socket telemetry. Normal homelab/server gear,
# but on an employee workstation it is the classic "laptop-farm" remote-worker
# fraud signal -- the physical operator is somewhere else. Detected from the
# device's FriendlyName / device_description as it appears in USB enumeration
# and Windows Security Event 6416 artifacts (the value a defender greps for in
# HKLM\SYSTEM\CurrentControlSet\Enum\USB). "PiKVM" is a fixed, widely-reused
# product name, not English prose. Covert-presence intent is composed in
# objectives/collection/ by pairing this with camera or stream-redirection.
defaults:
  platforms: [windows]
  for: [text]
  crit: notable
  conf: 0.95

traits:
  - id: pikvm-kvm-over-ip-device
    desc: PiKVM KVM-over-IP console device
    crit: suspicious
    if:
      type: text
      word: PiKVM
