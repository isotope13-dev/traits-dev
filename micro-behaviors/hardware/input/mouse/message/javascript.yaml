# Mouse event names carried as string literals. Remote-control agents send
# them over a socket, and so do embedding APIs that relay pointer events
# between frames (Jitsi's external API emits `mouseMove`).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1056
traits:
- id: mousemove-event-name-literal
  desc: mouseMove event-name string literal
  crit: notable
  if:
    type: string_literal
    exact: mouseMove
