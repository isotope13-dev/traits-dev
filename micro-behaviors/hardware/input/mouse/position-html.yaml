defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.9
traits:
  - id: inline-pointer-client-coordinate-read
    desc: Inline script reads pointer client coordinates
    if:
      type: text
      exclude_html_comments: true
      regex: '\b[A-Za-z_$][\w$]*\.client[XY]\b'

composite_rules:
  - id: browser-pointer-client-coordinate-read
    desc: Browser script reads pointer client coordinates
    for: [html, javascript, typescript]
    any:
      - id: inline-pointer-client-coordinate-read
      - id: dom-pointer-client-coordinate-read
