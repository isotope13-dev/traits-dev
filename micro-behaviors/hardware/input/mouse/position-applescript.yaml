# AppleScript System Events reports the pointer location with
# "get position of mouse". A single read is a neutral input capability used by
# GUI automation and accessibility tools. Sandbox gating needs repeated samples
# compared over time, so that claim belongs to a composite with a poll loop.
defaults:
  platforms: [macos]
  for: [macho, shell]
  crit: notable
  conf: 0.9

traits:
  - id: applescript-mouse-position-read
    desc: AppleScript pointer-position read
    if:
      type: text
      substr: get position of mouse
