defaults:
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: set-system-cursor
    desc: Replaces Windows system cursor image
    for: [pe, dll, csharp, python, c, cpp]
    if:
      type: text
      word: SetSystemCursor

  - id: show-cursor-hide-python
    desc: Hides Windows cursor via ShowCursor
    for: [python]
    if:
      type: text
      regex: 'ShowCursor\s*\(\s*False\s*\)'

composite_rules:
  - id: hide-system-cursor
    desc: Replaces or hides the Windows system cursor
    for: [pe, dll, csharp, python, c, cpp]
    any:
      - id: set-system-cursor
      - id: show-cursor-hide-python
