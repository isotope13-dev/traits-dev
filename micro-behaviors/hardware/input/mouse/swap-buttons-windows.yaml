defaults:
  platforms: [windows]
  for: [batch, powershell, text]
  crit: notable
  conf: 0.94

traits:
  - id: rundll32-swap-mouse-button
    desc: RUNDLL32 names SwapMouseButton
    # This identifies the invoked user32 export and its API-level operation;
    # it does not establish whether RUNDLL32's call completed successfully.
    if:
      type: text
      regex: '(?i)\brundll32(\.exe)?\s+user32(\.dll)?,\s*SwapMouseButton\b'
