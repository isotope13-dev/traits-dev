defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  attack: T1056
  conf: 0.82
traits:
- id: windows-mouse-message-constants--rx-1
  desc: Matches 'LBUTTONDOWN'
  crit: notable
  if:
    type: text
    regex: ^WM_(MOUSEMOVE|LBUTTONDOWN)$
- id: windows-mouse-message-constants--rx-2
  desc: Matches 'RBUTTONDOWN'
  crit: notable
  if:
    type: text
    regex: ^WM_(LBUTTONUP|RBUTTONDOWN)$
- id: windows-mouse-message-constants--rx-3
  desc: Matches 'MOUSEWHEEL'
  crit: notable
  if:
    type: text
    regex: ^WM_(RBUTTONUP|MOUSEWHEEL)$
composite_rules:
- id: windows-mouse-message-constants
  desc: Windows mouse input message constants
  crit: component
  any:
  - id: micro-behaviors/hardware/input/mouse::windows-mouse-message-constants--rx-1
  - id: micro-behaviors/hardware/input/mouse::windows-mouse-message-constants--rx-2
  - id: micro-behaviors/hardware/input/mouse::windows-mouse-message-constants--rx-3
