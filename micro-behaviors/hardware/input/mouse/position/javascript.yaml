# DOM MouseEvent and PointerEvent expose viewport-relative coordinates through
# clientX/clientY. Reading either property is a neutral input capability used
# by ordinary UI effects as well as activity-aware logic; intent comes only
# from composites that combine it with consequential behavior.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: dom-pointer-client-coordinate-read
    desc: Reads a DOM pointer client coordinate
    if:
      type: symbol
      kind: member
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.client[XY]$'
