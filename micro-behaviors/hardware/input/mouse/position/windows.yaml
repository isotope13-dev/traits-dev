# Native Win32 cursor-position read. Moved here from keyboard/hook/: GetCursorPos
# is a mouse API and installs no hook. See python.yaml in this directory for why
# a single positional read is not by itself sandbox detection.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: get-cursor-pos
    desc: Windows cursor-position API import
    crit: notable
    conf: 0.85
    if:
      type: import
      exact: GetCursorPos
    unless:
      - id: well-known/game/mod/
    downgrade:
      any:
        - id: metadata/binary/symbols/count::many-imports-50
        - id: metadata/binary/framework::dotnet-metadata
        - id: well-known/lib/web/dioxus
