defaults:
  platforms: [linux]
  for: [binaries, scripts]
  attack: T1059.004

traits:
  - id: xdotool-mouse-injection
    desc: xdotool mouse event injection
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '(?i)\b(/usr/bin/)?xdotool\s+(mousemove|click|mousedown|mouseup)\b'
    downgrade:
      any:
        - type: basename
          exact: lirc-config-tool
    unless:
      - id: well-known/app/system/lnxlink::lnxlink-source-module
      - id: well-known/app/development/novita-sandbox::sdk-package-context
      - id: well-known/lib/core/omdev::omdev-library
