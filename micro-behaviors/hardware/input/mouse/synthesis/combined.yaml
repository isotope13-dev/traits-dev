defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: comprehensive-user-input-synthesis
    desc: Keyboard and mouse input synthesis suite
    crit: suspicious
    conf: 0.9
    all:
      - id: synthetic-user-input
      - id: mouse-event
    unless:
      # A Windows-API reimplementation or language binding exposes
      # mouse_event/keybd_event rather than driving synthetic input itself.
      - id: well-known/app/system/reactos::system-component
      - id: metadata/binary/vendor::windows-system-implementer-dll
      - id: metadata/library/pywin32::pywin32-binding-module
