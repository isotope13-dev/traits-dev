defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
  attack: T1056
traits:
  - id: mouse-event
    desc: Synthesize mouse input events
    crit: notable
    conf: 0.82
    if:
      type: text
      exact: mouse_event
  - id: mouse-event-src
    desc: mouse_event P/Invoke declaration
    crit: notable
    conf: 0.82
    for: [csharp]
    if:
      type: text
      substr: mouse_event
composite_rules:
  - id: synthetic-user-input
    desc: Synthesize keyboard and mouse input
    crit: suspicious
    conf: 0.88
    all:
      - id: mouse-event
      - id: micro-behaviors/hardware/input/keyboard/hook::keybd-event
    unless:
      # user32 is where mouse_event/keybd_event live. A Windows-API
      # reimplementation (Wine, ReactOS) exports them rather than calling them.
      - id: well-known/app/system/reactos::system-component
      - id: metadata/binary/vendor::windows-system-implementer-dll
      - id: metadata/library/pywin32::pywin32-binding-module
      # A compiled AutoIt script is the stock AutoIt3 interpreter with the
      # script appended as a resource. The interpreter links user32's whole
      # input surface -- mouse_event, keybd_event, SendInput, BlockInput --
      # to back its MouseClick/Send builtins, so every AutoIt-compiled EXE
      # imports both names whatever the script does. Constant across the
      # format, so it separates nothing; AutoIt abuse is caught by the
      # embedded script and the behaviour it actually performs.
      - id: metadata/lang/compiled::autoit-compiled-script
  - id: synthetic-user-input-src
    desc: Remote input control in C# source
    crit: suspicious
    conf: 0.88
    for: [csharp]
    all:
      - id: mouse-event-src
      - id: micro-behaviors/hardware/input/keyboard/poll::keybd-event-pinvoke
