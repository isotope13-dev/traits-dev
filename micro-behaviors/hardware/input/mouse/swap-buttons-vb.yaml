# VB Declare / DllImport of user32!SwapMouseButton. The declaration names
# the API that exchanges the primary and secondary buttons; it does not show
# the call ran or which state it requested.
defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable

traits:
  - id: vb-swap-mouse-button-declare
    desc: VB declares the SwapMouseButton API
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bFunction\s+SwapMouseButton\s*(Lib\b|\()'
