# Python mouse control through the pyautogui desktop-automation library.
#
# pyautogui exposes the cursor and buttons as module-level functions
# (moveTo, dragTo, click, doubleClick, scroll). Callers usually bind the
# module to its conventional `pya` alias, so the matcher accepts either
# receiver and keys on the distinctive method names. Matching the structured
# call target keeps this off comments and string constants that merely
# mention clicking; cursor-position reads stay in mouse/position/.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.86
traits:
  - id: pyautogui-mouse-action
    desc: Controls mouse through pyautogui
    if:
      type: symbol
      kind: call
      regex: '^(pyautogui|pya)\.(click|doubleClick|moveTo|dragTo|scroll)$'
