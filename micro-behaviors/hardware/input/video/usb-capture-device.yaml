# USB HDMI capture dongle presented to the OS as a webcam.
#
# "Guermok USB3 Video" is a cheap USB capture card that registers as a UVC
# video device, so any externally-supplied video can be fed into the machine as
# though it were the built-in camera -- the standard hardware for masking the
# real camera feed and impersonating presence in remote-worker / interview /
# conferencing fraud. Detected from the FriendlyName / device_description or
# the VID/PID pair in USB enumeration and Windows Security Event 6416
# artifacts. "Guermok" is the hardware vendor string, not English prose.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, data, registry, -text, -objectivec, -swift,
        -groovy, -scala, -zig, -elixir, -clojure]
  crit: notable
  conf: 0.95

traits:
  - id: guermok-usb-video-capture
    desc: Guermok USB video capture device
    if:
      type: text
      word: Guermok

  - id: usb-video-capture-id-345f-2130
    desc: USB video capture device identifier 345f:2130
    if:
      type: text
      regex: '(?i)(VID[_:= -]?345F.{0,32}PID[_:= -]?2130|\b345F:2130\b)'

composite_rules:
  - id: guermok-linked-usb-video-capture
    desc: Guermok-linked USB video capture device
    crit: notable
    any:
      - id: guermok-usb-video-capture
      - id: usb-video-capture-id-345f-2130
