# These metadata names describe the DirectShow frame-input API. Ordinary
# webcam applications carry them too; surveillance requires separate context.
defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.96
traits:
  - id: dotnet-directshow-video-device-type
    desc: DirectShow video capture device type reference
    if:
      type: text
      exact: VideoCaptureDevice
      section: .text
  - id: dotnet-directshow-namespace
    desc: AForge DirectShow video input namespace
    if:
      type: text
      exact: AForge.Video.DirectShow
      section: .text
  - id: dotnet-new-frame-subscription
    desc: Managed video frame event subscription reference
    if:
      type: text
      exact: add_NewFrame
      section: .text
composite_rules:
  - id: dotnet-directshow-frame-input
    desc: DirectShow video device and frame event APIs
    all:
      - id: dotnet-directshow-video-device-type
      - id: dotnet-directshow-namespace
      - id: dotnet-new-frame-subscription
