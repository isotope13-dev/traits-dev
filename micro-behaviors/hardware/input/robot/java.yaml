defaults:
  platforms:
    - unix
    - windows
  for:
    - java
    - class
    - jar
    - zip
traits:
  - id: java-awt-robot
    desc: Reference to java.awt.Robot
    crit: notable
    if:
      type: text
      substr: java/awt/Robot
  - id: java-awt-robot-import
    desc: Imports java.awt.Robot
    crit: notable
    conf: 0.84
    for: [java]
    if:
      type: symbol
      kind: import
      exact: java.awt.Robot
  - id: jvm-awt-robot-class-ref
    desc: JVM AWT Robot class reference
    crit: notable
    conf: 0.9
    for: [class, jar, zip]
    if:
      type: value
      path: class.class_refs[*]
      exact: java/awt/Robot
  - id: jvm-awt-key-press
    desc: JVM AWT key press method
    crit: component
    if:
      type: symbol
      kind: import
      exact: keyPress
  - id: jvm-awt-key-release
    desc: JVM AWT key release method
    crit: component
    if:
      type: symbol
      kind: import
      exact: keyRelease
  - id: jvm-awt-mouse-move
    desc: JVM AWT mouse move method
    crit: component
    if:
      type: symbol
      kind: import
      exact: mouseMove
  - id: jvm-awt-mouse-press
    desc: JVM AWT mouse press method
    crit: component
    if:
      type: symbol
      kind: import
      exact: mousePress
  - id: jvm-awt-mouse-release
    desc: JVM AWT mouse release method
    crit: component
    if:
      type: symbol
      kind: import
      exact: mouseRelease
  - id: jvm-awt-mouse-wheel
    desc: JVM AWT mouse wheel method
    crit: component
    if:
      type: symbol
      kind: import
      exact: mouseWheel

composite_rules:
  - id: jvm-awt-input-synthesis-methods
    desc: JVM synthesizes keyboard and mouse input
    crit: notable
    conf: 0.96
    for: [class, java_class, jar, zip]
    needs: 5
    any:
      - id: jvm-awt-key-press
      - id: jvm-awt-key-release
      - id: jvm-awt-mouse-move
      - id: jvm-awt-mouse-press
      - id: jvm-awt-mouse-release
      - id: jvm-awt-mouse-wheel
