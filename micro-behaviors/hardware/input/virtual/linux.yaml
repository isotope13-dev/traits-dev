defaults:
  platforms: [linux]
  for: [python]
  crit: notable
  conf: 0.96

traits:
  - id: python-uinput-device-open
    desc: Python opens the Linux virtual input device
    if:
      type: symbol
      kind: call
      regex: '(^|\.)open$'
      arg:
        index: 0
        kind: string
        regex: '^/dev/(input/)?uinput$'

  - id: python-uinput-device-create-ioctl
    desc: Python invokes virtual-input creation ioctl
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ioctl$'
      arg:
        index: 1
        kind: identifier
        name: UI_DEV_CREATE
