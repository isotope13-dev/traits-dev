# Low-level GPU memory-access structures. Intent is added by objective
# composites that require a concrete access schedule.
defaults:
  platforms: [linux, windows]
  for: [c, cpp, python]

traits:
  - id: nvidia-ptx-l2-line-discard
    desc: PTX L2 cache-line discard
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\bdiscard\.global\.L2\s*\[[^\]\r\n]{1,80}\]\s*,\s*128\s*;'

  - id: nvidia-ptx-volatile-global-load
    desc: PTX volatile global-memory load
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\bld\.(u|b)(8|16|32|64)\.global\.volatile\b'

  - id: cuda-warp-index-from-thread
    desc: CUDA warp index derivation
    crit: baseline
    conf: 0.97
    if:
      type: text
      regex: '\bthreadIdx\.x\s*/\s*(32|warpSize)\b'

  - id: cuda-lane-index-from-thread
    desc: CUDA lane index derivation
    crit: baseline
    conf: 0.97
    if:
      type: text
      regex: '\bthreadIdx\.x\s*%\s*(32|warpSize)\b'

composite_rules:
  - id: nvidia-ptx-l2-discard-volatile-reload
    desc: PTX L2 discard and volatile reload
    crit: notable
    conf: 0.98
    near_lines: 5
    all:
      - id: nvidia-ptx-l2-line-discard
      - id: nvidia-ptx-volatile-global-load

  - id: cuda-warp-lane-indexing
    desc: CUDA warp and lane index derivation
    crit: baseline
    conf: 0.97
    near_lines: 4
    all:
      - id: cuda-warp-index-from-thread
      - id: cuda-lane-index-from-thread
