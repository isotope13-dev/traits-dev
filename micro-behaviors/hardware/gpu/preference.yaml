# Discrete-GPU preference exports. On a hybrid-graphics laptop the driver picks
# the integrated GPU unless the executable exports one of two documented
# symbols: NVIDIA Optimus reads `NvOptimusEnablement`, AMD PowerXpress reads
# `AmdPowerXpressRequestHighPerformance`. Any application that wants the
# discrete adapter declares them -- game engines, video editors, CAD, and
# OBS Studio's `obs-amf-test.exe` encoder probe.
#
# They previously lived in the Unity brand-masquerade file and were described
# as "Unity ... GPU export", which told an analyst a Unity claim had been
# observed when only a vendor-documented opt-in symbol had. Neutral capability
# here; the masquerade inference stays in the composite that pairs it with
# actual Unity evidence.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95

traits:
  - id: nvidia-optimus-enablement-export
    desc: NvOptimusEnablement discrete-GPU export
    if:
      type: text
      exact: NvOptimusEnablement
  - id: amd-powerxpress-high-perf-export
    desc: AmdPowerXpressRequestHighPerformance export
    if:
      type: text
      exact: AmdPowerXpressRequestHighPerformance

composite_rules:
  - id: discrete-gpu-preference-export
    desc: Requests the discrete GPU via vendor export
    crit: notable
    conf: 0.95
    any:
      - id: nvidia-optimus-enablement-export
      - id: amd-powerxpress-high-perf-export
