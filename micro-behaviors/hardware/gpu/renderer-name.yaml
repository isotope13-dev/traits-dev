# JavaScript checks of the GPU/renderer string for software or VM adapter
# names. Headless Chrome reports SwiftShader, Mesa software rendering reports
# llvmpipe/softpipe, and guest drivers report VirtualBox or VMware.
# Graphics libraries make the same check to label a fallback adapter
# (luma.gl's WebGPU device sets gpu: 'software' on /SwiftShader/i.test), so
# the name check alone is hardware identification. Evasion composites in
# objectives/anti-analysis/vm-detect/artifact/javascript.yaml add the gate
# context (redirects, obfuscation, withheld downloads).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: js-virtual-gpu-name-regex-test
    desc: Regex tests software or VM GPU names
    conf: 0.9
    if:
      type: text
      regex: '(?i)/(swiftshader|llvmpipe|softpipe|virtualbox|vmware)/i?\s*(\.test\b|\[)'
  # Software-renderer names only occur in GPU strings. VMware/VirtualBox
  # also name DMI/BIOS models that hardware-inventory libraries (e.g.
  # systeminformation's system.js) report as a `virtual` field, so those
  # vendor names count only when the searched value is GPU/renderer data.
  - id: js-virtual-gpu-name-string-search
    desc: String search for software GPU renderer names
    conf: 0.88
    if:
      type: text
      regex: '(?i)\.(includes|indexOf)\(\s*["''](swiftshader|llvmpipe|softpipe)'
  - id: js-vm-vendor-gpu-string-search
    desc: GPU renderer string searched for VM vendor
    conf: 0.88
    if:
      type: text
      regex: '(?i)(gpu|renderer|webgl)\w*[^\n]{0,60}\.(includes|indexOf)\(\s*["''](virtualbox|vmware)'
