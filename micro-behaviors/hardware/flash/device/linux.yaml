defaults:
  for:
  - elf
  - shell
  - python
  platforms:
  - linux
  - unix
  - windows
  - macos
  - ios
  - android
traits:
- id: firmware-sysupgrade-marker
  desc: Firmware sysupgrade marker
  crit: component
  conf: 0.9
  platforms: [linux]
  if:
    type: text
    substr: sysupgrade
- id: firmware-mtd-helper-marker--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.9
  platforms: [linux]
  if:
    type: text
    substr: find_mtd_part
  count_max: 1006904
- id: firmware-mtd-helper-marker--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.9
  platforms: [linux]
  if:
    type: text
    substr: nand_do_upgrade
  count_max: 1006905
- id: firmware-mtd-helper-marker--rx-3
  desc: Regex component marker
  crit: component
  conf: 0.9
  platforms: [linux]
  if:
    type: text
    substr: CI_UBIPART
  count_max: 1006906
- id: firmware-platform-marker--rx-4
  desc: Regex component marker
  crit: component
  conf: 0.9
  platforms: [linux]
  if:
    type: text
    substr: ubootenv
  count_max: 1006907
- id: firmware-platform-marker--rx-5
  desc: Regex component marker
  crit: component
  conf: 0.9
  platforms: [linux]
  if:
    type: text
    substr: OpenWrt
  count_max: 1006908
- id: firmware-platform-marker--rx-6
  desc: Regex component marker
  crit: component
  conf: 0.9
  platforms: [linux]
  if:
    type: text
    # Word-boundary: bare "LEDE" FPs on UI tokens like "3LED" in Qt/audio apps.
    word: LEDE
  count_max: 1006909
- id: mtd
  desc: Access raw flash memory (MTD)
  # Raw flash access is a hardware capability (flashing/firmware tools, I/O
  # benchmarks like fio use it), not suspicious on its own. Firmware-tamper intent
  # comes from composites; keep it notable.
  crit: notable
  conf: 0.8
  for: [c, cpp, rust, go, python, javascript, elf, shell]
  platforms:
  - linux
  if:
    type: text
    regex: /dev/(block/)?mtd
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - type: section
    exact: .modinfo
# Relocated from objectives/impact/wipe/disk/device, where it was named
# `openwrt-flash-erase-command` ("OpenWrt flash erase command") and rated
# suspicious/0.95. The matcher only detects the mtd-utils `flash_erase`
# command, which ships on every embedded Linux and has nothing OpenWrt-specific
# about it, and erasing an MTD partition is how firmware gets *written* to it —
# the Ettus USRP driver's daughterboard flash utility runs
# `subprocess.run(['flash_erase', mtd_devpath, '0', '0'])` to reprogram a
# daughterboard. That is a raw-flash capability, so it belongs beside mtd/ubi
# here at notable; the OpenWrt wipe composite still references it and supplies
# the intent from its other four required legs.
- id: flash-erase-command
  desc: mtd-utils flash erase command
  crit: notable
  conf: 0.9
  platforms: [linux]
  if:
    type: text
    substr: flash_erase
  unless:
  - id: metadata/package/testing/presence/harness::test-directory
- id: mmc
  desc: References an SD/MMC device path
  crit: notable
  conf: 0.85
  for: [c, cpp, rust, go, python, javascript, elf, shell]
  platforms:
  - linux
  if:
    type: text
    regex: /dev/(block/)?mmcblk
- id: ubi
  desc: Access raw unsorted block images
  crit: notable
  conf: 0.8
  platforms:
  - linux
  if:
    type: text
    substr: /dev/ubi
- id: firmware-sysfs-update-interface
  desc: Linux firmware sysfs update interface
  crit: component
  conf: 0.9
  platforms: [linux]
  if:
    type: text
    regex: /sys/class/firmware/[^[:space:]]+/(loading|data|status|error)
composite_rules:
- id: firmware-upgrade-context
  desc: Firmware upgrade or embedded board support context
  crit: component
  conf: 0.9
  any:
  - id: firmware-sysupgrade-marker
  - id: firmware-mtd-helper-marker
  - id: firmware-platform-marker
  - id: firmware-sysfs-update-interface
- id: firmware-mtd-helper-marker
  desc: Firmware MTD helper marker
  crit: component
  conf: 0.9
  platforms: [linux]
  any:
  - id: firmware-mtd-helper-marker--rx-1
  - id: firmware-mtd-helper-marker--rx-2
  - id: firmware-mtd-helper-marker--rx-3
- id: firmware-platform-marker
  desc: Firmware platform marker
  crit: component
  conf: 0.9
  platforms: [linux]
  any:
  - id: firmware-platform-marker--rx-4
  - id: firmware-platform-marker--rx-5
  - id: firmware-platform-marker--rx-6
