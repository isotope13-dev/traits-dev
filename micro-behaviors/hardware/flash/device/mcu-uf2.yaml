defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript, python, shell, elf, macho]
  crit: notable
  conf: 0.9

traits:
  - id: uf2-firmware-image-reference
    desc: References UF2 microcontroller firmware image
    if:
      type: text
      # UF2 is the USB flashing-format image for RP2040-class
      # microcontrollers; staging one means host code can reprogram an
      # attached device, whether for a legitimate update or a rogue flash.
      case_insensitive: true
      regex: '\.uf2\b'
