defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-bios-flash-unlock-addresses
    desc: Loads paired legacy BIOS flash unlock addresses
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: CODE
      pattern: 'B8 55 55 0E 00 B9 AA 2A 0E 00'
  - id: x86-flash-erase-unlock-cycle
    desc: Writes flash unlock and erase-command sequence
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      section: CODE
      pattern: '88 08 88 01 C6 00 80 88 08 88 01 C3'
