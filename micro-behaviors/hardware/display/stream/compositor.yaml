# Compositor-level screen-sharing controls are a neutral display capability.
# Presenter overlays and privacy tools may intentionally omit a layer from a
# shared frame; an objective rule must add hostile context before escalating it.
defaults:
  platforms: [unix]
  for: [cpp, c, text]
  crit: notable
  conf: 0.96

traits:
  - id: screen-share-layer-exclusion
    desc: Compositor excludes layer from screen sharing
    if:
      type: text
      regex: '(?m)^\+.{0,50}(screen_share_mode|omitsFromScreenShare|omitFromScreenShare)'
