# The Electron main-process side of the display-capture stream: the handler
# that answers the renderer's getDisplayMedia requests in place of Chromium's
# own permission prompt. Meeting tools and recorders use it to hand the page
# its own window or the system audio loopback; the same registration silently
# approves screen or audio capture for any page that asks. Neutral mechanics;
# surveillance intent is composed in objectives/collection/ by pairing the
# stream with an outbound channel.
defaults:
  conf: 0.93
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  attack: T1113
  mbc: B0002

traits:
  - id: electron-display-media-request-handler
    desc: Electron handles display-media capture requests
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(^|\.)setDisplayMediaRequestHandler$'
