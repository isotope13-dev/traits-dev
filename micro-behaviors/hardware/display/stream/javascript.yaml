# Live capture of a display surface as a media STREAM -- screen, window,
# desktop, or browser tab. Distinct from the siblings: `screenshot/` is
# still-image capture, `screen/` is display enumeration and screen-grab
# libraries. A stream is the surface that surveillance/meeting-recorder code
# actually consumes, and neither of the other two sees it.
#
# Neutral mechanics only. Screen sharing, meeting tools, recorders, and
# local-cast extensions all use these APIs; covert-capture intent is composed
# in objectives/collection/ by pairing a stream with an outbound channel.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  attack: T1113
  mbc: B0002

traits:
  # The standard screen-sharing entry point. Nothing in the rule set matched
  # it before, so a bundle that shares the user's screen looked identical to
  # one that does not.
  - id: browser-display-capture-api
    desc: Screen capture API (getDisplayMedia)
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(^|\.)getDisplayMedia$'

  # The Chrome-extension capture surface selector, passed to getUserMedia as a
  # mandatory constraint. A `tabCapture`/`desktopCapture` manifest permission
  # only says an extension MAY capture; this constraint is the JavaScript
  # evidence that it opens the stream, and names which surface it takes.
  - id: chrome-media-source-constraint
    desc: Chrome tab or desktop capture constraint
    conf: 0.93
    if:
      type: text
      regex: 'chromeMediaSource["'']?\s*:\s*["''](tab|desktop|screen|window)'
