defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: node-desktop-screenshot-capture
  desc: Node captures the host desktop
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/hardware/display/screenshot::screenshot-desktop-call
  any:
  - id: micro-behaviors/hardware/display/screenshot::screenshot-desktop-import
  - id: micro-behaviors/hardware/display/screenshot::screenshot-desktop-require-path
  unless:
  - id: well-known/tool/development/automation/midscene::midscene-source-context
