# Rust Mach-O screenshot implementations retain both the module source path
# and the format-specific screenshot encoder messages. Keep this as capability
# evidence; collection requires a separate remote-control finding.
defaults:
  crit: notable
  platforms: [macos]
  for: [macho]
  attack: T1113

traits:
  - id: rust-macho-screenshot-module-path
    desc: Rust screenshot module source path
    if:
      type: text
      substr: impl-core/src/screenshot/mod.rs
      section: __TEXT,__cstring

  - id: rust-macho-screenshot-jpeg-output
    desc: Rust screenshot JPEG output marker
    if:
      type: text
      substr: 'screenshot jpeg:'
      section: __TEXT,__cstring

  - id: rust-macho-screenshot-png-output
    desc: Rust screenshot PNG output marker
    if:
      type: text
      substr: 'screenshot png:'
      section: __TEXT,__cstring

composite_rules:
  - id: rust-macho-screenshot-implementation
    desc: Rust Mach-O has screenshot module and encoder
    crit: notable
    all:
      - id: rust-macho-screenshot-module-path
    any:
      - id: rust-macho-screenshot-jpeg-output
      - id: rust-macho-screenshot-png-output

