defaults:
  crit: notable
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: winrt-graphics-capture-primitives
    desc: WinRT graphics capture API clues
    # The Windows SDK itself exposes these types and members.  The API
    # reference is useful telemetry, but a library declaration is not proof
    # that the file captures a screen; callers can be promoted by the
    # screenshot composites below.
    conf: 0.96
    all:
      - id: micro-behaviors/hardware/display/screenshot/reference::winrt-graphics-capture-session
      - id: micro-behaviors/hardware/display/screenshot/reference::winrt-direct3d11-framepool
    any:
      - id: micro-behaviors/hardware/display/screenshot/reference::winrt-graphics-capture-access
      - id: micro-behaviors/hardware/display/screenshot/reference::winrt-graphics-capture-pdb
    unless:
      - id: metadata/filename/development::universalapi-contract-winmd
