defaults:
  platforms: [windows, linux, macos]
traits:
  - id: screenshot-import
    desc: Go screenshot package import reference
    crit: notable
    conf: 0.9
    for:
      - go
    if:
      type: symbol
      kind: import
      regex: vova616/screenshot|screenshot
    unless:
      - id: well-known/app/ai/gateway/inference-gateway::source-tree
  - id: screenshot-string
    desc: Go screenshot library or capture text
    crit: notable
    conf: 0.85
    for: [go, elf, macho, pe]
    if:
      type: text
      regex: vova616/screenshot|screenshot\.Capture
    unless:
      - id: well-known/app/ai/gateway/inference-gateway::source-tree
