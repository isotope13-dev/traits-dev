defaults:
  platforms: [windows, unix]
  for:
    - python
traits:
  - id: python-framebuffer-capture
    desc: capture_framebuffer name text
    crit: suspicious
    conf: 0.94
    for: [python, pyc]
    # `/dev/fb0` is just the Linux framebuffer node — guests and display
    # tests write images to it. Capture intent is the capture_framebuffer API.
    if:
      type: text
      substr: capture_framebuffer
