# Remote tasking interface names for display capture. Command-and-control
# agents expose screenshot collection as request/response tasking messages
# (for example ScreenshotReq / screenshotRequest); the operation vocabulary is
# meaningful on its own and does not depend on one family's schema.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries, go]
  crit: notable
  conf: 0.85
traits:
  - id: remote-capture-tasking-message
    desc: Display-capture tasking message name
    if:
      type: text
      regex: '\bScreenshot(Req|Request|Task|Command|Response|Result)s?\b'
