defaults:
  platforms: [windows, linux, macos]
composite_rules:
  - id: screenshot-library
    desc: Screenshot library reference
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/hardware/display/screenshot/reference::screenshot-import
      - id: micro-behaviors/hardware/display/screenshot/reference::screenshot-string
      - id: well-known/lib/media/screenshot::kbinani-screenshot
    unless:
      - id: well-known/app/ai/gateway/inference-gateway::source-tree
