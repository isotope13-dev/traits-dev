defaults:
  crit: notable
  conf: 0.93

traits:
  - id: portal-screenshot-dbus-interface
    desc: XDG Portal Screenshot D-Bus interface
    platforms: [unix]
    for: [binaries, scripts, source]
    if:
      type: text
      substr: org.freedesktop.portal.Screenshot

  - id: kbinani-screenshot-binary
    desc: Binary references kbinani/screenshot package
    platforms: [linux, macos, windows]
    for: [elf, macho, pe, dll]
    if:
      type: text
      substr: github.com/kbinani/screenshot
