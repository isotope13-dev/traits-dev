# minicap is dual-use Android framebuffer tooling; its staging path alone
# establishes a capture-tool reference, not malicious screen recording.
defaults:
  platforms: [android]
  for: [source, binaries]
  crit: notable
  conf: 0.98
traits:
  - id: android-staged-minicap-path
    desc: Android shell-staged minicap path
    if:
      type: text
      regex: '/data/local/tmp/minicap\b'
