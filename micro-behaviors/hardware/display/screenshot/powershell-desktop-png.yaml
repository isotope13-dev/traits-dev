defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-full-desktop-png-capture
    desc: VirtualScreen capture with CopyFromScreen and PNG encoding
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/hardware/display/state::powershell-virtual-screen-bounds
      - id: micro-behaviors/hardware/display/screenshot::powershell-copyfromscreen
      - id: micro-behaviors/data/encode/image/png::powershell-png-image
