# Windows Screenshot Capture via GDI + GDI+ Encoding
# Full screenshot pipeline: GDI capture -> GDI+ PNG encode -> exfil
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1113
  mbc: "C0014"

traits:
- id: powershell-copyfromscreen
  desc: PowerShell uses GDI+ CopyFromScreen
  crit: notable
  conf: 0.96
  for: [powershell]
  if:
    type: text
    word: CopyFromScreen
- id: powershell-printwindow-call
  desc: PowerShell invokes PrintWindow
  crit: notable
  conf: 0.95
  for: [powershell]
  if:
    type: text
    word: PrintWindow
composite_rules:
- id: dotnet-active-and-multiscreen-capture
  desc: .NET active-window screenshot with display enumeration
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/hardware/display/screenshot::dotnet-gdi-active-window-png-capture
  - id: micro-behaviors/hardware/display/screen::dotnet-dpi-aware-display-enumeration
  unless:
  - id: well-known/app/
  - id: well-known/lib/
- id: dotnet-gdi-active-window-png-capture
  desc: .NET active window screenshot saved as PNG
  crit: notable
  conf: 0.95
  ref: sha256:102dd32a30d7a0cf86955e6045e0426a26dfef393ce946d49c006d19c4c036e9
  all:
  - id: micro-behaviors/hardware/display/screenshot::dotnet-pinvoke-gdi-capture-primitives
  - id: micro-behaviors/ui/window/enumerate::get-foreground-window-pinvoke
  - id: micro-behaviors/ui/window/control::get-window-rect-pinvoke
  - id: micro-behaviors/data/encode/image/gdiplus::dotnet-hbitmap-png-save
  unless:
  - id: well-known/app/
  - id: well-known/lib/
- id: printwindow-jpeg-capture
  desc: PrintWindow capture encoded as JPEG for storage or streaming
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/hardware/display/screenshot::printwindow-capture-primitives
  any:
  - id: micro-behaviors/hardware/display/screen::imageformat-jpeg-str
  - id: micro-behaviors/communications/http/server/managed::mjpeg-stream-content-type
  downgrade:
    any:
    - id: well-known/app/utility/startallback::startallback-basename
    - id: well-known/app/utility/startallback::darkmagic-basename
- id: winrt-graphics-capture
  desc: WinRT GraphicsCapture screenshot capability
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/hardware/display/screenshot::winrt-graphics-capture-primitives
  any:
  - id: micro-behaviors/data/encode/image/pixel::pixel-access-pixelformat
  - id: metadata/binary/section/prose::near-zero-strings
  downgrade:
    any:
    - id: metadata/signed/platform/
  unless:
  - id: metadata/build/generated::winmd-metadata
  - id: well-known/app/utility/quicklook::release-path
