defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1113
  mbc: C0014
traits:
  - id: scrap-capturer-import
    desc: scrap screen capture crate
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: use scrap::{Capturer, Display}
composite_rules:
  - id: scrap-screen-capture
    desc: Rust scrap screen capture
    crit: suspicious
    conf: 0.96
    all:
      - id: scrap-capturer-import
      - id: micro-behaviors/hardware/display/screen::scrap-frame-read
    any:
      - id: micro-behaviors/hardware/display/screen::display-primary
      - id: micro-behaviors/hardware/display/screen::bgra-to-rgb-conversion
