defaults:
  platforms: [windows, linux, macos]
  for:
    - go
composite_rules:
  - id: capture-screen
    desc: Go capture or save call name
    crit: notable
    conf: 0.85
    unless:
      - id: well-known/app/ai/gateway/inference-gateway::source-tree
    any:
      - id: micro-behaviors/hardware/display/screenshot/unspecified::go-screenshot-capture-call
      - id: micro-behaviors/hardware/display/screenshot/unspecified::robotgo-savecapture-call
