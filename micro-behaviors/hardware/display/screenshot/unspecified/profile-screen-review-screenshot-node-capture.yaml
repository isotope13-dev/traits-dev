defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
composite_rules:
  - id: node-desktop-screenshot-capture
    desc: Node screenshot import and call clues
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/hardware/display/screenshot/unspecified::screenshot-desktop-call
    any:
      - id: well-known/lib/media/screenshot::screenshot-desktop-import
      - id: well-known/lib/media/screenshot::screenshot-desktop-require-path
    unless:
      - id: well-known/tool/development/automation/midscene::midscene-source-context
