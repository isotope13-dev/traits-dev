defaults:
  platforms: [windows, unix]
  for: [javascript]
composite_rules:
  - id: node-screenshots-monitor-capture
    desc: Node screenshot library and monitor clues
    crit: notable
    conf: 0.93
    all:
      - id: well-known/lib/media/screenshot::dynamic-import-node-screenshots
    any:
      - id: micro-behaviors/hardware/display/state::node-screenshots-monitor-all
      - id: micro-behaviors/hardware/display/screenshot/unspecified::node-screenshots-capture-image
      - id: micro-behaviors/data/encode/image/jpeg::node-screenshots-jpeg-frame
