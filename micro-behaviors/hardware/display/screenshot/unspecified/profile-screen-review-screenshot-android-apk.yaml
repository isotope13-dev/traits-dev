defaults:
  platforms: [android]
  for: [android_apk, zip, dex]
  crit: component
  conf: 0.88
composite_rules:
  - id: android-screen-capture-capability
    desc: Android screenshot API or layout clues
    crit: notable
    conf: 0.91
    any:
      - id: micro-behaviors/hardware/display/screenshot/reference::android-screen-capture-layout
      - id: micro-behaviors/hardware/display/screenshot/unspecified::android-accessibility-screenshot-api
  - id: android-media-projection-screen-capture
    desc: Android media projection API clues
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/hardware/display/stream::android-media-projection-manager
      - id: micro-behaviors/hardware/display/stream::android-media-projection-capture-intent
    any:
      - id: micro-behaviors/hardware/display/virtual::android-virtual-display-create
      - id: micro-behaviors/hardware/display/screenshot/unspecified::android-screen-capture-capability
