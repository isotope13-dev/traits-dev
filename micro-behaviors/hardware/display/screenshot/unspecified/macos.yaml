defaults:
  crit: notable
  conf: 0.95
  platforms: [macos]
traits:
  - id: macos-screencapture-command
    for: [macho, shell]
    desc: macOS screencapture command
    if:
      type: text
      regex: '(?m)^\s*(/usr/sbin/)?screencapture(\s|$)'
    downgrade:
      any:
        - id: metadata/signature/verified/platform::apple
        - id: metadata/vendor/identity::apple-what-version-banner
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: macos-screencapture-invocation
    for: [scripts, source, macho]
    conf: 0.94
    desc: Invokes macOS screencapture utility with flags
    if:
      type: text
      regex: '\b(/usr/sbin/)?screencapture([ \t]+-[A-Za-z0-9]+){1,8}[ \t]+\S+'
    downgrade:
      any:
        - id: metadata/signature/verified/platform::apple
        - id: metadata/vendor/identity::apple-what-version-banner
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  # On macOS, `screencapture -x` disables the camera-shutter audio cue ("do not
  # play sounds"), turning an interactive utility into silent screen capture.
  - id: macos-silent-screencapture-flag
    for: [scripts, source, macho]
    # Computer-use agents and screenshot tools pass -x routinely; spyware
    # intent comes from the upload/loop composites that consume this.
    crit: notable
    conf: 0.94
    attack: T1113
    desc: macOS screencapture suppresses shutter sound
    if:
      type: text
      regex: '\bscreencapture([ \t]+\S{1,24}){0,4}[ \t]+-[A-Za-z0-9]*x\w*[ \t]+\S'
    downgrade:
      any:
        - id: metadata/signature/verified/platform::apple
        - id: metadata/vendor/identity::apple-what-version-banner
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
