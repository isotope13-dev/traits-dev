defaults:
  platforms: [windows, unix]
  for: [rust]
composite_rules:
  - id: scrap-screen-capture
    desc: Scrap import and frame API clues
    crit: notable
    conf: 0.96
    all:
      - id: well-known/lib/media/screenshot::scrap-capturer-import
      - id: micro-behaviors/hardware/display/screenshot/reference::scrap-frame-read
    any:
      - id: micro-behaviors/hardware/display/screen::display-primary
      - id: micro-behaviors/data/collection/iterate::rust-frame-chunks-exact-reference
