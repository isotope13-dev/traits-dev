# Hidden-API Android screen capture. android.view.SurfaceControl.screenshot
# and its ScreenshotHardwareBuffer result are not public SDK API: callers
# reach them by reflection (Class.forName on the platform class name) or as
# privileged system code. The class and method names are fixed by the
# platform, whatever the calling application names its own code.
defaults:
  crit: notable
  platforms: [android]
  for: [java, kotlin]
  attack: T1113

traits:
  - id: android-screenshot-hardware-buffer
    desc: SurfaceControl screenshot buffer type
    conf: 0.94
    if:
      type: text
      substr: ScreenshotHardwareBuffer

  - id: android-surfacecontrol-screenshot-direct
    desc: Direct SurfaceControl screenshot call
    conf: 0.96
    if:
      type: text
      substr: SurfaceControl.screenshot(

  - id: android-surfacecontrol-screenshot-reflective
    desc: Reflective screenshot method lookup
    conf: 0.9
    if:
      type: text
      regex: '(getDeclaredMethod|getMethod)\("screenshot"'

composite_rules:
  - id: android-surfacecontrol-or-screenshot-buffer
    desc: SurfaceControl or screenshot buffer reference
    conf: 0.94
    any:
      - id: micro-behaviors/hardware/display/render::android-surfacecontrol-class-name
      - id: android-screenshot-hardware-buffer

  - id: android-surfacecontrol-screenshot-call
    desc: Calls hidden SurfaceControl screenshot
    conf: 0.96
    any:
      - id: android-surfacecontrol-screenshot-direct
      - id: android-surfacecontrol-screenshot-reflective

  - id: android-hidden-api-screen-capture
    desc: Captures screen via hidden SurfaceControl
    crit: suspicious
    conf: 0.97
    all:
      - id: android-surfacecontrol-or-screenshot-buffer
      - id: android-surfacecontrol-screenshot-call
