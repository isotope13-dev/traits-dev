defaults:
  platforms: [unix, windows]
  for: [go]
traits:
  - id: go-screenshot-capture-call
    desc: Go screen capture API call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)screenshot\.Capture$|^robotgo\.CaptureScreen$'
  - id: imagemagick-import-command-token
    desc: ImageMagick window-import command token
    crit: component
    if:
      type: literal
      exact: import
  - id: imagemagick-window-option
    desc: ImageMagick X-window option literal
    crit: component
    if:
      type: literal
      exact: -window
  - id: imagemagick-png-stdout-target
    desc: ImageMagick PNG stdout target
    crit: component
    if:
      type: literal
      exact: png:-

composite_rules:
  - id: go-imagemagick-window-capture-command
    desc: Go ImageMagick window capture
    crit: notable
    conf: 0.94
    attack: T1113
    mbc: E1113
    all:
      - id: micro-behaviors/process/create/subprocess/launch::go-command-launch
      - id: imagemagick-import-command-token
      - id: imagemagick-window-option
      - id: imagemagick-png-stdout-target
    near_bytes: 256
