# Display Output Operations
# Console and display-related capabilities
defaults:
  crit: notable
  mbc: C0014
  attack: T1113
  for: [pe, dll]
  platforms: [windows]
traits:
  # === Windows Runtime GraphicsCapture ===
  - id: winrt-graphics-capture-session
    desc: WinRT GraphicsCapture opens capture session
    conf: 0.96
    if:
      type: text
      exact: Windows.Graphics.Capture.GraphicsCaptureSession
    downgrade:
      any:
        - id: well-known/lib/runtime/scripted/v8::isolate-symbol
    unless:
      - id: well-known/tool/detection/wireshark/
      - type: path
        substr: Wireshark-
  - id: winrt-graphics-capture-access
    desc: WinRT GraphicsCapture requests screen access
    conf: 0.94
    if:
      type: text
      exact: Windows.Graphics.Capture.GraphicsCaptureAccess
    unless:
      - id: well-known/app/utility/quicklook::release-path
  - id: winrt-graphics-capture-pdb
    desc: GraphicsCapture DLL debug path
    conf: 0.94
    if:
      type: text
      exact: GraphicsCapture.pdb
composite_rules:
  - id: gdi-screen-capture-primitives
    desc: Windows GDI screenshot primitives
    conf: 0.93
    all:
      - id: micro-behaviors/hardware/display/screen::gdi-bitblt
      - id: micro-behaviors/hardware/display/screen::gdi-getdibits
    any:
      - id: micro-behaviors/ui/window/probe::get-desktop-window
  - id: raw-gdi-screen-capture-primitives
    desc: GDI bitmap readback and scaling APIs
    conf: 0.96
    for: [pe]
    all:
      - id: micro-behaviors/hardware/display/screen::gdi-getdibits
      - id: micro-behaviors/hardware/display/screen::gdi-create-compatible-bitmap
      - id: micro-behaviors/hardware/display/screen::gdi-stretchblt
    near_bytes: 8192
  - id: winrt-graphics-capture-primitives
    desc: Windows WinRT screen capture primitives
    # The Windows SDK itself exposes these types and members.  The API
    # reference is useful telemetry, but a library declaration is not proof
    # that the file captures a screen; callers can be promoted by the
    # screenshot composites below.
    conf: 0.96
    all:
      - id: winrt-graphics-capture-session
      - id: micro-behaviors/hardware/display/screen::winrt-direct3d11-framepool
    any:
      - id: winrt-graphics-capture-access
      - id: winrt-graphics-capture-pdb
    unless:
      - id: micro-behaviors/hardware/display/screen::universalapi-contract-winmd
  - id: printwindow-capture-primitives
    desc: Windows PrintWindow capture primitives
    conf: 0.93
    all:
      - id: micro-behaviors/hardware/display/screen::print-window-api
    any:
      - id: micro-behaviors/hardware/display/screen::print-window-full-content
      - id: micro-behaviors/ui/window/control::get-window-rect
      - id: micro-behaviors/ui/window/enumerate::get-window-text
    downgrade:
      any:
        - id: well-known/lib/platform/browser-automation/
        - id: metadata/binary/vendor/
        - id: well-known/app/browser/internet-explorer/
        - id: well-known/lib/runtime/scripted/electron/
