# A program written in something other than PowerShell that carries a complete
# PowerShell screen-capture command as a string, to hand to the shell at
# runtime.
#
# The existing CopyFromScreen atoms only reach the language the command is
# written in: micro-behaviors/hardware/display/screen::copyfromscreen-dotnet is
# for: [pe, dll], and objectives/collection/screenshot/capture/windows::
# powershell-copyfromscreen is for: [powershell]. Neither sees a Node, Python,
# Go or bytecode artifact that shells out to do the same thing — which is the
# ordinary shape for a cross-platform agent or dropper, and leaves desktop
# capture invisible on exactly the artifacts a supply-chain scan gets handed.
#
# Keyed on the .NET framing plus the capture call, so a passing mention of the
# method name is not enough.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries, data, -powershell, -pe, -dll]
  attack: T1113
  mbc: C0014
  crit: notable
  conf: 0.93
traits:
  - id: embedded-powershell-screen-capture
    desc: Embeds a PowerShell screen-capture command
    if:
      type: text
      regex: '(?is)(Add-Type|System\.Drawing)[\s\S]{0,300}CopyFromScreen'
  - id: embedded-powershell-screen-bounds
    desc: Embeds a PowerShell screen-bounds query
    conf: 0.9
    if:
      type: text
      regex: '(?i)(PrimaryScreen|VirtualScreen)\s*\.?\s*Bounds'
