defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  # Image.Save consumes a stream local. The same local is converted to an
  # array, transformed and Base64 encoded into response[4]; the same response
  # array is concatenated and dispatched. Bind both locals instead of merely
  # checking that screenshot and networking APIs occur somewhere in a PE.
  - id: cil-jpeg-base64-response-construction
    desc: CIL JPEG stream to Base64 response dispatch
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        import "pe"
        rule cil_jpeg_base64_response_construction {
          strings:
            $save = { 11 ?? 11 ?? 28 ?? ?? ?? 0A 6F ?? ?? ?? 0A
                      1B 8D ?? ?? ?? 01 13 ?? }
            $send = { 11 ?? 1A 11 ?? 6F ?? ?? ?? 0A
                      28 ?? ?? ?? 06 28 ?? ?? ?? 0A A2
                      11 ?? 28 ?? ?? ?? 0A 28 ?? ?? ?? 06 }
            $capture = "CopyFromScreen" ascii fullword
            // Six-argument Graphics.CopyFromScreen layout: source/destination
            // origins, Size, and the SRCCOPY CopyPixelOperation constant.
            // Survives an erased CopyFromScreen metadata name.
            $copy = { 11 ?? 16 16 16 16 11 ?? 20 20 00 CC 00 6F ?? ?? ?? 0A }
            $jpeg = "get_Jpeg" ascii fullword
            $encode = "ToBase64String" ascii fullword
          condition:
            ($capture or $copy) and $jpeg and $encode and
            for any s in pe.sections : (
              s.name == ".text" and
              for all of ($jpeg, $encode) : (
                $ in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
              ) and
              ($capture in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1) or
               $copy in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)) and
              for any a in (1..#save) : (
                @save[a] >= s.raw_data_offset and
                @save[a] + !save[a] <= s.raw_data_offset + s.raw_data_size and
                ($capture or for any c in (1..#copy) : (
                  @copy[c] >= s.raw_data_offset and
                  @copy[c] + !copy[c] <= @save[a] and @save[a] < @copy[c]+512
                )) and
                for any b in (1..#send) : (
                  @send[b] > @save[a] + !save[a] and
                  @send[b] < @save[a] + 256 and
                  @send[b] + !send[b] <= s.raw_data_offset + s.raw_data_size and
                  uint8(@save[a]+3) == uint8(@send[b]+4) and
                  uint8(@save[a]+21) == uint8(@send[b]+1) and
                  uint8(@send[b]+1) == uint8(@send[b]+22)
                )
              )
            )
        }
