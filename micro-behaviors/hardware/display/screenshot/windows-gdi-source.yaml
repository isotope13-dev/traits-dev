# Windows GDI APIs exposed through source-level FFI or other declarations.
defaults:
  platforms: [windows]
  for: [lua, text]
  mbc: C0014
  attack: T1113

traits:
  - id: gdi-screen-dimensions-source
    desc: GDI screen dimensions source API
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: GetSystemMetrics

  - id: gdi-dib-section-source
    desc: GDI DIB section source API
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: CreateDIBSection

  - id: gdi-bitblt-source
    desc: GDI raster copy source API
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: BitBlt
