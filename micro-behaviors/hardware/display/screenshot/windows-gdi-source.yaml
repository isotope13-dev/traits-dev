# Windows GDI APIs exposed through source-level FFI or other declarations.
#
# `for:` was [lua, text], which did not match the docstring above: any language
# that can declare a P/Invoke reaches these APIs the same way, and C# is the
# one that does it most -- a decompiled .NET RAT screen-grabber declaring
# GetDC/CreateDIBSection/BitBlt scored nothing at all. Groups are used rather
# than a list because `platforms: [windows]` auto-filters them at load.
defaults:
  crit: notable
  conf: 0.9
  platforms: [windows]
  for: [source, scripts, text]
  mbc: C0014
  attack: T1113

traits:
  - id: gdi-screen-dimensions-source
    desc: GDI screen dimensions source API
    if:
      type: text
      substr: GetSystemMetrics

  - id: gdi-dib-section-source
    desc: GDI DIB section source API
    if:
      type: text
      substr: CreateDIBSection

  - id: gdi-bitblt-source
    desc: GDI raster copy source API
    if:
      type: text
      substr: BitBlt
