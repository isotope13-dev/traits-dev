defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1113

traits:
  - id: android-source-screenshot-call
    desc: Android source captures a screenshot
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: takeScreenshot

  - id: android-source-capture-screenshot-call
    desc: Android source captures a screenshot
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: captureScreenshot

  - id: android-installed-apps-enumeration
    desc: Android source enumerates installed applications
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bgetInstalledApplications\s*\('
