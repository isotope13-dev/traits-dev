defaults:
  platforms: [android]
  for: [java, kotlin]
  attack: T1113

traits:
  - id: android-source-screenshot-call
    desc: Android source captures a screenshot
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: takeScreenshot

  - id: android-source-capture-screenshot-call
    desc: Android source captures a screenshot
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: captureScreenshot

  - id: android-installed-apps-enumeration
    desc: Android source enumerates installed applications
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bgetInstalledApplications\s*\('

  - id: android-source-media-projection-manager
    desc: Android source MediaProjection manager
    crit: notable
    conf: 0.92
    if:
      type: text
      word: MediaProjectionManager

  - id: android-source-screen-capture-intent
    desc: Android source screen capture consent intent
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: createScreenCaptureIntent

  - id: android-source-virtual-display-capture
    desc: Android source virtual display capture
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: createVirtualDisplay

composite_rules:
  - id: android-source-media-projection-screen-capture
    desc: Android source MediaProjection screen capture
    crit: notable
    conf: 0.96
    all:
      - id: android-source-media-projection-manager
      - id: android-source-screen-capture-intent
    any:
      - id: android-source-virtual-display-capture
