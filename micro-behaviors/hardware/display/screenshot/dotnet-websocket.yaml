defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: dotnet-websocket-screen-host-interaction
  desc: .NET WebSocket client with screen capture and host interaction
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/communications/websocket/client::dotnet-client-websocket
  - id: micro-behaviors/hardware/display/screenshot::dotnet-copyfromscreen-capture
  any:
  - id: micro-behaviors/hardware/input/block::block-input-import
  - id: micro-behaviors/process/create/hidden::dotnet-create-no-window
  - id: micro-behaviors/process/create/spawn::redirect-standard-output-dotnet
  unless:
  - id: metadata/signed/platform/
  - id: well-known/dual-use/remote-admin/
  - id: well-known/tool/reverse-engineering/
