defaults:
  platforms: [windows, linux, macos]
  mbc: E1113
  attack: T1113
traits:
  - id: capture-rect
    desc: Screen region capture
    crit: notable
    conf: 0.8
    for:
      - go
    if:
      type: symbol
      kind: call
      exact: screenshot.CaptureRect
    unless:
      - id: well-known/app/ai/gateway/inference-gateway::source-tree
composite_rules:
  - id: capture-operations
    desc: Screen capture operations
    crit: notable
    conf: 0.8
    any:
      - id: go-screenshot-capture-call
      - id: capture-rect
    unless:
      - id: well-known/app/ai/gateway/inference-gateway::source-tree
