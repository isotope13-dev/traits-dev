# PgReadScreen reads pixels from a Photon display. It is a capability, not
# evidence of surveillance or exfiltration by itself.
# https://get.qnx.com/developers/docs/6.4.1/photon/lib_ref/pg/pgreadscreen.html
defaults:
  platforms: [qnx, unix]
  for: [c, cpp]
  crit: notable
  attack: T1113
traits:
  - id: qnx-photon-read-screen-call
    desc: QNX Photon screen-read call
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: PgReadScreen
