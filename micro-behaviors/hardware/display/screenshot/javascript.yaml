# Display/Screen Capabilities - JavaScript
# Capabilities related to display enumeration and screen capture
defaults:
  platforms: [windows, unix]
  attack: T1113
  mbc: B0002
  for: [javascript]
traits:
  - id: screenshot-capture-fn
    desc: Calls captureScreenshots helper
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: captureScreenshots
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - type: text
        regex: 'PW_CAPTURE_SCREENSHOTS|@playwright/test|PlaywrightRunOptions'
  - id: require-node-screenshots
    desc: Requires node-screenshots library
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'require\s*\(\s*["'']node-screenshots["'']\s*\)'
  - id: dynamic-import-node-screenshots
    desc: Dynamically imports node-screenshots library
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bimport\s*\(\s*["'']node-screenshots["'']\s*\)'
  - id: node-screenshots-capture-image
    desc: node-screenshots image capture call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: captureImage
composite_rules:
  - id: node-screenshots-monitor-capture
    desc: node-screenshots monitor capture flow
    crit: notable
    conf: 0.93
    all:
      - id: dynamic-import-node-screenshots
    any:
      - id: micro-behaviors/hardware/display/state::node-screenshots-monitor-all
      - id: node-screenshots-capture-image
      - id: micro-behaviors/data/encode/image/jpeg::node-screenshots-jpeg-frame
