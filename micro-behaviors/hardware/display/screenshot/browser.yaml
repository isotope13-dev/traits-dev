defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1113
  mbc: C0014

traits:
  - id: javascript-page-screenshot
    desc: Calls screenshot on page-named receiver
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(page|browserPage|webPage)\.screenshot$'
