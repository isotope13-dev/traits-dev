defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  # Bind the local passed to Image.Save to the local subsequently read by
  # ToArray. The array feeds two transforms and string-response dispatch.
  # Operands are unresolved tokens: claim the CIL shape plus API references,
  # not observed transmission or the semantics of every wildcard call.
  - id: cil-jpeg-string-response-construction
    desc: CIL JPEG stream-to-string response dispatch
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        import "pe"
        rule cil_jpeg_string_response_construction {
          strings:
            $save = { 11 ?? 11 ?? 28 ?? ?? ?? 0A 6F ?? ?? ?? 0A }
            $send = { 11 ?? 6F ?? ?? ?? 0A 28 ?? ?? ?? 06
                      28 ?? ?? ?? 06 28 ?? ?? ?? 0A
                      28 ?? ?? ?? 0A 28 ?? ?? ?? 06 }
            $capture = "CopyFromScreen" ascii fullword
            $jpeg = "get_Jpeg" ascii fullword
            $array = "ToArray" ascii fullword
            $send_api = "BeginSend" ascii fullword
          condition:
            for any s in pe.sections : (
              s.name == ".text" and
              for all of ($capture, $jpeg, $array, $send_api) : (
                $ in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
              ) and
              for any a in (1..#save) : (
                @save[a] >= s.raw_data_offset and
                for any b in (1..#send) : (
                  @send[b] >= @save[a] + !save[a] and
                  @send[b] < @save[a] + 128 and
                  @send[b] + !send[b] <= s.raw_data_offset + s.raw_data_size and
                  uint8(@save[a]+3) == uint8(@send[b]+1)
                )
              )
            )
        }
