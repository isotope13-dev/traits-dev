# Node desktop capture primitives. These APIs are dual-use; intent is
# established by RAT/exfiltration composites under objectives/.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: screenshot-desktop-import
    desc: Imports screenshot-desktop capture library
    if:
      type: string_literal
      exact: screenshot-desktop

  - id: screenshot-desktop-call
    desc: Calls screenshot-desktop capture function
    if:
      type: symbol
      kind: call
      exact: screenshot
