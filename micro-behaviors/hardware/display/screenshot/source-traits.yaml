# Native Windows desktop capture in C/C++ source.
defaults:
  crit: notable
  platforms: [windows]
  for: [c, cpp]
  attack: T1113
  mbc: C0014

composite_rules:
  - id: source-gdi-screen-capture-primitives
    desc: Native source captures desktop pixels through GDI
    conf: 0.97
    all:
      - id: micro-behaviors/ui/window/region::source-gdi-desktop-device-context
      - id: micro-behaviors/ui/graphics/draw::source-gdi-compatible-device-context
      - id: micro-behaviors/ui/graphics/image::source-gdi-compatible-bitmap
      - id: micro-behaviors/ui/graphics/draw::source-gdi-raster-copy
