# Neutral observations reviewed from stranded members.
composite_rules:
- id: gdi-bitmap-and-window-api-set
  desc: GDI bitmap and window API co-occurrence
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/hardware/display/screen::gdi-bitmap-transfer-primitives
  any:
  - id: micro-behaviors/ui/window/enumerate::get-foreground-window
  - id: micro-behaviors/ui/window/enumerate::get-window-text
  - id: micro-behaviors/ui/window/enumerate::get-window-text-length
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: metadata/binary/installer/family::inno-uninstaller-runtime
  - id: metadata/binary/symbols/count::many-exports
  - id: well-known/app/utility/siw::siw-family-identity
  for:
  - pe
  - dll
  platforms:
  - windows
