# Android's ADB protocol opens services as `shell:<command>` (or the modern
# `shell,v2,raw:<command>` form). The screencap binary is the platform's direct
# framebuffer capture utility, so this protocol string survives custom ADB
# client implementations and DEX compilation.
defaults:
  platforms: [android]
  for: [java, kotlin, apk, zip, dex]
  attack: T1113

traits:
  - id: android-adb-screencap-service-request
    desc: ADB shell service captures Android screen
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)shell(,v2,raw)?:screencap(\s|$)'
