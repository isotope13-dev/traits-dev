# Named .NET screenshot methods and their neutral API context.
defaults:
  crit: notable
  for: [pe, dll]
  platforms: [windows]
  attack: T1113
  mbc: C0014
traits:
  - id: capture-screenshot-method
    desc: .NET full-display capture method
    conf: 0.9
    if:
      type: text
      exact: CaptureScreenshot
  - id: capture-active-window-method
    desc: .NET active-window capture method
    conf: 0.9
    if:
      type: text
      exact: CaptureActiveWindow
  - id: copyfromscreen-dotnet
    desc: ".NET CopyFromScreen screen capture method"
    conf: 0.9
    if:
      type: text
      substr: CopyFromScreen
    downgrade:
      any:
        - id: metadata/build/recognized-contexts/
        - id: metadata/signed/leaf::progress-software-corporation
        - id: metadata/package/versioning/scheme::pe-companyname-field
  - id: screenshot-jpg-template
    desc: Screenshot JPEG filename template
    conf: 0.82
    if:
      type: text
      exact: screenshot_{0}.jpg
composite_rules:
  - id: gdi-png-capture-methods
    desc: .NET GDI capture methods with PNG output
    conf: 0.94
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/hardware/display/screen::gdi-bitblt
      - id: micro-behaviors/hardware/display/screen::gdi-create-compatible-dc
      - id: micro-behaviors/hardware/display/screen::gdi-create-compatible-bitmap
      - id: micro-behaviors/data/encode/image/gdiplus::dotnet-imageformat-png
    any:
      - id: capture-screenshot-method
      - id: capture-active-window-method
  # These are capture/input capabilities, including in unsigned UI libraries.
  # Do not count a capture atom and its own composite as independent evidence.
  - id: dotnet-capture-or-input-apis
    desc: .NET desktop capture or input APIs
    conf: 0.95
    all:
      - id: metadata/binary/framework::dotnet-assembly
    any:
      - id: copyfromscreen-dotnet
      - id: micro-behaviors/hardware/input/video::avicap32-device-enum
      - id: micro-behaviors/hardware/input/video::avicap32-dll
      - id: dotnet-gdi-managed-screen-capture
      - id: micro-behaviors/hardware/input/mouse/synthesis::mouse-event
  - id: dotnet-copyfromscreen-capture
    desc: .NET managed screenshot via CopyFromScreen
    conf: 0.9
    all:
      - id: copyfromscreen-dotnet
    any:
      - id: micro-behaviors/hardware/display/state::screen-primaryscreen-str
      - id: micro-behaviors/hardware/display/screen::imageformat-jpeg-str
      - id: screenshot-jpg-template
    downgrade:
      any:
        - id: metadata/build/recognized-contexts/
        - id: metadata/signed/leaf::progress-software-corporation
  - id: dotnet-gdi-managed-screen-capture
    desc: .NET desktop capture rendered through GDI and JPEG
    conf: 0.96
    all:
      - id: micro-behaviors/hardware/display/state::screen-primaryscreen-str
      - id: micro-behaviors/hardware/display/state::dotnet-screen-bounds
      - id: micro-behaviors/hardware/display/screen::gdi-create-compatible-dc
      - id: micro-behaviors/hardware/display/screen::gdi-bitblt
      - id: micro-behaviors/data/encode/image/gdiplus::dotnet-from-hbitmap
      - id: micro-behaviors/hardware/display/screen::imageformat-jpeg-str
    near_bytes: 8192
  - id: dotnet-pinvoke-gdi-capture-primitives
    desc: .NET P/Invoke GDI bitmap capture primitives
    conf: 0.94
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/hardware/display/screen::dllimport-attribute
      - id: micro-behaviors/hardware/display/screen::pinvoke-user32-library
      - id: micro-behaviors/hardware/display/screen::pinvoke-gdi32-library
      - id: micro-behaviors/hardware/display/screen::gdi-bitblt
      - id: micro-behaviors/hardware/display/screen::gdi-create-compatible-dc
      - id: micro-behaviors/hardware/display/screen::gdi-create-compatible-bitmap
    any:
      - id: micro-behaviors/ui/window/region::get-window-dc
      - id: micro-behaviors/ui/window/probe::get-desktop-window
      - id: micro-behaviors/hardware/display/state::dotnet-all-screens
    unless:
      - id: well-known/app/
      - id: well-known/lib/
