# Named .NET screenshot methods and their neutral API context.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1113
  mbc: C0014

traits:
  - id: capture-screenshot-method
    desc: .NET full-display capture method
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: CaptureScreenshot
  - id: capture-active-window-method
    desc: .NET active-window capture method
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: CaptureActiveWindow

composite_rules:
  - id: gdi-png-capture-methods
    desc: .NET GDI capture methods with PNG output
    crit: notable
    conf: 0.94
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/hardware/display/screen::gdi-bitblt
      - id: micro-behaviors/hardware/display/screen::gdi-create-compatible-dc
      - id: micro-behaviors/hardware/display/screen::gdi-create-compatible-bitmap
      - id: micro-behaviors/data/encode/image/gdiplus::dotnet-imageformat-png
    any:
      - id: capture-screenshot-method
      - id: capture-active-window-method
