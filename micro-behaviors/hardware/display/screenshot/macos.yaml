defaults:
  platforms: [macos]
  for: [macho, shell]

traits:
  - id: macos-screencapture-command
    desc: macOS screencapture command
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*(/usr/sbin/)?screencapture(\s|$)'
    downgrade:
      any:
        - id: metadata/binary/vendor/
        - id: metadata/signed/platform::apple
        - id: well-known/tool/detection/
        - id: metadata/vendor/identity::apple-what-version-banner
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
