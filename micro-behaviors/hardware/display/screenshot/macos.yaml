defaults:
  crit: notable
  conf: 0.95
  platforms: [macos]
traits:
  - id: macos-screencapture-command
    for: [macho, shell]
    desc: macOS screencapture command
    if:
      type: text
      regex: '(?m)^\s*(/usr/sbin/)?screencapture(\s|$)'
    downgrade:
      any:
        - id: metadata/binary/vendor/
        - id: metadata/signed/platform::apple
        - id: well-known/tool/detection/
        - id: metadata/vendor/identity::apple-what-version-banner
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: macos-screen-capture-api-import
    for: [macho]
    attack: T1113
    mbc: C0014
    desc: macOS screen capture API import
    if:
      type: import
      regex: '^(CGDisplay(CreateImage|StreamCreate)|CGWindowListCreateImage|SCShareableContent)'
