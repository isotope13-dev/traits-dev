defaults:
  platforms: [android]
  for: [java, kotlin, android_apk, zip, dex]
traits:
  - id: android-adb-screencap-service-request
    desc: ADB screencap service request text
    crit: notable
    conf: 0.98
    for: [java, kotlin, dex]
    if:
      type: text
      regex: '(?i)shell(,v2,raw)?:screencap(\s|$)'
