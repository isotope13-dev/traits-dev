traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  id: screenshot-dispatch-label
  desc: Screenshot label in command-dispatch syntax
  crit: notable
  conf: 0.5
  unless:
  - type: text
    substr: ComputerUseAction
  - type: text
    substr: VALID_ACTION_TYPES
  - type: text
    substr: computer_use
  - type: path
    regex: (?i)computer-use
  if:
    type: text
    regex: (case|command|cmd|type)[^;\n]{0,24}["']screenshot["']
    case_insensitive: true
