traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  id: screenshot-dispatch-label
  desc: Screenshot label in command-dispatch syntax
  crit: notable
  conf: 0.5
  unless:
  - type: text
    substr: ComputerUseAction
  - type: text
    substr: VALID_ACTION_TYPES
  - type: text
    substr: computer_use
  - type: path
    regex: (?i)computer-use
  if:
    type: text
    # Dispatch syntax only: a case label, a command/cmd comparison, or a
    # dispatch-table entry mapping the label to a handler. A `type:` field
    # declaration or a `type ===` validation comparison (e.g. a web-scraping
    # SDK's remote-action type) names a label without dispatching capture.
    regex: (case|command|cmd)[^;\n]{0,24}["']screenshot["']
    case_insensitive: true
