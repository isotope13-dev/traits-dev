defaults:
  mbc: C0014
  attack: T1113
  platforms: [windows, unix, android]
  for:
    - java
    - class
    - jar
    - zip

traits:
  - id: java-screenshot-capture
    for: [java, class]
    desc: Java screen capture methods
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: createScreenCapture
  - id: jvm-screenshot-capture-method
    desc: JVM captures desktop with AWT Robot
    crit: notable
    conf: 0.97
    for: [class, java_class]
    if:
      type: symbol
      kind: import
      exact: createScreenCapture
