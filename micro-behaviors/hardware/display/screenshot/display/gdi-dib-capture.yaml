# GDI virtual-screen capture using CreateDIBSection instead of GetDIBits.
defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.94

composite_rules:
  - id: gdi-dib-screen-capture
    desc: GDI virtual-screen DIB capture APIs
    all:
      - id: micro-behaviors/ui/graphics/draw::gdi-dib-bitmap-transfer-primitives
      - id: micro-behaviors/ui/graphics/draw::gdi-create-compatible-dc
      - id: micro-behaviors/ui/window/region::get-dc
      - id: micro-behaviors/ui/controls/widget::get-system-metrics
