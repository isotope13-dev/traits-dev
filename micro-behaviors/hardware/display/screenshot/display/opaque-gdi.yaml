defaults:
  platforms: [windows]
  for: [data]

composite_rules:
  # Headerless native excerpts retain import names without parsed imports.
  # These names identify an API profile, not executed capture or transmission.
  - id: opaque-gdi-screen-capture-primitives
    desc: Opaque content with desktop and GDI bitmap API names
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/ui/graphics/draw::gdi-bitblt
      - id: micro-behaviors/ui/graphics/image::gdi-getdibits-opaque-reference
      - id: micro-behaviors/ui/window/probe::get-desktop-window-opaque-reference
