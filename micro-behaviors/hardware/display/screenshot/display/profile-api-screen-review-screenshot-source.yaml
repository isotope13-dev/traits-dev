defaults: {}
traits:
  - id: ps-save-screenshot-function
    desc: Save-Screenshot function declaration text
    crit: notable
    conf: 0.92
    for: [powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)\bfunction\s+Save-Screenshot\b'
  - id: ps-virtual-screen-pixel-copy
    desc: "Screen geometry and pixel-copy text"
    crit: notable
    conf: 0.9
    for: [powershell, html]
    platforms: [windows]
    if:
      type: text
      case_insensitive: true
      regex: '(?s)(VirtualScreen|Screen\.AllScreens).{0,400}(CopyFromScreen|BitBlt)'
  - id: csharp-copy-from-screen-capture
    desc: Copies screen pixels with CopyFromScreen
    crit: notable
    conf: 0.92
    attack: T1113
    for: [csharp]
    platforms: [windows]
    if:
      type: symbol
      kind: call
      regex: '\.CopyFromScreen$'
  - id: go-screen-api-reference
    desc: "Go API.Screen reference"
    crit: notable
    conf: 0.85
    for: [go]
    platforms: [windows, unix]
    if:
      type: text
      substr: "API.Screen"
