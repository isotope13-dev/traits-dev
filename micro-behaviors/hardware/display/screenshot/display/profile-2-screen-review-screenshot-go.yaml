defaults:
  platforms: [windows, linux, macos]
composite_rules:
  - id: windows-desktop-capture-reset
    desc: Desktop capture reset API clues
    crit: notable
    conf: 0.95
    for: [go]
    platforms: [windows]
    all:
      - id: micro-behaviors/hardware/display/screenshot/display::reset-desktop-capture
      - id: micro-behaviors/hardware/display/screenshot/reference::dxgi-reset-state
      - id: metadata/binary/symbols/name/function::bitmap-reset-state
      - id: micro-behaviors/process/sync/mutex::go-capture-mutex-lock-reference
    any:
      - id: micro-behaviors/hardware/display/screenshot/reference::bitblt-capture-comment
