defaults:
  platforms: [windows, linux, macos]
  for:
    - go
traits:
  - id: robotgo-capture
    desc: Robotgo capture or save string
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      regex: robotgo\.CaptureScreen|robotgo\.SaveCapture
  - id: robotgo-savecapture-call
    desc: Robotgo SaveCapture call
    crit: component
    if:
      type: symbol
      kind: call
      exact: robotgo.SaveCapture
