defaults:
  platforms: [linux]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.96

traits:
  - id: glib-screen-capture-file-upload-command
    desc: GLib screen-capture and file-upload command
    # Both operations occur in the same complete command argument. The rule
    # does not claim that arbitrary capture/upload paths name the same file.
    if:
      type: symbol
      kind: call
      exact: GLib.spawn_command_line_async
      arg:
        index: 0
        kind: string
        substr: '--data-binary @/'
        regex: "^/bin/(ba)?sh -c 'gnome-screenshot .{0,120}; curl .{0,120}https?://"

