defaults:
  crit: notable
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: printwindow-capture-primitives
    desc: PrintWindow and window API clues
    conf: 0.93
    all:
      - id: micro-behaviors/hardware/display/screenshot/window::print-window-api
    any:
      - id: micro-behaviors/hardware/display/screenshot/window::print-window-full-content
      - id: micro-behaviors/ui/window/control::get-window-rect
      - id: micro-behaviors/ui/window/enumerate::get-window-text
