defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
composite_rules:
  - id: dotnet-gdi-active-window-png-capture
    desc: GDI window and PNG API clues
    crit: notable
    conf: 0.95
    ref: sha256:102dd32a30d7a0cf86955e6045e0426a26dfef393ce946d49c006d19c4c036e9
    all:
      - id: micro-behaviors/hardware/display/screenshot/unspecified::dotnet-pinvoke-gdi-capture-primitives
      - id: micro-behaviors/ui/window/enumerate::get-foreground-window-name-reference
      - id: micro-behaviors/ui/window/control::get-window-rect-pinvoke
      - id: micro-behaviors/data/encode/image/gdiplus::dotnet-hbitmap-png-save
  - id: printwindow-jpeg-capture
    desc: PrintWindow and JPEG or streaming clues
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/hardware/display/screenshot/window::printwindow-capture-primitives
    any:
      - id: micro-behaviors/data/encode/image/jpeg::dotnet-jpeg-encoder-reference
      - id: micro-behaviors/communications/http/server/managed::mjpeg-stream-content-type
