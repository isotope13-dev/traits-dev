---
defaults:
  crit: baseline
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - shell
  - python
  - c
  - cpp
  - rust
  - go
  - javascript
traits:
- id: x11-ref
  desc: X11 windowing reference
  crit: baseline
  conf: 0.5
  if:
    type: text
    regex: "(?i)libX11"
- id: x11-libxcb-ref
  desc: X11 libxcb reference
  crit: baseline
  conf: 0.5
  if:
    type: text
    regex: "(?i)libxcb"
- id: x11-xorg-ref
  desc: X11 xorg reference
  crit: baseline
  conf: 0.5
  if:
    type: text
    regex: "(?i)\\bxorg\\b"
- id: x11-xenocara-ref
  desc: X11 xenocara reference
  crit: baseline
  conf: 0.5
  if:
    type: text
    regex: "(?i)xenocara"
- id: x11-open-display-ref
  desc: X11 XOpenDisplay reference
  crit: baseline
  conf: 0.5
  if:
    type: text
    regex: "(?i)XOpenDisplay"
