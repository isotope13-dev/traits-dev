defaults:
  platforms: [android, unix]
  for: [elf, apk, python, javascript, java, kotlin, c, cpp]
  crit: notable
  conf: 0.9

traits:
  - id: android-hdmi-state-key
    desc: Android HDMI state key
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bhdmi[_-](state|connected|plugged|signal)\b'

  - id: android-hdmi-state-relation
    desc: Android HDMI connection state relation
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bhdmi\b.{0,48}\b(state|connected|plugged|signal)\b'

  - id: android-display-state-relation
    desc: Android display connection state relation
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bdisplay\b.{0,48}\b(hdmi|connected|plugged|signal)\b'
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index

composite_rules:
  - id: android-hdmi-state-observation
    desc: Android HDMI connection state observation
    crit: notable
    conf: 0.92
    any:
      - id: android-hdmi-state-key
      - id: android-hdmi-state-relation
      - id: android-display-state-relation
