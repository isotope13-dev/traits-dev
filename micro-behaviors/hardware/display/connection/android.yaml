defaults:
  platforms: [android, unix]
  for: [elf, apk, python, javascript, java, kotlin, c, cpp]
  crit: notable
  conf: 0.9

traits:
  - id: hdmi-state-key
    desc: HDMI connection-state key
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bhdmi[_-](state|connected|plugged|signal)\b'

  - id: hdmi-connection-state-relation
    desc: HDMI connection-state relation
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bhdmi\b.{0,48}\b(state|connected|plugged|signal)\b'

  # One joined identifier (`display_state`, `DISPLAY_CONNECTED`,
  # `Display.STATE_ON`), not two common words inside a 48-byte window. The old
  # proximity form paired the most frequent word in web code with `signal` /
  # `connected`, so minified JavaScript matched by coincidence -- CodeMirror's
  # `display.viewTo!=e.display.reportedViewTo)&&(t.signal` read as an Android
  # display-connection probe. HDMI adjacency stays covered by the sibling above.
  - id: display-connection-state-key
    desc: Display connection-state key
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bdisplay[_.-](state|connected|plugged|hdmi)\b'
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index

composite_rules:
  - id: display-connection-state-observation
    desc: Display connection-state observation
    crit: notable
    conf: 0.92
    any:
      - id: hdmi-state-key
      - id: hdmi-connection-state-relation
      - id: display-connection-state-key
