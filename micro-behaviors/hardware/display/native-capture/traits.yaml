# Native Windows desktop capture in C/C++ source.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1113
  mbc: C0014

traits:
  - id: source-gdi-desktop-device-context
    desc: Native source gets desktop GDI context
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bGetDC\s*\(\s*(nullptr|NULL|0)'

  - id: source-gdi-compatible-device-context
    desc: Native source creates GDI context
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: CreateCompatibleDC

  - id: source-gdi-compatible-bitmap
    desc: Native source allocates GDI bitmap
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: CreateCompatibleBitmap

  - id: source-gdi-raster-copy
    desc: Native source copies pixels with BitBlt
    crit: notable
    conf: 0.92
    if:
      type: symbol
      exact: BitBlt

composite_rules:
  - id: source-gdi-screen-capture-primitives
    desc: Native source captures desktop pixels through GDI
    crit: notable
    conf: 0.97
    all:
      - id: source-gdi-desktop-device-context
      - id: source-gdi-compatible-device-context
      - id: source-gdi-compatible-bitmap
      - id: source-gdi-raster-copy
