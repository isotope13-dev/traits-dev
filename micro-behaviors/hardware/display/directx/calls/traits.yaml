# DirectX Graphics Infrastructure Access
# Detects neutral GPU/graphics capabilities for analyst context.
traits:
  - id: directx-device-d3d9
    desc: Direct3D 9 device creation API
    crit: notable
    conf: 0.82
    platforms: [windows]
    for: [pe]
    if:
      type: symbol
      exact: Direct3DCreate9
  - id: directx-factory-api
    desc: DirectX factory creation
    crit: baseline
    conf: 0.7
    platforms: [windows]
    for: [pe]
    if:
      type: symbol
      exact: "CreateDXGIFactory"
  - id: directx-device-factory1
    desc: CreateDXGIFactory1 API
    crit: baseline
    conf: 0.7
    platforms: [windows]
    for: [pe]
    if:
      type: symbol
      exact: "CreateDXGIFactory1"
  - id: directx-device-d3d11
    desc: D3D11CreateDevice API
    crit: baseline
    conf: 0.7
    platforms: [windows]
    for: [pe]
    if:
      type: symbol
      exact: "D3D11CreateDevice"
  - id: directx-device-d3d12
    desc: D3D12CreateDevice API
    crit: baseline
    conf: 0.7
    platforms: [windows]
    for: [pe]
    if:
      type: symbol
      exact: "D3D12CreateDevice"
  - id: cuda-memcpy
    desc: CUDA cudaMemcpy API
    crit: notable
    conf: 0.7
    platforms: [windows, linux, macos]
    for: [pe, elf, macho]
    if:
      type: symbol
      substr: "cudaMemcpy"
  - id: cuda-launch-kernel
    desc: CUDA cudaLaunchKernel API
    crit: notable
    conf: 0.7
    platforms: [windows, linux, macos]
    for: [pe, elf, macho]
    if:
      type: symbol
      substr: "cudaLaunchKernel"
  # DXGI Desktop Duplication is the modern high-framerate desktop capture path
  # (dxgi1_2.h). Its interfaces are COM vtable calls with no exported symbol, so
  # the interface IIDs are the reliable, language-agnostic marker: any caller
  # must pass the IID by value to QueryInterface, whether written in C++, Go,
  # Rust, or C#.
  - id: dxgi-output-duplication-iid
    desc: IDXGIOutputDuplication interface IID
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [pe, dll]
    if:
      type: hex
      pattern: "C3 FA 1C 19 41 A3 0D 47 B2 6E A8 64 F4 28 31 9C"
      section: .rdata
  - id: dxgi-output1-iid
    desc: IDXGIOutput1 IID exposing DuplicateOutput
    crit: notable
    conf: 0.85
    platforms: [windows]
    for: [pe, dll]
    if:
      type: hex
      pattern: "A8 DE CD 00 9B 93 83 4B A3 40 A6 85 22 66 66 CC"
      section: .rdata
  - id: dxgi-output-duplication-name
    desc: IDXGIOutputDuplication name reference
    crit: notable
    conf: 0.85
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      exact: IDXGIOutputDuplication
  - id: dxgi-duplicate-output-name
    desc: DuplicateOutput method reference
    crit: notable
    conf: 0.8
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      exact: DuplicateOutput
  - id: dxgi-acquire-next-frame-name
    desc: AcquireNextFrame method reference
    crit: notable
    conf: 0.8
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      exact: AcquireNextFrame
composite_rules:
  - id: dxgi-duplication-interface-name
    desc: Desktop Duplication API named in binding
    crit: notable
    conf: 0.85
    platforms: [windows]
    for: [pe, dll]
    any:
      - id: dxgi-output-duplication-name
      - id: dxgi-duplicate-output-name
      - id: dxgi-acquire-next-frame-name
  - id: directx-device-api
    desc: DirectX device creation
    crit: notable
    conf: 0.7
    platforms: [windows]
    for: [pe]
    any:
      - id: directx-device-d3d9
      - id: directx-device-factory1
      - id: directx-device-d3d11
      - id: directx-device-d3d12
  - id: cuda-runtime-api
    desc: NVIDIA CUDA runtime access
    crit: notable
    conf: 0.7
    platforms: [windows, linux, macos]
    for: [pe, elf, macho]
    any:
      - id: cuda-memcpy
      - id: cuda-launch-kernel
  - id: gpu-graphics-access
    desc: GPU graphics infrastructure
    crit: component
    conf: 0.75
    platforms: [windows]
    for: [pe]
    mbc: "E1030"
    any:
      - id: directx-factory-api
      - id: directx-device-api
  - id: gpu-compute-capable
    desc: GPU compute capability
    crit: suspicious
    conf: 0.8
    platforms: [unix, windows, macos]
    for: [pe, elf, macho]
    mbc: "E1030"
    any:
      - id: gpu-graphics-access
      - id: cuda-runtime-api
    unless:
      - id: well-known/app/infrastructure/turboadb::official-turboadb-gui
