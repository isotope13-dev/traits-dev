defaults:
  platforms: [android]
  for: [apk, zip, dex]
  crit: component
  conf: 0.9

traits:
  - id: android-torch-camera-manager
    desc: Android CameraManager torch API
    for: [dex]
    if:
      type: text
      substr: "Landroid/hardware/camera2/CameraManager;"

  - id: android-set-torch-mode-method
    desc: Android setTorchMode method reference
    if:
      type: text
      word: setTorchMode

composite_rules:
  - id: android-torch-control
    desc: Controls an Android camera torch
    crit: notable
    conf: 0.96
    for: [dex]
    all:
      - id: android-torch-camera-manager
      - id: android-set-torch-mode-method
