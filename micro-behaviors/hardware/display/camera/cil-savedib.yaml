# WM_CAP_FILE_SAVEDIBA = WM_USER + 25 = 0x419.
# 0x425 is not SaveDIB; a filename pointer cannot make it a save request.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
  conf: 0.96
traits:
- id: cil-vfw-savedib-message-call-layout
  desc: CIL ANSI SaveDIB argument and call layout
  if:
    type: hex
    section: .text
    pattern: 06 20 19 04 00 00 16 09 28 ?? ?? ?? 06 26 09 28 ?? ?? ?? 0A
