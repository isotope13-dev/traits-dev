# C source prototype for capCreateCaptureWindow. The PE import atom in
# native-interface.yaml cannot see a function-pointer typedef, which is how a
# dynamically resolved webcam API is declared in C source.
defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.93
  attack: T1125
  mbc: C0014

traits:
  - id: vfw-capture-window-prototype-typedef
    desc: VFW capCreateCaptureWindow prototype typedef
    if:
      type: text
      regex: 'typedef HWND \(__stdcall ?\*\w+\)\(LPCSTR,DWORD,int,int,int,int,HWND,int\)'
      exclude_comments: true
