defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
traits:
  - id: go-camera-snapshot-helper-call
    desc: Calls a camera snapshot helper
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '\.RTSPSnapshot$'

  - id: go-get-snapshot-call
    desc: Calls a generic snapshot method
    crit: component
    if:
      type: symbol
      kind: call
      regex: '\.(GetSnapshot|SnapshotTimeout)$'
