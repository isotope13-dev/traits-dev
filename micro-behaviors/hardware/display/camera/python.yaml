# Python camera capture APIs.  The capture constructor is a clear capability;
# remote-surveillance intent is inferred by objective composites that pair it
# with other sensors and an outbound channel.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1125
  mbc: B0002

traits:
  - id: opencv-video-capture
    desc: OpenCV camera capture constructor
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: cv2.VideoCapture
