# USB Video Class (UVC) camera driver export vocabulary.
# UVC_ / DFU_ prefixed exports are generic to USB-video and device
# firmware-upgrade drivers across vendors.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: component
  conf: 0.9

traits:
  - id: uvc-dfu-export-cluster--uvc
    desc: UVC camera-control export prefix
    if:
      type: symbol
      regex: ^UVC_
  - id: uvc-dfu-export-cluster--dfu
    desc: DFU firmware-upgrade export prefix
    if:
      type: symbol
      regex: ^DFU_
composite_rules:
  - id: uvc-dfu-export-cluster
    desc: UVC and DFU camera control exports
    any:
      - id: uvc-dfu-export-cluster--uvc
      - id: uvc-dfu-export-cluster--dfu
