defaults:
  for: [vbs]
  platforms: [windows]
  crit: notable

traits:
  - id: vb-encrypted-webcam-list-command
    desc: Sends encrypted webcam enumeration command
    if:
      type: text
      regex: '(?i)\.Send\([^\r\n]{0,80}AES_Encrypt\("ListWebcamDevices"'

  - id: vb-encrypted-webcam-start-command
    desc: Sends encrypted webcam start command
    if:
      type: text
      regex: '(?i)\.Send\([^\r\n]{0,80}AES_Encrypt\("WebcamStart"'

composite_rules:
  - id: vb-encrypted-webcam-control
    desc: Sends encrypted remote webcam enumeration and start commands
    crit: suspicious
    all:
      - id: vb-encrypted-webcam-list-command
      - id: vb-encrypted-webcam-start-command
