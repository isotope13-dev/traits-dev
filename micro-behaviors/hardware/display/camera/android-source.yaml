# Source-level Android camera capture APIs. A manager import alone is common;
# the composite also requires a camera device/session or frame-reader surface.
defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: notable
  conf: 0.9
  attack: T1125

traits:
  - id: android-source-camera-manager
    desc: Android source camera manager API
    if:
      type: text
      word: CameraManager

  - id: android-source-camera-device
    desc: Android source camera device API
    if:
      type: text
      word: CameraDevice

  - id: android-source-camera-session
    desc: Android source camera session API
    if:
      type: text
      word: CameraCaptureSession

  # Package-qualified: a bare `ImageReader` word match also names
  # `javax.imageio.ImageReader`, the Java SE decoder plugin interface, so every
  # server-side image utility (Hutool's ImgUtil, Thumbnailator, ImageIO
  # wrappers) was reported as an Android camera frame reader.
  - id: android-source-camera-frame-reader
    desc: Android media ImageReader frame API
    if:
      type: text
      substr: android.media.ImageReader

composite_rules:
  - id: android-source-camera-capture
    desc: Android source camera capture capability
    crit: notable
    conf: 0.94
    all:
      - id: android-source-camera-manager
    any:
      - id: android-source-camera-device
      - id: android-source-camera-session
      - id: android-source-camera-frame-reader
