defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1123

composite_rules:
  - id: go-camera-snapshot-request
    for: [go, tar, zip]
    desc: Go camera snapshot collection path
    crit: suspicious
    conf: 0.99
    scope: outer
    all:
      - id: micro-behaviors/communications/http/url/endpoint::camera-snapshot-cgi-endpoint
      - id: micro-behaviors/data/embedded/payload/image::go-jpeg-decoder-import
