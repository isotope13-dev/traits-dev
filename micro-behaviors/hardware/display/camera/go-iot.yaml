defaults:
  platforms: [unix, windows]
  for: [go]

composite_rules:
  - id: go-camera-snapshot-request
    for: [go, tar, zip]
    desc: Camera snapshot endpoint with JPEG import
    crit: notable
    conf: 0.99
    scope: outer
    all:
      - id: micro-behaviors/communications/url/resource-path/administration::snapshot-cgi-reference
      - id: metadata/import/go/image/jpeg
