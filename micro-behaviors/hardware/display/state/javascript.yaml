# Display/Screen Capabilities - JavaScript
# Capabilities related to display enumeration and screen dimensions
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: node-screenshots-monitor-all
    desc: node-screenshots monitor enumeration
    crit: notable
    conf: 0.9
    attack: T1113
    mbc: B0002
    for: [javascript]
    if:
      type: text
      substr: Monitor.all()
  - id: electron-get-primary-display
    desc: Queries Electron primary display
    crit: notable
    conf: 0.9
    attack: T1082
    if:
      type: symbol
      kind: call
      regex: '(^|\.)getPrimaryDisplay$'
  - id: electron-primary-display-size
    desc: Reads Electron primary display dimensions
    crit: notable
    conf: 0.92
    attack: T1082
    if:
      type: text
      regex: '\bgetPrimaryDisplay\s*\(\s*\)\s*\.\s*(size|bounds|workAreaSize|workArea)\b'
  - id: display-minimum-size-gate
    desc: Checks display width or height minimum
    crit: notable
    conf: 0.85
    attack: T1497.001
    if:
      type: text
      regex: '\b(width|height)\s*(<|<=)\s*\d{3,4}\b'
