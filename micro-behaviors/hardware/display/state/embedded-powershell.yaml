# A program written in something other than PowerShell that carries a complete
# PowerShell screen-capture command as a string, to hand to the shell at
# runtime.
#
# The existing CopyFromScreen atoms only reach the language the command is
# written in: micro-behaviors/hardware/display/screenshot/reference::copyfromscreen-dotnet is
# for: [pe, dll], and objectives/collection/screenshot/windows::
# powershell-copyfromscreen is for: [powershell]. Neither sees a Node, Python,
# Go or bytecode artifact that shells out to do the same thing — which is the
# ordinary shape for a cross-platform agent or dropper, and leaves desktop
# capture invisible on exactly the artifacts a supply-chain scan gets handed.
#
# Keyed on the static-member (`::`) framing plus the screen-surface name, so
# a passing mention of the method name is not enough. Plain C# source spells
# the same query with `.` (`Screen.PrimaryScreen.Bounds`) and is covered by
# the csharp screen-primaryscreen trait; the `::` form is what an embedded
# PowerShell command or C++/CLI snippet carries into a non-PS artifact.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries, data, -powershell, -pe, -dll]
  attack: T1113
  mbc: C0014
  crit: notable
  conf: 0.93

traits:
  - id: embedded-dotnet-screen-bounds
    desc: Embeds a .NET screen-bounds query
    conf: 0.9
    if:
      type: text
      regex: '(?i)::\s*(PrimaryScreen|VirtualScreen)\b'
