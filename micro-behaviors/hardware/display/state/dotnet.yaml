# .NET Screen Capture via System.Drawing (CopyFromScreen)
# Detects the .NET managed screenshot API cluster used in RATs/stealers
# ATT&CK: T1113 (Screen Capture)
# MBC: C0014
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1113
  mbc: C0014
traits:
  - id: screen-primaryscreen-str
    desc: "Screen.PrimaryScreen access"
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: get_PrimaryScreen
  - id: dotnet-all-screens
    desc: .NET display enumeration call
    crit: baseline
    conf: 0.82
    if:
      type: text
      substr: get_AllScreens
  - id: dotnet-screen-bounds
    desc: .NET display bounds query
    crit: baseline
    conf: 0.82
    if:
      type: text
      substr: get_Bounds
  - id: dotnet-screen-width
    desc: .NET display width query
    crit: baseline
    conf: 0.82
    if:
      type: text
      substr: get_Width
  - id: dotnet-screen-height
    desc: .NET display height query
    crit: baseline
    conf: 0.82
    if:
      type: text
      substr: get_Height

  # `[System.Windows.Forms.SystemInformation]::VirtualScreen` -- the bounding
  # rectangle of *every* monitor, which is what a capture takes when it wants
  # the whole desktop rather than one window. Written for PowerShell because
  # the .NET atoms above are for: [pe, dll] and the embedded-command atom in
  # micro-behaviors/hardware/display/screenshot excludes PowerShell by design.
  - id: powershell-virtual-screen-bounds
    desc: Queries the whole-desktop bounds
    crit: notable
    conf: 0.94
    for: [powershell]
    if:
      type: text
      regex: '(?i)SystemInformation\s*\]\s*::\s*VirtualScreen'
