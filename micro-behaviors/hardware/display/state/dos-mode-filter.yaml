defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536
traits:
  - id: dos-bios-video-mode-filter
    desc: BIOS handler rejects video-mode changes
    crit: notable
    conf: 0.98
    if:
      type: hex
      # AH=00h returns directly with IRET; other requests chain onward.
      pattern: "80 FC 00 75 01 CF EA ?? ?? ?? ??"
