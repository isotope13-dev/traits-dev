# WebGL rendering mechanics — neutral GPU drawing capability.
#
# Plotting and 3D libraries (gl-vis, stack.gl, three.js, regl) are otherwise
# invisible to cleave: their code is arithmetic over a `gl` context, so a whole
# package can scan with nothing but baseline metadata and no statement of what
# it is. These traits give that class of package a purpose-defining behavior to
# diff against, which is what separates a genuine renderer from a squat or a
# trojanized copy that keeps the rendering code and appends a payload.
#
# Fingerprinting *reads* of the WebGL context (UNMASKED_VENDOR_WEBGL,
# renderer strings) are a different concept and stay in
# micro-behaviors/os/sysinfo/platform/browser/.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: webgl-draw-call
    desc: Issues a WebGL draw call
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^gl\.draw(Arrays|Elements)(Instanced)?$'

  - id: webgl-shader-program-build
    desc: Compiles or links a WebGL shader program
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^gl\.(createShader|compileShader|linkProgram)$'

  - id: webgl-vertex-buffer-upload
    desc: Uploads vertex data to a WebGL buffer
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^gl\.(bindBuffer|bufferData|bufferSubData)$'

  # glslify is the browserify/rollup transform that inlines a .glsl file at
  # build time; the call names the shader source the package ships.
  - id: glslify-shader-source-load
    desc: Loads GLSL shader source through glslify
    conf: 0.92
    if:
      type: text
      regex: 'glslify\(\s*["''][\w./-]{1,60}\.glsl["'']'
