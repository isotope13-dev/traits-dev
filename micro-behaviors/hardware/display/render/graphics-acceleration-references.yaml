---
defaults:
  crit: baseline
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - shell
  - python
  - c
  - cpp
  - rust
  - go
  - javascript
traits:
- id: x11-dga-marker-a
  desc: X11 DGA marker cluster A
  crit: baseline
  conf: 0.9
  for:
  - elf
  if:
    type: text
    regex: "(?i)(XF86DGA|XDGAOpenFramebuffer|XDGACloseFramebuffer)"
- id: x11-dga-marker-b
  desc: X11 DGA marker cluster B
  crit: baseline
  conf: 0.9
  for:
  - elf
  if:
    type: text
    regex: "(?i)(libXxf86dga|XFree86-DGA)"
- id: vdpau-ref
  desc: VDPAU video acceleration library
  crit: baseline
  conf: 0.9
  for:
  - elf
  if:
    type: text
    regex: "(?i)(vdpau|VdpDevice|VdpVideoSurface|libvdpau)"
- id: drm-driver-ref-a
  desc: DRM/KMS graphics marker cluster A
  crit: baseline
  conf: 0.8
  for:
  - elf
  if:
    type: text
    regex: "(?i)(libdrm|drmOpen|drmModeGetResources|DRM_IOCTL)"
- id: drm-driver-ref-b
  desc: DRM/KMS graphics marker cluster B
  crit: baseline
  conf: 0.8
  for:
  - elf
  if:
    type: text
    regex: "(?i)(drm_mode_|/dev/dri/)"
- id: vaapi-ref
  desc: VA-API video acceleration library
  crit: baseline
  conf: 0.9
  for:
  - elf
  if:
    type: text
    regex: "(?i)libva\\b"
- id: vaapi-get-display
  desc: VA-API vaGetDisplay marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  if:
    type: text
    regex: "(?i)vaGetDisplay"
- id: vaapi-status
  desc: VA-API status marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  if:
    type: text
    regex: "(?i)VA_STATUS"
- id: vaapi-name
  desc: VA-API name marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  if:
    type: text
    regex: "(?i)VA-API"
- id: vaapi-init
  desc: VA-API initialization marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  if:
    type: text
    regex: "(?i)vaInitialize"
- id: vaapi-terminate
  desc: VA-API termination marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  if:
    type: text
    regex: "(?i)vaTerminate"
- id: vaapi-driver
  desc: VA-API driver marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  if:
    type: text
    regex: "(?i)LIBVA_DRIVER"
composite_rules:
- id: x11-dga-marker
  desc: X11 DGA library marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  any:
  - id: micro-behaviors/hardware/display/render::x11-dga-marker-a
  - id: micro-behaviors/hardware/display/render::x11-dga-marker-b
- id: drm-driver-ref
  desc: DRM/KMS graphics driver reference
  crit: baseline
  conf: 0.8
  for:
  - elf
  any:
  - id: micro-behaviors/hardware/display/render::drm-driver-ref-a
  - id: micro-behaviors/hardware/display/render::drm-driver-ref-b
- id: video-lib-marker
  desc: Video acceleration library markers (VA-API, VDPAU)
  crit: baseline
  conf: 0.9
  any:
  - id: micro-behaviors/hardware/display/render::vaapi-ref
  - id: micro-behaviors/hardware/display/render::vdpau-ref
  - id: micro-behaviors/hardware/display/render::drm-driver-ref
