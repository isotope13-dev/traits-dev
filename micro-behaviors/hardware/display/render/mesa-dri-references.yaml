# Graphics vocabulary is not a drawing operation or independent driver identity.
defaults:
  platforms: [linux, macos, windows]
traits:
- for:
  - elf
  - macho
  - pe
  id: mesa-namespace-fragment
  desc: Mesa namespace fragment in text
  crit: baseline
  conf: 0.5
  if:
    type: text
    regex: (?i)_mesa_
- crit: baseline
  for:
  - elf
  id: dri-driver-tokens
  desc: DRI driver or configuration tokens
  conf: 0.6
  if:
    type: text
    regex: _dri\.so|drirc|DRI_PRIME
composite_rules:
- crit: baseline
  for:
  - elf
  id: dri-reference
  desc: DRI directory or driver reference
  conf: 0.6
  any:
  - id: micro-behaviors/fs/path/library::dri-directory-reference
  - id: micro-behaviors/hardware/display/render::dri-driver-tokens
