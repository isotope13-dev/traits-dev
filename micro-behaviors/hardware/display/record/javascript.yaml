# Media stream recording mechanics. MediaRecorder accepts screen, camera,
# microphone, and synthetic streams, so this atom does not claim a display
# source or surveillance intent.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: notable

traits:
  - id: media-stream-recorder
    desc: Creates a MediaRecorder for a media stream
    conf: 0.92
    if:
      type: text
      regex: 'new\s+MediaRecorder\s*\('

  - id: media-recorder-data-handler
    desc: Handles MediaRecorder dataavailable output
    conf: 0.94
    if:
      type: text
      regex: '(?i)(\bondataavailable\s*=|addEventListener\s*\(\s*["'']dataavailable["''])'
