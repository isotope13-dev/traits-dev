# .NET Screen Capture via System.Drawing (CopyFromScreen)
# Detects the .NET managed screenshot API cluster used in RATs/stealers
# ATT&CK: T1113 (Screen Capture)
# MBC: C0014
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1113
  mbc: C0014
traits:
  - id: imageformat-jpeg-str
    desc: ImageFormat.Jpeg encoding reference
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: get_Jpeg
  - id: dllimport-attribute
    desc: .NET native API import attribute
    crit: baseline
    conf: 0.88
    if:
      type: text
      exact: DllImportAttribute
  - id: pinvoke-user32-library
    desc: User32 library reference
    crit: baseline
    conf: 0.86
    if:
      type: text
      regex: (?i)^user32\.dll$
  - id: pinvoke-gdi32-library
    desc: .NET GDI32 library import
    crit: baseline
    conf: 0.86
    if:
      type: text
      regex: (?i)^gdi32\.dll$
composite_rules:
  - id: dotnet-dpi-aware-display-enumeration
    desc: .NET DPI-aware display bounds enumeration
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/hardware/display/state::dotnet-all-screens
      - id: micro-behaviors/hardware/display/state::dotnet-screen-bounds
      - id: micro-behaviors/hardware/display/state::dotnet-screen-width
      - id: micro-behaviors/hardware/display/state::dotnet-screen-height
      - id: dotnet-set-process-dpi-awareness-context
