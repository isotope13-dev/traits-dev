# Static API co-occurrence; no source-to-sink relationship is established.
defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
- id: gdi-bitmap-clipboard-desktop-api-set
  desc: GDI bitmap APIs with clipboard-read and desktop-open APIs
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/hardware/display/screenshot::gdi-bitmap-and-window-api-set
  - id: micro-behaviors/os/clipboard/read::get-clipboard-data
  - id: micro-behaviors/ui/window/station::open-desktop-import
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: metadata/binary/symbols/count::many-exports
