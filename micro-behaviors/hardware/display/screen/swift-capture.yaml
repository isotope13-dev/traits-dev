defaults:
  platforms: [macos]
  for: [swift]
  crit: notable
  conf: 0.97

traits:
  - id: swift-screencapturekit-stream-create
    desc: Creates a ScreenCaptureKit capture stream
    if:
      type: symbol
      kind: call
      regex: '^(ScreenCaptureKit\.+)?SCStream$'
  - id: swift-shareable-display-content-query
    desc: Enumerates capturable screens and windows
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SCShareableContent\.+(getExcludingDesktopWindows|excludingDesktopWindows)$'
