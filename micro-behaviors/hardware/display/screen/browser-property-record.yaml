# A display-property read, including computed properties in anti-bot clients.
# Dimension-field labels do not establish screen capture or surveillance.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: browser-indexed-screen-dimension-field
    desc: Dimension field reads indexed screen property
    conf: 0.9
    if:
      type: text
      regex: '["'']?(width|height)["'']?\s*:\s*(window\.)?screen\s*\['
