defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: single-pixel-xor-stretch-loop-shape
    desc: Single-pixel XOR stretch with backward branch
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        import "pe"
        rule foreground_single_pixel_xor_loop {
          strings:
            $pixel = { C7 44 24 28 46 00 66 00 C7 44 24 24 01 00 00 00 C7 44 24 20 01 00 00 00 }
            $repeat = { FF D0 83 EC 2C E9 ?? FF FF FF }
          condition:
            pe.imports("GDI32.dll", "StretchBlt") and
            pe.imports("USER32.dll", "GetForegroundWindow") and
            $pixel and $repeat and @repeat > @pixel and @repeat - @pixel < 128
        }
