defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: gdi-bitmap-injection-wininet-api-profile
  desc: GDI bitmap, remote-thread and dynamic WinInet API references
  crit: notable
  conf: 0.96
  near_bytes: 16384
  all:
  - id: micro-behaviors/hardware/display/screen::gdi-bitblt
  - id: micro-behaviors/hardware/display/screen::gdi-create-compatible-bitmap
  - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
  - id: micro-behaviors/communications/http/dynamic::dynamic-wininet-http-api-cluster
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/app
  - id: well-known/tool
