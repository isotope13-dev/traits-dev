defaults:
  crit: notable
  platforms: [windows, linux, macos]
  mbc: E1113
  attack: T1113
traits:
  - id: display-bounds
    desc: Display bounds enumeration
    conf: 0.7
    for:
      - go
    if:
      type: symbol
      kind: call
      regex: screenshot\.GetDisplayBounds|NumActiveDisplays
  - id: dxgi-reset-state
    desc: DXGI capture state reset
    conf: 0.96
    for: [go]
    platforms: [windows]
    if:
      type: import
      exact: dxgiState.reset
  - id: bitmap-reset-state
    desc: BitBlt capture state reset
    conf: 0.96
    for: [go]
    platforms: [windows]
    if:
      type: import
      exact: state.reset
  - id: go-session-tcp-screen-stream
    desc: Go session streams screen over TCP
    conf: 0.98
    for: [pe]
    platforms: [windows]
    if:
      type: text
      exact: 'main.(*session).tcpStreamScreen'
