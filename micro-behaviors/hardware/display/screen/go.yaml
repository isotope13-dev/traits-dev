defaults:
  crit: notable
  for: [go]
  platforms: [windows, linux, macos]
  mbc: E1113
  attack: T1113
traits:
  - id: display-bounds
    desc: Display bounds enumeration
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: screenshot\.GetDisplayBounds|NumActiveDisplays
  - id: dxgi-reset-state
    desc: DXGI capture state reset
    conf: 0.96
    platforms: [windows]
    if:
      type: import
      exact: dxgiState.reset
  - id: bitmap-reset-state
    desc: BitBlt capture state reset
    conf: 0.96
    platforms: [windows]
    if:
      type: import
      exact: state.reset
