# Permission checks and requests do not establish that pixels were captured.
defaults:
  platforms: [macos]
  for: [macho, dylib]
  crit: notable
  conf: 0.98

traits:
  - id: macos-screen-capture-permission-check-import
    desc: Imports macOS screen-recording permission check
    if:
      type: import
      exact: CGPreflightScreenCaptureAccess

  - id: macos-screen-capture-permission-request-import
    desc: Imports macOS screen-record permission request
    if:
      type: import
      exact: CGRequestScreenCaptureAccess
