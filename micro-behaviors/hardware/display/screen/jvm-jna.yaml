# GDI window/pixel capture API names bound from the JVM through JNA. The
# method name in the constant pool is the only trace of the binding.
# Previously these lived as `well-known/malware/rat/carlambo::carlambo-browser-
# {printwindow,getdibits}`, which attributed every JVM class naming PrintWindow
# or GetDIBits to that one family.
defaults:
  platforms: [windows]
  for: [class, java_class]
  crit: notable
  conf: 0.88
  mbc: C0014
  attack: T1113
traits:
  - id: jvm-print-window-name
    desc: JVM class names PrintWindow
    if:
      type: text
      exact: PrintWindow
  - id: jvm-getdibits-name
    desc: JVM class names GetDIBits
    if:
      type: text
      exact: GetDIBits
  - id: jvm-create-compatible-bitmap-name
    desc: JVM class names CreateCompatibleBitmap
    if:
      type: text
      exact: CreateCompatibleBitmap
