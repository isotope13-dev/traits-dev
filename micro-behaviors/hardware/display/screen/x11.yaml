defaults:
  crit: notable
  platforms: [unix]
  for: [binaries]
traits:
  - id: xgetimage-symbol
    desc: X11 screen image capture API
    conf: 0.86
    if:
      type: import
      exact: XGetImage
  - id: x11-reset-symbol
    desc: X11 screen capture reset function
    conf: 0.8
    if:
      type: text
      word: x11Reset
