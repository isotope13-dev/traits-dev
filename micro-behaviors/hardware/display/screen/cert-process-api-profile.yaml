composite_rules:
- id: screen-certificate-process-api-set
  desc: Bitmap, certificate, and process snapshot APIs
  crit: notable
  platforms: [windows]
  conf: 0.96
  for: [pe]
  all:
    - id: micro-behaviors/hardware/display/screen::gdi-getdibits
    - id: micro-behaviors/crypto/certificate/store::cert-enum-certificates
    - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  unless:
    - id: well-known/lib/runtime/scripted/electron::chromium-engine-capability-context
    # Kachina's updater links GetDIBits for icons, certificate enumeration
    # for TLS, and Toolhelp to find the process it is replacing.
    - id: well-known/tool/packaging/kachina::kachina-installer-pdb
    # ClassIn's camera DLL grabs frames, enumerates certs for TLS, and
    # snapshots processes to find the classroom client.
    - id: well-known/app/communication/classin::eeo-camera-basename
    # Satelle desktop AI agent daemon captures screen for computer use,
    # enumerates certificates for TLS, and snapshots processes for supervision.
    - id: well-known/tool/development/agent/satelle::satelle-agent-binary
    # ffplay renders video via GDI, verifies TLS for HTTPS streams, and
    # enumerates processes attendant to playback; not harvesting.
    - id: well-known/lib/media/ffmpeg::ffmpeg-player-binary-context
    # Godot game engine uses GDI for windowing/screen capture, enumerates
    # system root certificates for TLS, and snapshots processes for tool/debugger integration.
    - id: well-known/app/media/godot::godot-native-runtime
