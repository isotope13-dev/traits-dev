# Display Output Operations
# Console and display-related capabilities
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  # === Console Output ===
  - id: write-console-w
    desc: Unicode console output
    crit: baseline
    conf: 0.95
    if:
      type: symbol
      exact: WriteConsoleW
  - id: write-console-a
    desc: ANSI console output
    crit: baseline
    conf: 0.95
    if:
      type: symbol
      exact: WriteConsoleA
  # === Windows GDI Screen Capture Primitives ===
  - id: gdi-bitblt
    desc: GDI BitBlt raster copy API
    crit: baseline
    conf: 0.9
    mbc: C0014
    attack: T1113
    if:
      type: text
      exact: BitBlt
  - id: gdi-getdibits
    desc: GDI GetDIBits pixel readback import
    crit: notable
    conf: 0.9
    mbc: C0014
    attack: T1113
    if:
      type: import
      exact: GetDIBits
  - id: gdi-create-compatible-dc
    desc: GDI compatible device context
    crit: baseline
    conf: 0.85
    mbc: C0014
    attack: T1113
    if:
      type: text
      exact: CreateCompatibleDC
  - id: gdi-create-compatible-bitmap
    desc: GDI compatible bitmap allocation
    crit: notable
    conf: 0.85
    mbc: C0014
    attack: T1113
    if:
      type: text
      substr: CreateCompatibleBitmap
  - id: gdi-stretchblt
    desc: GDI StretchBlt raster transfer API
    crit: notable
    conf: 0.9
    mbc: C0014
    attack: T1113
    # Widened from [pe, dll, javascript, typescript]. StretchBlt is BitBlt with a
    # resize, and a screen grabber that ships thumbnails rather than full frames
    # uses it instead -- three of four decompiled C# grabbers in one RAT have
    # StretchBlt and no BitBlt, so the source spellings were unreachable.
    for: [pe, dll, source, scripts, text]
    if:
      type: text
      substr: StretchBlt
  - id: d3d11-device-swapchain
    desc: Direct3D 11 device and swap chain
    crit: notable
    conf: 0.9
    mbc: C0014
    attack: T1113
    if:
      type: symbol
      exact: D3D11CreateDeviceAndSwapChain
  - id: dotnet-set-process-dpi-awareness-context
    desc: .NET process DPI awareness context setup
    crit: baseline
    conf: 0.86
    ref: sha256:102dd32a30d7a0cf86955e6045e0426a26dfef393ce946d49c006d19c4c036e9
    if:
      type: text
      exact: SetProcessDpiAwarenessContext
  - id: print-window-api
    desc: PrintWindow window-capture API reference
    crit: notable
    conf: 0.9
    mbc: C0014
    attack: T1113
    if:
      # Text facts include native imports and CLR P/Invoke entry-point names.
      # Managed assemblies expose only their CLR bootstrap in native imports.
      type: text
      exact: PrintWindow
    downgrade:
      any:
        - id: well-known/lib/platform/browser-automation/
        - id: metadata/binary/vendor/
        - id: well-known/app/browser/internet-explorer/
        - id: well-known/lib/runtime/scripted/electron/
  - id: print-window-full-content
    desc: Screen capture renders full window content
    crit: suspicious
    conf: 0.86
    mbc: C0014
    attack: T1113
    for: [pe, dll, powershell]
    if:
      type: text
      word: PW_RENDERFULLCONTENT
    unless:
      # The constant is declared by the User32 binding, not chosen as a capture mode.
      - id: well-known/lib/platform/vanara::vanara-user32-pinvoke
      - id: metadata/build/generated::winmd-metadata
  - id: winrt-direct3d11-framepool
    desc: WinRT Direct3D11 frame pool
    crit: notable
    conf: 0.96
    mbc: C0014
    attack: T1113
    if:
      type: text
      exact: Windows.Graphics.Capture.Direct3D11CaptureFramePool
  - id: universalapi-contract-winmd
    desc: Windows Universal API contract metadata
    crit: notable
    conf: 0.96
    if:
      type: basename
      exact: Windows.Foundation.UniversalApiContract.winmd
composite_rules:
  - id: gdi-bitmap-transfer-primitives
    desc: Windows GDI bitmap transfer primitives
    crit: notable
    conf: 0.94
    all:
      - id: gdi-bitblt
      - id: gdi-create-compatible-dc
      - id: gdi-create-compatible-bitmap
    any:
      - id: micro-behaviors/ui/window/region::get-window-dc
      - id: micro-behaviors/ui/window/probe::get-desktop-window
      - id: micro-behaviors/ui/window/region::get-dc
  - id: gdi-dib-bitmap-transfer-primitives
    desc: GDI DIB bitmap transfer API set
    crit: notable
    conf: 0.92
    all:
      - id: gdi-bitblt
      - id: micro-behaviors/hardware/display/screenshot::create-dib-section
