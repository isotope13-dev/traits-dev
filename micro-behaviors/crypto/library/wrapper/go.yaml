# Go crypto-wrapper API shapes. Neutral capability observations: naming an
# exported helper GenerateKey/GenerateIV/EncryptBytes says a package wraps
# crypto primitives, nothing about intent. Objective and family composites add
# the context.
#
# Relocated (2026-08) from well-known/tool/offensive/coldfire, where
# `func (GenerateKey|GenerateIV|EncryptBytes)` was named "Coldfire
# cryptographic function symbols" at notable. `func GenerateKey` is one of the
# most common signatures in Go crypto code -- crypto/rsa, crypto/ecdsa and
# BoringSSL's own HRSS reference implementation all define it -- so a
# general-purpose matcher was asserting a red-team tool identity on its own.
# well-known/ is reserved for family-unique evidence; the Coldfire composite
# still reaches these across directories, gated by its package marker.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable

traits:
  - id: go-keygen-helper-function
    desc: Go defines a key or IV generator
    conf: 0.9
    if:
      type: text
      regex: 'func Generate(Key|IV)\b'

  - id: go-byte-cipher-helper-function
    desc: Go defines a byte encrypt/decrypt helper
    conf: 0.9
    if:
      type: text
      regex: 'func (Encrypt|Decrypt)Bytes\b'
