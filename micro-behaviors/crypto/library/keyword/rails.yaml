# ActiveSupport message-signing surface.
#
# `secret_key_base` is the Rails application signing key and
# `ActiveSupport::MessageVerifier` is the API that signs and verifies with it.
# Both are ordinary framework vocabulary -- every Rails release, and every app
# built on one, references them -- so this is a neutral crypto-library
# observation. It previously lived in the ActiveStorage parser-confusion
# objective, where it made all of stock ActiveSupport/ActiveStorage report an
# exploit building block; that composite now references this atom and supplies
# the exploit context from its variation-key and dispatch legs.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
  conf: 0.96

traits:
  - id: rails-message-signing-material
    desc: References Rails signing key or verifier
    if:
      type: text
      regex: '(?i)\bsecret[_ -]?key[_ -]?base\b|MessageVerifier|Verifier\.new\s*\('
    unless:
      - id: well-known/app/ai/tool-server/rails-ai-context/
