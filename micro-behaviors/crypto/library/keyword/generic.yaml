defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
- id: file-encryption-function-symbol
  desc: File or directory encryption function symbol
  crit: notable
  conf: 0.9
  for: [elf, macho, pe]
  if:
    type: symbol
    regex: ^encrypt_(file|directory|folder)s?$
  unless:
  - type: metrics
    field: functions.count
    min: 500
- id: data-encryption-function-symbol
  desc: Data/content encryption function symbol
  crit: notable
  conf: 0.85
  for: [elf, macho, pe]
  if:
    type: symbol
    regex: ^encrypt_(data|content)s?$
- id: encrypt-decrypt-keyword
  desc: Encryption or decryption term
  # A bare word is incomplete evidence; actual crypto operations are covered
  # by the symbol/library traits in this directory.
  crit: component
  conf: 0.8
  if:
    type: text
    regex: '\b(encrypt\w*|decrypt\w*)\b'
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/package/documentation/manpage::unix-manpage
  - id: well-known/lib/ui/monaco-editor/
  - id: metadata/document/html::doctype
  - id: metadata/document/html::legacy-doctype
- id: cipher-keyword
  desc: "Generic 'cipher' crypto term"
  crit: baseline
  conf: 0.4
  if:
    type: text
    word: cipher
    case_insensitive: true
- id: aes-keyword
  desc: AES keyword
  crit: notable
  conf: 0.4
  if:
    type: text
    exact: AES
- id: blowfish-keyword
  desc: "Blowfish block cipher reference"
  crit: baseline
  conf: 0.4
  if:
    type: text
    word: Blowfish
- id: blake3-keyword
  desc: BLAKE3 hash keyword
  crit: notable
  conf: 0.4
  if:
    type: text
    word: blake3
  unless:
  - id: metadata/package/files/system-package::shell-completion-script
- id: fixed-iv-deezer
  desc: Hardcoded IV (Deezer/predictable)
  crit: suspicious
  conf: 0.7
  if:
    type: text
    regex: \b(IV|iv)\b.{0,32}\b0001020304050607\b
- id: fixed-iv-common-a
  desc: Common 16-byte crypto test vector
  crit: notable
  conf: 0.7
  if:
    type: text
    exact: '0001020304050607'
- id: fixed-iv-common-hex
  desc: Common hex IV assignment
  for: [javascript]
  crit: suspicious
  conf: 0.7
  if:
    # Match an actual assignment node.  A text search also sees scanner
    # examples and documentation strings that merely describe this pattern.
    type: tree-sitter
    kind: assignment
    regex: '(?i)\biv\b[^=\n]{0,32}=\s*["'']0123456789abcdef["'']'
  unless:
  - id: well-known/tool/offensive/nmap::nmap-source-tree
- id: openssl-evp-encrypt
  desc: OpenSSL EVP encryption functions
  crit: notable
  conf: 0.9
  for: [scripts, binaries, c, cpp]
  if:
    type: text
    regex: EVP_(Encrypt|Cipher)Init_ex|AES_set_encrypt_key|AES_cbc_encrypt
- id: aead-mode-keyword--mode-gcm
  desc: AEAD cipher-mode keyword (MODE_GCM)
  crit: notable
  conf: 0.4
  if:
    type: text
    word: MODE_GCM
- id: aead-mode-keyword--mode-ctr
  desc: AEAD cipher-mode keyword (MODE_CTR)
  crit: notable
  conf: 0.4
  if:
    type: text
    word: MODE_CTR
composite_rules:
- id: aead-mode-keyword
  desc: AEAD cipher-mode keyword (GCM/CTR)
  crit: notable
  conf: 0.4
  any:
  - id: aead-mode-keyword--mode-gcm
  - id: aead-mode-keyword--mode-ctr
- id: encryption-algorithm-keyword
  desc: Encryption algorithm keyword
  crit: notable
  conf: 0.5
  any:
  - id: cipher-keyword
  - id: aes-keyword
  - id: blowfish-keyword
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: file-encryption-function-symbols
  desc: File or data encryption function symbols
  crit: notable
  conf: 0.9
  any:
  - id: file-encryption-function-symbol
  - id: data-encryption-function-symbol
- id: fixed-iv-common
  desc: Hardcoded IV (common test pattern)
  crit: suspicious
  conf: 0.7
  all:
  - id: encryption-algorithm-keyword
  any:
  - id: fixed-iv-common-a
  - id: fixed-iv-common-hex
