# Browser WebCrypto hybrid encryption envelope (RSA-wrapped AES session key).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.92

traits:
  - id: webcrypto-hybrid-payload-envelope
    desc: WebCrypto hybrid payload envelope fields
    if:
      type: text
      regex: '(?i)[''"]encryptedKey[''"][\s\S]{0,240}[''"]iv[''"][\s\S]{0,240}[''"]ciphertext[''"]'

  - id: webcrypto-rsa-oaep-aes-gcm-algorithm
    desc: WebCrypto RSA-OAEP and AES-GCM algorithm pair
    if:
      type: text
      regex: '(?i)RSA-OAEP.{0,48}AES-256-GCM|AES-256-GCM.{0,48}RSA-OAEP'

composite_rules:
  - id: webcrypto-hybrid-encryption-surface
    desc: WebCrypto hybrid RSA and AES encryption surface
    crit: component
    any:
      - id: webcrypto-rsa-oaep-aes-gcm-algorithm
      - id: micro-behaviors/crypto/symmetric/aes/runtime-library::webcrypto-aes-gcm-importkey
      - id: micro-behaviors/crypto/library/provider::subtle-key-ops
