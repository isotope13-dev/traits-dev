# Cryptographic context management - Windows CryptoAPI
# Neutral provider, hashing, key, and buffer-cryptography capabilities.
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: crypt-acquire-context
    desc: Acquire cryptographic service provider context
    crit: notable
    conf: 0.9
    mbc: "C0027"
    if:
      type: symbol
      regex: "CryptAcquireContext[AW]?$"
  - id: crypt-release-context
    desc: Release cryptographic context
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "CryptReleaseContext"
  - id: crypt-create-hash
    desc: Create cryptographic hash object
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "CryptCreateHash"
  - id: crypt-hash-data
    desc: Hash data using crypto provider
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "CryptHashData"
  - id: crypt-derive-key
    desc: Derive symmetric key from hash
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "CryptDeriveKey"
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100
  - id: crypt-import-key
    desc: Import encrypted key material
    crit: notable
    conf: 0.88
    if:
      type: symbol
      exact: "CryptImportKey"
  - id: crypt-verify-signature
    desc: Verify signature with CryptoAPI
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "CryptVerifySignatureW"
  - id: crypt-encrypt
    desc: Encrypt buffer with CryptoAPI
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "CryptEncrypt"
  - id: crypt-decrypt
    desc: Decrypt buffer with CryptoAPI
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "CryptDecrypt"
  - id: ncrypt-open-storage-provider
    desc: Opens a Windows CNG storage provider
    crit: notable
    conf: 0.9
    for: [binaries, scripts, source]
    if:
      type: text
      substr: NCryptOpenStorageProvider
    unless:
      - id: well-known/app/communication/telegram::telegram-desktop-signed-client-context
  - id: ncrypt-open-key
    desc: Opens a Windows CNG key
    crit: notable
    conf: 0.9
    for: [binaries, scripts, source]
    if:
      type: text
      substr: NCryptOpenKey
  # Importing a key blob and signing with it are the two halves of reusing a
  # previously exported CNG/TPM key: NCryptImportKey rehydrates the opaque blob,
  # NCryptSignHash produces a signature under it. Neutral primitives on their own
  # (Chrome reloads its own device key this way); the passkey composites pair them
  # with the enclave state to catch attacker reuse of a stolen wrapped key.
  - id: ncrypt-import-key
    desc: Imports a Windows CNG key blob
    crit: notable
    conf: 0.9
    for: [binaries, scripts, source]
    if:
      type: text
      substr: NCryptImportKey
  - id: ncrypt-sign-hash
    desc: Signs a hash with a CNG key
    crit: notable
    conf: 0.9
    for: [binaries, scripts, source]
    if:
      type: text
      substr: NCryptSignHash
  - id: ncrypt-export-key
    desc: Exports a Windows CNG key blob
    crit: notable
    conf: 0.9
    for: [binaries, scripts, source]
    if:
      type: text
      substr: NCryptExportKey
  - id: passport-key-storage-provider
    desc: Uses Microsoft Passport key storage provider
    crit: notable
    conf: 0.95
    for: [binaries, scripts, source]
    if:
      type: text
      regex: '(?i)Microsoft\s+Passport\s+Key\s+Storage\s+Provider'
  - id: ncrypt-opaque-key-blob
    desc: Names a CNG opaque key blob type
    crit: component
    conf: 0.85
    for: [binaries, scripts, source]
    if:
      type: text
      regex: '(?i)opaque[_ ]?key[_ ]?blob'
  - id: ncrypt-silent-flag
    desc: Passes the CNG silent (no-prompt) flag
    crit: component
    conf: 0.85
    for: [binaries, scripts, source]
    if:
      type: text
      substr: NCRYPT_SILENT_FLAG
composite_rules:
  # Rehydrate an exported/opaque CNG key blob and immediately sign with it. This
  # is how code reuses a key it did not itself generate this session — the reuse
  # primitive behind TPM-backed device-key impersonation. The opaque-blob and
  # silent-flag legs, when present, mark reuse of an exported blob with the
  # user-verification prompt suppressed.
  - id: cng-import-then-sign
    desc: Imports a CNG key blob then signs with it
    crit: notable
    conf: 0.92
    for: [binaries, scripts, source]
    all:
      - id: ncrypt-import-key
      - id: ncrypt-sign-hash
    downgrade:
      any:
        - id: metadata/signed/platform/
  - id: cng-opaque-blob-silent-sign
    desc: Silently signs with an imported opaque CNG blob
    crit: notable
    conf: 0.92
    for: [pe, dll, c, cpp, csharp, rust, go, python]
    all:
      - id: cng-import-then-sign
    any:
      - id: ncrypt-opaque-key-blob
      - id: ncrypt-silent-flag
  - id: capi-key-material-setup
    desc: CryptoAPI key setup from derived or imported material
    crit: notable
    conf: 0.88
    all:
      - id: crypt-acquire-context
    any:
      - id: crypt-derive-key
      - id: crypt-import-key
    unless:
      - id: crypt-verify-signature
  - id: capi-buffer-crypto-operations
    desc: CryptoAPI buffer encrypt decrypt operations
    crit: notable
    conf: 0.9
    any:
      - id: crypt-encrypt
      - id: crypt-decrypt
  - id: capi-keyed-buffer-crypto-chain
    desc: CryptoAPI key setup with buffer encryption operations
    crit: notable
    conf: 0.9
    all:
      - id: capi-key-material-setup
      - id: capi-buffer-crypto-operations
    downgrade:
      any:
        - id: metadata/signed/platform/
