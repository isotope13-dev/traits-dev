defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.85
  mbc: C0059
traits:
  - id: rustls-crate-path
    desc: Rust rustls TLS library
    if:
      type: text
      # Cargo embeds native separators in Windows build paths too.
      regex: '[/\\]rustls-[0-9.]+[/\\]src[/\\]'
