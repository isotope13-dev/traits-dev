# A wolfSSL name reference: the embedded TLS/crypto library is linked,
# vendored, or mentioned (MariaDB bundles it; its valgrind suppressions name
# it). A provider reference, not proof of any specific operation. Relocated
# (2026-09) from objectives/command-and-control/channel/quic, whose MsQuic +
# wolfSSL composite still references it.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries, pe, elf, macho, text]
  crit: notable

traits:
  - id: wolfssl-library-reference
    desc: References the wolfSSL library
    conf: 0.82
    if:
      type: text
      substr: wolfSSL
