defaults:
  platforms:
    - unix
    - windows
  for:
    - java
    - class
traits:
  - id: jvm-crypto-class-ref
    desc: JVM crypto package reference
    crit: baseline
    conf: 0.9
    for: [class]
    if:
      type: value
      path: class.class_refs[*]
      regex: '^javax/crypto(/|$)'
  # AES-GCM parameters accompany AES-GCM operations, without proving data flow.
  - id: jvm-gcm-parameter-spec
    desc: JVM uses AES-GCM parameter spec
    crit: notable
    conf: 0.9
    for: [class, java_class]
    if:
      type: text
      substr: javax/crypto/spec/GCMParameterSpec
