defaults:
  platforms:
    - unix
    - windows
  for:
    - java
    - class
traits:
  - id: secretkeyspec
    desc: Java SecretKeySpec symmetric key construction
    crit: notable
    conf: 0.9
    mbc: C0015
    attack: T1573.001
    if:
      type: text
      substr: javax/crypto/spec/SecretKeySpec
  - id: cipher-class
    desc: Java Cipher class reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: javax/crypto/Cipher
  - id: jvm-crypto-class-ref
    desc: JVM crypto package reference
    crit: baseline
    conf: 0.9
    for: [class, jar, zip]
    if:
      type: value
      path: class.class_refs[*]
      regex: '^javax/crypto(/|$)'
  - id: jvm-security-class-ref
    desc: JVM security package reference
    crit: baseline
    conf: 0.86
    for: [class, jar, zip]
    if:
      type: value
      path: class.class_refs[*]
      regex: '^java/security(/|$)'
  - id: java-cipher-getinstance-source
    desc: Java Cipher.getInstance source call
    crit: notable
    conf: 0.9
    mbc: C0015
    for: [java, kotlin, groovy, scala]
    if:
      type: text
      regex: '\bCipher\.getInstance\s*\('
  - id: java-secretkeyspec-source
    desc: Java SecretKeySpec construction source
    crit: notable
    conf: 0.9
    mbc: C0015
    for: [java, kotlin, groovy, scala]
    if:
      type: text
      regex: 'new\s+SecretKeySpec\s*\('
  - id: java-aes-ecb-transform
    desc: Java AES cipher requested in ECB mode
    crit: notable
    conf: 0.92
    mbc: C0027
    for: [java, class, kotlin, groovy, scala]
    if:
      type: text
      regex: '\bAES/ECB/(NoPadding|PKCS5Padding|PKCS7Padding)'
  - id: dofinal-method
    desc: Java doFinal method reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: doFinal
composite_rules:
  - id: cipher-init
    desc: Java Cipher initialization and encryption
    crit: notable
    conf: 0.9
    mbc: C0015
    attack: T1573.001
    all:
      - id: cipher-class
      - id: dofinal-method
  - id: java-raw-key-cipher-use
    desc: Java Cipher used with a raw key
    crit: notable
    conf: 0.9
    mbc: C0015
    attack: T1573.001
    all:
      - id: secretkeyspec
      - id: cipher-init
