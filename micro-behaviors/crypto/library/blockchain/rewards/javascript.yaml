defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
- id: reward-balance-display-text
  desc: Blockchain reward balance display text
  if:
    type: text
    regex: '\b(outstanding|staking)\s+rewards?\b'
    case_insensitive: true

- id: reward-amount-template
  desc: Cosmos token amount display template
  conf: 0.92
  if:
    type: literal
    kind: string
    regex: '\$\{[A-Za-z_$][A-Za-z0-9_$]*\}\s+ATOM\b'

- id: reward-action-cta
  desc: Staking reward action call-to-action text
  if:
    type: text
    regex: '\b(claim|withdraw|redelegate)\s+(the\s+)?(staking\s+)?rewards?\b'
    case_insensitive: true
