defaults:
  platforms: [windows, linux, macos]
  for: [binaries, scripts, html, chrome-manifest, crx, text, xpi]

traits:
  - id: wallet-brand-metamask
    desc: MetaMask wallet brand reference
    crit: component
    if:
      type: text
      word: MetaMask
      case_insensitive: true
  - id: wallet-brand-rabby
    desc: Rabby wallet brand reference
    crit: component
    if:
      type: text
      word: Rabby
      case_insensitive: true
  - id: wallet-brand-coinbase
    desc: Coinbase wallet brand reference
    crit: component
    if:
      type: text
      word: Coinbase
      case_insensitive: true
