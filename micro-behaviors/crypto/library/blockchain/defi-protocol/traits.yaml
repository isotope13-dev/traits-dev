# Neutral DEX protocol name mentions (not credential access by themselves).
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source, javascript, typescript, markdown, text]
  crit: notable
  conf: 0.5

traits:
  - id: defi-protocol-dex
    desc: DEX protocol name reference
    if:
      type: text
      regex: (?i)(uniswap|sushiswap|pancakeswap)
    unless:
      - id: metadata/file/catalog/identity/
