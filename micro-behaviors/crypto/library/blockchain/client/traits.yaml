# Ethereum JSON-RPC fields and recipient-byte reconstruction.
# These are neutral protocol and data-handling capabilities; C2 intent is
# inferred by the blockchain dead-drop composites in objectives/.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python]
  crit: notable
  conf: 0.9

traits:
  - id: viem-http-rpc-transport
    desc: Viem HTTP transport uses configured RPC
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '\btransport\s*:\s*http\s*\([^;\n]{0,160}\b(rpcUrl|endpoint|baseUrl)\b'

  - id: ethereum-jsonrpc-transaction-method
    desc: Ethereum JSON-RPC transaction lookup method
    for: [javascript, typescript]
    if:
      type: text
      regex: 'eth_(getLogs|getTransactionByHash|getTransactionReceipt)'

  - id: ethereum-jsonrpc-block-number-method
    desc: Ethereum JSON-RPC block-number lookup method
    crit: notable
    conf: 0.9
    for: [javascript, typescript, go]
    if:
      type: text
      word: eth_blockNumber

  - id: ethereum-jsonrpc-block-by-number-method
    desc: Ethereum JSON-RPC block lookup
    crit: notable
    conf: 0.9
    for: [javascript, typescript, go]
    if:
      type: text
      word: eth_getBlockByNumber

  - id: ethereum-jsonrpc-transaction-count-method
    desc: Ethereum transaction-count RPC
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      word: eth_getTransactionCount

  - id: ethereum-jsonrpc-method
    desc: Ethereum JSON-RPC method field
    if:
      type: text
      regex: '(["'']method["'']|\bmethod)\s*[:=]\s*["'']eth_[A-Za-z]+'

  - id: ethereum-transaction-recipient-field
    desc: Reads an Ethereum transaction recipient
    if:
      type: text
      regex: '\b(transaction|tx)\s*(\.\s*to\b|\[\s*["'']to["'']\s*\])'

  # A recipient address is a 20-byte hex value.  Turning that field into a
  # byte buffer is neutral in isolation; the resolver objective below adds the
  # transaction-history and network-use context that makes it a dead drop.
  - id: ethereum-recipient-buffer-conversion
    desc: Converts recipient address to Buffer
    crit: component
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bBuffer\.from\s*\([^;\n]{0,120}(recipient|destination|addressBytes|transaction\.to)'

  - id: ethereum-recipient-hex-encoding
    desc: Recipient Buffer uses hex encoding
    crit: component
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bBuffer\.from\s*\([^;\n]{0,120}["'']hex["'']\s*\)'

  # NullReceiver-style samples split the recipient bytes in groups rather than
  # using the older two-adjacent-subarray idiom.  Keep the ranges as named atoms
  # so the composite can tolerate unrelated code between the two reads.
  - id: ethereum-recipient-four-byte-prefix
    desc: Recipient first four-byte slice
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(addressBytes|recipient|destination)\.(subarray|slice)\s*\(\s*0\s*,\s*4\s*\)'

  - id: ethereum-recipient-four-byte-suffix
    desc: Recipient second four-byte slice
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(addressBytes|recipient|destination)\.(subarray|slice)\s*\(\s*4\s*,\s*8\s*\)'

  - id: ethereum-recipient-byte-map-source
    desc: Maps recipient-derived bytes
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?s)(addressBytes|recipient|destination).{0,260}(flatMap|Array\.from|map)'

  - id: ethereum-recipient-dotted-join
    desc: Joins byte values with dots
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(flatMap|Array\.from|map)[^;\n]{0,220}\.join\s*\(\s*["'']\.["'']\s*\)'

  - id: ethereum-empty-input-field
    desc: Empty Ethereum transaction input
    if:
      type: text
      regex: '(\binput\b|\[["'']input["'']\])\s*(===?|:)\s*["'']0x["'']'

  - id: ethereum-zero-value-field
    desc: Tests an Ethereum transaction for zero value
    if:
      type: text
      regex: '(\bvalue\b|\[["'']value["'']\])\s*(===?|:)\s*["'']0x0+["'']'

  - id: ethereum-recipient-ipv4-slice-javascript
    desc: Ethereum recipient IPv4 slice
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(recipient|destination|addressBytes)\.(slice|substring)\s*\(\s*0\s*,\s*8\s*\)'

  # Variants iterate through the recipient in two-byte hex octets instead of
  # taking one fixed eight-character slice. Keep the pieces separate so the
  # matcher stays short; the C2 composites still require JSON-RPC transaction
  # data, hex-to-decimal conversion, dotted output, and a network sink.
  - id: ethereum-recipient-indexed-slice
    desc: Ethereum recipient uses indexed byte slices
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(addressBytes|recipient|destination)\.(slice|substring)\([^)]{1,40}\+\s*2'

  - id: ethereum-recipient-indexed-subarray
    desc: Ethereum recipient uses indexed subarrays
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(addressBytes|recipient|destination)\.subarray\([^)]{1,40}\+\s*2'

  - id: ethereum-recipient-ipv4-slice-python
    desc: Ethereum recipient IPv4 slice (Python)
    for: [python]
    if:
      type: text
      regex: '(recipient|destination)\s*\[\s*i\s*:\s*i\s*\+\s*2\s*\]'

  - id: ethereum-recipient-ipv4-range-python
    desc: Four-byte recipient range (Python)
    for: [python]
    if:
      type: text
      regex: 'range\s*\(\s*0\s*,\s*8\s*,\s*2\s*\)'

  - id: ethereum-hex-octets-dot-join-javascript
    desc: Hex octets joined as dotted IPv4 (JS)
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)parseInt\s*\([\s\S]{0,120},\s*16\s*\)[\s\S]{0,180}\.join\s*\(\s*["'']\.["'']\s*\)'
    unless:
      - id: ip-address-ipv4-parser-path

  - id: ip-address-ipv4-parser-path
    desc: ip-address npm library IPv4 parser source
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: path
      regex: '(?i)ip-address[/\\]dist[/\\]ipv4\.js$'

  # Split forms stay under re-len; both require int(...,16) BEFORE a '.' join
  # (prior `.join`→int order false-positived py-cpuinfo feature-flag parsers).
  - id: eth-hex-dot-join-py-str
    desc: Hex int then quote-dot-quote .join (Python)
    crit: component
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: "(?is)int\\s*\\([^)]{0,40},\\s*16\\)[\\s\\S]{0,100}['\"]\\.['\"]\\.join"

  - id: eth-hex-dot-join-py-arg
    desc: Hex int then .join('.') (Python)
    crit: component
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: "(?is)int\\s*\\([^)]{0,40},\\s*16\\)[\\s\\S]{0,100}\\.join\\s*\\(\\s*['\"]\\."

composite_rules:
  - id: ethereum-hex-octets-dot-join-python
    desc: Hex octets joined as dotted IPv4 (Python)
    crit: notable
    conf: 0.9
    for: [python]
    any:
      - id: eth-hex-dot-join-py-str
      - id: eth-hex-dot-join-py-arg

  - id: ethereum-recipient-hex-buffer
    desc: Ethereum recipient hex byte buffer
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    near_bytes: 220
    all:
      - id: ethereum-recipient-buffer-conversion
      - id: ethereum-recipient-hex-encoding

  - id: ethereum-transaction-recipient-ip-split
    desc: Splits Ethereum transaction bytes into IPv4-sized slices
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    # The byte shape alone is common in terminal, media, and protocol parsers.
    # Require the slice pair plus transaction semantics before classifying it as
    # blockchain behavior.
    all:
      - id: micro-behaviors/data/buffer::adjacent-four-byte-subarrays
      - id: ethereum-transaction-byte-context

  - id: ethereum-recipient-byte-ip-assembly
    desc: Recipient bytes reconstruct dotted IPv4
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    near_bytes: 1200
    all:
      - id: ethereum-recipient-hex-buffer
      - id: ethereum-recipient-four-byte-slices
      - id: ethereum-recipient-byte-octets-dotted
      - id: ethereum-transaction-byte-context

  - id: ethereum-recipient-byte-octets-dotted
    desc: Recipient bytes map to dotted IPv4
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    near_bytes: 360
    all:
      - id: ethereum-recipient-byte-map-source
      - id: ethereum-recipient-dotted-join

  - id: ethereum-recipient-four-byte-slices
    desc: Recipient bytes split into four-byte ranges
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    near_bytes: 320
    all:
      - id: ethereum-recipient-four-byte-prefix
      - id: ethereum-recipient-four-byte-suffix

  - id: ethereum-transaction-byte-context
    desc: Ethereum transaction byte context
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    any:
      - id: ethereum-transaction-recipient-field
      - id: ethereum-jsonrpc-transaction-method
      - id: ethereum-jsonrpc-block-by-number-method

  - id: ethereum-blockchain-history-lookup
    desc: Looks up Ethereum blocks and account nonce state
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: ethereum-jsonrpc-block-by-number-method
      - id: ethereum-jsonrpc-transaction-count-method

  - id: ethereum-jsonrpc-method-query
    desc: Ethereum JSON-RPC method query
    all:
      - id: micro-behaviors/communications/ipc/rpc::jsonrpc-2-protocol-object
      - id: ethereum-jsonrpc-method
    near_lines: 8

  - id: ethereum-recipient-ipv4-byte-slice
    desc: Ethereum recipient IPv4 byte slice
    any:
      - id: ethereum-recipient-ipv4-slice-javascript
      - id: ethereum-recipient-ipv4-byte-slice-python
      - id: ethereum-recipient-indexed-slice
      - id: ethereum-recipient-indexed-subarray

  - id: ethereum-recipient-ipv4-byte-slice-python
    desc: Python recipient IPv4 byte slice
    for: [python]
    all:
      - id: ethereum-recipient-ipv4-slice-python
      - id: ethereum-recipient-ipv4-range-python

  - id: ethereum-recipient-hex-ip-assembly
    desc: Ethereum recipient IPv4 reconstruction
    all:
      - id: ethereum-recipient-ipv4-byte-slice
    any:
      - id: ethereum-hex-octets-dot-join-javascript
      - id: ethereum-hex-octets-dot-join-python

  - id: ethereum-zero-value-empty-data-transfer
    desc: Zero-value empty Ethereum transfer
    all:
      - id: ethereum-zero-value-field
      - id: ethereum-empty-input-field
