defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
- id: ethereum-explorer-transaction-url
  desc: Ethereum-compatible explorer transaction URL
  if:
    type: text
    regex: '(?i)(basescan\.org|optimistic\.etherscan\.io|polygonscan\.com|arbiscan\.io)/tx/'

- id: blockscout-account-transaction-list
  desc: Blockscout transaction-list API
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?i)blockscout\.com[\s\S]{0,240}module[=:]account[\s\S]{0,120}action[=:]txlist'

- id: blockscout-account-transaction-list-encoded
  desc: Encoded Blockscout transaction-list API
  crit: notable
  conf: 0.9
  if:
    type: encoded
    encoding: unicode-escape
    substr: blockscout.com

# Shared NullReceiver / EtherHiding npm campaign wallet. Publishers rotate the
# on-chain dead-drop by sending from this address; the prefix alone survives
# string-array splitting (`0xa322E5f3` + later hex fragments).
- id: etherhiding-campaign-wallet-prefix
  desc: EtherHiding campaign Ethereum wallet prefix
  crit: suspicious
  conf: 0.95
  # A wallet address is an on-chain marker, not a JavaScript-only behavior.
  # Make it available to source and compiled-artifact composites.
  for: [javascript, typescript, scripts, source, binaries]
  if:
    type: text
    substr: '0xa322E5f3'

# Same wallet when hidden behind `\u00XX` escapes (godot-kit@1.0.1786316795).
- id: etherhiding-campaign-wallet-prefix-unicode
  desc: Unicode-escaped EtherHiding wallet prefix
  crit: suspicious
  conf: 0.95
  if:
    type: encoded
    encoding: unicode-escape
    substr: '0xa322E5f3'

# Split `eth.blockscout.com` host (`h.blocksco` + `ut.com/api`).
- id: blockscout-host-fragment
  desc: Split Blockscout Ethereum host fragment
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: h.blocksco

composite_rules:
- id: ethereum-explorer-rpc-transaction-lookup
  desc: Looks up an Ethereum transaction through an explorer and JSON-RPC
  crit: notable
  conf: 0.9
  all:
  - id: ethereum-explorer-transaction-url
  - id: micro-behaviors/crypto/library/blockchain/client::ethereum-jsonrpc-transaction-method
