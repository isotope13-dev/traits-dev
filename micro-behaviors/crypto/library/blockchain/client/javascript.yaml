defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
- id: viem-http-rpc-transport
  desc: Viem HTTP transport uses configured RPC
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\btransport\s*:\s*http\s*\([^;\n]{0,160}\b(rpcUrl|endpoint|baseUrl)\b'

- id: ethereum-explorer-transaction-url
  desc: Ethereum-compatible explorer transaction URL
  if:
    type: text
    regex: '(?i)(basescan\.org|optimistic\.etherscan\.io|polygonscan\.com|arbiscan\.io)/tx/'

- id: ethereum-jsonrpc-transaction-method
  desc: Ethereum JSON-RPC transaction lookup method
  if:
    type: text
    regex: 'eth_(getLogs|getTransactionByHash|getTransactionReceipt)'

- id: ethereum-jsonrpc-block-number-method
  desc: Ethereum JSON-RPC block-number lookup method
  crit: notable
  conf: 0.9
  if:
    type: text
    word: eth_blockNumber

- id: ethereum-jsonrpc-block-by-number-method
  desc: Ethereum JSON-RPC block lookup
  crit: notable
  conf: 0.9
  if:
    type: text
    word: eth_getBlockByNumber

- id: ethereum-jsonrpc-transaction-count-method
  desc: Ethereum transaction-count RPC
  crit: notable
  conf: 0.9
  if:
    type: text
    word: eth_getTransactionCount

- id: blockscout-account-transaction-list
  desc: Blockscout transaction-list API
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?i)blockscout\.com[\s\S]{0,240}module[=:]account[\s\S]{0,120}action[=:]txlist'

- id: blockscout-account-transaction-list-encoded
  desc: Encoded Blockscout transaction-list API
  crit: notable
  conf: 0.9
  if:
    type: encoded
    encoding: unicode-escape
    substr: blockscout.com

- id: ethereum-transaction-recipient-ip-split
  desc: Splits transaction bytes into IPv4-sized slices
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: 'subarray\s*\(\s*0\s*,\s*4\s*\).{0,120}subarray\s*\(\s*4\s*,\s*8\s*\)'

composite_rules:
- id: ethereum-explorer-rpc-transaction-lookup
  desc: Looks up an Ethereum transaction through an explorer and JSON-RPC
  crit: notable
  conf: 0.9
  all:
  - id: ethereum-explorer-transaction-url
  - id: ethereum-jsonrpc-transaction-method

- id: ethereum-blockchain-history-lookup
  desc: Looks up Ethereum blocks and account nonce state
  crit: notable
  conf: 0.94
  all:
  - id: ethereum-jsonrpc-block-by-number-method
  - id: ethereum-jsonrpc-transaction-count-method
