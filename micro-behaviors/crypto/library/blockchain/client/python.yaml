defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
traits:
- id: web3-import
  desc: Python Web3 library import
  conf: 0.9
  if:
    type: symbol
    exact: Web3
- id: staking-sign-flow--rx-1
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: (secp256k1|bech32).{0,80}(broadcast|tx)
- id: staking-sign-flow--rx-2
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: (sign_doc|sign_bytes).{0,80}(broadcast|tx)
- id: staking-sign-flow--rx-3
  desc: Regex component marker
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: ledger.{0,40}sign
- id: walletd-daemon-ref
  desc: Wallet daemon reference
  crit: component
  conf: 0.88
  if:
    type: text
    substr: walletd
- id: walletd-node-indexer-config
  desc: Wallet daemon node or indexer configuration
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'EXFER_(NODE|INDEXER)_RPC|--(node|indexer)-rpc'
- id: walletd-loopback-bind
  desc: Wallet daemon loopback bind configuration
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: 127.0.0.1:7448
# `walletd-github-release-download` removed: its matcher was a bare
# `releases/download`, which says nothing about a wallet daemon. The canonical
# atom is micro-behaviors/communications/http/download/release, referenced from
# `verified-walletd-release-fetcher-context` below, where the walletd legs
# supply the identity.
- id: walletd-init-seeded
  desc: Wallet daemon seeded keystore init
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: init-seeded
- id: crypto-permutation-word
  desc: Crypto permutation marker
  crit: notable
  conf: 0.9
  if:
    type: text
    word: permutation
- id: crypto-number-theory-phrase
  desc: Number theory marker
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: number theory
- id: crypto-polynomial-word
  desc: Cryptographic polynomial math marker
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)\b(elliptic|finite|modular|cryptograph|keccak|secp\d*)\b.{0,40}\bpolynomial\b'
composite_rules:
- id: crypto-math-library-context
  desc: Cryptographic math library context
  crit: baseline
  conf: 0.9
  any:
  - id: micro-behaviors/crypto/hash/digest::crypto-keccak-permutation-context
  - id: crypto-number-theory-library-context
- id: crypto-number-theory-library-context
  desc: Number theory library context
  crit: baseline
  conf: 0.9
  all:
  - id: crypto-number-theory-phrase
  - id: crypto-polynomial-word
- id: staking-sign-flow
  desc: Blockchain sign-doc or ledger signing
  crit: baseline
  conf: 0.88
  any:
  - id: staking-sign-flow--rx-1
  - id: staking-sign-flow--rx-2
  - id: staking-sign-flow--rx-3
- id: managed-hot-wallet-client-context
  desc: Managed hot-wallet client context
  crit: baseline
  conf: 0.94
  all:
  - id: walletd-daemon-ref
  - id: micro-behaviors/os/env/secret-name::walletd-passphrase-env
  - id: walletd-node-indexer-config
  - id: walletd-loopback-bind
- id: public-blockchain-readonly-client-context
  desc: Public blockchain read-only API client
  crit: baseline
  conf: 0.9
  any:
  - id: micro-behaviors/communications/http/url/rpc::etherscan-api-url
  - id: micro-behaviors/communications/http/url/rpc::bscscan-api-url
  - id: micro-behaviors/communications/http/url/rpc::polygonscan-api-url
  - id: micro-behaviors/communications/http/url/rpc::arbiscan-api-url
  - id: micro-behaviors/communications/http/url/endpoint::coingecko-simple-price-api
  - id: micro-behaviors/communications/http/url/rpc::cloudflare-eth-rpc-url
  - id: micro-behaviors/communications/http/url/rpc::publicnode-sepolia-rpc-url
  - id: micro-behaviors/communications/http/url/rpc::binance-bsc-rpc-url
  - id: micro-behaviors/communications/http/url/rpc::polygon-rpc-url
- id: verified-walletd-release-fetcher-context
  desc: Wallet daemon release URL and checksum label
  crit: baseline
  conf: 0.94
  all:
  - id: walletd-daemon-ref
  - id: micro-behaviors/communications/http/download/release::forge-release-download-url
  - id: "metadata/package/integrity::sha256sums-checksums-or-compute-label"
- id: seeded-wallet-keystore-context
  desc: Wallet daemon seeded keystore initializer
  crit: baseline
  conf: 0.94
  all:
  - id: walletd-daemon-ref
  - id: walletd-init-seeded
  - id: micro-behaviors/fs/path/wallet::walletd-seed-enc-path
  any:
  - id: micro-behaviors/ui/controls/wallet::walletd-recovery-phrase-warning
  - id: micro-behaviors/os/env/secret-name::walletd-passphrase-env
