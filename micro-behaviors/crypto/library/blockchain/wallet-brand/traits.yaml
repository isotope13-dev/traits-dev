# Canonical home for wallet brand-name atoms. An automated repair pass had
# scattered these across wallet-brand/ plus wallet-brands-evm/,
# wallet-brands-exchange/ and wallet-brands-solana/, leaving one copy of
# each brand orphaned, six trait groups differing only in `for:`, and the
# well-known/ extension rules pointing at ids that no longer existed --
# which hard-failed every scan. wallet-brands-exchange/ held a single
# trait, the weak-feature split TAXONOMY warns against; one directory
# carrying all six brands is the stronger ML feature.
defaults:
  platforms: [windows, linux, macos]
  # Union of the coverage that was scattered across wallet-brands-{evm,
  # exchange,solana}: groups for binaries/scripts/source plus the standalone
  # markup and browser-extension container types those splits added.
  for: [binaries, scripts, source, html, chrome-manifest, crx, text, xpi]

traits:
  - id: wallet-brand-metamask
    desc: MetaMask wallet brand reference
    crit: component
    if:
      type: text
      word: MetaMask
      case_insensitive: true
  - id: wallet-brand-phantom
    desc: Phantom wallet brand reference
    crit: component
    if:
      type: text
      regex: '(?i)\bPhantom\s+Wallet\b|\bphantom\.app\b'
  - id: wallet-brand-rabby
    desc: Rabby wallet brand reference
    crit: component
    if:
      type: text
      word: Rabby
      case_insensitive: true
  - id: wallet-brand-bitget
    desc: Bitget wallet brand reference
    crit: component
    if:
      type: text
      word: Bitget
      case_insensitive: true
  - id: wallet-brand-coinbase
    desc: Coinbase wallet brand reference
    crit: component
    if:
      type: text
      word: Coinbase
      case_insensitive: true
  - id: wallet-brand-solflare
    desc: Solflare wallet brand reference
    crit: component
    if:
      type: text
      word: Solflare
      case_insensitive: true

composite_rules:
  # Lives beside the brand atoms it counts. It was in ../wallet/mnemonic.yaml,
  # reaching across directories for all six legs, which trips the
  # "hand-maintains many refs to one directory" check. A directory reference
  # is not a substitute here: it collapses to ONE condition, so `needs: 3`
  # ("three different brands, not one name three times") becomes unsatisfiable.
  # Keeping the composite local keeps the per-brand legs and the count.
  #
  # A wallet SDK can legitimately enumerate supported providers, so this stays
  # a neutral capability; phishing intent comes from the composite that also
  # requires credential input and forwarding.
  - id: wallet-brand-catalog
    desc: Multiple wallet brands supported by a bundle
    crit: notable
    conf: 0.94
    for: [html, javascript, archives]
    any:
      - id: wallet-brand-metamask
      - id: wallet-brand-phantom
      - id: wallet-brand-rabby
      - id: wallet-brand-bitget
      - id: wallet-brand-coinbase
      - id: wallet-brand-solflare
      - id: well-known/app/browser-extension::wallet-marker-tronlink
    needs: 3
