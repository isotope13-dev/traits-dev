defaults:
  platforms: [unix, windows]
  for: [shell, scripts, source]

traits:
  - id: foundry-cast-address-from-private-key
    desc: Foundry cast derives address from private key
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\bcast\s+wallet\s+address\b[^\r\n]{0,160}--private-key\b'
