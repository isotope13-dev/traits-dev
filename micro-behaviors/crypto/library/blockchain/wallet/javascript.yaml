defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
- id: solana-keypair-from-secret-key
  desc: Solana keypair from secret key
  if:
    type: text
    substr: Keypair.fromSecretKey

- id: bip39-mnemonic-validation
  desc: BIP39 mnemonic validation call
  if:
    type: text
    substr: validateMnemonic

- id: wallet-factory-entrypoint
  desc: Wallet library factory entrypoint
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(Wallet|HDNode|Keypair|XrplWallet)\s*\.\s*from'
  unless:
    - id: metadata/lang/scripted::dts-declaration-file

- id: private-key-from-hex
  desc: Private key parsed from hexadecimal input
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '\bPrivateKey\s*\.\s*fromHex\s*\('

- id: private-key-from-mnemonic
  desc: Private key derived from mnemonic input
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '\bPrivateKey\s*\.\s*fromMnemonic\s*\('

- id: ethers-wallet-from-private-key
  desc: Ethers wallet created from private key
  if:
    type: text
    regex: '\bnew\s+ethers\.Wallet\s*\('

- id: eth-lightwallet-keystore
  desc: Ethereum lightwallet keystore library
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: \beth-lightwallet\b|lightwallet\.keystore
  unless:
    - id: metadata/file/extension/identity::declaration-file-extension

- id: asym-encrypt-string
  desc: Asymmetric string encryption helper
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: asymEncryptString

- id: hardcoded-eth-wallet-constant
  desc: Defines hardcoded Ethereum address constant
  if:
    type: text
    regex: '\b[A-Z][A-Z0-9_]*(WALLET|RECIPIENT|ADDRESS)[A-Z0-9_]*\s*=\s*["'']0x[a-fA-F0-9]{40}["'']'
  not:
    - regex: '0x0{40}'

- id: return-wallet-constant
  desc: Returns wallet address constant
  if:
    type: text
    regex: 'return\s+[A-Z][A-Z0-9_]*(WALLET|RECIPIENT|ADDRESS)[A-Z0-9_]*\s*;'

composite_rules:
- id: wallet-key-derivation-entrypoint
  desc: Wallet private-key derivation entrypoint
  crit: notable
  conf: 0.9
  any:
    - id: wallet-factory-entrypoint
    - id: private-key-from-hex
    - id: private-key-from-mnemonic
