defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
- id: return-wallet-constant
  desc: Returns wallet address constant
  if:
    type: text
    regex: 'return\s+[A-Z][A-Z0-9_]*(WALLET|RECIPIENT|ADDRESS)[A-Z0-9_]*\s*;'
  not:
    - regex: 'return\s+[A-Z0-9_]*(ZERO|NULL|DEAD|BURN|EMPTY|SYSTEM)[A-Z0-9_]*\s*;'
