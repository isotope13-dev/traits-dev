defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: ss58-address-literal
    desc: SS58-format blockchain address literal
    crit: notable
    conf: 0.75
    if:
      type: literal
      kind: string
      regex: \b5[1-9A-HJ-NP-Za-km-z]{47}\b
    not:
      - regex: ^[0-9a-fA-F]{48}$
