defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: ss58-address-literal
    desc: SS58-format blockchain address literal
    crit: notable
    conf: 0.75
    if:
      type: literal
      kind: string
      regex: \b5[1-9A-HJ-NP-Za-km-z]{47}\b
    not:
      - regex: ^[0-9a-fA-F]{48}$
  # Any SS58 network prefix (Polkadot `1...`/`5...`, Kusama `C/E/G...`,
  # Bittensor `5...`): a 32-byte account id encodes to 46-49 characters of
  # pure Base58. Sitting in a `dest` call param this is a balance-transfer
  # (or force_transfer/claims) destination written as a fixed literal —
  # normal in codecs, tests, and examples; the transfer-hijack objective
  # composes it with signing and broadcast evidence.
  - id: ss58-transfer-dest-literal
    desc: SS58 account literal in transfer dest param
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[''"]dest[''"]\s*:\s*[''"][1-9A-HJ-NP-Za-km-z]{46,49}[''"]'
