# Wallet seed-generation primitives used by the weak-randomness objective.
# These atoms describe code structure and API use; the objective combines them
# so ordinary PRNG use outside key material remains a neutral observation.
defaults:
  platforms: [windows, linux, macos]
  for: [source, scripts, binaries]

traits:
  - id: wallet-seed-generation-call
    desc: Wallet seed or mnemonic generation call
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, c, cpp, rust]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(entropyToMnemonic|mnemonic_from_entropy|generateMnemonic)$'

  - id: wallet-keypair-generation-call
    desc: Wallet keypair generation call
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, c, cpp, rust]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(keypair|generateKeypair)$'

  - id: wallet-seed-generator-function
    desc: Wallet seed generator function
    crit: notable
    conf: 0.86
    for: [javascript, typescript, python, c, cpp, rust]
    if:
      type: symbol
      kind: function
      regex: '(?i)^(make|create|generate)[A-Za-z0-9_]*(wallet|seed)[A-Za-z0-9_]*$'

composite_rules:
  - id: wallet-key-material-generation
    desc: Wallet seed or keypair generation
    crit: notable
    conf: 0.9
    any:
      - id: wallet-seed-generation-call
      - id: wallet-keypair-generation-call
      - id: wallet-seed-generator-function
