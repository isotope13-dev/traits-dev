# Wallet seed-generation primitives used by the weak-randomness objective.
# These atoms describe code structure and API use; the objective combines them
# so ordinary PRNG use outside key material remains a neutral observation.
defaults:
  platforms: [windows, linux, macos]
  for: [source, scripts, binaries]

traits:
  - id: wallet-seed-generation-call
    desc: Wallet seed or mnemonic generation call
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, c, cpp, rust]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(entropyToMnemonic|mnemonic_from_entropy|generateMnemonic)$'

  - id: wallet-keypair-generation-call
    desc: Wallet keypair generation call
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, c, cpp, rust]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(keypair|generateKeypair)$'

  - id: wallet-seed-generator-function
    desc: Wallet seed generator function
    crit: notable
    conf: 0.86
    for: [javascript, typescript, python, c, cpp, rust]
    if:
      type: symbol
      kind: function
      regex: '(?i)^(make|create|generate)[A-Za-z0-9_]*(wallet|seed)[A-Za-z0-9_]*$'

  - id: wallet-weak-prng-source-api
    desc: Non-cryptographic PRNG source API
    crit: notable
    conf: 0.88
    for: [javascript, typescript, python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)random\.(getrandbits|randbytes|bytes)$'

  - id: wallet-seedrandom-source-api
    desc: Seedrandom PRNG source API
    crit: notable
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)Math\.seedrandom$'

  - id: wallet-embedded-prng-source
    desc: Embedded software PRNG source API
    crit: notable
    conf: 0.88
    for: [c, cpp, rust, elf, macho, pe]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(rng_get|pyb_rng_yasmarang|rand::thread_rng)$'

  # These atoms retain an assignment shape so prose examples are less likely
  # to become seed-source findings.
  - id: seed-date-now-source
    desc: Seed state initialized from Date.now
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(seed|mnemonic|entropy)\w*\s*=\s*[^;\n]{0,50}\bDate\.now\b'

  - id: seed-time-call-source
    desc: Seed state initialized from time()
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(seed|mnemonic|entropy)\w*\s*=\s*[^;\n]{0,50}\btime\s*\('

  - id: seed-clock-token-source
    desc: Seed state initialized from a clock token
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(seed|mnemonic|entropy)\w*\s*=\s*[^;\n]{0,50}\bclock\b'

  - id: seed-state-assignment
    desc: Seed-related state assignment
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)\b(seed|mnemonic|entropy)\w*\s*='

  - id: wallet-key-state-assignment
    desc: Wallet key state assignment
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)\b(wallet|keypair|private[_ -]?key|secret[_ -]?key)\w*\s*='

  - id: wallet-seed-device-id-link
    desc: Seed assignment uses a device identifier
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(seed|mnemonic|entropy)\w*\s*=\s*[^;\n]{0,50}device[_-]u?id\b'

  - id: wallet-seed-hardware-id-link
    desc: Seed assignment uses a hardware identifier
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(seed|mnemonic|entropy)\w*\s*=\s*[^;\n]{0,50}hardware[_-]u?id\b'

  - id: wallet-seed-machine-id-link
    desc: Seed assignment uses a machine identifier
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(seed|mnemonic|entropy)\w*\s*=\s*[^;\n]{0,50}machine[_-]u?id\b'

  - id: wallet-prng-uid-assignment
    desc: PRNG state assigned from a device UID
    crit: suspicious
    conf: 0.95
    for: [c]
    if:
      type: tree-sitter
      kind: assignment
      regex: '(?i)\b(state|seed|pad)\w*\s*=\s*[^;\n]{0,80}(UID|UNIQUE_ID)'

  - id: wallet-prng-timer-assignment
    desc: PRNG state assigned from timer state
    crit: suspicious
    conf: 0.95
    for: [c]
    if:
      type: tree-sitter
      kind: assignment
      regex: '(?i)\b(state|seed|pad)\w*\s*=\s*[^;\n]{0,80}\b(SysTick|RTC)\b'

  - id: wallet-prng-clock-assignment
    desc: PRNG state assigned from a clock
    crit: suspicious
    conf: 0.95
    for: [c]
    if:
      type: tree-sitter
      kind: assignment
      regex: '(?i)\b(state|seed|pad)\w*\s*=\s*[^;\n]{0,80}\b(timer|clock)\b'

  - id: wallet-rng-disabled-compile-config
    desc: Hardware RNG disabled by compile flag
    crit: suspicious
    conf: 0.96
    for: [c, cpp, rust]
    if:
      type: text
      regex: '(?im)^\s*#\s*define\s+\w*(RNG|TRNG)\w*\s*(\(0\)|0)'

  - id: wallet-rng-fallback-branch
    desc: Software RNG fallback branch
    crit: suspicious
    conf: 0.94
    for: [c, cpp, rust]
    if:
      type: text
      regex: '(?is)#\s*if\s+\w*(RNG|TRNG)\w*.{0,40}\n.{0,280}?#\s*else\b'

  - id: wallet-rng-presence-guard
    desc: RNG feature presence-only compile guard
    crit: suspicious
    conf: 0.95
    for: [c, cpp, rust]
    if:
      type: text
      regex: '(?is)#\s*ifndef\s+\w*(RNG|TRNG)\w*.{0,80}#\s*error'

  - id: wallet-rng-reseed-call
    desc: PRNG reseed call
    crit: notable
    conf: 0.9
    for: [python, javascript, c, cpp, rust, go]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)reseed$'

  - id: wallet-rng-32bit-reseed-input
    desc: Reseed function accepts a 32-bit value
    crit: notable
    conf: 0.9
    for: [c]
    if:
      type: tree-sitter
      kind: function
      regex: '(?is)\b(uint32_t|uint32|u32)\b[^{}]{0,80}\b(reseed|seed)\s*\('

  - id: wallet-rng-32bit-unpack
    desc: 32-bit word unpack for reseeding
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)unpack$'
      arg:
        kind: string
        exact: I

composite_rules:
  - id: wallet-seed-clock-state-source
    desc: Seed state initialized from clock
    crit: suspicious
    conf: 0.92
    any:
      - id: wallet-seed-date-now-source
      - id: wallet-seed-time-call-source
      - id: wallet-seed-clock-token-source

  - id: wallet-seed-date-now-source
    desc: Wallet or key material seeded from Date.now
    crit: suspicious
    conf: 0.92
    all:
      - id: seed-date-now-source
      - id: wallet-key-material-generation
    near_lines: 2
    near_bytes: 240

  - id: wallet-seed-time-call-source
    desc: Wallet or key material seeded from time()
    crit: suspicious
    conf: 0.92
    all:
      - id: seed-time-call-source
      - id: wallet-key-material-generation
    near_lines: 2
    near_bytes: 240

  - id: wallet-seed-clock-token-source
    desc: Wallet or key material seeded from a clock token
    crit: suspicious
    conf: 0.92
    all:
      - id: seed-clock-token-source
      - id: wallet-key-material-generation
    near_lines: 2
    near_bytes: 240

  - id: wallet-seed-state-assignment
    desc: Seed or wallet state assignment
    crit: component
    conf: 0.86
    any:
      - id: seed-state-assignment
      - id: wallet-key-state-assignment

  - id: wallet-seed-device-state-source
    desc: Seed state uses device state
    crit: suspicious
    conf: 0.92
    any:
      - id: wallet-prng-uid-assignment
      - id: wallet-prng-timer-assignment
      - id: wallet-prng-clock-assignment
      - id: wallet-seed-device-id-link
      - id: wallet-seed-hardware-id-link
      - id: wallet-seed-machine-id-link

  - id: wallet-key-material-generation
    desc: Wallet seed or keypair generation
    crit: notable
    conf: 0.9
    any:
      - id: wallet-seed-generation-call
      - id: wallet-keypair-generation-call
      - id: wallet-seed-generator-function
