# Wallet seed-generation primitives used by the weak-randomness objective.
# These atoms describe code structure and API use; the objective combines them
# so ordinary PRNG use outside key material remains a neutral observation.
defaults:
  platforms: [windows, linux, macos]
  for: [source, scripts, binaries]

traits:
  - id: wallet-seed-generation-call
    desc: Wallet seed or mnemonic generation call
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, c, cpp, rust]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(entropyToMnemonic|mnemonic_from_entropy|generateMnemonic)$'

  # By the same reasoning as `seed` below, a bare `keypair` token carries no
  # wallet meaning: it is an ordinary identifier in any asymmetric-crypto code.
  # `generateKeyPair` is also a standard signing/encryption API, so it belongs
  # to the generic crypto provider traits, not the wallet objective. Keep this
  # atom to wallet-library spellings whose receiver or name identifies a
  # wallet operation.
  - id: wallet-keypair-generation-call
    desc: Wallet keypair generation call
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, c, cpp, rust]
    if:
      type: symbol
      kind: call
      regex: '(?i)^(Keypair\.generate|Wallet\.createRandom|createRandomWallet)$'

  # A bare `seed` token is ordinary programming English (database seeding,
  # seeded PRNGs, React's `createSeedData`), so the generator-name atoms
  # require an explicit wallet or mnemonic word rather than `seed` alone.
  - id: wallet-generator-function
    desc: Wallet generator function name
    crit: notable
    conf: 0.86
    for: [javascript, typescript, python, c, cpp, rust]
    if:
      type: symbol
      kind: function
      # The generated object must be the final noun. Names such as
      # createPaymentFromWalletClient consume a wallet and do not create one.
      regex: '(?i)^(make|create|generate)[A-Za-z0-9_]*wallets?$'

  - id: mnemonic-seed-generator-function
    desc: Mnemonic or seed-phrase generator function name
    crit: notable
    conf: 0.86
    for: [javascript, typescript, python, c, cpp, rust]
    if:
      type: symbol
      kind: function
      regex: '(?i)^(make|create|generate)[A-Za-z0-9_]*(mnemonic|seedphrase)s?$'

composite_rules:
  - id: wallet-key-material-generation
    desc: Wallet seed or keypair generation
    crit: notable
    conf: 0.9
    any:
      - id: wallet-seed-generation-call
      - id: wallet-keypair-generation-call
      - id: wallet-generator-function
      - id: mnemonic-seed-generator-function
