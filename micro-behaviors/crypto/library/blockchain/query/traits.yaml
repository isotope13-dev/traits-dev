# Ethereum RPC query transport variants used by recipient dead drops.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python]
  crit: notable
  conf: 0.9

traits:
  - id: ethereum-jsonrpc-batch-array
    desc: Array includes JSON-RPC 2.0 objects
    if:
      type: text
      regex: '(?s)\[\s*\{.{0,240}\bjsonrpc\b.{0,40}2\.0.{0,240}\},\s*\{'

  - id: blockscout-ethereum-api-endpoint
    desc: References a Blockscout Ethereum API endpoint
    if:
      type: string_literal
      regex: '(?i)(https?://)?(eth\.)?blockscout\.com/api\b'

  - id: ethereum-transaction-recipient-get
    desc: Reads recipient with transaction get
    crit: component
    if:
      type: text
      regex: '\b(transaction|tx)\.get\s*\(\s*["'']to["'']'

  - id: ethereum-transaction-recipient-destructure
    desc: Destructures transaction recipient
    crit: component
    if:
      type: text
      regex: '\{\s*to\s*(:\s*[A-Za-z_$][A-Za-z0-9_$]*\s*)?\}\s*=\s*(transaction|tx)\b'

composite_rules:
  - id: ethereum-jsonrpc-batch-request
    desc: Batches Ethereum JSON-RPC requests
    conf: 0.92
    near_lines: 12
    all:
      - id: ethereum-jsonrpc-batch-array
      - id: micro-behaviors/communications/ipc/rpc::jsonrpc-2-protocol-object
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-jsonrpc-method

  - id: ethereum-rpc-provider-list
    desc: Lists multiple Ethereum RPC providers
    conf: 0.92
    near_lines: 4
    all:
      - id: micro-behaviors/communications/ipc/rpc::rpc-endpoint-array
      - id: micro-behaviors/communications/ipc/rpc::multiple-rpc-provider-urls
    any:
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-jsonrpc-method
      - id: micro-behaviors/communications/http/url/rpc::ethereum-public-rpc-host

  - id: ethereum-transaction-recipient-reference
    desc: References an Ethereum transaction recipient
    crit: component
    conf: 0.92
    any:
      - id: micro-behaviors/crypto/library/blockchain/client::ethereum-transaction-recipient-field
      - id: ethereum-transaction-recipient-get
      - id: ethereum-transaction-recipient-destructure
