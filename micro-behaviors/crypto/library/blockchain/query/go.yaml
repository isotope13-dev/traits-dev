# Go Ethereum transaction-query result handling. These atoms remain neutral
# capabilities; blockchain dead-drop intent is inferred only when objectives
# combine them with a recipient-derived network sink.
defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.94

traits:
  - id: go-ethereum-recipient-hex-decode
    desc: Decodes Ethereum recipient hex in Go
    conf: 0.97
    if:
      type: text
      regex: '\bhex\.DecodeString\s*\(\s*strings\.TrimPrefix\s*\(\s*\w+\.To\s*,\s*"0x"'

  - id: go-ethereum-zero-value-test
    desc: Tests Ethereum zero-value transfer in Go
    if:
      type: text
      regex: '\b\w+\.Value\s*(==|!=)\s*"0x0+"'

  - id: go-ethereum-empty-input-test
    desc: Tests Ethereum empty-input transfer in Go
    if:
      type: text
      regex: '\b\w+\.Input\s*(==|!=)\s*"0x"'

composite_rules:
  - id: go-ethereum-recipient-ipv4-reconstruction
    desc: Go reconstructs IPv4 from Ethereum recipient bytes
    conf: 0.98
    all:
      - id: go-ethereum-recipient-hex-decode
      - id: micro-behaviors/communications/ip/parse::go-four-byte-prefix-to-ipv4
    near_bytes: 512
