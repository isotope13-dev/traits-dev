defaults:
  platforms: [windows, linux, macos]
  for: [binaries, scripts, html, chrome-manifest, crx, text, xpi]

traits:
  - id: wallet-brand-phantom
    desc: Phantom wallet brand reference
    crit: component
    if:
      type: text
      word: Phantom
      case_insensitive: true
  - id: wallet-brand-solflare
    desc: Solflare wallet brand reference
    crit: component
    if:
      type: text
      word: Solflare
      case_insensitive: true
