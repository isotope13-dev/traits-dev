# Neutral DeFi platform brand-name atoms. Intent (hijack, clipper, etc.)
# belongs in objectives composites that reference these.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source, javascript, typescript, markdown, text]
  crit: notable
  conf: 0.78

traits:
  - id: defi-platform-uniswap
    desc: Uniswap platform name reference
    if:
      type: text
      word: Uniswap
  - id: defi-platform-pancakeswap
    desc: PancakeSwap platform name reference
    if:
      type: text
      word: PancakeSwap
  - id: defi-platform-sushiswap
    desc: SushiSwap platform name reference
    if:
      type: text
      word: SushiSwap
  # `1inch` alone is a measurement, not a brand: UI and printer code carries
  # strings such as `%1inch(%2cm * %3cm)`. Require the exchange's own domain or
  # a named-product form.
  - id: defi-platform-oneinch
    desc: 1inch platform name reference
    if:
      type: text
      regex: '(?i)\b1inch[ .](io|dev|network|exchange)\b'
    unless:
      - id: metadata/package/testing/harness/runtime/

composite_rules:
  - id: defi-platform-name-cluster
    desc: Multiple DeFi platform name references
    crit: notable
    conf: 0.9
    needs: 2
    any:
      - id: defi-platform-uniswap
      - id: defi-platform-pancakeswap
      - id: defi-platform-sushiswap
      - id: defi-platform-oneinch
