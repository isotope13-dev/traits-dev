# Neutral mechanics used by Cosmos EVM clients and contracts.  The exact
# exploit inference belongs in objectives/impact/crypto-manipulation/transfer/.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.94

traits:
  - id: cosmos-vesting-account-creation-message
    desc: Creates Cosmos vesting account
    if:
      type: text
      regex: 'MsgCreate(Vesting|PermanentLocked|PeriodicVesting)Account\b'

  - id: evm-create-address-derivation
    desc: Derives deterministic EVM create address
    for: [javascript, typescript, go, python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(getCreateAddress|CreateAddress|getContractAddress)$'

  - id: cosmos-staking-precompile-address
    desc: References Cosmos staking precompile address
    if:
      type: text
      regex: '0x0{36}0800\b'

  - id: evm-contract-self-delegation-call
    desc: Delegates from current EVM contract
    if:
      type: text
      regex: '\.delegate\s*\(\s*address\s*\(\s*this\s*\)'

  - id: evm-native-value-call
    desc: Sends EVM native value by call
    if:
      type: text
      regex: '\.call\s*\{\s*value\s*:'

composite_rules:
  - id: cosmos-staking-precompile-delegation
    desc: Invokes Cosmos staking precompile delegation
    crit: notable
    conf: 0.98
    all:
      - id: cosmos-staking-precompile-address
      - id: evm-contract-self-delegation-call
    near_bytes: 4096
