defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.8

traits:
- id: web3-library-import
  desc: Imports the Web3 blockchain library
  if:
    type: import
    # External Web3 packages, not local modules such as src/utils/web3-utils.
    regex: '^(web3([/.-]|$)|@web3/)'

- id: ethers-library-reference
  desc: Ethers blockchain library reference
  if:
    type: string_literal
    regex: '(^|[/@._-])ethers([/._-]|$)'

- id: solana-library-reference
  desc: Solana blockchain library reference
  if:
    type: string_literal
    regex: '(^|[/@._-])solana([/._-]|$)'

# `SystemProgram.transfer` is the @solana/web3.js builder for a SOL transfer
# instruction — the ordinary way any wallet, dapp, or SDK moves lamports. On
# its own it says only "this code builds a SOL transfer", so it lives with the
# other neutral chain-transaction references; the drainer composites in
# objectives/credential-access/wallet/solana/ supply the stolen-key context.
- id: x402-wrap-fetch-with-privacy
  desc: x402 privacy fetch wrapper call
  if:
    type: symbol
    exact: wrapFetchWithPrivacy

- id: viem-wallet-client
  desc: Viem wallet client creation
  if:
    type: symbol
    exact: createWalletClient

- id: unlimited-approval-amount
  desc: Uses an unlimited token-approval amount
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\b(MaxUint256|MAX_UINT256|maxUint256)\b|0xf{64}\b'

- id: viem-native-amount-conversion
  desc: Viem converts a native currency amount
  crit: notable
  conf: 0.86
  if:
    type: symbol
    kind: call
    exact: parseEther

composite_rules:
- id: x402-fetch-payment-wrapper
  desc: x402 payment fetch wrapper
  crit: notable
  conf: 0.86
  any:
  - id: micro-behaviors/communications/http/services/payment::x402-wrap-fetch-with-payment
  - id: x402-wrap-fetch-with-privacy
  - id: micro-behaviors/communications/http/services/payment::x402-client-constructor
  - id: micro-behaviors/communications/http/services/payment::x402-payment-header
  - id: micro-behaviors/communications/http/services/payment::x402-payment-protocol-header
