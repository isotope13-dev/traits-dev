defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, go, c, cpp, rust, swift]
  crit: notable

traits:
  - id: transaction-output-destination-assignment
    desc: Assigns transaction output destination field
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(tx)?out(put)?\.(address|destination)\s*='

  - id: indexed-output-destination-assignment
    desc: Assigns indexed transaction output destination
    conf: 0.94
    if:
      type: text
      regex: '(?i)\boutputs\s*\[[^\]]{0,80}\]\.(address|destination|to)\s*='

  - id: transaction-total-symbol
    desc: Names total transaction output value
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(tx|transaction)\b[\s\S]{0,99}\btotal(Out|Sat|Output)\b'

  - id: transaction-output-amount-assignment
    desc: Assigns transaction output amount field
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(tx)?out(put)?\.(amount|value)\s*='
