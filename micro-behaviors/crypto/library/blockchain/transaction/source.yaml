defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, go, c, cpp, rust, swift]
  crit: notable

traits:
  # Same narrowing as transaction-output-amount-assignment below: a bare `out.`
  # receiver is any struct, so require a transaction-only spelling.
  - id: transaction-output-destination-assignment
    desc: Assigns transaction output destination field
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(txout|vout|output)\.(address|destination)\s*='

  - id: indexed-output-destination-assignment
    desc: Assigns indexed transaction output destination
    conf: 0.94
    if:
      type: text
      regex: '(?i)\boutputs\s*\[[^\]]{0,80}\]\.(address|destination|to)\s*='

  - id: transaction-total-symbol
    desc: Names total transaction output value
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(tx|transaction)\b[\s\S]{0,99}\btotal(Out|Sat|Output)\b'

  # `out` alone is any variable: `out.Value = args[2]` in a Go cache test
  # (creachadair/mds cache/internal/cachetest) is a struct field write, not a
  # transaction output. Require a spelling that only a transaction uses --
  # txout, vout, or the full word output.
  - id: transaction-output-amount-assignment
    desc: Assigns transaction output amount field
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(txout|vout|output)\.(amount|value)\s*='
