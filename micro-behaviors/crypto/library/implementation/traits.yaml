defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [binaries]

composite_rules:
  - id: multiple-crypto-primitive-markers
    desc: Multiple cryptographic primitive implementations
    conf: 0.8
    needs: 2
    any:
      - id: micro-behaviors/crypto/symmetric/aes/constant::aes-sbox-bytes
      - id: micro-behaviors/crypto/asymmetric/rsa::rsa-operations
      - id: micro-behaviors/crypto/asymmetric/rsa::ed25519-constant-bytes

  - id: crypto-library-context
    desc: Native cryptographic library context
    conf: 0.99
    any:
      - id: micro-behaviors/dylib/library/ssl::libcrypto-ref
      - id: well-known/lib/crypto/cryptography::cryptography-binding
