defaults:
  platforms: [windows]
  for: [binaries]
  crit: component
  conf: 0.9

traits:
  - id: bcrypt-dll-name
    crit: notable
    desc: Windows BCrypt DLL name
    if:
      type: text
      exact: bcrypt.dll

  - id: bcrypt-open-algorithm-provider
    crit: notable
    desc: Windows BCrypt algorithm provider API
    if:
      type: text
      exact: BCryptOpenAlgorithmProvider

  - id: bcrypt-generate-symmetric-key
    crit: notable
    desc: Windows BCrypt symmetric key API
    if:
      type: text
      exact: BCryptGenerateSymmetricKey

  - id: bcrypt-set-property
    crit: notable
    desc: Windows BCrypt property setter API
    if:
      type: text
      exact: BCryptSetProperty

  - id: bcrypt-decrypt-api
    crit: notable
    desc: Windows BCrypt decrypt API
    if:
      type: text
      exact: BCryptDecrypt

  - id: bcrypt-encrypt-api
    crit: notable
    desc: Windows BCrypt encrypt API
    if:
      type: text
      exact: BCryptEncrypt

  - id: bcrypt-authenticated-mode-info
    crit: notable
    desc: Windows BCrypt authenticated mode struct
    if:
      type: text
      exact: BCRYPT_AUTHENTICATED_CIPHER_MODE_INFO

composite_rules:
  - id: bcrypt-symmetric-crypto
    desc: BCrypt symmetric-key and cipher API references
    crit: notable
    conf: 0.94
    all:
      - id: bcrypt-open-algorithm-provider
      - id: bcrypt-generate-symmetric-key
    any:
      - id: bcrypt-encrypt-api
      - id: bcrypt-decrypt-api
      - id: bcrypt-set-property
      - id: bcrypt-authenticated-mode-info
    needs: 3

  - id: bcrypt-gcm-decrypt-api-set
    desc: GCM property and BCrypt decryption APIs
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/cipher::bcrypt-chaining-mode-gcm
      - id: bcrypt-open-algorithm-provider
      - id: bcrypt-generate-symmetric-key
      - id: bcrypt-decrypt-api
    any:
      - id: bcrypt-dll-name
      - id: micro-behaviors/crypto/cipher::bcrypt-chaining-mode-prop
