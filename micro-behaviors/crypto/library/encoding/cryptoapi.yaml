# CryptoAPI Base64/Hex Encoding - Windows
# CryptStringToBinary / CryptBinaryToString for encoding conversion
defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, c, cpp]
  conf: 0.9
traits:
  - id: crypt-import-public-key-info-string
    desc: CryptImportPublicKeyInfo API reference
    conf: 0.9
    if:
      type: text
      exact: CryptImportPublicKeyInfo
    unless:
      - type: symbol
        exact: CryptImportPublicKeyInfo
      - id: metadata/signed/platform/

  - id: crypt-decode-object-ex-string
    desc: CryptDecodeObjectEx API reference
    conf: 0.85
    if:
      type: text
      exact: CryptDecodeObjectEx
    unless:
      - type: symbol
        exact: CryptDecodeObjectEx
