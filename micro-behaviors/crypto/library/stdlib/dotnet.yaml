# .NET standard-library (System.Security.Cryptography) pipeline types.
#
# `ICryptoTransform` and `CryptoStream` are the algorithm-agnostic plumbing every
# managed symmetric cipher is driven through — AES, DES, TripleDES, RC2 and any
# custom SymmetricAlgorithm subclass alike, in both directions. They therefore
# describe "this assembly runs data through the .NET symmetric crypto pipeline",
# not any particular cipher, and live here rather than under a single algorithm's
# directory (per the taxonomy's "Matcher Defines Identity" rule). Algorithm-
# specific composites — e.g. the TripleDES chain in
# micro-behaviors/crypto/symmetric/3des — reference them cross-directory and
# supply the cipher identity themselves.
defaults:
  for: [pe, dll, csharp, powershell]
  platforms: [windows]

traits:
  - id: dotnet-icryptotransform
    desc: .NET ICryptoTransform cipher interface
    crit: notable
    conf: 0.8
    if:
      type: text
      word: ICryptoTransform

  - id: dotnet-cryptostream
    desc: .NET CryptoStream symmetric pipeline class
    crit: notable
    conf: 0.8
    if:
      type: text
      word: CryptoStream
