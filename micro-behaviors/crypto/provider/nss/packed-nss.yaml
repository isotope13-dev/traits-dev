defaults:
  for: [pe]
  platforms: [windows]
traits:
  # Snappy literals retain both API-name fragments while backreferences
  # replace repeated substrings. This observes the names, not a decrypt call.
  - id: packed-nss-secret-decrypt-name-fragments
    desc: Packed NSS secret-decryption name fragments
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: 'NSS_Ini[\x00-\x1f][\s\S]{0,128}SDR_Decrypt'
