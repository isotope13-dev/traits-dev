defaults:
  crit: notable
  platforms: [windows]
  for: [c, cpp, csharp, go, rust]

traits:
  - id: bcrypt-encrypt-source
    desc: Source encrypts with BCrypt
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: BCryptEncrypt

composite_rules:
  - id: bcrypt-symmetric-encryption-source
    desc: Source encrypts with Windows BCrypt
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/provider/cryptoapi::bcrypt-open-provider-source
      - id: micro-behaviors/crypto/key/import::bcrypt-symmetric-key-import-source
      - id: bcrypt-encrypt-source
    near_lines: 40
