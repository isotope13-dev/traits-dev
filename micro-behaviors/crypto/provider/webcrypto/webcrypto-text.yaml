defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
traits:
- id: webcrypto-decrypt-call-text
  desc: Calls Web Crypto decryption in source
  conf: 0.96
  if:
    type: text
    regex: '\bcrypto\s*\.\s*subtle\s*\.\s*decrypt\s*\('
    exclude_html_comments: true
