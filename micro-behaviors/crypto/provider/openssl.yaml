# Provider references describe cryptography, not dynamic loading. Preserve
# their matchers and effective scope when moving them from legacy homes.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable

traits:
  - id: libcrypto-ref
    desc: libcrypto library reference
    crit: notable
    conf: 0.3
    if:
      type: text
      substr: libcrypto

  - id: openssl-evp-pkey-api-reference
    desc: OpenSSL EVP_PKEY key-management API reference
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: EVP_PKEY

  - id: openssl-init-crypto-import
    desc: Imports OpenSSL crypto initialization
    conf: 0.99
    platforms: [windows]
    for: [pe, dll]
    if:
      type: import
      exact: OPENSSL_init_crypto

composite_rules:
  - id: signed-crypto-import-host
    desc: Signed host imports OpenSSL crypto ABI
    crit: notable
    conf: 0.98
    platforms: [windows]
    for: [pe, dll]
    all:
      - id: metadata/signed/certificate/chain::ca-issued-intact-signature
      - id: micro-behaviors/crypto/provider::openssl-init-crypto-import
