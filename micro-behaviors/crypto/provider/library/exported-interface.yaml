# Requires a Node crypto API operation/reference as well as import and export
# clues. This supports crypto capability, without proving an export-to-call flow.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: component
composite_rules:
- id: node-crypto-export-import-operation
  desc: Crypto API use with a declared export interface
  crit: notable
  conf: 0.86
  all:
  - id: metadata/lang/source/interface/crypto::exports-crypto-interface
  - id: metadata/import/builtin::require-crypto
  - id: micro-behaviors/crypto/provider/library::node-crypto-operation
