defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.6
traits:
- id: node-createpublickey-aliased-import
  desc: Imports aliased Node createPublicKey API
  conf: 0.94
  if:
    type: text
    regex: createPublicKey\s+as\s+\w+[\s\S]{0,80}from["'](node:)?crypto["']
- id: node-verify-aliased-import
  desc: Imports aliased Node signature verify API
  conf: 0.94
  if:
    type: text
    regex: \bverify\s+as\s+\w+[\s\S]{0,80}from["'](node:)?crypto["']
- id: create-sign
  desc: Node crypto signing
  conf: 0.75
  if:
    type: symbol
    regex: (^|\.)createSign$
  unless:
  - id: metadata/package/testing/harness/runtime/
- id: create-verify
  desc: Node crypto signature verification
  conf: 0.7
  if:
    type: symbol
    regex: (^|\.)createVerify$
  unless:
  - id: metadata/package/testing/harness/runtime/
- id: asymmetric-public-encrypt
  desc: Node public key encryption
  conf: 0.75
  if:
    type: symbol
    kind: call
    regex: (^|\.)publicEncrypt$
  unless:
  - id: metadata/package/testing/harness/runtime/
- id: asymmetric-private-decrypt
  desc: Node private key decryption
  conf: 0.75
  if:
    type: symbol
    kind: call
    regex: (^|\.)privateDecrypt$
  unless:
  - id: metadata/package/testing/harness/runtime/
- id: asymmetric-legacy-pair
  desc: Node legacy asymmetric pair
  conf: 0.7
  if:
    type: symbol
    regex: (^|\.)(privateEncrypt|publicDecrypt)$
  unless:
  - id: metadata/package/testing/harness/runtime/
- id: ecdh-create
  desc: Node ECDH key exchange
  conf: 0.72
  if:
    type: symbol
    regex: (^|\.)createECDH$
  unless:
  - id: metadata/package/testing/harness/runtime/
- id: diffie-hellman-call
  desc: Node Diffie-Hellman shared-secret derivation
  conf: 0.92
  if:
    type: symbol
    kind: call
    regex: (^|\.)diffieHellman$
- id: pbkdf2-call
  desc: JavaScript PBKDF2 API call
  conf: 0.72
  if:
    type: symbol
    regex: (^|\.)(pbkdf2|pbkdf2Sync)$
  unless:
  - id: metadata/package/testing/harness/runtime/
- id: node-hkdf
  desc: Node HKDF operation
  conf: 0.72
  if:
    type: symbol
    regex: (^|\.)(hkdf|hkdfSync)$
  unless:
  - id: metadata/package/testing/harness/runtime/
- id: webcrypto-subtle
  desc: WebCrypto subtle crypto use
  conf: 0.7
  if:
    type: symbol
    regex: (^|\.)(webcrypto\.subtle|crypto\.subtle)$
  unless:
  - id: metadata/package/testing/harness/runtime/
- id: subtle-sign-verify
  desc: WebCrypto subtle sign/verify
  conf: 0.7
  if:
    type: symbol
    regex: (^|\.)subtle\.(sign|verify)$
  unless:
  - id: metadata/package/testing/harness/runtime/
- id: subtle-key-ops
  desc: WebCrypto subtle key operations
  conf: 0.7
  if:
    type: symbol
    regex: (^|\.)subtle\.(importKey|deriveKey|deriveBits)$
  unless:
  - id: metadata/package/testing/harness/runtime/
composite_rules:
- id: node-crypto-operation
  desc: Node.js crypto operation
  conf: 0.72
  any:
  - id: micro-behaviors/crypto/hash/digest/unnamed-algorithm::node-createhash-call
  - id: micro-behaviors/crypto/hash/hmac::node-createhmac-api-reference
  - id: create-sign
  - id: create-verify
  - id: asymmetric-public-encrypt
  - id: asymmetric-private-decrypt
  - id: asymmetric-legacy-pair
  - id: micro-behaviors/crypto/key/representation::node-key-object-api-reference
  - id: micro-behaviors/crypto/asymmetric/key::key-pair-generation-call
  - id: ecdh-create
  - id: micro-behaviors/os/random/crypto::node-random-generation
  - id: pbkdf2-call
  - id: micro-behaviors/crypto/kdf/algorithm::node-memory-hard-kdf
  - id: node-hkdf
  - id: webcrypto-subtle
  - id: micro-behaviors/crypto/cipher::webcrypto-encrypt-decrypt-reference
  - id: subtle-sign-verify
  - id: subtle-key-ops
  - id: micro-behaviors/crypto/hash/digest/unnamed-algorithm::subtle-digest
