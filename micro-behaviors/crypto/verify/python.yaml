defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-rsa-pss-verify-call
    desc: Verifies a signature with RSA-PSS padding
    if:
      type: symbol
      kind: call
      regex: '(^|\.)verify$'
      arg:
        index: 2
        from:
          call: '(^|\.)PSS$'

  - id: python-pkcs1v15-or-ecdsa-verify
    desc: Verifies signature with Python PKCS1v15 or ECDSA
    if:
      type: text
      exclude_comments: true
      regex: '\.verify\s*\([^\n]{1,100}\b(PKCS1v15|ECDSA|PSS)\s*\('

  - id: python-pycryptodome-sig-verify
    desc: Verifies signature with PyCryptodome verifier
    if:
      type: text
      exclude_comments: true
      regex: '\b(pkcs1_15|PSS|DSS)\.new\s*\([^\n]{1,60}\)\.verify\s*\('


composite_rules:
  - id: python-rsa-signature-verification
    desc: Python verifies an RSA signature
    any:
      - id: python-rsa-pss-verify-call
      - id: micro-behaviors/crypto/asymmetric/rsa::rsa-sha256-public-verify
