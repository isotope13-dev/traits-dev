defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable

traits:
  - id: rust-asymmetric-verify-method
    desc: Calls Rust .verify or .verify_strict method
    crit: component
    conf: 0.85
    if:
      type: text
      exclude_comments: true
      regex: '\.(verify|verify_strict)\s*\('

  - id: rust-asymmetric-verifier-type
    desc: Rust asymmetric verifier type token
    crit: component
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      regex: '\b(ed25519_dalek|Pkcs1v15Sign|UnparsedPublicKey|VerifyingKey)\b'

composite_rules:
  - id: rust-signature-verification
    desc: Rust code verifies an asymmetric signature
    conf: 0.93
    near_lines: 60
    all:
      - id: rust-asymmetric-verify-method
      - id: rust-asymmetric-verifier-type
