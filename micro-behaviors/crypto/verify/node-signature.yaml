defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.82
traits:
- id: node-crypto-verify
  desc: Verifies a signature with Node crypto
  if:
    type: symbol
    kind: call
    exact: crypto.verify

- id: node-create-verify-call
  desc: Creates a Node signature verifier stream
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: '(^|\.)createVerify$'

