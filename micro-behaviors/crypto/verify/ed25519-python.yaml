defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.98
traits:
- id: python-ed25519-key-verify
  desc: Verifies with a constructed Ed25519 public key
  if:
    type: symbol
    kind: call
    regex: \.verify$
    receiver:
      from:
        call: ^Ed25519PublicKey\.from_public_bytes$
