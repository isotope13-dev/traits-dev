# These are names in text. `Verifier.new` is not necessarily Rails, and none
# of the alternatives establishes a signing or verification operation.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
  conf: 0.96

traits:
  - id: secret-key-base-or-verifier-text
    desc: Secret-key-base or verifier name text
    if:
      type: text
      regex: '(?i)\bsecret[_ -]?key[_ -]?base\b|MessageVerifier|Verifier\.new\s*\('
    unless:
      - id: well-known/app/ai/tool-server/rails-ai-context/
