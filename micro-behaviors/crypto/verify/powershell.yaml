defaults:
  for: [powershell, pe, dll]
  platforms: [windows]
traits:
  - id: powershell-authenticode-command-reference
    desc: PowerShell Authenticode verification reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bGet-AuthenticodeSignature\b'
  - id: powershell-sha256-mismatch-aborts
    desc: Aborts after SHA-256 mismatch
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Get-FileHash.{0,100}SHA256.{0,100}Hash\s*-ne.{0,100}throw'
