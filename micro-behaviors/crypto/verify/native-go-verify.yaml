defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.92

traits:
  - id: openssl-rsa-ecdsa-verify-import
    desc: Imports OpenSSL asymmetric signature verify API
    for: [elf, macho, pe, dll, so, dylib]
    if:
      type: import
      regex: '^_?(RSA|DSA|ECDSA)_verify$'

  - id: openssl-evp-verify-import
    desc: Imports OpenSSL EVP signature verification
    for: [elf, macho, pe, dll, so, dylib]
    if:
      type: import
      regex: '^_?EVP_(VerifyFinal|DigestVerify(Init|Final)?)$'

  - id: openssl-rsa-ecdsa-verify-call
    desc: Calls OpenSSL asymmetric signature verify API
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      regex: '^(RSA|DSA|ECDSA)_verify$'

  - id: openssl-evp-verify-call
    desc: Calls OpenSSL EVP signature verification
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      regex: '^EVP_(VerifyFinal|DigestVerify(Init|Final)?)$'

  - id: go-rsa-signature-verify
    desc: Calls Go crypto/rsa signature verification
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '(^|[./])rsa\.Verify(PKCS1v15|PSS)$'

  - id: go-ecc-signature-verify
    desc: Calls Go Ed25519 or ECDSA signature verify
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '(^|[./])(ed25519\.Verify|ecdsa\.Verify(ASN1)?)$'

  - id: go-hmac-equal-call
    desc: Compares MAC digests with Go hmac.Equal
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '(^|[./])hmac\.Equal$'

  - id: windows-cng-verify-import
    desc: Imports Windows signature verify API
    platforms: [windows]
    for: [pe, dll]
    if:
      type: import
      regex: '^(BCrypt|NCrypt|Crypt)VerifySignature[AW]?$'

  - id: windows-cng-verify-call
    desc: Calls Windows signature verify API
    platforms: [windows]
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      regex: '^(BCrypt|NCrypt|Crypt)VerifySignature[AW]?$'

  - id: macos-seckey-verify-import
    desc: Imports SecKeyVerifySignature API
    platforms: [macos, ios]
    for: [macho, dylib]
    if:
      type: import
      regex: '^_?SecKeyVerifySignature$'

  - id: macos-seckey-verify-call
    desc: Calls SecKeyVerifySignature API
    platforms: [macos, ios]
    for: [c, cpp, objc, swift]
    if:
      type: symbol
      kind: call
      regex: '^_?SecKeyVerifySignature$'
