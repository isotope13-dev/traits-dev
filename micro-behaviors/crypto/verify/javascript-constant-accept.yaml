# Cryptographic functions can be stubs for tests or proof assembly; these
# indicators show source text, not malicious intent or a demonstrated exploit.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: js-signature-algorithm-constant-true
    desc: Named signature algorithm callback returns true
    crit: component
    if:
      type: text
      regex: '(?i)name:\s*["''](rsa|p256|ecdsa|ed25519)[a-z0-9_-]*["''],?\s*f:\s*\(\s*\)\s*=>\s*true\b'
  - id: js-signature-algorithm-dispatch
    desc: Signature supplied to algorithm callback
    crit: component
    if:
      type: text
      regex: '\b\w+[.]f\([^;\n]{0,120}\bsignature\b'
  - id: js-sha1-digest-constant-true
    desc: Named SHA-1 digest callback returns true
    crit: component
    if:
      type: text
      regex: '(?i)name:\s*["'']sha-?1["''],?\s*f:\s*\(\s*\)\s*=>\s*true\b'
  - id: js-digest-callback-dispatch
    desc: Digest supplied to callback
    crit: component
    if:
      type: text
      regex: '\b\w+[.]f\([^;\n]{0,100}\bdigest\b'
composite_rules:
  - id: js-constant-true-signature-callback-indicators
    desc: Constant-true signature algorithm and signature dispatch co-occur
    crit: suspicious
    conf: 0.92
    unless:
      - id: metadata/path::test-directory-component
      - id: metadata/file/profile/test-indications/
    all:
      - id: js-signature-algorithm-constant-true
      - id: js-signature-algorithm-dispatch
  - id: js-constant-true-digest-callback-indicators
    desc: Constant-true SHA-1 digest and digest dispatch co-occur
    crit: suspicious
    conf: 0.92
    unless:
      - id: metadata/path::test-directory-component
      - id: metadata/file/profile/test-indications/
    all:
      - id: js-sha1-digest-constant-true
      - id: js-digest-callback-dispatch
