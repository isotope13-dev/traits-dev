defaults:
  platforms: [windows, unix]
  for: [class]
  crit: notable

traits:
  - id: java-signature-initverify
    for: [class, java_class]
    desc: JVM initVerify method-name reference
    conf: 0.94
    if:
      type: value
      path: class.strings[*]
      exact: initVerify

composite_rules:
  - id: jvm-x509-signature-verification-references
    desc: JVM signature verification and X509 key references
    conf: 0.95
    for: [class, java_class]
    all:
      - id: micro-behaviors/crypto/asymmetric/signature::java-signature-class-ref
      - id: micro-behaviors/crypto/verify::java-signature-initverify
      - id: micro-behaviors/crypto/key/representation::java-x509-encoded-keyspec-ref
      - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
