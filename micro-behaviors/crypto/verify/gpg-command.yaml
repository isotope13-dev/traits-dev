defaults:
  platforms: [windows, linux, macos]
  for: [shell, scripts, source, github-actions, python, javascript, typescript, ruby, go, rust]
  crit: notable
  conf: 0.95

traits:
  - id: gpg-verification-command
    desc: GPG detached-signature verification command
    if:
      type: text
      regex: '(?im)^\s*gpg2?\b[^\n]{0,180}\s--verify\b'
