# The hashed input can be an in-memory buffer; no file read is required.
# The bounded matcher does not bind the comparison variable to ComputeHash.
defaults:
  platforms: [windows, unix]
  for: [powershell]
  crit: notable

traits:
  - id: powershell-computehash-digest-comparison
    desc: ComputeHash near an embedded digest comparison
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.ComputeHash\(.{0,40}\)[\s\S]{0,300}\bif\b[\s\S]{0,200}-c?i?eq\s*[''"][0-9a-f]{64}[''"]'

