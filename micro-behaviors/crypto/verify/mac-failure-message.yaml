# Diagnostic text emitted when a message authentication code does not verify.
# In native malware it marks an integrity gate: an authenticated C2 handshake
# or a loader that refuses a modified payload.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, dll]
traits:
  - id: hmac-verification-failure-message
    desc: Logs an HMAC verification failure
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bHMAC (mismatch|check failed|verification failed|invalid)\b'
