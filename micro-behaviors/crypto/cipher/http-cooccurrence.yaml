composite_rules:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  id: aes-with-http-client
  desc: Cipher initialization co-occurs near HTTP client code
  crit: notable
  conf: 0.9
  near_lines: 160
  all:
  - id: micro-behaviors/crypto/symmetric/aes/runtime-library::aes-algorithm
  - id: micro-behaviors/communications/http/request/client::http-client
  any:
  - id: micro-behaviors/crypto/symmetric/aes/runtime-library::createCipheriv
  - id: micro-behaviors/crypto/decrypt::createDecipheriv
  - id: micro-behaviors/crypto/decrypt::create-decipher-call
  unless:
  - id: well-known/lib/crypto/crypto-browserify::polyfill-bundle
  - id: well-known/lib/network/node-edge/
