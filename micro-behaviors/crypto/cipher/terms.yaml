traits:
- id: cipher-keyword
  desc: Generic cipher term
  conf: 0.4
  if:
    type: text
    word: cipher
    case_insensitive: true
composite_rules:
- id: cipher-algorithm-reference
  desc: Cipher or encryption algorithm reference
  conf: 0.5
  any:
  - id: micro-behaviors/crypto/cipher::cipher-keyword
  - id: micro-behaviors/crypto/library/keyword::aes-keyword
  - id: micro-behaviors/crypto/library/keyword::blowfish-keyword
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: notable
