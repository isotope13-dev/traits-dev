traits:
- id: cipher-api-symbol
  desc: Cipher API symbol reference
  for: [python, pyc, java, class]
  conf: 0.8
  if:
    type: symbol
    regex: '(^|\.)Cipher$'
composite_rules:
- id: cipher-algorithm-reference
  desc: Cipher or encryption algorithm reference
  conf: 0.5
  any:
  - id: micro-behaviors/crypto/cipher::cipher-api-symbol
  - id: micro-behaviors/crypto/library/keyword::aes-keyword
  - id: micro-behaviors/crypto/library/keyword::blowfish-keyword
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: notable
