defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  mbc: C0027
traits:
- id: createCipheriv
  desc: Creates cipher with initialization vector
  crit: notable
  conf: 0.85
  if:
    type: symbol
    kind: call
    regex: (^|\.)createCipheriv$
- id: createDecipheriv
  desc: Creates decipher with initialization vector
  crit: notable
  conf: 0.85
  if:
    type: symbol
    regex: (^|\.)createDecipheriv$
    kind: call
- id: create-decipher-call
  desc: JavaScript createDecipher API call
  crit: notable
  conf: 0.7
  if:
    type: symbol
    regex: (^|\.)createDecipher$
    kind: call
