# Class-local API co-occurrence; no browser target, SQLite engine, data flow,
# execution ordering or theft is established by these references.
defaults:
  platforms: [windows]
  for: [class]
  crit: notable
composite_rules:
  - id: jvm-dpapi-jdbc-cipher-references
    desc: JVM DPAPI and JDBC crypto references
    conf: 0.93
    all:
      - id: micro-behaviors/os/security/dpapi::jna-crypt32util-class
      - id: micro-behaviors/data/db/sql::jvm-jdbc-driver-manager
    any:
      - id: micro-behaviors/crypto/symmetric/aes/gcm::jvm-gcm-parameter-spec
      - id: micro-behaviors/os/security/dpapi::jvm-crypt-unprotect-data-name
