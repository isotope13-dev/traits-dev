traits:
- platforms:
  - windows
  - unix
  for:
  - binaries
  crit: notable
  size_max: 52428800
  id: go-tls-cipher-internals
  desc: Go TLS cipher-suite API name references
  conf: 0.8
  if:
    type: text
    regex: crypto/tls[./][^\x00\s]{0,24}(cipherSuite(TLS13)?|SignatureScheme)
  unless:
  - id: micro-behaviors/crypto/provider/library::rustls-crate-path
  - id: metadata/binary/framework::dotnet-assembly
