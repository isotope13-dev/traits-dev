# Co-occurring source evidence; these rules do not establish a payload chain.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: js-bracket-zero-buffer-crypto
  desc: Zero-filled buffer near computed crypto access
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: Buffer\[['"]alloc['"]\]\(0x10,0x0\)[\s\S]{0,160}crypto\[
composite_rules:
- id: aes-cbc-zero-buffer-write-detached
  desc: AES-CBC, zero buffer, file write and detached option
  conf: 0.97
  all:
  - id: micro-behaviors/crypto/decrypt/initialize::js-zero-buffer-aes256-cbc
  - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync
  - id: micro-behaviors/process/daemonize/detach::detached-true
  crit: notable
- id: zero-buffer-crypto-unref
  desc: Zero buffer and computed crypto with unref call
  conf: 0.96
  all:
  - id: js-bracket-zero-buffer-crypto
  - id: micro-behaviors/process/daemonize/detach::js-bracket-unref-call
  crit: notable
- id: dotnet-crypto-eval-or-wsh-reference
  desc: .NET crypto with eval or WSH property reference
  crit: notable
  conf: 0.98
  for:
  - javascript
  all:
  - id: micro-behaviors/crypto/symmetric/aes/reference::rijndael-managed
  - id: micro-behaviors/crypto/cipher/unspecified::dotnet-transform-final-block
  any:
  - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
  - id: micro-behaviors/data/property/access::wscript-bracket-member-access
  - id: micro-behaviors/data/property/access::msxml-node-typed-value
