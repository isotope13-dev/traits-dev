defaults:
  platforms:
  - windows
  - unix
  for:
  - python
composite_rules:
- id: python-aes-import-encoding-profile
  desc: Python AES with import and encoding clues
  crit: notable
  conf: 0.95
  near_lines: 80
  all:
  - id: micro-behaviors/crypto/symmetric/aes/
  any:
  - id: micro-behaviors/process/interpreter/python::zipimporter-module-load
  - id: metadata/lang/source/naming/resource::b64decode-string
  - id: micro-behaviors/fs/temp/pyinstaller::pyinstaller-meipass
  - id: metadata/lang/encoding/base64::base64decode-32-byte-literal-pattern
  - id: micro-behaviors/fs/path/data-file::aes-suffix-text
  needs: 2
  unless:
  - id: metadata/path/directory::test-directory-component
