# Key/encoded-data declarations are neutral crypto configuration evidence.
# They do not identify executable content or establish concealment intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
composite_rules:
  - id: large-encoded-ciphertext-name-context
    desc: Large encoded literal near ciphertext name
    crit: component
    near_lines: 6
    all:
      - id: metadata/file/encoding/shape::large-base64-like-literal
    any:
      - id: metadata/lang/source/naming/assignment::js-ciphertext-const
      - id: metadata/lang/source/naming/assignment::js-encrypted-text-const
      - id: metadata/lang/source/naming/assignment::py-ciphertext-const
      - id: metadata/lang/source/naming/assignment::py-encrypted-text-const
  - id: ciphertext-blob-context
    desc: Named or structured ciphertext-blob context
    crit: component
    any:
      - id: metadata/file/encoding/shape::aes-gcm-triplet-blob
      - id: micro-behaviors/crypto/cipher/unspecified::large-encoded-ciphertext-name-context
