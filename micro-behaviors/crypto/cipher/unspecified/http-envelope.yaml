# Only envelope construction qualifies. A local AES-GCM decryptor can coexist
# with plaintext HTTP uploads; slicing a tag says nothing about the wire body.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: aes-gcm-http-envelope-references
    desc: HTTP body APIs with AES-GCM envelope construction
    crit: notable
    conf: 0.92
    all:
      - id: metadata/lang/source/literal/string/cryptography::aes-256-gcm-dash
      - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
      - id: micro-behaviors/crypto/encrypt/transform::iv-auth-tag-concat

