defaults:
  platforms: [windows, unix]
  for: [python]
composite_rules:
  - id: python-encrypt-decrypt-names
    desc: Python encrypt and decrypt function names
    all:
      - id: micro-behaviors/crypto/encrypt/reference::pycrypto-encrypt-func-name
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::pycrypto-decrypt-func-name
