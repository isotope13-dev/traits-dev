defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-securestring-conversion
    desc: PowerShell converts SecureString representations
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^Convert(From|To)-SecureString$'

  - id: ruby-plaintext-securestring-command
    desc: Ruby string embeds plaintext SecureString cmdlet
    crit: notable
    conf: 0.97
    for: [ruby]
    if:
      # Ruby's parsed literals include interpolated %Q strings. Comments do
      # not supply this evidence; this describes generated code, not a Ruby
      # invocation of the Windows cmdlet.
      type: literal
      regex: '(?i)\bConvertTo-SecureString\b[^\r\n;]{0,180}\s-AsPlainText\b'
