defaults:
  platforms: [unix, windows]
traits:
  - id: java-cipher-getinstance-source
    desc: JVM Cipher.getInstance API reference
    crit: notable
    conf: 0.9
    for: [jsp, java, kotlin, groovy, scala, clojure, class]
    if:
      type: text
      # No trailing `(`: Clojure writes the paren first, `(Cipher/getInstance
      # "AES/CBC/PKCS5Padding")`. This records the API reference, not a
      # completed encryption or decryption operation.
      regex: '\bCipher[./]getInstance\b'

composite_rules:
  - id: jvm-source-secretkey-cipher-construction
    desc: JVM cipher construction with a raw key specification
    crit: notable
    conf: 0.9
    for: [jsp, java, kotlin, groovy, scala, class]
    all:
      - id: java-cipher-getinstance-source
    any:
      - id: micro-behaviors/crypto/key/representation/material::java-secretkeyspec-source
      - id: micro-behaviors/crypto/key/representation/material::secretkeyspec
