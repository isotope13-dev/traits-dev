defaults:
  platforms: [unix, windows]
traits:
  - id: java-cipher-getinstance-source
    desc: JVM Cipher.getInstance API reference
    crit: notable
    conf: 0.9
    for: [jsp, java, kotlin, groovy, scala, clojure]
    if:
      type: text
      # No trailing `(`: Clojure writes the paren first, `(Cipher/getInstance
      # "AES/CBC/PKCS5Padding")`. This records the API reference, not a
      # completed encryption or decryption operation.
      regex: '\bCipher[./]getInstance\b'
