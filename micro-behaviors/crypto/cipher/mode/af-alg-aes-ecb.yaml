defaults:
  platforms: [linux]
  for: [c, cpp, rust, go, python, elf]
  crit: notable

traits:
  - id: aes-ecb-cipher-name
    desc: References Linux ecb(aes) cipher name
    conf: 0.95
    if:
      type: text
      substr: 'ecb(aes)'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
