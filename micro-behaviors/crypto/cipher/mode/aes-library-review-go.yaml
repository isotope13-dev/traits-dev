defaults:
  platforms: [windows, linux, macos]
traits:
- id: go-ctr-stream
  desc: Go cipher.NewCTR symbol reference
  crit: notable
  conf: 0.9
  for:
  - go
  if:
    type: symbol
    exact: cipher.NewCTR
- id: go-cfb-constructor-text
  desc: Go CFB constructor name reference
  crit: notable
  conf: 0.7
  for: [scripts, binaries]
  if:
    type: text
    regex: (crypto/)?cipher\.(NewCFBDecrypter|newCFB)
- id: go-cfb-stream-itab
  desc: Go CFB stream interface reference
  crit: notable
  conf: 0.78
  for: [scripts, binaries]
  if:
    type: text
    substr: crypto/cipher.cfb,crypto/cipher.Stream
