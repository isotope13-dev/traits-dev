defaults:
  platforms: [windows, linux, macos]
  for: [go]
  crit: notable

traits:
  # Stream XOR does not identify AES; RC4 and other streams share this API.
  - id: go-ofb-stream
    desc: Constructs a Go OFB cipher stream
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: cipher.NewOFB

