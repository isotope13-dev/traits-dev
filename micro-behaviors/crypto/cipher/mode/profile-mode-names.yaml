defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
- id: aead-mode-keyword--mode-gcm
  desc: AEAD cipher-mode keyword (MODE_GCM)
  crit: notable
  conf: 0.4
  if:
    type: text
    word: MODE_GCM
- id: cipher-mode-keyword--mode-ctr
  desc: Counter cipher-mode keyword (MODE_CTR)
  crit: notable
  conf: 0.4
  if:
    type: text
    word: MODE_CTR
composite_rules:
- id: gcm-or-ctr-mode-name
  desc: GCM or CTR cipher-mode name
  crit: notable
  conf: 0.4
  any:
  - id: aead-mode-keyword--mode-gcm
  - id: cipher-mode-keyword--mode-ctr
