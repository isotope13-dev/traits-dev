defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-openssl-cipher-mode-selection
    desc: OpenSSL cipher selects encryption or decryption
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (_
          (assignment left: (identifier) @cipher
            right: (call receiver: (scope_resolution) @type
              method: (identifier) @constructor))
          . (call receiver: (identifier) @receiver method: (identifier) @mode)
          (#eq? @type "OpenSSL::Cipher")
          (#eq? @constructor "new")
          (#eq? @cipher @receiver)
          (#match? @mode "^(encrypt|decrypt)$")) @selection
