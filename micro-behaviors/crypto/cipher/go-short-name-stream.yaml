defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
composite_rules:
  - id: go-short-name-stream-crypto-profile
    desc: Go stream crypto routines with short package and receiver names
    crit: notable
    conf: 0.92
    all:
      - id: metadata/binary/symbols/name/function::go-short-package-and-receiver-methods
      - id: metadata/binary/symbols/name/qualified/security::go-crypt-routine-name
      - id: micro-behaviors/crypto/key/generate::go-pointer-keygen-method
    any:
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha-salsa-constant
      - id: micro-behaviors/crypto/symmetric/stream/chacha::go-obfuscated-xor-stream
      - id: micro-behaviors/data/bitwise/xor/state::arm-xorshift64-byte-stream
