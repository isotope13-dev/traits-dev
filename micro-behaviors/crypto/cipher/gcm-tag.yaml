defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
traits:
  - id: gcm-tag-length-error
    desc: GCM authentication tag length validation message
    conf: 0.96
    if:
      # The adjacent unseparated Base64 key makes text extraction omit this
      # whole run; match the ASCII message bytes within read-only PE data.
      type: hex
      section: .rdata
      pattern: '69 6E 76 61 6C 69 64 20 47 43 4D 20 74 61 67 20 6C 65 6E 67 74 68'
