# Composite stream or AES symmetric cipher capability across binaries and source.
defaults:
  platforms: [linux, macos, windows, unix]
  for: [binaries, source, python]
  crit: notable
  conf: 0.9

composite_rules:
  - id: stream-or-aes-cipher-capability
    desc: Stream or AES block cipher capability
    any:
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-quarter-round-rotations-x86-64
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-quarter-round-rotations-x86
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-cipher-operation
      - id: micro-behaviors/crypto/symmetric/stream/chacha::chacha20-keyword
      - id: micro-behaviors/crypto/symmetric/stream/sigma::sigma-code-word-cluster
      - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
      - id: micro-behaviors/crypto/symmetric/aes/constant/
      - id: micro-behaviors/crypto/symmetric/aes/initialize/
