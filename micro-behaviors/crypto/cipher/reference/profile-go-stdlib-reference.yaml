defaults:
  platforms: [windows, linux, macos]
  for: [go]
  crit: notable

composite_rules:
  # Preserve the historical crypto-import selector's population while using
  # the canonical engine import fact instead of a second YAML import matcher.
  - id: go-stdlib-crypto-reference
    desc: Go standard cryptographic primitive references
    for: [scripts, source, binaries]
    platforms: [unix, windows]
    conf: 0.95
    any:
      - id: metadata/import/builtin::go-crypto-rsa-import
      - id: metadata/import/builtin::go-crypto-aes-import
      - id: metadata/import/go/crypto/cipher
