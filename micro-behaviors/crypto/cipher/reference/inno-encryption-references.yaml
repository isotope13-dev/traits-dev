defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.9

traits:
  - id: setup-encryption-key-type-name
    desc: Setup encryption key type name
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: TSetupEncryptionKey
      section: rdata

  - id: setup-encryption-nonce-type-name
    desc: Setup encryption nonce type name
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: TSetupEncryptionNonce
      section: rdata

  - id: encryption-base-nonce-name
    desc: Encryption base nonce name
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: EncryptionBaseNonce
      section: rdata

  - id: shared-encryption-function-name
    desc: Shared encryption function name
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: Shared.EncryptionFunc
      section: rdata
composite_rules:
  - id: setup-encryption-name-profile
    desc: Setup encryption-related name references
    crit: notable
    conf: 0.98
    needs: 3
    any:
      - id: micro-behaviors/crypto/cipher/reference::setup-encryption-key-type-name
      - id: micro-behaviors/crypto/cipher/reference::setup-encryption-nonce-type-name
      - id: micro-behaviors/crypto/cipher/reference::encryption-base-nonce-name
      - id: micro-behaviors/crypto/cipher/reference::shared-encryption-function-name
      - id: well-known/tool/packaging/inno-setup-runtime::inno-password-canary
