defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: native-crypto-file-open-random-clues
    desc: Native crypto, file-open and random API clues
    crit: notable
    conf: 0.97
    for:
      - pe
    all:
      - id: metadata/binary/section/entropy::high-entropy-rdata-section
      - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
      - id: micro-behaviors/crypto/symmetric/aes/constant::aes-sbox-bytes-pe-rdata
      - id: micro-behaviors/fs/file/open/unspecified::nt-create-file
      - id: micro-behaviors/os/random/generator::system-function-036-symbol
      - id: metadata/binary/provenance/build::pe-far-future-timestamp
