defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
- id: openssl-cipher-api-name-text
  desc: OpenSSL cipher API name text
  crit: notable
  conf: 0.9
  for: [scripts, binaries, c, cpp]
  if:
    type: text
    regex: EVP_(Encrypt|Cipher)Init_ex|AES_set_encrypt_key|AES_cbc_encrypt
