defaults:
  platforms:
  - windows
  for:
  - binaries
  crit: component
  conf: 0.9
traits:
- id: bcrypt-authenticated-mode-info
  crit: notable
  desc: BCrypt authenticated cipher-mode struct
  if:
    type: text
    exact: BCRYPT_AUTHENTICATED_CIPHER_MODE_INFO
composite_rules:
- id: bcrypt-symmetric-crypto
  desc: BCrypt symmetric-key and cipher API references
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/crypto/provider/cryptoapi::bcrypt-open-algorithm-provider
  - id: micro-behaviors/crypto/key/import::bcrypt-symmetric-key-api
  any:
  - id: micro-behaviors/crypto/encrypt::bcrypt-encrypt-api
  - id: micro-behaviors/crypto/decrypt::bcrypt-decrypt-api
  - id: micro-behaviors/crypto/provider/cryptoapi::bcrypt-set-property
  - id: micro-behaviors/crypto/cipher::bcrypt-authenticated-mode-info
  needs: 3
