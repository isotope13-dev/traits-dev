defaults:
  platforms: [windows]
  for: [binaries]
  crit: notable
  conf: 0.9

traits:
  - id: bcrypt-chaining-mode-cbc
    desc: Windows BCrypt CBC mode property string
    crit: notable
    if:
      type: text
      exact: ChainingModeCBC

  - id: bcrypt-chaining-mode-gcm
    desc: Windows BCrypt GCM mode property string
    if:
      type: text
      exact: ChainingModeGCM

  - id: bcrypt-chaining-mode-gcm-wide
    desc: UTF-16 Windows BCrypt GCM mode
    crit: notable
    conf: 0.9
    if:
      type: encoded
      encoding: wide
      exact: ChainingModeGCM

  - id: bcrypt-chaining-mode-cfb
    desc: Windows BCrypt CFB mode property string
    if:
      type: text
      exact: ChainingModeCFB

  - id: bcrypt-chaining-mode-ccm
    desc: Windows BCrypt CCM mode property string
    for: [binaries, c, cpp]
    if:
      type: text
      word: ChainingModeCCM

  - id: bcrypt-chain-mode-ccm-macro
    desc: BCrypt CCM chaining-mode macro
    for: [c, cpp]
    if:
      type: text
      word: BCRYPT_CHAIN_MODE_CCM

  - id: bcrypt-chaining-mode-prop
    desc: Windows BCrypt ChainingMode property key
    crit: notable
    if:
      type: text
      exact: ChainingMode

composite_rules:
  - id: bcrypt-cbc-mode-references
    desc: BCrypt CBC chaining-mode property references
    crit: notable
    conf: 0.92
    all:
      - id: bcrypt-chaining-mode-prop
      - id: bcrypt-chaining-mode-cbc
