defaults:
  platforms: [windows]
  for: [class]
  crit: notable
composite_rules:
  - id: jvm-dpapi-base64-gcm-profile
    desc: JVM DPAPI, Base64 and GCM references
    conf: 0.95
    # Keep the crypto recipe class-local so vendored JNA and unrelated
    # Base64/crypto libraries cannot assemble it across a fat JAR.
    all:
      - id: micro-behaviors/os/security/dpapi::jna-crypt32util-class
      - id: micro-behaviors/os/security/dpapi::jvm-crypt-unprotect-data-name
      - id: micro-behaviors/crypto/cipher::jvm-gcm-parameter-spec
      - id: micro-behaviors/crypto/key/representation::secretkeyspec
      - id: metadata/import/jvm::java-base64-decoder-class
