defaults:
  platforms: [unix, windows]
  for: [python, c, cpp, rust, go, shell, javascript, typescript]

traits:
  - id: reduced-round-cipher-marker
    desc: Reduced-round cipher marker
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(reduced[_ -]?round|aes[0-9]+round)\b'

  - id: chosen-plaintext-marker
    desc: Chosen-plaintext input marker
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bchosen[_ -]?plaintexts?(_|\b)'

  - id: meet-in-middle-marker
    desc: Meet-in-the-middle marker
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(^|[_ .-])meet[_ -]?in[_ -]?the[_ -]?middle(_|\b)'

  - id: invariant-fingerprint-marker
    desc: Invariant/fingerprint pair used in analysis
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(invariant[_ -]?fingerprint|fingerprint[_ -]?invariant)\b'

  - id: key-guess-lookup-marker
    desc: Cryptographic key-guess/table marker
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(key[_ -]?guess(es|ing)?|candidate[_ -]?keys?|key[_ -]?table)\b'

composite_rules:
  - id: reduced-round-chosen-plaintext-analysis
    desc: Reduced-round chosen-plaintext MITM
    crit: notable
    conf: 0.95
    all:
      - id: reduced-round-cipher-marker
      - id: chosen-plaintext-marker
      - id: meet-in-middle-marker

  - id: invariant-fingerprint-key-guess-elimination
    desc: Invariant fingerprint removes key guesses
    crit: notable
    conf: 0.94
    all:
      - id: invariant-fingerprint-marker
      - id: key-guess-lookup-marker

  - id: offline-table-key-guess-search
    desc: Offline table and key-guess search
    crit: notable
    conf: 0.93
    all:
      - id: meet-in-middle-marker
      - id: key-guess-lookup-marker
