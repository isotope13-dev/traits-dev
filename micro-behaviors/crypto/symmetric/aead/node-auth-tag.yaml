defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- id: set-auth-tag
  desc: Sets an authentication tag for AEAD decryption
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: (^|\.)setAuthTag$

- id: auth-tag-sliced-from-buffer
  desc: Sets authentication tag from buffer slice
  crit: notable
  conf: 0.9
  mbc: C0027
  if:
    type: text
    regex: 'setAuthTag\(\s*\w+\.(subarray|slice)\('

- id: split-set-auth-tag-call
  desc: Calls setAuthTag through split member name
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: \[['"]setAut['"]\s*\+\s*['"]hTag['"]\]\(
