# GnuPG's symmetric-encryption CLI is a neutral cryptographic capability.
# Ransomware intent is supplied by composites that also require traversal and
# deletion of the plaintext source.
defaults:
  platforms: [unix]
  for: [shell]
  mbc: C0027

traits:
  - id: gpg-symmetric-encryption-command
    desc: GnuPG command performs symmetric encryption
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '^gpg2?$'
      arg:
        kind: identifier
        name: --symmetric

  - id: gpg-command-line-passphrase
    desc: GnuPG command accepts a passphrase argument
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^gpg2?$'
      arg:
        kind: identifier
        name: --passphrase

  - id: gpg-loopback-pinentry-command
    desc: GnuPG command enables loopback pinentry
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'gpg2?\b[\s\S]{0,160}--pinentry-mode[ =\\\r\n\t]+loopback\b'

  - id: gpg-extension-path-argument
    desc: GnuPG command references a .gpg path argument
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^gpg2?$'
      arg:
        kind: string
        regex: '(?i)\.gpg$'

composite_rules:
  - id: gpg-headless-symmetric-encryption
    desc: GnuPG performs unattended passphrase-based symmetric encryption
    crit: notable
    conf: 0.98
    all:
      - id: gpg-symmetric-encryption-command
      - id: gpg-command-line-passphrase
      - id: gpg-loopback-pinentry-command
    near_lines: 12

  - id: gpg-symmetric-gpg-output
    desc: GnuPG symmetric encryption uses a .gpg path argument
    crit: notable
    conf: 0.94
    all:
      - id: gpg-symmetric-encryption-command
      - id: gpg-extension-path-argument
    near_lines: 12
