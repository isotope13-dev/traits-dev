# DEX call sites that select DES. A DES API is neutral by itself; it records
# cipher choice, not what is decrypted or why.
defaults:
  crit: notable
  conf: 0.95
  platforms: [android]
  for: [dex]

traits:
  - id: dex-des-cipher-instance-call
    desc: DEX requests a single-DES cipher transform
    if:
      type: symbol
      kind: call
      exact: 'Ljavax/crypto/Cipher;->getInstance'
      arg:
        kind: string
        regex: '^DES(/|$)'

  - id: dex-des-key-spec-call
    desc: DEX builds a DES key specification
    if:
      type: symbol
      kind: call
      exact: 'Ljavax/crypto/spec/DESKeySpec;-><init>'
