defaults:
  crit: notable
  platforms: [windows]

composite_rules:
  # The provider and decryptor references are not bound to the same object.
  - id: csharp-des-decryptor-references
    desc: C# DES provider and decryptor references
    conf: 0.92
    for: [csharp]
    all:
      - id: micro-behaviors/crypto/symmetric/des::des-provider
      - id: micro-behaviors/crypto/decrypt/initialize::csharp-create-decryptor-symbol
    any:
      - id: micro-behaviors/crypto/cipher/unspecified::dotnet-transform-final-block

  - id: dotnet-des-decryptor-references
    desc: .NET DES provider and decryptor references
    conf: 0.96
    for: [pe]
    all:
      - id: micro-behaviors/crypto/symmetric/des::dotnet-des-provider
      - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
    any:
      - id: micro-behaviors/crypto/cipher/unspecified::dotnet-transform-final-block
