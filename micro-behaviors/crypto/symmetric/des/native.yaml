defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99

traits:
  # Zero-based DES PC-1 permutation followed by the cumulative rotations.
  # These algorithm constants are shared by native DES implementations.
  - id: native-pc1-rotation-tables
    desc: Native DES key permutation and rotation tables
    if:
      type: hex
      section: UPX0
      pattern: '38 30 28 20 18 10 08 00 39 31 29 21 19 11 09 01 3A 32 2A 22 1A 12 0A 02 3B 33 2B 23 3E 36 2E 26 1E 16 0E 06 3D 35 2D 25 1D 15 0D 05 3C 34 2C 24 1C 14 0C 04 1B 13 0B 03 01 02 04 06 08 0A 0C 0E 0F 11 13 15 17 19 1B 1C'
