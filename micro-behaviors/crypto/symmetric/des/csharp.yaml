defaults:
  crit: notable
  for: [csharp]
  platforms: [windows]
traits:
  - id: des-provider
    desc: DES crypto service provider
    conf: 0.9
    if:
      type: text
      substr: DESCryptoServiceProvider
composite_rules:
  - id: des-decrypt-csharp
    desc: DES decryption in C#
    conf: 0.92
    all:
      - id: des-provider
      - id: micro-behaviors/crypto/decrypt::csharp-create-decryptor-symbol
    any:
      - id: micro-behaviors/crypto/cipher::dotnet-transform-final-block
