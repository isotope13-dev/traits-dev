defaults:
  crit: notable
  for: [csharp]
  platforms: [windows]
traits:
  - id: des-provider
    desc: DES crypto service provider
    conf: 0.9
    if:
      type: text
      substr: DESCryptoServiceProvider
  - id: des-create-decryptor
    desc: DES decryptor creation
    conf: 0.88
    if:
      type: symbol
      exact: CreateDecryptor
composite_rules:
  - id: des-decrypt-csharp
    desc: DES decryption in C#
    conf: 0.92
    all:
      - id: des-provider
      - id: des-create-decryptor
    any:
      - id: micro-behaviors/crypto/symmetric/decrypt::transform-final-block
