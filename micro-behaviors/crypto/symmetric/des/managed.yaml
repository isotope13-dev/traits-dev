defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: dotnet-des-provider
    desc: .NET DES crypto service provider reference
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: DESCryptoServiceProvider

composite_rules:
  - id: dotnet-des-decrypt-chain
    desc: .NET DES decryption API chain
    crit: notable
    conf: 0.96
    all:
      - id: dotnet-des-provider
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
    any:
      - id: micro-behaviors/crypto/symmetric/decrypt::transform-final-block
