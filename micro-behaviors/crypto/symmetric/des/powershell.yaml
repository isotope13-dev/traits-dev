traits:
- id: powershell-des-create
  desc: PowerShell creates a DES cipher instance
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: (?i)\[(System\.)?Security\.Cryptography\.DES\]::Create\(
- id: powershell-des-provider-create
  desc: Creates a DES crypto service provider
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: (?i)New-Object\s+(System\.)?Security\.Cryptography\.DESCryptoServiceProvider
defaults:
  for:
  - powershell
  platforms:
  - windows
