# DES-CBC source-level crypto capability.
# A DES API is neutral by itself; command-and-control composites add the
# remote configuration and endpoint-use context before inferring intent.
defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin, python, javascript, typescript, go, ruby, php]
  attack: T1027
  mbc: C0027

traits:
  - id: des-cbc-mode
    desc: DES-CBC cipher mode reference
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)DES\s*/\s*CBC|DES\.MODE_CBC'

  - id: des-cbc-source-constructor
    desc: Source-level DES CBC cipher constructor
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)DES\.new\s*\(|des\.NewCipher\s*\(|createDecipheriv'

composite_rules:
  - id: des-cbc-api
    desc: DES-CBC cryptography API
    crit: notable
    conf: 0.92
    any:
      - id: des-cbc-mode
      - id: des-cbc-source-constructor
