# DES source-level cipher references and constructor evidence.
# A DES API is neutral by itself; command-and-control composites add the
# remote configuration and endpoint-use context before inferring intent.
defaults:
  crit: notable
  conf: 0.92
  platforms: [android, unix, windows]
  for: [java, kotlin, python, javascript, typescript, go, ruby, php]

traits:
  - id: des-cbc-mode
    desc: DES-CBC cipher mode reference
    if:
      type: text
      regex: '(?i)DES\s*/\s*CBC|DES\.MODE_CBC'

  - id: des-source-constructor
    desc: Source-level DES cipher constructor reference
    if:
      type: text
      regex: '(?i)\bDES\b\s*\.new\s*\(|\bdes\b\.NewCipher\s*\('

composite_rules:
  - id: des-api-reference
    desc: DES cipher reference or constructor
    any:
      - id: des-cbc-mode
      - id: des-source-constructor
      - id: micro-behaviors/crypto/decrypt/initialize::node-des-cbc-constructor
