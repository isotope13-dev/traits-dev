# GOST-CBC is a neutral cryptographic capability.  Payload-delivery intent is
# inferred only by objective composites that combine it with key exchange and
# executable-memory staging.
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, rust, go, python, javascript, typescript, java, csharp, pe, dll, elf, macho, binaries, source]
  attack: T1573.001
  mbc: C0021

traits:
  - id: gost-cbc-call
    desc: GOST-CBC encryption or decryption routine
    crit: notable
    conf: 0.96
    for: [c, cpp, rust, go, python, javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(?i)^gost([._-]?(28147|magma))?[._-]?cbc([._-]?(decrypt|encrypt|init|create|update))?$'

  - id: gost-cbc-algorithm-marker
    desc: GOST-CBC algorithm or mode marker
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bGOST([ _-]?(28147|Magma))?[ _/-]?CBC\b|GOST_CIPHER_MODE_CBC'

composite_rules:
  - id: gost-cbc-usage
    desc: Uses GOST in CBC mode
    crit: notable
    conf: 0.95
    any:
      - id: gost-cbc-call
      - id: gost-cbc-algorithm-marker
