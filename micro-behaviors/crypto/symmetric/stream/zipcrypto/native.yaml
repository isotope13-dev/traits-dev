# PKWARE traditional encryption uses fixed algorithm constants, independent
# of the password, archive member names, destinations, and payload identity.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  - id: x86-initial-key-constants
    desc: Initializes three ZipCrypto key words
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'C7 01 78 56 34 12 C7 47 ?? 89 67 45 23 C7 47 ?? 90 78 56 34'

  - id: x86-key-multiply-increment
    desc: ZipCrypto key multiply and increment
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '0F B6 D2 03 51 04 69 D2 05 84 08 08 42 89 51 04 C1 EA 18 33 D0'

composite_rules:
  - id: x86-zipcrypto-cipher
    desc: Native ZipCrypto key initialization and update
    crit: notable
    conf: 0.99
    all:
      - id: x86-initial-key-constants
      - id: x86-key-multiply-increment
