# Fixed ZipCrypto seed constants identify the cipher; they do not prove an update loop.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, svg, python]
  crit: notable
  conf: 0.9
traits:
  - id: source-initial-key-constants
    desc: ZipCrypto initial key constants in source
    if:
      type: text
      regex: '(?i)0x12345678[\s\S]{0,60}0x23456789[\s\S]{0,60}0x34567890'
