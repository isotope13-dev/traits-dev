# RC4 stream-cipher implementation shapes in JavaScript and TypeScript.
# These are neutral cryptographic capabilities; attack intent requires
# separate evidence such as payload retrieval, hidden execution, or C2 use.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  mbc: C0027

traits:
  - id: js-rc4-ksa-init
    desc: RC4 KSA identity-fill loop
    crit: component
    conf: 0.85
    if:
      type: text
      # `0x100` as well as `256`: obfuscator string-array encoders emit every
      # numeric literal in hexadecimal, so a decimal-only bound missed the RC4
      # decoder in each of their builds.
      regex: 'for\s*\(\s*\w[^;]{0,40};\s*\w+<\s*(256|0x100);.{0,30}\)\s*\{?\s*\w+\[\w+\]=\w+'

  - id: js-rc4-ksa-key-mix
    desc: RC4 KSA key-mix swap step
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'charCodeAt\s*\(\s*\w+\s*%\s*\w+\.length\s*\)\s*\)\s*(&\s*0xff|%256)'

  - id: js-rc4-prga-output
    desc: RC4 PRGA keystream output index
    crit: notable
    conf: 0.92
    if:
      type: text
      # Same hexadecimal-literal allowance as the KSA loop above.
      regex: '\w+\[\s*\(\s*\w+\[\w+\]\s*\+\s*\w+\[\w+\]\s*\)\s*(&\s*0xff|%\s*(256|0x100))\s*\]'

  - id: js-rc4-two-arg-call
    desc: Calls rc4() with key and data buffer
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\(0,\s*[A-Za-z_$][\w$]*\.rc4\)\s*\(\s*[A-Za-z_$][\w$]*\s*,\s*[A-Za-z_$][\w$]*'

composite_rules:
  - id: js-rc4-implementation
    desc: JavaScript RC4 stream-cipher implementation
    crit: notable
    conf: 0.95
    all:
      - id: js-rc4-prga-output
    any:
      - id: js-rc4-ksa-init
      - id: js-rc4-ksa-key-mix
