defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: salsa20-stream-cipher-call
    desc: Salsa20 stream-cipher call
    crit: notable
    conf: 0.9
    for: [binaries, scripts, source]
    if:
      type: text
      regex: '(?i)\b(s20_crypt|salsa20(_crypt)?|salsa_crypt)\s*\('
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index

  - id: go-chacha8rand
    desc: Go 1.22+ internal chacha8rand
    crit: baseline
    conf: 1.0
    if:
      type: text
      substr: internal/chacha8rand
  - id: chacha-salsa-constant
    desc: ChaCha20/Salsa20 cipher constant
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: expand 32-byte k
    downgrade:
      any:
        - id: go-chacha8rand
  - id: chacha20-block-constant-native
    desc: Native ChaCha20 block constant
    crit: notable
    conf: 0.99
    for: [pe, dll, elf, macho]
    if:
      type: hex
      section: .text
      pattern: c7 45 ?? 65 78 70 61 c7 45 ?? 6e 64 20 33 c7 45 ?? 32 2d 62 79 c7 45 ?? 74 65 20 6b
  # The ARX quarter-round rotation schedule: 16, 12, 8, 7. This is the one
  # ChaCha signature an author cannot drop -- the sigma constant can be derived
  # at run time, keyed, or split across immediates (this rule's siblings cover
  # the literal and stack-built forms), but changing the rotation schedule
  # changes the algorithm. Register operands are wildcarded and the gaps absorb
  # the interleaved add/xor and any REX prefix for r8-r15.
  - id: chacha20-quarter-round-rotations-x86-64
    desc: ChaCha quarter-round rotation schedule
    crit: notable
    conf: 0.9
    arch: [x86-64]
    for: [pe, dll, elf, macho]
    if:
      type: hex
      section: .text
      pattern: "c1 c? 10 [0-12] c1 c? 0c [0-20] c1 c? 08 [0-12] c1 c? 07"

  - id: chacha20-keyword
    desc: ChaCha20 cipher algorithm reference
    crit: notable
    conf: 0.7
    if:
      type: text
      word: ChaCha20
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  # Loaders often embed lowercase "xchacha20 decrypt/payload" without Poly1305.
  - id: xchacha20-keyword
    desc: XChaCha20 cipher algorithm reference
    crit: notable
    conf: 0.92
    for: [pe, elf, dll, rust, go, c, cpp]
    if:
      type: text
      regex: '(?i)xchacha20'
    unless:
      - id: xchacha20-poly1305-reference
      - id: xchacha20-poly1305-api
  - id: rust-chacha20-crate-path
    desc: Rust ChaCha20 crate source path
    crit: notable
    conf: 0.92
    for: [binaries]
    if:
      type: text
      substr: chacha20-0.
  # The algorithm name is also present in NSS and other crypto libraries.  A
  # string alone does not establish OpenSSL provenance; OpenSSL-specific
  # consumers should combine this neutral algorithm atom with an OpenSSL
  # identity trait when that context matters.
  - id: chacha20-poly1305-algorithm-reference
    desc: ChaCha20-Poly1305 algorithm reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: ChaCha20-Poly1305
    downgrade:
      any:
        - id: well-known/lib/crypto/openssl::openssl-version-symbol
    unless:
      - id: metadata/vendor/identity/
      - id: well-known/tool/detection/security-remediation::compiled-remediation-catalog
  - id: chacha20-poly1305-identifier
    desc: ChaCha20-Poly1305 identifier
    crit: notable
    conf: 0.9
    if:
      type: text
      word: "ChaCha20Poly1305"
  - id: xchacha20-poly1305-api
    desc: XChaCha20-Poly1305 AEAD encryption API
    crit: notable
    conf: 0.98
    for: [pe, elf, c, cpp]
    if:
      type: symbol
      regex: '^crypto_aead_xchacha20poly1305(_ietf)?_encrypt$'
  - id: xchacha20-poly1305-reference
    desc: XChaCha20-Poly1305 algorithm reference
    crit: notable
    conf: 0.92
    for: [pe, elf, c, cpp, rust, go]
    if:
      type: text
      regex: '(?i)XChaCha20[-_]?Poly1305'
  - id: native-chacha20-poly1305-routine
    desc: Native ChaCha20-Poly1305 routine
    crit: notable
    conf: 0.95
    for: [elf, macho, pe, dll]
    if:
      type: symbol
      regex: '^chacha20_poly1305_(encrypt|decrypt)$'
  - id: rust-cipher-partial-block
    desc: Rust stream cipher partial block
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: self.partial_block.is_none()
  - id: rust-cipher-cached-blocks
    desc: Rust stream cipher cached blocks
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: self\.num_cached_blocks\s*<\s*\d+
  - id: stream-cipher-error
    desc: Stream cipher error type
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: StreamCipherError
  - id: stream-decrypt-symbol
    desc: Stream-cipher decryption routine
    crit: notable
    conf: 0.86
    for: [elf, macho, pe]
    if:
      type: symbol
      exact: stream_decrypt
  - id: go-obfuscated-xor-stream
    desc: Obfuscated Go XOR stream cipher
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '^[A-Za-z][A-Za-z0-9_]{5,14}\.\(\*[A-Za-z][A-Za-z0-9_]{6,14}\)\.XORKeyStream$'
    unless:
      - type: text
        exact: 'crypto/cipher.(*aesCtrWrapper).XORKeyStream'
      - type: text
        exact: 'crypto/cipher.(*ctr).XORKeyStream'
      - type: text
        exact: 'crypto/rc4.(*Cipher).XORKeyStream'
      - type: text
        exact: 'vendor/golang.org/x/crypto/chacha20.(*Cipher).XORKeyStream'
      - type: text
        regex: '^crypto/internal/fips140/aes\.\(\*CTR\)\.XORKeyStream$'
composite_rules:
  - id: rust-stream-cipher
    desc: Rust stream cipher implementation
    crit: notable
    conf: 0.9
    all:
      - id: chacha-salsa-constant
    any:
      - id: rust-cipher-partial-block
      - id: rust-cipher-cached-blocks
      - id: stream-cipher-error
