defaults:
  platforms:
  - linux
  for:
  - elf
  arch:
  - mips
  crit: notable
  conf: 0.98
traits:
- id: mips-le-chacha-quarter-round
  desc: MIPS ChaCha quarter-round implementation
  if:
    type: hex
    section: .text
    pattern: 26 10 46 00 00 34 02 00 02 14 02 00 25 10 46 00 [16-40] 26 10 46 00 00 33 02 00 02 15 02 00 25 10 46
      00 [16-40] 26 10 46 00 00 32 02 00 02 16 02 00 25 10 46 00 [16-40] 26 10 44 00 C0 21 02 00 42 16 02 00 25
      10 82 00
- id: mips-le-chacha-rotation-schedule
  desc: MIPS LE ChaCha rotation schedule
  if:
    type: hex
    section: .text
    pattern: "00 (14|24|34) ?? 00 [30-55] 00 (13|23|33) ?? 00 [30-55] 00 (12|22|32) ?? 00 [30-55] c0 (11|21|31) ?? 00"
