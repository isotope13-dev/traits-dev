# ChaCha8 stream-cipher operations.  The algorithm is a neutral crypto
# capability; ransomware intent is supplied by the objective composites that
# pair it with file traversal, key wrapping, renaming, or recovery inhibition.
defaults:
  platforms: [unix, windows]
  for: [source, binaries]

traits:
  - id: chacha8-cipher-call
    desc: ChaCha8 encryption or stream operation call
    crit: notable
    conf: 0.9
    for: [c, cpp, rust, go, elf, macho, pe, dll]
    if:
      type: symbol
      kind: call
      regex: '(?i)^chacha8([_-](xor|crypt|encrypt|decrypt|stream))?$'

  - id: chacha8-api-operation
    desc: ChaCha8 encryption operation in source
    crit: notable
    conf: 0.88
    for: [source, scripts]
    if:
      type: text
      regex: '(?i)\bchacha8([.:_]?(new|xor|crypt|encrypt|decrypt|apply_keystream|stream))\s*[(:.]'

composite_rules:
  - id: chacha8-cipher-operation
    desc: ChaCha8 stream-cipher operation
    crit: notable
    conf: 0.92
    any:
      - id: chacha8-cipher-call
      - id: chacha8-api-operation
