defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-indexed-chacha-column-rounds
    desc: Indexed ChaCha column quarter-round calls
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .text
      # Quarter-round indices (2,6,10,14) and (0,4,8,12). Stack slots,
      # state-pointer displacement and helper-call relocations vary.
      pattern: 'BA 02 00 00 00 C7 44 24 ?? 0E 00 00 00 41 B9 0A 00 00 00 48 8D 4D ?? 41 B8 06 00 00 00 E8 [4] [0-32] 48 8D 4D ?? C7 44 24 ?? 0C 00 00 00 33 D2 41 B9 08 00 00 00 41 B8 04 00 00 00 E8 [4]'
