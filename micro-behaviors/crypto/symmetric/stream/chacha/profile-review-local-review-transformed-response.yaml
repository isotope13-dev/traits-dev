defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: transformed-response-returned
    desc: Returns transformed Base64 response bytes
    crit: notable
    conf: 0.98
    size_max: 131072
    if:
      type: tree-sitter
      query: |
        ((arrow_function
          body: (statement_block
            (_)*
            (lexical_declaration
              (variable_declarator
                name: (identifier) @decoded
                value: (call_expression
                  function: (member_expression
                    object: (identifier) @buffer
                    property: (property_identifier) @from)
                  arguments: (arguments
                    (member_expression
                      object: (identifier) @response
                      property: (property_identifier) @payload)
                    (string) @encoding))))
            (_)*
            (lexical_declaration
              (variable_declarator
                name: (identifier) @transformed
                value: (call_expression
                  function: (identifier) @transform
                  arguments: (arguments
                    (_)
                    (_)
                    (identifier) @ciphertext))))
            (_)*
            (expression_statement
              (call_expression
                function: (identifier) @resolve
                arguments: (arguments (identifier) @returned)))))
        (#eq? @buffer "Buffer")
        (#eq? @from "from")
        (#match? @encoding "^[\"']base64[\"']$")
        (#match? @payload "(?i)(model|payload|asset|data|body|bytes)")
        (#eq? @transform "xchacha20")
        (#eq? @ciphertext @decoded)
        (#eq? @resolve "resolve")
        (#eq? @transformed @returned)
        )

