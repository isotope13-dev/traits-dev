# The Windows native crypto provider exposes RC4 decryption through this
# undocumented function, without importing a general-purpose crypto library.
defaults:
  for: [pe, dll]
  platforms: [windows]
  mbc: C0027
  attack: T1140
traits:
  - id: systemfunction033-symbol
    desc: Undocumented NTAPI RC4 decryption function
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: SystemFunction033
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
