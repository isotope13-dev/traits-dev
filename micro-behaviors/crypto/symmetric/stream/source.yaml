# Source-level shape of a hand-written RC4 implementation.
#
# The campaign report describes an RC4 implementation whose routine names and
# crypto-library imports were not useful static indicators. These atoms look
# for the algorithm's KSA/PRGA structure instead, so renamed routines and
# language bindings remain detectable without treating the word "RC4" as an
# IOC.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, csharp, go, rust, python, powershell]
  attack: T1027,T1140

traits:
  - id: rc4-source-state-table-c
    desc: 256-entry C state or box table
    crit: notable
    conf: 0.9
    if:
      type: text
      # A generic 256-entry byte array is common in lookup tables and SIMD
      # libraries. Require an RC4-like state/box identifier for this crypto
      # component; the full implementation composite still requires KSA and
      # PRGA evidence as well.
      regex: '(?i)(unsigned\s+char|uint8_t)\s+(S|state|box)\s*\[\s*256\s*\]'

  - id: rc4-source-state-table-c-named
    desc: 256-entry C named permutation table
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)(unsigned\s+char|uint8_t)\s+(perm|permutation|rc4_state)\s*\[\s*256\s*\]'

  - id: rc4-source-state-table-managed
    desc: 256-entry managed state table
    crit: notable
    conf: 0.9
    for: [csharp]
    if:
      type: text
      regex: '(?i)(byte\s+[A-Za-z_]\w*\s*\[\s*256\s*\]|new\s+byte\s*\[\s*256\s*\])'

  - id: rc4-source-state-table-managed-int
    desc: 256-entry integer managed state table
    crit: notable
    conf: 0.9
    for: [csharp, powershell]
    if:
      type: text
      regex: '(?i)new\s+int\s*\[\s*256\s*\]'

  - id: rc4-source-ksa-key-modulo
    desc: Repeating-key indexed access in source
    crit: component
    conf: 0.88
    for: [csharp, powershell]
    if:
      type: text
      regex: '(?i)[A-Za-z_]\w*\s*\[\s*[A-Za-z_]\w*\s*%\s*[A-Za-z_]\w*\.Length\s*\]'

  - id: rc4-source-ksa-index-arithmetic
    desc: RC4 KSA state-and-key index arithmetic
    crit: notable
    conf: 0.93
    for: [csharp, powershell]
    if:
      type: text
      regex: '(?i)[A-Za-z_]\w*\s*=\s*\(\s*[A-Za-z_]\w*\s*\+\s*[A-Za-z_]\w*\s*\[\s*[A-Za-z_]\w*\s*\]'

  - id: rc4-source-ksa-index-modulo-256
    desc: RC4 KSA index modulo 256
    crit: notable
    conf: 0.92
    for: [csharp, powershell]
    if:
      type: text
      regex: '(?i)\]\s*\)\s*%\s*256'

  - id: rc4-source-prga-state-sum
    desc: RC4 keystream state-sum expression
    crit: notable
    conf: 0.93
    for: [csharp, powershell]
    if:
      type: text
      regex: '(?i)\w+\s*\[\s*\(\s*\w+\s*\[\s*\w+\s*\]\s*\+\s*\w+\s*\['

  - id: rc4-source-prga-state-modulo-256
    desc: RC4 keystream index modulo 256
    crit: notable
    conf: 0.92
    for: [csharp, powershell]
    if:
      type: text
      regex: '(?i)\]\s*\)\s*%\s*256\s*\]'

  - id: rc4-source-output-xor-local-keystream
    desc: Output XOR with local keystream
    crit: component
    conf: 0.88
    for: [csharp, powershell]
    if:
      type: text
      regex: '(?i)[A-Za-z_]\w*\s*\[\s*[A-Za-z_]\w*\s*\]\s*=\s*\([^;\r\n]{0,80}\^\s*[A-Za-z_]\w+\s*\)'

  - id: rc4-source-state-table-python
    desc: Python 256-entry state table
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      # A bare list(range(256)) also appears in normal image LUT examples and
      # documentation.  Require the state-like assignment that initializes an
      # RC4 permutation instead of treating every 256-entry list as crypto.
      regex: '(?i)\b(state|box|perm|s)\s*=\s*list\s*\(\s*range\s*\(\s*256\s*\)\s*\)'

  - id: rc4-source-state-table-go
    desc: Go state-table byte fragment
    crit: component
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '(?i)\b(var\s+)?(state|box|s)\s*(:=\s*)?\[\s*256\s*\]\s*(byte|uint8)'

  - id: rc4-source-state-table-rust
    desc: Rust 256-entry state table
    crit: notable
    conf: 0.9
    for: [rust]
    if:
      type: text
      regex: '(?i)\[\s*256\s*\]\s*u8'

  - id: rc4-source-state-table-powershell
    desc: PowerShell 256-entry state range
    crit: notable
    conf: 0.86
    for: [powershell]
    if:
      type: text
      regex: '(?i)0\s*\.\.\s*255'

  - id: rc4-source-ksa-state
    desc: Stream-cipher state-byte swap
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)state\s*\[\s*i\s*\]\s*=\s*state\s*\[\s*j\s*\]'

  - id: rc4-source-ksa-box
    desc: Box-table state-byte swap
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)box\s*\[\s*i\s*\]\s*=\s*box\s*\[\s*j\s*\]'

  - id: rc4-source-ksa-indexed-left
    desc: RC4 KSA indexed left assignment
    crit: notable
    conf: 0.88
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?is)for\s*\(.{0,35}256.{0,12}\).{0,120}\w+\[i\]\s*=\s*\w+\[j\]'

  - id: rc4-source-ksa-indexed-right
    desc: RC4 KSA indexed right assignment
    crit: notable
    conf: 0.88
    for: [c, cpp, csharp, go, rust]
    if:
      type: text
      # The right side must be the companion indexed array element. A bare
      # `used[j] = false` in permutation/test code is not an RC4 swap.
      regex: '(?is)for\s*\(.{0,35}256.{0,12}\).{0,120}\w+\[j\]\s*=\s*\w+\[i\]'

  - id: rc4-source-swap-state-call
    desc: Stream-cipher state swap call
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bswap\s*\(\s*state\s*\[\s*i\s*\]\s*,\s*state\s*\[\s*j\s*\]\s*\)'

  - id: rc4-source-swap-box-call
    desc: Box-table swap call
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bswap\s*\(\s*box\s*\[\s*i\s*\]\s*,\s*box\s*\[\s*j\s*\]\s*\)'

  - id: rc4-source-ksa-tuple
    desc: Python indexed state tuple swap
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?i)state\s*\[\s*i\s*\]\s*,\s*state\s*\[\s*j\s*\]\s*='

  - id: rc4-source-prga-xor-hex
    desc: Stream-cipher PRGA indexed-state XOR
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\^=\s*[A-Za-z_]\w*\s*\[.{0,50}\[i\].{0,20}\[j\].{0,10}0xff\]'

  - id: rc4-source-prga-xor-decimal
    desc: Decimal indexed-state XOR
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\^=\s*[A-Za-z_]\w*\s*\[.{0,50}\[i\].{0,20}\[j\].{0,10}255\]'

  - id: rc4-source-prga-assignment
    desc: Assigned stream-cipher keystream XOR
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)=.{0,16}\^\s*[A-Za-z_]\w*\s*\[.{0,16}\[i\].{0,16}\[j\].{0,10}0xff\]'

  - id: rc4-source-prga-append
    desc: Python appends RC4 keystream XOR output
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '(?i)\b[A-Za-z_]\w*\.append\s*\([^\n]{0,100}\^\s*[A-Za-z_]\w*\['

composite_rules:
  - id: source-rc4-state-table
    desc: 256-entry state-table fragment
    crit: component
    conf: 0.92
    any:
      - id: rc4-source-state-table-c
      - id: rc4-source-state-table-c-named
      - id: rc4-source-state-table-managed
      - id: rc4-source-state-table-managed-int
      - id: rc4-source-state-table-python
      - id: rc4-source-state-table-go
      - id: rc4-source-state-table-rust
      - id: rc4-source-state-table-powershell

  - id: source-rc4-prga
    desc: Stream-cipher PRGA keystream XOR
    crit: notable
    conf: 0.93
    any:
      - id: rc4-source-prga-xor-hex
      - id: rc4-source-prga-xor-decimal
      - id: rc4-source-prga-assignment
      - id: rc4-source-prga-append

  - id: source-rc4-ksa-swap
    desc: Stream-cipher KSA indexed swap
    crit: notable
    conf: 0.93
    any:
      - id: rc4-source-ksa-state
      - id: rc4-source-ksa-box
      - id: rc4-source-swap-state-call
      - id: rc4-source-swap-box-call
      - id: rc4-source-ksa-tuple
      - id: source-rc4-ksa-indexed-array

  - id: source-rc4-ksa-indexed-array
    desc: Indexed-array RC4 KSA swap
    crit: notable
    conf: 0.91
    all:
      - id: rc4-source-ksa-indexed-left
      - id: rc4-source-ksa-indexed-right
    near_lines: 20

  - id: source-rc4-implementation
    desc: Hand-written RC4-like stream-cipher implementation
    crit: notable
    conf: 0.96
    all:
      - id: source-rc4-state-table
      - id: source-rc4-ksa-swap
      - id: source-rc4-prga

  - id: source-rc4-managed-implementation
    desc: Managed RC4 key scheduling and keystream implementation
    crit: notable
    conf: 0.97
    for: [csharp, powershell]
    all:
      - id: rc4-source-state-table-managed-int
      - id: rc4-source-ksa-index-arithmetic
      - id: rc4-source-ksa-key-modulo
      - id: rc4-source-ksa-index-modulo-256
      - id: rc4-source-prga-state-sum
      - id: rc4-source-prga-state-modulo-256
      - id: rc4-source-output-xor-local-keystream
    near_bytes: 4096
