# ChaCha20/Salsa20 sigma words in big-endian m68k code. Each word is stored
# by a `move.l #imm32, d16(an)` (opcode 2x 7C) at a fixed stride, so the string
# "expand 32-byte k" never appears; the four immediates 0x61707865, 0x3320646E,
# 0x79622D32 and 0x6B206574 do.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98

traits:
  - id: sigma-immediate-constant-m68k
    desc: m68k Salsa/ChaCha sigma constant in code
    arch: [m68k]
    if:
      type: hex
      section: .text
      # Four move.l #imm32, d16(an) stores in sigma-word order, with the
      # 16-bit displacement between them.
      pattern: "2? 7C 61 70 78 65 ?? ?? 2? 7C 33 20 64 6E ?? ?? 2? 7C 79 62 2D 32 ?? ?? 2? 7C 6B 20 65 74"
