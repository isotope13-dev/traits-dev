# ChaCha20/Salsa20 sigma words in m68k (big-endian) code. Each 32-bit constant
# is loaded with `move.l #imm32` (often `move.l #imm32, d16(an)`, opcode 2x 7C,
# at a fixed stride), so the words appear in value order with their bytes in
# big-endian order: `61 70 78 65` (0x61707865), `33 20 64 6E`, `79 62 2D 32`,
# and `6B 20 65 74`. Stripped static builds keep no `expand 32-byte k` text,
# and the little-endian sigma atoms do not match here.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.95

traits:
  - id: sigma-immediate-constant-m68k
    desc: m68k ChaCha/Salsa sigma constant in code
    arch: [m68k]
    if:
      type: hex
      section: .text
      # The four sigma words in order, each a few instruction bytes apart. The
      # bounded skip covers the d16(an) store form (2-byte displacement plus
      # the next 2x 7C opcode) and other short move.l encodings.
      pattern: "61 70 78 65 [0-16] 33 20 64 6E [0-16] 79 62 2D 32 [0-16] 6B 20 65 74"
