defaults:
  platforms:
    - windows
composite_rules:
  - id: self-issued-chacha-resource-allocation-profile
    desc: Self-issued PE with ChaCha, resource and allocation clues
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/signature/certificate/chain::pe-cert-leaf-self-issued
      - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
      - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
      - id: metadata/binary/resource/size::oversized-low-entropy-rsrc
    for:
      - pe
      - dll
