defaults:
  platforms:
    - windows
  for:
    - pe
composite_rules:
  - id: self-issued-crypto-resource-allocation
    desc: Self-issued PE with resource allocation clues
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/crypto/symmetric/stream/sigma::self-issued-chacha-resource-allocation-profile
      - id: metadata/binary/resource/size::rsrc-section-over-150kb
      - id: metadata/binary/symbols/count::imported-functions-under-10
    any:
      - id: metadata/binary/instruction/operand::x64-load-r8-r9-40
      - id: metadata/binary/instruction/operand::x64-load-r8-r9-20
      - id: metadata/binary/layout/size::giant-string-blob-metric
    unless:
      - id: metadata/installer/product/
