# ChaCha20/Salsa20 sigma words in ARC (ARCompact) code. ARC loads a 32-bit
# constant as a long immediate stored as two 16-bit halves, high half first and
# each half little-endian, so "expand 32-byte k" appears as the four words
# `70 61 65 78`, `20 33 6e 64`, `62 79 32 2d`, `20 6b 74 65` rather than as a
# readable string. Stripped static builds keep no `expand 32-byte k` text.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98

traits:
  - id: sigma-immediate-constant-arc
    desc: ARC Salsa/ChaCha sigma constant in code
    if:
      type: hex
      section: .text
      # The four sigma words in order, a few instruction bytes apart.
      pattern: "70 61 65 78 [0-16] 20 33 6E 64 [0-16] 62 79 32 2D [0-16] 20 6B 74 65"
