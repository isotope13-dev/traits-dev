defaults:
  platforms: [unix, windows, android]
  for: [elf, pe, macho, static-lib]
traits:
  - id: xor-concealed-stream-cipher-sigma
    desc: XOR-encoded ChaCha/Salsa sigma constant
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule xor_concealed_stream_cipher_sigma {
          strings:
            $sigma = "expand 32-byte k" xor(1-255)
          condition:
            $sigma
        }
