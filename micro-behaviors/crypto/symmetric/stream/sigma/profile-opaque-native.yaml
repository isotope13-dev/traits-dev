defaults:
  platforms:
  - linux
  for:
  - elf
composite_rules:
- id: compact-opaque-sigma-rodata-profile
  desc: Compact ELF with opaque rodata and sigma constant
  crit: notable
  conf: 0.97
  size_min: 16384
  all:
  - id: metadata/binary/section/entropy::high-entropy-rodata
  - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
  - id: metadata/binary/symbols/table::full-symbol-table-absent-or-empty-flag
  - id: metadata/binary/section/prose::native-short-readable-string-surface
  - id: metadata/binary/linking/dynamic::elf-at-most-two-needed-libraries
- id: privileged-sigma-native-api-clues
  desc: Sigma, privilege and native API clues
  crit: notable
  conf: 0.96
  all:
  - id: compact-opaque-sigma-rodata-profile
  - id: micro-behaviors/os/privilege/query::geteuid
  - id: micro-behaviors/fs/link::readlink
  any:
  - id: micro-behaviors/process/thread/runtime::pthread
  - id: micro-behaviors/communications/socket/create::posix-socket-import
  - id: micro-behaviors/fs/attributes/xattr::setxattr-func
  needs: 2
