defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: chacha-salsa-constant
    desc: ChaCha20/Salsa20 cipher constant
    crit: notable
    conf: 0.95
    for: [scripts, binaries, source]
    if:
      type: text
      substr: expand 32-byte k
  - id: sigma-stack-constant-x86
    desc: Salsa/ChaCha sigma constant in code
    crit: notable
    conf: 0.99
    for: [pe, dll, elf, macho]
    if:
      type: hex
      section: .text
      pattern: c7 45 ?? 65 78 70 61 c7 45 ?? 6e 64 20 33 c7 45 ?? 32 2d 62 79 c7 45 ?? 74 65 20 6b
  - id: sigma-stack-constant-mips-le
    desc: MIPS LE Salsa/ChaCha sigma constant
    crit: notable
    conf: 0.98
    for: [elf]
    platforms: [linux]
    arch: [mips]
    if:
      type: hex
      section: .text
      pattern: "70 61 ?? 3c [0-32] 20 33 ?? 3c [0-96] 62 79 ?? 3c [0-32] 20 6b ?? 3c"
  # Four sigma-word byte sequences in a code section. This includes managed
  # CIL constants and does not by itself distinguish native instructions from
  # embedded section data. The composite requires all four nearby.
  - id: sigma-word-expa-code
    desc: Sigma candidate word "expa" in code
    crit: component
    conf: 0.6
    for: [pe, dll, elf, macho]
    if:
      type: hex
      section: .text
      pattern: "65 78 70 61"
  - id: sigma-word-nd3-code
    desc: Sigma candidate word "nd 3" in code
    crit: component
    conf: 0.6
    for: [pe, dll, elf, macho]
    if:
      type: hex
      section: .text
      pattern: "6e 64 20 33"
  - id: sigma-word-2by-code
    desc: Sigma candidate word "2-by" in code
    crit: component
    conf: 0.6
    for: [pe, dll, elf, macho]
    if:
      type: hex
      section: .text
      pattern: "32 2d 62 79"
  - id: sigma-word-tek-code
    desc: Sigma candidate word "te k" in code
    crit: component
    conf: 0.6
    for: [pe, dll, elf, macho]
    if:
      type: hex
      section: .text
      pattern: "74 65 20 6b"

  # The extractor can split a Mach-O __const run into the lone word expand.
  # Preserve the complete constant when the canonical text rule misses it.
  - id: chacha-salsa-constant-macho-bytes
    desc: ChaCha/Salsa constant bytes in Mach-O data
    crit: notable
    conf: 0.98
    for: [macho]
    platforms: [macos, ios]
    if:
      type: hex
      section: __const
      pattern: '65 78 70 61 6E 64 20 33 32 2D 62 79 74 65 20 6B'
    unless:
      - id: chacha-salsa-constant
composite_rules:
  - id: sigma-code-word-cluster
    desc: Nearby ChaCha/Salsa constant words in code section
    crit: notable
    conf: 0.93
    for: [pe, dll, elf, macho]
    near_bytes: 512
    all:
      - id: sigma-word-expa-code
      - id: sigma-word-nd3-code
      - id: sigma-word-2by-code
      - id: sigma-word-tek-code
  - id: sigma-stream-cipher-clues
    desc: Sigma and stream-cipher context
    crit: notable
    conf: 0.9
    all:
      - id: chacha-salsa-constant
    any:
      - id: metadata/lang/source/syntax/call/member::partial-block-is-none-text
      - id: metadata/lang/source/syntax/comparison::cached-block-count-comparison
      - id: micro-behaviors/crypto/symmetric/stream/reference::stream-cipher-error
