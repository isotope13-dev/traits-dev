defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
# Algorithm recovered by Rapid7:
# https://github.com/rapid7/Rapid7-Labs/blob/main/Malware%20Config%20Extractors/webworm_rcen_decrypt.py

traits:
  - id: initial-state
    desc: RCEN stream cipher initial state
    if:
      type: text
      regex: '\[0x12345678,\s*0x9abcdef0,\s*0xfedcba98,\s*0x76543210\]'
      case_insensitive: true
      exclude_comments: true

  - id: header-literal
    desc: RCEN encrypted envelope magic literal
    if:
      type: literal
      exact: RCEN

composite_rules:
  - id: python-envelope-parser
    desc: RCEN cipher and little-endian envelope parsing
    all:
      - id: initial-state
      - id: header-literal
      - id: micro-behaviors/data/buffer/integer-codec::python-u32-unpack-from
