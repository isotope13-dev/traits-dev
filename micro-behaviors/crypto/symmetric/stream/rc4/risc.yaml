defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98
traits:
  # S[i] + S[j], reduced modulo 256, selects the keystream byte which
  # is XORed into the buffer. No key, endpoint or payload bytes are pinned.
  - id: arm-rc4-prga-buffer-transform
    desc: ARM RC4 indexed-keystream buffer transform
    arch: [arm]
    if:
      type: hex
      section: .text
      pattern: '01 3C 8D E2 04 10 83 E0 00 31 51 E5 00 21 50 E5 02 30 83 E0 FF 30 03 E2 01 1C 8D E2 03 20 81 E0 00 11 52 E5 06 30 D5 E7 01 30 23 E0 06 30 C5 E7 01 50 85 E2 07 00 55 E1'
  - id: powerpc-rc4-prga-buffer-transform
    desc: PowerPC RC4 indexed-keystream buffer transform
    arch: [powerpc]
    if:
      type: hex
      section: .text
      pattern: '89 2B 00 08 88 08 00 08 7D 4C 18 AE 7C 00 4A 14 54 00 06 3E 7D 21 02 14 89 69 00 08 7D 4A 5A 78 7D 4C 19 AE 39 8C 00 01'
  - id: mips-be-rc4-prga-buffer-transform
    desc: MIPS big-endian RC4 buffer transform
    arch: [mips]
    if:
      type: hex
      section: .text
      pattern: '30 62 00 FF 90 A3 00 00 90 E4 00 00 00 43 10 21 30 42 00 FF 01 42 10 21 90 43 00 00 00 00 00 00 00 83 20 26 A0 E4 00 00'
