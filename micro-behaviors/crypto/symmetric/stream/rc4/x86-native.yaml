# RC4 PRGA: increment i, update j from S[i], swap S[i]/S[j],
# index S[(S[i]+S[j]) & 255], then XOR a source byte. Stack
# displacements and the caller's pointers are intentionally not pinned.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]
  crit: notable
traits:
  - id: x86-byte-state-prga
    desc: RC4 byte-state swaps and keystream XOR
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'FE C2 0F B6 FA 8A 2C 3B 00 E9 0F B6 C1 8A 34 03 88 34 3B 88 2C 03 02 2C 3B 0F B6 FD 8A 2C 3B [0-12] 32 2C 37'
