# RC4 PRGA: increment i, update j from S[i], swap S[i]/S[j],
# index S[(S[i]+S[j]) & 255], then XOR a source byte. Stack
# displacements and the caller's pointers are intentionally not pinned.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]
  crit: notable
traits:
  - id: x86-byte-state-prga
    desc: RC4 byte-state swaps and keystream XOR
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'FE C2 0F B6 FA 8A 2C 3B 00 E9 0F B6 C1 8A 34 03 88 34 3B 88 2C 03 02 2C 3B 0F B6 FD 8A 2C 3B [0-12] 32 2C 37'

  # First output step of an unrolled PRGA: swap S[1] with S[j], use
  # their sum modulo 256 to select a byte, and XOR it into the buffer.
  # Stack slots vary; no key, configuration value or caller address is fixed.
  - id: x86-initial-prga-buffer-xor
    desc: x86 initial RC4 swap and buffer XOR
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '8A 5C 24 ?? 88 D8 25 FF 00 00 00 89 C6 8A 44 04 ?? 88 44 24 ?? 88 5C 34 ?? 88 D8 02 44 24 ?? 25 FF 00 00 00 8A 44 04 ?? 30 07'

  # XOR swaps are intentionally reproduced, including their same-index
  # zeroing behavior. This is RC4-style rather than a claim of standard RC4.
  - id: x86-xor-swap-prga-buffer-transform
    desc: x86 RC4-style XOR-swap buffer transform
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '8D 14 1F 89 C5 8D 0C 07 8A 02 32 01 88 02 32 01 88 01 30 02 31 C0 8A 44 2C ?? 8B 54 24 ?? 02 44 1C ?? 25 FF 00 00 00 8A 44 04 ?? 30 04 16 46 39 74 24 ?? 75 ??'
