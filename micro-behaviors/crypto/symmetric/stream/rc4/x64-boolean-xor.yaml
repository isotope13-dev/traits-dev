defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-byte-state-prga-boolean-xor
    desc: RC4 state swaps with Boolean-expanded XOR
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Exchange S[i]/S[j], wrap the sum to a byte and select S[sum].
      # Output is (~input & keybyte) | (input & ~keybyte), i.e. XOR.
      # Stack slots are free; state base and table offsets stay bound.
      pattern: '47 8A 44 0A 02 44 88 44 24 ?? 0F B6 4C 24 ?? 41 89 C9 47 88 44 0A 02 44 8A 44 24 ?? 0F B6 4C 24 ?? 41 89 C9 47 88 44 0A 02 0F B6 4C 24 ?? 0F B6 54 24 ?? 29 D0 29 C1 41 88 C8 41 0F B6 C0 41 89 C1 43 0F B6 44 0A 02 4C 8B 4C 24 ?? 4C 63 5C 24 ?? 43 0F B6 0C 19 89 CA 83 F2 FF 89 C6 21 D6 83 F0 FF 21 C1 09 CE 41 88 F0 47 88 04 19'
