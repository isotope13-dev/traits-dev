defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  # The state array can live in an appended executable section. This complete
  # byte-wrapped state swap / keystream lookup / buffer XOR loop identifies
  # RC4 mechanics without depending on the section label or key material.
  - id: x64-stack-byte-wrapped-prga
    desc: RC4 stack-state swaps and byte-buffer XOR
    crit: notable
    conf: 0.98
    if:
      type: hex
      offset_range: [512, null]
      pattern: '41 8D 42 01 44 0F B6 D0 46 0F B6 04 14 43 8D 04 01 44 0F B6 C8 42 8A 04 0C 42 88 04 14 46 88 04 0C 42 0F B6 04 14 4C 03 C0 41 0F B6 C0 8A 0C 04 30 0B 48 FF C3 49 83 EB 01 75 ??'
