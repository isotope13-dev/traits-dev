defaults:
  platforms:
  - windows
  for:
  - vbs
composite_rules:
- id: vb-capi-rc4-api-cooccurrence
  desc: VB RC4 and CryptoAPI references co-occur
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/crypto/symmetric/stream/rc4::calg-rc4-vb-reference
  - id: micro-behaviors/crypto/hash/digest::calg-md5-vb-reference
  - id: micro-behaviors/crypto/library/cryptoapi::capi-key-derivation-vb6
  any:
  - id: micro-behaviors/crypto/library/cryptoapi::crypt-encrypt-vb6
  - id: micro-behaviors/crypto/library/cryptoapi::crypt-decrypt-vb6
