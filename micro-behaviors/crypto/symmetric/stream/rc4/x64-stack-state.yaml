defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
traits:
  # i/j byte wrapping, S[i]/S[j] swap, S[S[i]+S[j]], then buffer XOR.
  # No key bytes, virtual addresses or branch displacements are required.
  - id: x64-stack-byte-state-prga
    desc: RC4 stack-state swaps and buffer XOR
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '88 44 34 ?? 40 88 7C 0C ?? 02 54 34 ?? 0F B6 D2 8A 44 14 ?? 41 30 40 FF 49 FF C0 41 39 D9 7C ??'
