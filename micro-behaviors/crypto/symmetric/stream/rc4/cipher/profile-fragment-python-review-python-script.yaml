defaults:
  platforms:
    - unix
    - windows
  for:
    - python
composite_rules:
  - id: python-rc4-zlib-byte-marker-clues
    desc: RC4, zlib and escaped byte-marker clues
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::python-rc4-like-stream-cipher
