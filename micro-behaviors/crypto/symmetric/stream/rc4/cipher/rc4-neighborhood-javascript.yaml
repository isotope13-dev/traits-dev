# RC4 stream-cipher implementation shapes in JavaScript and TypeScript.
# These are neutral cryptographic capabilities; attack intent requires
# separate evidence such as payload retrieval, hidden execution, or C2 use.
defaults:
  crit: notable
  platforms: [windows, unix]
  # Inline script in HTML pages uses the same implementation shapes as
  # standalone JavaScript. Keeping HTML in scope lets archive rules correlate
  # a string decoder with the active content it reconstructs.
  for: [html, javascript, typescript]
  mbc: C0027

traits:
  - id: js-rc4-two-arg-call
    desc: Calls rc4() with key and data buffer
    conf: 0.9
    if:
      type: text
      regex: '\(0,\s*[A-Za-z_$][\w$]*\.rc4\)\s*\(\s*[A-Za-z_$][\w$]*\s*,\s*[A-Za-z_$][\w$]*'
composite_rules:
  - id: js-rc4-implementation
    desc: JavaScript RC4 stream-cipher implementation
    conf: 0.95
    all:
      - id: metadata/lang/source/syntax/array::js-indexed-sum-byte-lookup
    any:
      - id: micro-behaviors/data/collection/array::js-256-entry-array-fill
      - id: metadata/lang/source/syntax/operator::js-indexed-charcode-modulo
      - id: metadata/lang/source/syntax/operator::js-bracketed-charcode-modulo
