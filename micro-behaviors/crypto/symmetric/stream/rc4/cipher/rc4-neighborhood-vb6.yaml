defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027
traits:
  - id: vb6-rc4-function-signature
    desc: VB6 RC4 function signature
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'Function\s+RC4\s*\(\s*ByVal\s+Data\s+As\s+String'
composite_rules:
  - id: vb6-rc4-implementation
    desc: VB6 RC4 stream cipher implementation
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::vb6-rc4-function-signature
      - id: metadata/lang/source/syntax/array::vb6-f-256-element-array
      - id: micro-behaviors/data/encode/string::vb6-password-from-unicode
      - id: metadata/lang/source/syntax/operator::vb6-f-nested-xor
  - id: standalone-vb6-rc4-module
    desc: Standalone VB6 RC4 module
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/lang/source/naming/module::vb6-modrc4-module-name
      - id: micro-behaviors/crypto/symmetric/stream/rc4/cipher::vb6-rc4-implementation
