defaults:
  for: [elf]
  platforms: [linux]
  arch: [arm]
  crit: notable
  conf: 0.98

traits:
  - id: arm-rc4-eight-byte-key-buffer-transform
    desc: ARM RC4 key scheduling and buffer XOR
    if:
      type: hex
      section: .text
      # KSA cycles through an eight-byte key, updates j modulo 256 and swaps
      # S[i]/S[j] for all 256 entries. The later unrolled PRGA selects a
      # keystream byte from the state and XORs it into the copied input.
      # Key bytes, key address and call destinations are deliberately absent.
      pattern: 'CC 3F A0 E1 A3 3E A0 E1 03 20 8C E0 07 20 02 E2 04 00 DC E7 02 20 63 E0 02 10 D5 E7 0E 30 80 E0 01 30 83 E0 FF E0 03 E2 0E 20 D4 E7 04 20 CC E7 01 C0 8C E2 01 0C 5C E3 0E 00 C4 E7 EF FF FF 1A [32-64] FF 10 01 E2 01 E0 84 E0 02 30 83 E0 00 C1 5E E5 FF 30 03 E2 03 20 84 E0 00 51 52 E5 02 C0 CD E5 00 01 4E E5 03 C0 DD E5 02 30 DD E5 0C 10 81 E0 FF 10 01 E2 01 E0 84 E0 03 00 80 E0 00 21 5E E5 FF 00 00 E2 00 30 84 E0 00 41 53 E5 03 20 CD E5 00 C1 4E E5 00 30 D6 E5 05 30 23 E0 04 00 DD E5 00 30 C6 E5'
