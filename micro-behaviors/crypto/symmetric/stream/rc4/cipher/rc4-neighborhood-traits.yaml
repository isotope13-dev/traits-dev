defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
  mbc: C0027
  attack: T1573
  size_max: 52428800
traits:
  - id: go-rc4-new-cipher
    desc: Go creates an RC4 stream cipher
    crit: notable
    conf: 0.99
    for: [go, pe, elf, macho]
    if:
      type: symbol
      kind: call
      exact: rc4.NewCipher

  - id: rc4-strings
    desc: RC4 implementation text marker
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: (?i)rc4.{0,20}crypt
composite_rules:
  - id: rc4-bytecode
    desc: RC4 encryption byte patterns
    crit: notable
    conf: 0.8
    needs: 2
    any:
      - id: micro-behaviors/crypto/symmetric/stream/rc4/key-schedule::rc4-swap-pattern
      - id: micro-behaviors/crypto/symmetric/stream/rc4/key-schedule::rc4-ksa-swap-loop-i386
      - id: micro-behaviors/crypto/symmetric/stream/rc4/transform::rc4-prga-xor-buffer-loop-i386
      - id: micro-behaviors/crypto/symmetric/stream/rc4/key-schedule::rc4-stack-key-ksa-i386
      - id: micro-behaviors/crypto/symmetric/stream/rc4/key-schedule::rc4-stack-key-ksa-x64
      - id: micro-behaviors/crypto/symmetric/stream/rc4/transform::rc4-prga-swap-xor-x64
      - id: micro-behaviors/crypto/symmetric/stream/rc4/key-schedule::rc4-ksa-swap-loop-x64
      - id: micro-behaviors/crypto/symmetric/stream/rc4/transform::rc4-prga-xor-output-loop-x64
      - id: micro-behaviors/crypto/symmetric/stream/rc4/key-schedule::rc4-ksa-modadd-arm-thumb
      - id: micro-behaviors/crypto/symmetric/stream/rc4/transform::rc4-prga-modadd-arm-thumb
  - id: rc4-symbol-chain
    for: [elf, macho, pe]
    desc: RC4 init and crypt symbol chain
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4/key-schedule::rc4-init-symbol
      - id: micro-behaviors/crypto/symmetric/stream/rc4/transform::rc4-crypt-symbol
  - id: rc4-source-symbol-chain
    desc: RC4 source function pair
    crit: notable
    conf: 0.82
    for: [c, cpp]
    all:
      - id: micro-behaviors/crypto/symmetric/stream/rc4/key-schedule::rc4-init-function-source
      - id: micro-behaviors/crypto/symmetric/stream/rc4/transform::rc4-transform-function-source
  - id: python-rc4-like-stream-cipher
    desc: Python RC4-like stream cipher
    crit: suspicious
    conf: 0.94
    for: [python]
    all:
      - id: metadata/lang/source/syntax/array::python-s-list-range-256
      - id: metadata/lang/source/syntax/array::python-s-index-swap
      - id: micro-behaviors/crypto/symmetric/stream/rc4/transform::python-rc4-prga-xor-output
