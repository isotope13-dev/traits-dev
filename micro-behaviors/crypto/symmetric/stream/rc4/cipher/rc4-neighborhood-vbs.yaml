defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1027,T1140
  mbc: C0027

traits:
  - id: vbs-rc4-keystream-lookup
    desc: VBScript RC4 keystream S-box lookup
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\(\s*\w+\(\w+\)\s*\+\s*\w+\(\w+\)\s*\)\s*Mod\s+(256|&H100)'

composite_rules:
  - id: vbs-rc4-stream-cipher
    desc: VBScript RC4 stream-cipher implementation
    crit: notable
    conf: 0.98
    all:
      - id: vbs-rc4-keystream-lookup
      - id: micro-behaviors/data/control-flow/loop/counted::vbs-byte-range-loop
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::vbs-variable-xor
