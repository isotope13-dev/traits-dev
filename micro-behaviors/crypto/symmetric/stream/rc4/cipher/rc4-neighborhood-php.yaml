# Require both cyclic key-byte access and the modular keystream lookup.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable

composite_rules:
  - id: php-rc4-implementation
    desc: PHP RC4-style stream cipher
    conf: 0.95
    all:
      - id: micro-behaviors/data/string/access::php-cyclic-byte-lookup
      - id: metadata/lang/source/syntax/operator::php-indexed-sum-xor
    near_bytes: 2048
