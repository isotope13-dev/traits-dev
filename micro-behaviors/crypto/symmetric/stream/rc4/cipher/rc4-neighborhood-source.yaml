# Source-level shape of a hand-written RC4 implementation.
#
# The campaign report describes an RC4 implementation whose routine names and
# crypto-library imports were not useful static indicators. These atoms look
# for the algorithm's KSA/PRGA structure instead, so renamed routines and
# language bindings remain detectable without treating the word "RC4" as an
# IOC.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, csharp, go, rust, python, powershell]
  attack: T1027,T1140

composite_rules:
  - id: source-rc4-implementation
    desc: Hand-written RC4-like stream-cipher implementation
    crit: notable
    conf: 0.96
    all:
      - id: metadata/lang/source/syntax/array::array-256-source-context
      - id: metadata/lang/source/syntax/array::indexed-state-update-evidence
      - id: metadata/lang/source/syntax/operator::indexed-xor-evidence

  - id: source-rc4-managed-implementation
    desc: Managed RC4 key scheduling and keystream implementation
    crit: notable
    conf: 0.97
    for: [csharp, powershell]
    all:
      - id: metadata/lang/source/syntax/array::int-array-256-managed
      - id: metadata/lang/source/syntax/array::indexed-value-addition-assignment
      - id: metadata/lang/source/syntax/array::indexed-value-modulo-length
      - id: metadata/lang/source/syntax/array::indexed-expression-modulo-256
      - id: metadata/lang/source/syntax/array::nested-indexed-values-sum
      - id: metadata/lang/source/syntax/array::indexed-modulo-256-lookup
      - id: metadata/lang/source/syntax/operator::indexed-output-xor-variable
    near_bytes: 4096
