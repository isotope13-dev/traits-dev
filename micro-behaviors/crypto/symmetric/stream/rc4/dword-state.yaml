defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  # RC4 can store each S-box byte in a DWORD. Require the two indexed state
  # stores, their summed/masked index, the keystream lookup, and buffer XOR
  # inside a backwards loop. Frame displacement and branch offsets vary.
  # This direction-neutral transform proves neither C2 nor encrypted traffic.
  - id: x86-dword-state-prga-buffer-xor
    desc: RC4 DWORD-state swaps and buffer XOR loop
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '8A C8 8B 44 BC ?? 89 44 B4 ?? 0F B6 C1 89 44 BC ?? 8B 4C B4 ?? 03 C8 81 E1 FF 00 00 80 79 ?? 49 81 C9 00 FF FF FF 41 8A 44 8C ?? 30 04 2B 43 3B DA 72 ??'

  # Another DWORD-state implementation reduces indices with signed division
  # by 256. Require the modulus, state swap, summed-index lookup and buffer
  # XOR in one bounded loop; omit stack offsets and branch displacements.
  # The same routine can encrypt or decrypt; no traffic or intent is inferred.
  - id: x86-dword-state-idiv-prga-buffer-xor
    desc: RC4 DWORD-state swap and buffer XOR loop
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'BB 00 01 00 00 [24-48] 99 F7 F9 [20-32] 99 F7 FE 8A 01 8B F2 8B 94 B5 ?? ?? ?? ?? 89 75 ?? 89 11 8D B4 B5 ?? ?? ?? ?? 0F B6 D0 8B 45 ?? 89 16 8D 34 07 8B 01 03 C2 8B CB 99 F7 F9 8A 84 95 ?? ?? ?? ?? 30 06 47 3B 7D ?? 72 ??'

  # Equivalent DWORD S-box PRGA with a byte temporary in the cipher object.
  # Require the 256 modulus, both indexed state stores, summed-index lookup,
  # and XOR/back edge. Stack displacements and branch distances may vary.
  - id: x86-dword-state-object-temp-prga-buffer-xor
    desc: RC4 DWORD-state PRGA with object byte temporary
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'BB 00 01 00 00 [24-48] 99 F7 F9 [20-32] 99 F7 FE 8B 75 ?? 8A 01 88 86 08 04 00 00 89 55 ?? 8D 84 95 ?? ?? ?? ?? 8B 94 95 ?? ?? ?? ?? 89 11 0F B6 96 08 04 00 00 89 10 8B 45 ?? 8D 34 07 8B 01 03 C2 8B CB 99 F7 F9 8A 84 95 ?? ?? ?? ?? 30 06 47 3B 7D ?? 72 ??'
