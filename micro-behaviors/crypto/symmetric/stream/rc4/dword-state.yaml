defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  # RC4 can store each S-box byte in a DWORD. Require the two indexed state
  # stores, their summed/masked index, the keystream lookup, and buffer XOR
  # inside a backwards loop. Frame displacement and branch offsets vary.
  # This direction-neutral transform proves neither C2 nor encrypted traffic.
  - id: x86-dword-state-prga-buffer-xor
    desc: RC4 DWORD-state swaps and buffer XOR loop
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '8A C8 8B 44 BC ?? 89 44 B4 ?? 0F B6 C1 89 44 BC ?? 8B 4C B4 ?? 03 C8 81 E1 FF 00 00 80 79 ?? 49 81 C9 00 FF FF FF 41 8A 44 8C ?? 30 04 2B 43 3B DA 72 ??'
