# Require both cyclic key-byte access and the modular keystream lookup.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable

traits:
  - id: php-state-sum-xor
    desc: XOR with modular state-sum lookup
    conf: 0.95
    if:
      type: tree-sitter
      kind: binary_op
      regex: '\^\s*\$\w+\[\s*\(\s*\$\w+\[[^]]+\]\s*\+\s*\$\w+\[[^]]+\]\s*\)\s*%\s*256\s*\]'

composite_rules:
  - id: php-rc4-implementation
    desc: PHP RC4-style stream cipher
    conf: 0.95
    all:
      - id: micro-behaviors/data/string/access::php-cyclic-byte-lookup
      - id: php-state-sum-xor
    near_bytes: 2048
