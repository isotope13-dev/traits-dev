defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  # Byte state, signed modulo reduction, two state writes, summed-state
  # lookup, and XOR into the input buffer. No key or caller address is fixed.
  - id: x86-byte-state-signed-mask-prga
    desc: RC4 byte-state swaps and buffer XOR
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '8A 1C 06 88 54 24 ?? 88 1C 01 8B 5C 24 ?? 88 14 06 33 D2 8A 14 01 81 E3 FF 00 00 00 03 D3 81 E2 FF 00 00 80 79 ?? 4A 81 CA 00 FF FF FF 42 8A 14 02 8A 1C 2F 32 DA 8B 54 24 ?? 88 1C 2F 47 3B FA 72 ??'
