# RC4 and its key schedule, identified by the routine's own name.
#
# The sibling rules here match RC4 by its generated code -- the S-box init, the
# swap loop, the PRGA XOR. Those are codegen-specific and miss a compiler or a
# hand-written variant that lays the same algorithm out differently; none of
# them fire on the XCSSET roothelper, which ships an unstripped `arc4`. A
# binary that names the routine is telling us what it is regardless of how it
# compiled, which is the angle that survives a rebuild.
#
# Neutral alone: RC4 is obsolete but not malicious, and still turns up in
# protocol and legacy-format code. The objectives supply what is done with the
# plaintext.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, dylib, so, dll]
  crit: notable
  conf: 0.9
  mbc: C0031

traits:
  # `arc4` is RC4's other name; a routine carrying it is the cipher itself
  # rather than a caller of a library. Matched as `symbol` rather than
  # `function` because the same routine is a function in an ELF and an export
  # in a Mach-O, and the cipher is the same either way.
  - id: arc4-routine-symbol
    desc: Binary defines an arc4 cipher routine
    if:
      type: symbol
      regex: '^_?(arc4|rc4)(_?(crypt|encrypt|decrypt|init|ksa|prga))?$'

  # A routine named for key derivation. Component: a name establishes no
  # behavior on its own, and earns weight only beside the cipher and whatever
  # the key is derived from.
  - id: key-derivation-routine-symbol
    desc: Binary defines a key derivation routine
    crit: notable
    conf: 0.8
    if:
      type: symbol
      regex: '^_?key(_with_[a-z]+)?$'
