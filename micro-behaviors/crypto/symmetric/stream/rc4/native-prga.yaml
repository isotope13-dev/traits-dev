defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-rc4-prga-buffer-transform
    desc: RC4 state swaps and buffer XOR loop
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '8A 91 00 01 00 00 4D 2B D8 [0-110] 43 8A 14 11 0F B6 C1 42 8A 0C 10 43 88 0C 11 [0-90] 43 32 0C 03 41 88 08'

  # Byte-wrapped i/j, a state swap, S[S[i]+S[j]], and XOR into the buffer.
  # Register allocation is a compiler variant; no key or address is required.
  - id: x64-stack-index-prga-buffer-xor
    desc: RC4 stack-indexed state swaps and buffer XOR
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '41 8D 50 01 44 0F B6 C2 0F B6 D2 0F B6 04 14 42 8D 0C 10 44 0F B6 D1 0F B6 C9 44 0F B6 1C 0C 44 88 1C 14 88 04 0C 02 04 14 0F B6 C0 0F B6 04 04 41 30 01 49 83 C1 01 4C 39 CB 75 ??'
