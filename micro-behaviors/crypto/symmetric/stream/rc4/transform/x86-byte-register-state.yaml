defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-byte-register-state-prga
    desc: RC4 byte-index swap and buffer XOR
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: any
      # AL and DL wrap at 256; the two table entries are swapped before
      # S[S[i]+S[j]] is XORed into the advancing output buffer.
      pattern: 'FE C0 0F B6 C0 0F B6 1C 07 00 DA 0F B6 D2 8A 3C 17 88 3C 07 88 1C 17 00 FB 0F B6 DB 8A 1C 1F 30 1E 46 49 EB ??'
