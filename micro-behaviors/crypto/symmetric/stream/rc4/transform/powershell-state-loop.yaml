defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
traits:
  - id: powershell-rc4-like-state-xor-loop
    desc: PowerShell RC4-style byte-state XOR loop
    conf: 0.94
    if:
      # Ordered PRGA operations within one short source region; double %
      # accepts a Ruby-format template. No key or variable name is required.
      type: yara
      source: |
        rule powershell_rc4_like_state_xor_loop {
          strings:
            $increment = /\$\w+\s*=\s*\(\$\w+\s*\+\s*1\)\s*%%?\s*256\s*;/
            $accumulate = /\$\w+\s*=\s*\(\$\w+\s*\+\s*\$\w+\[\$\w+\]\)\s*%%?\s*256\s*;/
            $swap = /\$\w+\[\$\w+\]\s*=\s*\$\w+\s*;/
            $sum = /\(\$\w+\[\$\w+\]\s*\+\s*\$\w+\[\$\w+\]\)\s*%%?\s*256/
            $xor = /-bxor\s+\$\w+\[\$\w+\]/ nocase
          condition:
            for any i in (1..#increment) : (
              for any a in (1..#accumulate) : (
                @accumulate[a] > @increment[i] and
                @accumulate[a] < @increment[i]+160 and
                $swap in (@accumulate[a]..@accumulate[a]+260) and
                $sum in (@accumulate[a]..@accumulate[a]+400) and
                $xor in (@accumulate[a]..@accumulate[a]+600)
              )
            )
        }
