defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
traits:
  - id: x64-stack-byte-state-prga
    desc: RC4 stack-state swaps and buffer XOR
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '88 44 34 ?? 40 88 7C 0C ?? 02 54 34 ?? 0F B6 D2 8A 44 14 ?? 41 30 40 FF 49 FF C0 41 39 D9 7C ??'

  # Byte-wrapped indices, S[i]/S[j] swap, S[S[i]+S[j]], then in-place XOR.
  # Stack displacements and branch offsets may vary; no key is embedded.
  - id: x64-stack-displaced-byte-prga
    desc: RC4 stack-state swaps and in-place XOR
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '8D 57 01 0F B6 FA 0F B6 D2 8A 84 14 ?? ?? ?? ?? 8D 0C 30 0F B6 F1 0F B6 C9 44 8A 84 0C ?? ?? ?? ?? 44 88 84 14 ?? ?? ?? ?? 49 89 D8 88 84 0C ?? ?? ?? ?? 02 84 14 ?? ?? ?? ?? 0F B6 C0 8A 84 04 ?? ?? ?? ?? 30 44 1D 00 48 FF C3 49 39 DF 75 ??'
