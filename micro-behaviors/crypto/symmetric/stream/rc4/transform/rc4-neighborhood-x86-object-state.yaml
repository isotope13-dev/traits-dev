# RC4 PRGA with byte indices stored after the 256-byte permutation.
# No key, caller address, or specimen identifier is fixed.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: x86-object-byte-state-prga
    desc: x86 RC4 byte-state generator
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: 'FE 87 00 01 00 00 0F B6 B7 00 01 00 00 8A 04 3E 00 87 01 01 00 00 0F B6 97 01 01 00 00 8A 0C 3E 8A 04 3A 88 04 3E 88 0C 3A 0F B6 87 01 01 00 00 0F B6 0C 38 0F B6 87 00 01 00 00 0F B6 04 38 03 C8 0F B6 C1 8A 04 38'
