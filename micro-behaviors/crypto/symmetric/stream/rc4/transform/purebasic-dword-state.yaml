defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

traits:
  # PureBasic uses DWORD permutation entries and stack temporaries. Require
  # both swap stores, the S[S[i]+S[j]] lookup and byte-buffer XOR, rather than
  # the generic 256-element initialization alone. This routine is bidirectional.
  - id: x86-purebasic-dword-prga-buffer-xor
    desc: RC4 DWORD permutation and buffer XOR
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .code
      pattern: 'C1 E3 02 FF 74 1D 00 58 89 44 24 ?? [0-32] 58 89 44 1D 00 FF 74 24 ?? [0-16] 58 89 44 1D 00 8B 5C 24 ?? C1 E3 02 8B 5C 1D 00 8B 7C 24 ?? C1 E7 02 8B 7C 3D 00 81 E7 FF 00 00 00 01 FB 81 E3 FF 00 00 00 [0-24] 0F BE 5D 00 33 5C 24 ?? [0-12] 88 45 00'
