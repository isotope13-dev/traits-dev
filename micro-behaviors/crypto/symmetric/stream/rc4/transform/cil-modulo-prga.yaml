# RC4 PRGA: state-index sum modulo 256 selects a keystream byte, which
# is XORed into the data array. Local slots and metadata tokens may vary.
defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.96
traits:
  - id: cil-modulo-byte-prga-xor
    desc: CIL RC4 modulo-indexed keystream XOR
    # Named-section hex matching selects only one duplicate section. YARA
    # binds the opcode idiom to any executable section of a CLR PE instead.
    if:
      type: yara
      source: |
        import "pe"
        rule cil_modulo_byte_prga_xor {
          strings:
            $prga = { (06|07|08|09|11 ??) 91
                      (06|07|08|09|11 ??) (06|07|08|09|11 ??) 91
                      58 20 00 01 00 00 (5D|5E) 91
                      (02|03|04|05|0E ??) (06|07|08|09|11 ??) 91 61 9C }
          condition:
            pe.data_directories[14].virtual_address != 0 and
            for any s in pe.sections : (
              s.characteristics & pe.SECTION_MEM_EXECUTE != 0 and
              $prga in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
            )
        }
