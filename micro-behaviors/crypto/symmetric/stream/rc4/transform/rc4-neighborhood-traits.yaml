defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
  mbc: C0027
  attack: T1573
  size_max: 52428800
traits:
  - id: rc4-prga-xor-buffer-loop-i386
    desc: RC4 PRGA XOR buffer loop (i386)
    crit: notable
    for:
      - elf
      - pe
    if:
      type: hex
      section: .text
      pattern: 0F B6 02 88 03 89 F0 88 02 8B 55 ?? 02 0B 0F B6 C9 0F B6 04 0A 8B 55 ?? 30 04 ?? 83 C7 01 3B 7D
        ?? 75
  - id: rc4-prga-swap-xor-x64
    desc: RC4 PRGA swap XOR (x64)
    crit: notable
    conf: 0.9
    arch: [x86-64]
    for: [elf, pe]
    if:
      type: hex
      section: .text
      pattern: 44 0F B6 0C 13 45 0F B6 C1 44 01 C9 [0-48] 41 0F B6 00 44 88 0A [0-24] 30 10 48 83 C0 01 49 39
        C4 75
  # ARM Thumb (ARMv7 IoT loaders). The invariant core of both RC4 loops is
  # the modular-index chain `j += S[i]` — load a table byte at a register
  # offset, add it, mask the sum back to a byte (`ldrb rA,[rB,rC]; add;
  # uxtb` = 5Cxx, 44xx, B2xx). The KSA continues into the S-box swap store
  # (`strb rD,[rB,rC]` = 54xx); the PRGA reloads the keystream byte with a
  # second register-offset ldrb.
  - id: rc4-prga-modadd-arm-thumb
    desc: RC4 PRGA modular-add chain (ARM Thumb)
    crit: notable
    conf: 0.88
    arch: [arm]
    for: [elf]
    if:
      type: hex
      section: .text
      pattern: "?? 5C ?? 44 ?? B2 ?? 5C"
  # Optimisation and compiler choices change register allocation and the
  # exact RC4 byte sequence. These atoms retain the invariant operations of
  # the KSA/PRGA rather than looking for a routine name or a published key.
  - id: rc4-prga-xor-output-loop-x64
    desc: RC4-like state XOR output loop (x64)
    crit: notable
    conf: 0.82
    arch: [x86-64]
    for: [elf, pe]
    if:
      type: hex
      section: .text
      pattern: 25 FF 00 00 00 [0-256] 0F B6 ?? [0-128] 0F B6 ?? [0-128] 31 ?? 89 ?? 88 ?? 48 83 ?? ?? 01
        [0-64] 0F 82
  - id: rc4-decode-function
    desc: RC4 decode function reference
    crit: notable
    conf: 0.75
    if:
      type: symbol
      exact: rc4_decode
    for: [elf, macho, pe]
  - id: rc4-crypt-symbol
    desc: RC4 stream transform symbol
    crit: notable
    conf: 0.9
    if:
      type: symbol
      regex: (?i)(rc4crypt__|arc4_crypt)
    for: [elf, macho, pe]
  - id: rc4-crypt-function-symbol
    desc: RC4 transform routine reference
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: rc4_crypt
    for: [elf, macho, pe, c, cpp]
  - id: rc4-transform-function-source
    desc: RC4 transform call source
    crit: component
    conf: 0.78
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: rc4
  - id: python-rc4-prga-xor-output
    desc: Python RC4 PRGA XOR output
    crit: notable
    conf: 0.88
    for: [python]
    if:
      type: text
      # Whitespace-tolerant form of `^S[(S[i]+S[j])&255]`: the same PRGA
      # output XOR written with normal Python spacing and either a modulo
      # or a mask of the keystream index.
      regex: '\^\s*S\s*\[\(\s*S\[i\]\s*\+\s*S\[j\]\s*\)\s*[%&]'
  # VB6 p-code RC4 pseudo-random generation algorithm (PRGA):
  # `i = (i + 1) Mod 256` (`6C ?? ?? F5 01 00 00 00 AA F5 00 01 00 00 C2 71 ?? ??`),
  # `j = (j + S(i)) Mod 256` (`AA F5 00 01 00 00 C2 71 ?? ??`), S-box swap (`A2 ... A2`),
  # and keystream lookup `(S(i) + S(j)) Mod 256` with XOR (`FB 12` / `C9`).
  - id: rc4-prga-xor-loop-vb6-pcode
    desc: RC4 PRGA XOR loop (VB6 p-code)
    crit: notable
    conf: 0.96
    for: [pe]
    if:
      type: hex
      section: .text
      pattern: '6C ?? ?? F5 01 00 00 00 AA F5 00 01 00 00 C2 71 ?? ?? [0-24] AA F5 00 01 00 00 C2 71 ?? ?? [0-48] A2 [0-24] A2 [0-32] (A9 F3 00 01 C1 | AA F5 00 01 00 00 C2) [0-16] (FB 12 | C9)'
