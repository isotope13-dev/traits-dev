defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: python-rc4-md5-http-profile
    desc: RC4 and MD5 accompany HTTP POST
    crit: suspicious
    conf: 0.94
    all:
      - id: python-arc4-new-call
      - id: micro-behaviors/crypto/hash/digest/md5::python-md5-digest
      - id: micro-behaviors/communications/http/request/body/construction::http-upload-or-body-sink
