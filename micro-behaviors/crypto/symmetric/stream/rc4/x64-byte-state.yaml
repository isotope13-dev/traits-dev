defaults:
  platforms: [windows, linux]
  for: [pe, elf]
  arch: [x86-64]
  crit: notable
traits:
  # Byte-indexed state exchange, key-index wrap, and all 256 KSA steps.
  # Addresses, key material and branch displacements are deliberately absent.
  - id: x64-byte-index-ksa
    desc: RC4 byte-indexed key schedule loop
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '41 01 F2 41 0F B6 F2 8A 1C 31 42 88 1C 09 44 88 1C 31 48 FF C0 4C 39 C0 41 BB 00 00 00 00 49 0F 44 C3 49 FF C1 49 81 F9 00 01 00 00 75 ??'
  # Swap S[i]/S[j], index S[S[i]+S[j]], XOR input and advance output.
  - id: x64-byte-index-prga
    desc: RC4 byte-state swaps and buffer XOR
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '44 88 34 31 88 1C 39 02 1C 31 0F B6 F3 8A 1C 31 43 32 1C 18 42 88 1C 1A 49 FF C3 4D 39 D9 75 ??'
