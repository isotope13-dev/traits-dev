defaults:
  platforms: [windows, linux, macos]
  for: [binaries]
composite_rules:
  - id: go-short-name-stream-crypto-profile
    desc: Go stream crypto short-name clues
    crit: notable
    conf: 0.92
    all:
      - id: metadata/binary/symbols/name/function::go-short-package-and-receiver-methods
      - id: metadata/binary/symbols/name/qualified/security::go-crypt-routine-name
      - id: micro-behaviors/crypto/key/generate::go-pointer-keygen-method
    any:
      - id: micro-behaviors/crypto/symmetric/stream/sigma::chacha-salsa-constant
      - id: micro-behaviors/crypto/symmetric/stream/reference::go-short-package-xor-keystream-reference
      - id: micro-behaviors/data/bitwise/xor-forms/state::arm-xorshift64-byte-stream
