# RC4-style state swaps, but the keystream lookup is S[i+j], not
# RC4's S[S[i]+S[j]]. Do not identify this modified cipher as standard RC4.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-index-sum-stream-xor
    desc: Stream cipher with index-sum output
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '(41 8D 51 01 44 0F B6 CA 0F B6 D2 0F B6 1C 11 42 8D 04 13 44 0F B6 D0 0F B6 C0 0F B6 34 01 40 88 34 11 88 1C 01 43 8D 04 11 0F B6 C0 0F B6 04 01 41 30 00 49 83 C0 01 4D 39 D8 75 ?? | 41 8D 49 01 44 0F B6 C9 0F B6 C9 44 0F B6 1C 08 43 8D 14 13 44 0F B6 D2 0F B6 D2 0F B6 1C 10 88 1C 08 44 88 1C 10 43 8D 14 11 0F B6 D2 0F B6 14 10 41 30 10 49 83 C0 01 4D 39 C7 75 ??)'
