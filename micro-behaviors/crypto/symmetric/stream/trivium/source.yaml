defaults:
  for: [c]
  platforms: [unix, windows]
  crit: component
traits:
  - id: register-one-feedback
    desc: Trivium first nonlinear feedback taps
    if:
      type: text
      regex: '\[90\]\s*&\s*\w+\[91\]\)\s*\^\s*\w+\[170\]'
  - id: register-two-feedback
    desc: Trivium second nonlinear feedback taps
    if:
      type: text
      regex: '\[174\]\s*&\s*\w+\[175\]\)\s*\^\s*\w+\[263\]'
  - id: register-three-feedback
    desc: Trivium third nonlinear feedback taps
    if:
      type: text
      regex: '\[285\]\s*&\s*\w+\[286\]\)\s*\^\s*\w+\[68\]'
composite_rules:
  - id: nonlinear-feedback
    desc: Implements Trivium nonlinear register feedback
    crit: notable
    near_lines: 8
    all:
      - id: register-one-feedback
      - id: register-two-feedback
      - id: register-three-feedback
