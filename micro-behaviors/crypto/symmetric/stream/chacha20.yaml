# ChaCha20 stream-cipher operations used by source and native artifacts.
# The algorithm name alone is too broad; these match call/API-shaped uses so
# prose, documentation, and unrelated descriptions do not become evidence.
defaults:
  platforms: [unix, windows]
  for: [source, binaries]

traits:
  - id: chacha20-cipher-call
    desc: ChaCha20 encryption or stream operation call
    crit: notable
    conf: 0.9
    for: [c, cpp, rust, go, elf, macho, pe, dll]
    if:
      type: symbol
      kind: call
      regex: '(?i)^(chacha20|chacha20[-_](xor|crypt|encrypt|decrypt|stream))$'

  - id: chacha20-api-operation
    desc: ChaCha20 API operation in source
    crit: notable
    conf: 0.88
    for: [source, scripts]
    if:
      type: text
      regex: '(?i)\bchacha20([.:_](new|xor|crypt|encrypt|decrypt|apply_keystream|stream))\s*[(:.]'

composite_rules:
  - id: chacha20-cipher-operation
    desc: ChaCha20 stream-cipher operation
    crit: notable
    conf: 0.92
    any:
      - id: chacha20-cipher-call
      - id: chacha20-api-operation
