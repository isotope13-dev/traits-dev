# Key/encoded-data declarations are neutral crypto configuration evidence.
# They do not identify executable content or establish concealment intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
composite_rules:
  - id: named-large-ciphertext-blob
    desc: Large encoded literal assigned to a ciphertext variable
    crit: component
    near_lines: 6
    all:
      - id: metadata/file/encoded::large-base64-like-literal
    any:
      - id: micro-behaviors/crypto/symmetric/ciphertext::js-ciphertext-const
      - id: micro-behaviors/crypto/symmetric/ciphertext::js-encrypted-text-const
      - id: micro-behaviors/crypto/symmetric/ciphertext::py-ciphertext-const
      - id: micro-behaviors/crypto/symmetric/ciphertext::py-encrypted-text-const
  - id: ciphertext-blob-present
    desc: Explicitly named or structured ciphertext blob
    crit: component
    any:
      - id: metadata/file/encoded::aes-gcm-triplet-blob
      - id: micro-behaviors/crypto/symmetric/ciphertext::named-large-ciphertext-blob
