# Placeholder keys and constructor references do not establish HTTP C2.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, go]
traits:
  - id: change-this-key-literal
    desc: Literal change_this_key string
    crit: notable
    conf: 0.85
    if:
      type: text
      exact: change_this_key

  - id: aes-key-field-token
    desc: AES or generic key field name
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)\b(aes[_-]?key|encryptionKey|encrypt_key|secret_key|crypto_key)\b'

composite_rules:
  - id: sequential-hex-byte-key-slice
    for: [elf, macho, pe, wasm, go]
    desc: AES constructor near sequential-key reference
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/crypto/symmetric/key::sequential-placeholder-key
      - id: micro-behaviors/crypto/symmetric/aes/initialize::go-new-cipher-string
    near_bytes: 120

  - id: change-this-key-placeholder
    desc: Placeholder key near crypto-key field
    crit: notable
    conf: 0.95
    all:
      - id: change-this-key-literal
      - id: aes-key-field-token
    near_bytes: 80

  - id: sequential-hex-aes-decryptor
    for: [elf, macho, pe, wasm, go]
    desc: AES constructor with placeholder-key refs
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/crypto/symmetric/aes/initialize::go-new-cipher-string
    any:
      - id: micro-behaviors/crypto/symmetric/key::sequential-placeholder-key
      - id: sequential-hex-byte-key-slice
    near_bytes: 2048

  - id: sequential-hex-aes-c2-backdoor
    for: [elf, macho, pe, go]
    desc: AES/key references alongside HTTP GET
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/symmetric/aes/initialize::go-new-cipher-string
      - id: micro-behaviors/communications/http/get::http-get
    any:
      - id: micro-behaviors/crypto/symmetric/key::sequential-placeholder-key
      - id: sequential-hex-byte-key-slice
      - id: sequential-hex-aes-decryptor

  - id: sequential-hex-aes-remote-shell
    for: [elf, macho, pe, go]
    desc: AES/HTTP key context with command APIs
    crit: notable
    conf: 0.99
    all:
      - id: sequential-hex-aes-c2-backdoor
    any:
      - id: micro-behaviors/process/create/exec::go-exec-command-call
      - id: micro-behaviors/process/fd/stdio::go-command-output-capture
      - id: micro-behaviors/fs/path/application/executable::cmd-exe-image-name
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
    near_bytes: 12000

  - id: placeholder-key-remote-agent
    desc: Placeholder-key, HTTP and command API refs
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/request/client::https-request
      - id: change-this-key-placeholder
    any:
      - id: micro-behaviors/process/create/shell/local::node-exec-command-variable
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
    near_bytes: 12000

