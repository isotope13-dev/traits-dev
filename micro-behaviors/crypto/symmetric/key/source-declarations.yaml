# Key/encoded-data declarations are neutral crypto configuration evidence.
# They do not identify executable content or establish concealment intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
traits:
  - id: js-passphrase-literal-const
    desc: Literal KEY/PASSPHRASE declaration
    crit: component
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?im)^(const|let|var) +(KEY|PASSPHRASE) *= *["''][^"'']{6,80}["'']'
  - id: js-decryption-key-name
    desc: Decryption key identifier
    crit: component
    conf: 0.75
    for: [javascript, typescript]
    if:
      type: text
      word: DECRYPTION_KEY
      case_insensitive: true
  - id: js-cipher-key-name
    desc: Cipher key identifier
    crit: component
    conf: 0.75
    for: [javascript, typescript]
    if:
      type: text
      word: CIPHER_KEY
      case_insensitive: true
  - id: js-crypto-key-name
    desc: Crypto key identifier
    crit: component
    conf: 0.75
    for: [javascript, typescript]
    if:
      type: text
      word: CRYPTO_KEY
      case_insensitive: true
  - id: js-secret-key-name
    desc: Secret key identifier
    crit: component
    conf: 0.75
    for: [javascript, typescript]
    if:
      type: text
      word: SECRET_KEY
      case_insensitive: true
