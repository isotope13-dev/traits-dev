# Symmetric key material lifted from a configuration field.
#
# Seeding a block cipher with the PrivateKey a config file already carries
# means the ciphertext travels without a key of its own: whoever hands the
# target the config also hands over everything needed to open the payload,
# and nothing key-shaped has to be embedded in the program. Neutral on its
# own — objective composites add the payload and execution context.
defaults:
  platforms: [windows, linux, macos]
  for: [source, scripts]
  crit: notable
  conf: 0.9
  mbc: C0027
  attack: T1573.001

traits:
  - id: symmetric-key-from-private-key-field
    desc: Block cipher keyed from a PrivateKey field
    if:
      type: text
      regex: '(NewCipher|AESGCM|AesGcm)\(\s*[\w.]{0,32}[Pp]rivate[Kk]ey'
