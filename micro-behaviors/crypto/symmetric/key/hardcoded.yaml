# Static symmetric key material is a capability.  The paired assignment
# composite is intentionally language-agnostic and does not depend on a
# particular vendor key or implementation library.
defaults:
  platforms: [windows, unix, android]
  for: [source, scripts]
  crit: suspicious
  conf: 0.92
  mbc: C0021
  attack: T1027

traits:
  - id: aes-key-hex-assignment
    desc: AES key assigned as hex constant
    if:
      type: text
      regex: (?i)\bAES[_-]?KEY\b\s*=\s*[\s\S]{0,48}\b[0-9a-f]{32,64}\b
    unless:
      - id: well-known/lib/crypto/libsignal::libsignal-source-context
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
    crit: notable
  - id: aes-iv-hex-assignment
    desc: AES IV assigned as hex constant
    crit: notable
    if:
      type: text
      regex: '(?i)\bAES[_-]?IV\b\s*=\s*[\s\S]{0,48}\b[0-9a-f]{32,64}\b'
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component

composite_rules:
  - id: static-aes-key-and-iv
    desc: Static AES key and IV assignments
    crit: suspicious
    conf: 0.96
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
    all:
      - id: aes-key-hex-assignment
      - id: aes-iv-hex-assignment
