# Key/encoded-data declarations are neutral crypto configuration evidence.
# They do not identify executable content or establish concealment intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
composite_rules:
  - id: hardcoded-key-with-large-blob
    desc: Literal key/passphrase with encoded data
    crit: notable
    conf: 0.97
    near_lines: 80
    any:
      - id: micro-behaviors/crypto/symmetric/key::js-passphrase-literal-const
      - id: micro-behaviors/data/source/syntax/credential::python-secret-literal-assignment
    all:
      - id: micro-behaviors/crypto/symmetric/ciphertext::ciphertext-blob-present
