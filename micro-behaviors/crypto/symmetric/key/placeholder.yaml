# Placeholder-looking symmetric key material is neutral by itself. Objective
# composites add cipher use and remote-tasking context before inferring intent.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, go]

traits:
  - id: sequential-placeholder-key
    desc: Sequential placeholder assigned to key
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(aes[_-]?key|key)\s*[:=]\s*["'']0123456789abcdef["'']'
