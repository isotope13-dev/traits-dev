# Symmetric key material derived directly from a short character string rather
# than a key-derivation function. `aes.Key = Encoding.ASCII.GetBytes(k)` turns a
# literal/const string straight into raw key bytes -- the hallmark of a payload
# decryptor that ships its key, as opposed to PBKDF2/Rfc2898 derivation. The
# reference is neutral; crypto composites add the mode/decryptor context.
defaults:
  platforms: [windows]
  for: [csharp, pe, dll]
  crit: notable
  conf: 0.85
  mbc: C0027

traits:
  - id: dotnet-symmetric-key-from-string-bytes
    desc: Symmetric key from ASCII/UTF8 string bytes
    if:
      type: text
      regex: '\.Key\s*=\s*Encoding\.[A-Za-z0-9_]+\.GetBytes\s*\('
