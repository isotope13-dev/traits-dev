defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
traits:
  - id: python-key-bytes-assignment
    desc: Assigns literal key or secret bytes
    if:
      type: text
      regex: '(?i)\b[_a-z]*(key|secret)[_a-z]*\s*=\s*b["''](\\x[0-9a-f]{2}){16,}["'']'
  - id: hardcoded-iv-bytes
    desc: Hardcoded IV in Python byte string
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(^|[^a-z])iv([_a-z]*)\s*=\s*b"(\\x[0-9a-fA-F]{2}){16,}"'
composite_rules:
  - id: hardcoded-key-material
    desc: Static key or IV byte string
    crit: notable
    conf: 0.9
    any:
      - id: python-key-bytes-assignment
      - id: hardcoded-iv-bytes
