# A JSON "key" field whose value is 64 hex characters is a 256-bit symmetric
# key carried in configuration or a test vector.
#
# Relocated from well-known/malware/rat/sparkrat/, where the same matcher was
# named "SparkRAT hex key JSON field" and reported that family on any JSON
# holding a 32-byte key -- Go's own crypto/hpke/testdata vectors, for one.
# The SparkRAT config composite references this atom and supplies the
# family-specific fields (module path, backups/uuid/secure-host shape).
defaults:
  platforms: [windows, unix]
  for: [json, text, pe, elf, macho, go]
  crit: notable
  conf: 0.9
  mbc: C0021

traits:
  - id: json-hex-key-field
    desc: JSON key field holds 256-bit hex value
    if:
      type: text
      regex: '\\?"key\\?"\s*:\\?\s*\\?"[0-9a-f]{64}\\?"'
