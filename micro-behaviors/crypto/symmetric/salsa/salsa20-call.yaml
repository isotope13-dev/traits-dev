defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: salsa20-stream-cipher-call
    desc: Salsa20 stream-cipher call
    crit: notable
    conf: 0.9
    for: [binaries, scripts, source]
    if:
      type: text
      regex: '(?i)\b(s20_crypt|salsa20(_crypt)?|salsa_crypt)\s*\('

  - id: xsalsa20-stream-cipher-call
    desc: XSalsa20 stream-cipher call text
    crit: notable
    conf: 0.9
    for: [binaries, scripts, source]
    if:
      type: text
      regex: '(?i)\bcrypto_stream_xsalsa20[a-z0-9_]*\s*\('
