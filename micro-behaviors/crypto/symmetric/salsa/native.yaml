# Quarterround: add/rotate/XOR with rotations 7, 9, 13 and 18 (ROR 14).
# This records a cipher implementation, not file encryption or extortion.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
- id: x86-salsa-quarterround
  desc: Native Salsa cipher quarterround implementation
  crit: notable
  conf: 0.97
  if:
    type: hex
    section: text
    pattern: '03 C7 C1 C0 07 33 F0 8B 44 24 ?? 03 C6 89 74 24 ?? C1 C0 09 31 44 24 ?? 8B 44 24 ?? 03 C6 8B 74 24 ?? C1 C0 0D 33 F8 8B 44 24 ?? 03 C7 89 7C 24 ?? C1 C8 0E 31 44 24 ??'
