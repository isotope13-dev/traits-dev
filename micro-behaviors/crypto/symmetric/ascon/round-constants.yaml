# Ascon (NIST SP 800-232 lightweight AEAD) adds one byte per permutation
# round from a fixed 12-entry table, f0 e1 d2 ... 4b. Implementations keep it
# as a byte array, so the table identifies the cipher in stripped code.
# Lightweight AEAD suits IoT bots that encrypt C2 without a TLS stack.
defaults:
  platforms: [unix, windows, android]
  for: [elf, macho, pe, dll]
traits:
  - id: ascon-round-constant-table
    desc: Embeds Ascon permutation round constants
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: rodata
      pattern: 'F0 E1 D2 C3 B4 A5 96 87 78 69 5A 4B'
