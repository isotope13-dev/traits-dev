defaults:
  platforms: [windows]
  for: [pe]
  mbc: C0021

traits:
  # PyInstaller's PYZ table retains this module name even when the importing
  # bytecode is encrypted inside its CArchive and unavailable to source rules.
  - id: pyinstaller-pycrypto-aes-module
    desc: PyInstaller archive bundles AES module
    crit: notable
    conf: 0.97
    if:
      type: text
      exact: Crypto.Cipher.AES)
