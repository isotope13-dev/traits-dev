defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
  mbc: C0068

traits:
  - id: js-aes-inverse-sbox-table
    desc: JavaScript AES inverse S-box table
    conf: 0.94
    if:
      type: text
      word: SBOX_INV
  - id: js-aes-inverse-mix-columns
    desc: JavaScript AES inverse mix-columns routine
    conf: 0.94
    if:
      type: text
      word: invMixColumns
  - id: js-aes-inverse-gf-multiplier
    desc: JavaScript AES inverse multiplier table
    conf: 0.94
    if:
      type: text
      word: MUL0E
  - id: js-aes-inv-key-schedule
    desc: JavaScript AES inverse key schedule table
    conf: 0.95
    if:
      type: text
      word: invKeySchedule

composite_rules:
  - id: js-handwritten-aes-decrypt
    desc: JavaScript handwritten AES inverse transform
    conf: 0.97
    all:
      - id: js-aes-inverse-sbox-table
      - id: js-aes-inverse-mix-columns
      - id: js-aes-inverse-gf-multiplier
