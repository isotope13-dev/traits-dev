# Java/Kotlin AES API usage.  The mode is recorded separately so protocol
# composites can distinguish a generic cipher reference from ECB framing.
defaults:
  crit: notable
  platforms: [android, unix, windows]
  for: [java, kotlin, class]

traits:
  - id: java-aes-gcm-mode
    desc: Java AES GCM cipher mode
    conf: 0.92
    if:
      type: text
      regex: 'Cipher\.getInstance\s*\(\s*["\x27]AES\s*/\s*GCM|\bAES/GCM/NoPadding\b'

  - id: java-aes-cbc-mode
    desc: Java AES CBC cipher mode
    conf: 0.92
    if:
      type: text
      regex: '\bAES/CBC\b'
