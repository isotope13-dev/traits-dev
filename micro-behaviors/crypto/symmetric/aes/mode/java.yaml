# Java/Kotlin AES API usage.  The mode is recorded separately so protocol
# composites can distinguish a generic cipher reference from ECB framing.
defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin, class, apk, zip]
  mbc: C0021

traits:
  - id: java-aes-cipher-api
    desc: Java AES cipher API
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'Cipher\.getInstance\s*\(\s*["\x27]AES'

  - id: java-aes-ecb-mode
    desc: Java AES ECB cipher mode
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'Cipher\.getInstance\s*\(\s*["\x27]AES\s*/\s*ECB'

  - id: java-aes-gcm-mode
    desc: Java AES GCM cipher mode
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'Cipher\.getInstance\s*\(\s*["\x27]AES\s*/\s*GCM|\bAES/GCM/NoPadding\b'
