defaults:
  platforms:
  - unix
  - windows
  for:
  - pe
  - csharp
traits:
- crit: notable
  conf: 0.9
  id: aes-ecb-cbc-name
  desc: AES ECB/CBC algorithm name reference
  if:
    type: text
    regex: ^aes_(128|192|256)_(ecb|cbc)$
- crit: notable
  conf: 0.9
  id: aes-ofb-ctr-name
  desc: AES OFB/CTR algorithm name reference
  if:
    type: text
    regex: ^aes_(128|192|256)_(ofb|ctr)$
- crit: notable
  conf: 0.9
  id: aes-ccm-gcm-name
  desc: AES CCM/GCM algorithm name reference
  if:
    type: text
    regex: ^aes_(128|192|256)_(ccm|gcm)$
- crit: notable
  conf: 0.9
  id: aes-xts-wrap-name
  desc: AES XTS/wrap algorithm name reference
  if:
    type: text
    regex: ^aes_(128|192|256)_(xts|wrap)$
