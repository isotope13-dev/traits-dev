defaults:
  platforms: [windows, unix]
  for: [python]
composite_rules:
  - id: pycrypto-cbc-utility-references
    desc: AES-CBC APIs and utility names
    crit: notable
    conf: 0.9
    all:
      - id: metadata/package/dependencies/crypto::pycrypto-aes-references
      - id: micro-behaviors/crypto/symmetric/aes/mode::pycrypto-aes-cbc-mode
      - id: micro-behaviors/data/codec::python-pad-unpad-symbols
      - id: micro-behaviors/crypto/cipher/unspecified::python-encrypt-decrypt-names
