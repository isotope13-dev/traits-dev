# An enc/AES-CBC argument pair does not identify the executable or direction.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: openssl-enc-aes-cbc-argv
    desc: AES-CBC enc argument pair
    if:
      type: text
      regex: '[''"]enc[''"]\s*,\s*[''"]-aes-(128|192|256)-cbc[''"]'
