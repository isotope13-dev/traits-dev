# OpenSSL enc selects an AES-CBC cipher through an argument vector.
# This records cipher selection; a later -d can change the direction.
# Command vocabulary survives wrapper, language and executable renaming.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: openssl-enc-aes-cbc-argv
    desc: OpenSSL AES-CBC cipher argument vector
    if:
      type: text
      regex: '[''"]enc[''"]\s*,\s*[''"]-aes-(128|192|256)-cbc[''"]'
