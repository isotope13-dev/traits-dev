defaults:
  platforms: [windows]
  for: [pyc]

composite_rules:
  - id: pyc-aes-cbc-name-cluster
    desc: Python bytecode contains AES, CBC, and Cipher names
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/crypto/library/keyword::aes-keyword
      - id: micro-behaviors/crypto/symmetric/config::pyc-cbc-mode-name
      - id: micro-behaviors/crypto/library/keyword::pyc-cipher-name
