defaults:
  platforms: [windows]
  for: [c, cpp, python]

composite_rules:
  - id: micro-behaviors/crypto/symmetric/aes/mode::ccm-base32-crc-xor-clues
    desc: CCM, Base32, CRC and XOR clues
    crit: suspicious
    conf: 0.95
    for: [python]
    all:
      - id: micro-behaviors/crypto/symmetric/aes/mode::pycrypto-aes-ccm-mode
      - id: "micro-behaviors/data/encoding/base32::base32-lowercase-alphabet-text"
      - id: micro-behaviors/data/checksum::crc-xor-0x31-text
      - id: micro-behaviors/data/bitwise/xor-forms/scalar::xor-0xaaaa-text
