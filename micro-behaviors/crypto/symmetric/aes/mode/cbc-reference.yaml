defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: aes-256-cbc-dash
    desc: References the AES-256-CBC algorithm
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: aes-256-cbc
  # Lower-first Base64 spelling of the same algorithm name, as emitted by
  # javascript-obfuscator string tables. Stable because the name is fixed
  # by the crypto API.
  - id: aes-256-cbc-lower-first-b64-literal
    desc: AES-256-CBC name in lower-first Base64 strings
    crit: notable
    conf: 0.85
    if:
      type: literal
      kind: string
      regex: '^ywvZlti1nI1JyMm={0,2}$'
# Plain and string-table spellings of one algorithm name. Reference the
# group to keep its cardinality in enclosing needs: clauses.
composite_rules:
- id: aes-256-cbc-any-form
  desc: AES-256-CBC name in plain or encoded strings
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/crypto/symmetric/aes/mode::aes-256-cbc-dash
  - id: micro-behaviors/crypto/symmetric/aes/mode::aes-256-cbc-lower-first-b64-literal
