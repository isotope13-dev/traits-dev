defaults:
  platforms: [windows]
  for: [data]
  crit: notable
  conf: 0.88

traits:
  - id: create-decryptor
    desc: .NET CreateDecryptor in data
    crit: notable
    if:
      type: text
      word: CreateDecryptor
  - id: rijndael-managed
    desc: RijndaelManaged AES in data
    conf: 0.9
    if:
      type: text
      regex: '(?i)rijndaelmanaged|R[^R\n]{0,32}ijndae[^e\n]{0,32}lManaged'
  - id: cbc-mode
    desc: CBC cipher mode in data
    conf: 0.85
    if:
      type: text
      regex: '\bCipherMode\.CBC\b'
