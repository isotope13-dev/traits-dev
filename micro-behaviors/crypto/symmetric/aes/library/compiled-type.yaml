defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: dotnet-aes-short-type-name
    desc: NUL-delimited Aes name in code metadata
    crit: notable
    conf: 0.85
    # Aes is three bytes and is absent from the normal extracted-string view.
    # This name alone does not identify a call or encryption direction.
    if:
      type: hex
      pattern: '00 41 65 73 00'
      section: .text
composite_rules:
  - id: dotnet-aes-transform-references
    desc: Managed AES and cipher transform references
    crit: notable
    conf: 0.96
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: dotnet-aes-short-type-name
      - id: micro-behaviors/crypto/cipher::dotnet-cryptostream
      - id: micro-behaviors/crypto/encrypt::dotnet-create-encryptor
      - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor-text
