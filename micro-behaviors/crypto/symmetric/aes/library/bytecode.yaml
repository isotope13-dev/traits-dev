defaults:
  platforms: [windows, unix]
  for: [pyc]
  crit: notable
  conf: 0.92
traits:
  - id: python-bytecode-cbc-mode-ref
    desc: Python bytecode CBC mode reference
    if:
      type: text
      substr: MODE_CBC
  - id: python-bytecode-gcm-mode-ref
    desc: Python bytecode GCM mode reference
    if:
      type: text
      substr: MODE_GCM
