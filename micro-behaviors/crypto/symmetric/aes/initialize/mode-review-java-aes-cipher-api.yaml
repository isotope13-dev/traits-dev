# Java/Kotlin AES API usage.  The mode is recorded separately so protocol
# composites can distinguish a generic cipher reference from ECB framing.
defaults:
  crit: notable
  platforms: [android, unix, windows]
  for: [java, kotlin, class]

traits:
  - id: java-aes-cipher-api
    desc: Java AES cipher factory call text
    conf: 0.88
    if:
      type: text
      regex: 'Cipher\.getInstance\s*\(\s*["\x27]AES'

