# Placeholder keys and constructor references do not establish HTTP C2.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, go]
composite_rules:
  - id: aes-placeholder-http-command-context
    for: [elf, macho, pe, go]
    desc: AES/HTTP key context with command APIs
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/crypto/symmetric/aes/initialize::aes-placeholder-http-get-context
    any:
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-call
      - id: metadata/lang/source/syntax/call/relationship::go-command-output-capture
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
    near_bytes: 12000
