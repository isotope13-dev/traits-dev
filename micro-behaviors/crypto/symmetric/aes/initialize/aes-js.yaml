defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96
traits:
  - id: aes-js-cbc-constructor
    desc: Constructs an aes-js CBC cipher
    if:
      type: tree-sitter
      query: |
        (new_expression
          constructor: (member_expression
            object: (member_expression
              property: (property_identifier) @mode)
            property: (property_identifier) @cbc)
          (#eq? @mode "ModeOfOperation")
          (#eq? @cbc "cbc")) @constructor
