# Java/Kotlin AES cipher construction without a required mode. Mode-specific
# evidence (GCM, CBC, ECB transformation names) lives in mode/ so protocol
# composites can distinguish a generic cipher reference from ECB framing.
defaults:
  crit: notable
  platforms: [android, unix, windows]
  for: [java, kotlin, class]

traits:
  - id: java-aes-cipher-api
    desc: Java AES cipher API
    conf: 0.88
    if:
      type: text
      regex: 'Cipher\.getInstance\s*\(\s*["\x27]AES'
