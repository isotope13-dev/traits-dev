defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98
traits:
  - id: python-aes-cbc-cipher
    desc: Constructs a Python AES-CBC cipher
    if:
      type: symbol
      kind: call
      regex: '(^|\.)Cipher$'
      args:
        - index: 0
          from:
            call: '(^|\.)algorithms\.AES$'
        - index: 1
          from:
            call: '(^|\.)modes\.CBC$'
