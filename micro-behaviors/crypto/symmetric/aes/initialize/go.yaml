traits:
- id: go-new-cipher-string
  desc: References Go aes.NewCipher
  conf: 0.7
  for:
  - go
  - elf
  - macho
  - pe
  - wasm
  if:
    type: text
    substr: aes.NewCipher
- id: go-aes-constructor-reference
  desc: References the Go AES cipher constructor
  conf: 0.9
  for:
  - scripts
  - binaries
  if:
    type: text
    exact: crypto/aes.NewCipher
defaults:
  platforms:
  - windows
  - linux
  - macos
  crit: notable
