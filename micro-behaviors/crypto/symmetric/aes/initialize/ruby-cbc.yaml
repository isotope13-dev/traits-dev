defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-aes-cbc-cipher-construction
    desc: Creates AES CBC cipher in Ruby
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (call receiver: (scope_resolution) @cipher method: (identifier) @new
          arguments: (argument_list (string (string_content) @mode))
          (#eq? @cipher "OpenSSL::Cipher::AES") (#eq? @new "new")
          (#match? @mode "^(128|192|256)-CBC$"))
