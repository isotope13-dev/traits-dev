defaults:
  platforms: [unix, windows, android]
  for: [java, kotlin]
  crit: notable
traits:
  - id: java-aes-ctr-cipher-initialization
    desc: Java requests AES CTR cipher instance
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: getInstance
      arg:
        index: 0
        kind: string
        substr: AES/CTR/
