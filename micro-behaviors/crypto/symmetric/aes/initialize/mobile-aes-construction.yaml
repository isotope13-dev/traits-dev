# AES cipher construction in mobile source and string tables: the JVM
# Cipher.getInstance("AES/...") form and the Dart encrypt package's
# AES(... AESMode...) form. Construction alone is a notable capability.
defaults:
  platforms: [android, unix]
  for: [javascript, typescript, kotlin, java, text, dex, elf, so]
  crit: notable
  conf: 0.9

traits:
  - id: jvm-aes-cipher-construction
    desc: Constructs JVM AES cipher instance
    if:
      type: text
      regex: 'Cipher\.getInstance\(\s*["'']AES[/"]'
      exclude_comments: true

  - id: dart-aes-cipher-construction
    desc: Constructs Dart AES cipher instance
    if:
      type: text
      regex: '(Encrypter\(\s*(\w+\.)?AES\(|AESMode\.(cbc|ecb|gcm|ctr|cfb|ofb))'
      exclude_comments: true

composite_rules:
  - id: mobile-aes-cipher-construction
    desc: Constructs an AES cipher in mobile code
    crit: notable
    conf: 0.9
    any:
      - id: jvm-aes-cipher-construction
      - id: dart-aes-cipher-construction
