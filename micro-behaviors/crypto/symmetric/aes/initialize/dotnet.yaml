traits:
- id: dotnet-aes-create
  desc: .NET Aes.Create factory call
  crit: notable
  conf: 0.92
  for:
  - pe
  - dll
  - scripts
  - source
  if:
    type: text
    regex: '(?i)(Aes\.Create|\[System\.Security\.Cryptography\.Aes\]::Create)\s*\(\s*\)'
  unless:
  - type: basename
    regex: ^System\.Security\.Cryptography\.(Algorithms|Csp)\.dll$
  - id: metadata/file/extension/identity::netstandard-dll-basename
  platforms:
  - unix
  - windows
