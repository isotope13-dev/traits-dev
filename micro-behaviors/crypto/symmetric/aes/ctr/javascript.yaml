defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: aes-ctr-algorithm-marker
    desc: JavaScript AES-CTR algorithm marker
    crit: notable
    conf: 0.94
    if:
      type: text
      # Web Crypto identifies the mode as `AES-CTR`; some libraries include
      # the key size in the algorithm name (`AES-256-CTR`). Both spellings
      # represent the same primitive and belong to this neutral capability.
      regex: '(?i)\baes(-(128|192|256))?-ctr\b'
