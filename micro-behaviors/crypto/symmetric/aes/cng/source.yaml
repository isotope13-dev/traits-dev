defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust]
  attack: T1027

traits:
  - id: bcrypt-generate-key-source
    desc: Source generates BCrypt symmetric key
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: BCryptGenerateSymmetricKey

  - id: bcrypt-decrypt-source
    desc: Source decrypts with BCrypt
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: BCryptDecrypt

  - id: bcrypt-encrypt-source
    desc: Source encrypts with BCrypt
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: BCryptEncrypt

composite_rules:
  - id: bcrypt-symmetric-crypto-source
    desc: Source decrypts with Windows BCrypt
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/library/cng::bcrypt-open-provider-source
      - id: bcrypt-generate-key-source
      - id: bcrypt-decrypt-source
    near_lines: 40

  - id: bcrypt-symmetric-encryption-source
    desc: Source encrypts with Windows BCrypt
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/library/cng::bcrypt-open-provider-source
      - id: bcrypt-generate-key-source
      - id: bcrypt-encrypt-source
    near_lines: 40
