# Reports the supported capability or configuration without inferring hostile intent.
defaults:
  platforms:
  - linux
  for:
  - c
  - cpp
  - go
  - rust
  - python
  - elf
composite_rules:
- id: aes-decrypt-xor-array-cooccurrence
  desc: AES decryption and indexed XOR array writes co-occur
  crit: notable
  conf: 0.92
  for:
  - c
  - cpp
  all:
  - id: micro-behaviors/crypto/symmetric/aes/decrypt::native-aes-decrypt
  - id: micro-behaviors/data/arithmetic::indexed-xor-array-assignment
  near_lines: 24
  unless:
  - id: well-known/lib/crypto/implementation::known-crypto-library-implementation
  - id: micro-behaviors/crypto/provider/library::libcrypto-ref
  - id: metadata/package/testing/presence/harness::c-source-test-directory
