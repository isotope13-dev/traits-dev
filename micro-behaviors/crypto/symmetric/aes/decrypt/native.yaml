# Native AES block-decryption APIs.  AES is common and remains a notable
# capability; exploit intent is inferred only when it is combined with the
# shared-page splice chain and a privileged file target.
defaults:
  platforms: [unix]
  for: [c, cpp, elf, macho]

traits:
  - id: openssl-aes-decrypt
    desc: Native AES block-decryption routine
    crit: notable
    conf: 0.9
    if:
      type: symbol
      regex: '(^|\.)(AES_decrypt|AES_decrypt_block)$'

  - id: kernel-kerberos-decrypt
    desc: Kernel Kerberos decrypt routine
    crit: notable
    conf: 0.92
    for: [c, cpp, elf]
    if:
      type: symbol
      regex: '(^|\.)(crypto_krb5_decrypt|rxgk_decrypt(_skb)?)$'

composite_rules:
  - id: native-aes-decrypt
    desc: Native AES or Kerberos token decryption
    crit: notable
    conf: 0.9
    any:
      - id: openssl-aes-decrypt
      - id: kernel-kerberos-decrypt
