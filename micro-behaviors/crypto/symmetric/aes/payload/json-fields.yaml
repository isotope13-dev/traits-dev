defaults:
  platforms: [windows, unix]
  for: [binaries, python, javascript]
  crit: component
  conf: 0.85
  mbc: C0021.001
traits:
  - id: json-ciphertext-field
    desc: JSON ciphertext field
    if:
      type: text
      substr: 'json:"ciphertext"'
  - id: json-iv-field
    desc: JSON IV field
    if:
      type: text
      substr: 'json:"iv"'
  - id: quoted-ciphertext-field
    desc: Quoted JSON ciphertext field
    # Cipher envelopes can be delivered as data or document content, including
    # an HTML page fetched into an agent's context.
    for: [source, html, markdown, text]
    if:
      type: text
      substr: '"ciphertext"'
  - id: quoted-iv-field
    desc: Quoted JSON IV field
    for: [source, html, markdown, text]
    if:
      type: text
      substr: '"iv"'
  - id: quoted-nonce-field
    desc: Quoted JSON nonce field
    for: [source, html, markdown, text]
    if:
      type: text
      substr: '"nonce"'
  - id: quoted-salt-field
    desc: Quoted JSON salt field
    for: [source, html, markdown, text]
    if:
      type: text
      substr: '"salt"'
  - id: quoted-auth-tag-field
    desc: Quoted JSON authentication-tag field
    for: [source, html, markdown, text]
    if:
      type: text
      regex: '"(auth[_-]?tag|tag)"\s*:'
  - id: encoded-ciphertext-field
    desc: Encoded JSON ciphertext field
    if:
      type: encoded
      substr: '"ciphertext"'
  - id: encoded-iv-field
    desc: Encoded JSON IV field
    if:
      type: encoded
      substr: '"iv"'
composite_rules:
  - id: json-ciphertext-field-any
    desc: JSON ciphertext field marker
    crit: component
    conf: 0.85
    for: [source, html, markdown, text]
    any:
      - id: json-ciphertext-field
      - id: quoted-ciphertext-field
      - id: encoded-ciphertext-field
  - id: json-iv-field-any
    desc: JSON IV field marker
    crit: component
    conf: 0.85
    any:
      - id: json-iv-field
      - id: quoted-iv-field
      - id: encoded-iv-field
  - id: json-ciphertext-iv-fields
    desc: JSON ciphertext and IV fields
    crit: notable
    conf: 0.88
    all:
      - id: json-ciphertext-field-any
      - id: json-iv-field-any
  - id: json-aead-cipher-envelope
    desc: JSON authenticated-cipher envelope with salt
    crit: notable
    conf: 0.96
    for: [source, html, markdown, text]
    all:
      - id: json-ciphertext-field-any
      - id: quoted-salt-field
      - id: quoted-auth-tag-field
    any:
      - id: json-iv-field-any
      - id: quoted-nonce-field
