# Three-character algorithm constants fall below ordinary wide-string
# extraction's length floor. Match the complete NUL-delimited UTF-16 token.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: aes-utf16-identifier
    desc: UTF-16 AES algorithm identifier
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: .rdata
      pattern: '00 00 41 00 45 00 53 00 00 00'
