defaults:
  crit: notable
  platforms: [windows]
  for: [vbs]

traits:
  - id: rijndael-class-vb6
    desc: VB6 CRijndael module name
    conf: 0.96
    if:
      type: text
      exact: Attribute VB_Name = "CRijndael"

  - id: rijndael-wrapper-vb6
    desc: VB6 CRijndael object construction
    conf: 0.92
    if:
      type: text
      substr: Set oTest = New CRijndael

composite_rules:
  - id: rijndael-buffer-crypto-vb6
    desc: Rijndael module and crypto declarations
    conf: 0.96
    all:
      - id: micro-behaviors/crypto/symmetric/aes/vb6::rijndael-class-vb6
      - id: micro-behaviors/crypto/encrypt::vb6-encryptdata-function-declaration
      - id: micro-behaviors/crypto/decrypt/transform::vb6-decryptdata-function-declaration
