defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  - id: create-decipher-hex-hidden
    desc: Hex-hidden JavaScript createDecipher API
    crit: notable
    conf: 0.94
    mbc: C0027
    attack: T1027
    if:
      type: encoded
      encoding: hex
      exact: createDecipher
  - id: aes-128-ctr-dash
    desc: AES-128-CTR with dashes
    crit: notable
    conf: 0.75
    mbc: C0027
    if:
      type: string_literal
      substr: aes-128-ctr
  - id: aes128ctr-nodash
    desc: AES-128-CTR without dashes
    crit: notable
    conf: 0.75
    mbc: C0027
    if:
      type: string_literal
      substr: aes128ctr
  - id: aes-256-cbc-dash
    desc: AES-256-CBC with dashes
    crit: notable
    conf: 0.75
    mbc: C0027
    if:
      type: text
      substr: aes-256-cbc
  - id: aes-256-cbc-hex-raw
    desc: Hex encoded AES-256-CBC
    crit: notable
    conf: 0.78
    for: [data, javascript, typescript]
    mbc: C0027
    if:
      type: text
      substr: "6165732d3235362d636263"
  - id: aes256cbc-nodash
    desc: AES-256-CBC without dashes
    crit: notable
    conf: 0.75
    mbc: C0027
    if:
      type: string_literal
      substr: aes256cbc
  - id: aes-256-gcm-dash
    desc: AES-256-GCM with dashes
    crit: notable
    conf: 0.75
    mbc: C0027
    if:
      type: string_literal
      substr: aes-256-gcm
  - id: set-auth-tag
    desc: Sets an authentication tag for AEAD decryption
    crit: notable
    conf: 0.9
    mbc: C0027
    if:
      type: symbol
      kind: call
      regex: '(^|\.)setAuthTag$'
  - id: cipher-update-server-url
    desc: Cipher encrypts a serverUrl field
    crit: notable
    conf: 0.94
    mbc: C0027
    if:
      type: text
      regex: '\bcipher\.update\(\s*serverUrl\b'
  - id: aes256gcm-nodash
    desc: AES-256-GCM without dashes
    crit: notable
    conf: 0.75
    mbc: C0027
    if:
      type: string_literal
      substr: aes256gcm
  - id: aes-algorithm
    desc: AES algorithm string prefix
    crit: component
    conf: 0.7
    if:
      type: string_literal
      regex: \baes-
      case_insensitive: true
  - id: hardcoded-key-pattern
    desc: Hardcoded encryption key in string
    crit: suspicious
    conf: 0.8
    mbc: C0027
    if:
      type: text
      regex: (key|secret|password|pass)\s*[=:]\s*Buffer\.from\(['"][0-9a-fA-F]{32,}['"]
    unless:
      - id: metadata/package/testing/
  - id: hardcoded-iv-pattern
    desc: Hardcoded IV in string literal
    crit: suspicious
    conf: 0.8
    mbc: C0027
    if:
      type: text
      regex: \biv\b\s*[=:]\s*Buffer\.from\(['"][0-9a-fA-F]{16,}['"]
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/bundler/vscode::javascript-source-map-file
  - id: buffer-from-ascii-key
    desc: Buffer.from with 32-char key string
    crit: suspicious
    conf: 0.8
    mbc: C0027
    if:
      type: text
      regex: Buffer\.from\(['"][A-Za-z0-9]{32}['"]\)
    unless:
      - id: metadata/package/testing/
  - id: createCipheriv
    desc: Initialize Node.js encrypting cipher with IV
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: (^|\.)createCipheriv$
  - id: webcrypto-subtle-encrypt-call
    desc: Calls WebCrypto subtle.encrypt
    crit: notable
    conf: 0.9
    mbc: C0027
    if:
      type: symbol
      kind: call
      regex: '(^|\.)subtle\.encrypt$'
composite_rules:
  - id: aes-128-ctr
    desc: AES-128-CTR encryption (stream cipher mode)
    crit: notable
    conf: 0.85
    mbc: C0027
    any:
      - id: aes-128-ctr-dash
      - id: aes128ctr-nodash
  - id: aes-256-cbc
    desc: AES-256-CBC encryption
    crit: notable
    conf: 0.85
    mbc: C0027
    any:
      - id: aes-256-cbc-dash
      - id: aes-256-cbc-hex-raw
      - id: aes256cbc-nodash
  - id: aes-256-gcm
    desc: AES-256-GCM authenticated encryption
    crit: notable
    conf: 0.85
    mbc: C0027
    any:
      - id: aes-256-gcm-dash
      - id: aes256gcm-nodash
  - id: hardcoded-key
    desc: Hardcoded encryption key pattern
    crit: suspicious
    conf: 0.8
    mbc: C0027
    any:
      - id: hardcoded-key-pattern
      - id: hardcoded-iv-pattern
      - id: buffer-from-ascii-key
  - id: aes-with-http-client
    desc: AES crypto near HTTP client code
    crit: notable
    conf: 0.9
    near_lines: 160
    all:
      - id: aes-algorithm
      - id: micro-behaviors/communications/http/request/client::http-client
    any:
      - id: createCipheriv
      - id: micro-behaviors/crypto/symmetric/decrypt::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/decrypt::create-decipher-call
    unless:
      - id: well-known/lib/crypto/crypto-browserify::polyfill-bundle
      - id: well-known/lib/network/node-edge/
  - id: gzip-with-crypto
    desc: Node gzip or gunzip alongside cipher or decipher initialization
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/data/decompress/gzip::node-gzip-functions
    any:
      - id: createCipheriv
      - id: micro-behaviors/crypto/symmetric/decrypt::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/decrypt::create-decipher-call
