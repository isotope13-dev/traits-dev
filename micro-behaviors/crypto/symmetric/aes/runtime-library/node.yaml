defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  - id: aes-128-ctr-dash
    desc: AES-128-CTR with dashes
    crit: notable
    conf: 0.75
    mbc: C0027
    if:
      type: string_literal
      substr: aes-128-ctr
  - id: aes128ctr-nodash
    desc: AES-128-CTR without dashes
    crit: notable
    conf: 0.75
    mbc: C0027
    if:
      type: string_literal
      substr: aes128ctr
  - id: aes-256-cbc-hex-raw
    desc: Hex encoded AES-256-CBC
    crit: notable
    conf: 0.78
    for: [data, javascript, typescript]
    mbc: C0027
    if:
      type: text
      substr: "6165732d3235362d636263"
  - id: aes256cbc-nodash
    desc: AES-256-CBC without dashes
    crit: notable
    conf: 0.75
    mbc: C0027
    if:
      type: string_literal
      substr: aes256cbc
  - id: gcm-iv-ciphertext-tag-envelope
    desc: Packs GCM IV, ciphertext and tag
    crit: notable
    conf: 0.9
    mbc: C0027
    if:
      type: text
      regex: 'Buffer\.concat\(\[\s*\w*[iI][vV]\b[\s\S]{0,90}getAuthTag\(\)'
  - id: aes256gcm-nodash
    desc: AES-256-GCM without dashes
    crit: notable
    conf: 0.75
    mbc: C0027
    if:
      type: string_literal
      substr: aes256gcm
  - id: aes-algorithm
    desc: AES algorithm string prefix
    crit: notable
    conf: 0.7
    if:
      type: string_literal
      regex: \baes-
      case_insensitive: true
  - id: hardcoded-key-pattern
    desc: Hardcoded encryption key in string
    crit: suspicious
    conf: 0.8
    mbc: C0027
    if:
      type: text
      regex: (key|secret|password|pass)\s*[=:]\s*Buffer\.from\(['"][0-9a-fA-F]{32,}['"][,)]
    # A counting pattern (00 01 02 03 ... or 01 02 03 ...) or all zeros is the published test
    # vector of a cipher benchmark or known-answer test; nobody protects data
    # with it.
    not:
      - regex: "['\"]((00)?0102030405|0{16})"
    unless:
      - id: micro-behaviors/data/decode/xor::js-buffer-repeating-key-xor-decode
      # README usage samples (libsodium.js secretbox example) can be
      # content-sniffed as JavaScript; a key in documentation protects nothing.
      - type: basename
        regex: '(?i)\.(md|markdown|rst|txt|adoc)$'
  - id: hardcoded-iv-pattern
    desc: Hardcoded IV in string literal
    crit: notable
    conf: 0.8
    mbc: C0027
    if:
      type: text
      regex: \biv\b\s*[=:]\s*Buffer\.from\(['"][0-9a-fA-F]{16,}['"]
    # A counting pattern (00 01 02 03 ... or 01 02 03 ...) or all zeros is the published test
    # vector of a cipher benchmark or known-answer test; nobody protects data
    # with it.
    not:
      - regex: "['\"]((00)?0102030405|0{16})"
    unless:
      - id: metadata/file/extension/asset::javascript-source-map-path
composite_rules:
  - id: aes-128-ctr
    desc: References AES-128-CTR algorithm
    crit: notable
    conf: 0.85
    any:
    - id: aes-128-ctr-dash
    - id: aes128ctr-nodash
  - id: aes-256-cbc
    desc: References AES-256-CBC algorithm
    crit: notable
    conf: 0.85
    any:
    - id: micro-behaviors/crypto/symmetric/aes/mode::aes-256-cbc-dash
    - id: aes-256-cbc-hex-raw
    - id: aes256cbc-nodash
  - id: aes-256-gcm
    desc: References AES-256-GCM algorithm
    crit: notable
    conf: 0.85
    any:
    - id: metadata/lang/source/literal/string/cryptography::aes-256-gcm-dash
    - id: aes256gcm-nodash
