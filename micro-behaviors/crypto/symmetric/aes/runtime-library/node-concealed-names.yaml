defaults:
  platforms:
  - windows
  - unix
  crit: notable
  mbc: C0027
  for:
  - javascript
  - typescript
traits:
- id: decipheriv-name-literal
  desc: createDecipheriv named by a string constant
  conf: 0.8
  if:
    type: literal
    kind: string
    exact: createDecipheriv
  unless:
  - id: metadata/package/testing/
  - id: metadata/build
  - id: well-known/lib/web/client-side/ecmascript/
  - id: metadata/path::test-directory-component
- id: set-auth-tag-name-literal
  desc: setAuthTag named by a string constant
  conf: 0.85
  if:
    type: literal
    kind: string
    exact: setAuthTag
  unless:
  - id: metadata/package/testing/
  - id: metadata/build
  - id: well-known/lib/web/client-side/ecmascript/
  - id: metadata/path::test-directory-component
