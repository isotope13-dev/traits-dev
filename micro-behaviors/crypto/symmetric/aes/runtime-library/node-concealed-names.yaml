# AEAD API names that survive only as string-table entries.
#
# javascript-obfuscator lifts every member name a file uses into one rotated
# string table and rewrites each call site to `obj[_0xdecoder(0x1f)](...)`.
# The API name is still in the file -- as a bare string constant in that table
# -- but no symbol, member or call fact carries it any longer, so the
# `type: symbol` spellings in node.yaml (`createDecipheriv`, `set-auth-tag`)
# fall silent on exactly the files that most deserve them. That is not
# hypothetical: on the mathmain/mathsbase/math-universe npm loader (2026-09)
# four of the eight legs of `dropper/staging/encrypted::node-local-file-decrypt-dynamic-load`
# missed for this reason alone, and the package scanned as suspicious.
#
# These siblings match the surviving evidence. They are notable in their own
# right rather than obfuscation components: the plain bracket spelling
# `crypto['createDecipheriv'](...)` names the same capability and is what a
# reviewer wants to see in a diff either way.
defaults:
  platforms: [windows, unix]
  crit: notable
  mbc: C0027
  for:
    - javascript
    - typescript
traits:
  - id: decipheriv-name-literal
    desc: createDecipheriv named by a string constant
    conf: 0.8
    if:
      type: literal
      kind: string
      exact: createDecipheriv
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/
      # Node's own crypto surface and its polyfills enumerate the API names
      # as data; that is the implementation, not a concealed call.
      - id: well-known/lib/web/ecmascript/
  - id: set-auth-tag-name-literal
    desc: setAuthTag named by a string constant
    conf: 0.85
    if:
      type: literal
      kind: string
      exact: setAuthTag
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/
      - id: well-known/lib/web/ecmascript/
