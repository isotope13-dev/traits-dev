# Go AES-GCM capability. This is a neutral cipher-construction observation;
# intent comes only from an objective composite that adds context.
defaults:
  platforms: [windows, linux, macos]
  for: [go]

traits:
  - id: go-aes-gcm-helper
    desc: Go AES-GCM helper construction
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: crypto.NewAesGcm

  # crypto/cipher's GCM constructor: the stdlib route to AES-GCM, as opposed
  # to the wrapper helper above.
  - id: go-cipher-new-gcm
    desc: Creates a new AES-GCM AEAD
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: cipher.NewGCM
