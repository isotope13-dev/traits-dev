# Go AES-GCM capability. This is a neutral cipher-construction observation;
# intent comes only from an objective composite that adds context.
defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, linux, macos]
  for: [go]

traits:
  - id: go-aes-gcm-helper
    desc: Go AES-GCM helper construction
    if:
      type: symbol
      kind: call
      exact: crypto.NewAesGcm
