# .NET AES-GCM capability. The calendar dead-drop objective combines this
# neutral cipher operation with Graph event attachment traffic.
defaults:
  platforms: [windows, unix]
  for: [csharp, pe, dll]

traits:
  - id: dotnet-aes-gcm-constructor
    desc: .NET AES-GCM cipher construction
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: AesGcm

  - id: dotnet-aes-gcm-type-name-reference
    desc: Managed image references the AesGcm cipher type
    crit: notable
    conf: 0.94
    for: [pe, dll]
    if:
      type: text
      section: .text
      exact: AesGcm
