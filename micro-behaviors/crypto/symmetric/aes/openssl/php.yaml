defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.92
  attack: T1573.001

traits:
  - id: php-openssl-aes-cbc
    desc: PHP OpenSSL AES CBC encryption
    if:
      type: symbol
      kind: call
      exact: openssl_encrypt
      arg:
        kind: string
        regex: '(?i)^AES-(128|192|256)-CBC$'
