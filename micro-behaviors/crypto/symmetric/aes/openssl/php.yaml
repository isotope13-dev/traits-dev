defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.92
  attack: T1573.001

traits:
  - id: php-aes-cbc-cipher-name
    desc: PHP references AES CBC cipher
    if:
      type: literal
      kind: string
      regex: '(?i)^AES-(128|192|256)-CBC$'

composite_rules:
  - id: php-openssl-aes-cbc
    desc: PHP OpenSSL AES CBC encryption
    all:
      - id: php-aes-cbc-cipher-name
      - id: micro-behaviors/crypto/symmetric/encrypt::php-openssl-encrypt-call

  - id: php-openssl-aes-cbc-decryption
    desc: PHP OpenSSL AES CBC decryption
    all:
      - id: php-aes-cbc-cipher-name
      - id: micro-behaviors/crypto/symmetric/decrypt::php-openssl-decrypt-call
