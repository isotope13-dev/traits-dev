# OpenSSL symmetric encryption commands in shell scripts
defaults:
  for: [shell]
  platforms: [unix]
  mbc: C0027
traits:
  - id: openssl-enc-aes
    desc: OpenSSL AES symmetric cipher command
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'openssl\s+enc\b[^\n]{0,80}-aes-\d+-'
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
  - id: openssl-aes-decrypt
    desc: OpenSSL decrypts AES ciphertext
    crit: notable
    conf: 0.94
    attack: T1140
    if:
      type: text
      regex: 'openssl\s+enc\b[^\n]{0,80}\s-d\b[^\n]{0,80}-aes-\d+-'
  - id: openssl-rand-key
    desc: OpenSSL random key generation command
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: openssl rand \d+
