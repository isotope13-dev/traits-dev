# OpenSSL symmetric encryption commands in shell scripts
defaults:
  crit: notable
  for: [shell]
  platforms: [unix]
  mbc: C0027
traits:
  - id: openssl-enc-aes
    desc: OpenSSL AES symmetric cipher command
    conf: 0.8
    if:
      type: text
      regex: 'openssl\s+enc\b[^\n]{0,80}-aes-\d+-'
  - id: openssl-aes-decrypt
    desc: OpenSSL command decrypts with AES
    conf: 0.94
    attack: T1140
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @name) @decrypt
          (#match? @name "(^|/)openssl$")
          (#match? @decrypt "openssl[ \\t]+(enc|aes-[0-9]+-[a-z0-9]+)([ \\t]|$)")
          (#match? @decrypt "[ \\t]-d([ \\t]|$)")
          (#match? @decrypt "[ \\t]-?aes-[0-9]+-[a-z0-9]+([ \\t]|$)"))
  - id: openssl-rand-key
    desc: OpenSSL random key generation command
    conf: 0.75
    if:
      type: text
      regex: openssl rand \d+
