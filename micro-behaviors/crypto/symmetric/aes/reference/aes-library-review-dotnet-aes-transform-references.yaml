defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: micro-behaviors/crypto/symmetric/aes/reference::dotnet-aes-transform-references
    desc: Managed AES and cipher transform references
    crit: notable
    conf: 0.96
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/binary/section/bytes::aes-token-in-code-section
