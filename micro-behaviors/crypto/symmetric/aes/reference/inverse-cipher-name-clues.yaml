defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: js-inverse-sbox-name
    desc: Inverse S-box name text
    conf: 0.94
    if:
      type: text
      word: SBOX_INV
  - id: js-inverse-mix-columns-name
    desc: Inverse mix-columns name text
    conf: 0.94
    if:
      type: text
      word: invMixColumns
  - id: js-inverse-gf-multiplier-name
    desc: Inverse multiplier name text
    conf: 0.94
    if:
      type: text
      word: MUL0E
  - id: js-inverse-key-schedule-name
    desc: Inverse key-schedule name text
    conf: 0.95
    if:
      type: text
      word: invKeySchedule

composite_rules:
  - id: js-inverse-cipher-name-profile
    desc: Inverse cipher implementation name co-occurrence
    conf: 0.97
    all:
      - id: js-inverse-sbox-name
      - id: js-inverse-mix-columns-name
      - id: js-inverse-gf-multiplier-name
