defaults:
  platforms:
  - unix
  - windows
  for:
  - cfml
  crit: notable
  conf: 0.9
traits:
- id: cfml-encrypted-request-url
  desc: ColdFusion encrypts the request URL
  if:
    type: symbol
    kind: call
    exact: encrypt
    arg:
      index: 0
      from:
        call: ^getpagecontext\.getrequest\.getrequesturl(\.tostring)?$
- id: cfml-encrypt-aes-selection
  desc: Encrypt call selects AES algorithm
  conf: 0.99
  if:
    type: symbol
    kind: call
    exact: encrypt
    arg:
      index: 2
      from:
        whole_value: (?i)^AES$
