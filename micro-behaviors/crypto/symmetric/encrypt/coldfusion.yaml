# Encryption of a page URL is a data transformation, not an HTTP operation.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.9
traits:
  - id: cfml-encrypted-request-url
    desc: ColdFusion encrypts the request URL
    if:
      type: symbol
      kind: call
      exact: encrypt
      arg:
        index: 0
        from:
          call: '^getpagecontext\.getrequest\.getrequesturl(\.tostring)?$'
