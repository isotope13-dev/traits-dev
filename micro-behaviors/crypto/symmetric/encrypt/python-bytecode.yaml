# Marshal short-ASCII records, including interned and reference-flag variants.
# These are serialized names, not recovered call sites or an execution trace.
defaults:
  for: [pyc]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: pyc-encrypt-name-record
    desc: Bytecode contains encrypt name record
    conf: 0.85
    if:
      type: raw
      regex: '(?-u:[\x7a\x5a\xfa\xda]\x07encrypt)'
