# Native symmetric-encryption APIs are neutral capabilities.  Ransomware
# intent requires a separate objective composite that adds recursive targeting,
# encrypted-name handling, and an extortion signal.
defaults:
  platforms: [unix]
  for: [source, binaries]
  crit: notable
  conf: 0.92

traits:
  - id: openssl-encryption-init
    desc: OpenSSL symmetric-encryption initialization API
    for: [c, cpp, rust, go, elf, macho]
    if:
      type: symbol
      regex: '(?i)^EVP_(Encrypt|Cipher)Init_ex$'

  - id: aes-encrypt-routine
    desc: Native AES encryption routine
    for: [c, cpp, rust, go, elf, macho]
    if:
      type: symbol
      regex: '(?i)^AES_(cbc_)?encrypt$'

  - id: mbedtls-aes-encrypt
    desc: mbedTLS AES encryption routine
    for: [c, cpp, rust, go, elf, macho]
    if:
      type: symbol
      regex: '(?i)^mbedtls_aes_crypt_(cbc|ctr|ecb)$'

  - id: gcrypt-cipher-encrypt
    desc: Libgcrypt cipher encryption routine
    for: [c, cpp, rust, go, elf, macho]
    if:
      type: symbol
      exact: gcry_cipher_encrypt

composite_rules:
  - id: symmetric-encryption-operation
    desc: Native symmetric-encryption API operation
    any:
      - id: openssl-encryption-init
      - id: aes-encrypt-routine
      - id: mbedtls-aes-encrypt
      - id: gcrypt-cipher-encrypt
