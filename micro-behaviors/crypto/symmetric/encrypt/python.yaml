defaults:
  platforms: [unix, windows]
  for: [python]
  mbc: C0027
  attack: T1027
  crit: notable

traits:
  # Structured call-site match (typed arguments, real call node) instead of a
  # raw `.encrypt(` text scan: same capability, fewer matches on strings,
  # comments, and unrelated ORMs. The Jennifer exclusion predates this matcher
  # and is kept as belt-and-braces for text-level reuses of this rule.
  - id: python-encrypt-method-call
    desc: Python calls an object's encrypt method
    conf: 0.8
    unless:
      - id: well-known/app/development/jennifer/
      - type: path
        regex: '(?i)\\.j$'
    if:
      type: symbol
      kind: call
      regex: '(^|\.)encrypt$'

  - id: python-encrypt-file-call
    desc: Python calls an encrypt_file helper
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: encrypt_file

  - id: python-bytecode-encrypt-file-helper
    desc: Python bytecode encrypt_file helper name
    crit: notable
    conf: 0.9
    for: [pyc]
    if:
      type: text
      exact: encrypt_file

  - id: python-bytecode-recursive-encrypt-helper
    desc: Python bytecode recursive encryption helper name
    crit: notable
    conf: 0.9
    for: [pyc]
    if:
      type: text
      substr: encrypt_recursive

  - id: python-pyencryptor-import
    desc: Python imports the pyencryptor helper package
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: pyencryptor
