defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-fernet-literal-key-variable
    desc: Fernet constructor uses a literal key
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '_CIPHER_KEY\s*=\s*b["''][A-Za-z0-9_-]{43}=["''][\s\S]{0,100}Fernet\(_CIPHER_KEY\)'
