defaults:
  for: [pyc]
  platforms: [windows, unix]
traits:
  - id: pyc-fernet-library-reference
    desc: Python bytecode references cryptography.fernet
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: cryptography.fernet
  - id: pyc-fernet-long-token
    desc: Long Fernet-format encrypted token in bytecode
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'gAAAA[A-Za-z0-9_-]{256,}'
