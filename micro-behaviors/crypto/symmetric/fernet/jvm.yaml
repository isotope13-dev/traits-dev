# Fernet handling inside JVM code.
#
# Fernet is a Python-ecosystem token format (`cryptography.fernet`): version
# byte, timestamp, IV, AES-128-CBC ciphertext, HMAC-SHA256.  There is no Fernet
# in the JDK, so a class that names Fernet is hand-rolling the format to unwrap
# something a Python tool produced — the packing side of a cross-language
# payload hand-off.  Neutral on its own; the dropper composites supply intent.
defaults:
  platforms: [windows, unix]
  for: [class, java_class, jar, java]
  mbc: C0027
  attack: T1027

traits:
  - id: jvm-fernet-token-handling
    desc: JVM code implements Fernet token crypto
    crit: notable
    conf: 0.9
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)\b[a-z]{0,12}fernet[a-z]{0,12}\b'
