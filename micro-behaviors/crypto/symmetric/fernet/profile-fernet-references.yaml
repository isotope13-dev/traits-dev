defaults:
  platforms: [windows, unix]
  for:
    - python
composite_rules:
  - id: fernet-context
    desc: Fernet import or class reference
    any:
      - id: metadata/import/module::fernet-import
      - id: metadata/lang/source/naming/interface/runtime::fernet-class-symbol
  - id: fernet-symbol-base64-literal
    desc: Fernet symbol and Base64 literal references
    crit: notable
    conf: 0.9
    all:
      - id: metadata/lang/source/naming/interface/runtime::fernet-class-symbol
      - id: metadata/lang/source/literal/string/shape::base64-44-character-literal
