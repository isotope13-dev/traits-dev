# Block-cipher padding scheme names in source or docs.
traits:
# mime-db and similar MIME tables carry pkcs7 as a transfer-format
# label (application/pkcs7-mime, application/x-pkcs7-certificates),
# not a padding-scheme mention, so a pkcs token that continues a
# slash/hyphen content-type token does not count; genuine standalone
# mentions ("PKCS7 padding", pkcs#7) follow a delimiter or quote.
- id: pkcs-padding-scheme-token
  desc: Standalone PKCS padding-scheme token
  for: [scripts, source]
  platforms: [windows, unix]
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)[\s"''(=,;:]pkcs ?#?[57]\b'
