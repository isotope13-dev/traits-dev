defaults:
  platforms: [windows]
traits:
- id: b64-chunk-dotnet-cipher-config
  desc: Base64 .NET cipher configuration fragments
  crit: notable
  conf: 0.98
  for: [batch, vbs, data]
  if:
    type: yara
    source: |
      rule b64_chunk_ps_aes_decrypt {
        strings:
          $c1 = "reateDecryptor" ascii base64
          $c2 = "CipherMode" ascii base64
          $c3 = "PaddingMode" ascii base64
        condition:
          2 of them
      }
