defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  crit: notable
  conf: 0.86
  attack: T1027

traits:
  - id: dotnet-ecb-or-zero-padding-reference
    desc: .NET ECB or zero-padding mode reference
    if:
      type: text
      regex: '(?i)(CipherMode\.ECB|Mode\s*=\s*ECB|PaddingMode\.Zeros)'
