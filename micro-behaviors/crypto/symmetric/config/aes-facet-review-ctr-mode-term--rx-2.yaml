defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [rust, elf, macho, pe]
  # Cipher terminology does not establish an encryption operation.

traits:
- id: ctr-mode-term--rx-2
  desc: CTR or counter mode near cipher terminology
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?i)\b(ctr|counter)\b.{0,40}\b(cipher|keystream)\b'

