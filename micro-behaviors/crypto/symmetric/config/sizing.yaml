# Neutral source-level crypto configuration. These observations become
# partial-file encryption intent only when an objective also proves file I/O,
# random chunk selection, and a concrete encryption routine.
defaults:
  platforms: [linux, windows]
  for: [source]
  crit: component
  conf: 0.86

traits:
  - id: chunk-sizing-after-crypto
    desc: Encryption term followed by chunk sizing
    if:
      type: text
      regex: '(?is)(encrypt|decrypt|cipher|aes|chacha).{0,96}\bchunk([-_ ]?(size|len|length)|sized)\b'

  - id: chunk-sizing-before-crypto
    desc: Chunk sizing followed by an encryption term
    if:
      type: text
      regex: '(?is)\bchunk([-_ ]?(size|len|length)|sized)\b.{0,96}(encrypt|decrypt|cipher|aes|chacha)'

  - id: block-sizing-after-crypto
    desc: Encryption term followed by block sizing
    if:
      type: text
      regex: '(?is)(encrypt|decrypt|cipher|aes|chacha).{0,96}\bblock([-_ ]?(size|len|length)|sized)\b'

  - id: block-sizing-before-crypto
    desc: Block sizing followed by an encryption term
    if:
      type: text
      regex: '(?is)\bblock([-_ ]?(size|len|length)|sized)\b.{0,96}(encrypt|decrypt|cipher|aes|chacha)'
