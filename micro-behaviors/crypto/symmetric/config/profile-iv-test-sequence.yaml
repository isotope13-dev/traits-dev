defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
- id: iv-name-and-incrementing-sequence-text
  desc: IV name and incrementing hex text
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: \b(IV|iv)\b.{0,32}\b0001020304050607\b
composite_rules:
- id: cipher-and-test-sequence-clues
  desc: Cipher reference and test-sequence clues
  crit: notable
  conf: 0.7
  all:
  - id: micro-behaviors/crypto/cipher/reference::cipher-algorithm-reference
  any:
  - id: micro-behaviors/crypto/symmetric/config::incrementing-hex-sequence-text
  - id: metadata/lang/source/syntax/assignment/value::iv-named-test-sequence-assignment
