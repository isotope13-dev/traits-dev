defaults:
  crit: notable
  for: [pe, csharp]
  platforms: [windows]

traits:
  - id: triple-des-decryptor-name-cooccurrence
    desc: TripleDES and CreateDecryptor name proximity
    conf: 0.8
    if:
      type: text
      regex: '(?is)TripleDES.{0,160}CreateDecryptor|CreateDecryptor.{0,160}TripleDES'
