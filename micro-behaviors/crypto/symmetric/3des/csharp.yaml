defaults:
  crit: notable
  for: [pe, csharp]
  platforms: [windows]
traits:
  - id: triple-des-api
    desc: TripleDES symmetric cryptography API reference
    conf: 0.9
    if:
      type: text
      word: TripleDES
  - id: triple-des-provider
    desc: TripleDES provider API reference
    conf: 0.9
    if:
      type: text
      substr: TripleDESCryptoServiceProvider
composite_rules:
  - id: triple-des-transform-codec-api-references
    desc: TripleDES beside transform and codec API references
    conf: 0.95
    all:
      - id: triple-des-api
    any:
      - id: micro-behaviors/crypto/symmetric/3des::triple-des-decryptor-name-cooccurrence
      - id: micro-behaviors/crypto/cipher/unspecified::dotnet-transform-final-block
      - id: micro-behaviors/crypto/cipher/reference::dotnet-icryptotransform
      - id: micro-behaviors/crypto/cipher/io::dotnet-cryptostream
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
    needs: 2
