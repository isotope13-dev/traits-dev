defaults:
  for: [pe, csharp]
  platforms: [windows]
traits:
  - id: triple-des-api
    desc: TripleDES symmetric cryptography API reference
    crit: notable
    conf: 0.9
    if:
      type: text
      word: TripleDES
  - id: triple-des-provider
    desc: TripleDES crypto service provider
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: TripleDESCryptoServiceProvider
  - id: create-decryptor
    desc: TripleDES CreateDecryptor method
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?is)TripleDES.{0,160}CreateDecryptor|CreateDecryptor.{0,160}TripleDES'
  - id: des-create
    desc: DES key generation via Create
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: DES.Create(
composite_rules:
  - id: triple-des-decrypt-chain
    desc: TripleDES decryption scaffolding
    crit: notable
    conf: 0.95
    all:
      - id: triple-des-api
    any:
      - id: create-decryptor
      - id: micro-behaviors/crypto/symmetric/decrypt::transform-final-block
      - id: micro-behaviors/crypto/library/stdlib::dotnet-icryptotransform
      - id: micro-behaviors/crypto/library/stdlib::dotnet-cryptostream
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
    needs: 2
