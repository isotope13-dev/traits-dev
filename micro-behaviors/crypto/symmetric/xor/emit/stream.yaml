# A byte array XOR-decoded straight onto an output stream.
#
# `fprintf(stderr, "%c", ecb_data[i] ^ 47)` inside a loop: the program's whole
# purpose is to print something that is not in the file as text. Requiring a
# character format and scalar key excludes hexadecimal XOR-difference logging.
# Build-time
# trojans use this so the payload exists only in the pipe between the helper
# and the shell that runs it (openssh 3.4p1, key 47; the tcpdump and sendmail
# trojans use the same shape with a `#define` key).
#
# Decoding to a buffer is ordinary; decoding to a *stream* is a courier.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, text]
  mbc: C0021
  attack: T1140

traits:
  - id: xor-array-byte-to-character-stream
    desc: XOR-transformed array byte emitted as character
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'f?printf\s*\([^;\n]{0,32}%c[^;\n]{0,32}\w+\[\w+\]\s*\^\s*\w+\s*[,)&]'
