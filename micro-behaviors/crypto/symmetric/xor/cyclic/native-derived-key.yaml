# A polynomial of the key index is XORed with an embedded byte table; the
# resulting key is then applied cyclically to a payload buffer. Verified in
# both directions of the native command channel. Key bytes, arithmetic salts,
# table addresses and stack slots are not signatures.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98
traits:
  - id: x64-derived-key-cyclic-buffer-xor
    desc: x86-64 buffer XOR with derived cyclic key
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: '8D 42 ?? 0F AF C2 83 C0 ?? 32 04 11 41 88 04 10 48 83 C2 01 48 83 FA ?? 75 ?? [20-100] 0F B6 04 14 30 04 0F 48 83 C1 01 48 39 CE 75 ??'
  - id: i386-derived-key-cyclic-buffer-xor
    desc: i386 buffer XOR with derived cyclic key
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: '8D 42 ?? 0F AF C2 83 C0 ?? 32 84 0A ?? ?? ?? ?? 88 04 17 83 C2 01 83 FA ?? 75 ?? [20-64] 0F B6 44 04 ?? 30 04 0B 83 C1 01 39 CE 75 ??'
  - id: powerpc-derived-key-cyclic-buffer-xor
    desc: PowerPC buffer XOR with derived cyclic key
    arch: [powerpc]
    if:
      type: hex
      section: .text
      pattern: '7D 29 61 D6 39 4A ?? ?? 7D 4A 02 78 39 29 ?? ?? 99 47 ?? ?? 7D 29 5A 78 99 26 ?? ?? 42 00 FF ?? [40-80] 7D 29 50 50 39 29 ?? ?? 7D 29 0A 14 89 29 ?? ?? 7D 29 42 78 7D 23 51 AE 39 4A 00 01 42 00 FF ??'
