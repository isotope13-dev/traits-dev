# This encoding is meaningful in a real-mode COM image. In opaque 32-bit
# shellcode the same bytes can start inside a ModRM byte or displacement.
defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_max: 65536
traits:
  - id: dos-register-byte-xor-loop
    desc: DOS register byte XOR loop
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: '30 ?? [0-2] 4? [0-2] E2'
