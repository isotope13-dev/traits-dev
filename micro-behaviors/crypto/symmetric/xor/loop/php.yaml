defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  # Formerly uuid-xor-array-index under objectives/anti-static. The same
  # matcher has no UUID or concealment requirement; retain it as XOR mechanics.
  - id: php-repeating-key-index-xor
    desc: PHP XOR uses modulo key indexing
    crit: notable
    conf: 0.88
    mbc: C0027.001
    if:
      type: text
      regex: '\^\s*(ord\s*\(\s*)?\$\w+\s*\[\s*\$\w+\s*%\s*strlen'

  - id: xor-decode-loop
    desc: PHP chr/ord XOR byte transform loop
    crit: notable
    conf: 0.93
    mbc: C0027.001
    if:
      type: text
      regex: 'chr\s*\(\s*ord\s*\([^;\r\n]{1,96}\^\s*ord\s*\([^;\r\n]{1,96}%'

  - id: xor-variable-key-loop
    desc: PHP XOR indexes a repeating key
    crit: notable
    conf: 0.93
    mbc: C0027.001
    if:
      type: text
      regex: "chr\\(ord\\(.{1,20}\\^ ord\\(.{1,20}%.{0,30}strlen\\("

  - id: md5-hash-class-name
    desc: PHP class named with MD5 hash (obfuscation)
    crit: suspicious
    conf: 0.95
    mbc: B0032
    attack: T1027
    if:
      type: text
      regex: "class _[0-9a-f]{32}"
