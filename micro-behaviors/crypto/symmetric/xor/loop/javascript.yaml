defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: xor-modulo-key-loop
    desc: Loop XORs through modulo-indexed accumulator
    for: [python, javascript]
    crit: notable
    conf: 0.8
    if:
      type: metrics
      field: 'ast.xor_mod_loop_count'
      min: 1
    # Image bytes occasionally mis-typed as JS still emit this AST metric.
    unless:
      - type: path
        basename: true
        # Type detection can parse binary font programs as Python/JavaScript;
        # their encoded outline data is not a source-level XOR loop.
        regex: '(?i)\.(gif|png|jpe?g|webp|ico|bmp|svg|pfb|tiff?)$'
      - type: text
        regex: '^GIF8[79]a'
      # LaTeX style files are classified as Python; `\^^` catcode escapes and
      # macro arithmetic are not a source-level XOR loop.
      - id: metadata/file/extension/identity::tex-source-extension
      # Zipapps and other script/binary polyglots (a shebang followed by a ZIP
      # or other packed blob) are typed as source and parsed as such; the AST
      # recovered from the compressed bytes is noise, not a real XOR loop.
      - id: metadata/file/metrics::high-byte-script-text
      - id: metadata/package/testing/harness/runtime::obfuscated-mocked-network-test-harness
      # Jennifer websocket helpers use XOR framing; .j is not Python malware.
      - id: well-known/app/development/jennifer::recognized-source
      - id: metadata/file/extension/identity::sorbet-stub-extension

  - id: js-xor-loop
    desc: Custom XOR decoding loop in JavaScript
    crit: suspicious
    conf: 0.9
    mbc: B0032
    attack: T1027
    if:
      type: text
      # Require reconstruction through fromCharCode: a charCodeAt XOR loop
      # alone also describes ordinary non-cryptographic hashes such as FNV-1a.
      regex: 'for\s*\(.{0,40}\)\s*\{.{0,40}\^=.{0,40}fromCharCode\s*\('
    unless:
      - id: metadata/library/runtime/
      - id: metadata/library/structure/
      - id: well-known/app/storage/bruno::app-bundle
    not:
      - substr: fnv1aHash
      - substr: 'hash ^= str.charCodeAt'
      - substr: '2166136261'
      - substr: '16777619'
      - substr: '0x811c9dc5'
      - substr: '0x01000193'
      - substr: 'h2 ^= str.charCodeAt'
      - substr: "I=Math.imul(I,R)"
      - substr: 'svgNS="http://www.w3.org/2000/svg"'
      - substr: 'for(i in t)try{r.push(m(t[i],'
      - substr: 'for(i in t)try{r.push(a(t[i],'
      - substr: 'for(n in e)try{r.push(g(e[n],t-1))'
  - id: js-xor-charcode-assignment
    desc: XOR charCode assignment in loop
    crit: suspicious
    conf: 0.92
    mbc: B0032
    attack: T1027
    unless:
      - id: metadata/library/structure/
      - id: well-known/app/media/docpro::mdland-api-xor-helper
      - id: metadata/package/testing/harness/fixture::jsimplifier-benignjs-corpus-path
    if:
      type: text
      regex: 'for\s*\(.{0,30}\)\s*\{.{0,30}charCodeAt\([^)]{0,12}\)\^[A-Za-z_$]'
  # A repeating-key XOR is one expression -- `out[i] = data[i] ^ key[i %
  # key.length]` -- so match it as one, not as two generic shards joined by
  # proximity. The previous form was a composite of `[i]^k[` plus `x[i %
  # x.length]` with near_bytes: 512, and both shards are common enough that a
  # large bundle supplies each from unrelated code: Kombai's 12.7 MB vendor
  # bundle matched on the `ws` package's RFC 6455 frame masking (`n[r+o]=e[o]^
  # t[3&o]`, no key length at all) and, 47 KB away, jsbn's RC4 key schedule
  # (`e[t%e.length]`, no XOR). Neither is a repeating-key XOR loop, and the
  # proximity constraint did not hold them together at that size.
  # Same primitive as xor-modulo-key-loop: a repeating-key XOR is a useful
  # capability (EPUB font obfuscation, WebSocket masking, simple secret
  # transport), not rarely-legitimate by itself. Keep notable; hostile
  # staging composites add eval / carrier context for intent.
  - id: js-byte-array-xor-modulo-key-loop
    desc: JavaScript XOR loop uses repeating key
    crit: notable
    conf: 0.96
    mbc: B0032
    attack: T1027
    if:
      type: text
      regex: '\[[\w$]+\]\s*\^=?\s*[\w$]+\[[\w$]+\s*%\s*[\w$]+\.length\]'
    unless:
      - id: metadata/package/testing/harness/runtime/
