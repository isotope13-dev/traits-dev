# Repeating-key and assembled-key XOR source references.
defaults:
  platforms: [windows, unix]
  for: [python, text]
  mbc: B0032
  attack: T1027
traits:
  - id: python-repeating-key-xor-hex
    desc: Python repeating-key XOR cipher with hex output
    crit: notable
    conf: 0.9
    # The canonical key-repetition slice - (key * (n // len(key) + 1))[:n] -
    # hand-rolled beside ord/chr XOR; libraries implement this internally.
    if:
      type: text
      regex: '\*\s*\(len\([\w.]+\)\s*//\s*len\([\w.]+\)\s*\+\s*1\s*\)+\[:len\([\w.]+\)\]'
  - id: python-xor-assembled-key-constant
    desc: Python XOR-assembles key material at import
    crit: notable
    conf: 0.9
    # Key material constructed at import from two large XORed integer
    # literals - the keys never exist as readable data in the file.
    if:
      type: text
      regex: '(?i)\(\s*\d{8,}\s*\^\s*\d{8,}\s*\)\s*&\s*\w*mask'
