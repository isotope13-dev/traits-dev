# Python single-byte XOR decode loops: `bytes([a ^ k for a in ...])` list
# comprehensions that decode an embedded blob. Production crypto uses
# libraries; hand-rolled XOR in source marks an embedded payload decoder.
# MBC: B0032 (Obfuscated Files or Information)
# ATT&CK: T1027 (Obfuscated Files or Information)
defaults:
  platforms: [windows, unix]
  for: [python]
  mbc: B0032
  attack: T1027
traits:
  - id: python-xor-bytes-comprehension
    desc: Python XOR bytes comprehension
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'bytes\s*\(\s*\[[^\]\n]{0,80}\^'
