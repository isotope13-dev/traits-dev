# Python single-byte XOR decode loops: `bytes([a ^ k for a in ...])` list
# comprehensions that decode an embedded blob. Production crypto uses
# libraries; hand-rolled XOR in source marks an embedded payload decoder.
# MBC: B0032 (Obfuscated Files or Information)
# ATT&CK: T1027 (Obfuscated Files or Information)
defaults:
  platforms: [windows, unix]
  for: [python, text]
  mbc: B0032
  attack: T1027
traits:
  - id: python-xor-bytes-comprehension
    desc: Python XOR bytes comprehension
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'bytes\s*\(\s*\[?[^)\]\n]{0,80}\^'

  - id: python-repeating-key-xor-hex
    desc: Python repeating-key XOR cipher with hex output
    crit: notable
    conf: 0.9
    # The canonical key-repetition slice - (key * (n // len(key) + 1))[:n] -
    # hand-rolled beside ord/chr XOR; libraries implement this internally.
    if:
      type: text
      regex: '\*\s*\(len\([\w.]+\)\s*//\s*len\([\w.]+\)\s*\+\s*1\s*\)+\[:len\([\w.]+\)\]'
