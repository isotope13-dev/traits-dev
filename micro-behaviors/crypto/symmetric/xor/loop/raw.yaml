defaults:
  platforms: [windows]
  for: [data]
  size_min: 65536
  size_max: 2097152
  attack: T1140
  mbc: C0026

traits:
  - id: x86-dword-feedback-decoder
    desc: X86 feedback-XOR dword payload decoder
    crit: suspicious
    conf: 0.995
    if:
      type: hex
      offset_range: [0, 128]
      # Position-independent loop: decode a dword, feed its plaintext back
      # into the next XOR key, then jump directly into the decoded buffer.
      # Register ModRM bytes vary between generated x86 envelopes.
      pattern: '5A 8B ?A 83 C2 04 8B ?? 31 ?? 83 C2 04 52 8B 0A 31 ?? 89 0A 31 ?? 83 C2 04 83 ?? 04 31 C9 39 ?? 74 02 EB EA 5? FF E? E8 D4 FF FF FF'
