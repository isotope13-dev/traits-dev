defaults:
  crit: notable
  platforms: [macos]
  for: [macho]
traits:
  - id: arm64-repeating-key-buffer-decode
    desc: ARM64 repeating-key XOR decoder
    conf: 0.95
    arch: [aarch64]
    if:
      type: hex
      pattern: "E8 07 40 F9 1F 01 02 EB 6A 01 00 54 E8 07 40 F9 09 0D C3 9A 29 A1 03 9B 29 68 69 38 0A 68 68 38 29 01 0A 4A 09 68 28 38 08 05 00 91 E8 07 00 F9 F4 FF FF 17"
      section: .text
  - id: arm64-indexed-dword-table-decode
    desc: ARM64 indexed XOR table decoder
    conf: 0.93
    arch: [aarch64]
    if:
      type: hex
      pattern: "E8 0F 80 B9 49 78 A8 B8 29 F5 7E D3 6A 68 69 B8 4A 01 04 4A 6A 68 29 B8 08 05 00 11 E8 0F 00 B9 1F 01 01 6B EB FE FF 54"
      section: .text
  - id: x64-repeating-key-buffer-decode
    desc: x64 repeating-key XOR buffer loop
    conf: 0.98
    arch: [x86-64]
    if:
      type: hex
      section: .text
      # Complete helper: signed index bounds, key-index remainder, byte XOR,
      # counter update, backward branch and return. No keys or data constants.
      pattern: "49 89 D0 48 C7 44 24 F8 00 00 00 00 4C 39 44 24 F8 7D 31 66 2E 0F 1F 84 00 00 00 00 00 0F 1F 00 4C 8B 4C 24 F8 4C 89 C8 48 99 48 F7 F9 0F B6 04 16 42 30 04 0F 49 FF C1 4C 89 4C 24 F8 4C 39 44 24 F8 7C DC C3"
composite_rules:
  - id: repeating-key-buffer-decode
    desc: Repeating-key XOR buffer loop
    conf: 0.95
    any:
      - id: arm64-repeating-key-buffer-decode
      - id: x64-repeating-key-buffer-decode
