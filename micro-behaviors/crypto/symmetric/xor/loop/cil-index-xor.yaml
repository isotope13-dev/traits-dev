defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # CIL byte-array update: ldelema; dup; ldobj; key[index % key.Length];
  # ldelem.u1; xor; conv.u1; stobj; increment; backward conditional branch.
  # Metadata row numbers and local-slot
  # spellings vary across builds. This is a transform, not an exfiltration
  # claim, and requires neither a campaign key nor a reporting endpoint.
  - id: cil-modulo-key-byte-array-xor
    desc: CIL byte XOR loop with modulo-indexed key
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '8F ?? ?? ?? 01 25 71 ?? ?? ?? 01 (06|07|08|09) (06|07|08|09) (06|07|08|09) 8E 69 5D 91 61 D2 81 ?? ?? ?? 01 (06|07|08|09) 17 58 (0A|0B|0C|0D) [0-24] 2D (8?|9?|A?|B?|C?|D?|E?|F?)'
  - id: cil-byte-array-keyed-xor
    desc: CIL state and key byte XOR
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '03 11 ?? 91 08 61 07 11 ?? 91 61 B4 9C'
  - id: cil-static-byte-array-index-xor
    desc: CIL indexed byte-array XOR
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # ldloc.0; ldsfld; ldloc.0; ldelem.u1; ldloc.0; xor;
      # ldc.i4; xor; conv.u1; stelem.i1. No external-call semantics assumed.
      pattern: '06 7E ?? ?? ?? 04 06 91 06 61 20 ?? ?? ?? ?? 61 D2 9C'
  - id: cil-indexed-key-byte-array-xor-loop
    desc: CIL repeating-key XOR of byte arrays
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Byte array[index] ^= key[index % key.Length], then advance index
      # and branch while the input remains. Metadata token bytes are skipped.
      pattern: '02 07 02 07 91 06 07 06 8E 69 5D 91 61 D2 9C 07 17 58 0B 07 02 8E 69 32 ?? ??'
