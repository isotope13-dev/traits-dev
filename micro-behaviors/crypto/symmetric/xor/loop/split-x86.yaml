defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  crit: notable
traits:
  - id: x86-split-xor-byte-helper
    desc: x86 XOR byte helper over two buffers
    conf: 0.96
    if:
      type: hex
      section: text
      pattern: '8B 06 32 C1 C3'
  - id: x86-cyclic-key-helper-loop
    desc: x86 helper loop rewinds repeating XOR key
    conf: 0.97
    if:
      type: hex
      section: text
      # Preserve key length, process one byte, and rewind ESI on key exhaustion.
      pattern: '8B D8 57 53 53 E8 ?? ?? ?? ?? 85 C0 74 07 49 75 ?? 5B 5B 5F C3 5B 2B F3 53 EB ??'
