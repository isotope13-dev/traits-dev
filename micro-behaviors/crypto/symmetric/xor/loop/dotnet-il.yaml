defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # CIL loop: take two-character substrings, Convert.ToByte(..., 16), then
  # XOR each decoded byte with a repeating key. Metadata tokens are wildcarded
  # because their row numbers vary between managed builds.
  - id: dotnet-hex-byte-repeating-xor-loop
    desc: Hex bytes decoded with repeating XOR
    crit: notable
    conf: 0.99
    attack: T1140
    mbc: C0043
    if:
      type: hex
      section: .text
      pattern: '08 1F 20 2F ?? 07 08 18 5B 03 08 18 6F ?? ?? ?? ?? 1F 10 28 ?? ?? ?? ?? 9C [0-16] 08 18 5B 1F 10 59 0D 06 09 03 08 18 6F ?? ?? ?? ?? 1F 10 28 ?? ?? ?? ?? 07 09 07 8E 69 5D 91 61 D2 9C'
