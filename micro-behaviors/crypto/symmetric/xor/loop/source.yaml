# Source-level repeating-key XOR transforms.
#
# A repeating-key XOR loop is not malicious by itself: it is a useful primitive
# in protocols and file formats. Keep this capability notable and let loader
# composites add the payload, executable-memory, or cleanup context.
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, go, rust, python, javascript, typescript, powershell]
  attack: T1027,T1140

traits:
  - id: source-xor-modulo-loop
    desc: Source XOR loop with repeating key
    crit: notable
    conf: 0.92
    for: [c, cpp, rust]
    if:
      type: metrics
      field: ast.xor_mod_loop_count
      min: 1
    unless:
      # `b[i/64] ^= (1ull << (i % 64))` is a bitfield toggle, not a repeating
      # key: the modulus is the machine word width and the XOR operand is a
      # shifted 1, never a byte drawn from a key buffer. The AST metric counts
      # the XOR-plus-modulo shape and cannot tell the two apart.
      - type: text
        regex: '\^=\s*[(~]*\s*1[uU]*[lL]*\s*<<'

  - id: indexed-xor-array-assignment
    desc: Indexed array XOR assignment
    crit: notable
    conf: 0.84
    for: [c, cpp]
    if:
      type: text
      regex: '\]\s*=\s*[A-Za-z_]\w*\s*\[[^\n]{0,20}\]\s*\^\s*[A-Za-z_]\w*\['

composite_rules:
  - id: source-repeating-key-xor-loop
    desc: Source-level repeating-key XOR transform
    crit: notable
    conf: 0.94
    any:
      - id: source-xor-modulo-loop
      - id: micro-behaviors/crypto/symmetric/xor/loop::xor-modulo-key-loop
      - id: micro-behaviors/crypto/symmetric/xor/loop::repeating-key-indexed-bxor-loader
