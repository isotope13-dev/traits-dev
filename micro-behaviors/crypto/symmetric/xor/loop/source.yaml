# Source-level repeating-key XOR transforms.
#
# A repeating-key XOR loop is not malicious by itself: it is a useful primitive
# in protocols and file formats. Keep this capability notable and let loader
# composites add the payload, executable-memory, or cleanup context.
defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [c, cpp, csharp, go, rust, python, javascript, typescript, powershell]
  attack: T1027,T1140

traits:
  - id: csharp-byte-xor-modulo-loop
    desc: C# byte XOR with a modulo-indexed operand
    conf: 0.92
    for: [csharp]
    if:
      type: metrics
      field: ast.xor_mod_loop_count
      min: 1

  - id: go-xor-modulo-indexed-operand
    desc: Go XOR uses a modulo-indexed operand
    conf: 0.9
    for: [go]
    if:
      type: text
      regex: '\^\s*\w+\[\s*\w+\s*%\s*len\('

composite_rules:
  - id: csharp-utf8-byte-xor-transform
    desc: C# transforms UTF-8 bytes with modulo-indexed XOR
    conf: 0.9
    for: [csharp]
    all:
      - id: csharp-byte-xor-modulo-loop
      - id: micro-behaviors/data/encode/charset::dotnet-utf8-getbytes
