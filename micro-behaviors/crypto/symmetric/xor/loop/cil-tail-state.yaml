defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: cil-tail-byte-xor-state
    desc: CIL XORs an array's last byte
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Same argument supplies array and length. Allow static/instance
      # argument slots, checked/unchecked subtraction and variable masks.
      pattern: '(02 02|03 03|04 04) 8E 69 17 (59|DA) 91 (1F ??|20 ?? ?? ?? ??) 61'
  - id: cil-getter-bound-index-reset
    desc: CIL getter-bound index reset
    crit: component
    conf: 0.95
    if:
      type: hex
      section: .text
      # ldloc key-index; ldarg key; callvirt length; subtract one;
      # compare; branch; reset index. Callee requires separate evidence.
      pattern: '11 ?? 04 6F ?? ?? ?? 0A 17 DA FE 01 13 ?? 11 ?? 2C ?? 16 13 ??'
