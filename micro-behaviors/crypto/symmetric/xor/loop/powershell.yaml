defaults:
  platforms: [windows]
  for: [powershell]
  mbc: B0032.002

traits:
  - id: indexed-bxor-loop
    desc: PowerShell indexed XOR loop
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\$\w+\s*\[\s*\$_\s*\]\s*-bxor\s*\$\w+\s*\[\s*\$_\s*%\s*\$\w+\.Length\s*\]'

  - id: indexed-bxor-key-loop
    desc: PowerShell byte array XOR decoder
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\$\w+\[\s*\$\w+\s*\]\s*=\s*\$\w+\[\s*\$\w+\s*\]\s*-bxor\s+\d+'

  - id: repeating-key-indexed-bxor-loop
    desc: PowerShell repeating-key XOR loop
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\$\w+\s*\[\s*\$\w+\s*\]\s*-bxor\s+\$\w+\s*\[\s*\$\w+\s*%\s*\$\w+\.Length\s*\]'

  # Crypters commonly cast the selected key byte to [char] or [int]. Keep
  # those pieces separate so the matcher remains short and future syntax
  # changes do not require an unbounded expression.
  - id: repeating-key-xor-indexed-assignment
    desc: PowerShell indexed XOR assignment
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\$\w+\s*\[\s*\$\w+\s*\]\s*=\s*.{0,80}-bxor\b'

  - id: repeating-key-xor-accumulation
    desc: PowerShell XOR accumulation
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '\$\w+\s*\+=\s*[\s\S]{0,120}-bxor\b'

  - id: repeating-key-indexed-selection
    desc: PowerShell repeating-key byte selection
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '\$\w+\s*\[\s*\$\w+\s*%\s*\$\w+(\.Length)?\s*\]'

  - id: repeating-key-byte-selection
    desc: PowerShell XOR loop key-byte selection
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\$\w+\s*=\s*\$\w+\[\s*\$\w+\s*%\s*\$\w+\.Length\s*\]'

  # ErrTraffic's PowerShell stage XORs each converted character with a scalar
  # key. Keep the cast sequence atomic and compose it with hex conversion
  # below so unrelated XOR and conversion calls remain separate.
  - id: powershell-bxor-charcode
    desc: PowerShell XOR character cast
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)-bxor\s*\[int\]\s*\[char\]\s*\$[A-Za-z_][A-Za-z0-9_]*'

  - id: indexed-bxor-key-variable
    desc: PowerShell XOR assignment with key variable
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\$\w+\s*\[\s*\$\w+\s*\]\s*=\s*\$\w+\s*\[\s*\$\w+\s*\]\s*-bxor\s+\$\w+'

composite_rules:
  - id: hex-pair-bxor-charcode
    desc: PowerShell hex-pair XOR decoder
    crit: suspicious
    conf: 0.95
    near_lines: 8
    all:
      - id: powershell-bxor-charcode
      - id: micro-behaviors/data/decode/hex::powershell-convert-toint32-radix16

  - id: repeating-key-xor-via-key-variable
    desc: PowerShell repeating-key XOR via key variable
    crit: suspicious
    conf: 0.95
    near_lines: 8
    all:
      - id: repeating-key-byte-selection
      - id: indexed-bxor-key-variable

  - id: repeating-key-xor-assignment
    desc: PowerShell indexed repeating-key XOR assignment
    crit: notable
    conf: 0.98
    near_lines: 3
    all:
      - id: repeating-key-xor-indexed-assignment
      - id: repeating-key-indexed-selection

  - id: repeating-key-indexed-bxor-loader
    desc: PowerShell repeating-key XOR decoder
    crit: suspicious
    conf: 0.95
    any:
      - id: repeating-key-indexed-bxor-loop
      - id: repeating-key-xor-via-key-variable
      - id: repeating-key-cast-indexed-loop

  - id: repeating-key-cast-indexed-loop
    desc: PowerShell casted repeating-key XOR loop
    crit: suspicious
    conf: 0.95
    near_lines: 8
    all:
      - id: repeating-key-indexed-selection
    any:
      - id: repeating-key-xor-indexed-assignment
      - id: repeating-key-xor-accumulation
