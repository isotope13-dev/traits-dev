defaults:
  platforms: [windows]
  for: [powershell]
  mbc: B0032.002

traits:
  - id: indexed-bxor-loop
    desc: PowerShell indexed XOR loop
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '\$\w+\s*\[\s*\$_\s*\]\s*-bxor\s*\$\w+\s*\[\s*\$_\s*%\s*\$\w+\.Length\s*\]'

  - id: indexed-bxor-key-loop
    desc: PowerShell byte array XOR decoder
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\$\w+\[\s*\$\w+\s*\]\s*=\s*\$\w+\[\s*\$\w+\s*\]\s*-bxor\s+\d+'

  - id: repeating-key-indexed-bxor-loop
    desc: PowerShell repeating-key XOR loop
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\$\w+\s*\[\s*\$\w+\s*\]\s*-bxor\s+\$\w+\s*\[\s*\$\w+\s*%\s*\$\w+\.Length\s*\]'

  - id: repeating-key-xor-accumulation
    desc: PowerShell XOR accumulation
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\$\w+\s*\+=\s*[\s\S]{0,120}-bxor\b'

  - id: repeating-key-byte-selection
    desc: PowerShell XOR loop key-byte selection
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\$\w+\s*=\s*\$\w+\[\s*\$\w+\s*%\s*\$\w+\.Length\s*\]'

  # ErrTraffic's PowerShell stage XORs each converted character with a scalar
  # key. Keep the cast sequence atomic and compose it with hex conversion
  # below so unrelated XOR and conversion calls remain separate.
  - id: powershell-bxor-charcode
    desc: PowerShell XOR character cast
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)-bxor\s*\[int\]\s*\[char\]\s*\$[A-Za-z_][A-Za-z0-9_]*'

  # Pipeline decoders commonly transform each byte (`$_`) with one scalar
  # key and immediately cast the result to a character. This is a different
  # shape from the indexed/repeating-key loops above, but the same neutral XOR
  # primitive; execution intent belongs in a consuming objective rule.
  - id: powershell-scalar-bxor-char
    desc: PowerShell scalar XOR character cast
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\[char\]\s*\(\s*\$_\s*-bxor\s*\$[A-Za-z_][A-Za-z0-9_.:]*\s*\)'

  - id: indexed-bxor-byte-cast-rhs
    desc: PowerShell byte-cast indexed XOR assignment
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\[\s*byte\s*\]\s*\(\s*\$\w+\s*\[\s*\$\w+\s*\]\s*-bxor\s+\$\w+'

composite_rules:
  - id: powershell-pipeline-scalar-bxor-char
    desc: PowerShell pipeline XOR character transform
    crit: notable
    conf: 0.96
    near_lines: 3
    all:
      - id: powershell-scalar-bxor-char
      - id: micro-behaviors/data/control-flow/loop::powershell-foreach-object-call

  - id: hex-pair-bxor-charcode
    desc: PowerShell hex-pair XOR decoder
    crit: suspicious
    conf: 0.95
    near_lines: 8
    all:
      - id: powershell-bxor-charcode
      - id: micro-behaviors/data/decode/hex::powershell-convert-toint32-radix16

  - id: repeating-key-xor-via-key-variable
    desc: PowerShell repeating-key XOR via key variable
    crit: suspicious
    conf: 0.95
    near_lines: 8
    all:
      - id: repeating-key-byte-selection
      - id: micro-behaviors/data/encoding/xor::powershell-indexed-xor-variable
