defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
  size_max: 52428800
traits:
  - id: asm-loop-op
    conf: 0.7
    crit: suspicious
    desc: Detects arithmetic op used in encryption loops
    if:
      type: text
      regex: (xor|sub|add)\s+(byte|dword)\s+ptr\s+\[.+?\],
      section: .text
  - id: asm-loop-reg
    conf: 0.7
    crit: component
    desc: 'register operands common in crypto loops'
    arch: [x86, x86-64]
    if:
      type: text
      regex: \],\s+(al|e[abcd]x)\b
      section: .text
  - id: asm-loop-control-transfer
    conf: 0.7
    crit: baseline
    desc: Detects loop/jump control transfer in assembly
    if:
      type: text
      regex: \b(loop|jb|jmp)\s+\w+
      section: .text
  - id: backward-byte-xor-loop-i386
    conf: 0.88
    crit: suspicious
    desc: Reverse indexed byte XOR decrypt loop
    if:
      type: hex
      section: .text
      pattern: 8A 44 ?? FF 30 04 ?? 49 83 F9 02 7D ??
  - id: x64-xor-indexed-byte-loop
    desc: x64 XOR decrypts indexed byte buffer
    crit: notable
    conf: 0.85
    for:
      - pe
    if:
      type: hex
      section: .text
      pattern: 32 ?4 ?? 48 FF C0 48 39

  - id: x86-indexed-byte-xor-transform-loop
    desc: x86 byte XOR transform loop
    crit: notable
    conf: 0.93
    attack: T1140
    arch: [x86]
    for: [pe, dll]
    if:
      type: hex
      section: .text
      # A byte is widened, XOR-transformed, stored back, and followed by a
      # backward branch. The gaps allow compiler register/stack variations;
      # the combination is more specific than a standalone XOR instruction.
      pattern: '0F B6 ?? ?? 33 ?? ?? 88 ?? ?? [0-128] E9 ?? ?? ?? ??'

  - id: x64-xor-imm8-widen-loop
    desc: XOR byte then zero-extend
    crit: baseline
    conf: 0.85
    arch: [x86-64]
    for: [pe]
    if:
      type: hex
      section: .text
      pattern: 80 f? ?? 0F B6

  - id: x64-xor-immediate-byte-loop
    desc: x64 XOR immediate byte decode loop
    crit: notable
    conf: 0.9
    attack: T1140
    arch: [x86-64]
    for: [pe]
    if:
      type: hex
      section: .text
      pattern: '0F B6 ?? ?? 83 F? ?? 88 ?? ?? 48 83 C0 01 48 3D ?? ?? 00 00 75 ??'

  - id: x64-mask-xor-buffer-loop
    desc: x64 masked XOR buffer transformation loop
    crit: notable
    conf: 0.93
    attack: T1140
    arch: [x86-64]
    for: [pe]
    if:
      type: hex
      section: .hxtics
      # A byte is combined with a mask-derived byte, written to a second
      # buffer, and the loop advances three indexes. This is deliberately
      # register-agnostic and does not depend on a payload's constants.
      pattern: '44 30 ?? 40 F6 ?? 40 22 ?? ?? 44 30 ?? 42 88 ?? ?? 49 FF C? 49 FF C? 49 FF C? 45 39 ?? 75 ??'

  - id: x64-rolling-byte-xor-decode-loop
    desc: x64 rolling-key XOR byte decode loop
    crit: notable
    conf: 0.98
    attack: T1140
    platforms: [windows]
    arch: [x86-64]
    for: [pe, dll]
    if:
      type: hex
      section: .text
      # A backwards byte loop XORs a buffer with a changing 32-bit key and
      # updates that key with ADD and ROL after each byte. This is a payload
      # decoder rather than a fixed-key string transform.
      pattern: '41 B9 ?? ?? ?? ?? 41 BA ?? ?? ?? ?? 48 FF C9 44 30 0C 08 45 01 D1 41 D1 C1 48 85 C9 75 ??'

  - id: x64-rolling-byte-xor-decode-loop-accumulator
    desc: x64 rolling-key XOR accumulator loop
    crit: notable
    conf: 0.98
    attack: T1140
    platforms: [windows]
    arch: [x86-64]
    for: [pe, dll]
    if:
      type: hex
      section: .text
      # MSVC emits a 45 01 D1 add when the rolling key uses two extended
      # registers.  Keep the key and per-byte update constants wildcarded so
      # this describes the decoder shape rather than one sample's key.
      pattern: '41 B9 ?? ?? ?? ?? 41 BA ?? ?? ?? ?? 48 FF C9 8A 14 08 44 30 ?? 88 14 08 41 81 EA ?? ?? ?? ?? 45 01 D1 41 81 C1 ?? ?? ?? ?? 41 81 C2 ?? ?? ?? ?? 41 D1 C1 48 85 C9 75 ??'

  - id: simd-xor-punpcklbw
    desc: SIMD XOR with byte-to-word widening
    crit: baseline
    conf: 0.88
    arch: [x86-64]
    for: [pe]
    if:
      type: hex
      section: .text
      pattern: 0F 57 ?? 66 0F 60 ??

composite_rules:
  - id: native-byte-xor-loop
    desc: Native indexed byte XOR loop
    crit: component
    conf: 0.88
    any:
      - id: backward-byte-xor-loop-i386
      - id: x64-xor-indexed-byte-loop
      - id: x64-xor-immediate-byte-loop
      - id: x64-mask-xor-buffer-loop
  - id: asm-loop-any
    desc: Detects simple XOR/SUB/ADD encryption loop in assembly
    crit: suspicious
    conf: 0.7
    all:
      - id: asm-loop
      - id: asm-loop-control-transfer
  - id: asm-loop
    conf: 0.7
    crit: suspicious
    desc: Detects simple XOR/SUB/ADD encryption loop in assembly
    all:
      - id: asm-loop-op
      - id: asm-loop-reg
