# Neutral instruction evidence; callers supply any concealment or infection claim.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536

traits:
  - id: dos-fixed-key-xor-si-loop
    desc: DOS in-place fixed-key byte XOR loop
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "(8A 24 80 F4 ?? 88 24|80 34 ??) 46 E2"

  - id: dos-counted-byte-xor-si-loop
    desc: DOS counted in-place byte XOR loop
    crit: notable
    conf: 0.94
    size_max: 4096
    if:
      type: yara
      source: |
        rule dos_counted_byte_xor_si_loop {
          meta:
            filetypes = "dos_com,data"
          strings:
            $loop = { B9 ?? 00 BE ?? 01 80 34 ?? 46 E2 FA }
          condition:
            $loop in (0..256)
        }
