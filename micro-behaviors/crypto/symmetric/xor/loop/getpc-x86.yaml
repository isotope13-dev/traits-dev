defaults:
  platforms: [windows]
  for: [data]
  crit: notable
  conf: 0.99

traits:
  - id: x86-byte-xor-getpc-loop
    desc: GetPC byte XOR decoder loop
    if:
      type: hex
      # CALL supplies the payload address to POP EAX. CX bounds the loop;
      # the immediate byte is the key, not a specimen-specific constant.
      pattern: 'EB 10 58 31 C9 66 81 E9 [2] 80 30 ?? 40 E2 FA EB 05 E8 EB FF FF FF'
