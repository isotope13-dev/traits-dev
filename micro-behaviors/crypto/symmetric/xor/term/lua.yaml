# LuaJIT FFI screen capture followed by a multipart beacon.
defaults:
  platforms: [windows]
  for: [lua, text]
  attack: T1113,T1041
  mbc: C0014

traits:
  - id: lua-xor-named-routine
    desc: "Lua XOR-named function"
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: function
      regex: '^xor[A-Za-z_]*'
