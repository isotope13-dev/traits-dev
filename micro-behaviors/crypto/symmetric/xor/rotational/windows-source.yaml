defaults:
  platforms: [windows]
  for: [c]

traits:
  - id: xor-ror-sub-step-source
    desc: XOR dword instruction text
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: xor           dword ptr[edi], eax
  - id: ror-16-step-source
    desc: ROR by 16 step in source
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: ror           dword ptr[edi], 16
  - id: sub-key-step-source
    desc: Subtract key step in source
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: sub           dword ptr[edi], eax
  - id: add-rol-xor-step-source
    desc: ADD register-key instruction text
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: add           [regbase], regkey
  - id: rol-16-step-source
    desc: ROL by 16 step in source
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: rol           [regbase], 16
  - id: xor-regkey-step-source
    desc: XOR register key step in source
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: xor           [regbase], regkey
composite_rules:
  - id: xor-ror-sub-mix-source
    desc: XOR, ROR and SUB instruction text
    crit: notable
    conf: 0.98
    all:
      - id: xor-ror-sub-step-source
      - id: ror-16-step-source
      - id: sub-key-step-source
  - id: add-rol-xor-mix-source
    desc: ADD, ROL and XOR instruction text
    crit: notable
    conf: 0.99
    all:
      - id: add-rol-xor-step-source
      - id: rol-16-step-source
      - id: xor-regkey-step-source
