# Compact byte-wise rotational ciphers used around native command frames.
# These patterns include the indexed 16-byte key, XOR, one-bit rotation, and
# the three-round (+5 / -5) loop. They are algorithm shapes, not sample hashes.
defaults:
  platforms: [linux]
  for: [elf]
  mbc: B0032.002

traits:
  - id: xor-rol1-three-round-x64
    desc: Three-round indexed XOR ROL1 cipher
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '8D 14 01 83 E2 0F 8A 14 16 32 54 05 00 D0 C2 88 54 05 00 48 FF C0 39 C3 7F E6 83 C1 05 83 F9 0F 75 DC'

  - id: ror1-xor-three-round-x64
    desc: Three-round indexed ROR1 XOR cipher
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '8A 14 03 8D 34 01 83 E6 0F D0 CA 41 32 14 37 88 14 03 48 FF C0 39 C5 7F E7 83 E9 05 83 F9 FB 75 DD'

composite_rules:
  - id: three-round-xor-rotate-cipher-x64
    desc: Native three-round XOR rotate cipher pair
    crit: suspicious
    conf: 0.999
    all:
      - id: xor-rol1-three-round-x64
      - id: ror1-xor-three-round-x64

