# Blowfish source-level API. ECB mode is rare in modern apps and commonly
# used to unwrap dead-drop C2 blobs (AquilaRAT / Still Audio class).
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python, javascript, typescript, go, rust, java]
  attack: T1027
  mbc: C0027

traits:
  - id: pycrypto-blowfish-import
    desc: Imports Crypto.Cipher Blowfish
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: 'from\s+Crypto\.Cipher\s+import\s+Blowfish'

  - id: blowfish-new-call
    desc: Blowfish.new cipher constructor
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bBlowfish\.new\s*\('

  - id: blowfish-mode-ecb
    desc: Blowfish MODE_ECB constant
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bBlowfish\.MODE_ECB\b'

composite_rules:
  - id: blowfish-ecb-mode
    desc: Blowfish ECB mode constructor
    conf: 0.95
    all:
      - id: blowfish-new-call
      - id: blowfish-mode-ecb
    near_bytes: 80

  - id: blowfish-import
    desc: Imports Blowfish cipher API
    conf: 0.92
    any:
      - id: pycrypto-blowfish-import
      - id: blowfish-new-call
