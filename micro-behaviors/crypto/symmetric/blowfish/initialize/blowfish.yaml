defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python, javascript, typescript, go, rust, java]

traits:
  - id: blowfish-new-call
    desc: Blowfish.new cipher constructor
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bBlowfish\.new\s*\('

  - id: blowfish-mode-ecb
    desc: Blowfish MODE_ECB constant
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bBlowfish\.MODE_ECB\b'

composite_rules:
  - id: blowfish-ecb-mode
    desc: Blowfish constructor and ECB references
    conf: 0.95
    all:
      - id: blowfish-new-call
      - id: blowfish-mode-ecb
    near_bytes: 80

