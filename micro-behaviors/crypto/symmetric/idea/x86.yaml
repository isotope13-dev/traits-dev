# The 25-bit rotated key expansion emits 44 words after the initial eight.
# Confirmed against an independent IDEA known-answer block transformation.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-idea-key-expansion
    desc: IDEA 52-word rotated key expansion code
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: any
      pattern: '8D 70 2C 40 8B D0 8D 78 01 83 E7 07 66 8B 3C 79 83 E2 07 66 8B 1C 51 66 C1 EF 07 66 C1 E3 09 66 0B FB 66 89 7C 41 0E'
