# Native TEA-family constants and round structure. The golden-ratio delta is
# shared by TEA, XTEA, and XXTEA, so these atoms deliberately identify the
# primitive rather than attributing a specific cipher variant.
defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe, dll]
  arch: [x86, x86-64]

traits:
  - id: canonical-delta-mov
    desc: TEA delta loaded into register
    crit: component
    conf: 0.75
    if:
      type: hex
      section: .text
      pattern: B? B9 79 37 9E

  - id: canonical-delta-add-eax
    desc: TEA-family canonical delta added to EAX
    crit: component
    conf: 0.8
    if:
      type: hex
      section: .text
      pattern: 05 B9 79 37 9E

  - id: canonical-delta-stack-local
    desc: TEA delta stored in stack local
    crit: component
    conf: 0.85
    if:
      type: hex
      section: .text
      pattern: C7 ?? ?? B9 79 37 9E

composite_rules:
  - id: canonical-delta
    desc: TEA-family canonical delta constant
    crit: component
    conf: 0.8
    any:
      - id: canonical-delta-mov
      - id: canonical-delta-add-eax
      - id: canonical-delta-stack-local
