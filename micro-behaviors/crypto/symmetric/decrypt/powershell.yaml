# A decryptor call is a crypto operation, independently of any Base64 input.
defaults:
  conf: 0.95
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-create-decryptor-call
    desc: PowerShell invokes CreateDecryptor
    crit: notable
    if:
      type: tree-sitter
      query: |
        (invokation_expression
          (member_name) @method
          (argument_list)
          (#match? @method "(?i)^CreateDecryptor$")) @selection
