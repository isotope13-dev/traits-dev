# A decryptor call is a crypto operation, independently of any Base64 input.
defaults:
  conf: 0.95
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-create-decryptor-call
    desc: PowerShell calls CreateDecryptor
    crit: notable
    if:
      type: text
      regex: '(?i)\.CreateDecryptor\s*\('
