# Common .NET symmetric-decryption operations.
defaults:
  crit: notable
  for: [pe, csharp, asp, powershell, batch]
  platforms: [windows]

traits:
  - id: transform-final-block
    desc: Final-block symmetric transform operation
    conf: 0.85
    if:
      type: text
      word: TransformFinalBlock

  - id: dotnet-create-decryptor
    desc: .NET symmetric decryptor creation
    conf: 0.9
    if:
      type: text
      substr: CreateDecryptor

  # A decryption assignment is a neutral crypto operation. RAT intent comes
  # from objective composites that also require a C2/persistence field cluster.
  # Requiring a settings/config receiver and a crypt/protect helper avoids
  # treating codec state updates such as `symbol = m_Decoder.Decode(...)` as
  # encrypted implant configuration.
  - id: managed-setting-decrypt-assignment
    desc: Managed setting assigned from decryption helper
    conf: 0.94
    mbc: C0027
    for: [csharp]
    if:
      type: text
      regex: '\b(Settings|Config)\.\w+\s*=\s*\w*(Crypt|Protect)\w*\.(Decrypt|Unprotect)\s*\('

  # Repeated calls are still a neutral decryption capability. Implant intent
  # comes from objective composites that also require C2/config placeholders.
  - id: csharp-repeated-decrypt-helper-calls
    desc: C# repeatedly calls a named decryption helper
    conf: 0.9
    mbc: C0027
    for: [csharp]
    platforms: [windows, unix]
    count_min: 5
    if:
      type: text
      regex: '\b\w{0,14}[Dd]ecrypt\s*\(\s*\w{1,20}\s*\)'
