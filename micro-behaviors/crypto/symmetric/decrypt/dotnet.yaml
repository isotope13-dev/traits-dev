# Common .NET symmetric-decryption operations.
defaults:
  crit: notable
  for: [pe, csharp, asp, powershell, batch, javascript, vbs]
  platforms: [windows]
  mbc: C0027

traits:
  - id: managed-setting-decrypt-assignment
    desc: Managed setting assigned from decryption helper
    conf: 0.94
    for: [csharp]
    if:
      type: text
      regex: '\b(Settings|Config)\.\w+\s*=\s*\w*(Crypt|Protect)\w*\.(Decrypt|Unprotect)\s*\('

  # Repeated calls are still a neutral decryption capability. Implant intent
  # comes from objective composites that also require C2/config placeholders.
  - id: csharp-repeated-decrypt-helper-calls
    desc: C# repeatedly calls a named decryption helper
    conf: 0.9
    for: [csharp]
    platforms: [windows, unix]
    count_min: 5
    if:
      type: text
      regex: '\b\w{0,14}[Dd]ecrypt\s*\(\s*\w{1,20}\s*\)'

  # A `DecryptData` identifier. The BCL itself carries it (mscorlib's
  # X509/ProtectedData plumbing, System.Security), as do many crypto helpers.
  # Relocated (2026-09) from objectives/command-and-control/dropper/staging/
  # encrypted; the encrypted-reflection-loader composite pairs it with
  # Rijndael, InvokeMember and assembly-load evidence.
