# Passphrase-protected PEM private-key decryption (the ssh2/openpgp style:
# createDecipheriv('aes-256-cbc', key, iv) over an encrypted 'PEM' body with
# a filename parameter) is key-management, not hidden-payload execution.
# Bundles that import broker or deploy keys trip generic decrypt+dispatch
# pairings; this context keeps those convictions scoped to real payload runs.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: pem-key-decrypt-context
    desc: Encrypted PEM private-key decryption context
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)createDecipheriv[\s\S]{0,120}[''"]PEM[''"]|[''"]PEM[''"][\s\S]{0,120}createDecipheriv'
