defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: javascript-decrypt-method-call
    desc: Calls a JavaScript decrypt method
    crit: notable
    conf: 0.65
    mbc: C0027
    if:
      type: symbol
      kind: call
      exact: decrypt

  - id: local-decrypt-helper-import
    desc: Imports a local decryption helper
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'from\s+["''][.]{1,2}/decrypt\.[jt]s["'']|require\s*\(\s*["''][.]{1,2}/decrypt\.[jt]s["'']\s*\)'

  # "Calls a decrypt<Something>() helper" is a neutral crypto capability, so it
  # lives here rather than in a C2 dead-drop objective, where it was named
  # `browser-decrypt-call` and labelled every `cipherTransform.decryptString()`
  # in pdf.js as dead-drop machinery. Media pipelines use decryptChunk /
  # decryptSegment helpers; dead-drop decryptors use decryptData /
  # decryptPayload entry points. The dead-drop composite supplies the intent.
  - id: js-decrypt-helper-call
    desc: JavaScript decrypt helper function call
    crit: notable
    conf: 0.94
    mbc: C0027
    if:
      type: symbol
      kind: call
      regex: '(^|\.)decrypt[A-Za-z_$][A-Za-z0-9_$]*$'

  - id: cryptojs-block-cipher-decrypt-call
    desc: CryptoJS block-cipher decrypt call
    crit: notable
    conf: 0.92
    mbc: C0027
    if:
      type: symbol
      kind: call
      regex: '^CryptoJS\.(AES|DES|TripleDES|RC4)\.decrypt$'
  # UMD bundles may alias the imported CryptoJS object and expose only text
  # facts after bundling. Intent remains in composites that add staged
  # execution or another objective.
  - id: cryptojs-block-cipher-decrypt-text
    desc: CryptoJS decrypt expression
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\bcryptojs\.(AES|DES|TripleDES|RC4)\.decrypt\s*\('
      case_insensitive: true
