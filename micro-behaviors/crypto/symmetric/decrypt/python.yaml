defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
  mbc: C0027
  attack: T1027

traits:
  - id: python-decrypt-method-call
    desc: Python decrypt method call
    conf: 0.7
    unless:
      - id: well-known/app/development/jennifer/
      - type: path
        regex: '(?i)\\.j$'
    if:
      # Structured calls exclude comments and documentation examples.
      type: symbol
      kind: call
      regex: '(^|\.)decrypt$'

  # Package loaders commonly wrap the primitive in a named helper such as
  # decrypt_script().  Keep this atomic notable: the execution composites
  # still require a remote source and dynamic code execution.
  - id: python-decrypt-helper-call
    desc: Python custom decrypt helper call
    conf: 0.82
    if:
      type: symbol
      kind: call
      regex: '^decrypt_[A-Za-z_][A-Za-z0-9_]*$'
  - id: python-decrypt-and-verify
    desc: Python AEAD decrypt-and-verify call
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)decrypt_and_verify$'

  # A named decrypt routine does not establish payload staging or execution.
  - id: python-decrypt-function-def
    desc: Python defines a named decryption routine
    conf: 0.75
    if:
      type: text
      regex: '(?m)^\s*(async\s+)?def\s+[A-Za-z_]\w*decrypt\w*\s*\('
