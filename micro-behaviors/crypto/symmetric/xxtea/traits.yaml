defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
  crit: suspicious
  conf: 0.8

traits:
  - id: x86-tea-round-mix
    desc: x86 TEA-family round mixing pattern
    crit: notable
    conf: 0.96
    arch: [x86]
    for: [pe, dll]
    if:
      type: hex
      section: .text
      pattern: 8B C1 C1 E0 04 03 C2 8B D1 03 4C 24 ?? C1 EA 05 03 54 24 ?? 33 C2 33 C1

  - id: xxtea-string
    desc: XXTEA cipher name string
    crit: notable
    conf: 0.85
    for:
      - binaries
      - source
      - scripts
    if:
      type: text
      word: xxtea
      case_insensitive: true
