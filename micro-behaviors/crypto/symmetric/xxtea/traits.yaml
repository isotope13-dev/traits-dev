defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
  crit: suspicious
  conf: 0.8

traits:
  - id: x86-tea-decrypt-round
    desc: x86 TEA-family decrypt round
    crit: notable
    conf: 0.96
    arch: [x86]
    for: [pe, dll]
    if:
      type: hex
      section: .text
      pattern: 8B C1 C1 E0 04 03 C2 8B D1 03 4C 24 ?? C1 EA 05 03 54 24 ?? 33 C2 33 C1

  - id: x64-xxtea-decrypt-round
    desc: x64 TEA-family decrypt round
    crit: notable
    conf: 0.96
    arch: [x86-64]
    for: [pe, dll]
    if:
      type: hex
      section: .mrdata
      pattern: 41 81 E8 B9 79 37 9E 41 89 D1 41 C1 E1 04 41 89 D2 41 C1 EA 05 45 31 D1 41 01 D1

  - id: xxtea-string
    desc: XXTEA cipher name string
    crit: notable
    conf: 0.85
    for:
      - binaries
      - source
      - scripts
    if:
      type: text
      word: xxtea
      case_insensitive: true
