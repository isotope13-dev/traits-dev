defaults:
  for: [javascript, html, text]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: packed-xxtea-decrypt-dictionary
    desc: Packer names Base64 and XXTEA decoders
    conf: 0.98
    if:
      type: text
      regex: '\|base64decode\|.{0,40}\|xxtea_decrypt\|'
  - id: packed-tea-delta-dictionary
    desc: Packer dictionary contains TEA round delta
    conf: 0.95
    if:
      type: text
      regex: '(?i)\|0x9e3779b9\|'
  - id: script-xxtea-shift-mix
    desc: Script contains XXTEA shift mixing expression
    conf: 0.95
    if:
      type: text
      regex: '>>>5\^\w+<<2\)\+\(\w+>>>3\^\w+<<4'
