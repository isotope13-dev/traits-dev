defaults:
  for: [javascript, html, text]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: packed-xxtea-decrypt-dictionary
    desc: Packer dictionary names XXTEA decrypt routine
    conf: 0.98
    if:
      type: text
      substr: '|xxtea_decrypt|'
  - id: packed-tea-delta-dictionary
    desc: Packer dictionary contains TEA round delta
    conf: 0.95
    if:
      type: text
      regex: '(?i)\|0x9e3779b9\|'
