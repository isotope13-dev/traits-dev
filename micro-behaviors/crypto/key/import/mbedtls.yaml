# Parsing APIs establish neither server role nor embedded key material.
defaults:
  platforms:
  - windows
  - linux
  - macos
traits:
- id: mbedtls-private-key-parse-api
  desc: Mbed TLS private key parsing API
  crit: notable
  conf: 0.86
  for:
  - c
  - cpp
  - elf
  - macho
  - pe
  - dll
  if:
    type: symbol
    regex: ^mbedtls_pk_parse_key(_file)?$
