defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.94

traits:
  - id: openssl-pem-pubkey-read-import
    desc: Imports OpenSSL PEM public-key loader
    for: [elf, macho, pe, dll, so, dylib]
    if:
      type: import
      regex: '^_?PEM_read(_bio)?_(RSA_|EC_|DSA_)?PUBKEY$'

  - id: openssl-pem-pubkey-read-call
    desc: Calls OpenSSL PEM public-key loader
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      regex: '^PEM_read(_bio)?_(RSA_|EC_|DSA_)?PUBKEY$'
