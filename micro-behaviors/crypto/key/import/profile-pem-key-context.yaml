# A decipher-constructor name and PEM label occur nearby; the rule does not bind them.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: pem-key-decrypt-context
    desc: CreateDecipheriv and PEM text nearby
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)createDecipheriv[\s\S]{0,120}[''"]PEM[''"]|[''"]PEM[''"][\s\S]{0,120}createDecipheriv'
