# WebCrypto keys are only exportable when generated extractable; exporting the
# private half as JWK yields the raw key material as a JSON object.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: webcrypto-jwk-key-import-signing
    desc: JWK signing-key import call text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bimportKey\s*\(\s*["'']jwk["''][^;]{0,140}\[\s*["'']sign["'']\s*\]'
