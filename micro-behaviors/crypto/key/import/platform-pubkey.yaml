defaults:
  crit: notable
  conf: 0.92

traits:
  - id: windows-pubkey-import-api
    desc: Imports Windows public-key loader API
    platforms: [windows]
    for: [pe, dll]
    if:
      type: import
      regex: '^(BCryptImportKeyPair|CryptImportPublicKeyInfo(Ex2?)?)$'

  - id: macos-seckey-create-import
    desc: Imports Apple SecKeyCreateWithData API
    platforms: [macos, ios]
    for: [macho, dylib]
    if:
      type: import
      regex: '^_?SecKeyCreateWithData$'
