defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: asyncssh-import-private-key
    desc: Imports SSH private-key material
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: asyncssh.import_private_key
  - id: ed25519-private-key-from-bytes
    desc: Constructs Ed25519 key from private bytes
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: Ed25519PrivateKey.from_private_bytes
