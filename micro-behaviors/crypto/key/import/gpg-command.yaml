defaults:
  platforms: [windows, linux, macos]
  for: [python, javascript, typescript, csharp, go]
  crit: notable
  conf: 0.85

traits:
  - id: gpg-import-file-command
    desc: GPG import command names a key-like file
    crit: notable
    conf: 0.96
    for: [shell, scripts, source, github-actions, python, javascript, typescript, ruby, go, rust]
    if:
      type: text
      regex: '(?im)^\s*gpg2?\b[^\n]{0,120}\s--import\b[^\n]{0,120}\.(asc|gpg|key)\b'
