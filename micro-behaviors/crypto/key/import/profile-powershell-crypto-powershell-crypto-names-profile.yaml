defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
- id: powershell-crypto-names-profile
  desc: Crypto names and Rijndael reference co-occur
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/crypto/key/import::import-csp-blob-text
  - id: micro-behaviors/crypto/symmetric/aes/reference::rijndael-managed
  any:
  - id: micro-behaviors/crypto/sign::sign-data-call-name
  - id: micro-behaviors/crypto/verify::verify-data-call-name
  - id: micro-behaviors/data/collection/modify::knownfs-add-png-text
