# Private key array representations used by wallet implementations.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
- id: secret-key-array-field
  desc: Converts a secretKey field to an array
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '(?i)["'']?secretKey["'']?\s*:\s*Array\.from\s*\(\s*[\w$]{1,32}\.secretKey\s*\)'

- id: private-key-array-field
  desc: Converts a privateKey field to an array
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '(?i)["'']?privateKey["'']?\s*:\s*Array\.from\s*\(\s*[\w$]{1,32}\.privateKey\s*\)'

composite_rules:
- id: private-key-array-fields
  desc: Converts private key fields to arrays
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/crypto/key/export::secret-key-array-field
  - id: micro-behaviors/crypto/key/export::private-key-array-field

- id: labeled-private-key-array-fields
  desc: Private key array fields accompany key labels
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/crypto/key/export::private-key-array-fields
  any:
  - id: metadata/lang/source/literal/string/label::private-key-word
  - id: metadata/lang/source/naming/secret::secret-key-word
  - id: metadata/lang/source/naming/target::solana-keypair-name-proximity
