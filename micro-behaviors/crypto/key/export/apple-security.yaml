# An external representation can be a public key; the import does not prove
# private-key extraction or that key material leaves the process.
defaults:
  platforms: [macos, ios]
  for: [macho, dylib]
  crit: notable
  conf: 0.98

traits:
  - id: apple-seckey-export-import
    desc: Imports Apple key representation export API
    if:
      type: import
      exact: SecKeyCopyExternalRepresentation
