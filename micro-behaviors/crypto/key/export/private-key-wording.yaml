# Relocated from crypto/asymmetric/key with the same matchers and scope.
# The required evidence is wording, not a bound call exporting private bytes.
defaults:
  platforms: [windows, linux, macos]
  for: [python, javascript, typescript, csharp, go]
  crit: notable

traits:
  - id: private-key-export-wording
    desc: Private-key export wording
    conf: 0.9
    if:
      type: text
      regex: '(?i)(\bprivate_?key\b.{0,30}\bexport\b|\bexport\w*.{0,30}\bprivate_?key\b)'

composite_rules:
  - id: private-key-reference-with-export-wording
    desc: Private-key references near export wording
    conf: 0.92
    near_lines: 80
    all:
      - id: micro-behaviors/crypto/key/representation::crypto-private-key-reference
      - id: private-key-export-wording
