defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-export-private-key-call
    desc: Calls a private-key export method
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)export_private_key$'
  - id: python-export-public-key-call
    desc: Calls a public-key export method
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)export_public_key$'
  - id: ed25519-private-key-serialize
    desc: Serializes Ed25519 private-key material
    conf: 0.99
    if:
      type: symbol
      kind: call
      regex: '\.private_bytes$'
      receiver:
        from:
          call: '^Ed25519PrivateKey\.from_private_bytes$'
