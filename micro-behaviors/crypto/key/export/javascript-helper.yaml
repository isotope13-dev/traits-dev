defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, text]

traits:
  - id: javascript-secret-key-helper-call
    desc: Passes a private key to helper
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\b[\w$]+\s*\(\s*(this\.)?_?(secretKey|privateKey)\s*\)'
