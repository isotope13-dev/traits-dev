# PowerShell writing PEM key material out to a key file. Exporting a key is
# ordinary; where it lands is what an analyst wants to see: a key file dropped
# on the user's Desktop is a victim-facing artifact, not configuration.
defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: powershell-out-file-key-path
    desc: Pipes text to Out-File key path
    if:
      type: text
      regex: '(?i)\|\s*Out-File\b[^\n]{0,80}\.(key|pem)\b'

composite_rules:
  - id: powershell-public-key-desktop-file
    desc: Writes a PEM public key to the Desktop
    near_lines: 12
    all:
      - id: micro-behaviors/crypto/key/representation/encoded::pem-public-key-header
      - id: powershell-out-file-key-path
      - id: micro-behaviors/fs/path/user-directory::home-desktop-path-expression
