defaults:
  for:
  - pe
  platforms:
  - windows
  crit: notable
  conf: 0.94
traits:
- id: go-versioned-master-key-extraction-call
  desc: Calls versioned master-key extraction helper
  if:
    type: symbol
    kind: call
    regex: \.ExtractMasterKeyV[0-9]{1,2}$
- id: go-pipe-v20-key-retrieval-call
  desc: Calls pipe-based v20 key retrieval helper
  if:
    type: symbol
    kind: call
    substr: .PipeGetV20Key
