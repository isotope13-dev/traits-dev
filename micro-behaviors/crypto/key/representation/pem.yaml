defaults:
  platforms: [windows, linux, macos]
  for: [text, data]
  crit: notable
  conf: 0.97

traits:
  # Representation evidence, not key import, theft or a crypto operation.
  # Preserves the legacy asymmetric/key matcher and scope. The ending is
  # only an END prefix; it does not verify a matching footer or valid ASN.1.
  - id: armored-named-private-key-body-text
    desc: Named PEM private-key header and Base64 body
    if:
      type: text
      regex: '-----BEGIN [A-Z]{2,10} PRIVATE KEY-----\s+[A-Za-z0-9+/=\r\n]{200,}-----END'
