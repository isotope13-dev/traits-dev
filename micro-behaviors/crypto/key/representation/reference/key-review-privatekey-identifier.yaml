defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - binaries
  crit: notable
  conf: 0.8
traits:
- id: privatekey-identifier
  desc: Private-key identifier reference
  if:
    type: text
    regex: '(?i)\bprivate[_ -]?key(\s|["\x27:=,;)]|$)'
  unless:
  - id: well-known/lib/network/go-modules/wireguard::wgquick-privatekey-directive
