defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - binaries
  crit: notable
  conf: 0.8
traits:
- id: privatekey-identifier
  desc: Private-key identifier reference
  if:
    type: text
    word: privatekey
    case_insensitive: true
  unless:
  - id: well-known/lib/network/wireguard::wgquick-privatekey-directive
