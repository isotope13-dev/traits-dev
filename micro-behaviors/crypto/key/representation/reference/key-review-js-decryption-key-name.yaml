# Key/encoded-data declarations are neutral crypto configuration evidence.
# They do not identify executable content or establish concealment intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
traits:
  - id: js-decryption-key-name
    desc: Decryption key identifier
    crit: component
    conf: 0.75
    for: [javascript, typescript]
    if:
      type: text
      word: DECRYPTION_KEY
      case_insensitive: true
