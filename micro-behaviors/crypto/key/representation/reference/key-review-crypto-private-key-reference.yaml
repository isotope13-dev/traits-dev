defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - python
  - javascript
  - typescript
  - csharp
  - go
  crit: notable
  conf: 0.85
traits:
- id: crypto-private-key-reference
  for:
  - python
  - javascript
  - typescript
  - csharp
  - go
  - pe
  - elf
  desc: Crypto-context private-key name reference
  if:
    type: text
    regex: (?i)\b(wallet|eth|btc|crypto)\b.{0,30}\bprivate_?key\b
