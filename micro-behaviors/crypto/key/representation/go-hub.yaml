defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.95
traits:
  - id: go-hub-public-key-assignment
    desc: Sets a hub public-key field
    if:
      type: tree-sitter
      language: go
      query: |
        ((assignment_statement
          left: (expression_list (selector_expression
            field: (field_identifier) @field))) @assignment
          (#eq? @field "HubPubKey"))
