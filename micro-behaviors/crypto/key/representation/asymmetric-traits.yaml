defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - python
  - javascript
  - typescript
  - csharp
  - go
  crit: notable
  conf: 0.85
traits:
- id: pem-private-key-header
  desc: PEM private-key header
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: '-----BEGIN PRIVATE KEY-----'
- id: pem-private-key-footer
  desc: PEM private-key footer
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: '-----END PRIVATE KEY-----'
- id: pem-private-key-body
  desc: PEM private-key base64 body
  crit: notable
  conf: 0.99
  if:
    type: literal
    regex: '-----BEGIN PRIVATE KEY-----\s*[A-Za-z0-9+/=\r\n]{40,}\s*-----END PRIVATE
      KEY-----'
- id: armored-named-private-key-header
  desc: References named armored private-key header
  crit: notable
  conf: 0.95
  for:
  - go
  - scripts
  - binaries
  if:
    type: text
    regex: '-----BEGIN [A-Za-z0-9+/=]{3,32} PRIVATE KEY-----'
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
- id: openssh-private-key-footer
  desc: OpenSSH private-key footer
  crit: notable
  conf: 0.99
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: '-----END OPENSSH PRIVATE KEY-{5}'
- id: openssh-private-key-body
  desc: OpenSSH private-key base64 body
  crit: notable
  conf: 0.99
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: b3BlbnNzaC1rZXktdjE[A-Za-z0-9+/=\s]{100,}
- id: pem-public-key-header
  desc: References PEM public-key header
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  if:
    type: text
    substr: '-----BEGIN PUBLIC KEY-----'
- id: crypto-private-key-reference
  for:
  - python
  - javascript
  - typescript
  - csharp
  - go
  - pe
  - elf
  desc: Cryptographic private-key material reference
  if:
    type: text
    regex: (?i)\b(wallet|eth|btc|crypto)\b.{0,30}\bprivate_?key\b
- id: private-key-identifier
  desc: Private-key identifier
  crit: notable
  conf: 0.75
  for:
  - javascript
  - typescript
  if:
    type: text
    word: PRIVATE_KEY
    case_insensitive: true
composite_rules:
- id: embedded-pem-private-key
  desc: Embedded PEM private-key material
  crit: notable
  conf: 0.97
  near_lines: 20
  all:
  - id: pem-private-key-header
  - id: pem-private-key-body
  - id: pem-private-key-footer
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
- id: embedded-openssh-private-key
  desc: Embedded OpenSSH private-key material
  crit: suspicious
  conf: 0.98
  for:
  - scripts
  - binaries
  near_bytes: 4096
  all:
  - id: armored-named-private-key-header
  - id: openssh-private-key-body
  - id: openssh-private-key-footer
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: metadata/package/testing/presence/harness::spec-test-filename
  - id: well-known/lib/network/autobahn/
  downgrade:
    any:
    - id: metadata/path::test-directory-component
    - id: metadata/package/testing/presence/harness::test-directory
    - type: path
      case_insensitive: true
      regex: (^|\W)docs?[/\\]
