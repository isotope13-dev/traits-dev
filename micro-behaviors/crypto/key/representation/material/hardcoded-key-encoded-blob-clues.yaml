# Key/encoded-data declarations are neutral crypto configuration evidence.
# They do not identify executable content or establish concealment intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
composite_rules:
  - id: micro-behaviors/crypto/key/representation/material::hardcoded-key-with-large-blob
    desc: Key and encoded-blob context
    crit: notable
    conf: 0.97
    near_lines: 80
    any:
      - id: micro-behaviors/crypto/key/representation/material::js-passphrase-literal-const
      - id: metadata/lang/source/syntax/assignment/name::python-secret-literal-assignment
    all:
      - id: micro-behaviors/crypto/cipher/unspecified::ciphertext-blob-context
