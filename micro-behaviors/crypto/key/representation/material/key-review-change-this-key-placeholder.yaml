# Placeholder keys and constructor references do not establish HTTP C2.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, go]
composite_rules:
  - id: micro-behaviors/crypto/key/representation/material::change-this-key-placeholder
    desc: Placeholder key near crypto-key field
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/crypto/key/representation/material::change-this-key-literal
      - id: micro-behaviors/crypto/key/representation/reference::aes-key-field-token
    near_bytes: 80

