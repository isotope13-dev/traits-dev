# Key/encoded-data declarations are neutral crypto configuration evidence.
# They do not identify executable content or establish concealment intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
traits:
  - id: js-passphrase-literal-const
    desc: Literal KEY/PASSPHRASE declaration
    crit: component
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?im)^(const|let|var) +(KEY|PASSPHRASE) *= *["''][^"'']{6,80}["'']'
