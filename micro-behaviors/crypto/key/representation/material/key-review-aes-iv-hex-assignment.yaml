# Static symmetric key material is a capability.  The paired assignment
# composite is intentionally language-agnostic and does not depend on a
# particular vendor key or implementation library.
defaults:
  platforms: [windows, unix, android]
  for: [source, scripts]
  crit: notable
  conf: 0.92

traits:
  - id: aes-iv-hex-assignment
    desc: AES IV assigned as hex constant
    crit: notable
    if:
      type: text
      regex: '(?i)\bAES[_-]?IV\b\s*=\s*[\s\S]{0,48}\b[0-9a-f]{32,64}\b'
