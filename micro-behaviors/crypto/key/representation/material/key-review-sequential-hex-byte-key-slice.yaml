# Placeholder keys and constructor references do not establish HTTP C2.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, go]
composite_rules:
  - id: micro-behaviors/crypto/key/representation/material::sequential-hex-byte-key-slice
    for: [elf, macho, pe, wasm, go]
    desc: AES constructor near sequential-key reference
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/crypto/key/representation/material::sequential-placeholder-key
      - id: micro-behaviors/crypto/symmetric/aes/initialize::go-new-cipher-string
    near_bytes: 120

