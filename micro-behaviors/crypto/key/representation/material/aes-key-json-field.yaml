# A named symmetric-key field in a serialized object. The field name alone
# does not show where the key came from; objectives that claim a
# server-supplied key must pair it with server-list discovery and local
# caching of the key beside a server address.
defaults:
  platforms: [android, unix]
  for: [javascript, typescript, kotlin, java, text, dex, elf, so]
  crit: notable
  conf: 0.86

traits:
  - id: aes-key-json-field
    desc: Serialized field names an AES encryption key
    if:
      type: text
      regex: '(?i)["''](aes[._-]?key|enc[._-]?key|encryption[._-]?key|cipher[._-]?key)["'']'
      exclude_comments: true
