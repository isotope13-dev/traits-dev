# The string is a codec parameter, not an endpoint, family or campaign label.
# Ciphertext fingerprints elsewhere assume ASCII-hex MD5 of this passphrase.
defaults:
  for: [html, javascript]
  platforms: [windows]
  crit: notable
traits:
  - id: md5-browser-default-passphrase
    desc: Default browser XOR codec passphrase literal
    conf: 0.99
    if:
      type: text
      substr: '"TEST.WWW.CUTEQQ.CN"'
