# Static symmetric key material is a capability.  The paired assignment
# composite is intentionally language-agnostic and does not depend on a
# particular vendor key or implementation library.
defaults:
  platforms: [windows, unix, android]
  for: [source, scripts]
  crit: notable
  conf: 0.92

composite_rules:
  - id: micro-behaviors/crypto/key/representation/material::static-aes-key-and-iv
    desc: Static AES key and IV assignments
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/crypto/key/representation/material::aes-key-hex-assignment
      - id: micro-behaviors/crypto/key/representation/material::aes-iv-hex-assignment
