defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  - id: key-labeled-hardcoded-hex-buffer
    desc: Hardcoded key-named hex buffer
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (key|secret|password|pass)\s*[=:]\s*Buffer\.from\(['"][0-9a-fA-F]{32,}['"][,)]
