defaults:
  platforms: [windows]
  for: [scripts, binaries, source]
traits:
- id: chromium-app-bound-key-name
  desc: Chromium app-bound key name
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: Google Chromekey1
  unless:
    # Bitwarden's signed import helper decrypts app-bound keys to import
    # the user's own Chrome passwords.
    - id: well-known/app/security/bitwarden::verified-bitwarden-windows-binary
- id: chromium-app-bound-key-name-wide
  desc: Chromium app-bound key name in UTF-16
  crit: notable
  conf: 0.95
  for: [pe, dll]
  if:
    type: encoded
    encoding: wide
    exact: Google Chromekey1
  unless:
    # Bitwarden's signed import helper decrypts app-bound keys to import
    # the user's own Chrome passwords.
    - id: well-known/app/security/bitwarden::verified-bitwarden-windows-binary
