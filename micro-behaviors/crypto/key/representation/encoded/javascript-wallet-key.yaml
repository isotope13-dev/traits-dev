defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: js-bitcore-private-key-wif
    desc: Bitcore WIF private key import or export
    if:
      type: text
      regex: 'new\s+bitcore\.PrivateKey\s*\(\s*wif\s*\)|\.(to|from)WIF\s*\('

  - id: js-wallet-private-key-content-template
    desc: Formats wallet secret key into template string
    if:
      type: text
      regex: '\$\{\s*(data\.)?(privateKey|secretKey|mnemonic|seedPhrase)\s*\}'

  - id: js-wallet-validator-log-backdoor-param
    desc: Address validator accepts covert log flag
    if:
      type: text
      regex: 'function\s+isValidAddress\s*\(\s*address\s*,\s*log\s*\)'

  - id: js-wallet-constructor-passes-wif-to-validator
    desc: Passes WIF private key to address validator
    if:
      type: text
      regex: 'isValidAddress\s*\(\s*wif\s*,\s*true\s*\)'

  - id: js-deceptive-utility-function-comment
    desc: Comment notes deceptive utility function design
    if:
      type: text
      regex: '(designed to look like a legitimate utility|function name for better obfuscation)'

  - id: markdown-stealth-webhook-publish-guide
    desc: Guide describes hiding webhook in dist JS
    for: [markdown, text]
    if:
      type: text
      substr: 'Discord webhook URL is hidden in compiled/minified JavaScript'

  - id: markdown-users-dont-inspect-node-modules
    desc: Guide notes users seldom inspect node_modules
    for: [markdown, text]
    if:
      type: text
      substr: "Users typically don't inspect node_modules packages"

