defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - python
  - javascript
  - typescript
  - csharp
  - go
  crit: notable
  conf: 0.85
traits:
- id: openssh-private-key-body
  desc: OpenSSH private-key base64 body
  crit: notable
  conf: 0.99
  for:
  - scripts
  - source
  - binaries
  if:
    type: text
    regex: b3BlbnNzaC1rZXktdjE[A-Za-z0-9+/=\s]{100,}
