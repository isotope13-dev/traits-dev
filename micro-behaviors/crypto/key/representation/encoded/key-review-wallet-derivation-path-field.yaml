defaults:
  crit: notable
  platforms: [windows, linux, macos]
  # `html` added when the verbatim copies of these brand atoms in
  # objectives/credential-access/wallet/mnemonic/ were removed: those copies
  # existed only to reach phishing pages, and duplicating the matcher tripped
  # the load-time dedup gate, which hard-fails EVERY scan.
  for: [python, javascript, csharp, go, pe, elf, html]

traits:
  - id: wallet-derivation-path-field
    desc: Declares a wallet derivation-path field
    conf: 0.8
    for: [python, javascript, csharp, go]
    if:
      type: text
      regex: '\b(derivation_?path|derivationPath)\b'

  # This vocabulary is only meaningful when another rule supplies collection
  # or targeting context, so keep it as a component rather than a standalone
  # wallet-theft finding.
