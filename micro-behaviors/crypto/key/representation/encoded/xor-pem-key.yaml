defaults:
  platforms: [unix, windows]

traits:
  - id: xor-encoded-pem-key-header
    desc: Single-byte XOR-obfuscated PEM key header
    crit: suspicious
    conf: 0.98
    for: [elf, macho, pe, dll, so, dylib]
    if:
      type: yara
      source: |
        rule xor_encoded_pem_key_header {
          strings:
            $pub = "-----BEGIN PUBLIC KEY-----" xor(1-255)
            $rsa_pub = "-----BEGIN RSA PUBLIC KEY-----" xor(1-255)
            $priv = "-----BEGIN PRIVATE KEY-----" xor(1-255)
            $rsa_priv = "-----BEGIN RSA PRIVATE KEY-----" xor(1-255)
          condition:
            any of them
        }

  - id: source-byte-xor-key-loop
    desc: Indexed byte-array XOR decoding expression
    crit: notable
    conf: 0.85
    for: [c, cpp, go, rust]
    if:
      type: text
      exclude_comments: true
      regex: '\[\s*[A-Za-z_]\w*\s*\]\s*\^\s*(0x[0-9A-Fa-f]{1,2}|[1-9]\d{0,2})\b'

composite_rules:
  - id: source-xor-pem-pubkey-loader
    desc: Decodes byte-XORed PEM public key without plaintext header
    crit: suspicious
    conf: 0.95
    for: [c, cpp]
    all:
      - id: source-byte-xor-key-loop
      - id: micro-behaviors/crypto/key/import::openssl-pem-pubkey-read-call
    unless:
      - id: pem-public-key-header
