# Structured configuration fields do not prove botnet intent by themselves.
defaults:
  conf: 0.99
  platforms: [linux]
  for: [elf]

traits:
  - id: enckey-parentid-config-suffix
    desc: Encoded-key and ParentId fields
    crit: notable
    if:
      type: text
      regex: '"enckey":"[A-Za-z0-9+/=]{80,}","ParentId":"[^"]{12,24}"\}'

