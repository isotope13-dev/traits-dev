defaults:
  platforms:
    - windows
    - linux
    - macos
  for:
    - python
    - javascript
    - typescript
    - csharp
    - go
  crit: notable
  conf: 0.85

traits:
  - id: pgp-private-key-header
    desc: ASCII-armored OpenPGP private-key header
    crit: notable
    conf: 0.99
    for: [javascript, typescript, scripts, source, data, text, github-actions, zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio, apk, alpine_apk, ipa]
    if:
      type: text
      substr: '-----BEGIN PGP PRIVATE KEY BLOCK-----'
