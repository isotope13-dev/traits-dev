# Prefix is the PEM header XORed with the repeating ASCII charset name
# UTF-8, then Base64. This is a representation clue, not key validation.
defaults:
  platforms: [android]
  for: [dex]
traits:
  - id: dex-base64-utf8-xor-private-pem-header
    desc: Private PEM header under XOR and Base64
    crit: notable
    conf: 0.98
    if:
      type: literal
      substr: eHlrABUXEQFkdnUEFGRuFAADDXMQDWsAFXh5
