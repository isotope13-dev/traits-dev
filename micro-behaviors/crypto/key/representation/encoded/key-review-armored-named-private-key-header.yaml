defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - python
  - javascript
  - typescript
  - csharp
  - go
  crit: notable
  conf: 0.85
traits:
- id: armored-named-private-key-header
  desc: References named armored private-key header
  crit: notable
  conf: 0.95
  for:
  - scripts
  - source
  - binaries
  if:
    type: text
    regex: '-----BEGIN [A-Za-z0-9+/=]{3,32} PRIVATE KEY-----'
