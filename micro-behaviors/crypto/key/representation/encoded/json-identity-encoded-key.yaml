# Structured configuration fields do not prove botnet intent by themselves.
defaults:
  conf: 0.99
  platforms: [linux]
  for: [elf]

traits:
  - id: json-identity-encoded-key-material
    desc: JSON identity with encoded key material
    crit: notable
    if:
      type: text
      regex: '"config":1,"id":"[A-Za-z0-9]{12,24}","enckey":"[A-Za-z0-9+/=]{80,}'

