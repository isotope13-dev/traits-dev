defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - python
  - javascript
  - typescript
  - csharp
  - go
  crit: notable
  conf: 0.85
traits:
- id: openssh-private-key-footer
  desc: OpenSSH private-key footer
  crit: notable
  conf: 0.99
  for:
  - scripts
  - source
  - binaries
  if:
    type: text
    regex: '-----END OPENSSH PRIVATE KEY-{5}'
