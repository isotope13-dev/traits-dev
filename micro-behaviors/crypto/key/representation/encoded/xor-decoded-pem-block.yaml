defaults:
  platforms: [unix, windows]

traits:
  - id: encoded-xor-pem-key-block
    desc: XOR-decoded PEM asymmetric key block
    crit: suspicious
    conf: 0.98
    for: [python, javascript, typescript, go, rust, powershell, php]
    if:
      type: encoded
      encoding: xor
      regex: '-----BEGIN (RSA |EC |OPENSSH )?(PUBLIC|PRIVATE) KEY-----'
