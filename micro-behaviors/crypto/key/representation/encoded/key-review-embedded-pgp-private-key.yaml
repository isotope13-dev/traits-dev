defaults:
  platforms:
    - windows
    - linux
    - macos
  for:
    - python
    - javascript
    - typescript
    - csharp
    - go
  crit: notable
  conf: 0.85

composite_rules:
  - id: micro-behaviors/crypto/key/representation/encoded::embedded-pgp-private-key
    desc: Embedded ASCII-armored OpenPGP private-key material
    crit: notable
    conf: 0.97
    for: [javascript, typescript, scripts, source, data, text, github-actions, zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio, apk, alpine_apk, ipa]
    near_lines: 80
    all:
      - id: micro-behaviors/crypto/key/representation/encoded::pgp-private-key-header
      - id: micro-behaviors/crypto/key/representation/encoded::pgp-private-key-body
      - id: micro-behaviors/crypto/key/representation/encoded::pgp-private-key-footer
