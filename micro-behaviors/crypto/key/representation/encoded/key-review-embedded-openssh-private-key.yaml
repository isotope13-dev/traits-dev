defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - python
  - javascript
  - typescript
  - csharp
  - go
  crit: notable
  conf: 0.85
composite_rules:
- id: embedded-openssh-private-key
  desc: Embedded OpenSSH private-key material
  crit: suspicious
  conf: 0.98
  for:
  - scripts
  - source
  - binaries
  near_bytes: 4096
  all:
  - id: micro-behaviors/crypto/key/representation/encoded::armored-named-private-key-header
  - id: micro-behaviors/crypto/key/representation/encoded::openssh-private-key-body
  - id: micro-behaviors/crypto/key/representation/encoded::openssh-private-key-footer
  downgrade:
    any:
    - id: metadata/path/directory::test-directory-component
    - id: metadata/package/testing/harness/unit::go-test-source-file
    - id: metadata/path/directory::test-spec-source-file-component
    - id: metadata/package/testing/presence/harness::python-test-file
    - id: metadata/package/testing/presence/harness::csharp-test-file
    - type: path
      case_insensitive: true
      regex: (^|\W)docs?[/\\]
