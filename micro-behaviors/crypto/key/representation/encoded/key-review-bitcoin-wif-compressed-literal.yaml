defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - python
  - javascript
  - csharp
  - go
  - pe
  - elf
  attack: T1555
  mbc: B0028
  crit: suspicious
  conf: 0.85
traits:
- id: bitcoin-wif-compressed-literal
  desc: Compressed Bitcoin WIF-shaped literal
  crit: suspicious
  if:
    type: text
    regex: (?mi)^[ \t]*([^\s*/#][^\n]{0,60})?(wif|private).{0,12}["'][KL][1-9A-HJ-NP-Za-km-z]{51}["']
    not:
    - regex: '["''][ \t]{2,}["'']'
