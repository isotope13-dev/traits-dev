traits:
- id: hardcoded-key-byte-string
  desc: Key-named variable assigned a byte string
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)[_a-z]*(key|secret)[_a-z]*\s*=\s*b"(\\x[0-9a-fA-F]{2}){16,}"
  unless:
  - id: metadata/package/testing/presence/harness::test-directory
  - id: well-known/tool/offensive/impacket::source-tree-member
- id: key-or-iv-byte-string-assignment
  desc: Key or IV-named byte-string assignment
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)(key|iv|secret|nonce)\s*=\s*b"(\\x[0-9a-fA-F]{2}){16,}"
  unless:
  - id: metadata/package/testing/presence/harness::test-directory
  - id: well-known/tool/offensive/impacket::source-tree-member
composite_rules:
- id: hardcoded-key-or-iv-byte-material
  desc: Hardcoded key or IV byte-string material
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/crypto/key/representation::hardcoded-key-byte-string
  - id: micro-behaviors/crypto/symmetric/key::hardcoded-iv-bytes
  - id: micro-behaviors/crypto/key/representation::key-or-iv-byte-string-assignment
defaults:
  for:
  - python
  platforms:
  - windows
  - unix
