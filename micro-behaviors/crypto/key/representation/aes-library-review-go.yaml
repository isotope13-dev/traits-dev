defaults:
  platforms: [windows, linux, macos]
  for: [go]
traits:
- id: go-hardcoded-key-literal
  desc: Go key-named byte-string literal
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '\b(key|aesKey|secretKey)\s*:?=\s*\[\]byte\(\s*"[^"]{16,64}"\s*\)'
    case_insensitive: true
- id: go-hardcoded-iv-literal
  desc: Go IV-named byte-string literal
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '\biv\s*:?=\s*\[\]byte\(\s*"[^"]{8,32}"\s*\)'
    case_insensitive: true
composite_rules:
- id: go-static-key-iv
  desc: Go key and IV literals nearby
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/crypto/key/representation::go-hardcoded-key-literal
  - id: micro-behaviors/crypto/key/representation::go-hardcoded-iv-literal
  near_bytes: 256
