defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - python
  - javascript
  - csharp
  - go
  - pe
  - elf
  attack: T1555
  mbc: B0028
  crit: suspicious
  conf: 0.85
traits:
- id: bitcoin-wif-format
  desc: Bitcoin WIF private key format (word)
  crit: notable
  if:
    type: text
    word: wallet_import_format
- id: bitcoin-wif-pattern
  desc: Bitcoin WIF private key format reference
  crit: notable
  if:
    type: text
    regex: \b(wif|bitcoin)\b.{0,20}\b(wif|key|private)\b
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: well-known/lib/web/client-side/ecmascript::lean-intl-runtime-bundle
  - id: metadata/lang/source/naming/setting::intl-datetime-locale-settings
- id: bitcoin-wif-uncompressed-literal
  desc: Uncompressed Bitcoin WIF private key literal
  crit: suspicious
  if:
    type: text
    regex: (?i)(wif|private).{0,12}["']5[HJK][1-9A-HJ-NP-Za-km-z]{49}["']
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: well-known/app/finance/sidesail/
  - type: path
    regex: (^|[\\/])testchain([\\/]|$)
  - type: path
    regex: (^|[\\/])(internal[\\/](keytestcases|testcli|testchain)|pkg[\\/]neotest)([\\/]|$)
  - id: metadata/path::test-directory-component
  - id: metadata/file/extension/identity::markdown-file-basename
- id: bitcoin-wif-compressed-literal
  desc: Compressed Bitcoin WIF private key literal
  crit: suspicious
  if:
    type: text
    regex: (?mi)^[ \t]*([^\s*/#][^\n]{0,60})?(wif|private).{0,12}["'][KL][1-9A-HJ-NP-Za-km-z]{51}["']
    not:
    - regex: '["''][ \t]{2,}["'']'
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: well-known/app/finance/sidesail/
  - type: path
    regex: (^|[\\/])testchain([\\/]|$)
  - type: path
    regex: (^|[\\/])(internal[\\/](keytestcases|testcli|testchain)|pkg[\\/]neotest)([\\/]|$)
  - id: metadata/path::test-directory-component
  - id: metadata/file/extension/identity::markdown-file-basename
composite_rules:
- id: bitcoin-wif
  desc: Bitcoin WIF private key format
  crit: notable
  any:
  - id: micro-behaviors/crypto/key/representation::bitcoin-wif-format
  - id: micro-behaviors/crypto/key/representation::bitcoin-wif-pattern
  - id: micro-behaviors/crypto/key/representation::bitcoin-wif-uncompressed-literal
  - id: micro-behaviors/crypto/key/representation::bitcoin-wif-compressed-literal
