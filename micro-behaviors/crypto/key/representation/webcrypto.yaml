# WebCrypto keys are only exportable when generated extractable; exporting the
# private half as JWK yields the raw key material as a JSON object.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: webcrypto-private-key-jwk-export
    desc: Exports a WebCrypto private key as JWK
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bexportKey\s*\(\s*["'']jwk["'']\s*,\s*[\w$.]{1,64}\.privateKey\s*\)'
