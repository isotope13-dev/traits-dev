defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.8

traits:
  - id: xrpl-seed-wallet-derivation
    desc: XRPL wallet derived from seed
    if:
      type: symbol
      kind: call
      exact: XrplWallet.fromSeed
  - id: generated-private-key-fallback
    desc: Private-key generation call
    if:
      type: symbol
      kind: call
      exact: generatePrivateKey
  - id: key-pair-generation-call
    desc: Asymmetric key-pair generation call
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(create|generate)[_-]?key[_-]?pair(Sync)?$'
