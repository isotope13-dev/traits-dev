# Key generation; retained in the admitted legacy leaf until crypto/key opens.
defaults:
  platforms: [unix, windows]
  for: [go]
traits:
  - id: go-rsa-generate-key
    desc: Go RSA key generation call
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: rsa.GenerateKey
