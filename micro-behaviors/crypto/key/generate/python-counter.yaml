defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-chacha-counter-key-candidates
    desc: Tests counter-derived ChaCha20 key candidates
    crit: notable
    conf: 0.97
    size_max: 32768
    if:
      type: tree-sitter
      query: |
        ((while_statement body: (block
          (expression_statement (assignment left: (identifier) @candidate
            right: (binary_operator
              left: (parenthesized_expression (binary_operator
                left: (string) @format right: (identifier) @counted)))))
          (expression_statement (assignment left: (identifier) @result
            right: (call function: (attribute
              object: (call function: (attribute
                object: (identifier) @algorithm attribute: (identifier) @new)
                arguments: (argument_list (keyword_argument
                  name: (identifier) @key value: (identifier) @used)))
              attribute: (identifier) @encrypt))))
          (if_statement condition: (comparison_operator
            (identifier) @compared (identifier)) @comparison
            consequence: (block (return_statement (identifier) @returned)))
          (expression_statement (augmented_assignment
            left: (identifier) @counter right: (integer)) @step)))
          (#eq? @result @compared)
          (#eq? @candidate @returned)
          (#eq? @candidate @used)
          (#eq? @counted @counter)
          (#eq? @algorithm "ChaCha20")
          (#eq? @new "new")
          (#eq? @key "key")
          (#eq? @encrypt "encrypt")
          (#match? @format "%0?[0-9]*d")
          (#match? @comparison "==")
          (#match? @step "-="))
