defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: fernet-keygen-call
    desc: Calls Fernet.generate_key
    crit: notable
    conf: 0.78
    if:
      type: symbol
      kind: call
      exact: 'Fernet.generate_key'
  - id: fernet-keygen-text
    desc: Fernet key-generation call text
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: Fernet\.generate_key\s*\(
