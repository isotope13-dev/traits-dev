defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: javascript-private-key-generator-delegates-to-random-string
    desc: Private-key generator calls random-string helper
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)function\s+generatePrivateKey.{0,300}generateRandomString'

  - id: javascript-random-string-helper-uses-math-random
    desc: Random-string helper uses Math.random
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)function\s+generateRandomString.{0,450}Math\.random'

composite_rules:
  - id: javascript-private-key-generated-with-math-random
    desc: Private key uses non-cryptographic random source
    crit: suspicious
    conf: 0.96
    scope: file
    near_bytes: 12000
    all:
      - id: javascript-private-key-generator-delegates-to-random-string
      - id: javascript-random-string-helper-uses-math-random
