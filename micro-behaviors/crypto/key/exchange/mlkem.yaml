defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, python, javascript, typescript, go, rust]
  crit: notable

traits:
  - id: mlkem-encapsulation-call
    desc: Calls an ML-KEM or Kyber encapsulation API
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(?i)(ml[-_]?kem|kyber)[_-]?(512|768|1024)[.:](encapsulate|encrypt)$'

  # These APIs are also visible as imports/functions in native builds. An
  # encapsulation API is a neutral capability, including in a malware chain.
  - id: pqclean-mlkem-encapsulation-api
    desc: References a PQClean ML-KEM encapsulation API
    for: [c, cpp, rust, go, pe, elf, macho]
    conf: 0.98
    if:
      type: symbol
      regex: '^PQCLEAN_MLKEM(512|768|1024)_[A-Z0-9]+_crypto_kem_enc$'

  - id: liboqs-kem-encapsulation-api
    desc: References the liboqs KEM encapsulation API
    for: [c, cpp, rust, go, pe, elf, macho]
    conf: 0.98
    if:
      type: symbol
      exact: OQS_KEM_encaps
