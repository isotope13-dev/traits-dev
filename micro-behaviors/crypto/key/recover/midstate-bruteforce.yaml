# Building blocks for offline PRNG-seeded or public-prefix digest key recovery:
# 31-bit signed PRNG search bounds, Merkle-Damgard midstate cloning/padding, and
# inner-hex-to-outer chained digest verification loops across languages.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  mbc: C0029

traits:
  - id: bitshift-31-keyspace-bound
    desc: 31-bit integer shift search bound
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\b1[uUlL]{0,3}\s*<<\s*31\b'

  - id: int31-max-keyspace-literal
    desc: 31-bit signed integer maximum literal
    crit: component
    conf: 0.88
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\b(0x7fffffff|0x80000000|214748364[78])\b'

  - id: merkle-damgard-pad-bitlength
    desc: Appends 0x80 Merkle-Damgard pad and bitlength
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '(?is)\b0x80[uU]?\s*;.{0,240}(\*\s*8[uUlL]{0,3}|<<\s*3[uU]?)'

  - id: digest-clone-update-finalize
    desc: Clones hash state before digest finalization
    conf: 0.95
    for: [python, javascript, typescript, rust]
    if:
      type: text
      exclude_comments: true
      regex: '\.(copy|clone)\(\)[\s\S]{0,140}\.update\([\s\S]{0,140}\.(hex)?digest\('

  - id: go-marshal-unmarshal-digest-state
    desc: Clones Go hash state via MarshalBinary
    conf: 0.95
    for: [go]
    if:
      type: text
      exclude_comments: true
      regex: 'MarshalBinary\([\s\S]{0,220}UnmarshalBinary\('

  - id: chained-hex-digest-python
    desc: Chains Python hexdigest into outer digest
    conf: 0.96
    for: [python]
    if:
      type: text
      exclude_comments: true
      regex: '(?s)=\s*\w+\.hexdigest\(\).{0,120}(\.update|md5)\(.{0,90}\.hexdigest\(\)\s*=='

  - id: chained-hex-digest-node
    desc: Chains Node hex digest into outer digest
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      exclude_comments: true
      regex: '\.digest\(["'']hex["'']\)\s*;[^;{}]{1,90}\.update\([^;{}]{1,60}\)\.digest\('

  - id: chained-hex-digest-go
    desc: Chains Go hex digest into outer digest
    conf: 0.96
    for: [go]
    if:
      type: text
      exclude_comments: true
      regex: '(?s)hex\.EncodeToString\(.{0,180}(\.Write|md5\.Sum)\(.{0,140}(==|Equal\()'

  - id: chained-hex-digest-php
    desc: Chains PHP md5 calls with comparison
    conf: 0.96
    for: [php]
    if:
      type: text
      exclude_comments: true
      regex: '\bmd5\([^;{}]{1,70}\)\s*;[^;{}]{1,80}\bmd5\([^;{}]{1,70}\)\s*===?'

  - id: chained-hex-digest-c
    desc: Hashes 32-byte digest before memcmp check
    conf: 0.92
    for: [c, cpp]
    if:
      type: text
      exclude_comments: true
      regex: '\+\s*32[uUlL]?\b[^;{}]{0,80};\s*if\s*\(\s*(mem|strn)cmp\('

composite_rules:
  - id: rand31-search-space
    desc: 31-bit PRNG search-space upper bound
    crit: component
    conf: 0.92
    any:
      - id: bitshift-31-keyspace-bound
      - id: int31-max-keyspace-literal

  - id: midstate-digest-optimization
    desc: Clones or pads reusable hash midstate
    conf: 0.95
    any:
      - id: digest-clone-update-finalize
      - id: merkle-damgard-pad-bitlength
      - id: go-marshal-unmarshal-digest-state

  - id: chained-hex-digest-verification
    desc: Verifies hex digest inside outer digest
    conf: 0.96
    any:
      - id: chained-hex-digest-python
      - id: chained-hex-digest-node
      - id: chained-hex-digest-go
      - id: chained-hex-digest-php
      - id: chained-hex-digest-c
