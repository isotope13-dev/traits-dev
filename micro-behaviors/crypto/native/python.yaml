# Python crypto API references: combines the high-level cryptography package
# with ctypes-based native crypto API references. This is a dual-use capability
# clue, not evidence of payload staging or a control-flow fallback.
#
# These references support probable crypto API capability only. The matchers do
# not establish conditional control flow, a specific algorithm, or payload use.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1027
  mbc: B0032
traits:
  # A bare import of cryptography was removed: it duplicated the shared
  # imports-cryptography capability and does not establish backend selection.
- id: bcrypt-name-reference
  desc: BCrypt name reference
  crit: component
  conf: 0.95
  if:
    type: text
    substr: bcrypt
  # The bare ctypes.CDLL loader is not crypto: the co-occurrence below reuses
  # the canonical dylib/load/runtime atom.
- id: bcrypt-open-provider-name-reference
  desc: BCrypt OpenAlgorithmProvider name reference
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: OpenAlgorithmProvider
- id: bcrypt-generate-key-name-reference
  desc: BCrypt GenerateSymmetricKey name reference
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: GenerateSymmetricKey
- id: ctypes-bcrypt-load-reference
  desc: ctypes loads Windows BCrypt library
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: 'ctypes\.WinDLL\s*\(\s*["'']bcrypt(\.dll)?["'']'
  # These API-name strings indicate probable capability, not invocation.
- id: bcrypt-encrypt-name-reference
  desc: BCryptEncrypt CNG name reference
  crit: notable
  conf: 0.94
  if:
    type: text
    word: BCryptEncrypt
- id: bcrypt-decrypt-name-reference
  desc: BCryptDecrypt CNG name reference
  crit: notable
  conf: 0.94
  if:
    type: text
    word: BCryptDecrypt
- id: ctypes-bcrypt-library-reference
  desc: ctypes.WinDLL bcrypt library reference
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'WinDLL\s*\(\s*["'']bcrypt(\.dll)?["'']'
composite_rules:
- id: python-crypto-provider-cooccurrence
  desc: Python high-level and native crypto references
  crit: notable
  conf: 0.96
  any:
  - id: python-cryptography-bcrypt-cooccurrence
  - id: python-cryptography-libcrypto-cooccurrence
  downgrade:
    any:
    - id: metadata/package/testing/presence/harness/

  # File-wide co-occurrence does not prove that either backend is selected.
    - id: "metadata/file/naming::test-directory-component"
- id: python-cryptography-bcrypt-file-cooccurrence
  desc: AES and BCrypt references co-occur
  crit: notable
  conf: 0.94
  all:
  - id: bcrypt-cng-api-reference
  - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aes
  downgrade:
    any:
    - id: metadata/package/testing/presence/harness/
    - id: "metadata/file/naming::test-directory-component"
- id: python-cryptography-bcrypt-cooccurrence
  desc: Python crypto and BCrypt references co-occur
  crit: notable
  conf: 0.95
  all:
  - id: ctypes-bcrypt-load-reference
  - id: micro-behaviors/crypto/library/provider::imports-cryptography
  - id: bcrypt-name-reference
  near_bytes: 4096
- id: python-cryptography-libcrypto-cooccurrence
  desc: Python crypto and libcrypto references co-occur
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/crypto/library/provider::imports-cryptography
  - id: micro-behaviors/dylib/load/runtime::ctypes-cdll
  - id: micro-behaviors/dylib/library/ssl::libcrypto-ref
  near_bytes: 4096
- id: bcrypt-cng-api-reference
  desc: BCrypt CNG API references
  crit: notable
  conf: 0.88
  any:
  - id: bcrypt-open-provider-name-reference
  - id: bcrypt-generate-key-name-reference
  - id: ctypes-bcrypt-load-reference
  - id: bcrypt-encrypt-name-reference
  - id: bcrypt-decrypt-name-reference
  - id: ctypes-bcrypt-library-reference
