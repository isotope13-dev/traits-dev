# Decimal expansions of the NIST P-curve domain parameters. Libraries that
# initialise the curves from decimal literals (Go's crypto/elliptic tables,
# Python/JS ECC packages, Rust p256 test vectors) embed these digit runs
# verbatim, so they identify a curve implementation and nothing more.
#
# Relocated (2026-09) from well-known/malware/rat/salat, where the P-256 field
# prime was named and described as "Salat embedded RSA modulus prefix" at
# notable. It is neither RSA nor family-unique: it is
# 2^256 - 2^224 + 2^192 + 2^96 - 1, present in every binary that ships P-256
# in decimal form -- it fired on an unrelated Rust security-tooling DLL.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, source]
  crit: baseline
  conf: 0.9
  mbc: C0059

traits:
  - id: p256-field-prime-decimal
    desc: NIST P-256 field prime in decimal form
    if:
      type: text
      substr: "11579208921035624876269744694940757353008614341529031419553363130"

  - id: p384-field-prime-decimal
    desc: NIST P-384 field prime in decimal form
    if:
      type: text
      substr: "394020061963944792122790401001436138050797392704654466679482934"
