defaults:
  platforms: [unix, windows]
  for: [rust]
traits:
  - id: rust-secp256k1-import
    desc: Imports Rust secp256k1 ECDSA cryptography
    crit: notable
    conf: 0.95
    if:
      type: import
      regex: '^secp256k1(::|$)'
  # libsecp256k1 signing entry points. `sign_ecdsa` is the plain form,
  # `sign_ecdsa_recoverable` the recoverable-signature form used by
  # Ethereum-style transaction signing.
  - id: rust-secp256k1-sign-call
    desc: Signs with Rust secp256k1 ECDSA
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)sign_ecdsa(_recoverable)?$'
  - id: rust-secp256k1-verify-call
    desc: Verifies with Rust secp256k1 ECDSA
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)verify_ecdsa$'
