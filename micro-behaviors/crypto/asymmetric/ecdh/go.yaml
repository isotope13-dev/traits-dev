defaults:
  platforms: [unix, windows]
  for: [go]
  attack: T1573.001

traits:
  - id: go-ecdh-p256
    desc: Go uses an ECDH P-256 curve
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\becdh\.P256\s*\('
  - id: go-ecdh-shared-secret
    desc: Go derives an ECDH shared secret
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\.ECDH\s*\('

composite_rules:
  - id: go-ecdh-session-key-derivation
    desc: Go derives a session key from ECDH and SHA-256
    crit: notable
    conf: 0.94
    all:
      - id: go-ecdh-p256
      - id: go-ecdh-shared-secret
      - id: micro-behaviors/crypto/hash/digest::go-sha256-operation
    near_bytes: 1024
