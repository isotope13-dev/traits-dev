defaults:
  crit: notable
  platforms: [windows, unix]
  for: [pe, dll, csharp, go, rust, javascript, typescript, python, powershell]

traits:
  - id: ecdh-source-algorithm-reference
    desc: ECDH key-agreement algorithm reference
    conf: 0.88
    # OpenSSL and OpenSSH spell the API in C. The inherited list omitted it,
    # so ecdh.h and ECDH_* in C source never matched.
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\bECDH\b'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/build/generated::winmd-metadata

  - id: ecdh-binary-algorithm-reference
    desc: ECDH algorithm token or readable usage context
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)(^ECDH$|\bECDH\b[ \t:()=-]+[a-z])'

  - id: ecdh-shared-secret-derivation
    desc: ECDH shared-secret derivation wording
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bECDH\b.{0,96}\b(shared\s+secret|derive|exchange)\b'
    unless:
      - id: metadata/build/generated::winmd-metadata

composite_rules:
  - id: ecdh-api-reference
    desc: ECDH key-agreement algorithm reference
    conf: 0.88
    for: [pe, dll, scripts, source]
    any:
      - id: ecdh-source-algorithm-reference
      - id: ecdh-binary-algorithm-reference

  - id: ecdh-key-agreement
    desc: ECDH session-key agreement
    conf: 0.94
    all:
      - id: ecdh-api-reference
      - id: ecdh-shared-secret-derivation
