defaults:
  platforms: [windows, unix]
  for: [pe, dll, csharp, go, rust, javascript, typescript, python, powershell]
  attack: T1573.001

traits:
  - id: ecdh-api-reference
    desc: ECDH key-agreement API reference
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bECDH\b'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/library/generated::winmd-metadata

  - id: ecdh-shared-secret-derivation
    desc: ECDH shared-secret derivation wording
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bECDH\b.{0,96}\b(shared\s+secret|derive|exchange)\b'
    unless:
      - id: metadata/library/generated::winmd-metadata

composite_rules:
  - id: ecdh-key-agreement
    desc: ECDH session-key agreement
    crit: notable
    conf: 0.94
    all:
      - id: ecdh-api-reference
      - id: ecdh-shared-secret-derivation
