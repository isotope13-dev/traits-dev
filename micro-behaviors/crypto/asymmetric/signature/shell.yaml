defaults:
  platforms: [unix, windows]
  for: [shell, scripts, source]

traits:
  - id: openssl-private-key-sign-command
    desc: OpenSSL signs with a private key
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bopenssl\s+(dgst\b[^\r\n]{0,180}\s-sign\b|pkeyutl\b[^\r\n]{0,180}\s-sign\b)'

composite_rules:
  - id: cloud-backed-wallet-private-key-signing
    desc: Combines cloud secret retrieval with wallet private-key signing
    crit: notable
    conf: 0.95
    near_bytes: 4096
    all:
      - id: micro-behaviors/os/security/auth/secret::aws-secretsmanager-get
      - id: micro-behaviors/crypto/library/blockchain/wallet::foundry-cast-address-from-private-key
      - id: openssl-private-key-sign-command
