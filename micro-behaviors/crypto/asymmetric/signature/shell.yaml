defaults:
  platforms: [unix, windows]
  for: [shell, scripts, source]

traits:
  - id: openssl-private-key-sign-command
    desc: OpenSSL signs with a private key
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bopenssl\s+(dgst\b[^\r\n]{0,180}\s-sign\b|pkeyutl\b[^\r\n]{0,180}\s-sign\b)'
