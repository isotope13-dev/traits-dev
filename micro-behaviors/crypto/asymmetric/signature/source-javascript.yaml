defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.8

traits:
- id: wallet-transaction-sign-call
  desc: "Wallet or keystore signing expression"
  if:
    type: text
    regex: '\b(ledger|wallet|keyStore\w*|this\.state\.ledger)\.sign(Transaction)?\s*\('
  unless:
  - id: metadata/package/testing/harness/runtime/
