defaults:
  platforms: [windows, linux, macos]
  for: [shell, scripts, source, github-actions, python, javascript, typescript, ruby, go, rust]
  crit: notable
  conf: 0.95

traits:
  - id: gpg-signing-command
    desc: GPG signing command
    if:
      type: text
      regex: '(?im)^\s*gpg2?\b[^\n]{0,180}\s(--detach-sign|--clearsign|--sign)\b'
  - id: signable-artifact-name
    desc: Checksum manifest or detached signature filename
    if:
      type: text
      # Case-sensitive, and the stem excludes `.` so the pattern cannot span a
      # dotted identifier: `posix.SIG` / `system.SIG` (the POSIX signal
      # namespace) were matching `[name].sig` under (?i).
      # Detached signatures must carry the full `<name>.<ext>.asc` artifact
      # form: a single-segment stem is an ordinary member access, and matching
      # it labelled DataTables' `e.asc` sort accessor and Emscripten's
      # `value.sig` as release artifacts.
      # A bare `.rpm`/`.tar.gz` name is NOT a signing artifact — it named Zig's
      # `"hello/world/lib.tar.gz"` doctest a "signed artifact". Plain archive
      # names live in micro-behaviors/data/archive/extension/ and are pulled
      # into the composite below instead.
      regex: '\b(SHA(256|512)SUMS?|[\w-]+\.\w+\.(asc|sig))\b'
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module

composite_rules:
  - id: gpg-release-artifact-sign-command
    desc: GPG signs a release artifact
    crit: notable
    conf: 0.96
    near_lines: 10
    all:
      - id: gpg-signing-command
    any:
      - id: signable-artifact-name
      - id: micro-behaviors/data/archive/extension::tar-gz
      - id: micro-behaviors/data/archive/extension::tar-gz-or-zip-text
