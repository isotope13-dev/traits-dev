defaults:
  platforms: [windows, linux, macos]
  for: [shell, scripts, source, github-actions, python, javascript, typescript, ruby, go, rust]
  crit: notable
  conf: 0.95

traits:
  - id: gpg-signing-command
    desc: GPG signing command
    if:
      type: text
      regex: '(?im)^\s*gpg2?\b[^\n]{0,180}\s(--detach-sign|--clearsign|--sign)\b'
  - id: signable-artifact-name
    desc: Checksum or signed artifact name
    if:
      type: text
      regex: '(?i)\b(SHA(256|512)SUMS?|[A-Za-z0-9_.-]+\.(rpm|tar\.(gz|bz2|xz)|asc|sig))\b'

composite_rules:
  - id: gpg-release-artifact-sign-command
    desc: GPG signs a release artifact
    crit: notable
    conf: 0.96
    near_lines: 10
    all:
      - id: gpg-signing-command
      - id: signable-artifact-name
