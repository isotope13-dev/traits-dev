defaults:
  platforms: [windows, linux, macos]
  for: [shell, scripts, source, github-actions, python, javascript, typescript, ruby, go, rust]
  crit: notable
  conf: 0.95

traits:
  - id: gpg-signing-command
    desc: GPG signing command
    if:
      type: text
      regex: '(?im)^\s*gpg2?\b[^\n]{0,180}\s(--detach-sign|--clearsign|--sign)\b'
  - id: gpg-verification-command
    desc: GPG detached-signature verification command
    if:
      type: text
      regex: '(?im)^\s*gpg2?\b[^\n]{0,180}\s--verify\b'

composite_rules:
  - id: gpg-release-artifact-sign-command
    desc: GPG signs a release artifact
    crit: notable
    conf: 0.96
    near_lines: 10
    all:
      - id: gpg-signing-command
    any:
      - id: micro-behaviors/fs/path/metadata-store::checksum-manifest-filename
      - id: micro-behaviors/fs/path/metadata-store::detached-signature-filename
      - id: micro-behaviors/data/archive/extension::tar-gz
      - id: micro-behaviors/data/archive/extension::tar-gz-or-zip-text
