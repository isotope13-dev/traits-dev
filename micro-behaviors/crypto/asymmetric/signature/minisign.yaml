# minisign release-signature verification. Projects such as PopTracker ship
# contrib scripts that base64-decode .pub bodies and shell out to minisign.
defaults:
  platforms: [windows, linux, macos]
  for: [python, shell, scripts]
  crit: notable
  conf: 0.95

traits:
  - id: python-minisign-verify-subprocess
    desc: Python invokes minisign to verify signatures
    for: [python]
    if:
      type: text
      regex: 'subprocess\.(run|call|Popen)\(.{0,200}minisign'

  - id: minisign-signature-extension
    desc: minisign detached signature filename
    if:
      type: text
      substr: .pub.minisig

  - id: minisign-untrusted-comment-header
    desc: minisign untrusted comment header
    if:
      type: text
      substr: "untrusted comment:"

composite_rules:
  - id: python-minisign-key-material-decode
    desc: Python decodes minisign key material for verification
    for: [python]
    conf: 0.96
    near_bytes: 512
    all:
      - id: micro-behaviors/data/decode/base64::b64decode-call
    any:
      - id: python-minisign-verify-subprocess
      - id: minisign-signature-extension
      - id: minisign-untrusted-comment-header
