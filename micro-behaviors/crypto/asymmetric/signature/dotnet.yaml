# .NET SignedXml (XML-DSig) signing. This is the standard way Windows
# e-invoice and tax-declaration tools sign an XML document with an X.509
# certificate key; the matcher names the SignedXml operation, not a payload.
defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, csharp]
  attack: T1573.002
  mbc: C0027

traits:
  - id: dotnet-signedxml-type
    desc: ".NET SignedXml type reference"
    conf: 0.92
    if:
      type: text
      exact: SignedXml
  - id: dotnet-signedxml-compute-signature
    desc: ".NET ComputeSignature method reference"
    conf: 0.9
    if:
      type: text
      word: ComputeSignature

composite_rules:
  - id: dotnet-xml-digital-signature
    desc: "Computes an XML digital signature with SignedXml"
    crit: notable
    conf: 0.93
    all:
      - id: dotnet-signedxml-type
      - id: dotnet-signedxml-compute-signature
