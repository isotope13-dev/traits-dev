defaults:
  platforms: [unix, windows]
  for: [class, java_class, jar, zip]
  attack: T1573.002
  mbc: C0027

traits:
  - id: java-signature-class-ref
    desc: JVM Signature class reference
    crit: notable
    conf: 0.9
    if:
      type: value
      path: class.class_refs[*]
      exact: java/security/Signature

  - id: java-signature-initverify
    desc: Java Signature initVerify call
    crit: notable
    conf: 0.94
    attack: T1553.002
    if:
      type: value
      path: class.strings[*]
      exact: initVerify

  - id: java-signature-initsign
    desc: Java Signature initSign reference
    crit: notable
    conf: 0.94
    if:
      type: value
      path: class.strings[*]
      exact: initSign

  - id: java-pkcs8-private-key-spec-ref
    desc: JVM PKCS8 private-key specification reference
    crit: notable
    conf: 0.92
    if:
      type: value
      path: class.class_refs[*]
      exact: java/security/spec/PKCS8EncodedKeySpec

  - id: java-long-hex-crypto-material
    desc: Long hexadecimal material in Java class
    crit: notable
    conf: 0.86
    if:
      type: value
      path: class.strings[*]
      regex: '^[0-9A-Fa-f]{512,}$'

  - id: java-x509-encoded-keyspec-ref
    desc: JVM X509EncodedKeySpec class reference
    crit: notable
    conf: 0.92
    if:
      type: value
      path: class.class_refs[*]
      exact: java/security/spec/X509EncodedKeySpec

composite_rules:
  - id: java-rsa-public-verify
    desc: Java verifies signatures with an X509 public key
    crit: notable
    conf: 0.95
    attack: T1553.002
    for: [class, java_class]
    all:
      - id: java-signature-class-ref
      - id: java-signature-initverify
      - id: java-x509-encoded-keyspec-ref
      - id: micro-behaviors/data/decode/base64::java-base64-decoding-bytecode
