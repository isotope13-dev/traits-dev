# PHP OpenSSL signature verification.  openssl_verify() is tri-state
# (1 / 0 / -1); callers that treat the return as a boolean accept OpenSSL
# errors as a valid signature.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.94

traits:
  - id: php-openssl-verify
    desc: PHP openssl_verify call
    if:
      type: symbol
      kind: call
      exact: openssl_verify

  - id: php-openssl-verify-in-if
    desc: openssl_verify used as boolean
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'if\s*\(\s*openssl_verify\s*\('
