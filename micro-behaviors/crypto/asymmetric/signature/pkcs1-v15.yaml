# PKCS#1 v1.5 DigestInfo encodings are cryptographic implementation details.
# Keep the source and compiled forms separate because text hex and literal
# bytes are different artifact structures even though they encode one value.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  mbc: C0028

traits:
  - id: pkcs1-v15-sha256-digestinfo-hex
    desc: PKCS#1 SHA-256 DigestInfo hex prefix
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: '3031300d060960864801650304020105000420'
      case_insensitive: true
