defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

traits:
- id: eip712-sign-typed-data
  desc: "Typed-data signing API reference"
  conf: 0.94
  if:
    type: symbol
    exact: account.sign_typed_data
- id: web3-account-sign
  desc: "Transaction or message signing reference"
  conf: 0.92
  if:
    type: symbol
    regex: '(^|\.)(sign_transaction|sign_message|sign_typed_data)$'
