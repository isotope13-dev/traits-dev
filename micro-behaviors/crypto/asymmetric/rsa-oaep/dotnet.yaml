# .NET RSA-OAEP capability. This is neutral cryptography; C2 intent is
# inferred only when it is paired with the calendar dead-drop workflow.
defaults:
  platforms: [windows, unix]
  for: [csharp]
  attack: T1573.002

traits:
  - id: dotnet-rsa-oaep-sha256
    desc: .NET RSA-OAEP SHA-256 padding
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: RSAEncryptionPadding.OaepSHA256
