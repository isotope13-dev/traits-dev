# BLS12-381 operations exposed by native implementations such as blst.
# These symbols describe real cryptographic behavior and are neutral despite
# appearing in blockchain software and security tooling.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, dll, so, dylib, static-lib]
  crit: notable
  conf: 0.98

traits:
  - id: key-generation
    desc: BLS private key generation operation
    if:
      type: symbol
      exact: blst_keygen

  - id: signature-verification
    desc: BLS public-key signature verification operation
    if:
      type: symbol
      regex: '^blst_core_verify_pk_in_g[12]$'

  - id: pairing-verification
    desc: BLS pairing final verification operation
    if:
      type: symbol
      exact: blst_pairing_finalverify
