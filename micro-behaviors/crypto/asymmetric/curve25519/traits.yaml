defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]
  mbc: C0027
  attack: T1573

traits:
  - id: curve25519-clamp
    desc: x86 memory scalar clamp for Curve25519
    conf: 0.85
    arch: [x86-64, x86]
    if:
      type: hex
      section: text
      # Require all three scalar masks; C0 is a shift opcode, not AND.
      # The old three-byte skeleton also matched unrelated loader code.
      pattern: "80 2? F8 [0-16] 80 6? 1F 7F [0-16] 80 4? 1F 40"
  - id: curve25519-donna-call
    desc: Curve25519 Donna key-agreement routine call
    conf: 0.96
    for: [c, cpp, elf, macho, pe, dll]
    if:
      type: symbol
      kind: call
      exact: curve25519_donna
  - id: curve25519-dalek-path
    desc: Curve25519 Dalek library marker
    conf: 0.92
    for: [rust, elf, macho, pe]
    if:
      type: text
      regex: 'curve25519-dalek-[0-9][A-Za-z0-9_.-]*/src/(scalar|montgomery|field)\.rs'
  - id: x25519-key-exchange-term
    desc: X25519 or Curve25519 algorithm reference
    conf: 0.88
    for: [binaries, rust, c, cpp, go, csharp, python, javascript, typescript, wasm]
    if:
      type: text
      regex: '(?i)\bx25519\b|\bcurve25519\b.{0,40}\b(key agreement|key exchange|shared secret)\b'
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/lang/compiler/systems::go-binary

  - id: go-curve25519-key-generation-call
    desc: Go Curve25519 key-generation call
    conf: 0.96
    for: [go]
    if:
      type: symbol
      kind: call
      exact: Curve25519Genkey

  - id: go-x25519-ephemeral-key-generation
    desc: Go X25519 ephemeral-key generation call
    conf: 0.98
    for: [go]
    if:
      type: symbol
      kind: call
      exact: ecdh.X25519.GenerateKey
