# Hybrid Public Key Encryption (HPKE) operations in Go.
# These are neutral cryptographic capabilities; intent comes from surrounding
# behavior rather than from the use of an HPKE library itself.
defaults:
  platforms: [unix, windows]
  for: [go]

traits:
  - id: go-hpke-import
    desc: Imports Go HPKE package
    crit: notable
    conf: 0.98
    if:
      type: import
      exact: 'crypto/hpke'

  - id: go-hpke-kem-constructor
    desc: Constructs a Go HPKE KEM
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: hpke.DHKEM

  - id: go-hpke-hkdf-constructor
    desc: Selects a Go HPKE HKDF
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^hpke\.HKDFSHA(256|384|512)$'

  - id: go-hpke-aead-constructor
    desc: Selects a Go HPKE AEAD
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^hpke\.(AES(128|256)GCM|ChaCha20Poly1305)$'

composite_rules:
  - id: go-hpke-usage
    desc: Go uses HPKE key or cipher primitives
    crit: notable
    conf: 0.98
    all:
      - id: go-hpke-import
    any:
      - id: go-hpke-kem-constructor
      - id: go-hpke-hkdf-constructor
      - id: go-hpke-aead-constructor
