# ASN.1 type names also occur in native OpenSSL builds. They establish RSA
# support, not Go provenance, key possession, or a particular RSA operation.
defaults:
  platforms: [windows, linux, macos]
  for: [go, elf, macho, pe, wasm]
  crit: notable
  conf: 0.8

traits:
  - id: rsa-pss-parameter-type-name
    desc: RSA PSS parameter type name
    if:
      type: text
      substr: RSA_PSS_PARAMS
  - id: rsa-private-key-type-name
    desc: RSA private-key type name reference
    if:
      type: text
      substr: RSAPrivateKey
