defaults:
  platforms: [unix, windows]
  for: [java, kotlin]
  crit: notable
traits:
  - id: jvm-rsa-cipher-selection
    desc: JVM Cipher.getInstance RSA source call
    conf: 0.97
    if:
      # The JVM source-call projection drops the receiver. Require it in
      # source rather than treating every getInstance("RSA") as Cipher use.
      type: text
      regex: '\bCipher\.getInstance\s*\(\s*"RSA(/[^"\r\n]{0,64})?"'
