# RSA operations via openssl CLI and embedded keys
defaults:
  crit: notable
  conf: 0.85
  for: [shell]
  platforms: [unix]
  mbc: C0027
traits:
  - id: openssl-pkeyutl-encrypt
    desc: OpenSSL RSA public key encryption command
    if:
      type: text
      substr: openssl pkeyutl -encrypt

  - id: openssl-rsautl-verify
    desc: OpenSSL verifies an RSA signature
    conf: 0.98
    if:
      type: text
      regex: '\bopenssl\s+rsautl\s+-verify\b[^\n]{0,120}\s-pubin\b'
