# OpenSSL public-key encryption launched from code as an argument vector
# (subprocess.run([...]), spawn("openssl", [...]), exec.Command(...)) rather
# than a shell command line, which shell.yaml's openssl-pkeyutl-encrypt covers.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [scripts, source]
  mbc: C0027

traits:
  - id: openssl-pkeyutl-encrypt-argv
    desc: OpenSSL pkeyutl -encrypt argument vector
    conf: 0.9
    if:
      type: text
      regex: '[''"]pkeyutl[''"]\s*,\s*[''"]-encrypt[''"]'
