defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
  mbc: C0059

traits:
  # Only RSA keys support encrypt(); EC and Ed25519 public keys do not.
  - id: loaded-pem-public-key-encrypt
    desc: Encrypts with a loaded PEM public key
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_]\w*\.encrypt$'
      receiver:
        from:
          call: '(^|\.)load_pem_public_key$'

  # OAEP is an RSA encryption padding scheme. Loading a PEM key through
  # serialization does not require importing the asymmetric.rsa module.
  # Bind the key receiver and padding argument to this same encrypt call;
  # unrelated OAEP construction elsewhere in the file is insufficient.
  - id: rsa-oaep-public-encrypt
    desc: RSA OAEP encryption with loaded PEM key
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_]\w*\.encrypt$'
      receiver:
        from:
          call: '(^|\.)load_pem_public_key$'
      arg:
        index: 1
        from:
          call: '(^|\.)OAEP$'

  - id: load-pem-public-key
    desc: Python loads PEM public key
    conf: 0.86
    if:
      type: symbol
      regex: '(^|\.)load_pem_public_key$'

  - id: rsa-oaep-padding
    desc: Python RSA OAEP padding
    conf: 0.9
    if:
      type: symbol
      exact: "padding.OAEP"

  - id: rsa-module-import
    desc: Python RSA module import
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bfrom\s+cryptography\.hazmat\.primitives\.asymmetric\s+import\s+rsa\b'
  - id: rsa-module-path-import
    desc: Python RSA module path reference
    conf: 0.9
    if:
      type: text
      substr: cryptography.hazmat.primitives.asymmetric.rsa
  - id: pycryptodome-rsa-import
    desc: Python imports PyCryptodome RSA
    conf: 0.9
    if:
      type: text
      regex: '\bfrom\s+Crypto\.PublicKey\s+import\s+RSA\b'
  - id: pycryptodome-oaep-import
    desc: Python imports PyCryptodome RSA-OAEP
    conf: 0.9
    if:
      type: text
      regex: '\bfrom\s+Crypto\.Cipher\s+import\s+[^\n]{0,80}\bPKCS1_OAEP\b'
  - id: pycryptodome-rsa-import-key
    desc: Python imports an RSA key with PyCryptodome
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: RSA.import_key
  - id: pycryptodome-oaep-encrypt-call
    desc: Python encrypts with PyCryptodome RSA-OAEP
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: PKCS1_OAEP.new.encrypt

composite_rules:
  - id: rsa-sha256-public-verify
    desc: Python RSA SHA256 public signature verification
    conf: 0.9
    all:
      - id: load-pem-public-key
      - id: rsa-implementation-import
      - id: micro-behaviors/crypto/verify::public-key-verify-call
      - id: micro-behaviors/crypto/hash/digest/sha2::cryptography-sha256-algorithm

  - id: rsa-implementation-import
    desc: Python RSA implementation import context
    conf: 0.9
    any:
      - id: rsa-module-import
      - id: rsa-module-path-import
  - id: pycryptodome-rsa-oaep-public-encrypt
    desc: Python PyCryptodome RSA-OAEP public encryption
    conf: 0.96
    all:
      - id: pycryptodome-rsa-import
      - id: pycryptodome-oaep-import
      - id: pycryptodome-rsa-import-key
      - id: pycryptodome-oaep-encrypt-call
    near_lines: 80
