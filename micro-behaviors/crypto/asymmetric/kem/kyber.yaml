defaults:
  platforms: [linux, macos, windows]
  for: [binaries, c, cpp, rust, go, python, javascript, typescript, csharp, java, wasm]
  mbc: C0027
  attack: T1573

traits:
- id: go-mlkem768-decapsulation-call
  desc: Go ML-KEM-768 decapsulation-key construction
  crit: notable
  conf: 0.98
  for: [go]
  if:
    type: symbol
    kind: call
    exact: mlkem.NewDecapsulationKey768
- id: go-mlkem768-encapsulation-call
  desc: Go ML-KEM-768 encapsulation-key construction
  crit: notable
  conf: 0.98
  for: [go]
  if:
    type: symbol
    kind: call
    exact: mlkem.NewEncapsulationKey768
- id: go-mlkem768-key-generation-call
  desc: Go ML-KEM-768 key-generation call
  crit: notable
  conf: 0.98
  for: [go]
  if:
    type: symbol
    kind: call
    exact: mlkem.GenerateKey768
- id: kyber-library-identifier
  desc: References an ML-KEM or Kyber algorithm family
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?i)\b(pqc[_-]kyber|crystals[_-]?kyber|kyber[_-]?[0-9]{3,4}|ml[-_]?kem[_-]?[0-9]{3,4})\b'
  unless:
    - id: metadata/lang/compiler/systems::go-binary

# These two used to be the bare stems `decapsulat` / `encapsulat`, which are
# ordinary English: "encapsulating"/"encapsulation" appears in the comments of
# essentially every OOP codebase (it fired on an absl::Flag comment), and
# "decapsulation" is the standard word for stripping a VXLAN/GRE/GTP header in
# network stacks, eBPF and DPDK. A KEM/Kyber token is now required within a few
# characters, so the atom detects the routine its description names. The
# connector class keeps the real spellings: OQS_KEM_encaps, MLKEM768_decap,
# crypto_kem_encapsulate, kyber_encapsulate.
- id: kyber-encapsulation-terms--rx-2
  desc: References an ML-KEM decapsulation routine
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '(?i)(kem|kyber)[a-z0-9_ -]{0,8}decap'
  unless:
    - id: metadata/lang/compiler/systems::go-binary
- id: kyber-encapsulation-terms--rx-3
  desc: References an ML-KEM encapsulation routine
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '(?i)(kem|kyber)[a-z0-9_ -]{0,8}encap'
  unless:
    - id: metadata/lang/compiler/systems::go-binary
- id: kyber-encapsulation-terms--rx-6
  desc: Kyber algorithm name term
  crit: component
  conf: 0.92
  if:
    type: text
    substr: kyber
    case_insensitive: true
  unless:
    - id: metadata/lang/compiler/systems::go-binary
    - id: well-known/app/ai/assistant/kyber-chat::kyber-chat-identity
  count_max: 1005880
- id: kyber-public-key-validation
  desc: Kyber public key validation marker
  crit: component
  conf: 0.86
  if:
    type: text
    regex: '(?i)invalid public key size|public[_ -]?key.{0,40}(kyber|ml[-_]?kem)'
  unless:
    - id: metadata/lang/compiler/systems::go-binary

- id: kyber1024-material-size--0x620
  desc: Kyber1024 ciphertext size (0x620)
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)(kyber|ml[-_]?kem)[^\n]{0,80}0x620'
  unless:
    - id: metadata/lang/compiler/systems::go-binary
- id: kyber1024-material-size--1568
  desc: Kyber1024 ciphertext size (1568)
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)(kyber|ml[-_]?kem)[^\n]{0,80}1568'
  unless:
    - id: metadata/lang/compiler/systems::go-binary
composite_rules:
- id: kyber1024-material-size
  desc: Kyber1024 ciphertext size
  crit: component
  conf: 0.9
  unless:
  - id: metadata/lang/compiler/systems::go-buildinfo
  - id: metadata/lang/compiler/systems::go-binary

  any:
  - id: kyber1024-material-size--0x620
  - id: kyber1024-material-size--1568
- id: kyber-kem-usage
  desc: Includes ML-KEM or Kyber encapsulation support
  crit: notable
  conf: 0.95
  all:
  - id: kyber-library-identifier
  any:
  - id: kyber1024-material-size
  - id: kyber-encapsulation-terms
  - id: kyber-public-key-validation
- id: kyber-encapsulation-terms
  desc: ML-KEM or Kyber encapsulation evidence
  crit: component
  conf: 0.92
  # Only legs that actually name a KEM/Kyber routine belong here. The generic
  # `vocabulary::secret` and `vocabulary::ciphertext-key-vocabulary` atoms used
  # to sit in this `any:`, which made every file containing the plain word
  # "secret" report as Kyber encapsulation evidence (boto3's `aws_secret_access_key`
  # docstring was enough). They carry no ML-KEM information, so they are gone.
  any:
  - id: kyber-encapsulation-terms--rx-2
  - id: kyber-encapsulation-terms--rx-3
  - id: kyber-encapsulation-terms--rx-6
