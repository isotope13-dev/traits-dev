defaults:
  for:
  - scripts
  - binaries
  - markdown
  - python
  - swift
  platforms:
  - unix
  crit: notable
traits:
- id: ssh-rsa-host-key-generation-command
  desc: Invokes ssh-keygen to generate an RSA key
  conf: 0.95
  if:
    type: text
    regex: ssh-keygen\s+-t\s+rsa\s+-N\s+
- id: ssh-keygen-command
  desc: Invokes the OpenSSH key-generation utility
  conf: 0.9
  for:
  - shell
  - elf
  if:
    type: symbol
    kind: call
    exact: ssh-keygen
- id: rsa-public-key-literal
  desc: SSH RSA public key literal
  conf: 0.9
  for:
  - scripts
  - binaries
  - markdown
  - python
  - swift
  - text
  if:
    type: text
    regex: ssh-rsa\s+AAAA[A-Za-z0-9+/]{40,}
- id: ed25519-public-key-literal
  desc: Structurally complete SSH Ed25519 public key
  conf: 0.9
  for:
  - scripts
  - binaries
  - markdown
  - python
  - swift
  - text
  if:
    type: text
    regex: ssh-ed25519\s+AAAAC3NzaC1lZDI1NTE5AAAAI[A-P][A-Za-z0-9+/]{42}([^A-Za-z0-9+/=]|$)
- id: sk-ed25519-public-key-literal
  desc: FIDO2 SSH Ed25519 public key literal
  conf: 0.9
  for:
  - scripts
  - binaries
  - markdown
  - python
  - swift
  - text
  if:
    type: text
    regex: sk-ssh-ed25519@openssh\.com\s+AAAA[A-Za-z0-9+/]{40,}
- id: ecdsa-public-key-literal
  desc: SSH ECDSA public key literal
  conf: 0.9
  for:
  - scripts
  - binaries
  - markdown
  - python
  - swift
  - text
  if:
    type: text
    regex: ecdsa-sha2-nistp(256|384|521)\s+AAAA[A-Za-z0-9+/]{40,}
- id: paramiko-key-signature-method
  desc: Implements Paramiko SSH key signing
  conf: 0.94
  platforms:
  - unix
  - windows
  for:
  - python
  if:
    type: function
    exact: sign_ssh_data
- id: paramiko-pkey-subclass
  desc: Implements a Paramiko public key class
  conf: 0.96
  platforms:
  - unix
  - windows
  for:
  - python
  if:
    type: text
    regex: 'class\s+\w+\s*\(\s*PKey\s*\)\s*:'
- id: ssh-rsa-exponent-field-assembly
  desc: Assembles SSH RSA exponent field
  conf: 0.94
  platforms:
  - unix
  - windows
  for:
  - python
  if:
    type: text
    regex: '["'']ssh-rsa["''][^\r\n]{0,160}(self\.)?(exp_bytes|exponent)'
composite_rules:
- id: hardcoded-public-key
  desc: Hardcoded SSH public key
  conf: 0.9
  any:
  - id: rsa-public-key-literal
  - id: ed25519-public-key-literal
  - id: sk-ed25519-public-key-literal
  - id: ecdsa-public-key-literal
  not:
  - regex: MockPublicKeyForDevModeonlyrunspec-console
  downgrade:
    any:
    - id: metadata/package/testing/
    - type: basename
      regex: ^(authorized_keys|known_hosts|[^/]+\.pub)$
    - type: basename
      regex: (?i)\.(md|markdown|rst|adoc)$
    - id: metadata/path::test-directory-component
  unless:
  - id: well-known/app/system/kiwi::kiwi-appliance-builder-package
  - id: well-known/app/system/kiwi::kiwi-build-helper-context
  - id: well-known/lib/ai/inspect-evals::eval-corpus-context
- id: paramiko-custom-publickey-auth
  desc: Uses custom Paramiko public-key signing
  conf: 0.96
  platforms:
  - unix
  - windows
  for:
  - python
  all:
  - id: paramiko-key-signature-method
  - id: micro-behaviors/communications/ssh/connect::paramiko-auth-publickey-call
