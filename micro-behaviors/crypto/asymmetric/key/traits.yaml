defaults:
  platforms:
    - windows
    - linux
    - macos
  for:
    - python
    - javascript
    - typescript
    - csharp
    - go
  crit: notable
  conf: 0.85

traits:
  - id: pem-private-key-header
    desc: PEM private-key header
    crit: component
    conf: 0.99
    if:
      type: text
      substr: '-----BEGIN PRIVATE KEY-----'
  - id: pem-private-key-footer
    desc: PEM private-key footer
    crit: component
    conf: 0.99
    if:
      type: text
      substr: '-----END PRIVATE KEY-----'
  - id: pem-private-key-body
    desc: PEM private-key base64 body
    crit: component
    conf: 0.99
    if:
      type: text
      regex: '-----BEGIN PRIVATE KEY-----\s*[A-Za-z0-9+/=\r\n]{40,}\s*-----END PRIVATE KEY-----'

  - id: pgp-private-key-header
    desc: ASCII-armored OpenPGP private-key header
    crit: component
    conf: 0.99
    for: [javascript, typescript, scripts, source, data, text, archives, github-actions]
    if:
      type: text
      substr: '-----BEGIN PGP PRIVATE KEY BLOCK-----'
  - id: pgp-private-key-footer
    desc: ASCII-armored OpenPGP private-key footer
    crit: component
    conf: 0.99
    for: [javascript, typescript, scripts, source, data, text, archives, github-actions]
    if:
      type: text
      substr: '-----END PGP PRIVATE KEY BLOCK-----'
  - id: pgp-private-key-body
    desc: ASCII-armored OpenPGP private-key body
    crit: component
    conf: 0.99
    for: [javascript, typescript, scripts, source, data, text, archives, github-actions]
    if:
      type: text
      regex: '-----BEGIN PGP PRIVATE KEY BLOCK-----\s*[A-Za-z0-9+/=\r\n]{40,}'

  - id: armored-named-private-key-header
    desc: References named armored private-key header
    crit: notable
    conf: 0.95
    for: [go, scripts, binaries]
    if:
      type: text
      regex: '-----BEGIN [A-Za-z0-9+/=]{3,32} PRIVATE KEY-----'
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: pem-public-key-header
    desc: References PEM public-key header
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    if:
      type: text
      substr: "-----BEGIN PUBLIC KEY-----"
  - id: crypto-private-key-reference
    desc: Cryptographic private-key material reference
    if:
      type: text
      regex: '(?i)\b(wallet|eth|btc|crypto)\b.{0,80}\bprivate_?key\b'
  - id: private-key-identifier
    desc: Private-key identifier
    crit: component
    conf: 0.75
    for: [javascript, typescript]
    if:
      type: text
      word: PRIVATE_KEY
      case_insensitive: true
  - id: private-key-export-wording
    desc: Private-key export wording
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(\bprivate_?key\b.{0,80}\bexport\b|\bexport\w*.{0,40}\bprivate_?key\b)'
  - id: gpg-private-key-import-command
    desc: GPG imports a private-key file
    crit: notable
    conf: 0.96
    for: [shell, scripts, source, github-actions, python, javascript, typescript, ruby, go, rust]
    if:
      type: text
      regex: '(?im)^\s*gpg2?\b[^\n]{0,120}\s--import\b[^\n]{0,120}\.(asc|gpg|key)\b'
  - id: git-secret-reveal-command
    desc: Git-secret decrypts repository files
    crit: notable
    conf: 0.96
    for: [shell, ruby, python, javascript, typescript]
    if:
      type: text
      regex: '\bgit\s+secret\s+reveal\b'
  - id: git-secret-reveal-argument-array
    desc: Git-secret decrypts repository files
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']git["'']\s*,\s*\[\s*["'']secret["'']\s*,\s*["'']reveal["'']'

composite_rules:
  - id: embedded-pem-private-key
    desc: Embedded PEM private-key material
    crit: notable
    conf: 0.97
    near_lines: 20
    all:
      - id: pem-private-key-header
      - id: pem-private-key-body
      - id: pem-private-key-footer
  - id: embedded-pgp-private-key
    desc: Embedded ASCII-armored OpenPGP private-key material
    crit: notable
    conf: 0.97
    for: [javascript, typescript, scripts, source, data, text, archives, github-actions]
    near_lines: 80
    all:
      - id: pgp-private-key-header
      - id: pgp-private-key-body
      - id: pgp-private-key-footer
  - id: private-key-export
    desc: Exports cryptographic private-key material
    crit: notable
    conf: 0.92
    near_lines: 80
    all:
      - id: crypto-private-key-reference
      - id: private-key-export-wording
