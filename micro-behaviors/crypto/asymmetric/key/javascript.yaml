defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.8

traits:
- id: xrpl-seed-wallet-derivation
  desc: XRPL wallet derived from seed
  if:
    type: symbol
    kind: call
    exact: XrplWallet.fromSeed
- id: generated-private-key-fallback
  desc: "Private-key generation API reference"
  if:
    type: symbol
    kind: call
    exact: generatePrivateKey
- id: viem-private-key-account
  desc: Viem private-key account creation
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: privateKeyToAccount

# Library-agnostic: matches viem, ethers, web3.js, cosmjs and wallet-SDK
# abstractions alike. Library identity must come from a sibling leg.
# Token allowance grants. `approve` is the primitive every wallet drainer needs:
# the victim signs one transaction and the attacker's spender can move the token
# for as long as the allowance stands, which is why drainers optimise for it over
# a direct transfer. It is also what every DEX, bridge and staking SDK does
# legitimately, so these stay neutral capabilities -- the drainer inference comes
# from pairing them with a spender the user never chose.
#
# Nothing covered ERC-20 allowances before: `setApprovalForAll` (the NFT form)
# existed under objectives/credential-access/wallet/provider/, and the unlimited
# amount was only matched as the literal `MAX_UINT256`, which misses the ethers
# (`MaxUint256`), viem (`maxUint256`) and raw-hex spellings entirely.
# Matched on the ABI/signature spelling, not on a bare `.approve(` call: that is
# an ordinary method name, and an agent framework's tool-approval callbacks
# (`connector.approve(c)`, `lifecycle.approve(i)`) are not token allowances.
# A contract interaction always carries the declaration somewhere.
