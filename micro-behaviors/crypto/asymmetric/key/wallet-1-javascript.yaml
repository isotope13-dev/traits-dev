defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
- id: solana-keypair-from-secret-key
  desc: Solana keypair from secret key
  if:
    type: text
    substr: Keypair.fromSecretKey
- id: wallet-factory-entrypoint
  desc: "Wallet or keypair factory reference"
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(Wallet|HDNode|Keypair|XrplWallet)\s*\.\s*from'
  unless:
    - id: metadata/lang/scripted::dts-declaration-file
- id: private-key-from-hex
  desc: Private key parsed from hexadecimal input
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '\bPrivateKey\s*\.\s*fromHex\s*\('
- id: private-key-from-mnemonic
  desc: Private key derived from mnemonic input
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '\bPrivateKey\s*\.\s*fromMnemonic\s*\('
- id: ethers-wallet-from-private-key
  desc: "Constructs an Ethers wallet"
  if:
    type: text
    regex: '\bnew\s+ethers\.Wallet\s*\('
composite_rules:
- id: wallet-key-derivation-entrypoint
  desc: "Wallet key loading or derivation reference"
  crit: notable
  conf: 0.9
  any:
    - id: micro-behaviors/crypto/asymmetric/key::wallet-factory-entrypoint
    - id: micro-behaviors/crypto/asymmetric/key::private-key-from-hex
    - id: micro-behaviors/crypto/asymmetric/key::private-key-from-mnemonic
