# EC key generation does not establish ECDH: the key can also serve ECDSA.
# Use the admitted asymmetric-key leaf alongside rsa-generate.yaml while the
# crypto/key operation partition awaits its directory-budget review.
defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  for: [elf, pe, so, dll]
traits:
  - id: ec-key-generate-key
    desc: OpenSSL EC key-generation API reference
    if:
      type: text
      exact: EC_KEY_generate_key
