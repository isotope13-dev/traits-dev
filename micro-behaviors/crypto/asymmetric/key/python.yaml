defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

traits:
- id: eth-account-from-key
  desc: EVM account derived from private key
  conf: 0.92
  if:
    type: symbol
    exact: Account.from_key
- id: python-account-from-key
  desc: Web3 account derived from a private key
  conf: 0.92
  if:
    type: symbol
    exact: web3.eth.account.from_key
- id: python-keypair-from-base58
  desc: Solana keypair from a Base58 secret
  conf: 0.92
  if:
    type: symbol
    kind: call
    exact: Keypair.from_base58_string
- id: eth-account-create
  desc: "Account key-generation API reference"
  conf: 0.92
  if:
    type: symbol
    exact: Account.create
- id: substrate-keypair-from-secret
  desc: Substrate keypair derived from secret material
  conf: 0.92
  if:
    type: text
    regex: 'create_from_(mnemonic|seed|uri|private_key)'
