defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.8
traits:
  - id: privatekey-identifier
    desc: Private-key identifier reference
    if:
      type: text
      word: privatekey
    unless:
    # A name reached through a string is the reflective spelling; where the
    # direct form is already recorded, this would be the same call twice.
    - id: well-known/lib/network/wireguard::wgquick-privatekey-directive
