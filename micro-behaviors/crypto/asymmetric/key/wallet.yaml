defaults:
  platforms:
  - unix
  - windows
  for: [scripts, binaries]

traits:
- id: private-key-word
  desc: privateKey string literal
  crit: notable
  conf: 0.5
  for: [javascript, typescript]
  if:
    type: string_literal
    substr: privateKey
- id: xrpl-seed-literal
  desc: Hardcoded XRPL seed literal
  crit: suspicious
  conf: 0.92
  for: [javascript, typescript]
  if:
    type: text
    regex: '\bseed\s*:\s*["'']s[A-Za-z0-9]{25,35}["'']'
# `solana-system-transfer` moved to
# micro-behaviors/data/transaction/construct::solana-system-program-transfer
# — the matcher only detects the standard SOL-transfer instruction builder,
# which is neutral SDK usage and not credential access on its own.
