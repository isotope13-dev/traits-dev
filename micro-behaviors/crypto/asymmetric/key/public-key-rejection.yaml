# Neutral key-material validation shapes. A `publicKey` condition that a
# program meets with a rejection or throw is ordinary protocol code —
# WebAuthn implementations, E2E messengers, and JWT libraries all reject
# when peer key material is absent or malformed. A credential-API hook plus
# a rejection of a positive publicKey condition is the WebAuthn-downgrade
# signal; the missing-key guard alone is not.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, html, text]
  crit: component
  conf: 0.95

traits:
  - id: public-key-missing-rejection
    crit: notable
    desc: Throws or rejects on missing public key
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      # The throw has to be the body of a condition that names publicKey.
      # A nearby throw about a different argument (curve option renamed)
      # is not a missing-key rejection.
      regex: 'if\s*\([^)]{0,50}publicKey[^)]{0,24}\).{0,20}(throw\s+new|Promise\.reject)'

  # A negated guard (`if (!options.publicKey) original() : reject`) is the
  # missing-key case above. Rejecting a condition that ends on publicKey
  # is the request itself being refused.
  - id: public-key-condition-rejection
    crit: notable
    desc: Rejects when a publicKey condition holds
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?s)if\s*\([^!]{0,40}publicKey\s*\).{0,60}(Promise\.reject|throw\s+new)'
