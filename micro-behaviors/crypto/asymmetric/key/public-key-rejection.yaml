# Neutral key-material validation shapes. A `publicKey` condition that a
# program meets with a rejection or throw is ordinary protocol code —
# WebAuthn implementations, E2E messengers, and JWT libraries all reject
# when peer key material is absent or malformed. It only reads as a
# WebAuthn-downgrade technique when a credential-API hook sits nearby, so
# the phishlet composites in objectives/credential-access/phishing/mfa-relay/
# combine this atom with interception evidence.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, html, text]
  crit: component
  conf: 0.95

traits:
  - id: public-key-missing-rejection
    desc: Throws or rejects on missing public key
    if:
      type: text
      regex: '(?s)\bpublicKey\b.{0,180}\b(Promise\.reject|throw\s+new)\b'
