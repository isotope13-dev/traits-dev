defaults:
  platforms: [windows, unix]
  for: [binaries]
traits:
- id: go-obfuscated-keygen
  desc: Go key-generation method symbol
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '\b[A-Za-z]\w{5,14}\.\(\*[A-Za-z]\w{5,14}\)\.(GenerateKey|NewPrivateKey)'
  not:
  - substr: github.com/ProtonMail/go-crypto/bitcurves.(*BitCurve).GenerateKey
  # The regex span stops at GenerateKey, so the github.com prefix above never
  # covers the recorded match. The short symbol is the same ProtonMail API.
  - substr: bitcurves.(*BitCurve).GenerateKey
  - substr: crypto/internal/fips140/ecdh.GenerateKey
  - substr: crypto/internal/fips140/ecdsa.GenerateKey
  unless:
  - id: well-known/app/infrastructure/terraform-provider/
  - id: micro-behaviors/communications/ssh/server/
  # A Go binary may embed a minified browser bundle. Text extracted from that
  # bundle can resemble a dotted Go key-generation symbol, but it is not
  # evidence of ransomware key generation.
  - id: metadata/lang/embedded::javascript
- id: go-obfuscated-keygen-unless-cond-0--rx-1
  desc: Post-quantum KEM key generation
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '(^|/)(kyber|mlkem)(512|768)\.\(\*scheme\)\.GenerateKey'
- id: go-obfuscated-keygen-unless-cond-0--rx-2
  desc: Post-quantum KEM key generation
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '(^|/)(kyber|mlkem)(1024)\.\(\*scheme\)\.GenerateKey'
composite_rules:
- id: go-obfuscated-keygen-unless-cond-0--rx-helper-3
  desc: Regex component marker
  crit: notable
  conf: 1.0
  any:
  - id: go-obfuscated-keygen-unless-cond-0--rx-1
  - id: go-obfuscated-keygen-unless-cond-0--rx-2
