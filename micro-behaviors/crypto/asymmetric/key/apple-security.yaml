# Key lifecycle imports, retained in the admitted legacy key leaf.
# An external representation can be a public key; it does not prove that a
# private key is extractable or that any key material leaves the process.
defaults:
  platforms: [macos, ios]
  for: [macho, dylib]
  crit: notable
  conf: 0.98

traits:
  - id: apple-seckey-generate-import
    desc: Imports Apple asymmetric key generation API
    if:
      type: import
      exact: SecKeyCreateRandomKey

  - id: apple-seckey-export-import
    desc: Imports Apple key representation export API
    if:
      type: import
      exact: SecKeyCopyExternalRepresentation
