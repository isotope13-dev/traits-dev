defaults:
  crit: notable
  conf: 0.9
  platforms:
    - windows
    - unix
  for: [c, cpp, source]
traits:
  - id: ntru-encrypt-class
    desc: NTRUEncrypt class or function reference
    if:
      type: text
      regex: \bNTRU(Encrypt|Decrypt)\b
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index
  - id: ntru-crypto-header
    desc: NTRU crypto library header include
    if:
      type: text
      substr: ntru_crypto
