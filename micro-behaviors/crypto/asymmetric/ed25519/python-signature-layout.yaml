defaults:
  for:
  - python
  platforms:
  - unix
  - windows
traits:
- id: python-point-response-signature
  desc: Concatenates point and scalar signature bytes
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: |-
      ((return_statement (binary_operator
       left: (identifier) right: (call function: (attribute attribute: (identifier) @bytes)
       arguments: (argument_list . (integer) @width . (string (string_content) @order))))) @evidence
       (#eq? @bytes "to_bytes") (#eq? @width "32") (#eq? @order "little"))
