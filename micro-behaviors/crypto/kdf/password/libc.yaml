# crypt(3) as libxcrypt / glibc actually expose it to callers today.
#
# The only pre-existing matcher for this primitive is
# objectives/credential-access/dump/system::crypt-password-verify, which is
# `type: symbol exact: "crypt"` -- the obsolete, non-reentrant entry point.
# Symbol `exact:` is exact, so it does not match `crypt_r`, and every current
# caller links a reentrant variant instead: PAM's unix_chkpwd, shadow-utils,
# sshd and any native credential tool. Hashing a password was therefore
# invisible on modern Linux binaries. Verified on Debian
# libpam-modules-bin/unix_chkpwd, which imports crypt_r, crypt_gensalt_rn and
# crypt_checksalt and drew no crypto finding at all.
#
# Notable rather than component: "derives a password hash" is a complete,
# standalone observation, and TAXONOMY puts crypto operations at notable or
# higher. These stay in micro-behaviors/ because the primitive itself is
# neutral -- verifying a login and stealing a hash call the same function.
# Credential-access intent belongs to the composites that pair a hash
# computation with shadow-file access or exfiltration.
defaults:
  platforms: [linux]
  for: [elf, c]
  crit: notable
  conf: 0.9
  mbc: C0028
traits:
  # crypt_r / crypt_rn / crypt_ra are the reentrant spellings of one operation
  # (caller-supplied vs library-allocated result buffer), so they share a trait.
  - id: crypt-r
    desc: Derives a password hash via crypt_r
    if:
      type: import
      regex: '^crypt_r[an]?$'

  # A distinct signal from hashing: generating a salt means the program is
  # SETTING a new password hash, not checking an existing one. On a tool with no
  # business writing credentials that is the more interesting of the two.
  - id: crypt-gensalt
    desc: Generates a crypt password salt
    if:
      type: import
      regex: '^crypt_gensalt(_r[an])?$'

  # libxcrypt hash-strength policy check: reports whether a stored hash uses a
  # method the current configuration still accepts. Callers are password-change
  # and login paths deciding whether to re-hash on next authentication.
  - id: crypt-checksalt
    desc: Checks stored password hash strength
    conf: 0.88
    if:
      type: import
      exact: crypt_checksalt
