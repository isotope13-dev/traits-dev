# PBKDF2 evidence in compiled .NET output needs an advisory-string
# exclusion: SDK analyzer tables and runtime SYSLIB notices name
# Rfc2898DeriveBytes without using it. They ship in framework assemblies
# bundled by single-file publish (System.CodeDom, System.Management).
defaults:
  crit: notable
  conf: 0.97
  platforms: [unix, windows]
  for: [pe, dll]
traits:
  - id: sdk-rfc2898-analyzer-table
    desc: Rfc2898DeriveBytes analyzer table names
    if:
      type: text
      regex: 'Rfc2898DeriveBytesCtor(DiagId|Message)'
  - id: sdk-rfc2898-syslib-cryptderivekey
    desc: Rfc2898DeriveBytes SYSLIB obsolete notice
    if:
      type: text
      substr: Rfc2898DeriveBytes.CryptDeriveKey is obsolete
  - id: sdk-rfc2898-syslib-constructors
    desc: Rfc2898DeriveBytes constructor obsolete notice
    if:
      type: text
      substr: constructors on Rfc2898DeriveBytes are obsolete
  - id: sdk-rfc2898-syslib-outdated
    desc: Rfc2898DeriveBytes outdated-constructor notice
    if:
      type: text
      substr: in Rfc2898DeriveBytes constructors are outdated
