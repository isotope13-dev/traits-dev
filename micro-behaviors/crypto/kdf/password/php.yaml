# PHP password hashing and verification are password-KDF operations, not
# generic message-digest calls. The neutral capability is useful in both login
# and password-storage code; credential-access intent requires other evidence.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.9

traits:
  - id: password-hash
    desc: Derives password hash via PHP password_hash()
    if:
      type: symbol
      kind: call
      exact: password_hash

  - id: password-verify
    desc: Verifies password via PHP password_verify()
    if:
      type: symbol
      kind: call
      exact: password_verify

  - id: password-needs-rehash
    desc: Checks PHP password hash rehash status
    if:
      type: symbol
      kind: call
      exact: password_needs_rehash
