# File-dependent key construction; algorithm-specific KDF names live in algorithm/.
# A bare `key` symbol also names ordinary data and establishes no derivation.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, dylib, so, dll]
traits:
  - id: key-with-file-symbol
    desc: References key_with_file keying routine
    crit: notable
    conf: 0.85
    if:
      type: symbol
      regex: '^_?key_with_file$'
