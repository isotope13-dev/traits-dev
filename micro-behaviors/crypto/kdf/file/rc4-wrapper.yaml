defaults:
  platforms:
  - macos
  for:
  - macho
composite_rules:
- id: rc4-wrapper-file-keying-support
  desc: RC4 wrapper with file-keying routine
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/crypto/symmetric/stream/rc4::arc4-routine-symbol
  - id: micro-behaviors/crypto/kdf/file::key-with-file-symbol
  - id: metadata/binary/section/ratio::data-larger-than-cstring
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
