traits:
- conf: 0.8
  id: scrypt-name-literal
  desc: scrypt KDF named by a string constant
  if:
    type: literal
    kind: string
    regex: ^scrypt(Sync)?$
  unless:
  - id: well-known/lib/web/client-side/ecmascript/
- conf: 0.72
  id: node-memory-hard-kdf
  desc: Node memory hard KDF
  if:
    type: symbol
    regex: (^|\.)(scrypt|scryptSync)$
# Pure-`any:` composites over these two atoms were retired: cleave never
# emits a bare-any composite finding, and rules that reference one as a
# required leg silently never fire (observed on the mathsbase npm loader).
# Reference the atoms directly instead.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
