traits:
- conf: 0.8
  id: scrypt-name-literal
  desc: scrypt KDF named by a string constant
  if:
    type: literal
    kind: string
    regex: ^scrypt(Sync)?$
  unless:
  - id: well-known/lib/web/client-side/ecmascript/
- conf: 0.72
  id: node-memory-hard-kdf
  desc: Node memory hard KDF
  if:
    type: symbol
    regex: (^|\.)(scrypt|scryptSync)$
composite_rules:
- conf: 0.8
  id: node-scrypt-any-spelling
  desc: scrypt KDF by symbol or string constant
  any:
  - id: micro-behaviors/crypto/kdf/algorithm::node-memory-hard-kdf
  - id: micro-behaviors/crypto/kdf/algorithm::scrypt-name-literal
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
