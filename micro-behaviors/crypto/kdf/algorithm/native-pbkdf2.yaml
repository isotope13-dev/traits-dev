      type: hex
      section: __text
      # Salt || big-endian block index 1, followed by HMAC(password, salt).
      # Relocations and register allocation differ between builds.
      pattern: '(C7 40 20 00 00 00 01 [5] BE 24 00 00 00 B9 24 00 00 00 4C 89 FF 48 89 C2 [0-3] E8 ?? ?? ?? ?? [20-48] BE 24 00 00 00 B9 20 00 00 00 4C 89 FF 4C 89 E2 4D 89 E8 E8 | C7 43 20 00 00 00 01 BE 24 00 00 00 B9 24 00 00 00 4C 89 FF 48 89 DA [0-12] E8 ?? ?? ?? ?? [20-48] BE 24 00 00 00 B9 20 00 00 00 4C 89 FF [0-12] E8 | 08 20 A0 52 C8 22 00 B9 [4] E0 03 15 AA 81 04 80 52 E2 03 16 AA 83 04 80 52 ?? ?? ?? 94 E8 A7 45 A9 E8 A7 03 A9 E8 A7 46 A9 E8 A7 04 A9 33 00 80 52 [8] E0 03 15 AA 81 04 80 52 03 04 80 52 | E0 03 15 AA 81 04 80 52 E2 03 13 AA 83 04 80 52 ?? ?? ?? 94 E8 A7 44 A9 E8 A7 02 A9 E8 A7 45 A9 E8 A7 03 A9 37 00 80 52 F8 23 00 91 ?? ?? ?? 52 39 00 A0 72 E2 A3 00 91 E4 23 00 91 E0 03 15 AA 81 04 80 52 03 04 80 52)'
