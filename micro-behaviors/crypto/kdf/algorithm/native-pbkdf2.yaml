defaults:
  for: [macho]
  platforms: [macos]
  crit: notable
  conf: 0.96

traits:
  - id: pbkdf2-36-byte-password
    desc: PBKDF2 with 36-byte password, 32-byte salt
    if:
      type: yara
      # Whole-container scan: Mach-O section hex is slice-local on universals.
      source: |
        rule pbkdf2_36_byte_password {
          strings:
            $x64 = { C7 4? 20 00 00 00 01 [5] BE 24 00 00 00 B9 24 00 00 00 4C 89 F? [0-16] E8 [20-48] BE 24 00 00 00 B9 20 00 00 00 }
            $arm64_a = { 08 20 A0 52 C8 22 00 B9 [4] E0 03 15 AA 81 04 80 52 E2 03 16 AA 83 04 80 52 }
            $arm64_b = { E0 03 15 AA 81 04 80 52 E2 03 13 AA 83 04 80 52 ?? ?? ?? 94 E8 A7 44 A9 E8 A7 02 A9 E8 A7 45 A9 E8 A7 03 A9 37 00 80 52 }
          condition:
            any of them
        }
