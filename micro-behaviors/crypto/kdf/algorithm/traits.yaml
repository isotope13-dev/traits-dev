defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries, go, wasm]
traits:
  - id: hkdf-import
    for: [python]
    desc: Python HKDF algorithm reference
    crit: notable
    conf: 0.88
    if:
      type: symbol
      exact: HKDF
  - id: chrome-compatible-kdf-binary-salt
    desc: Chrome-compatible key-derivation salt literal
    crit: notable
    conf: 0.9
    for: [binaries]
    if:
      type: text
      exact: saltysalt
  - id: hkdf-source-text
    desc: Source references HKDF key derivation
    crit: notable
    conf: 0.8
    for: [scripts, go, wasm, -pe, -elf, -macho]
    if:
      type: text
      word: HKDF
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: hkdf-import

  - id: hkdf-elf-rodata
    desc: ELF read-only data references HKDF
    crit: notable
    conf: 0.9
    for: [elf]
    if:
      type: text
      word: HKDF
      section: .rodata
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: hkdf-import

  - id: hkdf-pe-rdata
    desc: PE read-only data references HKDF
    crit: notable
    conf: 0.9
    for: [pe]
    if:
      type: text
      # Require a complete token or algorithm/API context, not a noise substring.
      regex: '(?i)(^HKDF$|\bHKDF[-_](SHA|EXPAND|EXTRACT)|HKDF[ (][A-Za-z])'
      section: .rdata
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: hkdf-import

  # CLR type names live in the managed metadata heap in .text, rather than
  # the native read-only data section covered above.
  - id: hkdf-pe-text
    desc: PE code section references HKDF
    crit: notable
    conf: 0.9
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      exact: HKDF
      section: .text

  - id: hkdf-macho-cstring
    desc: Mach-O string data references HKDF
    crit: notable
    conf: 0.9
    for: [macho]
    if:
      type: text
      word: HKDF
      section: __cstring
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: hkdf-import
  - id: pycryptodome-kdf-module-ref
    # PyCryptodome's KDF (PBKDF2/scrypt) module. In a compiled .pyc the dotted
    # module name survives as a code-object constant even though the bare
    # `PBKDF2` symbol may not, so this recovers the key-derivation signal there.
    desc: Crypto.Protocol.KDF module reference
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: Crypto.Protocol.KDF
  - id: pbkdf2
    desc: PBKDF2 key-derivation reference
    crit: notable
    conf: 0.75
    # Agent prompt carriers can embed runnable source inside HTML, Markdown,
    # or JSON rather than arriving as a standalone source file.
    for: [scripts, binaries, go, wasm, html, markdown, text, json, documents]
    if:
      type: text
      # Require a standalone algorithm/function token. Apple CSSM names such
      # as CSSM_ALGID_PKCS5_PBKDF2 are framework constants, not operations.
      regex: '(?i)(^|[^A-Za-z0-9_])(PBKDF2(HMAC)?|PKCS5_PBKDF2_HMAC)([^A-Za-z0-9_]|$)'
    not:
      - substr: BCRYPT_PBKDF2_ALG_HANDLE
    unless:
      - id: metadata/signed/platform::microsoft
      - id: metadata/file/catalog/identity/
      - id: metadata/file/extension/identity::declaration-file-extension
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
      - id: well-known/lib/development/ts-compiler-lib::typescript-compiler-lib-context
      # Legacy crypto-browserify enumerates PBKDF2 among APIs whose generated
      # stubs only throw "not implemented". A structured call rule separately
      # detects real Node PBKDF2 use.
      - id: well-known/lib/crypto/crypto-browserify::polyfill-bundle
  - id: python-hashlib-pbkdf2-hmac
    desc: Python hashlib.pbkdf2_hmac key derivation
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '\.pbkdf2_hmac\s*\('
  # Chromium on Linux seals cookies and passwords under PBKDF2-HMAC-SHA1 with
  # the fixed password "peanuts" and salt "saltysalt". Cookie libraries use
  # the same call, so this stays a capability; login theft is a composite.
  - id: python-chromium-linux-default-kdf
    desc: Python derives Chromium Linux default key
    crit: notable
    conf: 0.96
    for: [python]
    attack: T1555.003
    if:
      type: text
      regex: '\.pbkdf2_hmac\([^)]{0,80}peanuts[^)]{0,40}saltysalt'
  - id: scrypt
    desc: References the scrypt key derivation function
    conf: 0.75
    if:
      type: text
      word: scrypt
      case_insensitive: true
    crit: notable
  - id: argon2
    desc: References Argon2 key derivation
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: argon2
      case_insensitive: true
  - id: argon2id-python-api
    desc: Python Argon2id key-derivation API
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: symbol
      exact: Argon2id
  # `word: bcrypt` also matched the Windows CNG provider library
  # (`bcrypt.dll`, `bcrypt.h`, `bcrypt.lib`), whose BCrypt* APIs perform
  # AES/RSA/SHA operations -- not the bcrypt password hash. The old
  # `not: ^bcrypt\.dll$` never excluded anything: `not:` tests the matched
  # span, and a `word:` span is exactly `bcrypt`, so the suffix was invisible
  # to the filter while an import-table `bcrypt.dll` run still reported
  # "password hashing". The matcher below keeps the word boundary (so
  # `BCryptDecrypt`-style API names still never match) but extends the span
  # over up to 8 trailing non-space characters, which lets the CNG filename
  # exclusion below see the suffix it keys on.
  # The span extension alone still claimed "password hashing" for the CNG
  # wrapper type itself: a managed CNG helper carries the bare heap string
  # `BCrypt` plus `BCrypt.BCryptDecrypt() failed`-style error text, and the
  # span for those runs is exactly `BCrypt` / `BCrypt.BCryptD...`, which the
  # filename exclusion cannot see. Keep a word boundary right after the
  # algorithm name (so `bcryptprimitives.dll` and verb-suffixed CNG entry
  # points such as `BCryptDecrypt` never match at all), extend the span
  # over the dotted qualifier that follows, and exclude the remaining CNG
  # shapes inside it: a lone PascalCase `BCrypt` heap name and dotted CNG
  # error text (`BCrypt.BCryptDecrypt`). Password-hash uses survive:
  # lowercase module and call forms (`bcrypt.hashpw`, `x/crypto/bcrypt`),
  # `BCrypt::Password` (qualified, not verb-suffixed), and `BCrypt.Net`
  # (dotted library name) all keep firing.
  - id: bcrypt-password-reference
    desc: References bcrypt password hashing
    crit: notable
    conf: 0.75
    # Python commonly binds ctypes.windll.bcrypt to a variable named bcrypt.
    # CNG encryption is distinct from the bcrypt password-hashing algorithm.
    for: [scripts, binaries, go, wasm, -python]
    if:
      type: text
      regex: '(?i)\bbcrypt\b\S{0,24}'
    not:
      - regex: '(?i)bcrypt\.(dll|h|lib)\b'
      - regex: '(?-i)(^BCrypt$|BCrypt[A-Z]|BCRYPT_)'
  - id: python-bcrypt-password-api
    desc: Calls a Python bcrypt password API
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^bcrypt\.(hashpw|checkpw|gensalt)$'
  - id: evp-pkey-derive
    desc: EVP_PKEY_derive key-derivation API reference
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: EVP_PKEY_derive
  - id: pkcs5-pbkdf2
    desc: PKCS5_PBKDF2_HMAC function
    conf: 0.75
    if:
      type: text
      substr: PKCS5_PBKDF2_HMAC
  - id: yescrypt-export
    desc: yescrypt KDF export
    crit: notable
    conf: 0.95
    for: [pe, elf, macho]
    if:
      type: export
      exact: yescrypt_kdf
  - id: pbkdf2-sha256-export
    desc: PBKDF2-SHA256 export
    crit: notable
    conf: 0.95
    for: [pe, elf, macho]
    if:
      type: export
      exact: PBKDF2_SHA256
  - id: libcperciva-sha256-export
    desc: libcperciva SHA256 export
    crit: notable
    conf: 0.95
    for: [pe, elf, macho]
    if:
      type: export
      regex: '^libcperciva_(HMAC_)?SHA256_(Init|Update|Final|Buf)$'
composite_rules:
  - id: bcrypt
    desc: References bcrypt password hashing
    crit: notable
    conf: 0.9
    any:
      - id: bcrypt-password-reference
      - id: python-bcrypt-password-api
      - id: metadata/import/python/bcrypt

  - id: hkdf
    desc: HKDF key-derivation reference
    crit: notable
    conf: 0.8
    any:
      - id: hkdf-source-text
      - id: hkdf-elf-rodata
      - id: hkdf-pe-rdata
      - id: hkdf-pe-text
      - id: hkdf-macho-cstring

  - id: key-derivation
    desc: Key-derivation algorithm or API references
    crit: notable
    conf: 0.75
    any:
      - id: pbkdf2
      - id: scrypt
      - id: argon2
      - id: argon2id-python-api
      - id: bcrypt
      - id: micro-behaviors/crypto/kdf/algorithm::hkdf
      - id: evp-pkey-derive
      - id: pkcs5-pbkdf2
      - id: yescrypt-export
      - id: pbkdf2-sha256-export
  - id: password-kdf-library-exports
    for: [elf, macho, pe]
    desc: Password KDF library exports
    crit: component
    conf: 0.95
    all:
      - id: yescrypt-export
      - id: pbkdf2-sha256-export
      - id: libcperciva-sha256-export
