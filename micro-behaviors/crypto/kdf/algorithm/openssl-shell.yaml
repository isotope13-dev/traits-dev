# Match a call's options rather than algorithm vocabulary in a manual page.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.96

traits:
  - id: shell-openssl-enc-pbkdf2
    desc: OpenSSL enc call selects PBKDF2 derivation
    if:
      type: symbol
      kind: call
      exact: openssl
      args:
        - index: 0
          kind: identifier
          name: enc
        - kind: identifier
          name: -pbkdf2
