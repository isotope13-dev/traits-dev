defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: chrome-compatible-kdf-source-salt
    desc: Chromium key derivation source salt
    if:
      type: literal
      kind: string
      exact: saltysalt

composite_rules:
  - id: chrome-compatible-kdf-salt
    desc: Chromium key derivation salt reference
    for: [scripts, source, binaries]
    any:
      - id: chrome-compatible-kdf-binary-salt
      - id: chrome-compatible-kdf-source-salt
