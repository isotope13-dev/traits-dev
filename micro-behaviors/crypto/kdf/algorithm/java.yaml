defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin, class, android_apk, zip]
  crit: notable
  conf: 0.9
  attack: T1573.001

traits:
  - id: java-pbkdf2-key-factory
    for: [java, kotlin, class]
    desc: Java PBKDF2 key-derivation factory
    if:
      type: text
      regex: '(?i)PBKDF2WithHmac(SHA1|SHA256|SHA384|SHA512)'
