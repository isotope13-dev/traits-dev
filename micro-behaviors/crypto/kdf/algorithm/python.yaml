defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

traits:
- id: mnemonic-library-pbkdf2-rounds
  desc: "PBKDF2 rounds parameter identifier"
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: PBKDF2_ROUNDS
- id: chromium-safe-storage-pbkdf2
  desc: PBKDF2 uses Chromium safe-storage password
  crit: notable
  conf: 0.96
  if:
    type: symbol
    kind: call
    substr: pbkdf2_hmac
    arg:
      kind: string
      exact: peanuts

composite_rules:
# Hashing an embedded literal directly beside cipher initialization is the
# unsalted, single-iteration spelling of "turn a hardcoded secret into a
# symmetric key". Adjacency supports the derivation reading without proving
# the assignment; the description keeps to the two observed facts.
- id: python-sha256-literal-aes-key
  desc: SHA-256 of embedded string beside AES key setup
  crit: notable
  conf: 0.85
  near_lines: 12
  all:
  - id: micro-behaviors/crypto/hash/digest/sha2::python-sha256-embedded-string
  - id: micro-behaviors/crypto/symmetric/aes/initialize::aes-new-symbol-reference
