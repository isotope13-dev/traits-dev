defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

traits:
- id: mnemonic-library-pbkdf2-rounds
  desc: "PBKDF2 rounds parameter identifier"
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: PBKDF2_ROUNDS
- id: chromium-safe-storage-pbkdf2
  desc: PBKDF2 uses Chromium safe-storage password
  crit: notable
  conf: 0.96
  if:
    type: symbol
    kind: call
    substr: pbkdf2_hmac
    arg:
      kind: string
      exact: peanuts
