# Key/encoded-data declarations are neutral crypto configuration evidence.
# They do not identify executable content or establish concealment intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
traits:
  - id: js-salt-literal-const
    desc: Module-level salt string constant
    crit: notable
    conf: 0.7
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?im)^\s*(const|let|var)\s+\w*(SALT|AES_SALT)\w*\s*=\s*["''][^"'']{4,80}["'']'
