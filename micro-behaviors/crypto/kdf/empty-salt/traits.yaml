# Faithful translations of the empty-salt PBKDF2 construction used by
# CVE-2023-49105 exploit clients. Each matcher remains a neutral observation
# about the KDF call; the ownCloud bypass intent is composed elsewhere.
defaults:
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.98

traits:
  - id: python-pbkdf2-sha512
    desc: Python PBKDF2-SHA512 uses an empty salt
    for: [python]
    if:
      type: text
      regex: 'hashlib\.pbkdf2_hmac\(\s*[''"]sha512[''"],[\s\S]{0,100},\s*b?[''"]{2}'

  - id: javascript-pbkdf2-parameters
    desc: JavaScript PBKDF2 empty-salt parameters
    for: [javascript, typescript]
    if:
      type: text
      regex: 'pbkdf2(Sync)?\([\s\S]{0,100},\s*[''"]{2},\s*10000,\s*32,\s*[''"]sha512[''"]'

  - id: go-pbkdf2-parameters
    desc: Go PBKDF2 empty-salt parameters
    for: [go]
    if:
      type: text
      regex: 'pbkdf2\.Key\([\s\S]{0,100},\s*\[\]byte\{\s*\},\s*10000,\s*32,\s*sha512\.New'

  - id: php-pbkdf2-sha512
    desc: PHP PBKDF2-SHA512 uses an empty salt
    for: [php]
    if:
      type: text
      regex: 'hash_pbkdf2\(\s*[''"]sha512[''"],[\s\S]{0,100},\s*[''"]{2},\s*10000'
