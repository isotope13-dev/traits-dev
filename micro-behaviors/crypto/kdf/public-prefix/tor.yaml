defaults:
  platforms: [unix, windows]
  for: [go, python]
  crit: suspicious
  conf: 0.98
traits:
  # This is a Tor protocol domain separator, not prose from the report.
  # The closing call delimiters require that no secret prefix is appended.
  - id: tor-empty-prefix-go
    desc: Hashes Tor nonce domain without secret prefix
    for: [go]
    if:
      type: tree-sitter
      language: go
      query: |
        ((call_expression
          function: (selector_expression field: (field_identifier) @hash)
          arguments: (argument_list . (type_conversion_expression
            type: (slice_type element: (type_identifier) @byte)
            operand: [
              (interpreted_string_literal (interpreted_string_literal_content) @domain)
              (raw_string_literal (raw_string_literal_content) @domain)
            ]) .)) @hashing
          (#eq? @hash "Sum512") (#eq? @byte "byte")
          (#eq? @domain "Derive temporary signing key hash input"))
  - id: tor-precomputed-public-prefix-go
    desc: Decodes the public Tor signing nonce prefix
    for: [go]
    if:
      type: symbol
      kind: call
      exact: encoding/hex.DecodeString
      arg:
        index: 0
        from:
          value: '^0b4f49847218185bcde63c568cc8897ae21ad33809c8e7d0e6401ea7d6a4019f$'
  - id: tor-empty-prefix-python
    desc: Hashes Tor nonce domain without secret prefix
    for: [python]
    if:
      type: text
      regex: 'sha512\(b["'']Derive temporary signing key hash input["'']\)'
  # SHA512(domain separator)[:32] when the secret PRF half is absent.
  # Detect its precomputed form so removing the hashing call does not evade it.
  - id: tor-precomputed-public-prefix-python
    desc: Decodes precomputed Tor public nonce prefix
    for: [python]
    if:
      type: text
      regex: 'fromhex\(\s*["'']0b4f49847218185bcde63c568cc8897ae21ad33809c8e7d0e6401ea7d6a4019f["'']\s*\)'
