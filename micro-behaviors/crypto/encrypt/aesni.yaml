defaults:
  platforms: [unix, windows]
  for: [elf, pe, macho, dll, so, dylib]
  arch: [x86, x86-64]

traits:
  - id: aesni-block-encryption-routine
    desc: AES-NI block encryption and output store
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Multiple rounds, the final round, and a block store/return. AESENC
      # alone also occurs in Go's hash function and is not encryption proof.
      pattern: '66 0F 38 DC ?? [4-32] 66 0F 38 DC ?? [4-128] 66 0F 38 DD ?? 0F 11 (00|01|02|03|06|07) C3'
