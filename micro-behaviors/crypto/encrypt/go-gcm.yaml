# Require a Seal call on the result of the standard Go GCM constructor.
# An unrelated method named Seal is not encryption.
defaults:
  platforms: [unix, windows]
  for: [go]

traits:
  - id: go-gcm-seal
    desc: Encrypts with a constructed Go GCM AEAD
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      regex: '\.Seal$'
      receiver:
        from:
          call: '^crypto/cipher\.NewGCM(WithNonceSize|WithTagSize)?$'
