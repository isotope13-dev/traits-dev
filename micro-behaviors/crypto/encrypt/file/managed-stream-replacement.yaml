defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # This file-scoped API profile is useful even for legitimate encryptors.
  # It does not bind SetLength's receiver to the cipher stream or prove that
  # every enumerated drive is encrypted. Attack context belongs to consumers.
  - id: managed-drive-stream-replacement-profile
    desc: Drive enumeration with encryption and stream-reset references
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/encrypt/reference::dotnet-create-encryptor
      - id: micro-behaviors/crypto/cipher/io::dotnet-cryptostream
      - id: micro-behaviors/fs/enumerate/drives::get-drives-dotnet
    any:
      - id: micro-behaviors/fs/file/truncate::dotnet-stream-setlength
      - id: micro-behaviors/data/control-flow/sequence::cil-zero-int64-two-buffer-call-layout
