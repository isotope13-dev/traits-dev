defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: node-cipher-get-auth-tag
    desc: Retrieves a cipher encryption authentication tag
    if:
      type: symbol
      kind: call
      regex: '(^|\.)getAuthTag$'
      receiver:
        from:
          call: '(^|\.)createCipheriv$'
