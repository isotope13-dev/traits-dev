defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-crypto-create-cipher
    desc: Node.js crypto.createCipheriv usage
    conf: 0.9
    if:
      type: text
      regex: 'crypto\.createCipheriv\s*\('
    unless:
      - id: micro-behaviors/crypto/encrypt/unspecified::createCipheriv
  - id: create-cipher-call
    desc: JavaScript createCipher API call
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)createCipher$'
