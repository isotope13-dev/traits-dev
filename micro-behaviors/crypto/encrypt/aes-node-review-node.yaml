defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - typescript
traits:
  - id: cipher-update-server-url
    desc: cipher.update references serverUrl
    crit: notable
    conf: 0.94
    mbc: C0027
    if:
      type: text
      regex: '\bcipher\.update\(\s*serverUrl\b'
  - id: createCipheriv
    desc: Initialize Node.js encrypting cipher with IV
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: (^|\.)createCipheriv$
