# Encryption and cleanup are useful observations without extortion evidence.
# File-wide co-occurrence does not prove that the removed file is the input.
defaults:
  platforms: [windows]
  for: [powershell, batch]
  crit: notable
  conf: 0.99
  size_min: 256
  size_max: 1048576

composite_rules:
  - id: powershell-file-encryption-and-removal
    desc: File encryption APIs alongside writes and forced removal
    all:
      - id: micro-behaviors/fs/read/file/full::powershell-file-readallbytes
      - id: micro-behaviors/crypto/cipher::dotnet-transform-final-block
      - id: micro-behaviors/crypto/symmetric/encrypt::dotnet-create-encryptor
      - id: micro-behaviors/fs/write/file/full::write-all-bytes
      - id: micro-behaviors/fs/delete/file/command::powershell-remove-item-force
