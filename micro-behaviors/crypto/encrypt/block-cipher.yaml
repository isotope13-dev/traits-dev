defaults:
  platforms: [windows, unix]
  for: [c, cpp, html, text]
  crit: notable
  conf: 0.92

traits:
  - id: ecb-encrypt-call
    desc: Calls a block-cipher ECB encrypt
    if:
      type: text
      # Require call-site arguments, rather than matching declarations such as
      # `void blf_ecb_encrypt(blf_ctx *, u_int8_t *, u_int32_t);`.
      regex: '(?i)\b\w{1,24}_ecb_encrypt\s*\(\s*\w+\s*,\s*\w+\s*,'
