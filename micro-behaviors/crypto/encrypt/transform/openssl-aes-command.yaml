defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: openssl-aes-encrypt-command
    desc: OpenSSL AES encryption command
    crit: notable
    conf: 0.9
    if:
      type: yara
      source: |
        rule openssl_aes_encrypt_command {
          strings:
            $command = /openssl[ \t]+enc[ \t]+[^\r\n;|&]*/
            $aes = /-aes-[0-9]+-/
            $decrypt = /[ \t]-(d|decrypt)([ \t\r\n;|&]|$)/
          condition:
            for any c in (1..#command) : (
              for any a in (1..#aes) : (
                @aes[a] >= @command[c] and
                @aes[a] < @command[c] + !command[c] and
                (#decrypt == 0 or for all d in (1..#decrypt) : (
                  @decrypt[d] < @command[c] or
                  @decrypt[d] >= @command[c] + !command[c]
                ))
              )
            )
        }
