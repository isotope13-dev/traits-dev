defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92

traits:
  - id: encrypted-media-stream-helper-call
    desc: Calls encryptedStream media encryption helper
    if:
      type: symbol
      kind: call
      exact: encryptedStream
  - id: aes-ctr-helper-call
    desc: Calls an AES-CTR encryption helper
    if:
      type: symbol
      kind: call
      regex: '(^|\.)aesEncryptCTR$'
