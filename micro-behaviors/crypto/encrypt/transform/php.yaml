defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.95
  mbc: C0027

traits:
  - id: php-openssl-encrypt-call
    desc: PHP calls OpenSSL encryption API
    if:
      type: symbol
      kind: call
      exact: openssl_encrypt

  # The cipher selector must belong to this OpenSSL call, rather than an
  # unrelated literal elsewhere in the file.
  - id: php-openssl-aes-cbc
    desc: PHP OpenSSL AES CBC encryption
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: openssl_encrypt
      arg:
        index: 1
        kind: string
        regex: '(?i)^AES-(128|192|256)-CBC$'
