defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, go, rust, python, powershell, javascript, typescript]
  mbc: C0027
  attack: T1027
  crit: notable

traits:
  - id: reencrypt-call
    desc: Calls a re-encryption helper
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^re_?encrypt[A-Za-z0-9_]*$'
