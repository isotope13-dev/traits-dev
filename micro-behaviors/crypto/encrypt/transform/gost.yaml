defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, python, javascript, typescript, go, rust]

traits:
  - id: gost-named-encrypt-call
    desc: Calls a named GOST encryption routine
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|[.:_])gost([._]?28147)?[._]?encrypt$'
