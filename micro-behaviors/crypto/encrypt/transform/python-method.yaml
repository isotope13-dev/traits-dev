defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  # Structured call-site match (typed arguments, real call node) instead of a
  # raw `.encrypt(` text scan: same capability, fewer matches on strings,
  # comments, and unrelated ORMs.
  - id: python-encrypt-method-call
    desc: Calls an encrypt-named Python function
    conf: 0.8
    unless:
      - type: path
        regex: '(?i)\\.j$'
    if:
      type: symbol
      kind: call
      regex: '(^|\.)encrypt$'

# Preserve the former source-type alternatives without asserting that an
# import or symbol reference proves encryption.
composite_rules:
  - id: source-encryption-or-cipher-references
    desc: Source encryption calls or cipher name references
    for: [scripts, source]
    crit: notable
    conf: 0.8
    any:
      - id: python-encrypt-method-call
      - id: micro-behaviors/crypto/encrypt/transform::cfml-encrypted-request-url
      - id: micro-behaviors/crypto/encrypt/transform::cfml-encrypt-aes-selection
      - id: micro-behaviors/crypto/encrypt/file::python-encrypt-file-call
      - id: metadata/import/module::python-pyencryptor-import
      - id: micro-behaviors/crypto/encrypt/reference::openssl-encryption-init
      - id: micro-behaviors/crypto/encrypt/reference::aes-encrypt-routine
      - id: micro-behaviors/crypto/encrypt/reference::mbedtls-aes-encrypt
      - id: micro-behaviors/crypto/encrypt/reference::gcrypt-cipher-encrypt
      - id: micro-behaviors/crypto/encrypt/reference::symmetric-cipher-api-reference
