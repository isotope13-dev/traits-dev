defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
  mbc: C0027
traits:
  - id: python-aes-encrypt-call
    desc: Encrypts using constructed AES cipher
    if:
      type: symbol
      kind: call
      regex: '\.encrypt$'
      receiver:
        from:
          call: '(^|\.)AES\.new$'
