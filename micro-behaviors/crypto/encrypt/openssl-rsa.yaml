# Direction-specific API observations belong with encryption, rather than
# algorithm presence. Matchers and scopes retained from asymmetric/rsa.
defaults:
  platforms: [windows, linux, macos]

traits:
  - id: rsa-public-encrypt
    desc: RSA_public_encrypt reference
    crit: notable
    conf: 0.6
    for: [scripts, binaries, source]
    if:
      type: text
      substr: RSA_public_encrypt

  - id: rsa-public-encrypt-call
    desc: Calls RSA public-key encryption
    crit: notable
    conf: 0.9
    for: [elf, pe, c, cpp, go, rust]
    if:
      type: symbol
      kind: call
      exact: RSA_public_encrypt
