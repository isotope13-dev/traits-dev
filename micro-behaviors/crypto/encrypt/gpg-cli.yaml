# GnuPG's symmetric-encryption CLI is a neutral cryptographic capability.
# Nearby enumeration and deletion do not by themselves establish ransomware.
defaults:
  crit: notable
  platforms: [unix]
  for: [shell]
  mbc: C0027

traits:
  - id: gpg-symmetric-encryption-command
    desc: GnuPG command performs symmetric encryption
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '^gpg2?$'
      arg:
        kind: identifier
        name: --symmetric

composite_rules:
  - id: gpg-symmetric-passphrase-loopback-cooccurrence
    desc: GnuPG symmetric, passphrase and loopback options nearby
    conf: 0.98
    all:
      - id: gpg-symmetric-encryption-command
      - id: metadata/lang/source/syntax/command/invocation::gpg-command-line-passphrase
      - id: metadata/lang/source/syntax/command/invocation::gpg-loopback-pinentry-command
    near_lines: 12

  - id: gpg-symmetric-gpg-path-cooccurrence
    desc: GnuPG symmetric command and .gpg path argument nearby
    conf: 0.94
    all:
      - id: gpg-symmetric-encryption-command
      - id: metadata/lang/source/syntax/command/invocation::gpg-extension-path-argument
    near_lines: 12
