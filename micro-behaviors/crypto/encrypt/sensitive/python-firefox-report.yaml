defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.98
traits:
- id: python-firefox-logins-encryption
  desc: Encryption input contains Firefox login records
  if:
    type: symbol
    kind: call
    regex: \.encrypt$
    arg:
      index: 0
      from:
        call: ^open$
        literal: (^|[/\\])logins\.json$
        through: &id001
        - call: (^|\.)read$
          receiver: true
        - call: ^base64\.b64encode$
          arguments:
          - 0
        - call: (^|\.)decode$
          receiver: true
        - call: ^json\.dumps$
          arguments:
          - 0
        - call: (^|\.)encode$
          receiver: true
        - call: ^pad$
          arguments:
          - 0
- id: python-firefox-key-store-encryption
  desc: Encryption input contains Firefox key database
  if:
    type: symbol
    kind: call
    regex: \.encrypt$
    arg:
      index: 0
      from:
        call: ^open$
        literal: (^|[/\\])key[34]\.db$
        through: *id001
- id: python-environment-report-encryption
  desc: Encrypts serialized process environment
  if:
    type: tree-sitter
    query: |
      ((block
        (expression_statement (assignment
          left: (identifier) @report
          right: (dictionary (pair value: (call
            function: (identifier) @dict
            arguments: (argument_list . (attribute) @env .))))))
        . (expression_statement (assignment
          left: (identifier) @raw
          right: (call function: (attribute
            object: (call function: (attribute) @dumps
              arguments: (argument_list . (identifier) @serialized .))
            attribute: (identifier) @encode))))
        . (expression_statement (assignment left: (pattern_list
          (identifier) @key (identifier) @iv)))
        . (expression_statement (assignment
          right: (call function: (attribute attribute: (identifier) @encrypt)
            arguments: (argument_list . (call function: (identifier) @pad
              arguments: (argument_list . (identifier) @input)) .)) @cipher)))
        (#not-eq? @raw @key) (#not-eq? @raw @iv)
        (#eq? @dict "dict") (#eq? @env "os.environ")
        (#eq? @report @serialized) (#eq? @dumps "json.dumps")
        (#eq? @encode "encode") (#eq? @raw @input)
        (#eq? @encrypt "encrypt") (#eq? @pad "pad"))
