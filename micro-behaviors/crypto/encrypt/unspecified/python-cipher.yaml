defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
  mbc: C0027
traits:
  - id: python-aes-encrypt-call
    desc: Encrypts using constructed AES cipher
    if:
      type: symbol
      kind: call
      regex: '\.encrypt$'
      receiver:
        from:
          call: '(^|\.)AES\.new$'

composite_rules:
  # cryptography spelling: an AES-mode Cipher construction feeding an
  # encryption context. Either mode atom supplies the AES identity; the
  # encryptor call supplies the encryption direction.
  - id: python-cryptography-aes-encryptor
    desc: Python cryptography AES encryption context
    all:
      - id: micro-behaviors/crypto/encrypt/initialize::python-cipher-encryptor-context
    any:
      - id: micro-behaviors/crypto/symmetric/aes/initialize::python-aes-cbc-cipher
      - id: micro-behaviors/crypto/symmetric/aes/mode::python-aes-gcm-references

  # Library-spelling umbrella for AES bulk encryption: the PyCryptodome
  # AES.new receiver encrypt call or the cryptography AES encryptor above.
  - id: python-aes-bulk-encrypt
    desc: Python encrypts bulk data with AES
    any:
      - id: python-aes-encrypt-call
      - id: python-cryptography-aes-encryptor
