defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: forge-aes-gcm-encryptor
    desc: Creates an AES-GCM encryption cipher
    if:
      type: symbol
      kind: call
      exact: forge.cipher.createCipher
      arg:
        index: 0
        kind: string
        exact: AES-GCM
  - id: rsa-pkcs1-v1-5-encrypt-call
    desc: Encrypts with RSA PKCS1 v1.5 padding
    if:
      type: symbol
      kind: call
      regex: '\.encrypt$'
      arg:
        index: 1
        kind: string
        exact: RSAES-PKCS1-V1_5
