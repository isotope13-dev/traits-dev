# These unqualified calls do not establish their receiver or algorithm.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component
  conf: 0.9
traits:
  - id: encrypt-sk-call-text
    desc: encrypt call text with sk argument
    if:
      type: text
      regex: '\bencrypt\s*\(\s*sk\s*,'
