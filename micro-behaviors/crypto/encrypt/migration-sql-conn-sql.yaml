# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - asp
traits:
- id: sql-aes-encrypt-function
  desc: SQL AES_ENCRYPT function call
  crit: notable
  conf: 0.93
  for:
  - scripts
  - binaries
  - c
  - cpp
  - go
  if:
    type: literal
    kind: string
    regex: (?i)\bAES_ENCRYPT\s*\(
  unless:
  - id: metadata/build/scaffold::antlr-generated-parser
