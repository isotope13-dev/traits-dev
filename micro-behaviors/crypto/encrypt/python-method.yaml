defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  # Structured call-site match (typed arguments, real call node) instead of a
  # raw `.encrypt(` text scan: same capability, fewer matches on strings,
  # comments, and unrelated ORMs. The Jennifer exclusion predates this matcher
  # and is kept as belt-and-braces for text-level reuses of this rule.
  - id: python-encrypt-method-call
    desc: Python calls an object's encrypt method
    conf: 0.8
    unless:
      - id: well-known/app/development/jennifer/
      - type: path
        regex: '(?i)\\.j$'
    if:
      type: symbol
      kind: call
      regex: '(^|\.)encrypt$'

# Preserve the former source-type alternatives without asserting that an
# import or symbol reference proves encryption.
composite_rules:
  - id: source-encryption-or-cipher-references
    desc: Source encryption calls or cipher name references
    for: [scripts, source]
    crit: notable
    conf: 0.8
    any:
      - id: python-encrypt-method-call
      - id: micro-behaviors/crypto/encrypt::cfml-encrypted-request-url
      - id: micro-behaviors/crypto/encrypt::cfml-encrypt-aes-selection
      - id: micro-behaviors/crypto/encrypt::python-encrypt-file-call
      - id: metadata/import/module::python-pyencryptor-import
      - id: metadata/binary/symbols/name/crypto::openssl-encryption-init
      - id: metadata/binary/symbols/name/crypto::aes-encrypt-routine
      - id: metadata/binary/symbols/name/crypto::mbedtls-aes-encrypt
      - id: metadata/binary/symbols/name/crypto::gcrypt-cipher-encrypt
      - id: metadata/binary/symbols/name/crypto::symmetric-cipher-api-reference
