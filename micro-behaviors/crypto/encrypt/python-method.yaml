defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  # Structured call-site match (typed arguments, real call node) instead of a
  # raw `.encrypt(` text scan: same capability, fewer matches on strings,
  # comments, and unrelated ORMs. The Jennifer exclusion predates this matcher
  # and is kept as belt-and-braces for text-level reuses of this rule.
  - id: python-encrypt-method-call
    desc: Python calls an object's encrypt method
    conf: 0.8
    unless:
      - id: well-known/app/development/jennifer/
      - type: path
        regex: '(?i)\\.j$'
    if:
      type: symbol
      kind: call
      regex: '(^|\.)encrypt$'

# Preserve consumers of the former directory membership without claiming
# that the generic Python encrypt method establishes a symmetric algorithm.
composite_rules:
  - id: python-encrypt-or-symmetric-evidence
    desc: Python encrypt call or symmetric encryption evidence
    for: [scripts, source]
    crit: notable
    conf: 0.8
    any:
      - id: python-encrypt-method-call
      - id: micro-behaviors/crypto/symmetric/encrypt/
