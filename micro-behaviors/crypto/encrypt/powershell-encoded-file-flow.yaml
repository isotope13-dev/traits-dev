defaults:
  platforms: [windows]
  for: [batch, powershell]
traits:
  - id: powershell-file-bytes-to-transform
    desc: PowerShell file bytes flow to crypto transform
    crit: notable
    conf: 0.97
    if:
      type: encoded
      encoding: base64
      regex: 'ReadAllBytes\(\$f\.FullName\)[\s\S]{0,160}TransformFinalBlock\(\$bytes'
