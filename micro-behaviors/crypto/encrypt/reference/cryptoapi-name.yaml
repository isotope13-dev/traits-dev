defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # Dynamic GetProcAddress users retain the API spelling without an import.
  # This is a reference, not proof that any particular buffer is encrypted.
  - id: crypt-encrypt-api-name
    desc: CryptEncrypt name without imported symbol
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: CryptEncrypt
    unless:
      - id: micro-behaviors/crypto/provider/cryptoapi::crypt-encrypt
