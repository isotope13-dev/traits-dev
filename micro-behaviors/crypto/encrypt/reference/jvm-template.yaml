# Runtime-compiled advice is retained in constant-pool strings, including when
# the enclosing agent was built in another JVM language. Raw text extraction
# can omit these long, multiline constants; use the parsed class view.
defaults:
  platforms: [unix, windows]
  for: [class]
  crit: notable
  conf: 0.96

traits:
  - id: jvm-template-cipher-encrypt-init
    desc: JVM source template selects cipher encryption
    if:
      type: value
      path: class.strings[*]
      regex: '\.init\s*\(\s*(javax\.crypto\.)?Cipher\s*\.\s*ENCRYPT_MODE\b'

  # Cipher.getInstance and the subsequent initializer must share one parsed
  # template constant. A bare .init(1, ...) is not a crypto observation.
  - id: jvm-template-cipher-encrypt-numeric-init
    desc: Cipher template initializes numeric encryption
    if:
      type: value
      path: class.strings[*]
      regex: 'Cipher\s*\.getInstance\s*\([^;]{1,120};[^;]{1,80}\.\s*init\s*\(\s*1\s*,'

composite_rules:
  - id: jvm-template-cipher-encrypt-mode
    desc: JVM template selects cipher encryption mode
    any:
      - id: jvm-template-cipher-encrypt-init
      - id: jvm-template-cipher-encrypt-numeric-init
