defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.97

traits:
  # MSVC RTTI names the encryption direction. This does not establish which
  # buffers are transformed, or that an included library routine is reached.
  - id: cryptopp-cbc-encryption-rtti
    desc: Crypto++ CBC encryption class reference
    for: [pe, dll]
    if:
      type: text
      substr: CBC_Encryption@CryptoPP@@

  # The same public API in portable C++ source. Cipher and identifier names
  # are deliberately unconstrained; a decryption type is a near miss.
  - id: cryptopp-cbc-encryption-type
    desc: Crypto++ CBC encryption type in source
    for: [cpp]
    if:
      type: text
      regex: '\bCBC_Mode\s*<[^;{}\n]{1,100}>\s*::\s*Encryption\b'
