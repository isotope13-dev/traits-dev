defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: micro-behaviors/crypto/encrypt/reference::cryptojs-aes-encrypt
    desc: CryptoJS AES encrypt API reference
    conf: 0.85
    mbc: C0027
    if:
      type: text
      regex: CryptoJS\.AES\.encrypt|\.AES\.encrypt\s*\(
composite_rules:
  - id: cryptojs-aes-cbc-encrypt
    desc: AES encrypt API and CBC references
    conf: 0.9
    all:
      - id: micro-behaviors/crypto/encrypt/reference::cryptojs-aes-encrypt
      - id: micro-behaviors/crypto/symmetric/config::cryptojs-cbc-mode
    any:
      - id: micro-behaviors/crypto/symmetric/config::cryptojs-pkcs7-padding
      - id: well-known/app/media/tiktok::tiktok-webapp-aes-key
  - id: cryptojs-aes-static-key
    desc: AES encrypt API and key references
    conf: 0.9
    all:
      - id: micro-behaviors/crypto/encrypt/reference::cryptojs-aes-encrypt
      - id: micro-behaviors/crypto/key/representation/material::cryptojs-utf8-secret-key-parse
      - id: micro-behaviors/crypto/key/representation/reference::js-secret-key-assignment-name
      - id: micro-behaviors/crypto/key/representation/material::js-static-key-string-assignment
