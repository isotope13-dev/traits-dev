defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - pe
  - elf
  - macho
  crit: notable
  mbc: C0027

composite_rules:
- id: rust-aes-gcm-rsa-hybrid-stack
  desc: Rust AES-GCM and RSA hybrid encryption stack
  conf: 0.9
  all:
