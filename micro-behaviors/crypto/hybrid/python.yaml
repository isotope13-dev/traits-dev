# The collector has a cryptography backend in addition to its OpenSSL argv
# backend. Require actual encryption contexts and bound RSA-OAEP encryption;
# AES imports or unrelated padding construction alone are insufficient.
# This records API co-occurrence, not a proven session-key wrapping flow.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.97

composite_rules:
  - id: python-aes-encryptor-rsa-oaep-cooccurrence
    desc: AES, Cipher encryptor and RSA-OAEP APIs co-occur
    all:
      - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aes-symbol
      - id: micro-behaviors/crypto/encrypt::python-cipher-encryptor-context
      - id: micro-behaviors/crypto/asymmetric/rsa::rsa-oaep-public-encrypt
