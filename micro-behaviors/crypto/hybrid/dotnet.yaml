defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: dotnet-encryptor-rsa-api-cooccurrence
  desc: .NET encryptor and RSA padding or public-key import APIs co-occur
  crit: notable
  conf: 0.9
  for:
  - pe
  all:
  - id: micro-behaviors/crypto/symmetric/encrypt::dotnet-create-encryptor
  any:
  - id: micro-behaviors/crypto/asymmetric/rsa::dotnet-rsa-padding-raw
  - id: micro-behaviors/crypto/asymmetric/rsa::dotnet-rsa-x509-public-import-raw
