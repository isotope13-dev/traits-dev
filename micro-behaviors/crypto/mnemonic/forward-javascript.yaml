defaults:
  platforms: [unix, windows]
  for: [javascript]
  conf: 0.98

traits:
  - id: stored-wallet-phrase-forwarded
    desc: Wallet phrase stored and forwarded to helper
    crit: notable
    if:
      type: tree-sitter
      query: |
        ((program
          (function_declaration name: (identifier) @sender
            body: (statement_block) @sender_body)
          (function_declaration body: (statement_block
            (if_statement consequence: (statement_block
              (expression_statement
                (sequence_expression
                  (assignment_expression right: (call_expression
                    function: (member_expression property: (property_identifier) @factory)
                    arguments: (arguments (identifier) @phrase)))
                  (call_expression function: (member_expression
                    object: (identifier) @storage property: (property_identifier) @setter)
                    arguments: (arguments (_) (identifier) @stored))
                  (call_expression)*
                  (call_expression function: (identifier) @helper
                    arguments: (arguments (identifier) @forwarded))) @flow))))))
          (#eq? @factory "fromPhrase")
          (#eq? @storage "localStorage")
          (#eq? @setter "setItem")
          (#eq? @phrase @stored)
          (#eq? @phrase @forwarded)
          (#eq? @sender @helper)
          (#match? @sender_body "fetch\\(")
          (#match? @sender_body "text:\\w+"))

  # Byte-level twin of stored-wallet-phrase-forwarded for minified bundles
  # where the AST query is not reported in the scan (large Vite bundles): the
  # imported phrase is persisted and the same comma sequence hands a value to
  # a bare helper call.
  - id: stored-wallet-phrase-forwarded-text
    desc: Imported wallet phrase stored and forwarded
    crit: notable
    if:
      type: text
      regex: '\.fromPhrase\(\w+\),localStorage\.setItem\([\w.$]+,\w+\)[^;{}]{0,90},\w+\(\w+\)'
