defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1555
  mbc: B0028
  crit: component
  conf: 0.86

traits:
  - id: bip39-wordlist-path
    desc: BIP-39 wordlist file path reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)["''][^"''`\r\n<>]{0,30}bip-?39[^"''`\r\n<>]{0,16}\.txt'

  # The double-harvest lure: the first submission is exfiltrated, then a fake
  # validation error prompts the victim to type the phrase a second time. A
  # short error label on its own is also ordinary wallet validation, so this
  # stays notable until an exfil composite supplies the theft context.
  - id: assembled-seed-phrase-from-words
    desc: "Joins words into a seed-phrase variable"
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '\bseedPhrase\s*=\s*words\.join\s*\(\s*["'']\s["'']\s*\)'
composite_rules:
  - id: bip39-wordlist-http-fetch
    desc: "HTTP fetch near a BIP-39 wordlist reference"
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/crypto/mnemonic::bip39-wordlist-path
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/html::html-fetch-call
    near_lines: 40

  # The Ledger-Google-Ads kit fetches api/bip39-english.txt so victims can
  # autocomplete a valid 12-24 word phrase, assembles the entered words, and
  # POSTs the phrase to an attacker endpoint. Legitimate wallets embed the
  # list and never POST an entered phrase; the fetched-wordlist leg is what
  # separates this kit shape from a generic seed form.
