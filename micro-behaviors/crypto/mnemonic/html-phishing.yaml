defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: component
  conf: 0.86

traits:
  - id: bip39-wordlist-path
    desc: BIP-39 wordlist file path reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)["''][^"''`\r\n<>]{0,30}bip-?39[^"''`\r\n<>]{0,16}\.txt'

  # Joining words alone neither exports them nor establishes deception.
  - id: assembled-seed-phrase-from-words
    desc: "Joins words into a seed-phrase variable"
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\bseedPhrase\s*=\s*words\.join\s*\(\s*["'']\s["'']\s*\)'
composite_rules:
  - id: bip39-wordlist-http-fetch
    desc: "HTTP fetch near a BIP-39 wordlist reference"
    crit: notable
    conf: 0.9
    scope: file
    all:
      - id: micro-behaviors/crypto/mnemonic::bip39-wordlist-path
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/html::html-fetch-call
    near_lines: 40
