defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
- id: bip39-mnemonic-validation
  desc: "Mnemonic validation API reference"
  if:
    type: text
    substr: validateMnemonic
- id: bip39-dot-delimited-wordlist-prefix
  desc: Embedded dot-delimited BIP-39 English wordlist
  conf: 0.99
  if:
    type: literal
    regex: '^abandon\.ability\.able\.about\.above\.absent\.absorb\.abstract\.'
