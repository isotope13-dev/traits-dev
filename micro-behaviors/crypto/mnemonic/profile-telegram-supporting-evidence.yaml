---
defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
traits:
- id: twelve-or-twentyfour-word-phrase
  desc: 12 or 24 word phrase text
  crit: component
  conf: 0.9
  for:
  - macho
  - elf
  - binaries
  if:
    type: text
    regex: "(?i)12\\W{1,4}or\\W{1,4}24\\W{0,3}word"
