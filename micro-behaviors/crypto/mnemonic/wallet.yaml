defaults:
  platforms:
  - unix
  - windows
  for: [scripts, binaries]

traits:
- id: mnemonic-word
  desc: Mnemonic keyword
  crit: component
  conf: 0.5
  for:
  - python
  - javascript
  - typescript
  - csharp
  - java
  - go
  if:
    type: text
    word: mnemonic
  not:
  - substr: "denotes a mnemonic"
  - substr: "mnemonic -> ("
  - substr: "mnemonicPrefix"
  - substr: "mnemonic (underlined)"
  - substr: "the mnemonic"
  - substr: "mnemonics, which"
  - substr: "byte code into mnemonic"
  - substr: "code into mnemonic"
  unless:
  - id: metadata/build/bundler/asset::js-vite-rollup-vendor-chunk
  - id: well-known/lib/development/vscode-webview::acquire-vscode-api
- id: seed-phrase-word
  desc: seedPhrase credential field reference
  crit: notable
  conf: 0.5
  for: [html, javascript, typescript]
  if:
    type: text
    substr: seedPhrase
  unless:
  - id: metadata/file/extension/identity::declaration-file-extension
