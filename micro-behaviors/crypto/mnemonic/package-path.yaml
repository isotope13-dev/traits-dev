defaults:
  platforms: [linux, macos, windows]
  for: [scripts, binaries, typescript, go, rust]
traits:
  - id: bip39-package-path-literal
    desc: Quoted BIP-39 package path
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '["''](@scure/bip39|@trezor/utils/bip39|bip39)(/[^"'']{1,100})?["'']'
