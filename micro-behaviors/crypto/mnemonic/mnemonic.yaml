defaults:
  crit: notable
  platforms: [windows, linux, macos]
  # `html` added when the verbatim copies of these brand atoms in
  # objectives/credential-access/wallet/mnemonic/ were removed: those copies
  # existed only to reach phishing pages, and duplicating the matcher tripped
  # the load-time dedup gate, which hard-fails EVERY scan.
  for: [python, javascript, csharp, go, pe, elf, html]

traits:
  - id: bip39-wordlist-reference
    desc: BIP-39 mnemonic wordlist reference
    conf: 0.85
    if:
      type: text
      regex: '\bbip-?39\b|english\.txt.{0,30}\bmnemonic\b'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: well-known/app/system/fuel-sway::release-path
      - id: micro-behaviors/data/string/redact::sensitive-data-scanner
      - type: basename
        regex: 'FuelLabs-sway|[\\/]forc-binaries[\\/]'
  - id: bip39-english-wordlist-prefix
    desc: Embedded BIP-39 English wordlist prefix
    conf: 0.93
    for: [python, javascript, text]
    if:
      type: text
      # Minified or one-word-per-line; single or double quotes.
      regex: '["'']abandon["''],\s*["'']ability["''],\s*["'']able["''],\s*["'']about["'']'

  # Proximity between neutral wallet vocabulary and a wordlist identifies
  # mnemonic handling, not credential theft. Theft intent requires collection
  # or transfer evidence and belongs in an objective composite.
  - id: wordlist-near-mnemonic
    desc: Wordlist near mnemonic terms
    conf: 0.85
    if:
      type: text
      regex: word_?list.{0,40}(mnemonic|bip-?39)
  - id: wordlist-near-recovery
    desc: Wordlist near recovery phrase
    conf: 0.85
    if:
      type: text
      regex: word_?list.{0,40}recovery[_ -]?phrase
  - id: mnemonic-near-wordlist
    desc: Mnemonic terms near wordlist
    conf: 0.85
    if:
      type: text
      regex: (mnemonic|bip-?39).{0,40}word_?list
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: well-known/app/finance/prysm::prysm-source-tree
  - id: recovery-near-wordlist
    desc: Recovery phrase near wordlist
    conf: 0.85
    if:
      type: text
      regex: recovery[_ -]?phrase.{0,40}word_?list
  - id: mnemonic-word-count-check
    desc: "Mnemonic word-count expression"
    conf: 0.85
    if:
      type: text
      regex: '\bmnemonic\b.{0,20}\b(split|len|count)\b'
    unless:
      - id: well-known/lib/format/json-ts/
  - id: seed-phrase-word-count-check
    desc: "Seed-phrase word-count expression"
    conf: 0.85
    if:
      type: text
      regex: '\bseed\s*(phrase|words?)\b.{0,40}\b(split|len|count)\b'
    unless:
      - id: well-known/lib/format/json-ts/
  - id: secret-words-count-check
    desc: "Secret-word list count expression"
    conf: 0.85
    if:
      type: text
      regex: '\b(secret|seed)_?words\b.{0,40}\b(split|len|count)\b'
  - id: mnemonic-validate-check
    desc: Mnemonic validation check
    conf: 0.85
    if:
      type: text
      regex: 'validate.{0,20}mnemonic|mnemonic.{0,20}valid'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
    not:
      - substr: "mnemonics-invalid"
  - id: recovery-phrase-verify-check
    desc: Recovery phrase verification check
    conf: 0.85
    if:
      type: text
      regex: 'verify.{0,20}recovery.{0,20}(phrase|seed|mnemonic|wallet)'
  - id: mnemonic-variable-assignment
    desc: Assigns mnemonic or seed-phrase variable
    conf: 0.8
    size_max: 262144
    if:
      type: text
      regex: \b(mnemonic|seed_?phrase)\s*=
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: well-known/app/finance/prysm::prysm-source-tree
      # Bazel/Starlark ctx.actions.run mnemonic= is an action short-name, not a
      # wallet phrase (GoCompilePkg, RunNogo, ValidateNogo, …).
      - type: text
        regex: 'mnemonic\s*=\s*"[A-Z][A-Za-z0-9]+"'
      # ISA disassemblers assign opcode names, not wallet seed phrases.
      - type: text
        regex: 'mnemonic\s*=\s*(\{|[A-Z][A-Z0-9_]*\[|"[a-z]{1,8}")'
  - id: recovery-variable-assignment
    desc: Assigns wallet recovery-word variable
    conf: 0.8
    if:
      type: text
      regex: \b(recovery_?phrase|secret_?words|wallet_?words)\s*[=:]
    unless:
      - id: well-known/app/productivity/keepercommander/
composite_rules:
  - id: mnemonic-word-count-validation
    desc: "Mnemonic or seed phrase counting"
    conf: 0.85
    any:
      - id: micro-behaviors/crypto/mnemonic::mnemonic-word-count-check
      - id: micro-behaviors/crypto/mnemonic::seed-phrase-word-count-check
      - id: micro-behaviors/crypto/mnemonic::secret-words-count-check
  - id: mnemonic-validation-check
    desc: Mnemonic phrase validation check
    conf: 0.85
    any:
      - id: micro-behaviors/crypto/mnemonic::mnemonic-validate-check
      - id: micro-behaviors/crypto/mnemonic::recovery-phrase-verify-check

  # A browser extension that carries the BIP-39 wordlist generates and checks
  # its own mnemonics: it is a self-custody wallet, so seed-import screens and
  # reads of its own chain history are expected. A cloned wallet that ships
  # the seed off-device still trips the exfil composites in
  # objectives/exfiltration/stealer/wallet/.
  - id: browser-extension-bip39-wallet
    desc: Browser extension ships its own BIP-39 wallet
    conf: 0.9
    for: [javascript, html, chrome-manifest, crx, xpi, zip]
    scope: archive
    all:
      - id: bip39-english-wordlist-prefix
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-api
