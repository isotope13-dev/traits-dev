defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: generated-wallet-phrase-imported
    desc: Generated phrase enters seed import helper
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((function_declaration body: (statement_block) @body) @flow
          (#match? @body "\\.createRandom\\(\\)")
          (#match? @body "\\.mnemonic\\?\\.phrase")
          (#match? @body "return \\w+\\(\\{type:`seed`,words:\\w+\\}\\)"))
