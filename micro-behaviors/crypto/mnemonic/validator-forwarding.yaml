defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: seed-validator-forwards-input
    desc: Seed validator forwards input to HTTP helper
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((program (function_declaration name: (identifier) @sender body: (statement_block) @sender_body) (function_declaration parameters: (formal_parameters (identifier) @input) body: (statement_block (expression_statement (call_expression function: (identifier) @helper arguments: (arguments (identifier) @forwarded))))) @validator)
         (#eq? @sender @helper)
         (#eq? @input @forwarded)
         (#match? @validator "Invalid seed phrase")
         (#match? @sender_body "fetch\\(")
         (#match? @sender_body "body:JSON\\.stringify")
         (#match? @sender_body "text:[A-Za-z_$]"))
