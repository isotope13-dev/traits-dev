defaults:
  for: [binaries]
  platforms:
    - unix
    - windows
traits:
  - id: libsodium-blake2b
    desc: Libsodium Blake2b hash routine
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: crypto_generichash_blake2b_final
  - id: libsodium-blake2b-source
    desc: Libsodium Blake2b hash call in source
    crit: notable
    conf: 0.98
    for: [c, cpp]
    if:
      type: symbol
      regex: '^crypto_generichash_blake2b(_[a-z]+)?$'
