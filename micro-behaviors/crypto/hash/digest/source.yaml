defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, typescript, ruby, java, csharp, go, rust]
  crit: notable
  conf: 0.88

traits:
  - id: source-sha256-call
    desc: Calls SHA-256 from native source
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: sha256

  - id: source-digest-call
    desc: MD5 or SHA digest API call
    crit: notable
    conf: 0.86
    for: [c, cpp, csharp, javascript, python]
    if:
      type: symbol
      kind: call
      regex: '(?i)^(md5|sha1|sha256)(\.|$)'

  - id: source-fixed-sha256-digest
    desc: 64-character hex digest candidate
    crit: component
    conf: 0.86
    if:
      type: literal
      regex: '^[0-9a-fA-F]{64}$'
    unless:
      - id: metadata/file/profile/identity::static-html-shell
      - type: text
        regex: '(?i)\bnonce\s*=\s*["''][0-9a-f]{64}["'']'

  - id: python-sha256-operation
    desc: Performs Python SHA-256 operation
    for: [python]
    mbc: C0029
    if:
      type: text
      regex: 'hashlib\.sha256'

  - id: time-derived-request-hash
    desc: Hashes time-derived request input
    crit: notable
    conf: 0.86
    for: [python, javascript, typescript, php, ruby, html]
    if:
      type: text
      regex: '(?i)\b(hash|sha256)\s*\([^\n)]{0,240}\b(time|date\.now|unix)\b[^\n)]{0,80}\)'

  - id: hash-update-time-token
    desc: Hash update call includes a time token
    crit: notable
    conf: 0.84
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\.update\s*\([^\n)]{0,80}\b(Date\.now|unix)\b'

  - id: javascript-sha256-operation
    desc: Performs JavaScript SHA-256 operation
    for: [javascript, typescript]
    mbc: C0029
    if:
      type: text
      regex: 'createHash\s*\(\s*[''\"]sha-?256[''\"]'

  - id: ruby-sha256-operation
    desc: Performs Ruby SHA-256 operation
    for: [ruby]
    mbc: C0029
    if:
      type: text
      substr: 'Digest::SHA256'

  - id: go-sha256-operation
    desc: Performs Go SHA-256 operation
    for: [go]
    mbc: C0029
    if:
      type: symbol
      kind: call
      regex: '^sha256\.(New|Sum256)$'

  - id: go-sha1-operation
    desc: Performs Go SHA-1 operation
    for: [go]
    mbc: C0029
    if:
      type: symbol
      kind: call
      regex: '^sha1\.(New|Sum)$'

  - id: rust-sha256-operation
    desc: Performs Rust SHA-256 operation
    for: [rust]
    mbc: C0029
    if:
      type: text
      substr: 'Sha256::digest'

  - id: java-sha256-operation
    desc: Performs Java SHA-256 operation
    for: [java]
    mbc: C0029
    if:
      type: text
      regex: 'MessageDigest\.getInstance\s*\(\s*[''\"]SHA-256[''\"]'

  # Clojure reaches the same JDK API through static interop, spelled with a
  # slash, so the Java atom above cannot see it and JVM hashing from a .clj
  # file went unreported entirely — fulcro-spec's `signature.clj` hashes
  # function source with `MessageDigest/getInstance "SHA-256"` and nothing
  # fired. Matched as a call fact, which the Clojure walker records as the
  # bare interop target.
  - id: clojure-message-digest-instance
    desc: Creates a JVM message digest in Clojure
    for: [clojure]
    mbc: C0029
    if:
      type: symbol
      kind: call
      regex: '^(java\.security\.)?MessageDigest/getInstance$'

  - id: csharp-sha256-operation
    desc: Performs C# SHA-256 operation
    for: [csharp]
    mbc: C0029
    if:
      type: text
      regex: '\bSHA256\s*\.?(Create|HashData)\s*\('

  - id: python-fixed-sha256-comparison
    desc: Compares Python SHA-256 result with fixed digest
    for: [python]
    mbc: C0029
    if:
      type: text
      regex: 'hashlib\.sha256[\s\S]{0,260}==\s*[''\"][0-9a-fA-F]{64}[''\"]'

  - id: javascript-fixed-sha256-comparison
    desc: Compares JavaScript SHA-256 with fixed digest
    for: [javascript, typescript]
    mbc: C0029
    if:
      type: text
      regex: 'createHash\s*\(\s*[''\"]sha-?256[''\"]\s*\)[\s\S]{0,260}===\s*[''\"][0-9a-fA-F]{64}[''\"]'

  - id: ruby-fixed-sha256-comparison
    desc: Compares Ruby SHA-256 result with fixed digest
    for: [ruby]
    mbc: C0029
    if:
      type: text
      regex: 'Digest::SHA256[\s\S]{0,260}==\s*[''\"][0-9a-fA-F]{64}[''\"]'

  - id: go-fixed-sha256-comparison
    desc: Compares Go SHA-256 result with fixed digest
    for: [go]
    mbc: C0029
    if:
      type: text
      regex: 'sha256\.Sum256[\s\S]{0,260}==\s*[''\"][0-9a-fA-F]{64}[''\"]'

  - id: rust-fixed-sha256-comparison
    desc: Compares Rust SHA-256 result with fixed digest
    for: [rust]
    mbc: C0029
    if:
      type: text
      regex: 'Sha256::digest[\s\S]{0,260}==\s*[''\"][0-9a-fA-F]{64}[''\"]'

  - id: java-fixed-sha256-comparison
    desc: Compares Java SHA-256 result with fixed digest
    for: [java]
    mbc: C0029
    if:
      type: text
      regex: 'MessageDigest[\s\S]{0,320}equals\s*\(\s*[''\"][0-9a-fA-F]{64}[''\"]'

  - id: csharp-fixed-sha256-comparison
    desc: Compares C# SHA-256 result with fixed digest
    for: [csharp]
    mbc: C0029
    if:
      type: text
      regex: 'SHA256[\s\S]{0,320}==\s*[''\"][0-9a-fA-F]{64}[''\"]'

  # Digest-API call mechanics. Neither leg establishes hashing on its own -- a
  # `.update("...")` or `.digest()` call can belong to a cipher, a stream, or an
  # unrelated builder object -- so both stay `component`. They were previously
  # filed under objectives/anti-static/obfuscation/payload/encrypted/, which
  # named them for the hardcoded-key composite they feed rather than for what
  # their matchers actually find; that composite now references them from here.
  - id: digest-update-string-literal
    desc: Update call fed a string literal
    crit: component
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: "\\.update\\(\\s*['\"][^'\"]{4,64}['\"]\\s*\\)"

  - id: digest-method-call
    desc: Calls a digest() method
    crit: component
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.digest\s*\('

composite_rules:
  - id: node-createhash-time-update
    desc: Node createHash update includes time input
    crit: notable
    conf: 0.86
    for: [javascript, typescript]
    all:
      - id: javascript-sha256-operation
      - id: hash-update-time-token
    near_lines: 12

  - id: source-sha256-operation
    desc: Performs SHA-256 operation
    crit: notable
    conf: 0.88
    any:
      - id: python-sha256-operation
      - id: javascript-sha256-operation
      - id: ruby-sha256-operation
      - id: go-sha256-operation
      - id: rust-sha256-operation
      - id: java-sha256-operation
      - id: csharp-sha256-operation

  - id: source-fixed-sha256-context
    desc: SHA-256 operation near fixed digest
    crit: notable
    conf: 0.9
    all:
      - id: source-fixed-sha256-digest
      - id: source-sha256-operation
    near_bytes: 1024

  - id: source-fixed-sha256-comparison
    desc: Compares a value with fixed SHA-256 digest
    crit: notable
    conf: 0.92
    any:
      - id: python-fixed-sha256-comparison
      - id: javascript-fixed-sha256-comparison
      - id: ruby-fixed-sha256-comparison
      - id: go-fixed-sha256-comparison
      - id: rust-fixed-sha256-comparison
      - id: java-fixed-sha256-comparison
      - id: csharp-fixed-sha256-comparison
      - id: source-fixed-sha256-context
