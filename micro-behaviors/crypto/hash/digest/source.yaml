defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, typescript, ruby, java, csharp, go, rust]
  crit: notable
  conf: 0.88

traits:
  - id: source-sha256-call
    desc: Calls SHA-256 from native source
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: sha256

  - id: source-digest-call
    desc: Calls an MD5 or SHA digest
    crit: notable
    conf: 0.86
    for: [c, cpp, csharp, go, javascript, python]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(sha256|sha1|md5)'

  - id: source-fixed-sha256-digest
    desc: Contains fixed SHA-256 digest literal
    crit: notable
    conf: 0.86
    mbc: C0029
    if:
      type: literal
      regex: '^[0-9a-fA-F]{64}$'

  - id: python-sha256-operation
    desc: Performs Python SHA-256 operation
    for: [python]
    mbc: C0029
    if:
      type: text
      regex: 'hashlib\.sha256'

  - id: time-derived-request-hash
    desc: Hashes time-derived request input
    crit: notable
    conf: 0.86
    for: [python, javascript, typescript, php, ruby]
    if:
      type: text
      regex: '(?i)\b(hash|sha256)\s*\([^\n)]{0,240}\b(time|date\.now|unix)\b[^\n)]{0,80}\)'

  - id: javascript-sha256-operation
    desc: Performs JavaScript SHA-256 operation
    for: [javascript, typescript]
    mbc: C0029
    if:
      type: text
      regex: 'createHash\s*\(\s*[''\"]sha-?256[''\"]'

  - id: ruby-sha256-operation
    desc: Performs Ruby SHA-256 operation
    for: [ruby]
    mbc: C0029
    if:
      type: text
      substr: 'Digest::SHA256'

  - id: go-sha256-operation
    desc: Performs Go SHA-256 operation
    for: [go]
    mbc: C0029
    if:
      type: text
      regex: 'sha256\.Sum256'

  - id: rust-sha256-operation
    desc: Performs Rust SHA-256 operation
    for: [rust]
    mbc: C0029
    if:
      type: text
      substr: 'Sha256::digest'

  - id: java-sha256-operation
    desc: Performs Java SHA-256 operation
    for: [java]
    mbc: C0029
    if:
      type: text
      regex: 'MessageDigest\.getInstance\s*\(\s*[''\"]SHA-256[''\"]'

  - id: csharp-sha256-operation
    desc: Performs C# SHA-256 operation
    for: [csharp]
    mbc: C0029
    if:
      type: text
      regex: '\bSHA256\s*\.?(Create|HashData)\s*\('

  - id: python-fixed-sha256-comparison
    desc: Compares Python SHA-256 result with fixed digest
    for: [python]
    mbc: C0029
    if:
      type: text
      regex: 'hashlib\.sha256[\s\S]{0,260}==\s*[''\"][0-9a-fA-F]{64}[''\"]'

  - id: javascript-fixed-sha256-comparison
    desc: Compares JavaScript SHA-256 with fixed digest
    for: [javascript, typescript]
    mbc: C0029
    if:
      type: text
      regex: 'createHash\s*\(\s*[''\"]sha-?256[''\"]\s*\)[\s\S]{0,260}===\s*[''\"][0-9a-fA-F]{64}[''\"]'

  - id: ruby-fixed-sha256-comparison
    desc: Compares Ruby SHA-256 result with fixed digest
    for: [ruby]
    mbc: C0029
    if:
      type: text
      regex: 'Digest::SHA256[\s\S]{0,260}==\s*[''\"][0-9a-fA-F]{64}[''\"]'

  - id: go-fixed-sha256-comparison
    desc: Compares Go SHA-256 result with fixed digest
    for: [go]
    mbc: C0029
    if:
      type: text
      regex: 'sha256\.Sum256[\s\S]{0,260}==\s*[''\"][0-9a-fA-F]{64}[''\"]'

  - id: rust-fixed-sha256-comparison
    desc: Compares Rust SHA-256 result with fixed digest
    for: [rust]
    mbc: C0029
    if:
      type: text
      regex: 'Sha256::digest[\s\S]{0,260}==\s*[''\"][0-9a-fA-F]{64}[''\"]'

  - id: java-fixed-sha256-comparison
    desc: Compares Java SHA-256 result with fixed digest
    for: [java]
    mbc: C0029
    if:
      type: text
      regex: 'MessageDigest[\s\S]{0,320}equals\s*\(\s*[''\"][0-9a-fA-F]{64}[''\"]'

  - id: csharp-fixed-sha256-comparison
    desc: Compares C# SHA-256 result with fixed digest
    for: [csharp]
    mbc: C0029
    if:
      type: text
      regex: 'SHA256[\s\S]{0,320}==\s*[''\"][0-9a-fA-F]{64}[''\"]'

composite_rules:
  - id: source-sha256-operation
    desc: Performs SHA-256 operation
    crit: notable
    conf: 0.88
    any:
      - id: python-sha256-operation
      - id: javascript-sha256-operation
      - id: ruby-sha256-operation
      - id: go-sha256-operation
      - id: rust-sha256-operation
      - id: java-sha256-operation
      - id: csharp-sha256-operation

  - id: source-fixed-sha256-context
    desc: SHA-256 operation near fixed digest
    crit: notable
    conf: 0.9
    all:
      - id: source-fixed-sha256-digest
      - id: source-sha256-operation
    near_bytes: 1024

  - id: source-fixed-sha256-comparison
    desc: Compares a value with fixed SHA-256 digest
    crit: notable
    conf: 0.92
    any:
      - id: python-fixed-sha256-comparison
      - id: javascript-fixed-sha256-comparison
      - id: ruby-fixed-sha256-comparison
      - id: go-fixed-sha256-comparison
      - id: rust-fixed-sha256-comparison
      - id: java-fixed-sha256-comparison
      - id: csharp-fixed-sha256-comparison
      - id: source-fixed-sha256-context
