defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-archive-sha256-field
    desc: Archive SHA-256 field reference
    conf: 0.88
    if:
      type: text
      regex: '\barchive\.sha256\b'

composite_rules:
  - id: node-sha256-archive-hash-context
    desc: Node SHA-256 digest with archive expected-hash context
    conf: 0.92
    near_bytes: 2048
    all:
      - id: micro-behaviors/crypto/hash/digest::node-createhash-sha256-call
      - id: micro-behaviors/crypto/hash/digest::hash-object-digest-call
      - id: micro-behaviors/crypto/hash/file::actual-hash-variable
      - id: node-archive-sha256-field
