# Node.js hash-digest capabilities. `createHash('sha256')` is a neutral hashing
# call (base58check, content-addressing, integrity checks all use it); it was
# relocated here from objectives/command-and-control/dropper/execution/integrity
# so its identity matches its matcher. Dropper/integrity intent lives in the
# composites that reference it cross-tier.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: node-createhash-aliased-import
    desc: Imports aliased Node createHash API
    conf: 0.94
    if:
      type: text
      regex: 'createHash\s+as\s+\w+[\s\S]{0,80}from["''](node:)?crypto["'']'
  - id: node-createhash-call
    desc: Node.js createHash call
    conf: 0.65
    if:
      type: symbol
      kind: call
      regex: (^|\.)createHash$
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: node-createhash-md4-call
    desc: Node.js createHash('md4') call
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: crypto.createHash
      arg:
        kind: string
        exact: md4
  - id: node-createhash-sha256-call
    desc: Node.js createHash('sha256') call
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(^|\.)createHash$'
      arg:
        kind: string
        exact: sha256
  - id: hash-object-digest-call
    desc: JavaScript hash-object digest call
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '(^|\.)hash\.digest$'
  # Provenance does not cross the local decoder into Buffer.from, and the
  # decoder's name is chosen by the author. The stream handlers are the
  # behavior: file bytes are hashed as they arrive, then the hash is updated
  # again when the stream ends.
  - id: stream-read-into-hash-update
    desc: Read stream chunk is hashed
    conf: 0.9
    if:
      type: text
      regex: 'createReadStream\([\s\S]{0,160}hash\.update'
  - id: hash-update-on-stream-end
    desc: Hash update on stream end
    conf: 0.92
    if:
      type: text
      regex: '\.on\(\s*["'']end["''][\s\S]{0,80}hash\.update'
  - id: ethereumjs-sha3-hex-digest
    desc: Formats EthereumJS SHA3 digest as hexadecimal
    conf: 0.9
    if:
      type: text
      regex: '\bbufferToHex\s*\(\s*utils\.sha3\s*\('
