defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, typescript, ruby, java, csharp, go, rust]
  crit: notable
  conf: 0.88

traits:

  - id: go-sha1-operation
    desc: Performs Go SHA-1 operation
    for: [go]
    mbc: C0029
    if:
      type: symbol
      kind: call
      regex: '^sha1\.(New|Sum)$'
