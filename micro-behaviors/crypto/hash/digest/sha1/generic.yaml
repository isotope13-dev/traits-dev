defaults:
  crit: notable
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
traits:
  - id: sha1
    desc: SHA1 hashing functions
    conf: 0.95
    if:
      type: symbol
      regex: '(?i)(^sha1([_-]?(init|update|final))?$|crypto[./_]sha1\.Sum$)'
    downgrade:
      any:
        - id: metadata/binary/framework::dotnet-metadata
