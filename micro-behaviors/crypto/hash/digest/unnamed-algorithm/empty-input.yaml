# The well-known SHA-256 digest of an empty input. It is neutral by itself;
# objective rules supply protocol and forgery context.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.995

traits:
  - id: sha256-empty-input-digest-literal
    desc: SHA-256 empty-input digest literal
    if:
      type: string_literal
      exact: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
