defaults:
  platforms: [windows, unix]
  crit: notable
  for: [scripts]

traits:
  - id: digest-mismatch-diagnostic
    desc: Reports a hash, checksum or digest mismatch
    conf: 0.9
    for: [shell, javascript, typescript, powershell, batch, python, ruby]
    if:
      type: text
      regex: '(?i)((hash|checksum|digest)\w*|sha-?256)\s+mismatch'
