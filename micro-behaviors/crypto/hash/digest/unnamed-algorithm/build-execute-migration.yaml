defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
composite_rules:
  - id: rust-build-rs-pinned-artifact-verify
    desc: Build script pins and verifies artifact checksum
    crit: notable
    conf: 0.95
    for:
      - rust
    # This composite only means something in a build script: it is the
    # known-good "download + verify pinned digest" context that suppresses
    # the external-artifact-download suspicion. The same checksum vocabulary
    # in runtime source is ordinary integrity checking, not build staging.
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: metadata/lang/source/shape::rust-checksum-source-reference
    any:
      - id: metadata/lang/source/shape::rust-hash-comparison-text
      - id: metadata/lang/source/naming/function/cryptography::rust-checksum-function-declaration
      - id: "metadata/lang/source/syntax/call/invocation::rust-checksum-verifier-name-with-parens"
      - id: micro-behaviors/crypto/hash/digest/sha2::rust-sha256-hex-output
