# This binds the digest update to a getter call; it neither proves that the
# helper returns a real MAC nor implies telemetry or exfiltration.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: node-hash-mac-helper-result
  desc: Hashes output of MAC-named helper
  crit: notable
  conf: 0.94
  if:
    type: symbol
    kind: call
    regex: '(^|\.)update$'
    receiver:
      from:
        call: '(^|\.)createHash$'
    arg:
      index: 0
      from:
        call: '(^|\.)(getMac|getMacAddress)$'
