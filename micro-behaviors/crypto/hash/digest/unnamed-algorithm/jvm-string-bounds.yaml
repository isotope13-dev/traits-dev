defaults:
  for: [class, java_class]
  platforms: [windows, unix]
traits:
  - id: jvm-digest-chain-and-short-string-bounds
    desc: JVM digest chain and bounded string lengths
    crit: notable
    conf: 0.93
    if:
      type: yara
      source: |
        rule jvm_digest_chain_short_string_bounds {
          strings:
            $digest = "java/security/MessageDigest"
            $length = "length"
            $upper = { 10 23 A2 ?? ?? }
            $lower = { 10 19 A4 ?? ?? }
            $chained = { B6 ?? ?? (4B|4C|4D|4E) B2 ?? ?? (2A|2B|2C|2D) B6 ?? ?? }
          condition:
            $digest and $length and $upper and $lower and $chained
        }
