defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, typescript, ruby, java, csharp, go, rust]
  crit: notable
  conf: 0.88

traits:
  - id: payload-builder-data-hash-call
    desc: Calls PayloadBuilder content hashing API
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: PayloadBuilder.dataHash

  - id: source-digest-call
    desc: MD5 or SHA digest API call
    crit: notable
    conf: 0.86
    for: [c, cpp, csharp, javascript, python]
    if:
      type: symbol
      kind: call
      regex: '(?i)^(hashlib\.)?(md5|sha1|sha256)(\.|$)'

  - id: time-token-hash
    desc: Hash call expression includes time token
    crit: notable
    conf: 0.86
    for: [python, javascript, typescript, php, ruby, html]
    if:
      type: text
      regex: '(?i)\b(hash|sha256)\s*\([^\n)]{0,240}\b(time|date\.now|unix)\b[^\n)]{0,80}\)'

  - id: hash-update-time-token
    desc: Hash update call includes a time token
    crit: notable
    conf: 0.84
    for: [javascript, typescript]
    if:
      type: text
      # No comma before the token: a digest's data is the first argument, while
      # `globalState.update(key, Date.now())` is a VS Code Memento write.
      regex: '(?i)\.update\s*\([^,\n)]{0,80}\b(Date\.now|unix)\b'
  - id: clojure-message-digest-instance
    desc: Creates a JVM message digest in Clojure
    for: [clojure]
    mbc: C0029
    if:
      type: symbol
      kind: call
      regex: '^(java\.security\.)?MessageDigest/getInstance$'
composite_rules:
  - id: node-createhash-time-update
    desc: Node createHash update includes time input
    crit: notable
    conf: 0.86
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/crypto/hash/digest/sha2::node-createhash-sha256-call
      - id: hash-update-time-token
    near_lines: 12
    # A minified bundle is one line; bound the pair by bytes as well.
    near_bytes: 1024
