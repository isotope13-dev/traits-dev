# WebCrypto digest operation, independent of its provider.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: baseline
  conf: 0.6
traits:
  # The provider may be stored in a local alias (for example `subtle`). Bind
  # the algorithm to the digest call, rather than matching a SHA-1 mention.

  - id: subtle-digest
    desc: WebCrypto subtle digest
    crit: notable
    conf: 0.65
    if:
      type: symbol
      regex: (^|\.)subtle\.digest$
    unless:
      - id: metadata/package/testing/harness/runtime/
