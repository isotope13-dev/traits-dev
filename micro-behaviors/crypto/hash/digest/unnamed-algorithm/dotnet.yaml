defaults:
  crit: notable
  conf: 0.85
  platforms: [windows]
  for: [pe, csharp, asp]

traits:
  - id: dotnet-compute-hash
    desc: .NET ComputeHash method reference
    if:
      type: text
      exact: ComputeHash

  - id: managed-compute-hash-call
    desc: Calls managed hash computation
    for: [pe]
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: System.Security.Cryptography.HashAlgorithm.ComputeHash
