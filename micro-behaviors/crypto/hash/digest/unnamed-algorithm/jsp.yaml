defaults:
  platforms: [unix, windows, android]
  for: [jsp, java]
  crit: notable
traits:
  - id: java-md5-or-sha1-digest-initialize
    desc: Java initializes an MD5 or SHA-1 digest
    conf: 0.98
    if:
      type: text
      regex: 'MessageDigest\.getInstance\s*\(\s*"(MD5|SHA-?1)"\s*\)'
      exclude_html_comments: true
