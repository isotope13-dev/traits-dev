defaults:
  platforms: [windows, unix]
  for: [powershell]
  crit: notable
  conf: 0.86
traits:
  - id: dotnet-computehash
    desc: PowerShell .NET ComputeHash call
    if:
      type: text
      regex: '\.ComputeHash\s*\('
  - id: powershell-get-filehash
    desc: PowerShell computes a file digest
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: Get-FileHash
