defaults:
  platforms: [unix]
  for: [shell]
  crit: component
traits:
  - id: md5sum-awk-pipeline
    desc: MD5 checksum output piped to awk
    conf: 0.8
    if:
      type: text
      regex: md5sum\s+\S+\s*\|\s*awk
  - id: md5-sum-variable-comparison
    desc: MD5 and sum variable comparison text
    conf: 0.85
    if:
      type: text
      regex: \$MD5[^=]{0,20}=[^$]{0,20}\$sum|\$sum[^=]{0,20}=[^$]{0,20}\$MD5
