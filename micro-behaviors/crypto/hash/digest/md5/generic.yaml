defaults:
  crit: notable
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
traits:
  - id: md5
    desc: MD5 hashing functions
    conf: 0.95
    if:
      type: symbol
      regex: (?i)md5
  - id: python-md5-digest
    desc: Computes an MD5 digest in Python
    conf: 0.9
    for: [python]
    platforms: [windows, unix]
    if:
      type: symbol
      exact: hashlib.md5
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: source-md5-digest-api
    desc: Calls MD5 digest API
    conf: 0.9
    for: [javascript, typescript, ruby, perl, java]
    platforms: [windows, unix]
    if:
      type: text
      regex: 'Digest::MD5|\bmd5_hex\s*\(|createHash\s*\(\s*["'']md5["'']|getInstance\s*\(\s*["'']MD5["'']'
