defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  mbc: C0029

traits:
  - id: node-createhash-md5-call
    desc: Node.js createHash('md5') call
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(^|\.)createHash$'
      arg:
        kind: string
        regex: '(?i)^md5$'
