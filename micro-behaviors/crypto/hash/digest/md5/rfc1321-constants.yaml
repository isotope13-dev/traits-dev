# Inline RFC 1321 MD5 state and round-constant tables in source and native
# binaries, catching self-contained MD5 compression routines whose helper
# names are custom or stripped.
defaults:
  platforms: [unix, windows]
  crit: notable
  mbc: C0029

traits:
  - id: md5-sine-table-le-bytes
    desc: Embeds RFC 1321 MD5 sine constants
    conf: 0.98
    for: [elf, macho, pe]
    if:
      type: hex
      section: rdata
      # Little-endian MD5_K[0..3]: 0xd76aa478, 0xe8c7b756, 0x242070db, 0xc1bdceee
      pattern: "78 a4 6a d7 56 b7 c7 e8 db 70 20 24 ee ce bd c1"

  - id: md5-iv-constants-source
    desc: Initializes RFC 1321 MD5 state words
    conf: 0.97
    for: [scripts, source]
    if:
      type: text
      exclude_comments: true
      regex: '(?is)0x67452301\w?.{0,160}0xefcdab89\w?.{0,160}0x98badcfe'

  - id: md5-sine-table-source
    desc: Defines RFC 1321 MD5 sine table
    conf: 0.98
    for: [scripts, source]
    if:
      type: text
      exclude_comments: true
      regex: '(?is)0xd76aa478\w?.{0,80}0xe8c7b756\w?.{0,80}0x242070db'

composite_rules:
  - id: custom-md5-implementation
    desc: Inline RFC 1321 MD5 constants
    conf: 0.98
    for: [scripts, source, elf, macho, pe]
    any:
      - id: md5-sine-table-le-bytes
      - id: md5-iv-constants-source
      - id: md5-sine-table-source
