defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: shell-md5sum-command
    desc: Shell computes an MD5 digest with md5sum
    conf: 0.97
    if:
      type: text
      regex: '(?m)(^|[|;&`]\s*)md5sum\b'
  - id: openssl-dgst-md5-command
    desc: OpenSSL dgst computes an MD5 digest
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bopenssl\s+dgst\s+-md5\b'
