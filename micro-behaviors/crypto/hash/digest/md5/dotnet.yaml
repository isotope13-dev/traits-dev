defaults:
  crit: notable
  conf: 0.85
  platforms: [windows]
  for: [pe, csharp, asp]

traits:
  # Exact code-section names include CLR types and native implementation
  # modules (Inno Shared.SHA256). This does not establish a CLR runtime.
  # Certificate labels and source operations have separate observations.
  # Roslyn also places an IMAGE_DEBUG_TYPE_PDB_CHECKSUM record in .text.
  # Exclude only that record's algorithm label, not other SHA256 names in
  # the same assembly (which may genuinely implement or call hashing).

  - id: dotnet-md5-cryptoprovider-reference
    desc: .NET MD5 provider API reference
    crit: notable
    conf: 0.88
    for: [pe, dll, csharp]
    if:
      type: text
      substr: MD5CryptoServiceProvider
