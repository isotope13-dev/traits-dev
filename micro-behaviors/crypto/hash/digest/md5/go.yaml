defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go]

traits:

  - id: go-md5-helper-call
    desc: Calls a Go MD5 helper
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[Mm][Dd]5$'

  # A comparison against a 64-hex literal, with no requirement that the
  # hash call sit next to it. Targeted-activation loaders wrap sha256.Sum256
  # in a helper defined elsewhere in the file and compare its hex result
  # hundreds of lines away (`if h == "b996…"` / `if h != "ad57…"`), which
  # go-fixed-sha256-comparison's inline window cannot reach.
