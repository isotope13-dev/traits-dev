defaults:
  platforms: [windows, unix]
traits:
  - id: md5-php
    desc: MD5 hash computation
    crit: notable
    conf: 0.7
    mbc: C0029
    for:
      - php
    if:
      type: symbol
      exact: md5
  - id: sha1-php
    desc: SHA1 hash computation
    crit: notable
    conf: 0.7
    mbc: C0029
    for:
      - php
    if:
      type: symbol
      exact: sha1
  - id: sha256-php
    desc: SHA256 hash computation
    crit: notable
    conf: 0.7
    mbc: C0029
    for:
      - php
    if:
      type: string_literal
      regex: hash\s*\(['"]sha256['"]

  - id: php-sha256-comparison
    desc: Compares a PHP SHA-256 result
    crit: notable
    conf: 0.92
    mbc: C0029
    for:
      - php
    if:
      type: text
      regex: 'hash\s*\(\s*[''\"]sha256[''\"]\s*,[\s\S]{0,220}\)\s*={2,3}'

  - id: php-sha256-hash-equals
    desc: Uses hash_equals with a SHA-256 result
    crit: notable
    conf: 0.92
    mbc: C0029
    for:
      - php
    if:
      type: text
      regex: 'hash_equals\s*\(\s*\$[A-Za-z_]\w*\s*,[\s\S]{0,80}hash\s*\(\s*[''\"]sha256[''\"]'

  - id: php-fixed-digest-hash-equals-first
    desc: Uses hash_equals with a fixed digest
    crit: notable
    conf: 0.9
    mbc: C0029
    for:
      - php
    if:
      type: text
      regex: 'hash_equals\s*\(\s*[''\"][0-9a-fA-F]{64}[''\"]\s*,'

  - id: php-fixed-digest-hash-equals-second
    desc: Uses hash_equals with digest as second argument
    crit: notable
    conf: 0.9
    mbc: C0029
    for:
      - php
    if:
      type: text
      regex: 'hash_equals\s*\(\s*\$[A-Za-z_]\w*\s*,\s*[''\"][0-9a-fA-F]{64}[''\"]'

  - id: php-variable-hash-equals
    desc: Compares two PHP values with hash_equals
    crit: notable
    conf: 0.84
    mbc: C0029
    for:
      - php
    if:
      type: text
      regex: 'hash_equals\s*\(\s*\$[A-Za-z_]\w*\s*,[\s\S]{0,120}\$[A-Za-z_]\w*\s*\)'

  - id: php-fixed-sha256-digest
    desc: 64-character hexadecimal digest literal
    crit: notable
    conf: 0.9
    mbc: C0029
    for:
      - php
    if:
      type: string_literal
      regex: '^[0-9a-fA-F]{64}$'
  - id: hash-generic
    desc: References the PHP hash() function
    crit: notable
    conf: 0.65
    mbc: C0029
    for:
      - php
    if:
      type: symbol
      exact: hash
  - id: password-hash
    desc: Password hashing (bcrypt/argon2)
    crit: notable
    conf: 0.6
    for:
      - php
    if:
      type: text
      word: password_hash
  - id: password-verify
    desc: Password verification
    crit: notable
    conf: 0.7
    for:
      - php
    if:
      type: symbol
      kind: call
      exact: password_verify
  - id: md5-openssl-include
    desc: OpenSSL MD5 header include
    crit: notable
    conf: 0.8
    mbc: C0029
    for:
      - c
    if:
      type: text
      regex: '#include\s*<openssl/md5'
  - id: md5-init-update-final-c
    desc: OpenSSL MD5 init/update/final sequence in C
    crit: notable
    conf: 0.8
    mbc: C0029
    for:
      - c
    if:
      type: text
      regex: MD5_(Init|Update|Final)
composite_rules:
  - id: php-hardcoded-sha256-comparison
    desc: PHP compares input with a hardcoded SHA-256 digest
    crit: notable
    conf: 0.96
    mbc: C0029
    for:
      - php
    all:
      - id: php-fixed-sha256-digest
    any:
      - id: php-sha256-comparison
      - id: php-sha256-hash-equals
      - id: php-fixed-digest-hash-equals
      - id: php-variable-hash-equals
    near_bytes: 1024

  - id: php-fixed-digest-hash-equals
    desc: Uses hash_equals with a fixed digest
    crit: notable
    conf: 0.92
    mbc: C0029
    for:
      - php
    any:
      - id: php-fixed-digest-hash-equals-first
      - id: php-fixed-digest-hash-equals-second

  - id: md5-password-hash-c
    desc: OpenSSL MD5 API usage in C source
    crit: notable
    conf: 0.85
    mbc: C0029
    for:
      - c
    all:
      - id: md5-openssl-include
      - id: md5-init-update-final-c
