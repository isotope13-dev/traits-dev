defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

traits:
- id: sha3-keccak-hash
  desc: SHA3 or keccak hash call
  conf: 0.85
  if:
    type: text
    regex: \b(sha3|keccak|Web3\.keccak)\s*\(
- id: crypto-keccak-word
  desc: Keccak implementation marker
  crit: notable
  conf: 0.9
  if:
    type: text
    word: Keccak
composite_rules:
- id: crypto-keccak-permutation-context
  desc: Keccak permutation implementation
  crit: baseline
  conf: 0.9
  all:
  - id: micro-behaviors/crypto/hash/digest::crypto-keccak-word
  - id: micro-behaviors/crypto/library/blockchain/client::crypto-permutation-word
