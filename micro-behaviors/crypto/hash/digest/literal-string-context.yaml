# Key/encoded-data declarations are neutral crypto configuration evidence.
# They do not identify executable content or establish concealment intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python]
composite_rules:
  - id: js-sha256-literal-passphrase-digest
    desc: SHA-256 hashes a string literal
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    near_lines: 6
    all:
      - id: micro-behaviors/crypto/hash/digest::javascript-sha256-operation
      - id: micro-behaviors/crypto/hash/digest::digest-update-string-literal
      - id: micro-behaviors/crypto/hash/digest::digest-method-call
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/build/bundler/asset::js-large-module-bundle
