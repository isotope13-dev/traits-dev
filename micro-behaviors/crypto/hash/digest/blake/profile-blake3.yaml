defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
- id: blake3-symbol
  for: [python]
  desc: blake3 symbol reference
  crit: notable
  conf: 0.88
  if:
    type: symbol
    exact: blake3
- id: blake3-keyword
  desc: BLAKE3 hash keyword
  crit: notable
  conf: 0.4
  if:
    type: text
    word: blake3
  unless:
  # The symbol and the text can describe the same reference; avoid double counting.
  - id: blake3-symbol
