# BLAKE-256 and BLAKE2s share the 32-bit G-function's RIGHT rotations.
# Rotation by 16 is equivalent in either direction; 12, 8 and 7 are not.
# This identifies the round schedule, not a particular BLAKE digest variant.
defaults:
  platforms: [unix, windows]
  for: [pe, dll, elf, macho]
  arch: [x86-64]
traits:
  - id: blake32-round-rotations-x64
    desc: BLAKE 32-bit G-function rotation schedule
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .text
      pattern: "c1 c? 10 [0-12] c1 (c8|c9|ca|cb|cc|cd|ce|cf) 0c [0-20] c1 (c8|c9|ca|cb|cc|cd|ce|cf) 08 [0-12] c1 (c8|c9|ca|cb|cc|cd|ce|cf) 07"
