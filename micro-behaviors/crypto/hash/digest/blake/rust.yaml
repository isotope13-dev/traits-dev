defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.99
  mbc: C0029
traits:
  - id: rust-blake3-hash
    desc: Computes a BLAKE3 digest
    if:
      type: symbol
      kind: call
      exact: blake3::hash
  - id: rust-blake3-hasher-construction
    desc: Initializes an incremental BLAKE3 hasher
    if:
      type: symbol
      kind: call
      exact: blake3::Hasher::new
