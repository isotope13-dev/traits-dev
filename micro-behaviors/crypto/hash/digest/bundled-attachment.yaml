# Hashing bundled encrypted data proves neither staging nor activation.
defaults:
  platforms:
  - unix
  - windows
composite_rules:
- id: bundled-bin-attachment-hash
  desc: Hashes bundled bin plus decoded bytes
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  size_max: 16384
  near_bytes: 8192
  all:
  - id: micro-behaviors/fs/path/self::script-relative-bin-join
  - id: micro-behaviors/crypto/hash/digest::stream-read-into-hash-update
  - id: micro-behaviors/crypto/hash/digest::hash-update-on-stream-end
  - id: micro-behaviors/crypto/hash/digest::node-createhash-call
  - id: micro-behaviors/crypto/hash/digest::hash-object-digest-call
  - id: micro-behaviors/data/decode/base64::base64-decode-call-text
- id: enc-container-attachment-hash
  desc: Hashes custom ENC blob with attachment
  crit: notable
  conf: 0.96
  for:
  - npm
  - tar
  - javascript
  - typescript
  - data
  scope: archive
  all:
  - id: bundled-bin-attachment-hash
  - id: metadata/file/magic/identity::high-entropy-enc-container
- id: yuienc-dollar-r-attachment-hash
  desc: Hashes a bundled YUIENC01$R blob and attachment bytes
  crit: notable
  conf: 0.97
  for:
  - npm
  - tar
  - javascript
  - typescript
  - data
  - package.json
  scope: archive
  all:
  - id: bundled-bin-attachment-hash
  - id: metadata/file/magic/identity::yuienc01-dollar-r-header
  - id: metadata/file/entropy::very-high-entropy-data-file
  - id: metadata/package/runtime::windows-only-platform-restriction
