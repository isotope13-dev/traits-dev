defaults:
  platforms: [windows, unix]
  for: [rust]
  crit: notable
  conf: 0.94
traits:
  - id: rust-sha256-constructor
    desc: Constructs a Rust SHA-256 digest state
    if:
      type: symbol
      kind: call
      regex: '^sha2::Sha256::(new|default)$'
  - id: rust-md5-constructor
    desc: Constructs a Rust MD5 digest state
    if:
      type: symbol
      kind: call
      regex: '^md5::Md5::(new|default)$'
