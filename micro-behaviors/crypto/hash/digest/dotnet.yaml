defaults:
  crit: notable
  conf: 0.85
  platforms: [windows]
  for: [pe, csharp, asp]

traits:
  # CLR TypeRef names and namespaces occupy separate string-heap entries.
  # Include the unqualified SHA256 type as well as named provider classes.
  # A name reference does not establish a call or a malicious use of hashing.
  - id: dotnet-sha256-reference
    desc: .NET SHA256 type or provider name reference
    if:
      type: text
      regex: '(?i)\bSHA256(Managed|Cng|CryptoServiceProvider)?\b'

  - id: dotnet-md5-cryptoprovider-reference
    desc: .NET MD5 provider API reference
    crit: notable
    conf: 0.88
    for: [pe, dll, csharp]
    if:
      type: text
      substr: MD5CryptoServiceProvider

  - id: dotnet-compute-hash
    desc: .NET ComputeHash method reference
    if:
      type: text
      exact: ComputeHash
