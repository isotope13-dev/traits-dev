defaults:
  crit: notable
  conf: 0.85
  platforms: [windows]
  for: [pe, csharp, asp]

traits:
  # CLR names occupy separate string-heap entries. Certificate algorithm
  # labels are not API references; source hashing has its own operation rules.
  - id: dotnet-sha256-reference
    desc: .NET SHA256 type or provider name reference
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)^SHA256(Managed|Cng|CryptoServiceProvider)?$'
      section: .text

  - id: dotnet-md5-cryptoprovider-reference
    desc: .NET MD5 provider API reference
    crit: notable
    conf: 0.88
    for: [pe, dll, csharp]
    if:
      type: text
      substr: MD5CryptoServiceProvider

  - id: dotnet-compute-hash
    desc: .NET ComputeHash method reference
    if:
      type: text
      exact: ComputeHash
