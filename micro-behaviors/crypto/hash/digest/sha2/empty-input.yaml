# The well-known SHA-256 digest of an empty input. It is neutral by itself;
# objective rules supply protocol and forgery context.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.995

traits:
  - id: sha256-empty-input-digest-literal
    desc: SHA-256 empty-input digest literal
    if:
      type: string_literal
      exact: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

  - id: python-sha256-empty-input
    desc: Computes SHA-256 of empty input
    for: [python]
    if:
      type: symbol
      kind: call
      exact: hashlib.sha256
      arg: {index: 0, kind: string, exact: ''}

composite_rules:
  - id: sha256-empty-input-evidence
    desc: Contains or computes the empty-input SHA-256 digest
    any:
      - id: sha256-empty-input-digest-literal
      - id: python-sha256-empty-input
