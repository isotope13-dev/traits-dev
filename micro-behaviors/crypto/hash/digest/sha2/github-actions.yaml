# github-script bodies remain structured YAML values rather than JS call
# facts. Require an assignment to the SHA-256 constructor in the script body.
defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable
  conf: 0.94

traits:
  - id: gha-composite-script-sha256
    desc: Action script initializes SHA-256 hashing
    if:
      type: value
      path: runs.steps[*].with.script
      regex: '(?m)^\s*(const|let|var) \w+\s*=\s*crypto\.createHash\(["'']sha256["'']\)'

  - id: gha-workflow-script-sha256
    desc: Workflow script initializes SHA-256 hashing
    if:
      type: value
      path: jobs.*.steps[*].with.script
      regex: '(?m)^\s*(const|let|var) \w+\s*=\s*crypto\.createHash\(["'']sha256["'']\)'
