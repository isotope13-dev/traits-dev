defaults:
  platforms: [linux, macos]
  for: [shell]
  crit: notable
  conf: 0.95

traits:
  - id: openssl-dgst-sha256-command
    desc: OpenSSL dgst computes a SHA-256 digest
    if:
      type: text
      regex: '(?i)\bopenssl\s+dgst\s+-sha256\b'
  - id: openssl-dgst-sha512-command
    desc: OpenSSL dgst computes a SHA-512 digest
    if:
      type: text
      regex: '(?i)\bopenssl\s+dgst\s+-sha512\b'
