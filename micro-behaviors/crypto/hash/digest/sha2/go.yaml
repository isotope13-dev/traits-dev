defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go]

traits:
  - id: go-sha256-pclntab
    desc: Go pclntab names SHA-256 digest functions
    conf: 0.98
    for: [elf]
    platforms: [linux]
    if:
      type: text
      section: gopclntab
      regex: 'crypto/sha256\.(New|Sum256)\b'
