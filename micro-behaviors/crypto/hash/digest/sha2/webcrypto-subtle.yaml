# WebCrypto SHA-2 digest operation, independent of its provider.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  # Bind the SHA-2 algorithm string directly to the digest() call argument.
  - id: sha2-digest-call
    desc: Calls digest with a SHA-2 algorithm
    if:
      type: symbol
      kind: call
      regex: '(^|\.)digest$'
      arg:
        index: 0
        kind: string
        regex: '^SHA-(256|384|512)$'
