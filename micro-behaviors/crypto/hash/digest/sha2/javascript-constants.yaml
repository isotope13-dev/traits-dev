defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: javascript-sha256-round-constants
    desc: JavaScript contains SHA-256 round constants
    conf: 0.98
    if:
      type: text
      regex: '(?i)(0x428a2f98|1116352408)\s*,\s*(0x71374491|1899447441)'
