# The first two SHA-512 round constants (K[0], K[1]) as stored little-endian in
# read-only data. An embedded SHA-512 implementation (ed25519 signing) also
# contains 64-bit rotates by 14, 18 and 41, which byte-level API-hash seed
# patterns mistake for a rotate-14 hash.
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: sha512-round-constants
    desc: Embeds SHA-512 round constants
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: rdata
      pattern: 22 AE 28 D7 98 2F 8A 42 CD 65 EF 23 91 44 37 71
