defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-sha256-state-initialization
    desc: Loads SHA-256 state initialization constants
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: >-
        C7 46 ?? 67 E6 09 6A [0-24]
        C7 84 04 ?? ?? 00 00 85 AE 67 BB
        [0-12] 35 62 F3 6E 3C 89 46 ??
