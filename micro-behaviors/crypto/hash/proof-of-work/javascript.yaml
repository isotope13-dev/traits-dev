defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

# Counterpart of ruby.yaml. A nonce hashed until the digest starts with zeros
# is proof of work: the same loop verifies a CAPTCHA or anti-spam challenge,
# a hashcash stamp or a blockchain block as much as it mines. Resource
# hijacking needs the iteration window, SHA-256 loop and miner context that
# objectives/impact/cryptojacking/miner/runtime adds.
traits:
  - id: js-nonce-hash-prefix-check
    desc: JS nonce hash leading-zero prefix check
    conf: 0.94
    attack: T1496
    if:
      type: text
      regex: 'nonce[\s\S]{0,360}hash\.startsWith\(\s*(["''`]0+["''`]|["''`]0["''`]\s*\.repeat\()'
