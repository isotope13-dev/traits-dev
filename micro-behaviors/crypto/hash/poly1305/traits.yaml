# Poly1305 is a Carter-Wegman MAC. The one-shot entry point is the
# capability; AEAD wrappers such as ChaCha20-Poly1305 stay with that cipher.
defaults:
  platforms: [unix, windows]
  for: [c, cpp, elf]
  crit: notable
  conf: 0.94

traits:
  - id: poly1305-auth-function
    desc: Poly1305 one-shot authenticator
    if:
      type: text
      word: poly1305_auth
