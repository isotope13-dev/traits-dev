defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, go]

traits:
  - id: hmac-sha1-operation
    desc: HMAC-SHA1 operation marker
    crit: notable
    conf: 0.93
    if:
      type: text
      # Keep Apple Security/CSSM enum names such as
      # CSSM_PKCS5_PRF_HMAC_SHA1 out; they identify a framework constant, not
      # an HMAC operation in the analyzed program.
      regex: '(?i)(^|[^A-Za-z0-9_])hmac[_-]?sha1([^A-Za-z0-9_]|$)'
