defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, go]

traits:
  - id: hmac-sha1-operation
    desc: HMAC-SHA1 operation marker
    crit: notable
    conf: 0.93
    if:
      type: text
      # Keep Apple Security/CSSM enum names such as
      # CSSM_PKCS5_PRF_HMAC_SHA1 out; they identify a framework constant, not
      # an HMAC operation in the analyzed program.
      regex: '(?i)(^|[^A-Za-z0-9_])hmac[_-]?sha1([^A-Za-z0-9_]|$)'

  # Serializing an HMAC-SHA1 digest to hex is a neutral crypto-formatting
  # capability: HMAC test-vector printers, OTP implementations and signature
  # debug logs all do it. Relocated (2026-08) from
  # objectives/credential-access/capture/network, where the pair was named and
  # described as "the RAKP HMAC" even though neither regex observes IPMI, RMCP+,
  # port 623 or a RAKP message -- so every hex-printed HMAC-SHA1 read as IPMI
  # credential capture. The RAKP intent now comes from the composite in that
  # directory, which references these across directories.
  #
  # `%x` must be a complete printf conversion: without the trailing non-letter
  # guard, `%x` also matched the NASM preprocessor directive `%xdefine`, and a
  # BoringSSL symbol-prefix header (`%xdefine _EVP_aes_128_cbc_hmac_sha1 ...`)
  # scored as an IPMI hash dump.
  - id: hmac-sha1-label-before-hex-format
    desc: HMAC-SHA1 label before a hex format specifier
    crit: notable
    conf: 0.94
    for: [scripts, go, c, cpp, rust]
    if:
      type: text
      regex: '(?i)hmac[_-]?sha1[^\n]{0,60}%[0-9]{0,2}x[^a-z]'

  - id: hex-format-before-hmac-sha1-label
    desc: Hex format specifier before an HMAC-SHA1 label
    crit: notable
    conf: 0.94
    for: [scripts, go, c, cpp, rust]
    if:
      type: text
      regex: '(?i)%[0-9]{0,2}x[^a-z][^\n]{0,60}hmac[_-]?sha1'
