defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  mbc: C0029
traits:
  - id: node-createhmac
    desc: Node.js HMAC construction
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: createHmac
  - id: node-timing-safe-equal
    desc: Constant-time buffer comparison
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: timingSafeEqual

  # Bundled JavaScript can exceed the bounded AST parser's state budget. Keep
  # a precise source-text fallback for the same complete calls.
  - id: node-createhmac-text-call
    desc: Node.js HMAC call in source text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bcreateHmac\s*\)?\s*\('

  - id: node-timing-safe-equal-text-call
    desc: Node.js constant-time comparison call
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\btimingSafeEqual\s*\)?\s*\('

  # Cloud SDKs sign requests through a credential object rather than calling
  # crypto.createHmac directly (@azure/storage-blob signs every SAS token with
  # `sharedKeyCredential.computeHMACSHA256`), so the keyed-digest step is
  # invisible to the createHmac matchers above. Anchored to the end of the
  # symbol so it matches the method however the object is named.
  - id: hmac-sha2-method-call
    desc: Calls an HMAC-SHA2 keyed-digest method
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)hmac[_-]?sha(256|384|512)$'
