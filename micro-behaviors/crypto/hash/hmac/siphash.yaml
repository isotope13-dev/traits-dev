defaults:
  platforms: [macos, linux, windows]
  for: [macho, elf, pe, dll]

traits:
  - id: siphash-arx-round-x64
    desc: SipHash keyed-hash ARX round implementation
    crit: notable
    conf: 0.97
    if:
      type: yara
      # SipRound additions, XORs and lane rotations; no build-specific key material.
      # Whole-container scanning also covers non-preferred Mach-O slices.
      source: |
        rule siphash_x64_arx_round {
          strings:
            $round = { 49 01 DD 48 C1 C3 0D [0-8] 4C 31 EB 49 C1 C5 20 [0-12] 4D 01 E7 49 C1 C4 10 4D 31 FC 4D 01 E5 49 C1 C4 15 49 01 DF 48 C1 C3 11 4C 31 FB 49 C1 C7 20 }
          condition:
            $round
        }
