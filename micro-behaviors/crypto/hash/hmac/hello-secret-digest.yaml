# HMAC-SHA256 of the message "hello" under the key "secret". Unit tests for
# HMAC helpers use this public vector; it does not identify an implementation.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: hmac-sha256-hello-secret-digest
    desc: HMAC-SHA256 hello-secret digest literal
    if:
      type: string_literal
      exact: 88aab3ede8d3adf94d26ab90d3bafd4a2083070c3bcce9c014ee04a443847c0b
