defaults:
  platforms: [windows, unix]
  for: [pe, dll, elf, macho]
  size_max: 25000000
  mbc: C0029
  attack: T1176,T1562.001
traits:
  - id: native-chromium-preference-mac-seed
    desc: Native Chromium preference-MAC seed hex
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: rdata
      pattern: 65 37 34 38 66 33 33 36 64 38 35 65 61 35 66 39 64 63 64 66 32 35 64 38 66 33 34 37 61 36 35 62 34
    unless:
      - id: well-known/lib/ui/cef::cef-browser-engine
      - id: well-known/app/system/microsoft/platform::microsoft-signed-edge-runtime-context

  - id: native-chromium-preference-mac-seed-bytes
    desc: Raw Chromium preference-MAC seed bytes
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: rdata
      pattern: E7 48 F3 36 D8 5E A5 F9 DC DF 25 D8 F3 47 A6 5B 4C DF 66 76 00 F0 2D F6
    unless:
      - id: well-known/lib/ui/cef::cef-browser-engine
      - id: well-known/app/system/microsoft/platform::microsoft-signed-edge-runtime-context
