defaults:
  for: [python, javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.96

traits:
  - id: python-base64-digest-unpadded
    desc: Base64 HMAC digest with padding removed
    for: [python]
    if:
      type: text
      regex: 'base64\.b64encode\(hmac\.new\([^;]{1,240}\.digest\(\)\)\.decode\(\)\.rstrip\(["'']=["'']\)'

  - id: node-base64-digest-unpadded
    desc: Node HMAC digest with Base64 padding removed
    for: [javascript, typescript]
    if:
      type: text
      regex: 'createHmac\([^;]{1,240}\.digest\(["'']base64["'']\)\.replace\(/=\+\$/\s*,\s*["'']["'']\)'
