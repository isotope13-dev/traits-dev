# Chromium's legacy preference-MAC HMAC key.  Researchers recovered this
# static seed from Chromium; tooling that embeds it recalculates
# protection.macs / protection.super_mac offline so Secure Preferences can be
# rewritten without the browser.  The constant alone is suspicious; pairing it
# with Secure Preferences paths is hostile (see objectives).
defaults:
  platforms: [windows, unix]
  for: [c, cpp, csharp, rust, go, python, powershell, javascript]
  conf: 0.95
  mbc: C0029
  attack: T1176,T1562.001

traits:
  - id: chromium-preference-mac-seed-hex-array
    desc: Chromium preference-MAC seed hex array
    crit: suspicious
    conf: 0.98
    for: [c, cpp, csharp, rust, go]
    if:
      type: text
      regex: '(?i)0xe7\s*,\s*0x48\s*,\s*0xf3\s*,\s*0x36\s*,\s*0xd8\s*,\s*0x5e\s*,\s*0xa5\s*,\s*0xf9'

  - id: chromium-preference-mac-seed-byte-string
    desc: Chromium preference-MAC seed byte string
    crit: suspicious
    conf: 0.98
    for: [python]
    if:
      # cleave decodes Python hexadecimal byte escapes before literal matching.
      type: literal
      substr: 'çHó6Ø^¥ù'

  - id: chromium-preference-mac-seed-packed-hex
    desc: Chromium preference-MAC seed packed hex
    crit: suspicious
    conf: 0.98
    if:
      type: literal
      substr: e748f336d85ea5f9

composite_rules:
  - id: chromium-preference-mac-seed
    desc: Uses Chromium legacy preference-MAC seed
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/crypto/hash/hmac::hmac-api-or-named-algorithm
    any:
      - id: chromium-preference-mac-seed-hex-array
      - id: chromium-preference-mac-seed-byte-string
      - id: chromium-preference-mac-seed-packed-hex
    # Helpers often define HMAC logic near the top of a file and embed the
    # static seed later in the profile-rewrite routine.
    near_bytes: 8192
