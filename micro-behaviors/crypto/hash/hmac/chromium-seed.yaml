# Chromium's legacy preference-MAC HMAC key.  Researchers recovered this
# static seed from Chromium; tooling that embeds it recalculates
# protection.macs / protection.super_mac offline so Secure Preferences can be
# rewritten without the browser.  The constant alone is suspicious; pairing it
# with Secure Preferences paths is hostile (see objectives).
defaults:
  platforms: [windows, unix]
  for: [c, cpp, csharp, rust, go, python, powershell]
  conf: 0.95
  mbc: C0029

traits:
  - id: chromium-preference-mac-seed
    desc: Chromium legacy preference-MAC HMAC seed
    crit: suspicious
    conf: 0.98
    attack: T1176,T1562.001
    if:
      type: text
      # Distinctive leading bytes of the public Chromium preference-MAC seed
      # as commonly embedded in C/C++/Rust array initializers.
      regex: '(?i)0xe7\s*,\s*0x48\s*,\s*0xf3\s*,\s*0x36\s*,\s*0xd8\s*,\s*0x5e\s*,\s*0xa5\s*,\s*0xf9'
