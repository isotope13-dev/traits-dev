# Public certificates are verification material, not shared secrets.  Match a
# concrete HMAC-family call with a public-key-named argument; the call matcher
# is portable across languages whose source symbol extractor exposes calls.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, php, go, java, csharp]

traits:
  - id: hmac-keyed-by-public-material
    desc: HMAC call keyed by public-key material
    crit: suspicious
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(hmac\.new|createHmac|hash_hmac|hmac\.New|SecretKeySpec)$'
      arg:
        kind: identifier
        regex: '(?i)(public.?key|pub.?key|certificate|cert.?pem|key.?pem)'
