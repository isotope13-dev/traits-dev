# Public certificates are verification material, not shared secrets.  Match a
# concrete HMAC-family call with a public-key-named argument; the call matcher
# is portable across languages whose source symbol extractor exposes calls.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, php, go, java, csharp]

traits:
  - id: python-hmac-public-material
    desc: Python HMAC call uses public-key material
    crit: suspicious
    conf: 0.98
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: 'hmac\.new\s*\(\s*(public[_-]?key|pub[_-]?key|certificate|cert[_-]?pem|key[_-]?pem)\b'

  - id: javascript-hmac-public-material
    desc: JavaScript HMAC call uses public-key material
    crit: suspicious
    conf: 0.98
    for: [javascript]
    if:
      type: tree-sitter
      kind: call
      regex: 'createHmac\(.{0,40},\s*(public[_-]?key|pub[_-]?key|certificate|cert[_-]?pem|key[_-]?pem)\b'

  - id: php-hmac-public-material
    desc: PHP HMAC call uses public-key material
    crit: suspicious
    conf: 0.98
    for: [php]
    if:
      type: text
      regex: 'hash_hmac.{0,80}public[_-]?key'

  - id: go-hmac-public-material
    desc: Go HMAC call uses public-key material
    crit: suspicious
    conf: 0.98
    for: [go]
    if:
      type: tree-sitter
      kind: call
      regex: 'hmac\.New\s*\(\s*(public[_-]?key|pub[_-]?key|certificate|cert[_-]?pem|key[_-]?pem)\b'

  - id: java-hmac-public-material
    desc: Java HMAC key construction uses public material
    crit: suspicious
    conf: 0.98
    for: [java]
    if:
      type: tree-sitter
      kind: call
      regex: 'SecretKeySpec\s*\(\s*(public[_-]?key|pub[_-]?key|certificate|cert[_-]?pem|key[_-]?pem)\b'

  - id: csharp-hmac-public-material
    desc: C# HMAC construction uses public-key material
    crit: suspicious
    conf: 0.98
    for: [csharp]
    if:
      type: tree-sitter
      kind: call
      regex: 'HMAC\w{0,20}\s*\(\s*(public[_-]?key|pub[_-]?key|certificate|cert[_-]?pem|key[_-]?pem)\b'

composite_rules:
  - id: hmac-keyed-by-public-material
    desc: HMAC call keyed by public-key material
    crit: suspicious
    conf: 0.98
    any:
      - id: python-hmac-public-material
      - id: javascript-hmac-public-material
      - id: php-hmac-public-material
      - id: go-hmac-public-material
      - id: java-hmac-public-material
      - id: csharp-hmac-public-material
