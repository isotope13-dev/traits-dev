defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for:
    - python
    - pyc
traits:
  - id: hmac-new
    desc: Python hmac.new operation
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: hmac.new
  - id: hmac-digest
    desc: Python hmac.digest one-shot operation
    conf: 0.9
    if:
      type: symbol
      exact: hmac.digest
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: hmac-compare-digest
    desc: Uses hmac.compare_digest for secure comparison
    conf: 0.85
    if:
      type: symbol
      exact: hmac.compare_digest
