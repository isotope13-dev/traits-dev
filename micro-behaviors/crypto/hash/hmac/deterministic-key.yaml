# HMAC clients using the 32-byte ASCII-space value produced when an empty
# secret is PKCS7-padded. These match executable call expressions rather than
# prose that merely discusses empty or weak keys.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: suspicious
  conf: 0.99

traits:
  - id: python-hmac-32-space-key
    desc: Python HMAC uses a 32-space key
    for: [python]
    if:
      type: text
      regex: 'hmac\.(new|digest)\s*\(\s*b?["''] ["'']\s*\*\s*32'

  - id: javascript-hmac-32-space-key
    desc: JavaScript HMAC uses a 32-space key
    for: [javascript, typescript]
    if:
      type: text
      regex: 'createHmac\s*\([^,\n]{1,40},\s*["''] ["'']\.repeat\s*\(\s*32\s*\)'

  - id: go-hmac-32-space-key
    desc: Go HMAC uses a 32-space key
    for: [go]
    if:
      type: text
      regex: 'hmac\.New\s*\([^,\n]{1,40},\s*bytes\.Repeat\s*\([^,\n]{1,60},\s*32\s*\)'
