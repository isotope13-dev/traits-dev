# Host-bound HMAC inputs.  The combination of an HMAC operation and a Windows
# user SID is a concrete implementation detail of Chromium preference MAC
# recalculation; the general capability remains neutral and is composed by the
# persistence objective that supplies the Chromium profile context.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, data, pe, dll, elf]
  mbc: C0029

traits:
  - id: hmac-api-reference
    desc: References an HMAC API
    crit: notable
    conf: 0.9
    if:
      type: text
      # API-shaped call forms only — bare "hmac" hits typing stubs like
      # stdlib/hmac.pyi embedded in language-tooling binaries.
      regex: '(?i)(\bHMAC\s*\(|\bcreateHmac\b|\bhmac\.new\b)'
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module

  - id: hmac-named-algorithm-api
    desc: Named HMAC algorithm API symbol
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(HMACSHA256|BCryptHash|CryptHash)\b'

composite_rules:
  - id: hmac-user-sid-seed
    desc: HMAC input includes a Windows user SID
    crit: notable
    conf: 0.94
    all:
      - id: hmac-api-or-named-algorithm
      # The SID reference itself is a neutral Windows identity capability and
      # lives with the other token traits.
      - id: micro-behaviors/os/privilege/token::windows-user-sid-reference
    near_bytes: 1024

  - id: hmac-api-or-named-algorithm
    desc: HMAC API call or named algorithm symbol
    crit: component
    conf: 0.9
    any:
      - id: hmac-api-reference
      - id: hmac-named-algorithm-api
