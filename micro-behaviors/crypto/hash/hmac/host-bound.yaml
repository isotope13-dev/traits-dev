# Host-bound HMAC inputs.  The combination of an HMAC operation and a Windows
# user SID is a concrete implementation detail of Chromium preference MAC
# recalculation; the general capability remains neutral and is composed by the
# persistence objective that supplies the Chromium profile context.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, data, pe, dll, elf]
  mbc: C0029

traits:
  - id: hmac-api-reference
    desc: References an HMAC API
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(HMAC|createHmac|hmac\.new|HMACSHA256|BCryptHash|CryptHash)\b'
  - id: windows-user-sid-lookup
    desc: Looks up the Windows account SID
    crit: notable
    conf: 0.9
    if:
      # Restricted to names that denote the *user's own SID value*.  A bare
      # `SID` collides with session and server ids; `LookupAccountSid` and
      # `ConvertSidToStringSid` are worse still -- Go's x/sys/windows exports
      # both, so every Windows Go binary carries them.
      type: text
      regex: '(?i)TokenUser|UserSid|SecurityIdentifier|S-1-5-21-'

composite_rules:
  - id: hmac-user-sid-seed
    desc: HMAC input includes a Windows user SID
    crit: notable
    conf: 0.94
    all:
      - id: hmac-api-reference
      - id: windows-user-sid-lookup
    near_bytes: 1024
