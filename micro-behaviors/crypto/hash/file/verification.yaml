# Digest comparison operations and their verification-context consumers.
# Integrity declarations can corroborate a comparison; they do not by themselves
# prove a download, control flow, authenticity, or benign intent.
defaults:
  platforms: [windows, unix]
  for: [shell, javascript, typescript, powershell, batch]
  crit: notable

traits:
  - id: serialized-artifact-digest-field
    desc: Serialized MD5 or SHA-256 digest field
    conf: 0.94
    for: [json, javascript, typescript, python, java, kotlin, csharp, go, rust]
    if:
      type: text
      regex: '(?i)["''](md5|sha256|checksum|digest)["'']\s*:\s*["''][0-9a-f]{32}([0-9a-f]{32})?["'']'

  - id: actual-hash-variable
    desc: Stores computed actualHash variable
    conf: 0.84
    for: [javascript, typescript]
    if:
      type: symbol
      exact: actualHash
  - id: downloaded-artifact-sha256-compare
    desc: Compares downloaded artifact SHA-256
    conf: 0.94
    for: [shell]
    if:
      type: text
      regex: 'expected=\$\(awk[\s\S]{0,180}actual=\$\(sha256[\s\S]{0,180}\$expected'
  - id: downloaded-artifact-sha256-helper-compare
    desc: Compares artifact SHA-256 with helper
    conf: 0.93
    for: [shell]
    if:
      type: text
      regex: '(expected|want)=[\s\S]{0,250}(sha256s|checksums)\.txt[\s\S]{0,80}sha256_of'
  - id: shell-sha256-actual-expected-equal
    desc: Shell compares computed SHA-256 to expected
    conf: 0.93
    for: [shell]
    if:
      type: text
      regex: 'ACTUAL_HASH="\$\([^)]{0,48}sha256[\s\S]{0,200}\$ACTUAL_HASH"\s*=\s*"\$EXPECTED_HASH"'
  - id: downloaded-artifact-sha512sum-check
    desc: Verifies download with sha512sum check file
    conf: 0.93
    for: [shell]
    if:
      type: text
      regex: '\|\s*sha512sum\s+-c'
  # Spans lines: the idiomatic PowerShell form computes the hash into a variable
  # (-OutVariable) and compares it in a following `if`, so the old single-line
  # bound missed every real verifier (measured on Mercurial's
  # contrib/install-windows-dependencies.ps1). Both polarities count -- `-eq` to
  # accept and `-ne` to reject are the same check written two ways.
  - id: powershell-file-hash-compare
    desc: PowerShell verifies downloaded file hash
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?i)Get-FileHash[\s\S]{0,240}\.Hash\s+-(eq|ne)\s+\S'
  # The comparison itself, in the form every hashlib-style API produces. Catches
  # verifiers whose pinned constant is named for its role rather than its
  # algorithm (`expected = '81b1...'; if digest.hexdigest() != expected: raise`)
  # -- ArchiveBox's Sonic bootstrap, and the common shape in Python, Ruby and JS.
  - id: computed-digest-compare
    desc: Compares a computed digest against a constant
    conf: 0.92
    for: [shell, javascript, typescript, powershell, batch, python, ruby, text, json, manifests]
    if:
      type: text
      regex: '(?i)hexdigest\(\)\s*[!=]='
  # The Go form of the same check: an expected digest arrives base64-encoded
  # (assertion metadata, a seed manifest) and is byte-compared against a freshly
  # computed one, aborting on mismatch. snapd verifies its preseed artifact this
  # way (`base64.RawURLEncoding.DecodeString` then `bytes.Equal`, "invalid
  # preseed artifact digest") before extracting it with a fixed tar invocation
  # -- the decode feeds the comparison, never the nearby exec.
  - id: go-decoded-digest-bytes-compare
    desc: Go compares a decoded digest with bytes.Equal
    conf: 0.93
    for: [go]
    if:
      type: text
      regex: 'base64\.[\w.]*Decode[\s\S]{0,400}bytes\.Equal\('

  # The strongest form of the signal: the code has a path for a digest that does
  # not match, which only exists when something is actually being verified.
  - id: hash-mismatch-abort
    desc: Reports a downloaded digest mismatch
    conf: 0.9
    for: [shell, javascript, typescript, powershell, batch, python, ruby]
    if:
      type: text
      regex: '(?i)((hash|checksum|digest)\w*|sha-?256)\s+mismatch'


composite_rules:
  - id: pinned-or-manifest-digest-source
    desc: Digest value or checksum-manifest reference
    crit: notable
    conf: 0.9
    for: [shell, javascript, typescript, powershell, batch, python, ruby, text, json, manifests]
    any:
      - id: "metadata/package/integrity::digest-label-with-hexadecimal-value"
      - id: "metadata/package/integrity::checksum-manifest-or-readchecksums-reference"

  # Existing verification-context suppressor. The markers are co-occurring;
  # this matcher does not bind a fetched payload, digest and execution sink.
  # Integrity declarations can appear in benign or hostile programs.
  - id: hash-pinned-download-context
    desc: Digest source with comparison or mismatch markers
    crit: exception
    conf: 0.95
    # Widened past the file-level default: a bootstrap is as often embedded in a
    # manifest as written as a script (ArchiveBox ships its Sonic installer as a
    # heredoc inside a plugin config.json).
    for: [shell, javascript, typescript, powershell, batch, python, ruby, text, json, manifests]
    all:
      - id: pinned-or-manifest-digest-source
    any:
      - id: powershell-file-hash-compare
      - id: downloaded-artifact-sha256-compare
      - id: downloaded-artifact-sha256-helper-compare
      - id: computed-digest-compare
      - id: hash-mismatch-abort

  # SHA-512 sibling of the suppressor above, kept separate so the shared
  # exception's expansion weight (referenced across many download/execute
  # composites) does not grow: Alpine's apk flow pins 128-hex sums and
  # verifies with `| sha512sum -c`, which no member above recognizes.
  - id: sha512-pinned-download-context
    desc: Digest value with sha512sum check invocation
    crit: exception
    conf: 0.95
    for: [shell]
    all:
      - id: "metadata/package/integrity::digest-label-with-hexadecimal-value"
    any:
      - id: downloaded-artifact-sha512sum-check
