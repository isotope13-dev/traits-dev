defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: node-file-content-hash-update
    desc: Node hash receives synchronously read file bytes
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)update$'
      receiver:
        from:
          call: '(^|\.)createHash$'
      arg:
        index: 0
        from:
          call: '(^|\.)readFileSync$'
