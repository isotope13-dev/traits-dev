defaults:
  platforms: [unix]
  for: [ruby]
  crit: notable

# Proof-of-work code is a cryptographic capability. Resource hijacking requires
# execution and unauthorized mining context supplied by objective-level rules.
traits:
  - id: ruby-proof-of-work-label
    desc: Ruby proof-of-work identifier reference
    conf: 0.9
    if:
      type: text
      substr: proof_of_work

  - id: ruby-mining-difficulty-constant
    desc: Ruby mining-difficulty constant reference
    conf: 0.9
    if:
      type: text
      substr: MIN_DIFFICULTY

  - id: ruby-hash-target-prefix
    desc: Ruby hash-target prefix reference
    conf: 0.88
    if:
      type: text
      substr: HASH_TARGET_PREFIX

  - id: ruby-hash-startswith-target
    desc: Ruby hash-prefix target comparison
    conf: 0.9
    if:
      type: text
      regex: 'hash\.start_with\?\(target\)'

composite_rules:
  - id: ruby-proof-of-work-computation
    desc: Ruby proof-of-work hash computation
    conf: 0.94
    all:
      - id: micro-behaviors/crypto/hash/digest::ruby-sha256-hexdigest
      - id: ruby-proof-of-work-label
    any:
      - id: ruby-mining-difficulty-constant
      - id: ruby-hash-target-prefix
      - id: ruby-hash-startswith-target
    needs: 2
