# CoinHive is a browser mining API. A library reference, constructor, site
# key, or start call does not establish an unauthorized use of the visitor's
# CPU. Keep these capabilities separate from concealed/injected miner rules.
defaults:
  platforms: [linux, macos, windows]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: coinhive-miner-variable-assignment
    desc: Assigns CoinHive instance to miner variable
    if:
      type: text
      regex: '\b(var|let|const)\s+miner\s*=\s*new\s+CoinHive\.(Anonymous|User)\s*\('
      exclude_html_comments: true

  - id: coinhive-runtime-api
    desc: Calls CoinHive miner constructor API
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)CoinHive\.(Anonymous|User)$'
    unless:
      - type: basename
        regex: '\.d\.(ts|cts|mts)$'
      - id: metadata/package/testing/harness/runtime::test-basename-suffix
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: well-known/tool/detection/security-scanner/

  - id: coinhive-script-reference
    desc: References CoinHive script filename
    if:
      type: text
      substr: coinhive.min.js
      exclude_html_comments: true

  - id: coinhive-miner-construct
    desc: Constructs a CoinHive miner
    conf: 0.92
    if:
      type: text
      regex: 'new\s+CoinHive\.(Anonymous|User)\s*\('
      exclude_html_comments: true

  - id: coinhive-anonymous-site-key
    desc: CoinHive Anonymous call with literal key
    if:
      type: text
      regex: '\bCoinHive(\.Anonymous|\[[''"]Anonymous[''"]\])\s*\(\s*[''"][A-Za-z0-9]{16,}[''"]'
      exclude_html_comments: true

composite_rules:
  # This is deliberately co-occurrence: the text facts do not prove that
  # the constructor result is the receiver of start(), nor whether the call
  # is gated on consent. One composite covers dot and bracket spellings.
  - id: coinhive-bootstrap-cooccurrence
    desc: CoinHive construction and named start co-occur
    conf: 0.92
    near_bytes: 4096
    all:
      - id: coinhive-script-reference
      - id: micro-behaviors/data/control-flow/dispatch::miner-or-client-start-call
    any:
      - id: coinhive-miner-construct
      - id: coinhive-anonymous-site-key
