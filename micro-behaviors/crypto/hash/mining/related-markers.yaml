defaults:
  platforms: [windows, linux, macos]
  for: [scripts, pe, elf, macho]
  crit: notable
  conf: 0.9

composite_rules:
- id: mining-related-markers
  desc: Multiple cryptocurrency mining markers
  crit: notable
  conf: 0.66
  size_max: 500000
  needs: 2
  any:
  - id: micro-behaviors/communications/url/scheme::stratum-tcp-url
  - id: micro-behaviors/communications/url/scheme::stratum-ssl-url
  - id: micro-behaviors/communications/http/url/domain::pool-named-subdomain
  - id: micro-behaviors/communications/http/url/domain::pool-named-url-host
  - id: micro-behaviors/communications/http/url/domain::pool-host-with-port
  - id: micro-behaviors/crypto/hash/mining::miner-keyword
  - id: micro-behaviors/os/sysinfo/performance::hashrate-reference
  - id: micro-behaviors/crypto/hash/mining::cryptonight-str
  unless:
  - id: well-known/tool/detection/security-scanner
  - id: "metadata/lang/source/syntax::yara-rule-source"
  - id: well-known/app/ai/knowledge/animica/
