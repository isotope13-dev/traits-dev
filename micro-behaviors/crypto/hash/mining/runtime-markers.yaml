# Mining capabilities and settings do not prove unauthorized resource use.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - pe
  - elf
  - macho
composite_rules:
- id: mining-marker
  desc: Mining protocol or proof-of-work markers
  any:
  - id: micro-behaviors/communications/socket/tcp::stratum-keyword
  - id: micro-behaviors/crypto/hash/mining::miner-keyword
  - id: micro-behaviors/communications/socket/tcp::stratum-subscribe-method
  - id: micro-behaviors/crypto/hash/mining::randomx
  - id: micro-behaviors/crypto/hash/mining::cn-variants
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  crit: notable
- id: gpu-hashrate-markers
  desc: GPU and hashrate markers co-occur
  all:
  - id: micro-behaviors/hardware/gpu/
  - id: micro-behaviors/os/sysinfo/performance::hashrate-reference
  crit: notable
- id: mining-memory-worker-markers
  desc: Mining markers near hugepage or worker settings
  near_bytes: 4096
  all:
  - id: mining-marker
  crit: notable
  any:
  - id: micro-behaviors/os/sysinfo/performance::hugepages-reference
  - id: micro-behaviors/process/create/workers::worker-thread-count-setting
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: mining-hardware-markers
  desc: Mining markers with memory, worker or GPU settings
  crit: notable
  conf: 0.8
  any:
  - id: gpu-hashrate-markers
  - id: mining-memory-worker-markers
  unless:
  - id: micro-behaviors/ui/help::escaped-local-command-reference
  - id: micro-behaviors/dylib/library/family/
  - id: micro-behaviors/communications/http/client/wininet::wininet-dll-name-reference
  - id: metadata/package/manager::homebrew-formula-class
  - id: well-known/tool/development/build/homebrew::source-tree
  - id: well-known/tool/offensive/pentestkit::local-storage-panel
