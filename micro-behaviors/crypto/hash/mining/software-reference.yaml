defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - python
  - javascript
  - powershell
  - pe
  - elf
composite_rules:
- id: mining-software-or-stratum-reference
  desc: Mining software or Stratum endpoint reference
  crit: notable
  conf: 0.9
  any:
  - id: well-known/app/finance/xmrig::xmrig-name
  - id: micro-behaviors/communications/socket/tcp::stratum-tcp-url
  - id: micro-behaviors/communications/socket/tcp::stratum-ssl-url
  - id: micro-behaviors/communications/socket/tcp::monero-stratum-endpoint
  - id: micro-behaviors/communications/socket/tcp::known-pool-stratum-endpoint
  - id: micro-behaviors/communications/http/url/domain::known-mining-pool-reference
  unless:
  - id: well-known/app/ai/knowledge/animica::animica-stratum-pool-context
  - id: metadata/file/catalog/identity::bulk-domain-blocklist
  - id: well-known/tool/detection/ascan::ascan-defensive-scanner-context
  - id: well-known/tool/detection/ascan::ascan-package-context
  - id: well-known/tool/detection/ascan::ascan-package-path
  - id: well-known/tool/detection/stng::stng-string-extractor-context
