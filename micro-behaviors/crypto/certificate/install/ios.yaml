defaults:
  platforms: [unix, windows]
  for: [scripts, source, plist, html, xml]

traits:
  - id: apple-root-certificate-profile-payload
    desc: Apple profile installs a root certificate
    crit: notable
    conf: 0.98
    for: [plist]
    if:
      type: value
      path: PayloadContent[*].PayloadType
      exact: com.apple.security.root
