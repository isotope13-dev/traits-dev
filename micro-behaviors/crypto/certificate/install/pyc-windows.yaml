# Bytecode constants arrive as separate text runs, so the command name and its
# flag are separate legs joined by proximity.
defaults:
  platforms: [windows]
  for: [pyc]
  crit: notable
  conf: 0.9

traits:
  - id: pyc-certutil-name-constant
    desc: Bytecode constant names certutil
    crit: component
    if:
      type: text
      substr: certutil

  - id: pyc-addstore-flag-constant
    desc: Bytecode constant holds -addstore flag
    crit: component
    if:
      type: text
      substr: -addstore

composite_rules:
  - id: pyc-certutil-addstore-root
    desc: Bytecode adds a certificate with certutil -addstore
    near_bytes: 128
    all:
      - id: pyc-certutil-name-constant
      - id: pyc-addstore-flag-constant
