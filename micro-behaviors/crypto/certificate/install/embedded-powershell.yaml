defaults:
  platforms: [windows]
  for: [python, javascript, c, cpp, powershell]
  crit: notable
  conf: 0.96
traits:
  - id: embedded-machine-root-certificate-import
    desc: Declares machine root certificate import command
    if:
      type: string_literal
      regex: '(?i)Import-Certificate\b.{0,160}-CertStoreLocation\s+Cert:\\LocalMachine\\Root\b'
  - id: embedded-trusted-publisher-certificate-import
    desc: Declares TrustedPublisher import command
    if:
      type: string_literal
      regex: '(?i)Import-Certificate.{0,160}-CertStoreLocation\s+Cert:\\LocalMachine\\TrustedPublisher'
