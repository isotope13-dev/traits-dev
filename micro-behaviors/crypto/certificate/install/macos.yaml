defaults:
  platforms:
    - macos
  crit: notable
  conf: 0.85
traits:
  - id: security-add-trusted-cert
    desc: security add-trusted-cert command
    for:
      - scripts
    if:
      type: string_literal
      regex: security\s+add-trusted-cert
    unless:
      # Exclude scripts merely printing installation instructions to the terminal
      - type: text
        regex: '(?m)^\s*(echo|printf)\s+["''].*security\s+add-trusted-cert'
      # Same exclusion for Python CLIs that print the commands for the
      # user to run (local-cluster CA setup), never executing them.
      - type: text
        regex: '(?i)(print|msg|logger)\b[\s\S]{0,100}to trust the'
  - id: security-add-certificates
    desc: security add-certificates command
    for:
      - shell
      - python
      - ruby
    if:
      type: string_literal
      regex: security\s+add-certificates
  - id: sec-trust-settings-api
    desc: SecTrustSettingsSetTrustSettings API
    for:
      - macho
      - dylib
      - c
    if:
      type: symbol
      exact: SecTrustSettingsSetTrustSettings
