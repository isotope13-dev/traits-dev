defaults:
  platforms:
    - unix
  crit: notable
  conf: 0.85
  for: [shell, python, javascript, ruby, php]
traits:
  - id: update-ca-certificates
    desc: update-ca-certificates command
    for: [shell, python, javascript, ruby, php, rust, elf]
    if:
      type: text
      # A shell line that mentions the tool after a `#` is a comment explaining
      # why it is not run (an entrypoint choosing SSL_CERT_FILE instead), so the
      # match must start before any comment marker on its line.
      regex: '(?m)^[^#\n]{0,200}update-ca-(certificates|trust)'
  - id: container-ca-store-refresh
    desc: Refreshes CA trust inside container
    crit: notable
    conf: 0.94
    for: [shell]
    if:
      type: text
      regex: '(docker|podman|sdme|\$SDME)\s+exec[^\n]{0,160}update-ca-certificates'
  - id: ca-certificates-path
    desc: System CA certificate store path
    crit: notable
    for: [shell, python, javascript, ruby, php, rust, elf]
    if:
      type: text
      regex: /usr/local/share/ca-certificates/|/etc/pki/ca-trust/source/anchors/
  - id: go-linux-ca-trust-paths
    desc: Go references Linux CA paths
    crit: notable
    conf: 0.92
    for: [go, elf]
    if:
      type: text
      regex: '/usr/local/share/ca-certificates/[\s\S]{0,220}/etc/pki/ca-trust/source/anchors/'
  - id: go-ca-update-commands
    desc: Go references CA trust-store refresh commands
    crit: notable
    conf: 0.9
    for: [go, elf]
    if:
      type: text
      regex: 'update-ca-certificates[\s\S]{0,160}update-ca-trust extract'
  - id: openssl-rehash-command
    desc: Calls c_rehash command
    crit: notable
    if:
      type: symbol
      kind: call
      exact: c_rehash
  - id: openssl-rehash-call
    desc: Calls openssl rehash command
    crit: notable
    if:
      type: symbol
      kind: call
      exact: openssl
      arg:
        kind: string
        substr: rehash

composite_rules:
  - id: openssl-rehash
    desc: OpenSSL certificate rehash
    crit: notable
    any:
      - id: openssl-rehash-command
      - id: openssl-rehash-call
