defaults:
  platforms: [windows]
  for: [c, cpp]
traits:
  - id: native-user-root-certificate-add
    desc: Adds certificate to current-user ROOT store
    crit: suspicious
    conf: 0.98
    attack: T1553.004
    if:
      type: symbol
      kind: call
      exact: CertAddEncodedCertificateToStore
      arg:
        index: 0
        from:
          call: '^CertOpenSystemStore[AW]?$'
          argument: 1
          literal: '^ROOT$'
