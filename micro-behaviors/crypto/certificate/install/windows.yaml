defaults:
  platforms:
    - windows
  crit: notable
  conf: 0.85
traits:
  - id: cert-add-to-store
    desc: Certificate context store add API
    for:
      - pe
      - dll
    if:
      type: symbol
      exact: CertAddCertificateContextToStore
    unless:
      - id: well-known/game/mod/
  - id: cert-add-encoded
    desc: Add encoded certificate to store
    for:
      - pe
      - dll
    if:
      type: symbol
      exact: CertAddEncodedCertificateToStore
  - id: go-cert-add-encoded-proc
    desc: Go resolves encoded cert add
    for:
      - go
    if:
      type: literal
      exact: CertAddEncodedCertificateToStore
  - id: pfx-import
    desc: Import PFX/PKCS12 certificate bundle
    crit: notable
    for:
      - pe
      - dll
    if:
      type: symbol
      exact: PFXImportCertStore
    unless:
      - id: well-known/game/mod/
  - id: certutil-addstore
    desc: certutil -addstore command
    for:
      - batch
      - powershell
      - pe
    if:
      type: text
      regex: (?i)certutil(\.exe)?\s+[^\n]{0,60}-addstore
  - id: certutil-importpfx
    desc: certutil -importPFX command
    for:
      - batch
      - powershell
      - pe
    if:
      type: text
      regex: (?i)certutil(\.exe)?\s+[^\n]{0,60}-importPFX
  - id: powershell-import-certificate
    desc: PowerShell Import-Certificate cmdlet
    for:
      - powershell
    if:
      type: string_literal
      regex: (?i)Import-Certificate|Import-PfxCertificate
  # Opening StoreName.Root at StoreLocation.LocalMachine and adding to it makes
  # the whole machine trust the certificate. The proximity window keeps a
  # read-only Root store lookup (a validity check) from matching.
  - id: dotnet-machine-root-store-add
    desc: Certificate added to machine root store
    crit: suspicious
    conf: 0.94
    for:
      - csharp
    if:
      type: text
      regex: 'X509Store\(StoreName\.Root,\s*StoreLocation\.LocalMachine[\s\S]{0,220}\.Add\('
composite_rules:
  - id: cert-install-api
    desc: Windows certificate installation via API
    conf: 0.9
    any:
      - id: cert-add-to-store
      - id: cert-add-encoded
      - id: go-cert-add-encoded-proc
      - id: pfx-import
  - id: cert-install-cmd
    desc: Windows certificate installation via CLI
    conf: 0.85
    any:
      - id: certutil-addstore
      - id: certutil-importpfx
      - id: powershell-import-certificate
