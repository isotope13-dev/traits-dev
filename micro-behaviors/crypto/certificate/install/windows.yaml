defaults:
  platforms:
    - windows
  crit: notable
  conf: 0.85
traits:
  - id: certutil-addstore
    desc: certutil -addstore command
    for:
      - batch
      - powershell
      - pe
    if:
      type: text
      regex: (?i)certutil(\.exe)?\s+[^\n]{0,60}-addstore
  - id: certutil-importpfx
    desc: certutil -importPFX command
    for:
      - batch
      - powershell
      - pe
    if:
      type: text
      regex: (?i)certutil(\.exe)?\s+[^\n]{0,60}-importPFX
  - id: powershell-import-certificate
    desc: PowerShell Import-Certificate cmdlet
    for:
      - powershell
    if:
      type: string_literal
      regex: (?i)Import-Certificate|Import-PfxCertificate
  # Opening StoreName.Root at StoreLocation.LocalMachine and adding to it makes
  # the whole machine trust the certificate. The proximity window keeps a
  # read-only Root store lookup (a validity check) from matching.
  - id: dotnet-machine-root-store-add
    desc: Certificate added to machine root store
    crit: notable
    conf: 0.94
    for:
      - csharp
    if:
      type: text
      regex: 'X509Store\(StoreName\.Root,\s*StoreLocation\.LocalMachine[\s\S]{0,220}\.Add\('
  # Firefox ships its own CA bundle and ignores the Windows root store unless
  # this policy says otherwise. Setting it is the second half of a Windows TLS
  # intercept: install a root CA into the machine store, then flip this so
  # Firefox honours it too. Managed enterprise deployments do set it, which is
  # why the atom is only notable — the intercept composites supply the intent.
  # Matched on the policy key path and on the bare value name, because native
  # code carries them as two separate strings.
  - id: firefox-enterprise-roots-policy
    desc: Firefox policy trusts OS root store
    conf: 0.92
    for: [binaries, scripts, registry]
    if:
      type: text
      word: ImportEnterpriseRoots

composite_rules:
  - id: cert-install-cmd
    desc: Windows certificate installation via CLI
    conf: 0.85
    any:
      - id: certutil-addstore
      - id: certutil-importpfx
      - id: powershell-import-certificate
