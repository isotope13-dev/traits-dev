defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.98

traits:
  - id: rust-certificate-self-sign-call
    desc: Calls certificate self-signing method
    if:
      type: symbol
      kind: call
      regex: '\.self_signed$'

  - id: rust-certificate-issuer-sign-call
    desc: Calls certificate issuer-signing method
    if:
      type: symbol
      kind: call
      regex: '\.signed_by$'
