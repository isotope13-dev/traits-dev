# Certificate Transparency lookup via crt.sh. Mentioning the service is a
# neutral capability shared by ACME clients (e.g. Apache mod_md) and recon
# tooling; attack-surface composites in objectives/discovery add the JSON
# query / name_value parsing legs.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source]
  crit: notable
  conf: 0.92

traits:
  - id: crt-sh-endpoint
    desc: crt.sh certificate lookup endpoint
    if:
      type: text
      substr: crt.sh
