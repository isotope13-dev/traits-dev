# Evidence-specific placement; matching does not imply attacker intent.
traits:
- platforms:
  - unix
  - windows
  for:
  - go
  crit: notable
  conf: 0.88
  id: go-authentication-extended-key-usages
  desc: Nearby TLS authentication key-usage references
  if:
    type: text
    regex: ExtKeyUsage(ServerAuth|ClientAuth)[\s\S]{0,140}ExtKeyUsage(ServerAuth|ClientAuth)
  unless:
  - id: well-known/app/infrastructure/docker::source-tree
  - id: well-known/app/infrastructure/docker::docker-source-archive-context
defaults: {}
