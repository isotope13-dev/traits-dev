# Go crypto/x509 Certificate and CertificateRequest both expose this field.
# It is certificate extension metadata, not a browser extension target.
defaults:
  platforms: [macos]
  for: [macho]
traits:
  - id: go-extra-extensions-field-reference
    desc: Go X.509 ExtraExtensions field reference
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: ExtraExtensions
