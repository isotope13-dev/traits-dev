# AIA is certificate extension content, independent of the TLS application.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, data]
  crit: notable
  conf: 0.98

traits:
  - id: python-private-key-file-aia
    desc: Private-key file bytes enter AIA extension
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)AuthorityInformationAccess$'
      arg:
        index: 0
        from:
          call: '^open$'
          literal: '[./\\]\.ssh[/\\]id_(rsa|dsa|ecdsa|ed25519)$'
          through:
            - call: '(^|\.)read$'
              receiver: true
            - call: '(^|\.)b64encode$'
              arguments: [0]
            - call: '(^|\.)decode$'
              receiver: true
            - call: '(^|\.)UniformResourceIdentifier$'
              arguments: [0]
            - call: '(^|\.)AccessDescription$'
              arguments: [1]

  - id: python-http-uri-aia
    desc: HTTP URI enters AIA extension
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)AuthorityInformationAccess$'
      arg:
        index: 0
        from:
          value: '^https?://'
          through:
            - call: '(^|\.)UniformResourceIdentifier$'
              arguments: [0]
            - call: '(^|\.)AccessDescription$'
              arguments: [1]

  - id: python-private-key-serialization-aia
    desc: Serialized private-key bytes enter AIA
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)AuthorityInformationAccess$'
      arg:
        index: 0
        from:
          call: '(^|\.)private_bytes$'
          through:
            - call: '(^|\.)b64encode$'
              arguments: [0]
            - call: '(^|\.)decode$'
              receiver: true
            - call: '(^|\.)UniformResourceIdentifier$'
              arguments: [0]
            - call: '(^|\.)AccessDescription$'
              arguments: [1]

  # OpenSSL extension syntax occurs in configuration, shell, and language
  # bindings. Match the encoded PEM header, never a particular destination.
  - id: openssl-pkcs8-private-key-aia-uri
    desc: AIA URL contains Base64 private-key header
    if:
      type: text
      regex: 'caIssuers;URI:https?://[^\s"\x27]{1,255}/LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0t'

  - id: openssl-rsa-private-key-aia-uri
    desc: AIA issuer URL contains Base64 RSA-key header
    if:
      type: text
      regex: 'caIssuers;URI:https?://[^\s"\x27]{1,255}/LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVk'

composite_rules:
  - id: python-private-key-content-aia
    desc: Private-key bytes enter AIA extension
    for: [python]
    any:
      - id: python-private-key-file-aia
      - id: python-private-key-serialization-aia

  - id: private-key-aia-carrier
    desc: Private-key content in AIA retrieval URI
    any:
      - id: private-key-http-aia-carrier
      - id: openssl-pkcs8-private-key-aia-uri
      - id: openssl-rsa-private-key-aia-uri

  - id: private-key-http-aia-carrier
    desc: Private-key content and HTTP URI in AIA
    for: [python]
    # Both provenance observations must describe the same AIA call.
    near_bytes: 1
    all:
      - id: python-private-key-content-aia
      - id: python-http-uri-aia
