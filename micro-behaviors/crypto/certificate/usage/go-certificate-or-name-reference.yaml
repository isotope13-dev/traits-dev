defaults:
  platforms: [unix, windows]
  for: [go]
  conf: 0.86
  crit: notable
traits:
  - id: go-x509-certificate-reference
    desc: Go X.509 certificate type reference
    if:
      type: text
      substr: x509.Certificate
  - id: go-pkix-name-reference
    desc: Go X.509 distinguished name type reference
    if:
      type: text
      substr: pkix.Name
composite_rules:
  - id: go-certificate-or-name-reference
    desc: Go X.509 certificate or distinguished name reference
    any:
      - id: go-x509-certificate-reference
      - id: go-pkix-name-reference
