# ACME (RFC 8555) certificate issuance. A program that speaks ACME asks a CA
# for a publicly trusted certificate and proves control of the name first, so
# these atoms name the program's purpose in one line: cert managers, reverse
# proxies with automatic TLS, and ingress controllers. Neutral capability —
# attacker infrastructure automates TLS the same way, and the abuse reading
# (auto-TLS on C2/phishing hosts) belongs to composites that add the
# destination or payload evidence.
#
# Before this file the only ACME coverage was the acme.sh shell-tool
# fingerprint in well-known/tool/sysadmin, so a Go/Rust cert manager rendered
# as a pile of generic socket and TLS facts with nothing saying what it does.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, source]
  crit: notable
  conf: 0.95

traits:
  # The directory resource is the ACME entry point every client fetches first;
  # anchoring on the `acme` path/host component keeps this off ordinary
  # `/directory` routes.
  - id: acme-directory-endpoint
    desc: References an ACME directory endpoint
    if:
      type: text
      regex: '(?i)acme-v0[12]\.[a-z0-9.-]{1,40}/directory|/acme/(v[12]/)?directory'

  # `_acme-challenge.<domain>` is the TXT record a DNS-01 validation publishes.
  # Its presence means the code drives DNS records to prove domain control.
  - id: acme-dns01-challenge-record
    desc: References the _acme-challenge DNS record
    conf: 0.97
    if:
      type: text
      substr: _acme-challenge
