# A certificate comparison is verification evidence, never a TLS bypass.
defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  crit: notable
traits:
  - id: dotnet-certificate-equality-api
    desc: X509Certificate equality API reference
    conf: 0.98
    if:
      type: symbol
      regex: '(^|\.)X509Certificate2?\.Equals$'
