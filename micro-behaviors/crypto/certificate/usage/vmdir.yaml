defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.99

traits:
  - id: vmdir-trusted-chain-marker
    desc: vmdir trusted certificate-chain record
    if:
      type: literal
      substr: cn=TrustedCertificateChains,

  - id: vmdir-sso-signing-certificate-marker
    desc: vmdir SSO signing certificate marker
    if:
      type: literal
      exact: ssoserverSign
