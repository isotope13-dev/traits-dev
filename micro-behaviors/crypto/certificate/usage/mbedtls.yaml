# Parsing APIs establish neither server role nor embedded key material.
defaults:
  platforms:
  - windows
  - linux
  - macos
traits:
- id: mbedtls-certificate-parse-api
  desc: Mbed TLS certificate parsing API
  crit: notable
  conf: 0.86
  for:
  - c
  - cpp
  - elf
  - macho
  - pe
  - dll
  if:
    type: symbol
    regex: ^mbedtls_x509_crt_parse(_file)?$
