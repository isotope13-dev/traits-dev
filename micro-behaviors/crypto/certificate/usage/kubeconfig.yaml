  - id: metadata/package/testing/presence/harness/
  - id: "metadata/file/naming::test-directory-component"
- id: kubeconfig-ca-certificate-field
  desc: Kubernetes certificate authority field
  crit: notable
  conf: 0.92
  ref: sha256:e4445eaa3155940f60991241a809409aa70b708303a0d07aa35b2e3d2bf76885
  if:
    type: text
    regex: '["'']certificate-authority-data["'']\s*:'
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: "metadata/file/naming::test-directory-component"
