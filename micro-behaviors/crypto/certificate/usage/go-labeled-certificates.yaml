composite_rules:
- id: go-infrastructure-certificate-labels
  desc: Certificate naming with infrastructure labels
  crit: notable
  conf: 0.86
  all:
  - id: micro-behaviors/crypto/certificate/usage::go-certificate-or-name-reference
  any:
  - id: metadata/lang/source/naming/resource::infrastructure-label
  near_bytes: 300
- id: go-labeled-ecdsa-certificate
  desc: Creates a labeled ECDSA certificate
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/crypto/certificate/usage::go-create-certificate
  - id: micro-behaviors/crypto/asymmetric/ecdsa::go-ecdsa-key-or-curve-reference
  - id: metadata/lang/source/syntax/key-value::go-serial-number-field
  - id: micro-behaviors/crypto/certificate/usage::go-infrastructure-certificate-labels
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: well-known/dual-use/tunnel/sing-box::source-tree
- id: go-backdated-mutual-tls-certificate
  desc: Creates backdated mutual TLS certificate
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/crypto/certificate/usage::go-create-certificate
  - id: micro-behaviors/crypto/certificate/extensions::go-authentication-extended-key-usages
  - id: micro-behaviors/crypto/certificate/usage::go-backdated-notbefore-field
  any:
  - id: micro-behaviors/crypto/asymmetric/ecdsa::go-ecdsa-key-or-curve-reference
  - id: micro-behaviors/crypto/certificate/usage::go-infrastructure-certificate-labels
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: metadata/package/testing/harness/unit::go-testing-t
  - id: metadata/package/testing/presence/harness::test-directory
defaults:
  for:
  - go
  platforms:
  - unix
  - windows
