defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - text
  - json
  crit: notable
  conf: 0.96

traits:
  - id: apache-md-dns01-node-handler
    desc: References Apache DNS challenge Node command
    if:
      type: text
      regex: 'MDChallengeDns01[ \t]+[\\"'']*/([\w.-]+/){0,4}node(js)?[\\"''\s]'

  - id: apache-md-dns01-shell-handler
    desc: References Apache DNS challenge shell command
    if:
      type: text
      regex: 'MDChallengeDns01[ \t]+[\\"'']*/([\w.-]+/){0,4}(ba|da)?sh[\\"''\s]'

  - id: apache-md-dns01-python-handler
    desc: References Apache DNS challenge Python command
    if:
      type: text
      regex: 'MDChallengeDns01[ \t]+[\\"'']*/([\w.-]+/){0,4}python[0-9.]*[\\"''\s]'

  - id: apache-md-dns01-script-handler
    desc: Apache DNS challenge interpreter directive
    if:
      type: text
      regex: 'MDChallengeDns01[ \t]+[\\"'']*/([\w.-]+/){0,4}(perl|php|ruby)[\\"''\s]'


composite_rules:
  - id: apache-md-dns01-interpreter-handler
    desc: Apache DNS challenge interpreter configuration
    any:
      - id: micro-behaviors/crypto/certificate/usage::apache-md-dns01-node-handler
      - id: micro-behaviors/crypto/certificate/usage::apache-md-dns01-shell-handler
      - id: micro-behaviors/crypto/certificate/usage::apache-md-dns01-python-handler
      - id: micro-behaviors/crypto/certificate/usage::apache-md-dns01-script-handler
