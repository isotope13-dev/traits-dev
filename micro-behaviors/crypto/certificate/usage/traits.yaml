defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: certs-pem-config-path
    desc: PEM certificate config path
    crit: component
    conf: 0.85
    if:
      type: text
      regex: "['\"]/certs/.{1,80}\\.pem['\"]"
  - id: has-pem-certificate
    desc: Contains embedded PEM certificate block
    for: [scripts, binaries]
    crit: baseline
    conf: 0.98
    if:
      type: text
      regex: '-----BEGIN CERTIFICATE-----\s+[A-Za-z0-9+/=\r\n]{80,}\s+-----END CERTIFICATE-----'
