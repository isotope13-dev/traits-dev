defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: forge-create-certificate-call
    desc: Calls node-forge certificate creation
    if:
      type: text
      regex: '\bpki\.createCertificate\(\)'

  - id: forge-ca-basic-constraints
    desc: Certificate sets basicConstraints CA flag
    if:
      type: text
      regex: 'basicConstraints[^}]{0,60}cA:\s*(!0|true)'

composite_rules:
  - id: forge-root-ca-generation
    desc: Generates a CA certificate with node-forge
    crit: notable
    conf: 0.9
    near_bytes: 6000
    all:
      - id: forge-create-certificate-call
      - id: forge-ca-basic-constraints
