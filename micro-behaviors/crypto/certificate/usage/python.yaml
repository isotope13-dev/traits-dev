defaults:
  crit: notable
  platforms:
  - linux
  - macos
  - windows
  for:
  - python
traits:
- id: python-pkcs12-key-certificate-load
  desc: Python loads PKCS#12 key and certificate bundle
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: pkcs12.load_key_and_certificates
- id: python-x509-certificate-builder
  desc: Python builds an X.509 certificate
  conf: 0.9
  if:
    type: text
    substr: x509.CertificateBuilder
composite_rules:
- id: python-ed25519-identity-certificate
  desc: Python creates an Ed25519 identity certificate
  conf: 0.94
  all:
  - id: python-x509-certificate-builder
  - id: micro-behaviors/crypto/asymmetric/ed25519::python-ed25519-private-key-class
- id: python-pem-certificate-body-decode
  desc: Base64-decodes a PEM certificate body
  conf: 0.93
  all:
  - id: pem-begin
  - id: micro-behaviors/data/decode/base64::b64decode-call
  near_bytes: 256
