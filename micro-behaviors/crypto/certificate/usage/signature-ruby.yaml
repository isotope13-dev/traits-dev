defaults:
  for:
    - ruby
  platforms:
    - unix
    - windows
traits:
  - id: verifier-object-verify
    desc: Ruby verifier-like object verifies data
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: member
      regex: '(^|\.)(verifier|signature_verifier|public_key|rsa|dsa|ecdsa)\.verify$'
  - id: verify-pss-call
    desc: Ruby verifies a signature with PSS
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: verify_pss

composite_rules:
  - id: signature-verify
    desc: Ruby cryptographic signature verification API
    crit: notable
    conf: 0.9
    any:
      - id: verifier-object-verify
      - id: verify-pss-call
