defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-tls-server-certificate-fetch
    desc: Python retrieves a TLS server certificate
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: ssl.get_server_certificate
  - id: python-pem-x509-certificate-load
    desc: Python parses a PEM X.509 certificate
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: x509.load_pem_x509_certificate
