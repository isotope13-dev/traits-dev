# .NET X509Store access to the Windows certificate store. Opening the
# current-user "My" store and letting the user pick a certificate is how
# signing middleware (e-invoice, banking token tools) finds a USB-token or
# smart-card certificate; credential theft uses the same store, so intent
# stays with the composites that consume this capability.
defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, csharp]

traits:
  - id: dotnet-x509-store
    desc: ".NET X509 certificate store reference"
    conf: 0.92
    if:
      type: text
      exact: X509Store
  - id: dotnet-x509-certificate-selection
    desc: ".NET certificate picker selection call"
    conf: 0.92
    if:
      type: text
      word: SelectFromCollection

composite_rules:
  - id: dotnet-x509-store-certificate-selection
    desc: "Selects a certificate from the .NET X509 store"
    crit: notable
    conf: 0.92
    all:
      - id: dotnet-x509-store
      - id: dotnet-x509-certificate-selection
