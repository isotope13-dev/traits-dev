defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable

traits:
  # P/Invoke declarations may be absent from the native import table.
  - id: clr-cert-add-context-name-reference
    desc: CLR references certificate-store addition API
    conf: 0.95
    if:
      type: text
      exact: CertAddCertificateContextToStore
      section: .text
    unless:
      - id: micro-behaviors/crypto/certificate/store::cert-add-to-store
