# References and API co-occurrence do not establish bound data flow.
composite_rules:
- platforms:
  - windows
  for:
  - binaries
  id: hosts-path-cert-store-api-cooccurrence
  desc: Hosts-path and certificate-store APIs coexist
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/crypto/certificate/store::cert-store-population-api
  any:
  - id: micro-behaviors/fs/config/system::hosts-file-modification-api-set
  - id: micro-behaviors/network/dns::hosts-path-dns-flush-api-cooccurrence
  unless:
  - id: well-known/app/storage/syncback::syncback-backup-benign-context
