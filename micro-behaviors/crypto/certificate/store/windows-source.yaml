# Source-level Windows certificate-store access.
defaults:
  crit: notable
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-current-user-my-certificate-store
    desc: Enumerates current-user certificate store
    conf: 0.92
    if:
      type: text
      regex: '(?i)Cert:\\CurrentUser\\My\\'

  - id: certificate-key-provider-property-api
    desc: Reads certificate key provider metadata
    conf: 0.9
    for: [powershell, csharp, cpp, python, go, rust, pe, dll]
    if:
      type: text
      substr: CertGetCertificateContextProperty

  - id: cert-open-root-system-store-source
    desc: Opens Windows ROOT system certificate store
    conf: 0.95
    for: [c, cpp, csharp, go, rust, powershell]
    if:
      type: text
      regex: '\bCertOpenSystemStore[AW]?\s*\([^)\r\n]{0,40}["'']ROOT["'']'

  - id: cert-add-encoded-to-store-source
    desc: Calls CertAddEncodedCertificateToStore API
    conf: 0.94
    for: [c, cpp, csharp, rust]
    if:
      type: symbol
      exact: CertAddEncodedCertificateToStore
