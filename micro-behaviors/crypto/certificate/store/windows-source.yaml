# Source-level Windows certificate-store access.
defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-current-user-my-certificate-store
    desc: Enumerates current-user certificate store
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)Cert:\\CurrentUser\\My\\'

  - id: certificate-key-provider-property-api
    desc: Reads certificate key provider metadata
    crit: notable
    conf: 0.9
    for: [powershell, csharp, cpp, python, go, rust, pe, dll]
    if:
      type: text
      substr: CertGetCertificateContextProperty
