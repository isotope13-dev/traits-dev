# Windows Certificate Store APIs
defaults:
  platforms: ["windows"]
traits:
  - id: cert-open-system-store
    desc: Open Windows system certificate store
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: symbol
      exact: "CertOpenSystemStoreA"
  - id: cert-open-store
    desc: Open certificate store
    crit: notable
    conf: 0.9
    for: ["pe", "dll"]
    if:
      type: symbol
      exact: "CertOpenStore"
  - id: cert-enum-certificates
    desc: Enumerate certificates in store
    crit: notable
    conf: 0.9
    for: ["pe", "dll"]
    if:
      type: symbol
      exact: "CertEnumCertificatesInStore"
  - id: cert-close-store
    desc: Close certificate store handle
    crit: notable
    conf: 0.9
    for: ["pe", "dll"]
    if:
      type: symbol
      exact: "CertCloseStore"
  # These APIs populate a caller-selected store, which may be temporary or
  # in-memory. Without the store provider/name they do not prove root trust
  # installation; intent-specific composites add that surrounding evidence.
  - id: cert-add-to-store
    desc: Add certificate context to store
    crit: notable
    conf: 0.85
    for: [pe, dll]
    if:
      type: symbol
      exact: CertAddCertificateContextToStore
    unless:
      - id: well-known/game/mod/
  - id: cert-add-encoded
    desc: Add encoded certificate to store
    crit: notable
    conf: 0.85
    for: [pe, dll]
    if:
      type: symbol
      exact: CertAddEncodedCertificateToStore
  - id: pfx-import
    desc: Import PFX bundle into certificate store
    crit: notable
    conf: 0.85
    for: [pe, dll]
    if:
      type: symbol
      exact: PFXImportCertStore
    unless:
      - id: well-known/game/mod/
  - id: go-cert-open-store-proc
    desc: Go resolves cert store open
    crit: baseline
    conf: 0.9
    for: [go]
    if:
      type: literal
      exact: CertOpenStore
  - id: go-cert-close-store-proc
    desc: Go resolves cert store close
    crit: baseline
    conf: 0.9
    for: [go]
    if:
      type: literal
      exact: CertCloseStore
  - id: go-cert-add-encoded-proc
    desc: Go resolves encoded certificate store add
    crit: notable
    conf: 0.85
    for: [go]
    if:
      type: literal
      exact: CertAddEncodedCertificateToStore

  - id: cert-find-certificate
    desc: Find certificate in store
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: symbol
      exact: CertFindCertificateInStore
  - id: cert-duplicate-context
    desc: Duplicate certificate context
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: symbol
      exact: CertDuplicateCertificateContext

composite_rules:
  - id: cert-store-population-api
    desc: Windows certificate-store population APIs
    crit: notable
    conf: 0.9
    any:
      - id: cert-add-to-store
      - id: cert-add-encoded
      - id: go-cert-add-encoded-proc
      - id: pfx-import
  # Open + walk + search is how TLS stacks (Schannel, OpenSSL's CAPI engine,
  # Chromium) build a trust store from the Windows roots, and also how a
  # certificate sweep starts. Intent comes from the composites that pair it
  # with evasion or exfiltration (objectives/credential-access/...).
  - id: cert-store-search-api-set
    desc: Opens, walks and searches a cert store
    crit: notable
    conf: 0.85
    for: [pe]
    all:
      - id: cert-open-store
      - id: cert-enum-certificates
      - id: cert-find-certificate
    any:
      - id: cert-duplicate-context
      - id: cert-close-store
    unless:
      - id: metadata/binary/vendor/
      - id: well-known/tool/reverse-engineering/frida/
      - id: well-known/lib/crypto/openssl/
      - id: well-known/lib/runtime/scripted/electron::chromium-network-mojom-marker
      # libcurl's Schannel backend uses these APIs to validate TLS chains.
      - id: well-known/lib/network/curl::embedded-schannel-backend
      - id: well-known/app/storage/syncback::syncback-backup-benign-context
      - id: well-known/app/storage/syncback::syncback-shell-ext-benign-context
      - id: well-known/lib/network/smartftp::smartftp-library-context
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::rustc-path
