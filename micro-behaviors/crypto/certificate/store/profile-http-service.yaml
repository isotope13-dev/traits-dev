defaults:
  platforms: [windows]
  for: [oledoc]


composite_rules:
  - id: certificate-store-http-service-profile
    desc: Certificate store, HTTP POST, service and host capability profile
    crit: notable
    conf: 0.9
    for: [pe, dll]
    all:
      - id: micro-behaviors/crypto/certificate/store::pfx-import
      - id: micro-behaviors/crypto/certificate/store::cert-add-to-store
      - id: micro-behaviors/communications/http/post::wininet-post
      - id: micro-behaviors/os/service/start::start-service
    any:
      - id: micro-behaviors/data/db/query::sql-keywords
      - id: micro-behaviors/ui/graphics/draw::gdi-bitmap-transfer-primitives
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-symbol
