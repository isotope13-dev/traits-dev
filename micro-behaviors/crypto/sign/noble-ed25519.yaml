defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: ed25519-sign-call
    desc: Signs a message with Ed25519
    if:
      type: symbol
      kind: call
      regex: '^ed25519[\w$]*(\.sync)?\.sign$'

  - id: secp256k1-sign-call
    desc: Signs a message with secp256k1
    if:
      type: symbol
      kind: call
      regex: '^secp256k1[\w$]*\.sign(Sync)?$'
