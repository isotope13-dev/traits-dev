defaults:
  platforms: [macos, ios]
  for: [makefile]

traits:
  - id: makefile-ldid-signer-selection
    desc: Makefile selects ldid code signer
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?m)^(SIGN|CODESIGN)[ \t]*[:+?]?=[ \t]*ldid([ \t\r\n]|$)'

  - id: makefile-generated-postinst-ldid-signing
    desc: Generated post-install script invokes ldid
    crit: notable
    conf: 0.98
    if:
      # Emit-to-hook semantics are established on the same recipe line.
      # Merely echoing an example to stdout does not write an install hook.
      type: tree-sitter
      query: |
        ((recipe_line) @command
          (#match? @command "^[ \\t@+-]*echo[ \\t]+[\\\"']ldid[ \\t]+-S")
          (#match? @command "[\\\"'][ \\t]*>>?[ \\t]+[^ \\t]+/DEBIAN/postinst([ \\t]|$)"))
