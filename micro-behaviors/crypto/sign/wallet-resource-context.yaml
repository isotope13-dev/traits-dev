# Copying and re-signing can be application maintenance. These required facts
# do not establish process masquerading or bind a copy to the signed bundle.
defaults:
  platforms: [macos]
  for: [scripts, source]

composite_rules:
  - id: wallet-asar-copy-adhoc-context
    desc: Wallet ASAR paths, copying and ad-hoc signing co-occur
    crit: notable
    conf: 0.92
    near_bytes: 1200
    all:
      - id: micro-behaviors/fs/path/application/bundle::wallet-app-bundle-path
      - id: micro-behaviors/fs/path/application/bundle::electron-resources-asar-path-text
      - id: micro-behaviors/fs/file/copy::cp-command
      - id: micro-behaviors/crypto/sign::codesign-force-adhoc
