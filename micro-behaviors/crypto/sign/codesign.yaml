defaults:
  platforms: [macos]
  for: [scripts, source, macho]
traits:
  - id: codesign-force-adhoc
    desc: Forcefully ad-hoc signs with codesign
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bcodesign\s+(--force|-f)\b[^\r\n;]{0,30}(--sign|-s)\s+-(\s|["'']|$)'
  - id: codesign-ad-hoc-signing
    desc: Ad-hoc signs a file with macOS codesign
    crit: notable
    conf: 0.96
    for: [shell]
    if:
      type: text
      regex: '\bcodesign\b[^\n]{0,80}(--sign|-s)\s+["'']?-\s'
  - id: codesign-adhoc-combined-flags
    desc: Ad-hoc codesign via combined short flags
    crit: notable
    conf: 0.95
    for: [shell]
    # `codesign -fs - --deep`: the -f (force) and -s (sign) flags are bundled
    # into one cluster, so the -s/--sign atom above never sees a bare `-s`.
    if:
      type: text
      regex: '\bcodesign\s+-([a-z]*f[a-z]*s|[a-z]*s[a-z]*f)[a-z]*\s+-'
