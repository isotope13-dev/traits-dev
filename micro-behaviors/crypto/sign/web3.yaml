defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
- id: web3-accounts-message-sign
  desc: Web3 account message signing call
  if:
    # Nested TypeScript receivers are not always projected as call symbols.
    type: tree-sitter
    kind: call
    regex: '^[\w$.]{0,120}\bweb3\.eth\.accounts\.sign\s*\('
