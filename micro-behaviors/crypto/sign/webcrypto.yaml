defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.97

traits:
  - id: webcrypto-ed25519-sign-call-text
    desc: Web Crypto Ed25519 signing call syntax
    if:
      # Text also sees browser code embedded in generated HTML asset strings.
      type: text
      regex: '\bcrypto\.subtle\.sign\s*\(\s*["'']Ed25519["'']'
