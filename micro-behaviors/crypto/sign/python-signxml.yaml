defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.99

traits:
  - id: python-signxml-sign-call
    desc: Signs XML using a SignXML signer
    if:
      type: symbol
      kind: call
      regex: '\.sign$'
      receiver:
        from:
          call: '^(signxml\.)?XMLSigner$'
