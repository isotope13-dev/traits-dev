# Decryptor creation establishes decryption capability, not Base64 decoding.
defaults:
  conf: 0.95
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-create-decryptor-call
    desc: PowerShell calls a symmetric decryptor factory
    crit: notable
    if:
      type: text
      regex: '(?i)\.CreateDecryptor\s*\('
