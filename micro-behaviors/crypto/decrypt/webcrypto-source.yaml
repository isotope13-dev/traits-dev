defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: notable
traits:
  - id: webcrypto-bracket-decrypt-call
    desc: Calls bracketed Web Crypto decrypt
    conf: 0.94
    mbc: C0027
    if:
      # javascript-obfuscator commonly leaves only the sensitive method name
      # literal while computing the `subtle` member at runtime.
      type: text
      regex: '\bcrypto\s*\[[^\]\r\n]{1,120}\]\s*\[\s*["'']decrypt["'']\s*\]\s*\('

composite_rules:
  - id: webcrypto-decrypt-source-call
    desc: Web Crypto decrypt call in script source
    conf: 0.94
    any:
      - id: webcrypto-bracket-decrypt-call
      - id: webcrypto-decrypt-call-text
