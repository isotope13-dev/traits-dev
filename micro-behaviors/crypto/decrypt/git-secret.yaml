defaults:
  platforms: [windows, linux, macos]
  for: [python, javascript, typescript, csharp, go]
  crit: notable
  conf: 0.85

traits:
  - id: git-secret-reveal-command
    desc: Git-secret reveal command text
    crit: notable
    conf: 0.96
    for: [shell, ruby, python, javascript, typescript]
    if:
      type: text
      regex: '\bgit\s+secret\s+reveal\b'
  - id: git-secret-reveal-argument-array
    desc: Git-secret reveal command text
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']git["'']\s*,\s*\[\s*["'']secret["'']\s*,\s*["'']reveal["'']'

