defaults:
  platforms: [unix, windows]
  for: [class]
  crit: notable
  conf: 0.96

traits:
  - id: jvm-template-cipher-decrypt-init
    desc: JVM source template selects cipher decryption
    if:
      type: value
      path: class.strings[*]
      regex: '\.init\s*\(\s*(javax\.crypto\.)?Cipher\s*\.\s*DECRYPT_MODE\b'

  # Cipher.getInstance and the subsequent initializer must share one parsed
  # template constant. A bare .init(2, ...) is not a crypto observation.
  - id: jvm-template-cipher-decrypt-numeric-init
    desc: Cipher template initializes numeric decryption
    if:
      type: value
      path: class.strings[*]
      regex: 'Cipher\s*\.getInstance\s*\([^;]{1,120};[^;]{1,80}\.\s*init\s*\(\s*2\s*,'

composite_rules:
  - id: jvm-template-cipher-decrypt-mode
    desc: JVM template selects cipher decryption mode
    any:
      - id: jvm-template-cipher-decrypt-init
      - id: jvm-template-cipher-decrypt-numeric-init
