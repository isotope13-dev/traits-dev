defaults:
  crit: notable
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, python]

traits:
  - id: bcrypt-decrypt-source
    desc: Source decrypts with BCrypt
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])BCryptDecrypt$'

composite_rules:
  - id: bcrypt-symmetric-crypto-source
    desc: Source decrypts with Windows BCrypt
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/provider::bcrypt-open-provider-source
      - id: micro-behaviors/crypto/key/import::bcrypt-symmetric-key-import-source
      - id: bcrypt-decrypt-source
    near_lines: 40
