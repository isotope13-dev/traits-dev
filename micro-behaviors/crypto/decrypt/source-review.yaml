# Evidence-only observations; consumers supply any attack context.
composite_rules:
- platforms:
  - windows
  for:
  - tar
  - rust
  id: rust-app-bound-token-api-cooccurrence
  desc: App-Bound crypto and token APIs co-occur
  crit: suspicious
  conf: 0.98
  scope: archive
  all:
  - id: micro-behaviors/crypto/key/import::rust-cng-open-key-call
  - id: micro-behaviors/crypto/decrypt::rust-cng-decrypt-call
  - id: micro-behaviors/os/security/dpapi::rust-dpapi-unprotect-call
  - id: micro-behaviors/data/config/browser-preference::rust-appb-byte-prefix
  - id: micro-behaviors/data/config/browser-preference::rust-v20-byte-prefix
  - id: micro-behaviors/data/config/browser-preference::chromium-app-bound-encrypted-key-field
  - id: micro-behaviors/os/privilege/token::rust-duplicate-token-call
  - id: micro-behaviors/os/privilege/token::impersonate-logged-on-user-source
  any:
  - id: micro-behaviors/process/info/name::lsass-executable-reference
  - id: micro-behaviors/process/info/name::winlogon-executable-reference
