# TEA with its sum updates factored into tiny helpers. The first helper
# subtracts delta; the second loads the initial sum through a split add.
# Require the 4/5 shift mixing and 32 rounds, not just a cipher constant.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  crit: notable
  conf: 0.99
traits:
  - id: x86-tea-helper-decrypt
    desc: x86 TEA decryption with sum helpers
    if:
      type: yara
      source: |
        import "pe"
        rule tea_helper_decrypt {
          strings:
            $helpers = { 81 00 47 86 C8 61 C3 81 00 E1 34 EF C6 C3 01 08 C3 }
            $mix = { C1 E0 04 [0-80] C1 E8 05 [0-32] 01 45 FC }
            $rounds = { C7 85 ?? ?? ?? ?? 20 00 00 00 }
            $subtract = { 2B 7D FC [0-128] 2B DE }
          condition:
            for any s in (0..pe.number_of_sections - 1): (
              pe.sections[s].name == ".text" and
              $helpers in (pe.sections[s].raw_data_offset..
                pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size) and
              $mix in (@helpers..@helpers + 1024) and
              $rounds in (@helpers..@helpers + 1024) and
              $subtract in (@helpers..@helpers + 4096)
            )
        }
