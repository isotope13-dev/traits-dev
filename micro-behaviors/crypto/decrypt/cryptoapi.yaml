defaults:
  crit: notable
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: crypt-decrypt
    for: [pe, dll, c, cpp]
    desc: CryptoAPI buffer-decryption symbol reference
    conf: 0.9
    if:
      type: symbol
      exact: "CryptDecrypt"
  - id: crypt-decrypt-api-name-text
    desc: CryptoAPI CryptDecrypt function-name string
    conf: 0.88
    if:
      type: text
      word: CryptDecrypt
    unless:
      - id: crypt-decrypt
