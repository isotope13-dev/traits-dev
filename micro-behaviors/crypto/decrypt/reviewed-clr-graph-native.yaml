defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.9
traits:
- for:
  - pe
  - dll
  - asp
  - powershell
  - batch
  - javascript
  - vbs
  id: dotnet-create-decryptor-text
  desc: CreateDecryptor method-name reference
  if:
    type: text
    word: CreateDecryptor
    case_insensitive: true
composite_rules:
- id: dotnet-create-decryptor
  desc: CreateDecryptor method-name reference
  for: [pe, dll, csharp, asp, powershell, batch, javascript, vbs]
  any:
  - id: dotnet-create-decryptor-text
  - id: csharp-create-decryptor-symbol
- id: dotnet-rijndael-decryptor
  desc: AES/Rijndael and decryptor API references co-occur
  for:
  - pe
  - csharp
  - asp
  - powershell
  all:
  - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-any
  - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor
