# Hexadecimal ciphertext and a sliced AEAD tag do not establish code loading.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  mbc: C0027

composite_rules:
  - id: node-aes-gcm-hex-input-and-tag-slice
    desc: AES-GCM decipher with hex input and sliced tag
    crit: notable
    conf: 0.95
    all:
    - id: micro-behaviors/crypto/decrypt::node-aes-gcm-decipher-initialization
    - id: micro-behaviors/crypto/decrypt::auth-tag-sliced-from-buffer
    - id: micro-behaviors/data/decode/hex::node-update-with-hex-buffer
