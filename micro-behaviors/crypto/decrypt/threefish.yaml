defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, python, javascript, typescript, go, rust]

traits:
  - id: threefish-named-decrypt-call
    desc: Calls a named Threefish decryption routine
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|[.:_])threefish([._]?(256|512|1024))?[._]?decrypt$'
