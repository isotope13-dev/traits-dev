defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source]
  crit: notable
  conf: 0.95
traits:
  - id: nss-secret-decrypt-reference
    desc: NSS PK11SDR_Decrypt API reference
    if:
      type: text
      substr: PK11SDR_Decrypt
    unless:
      - id: well-known/lib/crypto/nss/
      - id: well-known/app/browser/palemoon/
  # Same API as above, concealed with a rotated substitution alphabet.
  # The matcher observes a name; consumers supply acquisition/abuse context.
  - id: substituted-nss-secret-decrypt-reference
    desc: Substituted NSS secret-decryption API name
    for: [pe, dll, data]
    platforms: [windows]
    if:
      type: text
      exact: '9HGGMarpadY0Zs5'
