defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.9
traits:
  - id: cfml-decrypt-password-member
    desc: CFML decrypts a password member
    if:
      type: symbol
      kind: call
      exact: decrypt
      arg:
        index: 0
        from:
          member: '\.password$'
