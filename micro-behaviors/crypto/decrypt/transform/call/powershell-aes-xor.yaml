defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.96

composite_rules:
  - id: powershell-aes-xor-transform-profile
    desc: AES decryptor, final transform and indexed XOR loop co-occur
    near_lines: 25
    all:
      - id: micro-behaviors/crypto/symmetric/aes/initialize::dotnet-aes-create
      - id: micro-behaviors/crypto/decrypt/initialize::powershell-create-decryptor-call
      - id: micro-behaviors/crypto/cipher/reference::dotnet-transform-final-block
      - id: micro-behaviors/data/decode/custom::powershell-keyed-byte-loop-decrypt
