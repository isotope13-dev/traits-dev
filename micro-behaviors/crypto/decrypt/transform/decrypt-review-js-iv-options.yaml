defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: js-decrypt-algorithm-iv-call
    desc: Decrypt call with algorithm and IV
    crit: notable
    conf: 0.94
    if:
      type: tree-sitter
      query: |-
        ((call_expression function: (subscript_expression
          index: (string (string_fragment) @method))
          arguments: (arguments . (object
            (pair key: (string (string_fragment) @algorithm))
            (pair key: (string (string_fragment) @iv))) . (_) . (_) .)) @decrypt
          (#eq? @method "decrypt") (#eq? @algorithm "name") (#eq? @iv "iv"))
