# Bind Open to a crypto/cipher GCM constructor, rather than treating every
# method named Open as decryption. Aliases are resolved by the flow producer.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.98

traits:
  - id: go-gcm-open
    desc: Decrypts through a constructed Go GCM cipher
    if:
      type: symbol
      kind: call
      regex: '\.Open$'
      receiver:
        from:
          call: '^crypto/cipher\.NewGCM(WithNonceSize|WithTagSize)?$'
