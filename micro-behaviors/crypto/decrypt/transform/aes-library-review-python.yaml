defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: pycrypto-decrypt-func-name
    desc: Python decrypt function name
    crit: notable
    conf: 0.75
    if:
      type: symbol
      regex: '^decrypt(_|[A-Z])(aes|data)\w+$'
composite_rules:
  - id: pycrypto-aes-decrypt-context
    desc: AES references with decrypt and unpad
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/crypto/symmetric/aes/library::pycrypto-usage
      - id: micro-behaviors/crypto/decrypt/transform::python-decrypt-method-call
      - id: metadata/lang/source/naming/function/transform::python-unpad-symbol
