defaults:
  for: [pyc]
  platforms: [windows, unix]
traits:
  - id: pyc-decrypt-reference
    desc: Python bytecode references a decrypt member
    crit: notable
    conf: 0.9
    if:
      type: text
      word: decrypt

  - id: pyc-decrypt-and-verify-reference
    desc: Bytecode names AEAD decrypt and verify
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: identifier
      exact: decrypt_and_verify
