# Co-occurring encoding, crypto, write and window-option references.
defaults:
  for:
  - powershell
  - batch
  platforms:
  - windows
composite_rules:
- id: batch-base64-decryptor-cooccurrence
  desc: Batch Base64 and decryptor references
  crit: suspicious
  conf: 0.95
  for:
  - batch
  all:
  - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
  near_lines: 40
  unless:
  - id: well-known/app/infrastructure/watchmaker::package-context
- id: powershell-join-crypto-name-cooccurrence
  desc: Join near crypto or Base64 name references
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/data/string/concat/join::powershell-empty-delimiter-join
  any:
  - id: metadata/lang/source/naming/function/cryptography::decrypt-aes-function
  - id: micro-behaviors/crypto/cipher/io::dotnet-cryptostream-read-mode
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
  - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
  near_bytes: 1000
- id: powershell-base32-aes-profile
  desc: PowerShell Base32 and AES source clues
  crit: suspicious
  conf: 0.96
  for:
  - powershell
  all:
  - id: micro-behaviors/data/decode/base32::ps-custom-base32-decoder
  - id: micro-behaviors/crypto/symmetric/aes/initialize::dotnet-aes-create
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
  any:
  - id: metadata/file/line::very-long-source-line
  - id: metadata/lang/encoding/base64::multiple-base64-literals
- id: batch-aes-write-hidden-clues
  desc: Batch AES, file write and hidden-window clues
  crit: suspicious
  conf: 0.98
  for:
  - batch
  all:
  - id: micro-behaviors/crypto/symmetric/aes/initialize::dotnet-aes-create
  - id: micro-behaviors/crypto/decrypt/initialize::dotnet-create-decryptor
  - id: micro-behaviors/fs/write/file/full/bytes::write-all-bytes
  - id: micro-behaviors/process/config/window::windowstyle-hidden
- id: batch-base64-transform-clues
  desc: Batch Base64 and transform API clues
  crit: suspicious
  conf: 0.98
  for:
  - batch
  all:
  - id: micro-behaviors/crypto/decrypt/transform/unspecified::batch-base64-decryptor-cooccurrence
  - id: micro-behaviors/crypto/cipher/unspecified::dotnet-transform-final-block
  any:
  - id: micro-behaviors/fs/read/file/content/bytes::powershell-file-readallbytes
  - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
