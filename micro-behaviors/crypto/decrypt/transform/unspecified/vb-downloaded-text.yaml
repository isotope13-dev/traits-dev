# VB assigns a WebClient.DownloadString result and passes it to a *Decrypt*
# routine within the next few lines: remote content arrives encrypted and is
# decrypted locally. Adjacency, not proven data flow.
defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: vb-download-string-then-decrypt
    desc: VB decrypts text right after downloading it
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\.DownloadString\([^\r\n]{1,80}[\s\S]{0,160}Decrypt\w*\(\s*\w+\s*,'
