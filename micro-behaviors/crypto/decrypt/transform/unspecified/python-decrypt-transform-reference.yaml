defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-decrypt-named-function-transform-syntax
    desc: Decrypt-named function with transform syntax
    conf: 0.75
    # Keep the original observation. A name plus XOR/Base64/fromhex syntax
    # does not establish decryption, its direction, or a symmetric cipher.
    if:
      type: text
      regex: (?i)def\s+\w*decrypt\w*\s*\([^)]{0,80}\):(?s:.{0,300})(\^|b64decode|fromhex)
