defaults:
  for:
  - python
  platforms:
  - unix
  - windows
traits:
- id: python-dpapi-decrypt-blob
  desc: Calls DPAPI blob decryption helper
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: call
    exact: decrypt_blob
- id: python-chrome-decrypt-password
  desc: Calls Chrome password decryption helper
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: call
    exact: decrypt_chrome_password
