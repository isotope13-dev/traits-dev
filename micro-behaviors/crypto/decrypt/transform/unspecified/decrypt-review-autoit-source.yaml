# AutoIt is currently exposed as unparsed text; require call syntax.
defaults:
  platforms: [windows]
  for: [text, data, vbs]
  crit: notable
  conf: 0.95
traits:
  - id: autoit-string-decrypt-call
    desc: AutoIt StringEncrypt called in decrypt mode
    if:
      type: raw
      regex: '(?i)\b_StringEncrypt\s*\(\s*0\s*,'
