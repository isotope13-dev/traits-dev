defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.92

traits:
  - id: openssl-evp-decrypt-transform-import
    desc: Imports OpenSSL EVP decryption transform
    for: [elf, macho, pe, dll, so, dylib]
    if:
      type: import
      regex: '^_?EVP_Decrypt(Update|Final(_ex)?)$'

  - id: openssl-evp-decrypt-transform-call
    desc: Calls OpenSSL EVP decryption transform
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      regex: '^EVP_Decrypt(Update|Final(_ex)?)$'
