# These unqualified calls do not establish their receiver or algorithm.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component
  conf: 0.9
traits:
  - id: decrypt-sk-call-text
    desc: decrypt call text with sk argument
    if:
      type: text
      regex: '\bdecrypt\s*\(\s*sk\s*,'
