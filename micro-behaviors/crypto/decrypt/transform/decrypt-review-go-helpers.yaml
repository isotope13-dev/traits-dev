defaults:
  for:
  - pe
  platforms:
  - windows
  crit: notable
  conf: 0.94
traits:
- id: go-aesgcm-decrypt-helper-call
  desc: Calls AES-GCM decryption helper
  if:
    type: symbol
    kind: call
    substr: .DecryptAESGCM
- id: go-embedded-dll-decrypt-call
  desc: Calls embedded DLL decryption helper
  if:
    type: symbol
    kind: call
    substr: .getDecryptedDLL
