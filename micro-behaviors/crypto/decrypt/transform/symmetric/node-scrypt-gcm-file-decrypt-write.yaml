# Building block of staged npm payloads: a module that reads a packaged
# file, derives the AES key with scrypt from a runtime-supplied password,
# AES-GCM-decrypts it with a detached auth tag, and writes the plaintext
# back into the package tree so another module can require() it. The
# capability itself is neutral (file-encryption and backup tools share
# these primitives); the staged-payload claim is made by composites that
# also require ciphertext stage files and a caller-keyed module loader.
# Whole-file bucketing (no near_bytes) keeps this firing on the small,
# obfuscated loader modules these packages ship.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

composite_rules:
  - id: node-scrypt-gcm-file-decrypt-write
    desc: Scrypt-keyed AES-GCM file decryption writes plaintext
    conf: 0.96
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::buffer-from-base64
      - id: micro-behaviors/crypto/kdf/algorithm::node-memory-hard-kdf
      - id: micro-behaviors/crypto/decrypt/initialize::createDecipheriv
      - id: micro-behaviors/crypto/cipher/authentication::set-auth-tag
      - id: micro-behaviors/fs/read/file/content/unspecified::readfilesync-call
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
