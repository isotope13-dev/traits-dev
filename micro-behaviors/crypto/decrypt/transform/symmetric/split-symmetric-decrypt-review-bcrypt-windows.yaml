defaults:
  platforms:
  - windows
  for:
  - binaries
  crit: component
  conf: 0.9
composite_rules:
- id: bcrypt-gcm-decrypt-api-set
  desc: GCM property and BCrypt decryption APIs
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/crypto/cipher/mode::bcrypt-chaining-mode-gcm
  - id: micro-behaviors/crypto/provider/cryptoapi::bcrypt-open-algorithm-provider
  - id: micro-behaviors/crypto/key/import::bcrypt-symmetric-key-api
  - id: micro-behaviors/crypto/decrypt/transform/unspecified::bcrypt-decrypt-api
  any:
  - id: micro-behaviors/fs/path/system/library::bcrypt-dll-name
  - id: micro-behaviors/crypto/cipher/mode::bcrypt-chaining-mode-prop
