# Bind Open to a crypto/cipher GCM constructor, rather than treating every
# method named Open as decryption. Aliases are resolved by the flow producer.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.98

traits:
  - id: go-gcm-open
    desc: Decrypts through a constructed Go GCM cipher
    if:
      type: symbol
      kind: call
      regex: '\.Open$'
      receiver:
        from:
          call: '^crypto/cipher\.NewGCM(WithNonceSize|WithTagSize)?$'

  - id: go-aead-open-call-arity4
    desc: Four-argument Go AEAD Open call
    crit: component
    conf: 0.8
    if:
      type: text
      exclude_comments: true
      regex: '\.Open\s*\([^,\n]{1,64},[^,\n]{1,64},[^,\n]{1,64},[^)\n]{1,64}\)'

composite_rules:
  - id: go-gcm-open-closure
    desc: Decrypts through Go cipher.NewGCM and four-argument Open
    conf: 0.95
    near_lines: 25
    all:
      - id: go-aead-open-call-arity4
      - id: metadata/lang/source/naming/interface/runtime::go-cipher-new-gcm
