# OpenSSL-compatible passphrase decryption: the code names the "Salted__"
# container header, derives a key with PBKDF2, and deciphers with AES-256-CBC
# in one file. Each leg is a reusable atom, so the composite adds no matcher
# of its own beyond the shared header spelling.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable

traits:
  - id: openssl-salted-header-text
    desc: Source names the OpenSSL Salted container header
    conf: 0.85
    if:
      type: text
      substr: Salted__

composite_rules:
  - id: openssl-salted-aes-pbkdf2-decrypt
    desc: Decrypts OpenSSL Salted AES-256-CBC PBKDF2 container
    conf: 0.9
    all:
      - id: micro-behaviors/crypto/decrypt/initialize::createDecipheriv
      - id: micro-behaviors/crypto/symmetric/aes/mode::aes-256-cbc-dash
      - id: micro-behaviors/crypto/provider/library::pbkdf2-call
      - id: openssl-salted-header-text
