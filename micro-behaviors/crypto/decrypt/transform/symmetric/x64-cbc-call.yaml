defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
traits:
  - id: x64-cbc-padded-decrypt-call
    desc: Padded CBC decrypt indirect-call pattern
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: .text
      # BCryptDecrypt size-query call: IV length 16, null output, padding=1,
      # result-size pointer, followed by a signed NTSTATUS check.
      pattern: '48 8B 4C 24 60 45 33 C9 C7 44 24 48 01 00 00 00 45 8B C4 48 89 44 24 40 48 8D 45 90 44 89 74 24 38 4C 89 74 24 30 C7 44 24 28 10 00 00 00 48 89 44 24 20 44 89 74 24 54 FF D3 85 C0 0F 88'
