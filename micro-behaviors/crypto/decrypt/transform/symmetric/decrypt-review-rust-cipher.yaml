defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.98

traits:
  - id: rust-aead-decrypt
    desc: Rust decrypts with an AEAD cipher instance
    if:
      type: symbol
      kind: call
      regex: '\.decrypt$'
      receiver:
        from:
          call: '^(aes_gcm::Aes\d+Gcm|chacha20poly1305::ChaCha20Poly1305)::new(_from_slice)?$'

  - id: rust-decrypt-method-call
    desc: Rust calls decrypt method
    crit: component
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '\.decrypt(_in_place)?$'

  - id: rust-padded-block-decrypt-call
    desc: Rust calls padded block decryption
    if:
      # Generic method calls currently lose their symbol target. Match the
      # parsed call, excluding imports, comments and quoted source examples.
      type: tree-sitter
      query: |
        ((call_expression
          function: (generic_function
            function: (field_expression field: (field_identifier) @method))) @call
          (#eq? @method "decrypt_padded_mut"))

composite_rules:
  - id: rust-aes-gcm-decrypt-near-type
    desc: Rust calls decrypt method near AES-GCM cipher construction
    conf: 0.95
    near_lines: 25
    all:
      - id: rust-decrypt-method-call
      - id: metadata/lang/source/naming/interface/runtime::rust-aes-gcm-type-reference
