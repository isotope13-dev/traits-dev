defaults:
  crit: notable
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, python]

composite_rules:
  - id: bcrypt-symmetric-crypto-source
    desc: Source decrypts with Windows BCrypt
    conf: 0.97
    all:
      - id: micro-behaviors/crypto/provider/cryptoapi::bcrypt-open-provider-source
      - id: micro-behaviors/crypto/key/import::bcrypt-symmetric-key-import-source
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::bcrypt-decrypt-source
    near_lines: 40
