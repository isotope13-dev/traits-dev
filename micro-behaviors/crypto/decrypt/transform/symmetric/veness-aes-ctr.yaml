# Chris Veness' JavaScript AES counter-mode helper called with a key held
# in a script variable and an explicit key size.
traits:
  - id: veness-aes-ctr-decrypt-call
    desc: Calls JavaScript Aes.Ctr.decrypt helper
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [javascript, html]
    if:
      type: text
      regex: '=\s*Aes\.Ctr\.decrypt\(\s*\w+\s*,\s*\w+\s*,\s*(128|192|256)\s*\)'
