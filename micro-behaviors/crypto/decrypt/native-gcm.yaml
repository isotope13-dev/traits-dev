defaults:
  for: [macho]
  platforms: [macos]
  crit: notable
  conf: 0.96

traits:
  - id: aes256-gcm-indirect-decrypt
    desc: Indirect AES-256-GCM authenticated decryption
    if:
      type: yara
      # The ABI binds AES algorithm zero, 32-byte key, 12-byte nonce,
      # null AAD and 16-byte tag to an indirect call and status test.
      # Search both slices; section hex otherwise sees the preferred slice.
      source: |
        rule native_aes256_gcm_indirect_decrypt {
          strings:
            $x64_a = { 48 C7 44 24 28 10 00 00 00 48 C7 04 24 00 00 00 00 BA 20 00 00 00 41 B8 0C 00 00 00 31 FF 4C 89 F6 48 89 D9 45 31 C9 FF D0 85 C0 0F 94 C0 }
            $x64_b = { 48 C7 44 24 28 10 00 00 00 48 C7 04 24 00 00 00 00 BA 20 00 00 00 41 B8 0C 00 00 00 31 FF 4C 89 F6 48 89 D9 45 31 C9 FF 15 ?? ?? ?? ?? 85 C0 0F 94 C0 }
            $x64_c = { BA 20 00 00 00 41 B8 0C 00 00 00 31 FF 4C 89 EE 48 89 D9 45 31 C9 6A 10 41 57 41 52 41 54 41 53 6A 00 FF D0 48 83 C4 30 85 C0 0F 94 C0 }
            $arm64 = { 09 02 80 52 F8 27 01 A9 F7 5B 00 A9 00 00 80 52 E1 03 15 AA 02 04 80 52 E3 03 14 AA 84 01 80 52 05 00 80 D2 06 00 80 D2 E7 03 13 AA 00 01 3F D6 1F 00 00 71 E0 17 9F 1A }
            // Unoptimized frame-local lengths are loaded into ABI slots.
            $x64_frame = { C7 45 ?? 00 00 00 00 48 C7 45 ?? 20 00 00 00 48 C7 45 ?? 0C 00 00 00 48 C7 45 ?? 10 00 00 00 8B 7D ?? 48 8B 55 ?? 4C 8B 45 ?? 48 8B 45 ?? 48 89 44 24 28 48 89 5C 24 20 4C 89 4C 24 18 48 83 24 24 00 48 89 4C 24 10 4C 89 64 24 08 4C 89 FE 4C 89 F1 45 31 C9 FF 15 ?? ?? ?? ?? 85 C0 0F 94 C0 }
            // Frame-local 32/12/16 lengths pushed into the GCM ABI stack slots.
            $x64_frame_push = { C7 45 ?? 00 00 00 00 48 C7 45 ?? 20 00 00 00 48 C7 45 ?? 0C 00 00 00 48 C7 45 ?? 10 00 00 00 8B 7D ?? 48 8B 55 ?? 4C 8B 45 ?? 4C 89 EE 48 89 D9 45 31 C9 FF 75 ?? 41 57 41 52 41 54 41 53 6A 00 FF 15 ?? ?? ?? ?? 48 83 C4 30 85 C0 0F 94 C0 }
          condition:
            any of them
        }
