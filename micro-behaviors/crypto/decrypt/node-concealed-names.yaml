traits:
- id: decipheriv-name-literal
  desc: createDecipheriv named by a string constant
  conf: 0.8
  if:
    type: literal
    kind: string
    exact: createDecipheriv
  unless:
  - id: well-known/lib/web/client-side/ecmascript/
- id: set-auth-tag-name-literal
  desc: setAuthTag named by a string constant
  conf: 0.85
  if:
    type: literal
    kind: string
    exact: setAuthTag
  unless:
  - id: well-known/lib/web/client-side/ecmascript/
# javascript-obfuscator's lower-first Base64 alphabet hides Node.js crypto
# API names from plain-text and symbol matchers. The encoded spelling is
# stable because the API name itself cannot be renamed.
- id: decipheriv-lower-first-b64-literal
  desc: createDecipheriv in lower-first Base64
  conf: 0.9
  if:
    type: literal
    kind: string
    regex: '^y3jLyxrLrgvJAxbOzxjPDG={0,2}$'
  unless:
  - id: well-known/lib/web/client-side/ecmascript/
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
# One observation in three spellings: a direct call, a string constant, or
# the lower-first Base64 string-table form. The group keeps its cardinality
# in enclosing needs: clauses; reference it instead of any single spelling.
composite_rules:
- id: createdecipheriv-any-form
  desc: createDecipheriv in any supported spelling
  conf: 0.9
  any:
  - id: micro-behaviors/crypto/decrypt::createDecipheriv
  - id: micro-behaviors/crypto/decrypt::decipheriv-name-literal
  - id: micro-behaviors/crypto/decrypt::decipheriv-lower-first-b64-literal
