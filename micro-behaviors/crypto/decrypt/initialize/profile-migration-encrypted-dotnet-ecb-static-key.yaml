defaults:
  platforms:
  - windows
  for:
  - csharp
  - pe
  - dll
composite_rules:
- id: dotnet-string-key-ecb-decryptor-profile
  desc: String key, ECB/padding and decryptor clues
  crit: suspicious
  conf: 0.9
  scope: file
  near_lines: 40
  all:
  - id: micro-behaviors/crypto/symmetric/config::dotnet-ecb-or-zero-padding-reference
