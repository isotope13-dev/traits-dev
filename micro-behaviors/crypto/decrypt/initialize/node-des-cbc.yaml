defaults:
  crit: notable
  conf: 0.92
  platforms: [android, unix, windows]
  for: [java, kotlin, python, javascript, typescript, go, ruby, php]
  attack: T1027
  mbc: C0027

traits:
  - id: node-des-cbc-constructor
    desc: Node initializes DES-family CBC decipher
    if:
      type: text
      regex: '(?i)createDecipheriv\s*\(\s*[\x27"]des-(cbc|ede-cbc|ede3-cbc)[\x27"]'
