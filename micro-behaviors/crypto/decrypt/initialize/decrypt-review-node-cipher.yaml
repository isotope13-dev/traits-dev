defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: createDecipheriv
  desc: Initialize Node.js decrypting cipher with IV
  conf: 0.85
  if:
    type: symbol
    kind: call
    regex: (^|\.)createDecipheriv$
- id: create-decipher-call
  desc: Initialize Node.js legacy decrypting cipher
  conf: 0.7
  if:
    type: symbol
    kind: call
    regex: (^|\.)createDecipher$
