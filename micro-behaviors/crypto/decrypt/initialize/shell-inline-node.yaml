# A shell script that hands an inline program to node (`node -e "..."`,
# `$NODE_BIN -e "..."`) whose body creates a decipher. The decryption runs in
# a one-off interpreter rather than in shipped JavaScript, so the cipher code
# never exists as a file a scanner sees on its own.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.9
  attack: T1140

traits:
  - id: shell-inline-node-decipher
    desc: Shell inline node script creates a decipher
    if:
      type: text
      regex: '\s-e\s+["''][\s\S]{0,600}\.createDecipheriv\s*\('
