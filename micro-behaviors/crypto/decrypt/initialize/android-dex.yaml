defaults:
  platforms: [android]
  for: [dex]
traits:
  # Cipher.DECRYPT_MODE is the constant 2; DEX inlines it at the call site.
  - id: dex-cipher-decrypt-mode-init-call
    desc: DEX initializes a cipher in decrypt mode
    crit: notable
    conf: 0.93
    if:
      type: symbol
      kind: call
      exact: 'Ljavax/crypto/Cipher;->init'
      arg:
        index: 0
        kind: number
        value: 2
