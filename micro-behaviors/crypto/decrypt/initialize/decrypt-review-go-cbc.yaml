defaults:
  platforms: [windows, linux, macos]
  for: [scripts, binaries, go]

traits:
  - id: go-cbc-decrypter-name-reference
    desc: References Go cipher.NewCBCDecrypter
    crit: notable
    conf: 0.72
    # CBC accepts any cipher.Block, including DES; neither AES nor a
    # completed decryption follows from a constructor-name reference.
    if:
      type: text
      substr: cipher.NewCBCDecrypter
