defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.92

traits:
  - id: openssl-evp-decrypt-init-import
    desc: Imports OpenSSL EVP decryption initialization
    for: [elf, macho, pe, dll, so, dylib]
    if:
      type: import
      regex: '^_?EVP_DecryptInit(_ex|_ex2)?$'

  - id: openssl-evp-decrypt-init-call
    desc: Calls OpenSSL EVP decryption initialization
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      regex: '^EVP_DecryptInit(_ex|_ex2)?$'
