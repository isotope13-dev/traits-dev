defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  # Follow the key argument, not a key-like variable name or an unrelated
  # public key. Buffer.from may receive a bound constant or an inline literal.
  - id: node-static-key-decipher
    desc: Initialize decryption with a static key string
    if:
      type: symbol
      kind: call
      regex: '(^|\.)createDecipheriv$'
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?crypto$'
      arg:
        index: 1
        from:
          value: '^([A-Za-z0-9+/]{22}==|[A-Za-z0-9+/]{32}|[A-Za-z0-9+/]{43}=|[0-9a-fA-F]{32}|[0-9a-fA-F]{48}|[0-9a-fA-F]{64})$'
          through:
            - call: '^Buffer\.from$'
              arguments: [0]
