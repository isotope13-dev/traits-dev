defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.95

traits:
  - id: php-openssl-decrypt-call
    desc: PHP calls OpenSSL decryption API
    if:
      type: symbol
      kind: call
      exact: openssl_decrypt

  # The cipher selector must belong to this OpenSSL call, rather than an
  # unrelated literal elsewhere in the file.
  - id: php-openssl-aes-cbc-decryption
    desc: PHP OpenSSL AES CBC decryption
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: openssl_decrypt
      arg:
        index: 1
        kind: string
        regex: '(?i)^AES-(128|192|256)-CBC$'
