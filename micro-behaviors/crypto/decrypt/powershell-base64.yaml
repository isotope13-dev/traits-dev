defaults:
  for: [powershell]
  platforms: [windows]
  conf: 0.9
composite_rules:
  - id: powershell-base64-decryption-cooccurrence
    desc: Base64 decoder and symmetric decryptor calls co-occur
    crit: notable
    all:
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/crypto/symmetric/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/crypto/symmetric/decrypt::powershell-create-decryptor-call
    near_lines: 40
    unless:
      - id: well-known/app/infrastructure/watchmaker::package-context
