defaults:
  platforms: [unix, windows]
  for: [elf, pe, macho, dll, so, dylib]
  arch: [x86, x86-64]

traits:
  - id: aesni-block-decryption-routine
    desc: AES-NI block decryption and output store
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '66 0F 38 DE ?? [4-32] 66 0F 38 DE ?? [4-128] 66 0F 38 DF ?? 0F 11 (00|01|02|03|06|07) C3'
