# Progress text from code that decrypts an embedded configuration blob.
defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe, dll]
traits:
  - id: config-decryption-status-message
    desc: Logs embedded configuration decryption progress
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(Config decrypted successfully|Decrypting config)'
