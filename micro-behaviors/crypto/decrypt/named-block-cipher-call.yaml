defaults:
  platforms: [windows, unix]
  for: [python, c, cpp]
  crit: notable
traits:
  - id: aes-cbc-decrypt-helper-call
    desc: Calls a named AES-CBC decryption helper
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])aes_cbc(_256)?_decrypt$'
  - id: threefish-decrypt-helper-call
    desc: Calls a named Threefish decryption helper
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])threefish_decrypt$'
