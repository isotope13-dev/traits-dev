defaults:
  for: [javascript, typescript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.95
traits:
  - id: omnibox-input-change-listener
    desc: Registers browser omnibox input listener
    if:
      type: symbol
      kind: call
      regex: '(^|\.)omnibox\.onInputChanged\.addListener$'

  # Extension UI telling the user to start an address-bar query with a
  # keyword ("type spotify into your address bar followed by..."). This is
  # how a keyword-scoped search provider is meant to be used.
  - id: address-bar-keyword-usage-instruction
    desc: UI explains address-bar keyword search
    conf: 0.9
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '(?i)\b(type|enter)\b.{0,80}\binto\s+(your|the)\s+address\s+bar\b.{0,40}\bfollowed\s+by'
