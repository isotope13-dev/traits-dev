# User-Agent is ordinary HTTP metadata, not proof of theft or C2.
defaults:
  platforms: [unix, windows]

composite_rules:
- id: install-useragent-http-telemetry
  desc: Install handler with User-Agent HTTP query
  crit: notable
  conf: 0.98
  for: [javascript, typescript]
  scope: file
  near_bytes: 2048
  all:
  - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
  - id: micro-behaviors/communications/http/request/query::fetch-useragent-query
