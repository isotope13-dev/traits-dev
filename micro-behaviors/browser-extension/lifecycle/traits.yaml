# Browser-extension runtime lifecycle / identity. These are irreducibly
# extension-specific (no non-extension analog): the extension's own runtime
# object, install/update events, self-resource URLs, and the WebExtension
# `browser.*` namespace. Messaging (runtime.sendMessage/onMessage) is NOT here
# — it is a generic IPC technique and lives in communications/ipc/message/.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: chrome-runtime-api
    desc: Uses the Chrome runtime API
    if:
      type: text
      regex: 'chrome\.runtime\.[A-Za-z_]'
  - id: chrome-runtime-on-installed
    desc: Handles browser extension install or update
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '(^|\.)runtime\.onInstalled\.addListener$'
  - id: extension-update-reason-condition
    desc: Tests extension lifecycle update reason
    crit: notable
    conf: 0.95
    if:
      # A conditional AST node prevents comments or documentation examples
      # from satisfying the lifecycle gate.
      type: tree-sitter
      kind: conditional
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.reason\s*={2,3}\s*["'']update["'']'
  - id: chrome-runtime-on-startup
    desc: Registers a browser-startup listener
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '(^|\.)runtime\.onStartup\.addListener$'
  - id: offscreen-document-creation
    desc: Creates an extension offscreen document
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '(^|\.)offscreen\.createDocument$'
  - id: runtime-set-uninstall-url
    desc: Sets a browser extension uninstall URL
    if:
      # The JavaScript symbol extractor does not retain this chained Chrome
      # API call in every module form. Match the parsed call itself so MV3
      # service workers are covered without matching comments or prose.
      type: tree-sitter
      kind: call
      regex: '(chrome\.|browser\.)?runtime\.setUninstallURL\s*\('
  - id: runtime-set-uninstall-named-promotion-url
    desc: Sets uninstall redirect to promotion URL
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      kind: call
      regex: 'runtime\.setUninstallURL\(\s*(PARTNER|AFFILIATE|PROMO)[A-Za-z0-9_]*\b'
  - id: runtime-uninstall-url-delayed-reassertion
    desc: Reasserts uninstall URL after delay
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      kind: call
      regex: 'setTimeout\(\s*\w*[Uu]ninstall[Uu][Rr][Ll]\s*,\s*[1-9]\d{2,5}\s*\)'
  - id: runtime-uninstall-url-multiple-writes
    desc: Writes the extension uninstall URL repeatedly
    crit: notable
    conf: 0.96
    count_min: 2
    if:
      type: symbol
      kind: call
      regex: 'runtime\.setUninstallURL$'
  - id: extension-external-url-literal
    desc: Extension contains external HTTP URL literal
    crit: component
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: 'https?://[A-Za-z0-9.-]+\.[A-Za-z]{2,}([/:?#]|$)'
  - id: browser-search-engines-get
    desc: Reads browser search engines
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(chrome\.|browser\.)?search\.get$'
  - id: safari-extension-api-class
    desc: Safari extension API class reference
    platforms: [macos]
    conf: 0.7
    attack: T1176
    if:
      type: symbol
      regex: '^(SafariExtension|SFSafari(Application|Extension))$'
  - id: chrome-runtime-get-url
    desc: Chrome runtime resource URL
    crit: baseline
    if:
      type: text
      regex: '(chrome|browser)\.runtime\.getURL|runtime\.getURL\('
  - id: chrome-runtime-id
    desc: Chrome runtime extension ID read
    crit: baseline
    if:
      type: text
      regex: '(chrome|browser)\.runtime\.id\b'
  - id: chrome-webnavigation-api
    desc: References the WebExtension webNavigation API
    if:
      type: symbol
      kind: member
      regex: '^(chrome|browser)\.webNavigation(\.[A-Za-z_][A-Za-z0-9_]*|$)'
  - id: chrome-webnavigation-before-navigate
    desc: Observes navigation before it starts
    if:
      type: text
      substr: chrome.webNavigation.onBeforeNavigate
  - id: chrome-history-state-listener
    desc: Registers a history-state navigation listener
    conf: 0.94
    if:
      type: text
      regex: '(chrome|browser)\.webNavigation\.onHistoryStateUpdated\.addListener\b'

  - id: external-url-io-domain
    desc: References an .io-domain HTTP(S) URL
    crit: component
    conf: 0.8
    if:
      type: string_literal
      regex: https?://[a-zA-Z0-9][-a-zA-Z0-9]*\.io/

  - id: chrome-namespace-extra
    desc: Uses extended chrome.* namespace APIs
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: member
      regex: '^chrome\.(alarms|notifications)(\.[A-Za-z_]\w*)*'
  - id: chrome-namespace-core
    desc: Uses core Chrome extension APIs
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: member
      regex: '^chrome\.(runtime|tabs|storage|scripting)(\.[A-Za-z_]\w*)*'
  # The catch-all `chrome.<anything>` member: it fires whenever either named
  # sibling above does, and for every other extension API besides. "This file
  # is extension code" is universal for the type, so it is the baseline fact —
  # the API family (core / extra / storage / scripting) is what differential
  # analysis actually reads. Left notable it reported the same observation a
  # second and third time on every extension, benign or not.
  - id: chrome-namespace
    desc: Uses the Chrome extension API namespace
    crit: baseline
    conf: 0.95
    if:
      type: symbol
      kind: member
      regex: '^chrome\.[A-Za-z_]\w*(\.[A-Za-z_]\w*)*'
  - id: chrome-search-query
    desc: Chrome search API query
    if:
      type: symbol
      kind: call
      regex: '(^|\\.)(chrome\.search\.query|search\.query)$'
  - id: browser-namespace-core
    desc: Uses browser.* namespace core APIs
    conf: 0.95
    if:
      type: symbol
      kind: member
      regex: '^browser\.(runtime|tabs|storage|webRequest)(\.[A-Za-z_]\w*)*'
  - id: browser-namespace-data
    desc: Uses browser.* namespace data APIs
    conf: 0.95
    if:
      type: symbol
      kind: member
      regex: '^browser\.(cookies|history|bookmarks)(\.[A-Za-z_]\w*)*'
  # A per-install pseudonymous identifier persisted in extension storage. This
  # is neutral extension identity plumbing (analytics SDKs, licence checks and
  # telemetry panels all mint one); the intent lives in what gets sent with it,
  # so exfiltration composites reference this rather than owning it.
  - id: extension-install-user-id-key
    desc: Per-install extension user id storage key
    conf: 0.94
    if:
      type: text
      word: extension_user_id
composite_rules:
  - id: uninstall-tracking
    desc: Sets an external .io uninstall URL
    crit: notable
    conf: 0.9
    all:
      - id: runtime-set-uninstall-url
      - id: external-url-io-domain

  - id: browser-namespace
    desc: Uses browser.* namespace (Firefox/WebExtension)
    crit: notable
    conf: 0.95
    any:
      - id: browser-namespace-core
      - id: browser-namespace-data
  - id: extension-install-uninstall-lifecycle-urls
    desc: Configures install and uninstall lifecycle URLs
    crit: notable
    conf: 0.94
    all:
      - id: runtime-set-uninstall-url
      - id: micro-behaviors/browser-extension/tabs::install-https-tab-open
  # A lifecycle callback plus an uninstall landing URL and a network client
  # describes extension telemetry/navigation behavior, not attacker intent.
  - id: extension-lifecycle-network-request
    desc: Extension lifecycle sends a network request
    crit: notable
    conf: 0.9
    all:
      - id: chrome-runtime-on-installed
      - id: runtime-set-uninstall-url
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
