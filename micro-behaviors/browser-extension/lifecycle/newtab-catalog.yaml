defaults:
  platforms: [unix, windows]
composite_rules:
  - id: newtab-install-uninstall-lifecycle-navigation
    desc: New-tab extension navigates on install and uninstall
    crit: notable
    conf: 0.95
    scope: archive
    for: [crx, xpi, zip, chrome-manifest, javascript]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: micro-behaviors/browser-extension/lifecycle::extension-install-uninstall-lifecycle-urls
  - id: newtab-lifecycle-promotion-attribution
    desc: New-tab lifecycle links carry promotion URLs
    crit: notable
    conf: 0.96
    scope: archive
    for: [crx, xpi, zip, javascript]
    all:
      - id: newtab-install-uninstall-lifecycle-navigation
    any:
      - id: micro-behaviors/communications/http/url/query::utm-source-medium-campaign-url
      - id: micro-behaviors/communications/http/url/domain::game-promotion-destination
  - id: extension-lifecycle-external-game-promotion
    desc: Extension promotes game sites on install/uninstall
    crit: notable
    conf: 0.97
    scope: archive
    for: [crx, xpi, zip, javascript]
    all:
      - id: micro-behaviors/communications/http/url/domain::game-promotion-destination
    any:
      - id: micro-behaviors/browser-extension/lifecycle::extension-install-uninstall-lifecycle-urls
      - id: micro-behaviors/browser-extension/tabs::install-https-tab-open
      - id: micro-behaviors/browser-extension/lifecycle::runtime-set-uninstall-url
    unless:
      # Ad lists contain game URLs, while this known blocker opens its own
      # settings page on install; do not infer promotion from that pair.
      - id: well-known/app/browser-extension/content-blocker::adblock-extension-id
  - id: newtab-remote-link-markup
    desc: Remote catalog drives overridden new-tab links
    crit: notable
    conf: 0.93
    scope: archive
    for: [crx, xpi, zip, javascript, chrome-manifest]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
    any:
      # Either sink puts the publisher in control of the click target: markup
      # interpolation, or a direct write to the link attribute.
      - id: micro-behaviors/communications/http/request/json::external-json-near-dynamic-innerhtml
      - id: micro-behaviors/communications/http/request/json::external-json-near-dynamic-link
  - id: newtab-remote-links-lifecycle
    desc: New-tab remote links with lifecycle navigation
    crit: notable
    conf: 0.92
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: newtab-remote-link-markup
    any:
      - id: newtab-install-uninstall-lifecycle-navigation
      - id: extension-lifecycle-external-game-promotion
  - id: newtab-remote-promo-catalog
    desc: New-tab fetches remote extension promo catalog
    crit: notable
    conf: 0.95
    scope: archive
    for: [crx, xpi, zip, javascript, chrome-manifest]
    all:
      - id: metadata/permission/manifest::chrome-newtab-override
      - id: micro-behaviors/communications/http/url/path::remote-extension-catalog-url
      - id: micro-behaviors/communications/http/url/domain::chrome-webstore-detail-url
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/client::http-client
