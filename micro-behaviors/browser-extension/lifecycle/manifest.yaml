defaults:
  platforms: [windows, unix]
  for: [chrome-manifest]
  crit: notable
  conf: 0.7

traits:
  - id: content-script-url-match-pattern
    desc: Manifest defines content-script URL patterns
    if:
      type: value
      path: 'content_scripts[*].matches'
      substr: '://'
  # The scaffold name every extension generator emits, and so the name most
  # extensions -- benign, hostile and test fixture alike -- actually ship. It
  # says only which member of the bundle holds the background logic, which is
  # where an analyst looks next. It was filed in
  # `metadata/package/testing/harness/fixture` as "Electron webRequest fixture
  # background script": the matcher checks neither Electron nor webRequest nor
  # a fixture path, so every extension using the conventional filename was
  # reported as Electron test data. The fixture composite that consumes it pins
  # the identity with that fixture's exact manifest `name`, and now reaches
  # across to here for the filename half.
  - id: background-script-default-filename
    desc: Background script is background.js
    crit: baseline
    conf: 0.9
    if:
      type: value
      path: background.scripts
      exact: background.js

  - id: persistent-background-page
    desc: Persistent extension background page
    if:
      type: value
      path: 'background.persistent'
      exact: 'true'
