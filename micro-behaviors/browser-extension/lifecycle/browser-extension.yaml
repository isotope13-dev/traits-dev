defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: extension-uninstall-uid-url
    desc: Uninstall URL carries extension user id
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'setUninstallURL\s*\([\s\S]{0,180}(uid|user[_-]?id|client[_-]?id)'
  - id: extension-uninstall-feedback-url
    desc: "Registers uninstall feedback URL"
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'setUninstallURL\([^)]{0,120}feedback'
composite_rules:
  - id: extension-client-id-lifecycle-navigation
    desc: Extension tags install and uninstall navigation with client ID
    crit: notable
    conf: 0.95
    near_lines: 10
    all:
      - id: micro-behaviors/communications/http/url/query::extension-campaign-identity-query-fields
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-create-with-url-option
      - id: micro-behaviors/browser-extension/lifecycle::runtime-set-uninstall-url
  - id: extension-uninstall-feedback-context
    desc: "Uninstall feedback URL with no-cors request context"
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/request/privacy::fetch-no-cors-mode
      - id: micro-behaviors/browser-extension/lifecycle::extension-uninstall-feedback-url
    any:
      - id: micro-behaviors/browser-extension/lifecycle::runtime-set-uninstall-url

  # A search-provider takeover that persists an extension identity, reports it
  # during install/update, and registers an uninstall callback is lifecycle
  # tracking attached to browser-setting manipulation. Keep the lifecycle and
  # network gates together so ordinary search providers and standalone analytics
  # do not inherit this verdict.
