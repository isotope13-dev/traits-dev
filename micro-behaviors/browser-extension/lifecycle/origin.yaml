defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: extension-origin-trailing-slash-trim
    desc: Trims trailing slash from runtime resource URL
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'runtime\.getURL\(["''][''"]\)\.slice\(0,\s*-1\)'
  - id: extension-origin-identifier
    desc: References an extensionOrigin identifier
    crit: notable
    conf: 0.85
    if:
      type: text
      word: extensionOrigin
