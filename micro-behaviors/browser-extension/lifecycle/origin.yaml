defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: extension-origin-trailing-slash-trim
    desc: Trims trailing slash from runtime resource URL
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'runtime\.getURL\(["''][''"]\)\.slice\(0,\s*-1\)'
  - id: extension-origin-identifier
    desc: References an extensionOrigin identifier
    crit: notable
    conf: 0.85
    if:
      type: text
      word: extensionOrigin
  # A content script that wants to talk to its own extension page (an
  # offscreen-style bridge, a sandboxed player) loads it into a frame by
  # setting the frame's src to a runtime.getURL() resource. The document is
  # packaged inside the extension and can only be one of its own files.
  - id: element-src-extension-packaged-page
    desc: Element src is a packaged extension page
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\.src\s*=\s*(chrome|browser)\.runtime\.getURL\s*\(\s*["''`][^"''`]{1,80}\.html'
