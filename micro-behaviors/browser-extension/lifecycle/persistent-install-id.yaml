# Read-or-create of a random per-install identifier under a client/user id
# key. Once stored it labels every later request from this browser.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: stored-random-client-id
    desc: Stores a random persistent client ID
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '["''](client|user|install)Id["'']\)[\s\S]{0,60}\brandomUUID\(\)'
