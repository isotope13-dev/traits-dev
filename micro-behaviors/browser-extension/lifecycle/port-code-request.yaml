# Background-page side of a runtime port protocol where content scripts ask
# for "code" by action name and receive a stored blob back.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: runtime-port-getcode-action
    desc: Port listener answers a getCode action
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '"getCode"\s*===?\s*\w+\.action|\w+\.action\s*===?\s*"getCode"'
  - id: remote-code-update-url-field
    desc: Field names a remote code update URL
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\bcodeUpdateUrl\s*:\s*"https?://'
