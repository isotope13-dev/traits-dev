defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: dsers-background-cookie-function-dispatch
    desc: Dispatches named extension cookie functions
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule dsers_background_cookie_function_dispatch {
          strings:
            $call = "INTERNAL_FUNCTION_CALL"
            $name = "funcName:t,params:r"
            $dispatch = "a=$T[t]"
            $invoke = "n(await a(...r))"
            $cookie = "chromeCookiesGetAll:()=>zv"
            $read = "function zv(e){return chrome.cookies.getAll(e)}"
          condition:
            all of them
        }
