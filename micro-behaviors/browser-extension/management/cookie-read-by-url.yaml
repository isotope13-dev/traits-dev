defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component
  conf: 0.9

traits:
  - id: cookies-getall-url-scoped
    desc: Reads browser cookies scoped to a URL
    if:
      type: text
      regex: 'chrome\.cookies\.getAll\(\s*\{\s*url\s*:'
      exclude_comments: true
