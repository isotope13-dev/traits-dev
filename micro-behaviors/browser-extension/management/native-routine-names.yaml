# A routine name suggests extension handling, not wallet theft or file copying.
# Keep the Itanium length-prefix boundary; parameters may follow without a separator.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
traits:
  - id: grab-extensions-routine-name
    desc: Routine named for grabbing plugins or extensions
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(^|[^a-z])grab_?(wallet_?|browser_?)?(plugins|extensions)'
