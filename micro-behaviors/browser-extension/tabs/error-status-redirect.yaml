# A webRequest/webNavigation handler that inspects the response status code
# and then rewrites the failing tab's URL: the browser's own error page is
# replaced with a page the extension chooses.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: status-code-tab-redirect
    desc: Redirects tab after HTTP status check
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'statusCode[\s\S]{0,400}\btabs\.update\(\s*[\w$]+\.tabId\s*,\s*\{\s*url\s*:'
