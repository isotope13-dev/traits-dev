defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: response-redirect-code-tab-update
    desc: Redirect-code check precedes a tab URL update
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.indexOf\(\s*["'']302["'']\s*\)[\s\S]{0,500}\btabs\.update\s*\([^;]{0,120}\burl\s*:'

# Network reporting and response navigation are capabilities; these
# observations alone do not establish unauthorized collection or redirection.
composite_rules:
  - id: tab-reporting-with-redirect-response-navigation
    desc: Tab reporting with response-triggered redirect
    crit: notable
    conf: 0.92
    near_bytes: 8192
    all:
      - id: micro-behaviors/browser-extension/tabs::extension-tab-events-transformed-http-report
      - id: micro-behaviors/browser-extension/tabs::response-redirect-code-tab-update
      - id: micro-behaviors/communications/http/client/response-body::fetch-response-text-in-status-branch
