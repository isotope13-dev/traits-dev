# A fetch response's `url` field is opened in a new tab: the server, not the
# extension code, decides which page the user is shown.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: fetch-response-url-opens-tab
    desc: Opens tab at fetch-response URL
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\.then\([^;]{0,80}\w\.url\s*&&\s*chrome\.tabs\.create\(\s*\{\s*url:\s*\w+\.url\b'
