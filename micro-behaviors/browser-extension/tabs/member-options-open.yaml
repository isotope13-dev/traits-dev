# Opening a tab or window whose whole options object is one property of
# another value -- typically a parsed server reply -- lets that value pick
# the URL, size, position and focus of the new surface.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: tab-or-window-create-from-member
    desc: Opens tab or window from object member
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\b(tabs|windows)\.create\(\s*[\w$]+\??\.[\w$]+\s*\)'
