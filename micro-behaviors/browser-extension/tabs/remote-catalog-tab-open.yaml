# An extension that fetches a remote catalog or offer list from a raw GitHub
# file and opens the URLs it lists in new tabs. The remote file, not the
# installed code, chooses the destinations, so the list can change after review.
# Both legs live in the same file: the fetch and the tab-open call it feeds.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.85

composite_rules:
  - id: tab-open-remote-catalog-url
    desc: Opens tabs at URLs from a remote catalog file
    all:
      - id: micro-behaviors/browser-extension/tabs::tab-create-url-field
      - id: micro-behaviors/communications/url/external/github::raw-githubusercontent-any
