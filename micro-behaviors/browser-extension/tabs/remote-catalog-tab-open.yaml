# These file-local observations do not establish data flow. Ad blockers can
# carry raw GitHub filter-list URLs and independently open their options or
# update page. Keep both capabilities visible without inferring a remote
# catalog, a fetch, or server-selected navigation from their co-occurrence.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

composite_rules:
  - id: tab-open-remote-catalog-url
    desc: Tab creation and raw GitHub URL co-occur
    all:
      - id: micro-behaviors/browser-extension/tabs::tab-create-url-field
      - id: micro-behaviors/communications/url/external/github::raw-githubusercontent-any
