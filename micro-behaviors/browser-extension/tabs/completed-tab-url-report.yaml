# A tab-load completion handler that builds an object pairing the tab URL
# with a persistent per-install identifier: the record of one page visit,
# attributable to one browser.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: completed-tab-url-with-install-id
    desc: Pairs completed tab URL with install ID
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '["'']complete["''][\s\S]{0,100}\{\s*url\s*:\s*[\w$.]+\s*,\s*(userId|uid|uuid|clientId)\s*:'
