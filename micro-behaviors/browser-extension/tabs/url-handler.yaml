defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: tabs-get-url-reading-callback
    desc: Tab lookup callback references a URL field
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression
            object: (member_expression object: (identifier) @browser property: (property_identifier) @tabs)
            property: (property_identifier) @getter)
          arguments: (arguments (_) (function_expression body: (statement_block) @body)))
          (#match? @browser "^(chrome|browser)$")
          (#eq? @tabs "tabs")
          (#eq? @getter "get")
          (#match? @body "\\.url\\b"))

# Network reporting and response navigation are capabilities; these
# observations alone do not establish unauthorized collection or redirection.
composite_rules:
  - id: extension-tab-events-transformed-http-report
    desc: Tab URL events with transformed HTTP reporting
    crit: notable
    conf: 0.95
    near_bytes: 8192
    all:
      - id: micro-behaviors/browser-extension/tabs::tabs-get-url-reading-callback
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-on-activated
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-on-updated
      - id: micro-behaviors/communications/http/query::fetch-query-transformed-function-input
