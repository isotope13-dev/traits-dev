defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: dsers-page-message-background-bridge
    desc: Page messages reach extension background bridge
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule dsers_page_message_background_bridge {
          strings:
            $listen = "window.addEventListener(\"message\""
            $app = "e.data.appId!==this.appId"
            $tab = "e.data.tabId!==t?.id"
            $request = "FROM_INJECT_TO_BACKGROUND_REQUEST"
            $forward = "this.sendToBackground(n,e.data?.timeout)"
            $reply = "FROM_INJECT_TO_BACKGROUND_RESPONSE"
          condition:
            all of them
        }
