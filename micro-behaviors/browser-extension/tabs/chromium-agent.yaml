# Chromium browser-agent command surfaces. These are not ordinary WebExtension
# APIs: complete command sequences in extension-delivered JavaScript indicate
# direct interaction with a privileged browser assistant or agent extension.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: glic-create-tab-command
    desc: Sends a GLIC browser tab creation command
    if:
      type: literal
      kind: string
      exact: glicBrowserCreateTab

  - id: glic-context-permission-command
    desc: Sends a GLIC tab context permission command
    if:
      type: literal
      kind: string
      exact: glicBrowserSetTabContextPermissionState

  - id: glic-focused-tab-context-command
    desc: Requests focused-tab context through GLIC
    if:
      type: literal
      kind: string
      exact: glicBrowserGetContextFromFocusedTab

  - id: extension-agent-start-task
    desc: Names an agent-start task
    if:
      type: literal
      kind: string
      exact: START_AGENT

  - id: extension-agent-tool-task
    desc: Names an agent-tool task
    if:
      type: literal
      kind: string
      exact: CALL_TOOL

  - id: edge-agent-tools-disable-call
    desc: Disables Edge agent tools
    if:
      type: text
      regex: 'chrome\.copilotLabPrivate\.enableEdgeTools\s*\(\s*false\s*\)'

  - id: edge-agent-tools-enable-call
    desc: Enables Edge agent tools
    if:
      type: text
      regex: 'chrome\.copilotLabPrivate\.enableEdgeTools\s*\(\s*true\s*\)'

  - id: edge-copilot-query-call
    desc: Sends an Edge Copilot query
    if:
      type: symbol
      kind: call
      exact: chrome.edgeMarketingPagePrivate.sendCopilotQuery

composite_rules:
  - id: glic-privileged-tab-context-sequence
    desc: JavaScript directly drives privileged GLIC tab context APIs
    crit: suspicious
    conf: 0.99
    all:
      - id: glic-create-tab-command
      - id: glic-context-permission-command
      - id: glic-focused-tab-context-command

  - id: cross-extension-agent-task
    desc: Sends an agent-control task directly to another extension
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-fixed-extension-message
    any:
      - id: extension-agent-start-task
      - id: extension-agent-tool-task

  - id: edge-agent-tools-race-sequence
    desc: Edge agent query with tool-mode toggles
    crit: suspicious
    conf: 0.995
    all:
      - id: edge-agent-tools-disable-call
      - id: edge-copilot-query-call
      - id: edge-agent-tools-enable-call
    near_bytes: 512
