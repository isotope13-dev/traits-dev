# Neutral browser observation primitive. Its source, storage, and transfer
# context are assembled independently by collection/export consumers.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1041
  crit: notable
  conf: 0.9

traits:
  - id: js-tabs-updated-host-read
    desc: "Tab update listener extracts URL host"
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'onUpdated\.addListener.{0,500}new URL\(.{0,80}\.url\)\.hostname'
  - id: js-tabs-activated-host-read
    desc: "Tab activation listener extracts URL host"
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'onActivated\.addListener.{0,500}new URL\(.{0,80}\.url\)\.hostname'
composite_rules:
  - id: extension-navigation-observation-interfaces
    desc: "Browser visit or navigation observation interfaces"
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/process/hook/webextension::chrome-webrequest-pre-request
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-on-updated
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-on-activated
      - id: micro-behaviors/browser-extension/lifecycle::chrome-webnavigation-api
      - id: micro-behaviors/browser-extension/lifecycle::chrome-history-state-listener

  # Any local staging of collected data before batched upload.
