defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: fastn-page-message-tool-bridge
    desc: Page messages invoke browser agent tools
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule fastn_page_message_tool_bridge {
          strings:
            $listen = "window.addEventListener(\"message\""
            $origin = "event.origin !== window.location.origin"
            $action = "data.type === \"fastn_tool_call\""
            $send = "type: \"tool_call_from_page\", tool: data.tool"
            $result = "type: \"fastn_tool_result\""
          condition:
            all of them
        }
