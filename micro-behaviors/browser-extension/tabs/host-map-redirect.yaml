# Looking up the navigating hostname in a lookup table and sending the tab
# to the URL stored under it. Whoever fills the table decides where each
# site the user types actually goes.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: hostname-keyed-map-tab-redirect
    desc: Redirects tab to hostname-keyed URL
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\[\s*host\w{0,16}\s*\];?[\s\S]{0,160}\btabs\.update\(\s*[\w$.]+\s*,\s*\{\s*url\s*:'
