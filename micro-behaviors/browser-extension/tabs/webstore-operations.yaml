defaults:
  platforms: [windows, unix]
composite_rules:
  - id: webstore-url-near-tab-operation
    desc: Tab API operation near a Chrome Web Store URL
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    near_bytes: 120
    all:
    - id: micro-behaviors/communications/http/url/domain::chrome-webstore-listing-url
    any:
    - id: micro-behaviors/browser-extension/tabs::chrome-tabs-query
    - id: micro-behaviors/browser-extension/tabs::chrome-tabs-remove
  - id: install-listener-webstore-tab-operation-cooccurrence
    desc: Install listener and Web Store tab operation co-occur
    crit: notable
    conf: 0.98
    for: [crx, xpi, zip, javascript, typescript]
    scope: archive
    all:
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
      - id: webstore-url-near-tab-operation
      - id: micro-behaviors/browser-extension/tabs::chrome-tabs-api
