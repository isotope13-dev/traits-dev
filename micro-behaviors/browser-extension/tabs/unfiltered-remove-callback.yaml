defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  - id: unfiltered-query-remove-callback
    desc: Unfiltered tab query callback calls remove
    if:
      type: tree-sitter
      kind: call
      regex: '\.tabs\.query\(\s*\{\s*\}\s*,[\s\S]{0,240}\.tabs\.remove\('
