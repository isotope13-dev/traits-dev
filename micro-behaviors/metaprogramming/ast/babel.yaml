defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: babel-parse-call
    desc: Calls Babel source-to-AST parser
    if:
      type: symbol
      kind: call
      regex: '^babel(__default)?\.(default\.)?parse(Sync)?$'
  - id: babel-traverse-call
    desc: Calls Babel AST traversal API
    if:
      type: symbol
      kind: call
      regex: '^babel(__default)?\.(default\.)?traverse$'
