# Expression trees represent code, including LINQ-to-Objects lambdas; they
# do not establish database access. Preserve the former matcher scopes.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [pe, csharp]
traits:
  - id: system-linq-expressions
    desc: System.Linq.Expressions namespace reference
    conf: 0.6
    if:
      type: text
      substr: System.Linq.Expressions
  - id: expression-visitor
    desc: ExpressionVisitor class reference
    conf: 0.6
    if:
      type: text
      substr: ExpressionVisitor
  - id: lambda-expression
    desc: LambdaExpression class reference
    conf: 0.6
    if:
      type: text
      substr: LambdaExpression
  - id: expression-lambda
    desc: Expression.Lambda API reference
    conf: 0.6
    if:
      type: text
      substr: Expression.Lambda
composite_rules:
  - id: linq-expressions
    desc: LINQ expression-tree API reference
    conf: 0.75
    any:
      - id: system-linq-expressions
      - id: expression-visitor
      - id: lambda-expression
