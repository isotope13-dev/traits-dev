defaults:
  platforms: [windows, unix]
  for: [rust]
  crit: notable
  conf: 0.9

traits:
  # Tree-sitter syntax-tree field lookup (Node::child_by_field_name). The
  # program inspects a parsed tree's structure; it does not evaluate the
  # inspected program. A parsed method call distinguishes real inspection
  # from a quoted example or a bare `tree_sitter::Node` import; the field
  # name may be literal or computed.
  - id: rust-ast-child-field-lookup
    desc: Looks up syntax-tree children by field
    if:
      type: symbol
      kind: call
      regex: '\.child_by_field_name$'
