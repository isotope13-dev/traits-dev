defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-ast-parse
    desc: Parses Python source into an AST
    if:
      type: symbol
      kind: call
      exact: ast.parse

  - id: python-ast-walk
    desc: Walks nodes of a Python AST
    if:
      type: symbol
      kind: call
      exact: ast.walk
