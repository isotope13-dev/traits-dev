defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-ast-parse
    desc: Parses Python source into an AST
    if:
      type: symbol
      kind: call
      exact: ast.parse

  - id: python-ast-walk
    desc: Walks nodes of a Python AST
    if:
      type: symbol
      kind: call
      exact: ast.walk

  - id: python-ast-fix-missing-locations
    desc: Fixes locations on rewritten Python AST
    if:
      type: symbol
      kind: call
      exact: ast.fix_missing_locations

  - id: python-ast-visitor-generic-visit
    desc: Recurses an AST visitor with generic_visit
    if:
      type: text
      regex: '\bself\.generic_visit\s*\('

  - id: python-ast-pycf-flag
    desc: Compiles Python source with PyCF_ONLY_AST
    for: [python, pyc]
    if:
      type: text
      word: PyCF_ONLY_AST

  - id: ast-parse-caller-code-exec
    desc: Parses caller code using the exec grammar
    conf: 0.9
    if:
      type: text
      substr: 'ast.parse(code or "", mode="exec")'

  - id: caller-code-ast-exec
    desc: Parses caller code using the exec grammar
    conf: 0.97
    if:
      type: text
      regex: 'ast\.parse\(\s*code\b[\s\S]{0,120}mode\s*=\s*["'']exec["'']\s*\)'
