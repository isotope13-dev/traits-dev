# Editing a code module is a source-generation capability. Persistence needs
# a template target and attack context in the consuming objective.
defaults:
  platforms: [windows]
  for: [vbs, text, oledoc, ooxml, html]
  crit: notable
  conf: 0.93
traits:
  - id: vba-codemodule-insert-lines
    desc: Inserts lines into VBA code module
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\.InsertLines\s+\w+'

  - id: vba-codemodule-add-source
    desc: Adds source to VBA code module
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\.codemodule\.AddFrom(File|String)\b'

  - id: vba-replace-comment-with-user-name
    desc: Replaces source comment with application user
    for: [vbs, text]
    conf: 0.95
    if:
      type: text
      regex: '(?i)\.replaceline\s+\w+,\s*"''"\s*&\s*Application\.UserName'

