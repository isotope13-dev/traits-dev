traits:
- id: for-loop-iteration-1
  desc: Quoted source contains a target-named loop
  conf: 0.6
  if:
    type: string_literal
    regex: for\s+\w+\s+in\s+(ip_list|targets|hosts)
- id: for-loop-iteration-2
  desc: Quoted source contains a target-named loop
  conf: 0.6
  if:
    type: string_literal
    regex: for\s+\w+\s+in\s+(ips|addr)
composite_rules:
- id: for-loop-iteration
  desc: Quoted source contains a target-named loop
  conf: 0.4
  any:
  - id: micro-behaviors/metaprogramming/generation::for-loop-iteration-1
  - id: micro-behaviors/metaprogramming/generation::for-loop-iteration-2
defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
