traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  id: embedded-eval-variable-source
  desc: String contains eval with variable argument
  crit: notable
  conf: 0.9
  if:
    type: string_literal
    regex: eval\s*\(\s*[a-zA-Z_$][a-zA-Z0-9_$]*\s*\)
  not:
    # ast-grep/semgrep audit rules embed metavariable queries — `eval($CODE)`,
    # all-caps `$VARS` are pattern placeholders bound by the scanner, not
    # identifiers in generated source (0xray's ast-code-parser audit table).
    - regex: eval\s*\(\s*\$[A-Z][A-Z0-9_]*\s*\)
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/build/
