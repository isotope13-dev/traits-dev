defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
traits:
  - id: powershell-dynamic-assembly-module
    desc: PowerShell defines a dynamic assembly and module
    conf: 0.94
    if:
      type: text
      regex: 'DefineDynamicAssembly[\s\S]{0,200}DefineDynamicModule'

  - id: powershell-define-pinvoke-method
    desc: Emits dynamic P/Invoke method
    conf: 0.95
    if:
      type: text
      regex: '(?i)\.DefinePInvokeMethod\s*\('
