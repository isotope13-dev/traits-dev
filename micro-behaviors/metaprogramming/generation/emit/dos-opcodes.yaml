# DOS runtimes that construct instruction streams in memory. The component
# markers identify emitted opcodes and calculated branch fixups; the objective
# composite separately combines these with entropy-source evidence.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536

traits:
  - id: dos-emit-call-opcode
    desc: DOS stores CALL opcode byte
    crit: component
    if:
      type: hex
      pattern: "B0 E8 AA"

  - id: dos-emit-ret-opcode
    desc: DOS stores near/far return opcode
    crit: component
    if:
      type: hex
      pattern: "B0 (C3|CB) AA"

  - id: dos-emit-int-opcode
    desc: DOS stores interrupt opcode byte
    crit: component
    if:
      type: hex
      pattern: "B0 CD AA"

  # Some engines construct a near CALL/JMP opcode, derive its displacement
  # from the output cursor, and store that operand after the opcode.
  - id: dos-emit-relative-branch-fixup
    desc: DOS emits near branch and computed displacement
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: "B0 (E8|E9) AA 8D 45 02 F7 D8 (8B DF|89 FB) AB"

  - id: dos-emit-saved-target-branch
    desc: DOS emits branch to saved target
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: "B0 (E8|E9) AA A1 ?? ?? (2B C7|29 F8) (48 48|2C 02) AB"

  - id: dos-emit-parameterized-decryptor-loop
    desc: DOS emits parameterized decryptor loop
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: "(0C B8|80 C8 B8) AA 89 3E ?? ?? AB [16-80] B0 (40|48) (0A 06|0A 26) ?? ?? AA [0-16] B8 81 (F8|FA) (0A 26|0A 06) ?? ?? AB 89 3E ?? ?? AB [0-16] B0 (74|75) AA 89 3E ?? ?? AA"

  - id: dos-emit-x87-escape-instruction
    desc: DOS emits random x87 escape instruction
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: "B0 (D8|D9|DA|DB|DC|DD|DE|DF) AA (E4|E5) 40 [2-6] 80 E4 38 [12-22] AA (E4|E5) 40 AB C3 0C C0 AA C3"

  - id: dos-emit-random-alu-junk-instruction
    desc: DOS emits random ALU junk instruction
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: "24 (02|03) (04|0C) 80 AA E8 ?? ?? AA (E4|E5) 40 AB 26 80 7D FC 81 74 01 4F C3"

  - id: dos-self-patching-cipher-loop
    desc: DOS patches payload encryption loop opcode
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: "(E4|E5) 40 24 02 (04|0C) 80 AA [4-10] (AD|8B 04) 88 26 ?? ?? (0A 06|08 06) ?? ?? AA [64-130] 51 AC (02|2A|32|5A) C2 AA E2 FA 59"

  # Emits CS: segment override (2Eh), 8/16-bit ALU opcode (80h/81h), XOR/SUB/ADD
  # ModR/M with [SI]/[DI] indexing (04h/05h), and optional 16-bit displacement.
  - id: dos-emit-cs-alu-decryptor-body
    desc: Emits CS-prefixed ALU decryptor instruction
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule dos_emit_cs_alu_decryptor_body {
          meta:
            filetypes = "dos_com,data"
          strings:
            $emit = {
              B0 2E AA
              B0 81 [0-8] 24 FE AA
              [0-16]
              B0 30 [0-10] B0 28 [0-8] ( 2A C0 | 32 C0 )
              [0-10]
              0C 04 [0-4] 0C 05 AA
            }
          condition:
            $emit
        }

  # Emits a backward loop branch (LOOP E2h or DEC CX 49h + JNZ 75h / JG 7Fh),
  # computes the negative 8-bit displacement, and scans backward (STD; REPNE
  # SCASB for FFh) to patch the decryptor start offset placeholder.
  - id: dos-emit-backward-loop-branch-fixup
    desc: Emits backward loop branch with fixup
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule dos_emit_backward_loop_branch_fixup {
          meta:
            filetypes = "dos_com,data"
          strings:
            $fixup = {
              B0 E2 [0-8]
              2B DA B7 FF 2A FB 86 C7 AA
              [2-12]
              B0 49 AA [8-24] B0 75 [2-6] B0 7F
              [10-28]
              FD B0 FF [0-6] F2 AE 80 3D FF 75 F9 FC
            }
          condition:
            $fixup
        }

composite_rules:
  - id: dos-instruction-opcode-emitter
    desc: DOS emits multiple instruction opcodes
    crit: notable
    conf: 0.85
    any:
      - id: dos-emit-call-opcode
      - id: metadata/binary/code/control-transfer::dos-store-e9-byte
      - id: dos-emit-ret-opcode
      - id: dos-emit-int-opcode
      - id: dos-emit-relative-branch-fixup
      - id: dos-emit-saved-target-branch
      - id: dos-emit-parameterized-decryptor-loop
      - id: dos-emit-x87-escape-instruction
      - id: dos-emit-random-alu-junk-instruction
      - id: dos-emit-cs-alu-decryptor-body
      - id: dos-emit-backward-loop-branch-fixup
    needs: 3
