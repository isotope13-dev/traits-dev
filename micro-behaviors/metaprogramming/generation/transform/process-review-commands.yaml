defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.96

traits:
  - id: bulk-test-skip-source-edit
    desc: Stream edit inserts test skip markers
    if:
      type: text
      regex: '(?i)\b(sed|perl)\b[^\n]{0,180}(describe\.skip|pytest\.mark\.skip|#\[ignore\])'

  - id: bulk-linter-suppression-edit
    desc: Stream edit inserts linter suppressions
    if:
      type: text
      regex: '(?i)\b(sed|perl)\b[^\n]{0,180}(@ts-nocheck|# noqa|eslint-disable-next-line)'
