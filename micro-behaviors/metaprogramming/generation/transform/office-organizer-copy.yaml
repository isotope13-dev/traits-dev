# Application.OrganizerCopy with the project-items object type
# (wdOrganizerObjectProjectItems, numeric 3) copies a whole VBA module from one
# Office file into another. Template tooling uses it to install modules; macro
# viruses use it to copy themselves. The copy alone states neither purpose.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  crit: notable
  conf: 0.93
  attack: T1137

traits:
  - id: vba-organizer-copy-project-item
    desc: Copies a VBA module between Office files
    if:
      type: text
      regex: '(?ism)\bOrganizerCopy\b.{0,250}?(ObjectProjectItems\b|"\s*,\s*3\s*$|Object\s*:=\s*3\b)'
