# Rebinding `call` is how Rack-style handlers are wrapped at runtime. Both the
# alias and the redefinition are reached through `send` here, which is how
# code patches a class it does not own; ordinary middleware subclasses instead.
defaults:
  for: [ruby]
  platforms: [unix, windows]
  crit: notable
  conf: 0.9

traits:
  - id: ruby-send-alias-call-method
    desc: Aliases a call method through send
    if:
      type: text
      exclude_comments: true
      regex: '\bsend\s*\(?\s*:alias_method\s*,\s*:\w{1,40}\s*,\s*:call\b'
  - id: ruby-send-define-call-method
    desc: Redefines a call method through send
    if:
      type: text
      exclude_comments: true
      regex: '\bsend\s*\(?\s*:define_method\s*,\s*:call\b'
