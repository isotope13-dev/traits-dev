defaults:
  platforms: [windows]
  for: [vbs, text, oledoc, ooxml, html]
  crit: notable
  conf: 0.93
traits:
  - id: vba-codemodule-insert-lines
    desc: Inserts lines into VBA code module
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\.InsertLines\s+\w+'

  - id: vba-codemodule-delete-lines
    desc: Deletes lines from a VBA module
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\.DeleteLines\s+\w+'

  - id: vba-codemodule-add-source
    desc: Adds source to VBA code module
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\.codemodule\.AddFrom(File|String)\b'

  - id: vba-replace-comment-with-user-name
    desc: Replaces source comment with application user
    for: [vbs, text]
    conf: 0.95
    if:
      type: text
      regex: '(?i)\.replaceline\s+\w+,\s*"''"\s*&\s*Application\.UserName'


  # Inside `With ...CodeModule` the call carries no CodeModule prefix, so
  # vba-codemodule-add-source (which needs `.codemodule.AddFromString`) misses
  # it. Anchoring the dot to whitespace keeps it to the With-block form.
  - id: vba-with-block-add-source
    desc: With-block adds source to a VBA module
    if:
      type: text
      regex: '(?i)(^|\s)\.AddFrom(File|String)\s+\w+'

  - id: vba-replaceline-literal-index
    desc: Rewrites a VBA module line by index
    if:
      type: text
      regex: '(?i)(^|\s)\.ReplaceLine\s+\w+\s*,\s*\S'
