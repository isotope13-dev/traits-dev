# .NET source rewriting another assembly's method bodies with an IL library
# (dnlib, Mono.Cecil): empty a method's instruction list and re-add
# instructions built with Instruction.Create(OpCodes.*). Weavers, patchers
# and obfuscators all do this; it states the rewrite, not its purpose.
defaults:
  platforms: [windows]
  for: [vbs, csharp]
  crit: notable

traits:
  - id: dotnet-il-method-body-rebuild
    desc: Clears and rebuilds IL method bodies
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.Body\.Instructions\.Clear\(\)[\s\S]{0,400}Instruction\.Create\(\s*OpCodes\.'
