defaults:
  platforms: [unix, windows]
  for: [elf, pe, shell, python, c, scripts, binaries]
traits:
  - id: flex-command
    desc: flex lexer-generator command text
    for: [shell, batch, powershell, dockerfile, github-actions]
    crit: notable
    if:
      type: text
      regex: '\bflex\s+(-[A-Za-z][A-Za-z-]*|[^ \t\r\n]{1,40}\.l(ex)?)([ \t\r\n]|$)'
