defaults:
  platforms: [windows]
  for: [vbs, asp, html, javascript]
  crit: notable

traits:
  # DOS debug.exe builds .COM binaries in a single 64 KB segment starting at
  # PSP offset 0x0100, capping input size at 0xFFFF - 0x0100 = 65,279 bytes.
  - id: debug-com-segment-size-limit
    desc: Checks 64 KB debug.exe segment limit
    conf: 0.93
    if:
      type: text
      regex: '\.Size\s*>=?\s*652[78]\d\b'
      case_insensitive: true

  - id: vbs-hex-psp-offset-calc
    desc: Computes hex offset from 0x100 base
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '\bHex\s*\([^\r\n]{0,40}(\b256\b|&H0*100\b)'
      case_insensitive: true

  - id: vbs-write-rcx-directive
    desc: Emits debug.exe rcx byte-count directive
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\.Write(Line)?\b[^\r\n]{0,48}["'']rcx["'']'
      case_insensitive: true

composite_rules:
  # Dual-use converters (exe2bat/exe2debug) also synthesize debug.exe hex
  # scripts; keep this generator capability at notable so benign converters
  # are not convicted without covert dropper delivery and execution.
  - id: vbs-debug-hex-script-generator
    desc: Generates debug.exe hex and rcx script
    crit: notable
    conf: 0.96
    near_lines: 35
    all:
      - id: vbs-hex-psp-offset-calc
      - id: vbs-write-rcx-directive
