defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.86

traits:
  - id: go-format-source
    desc: Formats generated Go source
    conf: 0.88
    if:
      type: symbol
      exact: format.Source

composite_rules:
  - id: go-source-code-generator
    desc: Generates and writes Go source code
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/metaprogramming/ast::go-source-parser
      - id: micro-behaviors/metaprogramming/generation/source::go-format-source
    any:
      - id: micro-behaviors/fs/write/file/full/call::go-os-writefile
      - id: micro-behaviors/fs/write/file/reference::ioutil-write-file
