defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.96
traits:
  - id: python-returned-exec-template
    desc: Returns interpolated Python execution source
    if:
      type: tree-sitter
      query: |
        (return_statement (string
          (string_content) @body
          (interpolation)) @template
          (#match? @body "exec\\("))
    unless:
      - type: symbol
        kind: call
        exact: exec
      - type: symbol
        kind: call
        exact: eval
      - type: symbol
        kind: call
        regex: '(^|\.)(b64decode|a85decode|b85decode)$'
      - type: symbol
        kind: call
        regex: '(^|\.)(fromhex|loads|decompress)$'
      - type: symbol
        kind: call
        exact: codecs.decode
composite_rules:
  - id: python-execution-template-generator
    desc: Generates and parses execution templates
    crit: exception
    all:
      - id: micro-behaviors/metaprogramming/generation/source::python-returned-exec-template
      - id: micro-behaviors/metaprogramming/ast::python-ast-parse

  - id: python-exec-source-context
    desc: Python execution source or bootstrap context
    crit: exception
    any:
      - id: well-known/lib/development/versioneer::source-file
      - id: micro-behaviors/metaprogramming/generation/source::python-execution-template-generator
