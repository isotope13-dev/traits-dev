defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: javascript-tcp-shell-template
    desc: Interpolates a TCP shell command template
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((template_string (string_fragment) @command (template_substitution)) @template
        (#match? @command "(/bin/)?(ba)?sh[[:space:]]+-i.*dev/tcp/"))
