defaults:
  platforms: [windows, unix]
  for: [php]

traits:
  # Matches function-like text in the search argument, not infection intent.
  # Code generators also do this: Symfony escapes literal closure text before
  # rewriting generated closures to capture their container argument.
  - id: php-function-text-replace
    desc: Replaces text matching PHP function syntax
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'str_i?replace\s*\(\s*[''"]\s*function\s+[^''"]{1,80}[''"]\s*,\s*[^,\r\n]{1,200}'
    not:
      - regex: ',\s*[''"]\s*[''"]'
    unless:
      - id: metadata/package/testing/harness/unit/
      - id: metadata/build/
