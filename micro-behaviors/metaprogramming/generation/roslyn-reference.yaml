# Roslyn scripting and compilation API names identify runtime compilation support.
defaults:
  platforms: [unix, windows]
  for: [pe, dll, csharp]
traits:
  - id: roslyn-csharp-script-api-reference
    desc: Roslyn CSharp scripting API name reference
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\bCSharp(Script|Compilation)\b'
