defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable

traits:
  # Ruby permits a zero-argument method invocation without parentheses. The
  # symbol producer currently exposes that spelling as an identifier, so use
  # a statement-shaped text match. Generating a stager does not execute it.
  - id: ruby-generate-cmdstager-statement
    desc: Ruby command-stager generation statement
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*generate_cmdstager\s*(\([^\r\n]{0,120}\))?\s*$'
