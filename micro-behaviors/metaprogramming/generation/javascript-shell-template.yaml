defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: javascript-parameterized-shell-template
    desc: Arrow returns interpolated shell command
    if:
      type: tree-sitter
      language: javascript
      query: |
        (arrow_function
          parameters: (formal_parameters (identifier) (identifier))
          body: (template_string (string_fragment) @command
            (template_substitution)) @template
          (#match? @command "^(bash|sh|perl|python3?) ")) @builder
    # Limit reference-only context to source without an active execution or
    # network sink. Match the host AST, not the embedded command's AST.
    unless:
      - type: tree-sitter
        kind: call
        regex: '^(new\s+)?((window|globalThis)\.)?(fetch|XMLHttpRequest|WebSocket)\s*\('
      - type: tree-sitter
        kind: call
        regex: '^(new\s+)?((window|globalThis)\.)?(eval|Function)\s*\('
      - type: tree-sitter
        language: javascript
        query: |
          (call_expression
            function: [
              (identifier) @target
              (member_expression property: (property_identifier) @target)
            ]
            (#match? @target "^(exec|execFile|spawn)(Sync)?$")) @execution
      - type: tree-sitter
        kind: call
        regex: '^[\w$.]+\.(executeScript|sendNativeMessage|connectNative)\s*\('
