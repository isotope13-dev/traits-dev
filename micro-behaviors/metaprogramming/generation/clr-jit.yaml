# Neutral observations and discriminating identities.
composite_rules:
- platforms:
  - windows
  - unix
  for:
  - pe
  - dll
  id: dotnet-jit-runtime-references
  desc: .NET assembly references CLR JIT runtime
  crit: notable
  conf: 0.9
  all:
