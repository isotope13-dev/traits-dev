defaults:
  platforms: [unix, windows]
  for: [rust, binaries]
  crit: notable
  conf: 0.95

traits:
  - id: rust-include-source-text
    desc: Rust macro embeds Rust source text
    if:
      type: text
      regex: 'include_str!\s*\(\s*"[^"\r\n]{1,100}\.rs"\s*\)'

  - id: rust-source-morph-call
    desc: Invokes Rust source-morphing API
    for: [rust]
    if:
      type: symbol
      kind: call
      regex: '^(mimicore|metacore)::morph$'

  - id: rust-embedded-source-morph-call
    desc: Embedded Rust source invokes morphing API
    for: [binaries]
    if:
      type: text
      regex: '\b(mimicore|metacore)::morph\s*\('

composite_rules:
  - id: rust-source-morph-api
    desc: Rust source invokes source-morphing API
    any:
      - id: rust-source-morph-call
      - id: rust-embedded-source-morph-call
