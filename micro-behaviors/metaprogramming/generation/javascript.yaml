# Runtime compilation through Function, AsyncFunction, and related JavaScript
# constructors. Rules that require invocation live under eval/constructed.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:

  # Retain text-level sink evidence for JavaScript carried inside JSON or
  # command strings; callers that execute asset bytes supply the source link.
  - id: js-function-ctor-call-text
    desc: JavaScript Function constructor in source text
    crit: notable
    for: [javascript, typescript, json]
    conf: 0.82
    if:
      type: text
      regex: '\b(new\s+)?Function\s*\('
    unless:
      - id: metadata/file/extension/identity::dart-source-basename
  - id: js-array-filter-constructor-split
    desc: Split filter path reaches Function ctor
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\[\]\s*\[["'']fil["'']\s*\+\s*["'']ter["'']\]\s*\[["'']cons["'']\s*\+\s*["'']tructor["'']\]'
  # Inline HTML has no JavaScript symbol facts; retain its constructor syntax.
  - id: html-new-function-constructor-text
    desc: Script calls new Function constructor
    crit: notable
    conf: 0.7
    for: [html, scala, elixir]
    platforms: [linux, macos, windows]
    if:
      type: text
      regex: 'new\s+Function\s*\('
      exclude_html_comments: true

  - id: js-async-function-constructor
    desc: JavaScript AsyncFunction compiles code
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: symbol
      kind: call
      exact: AsyncFunction
      arg:
        kind: identifier

  # Loader injection is ordinary runtime compilation in github-script and
  # compiler tests. Objective consumers supply the remote-source context.
  - id: js-async-function-require-parameter
    desc: AsyncFunction takes a require parameter
    crit: notable
    conf: 0.98
    attack: T1059.007
    if:
      type: symbol
      kind: call
      exact: AsyncFunction
      args:
        - index: 0
          kind: string
          exact: require
        # With one argument, "require" is the body rather than a parameter.
        - index: 1

  - id: js-async-function-constructor-alias
    desc: Recovers the AsyncFunction constructor
    crit: notable
    conf: 0.97
    attack: T1059.007
    if:
      type: text
      regex: 'async\s+function\s*\([^)]{0,80}\)\s*\{\s*\}\s*\.constructor'

  - id: js-asyncfunction-code-variable
    desc: AsyncFunction compiles a code variable
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: '\bnew\s+AsyncFunction(Constructor)?\s*\(\s*(instrumented)?[Cc]ode\s*\)'

  # `evaluate` is an ordinary user-defined name (template engines, expression
  # parsers, Puppeteer's page.evaluate), so the call shape alone establishes no
  # behavior — it only acquires meaning next to a payload source. Kept as a
  # component so dropper composites can join it to their own evidence without
  # this fragment claiming a remote-configuration read on its own.
  - id: function-ctor-call-expr-arg
    desc: Builds JavaScript function from call result
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: Function
      arg: {kind: call}
  - id: js-new-function-constructor
    desc: Calls JavaScript's new Function constructor
    crit: notable
    conf: 0.7
    if:
      # Match the executable constructor node rather than comments or string
      # literals that merely document `new Function(...)`.
      type: tree-sitter
      language: javascript
      query: |
        (new_expression
          constructor: (identifier) @name
          (#eq? @name "Function"))
    unless:
      - type: text
        substr: "new Function('return this')"
      - type: text
        substr: 'new Function("return this")'
      # gettext/plural-form evaluators compile `nplurals` formulas as
      # `new Function("n", "return " + formula)` — not dynamic malware eval.
      - type: text
        substr: 'new Function("n", "return "'
      - type: text
        substr: "new Function('n', 'return '"
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: well-known/lib/web/client-side/jquery/
  - id: js-function-constructor-require-parameter
    desc: Function constructor takes require parameter
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: 'new\s+Function\s*\(\s*[''\"]require[''\"]\s*,'
  - id: js-function-constructor-commonjs-wrapper
    desc: Function constructor takes CommonJS parameters
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: 'new\s+Function\s*\(\s*[''"]require[''"]\s*,\s*[''"]module[''"]\s*,\s*[''"]exports[''"]'
  - id: js-function-call-commonjs-wrapper
    desc: Function call takes CommonJS parameters
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: 'Function\s*\(\s*[''"]require[''"]\s*,\s*[''"]module[''"]\s*,\s*[''"]exports[''"]'
  - id: js-function-constructor
    desc: Constructs a JavaScript function dynamically
    crit: notable
    conf: 0.9
    if:
      # Require a JavaScript call node. The generic symbol fact extractor can
      # classify R documentation such as `function(x, y)` as a call to the
      # JavaScript Function constructor.
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: (identifier) @fn
          arguments: (arguments)
          (#eq? @fn "Function"))
        (call_expression
          function: (parenthesized_expression
            (sequence_expression
              . (number) @zero
              . (identifier) @fn .))
          (#eq? @zero "0")
          (#eq? @fn "Function"))
    unless:
      - id: micro-behaviors/metaprogramming/generation::new-function-return-this
      # gettext plural-formula compilers (see js-new-function-constructor).
      - type: text
        substr: 'new Function("n", "return "'
      - type: text
        substr: "new Function('n', 'return '"
      # R documentation is sometimes content-typed as JavaScript; its
      # examples and prose must not become constructor evidence.
      - type: path
        regex: '(?i)\.R(?:d|md)$'
      # Dart is also content-typed as JavaScript. Type annotations such as
      # `Future<void> Function() body` are not Function() constructor calls.
      - type: path
        regex: '(?i)\.dart$'
  - id: js-new-function-variable-argument
    desc: Function constructor receives identifier
    crit: notable
    conf: 0.85
    if:
      # The JavaScript fact extractor records this `new Function(name)` form
      # in the call facts, but the symbol matcher indexes imports/exports and
      # misses constructor calls.  Match the source form directly so the
      # capability is retained for loader composites.
      type: text
      regex: 'new\s+Function\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\)'
    unless:
      # Bundlers commonly retain formula/i18n evaluators in otherwise benign
      # application libraries. The surrounding generated bundle is not enough
      # evidence to call this a dynamic loader; loader composites add their
      # own payload and execution context.
      - id: metadata/build/minifier::js-large-minified-bundle
  - id: js-indirect-function-constructor
    desc: Function constructor via prototype chain
    crit: notable
    conf: 0.9
    # `[].constructor.constructor`, `"".constructor.constructor`,
    # `({}).constructor.constructor` all resolve to the Function constructor
    # without ever writing the literal token `Function`/`eval`. This indirection
    # is an evasion idiom used to keep the dynamic-execution sink out of reach of
    # static `Function(`/`eval(` greps; legitimate code reaches Function directly.
    if:
      type: text
      regex: '\.constructor\s*\.\s*constructor\b'
    unless:
      - id: metadata/build/minifier::js-large-minified-bundle

  - id: js-dom-event-handler-variable-code
    desc: DOM event handler executes variable code
    conf: 0.97
    attack: T1059.007
    if:
      # setAttribute("onchange", code) asks the browser to compile the second
      # argument as JavaScript. Match a parsed call so comments and examples
      # cannot stand in for execution.
      type: tree-sitter
      language: javascript
      kind: call
      regex: '\.setAttribute\s*\(\s*["'']on[a-z]{3,20}["'']\s*,\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\)'

composite_rules:
  - id: new-function-constructor-call
    desc: Calls JavaScript's new Function constructor
    crit: notable
    conf: 0.7
    for: [html, javascript]
    platforms: [linux, macos, windows]
    any:
      - id: js-new-function-constructor
      - id: html-new-function-constructor-text

  - id: js-async-function-variable-code
    desc: AsyncFunction compiles variable-supplied code
    crit: notable
    conf: 0.98
    attack: T1059.007
    near_lines: 24
    all:
      - id: js-async-function-constructor-alias
      - id: js-asyncfunction-code-variable
