defaults:
  platforms:
  - macos
  for:
  - applescript
  crit: notable
traits:
- id: applescript-osacompile-tempfile-text
  desc: osacompile and repeated TempFile text
  conf: 0.96
  if:
    type: text
    regex: (osacompile|o"&"s"&"a"&"c"&"o"&"m"&"p"&"i"&"l"&"e).{0,120}TempFile.{0,80}TempFile
- id: applescript-osacompile-scpt-text
  desc: osacompile and repeated SCPT path text
  conf: 0.94
  if:
    type: text
    regex: \bosacompile\b.{0,160}\.scpt\b.{0,80}\.scpt\b
composite_rules:
- id: applescript-osacompile-repeated-path-clues
  desc: osacompile and repeated script path clues
  conf: 0.96
  any:
  - id: micro-behaviors/metaprogramming/generation/compile::applescript-osacompile-tempfile-text
  - id: micro-behaviors/metaprogramming/generation/compile::applescript-osacompile-scpt-text
