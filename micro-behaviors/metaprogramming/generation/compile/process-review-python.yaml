defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  attack: T1027.004

  conf: 0.9
traits:
- id: python-cargo-command
  desc: Python subprocess invokes Cargo
  if:
    type: symbol
    kind: call
    regex: '^(subprocess\.(run|Popen|call|check_call|check_output)|os\.(system|popen))$'
    arg:
      kind: string
      regex: '(?i)(^|[;&|\s])cargo(\s|$)'
- id: python-subprocess-zig-command
  desc: Python subprocess launches Zig
  if:
    type: symbol
    kind: call
    regex: '^subprocess\.(run|Popen|call)$'
    arg:
      kind: string
      regex: '^zig(\s|$)'
- id: python-os-zig-command
  desc: Python os API launches Zig
  if:
    type: symbol
    kind: call
    regex: '^os\.(system|popen)$'
    arg:
      kind: string
      regex: '^zig(\s|$)'

composite_rules:
- id: python-zig-command
  desc: Python launches a Zig command
  crit: notable
  any:
  - id: micro-behaviors/metaprogramming/generation/compile::python-subprocess-zig-command
  - id: micro-behaviors/metaprogramming/generation/compile::python-os-zig-command
