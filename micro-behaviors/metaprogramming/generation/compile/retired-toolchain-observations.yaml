defaults:
  platforms: [unix, windows]
  for: [elf, pe, shell, python, c, scripts, binaries]
traits:
  - id: compiler-feature-probe
    desc: Compiler target-probe text
    crit: notable
    conf: 0.94
    for: [shell]
    if:
      type: text
      regex: '(?s)if\s+!defined.{0,220}\$cc.{0,120}-target'
  - id: aix-long-double-compiler-probe
    desc: AIX long-double compiler-probe text
    crit: notable
    conf: 0.97
    for: [shell]
    if:
      type: text
      regex: '(?is)\$cc\s+-qlongdouble.{0,500}(working correctly|broken)'
