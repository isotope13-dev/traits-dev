composite_rules:
  - for:
      - csharp
      - pe
      - dll
    platforms:
      - windows
    id: runtime-csharp-compilation-references
    desc: C# runtime compilation references
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/metaprogramming/generation/compile::csharp-compiler-provider
      - id: micro-behaviors/metaprogramming/generation/compile::compile-assembly-from-source-ref
    unless:
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-framework-system-native-image
