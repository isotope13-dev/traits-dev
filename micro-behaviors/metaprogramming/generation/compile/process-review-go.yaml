defaults:
  platforms: [windows, unix]
  for: [shell, batch, powershell, python, github-actions]
  crit: notable

traits:
  - id: go-build-command
    desc: Invokes the Go compiler
    conf: 0.9
    unless:
      - id: metadata/build/conda/
      - id: metadata/build/config::prefix-token-reference
    if:
      type: text
      regex: '(?i)\bgo\s+build\b'

composite_rules:
  - id: go-build-release-flags
    desc: Go build uses stripped or GUI linker flags
    crit: notable
    conf: 0.92
    unless:
      - id: metadata/build/conda/
      - id: metadata/build/config::prefix-token-reference
    all:
      - id: micro-behaviors/metaprogramming/generation/compile::go-build-command
    any:
      - id: metadata/build/toolchain::go-ldflags-strip
      - id: metadata/build/toolchain::go-ldflags-windows-gui
