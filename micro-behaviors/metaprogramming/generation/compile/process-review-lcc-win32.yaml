defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  conf: 0.95

traits:
  - id: lcc-compiler-command
    desc: Invokes lcc C compiler
    if:
      type: text
      regex: '(?im)^\s*([A-Za-z]:\\.{0,60}\\)?lcc(\.exe)?\s+'

  - id: lcc-linker-command
    desc: Invokes lcclnk native linker
    if:
      type: text
      regex: '(?im)^\s*([A-Za-z]:\\.{0,60}\\)?lcclnk(\.exe)?\s+'
