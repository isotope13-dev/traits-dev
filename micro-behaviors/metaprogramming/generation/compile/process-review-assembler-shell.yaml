defaults:
  conf: 0.95
  platforms: [unix]
  for: [shell]
  crit: notable

traits:
  - id: printf-output-piped-to-as
    desc: Pipes printf output into GNU assembler
    if:
      # Anchor at an active shell line so commented examples and documentation
      # cannot be interpreted as execution.
      type: text
      regex: '(?m)^[ \t]*printf[^|\r\n]{0,120}\|[ \t]*as([ \t]|$)'

