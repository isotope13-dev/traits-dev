defaults:
  crit: notable
  platforms: [windows, unix]
  for: [powershell]
  attack: T1059.001
  mbc: E1059

traits:
  - id: powershell-add-type
    desc: PowerShell Add-Type compilation
    conf: 0.75
    if:
      type: text
      regex: '(?i)Add-Type\s+-TypeDefinition'
  - id: powershell-add-type-memberdefinition
    desc: PowerShell compiles inline .NET member code
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bAdd-Type\b[^\r\n;|]{0,160}-m(ember(Definition)?)?\b'
  # JScript.NET is the only non-C#/VB language Add-Type accepts besides JScript's
  # own alias; stagers use it to run a decoded script as compiled managed code
  # without writing a .js file for wscript to host.
  - id: powershell-add-type-jscript-language
    desc: PowerShell compiles JScript with Add-Type
    crit: suspicious
    conf: 0.9
    attack: T1059.007,T1027.004
    if:
      type: text
      regex: '(?i)\bAdd-Type\b[^\r\n;|]{0,160}-lang(uage)?\s+[''"]?JScript\b'
  - id: powershell-add-type-variable
    desc: PowerShell Add-Type variable compilation
    conf: 0.78
    if:
      type: text
      regex: '(?i)\bAdd-Type\s+\$[A-Za-z_][A-Za-z0-9_]*'
  # Covers both spellings of the ScriptBlock constructor, and every host a
  # PowerShell stage can be embedded in: loaders carry the same call inside a
  # batch stub, a .js decoy or an Office document, so restricting this to
  # `powershell` would miss the embedded forms the loader composites need.
