# Make's symbol facts expose targets and bindings, but not shell commands
# inside recipes. Match compiler-variable use in command position, rather
# than treating a compiler assignment or a name in a comment as execution.
# These observations do not establish what the compiled program does.
defaults:
  for: [makefile]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: makefile-native-compiler-variable-recipe
    desc: Make recipe invokes C/C++ compiler variable
    if:
      type: text
      regex: '(?m)^\t[ \t@+-]*\$(\(C(C|XX)\)|\{C(C|XX)\})[ \t]+\S'

  - id: makefile-java-compiler-variable-recipe
    desc: Make recipe invokes Java compiler variable
    if:
      type: text
      regex: '(?m)^\t[ \t@+-]*\$(\(JAVAC\)|\{JAVAC\})[ \t]+\S'

  - id: makefile-kotlin-compiler-variable-recipe
    desc: Make recipe invokes Kotlin compiler variable
    if:
      type: text
      regex: '(?m)^\t[ \t@+-]*\$(\(KOTLIN\)|\{KOTLIN\})[ \t]+\S'
