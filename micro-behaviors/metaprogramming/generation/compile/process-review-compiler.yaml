defaults:
  platforms: [unix, android, ios]
  crit: notable
  attack: "T1027.004" # Obfuscated Files or Information: Compile After Delivery
  for: [shell]
traits:
- id: swift-build-command
  desc: Swift package build command
  conf: 0.9
  platforms: [macos]
  if:
    type: text
    regex: '\bswift\s+build\b'

- id: gcc-invocation
  desc: GCC compiler invocation
  conf: 0.85
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: metadata/build/autotools::autoconf-generated-script
  if:
    type: text
      # Require compiler-shaped arguments.  Package-manager lists such as
      # `gcc gcc-c++ make` are not GCC executions and must not feed payload
      # composites merely because the package name appears at line start.
    regex: '(?m)(^|[;&|({])[ \t]*gcc[ \t]+(-\S+|\S+\.[A-Za-z]{1,3}\b)'

- id: gcc-compilation-invocation
  desc: GCC compiles native source or objects
  conf: 0.9
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: metadata/build/autotools::autoconf-generated-script
  if:
    type: text
      # A compiler information probe such as `gcc -v` is not compilation.
      # Require a compile/link flag or a native source/object input so
      # installer composites do not infer a dropper from version checks.
    regex: '(?m)(^|[;&|({])[ \t]*gcc[ \t]+(-[cSo]\b|.{0,96}\.(c|cc|cpp|cxx|m|mm|s|asm|o|a)\b)'
    case_insensitive: true
- id: gpp-invocation
  desc: G++ C++ compiler invocation
  conf: 0.85
  unless:
  - id: metadata/file/extension/identity::autotools-configure-basename
  - type: text
    substr: MINGW_CXX
  if:
    type: text
    regex: '(?m)(^\s*|[;&|({]\s*)g\+\+\s+(-|[a-zA-Z0-9_./]+)'
- id: clang-invocation
  desc: Invokes the Clang compiler
  conf: 0.85
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: metadata/build/autotools::autoconf-generated-script
  - id: metadata/build/toolchain::xcode-platform-args-build-context
  if:
    type: text
      # Command position, including substitution/pipelines and absolute paths;
      # `find clang -name ...` names a directory rather than running clang.
    regex: '(?m)(^\s*|[;&|({]\s*)([\w./-]+/)?clang(\+\+)?\s+[-\w./]'
- id: cc-invocation
  desc: C compiler invocation
  conf: 0.8
  if:
    type: text
    regex: '(^|[;&(]\s*)cc\s+(-|[a-zA-Z0-9_./]+)'
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: make-invocation
  desc: Invokes the Make build tool
  conf: 0.8
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: metadata/build/autotools::autoconf-generated-script
  if:
    type: text
    regex: '(?m)(^|[;&|(]\s*)make\s+(all|clean|install)\b'
- id: make-invocation-build
  desc: Make build invocation
  conf: 0.8
  if:
    type: text
    regex: '\bmake\s+(build|check|test|dist)\b'
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: make-invocation-flag
  desc: Make invocation with flags
  conf: 0.8
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  if:
    type: text
    regex: '\bmake\s+-[a-zA-Z]\b'
- id: cmake-build-invocation
  desc: Invokes CMake to build targets
  conf: 0.9
  if:
    type: text
    regex: '(?m)(^|[;&|(]\s*)cmake\s+--build\s+\S'
