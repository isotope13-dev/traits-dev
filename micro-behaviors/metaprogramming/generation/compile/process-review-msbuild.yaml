defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  attack: T1127.001

traits:
  - id: msbuild-project-argument
    desc: Batch passes project file to MSBuild
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bMSBuild\.exe["'']?\s+[^\r\n]{0,120}\.(csproj|vbproj|xml)\b'

  - id: msi-localappdata-data-project
    desc: MSI invokes MSBuild with AppData data file
    for: [msi]
    conf: 0.98
    if:
      type: raw
      regex: '(?i)MSBuild\.exe\\?"\s*"\[LocalAppDataFolder\][^"]{0,96}\\[^"]{1,48}\.dat"'
