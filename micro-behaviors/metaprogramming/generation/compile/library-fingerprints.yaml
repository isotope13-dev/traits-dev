defaults:
  platforms: [unix, windows]
  for: [java, class]
  crit: notable
  conf: 0.8
traits:
- id: javassist
  desc: Javassist code-generation library reference
  if:
    type: text
    word: javassist
- id: cglib
  desc: cglib code-generation library reference
