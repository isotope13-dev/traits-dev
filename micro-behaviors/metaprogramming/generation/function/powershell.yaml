defaults:
  crit: notable
  platforms: [windows, unix]
  for: [powershell]
  attack: T1059.001
  mbc: E1059

traits:
  - id: powershell-scriptblock-constructor-text
    desc: PowerShell creates a ScriptBlock
    conf: 0.92
    for: [scripts, source, oledoc]
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '(?i)(InvokeCommand\s*\.\s*NewScriptBlock|\[\s*scriptblock\s*\]::\s*create)\s*\('
  - id: lnk-powershell-scriptblock-constructor
    desc: LNK PowerShell creates a ScriptBlock
    conf: 0.94
    for: [lnk]
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\[\s*scriptblock\s*\]::create\s*\('
  - id: encoded-powershell-scriptblock-constructor
    desc: Encoded PowerShell ScriptBlock constructor
    crit: notable
    conf: 0.9
    for: [powershell, javascript, vbs, html, batch, lnk]
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\[ScriptBlock\]::Create|ScriptBlock\.Create\('

