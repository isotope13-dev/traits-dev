defaults:
  crit: notable
  platforms: [unix, windows]
  for: [lua]
composite_rules:
  - id: lua-loadstring-source-name-context
    desc: Lua loadstring near source identifier
    conf: 0.94
    # `loadstring` is Lua's compile-a-string primitive; use the canonical Lua
    # atom rather than a case-insensitive text regex, which also swallowed
    # unrelated member calls such as Flutter's `rootBundle.loadString(path)`.
    all:
      - id: micro-behaviors/metaprogramming/generation/function::lua-loadstring
    any:
      - id: "metadata/lang/source/naming/source-text::generated-source-identifier"
      - id: metadata/lang/source/naming/source-text::model-source-identifier
    near_bytes: 160

