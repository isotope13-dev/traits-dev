defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.95

traits:
  - id: php-create-function-call
    desc: Creates PHP function from source strings
    if:
      type: symbol
      kind: call
      regex: '(?i)^create_function$'
  - id: create-function-reference
    desc: PHP create_function string reference
    mbc: E1059
    attack: T1059.006
    conf: 0.98
    if:
      type: text
      substr: create_fun
    unless:
      - id: metadata/build/generated::php-manual-empty-function-stubs
      - id: well-known/lib/crypto/phpseclib
