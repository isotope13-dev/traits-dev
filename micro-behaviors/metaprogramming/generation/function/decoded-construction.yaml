defaults:
  platforms: [unix, windows]
  for: [javascript]

composite_rules:
  - id: indexed-decoder-near-function-construction
    desc: JavaScript indexed decoder near dynamic function construction
    crit: suspicious
    conf: 0.99
    scope: file
    # Proximity reduces unrelated matches across bundled libraries; it does
    # not establish that the decoder's output is passed to the constructor.
    near_bytes: 2048
    all:
      - id: metadata/lang/source/literal/string/population::js-many-very-long-strings
      - id: micro-behaviors/data/decode/custom::js-indexof-charat-lookup
      - id: micro-behaviors/data/control-flow/loop/counted::js-two-step-loop
      - id: js-new-function-variable-argument
