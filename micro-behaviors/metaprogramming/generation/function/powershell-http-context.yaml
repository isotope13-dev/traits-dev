defaults:
  platforms: [windows]
  for: [batch]
  crit: suspicious
traits:
- id: batch-scriptblock-create-near-iwr
  desc: ScriptBlock Create near Invoke-WebRequest
  conf: 0.95
  if:
    type: text
    regex: (?i)ScriptBlock\]::Create.{0,200}Invoke-WebRequest

composite_rules:
- id: bat-hidden-powershell-http-scriptblock-profile
  desc: BAT hidden PowerShell and HTTP ScriptBlock clues
  conf: 0.97
  all:
  - id: micro-behaviors/process/create/hidden::bat-start-min-hidden-powershell
  - id: micro-behaviors/metaprogramming/generation/function::batch-scriptblock-create-near-iwr
