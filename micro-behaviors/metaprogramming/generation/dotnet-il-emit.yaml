defaults:
  platforms: [windows, unix]
  for: [csharp]
  crit: notable
traits:
  - id: dotnet-named-opcode-emission
    desc: Emits a named .NET opcode
    conf: 0.96
    if:
      type: tree-sitter
      kind: call
      # A bare Emit method also describes Go logging and event publishers.
      # Require the actual IL opcode argument at this call site.
      regex: '\.Emit\s*\(\s*(System\.Reflection\.Emit\.)?OpCodes\.[A-Za-z]+'
