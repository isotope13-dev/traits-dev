defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.86

traits:
  - id: go-format-source
    desc: Formats generated Go source
    conf: 0.88
    if:
      type: symbol
      exact: format.Source

composite_rules:
  - id: go-output-file-writer
    desc: Writes generated Go source file
    crit: notable
    conf: 0.86
    any:
      - id: micro-behaviors/fs/write/file/full::go-os-writefile
      - id: micro-behaviors/fs/write/file/full::ioutil-write-file

  - id: go-source-code-generator
    desc: Generates and writes Go source code
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/metaprogramming/ast::go-source-parser
      - id: go-format-source
      - id: go-output-file-writer
