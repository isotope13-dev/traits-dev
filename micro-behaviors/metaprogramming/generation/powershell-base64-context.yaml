# Decoding and construction are neutral operations. Neither requires execution
# or concealed source; Base64 can safely transport ordinary script text.
defaults:
  crit: notable
  platforms: [windows]
  for: [powershell]
  attack: T1059.001

composite_rules:
  - id: powershell-base64-scriptblock-construction
    desc: Base64 decoding beside ScriptBlock construction
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/base64::powershell-frombase64string
      - id: micro-behaviors/metaprogramming/generation::powershell-scriptblock-constructor-text
    # Proximity records co-occurrence; it does not establish data flow or execution.
    near_bytes: 4096
    near_lines: 8
    unless:
      - id: micro-behaviors/data/serialize/json::powershell-base64-json-parse
      - id: well-known/app/infrastructure/ansible::ansible-powershell-executor-context
      - id: well-known/tool/offensive/metasploit::rex-gem-context
      - id: well-known/tool/offensive/betterxencrypt::betterxencrypt-framework
      - id: metadata/build/scaffold::ruby-format-payload-placeholder
      - id: well-known/lib/vendor-sdk/posh-ovirt::posh-ovirt-module-source
      - id: metadata/lang/source/literal/value::powershell-scriptblock-quoted-shape-comparison
      - id: well-known/app/ai/tool-server/paperbridge::powershell-bootstrap-context
      - id: well-known/lib/ui/react-native-windows::react-native-windows-store-app-utils
