# Emit identical instruction words at two buffer offsets, save the output
# pointer, adjust it to the generated routine and invoke it after copying
# input bytes. Bind the indirect call cell to that saved pointer. The byte
# displacement between buffers, register cells and code locations vary.
defaults:
  for: [dos_com, data]
  platforms: [windows, unix]
  size_max: 65536
traits:
  - id: dos-dual-buffer-generated-transform
    desc: DOS emits and invokes paired transform buffers
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule dos_dual_buffer_generated_transform {
          strings:
            $emit = { 57 81 C7 ?? ?? AB 5F AB C3 }
            $save = { 89 BF ?? ?? 51 B0 ?? E8 ?? ?? 04 02
                      8B C8 48 48 E8 ?? ?? 40 E8 ?? ?? }
            $adjust = { 81 87 ?? ?? ?? ?? }
            $invoke = { F2 A4 E8 ?? ?? FF 97 ?? ?? FC 5B 59 5E 5F F2 A4 C3 }
          condition:
            $emit and
            for any s in (1..#save) : (
              for any a in (1..#adjust) : (
                @adjust[a] > @save[s] and @adjust[a] < @save[s] + 256 and
                uint16(@adjust[a]+2) == uint16(@save[s]+2) and
                for any i in (1..#invoke) : (
                  @invoke[i] > @adjust[a] and @invoke[i] < @adjust[a] + 256 and
                  uint16(@invoke[i]+7) == uint16(@save[s]+2) and
                  for any e in (1..#emit) : (
                    uint16(@emit[e]+3) == uint16(@adjust[a]+4)
                  )
                )
              )
            )
        }
