defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.95
traits:
- id: python-script-source-template
  desc: Python string contains script or C/Go source
  if:
    type: literal
    exclude_docstrings: true
    regex: (?m)^(import (os|socket|ctypes)|#include <|package main\b)
- id: python-returned-shell-command-text
  desc: Returns shell command text
  if:
    type: tree-sitter
    kind: return
    regex: '(?s)^return\s+\(?\s*[fFrRbBuU]{0,2}["''].{0,240}(/bin/(ba)?sh|/dev/tcp)'
- id: python-source-prefix-return
  desc: Returns a prefix concatenated with source
  if:
    type: tree-sitter
    kind: return
    regex: ^return\s+\w+\s*\+\s*source\b
composite_rules:
- id: configured-source-builder
  desc: Caller-configured source template builder
  crit: exception
  all:
  - id: "metadata/lang/source/declaration::python-caller-build-config-parameter"
  - id: python-script-source-template
- id: source-template-transformer
  desc: Returns source with a generated script prefix
  crit: exception
  all:
  - id: python-source-prefix-return
  - id: python-script-source-template
- id: parameterized-shell-command-builder
  desc: Returns caller-parameterized shell commands
  crit: exception
  all:
  - id: "metadata/lang/source/declaration::python-host-port-parameters"
  - id: micro-behaviors/data/collection/map::python-payload-map-get-call
- crit: exception
  conf: 0.96
  id: configured-assessment-plugin
  desc: Caller-configured assessment plugin source
  all:
  - id: "metadata/lang/source/declaration::python-assessment-plugin-class"
  - id: "metadata/lang/source/syntax/assignment::python-assessment-info-map"
  - id: "metadata/lang/source/syntax/call::python-assessment-option-call"
  unless:
  - id: micro-behaviors/data/control-flow/module-exec::python-module-process-or-connect-call
- crit: exception
  conf: 0.96
  id: configured-payload-generator
  desc: Callable framework payload generator source
  all:
  - id: "metadata/lang/source/declaration::python-payload-generator-class"
  - id: "metadata/lang/source/naming/function::python-generate-method"
  - id: "metadata/lang/source/syntax/assignment::python-assessment-info-map"
  unless:
  - id: micro-behaviors/data/control-flow/module-exec::python-module-process-or-connect-call
- id: configured-poc-template
  desc: Callable PoC framework verification plugin
  crit: exception
  all:
  - id: "metadata/lang/source/declaration::python-poc-template-class"
  - id: "metadata/file/function::python-verify-method"
  unless:
  - id: micro-behaviors/data/control-flow/module-exec::python-module-process-or-connect-call
- id: configured-assessment-constructor
  desc: Target-configured assessment check interface
  crit: exception
  all:
  - id: "metadata/lang/source/declaration::python-target-constructor-parameter"
  - id: "metadata/lang/source/naming/function::python-check-method"
  unless:
  - id: micro-behaviors/data/control-flow/module-exec::python-module-process-or-connect-call
  any:
  - id: "metadata/lang/source/syntax/assignment::python-assessment-metadata-map"
  - id: "metadata/lang/source/declaration::python-vulnerability-id-declaration"
