# The Function constructor compiles decoded text; invocation is not required.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
traits:
  - id: js-function-textdecoder-argument
    desc: Function constructor argument decodes text bytes
    conf: 0.94
    if:
      type: text
      regex: '\bFunction\s*\([^;{}]{0,40}(\$\{)?new\s+TextDecoder\(\)\.decode\('
      exclude_html_comments: true
