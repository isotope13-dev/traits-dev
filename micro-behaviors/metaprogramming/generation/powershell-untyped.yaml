# PowerShell eval primitives matched in text that was not classified as a
# script, such as a payload saved with a .bin or missing extension.
defaults:
  platforms: [windows]
  for: [data]
  crit: notable
  conf: 0.85
traits:
  - id: powershell-scriptblock-constructor-untyped
    desc: ScriptBlock constructor in unclassified text
    if:
      type: text
      regex: '(?i)\[\s*scriptblock\s*\]::\s*create\s*\('

