# Proximity is not proof that the decrypted bytes reach the constructor.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
composite_rules:
  - id: webcrypto-decrypt-near-decoded-function
    desc: WebCrypto decrypt near decoded-text compilation
    crit: notable
    conf: 0.94
    near_bytes: 384
    all:
      - id: micro-behaviors/crypto/decrypt::webcrypto-decrypt-call-text
      - id: js-function-textdecoder-argument
