defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.9
traits:
  - id: dotnet-file-pumper-label
    desc: File Pumper text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: File Pumper
  - id: dotnet-extension-spoofer-label
    desc: Extension Spoofer text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Extension Spoofer
  - id: dotnet-fake-message-label
    desc: Fake Message text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Fake Message
  - id: dotnet-assembly-info-label
    desc: Assembly Info text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Assembly Info
composite_rules:
  - id: dotnet-builder-ui-label-clues
    desc: Builder-related UI label clues
    crit: component
    conf: 0.9
    needs: 3
    any:
      - id: micro-behaviors/metaprogramming/generation/build::dotnet-file-pumper-label
      - id: micro-behaviors/metaprogramming/generation/build::dotnet-extension-spoofer-label
      - id: micro-behaviors/metaprogramming/generation/build::dotnet-fake-message-label
      - id: micro-behaviors/metaprogramming/generation/build::dotnet-assembly-info-label
