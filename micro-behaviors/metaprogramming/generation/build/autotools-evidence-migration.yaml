defaults:
  platforms:
    - unix
    - windows
  for:
    - shell
  crit: suspicious
traits:
  - id: configure-hidden-cmd
    desc: Configure marker near process invocation
    crit: notable
    conf: 0.85
    for: [c, shell]
    if:
      type: text
      regex: AC_INIT[\s\S]{0,500}(system|exec|popen)\s*\(
  - id: m4-system-call
    desc: system() call in M4 macro marker
    crit: notable
    conf: 0.75
    for: [c, shell, text]
    if:
      type: text
      regex: \b(AC_DEFUN|m4_define|m4_ifdef)\b[\s\S]{0,200}\bsystem\s*\(\s*["'][^"']{1,80}["']\s*\)
  - id: m4-exec-call
    desc: exec call in M4 macro marker
    crit: notable
    conf: 0.75
    for: [c, shell, text]
    if:
      type: text
      regex: (\bAC_DEFUN\b|\bm4_define\b|\bm4_ifdef\b)[\s\S]{0,200}\bexec\s*\(
  - id: m4-esyscmd
    desc: M4 esyscmd (shell execution)
    crit: notable
    conf: 0.8
    for: [c, shell, text]
    if:
      type: text
      word: m4_esyscmd

composite_rules:
  - id: m4-cmd-exec
    desc: M4 macro and command-call references
    crit: suspicious
    conf: 0.8
    any:
      - id: micro-behaviors/metaprogramming/generation/build::m4-system-call
      - id: micro-behaviors/metaprogramming/generation/build::m4-exec-call
  - id: m4-define-exec
    desc: M4 macro with command references
    crit: suspicious
    conf: 0.85
    all:
      - id: metadata/build/autotools::autoconf-m4-macro-definition
      - id: micro-behaviors/metaprogramming/generation/build::m4-cmd-exec
  - id: m4-macro-decoder-tool
    desc: M4 macro and decoder tool references
    crit: notable
    conf: 0.85
    all:
      - id: metadata/build/autotools::autoconf-m4-macro-definition
    any:
      - id: micro-behaviors/data/encoding/base64::base64-tool
      - id: micro-behaviors/data/decode/hex::xxd-tool-reference
  - id: m4-command-decoder-clues
    desc: M4 command and decoder clues
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/build/autotools::autoconf-m4-macro-definition
      - id: micro-behaviors/metaprogramming/generation/build::m4-esyscmd
    any:
      - id: micro-behaviors/metaprogramming/generation/build::m4-define-exec
      - id: micro-behaviors/metaprogramming/generation/build::m4-macro-decoder-tool
