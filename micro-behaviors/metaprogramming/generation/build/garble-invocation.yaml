defaults:
  platforms: [windows, unix]
  attack: T1027
traits:
  # Source/script invocation of mvdan.cc/garble — distinct from binary fingerprints.
  - id: garble-build-invocation
    desc: Garble build command text
    crit: notable
    conf: 0.96
    # Dockerfile and CI workflows added: an implant's build recipe is as
    # often a container image or a pipeline step as it is a shell script,
    # and those two file types were the ones missing.
    for: [batch, shell, powershell, python, text, source, dockerfile, github-actions, makefile]
    if:
      type: text
      regex: '(?i)\bgarble(\.exe)?(\s+-\S{1,24}(\s+\$\{[A-Za-z0-9_]{1,24}\})?){0,6}\s+build\b'
