defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.9
traits:
  - id: dotnet-builder-feature-placeholders
    desc: Feature placeholder tokens
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '\[(ANTI|ENCRYPTION|PERSISTENCE|INJECT)\]'
  - id: dotnet-builder-tool-placeholders
    desc: Tool placeholder tokens
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '\[(UAC|TASKMGR|REGEDIT|CMD)\]'
composite_rules:
  - id: dotnet-builder-placeholder-clues
    desc: Builder-related placeholder clues
    crit: component
    conf: 0.94
    all:
      - id: micro-behaviors/metaprogramming/generation/build::dotnet-builder-feature-placeholders
      - id: micro-behaviors/metaprogramming/generation/build::dotnet-builder-tool-placeholders
