defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  - id: go-agent-stealth-cross-builder
    desc: Go cross-build and agent-name clues
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/metaprogramming/generation/build::go-build-release-flags
      - id: metadata/build/compiler::go-ldflags-symbol-inject
      - id: metadata/build/architecture::go-cross-compile-agent-output
    any:
      - id: micro-behaviors/metaprogramming/generation/build::garble-build-invocation
      - id: metadata/build/compiler::go-ldflags-windows-gui
