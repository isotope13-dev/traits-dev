defaults:
  conf: 0.9
  for:
    - pe
    - dll
  platforms:
    - windows

traits:
  - id: go-add-renamed-function-text
    desc: Go AddRenamedFunction text
    crit: notable
    for:
      - go
    if:
      type: text
      substr: AddRenamedFunction
  - id: go-shim-cpp-template-name
    desc: Go C++ shim template name
    crit: notable
    for:
      - go
    if:
      type: text
      regex: (dynamic|static)-shim\.cpp\.template
  - id: go-get-def-file-name-text
    desc: Go GetDefFileName text
    crit: notable
    for:
      - go
    if:
      type: text
      substr: GetDefFileName
  - id: go-dlltool-command-construction
    desc: Go dlltool command construction text
    crit: notable
    for:
      - go
    if:
      type: text
      regex: exec\.Command\("x86_64-w64-mingw32-dlltool"[\s\S]{0,300}"-d"[\s\S]{0,300}"-l"
  - id: go-shim-artifact-method-names
    desc: Go shim artifact method names
    crit: notable
    for:
      - go
    if:
      type: text
      regex: Get(CppCode|HdrCode|CompileScript|Lib)FileName

composite_rules:
  - id: go-dll-shim-generation-clues
    desc: Go DLL shim generation clues
    crit: suspicious
    for:
      - go
    all:
      - id: micro-behaviors/metaprogramming/generation/build::go-add-renamed-function-text
      - id: micro-behaviors/metaprogramming/generation/build::go-shim-cpp-template-name
      - id: micro-behaviors/metaprogramming/generation/build::go-dlltool-command-construction
    any:
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-call
      - id: micro-behaviors/fs/file/create::os-create
      - id: micro-behaviors/metaprogramming/generation/build::go-get-def-file-name-text
  - id: go-dll-shim-build-artifacts
    desc: Go DLL shim build artifact clues
    crit: suspicious
    for:
      - go
    all:
      - id: micro-behaviors/metaprogramming/generation/build::go-shim-artifact-method-names
      - id: micro-behaviors/metaprogramming/generation/build::go-get-def-file-name-text
      - id: micro-behaviors/metaprogramming/generation/build::go-dlltool-command-construction
