defaults:
  platforms: [windows, unix]
  for: [shell, batch, powershell, python, github-actions]
  crit: notable

traits:
  - id: go-build-command
    desc: Go build command text
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bgo\s+build\b'

composite_rules:
  - id: go-build-release-flags
    desc: Go build and linker flag references
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/metaprogramming/generation/build::go-build-command
    any:
      - id: metadata/build/compiler::go-ldflags-strip
      - id: metadata/build/compiler::go-ldflags-windows-gui
