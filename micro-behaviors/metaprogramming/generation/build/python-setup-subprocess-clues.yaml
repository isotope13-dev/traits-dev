defaults:
  for: [python]
  platforms:
    - unix
    - windows
  crit: suspicious
traits:
  - id: setup-py-hex-argv-gated-subprocess
    desc: Hex-decoded argv-gated setup subprocess
    crit: suspicious
    conf: 0.92
    if:
      type: text
    # Hex-decoding an argv sentinel and then launching a variable-held command
    # from the gated block conceals setup-time process execution from literal
    # command scans. The archive composite below also requires a root setup.py.
      regex: '(?s)fromhex\(.{0,100}\)\.decode\(\).{0,100}in sys\.argv.{0,250}subprocess\.run\(\w+'
  - id: setup-py-subprocess-run
    desc: Custom build_ext invokes subprocess.run
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: class\s+\w+\s*\([^)]{0,80}\bbuild_ext\b[^)]{0,80}\):[\s\S]{0,400}subprocess\.run\(
    unless:
      - id: setup-py-compiler-version-probe
    downgrade:
      any:
    # A build_ext that copies prebuilt binaries into the build tree with `cp`
    # (AIMET's BuildExtensionCommand) stages local files; it fetches nothing.
        - id: micro-behaviors/fs/write/copy::local-file-copy-invocation
        - id: micro-behaviors/metaprogramming/generation/build::make-toolchain-invocation
        - id: micro-behaviors/metaprogramming/generation/build::make-toolchain-variable-invocation
        - id: micro-behaviors/metaprogramming/generation/build::cmake-build-variable-invocation
  - id: setup-py-compiler-version-probe
    desc: Setup invokes compiler for version output
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'subprocess\.run\(\s*\[\s*\w+\.compiler\[0\]\s*,\s*["''](-v|--version)["'']'
