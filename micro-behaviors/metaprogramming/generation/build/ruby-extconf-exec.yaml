defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: extconf-build-toolchain-invocation
    desc: extconf.rb invokes a native build toolchain
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(system|%x|`)\(?\s*["'']?(cargo|rustc|cmake|meson|ninja|pkg-config|go)\b'

composite_rules:
  - id: extconf-genuine-toolchain-build
    desc: extconf.rb compiles with a real toolchain
    crit: notable
    conf: 0.93
    scope: file
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: metadata/build/package/recipe/gemspec::extconf-native-build-helper
      - id: micro-behaviors/metaprogramming/generation/build::extconf-build-toolchain-invocation
