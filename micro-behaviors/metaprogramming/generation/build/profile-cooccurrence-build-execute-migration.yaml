---
defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
traits:
- id: makefile-hidden-target
  desc: Dot-prefixed target and network command text
  crit: notable
  conf: 0.8
  for:
  - shell
  if:
    type: text
    regex: "^\\.[a-z]+:[\\s\\S]{0,100}(curl|wget|nc )"
  unless:
  - type: text
    regex: "^#!"
  - id: well-known/tool/sysadmin/rancher::dapper-release-download
