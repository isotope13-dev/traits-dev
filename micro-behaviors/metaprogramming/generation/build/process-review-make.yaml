defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9
  mbc: "E1059.006"

traits:
  - id: make-toolchain-invocation
    desc: Subprocess invokes make-family build tool
    if:
      type: text
      regex: 'subprocess\.\w+\(\s*\[\s*["''](\./)?(g?make|ninja|cmake|meson|configure|autogen)\b'
  - id: cmake-build-variable-invocation
    desc: Subprocess runs cmake build via variable
    if:
      type: text
      regex: 'subprocess\.\w+\(\s*\[\s*\w+\s*,\s*["'']--build["'']'
  # make chosen on the line before (make.bat on Windows), then run as argv[0]
  - id: make-toolchain-variable-invocation
    desc: Subprocess runs make named in a variable
    if:
      type: text
      regex: '["''](g?make|make\.bat)["'']\s*\n\s*subprocess\.\w+\(\s*\[\s*\w+\s*\]'
  - id: make-toolchain-shell-format
    desc: Subprocess runs make via formatted shell string
    if:
      type: text
      regex: 'subprocess\.\w+\(\s*f?["'']{1,3}\{?g?make\b'
  - id: build-script-toolchain-invocation
    desc: Subprocess invokes build or compile script
    if:
      type: text
      regex: 'subprocess\.\w+\([^)\n]{0,40}["''](\./|\w+/)?(compile|build)\w*\.sh["'']'
