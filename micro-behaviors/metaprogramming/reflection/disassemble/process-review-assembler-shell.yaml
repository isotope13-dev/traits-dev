defaults:
  conf: 0.95
  platforms: [unix]
  for: [shell]
  crit: notable

traits:
  - id: objdump-disassembly-command
    desc: Runs objdump in disassembly mode
    if:
      # The active-line anchor excludes comments while retaining wrapper
      # commands such as elfutils' `testrun_compare .../objdump -d file.o`.
      type: text
      regex: '(?m)^[ \t]*[^#\r\n]{0,80}objdump[ \t]+-d\b'

composite_rules:
  - id: assembler-disassembly-workflow
    desc: Assembles printf output and runs objdump
    all:
      - id: micro-behaviors/metaprogramming/generation/compile::printf-output-piped-to-as
      - id: micro-behaviors/metaprogramming/reflection/disassemble::objdump-disassembly-command
