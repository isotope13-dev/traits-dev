defaults:
  platforms:
  - unix
  - windows
traits:
- for:
  - class
  - java_class
  id: java-constructor-newinstance-bytecode
  desc: JVM reflective constructor invocation
  crit: notable
  if:
    type: import
    exact: java/lang/reflect/Constructor.newInstance
- for:
  - java
  - class
  - java_class
  id: java-getdeclaredconstructor
  desc: Java reflective constructor lookup
  crit: notable
  conf: 0.9
  if:
    type: import
    exact: java/lang/Class.getDeclaredConstructor
- for:
  - class
  id: jvm-get-declared-method
  desc: JVM getDeclaredMethod reflection
  crit: notable
  if:
    type: text
    word: getDeclaredMethod
