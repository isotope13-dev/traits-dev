# Activator can construct an ordinary object, including a COM shortcut object.
# It does not establish loading or executing a staged assembly.
defaults:
  platforms: [windows, unix]
  for: [pe, csharp]
traits:
  - id: activator
    desc: .NET Activator type reference
    crit: notable
    conf: 0.8
    if:
      type: text
      word: Activator
    unless:
      - id: well-known/game/mod::bedrockboot-source-repository
