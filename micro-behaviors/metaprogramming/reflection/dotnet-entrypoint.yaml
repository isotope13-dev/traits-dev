composite_rules:
- id: dotnet-entrypoint-reflection
  desc: .NET entry-point and invocation member refs
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/process/interpreter/reflection/runtime::get-entrypoint-token
  - id: micro-behaviors/metaprogramming/reflection::dotnet-invoke-token
  any:
  - id: micro-behaviors/process/interpreter/reflection/runtime::appdomain-currentdomain
  - id: micro-behaviors/os/module/load::dotnet-explicit-load-api
- id: dotnet-invoke-token
  desc: MethodBase dynamic invocation evidence
  crit: notable
  conf: 0.8
  any:
  - id: micro-behaviors/metaprogramming/reflection::dotnet-invoke-source-token
  - id: micro-behaviors/process/interpreter/reflection/runtime::dotnet-metadata-invoke-members
  - id: micro-behaviors/process/interpreter/reflection/runtime::dotnet-entrypoint-launch-members
traits:
- id: dotnet-invoke-source-token
  desc: MethodBase.Invoke dotted source spelling
  crit: notable
  conf: 0.8
  if:
    type: text
    exact: MethodBase.Invoke
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
