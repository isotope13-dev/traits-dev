defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: traceback-frame-text
    desc: Accesses a Python traceback frame
    crit: notable
    conf: 0.9
    ref: sha256:a6dfb93ccf1c019100eb55c65b0d5ccc26f835cf876f96fe8366a3376449052a
    if:
      type: text
      word: tb_frame
  - id: traceback-next-text
    desc: Traverses to the next Python traceback
    crit: notable
    conf: 0.88
    ref: sha256:a6dfb93ccf1c019100eb55c65b0d5ccc26f835cf876f96fe8366a3376449052a
    if:
      type: text
      word: tb_next
  - id: frame-locals-text
    desc: Python frame locals access
    crit: notable
    conf: 0.9
    ref: sha256:a6dfb93ccf1c019100eb55c65b0d5ccc26f835cf876f96fe8366a3376449052a
    if:
      type: text
      word: f_locals
  - id: frame-globals-text
    desc: Python frame globals access
    crit: notable
    conf: 0.88
    ref: sha256:a6dfb93ccf1c019100eb55c65b0d5ccc26f835cf876f96fe8366a3376449052a
    if:
      type: text
      word: f_globals
  - id: frame-code-text
    desc: Accesses a Python frame code object
    crit: notable
    conf: 0.86
    ref: sha256:a6dfb93ccf1c019100eb55c65b0d5ccc26f835cf876f96fe8366a3376449052a
    if:
      type: text
      word: f_code
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: python-inspect-stack-call
    desc: Calls inspect.stack to walk frames
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: inspect.stack
  - id: caller-frame-depth-access
    desc: Python caller stack frame traversal
    crit: notable
    conf: 0.88
    ref: sha256:fab39b4045be97c3d98a8425a3486b5561cca80ba0f61721a2070935eeba7846
    if:
      type: text
      regex: 'inspect\.currentframe\(\)(\.f_back){2,}|len\s*\(\s*inspect\.stack\(\s*\)\s*\)'
  - id: traceback-extract-tb-text
    desc: Python traceback extraction call
    crit: notable
    conf: 0.88
    ref: sha256:a6dfb93ccf1c019100eb55c65b0d5ccc26f835cf876f96fe8366a3376449052a
    if:
      type: text
      word: extract_tb
  - id: python-subclasses-call
    desc: Calls __subclasses__() on a class
    for: [python, gyp]
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '__subclasses__\s*\(\s*\)'

  - id: python-getattr-call
    desc: Python getattr dynamic attribute lookup
    crit: notable
    conf: 0.75
    if:
      type: symbol
      kind: call
      exact: getattr

  - id: python-imported-module-getattr
    desc: Looks up an imported module attribute
    crit: notable
    conf: 0.9
    if:
      # Nested calls distinguish runtime reflection from comments and strings.
      type: tree-sitter
      query: |
        (call
          function: (identifier) @getattr
          (#eq? @getattr "getattr")
          arguments: (argument_list
            (call
              function: (identifier) @import
              (#eq? @import "__import__"))
            (_))) @lookup

composite_rules:
  - id: traceback-frame-locals
    desc: Python traceback frame locals access
    crit: notable
    conf: 0.9
    ref: sha256:a6dfb93ccf1c019100eb55c65b0d5ccc26f835cf876f96fe8366a3376449052a
    all:
      - id: "micro-behaviors/metaprogramming/reflection::traceback-frame-text"
      - id: "micro-behaviors/metaprogramming/reflection::frame-locals-text"

  - id: frame-globals-locals-snapshot
    desc: Python frame globals locals snapshot
    crit: notable
    conf: 0.88
    ref: sha256:a6dfb93ccf1c019100eb55c65b0d5ccc26f835cf876f96fe8366a3376449052a
    all:
      - id: "micro-behaviors/metaprogramming/reflection::frame-globals-text"
      - id: "micro-behaviors/metaprogramming/reflection::frame-locals-text"
      - id: "micro-behaviors/metaprogramming/reflection::frame-code-text"

  - id: traceback-chain-walk
    desc: Walks a Python traceback chain
    crit: notable
    conf: 0.9
    ref: sha256:a6dfb93ccf1c019100eb55c65b0d5ccc26f835cf876f96fe8366a3376449052a
    all:
      - id: "micro-behaviors/metaprogramming/reflection::traceback-next-text"
      - id: "micro-behaviors/metaprogramming/reflection::traceback-frame-text"
