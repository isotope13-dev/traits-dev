defaults:
  platforms: [unix, windows]
  for: [php]

composite_rules:
  # Callback dispatch, request reads, uploads and file writes also occur in
  # ordinary administrative file managers. No encoding or data-flow leg is
  # required, so neither obfuscation nor an implant is established.
  - id: php-request-upload-write-dispatch-context
    desc: PHP request, upload, write and callback dispatch cooccur
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/process/interpreter/reflection/dispatch::php-callback-array-dispatch
      - id: micro-behaviors/fs/file/move::move-uploaded-file
      - id: micro-behaviors/communications/http/request/superglobal::request-param-assignment
    any:
      - id: micro-behaviors/fs/write/file/full::php-file-put-contents
      - id: micro-behaviors/fs/write/file/full::file-put-contents
    needs: 1
    unless:
      - id: well-known/app/publishing/wordpress-plugins/catalog::known-wordpress-plugin
      - id: metadata/file/naming::test-directory-component
