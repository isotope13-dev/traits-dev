defaults:
  for:
    - pe
    - dll
    - javascript
    - vbs
    - batch
    - lua
    - html
    - asp
  platforms:
    - windows
traits:
  - id: vba-callbyname-invocation
    desc: VBA CallByName name reference
    for: [vbs]
    crit: notable
    conf: 0.92
    if:
      # Text, not literal: CallByName is code (CallByName obj, name,
      # VbMethod), not a quoted constant.
      type: text
      regex: (?i)\bCallByName\b
