defaults:
  crit: notable
  conf: 0.85
  platforms: [windows, unix]
  for: [php]

traits:
  - id: php-callback-dispatch
    desc: Calls a PHP callback dispatcher
    if:
      type: symbol
      kind: call
      exact: call_user_func
  - id: php-dispatcher-dynamic-callable
    desc: Dynamic callable in PHP callback dispatcher
    conf: 0.92
    if:
      type: tree-sitter
      query: |
        ((function_call_expression
          function: [(name) @api (qualified_name (name) @api)]
          arguments: (arguments .
            (argument
              [(variable_name)
               (subscript_expression)
               (binary_expression)
               (parenthesized_expression)
               (function_call_expression)]))) @dispatch
          (#match? @api "(?i)^(call_user_func(_array)?|forward_static_call(_array)?|register_(shutdown|tick)_function|ob_start)$"))
