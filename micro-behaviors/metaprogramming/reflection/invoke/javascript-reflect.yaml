defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: js-reflect-apply-call
    desc: Invokes a function through Reflect.apply
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: Reflect.apply
  - id: js-reflect-apply-global-property
    desc: Reflectively invokes a global receiver function
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: Reflect.apply
      args:
        - index: 0
          from:
            call: '^Reflect\.get$'
        - index: 1
          kind: identifier
          name: globalThis
