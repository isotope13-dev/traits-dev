defaults:
  platforms: [windows]
  crit: notable

traits:
  - id: entrypoint-invoke-text
    desc: .NET EntryPoint.Invoke reference
    for: [csharp]
    conf: 0.9
    if:
      type: text
      substr: EntryPoint.Invoke

  - id: powershell-entrypoint-delegate-dispatch
    desc: PowerShell delegate invokes .NET entry point
    for: [batch, powershell]
    conf: 0.96
    if:
      type: text
      regex: '(?i)\.EntryPoint.{0,120}CreateDelegate.{0,120}DynamicInvoke'

composite_rules:
  - id: dotnet-reflective-entrypoint-invoke
    desc: .NET reflectively invokes a method
    conf: 0.92
    for: [csharp, pe, dll]
    any:
      - id: micro-behaviors/metaprogramming/reflection/invoke::entrypoint-invoke-text
      - id: micro-behaviors/metaprogramming/reflection/invoke::invoke-member-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::dotnet-reflected-method-invoke
