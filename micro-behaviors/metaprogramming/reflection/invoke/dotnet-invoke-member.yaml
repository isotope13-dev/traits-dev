# InvokeMember is used for reflected invocation and C# dynamic binding.
# Its name does not establish script execution or a staged-code handoff.
defaults:
  platforms: [windows, unix]
  for: [pe, csharp]
  crit: notable

traits:
  - id: invoke-member-token
    desc: .NET InvokeMember dispatch API reference
    conf: 0.82
    if:
      type: text
      exact: InvokeMember
  - id: dotnet-dynamic-invoke-reference
    desc: .NET Delegate DynamicInvoke dispatch reference
    conf: 0.9
    for: [pe, dll, csharp]
    if:
      type: text
      word: DynamicInvoke
