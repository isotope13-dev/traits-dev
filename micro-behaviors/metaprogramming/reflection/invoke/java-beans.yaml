# java.beans.Expression/Statement invoke a named method or constructor by
# reflection when evaluated with getValue()/execute(). Legitimate in
# XMLEncoder bean persistence; the fully-qualified form matched here is the
# spelling usable from expression languages (OGNL/EL) that cannot import
# classes, which is what makes it analyst-relevant on its own.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, json, html, jsp]
  crit: notable
  conf: 0.95

traits:
  - id: java-beans-reflective-invocation
    desc: Constructs java.beans reflective invocation
    if:
      type: text
      regex: '\bjava\.beans\.(Expression|Statement)\s*\('

  - id: java-beans-reflective-evaluation
    desc: Evaluates a java.beans reflective invocation
    conf: 0.97
    if:
      type: text
      regex: '(?s)\bjava\.beans\.(Expression|Statement)\s*\(.{0,1000}?\)\s*\.\s*(getValue|execute)\s*\('
