---
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  conf: 0.94
composite_rules:
- id: opaque-name-reflective-resource-profile
  desc: Opaque-named PE with high-entropy resources and reflection
  crit: suspicious
  conf: 0.96
  all:
  - id: metadata/filename/shape::opaque-identifier-pe-basename
  - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
  - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
  - id: micro-behaviors/metaprogramming/reflection/invoke::invoke-member-token
  - id: metadata/signature/absent::unsigned-missing-signature-record
  - id: metadata/binary/provenance/version-info::pe-basename-differs-from-original-filename
  unless:
  - id: micro-behaviors/data/embedded/payload/resource::costura-bundle-marker
  - id: metadata/file/format/test-signature::eicar-test-string-reference
