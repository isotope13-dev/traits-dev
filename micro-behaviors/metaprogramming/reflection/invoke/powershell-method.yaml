defaults:
  platforms: [unix, windows]
  for: [powershell]
  crit: notable
  conf: 0.9

traits:

  - id: powershell-assembly-method-invoke
    desc: Invokes a reflected .NET method
    for: [powershell, javascript, html, vbs, text, data]
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '(?is)\.GetMethod\([^)]{1,120}\)[\s\S]{0,512}\.Invoke\('
