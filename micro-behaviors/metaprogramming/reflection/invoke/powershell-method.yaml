defaults:
  platforms: [unix, windows]
  for: [powershell]
  crit: notable
  conf: 0.9

traits:

  - id: powershell-assembly-method-invoke
    desc: GetMethod followed by Invoke text
    for: [powershell, javascript, vbs, text, data]
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '(?is)\.GetMethod\([^)]{1,120}\)[\s\S]{0,512}\.Invoke\('

  - id: assembly-method-invoke-html
    desc: GetMethod followed by Invoke text
    for: [html]
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '(?s)\.GetMethod\([^)]{1,120}\)[\s\S]{0,512}\.Invoke\('

composite_rules:
  - id: assembly-method-invoke-text
    desc: GetMethod followed by Invoke text
    for: [powershell, javascript, vbs, text, data, html]
    any:
      - id: powershell-assembly-method-invoke
      - id: assembly-method-invoke-html
