defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
traits:
  - id: managed-binder-invokemember-call
    desc: Calls the C-Sharp dynamic member binder
    if:
      type: symbol
      kind: call
      exact: Microsoft.CSharp.RuntimeBinder.Binder.InvokeMember

  - id: cil-reflective-member-dispatch
    conf: 0.95
    platforms: [windows, unix]
    desc: Managed code invokes a member by name
    if:
      type: symbol
      kind: call
      exact: System.Type.InvokeMember
