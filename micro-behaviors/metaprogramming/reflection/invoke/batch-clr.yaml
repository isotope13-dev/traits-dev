defaults:
  platforms: [windows]
  for: [batch, powershell]
traits:
- id: batch-obfuscated-entrypoint-name
  desc: .NET entry point name with optional noise
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: 'E@?n@?t@?r@?y@?P@?o@?i@?n@?t@?'
- id: batch-null-reflection-invocation
  desc: Method invocation with null target
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '(?i)\.(Invoke|\$[a-zA-Z_]{1,40})\(\$null,'
