defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for:
    - java
    - kotlin
    - class
    - xml
    - jsp
    - html
    - javascript
    - python
traits:
  - id: java-beans-runtime-exec-expression
    desc: Java Beans Expression constructs Runtime.exec
    crit: notable
    conf: 0.94
    for: [jsp, java, html, javascript, python]
    if:
      type: text
      regex: 'new\s+(java\.beans\.)?Expression\s*\(\s*Runtime\.getRuntime\s*\(\s*\)\s*,\s*["'']exec["'']'

