# DynamicInvoke is the delegate-based counterpart to MethodInfo.Invoke and
# Type.InvokeMember for firing a reflectively resolved method. The token alone
# is a neutral dispatch capability; objective composites pair it with the
# load and resolution context that establishes what is being dispatched.
defaults:
  platforms: [windows, unix]
  for: [pe, csharp]
  crit: notable

traits:
  - id: dynamic-invoke-token
    desc: .NET DynamicInvoke dispatch API reference
    conf: 0.82
    if:
      type: text
      exact: DynamicInvoke
