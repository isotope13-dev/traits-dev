# Call syntax distinguishes these references from most grammar prose.
---
defaults:
  platforms:
  - windows
  - unix
  for:
  - lua
traits:
- id: lua-env-proxy-call-sequence
  desc: Lua environment and proxy call sequence
  crit: notable
  conf: 0.95
  for:
  - lua
  - javascript
  - text
  if:
    type: text
    regex: "(?s)getfenv\\s*\\([^)]{0,120}\\).{0,600}?newproxy\\s*\\([^)]{0,120}\\).{0,600}?setmetatable\\s*\\("
  unless:
  - id: metadata/lang/source/syntax/directive::lua-meta-annotation
