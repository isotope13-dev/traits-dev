defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.96

traits:
  - id: powershell-array-then-literal-static-invoke
    desc: Array then literal static method invocations
    if:
      type: text
      # Accept generated identifiers and Ruby-format template variables.
      # The second invocation is necessary: emitting/copying IL alone does
      # not activate the overwritten method. The composite supplies that role.
      regex: '(?i)\.Invoke\s*\(\s*\$null,\s*\$[\w%{}]+\s*\)[\s\S]{0,120}\.Invoke\s*\(\s*\$null,\s*@\('
