defaults:
  platforms: [unix, windows]
traits:
  - id: lua-environment-proxy-references
    desc: Lua environment with proxy primitive references
    crit: notable
    conf: 0.93
    for: [lua, javascript, text]
    if:
      type: text
      # A VM loader that calls getfenv() and carries newproxy/setmetatable
      # as bare register seeds (never invoked in-file) hides its proxy
      # usage from the call-syntax loader above; compat shims name the
      # functions without calling getfenv().
      regex: 'getfenv\s*\(\s*\).{0,400}newproxy\b.{0,400}setmetatable\b'
    unless:
      - id: metadata/package/testing/harness-lua::lua-test-suite-directory-path
      - id: well-known/tool/development/vscode-extension/sumneko-lua::emmylua-meta-file-annotation

  # Packer shapes first filed under backdoor/broad. They prove concealment,
  # not a command channel; the platforms keep the appliance scope they had.
