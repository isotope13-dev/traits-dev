defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
traits:
  # The call-fact target does not identify the callable returned by getattr.
  # A nested call query distinguishes invocation from lookup and quoted code.
  - id: python-getattr-builtin-call
    desc: Invokes a builtin resolved through getattr
    if:
      type: tree-sitter
      language: python
      query: |
        ((call
          function: (call
            function: (identifier) @lookup
            arguments: (argument_list . (identifier) @builtins . (_)))
          arguments: (argument_list)) @invoke
          (#eq? @lookup "getattr")
          (#match? @builtins "^(__builtins__|builtins)$"))
