composite_rules:
- id: jvm-reflection-with-process-creation
  desc: JVM reflection with process creation references
  crit: notable
  conf: 0.98
  for:
  - class
  - java_class
  scope: leaf
  all:
  - id: micro-behaviors/metaprogramming/reflection::java-bytecode-reflective-method-invoke
  any:
  - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol
  - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode-symbol
  - id: micro-behaviors/process/create/spawn::java-runtime-exec
  - id: micro-behaviors/data/embedded/script::embedded-bash-shebang
  unless: []
  platforms:
  - unix
- id: java-bytecode-reflective-method-invoke
  desc: JVM resolves and invokes method reflectively
  crit: notable
  conf: 0.94
  platforms:
  - unix
  - windows
  - android
  for:
  - class
  - java_class
  - jar
  - zip
  - apk
  all:
  - id: micro-behaviors/metaprogramming/reflection::java-class-forname-bytecode
  - id: micro-behaviors/metaprogramming/reflection::java-class-getmethod-bytecode
  - id: micro-behaviors/metaprogramming/reflection::java-method-invoke-bytecode
  unless:
  - id: well-known/lib/development/google-closure-compiler/
  - id: well-known/lib/development/args4j
  - id: well-known/lib/runtime/scripted/mozilla-rhino
  - id: well-known/lib/format/google-protobuf-java::generated-message-lite-class
traits:
- id: java-class-forname-bytecode
  desc: JVM Class.forName invocation
  crit: notable
  for:
  - class
  - java_class
  if:
    type: import
    exact: java/lang/Class.forName
  platforms:
  - unix
  - windows
- id: java-class-getmethod-bytecode
  desc: JVM reflective method lookup
  crit: notable
  for:
  - class
  - java_class
  if:
    type: import
    exact: java/lang/Class.getMethod
  platforms:
  - unix
  - windows
- id: java-method-invoke-bytecode
  desc: JVM reflective method invocation
  crit: notable
  for:
  - class
  - java_class
  if:
    type: import
    exact: java/lang/reflect/Method.invoke
  platforms:
  - unix
  - windows
- id: jvm-reflect-method-descriptor
  desc: JVM reflect.Method type descriptor
  crit: notable
  for:
  - class
  if:
    type: text
    substr: Ljava/lang/reflect/Method;
  unless:
  - id: well-known/tool/development/build/gradle-wrapper::gradle-wrapper-package-class
  platforms:
  - unix
  - windows
- id: jvm-reflect-field-descriptor
  desc: JVM reflect.Field type descriptor
  crit: notable
  for:
  - class
  if:
    type: text
    substr: Ljava/lang/reflect/Field;
  platforms:
  - unix
  - windows
- id: jvm-get-declared-field
  desc: JVM getDeclaredField reflection
  crit: notable
  for:
  - class
  if:
    type: text
    word: getDeclaredField
  platforms:
  - unix
  - windows
- id: java-reflect-field-set
  desc: JVM reflective field assignment reference
  crit: notable
  conf: 0.96
  platforms:
  - unix
  - windows
  for:
  - class
  if:
    type: import
    exact: java/lang/reflect/Field.set
