defaults:
  platforms: [unix, windows]
traits:
- id: loadclassfrombytes-helper
  desc: loadClassFromBytes helper name reference
  crit: notable
  conf: 0.92
  for: [class]
  if:
    type: text
    exact: loadClassFromBytes
composite_rules:
- id: java-load-or-find
  desc: Java loadClass or findClass
  crit: notable
  for: [java, class]
  any:
  - id: micro-behaviors/data/source/dynamic/reflect::java-loadclass
  - id: micro-behaviors/data/source/dynamic/reflect::java-findclass
- id: jar-stream-classloader-apis
  desc: JAR stream and byte-array class-loader APIs
  crit: notable
  conf: 0.95
  for: [class]
  all:
    - type: trait
      id: micro-behaviors/data/archive/library::jarinputstream-ref
    - type: trait
      id: micro-behaviors/data/archive/library::jarinputstream-entry-iteration
    - type: trait
      id: micro-behaviors/data/buffer/transfer::bytearrayinputstream-ref
    - type: trait
      id: micro-behaviors/data/buffer/transfer::bytearrayoutputstream-ref
  any:
    - type: trait
      id: loadclassfrombytes-helper
    - type: trait
      id: micro-behaviors/data/source/dynamic/reflect::java-defineclass
