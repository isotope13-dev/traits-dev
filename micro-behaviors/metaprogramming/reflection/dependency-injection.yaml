defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: dependency-injection-call
    desc: Calls a dependency injection function
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: injectDependency

  - id: container-di-method-call
    desc: Calls a dependency-injection container method
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '^(container|injector)\.(inject|provide)$'
