defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: vbnet-lzma-latebind-name-profile
  desc: VB late-binding and LZMA name clues
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/fs/path/data-file::data-and-lzma-dat-name-pair
  - id: micro-behaviors/data/decompress/lzma::sevenzip-helper-lzma-names
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-newlatebinding
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-latecall-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-lateget-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::resolveeventhandler-token
  - id: metadata/binary/symbols/name/token/runtime::dotnet-create-instance-method-name
