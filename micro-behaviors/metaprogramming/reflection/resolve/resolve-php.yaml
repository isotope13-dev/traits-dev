defaults:
  platforms: [linux, macos, windows]
  for: [php]
  crit: notable

traits:
  - id: reflection-class-instantiation
    desc: References PHP ReflectionClass
    conf: 0.85
    attack: T1059.004
    if:
      type: symbol
      exact: ReflectionClass

  - id: reflection-class-name-literal
    desc: Constructs a PHP ReflectionClass
    conf: 0.9
    if:
      type: text
      substr: 'new ReflectionClass'

  - id: php-variable-variable-dereference
    desc: PHP dynamic variable-variable dereference
    conf: 0.92
    attack: T1027
    if:
      type: tree-sitter
      language: php
      query: '(dynamic_variable_name) @dynamic'

  # The subscripted form, `$$name[...]` / `${$name}[...]`: a variable named
  # by a string, then indexed. ProxyManager, PHP-CS-Fixer's
  # ExplicitIndirectVariableFixer and php-src's own tests use it; webshell
  # stagers pair it with XOR-built superglobal names, which their composites
  # require.
  - id: php-variable-variable-subscript
    desc: PHP variable-variable subscript dereference
    conf: 0.92
    attack: T1027
    if:
      type: text
      regex: '(\$\{\$[A-Za-z_]\w*\}|\$\$[A-Za-z_]\w*)\s*[\[{]'
