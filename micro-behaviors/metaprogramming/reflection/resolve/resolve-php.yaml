defaults:
  platforms: [linux, macos, windows]
  for: [php]
  crit: notable

traits:
  - id: reflection-class-instantiation
    desc: References PHP ReflectionClass
    conf: 0.85
    attack: T1059.004
    if:
      type: symbol
      exact: ReflectionClass

  - id: reflection-class-name-literal
    desc: Constructs a PHP ReflectionClass
    conf: 0.9
    if:
      type: text
      substr: 'new ReflectionClass'

  - id: php-variable-variable-dereference
    desc: PHP dynamic variable-variable dereference
    conf: 0.92
    attack: T1027
    if:
      type: text
      regex: '(\$\$|\$\{\s*\$)[A-Za-z_][A-Za-z0-9_]*'
