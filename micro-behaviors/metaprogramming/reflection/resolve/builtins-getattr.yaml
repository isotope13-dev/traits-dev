defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
traits:
  - id: getattr-builtins-lookup
    desc: Looks up a member of __builtins__
    if:
      type: symbol
      kind: call
      exact: getattr
      arg:
        index: 0
        kind: identifier
        name: __builtins__
  - id: python-getattr-builtins
    desc: Looks up a Python builtin by name
    if:
      type: symbol
      kind: call
      exact: getattr
      arg:
        index: 0
        kind: identifier
        name: builtins
