defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  crit: notable
traits:
  - id: encoded-reflection-api-name
    desc: Encoded .NET reflection API name
    conf: 0.9
    if:
      type: encoded
      encoding: [base64, hex, xor]
      regex: '(?i)\b(CallByName|RuntimeTypeHandle|GetTypeFromHandle)\b'

