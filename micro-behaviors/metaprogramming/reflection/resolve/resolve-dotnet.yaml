defaults:
  platforms: [windows, unix]
  for: [pe, csharp]
  crit: notable

traits:
  - id: assembly-load
    desc: .NET Assembly.Load call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: Assembly.Load

  - id: assembly-load-file
    desc: .NET loads an assembly from a file
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: Assembly.LoadFile

  # An identifier argument may be a byte array or an assembly-name string.
  - id: assembly-load-variable-argument
    desc: Assembly.Load with an identifier argument
    crit: notable
    conf: 0.9
    for: [pe, csharp, asp, html, javascript, powershell]
    if:
      type: text
      regex: '(System\.Reflection\.)?Assembly\.Load\s*\(\s*[A-Za-z_][A-Za-z0-9_]*\s*\)'

  # Evasive managed loaders resolve `Load` reflectively
  # (`GetMethod("Load").Invoke(bytes)`) so no `Assembly.Load` reference
  # appears for static matching; the Behinder ASP.NET template does this.
  - id: assembly-load-reflected-name
    desc: .NET resolves the Load method by name
    crit: notable
    conf: 0.92
    for: [csharp, asp, html, powershell]
    if:
      type: text
      regex: 'GetMethod\s*\(\s*["'']Load["'']'

  # PowerShell spelling of the same primitive, typically carried as command
  # text inside a compiled stage (`-Command "... [Reflection.Assembly]::Load(
  # [IO.File]::ReadAllBytes($p))"`). The C# call-spelling atoms above do not
  # match the bracketed `::Load` form.
  - id: powershell-assembly-load-operator
    desc: PowerShell reflective assembly load
    crit: notable
    conf: 0.95
    for: [pe, dll, powershell, batch, shell, vbs, javascript]
    if:
      type: text
      regex: '(?i)\[?Reflection\.Assembly\]?::Load'

  - id: clr-internal-nloadimage-call
    desc: Internal CLR nLoadImage loader reference
    crit: suspicious
    conf: 0.96
    for: [csharp, asp, html, powershell, pe]
    attack: T1620
    if:
      type: text
      regex: 'GetMethod\s*\(\s*["'']nLoadImage["'']'
