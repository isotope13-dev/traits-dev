# android.os.Parcel keeps private static caches of Parcelable.Creator
# instances (mCreators; sPairedCreators on Android 13+). Code names them to
# reach those hidden fields reflectively, typically to clear the cache after
# swapping a class's public CREATOR.
defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.93
traits:
  - id: parcel-creator-cache-field-name
    desc: DEX names Parcel creator cache fields
    if:
      type: text
      regex: '^(mCreators|sPairedCreators)$'
