defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - source
    - pe
  crit: notable
  conf: 0.7
traits:
  - id: powershell-get-command-probe
    desc: PowerShell probes command availability
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      # Get-Command with errors silenced asks whether a command exists;
      # bare `Get-Command *` inventory looks different and is not this.
      regex: '(?i)\bGet-Command\b.{0,60}ErrorAction\s+SilentlyContinue'
