# Relocated by the observation it supports; matcher and scope retained.
composite_rules:
- platforms:
  - unix
  - windows
  - android
  for:
  - class
  - java_class
  - jar
  - zip
  - apk
  id: java-bytecode-reflective-constructor-invoke
  desc: JVM constructor lookup/invocation references
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::java-class-forname-bytecode
  - id: micro-behaviors/metaprogramming/reflection/resolve::java-class-getconstructor-bytecode
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::java-constructor-newinstance-bytecode
  unless:
  - id: well-known/lib/development/google-closure-compiler/
  - id: well-known/lib/development/args4j
  - id: well-known/lib/runtime/scripted/mozilla-rhino
  - id: well-known/lib/format/google-protobuf-java::generated-message-lite-class
