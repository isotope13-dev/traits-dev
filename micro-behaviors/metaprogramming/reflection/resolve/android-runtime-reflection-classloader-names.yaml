defaults:
  platforms: [android]
  for: [android_apk, zip, dex]
composite_rules:
  - id: android-runtime-reflection-classloader-names
    desc: Runtime reflection and classloader names coexist
    crit: notable
    conf: 0.995
    all:
      - id: metadata/binary/symbols/name/qualified/runtime::android-activitythread-class-reference
      - id: metadata/lang/source/naming/function/runtime::android-activitythread-current-method
      - id: metadata/lang/source/literal/string/property::android-package-cache-field-name
      - id: micro-behaviors/metaprogramming/reflection/resolve::jvm-get-declared-field
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::reflective-access-bypass
      - id: metadata/lang/source/naming/function/runtime::android-context-classloader-method-name
