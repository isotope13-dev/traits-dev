defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: computed-expression-this-method-call
    desc: Calls a computed-expression this method
    crit: notable
    conf: 0.8
    count_min: 2
    if:
      type: text
      regex: 'this\[[a-zA-Z0-9_\s]*[\(\+][a-zA-Z0-9_\(\)\+\s]*\]\('
    unless:
      - id: well-known/lib/web/
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context

  # `"a.b.c".split('.').reduce((o, k) => o[k], globalThis)` turns a string
  # such as "browser.tabs.executeScript" into a live function, so the API a
  # script calls never appears in its source. Ordinary property-path helpers
  # (lodash get, config lookups) walk a caller-supplied object; this atom
  # requires the walk to start at the global object.
  - id: global-dotted-path-call
    desc: Calls a dotted name resolved from globalThis
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'split\(\s*[''"]\.[''"]\s*\)\s*\.reduce\([\s\S]{0,300}\b(globalThis|window|self)\b'

  - id: reflect-metadata-api-call
    desc: Calls Reflect decorator metadata API
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^Reflect\.((get|has)(Own)?Metadata|(define|delete)Metadata)$'
