defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: computed-expression-this-method-call
    desc: Calls a computed-expression this method
    crit: notable
    conf: 0.8
    count_min: 2
    if:
      type: text
      regex: 'this\[[a-zA-Z0-9_\s]*[\(\+][a-zA-Z0-9_\(\)\+\s]*\]\('
    unless:
      - id: well-known/lib/web/
      - id: well-known/lib/ui/ckeditor/distribution/
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context

  # Resolve a configured dotted property against a global object. This is
  # useful for feature detection and does not establish that the resolved
  # property is invoked.
  - id: global-dotted-path-resolution
    desc: Resolves dotted paths on global objects
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'split\(\s*[''"]\.[''"]\s*\)\s*\.reduce\([\s\S]{0,300}\b(globalThis|window|self)\b'

  - id: reflect-metadata-api-call
    desc: Calls Reflect decorator metadata API
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^Reflect\.((get|has)(Own)?Metadata|(define|delete)Metadata)$'
