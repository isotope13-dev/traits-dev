# Neutral observations and discriminating identities.
composite_rules:
- id: dotnet-dynamic-native-delegate-references
  desc: .NET dynamic methods and native delegates
  crit: notable
  conf: 0.98
  for:
  - pe
  platforms:
  - windows
  all:
  - id: metadata/binary/framework/
  - id: metadata/lang/compiler/managed::reflection-emit
  - id: metadata/lang/compiler/managed::dynamic-method-token
  - id: micro-behaviors/process/interpreter/reflection/runtime::create-delegate
  - id: micro-behaviors/os/api-resolution/dynamic::managed-process-module-reference
  - id: micro-behaviors/os/api-resolution/dynamic::managed-function-pointer-delegate
  - id: metadata/binary/symbols/count::no-imports
  any:
  - id: micro-behaviors/crypto/hash/digest::dotnet-sha256-reference
  - id: micro-behaviors/crypto/hash/digest::dotnet-compute-hash
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/
