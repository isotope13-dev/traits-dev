defaults:
  for: [php]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: php-base64-table-callback
    desc: Dispatches a Base64-decoded table callback
    conf: 0.98
    # Resolving and calling a stored function name establishes a runtime
    # capability, not concealment or unauthorized execution. Bind the
    # decoded local to the callback argument. Adjacent statements
    # exclude an intervening rewrite; decoding ordinary content elsewhere
    # in a program with a callback dispatcher is insufficient.
    if:
      type: tree-sitter
      query: |
        (compound_statement
          (expression_statement
            (assignment_expression
              left: (variable_name) @decoded
              right: (function_call_expression
                function: (name) @decoder
                arguments: (arguments
                  (argument (subscript_expression
                    (scoped_property_access_expression)))))))
          .
          (return_statement
            (error_suppression_expression
              (function_call_expression
                function: (name) @dispatcher
                arguments: (arguments
                  . (argument (variable_name) @callback)))))
          (#eq? @decoder "base64_decode")
          (#eq? @dispatcher "call_user_func_array")
          (#eq? @decoded @callback)) @dispatch
