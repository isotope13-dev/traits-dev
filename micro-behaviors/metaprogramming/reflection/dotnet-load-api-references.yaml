defaults:
  platforms: [windows]
  for: [pe, dll]

# These are API-name references, not a linked execution path or concealment.
# Reference assemblies and embedded API catalogs can supply the same tokens.
composite_rules:
  - id: dotnet-load-invoke-api-references
    desc: .NET assembly-load and invocation API references
    crit: notable
    conf: 0.92
    all:
      - id: metadata/lang/compiler/managed::reflection-namespace
      - id: micro-behaviors/os/module/load::dotnet-explicit-load-api
      - id: micro-behaviors/metaprogramming/reflection::dotnet-invoke-token
    any:
      - id: micro-behaviors/process/interpreter/reflection/runtime::gettypes-member-token
      - id: micro-behaviors/metaprogramming/reflection::get-method-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::method-info-class
      - id: micro-behaviors/metaprogramming/reflection::methodbase-class
  - id: dotnet-appdomain-callbyname-references
    desc: .NET AppDomain and CallByName API references
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-class-token
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-accessor-references
      - id: micro-behaviors/os/module/load::dotnet-load-member-name-variants
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-callbyname-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-exported-types-token
    any:
      - id: micro-behaviors/process/interpreter/runtime/clr::activator
      - id: micro-behaviors/metaprogramming/reflection::get-constructors-token
      - id: micro-behaviors/metaprogramming/reflection::dotnet-assembly-type-reference
  - id: dotnet-appdomain-lateget-references
    desc: .NET AppDomain and LateGet API references
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-class-token
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-accessor-references
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-exported-types-token
      - id: micro-behaviors/process/interpreter/reflection/vb::vb-lateget-token
    any:
      - id: micro-behaviors/process/interpreter/runtime/clr::activator
      - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-member-token
      - id: metadata/file/encoding::base64-load-member-text
      - id: metadata/file/encoding::base64-create-instance-member-text
  - id: dotnet-appdomain-activator-references
    desc: .NET AppDomain and Activator API references
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-accessor-references
      - id: micro-behaviors/os/module/load::dotnet-load-member-name-variants
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-exported-types-token
      - id: micro-behaviors/process/interpreter/runtime/clr::activator
      - id: metadata/binary/symbols/name::dotnet-create-instance-method-name
