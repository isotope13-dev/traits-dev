defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
composite_rules:
  # Co-occurrence is enough to recognize the encoded dispatch implementation
  # shape, but does not prove the decoded table entry is the callback argument.
  - id: php-encoded-file-write-dispatch-profile
    desc: PHP encoded file-write name and callback dispatch
    conf: 0.97
    all:
      - id: micro-behaviors/data/decode/base64::php-decode-indexed-static-table
      - id: metadata/file/encoding::php-base64-file-put-contents-literal
      - id: micro-behaviors/metaprogramming/reflection::php-callback-array-dispatch
