defaults:
  platforms: [windows]
  for: [powershell, pe, ruby]

traits:
  - id: powershell-setvalue-null-true
    desc: Reflection sets a static field true
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)SetValue\s*\(\s*\$null\s*,\s*\$true\s*\)'

  - id: powershell-setvalue-intptr-zero
    desc: Reflection sets a field to IntPtr Zero
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)SetValue\s*\([^,;]{1,80},\s*\[IntPtr\]::Zero\s*\)'

