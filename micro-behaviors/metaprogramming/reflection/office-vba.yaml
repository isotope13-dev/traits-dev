# Project references are neutral introspection, independent of their use by
# an infector. A companion EICAR file does not change the operation's meaning.
defaults:
  platforms: [windows]
  for: [vbs, text, oledoc, ooxml, html]
  crit: notable
  conf: 0.93
traits:
  - id: vba-normaltemplate-project-reference
    desc: VBA references NormalTemplate VBProject
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'NormalTemplate.VBProject.VBComponents'

  - id: vba-active-document-project-reference
    desc: VBA references ActiveDocument VBProject
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'ActiveDocument.VBProject.VBComponents'

  - id: vba-template-project-reference
    desc: References Word template VBA project
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\b(Templates\s*\(\s*\d+\s*\)|NormalTemplate)\.VBProject\b'

