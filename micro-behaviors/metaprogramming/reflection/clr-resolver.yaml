defaults:
  platforms: [windows, unix]
  for: [pe, csharp]
  crit: notable

traits:
  - id: resolve-method
    desc: .NET ResolveMethod API name reference
    conf: 0.82
    if:
      type: text
      word: ResolveMethod
  - id: resolve-type
    desc: .NET ResolveType API name reference
    conf: 0.82
    if:
      type: text
      word: ResolveType
  - id: dotnet-getfields-reference
    desc: .NET GetFields reflection method reference
    conf: 0.72
    if:
      type: text
      word: GetFields
    unless:
      - id: metadata/lang/compiler/managed::delphi

composite_rules:
  - id: resolver-token-pair
    desc: Multiple .NET reflection resolver APIs
    crit: notable
    conf: 0.72
    needs: 2
    any:
      - id: resolve-method
      - id: resolve-type
      - id: dotnet-getfields-reference
      - id: micro-behaviors/metaprogramming/reflection::dotnet-create-delegate-reference

  - id: resolver-api-cluster
    for: [pe]
    desc: .NET reflection metadata resolver cluster
    crit: notable
    conf: 0.91
    all:
      - id: metadata/lang/compiler/managed::reflection-namespace
      - id: resolver-token-pair
    downgrade:
      any:
        - id: metadata/binary/framework::dotnet-metadata
        - id: metadata/signed/platform::microsoft
        - id: well-known/tool/development/toolchain/microsoft-csharp-compiler/
