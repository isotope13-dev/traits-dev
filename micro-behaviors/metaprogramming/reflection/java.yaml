defaults:
  platforms: [unix, windows]
  for: [java, class, java_class, jar, zip]
traits:

  - id: java-set-accessible
    desc: Java reflection accessibility override
    crit: notable
    conf: 0.86
    for: [java, class]
    if:
      type: symbol
      kind: call
      exact: setAccessible
    unless:
      - id: well-known/lib/runtime/managed/openjdk::jdk-distribution-artifact
  # Constant-pool form of the call above: some class files reference
  # setAccessible only in the constant pool without an emitted call record.
  - id: java-set-accessible-string
    desc: Java reflection accessibility override string
    crit: notable
    conf: 0.84
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      substr: setAccessible
    unless:
      - id: well-known/lib/runtime/managed/openjdk::jdk-distribution-artifact
