# A RuntimeMethodHandle's Value is the address of a JIT'd method's code or
# its precode stub. Script code reads it to patch, hook, or swap a managed
# method; ordinary reflection invokes methods and never needs their address.
defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-method-handle-value
    desc: Reads a managed method's code address
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\.[(''"\s]*MethodHandle[''")\s]*\.[(''"\s]*(Value|GetFunctionPointer\s*\()'
