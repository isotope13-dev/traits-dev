defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.9

traits:
- id: dalvik-reflect-constructor-class
  desc: Dalvik reflect Constructor descriptor
  conf: 0.84
  if:
    type: text
    substr: "Ljava/lang/reflect/Constructor;"

- id: reflective-access-bypass
  desc: DEX names setAccessible method
  conf: 0.86
  if:
    type: text
    substr: "setAccessible"
  unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
  - id: "micro-behaviors/metaprogramming/reflection/inspect/member::java-set-accessible"

  # Facebook Audience Network ships its ad code under assets/audience_network
  # (older builds say audience_network.dex) and loads it through
  # DynamicLoaderFactory with InMemoryDexClassLoader, the same gzip + assets +
  # files-dir shape as a staged payload loader.
