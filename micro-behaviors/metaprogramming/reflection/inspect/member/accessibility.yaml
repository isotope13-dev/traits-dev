defaults:
  platforms: [android, windows, unix]
  for: [class]
traits:
  - id: set-accessible-reference
    desc: JVM setAccessible name reference
    crit: notable
    conf: 0.9
    if:
      type: text
      word: "setAccessible"
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: "micro-behaviors/metaprogramming/reflection/inspect/member::java-set-accessible"

