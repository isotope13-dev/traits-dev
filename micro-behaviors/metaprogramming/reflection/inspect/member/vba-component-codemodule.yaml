# Reaching a named component's CodeModule through VBProject.VBComponents is
# how VBA reads or edits macro source at runtime; IDE helper add-ins do it.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  crit: notable
  conf: 0.92

traits:
  - id: vba-component-codemodule-reference
    desc: Accesses a named VBA component code module
    if:
      type: text
      regex: '(?i)\.VBProject\.VBComponents\s*\(\s*"?\w{1,40}"?\s*\)\.CodeModule\b'
