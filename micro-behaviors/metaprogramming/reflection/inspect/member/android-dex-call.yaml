defaults:
  platforms: [android]
  for: [dex]
traits:
  - id: dex-declared-method-call
    desc: DEX calls declared-method lookup
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/lang/Class;->getDeclaredMethod'
  - id: dex-reflective-method-invoke-call
    desc: DEX invokes reflective method
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/lang/reflect/Method;->invoke'
  - id: dex-parent-field-lookup-call
    desc: DEX reflectively looks up parent field
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: 'Ljava/lang/Class;->getDeclaredField'
      arg: {index: 0, kind: string, exact: parent}
  - id: dex-reflective-field-access-call
    desc: DEX changes reflected field accessibility
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/lang/reflect/Field;->setAccessible'
  - id: dex-reflective-field-write-call
    desc: DEX writes reflected field
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/lang/reflect/Field;->set'
