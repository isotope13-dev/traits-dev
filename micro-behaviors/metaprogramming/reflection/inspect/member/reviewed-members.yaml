composite_rules: []
traits:
- id: jvm-get-declared-field
  desc: JVM declared-field name reference
  crit: notable
  for:
  - class
  - dex
  if:
    type: text
    regex: \bgetDeclaredFields?\b
  platforms:
  - unix
  - windows
  - android
- id: java-reflect-field-set
  desc: JVM reflective field assignment reference
  crit: notable
  conf: 0.96
  platforms:
  - unix
  - windows
  for:
  - class
  if:
    type: import
    exact: java/lang/reflect/Field.set
