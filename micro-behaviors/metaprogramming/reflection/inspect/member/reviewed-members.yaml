composite_rules:
- id: jvm-reflection-with-process-creation
  desc: JVM reflection with process creation references
  crit: notable
  conf: 0.98
  for:
  - class
  - java_class
  scope: leaf
  all:
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::java-bytecode-reflective-method-invoke
  any:
  - id: micro-behaviors/process/create/exec::java-runtime-exec-bytecode-reference
  - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode-reference
  - id: micro-behaviors/process/create/spawn::java-runtime-exec
  - id: micro-behaviors/data/embedded/script::embedded-bash-shebang
  unless: []
  platforms:
  - unix
- id: java-bytecode-reflective-method-invoke
  desc: JVM resolves and invokes method reflectively
  crit: notable
  conf: 0.94
  platforms:
  - unix
  - windows
  - android
  for:
  - class
  - java_class
  - jar
  - zip
  - apk
  all:
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::java-class-forname-bytecode
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::java-class-getmethod-bytecode
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::java-method-invoke-bytecode
  unless:
  - id: well-known/lib/development/google-closure-compiler/
  - id: well-known/lib/development/args4j
  - id: well-known/lib/runtime/scripted/mozilla-rhino
  - id: well-known/lib/format/google-protobuf-java::generated-message-lite-class
traits:
- id: java-class-forname-bytecode
  desc: JVM Class.forName invocation
  crit: notable
  for:
  - class
  - java_class
  if:
    type: import
    exact: java/lang/Class.forName
  platforms:
  - unix
  - windows
- id: java-class-getmethod-bytecode
  desc: JVM reflective method lookup
  crit: notable
  for:
  - class
  - java_class
  if:
    type: import
    exact: java/lang/Class.getMethod
  platforms:
  - unix
  - windows
- id: java-method-invoke-bytecode
  desc: JVM reflective method invocation
  crit: notable
  for:
  - class
  - java_class
  if:
    type: import
    exact: java/lang/reflect/Method.invoke
  platforms:
  - unix
  - windows
- id: jvm-get-declared-field
  desc: JVM declared-field name reference
  crit: notable
  for:
  - class
  - dex
  if:
    type: text
    regex: \bgetDeclaredFields?\b
  platforms:
  - unix
  - windows
  - android
- id: java-reflect-field-set
  desc: JVM reflective field assignment reference
  crit: notable
  conf: 0.96
  platforms:
  - unix
  - windows
  for:
  - class
  if:
    type: import
    exact: java/lang/reflect/Field.set
