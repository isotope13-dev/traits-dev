defaults:
  crit: notable
  platforms: [windows, unix]
  for: [go]
traits:
  - id: go-reflect-heavy
    desc: Repeated Go reflection API calls
    conf: 0.8
    count_min: 3
    if:
      type: symbol
      kind: call
      regex: '^reflect\.'
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: metadata/package/testing/presence/harness::go-test-helper-file
composite_rules:
  - id: go-reflect-unsafe-combo
    desc: Go reflection with unsafe pointer conversion
    conf: 0.85
    all:
      - id: metadata/import/go/unsafe::unsafe
      - id: "micro-behaviors/metaprogramming/reflection/inspect/member::go-reflect-heavy"
      - id: metadata/lang/source/syntax/operator::go-unsafe-pointer-conversion
