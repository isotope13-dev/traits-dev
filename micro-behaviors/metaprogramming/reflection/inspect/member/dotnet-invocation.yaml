# Neutral observations and discriminating identities.
composite_rules:
- platforms:
  - unix
  - windows
  for:
  - pe
  id: activator-getmethod-references
  desc: Activator and GetMethod references
  crit: notable
  conf: 0.75
  all:
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::activator
  - id: micro-behaviors/metaprogramming/reflection/resolve::get-method-token
- platforms: &id001
  - windows
  for: &id002
  - pe
  - dll
  id: appdomain-exportedtype-invoke-references
  desc: AppDomain exported type reflection references
  crit: notable
  conf: 0.94
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-class-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/class::getdomain-member-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/class::get-exported-types-token
  - id: micro-behaviors/metaprogramming/reflection/resolve::get-methods-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/class::invoke-token
  any:
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-latecall-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/class::reflection-method-access
  - id: metadata/lang/compiler/managed::reflection-namespace
  downgrade:
    any:
    - id: metadata/lang/compiler/managed::reflection-emit
    - id: metadata/binary/vendor/
- platforms: *id001
  for: *id002
  id: appdomain-type-method-invoke-references
  desc: AppDomain type method reflection references
  crit: notable
  conf: 0.96
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: metadata/lang/compiler/managed::reflection-namespace
  - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-class-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/class::getdomain-member-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/class::gettypes-member-token
  - id: micro-behaviors/metaprogramming/reflection/resolve::get-methods-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/class::invoke-token
  downgrade:
    any:
    - id: metadata/lang/compiler/managed::reflection-emit
    - id: metadata/binary/vendor/
- platforms: *id001
  for: *id002
  id: exportedtype-constructor-invoke-references
  desc: Exported type constructor reflection references
  crit: notable
  conf: 0.93
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: metadata/lang/compiler/managed::reflection-namespace
  - id: micro-behaviors/metaprogramming/reflection/inspect/class::get-exported-types-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/class::get-constructors-token
  - id: micro-behaviors/metaprogramming/reflection/inspect/class::methodbase-class
  - id: micro-behaviors/metaprogramming/reflection/inspect/class::invoke-token
  any:
  - id: micro-behaviors/metaprogramming/reflection/inspect/class::get-assembly-token
  - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-assembly-type-reference
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::vb-latecall-token
  downgrade:
    any:
    - id: metadata/lang/compiler/managed::reflection-emit
    - id: metadata/binary/vendor/
- platforms: *id001
  for: *id002
  id: dotnet-reflection-invoke-references
  desc: .NET reflective invocation references
  crit: notable
  conf: 0.7
  any:
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::appdomain-exportedtype-invoke-references
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::exportedtype-constructor-invoke-references
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::appdomain-type-method-invoke-references
  - id: micro-behaviors/metaprogramming/reflection/inspect/member::activator-getmethod-references
  - id: metadata/lang/source/naming/action/function-name::load-and-invoke-name
  - id: micro-behaviors/metaprogramming/reflection/invoke::invoke-member-token
