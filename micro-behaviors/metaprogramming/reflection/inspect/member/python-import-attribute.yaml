defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-imported-module-attribute
    desc: Resolves a dynamically imported module attribute
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: getattr
      arg:
        index: 0
        from:
          call: '^__import__$'
