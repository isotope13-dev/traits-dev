defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-load-method-delegate-references
    desc: Managed Load/GetMethod/CreateDelegate references
    crit: notable
    conf: 0.92
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/lang/compiler/managed::reflection-namespace
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::load-member-token
      - id: micro-behaviors/metaprogramming/reflection/resolve::get-method-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::dotnet-create-delegate-reference

  # Delegate-based builds use Assembly.Load/GetMethod/CreateDelegate, without
  # AppDomain.CreateInstance or InvokeMember. These are activation APIs only.
  - id: managed-reflective-activation-references
    desc: Managed load and activation references
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::dotnet-appdomain-load-instance-tokens
      - id: managed-load-method-delegate-references

