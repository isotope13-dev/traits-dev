defaults:
  platforms: [windows, unix]
  for: [pe, csharp]
  crit: notable

traits:
  - id: activator-create
    desc: .NET creates an object through Activator
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: Activator.CreateInstance
    unless:
      - id: well-known/game/mod::bedrockboot-source-repository


  - id: dynamic-method-api-token
    desc: References the .NET DynamicMethod API
    crit: notable
    conf: 0.8
    for: [pe, dll, csharp]
    if:
      type: text
      word: DynamicMethod

  - id: activator-createinstance-token
    desc: .NET Activator.CreateInstance API reference
    conf: 0.8
    for: [pe, dll, csharp]
    if:
      type: text
      substr: Activator.CreateInstance

  - id: script-activator-createinstance-call
    desc: Script calls .NET Activator.CreateInstance
    crit: notable
    conf: 0.94
    platforms: [windows]
    for: [html, javascript, powershell]
    if:
      type: text
      regex: '(System\.)?Activator\.CreateInstance\s*\('

composite_rules:
  - id: dotnet-delegate-reflection-async-api-references
    for: [pe]
    desc: .NET delegate, reflection and async invocation references
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::dotnet-create-delegate-reference
      - id: metadata/lang/compiler/managed::reflection-namespace
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::reflection-method-access
    any:
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/invocation::begin-invoke-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/invocation::end-invoke-token
