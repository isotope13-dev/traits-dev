defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99
traits:
  - id: managed-activator-createinstance-call
    desc: Calls Activator.CreateInstance
    if:
      type: symbol
      kind: call
      exact: System.Activator.CreateInstance

composite_rules:
  # Parsed call offsets, rather than metadata heap co-occurrence. The load,
  # construction and dynamic binder are close together in one code region.
  # No CLR argument provenance is available: this is an activation cluster,
  # not a claim that any particular registry value reaches AppDomain.Load.
  - id: managed-load-activate-dynamic-dispatch-calls
    desc: Nearby assembly loading, activation and dynamic dispatch calls
    crit: notable
    near_bytes: 192
    all:
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/assembly::managed-appdomain-load-call
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/construction::managed-activator-createinstance-call
      - id: micro-behaviors/metaprogramming/reflection/invoke::managed-binder-invokemember-call
