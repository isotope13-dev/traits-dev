defaults:
  platforms: [windows, unix]
  for: [pe, csharp]
  crit: notable

traits:
  - id: dotnet-create-delegate-reference
    desc: .NET CreateDelegate method-name reference
    conf: 0.8
    if:
      type: text
      word: CreateDelegate
  # CIL call records carry the fully qualified target, so this matches a
  # compiled delegate DynamicInvoke dispatch. What the delegate points at is
  # established by consuming composites.
  - id: dotnet-delegate-dynamic-invoke-call
    desc: Calls .NET Delegate.DynamicInvoke
    conf: 0.9
    for: [pe, dll]
    if:
      type: symbol
      kind: call
      exact: System.Delegate.DynamicInvoke
