defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: dotnet-load-instance-dispatch-members
    desc: Managed load and instance dispatch references
    crit: notable
    conf: 0.92
    # Compiled CLR references are separate heap entries, not the dotted source
    # spelling Assembly.Load(...). This is co-occurrence, not a flow claim.
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: metadata/lang/compiler/managed::reflection-namespace
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::load-member-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::activator
      - id: metadata/binary/symbols/name/token/runtime::dotnet-create-instance-method-name
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/invocation::dotnet-metadata-invoke-members
