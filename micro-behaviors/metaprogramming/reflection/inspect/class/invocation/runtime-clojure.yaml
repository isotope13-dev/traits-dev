defaults:
  platforms: [unix, windows]
  for: [clojure]
  crit: notable
  conf: 0.88

composite_rules:
  - id: clojure-reflective-access-to-process-api
    desc: Reflection override near a JVM process API
    crit: suspicious
    conf: 0.9
    mbc: F0006
    attack: T1059
    all:
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::clojure-reflective-access-override
    any:
      - id: micro-behaviors/process/interpreter/runtime/jvm::clojure-jvm-runtime-accessor
      - id: micro-behaviors/process/create/subprocess/configure::clojure-process-builder-construct
    near_lines: 40
