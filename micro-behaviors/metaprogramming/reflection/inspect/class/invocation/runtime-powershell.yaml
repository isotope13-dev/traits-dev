defaults:
  platforms: [unix, windows]
  for: [powershell]
  crit: notable
  conf: 0.9

traits:
  - id: powershell-entrypoint-then-invoke
    desc: Stores EntryPoint then invokes it
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\.EntryPoint\b[\s\S]{0,160}\.Invoke\s*\('

  - id: powershell-fragmented-invoke-name
    desc: Fragmented reflected Invoke method name
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)["'']I["'']\s*\+\s*["'']nv["'']\s*\+\s*["'']ok["'']'


  - id: powershell-reflected-execute-method
    desc: Resolves a .NET method named Execute
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\.GetMethod\(\s*["'']Execute["'']\s*\)'

