defaults:
  conf: 0.7
  platforms: [unix, windows]
  for: [csharp, pe]
traits:
  # Delegate Invoke calls (including C# dynamic COM dispatch) are not reflection.
  - id: managed-reflection-invoke-call
    desc: .NET invokes a reflected method member
    crit: notable
    for: [pe]
    if:
      type: symbol
      kind: call
      regex: '^System\.Reflection\.(MethodBase|MethodInfo|ConstructorInfo)\.Invoke$'
composite_rules:
  - id: method-invoke
    desc: .NET reflected method invocation evidence
    crit: notable
    any:
      - id: managed-reflection-invoke-call
      - id: dotnet-reflected-method-invoke
