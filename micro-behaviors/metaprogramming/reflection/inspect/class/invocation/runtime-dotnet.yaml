defaults:
  platforms: [windows, unix]
  for: [pe, csharp]
  crit: notable

traits:
  - id: invoke-token
    desc: References the Invoke member name
    crit: component
    conf: 0.66
    if:
      type: text
      exact: Invoke

  - id: begin-invoke-token
    desc: BeginInvoke member-name token
    crit: component
    conf: 0.7
    if:
      type: text
      word: BeginInvoke

  - id: end-invoke-token
    desc: EndInvoke member-name token
    crit: component
    conf: 0.7
    if:
      type: text
      word: EndInvoke

  - id: dotnet-reflected-method-invoke
    desc: Invokes a reflected .NET method
    crit: notable
    conf: 0.9
    for: [csharp, asp, html, javascript]
    if:
      type: text
      regex: '(?is)\.GetMethod\([^)]{1,120}\)[\s\S]{0,512}\.Invoke\s*\('

