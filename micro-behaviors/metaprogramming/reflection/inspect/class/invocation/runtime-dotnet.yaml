defaults:
  platforms: [windows, unix]
  for: [pe, csharp]
  crit: notable

traits:
  - id: invoke-token
    desc: References the Invoke member name
    crit: component
    conf: 0.66
    if:
      type: text
      exact: Invoke

  - id: begin-invoke-token
    desc: BeginInvoke member-name token
    crit: component
    conf: 0.7
    if:
      type: text
      word: BeginInvoke

  - id: end-invoke-token
    desc: EndInvoke member-name token
    crit: component
    conf: 0.7
    if:
      type: text
      word: EndInvoke

  - id: dotnet-reflected-method-invoke
    desc: GetMethod followed by Invoke text
    crit: notable
    conf: 0.9
    for: [csharp, html, javascript]
    if:
      type: text
      regex: '(?s)\.GetMethod\([^)]{1,120}\)[\s\S]{0,512}\.Invoke\s*\('

  - id: asp-reflected-method-invoke
    desc: GetMethod followed by Invoke text
    for: [asp]
    if:
      type: text
      regex: '(?is)\.GetMethod\([^)]{1,120}\)[\s\S]{0,512}\.Invoke\s*\('


composite_rules:
  - id: dotnet-reflected-method-invoke-text
    desc: GetMethod followed by Invoke text
    for: [csharp, html, javascript, asp]
    any:
      - id: dotnet-reflected-method-invoke
      - id: asp-reflected-method-invoke
