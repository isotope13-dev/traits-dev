defaults:
  crit: notable
composite_rules:
  - platforms:
      - windows
    for:
      - pe
      - dll
    id: dotnet-metadata-invoke-members
    desc: MethodBase and Invoke metadata tokens in a compiled PE
    conf: 0.75
    all:
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::methodbase-class
      - id: metadata/binary/symbols/name/token/execution::invoke-word-token
