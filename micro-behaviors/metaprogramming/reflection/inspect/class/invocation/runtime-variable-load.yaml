defaults:
  platforms: [windows]
  for: [text, powershell]
  crit: notable
  conf: 0.95
traits:
  - id: powershell-variable-method-object-array-invoke
    desc: Variable method takes two object-array values
    if:
      type: text
      regex: '(?i)\$\w+\.\$\w+\(\$null,\s*\[object\[\]\]\s*\(\$\w+,\s*\$\w+\)\)'

