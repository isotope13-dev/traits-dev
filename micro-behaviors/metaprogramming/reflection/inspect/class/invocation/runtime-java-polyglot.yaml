defaults:
  platforms: [windows, unix]
  for: [json, python, javascript, typescript, java, go, ruby]
  attack: T1059

traits:
  - id: jvm-process-class-name
    desc: Names a JVM process class
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'java\.lang\.(Runtime|ProcessBuilder)\b'

  - id: jvm-reflective-process-method
    desc: Resolves a JVM process method
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'get(Declared)?Method\s*\(\s*["''](exec|start)["'']'

composite_rules:
  - id: polyglot-jvm-reflective-process-exec
    desc: Reflection invokes a JVM process API
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::jvm-class-metatype-bootstrap
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::jvm-reflective-class-resolution
      - id: jvm-process-class-name
      - id: jvm-reflective-process-method
    near_bytes: 2200
    unless:
      - id: well-known/tool/detection/teler/
