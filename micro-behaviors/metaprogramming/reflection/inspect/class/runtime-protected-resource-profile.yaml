# Co-occurrence establishes neither AES-to-resource data flow nor hostility.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: protected-resource-crypto-reflection-profile
    desc: Protected resource and crypto/reflection markers
    crit: notable
    conf: 0.82
    all:
      - id: metadata/build/protector::dotnet-reactor-module-guid-type
      - id: metadata/binary/resource/entropy::clr-resource-high-entropy
      - id: micro-behaviors/crypto/decrypt::dotnet-rijndael-decryptor
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::managed-resource-reflection-api-references
    unless:
      - id: metadata/signed/platform/
