defaults:
  platforms: [windows]
  for: [csharp]

traits:
  - id: csharp-xaml-parse-method-lookup
    desc: Reflects the XamlReader Parse method
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((invocation_expression function: (member_access_expression
          expression: (typeof_expression type: (_) @type)
          name: (identifier) @lookup)
          arguments: (argument_list (argument (string_literal) @method))) @evidence
          (#match? @type "(^|\\.)XamlReader$")
          (#eq? @lookup "GetMethod")
          (#eq? @method "\"Parse\""))
