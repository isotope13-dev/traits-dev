defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: powershell-msil-ldftn
  desc: PowerShell emits MSIL function-pointer opcode
  if:
    type: text
    regex: (?i)OpCodes\]\s*::\s*Ldftn
- id: powershell-msil-cpblk
  desc: PowerShell emits MSIL memory-copy opcode
  if:
    type: text
    regex: (?i)OpCodes\]\s*::\s*Cpblk
