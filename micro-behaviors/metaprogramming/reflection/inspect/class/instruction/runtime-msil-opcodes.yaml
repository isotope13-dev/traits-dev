defaults:
  for:
    - powershell
  platforms:
    - windows
  crit: notable
  conf: 0.98
traits:
  - id: powershell-msil-ldftn
    desc: References MSIL function-pointer opcode
    if:
      type: text
      regex: (?i)OpCodes\]\s*::\s*Ldftn
  - id: powershell-msil-cpblk
    desc: References MSIL memory-copy opcode
    if:
      type: text
      regex: (?i)OpCodes\]\s*::\s*Cpblk
