defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-base64-object-field-assembly-load
    desc: PowerShell loads Base64 object field bytes
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)Assembly\]\s*::Load\(\[byte\[\]\][^;]{0,32}FromBase64String\(\$\w+\.'
