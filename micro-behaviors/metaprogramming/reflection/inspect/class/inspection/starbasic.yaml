# OpenOffice/LibreOffice Basic library containers. GlobalScope.BasicLibraries
# (and DialogLibraries) are the application's shared macro libraries;
# BasicLibraries without GlobalScope are the current document's. Looking up a
# library or module by name inspects where macro code is installed.
defaults:
  for: [xml]
  platforms: [windows, unix]
  crit: notable
  conf: 0.93

traits:
  - id: starbasic-global-library-container
    desc: Basic references application macro libraries
    if:
      type: text
      regex: '\bGlobalScope\.(Basic|Dialog)Libraries\b'
  - id: starbasic-document-library-lookup
    desc: Basic looks up document macro libraries
    if:
      type: text
      regex: '(?s)[^.\w](Basic|Dialog)Libraries\b.{0,400}?\.hasByName\s*\('

composite_rules:
  - id: starbasic-application-and-document-library-lookup
    desc: Basic probes global and document libraries
    all:
      - id: starbasic-global-library-container
      - id: starbasic-document-library-lookup
    near_bytes: 2000
