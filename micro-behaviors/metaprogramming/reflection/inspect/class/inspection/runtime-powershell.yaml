defaults:
  platforms: [unix, windows]
  for: [powershell]
  crit: notable
  conf: 0.9

traits:
  - id: powershell-reflection-method-enumeration
    desc: Enumerates .NET methods before invoking
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?is)\.GetMethods\(\)[\s\S]{0,260}\.Invoke\('

  - id: powershell-split-currentdomain
    desc: Split-name CurrentDomain token
    crit: suspicious
    conf: 0.97
    for: [powershell, javascript, html, vbs, text, data]
    if:
      type: text
      regex: '[''\"]Cu[''\"]\s*\+\s*[''\"]rrentDomain[''\"]'

  - id: powershell-split-load-method
    desc: Split-name .NET Load method
    crit: suspicious
    conf: 0.97
    for: [powershell, javascript, html, vbs, text, data]
    if:
      type: text
      regex: 'GetMethod\(\s*[''\"]Lo[''\"]\s*\+\s*[''\"]ad[''\"]'


  # Loaders also invoke Assembly via indexer/concat: ::("Lo"+"ad").Invoke
  # rather than GetMethod('Lo'+'ad'). Keep separate so either shape scores.
  - id: js-unicode-shifted-split-load
    desc: Unicode-shifted split Load method
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: "جُ؇؋؇فل"

