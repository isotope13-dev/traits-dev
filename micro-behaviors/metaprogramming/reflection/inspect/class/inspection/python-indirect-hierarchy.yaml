# Text scope covers Python expressions carried as tool arguments in prompts.
# Match executable syntax rather than the surrounding natural-language directive.
defaults:
  for: [python, text]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: python-indirect-class-access
    desc: Resolves class through direct attribute lookup
    if:
      type: text
      regex: '__getattribute__\(\s*["'']__class__["'']\s*\)'
  - id: python-indirect-subclasses-call
    desc: Invokes indirectly resolved subclass enumeration
    if:
      type: text
      regex: '__getattribute__\([^;\r\n]{0,140}["'']__subclasses__["'']\s*\)\s*\('
