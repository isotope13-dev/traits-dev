defaults:
  platforms: [windows]
  for: [text, powershell]
  crit: notable
  conf: 0.95
traits:
  - id: powershell-variable-static-load-sequence
    desc: Variable-named static Load call sequence
    if:
      type: text
      regex: '(?is)\$\w+\s*=\s*[''"]Load[''"].{0,180}\$\w+::\$\w+\(\$\w+\)'
  - id: powershell-method-two-variable-arguments
    desc: Reflected method takes two variable arguments
    if:
      type: text
      regex: '(?is)\.[''\"]?GetMethod[''\"]?\(\$\w+\)[\s\S]{0,400}\.Invoke\(\$\w+,\s*\(\$\w+,\$\w+\)\)'
