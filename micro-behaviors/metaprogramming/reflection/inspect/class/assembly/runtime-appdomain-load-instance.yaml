defaults: {}
composite_rules:
  - platforms:
      - windows
    for:
      - pe
      - dll
    id: dotnet-appdomain-load-instance-tokens
    desc: AppDomain load and reflective instance references
    crit: notable
    conf: 0.96
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-class-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::load-member-token
      - id: micro-behaviors/metaprogramming/reflection/invoke::invoke-member-token
      - id: metadata/binary/symbols/name/token/runtime::dotnet-create-instance-method-name
