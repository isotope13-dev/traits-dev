defaults:
  platforms: [windows, unix]
  for: [pe, csharp]
  crit: notable

composite_rules:
  - id: csharp-assembly-load-reflected-invoke
    desc: C# assembly loading alongside reflected method invocation
    crit: notable
    conf: 0.96
    attack: T1620
    for: [csharp]
    near_bytes: 1024
    all:
      - id: micro-behaviors/metaprogramming/reflection/resolve::assembly-load
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::csharp-reflection-method-lookup
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/invocation::dotnet-reflected-method-invoke

