defaults:
  platforms: [unix, windows]
  for: [powershell]
  crit: notable
  conf: 0.9

traits:
  - id: powershell-assembly-entrypoint-invoke
    desc: PowerShell invokes a .NET assembly entry point
    if:
      type: text
      regex: '(?i)\.EntryPoint\.Invoke\('

  - id: powershell-appdomain-reflected-load-invoke
    desc: PowerShell invokes AppDomain assembly loading
    if:
      type: text
      regex: '(?is)AppDomain.{0,160}CurrentDomain.{0,240}GetMethod\([''\"]Load[''\"].{0,200}\.Invoke\('

  # JScript/HTA loaders often split method names inside the PowerShell string
  # they stage (for example, `GetMethod('Lo'+'ad', ...)`). Keep the split
  # fragments atomic so each matcher stays short and reusable.
  - id: powershell-appdomain-currentdomain-load
    desc: PowerShell AppDomain assembly load
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bAppDomain\b.{0,80}\bCurrentDomain\b.{0,80}\.Load\s*\('

  - id: powershell-split-assembly-load-invoke
    desc: Split-name Assembly Load invoke
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)Assembly\s*\]\s*::\s*\(\s*"Lo"\s*\+\s*"ad"\s*\)\s*\.Invoke\('

  - id: js-unicode-shifted-assembly-fragment
    desc: Unicode-shifted Assembly fragment
    crit: notable
    conf: 0.99
    for: [javascript]
    if:
      type: text
      substr: "؎ءٓٓم"

  - id: powershell-psobject-assembly-gettype
    desc: Resolves types via PSObject Assembly
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\[psobject\]\s*\.\s*Assembly\s*\.\s*GetType\s*\('

composite_rules:
  - id: powershell-appdomain-split-reflected-load
    desc: Split-name AppDomain reflective load
    crit: suspicious
    conf: 0.98
    for: [powershell, javascript, html, vbs, text, data]
    all:
      - id: micro-behaviors/process/interpreter/runtime/clr::powershell-appdomain-token
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::powershell-split-currentdomain
      - id: micro-behaviors/metaprogramming/reflection/inspect/class/inspection::powershell-split-load-method
      - id: micro-behaviors/metaprogramming/reflection/invoke::powershell-assembly-method-invoke
