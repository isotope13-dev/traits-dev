defaults:
  crit: notable
traits:
  - platforms:
      - windows
      - unix
    for:
      - pe
      - dll
      - csharp
    id: get-assembly-token
    desc: .NET Assembly accessor reference
    conf: 0.78
    if:
      type: text
      exact: get_Assembly
composite_rules:
  - platforms:
      - windows
    for:
      - pe
      - dll
    id: managed-resource-reflection-api-references
    desc: Managed resource and reflection API references
    conf: 0.8
    near_bytes: 131072
    all:
      - id: metadata/lang/compiler/managed::dotnet-metadata
      - id: micro-behaviors/data/embedded/resource::dotnet-managed-resource-access
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::activator
    any:
      - id: micro-behaviors/metaprogramming/reflection/resolve::get-method-token
      - id: micro-behaviors/metaprogramming/reflection/resolve::get-methods-token
    unless:
      - id: metadata/signature/verified/platform::microsoft
      - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-framework-system-native-image
      - id: well-known/app/productivity/jitbit-macro-recorder::known-binary-context
