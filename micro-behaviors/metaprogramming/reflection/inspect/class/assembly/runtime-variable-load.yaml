defaults:
  platforms: [windows]
  for: [text, powershell]
  crit: notable
  conf: 0.95
traits:
  - id: powershell-assembly-type-variable
    desc: Binds Reflection.Assembly to a variable
    if:
      type: text
      regex: '\$\w+\s*=\s*\[[^\]\r\n]{0,24}Reflection\.Assembly[^\]\r\n]{0,24}\]'

composite_rules:
  - id: powershell-variable-assembly-load
    desc: PowerShell loads assembly through variables
    near_bytes: 400
    all:
      - id: powershell-assembly-type-variable
      - id: 
          micro-behaviors/metaprogramming/reflection/inspect/class/inspection::powershell-variable-static-load-sequence
