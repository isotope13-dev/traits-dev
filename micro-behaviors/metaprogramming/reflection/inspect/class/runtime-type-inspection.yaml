defaults:
  conf: 0.7
  platforms: [unix, windows]
  for: [csharp, pe]

traits:
  - id: method-invoke
    desc: .NET invokes a reflected method member
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '\.Invoke$'
  - id: get-type-call
    desc: GetType method call text
    crit: notable
    if:
      type: text
      substr: GetType(
