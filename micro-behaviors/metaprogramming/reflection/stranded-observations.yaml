# Neutral observations reviewed from stranded members.
composite_rules:
- id: appdomain-unsigned-filename-mismatch
  desc: AppDomain reference in an unsigned filename-mismatched PE
  crit: notable
  conf: 0.95
  all:
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: metadata/binary/provenance/version-info::pe-non-architecture-filename-mismatch
  - id: micro-behaviors/process/interpreter/reflection/runtime::appdomain-class-token
  unless:
  - id: metadata/signed/platform/
  - id: well-known/dual-use/tunnel/netch::netch-executable
  - id: well-known/app/utility/watt-toolkit/
  - id: well-known/game/bettergi::bettergi-apphost-identity
  - id: well-known/lib/platform/squirrel::squirrel-vendor-binary-context
  for:
  - pe
  - dll
  platforms:
  - windows
