# Dobby is an in-process native hook library.  The API symbol is a neutral
# capability marker; malicious intent requires additional objective evidence.
defaults:
  platforms: [unix, android, windows]
  for: [elf, macho, pe]

traits:
  - id: dobby-hook-api
    desc: Dobby inline-hook API symbol
    crit: notable
    conf: 0.94
    if:
      type: symbol
      exact: DobbyHook

  - id: dobby-codepatch-api
    desc: CodePatch code-writing API symbol
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: CodePatch
