# The A64_HOOK tag marks an ARM64 inline-hook engine (map enumeration plus
# code patching) seen in repackaged-game mod libraries. The marker is a
# neutral capability: mods, hot-fix loaders, and anti-tamper layers build on
# the same framework, so intent requires objective evidence elsewhere.
defaults:
  crit: notable
  platforms: [android, unix]
  for: [elf]

traits:
  - id: a64-hook-framework-marker
    desc: ARM64 inline-hook framework marker
    conf: 0.9
    if:
      type: text
      substr: "A64_HOOK"
