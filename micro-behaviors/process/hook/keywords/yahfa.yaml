# YAHFA (Yet Another Hook Framework for Android) in-process Java-method hooks.
# The framework reference and the generic hook call are neutral capability
# markers; the targeted atoms below name the security API passed as the
# hook target, which is what distinguishes check-blinding from ordinary
# instrumentation. Malicious intent requires an objective composite.
defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: notable
  conf: 0.93

traits:
  - id: yahfa-framework-reference
    desc: YAHFA Android hook framework reference
    if:
      type: text
      substr: lab.galaxy.yahfa

  - id: yahfa-method-hook-call
    desc: YAHFA findAndHookMethod hook call
    conf: 0.95
    if:
      type: symbol
      kind: call
      substr: findAndHookMethod

  # Hooks the PackageManager query a banking app uses to read its own
  # signing certificate, so the hook can replay the genuine certificate
  # over a test-key signature. Security research hooks APIs too, so this
  # stays suspicious until a composite pairs it with certificate handling.
  - id: yahfa-hooks-package-signature
    desc: YAHFA hooks the package signature query
    crit: suspicious
    conf: 0.96
    if:
      type: symbol
      kind: call
      substr: findAndHookMethod
      arg:
        kind: string
        substr: getPackageInfo

  # Hooks the AccessibilityManager query that lists enabled services, so
  # the hook can return an empty list and hide the controlling service.
  - id: yahfa-hooks-accessibility-list
    desc: YAHFA hooks the accessibility service list query
    crit: suspicious
    conf: 0.96
    if:
      type: symbol
      kind: call
      substr: findAndHookMethod
      arg:
        kind: string
        substr: getEnabledAccessibilityServiceList
