# Neutral keywords related to detours/hooking
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts]
traits:
  - id: detour
    desc: References API detouring terminology
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: '(?i)\b(api|hook)[ _-]?detour(s|ing)?\b|\bdetour(s|ing)?[ _-]?(api|hook)\b'
    unless:
      - id: metadata/lang/locale::binary-lang-string-catalog
      - id: metadata/file/catalog/identity/
      - id: well-known/game/mod::bedrockboot-preload-cpp-pdb
    not:
      # Promoted detour slot names are UI selectors, not API detouring or a
      # process hook.
      - regex: (?i)\bpromoted[\w-]*detour[\w-]*\b
    downgrade:
      any:
        - id: metadata/signed/platform::apple

  - id: hotpatch-term
    desc: References hot-patching terminology
    platforms: [windows]
    for: [pe, dll, c, cpp]
    crit: component
    conf: 0.75
    if:
      type: text
      regex: (?i)\bhot.?patch(ing)?\b
  # The name of clrjit's exported JIT factory, as a string in some other
  # binary: a JIT-hooking loader looks it up to patch the compiler. The
  # runtime itself exports it rather than naming it, so this is a reference.
  - id: clr-getjit-name-reference
    desc: Names the CLR getJit entry point
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      exact: getJit
