# Neutral keywords related to detours/hooking
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts]
traits:
  - id: detour
    desc: References API detouring terminology
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: '(?i)\b(api|hook)[ _-]?detour(s|ing)?\b|\bdetour(s|ing)?[ _-]?(api|hook)\b'
    unless:
      - id: metadata/file/profile/locale::binary-lang-string-catalog
      - id: metadata/file/catalog/identity/
      - id: well-known/game/mod::bedrockboot-preload-cpp-pdb
    not:
      # Promoted detour slot names are UI selectors, not API detouring or a
      # process hook.
      - regex: (?i)\bpromoted[\w-]*detour[\w-]*\b
    downgrade:
      any:
        - id: metadata/signed/platform::apple
