defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: browser-dom-remove-child-hook
    desc: Replaces native DOM child removal
    conf: 0.98
    if:
      type: tree-sitter
      kind: assignment
      regex: '^Node[.]prototype[.]removeChild\s*='
  - id: browser-dom-append-child-hook
    desc: Replaces native DOM child insertion
    conf: 0.98
    if:
      type: tree-sitter
      kind: assignment
      regex: '^Node[.]prototype[.]appendChild\s*='
  - id: browser-dom-insert-before-hook
    desc: Replaces native DOM insertBefore
    conf: 0.98
    if:
      type: tree-sitter
      kind: assignment
      regex: '^Node[.]prototype[.]insertBefore\s*='
  - id: browser-service-worker-registration-hook
    desc: Replaces service-worker registration function
    conf: 0.98
    if:
      type: tree-sitter
      kind: assignment
      regex: '^navigator[.]serviceWorker[.]register\s*='
