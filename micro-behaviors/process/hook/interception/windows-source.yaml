defaults:
  platforms: [windows]
  for: [c, cpp]

traits:
  - id: iat-hook-symbol
    desc: IAT hook helper symbol
    crit: notable
    conf: 0.96
    if:
      type: symbol
      regex: ^winhook_iathook(pe|module)?$

  - id: pe-import-directory-source
    desc: PE import directory access
    crit: notable
    conf: 0.92
    if:
      type: text
      word: IMAGE_DIRECTORY_ENTRY_IMPORT

  - id: first-thunk-source
    desc: PE FirstThunk access
    crit: notable
    conf: 0.92
    if:
      type: text
      word: FirstThunk

  - id: inline-hook-wrapper-symbol
    desc: Inline hook wrapper symbol
    crit: notable
    conf: 0.96
    if:
      type: symbol
      regex: ^winhook_inline(un)?hooks

  - id: minhook-init-source
    desc: MinHook initialize call
    crit: notable
    conf: 0.97
    if:
      type: symbol
      exact: MH_Initialize

  - id: minhook-createhook-source
    desc: MinHook CreateHook call
    crit: notable
    conf: 0.97
    if:
      type: symbol
      exact: MH_CreateHook

  - id: minhook-create-thread-target-source
    desc: MinHook targets the CreateThread API
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'MH_CreateHook(Api(Ex)?)?\s*\([^;]{0,240}&?\s*CreateThread\b'

  - id: animate-window-page-patch-source
    desc: Changes protection on AnimateWindow code
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'VirtualProtect\s*\([^;\n]{0,100}&?\s*AnimateWindow\s*,'

  - id: animate-window-thread-start-source
    desc: Assigns AnimateWindow as thread start
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'lpStartAddress\s*=\s*[^;\n]{0,100}\bAnimateWindow\b'

composite_rules:
  - id: iat-hooking-source
    desc: PE import table hooking source
    crit: suspicious
    conf: 0.94
    all:
      - id: iat-hook-symbol
      - id: pe-import-directory-source
      - id: first-thunk-source

  - id: inline-hooking-source
    desc: Inline API hooking wrapper source
    crit: suspicious
    conf: 0.94
    all:
      - id: inline-hook-wrapper-symbol
      - id: minhook-init-source
      - id: minhook-createhook-source
