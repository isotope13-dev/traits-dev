# Microsoft Detours is the reference in-process function-interception library:
# a transaction brackets one or more DetourAttach calls, each of which rewrites
# the prologue of a target function with a jump to a replacement and hands back
# a trampoline to the original. Compatibility shims, instrumentation, telemetry
# wrappers and game mods all use it, so these atoms are neutral capabilities.
# Whether the interception is hostile depends on WHICH function is hooked and
# where the intercepted data goes; that inference lives in the objective
# composites (credential-API hooking, WebAuthn assertion capture).
#
# Kept as `text` rather than `symbol` so the same names are recovered from C/C++
# sources (where DetourAttach is a macro-wrapped call) and from compiled images.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries, c, cpp]
  crit: notable
  conf: 0.9
  attack: T1574
  mbc: F0015

traits:
  - id: detours-transaction-begin
    desc: Opens a Detours hook transaction
    conf: 0.9
    if:
      type: text
      word: DetourTransactionBegin

  - id: detours-attach
    desc: Attaches a Detours function interception
    conf: 0.9
    if:
      type: text
      word: DetourAttach

  - id: detours-trampoline
    desc: References a Detours hook trampoline
    conf: 0.85
    if:
      type: text
      word: DetourTrampoline

composite_rules:
  # The attach call plus its enclosing transaction (or the trampoline it yields)
  # is a complete hook installation rather than a stray mention of the library.
  - id: detours-inline-hook-install
    desc: Installs an in-process hook with Detours
    crit: notable
    conf: 0.95
    all:
      - id: detours-attach
    any:
      - id: detours-transaction-begin
      - id: detours-trampoline
