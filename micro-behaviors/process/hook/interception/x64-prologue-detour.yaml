# x64 code that stages a 5-byte relative JMP (`0xE9 <rel32>`) on the stack and
# writes the 4+1 bytes over a target function prologue.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  attack: T1574

traits:
  - id: x64-five-byte-rel32-prologue-patch
    desc: Patches five-byte E9 jump over function prologue
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'C6 44 24 ?? E9 [0-4] 89 ?? 24 ?? [8-40] 8B ?? 24 ?? [0-20] 89 (00|01|02|03|06|07) 8A ?? 24 ?? 88 (40|41|42|43|46|47) 04'
