defaults:
  platforms: [windows, unix]
  for: [javascript]

traits:
  - id: node-module-load-hook
    desc: Node Module._load assignment
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bModule\._load\s*='

  - id: browser-form-value-descriptor-read
    desc: Reads native browser form value descriptors
    crit: notable
    conf: 0.94
    count_min: 2
    if:
      type: text
      regex: 'getOwnPropertyDescriptor\(\s*HTML(Input|TextArea)Element\.prototype'

  - id: browser-form-value-property-override
    desc: Overrides native browser form value properties
    crit: notable
    conf: 0.96
    count_min: 2
    if:
      type: text
      regex: 'defineProperty\(\s*HTML(Input|TextArea)Element\.prototype\s*,\s*[''"]value'

composite_rules:
  - id: browser-form-value-setter-hook
    desc: Hooks native browser form value setters
    crit: suspicious
    conf: 0.98
    near_bytes: 1600
    all:
      - id: browser-form-value-descriptor-read
      - id: browser-form-value-property-override
