defaults:
  platforms: [windows, unix]
  for: [javascript]

traits:
  - id: node-module-wrap-override
    desc: Overrides the Node module wrapper
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: "require\\(['\"]module['\"]\\)\\.wrap\\s*=\\s*(override|function)"

  - id: node-module-load-hook
    desc: Node Module._load assignment
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bModule\._load\s*='

  - id: browser-form-value-property-override
    desc: Overrides native browser form value properties
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'defineProperty\(\s*HTML(Input|TextArea)Element\.prototype\s*,\s*[''"]value'

  - id: browser-ethereum-request-assignment
    desc: Overrides window.ethereum.request
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bwindow\.ethereum\.request\s*='

  - id: browser-solana-request-assignment
    desc: Overrides window.solana request
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bwindow\.solana\.(request|send)\s*='

  - id: browser-global-ethereum-request-assignment
    desc: Overrides global Ethereum request
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b(globalThis|self)\.ethereum\.request\s*='

  - id: websocket-add-event-listener-prototype-assignment
    desc: Overrides WebSocket event listener method
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(Native)?WebSocket\.prototype\.addEventListener\s*='

  - id: websocket-onmessage-prototype-redefinition
    desc: Redefines WebSocket message handler property
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: 'defineProperty\(\s*(Native)?WebSocket\.prototype\s*,\s*["'']onmessage'

composite_rules:
  - id: browser-wallet-provider-method-assignment
    desc: Overrides an injected wallet provider method
    crit: notable
    conf: 0.95
    any:
      - id: browser-ethereum-request-assignment
      - id: browser-solana-request-assignment
      - id: browser-global-ethereum-request-assignment

  - id: browser-form-value-setter-hook
    desc: Hooks native browser form value setters
    crit: suspicious
    conf: 0.98
    near_bytes: 1600
    all:
      - id: micro-behaviors/ui/window/form-input::browser-native-form-value-descriptor-read
      - id: browser-form-value-property-override
