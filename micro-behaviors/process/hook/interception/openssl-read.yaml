# A plaintext-read wrapper is also used by legitimate instrumentation. Only
# objective consumers add the protocol-specific key-collection context.
defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: notable
  conf: 0.97

traits:
  - id: ssl-read-function-definition
    desc: Defines OpenSSL plaintext-read entry point
    if:
      type: symbol
      kind: function
      exact: SSL_read

composite_rules:
  - id: openssl-read-interposition
    desc: Overrides OpenSSL read and resolves original
    all:
      - id: ssl-read-function-definition
      - id: micro-behaviors/dylib/lookup::rtld-next-ssl-read-call
