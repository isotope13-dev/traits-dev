defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: notable
  conf: 0.96

traits:
  - id: ruby-aliases-fork-for-debugger
    desc: Ruby aliases fork for debugger
    if:
      type: text
      substr: "alias pre_debugger_fork fork"

  - id: ruby-aliases-exec-for-debugger
    desc: Ruby aliases exec for debugger
    if:
      type: text
      substr: "alias pre_debugger_exec exec"

  - id: ruby-restores-debugger-fork-alias
    desc: Ruby restores debugger fork alias
    if:
      type: text
      substr: "alias fork pre_debugger_fork"

  - id: ruby-restores-debugger-exec-alias
    desc: Ruby restores debugger exec alias
    if:
      type: text
      substr: "alias exec pre_debugger_exec"

composite_rules:
  - id: ruby-debugger-hook-install
    desc: Ruby installs fork and exec debugger hooks
    crit: exception
    conf: 0.99
    all:
      - id: ruby-aliases-fork-for-debugger
      - id: ruby-aliases-exec-for-debugger

  - id: ruby-debugger-hook-restore
    desc: Ruby restores fork and exec debugger hooks
    crit: exception
    conf: 0.99
    all:
      - id: ruby-restores-debugger-fork-alias
      - id: ruby-restores-debugger-exec-alias
