# Reports the supported capability or configuration without inferring hostile intent.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - pe
  - shell
  - python
  - javascript
traits:
- id: iat-hook-phrase
  desc: Import Address Table hooking phrase
  crit: notable
  conf: 0.9
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    regex: (?i)\b(IAT|Import Address Table)[\s_-]*(hook|patch|intercept)(\s+\w+)?
  not:
  - regex: (?i)\b(IAT|Import Address Table)[\s_-]*(hook|patch|intercept)\s+(detect|found|check|scan|monitor)
  unless:
  - id: well-known/lib/ui/cef/
  - id: well-known/lib/runtime/scripted/electron::cef-engine-binary-basename
