defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: native-wmi-getter-patching-api-profile
    desc: WMI getter target with code-patching APIs
    crit: suspicious
    conf: 0.92
    # Co-occurrence supports probable native interception; it does not prove
    # which properties are replaced, persistence, or credential collection.
    all:
      - id: micro-behaviors/os/wmi/query::cwbemobject-get-export-reference
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/mem/sync/cache::flush-instruction-cache
