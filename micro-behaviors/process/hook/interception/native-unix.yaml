# Resolving the next implementation of accept/accept4 and then exporting a
# replacement is the standard native interposition shape. Instrumentation and
# compatibility shims can do this legitimately, so the mechanic remains a
# notable capability; credential-access objectives add the targeted service
# and session-relay context.
defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: T1574.006

traits:
  - id: dlsym-accept-resolution
    desc: Resolves an accept socket function
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: dlsym
      arg:
        kind: string
        regex: '^accept4?$'

  - id: plthook-accept-replacement
    desc: Replaces accept through PLT hook
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: plthook_replace
      arg:
        kind: string
        regex: '^accept4?$'

  - id: native-accept-export
    desc: Exports an accept socket replacement
    crit: notable
    conf: 0.98
    for: [elf, so]
    if:
      type: export
      regex: '^accept4?$'

composite_rules:
  - id: rtld-next-accept-resolution
    desc: Resolves original accept via RTLD_NEXT
    crit: notable
    conf: 0.98
    near_bytes: 160
    all:
      - id: dlsym-accept-resolution
      - id: micro-behaviors/dylib/lookup::rtld-next-source

  - id: binary-accept-interposition
    desc: Binary interposes socket acceptance
    crit: notable
    conf: 0.98
    for: [elf, so]
    all:
      - id: native-accept-export
      - id: micro-behaviors/dylib/lookup::dlsym-symbol

  - id: binary-accept-sendmsg-relay
    desc: Accept hook relays sessions via sendmsg
    crit: notable
    conf: 0.99
    for: [elf, so]
    all:
      - id: binary-accept-interposition
      - id: micro-behaviors/communications/socket/send::sendmsg-symbol

  - id: posix-accept-interposition
    desc: Interposes POSIX connection acceptance
    crit: notable
    conf: 0.98
    for: [c, cpp, elf, so]
    any:
      - id: rtld-next-accept-resolution
      - id: plthook-accept-replacement
      - id: binary-accept-interposition
