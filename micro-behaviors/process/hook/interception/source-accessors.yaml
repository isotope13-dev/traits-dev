# Nonconfigurable empty getters are observable instrumentation. A payload
# composite adds concealment and execution context.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: browser-source-shadow-accessors
    desc: Nonconfigurable empty element-source accessors
    crit: notable
    conf: 0.98
    count_min: 3
    if:
      type: tree-sitter
      query: |-
        ((call_expression
          function: (member_expression
            object: (identifier) @object
            property: (property_identifier) @method)
          arguments: (arguments
            (identifier)
            (string) @property
            (object
              (pair key: (property_identifier) @config value: (false))
              (pair key: (property_identifier) @setter
                value: (function_expression body: (statement_block)))
              (pair key: (property_identifier) @getter
                value: (function_expression body: (statement_block
                  (return_statement (string) @empty)))))))
        (#eq? @object "Object")
        (#eq? @method "defineProperty")
        (#match? @property "^.(textContent|text|innerHTML).$")
        (#eq? @config "configurable")
        (#eq? @setter "set")
        (#eq? @getter "get")
        (#match? @empty "^['\"]{2}$"))
