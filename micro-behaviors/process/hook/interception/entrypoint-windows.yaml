# x86 code that resolves the current process image entry point and overwrites
# it with a push-immediate/ret trampoline.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1574

traits:
  - id: x86-current-image-entrypoint-address
    desc: Resolves current image entry point
    crit: notable
    conf: 0.98
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: '8B 45 ?? 89 45 ?? 8B 45 ?? 8B 40 3C 03 45 ?? 89 45 ?? 8B 45 ?? 8B 40 28 03 45 ?? 89 45 ??'

  - id: x86-entrypoint-push-ret-write
    desc: Writes push-ret entry trampoline
    crit: suspicious
    conf: 0.99
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: '8D 45 ?? 50 6A 40 6A 06 8B 45 ?? 50 E8 ?? ?? ?? ?? 8B 45 ?? C6 00 68 B8 ?? ?? ?? ?? 8B 55 ?? 42 89 02 8B 45 ?? 40 83 C0 04 C6 00 C3'
