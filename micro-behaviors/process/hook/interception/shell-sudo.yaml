defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.95
traits:
  - id: javascript-sudo-function-definition
    desc: Defines a sudo function in JS/TS text
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      # Permit a quote/backtick before the command when it is embedded in a
      # JavaScript or TypeScript string/template literal.
      regex: '(?m)^\s*["`]?\s*sudo\s*\(\s*\)\s*\{'
  - id: shell-sudo-function-definition
    desc: Defines a shell function named sudo
    if:
      type: function
      exact: sudo
  - id: shell-sudo-command-override
    platforms: [unix, windows]
    desc: Overrides sudo via alias or function
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?m)^\s*(alias\s+sudo\s*=|function\s+sudo\s*(\(\s*\))?\s*\{|sudo\s*\(\s*\)\s*\{)'
