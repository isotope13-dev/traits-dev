defaults:
  platforms: [unix]

composite_rules:
- id: filesystem-rtld-next-reference-profile
  desc: RTLD_NEXT beside filesystem API declarations
  crit: notable
  conf: 0.92
  for:
  - c
  - cpp
  all:
  - id: micro-behaviors/dylib/lookup::rtld-next-source
  any:
  - id: metadata/lang/source/naming/interface::readdir64-reference
  - id: metadata/lang/source/declaration::c-access-function-signature
  - id: metadata/lang/source/naming/function::lxstat-source-reference
  - id: metadata/lang/source/declaration::c-lstat-function-signature
