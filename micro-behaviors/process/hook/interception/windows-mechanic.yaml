# One name for "this code installs an in-process function hook on Windows",
# whichever mechanic it uses: the Detours library, MinHook, or a hand-rolled
# import-table / prologue patch. Objective composites that care about WHAT is
# hooked (a credential API, the WebAuthn assertion boundary) reference this
# instead of enumerating every hooking library, so a new library only has to be
# added here once.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  attack: T1574

composite_rules:
  - id: windows-inline-hook-mechanic
    desc: Installs an in-process Windows function hook
    crit: notable
    conf: 0.92
    any:
      - id: detours-inline-hook-install
      - id: iat-hooking-source
      - id: inline-hooking-source
      - id: iat-hook-symbol
      - id: inline-hook-wrapper-symbol
