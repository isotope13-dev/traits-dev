defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  # A message event can belong to an in-process emitter, IPC, or a socket.
  # The event name alone does not identify its transport.
  - id: js-event-on-message
    desc: JavaScript 'message' event listener
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '\.on$'
      arg:
        index: 0
        kind: string
        exact: message

