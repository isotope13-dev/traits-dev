defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: readystatechange-handler
    desc: Assigns an onreadystatechange handler
    crit: notable
    conf: 0.7
    if:
      type: symbol
      kind: bind
      regex: '^[A-Za-z_$][A-Za-z0-9_$.]*\.onreadystatechange$'

  # Bracket-quoted process.on form is common in minified/emscripten runtimes.
  # Session-wipe malware pairs this with an encoded rm; that intent stays in
  # objectives/impact/destroy composites.
  - id: process-on-uncaught-exception
    desc: Node process uncaughtException handler
    crit: notable
    conf: 0.90
    if:
      type: text
      substr: "process['on']('uncaughtException'"
    unless:
      - id: metadata/file/format::sourcemap
      - id: metadata/file/format::sourcemap-context
