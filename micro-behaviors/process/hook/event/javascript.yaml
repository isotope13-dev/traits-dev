defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  # `readystatechange-handler` moved to
  # micro-behaviors/communications/http/client/xmlhttp::xhr-readystatechange-handler.
  # Assigning `onreadystatechange` on an XHR you created is how the XHR API is
  # used (jQuery's ajax transport does it); it intercepts nothing, so it is a
  # client capability rather than an API hook.

  - id: browser-copy-cut-event-handler
    desc: Registers browser copy or cut handler
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^([A-Za-z_$][A-Za-z0-9_$]*\.)?addEventListener$'
      arg:
        kind: string
        regex: '^(copy|cut)$'

  - id: process-on-uncaught-exception
    desc: Node process uncaughtException handler
    crit: notable
    conf: 0.90
    if:
      type: text
      regex: 'process(\.on|\[[''\"]on[''\"]\])\(\s*[''\"]uncaughtException[''\"]'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/file/format/structured::sourcemap
      - id: metadata/file/format/structured::sourcemap-context

  - id: process-on-unhandled-rejection
    desc: Node process unhandledRejection handler
    crit: notable
    conf: 0.90
    if:
      type: text
      regex: 'process(\.on|\[[''\"]on[''\"]\])\(\s*[''\"]unhandledRejection[''\"]'
    unless:
      - id: metadata/file/format/structured::sourcemap
      - id: metadata/file/format/structured::sourcemap-context
