defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable

traits:
  # Every installable plugin registers one; a lifecycle hook, not intent.
  - id: wordpress-activation-hook
    desc: Registers a WordPress plugin activation hook
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: register_activation_hook

  # Membership and directory plugins filter the user list this way too; the
  # concealment reading needs the excluded-login predicate beside it.
  - id: wordpress-pre-user-query-hook
    desc: Hooks the WordPress user-list query
    conf: 0.9
    if:
      type: text
      word: pre_user_query

  - id: wordpress-plugin-update-filter
    desc: Hooks WordPress plugin update checks
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: add_filter
      arg:
        kind: string
        exact: pre_set_site_transient_update_plugins

  - id: wordpress-all-plugins-filter
    desc: Hooks the WordPress installed-plugin list
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: add_filter
      arg:
        kind: string
        exact: all_plugins

  - id: wordpress-mu-plugins-filter
    desc: Hooks the WordPress Must-Use plugin list
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: add_filter
      arg:
        kind: string
        exact: show_advanced_plugins

  - id: wordpress-authenticate-filter
    desc: Hooks the WordPress authentication result
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: add_filter
      arg:
        kind: string
        exact: authenticate

  - id: wordpress-rest-user-query-filter
    desc: Hooks WordPress REST user queries
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: add_filter
      arg:
        kind: string
        exact: rest_user_query

  - id: wordpress-early-plugins-loaded-hook
    desc: Hooks plugins_loaded at priority zero
    conf: 0.96
    if:
      type: text
      regex: 'add_action\s*\(\s*[''\"]plugins_loaded[''\"]\s*,[\s\S]{0,160},\s*0\s*\)'

  - id: wordpress-early-init-hook
    desc: WordPress init hook priority zero or one
    conf: 0.92
    if:
      type: text
      regex: 'add_action\s*\(\s*[''\"]init[''\"]\s*,[\s\S]{0,120},\s*[01]\s*\)'
