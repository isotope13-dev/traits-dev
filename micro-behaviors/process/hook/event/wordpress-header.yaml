# Theme rendering hooks are ordinary WordPress APIs, including in clean themes.
defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  crit: notable
  conf: 0.95
traits:
- id: wordpress-wp-head-hook
  desc: References WordPress wp_head hook API
  crit: notable
  conf: 0.95
  if:
    type: symbol
    exact: wp_head
- id: wordpress-wp-body-open-hook
  desc: References WordPress wp_body_open hook API
  crit: notable
  conf: 0.95
  if:
    type: symbol
    exact: wp_body_open
composite_rules:
- id: wordpress-theme-header-hook
  desc: WordPress theme header hook pair
  crit: notable
  conf: 0.95
  all:
  - id: wordpress-wp-head-hook
  - id: wordpress-wp-body-open-hook
