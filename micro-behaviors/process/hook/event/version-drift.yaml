# Neutral observations relocated during release-diff triage.
traits:
- platforms:
  - unix
  - windows
  for:
  - php
  id: wp-xmlrpc-method-hook
  desc: Adds a WordPress XML-RPC method
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: add_filter\s*\(\s*["']xmlrpc_methods["']\s*,\s*.{1,40}
    not:
    - regex: __return_
  unless:
  - id: well-known/lib/web/wordpress-core::wordpress-core-package-doc
