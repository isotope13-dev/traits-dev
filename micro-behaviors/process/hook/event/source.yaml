defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, typescript, ruby, java, csharp, go]
  crit: notable
  conf: 0.8

traits:
  - id: agent-userpromptsubmit-hook-key
    desc: Agent config defines UserPromptSubmit hook
    crit: component
    conf: 0.94
    for: [markdown]
    if:
      type: text
      regex: '(?m)^\s*["'']?UserPromptSubmit["'']?\s*:'

  - id: agent-command-hook-entry
    desc: Agent hook uses command action
    crit: component
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?m)^\s*-\s*type:\s*command\s*$'

  - id: agent-hooks-block-key
    desc: Agent config declares hooks block
    crit: component
    conf: 0.9
    for: [markdown]
    if:
      type: text
      regex: '(?m)^\s*"?hooks"?\s*:'

  - id: python-before-request-hook
    desc: Python before-request hook
    crit: notable
    for: [python]
    if:
      type: symbol
      kind: call
      exact: before_request

  - id: ruby-before-action-hook
    desc: Ruby before-action hook
    crit: notable
    for: [ruby]
    if:
      type: text
      word: before_action

  - id: source-use-middleware-hook
    desc: Registers application middleware hook
    crit: notable
    for: [javascript, typescript, java, csharp, go]
    if:
      type: text
      regex: '(?i)(app|router|server)\s*\.\s*use\s*\(.{0,50}=>'

  - id: source-use-function-middleware
    desc: Registers function middleware hook
    crit: notable
    for: [javascript, typescript, java, csharp, go]
    if:
      type: text
      regex: '(?i)(app|router|server)\s*\.\s*use\s*\(\s*(async\s+)?function\b'

  # `\b(req|res)\w*\b` matched any word starting req/res, so an error string
  # such as `stylus.middleware() requires "src" directory` read as a request
  # hook.  Anchor on the bare Express-style parameter names instead.
  - id: source-intercept-request-hook
    desc: Registers request interception hook
    crit: notable
    for: [javascript, typescript, java, csharp, go]
    if:
      type: text
      regex: '(?i)(middleware|intercept)\s*\(.{0,80}\b(req|res)\b'

  - id: source-request-intercept-method
    desc: Calls request interception method
    crit: notable
    for: [javascript, typescript, java, csharp, go]
    if:
      type: text
      regex: '(?i)(request|http|fetch)\s*\.\s*intercept\s*\('

composite_rules:
  - id: agent-command-hook
    desc: Agent hooks block runs command action
    crit: notable
    conf: 0.93
    for: [markdown]
    all:
      - id: agent-hooks-block-key
      - id: agent-command-hook-entry
    near_lines: 10

  - id: source-early-request-hook
    desc: Registers an early web-request hook
    crit: notable
    conf: 0.82
    any:
      - id: python-before-request-hook
      - id: ruby-before-action-hook
      - id: source-use-middleware-hook
      - id: source-use-function-middleware
      - id: source-intercept-request-hook
      - id: source-request-intercept-method
