defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, typescript, ruby, java, csharp, go]
  crit: notable
  conf: 0.8

traits:
  - id: agent-userpromptsubmit-hook-key
    desc: Agent config defines UserPromptSubmit hook
    crit: notable
    conf: 0.94
    for: [markdown]
    if:
      type: text
      regex: '(?m)^\s*["'']?UserPromptSubmit["'']?\s*:'

  - id: agent-command-hook-entry
    desc: Agent hook uses command action
    crit: notable
    conf: 0.92
    for: [markdown]
    if:
      type: text
      regex: '(?m)^\s*-\s*type:\s*command\s*$'

  - id: python-before-request-hook
    desc: Python before-request hook
    crit: notable
    for: [python]
    if:
      type: symbol
      kind: call
      exact: before_request

  - id: ruby-before-action-hook
    desc: Ruby before-action hook
    crit: notable
    for: [ruby]
    if:
      type: text
      word: before_action

  - id: source-request-intercept-method
    desc: Calls request interception method
    crit: notable
    for: [javascript, typescript, java, csharp, go]
    if:
      type: text
      regex: '(?i)(request|http|fetch)\s*\.\s*intercept\s*\('

composite_rules:
  # Keep the lifecycle/dispatch observations together; constants used by that
  # handler may be declared much earlier in a large module.
  - id: connection-open-delayed-computed-call-context
    desc: Connection-open handler near delayed computed call
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/messaging/channel::whatsapp-connection-update-handler
      - id: micro-behaviors/communications/messaging/channel::whatsapp-connection-open-branch
      - id: micro-behaviors/data/control-flow/dispatch::js-computed-property-call
      - id: micro-behaviors/time/schedule/delay::settimeout-callback-long-delay
    near_bytes: 2000

  - id: agent-command-hook
    desc: Hooks configuration declares a command action
    crit: notable
    conf: 0.93
    for: [markdown]
    all:
      - id: micro-behaviors/data/config/schema::hooks-field-key
      - id: agent-command-hook-entry
    near_lines: 10

  - id: source-web-request-hook
    desc: Registers or defines a web-request hook
    crit: notable
    conf: 0.82
    any:
      - id: python-before-request-hook
      - id: ruby-before-action-hook
      - id: micro-behaviors/communications/http/server/middleware::app-router-use-middleware-registration
      - id: micro-behaviors/communications/http/server/middleware::request-response-middleware-definition
      - id: source-request-intercept-method
