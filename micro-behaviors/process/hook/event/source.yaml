defaults:
  platforms: [linux, macos, windows]
  for: [python, javascript, typescript, ruby, java, csharp, go]
  crit: notable
  conf: 0.8

traits:
  - id: python-before-request-hook
    desc: Python before-request hook
    crit: notable
    for: [python]
    if:
      type: text
      word: before_request

  - id: ruby-before-action-hook
    desc: Ruby before-action hook
    crit: notable
    for: [ruby]
    if:
      type: text
      word: before_action

  - id: source-use-middleware-hook
    desc: Registers application middleware hook
    crit: notable
    for: [javascript, typescript, java, csharp, go]
    if:
      type: text
      regex: '(?i)(app|router|server)\s*\.\s*use\s*\(.{0,50}=>'

  - id: source-use-function-middleware
    desc: Registers function middleware hook
    crit: notable
    for: [javascript, typescript, java, csharp, go]
    if:
      type: text
      regex: '(?i)(app|router|server)\s*\.\s*use\s*\(\s*(async\s+)?function\b'

  - id: source-intercept-request-hook
    desc: Registers request interception hook
    crit: notable
    for: [javascript, typescript, java, csharp, go]
    if:
      type: text
      regex: '(?i)(middleware|intercept)\s*\(.{0,80}\b(req|res)\w*\b'

  - id: source-request-intercept-method
    desc: Calls request interception method
    crit: notable
    for: [javascript, typescript, java, csharp, go]
    if:
      type: text
      regex: '(?i)(request|http|fetch)\s*\.\s*intercept\s*\('

composite_rules:
  - id: source-early-request-hook
    desc: Registers an early web-request hook
    crit: notable
    conf: 0.82
    any:
      - id: python-before-request-hook
      - id: ruby-before-action-hook
      - id: source-use-middleware-hook
      - id: source-use-function-middleware
      - id: source-intercept-request-hook
      - id: source-request-intercept-method
