# Private delegate storage is an implementation detail, not a public hook API.
# Bound lookup/write syntax records probable tampering without claiming that
# the reflected field and the write have proven value flow.
defaults:
  platforms: [windows, linux, macos]
  for: [csharp, powershell, python]

traits:
  - id: private-invocation-list-write
    desc: Private delegate lookup near reflected writes
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\bGetField\s*\(\s*["'']_invocationList["''][^\r\n;]{0,160}\)[\s\S]{0,640}\.SetValue\s*\('
