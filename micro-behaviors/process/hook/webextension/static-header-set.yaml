# Bind the name and operation within one JSON header object. Separate
# objects (Origin removal and Referer setting) must not satisfy this.
defaults:
  platforms: [windows, unix]
  for: [json]
  crit: notable
  conf: 0.96
traits:
  - id: json-origin-set-header-first
    desc: JSON header object sets Origin
    if:
      type: text
      regex: '"header"\s*:\s*"(?i:origin)"[^{}]{0,80}"operation"\s*:\s*"set"'
  - id: json-origin-set-operation-first
    desc: JSON set operation names Origin
    if:
      type: text
      regex: '"operation"\s*:\s*"set"[^{}]{0,80}"header"\s*:\s*"(?i:origin)"'
  - id: json-referer-set-header-first
    desc: JSON header object sets Referer
    if:
      type: text
      regex: '"header"\s*:\s*"(?i:referer)"[^{}]{0,80}"operation"\s*:\s*"set"'
  - id: json-referer-set-operation-first
    desc: JSON set operation names Referer
    if:
      type: text
      regex: '"operation"\s*:\s*"set"[^{}]{0,80}"header"\s*:\s*"(?i:referer)"'
  - id: json-dnr-extension-initiator-scope
    desc: DNR rules name extension initiators
    if:
      type: value
      path: 'root[*].condition.initiatorDomains[*]'
      regex: '^[a-p]{32}$'
composite_rules:
  - id: static-dnr-origin-set
    desc: Static DNR rules set Origin
    all:
      - id: micro-behaviors/process/hook/webextension::dnr-modify
    any:
      - id: json-origin-set-header-first
      - id: json-origin-set-operation-first
  - id: static-dnr-referer-set
    desc: Static DNR rules set Referer
    all:
      - id: micro-behaviors/process/hook/webextension::dnr-modify
    any:
      - id: json-referer-set-header-first
      - id: json-referer-set-operation-first
