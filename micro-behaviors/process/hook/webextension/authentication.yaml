defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: auth-credentials-response
    desc: Returns web-request authentication credentials
    if:
      type: text
      regex: '\breturn\s*\{\s*authCredentials\s*:\s*\{'

composite_rules:
  - id: webrequest-credential-provider
    desc: Browser request authentication credential provider
    all:
      - id: webrequest-auth-required-listener
      - id: auth-credentials-response

