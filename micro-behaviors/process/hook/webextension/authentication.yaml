defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: auth-credentials-response
    desc: Returns web-request authentication credentials
    if:
      type: text
      regex: '\breturn\s*\{\s*authCredentials\s*:\s*\{'
  - id: webrequest-auth-callback-credentials
    desc: Sends credentials through auth callback
    if:
      type: text
      regex: '(asyncCallback|callback)\s*\(\s*\{\s*authCredentials\s*:'

composite_rules:
  - id: webrequest-credential-provider
    desc: Browser request authentication credential provider
    all:
      - id: webrequest-auth-required-listener
    any:
      - id: auth-credentials-response
      - id: webrequest-auth-callback-credentials
  - id: proxy-credentials-on-all-url-auth-challenges
    desc: Proxy credentials answer all URL auth challenges
    crit: suspicious
    conf: 0.94
    scope: archive
    for: [crx, xpi, zip, javascript, typescript]
    all:
      - id: webrequest-credential-provider
      - id: micro-behaviors/communications/proxy/config::chrome-proxy-settings-set
      - id: micro-behaviors/process/hook/webextension::webrequest-all-url-filter
    near_bytes: 1800

