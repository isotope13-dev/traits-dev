defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: xhr-wallet-address-exclusion-guard
    desc: XHR aborts bodies excluding selected wallet
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |-
        ((statement_block
          (function_declaration
            name: (identifier) @guard
            body: (statement_block) @predicate)
          (expression_statement
            (assignment_expression
              left: (member_expression
                object: (member_expression
                  object: (identifier) @xhr
                  property: (property_identifier) @prototype)
                property: (property_identifier) @send)
              right: (function_expression body: (statement_block
                (try_statement body: (statement_block
                  (if_statement
                    condition: (parenthesized_expression
                      (call_expression function: (identifier) @called))
                    consequence: (statement_block
                      (try_statement body: (statement_block
                        (expression_statement (call_expression
                          function: (member_expression
                            object: (this)
                            property: (property_identifier) @abort))))))))))))))
        (#eq? @guard @called)
        (#eq? @xhr "XMLHttpRequest")
        (#eq? @prototype "prototype")
        (#eq? @send "send")
        (#eq? @abort "abort")
        (#match? @predicate "[.]match\\(/0x\\[a-f0-9\\]\\{40\\}/g\\)")
        (#match? @predicate "indexOf\\(String\\([^)]{1,80}\\)[.]toLowerCase\\(\\)\\)\\s*<\\s*0")
        (#match? @predicate "return true"))
