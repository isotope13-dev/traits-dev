defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:

  - id: xhr-header-setter-replacement
    desc: Replaces a prototype request-header setter
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      kind: assignment
      regex: '\.prototype\.setRequestHeader\s*=\s*function'
