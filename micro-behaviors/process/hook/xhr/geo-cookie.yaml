defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

composite_rules:
  - id: fetch-hook-with-geo-cookie-fields
    desc: Fetch hook with cookies and geography fields
    all:
      - id: window-bracket-fetch-hook
      - id: micro-behaviors/communications/http/cookie-store::document-cookie-write
      - id: micro-behaviors/communications/http/cookie-store::document-cookie-split-iterate
      - id: micro-behaviors/data/serialize/schema-object::country-code-snake
      - id: micro-behaviors/data/serialize/schema-object::country-name
