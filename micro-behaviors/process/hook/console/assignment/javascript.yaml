defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
- id: js-console-method-preservation
  desc: Preserves original JavaScript console methods
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'console\.(log|error|warn)\.bind\(console\)'
- id: js-console-forwarding-call
  desc: Invokes preserved console method with arguments
  crit: notable
  conf: 0.95
  if:
    # Both the ES5 `raw.log.apply(null, arguments)` idiom and the rest/spread
    # form `raw.log(...args.map(sanitize))` forward to the saved method. Only
    # the first was recognised, so a modern redacting wrapper (GeekLink's
    # installConsoleRedaction) read as console suppression.
    type: text
    # Two spellings of "call the console method we saved": the rest/spread
    # form `raw.log(...args.map(sanitize))` and the ES5 `.apply` form
    # `raw.log.apply(null, arguments)` (or a saved-method *variable* applied
    # onto console -- `func.apply(console, cleanedArgs)`, how Kibana's
    # @kbn/security-hardening console sanitizer forwards). The receiver must
    # be a console method name: a bare `.apply(null,` also matches ubiquitous
    # `String.fromCharCode.apply(null, arr)` / `Math.max.apply(null, xs)`.
    regex: '\w+\.(log|error|warn|info)\s*(\(\s*\.\.\.|\.\s*apply\(\s*(null|console)\s*,)'
- id: console-log-reassign
  desc: Reassigns console.log method
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'console\.log\s*=\s*(function|\(\)|=>)'
- id: console-warn-reassign
  desc: Reassigns console.warn method
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'console\.warn\s*=\s*(function|\(\)|=>)'
- id: console-error-reassign
  desc: Reassigns console.error method
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'console\.error\s*=\s*(function|\(\)|=>)'
- id: console-method-wrapper
  desc: Wraps a console method with a callback
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'console\.(log|warn|error)\s*=\s*\([^)]{1,80}\)\s*=>'
- id: console-log-noop
  desc: Assigns an empty function to console.log
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'console\.log\s*=\s*\(\)\s*=>\s*\{\s*\}'
- id: console-warn-noop
  desc: Assigns an empty function to console.warn
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'console\.warn\s*=\s*\(\)\s*=>\s*\{\s*\}'
- id: console-error-noop
  desc: Assigns an empty function to console.error
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'console\.error\s*=\s*\(\)\s*=>\s*\{\s*\}'
# Obfuscator output and bracket-notation obfuscation reach the same methods
# through a computed property, so the dot-notation rules above never see it.
- id: console-bracket-method-reassign
  desc: Reassigns a console method via bracket notation
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'console\s*\[[''"](log|warn|error|info|debug)[''"]\]\s*=\s*(function|\(\s*\)\s*=>)'
- id: console-object-replace
  desc: Replaces the global console object
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'window\.console\s*=\s*\{[\s\S]{0,120}log\s*:'
- id: console-prototype-modify
  desc: Modifies console prototype methods
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'Console\.prototype\.(log|warn|error)\s*='
# Obfuscated bundles reach console through a decoder call rather than a quoted
# method name, so `console-bracket-method-reassign` above -- which requires a
# literal `log`/`warn`/`error` inside the brackets -- never sees them. Match the
# shape instead: a computed console property assigned an empty function.
#
# The count is what carries the meaning. One silenced method is a library
# quieting its own logging; three or more in a file is the console being
# blanked wholesale, which is what a bundle does immediately before it starts
# obstructing whoever opened it. Worked example: javascript-obfuscator's
# self-defending preset nulls log/warn/error/info in one statement group as the
# first step of its debug-protection path.
- id: console-computed-method-noop-cluster
  desc: Silences several computed console methods
  crit: notable
  conf: 0.9
  count_min: 3
  if:
    type: text
    regex: 'console\s*\[[^\]\n]{1,80}\]\s*=\s*function\s*\(\s*\)\s*\{\s*\}'
