defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  # Exception context for console suppression rules: the wrapper preserves
  # the real console methods and forwards output instead of hiding it.
  - id: js-console-forwarder-context
    desc: Console forwarding wrapper context
    crit: exception
    conf: 0.98
    all:
      - id: micro-behaviors/process/hook/console/assignment::js-console-method-preservation
      - id: micro-behaviors/os/console/io::js-log-method-argument-forwarding
    near_bytes: 2000
