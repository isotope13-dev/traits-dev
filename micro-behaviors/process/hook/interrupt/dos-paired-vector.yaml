# Reads and saves both original IVT pointers, disables interrupts, then writes both new offset/segment pairs. Handler addresses and resident segment are variable.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-installs-dos-video-vector-pair
    desc: Installs DOS and video interrupt handlers
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_installs_dos_video_vector_pair {
          strings:
            $install = { B8 00 00 8E C0 FA 26 A1 84 00 89 84 ?? ?? 26 A1 86 00 89 84 ?? ?? 26 C7 06 84 00 ?? ?? 26 C7 06 86 00 ?? ?? 26 A1 40 00 89 84 ?? ?? 26 A1 42 00 89 84 ?? ?? 26 C7 06 40 00 ?? ?? 26 C7 06 42 00 ?? ?? }
          condition:
            for any i in (1..#install) : (
              uint16(@install[i]+34) == uint16(@install[i]+64) and
              uint16(@install[i]+12)+2 == uint16(@install[i]+20) and
              uint16(@install[i]+42)+2 == uint16(@install[i]+50)
            )
        }
