# The decryptor's word key changes per infection. Compare encrypted words to
# that key so the interrupt hook and COM infection code survive re-encryption.
defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_max: 65536
  attack: T1080

traits:
  - id: resident-word-xor-hook
    desc: XOR encoded DOS open and execute hook
    crit: notable
    if:
      type: yara
      source: |
        rule dos_resident_word_xor_hook {
          strings:
            $d = { 1e 06 50 0e 07 b9 a2 01 bf ?? ?? b8 ?? ?? 26 31 05 47 47 e2 f9 }
          condition:
            for any i in (1..#d) : (
              @d[i] + 0x1e2 < filesize and
              (uint16(@d[i] + 0x27) ^ uint16(@d[i] + 12)) == 0xfc80 and
              (uint16(@d[i] + 0x29) ^ uint16(@d[i] + 12)) == 0x743d and
              (uint16(@d[i] + 0x2f) ^ uint16(@d[i] + 12)) == 0x4bfc
            )
        }
