# Replacing a Web Storage method on the live `localStorage` / `sessionStorage`
# object (or on `Storage.prototype`) so the replacement runs on every call the
# page makes. This is a *capability* (client-side storage self-instrumentation),
# not an intent: quota/private-mode polyfills, SSR and test doubles, storage-sync
# shims, and content blockers that pin player/UI state all install exactly this
# wrapper. It is also how a page-resident collector waits for the application to
# store user data instead of polling for it — but that inference needs a sink or
# a credential-shaped key, so it lives in objectives/ (see
# objectives/supply-chain/hidden-payload/staging::build-plugin-storage-triggered-exfil),
# mirroring how the stronger fetch/XHR hooks in micro-behaviors/process/hook/xhr/
# are scored here.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9
  mbc: E1056

traits:
  # `sessionStorage.setItem = function(...)`, `localStorage.removeItem = ...`,
  # `Storage.prototype.setItem = ...` — assignment over the built-in method.
  - id: web-storage-method-override
    desc: Overrides a Web Storage method
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(localStorage|sessionStorage|Storage\.prototype)\.(set|get|remove)Item\s*='

  # The override keeps a reference to the original so the page keeps working
  # while the replacement observes every call — the shape of a delegating
  # wrapper rather than a stub or a polyfill.
  - id: web-storage-original-method-saved
    desc: Saves the original Web Storage method
    conf: 0.88
    if:
      type: text
      regex: '=\s*(localStorage|sessionStorage|Storage\.prototype)\.(set|get|remove)Item\s*[;,\n]'

composite_rules:
  # Override plus a saved original: every `getItem`/`setItem`/`removeItem` call
  # the page makes is observed, and the page keeps working because the wrapper
  # forwards to the built-in. Neutral on its own — the same shape backs caching
  # shims and polyfills — so it is reported as an observed capability and left
  # for objectives/ to combine with a sink or a credential-shaped key.
  - id: web-storage-delegating-wrapper
    desc: Wraps a Web Storage method and delegates to the original
    crit: notable
    conf: 0.93
    all:
      - id: web-storage-method-override
      - id: web-storage-original-method-saved
