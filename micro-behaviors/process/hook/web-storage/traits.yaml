# Replacing a Web Storage method on the live `localStorage` / `sessionStorage`
# object (or on `Storage.prototype`) so the replacement runs on every write the
# page makes. Test doubles and storage-sync shims do this legitimately, so the
# capability is neutral here — but it is also how a page-resident collector
# waits for the application to store user data instead of polling for it, so
# the hook itself is worth surfacing.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9
  mbc: E1056

traits:
  # `sessionStorage.setItem = function(...)`, `localStorage.removeItem = ...`,
  # `Storage.prototype.setItem = ...` — assignment over the built-in method.
  - id: web-storage-method-override
    desc: Overrides a Web Storage method
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\b(localStorage|sessionStorage|Storage\.prototype)\.(set|get|remove)Item\s*='

  # The override keeps a reference to the original so the page keeps working
  # while the replacement observes every call — the shape of a transparent
  # interposer rather than a stub or a polyfill.
  - id: web-storage-original-method-saved
    desc: Saves the original Web Storage method
    conf: 0.88
    if:
      type: text
      regex: '=\s*(localStorage|sessionStorage|Storage\.prototype)\.(set|get|remove)Item\s*[;,\n]'

composite_rules:
  - id: transparent-web-storage-interposer
    desc: Transparent hook over Web Storage writes
    crit: suspicious
    conf: 0.93
    all:
      - id: web-storage-method-override
      - id: web-storage-original-method-saved
