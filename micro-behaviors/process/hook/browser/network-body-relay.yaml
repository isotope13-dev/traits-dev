# A page-world script that replaces both fetch and XMLHttpRequest.send copies
# every request body it sees and passes it to another context. Analytics and
# error reporters also wrap these primitives, so the postMessage leg is what
# marks a relay: the copied body leaves the wrapper's own scope.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.9

composite_rules:
  - id: page-request-body-relay
    desc: Fetch and XHR hooks relay request bodies via postMessage
    all:
      - id: micro-behaviors/communications/http/intercept::fetch-hook
      - id: micro-behaviors/communications/http/intercept::send-hook
      - id: micro-behaviors/communications/ipc/message::postmessage-call
    # Tencent's Aegis monitoring SDK wraps XHR and fetch to report request
    # bodies from its own web panels; the SDK identity excuses that bundle.
    unless:
      - id: well-known/lib/observability/aegis::aegis-sdk-bookkeeping
