# Co-occurrence only: a page-world script that replaces both fetch and
# XMLHttpRequest.send and also calls postMessage. Cleave does not link the
# posted value to the request body, so a hook that posts response rows, quota
# counters, or timing signals matches the same legs. Analytics, usage meters,
# and error reporters wrap these primitives for benign reasons. Read the
# posted payload before treating this as body relay.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

composite_rules:
  - id: fetch-xhr-hook-postmessage-cooccurrence
    desc: Fetch and XHR hooks co-occur with postMessage
    all:
      - id: micro-behaviors/communications/http/intercept::fetch-hook
      - id: micro-behaviors/communications/http/intercept::send-hook
      - id: micro-behaviors/communications/ipc/message::postmessage-call
    # Tencent's Aegis monitoring SDK wraps XHR and fetch to report request
    # bodies from its own web panels; the SDK identity excuses that bundle.
    unless:
      - id: well-known/lib/observability/aegis::aegis-sdk-bookkeeping
