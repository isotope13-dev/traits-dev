defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: function-call-override
    desc: Replaces Function.prototype.call
    if:
      type: text
      exclude_comments: true
      regex: 'Function\s*\.\s*prototype\s*\.\s*call\s*=\s*(function\b|\([^)]{0,80}\)\s*=>)'
  - id: function-apply-override
    desc: Replaces Function.prototype.apply
    if:
      type: text
      exclude_comments: true
      regex: 'Function\s*\.\s*prototype\s*\.\s*apply\s*=\s*(function\b|\([^)]{0,80}\)\s*=>)'
  - id: function-apply-array-transform
    desc: Function.apply hook transforms array values
    if:
      # Stop at the first closing brace of the assigned function.
      type: text
      exclude_comments: true
      regex: 'Function\.prototype\.apply\s*=\s*function[^}]{0,300}\[[^]]{1,30}\]\s*=\s*[\w$]+\('
