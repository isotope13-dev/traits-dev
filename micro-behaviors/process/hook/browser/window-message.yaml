defaults:
  platforms: [windows, unix, ios]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.95
traits:
  - id: window-postmessage-prototype-function-replacement
    desc: Replaces Window prototype postMessage function
    if:
      type: text
      exclude_html_comments: true
      regex: '\bWindow\.prototype\.postMessage\s*=\s*function\b'
