defaults:
  platforms: [android]
  for: [java]
  crit: notable
  conf: 0.98

traits:
  - id: xposed-hook-all-methods-call
    desc: Calls Xposed method interception API
    if:
      type: tree-sitter
      query: |-
        ((method_invocation object: (identifier) @bridge
          name: (identifier) @method) @call
          (#eq? @bridge "XposedBridge")
          (#eq? @method "hookAllMethods"))
