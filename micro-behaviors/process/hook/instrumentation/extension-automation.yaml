# These capabilities do not establish unsolicited sends or account compromise.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript, crx, xpi, zip, chrome-manifest]

composite_rules:
  - id: extension-messaging-runtime-access
    desc: Extension references messaging client internals
    conf: 0.95
    scope: archive
    all:
      - id: metadata/permission/host::content-script-matches-im-web-app
      - id: micro-behaviors/process/hook/instrumentation::whatsapp-web-chunk-registry
    any:
      - id: micro-behaviors/process/hook/instrumentation::webpack-module-registry-takeover
      - id: micro-behaviors/communications/messaging/send::whatsapp-web-send-text-message-export
  - id: extension-page-accessible-whatsapp-runtime
    desc: Page-accessible WhatsApp runtime reference
    conf: 0.95
    scope: archive
    all:
      - id: metadata/permission/host::content-script-matches-im-web-app
      - id: metadata/permission/extension-api::web-accessible-resource-to-whatsapp-web
      - id: micro-behaviors/process/hook/instrumentation::whatsapp-web-chunk-registry
