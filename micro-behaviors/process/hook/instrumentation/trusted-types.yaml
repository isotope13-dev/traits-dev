defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: trusted-types-policy-factory-override
    desc: Replaces the Trusted Types policy factory
    if:
      type: tree-sitter
      query: |
        ((assignment_expression
          left: (member_expression
            object: (member_expression
              property: (property_identifier) @facility)
            property: (property_identifier) @method)
          right: [(function_expression) (arrow_function)]) @override
          (#eq? @facility "trustedTypes")
          (#eq? @method "createPolicy"))
