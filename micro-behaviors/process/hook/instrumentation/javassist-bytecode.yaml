defaults:
  platforms: [unix, windows]
  for: [class]
  crit: notable
  conf: 0.96

traits:
  - id: javassist-method-instrument-bytecode
    desc: Javassist method instrumentation API reference
    if:
      type: import
      exact: javassist/CtMethod.instrument

  - id: javassist-method-setbody-bytecode
    desc: Javassist method body replacement API reference
    if:
      type: import
      exact: javassist/CtMethod.setBody
