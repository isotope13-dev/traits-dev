# The single-header inline-function hooking library ("stub.h": __STUB_H__
# guard, REPLACE_FAR/REPLACE_NEAR trampoline macros, pageof()) that deepin and
# many desktop projects vendor under 3rdparty/ to swap in-process virtual and
# C functions at runtime. These atoms are the instrumentation surface; intent
# lives in objectives that pair the hook with a concrete evasion result.
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, objc]
  crit: notable
  conf: 0.95

traits:
  - id: stub-header-context
    desc: Vendored stub.h inline-hook library context
    if:
      type: text
      regex: '__STUB_H__[\s\S]{0,600}REPLACE_FAR'
