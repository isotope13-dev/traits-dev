defaults:
  platforms: [unix, windows]
  for: [java, class, jar]
  crit: notable
  conf: 0.85

traits:
  - id: java-instrumentation-retransform
    desc: Java retransforms loaded classes
    if:
      type: symbol
      kind: call
      exact: retransformClasses

  - id: java-instrumentation-add-transformer
    desc: Java registers a class transformer
    if:
      type: symbol
      kind: call
      exact: addTransformer
