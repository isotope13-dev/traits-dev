defaults:
  platforms: [unix, windows]
  for: [java, class, jar]
  crit: notable
  conf: 0.85

traits:
  - id: java-instrumentation-retransform
    desc: Java retransforms loaded classes
    if:
      type: symbol
      kind: call
      exact: retransformClasses

  - id: java-instrumentation-add-transformer
    desc: Java addTransformer API reference
    if:
      type: symbol
      exact: addTransformer

  - id: java-agent-premain-entrypoint
    desc: Java premain identifier
    crit: component
    if:
      type: value
      path: class.strings[*]
      exact: premain

  - id: java-classfile-transformer-interface
    desc: Java ClassFileTransformer reference
    if:
      type: value
      path: class.class_refs[*]
      exact: java/lang/instrument/ClassFileTransformer

  - id: java-asm-classreader
    desc: Java ASM ClassReader reference
    if:
      type: value
      path: class.class_refs[*]
      exact: org/objectweb/asm/ClassReader

  - id: java-asm-classwriter
    desc: Java ASM ClassWriter reference
    if:
      type: value
      path: class.class_refs[*]
      exact: org/objectweb/asm/ClassWriter
