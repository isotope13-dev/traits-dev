defaults:
  platforms: [unix, windows]
  for: [java, class, jar]
  crit: notable
  conf: 0.85

traits:
  - id: java-instrumentation-retransform
    desc: Java retransforms loaded classes
    for: [java, class]
    if:
      type: symbol
      kind: call
      exact: retransformClasses

  - id: java-add-transformer-call
    desc: Calls Java addTransformer method
    crit: component
    for: [java]
    if:
      type: symbol
      kind: call
      exact: addTransformer

  - id: java-instrumentation-type
    desc: References Java Instrumentation interface
    for: [java]
    if:
      type: text
      substr: java.lang.instrument.Instrumentation

  - id: java-instrumentation-add-transformer-bytecode
    desc: Java instrumentation transformer registration
    for: [class]
    if:
      type: import
      exact: java/lang/instrument/Instrumentation.addTransformer

  - id: java-agent-premain-entrypoint
    desc: Java premain identifier
    crit: notable
    for: [class]
    if:
      type: value
      path: class.strings[*]
      exact: premain

  - id: java-classfile-transformer-interface
    desc: Java ClassFileTransformer reference
    for: [class]
    if:
      type: value
      path: class.class_refs[*]
      exact: java/lang/instrument/ClassFileTransformer

  - id: java-asm-classreader
    desc: Java ASM ClassReader reference
    for: [class]
    if:
      type: value
      path: class.class_refs[*]
      exact: org/objectweb/asm/ClassReader

  - id: java-asm-classwriter
    desc: Java ASM ClassWriter reference
    for: [class]
    if:
      type: value
      path: class.class_refs[*]
      exact: org/objectweb/asm/ClassWriter

composite_rules:
  - id: java-instrumentation-add-transformer-source
    desc: Java Instrumentation type and transformer registration call
    for: [java]
    all:
      - id: java-add-transformer-call
      - id: java-instrumentation-type

  - id: java-instrumentation-add-transformer
    desc: Java instrumentation transformer registration
    for: [java, class]
    any:
      - id: java-instrumentation-add-transformer-source
      - id: java-instrumentation-add-transformer-bytecode
