# Frida's Java bridge replaces method bodies by assigning to `.implementation`.
# These atoms are the instrumentation surface; intent lives in objectives that
# pair a replacement with a concrete integrity or attestation API.
defaults:
  platforms: [android, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92
  attack: T1055

traits:
  - id: frida-java-perform
    desc: Frida Java.perform runtime attach
    if:
      type: text
      regex: '\bJava\.perform\s*\('

  - id: frida-java-use
    desc: Frida Java.use class resolver
    if:
      type: text
      regex: '\bJava\.use\s*\('

  - id: frida-java-method-implementation-assign
    desc: Frida replaces a Java method implementation
    if:
      type: text
      regex: '\.implementation\s*=\s*function\b'
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/reverse-engineering/androguard::androguard-pentest-context

      - id: well-known/tool/offensive/bingo/
  - id: frida-send-call
    desc: Frida agent send() call
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?m)^\s*send\s*\(\s*\{'

  - id: frida-recv-wait
    desc: Frida recv().wait blocking reply
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\brecv\s*\([^)]{0,80}\)[\s\S]{0,200}\.wait\s*\('

composite_rules:
  - id: frida-java-method-hook
    desc: Frida hooks a Java method via implementation replacement
    crit: suspicious
    conf: 0.97
    all:
      - id: frida-java-perform
      - id: frida-java-use
      - id: frida-java-method-implementation-assign
    near_bytes: 2048
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/reverse-engineering/androguard::androguard-pentest-context

      - id: well-known/tool/offensive/bingo/
  - id: frida-send-recv-wait
    desc: Frida send/recv with blocking wait
    crit: notable
    conf: 0.92
    all:
      - id: frida-send-call
      - id: frida-recv-wait
    near_bytes: 1024
