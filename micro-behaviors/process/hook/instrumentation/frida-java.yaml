# Frida's Java bridge replaces method bodies by assigning to `.implementation`.
# These atoms are the instrumentation surface; intent lives in objectives that
# pair a replacement with a concrete integrity or attestation API.
defaults:
  platforms: [android, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92

traits:
  - id: frida-java-perform
    for: [javascript, typescript, python]
    desc: Frida Java.perform callback API
    if:
      type: text
      regex: '\bJava\.perform\s*\('

  - id: frida-java-use
    for: [javascript, typescript, python]
    desc: Frida Java.use class resolver
    if:
      type: text
      regex: '\bJava\.use\s*\('

  - id: frida-recv-wait
    desc: Frida recv().wait blocking reply
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\brecv\s*\([^)]{0,80}\)[\s\S]{0,200}\.wait\s*\('

composite_rules:
  - id: frida-send-call
    desc: Frida Java agent sends an object message
    crit: notable
    conf: 0.96
    near_bytes: 2000
    all:
      - id: frida-java-perform
      - id: micro-behaviors/communications/ipc/message::js-send-object-literal

  - id: frida-java-method-hook
    for: [javascript, typescript, python]
    desc: Frida Java API and implementation-assignment syntax nearby
    crit: notable
    conf: 0.97
    all:
    - id: frida-java-perform
    - id: frida-java-use
    - id: metadata/lang/source/syntax/assignment/member::implementation-function-assignment
    near_bytes: 2048
  - id: frida-send-recv-wait
    desc: Frida send/recv with blocking wait
    crit: notable
    conf: 0.92
    all:
      - id: frida-send-call
      - id: frida-recv-wait
    near_bytes: 1024
