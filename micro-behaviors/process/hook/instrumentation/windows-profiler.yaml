# Native Windows profiler and instrumentation surfaces. These are neutral
# capabilities: profilers, coverage tools, debuggers, and malware can all use
# them. The composite makes a coherent instrumentation implementation visible
# without treating the individual exported names as hostile.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.92

traits:
  - id: profiler-detour-control
    desc: Exposes function-detour control symbols
    if:
      type: text
      regex: '\b(CanDetour|CanEnableDetours|EnableDetours|SetDetourProvider)\b'

  - id: profiler-call-site-symbol
    desc: Exposes call-site instrumentation symbol
    if:
      type: text
      regex: '\b(AddCallSite|AddTailCallSite)\b'

  - id: profiler-entry-exit-symbol
    desc: Exposes method entry and exit symbols
    if:
      type: text
      regex: '\b(AddEnter|AddExit)\b'

  - id: profiler-notify-point-symbol
    desc: Exposes notify-point instrumentation symbols
    if:
      type: text
      regex: '\b(StartNotifyPoint|FinishNotifyPoint)\b'

  - id: profiler-notify-query-symbol
    desc: Exposes notify-point data query symbol
    if:
      type: text
      word: DumpNotifyPointDataQuery

  - id: profiler-il-rewriting
    desc: Exposes managed IL-rewriting capability
    if:
      type: text
      word: TranslateOldILToNewIL

  - id: profiler-web-request-correlation
    desc: Correlates web requests with instrumentation
    if:
      type: text
      regex: '\b(AssociateRequestWithThread|AssociateThreadWithTest|GetWebRequestID|WebRequestEnd)\b'

composite_rules:
  - id: profiler-call-instrumentation
    desc: Exposes call instrumentation symbols
    crit: notable
    conf: 0.98
    any:
      - id: profiler-call-site-symbol
      - id: profiler-entry-exit-symbol
      - id: profiler-notify-point-symbol
      - id: profiler-notify-query-symbol

  - id: profiler-instrumentation-surface
    desc: Implements profiler detours and call hooks
    crit: notable
    conf: 0.98
    all:
      - id: profiler-detour-control
      - id: profiler-call-instrumentation
      - id: profiler-il-rewriting

  - id: profiler-web-request-instrumentation
    desc: Instruments web requests and execution
    crit: notable
    conf: 0.97
    all:
      - id: profiler-call-instrumentation
      - id: profiler-web-request-correlation
