# Bind the called receiver to the imported Node module object. Shared method
# names such as register() also occur on routers and event registries.
defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: node-module-register-hook
    desc: Registers a Node module loader hook
    if:
      type: tree-sitter
      query: |
        (program
          (import_statement
            (import_clause (namespace_import (identifier) @binding))
            source: (string (string_fragment) @source))
          (expression_statement
            (call_expression
              function: (member_expression
                object: (identifier) @receiver
                property: (property_identifier) @method)))
          (#match? @source "^(node:)?module$")
          (#eq? @binding @receiver)
          (#match? @method "^register(Hooks)?$"))
        (program
          (import_statement
            (import_clause (identifier) @binding)
            source: (string (string_fragment) @source))
          (expression_statement
            (call_expression
              function: (member_expression
                object: (identifier) @receiver
                property: (property_identifier) @method)))
          (#match? @source "^(node:)?module$")
          (#eq? @binding @receiver)
          (#match? @method "^register(Hooks)?$"))
        (program
          (import_statement
            (import_clause
              (named_imports
                (import_specifier
                  name: (identifier) @method)))
            source: (string (string_fragment) @source))
          (expression_statement
            (call_expression function: (identifier) @receiver))
          (#match? @source "^(node:)?module$")
          (#match? @method "^register(Hooks)?$")
          (#eq? @method @receiver))
        (program
          (import_statement
            (import_clause
              (named_imports
                (import_specifier
                  name: (identifier) @method
                  alias: (identifier) @binding)))
            source: (string (string_fragment) @source))
          (expression_statement
            (call_expression function: (identifier) @receiver))
          (#match? @source "^(node:)?module$")
          (#match? @method "^register(Hooks)?$")
          (#eq? @binding @receiver))
        (program
          (lexical_declaration
            (variable_declarator
              name: (identifier) @binding
              value: (call_expression
                function: (identifier) @require
                arguments: (arguments (string (string_fragment) @source)))))
          (expression_statement
            (call_expression
              function: (member_expression
                object: (identifier) @receiver
                property: (property_identifier) @method)))
          (#eq? @require "require")
          (#match? @source "^(node:)?module$")
          (#eq? @binding @receiver)
          (#match? @method "^register(Hooks)?$"))
