defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: stringify-function-reassigned
    desc: Reassigns JSON stringify implementation
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((assignment_expression
          left: (member_expression
            object: (identifier) @receiver
            property: (property_identifier) @method))
          (#eq? @receiver "JSON")
          (#eq? @method "stringify"))
