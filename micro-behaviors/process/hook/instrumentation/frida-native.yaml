# Frida native-side instrumentation in a JavaScript agent: Interceptor hooks on
# module exports and module-load observation. These atoms only describe the
# API surface; a hostile composite must pair them with a concrete target.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.9

traits:
  - id: frida-native-interceptor-hook
    desc: Frida Interceptor attach or replace call
    if:
      type: text
      regex: '\bInterceptor\.(attach|replace)\s*\('

  - id: frida-module-observer
    desc: Frida module-load observer attachment
    if:
      type: text
      regex: '\bProcess\.attachModuleObserver\s*\('
