defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: native-driver-inline-jump-detour
    desc: Installs native kernel function jump detours
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        // Pointer operands bind the diagnostic to the actual mutation branch.
        // Check a native PE header and its executable mapped section, for either
        // plaintext or bytewise XOR-2 storage. No collector name or fixed VA is used.
        rule native_driver_inline_jump_detour {
         strings:
          $mz0 = "MZ"
          $pe0 = "PE\x00\x00"
          $op0 = { 53 68 ?? ?? ?? ?? 89 45 08 E8 ?? ?? ?? ?? FF 75 0C 68 ?? ?? ?? ?? E8 ?? ?? ?? ?? 57 FF 75 08 68 ?? ?? ?? ?? E8 ?? ?? ?? ?? 8B CF 8B 7D 08 8B F1 C1 E9 02 BA 90 90 90 90 8B C2 F3 AB 8B CE 83 E1 03 F3 AA 8B 4D F8 8B 7D 08 8B C1 C1 E9 02 8B F3 F3 A5 8B C8 83 E1 03 F3 A4 8B F0 8B C2 8B CE 8B D1 C1 E9 02 8B FB F3 AB 8B CA 83 E1 03 F3 AA 8B 4D 08 8D 04 31 C6 00 E9 8B D3 2B D0 89 50 01 8B 45 0C 2B C3 83 C4 1C 83 E8 05 89 43 01 C6 03 E9 }
          $msg0 = "Function addr : 0x%.8x"
          $ctx0 = "KeServiceDescriptorTable"
          $mz2 = "MZ" xor(2)
          $pe2 = "PE\x00\x00" xor(2)
          $op2 = { 51 6A ?? ?? ?? ?? 8B 47 0A EA ?? ?? ?? ?? FD 77 0E 6A ?? ?? ?? ?? EA ?? ?? ?? ?? 55 FD 77 0A 6A ?? ?? ?? ?? EA ?? ?? ?? ?? 89 CD 89 7F 0A 89 F3 C3 EB 00 B8 92 92 92 92 89 C0 F1 A9 89 CC 81 E3 01 F1 A8 89 4F FA 89 7F 0A 89 C3 C3 EB 00 89 F1 F1 A7 89 CA 81 E3 01 F1 A6 89 F2 89 C0 89 CC 89 D3 C3 EB 00 89 F9 F1 A9 89 C8 81 E3 01 F1 A8 89 4F 0A 8F 06 33 C4 02 EB 89 D1 29 D2 8B 52 03 89 47 0E 29 C1 81 C6 1E 81 EA 07 8B 41 03 C4 01 EB }
          $msg2 = "Function addr : 0x%.8x" xor(2)
          $ctx2 = "KeServiceDescriptorTable" xor(2)
         condition:
          (for any m in (1..#mz0) : (
            (uint32(@mz0[m]+60) ^ 0) < 4096 and $pe0 at (@mz0[m]+(uint32(@mz0[m]+60) ^ 0)) and
            (uint16((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+4) ^ 0) == 0x14c and (uint16((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+92) ^ 0) == 1 and
            (uint16((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+6) ^ 0) > 0 and (uint16((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+6) ^ 0) < 32 and
            for any s in (0..(uint16((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+6) ^ 0)-1) : (
              (uint32(((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+24+(uint16((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+20) ^ 0)+40*s)+36) ^ 0) & 0x20000000 != 0 and
              (uint32(((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+24+(uint16((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+20) ^ 0)+40*s)+12) ^ 0) == (uint32(((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+24+(uint16((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+20) ^ 0)+40*s)+20) ^ 0) and
              for any o in (1..#op0) : (
                @op0[o] >= @mz0[m]+(uint32(((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+24+(uint16((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+20) ^ 0)+40*s)+20) ^ 0) and
                @op0[o]+!op0[o] <= @mz0[m]+(uint32(((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+24+(uint16((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+20) ^ 0)+40*s)+20) ^ 0)+(uint32(((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+24+(uint16((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+20) ^ 0)+40*s)+16) ^ 0) and
                for any d in (1..#msg0) : (
                  @msg0[d] >= @mz0[m] and @msg0[d]+!msg0[d] < @mz0[m]+(uint32((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+80) ^ 0) and
                  (uint32(@op0[o]+2) ^ 0) == (uint32((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+52) ^ 0)+@msg0[d]-@mz0[m]
                ) and
                for any c in (1..#ctx0) : (
                  @ctx0[c] > @mz0[m] and @ctx0[c]+!ctx0[c] < @mz0[m]+(uint32((@mz0[m]+(uint32(@mz0[m]+60) ^ 0))+80) ^ 0)
                )
              )
            )
          )) or
          (for any m in (1..#mz2) : (
            (uint32(@mz2[m]+60) ^ 33686018) < 4096 and $pe2 at (@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018)) and
            (uint16((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+4) ^ 514) == 0x14c and (uint16((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+92) ^ 514) == 1 and
            (uint16((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+6) ^ 514) > 0 and (uint16((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+6) ^ 514) < 32 and
            for any s in (0..(uint16((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+6) ^ 514)-1) : (
              (uint32(((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+24+(uint16((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+20) ^ 514)+40*s)+36) ^ 33686018) & 0x20000000 != 0 and
              (uint32(((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+24+(uint16((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+20) ^ 514)+40*s)+12) ^ 33686018) == (uint32(((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+24+(uint16((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+20) ^ 514)+40*s)+20) ^ 33686018) and
              for any o in (1..#op2) : (
                @op2[o] >= @mz2[m]+(uint32(((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+24+(uint16((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+20) ^ 514)+40*s)+20) ^ 33686018) and
                @op2[o]+!op2[o] <= @mz2[m]+(uint32(((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+24+(uint16((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+20) ^ 514)+40*s)+20) ^ 33686018)+(uint32(((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+24+(uint16((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+20) ^ 514)+40*s)+16) ^ 33686018) and
                for any d in (1..#msg2) : (
                  @msg2[d] >= @mz2[m] and @msg2[d]+!msg2[d] < @mz2[m]+(uint32((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+80) ^ 33686018) and
                  (uint32(@op2[o]+2) ^ 33686018) == (uint32((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+52) ^ 33686018)+@msg2[d]-@mz2[m]
                ) and
                for any c in (1..#ctx2) : (
                  @ctx2[c] > @mz2[m] and @ctx2[c]+!ctx2[c] < @mz2[m]+(uint32((@mz2[m]+(uint32(@mz2[m]+60) ^ 33686018))+80) ^ 33686018)
                )
              )
            )
          ))
        }
