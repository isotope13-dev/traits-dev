defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: spawn-variable-program
    desc: Node spawn uses a computed program path
    conf: 0.82
    unless:
      - id: well-known/lib/ui/cytoscape::cytoscape-stylesheet-runtime-marker
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: [
            (identifier) @spawn
            (member_expression
              object: (_) @receiver
              property: (property_identifier) @spawn)
            (subscript_expression
              object: (_) @receiver
              index: (string (string_fragment) @spawn))]
          arguments: [
            (arguments . [
              (identifier) (member_expression)
              (subscript_expression) (call_expression)] @program)
            (arguments . (comment)+ . [
              (identifier) (member_expression)
              (subscript_expression) (call_expression)] @program)]
          (#match? @spawn "^(spawn|spawnSync)$")
          (#not-eq? @receiver "this")
          (#not-match? @program "^(local|cx)"))
    # Preserve the existing UI/game exclusions on parsed receiver/argument
    # nodes. A text-only not: filter does not constrain query captures.
  - id: spawn-destination-variable
    desc: Node spawns destination path variable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bspawn\s*\(\s*\w*(dest|path|file)\w*\s*,'
