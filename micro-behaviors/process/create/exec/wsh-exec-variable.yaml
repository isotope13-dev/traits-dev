defaults:
  platforms: [windows]
  for: [vbs, asp, html, javascript]
traits:
  - id: wsh-reference-near-variable-call
    desc: WSH reference near variable Run/Exec syntax
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)WScript\.Shell.{0,900}\.(Run|Exec)\s*\(\s*([^\n)]{1,80}&\s*)?[$a-z_]'
