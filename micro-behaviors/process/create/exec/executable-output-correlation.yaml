defaults:
  platforms: [windows]
  for: [javascript]

traits:
  - id: executable-output-path
    desc: Executable output path identifier
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(outputFile|payloadFile|executablePath|exePath)\b'
  - id: executable-output-extension
    desc: Windows executable filename extension
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '(?i)\.exe\b'

composite_rules:
  - id: executable-output-process-correlation
    desc: Executable output path near process API
    crit: notable
    conf: 0.92
    all:
      - id: executable-output-path
      - id: executable-output-extension
    any:
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
      - id: micro-behaviors/fs/write/file/full/unspecified::write-file-async
      - id: micro-behaviors/fs/write/file/stream::create-write-stream
      - id: micro-behaviors/process/create/exec::js-execfile-call
      - id: metadata/file/profile/execution-api::spawn-call
    near_bytes: 512
