defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: node-launch-exe-literal
    desc: Node launches a literal .exe path
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(execFile|execFileSync|spawn|spawnSync)$'
      arg:
        index: 0
        kind: string
        regex: '(?i)\.exe$'
