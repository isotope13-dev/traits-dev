# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: child-process-destructured-spawn-call
  desc: Calls destructured child_process spawn
  crit: notable
  conf: 0.94
  if:
    type: tree-sitter
    query: "(program\n  (lexical_declaration\n    (variable_declarator\n      name: (object_pattern\n        (pair_pattern\n\
      \          key: (property_identifier) @api\n          value: (identifier) @alias))\n      value: (call_expression\n\
      \        function: (identifier) @require\n        arguments: (arguments\n          (string (string_fragment)\
      \ @module)))))\n  (function_declaration\n    body: (statement_block\n      (expression_statement\n       \
      \ (call_expression\n          function: (member_expression\n            object: (call_expression\n       \
      \       function: (identifier) @callee\n              arguments: (arguments (identifier) @program)))))))\n\
      \  (#eq? @api \"spawn\")\n  (#eq? @require \"require\")\n  (#eq? @module \"child_process\")\n  (#eq? @alias\
      \ @callee))\n"
- id: child-process-member-spawn
  desc: Node.js child_process spawns an external process
  crit: notable
  conf: 0.85
  unless:
  - id: well-known/lib/ui/cytoscape::cytoscape-stylesheet-runtime-marker
  if:
    type: symbol
    kind: call
    regex: (?i)(^|\.)(child[_-]?process|childproc|cp)\.spawn$
composite_rules:
- id: child-process-alias-spawn
  desc: Node.js child_process alias spawn
  crit: notable
  conf: 0.85
  mbc: C0017
  all:
  - id: metadata/import/builtin::require-child-process
  - id: micro-behaviors/process/create/exec::child-process-member-spawn
