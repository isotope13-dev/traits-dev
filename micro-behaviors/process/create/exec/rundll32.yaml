traits:
- id: dll-init-export-command-format
  desc: DLL init-export launch command format
  crit: notable
  conf: 0.95
  platforms: [windows]
  for: [pe, dll]
  if:
    type: text
    regex: '^%s "%s",init( %s)?$'
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - c
  - cpp
  - csharp
  - go
  - rust
  id: rundll32-command-syntax-reference
  desc: Rundll32 DLL/export command syntax reference
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: rundll32(\.exe)?[ \t]+[^,\r\n]{1,200},[a-zA-Z0-9_]{3,}
  not:
  - regex: rundll32\.exe\s+%s,InstallHinfSection\b
  - exact: rundll32.exe %s,ExportCookieFile
  - regex: rundll32\.exe\s+%s,(Export|Import)CookieFile(ByProcess)?
  - regex: rundll32\.exe\s+%s,ClearMyTracksByProcess\b
  - regex: rundll32\.exe\s+ieadvpack\.dll,RegisterOCX
  - regex: (?i)\brundll32(\.exe)?\s+clipc\.dll,ClipCleanUpState\b
  - regex: rundll32\.exe\s+%s?advpack\.dll,DelNodeRunDLL32
  - regex: rundll32\.exe\s+powrprof\.dll,SetSuspendState\b
  - regex: (?i)\brundll32(\.exe)?\s+url\.dll,(FileProtocolHandler|OpenURL|MailToProtocolHandler)\b
  - regex: (?i)\brundll32\s*\+\s*url\.dll,(FileProtocolHandler|OpenURL|MailToProtocolHandler)\b
  unless:
  - id: metadata/package/documentation/page::static-documentation-html-page
  - id: metadata/binary/framework::windows-appcompat-shim
