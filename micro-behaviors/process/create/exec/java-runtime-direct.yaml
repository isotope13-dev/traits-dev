defaults:
  crit: notable
  platforms: [unix, windows]
  attack: T1059
traits:
  - id: java-runtime-exec-source
    desc: JVM Runtime.exec() call
    conf: 0.8
    # Tab-indented JSPX text carriers can be classified as Makefiles.
    for: [source, class, xml, jsp, html, javascript, python, makefile]
    if:
      type: text
      substr: Runtime.getRuntime().exec
