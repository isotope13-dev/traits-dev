defaults:
  platforms:
    - windows
  for: [pe]
traits:
  - id: vb6-shell-root-path-text
    desc: VB6 Shell call with C-drive path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: "Shell\\s+\"[cC]:\\\\"
composite_rules:
  - id: vb6-binary-open-root-shell-clues
    desc: VB6 binary EXE open and root Shell clues
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/fs/file/open/unspecified::vb6-root-exe-binary-open-text
      - id: micro-behaviors/process/create/exec::vb6-shell-root-path-text
