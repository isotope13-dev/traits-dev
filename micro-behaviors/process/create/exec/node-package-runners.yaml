defaults:
  platforms:
  - unix
  - windows
  crit: notable
  for:
  - javascript
  - typescript
  mbc: C0017
traits:
- id: node-spawn-current-executable
  desc: Launches the current runtime executable
  crit: notable
  conf: 0.9
  unless:
  - id: metadata/package/testing/harness/runtime::test-basename-spec
  if:
    # Inspect the callee and first argument, not example text in strings.
    # fork() takes a module path, so fork(process.execPath) is not this call.
    type: tree-sitter
    query: |
      (call_expression
        function: [
          (identifier) @launch
          (member_expression property: (property_identifier) @launch)
          (subscript_expression index: (string (string_fragment) @launch))
        ]
        arguments: [
          (arguments . [
            (member_expression
              object: (identifier) @runtime
              property: (property_identifier) @executable)
            (subscript_expression
              object: (identifier) @runtime
              index: (string (string_fragment) @executable))])
          (arguments . (comment)+ . [
            (member_expression
              object: (identifier) @runtime
              property: (property_identifier) @executable)
            (subscript_expression
              object: (identifier) @runtime
              index: (string (string_fragment) @executable))])]
        (#match? @launch "^(spawn|spawnSync|execFile|execFileSync)$")
        (#eq? @runtime "process")
        (#eq? @executable "execPath"))
