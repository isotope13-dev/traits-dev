defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: source-or-response-call-text
    desc: Process call names source or response
    conf: 0.92
    if:
      # Keep the marker inside the call expression. A file-wide text search
      # misreads comments and template-string fixtures as live arguments.
      type: tree-sitter
      kind: call
      regex: '(?is)(child_process|cp)\.(exec|spawn)\s*\(.{0,120}\b(source|response)\b'

