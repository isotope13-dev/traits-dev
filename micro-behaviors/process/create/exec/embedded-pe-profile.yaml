# Static API/layout co-occurrence proves neither staging nor obfuscation.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: embedded-pe-process-as-user-profile
    desc: Embedded PEs with checksum mismatch and process-launch API
    crit: notable
    conf: 0.9
    all:
    - id: metadata/binary/layout/checksum::certificate-directory-checksum-mismatch
    - id: metadata/binary/layout/ratio::multiple-pe-embedded
    - id: micro-behaviors/process/create/exec::create-process-as-user
    unless:
    - id: metadata/binary/installer/family/
    - id: metadata/binary/installer/script/
    - id: metadata/binary/framework/
