# Windows Native Command Execution APIs
# Low-level WinAPI execution methods
# ATT&CK: T1106 (Native API)
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: winexec
    desc: WinExec command execution API
    crit: notable
    conf: 0.9
    attack: "T1106"
    if:
      type: symbol
      exact: "WinExec"
  # The same API reached from Python through ctypes.
  #
  # `winexec` above is a symbol match, which finds the name in a PE's import
  # table. Python source calls it as an attribute chain --
  # `ctypes.windll.kernel32.WinExec(path, 1)` -- so nothing is imported and no
  # symbol of that name exists; the text is all there is.
  #
  # Worth naming separately because the reason to write it this way is to leave
  # `subprocess` out of the file: a script that launches a program through the
  # Win32 API directly has stepped around the module every process-execution
  # rule watches. Same fire-and-forget shape as `winexec` -- a new process, no
  # handle kept, no output captured.
  - id: python-ctypes-win32-exec
    desc: Python ctypes calls a Win32 exec API
    crit: notable
    conf: 0.93
    for: [python]
    attack: "T1106"
    if:
      type: text
      regex: 'windll\.\w{1,24}\.(WinExec|ShellExecute[AW]?|CreateProcess[AW]?)\b'

  - id: sdclt-path-reference
    desc: References Windows Backup launcher sdclt.exe
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bsdclt\.exe\b'
