# Native binaries that expose process-launching capability.  This is a neutral
# capability used by packed-execution objectives; the capability itself is not
# evidence of anti-static intent.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  attack: T1106
  mbc: C0017

composite_rules:
  - id: binary-process-execution
    desc: Native binary process execution capability
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/process/create/direct::execve-import
      - id: micro-behaviors/process/create/direct::fexecve-import
      - id: micro-behaviors/process/create/direct::posix-spawn-import
      - id: micro-behaviors/process/create/execv::c-exec-variants
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: micro-behaviors/process/create/launch::create-process-api-name
    unless:
      - id: metadata/library/automation/
