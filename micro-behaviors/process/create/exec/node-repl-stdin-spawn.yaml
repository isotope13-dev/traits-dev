defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  # Launches the Node.js interactive REPL as a child process. Code written to
  # its stdin runs in a fresh interpreter, which is how a loader moves a
  # fetched script out of the current process without an extra file.
  - id: node-repl-stdin-spawn
    desc: Spawns node -i REPL reading stdin
    if:
      type: text
      regex: 'spawn\w*\(\s*[''"]node[''"]\s*,\s*\[\s*[''"]-i[''"]'
