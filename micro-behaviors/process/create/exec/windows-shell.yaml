defaults:
  for:
    - pe
    - dll
    - csharp
  platforms:
    - windows
traits:
  - id: csharp-cmd-exe-startinfo
    desc: .NET ProcessStartInfo names cmd.exe
    crit: notable
    conf: 0.93
    for: [csharp]
    if:
      type: text
      regex: 'StartInfo\.FileName\s*=\s*"cmd\.exe"'
  # Notable, not suspicious: `%COMSPEC%` is how a shortcut names cmd.exe
  # portably, and Visual Studio installs a dozen of them -- every "Developer
  # Command Prompt" and cross-tools shortcut is `%COMSPEC% /k ...vcvarsall.bat`.
  # The dropper composites in objectives/command-and-control/dropper/lnk pair
  # it with the downloader or the encoded command that makes it an attack.
composite_rules:
  - id: cmd-shell-via-createprocess
    for: [pe]
    desc: cmd.exe /c executed via CreateProcess
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command
      - id: micro-behaviors/process/create/spawn::create-process-w
  # Relocated (2026-09) from objectives/command-and-control/dropper/delivery/
  # execute-download: a managed assembly naming cmd.exe or PowerShell is the
  # .NET Framework's own MSBuild tasks and countless build tools. The hidden-
  # shell GitHub dropper composite there still references it.
