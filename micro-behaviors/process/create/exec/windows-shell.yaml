defaults:
  for:
    - pe
    - dll
    - csharp
  platforms:
    - windows
# The matcher does not bind cmd text to a CreateProcess argument.
# Report the API/text pair without inferring an executed shell.
composite_rules:
  - id: cmd-command-and-createprocess-references
    for: [pe]
    desc: cmd /c text and CreateProcessW references
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/shell/command-mode::cmd-exe-c-command
      - id: micro-behaviors/process/create/spawn::create-process-w
