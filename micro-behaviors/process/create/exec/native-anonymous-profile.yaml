defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: socket-anonymous-exec-api-profile
    crit: notable
    conf: 0.95
    desc: Socket, memfd write and fexecve API profile
    all:
      - id: micro-behaviors/communications/socket/create::create
      - id: micro-behaviors/communications/socket/connect::connect
      - id: micro-behaviors/communications/socket/send::send
      - id: micro-behaviors/communications/socket/receive::receive
      - id: micro-behaviors/fs/write/file/descriptor::write--write
      - id: micro-behaviors/process/create/exec::fexecve-import
    any:
      - id: micro-behaviors/mem/anonymous/create::memfd-create
      - id: micro-behaviors/mem/anonymous/create::memfd-create-syscall-number-x86
      - id: micro-behaviors/mem/anonymous/create::memfd-create-syscall-number-x64
      - id: micro-behaviors/mem/anonymous/create::memfd-create-syscall-number-aarch64
      - id: micro-behaviors/mem/anonymous/create::arm-thumb-memfd-syscall-wrapper
    needs: 1
