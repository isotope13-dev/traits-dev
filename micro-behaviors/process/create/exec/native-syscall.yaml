traits:
- platforms:
  - unix
  id: syscall-execve-elf
  desc: ELF contains an execve-family syscall
  crit: notable
  conf: 0.8
  if:
    type: syscall
    name:
    - execve
    - execveat
- platforms:
  - linux
  arch: [x86, x86-64]
  id: x86-execve-syscall-sequence
  desc: x86 execve syscall or trampoline sequence
  crit: notable
  conf: 0.9
  if:
    type: hex
    section: text
    # x86-64 SYS_execve=59 followed by SYSCALL, or the i386 libc wrapper:
    # preserve EBX, load SYS_execve=11 and pathname/argv/envp, invoke GS:0x10.
    # The latter is linked syscall capability, not proof of a shell launch.
    pattern: '(B8 3B 00 00 00 0F 05 | 53 B8 0B 00 00 00 8B 4C 24 0C 8B 54 24 10 8B 5C 24 08 65 FF 15 10 00 00 00)'
defaults:
  for:
  - elf
