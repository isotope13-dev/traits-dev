traits:
- platforms:
  - unix
  id: syscall-execve-elf
  desc: ELF contains an execve-family syscall
  crit: notable
  conf: 0.8
  if:
    type: syscall
    name:
    - execve
    - execveat
- platforms:
  - linux
  id: x86-64-syscall-execve
  desc: Direct x86-64 execve syscall
  crit: notable
  conf: 0.9
  if:
    type: hex
    section: text
    pattern: B8 3B 00 00 00 0F 05
defaults:
  for:
  - elf
