traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.95
  id: node-launch-exe-name
  desc: Node launches a literal .exe program name
  if:
    type: symbol
    kind: call
    regex: (^|\.)(execFile|execFileSync|spawn|spawnSync)$
    arg:
      index: 0
      kind: string
      regex: (?i)\.exe$
  not:
  - regex: (?i)^(taskkill|killall|pkill|kill|tskill)\b
