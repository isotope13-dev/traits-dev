defaults:
  crit: notable
  platforms: [unix, windows]
  attack: T1059
traits:
- id: execveat-api-reference
  desc: References execveat FD execution API
  crit: notable
  conf: 0.9
  for: [c, cpp, rust, go, elf]
  if:
    type: text
    regex: '\bexecveat\s*\(|\bsyscall\s*\(\s*(SYS_execveat|322)\b'
  unless:
    - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: metadata/lang/upstream::linux-kernel-primary-tree-path
    - id: well-known/tool/detection/cilium-tetragon::source-path
    - id: well-known/lib/native/glibc
    - id: well-known/lib/platform/rust-system-bindings::rust-syscall-binding-crate
- id: node-exec-file-async-call
  desc: Calls an execFileAsync process wrapper
  crit: notable
  conf: 0.85
  for: [javascript, typescript]
  if:
    type: symbol
    kind: call
    regex: '(^|\.)execFileAsync$'
- id: js-child-process
  desc: Calls Node.js child_process execution API
  crit: notable
  conf: 0.92
  for: [javascript, typescript]
  mbc: E1059
  # Keep the original child_process API family, including member/subscript
  # spellings normalized by the symbol walker. Add tsc's detached fork call,
  # which the symbol-call projection currently omits. Node fork launches a
  # new Node image, rather than cloning the current POSIX process context.
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: [
          (member_expression
            object: [
              (identifier) @receiver
              (member_expression property: (property_identifier) @receiver)
              (subscript_expression index: (string (string_fragment) @receiver))
            ]
            property: (property_identifier) @api)
          (subscript_expression
            object: [
              (identifier) @receiver
              (member_expression property: (property_identifier) @receiver)
              (subscript_expression index: (string (string_fragment) @receiver))
            ]
            index: (string (string_fragment) @api))
        ]) @call
        (#match? @receiver "^_*child_process$" )
        (#match? @api "^(exec(File)?|spawn|fork)(Sync)?$"))
      ((call_expression
        function: (parenthesized_expression
          (sequence_expression
            . (number) @zero
            . (member_expression
                object: (identifier) @receiver
                property: (property_identifier) @api) .))) @call
        (#eq? @zero "0")
        (#eq? @api "fork")
        (#match? @receiver "^(node_)?child_process(_[0-9]+)?$"))
