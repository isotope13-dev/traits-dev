defaults:
  platforms: [unix, windows]
  attack: T1059
traits:
- id: execveat-api-reference
  desc: References execveat FD execution API
  crit: notable
  conf: 0.9
  for: [c, cpp, rust, go, elf]
  if:
    type: text
    regex: '\bexecveat\s*\(|\bsyscall\s*\(\s*(SYS_execveat|322)\b'
  unless:
    - id: metadata/lang/source::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: metadata/lang/source::linux-kernel-primary-tree-path
    - id: well-known/tool/detection/cilium-tetragon::source-path
    - id: well-known/lib/native/glibc
    - id: well-known/lib/platform/rust-system-bindings::rust-syscall-binding-crate
- id: node-promisified-exec
  desc: Node promisifies the shell exec API
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: symbol
    kind: call
    exact: promisify
    arg:
      kind: identifier
      name: exec
- id: node-promisified-exec-file
  desc: Node promisifies the file exec API
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: symbol
    kind: call
    exact: promisify
    arg:
      kind: identifier
      name: execFile

# Dynamic import/aliasing can hide the call from the symbol extractor. Keep
# these as capabilities; command intent belongs in objective composites.
- id: node-execfile-reference
  desc: References Node execFile API
  crit: notable
  conf: 0.86
  for: [javascript, typescript]
  if:
    type: text
    regex: '\bexecFile(Sync)?\b'

- id: node-escaped-env-fragment
  desc: Escaped env command fragment
  crit: notable
  conf: 0.95
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?i)\\u0065[^"\r\n]{0,24}\\u006e[^"\r\n]{0,24}\\u0076'

- id: node-separated-env-fragment
  desc: Concatenated env command token fragments
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?i)["'']e["'']\s*\+\s*["'']n["'']\s*\+\s*["'']v["'']'


- id: node-do-shell-helper
  desc: JavaScript shell helper invocation
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  mbc: C0017
  attack: T1059.007
  if:
    type: text
    regex: '\b(AsNodeTool|NodeTool)\.doShell\s*\('
- id: node-promisified-exec-call
  desc: Node promisified exec API call
  crit: notable
  conf: 0.85
  for: [javascript, typescript]
  if:
    type: symbol
    kind: call
    regex: '(^|\.)exec(File)?Async$'
- id: exec-family-call-target
  desc: JavaScript exec-family call target
  crit: component
  conf: 0.85
  for: [javascript, typescript]
  if:
    type: text
    regex: '\bchild_process\s*\.\s*exec(File|Sync)?\s*\('
- id: js-child-process
  desc: Calls Node.js child_process execution API
  crit: notable
  conf: 0.92
  for: [javascript, typescript]
  mbc: E1059
  if:
    type: symbol
    kind: call
    regex: '(^|\.)child_process\.(exec(File)?|spawn|fork)(Sync)?$'
- id: js-object-exec-call
  desc: JavaScript child_process.exec call
  crit: notable
  conf: 0.86
  for: [javascript, typescript]
  mbc: C0017
  attack: T1059.007
  if:
    type: symbol
    kind: call
    regex: '(^|\.)child_process\.exec$'
- id: system-api-call
  desc: System-named API reference
  crit: component
  conf: 0.85
  for: [python, javascript, typescript, go, rust]
  if:
    type: symbol
    exact: system
# subprocess.run/Popen/call live under process/create/subprocess/ (run-ast,
# popen-ast, call-ast, process-execution). A parallel notable here double-counted
# the same call for ML and triage; objectives now reference those traits.
- id: python-subprocess-string-command
  desc: Subprocess API receives literal command string
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: symbol
    kind: call
    regex: '^subprocess\.(run|Popen|call)$'
    arg:
      kind: string
  unless:
    - id: metadata/lang/source::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/source::linux-kernel-primary-tree-path
- id: python-os-system-string-command
  desc: os.system receives a literal command string
  crit: notable
  conf: 0.9
  for: [python]
  if:
    # `regex` not `exact`: a `from os import system` leaves the call as bare
    # `system(...)` whose symbol target is `system`, not `os.system`, so an
    # exact match misses the named-import spelling. `(^|\.)system$` catches
    # both `os.system(...)` and the bare form.
    type: symbol
    kind: call
    regex: '(^|\.)system$'
    arg:
      kind: string
  unless:
    - id: metadata/lang/source::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/source::linux-kernel-primary-tree-path
- id: python-os-popen-string-command
  desc: os.popen receives a literal command string
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: symbol
    kind: call
    regex: '(^|\\.)popen$'
    arg:
      kind: string
  unless:
    - id: metadata/lang/source::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/source::linux-kernel-primary-tree-path
- id: python-asyncio-subprocess-call
  desc: Python creates a subprocess through asyncio
  crit: notable
  conf: 0.9
  for: [python]
  if:
    type: symbol
    kind: call
    regex: '(^|\.)create_subprocess_(shell|exec)$'
  unless:
    - id: metadata/lang/source::linux-kernel-primary-tree-path
- id: rust-command-new-call
  desc: Constructs a Rust process command
  crit: notable
  conf: 0.85
  for: [rust]
  if:
    type: text
    regex: '\bCommand::new\s*\('
- id: rust-command-path-variable
  desc: Rust command uses a path variable
  crit: component
  conf: 0.86
  for: [rust]
  if:
    type: text
    regex: 'Command::new\s*\(\s*&?[A-Za-z0-9_]{1,40}_path\s*\)'
  unless:
    - id: metadata/package/testing/
- id: go-exec-command-call
  desc: Creates a child process with Go exec.Command
  crit: component
  conf: 0.85
  for: [go]
  if:
    type: text
    substr: 'exec.Command('

composite_rules:
- id: node-obfuscated-environment-command
  desc: Obfuscated env command token
  crit: notable
  conf: 0.97
  for: [javascript, typescript]
  near_bytes: 500
  all:
  - id: micro-behaviors/data/string/replace::unicode-whitespace-class-replace
  any:
  - id: node-escaped-env-fragment
  - id: node-separated-env-fragment

- id: node-execfile-captures-stdout
  desc: execFile captures stdout
  crit: notable
  conf: 0.92
  for: [javascript, typescript]
  near_bytes: 500
  all:
  - id: node-execfile-reference
  - id: micro-behaviors/process/io/stream::node-stdout-reference

- id: exec-api-call
  desc: Calls Node child-process exec API
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  all:
    - id: micro-behaviors/process/create/shell/bridge::child-process-require
    - id: exec-family-call-target
  unless:
    - id: metadata/lang/scripted::dts-declaration-file
