defaults:
  for: [javascript, typescript]
  crit: notable
  attack: T1059
  platforms: [unix, windows]
traits:
- id: node-exec-file-async-call
  desc: Calls an execFileAsync process wrapper
  crit: notable
  conf: 0.85
  if:
    type: symbol
    kind: call
    regex: (^|\.)execFileAsync$
- id: js-child-process
  desc: Calls a child_process-named execution API
  crit: notable
  conf: 0.92
  mbc: E1059
  if:
    type: symbol
    kind: call
    regex: (^|\.)(_*|node_)child_process(_\d+)?\.(exec(File)?|spawn|fork)(Sync)?$
