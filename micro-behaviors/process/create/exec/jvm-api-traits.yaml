defaults:
  platforms: [windows, unix, android]
  for: [java, class]
traits:
  - id: java-runtime-exec-bytecode-reference
    desc: JVM Runtime.exec method reference
    crit: notable
    conf: 0.95
    for: [class]
    unless:
      # MapStruct shades FreeMarker's optional Execute utility into its
      # annotation-processor JAR.  The utility is a real Runtime.exec
      # capability, but it is not MapStruct's processor execution path.
      - id: well-known/lib/development/mapstruct::mapstruct-processor-jar
      - id: well-known/lib/development/mapstruct::mapstruct-class-namespace
    if:
      type: import
      exact: java/lang/Runtime.exec
