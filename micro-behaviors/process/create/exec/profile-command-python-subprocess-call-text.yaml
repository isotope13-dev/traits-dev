---
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
traits:
- id: python-isolated-tmp-run-text
  desc: Python isolated subprocess and tmp text
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?s)subprocess\.run\(\s*\[\s*sys\.executable.{0,240}["']-I["'].{0,240}\btmp\b
- id: python-subprocess-run-call-text
  desc: subprocess.run call-shaped text
  crit: notable
  conf: 0.75
  for:
  - python
  - text
  if:
    type: text
    regex: "(?m)^[ \\t]*([A-Za-z_]\\w*[ \\t]*=[ \\t]*)?(await[ \\t]+)?subprocess\\.run\\("
  unless:
  - id: micro-behaviors/process/create/subprocess/launch::run-ast
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
  - id: well-known/tool/detection/agent/agentskillmap::cli-context
- id: python-subprocess-check-call-text
  desc: subprocess.check_call text
  crit: notable
  conf: 0.75
  for:
  - python
  - text
  if:
    type: text
    substr: subprocess.check_call(
