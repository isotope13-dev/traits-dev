# File APIs and policy overrides do not establish a hostile dropper.
defaults:
  platforms:
  - windows
  for:
  - javascript
composite_rules:
- id: wsh-powershell-policy-launch
  desc: WSH launch with file APIs and PowerShell policy override
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/process/create/exec::wsh-progid-near-run
  - id: micro-behaviors/process/create/flags::wsh-run-hidden-text
  - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-statement
  - id: micro-behaviors/process/create/shell/script-host::wscript-shell-run
  - id: micro-behaviors/process/create/shell/wsh::wscript-shell-run-obfuscated
  - id: micro-behaviors/process/create/shell/wsh::wscript-shell-exec-indirect
  all:
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/os/com/automation::filesystemobject-progid
  - id: micro-behaviors/process/argument/option::execution-policy-bypass
