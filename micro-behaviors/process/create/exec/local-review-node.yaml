defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-execfile-task-payload
    desc: Node execFile receives task payload
    crit: notable
    conf: 0.96
    attack: T1059.001,T1059.003
    if:
      type: text
      regex: '\bexecFile\w*\s*\([^\r\n)]{0,240}(task|message|job)\.(payload|command|script)\b'
