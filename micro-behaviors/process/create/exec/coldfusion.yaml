# FileFacts identifies ColdFusion pages as `cfml`, including mixed markup.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.9
  attack: T1059
traits:
  - id: cfexecute-tag
    desc: ColdFusion CFEXECUTE launches a program
    if:
      type: text
      regex: '<\s*cfexecute\b'
      case_insensitive: true
  - id: cfm-java-object-instantiation
    desc: CFML instantiates a Java class
    conf: 0.85
    if:
      type: text
      regex: 'CreateObject\s*\(\s*["'']java["'']\s*,'
      case_insensitive: true
