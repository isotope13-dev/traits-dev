# FileFacts identifies ColdFusion pages as `cfml`, including mixed markup.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.9
  attack: T1059
traits:
  - id: cfexecute-tag
    desc: ColdFusion CFEXECUTE launches a program
    if:
      type: symbol
      kind: call
      exact: cfexecute
      arg:
        index: 0
        kind: object
  - id: cfexecute-output-file
    desc: CFML execution specifies an output file
    if:
      type: symbol
      kind: call
      exact: cfexecute
      arg:
        index: 0
        from:
          field: outputfile
          field_exists: true
  - id: cfexecute-request-program
    desc: CFML request member supplies executable name
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: cfexecute
      arg:
        index: 0
        from:
          field: name
          member: '^(form|url)\.'
