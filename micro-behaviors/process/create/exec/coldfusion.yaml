# FileFacts identifies ColdFusion pages as `cfml`, including mixed markup.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.9
  attack: T1059
traits:
  - id: cfexecute-tag
    desc: ColdFusion CFEXECUTE launches a program
    if:
      type: symbol
      kind: call
      exact: cfexecute
      arg:
        index: 0
        kind: object
