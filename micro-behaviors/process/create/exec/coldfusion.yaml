# ColdFusion (.cfm/.cfml) markup is typed as VBScript by the walker because the
# `<CFSCRIPT>` bodies parse as VB-like syntax, so these traits target `vbs` plus
# the HTML/text shapes a CFML page can also be detected as.
defaults:
  platforms: [unix, windows]
  for: [vbs, html]
  crit: notable
  conf: 0.9
  attack: T1059
traits:
  - id: cfexecute-tag
    desc: ColdFusion CFEXECUTE launches a program
    if:
      type: text
      regex: '<\s*cfexecute\b'
      case_insensitive: true
  - id: cfm-java-object-instantiation
    desc: CFML instantiates a Java class
    conf: 0.85
    if:
      type: text
      regex: 'CreateObject\s*\(\s*["'']java["'']\s*,'
      case_insensitive: true
