defaults:
  platforms:
    - linux
  for:
    - source
    - binaries
    - c
traits:
  - id: shell-exec-variable-command
    desc: Execs a variable-held shell command
    crit: notable
    conf: 0.85
    for: [shell, makefile, text]
    platforms: [unix]
    if:
      type: text
      regex: '\bexec\s+"?\$\{?[A-Za-z_]\w{0,20}'

  - id: shell-exec-positional-argument
    desc: Execs a positional shell argument
    crit: notable
    conf: 0.85
    for: [shell, makefile, text]
    platforms: [unix]
    if:
      type: text
      # Do not treat a function such as `ovs-exec "$2"` as a shell `exec`.
      # The command must be a standalone shell word.
      regex: '(^|[^A-Za-z0-9_-])exec[[:space:]]+["'']?\$[2-9]([^A-Za-z0-9_]|$)'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/package/testing/presence/harness::test-directory-path

  - id: call-usermodehelper
    desc: 'Executes user-mode process from kernel'
    crit: notable
    conf: 0.95
    mbc: E1059
    attack: T1059
    for: [c, cpp, elf]
    if:
      type: symbol
      substr: call_usermodehelper
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
