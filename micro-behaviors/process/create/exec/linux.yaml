defaults:
  platforms:
  - linux
  for:
  - source
  - binaries
  - c
  crit: notable
traits:
- id: shell-exec-variable-command
  desc: Execs a variable-held shell command
  conf: 0.85
  for:
  - shell
  - makefile
  - text
  platforms:
  - unix
  if:
    type: text
    regex: (?m)(^|[;&|])[ \t]*exec[ \t]+"?\$\{?[A-Za-z_]\w{0,20}
- id: shell-exec-positional-argument
  desc: Execs a positional shell argument
  conf: 0.85
  for:
  - shell
  - makefile
  - text
  platforms:
  - unix
  if:
    type: text
    regex: (^|[^A-Za-z0-9_-])exec[[:space:]]+["']?\$[2-9]([^A-Za-z0-9_]|$)
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: call-usermodehelper
  desc: Executes user-mode process from kernel
  conf: 0.95
  mbc: E1059
  attack: T1059
  for:
  - c
  - cpp
  - elf
  if:
    type: symbol
    substr: call_usermodehelper
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
