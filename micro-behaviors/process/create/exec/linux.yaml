defaults:
  platforms:
  - linux
  for:
  - source
  - binaries
  - c
  crit: component
traits:
- id: call-usermodehelper-invocation
  desc: Calls kernel usermode-helper API
  crit: notable
  conf: 0.95
  for: [c, cpp]
  if:
    type: symbol
    kind: call
    regex: '^call_usermodehelper(_[A-Za-z0-9_]+)?$'
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
