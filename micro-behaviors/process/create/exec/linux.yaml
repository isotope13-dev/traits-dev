defaults:
  platforms:
  - linux
  for:
  - source
  - binaries
  - c
  crit: component
traits:
- id: call-usermodehelper
  desc: Kernel usermode-helper symbol reference
  conf: 0.95
  mbc: E1059
  attack: T1059
  for:
  - c
  - cpp
  - elf
  if:
    type: symbol
    substr: call_usermodehelper
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: call-usermodehelper-invocation
  desc: Calls kernel usermode-helper API
  crit: notable
  conf: 0.95
  for: [c, cpp]
  if:
    type: symbol
    kind: call
    regex: '^call_usermodehelper(_[A-Za-z0-9_]+)?$'
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
