defaults:
  platforms: [unix, windows]
  for: [jsp, java]
  crit: notable
  conf: 0.99
traits:
  - id: java-split-prefix-argv-exec
    desc: Runtime executes split-prefix z1/z2 argv
    if:
      type: text
      substr: 'String[] c={z1.substring(2),z1.substring(0,2),z2};Process p=Runtime.getRuntime().exec(c);'
      exclude_html_comments: true
    # Decline reassigned operands and comments in this lexical signature.
    unless:
      - type: text
        regex: '(?s)\bz1\s*=.*\bz1\s*='
      - type: text
        regex: '(?s)\bz2\s*=.*\bz2\s*='
      - type: text
        regex: '/\*|<%--|<!--'
      - type: text
        regex: '(?m)(^|;)\s*//'
