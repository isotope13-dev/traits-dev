defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  # Call facts retain the array shape but not its elements. Provenance is
  # absent inside some Promise callbacks, so inspect this call's syntax.
  - id: node-interactive-mode-spawn
    desc: Spawns Node in interactive mode
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: [(identifier) @spawn (member_expression) @spawn]
          arguments: (arguments (string) @exe (array (string) @mode))) @evidence
          (#match? @spawn "(^|[.])spawn$")
          (#match? @exe "^[\"']node([.]exe)?[\"']$")
          (#match? @mode "^[\"'](-i|--interactive)[\"']$"))
