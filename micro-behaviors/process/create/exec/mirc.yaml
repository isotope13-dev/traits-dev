defaults:
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, binaries, objectivec, lua, data, dos_com]
traits:
  - id: mirc-run-executable
    desc: mIRC run command launches an exe
    crit: notable
    conf: 0.9
    for: [mirc, ircii]
    if:
      type: text
      # Bare `run file.exe` is an mIRC command inside a script. The same
      # words in prose stay out because this trait is mIRC-typed.
      regex: '(?i)(^|[\s;{|=/])\.?/?run\s+(-[a-z]+\s+)?\S{1,48}\.exe\b'
