defaults:
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, binaries, objectivec, lua, data, dos_com]
traits:
  - id: mirc-run-executable
    desc: mIRC run command launches an exe
    crit: notable
    conf: 0.9
    for: [mirc, ircii]
    if:
      type: text
      # Bare `run file.exe` is an mIRC command inside a script. The same
      # words in prose stay out because this trait is mIRC-typed.
      regex: '(?i)(^|[\s;{|=/])\.?/?run\s+(-[a-z]+\s+)?\S{1,48}\.exe\b'

  - id: mirc-run-batch-file
    desc: mIRC run command references a batch file
    crit: notable
    conf: 0.88
    for: [mirc]
    if:
      type: text
      regex: '(?i)\brun\b[^\r\n]{0,60}\.bat'

  - id: mirc-config-click-run-executable
    desc: mIRC click binding declares EXE run command
    crit: notable
    conf: 0.97
    platforms: [windows]
    for: [text, mirc]
    if:
      type: text
      # Include mIRC path expressions such as `$mircdir $+ helper.exe`.
      # Keep the executable at the command's target, not in later arguments.
      regex: '(?im)^\[clicks\][^\[]{0,900}^\w+=//run +(\$mircdir *\$\+ *)?[^\s|]{1,48}\.exe\b'
