defaults:
  for: [pe, dll]
  platforms: [windows]

composite_rules:
  - id: minimal-export-winexec-systemdir-api-profile
    desc: Resource-free DLL with WinExec and system-directory APIs
    crit: notable
    conf: 0.89
    all:
      - id: metadata/binary/header/characteristics::pe-dll-characteristics
      - id: metadata/binary/symbols/count::minimal-exports
      - id: micro-behaviors/process/create/exec::winexec
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
      - id: metadata/binary/resource/size::small-pe-no-resources
    any:
      - id: micro-behaviors/process/sync/mutex::mutex-instance-check
      - id: micro-behaviors/os/env/block::get-environment-strings
      - id: metadata/binary/code/complexity::few-functions
    needs: 2
    unless:
      - id: metadata/binary/resource/identity::pe-version-resource
      - id: metadata/signed/platform/
