defaults:
  platforms: [windows, unix]
  for: [go]
  attack: T1106
traits:
  - id: syscall-exec
    desc: "Direct execution via syscall.Exec"
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: "syscall.Exec"
  - id: syscall-forkexec
    desc: "Direct execution via syscall.ForkExec"
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: "syscall.ForkExec"
  - id: start-process
    desc: "Direct execution via os.StartProcess"
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: "os.StartProcess"
