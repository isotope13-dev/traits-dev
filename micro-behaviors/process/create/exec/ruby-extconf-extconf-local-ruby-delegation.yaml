defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  - id: extconf-local-ruby-delegation
    desc: Ruby delegates an extension build
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'system\s*\(\s*ruby\s*,\s*["'']-C["'']\s*,[\s\S]{0,160}extconf_rb_path\.to_s'

  # Keep the install-hook evidence tied to the extconf file itself.  A
  # package-wide relative require plus unrelated network/process code is not
  # enough to call a native-extension build a payload launcher.
