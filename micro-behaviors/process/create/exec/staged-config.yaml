defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

composite_rules:
  - id: js-staged-config-launch
    desc: Node spawn beside stage0 and config64 arguments
    crit: notable
    conf: 0.96
    for: [javascript]
    near_bytes: 500
    all:
      - id: micro-behaviors/process/create/spawn::spawn-call
      - id: micro-behaviors/process/argument/subcommand::stage0-task-argument
      - id: micro-behaviors/process/argument/option::inline-config64-flag
