defaults:
  for: [perl]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: perl-open3-call
    desc: Perl IPC::Open3 process creation
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: open3

  - id: perl-exec-call
    desc: Perl replaces process with exec
    if:
      type: symbol
      kind: call
      exact: exec
