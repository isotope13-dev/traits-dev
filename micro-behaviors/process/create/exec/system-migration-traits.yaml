defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [python, javascript, ruby, go]
traits:
  - id: perl-system-process-call
    desc: Perl system process call
    crit: notable
    conf: 0.9
    for: [perl]
    if:
      type: symbol
      kind: call
      exact: system


  - id: perl-system-interpreter-launch
    desc: Perl system launches interpreter
    crit: notable
    conf: 0.94
    for: [perl]
    if:
      type: text
      regex: '\bsystem\s*\(\s*\$\^X\s*,'

composite_rules:
  - id: system-process-call
    desc: Perl or Ruby system-call syntax
    crit: notable
    conf: 0.9
    for: [perl, ruby]
    any:
      - id: micro-behaviors/process/create/exec::perl-system-process-call
      - id: micro-behaviors/process/create/exec::ruby-system-process-call
