defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: winexec-sw-show-immediate
    desc: WinExec called with normal-window flag
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: WinExec
      arg:
        kind: number
        value: 1
