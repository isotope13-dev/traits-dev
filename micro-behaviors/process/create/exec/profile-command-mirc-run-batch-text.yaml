defaults:
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, binaries, objectivec, lua, data, dos_com]
traits:
  - id: mirc-run-batch-file
    desc: mIRC run and batch filename text
    crit: notable
    conf: 0.88
    for: [mirc]
    if:
      type: text
      regex: '(?i)\brun\b[^\r\n]{0,60}\.bat'

