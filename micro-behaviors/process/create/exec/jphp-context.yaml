defaults:
  platforms:
  - windows
  for:
  - pe
  - data
  - php
  - xml
traits:
- id: jphp-timer-action-handler
  desc: JPHP timer action handler
  crit: suspicious
  conf: 0.92
  if:
    type: text
    substr: '@event timer.action'
- id: jphp-process-start-and-wait
  desc: JPHP blocking process launch
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: startAndWait
composite_rules:
- id: jphp-powershell-defender-exclusion
  for:
  - pe
  - data
  desc: PowerShell Defender exclusion process context
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/os/security/defender::defender-exclusion-command
  any:
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-launch4j-fxlauncher
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-bootstrap-config
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-process-class
  - id: micro-behaviors/fs/write/file/full::jphp-file-put-contents
- id: jphp-autostart-zip-downloader
  desc: JPHP auto-start timer with archive URL
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/process/create/exec::jphp-timer-action-handler
  - id: micro-behaviors/data/property/assign::jphp-autostart-timer-property
  - id: micro-behaviors/communications/http/download/url::archive-url-reference-binary
- id: jphp-powershell-defender-exclusion-runner
  for:
  - pe
  desc: writes and runs a PowerShell Defender exclusion process context script
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/data/decode/base64::base64-decoding
  - id: micro-behaviors/fs/write/file/full::jphp-file-put-contents
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-process-class
  - id: micro-behaviors/process/create/exec::jphp-process-start-and-wait
  - id: micro-behaviors/process/create/exec::jphp-powershell-defender-exclusion
- id: jphp-admin-autostart-process-stager
  for:
  - pe
  desc: JPHP admin auto-start process context
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/os/privilege/manifest::admin-manifest
  - id: micro-behaviors/data/property/assign::jphp-autostart-timer-property
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-process-class
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-launch4j-fxlauncher
- id: jphp-admin-sfx-process-launcher
  desc: JPHP admin overlay and process context
  crit: suspicious
  conf: 0.97
  scope: outer
  all:
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-launch4j-fxlauncher
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-bootstrap-config
  - id: micro-behaviors/os/privilege/manifest::admin-manifest
  - id: metadata/binary/layout/overlay::large-overlay-1mb
  any:
  - id: micro-behaviors/process/create/spawn::child-process-creation-api
  - id: micro-behaviors/process/create/shell/spawn::win-shellexecute
  - id: micro-behaviors/process/create/spawn::create-process-a
  - id: micro-behaviors/process/create/shellexec::shell-execute-a
