defaults:
  platforms:
  - windows
  for:
  - pe
  - data
  - php
  - xml
composite_rules:
- id: jphp-autostart-zip-downloader
  desc: JPHP auto-start timer with archive URL
  crit: suspicious
  conf: 0.97
  all:
  - id: metadata/lang/source/syntax::jphp-timer-action-annotation
  - id: micro-behaviors/data/property/assign::jphp-autostart-timer-property
  - id: micro-behaviors/communications/http/download/url::archive-url-reference-binary

- id: jphp-admin-autostart-process-stager
  for:
  - pe
  desc: JPHP admin auto-start process context
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/os/privilege/manifest::admin-manifest
  - id: micro-behaviors/data/property/assign::jphp-autostart-timer-property
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-process-class
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-launch4j-fxlauncher
- id: jphp-admin-sfx-process-launcher
  desc: JPHP admin overlay and process context
  crit: suspicious
  conf: 0.97
  scope: outer
  all:
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-launch4j-fxlauncher
  - id: micro-behaviors/process/interpreter/runtime/jphp::jphp-bootstrap-config
  - id: micro-behaviors/os/privilege/manifest::admin-manifest
  - id: metadata/binary/layout/overlay::large-overlay-1mb
  any:
  - id: micro-behaviors/process/create/spawn::child-process-creation-api
  - id: micro-behaviors/process/create/shell/spawn::win-shellexecute
  - id: micro-behaviors/process/create/exec::create-process-a
  - id: micro-behaviors/process/create/shellexec::shell-execute-a
