# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - perl
  - static-lib
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
traits:
- id: perl-exec-quoted-shell
  desc: Perl execs a quoted shell path
  if:
    type: text
    # Pentestmonkey writes exec({"/bin/sh"} ($name, "-i")), with the
    # block inside the call so argv0 can be replaced.
    regex: exec\s*\(?\s*\{\s*['"]/bin/sh['"]
