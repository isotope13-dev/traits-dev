defaults:
  crit: notable
  platforms: [linux, macos]
traits:
  # The whole exec family, in source, to match what c-exec-variants above
  # already recognizes in compiled binaries. Keying source on `execl` alone
  # left the path-searching spellings unmatched, and those are the ones a
  # payload reaches for when it does not want to hardcode an interpreter
  # path -- execlp("sh", "sh", "-i", NULL) is how the rctl-derived router
  # implants spawn their shell.
  - id: c-exec-family-source
    desc: exec family call in C source
    crit: notable
    conf: 0.85
    for:
      - c
      - cpp
    if:
      type: symbol
      kind: call
      regex: '^exec(l[ep]?|v[ep]?|vpe)$'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
