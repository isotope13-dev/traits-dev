traits:
- crit: notable
  conf: 0.8
  id: start-process-call
  desc: Start-Process call
  if:
    type: symbol
    kind: call
    regex: (?i)^Start-Process$
  unless:
  - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
- id: powershell-start-sdclt
  desc: Starts the Windows Backup launcher
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: call
    exact: Start-Process
    arg:
      index: 0
      kind: identifier
      name: sdclt.exe
defaults:
  for:
  - powershell
  platforms:
  - windows
