defaults:
  crit: notable
  platforms: [unix, windows]
  for: [powershell]
traits:
  - id: regsvr32-powershell-call
    desc: PowerShell invokes regsvr32.exe
    conf: 0.96
    attack: T1218.010
    mbc: E1218.010
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: symbol
      kind: call
      regex: '(?i)^regsvr32(\.exe)?$'
