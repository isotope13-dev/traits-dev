traits:
- crit: notable
  conf: 0.9
  id: node-npm-spawn-target
  desc: Spawns the npm package CLI
  if:
    type: symbol
    kind: call
    substr: spawn
    arg:
      kind: string
      exact: npm
- crit: notable
  conf: 0.9
  id: node-npx-target
  desc: Spawns the npx package runner
  if:
    type: symbol
    kind: call
    regex: (^|\.)spawn(Sync)?$
    arg:
      kind: string
      exact: npx
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
