# Node's child_process APIs naming mshta.exe as the program or in the command string.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  crit: suspicious
  attack: T1218.005

traits:
  - id: js-child-process-mshta
    desc: Node child process launches mshta
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: (^|\.)(spawn|spawnSync|execFile|execFileSync|exec|execSync)$
      arg:
        kind: string
        regex: (?i)^\s*(\S*[\\/])?mshta(\.exe)?(\s|$)
