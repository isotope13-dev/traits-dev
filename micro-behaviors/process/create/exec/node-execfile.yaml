defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: js-execfilesync
    desc: Executes a file synchronously
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)execFileSync$'
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog

  - id: js-execfile-call
    desc: Calls Node.js execFile or execFileSync
    crit: notable
    mbc: E1059
    attack: T1059
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^execFile(Sync)?$'
