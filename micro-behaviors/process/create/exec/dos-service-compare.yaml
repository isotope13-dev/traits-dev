# A service-number comparison establishes a test, not execution or infection.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib]
  size_max: 65536
traits:
  - id: dos-exec-service-compare
    desc: Compares DOS program-execution service number
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "3D 00 4B"
