defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
traits:
- id: node-spawn-python-interpreter
  desc: Node spawns a Python interpreter
  crit: notable
  conf: 0.92
  mbc: "C0017"
  attack: "T1059.006"
  for: [javascript, typescript]
  if:
    type: symbol
    kind: call
    regex: '(^|\.)spawn$'
    arg:
      kind: string
      regex: '^python([0-9]+(\.[0-9]+)?)?$'
