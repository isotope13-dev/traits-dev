defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.85

traits:
  - id: python-os-execve-call
    desc: Python os.execve process replacement
    conf: 0.92
    platforms: [unix, android, ios]
    attack: T1106
    if:
      type: symbol
      kind: call
      exact: os.execve
  - id: python-os-execvp-call
    desc: Python calls os.execvp
    if:
      type: symbol
      kind: call
      exact: os.execvp
  - id: python-windows-os-execve-call
    desc: Python calls os.execve on Windows
    platforms: [windows]
    if:
      type: tree-sitter
      language: python
      query: |
        (call function: (attribute object: (identifier) @module attribute: (identifier) @method)
          (#eq? @module "os")
          (#eq? @method "execve")) @call
  - id: python-os-image-execution-call
    desc: Python calls an exec or spawn API
    if:
      type: symbol
      kind: call
      regex: '^os\.(exec|spawn)[lv](e|p|pe)?$|^os\.posix_spawnp?$|^distutils\.spawn\.spawn$'
