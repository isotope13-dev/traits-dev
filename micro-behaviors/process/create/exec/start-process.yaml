composite_rules:
- id: start-process-call
  desc: Start-Process call or FilePath command text
  for: &id002
  - powershell
  - batch
  - pe
  - csharp
  - javascript
  - vbs
  unless: &id001
  - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
  any:
  - id: start-process-symbol-call
  - id: start-process-filepath-text
traits:
- id: start-process-symbol-call
  desc: Parsed Start-Process call
  for:
  - powershell
  if:
    type: symbol
    kind: call
    regex: (?i)^Start-Process$
  unless: *id001
- id: start-process-filepath-text
  desc: Start-Process FilePath command text
  for: *id002
  if:
    type: text
    regex: (?i)\bStart-Process\b[^\r\n]{0,120}-FilePath\b
defaults:
  platforms:
  - windows
  crit: notable
  conf: 0.94
