defaults:
  platforms: [windows]
  for: [scripts, binaries, html]
traits:
  - id: wsh-progid-near-run
    crit: notable
    conf: 0.9
    desc: WScript.Shell near Run/Exec launch syntax
    if:
      type: text
      regex: '(?is)WScript\.Shell.{0,512}[\[.]\s*["'']?(Run|Exec)["'']?\]?\s*(\(|[A-Za-z_])'
