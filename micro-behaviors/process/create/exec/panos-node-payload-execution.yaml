defaults:
  platforms: [panos, appliance, unix]
  for: [javascript, typescript]
  attack: T1105

traits:
- id: panos-node-downloaded-exec
  desc: PAN-OS Node payload execution function
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: downloadedPayload[\s\S]{0,220}executePayload
- id: panos-node-temp-payload-exec
  desc: PAN-OS download call followed by execSync
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: downloadPayload\(fullUrl, dest\)[\s\S]{0,260}execSync
