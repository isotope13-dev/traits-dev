defaults:
  crit: notable
  platforms:
  - unix
  - android
  for:
  - elf
  arch:
  - mips
traits:
- id: mips-o32-execve-syscall
  desc: MIPS O32 direct execve syscall sequence
  conf: 0.99
  if:
    type: hex
    section: .text
    pattern: (24 02 0F AB 00 00 00 0C | AB 0F 02 24 0C 00 00 00)
  unless:
  - type: value
    path: elf.machine
    exact: unknown
  - type: value
    path: elf.machine
    exact: s390
  - type: metrics
    field: elf.parse_failed
    min: 1
