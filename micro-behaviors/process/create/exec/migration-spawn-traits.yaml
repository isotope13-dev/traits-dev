# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: child-process-creation-api
  desc: Starts a child process through a platform API
  crit: notable
  conf: 0.92
  attack: T1106
  for:
  - binaries
  - scripts
  - source
  platforms:
  - windows
  - unix
  unless:
  - id: well-known/lib/ui/cytoscape::cytoscape-stylesheet-runtime-marker
  any:
  - id: micro-behaviors/process/create/subprocess/launch::java-processbuilder-start-source
  - id: micro-behaviors/process/create/subprocess/launch::dotnet-process-start
  - id: micro-behaviors/process/create/subprocess/launch::swift-source-process-run
  - id: micro-behaviors/process/create/exec::child-process-member-spawn
  - id: micro-behaviors/process/create/exec::child-process-alias-spawn
  - id: micro-behaviors/process/create/exec::go-pe-child-process-start-call
  - id: micro-behaviors/process/create/exec::child-process-destructured-spawn-call
