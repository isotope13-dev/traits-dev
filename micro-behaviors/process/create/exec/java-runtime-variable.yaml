# A JSP shell commonly stores Runtime.getRuntime() in a local variable before
# calling exec; this is the JVM execution spelling, not a generic identifier.
defaults:
  attack: T1059
  mbc: E1203
  platforms: [unix, windows]
  for: [java, kotlin, html]
  crit: notable
  conf: 0.82
traits:
  - id: java-runtime-variable-exec-source
    desc: JVM Runtime variable exec call in source
    if:
      type: text
      regex: '(?i)\bruntime\s*\.\s*exec\s*\('
