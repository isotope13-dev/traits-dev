defaults:
  platforms: [windows]
  for: [vbs, asp]
composite_rules:
  - id: classic-asp-request-variable-process
    desc: ASP request intake and variable process launch
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/request/superglobal::classic-asp-request-field
      - id: micro-behaviors/process/create/exec::wsh-exec-variable-command
    unless:
      - id: metadata/lang/source::yara-rule-source
      - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member

# The concealment-gated variant: an allowlisted page that answers only its
# operator's address and executes a variable command for that operator. The
# gate plus fake 404 keeps it off scanners' radar, which is why the pair
# convicts where either leg alone would stay notable.
