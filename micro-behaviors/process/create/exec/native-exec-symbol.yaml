# Relocated by the supported observation; matchers and scope preserved.
traits:
- platforms:
  - linux
  - macos
  for:
  - elf
  - macho
  id: c-exec-variants
  desc: C-style exec family functions
  crit: notable
  conf: 0.8
  if:
    type: symbol
    regex: ^exec(l(e|p)?|v(p(e)?)?)$
  unless:
  - id: metadata/file/string/identity::node-pty-native-basename
  - type: basename
    exact: spawn-helper
  - id: metadata/file/string/identity::chrome-sandbox-basename
  - type: basename
    regex: ^russh\..*\.node$
  - id: well-known/app/ai/coding-agent/tabby::tabby-basename
