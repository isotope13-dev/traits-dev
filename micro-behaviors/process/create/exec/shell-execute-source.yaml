defaults:
  for:
    - c
  platforms:
    - windows
traits:
  - id: lorraine-hta-launch
    desc: Launches Lorraine HTA payload
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: PChar('c:\lorraine.c.hta')
  - id: gratisweb-launch
    desc: Opens Falckon website URL
    crit: suspicious
    conf: 0.98
    if:
      type: string_literal
      substr: http://www.gratisweb.com/falckon/index.html
composite_rules:
  - id: shell-execute-payload-launch
    desc: ShellExecute launches payload artifacts
    crit: suspicious
    conf: 0.98
    all:
    - id: micro-behaviors/process/create/shellexec::shell-execute-call-source
    any:
    - id: lorraine-hta-launch
    - id: gratisweb-launch
