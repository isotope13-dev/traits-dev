defaults:
  platforms: [windows]
  for: [oledoc, msi]

traits:
  - id: micro-behaviors/process/create/exec::msi-exe-csproj-nologo-command
    desc: MSI executable command references C# project
    crit: notable
    conf: 0.99
    if:
      type: raw
      regex: '(?i)\b[A-Za-z0-9_.-]{4,}\.exe/nologo\s+"\[[A-Za-z0-9_]+\][^"]{1,96}\.csproj"\s+/nr:false'
