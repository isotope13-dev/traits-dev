defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: node-process-launch-call
    desc: Invokes a Node.js child-process launch API
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/process/create/spawn::spawn-call
      - id: micro-behaviors/process/create/shell/spawn::shell-exec
      - id: micro-behaviors/process/create/system::js-execfile-call
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
      - id: micro-behaviors/process/create/shell/bridge::execSync-call

  - id: node-child-process-capability
    desc: Imports or invokes Node.js child-process APIs
    crit: notable
    conf: 0.8
    any:
      - id: metadata/import/package/child_process
      - id: metadata/import/builtin::require-child-process
      - id: micro-behaviors/process/create/exec::js-child-process
