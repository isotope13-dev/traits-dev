defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: node-process-launch-call
    desc: Invokes a Node.js child-process launch API
    conf: 0.9
    any:
      - id: metadata/file/profile/execution-api::spawn-call
      - id: micro-behaviors/process/create/shell/command-string::js-exec
      - id: micro-behaviors/process/create/exec::js-execfile-call
      - id: micro-behaviors/process/create/shell/command-string::execSync-call

  - id: javascript-eval-near-child-process
    desc: JavaScript dynamic evaluation and child-process launch occur nearby
    conf: 0.9
    near_bytes: 4096
    all:
      - id: node-process-launch-call
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-call-expression-arg
      - id: micro-behaviors/metaprogramming/generation/function::embedded-eval-variable-source
      - id: metadata/file/encoding/shape::encoded-eval-expression-reference
    unless:
      - id: micro-behaviors/os/module/require::node-eval-require-module-load
