# Process creation APIs used by an agent-controlled workflow.
#
# The members are language-specific capabilities defined in their canonical
# process-creation files. This composite normalizes the child-process evidence
# so objective rules do not need to duplicate that list.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries]
  attack: T1059

composite_rules:
  - id: child-process-execution
    desc: Executes a child process
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: micro-behaviors/process/create/system::js-execfile-call
      - id: micro-behaviors/process/create/exec::js-child-process
      - id: micro-behaviors/process/create/direct::exec-command
      - id: micro-behaviors/process/create/exec::rust-command-new-call
      # The creation atoms of spawn/, not the whole directory: that directory
      # also holds the *supporting* primitives of process control (CloseHandle,
      # WaitForSingleObject, GetExitCodeProcess) and bare per-language
      # member-name fragments. Sweeping them in made this composite claim
      # "child-process execution" for any Windows binary that merely closes a
      # handle.
      - id: micro-behaviors/process/create/spawn::child-process-creation-api
      - id: micro-behaviors/process/create/shell/bridge::js-execfilesync
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
      - id: micro-behaviors/process/create/shell/spawn::shell-execution-comp
      - id: micro-behaviors/process/create/shell/lang::system-call
      - id: micro-behaviors/process/create/start-process::start-process-call
