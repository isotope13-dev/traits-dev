# Process creation APIs used by an agent-controlled workflow.
#
# The members are language-specific capabilities defined in their canonical
# process-creation files. This composite normalizes the child-process evidence
# so objective rules do not need to duplicate that list.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries, go]
  attack: T1059

composite_rules:
  - id: child-process-execution
    desc: Executes a child process
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: micro-behaviors/process/create/system::js-execfile-call
      - id: micro-behaviors/process/create/exec::js-child-process
      - id: micro-behaviors/process/create/exec::go-exec-command-call
      - id: micro-behaviors/process/create/direct::ruby-spawn
      - id: micro-behaviors/process/create/direct::zig-child-init
      - id: micro-behaviors/process/create/subprocess::rust-command-new-call
      - id: micro-behaviors/process/create/system::elixir-system-cmd
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol
      # The creation atoms of spawn/, not the whole directory: that directory
      # also holds the *supporting* primitives of process control (CloseHandle,
      # WaitForSingleObject, GetExitCodeProcess) and bare per-language
      # member-name fragments. Sweeping them in made this composite claim
      # "child-process execution" for any Windows binary that merely closes a
      # handle.
      - id: micro-behaviors/process/create/spawn::child-process-creation-api
      - id: micro-behaviors/process/create/system::js-execfilesync
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      # spawnSync is the third member of the same Node child_process trio; a
      # destructured `const { spawnSync } = require('child_process')` call is
      # bare, so the member-call atom in exec/ never sees it.
      - id: micro-behaviors/process/create/exec::node-spawnsync-call
      - id: micro-behaviors/process/create/shell/spawn::shell-execution-capability
      - id: micro-behaviors/process/create/shell/spawn::shell-execution-comp
      - id: micro-behaviors/process/create/shell/lang::proc-open
      - id: micro-behaviors/process/create/system::system-process-call
      - id: perl-exec-call
      - id: micro-behaviors/process/create/start-process::start-process-call
