# Process creation APIs used by an agent-controlled workflow.
#
# The members are language-specific capabilities defined in their canonical
# process-creation files. This composite normalizes the child-process evidence
# so objective rules do not need to duplicate that list.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries, go]

composite_rules:
  - id: child-process-execution
    desc: Child process execution or API evidence
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/process/create/subprocess/launch::process-execution
      - id: micro-behaviors/process/create/exec::js-execfile-call
      - id: micro-behaviors/process/create/exec::js-child-process
      - id: micro-behaviors/process/create/subprocess/launch::go-command-launch
      - id: micro-behaviors/process/create/exec::ruby-spawn
      - id: micro-behaviors/process/create/subprocess/launch::rust-command-spawn-call
      - id: micro-behaviors/process/create/exec::elixir-system-cmd
      # The creation atoms of spawn/, not the whole directory: that directory
      # also holds the *supporting* primitives of process control (CloseHandle,
      # WaitForSingleObject, GetExitCodeProcess) and bare per-language
      # member-name fragments. Sweeping them in made this composite claim
      # "child-process execution" for any Windows binary that merely closes a
      # handle.
      - id: micro-behaviors/process/create/exec::child-process-creation-evidence
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      # spawnSync is the third member of the same Node child_process trio; a
      # destructured `const { spawnSync } = require('child_process')` call is
      # bare, so the member-call atom in exec/ never sees it.
      - id: micro-behaviors/process/create/exec::node-spawnsync-call
      - id: micro-behaviors/process/create/shell/interpreter::shell-execution-capability
      - id: micro-behaviors/process/create/subprocess/launch::proc-open
      - id: micro-behaviors/process/create/exec::system-process-call
      - id: micro-behaviors/process/create/shell/variable-command::c-system-command-call
      - id: micro-behaviors/process/create/shell/command-mode::powershell-native-cmd-command
      - id: micro-behaviors/process/replace::perl-exec-call
      - id: micro-behaviors/process/create/cmdlet::start-process-call
