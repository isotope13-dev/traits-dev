# Process creation APIs used by an agent-controlled workflow.
#
# The members are language-specific capabilities defined in their canonical
# process-creation files. This composite only normalizes the cross-language
# execution evidence so objective rules do not need to duplicate that list.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries]
  attack: T1059

composite_rules:
  - id: cross-language-process-execution
    desc: Cross-language child-process execution capability
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: micro-behaviors/process/create/system::js-execfile-call
      - id: micro-behaviors/process/create/exec::js-child-process
      - id: micro-behaviors/process/create/direct::exec-command
      - id: micro-behaviors/process/create/exec::rust-command-new-call
      - id: micro-behaviors/process/create/spawn
      - id: micro-behaviors/process/create/shell/bridge::js-execfilesync
      - id: micro-behaviors/process/create/shell/bridge::js-execsync
      - id: micro-behaviors/process/create/shell/spawn::shell-execution-comp
      - id: micro-behaviors/process/create/start-process::start-process-call
