defaults:
  platforms: [windows, unix]
  for: [ruby]

traits:
  - id: ruby-spawn
    desc: Ruby creates a child process
    crit: notable
    conf: 0.95
    # Process.spawn is the namespaced form of the same child-process call.
    if:
      type: symbol
      kind: call
      regex: '^(Process\.)?spawn$'
