defaults:
  platforms: [windows]
  for: [oledoc, msi]
  attack: "T1204.002"
  conf: 0.92
  crit: suspicious
traits:
- id: advanced-installer-runasadmin-exe
  desc: "Adv Installer launches embedded EXE elevated"
  conf: 0.97
  if:
    type: text
    regex: 'LaunchFile/DontWait\s+/Run\s*AsAdmin\s+"\[#.{1,80}\.exe\]"'
composite_rules:
- id: advanced-installer-embedded-exe-launch
  desc: MSI launches embedded EXE via Advanced Installer
  conf: 0.97
  all:
  - id: micro-behaviors/process/config::advanced-installer-launchapp-toggle
  - id: micro-behaviors/process/argument/file::advanced-installer-app-file-exe
- id: advanced-installer-elevated-embedded-exe-launch
  desc: MSI elevates embedded EXE launch
  conf: 0.98
  all:
  - id: micro-behaviors/process/create/exec::advanced-installer-embedded-exe-launch
  - id: micro-behaviors/process/create/exec::advanced-installer-runasadmin-exe
- id: advanced-installer-luajit-launch
  desc: MSI launches embedded LuaJIT
  conf: 0.98
  all:
  - id: micro-behaviors/process/config::advanced-installer-launchapp-toggle
  - id: micro-behaviors/fs/path/application/interpreter::advanced-installer-luajit-app-file
  - id: micro-behaviors/process/argument/file::advanced-installer-luajit-script-args
