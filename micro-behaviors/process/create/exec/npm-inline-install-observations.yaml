defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85

traits:
- id: js-execsync-command
  desc: JavaScript executes system command
  crit: suspicious
  conf: 0.93
  attack: "T1059.007"
  if:
    type: value
    path: "scripts.preinstall"
    regex: "execSync\\s*\\([^)]{0,100}"
