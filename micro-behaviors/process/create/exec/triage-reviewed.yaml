traits:
- for:
  - html
  - scripts
  - documents
  id: wmi-hidden-startup-create-sequence
  desc: Hidden startup followed by process Create
  conf: 0.97
  if:
    type: text
    regex: (?is)SpawnInstance_\s*\(\s*\)[\s\S]{0,700}ShowWindow\s*=\s*0[\s\S]{0,700}\.Create\s*\(
- for:
  - javascript
  - vbs
  - html
  - text
  - data
  id: process-startup-create-variable
  desc: Startup instance beside process Create syntax
  conf: 0.9
  if:
    type: text
    regex: (?is)SpawnInstance_\s*(\(\s*\))?[\s\S]{0,700}\b[A-Za-z_$][A-Za-z0-9_$]{1,40}\.Create\s*\(
- for:
  - javascript
  - html
  id: js-hidden-window-process-create
  desc: Hidden window beside process Create syntax
  conf: 0.96
  if:
    type: text
    regex: (?is)\.\s*ShowWindow\s*=\s*0[\s\S]{0,700}\.\s*Create\s*\(
- crit: notable
  platforms:
  - unix
  - windows
  id: exec-family-call-target
  desc: JavaScript exec-family call target
  conf: 0.85
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \bchild_process\s*\.\s*exec(File|Sync)?\s*\(
composite_rules:
- for:
  - javascript
  - html
  - vbs
  - powershell
  id: hta-hidden-wmi-create
  desc: HTA markup beside hidden process Create sequence
  conf: 0.99
  attack: T1047,T1564.003
  all:
  - id: metadata/file/format/markup::hta-application-element
  - id: micro-behaviors/process/create/exec::wmi-hidden-startup-create-sequence
- for:
  - javascript
  - html
  id: js-hidden-process-create-sequence
  desc: Startup instance and hidden process Create syntax
  conf: 0.97
  all:
  - id: micro-behaviors/os/wmi/query::process-startup-spawninstance-text
  - id: micro-behaviors/process/create/exec::js-hidden-window-process-create
- for:
  - javascript
  - vbs
  - html
  id: wmi-hidden-variable-process-create
  desc: Startup instance, hidden flag and process Create syntax
  conf: 0.95
  all:
  - id: micro-behaviors/process/create/exec::process-startup-create-variable
  - id: micro-behaviors/process/create/flags::show-window-hidden-assignment
  any:
  - id: micro-behaviors/os/wmi/query::process-startup-spawninstance-symbol
  - id: micro-behaviors/os/wmi/query::process-startup-spawninstance-text
defaults:
  platforms:
  - windows
  crit: notable
