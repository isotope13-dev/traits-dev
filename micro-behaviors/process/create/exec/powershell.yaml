# Process Creation in PowerShell
defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.9
traits:
  - id: powershell-call-exe
    desc: PowerShell call operator launches an executable
    if:
      type: text
      regex: '(?i)&\s*["''][^"'']{1,120}\.exe\b'
  - id: powershell-call-script
    desc: PowerShell call operator launches a script
    attack: T1059.001
    if:
      type: text
      regex: '(?im)^\s*&\s+["''][^"''\r\n]{1,200}\.ps1["'']'
