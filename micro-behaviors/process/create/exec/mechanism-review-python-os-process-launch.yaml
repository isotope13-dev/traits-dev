defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.85
traits:
  - id: python-os-spawn-call
    desc: Python calls an os.spawn or posix_spawn API
    if:
      type: symbol
      kind: call
      regex: ^os\.spawn[lv](e|p|pe)?$|^os\.posix_spawnp?$|^distutils\.spawn\.spawn$
