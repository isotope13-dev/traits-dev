# JVM execution sink spelling recovered from a decoded string. This records
# representation as well as the API; encoding alone establishes neither
# runtime evaluation nor exploitation. Text matchers can also see these layers.
defaults:
  attack: T1059
  platforms: [unix, windows]
  for: [jsp, java, kotlin, groovy, html, javascript, python, vbs]
  crit: notable
  conf: 0.88
traits:
  - id: java-runtime-exec-encoded
    desc: JVM Runtime.exec() call in decoded strings
    if:
      type: encoded
      substr: Runtime.getRuntime().exec
