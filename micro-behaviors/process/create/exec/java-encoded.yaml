# JVM execution sinks that only appear inside decoded text. Concealed command
# shells build the `Runtime.exec` call at runtime from Base64/XOR/URL-encoded
# strings, so raw-source matchers never spell it; the decoded form still
# names the same sink.
defaults:
  attack: T1059
  mbc: E1203
  platforms: [unix, windows]
  for: [jsp, java, kotlin, groovy, html, javascript, python, vbs]
  crit: notable
  conf: 0.88
traits:
  - id: java-runtime-exec-encoded
    desc: JVM Runtime.exec() call in decoded strings
    if:
      type: encoded
      substr: Runtime.getRuntime().exec
