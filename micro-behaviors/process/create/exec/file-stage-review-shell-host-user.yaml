defaults:
  platforms: [unix, windows]
  for: [shell]
traits:
  - id: shell-quoted-host-user-executable
    desc: Executable has host/user CLI arguments
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '^"?(\$\{?\w+\}?/|\./|/)'
      args:
        - index: 0
          kind: identifier
          name: --host
        - index: 1
          regex: '^[0-9.]+:[0-9]+$'
        - index: 2
          kind: identifier
          name: --user
        - index: 3
          regex: '^\w{20,}$'
