  # Covers ROR13 and ROR7 shellcode droppers.
  - id: ole-hashed-write-close-launch-shellcode
    desc: OLE shellcode writes file then launches process
    crit: notable
    if:
      type: hex
      pattern: '(B8 00 E0 2B BD E8 ?? ?? ?? ?? FF D0 5B 5B 50 58 5F 57 50 [0-32] 53 57 50 B8 53 40 FF C8 E8 ?? ?? ?? ?? FF D0 B8 EC 7F D8 BF E8 ?? ?? ?? ?? FF D0 [0-64] 53 53 53 53 53 53 50 31 DB 53 B8 9F B5 90 F3 E8 ?? ?? ?? ?? FF D0|93 32 E4 94 C4 8D 1F 74 57 66 0D FF [0-24] 51 2F A2 01)'
