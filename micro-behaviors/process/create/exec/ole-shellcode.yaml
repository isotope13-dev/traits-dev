defaults:
  platforms: [windows]
  for: [oledoc]
  conf: 0.98
traits:
  # ADD/ROR13 hashes of CreateFileA, WriteFile, CloseHandle, CreateProcessA.
  # Preserve the handle from CreateFile, feed it and the payload pointer to
  # WriteFile, then close it. Six zero args plus application-name pointer,
  # null token and startup-info arguments identify CreateProcessA's handoff.
  # No dropped basename, payload length or XOR key gates this signature.
  - id: ole-hashed-write-close-launch-shellcode
    desc: OLE shellcode writes file then launches process
    crit: notable
    if:
      type: hex
      pattern: 'B8 00 E0 2B BD E8 ?? ?? ?? ?? FF D0 5B 5B 50 58 5F 57 50 [0-32] 53 57 50 B8 53 40 FF C8 E8 ?? ?? ?? ?? FF D0 B8 EC 7F D8 BF E8 ?? ?? ?? ?? FF D0 [0-64] 53 53 53 53 53 53 50 31 DB 53 B8 9F B5 90 F3 E8 ?? ?? ?? ?? FF D0'
