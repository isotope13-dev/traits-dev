defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: rundll32-powershell-call
    desc: PowerShell invokes the Windows rundll32 host
    crit: notable
    conf: 0.96
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: symbol
      kind: call
      regex: '(?i)^rundll32(\.exe)?$'
