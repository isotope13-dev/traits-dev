# Rust and other native compilers may materialize long command-line arguments
# as a series of x86-64 immediate stores. The bytes then occur in reverse
# eight-byte chunks, so ordinary extracted-string matching cannot recover the
# documented agent flags even though the executable constructs them verbatim.
defaults:
  for: [elf, macho]
  platforms: [linux, macos]
  arch: [x86-64]
  crit: notable
  conf: 0.98
  attack: T1059
  mbc: B0022

traits:
  - id: claude-permission-bypass-flag-x64-immediates
    desc: Constructs Claude permission bypass flag
    if:
      type: hex
      section: text
      pattern: >-
        73 73 69 6F 6E 73 [1-32]
        69 70 2D 70 65 72 6D 69 [1-32]
        6F 75 73 6C 79 2D 73 6B [1-32]
        2D 2D 64 61 6E 67 65 72

  - id: codex-sandbox-bypass-flag-x64-immediates
    desc: Constructs Codex sandbox bypass flag
    if:
      type: hex
      section: text
      pattern: >-
        6E 64 2D 73 61 6E 64 62 [1-32]
        72 6F 76 61 6C 73 2D 61 [1-32]
        70 61 73 73 2D 61 70 70 [1-32]
        6F 75 73 6C 79 2D [1-32]
        2D 2D 64 61 6E 67 65 72
