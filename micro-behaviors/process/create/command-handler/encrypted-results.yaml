defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: command-received-format
    desc: Logs receipt of an EXEC command
    crit: notable
    conf: 0.98
    if:
      type: hex
      pattern: "5B 45 58 45 43 5D 20 52 65 63 65 69 76 65 64 3A 20 25 73"
      section: rodata
  - id: encrypted-command-result-errors
    desc: Encrypted EXEC result transmission errors
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\[EXEC\] Failed to (seal|send) result: %v'
      section: rodata

