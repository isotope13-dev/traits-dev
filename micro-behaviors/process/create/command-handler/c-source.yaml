defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: component

traits:
  - id: cmd-get-identifier
    crit: notable
    desc: C cmd_get command-handler identifier
    conf: 0.9
    if:
      type: text
      word: cmd_get
  - id: cmd-recv-identifier
    crit: notable
    desc: C cmd_recv command-handler identifier
    conf: 0.9
    if:
      type: text
      word: cmd_recv
  - id: cmd-users-identifier
    crit: notable
    desc: C cmd_users command-handler identifier
    conf: 0.9
    if:
      type: text
      word: cmd_users
  - id: cmd-selfdestruct-identifier
    crit: notable
    desc: C cmd_selfdestruct command-handler identifier
    conf: 0.9
    if:
      type: text
      word: cmd_selfdestruct
