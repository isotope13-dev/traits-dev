# The command argument follows the HTTP response through JSON and Base64
# decoding. A separate, fixed subprocess invocation does not satisfy this.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: python-github-response-command
    desc: Executes decoded GitHub response as command
    if:
      type: symbol
      kind: call
      regex: '^(os\.system|subprocess\.(run|Popen|check_output))$'
      arg:
        index: 0
        from:
          call: '^requests\.get$'
          argument: 0
          literal: '^https://api\.github\.com/repos/[^/]+/[^/]+/contents/'
          through:
            - call: '\.json$'
              receiver: true
            - call: '^base64\.b64decode$'
              arguments: [0]
            - call: '\.decode$'
              receiver: true
