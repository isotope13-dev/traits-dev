defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, powershell, python, go, rust]
  crit: notable
  conf: 0.96
  attack: T1059.003

traits:
  - id: veeam-endpoint-management-service
    desc: Veeam endpoint-management API reference
    if:
      type: text
      word: IEndpointManagementService

  - id: veeam-dism-path-option
    desc: References the Veeam DISM executable-path option
    if:
      type: literal
      exact: DismPath

  - id: veeam-run-dism-command-call
    desc: Invokes the Veeam DISM command handler
    if:
      type: symbol
      kind: call
      regex: '(^|[.])RunDismCommand$'
