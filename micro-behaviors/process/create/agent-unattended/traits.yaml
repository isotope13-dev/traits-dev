# Non-interactive is common across ordinary CLIs, so it remains a component.
# Pairing it with an agent-specific permission bypass identifies an unattended
# agent session without assigning malicious intent by itself.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, shell, python]
  attack: T1059
  mbc: B0022

traits:
  - id: ai-agent-noninteractive-flag
    desc: Non-interactive execution flag
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(^|[[:space:]"''`])--no-interactive([[:space:]"''`]|$)'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures

composite_rules:
  - id: unrestricted-unattended-session
    desc: Unattended agent bypasses tool permissions
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/agent::ai-agent-dangerous-permission-flag
      - id: ai-agent-noninteractive-flag
    near_bytes: 192
