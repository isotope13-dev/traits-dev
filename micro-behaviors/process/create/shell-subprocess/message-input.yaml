# Bind the extracted message command to the shell f-string argument.
# Ordinary constant shell jobs and mentions in comments do not satisfy this.
defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: message-text-async-shell-handler
    desc: Message text passed to async shell
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((function_definition
          body: (block
            (expression_statement
              (assignment left: (identifier) @command right: (call) @input))
            (expression_statement
              (assignment right: (await
                (call
                  function: (attribute
                    object: (identifier) @asyncio
                    attribute: (identifier) @shell)
                  arguments: (argument_list
                    (string (interpolation (identifier) @argument))))))))) @handler
          (#match? @input "^[A-Za-z_]\\w*\\.text\\.removeprefix\\(")
          (#eq? @asyncio "asyncio")
          (#eq? @shell "create_subprocess_shell")
          (#eq? @command @argument))
