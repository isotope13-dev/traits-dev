defaults:
  crit: notable
  platforms: [android]
  for: [kotlin]

traits:
  - id: root-shell-job-call
    desc: Kotlin calls root shell job execution
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: newJob

  - id: shell-stdout-bridge
    desc: Kotlin bridges shell stdout to caller
    conf: 0.84
    if:
      type: literal
      exact: stdout
