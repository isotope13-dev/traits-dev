# Loading a Windows DLL through Python's ctypes bridge is a neutral capability.
defaults:
  platforms: [windows]
  for: [python]

traits:
  - id: python-exe-library-subprocess
    desc: Python subprocess invokes EXE with library
    crit: notable
    conf: 0.92
    platforms: [windows, unix]
    size_max: 20000
    if:
      type: tree-sitter
      kind: call
      regex: '(?s)subprocess\.(run|Popen|call)\(.{0,240}\.exe\b.{0,240}\.(dll|so)\b'
    unless:
      - id: metadata/package/testing/
      - type: text
        regex: '(?i)(readelf\.exe|--debug-dump=|/cygdrive/|debug-dump)'

  - id: python-exe-library-os-system
    desc: Python os.system invokes EXE with library
    crit: notable
    conf: 0.92
    platforms: [windows, unix]
    size_max: 20000
    if:
      type: tree-sitter
      kind: call
      regex: '(?s)os\.system\(.{0,240}\.exe\b.{0,240}\.(dll|so)\b'

  - id: python-ctypes-windll-load
    desc: Python loads Windows DLL with ctypes
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: ctypes.WinDLL
