# A require() path that descends through a chain of single-letter directories.
#
# No build tool emits `./public/a/b/c/d/e/.../z/a.js`. The depth is the point:
# it pushes the module past the ten-component limit archive analysis walks to,
# so the file is never read, while the entry point that loads it stays a
# two-line file that looks like nothing. The npm package `osinthell` hides 26
# modules this way, each one writing an HTA to temp and launching it.
#
# The require path survives even when the target does not get analyzed, which
# is what makes it worth matching: it is the one place the layout is admitted.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1027
  mbc: B0032

traits:
  - id: deep-single-letter-require-path
    desc: Requires a module under single-letter dirs
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'require\(\s*["''][^"'']{0,40}(/[a-z]){8,}'
