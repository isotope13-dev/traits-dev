defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
  attack: T1059.007

traits:
  - id: cjs-side-effect-local-require
    desc: CommonJS side-effect-only require
    unless:
      - id: "metadata/file/naming::test-directory-component"
    if:
      type: text
      regex: "(?m)^[ \\t]*require\\s*\\(\\s*['\"]\\.\\.?/[^'\"]{1,80}['\"]\\s*\\)\\s*;?[ \\t]*$"
  - id: cjs-side-effect-execution-subpath
    desc: CJS side-effect import of runner subpath
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: >-
        (?m)^[ \t]*require\s*\(\s*["'][^"']{1,60}/(cjs-)?runner[^"']{0,30}["']\s*\)\s*;?[ \t]*$
  - id: cjs-parser-subpath-require
    desc: CommonJS require of parser subpath
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "require\\s*\\(\\s*['\"][^'\"]{1,60}/selector-parser['\"]\\s*\\)"

  - id: cjs-native-node-module-require
    desc: CommonJS loads a native .node module
    crit: notable
    conf: 0.92
    attack: T1129
    if:
      type: text
      # Anchor `require` to a non-identifier boundary: Closure Library calls
      # `goog.require('goog.editor.node')`, a namespace declaration that loads
      # nothing native, and the dotted-namespace convention makes trailing
      # `.node` segments common. A CommonJS require is never a member call.
      regex: '(^|[^\w.])require\s*\([^;\n]{0,120}\.node(["'']|\s*\))'
    unless:
      # Source-map JSON embeds source text in one long line.  A normal
      # require(...) in that data can be followed by process.versions.node
      # and must not be interpreted as a native-module load.
      - id: metadata/file/format/source-map::sourcemap
      - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: top-level-require-method-call
    desc: Top-level method call on require result
    crit: notable
    if:
      # The receiver must be the variable the require was assigned to: a
      # bare `word.word(` on the next line also matches unrelated calls
      # such as `console.warn(`. Text regexes cannot bind the two
      # identifiers (no backreferences), so this uses a tree-sitter query
      # with (#eq?) instead.
      type: tree-sitter
      query: |
        (program
          [(lexical_declaration
             (variable_declarator
               name: (identifier) @recv
               value: (call_expression
                 function: (identifier) @req_function)))
           (variable_declaration
             (variable_declarator
               name: (identifier) @recv
               value: (call_expression
                 function: (identifier) @req_function)))]
          (expression_statement
            (call_expression
              function: (member_expression
                object: (identifier) @recv_obj)) @method_call)
          (#eq? @req_function "require")
          (#eq? @recv @recv_obj))
  - id: top-level-require-immediate-call
    desc: Immediate method call on require result
    crit: notable
    if:
      type: text
      regex: '(?m)^\s*require\s*\(.{1,80}\)\s*\.\s*\w+\s*\(\s*\)'
  - id: top-level-require-iife
    desc: Invokes parenthesized require result
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?m)^\s*\(\s*require\s*\(.{1,80}\)\s*\)\s*\('
  # `load("name", JSON.stringify(x))?.name(...)`: a helper fetches a named
  # module using serialized caller data as its second argument, then calls a
  # method on whatever came back. matrix-ops-core passes the matrix a caller
  # hands to solve() as the password of an encrypted module, so the payload
  # only exists for the one input its author chose.
  - id: json-keyed-named-lookup-call
    desc: Invokes named-lookup result keyed by JSON input
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\w\(\s*["''][\w-]{2,40}["'']\s*,\s*JSON\.stringify\([\s\S]{0,120}?\)\s*\)\s*\?\.\s*\w+\('

composite_rules:
  - id: dom-inline-script-text-execution
    desc: Executes inline script through DOM insertion
    crit: notable
    conf: 0.96
    near_bytes: 1024
    all:
      - id: micro-behaviors/ui/window/insert-html::browser-create-script-element
      - id: micro-behaviors/data/collection/dom::dom-template-text-assignment
      - id: micro-behaviors/data/collection/dom::append-child-reference
