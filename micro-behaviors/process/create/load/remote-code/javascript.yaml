defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1105
traits:
- id: js-dom-createelement-literal
  desc: Creates a script element with createElement
  # Must create a *script* element. Bare createElement matches benign UI builders
  # (createElement('div'/'button'/'textarea')); the all-substrings composite then
  # false-fires on any DOM-building code that also mentions "script"/"src".
  crit: component
  conf: 0.8
  if:
    type: text
    regex: createElement\s*\(\s*['"`]script['"`]
- id: js-dom-script-literal
  desc: Script string literal
  crit: component
  conf: 0.8
  if:
    type: literal
    substr: script
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: js-dom-appendchild-literal
  desc: DOM appendChild string literal
  crit: component
  conf: 0.8
  if:
    type: literal
    substr: appendChild
- id: js-dom-script-src-literal
  desc: Script source attribute literal
  crit: component
  conf: 0.75
  if:
    type: literal
    exact: src
- id: js-computed-document-member-call
  desc: Computed document member call
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'document\s*\[[^\]]{1,80}\]\s*\[[^\]]{1,80}\]\s*\('
- id: js-computed-document-call
  desc: Calls a document method through computed syntax
  crit: notable
  conf: 0.86
  if:
    type: text
    # The subscript must be a quoted key or a bare identifier. A free-form
    # `[...]` run also matched Markdown links in doc comments — JSDoc prose such
    # as "a text document [has been changed](#languages...)" reads as a computed
    # document call, which flagged VS Code's own vscode.d.ts.
    regex: 'document\[\s*(["''][^"''\n]{1,64}["'']|[A-Za-z_$][\w$]{0,64})\s*\]\s*\('
- id: js-computed-script-element
  desc: Creates script via computed DOM method
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'document\s*\[[^\]\n]{1,160}\]\s*\(\s*["'']script["'']\s*\)'
- id: js-script-computed-source-assignment
  desc: Assigns computed source to script element
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'script[^\n]{0,600}\]\s*=\s*_0x[A-Za-z0-9_$]+'
composite_rules:
- id: js-dynamic-script-loader
  desc: Browser dynamically loads script element
  crit: notable
  conf: 0.86
  all:
  - id: js-dom-createelement-literal
  - id: js-dom-script-literal
  - id: js-dom-appendchild-literal
  - id: js-dom-script-src-literal
