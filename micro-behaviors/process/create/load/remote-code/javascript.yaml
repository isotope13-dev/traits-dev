defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1105
traits:
- id: js-dom-createelement-literal
  desc: Creates a script element with createElement
  # Must create a *script* element. Bare createElement matches benign UI builders
  # (createElement('div'/'button'/'textarea')); the all-substrings composite then
  # false-fires on any DOM-building code that also mentions "script"/"src".
  crit: component
  conf: 0.8
  if:
    type: text
    regex: createElement\s*\(\s*['"`]script['"`]
- id: js-dom-script-literal
  desc: Script string literal
  crit: component
  conf: 0.8
  if:
    type: literal
    exact: script
  unless:
  - id: well-known/app/
  - id: well-known/lib/
  - id: well-known/tool/
- id: js-dom-appendchild-literal
  desc: DOM appendChild string literal
  crit: component
  conf: 0.8
  if:
    type: literal
    exact: appendChild
- id: js-dom-script-src-literal
  desc: Script source attribute literal
  crit: component
  conf: 0.75
  if:
    type: literal
    exact: src
- id: js-remote-src-assignment
  desc: Assigns remote URL to element src
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\b[A-Za-z_$][\w$]*\s*\.\s*src\s*=\s*["'']https?://[^"''\s]{1,512}'
- id: js-computed-remote-src-assignment
  desc: Assigns external URL to computed src
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\[\s*["'']src["'']\s*\]\s*=\s*["'']https?://[^"''\s]{1,512}'
- id: js-computed-document-member-call
  desc: Computed document member call
  crit: component
  conf: 0.9
  if:
    type: text
    regex: 'document\s*\[[^\]]{1,80}\]\s*\[[^\]]{1,80}\]\s*\('
- id: js-computed-document-member-argument
  desc: Document method gets computed member
  crit: notable
  conf: 0.94
  for: [javascript]
  if:
    type: text
    regex: 'document\s*\[\s*\w+\s*\]\s*\(\s*\w+\s*\[\s*\w+\s*\]\s*\)'
- id: js-computed-script-element
  desc: Creates script via computed DOM method
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'document\s*\[[^\]\n]{1,160}\]\s*\(\s*["'']script["'']\s*\)'
composite_rules:
- id: remote-html-script-rehydration
  desc: Executes script elements reconstructed from fetched HTML
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/client/response-body::await-response-text-value
  - id: micro-behaviors/ui/window/dom-access::domparser-parse-html
  - id: micro-behaviors/ui/window/manage/enumerate::page-script-element-enumeration
  - id: micro-behaviors/communications/http/client/resource::dynamic-script-element-load
  near_bytes: 4096

- id: js-computed-script-assignment
  desc: Creates script and assigns computed member
  crit: notable
  conf: 0.9
  all:
  - id: js-computed-script-element
  - id: micro-behaviors/data/source/property/computed::js-computed-member-variable-assignment

- id: js-computed-external-script-loader
  desc: Creates a script and assigns it an external URL through computed syntax
  crit: notable
  conf: 0.94
  all:
  - id: js-computed-script-assignment
  - id: js-computed-remote-src-assignment

- id: js-external-script-loader
  desc: Creates a script element and gives it an external URL
  crit: notable
  conf: 0.94
  any:
  - id: js-computed-external-script-loader
  - id: js-remote-script-element

- id: js-dynamic-script-loader
  desc: Creates and appends a browser script element
  crit: notable
  conf: 0.86
  all:
  - id: js-dom-createelement-literal
  - id: js-dom-script-literal
  - id: js-dom-appendchild-literal
  - id: js-dom-script-src-literal

- id: js-remote-script-element
  desc: Creates script element with remote src
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/ui/window/manage/dom::browser-create-script-element
  - id: js-remote-src-assignment
  near_bytes: 4096
