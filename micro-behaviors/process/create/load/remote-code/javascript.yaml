defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  attack: T1105
traits:
- id: js-javascript-blob
  desc: Creates a JavaScript MIME Blob
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: new\s+Blob\s*\(\s*\[[\w$]+\]\s*,\s*\{\s*type\s*:\s*["']application/javascript["']
- id: js-dom-script-literal
  desc: Script string literal
  crit: component
  conf: 0.8
  if:
    type: literal
    exact: script
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: js-computed-remote-src-assignment
  desc: Assigns external URL to computed src
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \[\s*["']src["']\s*\]\s*=\s*["']https?://[^"'\s]{1,512}
- id: js-computed-document-member-argument
  desc: Document method gets computed member
  crit: notable
  conf: 0.94
  for:
  - javascript
  if:
    type: text
    regex: document\s*\[\s*\w+\s*\]\s*\(\s*\w+\s*\[\s*\w+\s*\]\s*\)
- id: js-computed-script-element
  desc: Creates script via computed DOM method
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: document\s*\[[^\]\n]{1,160}\]\s*\(\s*["']script["']\s*\)
- id: js-contextual-script-markup-injection
  desc: Builds script markup for DOM insertion
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?is)(<\s*script|<sc\s*["']\s*\+)[\s\S]{0,700}createContextualFragment\s*\(
composite_rules:
- id: remote-html-script-rehydration
  desc: Executes script elements reconstructed from fetched HTML
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
  - id: micro-behaviors/ui/window/dom-access::domparser-parse-html
  - id: micro-behaviors/ui/window/enumerate::page-script-element-enumeration
  - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
  near_bytes: 4096
- id: js-computed-script-assignment
  desc: Creates script and assigns computed member
  crit: notable
  conf: 0.9
  all:
  - id: js-computed-script-element
  - id: micro-behaviors/data/property/assign::js-computed-member-variable-assignment
- id: js-computed-external-script-loader
  desc: Creates a script and assigns it an external URL through computed syntax
  crit: notable
  conf: 0.94
  all:
  - id: js-computed-script-assignment
  - id: js-computed-remote-src-assignment
- id: js-external-script-loader
  desc: Creates a script element and gives it an external URL
  crit: notable
  conf: 0.94
  any:
  - id: js-computed-external-script-loader
  - id: js-remote-script-element
- id: js-dynamic-script-loader
  desc: Creates and appends a browser script element
  crit: notable
  conf: 0.86
  all:
  - id: micro-behaviors/data/collection/dom::script-element-create
  - id: js-dom-script-literal
  - id: metadata/lang/source/literal::append-child-literal
  - id: metadata/lang/source/literal::src-string-literal
- id: js-remote-script-element
  desc: Creates script element with remote src
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/ui/window/insert-html::browser-create-script-element
  - id: micro-behaviors/communications/http/client/resource::js-remote-src-assignment
  near_bytes: 4096
