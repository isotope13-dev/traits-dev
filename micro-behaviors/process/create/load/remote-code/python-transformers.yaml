defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  # A custom pipeline selects repository-supplied pipeline code. This is a
  # meaningful loading capability even when the caller explicitly opts in.
  - id: custom-pipeline-argument
    desc: Pretrained loader selects custom pipeline code
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\.from_pretrained\s*\([\s\S]{0,600}\bcustom_pipeline\s*='

  - id: remote-custom-pipeline-argument
    desc: Loader specifies remote custom pipeline
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bcustom_pipeline\s*=\s*["''](https?://|[a-zA-Z0-9][\w.-]*/[\w.-]+)'

  # The article's bypasses all rely on a loader call that appears to disable
  # remote code while a downstream path still resolves repository code.
  - id: trust-remote-code-disabled
    desc: Pretrained loader disables remote code
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\.from_pretrained\s*\([\s\S]{0,700}\btrust_remote_code\s*=\s*False\b'

  # `trust_remote_code=True` (or a constant carrying that value) is a generic
  # Python loader opt-in; the loader composites below provide specific context.
  - id: trust-remote-code-enabled
    desc: Enables a Python remote-code loading option
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'trust_remote_code\s*=\s*(True|TRUST_REMOTE_CODE_VALUE)\b'

  # Keep the import and call as separate atoms: a generic application
  # function named `pipeline` is not enough to identify Transformers.
  - id: transformers-pipeline-import
    desc: Imports the Transformers pipeline API
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: 'from transformers import pipeline'

  - id: transformers-pipeline-call
    desc: Calls a Python pipeline factory
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: pipeline

composite_rules:
  - id: transformers-pipeline-model-load
    desc: Loads a model through Transformers pipeline
    crit: notable
    conf: 0.92
    all:
      - id: transformers-pipeline-import
      - id: transformers-pipeline-call

  # A from_pretrained load that opts into remote code.
  - id: transformers-trust-remote-code
    desc: Transformers model loader enables remote code
    crit: notable
    conf: 0.9
    all:
      - id: trust-remote-code-enabled
      - id: micro-behaviors/data/parse/model::from-pretrained-call

  - id: pretrained-loader-remote-custom-pipeline
    desc: Pretrained loader selects a remote custom pipeline
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/data/parse/model::from-pretrained-call
      - id: remote-custom-pipeline-argument
    near_lines: 80

  - id: pretrained-loader-custom-pipeline-with-disabled-trust
    desc: Pretrained loader disables trust for custom pipeline code
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/data/parse/model::from-pretrained-call
      - id: custom-pipeline-argument
      - id: trust-remote-code-disabled
    near_lines: 80
  # `transformers.pipeline(...)` is an alternate model loader to
  # `.from_pretrained(...)` and can also execute model-supplied code when the
  # opt-in is enabled.
  - id: transformers-pipeline-trust-remote-code
    desc: Transformers pipeline executes model-supplied remote code
    crit: notable
    conf: 0.92
    all:
      - id: transformers-pipeline-import
      - id: transformers-pipeline-call
      - id: trust-remote-code-enabled

  - id: datasets-trust-remote-code
    desc: Hugging Face datasets loader enables remote code
    crit: notable
    conf: 0.94
    all:
      - id: metadata/import/python/datasets/load_dataset
      - id: micro-behaviors/data/parse/dataset::datasets-load-dataset-call
      - id: trust-remote-code-enabled
