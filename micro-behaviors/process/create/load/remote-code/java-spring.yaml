defaults:
  platforms: [unix, windows]
  for: [java, class, groovy, kotlin, scala]

traits:
  - id: spring-classpath-xml-context-loader
    desc: Spring classpath XML context loader
    crit: notable
    conf: 0.96
    if:
      type: text
      word: ClassPathXmlApplicationContext

  - id: spring-filesystem-xml-context-loader
    desc: Spring filesystem XML context loader
    crit: notable
    conf: 0.97
    if:
      type: text
      word: FileSystemXmlApplicationContext

  - id: spring-classpath-remote-xml-url
    desc: Classpath XML context receives HTTP URL
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '\bClassPathXmlApplicationContext\s*\(\s*["'']https?://'

  - id: spring-filesystem-remote-xml-url
    desc: Filesystem XML context receives HTTP URL
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\bFileSystemXmlApplicationContext\s*\(\s*["'']https?://'

composite_rules:
  - id: spring-xml-context-loader
    desc: Spring XML application context loader
    crit: notable
    conf: 0.98
    any:
      - id: spring-classpath-xml-context-loader
      - id: spring-filesystem-xml-context-loader

  - id: spring-classpath-remote-xml-loader
    desc: Spring classpath context loads an HTTP URL
    crit: suspicious
    conf: 0.99
    all:
      - id: spring-classpath-xml-context-loader
      - id: spring-classpath-remote-xml-url
    near_bytes: 256

  - id: spring-filesystem-remote-xml-loader
    desc: Spring filesystem context loads an HTTP URL
    crit: suspicious
    conf: 0.99
    all:
      - id: spring-filesystem-xml-context-loader
      - id: spring-filesystem-remote-xml-url
    near_bytes: 256
