defaults:
  for: [xml, python, javascript, java, go, rust, ruby, csharp]
  platforms: [windows, linux, macos]
traits:
  - id: remote-driver-classpath
    desc: ODF JDBC settings name a remote classpath
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'db:java-classpath=["\x27](jar:)?https?://'
  - id: driver-class
    desc: ODF settings name a Java JDBC driver
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'db:java-driver-class=["\x27][A-Za-z_$]'
