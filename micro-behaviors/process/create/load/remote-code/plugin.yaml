defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, python, powershell, csharp, javascript, go, rust]

traits:
  # `loadPlugin` on its own says nothing about *remote* code: it is the ordinary
  # name for a local plugin loader (LESS, ESLint, webpack all define one).  It
  # now lives in ../plugin/ as a neutral loading capability; only the remote and
  # staged spellings stay here, where the directory claims remote-code loading.
  - id: remote-plugin-stage-identifier
    desc: Remote or staged plugin identifier
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b(remote[_-]?plugin|plugin[_-]?stage)\b'
  - id: plugin-entrypoint-name
    desc: Plugin entrypoint identifier
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\bplugin[_-]?entry(point)?\b'
  - id: powershell-plugin-entrypoint
    desc: PowerShell plugin entrypoint access
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      substr: plugin.EntryPoint
  - id: native-plugin-library-load
    desc: Native plugin library load
    crit: notable
    conf: 0.9
    for: [c, cpp, pe, dll, elf, macho]
    if:
      type: text
      regex: '(?i)LoadLibrary[AW]?\s*\([^)]{0,48}\bplugin'

composite_rules:
  - id: dynamic-plugin-dispatch
    desc: Dynamic plugin dispatch
    crit: notable
    conf: 0.9
    # Ace language modes use loadPlugin for local editor extensions; that is
    # neither remote staging nor application plugin dispatch.
    unless:
      - id: well-known/lib/ui/ace-editor::ace-mode-module
    any:
      - id: remote-plugin-stage-identifier
      - id: micro-behaviors/process/create/load/plugin::plugin-loader-function-name
      - id: plugin-entrypoint-name
      - id: powershell-plugin-entrypoint
      - id: native-plugin-library-load
