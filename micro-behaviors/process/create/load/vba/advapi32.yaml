defaults:
  platforms: [windows]
  for: [oledoc, ooxml, vbs]
  crit: notable
  conf: 0.92

traits:
  - id: vba-declare-regcreatekeyex
    desc: VBA Declare imports RegCreateKeyEx
    crit: suspicious
    conf: 0.94
    if:
      type: import
      regex: '^RegCreateKeyEx[AW]?$'
  - id: vba-declare-regsetvalueex
    desc: VBA Declare imports RegSetValueEx
    crit: suspicious
    conf: 0.94
    if:
      type: import
      regex: '^RegSetValueEx[AW]?$'
