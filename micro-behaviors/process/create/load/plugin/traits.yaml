# Plugin-loading identifiers.  These name the generic capability "this code
# loads plugin modules"; they say nothing about where the plugin comes from.
# Staged/remote plugin retrieval lives in ../remote-code/, which composites
# reference alongside these atoms.
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, python, powershell, csharp, javascript, go, rust]

traits:
  - id: plugin-loader-function-name
    desc: Plugin loader function identifier
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bload[_-]?plugin\b'
    unless:
      - id: well-known/lib/ui/highlight-js::bundled-library
