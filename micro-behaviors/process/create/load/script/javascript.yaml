# Existing observations, grouped by the behavior they establish.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  - php
  - binaries
  crit: notable
  conf: 0.88

traits:
  - id: async-external-script-element
    desc: Loads asynchronous external script
    conf: 0.92
    for: [html, php]
    if:
      type: text
      regex: '<script[^>]{0,160}\basync\b[^>]{0,160}\bsrc\s*=\s*["'']https?://'
  - id: external-script-element-load
    desc: Loads external script element
    conf: 0.92
    for: [html, php]
    if:
      type: text
      regex: '<script[^>]{0,160}\bsrc\s*=\s*["'']https?://'
  - id: jquery-getscript-load
    desc: Loads script through jQuery getScript
    crit: notable
    conf: 0.9
    for: [javascript, html]
    if:
      type: text
      regex: '\$\s*\.\s*getScript\s*\('
  - id: local-script-element-load
    desc: Loads local script element
    conf: 0.92
    for: [html]
    if:
      type: text
      regex: '<script[^>]{0,160}\bsrc\s*=\s*["''](\.{1,2}/|/[^/])[./A-Za-z0-9_-]{0,158}["'']'
  - id: dynamic-script-element-load
    desc: Dynamically loads script element
    conf: 0.9
    # svg: an SVG document's inline script can inject a <script> element at
    # runtime to pull the real payload from a remote endpoint — the loader
    # shape used by SVG-attachment phishing campaigns.
    for: [javascript, typescript, html, php, svg, binaries]
    unless:
      - id: well-known/lib/development/next-swc::next-swc-native-compiler-pdb
    if:
      type: text
      regex: 'createElement\(\s*[''"]script[''"]\s*\)[\s\S]{0,260}[A-Za-z_$][A-Za-z0-9_$]*\.src\s*='
  - id: dynamic-script-src-decode-assign
    desc: Script element src assigned decoded value
    conf: 0.9
    # Tightens dynamic-script-element-load for injected tails: stock bundler
    # runtimes (webpack JSONP) assign a variable chunk path (`o.src=t`),
    # while an injected tail assigns the decoded URL inline. One match binds
    # loader and decoder, so archive roll-up cannot pool them from unrelated
    # bundle regions. An optional receiver (`window.atob`) still counts.
    for: [javascript, typescript, html, php, svg, binaries]
    if:
      type: text
      regex: 'createElement\(\s*[''"]script[''"]\s*\)[\s\S]{0,100}\.src\s*=\s*([\w$]+\.){0,4}atob\s*\('
  # Matches a `.src =` assignment on ANY element (script, iframe, img, video,
  # audio); the script context comes from the composite's other leg, not here.
  # The query separator must be followed by a parameter name or a template
  # placeholder: a bare `?`/`&` also matches the ternary and logical-and
  # operators, which made `el.src = cond ? a : b` read as a parameterized URL.
  - id: inline-base64-script-resource
    desc: Loads JavaScript from a Base64 data URL
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'data:text/javascript;base64,[A-Za-z0-9+/]{32,}={0,2}'
  - id: inline-percent-encoded-script-resource
    desc: Loads JavaScript from a percent-encoded data URL
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'data:(text|application)/javascript,[^"`'']{16,}'

composite_rules:
  - id: dynamic-svg-script-element-load
    desc: Dynamically loads an SVG script by variable URL
    conf: 0.92
    for: [javascript, typescript, svg, html]
    all:
      - id: micro-behaviors/communications/http/client/resource::svg-script-namespace-element
      - id: micro-behaviors/communications/http/client/resource::href-attribute-variable-assignment
    near_bytes: 260
  - id: vscode-webview-remote-script-load
    desc: VS Code webview loads a remote script resource
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/client/resource::vscode-webview-api-bridge
      - id: micro-behaviors/communications/http/client/resource::remote-script-element-source
    # Webview templates commonly place imports in <head> and acquire the API
    # after a sizeable CSS block. Keep both facts in the same source literal.
    near_bytes: 32768
