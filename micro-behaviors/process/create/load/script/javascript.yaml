# Existing observations, grouped by the behavior they establish.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  - php
  - binaries
  crit: notable
  conf: 0.88

traits:
  - id: jquery-getscript-load
    desc: Loads script through jQuery getScript
    crit: notable
    conf: 0.9
    for: [javascript, html]
    if:
      type: text
      regex: '\$\s*\.\s*getScript\s*\('
  - id: dynamic-script-src-decode-assign
    desc: Script element src assigned decoded value
    conf: 0.9
    # Tightens dynamic-script-element-load for injected tails: stock bundler
    # runtimes (webpack JSONP) assign a variable chunk path (`o.src=t`),
    # while an injected tail assigns the decoded URL inline. One match binds
    # loader and decoder, so archive roll-up cannot pool them from unrelated
    # bundle regions. An optional receiver (`window.atob`) still counts.
    for: [javascript, typescript, html, php, svg, binaries]
    if:
      type: text
      regex: 'createElement\(\s*[''"]script[''"]\s*\)[\s\S]{0,100}\.src\s*=\s*([\w$]+\.){0,4}atob\s*\('
composite_rules:
  - id: dynamic-svg-script-element-load
    desc: Dynamically loads an SVG script by variable URL
    conf: 0.92
    for: [javascript, typescript, svg, html]
    all:
      - id: micro-behaviors/communications/http/client/resource::svg-script-namespace-element
      - id: micro-behaviors/data/collection/dom::href-attribute-variable-assignment
    near_bytes: 260
  - id: vscode-webview-remote-script-load
    desc: VS Code webview loads a remote script resource
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/ipc/message::vscode-webview-host-api
      - id: micro-behaviors/communications/http/client/resource::remote-script-element-source
    # Webview templates commonly place imports in <head> and acquire the API
    # after a sizeable CSS block. Keep both facts in the same source literal.
    near_bytes: 32768
