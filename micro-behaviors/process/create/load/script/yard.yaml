# YARD, Ruby's documentation generator, applies every line of a package's
# `.yardopts` file as though it had been typed on the command line, and
# `--load` (short form `-e`) names a Ruby file that YARD runs before the
# documentation command starts. Whoever publishes the package writes that
# file, so a documentation service that builds docs for arbitrary packages
# executes publisher-chosen code on its own infrastructure.
#
# cleave does not recognise a bare `.yardopts` as a file type, so it is never
# walked on its own. The directive is reachable in the two places a generator
# that mass-produces packages actually emits it: a command line that invokes
# yard/yardoc, and the code that writes the options file into the package.
# Both are neutral mechanics -- ordinary gems ship a `.yardopts`, and release
# tooling runs `yardoc` -- so intent is left to the composites that reference
# these atoms.
defaults:
  platforms: [unix, windows]
  for: [scripts, dockerfile, github-actions]
  crit: notable
  conf: 0.9
  attack: T1059

traits:
  # Anchored at a command boundary so the English word "yard" in prose or a
  # path segment cannot start a match; the loading flag must follow on the
  # same command.
  - id: yard-command-preload-script
    desc: YARD command line preloads a Ruby script
    conf: 0.94
    if:
      type: text
      regex: '(?m)(^|[;&|]\s*)yard(oc)?\b[^\r\n;&|]{0,120}\s(--load|-e)[ \t=]+\S'

  - id: yard-options-file-path
    desc: YARD options file path reference
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(^|[^\w.])\.yardopts\b'

  # The directive as it appears when a program writes the options file: at the
  # start of a line, or at the start of a string literal holding that line.
  # The loaded path is left unconstrained because a generator interpolates the
  # filename it just wrote; `.yardopts` proximity is what makes this precise.
  - id: yard-preload-directive
    desc: YARD preload directive loads a file
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(^|["''\n])\s*--load[ \t]+\S'

composite_rules:
  - id: yard-options-preload-write
    desc: Code writes a YARD options file that preloads Ruby
    crit: notable
    conf: 0.95
    near_bytes: 400
    all:
      - id: yard-options-file-path
      - id: yard-preload-directive
