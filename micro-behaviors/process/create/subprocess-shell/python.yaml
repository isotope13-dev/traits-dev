# Python subprocess.check_output(..., shell=True) — technique leaf sibling of
# process/create/subprocess (parent dir is at the size/leaf-yaml caps).
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: "T1059.006"
traits:
  # Text fallback when tree-sitter call span misses multiline
  # check_output(..., shell=True) across newlines/long argv.
  - id: check-output-shell-true
    desc: check_output invoked with shell=True
    crit: notable
    conf: 0.95
    mbc: "E1059.006"
    if:
      type: text
      regex: '(?s)subprocess\.check_output\s*\([^)]{0,400}\bshell\s*=\s*True'
