# Python subprocess.check_output(..., shell=True) — technique leaf sibling of
# process/create/subprocess (parent dir is at the size/leaf-yaml caps).
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.006
traits:
  # Text fallback when tree-sitter call span misses multiline
  # check_output(..., shell=True) across newlines/long argv.
  - id: check-output-shell-true
    desc: check_output invoked with shell=True
    crit: notable
    conf: 0.95
    mbc: "E1059.006"
    if:
      type: text
      regex: '(?s)subprocess\.check_output\s*\([^)]{0,400}\bshell\s*=\s*True'
  - id: popen-shell-true
    desc: Python Popen launches through a shell
    crit: notable
    conf: 0.94
    mbc: "C0017"
    if:
      type: tree-sitter
      kind: call
      regex: '(?s)\b(subprocess\.)?Popen\s*\([^)]{0,700}\bshell\s*=\s*True'
    # Raw byte scan rather than a call match: the same name sequence
    # (Popen -> PIPE -> communicate) survives compilation into a .pyc, where
    # marshal packs one code object's co_names contiguously.
  - id: shell-true
    desc: Subprocess call enables shell parsing
    crit: notable
    conf: 0.7
    mbc: "E1059.006"
    unless:
    - id: well-known/tool/detection/pattern-catalog::python-vulnerability-pattern-catalog
    - id: well-known/tool/detection/llm-scanner::skill-vetting-pattern-scanner
    # An injection detector quotes "shell=True" in the diagnostic it prints about
    # other people's code; it is a message string, not a call it makes.
    - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
    - id: metadata/file/catalog/threat-pattern::severity-graded-pattern-catalog
    - id: metadata/file/catalog/threat-pattern::dangerous-pattern-replacement-text
    - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
    - id: well-known/tool/offensive/ctf-skills::source-context
    if:
      type: tree-sitter
      kind: call
      # Include check_output: Telegram/RAT shells commonly use it with shell=True.
      regex: '(?s)\bsubprocess\.(run|Popen|call|check_output)\s*\([^)]{0,200}\bshell\s*=\s*True'
    not:
    - substr: never ``shell=True``
  # check-output-shell-true lives under subprocess/shell/ (directory size cap).
  - id: variable-command-shell-true
    desc: Variable command passed to shell
    crit: notable
    conf: 0.95
    mbc: "E1059.006"
    if:
      type: tree-sitter
      kind: call
      regex: '(?s)\bsubprocess\.run\(\s*command\s*,[^)]{0,300}\bshell\s*=\s*True'
  - id: asyncio-create-subprocess-shell
    desc: asyncio shell subprocess call
    crit: notable
    conf: 0.85
    mbc: "E1059.006"
    if:
      type: symbol
      kind: call
      exact: "asyncio.create_subprocess_shell"
  - id: subprocess-shell-keyword-pyc
    desc: shell keyword in Python bytecode
    crit: component
    conf: 0.7
    for: [pyc]
    if:
      type: text
      substr: shell
composite_rules:
- id: subprocess-shell-pyc
  desc: Nearby subprocess and shell keyword in Python bytecode
  crit: notable
  conf: 0.72
  for: [pyc]
  near_bytes: 2048
  all:
  - id: micro-behaviors/process/create/subprocess::subprocess-module-pyc
  - id: subprocess-shell-keyword-pyc
