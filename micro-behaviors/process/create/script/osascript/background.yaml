defaults:
  platforms: [macos]
  for: [macho, objc, swift, shell, applescript]

traits:
  - id: background-shell-launch
    desc: Background shell script launch
    crit: suspicious
    conf: 0.82
    if:
      type: text
      regex: do shell script.{0,220}> /dev/null 2>&1 &
    unless:
      - id: micro-behaviors/os/package-manager/management::macos-installed-helper-background-launch
      - id: well-known/tool/development/toolchain/processing::processing-bundle-identifier
      - id: well-known/tool/development/toolchain/processing::processing-package-context
