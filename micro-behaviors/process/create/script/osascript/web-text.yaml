# AppleScript `do shell script` quoted in web content. ClickFix lures paste it
# to the clipboard, but syntax highlighters (highlight.js's AppleScript
# grammar) and documentation carry the same phrase; the ClickFix objective
# requires a clipboard write on the same line.
defaults:
  platforms: [macos]
  for: [javascript, html]
  attack: T1059.002

traits:
  # Relocated from objectives/command-and-control/dropper/delivery/html,
  # where it was `clickfix-do-shell-script` ("ClickFix AppleScript shell
  # execution").
  - id: do-shell-script-web-text
    desc: AppleScript do shell script in web text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bdo\s+shell\s+script\b'
