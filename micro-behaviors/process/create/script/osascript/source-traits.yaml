defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, c, cpp]
  mbc: B0015
  attack: T1056.001
  crit: suspicious

traits:
- id: osascript-title
  desc: Osascript command (title case)
  crit: notable
  conf: 0.6
  for: [elf, macho, pe, c, cpp, javascript, shell, applescript]
  if:
    type: text
    word: Osascript
- id: osascript-upper
  desc: OSASCRIPT command (uppercase)
  crit: notable
  conf: 0.6
  for: [elf, macho, pe, c, cpp, javascript, shell, applescript]
  if:
    type: text
    word: OSASCRIPT
composite_rules:
- id: osascript-keyword
  desc: osascript keyword (case variants)
  crit: notable
  # A bare `osascript` token is equally at home in a shell/AppleScript/JXA
  # script and in a compiled binary that spawns it, so this spans both the
  # file's binary default and the script types applescript-keystroke needs.
  for: [elf, macho, pe, c, cpp, javascript, shell, applescript]
  any:
  - id: micro-behaviors/process/create/script/osascript::osascript-dup
  - id: micro-behaviors/process/create/script/osascript::osascript-title
  - id: micro-behaviors/process/create/script/osascript::osascript-upper
- id: osascript-exec-via-execsync
  desc: osascript execution via exec
  for: [javascript]
  all:
  - id: micro-behaviors/process/create/script/osascript::osascript-keyword
  - id: micro-behaviors/process/create/shell/bridge::execSync-call
- id: node-applescript
  desc: Node.js AppleScript execution
  # A library reference alone is not keylogging; the keystroke hook remains
  # independently suspicious and the higher composites require it.
  crit: notable
  conf: 0.85
  attack: T1059.002
  platforms: [macos]
  for: [javascript]
  any:
  - id: micro-behaviors/process/create/script/osascript::node-applescript-library-reference
  - id: micro-behaviors/process/create/script/osascript::osascript-exec-via-execsync
# Split by evidence regime. In a COMPILED PE the hook type is an integer
# argument, so the constant is unavailable and a bare SetWindowsHookEx plus the
# capture-API cluster is the best available evidence -- unchanged below. In
# SOURCE the hook type is right there in the text, and treating any
# SetWindowsHookEx as keyboard interception convicted every GUI toolkit:
# WH_CALLWNDPROC / WH_GETMESSAGE / WH_CBT / WH_MOUSE_LL are ordinary window
# plumbing, and GetKeyboardState + MapVirtualKey + GetAsyncKeyState is the
# mandatory WM_KEYDOWN-to-character path in JUCE, Qt, wxWidgets, SDL and every
# Chromium/Electron windowing back-end. See windows-keylogger-source below.
