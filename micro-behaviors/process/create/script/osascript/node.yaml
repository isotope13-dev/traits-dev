# Node.js wrappers around AppleScript execution (`applescript`,
# `node-osascript`, `run-applescript`). Each of these shells out to
# /usr/bin/osascript, so a reference proves only the ability to run AppleScript
# from Node -- ordinary tooling reaches for them to open a URL, read the default
# browser, or drive an app. Keystroke capture, automation abuse, and other
# intent live in the objectives that reference these atoms.
#
# The libraries only work on macOS, but their names travel inside
# cross-platform bundles (webpack/esbuild output, Bun/Node single-file
# executables), so the file types stay broad.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries, javascript, typescript]
  attack: T1059.002
  crit: notable
  conf: 0.7

traits:
  - id: require-applescript-single
    desc: require('applescript') import
    if:
      type: text
      substr: require('applescript')

  - id: require-applescript-double
    desc: require("applescript") import
    if:
      type: text
      substr: require("applescript")

  - id: node-osascript-library
    desc: node-osascript library reference
    if:
      type: text
      substr: node-osascript

  - id: run-applescript-library
    desc: run-applescript library reference
    if:
      type: text
      substr: run-applescript

composite_rules:
  - id: node-applescript-library-reference
    desc: Node.js AppleScript library reference
    crit: notable
    conf: 0.7
    any:
      - id: require-applescript-single
      - id: require-applescript-double
      - id: node-osascript-library
      - id: run-applescript-library
