defaults:
  crit: notable
  platforms: [windows, unix]
  for: [java, groovy, kotlin]
traits:
  - id: exec-task
    desc: Gradle exec task definition
    if:
      type: text
      regex: "exec\\s*\\{"
    unless:
      - id: metadata/file/catalog/identity::nixpkgs-package-catalog
  - id: command-line
    desc: Gradle commandLine property
    if:
      type: text
      substr: "commandLine"
    unless:
      - id: metadata/file/catalog/identity::nixpkgs-package-catalog
