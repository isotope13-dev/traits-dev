defaults:
  crit: suspicious
  platforms: [windows, unix]
  for: [groovy]
traits:
  - id: gradle-exec-calc
    desc: Gradle executes calc.exe (PoC/Malware payload)
    conf: 1.0
    if:
      type: text
      regex: "commandLine\\s*.{0,220}\\bcalc(\\.exe)?\\b"
  - id: gradle-exec-powershell-encoded
    desc: Gradle executes encoded PowerShell
    conf: 0.8
    if:
      type: text
      regex: "powershell.{0,220}-e(ncodedCommand)?\\s+[A-Za-z0-9+/=]{20,}"
  - id: gradle-exec-curl-pipe-shell
    desc: Gradle executes a downloaded shell response
    conf: 0.97
    if:
      type: text
      regex: "(?i)\\bcurl\\b[^\\n]{0,180}\\|\\s*(ba|da|z)?sh\\b"
