defaults:
  platforms: [macos]
  for: [shell, applescript]
  crit: notable
traits:
  - id: curl-pipe-osacompile
    desc: Command text pipes curl output to osacompile
    conf: 0.97
    if:
      type: text
      regex: '\bcurl\b[^\n]{0,350}\|\s*osacompile\b'
  - id: shell-osascript-variable-command
    desc: AppleScript shell text runs osascript variable
    conf: 0.95
    if:
      type: text
      regex: 'do shell script "osascript "\s*&\s*[A-Za-z_][A-Za-z0-9_]*'
  - id: osacompile-app-output
    desc: osacompile builds app from script variable
    conf: 0.95
    for: [shell]
    if:
      type: text
      regex: 'osacompile\s+-x\s+-e\s+"\$[A-Za-z_]+"\s+-o\s+'
