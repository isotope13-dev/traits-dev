# A shell call and an app-name reference do not establish settings automation
# or attacker intent: an ordinary dialog can use this title.
defaults:
  platforms: [macos]
  for: [applescript]
composite_rules:
  - id: shell-with-settings-reference
    desc: AppleScript shell call with settings-app name
    crit: notable
    conf: 0.85
    all:
      - id: metadata/file/string/application-name::settings-app-name-reference
      - id: micro-behaviors/process/create/script/apple-event::shell-dup-cmd
