defaults:
  for:
    - applescript
  platforms:
    - macos
  attack: T1059.002
traits:
  - id: shell-dup
    desc: References AppleScript shell execution
    crit: notable
    conf: 0.95
    attack: T1059.004
    if:
      type: import
      exact: 'syso.exec'
  - id: shell-dup-cmd
    desc: do shell script (command)
    crit: notable
    conf: 0.95
    attack: T1059.004
    if:
      type: text
      substr: do shell script
  - id: compiled-shell-exec-event
    desc: Calls AppleScript shell execution
    crit: notable
    conf: 0.94
    attack: T1059.004
    if:
      type: symbol
      kind: call
      exact: syso.exec
  # The raw four-char Apple Event opcode as it appears in a compiled `.scpt`
  # resource. The load side already had this (`compiled-load-script-event`
  # matches `sysoloadscpt` as text) but the exec side did not: `shell-dup` is
  # an import matcher and `compiled-shell-exec-event` a symbol matcher, and a
  # compiled AppleScript exposes neither -- `cleave symbols` returns 0 for
  # these files -- while `shell-dup-cmd` only matches the *source* spelling
  # `do shell script`. So a compiled dropper's shell execution was invisible,
  # which left `shell-dup-execution` (and through it `dropper` and the hostile
  # `lure-driven-remote-stage-execution`) unreachable for the compiled form
  # that droppers actually ship.
  - id: compiled-shell-exec-opcode
    desc: Compiled AppleScript shell exec opcode
    crit: notable
    conf: 0.94
    attack: T1059.004
    if:
      type: text
      substr: sysoexec
  - id: run-script-cmd
    desc: run script command
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: run script
  - id: run-script-variable
    desc: Executes AppleScript from variable
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: \brun script\s+[A-Za-z_][A-Za-z0-9_]*\b
  - id: open-g-flag
    desc: Open background lure
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: \bopen\s+-g\b
  # StandardAdditions `delay <number>`: event class `syso`, event id `dela`.
  # The compiled .scpt spelling is the raw `.sysodelanull` event descriptor;
  # the dotted form appears in decompiled/annotated dumps.
  - id: delay
    desc: delay command
    crit: baseline
    conf: 0.95
    if:
      type: text
      regex: (^syso\.dela$|sysodelanull)
  - id: load-script
    desc: load script (Apple Event)
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (^syso\.load$|sysoload)
  - id: compiled-load-script-event
    desc: Compiled AppleScript load script event
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: sysoloadscpt
  - id: load-script-cmd
    desc: load script (command)
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (load script|loadscpt)
  - id: load-script-posix-file
    desc: Loads AppleScript from POSIX file
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'load script\s*\(\s*POSIX file'
  - id: osacompile-cmd
    desc: osacompile command reference
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bosacompile\b|o"&"s"&"a"&"c"&"o"&"m"&"p"&"i"&"l"&"e'
  - id: open-location
    desc: open location (Apple Event)
    crit: notable
    conf: 0.9
    attack: T1204.001
    if:
      type: text
      exact: 'syso.open'
  - id: open-url
    desc: open URL (Apple Event)
    crit: notable
    conf: 0.9
    attack: T1204.001
    if:
      type: text
      exact: 'syso.surl'
  - id: get-url
    desc: get URL (Apple Event)
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: 'syso.GUrl'
  - id: open-location-cmd
    desc: open location (command)
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: open location
  - id: open-url-cmd
    desc: open URL (command)
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: open URL
  - id: run-app
    desc: run/open application (Apple Event)
    crit: notable
    conf: 0.85
    if:
      type: text
      exact: 'aevt.oapp'
  - id: quit-app
    desc: quit application (Apple Event)
    crit: notable
    conf: 0.85
    if:
      type: text
      exact: 'aevt.quit'
  - id: reopen-app
    desc: reopen application (Apple Event)
    crit: notable
    conf: 0.85
    if:
      type: text
      exact: 'aevt.rapp'
  - id: activate
    desc: activate application
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: 'misc.actv'
  - id: do-script
    desc: do script in application
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: 'misc.dosc'
  - id: select
    desc: select UI element
    crit: baseline
    conf: 0.85
    if:
      type: text
      exact: 'misc.slct'
  - id: folder-ref
    desc: folder/file reference
    crit: baseline
    conf: 0.9
    if:
      type: text
      exact: 'ears.ffdr'
  - id: count
    desc: count items
    crit: baseline
    conf: 0.9
    if:
      type: text
      exact: 'core.cnte'
  - id: delete-dup
    desc: delete items
    crit: notable
    conf: 0.9
    attack: T1070.004
    if:
      type: text
      exact: 'core.dele'
  - id: move
    desc: move items
    crit: notable
    conf: 0.85
    if:
      type: text
      exact: 'core.move'
  - id: duplicate
    desc: duplicate items
    crit: notable
    conf: 0.85
    if:
      type: text
      exact: 'core.clon'
composite_rules:
  - id: micro-behaviors/process/create/script/apple-event::shell-dup-execution
    desc: Compiled AppleScript executes shell commands
    crit: notable
    conf: 0.9
    attack: T1059.004 - applescript
    any:
      - id: micro-behaviors/process/create/script/apple-event::shell-dup
      - id: micro-behaviors/process/create/script/apple-event::shell-dup-cmd
      - id: micro-behaviors/process/create/script/apple-event::compiled-shell-exec-event
      - id: micro-behaviors/process/create/script/apple-event::compiled-shell-exec-opcode
  - id: delayed-shell
    desc: Shell execution and delay references
    crit: notable
    conf: 0.85
    all:
      - id: delay
      - id: micro-behaviors/process/create/script/apple-event::shell-dup-execution
  - id: external-script
    desc: Loads external AppleScript code
    crit: suspicious
    conf: 0.85
    any:
      - id: load-script
      - id: load-script-cmd
      - id: load-script-posix-file
  - id: opens-url
    desc: Opens URL or location
    crit: notable
    conf: 0.85
    attack: T1204.001 - applescript
    any:
      - id: open-location
      - id: open-url
      - id: get-url
      - id: open-location-cmd
      - id: open-url-cmd
  - id: run-script-execution
    desc: Executes AppleScript at runtime
    crit: notable
    conf: 0.9
    any:
      - id: run-script-cmd
      - id: run-script-variable
  - id: dropper
    desc: Loads external script then executes
    crit: suspicious
    conf: 0.9
    all:
      - id: external-script
      - id: micro-behaviors/process/create/script/apple-event::shell-dup-execution
