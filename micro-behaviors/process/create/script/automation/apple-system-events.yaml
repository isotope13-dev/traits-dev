# `System Events` is macOS's GUI-scripting bridge. Talking to it is the
# ordinary way an AppleScript reads the frontmost app, clicks a UI element,
# sets a preference, or triggers the Accessibility permission prompt.
# Neutral authority: UI-defacement and keystroke-injection intent live in
# objectives/impact/ui/ and micro-behaviors/hardware/input/keyboard/simulate/.
defaults:
  platforms: [macos]
  attack: T1059.002

traits:
  - id: system-events-target
    desc: Scripts the macOS System Events app
    crit: notable
    conf: 0.65
    for: [macho, shell, applescript]
    if:
      type: text
      substr: tell application "System Events"
