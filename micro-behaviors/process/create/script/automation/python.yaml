defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059
traits:
  - id: playwright-python-chromium-launch
    desc: Launches Chromium through Python Playwright
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: chromium.launch
  - id: playwright-python-sync-api-import
    desc: Imports the Python Playwright sync API
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: playwright.sync_api
  - id: playwright-page-evaluate
    desc: Executes code with Playwright page.evaluate()
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: page.evaluate
  - id: playwright-persistent-browser-context
    desc: Playwright persistent browser context
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: launch_persistent_context
  - id: chrome-profile-clone-routine
    desc: Clones a Chrome profile for browser automation
    crit: notable
    conf: 0.9
    # Rust/JS automation CLIs (agent-browser, etc.) use copy_chrome_profile;
    # Python helpers often name it clone_chrome_profile.
    for: [python, rust, javascript, typescript, go, source]
    if:
      type: text
      regex: '\b(clone|copy)_chrome_profile\b'
