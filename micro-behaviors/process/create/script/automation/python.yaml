defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059
traits:
  - id: playwright-python-chromium-launch
    desc: Launches Chromium through Python Playwright
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: chromium.launch
  - id: playwright-python-sync-api-import
    desc: Imports the Python Playwright sync API
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: playwright.sync_api
  - id: playwright-page-evaluate
    desc: Executes code with Playwright page.evaluate()
    crit: notable
    conf: 0.86
    ref: sha256:6f3972835d9ebdf69f562a91e68091769d80de62467e6c129d53f810de7f539a
    if:
      type: symbol
      kind: call
      exact: page.evaluate
  - id: playwright-persistent-browser-context
    desc: Playwright persistent browser context
    crit: notable
    conf: 0.86
    ref: sha256:6f3972835d9ebdf69f562a91e68091769d80de62467e6c129d53f810de7f539a
    if:
      type: function
      substr: launch_persistent_context
