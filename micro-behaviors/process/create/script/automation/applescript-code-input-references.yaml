# Interpreter input references do not establish fetched code, memory-only execution, or staging.
composite_rules:
- for:
  - applescript
  platforms:
  - macos
  id: micro-behaviors/process/create/script/automation::applescript-variable-or-pipe-input-reference
  desc: AppleScript variable/osascript-pipe code-input references
  crit: notable
  conf: 0.95
  any:
  - id: micro-behaviors/process/create/script/apple-event::run-script-variable-text-reference
  - id: micro-behaviors/process/create/script/osascript::pipe-osascript
