# Driving the Finder through AppleScript.
#
# `tell application "Finder"` is the documented way an AppleScript copies,
# moves, renames or reveals a file, and plenty of ordinary automation does
# exactly that. Neutral authority: the reason a stealer prefers Finder to
# read(2) — Finder already holds the TCC grants for Desktop, Documents,
# Downloads and the app-data containers, so a copy it performs on the
# caller's behalf raises no consent prompt the caller would otherwise trigger
# — is an evasion inference and lives in
# objectives/evasion/tcc-manipulation/bypass/.
defaults:
  platforms: [macos]
  for: [scripts, source, macho]
  attack: T1059.002

traits:
  - id: finder-scripting-target
    desc: Scripts the macOS Finder app
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: tell application "Finder"

  - id: finder-duplicate-command
    desc: Copies a file via the Finder
    # `duplicate` is Finder's copy verb. Matched separately from the `tell`
    # because compiled callers often build the two halves as separate
    # fragments and concatenate them before handing the script to osascript.
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bduplicate\b[^\r\n]{0,60}\bto\b[^\r\n]{0,40}(POSIX file|folder|alias)'
