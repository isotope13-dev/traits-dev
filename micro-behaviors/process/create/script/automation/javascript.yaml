# JavaScript browser automation execution surfaces.
defaults:
  platforms: [linux, windows, macos]
  for: [javascript, typescript]
  attack: T1059.007
traits:
  - id: browser-page-evaluate
    desc: Browser automation evaluates page JavaScript
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: page.evaluate
  - id: browser-object-page-evaluate
    desc: Browser object evaluates page JavaScript
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.page\.evaluate$'

  - id: browser-cdp-page-wrapper-symbol
    desc: Defines a CDP page wrapper
    crit: component
    conf: 0.94
    if:
      type: symbol
      kind: function
      exact: withCdpPage

  - id: browser-evaluate-function-symbol
    desc: Defines a browser evaluation function
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: function
      exact: evaluate

  - id: browser-cdp-bootstrap-import
    desc: Imports a CDP browser bootstrap module
    crit: component
    conf: 0.96
    if:
      type: symbol
      kind: import
      regex: '(^|/)cdp-bootstrap\.js$'

composite_rules:
  - id: browser-cdp-evaluate-adapter
    desc: CDP browser adapter evaluates supplied JavaScript
    crit: notable
    conf: 0.98
    all:
      - id: browser-cdp-page-wrapper-symbol
      - id: browser-evaluate-function-symbol
      - id: browser-cdp-bootstrap-import
