defaults:
  platforms: [windows]
  for: [vbs, html]

composite_rules:
  - id: hta-obfuscated-wsh-run-context
    for: [html]
    desc: HTA WSH Run near obfuscated file access
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/data/decode/custom::hta-hex-xor-string-decoder
      - id: micro-behaviors/os/com/automation::script-computed-activex-object
      - id: micro-behaviors/fs/write/content::hta-fso-create-text-file
      - id: micro-behaviors/data/control-flow/dispatch::run-zero-style-argument
    any:
      - id: micro-behaviors/fs/read/stream::html-open-text-stream-read
      - id: micro-behaviors/fs/write/content::fso-open-as-text-stream-write
