traits:
- platforms:
  - windows
  for:
  - vbs
  - javascript
  id: wsh-hidden-batch-script-launch
  desc: WSH launches batch script in hidden window
  crit: notable
  conf: 0.96
  unless:
  - id: metadata/package/testing/presence/harness::test-directory-path
  if:
    type: text
    regex: (?is)WScript\.Shell.{0,120}\.Run\s*\(?\s*["'][^"\r\n]{0,100}\.bat["']\s*,\s*(0|&H0)\b
  attack: T1059.003,T1564.003
