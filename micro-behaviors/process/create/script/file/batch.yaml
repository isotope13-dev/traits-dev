defaults:
  crit: notable
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-variable-runtime-script-launch
    desc: Batch launches variable-selected runtime script
    conf: 0.95
    attack: T1059
    if:
      type: text
      regex: '(?im)%[A-Za-z_][A-Za-z0-9_]*%.{0,100}\.(js|mjs|cjs|npl)\b'

  # A path derived from the batch's own location (`%~0` plus an extension):
  # staged payloads and renamed-interpreter copies are collocated with the
  # dropper so the whole package moves as one directory. The reference alone
  # does not prove execution; composites supply that context.
  - id: batch-self-derived-filename
    desc: Batch references a self-derived filename
    conf: 0.88
    if:
      type: text
      regex: '(?i)%~0\.[A-Za-z0-9]{1,5}'
