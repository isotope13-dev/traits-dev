defaults:
  platforms: [unix, windows]
  for: [markdown, text]
composite_rules:
  - id: agent-template-script-chain-clues
    for: [markdown, text, zip, tar]
    desc: Skill copy, Python execution and removal clues
    crit: suspicious
    conf: 0.99
    scope: archive
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/fs/file/copy/command::agent-template-script-copy-text
      - id: micro-behaviors/process/create/script/file::python-script-arguments-command
      - id: micro-behaviors/fs/delete/file/command::rm-python-script
