defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-named-platform-script-execution
    desc: Install-named script has platform and script launch clues
    crit: notable
    conf: 0.92
    size_max: 10240
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: metadata/import/builtin::require-child-process
      - id: metadata/file/profile/execution-api::platform-process-launch-context
    any:
      - id: micro-behaviors/process/create/script/file::cross-platform-script-exec
      - id: micro-behaviors/process/create/script/file::shell-script-execution-any
      - id: micro-behaviors/process/create/script/file::batch-script-execution
