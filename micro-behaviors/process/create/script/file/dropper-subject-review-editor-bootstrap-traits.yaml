defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: script-nohup
    desc: Backgrounds editor config script
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)nohup\s+(ba)?sh.{0,120}\$HOME/[.]?(vscode|cursor|windsurf).{0,80}\.sh'
  # The same stager often names the editor dir once (`TARGET_DIR="$HOME/.vscode"`)
  # and then works through the variable, which the inline atoms above never see.
