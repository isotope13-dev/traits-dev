defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-named-cross-platform-script-execution
    desc: Install-named script runs shell or batch
    crit: notable
    conf: 0.9
    size_max: 10240
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/process/create/script/file::cross-platform-script-exec
    unless:
      - id: micro-behaviors/os/application/target/agent::hermes-agent-reference
      - id: well-known/app/development/calvyn-code::calvyn-postinstall-marker
