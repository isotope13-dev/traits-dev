# Same literal path, consecutive commands in a sequential body. Explicit
# parent kinds exclude pipelines, || fallbacks and opposite if branches.
# String equality is lexical: mixed quoting and variable destinations remain
# outside this rule. No shell is run and no network resource is fetched.
defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.96

traits:
  - id: shell-downloaded-file-invocation
    desc: Shell invokes a just-downloaded literal path
    if:
      type: tree-sitter
      language: shell
      query: |
        (program
         (command name: (command_name (word) @client) !redirect
          . argument: (word)* @flags
          . argument: [(word) (raw_string) (string . (string_content) .)] @url
          . argument: (word) @output
          . argument: [(word) (raw_string) (string . (string_content) .)] @destination .)
         . (command name: (command_name (word) @interpreter)
          . argument: [(word) (raw_string) (string . (string_content) .)] @executed)
         (#eq? @client "curl")
        (#match? @flags "^(-[fsSLv]+|--silent|--show-error|--fail|--location)$")
        (#match? @url "^['\"]?https?://[A-Za-z0-9][A-Za-z0-9.-]*\\.[A-Za-z]{2,}[:/]")
        (#match? @output "^(-o|--output)$")
        (#match? @interpreter "^(/(usr/)?bin/)?(sh|bash|zsh)$")
        (#eq? @destination @executed))
        (do_group
         (command name: (command_name (word) @client) !redirect
          . argument: (word)* @flags
          . argument: [(word) (raw_string) (string . (string_content) .)] @url
          . argument: (word) @output
          . argument: [(word) (raw_string) (string . (string_content) .)] @destination .)
         . (command name: (command_name (word) @interpreter)
          . argument: [(word) (raw_string) (string . (string_content) .)] @executed)
         (#eq? @client "curl")
        (#match? @flags "^(-[fsSLv]+|--silent|--show-error|--fail|--location)$")
        (#match? @url "^['\"]?https?://[A-Za-z0-9][A-Za-z0-9.-]*\\.[A-Za-z]{2,}[:/]")
        (#match? @output "^(-o|--output)$")
        (#match? @interpreter "^(/(usr/)?bin/)?(sh|bash|zsh)$")
        (#eq? @destination @executed))
        (compound_statement
         (command name: (command_name (word) @client) !redirect
          . argument: (word)* @flags
          . argument: [(word) (raw_string) (string . (string_content) .)] @url
          . argument: (word) @output
          . argument: [(word) (raw_string) (string . (string_content) .)] @destination .)
         . (command name: (command_name (word) @interpreter)
          . argument: [(word) (raw_string) (string . (string_content) .)] @executed)
         (#eq? @client "curl")
        (#match? @flags "^(-[fsSLv]+|--silent|--show-error|--fail|--location)$")
        (#match? @url "^['\"]?https?://[A-Za-z0-9][A-Za-z0-9.-]*\\.[A-Za-z]{2,}[:/]")
        (#match? @output "^(-o|--output)$")
        (#match? @interpreter "^(/(usr/)?bin/)?(sh|bash|zsh)$")
        (#eq? @destination @executed))
        (if_statement
         condition: (_)
         "then" . (command name: (command_name (word) @client) !redirect
          . argument: (word)* @flags
          . argument: [(word) (raw_string) (string . (string_content) .)] @url
          . argument: (word) @output
          . argument: [(word) (raw_string) (string . (string_content) .)] @destination .)
         . (command name: (command_name (word) @interpreter)
          . argument: [(word) (raw_string) (string . (string_content) .)] @executed) . "fi"
         (#eq? @client "curl")
        (#match? @flags "^(-[fsSLv]+|--silent|--show-error|--fail|--location)$")
        (#match? @url "^['\"]?https?://[A-Za-z0-9][A-Za-z0-9.-]*\\.[A-Za-z]{2,}[:/]")
        (#match? @output "^(-o|--output)$")
        (#match? @interpreter "^(/(usr/)?bin/)?(sh|bash|zsh)$")
        (#eq? @destination @executed))
