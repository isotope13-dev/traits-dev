defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: batch-powershell-public-script-launch
  desc: PowerShell launches a script from Users/Public
  crit: notable
  conf: 0.96
  if:
    type: tree-sitter
    language: batch
    query: "(cmd [(command_name) (string)] @tool (argument_list) @args\n  (#match?\
      \ @tool \"(?i)^\\\"?([a-z]:\\\\\\\\[^\\\"\\\\r\\\\n]+\\\\\\\\)?(powershell|pwsh)(\\\
      \\.exe)?\\\"?$\")\n  (#match? @args \"(?i)(^|\\\\s)-(command|c)\\\\s+\\\"\\\\\
      s*&\\\\s+'[a-z]:\\\\\\\\users\\\\\\\\public\\\\\\\\[^'\\\\r\\\\n]+\\\\.ps1'\\\
      \\s*\\\"($|\\\\s)|(^|\\\\s)-(file|f)\\\\s+\\\"?[a-z]:\\\\\\\\users\\\\\\\\public\\\
      \\\\\\[^\\\"\\\\r\\\\n]+\\\\.ps1\\\"?($|\\\\s)\"))"
