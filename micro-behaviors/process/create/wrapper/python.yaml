defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  attack: T1059.006

traits:
  - id: connection-run-method-call
    desc: Connection-named object calls run method
    crit: component
    conf: 0.84
    if:
      type: symbol
      kind: call
      regex: '^(conn|connection|client)\.run$'

  - id: safe-run-call
    desc: safe_run execution wrapper call
    conf: 0.9
    if:
      type: symbol
      exact: safe_run
  - id: pip-requirements-wrapper-call
    desc: Process wrapper invokes pip install
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'RunHidden\s*\(\s*["'']pip["'']\s*,\s*["'']install["'']'
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
