defaults:
  platforms: [windows]
  for: [batch]

traits:
- id: start-temp-executable-text
  desc: Batch starts an executable from Temp
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: '(?i)\bstart\s+""\s+"%tempPath%\\%exeFileName%"'
- id: batch-starts-sibling-vbs
  desc: Batch starts a sibling VBS script
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '(?im)^\s*start\s+(""\s+)?"?%~dp0[^"\r\n]{1,40}\.vbs"?\s*$'
- id: start-http-php-url
  desc: Batch starts HTTP PHP URL
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: '(?i)\bstart\s+https?://[^\s"''&|]{1,120}\.php\b'
- id: public-exe-script-argument
  desc: Public-path EXE receives -c script argument
  crit: suspicious
  conf: 0.94
  attack: T1036.005
  if:
    type: text
    regex: '(?i)\\Users\\Public\\[^"\r\n]{1,80}\.exe"?\s+-c\s+"(%[A-Za-z_]|import)'
- id: batch-for-start-variable
  desc: Batch loop launches variable with start
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)\bfor\s+%%[a-z]\s+in\s*\([^)]{1,40}\)\s*do\s+start\s+%%[a-z]\b'
- id: batch-starts-batch-file
  desc: Batch starts a batch script target
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?im)^\s*start\s+(""\s+)?\S+\.(bat|cmd)\b'


composite_rules:
# certutil droppers launch the decoded image from TEMP or from a variable
# that points at AppData. Either start form is the execution leg.
- id: batch-launches-staged-executable
  desc: Batch starts a staged executable
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/process/create/shell/tmp-exec::batch-start-temp-exe
  - id: metadata/lang/source/syntax/command/invocation::start-variable-command-text
