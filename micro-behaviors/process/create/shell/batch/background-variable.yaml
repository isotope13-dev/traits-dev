defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-background-variable-command
    desc: Batch starts a variable command without a new window
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^[ \t]*start[ \t]+("[^"\r\n]{0,80}"[ \t]+)?/b[ \t]+"?%[A-Za-z_][A-Za-z0-9_]{0,50}%'
