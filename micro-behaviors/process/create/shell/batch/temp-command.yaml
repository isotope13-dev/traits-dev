defaults:
  platforms: [windows]
  for: [class, swift]
traits:
  - id: temporary-batch-command-chain
    desc: Temporary batch paths chained for execution
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)%TEMP%\\{1,2}[\w.-]{1,80}[.]cmd\s*&&\s*%TEMP%\\{1,2}[\w.-]{1,80}[.]cmd'
