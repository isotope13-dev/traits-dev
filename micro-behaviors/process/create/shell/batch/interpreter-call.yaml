# CALLing the command interpreter from a batch script. Neutral on its own —
# wrappers and installers do it — so the intent lives in the composites.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.003
traits:
  - id: call-comspec
    desc: Call COMSPEC interpreter
    crit: suspicious
    conf: 0.4
    if:
      type: text
      regex: (?im)^\s*@?call\s+%comspec%\b
  # `call` executing a substring-stripped expansion (`call "%Y%%F:TOKEN=%`):
  # the executed command only materializes after cmd removes every TOKEN
  # occurrence. Stripping to empty is the deobfuscation shape; substitutions
  # that replace text (`%X:a=b%`) do not match.
  - id: batch-call-strip-execute
    desc: Batch call executes a stripped variable
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?im)^\s*@?call\s+[^\r\n]{0,80}:[A-Za-z0-9_]{2,}=%'
  - id: call-cmd
    desc: Call cmd interpreter
    crit: suspicious
    conf: 0.4
    not:
    - regex: (?im)^\s*@?call\s+cmd(\.exe)?\s+%\*\s*$
    unless:
    - type: text
      regex: (?im)^\s*@?call\s+cmd(\.exe)?\s+%\*\s*$
    - type: basename
      exact: start-ssh-agent.cmd
    if:
      type: text
      # `call cmd %*` forwards the caller's arguments; it does not launch a
      # command. A following token other than %* is the actual interpreter use.
      regex: '(?im)^\s*@?call\s+cmd(\.exe)?\s+(%[^*%]|[^%\s])'
