# CALLing the command interpreter from a batch script. Neutral on its own —
# wrappers and installers do it — so the intent lives in the composites.
defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.003
traits:
  - id: call-comspec
    desc: Call COMSPEC interpreter
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (?im)^\s*@?call\s+%comspec%\b
  # `call` executing a substring-stripped expansion (`call "%Y%%F:TOKEN=%`):
  # the executed command only materializes after cmd removes every TOKEN
  # occurrence. Stripping to empty is the deobfuscation shape; substitutions
  # that replace text (`%X:a=b%`) do not match.
  - id: batch-call-strip-execute
    desc: Batch call executes a stripped variable
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?im)^\s*@?call\s+[^\r\n]{0,80}:[A-Za-z0-9_]{2,}=%'
  - id: call-cmd
    desc: Call cmd interpreter
    crit: notable
    conf: 0.85
    not:
    - regex: (?im)^\s*@?call\s+cmd(\.exe)?\s+%\*\s*$
    unless:
    - type: text
      regex: (?im)^\s*@?call\s+cmd(\.exe)?\s+%\*\s*$
    - type: basename
      exact: start-ssh-agent.cmd
    if:
      type: text
      # `call cmd %*` forwards the caller's arguments; it does not launch a
      # command. A following token other than %* is the actual interpreter use.
      regex: '(?im)^\s*@?call\s+cmd(\.exe)?\s+(%[^*%]|[^%\s])'
  # `%%~$PATH:P` (and `%~$PATH:i`) asks cmd to find the named executable on
  # PATH. The name is often a reconstructed variable, so the lookup is the
  # execution step even when `powershell` is not spelled out.
  - id: batch-path-search-executable
    desc: Batch resolves a command through PATH
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)%+~\$PATH:'
  # `-c` / `-Command` whose argument constructs a ScriptBlock. The interpreter
  # name may be a variable; the command switch and constructor are the launch.
  - id: batch-scriptblock-command-flag
    desc: Batch -Command builds a ScriptBlock
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)-c(ommand)?\b[^\r\n]{0,512}\[\s*scriptblock\s*\]::\s*create\s*\('
