defaults:
  platforms:
  - windows
  for:
  - batch

traits:
  - id: batch-wildcard-file-enumeration-execution
    desc: Batch enumerates wildcard and spawns target
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bfor\s+%%[a-z]\s+in\s*\([^)]{0,20}\*\.?\*[^)]{0,20}\)\s*do\s+(start|cmd|call)\b'


composite_rules:
  - id: batch-wildcard-start-patterns
    desc: Batch wildcard and variable start references
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/batch::batch-wildcard-file-enumeration-execution
      - id: micro-behaviors/process/create/shell/batch::batch-for-start-variable

