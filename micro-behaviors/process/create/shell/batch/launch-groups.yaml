defaults:
  platforms:
  - windows
composite_rules:
- id: batch-process-command-group
  desc: Batch process-launch command forms
  crit: notable
  conf: 0.6
  any:
  - id: micro-behaviors/process/create/hidden::start-minimized-window
  - id: micro-behaviors/process/create/shell/batch::run-from-temp
  - id: micro-behaviors/process/create/shell/batch::call-comspec
  - id: micro-behaviors/process/create/shell/batch::call-cmd
- id: batch-program-launch-group
  desc: Batch program-launch command forms
  crit: component
  conf: 0.82
  for:
  - batch
  any:
  - id: micro-behaviors/process/create/shell/command-mode::start-executable-command
  - id: micro-behaviors/process/create/shell/batch::run-from-temp
  - id: micro-behaviors/process/create/shell/batch::call-comspec
  - id: micro-behaviors/process/create/shell/batch::call-cmd
  - id: micro-behaviors/process/create/shell/command-flag::powershell-file-flag
  - id: micro-behaviors/process/create/shell/script-host::cscript-nologo
  - id: micro-behaviors/process/create/shell/command-mode::batch-absolute-executable-command
