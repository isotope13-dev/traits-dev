# How an npm package invokes a shell or the npm/npx runners: package.json
# `scripts[*]` values (sh -c / bash -c / eval), Node spawn targets, and the
# shell-side `npx` wrapper functions that decide what flags every later `npx`
# in a script actually runs with.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.85
  mbc: B0030
  attack: T1059
traits:
  - id: npx-skills-add-command
    desc: npx adds an agent skill repository
    crit: component
    conf: 0.94
    for: [markdown, python, shell, javascript, typescript]
    if:
      type: text
      regex: '\bnpx[ \t]+.{0,24}[ \t]+skills[ \t]+add[ \t]+[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'

  - id: npx-skills-add-trailing-yes-command
    desc: npx adds a skill repo with -y
    crit: component
    conf: 0.94
    for: [markdown, python, shell, javascript, typescript]
    if:
      type: text
      regex: '\bnpx[ \t]+skills[ \t]+add[ \t]+[\w.-]+/[\w.-]+[^\n]{0,60}--?y(es)?\b'

  - id: npm-script-shell
    desc: npm script invokes shell or eval
    if:
      type: value
      path: 'scripts[*]'
      regex: '\b(sh|bash)\s+-c\b|\beval\b'
  - id: npm-script-node-exec-sync
    desc: npm script executes Node system command
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: value
      path: 'scripts[*]'
      regex: '\b(execSync|execFileSync|spawnSync)\s*\('
  - id: node-npm-spawn-target
    desc: Spawns the npm package CLI
    crit: notable
    conf: 0.9
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      substr: spawn
      arg:
        kind: string
        exact: npm
  - id: node-npx-target
    desc: Spawns the npx package runner
    crit: notable
    conf: 0.9
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn(Sync)?$'
      arg:
        kind: string
        exact: npx

  # A bare `bunx <package>` invocation may resolve a local dependency or fetch
  # one when it is absent. That is package-runner execution, not evidence of an
  # automatic install objective without lifecycle or remote-package context.
  - id: shell-bunx-package-runner
    desc: Shell invokes the bunx package runner
    crit: notable
    conf: 0.9
    mbc: C0017
    attack: T1059.007
    for: [shell, makefile]
    if:
      type: text
      regex: '(?m)(^|[;&|])[ \t]*bunx[ \t]+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,40}'

  # A shell function named `npx` intercepts every later `npx ...` in the file:
  # the arguments the script appears to pass are not the ones the runner
  # receives. Neutral on its own — used both to harden the runner and to
  # redirect it — so the flags it forces are matched separately below.
  - id: npx-wrapper-function
    desc: Defines a shell function overriding npx
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '(?m)^\s*npx\s*\(\s*\)\s*\{'

  - id: npx-wrapper-ignore-scripts
    desc: npx wrapper forces install scripts off
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '(?m)^\s*npx\s*\(\s*\)\s*\{[^\n]{0,120}--ignore-scripts=true'

  - id: npx-wrapper-min-release-age
    desc: npx wrapper requires a minimum package age
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '(?m)^\s*npx\s*\(\s*\)\s*\{[^\n]{0,120}--min-release-age=[0-9]'

  # `npx -y <pkg>` runs a package without prompting. This is a process
  # capability, not attacker intent: maintainers commonly use it for
  # repository lint and formatting. Match the parsed call so comments and
  # documentation do not become process-creation findings.
  - id: npx-yes-flag
    desc: Shell npx uses yes flag
    crit: notable
    conf: 0.9
    mbc: C0017
    attack: T1059.007
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: npx
      arg:
        kind: identifier
        name: -y

  # Prettier is a formatter, and `npx -y prettier -l -w` is a common
  # maintainer-only cleanup command. Keep the process capability visible while
  # preventing the generic unpinned-package objective from treating it as an
  # unexplained runtime installer.
  - id: npx-prettier-formatting
    desc: Npx invokes Prettier source formatter
    crit: notable
    conf: 0.94
    for: [shell, makefile]
    if:
      type: text
      regex: '(?m)(^|[;&|])\s*npx\s+(-y|--yes)\s+prettier\b.{0,120}(--write|-w)\b'
