# Shell / eval invocation capability expressed in an npm package.json script
# (sh -c / bash -c / eval). scripts[*] matches any script value.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.85
  mbc: B0030
  attack: T1059
traits:
  - id: npx-skills-add-command
    desc: npx adds an agent skill repository
    crit: component
    conf: 0.94
    for: [markdown, python, shell, javascript, typescript]
    if:
      type: text
      regex: '\bnpx[ \t]+.{0,24}[ \t]+skills[ \t]+add[ \t]+[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'

  - id: npx-skills-add-trailing-yes-command
    desc: npx adds a skill repo with -y
    crit: component
    conf: 0.94
    for: [markdown, python, shell, javascript, typescript]
    if:
      type: text
      regex: '\bnpx[ \t]+skills[ \t]+add[ \t]+[\w.-]+/[\w.-]+[^\n]{0,60}--?y(es)?\b'

  - id: npm-script-shell
    desc: npm script invokes shell or eval
    if:
      type: value
      path: 'scripts[*]'
      regex: '\b(sh|bash)\s+-c\b|\beval\b'
  - id: npm-script-node-exec-sync
    desc: npm script executes Node system command
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: value
      path: 'scripts[*]'
      regex: '\b(execSync|execFileSync|spawnSync)\s*\('
  - id: node-npm-spawn-target
    desc: Spawns the npm package CLI
    crit: notable
    conf: 0.9
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      substr: spawn
      arg:
        kind: string
        exact: npm
  - id: node-npx-target
    desc: Spawns the npx package runner
    crit: notable
    conf: 0.9
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn(Sync)?$'
      arg:
        kind: string
        exact: npx
