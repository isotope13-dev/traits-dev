# Installing a skill repository is ordinary package management. Trust abuse
# requires additional evidence in the consuming objective.
defaults:
  platforms: [unix, windows]
  for: [markdown, python, shell, javascript, typescript]

composite_rules:
  - id: npx-skill-repository-install-command
    desc: npx command installs an agent skill repository
    crit: notable
    conf: 0.94
    any:
      - id: npx-skills-add-command
      - id: npx-skills-add-trailing-yes-command
