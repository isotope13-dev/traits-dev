defaults:
  crit: notable
  attack: T1059.003
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
  - id: batch-script-exec-cmd
    desc: cmd launches batch script
    conf: 0.7
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
    if:
      type: text
      regex: (?i)cmd(\.exe)?\s*/[ckr]\s+.{0,80}\.(bat|cmd)\b

  - id: batch-script-output-capture
    desc: Captures batch script output
    conf: 0.95
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\bcmd(\.exe)?\s+/[ck]\s+[^>\r\n]{1,160}\.(bat|cmd)["'']?\s*>[^\r\n]'
