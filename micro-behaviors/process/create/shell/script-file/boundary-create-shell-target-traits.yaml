defaults:
  platforms: [linux, macos, windows]
  for: [shell]
  crit: notable
traits:
- id: shell-runs-script-if-present
  desc: Runs a variable-named script if it exists
  conf: 0.9
  platforms: [unix]
  for: [shell, text]
  if:
    type: text
    regex: '\[\s*-f\s+"?\$\w{1,20}"?\s*\][^\n]{0,40};?\s*then\s+(\.|source|sh|bash)\s+"?\$\w{1,20}'

  # `char *argv[] = { "/bin/sh", NULL };` -- the argv vector handed to
  # execve/execv when the program starts a shell. This is the standard C
  # idiom for spawning a shell and nothing more: it is what a reverse shell
  # builds, and equally what a console/recovery shell, an init helper or an
  # embedded debug daemon builds. BlueZ's peripheral/main.c does exactly this
  # in `run_shell()`, which forks and execs a shell on the device console.
  #
  # Relocated from objectives/command-and-control/backdoor/shell/reverse,
  # where it was filed as `c-execve-shell-argv` at suspicious: the matcher
  # detects a neutral capability, so the directory and the criticality both
  # claimed an intent the pattern cannot establish. The reverse-shell
  # composite still references it and supplies that intent itself, from the
  # sockaddr_in and dup2-onto-stdio legs beside it.
- id: shell-exec-script-path
  desc: Shell command references a script path
  conf: 0.85
  platforms: [unix, windows]
  for: [shell, github-actions, javascript, typescript, python]
  if:
    type: text
    regex: '(?m)(^|[;&|"''(])\s*(sudo\s+)?([\w/.-]{0,40}/)?(ba|[zk]|da)?sh +[~./]\S+'

  unless:
  - id: metadata/file/format/news::serialized-news-article-catalog
