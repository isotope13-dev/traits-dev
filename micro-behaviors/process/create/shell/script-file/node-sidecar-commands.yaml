defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: micro-behaviors/process/create/shell/script-file::node-shell-sidecar-launch
    desc: Shell sidecar command text
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      regex: '/bin/shell\s+[^"''\n]{1,120}\.(sh|shell)\b'
  - id: micro-behaviors/process/create/shell/script-file::node-cmd-sidecar-launch
    desc: Node spawn cmd slash-c sidecar
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      regex: 'spawn\([^\n]{0,32}cmd\.exe[^\n]{0,32}/c[^\n]{0,120}\.(bat|cmd)'
