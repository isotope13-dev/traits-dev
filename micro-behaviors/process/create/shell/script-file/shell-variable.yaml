defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.98
traits:
  - id: shell-variable-script-file
    desc: Shell interprets a variable script path
    unless:
      - type: function
        exact: sh
      - id: metadata/lang/source/naming/function/command::shell-bash-function-definition
      - type: function
        exact: zsh
    if:
      type: tree-sitter
      language: shell
      query: |
        (command name: (command_name (word) @interpreter)
          . argument: (string . (simple_expansion (variable_name) @path) .)
          (#match? @interpreter "^(/(usr/)?bin/)?(sh|bash|zsh)$"))
