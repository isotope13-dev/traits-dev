defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: micro-behaviors/process/create/shell/script-file::node-sidecar-launch-command
    desc: Node launches OS specific sidecar
    crit: component
    for: [javascript, typescript]
    any:
      - id: micro-behaviors/process/create/shell/script-file::node-shell-sidecar-launch
      - id: micro-behaviors/process/create/shell/script-file::node-cmd-sidecar-launch
