defaults:
  platforms:
    - unix
    - windows
  for:
    - shell

traits:
  - id: shell-temp-nonscript-extension
    desc: Shell launches temp file with document extension
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?m)^\s*(/usr/bin/)?(ba)?sh\b\s+/(var/)?tmp/[A-Za-z0-9_.-]+\.(gif|pdf|xml)\b'
