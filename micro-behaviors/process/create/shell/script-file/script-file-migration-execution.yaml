defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: batch-invokes-script-path
    desc: Batch directly invokes script file path
    conf: 0.8
    attack: T1059.003
    for:
      - batch
    if:
      type: text
      regex: '(?im)^\s*[a-z]:\\[a-z0-9_.-]+\.(bat|cmd)\b'
  - id: shell-script-execution
    desc: Executes a shell script file (.sh)
    conf: 0.7
    attack: T1059.004
    for: [scripts]
    unless:
      - id: metadata/build/scaffold::python-scaffold-template-delimiters
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - type: basename
        regex: (?i)(^|[/\\!])(METADATA|PKG-INFO|README(\.[^/\\!]*)?)$
      - id: metadata/package/freeform::pkg-description-content-type-markdown
      - id: metadata/lang/embedded::shell
      # Python package help/errors commonly show the install command without
      # executing it; do not report that prose as process creation.
      - type: text
        regex: '(?is)\b(run|install).{0,80}\b(bash|sh|zsh)\s+[^\n]{1,80}\.sh\b'
      - type: text
        regex: '(?is)\b(usage|example).{0,80}\b(bash|sh|zsh)\s+[^\n]{1,80}\.sh\b'
    if:
      type: text
      regex: (?m)(^|[\n;&|])\s*((/bin/)?(ba)?sh|shell|zsh)\s+\S{1,80}\.sh
  - id: shell-script-execution-env
    desc: Executes shell script with env assignment
    conf: 0.7
    attack: T1059.004
    for: [scripts]
    unless:
      - type: basename
        regex: (?i)(^|[/\\!])(METADATA|PKG-INFO|README(\.[^/\\!]*)?)$
      - id: metadata/package/freeform::pkg-description-content-type-markdown
      - id: metadata/lang/embedded::shell
    if:
      type: text
      regex: (?m)(^|[\n;&|])\s*[A-Z_]\w*=\S{1,60}\s+(bash|sh|zsh)\s+\S{1,80}\.sh
  - id: shell-script-execution-alt
    desc: Executes shell script via alt interpreters
    conf: 0.7
    attack: T1059.004
    for: [scripts]
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - type: basename
        regex: (?i)(^|[/\\!])(METADATA|PKG-INFO|README(\.[^/\\!]*)?)$
      - id: metadata/package/freeform::pkg-description-content-type-markdown
      - id: metadata/lang/embedded::shell
    if:
      type: text
      regex: (?m)(^|[\n;&|])\s*(dash|ash)\s+\S{1,80}\.sh
  - id: shell-script-relative-execution
    desc: Executes a relative shell script path (.sh)
    conf: 0.7
    attack: T1059.004
    for: [shell]
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
      - id: micro-behaviors/revision-control/repository::git-operations-1
      - id: metadata/lang/source/syntax/command/named-command::git-working-tree-command-reference
    if:
      type: symbol
      kind: call
      regex: '^\./[A-Za-z0-9_./-]{1,80}\.sh$'
  - id: shell-two-script-commands
    desc: Shell command text names two script files
    conf: 0.9
    platforms: [unix, android]
    for: [elf, shell, c, cpp]
    if:
      type: text
      regex: '\bsh\s+[A-Za-z0-9._-]+\.sh;.{0,80}\bsh\s+[A-Za-z0-9._-]+\.sh\b'
