traits:
- id: powershell-script-execution
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  desc: Executes a PowerShell script file (.ps1)
  conf: 0.7
  attack: T1059.001
  if:
    type: text
    regex: (?i)^\s*[;&|]?\s*(powershell|pwsh)(\.exe)?\b.{0,80}\s-File\s.{0,80}(\.ps1|\$[A-Za-z]+)\b
  unless:
  - id: micro-behaviors/process/argument/file::powershell-script-file-option-string
  - type: text
    regex: (?i)-File\s+build\.ps1\b
  - type: text
    substr: IdentifyConsole.ps1
  - type: text
    substr: ConinMode.ps1
  - type: text
    substr: IdentifyConsoleWindow.ps1
  - id: well-known/lib/ai/huggingface::hub-utils-package-file
  - id: well-known/lib/ai/huggingface::hub-runtime-bytecode
- id: powershell-file-flag
  platforms:
  - windows
  desc: PowerShell -File invocation
  conf: 0.82
  for:
  - batch
  unless:
  - type: text
    substr: Stop-Process -f -ProcessName explorer
  - type: text
    substr: Media.SoundPlayer
  - id: well-known/tool/detection/wireshark/
  - id: micro-behaviors/communications/http/download/cli::psdownload-helper-label
  - id: metadata/file/string/application-name::microsoft-activation-tool-script
  if:
    type: text
    regex: (?i)\bpowershell(\.exe)?[^\r\n"]{0,120}[ \t]-(File|F)[ \t]
defaults:
  crit: notable
