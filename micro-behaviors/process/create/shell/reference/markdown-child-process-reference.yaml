# A document (markdown, recorded text, or shell text) that names Node's
# child_process module or a sync exec API. A reference in a document is not a
# call: the front-matter and agent-skill consumers pair this with their own
# execution-context evidence before claiming that parsing runs the command.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, shell]
  conf: 0.9

traits:
  - id: child-process-reference
    desc: Text references child_process or sync exec
    crit: notable
    if:
      type: text
      regex: 'child_process|\b(execSync|spawnSync|execFileSync)\s*\('
