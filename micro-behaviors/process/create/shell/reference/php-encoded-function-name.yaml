defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1059.004,T1027
traits:
  # The decoded string is exactly a PHP command-execution builtin. Ordinary
  # code names these functions directly; hiding the name in an encoded literal
  # keeps it out of plain-text review.
  - id: php-encoded-shell-function-name
    desc: Encoded PHP shell function name
    crit: suspicious
    conf: 0.93
    if:
      type: encoded
      encoding: [base64, hex, url]
      regex: '^(shell_exec|system|passthru|exec|popen|proc_open|pcntl_exec)$'
