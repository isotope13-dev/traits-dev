defaults:
  for: [elf, macho, pe]
  platforms:
    - linux
    - macos
    - windows
composite_rules:
  - id: cpp-with-system
    desc: C++ and system/popen API references
    crit: notable
    conf: 0.85
    all:
      - id: metadata/binary/symbols/name/qualified/runtime::cpp-stdlib
    any:
      - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
      - id: metadata/binary/symbols/name/process::c-popen
  - id: cpp-command-capture
    desc: C++ string and popen API references
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/symbols/name/qualified/runtime::cpp-string
      - id: metadata/binary/symbols/name/process::c-popen
    any:
      - id: micro-behaviors/fs/read/file/handle::fgets-api-import
      - id: metadata/binary/symbols/name/qualified/filesystem::string-append
