defaults:
  for:
    - macho
  platforms:
    - macos

composite_rules:
  - id: adhoc-macho-hex-shell-api-profile
    desc: Ad-hoc Mach-O hex and shell API references
    crit: notable
    conf: 0.8
    all:
      - id: metadata/signature/ad-hoc::adhoc
      - id: micro-behaviors/process/create/shell/reference::few-imports-system-reference
    any:
      - id: metadata/file/encoding/hex::long-hex-text-run
      - id: metadata/file/encoding/hex::macho-long-hex-raw-run
