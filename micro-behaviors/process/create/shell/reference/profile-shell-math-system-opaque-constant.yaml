# Measurements and reference profiles do not establish payload encryption.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries]

composite_rules:
  - id: math-system-opaque-const-profile
    desc: Math/system imports with opaque const data
    crit: notable
    conf: 0.9
    for:
    - macho
    all:
    - id: micro-behaviors/process/create/shell/reference::system-with-math-imports
    - id: metadata/binary/section/entropy::high-entropy-const-region
    any:
    - id: "metadata/binary/layout/strings::binary-strings-at-most-10"
    - id: metadata/binary/section/prose::tiny-cstring-section
