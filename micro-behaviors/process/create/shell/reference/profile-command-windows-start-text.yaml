---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - python
  - makefile
traits:
- id: windows-start-command-a
  desc: Start command text names executable
  conf: 0.8
  if:
    type: text
    regex: (?i)\bstart\s+["']?[a-zA-Z0-9._\\/-]+\.(exe|bat|cmd|ps1)
- id: windows-start-argv-a
  desc: Start and executable appear in argv text
  conf: 0.8
  if:
    type: text
    regex: (?i)["']start["']\s*,\s*["'][a-zA-Z0-9._\\/-]+\.(exe|bat|cmd|ps1)
- id: windows-start-command-b
  desc: Start literal names executable
  conf: 0.8
  if:
    type: string_literal
    regex: \bstart\s+['"]?[a-zA-Z0-9._\\/-]+\.(scr|msi|com)
- id: os-system-start-concat
  desc: os.system start concatenation text
  conf: 0.9
  if:
    type: text
    regex: os\.system\s*\(\s*['"]start\s+['"]\s*\+
- id: os-system-start-fstring
  desc: os.system start f-string text
  conf: 0.9
  if:
    type: text
    regex: os\.system\s*\(\s*f['"]start\s+\{
composite_rules:
- id: windows-start-command
  desc: Windows start command text clues
  conf: 0.85
  any:
  - id: micro-behaviors/process/create/shell/reference::windows-start-command-a
  - id: micro-behaviors/process/create/shell/reference::windows-start-argv-a
  - id: micro-behaviors/process/create/shell/reference::windows-start-command-b
  - id: micro-behaviors/process/create/shell/reference::os-system-start-fstring
  - id: micro-behaviors/process/create/shell/reference::os-system-start-concat
