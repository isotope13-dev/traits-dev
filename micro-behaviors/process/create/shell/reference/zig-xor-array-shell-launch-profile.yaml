# These clues do not establish that the decoded bytes reach a shell or that
# the configured command runs.
defaults:
  platforms: [windows]
  for: [zig]
  attack: T1027,T1059.003

composite_rules:
  - id: zig-xor-array-shell-launch-profile
    desc: Zig XOR-array and command-shell launch clues
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/data/embedded/payload/array::zig-hex-byte-array-literal
      - id: micro-behaviors/data/bitwise/mixed::source-xor-operation
      - id: micro-behaviors/process/argument/option::windows-interpreter-command-syntax
      - id: metadata/lang/source/syntax/member::zig-child-init
