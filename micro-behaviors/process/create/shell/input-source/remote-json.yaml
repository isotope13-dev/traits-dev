defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  # Source-local provenance follows literal concatenation and member reads
  # from parsed response data. It does not claim the version is validated or
  # that shell quoting is present.
  - id: json-response-reaches-shell-command
    desc: Parsed JSON contributes to shell command
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(exec|execSync)$'
      arg:
        index: 0
        from:
          call: '^JSON\.parse$'

  - id: remote-response-reaches-shell-command
    desc: HTTP response contributes to shell command
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(exec|execSync)$'
      arg:
        index: 0
        from:
          call: '(^|\.)(fetch|fetchRemoteText|requestText)$'
          through:
            - call: '^JSON\.parse$'
              arguments: [0]
