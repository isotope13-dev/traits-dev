defaults:
  platforms: [unix]
  for: [python]
  crit: notable
traits:
  - id: python-session-command-to-shell-argv
    desc: Session command feeds spawned shell argv
    conf: 0.99
    if:
      type: tree-sitter
      language: python
      query: |
        ((module (function_definition name: (identifier) @builder parameters: (parameters . (typed_parameter (identifier) @arg)) body: (block (if_statement consequence: (block (return_statement (list (attribute attribute: (identifier) @shell) (string (string_content) @flag) (identifier) @arg_used)))))) (function_definition body: (block (expression_statement (assignment left: (identifier) @command right: (attribute object: (identifier) @process attribute: (identifier) @command_field))) (expression_statement (assignment left: (identifier) @argv right: (call function: (identifier) @build_call arguments: (argument_list . (identifier) @builder_command)))) (expression_statement (assignment right: (await (call function: (attribute object: (identifier) @asyncio attribute: (identifier) @spawn) arguments: (argument_list . (list_splat (identifier) @spawn_argv)))))))))
         (#eq? @builder @build_call) (#eq? @arg @arg_used) (#eq? @command @builder_command)
         (#eq? @command_field "command") (#eq? @shell "shell") (#eq? @flag "-lc")
         (#eq? @argv @spawn_argv) (#eq? @asyncio "asyncio") (#eq? @spawn "create_subprocess_exec"))
