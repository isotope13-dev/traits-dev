defaults:
  platforms: [routeros, appliance, unix]
  for: [perl]

traits:
  - id: micro-behaviors/process/create/shell/backtick::perl-trigger-backtick-exec
    desc: Perl backtick command with redirected stderr
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: 'my \$cmd = \$1;[\s\S]{0,160}`\$cmd 2>&1`'

