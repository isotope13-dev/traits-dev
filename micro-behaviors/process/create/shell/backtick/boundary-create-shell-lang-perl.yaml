defaults:
  crit: notable
  for: [perl]
  platforms: [unix]
traits:
  - id: backticks-exec
    desc: Perl backticks command execution
    conf: 0.85
    attack: "T1059.006"
    if:
      type: text
      regex: '`[^`\n]{1,160}(2>&1|3>&1|uname -a|echo)[^`\n]{0,80}`'
    not:
      - substr: "$CROSS_COMPILE"
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/file/format/
      - type: text
        substr: "xcrun --sdk macosx --show-sdk-path"
      - type: text
        substr: "cxxfilt --version 2>&1"
      - type: text
        substr: "NginxBinary -V 2>&1"
      - type: text
        substr: "$NGINX -V 2>&1"
      - id: "metadata/file/catalog/pattern-rules::secret-rule-category-declaration"
      - id: "metadata/file/catalog/pattern-rules::secret-rule-pattern-example-block"
