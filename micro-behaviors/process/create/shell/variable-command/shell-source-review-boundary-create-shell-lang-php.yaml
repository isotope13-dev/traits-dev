defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  mbc: "E1059"
  attack: "T1059.004"
traits:
  - id: php-exec-concatenated-variable-command
    desc: PHP exec command concatenates a variable
    conf: 0.93
    if:
      type: tree-sitter
      query: |
        ((function_call_expression
          function: (name) @callee
          arguments: (arguments
            . (argument (binary_expression
              left: (variable_name)
              operator: ".")))) @call
          (#eq? @callee "exec"))

  - id: exec-variable-argument-exec
    desc: exec() receives variable argument
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)^exec$'
      arg:
        index: 0
        kind: identifier
  - id: exec-variable-argument-system
    desc: system() receives variable argument
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)^system$'
      arg:
        index: 0
        kind: identifier
  - id: exec-variable-argument-shell
    desc: shell_exec() receives variable argument
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)^shell_exec$'
      arg:
        index: 0
        kind: identifier
  - id: exec-variable-argument-passthru
    desc: passthru() receives variable argument
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)^passthru$'
      arg:
        index: 0
        kind: identifier
