defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-resolvetxt-shell-argument
    desc: Node shell argv uses resolveTxt results
    crit: notable
    conf: 0.99
    attack: T1071.004,T1059.004
    if:
      type: symbol
      kind: call
      regex: '(^|\.)execFile(Sync)?$'
      args:
        - index: 0
          kind: string
          regex: '^(/bin/)?sh$'
        - index: 1
          from:
            call: '(^|\.)resolveTxt$'
            through:
              - call: '\.(flat|join|toString)$'
                receiver: true
