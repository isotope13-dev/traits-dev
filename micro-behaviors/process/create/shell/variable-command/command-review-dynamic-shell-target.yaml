defaults:
  platforms:
  - unix
  - windows
  for: [shell, python, javascript, powershell, c]
traits:
- id: sh-dynamic-command-target
  desc: Shell command variable at a command boundary
  crit: notable
  conf: 0.95
  # NOT javascript/typescript (dropped from the file default): `${expr}` is
  # template-literal interpolation there, and the `(` in the leading character
  # class makes `` `(${code})` `` -- ordinary string building -- read as a
  # command name taken from a variable. Every JS/TS file that formats a value
  # in parentheses was collecting a notable shell-spawn behaviour. In POSIX
  # shell a `$VAR` at a statement boundary really is a command position
  # (shell assignments are `VAR=`, without the `$`). NOT powershell: there a
  # leading `$var` is overwhelmingly an assignment target (`$p = ...`), not a
  # command boundary, so this byte pattern would mislabel ordinary assignments.
  # C source uses its own execution atoms; applying this shell matcher to C
  # made decoded strings look like command launches.
  for: [shell]
  # Shell parsing distinguishes a variable-expanded command name from a
  # variable used as an argument on a continued line. Matching parsed call
  # targets avoids treating constructs such as `update-alternatives ... \\`
  # followed by `$2 ...` as execution through a dynamic command target.
  if:
    type: symbol
    kind: call
    regex: '^\$(\{[A-Za-z_]\w*(:-[^}]{1,80})?\}|[A-Za-z_]\w*|[1-9]\d*)$'
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
