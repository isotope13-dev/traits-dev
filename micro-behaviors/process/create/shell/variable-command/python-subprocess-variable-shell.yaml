# Python subprocess.check_output(..., shell=True) — technique leaf sibling of
# process/create/subprocess (parent dir is at the size/leaf-yaml caps).
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.006

traits:
  - id: micro-behaviors/process/create/shell/variable-command::variable-command-shell-true
    desc: Variable command passed to shell
    crit: notable
    conf: 0.95
    mbc: "E1059.006"
    if:
      type: tree-sitter
      kind: call
      regex: '(?s)\bsubprocess\.run\(\s*command\s*,[^)]{0,300}\bshell\s*=\s*True'
  - id: micro-behaviors/process/create/shell/variable-command::python-popen-variable-shell
    desc: Popen runs a variable through the shell
    crit: notable
    conf: 0.93
    if:
      type: tree-sitter
      kind: call
      regex: 'Popen\(\s*\w+\s*,\s*shell\s*=\s*True'
