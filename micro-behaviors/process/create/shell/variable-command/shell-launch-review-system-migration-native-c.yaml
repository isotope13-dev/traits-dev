defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
traits:
  - id: c-system-command-call
    desc: C system call executes a command value
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: system
      arg:
        index: 0
        kind: identifier
    unless:
      - type: symbol
        kind: function
        exact: system
