defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: trimmed-line-shell-helper
    desc: Dispatches trimmed lines to shell helper
    crit: notable
    # Bind the dispatched variable, helper name, and shell argument. A
    # downloaded list displayed through a logging helper must not qualify.
    if:
      type: tree-sitter
      query: |
        (program
          (function_declaration
            body: (statement_block
              (try_statement
                body: (statement_block
                  (for_in_statement
                    body: (statement_block
                      (lexical_declaration
                        (variable_declarator name: (identifier) @trimmed
                          value: (call_expression
                            function: (member_expression
                              property: (property_identifier) @trim))))
                      (expression_statement
                        (call_expression function: (identifier) @dispatch
                          arguments: (arguments (identifier) @line)) @evidence)))))))
          (function_declaration
            name: (identifier) @helper
            parameters: (formal_parameters (identifier) @parameter)
            body: (statement_block
              (try_statement
                body: (statement_block
                  (expression_statement
                    (call_expression function: (_) @executor
                      arguments: (arguments (identifier) @argument)))))))
          (#eq? @trim "trim")
          (#eq? @trimmed @line)
          (#eq? @dispatch @helper)
          (#eq? @parameter @argument)
          (#match? @executor "child_process[_.0-9]*\\.exec"))
