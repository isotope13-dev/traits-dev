defaults:
  platforms:
  - windows
  for:
  - batch

traits:
  - id: batch-wildcard-file-enumeration-execution
    desc: Batch wildcard loop and launch-command text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bfor\s+%%[a-z]\s+in\s*\([^)]{0,20}\*\.?\*[^)]{0,20}\)\s*do\s+(start|cmd|call)\b'
