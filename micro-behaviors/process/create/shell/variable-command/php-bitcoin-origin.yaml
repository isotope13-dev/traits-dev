# The resolver's name and namespace are replaceable. Bind its Bitcoin-address
# argument to the value contributing to the shell command instead.
defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: php-bitcoin-selected-command-source
    desc: PHP command uses Bitcoin-selected call result
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: shell_exec
      arg:
        index: 0
        from:
          call: '^\\?\w+(\\\w+)*$'
          literal: '^(tb1|bc1|[13])[A-Za-z0-9]{25,90}$'
          through:
            - call: '^escapeshellarg$'
              arguments: [0]
