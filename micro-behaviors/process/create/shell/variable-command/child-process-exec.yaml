defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.93

traits:
  - id: child-process-exec-variable-command
    desc: Runs a variable command via child_process.exec
    if:
      type: symbol
      kind: call
      regex: '^(node_)?child_?process(_[0-9])?(\.default)?\.exec$'
      arg:
        index: 0
        kind: identifier
        name: cmd
