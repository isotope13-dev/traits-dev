# A shell command string that is the output of a decoder. Proven by dataflow:
# the sink's command argument comes from the decode call, not merely from the
# same file. On its own this is a capability (tools decode stored commands);
# objectives add what the decoded command does.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.9

traits:
  - id: python-decoded-shell-command
    desc: Python runs a decoded shell command
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.(system|popen)|subprocess\.[a-z_]+)$'
      arg:
        index: 0
        from:
          call: '^(base64\.[a-z0-9_]*decode|binascii\.(unhexlify|a2b_[a-z0-9]+)|bytes\.fromhex|codecs\.decode)$'
          through:
            - call: '^(zlib|gzip|bz2|lzma)\.decompress$'
              arguments: [0]
            - call: '\.decode$'
              receiver: true

  - id: js-decoded-shell-command
    desc: Node runs a decoded shell command
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^(node_)?child_?process(\.default)?\.(exec|execSync)$'
      arg:
        index: 0
        from:
          call: '^(Buffer\.from|atob)$'
          through:
            - call: '\.toString$'
              receiver: true

  - id: js-required-decoded-shell-command
    desc: Node require binding runs decoded command
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '\.exec(Sync)?$'
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?child_process$'
      arg:
        index: 0
        from:
          call: '^Buffer\.from$'
          argument: 1
          literal: '^(base64|base64url|hex)$'
          through:
            - call: '\.toString$'
              receiver: true

  - id: ruby-decoded-shell-command
    desc: Ruby system receives decoded command
    for: [ruby]
    if:
      type: symbol
      kind: call
      exact: system
      arg:
        index: 0
        from:
          call: '^(decode64|strict_decode64|urlsafe_decode64)$'

  - id: go-decoded-shell-command
    desc: Go passes decoded command to shell
    platforms: [unix]
    for: [go]
    if:
      type: symbol
      kind: call
      exact: os/exec.Command
      args:
        - index: 0
          regex: '^((/usr)?/bin/)?(sh|bash|zsh|dash)$'
        - index: 1
          exact: '-c'
        - index: 2
          from:
            call: '^encoding/(base64\.[a-zA-Z]+Encoding\.DecodeString|hex\.DecodeString)$'
            through:
              - call: '^string$'
                arguments: [0]

  - id: perl-decoded-shell-command
    desc: Perl system receives decoded command
    for: [perl]
    if:
      type: tree-sitter
      # The two statements must be adjacent and name the same scalar.
      query: |
        ((_
          (expression_statement
            (assignment_expression
              left: (variable_declaration variable: (scalar) @assigned)
              operator: "="
              right: (function_call_expression function: (function) @decode)))
          . (expression_statement
              (function_call_expression function: (function) @system
                                        arguments: (scalar) @used)))
         (#eq? @system "system")
         (#match? @decode "^(MIME::Base64::)?decode_base64$")
         (#eq? @assigned @used))

  # The decoded layer itself is Python that starts a process: the hidden code
  # an `exec`/`eval(compile(...))` wrapper would run.
  - id: encoded-python-process-call
    desc: Decoded Python code starts a process
    for: [python]
    if:
      type: encoded
      encoding: [base64, base64-obf, hex, base32, base85, xor]
      regex: '\b(os\.(system|popen)|subprocess\.[a-z_]+)\s*\('
