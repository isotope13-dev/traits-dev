# Python runs program input (input(), sys.argv, a web request) through a
# shell with subprocess(..., shell=True). Relocated from
# objectives/lateral-movement/exploit/scanner: the matcher finds a
# command-injection-prone launch shape, which ordinary CLI wrappers and
# deliberately vulnerable SAST fixtures share; it establishes no exploit or
# lateral movement. Notable capability; consumers supply any intent.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006
  crit: notable
  conf: 0.85

traits:
  - id: python-subprocess-shell-user-input
    desc: subprocess.run/call shells out user input
    if:
      type: text
      regex: subprocess\.(run|call).{0,60}shell\s*=\s*True.{0,60}(input\s*\(|sys\.argv|request\.)
  - id: python-popen-shell-user-input
    desc: subprocess.Popen shells out user input
    if:
      type: text
      regex: subprocess\.Popen.{0,60}shell\s*=\s*True.{0,60}(input\s*\(|sys\.argv|request\.)
    unless:
      - id: well-known/lib/media/skia::source-tree

