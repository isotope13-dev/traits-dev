defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: T1059.004

traits:
  - id: c-popen-variable-input
    desc: C calls popen with an identifier
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|::)popen$'
      arg:
        index: 0
        kind: identifier
  - id: c-system-identifier-input
    desc: C passes a computed identifier to system()
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '^(::)?(std::)?system$'
      arg:
        kind: identifier
composite_rules:
  - id: c-computed-command-execution
    desc: C executes a command held in a variable
    crit: notable
    any:
      - id: c-popen-variable-input
      - id: c-system-identifier-input
