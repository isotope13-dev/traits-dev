# Workflow engines commonly support explicit command nodes alongside other
# task kinds. Dispatching such a node through a shell is a neutral execution
# capability; remote-tasking intent requires independent transport evidence.
defaults:
  platforms: [windows, unix]
  for: [python, go]
  crit: notable
  conf: 0.96

composite_rules:
  - id: python-command-kind-shell-dispatch
    desc: Python command-kind branch and shell option
    for: [python]
    all:
      - id: metadata/lang/source/syntax/control-flow::python-command-kind-branch
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
    near_lines: 30
