defaults:
  platforms: [unix]
  for: [python]
traits:
  - id: python-subprocess-sh-c-runtime-command
    desc: Runs a computed string through sh -c
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'subprocess\.\w+\(\s*\[\s*["''](/bin/)?(ba)?sh["'']\s*,\s*["'']-c["'']\s*,\s*[A-Za-z_]'
  - id: python-aliased-subprocess-sh-c-runtime-command
    desc: Method runs a computed sh -c command
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\b\w+\.run\(\s*\[\s*["''](/bin/)?(ba)?sh["'']\s*,\s*["'']-c["'']\s*,\s*[A-Za-z_]'
