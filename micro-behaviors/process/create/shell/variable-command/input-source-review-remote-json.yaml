defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: json-response-reaches-shell-command
    desc: Parsed JSON contributes to shell command
    if:
      type: symbol
      kind: call
      regex: '^([\w$]+\.)?(exec|execSync)$'
      arg:
        index: 0
        from:
          call: '^JSON\.parse$'

