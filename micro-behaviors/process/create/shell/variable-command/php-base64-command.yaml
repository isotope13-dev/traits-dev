defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.97
traits:
  - id: php-base64-derived-shell-command
    desc: PHP shell command derives from Base64 decoding
    if:
      type: symbol
      kind: call
      regex: '(?i)^(system|exec|shell_exec|passthru)$'
      arg:
        index: 0
        from:
          call: '(?i)^base64_decode$'
          through:
            - call: '(?i)^(chr|ord)$'
              arguments: [0]

  - id: php-hex-derived-shell-command
    desc: PHP runs a hex-decoded shell command
    if:
      type: symbol
      kind: call
      regex: '(?i)^(system|exec|shell_exec|passthru)$'
      arg:
        index: 0
        from:
          call: '(?i)^hex2bin$'
