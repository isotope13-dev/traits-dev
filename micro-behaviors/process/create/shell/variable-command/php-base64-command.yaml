defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.97
traits:
  - id: php-base64-derived-shell-command
    desc: PHP shell command derives from Base64 decoding
    if:
      type: symbol
      kind: call
      regex: '(?i)^(system|exec|shell_exec|passthru|popen)$'
      arg:
        index: 0
        from:
          call: '(?i)^base64_decode$'
          through:
            - call: '(?i)^(chr|ord)$'
              arguments: [0]

  - id: php-hex-derived-shell-command
    desc: PHP runs a hex-decoded shell command
    if:
      type: symbol
      kind: call
      regex: '(?i)^(system|exec|shell_exec|passthru)$'
      arg:
        index: 0
        from:
          call: '(?i)^hex2bin$'

composite_rules:
  - id: php-inline-base64-shell-command
    desc: PHP passes an inline Base64-decoded value to a shell command
    crit: suspicious
    all:
      - id: php-base64-derived-shell-command
      - id: micro-behaviors/data/decode/base64/structured::php-command-argument-decode
    near_lines: 1
