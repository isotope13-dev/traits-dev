# Workflow engines commonly support explicit command nodes alongside other
# task kinds. Dispatching such a node through a shell is a neutral execution
# capability; remote-tasking intent requires independent transport evidence.
defaults:
  platforms: [windows, unix]
  for: [python, go]
  crit: notable
  conf: 0.96

traits:
  - id: go-command-kind-shell-dispatch
    desc: Go command-kind branch, exec.Command and -c text
    platforms: [unix]
    for: [go]
    if:
      type: text
      regex: '(?is)kind\s*==\s*["'']command["''][\s\S]{0,450}exec\.Command[\s\S]{0,100}["'']-c["'']'
