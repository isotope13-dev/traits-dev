defaults:
  platforms: [android, unix]
  for: [shell]
traits:
  - id: execute-temp-variable-with-arguments
    desc: Temp variable and forwarded arguments text
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '"\$tmp"\s+"\$@"'
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
