defaults:
  platforms: [windows, linux, macos]
  for: [javascript, typescript]

traits:
  - id: vscode-active-filename-concatenated-to-exec
    desc: VS Code filename concatenated into shell command
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((statement_block
          [(variable_declaration (variable_declarator name: (identifier) @filename value: (member_expression) @path))
           (lexical_declaration (variable_declarator name: (identifier) @filename value: (member_expression) @path))]
          [(variable_declaration (variable_declarator name: (identifier) @exec_binding value: (member_expression
             object: (call_expression function: (identifier) @require arguments: (arguments (string (string_fragment) @module)))
             property: (property_identifier) @method)))
           (lexical_declaration (variable_declarator name: (identifier) @exec_binding value: (member_expression
             object: (call_expression function: (identifier) @require arguments: (arguments (string (string_fragment) @module)))
             property: (property_identifier) @method)))]
          (expression_statement (call_expression function: (identifier) @call
             arguments: (arguments . (binary_expression left: (string) operator: "+" right: (identifier) @arg)))))
         (#eq? @path "vscode.window.activeTextEditor.document.fileName")
         (#eq? @require "require") (#eq? @module "child_process") (#eq? @method "exec")
         (#eq? @filename @arg) (#eq? @exec_binding @call))
