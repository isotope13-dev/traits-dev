defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.96

composite_rules:
  - id: node-dynamic-exec-input
    desc: exec receives variable or parsed JSON member
    crit: notable
    conf: 0.96
    any:
      - id: micro-behaviors/process/create/shell/variable-command::node-exec-command-variable
      - id: node-json-member-exec-context

  - id: node-json-member-exec-context
    desc: Node-importing code passes JSON member to exec
    crit: notable
    conf: 0.96
    all:
      - id: metadata/lang/source/syntax/call/member::exec-parsed-json-member
      - id: metadata/import/npm/child_process
