defaults:
  platforms: [unix, windows]
  for: [java]

traits:
  - id: java-windows-command-array-source
    desc: Java constructs Windows shell command array
    crit: notable
    conf: 0.96
    for: [jsp, java, html, javascript, python, vbs]
    if:
      type: text
      regex: 'new\s+String\s*\[\s*\]\s*\{\s*["'']cmd(\.exe)?["'']\s*,\s*["'']/c["'']'

  - id: java-posix-command-array-source
    desc: Java constructs POSIX shell command array
    crit: notable
    conf: 0.96
    for: [jsp, java, html, javascript, python, vbs]
    if:
      type: text
      regex: 'new\s+String\s*\[\s*\]\s*\{\s*["'']/bin/(ba)?sh["'']\s*,\s*["'']-c["'']'

  - id: jvm-windows-shell-name-constant
    desc: JVM Windows command shell constant
    crit: component
    conf: 0.94
    for: [class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)^cmd(\.exe)?$'

  - id: jvm-windows-shell-command-flag
    desc: JVM constant pool contains cmd command flag
    crit: component
    conf: 0.94
    for: [class]
    if:
      type: value
      path: class.strings[*]
      exact: /c

  - id: jvm-c-option-literal
    desc: JVM class contains a -c option literal
    crit: component
    conf: 0.94
    for: [class]
    if:
      type: value
      path: class.strings[*]
      exact: -c

  # Incomplete argv fragments used with an encoded shell path below.
  - id: java-char-array-argv-prefix
    desc: Numeric string constructor in argv prefix
    crit: component
    conf: 0.95
    for: [jsp, java, html, javascript, python, vbs]
    if:
      type: text
      regex: 'new\s+String\s*\[\s*\]\s*\{\s*new\s+String\s*\(\s*new\s+char\s*\[\s*\]\s*\{'

  - id: java-constructed-shell-command-flag
    desc: Command flag after constructed argv element
    crit: component
    conf: 0.9
    for: [jsp, java, html, javascript, python, vbs]
    if:
      type: text
      regex: '\}\s*\)\s*,\s*"-c"'

composite_rules:
  - id: jvm-posix-shell-command-flag
    desc: JVM class contains a POSIX shell path and -c option
    crit: component
    conf: 0.94
    for: [class]
    all:
      - id: jvm-c-option-literal
      - id: micro-behaviors/fs/path/binary::jvm-posix-shell-path-constant

  - id: java-numeric-posix-command-array-source
    desc: Java numeric character shell argv
    crit: notable
    conf: 0.96
    for: [jsp, java, html, javascript, python, vbs]
    near_bytes: 256
    all:
      - id: java-char-array-argv-prefix
      - id: java-constructed-shell-command-flag
    any:
      - id: micro-behaviors/fs/path/application/executable::decimal-posix-shell-character-array
      - id: micro-behaviors/fs/path/application/executable::hex-posix-shell-character-array
    needs: 1

  - id: jvm-windows-processbuilder-shell
    desc: JVM ProcessBuilder invokes Windows command shell
    crit: notable
    conf: 0.97
    for: [class, jar, zip]
    scope: outer
    all:
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-init-bytecode-reference
      - id: jvm-windows-shell-name-constant
      - id: jvm-windows-shell-command-flag

  - id: jvm-posix-processbuilder-shell
    desc: JVM ProcessBuilder invokes POSIX command shell
    crit: notable
    conf: 0.97
    for: [class, jar, zip]
    scope: outer
    all:
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-init-bytecode-reference
      - id: micro-behaviors/fs/path/binary::jvm-posix-shell-path-constant
      - id: jvm-posix-shell-command-flag
