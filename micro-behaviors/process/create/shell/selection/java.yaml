defaults:
  platforms: [unix, windows]
  for: [java]

traits:
  - id: java-windows-command-array-source
    desc: Java constructs Windows shell command array
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'new\s+String\s*\[\s*\]\s*\{\s*["'']cmd(\.exe)?["'']\s*,\s*["'']/c["'']'

  - id: java-posix-command-array-source
    desc: Java constructs POSIX shell command array
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'new\s+String\s*\[\s*\]\s*\{\s*["'']/bin/(ba)?sh["'']\s*,\s*["'']-c["'']'

  - id: jvm-windows-shell-name-constant
    desc: JVM Windows command shell constant
    crit: component
    conf: 0.94
    for: [class, jar, zip]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)^cmd(\.exe)?$'

  - id: jvm-windows-shell-command-flag
    desc: JVM constant pool contains cmd command flag
    crit: component
    conf: 0.94
    for: [class, jar, zip]
    if:
      type: value
      path: class.strings[*]
      exact: /c

  - id: jvm-posix-shell-path-constant
    desc: JVM constant pool contains POSIX shell path
    crit: component
    conf: 0.94
    for: [class, jar, zip]
    if:
      type: value
      path: class.strings[*]
      regex: '^/bin/(ba)?sh$'

  - id: jvm-posix-shell-command-flag
    desc: JVM constant pool contains shell command flag
    crit: component
    conf: 0.94
    for: [class, jar, zip]
    if:
      type: value
      path: class.strings[*]
      exact: -c

composite_rules:
  - id: jvm-windows-processbuilder-shell
    desc: JVM ProcessBuilder invokes Windows command shell
    crit: notable
    conf: 0.97
    for: [class, jar, zip]
    scope: outer
    all:
      - id: micro-behaviors/process/create/spawn::java-processbuilder-init-bytecode-symbol
      - id: jvm-windows-shell-name-constant
      - id: jvm-windows-shell-command-flag

  - id: jvm-posix-processbuilder-shell
    desc: JVM ProcessBuilder invokes POSIX command shell
    crit: notable
    conf: 0.97
    for: [class, jar, zip]
    scope: outer
    all:
      - id: micro-behaviors/process/create/spawn::java-processbuilder-init-bytecode-symbol
      - id: jvm-posix-shell-path-constant
      - id: jvm-posix-shell-command-flag
