# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - groovy
  platforms:
  - linux
  - macos
  - windows
  crit: notable
  conf: 0.93
traits:
- id: groovy-list-shell-execute
  desc: Launches an explicit shell command array
  if:
    type: text
    regex: \[\s*"/bin/[a-z]+"\s*,\s*"-[ic]"\s*\]\.execute\s*\(
