defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: platform-shell-path-selection
    desc: Selects shell executable by platform
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime::process-platform-content
    any:
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
      - id: micro-behaviors/fs/path/application/interpreter::powershell-executable-token
    near_bytes: 256
