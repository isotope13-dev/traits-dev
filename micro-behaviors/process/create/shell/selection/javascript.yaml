defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: platform-shell-path-selection
    desc: Selects shell executable by platform
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime::process-platform-content
      - id: micro-behaviors/process/create/shell/path::shell-executable-reference
    near_bytes: 256
