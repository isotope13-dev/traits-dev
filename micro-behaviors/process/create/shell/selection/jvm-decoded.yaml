defaults:
  platforms: [unix, windows]
  for: [class]
  crit: notable
  conf: 0.96

composite_rules:
  - id: jvm-decoded-posix-shell-command
    desc: JVM decoded byte string supplies shell argv
    all:
      - id: metadata/binary/code/bytecode::jvm-decoded-string-command-array
      - id: micro-behaviors/data/decode/hex::jvm-hex-byte-decoder-reference
      - id: micro-behaviors/fs/path/binary::jvm-posix-shell-path-constant
      - id: micro-behaviors/process/create/shell/selection::jvm-posix-shell-command-flag
