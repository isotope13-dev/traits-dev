# Generic git command invocation. Running git is a neutral version-control
# capability (build scripts, CI, dev tooling, repo-maintenance automation all
# do it). Relocated from the bogus well-known/tool/sysadmin/repo-maintenance
# "family" entry — these are not a unique tool signature. Many composites
# reference these cross-tier as benign-context (a script that runs git is
# ordinary), and the github-issue-maintenance composite below identifies a
# benign GitHub-automation script shape.
defaults:
  platforms: [unix, windows]
  for: [shell, python, ruby, javascript]
  size_min: 512
  size_max: 500000000
traits:
  - id: git-shell-command-call
    desc: Executes a Git transfer or commit command
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(exec(Sync)?|system)$'
      arg:
        kind: string
        regex: '\bgit (clone|pull|push|commit)\b'
  # Reading the configured remote URL identifies the repository (and, inside a
  # company, the internal host serving it). That is a clear, investigable read
  # rather than a universal one -- ordinary programs do not run it -- so it is
  # notable, not baseline. The file's 512-byte floor is meant for the noisier
  # generic git-verb atoms above; install hooks that grab the remote URL are
  # routinely shorter than that, so it is lifted here.
  - id: git-remote-url-capture
    desc: Reads git remote URL
    crit: notable
    conf: 0.7
    size_min: 1
    if:
      type: text
      regex: 'git\s+(remote\s+(get-url|-v)|config\s+--get\b[^\n]{0,40}\.url|ls-remote\s+--get-url)'
    unless:
      - type: text
        substr: 'insteadOf'
  # Jake accepts arrays of shell commands. Argument provenance does not
  # project these elements as scalar strings, so match the array's structure.
  - id: jake-git-command-array
    desc: Jake executes a Git command array
    crit: notable
    for: [javascript]
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression
            object: (identifier) @receiver
            property: (property_identifier) @method)
          arguments: (arguments
            (array (string (string_fragment) @command)))) @call
          (#eq? @receiver "jake")
          (#eq? @method "exec")
          (#match? @command "\\bgit (clone|pull|push|commit)\\b"))
composite_rules:
  - id: git-operations-1
    desc: Executes a Git transfer or commit command
    crit: notable
    any:
      - id: git-shell-command-call
      - id: jake-git-command-array
  - id: github-issue-maintenance
    desc: GitHub issue maintenance script
    crit: notable
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/services/github::gh-repository-workflow-command
    any:
      - id: micro-behaviors/process/create/unix-utils::jq-processing
      - id: micro-behaviors/process/create/unix-utils::sed-processing
      - id: micro-behaviors/process/create/unix-utils::awk-processing
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
