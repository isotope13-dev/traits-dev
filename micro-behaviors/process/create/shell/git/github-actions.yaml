defaults:
  platforms: [unix, windows]
  for: [github-actions]
  crit: notable

traits:
  - id: github-actions-git-tag
    desc: GitHub Actions creates a git tag
    conf: 0.9
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?im)(^|[;&|]\s*)git\s+tag(\s|$)'
  - id: github-actions-git-push
    desc: GitHub Actions pushes a git ref
    conf: 0.9
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?im)(^|[;&|]\s*)git\s+push(\s|$)'

composite_rules:
  - id: github-actions-git-tag-and-push
    desc: GitHub Actions creates and pushes a tag
    conf: 0.94
    all:
      - id: github-actions-git-tag
      - id: github-actions-git-push
