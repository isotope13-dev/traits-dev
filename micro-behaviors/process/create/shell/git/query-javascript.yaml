defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, linux, macos]
  for:
    - javascript
traits:
  - id: git-rev-parse-head
    desc: Queries current git commit hash
    if:
      type: symbol
      kind: call
      regex: '(^|\.)exec(Sync)?$'
      arg:
        kind: string
        substr: git rev-parse HEAD
  - id: git-rev-parse-dir
    desc: Queries Git repository directory
    if:
      type: symbol
      kind: call
      regex: '(^|\.)exec(Sync)?$'
      arg:
        kind: string
        substr: git rev-parse --git-dir
