defaults:
  for: [oledoc, ooxml]
  platforms: [windows, macos]
traits:
  - id: powershell-encoded-flag-junked
    desc: PowerShell encoded flag with junk
    crit: suspicious
    conf: 0.86
    unless:
      - id: well-known/tool/detection/
    if:
      type: text
      regex: (?i)(powershell|pwsh).{0,40}-(enc|encodedcommand)
