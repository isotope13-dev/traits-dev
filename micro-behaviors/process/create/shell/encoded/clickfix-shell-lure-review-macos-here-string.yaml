defaults:
  platforms: [macos]
  for: [shell, html, javascript, markdown]


traits:
  - id: shell-herestring-echo-cmdsubst
    desc: Shell here-string from echo or printf
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?i)\b(ba)?sh\s*<<<\s*\$\(\s*(echo|printf)\b'

composite_rules:
  - id: shell-herestring-base64-decode
    desc: Shell here-string and Base64 decoding clues
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/process/create/shell/encoded::shell-herestring-echo-cmdsubst
    any:
      - id: micro-behaviors/data/decode/base64::base64-decode-command-option
      - id: micro-behaviors/data/decode/base64::base64-decode-command
    near_bytes: 800
