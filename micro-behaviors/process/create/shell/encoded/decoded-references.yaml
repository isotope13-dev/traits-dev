traits:
- id: decoded-curl-command
  desc: Base64 curl command text
  if:
    type: encoded
    encoding: base64
    regex: (?im)(^|[;&|])\s*(/(usr/)?(bin|local/bin)/)?curl\b
    not:
    - regex: (?m)^#{1,6}\s
    - regex: '```'
  unless:
  - id: well-known/tool/detection/
  - id: well-known/tool/offensive/projectdiscovery/
  - id: well-known/app/system/mtrinistudio::mtrini-template-context
  - id: well-known/app/system/mtrinistudio/
  - id: metadata/path::openshift-release-ci-step-context
  - id: metadata/package/testing/presence/harness::test-directory
  - id: well-known/tool/detection/innerwarden::innerwarden-defensive-tool-context
  for:
  - python
  - shell
  - elf
  - macho
  - pe
  - text
- id: decoded-wget-command
  desc: Base64 wget command text
  if:
    type: encoded
    encoding: base64
    regex: (?im)(^|[;&|])\s*(/(usr/)?(bin|local/bin)/)?wget\b
  unless:
  - id: well-known/tool/offensive/projectdiscovery/
  - id: well-known/tool/detection/llm-scanner::mvar-security-context
  - id: well-known/app/system/mtrinistudio::mtrini-template-context
  - id: well-known/app/system/mtrinistudio::mtrini-wheel-basename
  - id: well-known/app/system/mtrinistudio::mtrini-template-module
  for:
  - python
  - shell
  - elf
  - macho
  - pe
  - text
- id: decoded-powershell-download-command
  desc: Base64 PowerShell HTTP command text
  if:
    type: encoded
    encoding: base64
    regex: (?im)(^|[;&])\s*(Invoke-WebRequest|iwr)\b
  unless:
  - id: well-known/tool/offensive/projectdiscovery/
  - id: well-known/tool/detection/llm-scanner::mvar-security-context
  - id: well-known/app/system/mtrinistudio::mtrini-template-context
  - id: well-known/app/system/mtrinistudio::mtrini-wheel-basename
  - id: well-known/app/system/mtrinistudio::mtrini-template-module
  for:
  - python
  - shell
  - elf
  - macho
  - pe
- id: decoded-relative-command-text
  desc: Base64 relative executable command text
  for:
  - python
  - shell
  - text
  if:
    type: encoded
    encoding: base64
    regex: (?im)(^|[;&|])\s*\./[A-Za-z0-9._$-]{1,80}(\s|[;&|]|$)
  unless:
  - id: well-known/tool/offensive/projectdiscovery/
  - id: well-known/app/system/mtrinistudio::mtrini-template-context
  - id: well-known/app/system/mtrinistudio::mtrini-wheel-basename
  - id: well-known/app/system/mtrinistudio::mtrini-template-module
- id: decoded-shell-pipeline-text
  desc: Base64 shell pipeline text
  if:
    type: encoded
    encoding: base64
    regex: \|\s*(shell|sh|zsh)\b
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/innerwarden::innerwarden-defensive-tool-context
  - id: metadata/path::test-directory-component
  for:
  - python
  - shell
  - elf
  - macho
  - pe
- id: decoded-interpreter-pipeline-text
  desc: Base64 interpreter pipeline text
  if:
    type: encoded
    encoding: base64
    regex: \|\s*(python|perl|ruby)\b
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/offensive/projectdiscovery/
  - id: metadata/path::test-directory-component
  for:
  - python
  - shell
  - elf
  - macho
  - pe
defaults:
  platforms:
  - linux
  - macos
  - windows
  crit: notable
  conf: 0.95
