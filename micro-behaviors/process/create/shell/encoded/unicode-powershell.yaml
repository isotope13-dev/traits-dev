defaults:
  platforms: [windows]
  for: [javascript, html, vbs]
  attack: T1059.001

traits:
  - id: unicode-delimited-powershell-prefix
    desc: Unicode-delimited PowerShell pow fragment
    crit: component
    conf: 0.94
    if:
      type: text
      # Mixed delimiters can contain ASCII letters among non-ASCII glyphs.
      # Require each delimiter gap to begin with a non-ASCII character.
      regex: '(?i)p\P{ASCII}[\P{ASCII}A-Za-z]{7,23}o\P{ASCII}[\P{ASCII}A-Za-z]{7,23}w'
  - id: unicode-delimited-powershell-suffix
    desc: Unicode-delimited PowerShell she fragment
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)s\P{ASCII}[\P{ASCII}A-Za-z]{7,23}h\P{ASCII}[\P{ASCII}A-Za-z]{7,23}e'
  - id: unicode-delimited-powershell-tail
    desc: Unicode-delimited PowerShell ell fragment
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)e\P{ASCII}[\P{ASCII}A-Za-z]{7,23}l\P{ASCII}[\P{ASCII}A-Za-z]{7,23}l'

composite_rules:
  - id: unicode-delimited-powershell-command
    desc: Unicode-delimited PowerShell command
    crit: notable
    conf: 0.96
    # Long multi-script delimiters can occupy hundreds of UTF-8 bytes while
    # still separating adjacent letters in the same PowerShell token.
    near_bytes: 1024
    all:
      - id: unicode-delimited-powershell-prefix
      - id: unicode-delimited-powershell-suffix
      - id: unicode-delimited-powershell-tail
