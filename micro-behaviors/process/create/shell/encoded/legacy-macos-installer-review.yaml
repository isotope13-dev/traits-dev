defaults:
  platforms:
  - macos
composite_rules:
- id: base64-osascript-prefix-shell-command
  desc: Base64 osascript prefix with shell decode and command execution
  crit: suspicious
  conf: 0.97
  for:
  - shell
  all:
  - id: metadata/file/profile/encoding/composition::base64-osascript-on-run-prefix
  - id: micro-behaviors/process/create/shell/command-string::shell-direct-sh-c
  any:
  - id: micro-behaviors/data/decode/command::base64-decode-command
