# Reports the supported capability or configuration without inferring hostile intent.
defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
composite_rules:
- id: base64-input-shell-execution
  desc: Base64 input and shell-pipeline syntax appear nearby
  crit: notable
  conf: 0.9
  for:
  - shell
  - applescript
  - text
  - python
  all:
  - id: micro-behaviors/data/decode/base64::base64-pipeline-input
  near_bytes: 256
  any:
  - id: metadata/lang/source/syntax/command/pipeline::base64-decode-shell-stdin
  - id: micro-behaviors/process/create/shell/pipeline::decode-pipe-env-shell
