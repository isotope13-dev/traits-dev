defaults:
  for: [powershell]
  platforms: [windows]
traits:
  - id: encodedcommand-exec-js
    desc: JavaScript exec calls PowerShell EncodedCommand
    crit: notable
    conf: 0.9
    attack: T1059.001
    platforms: [unix, windows]
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        kind: string
        substr: powershell -enc
    unless:
      - id: well-known/lib/runtime/scripted/sindresorhus-open::sindresorhus-open-library
