defaults:
  for: [javascript, typescript]
  platforms: [linux, macos, windows]

traits:
  - id: electron-ipc-near-exec
    desc: Electron IPC handler near exec call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'ipcMain\.handle\s*\([\s\S]{0,350}\bexec\s*\('

composite_rules:
  - id: electron-ipc-shell-execution
    desc: Electron IPC handler near child-process execution
    crit: suspicious
    conf: 0.88
    all:
      - id: electron-ipc-near-exec
      - id: metadata/import/builtin::child-process-module-reference
