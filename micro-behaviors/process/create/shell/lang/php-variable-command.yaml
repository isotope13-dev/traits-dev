  - id: micro-behaviors/process/create/shell/lang::exec-variable-argument-system
  - id: micro-behaviors/process/create/shell/lang::exec-variable-argument-shell
  - id: micro-behaviors/process/create/shell/lang::exec-variable-argument-passthru
  - id: micro-behaviors/process/create/shell/lang::exec-variable-argument-popen
  - id: micro-behaviors/process/create/shell/lang::php-exec-concatenated-variable-command
