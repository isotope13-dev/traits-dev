defaults:
  platforms: [unix, windows]
  for: [php]
  crit: suspicious
  conf: 0.98

traits:
  - id: php-request-assigned-command-branch
    desc: Request-assigned variable reaches command branch
    # Only echo statements may intervene: no reassignment or sanitizer call.
    # Capture equality binds the request destination to the command argument.
    if:
      type: tree-sitter
      language: php
      query: |
        ((compound_statement
          (expression_statement (assignment_expression
            left: (variable_name) @bound
            right: (subscript_expression (variable_name) @source)))
          . (echo_statement [(string) (encapsed_string (string_content))])*
          . (if_statement
            condition: (parenthesized_expression (function_call_expression
              function: (name) @probe
              arguments: (arguments . (argument (string (string_content) @api)) .)))
            body: (compound_statement
            (expression_statement (function_call_expression
              function: (name) @sink
              arguments: (arguments . (argument (variable_name) @used) .))))))
          (#match? @source "^\\$_(GET|POST|REQUEST)$")
          (#match? @sink "^(system|exec|passthru|shell_exec)$")
          (#eq? @probe "function_exists")
          (#eq? @api @sink)
          (#eq? @bound @used))
