defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for:
    - ruby
traits:
  - id: ruby-exec
    desc: exec() replaces current process
    conf: 0.95
    if:
      # A member named `exec` is common in protocol libraries (for example
      # Net::HTTP request objects). Match actual Ruby process-replacement
      # calls, including Kernel: semicolons in quoted examples are not calls.
      type: tree-sitter
      query: |
        (call !receiver method: (identifier) @method
          (#eq? @method "exec"))
        (call receiver: (constant) @receiver method: (identifier) @method
          (#match? @receiver "^(Kernel|Process)$")
          (#eq? @method "exec"))
    # Database drivers (ruby-pg) expose Connection#exec for SQL — those are
    # not process replacement. Exclude common SQL statement forms.
    not:
      - regex: '\bexec\s*[\(\s]["'']?\s*(BEGIN|COMMIT|ROLLBACK)\b'
      - regex: '\bexec\s*[\(\s]["'']?\s*(SELECT|INSERT|UPDATE|DELETE)\b'
      - regex: '\bexec\s*[\(\s]["'']?\s*(CREATE|DROP|ALTER|TRUNCATE)\b'
      - regex: '\bexec\s*[\(\s]["'']?\s*(SHOW|SET|WITH|COPY)\b'
      - regex: '\bexec\s*\(\s*sql\b'
  - id: ruby-system-download-command
    desc: Ruby system downloader command
    conf: 0.86
    if:
      type: text
      regex: '\bsystem\s*\(.{0,80}(curl|wget)\b'
  - id: ruby-system-shell-interpreter
    desc: Ruby system shell interpreter
    conf: 0.86
    if:
      # Ruby calls `system` with and without parentheses, and the paren-less
      # `system "sh installer.sh"` form is the more common of the two. The
      # opening paren or quote is what keeps prose ("the system shell") out.
      type: text
      regex: '\bsystem\s*[("''].{0,80}(\bsh\b|bash|zsh|shell)'
  - id: ruby-popen
    desc: popen pipes to/from command
    conf: 0.92
    if:
      # Migrated from a tree-sitter query to a `kind: call` match on
      # the pre-extracted call fact (no per-member cursor walk).
      type: symbol
      kind: call
      exact: 'popen'
  - id: ruby-subshell-command
    desc: Ruby subshell command execution
    conf: 0.93
    if:
      # Ruby's tree-sitter grammar emits both backtick and `%x` command
      # substitutions as `subshell` nodes. The symbol projection does not
      # expose these nodes, so matching it silently missed real execution.
      type: tree-sitter
      query: '(subshell) @command'
      language: ruby
  - id: ruby-backtick-command-substitution
    desc: Executes a command with Ruby backticks
    conf: 0.88
    if:
      type: text
      regex: '(?m)^\s{0,40}[A-Za-z_][A-Za-z0-9_]{0,40}\s*=\s*`.{1,160}`'
  - id: ruby-kubectl-command-substitution
    desc: Ruby command substitution invokes kubectl
    conf: 0.95
    if:
      type: text
      regex: '`[^`\n]{0,120}\bkubectl\b[^`\n]{0,180}`'
  - id: ruby-shell-exec
    desc: Shell execution via exec
    conf: 0.85
    if:
      type: string_literal
      regex: exec.{0,50}bin/sh|exec.{0,50}bin/shell
composite_rules:
  - id: ruby-shell-exec-imports
    desc: Ruby shell command execution pattern
    conf: 0.7
    any:
      - id: micro-behaviors/process/create/shell/open3::capture-command
      - id: micro-behaviors/process/create/system::system-process-call
      - id: ruby-subshell-command
      - id: ruby-popen
  - id: ruby-system-shell-command
    desc: Ruby system shell command
    conf: 0.86
    any:
      - id: ruby-system-download-command
      - id: ruby-system-shell-interpreter
