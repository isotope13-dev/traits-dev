defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  # Adjacency and capture equality prevent an intervening sanitizer,
  # reassignment, or unrelated request read from supplying the command.
  - id: php-request-default-to-echoed-shell
    desc: Request variable feeds echoed shell command
    crit: suspicious
    conf: 0.99
    attack: T1505.003
    mbc: B0030
    if:
      type: tree-sitter
      language: php
      query: |
        ((program
          (expression_statement (assignment_expression
            left: (variable_name) @bound
            right: (binary_expression
              left: (subscript_expression (variable_name) @source)
              operator: "??"
              right: (string))))
          . (echo_statement (function_call_expression
            function: (name) @sink
            arguments: (arguments . (argument (binary_expression
              left: (variable_name) @used
              operator: "."
              right: (string (string_content) @redirect))) .))))
          (#match? @source "^\\$_(GET|POST|REQUEST)$")
          (#eq? @sink "shell_exec")
          (#eq? @redirect " 2>&1")
          (#eq? @bound @used))
