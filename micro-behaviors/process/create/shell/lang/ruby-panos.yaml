defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-open3-bash-c-command
    desc: Invokes bash command through Open3
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (call receiver: (constant) @owner method: (identifier) @method
          arguments: (argument_list (string (string_content) @shell)
            (string (string_content) @flag) (_))
          (#eq? @owner "Open3") (#match? @method "^capture[23e]+$")
          (#match? @shell "^(/bin/)?bash$") (#eq? @flag "-c"))
composite_rules:
  - id: ruby-hex-decoder-with-bash-command
    desc: Hex decoder accompanies bash command execution
    crit: suspicious
    conf: 0.94
    all:
      - id: ruby-open3-bash-c-command
      - id: micro-behaviors/data/string/assembly::ruby-hex-pack-decode
