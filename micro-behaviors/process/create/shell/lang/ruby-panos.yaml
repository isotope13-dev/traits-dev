defaults:
  platforms: [panos, appliance, unix]
  for: [ruby]
traits:
  - id: ruby-panos-open3-bash-c
    desc: Ruby Open3 bash command invocation
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: Open3.capture3("bash", "-c", cmd)
composite_rules:
  - id: ruby-panos-assembled-bash-exec
    desc: Ruby fragment assembly and bash call
    crit: suspicious
    conf: 0.98
    all:
      - id: ruby-panos-open3-bash-c
      - id: micro-behaviors/data/string/assembly::ruby-panos-assembled-frags-command
