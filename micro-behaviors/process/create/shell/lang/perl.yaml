defaults:
  crit: notable
  for: [perl]
  platforms: [unix]
traits:
  - id: backticks-exec
    desc: Perl backticks command execution
    conf: 0.85
    attack: "T1059.006"
    if:
      type: text
      regex: '`[^`\n]{1,160}(2>&1|3>&1|uname -a|echo)[^`\n]{0,80}`'
    not:
      - substr: "$CROSS_COMPILE"
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/file/format/
      - type: text
        substr: "xcrun --sdk macosx --show-sdk-path"
      - type: text
        substr: "cxxfilt --version 2>&1"
      - type: text
        substr: "NginxBinary -V 2>&1"
      - type: text
        substr: "$NGINX -V 2>&1"
  - id: perl-exec-variable
    desc: Execs a command from a variable
    conf: 0.9
    platforms: [unix, windows]
    if:
      type: text
      regex: '\bexec\s+\$[A-Za-z_]\w*'
    unless:
      - id: metadata/package/testing/presence/harness::perl-test-file
