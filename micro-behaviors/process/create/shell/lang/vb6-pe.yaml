defaults:
  for:
    - pe
  platforms:
    - windows
traits:
  - id: vb6-rtcshell
    desc: VB6 rtcShell command execution
    crit: notable
    conf: 0.95
    attack: T1059
    mbc: E1059
    if:
      type: symbol
      exact: rtcShell

composite_rules:
  - id: vb6-shell-execution
    desc: VB6 shell execution primitive
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/dylib/load/runtime::vb6-runtime-dll-reference
    any:
      - id: vb6-rtcshell
      - id: metadata/binary/symbols/imports::ordinal-import-600
