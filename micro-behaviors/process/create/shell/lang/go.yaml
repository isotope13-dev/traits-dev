defaults:
  platforms:
  - linux
  - macos
  - windows
  for: [go, elf, macho, pe]
  crit: notable
  conf: 0.7
traits:
- id: go-exec-command-bin-sh
  desc: Go exec.Command shell invocation
  conf: 0.93
  for: [go]
  if:
    type: text
    # `sh -c` is a command-string wrapper (any-shell-exec / sh-c-exec), not a
    # direct shell-binary spawn. IMAP ProxyCommand-style tunnels use that form.
    regex: 'exec\.Command\s*\(\s*"(/bin/)?(ba)?sh"\s*(,\s*"-i")?\s*\)'
- id: exec-cmd-start
  desc: exec.(*Cmd).Start reference
  conf: 0.4
  if:
    type: symbol
    regex: (^|/)exec\.\(\*Cmd\)\.Start$
- id: io-pipe
  desc: io.(*pipe).CloseWrite reference
  conf: 0.55
  if:
    type: symbol
    exact: io.(*pipe).CloseWrite
- id: exec-cmd-run
  desc: exec.(*Cmd).Run reference
  conf: 0.4
  if:
    type: symbol
    exact: exec.(*Cmd).Run
- id: stdin-pipe
  desc: Go StdinPipe child input
  conf: 0.5
  for: [go]
  if:
    type: symbol
    kind: call
    regex: '(^|\.)StdinPipe$'
- id: stdout-pipe
  desc: Go StdoutPipe child output
  conf: 0.4
  for: [go]
  if:
    type: symbol
    kind: call
    regex: '(^|\.)StdoutPipe$'
- id: stderr-pipe
  desc: Go StderrPipe child error
  conf: 0.4
  for: [go]
  if:
    type: symbol
    kind: call
    regex: '(^|\.)StderrPipe$'
- id: stdio-redirect
  desc: Configures child-process standard I/O
  conf: 0.6
  for: [go]
  if:
    type: tree-sitter
    kind: assignment
    regex: 'Std(in|out|err)\s*='
- id: shell-fallback-paths--rx-1
  desc: Regex component marker
  crit: component
  conf: 0.86
  if:
    type: text
    regex: /bin/(zsh|ksh).{0,24}/bin/(zsh|ksh|csh)
  count_max: 1004456
- id: shell-fallback-paths--rx-2
  desc: Regex component marker
  crit: component
  conf: 0.86
  if:
    type: text
    regex: /bin/(csh).{0,24}/bin/(zsh|ksh|csh)
  count_max: 1004457
composite_rules:
- id: stdio-or-pipe-redirection
  desc: Configures Go child-process standard I/O or pipe handling
  any:
  - id: stdin-pipe
  - id: stdout-pipe
  - id: stderr-pipe
  - id: stdio-redirect
- id: go-piped-shell-wrapper
  desc: Go decoder piped into shell
  crit: suspicious
  conf: 0.92
  all:
  - id: exec-cmd-start
  - id: io-pipe
  - id: stdio-or-pipe-redirection
  - id: shell-fallback-paths
- id: shell-fallback-paths
  desc: Multiple shell fallback paths
  crit: component
  conf: 0.86
  any:
  - id: shell-fallback-paths--rx-1
  - id: shell-fallback-paths--rx-2
