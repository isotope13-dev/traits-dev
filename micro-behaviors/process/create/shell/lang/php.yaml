# PHP Command Execution Traits
# MBC: E1059 (Command and Scripting Interpreter)
# ATT&CK: T1059.004 (Unix Shell)
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  mbc: "E1059"
  attack: "T1059.004"
traits:
- id: php-exec-concatenated-variable-command
  desc: PHP exec command concatenates a variable
  conf: 0.93
  if:
    type: tree-sitter
    query: |
      ((function_call_expression
        function: (name) @callee
        arguments: (arguments
          . (argument (binary_expression
            left: (variable_name)
            operator: ".")))) @call
        (#eq? @callee "exec"))

- id: proc-open-shell-command
  desc: PHP proc_open invokes a shell
  conf: 0.93
  if:
    type: text
    regex: 'proc_open\s*\(\s*"/bin/(ba)?sh'
- id: popen
  desc: Process open via popen()
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: "popen"

- id: pcntl-exec
  desc: Direct process execution via pcntl_exec()
  conf: 0.95
  attack: "T1059"
  if:
    type: symbol
    kind: call
    exact: "pcntl_exec"

- id: backtick
  desc: Shell command execution via backticks
  conf: 0.9
  size_max: 500000
  if:
    type: tree-sitter
    node: shell_command_expression
    regex: ".{1,120}"
  unless:
  # Gherkin uses backticks to delimit command text; they are not PHP shell
  # command expressions even when content-based detection selects PHP.
  - id: metadata/package/testing/presence/path::gherkin-feature-file
  # The opaque compiler-halt tail is not PHP syntax. Tree-sitter can expose
  # byte sequences in that tail as shell-command nodes, so do not report those
  # parser artifacts as PHP backtick execution.
  - id: micro-behaviors/fs/read/self::compiler-halt-self-read
  - type: text
    regex: '`\(doom/[A-Za-z0-9_-]+\)`'
  # A Markdown file sniffed as PHP parses its inline code spans as shell
  # command expressions; they are formatting, not PHP execution.
  - id: metadata/file/extension/identity::markdown-file-basename

- id: exec-variable-argument-exec
  desc: exec() receives variable argument
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: exec
    arg:
      index: 0
      kind: identifier
  unless:
  - id: well-known/lib/development/php-cs-fixer::php-cs-fixer-source-tree
  - id: well-known/lib/development/php-cs-fixer::php-cs-fixer-config-file
- id: exec-variable-argument-system
  desc: system() receives variable argument
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: system
    arg:
      index: 0
      kind: identifier
  unless:
  - id: well-known/lib/development/php-cs-fixer::php-cs-fixer-source-tree
  - id: well-known/lib/development/php-cs-fixer::php-cs-fixer-config-file
- id: exec-variable-argument-shell
  desc: shell_exec() receives variable argument
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: shell_exec
    arg:
      index: 0
      kind: identifier
- id: exec-variable-argument-passthru
  desc: passthru() receives variable argument
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: passthru
    arg:
      index: 0
      kind: identifier
- id: exec-variable-argument-popen
  desc: popen() receives variable argument
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: popen
    arg:
      index: 0
      kind: identifier
- id: shell-stderr-redirect
  desc: Shell stderr redirected to stdout
  conf: 0.85
  if:
    type: string_literal
    exact: ' 2>&1'
- id: php-stdio-pipe-pair
  desc: Declares read and write pipes
  conf: 0.88
  if:
    type: text
    regex: '"pipe"\s*,\s*"r".{0,80}"pipe"\s*,\s*"w"'

composite_rules:
- id: php-piped-proc-open-runner
  desc: proc_open pipes input and output
  crit: suspicious
  conf: 0.93
  near_lines: 25
  all:
  - id: micro-behaviors/process/create/subprocess::proc-open
  - id: php-stdio-pipe-pair
  - id: micro-behaviors/fs/read/stream::php-fread-indexed-resource
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
