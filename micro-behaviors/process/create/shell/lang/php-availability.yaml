defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
- id: shell-exec-availability-check
  desc: Checks PHP shell_exec availability
  if:
    type: tree-sitter
    kind: call
    regex: '\b(function_exists|is_callable)\s*\(\s*["'']shell_exec["'']'
- id: system-passthru-availability-check
  desc: Checks PHP system or passthru availability
  if:
    type: tree-sitter
    kind: call
    regex: '\b(function_exists|is_callable)\s*\(\s*["''](system|passthru)["'']'
- id: proc-open-popen-availability-check
  desc: Checks PHP proc_open or popen availability
  if:
    type: tree-sitter
    kind: call
    regex: '\b(function_exists|is_callable)\s*\(\s*["''](proc_open|popen)["'']'
- id: exec-name-list-proc
  desc: Names proc_open or popen in quotes
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '[''"](proc_open|popen)[''"]'
- id: exec-name-list-shell
  desc: Names shell_exec or system in quotes
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '[''"](shell_exec|system)[''"]'
- id: exec-name-list-exec
  desc: Names exec or passthru in quotes
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '[''"](exec|passthru)[''"]'
composite_rules:
- id: php-execution-function-availability
  desc: Checks PHP execution function availability
  crit: notable
  conf: 1.0
  any:
  - id: shell-exec-availability-check
  - id: system-passthru-availability-check
  - id: proc-open-popen-availability-check
- id: exec-function-name-list
  desc: Lists PHP execution function names
  crit: notable
  conf: 0.9
  # Two or more quoted shell-execution builtin names from different pairs.
  # Webshells iterate such a list with function_exists($fn) to pick whatever
  # survived disable_functions; the literal-quoted atoms above miss that loop
  # shape entirely. needs: 2 over pairs (not a count on one alternation) so a
  # repeated single name cannot satisfy the list.
  any:
  - id: exec-name-list-proc
  - id: exec-name-list-shell
  - id: exec-name-list-exec
  needs: 2
- id: php-loop-execution-availability-probe
  desc: Probes execution functions from a name list
  crit: notable
  conf: 0.93
  all:
  - id: exec-function-name-list
  - id: micro-behaviors/metaprogramming/reflection::php-dynamic-callable-check
- id: php-multiple-execution-availability-checks
  desc: Checks availability of multiple PHP execution APIs
  crit: notable
  conf: 0.95
  needs: 2
  near_bytes: 512
  any:
  - id: micro-behaviors/process/create/shell/lang::shell-exec-availability-check
  - id: micro-behaviors/process/create/shell/lang::system-passthru-availability-check
  - id: micro-behaviors/process/create/shell/lang::proc-open-popen-availability-check
  unless:
  - id: well-known/app/publishing/wordpress-plugins/catalog::known-wordpress-plugin
