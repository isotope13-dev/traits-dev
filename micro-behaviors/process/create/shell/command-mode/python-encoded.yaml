defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: encoded-python-os-system
    desc: Encoded Python os.system call
    crit: notable
    conf: 0.95
    for:
    - python
    - shell
    if:
      type: encoded
      # unicode-escape is omitted: one `\uXXXX` decodes the whole file, so a
      # JavaScript security reminder that quotes os.system() is not a payload.
      encoding:
      - base64
      - base64-obf
      - hex
      - xor
      - stack
      - wide
      regex: os\.system\s*\(
      not:
      - regex: (?i)\b(blocks|disallows|replaces)\b.{0,40}\bos\.system
    attack: T1059.006
    unless:
    - id: metadata/package/testing/corpus/
    - id: metadata/path::test-directory-component
    - id: "metadata/lang/source/shape::large-unparsed-source-corpus"
    - id: well-known/tool/detection/agent-audit-kit::scanner-context
