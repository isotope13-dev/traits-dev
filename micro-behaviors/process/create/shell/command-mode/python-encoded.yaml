defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: encoded-python-os-system
    desc: Encoded Python os.system call
    crit: notable
    conf: 0.95
    for:
    - python
    - shell
    if:
      type: encoded
      regex: os\.system\s*\(
      not:
      - regex: (?i)\b(blocks|disallows|replaces)\b.{0,40}\bos\.system
    attack: T1059.006
    unless:
    - id: metadata/package/testing/corpus/
    - id: "metadata/file/naming::test-directory-component"
    - id: metadata/lang/source::large-unparsed-source-corpus
    - id: well-known/tool/detection/agent-audit-kit::scanner-context
