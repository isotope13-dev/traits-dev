defaults:
  platforms: [windows]

traits:
  - id: micro-behaviors/process/create/shell/command-mode::batch-starts-lua-script
    desc: Batch launches Lua script or data file
    crit: notable
    conf: 0.95
    for: [batch]
    if:
      type: text
      regex: '(?i)\bstart\s+lua(jit|5[0-9])?\.exe\s+\S{1,80}\.(txt|lua|dat)\b'

  # The launcher renames the interpreter per build (`boot.exe`, `run.exe`),
  # so the interpreter basename cannot gate this; what stays constant is a
  # bundled EXE being handed a data-looking file as its only argument.

composite_rules:
  - id: micro-behaviors/process/create/shell/command-mode::archive-batch-starts-lua-script
    desc: Archive batch launches Lua data file
    crit: notable
    conf: 0.98
    scope: archive
    for: [zip, batch, text]
    all:
      - id: metadata/package/files/archive-member::archive-lua-interpreter-exe-name
      - id: metadata/file/archive::archive-bat-member
      - id: metadata/package/files/archive-member::archive-member-text-like-name
      - id: micro-behaviors/process/create/shell/command-mode::batch-starts-lua-script

