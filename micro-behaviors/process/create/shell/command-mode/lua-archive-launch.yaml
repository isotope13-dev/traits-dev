defaults:
  platforms:
  - windows
  crit: notable
traits:
- id: micro-behaviors/process/create/shell/command-mode::batch-starts-lua-script
  desc: Batch launches Lua script or data file
  conf: 0.95
  for:
  - batch
  if:
    type: text
    regex: (?im)^\s*start\s+lua(jit|5[0-9])?(\.exe)?\s+\S[^\r\n]{0,119}$
composite_rules:
- id: micro-behaviors/process/create/shell/command-mode::archive-batch-starts-lua-script
  desc: Archive batch launches Lua data file
  conf: 0.98
  scope: archive
  for:
  - zip
  - batch
  - text
  all:
  - id: metadata/archive/member/filename::archive-lua-interpreter-exe-name
  - id: metadata/archive/member/extension::archive-bat-member
  - id: metadata/archive/member/extension::archive-member-text-like-name
  - id: micro-behaviors/process/create/shell/command-mode::batch-starts-lua-script
