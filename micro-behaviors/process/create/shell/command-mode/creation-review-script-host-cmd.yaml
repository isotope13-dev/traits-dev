defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, scripts, rust]
traits:
- id: cmd-exe-s-command-source
  desc: C source embeds cmd.exe /S /C
  conf: 0.9
  for: [c, cpp]
  if:
    type: literal
    kind: string
    regex: '(?i)cmd\.exe\s+/S\s+/C'


- id: cmd-exe-c-start-launch
  desc: cmd.exe /c start command text
  conf: 0.88
  attack: "T1059.003"
  # Unix-like shells on Windows can invoke cmd.exe with a quoted command.
  platforms: [unix, windows]
  unless:
    - id: metadata/file/format/log::windows-event-csv-records
  if:
    type: text
    regex: '(?i)\bcmd(\.exe)?\s+/c\s+["'']?start\b'

- id: node-visible-cmd-start-window
  desc: cmd spawn text with a visible-window option
  conf: 0.94
  for: [javascript, typescript]
  if:
    type: text
    regex: 'spawn\s*\(\s*["'']cmd\.exe["''][\s\S]{0,260}["'']/c["''][\s\S]{0,260}windowsHide\s*:\s*false'
