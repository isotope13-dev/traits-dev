defaults:
  crit: notable
  platforms: [unix, windows]
  for: [php]
  attack: T1059
traits:
  - id: php-exec
    desc: PHP exec() function call
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: exec
  - id: php-shell-exec
    desc: PHP shell_exec() function call
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: shell_exec
  - id: php-passthru
    desc: PHP passthru() function call
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: passthru
