defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
traits:
  - id: batch-absolute-executable-command
    desc: Batch invokes an absolute executable path
    conf: 0.94
    if:
      type: text
      regex: '(?im)^\s*(call\s+)?"?[A-Za-z]:\\.{1,180}\.(exe|com)"?(\s+.{1,160})?\s*$'

  - id: start-unquoted-executable-command
    desc: START command names an executable target
    conf: 0.92
    attack: T1059.003
    if:
      type: text
      # A window title (`start "Setup" x.exe`), switches (`start /min`) and
      # paths with spaces all precede the image name.
      regex: '(?i)\bstart\s+("[^"]{0,64}"\s+)?(/\w+\s+){0,4}[\w\\:.-]{1,160}\.exe\b'

  - id: start-empty-window-title
    desc: START command specifies an empty window title
    conf: 0.9
    if:
      type: text
      substr: 'start ""'
  - id: start-quoted-executable-command
    desc: START command names a quoted executable
    conf: 0.92
    attack: T1059.003
    if:
      type: text
      regex: '(?i)\bstart\s+("[^"\r\n]{0,64}"\s+)?(/\w+\s+){0,4}"[^"\r\n]{1,160}\.exe"'
composite_rules:
  - id: start-executable-command
    desc: START command names an executable target
    conf: 0.92
    any:
      - id: start-unquoted-executable-command
      - id: start-quoted-executable-command
  # A batch line that runs a program out of the Windows Temp root is the
  # second stage of a dropper more often than anything legitimate: installers
  # and admin scripts stage under %TEMP% subdirectories or quoted service
  # paths, not a bare Temp-root image invoked by absolute path.
  - id: batch-temp-executable-command
    desc: Batch invokes an executable from Windows Temp
    crit: suspicious
    conf: 0.85
    all:
      - id: batch-absolute-executable-command
      - id: micro-behaviors/fs/path/temp::windows-temp-executable-path
