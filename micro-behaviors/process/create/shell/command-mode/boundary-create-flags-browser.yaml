defaults:
  crit: notable
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: chromium-gpu-launcher-shell
    desc: Chromium GPU launcher invokes command shell
    crit: suspicious
    conf: 0.98
    for: [binaries, scripts, source, html, javascript, typescript, text, -jcl, -beam, -pyc, -class, -staticlib,
      -wasm]
    unless:
      - id: metadata/path/directory::test-directory-component
      # Defensive source quoting the attack: Electron's CVE-2018-1000006
      # protocol-handler fix keeps a `Sample exploit: ... --gpu-launcher="cmd"`
      # comment above the argument check that blocks it.
      - type: text
        regex: '(?i)CVE-2018-1000006|sample exploit'
    if:
      type: text
      regex: '(?i)--gpu-launcher[=\s]+["'']?(cmd|powershell|pwsh|/bin/[a-z]*sh)(\.exe)?\b'

