# `%COMSPEC% /c <command>` expands to the command interpreter (cmd.exe) and
# runs one command; scripts use it to avoid naming cmd.exe.
defaults:
  crit: notable
  platforms: [windows]
  for: [scripts, html, asp]

traits:
  - id: comspec-c-command-text
    desc: Runs a command through %COMSPEC% /c
    conf: 0.88
    if:
      type: text
      regex: '(?i)%comspec%\s*/c\b'
