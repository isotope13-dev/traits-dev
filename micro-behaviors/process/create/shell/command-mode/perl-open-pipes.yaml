defaults:
  crit: notable
  for: [perl]
  platforms: [unix, windows]

traits:
  - id: perl-open-interpolated-pipe
    desc: Opens a pipe from an interpolated command
    conf: 0.9
    if:
      type: text
      regex: 'open\s*\([^)\n]{0,40},[^)\n]{0,80}\$[A-Za-z_]\w*[^)\n]{0,40}\|'
  - id: perl-open-write-pipe
    desc: Opens a write pipe to a command
    conf: 0.86
    for: [perl, static-lib, text]
    if:
      type: text
      regex: 'open\s*\(\s*\w+\s*,\s*"\|'

  - id: perl-appended-pipe-command-output
    desc: Reads output from an appended command pipe
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        (block
          (expression_statement
            (assignment_expression
              left: (scalar) @appended
              ".="
              right: [(string_literal) (interpolated_string_literal)] @suffix))
          . (expression_statement
              [
                (function_call_expression
                  function: (function) @open
                  arguments: (list_expression [(bareword) (scalar)] @handle (scalar) @opened))
                (ambiguous_function_call_expression
                  function: (function) @open
                  arguments: (list_expression [(bareword) (scalar)] @handle (scalar) @opened))
              ])
          (loop_statement
            condition: (readline_expression [(filehandle) (scalar)] @read)
            block: (block
              (expression_statement
                [
                  (function_call_expression function: (function) @output)
                  (ambiguous_function_call_expression function: (function) @output)
                ])))
          (#eq? @open "open")
          (#eq? @appended @opened)
          (#eq? @handle @read)
          (#match? @suffix "^[\"'] *\\| *[\"']$")
          (#any-of? @output "print" "printf" "say")) @pipe
