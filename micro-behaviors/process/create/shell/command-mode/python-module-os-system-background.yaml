defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006
  crit: notable
  conf: 0.92
traits:
  # Module-level only: the statement starts at column 0, so a call made inside
  # a function a caller invokes does not match. The string must end with a
  # background `&` before its closing quote.
  - id: python-module-os-system-background
    desc: Module os.system launches a background command
    if:
      type: text
      regex: '(?m)^os\.system\([^\n]{0,160}&\s*["'']\)'
