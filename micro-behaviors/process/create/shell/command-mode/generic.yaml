defaults:
  platforms: [unix]
  for: [elf, macho]
traits:
- id: native-shell-command-invocation
  desc: Native command-mode shell invocation
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)/(usr/)?bin/(sh|bash)\s+-[ci]\b'

# Script-side counterpart, with the detail that the invoked command's output is
# thrown away. Neutral on its own — init scripts, Dockerfile RUN lines, cron
# helpers and post-install hooks all silence probe commands this way — so it is
# a capability observation. Composites that read stealth into it (agent-snapshot
# shell execution, staged droppers) supply their own anchor.
- id: bash-c-output-discarded
  desc: Runs bash -c discarding all output
  crit: notable
  conf: 0.85
  for: [shell, scripts]
  mbc: C0017
  attack: T1059.004
  if:
    type: text
    regex: '/bin/bash\s+-c\s+[''"].{0,200}>/dev/null\s+2>&1'
