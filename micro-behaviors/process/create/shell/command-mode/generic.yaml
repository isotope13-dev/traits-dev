defaults:
  platforms: [unix]
  for: [elf, macho]
traits:
- id: native-shell-command-invocation
  desc: Native command-mode shell invocation
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)/(usr/)?bin/(sh|bash)\s+-[ci]\b'

# Script-side counterpart, with the detail that the invoked command's output is
# thrown away. Neutral on its own — init scripts, Dockerfile RUN lines, cron
# helpers and post-install hooks all silence probe commands this way — so it is
# a capability observation. Composites that read stealth into it (agent-snapshot
# shell execution, staged droppers) supply their own anchor.
- id: bash-c-output-discarded
  desc: Runs bash -c discarding all output
  crit: notable
  conf: 0.85
  for: [shell, scripts]
  mbc: C0017
  attack: T1059.004
  if:
    type: text
    regex: '/bin/bash\s+-c\s+[''"].{0,200}>/dev/null\s+2>&1'

# `sh -c "$(curl <url>)"` — the command-substitution spelling of a remote
# download-and-run one-liner. Functionally the same as `curl <url> | sh`
# (micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text) but a
# distinct syntax, and the one macOS install instructions and macOS ClickFix
# lures both favour, so pipe-shaped matchers miss it entirely.
#
# Recorded across script, source and document carriers because the one-liner
# is usually quoted rather than executed where it is found: a lure page holds
# it as a JavaScript string to plant on the clipboard, a README documents it,
# a dropper builds it as an argument. Neutral by itself — this is how Homebrew,
# rustup and oh-my-zsh ship — so intent comes from the composites that pair it
# with a delivery surface.
- id: shell-c-command-substitution-fetch
  desc: Shell -c runs a fetched remote script
  crit: notable
  conf: 0.92
  for: [scripts, source, html, markdown]
  mbc: C0017
  attack: T1059.004
  if:
    type: text
    # The quote around the substitution is optional in practice: the ClickFix
    # macOS one-liners paste `bash -c $(curl -s '<url>')` unquoted, which a
    # mandatory ["'] here missed entirely.
    regex: '\b(ba|z)?sh\s+-c\s+["'']?.{0,40}\$\((curl|wget)\b'

# Commands are often carried as strings in browser lures, scripts, documents,
# or native launchers. The invocation syntax is a neutral process capability;
# ClickFix and dropper objectives add the clipboard and download context.
- id: windows-command-shell-invocation
  desc: Invokes a Windows shell in command mode
  crit: notable
  conf: 0.94
  platforms: [windows]
  for: [scripts, source, html, markdown, pe, dll]
  attack: T1059.001,T1059.003
  if:
    type: text
    regex: '(?i)(\bpowershell(\.exe)?\s+-\w+|\bcmd(\.exe)?\s+/[a-z]\b|%COMSPEC%\s+/[a-z]\b)'
