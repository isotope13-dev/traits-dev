defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: git-log-filename-via-execsync
    desc: Git log path interpolated into shell command
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator name: (identifier) @exec
              value: (member_expression
                object: (call_expression function: (identifier) @require
                  arguments: (arguments (string (string_fragment) @module)))
                property: (property_identifier) @method)))
          (lexical_declaration
            (variable_declarator
              value: (call_expression function: (member_expression
                object: (call_expression function: (member_expression
                  object: (call_expression function: (identifier) @call
                    arguments: (arguments
                      (template_string (string_fragment) @prefix
                        (template_substitution (identifier))))))))))))
          (#eq? @require "require")
          (#eq? @module "child_process")
          (#eq? @method "execSync")
          (#eq? @exec @call)
          (#match? @prefix "^git log .* -- $"))
