# Macro source contains a batch header, VBA output mode and shell invocation;
# the matcher does not bind the written path to the invoked shell argument.
defaults:
  platforms: [windows]
  for: [vbs]

composite_rules:
  - id: macro-batch-write-shell-profile
    desc: Macro batch-write and shell-invocation clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/format/script::embedded-batch-script-header
      - id: micro-behaviors/fs/write/vba::vba-open-for-output
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
