# A Desktop Entry Exec= value may deliberately use a shell command string for
# redirection, expansion, or command composition. This is execution behavior,
# not evidence of obfuscation by itself; objective traits add malicious context.
defaults:
  platforms: [linux]
  for: [desktop-entry]
  mbc: C0017
  attack: T1059.004

traits:
  - id: desktop-exec-bash-command-mode
    desc: Desktop Entry Exec invokes Bash command mode
    crit: notable
    conf: 0.85
    if:
      type: value
      path: desktop_entry.exec
      regex: '\bbash\s+-c\b'

  - id: desktop-exec-posix-shell-command-mode
    desc: Desktop Entry Exec invokes shell command mode
    crit: notable
    conf: 0.85
    if:
      type: value
      path: desktop_entry.exec
      regex: '\b(sh|dash|zsh|ksh)\s+-c\b'

composite_rules:
  - id: desktop-exec-shell-command-mode
    desc: Desktop Entry Exec invokes shell command mode
    crit: notable
    conf: 0.85
    any:
      - id: desktop-exec-bash-command-mode
      - id: desktop-exec-posix-shell-command-mode
