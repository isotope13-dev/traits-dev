# Python subprocess.check_output(..., shell=True) — technique leaf sibling of
# process/create/subprocess (parent dir is at the size/leaf-yaml caps).
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.006

traits:
  - id: micro-behaviors/process/create/shell/command-mode::check-output-shell-true
    desc: check_output invoked with shell=True
    crit: notable
    conf: 0.95
    mbc: "E1059.006"
    if:
      type: text
      regex: '(?s)subprocess\.check_output\s*\(.{0,400}\bshell\s*=\s*True'
  - id: micro-behaviors/process/create/shell/command-mode::popen-shell-true
    desc: Python Popen launches through a shell
    crit: notable
    conf: 0.94
    mbc: "C0017"
    if:
      type: tree-sitter
      kind: call
      regex: '(?s)\b(subprocess\.)?Popen\s*\(.{0,700}\bshell\s*=\s*True'
