# A launcher prefix on a cmd.exe /c command line. The required observation
# is shell command syntax; this does not prove a privilege or policy bypass.
defaults:
  platforms: [windows]
  for: [vbs, batch, powershell, javascript, php, html, csharp, asp]
  attack: T1059.003

traits:
  - id: win-com-launcher-prefix
    desc: win.com launcher prefix for cmd.exe /c
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\bwin\.com\s+cmd\.exe\s+/c\b'
      case_insensitive: true
