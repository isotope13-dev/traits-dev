defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  mbc: "E1059"
  attack: "T1059.004"

traits:
  - id: popen
    desc: Process open via popen()
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: "popen"
  - id: exec-variable-argument-popen
    desc: popen() receives variable argument
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: popen
      arg:
        index: 0
        kind: identifier
