# Moved from backdoor tasking with the same matcher, scope, and criticality.
# The text shows popen-style call syntax, not HTTP tasking or a backdoor.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-popen-command-call
    desc: Python popen-style command call syntax
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\bpopen\(\s*\w+'
