defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  mbc: E1059.006
  attack: T1059.006
traits:
  - id: python-dunder-import-os-system
    desc: Shell exec via inline __import__ system call
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '__import__\s*\(\s*["''](os|posix)["'']\s*\)\s*\.\s*system\s*\('
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: python-os-system
    desc: Executes shell commands via Python
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      exact: os.system
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: well-known/tool/detection/security-scanner::code-pattern-catalog
      - id: well-known/tool/detection/pattern-catalog::python-taint-sink-map
  # Parser-free fallback for explicit os.system calls.
  - id: python-os-system-text
    desc: os.system shell execution in source text
    crit: notable
    conf: 0.85
    for: [python, text]
    if:
      type: text
      regex: '(^|[^\\])\bos\.system\s*\('
    unless:
      - id: python-os-system
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: well-known/tool/detection/security-scanner::code-pattern-catalog
      - id: well-known/tool/detection/pattern-catalog::python-taint-sink-map
      # This package contains the pattern catalog and remediation text that
      # the rule itself documents; neither is an executed call.
      - id: metadata/file/catalog/threat-pattern::severity-graded-pattern-catalog
      - id: metadata/file/catalog/threat-pattern::dangerous-pattern-replacement-text
