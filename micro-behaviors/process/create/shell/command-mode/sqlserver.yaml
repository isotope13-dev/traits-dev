defaults:
  platforms: [windows]
  for: [php, vbs, html, javascript, java, csharp]
traits:
  - id: sqlserver-xp-cmdshell-invocation
    desc: SQL text invokes xp_cmdshell
    crit: notable
    conf: 0.94
    attack: T1059
    if:
      type: text
      regex: (?i)\bexec(ute)?\s+(master\.\.)?xp_cmdshell\b
    unless:
      - id: metadata/file/format/wordlist::sql-injection-string-corpus
