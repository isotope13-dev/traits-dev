defaults:
  platforms: [windows]
  for: [html, javascript, vbs, batch, powershell]
traits:
  - id: command-com-c-command-text
    desc: COMMAND.COM command text with /c
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\bcommand(\.com)?\s+/c\s+'
