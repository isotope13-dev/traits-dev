# Call facts do not expose the second element of an argv array. Bind the
# decoded variable to that element structurally, including a length guard.
defaults:
  platforms: [unix]
  for: [javascript, typescript]
traits:
  - id: node-hex-variable-shell-command
    desc: Hex-decoded variable passed to shell
    crit: notable
    conf: 0.98
    attack: T1059.004
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator
            name: (identifier) @decoded
            value: (call_expression
              function: (member_expression
                object: (call_expression
                  function: (member_expression object: (identifier) @buffer
                    property: (property_identifier) @from)
                  arguments: (arguments (_) (string (string_fragment) @encoding)))
                property: (property_identifier) @to_string))))
          . (expression_statement (call_expression
          function: [(identifier) @exec (member_expression property: (property_identifier) @exec)]
          arguments: (arguments . (string (string_fragment) @shell)
            . (array . (string (string_fragment) @flag) . (identifier) @used)))))
          (#eq? @buffer "Buffer") (#eq? @from "from")
          (#eq? @encoding "hex") (#eq? @to_string "toString")
          (#match? @exec "^execFile(Sync)?$")
          (#match? @shell "^(/bin/)?(ba|da|z)?sh$")
          (#eq? @flag "-c") (#eq? @decoded @used))

        ((statement_block
          (lexical_declaration (variable_declarator
            name: (identifier) @decoded
            value: (call_expression
              function: (member_expression
                object: (call_expression
                  function: (member_expression object: (identifier) @buffer
                    property: (property_identifier) @from)
                  arguments: (arguments (_) (string (string_fragment) @encoding)))
                property: (property_identifier) @to_string))))
          . (if_statement consequence: (statement_block . (expression_statement (call_expression
          function: [(identifier) @exec (member_expression property: (property_identifier) @exec)]
          arguments: (arguments . (string (string_fragment) @shell)
            . (array . (string (string_fragment) @flag) . (identifier) @used)))))))
          (#eq? @buffer "Buffer") (#eq? @from "from")
          (#eq? @encoding "hex") (#eq? @to_string "toString")
          (#match? @exec "^execFile(Sync)?$")
          (#match? @shell "^(/bin/)?(ba|da|z)?sh$")
          (#eq? @flag "-c") (#eq? @decoded @used))
