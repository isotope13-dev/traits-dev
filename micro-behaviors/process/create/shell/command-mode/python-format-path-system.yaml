defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-parameter-path-formatted-into-os-system
    desc: Caller path formatted into an os.system command
    crit: suspicious
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((function_definition
          parameters: (parameters (identifier) @input)
          body: (block (if_statement
            consequence: (block
            (expression_statement (assignment
              left: (identifier) @command
              right: (call
                function: (attribute object: (string) attribute: (identifier) @format)
                arguments: (argument_list (keyword_argument name: (identifier) @key value: (identifier) @value)))))
            (expression_statement (call
              function: (attribute object: (identifier) @module attribute: (identifier) @system)
              arguments: (argument_list (identifier) @executed)))))))
          (#eq? @format "format")
          (#match? @key "(?i)(path|file)")
          (#eq? @input @value)
          (#eq? @command @executed)
          (#eq? @module "os")
          (#eq? @system "system"))
