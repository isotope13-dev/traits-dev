defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
  - text
  - data
traits:
- id: sqlserver-xp-windows-command
  desc: xp_cmdshell Windows command syntax
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)\bexec(ute)?\s+[\w.\[\]]*xp_cmdshell\]?\s+[^;\r\n]{0,160}\b(cmd|powershell|wmic)\b
  unless:
  - id: micro-behaviors/ui/help/command::escaped-local-command-reference
- id: sqlserver-xp-cmdshell-variable-command
  desc: xp_cmdshell statement with a variable command
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)\bexec(ute)?\s+[\w.\[\]]*xp_cmdshell\]?\s+['"]?\s*\$[\w{]
