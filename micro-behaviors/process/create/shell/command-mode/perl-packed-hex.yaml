defaults:
  for: [perl]
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.98

traits:
  # Perl flow facts lose scalar bindings. Compare the parsed scalar names and
  # require adjacent statements, preventing an intervening reassignment.
  - id: perl-system-packed-hex-command
    desc: Runs hex-decoded Perl shell command
    if:
      type: tree-sitter
      query: |
        (block
          (expression_statement
            (assignment_expression
              left: (variable_declaration variable: (scalar) @decoded)
              right: (_
                function: (function) @decoder
                arguments: (list_expression
                  . (string_literal content: (string_content) @format)))))
          . (expression_statement
            [
              (_
                function: (function) @runner
                arguments: (list_expression
                  . (string_literal content: (string_content) @shell)
                  . (string_literal content: (string_content) @switch)
                  . (scalar) @command .))
              (postfix_conditional_expression
                (_
                  function: (function) @runner
                  arguments: (list_expression
                    . (string_literal content: (string_content) @shell)
                    . (string_literal content: (string_content) @switch)
                    . (scalar) @command .)))
            ])
          (#eq? @decoder "pack")
          (#eq? @format "H*")
          (#eq? @runner "system")
          (#match? @shell "^/(usr/)?bin/(ba|da|z|k)?sh$")
          (#eq? @switch "-c")
          (#eq? @decoded @command)) @decoded_shell
