traits:
- platforms:
  - windows
  for:
  - xml
  - html
  - vbs
  - javascript
  id: wsh-hidden-cmd-run
  desc: Hidden WSH Run contains cmd command text
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: (?i)\.Run\s*\([^,\r\n]{0,40}["']\s*cmd(\.exe)?\s+/c\b[^,\r\n]{0,300},\s*0\b
    not:
    - substr: .bat
    - substr: .ps1
    - substr: -File
    - substr: -file
    - regex: (?i)cmd\s+/c\s+clip\s*<
  unless:
  - id: well-known/tool/sysadmin/microsoft-office::offscrub-removal-benign-context
