# Curl, PowerShell -File and hidden/bypass flags coexist in command text;
# the curl output path is not matched to the -File argument.
defaults:
  platforms: [windows]
  for: [scripts, binaries]

traits:
  - id: cmd-curl-near-powershell-file-bypass
    desc: CMD curl near PowerShell file-bypass flags
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: cmd\.exe\s*/c\s*curl.{0,200}-ep\s+bypass.{0,200}-file

composite_rules:
  - id: vbs-curl-powershell-hidden-file-profile
    desc: VBScript curl and hidden PowerShell file clues
    crit: suspicious
    conf: 0.97
    all:
      - id: cmd-curl-near-powershell-file-bypass
      - id: micro-behaviors/process/create/hidden::powershell-bypass-file-hidden-flags
