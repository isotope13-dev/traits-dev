defaults:
  platforms: [windows, unix]
  for: [json]
  crit: notable
  conf: 0.92

traits:
  - id: ai-agent-statusline-shell-command
    desc: Agent status line runs a shell command
    if:
      type: value
      path: statusLine.command
      regex: '(?i)(^|[/\\ ''"])(ba|z|k|da)?sh\s+-[a-z]*c\b'

  - id: config-args-shell-command
    desc: Configuration args select shell with -c
    crit: notable
    conf: 0.94
    for: [scripts, source, json, yaml, markdown, text]
    if:
      type: text
      regex: 'args["'']?\s*[:=]\s*\[[^\]]{0,160}["'']/(usr/)?bin/(z|ba)?sh["'']\s*,\s*["'']-l?c["'']'

  - id: argument-array-shell-after-separator
    desc: Argument array passes shell command after --
    crit: notable
    conf: 0.95
    platforms: [unix]
    for: [scripts, source, json, yaml, markdown, text]
    if:
      type: text
      regex: '["'']--["'']\s*,\s*["''](/bin/)?(z|ba)?sh["'']\s*,\s*["'']-l?c["'']'

  # `cmd /c start` launches a separate process and the outer cmd exits; as
  # an MCP stdio command it likewise never serves the transport.
