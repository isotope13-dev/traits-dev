# The byte array, XOR operation, and command-shell invocation are observable
# together, but the profile does not establish that the decoded bytes reach
# the shell. Keep it as a contextual process-creation profile; the hostile
# loader (objectives/anti-static/obfuscation/encoding/xor) additionally
# requires the `cmd /c {s}` runtime-string format below.
defaults:
  platforms: [windows]
  for: [zig]
  attack: T1027,T1059.003

traits:
  # A `{s}` format placeholder directly after `cmd /c` means the shell runs a
  # string computed at runtime rather than a literal command.
  - id: zig-runtime-string-cmd-c-format
    desc: Formats a runtime string after cmd /c
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)"cmd(\.exe)?\s+/c\s+\{s\}"'

composite_rules:
  - id: zig-xor-array-shell-launch-profile
    desc: Zig XOR-array and command-shell launch clues
    crit: suspicious
    conf: 0.99
    scope: file
    all:
      - id: micro-behaviors/data/embedded/payload/array::zig-hex-byte-array-literal
      - id: micro-behaviors/data/arithmetic::source-xor-operation
      - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
      - id: micro-behaviors/process/create/direct::zig-child-init
