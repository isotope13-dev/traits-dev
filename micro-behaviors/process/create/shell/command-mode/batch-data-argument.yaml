defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
  - id: batch-starts-data-argument
    desc: Batch START passes a data or script path
    crit: notable
    conf: 0.95
    near_bytes: 160
    all:
      - id: start-unquoted-executable-command
      - id: micro-behaviors/process/argument/file::executable-data-or-script-file-argument
