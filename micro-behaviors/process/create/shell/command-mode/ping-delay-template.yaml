defaults:
  platforms: [windows]
  for: [pe]
traits:
  # Size and section labels do not change the meaning of this command.
  - id: ping-delayed-shell-command-template
    desc: Ping-delayed shell command template
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: 'cmd.exe /c ping 127.0.0.1 -n 2&%s "%s"'
