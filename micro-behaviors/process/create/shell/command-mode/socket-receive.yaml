defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: socket-receive-shell-cooccurrence
    desc: Socket receive precedes shell call reference
    attack: T1059
    crit: notable
    conf: 0.95
    for: [shell, python, javascript, c, cpp, elf, macho, pe]
    if:
      type: text
      # `[\s(=s]\.?system\(` keeps os.system() and a bare C/Perl system() but
      # not a method on another object: `platform.system()` is OS detection.
      regex: '(?s)(socket|accept).{0,700}recv\(.{0,400}(shell=True|bin/sh|[\s(=s]\.?system\()'
    unless:
      # pwntools ships syscall tables and shellcraft templates as reference data.
      - id: well-known/tool/offensive/pwntools::pwntools-distribution
      # ldap3 imports platform.system and mentions recv() in a timeout comment.
      - type: path
        regex: ldap3/strategy/base\.py
