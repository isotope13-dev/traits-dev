defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-os-system-interpolated-command
    desc: os.system receives an interpolated command
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((call function: (attribute object: (identifier) @module attribute: (identifier) @system)
          arguments: (argument_list . (string (interpolation)))) @call
        (#eq? @module "os")
        (#eq? @system "system")
        )
