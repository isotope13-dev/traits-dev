defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-shell-first-word-blocklist
    desc: Shell command checked by first word only
    crit: suspicious
    conf: 0.95
    if:
      type: yara
      source: |
        rule python_shell_first_word_blocklist {
          strings:
            $input = "command = params.get(\"command\")"
            $first = "cmd_name = command.split()[0]"
            $check = "if cmd_name in BLOCKED:"
            $run = "subprocess.run(command,"
            $shell = "shell=True"
          condition:
            all of them and @input < @first and @first < @check and
            @check < @run and @run < @shell and @shell - @run < 160
        }
