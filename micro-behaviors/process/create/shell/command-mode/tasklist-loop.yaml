defaults:
  platforms: [windows]
  for: [scripts, binaries]
traits:
  - id: tasklist-loop-rundll32-command
    desc: Tasklist iteration invokes rundll32
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)for\s+/f[^\r\n]{0,80}tasklist[^\r\n]{0,100}\bdo\s+rundll32'
      exclude_comments: true
