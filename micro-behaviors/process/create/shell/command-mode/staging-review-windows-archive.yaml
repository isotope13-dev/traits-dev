defaults:
  platforms:
  - windows
  for:
  - batch
  - powershell
  - text
traits:
- id: appdata-exe-command-text
  desc: AppData executable command text
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: (?im)(^\s*"?|\b(start|call)\b.{0,24})%APPDATA%\\\S{1,40}\\\S{1,32}\.exe\b
  unless:
  - id: micro-behaviors/fs/path/app-data/application::pip-user-scripts-exe-path
- id: explorer-document-command-text
  desc: Explorer document command text
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: (?i)\bexplorer(\.exe)?[ \t]+"?[^"&\r\n|]{1,120}\.(pdf|docx?|xlsx?|pptx?)\b"?
- id: explorer-image-command-text
  desc: Explorer image command text
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: (?i)\bexplorer(\.exe)?[ \t]+"?[^"\s&|]{1,120}\.(jpg|jpeg|png)\b
composite_rules:
- id: explorer-document-or-image-command
  desc: Explorer document or image command
  crit: notable
  conf: 0.88
  any:
  - id: micro-behaviors/process/create/shell/command-mode::explorer-document-command-text
  - id: micro-behaviors/process/create/shell/command-mode::explorer-image-command-text
