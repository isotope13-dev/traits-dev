defaults:
  platforms: [unix]
  for: [python]
traits:
  - id: python-shell-call-dev-tcp-argument
    desc: Python shell call takes a dev-tcp command
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(system|popen|Popen)$'
      arg:
        index: 0
        kind: string
        substr: /dev/tcp/
