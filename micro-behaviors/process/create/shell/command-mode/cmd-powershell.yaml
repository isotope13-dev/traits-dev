defaults:
  platforms: [windows]
  attack: T1059.001,T1059.003
traits:
  - id: cmd-powershell-direct-launch
    desc: Command text invokes PowerShell through cmd /c
    crit: notable
    conf: 0.86
    for: [batch, powershell, javascript, vbs, pe]
    if:
      # Require PowerShell immediately after cmd /c so command-probing source
      # such as `cmd /c "${ir} /?"` is not treated as execution.
      type: text
      regex: \bcmd(\.exe)?\s*/c\s+["']?powershell(\.exe)?\b
      case_insensitive: true
    unless:
      - type: text
        substr: "quotes within quotes"
      - type: text
        regex: (?i)(do not|avoid|forbid)[^\r\n]{0,120}powershell
      - type: text
        regex: (禁止|禁用)[^\r\n]{0,120}PowerShell
      - id: well-known/lib/runtime/scripted/sandbox-runtime::command-wrapper-unwrapper
      # Windows image servicing writes first-boot commands into an offline
      # hive (`reg add HKLM\...\FirstBoot\PreOobe /d "cmd.exe /c powershell ..."`);
      # nothing runs on the machine doing the servicing.
      - id: well-known/tool/development/cli/batch-scripts::uup-converter-wimlib-batch
