defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
traits:
  # The relation requires dereferencing two RIP-relative string pointers.
  # Hex alone cannot distinguish Bash -c from a benign two-argument program.
  # This covers Go ELF layouts with the same VA/file delta for code and data.
  - id: go-amd64-bash-c-argv
    desc: Go binary constructs Bash command argv
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule go_amd64_bash_command_argv {
          strings:
            $argv = { 48 C7 84 24 ?? ?? ?? ?? 02 00 00 00 48 8D 15 ?? ?? ?? ?? 48 89 94 24 }
            $run = { 48 8D 05 ?? ?? ?? ?? BB 04 00 00 00 48 8D 8C 24 ?? ?? ?? ?? BF 02 00 00 00 48 89 FE E8 ?? ?? ?? ?? E8 }
          condition:
            for any i in (1..#argv) : (
              uint16(@argv[i] + 19 + uint32(@argv[i] + 15)) == 0x632d and
              for any j in (1..#run) : (
                @run[j] > @argv[i] and @run[j] - @argv[i] < 128 and
                uint32(@run[j] + 7 + uint32(@run[j] + 3)) == 0x68736162
              )
            )
        }
