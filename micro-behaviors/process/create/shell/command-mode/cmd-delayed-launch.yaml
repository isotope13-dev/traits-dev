defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, html, vbs, text]
  crit: notable
  conf: 0.94
  attack: T1059.003
traits:
  - id: cmd-delayed-expansion-c
    desc: CMD delayed-expansion and command-mode options
    if:
      type: text
      regex: '(?i)/v:on\s+/c\b'

  - id: cmd-start-for-variable
    desc: Chained START launches a CMD loop variable
    if:
      type: text
      regex: '(?i)&\s*start\s+["\\ ]{0,12}%{1,2}[a-z]\b'
