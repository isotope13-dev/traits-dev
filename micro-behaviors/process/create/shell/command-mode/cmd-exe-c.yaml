defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, scripts, rust]
traits:
- id: cmd-exe-c-command-text
  desc: Contains cmd.exe /c command syntax
  conf: 0.85
  for: [pe, dll, scripts, rust, html, asp]
  if:
    type: text
      # A backtick prefix is omitted deliberately: prose commonly quotes
      # rejected commands as `cmd /c ...`, while executable JS strings use a
      # quote and shell commands appear at a line boundary or after whitespace.
      # Word-boundary after /c also matches PE prefixes like "cmd.exe /c ".
      # cmd accepts startup switches before /C, including quiet mode and
      # delayed expansion. Restrict the prefix to recognized switches.
    regex: '(?is)(^|["''\s(=,:])cmd(\.exe)?\s*(/(d|s|q|a|u|[vef]:(on|off))\s+){0,8}/c\b'
  # `start` hands the target to the shell and returns immediately, so the
  # launched program runs independently; window visibility depends on flags. Deliberately anchor-free: PE string tables pack literals with
  # no separator, so the `cmd` token routinely abuts the preceding string.

- id: rust-cmd-exe-c-command
  desc: Rust launches cmd with /C
  conf: 0.85
  for: [pe, dll, scripts, rust, html, asp]
  if:
    type: text
    regex: 'Command::new\("cmd(\.exe)?"\).{0,80}"/C"'

composite_rules:
- id: cmd-exe-c-command
  desc: Contains cmd.exe /c command syntax
  conf: 0.85
  for: [pe, dll, scripts, rust, html, asp]
  any:
  - id: cmd-exe-c-command-text
  - id: rust-cmd-exe-c-command
