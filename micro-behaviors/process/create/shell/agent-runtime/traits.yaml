defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-shell-tool-name
    desc: Python names an execute-shell tool
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bname\s*=\s*["'']execute_shell["'']'

  - id: python-asyncio-create-subprocess-shell
    desc: Python asyncio shell subprocess call
    crit: notable
    conf: 0.9
    mbc: E1059.006
    attack: T1059.006
    if:
      type: symbol
      exact: asyncio.create_subprocess_shell

composite_rules:
  - id: named-agent-shell-tool
    desc: Named agent shell execution tool
    crit: notable
    conf: 0.95
    near_bytes: 1600
    all:
      - id: python-shell-tool-name
      - id: python-asyncio-create-subprocess-shell
