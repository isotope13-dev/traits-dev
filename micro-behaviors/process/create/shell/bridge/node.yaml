defaults:
  platforms:
    - unix
    - windows
  for: [javascript]
  attack: T1059
traits:
  - id: node-credential-process-exec
    desc: Node executes configured credential process
    crit: notable
    conf: 0.96
    mbc: C0017
    attack: T1059.007
    if:
      type: text
      regex: 'credentialProcess[\s\S]{0,500}execPromise\s*\('
  - id: node-credential-token-exec-interceptor
    desc: Node references credential command interceptor
    crit: notable
    conf: 0.94
    mbc: C0017
    attack: T1059.007
    if:
      type: text
      substr: externalDataInterceptor
  - id: child-process-keyword-literal
    desc: child_process module name literal
    crit: component
    conf: 0.9
    if:
      type: string_literal
      word: child_process
  - id: object-exec-method-call
    desc: Calls an object exec method
    crit: component
    conf: 1.0
    if:
      type: symbol
      kind: call
      regex: '\.exec$'
  - id: execsync-method-literal
    desc: execSync method name literal
    crit: component
    conf: 0.9
    if:
      type: string_literal
      word: execSync
  - id: local-exec-function
    desc: Local function named exec
    crit: baseline
    conf: 0.9
    if:
      type: function
      exact: exec
  - id: child-process-computed-member-call
    desc: Calls child_process through a computed member
    crit: notable
    conf: 0.9
    mbc: C0017
    if:
      type: text
      regex: 'child_process_\d+\s*\[[^\]\n]{1,120}\]\s*\)\s*\('
  - id: child-process-exec-destructure
    desc: Destructures exec from Node.js child_process
    crit: notable
    conf: 0.9
    mbc: C0017
    for: [javascript, typescript]
    if:
      type: text
      regex: '\{[^{}]{0,24}\bexec\b[^{}]{0,24}\}\s*=\s*require\(["''](node:)?child_process'
  - id: child-process-exec-esm-import
    desc: ESM-imports exec from Node.js child_process
    crit: notable
    conf: 0.9
    mbc: C0017
    for: [javascript, typescript]
    if:
      type: text
      regex: 'import\s*\{[^}]{0,80}\bexec\b[^}]{0,80}\}\s*from\s*["''](node:)?child_process'
  - id: child-process-destructure-require
    desc: Destructures APIs from Node.js child_process
    crit: notable
    conf: 0.85
    mbc: C0017
    unless:
      - type: basename
        regex: (^|[\\/])node_modules[\\/].+\.(js|ts)$
      - type: basename
        regex: ^(install|windowsPtyAgent)\.js$
      - id: metadata/library/structure::js-webpack-bundle
      - id: metadata/package/testing/harness/runtime::node-core-test
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/presence/harness::test-directory
      - id: well-known/tool/detection/agentskillmap/
    if:
      type: text
      regex: '\{[^}\n{]{1,48}\}\s*=\s*require\(\s*["''](node:)?child_process'
  - id: execsync-esm-import
    desc: Imports execSync from Node.js child_process
    crit: notable
    conf: 0.9
    mbc: C0017
    if:
      type: text
      # This is the imported API identity, not a claim that every reference
      # to the identifier executes a command.  The execution call remains a
      # separate capability when the parser can resolve the alias.
      regex: \bimport\s*\{[^}\n]{0,80}execSync\b[^}\n]{0,80}\}\s*from\s*["'](node:)?child_process["']
  - id: child-process-inline-member-require
    desc: Accesses child_process from inline require()
    crit: notable
    conf: 0.9
    mbc: C0017
    unless:
      - type: basename
        regex: (^|[\\/])node_modules[\\/].+\.(js|ts)$
      - type: basename
        regex: ^(install|windowsPtyAgent)\.js$
      - id: metadata/library/structure::js-webpack-bundle
      - id: metadata/package/testing/harness/runtime::node-core-test
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/presence/harness::test-directory
    # `require('child_process').exec|spawn|fork[Sync]` — inline member access on
    # the require() result. Distinctive as source text.
    if:
      type: text
      regex: 'require\s*\(\s*[''"](node:)?child_process[''"]\s*\)\s*\.(exec|spawn|fork)(Sync)?'
  - id: child-process-inline-exec-call
    desc: Inline child_process exec call
    crit: notable
    conf: 0.94
    mbc: C0017
    unless:
      - type: basename
        regex: (^|[\\/])node_modules[\\/].+\.(js|ts)$
      - type: basename
        regex: ^(install|windowsPtyAgent)\.js$
      - id: metadata/library/structure::js-webpack-bundle
      - id: metadata/package/testing/harness/runtime::node-core-test
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/presence/harness::test-directory
    # `require('child_process').exec[Sync](...)` — inline require-and-call.
    if:
      type: text
      regex: 'require\s*\(\s*[''"](node:)?child_process[''"]\s*\)\s*\.execSync?\s*\('
  - id: child-process-exec-alias-binding
    desc: Binds child_process exec to local alias
    crit: notable
    conf: 0.92
    mbc: C0017
    if:
      type: text
      regex: '\bexec\s*=\s*require\s*\(\s*[''"](node:)?child_process[''"]\s*\)\s*\.exec\b'
  - id: node-runtime-spawn-api-exposure
    desc: Exposes Node spawn through runtime object
    crit: notable
    conf: 0.96
    mbc: C0017
    for: [javascript, typescript]
    if:
      type: text
      regex: '\[[''\"]spawn[''\"]\]\s*=\s*[A-Za-z_$][A-Za-z0-9_$]*\s*(,|;)'

  - id: node-shell-handle-type
    desc: Node API exposes child process handle
    crit: notable
    conf: 0.94
    mbc: C0017
    for: [typescript]
    if:
      type: text
      regex: '\bshell\s*:\s*ChildProcess\b'

  - id: execSync-call
    desc: Runs shell commands synchronously with execSync
    crit: notable
    conf: 0.85
    mbc: C0017
    if:
      type: symbol
      kind: call
      regex: '(^|\.)execSync$'
  - id: execsync-in-catch-handler
    desc: Node execSync in catch-handling region
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'catch[\\s\\S]{0,320}execSync'
  - id: execSync-dynamic-command
    desc: execSync receives a variable command
    crit: notable
    conf: 0.92
    mbc: C0017
    attack: T1059.007
    if:
      type: text
      regex: 'execSync\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\s*,\s*\{'
  - id: exec-sync-http-response-header-command
    desc: execSync runs HTTP header value
    crit: suspicious
    conf: 0.96
    mbc: C0017
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: text
      regex: 'execSync\s*\(.{0,80}\.headers\.'
  - id: execSync-compiled
    desc: Compiled TypeScript execSync invocation
    crit: notable
    conf: 0.85
    mbc: C0017
    if:
      type: text
      regex: 'child_process_\d+\.execSync'
  - id: child-process-require-compiled
    desc: Compiled TS child_process require
    crit: notable
    conf: 0.9
    mbc: C0017
    # `const child_process_N = require("child_process")` is the standard tsc/
    # esbuild CommonJS emit for `import { spawn } from "child_process"`, not
    # obfuscation. Reported here as a neutral capability; MCP-backdoor composites
    # reference it cross-directory and supply the malicious intent.
    if:
      type: text
      regex: 'child_process_\d+\s*=\s*require\('
  - id: child-process-compiled-computed-call
    desc: Compiled child_process computed-member call
    crit: notable
    conf: 0.9
    mbc: C0017
    # `child_process_N["spawn"](...)` — property-mangled minifier/bundler emit
    # invoking a child_process API through a computed member. Neutral capability;
    # intent comes from the referencing composite.
    if:
      type: text
      regex: 'child_process_\d+\s*\[.{1,120}\]\s*\)\s*\('
  - id: child-process-compiled-exec-call
    desc: Compiled child_process exec invocation
    crit: notable
    conf: 0.94
    mbc: C0017
    attack: T1059.007
    for: [javascript, typescript]
    # TypeScript/CommonJS emit commonly calls a named import as
    # `(0, child_process_1.exec)(...)`; some bundlers emit the direct member
    # form instead.  This is the execution capability only; objective rules
    # supply intent such as destructive deletion or exfiltration.
    if:
      type: text
      regex: '(\(\s*0\s*,\s*)?child_process_\d+\.exec\s*(\)\s*)?\('
  - id: getExecOutput
    desc: Node.js exec output capture (GitHub Actions)
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: getExecOutput
  - id: silent-true
    desc: Silent execution flag (hides output)
    crit: notable
    conf: 0.85
    mbc: F0005
    if:
      type: string_literal
      regex: silent:\s*true
  # Text twin of the two atoms above for bundled/minified files, where AST
  # and string-literal facts are unavailable (2MB+ bundles emit neither):
  # a silenced output-capturing exec, call and flag within one statement.
  - id: silent-getexecoutput-text
    desc: Silenced output-capturing exec call
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'getExecOutput\s*\([^;]{0,800}silent\s*:\s*true'
  - id: shell-embedded-child-process-require
    desc: Embedded Node child_process require
    crit: notable
    conf: 0.95
    mbc: C0017
    for: [shell]
    if:
      type: text
      substr: 'child_process'
  - id: shell-embedded-node-exec-call
    desc: Calls an .exec() method in embedded text
    crit: component
    conf: 0.95
    mbc: C0017
    for: [shell]
    if:
      type: text
      regex: '\.exec\s*\('
composite_rules:
  - id: child-process-module-near-exec-call
    desc: Node child_process reference near exec call
    crit: notable
    conf: 0.94
    mbc: C0017
    attack: T1059.007
    near_bytes: 512
    all:
      - id: child-process-keyword-literal
      - id: object-exec-method-call

  - id: child-process-require
    desc: Imports the Node.js child_process module
    crit: notable
    conf: 0.8
    mbc: C0017
    unless:
      - id: well-known/tool/detection/agentskillmap/
      # Type declarations describe the module without loading it at runtime.
      - id: metadata/lang/scripted::dts-declaration-file
    any:
      - id: metadata/import/builtin::require-child-process
      - id: child-process-destructure-require
      - id: metadata/import/builtin::child-process-import-runtime
      - id: child-process-inline-member-require
  - id: child-process-exec-alias-call
    desc: Calls an aliased child_process exec function
    crit: notable
    conf: 0.92
    mbc: C0017
    near_lines: 80
    all:
      - id: child-process-exec-alias-binding
      - id: micro-behaviors/process/create/shell/bridge::js-exec
  - id: child-process-exec
    desc: Node.js child_process execution
    crit: notable
    conf: 0.85
    mbc: C0017
    any:
      - id: child-process-inline-exec-call
      - id: child-process-exec-alias-call
      - id: micro-behaviors/process/create/exec::js-child-process
      - id: micro-behaviors/process/create/shell/bridge::js-exec
      - id: execSync-call
      - id: execSync-compiled
      - id: child-process-compiled-exec-call
      - id: getExecOutput
  - id: shell-embedded-node-child-process-exec
    desc: Embedded Node child_process execution
    crit: notable
    conf: 0.95
    mbc: C0017
    for: [shell]
    near_bytes: 512
    all:
      - id: shell-embedded-child-process-require
      - id: shell-embedded-node-exec-call
