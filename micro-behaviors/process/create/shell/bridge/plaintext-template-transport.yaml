defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]
traits:
  - id: textencoder-template-base64-shell-transport
    desc: Encodes runtime text into shell transport
    crit: notable
    conf: 0.98
    # The command contains a JS interpolation encoding a runtime variable.
    # It contains no concealed Base64 payload literal at this location.
    if:
      type: text
      regex: 'echo \$\{\w+\(new TextEncoder\(\)\.encode\(\w+\)\)\} \| base64 -d \| sh'
