defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: exec-call-bash-tcp-io
    desc: Exec arg starts a Bash TCP shell
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)exec(Sync)?$'
      arg:
        kind: string
        substr: 'bash -i >& /dev/tcp/'
