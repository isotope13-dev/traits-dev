defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
traits:
  - id: node-global-npm-install-spawn
    desc: Node spawns npm install --global
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: "(execSync|spawnSync)\\(\\s*[`\"']npm install[\\s\\S]{0,80}(-g|--global)"
  - id: node-bash-lc-member-command
    desc: Runs object command through Bash
    crit: notable
    conf: 0.98
    attack: T1059.004
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bspawn\w*\(\s*["'']bash["'']\s*,\s*\[\s*["'']-lc["'']\s*,\s*[\w$]+\.[\w$]+'

  # A hidden PowerShell window is a neutral child-process capability. It is
  # also used by VS Code clipboard/image helpers; payload intent belongs in a
  # composite that adds an upload or other hostile objective.
  - id: js-spawn-hidden-powershell-helper
    desc: JavaScript hides PowerShell window
    crit: notable
    conf: 0.95
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: text
      regex: "spawn\\(\\s*['\"]powershell['\"][\\s\\S]{0,500}-windowstyle[\\s\\S]{0,100}hidden"

  - id: ai-agent-shell-instruction-tag
    desc: AI-agent shell instruction tag in prompt text
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '<(run_command|shell|bash)>[\s\S]{0,220}</'

  - id: vscode-create-terminal
    desc: Creates a VS Code terminal
    crit: notable
    conf: 0.9
    if:
      type: text
      # The receiver is what makes this the VS Code API (`vscode.window.` or a
      # destructured `window.`). Bare `.createTerminal(` is just a method name:
      # every terminal library, xterm/ghostty host, ttyd-style server and
      # node-pty wrapper defines one -- adhdev's session-host daemon matched on
      # its own screen-mirror factory. Cost of the anchor: an extension that
      # destructures `window` under a minified alias is missed here, but the
      # dispatch composite below still needs `.sendText(` alongside it.
      regex: '\bwindow\.createTerminal\s*\('

  # Same receiver anchor as vscode-create-terminal above, for the same reason:
  # bare `.sendText(` is just a method name. Ace's text-input layer defines
  # `this.sendText(e)` for IME composition, and every editor/chat widget has
  # some send-text method; requiring a terminal/pty-named receiver keeps this
  # about a terminal session.
  - id: terminal-send-text
    desc: Sends text to terminal session
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\b[\w$]*(term|pty)[\w$]*\s*\??\.\s*sendText\s*\('

  - id: js-execsync
    desc: Executes shell commands synchronously
    crit: notable
    conf: 1.0
    unless:
      - type: basename
        exact: windowsPtyAgent.js
      - type: basename
        exact: publish.js
      - type: text
        substr: require('../common')
    if:
      type: symbol
      exact: execSync
  - id: js-execsync-backgrounds-variable-command
    desc: execSync backgrounds a variable command
    crit: notable
    conf: 0.94
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bexecSync\s*\(\s*`[^`\n]{0,180}\$\{[A-Za-z_$][\w$]*\}[^`\n]{0,80}&\s*`'
  - id: js-constructor-execsync
    desc: Constructor executes a shell command
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bconstructor\s*\([^)]{0,80}\)\s*\{[\s\S]{0,480}\bexecSync\s*\('
  - id: js-execsync-cmd-arg
    desc: execSync called with cmd variable
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: execSync(cmd
  # `exec(cmd.split(' '))` — argv is built by splitting a command string at
  # run time. Neutral child-process mechanics: it says the argument vector is
  # assembled dynamically, not that the string was decoded or attacker-supplied.
  - id: js-exec-space-split-command
    desc: Executes a command string split on spaces
    crit: notable
    conf: 0.85
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: text
      regex: "(execSync|exec|spawn)\\s*\\([^\\n)]{0,200}\\.split\\(['\"] ['\"]\\)"
  - id: js-argv-command-string
    desc: Builds a command string from process argv
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'process\.argv[\s\S]{0,60}\.join\s*\('
  - id: js-compiled-execsync-cmd-arg
    desc: compiled JS execSync cmd arg
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: execSync)(cmd
  - id: js-execfilesync
    desc: Executes a file synchronously
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: execFileSync
  # execFileSync given a *variable* program path rather than a command name:
  # the executable is one the script resolved at run time (downloaded, unpacked
  # or looked up), not a tool baked into the source. The argument list is a
  # path the script built the same way. Legitimate wrappers do this around a
  # vendored binary; interpreter droppers do it to run a co-shipped script with
  # a runtime they just fetched.
  - id: js-execfilesync-var-program-join-arg
    desc: execFileSync runs variable path with path.join
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: 'execFileSync\s*\(\s*[\w.$]{1,40}\s*,\s*\[\s*path\.join\s*\('
  - id: js-execfilesync-var-program-var-arg
    desc: execFileSync runs variable path and arg
    crit: notable
    conf: 0.82
    for: [javascript, typescript]
    if:
      type: text
      regex: 'execFileSync\s*\(\s*[\w.$]{1,40}\s*,\s*\[\s*[\w.$]{1,40}\s*[,\]]'
  - id: js-execfile-bash
    desc: Node execFile launches bash process
    crit: notable
    conf: 0.86
    mbc: "C0017"
    attack: "T1059.004"
    for: [javascript, typescript]
    if:
      type: text
      regex: "execFile\\)?\\(\\s*['\"`]bash['\"`]"
  - id: js-function-bash-first-arg
    desc: JavaScript call receives Bash argument
    crit: component
    conf: 0.84
    mbc: "C0017"
    attack: "T1059.004"
    for: [javascript, typescript]
    if:
      type: text
      regex: "\\b[A-Za-z_$][\\w$]*\\s*\\(\\s*['\"`]bash['\"`]\\s*,"
  - id: js-spawnsync
    desc: Calls spawnSync() to run a child process
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: spawnSync
  - id: js-spawnsync-posix-interpreter
    desc: Runs a POSIX interpreter via spawnSync
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    attack: T1059
    if:
      type: text
      regex: 'spawnSync\s*\(\s*["''`](bash|sh|zsh)\b'
  - id: js-spawnsync-windows-interpreter
    desc: Runs a Windows interpreter via spawnSync
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    attack: T1059
    if:
      type: text
      regex: 'spawnSync\s*\(\s*["''`](powershell|pwsh|cmd|cmd\.exe)\b'
  - id: js-spawnsync-bash-command
    desc: Runs variable command through Bash
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'spawnSync\(\s*["'']bash["'']\s*,\s*\[\s*["'']-c["'']\s*,\s*\w+'
  - id: js-execsync-destructure
    desc: Destructures execSync and spawnSync
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'execSync\s*:\s*[A-Za-z_$][\w$]*\s*,\s*spawnSync'
  - id: js-computed-exec-destructure
    desc: Computed Node.js exec import
    crit: notable
    conf: 0.92
    mbc: "C0017"
    attack: "T1059.007"
    for: [javascript, typescript]
    if:
      type: text
      regex: '\{\s*exec\s*\}\s*=\s*require\(\s*[A-Za-z_$][\w$]*\s*\('
  - id: js-exec-wrapper-with-hidden-options
    desc: Exec wrapper uses hidden-process options
    crit: notable
    conf: 0.92
    mbc: "C0017"
    attack: "T1059.007"
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bexec\s*,\s*[^;\n]{0,180}["'']?windowsHide["'']?\s*:\s*'
  - id: js-exec-callback-reexec
    desc: exec callback launches second exec
    crit: notable
    conf: 0.94
    mbc: "C0017"
    attack: "T1059.007"
    for: [javascript, typescript]
    if:
      type: text
      regex: 'exec\s*\([^)]{0,80},\s*function\s*\([^)]{0,40}\).{0,400}\bexec\s*\('
  - id: js-exec-call
    desc: Calls a function named exec
    crit: component
    conf: 1.0
    if:
      type: symbol
      kind: call
      exact: exec
  - id: shelljs-exec
    desc: Executes a shell command through shelljs
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: shelljs.exec
  - id: node-starts-browser-url
    desc: Node invokes Windows start with a URL
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'exec\s*\(\s*`start\s+""\s+["'']?\$\{[A-Za-z_$][A-Za-z0-9_$]*\}'
  - id: js-cmd-start
    desc: Launches cmd via start
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: start\s+cmd
  - id: js-terminal-launch
    desc: Launches Linux terminal emulator
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: gnome-terminal|x-terminal-emulator|xfce4-terminal
  # A child_process exec whose command comes from a completion callback: the
  # `end` event of a stream hands the sink whatever the stream produced, so the
  # command being run is not present in the file. Bare `exec` must not be
  # preceded by a dot, which keeps `RE.exec(s)` (RegExp.prototype.exec, common
  # in response parsers) out; `execSync` is accepted in member form too
  # (`cp.execSync(body)`) because no RegExp method carries that name. Requiring
  # the argument to start with an identifier keeps fixed commands
  # (`execSync("npm i")`, backtick templates) out. Zero matches across 7,902
  # .js/.cjs/.mjs files of an npm/node-gyp/wrangler/esbuild install tree.
  - id: js-stream-end-exec-call
    desc: Stream end handler execs a variable
    crit: notable
    conf: 0.9
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.on\(\s*[''"]end[''"][\s\S]{0,110}([^.\w]exec|execSync)\s*\(\s*[A-Za-z_$]'
  - id: js-stream-end-exec-template
    desc: Stream end handler execs interpolated template
    crit: notable
    conf: 0.94
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.on\(\s*[''"]end[''"][\s\S]{0,110}\bexec(Sync)?\s*\(\s*`[^`]{0,80}\$\{'
  - id: js-bun-exec
    desc: JavaScript Bun process spawn API
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\bBun\.(spawn|spawnSync|exec|execSync)\b'

  # `exec("echo '<b64>' | base64 --decode | bash")` -- the command string
  # carries its own payload and pipes it straight into a shell, so nothing
  # readable ever reaches the source. The cross-platform spelling
  # (`base64 --decode 2>/dev/null || base64 -D`) is the macOS/Linux form.
  - id: js-exec-decode-pipe-shell-command
    desc: Exec runs a decode-and-pipe shell command
    crit: suspicious
    conf: 0.94
    attack: T1059.007,T1140
    unless:
      # agent-glovebox's deny-rules test suite quotes `base64 -d | sh` shapes
      # as deny-pattern rows for its defensive allow/deny engine -- quoted
      # policy text, not an executed pipeline.
      - id: well-known/tool/detection/agent-glovebox::archive-context
    if:
      # Just the decode-into-shell pipeline. The earlier form led with
      # `(exec|execSync)\s*\(` and scanned up to 400 characters to reach it,
      # which the engine's regex-explosion check rejects -- that shape makes
      # the lazy DFA grow without bound on minified bundles. The composites
      # that consume this supply the child-process leg, so nothing is lost:
      # a `base64 -d | sh` pipeline is the payload either way.
      type: text
      regex: 'base64 --?d[^\n]{0,60}\|\s*\(?(ba)?sh'
composite_rules:
  - id: js-exec
    desc: Executes a command through Node.js child_process exec
    crit: notable
    conf: 0.95
    mbc: C0017
    attack: T1059.007
    near_bytes: 16384
    all:
      - id: js-exec-call
    any:
      # Local helpers named `exec` that wrap spawnSync are not child_process.exec.
      - id: child-process-inline-exec-call
      - id: child-process-exec-alias-binding
      - id: js-computed-exec-destructure
      - id: child-process-exec-destructure
      - id: child-process-exec-esm-import

  - id: js-spawnsync-interpreter
    desc: Runs an interpreter via spawnSync
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    any:
      - id: js-spawnsync-posix-interpreter
      - id: js-spawnsync-windows-interpreter
  - id: vscode-terminal-command-dispatch
    desc: Dispatches commands through VS Code terminal
    crit: notable
    conf: 0.92
    near_bytes: 4096
    all:
      - id: vscode-create-terminal
      - id: terminal-send-text

  - id: js-file-write-and-shell-exec
    desc: JavaScript writes files and executes shell commands
    crit: notable
    conf: 0.85
    near_lines: 25
    all:
      - id: micro-behaviors/fs/write/file/direct::js-file-write
      - id: child-process-require
    any:
      - id: js-exec
      - id: js-execsync
    unless:
      - id: metadata/package/testing/harness/runtime::node-common-require
      - id: well-known/lib/web/nextjs::next-build-telemetry-writer
      - id: micro-behaviors/process/create/shell/build::npm-install-ignore-scripts
    downgrade:
      any:
        - id: metadata/library/prettier
        - id: metadata/package/documentation/
        - id: micro-behaviors/process/interpreter/vm/
  - id: js-sync-child-process-api
    desc: JavaScript synchronous child-process API
    crit: notable
    conf: 0.9
    any:
      - id: js-execfilesync
      - id: js-spawnsync
      - id: js-execsync
  - id: js-execfilesync-resolved-program
    desc: Executes a run-time-resolved program path
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    any:
      - id: js-execfilesync-var-program-join-arg
      - id: js-execfilesync-var-program-var-arg
