defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-cmd-member-exec-call
    desc: Exec call receives a cmd member
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      regex: '^(exec|execute)\s*\(\s*[A-Za-z_$][\w$.]{0,120}\.cmd\b'
