# Shell Base64 round-trip transport.
#
# Deploy helpers force remote commands through the login shell they want:
# the local script base64-encodes its own command text, ships it over ssh,
# and decodes it into bash on the far end (`printf %s "$encoded" |
# base64 -d | bash`). The bytes the decoder runs were authored in clear
# text a few lines above — nothing is concealed from static recovery, the
# encoding exists for newline/quoting safety across the ssh channel.
# The malicious shape differs structurally: a dropper decodes a static
# blob and never encodes anything. Requiring both halves of the round
# trip, near each other, is what separates the transport from the stager.
defaults:
  platforms: [unix]
  for: [shell, github-actions]

traits:
  - id: shell-base64-encode-pipeline
    desc: Pipes text through base64 encoding
    crit: notable
    conf: 0.9
    if:
      type: text
      # base64 as a pass-through stage with no flags and another stage
      # after it — the encode direction. A decode stage (`base64 -d |`)
      # does not match: the flag sits where the second pipe must be.
      regex: '\|\s*base64\s*\|'

composite_rules:
  - id: shell-base64-transport-roundtrip
    desc: Shell encodes and decodes Base64 as transport
    crit: exception
    conf: 0.95
    for: [shell]
    near_bytes: 600
    all:
      - id: shell-base64-encode-pipeline
      - id: micro-behaviors/data/decode/base64::decode-pipe-shell

  - id: base64-shell-transport-context
    desc: Base64 value transported through shell
    crit: exception
    conf: 0.95
    platforms: [unix, windows]
    for: [shell, javascript, typescript, github-actions]
    any:
      - id: micro-behaviors/process/create/shell/bridge::runtime-base64-shell-transport
      - id: micro-behaviors/process/create/shell/bridge::printf-fed-base64-shell-transport
      - id: shell-base64-transport-roundtrip

