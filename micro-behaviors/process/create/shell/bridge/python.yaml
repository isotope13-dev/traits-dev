# Python base64 round-trip transport, the counterpart of the JavaScript and
# shell forms in this directory. A harness that must hand a multi-line script
# to a remote or containerised shell encodes its own script text at run time
# and has the far side decode it (`printf '%s' '<b64>' | base64 -d > run.sh`).
# The decoded bytes were authored in clear text in the same program, so
# nothing is concealed; a dropper decodes a static blob and never encodes.
defaults:
  platforms: [unix]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-runtime-base64-shell-transport
    desc: Python base64-encodes text piped to decoder
    # The encode call and the decode pipe are one round trip. A short comment
    # often sits between them; a dropper has the pipe and no b64encode.
    if:
      type: text
      regex: 'b64encode\([\s\S]{0,48}\)[\s\S]{0,220}base64 -d'
