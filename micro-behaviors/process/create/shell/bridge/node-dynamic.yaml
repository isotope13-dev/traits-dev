defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007

traits:
  - id: node-dynamic-execsync-resolver
    desc: Node dynamic execSync resolver
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'execSync\s*:\s*execSync|ctx\s*\[\s*name\s*\].{0,80}execSync'
  - id: node-atob-base64-decoded-command-blobs
    desc: Node atob decodes multiple base64 command blobs
    crit: notable
    conf: 0.9
    count_min: 3
    if:
      type: text
      regex: 'atob_?\s*\(\s*["''][A-Za-z0-9+/]{4,}={0,2}["'']\s*\)'
  - id: node-decoded-bracket-sync-shell-output
    desc: Bracket-invokes decoded method on shell bridge
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\w+\[[^\]]{1,48}\]\(.{0,24}\(.{0,16}\).{0,16}\)\.toString\(\)\.trim\('
  - id: base64-child-process-name
    desc: Base64 encoded child_process module name
    crit: notable
    conf: 0.95
    if:
      type: encoded
      encoding: base64
      exact: child_process
  - id: base64-execsync-name
    desc: Base64 encoded execSync method name
    crit: notable
    conf: 0.95
    if:
      type: encoded
      encoding: base64
      exact: execSync
