# At least two terminal/shell launch clues; no staged payload is required.
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
composite_rules:
  - id: js-terminal-launch-cluster
    desc: JavaScript terminal launch clue cluster
    crit: suspicious
    conf: 0.95
    for: [javascript]
    needs: 2
    any:
      - id: micro-behaviors/process/create/shell/bridge::js-cmd-start
      - id: micro-behaviors/process/create/shell/bridge::js-terminal-launch
      - id: micro-behaviors/process/create/script/osascript::ref-terminal
    unless:
      - id: well-known/tool/development/editor/emdash::open-in-apps-registry
      - id: well-known/tool/development/editor/emdash::emdash-ade-app
