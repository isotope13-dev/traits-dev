# This bounded form avoids inferring a Node API from the name execFile alone.
defaults:
  for: [javascript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: const-execfile-require-binding
    desc: Const destructures execFile require result
    if:
      type: tree-sitter
      language: javascript
      query: |
        (program
          (lexical_declaration kind: "const"
            (variable_declarator
              name: (object_pattern . (shorthand_property_identifier_pattern) @api .)
              value: (call_expression function: (identifier) @require
                arguments: (arguments . (string . (string_fragment) @module .) .))))
          (#eq? @api "execFile")
          (#eq? @require "require")
          (#match? @module "^(node:)?child_process$"))
