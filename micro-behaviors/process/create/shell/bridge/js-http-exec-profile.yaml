defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
composite_rules:
- id: js-ip-write-exec-profile
  desc: External IP, file write and shell exec clues
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
  - id: micro-behaviors/fs/write/file/full::write-file-sync
  - id: micro-behaviors/process/create/shell/bridge::js-exec
- id: js-http-stream-end-exec-profile
  desc: HTTP client and stream-end shell exec clues
  crit: suspicious
  conf: 0.95
  near_lines: 30
  all:
  - id: micro-behaviors/communications/http/request/client::http-client-usage
  any:
  - id: micro-behaviors/process/create/shell/bridge::js-stream-end-exec-call
  - id: micro-behaviors/process/create/shell/bridge::js-stream-end-exec-template
- id: js-insecure-curl-exe-near-shell
  desc: curl EXE download near shell exec
  crit: suspicious
  conf: 0.97
  for:
  - javascript
  - typescript
  near_lines: 45
  all:
  - id: micro-behaviors/communications/http/download/curl::source-curl-insecure-executable-download
  any:
  - id: micro-behaviors/process/create/shell/bridge::js-exec
  - id: micro-behaviors/process/create/shell/bridge::js-exec-wrapper-with-hidden-options
