# Large extension bundles may have no call facts because parsing is bounded.
# Keep the raw constructor observation neutral; VS Code ownership and package
# installation context are supplied by the consuming composite.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: shell-execution-constructor
    desc: Constructs a ShellExecution object
    if:
      type: text
      regex: '\bnew\s+[\w$]+\.ShellExecution\s*\('
