# Large extension bundles may have no call facts because parsing is bounded.
# Keep the raw constructor observation neutral; VS Code ownership and package
# installation context are supplied by the consuming composite.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  # A nearby command string is not necessarily the ShellExecution argument.
  # Bind the command variable to the constructor input, including minifier
  # output with multiple declarators in one declaration. Calls/literals alone
  # cannot express this relationship.
  - id: github-runner-shell-execution
    desc: GitHub npx --yes passed to ShellExecution
    if:
      type: tree-sitter
      query: |
        ((new_expression
          constructor: (member_expression property: (property_identifier) @ctor)
          arguments: (arguments . [(string) (template_string)] @command)) @sink
          (#eq? @ctor "ShellExecution")
          (#match? @command "^[\"'`]npx[ \\t]+(-y|--yes)[ \\t]+(github:|https://github[.]com/|git[+]https://github[.]com/)[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"))

        ((lexical_declaration
          (variable_declarator name: (identifier) @bound value: [(string) (template_string)] @command)
          (variable_declarator value: (new_expression
            arguments: (arguments (new_expression
              constructor: (member_expression property: (property_identifier) @ctor)
              arguments: (arguments . (identifier) @used)) @sink))))
          (#eq? @ctor "ShellExecution")
          (#eq? @bound @used)
          (#match? @command "^[\"'`]npx[ \\t]+(-y|--yes)[ \\t]+(github:|https://github[.]com/|git[+]https://github[.]com/)[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"))

        ((_
          (lexical_declaration
            (variable_declarator name: (identifier) @bound value: [(string) (template_string)] @command))
          . (lexical_declaration
            (variable_declarator value: (new_expression
              arguments: (arguments (new_expression
                constructor: (member_expression property: (property_identifier) @ctor)
                arguments: (arguments . (identifier) @used)) @sink)))))
          (#eq? @ctor "ShellExecution")
          (#eq? @bound @used)
          (#match? @command "^[\"'`]npx[ \\t]+(-y|--yes)[ \\t]+(github:|https://github[.]com/|git[+]https://github[.]com/)[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"))

  - id: shell-execution-constructor
    desc: Constructs a ShellExecution object
    if:
      type: text
      regex: '\bnew\s+[\w$]+\.ShellExecution\s*\('
