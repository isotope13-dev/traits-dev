defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  # NOTE: the SysWOW64 cmd.exe literal that lived here as
  # `hidden-cmd-stackstring` was a path fact, not a shell-creation
  # observation: unattend answer files and docs spell it in the clear.
  # It now lives where the matcher says it belongs, as the notable
  # micro-behaviors/fs/path/system::syswow64-cmd-path.
  - id: createprocess-shellcode-api
    desc: CreateProcess shellcode API naming
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: CreateProcessFunc
  - id: fontdrvhost-exe-path
    desc: Fontdrvhost executable path marker
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)([\\/]|^|\s)fontdrvhost\.exe($|\s)
  - id: fontdrvhost-myagent
    desc: Fontdrvhost MyAgent marker
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: fontdrvhost.MyAg
composite_rules:
  - id: temp-fontdrvhost-drop
    desc: Fontdrvhost-named MyAgent staging markers
    crit: suspicious
    conf: 0.9
    all:
      - id: fontdrvhost-exe-path
      - id: fontdrvhost-myagent
