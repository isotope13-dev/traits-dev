defaults:
  for: [oledoc, ooxml, xlsx]
  platforms: [windows]
  crit: notable
  conf: 0.88
traits:
  - id: office-shell-reference-text
    desc: Office Shell or WScript.Shell text
    if:
      type: text
      regex: '(?i)(\bShell\s*["''(]|WScript\.Shell)'
    unless:
      - id: metadata/package/files/msi/identity::msi-installation-database-title
    not:
      - regex: createObjectURL
