defaults:
  platforms: [unix]
  for: [shell, scripts]
  crit: notable
  conf: 0.85
  attack: T1059.004
traits:
  - id: variable-text-piped-into-shell-stdin
    desc: Variable contents piped into a shell
    if:
      type: text
      regex: '(?m)^\s*(print\s+-r\s+--|echo)\s+"\$\{?\w+\}?"\s*\|\s*(/bin/)?(zsh|bash|sh)\s*$'
  # A build smoke test feeds an inline snippet to the just-built interpreter
  # over stdin (e.g. echo '<?php ...' | ./sapi/cli/php). Verifying local
  # execution proves nothing about a remote host, so this is not an upload
  # payload; it only establishes the interpreter runs.
  - id: php-snippet-piped-into-php-stdin
    desc: PHP snippet piped into php standard input
    if:
      type: text
      regex: '<\?php[^|\n]{0,300}\|\s*\S*php\b'
