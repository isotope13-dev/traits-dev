defaults:
  platforms: [windows]
  for: [vbs, asp, html]
  attack: T1059.003

traits:
  - id: shell-debug-stdin-redirect
    desc: Shell redirects file into debug.exe stdin
    crit: notable
    conf: 0.95
    for: [vbs, asp, html, javascript, batch]
    if:
      type: text
      regex: '\b(cmd(\.exe)?|command(\.com)?)\s+/c\s+[^\r\n]{0,32}\bdebug(\.exe)?\s*<'
      case_insensitive: true

  - id: chr-frag-deb-prefix
    desc: Chr-encoded fragment matching "deb"
    crit: component
    conf: 0.75
    if:
      type: text
      regex: 'chrw?\(\s*(68|100)\s*\)\s*[&+]\s*chrw?\(\s*(69|101)\s*\)\s*[&+]\s*chrw?\(\s*(66|98)\s*\)'
      case_insensitive: true

  - id: chr-frag-bug-mid
    desc: Chr-encoded fragment matching "bug"
    crit: component
    conf: 0.75
    if:
      type: text
      regex: 'chrw?\(\s*(66|98)\s*\)\s*[&+]\s*chrw?\(\s*(85|117)\s*\)\s*[&+]\s*chrw?\(\s*(71|103)\s*\)'
      case_insensitive: true

  - id: chr-frag-xe-lt
    desc: Chr-encoded fragment matching "xe<"
    crit: component
    conf: 0.85
    if:
      type: text
      regex: 'chrw?\(\s*(88|120)\s*\)\s*[&+]\s*chrw?\(\s*(69|101)\s*\)\s*[&+]\s*chrw?\(\s*60\s*\)'
      case_insensitive: true

  - id: chr-frag-ug-lt
    desc: Chr-encoded fragment matching "ug<"
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'chrw?\(\s*(85|117)\s*\)\s*[&+]\s*chrw?\(\s*(71|103)\s*\)\s*[&+]\s*chrw?\(\s*60\s*\)'
      case_insensitive: true

composite_rules:
  - id: chr-encoded-debug-stdin-redirect
    desc: Chr-encoded debug.exe stdin redirect command
    crit: notable
    conf: 0.96
    near_bytes: 160
    all:
      - id: chr-frag-deb-prefix
      - id: chr-frag-bug-mid
    any:
      - id: chr-frag-xe-lt
      - id: chr-frag-ug-lt

  - id: any-debug-stdin-redirect
    desc: DOS debug.exe stdin redirection command
    crit: notable
    conf: 0.96
    for: [vbs, asp, html, javascript, batch]
    any:
      - id: shell-debug-stdin-redirect
      - id: chr-encoded-debug-stdin-redirect
