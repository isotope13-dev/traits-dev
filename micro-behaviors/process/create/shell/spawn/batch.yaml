defaults:
  platforms: [windows, unix]
  for: [batch, powershell, javascript, html, python, shell]
  attack: T1059.003
traits:
  - id: batch-loop-variable-command
    desc: Executes batch loop variable as command
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\)\s+do\s+(call\s+)?%{1,2}[a-z]\b'
  - id: for-f-finger-loop
    desc: Captures remote Finger output in for /f
    crit: notable
    conf: 0.94
    if:
      # Preserve cmd.exe caret escapes in the executable token. Require the
      # Finger user@host query shape so prose mentioning finger.exe cannot
      # satisfy the matcher.
      type: text
      regex: '(?i)\bfor\s+/f\b[^\r\n]{0,200}\bf\^*i\^*n\^*g\^*e\^*r(\.exe)?\s+[\w.-]{1,64}@'
