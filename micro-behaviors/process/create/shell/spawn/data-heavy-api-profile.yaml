defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - binaries
composite_rules:
- id: data-heavy-shell-api-profile
  desc: Data-dominant binary contains shell-execution API references
  crit: notable
  conf: 0.9
  all:
  - id: metadata/binary/section/ratio::data-section-1p5x-code
  - id: micro-behaviors/process/create/shell/spawn::shell-execution-comp
  unless:
  - id: metadata/signed/platform::apple
  - id: well-known/tool/sysadmin/unetbootin/
  - id: metadata/lang/compiler/native::ocaml-native-runtime-marker
  - id: well-known/game/cheat::nm7-cheat-context
