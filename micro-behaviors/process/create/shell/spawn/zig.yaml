defaults:
  platforms: [unix, windows]
  for: [zig]
  attack: T1059
traits:
  - id: zig-child-run
    desc: Zig std.process.Child.run() usage
    crit: notable
    conf: 0.8
    if:
      type: text
      word: Child.run
  - id: zig-child-run-shell-c
    desc: Zig runs /bin/sh -c command
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'std\.process\.Child\.run[\s\S]{0,180}/bin/sh[\s\S]{0,80}-c'
