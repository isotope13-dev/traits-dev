# A PHP exec call whose command line carries the requesting client's own
# address and source port. The only use for that pair is to identify the
# live HTTP connection, which a helper binary can then locate (findsock,
# getpeername over inherited fds) and wire a shell onto.
defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1059
traits:
- id: php-exec-client-addr-port-args
  desc: Exec command carries client IP and port
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(system|exec|passthru|popen|proc_open)\s*\([^;]{0,99}REMOTE_ADDR[^;]{0,60}REMOTE_PORT'
