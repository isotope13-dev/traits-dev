defaults:
  platforms:
    - linux
    - macos
    - windows
  for:
    - shell
traits:
  - id: python-execute-command-function
    desc: Defines a Python execute_command helper
    crit: component
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\bdef\s+execute_command\s*\('
  - id: xargs-bash-c
    desc: xargs launches bash -c command
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'xargs.{0,50}bash\s+-c'

  # The shell `exec` builtin replaces the current process image with a program
  # (execve, no fork) — process creation, per TAXONOMY `process/create/ (spawn,
  # exec)`. Relocated from process/interpreter/eval (that dir is for code
  # interpreters/eval; `exec` runs a binary, it does not interpret a string).
  - id: shell-exec
    desc: Uses shell exec to replace process
    crit: notable
    conf: 0.5
    attack: T1059
    if:
      type: symbol
      exact: exec
    unless:
      # `exec N<>/dev/tcp/...` opens a Bash file descriptor; it does not
      # replace the shell with a child process.
      - type: text
        regex: '(?m)^\s*exec\s+[0-9]+\s*(<>|>&|<&\s*)'
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
      - id: well-known/tool/development/gradle-wrapper/
  - id: shell-shell
    desc: Bash shell reference
    crit: notable
    conf: 0.7
    if:
      type: string_literal
      regex: (?i)\bbash\s+-[ci]\b
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: system-symbol
    desc: System-named native or source symbol
    crit: baseline
    conf: 0.8
    for: [c, cpp, objc, macho, elf, pe, dll]
    platforms: [unix, windows, openwrt]
    if:
      type: symbol
      exact: system
  - id: shell-execution-shm
    desc: Execution from shared memory (/dev/shm)
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)/dev/shm/[a-zA-Z0-9._-]+\b'
  - id: shell-execution-current-dir
    desc: Execution from current directory (./file)
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(?m)^\s*\./[a-zA-Z0-9._-]+\b'
    not:
      - regex: '(?m)^\s*\./(usr|etc|var|boot|bin|lib)\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
      - id: metadata/package/testing/harness/runtime/
      - id: micro-behaviors/process/create/shell/git::git-operations-1
      - id: micro-behaviors/process/create/shell/git::git-operations-2
      - id: metadata/binary/installer/script::install4j-unix-sfx
      - id: metadata/file/metrics::high-byte-script-text
composite_rules:
  - id: system-fn
    desc: References C system command-execution API
    crit: notable
    conf: 0.9
    for: [c, cpp, objc, macho, elf, pe, dll]
    platforms: [unix, windows, openwrt]
    all:
      - id: system-symbol
    any:
      - id: micro-behaviors/process/create/system-api/
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: go-shell-strings
    desc: Go shell execution strings
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/process/create/system::go-os-exec
      - id: micro-behaviors/process/create/shell/lang::exec-cmd-run
      - id: micro-behaviors/process/create/shell/lang::stdio-or-pipe-redirection
