defaults:
  platforms: [unix, windows]
  for: [pickle]

traits:
  - id: pickle-pty-shell-spawn
    desc: Pickle source spawns a shell through pty
    platforms: [unix]
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'pty\.spawn\(\s*["'']/bin/(ba|da|z|k)?sh["'']\s*\)'

  - id: pickle-os-system-python-command
    desc: Pickle source contains os.system Python command
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\bos\.system\(\s*["'']python[23]?\s+-c\s'
