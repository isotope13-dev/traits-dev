defaults:
  platforms: [windows]
  for: [csharp]
traits:
  - id: csharp-cmd-command-text
    desc: Process.Start passes command text to cmd.exe /c
    crit: notable
    conf: 0.98
    attack: T1059.003
    if:
      type: tree-sitter
      kind: call
      regex: 'Process\.Start\(\s*"cmd\.exe"\s*,\s*"/c[ ]*"\s*\+'
