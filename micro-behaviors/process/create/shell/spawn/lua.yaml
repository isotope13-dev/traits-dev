defaults:
  platforms: [unix, windows]
  for: [lua]
  attack: T1059.004
traits:
  - id: lua-os-execute
    desc: Lua os.execute() function call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: os.execute
  # Two spellings of the same capability, so one matcher covers both.
  # Localizing a global is a standard Lua idiom (`local popen = io.popen`)
  # and it moves the target out of the symbol view — the call site records
  # only the local name, so a `symbol exact: io.popen` matcher goes blind
  # whether the author aliased it for speed or to dodge that matcher.
  # Requiring a call paren or an assignment keeps bare prose mentions out.
  - id: lua-io-popen
    desc: Lua io.popen() shell command execution
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'io\.popen\s*\(|=\s*io\.popen'
