defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  for: [lua]
  attack: T1059.004
traits:
  - id: lua-os-execute
    desc: Lua os.execute() function call
    if:
      type: symbol
      exact: os.execute
