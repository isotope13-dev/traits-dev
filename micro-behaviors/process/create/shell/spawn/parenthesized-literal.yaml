defaults:
  platforms: [windows, unix]
  for: [scripts, source]
traits:
  - id: parenthesized-command-literal
    desc: Parenthesized shell command string
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '(?i)(\$\(|%24%28)\s*(id|sh|bash|curl|wget|nc|rm|kill|whoami|uname)\b[^\r\n)]{0,40}(\)|%29)'

