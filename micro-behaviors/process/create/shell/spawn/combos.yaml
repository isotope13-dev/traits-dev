defaults:
  platforms: [unix, windows, macos]
# Composite Command Execution Capabilities
composite_rules:
  - id: native-node-addon-shell-exec
    desc: Native Node addon can execute a POSIX shell
    crit: notable
    conf: 0.95
    platforms: [linux]
    for: [elf]
    all:
      - id: metadata/binary/framework::node-api-addon-export
      - id: bin-sh-binary-text
      - id: micro-behaviors/process/create/execv::c-exec-variants
  - id: shell-execution-capability
    desc: Executes commands through a shell
    crit: notable
    mbc: "E1059"
    attack: "T1059"
    conf: 0.9
    any:
      - id: micro-behaviors/process/create/system::python-os-system
      - id: micro-behaviors/process/create/subprocess::os-popen-ast
      - id: micro-behaviors/process/create/shell/spawn::php-shell-exec

  - id: shell-execution-comp
    desc: Shell command execution capability
    crit: notable
    mbc: "E1059"
    attack: "T1059"
    conf: 0.9
    any:
      - id: micro-behaviors/process/create/shell/spawn::xargs-bash-c
      - id: micro-behaviors/process/create/shell/spawn::shell-exec
      - id: micro-behaviors/process/create/shell/spawn::shell-shell
      - id: micro-behaviors/process/create/shell/spawn::system-fn
      - id: micro-behaviors/process/create/shell/spawn::shell-execution-shm
      - id: micro-behaviors/process/create/shell/spawn::shell-execution-current-dir
      - id: micro-behaviors/process/create/shell/script-host/
    unless:
      - id: metadata/lang/source::openapi-generator-source-banner
      - id: metadata/library/math/native::bundled-math-native-library-context
      - id: well-known/tool/detection/security-remediation::compiled-remediation-catalog
      - id: well-known/tool/development/gradle-wrapper/
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  - id: shell-with-dev-null
    desc: Shell invocation with /dev/null redirection
    crit: component
    conf: 0.6
    all:
      - id: micro-behaviors/process/interpreter/shell::bin-sh
      - id: micro-behaviors/fs/path/device/special::dev-null
