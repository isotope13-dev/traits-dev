defaults:
  platforms: [unix, windows, macos]
# Composite Command Execution Capabilities
composite_rules:
  - id: shell-execution-capability
    desc: Executes commands through a shell
    crit: notable
    mbc: "E1059"
    attack: "T1059"
    conf: 0.9
    any:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/process/create/shell/command-mode::python-os-popen-call
      - id: micro-behaviors/process/create/shell/spawn::php-shell-exec
