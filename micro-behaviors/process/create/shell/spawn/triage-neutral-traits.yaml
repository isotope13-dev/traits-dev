---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- conf: 0.85
  id: pm2-start-command-reference
  desc: PM2 process-start command reference
  if:
    type: string_literal
    regex: pm2\s+start|exec\(.{0,220}pm2\s+start
- id: await-shell-template-command
  desc: Awaits a shell-template command invocation
  conf: 0.86
  if:
    type: text
    regex: "\\bawait\\s+\\$\\s*`"
