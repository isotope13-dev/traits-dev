# Neutral source observation; runtime execution is not asserted.
defaults:
  platforms:
  - linux
  for:
  - go
traits:
- id: go-login-shell-command-constructor
  desc: Go command constructor selects /bin/sh -lc
  crit: notable
  if:
    type: tree-sitter
    language: go
    query: |
      ((call_expression
        function: (selector_expression operand: (identifier) @package field: (field_identifier) @method)
        arguments: (argument_list
          . (interpreted_string_literal) @shell
          . (interpreted_string_literal) @flags
          . (_) .)) @evidence
       (#eq? @package "exec")
       (#eq? @method "Command")
       (#eq? @shell "\"/bin/sh\"")
       (#eq? @flags "\"-lc\"")
       (#set! cleave.ignore-comments "true"))
