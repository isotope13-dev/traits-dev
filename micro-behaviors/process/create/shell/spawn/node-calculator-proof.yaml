defaults:
  platforms: [windows]
  for: [javascript, typescript]

traits:
  - id: node-cmd-calculator-launch
    desc: Spawns cmd with Calculator in arguments
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn(Sync)?$'
      args:
        - index: 0
          kind: string
          regex: '^cmd(\.exe)?$'
        - index: 1
          from:
            value: '^calc(\.exe)?$'
