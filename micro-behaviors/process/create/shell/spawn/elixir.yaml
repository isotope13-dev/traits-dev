defaults:
  for: [elixir]
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.95

traits:
  - id: elixir-system-shell
    desc: Elixir executes shell command
    if:
      type: symbol
      kind: call
      exact: System.shell

  - id: elixir-system-cmd-unix-shell
    desc: Elixir launches Unix command shell
    platforms: [linux, macos]
    if:
      type: symbol
      kind: call
      exact: System.cmd
      arg:
        index: 0
        kind: string
        regex: '^(/(usr/)?bin/)?(sh|bash|zsh)$'

  - id: elixir-system-cmd-windows-shell
    desc: Elixir launches Windows command shell
    platforms: [windows]
    if:
      type: symbol
      kind: call
      exact: System.cmd
      arg:
        index: 0
        kind: string
        regex: '^(?:cmd[.]exe|powershell[.]exe|pwsh)$'
