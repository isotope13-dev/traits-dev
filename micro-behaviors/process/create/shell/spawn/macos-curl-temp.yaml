# Curl, a temp path and a shell/task launch coexist without a fetched-path
# handoff to that launch.
defaults:
  platforms: [macos]
  for: [macho]

composite_rules:
  - id: macos-curl-temp-launch-profile
    desc: Mach-O curl, temp-path and shell/task-launch clues
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/process/create/shell/spawn::curl-cli-binary
      - id: micro-behaviors/fs/path/temp::unix-temp
    any:
      - id: micro-behaviors/process/create/shell/spawn::nstask-launch
      - id: micro-behaviors/process/create/shell/spawn::bin-zsh-binary
