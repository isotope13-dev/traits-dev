defaults:
  crit: notable
  for: [nupkg]
  platforms: [windows, unix]
  attack: T1059.001
composite_rules:
  - id: nuget-tool-hidden-shell-github-api-profile
    desc: NuGet tool hidden-shell/GitHub API profile
    conf: 0.98
    scope: outer
    for: [nupkg, xml, pe]
    all:
      - id: metadata/package/entrypoint::dotnet-tool-command-manifest
      - id: micro-behaviors/process/create/shell/spawn::managed-github-hidden-shell-api-profile

  - id: nuget-library-hidden-shell-github-api-profile
    desc: NuGet library hidden-shell/GitHub API profile
    conf: 0.98
    scope: archive
    for: [nupkg, pe, csharp]
    all:
      - id: metadata/package/files/nuget::nupkg-managed-library-member
      - id: micro-behaviors/process/create/shell/spawn::managed-github-hidden-shell-api-profile

  - id: nuget-library-hidden-shell-http-api-profile
    desc: NuGet executable hidden-shell/HTTP API profile
    conf: 0.97
    scope: archive
    for: [nupkg, pe, csharp]
    all:
      - id: metadata/package/files/nuget::nupkg-single-executable-member
      - id: micro-behaviors/process/create/shell/spawn::managed-http-hidden-shell-api-profile

