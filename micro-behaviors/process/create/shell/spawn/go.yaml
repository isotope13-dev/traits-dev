defaults:
  crit: notable
  platforms: [windows, unix]
  for: [go]
  attack: T1059
traits:
  # The matcher must establish the PowerShell context itself: a bare
  # "-Command" string also occurs as an unrelated tool flag, so the atom
  # requires the interpreter name on the same line ahead of the flag. This
  # covers both Go invocation shapes -- the argv-array form
  # ("powershell", ..., "-Command") and the single-string form
  # ("powershell -Command ...").
  - id: go-powershell-command-flag
    desc: PowerShell -Command flag as Go string
    conf: 0.7
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\b[^\r\n]{0,120}["'']?-Command\b'
  - id: go-exec-command-bin-sh
    desc: Go exec.Command runs /bin/sh directly
    conf: 0.8
    platforms: [unix]
    if:
      type: text
      regex: exec\.Command\s*\(\s*"/bin/sh"

composite_rules:
  - id: go-windows-powershell-dispatch
    desc: Go dispatches command via PowerShell
    conf: 0.85
    all:
      - id: go-powershell-command-flag
      - id: micro-behaviors/process/create/subprocess::go-exec-command-call
    any:
      # Either leg establishes the PowerShell interpreter identity. The
      # symbol call with an exact "powershell" program argument covers the
      # argv-array shape ("powershell", ..., "-Command"); the generic shell
      # keyword covers the single-string shape ("powershell -Command ..."),
      # whose `powershell -X` adjacency the argv-array shape never produces.
      - id: micro-behaviors/process/create/subprocess::go-powershell-command
      - id: micro-behaviors/process/argument/option::powershell-command-options-text
