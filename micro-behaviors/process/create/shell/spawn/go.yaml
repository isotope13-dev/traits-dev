defaults:
  crit: notable
  platforms: [windows, unix]
  for: [go]
  attack: T1059
traits:
  - id: go-powershell-command-flag
    desc: PowerShell -Command flag as Go string
    conf: 0.7
    if:
      type: string_literal
      exact: "-Command"
  - id: go-exec-command-bin-sh
    desc: Go exec.Command runs /bin/sh directly
    conf: 0.8
    platforms: [unix]
    if:
      type: text
      regex: exec\.Command\s*\(\s*"/bin/sh"

composite_rules:
  - id: go-windows-powershell-dispatch
    desc: Go dispatches command via PowerShell
    conf: 0.85
    all:
      - id: micro-behaviors/process/create/shell/lang::powershell-keyword
      - id: go-powershell-command-flag
      - id: micro-behaviors/process/create/exec::go-exec-command-call
