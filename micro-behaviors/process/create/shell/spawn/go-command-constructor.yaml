# Parsed source form; receiver identity and execution are not established.
defaults:
  for:
  - go
  platforms:
  - unix
  - windows
traits:
- id: go-shell-command-constructor
  desc: Go command constructor selects a shell
  crit: component
  if:
    type: tree-sitter
    language: go
    query: |
      ((call_expression
       function: (selector_expression operand: (identifier) @package field: (field_identifier) @method)
       arguments: (argument_list  . (interpreted_string_literal) @shell . (interpreted_string_literal) @flags)) @evidence
       (#eq? @package "exec") (#eq? @method "Command")
       (#match? @shell "^\"(/bin/)?(ba)?sh\"$")
       (#match? @flags "^\"-[a-z]*c\"$")
       (#set! cleave.ignore-comments "true"))
      ((call_expression
       function: (selector_expression operand: (identifier) @package field: (field_identifier) @method)
       arguments: (argument_list . (_) . (interpreted_string_literal) @shell . (interpreted_string_literal) @flags)) @evidence
       (#eq? @package "exec") (#eq? @method "CommandContext")
       (#match? @shell "^\"(/bin/)?(ba)?sh\"$")
       (#match? @flags "^\"-[a-z]*c\"$")
       (#set! cleave.ignore-comments "true"))
