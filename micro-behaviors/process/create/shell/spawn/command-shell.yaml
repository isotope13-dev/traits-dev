defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-spawn-command-shell
    desc: Spawn call names a command shell
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn$'
      arg:
        index: 0
        kind: string
        regex: '^((/usr)?/bin/(ba|z)?sh|(ba|z)?sh|cmd(\.exe)?|powershell(\.exe)?)$'
