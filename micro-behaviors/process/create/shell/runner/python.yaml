# Neutral observation: a call to a helper named run_command. Common in GIS,
# build, and agent frameworks; intent comes from composites that combine this
# with remote-tasking or payload-dispatch evidence.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.85

traits:
  - id: python-run-server-shell-call
    desc: Calls run_server with a shell argument
    conf: 0.92
    if:
      type: text
      regex: '\brun_server\s*\([^\r\n]{0,160}\bshell\s*='

  - id: python-run-connect-shell-call
    desc: Calls run_connect with a shell argument
    conf: 0.92
    if:
      type: text
      regex: '\brun_connect\s*\([^\r\n]{0,160}\bshell\s*='

  - id: python-run-command-call
    desc: Calls run_command helper
    if:
      type: symbol
      kind: call
      exact: run_command
