# Workflow engines commonly support explicit command nodes alongside other
# task kinds. Dispatching such a node through a shell is a neutral execution
# capability; remote-tasking intent requires independent transport evidence.
defaults:
  platforms: [windows, unix]
  for: [python, go]
  crit: notable
  conf: 0.96
  attack: T1059
  mbc: E1059

traits:
  - id: python-command-kind-branch
    desc: Python branches on command task kind
    crit: notable
    for: [python]
    if:
      type: text
      regex: '\bkind\s*==\s*["'']command["'']'

  - id: go-command-kind-shell-dispatch
    desc: Go command task invokes shell
    platforms: [unix]
    for: [go]
    if:
      type: text
      regex: '(?is)kind\s*==\s*["'']command["''][\s\S]{0,450}exec\.Command[\s\S]{0,100}["'']-c["'']'

composite_rules:
  - id: python-command-kind-shell-dispatch
    desc: Python command task invokes shell
    for: [python]
    all:
      - id: python-command-kind-branch
      - id: micro-behaviors/process/create/subprocess::shell-true
    near_lines: 30
