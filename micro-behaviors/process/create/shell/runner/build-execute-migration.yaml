defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
composite_rules:
  - id: rust-build-rs-shell-command
    desc: build.rs executes a shell command
    crit: notable
    conf: 0.9
    for:
      - rust
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: micro-behaviors/process/create/shell/runner::rust-shell-command-exec
  - id: setup-computed-platform-shell-command
    desc: Setup hook runs platform-selected shell command
    crit: suspicious
    conf: 0.95
    for:
      - python
    scope: leaf
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: micro-behaviors/process/create/subprocess/capture::check-output
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
      - id: micro-behaviors/data/collection/create::python-conditional-list-with-call
    any:
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-install
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-build-py
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-develop
