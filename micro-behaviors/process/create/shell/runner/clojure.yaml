# Command execution from Clojure. Two routes exist and both are worth naming:
# the `clojure.java.shell` wrapper, and direct JVM interop through
# `Runtime/getRuntime` or a `ProcessBuilder.` constructor. Clojure writes the
# same operations in slash-qualified interop form, so Java-spelling matchers do
# not cover a .clj or jar-embedded Clojure program.
defaults:
  platforms: [unix, windows]
  for: [clojure]
  crit: notable
  conf: 0.9
  attack: T1059
  mbc: E1203

traits:
  - id: clojure-java-shell-namespace
    desc: References the Clojure shell-command namespace
    if:
      type: text
      substr: clojure.java.shell

  # `(sh "bash" "-c" …)` after `[clojure.java.shell :refer [sh]]`, or the
  # aliased `(shell/sh …)` form. Anchored on the `/sh` tail plus the bare name
  # so a local helper called `wash` or `mesh` does not match.
  - id: clojure-shell-sh-call
    desc: Runs a command via Clojure sh
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '^([a-z][a-z0-9.-]{0,24}/)?sh$'

  - id: clojure-runtime-get-runtime
    desc: Gets the JVM Runtime for exec
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '^(java\.lang\.)?Runtime/getRuntime$'

  - id: clojure-process-builder-construct
    desc: Constructs a JVM ProcessBuilder from Clojure
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '^(java\.lang\.)?ProcessBuilder\.$'
