defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
  - text
  - data
traits:
- id: sqlserver-xp-windows-command
  desc: xp_cmdshell invokes Windows command
  crit: notable
  conf: 0.96
  downgrade:
    any:
    - id: metadata/vendor/copyright::secureauth-fortra-copyright-notice
  if:
    type: text
    regex: (?i)\bexec(ute)?\s+[\w.\[\]]*xp_cmdshell\]?\s+[^;\r\n]{0,160}\b(cmd|powershell|wmic)\b
  unless:
  - id: micro-behaviors/ui/help::escaped-local-command-reference
  - id: well-known/tool/development/toolchain/darling/
  - id: well-known/tool/offensive/impacket::source-tree-member
  - id: well-known/tool/offensive/pentestkit::local-storage-panel
  - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
  # Detection-rule corpora describe xp_cmdshell abuse as signature content.
  - id: well-known/tool/detection/emerging-threats::detection-ruleset
- id: sqlserver-xp-cmdshell-variable-command
  desc: xp_cmdshell statement with a variable command
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)\bexec(ute)?\s+[\w.\[\]]*xp_cmdshell\]?\s+['"]?\s*\$[\w{]
- id: sqlserver-ole-wscript-shell
  desc: SQL Server creates WScript.Shell object
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?is)sp_oacreate\s+['"]wscript\.shell['"]
- id: sqlserver-ole-run-method
  desc: SQL Server invokes OLE Run method
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: (?is)sp_oamethod.{0,160}['"]run['"]
