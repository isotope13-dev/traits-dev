defaults:
  platforms:
  - windows
  for:
  - text
  - data
traits:
- id: sqlserver-xp-windows-command
  desc: xp_cmdshell invokes Windows command
  for: [scripts, source, text, data]
  crit: suspicious
  conf: 0.96
  downgrade:
    any:
    - id: well-known/lib/network/impacket::impacket-copyright-banner
  if:
    type: text
    regex: (?i)\bexec(ute)?\s+[\w.\[\]]*xp_cmdshell\]?\s+[^;\r\n]{0,160}\b(cmd|powershell|wmic)\b
  unless:
  - id: well-known/tool/development/toolchain/darling/
  - id: well-known/tool/offensive/impacket::source-tree-member
- id: sqlserver-ole-wscript-shell
  desc: SQL Server creates WScript.Shell object
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?is)sp_oacreate\s+['"]wscript\.shell['"]
- id: sqlserver-ole-run-method
  desc: SQL Server invokes OLE Run method
  crit: suspicious
  conf: 0.97
  if:
    type: text
    regex: (?is)sp_oamethod.{0,160}['"]run['"]
