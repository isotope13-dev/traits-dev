defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, data]
  crit: notable
traits:
  - id: scalar-script-os-popen
    desc: Scalar script body calls os.popen
    conf: 0.98
    if:
      type: text
      # Stop conservatively at a slash, including the SQL script terminator,
      # instead of borrowing a shell call from a later client operation.
      # SQL is case insensitive; the Python module and member names are not.
      regex: '(?is:\bSCALAR\s+SCRIPT\b)[^/]{1,900}\bos\s*\.\s*popen\s*\('

# This supported database-to-OS bridge is reviewable, but does not by itself
# establish unwanted execution, root escalation, escape or persistence.
composite_rules:
  - id: scalar-script-shell-command
    desc: Database scalar script executes shell commands
    crit: suspicious
    conf: 0.98
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/db/schema/stored-code::scalar-script-definition
      - id: scalar-script-os-popen
