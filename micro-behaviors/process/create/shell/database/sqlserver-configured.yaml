defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
  - text
  - data
composite_rules:
- id: sqlserver-enabled-xp-cmdshell-command
  desc: xp_cmdshell enablement and Windows command statements coexist
  crit: notable
  conf: 0.99
  all:
  - id: micro-behaviors/data/db/config::sqlserver-enable-xp-cmdshell
  - id: sqlserver-xp-windows-command
- id: sqlserver-enabled-xp-cmdshell-variable-command
  desc: xp_cmdshell enablement and variable command statements coexist
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/data/db/config::sqlserver-enable-xp-cmdshell
  - id: sqlserver-xp-cmdshell-variable-command
