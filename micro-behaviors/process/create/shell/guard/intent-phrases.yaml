# A coding-agent CLI that screens a user's request before running it carries a
# table of the destructive intents it warns about: `rm -rf /`, a fork bomb,
# "format the disk", "wipe the disk", "drop database", "force push".  The
# phrases are the screen's subject matter, kept as data beside the warning it
# prints; the binary never runs them.  Three English intent phrases in one
# run of table rows is that screen, which a wiper has no reason to spell out.
defaults:
  platforms: [unix, windows]
  for: [binaries, rust]
  crit: notable
  conf: 0.9

traits:
  - id: destructive-intent-phrase-table
    desc: Table of destructive-intent phrases to warn on
    if:
      type: text
      regex: 'format the disk.{0,8}wipe the disk.{0,8}drop database'
