# A command-risk catalog labels each dangerous token with what it would do:
# `chmod 777` next to "world-writable chmod", `dd if=` next to "raw device
# write via dd", `> /dev/sd*` next to "direct device write". The label is the
# discriminator: a program that *runs* these commands has no reason to ship
# the risk descriptions alongside them, while a classifier that reports what a
# proposed command would do packs its rule table exactly this way. Linkers lay
# each token/label pair down as adjacent string constants, so the pairs sit
# flush in the binary's read-only data -- the adjacency is structural, not
# proximity luck.
#
# Two different labeled pairs are required because a single pair can appear in
# security prose or a training deck; a table of them is a guard catalog.
#
# Filed beside dangerous-command-refusal-list, which catches the full
# command-spelling form (`chmod -R 777 /`, `dd if=/dev/zero of=/dev/`). This
# one catches the labeled-token form, where the matched token is a bare
# prefix (`dd if=`) or a redirect (`> /dev/sd`) and the verdict text, not the
# command spelling, carries the signal.
defaults:
  platforms: [unix, windows]
  # Raw matchers are capped at three explicit file types; native binaries are
  # where linkers lay the token/label pairs out flush.
  for: [elf, macho, pe]
  crit: notable
  conf: 0.9

traits:
  - id: risk-label-world-writable-chmod
    desc: chmod 777 beside world-writable label
    if:
      type: raw
      regex: '(?i)chmod\s+777.{0,12}world-writable chmod'

  - id: risk-label-device-write-via-dd
    desc: dd token beside raw-device-write label
    if:
      type: raw
      regex: '(?i)dd\s+if=.{0,12}raw device write via dd'

  - id: risk-label-direct-device-write
    desc: device redirect beside direct-write label
    if:
      type: raw
      regex: '(?i)>\s*/dev/(sd|hd|nvme|xvd).{0,12}direct device write'

composite_rules:
  - id: dangerous-command-risk-catalog
    desc: Labeled dangerous-command risk catalog
    # The guard-catalog reading needs the labels to agree on at least two
    # command classes; one labeled pair alone is documentation-grade.
    near_bytes: 256
    needs: 2
    any:
      - id: risk-label-world-writable-chmod
      - id: risk-label-device-write-via-dd
      - id: risk-label-direct-device-write
