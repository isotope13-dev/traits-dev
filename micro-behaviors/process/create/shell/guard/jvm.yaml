# A JVM module that screens terminal commands before they leave the machine
# keeps the screen as data: regexes for secret-bearing flags (`--client-secret`,
# `--auth-token`), secret-named environment assignments, credential file
# paths and commands that read them (`/etc/shadow`, `aws sts`, `kubectl get
# secret`, `tcpdump`). Those names are what it redacts or refuses to forward,
# not paths it opens or tools it checks for. A program acting on them would not
# also carry the flag patterns that make the command safe to share.
defaults:
  platforms: [unix, windows]
  for: [class, java_class, java, kotlin]
  crit: notable
  conf: 0.9

traits:
  - id: command-client-secret-flag-pattern
    desc: Regex for a --client-secret command flag
    if:
      type: text
      substr: '\s--client-secret'
  - id: command-auth-token-flag-pattern
    desc: Regex for an --auth-token command flag
    if:
      type: text
      substr: '\s--auth-token'
  - id: command-secret-env-name-pattern
    desc: Regex for secret-named env assignments
    if:
      type: text
      substr: 'PASSWORD|SECRET|TOKEN|API_KEY'

composite_rules:
  - id: jvm-command-secret-redaction-patterns
    desc: JVM screens commands for secret-bearing arguments
    all:
      - id: command-client-secret-flag-pattern
      - id: command-auth-token-flag-pattern
      - id: command-secret-env-name-pattern
