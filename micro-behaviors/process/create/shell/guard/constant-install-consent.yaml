defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: constant-yes-install-branch
    desc: Constant yes enables shell install branch
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (variable_declaration (variable_declarator
            name: (identifier) @consent value: (string (string_fragment) @yes)))
          . (comment)*
          . (if_statement condition: (parenthesized_expression
            (binary_expression left: (identifier) @checked operator: "==="
              right: (string (string_fragment) @expected)))
            consequence: (statement_block
              (try_statement body: (statement_block
                (expression_statement (call_expression
                  function: (identifier) @exec
                  arguments: (arguments (binary_expression) @command)))))))) @branch
          (#eq? @consent @checked)
          (#eq? @yes "yes")
          (#eq? @expected "yes")
          (#match? @exec "^(exec|execSync)$")
          (#match? @command "npm install -g "))
