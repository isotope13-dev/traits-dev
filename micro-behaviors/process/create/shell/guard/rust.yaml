# A Rust command-line analyzer keeps its rules as data: each row carries an id,
# a weight, the ATT&CK technique ids it maps to (`&["T1490"]`) and the regex
# that recognizes the command. Twenty-odd such rows are a catalog of what to
# alert on. The command strings inside it (vssadmin delete shadows, wevtutil
# cl, bcdedit recoveryenabled) are the analyzer's subject matter; the file
# never runs them. A program that acts on the commands carries no ATT&CK
# mapping table.
defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.95
  size_min: 500

traits:
  - id: rust-attack-technique-array-rows
    desc: Rust table of ATT&CK technique id arrays
    count_min: 20
    if:
      type: text
      regex: '&\["T[0-9]{4}(\.[0-9]{3})?"'
