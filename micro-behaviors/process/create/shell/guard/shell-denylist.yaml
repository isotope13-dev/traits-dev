# A shell hook gate for an AI coding agent keeps the destructive commands it
# refuses as a data array (`BLOCKED_PATTERNS=("rm -rf ~" ...)`), compares the
# proposed command against each entry with a glob match, and answers with a
# deny verdict. Every entry is the gate's subject matter; nothing in the file
# runs it. Neither half is evidence alone -- a variable name is free to
# choose, and a deny verdict is common -- so the exception needs both: the
# named block-list array and the deny answer emitted by the same script.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.9

traits:
  - id: shell-blocked-pattern-array
    desc: Shell array of blocked command patterns
    if:
      type: text
      regex: '(?m)^[ \t]*(BLOCKED|DENIED|DANGEROUS|FORBIDDEN)_[A-Z_]{0,12}=\('

  - id: shell-deny-verdict-emitted
    desc: Shell script emits a deny decision
    if:
      type: text
      regex: 'decision\\?":\s*\\?"deny\\?"'

  - id: typescript-agent-shell-preexecution-hook
    desc: TypeScript agent pre-execution shell hook
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)ctx\.shell\.hook\s*\(\s*["'']create\.before["'']'

composite_rules:
  - id: shell-command-denylist-gate
    desc: Shell hook gate denying listed commands
    crit: exception
    all:
      - id: shell-blocked-pattern-array
      - id: shell-deny-verdict-emitted
