# A native program with an AI agent or terminal tool screens the commands it is
# asked to run against a built-in refusal list: `rm -rf /*`, `rm
# --no-preserve-root`, raw writes to /dev/sd*, the `:(){ :|:& };:` fork bomb,
# `chmod -R 777 /`. The strings are packed back to back in the binary's string
# table because the program compares each proposed command against them and
# rejects a match. A wiper has no reason to spell a dd-to-device command,
# a recursive chmod and a recursive chown as one adjacent list.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.9

traits:
  - id: refusal-entry-dd-zero-to-device
    desc: dd zero-fill of a device entry
    if:
      type: text
      substr: 'dd if=/dev/zero of=/dev/'

  - id: refusal-entry-recursive-chmod-root
    desc: Recursive world-writable chmod of root entry
    if:
      type: text
      substr: 'chmod -R 777 /'

  - id: refusal-entry-recursive-chown-root
    desc: Recursive chown of root entry
    if:
      type: text
      substr: 'chown -R root /'

composite_rules:
  - id: dangerous-command-refusal-list
    desc: Packed list of destructive commands to refuse
    near_bytes: 400
    all:
      - id: refusal-entry-recursive-chown-root
      - id: refusal-entry-dd-zero-to-device
      - id: refusal-entry-recursive-chmod-root
