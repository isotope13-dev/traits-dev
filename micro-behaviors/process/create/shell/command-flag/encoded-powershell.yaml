defaults:
  platforms:
  - windows
  attack: T1059.001
  crit: notable
traits:
- for:
  - powershell
  id: powershell-encoded-command-call
  desc: PowerShell call carries encoded-command flag
  conf: 0.85
  if:
    type: tree-sitter
    kind: call
    regex: (?i)powershell(\.exe)?\s+.{0,60}\s-(enc|encodedcommand|e)\b
- for:
  - vbs
  id: vbs-powershell-encoded-command-text
  desc: VBScript PowerShell encoded-command text
  conf: 0.93
  if:
    type: text
    regex: powershell(\.exe)?\s[^"]{0,80}-enc\b
