defaults:
  platforms: [windows]
  for: [lnk]
composite_rules:
  # These operations co-occur in one argument field. They neither establish
  # matching source/destination paths nor prove a usable shortcut target,
  # a supplied payload, or malicious intent.
  - id: lnk-headless-extract-copy-batch-commands
    desc: LNK headless shell, extraction and batch commands
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/data/archive/extract/tar::lnk-tar-temp-extraction
      - id: micro-behaviors/fs/file/copy::lnk-temp-config-to-batch-copy
      - id: lnk-temp-batch-command-tail
      - id: lnk-conhost-headless-cmd
