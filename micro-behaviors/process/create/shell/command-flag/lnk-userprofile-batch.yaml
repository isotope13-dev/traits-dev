defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable
traits:
  - id: lnk-userprofile-batch-command-tail
    desc: LNK chains a USERPROFILE batch invocation
    conf: 0.98
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)&&\s*"?%USERPROFILE%\\[^"&\r\n]{1,160}\.(bat|cmd)"?\s*$'
