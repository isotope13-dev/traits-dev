defaults:
  platforms: [windows]
  crit: notable
  conf: 0.88

traits:
  - id: powershell-c-flag
    desc: PowerShell command flag -c
    for: [powershell, batch, pe]
    if:
      type: text
      regex: '(?i)\bpowershell(\.exe)?[^\r\n]{0,120}\s+-(c|command)\b'

  - id: python-powershell-command-option
    desc: Python text has PowerShell option
    conf: 0.9
    platforms: [windows, unix]
    for: [python]
    if:
      type: text
      regex: '(?i)\bpowershell(\.exe)?\b.{0,80}-(Command|EncodedCommand)\b'
  # powershell-flagged-command-line is deliberately scoped to for: [vbs,
  # html] only (see its own comment) to avoid matching any plain-text file
  # that quotes a PowerShell command. setup.py building a PowerShell
  # command-line string is the same shape, one language over.
  - id: python-string-powershell-flagged-command
    desc: PowerShell flag in a string
    for: [python]
    platforms: [unix, windows]
    conf: 0.9
    attack: T1059.001
    if:
      type: string_literal
      regex: '(?i)\bpowershell(\.exe)?\b\s+[-/][A-Za-z]'

composite_rules:
  - id: powershell-command-launch
    desc: Batch invokes PowerShell with -c
    crit: notable
    conf: 0.86
    for: [batch]
    all:
      - id: micro-behaviors/process/create/shell/lang::powershell-invocation
      - id: powershell-c-flag
