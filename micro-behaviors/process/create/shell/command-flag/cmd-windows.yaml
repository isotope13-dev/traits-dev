# Windows `cmd.exe` invocation flags. `/c` runs the command and exits; `/k`
# runs it and *keeps the console open*, which means the caller wanted a human
# looking at the window. Neutral on its own — troubleshooting helpers and
# developer launchers use it — but it is the discriminator between a silent
# helper process and a deliberately user-visible console, so composites that
# care about that distinction need it as a separate atom from `/c`.
defaults:
  platforms: [windows]
  for: [scripts, source]
  crit: notable
  conf: 0.85

traits:
  - id: cmd-k-persistent-console
    desc: cmd.exe launched with the persistent /k flag
    if:
      type: text
      regex: '(?i)cmd(\.exe)?[''"]?\s*[,\s]\s*[''"]?/k\b'
