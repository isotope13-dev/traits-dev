# A `-c` style command option whose quoted value starts with a shell
# (powershell, cmd, /bin/sh). Neutral: payload generators, test harnesses and
# launchers all build these; the ViewState composites add the intent.
traits:
- id: c-option-names-shell
  desc: "-c option value names a shell"
  for: [scripts, source, -php, -perl, -lua, -applescript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.98
  if:
    type: text
    # The value must be a quoted literal: `["python", "-c", cmd]` passes a
    # variable named cmd, not a command shell.
    regex: '(?i)(^|[\s"'',\[])-c["'']?\s*,?\s*f?["''](powershell|cmd(\.exe)?|/bin/(ba)?sh)\b'
