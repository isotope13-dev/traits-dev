defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-conhost-headless-cmd
    desc: LNK arguments specify headless conhost cmd /c
    crit: notable
    conf: 0.94
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bconhost(\.exe)?\s+--headless\s+cmd(\.exe)?\s+/c\b'
