defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-cmd-c-argument
    desc: LNK cmd /c argument
    crit: notable
    conf: 0.9
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bcmd(\.exe)?\s+/c\b'
  - id: lnk-forfiles-c-argument
    desc: LNK forfiles arguments use /c
    crit: notable
    conf: 0.9
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bforfiles(\.exe)?\b[^\r\n]{0,120}\s/c\b'
  - id: lnk-conhost-headless-cmd
    desc: LNK arguments specify headless conhost cmd /c
    crit: notable
    conf: 0.94
    if:
      type: value
      path: lnk.arguments
      # conhost may be caret-escaped (con^host) and cmd may enable delayed
      # expansion (/v:on) before /c; both spellings run the same hidden
      # command proxy.
      regex: '(?i)\bcon\^?host(\.exe)?\s+--headless\s+cmd(\.exe)?\s+(/v:(on|off)\s+)?/c\b'
composite_rules:
  - id: lnk-command-c-argument
    desc: LNK arguments pass command text with /c
    crit: notable
    conf: 0.9
    any:
      - id: lnk-cmd-c-argument
      - id: lnk-forfiles-c-argument
