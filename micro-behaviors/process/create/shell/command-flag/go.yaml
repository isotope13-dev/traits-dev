# Go invoking a POSIX shell through its -c command flag.
#
# The distinction that matters is the third argument. A string literal is an
# ordinary hardcoded invocation; an identifier means the program runs a command
# it computed or received at runtime, which is the sink every remote-command
# agent is built around. This is the Go counterpart of
# ../native::c-popen-variable-input.
defaults:
  platforms: [unix]
  for: [go]
  attack: T1059.004

traits:
  - id: go-exec-shell-variable-command
    desc: Go shell -c with variable command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'exec\.Command\([^)"]{0,9}"[^"]{0,12}sh",\s*"-c",\s*[A-Za-z_]'

composite_rules:
  # A runtime variable passed to a shell is still only a capability atom. The
  # start leg makes this distinct from a build helper that synchronously runs
  # a literal or formatted command and then waits for it to finish.
  - id: go-starts-variable-shell
    desc: Go starts a shell with a runtime command
    crit: notable
    conf: 0.95
    all:
      - id: go-exec-shell-variable-command
      - id: micro-behaviors/process/create/direct::go-command-start
