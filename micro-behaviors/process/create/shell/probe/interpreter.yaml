# Locating a script interpreter before launching it, in a form that works on
# both a POSIX shell and cmd.exe. The capability itself is neutral -- portable
# installer and wrapper scripts do this -- so it lives here rather than in
# objectives/. It becomes evidence when the thing being launched is a
# masqueraded asset or the launch is an unattended IDE/build trigger, which is
# what the composites referencing it supply.
defaults:
  platforms: [windows, unix]
  for: [json, shell, batch, javascript, typescript]
  attack: T1059
  mbc: B0030

traits:
  # POSIX half of the probe. `micro-behaviors/process/interpreter/node` already
  # carries `which`/`where` atoms, but those are Node-only and match parsed
  # string literals, so neither reaches an interpreter name inside a tasks.json
  # command string. These cover the whole interpreter set as raw text.
  - id: posix-interpreter-lookup
    desc: POSIX lookup of a script interpreter
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(command -v|which)\s+(node|deno|bun|python[0-9.]*|ruby|perl|php|pwsh)\b'

  - id: windows-interpreter-lookup
    desc: Windows lookup of a script interpreter
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bwhere\s+(node|deno|bun|python[0-9.]*|py|ruby|perl|php|pwsh)\b'

composite_rules:
  # Both halves of the probe on one command line. A payload author writes this
  # so a single hardcoded command fires on every developer machine regardless
  # of platform, without a build step or a per-OS task variant. Portable
  # installers do it too, which is why this stays notable and neutral.
  - id: cross-platform-interpreter-probe
    desc: Probes POSIX and Windows for interpreter
    crit: notable
    conf: 0.92
    near_bytes: 400
    all:
      - id: posix-interpreter-lookup
      - id: windows-interpreter-lookup
