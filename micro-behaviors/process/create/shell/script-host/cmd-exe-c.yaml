defaults:
  platforms: [windows]
  for: [pe, dll, scripts, rust]
traits:
  - id: cmd-exe-s-command-source
    desc: C source embeds cmd.exe /S /C
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: literal
      kind: string
      regex: '(?i)cmd\.exe\s+/S\s+/C'

  - id: cmd-exe-c-command
    desc: Runs commands through cmd.exe /c
    crit: notable
    conf: 0.85
    if:
      type: text
      # A backtick prefix is omitted deliberately: prose commonly quotes
      # rejected commands as `cmd /c ...`, while executable JS strings use a
      # quote and shell commands appear at a line boundary or after whitespace.
      # Word-boundary after /c also matches PE prefixes like "cmd.exe /c ".
      regex: '(?is)(^|["''\s(=,:])cmd(\.exe)?\s*/c\b|Command::new\("cmd"\).{0,80}"/C"'
  # `start` hands the target to the shell and returns immediately, so the
  # launched program keeps running with no console window and no parent to
  # wait on it. Deliberately anchor-free: PE string tables pack literals with
  # no separator, so the `cmd` token routinely abuts the preceding string.
  - id: cmd-exe-c-start-launch
    desc: Detached launch via cmd.exe /c start
    crit: notable
    conf: 0.88
    attack: "T1059.003"
    if:
      type: text
      regex: '(?i)cmd(\.exe)?\s*/c\s+start\b'

  - id: cmd-exe-c-file-delete-command
    desc: Windows cmd.exe /c file deletion command
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '(?i)\bcmd(\.exe)?\s*/c\s+del\b'
  - id: stack-built-cmd-ping-x86
    desc: x86 stack-built cmd ping command
    crit: notable
    conf: 0.98
    for: [pe, dll]
    arch: [x86]
    if:
      type: hex
      section: .text
      # Sequential byte stores keep the command out of string tables.
      pattern: 'C6 45 ?? 63 C6 45 ?? 6D C6 45 ?? 64 C6 45 ?? 20 C6 45 ?? 2F C6 45 ?? 63 C6 45 ?? 20 C6 45 ?? 70 C6 45 ?? 69 C6 45 ?? 6E C6 45 ?? 67'
  - id: cmd-exe-spawn
    desc: Node spawns cmd.exe
    crit: notable
    conf: 0.86
    attack: "T1059.003"
    for: [javascript, typescript]
    if:
      type: text
      regex: 'spawn\(\s*["'']cmd\.exe["'']'
  - id: node-visible-cmd-start-window
    desc: Node opens a visible cmd start window
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: 'spawn\s*\(\s*["'']cmd\.exe["''][\s\S]{0,260}["'']/c["''][\s\S]{0,260}windowsHide\s*:\s*false'
  - id: powershell-exe-spawn
    desc: Node spawns powershell.exe
    crit: notable
    conf: 0.86
    attack: "T1059.001"
    for: [javascript, typescript]
    if:
      type: text
      regex: 'spawn\(\s*["'']powershell(\.exe)?["'']'
