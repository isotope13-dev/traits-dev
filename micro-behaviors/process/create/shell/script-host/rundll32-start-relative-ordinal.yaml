# `start rundll32 NAME.dll,#N` detaches rundll32 on a DLL named without any
# path, so it is resolved beside the script, and calls it by ordinal so no
# export name appears in the script. Stock shell32, user32 and setupapi
# ordinal calls are excluded.
traits:
  - id: rundll32-start-relative-dll-ordinal
    desc: Batch starts rundll32 on bare-name DLL ordinal
    crit: suspicious
    conf: 0.9
    platforms: [windows]
    for: [batch]
    attack: T1218.011
    unless:
      - type: text
        regex: '(?i)\b(shell32|user32|setupapi)\.dll'
    if:
      type: text
      regex: '(?im)^\s*@?start\s+rundll32(\.exe)?\s+[\w-]{3,40}\.dll\s*,\s*#\d+'
