defaults:
  platforms: [unix]
  for: [shell]
  crit: notable

traits:
- id: nohup-passwordless-sudo-shell-script
  desc: Detached shell script uses passwordless sudo
  conf: 0.98
  if:
    type: tree-sitter
    query: |
      ((command
        name: (command_name) @launcher
        argument: (word) @sudo
        argument: (word) @flag
        argument: (word) @shell
        argument: (_) @script) @launch
        (#eq? @launcher "nohup")
        (#eq? @sudo "sudo")
        (#eq? @flag "-n")
        (#match? @shell "^(ba)?sh$"))
