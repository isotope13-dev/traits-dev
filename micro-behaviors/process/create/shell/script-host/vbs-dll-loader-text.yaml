defaults:
  platforms:
  - windows
  for:
  - vbs
  crit: notable
traits:
- id: vbs-regsvr32-text-stage-command
  desc: Regsvr32 command names a text-file stage
  conf: 0.98
  if:
    type: text
    regex: (?i)\bregsvr32(\.exe)?\s+[^\r\n"&]{1,180}\.txt\b
- id: vbs-rundll32-text-stage-command
  desc: Rundll32 command names a text-file stage
  conf: 0.98
  if:
    type: text
    regex: (?i)\brundll32(\.exe)?\s+[^\r\n"&]{1,180}\.txt\s*,
