defaults:
  platforms: [windows]
traits:
  - id: wmic-process-create-shell-command
    desc: WMIC process creation references a shell
    crit: notable
    for: [scripts, binaries]
    conf: 0.97
    unless:
      - id: metadata/package/testing/harness/runtime::bun-assertion-suite
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    if:
      type: text
      regex: '(?i)\bwmic\b[^\r\n]{0,80}\bprocess\s+call\s+create\b[^\r\n]{0,40}\b(cmd|powershell)\b'


composite_rules:
  - id: wmic-remote-shell-command
    for: [pe, batch, python, javascript, powershell]
    desc: WMIC command creates a remote shell
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/launch::wmic-remote-process-create-command
      - id: micro-behaviors/process/create/shell/script-host::wmic-process-create-shell-command
    near_lines: 2
