defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  - id: archive-download-temp-script-host-context
    desc: TEMP script-host launch near archive download and extraction commands
    crit: suspicious
    conf: 0.99
    for: [batch, powershell]
    near_lines: 8
    all:
      - id: micro-behaviors/communications/http/download/curl::source-curl-archive-output
      - id: micro-behaviors/data/archive/extract/capability::powershell-archive-extract
      - id: micro-behaviors/process/create/shell/script-host::temp-script-host-path
