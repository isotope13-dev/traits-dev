defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell]
traits:
  - id: mshta-vbscript-shell-run-command
    desc: MSHTA VBScript WScript.Shell Run command
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)mshta\s+vbscript:Execute\(.{0,96}WScript[.]Shell.{0,24}[.]Run\b'
