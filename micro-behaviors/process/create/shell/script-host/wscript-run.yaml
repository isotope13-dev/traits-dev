defaults:
  crit: notable
  for:
  - vbs
  - javascript
  - oledoc
  platforms:
  - windows
traits:
- id: wscript-shell-run
  desc: WScript.Shell .Run launcher
  conf: 0.9
  if:
    type: text
    regex: WScript\.Shell.{0,40}\.Run\b
- id: msi-wscript-shell-run
  desc: MSI WSH launches a hidden process
  conf: 0.98
  attack: T1059.005
  for:
  - oledoc
  if:
    type: raw
    regex: (?is)CreateObject\(["']WScript\.Shell["']\).{0,512}\w+\.Run\s+\w+\s*,\s*0
- id: cscript-batch-mode
  desc: cscript invoked in silent batch mode
  conf: 0.9
  for:
  - scripts
  - source
  - batch
  - vbs
  if:
    type: text
    regex: (?i)cscript(\.exe)?\s+(//nologo\s+//b|//b\s+//nologo)\b
