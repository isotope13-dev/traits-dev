# WScript.Shell.Run launcher primitive (VBS/JS launchers).
defaults:
  for: [vbs, javascript, oledoc]
  platforms: [windows]

traits:
  # This trait feeds shell-execution composites, so a documentation mention of
  # the host binary must not satisfy it.  Microsoft's WiRunSQL.vbs sample only
  # names WSH in its header comment ("For use with Windows Scripting Host,
  # CScript.exe or WScript.exe") and never launches anything.  Capturing the
  # preceding line text into the match is what makes the comment leader and
  # the prose conjunction visible to `not:` -- the bare token alone carries no
  # context to filter on.  No `^` anchor, so binary string runs still match.
  - id: wscript-host-exec
    desc: Windows Script Host executable reference
    crit: notable
    conf: 0.8
    attack: T1059.005
    for: [javascript, vbs, html, batch, scripts, binaries]
    if:
      type: text
      regex: '(?i)[^\r\n]{0,80}\b[wc]script\.exe\b'
    not:
      - regex: '^\s{0,8}([''#*]|REM\s|//)'
      - regex: '(?i)\b(or|and|nor)\s{1,4}[wc]script\.exe$'
    unless:
      - id: well-known/app/data/xore-honeypot::benign-context

  - id: wscript-shell-run-create
    desc: WScript.Shell launches a process
    crit: notable
    conf: 0.85
    attack: T1059.005
    for: [javascript, vbs, html, batch, scripts, binaries]
    if:
      type: text
      regex: '(?i)CreateObject\s*\(\s*["'']WScript\.Shell["'']\s*\)[\s\S]{0,512}\.(Run|Exec)\b'

  - id: wscript-shell-run
    desc: WScript.Shell .Run launcher
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'WScript\.Shell.{0,40}\.Run\b'

  - id: msi-wscript-shell-run
    desc: MSI WSH launches a hidden process
    crit: notable
    conf: 0.98
    attack: T1059.005
    for: [msi]
    if:
      type: raw
      regex: '(?is)CreateObject\(["'']WScript\.Shell["'']\).{0,512}\w+\.Run\s+\w+\s*,\s*0'
