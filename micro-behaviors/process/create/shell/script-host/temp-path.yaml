defaults:
  platforms: [windows]
  for: [html, javascript, powershell, batch, vbs]

traits:
  - id: temp-script-host-path
    desc: Script host executes a path under TEMP
    crit: notable
    conf: 0.94
    attack: T1059.005
    if:
      type: text
      regex: '(?i)\b(wscript|cscript|mshta)(\.exe)?\b.{0,100}%TEMP%'
    unless:
      - id: well-known/app/enterprise/fusioninventory::fusioninventory-agent-deployment-benign-context
  - id: localappdata-temp-script-host-path
    desc: Script host launches LocalAppData Temp script
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)(wscript|cscript|mshta)\S*\s+"?%LOCALAPPDATA%[\\/]Temp[\\/][^"&]{1,80}\.(vbs|js|hta)\b'
