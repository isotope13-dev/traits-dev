  - id: micro-behaviors/communications/http/download/url::executable-url-reference
  - id: micro-behaviors/process/deploy/script-eval::embedded-irm-iex-pipeline
  - id: micro-behaviors/communications/http/download/cli::embedded-powershell-irm-iex-command
  - id: micro-behaviors/communications/http/download/cli::embedded-iwr-pipe-iex
  - id: micro-behaviors/communications/http/download/cli::embedded-iwr-outfile-download
