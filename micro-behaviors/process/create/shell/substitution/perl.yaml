defaults:
  for: [perl]
  platforms: [unix, windows]
  # Perl is not the Python sub-technique; the command's interpreter varies.
  attack: "T1059"

traits:
  - id: backticks-variable-exec
    desc: Perl backticks execute a variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '`\$[A-Za-z_][A-Za-z0-9_]*`'
