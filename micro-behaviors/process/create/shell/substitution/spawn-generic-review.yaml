defaults:
  platforms:
  - unix
  - windows
  for: [shell, python, javascript, powershell, c]
traits:
- id: command-substitution
  desc: Shell command-substitution syntax
  crit: notable
  for: [shell]
  if:
    type: tree-sitter
    query: |
      ((command_substitution) @substitution
        (#match? @substitution "^\\$\\("))

- id: backtick-command-substitution
  desc: Backtick shell command-substitution syntax
  crit: notable
  for: [shell]
  if:
    type: tree-sitter
    query: |
      ((command_substitution) @substitution
        (#match? @substitution "^`"))
  # Markdown fences can cause the type sniffer to select the shell parser.
  # Their delimiters are documentation, rather than shell substitutions.
  unless:
    - id: metadata/lang/source/syntax/markup/markdown::fenced-markdown-without-shell-shebang
    - id: metadata/file/format/source-map::sourcemap-sources-content
