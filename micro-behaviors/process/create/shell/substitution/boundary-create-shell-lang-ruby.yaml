defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for:
    - ruby
traits:
  - id: ruby-subshell-command
    desc: Ruby subshell command execution
    conf: 0.93
    if:
      # Ruby's tree-sitter grammar emits both backtick and `%x` command
      # substitutions as `subshell` nodes. The symbol projection does not
      # expose these nodes, so matching it silently missed real execution.
      type: tree-sitter
      query: '(subshell) @command'
      language: ruby
    unless:
      # Opal compiles Ruby backticks as JavaScript interpolation. A guarded
      # Opal implementation does not execute a host shell command.
      - type: text
        regex: 'defined\?\(RUBY_ENGINE\)[^\r\n]{0,100}RUBY_ENGINE\s*==\s*"opal"'
      - type: text
        regex: '(?s)WASM-based parser for Opal environments.{0,500}ParsletWasm'
  - id: ruby-backtick-command-substitution
    desc: Executes a command with Ruby backticks
    conf: 0.88
    if:
      type: text
      regex: '(?m)^\s{0,40}[A-Za-z_][A-Za-z0-9_]{0,40}\s*=\s*`.{1,160}`'
    unless:
      - type: text
        regex: 'defined\?\(RUBY_ENGINE\)[^\r\n]{0,100}RUBY_ENGINE\s*==\s*"opal"'
      - type: text
        regex: '(?s)WASM-based parser for Opal environments.{0,500}ParsletWasm'
