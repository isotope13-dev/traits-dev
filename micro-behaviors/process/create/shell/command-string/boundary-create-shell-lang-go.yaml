defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [go, elf, macho, pe]
  crit: notable
  conf: 0.7
traits:
  - id: go-exec-command-bin-sh
    desc: Go exec.Command shell invocation
    conf: 0.93
    for: [go]
    if:
      type: text
    # `sh -c` is a command-string wrapper (sh-c-exec), not a
    # direct shell-binary spawn. IMAP ProxyCommand-style tunnels use that form.
      regex: 'exec\.Command\s*\(\s*"(/bin/)?(ba)?sh"\s*(,\s*"-i")?\s*\)'
