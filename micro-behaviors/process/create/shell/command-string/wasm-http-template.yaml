defaults:
  platforms: [windows, unix]
  for: [wasm]
  crit: notable
  conf: 0.96

traits:
  - id: wasm-powershell-http-template-prefix
    desc: WASM PowerShell HTTP command prefix
    if:
      type: text
      regex: '(?i)powershell[^\r\n]{0,60}\b(irm|Invoke-RestMethod|iwr|Invoke-WebRequest)\s+https?://'
