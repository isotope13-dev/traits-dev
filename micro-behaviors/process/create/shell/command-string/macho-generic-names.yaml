# Naming observations and capability co-occurrence do not establish masquerading.
defaults:
  crit: notable
  for: [macho]
  platforms: [macos, ios]
composite_rules:
- id: generic-bundle-shell-or-daemon-apis
  desc: Generic bundle identifier with shell or daemon APIs
  crit: notable
  conf: 0.9
  all:
  - id: metadata/binary/bundle::generic-bundle-id-pattern
  any:
  - id: micro-behaviors/process/create/shell/native::c-popen
  - id: micro-behaviors/process/create/shell/spawn::system-fn
  - id: micro-behaviors/process/daemonize/detach::fork-new-session
  unless:
  - id: metadata/signed/platform::apple
- id: unsigned-generic-shell-exec
  desc: Unsigned generically named Mach-O with shell APIs
  crit: notable
  conf: 0.95
  all:
  - id: metadata/signed/trust-level::unsigned-macho
  - id: micro-behaviors/process/create/shell/spawn::shell-execution
  any:
  - id: metadata/filename/identity::generic-executable-name-1
  - id: metadata/filename/identity::generic-executable-name-2
