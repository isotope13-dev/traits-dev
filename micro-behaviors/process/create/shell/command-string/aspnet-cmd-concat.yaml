# .NET ProcessStartInfo set to cmd.exe with Arguments "/c " + <variable>:
# a new cmd shell parses whatever text the variable carries as a command.
defaults:
  platforms: [windows]
  for: [html, asp, csharp]
  crit: notable
  conf: 0.92
traits:
  - id: dotnet-cmd-c-concatenated-argument
    desc: cmd.exe runs /c plus concatenated text
    if:
      type: text
      regex: '(?is)FileName\s*=\s*"cmd(\.exe)?".{0,160}Arguments\s*=\s*"/c\s*"\s*\+\s*\w'
