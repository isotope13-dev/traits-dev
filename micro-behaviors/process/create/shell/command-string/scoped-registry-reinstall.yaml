defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-exec-scoped-registry-install
    desc: Executes scoped package installation command
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (_ (variable_declarator name: (identifier) @execute
            value: (member_expression
              object: (call_expression function: (identifier) @require
                arguments: (arguments (string (string_fragment) @library)))
              property: (property_identifier) @api)))
          (_ (variable_declarator name: (identifier) @command
            value: (binary_expression) @text))
          .
          [(variable_declaration) (lexical_declaration)
           (expression_statement (call_expression))]*
          .
          (expression_statement (call_expression function: (identifier) @called
            arguments: (arguments (identifier) @argument))))
          (#eq? @require "require")
          (#match? @library "^(node:)?child_process$")
          (#match? @api "^exec(Sync)?$")
          (#eq? @execute @called)
          (#eq? @command @argument)
          (#match? @text "\\b(t?npm|pnpm|yarn)[ \\t]+(install|add)[ \\t]+@[A-Za-z0-9_.-]+/")
          (#set! cleave.ignore-comments "true"))
