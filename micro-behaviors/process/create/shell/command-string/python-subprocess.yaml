defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059

traits:
  - id: python-subprocess-shell-true
    desc: Subprocess call enables shell parsing
    crit: notable
    conf: 0.7
    mbc: E1059
    unless:
    - id: well-known/tool/detection/pattern-catalog::python-vulnerability-pattern-catalog
    - id: well-known/tool/detection/llm-scanner::skill-vetting-pattern-scanner
    # An injection detector quotes "shell=True" in the diagnostic it prints about
    # other people's code; it is a message string, not a call it makes.
    - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
    - id: metadata/file/catalog/threat-pattern::severity-graded-pattern-catalog
    - id: metadata/file/catalog/threat-pattern::dangerous-pattern-replacement-text
    - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
    - id: well-known/tool/offensive/ctf-skills::source-context
    if:
      type: tree-sitter
      # Bind the keyword to this call, regardless of command-string length.
      # A nested call or a quoted "shell=True" is not a shell option.
      query: |
        ((call
          function: (attribute
            object: (identifier) @module
            attribute: (identifier) @method)
          arguments: (argument_list
            (keyword_argument name: (identifier) @keyword value: (true)))) @call
          (#eq? @module "subprocess")
          (#match? @method "^(run|Popen|call|check_output)$")
          (#eq? @keyword "shell"))
    not:
    - substr: never ``shell=True``
