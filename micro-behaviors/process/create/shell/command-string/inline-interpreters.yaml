defaults:
  platforms:
  - unix
traits:
- conf: 0.9
  id: python-shell-exec-system
  desc: python -c exec/system/popen
  crit: notable
  for:
  - shell
  if:
    type: text
    regex: \bpython[23]?\s+-c\s+['"].{0,200}\b(exec|system|popen)\b
  not:
  - regex: platform\.system
- conf: 0.9
  id: python-shell-spawn-subprocess
  desc: python -c spawn/subprocess
  crit: notable
  for:
  - shell
  if:
    type: text
    regex: \bpython[23]?\s+-c\s+['"].{0,200}\b(spawn|subprocess)\b
- conf: 0.9
  id: perl-shell-execution
  desc: Shell execution via perl -e
  crit: notable
  for:
  - shell
  if:
    type: text
    regex: perl\s+-e\s+['"].{0,200}(exec\(|system\()
- conf: 0.9
  id: ruby-shell-execution
  desc: Shell execution via ruby -e
  crit: notable
  for:
  - shell
  if:
    type: text
    regex: ruby\s+-e\s+['"].{0,200}(exec\(|system\()
composite_rules:
- conf: 1.0
  id: python-shell-execution
  desc: Shell execution via python -c
  crit: notable
  for:
  - shell
  any:
  - id: micro-behaviors/process/create/shell/command-string::python-shell-exec-system
  - id: micro-behaviors/process/create/shell/command-string::python-shell-spawn-subprocess
- conf: 0.9
  id: unix-inline-interpreter-execution
  desc: Unix inline interpreter execution
  crit: notable
  unless:
  - id: well-known/app/infrastructure/docker::source-tree
  - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-cli-context
  any:
  - id: micro-behaviors/process/create/shell/command-string::python-shell-execution
  - id: micro-behaviors/process/create/shell/command-string::perl-shell-execution
  - id: micro-behaviors/process/create/shell/command-string::ruby-shell-execution
  - id: micro-behaviors/process/create/shell/command-string::sh-c-exec
