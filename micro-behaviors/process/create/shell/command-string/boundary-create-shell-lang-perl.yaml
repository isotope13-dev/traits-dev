defaults:
  crit: notable
  for: [perl]
  platforms: [unix]
traits:
  - id: system-dollar-variable
    desc: Runs system command from a variable
    conf: 0.9
    platforms: [unix, windows]
    for: [perl, text, static-lib, html]
    if:
      type: text
      # `system("$cmd")` too: the quotes interpolate the same variable.
      regex: '\bsystem\s*\(\s*(\$[A-Za-z_]\w*|"\$[A-Za-z_]\w*")\s*\)'
