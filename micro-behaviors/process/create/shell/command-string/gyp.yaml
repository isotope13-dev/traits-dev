# Gyp evaluates source-list command substitutions during configuration, and
# npm itself runs `node-gyp rebuild` for packages published with
# "gypfile": true, so action entries execute at install time.
# Redirecting generator diagnostics or chaining generation is legitimate too.
defaults:
  platforms: [unix, windows]
  for: [gyp]

traits:
  # `actions[].action` is gyp's build-step command list. For an npm package
  # with "gypfile": true these run during `npm install` (node-gyp rebuild),
  # making a node launcher here install-time code execution. Code generation
  # is the legitimate face of the same mechanism; exfiltration intent is the
  # consumer composite's (objectives/supply-chain/install-hook/node-gyp/).
  - id: gyp-action-command-node
    desc: gyp build action launches node
    crit: notable
    conf: 0.95
    if:
      type: value
      # Structured match on the command program; the exact form keeps
      # node-gyp, node-pre-gyp and similarly named tools out.
      path: targets[*].actions[*].action[0]
      exact: node
  - id: gyp-source-command-expansion
    desc: gyp sources entry is a command expansion
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '"sources"\s*:\s*\[[^\]]{0,300}<!@?\('
  - id: gyp-source-command-redirection-or-chain
    desc: gyp source command redirects or chains shell
    crit: notable
    conf: 0.9
    if:
      type: text
      # Commands commonly contain nested calls such as `node -e
      # "require('./payload')" && ...`; stopping at the first `)` misses
      # the shell operator even though gyp still executes the whole command.
      regex: '"sources"\s*:\s*\[[^\]]{0,500}<!@?\([\s\S]{0,400}(/dev/null|2>&1|&&)'

composite_rules:
  - id: gyp-source-command-with-shell-operators
    desc: gyp source command expansion uses shell operators
    crit: notable
    conf: 0.95
    all:
      - id: gyp-source-command-expansion
      - id: gyp-source-command-redirection-or-chain
