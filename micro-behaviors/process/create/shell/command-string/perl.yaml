defaults:
  platforms: [linux, macos, windows]
  for: [shell]
  conf: 0.85

traits:
  - id: perl-inline-shell-command
    desc: Perl inline code names a shell sink
    crit: notable
    attack: T1059.004
    not:
      - regex: '\bperl\s+(-[^\s]*[np]|-[np]\b)'
    if:
      type: text
      regex: 'perl\s+(\S+\s+){0,6}-e\s+(\x27[^\x27]{0,80}|\x22[^\x22]{0,80})((system|exec)\s*\(|qx\(|`)'
