defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - source
    - pe
  crit: notable
  conf: 0.7
traits:
  - id: powershell-variable-args
    desc: PowerShell invoked with variable arguments
    for: [batch, shell]
    if:
      type: text
      regex: (?im)(^|[\s"'(@;&|])\s*powershell(\.exe)?\s+%[A-Za-z_]
