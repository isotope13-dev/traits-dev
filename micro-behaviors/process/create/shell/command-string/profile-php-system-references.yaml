---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
composite_rules:
- id: php-repeated-system-command-references
  desc: PHP repeats system command references
  crit: notable
  conf: 0.88
  any:
  - id: micro-behaviors/os/sysinfo/command::php-repeated-whoami-text
  - id: micro-behaviors/os/sysinfo/command::php-repeated-uname-text
  - id: micro-behaviors/network/interface/command::php-repeated-ipconfig-text
  - id: micro-behaviors/network/connections::php-repeated-netstat-text
  - id: micro-behaviors/process/enumerate/shell::php-repeated-ps-text
  - id: micro-behaviors/fs/search/command::php-repeated-ls-text
  - id: micro-behaviors/fs/search/command::php-repeated-find-text
  - id: micro-behaviors/process/interpreter/shell::php-repeated-cmd-pattern-text
  - id: micro-behaviors/process/interpreter/powershell::php-repeated-powershell-pattern-text
  - id: micro-behaviors/communications/socket/netcat::php-repeated-netcat-listen-text
