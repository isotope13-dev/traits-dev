defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99
  mbc: C0017
traits:
  - id: node-imported-exec-command
    desc: Imported child_process exec runs command text
    if:
      type: symbol
      kind: call
      regex: '\.exec$'
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?child_process$'

composite_rules:
  - id: node-exec-interpolated-template-variable
    desc: Node exec runs a substituted template
    crit: notable
    conf: 0.94
    scope: file
    near_lines: 120
    all:
      - id: metadata/import/builtin::child-process-import-runtime
      - id: metadata/lang/source/syntax/call/arguments::exec-template-variable
