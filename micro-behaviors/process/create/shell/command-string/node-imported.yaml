defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99
  mbc: C0017
traits:
  - id: node-imported-exec-command
    desc: Imported child_process exec runs command text
    if:
      type: symbol
      kind: call
      regex: '\.exec$'
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?child_process$'
