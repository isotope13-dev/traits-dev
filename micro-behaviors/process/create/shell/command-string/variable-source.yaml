defaults:
  for: [text, shell]
  platforms: [unix]
  crit: notable
traits:
  - id: variable-shell-source-command
    desc: Variable shell receives source command
    conf: 0.98
    if:
      type: text
      # The dot command after -c establishes shell semantics; -c alone does not.
      regex: '(?m)^["'']\$\{?\w+\}?["''][ \t]+-c[ \t]+["'']\.[ \t]+\./'
