defaults:
  platforms: [unix]
  for: [shell, python, rust, go, c, cpp, objc, elf]
  crit: notable
  attack: T1021.004

traits:
  # Retain the original shell branch's network/Base64 context. A remote
  # `bash -c "npm install ..."` does not establish this narrower shape.
  - id: ssh-inline-shell-network-or-base64-command
    desc: SSH inline shell references network or Base64
    conf: 0.95
    if:
      type: text
      regex: '\bssh[ \t]+[^\n;|]{0,160}\bbash\s+-c.{0,50}\b(curl|wget|base64|/dev/tcp)'
