defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-erlang-os-cmd-terms
    desc: Constructs Erlang os cmd terms
    crit: notable
    if:
      type: tree-sitter
      language: python
      query: |
        ((list
          (call function: (identifier) @encoder
            arguments: (argument_list (string) @module))
          . (call function: (identifier) @same_encoder
            arguments: (argument_list (string) @method))) @evidence
        (#eq? @encoder @same_encoder)
        (#match? @module "^[\"']os[\"']$")
        (#match? @method "^[\"']cmd[\"']$"))

composite_rules:
  - id: python-erpc-os-command-payload
    desc: Builds Erlang erpc OS command payload
    crit: notable
    near_lines: 5
    all:
      - id: micro-behaviors/communications/rpc::python-erpc-execute-call-terms
      - id: python-erlang-os-cmd-terms
