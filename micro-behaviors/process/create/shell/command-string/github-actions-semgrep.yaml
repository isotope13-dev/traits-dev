# A workflow run field names an actual command; a job label or tool mention
# alone does not identify the artifact as a security scanner.
traits:
  - id: github-actions-semgrep-command
    desc: Workflow runs a Semgrep shell command
    crit: notable
    conf: 0.95
    platforms: [unix, windows]
    for: [github-actions]
    if:
      type: text
      regex: '(?m)^[ \t]+(-[ \t]+)?run:[ \t]+semgrep([ \t]|$)'
