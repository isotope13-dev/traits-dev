defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
  crit: notable
traits:
  - id: js-constructor-execsync
    desc: Constructor executes a shell command
    conf: 0.93
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: \bconstructor\s*\([^)]{0,80}\)\s*\{[\s\S]{0,480}\bexecSync\s*\(
  - id: js-exec-space-split-command
    desc: Executes a command string split on spaces
    conf: 0.85
    attack: T1059.007
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: (execSync|exec|spawn)\s*\([^\n)]{0,200}\.split\(['"] ['"]\)
  - id: js-compiled-execsync-cmd-arg
    desc: compiled JS execSync cmd arg
    conf: 0.9
    if:
      type: text
      substr: execSync)(cmd
  - id: js-exec-callback-reexec
    desc: exec callback launches second exec
    conf: 0.94
    mbc: C0017
    attack: T1059.007
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: exec\s*\([^)]{0,80},\s*function\s*\([^)]{0,40}\).{0,400}\bexec\s*\(
  - id: shelljs-exec
    desc: Executes a shell command through shelljs
    conf: 0.95
    for:
      - javascript
      - typescript
    if:
      type: symbol
      kind: call
      exact: shelljs.exec
  - id: js-cmd-start
    desc: Launches cmd via start
    conf: 0.9
    if:
      type: string_literal
      regex: start\s+cmd
composite_rules:
  - id: js-exec
    desc: Executes a command through Node.js child_process exec
    conf: 0.95
    mbc: C0017
    attack: T1059.007
    near_bytes: 16384
    all:
      - id: micro-behaviors/data/control-flow/dispatch/named::javascript-exec-call
    any:
      - id: micro-behaviors/process/create/shell/command-string::child-process-inline-exec-call
      - id: metadata/import/builtin::child-process-exec-alias-binding
      - id: metadata/lang/source/declaration::js-computed-exec-destructure
      - id: metadata/import/builtin::child-process-exec-destructure
      - id: metadata/import/builtin::child-process-exec-esm-import
