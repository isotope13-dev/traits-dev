defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  crit: notable
traits:
- id: node-bash-lc-member-command
  desc: Runs object command through Bash
  conf: 0.98
  attack: T1059.004
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \bspawn\w*\(\s*["']bash["']\s*,\s*\[\s*["']-lc["']\s*,\s*[\w$]+\.[\w$]+
- id: js-constructor-execsync
  desc: Constructor executes a shell command
  conf: 0.93
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: \bconstructor\s*\([^)]{0,80}\)\s*\{[\s\S]{0,480}\bexecSync\s*\(
- id: js-execsync-cmd-arg
  desc: execSync called with cmd variable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: execSync(cmd
- id: js-exec-space-split-command
  desc: Executes a command string split on spaces
  conf: 0.85
  attack: T1059.007
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: (execSync|exec|spawn)\s*\([^\n)]{0,200}\.split\(['"] ['"]\)
- id: js-compiled-execsync-cmd-arg
  desc: compiled JS execSync cmd arg
  conf: 0.9
  if:
    type: text
    substr: execSync)(cmd
- id: js-execfile-bash
  desc: Node execFile launches bash process
  conf: 0.86
  mbc: C0017
  attack: T1059.004
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: execFile\)?\(\s*['"`]bash['"`]
- id: js-function-bash-first-arg
  desc: JavaScript process API receives Bash executable
  conf: 0.94
  mbc: C0017
  attack: T1059.004
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    regex: (^|\.)(spawn|spawnSync|execFile|execFileSync)$
    arg:
      index: 0
      exact: bash
- id: js-spawnsync-posix-interpreter
  desc: Runs a POSIX interpreter via spawnSync
  conf: 0.94
  for:
  - javascript
  - typescript
  attack: T1059
  if:
    type: text
    regex: spawnSync\s*\(\s*["'`](bash|sh|zsh)\b
- id: js-spawnsync-windows-interpreter
  desc: Runs a Windows interpreter via spawnSync
  conf: 0.94
  for:
  - javascript
  - typescript
  attack: T1059
  if:
    type: text
    regex: spawnSync\s*\(\s*["'`](powershell|pwsh|cmd|cmd\.exe)\b
- id: js-spawnsync-bash-command
  desc: Runs variable command through Bash
  conf: 0.95
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: spawnSync\(\s*["']bash["']\s*,\s*\[\s*["']-c["']\s*,\s*\w+
- id: js-exec-callback-reexec
  desc: exec callback launches second exec
  conf: 0.94
  mbc: C0017
  attack: T1059.007
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: exec\s*\([^)]{0,80},\s*function\s*\([^)]{0,40}\).{0,400}\bexec\s*\(
- id: shelljs-exec
  desc: Executes a shell command through shelljs
  conf: 0.95
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    exact: shelljs.exec
- id: js-cmd-start
  desc: Launches cmd via start
  conf: 0.9
  if:
    type: string_literal
    regex: start\s+cmd
composite_rules:
- id: js-exec
  desc: Executes a command through Node.js child_process exec
  conf: 0.95
  mbc: C0017
  attack: T1059.007
  near_bytes: 16384
  all:
  - id: metadata/lang/source/syntax/call/invocation::javascript-exec-call
  any:
  - id: micro-behaviors/process/create/shell/command-string::child-process-inline-exec-call
  - id: metadata/import/builtin::child-process-exec-alias-binding
  - id: metadata/lang/source/declaration::js-computed-exec-destructure
  - id: metadata/import/builtin::child-process-exec-destructure
  - id: metadata/import/builtin::child-process-exec-esm-import
- id: js-spawnsync-interpreter
  desc: Runs an interpreter via spawnSync
  conf: 0.95
  for:
  - javascript
  - typescript
  any:
  - id: micro-behaviors/process/create/shell/command-string::js-spawnsync-posix-interpreter
  - id: micro-behaviors/process/create/shell/command-string::js-spawnsync-windows-interpreter
