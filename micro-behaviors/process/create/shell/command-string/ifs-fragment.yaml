defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: ifs-network-command-fragment
    desc: String contains IFS-spaced network command
    crit: notable
    conf: 0.97
    if:
      type: literal
      exclude_docstrings: true
      regex: '\b(curl|wget|nslookup|getent)\$\{IFS\}'
    unless:
      - id: well-known/tool/detection/
      - id: metadata/package/testing/

