defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.96

traits:
  # A complete shell command string, not a bare executable name or the
  # generic /dev/null path. This records syntax, not observed execution.
  - id: native-command-null-output-redirection
    desc: Embedded command redirects stdout and stderr
    if:
      type: text
      section: .rodata
      regex: '^/(usr/)?s?bin/\S+[^\r\n]{0,120}>[ \t]*/dev/null[ \t]+2>&1$'
