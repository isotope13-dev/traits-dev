traits:
  - platforms:
      - unix
      - windows
    for:
      - python
    id: shell-exec-pattern
    desc: Shell command execution pattern
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (exec|system|passthru)\s*\(.{0,50}\$_GET
    unless:
      - id: micro-behaviors/metaprogramming/generation/source::configured-assessment-plugin
