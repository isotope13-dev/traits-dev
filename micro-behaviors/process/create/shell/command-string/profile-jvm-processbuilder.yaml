defaults:
  platforms: [unix, windows]
  for: [java]

composite_rules:
  - id: jvm-windows-processbuilder-shell
    desc: JVM ProcessBuilder and Windows shell constants
    crit: notable
    conf: 0.97
    for: [class, jar, zip]
    scope: outer
    all:
      - id: metadata/import/jvm::java-processbuilder-init-bytecode-reference
      - id: micro-behaviors/process/interpreter/shell::jvm-windows-shell-name-constant
      - id: micro-behaviors/process/interpreter/shell::jvm-windows-shell-command-flag

  - id: jvm-posix-processbuilder-shell
    desc: JVM ProcessBuilder and POSIX shell constants
    crit: notable
    conf: 0.97
    for: [class, jar, zip]
    scope: outer
    all:
      - id: metadata/import/jvm::java-processbuilder-init-bytecode-reference
      - id: micro-behaviors/fs/path/binary::jvm-posix-shell-path-constant
      - id: micro-behaviors/process/interpreter/shell::jvm-posix-shell-command-flag
