defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.85

traits:
  # A bare command name that begins with a dot (".ls") is not the documented
  # utility and resolves only through PATH. Path-qualified scripts (./run.sh)
  # contain a slash and are excluded by the anchored name pattern.
  - id: js-exec-dot-prefixed-command
    desc: Shell exec of dot-prefixed bare command name
    if:
      type: symbol
      kind: call
      regex: '(^|\.)exec(Sync)?$'
      arg:
        index: 0
        regex: '^\.[A-Za-z][\w.-]{0,40}$'
