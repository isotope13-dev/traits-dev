defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: named-agent-shell-tool
    desc: Named agent shell execution tool
    conf: 0.95
    near_bytes: 1600
    all:
      - id: micro-behaviors/data/llm/tool-call::python-shell-tool-name
      - id: micro-behaviors/process/create/shell-subprocess::asyncio-create-subprocess-shell

  - id: python-mcp-shell-command-execution
    desc: Python MCP tool passes a command string to a shell
    conf: 0.98
    all:
      - id: metadata/file/profile/mcp::python-mcp-run-command-tool
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
    any:
      - id: micro-behaviors/process/create/subprocess::asyncio-create-subprocess-exec
      - id: micro-behaviors/process/create/subprocess::run-content
      - id: micro-behaviors/process/create/subprocess::popen-content
      - id: metadata/file/profile/mcp::fastmcp-stdio-transport
    unless:
      - id: metadata/package/testing/presence/path::test-fixture-directory-name

  - id: python-mcp-cwd-shell-execution
    desc: Python MCP shell tool accepts command and cwd parameters
    conf: 0.99
    all:
      - id: metadata/file/profile/mcp::fastmcp-import
      - id: metadata/file/profile/tool-interface::python-tool-decorator
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
      - id: micro-behaviors/process/create/subprocess::run-ast
      - id: metadata/lang/source/naming/declaration::python-command-cwd-parameters
