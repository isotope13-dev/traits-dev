defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: named-agent-shell-tool
    desc: Named agent shell execution tool
    conf: 0.95
    near_bytes: 1600
    all:
      - id: micro-behaviors/data/llm/tool-call::python-shell-tool-name
      - id: micro-behaviors/process/create/shell/command-mode::asyncio-create-subprocess-shell

  - id: python-mcp-shell-command-execution
    desc: Python MCP tool passes a command string to a shell
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/shell/command-string::python-mcp-run-command-tool
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
    any:
      - id: micro-behaviors/process/create/subprocess/launch::asyncio-create-subprocess-exec
      - id: micro-behaviors/process/create/exec::python-subprocess-run-call-text
      - id: micro-behaviors/process/create/subprocess/launch::popen-content
      - id: micro-behaviors/communications/mcp/server::fastmcp-stdio-transport

  - id: python-mcp-cwd-shell-execution
    desc: Python MCP shell tool accepts command and cwd parameters
    conf: 0.99
    all:
      - id: micro-behaviors/communications/mcp/server::fastmcp-import
      - id: micro-behaviors/data/control-flow/dispatch/tool-call::python-tool-decorator
      - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
      - id: micro-behaviors/process/create/subprocess/launch::run-ast
      - id: metadata/lang/source/naming/declaration::python-command-cwd-parameters
