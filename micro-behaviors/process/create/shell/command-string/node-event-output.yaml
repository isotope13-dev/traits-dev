defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
traits:
- id: node-event-shell-command-output
  desc: Event input reaches exec and returns stdout
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: |-
      ((call_expression
        function: (member_expression object: (identifier) @socket property: (property_identifier) @on)
        arguments: (arguments . (string) .
          (arrow_function parameters: (formal_parameters . (identifier) @input .)
            body: (statement_block
              (expression_statement (call_expression function: (identifier) @exec
                arguments: (arguments . (member_expression object: (identifier) @received)
                  . (arrow_function
                    parameters: (formal_parameters . (identifier) . (identifier) @stdout . (identifier) .)
                    body: (statement_block (if_statement alternative: (else_clause
                      (statement_block (expression_statement
                        (call_expression function: (member_expression object: (identifier) @reply_socket
                          property: (property_identifier) @emit)
                          arguments: (arguments . (string) . (object
                            (pair value: (identifier) @sent))))))))))))))))) @operation
        (#eq? @on "on") (#eq? @emit "emit") (#eq? @exec "exec")
        (#eq? @input @received) (#eq? @socket @reply_socket) (#eq? @stdout @sent))
