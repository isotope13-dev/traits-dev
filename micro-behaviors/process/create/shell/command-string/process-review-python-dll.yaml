defaults:
  crit: notable
  platforms: [windows]
  for: [python]
traits:
  - id: python-exe-library-os-system
    desc: Python os.system invokes EXE with library
    conf: 0.92
    platforms: [windows, unix]
    size_max: 20000
    if:
      type: tree-sitter
      kind: call
      regex: '(?s)os\.system\(.{0,240}\.exe\b.{0,240}\.(dll|so)\b'

