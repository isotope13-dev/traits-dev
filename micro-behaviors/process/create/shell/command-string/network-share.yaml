# The required tokens describe a shell command string, not in-process eval.
composite_rules:
  - id: network-share-file-piped-to-cmd
    desc: Remote share file content is piped into cmd
    crit: notable
    conf: 0.97
    for: [html]
    platforms: [windows]
    near_bytes: 1800
    all:
      - id: metadata/file/encoding::html-entity-more-token
      - id: micro-behaviors/fs/path/network::html-entity-unc-prefix
      - id: micro-behaviors/data/decode/markup::html-entity-pipe-character
      - id: metadata/file/encoding::html-entity-cmd-token
