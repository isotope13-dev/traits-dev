defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: module-level-imported-node-shell-command
    desc: Module-level Node code invokes shell command
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      regex: '\.exec(Sync)?$'
      module_level: true
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?child_process$'
