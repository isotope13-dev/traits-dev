defaults:
  platforms: [unix]
  for: [python, shell, javascript, go, ruby, perl, java]

traits:
  - id: erlang-os-cmd-call-syntax
    desc: Erlang shell command call syntax
    crit: notable
    conf: 0.95
    if:
      type: text
      # Call-shaped syntax may also be embedded in a constructed RPC payload.
      # This atom does not establish a particular appliance or remote exploit.
      regex: '(?i)\bos:cmd\s*\(\s*["'']'

  - id: erlang-rpc-os-cmd-request
    desc: Erlang RPC invokes OS shell commands
    platforms: [windows]
    for: [powershell, batch]
    crit: notable
    conf: 0.98
    ref: https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer
    if:
      type: text
      # The command argument can be a string or decimal character list.
      # Neither RabbitMQ's node name nor Orion's installation path is required.
      regex: '\brpc\s*:\s*call\s*\(\s*[^,\r\n]{1,80},\s*os\s*,\s*cmd\s*,'
      exclude_comments: true

