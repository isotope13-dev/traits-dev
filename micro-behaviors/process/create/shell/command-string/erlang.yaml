defaults:
  platforms: [unix]
  for: [python, shell, javascript, go, ruby, perl, java]

traits:
  - id: erlang-os-cmd-call-syntax
    desc: Erlang shell command call syntax
    crit: notable
    conf: 0.95
    if:
      type: text
      # Call-shaped syntax may also be embedded in a constructed RPC payload.
      # This atom does not establish a particular appliance or remote exploit.
      regex: '(?i)\bos:cmd\s*\(\s*["'']'

