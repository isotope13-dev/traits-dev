defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript, typescript]
  mbc: C0017
traits:
  # Windows `start` runs its argument through the shell. Building the
  # argument by concatenation from a runtime value means whatever string is
  # stored there (a config field, a fetched setting) becomes the launched
  # command. The static `start` form with a literal target is not matched.
  - id: js-shell-start-concatenated-argument
    desc: Shell start command with concatenated argument
    if:
      type: text
      regex: 'execSync\(\s*["'']start\s+["'']\s*\+'
