defaults:
  crit: notable
  conf: 0.8
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - powershell
traits:
- id: posix-tunnel-shell-spawn-source
  desc: C executes tunnel command through shell
  conf: 0.95
  platforms:
  - unix
  for:
  - c
  - cpp
  if:
    type: text
    regex: execl\s*\(\s*"/bin/sh"\s*,\s*"sh"\s*,\s*"-c"\s*,\s*\w+(->|\.)tunnel\b
- id: shell-direct-sh-c
  desc: Direct shell command-string execution with -c
  for:
  - shell
  - text
  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: metadata/package/testing/presence/harness/
  - id: metadata/build/autotools::autoconf-generated-script
  - id: metadata/build/autotools::autotools-config-basename
  - id: metadata/path::test-directory-component
  if:
    type: text
    regex: (?m)^[ \t]*(exec|sudo|pkexec)?[ \t]*(ba|z)?sh[ \t]+-c\b
- id: embedded-sh-c-literal
  desc: Embedded shell command string uses -c
  for:
  - python
  - javascript
  - powershell
  if:
    type: literal
    regex: \b(ba|z)?sh\s+-c\b
- id: embedded-sh-c-text
  desc: Shell command string uses -c flag
  conf: 0.9
  platforms:
  - macos
  for:
  - javascript
  - html
  if:
    type: text
    regex: (?im)^[^\n@]{0,240}(/bin/)?(bash|zsh|sh)\s+-c\b
composite_rules:
- id: sh-c-exec
  desc: Executes a shell command string with -c
  for:
  - shell
  - python
  - javascript
  - powershell
  - text
  any:
  - id: shell-direct-sh-c
  - id: embedded-sh-c-literal
