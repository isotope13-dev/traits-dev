defaults:
  crit: notable
  conf: 0.8
  platforms: [unix, windows]
  for: [shell, python, javascript, powershell]

traits:
  - id: shell-direct-sh-c
    desc: Direct shell command-string execution with -c
    for: [shell]
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/package/testing/presence/harness/
      - id: metadata/build/autotools::autoconf-generated-script
      - id: metadata/build/autotools::autotools-config-basename
    if:
      type: text
      regex: '(?m)^[ \t]*(exec|sudo|pkexec)?[ \t]*(ba|z)?sh[ \t]+-c\b'

  - id: embedded-sh-c-literal
    desc: Embedded shell command string uses -c
    for: [python, javascript, powershell]
    if:
      type: literal
      regex: '\b(ba|z)?sh\s+-c\b'

composite_rules:
  - id: sh-c-exec
    desc: Executes a shell command string with -c
    any:
      - id: shell-direct-sh-c
      - id: embedded-sh-c-literal
