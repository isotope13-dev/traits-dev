# A shell separator (;, |, &, &&, ||, backtick, $( ) directly followed by a
# network client chains a fetch or lookup after whatever precedes it. Routine
# in shell scripts; inside a quoted parameter value it is an injection suffix.
defaults:
  platforms: [unix, windows]
  for: [yaml, json, text, python]
  attack: T1059

traits:
  - id: separator-chained-network-tool
    desc: Shell separator chains a network client
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: '(?i)(^|["''\s])([;|&`]|\$\(|&&|\|\|)\s*(curl|wget|nslookup|ping|dig|powershell)\b'
