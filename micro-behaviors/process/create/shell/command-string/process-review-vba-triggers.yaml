defaults:
  for: [oledoc, ooxml, xlsx]
  platforms: [windows]
  crit: notable
  conf: 0.88
traits:
  - id: raw-shell-call
    desc: VBA Shell process invocation
    crit: notable
    conf: 0.88
    for: [oledoc]
    if:
      type: raw
      regex: '(?i)\bshell\s*\('
    unless:
      - type: path
        regex: '(?i)\.(pot|po|mo)$'
