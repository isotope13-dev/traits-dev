# Nearby shell/option strings are useful source clues, but do not establish
# a payload stage or prove that a process was started. Preserve the original
# broad observation separately from the adjacent-argv spelling.
defaults:
  platforms: [openwrt, unix]
  for: [zig]
  attack: T1059.004
  crit: notable
  conf: 0.9

traits:
  - id: zig-bin-sh-c
    desc: Zig /bin/sh and -c nearby strings
    if:
      type: text
      regex: '"/bin/sh"[\s\S]{0,80}"-c"'
