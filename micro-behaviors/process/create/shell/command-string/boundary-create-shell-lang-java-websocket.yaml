defaults:
  crit: notable
  platforms: [windows, unix]
  for: [jsp, python, java, class]
  mbc: C0017
  attack: T1059

  conf: 0.9
traits:
- id: runtime-exec-cmd-c
  desc: Runtime.exec() with cmd.exe /c
  if:
    type: text
    regex: 'Runtime\.getRuntime\(\)\.exec\s*\([^\n]{0,240}["'']cmd\.exe["''][^\n]{0,80}["'']/c["'']'

- id: python-subprocess-cmd-c
  desc: Python launches cmd.exe through subprocess
  for: [python]
  if:
    type: text
    regex: 'subprocess\.(Popen|run|call|check_call)\s*\([^\n]{0,240}["'']cmd\.exe["'']'

