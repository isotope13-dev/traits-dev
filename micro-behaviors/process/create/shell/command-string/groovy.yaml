defaults:
  for: [groovy]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: groovy-shell-command-execute
    desc: Groovy executes a shell command list
    conf: 0.88
    if:
      type: text
      regex: '\[\s*["''][/a-z]{0,6}sh["'']\s*,\s*["'']-l?c["'']\s*,.{0,80}\]\.execute\s*\('
  - id: groovy-cmd-c-execute
    desc: Groovy cmd /c execute
    conf: 0.86
    if:
      type: text
      regex: '\[\s*["'']cmd["'']\s*,\s*["'']/c["'']\s*,.{0,80}\]\.execute\s*\('
