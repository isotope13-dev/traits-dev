defaults:
  platforms: [windows]
  for: [xml]
  crit: notable

traits:
  - id: msbuild-exec-command
    desc: MSBuild Exec task command attribute text
    conf: 0.86
    if:
      type: text
      regex: '(?i)<Exec\b[^>]{0,80}\bCommand\s*='

  # Exec runs `dotnet` on an assembly shipped inside the package beside the
  # .targets file. Code-generation packages do this too; consumers must add
  # evidence of what the bundled assembly does.
  - id: msbuild-exec-dotnet-package-assembly
    desc: MSBuild Exec runs package DLL via dotnet
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bCommand="dotnet\s+(&quot;)?\$\(MSBuildThisFileDirectory\)[^"]{0,80}\.dll\b'
