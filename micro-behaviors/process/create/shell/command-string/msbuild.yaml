# MSBuild Exec uses the command processor. The build task alone is neutral;
# the design-time target override is required by the LOLBin composites.
defaults:
  platforms: [windows]
  for: [xml]
  crit: notable

traits:
  - id: msbuild-exec-command
    desc: MSBuild Exec task with a command
    conf: 0.86
    if:
      type: text
      regex: '(?i)<Exec\b[^>]{0,80}\bCommand\s*='
  - id: msbuild-exec-executable
    desc: MSBuild Exec task names an executable
    conf: 0.9
    if:
      type: text
      regex: '(?i)<Exec\b[^>]{0,300}\.exe\b'
