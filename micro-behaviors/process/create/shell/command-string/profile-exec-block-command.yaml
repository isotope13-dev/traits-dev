defaults:
  platforms: [unix, windows, macos]
composite_rules:
  - id: exec-block-calculator-clues
    desc: Exec block and calculator command text
    crit: notable
    conf: 1.0
    all:
      - id: metadata/lang/source/syntax/call/construction::exec-block-text
      - id: metadata/build/config::command-line-calculator-text
  - id: exec-block-encoded-powershell-clues
    desc: Exec block and encoded PowerShell text
    crit: notable
    conf: 0.9
    all:
      - id: metadata/lang/source/syntax/call/construction::exec-block-text
      - id: micro-behaviors/process/deploy/interpreter-command::powershell-encoded-command-text
