defaults:
  platforms: [unix]
  crit: notable
  conf: 0.94
  for: [source, scripts, python, ruby, javascript, perl, php, lua, applescript]
  attack: T1059.004

traits:
  - id: shell-c-argv-curl-pipe-shell
    desc: Shell -c argv pipes curl into shell
    # Quote-delimited argv element after "-c": a curl|bash hint embedded in a
    # longer message string does not follow a -c element.
    if:
      type: text
      regex: '-c["'']\s*,\s*["''][^"''\r\n]{0,200}(curl|wget)[^"''\r\n]{0,200}\|\s*(ba|z)?sh\b'
  - id: plist-shell-c-string-curl-pipe-shell
    desc: Plist -c string pipes curl into shell
    if:
      type: text
      regex: '(?s)<string>\s*-c\s*</string>\s*<string>[^<]{0,200}(curl|wget)[^<]{0,200}\|\s*(ba|z)?sh\b'

composite_rules:
  - id: shell-c-argument-curl-pipe-shell
    desc: Shell -c argument pipes curl to shell
    any:
      - id: shell-c-argv-curl-pipe-shell
      - id: plist-shell-c-string-curl-pipe-shell
