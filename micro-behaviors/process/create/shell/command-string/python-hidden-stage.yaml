defaults:
  for:
  - python
  platforms:
  - unix
traits:
- id: python-fetch-hidden-temp
  desc: Shell fetch targets hidden temporary file
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: call
    exact: os.system
    arg:
      index: 0
      kind: string
      regex: wget\s+https?://[0-9.]+/\S+\s+-O\s+/tmp/\.[\w.-]+
- id: python-chmod-hidden-temp
  desc: Shell enables hidden temporary executable
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: call
    exact: os.system
    arg:
      index: 0
      kind: string
      regex: chmod\s+\+x\s+/tmp/\.[\w.-]+
- id: python-background-hidden-temp
  desc: Shell backgrounds hidden temporary path
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: call
    exact: os.system
    arg:
      index: 0
      kind: string
      regex: /tmp/\.[\w.-]+\s*&\s*$
