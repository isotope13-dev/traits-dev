defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for:
    - ruby
traits:
  - id: ruby-system-shell-interpreter
    desc: Ruby system shell interpreter
    conf: 0.86
    if:
      # Ruby calls `system` with and without parentheses, and the paren-less
      # `system "sh installer.sh"` form is the more common of the two. The
      # opening paren or quote is what keeps prose ("the system shell") out.
      type: text
      # `\bsh\b` also matched the `.sh` FILE EXTENSION, so running a script
      # read as invoking the sh interpreter: Homebrew's boolector.rb does
      # `system "./configure.sh", "-fPIC"` inside a checksummed
      # `resource(...).stage do`, the canonical vendored-dependency idiom.
      # Requiring a separator (space, slash or quote) before the interpreter name
      # keeps `system "sh installer.sh"` and `system "/bin/sh", "-c"` while dropping
      # `./configure.sh` and `./bootstrap.sh`.
      regex: '\bsystem\s*[("'']([^\n]{0,80}[\s/"''])?(sh|bash|zsh|shell)\b'
  - id: ruby-shell-exec
    desc: Shell execution via exec
    conf: 0.85
    if:
      type: string_literal
      regex: exec.{0,50}bin/sh|exec.{0,50}bin/shell
composite_rules:
  - id: ruby-system-shell-command
    desc: Ruby system shell command
    conf: 0.86
    any:
      - id: micro-behaviors/communications/http/download/cli::ruby-system-download-command
      - id: micro-behaviors/process/create/shell/command-string::ruby-system-shell-interpreter
