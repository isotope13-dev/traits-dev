defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, data]
  crit: notable
  conf: 0.96

composite_rules:
  # Raw multipart requests containing PHP can be identified as PHP source.
  # Exploit clients instead expose the same payload as a string literal.
  - id: php-payload-command-call
    desc: PHP shell command execution call
    any:
      - id: micro-behaviors/data/embedded/script::embedded-php-command-exec-call
      - id: micro-behaviors/process/create/shell/command-string::php-system-call
      - id: micro-behaviors/process/create/shell/spawn::php-exec
      - id: micro-behaviors/process/create/shell/spawn::php-shell-exec
      - id: micro-behaviors/process/create/shell/spawn::php-passthru
