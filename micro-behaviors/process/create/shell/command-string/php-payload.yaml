defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, data]
  crit: notable
  conf: 0.96

traits:
  # Wire captures with a PHP tag can be classified as PHP even when the
  # surrounding MIME syntax or a malformed payload prevents call extraction.
  # Match only the immediate tag-to-command-call syntax. This is a capability
  # observation, not proof of valid PHP, command execution, or exploitation.
  - id: php-tagged-command-call
    desc: PHP tag followed by command-call syntax
    if:
      type: text
      regex: '(?i)<\?php[\t ]+(system|exec|shell_exec|passthru)[\t ]*\('

composite_rules:
  # Raw multipart requests containing PHP can be identified as PHP source.
  # Exploit clients instead expose the same payload as a string literal.
  - id: php-payload-command-call
    desc: PHP shell command call syntax
    any:
      - id: php-tagged-command-call
      - id: micro-behaviors/data/embedded/script::embedded-php-command-exec-call
      - id: micro-behaviors/process/create/shell/command-string::php-system-call
      - id: micro-behaviors/process/create/shell/spawn::php-exec
      - id: micro-behaviors/process/create/shell/spawn::php-shell-exec
      - id: micro-behaviors/process/create/shell/spawn::php-passthru
