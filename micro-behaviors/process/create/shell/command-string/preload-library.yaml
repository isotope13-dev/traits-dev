# These imports and the loader variable imply shell-launch capability.
# They do not prove a command channel, constructor reachability, or a linked
# command buffer. GoAhead command templates still contain the unpatched
# PAYLOAD buffer; their source and constructor disassembly establish purpose.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.96

composite_rules:
  - id: preload-library-fork-system-api-set
    desc: Shared library with preload, fork, system APIs
    all:
      - id: micro-behaviors/os/env/runtime::ld-preload
      - id: micro-behaviors/process/create/fork::fork
      - id: micro-behaviors/process/create/shell/spawn::system-fn
    unless:
      # Preload exploit payloads are shared objects (.so); standalone executables have PT_INTERP.
      - id: metadata/binary/linking/runtime::interpreter
      - id: well-known/app/ai/coding-agent/
      # Node native addons (.node) are shared libraries loaded via dlopen, not preload exploit shims.
      - id: metadata/binary/symbols/exports::node-api-addon-export
      - id: metadata/binary/framework::node-module-register-export
      - id: well-known/lib/ui/cef::cef-browser-engine
