defaults:
  for: [ruby]
  platforms: [unix]
  crit: notable
  conf: 0.98

traits:
  - id: ruby-system-command-redirection
    desc: Ruby system string contains redirect characters
    if:
      type: tree-sitter
      query: |
        ((call !receiver method: (identifier) @method
          arguments: (argument_list . (string (string_content) @command) .)) @call
          (#eq? @method "system")
          (#match? @command "[<>][^<>]"))
