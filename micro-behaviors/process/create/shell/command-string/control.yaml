# Shell control syntax is a neutral command-string capability. HTTP request
# context and exploit intent belong in the composites that reference it.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

traits:
  - id: shell-control-string-literal
    desc: Shell separator plus command token
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '(?i)^[\s\w./:=@%+~\\-]{0,48}([;|]|%3[bB]|%7[cC]|&&|%26%26)\s*(id|sh|bash|cmd|powershell)\b'
    not:
      - regex: '(?i)\bredirect\s+curl\b'
      - regex: '(?i)\bcurl\b[^\n|]{0,80}\|\s*(ba)?sh\b[^\n]{0,40}\binstall\b'
      - regex: '(?i)&&\s*(ba)?sh\s+[\w/-]*\.sh\b'

  - id: unix-shell-command-token-literal
    desc: Unix command after shell separator
    crit: component
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '(?i)([;|]|%3[bB]|%7[cC]|&&|%26%26)\s*(id|sh|bash|curl|wget|nc|rm)([^=\w]|$)'

  - id: windows-shell-command-token-literal
    desc: Windows command after shell separator
    crit: component
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '(?i)([;|]|%3[bB]|%7[cC]|&&|%26%26)\s*(cmd|powershell)(\.exe)?\b'

composite_rules:
  - id: shell-command-token-any
    desc: String literal contains a shell command token
    crit: component
    conf: 0.98
    any:
      - id: unix-shell-command-token-literal
      - id: windows-shell-command-token-literal
