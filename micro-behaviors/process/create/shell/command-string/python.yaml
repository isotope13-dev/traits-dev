defaults:
  platforms: [unix]
  for: [python]

traits:
  # `subprocess.run(["/bin/sh", "-c", cmd.decode()])`: the shell's -c
  # operand starts with an identifier rather than a quote, so the command
  # text is computed at runtime.
  - id: python-subprocess-sh-c-runtime-command
    desc: Runs a computed string through sh -c
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'subprocess\.\w+\(\s*\[\s*["''](/bin/)?(ba)?sh["'']\s*,\s*["'']-c["'']\s*,\s*[A-Za-z_]'
