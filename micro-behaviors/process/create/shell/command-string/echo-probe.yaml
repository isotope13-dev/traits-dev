defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: interpolated-echo-execution-probe
    desc: Call receives an interpolated echo command
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_]\w*$'
      arg:
        kind: string
        regex: '^echo \{[A-Za-z_]\w*\}$'
