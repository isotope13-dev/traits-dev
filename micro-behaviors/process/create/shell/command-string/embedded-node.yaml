defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: notable
  conf: 0.96
traits:
  - id: embedded-node-shell-exec
    desc: Embedded Node shell execution call
    if:
      type: text
      regex: 'require\(["'']child_process["'']\)\.execFileSync\(["'']/bin/(sh|bash)["'']'

  - id: embedded-node-child-process-exec
    desc: Node child_process exec expression
    for: [scripts, source]
    if:
      type: text
      regex: "require\\(['\"]child_process['\"]\\)\\.exec\\("
