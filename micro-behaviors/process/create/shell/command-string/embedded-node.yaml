defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: notable
  conf: 0.96
traits:
  - id: embedded-node-shell-exec
    desc: Embedded Node shell execution call
    if:
      type: text
      regex: 'require\(["'']child_process["'']\)\.execFileSync\(["'']/bin/(sh|bash)["'']'

  - id: embedded-node-child-process-exec
    desc: Node child_process exec expression
    for: [scripts, source]
    if:
      type: text
      regex: "require\\(['\"]child_process['\"]\\)\\.exec\\("

  - id: inline-node-child-process-exec
    desc: Inline Node command invokes child_process exec
    crit: notable
    conf: 0.98
    for: [markdown, text]
    if:
      type: text
      regex: '(?s)\bnode\s+(-e|--eval)\s+[''"].{0,250}\b(node:)?child_process.{0,100}\bexec(Sync)?\s*\('
