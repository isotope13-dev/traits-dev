defaults:
  platforms: [windows]
  for: [python, batch, powershell]
  crit: notable
  conf: 0.95

traits:
  - id: forfiles-payload-command-array
    desc: Forfiles array carries cmd call
    if:
      type: text
      regex: 'forfiles\.exe["''][\s\S]{0,200}["'']cmd /c (ren @file .{0,80}& )?call\b'

  # forfiles substitutes each matched file for @file; renaming it and then
  # calling the new name runs a file whose on-disk extension was not a script.
  - id: forfiles-rename-then-call
    desc: Forfiles renames each match then calls it
    if:
      type: text
      regex: 'cmd /c ren @file \S{1,80} && call \S'
