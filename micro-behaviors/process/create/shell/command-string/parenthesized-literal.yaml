defaults:
  platforms: [windows, unix]
  for: [scripts, source]
traits:
  - id: parenthesized-command-literal
    desc: Parenthesized shell command string
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      exclude_docstrings: true
      regex: '(?i)(\$\(|%24%28)\s*(id|sh|bash|curl|wget|nc|rm|kill|whoami|uname)\b[^\r\n)]{0,40}(\)|%29)'
    unless:
      - type: text
        regex: 'function\s+\$\(\s*id\s*[,)]'
      - type: text
        regex: '\b(const|let|var)\s+\$\s*=\s*\(?\s*id\b'

