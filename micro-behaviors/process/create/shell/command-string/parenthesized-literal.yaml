defaults:
  platforms: [windows, unix]
  for: [scripts, source]
traits:
  - id: parenthesized-id-command-literal
    desc: Parenthesized id command with arguments
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      exclude_docstrings: true
      regex: '(?i)(\$\(|%24%28)\s*id(\s+[^\s)]|[|>;])[^\r\n)]{0,40}(\)|%29)'
    unless:
      - type: text
        regex: 'function\s+\$\(\s*id\s*[,)]'
      - type: text
        regex: '\b(const|let|var)\s+\$\s*=\s*\(?\s*id\b'
      - type: text
        regex: '\b(const|let|var)\s+\$\s*=\s*function\s*\(\s*id\b'

  - id: parenthesized-unix-command-literal
    desc: Parenthesized Unix utility command
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      exclude_docstrings: true
      regex: '(?i)(\$\(|%24%28)\s*(sh|bash|curl|wget|nc|rm|kill|whoami|uname)\b[^\r\n)]{0,40}(\)|%29)'

composite_rules:
  - id: parenthesized-command-literal
    desc: Command-substitution syntax in a source string
    crit: notable
    conf: 0.98
    any:
      - id: parenthesized-id-command-literal
      - id: parenthesized-unix-command-literal



