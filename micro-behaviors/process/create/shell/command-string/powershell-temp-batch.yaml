defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - powershell
traits:
- id: powershell-curl-temp-batch-invocation
  desc: Downloads and invokes identical TEMP batch path
  crit: notable
  conf: 0.98
  if:
    type: yara
    source: "rule powershell_curl_same_temp_batch {\n  strings:\n    $download = /\\bcurl(\\.exe)?[^\\r\\n;]{0,180}-o[\
      \ \\t]+\\$env:TEMP\\\\{1,2}[\\w.-]{1,64}\\.(cmd|bat)/ nocase\n    $invoke = /;[ \\t]*&[ \\t]+\\$env:TEMP\\\
      \\{1,2}[\\w.-]{1,64}\\.(cmd|bat)/ nocase\n    $path = /\\$env:TEMP\\\\{1,2}[\\w.-]{1,64}\\.(cmd|bat)/ nocase\n\
      \  condition:\n    $download and $invoke and\n    for any d in (1..#download) : (\n      for any e in (1..#invoke)\
      \ : (\n        @invoke[e] == @download[d]+!download[d] and\n        for any a in (1..#path) : (\n        \
      \  @path[a] >= @download[d] and @path[a]+!path[a] == @invoke[e] and\n          for any b in (1..#path) : (\n\
      \            @path[b] >= @invoke[e] and @path[b]+!path[b] == @invoke[e]+!invoke[e] and\n            !path[a]\
      \ == !path[b] and\n            for all k in (0..!path[a]-1) : (\n              (uint8(@path[a]+k) | 32) ==\
      \ (uint8(@path[b]+k) | 32)\n            )\n          )\n        )\n      )\n    )\n}\n"
- id: cmd-curl-temp-batch-invocation
  desc: Downloads and invokes quoted TEMP batch path
  crit: notable
  conf: 0.99
  for:
  - javascript
  - typescript
  - batch
  size_max: 262144
  if:
    type: yara
    source: "rule cmd_curl_same_temp_batch {\n  strings:\n    $download = /\\bcurl(\\.exe)?[^\\r\\n;&]{0,220}-o[\
      \ \\t]+\"%TEMP%\\\\{1,2}[\\w.-]{1,64}\\.(cmd|bat)\"/ nocase\n    $invoke = /[ \\t]*&&[ \\t]*\"%TEMP%\\\\{1,2}[\\\
      w.-]{1,64}\\.(cmd|bat)\"/ nocase\n    $path = /%TEMP%\\\\{1,2}[\\w.-]{1,64}\\.(cmd|bat)/ nocase\n  condition:\n\
      \    filesize <= 262144 and $download and $invoke and\n    for any d in (1..#download) : (\n      for any\
      \ e in (1..#invoke) : (\n        @invoke[e] == @download[d]+!download[d] and\n        for any a in (1..#path)\
      \ : (\n          @path[a] >= @download[d] and @path[a]+!path[a]+1 == @invoke[e] and\n          for any b in\
      \ (1..#path) : (\n            @path[b] >= @invoke[e] and @path[b]+!path[b]+1 == @invoke[e]+!invoke[e] and\n\
      \            !path[a] == !path[b] and\n            for all k in (0..!path[a]-1) : (\n              (uint8(@path[a]+k)\
      \ | 32) == (uint8(@path[b]+k) | 32)\n            )\n          )\n        )\n      )\n    )\n}\n"
- id: powershell-temp-batch-variable-invocation
  desc: Curl output variable invokes TEMP batch
  crit: notable
  conf: 0.99
  size_max: 262144
  if:
    type: yara
    source: "rule powershell_same_temp_batch_variable {\n  strings:\n    $command = /\\$[a-zA-Z_]\\w{0,31}=\"\\\
      $env:TEMP\\\\{1,2}[\\w.-]{1,64}\\.(cmd|bat)\";[ \\t]*&[ \\t]+curl(\\.exe)?[^\\r\\n;]{0,220}-o[ \\t]+\\$[a-zA-Z_]\\\
      w{0,31};[ \\t]*&[ \\t]+\\$[a-zA-Z_]\\w{0,31}/ nocase\n    $out = /-o[ \\t]+\\$[a-zA-Z_]\\w{0,31}/ nocase\n\
      \    $run = /;[ \\t]*&[ \\t]+\\$[a-zA-Z_]\\w{0,31}/\n    $variable = /\\$[a-zA-Z_]\\w{0,31}/\n  condition:\n\
      \    filesize <= 262144 and $command and $out and $run and\n    for any c in (1..#command) : (\n      for\
      \ any o in (1..#out) : (\n        @out[o] > @command[c] and\n        for any r in (1..#run) : (\n        \
      \  @run[r] == @out[o]+!out[o] and\n          @run[r]+!run[r] == @command[c]+!command[c] and\n          for\
      \ any a in (1..#variable) : (\n            @variable[a] == @command[c] and\n            for any b in (1..#variable)\
      \ : (\n              @variable[b] > @out[o] and @variable[b]+!variable[b] == @run[r] and\n              for\
      \ any d in (1..#variable) : (\n                @variable[d] > @run[r] and @variable[d]+!variable[d] == @run[r]+!run[r]\
      \ and\n                !variable[a] == !variable[b] and !variable[b] == !variable[d] and\n               \
      \ for all k in (0..!variable[a]-1) : (\n                  (uint8(@variable[a]+k) | 32) == (uint8(@variable[b]+k)\
      \ | 32) and\n                  (uint8(@variable[b]+k) | 32) == (uint8(@variable[d]+k) | 32)\n            \
      \    )\n              )\n            )\n          )\n        )\n      )\n    )\n}\n"
