defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.95
traits:
  - id: python-nested-object-command
    desc: Subprocess command from nested object fields
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: 'subprocess\.check_output\(\s*\w+\[["'']\w+["'']\]\[["'']\w+["'']\]'
  - id: js-nested-object-shell-command
    desc: Shell command from nested object fields
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: call
      regex: '\bexecSync\(\s*[\w$]+(\.[\w$]+|\[\s*["''][\w$]+["'']\s*\]){2}'
composite_rules:
  - id: python-nested-object-shell-command
    desc: Shell command from nested object fields
    for: [python]
    all:
      - id: python-nested-object-command
      - id: micro-behaviors/process/create/shell-subprocess::shell-true
  - id: nested-object-shell-command
    desc: Shell command from nested object fields
    for: [python, javascript, typescript]
    any:
      - id: python-nested-object-shell-command
      - id: js-nested-object-shell-command
