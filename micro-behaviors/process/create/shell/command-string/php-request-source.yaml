# This source form accepts optional embedding backslashes. It establishes a
# request-to-command expression, not an upload or mandatory escaping.
defaults:
  platforms: [windows, unix]
  for: [html, php, javascript]
  crit: notable
  conf: 0.96

traits:
  - id: php-system-request-source
    desc: PHP request-fed system expression in source
    if:
      type: text
      regex: 'system\s*\(\s*\\{0,3}\$_(GET|POST|REQUEST)\s*\\{0,3}\['
