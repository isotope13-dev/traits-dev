defaults:
  platforms: [macos, linux]
  for:
    - c
    - cpp
    - swift
    - zig
composite_rules:
  - id: c-popen-path-library-clues
    desc: popen PATH template and library clues
    crit: notable
    conf: 0.97
    all:
      - id: metadata/lang/source/naming/function/system::c-popen-symbol
      - id: metadata/lang/source/literal/string/command::c-export-path-command-template
    any:
      - id: micro-behaviors/fs/read/file/handle::fgets-api-import
      - id: metadata/binary/symbols/name/function::cpp-exception
