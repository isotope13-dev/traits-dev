traits:
  - id: node-exec-decoded-buffer-command
    desc: Executes a Buffer-decoded shell command
    crit: notable
    conf: 0.99
    platforms: [unix, windows]
    for: [javascript, typescript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression function: (identifier) @exec
          arguments: (arguments (call_expression function: (member_expression
            object: (call_expression function: (member_expression
              object: (identifier) @buffer property: (property_identifier) @from))
            property: (property_identifier) @to_string)))
          (#any-of? @exec "exec" "execSync") (#eq? @buffer "Buffer")
          (#eq? @from "from") (#eq? @to_string "toString"))
