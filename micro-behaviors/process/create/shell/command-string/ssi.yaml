# SSI command execution can implement ordinary page counters and other local
# page-generation helpers. The directive is also useful evidence in a payload
# catalog; its presence alone does not establish injection or execution.
defaults:
  platforms: [unix, windows]
  for: [html, text, data, source]

traits:
  - id: ssi-exec-cmd-directive
    desc: Contains an SSI shell-command exec directive
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)<!--\s*#exec\s+cmd\s*=\s*"'
