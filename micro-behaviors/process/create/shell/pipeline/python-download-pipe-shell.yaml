# A Python process call whose own command argument downloads a script and
# pipes it into a shell. Each atom is bound to the call's argument by dataflow,
# so a docstring or comment that merely mentions `curl ... | sh` near an
# unrelated call does not match. Matching contributing literals rather than the
# whole value also covers commands assembled with `+` or a URL held in a
# variable. Objectives require both atoms on the same line.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component
  conf: 0.95

traits:
  - id: python-shell-call-downloader-literal
    desc: Process call argument runs curl or wget
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '^(os\.(system|popen)|subprocess\.[a-z_]+)$'
      arg:
        index: 0
        from:
          value: '(^|[\s;&|(])(curl|wget)\s'

  - id: python-shell-call-pipe-shell-literal
    desc: Process call argument pipes to a shell
    if:
      type: symbol
      kind: call
      regex: '^(os\.(system|popen)|subprocess\.[a-z_]+)$'
      arg:
        index: 0
        from:
          value: '\|\s*(sudo\s+)?(ba|da|z)?sh\b'
  - id: python-fstring-call-curl-pipe-shell
    desc: F-string downloader pipes to shell
    crit: component
    if:
      type: text
      regex: 'subprocess\.call\(\s*f["''][^"'']{0,240}\b(curl|wget)\b[^"'']{0,240}\|\s*(bash|sh)\b'
      exclude_comments: true
