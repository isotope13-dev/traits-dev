traits:
- platforms:
  - linux
  - android
  for:
  - elf
  id: native-download-shell-pipeline-reference
  desc: Native binary embeds a download-to-shell command
  crit: notable
  conf: 0.98
  if:
    type: text
    # Require whitespace before arguments so embedded guardrail regexes
    # such as `curl_bash_execution(curl|wget)\s+...` do not look like commands.
    regex: '(?i)(wget|curl)\s+[^|\n]{1,120}\|\s*(\w+=\S+\s+){0,3}(ba|da)?sh\b'
  not:
  - regex: '(?i)\b(wget|curl)\s+\.\.\.\s*\|\s*(ba|da)?sh\b'
  - regex: '(?i)\b(wget|curl)\s+[^|\n]{0,80}\b(example\.\w+|\w+\.(example|invalid))'
