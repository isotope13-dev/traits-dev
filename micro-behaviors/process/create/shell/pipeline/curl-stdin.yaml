# Actual stdout-to-stdin relationship, not a quoted command or file-wide pair.
# Unknown curl options and shell modes are deliberately not inferred.
# This capability also describes legitimate installers; it is not hostile intent.
defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.97

traits:
  # Commented install instructions live in ui/help/curl-install-usage.yaml.
  # The same publication, printed instead of commented. An installer that
  # documents itself through `--help` rather than a header comment is making
  # the identical statement -- this command is meant to be run by a user --
  # and the comment-anchored sibling above could not see it. systemg's
  # scripts/index.sh, served from https://sh.sysg.dev/, echoes four such lines
  # and scored hostile as an OS-gated pipe loader.
  - id: help-text-curl-pipe-usage
    desc: Echo prints a quoted curl-to-shell example
    for: [shell, markdown, text]
    if:
      type: text
      regex: '(?m)^\s*echo\s+["''][^"''$`\n]{0,80}\bcurl\b[^"''$`\n]{0,99}\|\s*(ba)?sh\b[^"''$`\n]{0,40}["'']'

  - id: curl-response-shell-stdin
    desc: Pipes quiet curl response into shell
    unless:
      - id: micro-behaviors/data/source/function/names::shell-curl-function-definition
      - {type: symbol, kind: function, exact: sh}
      - {type: symbol, kind: function, exact: bash}
      - {type: symbol, kind: function, exact: zsh}
      - {type: symbol, kind: function, exact: nohup}
    if:
      type: tree-sitter
      language: shell
      # The parser excludes comments and quoted examples. Keep a redirect-free
      # parent for the ordinary pipeline path; the second path permits only
      # one or two explicit output-discard/descriptor-merge redirects.
      query: |
        [
          (_ !redirect (pipeline) @pipeline
            (#match? @pipeline "^\\s*(?:nohup\\s+)?(?:/usr/bin/)?curl\\s+(?:-[fSLv]*s[fSLv]*|--silent)(?:\\s+(?:-[fSLv]+|--(?:show-error|fail|location)))*(?:\\s+(?:-m|--max-time)\\s+[0-9]+)?\\s+['\"]?https?://[A-Za-z0-9][A-Za-z0-9.-]*\\.[A-Za-z]{2,}[:/][^\\s'\"]*['\"]?\\s*\\|\\s*(?:/(?:usr/)?bin/)?(?:sh|bash|zsh)(?:\\s+-s)?\\s*$")
            (#not-match? @pipeline "(?i)\\.localhost[:/]|<"))
          (redirected_statement
            body: (pipeline) @pipeline
            . redirect: (file_redirect) @output
            . redirect: (file_redirect)? @output_second
            (#match? @pipeline "^\\s*(?:nohup\\s+)?(?:/usr/bin/)?curl\\s+(?:-[fSLv]*s[fSLv]*|--silent)(?:\\s+(?:-[fSLv]+|--(?:show-error|fail|location)))*(?:\\s+(?:-m|--max-time)\\s+[0-9]+)?\\s+['\"]?https?://[A-Za-z0-9][A-Za-z0-9.-]*\\.[A-Za-z]{2,}[:/][^\\s'\"]*['\"]?\\s*\\|\\s*(?:/(?:usr/)?bin/)?(?:sh|bash|zsh)(?:\\s+-s)?\\s*$")
            (#not-match? @pipeline "(?i)\\.localhost[:/]|<")
            (#match? @output "^(1?>[ \\t]*/dev/null|2>&1)$")
            (#match? @output_second "^(1?>[ \\t]*/dev/null|2>&1)$"))
        ]
