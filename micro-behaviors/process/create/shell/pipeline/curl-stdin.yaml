# Actual stdout-to-stdin relationship, not a quoted command or file-wide pair.
# Unknown curl options and shell modes are deliberately not inferred.
# This capability also describes legitimate installers; it is not hostile intent.
defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.97

traits:
  - id: curl-response-shell-stdin
    desc: Pipes quiet curl response into shell
    unless:
      - id: micro-behaviors/data/source/function/names::shell-curl-function-definition
      - {type: symbol, kind: function, exact: sh}
      - {type: symbol, kind: function, exact: bash}
      - {type: symbol, kind: function, exact: zsh}
      - {type: symbol, kind: function, exact: nohup}
    if:
      type: tree-sitter
      language: shell
      # The parser excludes comments and quoted examples. Match the pipeline
      # node directly so plain and redirected statements share one query.
      # Capture command_name rather than word so predicate prechecks inspect
      # command names only, not every argument in unrelated pipelines.
      # Check downloader and shell text separately to avoid a costly regex
      # spanning the entire pipeline. The literal pipe binds their I/O flow.
      query: |
        ((pipeline
          . (command name: (command_name (word)) @producer) @download
          . "|"
          . (command name: (command_name (word)) @consumer) @shell .) @pipeline
          (#match? @producer "^(nohup|(/usr/bin/)?curl)$")
          (#match? @consumer "^(/(usr/)?bin/)?(sh|bash|zsh)$")
          (#match? @download "^(?:nohup\\s+)?(?:/usr/bin/)?curl\\s+(?:-[fSLv]*s[fSLv]*|--silent)(?:\\s+(?:-[fSLv]+|--(?:show-error|fail|location)))*(?:\\s+(?:-m|--max-time)\\s+[0-9]+)?\\s+['\"]?https?://(?:[A-Za-z0-9-]+\\.)+[A-Za-z]{2,}[:/][^\\s'\"]*['\"]?$")
          (#match? @shell "^(?:/(?:usr/)?bin/)?(?:sh|bash|zsh)(?:\\s+-s)?$")
          (#not-match? @pipeline "(?i)\\.localhost[:/]|<"))
