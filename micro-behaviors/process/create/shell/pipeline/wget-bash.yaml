defaults:
  platforms: [windows, linux, macos]
  for: [shell, python, javascript, ruby, perl, applescript]
traits:
  - id: wget-pipe-bash
    desc: wget-to-Bash pipeline text
    crit: notable
    conf: 0.7
    attack: T1059.004
    unless:
      - id: well-known/tool/detection/
      - type: basename
        regex: (?i)^(METADATA|PKG-INFO|README(\..*)?)$
      - id: metadata/package/freeform::pkg-description-content-type-markdown
      - id: metadata/package/files/dependency::vsix-bundled-output-path
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-docker-machine-binary
      - id: metadata/build/docker/
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
    if:
      type: text
      regex: '(?m)^[ \t]*(wget\b|[^#\s][^\n]{0,160}\bwget\s+)[^|\n]{1,160}\|\s*bash\b'
    not:
      - substr: apt.u.doover.com/install.sh
      - substr: imagenetloader.torch
      - substr: pi.dk/3
      - regex: 'wget\s+.{0,200}rustup\.rs.{0,200}\|\s*bash\b'
      - regex: 'githubusercontent\.com/(golangci/golangci-lint|golang/dep)/master/install\.sh'
      # Official NVM bootstrap installer (nvm-sh/nvm, formerly creationix/nvm).
      - regex: 'githubusercontent\.com/(creationix|nvm-sh)/nvm/.{0,80}/install\.sh'
      # Official Anchore Syft bootstrap installer.
      - regex: 'githubusercontent\.com/anchore/syft/.{0,80}/install\.sh'
      - regex: 'yarnpkg\.com/install\.sh'
      # Official Kubernetes quickstart installer.
      - regex: 'get\.k8s\.io\b'
