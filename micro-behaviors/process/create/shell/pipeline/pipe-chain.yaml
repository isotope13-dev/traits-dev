# Shell Pipe Chains
# Detects excessive piping or complex redirections in shell commands (stealth signal).
defaults:
  platforms: [unix]
  for: [shell]
traits:
- id: cat-grep-pipeline-four-pipes
  desc: cat/grep pipeline with four or more pipes
  crit: notable
  conf: 0.8
  unless:
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
    - id: metadata/file/format/structured::sourcemap-sources-content
    - id: metadata/file/extension/identity::squashfs-container-filename
  if:
    type: text
      # Command-like line with 4+ pipes; avoids ASCII tables, CSS vars, and encoded alphabets.
    regex: '(?m)\b(cat|grep)\b([^\n|]{0,119}[^\\\n|]\|){4}'

  count_max: 1003758
- id: awk-sed-pipeline-four-pipes
  desc: awk/sed pipeline with four or more pipes
  crit: notable
  conf: 0.8
  unless:
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
    - id: metadata/file/format/structured::sourcemap-sources-content
    - id: metadata/file/extension/identity::squashfs-container-filename
  if:
    type: text
      # Require shell-style spaced separators. Sed commonly uses `|` as its
      # s-expression delimiter, which is not a shell pipeline.
    regex: '(?m)\b(awk|sed)\b([^\n|]{0,119}[ \t]\|[ \t]){4}'

  count_max: 1003759
- id: cut-sort-pipeline-four-pipes
  desc: cut/sort pipeline with four or more pipes
  crit: notable
  conf: 0.8
  unless:
    - id: metadata/lang/source::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/source::linux-kernel-primary-tree-path
    - id: metadata/file/format/structured::sourcemap-sources-content
    - id: metadata/file/extension/identity::squashfs-container-filename
  if:
    type: text
      # Command-like line with 4+ pipes; avoids ASCII tables, CSS vars, and encoded alphabets.
    regex: '(?m)\b(cut|sort)\b[^\n|]{0,120}\|[^\n|]{1,120}\|[^\n|]{1,120}\|[^\n|]{1,120}\|'

  count_max: 1003760
- id: uniq-tr-pipeline-four-pipes
  desc: uniq/tr pipeline with four or more pipes
  crit: notable
  conf: 0.8
  unless:
    - id: metadata/file/format/structured::sourcemap-sources-content
    - id: metadata/file/extension/identity::squashfs-container-filename
    - id: metadata/binary/installer/script::install4j-unix-sfx
    - id: metadata/file/metrics::high-byte-script-text
  if:
    type: text
      # Command-like line with 4+ pipes; avoids ASCII tables, CSS vars, and encoded alphabets.
    regex: '(?m)\b(uniq|tr)\b[^\n|]{0,120}\|[^\n|]{1,120}\|[^\n|]{1,120}\|[^\n|]{1,120}\|'

  count_max: 1003761
- id: base64-curl-pipeline-four-pipes
  desc: base64/curl pipeline with four or more pipes
  crit: notable
  conf: 0.8
  unless:
    - id: metadata/file/format/structured::sourcemap-sources-content
    - id: metadata/file/extension/identity::squashfs-container-filename
  if:
    type: text
      # Command-like line with 4+ pipes; avoids ASCII tables, CSS vars, and encoded alphabets.
    regex: '(?m)\b(base64|curl)\b[^\n|]{0,120}\|[^\n|]{1,120}\|[^\n|]{1,120}\|[^\n|]{1,120}\|'

  count_max: 1003762
- id: wget-sh-pipeline-four-pipes
  desc: wget/sh pipeline with four or more pipes
  crit: notable
  conf: 0.8
  unless:
    - id: metadata/file/format/structured::sourcemap-sources-content
    - id: metadata/file/extension/identity::squashfs-container-filename
    - id: metadata/binary/installer/script::install4j-unix-sfx
    - id: metadata/file/metrics::high-byte-script-text
  not:
    # autotools config.sub/config.guess ship in every source tarball and list
    # the SuperH CPU family as `| sh | sh[1234] | sh[24]a | ...` -- a case
    # pattern alternation, not a pipeline. A bracket glob after `sh`, and a
    # line that opens with the separator, are both case-list shapes.
    - regex: '\bsh\[[0-9]'
    - regex: '(?m)^\s*\|'
  if:
    type: text
      # Require wget/sh to be a command token; do not match the `sh` suffix
      # of a script name or count the two characters in `||` as a pipeline.
      # Segments exclude newlines (as in every sibling rule here) so this stays
      # one command line: without that, an `sh -c ...` line followed by four
      # unrelated `... | grep` lines read as a single five-stage pipeline.
    regex: '(?m)(^|[;&|[:space:]])(wget|sh)([[:space:]]|$)[^|\n]{0,120}(\|[^|\n]{1,120}){4}'

  count_max: 1003763
- id: bash-python-pipeline-four-pipes
  desc: Bash/Python pipeline with four or more pipes
  crit: notable
  conf: 0.8
  unless:
    - id: metadata/file/format/structured::sourcemap-sources-content
    - id: metadata/file/extension/identity::squashfs-container-filename
  if:
    type: text
      # Command-like line with 4+ pipes; avoids ASCII tables, CSS vars, and encoded alphabets.
    regex: '(?m)\b(bash|python)\b[^\n|]{0,120}\|[^\n|]{1,120}\|[^\n|]{1,120}\|[^\n|]{1,120}\|'

  count_max: 1003764
- id: perl-ruby-pipeline-four-pipes
  desc: Perl/Ruby pipeline with four or more pipes
  crit: notable
  conf: 0.8
  unless:
    - id: metadata/file/format/structured::sourcemap-sources-content
    - id: metadata/file/extension/identity::squashfs-container-filename
  if:
    type: text
      # Command-like line with 4+ pipes; avoids ASCII tables, CSS vars, and encoded alphabets.
    regex: '(?m)\b(perl|ruby)\b[^\n|]{0,120}\|[^\n|]{1,120}\|[^\n|]{1,120}\|[^\n|]{1,120}\|'

  count_max: 1003765
- id: php-netcat-pipeline-four-pipes
  desc: PHP/netcat pipeline with four or more pipes
  crit: notable
  conf: 0.8
  unless:
    - id: metadata/file/format/structured::sourcemap-sources-content
    - id: metadata/file/extension/identity::squashfs-container-filename
    - id: metadata/binary/installer/script::install4j-unix-sfx
    - id: metadata/file/metrics::high-byte-script-text
  if:
    type: text
      # Command-like line with 4+ pipes; avoids ASCII tables, CSS vars, and encoded alphabets.
    regex: '(?m)\b(php|nc)\b[^\n|]{0,120}\|[^\n|]{1,120}\|[^\n|]{1,120}\|[^\n|]{1,120}\|'

  count_max: 1003766
- id: netcat-pipeline-four-pipes
  desc: Netcat pipeline has at least four pipes
  crit: notable
  conf: 0.8
  unless:
    - id: metadata/file/format/structured::sourcemap-sources-content
    - id: metadata/file/extension/identity::squashfs-container-filename
  if:
    type: text
      # Command-like line with 4+ pipes; avoids ASCII tables, CSS vars, and encoded alphabets.
    regex: '(?m)\b(netcat)\b[^\n|]{0,120}\|[^\n|]{1,120}\|[^\n|]{1,120}\|[^\n|]{1,120}\|'

  count_max: 1003767
- id: complex-redirection-chain--rx-11
  desc: Regex component marker
  crit: component
  conf: 0.75
  if:
    type: text
      # Matches combinations of single pipes and redirections
    regex: '(?m)\b(cat|grep)\b[^\n|]{0,160}\|[^\n|]{0,160}>[^\n|]{0,160}2>&1'

  count_max: 1003768
- id: complex-redirection-chain--rx-12
  desc: Regex component marker
  crit: component
  conf: 0.75
  if:
    type: text
      # Matches combinations of single pipes and redirections
    regex: '(?m)\b(awk|sed)\b[^\n|]{0,160}\|[^\n|]{0,160}>[^\n|]{0,160}2>&1'

  count_max: 1003769
- id: complex-redirection-chain--rx-13
  desc: Regex component marker
  crit: component
  conf: 0.75
  if:
    type: text
      # Matches combinations of single pipes and redirections
    regex: '(?m)\b(cut|sort)\b[^\n|]{0,160}\|[^\n|]{0,160}>[^\n|]{0,160}2>&1'

  count_max: 1003770
- id: complex-redirection-chain--rx-14
  desc: Regex component marker
  crit: component
  conf: 0.75
  if:
    type: text
      # Matches combinations of single pipes and redirections
    regex: '(?m)\b(uniq|tr)\b[^\n|]{0,160}\|[^\n|]{0,160}>[^\n|]{0,160}2>&1'

  count_max: 1003771
- id: complex-redirection-chain--rx-15
  desc: Regex component marker
  crit: component
  conf: 0.75
  if:
    type: text
      # Matches combinations of single pipes and redirections
    regex: '(?m)\b(base64|curl)\b[^\n|]{0,160}\|[^\n|]{0,160}>[^\n|]{0,160}2>&1'

  count_max: 1003772
- id: complex-redirection-chain--rx-16
  desc: Regex component marker
  crit: component
  conf: 0.75
  if:
    type: text
      # Matches combinations of single pipes and redirections
    regex: '(?m)\b(wget|sh)\b[^\n|]{0,160}\|[^\n|]{0,160}>[^\n|]{0,160}2>&1'

  count_max: 1003773
- id: complex-redirection-chain--rx-17
  desc: Regex component marker
  crit: component
  conf: 0.75
  if:
    type: text
      # Matches combinations of single pipes and redirections
    regex: '(?m)\b(bash|python)\b[^\n|]{0,160}\|[^\n|]{0,160}>[^\n|]{0,160}2>&1'

  count_max: 1003774
- id: complex-redirection-chain--rx-18
  desc: Regex component marker
  crit: component
  conf: 0.75
  if:
    type: text
      # Matches combinations of single pipes and redirections
    regex: '(?m)\b(perl|ruby)\b[^\n|]{0,160}\|[^\n|]{0,160}>[^\n|]{0,160}2>&1'

  count_max: 1003775
- id: complex-redirection-chain--rx-19
  desc: Regex component marker
  crit: component
  conf: 0.75
  if:
    type: text
      # Matches combinations of single pipes and redirections
    regex: '(?m)\b(php|nc)\b[^\n|]{0,160}\|[^\n|]{0,160}>[^\n|]{0,160}2>&1'

  count_max: 1003776
- id: complex-redirection-chain--rx-20
  desc: Regex component marker
  crit: component
  conf: 0.75
  if:
    type: text
      # Matches combinations of single pipes and redirections
    regex: '(?m)\b(netcat)\b[^\n|]{0,160}\|[^\n|]{0,160}>[^\n|]{0,160}2>&1'

  count_max: 1003777
- id: complex-redirection-chain--rx-21
  desc: Stderr redirection followed by a pipe
  crit: component
  conf: 0.75
  if:
    type: text
      # Matches combinations of single pipes and redirections
    regex: '2>&1[^\n|]{0,160}\|[^\n|]{1,160}'

  count_max: 1003778
composite_rules:
- id: shell-null-and-excessive-pipes
  desc: Script combines null redirection and long pipeline
  crit: notable
  conf: 0.8
  all:
  - id: micro-behaviors/os/console/io::null-redirect-stdout-stderr
  - id: micro-behaviors/process/create/shell/pipeline::excessive-pipes

- id: stealth-shell-chain
  # Was labeled "stealthy…concealment" but fired on any stderr-merge pipe
  # (e.g. `cmd 2>&1 | grep`), including ordinary Docker entrypoints.
  desc: Null redirects with a long pipeline
  crit: notable
  conf: 0.8
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: well-known/app/system/aks-engine/
  - id: well-known/tool/detection/wireshark/
  - id: well-known/tool/detection/wireshark::wireshark-artifact-path
  - id: micro-behaviors/os/service/legitimate::installer-script
  all:
  - id: micro-behaviors/process/create/shell/pipeline::shell-null-and-excessive-pipes
  downgrade:
    any:
    - id: metadata/signed/platform::apple
    - id: metadata/signed/platform/
- id: excessive-pipes
  desc: Shell pipeline has at least four pipes
  crit: notable
  conf: 0.8
  any:
  - id: cat-grep-pipeline-four-pipes
  - id: awk-sed-pipeline-four-pipes
  - id: cut-sort-pipeline-four-pipes
  - id: uniq-tr-pipeline-four-pipes
  - id: base64-curl-pipeline-four-pipes
  - id: wget-sh-pipeline-four-pipes
  - id: bash-python-pipeline-four-pipes
  - id: perl-ruby-pipeline-four-pipes
  - id: php-netcat-pipeline-four-pipes
  - id: netcat-pipeline-four-pipes
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: metadata/file/extension/identity::web-asset-extension
  - id: metadata/file/extension/identity::doc-or-config-extension
  - id: metadata/file/extension/identity::python-artifact-extension
  - id: metadata/build/autotools::autotools-config-basename
- id: complex-redirection-chain
  desc: Command with complex redirection and piping
  crit: notable
  conf: 0.75
  any:
  - id: complex-redirection-chain--rx-11
  - id: complex-redirection-chain--rx-12
  - id: complex-redirection-chain--rx-13
  - id: complex-redirection-chain--rx-14
  - id: complex-redirection-chain--rx-15
  - id: complex-redirection-chain--rx-16
  - id: complex-redirection-chain--rx-17
  - id: complex-redirection-chain--rx-18
  - id: complex-redirection-chain--rx-19
  - id: complex-redirection-chain--rx-20
  - id: complex-redirection-chain--rx-21
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: metadata/package/testing/presence/harness/
  - id: metadata/build/autotools::autoconf-generated-script
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: metadata/file/extension/identity::web-asset-extension
  - id: metadata/file/extension/identity::doc-or-config-extension
  - id: metadata/file/extension/identity::python-artifact-extension
  - id: metadata/build/autotools::autotools-config-basename
- id: pipe-with-stderr-merge
  desc: Pipes merged stdout and stderr through a utility
  crit: notable
  conf: 0.8
  all:
  - id: micro-behaviors/process/create/shell/pipeline::complex-redirection-chain--rx-21
  any:
  - id: micro-behaviors/os/console/io::redirect-dev-null
  - id: micro-behaviors/data/encoded::base64-token
  - id: micro-behaviors/communications/socket/netcat::netcat-keyword
  - id: micro-behaviors/process/interpreter/python::python-keyword
  - id: micro-behaviors/process/create/shell/spawn::bash-keyword
  - id: micro-behaviors/communications/http/download/curl::curl-keyword
  - id: micro-behaviors/fs/search::grep-keyword
  - id: micro-behaviors/process/interpreter/perl::perl-keyword
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: metadata/build/autotools::autoconf-generated-script
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
