# A documented installation command is useful execution evidence without
# establishing trojanization. Require the skill and command in the same file;
# an unrelated README pipeline elsewhere in its archive is not an instruction.
defaults:
  platforms: [unix, windows]
  for: [markdown]

composite_rules:
  - id: agent-skill-curl-pipe-install-documentation
    desc: Agent skill documents a remote shell pipeline
    crit: notable
    conf: 0.94
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text

  - id: agent-skill-powershell-pipe-install-documentation
    desc: Agent skill documents a remote PowerShell pipeline
    crit: notable
    conf: 0.93
    all:
      - id: metadata/package/agent-skill::agent-skill-frontmatter
      - id: micro-behaviors/process/create/shell/pipeline::powershell-webrequest-to-iex-pipeline
