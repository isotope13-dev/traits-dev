# Decoder-to-shell transport alone need not conceal an embedded payload.
# The anti-static rule additionally requires an inline hex literal.
defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: xxd-hexdecode-shell-stdin
    desc: xxd hex-decode pipeline feeds a shell
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'xxd\s+-r[^|\n]{0,16}\|\s*(ba)?sh\b'
