# Match the outer pipeline in parsed shell code, excluding comments and
# strings that merely document an installer command. The decoder substitutes
# the curl destination; the HTTP response, rather than the decoded URL, executes.
defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.97

traits:
  - id: curl-decoded-destination-shell-stdin
    desc: Curl decoded-URL response piped into shell
    size_max: 8192
    if:
      type: tree-sitter
      language: shell
      # Reject unrelated pipelines structurally before checking their text.
      query: |
        ((pipeline
           . (command
               name: (command_name (word) @curl)
               argument: (command_substitution
                 (pipeline
                   . (command name: (command_name (word) @emit))
                   . (command name: (command_name (word) @decoder)) .)))
           . (command name: (command_name (word) @shell)) .) @pipeline
          (#match? @curl "^(/usr/bin/)?curl$")
          (#match? @shell "^(/(usr/)?bin/)?(sh|bash|zsh|dash|ksh)$")
          (#match? @emit "^(echo|printf)$")
          (#match? @decoder "^(openssl|base64)$")
          (#match? @pipeline "[A-Za-z0-9+/=]{24,4096}")
          (#match? @pipeline "(-d|--decode|-D)"))
