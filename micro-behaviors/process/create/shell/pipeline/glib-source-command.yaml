defaults:
  platforms: [linux]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.96

traits:
  - id: glib-curl-to-shell-command
    desc: Configures GLib curl-to-shell command
    if:
      type: symbol
      kind: call
      exact: GLib.spawn_command_line_async
      arg:
        index: 0
        kind: string
        regex: "^/bin/(ba)?sh -c 'curl [^']{1,180}\\| sh'$"

