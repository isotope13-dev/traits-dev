# Neutral mechanics; these conditions do not establish an attacker objective.
defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: base64-http-destination-shell-pipeline
    desc: Base64 HTTP URL near decoded-destination pipeline
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/shell/pipeline::curl-decoded-destination-shell-stdin
    any:
      - id: micro-behaviors/communications/http/url/encoded::base64-decoded-http-url
      - id: micro-behaviors/communications/http/url/encoded::base64-decoded-ipv4-http-url
    near_lines: 1
