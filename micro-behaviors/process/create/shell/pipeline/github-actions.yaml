defaults:
  platforms: [unix, windows]
  for: [github-actions]
  attack: T1059.004

traits:
# A `run:` body is shell, but the file is typed `github-actions`, so nothing in
# the shell pipeline family reaches it — only the rustup URL below was covered,
# and every other bootstrap (cargo-dist, uv, deno, bun, homebrew, or an
# attacker's) went unreported. Matched through the `run` value path, which is
# how a workflow's shell actually has to be read. Notable: this is the ordinary
# way CI installs a tool, and composites supply the intent when the URL is
# opaque or comes from a secret. Overlaps the rustup atom by design — that one
# names a specific vendor bootstrap and does not require a fetch tool.
- id: workflow-step-fetch-pipe-shell
  desc: Workflow step pipes a download to shell
  crit: notable
  conf: 0.92
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: '\b(curl|wget)\b[^|\n]{0,200}\|\s*(bash|sh|zsh)\b'

- id: rustup-installer-pipe
  desc: Rustup installer piped to shell
  crit: notable
  conf: 0.9
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: 'https://sh\.rustup\.rs\b[^|\n]{0,160}\|\s*(bash|sh)\b'
