defaults:
  crit: notable
  for: [github-actions]
  platforms: [unix, windows]
  attack: T1059.004

traits:
# A `run:` body is shell, but the file is typed `github-actions`, so nothing in
# the shell pipeline family reaches it — only the rustup URL below was covered,
# and every other bootstrap (cargo-dist, uv, deno, bun, homebrew, or an
# attacker's) went unreported. Matched through the `run` value path, which is
# how a workflow's shell actually has to be read. Notable: this is the ordinary
# way CI installs a tool, and composites supply the intent when the URL is
# opaque or comes from a secret. Overlaps the rustup atom by design — that one
# names a specific vendor bootstrap and does not require a fetch tool.
- id: workflow-step-fetch-pipe-shell
  desc: Workflow step pipes a download to shell
  crit: notable
  conf: 0.92
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: '\b(curl|wget)\b[^|\n]{0,200}\|\s*(bash|sh|zsh)\b'

# Composite actions store their executable shell bodies under `runs.steps`,
# not `jobs.*.steps`. Keep the same claim and severity as the workflow rule;
# the URL can be a normal installer input or arbitrary caller-controlled code.
- id: composite-action-step-fetch-pipe-shell
  desc: Composite action pipes a download to shell
  crit: notable
  conf: 0.92
  if:
    type: value
    path: runs.steps[*].run
    regex: '\b(curl|wget)\b[^|\n]{0,200}\|\s*(bash|sh|zsh)\b'

- id: rustup-installer-pipe
  desc: Rustup installer piped to shell
  crit: notable
  conf: 0.9
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: 'https://sh\.rustup\.rs\b[^|\n]{0,160}\|\s*(bash|sh)\b'

# Supplied Base64 is decoded directly into the workflow shell.
- id: base64-d-pipe-bash
  desc: Supplied Base64 decoded and piped to bash
  crit: suspicious
  conf: 0.82
  platforms: [unix, android, ios]
  attack: T1027
  downgrade:
    any:
      - id: metadata/package/testing/presence/path::github-actions-testdata-directory-path
  if:
    type: text
    regex: '\b(echo|printf|cat|curl)\b[^|\n]{1,160}\|\s*base64\s+-d\s*\|\s*bash\b'
  unless:
    - id: micro-behaviors/data/encode/base64/transport::shell-base64-transport-roundtrip
    - id: micro-behaviors/data/encode/base64/transport::bound-base64-shell-transport
