defaults:
  platforms: [unix, windows]
  for: [github-actions]
  attack: T1059.004

traits:
- id: rustup-installer-pipe
  desc: Rustup installer piped to shell
  crit: notable
  conf: 0.9
  if:
    type: value
    path: jobs.*.steps[*].run
    regex: 'https://sh\.rustup\.rs\b[^|\n]{0,160}\|\s*(bash|sh)\b'
