defaults:
  for: [scripts, source]
  platforms: [unix]
  crit: notable
  conf: 0.98
traits:
  - id: interactive-file-input-output-pipe
    desc: Interactive shell reads file, pipes output
    if:
      type: text
      regex: '/bin/(ba|da|z|k)?sh\s+-i\s*<\s*/[\w./-]+\s+2>&1\s*\|'
  - id: pipe-to-openssl-client
    desc: Pipes output into OpenSSL TLS client
    if:
      type: text
      regex: '\|\s*(/usr/bin/)?openssl\s+s_client\b'
