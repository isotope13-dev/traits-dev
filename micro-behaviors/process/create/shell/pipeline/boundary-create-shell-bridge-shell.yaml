defaults:
  platforms: [unix]
  for: [shell, github-actions]
  crit: exception
  conf: 0.95
composite_rules:
- id: shell-base64-transport-roundtrip
  desc: Shell encodes and decodes Base64 as transport
  for: [shell]
  near_bytes: 600
  all:
  - id: micro-behaviors/data/encode/base64::shell-base64-encode-pipeline
  - id: metadata/lang/source/syntax/command/pipeline::base64-decode-shell-stdin

- id: base64-shell-transport-context
  desc: Base64 value transported through shell
  platforms: [unix, windows]
  for: [shell, javascript, typescript, python, github-actions]
  any:
  - id: micro-behaviors/data/encode/base64::textencoder-template-base64-shell-transport
  - id: metadata/file/profile/operation-cooccurrence::runtime-base64-shell-transport
  - id: micro-behaviors/data/encode/base64::python-runtime-base64-shell-transport
  - id: metadata/file/profile/operation-cooccurrence::printf-fed-base64-shell-transport
  - id: micro-behaviors/process/create/shell/pipeline::shell-base64-transport-roundtrip

