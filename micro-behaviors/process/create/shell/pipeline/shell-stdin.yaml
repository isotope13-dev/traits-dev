# A pipeline whose right-hand side is a shell named by absolute path
# (`... | /bin/sh`, `... | /bin/bash`). This is the neutral "feed commands to
# a shell over stdin" primitive: it is one half of a `nc | /bin/sh` reverse
# shell, and equally the `curl -fsSL <url> | /bin/bash` bootstrap that
# installers, version managers and dev-environment tools ship. The intent
# comes from what is on the LEFT of the pipe, which is supplied by the
# composites in objectives/command-and-control/reverse-shell/ and by the
# download-and-execute rules.
#
# The `/bin/`-qualified form needs its own matcher: the sibling
# `curl-pipe-shell-text` here requires the shell word to follow the pipe
# directly, so it never sees `| /bin/bash`.
defaults:
  platforms: [linux, macos]
  for: [scripts, source]
  attack: T1059

traits:
  - id: pipe-to-absolute-shell-path
    desc: Pipes a stream into /bin/sh stdin
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\|\s*/bin/(ba)?sh\b'
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: well-known/tool/detection/llm-scanner/
      - id: metadata/file/catalog/identity::elastic-license-v2
      - type: basename
        regex: '(METADATA|PKG-INFO|README(\..*)?)$'
      - id: metadata/package/manifest/freeform::pkg-description-content-type-markdown
