defaults:
  platforms: [unix]
  for: [html, javascript, typescript]
composite_rules:
  - id: curl-decoded-url-shell-pipeline
    desc: Decoding near curl substitution shell pipeline
    crit: notable
    conf: 0.9
    near_lines: 0
    all:
      - id: micro-behaviors/process/create/shell/pipeline::curl-command-substitution-url
      - id: micro-behaviors/data/decode/base64::base64-decode-command-option
    any:
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-zsh
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
