defaults:
  platforms: [unix]
  for: [html, javascript, typescript]
composite_rules:
  - id: curl-decoded-url-shell-pipeline
    desc: Decoding near curl substitution shell pipeline
    crit: notable
    conf: 0.9
    near_lines: 0
    all:
      - id: micro-behaviors/communications/http/curl/command::curl-command-substitution-argument
      - id: micro-behaviors/data/decode/command::base64-decode-command-option
    any:
      - id: metadata/lang/source/syntax/command/download::curl-pipe-zsh
      - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-text
