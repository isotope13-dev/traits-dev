defaults:
  platforms: [unix]
traits:
- id: makefile-curl-pipe-shell
  desc: Makefile pipes download to shell
  crit: suspicious
  conf: 0.9
  for:
  - makefile
  if:
    type: text
    regex: (?m)^\s*(curl|wget).{0,50}\|.{0,20}\b(shell|bash|sh)\b
  unless:
  # A Makefile under vendor/ or third_party/ is a vendored dependency's own
  # development Makefile (release, license-header, lint targets); the
  # consuming package's build never invokes it, so its recipes are not
  # behavior of the package under scan.
  - id: metadata/package/files/dependency::vendored-build-file-path
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: well-known/tool/packaging/nix::nixos-install-script-url
  - id: well-known/tool/development/lint/linter::golangci-raw-repo-url
  - type: text
    regex: ^#!
  - type: text
    regex: '(golangci-lint\.run|golangci/golangci-lint)'
  - type: text
    substr: install_kustomize.sh
  - type: basename
    regex: ^[Jj]ustfile$
  - type: basename
    regex: .*\.(ya?ml|json|toml)$
    case_insensitive: true
  not:
  - substr: 'uses: actions/'
  - substr: curl http://npmjs.org/install.sh
  - substr: golangci-lint.run/install.sh
  - substr: golangci/golangci-lint
  - substr: install_kustomize.sh
  - substr: KUSTOMIZE_INSTALL_SCRIPT
  - substr: astral.sh
  - substr: rustup.rs
  - substr: curl -sS https://webinstall.dev/k9s | bash
  - substr: curl https://getmic.ro | bash
  - substr: https://dot.net/v1/dotnet-install.sh | bash
  # GoReleaser's official installer host: the same well-known lint-binary
  # shim as golangci-lint.run/install.sh above, served from its older domain.
  - substr: install.goreleaser.com
  # Historical GoReleaser release runner. Filter only the matched pipeline,
  # so its presence cannot suppress an unrelated download-and-shell recipe.
  - regex: 'https://git\.io/goreleaser[ \t]*\|[ \t]*bash$'
  # licensei's documented install recipe pipes its own release shim to bash.
  - substr: git.io/licensei
  # gometalinter documented install recipe pipes its release shim to bash.
  - substr: git.io/vp6lP
  # Ollama official installer
  - substr: ollama.com/install.sh
  # mise-en-place official installer
  - substr: mise.run
  - substr: mise.jdx.dev
  # Octelium official installer
  - substr: octelium.com/install.sh
  # Bun official installer
  - substr: bun.sh/install
  # Claude Code official installer
  - substr: claude.ai/install.sh
  # Docker official installer (get.docker.com piped to sh in a docker:
  # prerequisite target is how projects provision the Engine in builds)
  - substr: get.docker.com
  # Pulumi official installer, same shape as get.docker.com.
  - substr: get.pulumi.com
  # NodeSource official setup scripts (deb and RPM).
  - substr: rpm.nodesource.com
  - substr: deb.nodesource.com
