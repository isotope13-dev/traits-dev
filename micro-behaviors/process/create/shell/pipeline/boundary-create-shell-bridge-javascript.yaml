defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
traits:
  - id: js-runtime-base64-shell-interpolation
    desc: Interpolates runtime Base64 into shell pipeline
    crit: notable
    conf: 0.96
    attack: T1059.007
    if:
      type: text
      regex: \$\{\w+(\(\w+\))?\}['"]?\s*\|\s*base64\s+--?d\s*\|\s*(sudo\s+)?(ba)?sh\b
  - id: js-inline-base64-shell-interpolation
    desc: Interpolates inline Base64 into shell pipeline
    crit: notable
    conf: 0.94
    attack: T1059.007
    if:
      type: text
      regex: \$\{[^}]{0,40}\.toString\(["']base64["']\)\}['"]?\s*\|\s*base64\s+--?d\s*\|\s*(ba)?sh\b
  - id: js-printf-base64-shell-pipeline
    desc: Printf-fed Base64 into shell pipeline
    crit: notable
    conf: 0.94
    attack: T1059.007
    if:
      type: text
      regex: printf\s+%s\s+\$\{[^}]{0,80}\}\s*\|\s*base64\s+--?d(ecode)?\s*\|\s*(ba)?sh\b
  - id: js-inline-encoded-printf-shell-pipeline
    desc: Runtime-encoded printf pipeline transport
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: from\([^'"`\s][^}]{0,30}\.toString\(['"]base64['"]\)[^}]{0,6}\} \| base64 -d \| (ba)?sh
  - id: js-decode-pipe-shell-command
    desc: JavaScript contains decode-to-shell pipeline
    crit: suspicious
    conf: 0.94
    attack: T1059.007,T1140
    unless:
      - id: micro-behaviors/data/encode/base64::textencoder-template-base64-shell-transport
      - id: well-known/tool/detection/
      - id: metadata/file/profile/operation-cooccurrence::runtime-base64-shell-transport
      - id: metadata/file/profile/operation-cooccurrence::printf-fed-base64-shell-transport
      - id: micro-behaviors/process/create/shell/pipeline::js-inline-encoded-printf-shell-pipeline
      - id: metadata/file/format/markup::adblock-filter-list
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
      - id: metadata/file/profile/test-indications/
    if:
      type: literal
      kind: string
      regex: (Bash\()?base64 --?d[^\n]{0,60}\|\s*\(?(ba)?sh
    not:
      - regex: ^Bash\(
