defaults:
  platforms: [windows]
  attack: T1059.003

traits:
  - id: more-or-type-pipe-to-cmd
    desc: Pipes file text into shell interpreter
    crit: suspicious
    conf: 0.96
    for: [batch, powershell, text, media]
    if:
      type: text
      regex: '(?i)\b(more|type)\s+[^\r\n|]{1,120}\^?\|[ \t\^]*(c\^?m\^?d|powershell)\b'

  - id: echo-fetch-pipe-cmd-redirect
    desc: Echoes remote fetch-to-cmd stage pipeline
    crit: suspicious
    conf: 0.97
    attack: T1059.003,T1105
    for: [batch, text]
    if:
      type: text
      regex: '(?i)\becho\s+(curl|wget|powershell)\b[^\r\n]{1,140}\|[ ^]*c\^?m\^?d(\.exe)? *>'
