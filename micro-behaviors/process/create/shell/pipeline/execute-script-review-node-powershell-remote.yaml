defaults:
  platforms: [windows, linux]
  for: [javascript, typescript]


traits:
  - id: js-exec-curl-pipe-shell-literal
    desc: Node exec string pipes curl to shell
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bexec\s*\(\s*["''][^"'']{0,12}curl\s+[^"'']{0,240}\|\s*(bash|sh)\b'
