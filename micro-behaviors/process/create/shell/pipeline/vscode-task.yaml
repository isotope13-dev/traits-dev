defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [json]

traits:
  - id: vscode-task-pipes-shell
    desc: VS Code task pipes into shell
    attack: T1059
    if:
      type: value
      path: tasks[*].command
      regex: '\|\s*(sh|bash|cmd)\b'
      case_insensitive: true

  - id: vscode-task-pipes-powershell-eval
    desc: VS Code task pipes into PowerShell eval
    attack: T1059.001
    if:
      type: value
      path: tasks[*].command
      regex: '\|\s*(iex|invoke-expression)\b'
      case_insensitive: true
