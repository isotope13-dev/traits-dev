defaults:
  platforms:
  - windows
traits:
- id: cmd-file-piped-command-interpreter
  desc: Cmd pipes file contents to command interpreter
  crit: notable
  conf: 0.99
  for:
  - pe
  - batch
  - cmd
  if:
    type: text
    regex: (?i)\bcmd\s+/c\s+\w{3,16}\s*&\s*type\s+\S+\.\w{2,6}\s*\|\s*(%comspec%|cmd)\b
