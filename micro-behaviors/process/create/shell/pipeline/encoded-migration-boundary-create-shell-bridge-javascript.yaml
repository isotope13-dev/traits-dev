defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
traits:
  - id: js-runtime-base64-shell-interpolation
    desc: Interpolates runtime Base64 into shell pipeline
    crit: notable
    conf: 0.96
    attack: T1059.007
    if:
      type: text
      regex: \$\{\w+(\(\w+\))?\}['"]?\s*\|\s*base64\s+--?d\s*\|\s*(sudo\s+)?(ba)?sh\b
  - id: js-inline-base64-shell-interpolation
    desc: Interpolates inline Base64 into shell pipeline
    crit: notable
    conf: 0.94
    attack: T1059.007
    if:
      type: text
      regex: \$\{[^}]{0,40}\.toString\(["']base64["']\)\}['"]?\s*\|\s*base64\s+--?d\s*\|\s*(ba)?sh\b
  - id: js-printf-base64-shell-pipeline
    desc: Printf-fed Base64 into shell pipeline
    crit: notable
    conf: 0.94
    attack: T1059.007
    if:
      type: text
      regex: printf\s+%s\s+\$\{[^}]{0,80}\}\s*\|\s*base64\s+--?d(ecode)?\s*\|\s*(ba)?sh\b
  - id: js-inline-encoded-printf-shell-pipeline
    desc: Runtime-encoded printf pipeline transport
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: from\([^'"`\s][^}]{0,30}\.toString\(['"]base64['"]\)[^}]{0,6}\} \| base64 -d \| (ba)?sh
  - id: js-decode-pipe-shell-command
    desc: JavaScript contains decode-to-shell pipeline
    crit: suspicious
    conf: 0.94
    attack: T1059.007,T1140
    unless:
      - id: micro-behaviors/data/encode/base64/transport::textencoder-template-base64-shell-transport
      - id: micro-behaviors/data/encode/base64/transport::runtime-base64-shell-transport
      - id: micro-behaviors/data/encode/base64/transport::printf-fed-base64-shell-transport
      - id: micro-behaviors/process/create/shell/pipeline::js-inline-encoded-printf-shell-pipeline
      - id: metadata/file/format/markup::adblock-filter-list
      - id: well-known/app/browser-extension/ublock-origin::lite-scriptlet-bundle
      - id: javascript-scanner-input-test
      - id: skill-scanner-pipeline-case
      - id: objectives/command-and-control/reverse-shell/dev-tcp::scanner-candidate-without-process-api
    if:
      type: literal
      kind: string
      regex: (Bash\()?base64 --?d[^\n]{0,60}\|\s*\(?(ba)?sh\b
    not:
      - regex: ^Bash\(
  - id: skill-scanner-pipeline-case
    desc: Skill scanner pipeline test case
    crit: notable
    unless:
      - type: text
        regex: 'child_process|Bun\.(spawn|\$)'
      - type: text
        regex: '\b(execSync|spawnSync|execFile)\s*\('
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @test
          arguments: (arguments (string) (arrow_function body: (statement_block) @body)))
          (#match? @test "^(it|test)$")
          (#match? @body "base64 --?d")
          (#match? @body "skill_body:")
          (#match? @body "\\.verdict\\)\\.toBe\\([\"']fail[\"']\\)")
          (#match? @body "scanUnsafeInstructions\\s*\\(")
          (#match? @body "expect\\s*\\("))
composite_rules:
  - id: javascript-scanner-input-test
    desc: JavaScript scanner catalog or test context
    crit: exception
    any:
      - id: well-known/tool/detection/pattern-catalog::js-host-scan-catalog
      - id: metadata/file/catalog/threat-pattern::command-rule-test-catalog
      - id: metadata/package/testing/corpus/security-tests/command::browser-wasm-command-demo
      - id: metadata/package/testing/corpus/command-deny-tests::node-deny-pattern-case-table
      - id: metadata/package/testing/corpus/security-tests/scanner::scanner-content-unit-test
      - id: metadata/package/testing/corpus/security-tests/command::command-safety-classifier-test
      - id: metadata/package/testing/corpus/security-tests/command::node-detector-verdict-test
      - id: metadata/package/testing/harness/unit::javascript-node-test-unit-test-context
