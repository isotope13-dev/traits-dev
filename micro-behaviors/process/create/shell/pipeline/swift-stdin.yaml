defaults:
  platforms: [freebsd, unix]
  for: [swift]

traits:
  - id: swift-urlsession-shell-stdin-pipe
    desc: Swift URLSession and shell stdin pipe
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'URLSession\.shared\.dataTask[\s\S]{0,460}standardInput\s*=\s*pipe'

  - id: swift-shell-stdin-write
    desc: Swift writes script to shell stdin
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'stdin\.write[\s\S]{0,100}script\.data'

composite_rules:
  - id: swift-urlsession-shell-stdin-profile
    desc: Swift URLSession and shell stdin clues
    crit: suspicious
    conf: 0.98
    all:
      - id: swift-urlsession-shell-stdin-pipe
      - id: swift-shell-stdin-write
