defaults:
  for: [package.json]
  platforms: [unix, windows]
traits:
- id: preinstall-pipe-sh
  desc: Preinstall pipes output to sh
  crit: notable
  conf: 0.85
  if:
    type: value
    path: "scripts.preinstall"
    regex: '(^|[^|])\|[ \t]*sh([ \t]|$)'
- id: preinstall-pipe-shell
  desc: Preinstall pipes output to shell
  crit: notable
  conf: 0.85
  if:
    type: value
    path: "scripts.preinstall"
    regex: '(^|[^|])\|[ \t]*shell([ \t]|$)'
composite_rules:
- id: preinstall-interpreter-pipe
  desc: Preinstall pipes output to interpreter
  crit: notable
  conf: 0.85
  unless:
  - id: well-known/tool/sysadmin/alpine-packages/package::alpine-langfuse-package
  - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-langfuse-next-app-path
  - id: well-known/tool/sysadmin/alpine-packages/package::datadog-libdatadog-package-json
  - id: well-known/tool/sysadmin/alpine-packages/package::datadog-libdatadog-package
  - id: micro-behaviors/os/package-manager/installer-script::wasm-pack-installer-script-url
  any:
  - id: micro-behaviors/process/create/shell/pipeline::preinstall-pipe-sh
  - id: micro-behaviors/process/create/shell/pipeline::preinstall-pipe-shell
  - id: micro-behaviors/process/interpreter/node::preinstall-pipe-node
        # Download and execute composite
