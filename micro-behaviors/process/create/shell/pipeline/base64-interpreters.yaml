defaults:
  platforms: [unix, windows]
  for: [shell]
traits:
  - id: decode-pipe-bash
    desc: References base64 decoding piped to bash
    crit: notable
    conf: 0.95
    for: [github-actions]
    if:
      type: text
      regex: 'base64\s+-d\s*\|\s*bash\b'
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog

  - id: decode-pipe-env-shell
    desc: Base64 decode-to-shell pipeline through env
    crit: notable
    conf: 0.9
    for: [shell, applescript, text, python]
    if:
      type: text
      regex: '\bbase64\s+(-[dD]|--decode)\s*\|\s*env\s+(\w{1,20}=\S{1,20}\s+)?(/bin/)?(ba|da|z|k)?sh\b'
