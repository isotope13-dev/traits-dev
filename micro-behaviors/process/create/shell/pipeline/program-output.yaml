defaults:
  platforms: [unix]
  for: [shell, text]
  attack: T1059.004

traits:
  # Anchor at command position so comments and documentation examples do not
  # become execution evidence. Intent is supplied by composites that identify
  # what the local program emits.
  - id: local-program-output-to-shell
    desc: Local program output piped to shell
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?m)^[ \t]*@?[ \t]*\./[\w.-]{1,40}\s*\|\s*(sh|bash)\b'
