# A blob of encoded bytes fed straight into a shell.
#
# `echo <hex> | xxd -r -p | sh` is the portable way to carry a command past a
# reader without carrying its text: the file holds only the encoding, and the
# shell reconstitutes and runs it in one pipeline. The decoder in the middle is
# interchangeable (`xxd -r -p`, `base64 -d`, `openssl enc -d`, `od`), and so is
# the host language -- the same pipeline string appears in Makefile recipes,
# `build.rs`, `setup.py`, Gradle tasks and Xcode build settings, which is why
# this is typed broadly rather than as a shell-only rule.
#
# Neutral on its own only in the narrow sense that a self-extracting installer
# does something structurally similar; intent comes from the composites, which
# pair it with the build-time execution site or with what the payload decodes
# to.
defaults:
  platforms: [unix]
  for: [scripts, source, makefile, dockerfile, text, pbxproj]
  crit: notable
  conf: 0.9

traits:
  - id: shell-pipe-token
    desc: Pipe character followed by shell name
    # Component: a bare `|sh` fragment also matches regex alternations
    # (`to(pl|sh)` in UA parsers) and union types; only the composite that
    # pairs it with an encoded blob within two lines makes it a pipeline.
    crit: component
    conf: 0.8
    for: [scripts, source, makefile, dockerfile, text, pbxproj, wasm]
    if:
      type: text
      regex: '\|\s*(sh|bash|zsh|dash)\b'

composite_rules:
  # Encoding-agnostic: the identity is "an encoded blob is being fed to a
  # program", not which alphabet carries it. Objectives reference this rather
  # than either spelling so a campaign that switches encodings stays covered.
  - id: encoded-blob-piped-to-shell
    attack: T1027,T1059.004
    mbc: B0032
    desc: Encoded blob piped into a shell
    crit: suspicious
    conf: 0.95
    near_lines: 2
    all:
      - id: micro-behaviors/process/io/stream::encoded-blob-piped-onward
      - id: shell-pipe-token
    # The inner decoder supplies curl's URL; only the HTTP response reaches
    # the outer shell. This is covered by the encoded-destination loader.
    unless:
      - id: metadata/package/testing/
      - id: curl-decoded-destination-shell-stdin
      - id: metadata/path::test-directory-component
      # Security-scanner rule-catalog YAML files embed hostile patterns and
      # hostile example fixtures as detector definitions (curl|bash,
      # base64-to-shell); the catalog is inert data, not a pipeline.
      - id: metadata/file/catalog/pattern-rules::yaml-pattern-rule-list
      - id: metadata/package/documentation/page::documentation-web-page
