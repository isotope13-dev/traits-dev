defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: curl-process-substitution
    desc: Shell executes curl output via substitution
    crit: notable
    conf: 0.95
    if:
      type: text
      # Keep the command at the start of a shell line. This recognizes both
      # bash and sh process substitution in source-package .install scripts,
      # where the shell parser may identify the call without emitting this
      # tree-sitter trait into the ordinary finding set. A leading comment,
      # echo, or other command does not qualify.
      regex: '(?m)^[\t ]*(ba)?sh[\t ]+<\(curl\b[^)\r\n;|]{1,320}\)'
