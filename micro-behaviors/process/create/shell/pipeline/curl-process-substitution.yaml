defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: curl-process-substitution
    desc: Shell executes curl output via substitution
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      kind: call
      # curl accepts a hostname without a scheme. Require the shell command
      # node so usage comments and printed examples are not execution claims.
      regex: '^(ba)?sh\s+<\(curl\b[^)\r\n;|]{1,320}\)'
