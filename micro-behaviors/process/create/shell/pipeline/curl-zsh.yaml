# Curl-to-zsh pipelines are execution capabilities; intent needs other evidence.
defaults:
  platforms: [windows, linux, macos]
traits:
  - id: curl-pipe-zsh
    desc: curl piped to zsh
    crit: notable
    conf: 0.7
    attack: T1059.004
    for: [html, javascript, markdown, shell, python, ruby, perl, applescript]
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/build/
      - id: well-known/app/ai/knowledge/brainsync::brainsync-vscode-extension
    if:
      type: text
      regex: curl\s+.{0,200}\|\s*zsh\b
    not:
      - regex: 'pattern:/\\bcurl\\s'
      - substr: 'description:"Piping remote script to shell'
