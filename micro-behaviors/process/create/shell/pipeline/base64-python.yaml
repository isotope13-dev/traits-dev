defaults:
  platforms: [unix]
  for: [python, shell]
traits:
  - id: base64-decode-python-stdin
    desc: Base64 decoder feeds Python standard input
    crit: notable
    if:
      type: text
      regex: '\bbase64\s+(-[dD]|--decode)\s*\|\s*(/(usr/)?bin/)?python[23]?\s+-(\s|$)'
      exclude_comments: true
