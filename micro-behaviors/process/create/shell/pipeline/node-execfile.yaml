defaults:
  for:
  - javascript
  platforms:
  - unix
traits:
- id: execfile-curl-shell-pipeline
  desc: execFile runs curl pipeline through shell -c
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    language: javascript
    query: "(call_expression\n  function: (identifier) @callee\n  arguments: (arguments\n    . (string (string_fragment) @shell)\n    . (array . (string (string_fragment) @flag)\n      . (string (string_fragment) @command))) @call\n  (#eq? @callee \"execFile\")\n  (#match? @shell \"^(/bin/)?(ba)?sh$\")\n  (#eq? @flag \"-c\")\n  (#match? @command \"^curl\\\\s+[^;\\\\n]{1,200}\\\\|\\\\s*(/bin/)?(ba)?sh\\\\b\"))\n"
