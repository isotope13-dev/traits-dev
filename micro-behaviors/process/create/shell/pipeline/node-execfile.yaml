defaults:
  for: [javascript]
  platforms: [unix]
traits:
  - id: execfile-curl-shell-pipeline
    desc: execFile runs curl pipeline through shell -c
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: (identifier) @callee
          arguments: (arguments
            . (string (string_fragment) @shell)
            . (array . (string (string_fragment) @flag)
              . (string (string_fragment) @command))) @call
          (#eq? @callee "execFile")
          (#match? @shell "^(/bin/)?(ba)?sh$")
          (#eq? @flag "-c")
          (#match? @command "^curl\\s+[^;\\n]{1,200}\\|\\s*(/bin/)?(ba)?sh\\b"))
