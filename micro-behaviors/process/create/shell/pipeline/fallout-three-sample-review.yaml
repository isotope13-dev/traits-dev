composite_rules:
- crit: notable
  id: setup-py-download-pipe-shell
  desc: Setup source calls a download-to-shell pipeline
  conf: 0.96
  near_bytes: 500
  all:
  - id: metadata/build/pip::setup-py
  - id: micro-behaviors/process/create/system::python-curl-pipe-shell-call
  any:
  - id: micro-behaviors/process/create/shell/command-mode::python-os-system
  - id: micro-behaviors/process/create/shell/command-string::python-subprocess-shell-true
  unless:
  - id: well-known/tool/detection/
- id: setup-packaging-curl-shell-process
  desc: Setup pairs curl-shell text with process calls
  crit: notable
  conf: 0.98
  scope: leaf
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/process/create/shell/pipeline::python-curl-pipe-bash-string
  - id: micro-behaviors/process/create/subprocess::process-execution
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
