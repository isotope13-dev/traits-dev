defaults:
  platforms: [unix, android, ios]
  for: [shell, github-actions, makefile]
  crit: notable
  conf: 0.9

traits:
  - id: base64-output-shell-stdin
    desc: Base64 utility output piped to sh
    if:
      type: text
      # Parentheses terminate a command substitution: its output becomes an
      # argument to the outer command, not stdin for the following shell.
      regex: '\bbase64\b[^\n|()]{0,160}\|\s*sh\b'
    unless:
      - id: metadata/file/naming::rust-source-file-context
