defaults:
  crit: notable
  platforms: [unix]
  for: [shell]
traits:
# Raw-text surface of the pipeline, for the file types the string-literal
# surface (curl-pipe-shell-literal) does not cover. On those languages the
# text surface would only add comments; curl-pipe-shell-text joins the
# surfaces. Ruby stays here: heredoc bodies (formula caveats, embedded plists)
# are not on the literal surface. (`typescript` in a for: list resolves to
# javascript, so TypeScript files are not literal-covered either.)
- id: bash-stdin-pipe
  desc: Shell pipes data into Bash stdin
  crit: notable
  conf: 0.94
  attack: T1059.004
  if:
    type: text
    substr: '| bash -s'
  downgrade:
    any:
    - id: micro-behaviors/os/package-manager/installer-script::install-script-pipe
    - id: micro-behaviors/os/package-manager/installer-script::getter-script-pipe
  unless:
    - id: metadata/file/format/news::serialized-news-article-catalog
- id: shell-stdin-interpreter-pipe
  desc: Pipes data into a zsh/ksh/sh stdin interpreter
  crit: notable
  conf: 0.9
  attack: T1059.004
  # `bash -s` is covered by bash-stdin-pipe above; match the other interpreters
  # that read a command stream from stdin (`... | zsh -s`, `... | /bin/zsh -s`).
  # The optional path prefix is the form a JXA carrier uses when it pipes a
  # decoded payload into zsh without writing a script to disk.
  for: [shell, javascript, applescript, python]
  if:
    type: text
    regex: '\|\s*(/(usr/)?bin/)?(zsh|ksh|sh)\s+-s\b'
  unless:
    - id: metadata/file/format/news::serialized-news-article-catalog
- id: curl-pipe-shell-command-line
  desc: Uncommented line pipes download to shell
  conf: 0.92
  attack: T1059.004
  for: [shell, text]
  if:
    type: text
    regex: '(?m)^[ \t]*[^#\r\n]*?\b(curl|wget)\s+[^\r\n]{0,160}\|\s*(nohup\s+)?(bash|zsh|sh)\b'
  unless:
    - id: micro-behaviors/os/security/command-policy::command-policy-implementation-context
composite_rules:
  - id: http-client-pipe-interpreter
    desc: HTTP client output is piped to an interpreter
    conf: 0.94
    platforms: [unix, windows]
    for: [shell, powershell, batch]
    scope: file
    near_lines: 2
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::curl-wget-command
      - id: metadata/lang/source/syntax/command/pipeline::pipe-to-interpreter

  - id: curl-pipe-bash-execution
    desc: Shell pipes curl output into Bash
    conf: 0.96
    attack: T1059.004
    scope: file
    near_bytes: 256
    all:
      - id: micro-behaviors/communications/http/curl/command::curl-command-call
      - id: metadata/lang/source/syntax/command/pipeline::pipe-to-bash

  - id: python-curl-to-bash-stream
    desc: Python curl and Bash stdin stream clues
    conf: 0.94
    for: [python]
    scope: file
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::python-curl-popen-stream
      - id: micro-behaviors/process/deploy/interpreter-stdin/input::python-bash-stdin-stream
  # A curl-to-shell pipeline the code itself holds: one string constant, or
  # the command and URL split across concatenated literals.
