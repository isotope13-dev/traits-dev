# Ruby's optional call parentheses do not change the command argument.
# A pipeline in documentation near an unrelated process is not execution.
defaults:
  for: [ruby]
  platforms: [unix]
  crit: notable
  conf: 0.95

traits:
  - id: ruby-system-fetch-shell-pipeline
    desc: Ruby executes download-to-shell pipeline
    if:
      type: symbol
      kind: call
      exact: system
      arg:
        index: 0
        regex: '^\s*(curl|wget)\s+[^\n|]{0,160}(https?|ftp)://[^\s|]+[^\n|]{0,80}\|\s*(/bin/)?(ba|z)?sh\b'
