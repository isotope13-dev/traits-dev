defaults:
  platforms: [macos]
  for: [javascript, typescript, applescript]
traits:
  - id: administrator-remote-shell-pipeline
    desc: Privileged AppleScript curl-to-shell literal
    crit: notable
    conf: 0.99
    if:
      type: literal
      regex: 'do shell script "curl [^"\n]{1,160}\|\s*zsh" with administrator privileges'

