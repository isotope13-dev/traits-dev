defaults:
  platforms: [macos]
  for: [html, markdown, javascript, typescript]
traits:
  - id: browser-shell-pipe-sink
    desc: Browser text pipes to shell or osascript
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\|\s*((/bin/)?(bash|zsh|sh|osascript))\b'
composite_rules:
  - id: base64-decode-near-shell-execution
    for: [html, javascript, typescript]
    desc: Base64 decode option near shell execution text
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/data/decode/base64::base64-decode-command-option
    any:
      - id: browser-shell-pipe-sink
      - id: micro-behaviors/process/create/shell/command-string::embedded-sh-c-text
      - id: micro-behaviors/process/create/script/osascript::do-shell-script-web-text
    near_lines: 1
    unless:
      - id: metadata/build/
      - id: metadata/build/recognized-contexts::benign-app-fp-context
      - id: metadata/package/testing/
      # Permission classifiers and safety scanners quote the exact commands
      # they defend against (`base64 -d payload | sh`) in comments and
      # pattern sources; matching those citations is not a terminal lure.
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/pattern-catalog/
      - id: "metadata/file/naming::test-directory-component"
