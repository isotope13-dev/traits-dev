defaults:
  platforms:
  - macos
  for:
  - html
  - markdown
  - javascript
  - typescript
  crit: notable
traits:
- id: text-shell-pipe-sink
  desc: Text contains shell or osascript pipeline syntax
  conf: 0.9
  if:
    type: text
    regex: \|\s*((/bin/)?(ba|z)?sh|osascript)([\s"';]|$)
composite_rules:
- id: base64-decode-near-shell-execution
  for:
  - html
  - javascript
  - typescript
  desc: Base64 decode option near shell execution text
  conf: 0.92
  all:
  - id: micro-behaviors/data/decode/base64::base64-decode-command-option
  any:
  - id: text-shell-pipe-sink
  - id: micro-behaviors/process/create/shell/command-string::embedded-sh-c-text
  - id: micro-behaviors/process/create/script/osascript::do-shell-script-web-text
  near_lines: 1
  unless:
  - id: metadata/build
  - id: metadata/build/recognized-contexts::benign-app-fp-context
  - id: metadata/package/testing/
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/pattern-catalog/
  - id: metadata/path::test-directory-component
