defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: editor-terminal-hidden-from-user
    desc: Creates a terminal hidden from users
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @method)
          arguments: (arguments (object
            (pair key: (property_identifier) @option value: [(true) (unary_expression)] @flag))))
          (#eq? @method "createTerminal")
          (#eq? @option "hideFromUser")
          (#match? @flag "^(true|!\\s*0)$"))
