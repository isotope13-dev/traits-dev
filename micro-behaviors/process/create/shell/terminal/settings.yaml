defaults:
  for: [javascript]
  platforms: [unix]
traits:
  - id: shellargs-curl-pipeline-assignment
    desc: Sets terminal arguments to curl-shell pipeline
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((assignment_expression
          left: (subscript_expression index: (string (string_fragment) @key))
          right: (array
            (string (string_fragment) @flag)
            . (string (string_fragment) @command))) @assignment
          (#match? @key "^terminal\\.integrated\\.shellArgs\\.(osx|linux)$")
          (#eq? @flag "-c")
          (#match? @command "^curl\\s+[^;\\n]{1,200}\\|\\s*(/bin/)?(ba)?sh\\b"))
