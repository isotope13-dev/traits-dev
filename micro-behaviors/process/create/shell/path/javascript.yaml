defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: shell-executable-reference
    desc: References a shell executable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bcmd\.exe\b|/(usr/)?bin/(sh|bash)\b|\bpowershell\.exe\b'
  # Fully-qualified path to the Windows command interpreter, tolerating the
  # split-literal spelling (`"system32\\cmd." + "ex" + "e"`) that obfuscated
  # droppers use. Distinct from the bare-basename atom above: resolving the
  # absolute system32 path is what a launcher does before handing it to a
  # process-creation or `cfexecute` sink. This is a neutral path reference —
  # the anti-sandbox reading comes from the ComSpec/WScript.Quit composite in
  # objectives/anti-analysis/sandbox-detect/enforcement, not from the string.
  - id: system32-cmd-exe-path
    desc: Windows system32 cmd.exe absolute path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'system32.{0,20}cmd\.ex'
    downgrade:
      any:
        - id: metadata/library/structure::js-large-module-bundle
        - id: micro-behaviors/process/interpreter/vm/
    unless:
      - id: well-known/tool/sysadmin/alpine-packages::alpine-dart-sdk-package
