defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059
  crit: notable
  conf: 0.94

traits:
  - id: python-bash-interactive
    desc: Python contains interactive Bash invocation
    platforms: [unix]
    attack: T1059.004
    conf: 0.9
    if:
      type: literal
      regex: '/bin/bash.{0,10}-i|-i.{0,10}/bin/bash'

  - id: python-shell-session-dispatch
    desc: Instantiates interactive shell session handler
    if:
      type: symbol
      kind: call
      exact: ShellSession
