defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059
  crit: notable
  conf: 0.94

traits:
  - id: python-subprocess-interactive-shell
    desc: Python subprocess invokes interactive sh/bash
    crit: notable
    conf: 0.95
    unless:
      - id: metadata/package/testing/corpus::ran-bundled-adversary-templates
      - id: metadata/package/testing/corpus/
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/tool/offensive/
      - id: well-known/tool/detection/agent-glovebox::staticscan-reverse-shell-fixture-context
      - id: well-known/tool/detection/pattern-catalog/
    size_max: 50000
    # Call facts expose argv as an array without individual element values.
    # Inspect the call node to exclude comments and require executable + flag.
    if:
      type: tree-sitter
      kind: call
      regex: '^subprocess\.(call|Popen)\s*\(\s*\[\s*["'']/bin/(sh|bash)["'']\s*,\s*["'']-i["'']\s*[,\]]'
  - id: python-bash-interactive
    desc: Python contains interactive Bash invocation
    platforms: [unix]
    attack: T1059.004
    conf: 0.9
    if:
      type: literal
      regex: '/bin/bash.{0,10}-i|-i.{0,10}/bin/bash'

  - id: python-shell-session-dispatch
    desc: Instantiates interactive shell session handler
    if:
      type: symbol
      kind: call
      exact: ShellSession

  - id: python-zsh-bash-login-probe-modes
    desc: Python defines zsh and Bash login probes
    platforms: [unix]
    if:
      type: text
      regex: '["'']zsh["''],\s*["'']-li["''][\s\S]{0,160}["'']bash["''],\s*["'']-li["'']'

  - id: python-zsh-bash-path-resolvers
    desc: Python compares zsh and Bash resolution
    platforms: [unix]
    if:
      type: text
      regex: '["'']zsh["'']:\s*["'']whence -p["''].{0,160}["'']bash["'']:\s*["'']type -P["'']'

composite_rules:
  - id: login-shell-probe-history-isolation
    desc: Login-shell probe isolates test history
    crit: exception
    platforms: [unix]
    all:
      - id: python-zsh-bash-login-probe-modes
      - id: python-zsh-bash-path-resolvers
      - id: micro-behaviors/os/env/modify::histfile-dev-null
