# Interactive shell environment setup patterns
defaults:
  crit: notable
  platforms: [unix]
  for: [shell]
traits:
  - id: term-xterm-export
    desc: Sets TERM=xterm for interactive shell
    conf: 0.8
    if:
      type: text
      substr: "export TERM=xterm"
  - id: ps1-custom-prompt
    desc: Custom PS1 shell prompt configuration
    conf: 0.75
    if:
      type: text
      # Export-first and assign-then-export spellings of a fixed prompt;
      # the body stops at the first single quote so color escapes stay
      # inside one value.
      regex: '(?m)(^|[;&\s])export\s+PS1=''[^'']{1,80}''|PS1=''[^'']{1,30}'';export PS1'
