defaults:
  attack: T1059
  for:
    - scripts
  platforms:
    - unix
traits:
  - id: sh-interactive
    desc: Interactive shell invocation (sh -i)
    crit: notable
    conf: 0.75
    if:
      type: string_literal
      regex: '(^|[^A-Za-z0-9_])sh\s+-i([^A-Za-z0-9_]|$)'
  - id: sh-interactive-command
    desc: Shell command launches interactive sh
    crit: notable
    conf: 0.92
    unless:
      - id: metadata/file/extension/identity::yara-extension
    if:
      type: text
      regex: '(?m)(^|[;&|]\s*)(/bin/)?sh\s+-i\b'
  - id: bash-explicit-rcfile
    desc: Bash launches with explicit isolated rcfile
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: "bash --noprofile --rcfile"
composite_rules:
  - id: isolated-rcfile-history
    desc: Isolated interactive Bash session suppresses history
    crit: exception
    all:
      - id: bash-explicit-rcfile
      - id: micro-behaviors/os/env/vars/access::histfile-dev-null
