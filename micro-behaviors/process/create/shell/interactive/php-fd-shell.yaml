defaults:
  platforms: [unix]
  for: [php]
traits:
  - id: php-exec-redirected-interactive-shell
    desc: PHP shell execution with redirected input
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^(system|exec|shell_exec|passthru)$'
      arg:
        index: 0
        from:
          whole_value: '/bin/(ba)?sh -i.{0,48}<&[0-9]+'
