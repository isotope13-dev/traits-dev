defaults:
  platforms: [unix, windows]
  for: [shell, package.json, javascript, typescript, text]
  attack: T1059.004
traits:
  - id: nc-exec-sh
    desc: nc -e shell execution
    crit: suspicious
    conf: 0.9
    for:
      - shell
      - package.json
      - javascript
      - typescript
      - swift
      - text
    if:
      type: text
      # Anchor at a non-comment line. This still admits shell commands and
      # commands embedded in exec/system string arguments, while excluding
      # //, /*, leading *, and # comment examples.
      regex: '(?m)^[ \t]*([^/#*\s][^\n]{0,80})?(\\n|\b)nc\s+[-\w. ]{0,40}-e\s+((/usr)?/bin/)?(ba)?sh\b'
    unless:
      - id: micro-behaviors/metaprogramming/generation::javascript-parameterized-shell-template
      - id: well-known/tool/offensive/
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
      - id: metadata/file/format/security-corpus::command-injection-probe-list
  - id: ncat-exec-sh
    desc: ncat -e shell execution
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(\\n|\b)ncat\s+[-\w. ]{0,90}(-e|--exec)\s+(/usr/bin/|/bin/)?(ba)?sh\b'
    unless:
      - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/app/system/aptl/
      - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
  - id: netcat-exec-sh
    desc: netcat -e shell execution
    crit: suspicious
    conf: 0.9
    # Shell execution alone leaves connect versus listen mode unspecified.
    if:
      type: text
      regex: '(\\n|\b)netcat\s+[-\w. ]{0,90}-e\s+(/usr/bin/|/bin/)?(ba)?sh\b'
    unless:
      - id: micro-behaviors/metaprogramming/generation::javascript-parameterized-shell-template
      - id: well-known/tool/offensive/
      - id: metadata/package/testing/
      - id: well-known/tool/detection/
      - id: metadata/file/format/security-corpus::command-injection-probe-list
