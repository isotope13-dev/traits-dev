# A command literal and a bound launch are distinct observations.
defaults:
  platforms:
  - unix
  for:
  - php
  crit: notable
traits:
- id: php-interactive-shell-command
  desc: PHP string names an interactive shell command
  conf: 0.95
  if:
    type: literal
    regex: /bin/(ba)?sh -i\b
- id: php-proc-open-interactive-shell
  desc: PHP proc_open launches an interactive shell
  conf: 0.98
  if:
    type: symbol
    kind: call
    exact: proc_open
    arg:
      index: 0
      from:
        value: (^|[;&|]\s*)/bin/(ba)?sh\s+-i\b
