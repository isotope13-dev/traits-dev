defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059
  crit: notable
  conf: 0.94

traits:
  - id: python-subprocess-interactive-shell
    desc: Python subprocess invokes interactive sh/bash
    crit: notable
    conf: 0.95
    # Call facts expose argv as an array without individual element values.
    # Inspect the call node to exclude comments and require executable + flag.
    if:
      type: tree-sitter
      kind: call
      regex: '^subprocess\.(call|Popen|run)\s*\(\s*\[\s*["'']/bin/(ba)?sh["'']\s*,\s*["'']-i["'']\s*[,\]]'

  # Source text, including strings and comments, that spawns /bin/sh-family
  # shells through subprocess, pty or exec. Unlike the call-node trait above,
  # this sees one-liners quoted inside another string or a comment; it does
  # not establish that the spawn runs.
  - id: python-shell-spawn-text
    desc: Python text spawns a /bin shell
    attack: T1059.004
    platforms: [unix]
    conf: 0.85
    if:
      type: text
      regex: '(subprocess\.\w{3,5}\(\s*\[|pty\.spawn\(|os\.execl\w?\()\s*\\?["'']/bin/\w{0,2}sh\b'

  - id: python-os-system-interactive-shell
    desc: Python os.system launches interactive sh/bash
    if:
      type: text
      regex: 'os\.system\s*\(\s*["''](/bin/)?(ba)?sh\s+-i\b'

  - id: python-os-exec-interactive-shell
    desc: Python os.exec launches interactive sh/bash
    if:
      type: text
      regex: 'os\.exec[lv]p?e?\s*\(\s*["''](/bin/)?(ba)?sh["''][^)]{0,30}-i\b'

composite_rules:
  - id: python-interactive-shell-launch
    desc: Python launches an interactive sh/bash process
    crit: notable
    conf: 0.95
    any:
      - {id: python-subprocess-interactive-shell}
      - {id: python-os-system-interactive-shell}
      - {id: python-os-exec-interactive-shell}
