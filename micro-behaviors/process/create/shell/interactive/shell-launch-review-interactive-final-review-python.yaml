defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059
  crit: notable
  conf: 0.94

traits:
  - id: python-subprocess-interactive-shell
    desc: Python subprocess invokes interactive sh/bash
    crit: notable
    conf: 0.95
    # Call facts expose argv as an array without individual element values.
    # Inspect the call node to exclude comments and require executable + flag.
    if:
      type: tree-sitter
      kind: call
      regex: '^subprocess\.(call|Popen)\s*\(\s*\[\s*["'']/bin/(sh|bash)["'']\s*,\s*["'']-i["'']\s*[,\]]'
