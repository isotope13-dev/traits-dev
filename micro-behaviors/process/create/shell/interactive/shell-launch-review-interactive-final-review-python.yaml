defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059
  crit: notable
  conf: 0.94

traits:
  - id: python-subprocess-interactive-shell
    desc: Python subprocess invokes interactive sh/bash
    crit: notable
    conf: 0.95
    # Call facts expose argv as an array without individual element values.
    # Inspect the call node to exclude comments and require executable + flag.
    if:
      type: tree-sitter
      kind: call
      regex: '^subprocess\.(call|Popen)\s*\(\s*\[\s*["'']/bin/(sh|bash)["'']\s*,\s*["'']-i["'']\s*[,\]]'

  # Source text, including strings and comments, that spawns /bin/sh-family
  # shells through subprocess, pty or exec. Unlike the call-node trait above,
  # this sees one-liners quoted inside another string or a comment; it does
  # not establish that the spawn runs.
  - id: python-shell-spawn-text
    desc: Python text spawns a /bin shell
    attack: T1059.004
    platforms: [unix]
    conf: 0.85
    if:
      type: text
      regex: '(subprocess\.\w{3,5}\(\s*\[|pty\.spawn\(|os\.execl\w?\()\s*\\?["'']/bin/\w{0,2}sh\b'
