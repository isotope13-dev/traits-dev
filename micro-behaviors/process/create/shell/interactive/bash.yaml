defaults:
  for: [shell]
  platforms: [linux, macos]
traits:
  - id: bash-interactive-call
    desc: Shell command invokes interactive Bash
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      regex: '^(/bin/)?bash$'
      arg:
        kind: identifier
        name: '-i'
