defaults:
  platforms: [unix, windows]
  for: [html, php, javascript]
traits:
  - id: encoded-execl-interactive-shell
    desc: Encoded source execs interactive POSIX shell
    crit: notable
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      regex: '\bexecl\("/bin/sh",\s*"sh -i"'
