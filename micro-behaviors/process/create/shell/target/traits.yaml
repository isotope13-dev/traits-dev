defaults:
  platforms: [linux, macos, windows]
  for: [shell]

traits:
  # Handing a shell a path to run rather than a command string. Ordinary in
  # build and CI scripting by itself, so it stays an observation; it earns a
  # conclusion when a composite pairs it with where that path came from.
  - id: shell-exec-script-path
    desc: Shell runs a script by path
    crit: notable
    conf: 0.85
    platforms: [unix, windows]
    for: [shell, github-actions, javascript, typescript, python]
    if:
      type: text
      regex: '\b(ba|z|k|da)?sh\s+[~./]\S{1,60}'

  - id: lua-os-execute-dynamic-argument
    desc: Lua builds a dynamic os.execute target
    crit: notable
    conf: 0.9
    for: [lua]
    platforms: [unix, windows]
    if:
      type: text
      regex: '\bos\.execute\s*\([^\)\r\n]{0,160}\.\.\s*[A-Za-z_][A-Za-z0-9_.]*'

  # filefacts exposes this as a shell-call metric. It records only a dynamic
  # target shape; obfuscation intent belongs to objective composites that add
  # shell-script and reconstruction evidence.
  - id: sh-reconstructed-command-target-shape
    desc: Dynamic shell call target shape
    crit: notable
    conf: 0.9
    if:
      type: metrics
      field: calls.obfuscated_target_count
      min: 1
    unless:
      - id: objectives/anti-static/obfuscation/code-metrics/structure::sh-shell-template-context
      - id: metadata/build/ocaml::ocaml-shell-polyglot-launcher
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/library/generated::python-polyglot-shell-launcher
      - id: metadata/lang/scripted::shell-perl-polyglot-launcher
      - id: metadata/build/autotools::autoconf-generated-script
      - id: metadata/package/manager::maven-wrapper-script-header
      - type: text
        regex: '\bwhich\s+[A-Za-z][A-Za-z0-9_-]*\b'
      - type: path
        regex: '\.(m?js|cjs)(##.*)?$'

  - id: rust-hook-script-module-path
    desc: Rust hook script generator module path
    crit: component
    conf: 0.95
    for: [rust, crate]
    if:
      type: path
      regex: '(^|[\\/])hook[\\/](script|shell)\.rs$'

  - id: rust-shell-hook-helper-functions
    desc: Multiple Rust shell hook helper functions
    crit: component
    conf: 0.9
    for: [rust, crate]
    count_min: 3
    if:
      type: text
      regex: 'fn shell_\w+'

composite_rules:
  - id: rust-git-hook-shell-generator
    desc: Rust git hook shell script generator
    for: [rust, crate]
    any:
      - id: rust-hook-script-module-path
      - id: rust-shell-hook-helper-functions
