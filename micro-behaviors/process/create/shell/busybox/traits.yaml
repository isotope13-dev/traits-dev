defaults:
  platforms: [linux]
  for: [shell]

traits:
  - id: busybox-command
    desc: Shell invokes a BusyBox command
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: busybox
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
