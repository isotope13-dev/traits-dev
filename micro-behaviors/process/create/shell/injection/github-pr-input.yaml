# Evidence describes source data or a potential risk, not an observed attack.
defaults:
  for:
  - github-actions
composite_rules:
- all:
  - id: github-actions-pr-field-run
  any:
  - id: metadata/build/ci/trigger::pull-request-trigger
  - id: metadata/build/ci/trigger::pull-request-target-trigger
  conf: 0.99
  crit: suspicious
  desc: Untrusted PR text enters workflow commands
  id: github-pr-command-interpolation
  platforms:
  - unix
  - windows
traits:
- conf: 0.94
  crit: notable
  desc: PR field interpolated into workflow commands
  id: github-actions-pr-field-run
  if:
    path: jobs.*.steps[*].run
    regex: \$\{\{\s*github\.event\.pull_request\.(title|body)\s*\}\}
    type: value
  platforms:
  - unix
  unless:
  - id: well-known/tool/detection/code-analysis/semgrep::rule-test-annotation
- conf: 0.94
  crit: notable
  desc: PR title interpolated into workflow commands
  id: github-actions-pr-title-run
  if:
    path: jobs.*.steps[*].run
    regex: \$\{\{\s*github\.event\.pull_request\.title\s*\}\}
    type: value
  platforms:
  - unix
  - windows
  unless:
  - id: well-known/tool/detection/code-analysis/semgrep::rule-test-annotation
  - id: metadata/build/ci/step::gh-cli-quoted-pr-title-flag
