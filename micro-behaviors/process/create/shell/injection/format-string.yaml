defaults:
  crit: notable
  conf: 0.8
  platforms: [unix]
  for: [c]
  mbc: E1059
  attack: T1059
traits:
  - id: shell-command-format-string
    desc: Shell command format string
    conf: 0.9
    if:
      type: text
      regex: sn?printf\s*\(.{0,80}\".{0,80}%s.{0,80}(/bin/sh|cmd\.exe).{0,80}\"
    unless:
      - type: text
        regex: /bin/ls
