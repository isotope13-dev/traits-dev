defaults:
  crit: suspicious
  conf: 0.8
  platforms: [unix]
  for: [c]
  mbc: E1059
  attack: T1059
traits:
  - id: format-string-injection
    desc: Format string with user input
    if:
      type: text
      regex: sn?printf.{0,80}%s.{0,80}\b(system|popen|execv)\s*\(
  - id: format-string-injection-shell
    desc: Format string with user input shell path
    if:
      type: text
      regex: sn?printf\s*\(.{0,80}\".{0,80}%s.{0,80}(/bin/sh|cmd\.exe).{0,80}\"
    unless:
      - type: text
        regex: /bin/ls
composite_rules:
  - id: format-string-injection-any
    desc: Format string with user input
    any:
      - id: format-string-injection
      - id: format-string-injection-shell
