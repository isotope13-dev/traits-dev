defaults:
  for: [oledoc, ooxml]
  platforms: [windows, macos]
  crit: notable
traits:
- id: wscript-shell-object
  desc: VBA WScript.Shell object
  conf: 0.92
  if:
    type: text
    regex: (?i)wscript\s*\.\s*shell|wsc.?ript\.s.?hell
composite_rules:
- id: vba-windows-shell-run
  desc: VBA invokes a Windows shell launcher
  conf: 0.98
  any:
  - id: micro-behaviors/os/application/target/development::vba-wscript-exe-launcher
  - id: micro-behaviors/data/control-flow/dispatch/named::vba-shell-run-method
