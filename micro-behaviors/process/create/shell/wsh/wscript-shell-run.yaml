defaults:
  platforms:
  - windows
  for:
  - javascript
  - vbs
  - html
  crit: notable
traits:
- id: wscript-shell-run-statement
  desc: WSH Shell Run statement
  conf: 0.9
  for:
  - javascript
  - vbs
  - html
  - batch
  - text
  - xml
  if:
    type: text
    regex: (?i)\b\w*shell\w*\s*\.\s*run\s+(["']|Chr)
- id: wscript-shell-run-variable-window-style
  desc: WSH Run with computed window style
  conf: 0.88
  for:
  - vbs
  - html
  if:
    type: text
    regex: (?i)\b\w+\.Run\s+[^\r\n,]{1,80},\s*[A-Za-z_]\w*
- id: wsh-run-url-argument
  desc: WSH Run passes a remote URL
  conf: 0.88
  for:
  - vbs
  - html
  if:
    type: text
    regex: (?i)\.Run\b[^\r\n]{0,240}https?://
- id: js-run-method-table-entry
  desc: Run method token in JavaScript object table
  conf: 0.88
  for:
  - javascript
  if:
    type: text
    regex: (?m)^\s*["']\w+["']\s*:\s*["']Run["']\s*,?\s*$
- id: wsh-run-paren-hidden-false
  desc: WSH Run hides a parenthesized command
  conf: 0.93
  for:
  - vbs
  if:
    type: text
    regex: (?i)\.Run\s*\([^)]{1,80}\)\s*,\s*0\s*,\s*false\b
- id: wsh-run-folded-style-negated-false
  desc: Run call with folded style and false
  conf: 0.92
  for:
  - javascript
  if:
    type: text
    regex: \[\s*['"]Run['"]\s*\]\s*\([^;\r\n]{1,512},\s*[\d\s+\-*/()]{2,80},\s*!\[\]\)
- id: msi-wscript-shell-run-call
  desc: MSI calls WSH Shell Run
  conf: 0.97
  for:
  - oledoc
  attack: T1059.005
  if:
    type: raw
    regex: (?i)CreateObject\(\s*["']WScript\.Shell["']\s*\)\.Run
- id: msi-hidden-programdata-batch-arguments
  desc: Hidden ProgramData batch launch arguments
  conf: 0.98
  for:
  - oledoc
  attack: T1059.003,T1564.003
  if:
    type: raw
    regex: (?i)[A-Z]:\\ProgramData\\.{1,160}\.bat["']\s*,\s*0\s*,\s*(True|False)
- id: shell-application-shellexecute-hidden
  desc: ShellExecute hides launched process
  conf: 0.92
  if:
    type: symbol
    kind: call
    regex: (?i)\.ShellExecute$
    arg:
      kind: number
      value: 0
- id: vbs-execute-assembled-shell-method
  desc: Execute evaluates an assembled shell method
  conf: 0.96
  for:
  - vbs
  attack: T1059.005
  if:
    type: text
    regex: (?im)^\s*Execute\s+["'][A-Za-z_.]+["']\s*\+\s*[A-Za-z_]\w*\s*\+\s*["'](xec|xecute)\s*\(
- id: wscript-shell-run-indirect
  desc: Indirect bracketed WScript command invocation
  conf: 0.88
  if:
    type: text
    regex: (?i)\b(wscript|shell)\w*\[[^]]{1,40}\]\(\w+,\s*[01]\b
- id: wsh-shell-bracket-run-call
  desc: Bracketed Shell Run method invocation
  conf: 0.88
  for:
  - javascript
  if:
    type: text
    regex: \['Run'\]\s*\(
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
composite_rules:
- id: msi-hidden-programdata-batch-launch
  desc: MSI hides a ProgramData batch launch
  conf: 0.99
  for:
  - oledoc
  attack: T1059.003,T1059.005,T1564.003
  all:
  - id: msi-wscript-shell-run-call
  - id: msi-hidden-programdata-batch-arguments
- id: wscript-shell-run-obfuscated
  desc: Obfuscated WScript.Shell Run invocation
  conf: 0.9
  all:
  - id: wscript-shell-run-indirect
  any:
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
- id: wsh-run-style-and-false-wait-spelling
  desc: WSH Run call with window-style and false-wait arguments
  conf: 0.9
  any:
  - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-boolean-arguments
  - id: micro-behaviors/data/control-flow/dispatch/named::indexed-call-zero-boolean-arguments
  - id: wsh-run-folded-style-negated-false
