defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
traits:
  - id: wscript-shell-run-statement
    desc: WSH Shell Run statement
    crit: notable
    conf: 0.9
    for: [javascript, vbs, html, batch]
    if:
      type: text
      regex: '(?i)\b[A-Za-z_][A-Za-z0-9_]*shell[A-Za-z0-9_]*\s*\.\s*run\s+[''\"]'
  - id: wscript-shell-run
    desc: "Invokes the WSH Shell Run method"
    crit: notable
    conf: 0.9
    if:
      type: text
      # Match direct member calls (shell.run(...)) and bracket access (shell["run"](...))
      regex: '(?i)\b\w*shell\w*\s*(\.\s*run|\[\s*[''"]run[''"]\s*\])\s*\('
    attack: "T1059.007" # Command and Scripting Interpreter: JavaScript/JScript
  - id: wscript-shell-run-bracket
    desc: Bracketed Run method call
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\[\s*["'']Run["'']\s*\]\s*\('
  - id: wsh-process-launch-method
    desc: WSH shell Run or ShellExecute launch method
    crit: notable
    conf: 0.9
    if:
      type: text
      # Require a shell receiver. A bare `['run'](` is ordinary method access
      # (zod validators, task runners) and is not a WSH launch.
      regex: '(?i)shell\s*(\.\s*(run|shellexecute)|\[\s*["''](run|shellexecute)["'']\s*\])\s*\('
  - id: wsh-run-hidden-text
    desc: WSH Run call requests a hidden window
    crit: notable
    conf: 0.93
    for: [javascript, vbs, html, batch]
    if:
      type: text
      regex: '(?i)\.\s*Run\s*\([^;\r\n]{1,120},\s*0\s*,\s*false\s*\)'
  # VBS statement form: `sh.Run cmd, 0, False` (no parentheses).
  - id: wsh-run-hidden-statement
    desc: WSH Run statement hides the window
    crit: notable
    conf: 0.93
    for: [vbs]
    if:
      type: text
      regex: '(?i)\.Run\s+[A-Za-z_]\w*\s*,\s*0\s*,\s*False\b'
  - id: wscript-shell-run-hidden-window
    desc: WSH Run call requests a hidden window
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(?i)\.Run$'
      arg:
        kind: number
        value: 0
    unless:
    - id: micro-behaviors/process/interpreter/vm/
    - id: well-known/tool/detection/sast/
    - id: metadata/build/recognized-contexts::benign-build-tooling-context
  - id: shell-application-shellexecute-hidden
    desc: ShellExecute hides launched process
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(?i)\.ShellExecute$'
      arg:
        kind: number
        value: 0
  - id: shellexecute-method-call
    desc: Calls the WSH ShellExecute method
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.ShellExecute\b'
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: vbs-execute-assembled-shell-method
    desc: Execute evaluates an assembled shell method
    crit: notable
    conf: 0.96
    for: [vbs]
    attack: T1059.005
    if:
      type: text
      regex: '(?im)^\s*Execute\s+["''][A-Za-z_.]+["'']\s*\+\s*[A-Za-z_]\w*\s*\+\s*["''](xec|xecute)\s*\('
  # Text fallback for VBS/WSH where AST symbol arg matching is unavailable.
  # Covers both `ShellExecute(...)` and VBS statement form `ShellExecute a, b, c, d, 0`.
  - id: shellexecute-hidden-showcmd
    desc: ShellExecute with hidden show-command
    crit: notable
    conf: 0.93
    if:
      type: text
      # Permit the normal statement terminator after the closing call.  The
      # previous end-of-line form missed `ShellExecute(..., 0);` statements.
      regex: '(?i)\.ShellExecute\b[^;\r\n]{0,240},\s*0\s*\)?\s*;?\s*$'

  - id: wscript-shell-run-indirect
    desc: Indirect bracketed WScript command invocation
    crit: component
    conf: 0.88
    if:
      type: text
      # The object name and the show-window argument distinguish an indirect
      # WSH Run call from ordinary computed JavaScript dispatch.
      regex: '(?i)\b(wscript|shell)\w*\[[^]]{1,40}\]\(\w+,\s*[01]\b'
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
composite_rules:
  - id: wscript-shell-process-run
    desc: WScript.Shell launches a process
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: wsh-process-launch-method
    near_bytes: 240

  - id: wscript-shell-run-obfuscated
    desc: Obfuscated WScript.Shell Run invocation
    crit: notable
    conf: 0.9
    all:
      - id: wscript-shell-run-indirect
    any:
      - id: micro-behaviors/os/com/object::wscript-shell-literal
      - id: micro-behaviors/os/com/object::wscript-shell-literal
  - id: wscript-shell-run-via-brackets
    desc: WScript.Shell Run via bracketed invocation
    crit: notable
    conf: 0.92
    all:
      - id: wscript-shell-run-bracket
      - id: micro-behaviors/os/com/object::wscript-shell-literal
  - id: wscript-shell-hidden-run
    desc: WScript.Shell hides launched command window
    crit: suspicious
    conf: 0.95
    unless:
    - id: well-known/lib/native/onetbb::source-context
    - id: well-known/app/productivity/winmerge::winmerge-bundled-plugin-script
    - id: well-known/tool/development/xilinx::planahead-ise-wrapper-script
    all:
      - id: micro-behaviors/os/com/object::wscript-shell-literal
    any:
      - id: wscript-shell-run-hidden-window
      - id: wsh-run-hidden-text
      - id: wsh-run-hidden-statement
