# WScript.Shell's Exec launches a process and returns StdOut/StdErr streams.
# Generic textual Exec calls live in data/control-flow/dispatch; consumers
# must add WScript.Shell context to establish WSH process creation.
defaults:
  platforms: [windows]
traits:
- id: exec-member-symbol
  desc: Symbol ending in .Exec
  crit: notable
  conf: 0.84
  for:
  - javascript
  - vbs
  if:
    type: symbol
    regex: '\.Exec$'
  # Bracketed form under string-table concealment: the method name never
  # lands in the source, so no .Exec symbol exists. Exec takes no arguments
  # while Run requires a command, so an empty-argument indirect call on a
  # WScript/Shell receiver is the Exec spelling; consumers must add
  # WScript.Shell context to establish WSH process creation.
- id: wscript-shell-exec-indirect
  desc: Indirect bracketed WScript Exec invocation
  crit: notable
  conf: 0.86
  for: [javascript]
  if:
    type: text
    regex: '(?i)\b(wscript|shell)\w*\[[^]]{1,40}\]\(\s*\)'
  unless:
    - id: well-known/app/
    - id: well-known/lib/
    - id: well-known/tool/
