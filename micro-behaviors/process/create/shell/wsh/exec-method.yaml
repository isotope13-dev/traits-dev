# `.Exec` member access: WScript.Shell's Exec launches a process and returns
# its StdOut/StdErr streams. The substring form also matches other Exec APIs
# in binaries; the WSH composites add the WScript.Shell context.
defaults:
  platforms: [windows]
traits:
- id: exec-method-call
  desc: .Exec( method call
  crit: notable
  conf: 0.4
  for: [scripts, binaries]
  if:
    type: text
    substr: .Exec(
  unless:
  - id: metadata/file/extension/identity::yara-extension
- id: exec-member-symbol
  desc: Symbol ending in .Exec
  crit: notable
  conf: 0.84
  for:
  - javascript
  - vbs
  if:
    type: symbol
    regex: '\.Exec$'
