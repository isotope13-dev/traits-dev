defaults:
  platforms: [windows]
  for:
    - vbs
  crit: notable
  conf: 0.7
traits:
  # Window style 0 is also how legitimate background helpers avoid opening a
  # console. The hidden launch is a neutral process behavior; attacker intent
  # comes from the payload, staging, or obfuscation legs in objectives/.
  - id: hidden-window-run
    desc: WSH launches process with hidden window
    crit: notable
    conf: 0.92
    for: [html, vbs, javascript]
    if:
      type: text
      regex: '\.Run\s*[(\s][^,\r\n]{1,80},\s*(0|&H0)\b'
  # Droppers persist a VBS shim that re-runs their own script file hidden
  # (`Obj.Run "PowerShell ... -File " & path, 0`); the same line appears
  # verbatim inside VBS droppers that stage the shim as source text.
  - id: vbs-hidden-powershell-file-run
    desc: Hidden VBS launch of PowerShell script file
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\.Run\s+"PowerShell[^"\r\n]{0,100}\s-File\s[^,\r\n]{0,100},\s*0\b'

composite_rules:
  # WScript engine markers — the atomic traits live in the sibling
  # process/create/shell/invoke (canonical, literal); this composite references
  # them rather than re-defining duplicate text matchers.
  - id: wscript-engine-markers
    desc: WScript engine identification markers
    any:
      - id: micro-behaviors/process/create/shell/script-host::wscript-shell
      - id: micro-behaviors/process/create/shell/script-host::wscript-exe
      - id: micro-behaviors/process/create/shell/script-host::cscript-exe
