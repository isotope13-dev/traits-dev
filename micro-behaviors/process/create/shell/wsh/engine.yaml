defaults:
  platforms: [windows]
  for:
    - vbs
  crit: notable
  conf: 0.7
traits:
  # Window style 0 is also how legitimate background helpers avoid opening a
  # console. The hidden launch is a neutral process behavior; attacker intent
  # comes from the payload, staging, or obfuscation legs in objectives/.
  - id: vbs-powershell-file-command
    desc: PowerShell script file invocation text
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)(\.exe)?[^\r\n]{0,80}?-File\b'
  # The executable path is often built on an earlier line. The -File switch
  # still names a script file rather than an encoded command.
  - id: vbs-windowstyle-hidden-file-switch
    desc: Hidden PowerShell -File switch text
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)-WindowStyle\s+Hidden\s+-File\b'

  - id: vbs-run-style-zero
    desc: VBScript Run text passes window style zero
    for: [vbs, batch]
    crit: component
    conf: 0.9
    if:
      type: text
      # Include quoted paths and concatenation in ordinary script commands.
      regex: '(?i)\.Run\b[^\r\n,]{0,240},\s*0\b'

composite_rules:
  - id: vbs-hidden-powershell-file-run
    desc: Hidden VBS launch of PowerShell script file
    crit: notable
    conf: 0.93
    near_lines: 30
    all:
      - id: vbs-run-style-zero
    any:
      - id: vbs-powershell-file-command
      - id: vbs-windowstyle-hidden-file-switch
    needs: 1
  # WScript engine markers — the atomic traits live in the sibling
  # process/create/shell/invoke (canonical, literal); this composite references
  # them rather than re-defining duplicate text matchers.
  - id: wscript-engine-markers
    desc: WScript engine identification markers
    any:
      - id: micro-behaviors/process/create/shell/script-host::wscript-shell
      - id: micro-behaviors/process/create/shell/script-host::wscript-exe
      - id: micro-behaviors/process/create/shell/script-host::cscript-exe
