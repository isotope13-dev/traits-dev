defaults:
  platforms: [windows]
  for: [scripts, binaries]
composite_rules:
  - id: wsh-http-process-automation
    desc: WScript Shell execution with an HTTP COM client
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/com/automation::wsh-automation-progid
      - id: wsh-process-method
    any:
      - id: micro-behaviors/communications/http/client/xmlhttp::msxml-http-variants
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
  - id: wsh-process-method
    desc: WSH-compatible process launch method reference
    crit: notable
    any:
      - id: micro-behaviors/process/create/exec::wsh-progid-near-run
      - id: metadata/lang/source/syntax/call/invocation::exec-method-call-text
