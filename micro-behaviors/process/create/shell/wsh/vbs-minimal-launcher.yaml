defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable

traits:
  - id: vbs-createobject-wscript-shell-progid
    desc: VBS CreateObject WScript.Shell ProgID
    conf: 0.95
    if:
      type: text
      substr: CreateObject("WScript.shell")
  - id: vbs-wscript-arguments-zero
    desc: VBS WScript.Arguments(0) reference
    conf: 0.95
    if:
      type: text
      substr: WScript.Arguments(0)
  - id: vbs-shell-run-hidden-false-flags
    desc: VBS Shell.Run hidden False flags
    conf: 0.94
    if:
      type: text
      substr: ', 0, False'
