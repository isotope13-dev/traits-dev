defaults:
  platforms: [windows]
  for: [javascript, vbs]

traits:
  - id: wsh-run-method-call
    desc: WScript.Shell Run method call
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: '(?i)WScript\.Shell.{0,80}\.Run\b\s*\('
  # `<obj>.Run someFunc(...)` -- a Run whose command comes back from a call
  # rather than a literal. Neutral on its own: VBA's own macro dispatcher is
  # spelled `Application.Run action("func"), wb` and xlwings' Remote.bas is
  # full of it. The dropper reading -- the callee is a decoder -- comes from
  # the XOR/CreateObject legs of the composites in
  # objectives/command-and-control/dropper/execution/wsh, which reference this.
  - id: wsh-run-call-expression-argument
    desc: WSH Run command comes from a call
    crit: notable
    conf: 0.85
    attack: T1059.005
    if:
      type: text
      regex: '(?i)\.Run\s+[A-Za-z][A-Za-z0-9_]{5,}\s*\('
  - id: wsh-run-hidden-flags
    desc: WSH Run uses hidden window flags
    crit: notable
    conf: 0.95
    attack: T1564.003
    if:
      type: text
      regex: '(?i)WScript\.Shell.{0,160}\.Run\b.{0,80},\s*0\s*,\s*(false|true)\s*\)?'
  # Text fallback for parser-failing or heavily obfuscated JScript.  A Run
  # call with show-window 0 and a Boolean wait flag is the complete WSH hidden
  # launch signature even when the shell object and command are aliases.
  - id: wsh-run-hidden-window-text
    desc: WSH Run call uses hidden-window arguments
    crit: notable
    conf: 0.94
    attack: T1564.003
    if:
      type: text
      regex: '(?is)\.Run\s*\([^;\r\n]{1,512},\s*0\s*,\s*(false|true)\s*\)'
  - id: computed-method-hidden-window-call
    desc: Computed call uses hidden-window args
    crit: notable
    conf: 0.9
    attack: T1564.003
    if:
      type: text
      regex: '\[[^\r\n\]]{1,900}\]\s*\([^;\r\n]{1,256},\s*0\s*,\s*(false|true)\s*\)'
composite_rules:
  - id: wsh-aliased-run-hidden-window-text
    desc: WSH Run hides a child window
    crit: notable
    conf: 0.98
    near_lines: 4
    all:
      - id: wsh-run-method-call
      - id: wsh-run-hidden-flags
