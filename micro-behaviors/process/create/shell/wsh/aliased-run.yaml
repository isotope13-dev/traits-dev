defaults:
  crit: notable
  platforms: [windows]
  for: [javascript, vbs]

traits:
  - id: wsh-run-method-call
    desc: WScript.Shell Run method call
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: '(?i)WScript\.Shell.{0,80}\.Run\b\s*\('
  # `<obj>.Run someFunc(...)` -- a Run whose command comes back from a call
  # rather than a literal. Neutral on its own: VBA's own macro dispatcher is
  # spelled `Application.Run action("func"), wb` and xlwings' Remote.bas is
  # full of it. The dropper reading -- the callee is a decoder -- comes from
  # the XOR/CreateObject legs of the script-host composites, which reference
  # this neutral observation.
  - id: wsh-run-hidden-flags
    desc: WSH Run uses hidden window flags
    conf: 0.95
    attack: T1564.003
    if:
      type: text
      regex: '(?i)WScript\.Shell.{0,160}\.Run\b.{0,80},\s*0\s*,\s*(false|true)\s*\)?'
  # Text fallback for parser-failing or heavily obfuscated JScript.  A Run
  # call with show-window 0 and a Boolean wait flag is the complete WSH hidden
  # launch signature even when the shell object and command are aliases.
composite_rules:
  - id: wsh-aliased-run-hidden-window-text
    desc: WSH Run hides a child window
    conf: 0.98
    near_lines: 4
    all:
      - id: wsh-run-method-call
      - id: wsh-run-hidden-flags
