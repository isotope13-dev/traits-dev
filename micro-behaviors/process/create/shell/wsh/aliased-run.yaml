defaults:
  crit: notable
  platforms:
  - windows
  for:
  - javascript
  - vbs
  - html
  - text
traits:
- id: wsh-run-method-call
  desc: WScript.Shell Run method call
  conf: 0.95
  attack: T1059.007
  if:
    type: text
    regex: (?i)WScript\.Shell.{0,80}\.Run\b\s*\(
composite_rules:
- id: wsh-aliased-run-hidden-window-text
  desc: WSH Run hides a child window
  conf: 0.98
  near_lines: 4
  all:
  - id: wsh-run-method-call
  - id: micro-behaviors/process/create/flags::wsh-run-hidden-flags
