defaults:
  platforms: [windows]
  for: [text, powershell, vbs]
  crit: notable
  conf: 0.97
traits:
  - id: hidden-powershell-file-eval
    desc: Hidden PowerShell evaluates a local file
    if:
      type: text
      regex: '(?i)\.run\s+"powershell[^\r\n]{0,80}iex\(\[IO\.File\]::ReadAllText\([^\r\n]{1,200},\s*0'
