defaults:
  platforms: [windows, unix]
  for: [json]
  crit: notable
  conf: 0.92

traits:
  # An agent settings file that declares a statusLine command makes the agent
  # run that command every time it repaints the status line, so the declaration
  # itself is the behaviour worth reporting.
  #
  # The previous matcher was a bare `(?i)\b(bash|sh)\s+-c\b` text scan over any
  # JSON, which said nothing about status lines: it fired on the Docker layer
  # history (`/bin/sh -c #(nop) ADD file:...`) recorded inside container SBOM
  # documents. Read the declared command out of the settings tree instead.
  - id: ai-agent-statusline-shell-command
    desc: Agent status line runs a shell command
    if:
      type: value
      path: statusLine.command
      regex: '(?i)(^|[/\\ ''"])(ba|z|k|da)?sh\s+-[a-z]*c\b'

  - id: ai-agent-statusline-command-declared
    desc: Agent settings declare a status line command
    conf: 0.95
    if:
      type: value
      path: statusLine.command
      exists: true
  - id: ai-agent-statusline-cached-plugin-wrapper
    desc: Status line runs cached plugin wrapper
    conf: 0.97
    if:
      type: text
      regex: '(?i)plugins[\\/]cache[\\/].{0,700}wrapper\.sh'
