defaults:
  platforms: [windows, unix]
  for: [json]
  crit: notable
  conf: 0.92

traits:
  # An agent settings file that declares a statusLine command makes the agent
  # run that command every time it repaints the status line, so the declaration
  # itself is the behaviour worth reporting.
  #
  # The previous matcher was a bare `(?i)\b(bash|sh)\s+-c\b` text scan over any
  # JSON, which said nothing about status lines: it fired on the Docker layer
  # history (`/bin/sh -c #(nop) ADD file:...`) recorded inside container SBOM
  # documents. Read the declared command out of the settings tree instead.
  - id: ai-agent-statusline-shell-command
    desc: Agent status line runs a shell command
    if:
      type: value
      path: statusLine.command
      regex: '(?i)(^|[/\\ ''"])(ba|z|k|da)?sh\s+-[a-z]*c\b'

  - id: ai-agent-statusline-command-declared
    desc: Agent settings declare a status line command
    conf: 0.95
    if:
      type: value
      path: statusLine.command
      exists: true
  - id: ai-agent-statusline-cached-plugin-wrapper
    desc: Status line runs cached plugin wrapper
    conf: 0.97
    if:
      type: text
      regex: '(?i)plugins[\\/]cache[\\/].{0,700}wrapper\.sh'

  # Paperclip-style agent configurations describe a process adapter as data.
  # These are neutral execution capabilities; hostile intent comes from the
  # objective composites that pair them with reconnaissance and staging.
  - id: process-adapter-type
    desc: Agent config selects process adapter
    crit: notable
    conf: 0.95
    if:
      type: value
      path: agents.*.adapter.type
      exact: process

  - id: shell-interpreter-command
    desc: Agent config selects shell interpreter
    crit: notable
    conf: 0.94
    if:
      type: value
      path: agents.*.adapter.config.command
      regex: '^(/(usr/)?bin/)?(ba|z|da)?sh$'

  - id: shell-command-flag
    desc: Agent config passes shell command flag
    crit: notable
    conf: 0.94
    if:
      type: value
      path: agents.*.adapter.config.args[0]
      exact: -c

  - id: shell-command-operators
    desc: Agent config embeds shell operators
    crit: notable
    conf: 0.93
    if:
      type: value
      path: agents.*.adapter.config.args[1]
      regex: '[\x60>&|;]'

  - id: shell-command-output-redirect
    desc: Agent shell command redirects output
    crit: notable
    conf: 0.93
    if:
      type: value
      path: agents.*.adapter.config.args[1]
      regex: '>>?\s*[A-Za-z0-9._/$~\-]{1,120}(\s|$)'

  - id: shell-command-temp-output
    desc: Agent shell command writes to /tmp
    crit: notable
    conf: 0.93
    if:
      type: value
      path: agents.*.adapter.config.args[1]
      regex: '>>?\s*/tmp/[A-Za-z0-9._-]{1,80}(\s|$)'
