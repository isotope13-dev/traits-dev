defaults:
  platforms: [unix]
  for: [shell, kotlin, class, java_class]
traits:
  - id: shell-kotlinc-jar-run
    desc: Shell compiles then runs Kotlin JAR
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'kotlinc[\s\S]{0,120}java -jar /tmp/_ag_poly\.jar'
composite_rules:
  - id: shell-kotlin-polyglot-exec
    desc: Kotlin polyglot marker with compile-run
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/file/format/polyglot::shell-kotlin-polyglot-marker
      - id: shell-kotlinc-jar-run
