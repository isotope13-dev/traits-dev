# Python wrappers that invoke native compiler toolchains at runtime.
# These are capability markers; intent is determined by higher-level context.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  attack: T1027.004

traits:
  # Require an actual process-spawn call whose argument names cargo. A bare
  # "cargo build" mention in help/timeout docs (common in agent tool schemas)
  # is not a toolchain invocation. Matches both shell strings ("cargo build")
  # and argv lists (["cargo", "build", ...]).
  - id: python-cargo-command
    desc: Python subprocess invokes Cargo
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(subprocess\.(run|Popen|call|check_call|check_output)|os\.(system|popen))$'
      arg:
        kind: string
        regex: '(?i)(^|[;&|\s])cargo(\s|$)'
  - id: python-clang-command
    desc: Clang command string
    conf: 0.88
    if:
      type: literal
      kind: string
      exact: clang
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/build/toolchain::xcode-platform-args-build-context
  - id: python-gcc-command
    desc: GCC command string
    conf: 0.88
    if:
      type: literal
      kind: string
      exact: gcc
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: python-subprocess-zig-command
    desc: Python subprocess launches Zig
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^subprocess\.(run|Popen|call)$'
      arg:
        kind: string
        regex: '^zig(\s|$)'
  - id: python-os-zig-command
    desc: Python os API launches Zig
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^os\.(system|popen)$'
      arg:
        kind: string
        regex: '^zig(\s|$)'

composite_rules:
  - id: python-c-compiler-command
    desc: Python invokes a C compiler
    crit: notable
    conf: 0.9
    any:
      - id: python-clang-command
      - id: python-gcc-command
  - id: python-zig-command
    desc: Python launches a Zig command
    crit: notable
    conf: 0.9
    any:
      - id: python-subprocess-zig-command
      - id: python-os-zig-command
