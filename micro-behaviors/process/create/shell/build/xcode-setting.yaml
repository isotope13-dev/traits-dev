defaults:
  platforms: [macos, ios]
  for: [pbxproj]

traits:
  - id: xcode-script-runs-setting
    desc: Xcode script runs command from setting
    crit: notable
    conf: 0.93
    if:
      type: value
      path: pbxproj.scripts[*]
      regex: '(sh|bash|zsh)\s+-c\s+.{0,4}\$\{[A-Za-z_][A-Za-z0-9_]*\}'
