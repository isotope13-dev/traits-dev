# Build-toolchain subprocess invocations (make/cmake/configure family).
# Source-built sdists (scikit-hep/fastjet shape) drive the autotools/make
# toolchain from setup.py to compile and place vendored C/C++ sources — build
# orchestration, not arbitrary payload execution. Installer-trojan composites
# use these to downgrade subprocess-in-install findings to notable; curl/wget/
# shell targets stay suspicious.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9
  mbc: "E1059.006"

traits:
  - id: make-toolchain-invocation
    desc: Subprocess invokes make-family build tool
    if:
      type: text
      regex: 'subprocess\.\w+\(\s*\[\s*["''](\./)?(g?make|ninja|cmake|meson|configure|autogen)\b'
  - id: make-toolchain-shell-format
    desc: Subprocess runs make via formatted shell string
    if:
      type: text
      regex: 'subprocess\.\w+\(\s*f?["'']{1,3}\{?g?make\b'
