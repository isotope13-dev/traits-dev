# The `[\n;&|]` anchor on the *-named-package-install-command traits is the set
# of positions a shell command can START at: line break, `;`, `&`, `|`. A bare
# `(` was in that class for subshells, but it equally accepts an English
# parenthetical -- which is exactly how install hints get written inside source
# files, in log/error strings, docstrings and agent message templates
# ("Missing dep. Install the SDK (pip install acme-sdk) and retry."). These are
# `for: [scripts]`, so prose in a README never reached them, but prose inside a
# .py/.js string did, and it was reported as an executed install command at
# notable. Dropping `(` gives up only the rare `(cmd ...)` subshell spelling;
# line-start, `&&`, `;` and pipeline forms are unaffected. Same change applied
# to the cargo/go trait in compiler.yaml, which shared the anchor.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
  conf: 0.82
  attack: T1059
traits:
  - id: bun-install-command
    desc: Bun package install command
    if:
      type: text
      regex: '\bbun\s+install\b'
  - id: npm-install-ignore-scripts
    desc: npm install disables lifecycle scripts
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)(^|[;&|])[ \t]*npm[ \t]+(install|ci)\b[^\n]{0,160}--ignore-scripts'
  - id: npm-install-command
    desc: npm package install command
    if:
      type: text
      regex: '(?m)^[ \t]*(sudo[ \t]+)?npm[ \t]+install\b|[;&|][ \t]*(sudo[ \t]+)?npm[ \t]+install\b'
    unless:
      - id: metadata/file/format/markup::generic-template-source
      - id: metadata/file/format/structured::sourcemap
      - id: micro-behaviors/ui/help::package-install-remediation
      # Docusaurus chunks preserve shell examples in rendered documentation;
      # the text is not an executed package-manager command.
      - id: metadata/file/profile/identity::docusaurus-docs-bundle
  - id: js-npm-install-alias-via-child-process
    desc: JS child process runs npm i
    crit: notable
    conf: 0.92
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: text
      regex: "(execSync|exec|spawn)\\s*\\([^\\n)]{0,80}[\"'']npm\\s+i\\s+(@?[a-z0-9._-]+/)?[a-z0-9._-]+"
  - id: js-package-manager-process-call
    desc: JS child process launches package manager
    crit: notable
    conf: 0.96
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(spawn|spawnSync|execFile|execFileSync)$'
      arg:
        kind: string
        regex: '^(npm(\.cmd)?|pnpm|yarn|bun)$'
  - id: package-manager-install-argv
    desc: Package-manager install argument vector
    crit: component
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '\[\s*["''](install|i|add)["'']\s*,'
  - id: github-protocol-ref-spec
    desc: GitHub protocol commit reference
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      regex: '^github:[\w.-]+/[\w.-]+#[0-9a-fA-F]{7,64}$'
  - id: github-url-ref-spec
    desc: GitHub URL commit reference
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      regex: '^https?://github\.com/[^# "'']{3,180}#[0-9a-fA-F]{7,64}$'
  - id: gitlab-url-ref-spec
    desc: GitLab URL commit reference
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      regex: '^https?://gitlab\.com/[^# "'']{3,180}#[0-9a-fA-F]{7,64}$'
  - id: bitbucket-url-ref-spec
    desc: Bitbucket URL commit reference
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      regex: '^https?://bitbucket\.org/[^# "'']{3,180}#[0-9a-fA-F]{7,64}$'
  - id: git-transport-ref-spec
    desc: Git transport commit reference
    crit: component
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      regex: '^git\+(https?|ssh)://[^# "'']{3,180}#[0-9a-fA-F]{7,64}$'
  - id: npm-install-save-command
    desc: npm install command with save flag
    conf: 0.92
    if:
      type: literal
      regex: 'npm\s+install\s+[a-z@][a-z0-9._@/-]{1,60}\s+--save(\s|$)'
    unless:
      - id: metadata/file/format/markup::generic-template-source
  - id: js-package-run-build-line
    desc: Package manager run build at line start
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*(sudo[ \t]+)?(npm|yarn|pnpm)[ \t]+run[ \t]+build\b'
  - id: js-package-run-build-chained
    desc: Package manager run build in shell chain
    conf: 0.9
    if:
      type: text
      regex: '[;&|][ \t]*(sudo[ \t]+)?(npm|yarn|pnpm)[ \t]+run[ \t]+build\b'
  - id: npm-named-package-install-command
    desc: npm named package install command
    if:
      type: text
      regex: '[\n;&|][ \t]*(sudo[ \t]+)?npm[ \t]+(install|i|add)[ \t]+[\w@][\w@./-]'
    unless:
      - id: metadata/file/format/markup::generic-template-source
  - id: yarn-install-command
    desc: Yarn package install command
    if:
      type: text
      # Anchor at a command boundary the way the npm sibling above does:
      # prose that merely names the command (`... as `yarn install --flat` on
      # the command line`, type-fest's package.json docs) is not an invocation.
      regex: '(^|[\n;&|"''])[ \t]*(sudo[ \t]+)?yarn[ \t]+install\b'
  - id: pnpm-install-command
    desc: pnpm package install command
    if:
      type: text
      regex: '\bpnpm\s+install\b'
  - id: pnpm-dlx-package-command
    desc: References pnpm dlx package execution
    conf: 0.9
    for: [shell, javascript, typescript, makefile, dockerfile, github-actions]
    if:
      type: text
      regex: '\bpnpm\s+dlx\s+(@?[A-Za-z0-9._-]+/)?[A-Za-z0-9._-]{2,80}'
  - id: js-runtime-named-package-install-command
    desc: JS runtime named package install command
    if:
      type: text
      regex: '[\n;&|][ \t]*(sudo[ \t]+)?(bun|pnpm|yarn)[ \t]+(add|install)[ \t]+[\w@][\w@./-]'
  - id: pip-named-package-install-command
    # Use the shell parser's call projection instead of a file-wide text
    # regex.  A PKGBUILD often documents `pip install` in comments as well as
    # executing it; the old unless: suppressed the real call whenever any such
    # comment existed.  A structured call cannot match prose and still feeds
    # the scriptlet composite below.
    desc: pip install invocation
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: pip
      arg:
        kind: identifier
        name: install
  - id: pip3-named-package-install-command
    desc: pip3 install invocation
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: pip3
      arg:
        kind: identifier
        name: install
  - id: pip-requirements-file-install-command
    # `pip install -r requirements.txt` installs a declared dependency list,
    # not an arbitrary named PyPI package chosen only at install time.
    desc: pip installs from a requirements file
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: pip
      arg:
        kind: identifier
        name: "-r"
  - id: pip3-requirements-file-install-command
    desc: pip3 installs from a requirements file
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: pip3
      arg:
        kind: identifier
        name: "-r"
  - id: pip-require-virtualenv-flag
    # Forces installs into an active venv — common in vendor .deb postinst
    # scripts that bootstrap a private environment from a bundled requirements
    # file rather than polluting the system interpreter.
    desc: pip requires an active virtualenv
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: pip
      arg:
        kind: identifier
        name: "--require-virtualenv"
  - id: pip3-require-virtualenv-flag
    desc: pip3 requires an active virtualenv
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: pip3
      arg:
        kind: identifier
        name: "--require-virtualenv"
  - id: gem-named-package-install-command
    desc: RubyGems named package install command
    if:
      type: text
      regex: '[\n;&|][ \t]*(sudo[ \t]+)?gem[ \t]+install[ \t]+[\w@][\w@./-]'
  - id: runtime-fetch-install-command
    desc: Runtime fetch install command
    if:
      type: text
      regex: '[\n;&|][ \t]*(sudo[ \t]+)?(deno|pipx|uv)[ \t]+(install|add)[ \t]+'

  # Python package updaters commonly construct the command as an argv list.
  # These are process/package-manager capabilities; the benign updater
  # exception that consumes all three atoms remains in metadata/package/quality.
  - id: python-temporary-update-script
    desc: Python writes temporary update script
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: 'update_script\s*=\s*f["'']{3}'
  - id: python-pip-install-command
    desc: Python subprocess pip install command
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: 'subprocess\.(run|Popen|call)\([\s\S]{0,240}\bpip\b[\s\S]{0,120}["'']install["'']'
    unless:
      - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
  - id: python-upgrade-flag
    desc: Python subprocess upgrade flag
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      # Keep the --upgrade/-U token inside the same argv list as the
      # subprocess call so a later pip upgrade cannot attribute onto an
      # unrelated python -m launch in the same file.
      regex: 'subprocess\.(run|Popen|call)\(\s*\[[^\]]{0,280}["''](--upgrade|-U)["'']'
  - id: python-windows-update-console
    desc: Python updater opens a new Windows console
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      substr: CREATE_NEW_CONSOLE

composite_rules:
  # Application code can install a repository ref without declaring it in the
  # manifest. Keep this capability neutral; objective traits add detached and
  # swallowed-error evidence rather than condemning ordinary source bootstraps.
  - id: js-package-manager-vcs-ref-install
    desc: JS child process installs pinned VCS package
    crit: notable
    conf: 0.97
    attack: T1059.007
    for: [javascript, typescript]
    near_bytes: 1024
    all:
      - id: js-package-manager-process-call
      - id: package-manager-install-argv
    any:
      - id: github-protocol-ref-spec
      - id: github-url-ref-spec
      - id: gitlab-url-ref-spec
      - id: bitbucket-url-ref-spec
      - id: git-transport-ref-spec
  - id: js-package-run-build-command
    desc: npm, Yarn, or pnpm run build
    conf: 0.9
    unless:
      - id: metadata/file/format/structured::sourcemap-context
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
    any:
      - id: js-package-run-build-line
      - id: js-package-run-build-chained
  - id: python-package-upgrade-command
    desc: Python subprocess package upgrade command
    crit: notable
    conf: 0.94
    for: [python]
    all:
      - id: python-pip-install-command
      - id: python-upgrade-flag
