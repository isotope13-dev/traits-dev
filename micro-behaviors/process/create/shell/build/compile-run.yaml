# Compiler-to-local-command chains are ordinary developer workflows.
# Require a native input and the immediately following command: gcc -v
# followed by unrelated build steps is not compile-and-run evidence.
defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
traits:
  - id: native-compile-then-local-command
    desc: Compiler input followed by local command
    conf: 0.9
    if:
      type: text
      # Active shell lines, not comments or unrelated commands.
      regex: '(?m)^[ \t]*(gcc|clang|cc)\s+[^;&\n]{0,40}\.[co]\b[^;&\n]{0,20}&&\s*(exec\s+)?\./'
  - id: gpp-compile-then-local-command
    desc: G++ input followed by local command
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*g\+\+\s+[^;&\n]{0,40}\.cpp\b[^;&\n]{0,20}&&\s*(exec\s+)?\./'
  - id: python-native-compile-then-local-command
    desc: Python compiler and local-command literal
    for: [python]
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '\b(gcc|clang|cc)\s+[^;&\n]{0,40}\.[co]\b[^;&\n]{0,20}&&\s*(exec\s+)?\./'
  - id: python-gpp-compile-then-local-command
    desc: Python G++ and local-command literal
    for: [python]
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '\bg\+\+\s+[^;&\n]{0,40}\.cpp\b[^;&\n]{0,20}&&\s*(exec\s+)?\./'
