defaults:
  platforms: [windows]
  for: [batch]
traits:
- id: batch-start-temp-exe
  desc: Batch starts an executable from TEMP
  crit: notable
  conf: 0.9
  if:
    type: text
    # A temporary executable path is a location, not hostile intent.
    regex: '(?im)^\s*@?start +("" +)?"?[!%](TEMP|TMP)[!%][\\/][^"\r\n;&|]{1,160}\.exe\b'
