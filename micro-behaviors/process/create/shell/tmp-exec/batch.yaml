defaults:
  platforms: [windows]
  for: [batch]
traits:
- id: batch-start-temp-exe
  desc: Batch starts an executable from TEMP
  crit: suspicious
  conf: 0.9
  if:
    type: text
    # Require TEMP or TMP; a generic %VAR% launch can target a dev tool.
    regex: '(?im)\bstart\s+""\s+["'']?[!%](TEMP|TMP)[!%]["'']?.{0,80}\.exe'
