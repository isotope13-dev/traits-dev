defaults:
  platforms:
  - windows
  for:
  - batch
composite_rules:
- id: batch-curl-exe-temp-launch-profile
  desc: curl EXE output near a TEMP launch
  crit: notable
  conf: 0.95
  near_lines: 30
  all:
  - id: micro-behaviors/communications/http/download/curl::curl-output-to-exe-path
  - id: micro-behaviors/process/create/shell/tmp-exec::batch-start-temp-exe
  any:
  - id: micro-behaviors/communications/http/curl::curl-command-url-or-option
