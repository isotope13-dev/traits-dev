defaults:
  platforms:
  - windows
  for:
  - batch
composite_rules:
- id: batch-curl-exe-temp-launch-profile
  desc: curl EXE output near a TEMP launch
  crit: suspicious
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/download/curl::curl-output-to-exe-path
  - id: micro-behaviors/process/create/shell/batch::run-from-temp
  any:
  - id: micro-behaviors/communications/http/download/curl::curl-cmd
  - id: micro-behaviors/communications/http/download/curl::curl-keyword
