defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  - id: temp-exe-launch-near-archive-download-extract
    desc: TEMP executable launch near an HTTP file download and archive extraction
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/data/archive/extract/capability::powershell-archive-extract
      - id: micro-behaviors/process/create/shell/tmp-exec::batch-start-temp-exe
