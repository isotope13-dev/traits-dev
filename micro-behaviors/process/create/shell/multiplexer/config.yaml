defaults:
  platforms: [unix]
  for: [text, shell]
  crit: notable
  conf: 0.95
traits:
  - id: tmux-config-run-shell
    desc: tmux configuration invokes shell command
    if:
      type: text
      regex: '(?m)^[ \t]*run(-shell)?[ \t]+(-b[ \t]+)?["'']tmux[ \t]'
  - id: tmux-format-shell-command
    desc: tmux status format runs shell command
    if:
      type: text
      regex: '(?m)^set(w|(-option))?[^\n]{0,120}-format[ \t]+["''][^\n]{0,160}#\('
