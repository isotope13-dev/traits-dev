# Security-sensitive commands are often legitimate when run deliberately, so
# these atoms record the capability at notable severity. Higher-level policy
# can combine them with execution context and authorization signals.
defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.94

traits:
  - id: secret-manager-read-command
    desc: Reads secret manager value
    if:
      type: text
      regex: '(?i)\b(vault\s+kv\s+get|aws\b[^\n]{0,100}\bsecretsmanager\s+get-secret-value)\b'

  - id: powershell-environment-list-command
    desc: PowerShell lists environment variables
    if:
      type: text
      regex: '(?i)\bGet-ChildItem\s+Env:'

  - id: credential-token-display-command
    desc: Displays package or service token
    if:
      type: text
      regex: '(?i)\b(gh\s+auth\s+token|npm\b[^\n]{0,80}\btoken\s+list)\b'

  - id: docker-password-login-command
    desc: Docker login supplies password argument
    if:
      type: text
      regex: '(?i)\bdocker\b[^\n]{0,100}\blogin\b[^\n]{0,100}\s(-p|--password)(\s|=)'

  - id: onepassword-secret-read-command
    desc: OnePassword reads or injects secret
    if:
      type: text
      regex: '(?i)\bop\s+(item\s+get|inject)\b'

  - id: shell-history-disabled-command
    desc: Shell command disables history file
    if:
      type: text
      regex: '(?im)^\s*unset\s+HISTFILE\b'

  - id: journal-rotate-command
    desc: Rotates system journal immediately
    if:
      type: text
      regex: '(?im)^\s*journalctl\s+--rotate\b'

  - id: powershell-clear-history-command
    desc: PowerShell clears session history
    if:
      type: text
      regex: '(?i)\bClear-History\b'

  - id: ansi-terminal-control-command
    desc: Command emits terminal control sequences
    if:
      type: text
      regex: '(?i)\b(printf|echo)\b[^\n]{0,220}(\\033|\\x1b|\\e\[)'

  - id: windows-everyone-full-control-command
    desc: Grants Everyone full filesystem control
    if:
      type: text
      regex: '(?i)\bicacls\b[^\n]{0,160}/grant\s+Everyone:\(F\)'

  - id: wmic-shadowcopy-delete-command
    desc: Deletes Windows shadow copies
    platforms: [unix]
    for: [shell]
    if:
      type: text
      regex: '(?i)\bwmic(\.exe)?\s+shadowcopy\s+delete\b'

  - id: npm-registry-change-command
    desc: Changes npm package registry
    if:
      type: text
      regex: '(?i)\bnpm\b.{0,80}\bconfig\s+set\s+registry\s+https?://'

  - id: go-latest-tool-install-command
    desc: Installs latest Go tool version
    if:
      type: text
      regex: '(?i)\bgo\s+install\s+[A-Za-z0-9._/-]{1,160}@latest\b'
