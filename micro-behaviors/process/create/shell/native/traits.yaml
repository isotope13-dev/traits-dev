defaults:
  platforms: [unix]
  for: [elf, macho]
traits:
  - id: bash-binary-name
    desc: Native binary references Bash shell path
    crit: notable
    conf: 0.75
    if:
      type: text
      # Bare `bash` is a syntax-highlighter language token in large toolchains
      # (pandoc, Kate, Pygments tables). Require a path-shaped reference.
      regex: '(^|[/\\\\"''])(/bin/bash|/usr/bin/bash)\b'
      section: rodata

  # `/usr/local/bin/bash` — the third place a shell lives, after the two the
  # atom above covers. Present in the same probe lists and nowhere else: no
  # distribution ships bash there, so a binary that names it is enumerating
  # candidate paths rather than invoking a known one.
  - id: local-prefix-bash-path
    desc: Native binary references /usr/local bash path
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(^|[/\\"''])/usr/local/bin/bash\b'

composite_rules:
  # A binary that names bash *and* sh *and* busybox is not calling a shell, it
  # is looking for one — the shape of a payload built to land on an unknown
  # embedded target where any of the three might be the only interpreter
  # present. Ordinary software links against the shell it was built for, or
  # calls `system()` and lets libc pick.
  #
  # Notable rather than suspicious: init systems, container runtimes and
  # rescue tooling legitimately probe for an interpreter. The intent comes from
  # what the objectives pair it with — a pinned C2 address, a PTY, a hidden
  # staging path.
  - id: multi-shell-path-probe-set
    desc: Probes several shell interpreter paths
    crit: notable
    conf: 0.9
    needs: 3
    any:
      - id: bash-binary-name
      - id: local-prefix-bash-path
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
      - id: micro-behaviors/fs/path/binary::bin-busybox-path
