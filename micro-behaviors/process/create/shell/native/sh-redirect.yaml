# Native code that names /bin/sh and also carries a descriptor-duplication or
# execve capability. This is the mechanical shape of an fd-attached shell; it
# is common in legitimate daemons and login tools, so it stays a capability.
# Intent (packet-triggered backdoor, reverse shell) is assembled in objectives/.
defaults:
  platforms: [unix]
  for: [c, cpp, elf]

composite_rules:
  - id: sh-path-with-dup2-or-execve
    desc: References /bin/sh with dup2 or execve
    crit: notable
    conf: 0.6
    all:
      - id: micro-behaviors/process/interpreter/shell::bin-sh
    any:
      - id: micro-behaviors/process/fd/dup::dup2
      - id: micro-behaviors/process/create/direct::execve-import
