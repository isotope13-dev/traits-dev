defaults:
  platforms: [unix]
  for: [c, cpp]

composite_rules:
  - id: root-uid-request-and-shell-execution
    desc: Root UID request and native shell execution
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/process/identity/setuid::root-setuid-call
      - id: micro-behaviors/process/create/shell/native::c-shell-execution-path
    unless:
      - id: well-known/lib/crypto/mit-krb5::source-tree-context
      - id: well-known/lib/web/server/passenger/
      - id: metadata/file/extension/identity::markdown-file-basename
