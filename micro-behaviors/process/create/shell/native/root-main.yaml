# A root-ID call and a shell elsewhere in the file do not establish a
# privilege bypass. Require main's entire body to hand the caller a fixed
# shell after requesting root, with no intervening authorization branch.
# Accept only system(shell) or execl(shell, argv0, NULL): fixed commands,
# script arguments and opaque execv/execve argument vectors do not establish
# an unrestricted shell. Calls with those forms retain neutral exec traits.
# This source is a payload: gaining root still requires existing authority
# (for example a root-owned setuid installation), not an exploit in setuid.
defaults:
  platforms: [unix]
  for: [c, cpp]
traits:
  - id: unguarded-root-shell-main
    desc: Main requests root and an unrestricted shell
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((function_definition
            declarator: (function_declarator declarator: (identifier) @entry)
            body: (compound_statement
              . (expression_statement (call_expression
                  function: (identifier) @uid
                  arguments: (argument_list . (number_literal) @zero .)))
              . (expression_statement (call_expression
                  function: (identifier) @launch
                  arguments: (argument_list . (string_literal) @shell .)))
              . (return_statement)? .)) @stub
          (#eq? @entry "main")
          (#eq? @uid "setuid")
          (#eq? @zero "0")
          (#eq? @launch "system")
          (#match? @shell "^\"/bin/(ba|da)?sh\"$"))
        ((function_definition
            declarator: (function_declarator declarator: (identifier) @entry)
            body: (compound_statement
              . (expression_statement (call_expression
                  function: (identifier) @uid
                  arguments: (argument_list . (number_literal) @zero .)))
              . (expression_statement (call_expression
                  function: (identifier) @launch
                  arguments: (argument_list
                    . (string_literal) @shell
                    . (string_literal) @argv0
                    . [
                        (identifier) @null
                        (null) @null
                        (number_literal) @null
                        (cast_expression
                          value: [(identifier) (null) (number_literal)] @null)
                      ] .)))
              . (return_statement)? .)) @stub
          (#eq? @entry "main")
          (#eq? @uid "setuid")
          (#eq? @zero "0")
          (#eq? @launch "execl")
          (#match? @shell "^\"/bin/(ba|da)?sh\"$")
          (#match? @argv0 "^\"(ba|da)?sh\"$")
          (#match? @null "^(NULL|0)$"))
        ((function_definition
            declarator: (function_declarator declarator: (identifier) @entry)
            body: (compound_statement
              . (expression_statement (call_expression
                  function: (identifier) @uid
                  arguments: (argument_list . (number_literal) @zero .)))
              . (expression_statement (call_expression
                  function: (identifier) @gid
                  arguments: (argument_list . (number_literal) @group .)))
              . (expression_statement (call_expression
                  function: (identifier) @launch
                  arguments: (argument_list . (string_literal) @shell .)))
              . (return_statement)? .)) @stub
          (#eq? @entry "main")
          (#eq? @uid "setuid")
          (#eq? @zero "0")
          (#eq? @gid "setgid")
          (#eq? @group "0")
          (#eq? @launch "system")
          (#match? @shell "^\"/bin/(ba|da)?sh\"$"))
        ((function_definition
            declarator: (function_declarator declarator: (identifier) @entry)
            body: (compound_statement
              . (expression_statement (call_expression
                  function: (identifier) @uid
                  arguments: (argument_list . (number_literal) @zero .)))
              . (expression_statement (call_expression
                  function: (identifier) @gid
                  arguments: (argument_list . (number_literal) @group .)))
              . (expression_statement (call_expression
                  function: (identifier) @launch
                  arguments: (argument_list
                    . (string_literal) @shell
                    . (string_literal) @argv0
                    . [
                        (identifier) @null
                        (null) @null
                        (number_literal) @null
                        (cast_expression
                          value: [(identifier) (null) (number_literal)] @null)
                      ] .)))
              . (return_statement)? .)) @stub
          (#eq? @entry "main")
          (#eq? @uid "setuid")
          (#eq? @zero "0")
          (#eq? @gid "setgid")
          (#eq? @group "0")
          (#eq? @launch "execl")
          (#match? @shell "^\"/bin/(ba|da)?sh\"$")
          (#match? @argv0 "^\"(ba|da)?sh\"$")
          (#match? @null "^(NULL|0)$"))
        ((function_definition
            declarator: (function_declarator declarator: (identifier) @entry)
            body: (compound_statement
              . (expression_statement (call_expression
                  function: (identifier) @uid
                  arguments: (argument_list
                    . (number_literal) @zero
                    . (number_literal) @effective
                    . (number_literal) @saved .)))
              . (expression_statement (call_expression
                  function: (identifier) @launch
                  arguments: (argument_list . (string_literal) @shell .)))
              . (return_statement)? .)) @stub
          (#eq? @entry "main")
          (#eq? @uid "setresuid")
          (#eq? @zero "0")
          (#eq? @effective "0")
          (#eq? @saved "0")
          (#eq? @launch "system")
          (#match? @shell "^\"/bin/(ba|da)?sh\"$"))
        ((function_definition
            declarator: (function_declarator declarator: (identifier) @entry)
            body: (compound_statement
              . (expression_statement (call_expression
                  function: (identifier) @uid
                  arguments: (argument_list
                    . (number_literal) @zero
                    . (number_literal) @effective
                    . (number_literal) @saved .)))
              . (expression_statement (call_expression
                  function: (identifier) @launch
                  arguments: (argument_list
                    . (string_literal) @shell
                    . (string_literal) @argv0
                    . [
                        (identifier) @null
                        (null) @null
                        (number_literal) @null
                        (cast_expression
                          value: [(identifier) (null) (number_literal)] @null)
                      ] .)))
              . (return_statement)? .)) @stub
          (#eq? @entry "main")
          (#eq? @uid "setresuid")
          (#eq? @zero "0")
          (#eq? @effective "0")
          (#eq? @saved "0")
          (#eq? @launch "execl")
          (#match? @shell "^\"/bin/(ba|da)?sh\"$")
          (#match? @argv0 "^\"(ba|da)?sh\"$")
          (#match? @null "^(NULL|0)$"))
