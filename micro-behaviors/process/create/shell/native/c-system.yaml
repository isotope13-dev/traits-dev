defaults:
  crit: notable
  platforms: [unix, windows, openwrt]
traits:
  - id: c-system-import
    desc: Imports C system shell-command API
    conf: 0.95
    for: [macho, pe, dll, elf]
    if:
      type: import
      exact: system
  - id: c-system-call
    desc: C-family source calls the system function
    conf: 0.95
    for: [c, cpp, objc]
    if:
      type: symbol
      kind: call
      regex: '^(::)?(std::)?system$'
    unless:
      # The C/C++ symbol extractor drops arbitrary namespace qualifiers. A
      # same-file namespace declaration of its own system function is not the
      # standard shell API this trait describes.
      - type: text
        regex: '(?is)namespace\s+\w+\s*\{\s*void\s+system\s*\('
