defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: T1059.004

traits:
  - id: c-popen-variable-input
    desc: C passes an identifier to popen
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bpopen\s*\(\s*[A-Za-z_][A-Za-z0-9_]*\b'

  - id: c-shell-execution-path
    desc: C source launches POSIX shell
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\b(execl\w*|execve|system)\s*\([^;\n]{0,120}"/bin/(ba)?sh"'
