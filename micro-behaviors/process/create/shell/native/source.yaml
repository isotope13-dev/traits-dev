defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: T1059.004

traits:
  - id: objc-posix-spawn-shell
    desc: Objective-C posix_spawn launches a shell
    crit: notable
    conf: 0.92
    for: [objc]
    if:
      type: text
      regex: 'posix_spawn\s*\([^;]{0,220}"/bin/(ba)?sh"'
  - id: objc-posix-spawn-shell-variable
    desc: Objective-C posix_spawn uses shell path variable
    crit: notable
    conf: 0.92
    for: [objc]
    if:
      type: text
      regex: 'const char \*shell\s*=\s*"/bin/(ba)?sh"[\s\S]{0,260}posix_spawn\s*\([^;]{0,120}\bshell\b'
  # A function-like preprocessor macro can hide the command-execution sink
  # from the C symbol extractor. Keep this as a source-level capability atom;
  # intent comes from composites that add suspicious context.
  - id: c-system-macro-wrapper
    desc: C macro wraps the system command-execution API
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?m)^\s*#\s*define\s+\w+\([^)]{0,32}\)\s+.{0,80}\bsystem\s*\('

  # DEBUG/LOG labels are not malicious by themselves. This atom records the
  # unusual source construction so a composite can distinguish it from an
  # ordinary, visible system() call.
  - id: c-debug-system-macro-wrapper
    desc: C debug macro wraps system()
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?im)^\s*#\s*define\s+\w*(DEBUG|LOG)\w*\([^)]{0,32}\)\s+.{0,80}\bsystem\s*\('

  - id: c-popen-variable-input
    desc: C passes an identifier to popen
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bpopen\s*\(\s*[A-Za-z_][A-Za-z0-9_]*\b'

  - id: c-system-identifier-input
    desc: C passes a computed identifier to system()
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: system
      arg:
        kind: identifier

  - id: c-shell-execution-path
    desc: C source launches POSIX shell
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '^(execl[ep]?|execve|system)$'
      arg:
        index: 0
        kind: string
        regex: '^/bin/(ba)?sh$'
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/package/documentation/manpage::unix-manpage

composite_rules:
  - id: c-computed-command-execution
    desc: C executes a command held in a variable
    crit: notable
    any:
      - id: c-popen-variable-input
      - id: c-system-identifier-input

  # The umbrella "this source can actually run commands" fact for objective
  # composites. In C-family source a quoted shell pipeline is inert data until
  # one of these execution primitives consumes it, so behavioral chains
  # (droppers, spreaders, lockers) pair their command strings with this
  # roll-up instead of convicting on string presence alone.
  - id: c-source-command-execution
    desc: C-family source executes shell commands
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/process/create/shell/native::c-system-call
      - id: micro-behaviors/process/create/exec::c-exec-family-source
      - id: c-computed-command-execution
      - id: c-shell-execution-path
      - id: c-system-macro-wrapper
