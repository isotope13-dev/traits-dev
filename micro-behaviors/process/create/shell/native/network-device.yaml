# IOS command-dispatch calls and pipeline syntax are execution mechanics.
# Concealment intent requires both a show-command rewrite and the specific
# configuration fields hidden by it, which is assembled under objectives/.
defaults:
  platforms: [appliance]
  for: [c, cpp]
  attack: T1059.008

traits:
  - id: ios-shell-send-command-call
    desc: Invokes IOS shell command dispatcher
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: shell_send_cmd

  - id: ios-cli-exclude-filter
    desc: Constructs an IOS CLI output-exclusion pipeline
    crit: notable
    conf: 0.97
    if:
      type: literal
      kind: string
      regex: '\|\s*exclude\b'

  - id: ios-show-command-prefix
    desc: IOS show-command prefix
    crit: component
    conf: 0.98
    if:
      type: literal
      kind: string
      exact: 'show '

composite_rules:
  - id: ios-show-exclude-command-flow
    desc: Sends an IOS show command with an exclusion filter
    crit: notable
    conf: 0.98
    all:
      - id: ios-shell-send-command-call
      - id: ios-cli-exclude-filter
      - id: ios-show-command-prefix
