defaults:
  crit: notable
  platforms:
  - macos
  for:
  - macho
composite_rules:
- id: fork-shell-sleep-functions
  desc: Fork shell and sleep function references
  conf: 0.93
  all:
  - id: micro-behaviors/process/create/fork::fork
  - id: micro-behaviors/time/sleep/interval::sleep
  - id: micro-behaviors/process/create/shell/spawn::system-fn
  unless:
  - id: metadata/signed/platform::apple
  - id: metadata/package/files/included::dylib-extension-basename
  - id: well-known/app/ai/coding-agent/anthropic-claude-code/
  - id: well-known/lib/runtime/scripted/bun-runtime/
  - id: metadata/binary/symbols/count::many-imports-40
  - id: metadata/binary/layout/size::massive-executable
