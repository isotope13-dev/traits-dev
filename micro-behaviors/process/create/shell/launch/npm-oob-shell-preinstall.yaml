defaults:
  platforms: [unix, windows]
  for: [data, manifests]
traits:
  - id: shell-preinstall
    desc: preinstall wraps command in sh -c
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'preinstall.{0,50}\bsh\s+-c\s+'
    not:
      - regex: '\b(test\s+-d|mkdir)\b'

    unless:
      - id: metadata/file/catalog/identity::cleave-trait-definition-file
