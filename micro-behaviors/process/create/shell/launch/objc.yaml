# Objective-C shell creation through NSTask. This is a process-creation
# capability; reverse-shell objectives combine it with socket and fd-redirect
# evidence before assigning hostile intent.
defaults:
  platforms: [macos]
  for: [objc]
  crit: notable
  conf: 0.8
  attack: T1059.004

traits:
  - id: nstask-shell-launch
    desc: Objective-C NSTask launches /bin/sh or /bin/bash
    if:
      type: text
      regex: 'setLaunchPath\s*:\s*@"/bin/(ba)?sh"'
