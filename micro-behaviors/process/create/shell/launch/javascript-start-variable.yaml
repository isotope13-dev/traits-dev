defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
traits:
  - id: node-starts-variable-target
    desc: Node start command names a variable target
    crit: notable
    conf: 0.9
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: exec\s*\(\s*`start\s+""\s+["']?\$\{[A-Za-z_$][A-Za-z0-9_$]*\}
