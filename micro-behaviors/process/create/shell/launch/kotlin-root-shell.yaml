defaults:
  platforms: [android]
  for: [kotlin]
traits:
  - id: root-shell-call-withnew
    desc: Kotlin calls withNewRootShell
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: withNewRootShell

  - id: root-shell-call-create
    desc: Kotlin calls createRootShell
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: createRootShell

composite_rules:
  - id: root-shell-call
    desc: Kotlin root shell call
    crit: notable
    conf: 0.9
    any:
      - id: root-shell-call-withnew
      - id: root-shell-call-create
