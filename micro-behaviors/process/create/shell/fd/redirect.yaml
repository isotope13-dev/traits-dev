defaults:
  crit: notable
traits:
  - id: shell-stdin-fd-redirect
    desc: Shell stdin FD redirection
    conf: 0.9
    platforms: [unix]
    for: [python]
    if:
      type: string_literal
      substr: "/bin/sh -i <&"
  - id: syscall-dup-redirect-linux
    desc: 'syscall dup redirect linux'
    conf: 0.8
    platforms: [linux]
    for: [elf]
    count_min: 2
    if:
      type: syscall
      name: ["dup2", "dup3"]
  # Reverse-shell staging points the accepted socket at standard streams. The
  # target descriptor is the discriminator: a dup2/dup3 site with a resolved
  # 0/1/2 second argument only occurs where the redirect is written inline
  # (shellcode, hand-rolled syscall code). libc dup2/dup3 wrappers take both
  # descriptors as parameters, so their syscall sites stay unresolved and these
  # atoms never fire on wrapper-only binaries such as static musl builds.
  - id: dup2-stdin-target-syscall
    desc: Redirects stdin via dup2/dup3 syscall
    conf: 0.85
    platforms: [linux]
    for: [elf]
    if:
      type: syscall
      name: ["dup2", "dup3"]
      args:
        - index: 1
          value: 0
  - id: dup2-stdout-target-syscall
    desc: Redirects stdout via dup2/dup3 syscall
    conf: 0.85
    platforms: [linux]
    for: [elf]
    if:
      type: syscall
      name: ["dup2", "dup3"]
      args:
        - index: 1
          value: 1
  - id: dup2-stderr-target-syscall
    desc: Redirects stderr via dup2/dup3 syscall
    conf: 0.85
    platforms: [linux]
    for: [elf]
    if:
      type: syscall
      name: ["dup2", "dup3"]
      args:
        - index: 1
          value: 2
  - id: x86-64-syscall-dup2
    desc: Direct x86-64 dup2 syscall
    conf: 0.9
    platforms: [linux]
    for: [elf]
    if:
      type: hex
      section: text
      pattern: "B8 21 00 00 00 0F 05"
  - id: syscall-dup-redirect-macos
    desc: "macOS dup2 syscall for fd redirection"
    conf: 0.8
    platforms: [macos]
    for: [macho]
    count_min: 2
    if:
      type: syscall
      name: ["dup2"]
composite_rules:
  - id: shell-redirect
    desc: Executes program with file descriptor redirection
    conf: 0.8
    platforms: [linux]
    for: [elf]
    all:
      - id: micro-behaviors/process/create/execv::syscall-execve-elf
      - id: syscall-dup-redirect-linux
  - id: shell-redirect-macos
    desc: macOS program execution with FD redirection
    conf: 0.8
    platforms: [macos]
    for: [macho]
    all:
      - id: micro-behaviors/process/create/execv::syscall-execve-macos
      - id: syscall-dup-redirect-macos
