defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.8
traits:
  - id: executes-tmp-file-shell
    desc: Shell interpreter names a temporary path
    for: [scripts, source]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(^|[\s;&|])(ba|z)?sh\s+/(var/)?tmp/[A-Za-z0-9._-]+\b'
