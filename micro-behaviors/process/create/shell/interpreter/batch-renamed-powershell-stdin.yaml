defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: copied-powershell-alias-command-stdin
  desc: Copied PowerShell alias reads piped commands
  crit: suspicious
  conf: 0.99
  if:
    type: yara
    source: |-
      rule powershell_alias_stdin {
       strings:
       $copy = /copy \/y %windir%\\System32\\WindowsPowerShell\\v1\.0\\powershell\.exe [A-Za-z0-9_.-]{1,60}\.exe >nul/ nocase
       $dest = /[A-Za-z0-9_.-]{1,60}\.exe >nul/ nocase
       $pipe = /\| [A-Za-z0-9_.-]{1,60}\/(W 1 \/)?Comm -/ nocase
       $args = /\/(W 1 \/)?Comm -/ nocase
       condition:
       #copy > 0 and #copy <= 16 and #dest <= 32 and #pipe <= 32 and #args <= 32 and
       for any a in (1..#copy) : (
        (@copy[a] == 0 or uint8(@copy[a]-1) == 10) and
        for any b in (1..#dest) : (
         @dest[b] > @copy[a] and @dest[b]+!dest[b] == @copy[a]+!copy[a] and
         for any c in (1..#pipe) : (
          @pipe[c] > @copy[a]+!copy[a] and @pipe[c]-@copy[a] < 2048 and
          for any d in (1..#args) : (
           @args[d] > @pipe[c]+2 and @args[d]+!args[d] == @pipe[c]+!pipe[c] and
           @args[d]-@pipe[c]-2 == !dest[b]-9 and
           for all k in (0..!dest[b]-10) : ((uint8(@dest[b]+k) | 32) == (uint8(@pipe[c]+2+k) | 32))
          )
         )
        )
       )
      }
