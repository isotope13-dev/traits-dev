defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-powershell-launch
    desc: Process call names PowerShell executable
    crit: notable
    conf: 0.92
    mbc: "C0017"
    attack: "T1059.001"
    for: [javascript, typescript, pe]
    if:
      type: raw
      regex: '(?i)(spawn(Sync)?|exec(File)?(Sync)?)\s*\(\s*["'']powershell(\.exe)?["'']'
