defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.75
  attack: T1059.004
traits:
  - id: python-process-api-bash-executable
    desc: Python process API invokes Bash
    if:
      type: tree-sitter
      kind: call
      regex: '(?s)\b(subprocess\.(call|Popen)|os\.(system|popen))\s*\([^)]{0,240}["''](/bin/)?bash["'']'
