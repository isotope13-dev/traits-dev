composite_rules:
- platforms:
  - openwrt
  - unix
  for:
  - zig
  id: zig-hidden-shell-system-command-profile
  desc: Zig hidden shell path and system-command text
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/fs/path/hidden::zig-hidden-temp-shell-path
  - id: metadata/lang/source/literal/fragment/sequence::zig-id-uname-whoami-command-text
  - id: metadata/lang/source/syntax/member::zig-child-init
  - id: micro-behaviors/process/create/shell/reference::zig-bin-sh-c
