defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, scripts, rust]
traits:
- id: cmd-exe-spawn
  desc: JavaScript spawn call names cmd.exe
  conf: 0.86
  attack: "T1059.003"
  for: [javascript, typescript]
  if:
    type: text
    regex: 'spawn\(\s*["'']cmd\.exe["'']'
- id: powershell-exe-spawn
  desc: JavaScript spawn call names PowerShell
  conf: 0.86
  attack: "T1059.001"
  for: [javascript, typescript]
  if:
    type: text
    regex: 'spawn\(\s*["'']powershell(\.exe)?["'']'
