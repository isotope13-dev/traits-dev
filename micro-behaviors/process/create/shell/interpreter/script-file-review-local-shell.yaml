defaults:
  platforms: [unix]
  for: [shell]
  attack: T1059.004
traits:
  - id: bash-local-relative-script
    desc: Bash runs a local relative script
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name (word) @interpreter)
          . argument: [(word) (raw_string) (string . (string_content) .)] @path)
         (#eq? @interpreter "bash")
         (#match? @path "^[\"']?\\./"))
  - id: shell-interpreter-hidden-relative-script
    desc: Shell interpreter runs hidden relative script
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^[ \t]*(bash|sh)[ \t]+["'']?\.[A-Za-z0-9_-]{3,64}\b'
  - id: sh-local-relative-script
    desc: Sh runs a local relative script
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name (word) @interpreter)
          . argument: [(word) (raw_string) (string . (string_content) .)] @path)
         (#eq? @interpreter "sh")
         (#match? @path "^[\"']?\\./"))
  - id: dash-local-relative-script
    desc: Dash runs a local relative script
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name (word) @interpreter)
          . argument: [(word) (raw_string) (string . (string_content) .)] @path)
         (#eq? @interpreter "dash")
         (#match? @path "^[\"']?\\./"))
  - id: zsh-local-relative-script
    desc: Zsh runs a local relative script
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name (word) @interpreter)
          . argument: [(word) (raw_string) (string . (string_content) .)] @path)
         (#eq? @interpreter "zsh")
         (#match? @path "^[\"']?\\./"))
  - id: shell-interpreter-local-script
    desc: Shell interpreter runs local script file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^[ \t]*(busybox\s+)?(sh|bash|ash|dash)\s+["'']?[A-Za-z0-9_][A-Za-z0-9._-]{0,64}\b'
composite_rules:
  - id: interpreter-local-relative-script
    desc: Shell interpreter runs a local relative script
    crit: notable
    conf: 0.9
    any:
      - id: bash-local-relative-script
      - id: sh-local-relative-script
      - id: dash-local-relative-script
      - id: zsh-local-relative-script
