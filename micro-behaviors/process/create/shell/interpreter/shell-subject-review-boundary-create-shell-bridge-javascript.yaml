defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
  crit: notable
traits:
  - id: js-execfile-bash
    desc: Node execFile launches bash process
    conf: 0.86
    mbc: C0017
    attack: T1059.004
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: execFile\)?\(\s*['"`]bash['"`]
  - id: js-function-bash-first-arg
    desc: JavaScript process API receives Bash executable
    conf: 0.94
    mbc: C0017
    attack: T1059.004
    for:
      - javascript
      - typescript
    if:
      type: symbol
      kind: call
      regex: (^|\.)(spawn|spawnSync|execFile|execFileSync)$
      arg:
        index: 0
        exact: bash
  - id: js-spawnsync-posix-interpreter
    desc: Runs a POSIX interpreter via spawnSync
    conf: 0.94
    for:
      - javascript
      - typescript
    attack: T1059
    if:
      type: text
      regex: spawnSync\s*\(\s*["'`](bash|sh|zsh)\b
  - id: js-spawnsync-windows-interpreter
    desc: Runs a Windows interpreter via spawnSync
    conf: 0.94
    for:
      - javascript
      - typescript
    attack: T1059
    if:
      type: text
      regex: spawnSync\s*\(\s*["'`](powershell|pwsh|cmd|cmd\.exe)\b
composite_rules:
  - id: js-spawnsync-interpreter
    desc: Runs an interpreter via spawnSync
    conf: 0.95
    for:
      - javascript
      - typescript
    any:
      - id: micro-behaviors/process/create/shell/interpreter::js-spawnsync-posix-interpreter
      - id: micro-behaviors/process/create/shell/interpreter::js-spawnsync-windows-interpreter
