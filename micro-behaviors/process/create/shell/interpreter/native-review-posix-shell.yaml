defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: T1059.004

traits:
  - id: c-system-posix-shell-call
    desc: C system call names POSIX shell
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @callee
          arguments: (argument_list . (string_literal) @path))
          (#eq? @callee "system")
          (#match? @path "^\"/(usr/)?s?bin/(ba)?sh([ \\t;|&]|\")"))
