defaults:
  platforms: [unix, windows]
  for: [java]
  crit: notable
  conf: 0.98

traits:
  # Shell execution through Runtime/ProcessBuilder is a neutral process-creation
  # capability, not evasion: build and test code routinely shells out for
  # terminal queries (e.g. `stty size`) and toolchain probes. These stay notable
  # here; the webshell/command-injection composites in
  # objectives/execution/interpreter/cmd/injection supply the hostile intent by
  # requiring a nearby HTTP handler/request-input leg.
  - id: java-runtime-shell-exec
    desc: Java Runtime exec invokes a shell interpreter
    crit: notable
    if:
      type: text
      regex: '(?s)Runtime\.getRuntime\(\)\.exec\([^)]{0,120}["'']/bin/sh["'']\s*,\s*["'']-c["'']'
  - id: java-processbuilder-shell-exec
    desc: Java ProcessBuilder invokes a shell interpreter
    crit: notable
    if:
      type: text
      regex: '(?s)new\s+ProcessBuilder\([^)]{0,120}["'']/bin/sh["'']\s*,\s*["'']-c["'']'
