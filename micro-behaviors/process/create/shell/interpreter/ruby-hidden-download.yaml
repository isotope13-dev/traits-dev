defaults:
  for: [ruby]
  platforms: [unix]
traits:
  - id: ruby-hidden-temp-fetch-chmod-run-chain
    desc: Hidden temp fetch chmod and launch chain
    crit: suspicious
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^(system|exec)$'
      arg:
        index: 0
        kind: string
        regex: '^(curl|wget) [^\n]{1,300}https?://[^\n]{1,350} (-o|-O) /(var/)?tmp/\.[^\s;&]+[^\n]{0,90}&& chmod (\+x|0?755|0?777) /(var/)?tmp/\.[^\s;&]+ && /(var/)?tmp/\.[^\s;&]+( &)?$'
