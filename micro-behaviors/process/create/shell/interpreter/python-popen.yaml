# Require the first command/argv string; call facts lack list elements.
defaults:
  for:
  - python
  platforms:
  - unix
  - windows
traits:
- id: python-popen-shell-executable
  desc: Python Popen selects a shell executable
  crit: notable
  conf: 0.95
  if:
    type: tree-sitter
    query: |
      ((call function: (attribute object: (identifier) @module attribute: (identifier) @constructor)
       arguments: (argument_list . [(string) @executable (list . (string) @executable)])) @launch
      (#eq? @module "subprocess")
      (#eq? @constructor "Popen")
      (#match? @executable "^[\"'](/(usr/)?bin/)?((ba|da|z|k|pw)?sh|(cmd|powershell)(\\.exe)?)[\"']$")
      )

      ((call function: (identifier) @constructor
       arguments: (argument_list . [(string) @executable (list . (string) @executable)])) @launch
      (#eq? @constructor "Popen")
      (#match? @executable "^[\"'](/(usr/)?bin/)?((ba|da|z|k|pw)?sh|(cmd|powershell)(\\.exe)?)[\"']$")
      )
