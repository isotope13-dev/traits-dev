defaults:
  for: [perl]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: perl-system-unix-shell
    desc: Perl system invokes Unix shell
    if:
      type: symbol
      kind: call
      exact: system
      arg:
        index: 0
        kind: string
        regex: '^(/(usr/)?bin/)?(ba|da|z|k)?sh$'
