defaults:
  crit: notable
  platforms: [unix, windows]
  for: [java, jsp, class, kotlin]
traits:
  - id: java-runtime-exec-shell-array
    desc: Java Runtime.exec with shell array
    conf: 0.92
    if:
      type: text
      regex: 'Runtime\.getRuntime\(\)\.exec\s*\(\s*new\s+String\[\]\s*\{\s*"/bin/(ba)?sh"'
