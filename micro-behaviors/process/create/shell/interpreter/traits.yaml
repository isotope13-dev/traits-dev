defaults:
  platforms: [unix, windows]
  for: [pe, pyc, powershell, python, batch, javascript, shell, vbs]
  crit: notable
  conf: 0.98

traits:
  - id: powershell-process-call
    desc: PowerShell invokes a PowerShell child process
    crit: notable
    conf: 0.96
    attack: T1059.001
    for: [powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)^(powershell|pwsh)(\.exe)?$'
  - id: node-spawn-posix-interpreter
    desc: Node spawns a POSIX command interpreter
    crit: notable
    conf: 0.92
    mbc: "C0017"
    attack: "T1059.004"
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn$'
      arg:
        kind: string
        regex: '^(bash|sh|zsh)$'
  - id: node-posix-shell-command-variable
    desc: Node passes command to POSIX shell
    crit: notable
    conf: 0.96
    mbc: "C0017"
    attack: "T1059.004"
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bspawn\s*\(\s*["''](ba|z)?sh["'']\s*,\s*\[\s*["'']-c["'']\s*,\s*(command|cmd)\b'
  - id: node-spawn-python-interpreter
    desc: Node spawns a Python interpreter
    crit: notable
    conf: 0.92
    mbc: "C0017"
    attack: "T1059.006"
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn$'
      arg:
        kind: string
        regex: '^python([0-9]+(\.[0-9]+)?)?$'
  - id: powershell-executable-token
    desc: PowerShell executable name reference
    if:
      type: text
      regex: '(?i)\bpowershell\.exe\b'
