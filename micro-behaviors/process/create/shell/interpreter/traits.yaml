defaults:
  platforms: [unix, windows]
  for: [pe, pyc, powershell, python, batch, javascript, shell, vbs]
  crit: notable
  conf: 0.98

traits:
  - id: powershell-process-call
    desc: PowerShell invokes a PowerShell child process
    crit: notable
    conf: 0.96
    attack: T1059.001
    for: [powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)^(powershell|pwsh)(\.exe)?$'
  - id: node-spawn-posix-interpreter
    desc: Node spawns a POSIX command interpreter
    crit: notable
    conf: 0.92
    mbc: "C0017"
    attack: "T1059.004"
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn$'
      arg:
        kind: string
        regex: '^(bash|sh|zsh)$'
  - id: node-posix-shell-command-variable
    desc: Node passes command to POSIX shell
    crit: notable
    conf: 0.96
    mbc: "C0017"
    attack: "T1059.004"
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bspawn\s*\(\s*["''](ba|z)?sh["'']\s*,\s*\[\s*["'']-c["'']\s*,\s*(command|cmd)\b'
  - id: node-spawn-python-interpreter
    desc: Node spawns a Python interpreter
    crit: notable
    conf: 0.92
    mbc: "C0017"
    attack: "T1059.006"
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn$'
      arg:
        kind: string
        regex: '^python([0-9]+(\.[0-9]+)?)?$'
  - id: shell-variable-file-exec
    desc: Shell runs variable command file
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '\b(sh|bash)\s+\$[A-Za-z_][A-Za-z0-9_]*'
  - id: node-run-interpreter
    desc: Calls run() with an interpreter name
    crit: notable
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: text
      regex: 'run\s*\(\s*["''](bash|powershell)["'']'

composite_rules:
  - id: node-script-interpreter-launch
    desc: Node launches a shell or script interpreter
    crit: notable
    conf: 0.94
    platforms: [linux, macos, windows, unix, android, ios]
    for: [javascript, typescript]
    any:
      - id: micro-behaviors/process/create/shell/bridge::js-spawnsync-interpreter
      - id: node-spawn-posix-interpreter
      - id: node-run-interpreter
  - id: node-download-interpreter-launch-cooccurrence
    desc: Node code has download and interpreter-launch paths
    crit: notable
    conf: 0.84
    attack: "T1105,T1059"
    platforms: [linux, macos, windows, unix, android, ios]
    for: [javascript, typescript]
    near_lines: 320
    all:
      - id: node-script-interpreter-launch
      - id: micro-behaviors/communications/http/request/client::https-get
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
    unless:
      - id: well-known/app/ai/coding-agent/pi-studio::pi-studio-archive-context
      - id: well-known/app/ai/coding-agent/pi-studio::pi-studio-fetch-pi-context
      - id: micro-behaviors/data/archive/extract/zip::powershell-expand-archive-text
      - id: micro-behaviors/data/archive/extract/zip::node-spawn-unzip-extract
      - id: micro-behaviors/data/archive/extract/tar::node-spawn-tar-extract
