defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.004

traits:
  - id: node-spawn-absolute-bash
    desc: Node spawns Bash by absolute path
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn$'
      arg:
        kind: string
        exact: /bin/bash
