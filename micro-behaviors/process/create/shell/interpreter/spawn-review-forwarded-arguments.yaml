defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: shell-forwards-positional-arguments
    desc: Launches shell with forwarded script arguments
    conf: 0.99
    if:
      type: symbol
      kind: call
      regex: '^(/(usr/)?bin/)?(ba|da|z|k)?sh$'
      arg:
        kind: string
        exact: '$@'
