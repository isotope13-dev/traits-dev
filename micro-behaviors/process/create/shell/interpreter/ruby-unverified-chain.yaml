defaults:
  platforms: [unix]
  for: [ruby]
traits:
  - id: ruby-system-unverified-temp-stage
    desc: Unverified curl and temp-shell command chain
    crit: suspicious
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: system
      arg:
        index: 0
        kind: string
        regex: '^nohup\s+sh\s+-c\s+"curl\s+--insecure\s+--silent\s+https?://[^\s"]{1,240}\s+-o\s+/(var/)?tmp/[^&\s"]{1,120}\s*&&\s*exec\s+bash\s+/(var/)?tmp/[^"\s]{1,120}"[^\n]{0,100}&\s*$'
