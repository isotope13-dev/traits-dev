defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: T1059.004

traits:
  - id: objc-posix-spawn-shell
    desc: Objective-C posix_spawn launches a shell
    crit: notable
    conf: 0.92
    for: [objc]
    if:
      type: text
      regex: 'posix_spawn\s*\([^;]{0,220}"/bin/(ba)?sh"'
  - id: objc-posix-spawn-shell-variable
    desc: Objective-C posix_spawn uses shell path variable
    crit: notable
    conf: 0.92
    for: [objc]
    if:
      type: text
      regex: 'const char \*shell\s*=\s*"/bin/(ba)?sh"[\s\S]{0,260}posix_spawn\s*\([^;]{0,120}\bshell\b'
