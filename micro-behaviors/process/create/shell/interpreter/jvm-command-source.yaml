traits:
- id: jvm-processbuilder-sh-command-start
  desc: JVM ProcessBuilder starts sh with command text
  if:
    type: text
    regex: ProcessBuilder\("(/bin/)?sh",\s*"-c",[^\n;]{1,180}\.start\(

