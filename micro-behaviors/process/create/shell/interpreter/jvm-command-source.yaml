defaults:
  platforms:
  - android
  - unix
  - windows
  for:
  - java
  - kotlin
  crit: notable
  conf: 0.98
traits:
- id: jvm-processbuilder-sh-command-start
  desc: JVM ProcessBuilder starts sh with command text
  if:
    type: text
    regex: ProcessBuilder\("(/bin/)?sh",\s*"-c",[^\n;]{1,180}\.start\(
- id: jvm-sh-c-argument-pass
  desc: JVM source passes /bin/sh and -c
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '(?i)["''](/bin/)?sh["'']\s*,\s*["'']-c["'']'

