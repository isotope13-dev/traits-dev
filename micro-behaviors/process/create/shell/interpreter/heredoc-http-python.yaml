defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: heredoc-python-http-shell-dispatch
    desc: Python heredoc routes HTTP text to shell
    conf: 0.98
    if:
      type: tree-sitter
      language: shell
      query: |
        ((heredoc_body) @body
         (#match? @body "\\brequests\\.(get|post)\\(")
         (#match? @body "\\bcommand[ \\t]*=[ \\t]*response\\.text\\b")
         (#match? @body "subprocess\\.Popen\\([ \\t]*command[ \\t]*,[ \\t]*shell[ \\t]*=[ \\t]*True")
         (#match? @body "stdout[ \\t]*=[ \\t]*subprocess\\.PIPE")
         (#match? @body "json\\.dumps\\([\\s\\S]{0,180}['\"]output['\"]"))
