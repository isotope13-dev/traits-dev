# Infrastructure administration commands are dual use. Record the capability
# at notable and leave authorization and environment policy to higher layers.
defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.96

traits:
  - id: terraform-auto-approved-change
    desc: Terraform change bypasses confirmation
    if:
      type: text
      regex: '(?i)\b(terraform|tofu)\b[^\n]{0,120}\b(apply|destroy)\b[^\n]{0,120}-auto-approve\b'

  - id: terraform-state-mutation-command
    desc: Terraform command mutates saved state
    if:
      type: text
      regex: '(?i)\bterraform\b[^\n]{0,100}\b(state\s+(rm|mv)|taint|force-unlock)\b'

  - id: helm-release-mutation-command
    desc: Helm mutates an installed release
    if:
      type: text
      regex: '(?i)\bhelm\b[^\n]{0,100}\b(uninstall|rollback|upgrade\b[^\n]{0,80}--force)\b'

  - id: helm-repo-index-command
    desc: Helm generates or merges chart repository index
    if:
      type: text
      regex: '(?i)\bhelm([_-]?v?[0-9]+)?\s+repo\s+index\b'

  - id: aws-s3-bucket-remove-command
    desc: AWS CLI removes an S3 bucket
    if:
      type: text
      regex: '(?i)\baws\b[^\n]{0,100}\bs3\s+rb\s+s3://'

  - id: azure-resource-group-delete-command
    desc: Azure CLI deletes a resource group
    if:
      type: text
      regex: '(?i)\baz\s+group\s+delete\b'

  - id: vercel-production-deploy-command
    desc: Vercel production deployment command
    if:
      type: text
      regex: '(?i)\bvercel\s+--prod\b'

  - id: netlify-production-deploy-command
    desc: Netlify production deployment command
    if:
      type: text
      regex: '(?i)\bnetlify\s+deploy\b[^\n]{0,100}--prod\b'

  - id: serverless-production-deploy-command
    desc: Serverless production deployment command
    if:
      type: text
      regex: '(?i)\bserverless\s+deploy\b[^\n]{0,100}--stage\s+prod\b'

  - id: fly-deploy-command
    desc: Fly application deployment command
    if:
      type: text
      regex: '(?i)\bfly\s+deploy\b'

  - id: gcs-public-read-grant-command
    desc: GCS bucket grants public object access
    if:
      type: text
      regex: '(?i)\bgsutil\s+iam\s+ch\s+allUsers:objectViewer\b'

  - id: aws-public-access-block-disabled
    desc: AWS S3 public access block disabled
    if:
      type: text
      regex: '(?i)\bput-public-access-block\b[^\n]{0,160}BlockPublicAcls=false\b'

  - id: aws-create-access-key-command
    desc: AWS CLI creates an IAM access key
    if:
      type: text
      regex: '(?i)\baws\b[^\n]{0,100}\biam\s+create-access-key\b'
