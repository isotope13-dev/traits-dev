# Text that decodes base64 straight into a shell: the command the reader
# runs is not the command they can read.
defaults:
  platforms: [unix]
  for: [markdown, text, shell, html]
  conf: 0.92

traits:
  - id: base64-decode-piped-to-shell
    desc: Base64 decode piped into a shell
    crit: notable
    if:
      type: text
      regex: '\bbase64\s+(-d|-D|--decode)\b[^\n|]{0,20}\|\s*(sudo\s+)?(/usr)?(/bin/)?(ba|z|da)?sh\b'
