defaults:
  platforms: [unix, windows]
  for: [pkginfo]
traits:
- id: versioned-lifecycle-temp-payload-exec
  desc: Background command names a temporary path
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: "(/tmp/[^\"\\s&;]{1,80})\\s+&(\\s|$)"
  not:
  - substr: "/tmp/docs/"
- id: versioned-lifecycle-background-exec
  desc: Background command names a temporary path
  crit: suspicious
  conf: 0.93
  if:
    type: text
    regex: "(&&\\s*)?/tmp/[^\"\\s&;]{1,80}\\s+&(\\s|$)"
  not:
  - substr: "/tmp/docs/"
