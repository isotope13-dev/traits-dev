# Node sibling of ruby-exec-local-variable: the command handed to exec is held
# in a variable rather than written as a literal.
#
# Relocated here from objectives/command-and-control/backdoor/tasking/poll,
# where it was named `js-task-variable-exec` and described as "Executes a
# variable received as a task".  The regex only establishes that the exec
# argument is a variable with a command-shaped name -- nothing in it shows the
# value arrived over a tasking channel -- and `command` is the ordinary name
# for a locally assembled shell string, so it fired on routine code such as a
# `tasklist /FI "PID eq N"` liveness check.  The remote-tasking intent lives in
# the other legs of the composite that references this atom (interval timer,
# HTTP response events, POST body).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-exec-command-variable
    desc: exec called with command-named variable
    crit: notable
    conf: 0.9
    mbc: C0017
    attack: T1059.007
    if:
      type: text
      regex: '\bexec(Sync)?\s*\(\s*(task|command|cmd|payload)\b'
