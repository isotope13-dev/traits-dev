# Request-sourced shell commands: the command text arrives in an inbound
# request payload (query/body parameter) rather than being constructed
# locally. A sibling `shell/batch/` means "via a batch file" and
# `shell/encoded/` means "with an encoded command"; this directory means
# "sourced from an inbound request" — the n8n-workflow and webhook RCE shape
# where `exec()` runs a caller-supplied `cmd` field.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: workflow-cmd-parameter-read
    desc: Node reads cmd from request payload
    conf: 0.94
    if:
      type: text
      regex: '\.(query|body)\.(cmd|command)\b'
