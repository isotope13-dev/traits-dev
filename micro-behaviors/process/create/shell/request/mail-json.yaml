# Antino demonstrates that Graph tasking need not be Base64 encoded.
# Bind parsed message-body JSON to the value actually passed to a shell.
# Session prefixes, mailbox identities and storage directory names are omitted.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  attack: T1102.002,T1059
  conf: 0.97

traits:
  - id: python-message-json-shell-flow
    desc: Mail body JSON supplies shell command
    crit: notable
    for: [python]
    if:
      type: tree-sitter
      query: |
        ((block
          (expression_statement (assignment left: (identifier) @task right: (call function: (attribute object: (identifier) @json attribute: (identifier) @loads) arguments: (argument_list (subscript value: (subscript subscript: (string) @body) subscript: (string) @content)))))
          . (if_statement consequence: (block (expression_statement (assignment right: (call function: (attribute object: (identifier) @subprocess attribute: (identifier) @exec) arguments: (argument_list (subscript value: (subscript value: (identifier) @used subscript: (string) @data) subscript: (string) @command) (keyword_argument name: (identifier) @shell value: (true)))))))))
          (#eq? @task @used)
          (#eq? @json "json") (#eq? @loads "loads")
          (#match? @body "^[\"']body[\"']$") (#match? @content "^[\"']content[\"']$")
          (#eq? @subprocess "subprocess") (#eq? @exec "check_output")
          (#match? @data "^[\"']command_data[\"']$") (#match? @command "^[\"']command[\"']$")
          (#eq? @shell "shell"))

  - id: javascript-message-json-shell-flow
    desc: Mail body JSON supplies execSync command
    crit: notable
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator name: (identifier) @task value: (call_expression function: (member_expression object: (identifier) @json property: (property_identifier) @parse) arguments: (arguments (member_expression object: (member_expression property: (property_identifier) @body) property: (property_identifier) @content)))))
          . (lexical_declaration (variable_declarator value: (call_expression function: (identifier) @exec arguments: (arguments (member_expression object: (member_expression object: (identifier) @used property: (property_identifier) @data) property: (property_identifier) @command))))))
          (#eq? @task @used) (#eq? @json "JSON") (#eq? @parse "parse")
          (#eq? @body "body") (#eq? @content "content")
          (#eq? @exec "execSync") (#eq? @data "command_data") (#eq? @command "command"))

