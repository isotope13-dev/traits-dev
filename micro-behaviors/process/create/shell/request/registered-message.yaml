defaults:
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: python-registered-message-shell-handler
  desc: Registered message handler passes text to shell
  crit: notable
  conf: 0.995
  if:
    type: tree-sitter
    query: |2

      ((module
        (function_definition name: (identifier) @handler
          body: (block
            (expression_statement (assignment left: (identifier) @text
              right: (boolean_operator left: (attribute object: (attribute object: (identifier) @update attribute: (identifier) @message) attribute: (identifier) @textfield))))
            (if_statement consequence: (block
              (expression_statement (assignment right: (call function: (attribute
                object: (call function: (attribute object: (identifier) @os attribute: (identifier) @popen)
                  arguments: (argument_list (subscript value: (identifier) @command)))
                attribute: (identifier) @read))))))))
        (expression_statement (call arguments: (argument_list
          (call function: (identifier) @messagehandler arguments: (argument_list (_) (identifier) @callback)))))) @bound
        (#eq? @handler @callback)
        (#eq? @messagehandler "MessageHandler")
        (#eq? @message "message") (#eq? @textfield "text")
        (#eq? @text @command) (#eq? @os "os") (#eq? @popen "popen") (#eq? @read "read"))
