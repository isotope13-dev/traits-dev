defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006
traits:
  - id: python-interpreter-runs-variable-path
    desc: Spawns an interpreter on a variable path
    conf: 0.92
    mbc: "C0017"
    if:
      type: text
      regex: 'subprocess\.(Popen|run)\(\s*\[\s*(_?python\w*\(?\)?|["''][a-z0-9]+["''])\s*,\s*'
