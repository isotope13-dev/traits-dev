defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006
traits:
  - id: python-interpreter-runs-variable-path
    desc: Spawns an interpreter on a variable path
    # First argv element must name python/node/sh/bash (quoted, or a
    # _python()/python_exe helper); any other program is not an interpreter.
    conf: 0.92
    mbc: "C0017"
    if:
      type: text
      regex: 'subprocess\.(Popen|run)\(\s*\[\s*["'']?_?(python[\w.]*|node|(ba)?sh)\b[\s"''()]*,'
