# Archive-level co-occurrence preserves the original detection surface, not a
# claimed network-to-process value flow or an inference of unauthorized use.
defaults:
  platforms: [unix, windows]
  for: [python, whl]
  crit: notable
composite_rules:
  # The widget form was a strict subset of this profile. Its argument atom
  # remains independently visible; a second same-result composite adds no role.
  - id: python-task-api-process-context
    desc: Task API, HTTP and subprocess clues coexist
    conf: 0.98
    scope: archive
    all:
      - id: metadata/lang/source/naming::python-task-api-state-names
      - id: metadata/lang/source/naming::python-task-notify-name
      - id: micro-behaviors/process/create/subprocess::process-execution
      - id: micro-behaviors/communications/http/request/client::request-python
    any:
      - id: micro-behaviors/process/argument/option::python-widget-process-arguments
      - id: micro-behaviors/data/collection/map::python-payload-cmd-get
      - id: micro-behaviors/data/control-flow/dispatch::python-claimed-command-handler-calls
