defaults:
  crit: notable
  platforms: [unix, windows]
  attack: T1059
traits:
- id: rust-command-path-variable
  desc: Rust command uses a path variable
  crit: notable
  conf: 0.86
  for: [rust]
  if:
    type: text
    regex: 'Command::new\s*\(\s*&?[A-Za-z0-9_]{1,40}_path\s*\)'
  unless:
    - id: metadata/package/testing/
    - id: metadata/path::test-directory-component
