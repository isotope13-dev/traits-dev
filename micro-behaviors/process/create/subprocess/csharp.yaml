# Process.Start creates the managed Process object representing a child.
defaults:
  platforms: [windows, unix]
  for: [csharp]
  crit: notable
traits:
  - id: dotnet-process-start
    desc: Process execution via Process.Start
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)Process\.Start$'
    unless:
      - id: micro-behaviors/process/create/shell/spawn::csharp-cmd-command-text
      - id: well-known/game/mod::bedrockboot-source-repository
