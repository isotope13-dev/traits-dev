defaults:
  platforms: [unix]
  for: [jsp]
traits:
  # JSP text filtering does not remove JSP comments. Offset checks keep
  # this request-at-sink signature inside an active scriptlet and outside
  # JSP/Java comments and quoted strings.
  - id: jsp-request-shell-builder
    desc: Shell ProcessBuilder reads request command
    crit: suspicious
    if:
      type: yara
      source: |
        rule jsp_direct_request_shell_builder {
          strings:
            $call = /new\s+ProcessBuilder\s*\(\s*"\/bin\/sh"\s*,\s*"-c"\s*,\s*request\.getParameter\s*\(/
            $open = /<%[ \t\r\n]/
            $close = "%>"
            $jsp_comment = /<%--.*?--%>/s
            $block_comment = /\/\*.*?\*\//s
            $line_comment = /\/\/[^\r\n]{0,1024}/
            $quoted = /"([^"\\\r\n]|\\.){0,1024}"/
          condition:
            for any c in (1..#call) : (
              for any o in (1..#open) : (
                @open[o] < @call[c] and
                (#close == 0 or for all e in (1..#close) :
                  (@close[e] < @open[o] or @close[e] > @call[c]))
              ) and
              (#jsp_comment == 0 or for all i in (1..#jsp_comment) :
                (@call[c] < @jsp_comment[i] or @call[c] >= @jsp_comment[i] + !jsp_comment[i])) and
              (#block_comment == 0 or for all i in (1..#block_comment) :
                (@call[c] < @block_comment[i] or @call[c] >= @block_comment[i] + !block_comment[i])) and
              (#line_comment == 0 or for all i in (1..#line_comment) :
                (@call[c] < @line_comment[i] or @call[c] >= @line_comment[i] + !line_comment[i])) and
              (#quoted == 0 or for all i in (1..#quoted) :
                (@call[c] < @quoted[i] or @call[c] >= @quoted[i] + !quoted[i]))
            )
        }

