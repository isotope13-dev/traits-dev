defaults:
  crit: notable
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-processstartinfo-object
    desc: PowerShell creates .NET ProcessStartInfo
    conf: 0.94
    # The static `::new()` construction spells the same construction without
    # New-Object, as in obfuscated CartJacked stagers. Covers New-Object and
    # type literals with or without the namespace, such as
    # [Diagnostics.ProcessStartInfo]::new() and [ProcessStartInfo]::new().
    if:
      type: text
      regex: '(?i)(New-Object\s+|\[)((System\.)?Diagnostics\.)?ProcessStartInfo\b'

