defaults:
  crit: notable
  conf: 0.92
  platforms: [unix]
  for: [rust]

traits:
  - id: rust-shell-command-exec
    desc: Rust configures sh with a command argument
    if:
      type: text
      regex: 'Command::new\(["''](sh|/bin/sh|/usr/bin/sh)["'']\)[\s\S]{0,120}\.arg\(["'']-[c]["'']\)'

  - id: rust-shell-command-runner
    desc: Rust constructs a shell command
    if:
      type: text
      regex: 'Command::new\(["''](sh|/bin/sh|/usr/bin/sh)["'']\)'
