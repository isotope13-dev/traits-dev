defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go]
traits:
  - id: go-inline-e-interpreter-command
    desc: Go constructs an inline interpreter command
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: exec.Command
      args:
        - index: 0
          kind: string
          regex: '(?i)^(node|lua|ruby|perl)(\.exe)?$'
        - index: 1
          kind: string
          exact: '-e'

  - id: go-inline-python-command
    desc: Go constructs an inline Python command
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: exec.Command
      args:
        - index: 0
          kind: string
          regex: '(?i)^python3?(\.exe)?$'
        - index: 1
          kind: string
          exact: '-c'

composite_rules:
  - id: go-inline-interpreter-command
    desc: Go constructs an inline interpreter command
    conf: 0.98
    any:
      - id: go-inline-e-interpreter-command
      - id: go-inline-python-command

