defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
composite_rules:
- id: rust-build-rs-exec-staged-path
  desc: Cargo build configures named path command
  crit: notable
  conf: 0.9
  for:
  - rust
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  - id: micro-behaviors/process/config/target::rust-command-path-variable
  any:
  - id: metadata/lang/source/naming/resource::rust-payload-stage-loader-path-name
  - id: metadata/lang/source/naming/variable::rust-binary-path-token
