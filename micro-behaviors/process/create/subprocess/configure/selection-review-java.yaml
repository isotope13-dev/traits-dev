defaults:
  platforms: [unix, windows]
  for: [java]

traits:
  - id: java-windows-command-array-source
    desc: Java constructs Windows shell command array
    crit: notable
    conf: 0.96
    for: [jsp, java, html, javascript, python, vbs]
    if:
      type: text
      regex: 'new\s+String\s*\[\s*\]\s*\{\s*["'']cmd(\.exe)?["'']\s*,\s*["'']/c["'']'

  - id: java-posix-command-array-source
    desc: Java constructs POSIX shell command array
    crit: notable
    conf: 0.96
    for: [jsp, java, html, javascript, python, vbs, data]
    if:
      type: text
      regex: 'new\s+String\s*\[\s*\]\s*\{\s*["'']/bin/(ba)?sh["'']\s*,\s*["'']-c["'']'

composite_rules:
  - id: java-numeric-posix-command-array-source
    desc: Java numeric character shell argv
    crit: notable
    conf: 0.96
    for: [jsp, java, html, javascript, python, vbs]
    near_bytes: 256
    all:
      - id: metadata/lang/source/literal/array::java-char-array-argv-prefix
      - id: metadata/lang/source/literal/array::java-constructed-shell-command-flag
    any:
      - id: micro-behaviors/fs/path/application/interpreter::decimal-posix-shell-character-array
      - id: micro-behaviors/fs/path/application/interpreter::hex-posix-shell-character-array
    needs: 1

