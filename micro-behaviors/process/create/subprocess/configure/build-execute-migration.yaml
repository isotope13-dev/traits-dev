defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
traits:
  - id: setup-py-subprocess-call
    desc: Install class and subprocess references
    crit: suspicious
    conf: 0.85
    for:
      - python
    if:
      type: text
      regex: class\s+\w*Install\w*\s*\([^)]{0,160}\binstall\b[^)]{0,160}\)[\s\S]{0,600}subprocess\.
    downgrade:
      any:
        - id: micro-behaviors/metaprogramming/generation/build::make-toolchain-invocation
        - id: micro-behaviors/metaprogramming/generation/build::make-toolchain-shell-format
        - id: micro-behaviors/metaprogramming/generation/build::build-script-toolchain-invocation
  - id: rust-build-rs-env-curl-command
    desc: Rust environment access and curl command
    crit: notable
    conf: 0.92
    for:
      - rust
    if:
      type: text
      regex: std::env::var\w*[\s\S]{0,290}Command::new\s*\(\s*"curl"
  - id: rust-build-rs-env-wget-command
    desc: Rust environment access and wget command
    crit: notable
    conf: 0.92
    for:
      - rust
    if:
      type: text
      regex: std::env::(vars|var(_os)?)[\s\S]{0,300}Command::new\s*\(\s*"wget"
  - id: rust-build-tar-extract-command
    desc: Rust command constructor names tar
    crit: notable
    conf: 0.88
    for:
      - rust
    if:
      type: text
      regex: Command::new\s*\(\s*"tar"\s*\)

composite_rules:
  - id: rust-build-rs-target-start
    desc: Cargo target path and command setup clues
    crit: suspicious
    conf: 0.96
    for:
      - rust
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: micro-behaviors/fs/path/location::rust-join-target-component
      - id: metadata/lang/source/syntax/argument::rust-indirect-command-new
      - id: metadata/lang/source/syntax/call/member::rust-build-rs-start-arg
