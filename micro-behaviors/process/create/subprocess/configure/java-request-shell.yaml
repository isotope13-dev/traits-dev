defaults:
  platforms: [unix, windows]
  for: [java]
traits:
  - id: java-request-value-shell-start
    desc: Starts shell with request parameter value
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((block
          (local_variable_declaration
            declarator: (variable_declarator name: (identifier) @bound
              value: (method_invocation name: (identifier) @read)))
          . (if_statement consequence: (block
            . (local_variable_declaration declarator: (variable_declarator
              value: (method_invocation
                object: (object_creation_expression type: (type_identifier) @builder
                  arguments: (argument_list
                    . (string_literal) @shell . (string_literal) @flag
                    . (identifier) @command .))
                name: (identifier) @start))))))
          (#eq? @read "getParameter")
          (#eq? @builder "ProcessBuilder")
          (#eq? @shell "\"/bin/sh\"")
          (#eq? @flag "\"-c\"")
          (#eq? @start "start")
          (#eq? @bound @command))
