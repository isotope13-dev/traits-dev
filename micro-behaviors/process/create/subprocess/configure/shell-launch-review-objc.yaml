# Launch-path assignment is configuration evidence, not a process launch.
defaults:
  platforms: [macos]
  for: [objc]
  crit: notable
  conf: 0.8
  attack: T1059.004

traits:
  - id: objc-shell-launchpath-text
    desc: Objective-C launch path names shell
    if:
      type: text
      regex: 'setLaunchPath\s*:\s*@"/bin/(ba)?sh"'
