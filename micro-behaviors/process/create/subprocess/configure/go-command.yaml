defaults:
  for: [go]
traits:
  - crit: notable
    platforms:
      - unix
      - windows
    id: go-exec-command-call
    desc: Go exec.Command child-command construction call
    conf: 0.85
    if:
      type: symbol
      kind: call
      # Ordinary call facts retain the source receiver spelling. Canonical
      # import targets are currently exposed only to provenance-filtered
      # queries; do not claim renamed-import coverage from this matcher.
      exact: exec.Command
