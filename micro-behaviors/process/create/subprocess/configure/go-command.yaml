defaults:
  for: [go]
  platforms: [unix, windows]
traits:
  - crit: notable
    id: go-exec-command-call
    desc: Go exec.Command child-command construction call
    conf: 0.85
    if:
      type: symbol
      kind: call
      # Ordinary call facts retain the source receiver spelling. Canonical
      # import targets are currently exposed only to provenance-filtered
      # queries; do not claim renamed-import coverage from this matcher.
      exact: exec.Command
composite_rules:
  - id: go-exec-command-any
    desc: Go exec.Command child-process construction
    crit: notable
    conf: 0.9
    for: [go, elf, pe, macho]
    any:
      - id: go-exec-command-call
      - id: metadata/binary/symbols/name/qualified/execution::go-native-exec-command-reference
