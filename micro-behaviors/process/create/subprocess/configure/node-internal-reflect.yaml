# Facts retain the call, but do not project fields through Reflect.apply's
# argument-vector array. Inspect that array structurally instead.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-reflective-internal-spawn-descriptor
    desc: Reflective call supplies Node spawn options
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (
          (call_expression
            function: (member_expression object: (identifier) @reflect property: (property_identifier) @apply)
            arguments: (arguments . (_) . (_) . (array . [
              (object (pair key: [(property_identifier) (string)] @file) (pair key: [(property_identifier) (string)] @args) (pair key: [(property_identifier) (string)] @envPairs))
              (object (pair key: [(property_identifier) (string)] @file) (pair key: [(property_identifier) (string)] @envPairs) (pair key: [(property_identifier) (string)] @args))
              (object (pair key: [(property_identifier) (string)] @args) (pair key: [(property_identifier) (string)] @file) (pair key: [(property_identifier) (string)] @envPairs))
              (object (pair key: [(property_identifier) (string)] @args) (pair key: [(property_identifier) (string)] @envPairs) (pair key: [(property_identifier) (string)] @file))
              (object (pair key: [(property_identifier) (string)] @envPairs) (pair key: [(property_identifier) (string)] @file) (pair key: [(property_identifier) (string)] @args))
              (object (pair key: [(property_identifier) (string)] @envPairs) (pair key: [(property_identifier) (string)] @args) (pair key: [(property_identifier) (string)] @file))
            ]))) @launch
          (#eq? @reflect "Reflect")
          (#eq? @apply "apply")
          (#match? @file "^[\"']?file[\"']?$")
          (#match? @args "^[\"']?args[\"']?$")
          (#match? @envPairs "^[\"']?envPairs[\"']?$")
        )
