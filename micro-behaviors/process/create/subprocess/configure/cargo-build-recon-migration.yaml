defaults:
  platforms: [unix, windows]

composite_rules:
  - id: micro-behaviors/process/create/subprocess/configure::rust-build-obfuscated-file-uploader
    desc: Build script uses encoded file-related command clues
    crit: suspicious
    conf: 0.995
    scope: archive
    for: [rust, crate, tar, zip]
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: metadata/lang/source/syntax/declaration::rust-build-embedded-runtime-module
      - id: micro-behaviors/data/encode/xor::rust-repeating-key-xor
      - id: metadata/lang/source/syntax/call/arguments::rust-build-encoded-command-arguments
      - id: metadata/lang/source/syntax/call/arguments::rust-build-file-metadata-body
      - id: metadata/lang/source/syntax/argument::rust-indirect-command-new
