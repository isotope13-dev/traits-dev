defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
composite_rules:
- id: python-hash-fetch-write-exec-profile
  desc: Python hash, fetch, write and exec clues
  crit: notable
  conf: 0.98
  for:
  - python
  near_bytes: 8192
  all:
  - id: micro-behaviors/data/string/search::python-hash-hex-prefix-check
  - id: micro-behaviors/os/sysinfo/platform/branch::python-platform-branch
  - id: micro-behaviors/communications/http/lib/requests::requests-get
  - id: micro-behaviors/fs/file/open::write-append-create-mode
  - id: micro-behaviors/process/create/subprocess::process-execution
