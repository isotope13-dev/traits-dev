      \    (navigation_expression target: (simple_identifier) @receiver\n      suffix: (navigation_suffix suffix:\
      \ (simple_identifier) @method))))\n  (#eq? @constructor \"Process\")\n  (#eq? @binding @receiver)\n  (#eq?\
      \ @method \"run\"))\n(_\n  (property_declaration\n    name: (pattern bound_identifier: (simple_identifier)\
      \ @binding)\n    value: (call_expression (simple_identifier) @constructor))\n  (_ (statements (try_expression\
      \ expr: (call_expression\n    (navigation_expression target: (simple_identifier) @receiver\n      suffix:\
      \ (navigation_suffix suffix: (simple_identifier) @method))))))\n  (#eq? @constructor \"Process\")\n  (#eq?\
      \ @binding @receiver)\n  (#eq? @method \"run\"))\n"
