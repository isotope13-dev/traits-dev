defaults:
  for: [c, cpp]
  platforms: [windows]
  crit: notable
  attack: T1106
traits:
  - id: create-process-source
    desc: CreateProcess usage in source
    conf: 0.9
    if:
      type: text
      word: "CreateProcess"
  - id: create-process-call-source
    desc: CreateProcess API call in C/C++ source
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '^CreateProcess(AsUser)?[AW]?$'
