defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.006
  mbc: C0017
traits:
  # The peer's bytes become the command, whatever reader the socket is
  # wrapped in: recv(), makefile().readline(), or JSON framing on top.
  - id: socket-stream-input-argument
    desc: Socket stream data becomes a process command
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(subprocess\.(run|Popen|call|check_call|check_output|getoutput)|os\.(system|popen))$'
      arg:
        index: 0
        from:
          call: '^_?socket\.(create_connection|socket|fromfd)$'
          through:
            - call: '\.(makefile|readline|read|recv|recvfrom)$'
              receiver: true
            - call: '\.(decode|strip|rstrip|split|get)$'
              receiver: true
            - call: '^json\.loads$'
              arguments: [0]
  # os.system/os.popen/getoutput always hand the string to /bin/sh or cmd.
  - id: socket-stream-shell-argument
    desc: Socket stream data reaches a shell call
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(subprocess\.getoutput|os\.(system|popen))$'
      arg:
        index: 0
        from:
          call: '^_?socket\.(create_connection|socket|fromfd)$'
          through:
            - call: '\.(makefile|readline|read|recv|recvfrom)$'
              receiver: true
            - call: '\.(decode|strip|rstrip|split|get)$'
              receiver: true
            - call: '^json\.loads$'
              arguments: [0]
