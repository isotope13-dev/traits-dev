defaults:
  platforms: [windows, unix]
  for: [pe, dll]
traits:
  - id: dotnet-process-start-call
    desc: Calls managed child-process creation API
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: System.Diagnostics.Process.Start

  - id: dotnet-process-start-import
    desc: Imports managed child-process creation API
    crit: notable
    conf: 0.99
    if:
      type: import
      exact: System.Diagnostics.Process.Start
