defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-custom-install-request-shell-clues
    desc: Custom setup HTTP and shell execution clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
      - id: micro-behaviors/communications/http/request/client::request-python
      - id: "metadata/lang/source/naming/action/token::execute-command-identifier"
      - id: micro-behaviors/process/create/shell/
