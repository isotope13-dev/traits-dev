# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  for:
  - python
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.9
composite_rules:
- id: python-subprocess-launch-calls
  desc: Python subprocess launch call sites
  any:
