# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  platforms:
  - unix
  - windows
  for:
  - rust
  crit: notable
traits:
- id: rust-command-spawn-call
  desc: Spawns a Rust Command child process
  conf: 0.96
  if:
    type: symbol
    kind: call
    regex: (^|\.)spawn$
    receiver:
      from:
        call: ^((std|tokio)::process|async_process)::Command::new$
        through:
          - call: \.(arg|args|current_dir|env|envs|env_clear|env_remove|stdin|stdout|stderr|uid|gid|process_group|kill_on_drop)$
            receiver: true
