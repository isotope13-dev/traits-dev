defaults:
  platforms: [windows]
  for: [php]
  crit: notable
traits:
  - id: php-proc-open-cmd-session
    desc: PHP proc_open launches a cmd session
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: proc_open
      arg:
        index: 0
        from:
          value: '(?i)^cmd(\.exe)?$'
