defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  attack: T1059.006
traits:
- id: recv-input-argument
  desc: Subprocess arguments use data returned by recv
  crit: notable
  conf: 0.98
  mbc: C0017
  if:
    type: symbol
    kind: call
    regex: ^subprocess\.(run|Popen|call)$
    arg:
      index: 0
      from:
        call: (^|\.)recv$
        through:
        - call: \.decode$
          receiver: true
        - call: \.strip$
          receiver: true
- id: subprocess-shell-cwd-options
  desc: Subprocess sets shell or working directory
  crit: notable
  conf: 0.9
  mbc: C0017
  if:
    type: tree-sitter
    kind: call
    regex: (?s)\bsubprocess\.(run|Popen|call)\s*\([^)]{0,700}\b(shell|cwd)\s*=
  unless:
  - id: micro-behaviors/os/security/scan/signature::code-pattern-catalog
- id: build-extension-subprocess-popen
  desc: Python build extension invokes Popen
  crit: notable
  conf: 0.9
  mbc: E1059.006
  if:
    type: text
    regex: (\bcmdclass\b|\bbuild_ext\b)[\s\S]{0,500}subprocess\.Popen
- id: popen-ast
  desc: Launches a process with subprocess.Popen
  crit: notable
  conf: 0.85
  mbc: C0017
  if:
    type: symbol
    kind: call
    regex: ^([A-Za-z_]\w*\.)?Popen$
- id: run-ast
  desc: Calls subprocess.run to launch a process
  crit: notable
  conf: 0.85
  mbc: C0017
  if:
    type: symbol
    kind: call
    exact: subprocess.run
  unless:
  - id: well-known/tool/detection/security-remediation::compiled-remediation-catalog
  - id: micro-behaviors/os/security/scan/signature::code-pattern-catalog
- id: call-ast
  desc: Runs a process with subprocess.call
  crit: notable
  conf: 0.85
  mbc: C0017
  if:
    type: symbol
    kind: call
    exact: subprocess.call
- id: check-call-ast
  desc: subprocess.check_call call
  crit: notable
  conf: 0.85
  mbc: C0017
  unless:
  - id: well-known/app/system/archlinux-kernel::versioned-lts-update-helper
  if:
    type: symbol
    kind: call
    exact: subprocess.check_call
- id: popen-content
  desc: Calls subprocess.Popen
  crit: notable
  conf: 0.75
  mbc: E1059.006
  for:
  - python
  - text
  if:
    type: tree-sitter
    kind: call
    regex: \bsubprocess\.Popen\s*\(
  unless:
  - id: micro-behaviors/process/create/subprocess/launch::popen-ast
  - type: text
    regex: subprocess\.Popen\(\s*\[\s*["']open["']
  - type: text
    regex: subprocess\.Popen\(\s*\[\s*["']xdg-open["']
  - type: text
    regex: subprocess\.Popen\(\s*\[\s*["']explorer\.exe["']
- id: asyncio-create-subprocess-exec
  desc: asyncio subprocess execution call
  crit: notable
  conf: 0.85
  mbc: E1059.006
  if:
    type: symbol
    kind: call
    regex: (^|\.)create_subprocess_exec$
- id: sys-executable-c-popen-ast
  desc: subprocess.Popen includes a -c argument
  crit: notable
  conf: 0.96
  mbc: E1059.006
  if:
    type: symbol
    kind: call
    exact: subprocess.Popen
    arg:
      kind: string
      regex: ^-c$
- id: python-module-level-popen
  desc: Popen call at Python module top level
  platforms:
  - windows
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: call
    module_level: true
    regex: (^|\.)Popen$
composite_rules:
- id: python-start-shell-subprocess-launch
  desc: Python subprocess references start.sh
  crit: notable
  conf: 0.97
  scope: file
  all:
  - id: micro-behaviors/fs/path/script::python-start-shell-reference
  - id: micro-behaviors/process/create/subprocess/launch::process-execution
- id: process-execution
  desc: Python subprocess API launches a child process
  crit: notable
  conf: 0.8
  for:
  - python
  - text
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: well-known/app/system/archlinux-kernel::versioned-lts-update-helper
  - id: well-known/tool/detection/security-remediation::compiled-remediation-catalog
  - id: well-known/tool/detection/security-remediation::authenticated-encryption-recommendation
  - id: metadata/build/xcode::xcode-platform-args-build-context
  - id: micro-behaviors/os/security/scan/signature::code-pattern-catalog
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
  - id: well-known/tool/offensive/ctf-skills::source-context
  any:
  - id: micro-behaviors/process/create/subprocess/launch::popen-content
  - id: micro-behaviors/process/create/subprocess/capture::check-output
  - id: micro-behaviors/process/create/shell/command-string::getoutput-content
  - id: micro-behaviors/process/create/subprocess/launch::popen-ast
  - id: micro-behaviors/process/create/subprocess/launch::run-ast
  - id: micro-behaviors/process/create/subprocess/launch::call-ast
  - id: micro-behaviors/process/create/subprocess/capture::check-output-ast
  - id: micro-behaviors/process/create/subprocess/launch::check-call-ast
  - id: micro-behaviors/process/create/subprocess/capture::importlib-subprocess-check-output
