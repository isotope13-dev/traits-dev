defaults:
  platforms:
  - unix
  for:
  - python
composite_rules:
- id: python-chmodded-shell-script-execution
  desc: Python makes a referenced shell script executable and launches it
  crit: notable
  conf: 0.95
  scope: file
  near_lines: 30
  all:
  - id: micro-behaviors/fs/path/self::python-module-directory
  - id: micro-behaviors/fs/path/construct::python-variable-dir-shell-script
  - id: micro-behaviors/fs/chmod/executable/mode::python-executable
  - id: micro-behaviors/process/create/subprocess/launch::process-execution
