defaults:
  platforms:
  - unix
  for:
  - python
traits:
# One variable carries the whole handoff: it is bound to `<dir> / "x.sh"`,
# given an owner-executable mode, then passed as the program to a subprocess
# call. Proximity alone cannot tell this from a test that chmods one temp
# script and runs another, so the identity of the variable is checked here.
- id: python-same-path-sh-chmod-exec
  desc: Same .sh path chmodded then executed
  crit: notable
  conf: 0.95
  if:
    type: tree-sitter
    query: |
      ((block
        (expression_statement (assignment left: (identifier) @path
          right: [
            (binary_operator operator: "/" right: (string (string_content) @script))
            (call function: (attribute attribute: (identifier) @join)
              arguments: (argument_list (string (string_content) @script) .))]))
        (expression_statement [
          (call function: (attribute object: (identifier) @armed attribute: (identifier) @chmod)
            arguments: (argument_list . (integer) @mode .))
          (call function: (attribute object: (identifier) @os attribute: (identifier) @chmod)
            arguments: (argument_list . (identifier) @armed . (integer) @mode .))])
        (expression_statement [
          (call function: (attribute object: (identifier) @mod attribute: (identifier) @api)
            arguments: (argument_list . [
              (list . [(identifier) @run
                (call function: (identifier) @str arguments: (argument_list (identifier) @run))])
              (identifier) @run
              (call function: (identifier) @str arguments: (argument_list (identifier) @run))]))
          (assignment right: (call function: (attribute object: (identifier) @mod attribute: (identifier) @api)
            arguments: (argument_list . [
              (list . [(identifier) @run
                (call function: (identifier) @str arguments: (argument_list (identifier) @run))])
              (identifier) @run
              (call function: (identifier) @str arguments: (argument_list (identifier) @run))])))]) @evidence)
      (#match? @script "\\.sh$")
      (#eq? @chmod "chmod")
      (#any-of? @join "join" "joinpath")
      (#eq? @os "os")
      (#match? @mode "^0o?7[0-7]{2}$")
      (#eq? @mod "subprocess")
      (#match? @api "^(run|call|check_call|check_output|Popen)$")
      (#eq? @path @armed)
      (#eq? @path @run)
      (#set! cleave.ignore-comments "true"))
composite_rules:
- id: python-chmodded-shell-script-execution
  desc: Python makes a referenced shell script executable and launches it
  crit: notable
  conf: 0.95
  scope: file
  near_lines: 30
  all:
  - id: micro-behaviors/fs/path/self::python-module-directory
  - id: micro-behaviors/fs/path/construct::python-variable-dir-shell-script
  - id: micro-behaviors/fs/chmod/executable/mode::python-executable
  - id: micro-behaviors/process/create/subprocess/launch::process-execution
