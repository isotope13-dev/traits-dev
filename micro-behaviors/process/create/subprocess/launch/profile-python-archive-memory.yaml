defaults:
  platforms: [windows, unix]
  for: [python]

composite_rules:
  - id: python-archive-powershell-memory-apis
    desc: Python archive PowerShell and memory APIs
    crit: suspicious
    conf: 0.99
    platforms: [windows]
    for: [python, whl, python-sdist]
    scope: archive
    all:
      - id: micro-behaviors/mem/protect/modify/unspecified::virtualprotect-ctypes
      - id: metadata/import/builtin::python-base64-import
      - id: micro-behaviors/process/argument/lifecycle::powershell-noninteractive-flag
      - id: micro-behaviors/process/create/subprocess/launch::process-execution
  # Python source is sometimes deliberately stored under a benign text/data
  # extension and executed through pythonw.exe. Filename-driven classification
  # then cannot emit Python symbols, so retain the complete native-memory call
  # chain using strict source syntax: RWX allocation, byte copy, and handoff to
  # a function pointer. The three-operation chain is the intent signal; none of
  # the individual ctypes operations is treated as hostile on its own.
