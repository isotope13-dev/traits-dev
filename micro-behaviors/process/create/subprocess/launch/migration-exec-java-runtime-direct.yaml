# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  attack: T1059
traits:
- id: java-runtime-exec-source
  desc: Source references JVM Runtime.exec() execution
  conf: 0.8
  for:
  - source
  - class
  - xml
  - jsp
  - html
  - javascript
  - python
  - makefile
  - shell
  if:
    type: text
    regex: '\bRuntime\s*\.\s*getRuntime\s*\(\s*\)\s*\.\s*exec\s*\('
