# Start-Job starts a PowerShell background job.
# Its command form does not require inline source.
defaults:
  platforms: [windows, unix]
  for: [powershell]

traits:
  - id: powershell-start-job-call
    desc: Invokes PowerShell background job creation
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(?i)^Start-Job$'
