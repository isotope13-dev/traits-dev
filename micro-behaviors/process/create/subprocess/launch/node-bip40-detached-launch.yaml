traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  id: node-spawn-or-fork-call
  desc: spawn or fork invocation text
  crit: notable
  conf: 0.98
  if:
    # Unbound call text also occurs in browser graph libraries. This is a
    # process-launch clue, not proof of a Node child_process invocation.
    type: text
    regex: \b(spawn|fork)\s*\(
    exclude_comments: true
