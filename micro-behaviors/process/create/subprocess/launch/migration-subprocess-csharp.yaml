# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  platforms:
  - windows
  - unix
  for:
  - csharp
  crit: notable
traits:
- id: dotnet-process-start
  desc: Process execution via Process.Start
  conf: 0.95
  if:
    type: symbol
    kind: call
    regex: (^|\.)Process\.Start$
  unless:
  - id: micro-behaviors/process/create/shell/command-mode::csharp-cmd-command-text
  - id: well-known/game/mod::bedrockboot-source-repository
