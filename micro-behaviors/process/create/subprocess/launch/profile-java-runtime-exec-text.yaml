# Match a Runtime.getRuntime() assignment followed by an exec() invocation.
# The pattern does not require the two variable names to be the same.
defaults:
  platforms: [unix, windows]
  for: [jsp, java, kotlin, html]
  crit: notable
  conf: 0.92
traits:
  - id: java-runtime-bound-local-exec
    desc: Java Runtime assignment and exec call text
    if:
      type: text
      regex: '(?s)Runtime\s+\w+\s*=\s*Runtime\.getRuntime\(\)\s*;[^}]{0,400}\b\w+\.exec\s*\('
      exclude_html_comments: true
