# Detects a source-level response-to-script execution attempt. Tempfile.new
# ignores its block in Ruby; Tempfile.create yields a file. This finding does
# not establish successful execution or a top-level invocation.
defaults:
  for:
  - ruby
  platforms:
  - unix
  - windows
traits:
- id: ruby-http-body-script-subprocess-flow
  desc: Attempts response-body script execution
  crit: suspicious
  conf: 0.99
  if:
    type: tree-sitter
    query: "((_ (method name: (identifier) @executor\n    parameters: (method_parameters (identifier) @language\
      \ (identifier) @source)\n    body: (body_statement\n      (assignment left: (identifier) @script right: (case\n\
      \        (when body: (then (identifier) @selected_source))))\n      (call receiver: (constant) @tempfile method:\
      \ (identifier) @new\n        block: (do_block parameters: (block_parameters (identifier) @temporary)\n   \
      \       body: (body_statement\n            (call receiver: (identifier) @writer method: (identifier) @write\n\
      \              arguments: (argument_list (identifier) @written_source))\n            (assignment left: (identifier)\
      \ @command right: (string\n              (interpolation (identifier)) (string_content)\n              (interpolation\
      \ (call receiver: (identifier) @path_owner method: (identifier) @path))))\n            (begin (assignment\
      \ right: (call receiver: (constant) @open3 method: (identifier) @capture\n              arguments: (argument_list\
      \ (hash) (identifier) @executed)))))))))\n  (method body: (body_statement (begin\n    (assignment left: (identifier)\
      \ @response right: (call receiver: (identifier) @http method: (identifier) @get))\n    (call method: (identifier)\
      \ @dispatch arguments: (argument_list (identifier)\n      (call receiver: (identifier) @body_owner method:\
      \ (identifier) @body)))))))\n  (#eq? @source @selected_source) (#eq? @tempfile \"Tempfile\") (#eq? @new \"\
      new\")\n  (#eq? @temporary @writer) (#eq? @write \"write\") (#eq? @script @written_source)\n  (#eq? @temporary\
      \ @path_owner) (#eq? @path \"path\")\n  (#eq? @open3 \"Open3\") (#match? @capture \"^capture[23e]+$\") (#eq?\
      \ @command @executed)\n  (#eq? @get \"get\") (#eq? @executor @dispatch) (#eq? @response @body_owner) (#eq?\
      \ @body \"body\"))\n((_ (method body: (body_statement (begin\n    (assignment left: (identifier) @response\
      \ right: (call receiver: (identifier) @http method: (identifier) @get))\n    (call method: (identifier) @dispatch\
      \ arguments: (argument_list (identifier)\n      (call receiver: (identifier) @body_owner method: (identifier)\
      \ @body))))))\n  (method name: (identifier) @executor\n    parameters: (method_parameters (identifier) @language\
      \ (identifier) @source)\n    body: (body_statement\n      (assignment left: (identifier) @script right: (case\n\
      \        (when body: (then (identifier) @selected_source))))\n      (call receiver: (constant) @tempfile method:\
      \ (identifier) @new\n        block: (do_block parameters: (block_parameters (identifier) @temporary)\n   \
      \       body: (body_statement\n            (call receiver: (identifier) @writer method: (identifier) @write\n\
      \              arguments: (argument_list (identifier) @written_source))\n            (assignment left: (identifier)\
      \ @command right: (string\n              (interpolation (identifier)) (string_content)\n              (interpolation\
      \ (call receiver: (identifier) @path_owner method: (identifier) @path))))\n            (begin (assignment\
      \ right: (call receiver: (constant) @open3 method: (identifier) @capture\n              arguments: (argument_list\
      \ (hash) (identifier) @executed))))))))))\n  (#eq? @source @selected_source) (#eq? @tempfile \"Tempfile\"\
      ) (#eq? @new \"new\")\n  (#eq? @temporary @writer) (#eq? @write \"write\") (#eq? @script @written_source)\n\
      \  (#eq? @temporary @path_owner) (#eq? @path \"path\")\n  (#eq? @open3 \"Open3\") (#match? @capture \"^capture[23e]+$\"\
      ) (#eq? @command @executed)\n  (#eq? @get \"get\") (#eq? @executor @dispatch) (#eq? @response @body_owner)\
      \ (#eq? @body \"body\"))\n"
