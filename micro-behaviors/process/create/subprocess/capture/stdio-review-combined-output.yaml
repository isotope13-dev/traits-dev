defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]
traits:
  - id: go-binary-combined-output-reference
    desc: Go Cmd.CombinedOutput implementation reference
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'os/exec.(*Cmd).CombinedOutput'
  # Garble renames packages and receivers but retains exported method names.
  - id: go-binary-renamed-combined-output-reference
    desc: Go CombinedOutput method name reference
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\.\(\*[A-Za-z0-9_]{1,40}\)\.CombinedOutput'
    unless:
      - id: go-binary-combined-output-reference
