defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  mbc: "E1059"
  attack: "T1059.004"

composite_rules:
  - id: php-piped-proc-open-runner
    desc: proc_open pipes input and output
    crit: suspicious
    conf: 0.93
    near_lines: 25
    all:
      - id: micro-behaviors/process/create/subprocess/launch::proc-open
      - id: micro-behaviors/process/fd/stdio::php-stdio-pipe-pair
      - id: micro-behaviors/fs/read/stream::php-fread-indexed-resource
