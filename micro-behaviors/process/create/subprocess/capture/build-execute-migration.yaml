defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
composite_rules:
  - id: rust-build-rs-command-output
    desc: build.rs captures command output
    crit: component
    conf: 0.88
    for:
      - rust
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: metadata/lang/source/syntax/call/relationship::rust-command-output
