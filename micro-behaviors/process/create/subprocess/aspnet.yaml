defaults:
  platforms:
  - windows
  for:
  - html
  - csharp
  - asp
traits:
- id: dotnet-source-process-instance-start
  desc: .NET source creates and starts Process
  crit: notable
  conf: 0.92
  for:
  - asp
  - csharp
  - text
  if:
    type: text
    regex: (?is)new\s+(System\.Diagnostics\.)?Process\s*\(\s*\)[\s\S]{0,500}\.Start\s*\(
- id: aspnet-source-process-static-start
  desc: ASP.NET source starts a configured .NET process
  crit: notable
  conf: 0.92
  for:
  - asp
  if:
    type: text
    regex: (?i)\bProcess\s*\.\s*Start\s*\(\s*[A-Za-z_$][\w$]*
