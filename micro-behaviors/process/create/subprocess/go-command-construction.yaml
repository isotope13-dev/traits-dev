traits:
- id: go-powershell-command
  desc: Constructs a Go PowerShell child command
  crit: notable
  conf: 0.96
  platforms: [windows, unix]
  for: [go]
  if:
    type: symbol
    kind: call
    exact: exec.Command
    arg:
      index: 0
      kind: string
      exact: powershell
- id: go-powershell-launch-call
  desc: Executes a Go PowerShell child command
  crit: notable
  conf: 0.96
  platforms: [windows, unix]
  for: [go]
  if:
    type: symbol
    kind: call
    regex: '^(os/)?exec\.Command\.(Run|Start|Output|CombinedOutput)$'
    receiver:
      from:
        call: '^os/exec\.Command$'
        argument: 0
        literal: '^powershell$'
- crit: notable
  platforms:
  - unix
  - windows
  id: go-exec-command-call
  desc: Constructs a Go exec.Command child command
  conf: 0.85
  for:
  - go
  if:
    type: symbol
    kind: call
    exact: exec.Command
- platforms:
  - windows
  - linux
  - macos
  for:
  - go
  crit: notable
  conf: 0.95
  id: go-exec-command-context
  desc: Go constructs a context-bound child command
  if:
    type: symbol
    exact: exec.CommandContext
- platforms:
  - linux
  for:
  - elf
  crit: notable
  id: go-compiled-exec-command-reference
  desc: Compiled Go os/exec.Command implementation
  conf: 0.97
  if:
    type: function
    exact: sym.go.os_exec.Command
