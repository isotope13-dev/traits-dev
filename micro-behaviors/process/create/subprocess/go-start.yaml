defaults:
  platforms: [windows, unix]
  for: [go]

traits:
  - id: go-command-start
    desc: Go starts an exec.Command process
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '\.Start$'
      receiver:
        from:
          call: '^os/exec\.Command(Context)?$'

  - id: go-command-launch
    desc: Go runs a constructed exec.Command process
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '\.(Start|Run|Output|CombinedOutput)$'
      receiver:
        from:
          call: '^os/exec\.Command(Context)?$'
