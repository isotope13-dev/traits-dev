defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

composite_rules:
  - id: py-staged-config-launch
    desc: Python Popen beside stage0 and config64 arguments
    crit: notable
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/process/create/subprocess::popen-ast
      - id: micro-behaviors/process/argument/subcommand::stage0-task-argument
      - id: micro-behaviors/process/argument/option::inline-config64-flag
