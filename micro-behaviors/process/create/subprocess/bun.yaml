# Bun runtime process-creation capabilities.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  mbc: C0017
  attack: T1059.007

traits:
  - id: bun-spawn-call
    desc: Bun spawns an external process
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: Bun.spawn
