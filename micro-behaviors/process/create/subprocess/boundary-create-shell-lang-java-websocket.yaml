defaults:
  crit: notable
  platforms: [windows, unix]
  for: [jsp, python, java, class]
  mbc: C0017
  attack: T1059

traits:
- id: runtime-exec-with-shell-array
  desc: Runtime.exec receives a new string array
  conf: 0.88
  if:
    type: text
    regex: Runtime\.getRuntime\(\)\.exec\s*\(new\s+String\[\]

composite_rules:
- id: java-shell-exec-with-capture
  desc: Java Runtime.exec argument-array reference
  conf: 0.9
  all:
  - id: micro-behaviors/process/create/subprocess::runtime-exec-with-shell-array
  any:
  - id: micro-behaviors/fs/path/application/interpreter::runtime-exec-bash-c
  - id: micro-behaviors/process/create/shell/command-string::runtime-exec-cmd-c
  - id: micro-behaviors/process/stdio/read::process-get-input-stream
