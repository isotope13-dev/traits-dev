defaults:
  for: [ruby]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: ruby-popen
    desc: Ruby popen variant creates a child process
    conf: 0.92
    if:
      # Migrated from a tree-sitter query to a `kind: call` match on
      # the pre-extracted call fact (no per-member cursor walk).
      type: symbol
      kind: call
      regex: '^popen[23]?$'
