defaults:
  platforms: [windows, unix]
  for: [rust]
  crit: notable

traits:
  - id: rust-command-status-call
    desc: Rust Command runs child synchronously
    conf: 0.92
    if:
      type: text
      regex: 'Command::new[\s\S]{0,240}\.status\s*\('

  - id: rust-command-curl-wget
    desc: Constructs curl or wget process command
    conf: 0.92
    if:
      type: text
      regex: 'Command::new\s*\(\s*"(curl|wget)"'

