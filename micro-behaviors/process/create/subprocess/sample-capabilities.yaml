composite_rules:
- id: http-tempfile-subprocess-cooccurrence
  desc: HTTP GET, tempfile and subprocess co-occur
  conf: 0.9
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/lib/requests::requests-get
  - id: micro-behaviors/fs/temp/mktemp::python-tempfile
  any:
  - id: micro-behaviors/process/create/subprocess::run-content
  - id: micro-behaviors/process/create/subprocess::call-ast
  - id: micro-behaviors/process/create/subprocess::popen-content
  - id: micro-behaviors/process/create/subprocess::popen-ast
- id: setup-py-subprocess
  desc: Setup script contains subprocess creation
  conf: 0.85
  all:
  - id: metadata/package/files/included::setup-py-basename
  any:
  - id: micro-behaviors/process/create/subprocess::popen-ast
  - id: micro-behaviors/process/create/subprocess::run-ast
  - id: micro-behaviors/process/create/subprocess::call-ast
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
