# Parsed call sites, excluding imports and documentation references.
defaults:
  for: [python]
  platforms: [windows, unix]
  crit: component
  conf: 0.9
composite_rules:
  - id: python-subprocess-launch-calls
    desc: Python subprocess launch call sites
    any:
      - id: popen-ast
      - id: run-ast
      - id: call-ast
      - id: check-output-ast
      - id: check-call-ast
