# These facts can occur in different members. They establish neither the
# subprocess target nor reachability from the declared console entry point.
# Pipenv, for example, ships distlib launcher templates and launches the user's
# shell with subprocess.call. Retain the observations without inferring a loader.
defaults:
  platforms: [windows]
  for: [whl, python, text, pe]

composite_rules:
  - id: python-wheel-console-executable-process-clues
    desc: Wheel has console entry, EXE member and subprocess.call
    crit: notable
    conf: 0.95
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::console-header-in-entry-points-file
      - id: metadata/package/files/included::exe-extension-basename
      - id: micro-behaviors/process/create/subprocess/launch::call-ast
    unless:
      - id: well-known/lib/ai/coding-assistant::bundled-copilot-lsp-path
