defaults:
  crit: component
  platforms: [unix, windows]
  for: [go]
composite_rules:
  - id: go-interpreter-near-source-text
    desc: Go interpreter near source-name text
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/subprocess/configure::go-inline-interpreter-command
    any:
      - id: metadata/lang/source/naming/source-text::generated-source-identifier-text
    near_bytes: 1200
