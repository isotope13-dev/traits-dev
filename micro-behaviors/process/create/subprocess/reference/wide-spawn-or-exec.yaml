defaults:
  for: ["pe", "dll"]
  platforms: ["windows"]
composite_rules:
  - id: wide-spawn-or-exec
    desc: Wide spawn or exec symbol reference
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/process/create/native-symbol::wspawnl
      - id: micro-behaviors/process/create/native-symbol::wspawnvpe
      - id: micro-behaviors/process/replace::wexecve
