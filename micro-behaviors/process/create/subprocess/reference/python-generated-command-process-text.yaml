defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-generated-command-process-text
    desc: Python process call names generated input
    conf: 0.95
    if:
      type: text
      regex: '(?is)\bsubprocess\.run\s*\([^)]{0,180}\b(generated_command|model_response)\b'
