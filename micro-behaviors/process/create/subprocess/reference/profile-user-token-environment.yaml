defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: user-token-process-environment-references
    desc: Token process and environment API references
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/process/create/native-symbol::create-process-with-token
      - id: micro-behaviors/os/env/write::create-environment-block
      - id: micro-behaviors/os/privilege/token/adjust::privilege-adjustment-or-runas-api-references
    any:
      - id: micro-behaviors/os/env/release::destroy-environment-block
      - id: micro-behaviors/os/privilege/token/use::open-thread-token-any
      - id: micro-behaviors/os/privilege/token/use::get-token-information-any
