---
defaults:
  platforms:
  - windows
  for:
  - scripts
  - source
  - class
  - java_class
composite_rules:
- id: jvm-url-file-api-exec-context
  desc: JVM cmd exec with file and URL references
  crit: notable
  conf: 0.99
  for:
  - class
  - java_class
  all:
  - id: micro-behaviors/process/argument/interpreter::java-cmd-exe-c-bytecode-clues
  - id: micro-behaviors/fs/path/extension::java-executable-reference
  - id: metadata/import/jvm::jvm-nio-file-class-reference
  - id: micro-behaviors/communications/url/host/domain-http::http-url-binary
- id: jvm-file-api-url-exec-context
  desc: JVM exec with file-API and URL references
  crit: notable
  conf: 0.99
  for:
  - class
  - java_class
  platforms:
  - unix
  - macos
  all:
  - id: metadata/import/jvm::jvm-nio-file-class-reference
  - id: metadata/import/jvm::java-runtime-exec-bytecode-reference
  - id: micro-behaviors/communications/url/host/domain-http::http-url-binary
