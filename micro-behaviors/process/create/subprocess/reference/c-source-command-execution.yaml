defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: T1059.004

composite_rules:
  - id: c-source-command-execution
    desc: C source command execution evidence
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/process/create/shell/interpreter::c-system-call
      - id: micro-behaviors/process/replace::c-exec-family-source
      - id: micro-behaviors/process/create/shell/variable-command::c-computed-command-execution
      - id: micro-behaviors/process/create/shell/interpreter::c-shell-execution-path
