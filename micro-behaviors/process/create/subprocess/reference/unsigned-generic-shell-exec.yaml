defaults:
  crit: notable
  for: [macho]
  platforms: [macos, ios]
composite_rules:
  - id: unsigned-generic-shell-exec
    desc: Unsigned generically named Mach-O with system API clues
    crit: notable
    conf: 0.95
    all:
      - id: metadata/signature/absent::unsigned-macho
      - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
    any:
      - id: metadata/filename/identity::generic-executable-name-1
      - id: metadata/filename/identity::generic-executable-name-2
