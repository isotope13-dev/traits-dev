defaults:
  platforms: [unix, windows]
  for: [binaries]
composite_rules:
  - id: binary-process-execution
    desc: Native binary references process execution APIs
    crit: notable
    conf: 0.85
    any:
      - id: metadata/binary/symbols/name/process::execve-import
      - id: metadata/binary/symbols/name/process::fexecve-import
      - id: metadata/binary/symbols/name/process::posix-spawn-import
      - id: micro-behaviors/process/replace::c-exec-variants
      - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
      - id: micro-behaviors/process/create/exec::create-process-api-name
