defaults:
  crit: notable
  for: [macho]
  platforms: [macos, ios]
composite_rules:
  - id: generic-bundle-shell-or-daemon-apis
    desc: Generic bundle identifier with shell or daemon APIs
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/bundle::generic-bundle-id-pattern
    any:
      - id: metadata/binary/symbols/name/process::c-popen
      - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
      - id: micro-behaviors/process/daemonize/detach::fork-new-session
    unless:
      - id: metadata/signature/verified/platform::apple
