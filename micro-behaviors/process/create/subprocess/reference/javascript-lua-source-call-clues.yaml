defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: notable
composite_rules:
  - id: javascript-lua-source-call-clues
    desc: Lua process near source-argument call
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/process/interpreter/lua::javascript-interpreter-name
      - id: micro-behaviors/process/create/exec::source-or-response-call-text
    near_bytes: 600
