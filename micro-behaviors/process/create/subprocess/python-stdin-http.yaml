# A Python interpreter launched with its program on stdin. The HTTP variant
# observes response handling in the same file; its matcher does not connect
# response bytes to the child's stdin pipe.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006
  mbc: E1059

composite_rules:
  - id: python-http-response-with-stdin-interpreter
    desc: HTTP response with a stdin Python child
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/subprocess::sys-executable-stdin-subprocess
      - id: micro-behaviors/communications/http/client/response-body/
    any:
      - id: micro-behaviors/process/create/subprocess::subprocess-detached-session
      - id: micro-behaviors/process/create/subprocess::subprocess-suppresses-stdio
      - id: micro-behaviors/communications/http/url/encoded::base64-decoded-http-url

  - id: python-detached-stdin-interpreter-spawn
    desc: Detached Python child reads stdin
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/process/create/subprocess::sys-executable-stdin-subprocess
      - id: micro-behaviors/process/create/subprocess::subprocess-detached-session
      - id: micro-behaviors/process/create/subprocess::subprocess-suppresses-stdio
