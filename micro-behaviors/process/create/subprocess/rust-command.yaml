defaults:
  platforms: [windows, unix]
  for: [rust, elf, pe, macho]
  crit: notable

traits:

  - id: rust-command-new-call
    desc: Constructs a Rust process command
    crit: notable
    conf: 0.85
    if:
      type: symbol
      regex: '^(std|tokio)::process::Command::new$|^async_process::Command::new$'
