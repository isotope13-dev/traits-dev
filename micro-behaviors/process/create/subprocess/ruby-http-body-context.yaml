defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-http-body-script-subprocess-flow
    desc: Runs HTTP response as a temporary script
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((_ (method name: (identifier) @executor
            parameters: (method_parameters (identifier) @language (identifier) @source)
            body: (body_statement
              (assignment left: (identifier) @script right: (case
                (when body: (then (identifier) @selected_source))))
              (call receiver: (constant) @tempfile method: (identifier) @new
                block: (do_block parameters: (block_parameters (identifier) @temporary)
                  body: (body_statement
                    (call receiver: (identifier) @writer method: (identifier) @write
                      arguments: (argument_list (identifier) @written_source))
                    (assignment left: (identifier) @command right: (string
                      (interpolation (identifier)) (string_content)
                      (interpolation (call receiver: (identifier) @path_owner method: (identifier) @path))))
                    (begin (assignment right: (call receiver: (constant) @open3 method: (identifier) @capture
                      arguments: (argument_list (hash) (identifier) @executed)))))))))
          (method body: (body_statement (begin
            (assignment left: (identifier) @response right: (call receiver: (identifier) @http method: (identifier) @get))
            (call method: (identifier) @dispatch arguments: (argument_list (identifier)
              (call receiver: (identifier) @body_owner method: (identifier) @body)))))))
          (#eq? @source @selected_source) (#eq? @tempfile "Tempfile") (#eq? @new "new")
          (#eq? @temporary @writer) (#eq? @write "write") (#eq? @script @written_source)
          (#eq? @temporary @path_owner) (#eq? @path "path")
          (#eq? @open3 "Open3") (#match? @capture "^capture[23e]+$") (#eq? @command @executed)
          (#eq? @get "get") (#eq? @executor @dispatch) (#eq? @response @body_owner) (#eq? @body "body"))
        ((_ (method body: (body_statement (begin
            (assignment left: (identifier) @response right: (call receiver: (identifier) @http method: (identifier) @get))
            (call method: (identifier) @dispatch arguments: (argument_list (identifier)
              (call receiver: (identifier) @body_owner method: (identifier) @body))))))
          (method name: (identifier) @executor
            parameters: (method_parameters (identifier) @language (identifier) @source)
            body: (body_statement
              (assignment left: (identifier) @script right: (case
                (when body: (then (identifier) @selected_source))))
              (call receiver: (constant) @tempfile method: (identifier) @new
                block: (do_block parameters: (block_parameters (identifier) @temporary)
                  body: (body_statement
                    (call receiver: (identifier) @writer method: (identifier) @write
                      arguments: (argument_list (identifier) @written_source))
                    (assignment left: (identifier) @command right: (string
                      (interpolation (identifier)) (string_content)
                      (interpolation (call receiver: (identifier) @path_owner method: (identifier) @path))))
                    (begin (assignment right: (call receiver: (constant) @open3 method: (identifier) @capture
                      arguments: (argument_list (hash) (identifier) @executed))))))))))
          (#eq? @source @selected_source) (#eq? @tempfile "Tempfile") (#eq? @new "new")
          (#eq? @temporary @writer) (#eq? @write "write") (#eq? @script @written_source)
          (#eq? @temporary @path_owner) (#eq? @path "path")
          (#eq? @open3 "Open3") (#match? @capture "^capture[23e]+$") (#eq? @command @executed)
          (#eq? @get "get") (#eq? @executor @dispatch) (#eq? @response @body_owner) (#eq? @body "body"))
