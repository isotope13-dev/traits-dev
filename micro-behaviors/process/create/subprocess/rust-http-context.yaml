defaults:
  platforms: [unix]
  for: [rust]
  attack: T1106

traits:
  - id: rust-dropper-deploy-path
    desc: Rust payload path reference
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: /deploy/payload

  - id: rust-dropper-nohup-spawn
    desc: Rust nohup process launch
    crit: notable
    conf: 0.94
    unless:
      - id: well-known/tool/development/agent/openai-codex/
    if:
      type: text
      substr: Command::new("nohup")

composite_rules:
  - id: rust-http-download-execute
    desc: Rust payload path, chmod and nohup process context
    crit: suspicious
    conf: 0.94
    all:
      - id: rust-dropper-deploy-path
      - id: micro-behaviors/fs/chmod/executable/mode::permissions-from-mode-755
      - id: rust-dropper-nohup-spawn
