defaults:
  platforms: [unix, windows]
  crit: notable
  for: [python]

composite_rules:
  - id: setuptools-build-hook-subprocess
    desc: Setuptools override and subprocess co-occur
    conf: 0.95
    any:
      - id: metadata/build/package/recipe/setup-hooks::setuptools-build-ext-override
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-build-py
      - id: metadata/build/package/recipe/setup-hooks::setuptools-install-lib-override
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-develop
    all:
      - id: micro-behaviors/process/create/subprocess::process-execution
    downgrade:
      any:
        - id: metadata/build/pip::pyproject-hooks-in-process-script
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/build/pip::python-packaging-tool-tests
      - id: well-known/lib/format/tinyusdz::tinyusdz-cmake-build-context
      - id: metadata/package/files/dependency::native-vendor-dependency-path
      - id: metadata/build/package/recipe/setup-hooks::setuptools-native-extension-build-context
      - id: metadata/build/package/recipe/setup-hooks::setuptools-native-extension-local-version-context
      - id: metadata/build/package/recipe/setup-hooks::setuptools-cmake-native-extension-context

      - id: "metadata/file/naming::test-directory-component"
