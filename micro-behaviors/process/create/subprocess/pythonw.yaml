composite_rules:
- platforms:
  - windows
  for:
  - python
  id: pythonw-windowless-subprocess-code
  desc: Pythonw reference near windowless subprocess code
  crit: notable
  conf: 0.96
  near_lines: 30
  all:
  - id: micro-behaviors/fs/path/application/executable::pythonw-executable-reference
  - id: micro-behaviors/process/create/subprocess::process-execution
  any:
  - id: micro-behaviors/process/create/flags::python-or-create-no-window-hex
  - id: micro-behaviors/process/create/flags::python-create-no-window-hex
  - id: micro-behaviors/process/create/flags::python-create-no-window-getattr
  - id: micro-behaviors/process/create/flags::creationflags
  - id: micro-behaviors/process/create/flags::python-qualified-create-no-window
