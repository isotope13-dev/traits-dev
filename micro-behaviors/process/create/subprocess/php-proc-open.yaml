defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
- id: proc-open
  desc: Process execution via proc_open()
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: "proc_open"

- id: proc-open-variable-argument
  desc: proc_open() receives variable argument
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: proc_open
    arg:
      index: 0
      kind: identifier
