# Three nearby observations support a Python HTTP/write/launch profile, but
# neither response-to-file nor file-to-launch identity is established.
defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-http-wrapper-write-launch-profile
    desc: Python HTTP wrapper, response write and launch clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/request/client::python-execute-call-before-requests-request
      - id: micro-behaviors/fs/write/file/response-body::python-http-response-write-exec-profile
      - id: micro-behaviors/process/deploy::download-chmod-launch
