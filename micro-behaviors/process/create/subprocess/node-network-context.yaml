defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: obfuscated-exe-download-hidden-detached-spawn
  desc: Obfuscated executable URL and hidden process context
  crit: suspicious
  conf: 0.98
  attack: T1027,T1059.007,T1105,T1564.003
  all:
  - id: micro-behaviors/process/create/variable-spawn::spawn-destination-variable
  - id: micro-behaviors/process/create/spawn::windowshide-obfuscated-true
  - id: micro-behaviors/process/daemonize/detach::detached-obfuscated-true
  - id: micro-behaviors/communications/http/download/url::executable-url-reference
  any:
  - id: micro-behaviors/communications/http/request/computed::js-computed-http-object-call
  - id: micro-behaviors/communications/http/download/handler::node-url-destination-download-call
  unless:
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
- id: fetch-write-exec
  desc: JavaScript fetch/write with subprocess activity
  crit: notable
  conf: 0.9
  near_lines: 30
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/fs/write/file/full::js-file-write
  any:
  - id: micro-behaviors/process/create/system::js-execfile-call
  - id: micro-behaviors/process/create/variable-spawn::spawn-variable-program
  downgrade:
    any:
    - id: micro-behaviors/process/interpreter/vm/
    - id: micro-behaviors/os/package-manager/publish/
    - id: micro-behaviors/data/archive/extract/tar::node-spawn-tar-extract
  unless:
  - id: micro-behaviors/process/create/spawn::auto-retry-helper
  - id: well-known/lib/testing/
  - id: well-known/tool/detection/codetotal::codetotal-local-docker-runner
  - id: well-known/app/infrastructure/netlify::official-js-github-release-bootstrap
  - id: well-known/lib/platform/browser-automation/
  - id: micro-behaviors/communications/http/url/path::loopback-client-url-cooccurrence
- id: fetch-write-exec-delete
  desc: JavaScript fetch/write process context
  crit: suspicious
  conf: 0.92
  near_lines: 40
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/fs/write/file/full::js-file-write
  - id: micro-behaviors/fs/delete/file/
  any:
  - id: micro-behaviors/process/create/system::js-execfile-call
  - id: micro-behaviors/process/create/variable-spawn::spawn-variable-program
  # Same as fetch-write-exec: when the launched process is tar unpacking the
  # fetched archive (and the archive is cleaned up afterwards), the chain is
  # a dependency installer, not a fetched program being run.
  downgrade:
    any:
    - id: micro-behaviors/data/archive/extract/tar::node-spawn-tar-extract
  unless:
  - id: well-known/tool/development/agent/anthropic-claude-agent/
  - id: well-known/app/infrastructure/pulumi::pulumi-source-tree
  - id: micro-behaviors/process/create/launch::node-detached-os-default-handler-spawn
- id: package-temp-response-exec-delete
  for:
  - javascript
  - typescript
  - npm
  - tar
  - package.json
  desc: Package temp response process context
  crit: suspicious
  conf: 0.99
  attack: T1105,T1059.007,T1195.002,T1070.004
  scope: archive
  near_bytes: 8192
  all:
  - id: micro-behaviors/communications/http/request/client::js-fetch-call
  - id: micro-behaviors/fs/write/file/full::node-write-file-promise
  - id: micro-behaviors/process/create/shell/bridge::js-exec
  - id: micro-behaviors/fs/delete/file/library::node-fs-promises-unlink
  - id: micro-behaviors/fs/path/temp::node-os-tmpdir
  - id: metadata/package/entrypoint::pkg-main-field
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/detection/
  - id: "metadata/file/naming::test-directory-component"
