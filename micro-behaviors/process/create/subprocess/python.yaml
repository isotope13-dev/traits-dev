defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.006
traits:
# Received data reaching argv can be a command or an ordinary data argument to
# a fixed executable. Preserve the linked operation without inferring a backdoor
# from unrelated connect, subprocess and send calls elsewhere in the file.
- id: recv-input-argument
  desc: Subprocess arguments use data returned by recv
  crit: notable
  conf: 0.98
  mbc: C0017
  if:
    type: symbol
    kind: call
    regex: '^subprocess\.(run|Popen|call)$'
    arg:
      index: 0
      from:
        call: '(^|\.)recv$'
        through:
        - call: '\.decode$'
          receiver: true
        - call: '\.strip$'
          receiver: true
- id: python-isolated-source-run
  desc: Runs staged source in isolated Python
  crit: notable
  conf: 0.94
  mbc: "C0017"
  if:
    type: text
    regex: '(?s)subprocess\.run\(\s*\[\s*sys\.executable.{0,240}["'']-I["''].{0,240}\btmp\b'
- id: subprocess-shell-cwd-options
  desc: Subprocess sets shell or working directory
  crit: notable
  conf: 0.9
  mbc: "C0017"
  if:
    type: tree-sitter
    kind: call
    regex: '(?s)\bsubprocess\.(run|Popen|call)\s*\([^)]{0,700}\b(shell|cwd)\s*='
  unless:
  - id: well-known/tool/detection/security-scanner::code-pattern-catalog
- id: variable-command-argument
  desc: Subprocess runs a variable-held command
  crit: notable
  conf: 0.95
  mbc: "E1059.006"
  if:
    type: symbol
    kind: call
    regex: '^subprocess\.(run|Popen|call)$'
    arg:
      index: 0
      kind: identifier
  unless:
  - id: well-known/tool/development/qt/
- id: call-touch-argv
  desc: subprocess.call launches touch argv
  crit: notable
  conf: 0.94
  mbc: "E1059.006"
  if:
    type: text
    regex: 'subprocess\.call\(\s*(\[\s*)?["'']touch["'']'
- id: build-extension-subprocess-popen
  desc: Python build extension invokes Popen
  crit: notable
  conf: 0.9
  mbc: "E1059.006"
  if:
    type: text
    regex: '(\bcmdclass\b|\bbuild_ext\b)[\s\S]{0,500}subprocess\.Popen'
- id: check-output
  desc: subprocess.check_output call
  crit: notable
  conf: 0.8
  mbc: "E1059.006"
  for: [python, text]
  if:
    type: text
    substr: "subprocess.check_output("
  unless:
  - id: metadata/build/toolchain::xcode-platform-args-build-context
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - type: text
    regex: subprocess\.check_output\(\s*\[\s*["']wslpath["']
  - type: basename
    regex: '^(common_ship|ship|make_msvc_package)\.py$'
- id: pyc-check-output-call
  desc: Python bytecode references check_output
  crit: notable
  conf: 0.9
  mbc: "E1059.006"
  for: [pyc]
  if:
    type: text
    word: check_output
- id: popen-ast
  desc: Launches a process with subprocess.Popen
  crit: notable
  conf: 0.85
  mbc: "C0017"
  if:
    type: symbol
    kind: call
    regex: '^(subprocess\.)?Popen$'
- id: qualified-popen-call
  desc: Calls a qualified Popen constructor
  crit: notable
  conf: 0.9
  mbc: "C0017"
  if:
    type: symbol
    kind: call
    regex: '^[A-Za-z_][A-Za-z0-9_]*\.Popen$'
  unless:
    # The canonical spelling already has the sharper `popen-ast` finding.
    # This atom covers module aliases such as `_sp.Popen(...)` without
    # reporting the same call twice.
  - id: popen-ast
- id: popen-pipe-communicate
  desc: Popen with PIPE stdio then communicate()
  crit: notable
  conf: 0.8
  mbc: "C0017"
  for: [python, pyc]
  if:
    type: raw
    regex: Popen.{0,24}PIPE.{0,24}communicate
- id: run-ast
  desc: Calls subprocess.run to launch a process
  crit: notable
  conf: 0.85
  mbc: "C0017"
  if:
    # Use the parser's normalized call fact so multiline argv lists are
    # recognized consistently; the previous tree-sitter regex depended on
    # source formatting and missed ordinary health-check wrappers.
    type: symbol
    kind: call
    exact: subprocess.run
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: well-known/tool/detection/security-remediation::compiled-remediation-catalog
  - id: well-known/tool/detection/security-scanner::code-pattern-catalog
- id: subprocess-run-sys-executable
  desc: subprocess.run relaunches Python interpreter
  crit: notable
  conf: 0.92
  mbc: C0017
  if:
    type: text
    regex: 'subprocess\.run\s*\(\s*\[\s*sys\.executable\s*,'
- id: python-binary-path-argv-proxy
  desc: Python wrapper forwards arguments to a binary
  crit: notable
  conf: 0.9
  mbc: "C0017"
  if:
    type: text
    # Any argv list head: the wrapped binary's variable name is the author's
    # choice, while `[...] + sys.argv[1:]` is the forwarding itself.
    regex: 'subprocess\.(run|call|Popen)\(\s*\[[^\]\n]{1,60}\]\s*\+\s*sys\.argv\[1:\]'
- id: call-ast
  desc: Runs a process with subprocess.call
  crit: notable
  conf: 0.85
  mbc: "C0017"
  if:
    type: symbol
    kind: call
    exact: subprocess.call
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: check-output-ast
  desc: subprocess.check_output call
  crit: notable
  conf: 0.85
  mbc: "C0017"
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: well-known/app/system/archlinux-kernel::versioned-lts-update-helper
  - id: metadata/build/toolchain::xcode-platform-args-build-context
  if:
    type: symbol
    kind: call
    exact: subprocess.check_output
- id: check-call-ast
  desc: subprocess.check_call call
  crit: notable
  conf: 0.85
  mbc: "C0017"
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: well-known/app/system/archlinux-kernel::versioned-lts-update-helper
  if:
    type: symbol
    kind: call
    exact: subprocess.check_call
- id: run-content
  desc: Calls subprocess.run
  crit: notable
  conf: 0.75
  mbc: "E1059.006"
  for: [python, text]
  if:
    type: text
    # Raw-text fallback for source the parser cannot recover. Anchor to an
    # executable line so commented examples are not reported as process calls.
    regex: '(?m)^[ \t]*([A-Za-z_]\w*[ \t]*=[ \t]*)?(await[ \t]+)?subprocess\.run\('
  # Prefer the structured call finding when parsing succeeds; retain this
  # text matcher only as a fallback for malformed or embedded source.
  unless:
  - id: run-ast
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
  - id: well-known/tool/detection/agentskillmap/
- id: popen-content
  desc: Calls subprocess.Popen
  crit: notable
  conf: 0.75
  mbc: "E1059.006"
  for: [python, text]
  if:
    type: text
    substr: "subprocess.Popen("
  unless:
  - id: popen-ast
  - type: text
    regex: subprocess\.Popen\(\s*\[\s*["']open["']
  - type: text
    regex: subprocess\.Popen\(\s*\[\s*["']xdg-open["']
  - type: text
    regex: subprocess\.Popen\(\s*\[\s*["']explorer\.exe["']
- id: check-call-content
  desc: Calls subprocess.check_call
  crit: notable
  conf: 0.75
  mbc: "E1059.006"
  for: [python, text]
  if:
    type: text
    substr: "subprocess.check_call("
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: well-known/app/system/archlinux-kernel::versioned-lts-update-helper
  - type: basename
    regex: '^(ship|make_msvc_package)\.py$'
- id: python-interpreter-variable-code-argument
  desc: Variable Python interpreter gets inline code
  crit: notable
  conf: 0.92
  mbc: "E1059.006"
  # The interpreter and the code are both non-literal. The code slot accepts a
  # bare variable (`, code ]`) or an inline call -- `base64.b64decode(x).decode()`
  # -- which is the shape a one-line stager uses to run a decoded blob through
  # `python -c` without ever binding it to a name.
  if:
    type: text
    regex: '\[\s*[A-Za-z_]\w*\s*,\s*["'']-[cC]["'']\s*,\s*[A-Za-z_][\w.]*\s*[(\[A-Za-z_0-9]'
- id: python-interpreter-file-argument
  desc: Python interpreter receives file variable
  crit: notable
  conf: 0.92
  mbc: "E1059.006"
  if:
    type: text
    regex: 'python[23]?["'']\s*,\s*file'
- id: asyncio-create-subprocess-exec
  desc: asyncio subprocess execution call
  crit: notable
  conf: 0.85
  mbc: "E1059.006"
  if:
    type: symbol
    kind: call
    regex: '(^|\.)create_subprocess_exec$'
- id: java-jar-argv
  desc: Python subprocess launches JAR
  crit: notable
  conf: 0.9
  mbc: "E1059.006"
  if:
    type: text
    regex: subprocess\.(run|Popen|call)\(\s*\[\s*['"]java['"]\s*,\s*['"]-jar['"]
- id: sys-executable-popen
  desc: subprocess.Popen with sys.executable list
  crit: notable
  conf: 0.9
  mbc: "E1059.006"
  if:
    type: text
    regex: "Popen\\s*\\(\\s*\\[\\s*sys\\.executable\\s*,"
- id: sys-executable-stdin-subprocess
  desc: subprocess runs Python from stdin
  crit: notable
  conf: 0.94
  mbc: "E1059.006"
  if:
    type: text
    regex: 'subprocess\.(Popen|run|call)\(\s*\[\s*sys\.executable\s*,\s*[''"]-[''"]'
- id: sys-executable-c-popen-ast
  desc: subprocess.Popen inline Python command (AST)
  crit: notable
  conf: 0.96
  mbc: "E1059.006"
  if:
      # Restored arg discriminator dropped in the call migration.
    type: symbol
    kind: call
    exact: 'subprocess.Popen'
    arg:
      kind: string
      regex: '^-c$'
- id: importlib-check-output-call
  desc: Dynamic check_output call
  crit: notable
  conf: 0.82
  mbc: "E1059.006"
  if:
    type: symbol
    kind: call
    exact: importlib.import_module.check_output
- id: subprocess-module-pyc
  desc: subprocess module reference in Python bytecode
  crit: notable
  conf: 0.74
  for: [pyc]
  if:
    type: text
    substr: subprocess
- id: python-module-level-popen
  desc: Popen call at Python module top level
  platforms: [windows]
  crit: notable
  conf: 0.98
  if:
    # Module scope is column zero in Python. The earlier tree-sitter query
    # matched the whole call's source text, so any module-level call whose
    # *arguments* mentioned Popen fired (a transpiler emitting
    # `subprocess.Popen(...)` inside a replacement string) -- and inside an
    # archive member the AST path degrades to text anyway, so anchor here.
    type: text
    regex: '(?m)^(\w[\w.]*\s*=\s*)?(\w[\w.]*\.)?Popen\s*\('
composite_rules:
- id: python-bash-start-shell-launch
  desc: Python source launches a referenced start.sh through Bash
  crit: notable
  conf: 0.97
  scope: file
  all:
  - id: micro-behaviors/process/create/shell/interpreter::python-bash-argv-launch
  - id: micro-behaviors/fs/path/script::python-start-shell-reference
- id: python-start-shell-subprocess-launch
  desc: Python source runs a referenced start.sh via subprocess
  crit: notable
  conf: 0.97
  scope: file
  all:
  - id: micro-behaviors/fs/path/script::python-start-shell-reference
  - id: process-execution
- id: subprocess-result-pyc
  desc: Bytecode references subprocess result status
  crit: notable
  conf: 0.9
  for: [pyc]
  near_bytes: 2048
  all:
  - id: subprocess-module-pyc
  - id: micro-behaviors/data/property/access::python-returncode-field-name
- id: importlib-subprocess-check-output
  desc: Dynamic subprocess check_output call
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/module/load::python-importlib-subprocess-module
  - id: importlib-check-output-call
  # GuardDog: os.exec* family composite
- id: process-execution
  desc: Python subprocess API launches a child process
  crit: notable
  conf: 0.8
  for:
  - python
  - text
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: well-known/app/system/archlinux-kernel::versioned-lts-update-helper
  - id: well-known/tool/detection/security-remediation::compiled-remediation-catalog
  - id: well-known/tool/detection/security-remediation::authenticated-encryption-recommendation
  - id: metadata/build/toolchain::xcode-platform-args-build-context
  - id: well-known/tool/detection/security-scanner::code-pattern-catalog
  - id: well-known/tool/detection/scarno::scarno-defensive-catalog-source
  - id: well-known/tool/offensive/ctf-skills::source-context
  any:
  - id: popen-content
  - id: run-content
  - id: check-output
  - id: micro-behaviors/process/create/shell/lang::getoutput-content
  - id: check-call-content
  - id: popen-ast
  - id: qualified-popen-call
  - id: run-ast
  - id: call-ast
  - id: check-output-ast
  - id: check-call-ast
  - id: importlib-subprocess-check-output
