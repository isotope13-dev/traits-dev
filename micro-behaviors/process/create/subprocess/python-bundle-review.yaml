# Build-hook declarations and process API evidence must both be present.
composite_rules:
- crit: notable
  platforms:
  - windows
  - unix
  for:
  - python
  id: pep517-hook-subprocess-cooccurrence
  desc: PEP 517 hook and subprocess APIs co-occur
  conf: 0.95
  any:
  - id: micro-behaviors/process/create/subprocess::process-execution
  - id: micro-behaviors/process/create/subprocess::popen-ast
  - id: micro-behaviors/process/create/subprocess::run-ast
  - id: micro-behaviors/process/create/subprocess::call-ast
  - id: micro-behaviors/process/create/subprocess::check-output-ast
  - id: micro-behaviors/process/create/subprocess::check-call-ast
  - id: micro-behaviors/process/create/subprocess::asyncio-create-subprocess-exec
  all:
  - id: metadata/build/package/recipe/setup-hooks::pep517-hook-declaration
  unless:
  - id: well-known/tool/packaging/uv::uv-build-backend
