defaults:
  for: [ruby]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: ruby-open3-capture
    desc: Ruby Open3 captures child-command output
    conf: 0.92
    if:
      type: tree-sitter
      language: ruby
      query: |
        ((call receiver: (constant) @receiver method: (identifier) @method) @capture
          (#eq? @receiver "Open3")
          (#match? @method "^capture(2|2e|3)$"))
