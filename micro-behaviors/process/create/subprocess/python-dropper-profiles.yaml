defaults:
  for: [python]
  platforms: [unix, windows]
composite_rules:
  - id: python-detached-curl-chmod-profile
    desc: Detached Python with curl chmod and delete
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/chmod/executable/mode::python-curl-output-chmod-profile
      - id: micro-behaviors/process/io/stream::echo-identifier-literal-pipeline-fragment
      - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option
    any:
      - id: micro-behaviors/fs/delete/file/library::py-remove
      - id: micro-behaviors/fs/delete/directory::shutil-rmtree
