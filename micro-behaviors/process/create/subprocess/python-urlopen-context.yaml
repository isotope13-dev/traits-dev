# Nearby urllib, file-output, chmod and process-creation clues do not identify
# the launched path as the downloaded file.
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]

composite_rules:
  - id: python-urlopen-write-chmod-launch-profile
    desc: Python urllib read, file output, chmod and launch clues
    crit: suspicious
    conf: 0.98
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urlopen-response-body-read
      - id: micro-behaviors/communications/http/lib/urllib::urllib-download-to-binary-output
      - id: micro-behaviors/fs/chmod/modify::python-chmod-call-with-exec-bit
      - id: micro-behaviors/process/create/subprocess::process-execution
