defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: git-diff-argv-call
    desc: Python subprocess launches git diff
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      kind: call
      regex: '^subprocess\.(run|Popen)\(\s*\[\s*["'']git["'']\s*,\s*["'']diff["'']'
