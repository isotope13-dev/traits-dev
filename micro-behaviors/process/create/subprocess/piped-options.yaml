defaults:
  platforms: [linux, windows, macos]
  crit: notable
  conf: 0.9

composite_rules:
  # These are process-runner operations, without socket input, a command
  # loop, or a PTY. Conan's unchanged build and cygpath helpers satisfy them.
  - id: python-piped-process-options
    desc: Piped process with shell/cwd and output options
    for: [python]
    all:
      - id: micro-behaviors/process/create/subprocess::popen-pipe-communicate
      - id: micro-behaviors/process/fd/stdio::python-subprocess-output-options
      - id: micro-behaviors/process/create/subprocess::subprocess-shell-cwd-options

  # An external IP literal beside a marshalled Popen/PIPE/communicate
  # sequence does not establish received commands or a shell I/O relay.
  - id: python-bytecode-piped-process-with-ip
    desc: Bytecode piped-process markers and external IP
    for: [pyc]
    all:
      - id: micro-behaviors/process/create/subprocess::popen-pipe-communicate
      - id: micro-behaviors/communications/ip/literal::external-ipv4-pyc
