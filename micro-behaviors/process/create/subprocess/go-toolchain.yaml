# Running a toolchain is child-process creation; the command need not compile.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable

traits:
  # `exec.Command("go", "run", …)`, `exec.Command("go", args...)`, and the
  # CommandContext form with a leading context argument.
  - id: go-toolchain-command
    desc: Go toolchain child command syntax
    conf: 0.9
    if:
      type: text
      regex: 'exec\.Command(Context)?\(\s*(\w+\s*,\s*)?"go"\s*,'

