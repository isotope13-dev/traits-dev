defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-decoded-bytes-subprocess-argv
    desc: Decoded bytes contribute to subprocess arguments
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '^subprocess\.(run|Popen|call)$'
      arg:
        index: 0
        from:
          call: '\.decode$'
