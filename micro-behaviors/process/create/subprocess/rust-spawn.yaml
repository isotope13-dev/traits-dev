# A Command object, including a variable or builder chain, owns the spawn.
# Constructor/spawn proximity alone also matches unrelated thread spawns.
defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
traits:
  - id: rust-command-spawn-call
    desc: Spawns a Rust Command child process
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn$'
      receiver:
        from:
          call: '^((std|tokio)::process|async_process)::Command::new$'
