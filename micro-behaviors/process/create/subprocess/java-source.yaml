defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - java
  - kotlin
  - class
  - xml
  - jsp
  - html
  - javascript
  - python
traits:
- id: java-processbuilder-source
  desc: Java ProcessBuilder construction syntax
  conf: 0.8
  for: [scripts, source, class, xml, jsp, html, text]
  if:
    type: text
    regex: 'new ProcessBuilder|<object\s+class\s*=\s*["'']java\.lang\.ProcessBuilder["'']'
- id: java-processbuilder-start-source
  desc: JVM ProcessBuilder start call
  conf: 0.94
  for:
  - java
  - kotlin
  if:
    type: text
    regex: (new\s+)?ProcessBuilder\([^;]{0,300}\)\)?(\s*\.\w+\([^;]{0,160}\)){0,4}\s*\.start\(
- id: jvm-processbuilder-constructor-call
  desc: Calls JVM ProcessBuilder constructor
  if:
    type: symbol
    kind: call
    exact: ProcessBuilder
  for:
  - java
  - kotlin
  platforms:
  - android
  - unix
  - windows
  crit: notable
  conf: 0.98
