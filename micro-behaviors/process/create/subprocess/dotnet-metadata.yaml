composite_rules:
- platforms:
  - windows
  - unix
  id: dotnet-process-start-split-tokens
  desc: .NET ProcessStartInfo with launch member names
  crit: notable
  conf: 0.94
  for:
  - pe
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: metadata/binary/symbols/name::dotnet-processstartinfo-name
  - id: metadata/binary/symbols/name::process-start-member-token
  # A filename can be passed to ProcessStartInfo's constructor, leaving no
  # set_FileName member. A shell-launch property reference is another
  # configuration API clue. Neither spelling binds a specific launch argument
  # or establishes the value of UseShellExecute.
  any:
  - id: metadata/binary/symbols/name::dotnet-filename-setter-name
  - id: micro-behaviors/process/create/flags::use-shell-execute-property
