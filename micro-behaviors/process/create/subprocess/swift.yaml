# Match a constructed Foundation.Process receiver and its run() call in the
# same statement list, including a nested do/conditional body. Comments and
# unrelated receivers cannot supply a leg.
defaults:
  crit: notable
  conf: 0.95
  attack: T1106
  for: [swift]
  platforms: [windows, unix]

traits:
  - id: swift-source-process-run
    desc: Swift runs a constructed Process receiver
    if:
      type: tree-sitter
      query: |
        (_
          (property_declaration
            name: (pattern bound_identifier: (simple_identifier) @binding)
            value: (call_expression (simple_identifier) @constructor))
          (try_expression expr: (call_expression
            (navigation_expression target: (simple_identifier) @receiver
              suffix: (navigation_suffix suffix: (simple_identifier) @method))))
          (#eq? @constructor "Process")
          (#eq? @binding @receiver)
          (#eq? @method "run"))
        (_
          (property_declaration
            name: (pattern bound_identifier: (simple_identifier) @binding)
            value: (call_expression (simple_identifier) @constructor))
          (_ (statements (try_expression expr: (call_expression
            (navigation_expression target: (simple_identifier) @receiver
              suffix: (navigation_suffix suffix: (simple_identifier) @method))))))
          (#eq? @constructor "Process")
          (#eq? @binding @receiver)
          (#eq? @method "run"))
