# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - groovy
  platforms:
  - linux
  - macos
  - windows
  crit: notable
  conf: 0.88
traits:
- id: groovy-processbuilder-start
  desc: Starts a ProcessBuilder child process
  if:
    type: text
    regex: new\s+ProcessBuilder\s*\(.{0,80}\)\.start\s*\(
