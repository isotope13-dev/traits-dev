defaults:
  platforms: [windows, unix, android]
  for: [java, class]
traits:
  - id: java-processbuilder-bytecode
    desc: Java bytecode ProcessBuilder reference
    crit: notable
    conf: 0.88
    for: [class]
    if:
      type: hex
      pattern: 6A 61 76 61 2F 6C 61 6E 67 2F 50 72 6F 63 65 73 73 42 75 69 6C 64 65 72
  - id: java-processbuilder-start-bytecode-reference
    desc: JVM ProcessBuilder.start method reference
    crit: notable
    conf: 0.95
    for: [class]
    if:
      type: import
      exact: java/lang/ProcessBuilder.start
  - id: java-processbuilder-init-bytecode-reference
    desc: JVM ProcessBuilder constructor reference
    crit: notable
    conf: 0.92
    for: [class]
    if:
      type: import
      exact: java/lang/ProcessBuilder.<init>
