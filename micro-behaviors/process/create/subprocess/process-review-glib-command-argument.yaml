defaults:
  platforms: [linux]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.96

traits:
  - id: glib-get-text-command-argument
    desc: GLib command receives get_text result
    crit: notable
    if:
      type: symbol
      kind: call
      exact: GLib.spawn_command_line_async
      arg:
        index: 0
        from:
          call: '(^|\.)get_text$'

