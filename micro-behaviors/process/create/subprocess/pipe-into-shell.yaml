# curl | sh assembled from two Python children: the downloader runs with
# stdout=PIPE and the shell reads it as stdin. No pipeline string exists.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
  attack: T1059.004

traits:
  - id: python-popen-curl-wget
    desc: Starts curl or wget child process
    conf: 0.9
    if:
      type: text
      regex: 'Popen\(\s*\[\s*["''](curl|wget)["'']'
  - id: python-popen-shell-interpreter
    desc: Starts a shell interpreter child process
    conf: 0.9
    if:
      type: text
      regex: 'Popen\(\s*\[\s*["''](/bin/)?(bash|sh|zsh)["'']'

composite_rules:
  - id: python-curl-child-piped-into-shell
    desc: Pipes a curl child into a shell child
    conf: 0.95
    attack: T1059.004,T1105
    near_lines: 20
    all:
      - id: python-popen-curl-wget
      - id: python-popen-shell-interpreter
      - id: micro-behaviors/process/fd/stdio::python-stdin-from-stdout-attribute
