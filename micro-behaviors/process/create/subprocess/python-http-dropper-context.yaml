defaults:
  platforms: [unix]
  for: [python, pyc]
  attack: T1106

traits:
  - id: python-popen-detached-payload
    desc: Python detached payload-path process
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'subprocess\.Popen\([^)]{0,120}payload_path[\s\S]{0,220}start_new_session=True'

composite_rules:
  - id: python-http-dropper-exec
    desc: Python URL, temp path and process context
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/url/path::python-api-v1-beacon-agent-url
      - id: micro-behaviors/fs/chmod/modify::python-temp-payload-chmod
      - id: python-popen-detached-payload

