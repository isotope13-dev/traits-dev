defaults:
  platforms: [unix]
  for: [python, pyc]
  attack: T1106

traits:
  - id: python-beacon-download-url
    desc: Python beacon payload URL reference
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: '/api/v1/beacon/{AGENT_ID}'

  - id: python-temp-exec-payload
    desc: Python temp payload path and chmod
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'tempfile\.gettempdir\(\)[\s\S]{0,260}os\.chmod\(payload_path'

  - id: python-popen-detached-payload
    desc: Python detached payload-path process
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'subprocess\.Popen\([^)]{0,120}payload_path[\s\S]{0,220}start_new_session=True'

composite_rules:
  - id: python-http-dropper-exec
    desc: Python URL, temp path and process context
    crit: suspicious
    conf: 0.94
    all:
      - id: python-beacon-download-url
      - id: python-temp-exec-payload
      - id: python-popen-detached-payload

