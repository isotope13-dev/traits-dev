# InitEngine alone is a name; require the DLL/entrypoint argument template.
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: initengine-rundll-argument-template
    desc: InitEngine DLL entrypoint command template
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '%s\s+"?%s"?,InitEngine\s+%s'
