# Command-oriented Java string construction is neutral until the value reaches
# a process or shell sink. It is useful differential signal for dispatchers and
# command wrappers, while injection intent belongs in an objective composite.
defaults:
  platforms: [unix, windows]
  for: [java]

traits:
  - id: java-command-prefix-concat
    desc: Prefixes Java command variable by concatenation
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?m)\b(String\s+)?(cmd|command)\s*=\s*["''][^"''\r\n]{1,120}["'']\s*\+\s*[A-Za-z_$][\w$]*'
