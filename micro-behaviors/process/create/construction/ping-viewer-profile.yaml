# These indicators can belong to separate launch paths. In the Elex positive,
# ping delays a self-copy relaunch; CreateProcess launches a renamed rundll32
# for the resource DLL. Co-occurrence does not bind those command templates.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: ping-shell-viewer-loader-api-profile
    desc: Ping shell and Viewer loader API co-occurrence
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/shell/command-mode::ping-delayed-shell-command-template
      - id: micro-behaviors/process/create/construction::dll-viewer-export-command-format
      - id: micro-behaviors/fs/path/system::rundll32-system32-path
      - id: micro-behaviors/process/create/exec::winexec
    unless:
      - id: metadata/signed/platform/
