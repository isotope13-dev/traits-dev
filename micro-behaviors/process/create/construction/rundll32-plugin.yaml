defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
- id: dll-viewer-export-command-format
  desc: DLL Viewer-export launch command format
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '^%s "%s",Viewer( %s)?$'
- id: rundll32-plugin-argument-template
  desc: DLL plugin entrypoint command template
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: '%s[ ]+"%s",QueryPluginInterface[ ]+%s'
    section: .data
