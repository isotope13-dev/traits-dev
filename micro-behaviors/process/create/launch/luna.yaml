defaults:
  for: [python, javascript, typescript, go, rust, java, c, cpp, shell]
  platforms: [linux, appliance]

traits:
  - id: luna-application-launch-method
    desc: References Luna application launch method
    crit: notable
    conf: 1.0
    if:
      type: string_literal
      substr: luna://com.webos.applicationManager/launch

  - id: webview-interactive-url-argument
    desc: Supplies an interactiveUrl launch argument
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '["'']interactiveUrl["'']\s*:'
