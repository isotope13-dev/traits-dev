defaults:
  platforms: [unix, appliance]
  for: [ruby]

composite_rules:
  - id: ruby-update-module-launch-context
    desc: Ruby launch near update/module.bin URL clue
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/url/path::ruby-update-module-bin-path-clue
      - id: micro-behaviors/process/create/launch::ruby-http-write-process-profile
