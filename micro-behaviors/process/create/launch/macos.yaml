defaults:
  crit: notable
  attack: T1106
  for:
    - python
    - shell
    - macho
  platforms:
    - macos
traits:
  - id: nstask-class-reference
    desc: References macOS NSTask
    conf: 0.85
    for: [macho, objc, swift]
    if:
      type: symbol
      regex: '(^|_)OBJC_CLASS_\$_NSTask$'
  - id: native-nstask-launch-path
    desc: NSTask launch path setter
    conf: 0.9
    for: [macho, objc, swift]
    if:
      type: text
      substr: "setLaunchPath:"
  - id: objc-source-nstask-launch
    desc: Objective-C source launches NSTask
    conf: 0.9
    for: [objc, objectivec]
    if:
      type: text
      regex: 'NSTask.{0,300}\[[A-Za-z_][A-Za-z0-9_]*\s+launch\]'
composite_rules:
  - id: nstask-configured-launch
    desc: Configured NSTask process launch
    conf: 0.95
    for: [macho, objc, swift]
    all:
      - id: nstask-class-reference
      - id: native-nstask-launch-path
