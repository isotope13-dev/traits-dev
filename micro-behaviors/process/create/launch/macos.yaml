defaults:
  attack: T1106
  for:
    - python
    - shell
    - macho
  platforms:
    - macos
traits:
  - id: open-app-quoted
    desc: Quoted macOS application bundle passed to open
    crit: notable
    conf: 0.78
    if:
      type: string_literal
      # Require a quoted bundle name/path so prose such as "open panels" and
      # unrelated dotted names such as ``bpy.app`` do not match.
      regex: \bopen\s+(-a\s+)?["'][^"\n]{1,120}\.app["']
  - id: open-app-absolute-path
    desc: Absolute macOS application bundle passed to open
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: \bopen\s+(-a\s+)?/[^\s"\n]{1,120}\.app\b
  - id: open-app-argv
    desc: macOS application bundle in open argv list
    crit: notable
    conf: 0.82
    if:
      type: string_literal
      regex: \['open'\s*,\s*['"][^'"\n]{1,120}\.app['"]
  - id: open-command
    desc: open command execution
    crit: notable
    conf: 0.75
    if:
      type: literal
      kind: string
      regex: ^open\s+(-a\b|["'])
  - id: applescript-open-app
    desc: AppleScript opens an application bundle
    crit: notable
    conf: 0.92
    attack: T1204.002
    for: [applescript]
    if:
      type: text
      regex: '(?i)\bopen\b[^\nb]{0,180}\.app\b'
  - id: open-file-command
    desc: macOS open command invocation
    crit: notable
    conf: 0.8
    # This is a shell command-line matcher.  Python source frequently uses
    # "open ..." in prose/docstrings, which is not an invocation.
    for: [shell]
    if:
      type: text
      regex: '(?m)^[[:space:]]*open[[:space:]]+\S+'
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: usr-bin-open-command
    desc: /usr/bin/open command execution
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: /usr/bin/open\s+(-[A-Za-z][A-Za-z0-9-]*\s+){0,4}(["'][^"'\n]{0,240}|[^"'\s\n]{1,240})
  - id: nsworkspace-open-file
    desc: NSWorkspace openFile programmatic launch
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: (openFile:withApplication|\[NSWorkspace.{0,30}openFile)
  # Swift spelling of the same capability. Everything above is
  # Objective-C-shaped (`[NSWorkspace … openFile`, `openFile:withApplication`,
  # `sharedWorkspace`), matched as `type: string_literal`, and this file's `for:`
  # list is [python, shell, macho] — so a Swift source file that launches an
  # application through AppKit scored NOTHING. Measured: a three-line Swift file
  # calling NSWorkspace.shared.open / .openApplication(at:) / .launchApplication
  # produced zero traits of any kind. macOS malware is increasingly written in
  # Swift, and this is the standard route there for running a dropped .app or
  # handing a URL to the default handler.
  #
  # `type: text` rather than `type: symbol`: the Swift walker drops callee names
  # in several positions (see the note in hardware/input/accessibility/macos.yaml),
  # and these are globally unique AppKit names, so text costs no precision.
  #
  # Deliberately NOT matching `NSWorkspace.shared.selectFile` — that reveals a
  # file in Finder and creates no process, so it does not belong under
  # process/create/launch/. OpenClaw's macOS settings pane uses exactly that call
  # to open its log directory.
  - id: nsworkspace-swift-open
    desc: Swift NSWorkspace opens a URL or file
    crit: notable
    conf: 0.85
    for: [swift]
    if:
      type: text
      regex: 'NSWorkspace\.shared\.open\s*\('

  - id: nsworkspace-swift-launch-application
    desc: Swift NSWorkspace launches an application
    crit: notable
    conf: 0.9
    attack: T1204.002
    for: [swift]
    if:
      type: text
      regex: 'NSWorkspace\.shared\.(openApplication|launchApplication)\s*\('

  # ObjC selector spelling recovered from Mach-O `__objc_methname` / cstring
  # tables. Neutral capability: every AppKit launcher that starts another .app
  # by path emits this selector name. Intent (hidden nested bundle, persistence)
  # lives in the objective composites that combine it with path evidence.
  - id: nsworkspace-launch-application-selector
    desc: NSWorkspace launchApplication selector
    crit: notable
    conf: 0.9
    attack: T1204.002
    for: [macho, dylib, objc]
    if:
      type: text
      exact: 'launchApplication:'

  - id: nsworkspace-shared
    desc: NSWorkspace sharedWorkspace singleton
    crit: component
    conf: 0.7
    if:
      type: string_literal
      substr: sharedWorkspace
  - id: nstask-class-reference
    desc: References macOS NSTask
    crit: notable
    conf: 0.85
    for: [macho, objc, swift]
    if:
      type: symbol
      regex: '(^|_)OBJC_CLASS_\$_NSTask$'
  - id: native-nstask-launch-path
    desc: NSTask launch path setter
    crit: notable
    conf: 0.9
    for: [macho, objc, swift]
    if:
      type: text
      substr: "setLaunchPath:"
composite_rules:
  - id: open-app
    desc: macOS open application
    crit: notable
    conf: 0.7
    any:
      - id: open-app-quoted
      - id: open-app-absolute-path
      - id: open-app-argv
  - id: nsworkspace-app-launch
    desc: Programmatic app launch via NSWorkspace
    crit: notable
    conf: 0.85
    attack: T1204.002
    all:
      - id: nsworkspace-open-file
      - id: nsworkspace-shared
  - id: app-execution
    desc: macOS application execution
    crit: notable
    conf: 0.85
    any:
      - id: open-app
      - id: open-command
      - id: usr-bin-open-command
      - id: nsworkspace-app-launch
  - id: nstask-configured-launch
    desc: Configured NSTask process launch
    crit: notable
    conf: 0.95
    for: [macho, objc, swift]
    all:
      - id: nstask-class-reference
      - id: native-nstask-launch-path
