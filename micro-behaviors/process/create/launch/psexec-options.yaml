traits:
  - id: psexec-system-copy-eula-options
    for: [batch, powershell, scripts]
    platforms: [windows]
    desc: PsExec SYSTEM, copy or EULA acceptance options
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bpsexec(64)?(\.exe)?\b[^\r\n]{0,120}\s-(s|c|accepteula)\b'
