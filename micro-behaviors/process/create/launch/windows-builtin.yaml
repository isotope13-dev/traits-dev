# Relocated from micro-behaviors/process/create/hcom/ (2026-07) -- references to
# Windows built-in executables are launch-target evidence, unrelated to hcom.
# References to built-in Windows shell tools by name in binary strings.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.7

traits:
  - id: sysprep-exe-reference
    desc: References Windows Sysprep executable
    for: [batch, vbs, powershell, pe, python, rust]
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)sysprep\\sysprep\.exe|sysprep\.exe'
    unless:
      - type: raw
        substr: "%windir%/winsxs/amd64_microsoft-"
      - id: metadata/binary/vendor::microsoft-signed-system-component-context
      - id: well-known/lib/platform/microsoft-iertutil::microsoft-iertutil-system-context

  - id: launch-mspaint
    desc: Reference to mspaint.exe image editor
    if:
      type: text
      section: rdata
      substr: "mspaint.exe"

  # Relocated from micro-behaviors/fs/write/copy (2026-08): the matcher is a
  # bare `Explorer.exe` name reference in script text — no copy, no
  # masquerade. Every Windows admin VBScript that restarts the shell or names
  # the process matches. The masquerade intent comes from the VB6 project
  # identity legs in objectives/evasion/masquerade/identity/vb6.
  - id: vbs-explorer-exe-reference
    desc: VBScript references Explorer.exe
    for: [vbs]
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: Explorer.exe
    unless:
      - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-leaf

  - id: launch-explorer
    desc: Reference to explorer.exe shell
    if:
      type: text
      section: rdata
      substr: "explorer.exe"
