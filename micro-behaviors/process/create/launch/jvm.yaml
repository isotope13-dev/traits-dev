defaults:
  platforms: [unix, windows]
  for: [java, kotlin, class, java_class, jar, text, shell, markdown]
  attack: T1059
  crit: notable
  conf: 0.85

traits:
  - id: java-jar-command-line
    desc: Runs an executable JAR (java -jar)
    if:
      type: text
      substr: java -jar

  - id: java-classpath-command-line
    # Neutral JVM launch form. Extremely common in usage/help text, build
    # scripts and READMEs — intent comes from what the command line points at,
    # so objective composites must supply that context.
    desc: Runs Java class via classpath (java -cp)
    if:
      type: text
      substr: java -cp

  - id: java-jar-command-bytecode
    desc: java -jar string in bytecode
    crit: component
    for: [class, java_class, jar]
    if:
      type: hex
      pattern: 6A 61 76 61 20 2D 6A 61 72

  - id: javaw-exe-literal
    desc: References javaw.exe Windows launcher
    crit: notable
    conf: 0.92
    for: [class, java_class, jar, zip]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)javaw\.exe'

  - id: java-jar-flag-literal
    desc: Java -jar launch flag literal
    crit: component
    conf: 0.8
    for: [class, java_class, jar, zip]
    if:
      type: value
      path: class.strings[*]
      exact: "-jar"

  - id: java-stage-with-context-method
    desc: Java stageWithContext staging method
    crit: component
    conf: 0.9
    for: [class, java_class, jar, zip]
    if:
      type: value
      path: class.strings[*]
      exact: stageWithContext
