defaults:
  platforms: [unix, windows]
  for: [java, kotlin, class, java_class, jar, text, shell, markdown]
  attack: T1059
  crit: notable
  conf: 0.85

traits:
  - id: java-jar-command-line
    desc: Runs an executable JAR (java -jar)
    if:
      type: text
      substr: java -jar

  - id: java-classpath-command-line
    # Neutral JVM launch form. Extremely common in usage/help text, build
    # scripts and READMEs — intent comes from what the command line points at,
    # so objective composites must supply that context.
    desc: Runs Java class via classpath (java -cp)
    if:
      type: text
      substr: java -cp
  - id: javaw-classpath-command-line
    desc: Runs a Java class via javaw classpath
    crit: notable
    conf: 0.9
    for: [java, vbs, batch, powershell, csharp]
    if:
      type: text
      regex: '(?i)\bjavaw(\.exe)?\b.{0,32}-cp\b'

  - id: java-jar-command-bytecode
    desc: java -jar string in bytecode
    crit: component
    for: [class, java_class, jar]
    if:
      type: hex
      pattern: 6A 61 76 61 20 2D 6A 61 72

  - id: javaw-exe-literal
    desc: References javaw.exe Windows launcher
    crit: notable
    conf: 0.92
    for: [class, java_class, jar, zip]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)javaw\.exe'

  # java.home is how running Java code locates the interpreter it is itself
  # running under, in order to build a command line for a second JVM. Common in
  # launchers, build tooling and test harnesses; the intent lives in what the
  # spawned command line points at.
  - id: java-home-property-literal
    desc: References the java.home JVM install path
    crit: notable
    conf: 0.9
    for: [class, java_class, jar, zip]
    if:
      type: value
      path: class.strings[*]
      exact: java.home

  - id: java-jar-flag-literal
    desc: Java -jar launch flag literal
    crit: component
    conf: 0.8
    for: [class, java_class, jar, zip]
    if:
      type: value
      path: class.strings[*]
      exact: "-jar"

composite_rules:
  # ProcessBuilder-based JVM launchers are common in desktop applications,
  # installers, and test harnesses. Objective traits must add evidence about
  # what the child JAR does before assigning suspicious intent.
  - id: javaw-processbuilder-jar-launch
    desc: ProcessBuilder launches a JAR through javaw
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/spawn::java-processbuilder-start-bytecode-symbol
      - id: javaw-exe-literal
      - id: java-jar-flag-literal

  # NOTE: the `stageWithContext` method name is not a JVM launch API and has no
  # meaning outside the loader family that uses it, so it is not a capability.
  # It lives with the composite that consumes it, as
  # objectives/command-and-control/dropper/execution/jvm-relaunch::stage-with-context-method-name.
