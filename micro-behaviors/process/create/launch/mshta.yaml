defaults:
  crit: notable
  platforms: [windows]
  attack: T1218.005

traits:
  - id: mshta-powershell-call
    desc: PowerShell invokes mshta.exe
    conf: 0.96
    for: [powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)^mshta(\.exe)?$'

composite_rules:
  - id: mshta-execution
    desc: MSHTA name or invocation reference
    conf: 0.92
    any:
      - id: micro-behaviors/fs/path/application/executable::mshta-name-reference
      - id: mshta-powershell-call
