defaults:
  crit: notable
  platforms: [windows]
  attack: T1218.005

traits:
  - id: mshta-command-text
    desc: MSHTA command text
    conf: 0.88
    for: [scripts, binaries, -powershell]
    if:
      type: text
      regex: '(?i)\bmshta(\.exe)?\b'
    unless:
      - id: well-known/dual-use/tunnel/mihomo::mihomo-comment-bundle

  - id: mshta-powershell-call
    desc: PowerShell invokes mshta.exe
    conf: 0.96
    for: [powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)^mshta(\.exe)?$'
  # `mshta about:<html>...` runs a document handed to it on the command line.
  # There is no file for anything to scan, quarantine or restore, and the HTA
  # gets full local-machine trust because mshta is a signed Microsoft binary.
  # Ordinary uses of mshta name a .hta file or a URL; `about:` is the form that
  # exists to avoid touching disk.
  - id: mshta-inline-about-document
    desc: mshta runs an inline about-scheme document
    crit: suspicious
    conf: 0.95
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)mshta(\.exe)?["''\s]{1,6}about:\S{1,64}'
    not:
      - regex: '(?i)about:blank\b'


composite_rules:
  - id: mshta-execution
    desc: Invokes mshta.exe
    conf: 0.92
    any:
      - id: mshta-command-text
      - id: mshta-powershell-call
