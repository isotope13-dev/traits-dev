defaults:
  platforms: [windows]
  attack: T1218.005

traits:
  - id: mshta-command-text
    desc: MSHTA command text
    crit: notable
    conf: 0.88
    for: [scripts, binaries, -powershell]
    if:
      type: text
      regex: '(?i)\bmshta(\.exe)?\b'
    unless:
      - id: well-known/dual-use/tunnel/mihomo::mihomo-comment-bundle

  - id: mshta-powershell-call
    desc: PowerShell invokes mshta.exe
    crit: notable
    conf: 0.96
    for: [powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)^mshta(\.exe)?$'

composite_rules:
  - id: mshta-execution
    desc: Invokes mshta.exe
    crit: notable
    conf: 0.92
    any:
      - id: mshta-command-text
      - id: mshta-powershell-call
