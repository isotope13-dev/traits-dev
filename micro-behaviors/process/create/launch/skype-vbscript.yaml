# Starting the installed Skype client through Skype4COM is process-launch
# capability. Spam intent requires the separate whole-contact-list send loop.
defaults:
  platforms: [windows]
  for: [vbs, static-lib]

traits:
  - id: skype4com-client-start
    desc: Skype4COM starts installed Skype client
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bSkype\.Client\.Start\s*\('

