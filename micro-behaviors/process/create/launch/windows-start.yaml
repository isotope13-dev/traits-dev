# Windows `start` command process launching from Python source.
# The atoms describe the capability; install-time intent is inferred by the
# supply-chain composites that reference them.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1059.003
  mbc: E1059.003

traits:
  - id: windows-start-command-a
    desc: Launches executable with Windows start command
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: \bstart\s+['"]?[a-zA-Z0-9._\\/-]+\.(exe|bat|cmd|ps1)

  - id: windows-start-command-b
    desc: Launches executable with Windows start command
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: \bstart\s+['"]?[a-zA-Z0-9._\\/-]+\.(scr|msi|com)

  - id: os-system-start-concat
    desc: Builds Windows start command for os.system
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: os\.system\s*\(\s*['"]start\s+['"]\s*\+

  - id: os-system-start-fstring
    desc: Builds Windows start command with f-string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: os\.system\s*\(\s*f['"]start\s+\{

  - id: windows-start-variable-target
    desc: Launches a variable target with Windows start
    crit: notable
    conf: 0.8
    platforms: [windows]
    for: [bat, cmd, powershell, vbs]
    if:
      type: text
      regex: '(?i)\bstart\s+""\s+["'']?[!%][A-Za-z_][A-Za-z0-9_]{0,40}[!%]["'']?'

  - id: batch-starts-url
    desc: Batch start command launches a URL
    crit: notable
    conf: 0.95
    for: [batch]
    if:
      type: text
      regex: '(?im)^\s*start\s+https?://.{1,200}$'

  - id: batch-starts-multiple-urls
    desc: Batch starts multiple URLs
    crit: notable
    conf: 0.97
    for: [batch]
    count_min: 2
    if:
      type: text
      regex: '(?im)^\s*start\s+https?://.{1,200}$'

  - id: ftp-script-starts-document
    desc: FTP local-shell command opens a document
    crit: notable
    conf: 0.96
    for: [text, batch, cmd]
    if:
      type: text
      regex: '(?im)^!\s*start(\s+["'']{2})?\s+["'']?[^"''\r\n]{1,160}\.(pdf|docx?|xlsx?)\b'

  - id: ftp-script-starts-executable
    desc: FTP local-shell command launches an executable
    crit: notable
    conf: 0.98
    for: [text, batch, cmd]
    if:
      type: text
      regex: '(?im)^!\s*start(\s+["'']{2})?\s+["'']?[^"''\r\n]{1,180}\.exe\b'

composite_rules:
  - id: windows-start-command
    desc: Windows start command execution capability
    crit: notable
    conf: 0.85
    any:
      - id: windows-start-command-a
      - id: windows-start-command-b
      - id: os-system-start-fstring
      - id: os-system-start-concat
