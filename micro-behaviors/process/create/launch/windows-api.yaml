defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # The textual counterpart to process/create/spawn::create-process-{a,w}.
  # A native PE importing CreateProcessW matches both; a managed loader that
  # reaches the API through a P/Invoke declaration, or a script, matches only
  # this one -- so the symbol atoms cannot replace it. It belongs beside them,
  # but spawn/ is already at the 80-trait directory cap.
  - id: create-process-api-name
    desc: CreateProcess API name as a string
    crit: notable
    conf: 0.84
    for: [pe, dll, powershell, batch, vbs, javascript]
    if:
      type: text
      regex: '\bCreateProcess[AW]?\b'
    unless:
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: well-known/app/system/drivers/nvidia::ngx-dll-basename
      - id: metadata/lang/compiler/systems::go-pe-symtab
      - id: metadata/lang/compiler/systems/

  - id: create-process-with-logon
    desc: CreateProcessWithLogon API reference
    attack: T1134.002
    crit: notable
    conf: 0.95
    if:
      type: symbol
      regex: ^CreateProcessWithLogon[AW]?$
    unless:
      - id: metadata/binary/metrics/threshold::many-exports-100

  - id: direct-create-process-with-logon-call
    desc: Direct alternate-logon call sequence
    attack: T1134.002
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: .text
      pattern: '68 ?? ?? ?? ?? 68 ?? ?? ?? ?? 6A 00 6A 00 6A 00 68 ?? ?? ?? ?? 6A 00 6A 00 68 ?? ?? ?? ?? 6A 00 68 ?? ?? ?? ?? E8 ?? ?? ?? ??'

  - id: pcalua-interpreter-launch
    desc: Pcalua launches a command interpreter
    crit: suspicious
    conf: 0.94
    attack: T1218
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)\bpcalua(\.exe)?\b[^\r\n]{0,60}[-/]a\s+["'']?(powershell|pwsh|cmd)(\.exe)?\b'

composite_rules:
  - id: alternate-logon-command-launch
    desc: Command launcher runs with alternate credentials
    crit: notable
    conf: 0.96
    attack: T1134.002
    all:
      - id: create-process-with-logon
      - id: micro-behaviors/process/info/commandline::get-command-line
      - id: direct-create-process-with-logon-call
