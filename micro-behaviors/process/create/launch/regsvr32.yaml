# regsvr32.exe proxy execution (T1218.010). Relocated from
# micro-behaviors/process/create/hcom/ (2026-07): this LOLBin feeds squiblydoo,
# clickfix and ActiveX chains from 6 objective files, and keying it to a
# product-named directory hid it from the process-launch ML feature group.
defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: regsvr32-command-text
    desc: Regsvr32 command text
    crit: notable
    conf: 0.8
    attack: T1218.010
    mbc: E1218.010
    for: [scripts, binaries, -powershell]
    if:
      type: text
      regex: \bregsvr32(\.exe)?
      case_insensitive: true
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
    downgrade:
      any:
        - id: metadata/binary/resource/
  - id: regsvr32-powershell-call
    desc: PowerShell invokes regsvr32.exe
    crit: notable
    conf: 0.96
    attack: T1218.010
    mbc: E1218.010
    for: [powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)^regsvr32(\.exe)?$'
  - id: regsvr32-encoded
    for: [powershell, batch, vbs, javascript, pe, dll]
    desc: Executes regsvr32.exe (encoded)
    crit: notable
    conf: 0.8
    if:
      type: encoded
      encoding:
        - base64
        - hex
      regex: regsvr32(\.exe)?
      case_insensitive: true
  - id: regsvr32-raw-hex
    desc: Executes regsvr32.exe (hex encoded)
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 7265677376723332(2e657865)?
      case_insensitive: true

composite_rules:
  - id: regsvr32
    desc: Invokes regsvr32.exe
    crit: notable
    conf: 0.9
    attack: T1218.010
    mbc: E1218.010
    any:
      - id: regsvr32-command-text
      - id: regsvr32-powershell-call
