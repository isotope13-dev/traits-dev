defaults:
  platforms: [windows]
  for: [batch, powershell, python, javascript, c, cpp, pe, dll]
traits:
  - id: wmic-remote-process-create-command
    desc: WMIC remote process creation command
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bwmic(\.exe)?\s+/node[:\s]+\S+\s+process\s+call\s+create\b'

