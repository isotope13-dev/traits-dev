# Recovered from static string-decoder review. This matches an API name,
# not an invocation; the objective consumer supplies the attack context.
defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: indexed-xor-internal-create-name
    desc: Index-add/XOR concealed process-create name
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule indexed_xor_internal_create_name {
          strings:
            $name = "\x44\x74\x68\x65\x79\x6b\x57\x7a\x78\x6d\x70\x7f\x80\x57\x7d\x84\x76\x84\x81\x75\x81\x6d" xor(0-255)
          condition:
            $name
        }
