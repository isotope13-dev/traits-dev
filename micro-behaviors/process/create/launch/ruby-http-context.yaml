defaults:
  for:
  - ruby
  platforms:
  - unix
  - windows
  conf: 0.95
composite_rules:
- id: ruby-download-helper-or-port-context
  desc: Ruby helper or port-31310 suppression context
  crit: exception
  any:
  - id: micro-behaviors/communications/socket/port::hardcoded-port-31310
  - id: micro-behaviors/data/archive/extract/zip::ruby-unzip-helper-marker
  - id: micro-behaviors/process/create/shell/build::ruby-git-clone-yarn-frontend
  - id: micro-behaviors/process/create/shellexec::ruby-http-preview-open
  - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
  - id: micro-behaviors/communications/http/url/media::image-file-url
  - id: micro-behaviors/communications/http/url/media::image-file-url-template
- id: ruby-http-write-process-profile
  desc: Ruby launch near HTTP and file-write clues
  crit: notable
  scope: file
  near_bytes: 2048
  unless:
  - id: well-known/lib/runtime/scripted/jruby/
  - id: well-known/lib/runtime/scripted/cruby::source-tree
  - id: well-known/lib/web/server/tina4ruby/
  - id: well-known/tool/development/build/homebrew::source-tree
  - id: metadata/package/manager::homebrew-formula-class
  - id: ruby-download-helper-or-port-context
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
  all:
  - id: micro-behaviors/communications/http/request/client::ruby-http-api-reference-group
  - id: micro-behaviors/fs/write/file
  any:
  - id: micro-behaviors/process/create/shell/lang::ruby-exec
  - id: micro-behaviors/process/create/direct::ruby-spawn
  - id: micro-behaviors/process/create/shell/lang::ruby-system-shell-command
