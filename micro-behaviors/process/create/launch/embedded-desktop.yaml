defaults:
  platforms: [unix]
  for: [binaries, scripts, c, cpp, go, typescript]

traits:
  # A Desktop Entry is an application launcher. It becomes login persistence
  # only when a separate autostart-path or autostart-enable signal is present.
  - id: embedded-desktop-entry-exec
    desc: Embeds an application Desktop Entry
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\[Desktop Entry\][\s\S]{0,260}Type=Application[\s\S]{0,260}Exec='

  - id: embedded-desktop-entry-exec-field
    desc: Embeds a Desktop Entry Exec field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\[Desktop Entry\][\s\S]{0,400}Exec='
