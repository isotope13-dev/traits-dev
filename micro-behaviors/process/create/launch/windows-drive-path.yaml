traits:
  # The drive letter needs a separator in front of it, as a real operand has
  # (`start "" C:\svc.exe`). Without one, any prose ending in a letter followed
  # by a colon and an escape matched: printf("...random start and end
  # positions:\n") read as `start ... s:\`.
  - id: windows-start-drive-path-command
    desc: Windows start with drive-qualified operand
    crit: notable
    platforms: [windows]
    conf: 0.9
    for: [pe, dll, c, cpp, powershell, batch]
    if:
      type: text
      regex: '(?i)\bstart\b[^\r\n]{0,40}["''\s][A-Za-z]:\\'

