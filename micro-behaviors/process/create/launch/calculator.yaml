# Launching the OS calculator is the canonical "I have code execution" proof
# payload. Exploit PoCs, malicious-package demos, macro droppers, and build-
# system RCE writeups all reach for it because it is harmless, present on every
# desktop, and visibly proves the injected code ran.
#
# The launch itself is an ordinary process-creation capability, so the atoms
# stay neutral here. Proof-of-execution intent is inferred by composites that
# pair one of these with a delivery context the payload has no business running
# from (a package install hook, a build script, a document macro).
#
# Sibling launch-target atoms for the same idea in other syntaxes live in
# micro-behaviors/process/create/start-process (PowerShell Start-Process) and
# micro-behaviors/process/create/script/gradle (Gradle commandLine).
defaults:
  for: [scripts, source]
  crit: notable
  conf: 0.9
  attack: T1059

traits:
  # Any exec-family call whose first quoted argument is the Windows calculator:
  # os.system("calc"), subprocess.Popen(["calc.exe"]), child_process.execSync('calc'),
  # Runtime.getRuntime().exec("calc.exe"), system('calc'), shell_exec("calc").
  # The verb list is deliberately the shared cross-language stem set rather than
  # one trait per ecosystem, so a rewrite of the same PoC in another language
  # still matches.
  - id: exec-call-launches-calculator
    desc: Execution call launches the Windows calculator
    platforms: [windows]
    if:
      type: text
      regex: '(?i)(system|popen|spawn|exec)\w*\(\s*\[?\s*[''"]calc(\.exe)?[''"]'

  # macOS/Linux equivalents of the same demo payload. `open -a Calculator` is
  # the macOS form; gnome-calculator/xcalc/kcalc are the desktop-Linux forms.
  - id: exec-call-launches-unix-calculator
    desc: Execution call launches the desktop calculator
    platforms: [unix]
    if:
      type: text
      regex: '(?i)[''"](open -a Calculator|gnome-calculator|xcalc|kcalc)[''"]'
