traits:
  - id: psexec-remote-invocation
    platforms: [windows]
    for: [binaries, scripts, source]
    desc: PsExec command line names a remote host
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bpsexec(64)?(\.exe)?\b[^\r\n]{0,160}\s+\\\\[\w.%${}<>-]{1,80}(\s|["'']|$)'
