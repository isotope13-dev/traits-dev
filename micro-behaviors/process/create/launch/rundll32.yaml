# The rundll32 host named in a command line or string table.
traits:
- id: rundll32-exe-literal
  desc: Explicit rundll32.exe string
  platforms: [windows]
  crit: notable
  conf: 0.92
  # Plain text search; a PE that builds the same command line for
  # CreateProcess carries the literal string just as a script would.
  for: [javascript, vbs, batch, powershell, python, pe, dll]
  if:
    type: text
    word: rundll32.exe
  unless:
    # OAuth and installer UIs open https links via url.dll,FileProtocolHandler.
    - type: text
      substr: FileProtocolHandler
