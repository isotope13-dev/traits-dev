defaults:
  platforms: [linux]
  for: [desktop-entry]
  attack: T1106

traits:
  - id: desktop-entry-firefox-remote-document
    desc: Firefox opens a remote document
    crit: notable
    conf: 0.95
    if:
      type: value
      path: desktop_entry.exec
      regex: '(?i)\bfirefox\b.{0,80}https?://[^"''\s]+\.(pdf|docx?)\b'

  - id: desktop-entry-chromium-remote-document
    desc: Chromium opens a remote document
    crit: notable
    conf: 0.95
    if:
      type: value
      path: desktop_entry.exec
      regex: '(?i)\b(chromium|google-chrome|brave-browser)\b.{0,80}https?://[^"''\s]+\.(pdf|docx?)\b'

composite_rules:
  - id: desktop-entry-remote-document-launch
    desc: Desktop Exec opens a remote document
    crit: notable
    conf: 0.95
    any:
      - id: desktop-entry-firefox-remote-document
      - id: desktop-entry-chromium-remote-document
