defaults:
  platforms: [linux]
  for: [desktop-entry]
  attack: T1106

traits:
  - id: desktop-entry-firefox-remote-document
    desc: Firefox opens a remote document
    crit: notable
    conf: 0.95
    if:
      type: value
      path: desktop_entry.exec
      regex: '(?i)\bfirefox\b.{0,80}https?://[^"''\s]+\.(pdf|docx?)\b'

  - id: desktop-entry-chromium-remote-document
    desc: Chromium opens a remote document
    crit: notable
    conf: 0.95
    if:
      type: value
      path: desktop_entry.exec
      regex: '(?i)\b(chromium|google-chrome|brave-browser)\b.{0,80}https?://[^"''\s]+\.(pdf|docx?)\b'

  - id: desktop-entry-decoded-browser-remote-document
    desc: Desktop decodes remote document command
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\b(firefox|chromium)\b.{0,120}https?://.{1,160}\.(pdf|docx?)\b'

  - id: desktop-entry-chmod-variable-launch
    desc: Desktop Exec launches newly executable variable
    crit: notable
    conf: 0.98
    attack: T1204.002
    if:
      type: value
      path: desktop_entry.exec
      regex: '\bchmod\s+\+x\s+"?\$[A-Za-z_]\w*"?\s*&&\s*"?\$[A-Za-z_]\w*"?'

  - id: desktop-entry-user-data-executable-launch
    desc: Desktop Exec launches user-data executable
    crit: notable
    conf: 0.95
    attack: T1204.002
    if:
      type: text
      regex: '(?m)^Exec=[^\r\n]{0,999};\s*~/\.local/share/[A-Za-z0-9._/-]+\s'

  - id: desktop-entry-hidden-temp-executable-launch
    desc: Desktop Exec launches hidden temp executable
    crit: notable
    conf: 0.97
    attack: T1204.002
    if:
      type: value
      path: desktop_entry.exec
      regex: '(&&|;)\s*/(var/)?tmp/\.[A-Za-z0-9._/-]+\s*(&|$)'

composite_rules:
  - id: desktop-entry-remote-document-launch
    desc: Desktop Exec opens a remote document
    crit: notable
    conf: 0.95
    any:
      - id: desktop-entry-firefox-remote-document
      - id: desktop-entry-chromium-remote-document
      - id: desktop-entry-decoded-browser-remote-document
