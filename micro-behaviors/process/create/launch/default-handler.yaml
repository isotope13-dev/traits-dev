# Node/Bun's cross-platform "hand this URL or file to the OS default handler"
# idiom: pick `open` (macOS), `start` (Windows) or `xdg-open` (Linux) off
# process.platform, then spawn it. Dev servers and installers use it to open a
# browser; adware, scareware and tech-support lures use the same two lines to
# force a page in front of the user. A bare spawn trait only reports "a process
# was created", which loses the handler choice an analyst needs, so record the
# selection itself. The single-platform command traits (launch/xdg-open,
# launch/windows-start) cover shell and Python; this is the JS ternary form
# where all three names appear together.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1106
  mbc: C0017

traits:
  - id: platform-default-opener-selection
    desc: Selects the platform default open command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']open["'']\s*:[^;{}]{0,60}["'']xdg-open["'']'

  # Obfuscated cross-platform launchers often move the command names into one
  # string table, so the normal ternary/argv matchers cannot see the platform
  # selection. This remains a neutral launch capability: install-hook and
  # remote-file composites supply any unwanted intent.
  - id: string-table-cross-platform-file-openers
    desc: Embeds cross-platform file opener commands
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?s)mspaint\s*["''].{0,640}\bopen\s*["''].{0,160}xdg-open\s*["'']'

  - id: platform-ternary-file-opener
    desc: Ternary selects platform file opener command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'process\.platform.{0,160}["'']open["'']'

  - id: spawn-explorer-or-protocol-handler
    desc: Spawns explorer or URL protocol handler
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(explorer\.exe|FileProtocolHandler|rundll32)'

composite_rules:
  - id: node-detached-os-default-handler-spawn
    desc: Detached spawn uses OS default file handler
    crit: exception
    conf: 0.92
    near_bytes: 600
    all:
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
    any:
      - id: platform-default-opener-selection
      - id: platform-ternary-file-opener
      - id: spawn-explorer-or-protocol-handler
