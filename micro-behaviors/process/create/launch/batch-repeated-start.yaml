defaults:
  platforms: [windows]
  for: [batch]

traits:
- id: batch-repeated-start-call
  desc: Batch repeatedly calls START
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: start
  count_min: 8

- id: batch-text-repeated-start
  desc: Repeated START commands with arguments
  crit: notable
  conf: 0.9
  count_min: 30
  if:
    type: text
    regex: '(?im)^\s*start\s+\S+'

