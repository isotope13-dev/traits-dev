defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: multi-local-executable-launch
    desc: Shell launches three local executables
    crit: notable
    conf: 0.91
    attack: T1059.004
    count_min: 3
    if:
      type: text
      regex: '(?m)^\s*\./[A-Za-z0-9._$-]{2,80}\b.{0,120}$'
  - id: local-execution
    desc: "Local ./ file invocation"
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '^\./[A-Za-z0-9._$-]{1,80}$'
    downgrade:
      any:
        - id: metadata/path/directory::test-directory-component
    unless:
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
      - id: metadata/build/autotools::autoconf-generated-script
      - id: micro-behaviors/revision-control/repository::git-operations-1
      - id: metadata/lang/source/syntax/command/named-command::git-working-tree-command-reference
  - id: local-executable-host-argument
    desc: Local executable receives host argument
    crit: notable
    conf: 0.92
    attack: T1059.004
    if:
      type: text
      regex: '(?m)^\s*\./[A-Za-z0-9._-]{2,64}\s+--host\s+\S+'
  - id: local-executable-user-argument
    desc: Local executable receives user argument
    crit: notable
    conf: 0.92
    attack: T1059.004
    if:
      type: text
      regex: '(?m)^\s*\./[A-Za-z0-9._-]{2,64}\s+--host\s+\S+\s+--user\s+\S+'
  - id: execute-dot-slash-var
    desc: Executes local variable path
    crit: notable
    conf: 0.88
    # Match the parsed command target rather than raw text. Documentation and
    # commented examples such as `# echo "./$output"` do not execute the path
    # and must not complete chmod-then-run composites.
    if:
      type: symbol
      kind: call
      regex: '^\./["'']?\$[A-Za-z_]\w*["'']?$'
  - id: execute-dot-slash-literal
    desc: Executes a local relative file
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^\./'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
composite_rules:
  - id: local-executable-host-user-arguments
    desc: Local executable receives host and user
    crit: notable
    conf: 0.94
    attack: T1059.004
    all:
      - id: local-executable-host-argument
      - id: local-executable-user-argument
    near_lines: 1
