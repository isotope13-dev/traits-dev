defaults:
  for:
    - python
    - javascript
    - powershell
    - pe
  crit: notable
  conf: 0.8
  platforms:
    - windows
traits:
  - id: embedded-powershell-temp-exe
    desc: Start-Process and TEMP executable text
    crit: notable
    conf: 0.95
    attack: T1059.001
    for: [javascript, typescript, powershell, batch, pe, csharp]
    if:
      type: text
      regex: '(?i)\bStart-Process\b[^\r\n]{0,100}\$env:TEMP\\[^;\r\n]{1,80}\.exe\b'
  - id: start-process-temp-executable
    desc: Start-Process temporary path text
    crit: notable
    conf: 0.9
    attack: T1059.001
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)Start-Process\s+(-FilePath\s+)?["'']?\$env:(TEMP|TMP)\\'
  - id: saps-alias
    desc: PowerShell saps process-start alias
    crit: notable
    conf: 0.95
    for: [powershell]
    if:
      type: text
      regex: '(?im)(^|["'';&|][ \t]*)saps([ \t]|$)'
  - id: start-process-msiexec
    desc: Start-Process launches msiexec
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)\bStart-Process\b[^\r\n]{0,160}\bmsiexec(\.exe)?\b
  - id: start-process-msi-path
    desc: Start-Process launches MSI package
    crit: notable
    conf: 0.94
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bStart-Process\b[^\r\n]{0,160}\.msi\b'
  # calc.exe is the canonical Windows RCE/PoC payload target (same role as in
  # Gradle exec-calc). Rarely a legitimate Start-Process target.
  - id: start-process-calc
    desc: Start-Process launches calc.exe
    crit: notable
    conf: 0.92
    attack: T1059.001
    for: [powershell, batch, pe]
    if:
      type: text
      regex: (?i)\bStart-Process\b[^\r\n]{0,160}\bcalc(\.exe)?\b

