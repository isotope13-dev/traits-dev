defaults:
  platforms: [windows]
  for: [lnk]


traits:
  - id: unc-launch-chain
    desc: LNK arguments chain UNC path commands
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\\\\\d{1,3}(\.\d{1,3}){3}\\[^&]*&\s*start\b[^&]*\\\\\d{1,3}(\.\d{1,3}){3}\\'
  - id: unc-script-host-argument
    desc: LNK arguments name a UNC script-host command
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\b(wscript|cscript)(\.exe)?\b[^\r\n]{0,80}//B\s+\\\\[^\s"'']{1,200}\.(wsf|vbs|js)\b'
