defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: spawn-variable-program
    desc: Node spawns a variable program path
    crit: notable
    conf: 0.82
    unless:
      - id: well-known/lib/ui/cytoscape::cytoscape-stylesheet-runtime-marker
    if:
      type: text
      regex: 'spawn(Sync)?\s*\(\s*[A-Za-z_$][A-Za-z0-9_$.]*'
  - id: spawn-destination-variable
    desc: Node spawns destination path variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bspawn\s*\(\s*\w*(dest|path|file)\w*\s*,'
