defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: spawn-variable-program
    desc: Node spawns a variable program path
    crit: notable
    conf: 0.82
    unless:
      - id: well-known/lib/ui/cytoscape::cytoscape-stylesheet-runtime-marker
    if:
      type: text
      regex: 'spawn(Sync)?\s*\(\s*[A-Za-z_$][A-Za-z0-9_$.]*'
