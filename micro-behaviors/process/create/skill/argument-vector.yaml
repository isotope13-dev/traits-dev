# Global skill installation expressed as a Node argument vector, rather than
# a shell string. Keep argument origins attached to one spawn call site.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: node-spawn-skills-package-argument
    desc: Spawn arguments include skills package name
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn(Sync)?$'
      arg:
        index: 1
        from:
          value: '^skills$'

  - id: node-spawn-add-action-argument
    desc: Spawn arguments include add action
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn(Sync)?$'
      arg:
        index: 1
        from:
          value: '^add$'

  - id: node-spawn-global-option-argument
    desc: Spawn arguments include global option
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn(Sync)?$'
      arg:
        index: 1
        from:
          value: '^(-g|--global)$'

composite_rules:
  - id: node-spawn-global-skills-add-arguments
    desc: Spawn arguments select global skill addition
    near_bytes: 1
    all:
      - id: node-spawn-skills-package-argument
      - id: node-spawn-add-action-argument
      - id: node-spawn-global-option-argument

  - id: node-spawn-global-skills-add
    desc: Spawn command adds global AI-agent skills
    all:
      - id: node-spawn-global-skills-add-arguments
      - id: metadata/import/builtin::require-child-process
