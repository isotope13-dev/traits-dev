defaults:
  for: [python]
  platforms: [unix, windows]
composite_rules:
  - id: python-os-system-wget-followon-profile
    desc: os.system near wget follow-on text
    crit: suspicious
    conf: 0.95
    platforms: [unix]
    all:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/communications/http/download/wget::wget-url-followon-command-text
  - id: python-module-os-system-curl-profile
    desc: Module os.system with curl host clue
    crit: suspicious
    conf: 0.96
    near_lines: 3
    all:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/communications/http/curl::curl-dotted-host
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
  - id: python-os-system-curl-cmd-profile
    desc: os.system with curl and cmd start
    crit: suspicious
    conf: 0.95
    near_lines: 12
    all:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/communications/http/download/curl::curl-silent-output
      - id: micro-behaviors/process/create/shell/script-host::cmd-exe-c-start-launch
