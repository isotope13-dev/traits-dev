defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
  conf: 1.0

traits:
  - id: python-private-alias-module-launch
    desc: Module scope calls privately aliased launcher
    if:
      type: value
      path: source.python.module_alias_calls[*].resolved_callee
      regex: '^(os\.(system|popen|execl)|subprocess\.Popen)$'

  - id: python-closed-temp-remote-eval-windowless-launch
    desc: Closed remote-eval script gets windowless launch
    if:
      type: value
      path: source.python.literal_tempfile_stager_flows[*].kind
      exact: closed_temporary_remote_eval_windowless_launch

  - id: python-private-temp-stager-launcher
    desc: Temporary script launcher uses private alias
    if:
      type: value
      path: source.python.literal_tempfile_stager_flows[*].launcher_private_alias
      exact: 'true'
