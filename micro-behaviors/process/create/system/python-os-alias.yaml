defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9
composite_rules:
  - id: python-os-system-alias-o
    desc: Python o.system with os alias
    all:
      - id: metadata/import/module::python-os-alias-o
      - id: metadata/lang/source/syntax/call/member::python-o-system-call
  - id: python-os-system-alias-underscore-os
    desc: Python _os.system with os alias
    all:
      - id: metadata/import/module::python-os-alias-underscore-os
      - id: metadata/lang/source/syntax/call/member::python-underscore-os-system-call
  - id: python-os-system-alias-os-underscore
    desc: Python os_.system with os alias
    all:
      - id: metadata/import/module::python-os-alias-os-underscore
      - id: metadata/lang/source/syntax/call/member::python-os-underscore-system-call
  - id: python-os-system-alias-oslib
    desc: Python oslib.system with os alias
    all:
      - id: metadata/import/module::python-os-alias-oslib
      - id: metadata/lang/source/syntax/call/member::python-oslib-system-call
  - id: python-os-system-alias-operating-system
    desc: Python operating_system.system with os alias
    all:
      - id: metadata/import/module::python-os-alias-operating-system
      - id: metadata/lang/source/syntax/call/member::python-operating-system-system-call
  - id: python-aliased-os-system
    desc: Calls system through an os module alias
    attack: T1059.006
    mbc: E1059.006
    any:
      - id: python-os-system-alias-o
      - id: python-os-system-alias-underscore-os
      - id: python-os-system-alias-os-underscore
      - id: python-os-system-alias-oslib
      - id: python-os-system-alias-operating-system
