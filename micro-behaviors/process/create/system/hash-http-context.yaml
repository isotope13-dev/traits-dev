defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
composite_rules:
- id: hash-prefix-http-execfile-profile
  desc: Hash prefix check near HTTPS and execFile
  crit: notable
  conf: 0.98
  near_bytes: 8192
  all:
  - id: micro-behaviors/data/string/search::hash-or-checksum-hex-prefix-check
  - id: micro-behaviors/communications/http/request/client::https-get
  - id: micro-behaviors/process/create/system::js-execfile-call
