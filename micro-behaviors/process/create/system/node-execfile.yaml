defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: js-execfilesync-var-program-forwarded-argv
    desc: execFileSync forwards argv to variable program
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'execFileSync\s*\(\s*[\w.$]{1,80}\s*,\s*process\.argv\.slice\(\s*2\s*\)'

  - id: js-execfilesync-var-program-var-arg
    desc: execFileSync runs variable path and arg
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: 'execFileSync\s*\(\s*[\w.$]{1,40}\s*,\s*\[\s*[\w.$]{1,40}\s*[,\]]'

  - id: js-execfilesync-var-program-join-arg
    desc: execFileSync runs variable path with path.join
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'execFileSync\s*\(\s*[\w.$]{1,40}\s*,\s*\[\s*path\.join\s*\('

  - id: js-execfilesync
    desc: Executes a file synchronously
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)execFileSync$'
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog

composite_rules:
  - id: js-execfilesync-resolved-program
    desc: Executes a run-time-resolved program path
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/process/create/system::js-execfilesync-var-program-join-arg
      - id: micro-behaviors/process/create/system::js-execfilesync-var-program-var-arg
      - id: micro-behaviors/process/create/system::js-execfilesync-var-program-forwarded-argv
