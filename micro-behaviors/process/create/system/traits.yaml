defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [python, javascript, ruby, go]
traits:
  - id: perl-system-process-call
    desc: Perl system process call
    crit: notable
    conf: 0.9
    for: [perl]
    if:
      type: symbol
      kind: call
      exact: system

  - id: ruby-system-process-call
    desc: Ruby calls Kernel.system with arguments
    crit: notable
    conf: 0.95
    for: [ruby]
    if:
      # Model accessors such as desig.system are not Kernel.system. The
      # call projection drops the receiver, so constrain the parse tree.
      type: tree-sitter
      query: |
        (call !receiver method: (identifier) @method
          arguments: (argument_list)
          (#eq? @method "system")) @call
        (call receiver: (constant) @receiver method: (identifier) @method
          arguments: (argument_list)
          (#eq? @receiver "Kernel")
          (#eq? @method "system")) @call

  # The program is a fixed absolute path, so whatever the surrounding code
  # decoded is not what runs: ruby-jss opens a Jamf policy icon with
  # `system "/usr/bin/open '#{@uri}'"` a few lines after base64-decoding the
  # icon's bytes. Arguments may still interpolate; the executable does not.
  - id: system-call-literal-absolute-program
    desc: system() runs a fixed absolute program
    crit: baseline
    conf: 0.92
    for: [perl, ruby]
    if:
      type: text
      regex: '(?m)\bsystem\s*[("''\[]{1,2}\s*/(usr/)?s?bin/[A-Za-z0-9_.-]{2,}'

  - id: perl-system-interpreter-launch
    desc: Perl system launches interpreter
    crit: notable
    conf: 0.94
    for: [perl]
    if:
      type: text
      regex: '\bsystem\s*\(\s*\$\^X\s*,'

  - id: mshta-exe-literal
    desc: mshta.exe execution literal
    crit: notable
    conf: 0.92
    platforms:
      - windows
    for: [pe]
    if:
      type: text
      exact: mshta.exe
      section: rdata
  - id: shutdown-exe-name-reference
    desc: Windows shutdown.exe name reference
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      substr: shutdown.exe
      case_insensitive: true
  - id: shell-execute-ex-a
    desc: ShellExecuteExA ANSI extended API
    crit: notable
    mbc: E1059.003
    attack: T1059.003
    conf: 0.9
    platforms:
      - windows
    for: [pe]
    if:
      type: symbol
      exact: ShellExecuteExA
  - id: go-os-exec
    desc: Executes commands via Go os/exec
    crit: notable
    mbc: E1059
    attack: T1059
    conf: 0.9
    for: [go, elf, pe, macho]
    if:
      type: symbol
      regex: os/exec\..{0,50}
  - id: go-os-exec-pclntab
    desc: Go binary embeds os/exec package symbols
    crit: notable
    mbc: E1059
    attack: T1059
    conf: 0.85
    for: [elf, macho, pe]
    if:
      type: text
      regex: 'os/exec\.(Command|LookPath|\(\*Cmd\)\.)'

  - id: go-privileged-executor
    desc: Constructs a privileged command executor
    crit: notable
    conf: 0.92
    for: [go]
    if:
      type: symbol
      kind: call
      exact: privileged.NewExecutor

  - id: go-privileged-script-execution
    desc: Executes a script through a command executor
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: call
      exact: executor.Execute
  - id: win-start-empty-title
    desc: Windows start command with empty title
    crit: notable
    conf: 0.93
    platforms: [windows]
    for: [python, pyc]
    if:
      # CPython marshal ASCII (`\x7a` + len 0x0a) embeds the launcher const;
      # text extraction often misses these bytecode-framed strings.
      type: raw
      regex: '\x7a\x0astart "" "'
  - id: python-curl-pipe-shell-call
    desc: Python os.system curl shell pipe
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '\bos\.system\([^)]{0,240}curl[^)]{0,240}\|\s*(bash|sh)\b'
  - id: python-o-system-call
    desc: Python o.system call
    crit: notable
    mbc: E1059.006
    attack: T1059.006
    conf: 0.88
    for: [python]
    if:
      type: symbol
      kind: call
      exact: o.system
  - id: python-underscore-os-system-call
    desc: Python _os.system call
    crit: notable
    mbc: E1059.006
    attack: T1059.006
    conf: 0.88
    for: [python]
    if:
      type: symbol
      kind: call
      exact: _os.system
  - id: python-os-underscore-system-call
    desc: Python os_.system call
    crit: notable
    mbc: E1059.006
    attack: T1059.006
    conf: 0.88
    for: [python]
    if:
      type: symbol
      kind: call
      exact: os_.system
  - id: python-oslib-system-call
    desc: Python oslib.system call
    crit: notable
    mbc: E1059.006
    attack: T1059.006
    conf: 0.88
    for: [python]
    if:
      type: symbol
      kind: call
      exact: oslib.system
  - id: python-operating-system-system-call
    desc: Python operating_system.system call
    crit: notable
    mbc: E1059.006
    attack: T1059.006
    conf: 0.88
    for: [python]
    if:
      type: symbol
      kind: call
      exact: operating_system.system
  - id: python-os-system-open-url
    desc: Python os.system opens URL
    crit: notable
    mbc: E1059.006
    attack: T1059.006
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: 'os\.system\s*\(\s*f?["'']\s*(start|open|xdg-open)\s+https?://'
  - id: js-execfile-call
    desc: Calls Node.js execFile or execFileSync
    crit: notable
    mbc: E1059
    attack: T1059
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^execFile(Sync)?$'
composite_rules:
  - id: system-process-call
    desc: Perl or Ruby system process call
    crit: notable
    conf: 0.9
    for: [perl, ruby]
    any:
      - id: perl-system-process-call
      - id: ruby-system-process-call
  - id: python-aliased-os-system
    desc: Executes shell commands via aliased os
    crit: notable
    mbc: E1059.006
    attack: T1059.006
    conf: 0.9
    for: [python]
    any:
      - id: python-o-system-call
      - id: python-underscore-os-system-call
      - id: python-os-underscore-system-call
      - id: python-oslib-system-call
      - id: python-operating-system-system-call
