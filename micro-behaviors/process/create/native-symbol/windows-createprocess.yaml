defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: create-process-api-name
    desc: CreateProcess API name as a string
    crit: notable
    conf: 0.84
    for: [pe, dll, powershell, batch, vbs, javascript, class]
    if:
      type: text
      regex: '\bCreateProcess[AW]?\b'
    unless:
      - id: micro-behaviors/process/create/subprocess/reference::create-process-a-api-reference
      - id: create-process-w
  - id: create-process-with-logon
    desc: CreateProcessWithLogon API reference
    crit: notable
    conf: 0.95
    if:
      type: symbol
      regex: ^CreateProcessWithLogon[AW]?$
    unless:
      - id: metadata/binary/symbols/count::many-exports-100
  - id: create-process-with-logon-name
    desc: CreateProcessWithLogon API name string
    crit: notable
    conf: 0.95
    for: [pe, dll, powershell, csharp]
    if:
      type: text
      regex: '\bCreateProcessWithLogon[AW]?\b'

composite_rules:
  - id: create-process-api-reference
    desc: CreateProcess API referenced in any form
    crit: notable
    conf: 0.95
    any:
      - id: create-process-api-name
      - id: micro-behaviors/process/create/subprocess/reference::create-process-a-api-reference
      - id: create-process-w