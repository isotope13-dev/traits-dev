# Match an actual Runtime.getRuntime() local variable assignment followed by an
# exec() invocation within the same block scope.
defaults:
  attack: T1059
  mbc: E1203
  platforms: [unix, windows]
  for: [jsp, java, kotlin, html]
  crit: notable
  conf: 0.92
traits:
  - id: java-runtime-bound-local-exec
    desc: Runtime-bound local variable executes a process
    if:
      type: text
      regex: '(?s)Runtime\s+\w+\s*=\s*Runtime\.getRuntime\(\)\s*;[^}]{0,400}\b\w+\.exec\s*\('
      exclude_html_comments: true
