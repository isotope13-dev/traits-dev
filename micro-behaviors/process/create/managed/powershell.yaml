# .NET ProcessStartInfo process creation from PowerShell.
# These are capability-level observations; hidden execution is assembled by
# objective rules from the individual startup properties.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1059.001

traits:
  - id: powershell-processstartinfo-object
    desc: PowerShell creates .NET ProcessStartInfo
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)New-Object\s+System\.Diagnostics\.ProcessStartInfo\b'

  - id: powershell-processstartinfo-hidden-window
    desc: .NET child process requests hidden window
    crit: notable
    conf: 0.95
    attack: T1564.003
    if:
      type: text
      regex: '(?i)\$[A-Za-z_]\w*\.WindowStyle\s*=\s*["'']Hidden["'']'

  - id: powershell-processstartinfo-no-window
    desc: .NET child process suppresses window creation
    crit: notable
    conf: 0.95
    attack: T1564.003
    if:
      type: text
      regex: '(?i)\$[A-Za-z_]\w*\.CreateNoWindow\s*=\s*\$true\b'

  - id: powershell-processstartinfo-redirected-output
    desc: .NET child process redirects standard output
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\$[A-Za-z_]\w*\.RedirectStandardOutput\s*=\s*\$true\b'

