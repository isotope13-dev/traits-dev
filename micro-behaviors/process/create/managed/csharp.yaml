defaults:
  platforms: [windows]
  for: [csharp]
  attack: T1218.011

traits:
  - id: rundll32-start
    desc: .NET starts the Windows rundll32 host
    crit: suspicious
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: Process.Start
      arg:
        kind: string
        exact: rundll32.exe
  - id: rundll32-export-argument
    desc: .NET passes a DLL export to rundll32
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)Process\.Start\s*\(\s*["'']rundll32\.exe["'']\s*,[\s\S]{0,180},\s*[A-Za-z_][A-Za-z0-9_]*'
