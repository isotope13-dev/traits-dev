defaults:
  crit: notable
  for: [perl]
  platforms: [unix, windows]
traits:
  - id: perl-open-interpolated-pipe
    desc: Opens a pipe from an interpolated command
    conf: 0.9
    if:
      type: text
      regex: 'open\s*\([^)\n]{0,40},[^)\n]{0,80}\$[A-Za-z_]\w*[^)\n]{0,40}\|'
  - id: perl-open-write-pipe
    desc: Opens a write pipe to a command
    conf: 0.86
    for: [perl, static-lib]
    if:
      type: text
      regex: 'open\s*\(\s*\w+\s*,\s*"\|'
