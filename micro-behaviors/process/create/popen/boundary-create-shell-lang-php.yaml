defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  mbc: "E1059"
  attack: "T1059.004"
traits:
  - id: popen
    desc: Process open via popen()
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: "popen"

  - id: exec-variable-argument-popen
    desc: popen() receives variable argument
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: popen
      arg:
        index: 0
        kind: identifier
composite_rules:
  - id: php-piped-proc-open-runner
    desc: proc_open pipes input and output
    crit: suspicious
    conf: 0.93
    near_lines: 25
    all:
      - id: micro-behaviors/process/create/subprocess::proc-open
      - id: micro-behaviors/process/fd/stdio::php-stdio-pipe-pair
      - id: micro-behaviors/fs/read/stream::php-fread-indexed-resource
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
