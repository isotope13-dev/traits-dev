defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
traits:
  - id: c-popen
    desc: Imports C popen command-pipe API
    crit: notable
    mbc: E1059.004
    attack: T1059.004
    conf: 0.95
    if:
      type: import
      # macOS re-exports several libc calls under a variant suffix
      # (`popen$DARWIN_EXTSN`, `$UNIX2003`); the plain-anchored form missed
      # them, so any Mach-O using popen escaped this capability.
      regex: '^popen(64)?(\$(DARWIN_EXTSN|UNIX2003))?$'
