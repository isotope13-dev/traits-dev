# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - ruby
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: ruby-open3-popen-reference
  desc: Ruby Open3 pipe-process API reference
  conf: 0.75
  if:
    type: string_literal
    regex: Open3\.popen|popen2e|popen3
- id: ruby-open3-popen-call
  desc: Ruby Open3 pipe-process call
  conf: 0.8
  if:
    type: symbol
    kind: call
    exact: Open3.popen
