defaults:
  platforms: [macos, ios, linux, unix, android, windows]
composite_rules:
  - id: popen-fgets-api-pair
    desc: "Imports popen and fgets APIs (possible command-output capture)"
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/process/create/popen::c-popen
    any:
      - id: micro-behaviors/fs/file/read::fgets-api-import
      - id: micro-behaviors/process/create/direct::cpp-exception
    for: [macho, elf, pe]
    unless:
      - id: metadata/signed/platform::apple
      - id: metadata/binary/metrics/structural::many-imports
      - id: micro-behaviors/process/tty/pty/
      - id: micro-behaviors/process/tty/terminal/
    # Downgrade for system libraries, shell interpreters, and large binaries
    downgrade:
      any:
        - id: micro-behaviors/dylib/library/family/
        - id: micro-behaviors/dylib/library/family/
        - id: micro-behaviors/dylib/library/family/
        - id: metadata/binary/metrics/structural::many-functions
