defaults:
  platforms: [macos, ios, linux, unix, android, windows]
composite_rules:
  - id: popen-fgets-api-pair
    desc: popen with fgets or C++ exception references
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/process/create/shell/native::c-popen
    any:
      - id: micro-behaviors/fs/read/file/handle::fgets-api-import
      - id: metadata/binary/symbols/name/function::cpp-exception
    for: [macho, elf, pe]
