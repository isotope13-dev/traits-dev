defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - ruby
  conf: 0.93
traits:
- id: ruby-io-popen-interpolated
  desc: IO.popen runs an interpolated command
  if:
      # Build/download helpers (Passenger, mruby) routinely pipe an
      # interpolated make/curl command through IO.popen; that is command
      # execution, not a reverse shell. Objective composites add the
      # socket/HTTP-controlled command source.
    type: text
    regex: '\bIO\.popen\(\s*["'']#\{'
- id: ruby-open3-interpolated-command
  desc: Open3 runs an interpolated command
  if:
    type: text
    regex: '\bOpen3\.popen2e?\(\s*["'']#\{'
