defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: js-execfilesync-var-program-forwarded-argv
    desc: execFileSync forwards argv to variable program
    conf: 0.9
    if:
      type: text
      regex: execFileSync\s*\(\s*[\w.$]{1,80}\s*,\s*process\.argv\.slice\(\s*2\s*\)

  - id: js-execfilesync-var-program-var-arg
    desc: execFileSync runs variable path and arg
    conf: 0.82
    if:
      type: text
      regex: execFileSync\s*\(\s*[\w.$]{1,40}\s*,\s*\[\s*[\w.$]{1,40}\s*[,\]]

  - id: js-execfilesync-var-program-join-arg
    desc: execFileSync runs variable path with path.join
    conf: 0.85
    if:
      type: text
      regex: execFileSync\s*\(\s*[\w.$]{1,40}\s*,\s*\[\s*path\.join\s*\(

  # First argument is a bare identifier or member chain, so literal calls
  # such as execFileSync("plutil", ...) do not match; the executed program
  # is resolved at run time.
  - id: js-execfile-computed-program
    desc: execFile runs a computed program path
    conf: 0.9
    if:
      type: text
      regex: '\bexecFile(Sync)?\s*\(\s*[A-Za-z_$][\w$.]{0,60}\s*[,)]'

composite_rules:
  - id: js-execfilesync-resolved-program
    desc: Executes a run-time-resolved program path
    conf: 0.85
    any:
      - id: micro-behaviors/process/create/variable::js-execfilesync-var-program-join-arg
      - id: micro-behaviors/process/create/variable::js-execfilesync-var-program-var-arg
      - id: micro-behaviors/process/create/variable::js-execfilesync-var-program-forwarded-argv
