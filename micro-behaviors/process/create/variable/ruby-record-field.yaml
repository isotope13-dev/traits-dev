defaults:
  for: [ruby]
  platforms: [unix, windows]

traits:
  # The command line handed to Open3/system/spawn/popen/exec is read out of
  # a parsed record field (`task['command']`, `job[:cmd]`).
  - id: ruby-command-from-record-field
    desc: Ruby runs command from record field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(capture[23]e?|system|spawn|popen|exec)\(\s*\w{1,24}\[\s*[''":]{1,2}(command|cmd)[''"]?\s*\]'
