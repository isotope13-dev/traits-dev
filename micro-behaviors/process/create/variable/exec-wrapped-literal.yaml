# The command handed to exec/execSync is a helper call on a short string
# literal (`execSync(decode('!mawoh'))`): the command text is computed from
# the literal rather than written in the source.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: js-exec-helper-wrapped-literal
    desc: Exec command built by helper from literal
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: \bexec(Sync)?\(\s*[\w$]+\(\s*['"][^'"\s]{2,40}['"]\s*\)\s*\)
