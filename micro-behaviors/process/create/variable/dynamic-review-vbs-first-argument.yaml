defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable
  conf: 0.98

traits:
  - id: vbs-inline-shell-first-argument
    desc: WScript.Shell Run uses first script argument
    if:
      type: yara
      source: |
        rule vbs_inline_first_argument {
          strings:
            $code = /(^|[\r\n])\s*CreateObject\("WScript\.Shell"\)\.Run.{0,8}WScript\.Arguments\(0\)/ nocase
          condition:
            $code and @code < 4096
        }

