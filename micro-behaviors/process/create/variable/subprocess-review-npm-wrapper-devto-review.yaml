defaults:
  platforms: [unix, windows]
  for: [python, text, github-actions]
  crit: baseline
  size_max: 5242880
traits:
  - id: npm-wrapper-spawns-binary
    desc: npm wrapper spawns resolved binary
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: "spawnSync(binPath"
  - id: npm-wrapper-spawns-target
    desc: npm wrapper spawns selected target
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: "childProcess.spawnSync(target"
composite_rules:
  - id: npm-native-binary-wrapper-resolve-spawn
    desc: npm native wrapper resolves and spawns binary
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: metadata/lang/source/syntax/assignment/value::npm-wrapper-platform-map
      - id: micro-behaviors/os/module/lookup::npm-wrapper-package-resolve
      - id: micro-behaviors/process/create/variable::npm-wrapper-spawns-binary
  - id: npm-native-binary-wrapper-dispatch
    desc: npm native wrapper dispatches platform binary
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/os/sysinfo/platform/branch::npm-wrapper-platform-arch-branch
      - id: metadata/lang/source/syntax/assignment/value::npm-wrapper-platform-package-concat
      - id: micro-behaviors/process/create/variable::npm-wrapper-spawns-target
