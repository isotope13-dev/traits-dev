defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.99
traits:
  - id: php-adjacent-request-pipe-command
    desc: PHP request variable selects pipe command
    # PHP superglobals are unknown flow nodes in the current producer.
    # Bind adjacent assignment and command argument; intervening writes fail.
    if:
      type: tree-sitter
      language: php
      query: |
        ((_
          (expression_statement (assignment_expression
            left: (variable_name) @bound
            right: (subscript_expression (variable_name) @source)))
          . (comment)*
          . [(expression_statement (function_call_expression
                function: (name) @sink
                arguments: (arguments . (argument (variable_name) @used))) @evidence)
             (expression_statement (assignment_expression
                right: (function_call_expression
                  function: (name) @sink
                  arguments: (arguments . (argument (variable_name) @used))) @evidence))])
          (#eq? @bound @used)
          (#match? @source "^\\$_(GET|POST|REQUEST|COOKIE)$")
          (#match? @sink "(?i)^(popen|proc_open)$"))
