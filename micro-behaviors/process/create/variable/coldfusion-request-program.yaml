# CFML request data supplies the program target.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.9
  attack: T1059
traits:
  - id: cfexecute-request-program
    desc: CFML request member supplies executable name
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: cfexecute
      arg:
        index: 0
        from:
          field: name
          member: '^(form|url)\.'
          through:
            - call: '^(mid|left|right|trim|lcase|ucase)$'
              arguments: [0]
