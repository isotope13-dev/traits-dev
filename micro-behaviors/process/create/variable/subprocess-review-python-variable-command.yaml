defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  attack: T1059.006
traits:
- id: variable-command-argument
  desc: Subprocess runs a variable-held command
  crit: notable
  conf: 0.95
  mbc: E1059.006
  if:
    type: symbol
    kind: call
    regex: ^subprocess\.(run|Popen|call)$
    arg:
      index: 0
      kind: identifier
  unless:
  - id: well-known/tool/development/qt/
