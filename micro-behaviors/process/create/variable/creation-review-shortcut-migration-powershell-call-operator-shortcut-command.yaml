---
defaults:
  platforms:
  - windows
  for:
  - lnk
traits:
- id: lnk-powershell-call-operator-variable-path
  desc: LNK PowerShell runs variable path via &
  crit: notable
  conf: 0.9
  attack: T1059.001
  if:
    type: value
    path: lnk.arguments
    regex: "(^|[;\\r\\n{(])\\s*&\\s*\\$[A-Za-z_]\\w*\\s*(;|$|\\r|\\n)"
