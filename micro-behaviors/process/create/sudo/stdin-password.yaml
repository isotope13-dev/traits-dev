# `sudo -S` reads the password from standard input instead of the terminal.
#
# Neutral capability: unattended provisioning, CI images and askpass helpers
# all use it legitimately. It is recorded here because it is the point at
# which a program demonstrates it is *holding* a password rather than letting
# the user type one — the objective composites that care about where that
# password came from (a phishing dialog, a config file, a keylogger) reference
# this atom.
defaults:
  platforms: [unix]
  for: [scripts, source, macho, elf]

traits:
  - id: sudo-stdin-password
    desc: Runs sudo with a stdin password
    crit: notable
    conf: 0.92
    attack: T1548.003
    if:
      type: text
      # Match sudo's own option list.  A later -S may belong to the target
      # program (for example, `sudo pacman -S`).
      regex: '(?m)\bsudo[ \t]+(-[A-Za-z0-9_=:-]+[ \t]+){0,8}(-S|--stdin)([ \t]|$)'

  - id: sudo-stdin-password-argv
    desc: Rust sudo argv starts with -S
    crit: notable
    conf: 0.9
    attack: T1548.003
    for: [scripts, source]
    if:
      # Require the flag to be the first element passed to Command::new("sudo")
      # rather than matching an option belonging to the child command.
      type: text
      regex: 'Command::new\(["\x27]sudo["\x27]\)[\s\S]{0,80}\[\s*["\x27]-S'

composite_rules:
  - id: sudo-password-on-stdin
    desc: sudo fed a password on stdin
    crit: notable
    conf: 0.92
    any:
      - id: sudo-stdin-password
      - id: sudo-stdin-password-argv
