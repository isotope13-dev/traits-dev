# Running a command under another local account is neutral process creation;
# objectives combine it with the source of the account and payload context.
defaults:
  platforms: [unix]
  for: [shell, applescript]
  crit: notable
  conf: 0.94

traits:
  - id: sudo-user-command
    desc: Launches a process as another local user
    if:
      type: text
      regex: '\bsudo\s+-u\s+["'']?(\$[A-Za-z_]\w*|[A-Za-z_][\w.-]*)["'']?\s+[^\r\n]{1,300}'

  - id: sudo-user-applescript-command
    desc: AppleScript launches process as local user
    if:
      type: text
      regex: 'do shell script\s+["'']sudo -u\s+["'']\s*&\s*quoted form of'

  - id: sudo-preserve-env-user-command
    desc: Execs sudo preserving env as another user
    for: [shell]
    if:
      type: text
      regex: '(?m)^\s*exec sudo --preserve-env --set-home --user\s'
