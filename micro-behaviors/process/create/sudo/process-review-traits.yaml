defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: component
  conf: 0.88

traits:
  - id: sudo-exec
    desc: sudo command execution
    # Word boundaries on both ends of `sudo`: Go's runtime juxtaposes
    # `os/exec` with its internal `sudog` scheduler struct (`execRschedsudog`),
    # which the unbounded alternation matched as a sudo invocation. A genuine
    # reference names the `sudo` command as its own token; `sudog`/`sudoers`
    # adjacency is not an invocation. Still only meaningful paired with an
    # escalation library (see `privilege-escalation`), hence the Go downgrade.
    crit: baseline
    conf: 0.75
    for:
      - go
      - elf
      - macho
    platforms:
      - linux
      - macos
    if:
      type: text
      regex: '\bexec.{0,20}\bsudo\b|\bsudo\b.{0,20}\bexec'
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::go-binary

