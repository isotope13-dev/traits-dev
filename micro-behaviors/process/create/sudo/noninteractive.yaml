# Running sudo without a password prompt is neutral process-launch behavior.
# Passwordless policy changes and exploit context are inferred by objective
# composites.
defaults:
  platforms: [unix]
  for: [shell, python, c, cpp, rust, go, elf]

traits:
  - id: sudo-noninteractive
    desc: Runs sudo without a password prompt
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bsudo\b[^\n]{0,80}(-n\b|--non-interactive\b)'

  - id: sudo-root-shell
    desc: Runs a root shell through sudo
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bsudo\b[^\n]{0,45}-n\b[^\n]{0,30}\bbash\b'

  - id: node-sudo-noninteractive-probe
    desc: Node probes passwordless sudo
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?s)\bspawnSync\s*\(\s*["'']sudo["'']\s*,\s*\[\s*["'']-n["'']\s*,\s*["'']true["'']\s*\]'
