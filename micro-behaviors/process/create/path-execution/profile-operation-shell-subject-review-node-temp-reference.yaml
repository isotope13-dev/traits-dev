defaults:
  platforms: [unix, windows]
traits:
  - id: exec-temp-unix-path
    desc: Exec call references /tmp path
    crit: notable
    conf: 0.9
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: \bexec(Sync|File)?\s*\([^)\n]{0,220}/tmp/
    # An archive extractor reading or writing under /tmp runs tar or unzip,
    # not a program staged there. A /tmp path after a command separator is
    # still reported, so "tar -xzf a.tgz -C /tmp && /tmp/agent" matches.
    not:
      - regex: '\b(tar|unzip|gunzip)\s+-?[a-zA-Z]{1,6}\s+[^&;|]{0,120}$'
