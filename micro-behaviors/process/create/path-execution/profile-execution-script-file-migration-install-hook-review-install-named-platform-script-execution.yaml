---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
composite_rules:
- id: platform-indicator-for-script-launch
  desc: Platform selection or platform-name reference
  crit: component
  for:
  - javascript
  - typescript
  any:
  - id: micro-behaviors/os/sysinfo/platform/runtime/platform::process-platform-content
  - id: micro-behaviors/os/sysinfo/platform/string::os-string-windows
  - id: micro-behaviors/os/sysinfo/platform/string::os-string-linux
- id: platform-script-launch-evidence
  desc: Platform reference near script-launch evidence
  crit: component
  conf: 0.85
  for:
  - javascript
  - typescript
  near_lines: 120
  all:
  - id: platform-indicator-for-script-launch
  any:
  - id: micro-behaviors/process/create/subprocess/launch::node-command-launch-evidence
  - id: micro-behaviors/process/create/exec::js-child-process
  - id: micro-behaviors/process/create/shell/
  - id: micro-behaviors/process/replace/
  - id: micro-behaviors/process/create/path-execution::cross-platform-script-exec
  - id: micro-behaviors/process/create/subprocess/reference::batch-script-execution
- id: install-named-platform-script-execution
  desc: Install-named script has platform and script launch clues
  crit: notable
  conf: 0.92
  all:
  - id: metadata/package/files/included::install-or-beacon-js-basename
  - id: metadata/import/builtin::require-child-process
  - id: platform-script-launch-evidence
  any:
  - id: micro-behaviors/process/create/path-execution::cross-platform-script-exec
  - id: micro-behaviors/process/deploy/file-exec/command::shell-script-execution-any
  - id: micro-behaviors/process/create/subprocess/reference::batch-script-execution
