defaults:
  platforms: [unix, android]
  for: [shell, text]
  crit: notable
  conf: 0.94

traits:
  - id: repeated-background-absolute-path-launch
    desc: Repeated absolute paths run in background
    count_min: 3
    if:
      type: text
      regex: '(?m)[;&][ \t]*(nohup\s+)?/[\w/-]+/[\w.-]+[ \t]+&[ \t]*$'
