defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.9

traits:
  # Launches a dot-prefixed file in the working directory, foreground or via
  # nohup, setsid, or exec. Generic ./script.sh invocations do not match.
  - id: relative-dotfile-exec
    desc: Executes a relative dotfile directly
    if:
      type: text
      regex: '(?m)(^|[;&|])\s*(nohup\s+|setsid\s+|exec\s+)?\./\.[A-Za-z0-9_][A-Za-z0-9._-]{0,60}'
