# Cabinet self-extract stubs invoke extrac32 against the running script
# path, then launch the dropped EXE from %tmp%.
defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  conf: 0.93

traits:
  - id: start-percent-tmp-exe
    desc: Starts an EXE under Temp
    if:
      type: text
      regex: '(?i)start\s+(/[a-z0-9]+\s+)?(""\s+)?"?[%!](tmp|temp)[%!]\\[^"\r\n]{1,60}\.exe"?'
