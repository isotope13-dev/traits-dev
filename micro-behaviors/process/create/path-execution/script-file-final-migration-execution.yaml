defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: shell-script-relative-execution
    desc: Executes a relative shell script path (.sh)
    conf: 0.7
    attack: T1059.004
    for: [shell]
    if:
      type: symbol
      kind: call
      regex: '^\./[A-Za-z0-9_./-]{1,80}\.sh$'
