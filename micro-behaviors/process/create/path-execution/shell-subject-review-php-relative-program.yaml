defaults:
  platforms: [unix]
  for: [php]
  crit: notable
traits:
  - id: php-relative-shell-command
    desc: PHP executes a relative program command
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(system|exec|passthru|shell_exec)$'
      arg:
        index: 0
        from:
          value: '^\./[A-Za-z0-9_.-]'
  - id: php-relative-pipe-command
    desc: PHP opens a relative program command
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(popen|proc_open)$'
      arg:
        index: 0
        from:
          value: '^\./[A-Za-z0-9_.-]'
composite_rules:
  - id: php-relative-program-command
    desc: PHP launches a relative program command
    conf: 0.9
    any:
      - id: php-relative-shell-command
      - id: php-relative-pipe-command
  - id: php-relative-client-endpoint-command
    desc: Relative launch beside client-tuple execution
    conf: 0.95
    all:
      - id: php-relative-program-command
      - id: micro-behaviors/process/create/shell/command-string::php-exec-client-addr-port-args
