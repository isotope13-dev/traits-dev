defaults:
  platforms: [android, unix, windows]
  for: [java, kotlin, c, cpp, go, rust, dex]
  attack: T1021

traits:

  # Native Android helpers may use a lib*.so package name. Record execution
  # request syntax without inferring concealment solely from the suffix.
  - id: adb-shell-shared-object-exec-request
    desc: ADB command executes a temporary shared object
    crit: notable
    conf: 0.97
    if:
      type: literal
      kind: string
      regex: '^shell:(/system/bin/sh\s+-c\s+)?/data/local/tmp/lib[A-Za-z0-9._-]{1,40}\.so\b'
