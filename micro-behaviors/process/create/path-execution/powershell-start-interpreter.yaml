defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: start-process-powershell-text
    desc: Start-Process launches PowerShell command text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?m)^[ \t]*[^#\n]{0,80}Start-Process[^\n]{0,80}-FilePath\s+["'']?powershell(\.exe)?\b'
      case_insensitive: true
