defaults:
  platforms: [windows]
  for: [batch, powershell, pe, dll, javascript, typescript, python, go]
traits:
  - id: powershell-command-call-executable-path
    desc: Command option and executable path text
    crit: notable
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      regex: '-c(ommand)?\s+&\s+["'']?[^\r\n"'']{1,200}\.exe\b'
