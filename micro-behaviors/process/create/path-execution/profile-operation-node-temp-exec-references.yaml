---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: node-exec-temp-env-text
  desc: Node exec with TEMP or TMP text
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: "\\bexec(Sync|File)?\\s*\\([^)\\n]{0,220}process\\.env\\.(TEMP|TMP)"
- id: node-exec-tmpdir-text
  desc: Node exec with os.tmpdir text
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: "\\bexec(Sync|File)?\\s*\\([^)\\n]{0,220}os\\.tmpdir\\(\\)"
composite_rules:
- id: node-direct-temp-exec-clues
  desc: Node direct temporary execution clues
  crit: component
  conf: 0.85
  for:
  - javascript
  - typescript
  any:
  - id: micro-behaviors/process/create/path-execution::exec-temp-unix-path
  - id: micro-behaviors/process/create/path-execution::node-exec-temp-env-text
  - id: micro-behaviors/process/create/path-execution::node-exec-tmpdir-text
