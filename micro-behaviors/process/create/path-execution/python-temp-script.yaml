# A Python process call that hands a shell a script file from a temporary
# directory. The script path is in the call's own argument.
defaults:
  platforms: [unix]
  for: [python]

traits:
  - id: python-shell-runs-temp-script
    desc: Process call runs a temp-directory shell script
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(os\.(system|popen)|subprocess\.[a-z_]+)$'
      arg:
        index: 0
        from:
          value: '(^|\s)(ba|da|z)?sh\s+/(tmp|var/tmp|dev/shm)/'

  # The same command marks a file executable and then runs it.
  - id: python-shell-call-chmod-then-run
    desc: Process call arms then runs a file
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(os\.(system|popen)|subprocess\.[a-z_]+)$'
      arg:
        index: 0
        from:
          value: 'chmod\s+(\+x|[0-7]{3,4})\s+\S+\s*(&&|;)\s*(nohup\s+)?[./~]'
