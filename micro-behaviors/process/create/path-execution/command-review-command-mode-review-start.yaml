defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
traits:
  - id: batch-absolute-executable-command
    desc: Batch invokes an absolute executable path
    conf: 0.94
    if:
      type: text
      regex: '(?im)^\s*(call\s+)?"?[A-Za-z]:\\.{1,180}\.(exe|com)"?(\s+.{1,160})?\s*$'

  - id: start-unquoted-executable-command
    desc: START command names an executable target
    conf: 0.92
    attack: T1059.003
    if:
      type: text
      # A window title (`start "Setup" x.exe`), switches (`start /min`) and
      # paths with spaces all precede the image name.
      regex: '(?i)\bstart\s+("[^"]{0,64}"\s+)?(/\w+\s+){0,4}[\w\\:.-]{1,160}\.exe\b'

  - id: start-quoted-executable-command
    desc: START command names a quoted executable
    conf: 0.92
    attack: T1059.003
    if:
      type: text
      regex: '(?i)\bstart\s+("[^"\r\n]{0,64}"\s+)?(/\w+\s+){0,4}"[^"\r\n]{1,160}\.exe"'
  # Match the image in command position, not a Temp path in its arguments.
  - id: batch-quoted-temp-image-command
    desc: Batch invokes a quoted Temp executable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\s*(call\s+)?"[a-z]:[^"\r\n]{0,160}\\temp\\[^"\\\s]{1,120}\.exe"'
      exclude_comments: true
  - id: batch-unquoted-temp-image-command
    desc: Batch invokes an unquoted Temp executable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\s*(call\s+)?[a-z]:[^"\s]{0,160}\\temp\\[^"\\\s]{1,120}\.exe(\s|$)'
      exclude_comments: true
composite_rules:
  - id: start-executable-command
    desc: START command names an executable target
    conf: 0.92
    any:
      - id: start-unquoted-executable-command
      - id: start-quoted-executable-command
  - id: batch-temp-executable-command
    desc: Batch invokes an executable under Temp
    crit: suspicious
    conf: 0.95
    all:
      - id: batch-absolute-executable-command
    any:
      - id: batch-quoted-temp-image-command
      - id: batch-unquoted-temp-image-command
