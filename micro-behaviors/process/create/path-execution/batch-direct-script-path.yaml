defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: batch-invokes-script-path
    desc: Batch directly invokes script file path
    conf: 0.8
    attack: T1059.003
    for:
      - batch
    if:
      type: text
      regex: '(?im)^\s*[a-z]:\\[a-z0-9_.-]+\.(bat|cmd)\b'
