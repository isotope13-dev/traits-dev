defaults:
  platforms: [unix]
  for: [shell, python, ruby, perl, javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: shell-direct-hidden-temp-exec
    desc: Shell invokes hidden temp dotfile
    for: [shell]
    if:
      type: text
      regex: '(?m)(^|[;&|])\s*/((var/)?tmp|dev/shm)/\.[A-Za-z0-9_][A-Za-z0-9._-]*'
    not:
      - substr: /tmp/.X11-unix
      - substr: /tmp/.ICE-unix
      - substr: /tmp/.font-unix
      - substr: /tmp/.Test-unix
      - substr: /tmp/.cache
      - regex: '\.(log|out|txt|pid)\b'
      - regex: '\.(err|sock|lock|gz)\b'

  - id: shell-interp-hidden-temp-exec
    desc: Shell interpreter runs hidden temp dotfile
    for: [shell]
    if:
      type: text
      # Command position only: `cp /bin/bash /var/tmp/.x` copies, not runs.
      regex: '(?m)(^|[;&|(]|do|then|nohup)\s*(\S*/)?[bdz]?a?sh\s+["'']?/((var/)?tmp|dev/shm)/\.\w'

  - id: shell-wrapper-hidden-temp-exec
    desc: Wrapper launches hidden temp dotfile
    for: [shell]
    if:
      type: text
      regex: '\b(exec|nohup|setsid)\s+["'']?/((var/)?tmp|dev/shm)/\.[A-Za-z0-9_]'

  - id: script-spawn-hidden-temp-exec
    desc: Script spawns hidden temp dotfile
    for: [python, javascript, typescript, ruby, perl]
    if:
      type: text
      regex: '(Popen|system|spawn)\s*\(\s*\[?\s*["'']/((var/)?tmp|dev/shm)/\.[A-Za-z0-9_]'

composite_rules:
  - id: script-bound-hidden-temp-spawn
    desc: Hidden temp dotfile near process spawn
    for: [python, javascript, typescript, ruby, perl]
    crit: notable
    conf: 0.92
    near_lines: 10
    all:
      - id: micro-behaviors/communications/http/download/cli/curl-wget::quoted-hidden-temp-dotfile-literal
    any:
      - id: micro-behaviors/process/create/subprocess/
      - id: micro-behaviors/process/create/exec/
      - id: micro-behaviors/process/create/shell/

  - id: hidden-temp-dotfile-execution
    desc: Executes hidden dotfile from temp path
    crit: notable
    conf: 0.95
    any:
      - id: shell-direct-hidden-temp-exec
      - id: shell-interp-hidden-temp-exec
      - id: shell-wrapper-hidden-temp-exec
      - id: script-spawn-hidden-temp-exec
      - id: script-bound-hidden-temp-spawn
