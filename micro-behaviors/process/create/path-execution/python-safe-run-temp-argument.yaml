---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  size_max: 5000000
traits:
- id: python-safe-run-temp-argument
  size_min: 512
  size_max: 500000000
  desc: Python safe_run references temp path
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: safe_run\(\s*["']/tmp/
