defaults:
  platforms: [unix, windows]
  for: [go]
traits:
  - id: go-command-tempdir-argument
    desc: Go command uses a temporary-directory path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'exec\.Command\(\s*(filepath\.Join\(.{0,180}(os\.TempDir\(\)|["`]/tmp)|os\.TempDir\(\))'
  - id: go-command-literal-tmp-argument
    desc: Go exec.Command uses a /tmp path argument
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'exec\.Command\(\s*(["`]/tmp/)'
composite_rules:
  - id: go-command-temporary-path
    desc: Go temporary-path command constructor
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/process/create/subprocess/configure::go-exec-command-call
      - id: micro-behaviors/process/create/path-execution::go-command-temp-path-argument

  - id: go-command-temp-path-argument
    desc: exec.Command temporary path argument
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/process/create/path-execution::go-command-tempdir-argument
      - id: micro-behaviors/process/create/path-execution::go-command-literal-tmp-argument
