defaults:
  platforms: [macos]
  for: [shell]
  crit: notable
  attack: T1059.004

traits:
  - id: shell-macos-app-bundle-exec
    desc: Shell executes a macOS .app bundle binary
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '^["'']?[^"''\r\n]{1,96}\.app/Contents/MacOS/[^/"''\r\n]+["'']?$'

  - id: shell-exec-macos-app-bundle
    desc: Replaces shell with macOS .app binary
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: '(?m)(^|[;&|])[ \t]*exec[ \t]+["'']?[^"''\r\n]{1,56}\.app/Contents/MacOS/\S+'
