# The next line after `cd` into \windows\temp is a single program token, so
# cmd launches it. A one-word line elsewhere is not this launch.
defaults:
  platforms: [windows]
  for: [batch, text]
  crit: notable
  conf: 0.9

traits:
  - id: batch-bare-launch-after-windows-temp
    desc: Bare program line after Windows temp cd
    if:
      type: text
      regex: '(?im)^cd ?\\windows\\temp\r?\n[A-Za-z]\w{1,24}\r?$'
