defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.8
traits:
  - id: shell-tmp-execution
    desc: References shell execution under /tmp
    if:
      type: text
      # A direct command must begin a shell command (at the start of a line,
      # or after a separator and whitespace). This avoids treating parameter
      # defaults such as ${OUTDIR:-/tmp/results} as execution of that path.
      #
      # `)` is not in the separator class: a command never *starts* after a
      # closing paren, but a command substitution ends with one, so including
      # it made every `cmd $(...) /tmp/path` line look like execution of that
      # path. That is how AWS `rain`'s round-trip test script scored suspicious
      # on `ln -F -s -v -h $(realpath pkl) /tmp/pkl/modules` -- a symlink
      # target, not a program. `(` stays, so `$(/tmp/dropper)` still matches.
      # Include the character before a line break so a shell continuation
      # ending in backslash cannot be mistaken for a new command.
      regex: '(^|[;&|(]|[^\\]\n)\s*/tmp/[A-Za-z0-9_./-]{1,80}\b($|[^<*?])'
    not:
      - substr: curl -SLo /tmp/go.tar.gz
      - substr: /tmp/BOUT-dev/.ci_
      - substr: ./bin/go.exe build -o /tmp/test_result.exe /tmp/test_main.go
      - regex: '\*\.AppImage\b'
      - substr: /tmp/squashfs-root/AppRun
      # Data/config file paths under /tmp are references, not shell execution
      - regex: (^|[\n;&|()])\s*/tmp/[A-Za-z0-9_./-]{1,80}\.(conf|cfg|ini|log|txt|json|ya?ml|xml|toml|lock|pid|sock|db|dat|sql|pot)\b
      # A command continuation after a redirection is a data-file target,
      # not a command beginning with /tmp/.
      - regex: '>\s*\\\s*\n\s*/tmp/[A-Za-z0-9_./-]{1,80}\b'
      - regex: '(^|[;&|()])\s*(sudo\s+)?rm\s+-rf\s+[\s\S]{0,160}/tmp/'
      - substr: /tmp/makepkg/*
      - regex: 'EGroupware-egroupware-[^\\/]+[\\/]doc[\\/]rpm-build[\\/]release-appcenter\.sh$'
      - substr: /tmp/FlameGraph/stackcollapse-perf.pl
      - regex: '/tmp/FlameGraph/(stackcollapse-perf|flamegraph)\.pl\b'
      - regex: '/tmp/bench[A-Za-z0-9_./-]*'
      - regex: 'mingw-lite/releases/download/[\s\S]{0,300}/tmp/mingw32'
      # The official .NET installer is commonly downloaded to /tmp and
      # invoked there with its channel/install-dir arguments.
      - substr: /tmp/dotnet-install.sh
      # Relative project paths like "$(pwd)/tmp/certs" are data locations, not /tmp execution.
      - regex: '\$\([^)\n]{1,120}\)/tmp/[A-Za-z0-9_./-]{1,80}\b'
composite_rules:
  - id: executes-tmp-file
    desc: Shell executes /tmp path directly
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/process/replace::executes-tmp-file-exec
      - id: micro-behaviors/process/create/shell/interpreter::executes-tmp-file-shell
      - id: micro-behaviors/process/interpreter/shell::executes-tmp-file-source
