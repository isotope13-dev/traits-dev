---
defaults:
  platforms:
  - linux
  - macos
  - windows
  crit: notable
  conf: 0.95
traits:
- id: decoded-relative-command-text
  desc: Base64 relative executable command text
  for:
  - python
  - shell
  - text
  if:
    type: encoded
    encoding: base64
    regex: "(?im)(^|[;&|])\\s*\\./[A-Za-z0-9._$-]{1,80}(\\s|[;&|]|$)"
