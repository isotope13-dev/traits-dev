defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: cross-platform-script-exec
    desc: Shell and batch references with script execution
    crit: notable
    conf: 0.85
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/fs/path/script::shell-script-ref
      - id: micro-behaviors/fs/path/script::batch-script-ref
      - id: metadata/import/builtin::require-child-process
    any:
      - id: micro-behaviors/process/deploy/file-exec/command::shell-script-execution-any
      - id: micro-behaviors/process/create/subprocess/reference::batch-script-execution
