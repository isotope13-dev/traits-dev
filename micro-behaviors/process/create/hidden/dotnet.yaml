defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: dotnet-hidden-process-launch-setup
    desc: .NET process startup configured without a console window
    crit: notable
    conf: 0.9
    all:
      - id: dotnet-create-no-window
      - id: metadata/binary/symbols/descriptor::dotnet-processstartinfo-name
    any:
      - id: micro-behaviors/process/create/flags::use-shell-execute-property
      - id: metadata/import/framework::diagnostics-namespace-dotnet
      - id: micro-behaviors/process/create/spawn::dotnet-process-start-tokenized

  - id: csharp-hidden-process-launch
    desc: C# starts a process configured without a console window
    crit: notable
    conf: 0.96
    for: [csharp]
    all:
      - id: dotnet-create-no-window
      - id: micro-behaviors/process/create/flags::dotnet-process-start-info
      - id: micro-behaviors/process/create/subprocess::dotnet-process-start
    near_lines: 25
