defaults:
  platforms: [windows]
  for: [python]
  crit: notable
  conf: 0.90
traits:
- id: winexec-sw-hide-source
  desc: WinExec call uses hidden flag
  conf: 0.92
  for: [c, cpp]
  if:
    type: symbol
    kind: call
    exact: WinExec
    arg:
      kind: identifier
      name: SW_HIDE
  # Python ctypes callers commonly pass the numeric SW_HIDE value instead of
  # importing the Windows constant. Keep this as a neutral process-creation
  # capability; objectives decide whether the hidden launch is malicious.
- id: python-ctypes-winexec-hidden
  desc: ctypes WinExec hides launched process
  conf: 0.96
  if:
    type: symbol
    kind: call
    regex: '(^|\.)WinExec$'
    arg:
      kind: number
      value: 0
