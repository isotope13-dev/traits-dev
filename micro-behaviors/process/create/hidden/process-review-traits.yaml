defaults:
  for: [oledoc]
  platforms: [windows]
traits:
  - id: fragmented-vba-powershell-launch
    desc: Fragmented VBA hidden PowerShell launcher
    crit: suspicious
    conf: 0.97
    if:
      type: raw
      regex: '(?i)powe[\s\S]{0,2}rshell[\s\S]{0,2}-[\s\S]{0,2}NonI[\s\S]{0,2}-W[\s\S]{0,2}H'
