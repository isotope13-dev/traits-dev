defaults:
  platforms: [windows]
  for: [scripts, html, xml]
traits:
  - id: wsh-run-hidden-quoted-call
    desc: WScript.Shell near Run with zero window style
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)WScript\.Shell.{0,256}\.Run\s*\("[^"\r\n]{1,240}",\s*0\s*[,)]'
