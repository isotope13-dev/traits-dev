defaults:
  platforms: [windows]
  for: [xml, html, vbs, javascript]
traits:
  - id: wsh-hidden-shell-run
    desc: Hidden Run of cmd or PowerShell
    crit: notable
    conf: 0.93
    if:
      type: text
      # `Run(cmd, 0)` passes a variable. A hidden shell quotes the interpreter.
      regex: '(?i)\.Run\s*[(\s][^,\r\n]{0,40}["'']\s*(cmd|powershell)\b[^,\r\n]{0,300},\s*0\b'
      # A hidden `.bat` launch is wsh-hidden-batch-script-launch.
      not:
        - substr: .bat
        - substr: .ps1
        - substr: -File
        - substr: -file
        # cmd /c clip < file: copies a file to the clipboard.
        - regex: '(?i)cmd\s+/c\s+clip\s*<'
    unless:
      - id: well-known/tool/sysadmin/microsoft-office::offscrub-removal-benign-context

