defaults:
  for: [powershell]
  platforms: [windows]
traits:
  - id: powershell-hidden-node-start
    desc: PowerShell starts Node with hidden window
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'Start-Process.{0,30}(node.{0,30}Hidden|Hidden.{0,30}node)'
      case_insensitive: true
