defaults:
  platforms: [windows]
traits:
- id: wsh-run-hidden-non-js-text
  desc: Run syntax requests zero/false flags
  crit: notable
  conf: 0.93
  for:
  - vbs
  - html
  - batch
  if:
    type: text
    regex: (?i)\.\s*Run(\s+|\s*\()[^;\r\n]{1,500},\s*0\s*,\s*false\b
- id: javascript-run-hidden-false
  desc: JavaScript Run call passes zero and false
  crit: notable
  conf: 0.98
  for: [javascript]
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: (member_expression property: (property_identifier) @method)
        arguments: (arguments . (_) . (number) @style . (false) .)) @call
      (#match? @method "^[Rr][Uu][Nn]$")
      (#eq? @style "0"))
composite_rules:
- id: wsh-run-hidden-text
  desc: Run syntax requests zero/false flags
  crit: notable
  conf: 0.98
  for: [javascript, vbs, html, batch]
  any:
    - id: wsh-run-hidden-non-js-text
    - id: javascript-run-hidden-false
