defaults:
  platforms: [windows]
  for: [lnk]

composite_rules:
  - id: hidden-powershell-lnk
    desc: LNK runs PowerShell with hidden window
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/shortcut::lnk-powershell-family
      - id: micro-behaviors/ui/window/state::lnk-hidden-window
  - id: hidden-lolbin-lnk
    desc: LNK runs LOLBIN with hidden window
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/shortcut::lnk-lolbin-target
      - id: micro-behaviors/ui/window/state::lnk-hidden-window
  - id: hidden-or-minimized-powershell
    desc: LNK runs an encoded PowerShell command hidden or minimized
    # Window state plus an encoded command is suspicious launch behavior, but
    # does not establish that the decoded command is malicious by itself.
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/shortcut::lnk-powershell-family
      - id: micro-behaviors/process/argument/interpreter::powershell-argument-encoded-command
    any:
      - id: micro-behaviors/ui/window/state::lnk-hidden-window
      - id: "micro-behaviors/ui/window/state::lnk-minimized-inactive-window"
  - id: lnk-hidden-script-host-with-arguments
    desc: LNK launches hidden script host with arguments
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/shortcut::lnk-script-host-target
      - id: micro-behaviors/ui/window/state::lnk-hidden-window
      - id: metadata/file/profile/field-presence::lnk-has-arguments
