defaults:
  platforms: [windows]
  for: [vbs]

composite_rules:
  - crit: notable
    conf: 0.93
    id: vbs-hidden-powershell-file-run
    desc: WSH hidden Run near PowerShell file invocation
    near_lines: 30
    all:
      - id: micro-behaviors/data/control-flow/dispatch/run::vbs-run-style-zero
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
    any:
      - id: metadata/lang/source/syntax/command/launch::vbs-powershell-file-command
      - id: micro-behaviors/process/argument/visibility::vbs-windowstyle-hidden-file-switch
    needs: 1

  - attack: T1059.001,T1059.005
    id: wsh-hidden-run-powershell-syntax
    desc: Hidden WSH Run beside PowerShell command options
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/process/create/hidden::wsh-hidden-async-run
    any:
      - id: micro-behaviors/process/argument/option::powershell-flagged-command-line
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-argument
      - id: micro-behaviors/os/security/policy::execution-policy-bypass
      - id: micro-behaviors/os/security/policy::powershell-policy-bypass-text
    near_lines: 40
    unless:
      - id: vbs-hidden-powershell-file-run
