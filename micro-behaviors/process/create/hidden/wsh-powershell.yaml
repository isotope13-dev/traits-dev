composite_rules:
- platforms:
  - windows
  for:
  - vbs
  attack: T1059.001,T1059.005
  id: wsh-hidden-run-powershell-syntax
  desc: Hidden WSH Run beside PowerShell command options
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/os/com/automation::wscript-shell-literal
  - id: micro-behaviors/process/create/flags::wsh-hidden-async-run
  any:
  - id: micro-behaviors/process/argument/option::powershell-flagged-command-line
  - id: micro-behaviors/process/argument/option::powershell-policy-bypass-argument
  - id: micro-behaviors/os/security/policy::execution-policy-bypass
  - id: micro-behaviors/os/security/policy::powershell-policy-bypass-text
  near_lines: 40
  unless:
  - id: micro-behaviors/process/create/shell/wsh::vbs-hidden-powershell-file-run
