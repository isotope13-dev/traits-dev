defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: detached-hidden-spawn
    desc: Detached and windowsHide true options co-occur
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/process/daemonize/detach::detached-true
      - id: micro-behaviors/process/argument/visibility::node-windowshide-true-option
    downgrade:
      # Legitimate use in background tasks
      any:
        - id: metadata/path/directory::test-directory-component
    unless:
      - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-bundle-text
