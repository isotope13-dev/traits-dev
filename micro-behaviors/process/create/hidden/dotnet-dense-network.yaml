# NetworkStream, a dense region and hidden child are independent clues.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: dotnet-dense-network-hidden-child-profile
    desc: .NET dense region, network stream and hidden-child clues
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/file/data-blob::low-entropy-binary-with-dense-region
      - id: micro-behaviors/communications/socket/tcp::networkstream-dotnet-str
      - id: micro-behaviors/process/create/spawn::process-token-dotnet
      - id: micro-behaviors/process/create/hidden::dotnet-create-no-window
