defaults:
  platforms: [windows]
  for: [go]
composite_rules:
  - id: go-hidden-powershell-download-context
    desc: Go combines file download and hidden PowerShell
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/exec::go-exec-command-call
      - id: micro-behaviors/process/create/direct::go-powershell-command
      - id: micro-behaviors/communications/http/download/cli::go-powershell-web-download-to-file
      - id: micro-behaviors/process/create/hidden::argv-array-windowstyle-hidden
      - id: micro-behaviors/process/create/start-process::go-powershell-start-process
    unless:
      - id: metadata/package/testing/harness/runtime/
      # Prefer the richer context when certutil decoding is also present.
      - id: go-powershell-certutil-decode-context
  - id: go-powershell-certutil-decode-context
    desc: Go PowerShell download with certutil decode
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/exec::go-exec-command-call
      - id: micro-behaviors/process/create/direct::go-powershell-command
      - id: micro-behaviors/communications/http/download/cli::go-powershell-web-download-to-file
      - id: micro-behaviors/data/decode/command::certutil-decode-command
      - id: micro-behaviors/data/decode/command::certutil-decodes-powershell-script
      - id: micro-behaviors/process/create/start-process::go-powershell-start-process
      - id: micro-behaviors/process/create/hidden::argv-array-windowstyle-hidden
    unless:
      - id: metadata/package/testing/harness/runtime/
