defaults:
  platforms:
  - windows
traits:
- id: conhost-headless-powershell-invocation
  desc: Headless conhost PowerShell invocation
  crit: notable
  conf: 0.92
  for:
  - batch
  - powershell
  - text
  if:
    type: text
    regex: (?i)(^|[\s'"(])(conhost(\.exe)?['"]?\s+)?--headless\s+(powershell|pwsh)(\.exe)?\s+-
