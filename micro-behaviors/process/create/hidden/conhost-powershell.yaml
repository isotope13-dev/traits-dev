defaults:
  platforms:
  - windows
traits:
- id: conhost-headless-powershell-invocation
  desc: Headless PowerShell command options
  crit: notable
  conf: 0.92
  for:
  - batch
  - powershell
  - text
  if:
    type: text
    # The host may be renamed or supplied separately in a task action.
    # This observation identifies its arguments, not the host executable.
    regex: (?i)(^|[\s'"(])--headless\s+(powershell|pwsh)(\.exe)?\s+-
