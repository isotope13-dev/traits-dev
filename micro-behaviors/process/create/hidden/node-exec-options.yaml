defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-execsync-hidden-ignored-stdio
    desc: execSync options hide window and ignore stdio
    crit: notable
    conf: 0.99
    # Both options must belong to the same call, in either property order.
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @callee
          arguments: (arguments
            (_)
            (object
              (pair key: (property_identifier) @stdio value: (string) @ignore)
              (pair key: (property_identifier) @hide value: (true))))) @call
          (#eq? @callee "execSync")
          (#eq? @stdio "stdio")
          (#match? @ignore "^['\"]ignore['\"]$")
          (#eq? @hide "windowsHide"))
        ((call_expression
          function: (identifier) @callee
          arguments: (arguments
            (_)
            (object
              (pair key: (property_identifier) @hide value: (true))
              (pair key: (property_identifier) @stdio value: (string) @ignore)))) @call
          (#eq? @callee "execSync")
          (#eq? @stdio "stdio")
          (#match? @ignore "^['\"]ignore['\"]$")
          (#eq? @hide "windowsHide"))
