defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, html, vbs, text]


traits:
  - id: conhost-headless-dash-cmd
    desc: Headless conhost launches cmd
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bconhost(\.exe)?\s+--headless\s+--\s+cmd(\.exe)?\b'
