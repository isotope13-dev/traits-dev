defaults:
  platforms: [windows]
  for: [vbs, asp, html]

traits:
  - id: wsh-run-hidden-numeric-wait
    desc: WSH Run passes zero style and wait
    crit: notable
    conf: 0.93
    for: [vbs, asp, html, javascript]
    if:
      type: text
      regex: '\.\s*Run[\s(]+[^;\r\n]{1,240},\s*0\s*,\s*[01]\b'
      case_insensitive: true

  - id: chr-frag-dot-ru
    desc: Chr-encoded fragment matching ".Ru"
    crit: component
    conf: 0.78
    if:
      type: text
      regex: 'chrw?\(\s*46\s*\)\s*[&+]\s*chrw?\(\s*(82|114)\s*\)\s*[&+]\s*chrw?\(\s*(85|117)\s*\)'
      case_insensitive: true

  - id: chr-frag-run-tail
    desc: Chr-encoded fragment matching "un " or "un("
    crit: component
    conf: 0.78
    if:
      type: text
      regex: 'chrw?\(\s*(85|117)\s*\)\s*[&+]\s*chrw?\(\s*(78|110)\s*\)\s*[&+]\s*chrw?\(\s*(32|40)\s*\)'
      case_insensitive: true

  - id: chr-frag-comma-zero-comma
    desc: Chr-encoded fragment matching ",0,"
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'chrw?\(\s*44\s*\)\s*[&+]\s*chrw?\(\s*48\s*\)\s*[&+]\s*chrw?\(\s*44\s*\)'
      case_insensitive: true

composite_rules:
  - id: chr-encoded-wsh-run-hidden
    desc: Chr-encoded WSH Run with hidden window
    crit: notable
    conf: 0.95
    near_bytes: 512
    all:
      - id: chr-frag-dot-ru
      - id: chr-frag-run-tail
      - id: chr-frag-comma-zero-comma

  - id: any-wsh-run-hidden
    desc: WSH Run call with hidden window
    crit: notable
    conf: 0.94
    for: [vbs, asp, html, javascript]
    any:
      - id: wsh-run-hidden-numeric-wait
      - id: chr-encoded-wsh-run-hidden
      - id: micro-behaviors/data/control-flow/dispatch/named::vbs-run-style-zero
      - id: micro-behaviors/data/control-flow/dispatch/named::run-zero-boolean-arguments
