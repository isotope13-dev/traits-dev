defaults:
  platforms: [windows]
  for: [batch]
composite_rules:
- id: batch-hidden-policy-bypass-command
  desc: Batch invokes hidden PowerShell with policy bypass
  crit: notable
  conf: 0.99
  scope: file
  all:
  - id: micro-behaviors/process/create/flags::powershell-policy-bypass-flag
  - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
  - id: micro-behaviors/process/create/shell/command-flag::powershell-c-flag
  - id: micro-behaviors/process/create/shell/lang::powershell-invocation
