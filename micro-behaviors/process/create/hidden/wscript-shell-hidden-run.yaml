defaults:
  platforms:
    - windows
  crit: notable
composite_rules:
  - id: wscript-shell-hidden-run
    for:
      - javascript
      - vbs
      - html
    desc: WSH reference with hidden Run syntax
    conf: 0.95
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
    any:
      - id: micro-behaviors/data/control-flow/dispatch/run::run-zero-number-argument
      - id: micro-behaviors/data/control-flow/dispatch/run::run-zero-boolean-arguments
      - id: micro-behaviors/process/create/hidden::wsh-run-hidden-statement
      - id: micro-behaviors/data/control-flow/dispatch/run::wsh-run-paren-hidden-false
