---
defaults:
  platforms:
  - windows
  for:
  - lnk
composite_rules:
- id: hidden-powershell-lnk
  desc: LNK PowerShell target and hidden window
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/process/config/target::lnk-powershell-family
  - id: micro-behaviors/ui/window/state::lnk-hidden-window
- id: hidden-lolbin-lnk
  desc: LNK proxy target and hidden window
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/process/config/target::lnk-lolbin-target
  - id: micro-behaviors/ui/window/state::lnk-hidden-window
- id: hidden-or-minimized-powershell
  desc: LNK encoded PowerShell and window clues
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/process/config/target::lnk-powershell-family
  - id: micro-behaviors/process/argument/interpreter::powershell-argument-encoded-command
  any:
  - id: micro-behaviors/ui/window/state::lnk-hidden-window
  - id: micro-behaviors/ui/window/state::lnk-minimized-inactive-window
- id: lnk-hidden-script-host-with-arguments
  desc: LNK script-host target and window clues
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/process/config/target::lnk-script-host-target
  - id: micro-behaviors/ui/window/state::lnk-hidden-window
  - id: micro-behaviors/process/config/launch::lnk-has-arguments
