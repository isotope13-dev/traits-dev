# Rust panic locations keep module paths. A hidden_command.rs module names
# off-screen command execution in the shipped binary.
defaults:
  platforms: [windows]
  for: [pe]
  attack: T1564.003

traits:
  - id: rust-hidden-command-module-path
    desc: Rust binary has a hidden_command.rs module
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'src[\\/]hidden_command\.rs\b'
