# WScript.Shell.Run of `cmd /c` followed by a path held in a variable, with
# window style 0: the file named by that variable runs with no visible
# console.
defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1564.003

traits:
  - id: wsh-hidden-cmd-run-variable-path
    desc: Hidden cmd run of a variable path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.Run\s*\(?\s*"cmd(\.exe)?\s+/c\s+("")?"\s*&\s*[A-Za-z_]\w*[^\r\n,]{0,12},\s*0\b'
