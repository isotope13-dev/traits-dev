defaults:
  platforms: [windows]
  for: [batch, powershell]
traits:
  - id: start-process-hidden-window-option
    desc: Start-Process requests a hidden window
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bStart-Process\b[^;\r\n|]{0,120}-(WindowStyle|Win)\s+(Hidden|H)\b'
