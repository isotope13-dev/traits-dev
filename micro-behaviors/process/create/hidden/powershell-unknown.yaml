defaults:
  for: [powershell]
  platforms: [windows]
traits:
  - id: encodedcommand-invocation-raw
    desc: PowerShell EncodedCommand invocation
    crit: suspicious
    conf: 0.9
    attack: T1059.001
    for: [data, batch, oledoc, javascript, typescript, python, ruby, shell, scripts, source]
    platforms: [windows, unix]
    if:
      type: text
      # Raw text is not syntax-aware, so require the following argument to
      # look like an encoded payload. This excludes regexes, documentation,
      # and classifier descriptions that merely mention the command shape.
      regex: '\bpowershell(\.exe)?\b[^\r\n]{0,180}\s-(EncodedCommand|enc)\b\s+["'']?[A-Za-z0-9+/]{16,}'
      case_insensitive: true
    unless:
      - type: path
        regex: '^Azure\.Core\.[0-9][^/]*\.nupkg/lib/net10\.0/Azure\.Core\.dll$'
      - id: metadata/package/testing/presence/harness::tests-path-filename
      - id: well-known/app/infrastructure/ansible::ansible-python-package-path
      - id: well-known/app/infrastructure/ansible::ansible-powershell-context
      - id: well-known/app/system/businessdev-albuild/
      - id: well-known/app/system/colorscripts-enhanced::package-context
      - id: well-known/lib/runtime/scripted/bun-runtime::runtime-context
      # Same carve-out as `encodedcommand-flag-js` below: sindresorhus/open
      # launches `powershell -EncodedCommand` as its Windows URL-opening
      # plumbing. A rollup/esbuild bundle of it (vite dist chunks, Electron
      # app bundles) is typed `javascript`, so the raw text rule sees the
      # full invocation and this `for:` list reaches it.
      - id: well-known/lib/runtime/scripted/sindresorhus-open::sindresorhus-open-library
      - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-sdk-bundle-runtime-marker
  - id: encodedcommand-flag-native
    desc: PowerShell EncodedCommand flag in native script
    crit: notable
    conf: 0.86
    attack: T1059.001
    for: [data, batch, powershell, oledoc]
    if:
      type: text
      # The flag must stand alone on the command line (preceded by start or
      # whitespace), not be the tail of a hyphenated identifier such as
      # `sanitize-reasoning-enc`.
      regex: '(?i)(^|\s)-(EncodedCommand|enc)\b'
    unless:
      - id: well-known/tool/development/editor/vscode/
      - id: metadata/signed/platform::microsoft
      - id: well-known/app/enterprise/microsoft-office-support::microsoft-office-support-bundle-context
      - type: path
        regex: '^Azure\.Core\.[0-9][^/]*\.nupkg/lib/net10\.0/Azure\.Core\.dll$'
      - id: well-known/app/infrastructure/ansible::ansible-python-package-path
      - id: well-known/app/infrastructure/ansible::ansible-powershell-context
      - id: well-known/app/system/businessdev-albuild/
      - id: well-known/app/system/colorscripts-enhanced::package-context
  # String/template literals only — JSDoc/type-doc mentions of the flag are not
  # command construction. OpenCode Swarm embeds EncodedCommand in sandbox wrappers.
  - id: encodedcommand-flag-js
    desc: PowerShell EncodedCommand flag in script literal
    crit: notable
    conf: 0.86
    attack: T1059.001
    platforms: [unix, windows]
    for: [javascript, typescript]
    if:
      type: literal
      # Standalone -EncodedCommand (or -enc preceded by command whitespace)
      # in JS/TS string literals. Requiring preceding whitespace for -enc avoids
      # false positives on isolated '-enc' filename/media suffixes.
      regex: '(?i)(^|\s)-EncodedCommand\b|\s-enc\b'
    unless:
      - id: well-known/app/ai/coding-agent/opencode-swarm/
      - id: well-known/tool/development/editor/vscode/
      # sindresorhus/open shells out to `powershell -EncodedCommand` on
      # Windows specifically to avoid the quoting bugs its own docs describe
      # (the `#double-quotes-on-windows` caveat is in the same file). The
      # identity already existed and already matched -- it was simply not
      # referenced here. Vendored into Electron apps everywhere; Tabby
      # 1.0.233 ships it at node_modules/open/index.js.
      - id: well-known/lib/runtime/scripted/sindresorhus-open::sindresorhus-open-library
      - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-sdk-bundle-runtime-marker
  - id: hidden-process-object
    desc: Hidden .NET process launch object
    crit: notable
    conf: 0.88
    attack: T1564.003
    if:
      type: text
      regex: '(?i)New-Object\s+System\.Diagnostics\.Process'
  - id: create-no-window
    desc: Process CreateNoWindow enabled
    crit: notable
    conf: 0.86
    attack: T1564.003
    if:
      type: text
      substr: StartInfo.CreateNoWindow = $true
  - id: windowstyle-hidden
    desc: ProcessWindowStyle Hidden configuration
    crit: notable
    conf: 0.9
    attack: T1564.003
    for: [powershell, batch]
    if:
      type: text
      substr: ProcessWindowStyle]::Hidden

  # Split 'Hi'+'dde'+'n' (or similar) so static scanners miss WindowStyle Hidden.
  - id: hidden-windowstyle-string-concat
    desc: Concatenated Hidden window-style fragments
    crit: suspicious
    conf: 0.92
    attack: T1564.003
    for: [powershell, batch]
    if:
      type: text
      regex: '''Hi''\s*\+\s*''dde''\s*\+\s*''n'''

  # A command classifier's pattern list documents -EncodedCommand. That
  # description is not a launch.
  - id: command-classifier-encodedcommand-doc
    desc: Classifier documents EncodedCommand pattern
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'powershell-encoded[\s\S]{0,200}EncodedCommand \(obfuscated payload\)'
  # Chromium cookie import unprotects a blob with a local DPAPI helper.
  - id: windows-dpapi-unprotect-helper
    desc: PowerShell DPAPI unprotect helper
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'WINDOWS_DPAPI_SCRIPT[\s\S]{0,250}-EncodedCommand'
  # Headless LibreOffice is started under a tiny encoded owner script so the
  # converter can be killed with the job. The script is a local process
  # wrapper, not a downloaded payload.
  - id: libreoffice-owner-encoded-helper
    desc: LibreOffice conversion owner helper
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '-EncodedCommand[\s\S]{0,60}WINDOWS_PROCESS_OWNER_SCRIPT_B64'
  # Local helper accesses Windows Credential Manager via P/Invoke Add-Type.
  - id: windows-credential-manager-encoded-helper
    desc: PowerShell Windows Credential Manager helper
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'DotenvxCredentialManager[\s\S]{0,120}CRED_TYPE_GENERIC'

  # Local helper queries Windows system resource metrics via CIM/WMI.
  - id: windows-resource-query-encoded-helper
    desc: PowerShell Windows resource query helper
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'Get-CimInstance\s+Win32_OperatingSystem[\s\S]{0,300}TotalVisibleMemorySize'

  # electron-builder builds a powershell -EncodedCommand argv so Node can
  # launch npm/pnpm/yarn .cmd shims without shell:true (CVE-2024-27980).
  - id: electron-builder-cmd-shim-encoded-argv
    desc: electron-builder EncodedCommand cmd-shim argv
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'buildPowerShellEncodedArgs[\s\S]{0,500}-EncodedCommand'

composite_rules:
  - id: encodedcommand-invocation-source
    desc: PowerShell child process uses EncodedCommand
    crit: suspicious
    conf: 0.94
    attack: T1059.001
    all:
      - id: micro-behaviors/process/create/shell/interpreter::powershell-process-call
      - id: encodedcommand-flag-native
    near_lines: 1
  # Union of the `any:` legs' own for: -- the composite otherwise inherited
  # just [powershell] from the file default, even though encodedcommand-
  # invocation-raw already covers batch/data/oledoc and encodedcommand-flag-js
  # covers javascript/typescript.
  - id: encodedcommand-invocation
    desc: PowerShell EncodedCommand invocation
    crit: suspicious
    conf: 0.92
    attack: T1059.001
    for: [powershell, data, batch, oledoc, javascript, typescript]
    any:
      - id: encodedcommand-invocation-raw
      - id: encodedcommand-invocation-source
      - id: encodedcommand-flag-js
    unless:
      - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-sdk-package
      - id: command-classifier-encodedcommand-doc
      - id: micro-behaviors/process/create/shell/guard::command-filter-blocklist
      - id: windows-dpapi-unprotect-helper
      - id: libreoffice-owner-encoded-helper
      - id: windows-credential-manager-encoded-helper
      - id: windows-resource-query-encoded-helper
      - id: electron-builder-cmd-shim-encoded-argv
  - id: encodedcommand-bypass
    desc: PowerShell encoded command with bypass
    crit: suspicious
    conf: 0.94
    attack: T1059.001
    all:
      - id: encodedcommand-invocation
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-flag
    unless:
      - id: well-known/app/infrastructure/ansible::ansible-python-package-path
      - id: well-known/app/infrastructure/ansible::ansible-powershell-context

  - id: hidden-powershell-execution
    desc: Hidden PowerShell execution flow
    crit: suspicious
    conf: 0.95
    attack: T1059.001
    all:
      - id: encodedcommand-bypass
    any:
      - id: hidden-process-object
      - id: create-no-window
      - id: windowstyle-hidden
    needs: 2
