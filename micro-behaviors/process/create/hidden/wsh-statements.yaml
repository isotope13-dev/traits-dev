defaults:
  platforms:
  - windows
  for:
  - vbs
  crit: notable
traits:
- id: wsh-run-hidden-statement
  desc: WSH Run statement hides the window
  conf: 0.93
  if:
    type: yara
    source: "rule hidden_run_false {\n  strings:\n    $run = /(^|\\n)[ \\t]*[A-Za-z0-9_]*\\.Run\\b[^\\r\\n]+,[ \\\
      t]*0[ \\t]*,[ \\t]*False[ \\t]*\\)?[ \\t]*(\\r?\\n|$)/ nocase\n  condition:\n    $run\n}"
- id: wsh-run-hidden-wait-statement
  desc: WSH Run statement hides window, waits
  conf: 0.9
  if:
    type: yara
    source: "rule hidden_run_true {\n  strings:\n    $run = /(^|\\n)[ \\t]*[A-Za-z0-9_]*\\.Run\\b[^\\r\\n]+,[ \\\
      t]*0[ \\t]*,[ \\t]*True[ \\t]*\\)?[ \\t]*(\\r?\\n|$)/ nocase\n  condition:\n    $run\n}"
