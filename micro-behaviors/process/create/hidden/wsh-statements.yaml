defaults:
  platforms:
  - windows
  for:
  - vbs
  crit: notable
traits:
- id: wsh-run-hidden-statement
  desc: WSH Run statement hides the window
  conf: 0.93
  if:
    type: text
    regex: (?i)\.Run\s+[A-Za-z_]\w*\s*,\s*0\s*,\s*False\b
- id: wsh-run-hidden-wait-statement
  desc: WSH Run statement hides window, waits
  conf: 0.9
  if:
    type: text
    regex: (?i)\.run\s+[^,]{1,120},\s*0\s*,\s*true
