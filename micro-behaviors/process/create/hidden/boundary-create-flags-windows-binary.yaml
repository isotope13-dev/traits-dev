defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  - id: winexec-sw-hide-immediate
    desc: WinExec called with hidden-window flag
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: WinExec
      arg:
        kind: number
        value: 0
composite_rules:
  - id: hidden-winexec
    desc: Hidden WinExec process launch
    crit: suspicious
    conf: 0.85
    attack: T1564.003
    all:
      - id: micro-behaviors/process/create/hidden::winexec-sw-hide-immediate
      - id: metadata/binary/symbols/name/process::winexec
    downgrade:
      any:
        - id: well-known/app/browser/internet-explorer/
