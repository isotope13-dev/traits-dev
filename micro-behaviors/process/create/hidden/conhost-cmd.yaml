defaults:
  platforms:
  - windows
traits:
- id: conhost-headless-cmd-invocation
  desc: Headless conhost cmd /c invocation
  crit: notable
  conf: 0.92
  for:
  - batch
  - powershell
  - text
  if:
    type: text
    regex: (?i)\bconhost(\.exe)?\s+--headless\s+cmd(\.exe)?\s+/c\b
- id: conhost-exe-token
  desc: Console host executable reference
  crit: component
  conf: 0.9
  for:
  - pe
  - dll
  - csharp
  - powershell
  - batch
  - python
  if:
    type: text
    regex: '(?i)\bconhost\.exe\b'
  unless:
  - id: well-known/app/system/microsoft/platform::microsoft-signed-system-component-context
- id: headless-cmd-c-argument
  desc: Headless cmd /c argument string
  crit: notable
  conf: 0.93
  for:
  - pe
  - dll
  - csharp
  - powershell
  - batch
  - python
  if:
    type: text
    regex: '(?i)(^|[\s"''])--headless\s+cmd(\.exe)?\s+/c\b'

composite_rules:
- id: conhost-split-headless-cmd
  desc: Console host paired with headless cmd /c
  crit: notable
  conf: 0.96
  for:
  - pe
  - dll
  - csharp
  - powershell
  - batch
  - python
  all:
  - id: conhost-exe-token
  - id: headless-cmd-c-argument

