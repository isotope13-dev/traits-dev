# Go child processes launched with no console window. SysProcAttr is
# Windows-only; GUI launchers set it legitimately, so it stays notable and
# gains meaning beside what the hidden child runs.
defaults:
  platforms: [windows, unix]
  for: [go]
  attack: T1564.003

traits:
  - id: go-create-no-window
    desc: Go child process hides its console window
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'HideWindow:\s*true|CREATE_NO_WINDOW'
