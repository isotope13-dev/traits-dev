defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: large-pkg-hidden-powershell-command
    desc: Large pkg bundle contains hidden PowerShell command
    crit: suspicious
    conf: 0.72
    all:
      - id: micro-behaviors/fs/path/script::pkg-snapshot-entrypoint-path
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
      - id: micro-behaviors/process/argument/lifecycle::powershell-no-profile-flag
      - id: metadata/file/profile/file-write-api::node-write-file-sync-statement
      - id: metadata/binary/layout/size::massive-executable
    unless:
      - id: metadata/signed/platform/
