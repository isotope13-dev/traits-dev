defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: large-pkg-hidden-powershell-command
    desc: Large pkg bundle contains hidden PowerShell command
    crit: suspicious
    conf: 0.72
    all:
      - id: micro-behaviors/fs/path/script::pkg-snapshot-entrypoint-path
      - id: micro-behaviors/process/argument/option::powershell-hidden-command-text
      - id: micro-behaviors/process/argument/option::powershell-no-profile-flag
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-statement
      - id: metadata/binary/layout/size::massive-executable
    unless:
      - id: metadata/signed/platform/
