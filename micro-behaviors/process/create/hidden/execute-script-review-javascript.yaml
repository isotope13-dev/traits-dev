defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  conf: 0.95
  for: [javascript, xml]

traits:
- id: wsf-hidden-fragmented-cmd-run
  desc: WSF runs fragmented cmd hidden
  crit: suspicious
  conf: 0.94
  platforms: [windows]
  for: [xml]
  if:
    type: text
    regex: '(?is)\.Run\s*"c"&"m"&"d"&"\."&"e"&"x"&"e".{0,180},\s*0\s*,\s*False'
