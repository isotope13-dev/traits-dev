# Hidden Window Process Creation - Windows
# Neutral observations of hidden window execution flags.
# ATT&CK: T1564.003 (Hide Artifacts: Hidden Window)
# Many legitimate tools (services, background workers, installers) use hidden windows.
defaults:
  platforms: [windows]
  attack: "T1564.003"
traits:
  - id: batch-powershell-hidden-launcher
    desc: Batch launches PowerShell with a hidden window
    crit: notable
    conf: 0.92
    for: [batch]
    if:
      type: text
      regex: '(?i)\bpowershell(\.exe)?\b\s+-nop\s+(-w\s+hidden\s+)?-(c|enc|e)\b'

  - id: conhost-headless
    desc: conhost.exe --headless execution
    crit: notable
    conf: 0.9
    for: [batch, powershell, pe, javascript, vbs]
    if:
      type: text
      regex: '(?i)\bconhost(\.exe)?\s+--headless'
    unless:
      - id: metadata/binary/vendor::microsoft-signed-system-component-context
  - id: conhost-name-split-join
    desc: Split-join conhost executable name
    crit: suspicious
    conf: 0.9
    for: [javascript, vbs]
    if:
      type: text
      regex: '["'']con["''].{0,24}["'']host["''].{0,24}["'']\.ex["'']'
  - id: headless-flag-split-join
    desc: Split-join headless process flag
    crit: suspicious
    conf: 0.88
    for: [javascript, vbs]
    if:
      type: text
      regex: '["'']--h["''].{0,24}["'']ea["''].{0,24}["'']dles["'']'
  - id: powershell-hidden-window
    desc: PowerShell hidden window flag
    # Keep this higher-signal atom narrow: it requires PowerShell immediately
    # before the short hidden-window switch, with known maintenance/tooling
    # contexts excluded below.
    crit: suspicious
    conf: 0.8
    for: [batch, vbs, powershell, pe, oledoc]
    if:
      type: text
      regex: '(?i)powershell[^\n]{0,30}-w\s+h(idden)?'
    unless:
      # An inert -Command payload: `-c #` parses as a lone PowerShell comment
      # (the comment swallows the rest of the line) and `-c ""`/`-c ''` as an
      # empty command, so the hidden window has nothing to conceal. Stub
      # launchers and syntax fixtures carry the flag without hidden behavior.
      - type: text
        regex: '(?i)powershell[^\n]{0,30}-w\s+h(idden)?\s+-c(ommand)?\s+["'']?(#|"{2}|''{2})'
      - type: text
        regex: '(?i)#\s*Start-Process\b[^\r\n]{0,240}-WindowStyle\s+Hidden'
      - type: text
        regex: '(?i)\bDo\s+NOT\s+use\s+-WindowStyle\s+Hidden\b'
      # Known tooling that legitimately launches hidden PowerShell windows,
      # grouped into alternations to stay under the suppression budget.
      - type: text
        substr: '@kagdaci/repo-switcher'
      - type: text
        regex: 'TITLE OPEN RYZEN MASTER MAXIMIZED|TITLE OPEN WINDOWS WSL HERE'
      - type: text
        regex: 'PowerShell App Deployment Toolkit|AppDeployToolkitMain\.ps1'
      - type: text
        regex: '(?i)Docker Desktop|Get-Process\s+-Name\s+"Docker Desktop"'
      - id: documented-hidden-powershell-launcher

  - id: powershell-hidden-window-short
    desc: PowerShell short hidden-window flag
    crit: notable
    conf: 0.88
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)(^|[\s"''])(-w)\s+h(idden)?\b'

  - id: python-powershell-w-hidden
    desc: Python launches hidden-window PowerShell
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?i)powershell[^\n]{0,80}-W\s+Hidden'
  - id: lnk-powershell-windowstyle-hidden-argument
    desc: LNK PowerShell hidden window option
    crit: notable
    conf: 0.92
    for: [lnk]
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)(^|[\s;&|]|(powershell|pwsh)(\.exe)?\s+)-(WindowStyle|w)\s+Hidden\b'
  # Languages that build an argv list rather than a command line split the flag
  # and its value into adjacent quoted elements (`"-WindowStyle", "Hidden"`).
  # One matcher covers Go's []string{...} and the JS/TS args arrays that Node
  # and Deno spawn helpers take.
  - id: argv-array-windowstyle-hidden
    desc: Hidden-window flag in an argv array
    crit: notable
    conf: 0.94
    for: [go, javascript, typescript, python]
    if:
      type: text
      regex: '(?i)-WindowStyle["'']\s*,\s*["'']Hidden\b'
  - id: start-process-windowstyle-hidden
    desc: Start-Process hidden window flag
    crit: notable
    conf: 0.9
    for: [powershell, pe, go, python]
    if:
      type: text
      regex: '(?i)\bStart-Process\b[^\r\n]{0,200}-WindowStyle\s+Hidden\b'
  - id: powershell-hidden-argument-launch
    desc: PowerShell hidden process with argument
    crit: notable
    conf: 0.94
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bStart-Process\b[^\r\n]{1,160}-ArgumentList\s+[^\r\n]{1,160}-WindowStyle\s+Hidden\b'
  - id: start-minimized-window
    desc: Windows START requests a minimized window
    crit: notable
    conf: 0.82
    platforms: [windows, unix]
    for: [batch, powershell, javascript, html, python, shell, source]
    if:
      type: text
      regex: '(?i)\bs\^*t\^*a\^*r\^*t\s+["'']?["'']?\s+/min\b'
  - id: pyc-start-minimized-wait
    desc: Python bytecode launches a minimized process
    crit: notable
    conf: 0.9
    for: [pyc]
    if:
      type: raw
      regex: '(?i)\bstart\s+["'']?["'']?\s+/min\s+/wait\b'
  - id: start-minimized-self
    desc: Batch relaunches self minimized
    crit: suspicious
    conf: 0.92
    for: [batch]
    if:
      type: text
      regex: '(?i)\bstart\s+["'']?["'']?\s+/min\s+"?%~f0"?'
  - id: dotnet-create-no-window
    desc: .NET process window suppression
    crit: notable
    conf: 0.86
    for: [pe, csharp]
    if:
      type: text
      # Equivalent compiled setter and source assignment forms.
      regex: '(set_CreateNoWindow|CreateNoWindow\s*=\s*true)'
  - id: vb-create-no-window-flag-reference
    desc: VB hexadecimal CREATE_NO_WINDOW flag reference
    crit: notable
    conf: 0.93
    for: [vbs]
    if:
      type: text
      # Match the complete flag value, not a prefix of HKCR/HKCU/HKLM.
      # A literal alone does not establish an invocation or its arguments.
      regex: '(?i)&h0*8000000\b'
  - id: sfx-hidcon-prefix
    desc: SFX hidden console execution
    crit: suspicious
    conf: 0.93
    for: [pe]
    if:
      type: text
      regex: 'RunProgram\s*=\s*"hidcon:'
composite_rules:
  # One unless slot for tools whose source prints a hidden PowerShell launcher.
  - id: documented-hidden-powershell-launcher
    desc: Documented hidden PowerShell launcher source
    crit: exception
    conf: 0.96
    any:
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-ssh-installer-context
      - id: well-known/tool/development/agent/reason-machines::reason-machines-agent-context
      - id: well-known/tool/offensive/powersploit::powersploit-out-encoded-command
  - id: powershell-hidden-system-binary-launch
    desc: Hidden Windows system executable launch
    crit: notable
    conf: 0.96
    for: [powershell]
    near_lines: 1
    all:
      - id: micro-behaviors/fs/path/system::windows-system-executable-path
      - id: start-process-windowstyle-hidden
  - id: conhost-headless-split-join
    desc: Split-join conhost headless execution
    crit: suspicious
    conf: 0.92
    for: [javascript, vbs]
    all:
      - id: conhost-name-split-join
      - id: headless-flag-split-join
  - id: powershell-webrequest-hidden-launch-cooccurrence
    for: [powershell]
    desc: Hidden PowerShell request and launch paths co-occur
    crit: notable
    conf: 0.84
    attack: T1059.001,T1105,T1564.003
    # 4096 bytes still stitched unrelated occurrences together in installer
    # scripts that are themselves a few hundred lines dense with unrelated
    # setup steps: clawmetry's install.ps1 does a 127.0.0.1-only dashboard
    # health-check (Invoke-WebRequest) ~65 lines from an unrelated
    # Start-Process -WindowStyle Hidden that launches its OWN already
    # pip-installed local daemon module -- no data from the web request
    # feeds the launched process. Tighten to a true one-chain distance and
    # exclude a localhost-only probe, which is a self health-check, not
    # network stage retrieval.
    near_bytes: 512
    all:
      - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
      - id: micro-behaviors/process/create/exec::start-process-call
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: well-known/app/ai/media/comfy-test::generated-vm-template
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-ssh-installer-exception
      - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::iwr-localhost-uri
      # A file-backed IWR download is handled by the sibling rule that binds
      # OutFile, an executable URL, and the launched path.  This looser rule
      # cannot prove that an arbitrary web request feeds Start-Process.
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: "metadata/file/naming::test-directory-component"
