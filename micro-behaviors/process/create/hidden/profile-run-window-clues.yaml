defaults:
  platforms: [windows]
  for: [vbs, asp, html]

traits:
  - id: run-zero-numeric-arguments
    desc: Run call passes zero and numeric arguments
    crit: notable
    conf: 0.93
    for: [vbs, asp, html, javascript]
    if:
      type: text
      regex: '\.\s*Run[\s(]+[^;\r\n]{1,240},\s*0\s*,\s*[01]\b'
      case_insensitive: true

composite_rules:
  - id: chr-encoded-run-window-clues
    desc: Chr-encoded Run and window-style clues
    crit: notable
    conf: 0.95
    near_bytes: 512
    all:
      - id: metadata/lang/encoding/shape/fragment::chr-frag-dot-ru
      - id: metadata/lang/encoding/shape/fragment::chr-frag-run-tail
      - id: metadata/lang/encoding/shape/fragment::chr-frag-comma-zero-comma

  - id: run-window-style-clues
    desc: Run call and window-style clues
    crit: notable
    conf: 0.94
    for: [vbs, asp, html, javascript]
    any:
      - id: run-zero-numeric-arguments
      - id: chr-encoded-run-window-clues
      - id: micro-behaviors/data/control-flow/dispatch/run::vbs-run-style-zero
      - id: micro-behaviors/data/control-flow/dispatch/run::run-zero-boolean-arguments
