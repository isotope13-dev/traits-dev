defaults:
  platforms: [windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-hidden-policy-bypass-powershell-launch
    desc: Node hidden PowerShell Bypass launch
    crit: suspicious
    conf: 0.98
    near_bytes: 128
    all:
      - id: micro-behaviors/process/create/exec::node-powershell-launch
      - id: micro-behaviors/process/create/flags::powershell-policy-bypass-argv-pair
      - id: micro-behaviors/process/create/hidden::argv-array-windowstyle-hidden
