defaults:
  platforms: [windows]
  for: [javascript, typescript]

traits:
  # Any argv binding of -ExecutionPolicy Bypass to a launch without a console
  # window. Node's windowsHide option only suppresses console flashing for an
  # attached child and is the default in common wrappers; desktop helpers that
  # run bundled scripts and read their output use it routinely. The PowerShell
  # -WindowStyle Hidden switch and detached background launches carry the
  # concealment claim in their own suspicious traits.
  - id: node-hidden-policy-bypass-powershell-launch
    desc: Windowless PowerShell launch with Bypass option
    crit: notable
    conf: 0.98
    # The detached-launch trait reports the same spawn call more precisely.
    unless:
      - id: micro-behaviors/process/create/hidden::node-detached-hidden-powershell-policy-bypass
    if:
      type: tree-sitter
      query: |
        ((call_expression
           function: [(member_expression property: (property_identifier) @method)
                      (identifier) @method
                      (parenthesized_expression (sequence_expression (number) (member_expression property: (property_identifier) @method)))]
           arguments: (arguments
             . (string (string_fragment) @program)
             . (array
                 (string (string_fragment) @policy) . (string (string_fragment) @bypass)
                 (string (string_fragment) @window) . (string (string_fragment) @hidden))))
         (#match? @method "^(spawn|spawnSync|execFile|execFileSync)$")
         (#match? @program "(?i)(^|[/\\\\])powershell(\\.exe)?$")
         (#match? @policy "(?i)^-(ExecutionPolicy|EP)$") (#match? @bypass "(?i)^Bypass$")
         (#match? @window "(?i)^-WindowStyle$") (#match? @hidden "(?i)^Hidden$"))
        ((call_expression
           function: [(member_expression property: (property_identifier) @method)
                      (identifier) @method
                      (parenthesized_expression (sequence_expression (number) (member_expression property: (property_identifier) @method)))]
           arguments: (arguments
             . (string (string_fragment) @program)
             . (array (string (string_fragment) @policy) . (string (string_fragment) @bypass))
             . (object (pair key: (property_identifier) @hide value: (unary_expression operator: "!" argument: (number) @zero)))))
         (#match? @method "^(spawn|spawnSync|execFile|execFileSync)$")
         (#match? @program "(?i)(^|[/\\\\])powershell(\\.exe)?$")
         (#match? @policy "(?i)^-(ExecutionPolicy|EP)$") (#match? @bypass "(?i)^Bypass$")
         (#eq? @hide "windowsHide") (#eq? @zero "0"))
        ((call_expression
           function: [(member_expression property: (property_identifier) @method)
                      (identifier) @method
                      (parenthesized_expression (sequence_expression (number) (member_expression property: (property_identifier) @method)))]
           arguments: (arguments
             . (string (string_fragment) @program)
             . (array (string (string_fragment) @policy) . (string (string_fragment) @bypass))
             . (object (pair key: (property_identifier) @hide value: (true)))))
         (#match? @method "^(spawn|spawnSync|execFile|execFileSync)$")
         (#match? @program "(?i)(^|[/\\\\])powershell(\\.exe)?$")
         (#match? @policy "(?i)^-(ExecutionPolicy|EP)$") (#match? @bypass "(?i)^Bypass$")
         (#eq? @hide "windowsHide"))
        ((call_expression
           function: [(member_expression property: (property_identifier) @method)
                      (identifier) @method
                      (parenthesized_expression (sequence_expression (number) (member_expression property: (property_identifier) @method)))]
           arguments: (arguments
             . (string (string_fragment) @program)
             . (array
                 (string (string_fragment) @window) . (string (string_fragment) @hidden)
                 (string (string_fragment) @policy) . (string (string_fragment) @bypass))))
         (#match? @method "^(spawn|spawnSync|execFile|execFileSync)$")
         (#match? @program "(?i)(^|[/\\\\])powershell(\\.exe)?$")
         (#match? @policy "(?i)^-(ExecutionPolicy|EP)$") (#match? @bypass "(?i)^Bypass$")
         (#match? @window "(?i)^-WindowStyle$") (#match? @hidden "(?i)^Hidden$"))

  # PowerShell's own -WindowStyle Hidden switch (any accepted abbreviation)
  # bound with -ExecutionPolicy Bypass in the same argv: the child is asked to
  # hide itself while ignoring script policy.
  - id: node-window-style-hidden-policy-bypass-launch
    desc: PowerShell WindowStyle Hidden with Bypass
    crit: suspicious
    conf: 0.95
    unless:
      - id: micro-behaviors/process/create/hidden::node-detached-hidden-powershell-policy-bypass
    if:
      type: tree-sitter
      query: |
        ((call_expression
           function: [(member_expression property: (property_identifier) @method)
                      (identifier) @method
                      (parenthesized_expression (sequence_expression (number) (member_expression property: (property_identifier) @method)))]
           arguments: (arguments
             . (string (string_fragment) @program)
             . (array
                 (string (string_fragment) @policy) . (string (string_fragment) @bypass)
                 (string (string_fragment) @window) . (string (string_fragment) @hidden))))
         (#match? @method "^(spawn|spawnSync|execFile|execFileSync)$")
         (#match? @program "(?i)(^|[/\\\\])powershell(\\.exe)?$")
         (#match? @policy "(?i)^[-/](ep|ex(e(c(u(t(i(o(n(p(o(l(i(cy?)?)?)?)?)?)?)?)?)?)?)?)?)$") (#match? @bypass "(?i)^Bypass$")
         (#match? @window "(?i)^[-/]w(i(n(d(o(w(s(t(y(le?)?)?)?)?)?)?)?)?)?$") (#match? @hidden "(?i)^(Hidden|1)$"))
        ((call_expression
           function: [(member_expression property: (property_identifier) @method)
                      (identifier) @method
                      (parenthesized_expression (sequence_expression (number) (member_expression property: (property_identifier) @method)))]
           arguments: (arguments
             . (string (string_fragment) @program)
             . (array
                 (string (string_fragment) @window) . (string (string_fragment) @hidden)
                 (string (string_fragment) @policy) . (string (string_fragment) @bypass))))
         (#match? @method "^(spawn|spawnSync|execFile|execFileSync)$")
         (#match? @program "(?i)(^|[/\\\\])powershell(\\.exe)?$")
         (#match? @policy "(?i)^[-/](ep|ex(e(c(u(t(i(o(n(p(o(l(i(cy?)?)?)?)?)?)?)?)?)?)?)?)?)$") (#match? @bypass "(?i)^Bypass$")
         (#match? @window "(?i)^[-/]w(i(n(d(o(w(s(t(y(le?)?)?)?)?)?)?)?)?)?$") (#match? @hidden "(?i)^(Hidden|1)$"))
