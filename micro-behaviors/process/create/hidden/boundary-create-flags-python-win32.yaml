defaults:
  platforms: [windows]
  for: [python]
traits:
  - id: python-win32-hidden-startup-launch
    desc: Win32 launch hides startup window and console
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((block
          (expression_statement (assignment left: (attribute
            object: (identifier) @startup attribute: (identifier) @flags)
            right: (integer) @use))
          . (expression_statement (assignment left: (attribute
            object: (identifier) @startup2 attribute: (identifier) @show)
            right: (integer) @hide))
          (expression_statement (call function: (attribute) @launch
            arguments: (argument_list . (_) (_) (_) (_) (_) (integer) @creation (_) (_)
              (call function: (attribute) @byref arguments: (argument_list .
                (identifier) @passed .)) (_))))) @startup_launch
          (#eq? @startup @startup2) (#eq? @startup @passed)
          (#eq? @flags "dwFlags") (#match? @use "^(0x0*1|1)$")
          (#eq? @show "wShowWindow") (#eq? @hide "0")
          (#match? @creation "^(0x0*8000000|134217728)$")
          (#eq? @launch "ctypes.windll.kernel32.CreateProcessW")
          (#eq? @byref "ctypes.byref"))
