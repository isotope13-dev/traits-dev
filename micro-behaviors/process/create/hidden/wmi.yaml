traits:
- for:
  - javascript
  - vbs
  crit: notable
  conf: 0.96
  id: wmi-hidden-process-startup
  desc: WMI startup instance uses hidden window
  if:
    type: text
    regex: (?is)\bSpawnInstance_\s*\(\s*\).{0,180}\bShowWindow\s*=\s*0\b
- for: &id001
  - javascript
  - vbs
  - html
  - text
  - data
  id: process-startup-create-variable
  desc: WMI startup object creates a process
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?is)SpawnInstance_\s*(\(\s*\))?[\s\S]{0,700}\b[A-Za-z_$][A-Za-z0-9_$]{1,40}\.Create\s*\(
- for:
  - javascript
  - html
  id: js-spawninstance-hidden-window
  desc: WMI SpawnInstance followed by hidden window
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?is)SpawnInstance_\s*\(\s*\)[\s\S]{0,700}\.\s*ShowWindow\s*=\s*0
- for:
  - javascript
  - html
  id: js-hidden-window-process-create
  desc: Hidden window followed by WMI Create
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?is)\.\s*ShowWindow\s*=\s*0[\s\S]{0,700}\.\s*Create\s*\(
composite_rules:
- for:
  - javascript
  - html
  id: js-hidden-process-create-sequence
  desc: WMI startup and hidden Create sequence
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/process/create/hidden::js-spawninstance-hidden-window
  - id: micro-behaviors/process/create/hidden::js-hidden-window-process-create
- for: *id001
  id: wmi-showwindow-hidden-property
  desc: Assigns hidden process-window setting
  crit: notable
  conf: 0.88
  any:
  - id: micro-behaviors/process/create/flags::show-window-hidden-assignment
  unless:
  - id: well-known/lib/ui/textmate::frozen-json-grammar-module
- for: *id001
  id: wmi-hidden-variable-process-create
  desc: WMI hidden variable process create
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/process/create/hidden::process-startup-create-variable
  - id: micro-behaviors/process/create/hidden::wmi-showwindow-hidden-property
  any:
  - id: micro-behaviors/os/wmi/query::process-startup-spawninstance-symbol
  - id: micro-behaviors/os/wmi/query::process-startup-spawninstance-text
- for:
  - javascript
  - html
  id: wmi-hidden-four-argument-process-create
  desc: WMI creates a hidden process with startup configuration
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/data/control-flow/dispatch::create-four-argument-call
  - id: micro-behaviors/os/wmi/query::process-startup-spawninstance-text
  - id: micro-behaviors/process/create/hidden::wmi-showwindow-hidden-property
- for: *id001
  id: wmi-hidden-startup-process
  desc: Configures hidden WMI process startup
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/os/wmi/query::process-startup-spawninstance-symbol
  - id: micro-behaviors/process/create/hidden::wmi-showwindow-hidden-property
  any:
  - id: micro-behaviors/os/com/invoke::getobject-wmi-call
  - id: micro-behaviors/os/wmi/query::process-startup-fragmented
- for:
  - javascript
  id: wmi-getobject-hidden-process-create
  desc: WMI GetObject creates hidden process
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/os/com/invoke::getobject-wmi-call
  - id: micro-behaviors/process/create/hidden::wmi-hidden-four-argument-process-create
defaults:
  platforms:
  - windows
