defaults:
  platforms:
  - windows
  for:
  - batch
  - powershell
traits:
- id: hidden-powershell-public-python-script
  desc: Hidden PowerShell invokes Public Python script
  crit: suspicious
  conf: 0.98
  if:
    type: yara
    source: 'rule hidden_public_python { strings: $command = /powershell(\.exe)?[ \t]+-windowstyle[ \t]+hidden[
      \t]+[a-z]:[\\\/]+Users[\\\/]+Public[\\\/]+[^\s;|&]{1,120}[\\\/]+python(\.exe)?[ \t]+[a-z]:[\\\/]+Users[\\\/]+Public[\\\/]+[^\s;|&]{1,160}\.py([;\r\n]|$)/
      nocase condition: $command }'
