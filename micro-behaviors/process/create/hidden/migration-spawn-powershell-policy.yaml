# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  platforms:
  - windows
  for:
  - javascript
  - typescript
traits:
- id: node-detached-hidden-powershell-policy-bypass
  desc: Detached hidden PowerShell bypass launch
  crit: suspicious
  conf: 0.98
  if:
    type: tree-sitter
    language: javascript
    query: "((call_expression\n  function: [(identifier) @spawn\n    (member_expression property: (property_identifier)\
      \ @spawn)]\n  arguments: (arguments\n    . (string (string_fragment) @executable)\n    . (array) @argv\n \
      \   . (object\n        (pair key: [(property_identifier) @detached\n          (string (string_fragment) @detached)]\
      \ value: (_) @detach_value)\n        (pair key: [(property_identifier) @hidden\n          (string (string_fragment)\
      \ @hidden)] value: (_) @hide_value))))\n  (#eq? @spawn \"spawn\")\n  (#match? @executable \"(?i)(^|[/\\\\\\\
      \\])(?:powershell|pwsh)(?:\\\\.exe)?$\")\n  (#match? @argv \"(?i)(?:executionpolicy|-ep\\\\b).{0,32}bypass\")\n  (#eq?\
      \ @detached \"detached\")\n  (#eq? @hidden \"windowsHide\")\n  (#match? @detach_value \"^(true|!0)$\")\n \
      \ (#match? @hide_value \"^(true|!0)$\"))\n"
