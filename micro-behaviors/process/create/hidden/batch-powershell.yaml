defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: bat-start-min-hidden-powershell
    desc: BAT starts minimized hidden PowerShell
    crit: suspicious
    conf: 0.85
    if:
      type: text
      regex: (?i)start\s+/min\s+powershell\s+-w\s+h

  - id: powershell-bypass-file-hidden-flags
    desc: PowerShell bypass, file and hidden flags
    crit: suspicious
    conf: 0.9
    for: [scripts, binaries]
    if:
      type: text
      regex: -ep\s+bypass.{0,80}-file.{0,200}-w\s+hidden|-w\s+hidden.{0,80}-ep\s+bypass
