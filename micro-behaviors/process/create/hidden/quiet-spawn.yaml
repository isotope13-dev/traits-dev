defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript

composite_rules:
  - id: detached-silent-hidden-spawn
    desc: Detached, ignored-stdio and windowsHide options with unref()
    crit: notable
    conf: 0.98
    all:
      - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
      - id: metadata/file/profile/command-options::node-windowshide-true-option
