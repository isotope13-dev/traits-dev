defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - package.json
  size_max: 5000000

composite_rules:
- id: scripts-startup-path-hidden-spawn
  for: [javascript]
  desc: Scripts startup path and hidden spawn
  crit: suspicious
  conf: 0.99
  all:
  - id: micro-behaviors/fs/path/script::scripts-startup-js-path-reference
  - id: micro-behaviors/process/create/hidden::detached-silent-hidden-spawn
