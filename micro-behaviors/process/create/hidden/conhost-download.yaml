defaults:
  platforms: [windows]
  for: [pe, dll, powershell, batch]
  crit: notable
traits:
  - id: headless-hidden-powershell-invocation
    desc: Headless hidden PowerShell invocation
    conf: 0.98
    if:
      type: text
      regex: '--headless\s+powershell\b.{0,70}-WindowStyle\s+Hidden\b'
  - id: powershell-hidden-processstartinfo-command
    desc: PowerShell starts hidden ProcessStartInfo
    conf: 0.98
    if:
      type: text
      substr: '$psi.WindowStyle = [System.Diagnostics.ProcessWindowStyle]::Hidden; [System.Diagnostics.Process]::Start($psi)'
