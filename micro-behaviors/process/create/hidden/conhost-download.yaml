defaults:
  platforms: [windows]
  for: [pe, dll, powershell, batch]
  crit: notable
traits:
  - id: headless-hidden-powershell-invocation
    desc: Headless hidden PowerShell invocation
    conf: 0.98
    for: [scripts, source, pe, dll, lnk]
    if:
      type: text
      # The console host may have been renamed. Match its launch syntax,
      # including PowerShell Core and abbreviated hidden-window switches.
      regex: '(?i)--headless\s+(powershell|pwsh)(\.exe)?\b.{0,70}-w(indowstyle)?\s+h(idden)?\b'
  - id: powershell-hidden-processstartinfo-command
    desc: PowerShell starts hidden ProcessStartInfo
    conf: 0.98
    if:
      type: text
      substr: '$psi.WindowStyle = [System.Diagnostics.ProcessWindowStyle]::Hidden; [System.Diagnostics.Process]::Start($psi)'
