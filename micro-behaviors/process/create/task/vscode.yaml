defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: execute-task-call
    desc: Calls the tasks.executeTask API
    if:
      type: text
      regex: '\.tasks\.executeTask\s*\('

composite_rules:
  - id: unattended-github-shell-task
    desc: Shell task with unattended GitHub command
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/create/shell/bridge::shell-execution-constructor
      - id: micro-behaviors/process/create/shell/package::js-npx-unattended-github-command
      - id: execute-task-call
