defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  # Focus and visibility are separate VS Code settings. Neither proves intent.
  - id: output-focus-disabled
    desc: Task output does not take keyboard focus
    if:
      type: tree-sitter
      query: |
        ((assignment_expression
          left: (member_expression
            object: (member_expression property: (property_identifier) @options)
            property: (property_identifier) @setting)
          right: (unary_expression) @flag) @assignment
          (#eq? @options "presentationOptions")
          (#eq? @setting "focus")
          (#match? @flag "^!1$"))
        ((assignment_expression
          left: (member_expression
            object: (member_expression property: (property_identifier) @options)
            property: (property_identifier) @setting)
          right: (false)) @assignment
          (#eq? @options "presentationOptions")
          (#eq? @setting "focus"))

  - id: output-reveal-never
    desc: Task terminal is configured never to reveal
    if:
      type: tree-sitter
      query: |
        ((assignment_expression
          left: (member_expression
            object: (member_expression property: (property_identifier) @options)
            property: (property_identifier) @setting)
          right: (member_expression
            object: (member_expression property: (property_identifier) @enum)
            property: (property_identifier) @value)) @assignment
          (#eq? @options "presentationOptions")
          (#eq? @setting "reveal")
          (#eq? @enum "TaskRevealKind")
          (#eq? @value "Never"))

  - id: execute-task-call
    desc: Calls the tasks.executeTask API
    if:
      type: text
      regex: '\.tasks\.executeTask\s*\('

composite_rules:
  - id: unattended-github-shell-task
    desc: GitHub npx command near a task execution call
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/create/shell/bridge::github-runner-shell-execution
      - id: execute-task-call
