defaults:
  platforms: [windows]
  for: [oledoc]
  conf: 0.98
traits:
  - id: ole-shellcode-file-drop-exec
    desc: OLE shellcode writes and executes file
    crit: notable
    if:
      type: hex
      pattern: 'C7 45 ?? 43 72 65 61 [0-64] C7 45 ?? 57 72 69 74 [0-64] C7 45 ?? 57 69 6E 45 [0-64] C7 45 ?? 43 6C 6F 73'

  - id: ole-shellcode-egghunter
    desc: OLE shellcode memory egg hunter
    crit: notable
    if:
      type: hex
      pattern: '33 DB [0-16] 3D ?? ?? ?? ?? 75 ?? 43 83 FB 02 75 ?? 83 C6 04 FF E6'

  - id: ole-shellcode-decoder-loop
    desc: OLE shellcode decoder loop
    crit: notable
    if:
      type: hex
      pattern: '5E 56 [0-2] 8B FE [0-2] AC [1-4] AA 49 75 (F8|F9) C3 E8 (ED|EE) FF FF FF'
