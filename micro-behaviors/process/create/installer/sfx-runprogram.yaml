defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: sfx-multiple-runprogram-stages
    desc: SFX config selects multiple RunProgram commands
    crit: notable
    conf: 0.98
    if:
      type: text
      # Anchor on the assignment so an unrelated RunProgram API name does not match.
      regex: 'RunProgram\s*=\s*"[^"\n]{1,128}'
    count_min: 2
  - id: sfx-runprogram-executable
    desc: SFX RunProgram selects an executable
    crit: notable
    conf: 0.94
    attack: T1204.002
    if:
      type: text
      # Permit escaped quotes in the SFX value, including quoted %%T paths.
      regex: 'RunProgram\s*=\s*"(\\"|[^"\r\n]){1,128}\.exe\b'
  - id: sfx-runprogram-affiliate-site-id
    desc: SFX RunProgram passes numeric affiliate site_id
    crit: suspicious
    conf: 0.95
    attack: T1204.002
    if:
      type: text
      regex: '(?i)RunProgram\s*=\s*"[^"\r\n]{0,160}site_id[^"\r\n]{0,40}\d{3,}'
