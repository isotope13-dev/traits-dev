defaults:
  platforms: [windows]
  for: [oledoc]

traits:
  - id: msi-wscript-powershell-launch-text
    desc: MSI text launches PowerShell via WScript
    crit: notable
    conf: 0.98
    attack: T1059.001
    if:
      type: text
      regex: '(?i)CreateObject.{0,80}powershell.{0,40}-NoP.{0,40}-Enc'
  - id: msi-powershell-hidden-or-encoded-option-text
    desc: MSI hidden or encoded PS option
    crit: suspicious
    conf: 0.98
    attack: T1059.001,T1027
    if:
      type: text
      regex: '(?i)powershell(\.exe)?.{0,30}-NoP.{0,30}-W.{0,30}(Hidden|Enc)'
  - id: msi-wscript-powershell-launch
    desc: MSI runs PowerShell through WScript
    crit: notable
    conf: 0.98
    attack: T1059.001
    if:
      type: raw
      regex: '(?i)CreateObject.{0,80}powershell.{0,50}-NoP.{0,30}-Enc'
  - id: msi-powershell-encoded-window-option-raw
    desc: MSI raw PowerShell window and Enc options
    crit: notable
    conf: 0.98
    attack: T1059.001,T1027
    if:
      type: raw
      regex: '(?i)powershell(\.exe)?.{0,30}-NoP.{0,30}-W.{0,30}-Enc\b'
  - id: msi-encoded-wscript-shell-reference
    desc: Decoded MSI references WScript.Shell
    crit: notable
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      substr: Wscript.Shell
  - id: msi-encoded-hidden-window-option
    desc: Decoded MSI uses a hidden window option
    crit: notable
    conf: 0.98
    attack: T1564.003
    if:
      type: encoded
      encoding: base64
      substr: '-W Hidden'


composite_rules:
  - id: msi-wscript-powershell-option-profile
    desc: MSI text has WScript encoded PS options
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/installer::msi-wscript-powershell-launch-text
      - id: micro-behaviors/process/create/installer::msi-powershell-hidden-or-encoded-option-text
  - id: msi-hidden-powershell-launch-encoded
    desc: MSI decoded layer launches hidden encoded PowerShell
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/installer::msi-encoded-wscript-shell-reference
      - id: micro-behaviors/process/create/installer::msi-encoded-hidden-window-option
      - id: micro-behaviors/process/create/installer::msi-powershell-executable-encoded
      - id: micro-behaviors/process/create/installer::msi-encoded-command-option
  - id: msi-powershell-launch-profile
    desc: MSI PowerShell launch with encoded options
    crit: suspicious
    conf: 0.99
    any:
      - id: micro-behaviors/process/create/installer::msi-wscript-powershell-option-profile
      - id: micro-behaviors/process/create/installer::msi-hidden-powershell-launch-encoded
