# Windows installer quiet/passive switches (/quiet, /passive, /qn). Every
# unattended setup script passes one; the msiexec composites in
# objectives/execution/lolbin/os add the package verb and ALLUSERS.
traits:
- id: installer-silent-switch
  desc: Installer silent-mode command-line switch
  platforms: [windows]
  crit: notable
  conf: 0.88
  for: [batch, powershell, python]
  if:
    type: text
    regex: '/(passive|quiet|qn)\b'
    case_insensitive: true
