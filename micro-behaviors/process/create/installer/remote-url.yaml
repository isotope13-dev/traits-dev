defaults:
  platforms: [windows]

traits:
  - id: msiexec-remote-url-install
    desc: msiexec installs from a remote URL
    crit: notable
    conf: 0.9
    for: [batch, powershell, python, javascript, typescript, vbs, csharp]
    if:
      type: text
      regex: '(?i)\bmsiexec(\.exe)?\b[^\n"'']{0,30}/i\s+["'']?https?://'
