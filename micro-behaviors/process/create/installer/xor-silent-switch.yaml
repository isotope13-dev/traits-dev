defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
  attack: T1204.002

traits:
  # Unattended-install flags for a downloaded setup program, held as a
  # XOR-masked string so the argument list is not visible in the binary.
  - id: xor-decoded-silent-installer-flags
    desc: XOR-decoded silent installer flags
    if:
      type: encoded
      encoding: xor
      regex: '(?i)/verysilent\b.{0,40}/(norestart|nocancel|suppressmsgboxes)'
