defaults:
  platforms: [windows]
  for: [pe]
  attack: T1204.002

traits:
  - id: sfx-exchanger-d-runprogram
    desc: SFX RunProgram targets Exchanger-D.exe
    crit: notable
    conf: 0.99
    if:
      type: raw
      regex: '(?i)RunProgram\s*=\s*"\\"%%T\\\\Exchanger-D\.exe'
  # Dynamics_Soni.exe is a legitimate Hikvision helper. Its basename is useful
  # here only as the executable selected by an embedded SFX RunProgram line;
  # the standalone signed helper therefore does not match this observation.
  - id: sfx-dynamics-soni-runprogram
    desc: SFX RunProgram targets Dynamics_Soni.exe
    crit: notable
    conf: 0.99
    if:
      type: raw
      regex: '(?i)RunProgram\s*=\s*"\\"%%T\\\\Dynamics_Soni\.exe'
