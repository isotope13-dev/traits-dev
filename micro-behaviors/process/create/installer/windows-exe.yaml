defaults:
  platforms: [windows]
  for: [scripts]
  crit: notable

traits:
  - id: quiet-explicit-target-install
    desc: Quiet install sets explicit target directory
    conf: 0.9
    if:
      type: text
      regex: '(?i)/(quiet|passive)\b[^\r\n]{0,180}\bTargetDir\s*='

  - id: quiet-python-user-install
    desc: Quiet per-user Python installation options
    conf: 0.9
    if:
      type: text
      substr: "/quiet InstallAllUsers=0 PrependPath=1"
