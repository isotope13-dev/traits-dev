defaults:
  platforms: [macos]
  for: [macho, objc, swift, applescript]
traits:
  # Shell invocations use the cached call/argument fact in package-manager/
  # sideload. This text pattern is only a reference in other formats: shell
  # heredoc documentation must not supply execution evidence to a dropper.
  - id: macos-pkg-root-command-reference
    desc: References package install targeting root
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: /usr/sbin/installer\s+-pkg\b.{0,160}-target\s+/
