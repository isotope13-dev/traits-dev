# Download and msiexec evidence is bounded to twelve lines. No matcher leg
# binds IWR's OutFile to msiexec's package argument.
defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  - id: hidden-decimal-url-msi-install-profile
    desc: Hidden batch decodes URL near MSI install
    crit: suspicious
    conf: 0.99
    near_lines: 12
    all:
      - id: micro-behaviors/data/decode/char-code::powershell-decimal-triplet-ascii-decode
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/process/create/installer::msiexec-package-verb
      - id: micro-behaviors/process/argument/option::powershell-hidden-command-text
    any:
      - id: micro-behaviors/process/argument/option::powershell-policy-bypass-flag
      - id: micro-behaviors/os/privilege/elevation::runas-verb
    needs: 1

  - id: elevated-hidden-msi-download-profile
    desc: Hidden elevated MSI near IWR download
    crit: suspicious
    conf: 0.98
    near_lines: 12
    all:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/process/create/installer::msiexec-package-verb
      - id: micro-behaviors/process/argument/option::powershell-policy-bypass-flag
      - id: micro-behaviors/os/privilege/elevation::runas-verb
    any:
      - id: micro-behaviors/process/argument/option::powershell-hidden-command-text
      - id: micro-behaviors/data/decode/char-code::powershell-decimal-triplet-ascii-decode
    needs: 1
