# Unattended-install command templates pair a quiet switch (/qn, /S,
# /verysilent) with /norestart. Interactive installers and package scripts
# take the switches one at a time; the adjacent pair appears in command
# lines composed by an installer driver.
defaults:
  platforms: [windows]
  crit: notable
  conf: 0.9
  for: [pe, dll, batch, powershell, vbs, javascript, python]
traits:
  - id: quiet-norestart-switch-combo
    desc: Unattended install switch paired with no-restart
    if:
      type: text
      regex: '(?i)(^|[\s"''])/(qn|S|verysilent|silent)\s+/norestart'
