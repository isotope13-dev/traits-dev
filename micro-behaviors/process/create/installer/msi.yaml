defaults:
  platforms: [windows]
  for: [batch, powershell, vbs, javascript, python, scripts, lnk]
  attack: T1105,T1218.007

traits:
  - id: msiexec-package-verb
    desc: msiexec package install verb
    crit: notable
    conf: 0.92
    for: [batch, powershell, vbs, javascript, python, scripts]
    if:
      type: text
      regex: '(?i)\bmsiexec(\.exe)?\b[^\r\n]{0,64}[-/](i|a|x|package)\b'
  - id: remote-msi-package-url
    desc: Remote Windows Installer package URL
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)https?://[^\s"<>]{1,120}\.(msi|msix)(["''<>\s?#]|$)'
  - id: lnk-remote-msiexec-url
    desc: LNK passes remote MSI URL to msiexec
    crit: suspicious
    conf: 0.98
    for: [lnk]
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bmsiexec(\.exe)?\b.{0,80}[/\-](i|package)\b.{0,80}https?://'
composite_rules:
  - id: remote-msi-download-install
    desc: Downloads then invokes Windows Installer package
    crit: notable
    conf: 0.96
    near_lines: 4
    all:
      - id: remote-msi-package-url
    any:
      - id: msiexec-package-verb
      - id: lnk-remote-msiexec-url

  - id: powershell-variable-msi-quiet-install
    desc: PowerShell quietly installs variable MSI
    crit: notable
    conf: 0.95
    for: [powershell]
    near_lines: 2
    all:
      - id: micro-behaviors/process/create/start-process::start-process-msiexec
      - id: micro-behaviors/process/argument/option::variable-msi-quiet-install-args
