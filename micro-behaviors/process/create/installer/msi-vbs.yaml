defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1218.007

traits:
  - id: vbs-msiexec-quiet-install
    desc: VBScript supports quiet MSI installation
    crit: notable
    conf: 0.97
    if:
      type: text
      # VBScript often assembles the command over more than one statement,
      # including appending quiet switches only when a runtime option is set.
      regex: '(?is)\bmsiexec(\.exe)?\b.{0,240}?\s/i\s+.{1,240}?\s/(q|qn|quiet)\b'
