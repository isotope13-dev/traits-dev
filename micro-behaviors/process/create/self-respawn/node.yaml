defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: node-aliased-current-file-argv
    desc: Aliased Node launch uses current file
    crit: component
    if:
      type: text
      regex: '\b[\w$]{1,12}\s*\(\s*process\s*\[[^\]\r\n]{1,80}\]\s*,\s*\[\s*__filename\s*\]'

  - id: node-copied-process-env-option
    desc: Node launch copies process environment
    crit: component
    if:
      type: text
      regex: '\benv\s*:\s*\{\s*\.\.\.process\.env\b'

composite_rules:
  - id: node-aliased-current-file-respawn
    desc: Aliased Node current-file respawn
    crit: notable
    conf: 0.93
    mbc: F0011
    attack: T1059.007
    near_bytes: 512
    all:
      - id: node-aliased-current-file-argv
      - id: node-copied-process-env-option
