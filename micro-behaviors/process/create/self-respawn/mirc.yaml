# mIRC exit-handler relaunch.
#
# An `on *:EXIT:` handler that `run`s the mIRC executable turns closing the
# client into a respawn: the user (or a sandbox) kills the window and the program
# starts right back up. Ordinary scripts save settings on exit; they never
# launch a new process there.
defaults:
  platforms: [windows]
  for: [mirc]
traits:
  - id: mirc-exit-relaunch
    desc: mIRC relaunches its own client on exit
    crit: notable
    conf: 0.9
    if:
      type: text
      # The client is named by `$mircexe` or by a mirc*.exe filename.
      regex: '(?i):exit:[^\r\n]{0,160}\brun\s+["$+\s]{0,6}(\$mircexe|\S*mirc\w*\.exe)'
