defaults:
  crit: notable
  conf: 0.95
  platforms: [unix, windows]
  for: [shell, powershell]

traits:
  - id: gh-admin-merge-command
    desc: GitHub CLI performs admin merge
    if:
      type: text
      regex: '(?i)\bgh\s+pr\s+merge\b.{0,120}\s--admin\b'
  - id: gh-delete-branch-protection-command
    desc: GitHub CLI deletes branch protection
    if:
      type: text
      regex: '(?i)\bgh\s+api\b.{0,80}\s-X\s+DELETE\b.{0,120}/branches/.{1,80}/protection\b'
  - id: gh-delete-ruleset-command
    desc: GitHub CLI deletes repository ruleset
    if:
      type: text
      regex: '(?i)\bgh\s+ruleset\s+delete\b'
  - id: gh-release-create-command
    desc: GitHub CLI creates release
    if:
      type: text
      regex: '(?i)\bgh\s+release\s+create\b'
  - id: gh-gist-create-command
    desc: GitHub CLI creates public gist
    if:
      type: text
      regex: '(?i)\bgh\s+gist\s+create\b'
