# Git patch application capabilities used by repository patch workflows.
# The indexed three-way combination is unusual enough to aid triage, but
# exploit intent belongs in the Git-hook objective composites.
defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: git-apply-cli-reference
    desc: Git apply command-line reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bgit\s+apply\b'

  - id: git-apply-argv-reference
    desc: Git apply argument-list reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']git["'']\s*,\s*["'']apply["'']'

  - id: git-apply-builder-reference
    desc: Git apply builder reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(NewCommand|Command)\(\s*["'']apply["'']'

  # Individual options are incomplete evidence and remain components: a bare
  # `--cached` token is equally `git diff --cached` or `git status --cached`,
  # and none of these flags names the patch-application command itself. The
  # suspicious observation is the complete indexed three-way option cluster.
  - id: git-index-option-token
    desc: Git --index option token
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_-])--index([^A-Za-z0-9_-]|$)'
  - id: git-recount-option-token
    desc: Git --recount option token
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_-])--recount([^A-Za-z0-9_-]|$)'
  - id: git-cached-option-token
    desc: Git --cached option token
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_-])--cached([^A-Za-z0-9_-]|$)'
  - id: git-binary-option-token
    desc: Git --binary option token
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_-])--binary([^A-Za-z0-9_-]|$)'
  - id: git-three-way-option-token
    desc: Git -3 option token
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '["'']-3["'']'

composite_rules:
  - id: git-apply-command-reference
    desc: Git apply command reference
    crit: notable
    conf: 0.92
    any:
      - id: git-apply-cli-reference
      - id: git-apply-argv-reference
      - id: git-apply-builder-reference

  - id: git-indexed-three-way-fallback
    desc: Git apply indexed cached binary three-way fallback
    crit: suspicious
    conf: 0.97
    near_lines: 8
    all:
      - id: git-apply-command-reference
      - id: git-index-option-token
      - id: git-recount-option-token
      - id: git-cached-option-token
      - id: git-binary-option-token
      - id: git-three-way-option-token
