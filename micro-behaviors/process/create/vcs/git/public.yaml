# Cloning a repository from a public code forge is a neutral VCS capability.
# The answer/ground-truth retrieval objective adds the intent-specific context.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [scripts, markdown]
  attack: T1105

traits:
  - id: git-clone-command
    desc: Git clone command
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bgit\s+clone\s+\S+'

  - id: git-clone-argv
    desc: Git clone argument sequence
    conf: 0.9
    if:
      type: text
      regex: '["'']git["'']\s*,\s*["'']clone["'']'

  - id: git-mirror-option
    desc: Git complete-mirror option
    crit: component
    conf: 0.92
    if:
      type: text
      exact: --mirror

composite_rules:
  - id: git-mirror-clone
    desc: Git clone requests a complete mirror
    conf: 0.94
    all:
      - id: git-mirror-option
    any:
      - id: git-clone-command
      - id: git-clone-argv
    near_lines: 1
    near_bytes: 192

  - id: public-forge-git-clone
    desc: Git clones a public code forge
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/url/forge::public-code-forge-url
    any:
      - id: git-clone-command
      - id: git-clone-argv
    near_lines: 8
