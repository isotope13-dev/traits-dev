# Git object-database commands used to publish repository-held output.
defaults:
  platforms: [unix, windows]
  for: [scripts, python, javascript, typescript, go, c, cpp, text]

traits:
  - id: git-hash-object-write
    desc: Writes data into Git object database
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bhash-object\s+-w\b'
  - id: git-mktree-command
    desc: Builds a Git tree object
    crit: notable
    conf: 0.94
    if:
      type: text
      word: mktree
  - id: git-commit-tree-command
    desc: Creates a Git commit object
    crit: notable
    conf: 0.94
    if:
      type: text
      word: commit-tree
  - id: git-update-ref-command
    desc: Updates a Git reference
    crit: notable
    conf: 0.94
    if:
      type: text
      word: update-ref

composite_rules:
  - id: git-object-publication-chain
    desc: Git object chain publishes a result ref
    crit: suspicious
    conf: 0.98
    near_lines: 16
    all:
      - id: git-hash-object-write
      - id: git-mktree-command
      - id: git-commit-tree-command
      - id: git-update-ref-command
    # Command names in a static analyzer's lookup table are not a publication
    # chain. Require nearby evidence that the program launches a process or
    # runs shell commands before treating the sequence as an operation.
    any:
      - id: micro-behaviors/process/create/subprocess
      - id: micro-behaviors/process/create/shell
      - id: metadata/import/go/os/exec
    unless:
      - id: well-known/tool/development/vcs/facebook-sapling::facebook-sapling-member-context
      - id: well-known/tool/development/vcs/facebook-sapling::source-archive-path
      - id: metadata/path::test-directory-component
      - id: metadata/package/testing/presence/path::git-tests-directory
