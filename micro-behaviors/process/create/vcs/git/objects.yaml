# Git object-database commands used to publish repository-held output.
defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: git-hash-object-write
    desc: Writes data into Git object database
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bhash-object\s+-w\b'
  - id: git-mktree-command
    desc: Builds a Git tree object
    crit: notable
    conf: 0.94
    if:
      type: text
      word: mktree
  - id: git-commit-tree-command
    desc: Creates a Git commit object
    crit: notable
    conf: 0.94
    if:
      type: text
      word: commit-tree
  - id: git-update-ref-command
    desc: Updates a Git reference
    crit: notable
    conf: 0.94
    if:
      type: text
      word: update-ref

composite_rules:
  - id: git-object-publication-chain
    desc: Git object chain publishes a result ref
    crit: suspicious
    conf: 0.98
    near_lines: 16
    all:
      - id: git-hash-object-write
      - id: git-mktree-command
      - id: git-commit-tree-command
      - id: git-update-ref-command
    unless:
      - id: well-known/app/development/facebook-sapling::facebook-sapling-member-context
      - id: well-known/app/development/facebook-sapling::source-archive-path
