defaults:
  platforms: [unix, windows]
  for: [shell]
  attack: T1059.004
traits:
  - id: shell-git-clone
    desc: Shell command invokes git clone
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)^[ \t]*(sudo\s+|env\s+|command\s+|exec\s+)?git\s+clone\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
  - id: shell-git-pull
    desc: Pulls changes from a Git remote
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: git
      arg:
        kind: identifier
        name: pull
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
  - id: shell-git-push
    desc: Pushes commits to a Git remote
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: git
      arg:
        kind: identifier
        name: push
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
  - id: shell-git-commit
    desc: Commits changes to a Git repository
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: git
      arg:
        kind: identifier
        name: commit
