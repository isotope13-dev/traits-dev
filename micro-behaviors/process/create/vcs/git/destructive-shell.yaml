# Working-tree and repository maintenance commands can be legitimate, but they
# discard local state. Surface the command shape at notable; policy engines can
# decide whether the current checkout and invocation are authorized.
defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.96

traits:
  - id: git-reset-hard-command
    desc: Git hard reset command
    if:
      type: text
      regex: '(?im)^\s*(/usr/bin/)?git\b.{0,80}\breset\s+--hard\b'

  - id: git-checkout-discard-command
    desc: Git checkout discards worktree changes
    if:
      type: text
      regex: '(?im)^\s*(/usr/bin/)?git\b.{0,80}\bcheckout\s+(--\s+|[.]\s*$|-f\b)'

  - id: git-restore-path-command
    desc: Git restores working-tree paths
    if:
      type: text
      regex: '(?im)^\s*(/usr/bin/)?git\b.{0,80}\brestore\s+(--source=\S+\s+)?\S+'

  - id: git-stash-delete-command
    desc: Git deletes saved stashes
    if:
      type: text
      regex: '(?im)^\s*(/usr/bin/)?git\b.{0,80}\bstash\s+(drop|clear)\b'

  - id: git-branch-force-delete-command
    desc: Git force deletes branches
    if:
      type: text
      regex: '(?im)^\s*(/usr/bin/)?git\b.{0,80}\bbranch\s+(-D\b|--delete\s+--force\b)'

  - id: git-clean-force-directory-command
    desc: Git cleans untracked files and directories
    if:
      type: text
      regex: '(?im)^\s*(/usr/bin/)?git\b.{0,80}\bclean\s+(-(fdx|xdf|fd)|--force\s+-d)\b'

  - id: git-reset-merge-keep-command
    desc: Git reset may discard local changes
    if:
      type: text
      regex: '(?im)^\s*(/usr/bin/)?git\b.{0,80}\breset\s+--(merge|keep)\b'

  - id: git-force-push-command
    desc: Git force push command
    if:
      type: text
      regex: '(?im)^\s*(/usr/bin/)?git\b.{0,80}\bpush\b.{0,80}\s(-f|--force|--force-with-lease)\b'

  - id: git-hooks-disabled-command
    desc: Git command disables repository hooks
    if:
      type: text
      regex: '(?im)^\s*(/usr/bin/)?git\b.{0,80}\bconfig\s+core\.hooksPath\s+(/dev/null|NUL)\b'

  - id: git-reflog-expire-command
    desc: Git expires reflog history
    if:
      type: text
      regex: '(?im)^\s*(/usr/bin/)?git\b.{0,80}\breflog\s+expire\b[^\n]{0,100}--expire(=|\s+)now\b'

  - id: git-immediate-prune-command
    desc: Git immediately prunes unreachable objects
    if:
      type: text
      regex: '(?im)^\s*(/usr/bin/)?git\b.{0,80}\bgc\b[^\n]{0,100}--prune(=|\s+)now\b'
