# Staging every repository change is a neutral version-control operation, but
# it is analyst-relevant when it appears in automation. Keep command scripts
# line-anchored and source-code variants bound to string literals so comments
# and prose do not satisfy the capability.
defaults:
  platforms: [windows, linux, macos]
  crit: notable
  conf: 0.92

traits:
  - id: git-stage-all-script-command
    desc: Script stages all Git changes
    for: [shell, batch, powershell]
    if:
      type: text
      regex: '(?m)^[ \t]*git\s+(-C\s+\S+\s+)?add\s+(\.\s*$|-A\b|--all\b)'

  - id: git-stage-all-command-string
    desc: Embeds Git stage-all command
    for: [javascript, typescript, python, ruby, go, rust]
    if:
      type: string_literal
      regex: '^\s*git\s+(-C\s+\S+\s+)?add\s+(\.(\s|$|[;&|])|-A\b|--all\b)'

composite_rules:
  - id: git-stage-all-changes
    desc: Stages all Git changes
    crit: notable
    conf: 0.94
    any:
      - id: git-stage-all-script-command
      - id: git-stage-all-command-string
