defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.007

traits:
  - id: javascript-git-read-query
    desc: JavaScript Git repository query command
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bgit\s+(branch|ls-tree|show|config)\b'
