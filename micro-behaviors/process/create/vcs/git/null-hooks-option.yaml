defaults:
  platforms: [unix, windows]
  for: [python, go]
  crit: notable
traits:
  # A per-command option, not a durable Git configuration change. Preserve
  # the Python literal and recognize Go's portable null-device construction.
  - id: git-hooks-disabled-config-token
    desc: Null-device Git hooksPath option
    conf: 0.95
    if:
      type: text
      regex: '"core\.hooksPath=(/dev/null"|"\s*\+\s*os\.DevNull\b)'
