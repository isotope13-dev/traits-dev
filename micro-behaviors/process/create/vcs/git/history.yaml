# Patch-bearing history enumeration is also used by legitimate auditing tools.
defaults:
  for: [scripts]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: git-history-patch-cli
    desc: Git log requests commit patches
    if:
      type: text
      regex: '\bgit[ \t]+log[ \t]+[^\r\n|;]{0,100}(-p\b|--patch\b)'
  - id: git-history-patch-argv
    desc: Git log argument list requests commit patches
    if:
      type: text
      regex: '["'']git["''][ \t]*,[ \t]*["'']log["''][^\r\n]{0,100}["''](-p|--patch)["'']'
composite_rules:
  - id: git-history-patches
    crit: notable
    conf: 0.95
    desc: Requests patch-bearing Git history
    any:
      - id: git-history-patch-cli
      - id: git-history-patch-argv
