defaults:
  platforms: [windows]
  for: [batch, powershell, scripts, javascript]
traits:
  - id: node-variable-program-and-script-argument
    desc: Node spawn uses variable program and argument
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bspawn\s*\(\s*[A-Za-z_$][\w$]*\s*,\s*\[\s*[A-Za-z_$][\w$]*\s*\]'
