# The interpreter receives a variable path, while HTTP response material is
# written nearby. The matcher does not prove that variable names the write.
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]

composite_rules:
  - id: python-response-write-variable-interpreter-profile
    desc: HTTP response write near variable-path Python interpreter
    crit: suspicious
    conf: 0.98
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/process/argument/file::python-variable-script-argv
      - id: micro-behaviors/fs/temp/directory::python-temporary-directory-context
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-content
      - id: micro-behaviors/communications/http/download/url::python-source-url-reference
