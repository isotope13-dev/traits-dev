defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-write-chmod-detached-spawn-profile
    desc: File-write/chmod near detached variable spawn
    crit: notable
    conf: 0.94
    scope: file
    near_bytes: 2048
    needs: 2
    all:
      - id: metadata/file/profile/file-write-api::node-write-file-sync-call
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
      - id: micro-behaviors/process/create/exec::spawn-variable-program
    any:
      - id: metadata/file/profile/command-options::detached-true
      - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
      - id: micro-behaviors/process/daemonize/detach::node-spawn-result-unref
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/lang/scripted::dts-declaration-file
      - id: micro-behaviors/process/lifecycle/respawn::node-self-daemon-cli-benign-context
      - id: well-known/app/ai/agent-runtime/nebula-ai::nebula-ai-context

# Generic fetch/write/spawn co-occurrence establishes neither package delivery
# nor a trust violation. Formerly supply-chain-dropper in objectives.
  - id: node-fetch-write-detached-spawn-profile
    desc: Node fetch/write near detached variable spawn
    crit: notable
    conf: 0.95
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/module/require::child-process-require
      - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
      - id: micro-behaviors/process/create/exec::spawn-variable-program
      - id: metadata/file/profile/network::fetch-write-exec
