defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-write-chmod-detached-spawn-profile
    desc: File-write/chmod near detached variable spawn
    crit: notable
    conf: 0.94
    scope: file
    near_bytes: 2048
    needs: 2
    all:
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
      - id: micro-behaviors/process/create/exec::spawn-variable-program
    any:
      - id: metadata/file/profile/command-options::detached-true
      - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
      - id: micro-behaviors/process/daemonize/detach::node-spawn-result-unref
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

# Generic fetch/write/spawn co-occurrence establishes neither package delivery
# nor a trust violation. Formerly supply-chain-dropper in objectives.
  - id: node-fetch-write-detached-spawn-profile
    desc: Node fetch/write near detached variable spawn
    crit: notable
    conf: 0.95
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/module/require::child-process-require
      - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
      - id: micro-behaviors/process/create/exec::spawn-variable-program
      - id: metadata/file/profile/co-occurrence/network-process::fetch-write-exec

  # A stronger fetch/write/exec profile: a temp-directory reference
  # accompanies the write, and a detached child launch has ignored output.
  # The rule records co-occurrence; surrounding context determines intent.
  - id: node-http-temp-write-detached-child-profile
    desc: HTTP fetch, temp-file write, and detached child launch co-occur
    crit: suspicious
    conf: 0.96
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/get::axios-get-call
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
      - id: micro-behaviors/os/sysinfo/directories::node-os-tmpdir
      - id: micro-behaviors/process/create/exec::spawn-variable-program
      - id: metadata/file/profile/command-options::detached-true
      - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
      - id: micro-behaviors/process/control/wait::node-unref-handle
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
