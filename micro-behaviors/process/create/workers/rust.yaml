# Rust worker/resource pool construction. `PoolBuilder` is the builder type
# name shared by rayon (`ThreadPoolBuilder`), r2d2, deadpool, sqlx and microVM
# pools alike -- a neutral concurrency primitive. Composites that care about a
# specific pool kind (e.g. the microVM worker pool under
# micro-behaviors/os/virtualization/pool) reference this atom and supply the
# discriminating evidence themselves.
defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.9

traits:
  - id: rust-pool-builder-type
    desc: Rust PoolBuilder type reference
    if:
      type: text
      substr: PoolBuilder
