# Agent-to-agent delegation and concurrent dispatch primitives.
#
# The individual observations are neutral: workflow engines, research agents,
# and test harnesses can all delegate work and run it concurrently. Offensive
# intent belongs in objectives/execution/automation/, where these capabilities
# are combined with model-selected command execution and attack tasking.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, json]
  crit: notable
  conf: 0.9

traits:
  - id: agent-delegation-tool-name
    desc: Agent delegation tool name
    crit: component
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(?i)^(delegate_task|sessions_spawn|spawn_subagent)$'

  - id: agent-delegation-call
    desc: Calls an agent delegation API
    crit: notable
    conf: 0.94
    for: [python, javascript, typescript, go, rust, lua, powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(delegate_task|sessions_spawn|spawn_subagent)$'

  - id: agent-prompt-dispatch-call
    desc: Calls an agent-prompt dispatch API
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(?i)^(sendPromptToAgent|sendAgentPrompt)$'

  # Only the executor belongs here: constructing a thread pool creates workers.
  # `gather` and `Promise.all` were folded into this directory too, but they
  # start nothing -- they wait on tasks that already exist -- so they now live
  # with the other synchronisation primitives in
  # micro-behaviors/process/sync/join/ and are referenced from there below.
  - id: parallel-thread-executor
    desc: Uses a thread or async task executor
    crit: notable
    conf: 0.88
    for: [python, javascript, typescript, go, rust, lua, powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)ThreadPoolExecutor$'

  - id: rust-parallel-task-spawn
    desc: Rust spawns a concurrent task
    crit: notable
    conf: 0.88
    for: [rust]
    if:
      type: symbol
      kind: call
      regex: '(?i)^(scope|tokio|async_std)\.spawn$'

  - id: go-errgroup-task-dispatch
    desc: Go errgroup dispatches a concurrent task
    crit: notable
    conf: 0.88
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '(?i)^errgroup\.(Go|Group)$'

  - id: parallel-submit-call
    desc: Submits a task to an executor
    crit: notable
    conf: 0.88
    # Bare `object.submit()` is not an executor signal in browser code:
    # forms and jQuery objects use the same method to submit HTTP forms.
    # Python's executor APIs conventionally expose the executor/pool role in
    # the receiver name, which keeps this observation tied to worker dispatch.
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(?i)^(executor|pool|thread_pool|process_pool)\.submit$'

  - id: task-executor-constructor
    desc: Instantiates a task executor
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)TaskExecutor$'

composite_rules:
  - id: agent-delegation-capability
    desc: Agent exposes a delegation capability
    crit: notable
    conf: 0.93
    any:
      - id: agent-delegation-tool-name
      - id: agent-delegation-call

  - id: parallel-task-dispatch-api
    desc: Uses a parallel task dispatch API
    crit: notable
    conf: 0.9
    any:
      - id: parallel-thread-executor
      - id: micro-behaviors/process/sync/join::promise-all-join
      - id: micro-behaviors/process/sync/join::asyncio-gather-join
      - id: rust-parallel-task-spawn
      - id: go-errgroup-task-dispatch
      - id: parallel-submit-call

  - id: agent-parallel-delegation
    desc: Agent delegates tasks through parallel dispatch
    crit: notable
    conf: 0.96
    all:
      - id: agent-delegation-capability
      - id: parallel-task-dispatch-api
    near_bytes: 2048
