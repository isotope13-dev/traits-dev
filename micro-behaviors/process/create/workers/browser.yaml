defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows, ios]
  for: [javascript, typescript, html]

traits:
  - id: worker-constructor-call
    desc: Worker constructor call
    if:
      type: symbol
      kind: call
      exact: Worker
  - id: worker-constructor-text
    desc: Constructs a Worker in embedded browser code
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bnew\s+Worker\s*\('
    unless:
      - id: micro-behaviors/process/create/workers::worker-threads-import
      - id: micro-behaviors/process/create/workers::worker-threads-require

      - id: metadata/lang/scripted::dts-declaration-file
composite_rules:
  - id: inert-script-worker-source
    desc: Builds Worker source from inert script blocks
    crit: notable
    conf: 0.97
    for: [html]
    near_bytes: 2600
    all:
      - id: micro-behaviors/data/format/html::inert-plain-script-block
      - id: micro-behaviors/data/buffer/alloc::dom-text-content-blob-context
      - id: worker-constructor-text
      - id: micro-behaviors/data/format/blob::browser-javascript-blob

  - id: browser-worker-constructor
    desc: Creates a browser Web Worker
    all:
      - id: worker-constructor-call
    unless:
      # Node worker_threads Worker(path) shares the constructor name but is not
      # a browser Web Worker (e.g. mailx-store parse-worker.js).
      - id: micro-behaviors/process/create/workers::worker-threads-import
      - id: micro-behaviors/process/create/workers::worker-threads-require

  - id: inert-worker-near-executable-query
    desc: Inert Worker near executable URL query
    crit: notable
    conf: 0.99
    for: [html]
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/create/workers::inert-script-worker-source
      - id: micro-behaviors/communications/url/http-query::nested-executable-url-value
