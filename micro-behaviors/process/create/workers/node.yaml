# Node.js Worker Threads
# Detects worker_threads usage for parallel code execution
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  mbc: "C0017"
traits:
  - id: worker-threads-import
    desc: Imports worker_threads module
    crit: notable
    conf: 0.85
    attack: "T1059.007"
    if:
      type: text
      regex: "from\\s+['\\\"](node:)?worker_threads['\\\"]"
  - id: worker-threads-require
    desc: Requires worker_threads module
    crit: notable
    conf: 0.92
    attack: "T1059.007"
    if:
      type: symbol
      kind: call
      exact: require
      arg:
        kind: string
        substr: worker_threads
  - id: worker-eval-true-option
    desc: Enables eval in an object literal
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'eval\s*:\s*true'
  - id: new-worker-require-resolve
    desc: Creates Worker from resolved module
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'new\s+Worker\s*\(\s*require\.resolve\s*\('

composite_rules:
  - id: new-worker-instance
    desc: Creates Node.js worker thread instance
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/process/create/workers::worker-constructor-call
    any:
      - id: worker-threads-import
      - id: worker-threads-require
    near_bytes: 8192
  - id: worker-eval-option
    desc: Node worker evaluates an inline source string
    crit: notable
    conf: 0.95
    attack: T1059.007
    near_bytes: 8192
    all:
      - id: micro-behaviors/process/create/workers::worker-constructor-call
      - id: worker-eval-true-option
    any:
      - id: worker-threads-import
      - id: worker-threads-require
