# Neutral remote-support capabilities for AI command-line tools. These are
# dual-use; hostile intent requires covert access or another malicious action.
defaults:
  platforms: [unix]
  for: [elf, macho]
  attack: T1219
  mbc: B0022

traits:
  - id: ai-cli-phone-control-marker
    desc: Phone-controlled AI CLI session marker
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)phone drives (Claude|Gemini) Code'

  - id: ai-cli-stream-json-marker
    desc: Persistent AI CLI stream-json process marker
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)persistent stream-json (claude|gemini) process'

  - id: ai-cli-permission-mode-marker
    desc: Claude CLI permission-mode option
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)claude --permission-mode'

composite_rules:
  - id: ai-cli-remote-control-marker
    desc: AI CLI remote-control session marker
    crit: notable
    conf: 0.95
    any:
      - id: ai-cli-phone-control-marker
      - id: ai-cli-stream-json-marker
      - id: ai-cli-permission-mode-marker

  - id: native-wss-pty-ai-cli-agent
    desc: Native WSS agent relays PTY-backed AI CLI control
    crit: notable
    conf: 0.98
    attack: T1071.001,T1059,T1219
    all:
      - id: ai-cli-remote-control-marker
      - id: micro-behaviors/communications/http/websocket::wss-scheme
      - id: micro-behaviors/process/tty/pty::go-creack-pty-path
      - id: micro-behaviors/process/tty/pty::pty-open-call
      - id: micro-behaviors/process/create/system::go-os-exec-pclntab
