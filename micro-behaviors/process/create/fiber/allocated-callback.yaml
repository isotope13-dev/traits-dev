defaults:
  for: [c, cpp, python]
  platforms: [windows]
  crit: notable
  conf: 0.97

traits:
  - id: allocated-address-fiber-callback
    desc: Fiber callback uses a virtual allocation
    # Bind the callback argument to its allocation. Ordinary function
    # callbacks and an unrelated VirtualAlloc call do not supply this evidence.
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])CreateFiber$'
      arg:
        index: 1
        from:
          call: '(^|[.:])VirtualAlloc$'
          through:
            - call: '(^|\.)(CFUNCTYPE|WINFUNCTYPE)$'
              arguments: [0]
            - call: '(^|\.)c_void_p$'
              arguments: [0]
