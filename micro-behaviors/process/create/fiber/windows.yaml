defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
traits:
  - id: create-fiber
    desc: Create a fiber object
    if:
      type: symbol
      exact: CreateFiber
  - id: create-fiber-api-string
    desc: CreateFiber API name in binary text
    if:
      type: text
      substr: CreateFiber
      section: ".rdata"

composite_rules:
  - id: fiber-memory-thread-api-profile
    for: [pe]
    size_max: 52428800
    desc: Fiber APIs with memory or thread-control indicators
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/process/create/fiber::create-fiber
      - id: micro-behaviors/process/fiber::switch-to-fiber
    any:
      # Co-occurrence does not bind an allocation or a remote handle to the
      # fiber callback. Thread-context pairs also occur in pthread cancellation.
      - id: micro-behaviors/mem/alloc/executable::executable-allocation-indicator
      - id: micro-behaviors/mem/protect/modify::virtualprotect-rwx-direct-call-x86
      - id: micro-behaviors/mem/protect/modify::rwx-current-process-arg-call-x86
      - id: micro-behaviors/mem/protect/modify::virtualprotect-executable-resolved-x64
      - id: micro-behaviors/process/inject/
      - id: micro-behaviors/process/thread/lifecycle::thread-control-apis-2of4
      - id: metadata/binary/section/permission::wx-section
    unless:
      - id: metadata/binary/vendor/
      - id: micro-behaviors/os/event/loop::tokio-crate-path
      - id: micro-behaviors/os/event/loop::tokio-runtime-thread-name
      # OpenSSL's async job framework schedules work on Windows fibers.
      - id: well-known/lib/crypto/openssl/
      - id: well-known/lib/runtime/native-platform/mozilla-nspr/
      - id: well-known/dual-use/remote-admin/meshcentral::meshcentral-agent-binary-context
      # Compiled-JS runtimes (JS-to-native toolchains) run their event loop
      # and async scheduler on Windows fibers; build provenance in the
      # binary separates them from injection toolkits.
      - id: metadata/binary/provenance/source::npm-native-toolchain-context
      - id: well-known/tool/development/openharmony-hdc::openharmony-hdc-binary

