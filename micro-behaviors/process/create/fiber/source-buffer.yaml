defaults:
  for: [c, cpp]
  platforms: [windows]
  crit: notable
  conf: 0.97
traits:
  - id: source-fiber-buffer-callback
    desc: Fiber callback casts a pointer to code
    if:
      type: text
      regex: 'CreateFiber\(\s*[^,]{1,40},\s*\(LPFIBER_START_ROUTINE\)\s*\w+'
composite_rules:
  - id: source-rwx-fiber-callback
    desc: Source combines RWX allocation and fibers
    crit: notable
    all:
      - id: source-fiber-buffer-callback
      - id: micro-behaviors/process/fiber::source-switch-to-fiber
      - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-source
