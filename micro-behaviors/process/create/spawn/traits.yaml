# Process Creation
# Creating and managing processes
defaults:
  for: ["pe", "dll"]
  platforms: ["windows"]
traits: []
composite_rules:
  # The union of the atoms in this directory that actually START a child
  # process. The directory as a whole is not that: it also carries the
  # supporting primitives every process-handling program uses (CloseHandle,
  # WaitForSingleObject, GetExitCodeProcess, OpenProcess) and bare
  # member-name fragments. Rules elsewhere that want "this program can spawn
  # something" must reference this composite rather than the directory, or
  # they end up asserting process creation for any binary that closes a handle.
  - id: child-process-creation-api
    desc: Starts a child process through a platform API
    crit: notable
    conf: 0.92
    attack: T1106
    for: [binaries, scripts, source]
    platforms: [windows, unix]
    unless:
      - id: well-known/lib/ui/cytoscape::cytoscape-stylesheet-runtime-marker
    any:
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-source
      - id: micro-behaviors/process/create/subprocess::dotnet-process-start
      - id: micro-behaviors/process/create/subprocess::swift-source-process-run
      - id: micro-behaviors/process/create/spawn::child-process-member-spawn
      - id: micro-behaviors/process/create/spawn::child-process-alias-spawn
      - id: micro-behaviors/process/create/exec::go-pe-child-process-start-call
      - id: micro-behaviors/process/create/spawn::child-process-destructured-spawn-call
