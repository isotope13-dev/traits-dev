defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96
  mbc: C0017
traits:
  - id: teen-process-exec-import
    desc: Imports teen_process exec function
    if:
      type: tree-sitter
      query: |
        ((import_statement
          (import_clause (named_imports
            (import_specifier name: (identifier) @api !alias)))
          source: (string (string_fragment) @module)) @binding
        (#eq? @api "exec")
        (#eq? @module "teen_process"))
  - id: teen-process-subprocess-import
    desc: Imports teen_process SubProcess class
    if:
      type: tree-sitter
      query: |
        ((import_statement
          (import_clause (named_imports
            (import_specifier name: (identifier) @api !alias)))
          source: (string (string_fragment) @module)) @binding
        (#eq? @api "SubProcess")
        (#eq? @module "teen_process"))
composite_rules:
  # exec takes an executable and argv; no shell is implied.
  - id: teen-process-exec-call
    desc: teen_process exec import and call
    all:
      - id: teen-process-exec-import
      - id: metadata/lang/source/syntax/call/invocation::javascript-exec-call
  - id: teen-process-subprocess-constructor
    desc: teen_process import and SubProcess construction
    all:
      - id: teen-process-subprocess-import
      - id: metadata/lang/source/syntax/call/invocation::javascript-subprocess-constructor
