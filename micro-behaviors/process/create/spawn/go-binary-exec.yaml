defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.98

traits:
  - id: go-pe-os-exec-command-call
    desc: Calls compiled Go os/exec.Command
    if:
      type: symbol
      kind: call
      exact: sym.go.os_exec.Command
  - id: go-pe-child-process-start-call
    desc: Starts a compiled Go child process
    if:
      type: symbol
      kind: call
      exact: sym.go.os_exec.__Cmd_.Start
