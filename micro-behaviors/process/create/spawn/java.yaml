defaults:
  platforms: [windows, unix, android]
  attack: T1059
  mbc: E1203
  for:
  - java
  - class
traits:
- id: java-runtime-exec
  desc: Java Runtime exec for command execution
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: java.lang.Runtime.exec
- id: java-processbuilder
  desc: Java ProcessBuilder class reference
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: java.lang.ProcessBuilder
- id: qualified-runtime-nearby-exec-text-reference
  desc: Qualified Runtime and nearby exec text
  crit: notable
  conf: 0.8
  for: [jsp, java, class, html, javascript, python, vbs]
  if:
    type: text
    regex: '(?i)java[/\\.]lang[/\\.]Runtime.{0,40}\bexec\b'
composite_rules:
- id: java-runtime-class-getter-exec-text-context
  desc: Runtime class/getter and exec text co-occurrence
  crit: notable
  conf: 0.92
  all:
  - id: "metadata/import/jvm::java-runtime-qualified-class-reference"
  - id: micro-behaviors/process/info/query::java-getruntime-ref
  - id: qualified-runtime-nearby-exec-text-reference
- id: java-processbuilder-cmd-start
  for: [android_apk, class, java, kotlin, zip]
  desc: Java ProcessBuilder launches through cmd /c
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode
  - id: micro-behaviors/process/create/shell/spawn::java-cmd-exe-c-arguments
