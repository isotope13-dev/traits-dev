# These nearby APIs suggest a staged child, but the matcher does not bind the
# decipher output to the written path or that path to the detached spawn.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: node-aes-write-detached-spawn-profile
    desc: Node AES, file-write and detached-spawn clues
    crit: suspicious
    conf: 0.97
    near_bytes: 2048
    all:
      - id: micro-behaviors/crypto/symmetric/decrypt::createDecipheriv
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
    unless:
      - id: metadata/package/testing/
