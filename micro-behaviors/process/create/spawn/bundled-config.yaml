defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

composite_rules:
  - id: js-staged-binary-encoded-config-launch
    desc: Detached native launch beside encoded JSON configuration
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    near_bytes: 4000
    all:
      - id: micro-behaviors/process/create/spawn::spawn-call
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: metadata/file/encoding::base64-json-object
      - id: micro-behaviors/fs/path-ops/join::node-hidden-exec-dir-join

