# `Runtime.getRuntime().exec` / `new ProcessBuilder` are Java-only spellings, so
# the matcher is unambiguous wherever it lands. The carrier types beyond
# java/kotlin/class are there for JSP server pages: cleave has no `jsp` file
# type and classifies a `.jsp` by content, so these pages arrive typed as
# python/javascript/vbs/html and a `for: [java]` gate would make the trait inert
# on exactly the files that matter (see metadata/lang/scripted::jsp-page-directive).
# Serialized XML payloads use the same JVM sinks.
defaults:
  attack: T1059
  mbc: E1203
  platforms:
    - unix
    - windows
  for:
    - java
    - kotlin
    - class
    - xml
    - html
    - javascript
    - python
    - vbs
traits:
  - id: java-runtime-exec-source
    desc: JVM Runtime.exec() call in source/XML
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: Runtime.getRuntime().exec
  - id: java-processbuilder-source
    desc: Java ProcessBuilder usage in source/XML
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: new ProcessBuilder
