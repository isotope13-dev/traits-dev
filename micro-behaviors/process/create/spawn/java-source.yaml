# `Runtime.getRuntime().exec` / `new ProcessBuilder` are JVM source spellings.
# JSP has a dedicated type; other carrier types also cover embedded JSP
# fragments and serialized XML payloads.
defaults:
  crit: notable
  attack: T1059
  mbc: E1203
  platforms:
    - unix
    - windows
  for:
    - java
    - kotlin
    - class
    - xml
    - jsp
    - html
    - javascript
    - python
traits:
  - id: java-runtime-exec-source
    desc: JVM Runtime.exec() call
    conf: 0.8
    # Tab-indented JSPX text carriers can be classified as Makefiles.
    for: [source, class, xml, jsp, html, javascript, python, makefile]
    if:
      type: text
      substr: Runtime.getRuntime().exec
  - id: java-processbuilder-source
    desc: Java ProcessBuilder usage
    conf: 0.8
    if:
      type: text
      substr: new ProcessBuilder
  - id: java-processbuilder-start-source
    desc: JVM ProcessBuilder start call
    conf: 0.94
    for: [java, kotlin]
    if:
      type: text
      # Java constructs with `new ProcessBuilder(...)`; Kotlin omits `new`.
      regex: '(new\s+)?ProcessBuilder\([^;]{0,300}\)\)?(\s*\.\w+\([^;]{0,160}\)){0,4}\s*\.start\('

  - id: java-beans-runtime-exec-expression
    desc: Java Beans Expression constructs Runtime.exec
    crit: notable
    conf: 0.94
    for: [jsp, java, html, javascript, python]
    if:
      type: text
      regex: 'new\s+(java\.beans\.)?Expression\s*\(\s*Runtime\.getRuntime\s*\(\s*\)\s*,\s*["'']exec["'']'

  - id: java-beans-expression-get-value
    desc: Java Beans Expression evaluates its method call
    crit: notable
    conf: 0.9
    for: [jsp, java, html, javascript, python]
    if:
      type: text
      # getValue() is common in unrelated libraries (for example SheetJS
      # workbook cells). Keep this Java Beans capability tied to its Expression
      # construction rather than matching a generic method name.
      regex: 'new\s+(java\.beans\.)?Expression[\s\S]{0,400}\.getValue\s*\('
