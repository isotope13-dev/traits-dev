defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: direct-or-forwarded-spawn-call
    desc: Direct spawn call or inline-source forwarding
    crit: notable
    conf: 0.85
    any:
      - id: bare-spawn-call
      - id: child-process-member-spawn
      - id: child-process-alias-spawn
      - id: micro-behaviors/process/create/eval::js-helper-receives-spawn-inline-source
  - id: windowshide-boolean-setting
    desc: windowsHide uses true or negated expression
    crit: notable
    conf: 0.9
    # This records option syntax, not evaluation of arbitrary arithmetic.
    any:
      - id: windowshide-option
      - id: windowshide-obfuscated-expression
