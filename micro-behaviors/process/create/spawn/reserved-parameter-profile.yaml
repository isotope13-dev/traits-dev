defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, go, python]


composite_rules:
  - id: startupinfo-remote-parameters-profile
    desc: Startup fields with remote-read API references
    crit: notable
    conf: 0.99
    all:
