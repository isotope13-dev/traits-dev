defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: call-arg-node-string
  desc: Call with node string arg
  crit: component
  conf: 0.85
  if:
    type: symbol
    kind: call
    substr: node
    arg:
      kind: string
      exact: node
- id: auto-retry-helper
  desc: Auto-retry helper self-spawn
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: function buildAutoRetryScript
composite_rules:
- id: spawn-node
  desc: Node inline or temp process launch
  crit: notable
  conf: 0.88
  near_bytes: 256
  all:
  - id: micro-behaviors/process/create/spawn::spawn-call
  - id: call-arg-node-string
  any:
  - id: micro-behaviors/process/create/inline-script::spawn-node-eval
  - id: micro-behaviors/process/create/inline-script::spawn-node-eval-var
  - id: micro-behaviors/fs/path/temp::js-path-under-tmp
  unless:
  - id: metadata/package/testing/
  - id: metadata/build/bundler/asset::js-large-module-bundle

  - id: "metadata/file/naming::test-directory-component"
