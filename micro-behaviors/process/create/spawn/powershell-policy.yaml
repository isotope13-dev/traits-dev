# These options are unusual but legitimate for background editor helpers.
# The executable, argv and launch options must belong to the SAME call.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
traits:
  - id: node-detached-hidden-powershell-policy-bypass
    desc: Detached hidden PowerShell bypass launch
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: [(identifier) @spawn
            (member_expression property: (property_identifier) @spawn)]
          arguments: (arguments
            . (string (string_fragment) @executable)
            . (array) @argv
            . (object
                (pair key: [(property_identifier) @detached
                  (string (string_fragment) @detached)] value: (_) @detach_value)
                (pair key: [(property_identifier) @hidden
                  (string (string_fragment) @hidden)] value: (_) @hide_value))))
          (#eq? @spawn "spawn")
          (#match? @executable "(?i)(^|[/\\\\])(?:powershell|pwsh)(?:\\.exe)?$")
          (#match? @argv "(?i)executionpolicy.{0,32}bypass")
          (#eq? @detached "detached")
          (#eq? @hidden "windowsHide")
          (#match? @detach_value "^(true|!0)$")
          (#match? @hide_value "^(true|!0)$"))
