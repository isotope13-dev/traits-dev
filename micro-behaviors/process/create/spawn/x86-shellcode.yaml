defaults:
  platforms: [windows]
  for: [html, javascript, text, data]
  crit: notable
  conf: 0.98

traits:
  - id: x86-winexec-hash-launch
    desc: Hash-resolved WinExec launch call
    if:
      type: yara
      source: |
        rule x86_winexec_hash_launch {
          strings:
            $call = { BA 98 FE 8A 0E 52 50 E8 ?? ?? ?? ?? }
            $exe = /[a-z0-9_.-]{1,32}\.exe/ nocase
          condition:
            all of them
        }
