defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: dotnet-resource-temp-launch-context
    desc: Managed TEMP launch near resource write
    crit: suspicious
    conf: 0.94
    near_bytes: 32768
    all:
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/binary/layout/embedded::pe-embedded
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resource-reader-access
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
      - id: micro-behaviors/fs/path/temp::dotnet-gettempfilename-token
      - id: micro-behaviors/process/create/spawn::dotnet-process-start-split-tokens
    unless:
      - id: metadata/signed/platform::microsoft
      - id: well-known/app/system/bible-converter/
