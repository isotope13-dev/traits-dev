# Node.js Process Spawning Capabilities
# Capabilities related to child_process.spawn() and process management
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: child-process-destructured-spawn-call
    desc: Calls destructured child_process spawn
    crit: notable
    conf: 0.94
    if:
      type: tree-sitter
      query: |
        (program
          (lexical_declaration
            (variable_declarator
              name: (object_pattern
                (pair_pattern
                  key: (property_identifier) @api
                  value: (identifier) @alias))
              value: (call_expression
                function: (identifier) @require
                arguments: (arguments
                  (string (string_fragment) @module)))))
          (function_declaration
            body: (statement_block
              (expression_statement
                (call_expression
                  function: (member_expression
                    object: (call_expression
                      function: (identifier) @callee
                      arguments: (arguments (identifier) @program)))))))
          (#eq? @api "spawn")
          (#eq? @require "require")
          (#eq? @module "child_process")
          (#eq? @alias @callee))
  # === Detached spawn execution indicators ===
  - id: child-process-member-spawn
    desc: Node.js child_process spawns an external process
    crit: notable
    conf: 0.85
    unless:
      - id: well-known/lib/ui/cytoscape::cytoscape-stylesheet-runtime-marker
    if:
      # Migrated from a tree-sitter call query to a `kind: call`
      # match on the pre-extracted call fact (no per-member
      # tree-sitter cursor walk; same call-name semantics). Accept the common
      # camelCase/default-import aliases too: ESM packages routinely import
      # `node:child_process` as `childProcess`, while compact source tends to
      # use `cp`. The member name still identifies the process API rather than
      # treating every object's `.spawn()` method as process creation.
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(child[_-]?process|childproc|cp)\.spawn$'
composite_rules:
  # A tracing API can also expose fork(), and examples in comments do not
  # launch processes. Require a parsed call and a Node child_process import.
  - id: child-process-alias-spawn
    desc: Node.js child_process alias spawn
    crit: notable
    conf: 0.85
    mbc: C0017
    all:
      - id: metadata/import/builtin::require-child-process
      - id: child-process-member-spawn
  # The daemon guard and inherited environment establish a relaunch loop; the
  # detached/unref leg establishes that the child outlives its parent. Unlike
  # the former rule, this does not infer detachment from the flag alone.
