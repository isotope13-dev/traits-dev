defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: cil-vb-shell-literal-command-call
    desc: CIL literal command with VB Shell references
    crit: notable
    conf: 0.94
    if:
      type: yara
      source: |
        import "pe"
        rule cil_vb_shell_literal_command_call {
          strings:
            $call = { 72 ?? ?? ?? 70 16 16 15 28 ?? ?? ?? 0A 26 }
            $vb = "Microsoft.VisualBasic" ascii fullword
            $interaction = "Interaction" ascii fullword
            $shell = "Shell" ascii fullword
          condition:
            for any s in pe.sections : (
              s.name == ".text" and
              for all of them : (
                $ in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
              )
            )
        }
