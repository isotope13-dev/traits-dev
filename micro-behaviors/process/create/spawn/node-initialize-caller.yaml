defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-spawn-initialize-caller-context
    desc: Spawn syntax near initializeCaller reference
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'initializeCaller[\s\S]{0,400}spawn\(|spawn\([\s\S]{0,400}initializeCaller'

