# Electron payload-related function names are content clues, not proof of a
# launched payload. Keep them with process-spawn vocabulary.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component
  conf: 0.9
traits:
  - id: execute-payload-symbol
    desc: Electron execute-payload symbol
    if:
      type: symbol
      exact: executePayload
  - id: process-one-payload-symbol
    desc: Electron process-one-payload symbol
    if:
      type: symbol
      exact: processOnePayload
