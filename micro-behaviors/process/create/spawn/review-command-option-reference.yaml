composite_rules:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  id: encodedcommand-process-launch
  desc: PowerShell EncodedCommand invocation
  crit: suspicious
  conf: 0.92
  all:
  - id: metadata/lang/source/syntax/argument::encodedcommand-option-reference
  any:
  - id: micro-behaviors/process/create/spawn::encodedcommand-child-process-js
  - id: micro-behaviors/process/create/hidden::encodedcommand-exec-js
  unless:
  - id: metadata/package/testing/corpus/
  - id: metadata/package/testing/presence/harness/
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: micro-behaviors/process/create/hidden::encodedcommand-known-benign-context
  - id: metadata/path::test-directory-component
  downgrade:
    any:
    - id: metadata/lang/source/syntax/argument::encodedcommand-constructed-payload
