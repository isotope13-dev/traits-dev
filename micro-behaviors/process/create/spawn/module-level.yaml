defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: module-level-require-spawn-call
    desc: Module load calls a required module's spawn
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn(Sync)?$'
      module_level: true
      receiver:
        from:
          call: '^require$'
