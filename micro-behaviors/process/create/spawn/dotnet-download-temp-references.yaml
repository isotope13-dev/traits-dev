# Metadata references identify available APIs; they neither bind the returned
# download path to Process.Start nor establish reachability in configuration.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: dotnet-download-temp-process-references
    desc: .NET download, temporary-path and process-start references
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/client/managed::dotnet-downloadfile-token
      - id: micro-behaviors/process/create/spawn::dotnet-process-start-split-tokens
      - id: micro-behaviors/fs/path/temp::any-temp-path
