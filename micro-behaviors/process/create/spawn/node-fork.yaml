defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  # Node's fork launches a fresh Node interpreter, including on Windows.
  # TypeScript emits a comma-expression callee that lacks a call-target fact.
  - id: node-child-process-fork-call
    desc: Calls the Node child_process fork member
    if:
      type: text
      regex: '\bchild_process(_[0-9]+)?\.fork\s*\)?\s*\('
