# Co-occurrence does not bind the download destination to the process argument.
# These observations also describe ordinary prerequisite installers.
defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-webclient-executable-url-start-context
    desc: WebClient EXE URL and process-start context
    crit: notable
    conf: 0.97
    unless:
      - id: micro-behaviors/os/console/io::confirm-yes-no-prompt
      # Vendor MSI installers fetch a package and invoke msiexec (including
      # prior-version uninstall cleanup): installer flow, not a stealth
      # payload launch. The iwr sibling already excludes this context.
      - id: micro-behaviors/process/create/start-process::start-process-msiexec
      - id: well-known/lib/platform/browser-automation/automation-context::playwright-core-chrome-reinstall-helper
      - id: well-known/app/infrastructure/docker::source-tree
      - id: well-known/app/infrastructure/chef::chef-source-context
      - id: well-known/app/infrastructure/datadog-agent::source-context
      - id: metadata/build/recognized-contexts::sysmanage-prerequisite-installer-context
    all:
      - id: micro-behaviors/communications/http/client/initialize::powershell-system-webclient-construction
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-call
      - id: micro-behaviors/communications/http/download/url::powershell-executable-url-except-ssm
      - id: micro-behaviors/process/create/exec::start-process-call
    near_bytes: 8192
  - id: powershell-webclient-exe-staging-start-context
    desc: WebClient EXE staging and process-start context
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/download/webclient::webclient-downloadfile-exe
      - id: micro-behaviors/process/create/exec::start-process-call
