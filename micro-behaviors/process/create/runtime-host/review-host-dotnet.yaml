defaults:
  for:
  - pe
  - dll
  - csharp
  platforms:
  - windows
  crit: notable
  conf: 0.9
composite_rules:
- id: dotnet-powershell-host
  desc: .NET PowerShell execution host
  all:
  - id: metadata/import/framework::sma-namespace
  any:
  - id: metadata/import/framework::powershell-create
  - id: metadata/lang/source/naming/function::create-runspace
  unless:
  - id: well-known/lib/vendor-sdk/powerforge/
- id: dotnet-powershell-exec
  desc: PowerShell host with script or argument construction references
  all:
  - id: micro-behaviors/process/create/runtime-host::dotnet-powershell-host
  any:
  - id: metadata/lang/source/naming/function::add-script
  - id: metadata/lang/source/syntax/call/invocation::add-command
  - id: metadata/lang/source/naming/function::add-parameter
  - id: metadata/lang/source/syntax/call/invocation::add-argument
  - id: metadata/lang/source/naming/function::create-runspace
  - id: metadata/import/framework::sma-host
  - id: metadata/import/framework::sma-runspaces
  - id: micro-behaviors/fs/path/script::embedded-ps1
  needs: 2
  downgrade:
    any:
    - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
  unless:
  - id: well-known/lib/vendor-sdk/powerforge/
