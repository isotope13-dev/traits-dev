# Executables that ship inside the .NET Framework runtime directory
# (aspnet_compiler.exe, MSBuild.exe, RegSvcs.exe, InstallUtil.exe, csc.exe, ...).
# Naming one by absolute path is ordinary for ASP.NET build/deploy scripts and
# is also how managed injectors name the signed host process they hollow, so
# this is the neutral path observation; intent comes from the composites that
# reference it.
#
# Kept outside process/create/exec so that leaf stays under the 80-trait cap
# (same pattern as process/create/shellexec for ShellExecute text atoms).
defaults:
  platforms: [windows]
  for: [powershell, batch, vbs, javascript, csharp]
  crit: notable
  conf: 0.9

traits:
  # Matches the runtime directory rather than a fixed tool list, so a host
  # binary this rule set has not seen before is still captured.
  - id: dotnet-framework-runtime-exe-path
    desc: Path to a .NET Framework runtime exe
    attack: T1218
    if:
      type: text
      regex: '(?i)\\Microsoft\.NET\\Framework(64)?\\v[0-9.]+\\[\w-]+\.exe\b'

  # Shared image-name atom for ServiceModelReg.exe (WCF registration host).
  # Hollowing objectives reference this; bare name match is a neutral capability.
  - id: servicemodelreg-exe-name
    desc: References ServiceModelReg.exe image name
    crit: notable
    conf: 0.9
    for: [batch, c, cpp, csharp, go, javascript, lua, pe, dll, php, powershell, python, ruby, rust, vbs, scripts]
    if:
      type: text
      regex: '(?i)\bServiceModelReg\.exe\b'

  # Shared image-name atom for AddInProcess32.exe (System.AddIn's out-of-
  # process host). Moved from objectives/evasion/process/injection/hollowing,
  # where the bare name convicted at suspicious: the .NET Framework's own
  # AddInProcess32.exe and System.AddIn.dll carry it, being the thing named.
  - id: addinprocess32-exe-name
    desc: References AddInProcess32.exe image name
    for: [pe, dll, c, cpp, csharp, go, rust]
    if:
      type: text
      regex: '(?i)\bAddInProcess32\.exe\b'

  # Shared image-name atom for RegAsm.exe (.NET assembly registration tool).
  # Hollowing objectives reference this; a bare name match is neutral. The
  # `.exe` suffix is required so prose that merely spells out the `regasm`
  # command line (.NET Framework help and error text ships it) does not match.
  - id: regasm-exe-name
    desc: References RegAsm.exe image name
    crit: notable
    conf: 0.9
    for: [batch, c, cpp, csharp, go, javascript, lua, pe, dll, php, powershell, python, ruby, rust, vbs, scripts]
    if:
      type: text
      regex: '(?i)\bRegAsm\.exe\b'

  # Image-name atoms for the remaining .NET Framework host tools that managed
  # loaders hollow. Relocated (2026-09) from objectives/command-and-control/
  # dropper/staging/encrypted, where the bare names were filed as a "host
  # process target list" -- which is exactly what the .NET Framework's own
  # InstallUtil.exe, MSBuild.exe and aspnet_*.exe contain.
  - id: installutil-exe-name
    desc: References InstallUtil.exe image name
    for: [pe, dll, csharp]
    if:
      type: text
      regex: '(?i)\bInstallUtil\.exe\b'

  - id: mscorsvw-exe-name
    desc: References mscorsvw.exe image name
    for: [pe, dll, csharp]
    if:
      type: text
      regex: '(?i)\bmscorsvw\.exe\b'

  - id: msbuild-exe-name
    desc: References MSBuild.exe image name
    for: [pe, dll, csharp]
    conf: 0.8
    if:
      type: text
      word: MSBuild.exe

  - id: aspnet-tool-exe-name
    desc: References an ASP.NET tool image name
    for: [pe, dll, csharp]
    conf: 0.86
    if:
      type: text
      regex: 'aspnet_(compiler|regiis|state|wp)\.exe'

composite_rules:
  - id: dotnet-hollowing-host-exe-name
    desc: References a hollowable .NET host image name
    for: [pe, dll, csharp]
    any:
      - id: regasm-exe-name
      - id: installutil-exe-name
      - id: mscorsvw-exe-name
      - id: addinprocess32-exe-name
