# Executables that ship inside the .NET Framework runtime directory
# (aspnet_compiler.exe, MSBuild.exe, RegSvcs.exe, InstallUtil.exe, csc.exe, ...).
# Naming one by absolute path is ordinary for ASP.NET build/deploy scripts and
# is also how managed injectors name the signed host process they hollow, so
# this is the neutral path observation; intent comes from the composites that
# reference it.
#
# Kept outside process/create/exec so that leaf stays under the 80-trait cap
# (same pattern as process/create/shellexec for ShellExecute text atoms).
defaults:
  platforms: [windows]
  for: [powershell, batch, vbs, javascript, csharp]
  crit: notable
  conf: 0.9

traits:
  # Matches the runtime directory rather than a fixed tool list, so a host
  # binary this rule set has not seen before is still captured.
  - id: dotnet-framework-runtime-exe-path
    desc: Path to a .NET Framework runtime exe
    attack: T1218
    if:
      type: text
      regex: '(?i)\\Microsoft\.NET\\Framework(64)?\\v[0-9.]+\\[\w-]+\.exe\b'

  # Shared image-name atom for ServiceModelReg.exe (WCF registration host).
  # Hollowing objectives reference this; bare name match is a neutral capability.
  - id: servicemodelreg-exe-name
    desc: References ServiceModelReg.exe image name
    crit: notable
    conf: 0.9
    for: [batch, c, cpp, csharp, go, javascript, lua, pe, dll, php, powershell, python, ruby, rust, vbs, scripts]
    if:
      type: text
      regex: '(?i)\bServiceModelReg\.exe\b'

  # Shared image-name atom for RegAsm.exe (.NET assembly registration tool).
  # Hollowing objectives reference this; a bare name match is neutral. The
  # `.exe` suffix is required so prose that merely spells out the `regasm`
  # command line (.NET Framework help and error text ships it) does not match.
  - id: regasm-exe-name
    desc: References RegAsm.exe image name
    crit: notable
    conf: 0.9
    for: [batch, c, cpp, csharp, go, javascript, lua, pe, dll, php, powershell, python, ruby, rust, vbs, scripts]
    if:
      type: text
      regex: '(?i)\bRegAsm\.exe\b'
