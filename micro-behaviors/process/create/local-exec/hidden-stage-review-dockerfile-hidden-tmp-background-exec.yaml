defaults:
  for: [scripts, manifests, html, xml, dockerfile, package-lock.json, groovy]
  platforms: [linux, macos, windows]

traits:
- id: dockerfile-hidden-tmp-background-exec
  desc: Dockerfile backgrounds a hidden temp file
  crit: notable
  conf: 0.94
  for: [dockerfile]
  if:
    type: text
    regex: '&&[ \t]*/tmp/\.[A-Za-z0-9_-]{1,32}[ \t]*&'

