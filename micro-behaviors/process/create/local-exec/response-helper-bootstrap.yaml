# Awaited data is written as an executable and launched by its caller.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: awaited-data-executable-write
  desc: Awaited data becomes a startup executable
  crit: notable
  conf: 0.99
  size_max: 131072
  if:
    type: tree-sitter
    query: |
      ((function_declaration
        name: (identifier) @function
        body: (statement_block
          (lexical_declaration
            (variable_declarator
              name: (identifier) @model
              value: (await_expression
                (call_expression
                  function: (identifier) @download
                  arguments: (arguments
                    (identifier) @endpoint
                    (identifier) @secret)))))
          (_)*
          (expression_statement
            (call_expression
              function: (member_expression
                object: (identifier) @filesystem
                property: (property_identifier) @write)
              arguments: (arguments
                (identifier) @path
                (call_expression
                  function: (member_expression
                    object: (identifier) @buffer
                    property: (property_identifier) @from)
                  arguments: (arguments (identifier) @written_model))
                (object
                  (pair
                    key: (property_identifier) @mode
                    value: (number) @mode_value)
                  (pair
                    key: (property_identifier) @flag
                    value: (string) @flag_value)))))))
      (#eq? @written_model @model)
      (#eq? @write "writeFileSync")
      (#eq? @from "from")
      (#eq? @mode "mode")
      (#match? @mode_value "^(493|509|0[xX]1[eEfF][dD]|0[oO]7[57]5)$")
      (#eq? @flag "flag")
      (#match? @flag_value "^[\"']w[\"']$")
      )

- id: launched-helper-path-from-setup
  desc: Activation launches the setup-returned helper
  crit: notable
  conf: 0.98
  size_max: 131072
  if:
    type: tree-sitter
    query: |
      ((program
        (function_declaration
          name: (identifier) @helper
          body: (statement_block
            .
            (variable_declaration
              (variable_declarator
                name: (identifier) @target
                value: (call_expression)))
            (_)*
            (expression_statement
              (call_expression
                function: (member_expression
                  property: (property_identifier) @exec)
                arguments: (arguments
                  (call_expression
                    function: (member_expression
                      property: (property_identifier) @join)
                    arguments: (arguments (identifier) @executed_target)))))))
        (_)*
        (function_declaration
          name: (identifier) @activation
          body: (statement_block
            .
            (try_statement
              body: (statement_block
                (_)*
                (expression_statement
                  (await_expression
                    (call_expression
                      function: (identifier) @called))))))))
      (#eq? @exec "exec")
      (#eq? @join "join")
      (#eq? @target @executed_target)
      (#eq? @helper @called)
      (#eq? @activation "activate")
      )

- id: transformed-response-returned
  desc: Returns transformed Base64 response bytes
  crit: notable
  conf: 0.98
  size_max: 131072
  if:
    type: tree-sitter
    query: |
      ((arrow_function
        body: (statement_block
          (_)*
          (lexical_declaration
            (variable_declarator
              name: (identifier) @decoded
              value: (call_expression
                function: (member_expression
                  object: (identifier) @buffer
                  property: (property_identifier) @from)
                arguments: (arguments
                  (member_expression
                    object: (identifier) @response
                    property: (property_identifier) @payload)
                  (string) @encoding))))
          (_)*
          (lexical_declaration
            (variable_declarator
              name: (identifier) @transformed
              value: (call_expression
                function: (identifier) @transform
                arguments: (arguments
                  (_)
                  (_)
                  (identifier) @ciphertext))))
          (_)*
          (expression_statement
            (call_expression
              function: (identifier) @resolve
              arguments: (arguments (identifier) @returned)))))
      (#eq? @buffer "Buffer")
      (#eq? @from "from")
      (#match? @encoding "^[\"']base64[\"']$")
      (#match? @payload "(?i)(model|payload|asset|data|body|bytes)")
      (#eq? @transform "xchacha20")
      (#eq? @ciphertext @decoded)
      (#eq? @resolve "resolve")
      (#eq? @transformed @returned)
      )

- id: streamed-json-response-source
  desc: Parses the data buffer as JSON
  crit: notable
  conf: 0.97
  size_max: 131072
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: (member_expression
          object: (identifier) @json
          property: (property_identifier) @parse)
        arguments: (arguments (identifier) @parsed_data))
      (#eq? @json "JSON")
      (#eq? @parse "parse")
      (#eq? @parsed_data "data")
      )

composite_rules:
- id: activation-decoded-response-helper
  desc: Decoded response becomes the launched startup executable
  crit: suspicious
  conf: 0.99
  size_max: 131072
  all:
  - id: awaited-data-executable-write
  - id: launched-helper-path-from-setup
  - id: transformed-response-returned
  - id: streamed-json-response-source
