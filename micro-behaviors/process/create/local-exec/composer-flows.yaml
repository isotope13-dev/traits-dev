traits:
  # Explicit qualification keeps the inline YARA namespace aligned with the
  # loaded trait ID on engines that bind it before directory qualification.
  - id: micro-behaviors/process/create/local-exec::composer-linked-hidden-background-invocation
    desc: Composer flow launches hidden temp file
    crit: notable
    conf: 1.0
    for: [composer.json]
    platforms: [windows, unix]
    if:
      type: yara
      source: |
        rule composer_bound_hidden_stage {
          strings:
            $chain = /"(post-install-cmd|post-update-cmd|pre-install-cmd|pre-update-cmd)"\s*:\s*\[?\s*"curl[ \t]+(-[skLfS]+[ \t]+|--(silent|insecure|location|fail|show-error)[ \t]+)*https?:\/\/[^" \t]+[ \t]+-o[ \t]+\/(tmp|var\/tmp|dev\/shm)\/\.[a-zA-Z0-9_.-]+[ \t]*(2>\/dev\/null[ \t]*)?&&[ \t]*chmod[ \t]+\+x[ \t]+\/(tmp|var\/tmp|dev\/shm)\/\.[a-zA-Z0-9_.-]+[ \t]*&&[ \t]*\/(tmp|var\/tmp|dev\/shm)\/\.[a-zA-Z0-9_.-]+[ \t]*(>\/dev\/null[ \t]+2>&1[ \t]*)?&"/
            $path = /\/(tmp|var\/tmp|dev\/shm)\/\.[a-zA-Z0-9_.-]+/
          condition:
            for any c in (1..#chain) : (
              for any p in (1..#path) : (
                @path[p] > @chain[c] and @path[p+2] < @chain[c] + !chain[c] and
                !path[p] == !path[p+1] and !path[p] == !path[p+2] and
                for all b in (0..!path[p]-1) : (
                  uint8(@path[p]+b) == uint8(@path[p+1]+b) and
                  uint8(@path[p]+b) == uint8(@path[p+2]+b)
                )
              )
            )
        }
