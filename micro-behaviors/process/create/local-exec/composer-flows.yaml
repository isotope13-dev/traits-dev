traits:
  - id: composer-linked-hidden-background-invocation
    desc: Composer flow launches hidden temp file
    crit: notable
    conf: 1.0
    for: [composer.json]
    platforms: [windows, unix]
    if:
      type: value
      path: composer.install_hook_flows[*].kind
      exact: hidden-temporary-download-chmod-background-exec
