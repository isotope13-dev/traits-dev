# Launching something the package carries with it, resolved off the module's
# own directory rather than found on PATH.
#
# Ordinary on its own -- this is how a VS Code extension starts its bundled
# language server, and how a wrapper package starts its vendored binary -- so
# it is context, not a finding. What makes it worth recording is that it pins
# the launch target to bytes shipped in the artifact under analysis: whatever
# runs is right here to be looked at, and composites that judge disguised
# payloads need to know the file came from inside the package.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1106

traits:
  - id: node-exec-bundled-package-file
    desc: Executes a file bundled beside the module
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(exec|spawn)[A-Za-z]*\(\s*path\.(resolve|join)\s*\(\s*__dirname'
  - id: node-execfile-exe-path
    desc: execFile launches a Windows exe
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(exec|spawn)[A-Za-z]*\([^)]{0,80}\.exe["'']'
