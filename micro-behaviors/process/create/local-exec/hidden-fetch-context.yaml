# Neutral mechanics; these conditions do not establish an attacker objective.
defaults:
  for: [scripts, manifests, html, xml, dockerfile, package-lock.json, groovy]
  platforms: [linux, macos, windows]
composite_rules:
  - id: hidden-fetch-chmod-launch-context
    desc: Hidden download, chmod and launch co-occur
    crit: notable
    conf: 0.97
    near_lines: 20
    all:
    - id: micro-behaviors/communications/http/download/cli::hidden-output-download-context
    - id: micro-behaviors/fs/chmod/executable/mode::chmod-hidden-path-command-container
    any:
    - id: micro-behaviors/process/create/local-exec::hidden-stage-chmod-execute
    - id: micro-behaviors/process/create/local-exec::hidden-home-path-invocation
    - id: micro-behaviors/process/create/local-exec::hidden-tmp-background-exec
    unless:
    - id: micro-behaviors/process/create/local-exec::python-without-process-execution
    - id: metadata/package/testing/presence/harness::test-directory
    - id: metadata/package/testing/presence/fixture::synthetic-data-generator-filename
