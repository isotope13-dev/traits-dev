defaults:
  platforms: [linux, macos, windows]
  for: [python]
composite_rules:
  - id: python-without-process-execution
    desc: Embedded command lacks Python execution evidence
    crit: exception
    all:
      - id: micro-behaviors/communications/http/download/executable::embedded-download-chmod-command
    unless:
      - id: micro-behaviors/process/create/subprocess/
      - id: micro-behaviors/process/create/system/
      - id: python-shell-call-observation
      - id: micro-behaviors/process/create/popen/
      - id: micro-behaviors/process/create/execv/
      - id: micro-behaviors/process/create/spawnv/
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
      - id: micro-behaviors/process/interpreter/eval/direct::eval-builtin
  - id: python-shell-call-observation
    desc: Python os.system shell-call observations
    crit: exception
    any:
      - id: micro-behaviors/process/create/shell/command-mode::python-dunder-import-os-system
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system-text
