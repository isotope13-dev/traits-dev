# Neutral mechanics; these conditions do not establish an attacker objective.
defaults:
  platforms: [macos]
  for: [shell]
composite_rules:
  - id: download-xattr-chmod-temp-launch
    desc: Download, xattr, chmod and temp launch co-occur
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/fs/path/temp::unix-temp
      - id: micro-behaviors/fs/attributes/xattr::xattr-clear
      - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
      - id: micro-behaviors/process/create/shell/tmp-exec::shell-tmp-execution
