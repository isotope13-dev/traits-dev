defaults:
  for: [scripts, manifests, html, xml, dockerfile, package-lock.json, groovy]
  platforms: [linux, macos, windows]
composite_rules:
- id: hidden-stage-chmod-execute
  desc: Hidden-path chmod and nearby launch command
  crit: notable
  conf: 0.98
  near_lines: 3
  all:
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-hidden-path-command-container
  any:
  - id: micro-behaviors/process/create/local-exec::tmp-path-execution
  - id: micro-behaviors/process/create/local-exec::execute-dot-slash-literal
  - id: micro-behaviors/process/create/shell/spawn::shell-execution-shm
  - id: micro-behaviors/process/create/script/gradle::command-line
  unless:
  - id: micro-behaviors/process/create/local-exec::python-without-process-execution
  - id: metadata/build/docker::image-scan-layer-history
  # Synthetic data generators embed dropper-shaped string literals as the
  # fake attack content they fabricate; the filename says so.
  - id: metadata/package/testing/presence/fixture::synthetic-data-generator-filename
