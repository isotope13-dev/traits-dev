defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: multi-local-executable-launch
    desc: Shell launches three local executables
    crit: notable
    conf: 0.91
    attack: T1059.004
    count_min: 3
    if:
      type: text
      regex: '(?m)^\s*\./[A-Za-z0-9._$-]{2,80}\b.{0,120}$'
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/harness/runtime/
  - id: native-relative-executable-string
    desc: Relative executable path string
    crit: component
    conf: 0.88
    for: [elf]
    if:
      type: raw
      regex: '(?i)\./[A-Za-z0-9._-]{2,32}\b'

  - id: local-execution
    desc: "Local ./ file invocation"
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '^\./[A-Za-z0-9._$-]{1,80}$'
    downgrade:
      any:
        - id: metadata/package/testing/presence/harness/
    unless:
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
      - id: metadata/build/autotools::autoconf-generated-script
      - id: metadata/package/testing/harness/runtime/
      - id: micro-behaviors/process/create/shell/git::git-operations-1
      - id: micro-behaviors/process/create/shell/git::git-operations-2
  - id: bash-local-relative-script
    desc: Bash runs a local relative script
    crit: notable
    conf: 0.9
    attack: T1059.004
    if:
      type: symbol
      kind: call
      exact: bash
      arg:
        kind: string
        substr: './'
  - id: shell-interpreter-hidden-relative-script
    desc: Shell interpreter runs hidden relative script
    crit: notable
    conf: 0.9
    attack: T1059.004
    if:
      type: text
      regex: '(?i)\b(bash|sh)[ \t]+["'']?\.[A-Za-z0-9_-]{3,64}\b'
  - id: sh-local-relative-script
    desc: Sh runs a local relative script
    crit: notable
    conf: 0.9
    attack: T1059.004
    if:
      type: symbol
      kind: call
      exact: sh
      arg:
        kind: string
        substr: './'
  - id: dash-local-relative-script
    desc: Dash runs a local relative script
    crit: notable
    conf: 0.9
    attack: T1059.004
    if:
      type: symbol
      kind: call
      exact: dash
      arg:
        kind: string
        substr: './'
  - id: zsh-local-relative-script
    desc: Zsh runs a local relative script
    crit: notable
    conf: 0.9
    attack: T1059.004
    if:
      type: symbol
      kind: call
      exact: zsh
      arg:
        kind: string
        substr: './'
  - id: local-executable-host-argument
    desc: Local executable receives host argument
    crit: notable
    conf: 0.92
    attack: T1059.004
    if:
      type: text
      regex: '(?m)^\s*\./[A-Za-z0-9._-]{2,64}\s+--host\s+\S+'
  - id: local-executable-user-argument
    desc: Local executable receives user argument
    crit: notable
    conf: 0.92
    attack: T1059.004
    if:
      type: text
      regex: '(?m)^\s*\./[A-Za-z0-9._-]{2,64}\s+--host\s+\S+\s+--user\s+\S+'
  - id: execute-dot-slash-var
    desc: Executes local variable path
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\./["'']?\$[A-Za-z_]\w*["'']?'
  # `"$f"` / '$bin' as a command — droppers and exec probes run a path held in
  # a variable after chmod, without the `./` prefix execute-dot-slash-var needs.
  # Require a command separator so prose like `see "$f"` does not match.
  - id: execute-quoted-var
    desc: Executes a quoted shell-variable path
    crit: notable
    conf: 0.88
    attack: T1059.004
    # This matcher describes shell grammar.  Applying it to every script type
    # would mistake quoted dollar-prefixed JavaScript strings for commands.
    if:
      type: text
      regex: '(^|[;&|]\s*)["'']\$\{?[A-Za-z_]\w*\}?["''](\s|/dev/null|>|<|;|&|$)'
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: execute-dot-slash-literal
    desc: Executes a local relative file
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^\./'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
  # `./` must be terminated by a statement separator or end of line. A trailing
  # `|` is not a pipeline here but the alternation separator inside a `case`
  # pattern list, which is how autoconf's PATH walk (`case $as_dir in ./ |
  # /[cC]/* | ...`) read as a bare dot-slash execution.
  - id: execute-dot-slash-empty-path
    desc: Dot-slash execution with no path operand
    crit: notable
    conf: 0.9
    attack: T1059.004
    if:
      type: text
      regex: '(?m)(^|[;&|])\s*\./\s*([;&]|$)'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/binary/installer/script::install4j-unix-sfx
      - id: metadata/file/metrics::high-byte-script-text
  - id: tmp-path-execution
    desc: "Executes a file from temp path"
    crit: notable
    conf: 0.8
    attack: T1059.004
    unless:
      - id: metadata/package/files/system-package::zsh-function-script
    if:
      type: text
      regex: '(?m)(^|[\n;&|])\s*/(tmp|var/tmp|dev/shm)/["''\.\w$][^\s;&|]{0,80}'
    not:
      - regex: '/(tmp|var/tmp|dev/shm)/[^\s;&|]*[<*?\[\](){}]'
      # A `\`-continued redirect puts its target at start-of-line, where `^`
      # cannot tell it from a command word: lua-resty-etcd's
      # utils/check-lua-code-style.sh writes `... -exec ./utils/lj-releng {} + > \`
      # then `    /tmp/check.log 2>&1`, and the log path read as an executable.
      # These extensions are data sinks, never the payload being run.
      - regex: '\.(log|out|txt|err)'
  - id: background-tmp-execution
    desc: Backgrounds executable from temporary path
    crit: notable
    conf: 0.9
    attack: T1059.004
    if:
      type: text
      regex: '(?m)(^|[;&|]\s*)/(tmp|var/tmp|dev/shm)/["''\.\w$][^\n;&|]{0,80}\s+&\s*$'
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: background-local-exec
    desc: "Executes local file in background (& operator)"
    crit: notable
    conf: 0.85
    attack: T1059.004
    if:
      type: text
      regex: '(?m)\./["''\.\w\$][^\n;&]{0,80}\s+&\s*$'
    downgrade:
      any:
        - id: metadata/package/testing/presence/harness/
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: micro-behaviors/process/create/shell/git::git-operations-1
      - id: micro-behaviors/process/create/shell/git::git-operations-2
  - id: execute-variable-background
    desc: Backgrounds a shell-variable executable
    crit: notable
    conf: 0.9
    attack: T1059.004
    if:
      type: text
      regex: '(?m)^\s*["'']?\$\{?[A-Za-z_][A-Za-z0-9_]*\}?["'']?\s+&\s*$'
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: shell-variable-exec-with-args
    desc: Shell runs a variable command with args
    crit: notable
    conf: 0.9
    attack: T1059.004
    if:
      type: text
      regex: '(?m)^\s*["'']?\$\{?[A-Za-z_][A-Za-z0-9_]*\}?["'']?\s+["'']?\$[@*]["'']?'
    unless:
      - id: metadata/package/testing/harness/runtime/
  - id: pyproject-hidden-tmp-background-exec
    desc: PyProject backgrounds hidden temp executable
    crit: notable
    conf: 0.95
    for: [pyproject.toml]
    platforms: [linux, macos, windows]
    if:
      type: value
      path: tool.setuptools.cmdclass.build_py
      regex: '/tmp/\.[A-Za-z0-9_][A-Za-z0-9._-]*\s*&'
  - id: composer-hidden-tmp-background-exec
    desc: Composer hook backgrounds hidden temp executable
    crit: notable
    conf: 0.95
    for: [composer.json]
    platforms: [linux, macos, windows]
    if:
      type: value
      path: scripts.post-install-cmd[*]
      regex: '/tmp/\.[A-Za-z0-9_][A-Za-z0-9._-]*\s*&'
  - id: structured-hidden-tmp-background-exec
    desc: Structured command backgrounds hidden temp file
    crit: notable
    conf: 0.95
    for: [vbs, package-lock.json, plist]
    platforms: [linux, macos, windows]
    if:
      type: text
      regex: '/tmp/\.[A-Za-z0-9_][A-Za-z0-9._-]*\s+(&|&amp;)'
  - id: hidden-tmp-background-exec
    desc: Backgrounds a hidden temporary executable
    crit: notable
    conf: 0.94
    for: [shell, php, applescript]
    if:
      type: text
      regex: '(?m)(^|[;&]\s*|nohup\s+)/(var/)?tmp/\.[A-Za-z0-9_][A-Za-z0-9._-]*[^;\n]{0,80}\s*&'
  - id: hidden-home-background-exec
    desc: Backgrounds a hidden home executable
    crit: notable
    conf: 0.94
    for: [shell, php]
    if:
      type: text
      regex: '(?m)(^|[;&]\s*)~/\.[A-Za-z0-9_][A-Za-z0-9._-]*[^;\n]{0,80}\s*&'
  # Relocated from objectives/lateral-movement/ssh/propagation/, where a plain
  # `nohup /tmp/x` was filed as SSH propagation evidence. The matcher names no
  # remote host and no SSH surface -- it detects one thing, "detach a process
  # whose image sits in a world-writable scratch directory", which is a local
  # execution capability. Installers and CI scripts do background helpers from
  # /tmp, so the intent stays with the dropper composites that pair this with
  # the fetch and the chmod.
  #
  # `scripts`, not `shell`: the same command text appears inside
  # os.system("nohup /tmp/x &") in a Python or Node dropper. Kept to `scripts`
  # so the text matcher stays under the file-type cap.
  - id: detached-temp-path-launch
    desc: Detached launch of a temp-path binary
    crit: notable
    conf: 0.86
    attack: T1059
    for: [scripts]
    if:
      type: text
      regex: '(?i)\b(nohup|setsid|systemd-run)\s+/(var/)?(tmp|dev/shm)/[^\s;|&]{1,120}'

composite_rules:
  - id: local-executable-host-user-arguments
    desc: Local executable receives host and user
    crit: notable
    conf: 0.94
    attack: T1059.004
    all:
      - id: local-executable-host-argument
      - id: local-executable-user-argument
    near_lines: 1
  - id: chmod-exec-var-local
    desc: chmod then executes local variable
    crit: notable
    conf: 0.9
    attack: T1222.002
    all:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: execute-dot-slash-var
    near_bytes: 180
  # Same chmod→run chain when the path is invoked as `"$var"` rather than `./$var`.
  - id: chmod-exec-quoted-var-local
    desc: chmod then executes quoted variable
    crit: notable
    conf: 0.9
    attack: T1222.002
    for: [scripts, binaries]
    all:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: execute-quoted-var
    near_bytes: 180
  - id: chmod-exec-literal-local
    desc: chmod then executes local literal
    crit: notable
    conf: 0.9
    attack: T1222.002
    all:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
      - id: execute-dot-slash-literal
    near_bytes: 180
  - id: interpreter-local-relative-script
    desc: Shell interpreter runs a local relative script
    crit: notable
    conf: 0.9
    attack: T1059.004
    any:
      - id: bash-local-relative-script
      - id: sh-local-relative-script
      - id: dash-local-relative-script
      - id: zsh-local-relative-script
  # Write no-op shebang under a var path, chmod +x, run `"$var"`, then rm — a
  # filesystem exec capability probe (agent-deck, sandboxes, installers). Keeps
  # the story as one notable finding so triage does not have to reassemble it
  # from the four atomics; the dropper composite stays suppressed via the noop
  # write unless.
  - id: temp-exec-capability-probe
    desc: Temp-path exec capability probe chain
    crit: notable
    conf: 0.92
    attack: T1059.004
    for: [scripts, binaries]
    all:
      - id: micro-behaviors/fs/file/write/redirect::noop-exit-shebang-script-write
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: execute-quoted-var
      - id: micro-behaviors/fs/file/delete::rm-force-variable-target
    near_bytes: 512
