    desc: Python backgrounds shell-variable command
    crit: notable
    conf: 0.95
    attack: T1059.006
    if:
      type: text
      regex: '(?s)\bos\.system\s*\(\s*f?["''][^\n]{0,300}\$\{?[A-Za-z_][A-Za-z0-9_]*\}?\s*&'
