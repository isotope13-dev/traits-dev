defaults:
  platforms: [unix]
  for: [python]
  attack: T1059.006

traits:
  - id: python-shell-variable-background-exec
    desc: Python backgrounds shell-variable command
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?s)\bos\.system\s*\(\s*f?["''][^\n]{0,300}\$\{?[A-Za-z_][A-Za-z0-9_]*\}?\s*&'

  # `subprocess.run(["python3", PATH])` -- a second interpreter launched on a
  # path held in a variable, which is how a downloaded file gets run. The
  # sibling `subprocess::python-isolated-source-run` covers the
  # `sys.executable -I` form; a dropper names the interpreter literally
  # because it wants the system one, not the environment it was installed
  # into.
  - id: python-interpreter-runs-variable-path
    desc: Spawns an interpreter on a variable path
    crit: notable
    conf: 0.92
    mbc: "C0017"
    if:
      type: text
      regex: 'subprocess\.(run|Popen|call)\(\s*\[\s*["''](python3?|node|sh|bash)["''],\s*\w+\s*\]'
