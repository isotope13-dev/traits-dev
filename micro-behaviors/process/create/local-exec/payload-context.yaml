# Local file staging and execution context. This does not establish a
# downloader or prove that the copied bytes are attacker supplied.
defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript]
  crit: suspicious
  conf: 0.75
traits:
  - id: cp-execute
    desc: Shell copies a file then executes it
    if:
      type: text
      regex: "(?m)(^|[;&\"'])\\s*cp\\s+[^\\n]{0,80}(&&|;)\\s*exec\\b"
    unless:
      - id: well-known/tool/offensive/nmap::nmap-source-tree

  - id: devnull-redirect
    desc: stdout/stderr to DEVNULL
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: DEVNULL.{0,20}stdout|stdout=.{0,20}DEVNULL
