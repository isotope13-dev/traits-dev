defaults:
  platforms:
  - unix
  - windows
  crit: exception
  conf: 0.99
composite_rules:
- id: openshift-vale-download-context
  desc: Recognized OpenShift Vale download context
  scope: file
  all:
  - id: metadata/path/software::openshift-release-source-tree
  - id: metadata/filename/identity::openshift-vale-review-step-path
  - id: well-known/tool/development/ci/validated-patterns::validatedpatterns-vale-helper-url
- id: openshift-istio-download-context
  desc: Recognized OpenShift Istio download context
  scope: file
  all:
  - id: metadata/path/software::openshift-release-source-tree
  - id: metadata/filename/identity::openshift-istio-install-step-path
  - id: well-known/app/infrastructure/service-mesh/kiali::kiali-prometheus-helper-url
