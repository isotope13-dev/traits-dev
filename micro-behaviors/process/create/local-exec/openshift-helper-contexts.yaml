defaults:
  platforms:
  - unix
  - windows
  crit: exception
  conf: 0.99
composite_rules:
- id: openshift-vale-download-context
  desc: Recognized OpenShift Vale download context
  scope: file
  all:
  - id: metadata/package/files/archive-member::openshift-release-source-tree
  - id: metadata/package/files/archive-member::openshift-vale-review-step-path
  - id: micro-behaviors/communications/http/url/github::validatedpatterns-vale-helper-url
- id: openshift-istio-download-context
  desc: Recognized OpenShift Istio download context
  scope: file
  all:
  - id: metadata/package/files/archive-member::openshift-release-source-tree
  - id: metadata/package/files/archive-member::openshift-istio-install-step-path
  - id: micro-behaviors/communications/http/url/github::kiali-prometheus-helper-url
