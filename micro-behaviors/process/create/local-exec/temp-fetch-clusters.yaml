defaults:
  platforms:
  - unix
  for:
  - shell
  crit: notable
  conf: 0.97
composite_rules:
- id: ip-temp-download-chmod-exec
  desc: Temp download, chmod, launch and external-IP markers
  all:
  - id: micro-behaviors/communications/http/download/wget::wget-output-document-option
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-tmp-file
  - id: micro-behaviors/process/create/local-exec::tmp-path-execution
  any:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  - id: micro-behaviors/communications/ip/literal::external-ipv4-script
  unless:
  - id: metadata/build/autotools::autoconf-generated-script
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: multi-arch-temp-fetch-exec-cluster
  desc: Temp fetch/launch and multi-architecture markers
  all:
  - id: micro-behaviors/communications/http/download/wget::wget-output-document-option
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-tmp-file
  - id: micro-behaviors/process/create/local-exec::tmp-path-execution
  - id: micro-behaviors/os/sysinfo/platform/arch::multi-arch-target
  - id: micro-behaviors/communications/ip/literal::http-ip-url
