defaults:
  for: [shell]
  platforms: [unix]
traits:
  - id: variable-output-mode-launch-chain
    desc: Variable output path reaches +x and execution
    crit: notable
    conf: 0.97
    # Perf guard: this chain query walks the full shell parse tree and blows
    # past the rule budget on large files heuristically typed as shell (e.g.
    # bundled Tcl harnesses). Staging chains are one-liners; skip big files.
    size_max: 50000
    if:
      type: tree-sitter
      query: |
        ((list (list (command
          name: (command_name) @download
          argument: (word) @output_flag
          argument: (_) @output_path
          argument: (_) @url) "&&" (command
          name: (command_name) @chmod
          argument: (word) @mode
          argument: (_) @chmod_path)) "&&" (command name: (command_name (_) @launch_path))) @chain
          (#match? @download "^\"?\\$")
          (#match? @chmod "^\"?\\$")
          (#match? @output_flag "^(-o|--output)$")
          (#eq? @mode "+x")
          (#eq? @output_path @chmod_path)
          (#eq? @output_path @launch_path))
  - id: variable-output-clear-mode-launch-chain
    desc: Variable output path reaches -c, +x, execution
    crit: notable
    conf: 0.97
    # Perf guard: same as variable-output-mode-launch-chain above; this query
    # adds another command level and is at least as expensive per byte.
    size_max: 50000
    if:
      type: tree-sitter
      query: |
        ((list (list (list (command
          name: (command_name) @download
          argument: (word) @output_flag
          argument: (_) @output_path
          argument: (_) @url) "&&" (command
          name: (command_name) @clear
          argument: (word) @clear_flag
          argument: (_) @clear_path)) "&&" (command
          name: (command_name) @chmod
          argument: (word) @mode
          argument: (_) @chmod_path)) "&&" (command name: (command_name (_) @launch_path))) @chain
          (#match? @download "^\"?\\$")
          (#match? @chmod "^\"?\\$")
          (#match? @output_flag "^(-o|--output)$")
          (#eq? @mode "+x")
          (#eq? @output_path @chmod_path)
          (#eq? @output_path @launch_path)
          (#match? @clear "^\"?\\$")
          (#eq? @clear_flag "-c")
          (#eq? @output_path @clear_path))

composite_rules:
  - id: world-writable-local-binary-exec
    desc: Executes a local binary after granting world-write permission
    crit: notable
    conf: 0.88
    attack: T1222.002
    all:
      - id: micro-behaviors/fs/chmod/executable/dangerous::shell-777
      - id: micro-behaviors/process/create/local-exec::execute-dot-slash-literal
    near_bytes: 160
    unless:
      - id: metadata/package/testing/presence/harness::shell-example-directory
      - id: well-known/lib/ai/inspect-evals::eval-corpus-context
