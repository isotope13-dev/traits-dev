defaults:
  for: [shell]
  platforms: [unix]
traits:
  - id: variable-output-mode-launch-chain
    desc: Variable output path reaches +x and execution
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((list (list (command
          name: (command_name) @download
          argument: (word) @output_flag
          argument: (_) @output_path
          argument: (_) @url) "&&" (command
          name: (command_name) @chmod
          argument: (word) @mode
          argument: (_) @chmod_path)) "&&" (command name: (command_name (_) @launch_path))) @chain
          (#match? @download "^\"?\\$")
          (#match? @chmod "^\"?\\$")
          (#match? @output_flag "^(-o|--output)$")
          (#eq? @mode "+x")
          (#eq? @output_path @chmod_path)
          (#eq? @output_path @launch_path))
  - id: variable-output-clear-mode-launch-chain
    desc: Variable output path reaches -c, +x, execution
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((list (list (list (command
          name: (command_name) @download
          argument: (word) @output_flag
          argument: (_) @output_path
          argument: (_) @url) "&&" (command
          name: (command_name) @clear
          argument: (word) @clear_flag
          argument: (_) @clear_path)) "&&" (command
          name: (command_name) @chmod
          argument: (word) @mode
          argument: (_) @chmod_path)) "&&" (command name: (command_name (_) @launch_path))) @chain
          (#match? @download "^\"?\\$")
          (#match? @chmod "^\"?\\$")
          (#match? @output_flag "^(-o|--output)$")
          (#eq? @mode "+x")
          (#eq? @output_path @chmod_path)
          (#eq? @output_path @launch_path)
          (#match? @clear "^\"?\\$")
          (#eq? @clear_flag "-c")
          (#eq? @output_path @clear_path))

