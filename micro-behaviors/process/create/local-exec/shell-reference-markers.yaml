defaults:
  platforms: [unix]
  for: [shell]
traits:
- id: hidden-dotfile-chmod-exec
  desc: hidden payload chmod then exec
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'chmod\s+\+x\s+\.[\w-]{1,12}\s+&&\s+\./\.[\w-]{1,12}'
- id: chmod-setuid-wildcard-then-exec
  desc: chmod setuid wildcard then execute
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'chmod\s+\+s\s+\*;[^\n]{0,80}\./[A-Za-z0-9._-]{1,40}'
# Classic multi-arch IoT stager: `cat <arch> >s;chmod +s *;./s …; rm -rf s`.
- id: arch-cat-setuid-short-payload
  desc: Arch payload copied to setuid short name
  crit: notable
  conf: 0.96
  count_min: 3
  if:
    type: text
    regex: 'cat\s+[A-Za-z0-9._-]{2,12}\s*>s;chmod\s+\+s\s+\*;\./s\b'
- id: chmod-777-wildcard-then-exec
  desc: chmod 777 wildcard then execute payload
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'chmod\s+777\s+\*;[^\n]{0,80}\./[A-Za-z0-9._-]{2,40}'
- id: main-to-wtf-chmod-exec
  desc: main payload copied chmoded executed
  crit: notable
  conf: 0.98
  count_min: 3
  if:
    type: text
    regex: 'cat\s+main\.[^;\n]{1,16}\s*>WTF;chmod\s+\+x\s+\*;\./WTF'
