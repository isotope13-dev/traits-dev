defaults:
  platforms: [unix, windows]
  for: [shell]
composite_rules:
- id: shell-download-chmod-local-exec
  desc: Shell download, chmod and temporary launch cluster
  crit: notable
  conf: 0.96
  near_lines: 30
  all:
    - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-tmp-file
    - id: micro-behaviors/process/create/local-exec::tmp-path-execution
  any:
    - id: micro-behaviors/communications/http/download/wget::wget-output-file
    - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-script
  unless:
    - id: metadata/build/archive::source-archive-member
    - id: metadata/build/autotools::autoconf-generated-script
    - id: well-known/app/system/brev-cli::source-tree-marker
    - id: well-known/app/infrastructure/dokku::dokku-source-tree
    - id: well-known/tool/detection/stackrox::ci-source-context
    - id: metadata/package/files/archive-member::openshift-release-ci-step-context
    - id: micro-behaviors/os/package-manager/installer-script::installer-script
    - id: micro-behaviors/os/package-manager/installer-script::silent-eula-accept-installer
    - id: micro-behaviors/os/package-manager/installer-script::verified-github-release-installer
- id: raw-ip-download-chmod-local-exec
  desc: Download/launch cluster with external-IP URL
  crit: notable
  conf: 0.97
  all:
    - id: micro-behaviors/process/create/local-exec::shell-download-chmod-local-exec
  any:
    - id: micro-behaviors/communications/ip/literal::http-ip-url
    - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
    - id: micro-behaviors/communications/ip/literal::external-ipv4-script
- id: raw-ip-redirected-download-chmod-exec
  desc: File-output fetch with local chmod/launch command
  crit: notable
  conf: 0.98
  all:
    - id: micro-behaviors/communications/http/download/shell::fetch-output-to-literal
    - id: micro-behaviors/process/create/local-exec::chmod-exec-literal-local
  any:
    - id: micro-behaviors/communications/ip/literal::http-ip-url
    - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
    - id: micro-behaviors/communications/ip/literal::external-ipv4-script
- id: raw-ip-output-multiarch-exec-cluster
  desc: Raw-IP file-output multi-architecture execution cluster
  crit: notable
  conf: 0.98
  all:
    - id: micro-behaviors/process/create/local-exec::raw-ip-redirected-download-chmod-exec
    - id: micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist
