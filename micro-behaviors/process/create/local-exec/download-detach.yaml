# Neutral observations; attack consumers must supply intent-specific evidence.
composite_rules:
- platforms:
  - linux
  - macos
  - windows
  id: download-chmod-nohup-cooccurrence
  desc: Download, chmod and nohup in one script
  crit: notable
  conf: 0.9
  for:
  - shell
  all:
  - id: micro-behaviors/communications/http/download/curl::curl-cmd
  - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
  - id: micro-behaviors/process/daemonize/detach::nohup-command
