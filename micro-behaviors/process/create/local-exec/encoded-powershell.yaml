defaults:
  platforms: [unix, windows]
traits:
  - id: encoded-iex-executable-path
    for: [javascript, typescript, vbs, powershell, batch, python, rust, go]
    desc: Decoded Invoke-Expression names executable path
    crit: notable
    conf: 0.94
    if:
      type: encoded
      regex: '(?i)\b(Invoke-Expression|iex)\s+["''][^"''\r\n]{1,160}\.exe["'']'
