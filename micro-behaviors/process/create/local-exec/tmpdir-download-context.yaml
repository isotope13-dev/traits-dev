defaults:
  for: [scripts, macho]
  platforms: [unix]
traits:
- id: tmpdir-exec-path
  desc: Shell exec targets a TMPDIR path
  crit: notable
  conf: 0.9
  for: [macho]
  if:
    type: text
    substr: 'exec "$TMPDIR/'
composite_rules:
- id: localbin-to-tmpdir-exec
  desc: TMPDIR copy, chmod, and execution commands
  crit: notable
  conf: 0.94
  for: [macho]
  all:
  - id: micro-behaviors/fs/file/copy::tmpdir-copy-binary-src
  - id: micro-behaviors/fs/chmod/executable/mode::tmpdir-chmod-path
  - id: micro-behaviors/process/create/local-exec::tmpdir-exec-path
