defaults:
  platforms: [unix, android]
  for: [scripts, binaries]

traits:
  # This command sequence is common in installers, container builders, and
  # development tooling. Download or exploit context belongs in the objective
  # composites that consume this neutral execution capability.
  - id: chmod-then-local-execute-command
    desc: Contains chmod followed by local execution
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)chmod\s+(\+x|777)[^\n]{0,80}(\./|[;&|][[:space:]]*(sh|bash|ash|busybox)[[:space:]])'
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog

  # Native ELF downloaders may chmod a numeric executable mode and then exec
  # the staged absolute path directly instead of invoking a shell script.
  - id: elf-numeric-chmod-absolute-exec
    desc: Native ELF chmod and absolute execution
    crit: notable
    conf: 0.95
    for: [elf]
    if:
      type: text
      regex: '(?i)chmod\s+(\+x|[0-7]*[1357])[^\n]{0,80}[;&|]\s*(exec\s+)?(\./|/)\S+'
  - id: native-download-then-shell-script
    desc: Native embeds wget/curl then sh script
    crit: notable
    conf: 0.98
    for: [elf]
    platforms: [linux, android]
    if:
      type: text
      regex: (?i)\b(wget|curl)\b[^\n]{0,180};\s*(busybox\s+)?sh\s+\S+
    unless:
      - id: well-known/tool/detection/ascan::ascan-defensive-scanner-context
