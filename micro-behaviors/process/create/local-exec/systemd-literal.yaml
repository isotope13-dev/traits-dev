defaults:
  for:
  - systemd
  - desktop
  platforms:
  - linux
traits:
- id: literal-hidden-download-background-exec
  desc: Fetches and backgrounds hidden temporary file
  crit: suspicious
  conf: 0.99
  if:
    type: yara
    source: |
      rule unit_bound_hidden_stage {
        strings:
          $chain = /(^|[\r\n])[ \t]*Exec(Start)?=[^\r\n]{0,80}sh[ \t]+-c[ \t]+['"]curl[ \t]+(-[skLfS]+[ \t]+|--(silent|insecure|location|fail|show-error)[ \t]+)*https?:\/\/[^'" \t]+[ \t]+-o[ \t]+\/(tmp|var\/tmp|dev\/shm)\/\.[a-zA-Z0-9_.-]+[ \t]*(2>\/dev\/null[ \t]*)?&&[ \t]*chmod[ \t]+\+x[ \t]+\/(tmp|var\/tmp|dev\/shm)\/\.[a-zA-Z0-9_.-]+[ \t]*&&[ \t]*\/(tmp|var\/tmp|dev\/shm)\/\.[a-zA-Z0-9_.-]+[ \t]*(>\/dev\/null[ \t]+2>&1[ \t]*)?&['"]/
          $path = /\/(tmp|var\/tmp|dev\/shm)\/\.[a-zA-Z0-9_.-]+/
        condition:
          for any c in (1..#chain) : (
            for any p in (1..#path) : (
              @path[p] > @chain[c] and @path[p+2] < @chain[c] + !chain[c] and
              !path[p] == !path[p+1] and !path[p] == !path[p+2] and
              for all b in (0..!path[p]-1) : (
                uint8(@path[p]+b) == uint8(@path[p+1]+b) and
                uint8(@path[p]+b) == uint8(@path[p+2]+b)
              )
            )
          )
      }
- id: literal-copy-exec-delete
  desc: Copies, runs and deletes one file
  crit: notable
  conf: 0.98
  if:
    type: value
    path: shell.literal_command_flows[*].kind
    exact: copy-exec-delete
