composite_rules:
- platforms:
  - unix
  for:
  - shell
  id: download-chmod-local-execution-cluster
  desc: Download and chmod near local script execution
  crit: notable
  conf: 0.96
  near_lines: 20
  all:
  - id: micro-behaviors/communications/http/download
  - id: micro-behaviors/fs/chmod/executable/mode
  - id: micro-behaviors/process/create/local-exec::local-execution
  any:
  - id: micro-behaviors/process/create/script/file::shell-script-execution-any
  - id: micro-behaviors/process/create/script/file::nohup-shell-script-execution
  - id: micro-behaviors/communications/http/download/fallback::multi-client-download-fallback
  - id: micro-behaviors/process/create/shell/busybox::busybox-command
  - id: micro-behaviors/communications/tftp/download::command
  - id: micro-behaviors/communications/ftp/download/busybox::ftpget
  unless:
  - id: well-known/tool/offensive/pentestkit/
  - id: well-known/lib/data/adios2::adios2-ci-setup-context
  - id: micro-behaviors/process/create/local-exec::openshift-vale-download-context
  - id: micro-behaviors/process/create/local-exec::openshift-istio-download-context
  - id: well-known/tool/development/toolchain/dotnet-sdk::dotnet-sdk-bootstrap-context
