# A quoted argument does not prove an executable target, browser execution or exploitation.
traits:
- platforms:
  - windows
  for:
  - html
  - makefile
  - vbs
  conf: 0.98
  id: shellexecute-quoted-argument-reference
  desc: ShellExecute method with quoted first argument
  crit: notable
  if:
    type: text
    regex: (?i)\.ShellExecute\s*\(?\s*["'][^"']{1,40}["']
