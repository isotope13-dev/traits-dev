# AutoIt is currently exposed as unparsed text; require call syntax.
defaults:
  platforms: [windows]
  for: [text, data, vbs]
  crit: notable
  conf: 0.95
traits:
  - id: autoit-shell-execute-call
    desc: AutoIt ShellExecute opens a file
    if:
      type: raw
      regex: '(?i)\bShellExecute(Wait)?\s*\('
