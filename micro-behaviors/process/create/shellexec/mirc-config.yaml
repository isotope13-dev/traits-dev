defaults:
  for: [text]
  platforms: [windows]
  crit: notable
  conf: 0.95

traits:
  - id: mirc-click-action-run-executable
    desc: mIRC click action launches an executable
    if:
      type: text
      regex: '(?im)^[a-z]+=[./]{0,2}run[ \t]+[^|\r\n]{1,160}\.exe\b'

  - id: mirc-click-action-run-system-name-variant
    desc: Click action runs utility name variant
    if:
      type: text
      regex: '(?im)^[a-z]+=[./]{0,2}run +(rundll32|svchost|lsass|regsvr32)[_-]\w{0,8}\.exe\b'
