defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
traits:
  - id: shell-execute-ex
    desc: Opens a target via ShellExecuteExW
    crit: notable
    conf: 0.75
    for: [pe, dll, csharp, c, cpp]
    if:
      type: symbol
      exact: ShellExecuteExW

  - id: shell-execute
    desc: Opens a target via ShellExecuteW
    crit: notable
    conf: 0.75
    if:
      type: symbol
      exact: ShellExecuteW

