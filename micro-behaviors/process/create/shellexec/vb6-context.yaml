# The UTF-16 exe token and ShellExecute name can coexist in ordinary GUI
# applications. The VB6 framework leg avoids the known .NET menu-editor hit,
# but no matcher connects that filename to a ShellExecute target.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: vb6-shellexec-exe-reference
    desc: VB6 ShellExecute and exe suffix clues
    crit: notable
    conf: 0.93
    all:
      - id: metadata/binary/framework::vb6-application-framework
      - id: shell-execute-call
      - id: micro-behaviors/fs/path/extension::utf16-exe-suffix-token
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
