# Codec-specific ciphertext of the escaped API token below, split only at
# carrier boundaries. Key: ASCII hex MD5 of the encoder default password.
# \x53\x48\x65\x6C\x6C\x45\x78\x45\x43\x75\x54\x65
# These signatures describe encoded tokens, not observed API execution.
defaults:
  for: [html, javascript]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: md5-xor-shellexecute-part-1
    desc: "Default MD5-XOR fragment of ShellExecute method"
    crit: component
    if:
      type: text
      substr: "%3DN%07%0Bk%1D%02%0An%1E%0E%0D9N%04pe%1ASz%3DA%07%07"
  - id: md5-xor-shellexecute-part-2
    desc: "Default MD5-XOR fragment of ShellExecute method"
    crit: component
    if:
      type: text
      substr: "9%1A%02%09l%19R%05%3DN%06%0Bk%1D%01%07n%1E%0D%0C9N%04%06"
composite_rules:
  - id: md5-xor-shellexecute
    desc: "Default MD5-XOR encoding of ShellExecute method"
    crit: notable
    all:
      - id: micro-behaviors/process/create/shellexec::md5-xor-shellexecute-part-1
      - id: micro-behaviors/process/create/shellexec::md5-xor-shellexecute-part-2
      - id: micro-behaviors/crypto/key/representation::md5-browser-default-passphrase
      - id: micro-behaviors/data/decode/custom::unescape-input-md5-argument-call
      - id: micro-behaviors/data/decode/xor::js-repeating-key-charcode-xor-decoder
