# Each alternative ties the opener, detached options and unref to one child.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1106
  mbc: C0017

composite_rules:
  - id: node-detached-os-default-handler-spawn
    desc: Detached default opener child
    crit: exception
    conf: 0.92
    any:
      - id: metadata/lang/source/syntax/call/relationship::node-detached-platform-opener-call
      - id: metadata/lang/source/syntax/call/relationship::node-detached-cross-platform-opener-call
      - id: metadata/lang/source/syntax/call/relationship::node-detached-opener-stored-child
      - id: metadata/lang/source/syntax/call/relationship::node-detached-literal-opener-call
      - id: metadata/lang/source/syntax/call/relationship::node-detached-rundll-url-handler
      - id: metadata/lang/source/syntax/call/relationship::node-detached-opener-via-helper
