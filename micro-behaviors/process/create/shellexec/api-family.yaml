# ShellExecute opens targets, including URLs and associated documents; it
# does not establish command-shell execution.
defaults:
  platforms: [unix, windows]
composite_rules:
- id: win-shellexecute
  desc: Opens a target via Windows ShellExecute API
  crit: notable
  conf: 0.9
  for: [scripts, binaries]
  any:
  - id: micro-behaviors/process/create/shellexec::shell-execute-a
  - id: micro-behaviors/process/create/shellexec::shell-execute
  - id: micro-behaviors/process/create/shellexec::shell-execute-ex
  - id: micro-behaviors/process/create/shellexec::shell-execute-ex-a
