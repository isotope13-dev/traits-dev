# mIRC `run` handing a document to the Windows shell opener.
#
# `run <file>` goes through ShellExecute, so a non-executable argument opens
# in whatever program is registered for its extension: Notepad for a report
# the script just wrote, the image viewer for a picture. Utility scripts do
# this to show their output; bots do it to pop a decoy image at startup.
# The argument is often concatenated (`run clean_ $+ %name $+ .txt`), so the
# path may contain spaces up to the end of the command.
defaults:
  crit: notable
  attack: T1106
  platforms: [windows]
  for: [mirc]
traits:
  - id: mirc-run-opens-text
    desc: mIRC run opens a text file
    conf: 0.85
    if:
      type: text
      regex: '(?i)(^|[\s{|])[./]{0,2}run\s+[^|}\r\n]{1,80}\.(txt|log)\b'
  - id: mirc-run-opens-image
    desc: mIRC run opens an image file
    conf: 0.85
    if:
      type: text
      regex: '(?i)(^|[\s{|])[./]{0,2}run\s+[^|}\r\n]{1,80}\.(jpe?g|gif|png|bmp)\b'
