defaults:
  crit: notable
  conf: 0.85
  platforms: [macos]
  for: [macho, dylib]

traits:
  - id: objc-open-url-selector
    desc: Objective-C URL opening selector reference
    # The selector supports URL dispatch, not a particular browser, scheme,
    # destination, or proof that an action handler has been invoked.
    if:
      type: text
      exact: 'openURL:'
