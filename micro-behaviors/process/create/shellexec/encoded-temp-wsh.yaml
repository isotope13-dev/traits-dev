# PowerShell hands .vbs/.vbe files to the registered Windows script handler.
# A .ps1 path would instead be in-process interpreter execution.
defaults:
  platforms: [windows]
  for: [html, vbs, powershell, batch]
  crit: notable
  conf: 0.97
traits:
  - id: decoded-appdata-wsh-item-launch
    desc: Decoded PowerShell opens an AppData WSH script
    if:
      type: encoded
      regex: '(?i)\bInvoke-Item\s+"\$env:APPDATA\\[^"\r\n]+\.(vbe|vbs)"'
