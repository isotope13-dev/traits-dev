# PowerShell hands .vbs/.vbe files to the registered Windows script handler.
# A .ps1 path would instead be in-process interpreter execution.
defaults:
  platforms: [windows]
  for: [html, vbs, powershell, batch]
  crit: notable
  conf: 0.97
traits:
  - id: decoded-temp-wsh-script-launch
    desc: Decoded PowerShell invokes a TEMP WSH script
    if:
      type: encoded
      regex: '(?i)Invoke-Expression\s+"\$env:TEMP\\[^"\r\n]+\.(vbe|vbs)"'
