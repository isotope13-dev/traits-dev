# These independent matches establish co-occurrence, not payload data flow,
# encryption, execution of resource bytes, or malware identity.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: resource-shellexecute-debugger-api-set
  desc: ShellExecute and debugger APIs with resource access
  crit: notable
  conf: 0.96
  all:
    - id: metadata/binary/resource/entropy::dominant-high-entropy-resources
    - id: micro-behaviors/data/embedded/payload/resource::load-resource
    - id: micro-behaviors/data/embedded/payload/resource::find-resource-any
    - id: micro-behaviors/process/create/shellexec::shell-execute-ex
    - id: micro-behaviors/process/debug/detect::is-debugger-present-import

