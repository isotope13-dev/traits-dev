# Matches API syntax in hex-recovered bytes before the runtime XOR-23 pass.
# No campaign domain, variable name or dropped filename is required.
defaults:
  for: [html, vbs]
  platforms: [windows]
  crit: notable
  conf: 0.96
traits:
- id: xor23-shellexecute-method
  desc: Hex/XOR-23 ShellExecute invocation
  if:
    type: encoded
    encoding: hex
    regex: "9[dD][\u007f_][rR][\\{\\[][\\{\\[][rR][oO][rR][tT][bB][cC][rR]7"
