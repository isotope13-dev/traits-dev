traits:
- for:
  - javascript
  - vbs
  - html
  id: shellexecute-hidden-showcmd
  desc: ShellExecute with hidden show-command
  conf: 0.93
  if:
    type: text
    regex: (?i)\.ShellExecute\b[^;\r\n]{0,240},\s*0\s*\)?
- for:
  - c
  id: shell-execute-call-source
  desc: Calls the Windows ShellExecute API from source
  conf: 0.95
  if:
    type: text
    regex: (?i)\bShellExecute\s*\(
- for:
  - c
  - cpp
  - csharp
  - go
  - rust
  - powershell
  - javascript
  - vbs
  id: shellexecute-runas-call
  desc: Calls ShellExecute with runas verb
  conf: 0.96
  if:
    type: text
    regex: '(?i)\bShellExecute(Ex)?[AW]?\s*\([^;\r\n]{0,160}["'']runas["'']'
defaults:
  platforms:
  - windows
  crit: notable
