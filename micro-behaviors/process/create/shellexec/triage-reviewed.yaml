composite_rules:
- conf: 0.9
  for:
  - javascript
  - vbs
  - html
  id: shell-application-execute-context
  desc: Shell.Application reference beside ShellExecute method
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/file/naming::test-directory-component
  - id: metadata/package/testing/presence/harness::tests-path-filename
  all:
  - id: micro-behaviors/os/com/automation::shell-application-progid
  - id: micro-behaviors/process/create/shellexec::shellexecute-method-call
traits:
- for:
  - javascript
  - vbs
  - html
  - ruby
  id: shellexecute-method-call
  desc: Calls the WSH ShellExecute method
  conf: 0.9
  if:
    type: text
    regex: (?i)\.ShellExecute\b
  unless:
  - id: metadata/package/testing/harness/runtime/
- for:
  - javascript
  - vbs
  - html
  id: shellexecute-hidden-showcmd
  desc: ShellExecute with hidden show-command
  conf: 0.93
  if:
    type: text
    regex: (?i)\.ShellExecute\b[^;\r\n]{0,240},\s*0\s*\)?\s*;?\s*$
- for:
  - c
  - cpp
  id: shell-execute-source
  desc: ShellExecute usage in source
  conf: 0.9
  if:
    type: text
    word: ShellExecute
- for:
  - c
  id: shell-execute-call-source
  desc: Calls the Windows ShellExecute API from source
  conf: 0.95
  if:
    type: text
    regex: (?i)\bShellExecute\s*\(
- for: &id001
  - pe
  - dll
  id: shell-execute-a
  desc: ShellExecuteA API reference
  conf: 0.75
  if:
    type: symbol
    exact: ShellExecuteA
- for: *id001
  id: shell-execute-a-obfuscated
  desc: Scrambled ShellExecuteA API token
  conf: 0.92
  if:
    type: text
    exact: leeexthEuSlcA
defaults:
  platforms:
  - windows
  crit: notable
