defaults:
  for: [ruby]
  platforms: [unix, windows]


composite_rules:
  - id: ruby-http-preview-open
    desc: Ruby renders temporary HTML preview via macOS open
    crit: exception
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/shellexec::ruby-exec-open-command
      - id: micro-behaviors/fs/path/temp::ruby-temporary-html-preview-path
