# Electron desktop opener API dispatching a local file path to the OS handler.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: electron-shell-openpath-call
    desc: Opens path via Electron shell.openPath
    if:
      type: symbol
      kind: call
      regex: '^(electron\.)?shell\.openPath$'
  # Lower-first Base64 spelling of the same API name, as emitted by
  # javascript-obfuscator string tables. This proves the name is
  # referenced, not that the call executes.
  - id: electron-shell-openpath-lower-first-b64-literal
    desc: openPath name in lower-first Base64 strings
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '^B3bLBLbHDgG={0,2}$'
# One observation in two spellings: a direct call or the string-table
# form. Reference the group to keep its cardinality in enclosing needs:.
composite_rules:
- id: electron-shell-openpath-any-form
  desc: shell.openPath call or encoded string
  conf: 0.9
  any:
  - id: micro-behaviors/process/create/shellexec::electron-shell-openpath-call
  - id: micro-behaviors/process/create/shellexec::electron-shell-openpath-lower-first-b64-literal
