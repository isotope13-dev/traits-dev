# Electron desktop opener API dispatching a local file path to the OS handler.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: electron-shell-openpath-call
    desc: Opens path via Electron shell.openPath
    if:
      type: symbol
      kind: call
      regex: '^(electron\.)?shell\.openPath$'
