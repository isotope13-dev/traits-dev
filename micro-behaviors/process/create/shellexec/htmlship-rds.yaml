# HTMLSHIP rotated substitution spelling; no URL or variable names.
defaults:
  for: [html, javascript]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: htmlship-shellexecute-member
    desc: HTMLSHIP substitution of ShellExecute member
    if:
      type: text
      substr: "T4\\:\\n\\ \\ \\nP\\n\\>\\,N\\n"
  - id: htmlship-hidden-open-arguments
    desc: HTMLSHIP hidden ShellExecute open arguments
    if:
      type: text
      substr: "\\}\\/\\/\\}\\/\\/\\}\\/M\\/2\\/h\\/2\\/q\\/2\\/\\\"\\/\\}\\("
