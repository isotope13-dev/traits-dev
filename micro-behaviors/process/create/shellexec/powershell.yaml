# Default-action item opening through PowerShell.
defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.9
traits:
  - id: powershell-invoke-item
    desc: Invoke-Item requests the item's default action
    for: [powershell, batch, pe]
    if:
      type: text
      word: Invoke-Item
      case_insensitive: true
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
