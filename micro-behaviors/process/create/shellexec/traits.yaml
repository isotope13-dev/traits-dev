# The desktop opener: the OS chooses the handler for a path or bundle.
# Windows text-form ShellExecute names live in traits.yaml. The macOS
# `open` command and NSWorkspace spellings live in macos.yaml. Symbol-form
# CreateProcess matchers stay under process/create/exec.
defaults:
  for: [pe, dll, rust, csharp]
  platforms: [windows]
  crit: notable
  conf: 0.85

traits:
  - id: shell-execute-call
    desc: ShellExecute API name reference
    if:
      type: text
      # Require an API token terminator; AutoRun uses ShellExecute= instead.
      regex: '\bShellExecute([AW])?([^\w\s=]|[ \t]*(\(|$))'
  # Resource sections of an SFX often carry the payload's import names.
  # A stub that calls ShellExecute keeps that name in its own read-only data.
  - id: shell-execute-rdata
    desc: ShellExecute name in read-only data
    if:
      type: text
      exact: ShellExecuteW
      section: rdata

  - id: shell-executeex-call
    desc: ShellExecuteEx API name reference
    if:
      type: text
      regex: '\bShellExecuteEx([AW])?\b'

  - id: lpverb-field
    desc: lpVerb field for ShellExecute
    crit: notable
    conf: 0.85
    if:
      type: text
      word: lpVerb
