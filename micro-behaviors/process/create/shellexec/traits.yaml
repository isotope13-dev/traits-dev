# Text-form ShellExecute API names from import/string tables. Symbol-form
# matchers live under process/create/exec and process/create/system; keep the
# text atoms here so process/create/exec stays under the directory size cap.
defaults:
  for: [pe, dll, rust, csharp]
  platforms: [windows]
  crit: notable
  conf: 0.85
  attack: T1059.001

traits:
  - id: shell-execute-call
    desc: ShellExecute API call
    if:
      type: text
      regex: '\bShellExecute([AW])?\b'

  - id: shell-executeex-call
    desc: ShellExecuteEx API call
    if:
      type: text
      regex: '\bShellExecuteEx([AW])?\b'

  - id: lpverb-field
    desc: lpVerb field for ShellExecute
    crit: component
    conf: 0.85
    if:
      type: text
      word: lpVerb
