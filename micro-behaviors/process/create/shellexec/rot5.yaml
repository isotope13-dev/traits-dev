# Character codes shifted by +5, with nested percent-escaped punctuation.
defaults:
  platforms: [windows]
  for: [html, javascript, data]
  conf: 0.95

traits:
  - id: rot5-shell-execute
    desc: ROT5 and percent-encoded ShellExecute invocation
    crit: notable
    if:
      type: text
      regex: '3XmjqqJ%(25){0,4}7Djhzyj(%(25){0,4}2A7%(25){0,4}3D|-|%(25){0,4}2D)'

