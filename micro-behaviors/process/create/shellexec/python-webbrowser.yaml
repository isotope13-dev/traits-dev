defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
traits:
  - id: webbrowser-open
    desc: Opens URL in system web browser
    conf: 0.7
    if:
      type: symbol
      kind: call
      regex: '^webbrowser\.open(_new(_tab)?)?$'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
