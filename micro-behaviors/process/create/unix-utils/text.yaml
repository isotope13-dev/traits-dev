# Generic Unix text-processing utility invocations. These are capabilities,
# not identities of a development tool, so they belong under micro-behaviors.
defaults:
  platforms: [unix]
  # Keep the symbol search bounded to the source carriers where these
  # commands are parsed as invocations; this also avoids archive/document
  # false positives from the broad scripts group.
  for: [shell, python, ruby, javascript]
  crit: baseline
  size_max: 5000000

traits:
  - id: jq-processing
    desc: Uses jq for JSON processing
    if:
      type: symbol
      kind: call
      exact: jq

  - id: sed-processing
    desc: Uses sed for text processing
    if:
      type: symbol
      kind: call
      exact: sed

  - id: awk-processing
    desc: Uses awk for text processing
    if:
      type: symbol
      kind: call
      exact: awk
