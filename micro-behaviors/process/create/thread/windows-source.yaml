defaults:
  crit: notable
  for: [c, cpp]
  platforms: [windows]
traits:
  - id: create-thread-source
    desc: CreateThread usage in source
    conf: 0.9
    for: [c, cpp, csharp, go, rust, zig, python]
    if:
      type: symbol
      kind: call
      exact: CreateThread
  - id: repeated-create-thread-source
    desc: Multiple CreateThread calls in source
    conf: 0.92
    if:
      type: text
      regex: '(?s)\bCreateThread\s*\([^;]{0,220}\);.{0,500}\bCreateThread\s*\('
# `addthread-helper` and the `threaded-task-orchestration` composite built on it
# were removed here. The matcher was `text word: addthread` -- one lowercase
# identifier -- described as an "orchestration helper" at notable/0.88, which is
# an intent the word does not carry; any threaded C program that names a helper
# `addthread` earned a notable finding. The name is RxBot's, and that family
# already matches it exactly as a symbol in
# well-known/malware/botnet/rxbot::rxbot-addthread-function. One matcher, one
# home: the family signature keeps it (TAXONOMY, Single-Trait Rule and
# "Matcher Defines Identity").
