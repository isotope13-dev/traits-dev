defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.8

traits:
  # Relocated from objectives/command-and-control/backdoor/rat/multi/ — Thread.new
  # is a neutral concurrency API, not a RAT signal by itself. Hostile composites
  # that need background persistence reference this atom.
  - id: ruby-thread-new
    desc: Creates a Ruby background thread
    if:
      type: text
      regex: '\bThread\.(new|start)\b'
