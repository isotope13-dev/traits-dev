defaults:
  platforms:
    - windows
  for: [scripts, binaries]
traits:
  - id: thread-manipulation-enc
    for: [powershell, python, javascript, pe, dll]
    desc: Encoded NtCreateThreadEx reference
    crit: notable
    if:
      type: encoded
      encoding:
        - base64
        - base64-obf
        - hex
        - xor
        - url
        - unicode-escape
      exact: NtCreateThreadEx
