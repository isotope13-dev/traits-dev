defaults:
  platforms: [windows]
  for: [javascript, typescript]

traits:
  # FFI thread-start declarations (koffi `lib.func('... CreateThread ...')`,
  # edge-js `funcName: 'CreateThread'`) live in string constants, not call
  # expressions, so this reads the parser-extracted literal rather than the
  # call graph.
  - id: javascript-createthread-reference
    desc: JavaScript references CreateThread
    crit: notable
    conf: 0.93
    if:
      type: literal
      substr: CreateThread
