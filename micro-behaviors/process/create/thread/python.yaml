defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
traits:
  - id: python-thread-create
    desc: Creates a thread in Python
    conf: 0.65
    if:
      type: text
      substr: '.Thread('
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: python-daemon-thread
    desc: Creates a daemon thread in Python
    crit: notable
    conf: 0.8
    # Matches both threading.Thread(...) and bare Thread(...) (from threading
    # import Thread); [^\n] tolerates inner parens such as args=(a, b).
    if:
      type: text
      regex: '\bThread\s*\([^\n]{0,220}?daemon\s*=\s*True'
  - id: python-thread-daemon-assignment
    desc: Sets Python thread daemon flag after creation
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: '.daemon = True'
  - id: python-nondaemon-thread-explicit
    desc: Creates an explicitly non-daemon Python thread
    crit: notable
    conf: 0.8
    # `daemon=False` is Python's default, so spelling it out is a deliberate
    # statement that the worker must keep the process alive until it finishes
    # -- the opposite of the fire-and-forget `daemon=True` above.
    if:
      type: text
      regex: '\bThread\s*\([^\n]{0,220}?daemon\s*=\s*False'

  - id: python-thread-target-os-system
    desc: Thread target is os.system
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: 'threading\.Thread\([^)\n]{0,180}target\s*=\s*os\.system'
  - id: python-thread-target-subprocess
    desc: Thread target is subprocess
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: 'threading\.Thread\([^)\n]{0,180}target\s*=\s*subprocess\.(Popen|run|call)'
  - id: python-process-target-os-system
    desc: Process target is os.system
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: 'multiprocessing\.Process\([^)\n]{0,180}target\s*=\s*os\.system'
  - id: python-process-target-subprocess
    desc: Process target is subprocess
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: 'multiprocessing\.Process\([^)\n]{0,180}target\s*=\s*subprocess\.(Popen|run|call)'

  - id: python-column0-thread-start
    desc: Module starts a thread at import
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?m)^[A-Za-z_]\w*\.start\(\)\s*$'

  - id: python-thread-target-exec
    desc: Thread target is the exec builtin
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'target\s*=\s*exec\b'

composite_rules:
  - id: python-thread-exec-target
    desc: Thread runs execution API target
    crit: notable
    conf: 0.86
    any:
      - id: python-thread-target-os-system
      - id: python-thread-target-subprocess
  - id: python-process-exec-target
    desc: Process runs execution API target
    crit: notable
    conf: 0.86
    any:
      - id: python-process-target-os-system
      - id: python-process-target-subprocess
