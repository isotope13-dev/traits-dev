defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98
traits:
  - id: python-module-try-starts-daemon-thread
    desc: Module try block starts a daemon thread
    if:
      type: tree-sitter
      language: python
      query: |
        (module
          (try_statement
            body: (block
              (expression_statement (assignment
                left: (identifier) @worker
                right: (call
                  function: (attribute
                    object: (identifier) @threading
                    attribute: (identifier) @ctor)
                  arguments: (argument_list
                    (keyword_argument
                      name: (identifier) @daemon
                      value: (true))))) @create)
              (expression_statement (call
                function: (attribute
                  object: (identifier) @started
                  attribute: (identifier) @start))) @launch))
          (#eq? @threading "threading")
          (#eq? @ctor "Thread")
          (#eq? @daemon "daemon")
          (#eq? @worker @started)
          (#eq? @start "start"))
