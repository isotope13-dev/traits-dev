defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
  attack: T1056.001
  mbc: E1056.001

traits:
  - id: cpp-dll-thread-entry
    desc: C/C++ DLL starts worker thread
    crit: notable
    conf: 0.82
    for: [c, cpp]
    if:
      type: text
      regex: 'DLL_PROCESS_ATTACH[\s\S]{0,160}CreateThread'
