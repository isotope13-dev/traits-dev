# Foundation.Process is available to Swift packages on Windows, Linux, and
# macOS. Keep this neutral process-start capability out of the macOS-specific
# AppKit/NSTask rules so platform filtering does not discard Windows source.
defaults:
  crit: notable
  conf: 0.9
  attack: T1106
  for: [swift]
  platforms: [windows, unix]

traits:
  - id: swift-source-process-run
    desc: Swift source starts a Process
    if:
      type: text
      # Construction, argument assignment, and run commonly span lines.
      regex: '(?s)\bProcess\s*\(\s*\).{0,600}[.]run\s*\('
