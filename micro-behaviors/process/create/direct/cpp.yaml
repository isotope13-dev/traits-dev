defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [elf, macho, pe]
traits:
  - id: fgets-api-import
    desc: Imports C fgets line-input API
    crit: baseline
    if:
      type: import
      exact: fgets
  - id: string-append
    desc: Capturing data into C++ std::string
    crit: baseline
    if:
      type: symbol
      regex: std::__1::basic_string.{0,50}(append|push_back|operator\+=)
