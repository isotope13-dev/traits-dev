defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.97
traits:
  - id: rust-interpreter-command-outside-fixture-tree
    desc: Rust interpreter command outside test fixtures
    if:
      id: rust-interpreter-command-construction
    unless:
      - type: path
        regex: '(^|[\\/])tests[\\/]fixtures[\\/]'

  - id: rust-interpreter-command-construction
    desc: Constructs Rust interpreter child command
    if:
      type: tree-sitter
      language: rust
      query: |
        ((call_expression
          function: (scoped_identifier) @constructor
          arguments: (arguments (string_literal) @interpreter))
          (#match? @constructor "(^|::)Command::new$")
          (#match? @interpreter "^\"((/usr/bin/|/bin/)?(python[0-9.]*|bash|sh|zsh|ruby|perl|node)|powershell(\\.exe)?|pwsh(\\.exe)?|cmd(\\.exe)?)\"$"))
