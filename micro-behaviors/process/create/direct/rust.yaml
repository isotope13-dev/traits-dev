# Process Execution - Rust
# MBC: E1059 (Command and Scripting Interpreter)
# ATT&CK: T1059
defaults:
  crit: notable
  platforms: [windows, unix]
  attack: T1059
  mbc: E1059
  for: [rust]
traits:
  # A bare `.spawn()` is not process creation in Rust: thread/task scopes,
  # executors, and process commands all use that method name.  Keep this atom
  # tied to a Command constructor so worker dispatch stays in process/create/workers.
  - id: rust-command-spawn-call
    desc: Rust Command spawns a child process
    conf: 0.9
    if:
      type: text
      regex: 'Command::new[\s\S]{0,240}\.spawn\s*\('
  # Platform cfg blocks (hidden-window flags, setsid pre_exec) sit between
  # `let cmd = Command::new(...)` and `cmd.spawn()`, past the chained window
  # above. Still anchored on Command::new so a bare task `.spawn()` does not match.
  - id: rust-command-deferred-spawn
    desc: Rust spawns a Command after setup
    conf: 0.88
    if:
      type: text
      regex: 'Command::new[\s\S]{0,900}\.spawn\s*\('
  - id: rust-command-status-call
    desc: Rust Command runs child synchronously
    conf: 0.92
    if:
      type: text
      regex: 'Command::new[\s\S]{0,240}\.status\s*\('
  - id: rust-process-command-import
    desc: Imports Rust process::Command
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*use\s+((std|tokio)::process|async_process)::(Command\b|\{.{0,120}\bCommand\b)'
  - id: rust-command-curl-wget
    desc: Constructs curl or wget process command
    conf: 0.92
    if:
      type: text
      regex: 'Command::new\s*\(\s*"(curl|wget)"'
  - id: rust-command-powershell
    desc: Rust launches PowerShell
    conf: 0.96
    platforms: [windows]
    if:
      type: text
      regex: 'Command::new\s*\(\s*"powershell(\.exe)?"\s*\)'
  # Graphviz's `dot`, the diagram renderer. A proc macro that pipes a generated
  # DOT graph into it is producing documentation, the same class as the rustfmt
  # and `cargo metadata` invocations beside it: build tooling, not an
  # install-time payload. smlang-macros renders its state machine this way,
  # behind an opt-in `#[cfg(feature = "graphviz")]`, across seven published
  # versions.
  - id: graphviz-dot-process-command
    desc: Rust invokes the graphviz dot renderer
    conf: 0.95
    if:
      type: text
      regex: 'Command::new\s*\(\s*"dot"\s*\)'
  - id: rustfmt-process-command
    desc: Rust invokes the rustfmt source formatter
    conf: 0.95
    if:
      type: text
      regex: 'Command::new\s*\(\s*"rustfmt"\s*\)'
  - id: rust-cargo-test-command
    desc: Rust invokes Cargo test subprocess
    conf: 0.95
    if:
      type: text
      regex: 'Command::new\s*\(\s*"cargo"\s*\)[\s\S]{0,240}\.arg\s*\(\s*"test"\s*\)'
  - id: rust-cargo-metadata-command
    desc: Rust invokes Cargo metadata subprocess
    conf: 0.95
    if:
      type: text
      regex: '(?s)option_env!\("CARGO"\).{0,80}\.args\(\["metadata"'
  # Reading repository state at build time is what git-testament, rbtag,
  # vergen and friends exist for: they embed the commit, tag or timestamp into
  # the binary. Both spellings appear -- the direct invocation and a shell
  # wrapper around a read-only query, which is how a crate gets the same
  # command to run under cmd.exe and sh.
  - id: rust-git-metadata-command
    desc: Rust invokes git to read repository state
    conf: 0.93
    if:
      type: text
      regex: 'Command::new\s*\(\s*"git"\s*\)'
  - id: rust-shell-git-query-command
    desc: Rust shell-invokes a git query
    conf: 0.9
    if:
      type: text
      regex: '"git\s+(show|describe|rev-parse|log|tag|status)\s[^"]{0,120}"'
  - id: rust-qualified-process-command
    desc: Creates Rust command via qualified path
    conf: 0.95
    if:
      type: text
      regex: '\b(std|tokio)::process::Command::new\s*\('
  - id: rust-hook-command-new
    desc: Rust launches a hook-selected command
    conf: 0.9
    if:
      type: text
      regex: 'Command::new\s*\(\s*&[A-Za-z_][A-Za-z0-9_]*_hook\s*\)'
  - id: rust-indirect-command-new
    desc: Rust launches a variable-selected command
    conf: 0.9
    if:
      type: text
      regex: 'Command::new\s*\(\s*&[A-Za-z_][A-Za-z0-9_]*\s*\)'
  - id: rust-hook-command-spawn
    desc: Rust spawns a hook-selected command
    conf: 0.96
    if:
      type: text
      regex: 'Command::new\s*\(\s*&[A-Za-z_][A-Za-z0-9_]*_hook\s*\)[\s\S]{0,180}\.spawn\s*\('
  - id: rust-bin-sh-c-call
    desc: Rust runs /bin/sh -c
    conf: 0.92
    platforms: [unix, openwrt]
    if:
      type: text
      regex: 'Command::new\s*\(\s*"/bin/(ba)?sh"\s*\)\s*\n?\s*\.arg\s*\(\s*"-c"'
  - id: rust-bin-sh-i-call
    desc: Rust runs /bin/sh -i
    conf: 0.92
    platforms: [unix, openwrt]
    if:
      type: text
      regex: 'Command::new\s*\(\s*"/bin/(ba)?sh"\s*\)\s*\n?\s*\.arg\s*\(\s*"-i"'
  - id: rust-command-output
    desc: Rust Command captures child output
    conf: 0.92
    if:
      type: text
      regex: 'Command::new[\s\S]{0,240}\.output\s*\(\s*\)'
  - id: rust-stdout-stderr-return
    desc: Returns stdout or stderr text
    conf: 0.95
    if:
      type: text
      regex: from_utf8_lossy\(&output\.(stdout|stderr)\)\.to_string\(\)
composite_rules:
  - id: rust-command-from-import
    desc: Constructs a Rust command using imported Command
    conf: 0.95
    all:
      - id: rust-process-command-import
      - id: micro-behaviors/process/create/exec::rust-command-new-call
  - id: rust-process-command
    desc: Constructs a Rust child-process command
    conf: 0.95
    any:
      - id: rust-command-from-import
      - id: rust-qualified-process-command
  - id: rust-bin-sh-c
    desc: Rust process command runs /bin/sh -c
    conf: 0.92
    all:
      - id: rust-process-command
      - id: rust-bin-sh-c-call
  - id: rust-spawn
    desc: Spawns a child process via Rust Command
    conf: 0.9
    all:
      - id: rust-process-command
      - id: rust-command-spawn-call
    # No proximity constraint. One leg is the `use std::process::Command`
    # import (or a qualified path) and the other is the call site; in any file
    # with more than one function those are tens of lines apart, so the old
    # 8-line window meant this never fired on real code -- a Cargo build
    # script that downloads and spawns a payload was missing its launch leg
    # for exactly that reason. `rust-command-spawn-call` already anchors on
    # `Command::new`, so the pair cannot drift onto unrelated code.
