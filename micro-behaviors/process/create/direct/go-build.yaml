traits:
  - id: go-build-command
    for: [go]
    platforms: [unix, windows]
    desc: Go launches the Go compiler build command
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: exec.Command
      args:
        - index: 0
          kind: string
          exact: go
        - index: 1
          kind: string
          exact: build
