defaults:
  for:
  - binaries
  - python
  - javascript
  - typescript
  - c
  - cpp
  - csharp
  platforms:
  - unix
  - windows
traits:
- id: native-process-launch-call-text
  desc: References a native child-process launch call
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \b(execFile|CreateProcess[AW]?|ShellExecute[AW]?)\s*\(
composite_rules:
- id: process-launch-call-text
  desc: Child-process launch capability
  crit: notable
  conf: 0.92
  any:
  - id: native-process-launch-call-text
  - id: micro-behaviors/process/create/subprocess::process-execution
