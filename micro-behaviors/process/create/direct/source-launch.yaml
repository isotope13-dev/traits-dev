defaults:
  crit: notable
  conf: 0.92
  for:
  - binaries
  - python
  - javascript
  - typescript
  - c
  - cpp
  - csharp
  - powershell
  platforms:
  - unix
  - windows
traits:
- id: suspended-launch-call-arg
  desc: Suspended flag passed to process creation
  crit: notable
  conf: 0.95
  for:
  - python
  - c
  - cpp
  - csharp
  - rust
  - powershell
  if:
    type: symbol
    kind: call
    substr: CreateProcess
    arg:
      kind: identifier
      name: CREATE_SUSPENDED
composite_rules:
- id: process-launch-call-text
  desc: Child-process launch capability
  crit: notable
  conf: 0.92
  any:
  - id: micro-behaviors/process/create/exec::native-process-launch-call-text
  - id: micro-behaviors/process/create/subprocess::process-execution
