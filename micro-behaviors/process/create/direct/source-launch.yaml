defaults:
  crit: notable
  conf: 0.92
  for:
  - binaries
  - python
  - javascript
  - typescript
  - c
  - cpp
  - csharp
  platforms:
  - unix
  - windows
traits:
- id: native-process-launch-call-text
  desc: References a native child-process launch call
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: \b(execFile|CreateProcess[AW]?|ShellExecute[AW]?)\s*\(
- id: suspended-launch-call-arg
  desc: Suspended flag passed to process creation
  crit: notable
  conf: 0.95
  for: [python, c, cpp, csharp, rust, powershell]
  # The injector spelling: a bare CREATE_SUSPENDED constant defined inline
  # (`CREATE_SUSPENDED = 0x4`) never appears as an import or call target,
  # so a symbol-exact matcher cannot see it — but it does arrive as an
  # identifier argument at the CreateProcess call site, which is also the
  # stronger observation (the flag actually launches the child suspended).
  if:
    type: symbol
    kind: call
    substr: CreateProcess
    arg:
      kind: identifier
      name: CREATE_SUSPENDED
composite_rules:
- id: process-launch-call-text
  desc: Child-process launch capability
  crit: notable
  conf: 0.92
  any:
  - id: native-process-launch-call-text
  - id: micro-behaviors/process/create/subprocess::process-execution
