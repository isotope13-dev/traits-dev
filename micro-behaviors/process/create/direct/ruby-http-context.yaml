# A Ruby HTTP request, binary write, decode and spawn coexist, but the
# matcher does not bind downloaded bytes to the process argument.
defaults:
  platforms: [windows]
  for: [ruby]

composite_rules:
  - id: ruby-http-binwrite-spawn-profile
    desc: Ruby HTTP, binary-write and spawn clues
    crit: suspicious
    conf: 0.96
    scope: file
    all:
      - id: micro-behaviors/os/sysinfo/platform/runtime::windows-os-check-a
      - id: micro-behaviors/data/decode/base64::base64-decode
      - id: micro-behaviors/communications/http/request/netlib::ruby-http-request-call
      - id: micro-behaviors/fs/write/file/binary::ruby-file-binwrite-content
      - id: micro-behaviors/process/create/direct::ruby-spawn
