defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.003

traits:
  - id: batch-direct-windows-executable-path
    desc: Batch directly invokes a Windows executable path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?im)^\s*(call\s+)?"?[A-Za-z]:\\.{1,180}\.(exe|com)"?(\s+.{1,160})?\s*$'
