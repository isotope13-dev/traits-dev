defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.003

traits:
  - id: batch-direct-windows-executable-path
    desc: Batch directly invokes a Windows executable path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?im)^\s*(call\s+)?"?[A-Za-z]:\\.{1,180}\.(exe|com)"?(\s+.{1,160})?\s*$'

  - id: start-exe
    desc: Start an executable
    crit: component
    conf: 0.6
    if:
      type: text
      regex: (?i)start\s+[^\n]{0,120}\.exe
    unless:
    - type: basename
      regex: ^clink\.bat$
