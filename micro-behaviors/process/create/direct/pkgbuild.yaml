defaults:
  platforms: [linux]
  for: [shell]
  attack: T1195.002

traits:
  - id: pkgbuild-src-pipe-shell
    desc: PKGBUILD pipes a source path to shell
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(\$\{?srcdir\}?/|\./)[^| \n]{1,80}\|\s*(/bin/)?(ba)?sh\b'

  - id: pkgbuild-sudo-srcdir-entry
    desc: PKGBUILD sudo-executes a source entry
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?m)^\s*sudo\s+["'']?\$(srcdir|\{srcdir\})/[A-Za-z0-9_.${}-]+["'']?\s*$'
