# Structural context for system(); neither condition proves concealment.
defaults:
  platforms:
  - macos
  for:
  - macho
  crit: notable
composite_rules:
- id: sparse-cstrings-system-reference
  desc: System function with sparse C strings
  conf: 0.97
  all:
  - id: metadata/binary/section/prose::tiny-cstring-section
  - id: micro-behaviors/process/create/shell/spawn::system-fn
- id: few-imports-system-reference
  desc: System function with few imported symbols
  conf: 0.8
  all:
  - id: micro-behaviors/process/create/shell/spawn::system-fn
  - id: metadata/binary/symbols/count::imports-at-most-50-macho
  unless:
  - id: metadata/binary/symbols/count::many-imports-50
  - id: well-known/tool/development/toolchain/darling/
  - id: well-known/tool/sysadmin/unetbootin/
