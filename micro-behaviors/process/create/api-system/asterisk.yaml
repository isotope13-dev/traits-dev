# The Asterisk System dialplan application executes its data argument through
# a system shell. Match protocol/object structure so prose mentioning the
# application does not become process-execution evidence.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: suspicious
  conf: 0.98

traits:
  - id: asterisk-system-application-parameter
    desc: Asterisk API selects System command execution
    if:
      type: text
      regex: '(?i)(["'']?application["'']?\s*[:=]\s*["'']System["'']|[?&]application=System([&#]|$))'
