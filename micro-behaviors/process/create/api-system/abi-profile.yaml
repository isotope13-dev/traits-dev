composite_rules:
- platforms:
  - macos
  - linux
  for:
  - macho
  - elf
  id: small-abi-system-reference
  desc: Small binary pairs C++ ABI and system API
  crit: notable
  conf: 0.85
  size_max: 200000
  all:
  - id: metadata/binary/symbols/compiler::cxx-abi-symbol-profile
  - id: micro-behaviors/process/create/shell/spawn::system-fn
  - id: "metadata/file/profile/string-population::binary-strings-at-most-50"
  unless:
  - id: metadata/signed/platform::apple
  - id: well-known/tool/sysadmin/unix-benign::sudo-noexec-library
