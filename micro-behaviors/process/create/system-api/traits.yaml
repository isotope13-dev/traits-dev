defaults:
  platforms: [unix, windows, openwrt]
traits:
  # Keep the evidence kinds separate so an exported data object named
  # `_system` is not mistaken for the C command-execution function. ELF
  # dynamic-symbol facts retain the function/object distinction; imports and
  # parsed source calls are already unambiguous.
  - id: elf-function
    desc: ELF dynamic function symbol named system
    crit: notable
    conf: 0.95
    for: [elf]
    if:
      type: value
      path: elf.dynsym_funcs[*].name
      exact: system
  - id: native-import
    desc: Native binary imports the C system function
    crit: notable
    conf: 0.95
    for: [macho, pe, dll]
    if:
      type: symbol
      kind: import
      exact: system
  - id: native-function
    desc: Native binary defines a function named system
    crit: notable
    conf: 0.9
    for: [elf, macho, pe, dll]
    if:
      type: symbol
      kind: function
      exact: system
  - id: source-call
    desc: C-family source calls the system function
    crit: notable
    conf: 0.95
    for: [c, cpp, objc]
    if:
      type: symbol
      kind: call
      exact: system
