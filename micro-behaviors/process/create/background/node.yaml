# Detached process options and a curl pipeline are capabilities, not proof of
# an unauthorized payload. Hum 0.2.58 and 0.2.59 contain the same self-updater.
# Proximity records nearby evidence; it does not bind a command to a child.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-detached-options-near-shell-pipeline
    desc: Detached child context near curl-shell pipeline
    crit: notable
    conf: 0.95
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text

  # Publication age adds triage context, never evidence of substitution.
  - id: new-npm-detached-shell-pipeline-context
    desc: New npm package with detached/pipeline context
    crit: notable
    conf: 0.95
    for: [npm, javascript, registry]
    scope: outer
    all:
      - id: metadata/registry::brand-new-package
      - id: node-detached-options-near-shell-pipeline
