# Shell backgrounding: a subshell or command group launched as an async job
# with a trailing `&`. A neutral process-control capability — ubiquitous in
# parallel CI scripts and build pipelines (run N downloads concurrently, then
# `wait`). On its own it carries no intent; a C2/beacon composite must supply
# the polling, jitter, and exec legs.
defaults:
  platforms: [unix]
  for: [github-actions, shell]
traits:
  - id: sh-background-subshell
    desc: Shell backgrounds a subshell job
    crit: baseline
    conf: 0.75
    if:
      type: text
      regex: '\)\s*&\s*$'

  # `nohup cmd >/dev/null 2>&1 &` / `setsid cmd >/dev/null 2>&1 &` -- the command
  # is detached from the caller's session and its output discarded, so it outlives
  # the process that started it. A neutral process-control capability: service
  # wrappers, dev-server launchers and shell-executor test suites all write it.
  # Intent comes from what is being detached and from where, which is why the
  # git-hook composite pairs this with a write into `.git/hooks`.
  - id: detached-background-command
    desc: Command detached with nohup or setsid
    crit: notable
    conf: 0.9
    for: [shell, javascript, typescript, python]
    if:
      type: text
      regex: '(setsid|nohup)[^\n]{0,100}>\s*/dev/null\s*2>&1\s*&'
