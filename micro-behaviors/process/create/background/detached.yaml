# A subshell backgrounded with both output streams discarded.
#
# `( … ) >/dev/null 2>&1 &` detaches a command group from the caller and throws
# away everything it would have said. The sibling `detached-background-command`
# in this directory covers the `nohup`/`setsid` spelling; this is the bare
# subshell form, which needs no helper binary and so is what appears inside a
# build recipe or a compiled-in command string.
#
# Neutral capability on its own -- parallel CI steps and service launchers both
# write it. It earns its place in a composite because it is how a build-time
# payload keeps the build log clean: the victim sees a normal build, and the
# fetch that ran alongside it leaves no output to notice.
defaults:
  platforms: [unix]
  for: [scripts, source, build]
  crit: notable
  conf: 0.85

traits:
  - id: subshell-detached-output-discarded
    desc: Subshell backgrounded, output discarded
    if:
      type: text
      regex: '\)\s*>\s*/dev/null\s*2>&1\s*&'
