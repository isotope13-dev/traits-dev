defaults:
  platforms: [windows]
  for: [oledoc, ooxml, scripts]
traits:
  - id: vba-auto-open-sub-decl
    desc: VBA auto-open subroutine declaration
    # Also matched inside scripting-language sources: macro-weaponizer tools
    # (Python/Ruby/PHP/JS generators) embed the same declarations as template
    # text when building malicious documents. The scripts group also covers
    # exported macro modules and short generator fixtures sniffed as vbs.
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: (?i)Sub\s+(AutoOpen|Document_Open|Workbook_Open|Auto_Open)\b
