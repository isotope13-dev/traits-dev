defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: vb6-shell-urlmon-name
    desc: VB6 shell and URLMon download names
    crit: suspicious
    conf: 0.95
    all:
      - id: vb6-shell-execution
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file-str
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-shell-exe-suffix
    desc: VB6 shell and executable suffix clue
    crit: notable
    conf: 0.93
    all:
      - id: vb6-shell-execution
      - id: micro-behaviors/fs/path/extension::utf16-exe-suffix-token
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-shell-file-write
    desc: VB6 shell and binary file-write capabilities
    crit: notable
    conf: 0.93
    all:
      - id: vb6-shell-execution
      - id: micro-behaviors/fs/write/file/handle::vb6-binary-file-write
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-shell-temp-exe-path
    desc: VB6 shell and temporary executable path
    crit: suspicious
    conf: 0.94
    all:
      - id: vb6-shell-execution
      - id: micro-behaviors/fs/path/temp::windows-temp-executable-path
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
