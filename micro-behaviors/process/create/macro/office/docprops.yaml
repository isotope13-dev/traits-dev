# Macros that keep their configuration inside the document itself instead of
# in code: reading ThisDocument.BuiltInDocumentProperties (or the
# CustomDocumentProperties sibling) and splitting the result on a marker
# turns an ordinary metadata field such as "Content status" into a hidden
# config channel for ProgIDs, URLs, and keys. Ordinary macros read these
# properties to stamp or display document info; splitting the value apart
# and feeding the pieces to CreateObject is the stash shape.
defaults:
  for: [vbs, oledoc, ooxml]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: vba-builtin-document-properties
    desc: Macro reads built-in document properties
    if:
      type: text
      regex: '(?i)\bBuiltInDocumentProperties\s*\('

  - id: vba-custom-document-properties
    desc: Macro reads custom document properties
    if:
      type: text
      regex: '(?i)\bCustomDocumentProperties\s*\('
