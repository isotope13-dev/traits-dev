# VBA document protection methods.  Protect/Unprotect are common workbook
# automation operations, so these are neutral capabilities rather than intent.
#
# Cleave's OLE text view does not expose the decompressed VBA source or its
# punctuation.  The compressed module stream does retain standalone method
# identifiers, so use a raw word match and describe the evidence honestly as
# an identifier rather than claiming a complete call site.  The paired
# composite supplies the stronger observation that both protection APIs are
# used.  Word boundaries avoid matching ordinary prose (or Protect_Sheet /
# Unprotect_Sheet helper names) in document content.
defaults:
  for: [oledoc, ooxml]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: vba-protect-identifier
    desc: VBA contains standalone Protect identifier
    crit: component
    if:
      type: raw
      regex: '(?i)\bProtect\b'
  - id: vba-unprotect-identifier
    desc: VBA contains standalone Unprotect identifier
    crit: component
    if:
      type: raw
      regex: '(?i)\bUnprotect\b'

composite_rules:
  - id: vba-protect-unprotect-pair
    desc: VBA contains both protection method identifiers
    crit: notable
    conf: 0.96
    all:
      - id: vba-protect-identifier
      - id: vba-unprotect-identifier
