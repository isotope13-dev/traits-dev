# VBA document protection methods.  Protect/Unprotect are common workbook
# automation operations, so these are neutral capabilities rather than intent.
defaults:
  for: [oledoc, ooxml]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: vba-protect-token
    desc: VBA contains an Office Protect token
    if:
      type: hex
      pattern: "50 72 6F 74 65 63 74"
  - id: vba-unprotect-token
    desc: VBA contains an Office Unprotect token
    if:
      type: hex
      pattern: "55 6E 70 72 6F 74 65 63 74"
