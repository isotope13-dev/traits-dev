# VBA document protection methods.  Protect/Unprotect are common workbook
# automation operations, so these are neutral capabilities rather than intent.
#
# Both matchers require the member-access form the VBA call actually takes
# (`ActiveSheet.Protect`, `.Unprotect Password:="x"`).  They used to be raw byte
# patterns for the bare words "Protect"/"Unprotect", which matched ordinary
# English anywhere in the container: a WordPress gettext template
# (`codepress-admin-columns.pot`) types as OleDoc on its `.pot` extension and
# fired the Protect trait on the msgids `"Password Protected"` and
# `PasswordProtectedFactory.php`.  The leading dot also keeps `.Unprotect` from
# satisfying the Protect trait.  VBA is case-insensitive, so the matchers are.
defaults:
  for: [oledoc, ooxml]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: vba-protect-method-call
    desc: VBA calls an Office Protect method
    if:
      type: text
      regex: '\.Protect\b'
      case_insensitive: true
  - id: vba-unprotect-method-call
    desc: VBA calls an Office Unprotect method
    if:
      type: text
      regex: '\.Unprotect\b'
      case_insensitive: true

composite_rules:
  - id: vba-protect-unprotect-pair
    desc: VBA calls both Protect and Unprotect methods
    crit: notable
    conf: 0.96
    all:
      - id: vba-protect-method-call
      - id: vba-unprotect-method-call
