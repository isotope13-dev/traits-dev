defaults:
  for: [oledoc]
  platforms: [windows]
  crit: notable
  conf: 0.88

traits:
  - id: wordbasic-autoopen
    desc: WordBasic auto-macro entrypoint in OleDoc
    crit: suspicious
    conf: 0.87
    attack: T1204.002
    # A bare AutoOpen word in a document carrying a VBA project is the VBA
    # handler's name, not a legacy WordBasic entrypoint: WordBasic predates
    # VBA projects, so the VBA symbol trait owns that evidence. WordBasic-only
    # documents (no VBA project) still match.
    unless:
      - id: metadata/document/ole::ole-vba-macro-count
    if:
      type: text
      regex: '(?i)\b(AutoOpen|AutoClose)\b'

  - id: wordbasic-filesaveas-hook
    desc: WordBasic FileSaveAs macro override in OleDoc
    conf: 0.85
    attack: T1204.002
    if:
      type: text
      word: "FileSaveAs"

  - id: wordbasic-normal-dot-ref
    desc: Reference to NORMAL.DOT default template
    conf: 0.85
    if:
      type: text
      regex: '(?i)NORMAL\.DOT'

  # WordBasic addresses macros inside a container with `Container:MacroName`
  # (e.g. FileName$() & ":autoOpen", "Global:autoOpen"). These literals are how
  # Word 6 macro viruses name their auto-run macro in the opened document and
  # in the global template when copying it between the two; ordinary documents
  # do not store container-qualified macro paths.
  - id: colon-qualified-auto-run-macro-path
    desc: Container-qualified auto-run macro path literal
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i):\s*auto(Open|Exec|Close|New|Exit)'

  - id: global-qualified-auto-run-macro-path
    desc: Global-container auto-run macro path literal
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bGlobal\s*:\s*auto(Open|Exec|Close|New|Exit)'

  - id: wordbasic-command-hook
    desc: WordBasic document command override
    crit: suspicious
    conf: 0.88
    attack: T1204.002
    if:
      type: raw
      regex: '(?i)\b(datei(speichern(unter)?|dokvorlagen|schlie)|dokumentschlie|file(chiudi|esci))\b'

  - id: wordbasic-template-ref
    desc: WordBasic document template reference
    conf: 0.85
    if:
      type: raw
      regex: '(?i)\\[a-z0-9_-]{1,16}\.dot\b'

