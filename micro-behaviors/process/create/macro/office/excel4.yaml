defaults:
  for: [documents]
  platforms: [windows]
  crit: suspicious
  conf: 0.95
traits:
  # This is a VBA call into the legacy Excel 4 macro evaluator.  The
  # evaluator is also used for legitimate built-in operations such as the
  # sample's PRINT command, so the capability is notable rather than an
  # execution objective on its own.
  - id: vba-execute-excel4macro
    desc: VBA invokes Excel 4 macro evaluator
    crit: notable
    conf: 0.94
    for: [oledoc, ooxml]
    if:
      type: hex
      pattern: "45 78 65 63 75 74 65 45 78 63 65 6C 34 4D 61 63 72 6F"

  - id: vba-excel4-print-command
    desc: Excel 4 macro PRINT command
    crit: notable
    conf: 0.95
    for: [oledoc, ooxml]
    if:
      type: raw
      regex: 'PRINT\([0-9,]{8,}'
      case_insensitive: true
composite_rules:
  - id: excel4-macro-document
    desc: Excel 4.0 macro sheet document
    conf: 0.98
    all:
      - id: metadata/document/office/markup::excel-workbook-part
      - id: metadata/document/office/macro::excel4-macrosheet-content

  - id: vba-excel4-print-workflow
    desc: VBA uses Excel 4 evaluator for printing
    crit: notable
    conf: 0.98
    all:
      - id: vba-execute-excel4macro
      - id: vba-excel4-print-command
