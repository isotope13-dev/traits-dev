defaults:
  for: [oledoc, ooxml]
  platforms: [windows, macos]
traits:
  - id: createobject-call
    desc: VBA CreateObject call
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (?i)CreateObject\(
  - id: autoopen-entrypoint
    desc: VBA AutoOpen style entrypoint
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (?i)(AutoOpen|Workbook_Open|Document_Open)
  - id: wscript-shell-object
    desc: VBA WScript.Shell object
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: (?i)wscript\s*\.\s*shell|wsc.?ript\.s.?hell
  - id: textbox-run-payload
    desc: VBA textbox-backed Run call
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: (?is)\.Run!\([^)]{0,120}TextBox[0-9]{1,2}
  - id: comspec-batch-stager
    desc: VBA COMSPEC batch stager
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)%COMSPEC%\s*/c.{0,80}/v:'
  - id: public-exe-drop-path
    desc: Obfuscated Public EXE drop path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)\$env:pu.?bli.?[^\\r\\n]{0,80}\.exe
  - id: powershell-encoded-flag-junked
    desc: PowerShell encoded flag with junk
    crit: suspicious
    conf: 0.86
    unless:
      - id: well-known/tool/detection/
    if:
      type: text
      regex: (?i)(powershell|pwsh).{0,40}-(enc|encodedcommand)
  - id: msiexec-quiet-install
    desc: VBA msiexec quiet install command
    crit: suspicious
    conf: 0.82
    if:
      type: text
      regex: (?i)msiexec(.{0,32})/q
  - id: vba-wscript-exe-launcher
    desc: VBA references wscript.exe
    crit: notable
    if:
      type: raw
      regex: '(?i)wscript\.exe'
  - id: vba-shell-run-method
    desc: VBA invokes a WSH Shell Run method
    crit: notable
    if:
      type: raw
      regex: '(?i)\b(sh|shellobj|shell)\s*\.\s*Run\b'
  - id: vba-worksheet-range-byte-source
    desc: VBA reads bytes from worksheet range
    for: [oledoc, ooxml, vbs]
    crit: suspicious
    conf: 0.94
    attack: T1027
    if:
      type: text
      regex: '(?is)\b(Me\.)?Worksheets\s*\(\s*\d+\s*\)\s*\.\s*Range\s*\(.{0,120}\)\s*\.\s*Value'
composite_rules:
  - id: vba-windows-shell-run
    desc: VBA invokes a Windows shell launcher
    crit: notable
    conf: 0.98
    any:
      - id: vba-wscript-exe-launcher
      - id: vba-shell-run-method
