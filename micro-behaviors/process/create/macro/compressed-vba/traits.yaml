# Raw observations for VBA source retained in compressed OLE chunks.  The
# separator-tolerant patterns are scoped to OLE documents because ordinary
# text is not stored in this representation.
defaults:
  for: [oledoc]
  platforms: [windows]

traits:
  - id: fragmented-vba-workbook-open-entrypoint
    desc: Fragmented VBA Workbook_Open entrypoint
    crit: notable
    conf: 0.94
    if:
      type: raw
      regex: '(?i)\bSub[\s\S]{0,2}Wor[\s\S]{0,2}kbook_Op[\s\S]{0,2}en\b'
  - id: fragmented-vba-auto-open-entrypoint
    desc: Fragmented VBA AutoOpen or Document_Open hook
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: '(?i)(\bAuto[\s\x00]{0,4}Open\b|\bDocument[\s\x00]{0,4}_Open\b)'
  - id: fragmented-vba-urlmon-download-api
    desc: Fragmented VBA URLDownloadToFile API reference
    crit: suspicious
    conf: 0.96
    if:
      type: raw
      regex: '(?i)URL[\s\x00]{0,4}Download[\s\x00]{0,4}To[\s\x00]{0,4}File'
  - id: raw-vba-run-method-call
    desc: Raw VBA Run method invocation
    crit: notable
    conf: 0.93
    if:
      type: raw
      regex: '(?i)\.[\s\x00]{0,4}Run\s'
    unless:
      - id: metadata/lang/locale::gettext-po-catalog

  - id: fragmented-vba-wscript-shell-object
    desc: Fragmented VBA WScript.Shell object
    crit: suspicious
    conf: 0.94
    if:
      type: raw
      regex: '(?i)WScript[\s\S]{0,2}\.[\s\S]{0,2}Shell'
  - id: fragmented-vba-powershell-launch
    desc: Fragmented VBA hidden PowerShell launcher
    crit: suspicious
    conf: 0.97
    if:
      type: raw
      regex: '(?i)powe[\s\S]{0,2}rshell[\s\S]{0,2}-[\s\S]{0,2}NonI[\s\S]{0,2}-W[\s\S]{0,2}H'
  - id: fragmented-vba-encoded-command-payload
    desc: Fragmented VBA long encoded command payload
    crit: suspicious
    conf: 0.97
    if:
      type: raw
      regex: '(?i)-e[\x00\s]*([A-Za-z0-9+/=]\x00?){120,}'

  - id: raw-vba-powerpoint-template-reference
    desc: Raw VBA PowerPoint template reference
    crit: notable
    conf: 0.94
    if:
      type: raw
      regex: '(?i)Blank\s+Presentation\.pot'

  - id: raw-vba-excel-startup-path
    desc: Raw VBA Excel startup folder reference
    crit: notable
    conf: 0.94
    if:
      type: raw
      regex: '(?i)\\Xlstart\\'

  - id: raw-vba-powerpoint-actionhook
    desc: Raw VBA PowerPoint actionhook event
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: '(?i)\bactionhook\b'

  - id: raw-vba-powerpoint-slidemaster-shapes
    desc: Raw VBA PowerPoint SlideMaster shapes
    crit: notable
    conf: 0.94
    if:
      type: raw
      regex: '(?i)SlideMaster[\s\S]{0,32}Shapes'

