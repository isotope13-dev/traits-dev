# Android Dynamic Code Loading
# Detects use of DexClassLoader / PathClassLoader for runtime code loading from DEX/APK files
# Specificity comes from Dalvik class name format (Ldalvik/system/DexClassLoader;)
# ATT&CK: T1406 (Obfuscated Files or Information — Android)
defaults:
  platforms: [android]
  for: [android_apk, binaries]
  crit: notable
  conf: 0.9
  attack: "T1406"

traits:
  - id: dex-class-loader-source
    desc: Android source imports DexClassLoader
    for: [java, kotlin]
    conf: 0.92
    if:
      type: symbol
      kind: import
      exact: dalvik.system.DexClassLoader

  - id: dex-class-loader
    desc: DexClassLoader dynamic code loading
    mbc: "C0021"
    if:
      type: text
      substr: "Ldalvik/system/DexClassLoader;"

  - id: path-class-loader
    desc: PathClassLoader runtime class loading
    conf: 0.8
    if:
      type: text
      substr: "Ldalvik/system/PathClassLoader;"

  - id: dex-format-template
    desc: DEX/JAR secondary file path template
    conf: 0.85
    if:
      type: text
      substr: '%s/%s.dex'

  - id: system-load-library-call
    desc: Android System loadLibrary call
    conf: 0.86
    # Bare "loadLibrary" matches C++ helpers (e.g. GSKLibraryManager::loadLibrary)
    # in non-Android ELF; require the Java/Android System API form.
    ref: sha256:093c727149837d576d10f843edce933436efe648e74b9008ccd91badf197fc5c
    if:
      type: text
      regex: 'System\.loadLibrary\s*\('


composite_rules:
  # The set of classes that can actually load a DEX at runtime, named once so
  # objectives can require "dynamic code loading is possible here" without
  # reaching for a directory reference -- the directory also holds the generic
  # `Ljava/lang/ClassLoader;` and reflection descriptors that every Android app
  # carries, which is exactly what such a reference would sweep back in.
  - id: dynamic-dex-loading-api
    desc: Class capable of loading a DEX at runtime
    crit: notable
    conf: 0.9
    any:
      - id: dex-class-loader
      # `path-class-loader` is deliberately absent: PathClassLoader is the
      # platform's own loader for the APK's own DEXes, which every app has and
      # every multidex app names (shadowsocks-android does). It says nothing
      # about loading code staged from outside the package.
      - id: base-dex-class-loader
      - id: dalvik-in-memory-dex-classloader
      - id: dex-file-api
  - id: dynamic-dex-loading
    desc: Android dynamic DEX code loading
    # Runtime DEX loading is a capability. Libraries such as Google Mobile
    # Ads use it for their own optimized components; intent requires a higher
    # level objective composite.
    crit: notable
    conf: 0.92
    mbc: "C0021"
    any:
      - id: dex-class-loader-source
      - id: dex-class-loader
      - id: path-class-loader
      - id: micro-behaviors/process/create/loader::dalvik-in-memory-dex-classloader
      - id: dex-format-template

  - id: dynamic-dex-and-native-loading
    desc: Android dynamic DEX and native loading
    crit: notable
    conf: 0.94
    ref: sha256:093c727149837d576d10f843edce933436efe648e74b9008ccd91badf197fc5c
    all:
      - id: dynamic-dex-loading
      - id: system-load-library-call
