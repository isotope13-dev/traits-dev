defaults:
  platforms: [android]
  for: [elf]
  crit: notable
  conf: 0.88
  attack: "T1406"

traits:
- id: memory-dex-classloader-fragment
  desc: Android in-memory DEX loader fragment
  crit: notable
  conf: 0.96
  if:
    type: text
    # Native string literals may be emitted as fixed-width adjacent fragments,
    # so the terminal "ader" may not be contiguous in the ELF.
    substr: MemoryDexClassLo

- id: native-component-enable-fragment
  desc: Native code manages Android app components
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: setComponentEnab

- id: short-obfuscated-jni-exports
  desc: Short obfuscated JNI exports
  crit: suspicious
  conf: 0.94
  if:
    type: text
    substr: "Java_aa_ab_"
  count_min: 6

- id: data-ptr-export
  desc: Native stage data pointer export
  crit: component
  conf: 0.9
  if:
    type: export
    exact: DATA_PTR

- id: loader-class-return-signature
  desc: Native bridge returns Loader class
  crit: component
  conf: 0.88
  if:
    type: text
    substr: ")Lcom/Loader;"

composite_rules:
- id: android-native-memory-dex-component-loader
  desc: JNI loads in-memory DEX code that manages app components
  crit: suspicious
  conf: 0.98
  all:
  - id: memory-dex-classloader-fragment
  - id: native-component-enable-fragment
  - id: metadata/binary/symbols/plugin::jni-onload-export

- id: obfuscated-jni-stage-writer
  desc: Obfuscated JNI writes staged payload
  crit: suspicious
  conf: 0.97
  all:
  - id: short-obfuscated-jni-exports
  - id: micro-behaviors/fs/file/open::fopen
  - id: micro-behaviors/fs/file/write/direct::write
  - id: micro-behaviors/fs/chmod/modify::syscall-chmod

- id: android-native-embedded-dex-loader
  desc: Android native embedded DEX loader
  crit: suspicious
  conf: 0.98
  all:
  - id: short-obfuscated-jni-exports
  - id: data-ptr-export
  - id: loader-class-return-signature
  any:
  - id: micro-behaviors/fs/file/open::fopen
  - id: micro-behaviors/fs/file/write/direct::write
  - id: micro-behaviors/fs/chmod/modify::syscall-chmod
