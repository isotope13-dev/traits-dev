defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1620
  mbc: B0005
traits:
  - id: x86-frame-local-address-sum
    desc: Adds two frame-local addresses
    crit: component
    conf: 0.94
    arch: [x86]
    size_max: 5242880
    if:
      type: hex
      section: .text
      # allocation base + entry-point RVA, saved to a frame-local slot
      pattern: '8B 85 18 FC FF FF 03 85 CC ED FF FF 89 85 20 FC FF FF'
  - id: x86-frame-pointer-slot-transfer
    desc: Transfers pointer between frame-local slots
    crit: component
    conf: 0.96
    arch: [x86]
    size_max: 5242880
    if:
      type: hex
      section: .text
      # Move the computed address into the later indirect-call slot.
      pattern: '8B 85 20 FC FF FF 89 85 AC EA FF FF'
  - id: x86-indirect-frame-call-with-buffer
    desc: Calls frame-local pointer with buffer
    crit: component
    conf: 0.86
    arch: [x86]
    size_max: 5242880
    if:
      type: hex
      section: .text
      # The call consumes the slot populated by the transfer above.
      pattern: '8D 85 1C F4 FF FF 50 FF 95 AC EA FF FF'
  - id: x86-indirect-frame-call-with-stack-buffer
    desc: Calls frame-local pointer with stack buffer
    crit: notable
    conf: 0.96
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: '8B 45 ?? 89 45 ?? 8D 45 ?? 50 FF 55 ??'
composite_rules:
  - id: x86-computed-image-entry-invocation
    desc: Invokes computed mapped-image entry
    crit: suspicious
    conf: 0.96
    near_bytes: 4096
    all:
      - id: x86-frame-local-address-sum
      - id: x86-frame-pointer-slot-transfer
      - id: x86-indirect-frame-call-with-buffer
