# Invoking Android's dynamic linker as a program: `/system/bin/linker64 <file>
# [args...]` asks the linker to map and start an ELF itself, instead of
# exec()ing that ELF. Android uses this to start executables that the kernel
# will not exec directly — most notably files under an app's private data
# directory, which is mounted noexec on modern releases — so it is the standard
# way to run a downloaded or unpacked native payload from app storage.
#
# Neutral mechanic: Termux-style userland environments and NDK debugging
# workflows use the same spelling. It records only "this code starts a program
# through the platform linker". Objective composites supply the intent.
defaults:
  platforms: [android, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
  attack: T1218

traits:
  - id: android-linker-direct-exec
    desc: Starts a program through the Android linker
    if:
      type: text
      regex: '/system/bin/linker(64)?["'']?\s+\S'
