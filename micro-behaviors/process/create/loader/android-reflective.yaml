# Android Reflective Staged DEX Loader
# Detects stage-1 APK loaders that decrypt/write a hidden payload and patch BaseDexClassLoader internals.
defaults:
  platforms: [android]
  for: [android_apk, zip, dex]
  crit: notable
  conf: 0.9
  attack: "T1406"

traits:
  - id: reflective-array
    desc: Reflection array helper for loader patching
    crit: notable
    conf: 0.88
    for: [dex]
    if:
      type: text
      substr: "Ljava/lang/reflect/Array;"

  - id: base-dex-class-loader
    desc: BaseDexClassLoader referenced directly
    conf: 0.92
    for: [dex]
    if:
      type: text
      substr: "dalvik.system.BaseDexClassLoader"

  - id: dex-elements-field
    desc: BaseDexClassLoader dexElements field access
    conf: 0.94
    for: [dex]
    if:
      type: text
      substr: "dexElements"

  - id: path-list-field
    desc: BaseDexClassLoader pathList field access
    conf: 0.92
    for: [dex]
    if:
      type: text
      substr: "pathList"

  # DexPathList's private element factories. Calling one reflectively builds
  # classloader elements for DEX files the platform never registered -- the
  # step that splices a decrypted stage into the running app's classloader.
  - id: dex-path-list-element-factory
    desc: Names DexPathList element factory method
    conf: 0.93
    for: [dex]
    if:
      type: text
      regex: '^make(Dex|Path|InMemoryDex)Elements$'

  # ActivityThread.mInitialApplication holds the process's Application
  # object. Only code that replaces the running Application (a packer's stub
  # handing over to the decrypted real one, or a hot-patch framework) names it.
  - id: activitythread-initial-application-field
    desc: Names ActivityThread initial Application field
    conf: 0.94
    for: [dex]
    if:
      type: text
      exact: "mInitialApplication"

  # The early-Context hook these loaders install from lives in
  # micro-behaviors/process/lifecycle/runtime-init::attach-base-context --
  # overriding attachBaseContext is ordinary app bootstrap, so the neutral
  # capability stays there and the classloader-patching context is assembled
  # here.
  - id: hidden-stage-asset
    desc: Large hex-named APK asset
    crit: suspicious
    conf: 0.9
    size_min: 1048576
    if:
      type: path
      basename: true
      regex: '^[a-f0-9]{8}$'

  - id: dropped-stage-dex
    desc: Hex named private DEX path
    crit: suspicious
    conf: 0.94
    for: [dex]
    if:
      type: text
      # Bound the name so a long numeric timestamp such as
      # 1764808731656.dex cannot match an 8-character substring.
      regex: '(^|[^A-Za-z0-9])[a-f0-9]{8}\.dex($|[^A-Za-z0-9])'

  - id: file-output-stream-call
    desc: Android loader writes staged payload
    crit: notable
    conf: 0.84
    for: [dex]
    if:
      type: text
      substr: "java.io.FileOutputStream("

  - id: dalvik-file-output-stream-class
    desc: Dalvik FileOutputStream class reference
    crit: notable
    conf: 0.86
    for: [dex]
    if:
      type: text
      substr: "Ljava/io/FileOutputStream;"

  - id: dalvik-asset-manager-class
    desc: Dalvik AssetManager class reference
    crit: notable
    conf: 0.86
    for: [dex]
    if:
      type: text
      substr: "Landroid/content/res/AssetManager;"

  - id: dalvik-get-assets-call
    desc: Dalvik getAssets API call
    crit: notable
    conf: 0.84
    for: [dex]
    if:
      type: text
      word: "getAssets"

  - id: dalvik-inflater-input-stream
    desc: Dalvik InflaterInputStream reference
    crit: notable
    conf: 0.88
    for: [dex]
    if:
      type: text
      substr: "Ljava/util/zip/InflaterInputStream;"

  # Some Android APK droppers implement their Base64 decoder directly, XOR
  # the output, then feed it to java.util.zip.Inflater instead of using
  # InflaterInputStream. Keep these as separate DEX API facts so downstream
  # rules can recognize the same staged-payload flow without requiring the
  # Android Base64 helper or a ClassLoader.
  - id: dalvik-inflater-class
    desc: Dalvik Inflater class reference
    crit: notable
    conf: 0.9
    for: [dex]
    if:
      type: text
      substr: "Ljava/util/zip/Inflater;"

  - id: dalvik-inflater-set-input
    desc: Dalvik Inflater receives compressed input
    crit: notable
    conf: 0.9
    for: [dex]
    if:
      type: text
      word: "setInput"

  - id: dalvik-inflater-inflate
    desc: Dalvik Inflater decompresses data
    crit: notable
    conf: 0.9
    for: [dex]
    if:
      type: text
      word: "inflate"

  - id: dalvik-get-files-dir-call
    desc: Dalvik getFilesDir API call
    crit: notable
    conf: 0.84
    for: [dex]
    if:
      type: text
      word: "getFilesDir"

  # The descriptor for any ClassLoader parameter or field, present in nearly
  # every app; the loader composites add the dex-specific loader names.
  - id: dalvik-classloader-descriptor
    desc: Dalvik ClassLoader descriptor
    crit: component
    conf: 0.86
    for: [dex]
    if:
      type: text
      substr: "Ljava/lang/ClassLoader;"

  - id: dalvik-runtime-classloader-descriptor
    desc: Dalvik runtime ClassLoader descriptor
    crit: notable
    conf: 0.9
    for: [class, dex]
    if:
      type: text
      regex: 'Ldalvik/system/(BaseDexClassLoader|DexClassLoader|PathClassLoader);'

  - id: dalvik-in-memory-dex-classloader
    desc: Dalvik in-memory DEX class loader reference
    crit: notable
    conf: 0.96
    for: [dex]
    if:
      type: text
      substr: "Ldalvik/system/InMemoryDexClassLoader;"

  - id: dalvik-app-component-factory-descriptor
    desc: Dalvik AppComponentFactory descriptor
    crit: notable
    conf: 0.94
    for: [dex]
    if:
      type: text
      substr: "Landroid/app/AppComponentFactory;"

  - id: dalvik-androidx-core-component-factory-descriptor
    desc: Dalvik AndroidX CoreComponentFactory descriptor
    crit: notable
    conf: 0.94
    for: [dex]
    if:
      type: text
      substr: "Landroidx/core/app/CoreComponentFactory;"

  - id: dalvik-instantiate-application-hook
    desc: Dalvik instantiateApplication hook name
    crit: notable
    conf: 0.95
    for: [dex]
    if:
      type: text
      word: instantiateApplication

  - id: dalvik-instantiate-activity-hook
    desc: Dalvik instantiateActivity hook name
    crit: notable
    conf: 0.94
    for: [dex]
    if:
      type: text
      word: instantiateActivity

  - id: dalvik-instantiate-provider-hook
    desc: Dalvik instantiateProvider hook name
    crit: notable
    conf: 0.93
    for: [dex]
    if:
      type: text
      word: instantiateProvider

  - id: dalvik-instantiate-receiver-hook
    desc: Dalvik instantiateReceiver hook name
    crit: notable
    conf: 0.93
    for: [dex]
    if:
      type: text
      word: instantiateReceiver

  - id: dalvik-instantiate-service-hook
    desc: Dalvik instantiateService hook name
    crit: notable
    conf: 0.93
    for: [dex]
    if:
      type: text
      word: instantiateService

  - id: dalvik-gzip-inputstream-class
    desc: Dalvik GZIP input stream reference
    crit: notable
    conf: 0.9
    for: [dex]
    if:
      type: text
      substr: "Ljava/util/zip/GZIPInputStream;"

  - id: android-activitythread-reflection
    desc: Reflection names ActivityThread internals
    crit: notable
    conf: 0.95
    for: [dex]
    if:
      type: text
      substr: "android.app.ActivityThread"

  - id: android-activitythread-current-method
    desc: Reflection obtains ActivityThread singleton
    crit: notable
    conf: 0.96
    for: [dex]
    if:
      type: text
      word: "currentActivityThread"

  - id: android-runtime-classloader-fields
    desc: Reflection names package classloader fields
    crit: notable
    conf: 0.96
    for: [dex]
    if:
      type: text
      regex: '\b(mPackages|mClassLoader)\b'

  - id: android-context-classloader-setter
    desc: Android loader sets thread context classloader
    crit: notable
    conf: 0.94
    for: [dex]
    if:
      type: text
      word: "setContextClassLoader"

  - id: dalvik-reflect-constructor-class
    desc: Dalvik reflect Constructor descriptor
    crit: notable
    conf: 0.84
    for: [dex]
    if:
      type: text
      substr: "Ljava/lang/reflect/Constructor;"

  - id: dalvik-reflect-method-class
    desc: Dalvik reflect Method descriptor
    crit: notable
    conf: 0.84
    for: [dex]
    if:
      type: text
      substr: "Ljava/lang/reflect/Method;"

  - id: dalvik-get-method-call
    desc: Dalvik getMethod reflection call
    crit: notable
    conf: 0.84
    for: [dex]
    if:
      type: text
      word: "getMethod"

  - id: dalvik-invoke-call
    desc: Dalvik invoke reflection call
    crit: notable
    conf: 0.84
    for: [dex]
    if:
      type: text
      word: "invoke"

  - id: encoded-loader-delimiter
    desc: Base64 encoded loader delimiter
    crit: notable
    conf: 0.9
    for: [dex]
    if:
      type: yara
      source: |
        rule encoded_loader_delimiter {
          strings:
            $a = "aHJpam5qcHN2Y29i" ascii
          condition:
            #a >= 6
        }

  - id: encoded-android-runtime-fields
    desc: Encoded Android runtime fields
    crit: suspicious
    conf: 0.95
    for: [dex]
    if:
      type: yara
      source: |
        rule encoded_android_runtime_fields {
          strings:
            $a = "bU1haW5UaHJlYW" ascii
            $b = "bVBhY2thZ2VJbmZv" ascii
            $c = "bUFwcGxpY2F0aW9u" ascii
          condition:
            all of them
        }

  - id: encoded-android-asset-loader
    desc: Encoded Android staged asset name
    crit: suspicious
    conf: 0.94
    for: [dex]
    if:
      type: yara
      source: |
        rule encoded_android_asset_loader {
          strings:
            $a = "bmd5Ym1h" ascii
            $b = "bXNiaGd0Zw" ascii
            $c = "cGF0aExpc3Q" ascii
          condition:
            all of them
        }

  - id: encoded-cjnejwgbazc-delimiter
    desc: Repeated encoded loader delimiter
    crit: notable
    conf: 0.9
    count_min: 8
    for: [dex]
    if:
      type: text
      substr: "Y2puZWp3Z2Jhem"

  - id: encoded-cjnejwgbazc-runtime-fields
    desc: Encoded Android runtime swap fields
    crit: suspicious
    conf: 0.96
    count_min: 6
    for: [dex]
    if:
      type: text
      substr: "Y2puZWp3Z2JhemNt"

  - id: encoded-cjnejwgbazc-stage-asset
    desc: Encoded Android staged asset name
    crit: suspicious
    conf: 0.96
    for: [dex]
    if:
      type: text
      substr: "Y2puZWp3Z2JhemN5cXdzcmNqbmVqd2diYXpj"

  - id: encoded-cjnejwgbazc-dex-elements
    desc: Encoded dexElements field name
    crit: suspicious
    conf: 0.96
    for: [dex]
    if:
      type: text
      substr: "Y2puZWp3Z2JhemNkZXhFbGVtZW50c2NqbmVqd2diYXpj"

  - id: encoded-cjnejwgbazc-path-list
    desc: Encoded pathList field name
    crit: suspicious
    conf: 0.96
    for: [dex]
    if:
      type: text
      substr: "Y2puZWp3Z2JhemNwYXRoTGlzdGNqbmVqd2diYXpj"

  - id: encoded-hqjgwjslwxj-delimiter
    desc: Encoded loader delimiter token
    crit: notable
    conf: 0.9
    for: [dex]
    if:
      type: text
      substr: "hqjgwjslwxj"

  - id: encoded-hqjgwjslwxj-runtime-fields
    desc: Encoded Android runtime swap fields
    crit: notable
    conf: 0.96
    for: [dex]
    if:
      type: text
      substr: "aHFqZ3dqc2x3eGptSW5pdGlhbEFwcGxpY2F0aW9u"

  - id: encoded-hqjgwjslwxj-stage-asset
    desc: Encoded Android staged asset name
    crit: notable
    conf: 0.95
    for: [dex]
    if:
      type: text
      substr: "aHFqZ3dqc2x3eGphZXFhdGtidWhxamd3anNsd3hq"

  - id: encoded-hqjgwjslwxj-dex-elements
    desc: Encoded dexElements field name
    crit: notable
    conf: 0.96
    for: [dex]
    if:
      type: text
      substr: "aHFqZ3dqc2x3eGpkZXhFbGVtZW50c2hxamd3anNsd3hq"

  - id: encoded-hqjgwjslwxj-path-list
    desc: Encoded pathList field name
    crit: notable
    conf: 0.96
    for: [dex]
    if:
      type: text
      substr: "aHFqZ3dqc2x3eGpwYXRoTGlzdGhxamd3anNsd3hq"

  - id: dex-file-api
    desc: Dalvik DexFile loader API
    conf: 0.92
    for: [dex]
    if:
      type: text
      substr: "dalvik.system.DexFile"

  - id: reflective-field-access
    desc: Reflective declared field access
    crit: notable
    conf: 0.84
    for: [dex]
    if:
      type: text
      substr: "getDeclaredField"

  - id: reflective-method-access
    desc: Reflective declared method access
    crit: notable
    conf: 0.84
    for: [dex]
    if:
      type: text
      substr: "getDeclaredMethod"

  - id: reflective-access-bypass
    desc: Reflection accessibility bypass
    crit: notable
    conf: 0.86
    for: [dex]
    if:
      type: text
      substr: "setAccessible"
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: micro-behaviors/data/source/dynamic/reflect::java-set-accessible

composite_rules:
  - id: android-in-memory-asset-dex-loader
    desc: Android decrypts and loads an in-memory DEX from an asset
    crit: suspicious
    conf: 0.99
    all:
      - id: dalvik-in-memory-dex-classloader
      - id: dalvik-gzip-inputstream-class
      - id: dalvik-get-assets-call
      - id: micro-behaviors/process/lifecycle/runtime-init::attach-base-context

  - id: android-app-component-factory-instantiate-surface
    desc: Custom AppComponentFactory component instantiation hooks
    crit: suspicious
    conf: 0.97
    for: [dex]
    unless:
      - id: dalvik-androidx-core-component-factory-descriptor
    all:
      - id: dalvik-app-component-factory-descriptor
      - id: dalvik-instantiate-application-hook
    any:
      - id: dalvik-instantiate-activity-hook
      - id: dalvik-instantiate-provider-hook
      - id: dalvik-instantiate-receiver-hook
      - id: dalvik-instantiate-service-hook

  - id: android-application-classloader-hijack
    desc: Android application classloader hijack through ActivityThread internals
    crit: suspicious
    conf: 0.995
    unless:
      - id: well-known/app/communication/sms-forwarder::smsforwarder-dex-communication-features
    all:
      - id: android-activitythread-reflection
      - id: android-activitythread-current-method
      - id: android-runtime-classloader-fields
      - id: reflective-field-access
      - id: reflective-access-bypass
      - id: android-context-classloader-setter

  - id: android-private-asset-payload-stager
    desc: Android decompresses an opaque asset into private files
    crit: suspicious
    conf: 0.98
    all:
      - id: dalvik-get-assets-call
      - id: dalvik-get-files-dir-call
      - id: dalvik-gzip-inputstream-class
      - id: dalvik-file-output-stream-class
      - id: dalvik-in-memory-dex-classloader

  - id: reflective-classloader-patch
    desc: Reflective BaseDexClassLoader element patching
    crit: suspicious
    conf: 0.98
    all:
      - id: base-dex-class-loader
      - id: dex-elements-field
      - id: path-list-field
    any:
      - id: reflective-array
      - id: micro-behaviors/process/lifecycle/runtime-init::attach-base-context

  - id: reflective-dex-loader-member
    desc: Reflective DexFile classloader patching chain
    for: [android_apk, zip, dex, class]
    crit: suspicious
    conf: 0.98
    all:
      - id: base-dex-class-loader
      - id: dex-elements-field
      - id: path-list-field
      - id: dex-file-api
    any:
      - id: reflective-field-access
      - id: reflective-method-access
      - id: reflective-access-bypass
      - id: file-output-stream-call
      - id: micro-behaviors/data/archive/extract/zip::jvm-zipfile-class-reference
    needs: 2

  - id: asset-inflater-reflective-loader
    desc: Asset inflater with reflective loader invoke
    crit: suspicious
    conf: 0.98
    all:
      - id: dalvik-asset-manager-class
      - id: dalvik-get-assets-call
      - id: micro-behaviors/data/encode/base64::android-base64-class-reference
      - id: dalvik-inflater-input-stream
      - id: dalvik-file-output-stream-class
      - id: dalvik-get-files-dir-call
      - id: dalvik-classloader-descriptor
      - id: dalvik-reflect-constructor-class
      - id: dalvik-reflect-method-class
    unless:
      - id: well-known/app/system/ankidroid::package-member
      - id: dalvik-get-method-call
      - id: dalvik-invoke-call

  - id: opaque-hex-stage-asset
    desc: Hex named staged asset with high entropy
    crit: suspicious
    conf: 0.98
    platforms: [android, linux, windows]
    for: [zip, tar, jar, whl, python-sdist, gem, deb, rpm, npm, nupkg, crate, conda, egg, pkg, dmg, crx, chm, cab, iso, oci_image, xbps, gentoo_binpkg, asar, vsix-archive, xpi, rar, 7z, cpio, apk, alpine_apk, ipa]
    all:
      - id: hidden-stage-asset
      - id: metadata/file/archive::high-entropy-archive
    unless:
      - id: well-known/tool/reverse-engineering/radare2/
      # An Arch makepkg package is not an Android APK.  Atomscan can promote
      # archive-entry evidence to the outer package node, so retain the
      # package-format guard here as well as the APK file-type field.
      - id: metadata/package/files/system-package::arch-makepkg-generated

  - id: hidden-dex-write
    desc: Hidden stage asset written to private DEX path
    crit: suspicious
    conf: 0.99
    all:
      - id: hidden-stage-asset
      - id: dropped-stage-dex
      - id: file-output-stream-call

  - id: encoded-application-swap-loader
    desc: Encoded Android application swap loader
    crit: suspicious
    conf: 0.99
    all:
      - id: encoded-loader-delimiter
      - id: encoded-android-runtime-fields
      - id: encoded-android-asset-loader
    any:
      - id: reflective-field-access
      - id: reflective-method-access
      - id: reflective-access-bypass
      - id: dalvik-file-output-stream-class
    needs: 2

  - id: encoded-delimited-application-swap-loader
    desc: Delimited encoded Android application swap loader
    crit: suspicious
    conf: 0.99
    all:
      - id: encoded-cjnejwgbazc-delimiter
      - id: encoded-cjnejwgbazc-runtime-fields
      - id: encoded-cjnejwgbazc-stage-asset
      - id: encoded-cjnejwgbazc-dex-elements
      - id: encoded-cjnejwgbazc-path-list
    any:
      - id: reflective-field-access
      - id: reflective-method-access
      - id: reflective-access-bypass
      - id: dalvik-file-output-stream-class
    needs: 2

  - id: encoded-hqjgwjslwxj-application-swap-loader
    desc: Delimited encoded Android application swap loader
    crit: suspicious
    conf: 0.99
    all:
      - id: encoded-hqjgwjslwxj-delimiter
      - id: encoded-hqjgwjslwxj-runtime-fields
      - id: encoded-hqjgwjslwxj-stage-asset
      - id: encoded-hqjgwjslwxj-dex-elements
      - id: encoded-hqjgwjslwxj-path-list
    any:
      - id: reflective-field-access
      - id: reflective-method-access
      - id: reflective-access-bypass
      - id: dalvik-file-output-stream-class
    needs: 2
