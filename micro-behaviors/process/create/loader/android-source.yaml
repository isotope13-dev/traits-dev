# Android dynamic DEX loading in Java/Kotlin source. In-memory DEX class
# loaders execute code that never touches the filesystem; staged malware
# chains them (decrypt blob, load, repeat) behind country and package
# gates, while a few legitimate frameworks use them for plugins.
defaults:
  platforms: [android]
  for: [java, kotlin]

traits:
  - id: java-inmemory-dex-source
    desc: Instantiates Android in-memory DEX loader
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'new\s+InMemoryDexClassLoader\s*\('
