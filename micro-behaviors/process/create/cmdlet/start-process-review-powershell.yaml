defaults:
  for:
    - python
    - javascript
    - powershell
    - pe
  crit: notable
  conf: 0.8
  platforms:
    - windows
traits:
  - id: saps-alias
    desc: PowerShell saps process-start alias
    crit: notable
    conf: 0.95
    for: [powershell]
    if:
      type: text
      regex: '(?im)(^|["'';&|][ \t]*)saps([ \t]|$)'
  # calc.exe is the canonical Windows RCE/PoC payload target (same role as in
  # Gradle exec-calc). Rarely a legitimate Start-Process target.
  - id: start-process-calc
    desc: Start-Process launches calc.exe
    crit: notable
    conf: 0.92
    attack: T1059.001
    for: [powershell, batch, pe]
    if:
      type: text
      regex: (?i)\bStart-Process\b[^\r\n]{0,160}\bcalc(\.exe)?\b

composite_rules:
  - id: powershell-start-process-filepath-runas
    desc: Start-Process FilePath with RunAs elevation
    crit: notable
    conf: 0.95
    for: [powershell, batch, pe, go, javascript]
    all:
      - id: micro-behaviors/process/create/cmdlet::start-process-filepath-text
      - id: micro-behaviors/process/config/launch::runas-verb

  - id: powershell-uac-start-process-any
    desc: PowerShell Start-Process UAC elevation command
    crit: notable
    conf: 0.95
    for: [powershell, batch, pe, go, javascript]
    any:
      - id: micro-behaviors/os/privilege/elevation::powershell-start-process-runas
      - id: powershell-start-process-filepath-runas

