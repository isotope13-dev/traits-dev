defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: start-process-non-msi-command
    desc: Start-Process command without MSI installer text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bStart-Process\b[^;|\r\n]{1,240}'
      not:
        - msiexec
        - .msi
