defaults:
  platforms: [windows]
  for: [text, xml, powershell, batch, pe]
  crit: notable
  conf: 0.95
  attack: T1059.001

traits:
  - id: base64-start-process-command
    desc: Base64 Start-Process command text
    if:
      type: encoded
      encoding: base64
      regex: '(?im)^\s*Start-Process\s+-FilePath\b'
