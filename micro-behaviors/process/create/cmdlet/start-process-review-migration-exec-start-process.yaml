# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  platforms:
  - windows
  crit: notable
  conf: 0.94
traits:
- id: start-process-symbol-call
  desc: Parsed Start-Process call
  for:
  - powershell
  if:
    type: symbol
    kind: call
    regex: (?i)^Start-Process$
- id: start-process-filepath-text
  desc: Start-Process FilePath command text
  for:
  - powershell
  - batch
  - pe
  - go
  - csharp
  - javascript
  - vbs
  if:
    type: text
    # Omit leading \b so Go length-sorted string tables without NUL separators match.
    regex: (?i)Start-Process\b[^\r\n]{0,120}-FilePath\b
- id: start-process-positional-arg
  desc: Start-Process command with positional target
  for:
  - powershell
  - batch
  if:
    type: text
    exclude_comments: true
    regex: (?im)(^|[;|&{])\s*Start-Process\s+(\$[A-Za-z_]\w*(:\w+)?|["'][^"'\r\n]{1,120}["'])
composite_rules:
- id: start-process-call
  desc: Start-Process call or FilePath command text
  for:
  - powershell
  - batch
  - pe
  - go
  - csharp
  - javascript
  - vbs
  any:
  - id: micro-behaviors/process/create/cmdlet::start-process-symbol-call
  - id: micro-behaviors/process/create/cmdlet::start-process-filepath-text
  - id: micro-behaviors/process/create/cmdlet::start-process-positional-arg
- id: script-viewer-open
  desc: Opens target via process cmdlet or handler
  platforms:
  - windows
  - unix
  for:
  - powershell
  - batch
  - python
  - javascript
  - typescript
  - vbs
  any:
  - id: micro-behaviors/process/create/cmdlet::start-process-call
  - id: micro-behaviors/os/handler/open::powershell-invoke-item
  - id: micro-behaviors/os/handler/open::os-startfile-call
  - id: micro-behaviors/os/handler/open::xdg-open-command
