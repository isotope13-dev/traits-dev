defaults:
  platforms:
  - windows
  for:
  - javascript
  - vbs
  - html
  crit: notable
traits:
- id: wscript-shell-run-statement
  desc: WSH Shell Run statement
  conf: 0.9
  for:
  - javascript
  - vbs
  - html
  - batch
  - text
  - xml
  if:
    type: text
    regex: (?i)\b\w*shell\w*\s*\.\s*run\s+(["']|Chr)
- id: msi-wscript-shell-run-call
  desc: WScript.Shell CreateObject and Run text
  conf: 0.97
  for:
  - oledoc
  attack: T1059.005
  if:
    type: raw
    regex: (?i)CreateObject\(\s*["']WScript\.Shell["']\s*\)\.Run
composite_rules:
- id: wscript-shell-run-obfuscated
  desc: Obfuscated WScript.Shell Run invocation
  conf: 0.9
  all:
  - id: metadata/file/profile/process/creation-api::wscript-shell-run-indirect
  any:
  - id: metadata/file/profile/com/progid::wscript-shell-literal
