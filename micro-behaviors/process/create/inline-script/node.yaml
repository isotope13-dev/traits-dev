defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059.007,T1105

traits:
  - id: node-inline-script-remote-fetch
    desc: Inline Node script remote fetch
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '["'']-e["''][\s\S]{0,300}(https?\.(get|request)|fetch\s*\()'

  - id: node-inline-script-eval-sink
    desc: Inline Node script eval sink
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '["'']-e["''][\s\S]{0,300}\b(eval|Function)\s*\('

composite_rules:
  - id: node-inline-remote-eval
    desc: Inline Node remote fetch-to-eval
    crit: suspicious
    conf: 0.97
    near_bytes: 1024
    all:
      - id: node-inline-script-remote-fetch
      - id: node-inline-script-eval-sink
