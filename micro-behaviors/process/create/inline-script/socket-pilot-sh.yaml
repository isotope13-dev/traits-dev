# Canonical placement from the socket-shell cohort audit.
defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: python-inline-socket-process
  desc: Inline Python socket/process code
  conf: 0.95
  for:
  - shell
  - package.json
  - python
  if:
    type: text
    regex: python[23]?\s+-c\s+['"]import socket.{0,50}subprocess.{0,50}connect
  unless:
  - id: well-known/tool/offensive/
  - type: text
    regex: '\b(true|false)_positive:'
- id: perl-inline-socket-exec
  desc: Inline Perl socket and exec code
  conf: 0.95
  for:
  - shell
  - package.json
  if:
    type: text
    regex: perl\s+-e\s+['"].{0,50}socket.{0,50}connect.{0,50}exec
  unless:
  - id: well-known/tool/detection/security-scanner-identity::ks-aur-scanner-source-context
  - id: metadata/package/testing/presence/harness::test-directory-path
- id: php-cli-fsockopen
  desc: Inline PHP socket connection code
  conf: 0.9
  for:
  - shell
  - package.json
  - php
  if:
    type: text
    regex: php\s+-r\s+['"].{0,80}fsockopen
- id: ruby-inline-socket-process
  desc: Inline Ruby socket/process code
  conf: 0.95
  for:
  - shell
  - package.json
  - ruby
  if:
    type: text
    regex: ruby\s+-rsocket\s+-e.{0,80}(exec|spawn|system)
- id: ruby-inline-socket-shell-path
  desc: Inline Ruby socket code names a shell
  conf: 0.95
  for:
  - shell
  - package.json
  - ruby
  if:
    type: text
    regex: ruby\s+-rsocket\s+-e.{0,80}(/bin/sh|/bin/shell)
- id: ruby-inline-socket-process-call
  desc: Inline Ruby connects and invokes a process
  conf: 0.95
  for:
  - shell
  - package.json
  - ruby
  if:
    type: text
    regex: ruby\s+-rsocket\s+-e.{0,160}TCPSocket\.open.{0,160}(exec|spawn|system)
composite_rules:
- id: ruby-inline-socket-command
  desc: Inline Ruby socket and process code
  conf: 0.95
  for:
  - shell
  - package.json
  - ruby
  any:
  - id: micro-behaviors/process/create/inline-script::ruby-inline-socket-process
  - id: micro-behaviors/process/create/inline-script::ruby-inline-socket-shell-path
  - id: micro-behaviors/process/create/inline-script::ruby-inline-socket-process-call
