# Neutral cross-compilation setup in container build files. Declaring a target
# triple is how every project that ships more than one platform's binaries
# builds; the attacker objectives that consume these add the packer, the
# obfuscator, the transport, or the artifact naming that carries intent.
defaults:
  platforms: [unix, windows]
  for: [dockerfile]
  crit: notable

traits:
  # Relocated from objectives/command-and-control/infrastructure/framework/
  # dockerfile, where it was named `dockerfile-cross-compile-windows-implant`.
  # The matcher only sees a target triple being installed —
  # `rustup target add … x86_64-pc-windows-msvc`, or `GOOS=windows GOARCH=amd64`
  # — which is the documented first step of Rust and Go cross-compilation and
  # appears in the CI image of essentially every project that publishes Windows
  # builds. Nothing in it distinguishes an implant from a release pipeline, so
  # the word did not belong in the id. The four hostile composites that consume
  # it are unchanged: each still requires garble, UPX, a Tor build, an
  # implant-artifact marker, or a console-less GUI link to reach its verdict.
  - id: dockerfile-windows-cross-target
    desc: Dockerfile adds a Windows cross-compile target
    conf: 0.9
    if:
      type: text
      regex: '(rustup target add|GOOS=windows)[\s\S]{0,220}(x86_64-pc-windows|GOARCH=amd64)'
      case_insensitive: true
