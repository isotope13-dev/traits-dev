# Neutral MSBuild process invocation from Windows batch. Passing a normal
# project file is a common build operation; objective rules add malicious task
# or payload context when they interpret it as proxy execution.
defaults:
  platforms: [windows]
  for: [batch]
  crit: notable
  attack: T1127.001

traits:
  - id: msbuild-project-argument
    desc: Batch passes project file to MSBuild
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bMSBuild\.exe["'']?\s+[^\r\n]{0,120}\.(csproj|vbproj|xml)\b'
