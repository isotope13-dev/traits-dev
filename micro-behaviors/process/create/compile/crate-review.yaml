# Neutral observations relocated during crate review. Matchers and type scope retained.
traits:
- platforms:
  - unix
  for:
  - makefile
  - shell
  - text
  id: local-c-source-compiler-command
  desc: C compiler command names a local source
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (\$\(?CC\)?|\bgcc|\bcc)\s+[\w./-]{1,40}\.c\s+-o\s+[\w./-]{1,40}
