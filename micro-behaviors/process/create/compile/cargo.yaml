# Neutral Cargo compiler invocation. Malware-builder objectives add the
# encrypted payload and deceptive output context that establish intent.
defaults:
  platforms: [unix, windows]
  for: [shell, batch, powershell, github-actions]

traits:
  - id: cargo-build-command
    desc: Invokes Cargo build
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?mi)^\s*cargo\s+build\b'
