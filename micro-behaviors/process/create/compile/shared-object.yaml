defaults:
  platforms: [aix, windows, unix]
  for: [c, cpp, rust, go, elf, shell]
traits:
  - id: shared-object-compiler-command
    desc: Shared-object compiler command reference
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(gcc|clang|cc)\b[^\n]{0,120}(-shared|\.so\b)'
  - id: fpic-shared-object-compile-flag
    desc: Position-independent shared-object compile flag
    crit: component
    conf: 0.94
    if:
      type: text
      substr: fPIC
  - id: aix-shared-object-compiler-command
    desc: AIX shared-object compiler command reference
    crit: notable
    conf: 0.94
    platforms: [aix, unix]
    if:
      type: text
      regex: '\b(gcc|clang|cc)\b[^\n]{0,120}-G\b'
