# Freestanding static gcc link from a shell script. Embedded firmware uses
# the same flags; attacker intent needs a payload-specific companion.
defaults:
  conf: 0.95
  platforms: [unix]
  for: [shell]
  crit: notable

traits:
  - id: gcc-freestanding-static-entry
    desc: gcc builds freestanding static binary
    if:
      type: text
      regex: '-e __start\b.{0,40}-nostartfiles\b.{0,20}-static\b'
