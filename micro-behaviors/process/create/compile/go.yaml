# Neutral Go compiler invocations and linker options from Windows build scripts.
# Attacker objectives add payload or obfuscator context before inferring intent.
# The target may be Windows, but the script doing the building rarely is: Go
# cross-compiles, so the `-H=windowsgui` / `-s -w` build line for a Windows
# binary is usually written in a POSIX shell script, a Makefile recipe, or a
# CI workflow on Linux. Restricting this file to `for: [batch]` +
# `platforms: [windows]` meant none of those were ever read, and a build.sh
# that produced a console-less stripped Windows binary carried no Go build
# facts at all.
defaults:
  platforms: [windows, unix]
  for: [shell, batch, powershell, python, github-actions]
  crit: notable

traits:
  - id: go-build-command
    desc: Invokes the Go compiler
    conf: 0.9
    unless:
      - id: metadata/build/conda/
    if:
      type: text
      regex: '(?i)\bgo\s+build\b'

  - id: go-ldflags-strip
    desc: Go linker strips binary symbols
    conf: 0.85
    size_max: 5000
    unless:
      - id: metadata/build/conda/
      - type: text
        substr: mkall
    if:
      type: text
      regex: 'ldflags.{0,50}(-s\s+-w|\s-s\s+|\s-s\b)'

  - id: go-ldflags-windows-gui
    desc: Go linker selects Windows GUI subsystem
    conf: 0.85
    if:
      type: text
      regex: '(?i)-H[= ]windowsgui'

  - id: go-linkmode-external
    desc: Go linker selects external link mode
    conf: 0.85
    if:
      type: text
      regex: '(?i)linkmode=external'

  - id: go-ldflags-symbol-inject
    desc: Go linker injects symbol value
    conf: 0.9
    if:
      type: text
      regex: '(?i)-X\s+\S+='

  - id: go-cross-compile-agent-output
    desc: Cross-compiles agent-named Go binaries
    conf: 0.9
    if:
      type: text
      regex: '(?i)GOOS=\w+[\s\S]{0,120}GOARCH=\w+[\s\S]{0,200}agent-'

composite_rules:
  - id: go-build-release-flags
    desc: Go build uses stripped or GUI linker flags
    crit: notable
    conf: 0.92
    unless:
      - id: metadata/build/conda/
    all:
      - id: go-build-command
    any:
      - id: go-ldflags-strip
      - id: go-ldflags-windows-gui
