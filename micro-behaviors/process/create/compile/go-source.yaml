# Go programs that shell out to the Go toolchain itself, and the Go idiom for
# abandoning a child process. Neither is suspicious on its own: code
# generators and dev tools run `go` all the time, and `Process.Release` is how
# a daemonizing launcher lets go of its child. Objectives combine them.
defaults:
  platforms: [linux, macos, windows]
  for: [go]
  crit: notable

traits:
  # `exec.Command("go", "run", …)`, `exec.Command("go", args...)`, and the
  # CommandContext form with a leading context argument.
  - id: go-toolchain-exec-command
    desc: Go program runs the go toolchain
    conf: 0.9
    if:
      type: text
      regex: 'exec\.Command(Context)?\(\s*(\w+\s*,\s*)?"go"\s*,'

  - id: go-process-release
    desc: Go releases a started child process
    conf: 0.9
    if:
      type: text
      substr: .Process.Release()
