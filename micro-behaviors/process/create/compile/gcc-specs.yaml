# GCC -wrapper is also useful for legitimate tooling; this records the spec
# directive without asserting that a compiler read or executed it.
defaults:
  for: [text]
  platforms: [unix]
traits:
  - id: gcc-self-spec-wrapper-directive
    desc: GCC self spec supplies a compiler wrapper
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\*self_spec:[ \t]*\r?\n[^\n]{0,200}-wrapper[ \t]'
