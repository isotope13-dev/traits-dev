# Neutral g++ invocation from a script. Payload-builder objectives add the
# windows.h template and builder banners that establish intent.
defaults:
  platforms: [windows]
  for: [python]
  crit: notable

traits:
  # Relocated from objectives/command-and-control/dropper/builder, where it was
  # `gpp-temp-exe-compile`. The old `-o.{0,80}\.exe` also matched argv lists
  # such as setuptools' `'g++-4.2', '-o', self.cc.exe`; require `-o` as its own
  # token followed by a literal output name ending in .exe.
  - id: gpp-exe-output-command
    desc: g++ command line writes an .exe
    conf: 0.95
    attack: T1027.004
    if:
      type: text
      regex: 'g\+\+[^\n]{0,80}[\s''"]-o[\s''",]{1,4}[^\s''",]{1,80}\.exe(["''\s]|$)'
