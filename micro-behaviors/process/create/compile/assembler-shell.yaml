# Neutral assembler and disassembler commands in shell build workflows.
# Shellcode authoring can use the same tools, but attacker intent requires
# payload-specific evidence beyond compiling or inspecting machine code.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable

traits:
  - id: printf-output-piped-to-as
    desc: Pipes printf output into GNU assembler
    conf: 0.95
    if:
      # Anchor at an active shell line so commented examples and documentation
      # cannot be interpreted as execution.
      type: text
      regex: '(?m)^[ \t]*printf[^|\r\n]{0,120}\|[ \t]*as([ \t]|$)'

  - id: objdump-disassembly-command
    desc: Runs objdump in disassembly mode
    conf: 0.95
    if:
      # The active-line anchor excludes comments while retaining wrapper
      # commands such as elfutils' `testrun_compare .../objdump -d file.o`.
      type: text
      regex: '(?m)^[ \t]*[^#\r\n]{0,80}objdump[ \t]+-d\b'

composite_rules:
  - id: assembler-disassembly-workflow
    desc: Assembles printf output and runs objdump
    conf: 0.95
    all:
      - id: printf-output-piped-to-as
      - id: objdump-disassembly-command
