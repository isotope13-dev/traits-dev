# Neutral .NET runtime-compilation API names. Referencing the CodeDom compiler
# providers is a capability, not an objective: intent comes from what the
# provider is asked to compile and where the source came from, which the
# composites in objectives/execution/compile/runtime supply.
defaults:
  platforms: [windows]
  for: [csharp, pe, dll]
  crit: notable

traits:
  - id: codedom-compiler
    desc: .NET CodeDOM compiler namespace reference
    for: [pe, dll]
    conf: 0.8
    if:
      type: text
      substr: System.CodeDom.Compiler
      section: .text
  - id: generate-executable
    desc: .NET executable-output compiler setting
    conf: 0.85
    if:
      type: text
      substr: GenerateExecutable
  - id: compile-assembly-from-dom
    desc: .NET compiles a CodeDOM syntax tree
    conf: 0.9
    if:
      type: text
      word: CompileAssemblyFromDom
  # Relocated from objectives/execution/compile/runtime, where a bare type name
  # was an objective on its own. `CSharpCodeProvider` and its `VBCodeProvider`
  # sibling are entries in System.CodeDom's type-name table, so the string is
  # present in any assembly bundle that references System.CodeDom at all — a
  # self-contained `dotnet publish` ships the whole table whether or not the
  # program ever compiles anything. The compiling composites still reference
  # this atom and add the source and output legs that carry the intent.
  - id: csharp-code-provider
    desc: CSharpCodeProvider API reference
    conf: 0.9
    if:
      type: text
      substr: CSharpCodeProvider

composite_rules:
  - id: dotnet-dynamic-code
    desc: .NET runtime code-generation APIs
    for: [pe, dll]
    conf: 0.85
    any:
      - id: metadata/lang/compiler/managed::reflection-emit
      - id: codedom-compiler
