defaults:
  platforms: [unix]
  crit: notable
  conf: 0.96
traits:
  - id: shell-shared-object-compiler-call
    desc: Invokes a shared object compiler
    for: [shell]
    if:
      type: symbol
      kind: call
      regex: '(^|/)(gcc|clang|cc)(-[0-9]+)?$'
      arg:
        kind: identifier
        name: -shared
  - id: python-shared-object-compiler-call
    desc: Subprocess runs a shared object compiler
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^subprocess\.(run|call|check_call)$'
      arg:
        kind: string
        regex: '\b(gcc|clang|cc)\b[^\n]{0,120}-shared'
  - id: node-shared-object-compiler-call
    desc: Exec call runs a shared object compiler
    for: [javascript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)exec(Sync)?$'
      arg:
        kind: string
        regex: '\b(gcc|clang|cc)\b[^\n]{0,120}-shared'
composite_rules:
  - id: shared-object-compiler-call
    desc: Invokes compiler to build a shared object
    for: [shell, python, javascript]
    any:
      - id: shell-shared-object-compiler-call
      - id: python-shared-object-compiler-call
      - id: node-shared-object-compiler-call
