defaults:
  crit: notable
  conf: 0.8

traits:
  - id: fork-syscall
    desc: Fork, vfork or clone syscall reference
    platforms: [linux, macos, android]
    for: [elf, macho]
    if:
      type: syscall
      name: [fork, vfork, clone]
    unless:
      - id: metadata/lang/compiler/systems::go-binary

  - id: syscall-clone
    desc: Direct clone or clone3 syscall reference
    platforms: [linux]
    for: [elf]
    if:
      type: syscall
      name: [clone, clone3]
    unless:
      # Preserve runtime and BSD-table exclusions from the original rule.
      # clone can create a thread or process; no flags are resolved here.
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/vendor/identity::bsd-elf-osabi
