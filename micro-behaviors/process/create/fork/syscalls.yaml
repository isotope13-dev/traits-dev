defaults:
  crit: notable
  conf: 0.8

traits:
  - id: powerpc-fork-syscall
    desc: PowerPC Linux fork syscall wrapper
    platforms: [linux]
    for: [elf]
    arch: [powerpc]
    conf: 0.99
    if:
      type: hex
      section: .text
      # li r0, 2 (SYS_fork); sc. Stripped static libc has no import name.
      pattern: "38 00 00 02 44 00 00 02"

  - id: arc-clone-syscall
    desc: ARC Linux clone syscall wrapper
    platforms: [linux]
    for: [elf]
    conf: 0.99
    if:
      type: hex
      section: .text
      # mov r8, 220 (SYS_clone); ...; trap0 (swi).
      pattern: "8A 20 03 17 [0-16] 6F 22 3F 00"

  - id: superh-fork-syscall
    desc: SuperH Linux fork syscall wrapper
    platforms: [linux]
    for: [elf]
    arch: [superh]
    conf: 0.99
    if:
      type: hex
      section: .text
      # mov #2, r3 (SYS_fork); ...; mov r3, r0; ...; trapa #16.
      pattern: "02 E3 [0-8] 33 60 [0-8] 10 C3"

  - id: fork-syscall
    desc: Fork or vfork syscall reference
    platforms: [linux, macos, android]
    for: [elf, macho]
    if:
      type: syscall
      name: [fork, vfork]
    unless:
      - id: metadata/lang/compiler/systems::go-binary

