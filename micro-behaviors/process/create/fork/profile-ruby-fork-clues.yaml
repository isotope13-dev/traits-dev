defaults:
  crit: notable
  platforms:
    - unix
  for:
    - ruby
traits:
  - id: process-fork-dup
    desc: String mentions Process.fork
    conf: 0.7
    if:
      type: string_literal
      substr: Process.fork
  - id: fork-brace-block
    desc: String mentions fork with brace block
    conf: 0.6
    if:
      type: string_literal
      regex: \bfork\s*\{
  - id: fork-paren
    desc: String mentions fork with parenthesis
    conf: 0.6
    if:
      type: string_literal
      regex: \bfork\s*\(
composite_rules:
  - id: fork-block
    desc: Ruby fork syntax clues
    conf: 0.7
    any:
      - id: fork-brace-block
      - id: micro-behaviors/process/create/fork::fork-do-block
      - id: fork-paren
  - id: ruby-fork
    desc: Ruby fork evidence
    conf: 0.88
    any:
      - id: micro-behaviors/process/create/fork::process-fork-dup
      - id: fork-block
