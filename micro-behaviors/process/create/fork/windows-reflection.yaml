# Windows native process-reflection and address-space cloning primitives.
# RtlCreateProcessReflection and RtlCloneUserProcess clone a process without
# direct memory reads on the original handle; pairing cross-process handle
# acquisition and debug privilege adjustment with cloning crosses process
# isolation boundaries regardless of target.
defaults:
  platforms: [windows]
  for: [binaries, scripts, source]

traits:
  - id: rtl-create-process-reflection
    desc: RtlCreateProcessReflection cloning API
    crit: notable
    conf: 0.96
    attack: T1106
    if:
      type: text
      exclude_comments: true
      word: RtlCreateProcessReflection

  - id: rtl-clone-user-process
    desc: RtlCloneUserProcess native fork API
    crit: notable
    conf: 0.95
    attack: T1106
    if:
      type: text
      exclude_comments: true
      word: RtlCloneUserProcess

composite_rules:
  - id: windows-process-clone-api-any
    desc: References a Windows process-reflection or native cloning API
    crit: component
    conf: 0.94
    any:
      - id: rtl-create-process-reflection
      - id: rtl-clone-user-process
      - id: metadata/binary/symbols/name/process::nt-create-process-ex-reference

  - id: privileged-cross-process-clone
    desc: Enables SeDebugPrivilege and clones a remote Windows process
    crit: suspicious
    conf: 0.95
    attack: T1134.001
    all:
      - id: micro-behaviors/os/privilege/reference::debug-privilege-identifier
      - id: micro-behaviors/os/privilege/token/adjust::privilege-adjust-api-any
      - id: micro-behaviors/process/attach/rights::process-handle-open-any
      - id: windows-process-clone-api-any
    unless:
      - id: well-known/app/system/microsoft/platform::microsoft-signed-system-component-context
      - id: metadata/vendor/identity::microsoft-corp-versioninfo
