defaults:
  platforms: [unix]
  for: [c, cpp, rust]
  crit: notable
  conf: 0.9

traits:
  - id: c-source-fork-loop
    desc: C loop assigns a fork result
    for: [c, cpp]
    if:
      type: tree-sitter
      query: |
        ((for_statement
          body: (compound_statement
            (expression_statement
              (assignment_expression
                right: (call_expression function: (identifier) @fork)))))
         (#eq? @fork "fork"))

  - id: rust-source-fork-loop
    desc: Rust loop assigns a fork result
    for: [rust]
    if:
      type: tree-sitter
      query: |
        ((for_expression
          body: (block
            (let_declaration
              value: (call_expression
                function: (scoped_identifier name: (identifier) @fork)))))
         (#eq? @fork "fork"))

composite_rules:
  - id: source-fork-loop
    desc: Loop assigns a fork result
    any:
      - id: c-source-fork-loop
      - id: rust-source-fork-loop
