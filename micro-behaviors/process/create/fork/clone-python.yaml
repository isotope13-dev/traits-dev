# Assignment records a fork call but does not establish that its result is
# inspected. The separate child-zero test identifies a branch on that result.
defaults:
  for: [python]
  platforms: [unix]
  crit: notable
  conf: 0.9

traits:
  - id: python-fork-return-assignment
    desc: Python assigns the fork return value
    if:
      type: text
      regex: '(?m)^\s*(pid|child|cpid|childpid)\s*=\s*os\.fork\s*\(\s*\)'
      case_insensitive: true

  - id: python-fork-child-zero-test
    desc: Python tests for the fork child branch
    if:
      type: tree-sitter
      language: python
      query: |
        [
          ((block
            (expression_statement (assignment
              left: (identifier) @saved
              right: (call function: (attribute
                object: (identifier) @module
                attribute: (identifier) @fork))))
            .
            (if_statement condition: (comparison_operator
              (identifier) @tested operators: "==" (integer) @zero)))
           (#eq? @module "os") (#eq? @fork "fork")
           (#eq? @saved @tested) (#eq? @zero "0"))
          ((module
            (expression_statement (assignment
              left: (identifier) @saved
              right: (call function: (attribute
                object: (identifier) @module
                attribute: (identifier) @fork))))
            .
            (if_statement condition: (comparison_operator
              (identifier) @tested operators: "==" (integer) @zero)))
           (#eq? @module "os") (#eq? @fork "fork")
           (#eq? @saved @tested) (#eq? @zero "0"))
          ((block
            (expression_statement (assignment
              left: (identifier) @saved
              right: (call function: (attribute
                object: (identifier) @module
                attribute: (identifier) @fork))))
            .
            (if_statement condition: (not_operator (identifier) @tested)))
           (#eq? @module "os") (#eq? @fork "fork")
           (#eq? @saved @tested))
          ((module
            (expression_statement (assignment
              left: (identifier) @saved
              right: (call function: (attribute
                object: (identifier) @module
                attribute: (identifier) @fork))))
            .
            (if_statement condition: (not_operator (identifier) @tested)))
           (#eq? @module "os") (#eq? @fork "fork")
           (#eq? @saved @tested))
        ]
