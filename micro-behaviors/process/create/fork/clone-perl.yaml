defaults:
  platforms: [unix]
  for: [perl]
traits:
  - id: fork-call
    desc: Perl fork child process
    crit: notable
    conf: 0.95
    if:
      # Perl's zero-argument builtin node has no named callee in the shared
      # call facts. Use its syntax, not raw text that also matches examples.
      type: tree-sitter
      query: |
        ((func0op_call_expression) @call
         (#match? @call "^fork\\b"))
        ((function_call_expression function: (function) @function)
         (#match? @function "^(CORE::)?fork$"))
