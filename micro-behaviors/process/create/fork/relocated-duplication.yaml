defaults:
  crit: notable
traits:
- platforms: &id001
  - linux
  - macos
  - android
  for:
  - c
  - cpp
  id: c-fork-call
  desc: C fork child process
  conf: 0.8
  if:
    type: text
    regex: \bfork\s*\(\s*\)
- platforms:
  - linux
  for:
  - elf
  id: x86-64-clone-syscall
  desc: Direct x86-64 clone syscall
  conf: 0.9
  if:
    type: hex
    section: text
    pattern: B8 38 00 00 00 0F 05
  unless:
  - id: metadata/lang/compiler/systems::go-binary
- platforms:
  - linux
  for:
  - elf
  id: m68k-fork-syscall
  desc: Direct m68k fork syscall wrapper
  conf: 0.99
  if:
    type: hex
    offset_range:
    - 64
    - null
    pattern: 4E 56 FF F8 70 02 4E 40 2D 40 FF F8
composite_rules:
- platforms: *id001
  for:
  - c
  - cpp
  - elf
  - macho
  - python
  id: process-creation-primitive
  desc: Process creation via fork or clone evidence
  conf: 0.88
  any:
  - id: micro-behaviors/process/create/fork::c-fork-call
  - id: micro-behaviors/process/create/fork::fork
  - id: micro-behaviors/process/create/fork::fork-syscall
  - id: micro-behaviors/process/create/fork::python-os-fork-call
  - id: micro-behaviors/process/create/fork::x86-64-clone-syscall
  - id: micro-behaviors/process/create/fork::m68k-fork-syscall
