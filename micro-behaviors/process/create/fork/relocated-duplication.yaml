defaults:
  crit: notable
traits:
- platforms: &id001
  - linux
  - macos
  - android
  for:
  - c
  - cpp
  id: c-fork-call
  desc: C fork child process
  conf: 0.8
  if:
    type: text
    regex: \bfork\s*\(\s*\)
- platforms:
  - linux
  for:
  - elf
  id: m68k-fork-syscall
  desc: Direct m68k fork syscall wrapper
  conf: 0.99
  if:
    type: hex
    offset_range:
    - 64
    - null
    pattern: 4E 56 FF F8 70 02 4E 40 2D 40 FF F8
