# gawk can fork through the `fork` extension (`@load "fork"`), which adds a
# fork() function to awk programs.
defaults:
  platforms: [unix]
  for: [text]
  conf: 0.9
  size_max: 8192
traits:
  - id: gawk-fork-extension-load
    desc: Loads the gawk fork extension
    crit: notable
    if:
      type: text
      regex: '@load\s+"fork"'

  - id: awk-bare-fork-call
    desc: AWK program calls fork directly
    crit: notable
    if:
      type: text
      regex: '(?m)\bfork\s*\(\s*\)\s*[;}]?\s*$'
