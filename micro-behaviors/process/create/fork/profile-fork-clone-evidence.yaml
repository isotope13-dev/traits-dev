defaults:
  crit: notable
composite_rules:
- platforms: [linux, macos, android]
  for:
  - c
  - cpp
  - elf
  - macho
  - python
  id: process-creation-primitive
  desc: Fork or clone evidence
  conf: 0.88
  any:
  - id: micro-behaviors/process/create/fork::c-fork-call
  - id: micro-behaviors/process/create/fork::fork
  - id: micro-behaviors/process/create/fork::fork-syscall
  - id: micro-behaviors/os/syscall/clone::legacy-clone-syscall-reference
  - id: micro-behaviors/process/create/fork::python-os-fork-call
  - id: micro-behaviors/os/syscall/clone::x86-64-clone-syscall
  - id: micro-behaviors/process/create/fork::m68k-fork-syscall
