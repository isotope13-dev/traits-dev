# Native Windows process cloning used to obtain a read-only memory snapshot.
# The API is a capability; browser-credential intent is expressed by the
# Chromium ABE composite that consumes it.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, rust, go, python]
  attack: T1106

traits:
  - id: nt-create-process-ex-reference
    desc: NtCreateProcessEx process-clone API reference
    crit: notable
    conf: 0.94
    if:
      type: text
      word: NtCreateProcessEx
