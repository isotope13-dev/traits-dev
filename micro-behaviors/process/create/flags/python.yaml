# Process Hiding - Windows (Python)
# Detects subprocess creation with hidden window flags
# ATT&CK: T1564.003 (Hide Artifacts: Hidden Window)
defaults:
  for: [python]
  mbc: "F0005"
  attack: "T1564.003"
  crit: notable
  platforms: [windows]
traits:
  # CREATE_NEW_PROCESS_GROUP - detaches from parent
  - id: create-new-process-group
    desc: "Process creation detached from parent"
    conf: 0.8
    if:
      type: symbol
      exact: "CREATE_NEW_PROCESS_GROUP"
    downgrade:
      any:
        - id: metadata/package/testing/scripted::pytest-word
  # creationflags parameter in subprocess — CREATE_NO_WINDOW suppresses the
  # console window of a child (ATT&CK Hidden Window), not process concealment.
  - id: creationflags
    desc: Subprocess uses CREATE_NO_WINDOW flag
    conf: 0.75
    crit: notable
    if:
      type: text
      # Accept any qualifier on the constant. Droppers routinely define
      # `CREATE_NO_WINDOW = 0x08000000` themselves (it avoids touching the
      # attribute, which only exists on Windows) and then pass the bare name,
      # so anchoring on `subprocess.` alone missed the common malware spelling.
      # The `[\w.|\s]{0,60}` prefix also covers OR-combined flag expressions.
      regex: 'creationflags\s*=\s*[\w.|\s]{0,60}\bCREATE_NO_WINDOW\b'
    unless:
      - id: metadata/lang/source/
      - id: windows-deferred-uninstall-helper
    downgrade:
      any:
        - id: well-known/tool/development/debugpy
  - id: python-create-no-window-getattr
    desc: Python gets CREATE_NO_WINDOW for child
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bgetattr\(\s*subprocess\s*,\s*["'']CREATE_NO_WINDOW["''](\s*,\s*0)?\s*\)'
  # CREATE_NEW_CONSOLE is the inverse of CREATE_NO_WINDOW: the child gets a
  # console window of its own instead of inheriting or suppressing one. Bound
  # to the `creationflags=` keyword rather than the bare constant, because the
  # bare name also appears wherever the constant is merely re-exported or
  # imported — CPython's own `subprocess.py` pulls it out of `_winapi` and
  # lists it in `__all__`, which is a declaration, not a process launch.
  # The file-level T1564.003/F0005 defaults describe window *hiding*; this flag
  # does the opposite, so it carries its own console/execution codes.
  - id: python-create-new-console
    desc: Subprocess uses CREATE_NEW_CONSOLE flag
    crit: notable
    conf: 0.92
    mbc: C0033
    attack: T1059
    if:
      type: text
      regex: 'creationflags\s*=\s*[\w.|\s]{0,60}\bCREATE_NEW_CONSOLE\b'
  - id: python-create-no-window-hex
    desc: Uses Python's CREATE_NO_WINDOW process flag
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "creationflags\\s*=\\s*0x[0O]8000000\\b"
  # Redefining the constant inline instead of importing it: the value is the
  # flag, so this fires even when the launch site passes an aliased name the
  # `creationflags=` matchers above cannot see.
  - id: python-create-no-window-constant-define
    desc: Defines CREATE_NO_WINDOW flag value inline
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)CREATE_NO_WINDOW\s*=\s*0x0?8000000\b'
  - id: windows-deferred-uninstall-helper
    desc: Windows deferred uninstall helper
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: 'deferred uninstall|uv tool uninstall|CREATE_NO_WINDOW gives the cmd'
  # Combined creation flags with bitwise OR
  - id: combined-creationflags
    desc: "Multiple process creation flags combined"
    crit: notable
    conf: 0.9
    if:
      type: text
      # Matches: creationflags=FLAG1 | FLAG2
      regex: "creationflags\\s*=\\s*[^,)]{1,120}\\|"
    unless:
      - id: metadata/lang/source/
      - id: windows-deferred-uninstall-helper
    downgrade:
      any:
        - id: well-known/tool/development/debugpy
composite_rules:
  # hidden window flag composite
  - id: hidden-window-flag
    desc: "Hidden or detached process window"
    conf: 0.85
    crit: notable
    any:
      - id: micro-behaviors/process/create/flags::create-no-window
      - id: micro-behaviors/process/create/flags::detached-process
      - id: micro-behaviors/process/create/flags::sw-hide
  # Combined: CREATE_NO_WINDOW + CREATE_NEW_PROCESS_GROUP
  - id: stealth-subprocess
    desc: "Stealthy subprocess creation (hidden +"
    conf: 0.95
    crit: notable
    unless:
      - id: metadata/build/pip::python-packaging-vendored-source
      - id: metadata/build/pip::python-packaging-tool-tests
      - id: metadata/build/pip::virtualenv-periodic-update-source
    all:
      - id: micro-behaviors/process/create/subprocess/
      - id: hidden-window-flag
