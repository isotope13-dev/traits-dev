defaults:
  attack: T1059.001
  platforms: [windows]
  for: [javascript, vbs, batch, powershell, pe, oledoc]
traits:
  - id: execution-policy-bypass-short-flag
    desc: Short ExecutionPolicy bypass flag
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: (?i)-e\^?p.{0,16}b\^?ypa\^?ss
  # The `-Exec Bypass` abbreviation does not match the `-ep` spelling above
  # (the word is "Exec", not "ep"), and the full-word text rule below requires
  # the spelled-out `-ExecutionPolicy`. Stagers routinely abbreviate.
  - id: execution-policy-bypass-abbrev-flag
    desc: PowerShell Ex or Exec Bypass flag
    for: [javascript, vbs, html, batch, powershell, pe, oledoc]
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: (?i)(^|[\s"'`])-ex(ec)?[ \t:,]{1,80}["'’]?-?bypass\b
  - id: execution-policy-override-flag
    desc: ExecutionPolicy override flag
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: (?i)E\^?xecu\^?t\^?i\^?o\^?n\^?P\^?o\^?l\^?icy.{0,16}(remotesigned|unrestricted)
  - id: execution-policy-override-short-flag
    desc: Short ExecutionPolicy override flag
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: (?i)-e\^?p.{0,16}(remotesigned|unrestricted)
  # Droppers that cannot spell `-ExecutionPolicy Bypass` on a flagged command
  # line set the process preference instead, so the child PowerShell starts
  # bypassed with a clean argv: `sh.Environment("PROCESS")
  # ("PSExecutionPolicyPreference") = "Bypass"`. Flag-only bypass rules miss
  # the whole shape; this atom names the environment spelling so launcher
  # composites can reference it alongside the flags.
  - id: execution-policy-bypass-tokenized
    desc: Tokenized PowerShell execution policy bypass
    crit: notable
    conf: 0.91
    if:
      type: text
      regex: (?i)\bonpOLI.{0,60}Byp.{0,12}ss
    not:
      - substr: "', '"
      - substr: '", "'
      - substr: onPolicy Bypass
      - substr: dataSubmissionPolicyBypassNotification
  - id: execution-policy-bypass-concat-fragment
    desc: Fragmented concatenated ExecutionPolicy bypass
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?is)ionPol.{0,220}icy Byp.{0,420}\bass\b
composite_rules:
  - id: powershell-policy-bypass-benign-context
    desc: Known benign PowerShell policy-bypass context
    crit: exception
    conf: 0.99
    any:
      - id: well-known/app/ai/coding-agent/
      - id: metadata/binary/section/name::bun-section-name
      - id: well-known/lib/runtime/scripted/bun-runtime::runtime-context
      - id: well-known/app/system/vinvai::vinvai-vscode-extension-context
      # Vibrancy Continued uses a temporary WSH restart helper to replace its
      # locked native addon files after the editor exits. Its PowerShell
      # policy-bypass invocation is part of that documented reload workflow.
      - id: well-known/tool/development/vscode-extension/vscode-vibrancy-continued::runtime-marker
      # DSH (DeepSeek Hub) web service restart routine spawns a detached
      # PowerShell helper to cleanly exit and relaunch the node web process.
      - id: well-known/app/ai/assistant/dsh::dsh-restart-context
