defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable
  conf: 0.94

traits:
  # Require the inline WSH receiver: arbitrary Run methods also accept
  # numeric/Boolean arguments without representing window-style flags.
  - id: wsh-hidden-async-run
    desc: Run hides window without waiting
    if:
      type: yara
      source: |
        rule vbs_inline_hidden_async {
          strings:
            $code = /(^|[\r\n])\s*CreateObject\("WScript\.Shell"\)\.Run[^\r\n]{1,160},\s*0,\s*(False|0)\b/ nocase
          condition:
            $code and @code < 4096
        }
