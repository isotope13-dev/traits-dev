defaults:
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86-64
  crit: notable
  conf: 0.95
traits:
- id: go-x64-hidden-process-attributes
  desc: Go x64 sets HideWindow and CREATE_NO_WINDOW
  if:
    type: hex
    section: .text
    pattern: E8 [4] C6 00 01 C7 40 18 00 00 00 08
  unless:
  - type: value
    path: pe.go.version
    exists: false
