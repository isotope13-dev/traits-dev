defaults:
  attack: T1059.001
  platforms: [windows]
  for: [javascript, vbs, batch, powershell, pe, oledoc]
traits:
  - id: powershell-policy-bypass-text
    desc: ExecutionPolicy Bypass command text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: (?im)^[ \t]*[^#\s\r\n][^\r\n]{0,120}ExecutionPolicy.{0,4}bypass
  - id: powershell-forced-policy-set
    desc: Forced PowerShell execution policy change
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: Set-ExecutionPolicy\s+\w+.{0,40}-Force
  - id: powershell-policy-bypass-token-sequence
    desc: PowerShell policy and Bypass token sequence
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?is)executionp.{0,120}olicy.{0,180}\bbypass\b
