defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust]
  crit: notable
  conf: 0.98

traits:
  - id: create-process-no-window-argument
    desc: CreateProcess uses CREATE_NO_WINDOW
    if:
      type: symbol
      kind: call
      regex: '^CreateProcess[AW]?$'
      arg:
        index: 5
        kind: identifier
        name: CREATE_NO_WINDOW
