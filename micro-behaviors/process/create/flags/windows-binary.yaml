defaults:
  platforms: [windows]
  for:
    - pe
    - dll
traits:
  - id: detached-process-flag-immediate
    desc: DETACHED_PROCESS flag immediate
    crit: component
    conf: 0.82
    arch:
      - x86
    if:
      type: hex
      section: .text
      pattern: 68 00 00 00 08 6A 01 6A 00
  - id: indirect-detached-process-group-x64
    desc: Indirect detached x64 process-group launch
    crit: notable
    conf: 0.98
    attack: T1106,T1564.003
    arch: [x86-64]
    if:
      type: hex
      # DETACHED_PROCESS | CREATE_NEW_PROCESS_GROUP (0x208) is placed in the
      # sixth Win64 argument slot shortly before an indirect API call.
      offset_range: [0, 524288]
      pattern: 'C7 44 24 28 08 02 00 00 C7 44 24 20 00 00 00 00 [0-48] FF 94 24 ?? 00 00 00'
  - id: winexec-sw-hide-immediate
    desc: WinExec called with hidden-window flag
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: WinExec
      arg:
        kind: number
        value: 0
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
  - id: winexec-sw-show-immediate
    desc: WinExec called with normal-window flag
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: WinExec
      arg:
        kind: number
        value: 1
composite_rules:
  - id: detached-createprocessa
    desc: Detached CreateProcessA execution
    crit: notable
    conf: 0.86
    all:
      - id: detached-process-flag-immediate
      - id: micro-behaviors/process/create/spawn::create-process-a
  - id: hidden-winexec
    desc: Hidden WinExec process launch
    crit: suspicious
    conf: 0.85
    attack: T1564.003
    all:
      - id: winexec-sw-hide-immediate
      - id: micro-behaviors/process/create/exec::winexec
    unless:
      - id: well-known/tool/sysadmin/sandboxie/
      - id: well-known/tool/reverse-engineering/scyllahide/
    downgrade:
      any:
        - id: metadata/binary/vendor/
        - id: well-known/app/browser/internet-explorer/
