defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component
  conf: 0.96

traits:
  - id: powershell-no-profile-flag
    desc: PowerShell disables profile loading
    crit: notable
    for: [powershell, python, batch, pe, go, html]
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\b[^\r\n]{0,140}-(NoProfile|nop)\b'

  - id: powershell-noninteractive-flag
    desc: PowerShell disables interactive prompts
    crit: notable
    for: [powershell, python, batch, pe, go, html]
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\b[^\r\n]{0,140}-NonInteractive\b'

  - id: powershell-no-logo-flag
    desc: PowerShell suppresses startup banner
    crit: notable
    for: [powershell, python, batch, pe, go, html]
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\b[^\r\n]{0,140}-NoLogo\b'

  - id: powershell-windowstyle-minimized
    desc: PowerShell requests minimized window
    crit: notable
    for: [powershell, python, batch, pe, go, html]
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\b[^\r\n]{0,100}-WindowStyle\s+Minimized\b'

  - id: powershell-hidden-window-flag
    desc: PowerShell hidden-window option flag
    if:
      type: literal
      exact: -WindowStyle

  - id: powershell-hidden-window-value
    desc: PowerShell hidden-window option value
    if:
      type: literal
      exact: Hidden

  - id: powershell-policy-bypass-flag
    desc: PowerShell execution-policy bypass option
    crit: notable
    for: [powershell, python, batch, vbs, pe, go, html]
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\b[^\r\n]{0,100}-(ExecutionPolicy|EP)\s+Bypass\b'
    unless:
      - id: well-known/lib/ai/huggingface::hub-utils-package-file
      - id: well-known/lib/ai/huggingface::hub-runtime-bytecode

  # A script may build the PowerShell executable name separately from its
  # arguments. Keep the argument itself neutral; the hostile interpretation
  # belongs to composites that also establish a script-host launch and staging.
  - id: powershell-policy-bypass-argument
    desc: PowerShell execution-policy bypass argument
    crit: notable
    conf: 0.9
    attack: T1059.001,T1562.001
    for: [javascript, vbs, html, batch, powershell, pe]
    if:
      type: text
      regex: '(?i)-(ExecutionPolicy|EP)\s+Bypass\b'

  # The short form is common in generated batch launchers and nested
  # Start-Process arguments, where the executable and option are separated.
  - id: powershell-short-policy-bypass-flag
    desc: PowerShell short execution-policy bypass option
    crit: notable
    conf: 0.9
    attack: T1059.001
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)(^|[\s"''`])-(ep|executionpolicy)\s+bypass\b'

  - id: powershell-policy-bypass-value
    desc: PowerShell bypass policy value
    for: [powershell, python]
    if:
      type: literal
      exact: Bypass
