defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component
  conf: 0.96

traits:
  - id: msi-powershell-no-profile-switch
    desc: MSI passes PowerShell no-profile switch
    crit: notable
    conf: 0.96
    for: [msi]
    if:
      type: raw
      regex: '(?i)\b-(NoProfile|NoP)\b'

  - id: powershell-no-profile-flag
    desc: PowerShell disables profile loading
    crit: notable
    for: [batch, pe, go, html]
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\b[^\r\n]{0,140}-(NoProfile|nop)\b'

  - id: python-powershell-no-profile-call
    desc: Python call uses PowerShell NoProfile
    crit: notable
    if:
      type: tree-sitter
      kind: call
      regex: '(?is)\b(os\.system|subprocess\.\w+)\s*\([^)]{0,200}-(NoProfile|nop)\b'

  - id: powershell-no-profile-option-text
    desc: PowerShell NoProfile option text
    crit: component
    for: [powershell]
    if:
      type: text
      regex: '(?i)(^|\s)-(NoProfile|nop)\b'

  - id: powershell-noninteractive-flag
    desc: PowerShell disables interactive prompts
    crit: notable
    for: [powershell, python, batch, pe, go, html]
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\b[^\r\n]{0,140}-NonInteractive\b'

  - id: powershell-no-logo-flag
    desc: PowerShell suppresses startup banner
    crit: notable
    for: [powershell, python, batch, pe, go, html]
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\b[^\r\n]{0,140}-NoLogo\b'

  - id: powershell-windowstyle-minimized
    desc: PowerShell requests minimized window
    crit: notable
    for: [powershell, python, batch, pe, go, html]
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\b[^\r\n]{0,100}-WindowStyle\s+Minimized\b'

  - id: powershell-hidden-window-flag
    desc: PowerShell hidden-window option flag
    if:
      type: literal
      exact: -WindowStyle

  - id: powershell-hidden-window-value
    desc: PowerShell hidden-window option value
    if:
      type: literal
      exact: Hidden

  - id: powershell-policy-bypass-flag
    desc: PowerShell execution-policy bypass option
    crit: notable
    for: [powershell, python, batch, vbs, pe, go, html]
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\b[^\r\n]{0,100}-(ExecutionPolicy|EP)\s+Bypass\b'
    unless:
      - id: well-known/lib/ai/huggingface::hub-utils-package-file
      - id: well-known/lib/ai/huggingface::hub-runtime-bytecode
      - id: well-known/app/development/datadog-system-tests::system-tests-path

  # A script may build the PowerShell executable name separately from its
  # arguments. Keep the argument itself neutral; the hostile interpretation
  # belongs to composites that also establish a script-host launch and staging.
  - id: powershell-policy-bypass-argument
    desc: PowerShell execution-policy bypass argument
    crit: notable
    conf: 0.9
    attack: T1059.001,T1562.001
    for: [javascript, typescript, go, vbs, html, batch, powershell, pe, msi]
    if:
      type: text
      regex: '(?i)-(ExecutionPolicy|EP)\s+Bypass\b'

  # Node spawnSync argv lists pass flag and value as separate strings.
  - id: powershell-policy-bypass-argv-pair
    desc: PowerShell Bypass as separate argv strings
    crit: notable
    conf: 0.94
    attack: T1059.001,T1562.001
    for: [javascript, typescript, go]
    if:
      type: text
      regex: '(?i)["'']-(ExecutionPolicy|EP)["'']\s*,\s*["'']Bypass["'']'

  - id: python-powershell-policy-bypass-argv-pair
    desc: Python call uses PowerShell policy bypass
    crit: notable
    conf: 0.94
    attack: T1059.001,T1562.001
    if:
      type: tree-sitter
      kind: call
      regex: '(?is)\bsubprocess\.\w+\([^)]{0,200}-ExecutionPolicy.{0,40}Bypass'

  # Obfuscated WSH/JScript downloaders commonly embed the full argv as a
  # JS string with `\x20` separators: powershell.exe\x20-nop\x20-ep\x20bypass\x20-file"
  - id: powershell-nop-ep-bypass-file-command
    desc: PowerShell nop/ep-bypass -File launch
    crit: notable
    conf: 0.95
    attack: T1059.001,T1562.001
    for: [javascript, xml, html, vbs]
    if:
      type: text
      regex: '(?i)powershell(\.exe)?(\\x20|\s+)-nop(\\x20|\s+)-ep(\\x20|\s+)bypass(\\x20|\s+)-file\b'

  - id: powershell-policy-bypass-value
    desc: PowerShell bypass policy value
    for: [powershell, python]
    if:
      type: literal
      exact: Bypass

composite_rules:
  - id: powershell-no-profile-source-invocation
    desc: PowerShell child process disables profile loading
    crit: notable
    conf: 0.94
    attack: T1059.001
    for: [powershell]
    all:
      - id: micro-behaviors/process/create/shell/interpreter::powershell-process-call
      - id: powershell-no-profile-option-text
    near_lines: 1
