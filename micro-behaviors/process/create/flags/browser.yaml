defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]

# The launch flags below carry `for: [binaries, scripts, source, ...]` rather
# than the old script-and-PE list: a compiled stealer stores its browser
# command line as string literals like any script does, and the macOS
# session-hijack modules that set these flags ship as Mach-O.
traits:
  # Chrome 111 added an Origin check on the debug WebSocket specifically to
  # stop local code attaching to a browser it did not launch. This flag turns
  # that check off. Automation frameworks launch their own browser and speak
  # to it from the same process, so they never need it; code that sets it is
  # arranging for something else to attach to the debug socket.
  - id: chromium-remote-allow-origins-flag
    desc: Chromium debug-socket origin check disabled
    crit: notable
    conf: 0.95
    for: [binaries, scripts, source, -jcl, -batch, -vbs, -beam, -pyc, -class, -staticlib, -wasm]
    if:
      type: text
      substr: --remote-allow-origins

  # `--headless=old` selects the pre-Chrome-112 headless implementation. It is
  # the only headless mode that loads an existing on-disk profile; the new one
  # starts a fresh browser, which would leave a hijacked profile's cookies
  # behind. Also used by legacy automation pinned to the old behaviour.
  - id: chromium-old-headless-mode-flag
    desc: Chromium legacy headless mode flag
    crit: notable
    conf: 0.9
    for: [binaries, scripts, source, -jcl, -batch, -vbs, -beam, -pyc, -class, -staticlib, -wasm]
    if:
      type: text
      substr: --headless=old
  - id: chromium-headless-launch-flag
    desc: Chromium headless launch flag
    crit: notable
    conf: 0.94
    for: [binaries, scripts, source, -jcl, -batch, -vbs, -beam, -pyc, -class, -staticlib, -wasm]
    if:
      type: text
      regex: '(?i)\b(chrome|chromium)\b[^\r\n]{0,160}--headless(=|\s|$)'

  - id: chromium-no-first-run-flag
    desc: Chromium --no-first-run launch flag
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: --no-first-run

  - id: chrome-disable-background-networking-flag
    desc: Chrome background-networking disable flag
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: --disable-background-networking

  - id: chrome-simulate-outdated-no-au-flag
    desc: Chrome --simulate-outdated-no-au launch flag
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: --simulate-outdated-no-au

  - id: chrome-disable-component-update-flag
    desc: Chrome --disable-component-update launch flag
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: --disable-component-update

  - id: chromium-remote-debugging-port
    desc: Chromium remote-debugging launch flag
    crit: notable
    conf: 0.95
    for: [binaries, scripts, source, -jcl, -batch, -vbs, -beam, -pyc, -class, -staticlib, -wasm]
    if:
      type: text
      regex: '--remote-debugging-port(=|\s)'

  - id: chromium-user-data-dir
    desc: Chromium user-data-directory launch flag
    crit: notable
    conf: 0.95
    for: [binaries, scripts, source, -jcl, -batch, -vbs, -beam, -pyc, -class, -staticlib, -wasm]
    if:
      type: text
      regex: '--user-data-dir(=|\s)'

  - id: edge-disable-auto-update-flag
    desc: Edge --disable-auto-update launch flag
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: --disable-auto-update\b

  - id: browser-load-extension-flag
    desc: Browser --load-extension launch flag
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: --load-extension=

  - id: chromium-isolated-web-app-renderer-flag
    desc: Chromium isolated web app renderer launch flag
    crit: notable
    conf: 0.95
    for: [scripts, source, data, pe, dll, elf]
    if:
      type: text
      substr: --enable-isolated-web-apps-in-renderer

  - id: chromium-isolated-web-app-id-flag
    desc: Chromium isolated web app app-id launch flag
    crit: notable
    conf: 0.92
    for: [scripts, source, data, pe, dll, elf]
    if:
      type: text
      regex: '(?i)--app-id(=|\s+)[A-Za-z0-9._-]{4,128}\b'

  - id: chromium-isolated-web-apps-feature-flag
    desc: Chromium IsolatedWebApps feature launch flag
    crit: notable
    conf: 0.95
    for: [scripts, source, data, pe, dll, elf]
    if:
      type: text
      regex: '--enable-features=[^\r\n]{0,80}IsolatedWebApps'

  - id: chromium-isolated-web-app-dev-mode-flag
    desc: Chromium isolated web app developer-mode flag
    crit: notable
    conf: 0.95
    for: [scripts, source, data, pe, dll, elf]
    if:
      # Developer mode lifts the requirement that a bundle carry a
      # store-trusted signature, so a self-signed IWA installs cleanly.
      type: text
      substr: enable-isolated-web-app-dev-mode
