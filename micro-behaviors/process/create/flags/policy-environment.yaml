defaults:
  for: [scripts]
  platforms: [unix, windows]
traits:

  - id: execution-policy-env-preference-bypass
    desc: ExecutionPolicy bypass via env preference
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)PSExecutionPolicyPreference["'']?\s*\)?\s*=\s*["'']?Bypass'
