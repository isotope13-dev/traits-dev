defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript

traits:
  - id: shell-bang-true
    desc: Minified shell spawn option set to true
    conf: 0.9
    if:
      type: text
      regex: 'shell[''"]?\s*:\s*!\s*0'

  - id: detached-hex-true
    desc: Detached spawn hex true !0x0
    conf: 0.86
    mbc: "F0011"
    attack: "T1059"
    if:
      type: text
      regex: 'detached[''"]?\s*:\s*!0x0\b'
