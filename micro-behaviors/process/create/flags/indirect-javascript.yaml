defaults:
  platforms: [windows, unix]
  for: [javascript]

traits:
  # Bracket-call with a trailing literal 0 is common in minified UI libs
  # (`fn.call(ctx,0)`, animation helpers). Restrict to non-bundle sources so
  # the signal stays useful for small reflective dispatchers / droppers.
  - id: computed-call-zero-final-argument
    desc: Computed call with zero final argument
    crit: notable
    conf: 0.96
    unless:
      - id: metadata/library/structure::js-large-minified-bundle
      - id: well-known/lib/ui/jquery-ui/
      - id: well-known/lib/ui/yui/
    # The argument list must be a single unnested call: no parentheses and no
    # statement separators between `](` and the trailing `, 0)`. The former
    # 240-character `[^\n]` window spanned unrelated code on minified lines and
    # stitched a regex literal's `]([^'"]+)` to a later `u2(S,0)` call.
    # The receiver must also be an identifier — the hidden-window `Run(cmd, 0)`
    # shape dispatches off a shell object, whereas a subscript on a literal is
    # ordinary polyfill code (core-js probes `'0'[$SPLIT](undefined, 0)`).
    if:
      type: text
      regex: '[A-Za-z_$][\w$]*\s*\[[^\]\n]{1,60}\]\([^()\n;]{1,80},\s*0\s*\)'
