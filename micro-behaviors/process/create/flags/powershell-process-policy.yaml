defaults:
  for: [powershell, batch, python, javascript, typescript, csharp, shell, pe, dll]
  platforms: [windows, unix]
  crit: notable
  conf: 0.95
traits:
  - id: powershell-process-policy-bypass-command
    desc: PowerShell process-scoped policy bypass
    if:
      type: text
      regex: '(?i)\bSet-ExecutionPolicy\s+(-ExecutionPolicy\s+)?Bypass\s+-Scope\s+Process\b'
