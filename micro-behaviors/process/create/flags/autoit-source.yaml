# AutoIt and AutoHotkey expose typed native-call arguments in text files.
defaults:
  platforms: [windows]
  for: [text, data, vbs]
  crit: notable
  conf: 0.97
traits:
  - id: ffi-createprocess-suspended-argument
    desc: Typed FFI suspended process-creation argument
    if:
      type: text
      regex: '(?i)"CreateProcess[AW]?"[\s\S]{1,300}"(dword|UInt)"\s*,\s*(0x)?4\b'
