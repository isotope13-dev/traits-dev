# AutoIt has no structured source producer; match typed FFI call arguments.
defaults:
  platforms: [windows]
  for: [text, data, vbs]
  crit: notable
  conf: 0.97
traits:
  - id: autoit-create-suspended-call
    desc: AutoIt typed suspended process creation
    if:
      type: raw
      regex: '(?i)"CreateProcess[AW]"[^\r\n]{1,300}"dword"[ \t]*,[ \t]*4[ \t]*,'
