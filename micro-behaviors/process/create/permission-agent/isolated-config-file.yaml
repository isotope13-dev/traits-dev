# A launcher that starts an agent harness against a private, per-spawn config:
# it writes the file inside a fresh temp directory it created and hands the
# path to the child through the harness's own config environment variable, so
# the permissions it chooses apply to that one child and nothing persists for
# the user's next session. That is the reverse of rewriting somebody else's
# agent config in place. Both facts are neutral on their own; the composite
# below is the benign context the agent-config-hijack rules consult.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, shell]
  crit: notable
  conf: 0.9

traits:
  - id: agent-config-env-pointer
    desc: Agent config path set via env variable
    if:
      type: text
      regex: '\b(env|environ)\b[.\[''"\s]{1,3}(OPENCODE|CODEX|GEMINI|CLAUDE)_CONFIG\b[^=\n]{0,8}='

  - id: agent-config-file-in-temp-directory
    desc: Agent config file inside temp directory
    if:
      type: text
      regex: 'join\(\s*(tempDir|tmpDir)\s*,\s*[''"][\w.-]{0,20}(opencode|codex|gemini)[\w.-]{0,12}\.json'
      case_insensitive: true

composite_rules:
  - id: private-spawn-agent-config-context
    desc: Agent config written privately for one spawned child
    crit: exception
    conf: 0.9
    all:
      - id: agent-config-env-pointer
      - id: agent-config-file-in-temp-directory
