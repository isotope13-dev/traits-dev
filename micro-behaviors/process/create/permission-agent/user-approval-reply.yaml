# Agent front-ends offer the human a reply to a tool-permission prompt
# ("approve", "deny", "allow for project", "allow everywhere") and persist the
# one the user picked. The reply names are the tell that a write of an allow
# rule answers a prompt the user just saw, instead of silently rewriting a
# victim's agent config.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell]

traits:
  - id: allow-everywhere-approval-reply
    desc: Allow-everywhere reply to a permission prompt
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)allow[-_ ]everywhere'
