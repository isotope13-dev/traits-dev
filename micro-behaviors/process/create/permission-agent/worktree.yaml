defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: agent-workspace-write-sandbox-setting
    desc: Agent config restricts writes to workspace
    conf: 0.98
    if:
      type: literal
      regex: 'sandbox_mode\s*=\s*"workspace-write"'
  - id: agent-sandbox-network-disabled-setting
    desc: Agent config disables sandbox network access
    conf: 0.98
    if:
      type: literal
      regex: 'network_access\s*=\s*false'
composite_rules:
  - id: isolated-worktree-sandbox-config
    desc: Generates sandboxed config for new Git worktrees
    crit: exception
    all:
      - id: agent-workspace-write-sandbox-setting
      - id: agent-sandbox-network-disabled-setting
      - id: micro-behaviors/process/create/shell/git::git-worktree-add-helper-call
      - id: micro-behaviors/fs/write/file/target::rendered-agent-config-write
