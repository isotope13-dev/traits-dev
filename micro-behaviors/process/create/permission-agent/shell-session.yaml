defaults:
  platforms: [unix, windows]
  for: [shell]

composite_rules:
  - id: shell-permissive-claude-agent
    desc: Shell script contains permissive Claude agent session
    crit: notable
    conf: 0.95
    unless:
      - id: metadata/package/documentation/source::documentation-dir-path
      - id: "metadata/file/naming::test-directory-component"
      - id: well-known/tool/detection/agent-glovebox::archive-context
      # A *.test.sh regression suite that also pins CONSTANT-style token
      # fixtures asserts on bypass flags as string data; it does not launch
      # an agent.
      - id: metadata/package/testing/presence/path::shell-test-suite-context
      - id: well-known/app/ai/agent-runtime/kaijibot::kaijibot-skill-frontmatter-marker
    all:
      - id: micro-behaviors/process/create/agent::claude-dangerous-agent-session
      - id: micro-behaviors/process/create/shell/spawn::shell-execution-comp

  - id: codex-bypass-option-reference
    desc: References Codex approval or sandbox bypass option
    crit: notable
    conf: 0.99
    for: [markdown, text, shell]
    any:
      - id: micro-behaviors/process/create/agent::codex-dangerous-sandbox-bypass-flag
      - id: codex-yolo-command-reference
traits:
  - id: codex-yolo-command-reference
    desc: References Codex command with yolo option
    crit: notable
    conf: 0.99
    for: [markdown, text, shell]
    if:
      type: text
      regex: '\bcodex(\s+exec)?\s+--yolo\b'
