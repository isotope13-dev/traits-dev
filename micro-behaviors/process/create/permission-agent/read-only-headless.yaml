# A connector that runs a coding agent headlessly on an untrusted packet (to
# summarize a session, say) writes a throwaway profile with the approval policy
# set to `never`, because nobody is there to answer. The same profile pins a
# read-only sandbox and switches the shell and tools off, so there is nothing
# left to approve. That is the reverse of a config hijack, which drops the
# approval gate in order to widen what the agent may do. `never` alone is not
# enough to tell the two apart; `never` beside a read-only sandbox and disabled
# tools is.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, shell]
  crit: notable
  conf: 0.9

traits:
  - id: agent-read-only-sandbox-pinned
    desc: Agent run pins a read-only sandbox
    if:
      type: text
      regex: '(?i)\bsandbox(_mode)?\W{1,6}read-only\b'

  - id: agent-tools-disabled-in-config
    desc: Agent config switches its tools off
    if:
      type: text
      regex: '(?i)\bshell_tool\W{1,4}false\b|\bpermission\W{1,4}deny\b|"\*"\s*:\s*false'

composite_rules:
  - id: agent-locked-down-headless-run
    desc: Headless agent run with read-only sandbox and no tools
    crit: exception
    all:
      - id: agent-read-only-sandbox-pinned
      - id: agent-tools-disabled-in-config
