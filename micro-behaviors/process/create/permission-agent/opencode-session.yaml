# Isolated OpenCode session hand-off. OpenCode's headless runners point the
# child process at a scratch config through the OPENCODE_CONFIG environment
# variable (plus a per-session OPENCODE_DB), the same throwaway-session shape
# Claude runners express with --strict-mcp-config and Codex with --ephemeral.
# The variable names the config file a harness wrote for this one child; it
# never reaches the user's own agent config.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, shell]
  crit: notable
  conf: 0.93

traits:
  - id: opencode-config-env-isolated-session
    desc: OpenCode reads isolated session config from env
    if:
      type: text
      word: OPENCODE_CONFIG

  # A deny list of egress and irreversible operations (git push, cluster
  # submission, remote shell/copy) kept beside the permission table it feeds.
  # Containment, not a disarm: a gate-disarming write sets the wildcard allow
  # and nothing else.
  - id: egress-operation-deny-list
    desc: Deny list of egress operations
    conf: 0.94
    if:
      type: text
      regex: '\[\s*["''](git[ _-]?push|sbatch|srun|ssh|scp|rsync)\*?["'']'
