defaults:
  platforms: [windows]
  for: [batch, powershell, python, javascript, c, cpp, pe, dll]
  attack: T1047

traits:
  - id: impacket-wmiexec-target
    desc: Impacket wmiexec remote target
    crit: suspicious
    conf: 0.96
    downgrade:
      all:
        - id: well-known/tool/offensive/adpentest::project-marker
        - id: well-known/tool/offensive/adpentest::active-scope-option
        - id: well-known/tool/offensive/adpentest::dry-run-mode
    if:
      type: text
      regex: '(?i)\bwmiexec\.py\b[^\r\n]{0,180}@(\[[^\]\r\n]{1,40}\]|[A-Za-z0-9_.-]+)'
    unless:
      - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
      - id: well-known/tool/offensive/framework/bingo/
composite_rules:
  - id: impacket-wmiexec-remote-command
    desc: Impacket wmiexec remote command execution
    crit: suspicious
    conf: 0.96
    downgrade:
      all:
        - id: well-known/tool/offensive/adpentest::project-marker
        - id: well-known/tool/offensive/adpentest::active-scope-option
        - id: well-known/tool/offensive/adpentest::dry-run-mode
    all:
      - id: micro-behaviors/os/application/target/utility::impacket-wmiexec-script-reference
      - id: micro-behaviors/process/create/remote::impacket-wmiexec-target
    unless:
      - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
      - id: metadata/file/extension/identity::markdown-powershell-basename
