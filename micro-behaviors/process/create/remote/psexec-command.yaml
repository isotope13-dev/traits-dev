traits:
  - id: psexec-remote-execution-command
    platforms: [windows]
    for: [binaries, scripts, source]
    desc: PsExec remote-host command text
    size_min: 10
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bpsexec(64)?(\.exe)?\b[^\r\n]{0,160}\s+["'']?\\\\[\w.%${}<>-]{1,80}(\s|["'']|$)'
