defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1047
composite_rules:
  # Win32_Process.Create aimed at another machine. This is how an attacker moves
  # laterally (T1047) and equally how an administrator runs a command on a
  # server: the cmdlet, the -ComputerName parameter and the remote spawn are all
  # documented Windows management. A hostile claim needs additional attacker
  # context; inventory and collection scripts can use the same command.
  - id: powershell-wmi-remote-process-spawn
    desc: Creates a process on a remote host via WMI
    crit: suspicious
    conf: 0.97
    any:
      - id: micro-behaviors/os/wmi/manipulate::create-process-wmi-cmdlet
      - id: micro-behaviors/os/wmi/manipulate::create-process-cim-cmdlet
    all:
      - id: metadata/lang/source/syntax/argument::computername-argument
    near_lines: 1
    # Reference text (snapshots of a spell-check run over the PowerShell docs)
    # quotes the cmdlet; it is not a script that runs it.
    unless:
      - id: metadata/path/directory::test-directory-component

