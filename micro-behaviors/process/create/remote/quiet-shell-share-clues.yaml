defaults:
  platforms: [windows]
  for: [batch, powershell, python, javascript, c, cpp, pe, dll]

composite_rules:
  - id: quiet-remote-shell-execution
    for: [scripts, binaries, c, cpp]
    desc: Quiet remote shell with redirected output
    crit: suspicious
    conf: 0.98
    downgrade:
      all:
        - id: well-known/tool/offensive/adpentest::project-marker
        - id: well-known/tool/offensive/adpentest::active-scope-option
        - id: well-known/tool/offensive/adpentest::dry-run-mode
    all:
      - id: micro-behaviors/os/console/io::quiet-cmd-output-redirect
    any:
      - id: micro-behaviors/process/create/remote::wmic-remote-process-create-command
      - id: micro-behaviors/process/create/remote::psexec-remote-execution-command
      - id: micro-behaviors/process/create/remote::impacket-wmiexec-remote-command
      - id: micro-behaviors/process/create/remote::powershell-wmi-remote-process-spawn
  - id: impacket-admin-share-output-clues
    for: [pe, batch, python, javascript, powershell]
    desc: ADMIN$ epoch output and quiet shell clues
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/os/console/io::quiet-cmd-output-redirect
      - id: micro-behaviors/network/share::admin-share-epoch-output
    near_lines: 2
