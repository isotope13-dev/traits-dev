defaults:
  platforms: [windows]
  for: [go, pe]

traits:
  - id: go-wmic-remote-process-create-arguments
    desc: Go WMIC remote process-create arguments
    crit: notable
    conf: 0.95
    for: [go]
    if:
      type: text
      regex: '"wmic",\s*"/node:"[\s\S]{0,120}"process",\s*"call",\s*"create"'

