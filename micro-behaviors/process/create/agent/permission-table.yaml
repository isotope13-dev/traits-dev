# Agent permission *tables* — the per-tool allow/deny map an agent harness
# consults before running a tool call, and the code that rewrites it.
#
# The flag-shaped bypasses (`--dangerously-skip-permissions`, `--yolo`,
# `approval_policy = never`) already live in ai-agent.yaml. This file covers the
# other half of the same surface: a config map whose entries are set to `allow`,
# which is how OpenCode, Crush and the other JSON-configured harnesses express
# "run this without asking". A wildcard entry (`"*": "allow"`) grants every
# tool at once, so it is the single value that removes the human approval gate
# entirely.
#
# Both spellings are matched: the literal map as it appears in a config file,
# and the loop that assigns `allow` into a permission map from code — an
# installer rewriting somebody else's config writes the second, never the first.
#
# These stay notable. A user's own hand-edited config legitimately contains a
# wildcard grant, and the harness's own source names these keys. Intent comes
# from the objectives/ composites that pair a grant with an agent config-file
# write performed by a package's install hook.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell, powershell, go, rust, json]
  crit: notable
  conf: 0.93
  attack: T1562.001

traits:
  - id: agent-permission-wildcard-allow
    desc: Agent config grants every tool permission
    conf: 0.95
    if:
      type: text
      regex: '["'']\*["'']\s*:\s*["'']allow["'']'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures

  # `config.permission[perm] = 'allow'` / `cfg["permissions"][k] = "allow"`.
  # The subscript is what distinguishes a program rewriting a permission table
  # from one merely declaring its own.
  - id: agent-permission-allow-assignment
    desc: Assigns allow into a permission map
    conf: 0.95
    if:
      type: text
      regex: '(?i)permissions?\[[^\]\n]{0,24}\]\s*=\s*["'']allow["'']'

  # An agent whose default persona is swapped out answers every later prompt as
  # the replacement. Written by config hijackers, never by the user's own edit
  # of a package they installed.
  - id: agent-default-agent-override
    desc: Overrides the configured default agent
    conf: 0.92
    if:
      type: text
      regex: '(?i)["'']?default[_-]?agent["'']?\s*[:=]\s*["''][A-Za-z0-9_-]{1,32}["'']'

  # Generic auto-approval switch used by Gemini CLI, Cline, Roo and friends.
  - id: agent-auto-approve-enabled
    desc: Agent auto-approval setting enabled
    conf: 0.9
    if:
      type: text
      regex: '(?i)["'']?auto[_-]?(approve|accept)([_-]?\w{1,16})?["'']?\s*[:=]\s*true'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures

composite_rules:
  # One place for "this code turns off an agent's human-approval gate",
  # whichever harness and whichever spelling. Objectives reference this rather
  # than re-listing every vendor's flag, so a new harness is covered by adding
  # one atom here.
  - id: agent-approval-gate-disabled
    desc: Disables an AI agent approval gate
    crit: suspicious
    conf: 0.93
    any:
      - id: agent-permission-wildcard-allow
      - id: agent-permission-allow-assignment
      - id: agent-auto-approve-enabled
      - id: ai-agent-bypass-permissions-mode
      - id: ai-agent-bypass-permissions-setting
      - id: ai-agent-skip-dangerous-permission-prompt
      - id: ai-agent-dangerously-skip-permissions-setting
      - id: ai-agent-dangerous-permission-flag
      - id: ai-agent-yolo-approval-setting
      - id: codex-never-approval-policy
      - id: codex-full-access-sandbox-mode
      - id: codex-full-auto-approval-mode
      - id: codex-dangerous-sandbox-bypass-flag
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: well-known/tool/detection/repo-trust-scan::repo-trust-scan-context
