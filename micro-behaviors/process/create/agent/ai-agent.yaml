# Invoking an AI coding-agent CLI (Codex, Claude Code, OpenCode, MimoCode) and
# the permission/sandbox modes those CLIs expose.
#
# Previously filed under process/create/hcom/. `hcom` names an unrelated macOS
# PTY-relay binary (well-known/app/system/hcom, micro-behaviors/process/create/hcom/
# hcom.yaml), so these traits were keyed to a product-named directory that says
# nothing about what they match — and, since the ML pipeline features on the
# directory path, to the wrong signal. `agent/` names the technique: process
# creation, specifically the AI-agent-CLI kind.
#
# Each flag here is a documented mode of the agents themselves, so the atoms
# stay notable; abuse intent comes from the composites in objectives/ that pair
# them with scripted/non-interactive invocation.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json, json, shell, python]
  attack: T1059
  mbc: B0022
  crit: notable
  conf: 0.88

traits:
  - id: codex-cli-command
    desc: Codex CLI command invocation
    if:
      type: text
      regex: '\bcodex (login|login status|--version)\b'

  - id: codex-exec-command
    desc: Codex exec command invocation
    crit: notable
    conf: 0.94
    ref: sha256:32f1acd36984e7f7bd66b06d4185afa42fcf696bad4378aecf4b3bc8dfdab654
    if:
      type: text
      regex: '\bcodex\s+exec\b'

  - id: ai-agent-bypass-permissions-mode
    desc: AI agent bypass permissions mode
    crit: notable
    conf: 0.93
    if:
      type: literal
      kind: string
      exact: bypassPermissions

  - id: ai-agent-bypass-permissions-setting
    desc: AI settings enable bypass permissions
    crit: notable
    conf: 0.97
    for: [json]
    if:
      type: value
      path: permissions.defaultMode
      exact: bypassPermissions

  - id: ai-agent-skip-dangerous-permission-prompt
    desc: Suppresses AI dangerous-mode permission prompt
    crit: notable
    conf: 0.97
    for: [json]
    if:
      type: value
      path: skipDangerousModePermissionPrompt
      exact: 'true'

  # Frameworks use several names for an unattended run mode. Keep the key and
  # value separate so objective composites can require them near each other.
  - id: ai-agent-unattended-execution-key
    desc: AI agent execution mode assignment
    crit: component
    conf: 0.9
    for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
    if:
      type: text
      regex: '(?i)\b(execution|run|approval)[_-]?mode\b["'']?\s*[:=]'

  - id: ai-agent-unattended-execution-value
    desc: Unattended agent execution mode value
    crit: component
    conf: 0.9
    for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
    if:
      type: text
      regex: '(?i)\b(unattended|headless|non[-_ ]?interactive|auto[-_ ]?approve)\b'

  # These are neutral configuration capabilities. The article used both a
  # response-storage disable and proxy routing to reduce attribution; the
  # hostile interpretation belongs in an objective composite with offensive
  # tasking, not in either atom.
  - id: ai-agent-response-storage-disable-key
    desc: AI agent response-storage disable setting
    crit: component
    conf: 0.92
    for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
    if:
      type: text
      regex: '(?i)\bdisable[_-]?response[_-]?storage\b'

  - id: ai-agent-response-storage-disable-value
    desc: AI agent response-storage disable value
    crit: component
    conf: 0.92
    for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
    if:
      type: text
      regex: '(?i)\bdisable[_-]?response[_-]?storage\b.{0,16}\b(true|1|off)\b'

  # NOTE: "proxy_url = 'http://...'" is plain HTTP proxy configuration and has
  # nothing to do with agents — it fired on the `needle` HTTP client. It now
  # lives at micro-behaviors/communications/proxy/config::proxy-endpoint-url-setting
  # and the exploit-agent composite references it cross-directory.

  # A terminal-capable agent is a useful neutral capability. The objective
  # composites add unattended execution and offensive tasking before treating
  # it as malicious, so ordinary coding assistants remain notable evidence.
  # Plural `tools` only: the singular form matched unrelated keys such as the
  # `Tool:` creator field in an SPDX SBOM and `[tool.*]` config sections.
  # The value must be a collection literal as well: a bare `tools:` key with a
  # string value is ordinary UI vocabulary (i18n catalogs translate the
  # toolbar label `tools:"Werkzeuge"`), not a declared tool list.
  - id: ai-agent-tools-key
    desc: Agent tool-list configuration key
    crit: component
    conf: 0.9
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '(?i)\btools\b["'']?\s*[:=]\s*[\[{]'

  # Keep the `tool`/`tools` context inside the atom (same shape as
  # ai-agent-shell-tool-name). A bare `terminal:` key is ordinary vocabulary -
  # Langium/Chevrotain grammar records use `"terminal":{...}` for terminal
  # rules, which has nothing to do with an agent shell tool.
  - id: ai-agent-terminal-tool-name
    desc: Agent terminal tool key
    crit: component
    conf: 0.85
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '(?i)\btools?\b[^\r\n]{0,40}\bterminal\b'

  - id: ai-agent-shell-tool-name
    desc: Shell tool name
    crit: component
    conf: 0.85
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '(?i)\btools?\b[^\r\n]{0,40}\bshell\b'

  - id: ai-agent-command-tool-name
    desc: Command tool name
    crit: component
    conf: 0.85
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '(?i)\b(name|tool)\s*:\s*["'']command["'']'

  # Messaging gateways are also neutral by themselves: many legitimate agents
  # expose a chat interface. This atom keeps the platform list small and
  # generic while the hostile objective requires unattended offensive work.
  - id: ai-agent-gateway-key
    desc: Agent gateway configuration key
    crit: component
    conf: 0.9
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '["'']?(gateway|operator[_-]?channel|control[_-]?channel)["'']?\s*[:=]'

  - id: ai-agent-control-channel-key
    desc: Agent control-channel configuration key
    crit: component
    conf: 0.9
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '["'']?(operator|control)[_-]?channel["'']?\s*[:=]'

  - id: ai-agent-chat-platform-a
    desc: Agent chat platform endpoint marker
    crit: component
    conf: 0.82
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      # A bare identifier such as `slack` is ordinary application data.  URLs
      # identify an actual chat service endpoint (including Slack webhooks).
      regex: '(?i)\b(api\.)?(telegram|discord|slack)\.(org|com)\b'

  - id: ai-agent-chat-platform-b
    desc: Agent chat platform marker
    crit: component
    conf: 0.82
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z0-9_.-])(whatsapp|matrix\.org)([^A-Za-z0-9_.-]|$)'

  - id: ai-agent-signal-platform
    desc: Agent Signal platform marker
    crit: component
    conf: 0.82
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      # `signal` is also a common Go/POSIX package name. Require a
      # platform-specific identifier instead of treating every signal import
      # or signal-handling identifier as a chat service.
      regex: '(?i)\bsignal(\.org|-cli)\b'

  - id: ai-agent-email-channel
    desc: Agent email channel marker
    crit: component
    conf: 0.82
    for: [scripts, source, json, -batch, -jcl, -ruby, -php, -perl, -lua, -applescript, -vbs, -c, -cpp, -swift, -objc, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: text
      # Require a quoted key: an unquoted `Email:` is also a normal Go struct
      # field (for example, an account or user record), not agent messaging.
      regex: '(?i)["'']email["'']\s*[:=]'

  # A literal service endpoint catches gateways that do not expose a
  # `gateway`/`channel` config key. The platform list is intentionally generic:
  # the hostile objective below supplies the unattended offensive context.
  - id: ai-agent-chat-endpoint-a
    desc: Agent Telegram/Discord/Slack API endpoint
    crit: component
    conf: 0.88
    for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
    if:
      type: text
      regex: '(?i)https?://(api\.telegram\.org|discord(app)?\.com|hooks\.slack\.com|slack\.com/api)/'

  - id: ai-agent-chat-endpoint-b
    desc: Agent WhatsApp/Signal/Matrix API endpoint
    crit: component
    conf: 0.88
    for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
    if:
      type: text
      regex: '(?i)https?://[^/\s]{1,40}(whatsapp|signal|matrix|graph\.facebook\.com)/'

  - id: ai-agent-chat-endpoint-c
    desc: Agent regional chat-service API endpoint
    crit: component
    conf: 0.88
    for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
    if:
      type: text
      regex: '(?i)https?://(oapi\.dingtalk\.com|api\.weixin\.qq\.com|api\.line\.me)/'

  # `polling` was in this alternation and named nothing about messaging: it is
  # the ordinary English word for any retry loop, so a Telegram transport's
  # doc comments — or any file that says "long polling" — read as an agent
  # command channel. Only the two bot-API names remain.
  - id: ai-agent-inbound-message-api-name
    desc: Chat-bot inbound-message API name
    crit: component
    conf: 0.86
    for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
    if:
      type: text
      regex: '(?i)\b(getUpdates|onText)\b'

  # `event_handler`/`eventHandler` was in this alternation and named nothing
  # about messaging: it is the universal callback noun of every UI, DOM and
  # framework bundle, so any page that also linked to a chat service (a social
  # share bar with telegram.me) read as an agent command channel.
  - id: ai-agent-message-receive-c
    desc: Agent incoming-message handler
    crit: component
    conf: 0.86
    for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
    if:
      type: text
      regex: '(?i)\b(incoming[_-]?message|receive[_-]?message)\b'

  - id: ai-agent-shell-command-allowlist
    desc: AI agent shell command allowlist
    crit: notable
    conf: 0.92
    ref: sha256:ffbf482c4b6c5a57944da3576001f383e4cb61bce3ed008b813487357e49e107
    if:
      type: text
      regex: 'Bash\([A-Za-z0-9_.-]{1,48}:\*\)'

  - id: ai-agent-unrestricted-shell-allowlist
    desc: AI agent unrestricted shell allowlist
    crit: notable
    conf: 0.98
    for: [github-actions, javascript, typescript, json, shell, python]
    if:
      type: text
      regex: 'Bash\(\s*:\s*\*\s*\)'

  - id: codex-dangerous-sandbox-bypass-flag
    desc: Codex sandbox bypass flag
    crit: notable
    conf: 0.97
    ref: sha256:32f1acd36984e7f7bd66b06d4185afa42fcf696bad4378aecf4b3bc8dfdab654
    if:
      type: text
      substr: --dangerously-bypass-approvals-and-sandbox
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures

  - id: codex-full-access-sandbox-mode
    desc: Codex full-access sandbox mode
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'sandbox_mode["'']?\s*[=:]\s*["'']danger-full-access'

  - id: codex-never-approval-policy
    desc: Codex command approvals disabled
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'approval_policy["'']?\s*[=:]\s*["'']never'

  - id: codex-full-auto-approval-mode
    desc: Codex full-auto approval mode
    crit: notable
    conf: 0.96
    ref: sha256:b92af7e8379fba6a66eb7b99e4db29eacd6040b05abd2b8e0373eaf43dce92b0
    if:
      type: text
      regex: '["'']--approval-mode["'']\s*,[\s\S]{0,80}["'']full-auto["'']'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures

  # An AI-agent permission-bypass flag is a documented mode of the agents
  # themselves (Claude Code `--dangerously-skip-permissions`, CodeWhale `--yolo`).
  # As a bare capability it is notable; the abuse signal is the composite that
  # combines it with a scripted/non-interactive agent invocation.
  - id: ai-agent-dangerous-permission-flag
    desc: AI agent permission bypass flag
    crit: notable
    conf: 0.96
    ref: sha256:32f1acd36984e7f7bd66b06d4185afa42fcf696bad4378aecf4b3bc8dfdab654
    if:
      type: text
      regex: '(--dangerously-skip-permissions|--yolo|--trust-all-tools)'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures

  # Hermes exposes this as a configuration value rather than a CLI flag. Keep
  # the atom language-neutral so future agent frameworks using the same
  # unattended approval convention are covered without naming Hermes.
  - id: ai-agent-yolo-approval-setting
    desc: AI agent unattended YOLO approval setting
    crit: notable
    conf: 0.96
    for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
    if:
      type: text
      regex: '(?i)approval[_-]?mode.{0,12}yolo\b'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures

  # Hermes documents the same approval bypass as an environment setting or a
  # slash command. Keep these as neutral agent capabilities; the objective
  # layer decides when the unattended mode is being used offensively.
  - id: ai-agent-yolo-environment-setting
    desc: AI agent YOLO environment setting
    crit: notable
    conf: 0.96
    for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
    if:
      type: text
      regex: '(?i)\b[A-Z][A-Z0-9_]*_YOLO_MODE\b'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures

  - id: ai-agent-yolo-slash-command
    desc: AI agent YOLO slash command
    crit: notable
    conf: 0.95
    for: [python, javascript, typescript, shell, powershell, go, rust, java, json]
    if:
      type: text
      regex: '(?m)(^|[\s"''`])/(yolo)($|[\s"''`])'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures

  - id: claude-cli-literal
    desc: Claude CLI command token
    crit: component
    conf: 0.88
    size_max: 1000000
    if:
      type: text
      regex: '(^|[\s"''`(\[{;|&])claude([\s"''`\])};|&]|$)'

  - id: claude-print-flag
    desc: Claude CLI print mode flag
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bclaude\b[^\n\r;&|]{0,120}(^|[[:space:]])(--print|-p)([[:space:]]|$)'

  - id: claude-settings-flag
    desc: Claude CLI settings flag
    crit: component
    conf: 0.9
    if:
      type: text
      substr: --settings

  - id: claude-stream-json-mode
    desc: Claude stream JSON mode
    crit: component
    conf: 0.9
    if:
      type: text
      substr: stream-json
  - id: claude-runtime-cli-provision-call
    desc: Ensures Claude runtime CLI availability
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: ensureClaude
  - id: claude-runtime-process-launcher-reference
    desc: References Claude runtime process launcher
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: symbol
      kind: identifier
      regex: '^spawnClaude(Bidirectional)?$'
  - id: ai-agent-dangerously-skip-permissions-setting
    desc: AI agent skips dangerous permission prompts
    crit: notable
    conf: 0.96
    attack: ''
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)["'']dangerouslySkipPermissions["'']\s*:\s*(true|!!\[\])'
  - id: python-llm-agent-command-builder
    desc: Python LLM agent command builder
    crit: component
    conf: 0.92
    for: [python]
    ref: sha256:32f1acd36984e7f7bd66b06d4185afa42fcf696bad4378aecf4b3bc8dfdab654
    if:
      type: text
      regex: 'def\s+_build_(claude|codex|ollama)_command\s*\('
  - id: python-invoke-claude-call
    desc: Python invoke Claude call
    crit: component
    conf: 0.9
    for: [python]
    ref: sha256:32f1acd36984e7f7bd66b06d4185afa42fcf696bad4378aecf4b3bc8dfdab654
    if:
      type: symbol
      kind: call
      exact: invoke_claude
  - id: opencode-cli-token
    desc: OpenCode CLI command token
    crit: component
    conf: 0.88
    if:
      type: text
      word: opencode
      case_insensitive: true
  - id: opencode-server-command
    desc: OpenCode server command
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '\bopencode\s+server\b'
      case_insensitive: true
  - id: opencode-server-listening
    desc: OpenCode server startup output
    crit: component
    conf: 0.95
    if:
      type: text
      substr: opencode server listening
      case_insensitive: true
  - id: python-llm-runner-class
    desc: Python LLM runner class
    crit: component
    conf: 0.92
    for: [python]
    ref: sha256:cb80b116928df7b01cff82895a0df1ed6cad5e7898ed431bf9d4ddc4dbaf7cc0
    if:
      type: text
      regex: 'class\s+\w*Runner\s*\(\s*LLMRunner\s*\)'
  - id: python-agent-command-config
    desc: Python agent command config
    crit: component
    conf: 0.9
    for: [python]
    ref: sha256:cb80b116928df7b01cff82895a0df1ed6cad5e7898ed431bf9d4ddc4dbaf7cc0
    if:
      type: symbol
      kind: call
      exact: self.config.get
      arg:
        kind: string
        exact: command
  - id: python-agent-command-template-format
    desc: Python agent command template formatting
    crit: component
    conf: 0.92
    for: [python]
    ref: sha256:cb80b116928df7b01cff82895a0df1ed6cad5e7898ed431bf9d4ddc4dbaf7cc0
    if:
      type: symbol
      kind: call
      exact: command_template.format
  - id: python-agent-run-command-wrapper
    desc: Python agent run command wrapper
    crit: component
    conf: 0.9
    for: [python]
    ref: sha256:cb80b116928df7b01cff82895a0df1ed6cad5e7898ed431bf9d4ddc4dbaf7cc0
    if:
      type: symbol
      kind: call
      exact: self._run_command

  # Agent frameworks can turn an otherwise empty method body into a
  # model-driven execution loop. The ellipsis is meaningful only as a method
  # body on a class whose base name identifies it as an Agent.
  - id: python-agentic-ellipsis-method
    desc: Agent method delegated to runtime model
    crit: notable
    conf: 0.97
    for: [python]
    attack: T1059.006
    if:
      type: tree-sitter
      language: python
      query: |
        (class_definition
          superclasses: (argument_list
            (identifier) @base
            (#match? @base "(?i)agent$"))
          body: (block
            (function_definition
              name: (identifier) @method
              body: (block
                (expression_statement
                  (ellipsis))))))

composite_rules:
  - id: ai-agent-unattended-execution-setting
    desc: AI agent unattended execution setting
    crit: notable
    conf: 0.94
    all:
      - id: ai-agent-unattended-execution-key
      - id: ai-agent-unattended-execution-value
    near_lines: 10

  - id: ai-agent-response-storage-disabled
    desc: AI agent disables response storage
    crit: notable
    conf: 0.94
    all:
      - id: ai-agent-response-storage-disable-key
      - id: ai-agent-response-storage-disable-value
    near_lines: 1

  - id: ai-agent-chat-endpoint
    desc: Agent external chat endpoint
    crit: component
    conf: 0.88
    any:
      - id: ai-agent-chat-endpoint-a
      - id: ai-agent-chat-endpoint-b
      - id: ai-agent-chat-endpoint-c

  - id: ai-agent-message-receive-operation
    desc: Agent receives chat commands
    crit: component
    conf: 0.86
    any:
      - id: ai-agent-inbound-message-api-name
      - id: micro-behaviors/communications/http/webhook::webhook-configuration-key
      - id: micro-behaviors/communications/http/webhook::webhook-registration-call
      - id: micro-behaviors/communications/http/webhook::webhook-route-declaration
      - id: ai-agent-message-receive-c

  - id: ai-agent-terminal-tool-setting
    desc: Agent terminal tool configuration
    crit: notable
    conf: 0.92
    for: [scripts, source, json]
    all:
      - id: ai-agent-tools-key
    any:
      - id: ai-agent-terminal-tool-name
      - id: ai-agent-shell-tool-name
      - id: ai-agent-command-tool-name
    near_lines: 6

  - id: ai-agent-messaging-gateway-setting
    desc: Agent messaging gateway configuration
    crit: notable
    conf: 0.92
    for: [scripts, source, json]
    all:
      - id: ai-agent-gateway-key
    any:
      - id: ai-agent-control-channel-key
      - id: ai-agent-chat-platform-a
      - id: ai-agent-chat-platform-b
      - id: ai-agent-signal-platform
      - id: ai-agent-email-channel
      - id: micro-behaviors/communications/http/webhook::webhook-configuration-key
      - id: micro-behaviors/communications/http/webhook::webhook-registration-call
      - id: micro-behaviors/communications/http/webhook::webhook-route-declaration
    # A minified bundle may be one multi-megabyte line. Byte proximity keeps
    # unrelated payment gateway settings and chat integrations from joining.
    near_bytes: 800

  # Proximity is in bytes, not lines: a minified bundle is a handful of
  # 700 KB lines, so `near_lines` put the whole file in one window and let a
  # chat URL anywhere pair with a receive verb anywhere.
