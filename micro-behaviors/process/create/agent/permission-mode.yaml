# An explicit mode/value pair, rather than the bare option that also selects
# guarded modes. This records command text, including launcher argv templates;
# it does not establish that the command runs or that the mode is unauthorized.
defaults:
  platforms: [unix, windows]
  for: [shell, powershell, batch, javascript, typescript, python]
  crit: notable
  conf: 0.97

traits:
  - id: ai-agent-bypass-permissions-option
    desc: Agent command option selects bypassPermissions
    if:
      type: text
      regex: '--permission-mode[ \t=]+bypassPermissions\b'
