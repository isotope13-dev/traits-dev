# Neutral mechanics used by agentic CI runners.  Intent is inferred only when
# the agent has a broad tool configuration and a Git hook can execute code.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059

traits:
  - id: agent-capability-configuration
    desc: Agent capability configuration object
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: CapabilitiesConfig

  - id: agent-command-policy-deny
    desc: Agent denies run-command tool calls
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: policy.deny
      arg:
        kind: string
        exact: run_command

  - id: agent-vcs-command-allowlist
    desc: Agent command policy allows Git tools
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'tokens\s*\[\s*0\s*\]\s+in\s+\{\s*["'']gh["'']\s*,\s*["'']git["'']\s*\}'

  - id: agent-git-hooks-directory
    desc: Agent constructs a Git hooks directory
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)(os\.path\.join|pathlib\.Path)\([^\n]{0,80}["'']\.git["''][^\n]{0,80}["'']hooks["'']'

  - id: agent-git-hooks-path-setting
    desc: Agent sets Git hooksPath configuration
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)subprocess\.run\([^\n]{0,180}core\.hooksPath'

  # Two atoms left this file because their matchers were universal filesystem
  # and environment capabilities wearing agent-hook names:
  #   agent-executable-hook-write (os.chmod mode bits) ->
  #     micro-behaviors/fs/chmod/modify::python-chmod-call-with-exec-bit
  #   agent-hook-env-read (os.getenv) duplicated the canonical
  #     micro-behaviors/os/env/vars/access::python-os-getenv-call, which is a
  #     structured call matcher rather than a text regex.
  # The traits above are what actually make this file about agent runners.

composite_rules:
  # The credential leg is the canonical getenv-with-a-credential-name atom in
  # micro-behaviors/os/env/vars/credentials. It replaces a local regex that
  # matched any uppercase identifier containing TOKEN/KEY/SECRET anywhere in the
  # file — a description ("CI credential-like identifier") its matcher never
  # supported, and which fired on ordinary constants such as an Odoo unit test's
  # `eprel_api_key = "FAKE_KEY"`, on PRIMARY_KEY, and on MONKEY.
  - id: agent-hook-reads-ci-secret
    desc: Hook reads a CI credential variable
    crit: notable
    conf: 0.97
    near_lines: 16
    all:
      - id: agent-git-hooks-directory
      - id: micro-behaviors/os/env/vars/access::python-os-getenv-call
    any:
      - id: micro-behaviors/os/env/vars/credentials::python-env-keyword-key
      - id: micro-behaviors/os/env/vars/credentials::python-env-keyword-token
      - id: micro-behaviors/os/env/vars/credentials::python-env-keyword-secret
