# Neutral mechanics used by agentic CI runners.  Intent is inferred only when
# the agent has a broad tool configuration and a Git hook can execute code.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1059

traits:
  - id: agent-capability-configuration
    desc: Agent capability configuration object
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: CapabilitiesConfig

  - id: agent-command-policy-deny
    desc: Agent denies run-command tool calls
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: policy.deny
      arg:
        kind: string
        exact: run_command

  - id: agent-vcs-command-allowlist
    desc: Agent command policy allows Git tools
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'tokens\s*\[\s*0\s*\]\s+in\s+\{\s*["'']gh["'']\s*,\s*["'']git["'']\s*\}'

  - id: agent-git-hooks-directory
    desc: Agent constructs a Git hooks directory
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)(os\.path\.join|pathlib\.Path)\([^\n]{0,80}["'']\.git["''][^\n]{0,80}["'']hooks["'']'

  - id: agent-git-hooks-path-setting
    desc: Agent sets Git hooksPath configuration
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)subprocess\.run\([^\n]{0,180}core\.hooksPath'

  - id: agent-executable-hook-write
    desc: Agent writes an executable hook
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)os\.chmod\([^\n]{0,100}0o?7(55|75)\b'

  - id: agent-hook-env-read
    desc: Hook reads an environment variable
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\b(os\.getenv|getenv)\s*\('

  - id: agent-hook-ci-secret-name
    desc: Uppercase CI credential-like identifier
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\b[A-Z][A-Z0-9_]*(TOKEN|KEY|SECRET)[A-Z0-9_]*\b'
    not:
      # Product API-key env vars in docs/setup text, not CI hook secrets.
      - regex: '(?i)\b[A-Z][A-Z0-9_]*API_KEY\b'

composite_rules:
  - id: agent-hook-reads-ci-secret
    desc: Hook reads a CI credential variable
    crit: notable
    conf: 0.97
    near_lines: 16
    all:
      - id: agent-git-hooks-directory
      - id: agent-hook-env-read
      - id: agent-hook-ci-secret-name
