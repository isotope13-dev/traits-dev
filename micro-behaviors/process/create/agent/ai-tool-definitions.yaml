# Agent tool registrations describe capabilities supplied to an orchestrator.
# The capabilities are dual-use; hostile conclusions require an objective
# context such as an external command channel or offensive tasking.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  # Function-tool schemas are an agent capability declaration, not evidence
  # of an HTTP client or an OpenAI dependency.  Keep the atom with agent
  # construction so callers can combine it with an execution channel.
  - id: agent-function-tool-schema
    desc: Agent function-tool registration schema
    crit: notable
    conf: 0.9
    for: [python, javascript, typescript, json]
    if:
      type: text
      regex: '["'']type["'']\s*:\s*["'']function["''][\s\S]{0,180}["'']function["'']\s*:'

  - id: python-agent-run-command-name
    desc: Python agent run-command tool name
    crit: component
    conf: 0.9
    if:
      type: literal
      exact: run_command

  - id: python-agent-shell-command-desc
    desc: Python agent shell-command description
    crit: component
    conf: 0.9
    if:
      type: literal
      exact: Execute shell command

  - id: python-agent-run-command-function
    desc: Python agent run-command binding
    crit: component
    conf: 0.9
    if:
      type: text
      substr: function=run_command

  - id: python-agent-python-repl-name
    desc: Python agent Python REPL name
    crit: component
    conf: 0.9
    if:
      type: literal
      exact: python_repl

  - id: python-agent-python-code-desc
    desc: Python agent Python-code description
    crit: component
    conf: 0.9
    if:
      type: literal
      substr: Execute Python code

  - id: python-agent-python-repl-function
    desc: Python agent Python REPL binding
    crit: component
    conf: 0.9
    if:
      type: text
      substr: function=python_repl

composite_rules:
  - id: python-agent-shell-command-tool
    desc: Python agent exposes a shell-command tool
    crit: notable
    conf: 0.95
    all:
      - id: python-agent-run-command-name
      - id: python-agent-shell-command-desc
      - id: python-agent-run-command-function
    near_bytes: 700

  - id: python-agent-python-repl-tool
    desc: Python agent exposes a Python REPL tool
    crit: notable
    conf: 0.95
    all:
      - id: python-agent-python-repl-name
      - id: python-agent-python-code-desc
      - id: python-agent-python-repl-function
    near_bytes: 900
