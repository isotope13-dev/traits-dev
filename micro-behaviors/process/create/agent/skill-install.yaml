defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell, package.json]

traits:
  # This explicit agent command is not evidence that it runs from a
  # lifecycle hook. Supply-chain objectives add the postinstall context.
  - id: npx-skills-add-global-command-text
    desc: Invokes global AI skill installation via npx
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bnpx\s+(-y\s+)?skills\s+add\b.{0,160}(--global|-g)\b'
