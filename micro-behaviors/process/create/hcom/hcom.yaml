# hcom product-identity strings (macOS PTY/relay binary), consumed by
# well-known/app/hcom::hcom-terminal-relay-binary.
#
# These stay here rather than moving into well-known/app/hcom/: that tier
# requires a `section:` filter on binary string matches, and pinning a Mach-O
# section for CLI help text and Rust source paths without an hcom binary to
# test against would risk a silently dead identity. They are the only traits
# left in this directory -- the regsvr32 / radare2 / readelf+md5sum /
# mspaint+explorer matchers that used to sit alongside them (all generic, none
# hcom's) moved to process/create/launch, /radare2 and /unix-utils in 2026-07.
defaults:
  platforms: [macos]
  for: [macho]
  size_min: 1000000
  size_max: 25000000
  crit: component
  conf: 0.96

traits:
  - id: hcom-pty-wrapper
    desc: hcom PTY wrapper text
    if:
      type: text
      substr: "hcom pty - PTY wrapper for hcom"

  - id: hcom-relay-cli
    desc: hcom relay CLI text
    if:
      type: text
      substr: "hcom relay - Cross-device sync via MQTT pub/sub"

  - id: hcom-pty-source-path
    desc: hcom PTY Rust source path
    if:
      type: text
      substr: "src/pty/mod.rs"

  - id: hcom-relay-source-path
    desc: hcom relay Rust source path
    if:
      type: text
      substr: "src/relay/client.rs"

  - id: hcom-launch-source-path
    desc: hcom launch Rust source path
    if:
      type: text
      substr: "src/commands/launch.rs"
