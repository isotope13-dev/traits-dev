defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable
  conf: 0.9

composite_rules:
- id: wmi-hidden-process-create
  desc: WMI process creation and hidden-window clues
  crit: notable
  conf: 0.97
  attack: T1564.003,T1047
  for: [javascript, vbs]
  # Obfuscators can insert a long reconstructed class name between the
  # startup instance and Create call; the composite still requires both WMI
  # startup markers and the hidden-window setting.
  near_bytes: 20000
  all:
  - id: micro-behaviors/process/create/wmi::wmi-process-create-call
  - id: micro-behaviors/process/create/wmi::wmi-startup-hidden-window-text
