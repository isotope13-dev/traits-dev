defaults:
  for: [vbs]
  platforms: [windows]
  crit: notable
  conf: 0.9
  attack: T1047
traits:
  - id: win32-process-create
    desc: WMI Win32_Process.Create call
    conf: 0.94
    if:
      type: text
      regex: (?i)Win32_Process.{0,20}\.Create
composite_rules:
  - id: vba-wmi-process-launch
    desc: VBA WMI process creation
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/os/wmi/query::getobject-winmgmts
      - id: micro-behaviors/process/create/wmi::win32-process-create
