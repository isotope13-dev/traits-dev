defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
composite_rules:
  - id: powershell-wmi-hidden-encoded-process-create
    desc: WMI process creation with hidden encoded PowerShell command text
    conf: 0.98
    all:
      - id: micro-behaviors/process/create/wmi::powershell-wmi-win32-process-create-any
      - id: metadata/lang/source/syntax/argument::encodedcommand-flag-native
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
  - id: powershell-wmi-commandline-sweep-create
    desc: Command-line-filtered process termination and hidden WMI process creation
    conf: 0.95
    all:
      - id: micro-behaviors/process/terminate/kill::wmi-commandline-filtered-process-kill
      - id: micro-behaviors/process/create/wmi::powershell-wmi-win32-process-create-any
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
