defaults:
  platforms: [windows]
  conf: 0.9
  for: [powershell, batch, vbs]
  attack: T1047
traits:
  - id: create-process-wmi-cmdlet
    desc: Invoke-WmiMethod creates a Win32_Process
    crit: notable
    conf: 0.96
    for: [powershell, batch, pe, dll]
    if:
      type: text
      regex: '(?i)\bInvoke-WmiMethod\b[^\r\n]{0,220}\bWin32_Process\b[^\r\n]{0,90}Create'

  - id: create-process-cim-cmdlet
    desc: Invoke-CimMethod creates a Win32_Process
    crit: notable
    conf: 0.96
    for: [powershell, batch, pe, dll]
    if:
      type: text
      regex: '(?i)\bInvoke-CimMethod\b[^\r\n]{0,220}\bWin32_Process\b[^\r\n]{0,90}Create'

  - id: powershell-wmiclass-process-create
    desc: Creates a process via [wmiclass] Win32_Process
    crit: notable
    conf: 0.96
    for: [powershell]
    if:
      type: text
      exclude_comments: true
      regex: '(?is)\[wmiclass\]\s*[''"]Win32_Process[''"][\s\S]{0,180}\.\s*Create\s*\('

  - id: powershell-get-wmiobject-process-create
    desc: Spawns a process via Get-WmiObject Win32_Process
    crit: notable
    conf: 0.96
    for: [powershell]
    if:
      type: text
      exclude_comments: true
      regex: '(?is)Get-WmiObject\b[^\r\n]{0,120}\bWin32_Process\b[\s\S]{0,180}\.\s*Create\s*\('

composite_rules:
  - id: powershell-wmi-win32-process-create-any
    desc: Creates a Win32_Process through PowerShell WMI or CIM
    crit: notable
    conf: 0.96
    for: [powershell]
    any:
      - id: powershell-wmiclass-process-create
      - id: powershell-get-wmiobject-process-create
      - id: create-process-wmi-cmdlet
      - id: create-process-cim-cmdlet
