defaults:
  platforms: [windows]
  conf: 0.9
  for: [powershell, batch, vbs]
  attack: T1047
traits:
  - id: create-process-wmi-cmdlet
    desc: Invoke-WmiMethod creates a Win32_Process
    crit: notable
    conf: 0.96
    for: [powershell, batch, pe, dll]
    if:
      type: text
      regex: '(?i)\bInvoke-WmiMethod\b[^\r\n]{0,220}\bWin32_Process\b[^\r\n]{0,90}Create'

  - id: create-process-cim-cmdlet
    desc: Invoke-CimMethod creates a Win32_Process
    crit: notable
    conf: 0.96
    for: [powershell, batch, pe, dll]
    if:
      type: text
      regex: '(?i)\bInvoke-CimMethod\b[^\r\n]{0,220}\bWin32_Process\b[^\r\n]{0,90}Create'
