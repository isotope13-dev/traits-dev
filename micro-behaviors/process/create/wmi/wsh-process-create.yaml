defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable
  conf: 0.9
traits:
- id: wmi-process-create-call
  desc: Win32_Process Get result invokes Create
  crit: notable
  conf: 0.96
  attack: T1047
  for: [javascript, vbs]
  if:
    type: text
    # Require the specific process class in the Get(...).Create(...) chain;
    # generic service locators such as injector.get(...).create() are not WMI.
    regex: '(?i)\.\s*Get\s*\(\s*["\x27]Win32_Process["\x27]\s*\)\s*\.\s*Create\s*\('
