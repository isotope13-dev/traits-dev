defaults:
  platforms: [windows]
  for: [javascript]
  crit: notable
traits:
  - id: js-wmi-process-create
    desc: Calls Create on locally bound Win32_Process
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((_
          (variable_declaration
            (variable_declarator name: (identifier) @process
              value: (call_expression
                function: (member_expression property: (property_identifier) @get)
                arguments: (arguments (string (string_fragment) @class)))))
          . (comment)* . [
            (expression_statement
              (call_expression
                function: (member_expression
                  object: (identifier) @receiver
                  property: (property_identifier) @create)))
            (variable_declaration
              (variable_declarator value: (call_expression
                function: (member_expression
                  object: (identifier) @receiver
                  property: (property_identifier) @create))))
          ]) @handoff
          (#eq? @get "Get")
          (#eq? @class "Win32_Process")
          (#eq? @create "Create")
          (#eq? @process @receiver))
