defaults:
  platforms: [windows]
  for: [vbs]
traits:
- id: vbs-wmi-process-create
  desc: VBScript WMI process launcher
  crit: notable
  conf: 0.88
  if:
    type: text
      # A bare winmgmts moniker is reconnaissance or dead pasted sample code,
      # not a launch. Require the Win32_Process Create call that actually
      # starts the child process.
    regex: '(?is)Win32_Process.{0,400}\.Create\b\s*(\(|["'']|\w)'
