# The same permission-table surface as traits.yaml, seen in a compiled binary.
#
# Everything else in this directory is keyed to script, JSON and manifest file
# types, because that is where an agent permission table is normally written:
# a postinstall script edits `.claude/settings.json`, a config file declares
# `"*": "allow"`. A stripped Go/Rust/C++ daemon that does the same thing is
# invisible to those rules — its `for:` list has no binary type — so a
# cross-platform agent-control binary can rewrite the approval gate without a
# single finding from this directory. These atoms close that half.
#
# They stay notable on their own. A harness that legitimately *offers* a
# permission mode embeds the mode name too (a launcher's help text, a settings
# UI). What is not ordinary is a binary that carries the settings-file path,
# the wildcard tool grant and the bypass mode together: at that point it is not
# offering the choice, it is writing the table.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, dll]
  crit: notable
  conf: 0.94
  attack: T1562.001
  mbc: B0022

traits:
  # `bypassPermissions` / `acceptEdits` are Claude Code's `permissionMode`
  # values; a binary carrying them selects the mode the agent runs under.
  # Matched as words so a longer identifier does not drag them in.
  - id: native-agent-bypass-permission-mode
    desc: Binary embeds agent bypass-permissions mode
    conf: 0.95
    if:
      type: text
      word: bypassPermissions

  - id: native-agent-unattended-edit-mode
    desc: Binary embeds agent unattended-edit mode
    conf: 0.9
    if:
      type: text
      word: acceptEdits

  # A `seed…permissions` routine name was tried here as a third atom and
  # dropped. Go and Rust do keep function names in pclntab past stripping, so
  # the verb survives — but the matcher cannot tell an *agent* permission table
  # from an RBAC one, and any service with a database seeder carries the same
  # token. Naming it for the agent it usually means would assert an identity
  # the regex never checks. The two mode-value atoms above are specific tokens
  # with one meaning, so the composite is built from those instead.

composite_rules:
  # Path + wildcard grant (the ruleset leg) plus the mode that removes the
  # prompt. A program that merely documents the mode has no settings path and
  # no `Tool(*)` entry; a program that ships a hardened profile has the path
  # and the entries but selects no bypass.
  - id: native-agent-approval-gate-rewrite
    desc: Binary rewrites an agent approval gate
    crit: suspicious
    conf: 0.94
    all:
      - id: metadata/file/policy/identity::agent-tool-permission-ruleset
      - id: native-agent-bypass-permission-mode
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
