defaults:
  platforms:
  - windows
  for:
  - lnk
  crit: notable
composite_rules:
- id: lnk-command-execution-references
  desc: LNK command execution references
  conf: 0.85
  any:
  - id: micro-behaviors/process/create/shortcut::lnk-cmd-echo
  - id: micro-behaviors/process/create/shortcut::lnk-cmd-start
  - id: micro-behaviors/os/env/runtime::lnk-comspec-environment-reference
  - id: micro-behaviors/process/create/shortcut::lnk-assembly-load
  - id: micro-behaviors/process/create/shortcut::lnk-reflection-assembly
  - id: micro-behaviors/os/wmi/manipulate::lnk-wmi-process
  - id: micro-behaviors/process/create/shortcut::lnk-writealltext-and-call-operator
- id: lnk-http-and-execution-references
  desc: LNK HTTP and execution references co-occur
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/client/reference::lnk-http-client-references
  - id: micro-behaviors/process/create/shortcut::lnk-command-execution-references
