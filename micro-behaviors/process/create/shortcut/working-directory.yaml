# A configured path alone does not identify a builder or staging operation.
defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-short-d-z-working-directory
    desc: LNK short working directory on D-Z drive
    crit: notable
    conf: 0.85
    if:
      type: value
      path: lnk.working_directory
      regex: '(?i)^[D-Z]:\\[a-z0-9]{1,8}\\?$'
