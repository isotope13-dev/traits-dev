defaults:
  platforms:
  - windows
  for:
  - lnk
  crit: notable
traits:
- id: lnk-assembly-load
  desc: LNK references Assembly.Load
  conf: 0.9
  if:
    type: text
    regex: Assembly\.Load
    case_insensitive: true
- id: lnk-reflection-assembly
  desc: LNK references the Reflection.Assembly type
  conf: 0.9
  if:
    type: text
    regex: \[Reflection\.Assembly\]
    case_insensitive: true
