defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: powershell-in-args
    desc: LNK arguments begin with powershell
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: lnk.arguments
      regex: ^powershell\b
      case_insensitive: true
  - id: rundll32-ordinal-argument
    desc: LNK rundll32 ordinal argument
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\brundll32(\.exe)?\s+[^\s,]{1,260},\s*#\d+\b'

composite_rules:
  - id: conhost-powershell-proxy
    desc: LNK uses conhost.exe to proxy PowerShell
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/shortcut::lnk-conhost-target
      - id: micro-behaviors/process/create/shortcut::powershell-in-args
