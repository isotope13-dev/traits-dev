defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-args-command-chain-operator
    desc: LNK arguments chain shell commands
    crit: notable
    conf: 0.9
    if:
      type: value
      path: lnk.arguments
      regex: '[\s"]&&?[\s"\w\\.%]'

  - id: lnk-args-msi-or-exe-stage
    desc: LNK arguments launch MSI or executable
    crit: notable
    conf: 0.92
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)(^|[\s"&|])[^\s"&|]{1,80}\.(msi|exe|scr)\b'

  - id: lnk-args-script-stage
    desc: LNK arguments launch batch or VBScript
    crit: notable
    conf: 0.92
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)(^|[\s"&|])[^\s"&|]{1,80}\.(bat|cmd|vbs)\b'

  - id: lnk-msi-package-argument
    desc: LNK arguments reference MSI package
    crit: notable
    conf: 0.94
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)(^|[\s"&|])[^\s"&|]{1,120}\.msi\b'

  - id: lnk-ftp-target
    desc: LNK targets Windows ftp.exe client
    crit: suspicious
    conf: 0.92
    attack: T1202
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)(^|[\\/])ftp\.exe$'

  - id: lnk-ftp-script-switch
    desc: LNK passes ftp.exe -s script switch
    crit: suspicious
    conf: 0.94
    attack: T1202
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)(^|\s)-s:\S+'

  - id: lnk-ftp-disguised-script-arg
    desc: LNK passes non-script file to ftp.exe
    crit: suspicious
    conf: 0.96
    attack: T1202,T1036.008
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)-s:[^\r\n"'']{1,120}\.(ico|png|jpg|log)\b'
