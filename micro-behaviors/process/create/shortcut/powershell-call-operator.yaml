# PowerShell's call operator runs whatever program path a variable holds.
# In shortcut arguments it launches a file the same command line computed
# or wrote, rather than a fixed target.
defaults:
  platforms: [windows]
  for: [lnk]
traits:
  - id: lnk-powershell-call-operator-variable-path
    desc: LNK PowerShell runs variable path via &
    crit: notable
    conf: 0.9
    attack: T1059.001
    if:
      type: value
      path: lnk.arguments
      regex: '(^|[;\r\n{(])\s*&\s*\$[A-Za-z_]\w*\s*(;|$|\r|\n)'
