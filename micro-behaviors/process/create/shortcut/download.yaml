# In-memory string-fetch calls inside shortcut arguments. A shortcut that
# pulls a remote string down with .NET APIs is staging content for
# execution, not opening a document; the objective composites add the
# execution and concealment legs that convict.
defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable
  attack: T1105

traits:
  # Besides the plain call, matchers name the observed quote-split spelling
  # ('Ge'+'tStringAsync'), the same way Start-Process split spellings are
  # named elsewhere: the split boundary moves per campaign, so each
  # observed spelling is an alternate rather than a generated pattern.
  # (WebClient.DownloadString is already covered by
  # micro-behaviors/communications/http/download/webclient::lnk-download-method.)
  - id: lnk-httpclient-getstringasync
    desc: LNK arguments call HttpClient GetStringAsync
    conf: 0.9
    if:
      type: value
      path: lnk.arguments
      regex: (?i)(\bGetStringAsync\s*\(|\('Ge'\s*\+\s*'tStringAsync'\)\s*\()
composite_rules:
  - id: lnk-dotnet-string-fetch
    desc: LNK arguments fetch a remote string via .NET
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/download/webclient::lnk-download-method
      - id: lnk-httpclient-getstringasync
