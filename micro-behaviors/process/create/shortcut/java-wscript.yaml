# Kotlin string templates hide WScript.Shell and CreateShortcut behind a
# leading control byte, so those calls are not searchable text. The special
# folder names used to find shared shortcuts are plain constants.
defaults:
  platforms: [windows]
  for: [class]
  crit: notable

traits:
  - id: java-common-desktop-directory
    desc: Java names the common desktop folder
    conf: 0.9
    if:
      type: text
      substr: CommonDesktopDirectory
  - id: java-common-programs-folder
    desc: Java names the common programs folder
    conf: 0.9
    if:
      type: text
      substr: CommonPrograms

composite_rules:
  - id: java-wscript-shortcut-update
    desc: Java locates shared shortcut folders
    conf: 0.9
    all:
      - id: java-common-desktop-directory
      - id: java-common-programs-folder
