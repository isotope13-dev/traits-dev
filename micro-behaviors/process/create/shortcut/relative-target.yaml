# LNK targets with executable extensions. This is a neutral observation;
# objective rules must add execution or lure context before escalating it.
defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable
  attack: T1204.002

traits:
- id: lnk-relative-binary-target
  desc: LNK relative target has binary extension
  conf: 0.95
  if:
    type: value
    path: lnk.relative_path
    regex: '(?i)\.(exe|dll|scr)$'
- id: lnk-relative-command-target
  desc: LNK relative target has command extension
  conf: 0.95
  if:
    type: value
    path: lnk.relative_path
    regex: '(?i)\.(bat|cmd)$'
- id: lnk-relative-script-target
  desc: LNK relative target has script extension
  conf: 0.95
  if:
    type: value
    path: lnk.relative_path
    regex: '(?i)\.(js|jse|vbs)$'
- id: lnk-relative-script-host-target
  desc: LNK relative target has script-host extension
  conf: 0.95
  if:
    type: value
    path: lnk.relative_path
    regex: '(?i)\.(vbe|wsf|hta)$'

composite_rules:
- id: lnk-relative-executable-target
  desc: LNK relative target has executable extension
  crit: notable
  conf: 0.95
  any:
  - id: lnk-relative-binary-target
  - id: lnk-relative-command-target
  - id: lnk-relative-script-target
  - id: lnk-relative-script-host-target
