defaults:
  platforms: [unix, windows]
  for: [text, data, scripts, source]
  crit: notable
composite_rules:
  - id: mcp-stdio-program-registration
    desc: MCP registration specifies a stdio program
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/route::mcp-client-registration-post-request
      - id: micro-behaviors/communications/mcp::mcp-stdio-connection-type-field
      - id: micro-behaviors/communications/mcp::mcp-stdio-config-command-field
      - id: micro-behaviors/communications/mcp::mcp-stdio-config-args-field
    near_bytes: 2048
