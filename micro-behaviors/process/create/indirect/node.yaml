# Indirect Node process creation dispatch
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: indirect-spawn-dispatch
    desc: Indirect string-keyed spawn dispatch
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\s*\([^)(]{0,140}[''"]spawn[''"]\s*\)\s*\('
