# win.com is the 16-bit Windows launcher stub. Prefixing a command line with
# it makes win.com, not the caller, create the real child process, which is a
# long-standing way for IIS/ASP shells to reach cmd.exe when the web identity
# is not allowed to start it directly. Nothing in modern software launches
# programs this way, so the prefix is a behaviour worth surfacing on its own.
defaults:
  platforms: [windows]
  for: [vbs, batch, powershell, javascript, php, html, csharp]
  attack: T1059.003

traits:
  - id: win-com-launcher-prefix
    desc: Launches a program through the win.com stub
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\bwin\.com\s+[\w.\\/:-]{1,60}\.(exe|com|bat)\b'
      case_insensitive: true
