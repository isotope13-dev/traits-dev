defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-event-input-module-dispatch-output
    desc: Module dispatch relays event input and output
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (subscript_expression object: (identifier) @channel
            index: (string (string_fragment) @on))
          arguments: (arguments (_)
            (arrow_function parameter: (identifier) @input
              body: (statement_block
                (lexical_declaration (variable_declarator name: (identifier) @command
                  value: (call_expression function: (subscript_expression
                    object: (identifier) @input_used))))
                (expression_statement (call_expression
                  function: (subscript_expression object: (call_expression
                    arguments: (arguments . (identifier) @loader . (_))))
                  arguments: (arguments . (identifier) @command_used
                    . (arrow_function parameters: (formal_parameters
                      . (identifier) @error . (identifier) @stdout . (identifier) @stderr .)
                      body: (statement_block
                        (expression_statement (ternary_expression
                          condition: (identifier) @error_used
                          consequence: (call_expression function: (subscript_expression
                            object: (identifier) @out_error)
                            arguments: (arguments . (identifier) @stderr_used .))
                          alternative: (call_expression function: (subscript_expression
                            object: (identifier) @out_ok)
                            arguments: (arguments . (identifier) @stdout_used .)))))))))))))
          (#eq? @on "on") (#eq? @input @input_used)
          (#eq? @command @command_used) (#eq? @loader "require")
          (#eq? @channel @out_error) (#eq? @channel @out_ok)
          (#eq? @error @error_used) (#eq? @stderr @stderr_used) (#eq? @stdout @stdout_used))
