# Root-shell script literals are neutral execution capabilities. Cloud
# control-plane objectives add the remote API and target context.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: root-shell-script-literal
    desc: Root shell script literal
    if:
      type: literal
      regex: '(?i)\b(sudo\s+)?/bin/(ba)?sh\b|\bpowershell(\.exe)?\b'
