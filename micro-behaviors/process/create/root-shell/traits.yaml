defaults:
  platforms: [android]
  for: [kotlin]
  attack: T1059
  mbc: B0022

traits:
  - id: root-shell-helper-import-withnew
    desc: Kotlin imports withNewRootShell helper
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: import
      regex: 'withNewRootShell$'

  - id: root-shell-helper-import-create
    desc: Kotlin imports createRootShell helper
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: import
      regex: 'createRootShell$'

  - id: root-shell-helper-import-utils
    desc: Kotlin imports ShellUtils helper
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: import
      regex: 'ShellUtils$'

  - id: exec-function
    desc: Kotlin defines exec function
    crit: component
    conf: 0.88
    if:
      type: symbol
      kind: function
      exact: exec

  - id: root-shell-call-withnew
    desc: Kotlin calls withNewRootShell
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: withNewRootShell

  - id: root-shell-call-create
    desc: Kotlin calls createRootShell
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: createRootShell

composite_rules:
  - id: root-shell-helper-import
    desc: Kotlin root shell helper import
    crit: notable
    conf: 0.9
    any:
      - id: root-shell-helper-import-withnew
      - id: root-shell-helper-import-create
      - id: root-shell-helper-import-utils

  - id: root-shell-call
    desc: Kotlin root shell call
    crit: notable
    conf: 0.9
    any:
      - id: root-shell-call-withnew
      - id: root-shell-call-create
