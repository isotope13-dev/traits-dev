defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: shell-bang-true
    desc: Minified shell spawn option set to true
    crit: notable
    conf: 0.9
    attack: T1059
    if:
      type: text
      regex: 'shell\s*:\s*!\s*0'
  - id: detached-bang-true
    desc: Detached spawn minified true
    crit: notable
    conf: 0.86
    mbc: "F0011"
    attack: "T1059"
    if:
      type: text
      regex: 'detached\s*:\s*!\s*0\b'
  - id: detached-hex-true
    desc: Detached spawn hex true !0x0
    crit: notable
    conf: 0.86
    mbc: "F0011"
    attack: "T1059"
    if:
      type: text
      regex: 'detached\s*:\s*!0x0\b'
  - id: detached-double-bang-array-true
    desc: Detached spawn uses !![] true
    crit: notable
    conf: 0.86
    mbc: "F0011"
    attack: "T1059"
    if:
      type: text
      regex: 'detached\s*:\s*!\s*!\s*\[\s*\]'
  - id: node-obfuscated-detached-stdio-options
    desc: Detached spawn uses obfuscated stdio options
    crit: notable
    conf: 0.9
    mbc: "F0011"
    attack: "T1059"
    if:
      type: text
      regex: 'detached\s*:\s*!!\[\][\s\S]{0,180}stdio\s*:'
  - id: windowshide-bang-true
    desc: Minified windowsHide true option
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'windowsHide\s*:\s*!\s*0'
  - id: bundler-aliased-spawn-call
    desc: Bundled call of an imported spawn
    crit: component
    conf: 0.8
    # Bundlers invoke an imported function through the comma-operator idiom
    # `(0, ns.spawn)(...)`, where `ns` is the mangled module namespace (esbuild
    # emits two-letter names such as `Oh`). The parenthesised sequence
    # expression produces no call fact, and the alias carries no module name,
    # so on its own it proves nothing -- the composite binds it to an explicit
    # child_process import.
    if:
      type: text
      regex: '\(\s*0\s*,\s*[\w$]{1,24}\.spawn\s*\)\s*\('
composite_rules:
  - id: bundled-child-process-spawn
    desc: Bundled code spawns via child_process
    crit: notable
    conf: 0.9
    mbc: C0017
    attack: T1106
    all:
      - id: bundler-aliased-spawn-call
    any:
      - id: metadata/import/builtin::require-child-process
      - id: metadata/import/builtin::child-process-import-runtime
