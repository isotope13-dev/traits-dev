# IWR, AppData EXE path and Start-Process coexist within ten lines, but the
# matcher does not bind IWR's OutFile to Start-Process's target.
defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-appdata-iwr-start-profile
    desc: PowerShell IWR and AppData process-start clues
    crit: suspicious
    conf: 0.98
    near_lines: 10
    all:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/process/create/start-process::start-process-call
