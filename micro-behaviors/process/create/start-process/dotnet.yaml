defaults:
  platforms: [windows, unix]
  for: [csharp]

traits:
  - id: dotnet-process-object-creation
    desc: .NET creates a Process object
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\bnew\s+Process\s*\('

  - id: dotnet-process-instance-start-call
    desc: Starts a named .NET Process instance
    crit: component
    conf: 0.86
    if:
      type: symbol
      kind: call
      regex: '^(process|proc|p)\.Start$'

  - id: dotnet-process-start-info
    desc: .NET configures a process start descriptor
    crit: notable
    mbc: OB0006
    attack: T1059
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: CreateProcessStartInfo
  - id: create-process-api-import
    desc: C# imports the Windows CreateProcess API
    crit: notable
    conf: 0.86
    if:
      type: symbol
      exact: CreateProcess

composite_rules:
  - id: dotnet-process-instance-start
    desc: Executes a configured .NET Process instance
    crit: notable
    conf: 0.94
    near_bytes: 1200
    all:
      - id: dotnet-process-object-creation
      - id: dotnet-process-instance-start-call
