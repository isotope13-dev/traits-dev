# WinHTTP response handling and Start-Process coexist; the launched command
# is not shown to use the retrieved response.
defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: ps-winhttp-response-start-profile
    desc: PowerShell WinHTTP response and Start-Process clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
      - id: micro-behaviors/communications/http/client/response-body::response-body
      - id: micro-behaviors/process/create/start-process::start-process-call
    any:
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
      - id: micro-behaviors/process/create/exec::child-process-execution
