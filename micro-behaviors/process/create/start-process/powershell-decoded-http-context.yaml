# Fetch, decode, write and Start-Process coexist, but no response/write path
# is bound to the process target.
defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-http-decode-write-start-profile
    desc: PowerShell HTTP, decode, write and start clues
    crit: suspicious
    conf: 0.97
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
      - id: micro-behaviors/fs/write/file/full::write-all-bytes-ungated
      - id: micro-behaviors/process/create/start-process::start-process-call
    any:
      - id: micro-behaviors/data/decode/base64::powershell-frombase64string
      - id: micro-behaviors/crypto/symmetric/xor/loop::indexed-bxor-key-variable
      - id: micro-behaviors/crypto/symmetric/xor/loop::repeating-key-indexed-bxor-loader
