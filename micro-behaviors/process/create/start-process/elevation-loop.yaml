defaults:
  platforms: [windows]
  for: [powershell, batch, pe, dll, csharp, javascript]
  crit: suspicious
  conf: 0.98

traits:
  - id: powershell-loop-retries-elevation
    desc: Repeatedly requests process elevation in a loop
    if:
      type: text
      regex: '(?i)while\s*\(\$true\).{0,100}Start-Process.{0,100}-Verb\s+RunAs\b'
