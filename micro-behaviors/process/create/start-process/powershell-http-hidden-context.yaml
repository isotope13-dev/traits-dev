# URL/download and process-start facts coexist, but the Start-Process or saps
# argument is not bound to the downloaded EXE path.
defaults:
  platforms: [windows]
  for: [powershell]
  conf: 0.99

composite_rules:
  - id: powershell-hidden-executable-url-start-profile
    desc: Executable URL and hidden PowerShell process options
    crit: notable
    all:
      - id: micro-behaviors/process/create/hidden::powershell-windowstyle-hidden-option
      - id: micro-behaviors/communications/http/download/url::executable-url-reference-a
      - id: micro-behaviors/process/create/start-process::start-process-filepath
    unless:
      - id: metadata/build/recognized-contexts::sysmanage-prerequisite-installer-context
      - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context

  - id: powershell-hidden-iwr-exe-saps-profile
    desc: Hidden PowerShell EXE download and saps clues
    crit: suspicious
    all:
      - id: micro-behaviors/communications/http/download/cli::powershell-iwr-exe-to-temp
      - id: micro-behaviors/process/create/start-process::saps-alias
      - id: micro-behaviors/process/create/hidden::powershell-hidden-window
