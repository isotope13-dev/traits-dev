defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [lua]

traits:
  - id: lua-load
    desc: Lua dynamic code loading with load
    if:
      type: symbol
      exact: load
  - id: lua-loadstring
    desc: Lua dynamic code loading with loadstring
    if:
      type: symbol
      exact: loadstring

composite_rules:
  - id: lua-dynamic-load
    desc: Lua dynamic code loading
    any:
      - id: lua-load
      - id: lua-loadstring
