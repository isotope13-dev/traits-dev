# Interpreter launch and source/input clues are neutral on their own.
# Separate evidence establishes model context or hostile intent.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python, go, lua, shell, javascript, typescript, powershell, rust]
  attack: T1059

traits:
  - id: interpreter-name-a
    desc: Python subprocess references interpreter
    conf: 0.94
    for: [python]
    if:
      type: symbol
      kind: call
      exact: subprocess.run
      arg:
        kind: string
        regex: '(?i)^(lua|python3?|bash)(\.exe)?$'

  - id: interpreter-name-b
    desc: Python subprocess references interpreter
    conf: 0.92
    for: [python]
    if:
      type: symbol
      kind: call
      exact: subprocess.run
      arg:
        kind: string
        regex: '(?i)^(sh|node|ruby|perl)(\.exe)?$'

  - id: source-or-response-call-text
    desc: Process call names source or response
    conf: 0.92
    for: [javascript, typescript]
    if:
      # Keep the marker inside the call expression. A file-wide text search
      # misreads comments and template-string fixtures as live arguments.
      type: tree-sitter
      kind: call
      regex: '(?is)(child_process|cp)\.(exec|spawn)\s*\(.{0,120}\b(source|response)\b'

  - id: javascript-interpreter-name
    desc: JavaScript process call names Lua
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(child_process|cp)\.(spawn|exec)$'
      arg:
        kind: string
        exact: lua

composite_rules:
  - id: interpreter-name
    desc: Python subprocess names an interpreter
    conf: 0.95
    for: [python]
    any:
      - id: interpreter-name-a
      - id: interpreter-name-b

  - id: python-source-interpreter-input-clues
    desc: Interpreter launch near input-name text
    conf: 0.95
    for: [python]
    all:
      - id: interpreter-name
    any:
      - id: metadata/lang/source/syntax/assignment/value::python-model-response-input
      - id: metadata/lang/source/syntax/assignment/value::python-generated-input
      - id: metadata/lang/source/syntax/assignment/value::python-response-input
      - id: metadata/lang/source/syntax/assignment/value::python-source-input
    near_bytes: 600

  - id: javascript-lua-source-call-clues
    desc: Lua process near source-argument call
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: javascript-interpreter-name
      - id: source-or-response-call-text
    near_bytes: 600
