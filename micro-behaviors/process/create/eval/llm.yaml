# A model response passed directly to an interpreter is a neutral capability
# in an agent or automation tool.  Malicious conclusions belong in objectives.
defaults:
  platforms: [unix, windows]
  for: [python, go, lua, shell, javascript, typescript, powershell, rust]
  attack: T1059

traits:
  - id: python-interpreter-process-call
    desc: Python launches a child interpreter
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: symbol
      kind: call
      exact: subprocess.run
      arg:
        kind: string
        regex: '(?i)^(python|python3)(\.exe)?$'

  - id: interpreter-name-a
    desc: Python invokes a script interpreter
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: symbol
      kind: call
      exact: subprocess.run
      arg:
        kind: string
        regex: "(?i)^(lua|python3?|bash)$"

  - id: interpreter-name-b
    desc: Python invokes another interpreter
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: symbol
      kind: call
      exact: subprocess.run
      arg:
        kind: string
        regex: "(?i)^(sh|node|ruby|perl)$"

  - id: python-model-response-input
    desc: Python passes model response as input
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?i)\b(input|stdin)\s*=\s*(model_output|response_code)\b'

  - id: python-generated-input
    desc: Python passes generated text as input
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?i)\b(input|stdin)\s*=\s*generated\b'

  - id: python-response-input
    desc: Python passes response text as input
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '(?i)\b(input|stdin)\s*=\s*(response|output)\b'

  - id: python-source-input
    desc: Python passes source text as input
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '(?i)\b(input|stdin)\s*=\s*(source|script)\b'

  - id: go-interpreter-process-call
    desc: Go launches a child interpreter
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: symbol
      kind: call
      exact: exec.Command
      arg:
        kind: string
        regex: '(?i)^(lua|python3?|bash|sh|node|ruby|perl)(\.exe)?$'

  - id: go-model-response-argument
    desc: Go passes generated source to a process
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: text
      regex: '(?i)\b(model_output|luaSource|pythonSource|shellSource)\b'

  - id: generated-source-argument
    desc: Process call carries generated text
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      # Keep the marker inside the call expression. A file-wide text search
      # misreads comments and template-string fixtures as live arguments.
      type: tree-sitter
      kind: call
      regex: '(?is)(child_process|cp)\.(exec|spawn)\s*\(.{0,120}\b(source|response)\b'

  - id: javascript-interpreter-name
    desc: JavaScript process call names Lua
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(child_process|cp)\.(spawn|exec)$'
      arg:
        kind: string
        exact: lua

  - id: model-code-variable-a
    desc: Generated or returned source identifier
    crit: component
    conf: 0.9
    for: [python, go, lua, shell, javascript, typescript]
    if:
      # Identifier shape avoids comments and ordinary fields such as
      # `response_code` in generated API models.
      type: symbol
      kind: identifier
      regex: '(?i)^generated_(code|script|source)$'

  - id: model-code-variable-response
    desc: Returned source identifier
    crit: component
    conf: 0.9
    for: [python, go, lua, shell, javascript, typescript]
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^response_(script|source)$'

  - id: model-code-variable-c
    desc: Model output source identifier
    crit: component
    conf: 0.9
    for: [python, go, lua, shell, javascript, typescript]
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^model_(code|source|output)$'

  - id: model-code-variable-b
    desc: Model source code identifier
    crit: component
    conf: 0.9
    for: [python, go, lua, shell, javascript, typescript]
    if:
      type: symbol
      kind: identifier
      regex: '(?i)^(model_output|lua_source|python_source|shell_source)$'

  # These atoms describe the response-to-action boundary, not an LLM product.
  # A model response becoming a command is useful analyst evidence even when
  # the surrounding program is a legitimate coding or operations agent; the
  # offensive objective below adds the intent and autonomous-control context.
  - id: python-model-response-command
    desc: Python parses model response command
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?i)json\.loads\s*\(\s*response\s*\)[\s\S]{0,90}["'']command["'']'

  - id: javascript-model-response-command
    desc: JavaScript parses model response command
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)JSON\.parse\s*\(\s*response\s*\)[\s\S]{0,90}["'']command["'']'

  - id: go-model-response-command
    desc: Go parses model response command
    crit: notable
    conf: 0.94
    for: [go, rust]
    if:
      type: text
      regex: '(?i)json\.Unmarshal.{0,40}response[\s\S]{0,90}\bCommand\b'

  - id: python-generated-source-process
    desc: Python runs generated source in a process
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?i)subprocess\.(run|Popen)\s*\([\s\S]{0,90}\b(decoded|generated)[_-]?(source|code)\b'

  - id: javascript-generated-source-process
    desc: JavaScript runs generated source
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)child_process\.(exec|spawn)\s*\([\s\S]{0,90}\b(decoded|generated)[_-]?(source|code)\b'

  # LameHug-like malware does not need a JSON field named "command". It can
  # ask the model for an arbitrary command list, take the returned message
  # content, and concatenate that content into a shell invocation.
  - id: python-model-response-shell-command
    desc: Python shell call carries model output
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: '(?is)\bsubprocess\.run\s*\([^)]{0,180}\b(generated_command|model_response)\b'

  - id: javascript-model-response-shell-command
    desc: JavaScript shell call carries model output
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)\b(exec|spawn)\s*\(\s*(modelResponse|generatedCommand|modelOutput)\b'

  - id: go-model-response-shell-command
    desc: Go process call carries model output
    crit: notable
    conf: 0.95
    for: [go]
    if:
      type: text
      regex: '(?is)\bexec\.Command\s*\([^)]{0,180}\b(modelResponse|generatedCommand)\b'

  - id: powershell-model-response-command
    desc: PowerShell evaluates model output
    crit: notable
    conf: 0.95
    for: [powershell]
    if:
      type: text
      regex: '(?is)\b(Invoke-Expression|iex)\s+\$?(modelResponse|generatedCommand)\b'

composite_rules:
  - id: model-response-command-parse
    desc: Parses model response into a command
    crit: notable
    conf: 0.94
    any:
      - id: python-model-response-command
      - id: javascript-model-response-command
      - id: go-model-response-command

  - id: model-response-shell-command
    desc: Runs a shell command from model output
    crit: notable
    conf: 0.96
    any:
      - id: python-model-response-shell-command
      - id: javascript-model-response-shell-command
      - id: go-model-response-shell-command
      - id: powershell-model-response-command

  - id: model-response-generated-source-process
    desc: Runs generated model source
    crit: notable
    conf: 0.95
    any:
      - id: python-generated-source-process
      - id: javascript-generated-source-process

  - id: interpreter-name
    desc: Invokes a script interpreter
    crit: notable
    conf: 0.95
    for: [python, go]
    any:
      - id: interpreter-name-a
      - id: interpreter-name-b

  - id: python-model-response-interpreter
    desc: Python launches interpreter with model response
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: python-interpreter-process-call
      - id: interpreter-name
    any:
      - id: python-model-response-input
      - id: python-generated-input
      - id: python-response-input
      - id: python-source-input
    near_bytes: 600

  - id: go-model-response-interpreter
    desc: Go launches interpreter with model response
    crit: notable
    conf: 0.95
    for: [go]
    all:
      - id: go-interpreter-process-call
    any:
      - id: go-model-response-argument
    near_bytes: 1200

  - id: javascript-model-response-interpreter
    desc: JavaScript runs generated source through Lua
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: javascript-interpreter-name
      - id: generated-source-argument
    near_bytes: 600

  - id: model-response-eval
    desc: Evaluates model response as source code
    crit: notable
    conf: 0.94
    # `loadstring` is Lua's compile-a-string primitive; use the canonical Lua
    # atom rather than a case-insensitive text regex, which also swallowed
    # unrelated member calls such as Flutter's `rootBundle.loadString(path)`.
    for: [lua]
    all:
      - id: lua-loadstring
    any:
      - id: model-code-variable-a
      - id: model-code-variable-response
      - id: model-code-variable-b
      - id: model-code-variable-c
    near_bytes: 160

  - id: model-response-interpreter
    desc: Passes model response to an interpreter
    crit: notable
    conf: 0.95
    any:
      - id: python-model-response-interpreter
      - id: go-model-response-interpreter
      - id: javascript-model-response-interpreter
      - id: model-response-eval
      - id: model-response-generated-source-process

  - id: model-response-command-execution
    desc: Executes a command selected from a model response
    crit: notable
    conf: 0.96
    for: [python, javascript, typescript, go, rust, lua, powershell]
    all:
      - id: model-response-command-parse
    any:
      - id: micro-behaviors/process/create/subprocess::variable-command-shell-true
      - id: micro-behaviors/process/create/exec::child-process-execution
    near_bytes: 700
