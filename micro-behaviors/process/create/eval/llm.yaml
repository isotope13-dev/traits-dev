# A model response passed directly to an interpreter is a neutral capability
# in an agent or automation tool.  Malicious conclusions belong in objectives.
defaults:
  platforms: [unix, windows]
  for: [python, go, lua, shell, javascript, typescript, powershell, rust]
  attack: T1059

traits:
  - id: python-interpreter-process-call
    desc: Python launches a child interpreter
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?i)subprocess\.(run|Popen|call)\s*\('

  - id: interpreter-name-a
    desc: Invokes Lua or shell interpreter
    crit: notable
    conf: 0.94
    for: [python, go]
    if:
      type: text
      regex: "(?i)[\"'](lua|python3?|bash)[\"']"

  - id: interpreter-name-b
    desc: Invokes a script interpreter
    crit: notable
    conf: 0.92
    for: [python, go]
    if:
      type: text
      regex: "(?i)[\"'](sh|node|ruby|perl)[\"']"

  - id: python-model-response-input
    desc: Python passes model response as input
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?i)\b(input|stdin)\s*=\s*(model_output|response_code)\b'

  - id: python-generated-input
    desc: Python passes generated text as input
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?i)\b(input|stdin)\s*=\s*generated\b'

  - id: python-response-input
    desc: Python passes response text as input
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '(?i)\b(input|stdin)\s*=\s*(response|output)\b'

  - id: python-source-input
    desc: Python passes source text as input
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: '(?i)\b(input|stdin)\s*=\s*(source|script)\b'

  - id: go-interpreter-process-call
    desc: Go launches a child interpreter
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: text
      regex: '(?i)exec\.Command\s*\('

  - id: go-model-response-argument
    desc: Go passes generated source to a process
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: text
      regex: '(?i)\b(model_output|luaSource|pythonSource|shellSource)\b'

  - id: generated-source-argument
    desc: Process call carries generated text
    crit: notable
    conf: 0.92
    for: [go, javascript, typescript]
    if:
      type: text
      regex: '(?i)\b(generated|response|output|source)\b'

  - id: javascript-interpreter-process-call
    desc: JavaScript launches a script interpreter
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\bchild_process\.(spawn|exec|execFile|fork)\s*\('

  - id: javascript-interpreter-name
    desc: JavaScript process call names Lua
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\bchild_process\.(spawn|exec|execFile|fork)\s*\([^\n]{0,80}["'']lua["'']'

  - id: eval-sink
    desc: Dynamic source evaluation call
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bloadstring\s*\('

  - id: model-code-variable-a
    desc: Generated or returned source variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(generated|response)[_-]?(code|script|source)\b'

  - id: model-code-variable-c
    desc: Model output source variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bmodel[_-]?(code|source|output)\b'

  - id: model-code-variable-b
    desc: Model source code variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(model_output|lua_source|python_source|shell_source)\b'

composite_rules:
  - id: interpreter-name
    desc: Invokes a script interpreter
    crit: notable
    conf: 0.95
    for: [python, go]
    any:
      - id: interpreter-name-a
      - id: interpreter-name-b

  - id: python-model-response-interpreter
    desc: Python launches interpreter with model response
    crit: notable
    conf: 0.95
    for: [python]
    all:
      - id: python-interpreter-process-call
      - id: interpreter-name
    any:
      - id: python-model-response-input
      - id: python-generated-input
      - id: python-response-input
      - id: python-source-input
    near_bytes: 600

  - id: go-model-response-interpreter
    desc: Go launches interpreter with model response
    crit: notable
    conf: 0.95
    for: [go]
    all:
      - id: go-interpreter-process-call
      - id: interpreter-name
    any:
      - id: go-model-response-argument
      - id: generated-source-argument
    near_bytes: 1200

  - id: javascript-model-response-interpreter
    desc: JavaScript runs generated source through Lua
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: javascript-interpreter-process-call
      - id: javascript-interpreter-name
      - id: generated-source-argument
    near_bytes: 600

  - id: model-response-eval
    desc: Evaluates model response as source code
    crit: notable
    conf: 0.94
    all:
      - id: eval-sink
    any:
      - id: model-code-variable-a
      - id: model-code-variable-b
      - id: model-code-variable-c
    near_bytes: 160

  - id: model-response-interpreter
    desc: Passes model response to an interpreter
    crit: notable
    conf: 0.95
    any:
      - id: python-model-response-interpreter
      - id: go-model-response-interpreter
      - id: javascript-model-response-interpreter
      - id: model-response-eval
