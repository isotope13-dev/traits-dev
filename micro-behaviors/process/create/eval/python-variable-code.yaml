defaults:
  crit: notable
  platforms: [unix]
  for: [python]
  attack: T1059.006
traits:
  - id: python-c-flag-variable-code-argument
    desc: Python -c receives variable-held code
    conf: 0.94
    mbc: C0017
    if:
      type: tree-sitter
      query: |
        ((call
          function: (_) @runner
          arguments: (argument_list
            (list
              . (_) @interpreter
              . (string) @flag
              . [(identifier) (subscript)] @code))) @launch
          (#match? @runner "^(subprocess\\.)?(run|Popen|check_output)$")
          (#match? @interpreter "^(sys\\.executable|[\"']python[0-9.]*[\"'])$")
          (#match? @flag "^[\"']-c[\"']$"))
