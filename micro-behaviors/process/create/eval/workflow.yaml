# Script-capable workflow tasks accept source expressions as data. These
# structural fields are neutral execution capabilities; objective rules add a
# process-launch sink before concluding that the expression is a host escape.
defaults:
  platforms: [windows, unix]
  for: [json, python, javascript, typescript, java, go, ruby]
  crit: notable
  conf: 0.96
  attack: T1059

traits:
  - id: script-capable-workflow-task
    desc: Workflow declares a script-capable task
    if:
      type: text
      regex: '(?i)["'']type["'']\s*:\s*["''](INLINE|LAMBDA|DO_WHILE|SWITCH)["'']'

  - id: workflow-javascript-evaluator
    desc: Workflow selects a JavaScript evaluator
    if:
      type: text
      regex: '(?i)["'']evaluatorType["'']\s*:\s*["'']javascript["'']'

  - id: workflow-python-evaluator
    desc: Workflow selects a Python evaluator
    if:
      type: text
      regex: '(?i)["'']evaluatorType["'']\s*:\s*["'']python["'']'

  - id: input-parameter-expression
    desc: Input parameters carry an expression
    if:
      type: text
      regex: '(?is)["'']inputParameters["'']\s*:\s*\{.{0,500}["'']expression["'']\s*:'

composite_rules:
  - id: workflow-javascript-expression-task
    desc: Script workflow task evaluates JavaScript
    all:
      - id: script-capable-workflow-task
      - id: workflow-javascript-evaluator
      - id: input-parameter-expression
    near_bytes: 1400

  - id: workflow-python-expression-task
    desc: Script workflow task evaluates Python
    all:
      - id: script-capable-workflow-task
      - id: workflow-python-evaluator
      - id: input-parameter-expression
    near_bytes: 1400
