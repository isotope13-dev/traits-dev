# Standard Start-Job runs supplied PowerShell code in a background job.
# Keep this neutral; authentication coercion requires separate evidence.
defaults:
  platforms: [windows, unix]
  for: [powershell]

traits:
  - id: powershell-start-job-call
    desc: Invokes PowerShell background job creation
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(?i)^Start-Job$'
