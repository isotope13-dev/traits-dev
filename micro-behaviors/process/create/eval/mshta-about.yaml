# MSHTA interprets a document supplied directly on its command line.
# An inline image document is unusual, but does not establish downloaded code,
# malware execution, lockout, or an attempt to bypass security controls.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: suspicious

traits:
  - id: mshta-inline-about-document
    desc: MSHTA inline about-document command syntax
    conf: 0.95
    if:
      type: text
      regex: '(?i)mshta(\.exe)?["''\s]{1,6}about:\S{1,64}'
    not:
      - regex: '(?i)about:blank\b'
