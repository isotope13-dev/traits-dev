defaults:
  platforms: [linux, macos, windows]
  for: [shell]
  conf: 0.85
traits:
  - id: node-e-function-or-eval-source
    desc: Node inline source contains Function or eval
    crit: notable
    attack: T1059.007
    if:
      type: text
      regex: '\b(node|nodejs)\s+-e\s+.{0,220}(\beval\s*\(|new\s+Function\s*\()'

  # --- node -e decode / encoding transforms ---------------------------------
