# Canonical placement from the socket-shell cohort audit.
defaults:
  platforms:
  - unix
  - windows
  crit: notable
  for: [shell, package.json, ruby]
traits:
- id: ruby-inline-socket-process
  desc: Inline Ruby socket/process code
  conf: 0.95
  if:
    type: text
    regex: ruby\s+-rsocket\s+-e.{0,80}(exec|spawn|system)
- id: ruby-inline-socket-shell-path
  desc: Inline Ruby socket code names a shell
  conf: 0.95
  if:
    type: text
    regex: ruby\s+-rsocket\s+-e.{0,80}(/bin/sh|/bin/shell)
composite_rules:
- id: ruby-inline-socket-command
  desc: Inline Ruby socket and process code
  conf: 0.95
  any:
  - id: micro-behaviors/process/create/eval::ruby-inline-socket-process
  - id: micro-behaviors/process/create/eval::ruby-inline-socket-shell-path
  - id: micro-behaviors/communications/socket/connect/attempt::ruby-inline-socket-process-call
