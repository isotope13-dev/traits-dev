traits:
- id: python-interpreter-code-argument
  desc: Python interpreter receives code variable
  conf: 0.92
  if:
    type: text
    regex: python[23]?["']\s*,\s*["']-[cC]["']\s*,\s*code
- id: sys-executable-c-popen
  desc: subprocess.Popen inline Python command
  conf: 0.94
  if:
    type: text
    regex: (\w+\.)?Popen\s*\(\s*\[\s*[\w.]+\.executable\s*,\s*(['"]-I['"]\s*,\s*)?['"]-c['"]
composite_rules:
  - id: python-child-interpreter-spec-exec
    desc: Child Python interpreter executes module loaded via importlib spec
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/module/load::python-importlib-spec-exec-module
      - id: micro-behaviors/process/create/eval::sys-executable-c-popen
    unless:
      - id: metadata/package/testing/presence/harness::python-test-file
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  attack: T1059.006
  crit: notable
  mbc: E1059.006
