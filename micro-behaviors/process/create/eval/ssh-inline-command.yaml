defaults:
  platforms: [unix]
  for: [shell, python, rust, go, c, cpp, objc, elf]
  crit: notable
  attack: T1021.004

traits:
  # The remote execution mechanism is an interpreter receiving source text.
  # A local interpreter alone establishes neither SSH nor propagation.
  - id: ssh-inline-interpreter-command
    desc: SSH command invokes inline Python/Perl
    conf: 0.95
    if:
      type: text
      regex: '\bssh[ \t]+[^\n;|,]{0,160}\b(python[23]?\s+-c|perl\s+-e)\b'
