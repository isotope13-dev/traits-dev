traits:
- id: shell-python-c-format-or-subscript
  desc: python -c built shell argument
  crit: notable
  for:
  - shell
  if:
    type: text
    # The format, subscript, or f-string must be inside the system/popen
    # call. An env or dict read beside subprocess.check_output([...]) is not
    # a command built for the shell.
    regex: '\bpython[23]?\s+-c\s+[''"].{0,90}\b(system|popen)\s*\([^)]{0,9}(\.format\(|[\[{])'
  platforms:
  - unix
  conf: 0.9
