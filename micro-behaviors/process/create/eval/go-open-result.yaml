# Open alone is not a crypto API. This observation states only the actual
# result-to-source relationship; consumers add a bound GCM Open operation.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.98

traits:
  - id: go-open-result-node-code
    desc: Passes Open result to Node inline source
    if:
      type: symbol
      kind: call
      exact: os/exec.Command
      args:
        - index: 0
          kind: string
          regex: '(?i)(^|[/\\])node(\.exe)?$'
        - index: 1
          kind: string
          regex: '^(-e|--eval)$'
        - index: 2
          from:
            call: '\.Open$'
            through:
              - call: '^string$'
                arguments: [0]
