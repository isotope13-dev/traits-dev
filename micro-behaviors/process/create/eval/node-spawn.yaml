# Node.js spawn with an inline script (-e flag)
# Detects spawning node with inline code execution
defaults:
  crit: notable
  platforms: [windows, unix]
  attack: T1059.007
  mbc: C0017
  for: [javascript, typescript]
traits:
  - id: spawn-node-eval
    desc: Spawns node with -e inline code
    # Inline Node code is a process-creation capability.  Build tools and
    # daemon managers use it legitimately; hostile staging requires the
    # surrounding fetch/decode/payload evidence supplied by objective rules.
    conf: 0.9
    if:
      type: text
      regex: "spawn\\s*\\(\\s*['\"]node['\"]\\s*,\\s*\\[[^\\]]{0,60}['\"]\\s*-e['\"]"
    unless:
      - id: metadata/package/testing/harness/runtime::node-eval-signal-test-fixture
      - type: basename
        regex: '\.(test|spec)\.[cm]?[jt]sx?$'
      - type: text
        substr: ".test."
      - type: text
        substr: "describe("
  - id: spawn-node-eval-first-option
    desc: Spawns Node with -e first in argv
    # The pattern establishes the option position, not whether the following
    # code argument is a variable. CLI generators use this launch form.
    conf: 0.85
    if:
      type: text
      regex: "spawn\\s*\\(\\s*['\"]node['\"]\\s*,\\s*\\[\\s*['\"]\\s*-e['\"]\\s*,"
    unless:
      - id: metadata/package/testing/harness/runtime::node-eval-signal-test-fixture
      - type: basename
        regex: '\.(test|spec)\.[cm]?[jt]sx?$'
      - type: text
        substr: ".test."
      - type: text
        substr: "describe("
  - id: spawn-node-eval-computed-access
    desc: Computed-access spawn of node -e inline code
    # Same capability as spawn-node-eval, reached through bracket property
    # access (cp["spawn"]("node", ["-e", code])) so no spawn( call symbol is
    # recorded. This atom claims only the process-creation capability.
    conf: 0.9
    if:
      type: text
      regex: "\\[\"spawn\"\\]\\s*\\(\\s*['\"]node['\"]\\s*,\\s*\\[[^\\]]{0,80}['\"]\\s*-e['\"]"
    unless:
      - id: metadata/package/testing/harness/runtime::node-eval-signal-test-fixture
      - type: basename
        regex: '\.(test|spec)\.[cm]?[jt]sx?$'
      - type: text
        substr: ".test."
      - type: text
        substr: "describe("
