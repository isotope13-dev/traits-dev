composite_rules:
- id: manifest-node-inline-with-conversion
  desc: Inline Node beside string-conversion text
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/process/create/eval::manifest-node-inline-command
  - id: metadata/lang/source/shape::manifest-conversion-source
- id: manifest-inline-conversion-no-repository
  desc: Inline Node conversion lacks repository field
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/process/create/eval::manifest-node-inline-with-conversion
  - id: metadata/package/repository::no-repo-with-hooks
defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
