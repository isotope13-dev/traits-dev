defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: awaited-source-eval-and-child-reuse
    desc: Awaited source reused in eval and child
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        (statement_block
          (lexical_declaration
            (variable_declarator name: (identifier) @payload value: (await_expression)))
          (if_statement consequence: (expression_statement
            (call_expression function: (identifier) @eval
              arguments: (arguments (binary_expression right: (identifier) @evaluated)))))
          (expression_statement
            (call_expression function: (_ object:
              (call_expression function: (identifier) @spawn
                arguments: (arguments (_) (array (string (string_fragment) @flag)
                  (binary_expression right: (identifier) @child)))))))
          (#eq? @eval "eval")
          (#eq? @spawn "spawn")
          (#eq? @flag "-e")
          (#eq? @payload @evaluated)
          (#eq? @payload @child)) @reuse
        (statement_block
          (lexical_declaration
            (variable_declarator name: (identifier) @payload
              value: (call_expression function: (member_expression
                object: (call_expression arguments: (arguments (await_expression)))))))
          (expression_statement
            (call_expression function: (identifier) @eval
              arguments: (arguments (identifier) @evaluated)))
          (expression_statement
            (call_expression function: (_ object:
              (call_expression function: (identifier) @spawn
                arguments: (arguments (_) (array (string (string_fragment) @flag)
                  (identifier) @child))))))
          (#eq? @eval "eval")
          (#eq? @spawn "spawn")
          (#eq? @flag "-e")
          (#eq? @payload @evaluated)
          (#eq? @payload @child)) @reuse
