defaults:
  platforms:
    - linux
    - macos
  for: [scripts, binaries]
traits:
  - id: sys-execve-source-constant
    desc: Source references the execve syscall number
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      word: SYS_execve
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: c-exec-variants
    desc: C-style exec family functions
    crit: notable
    conf: 0.8
    if:
      type: symbol
      regex: ^exec(l(e|p)?|v(p(e)?)?)$
    for: [elf, macho]
    unless:
      - type: basename
        regex: ^(node-pty|pty)\.node$
      - type: basename
        exact: spawn-helper
      - id: metadata/file/string/identity::chrome-sandbox-basename
      - type: basename
        regex: ^russh\..*\.node$
      - id: well-known/app/ai/tabby::tabby-basename
  - id: exec-variant-symbol-text
    desc: Exec-family token in native executable text
    crit: notable
    conf: 0.75
    for: [elf, macho]
    if:
      type: text
      regex: ^exec(l(e|p)?|v(p(e)?)?)(\.c)?$
      section: .text
    unless:
      - type: basename
        regex: ^(node-pty|pty)\.node$
      - type: basename
        exact: spawn-helper
      - id: metadata/file/string/identity::chrome-sandbox-basename
      - type: basename
        regex: ^russh\..*\.node$
      - id: well-known/app/ai/tabby::tabby-basename
  # The whole exec family, in source, to match what c-exec-variants above
  # already recognizes in compiled binaries. Keying source on `execl` alone
  # left the path-searching spellings unmatched, and those are the ones a
  # payload reaches for when it does not want to hardcode an interpreter
  # path -- execlp("sh", "sh", "-i", NULL) is how the rctl-derived router
  # implants spawn their shell.
  - id: c-exec-family-source
    desc: exec family call in C source
    crit: notable
    conf: 0.85
    for:
      - c
      - cpp
    if:
      type: symbol
      regex: '^exec(l[ep]?|v[ep]?|vpe)$'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: c-execve-argv-target
    desc: execve target from argv
    crit: notable
    conf: 0.88
    for:
      - c
      - cpp
    if:
      type: text
      regex: '\bexecve\s*\(\s*argv\s*\[\s*1\s*\]'
  - id: syscall-execve-linux
    desc: Linux execve syscall
    crit: notable
    conf: 0.8
    platforms: [linux]
    for: [elf]
    if:
      type: syscall
      name: [execve, execveat]
  - id: x86-64-syscall-execve
    desc: Direct x86-64 execve syscall
    crit: notable
    conf: 0.9
    platforms: [linux]
    for: [elf]
    if:
      type: hex
      section: text
      pattern: "B8 3B 00 00 00 0F 05"
  - id: syscall-execve-macos
    desc: macOS execve syscall
    crit: notable
    conf: 0.8
    platforms: [macos]
    for: [macho]
    if:
      type: syscall
      name: [execve]
composite_rules:
  - id: execve-fn
    desc: Exec family process replacement
    crit: notable
    conf: 0.4
    any:
      - id: micro-behaviors/process/create/direct::execve-import
      - id: c-exec-variants
    downgrade:
      any:
        - id: well-known/dual-use/tunnel/shadowsocks-rust::shadowsocks-service-crate
        - id: well-known/tool/reverse-engineering/rizin::rz-test-usage
