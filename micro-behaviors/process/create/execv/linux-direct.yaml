# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: execveat-empty-path-syscall
    desc: Requests execveat empty-path handling
    crit: notable
    if:
      type: syscall
      name: [execveat]
      arch: [x86_64, aarch64]
      args:
        - index: 4
          mask: 4096
