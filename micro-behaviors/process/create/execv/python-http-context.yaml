# HTTP and shell/execve primitives coexist; no fetched value is shown to be
# the execve target.
defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-http-shell-execve-profile
    desc: Python HTTP, shell and execve clues
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/process/create/shell-subprocess::shell-true
      - id: micro-behaviors/process/create/execv::os-execve
