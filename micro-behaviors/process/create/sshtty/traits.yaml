defaults:
  platforms: [unix, windows]
  for: [macho, elf, pe]
  crit: notable
  conf: 0.98

traits:
  - id: sshtty-server-crate-marker
    desc: sshtty server Rust module marker
    if:
      type: text
      substr: "sshtty::server"

  - id: sshtty-terminal-banner
    desc: sshtty terminal description banner
    if:
      type: text
      substr: "Browser terminal with groups and tabs that keeps your shells running"
