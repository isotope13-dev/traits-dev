# Interactive coding agents are legitimate developer tools. Their invocation
# and unattended modes are useful policy signals when one agent launches
# another, so these capability atoms remain at notable severity.
defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.95

traits:
  - id: cursor-agent-prompt-command
    desc: Invokes Cursor agent with prompt
    if:
      type: text
      regex: '(?i)(^|\s)cursor-agent\s+[^\n]{0,100}(-p|--print)\b'

  - id: aider-message-command
    desc: Invokes Aider with instruction
    if:
      type: text
      regex: '(?i)(^|\s)aider\s+[^\n]{0,100}(-m|--message|-f|--message-file)\b'

  - id: cursor-agent-force-flag
    desc: Cursor agent force mode
    if:
      type: text
      regex: '(?i)\bcursor-agent\b[^\n]{0,120}\s--force\b'

  - id: aider-unattended-approval
    desc: Aider unattended approval mode
    if:
      type: text
      regex: '(?i)(\baider\b[^\n]{0,120}\s--yes-always\b|\bAIDER_YES_ALWAYS\s*=\s*true\b)'
