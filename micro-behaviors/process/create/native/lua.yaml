defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-createprocess-call"
    desc: "Lua calls native CreateProcessW launcher"
    crit: "notable"
    conf: 0.96
    if:
      type: "symbol"
      kind: "call"
      regex: "(^|\\.)CreateProcessW$"
  - id: "lua-startup-showwindow-flag"
    desc: "Lua sets the startup window-display flag"
    crit: "notable"
    conf: 0.96
    if:
      type: "tree-sitter"
      kind: "assignment"
      regex: "\\.dwFlags\\s*=\\s*[\\w.]+\\.STARTF_USESHOWWINDOW"
