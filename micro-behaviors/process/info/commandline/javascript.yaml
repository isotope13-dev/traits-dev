defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: check-argv
    desc: Reads Node.js arguments through process.argv
    conf: 0.8
    crit: notable
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: symbol
      kind: member
      exact: process.argv
