defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-process-commandline-property
    desc: PowerShell reads a process CommandLine property
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bGet-Process\b[^\r\n;]{0,160}\.CommandLine\b'

  - id: powershell-wmic-commandline-query
    desc: PowerShell WMIC process command-line query
    crit: notable
    conf: 0.98
    if:
      type: literal
      regex: '(?i)\bwmic\s+process\b[^\r\n]{0,100}\bget\s+CommandLine\b'
