defaults:
  platforms: [unix]
  for: [python]

traits:
  - id: py-getargcargv
    desc: Queries original CPython process arguments
    crit: notable
    conf: 0.92
    if:
      type: symbol
      exact: ctypes.pythonapi.Py_GetArgcArgv
  - id: python-sys-argv-access
    desc: Python sys.argv command-line access
    platforms: [windows, unix]
    crit: baseline
    conf: 0.7
    if:
      type: text
      substr: sys.argv
