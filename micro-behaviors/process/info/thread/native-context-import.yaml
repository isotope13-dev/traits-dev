# Native (ntdll) and WOW64 thread-context calls. Loaders that avoid the kernel32
# wrappers call these names directly, so Win32-only thread-context atoms miss them.
# PE imports carry the names, so these are symbol matches for compiled code.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: native-set-thread-context-import
    desc: Native SetThreadContext import
    if:
      type: symbol
      regex: '^(Nt|Zw|Wow64)SetThreadContext$'

  - id: native-get-thread-context-import
    desc: Native GetThreadContext import
    if:
      type: symbol
      regex: '^(Nt|Zw|Wow64)GetThreadContext$'

  - id: native-resume-thread-import
    desc: Native ResumeThread import
    if:
      type: symbol
      regex: '^(Nt|Zw)ResumeThread$'
