defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-context-eip-rewrite
    desc: x86 CONTEXT control flags and Eip overwrite
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # One CONTEXT buffer at ebp-0x2cc: flags=CONTEXT_FULL (0x10007),
      # query, overwrite Eip at buffer+0xb0, then pass the same buffer
      # to a second call. Accept direct IAT calls and cdecl wrappers.
      # This is a context-buffer observation, not proof of remote execution.
      pattern: '8D 85 34 FD FF FF 50 (56|57) C7 85 34 FD FF FF 07 00 01 00 ( E8 ?? ?? ?? ?? 59 59 | FF 15 ?? ?? ?? ?? ) 85 C0 74 ?? 8B 45 10 89 85 E4 FD FF FF 8D 85 34 FD FF FF 50 (56|57) ( E8 ?? ?? ?? ?? 59 59 | FF 15 ?? ?? ?? ?? ) 85 C0'
