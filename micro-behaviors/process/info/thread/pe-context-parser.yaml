defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: pe-parser-thread-context-memory-api-clues
    desc: PE parser and remote thread-context APIs
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/process/info/thread::suspend-thread-import
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: micro-behaviors/mem/write/arbitrary::remote-memory-write-api-references
      - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
