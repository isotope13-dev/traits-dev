defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: pe-debugger-thread-context-memory-api-profile
  desc: PE imports debugger, thread-context and memory APIs
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: micro-behaviors/process/info/thread::get-thread-context-import
  - id: micro-behaviors/process/info/thread::set-thread-context-import
  - id: micro-behaviors/process/info/thread::resume-thread-import
  - id: micro-behaviors/mem/protect/modify::virtual-memory-allocation-protection-api-pair
  any:
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-binary
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
  - id: micro-behaviors/process/create/spawn::open-process
  needs: 1
  unless:
  - id: metadata/binary/vendor::microsoft-signed-kernel32-context
  - id: metadata/binary/framework/
  - id: metadata/lang/compiler/aot/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/tool/development/
  - id: well-known/tool/sysadmin/sandboxie::sandboxie-known-signed-context
  - id: well-known/app/utility/locale-injection/
