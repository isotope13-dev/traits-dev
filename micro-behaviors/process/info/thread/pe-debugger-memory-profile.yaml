defaults:
  for:
    - pe
  platforms:
    - windows
composite_rules:
  - id: pe-debugger-thread-context-memory-api-profile
    desc: PE imports debugger, thread-context and memory APIs
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: metadata/file/profile/memory-protection-context::virtual-memory-allocation-protection-api-pair
    any:
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/process/attach/rights::open-process
    needs: 1
