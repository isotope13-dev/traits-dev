# Embedded helpers, CRT PE checks and Go runtime preemption can supply
# these facts independently. They establish no payload transfer or pivot.
defaults:
  for: [pe]
  platforms: [windows]

composite_rules:
  - id: embedded-pe-thread-memory-api-profile
    desc: Embedded PE with thread-context and memory API references
    crit: notable
    conf: 0.97
    all:
      - id: metadata/binary/layout/embedded::embedded-pe-image
      - id: metadata/binary/instruction/sequence/comparison::pe-signature-immediate-compare
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/mem/combined::virtual-memory-allocation-protection-api-pair
      - id: micro-behaviors/process/info/thread::thread-context-triple-no-suspend
