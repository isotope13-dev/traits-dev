defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable

composite_rules:
  - id: thread-context-pair-suspend-get
    desc: Suspend-thread and context-read API references
    conf: 0.8
    all:
      - id: micro-behaviors/process/thread/lifecycle::suspend-thread-repeated-name
      - id: get-thread-context-import

  - id: thread-context-pair-suspend-set
    desc: Suspend-thread and context-write API references
    conf: 0.8
    all:
      - id: micro-behaviors/process/thread/lifecycle::suspend-thread-repeated-name
      - id: set-thread-context-import

  - id: thread-context-pair-get-set
    desc: Imports thread-context read and write APIs
    conf: 0.8
    all:
      - id: get-thread-context-import
      - id: set-thread-context-import
    # The Go runtime imports this pair for preemption in no-op programs.
    # Preserve the baseline treatment already applied to both API atoms.
  - id: thread-context-pair-get-resume
    desc: Thread-context read and resume API imports
    conf: 0.8
    all:
      - id: get-thread-context-import
      - id: resume-thread-import

  - id: thread-context-pair-set-resume
    desc: Thread-context write and resume API imports
    conf: 0.8
    all:
      - id: set-thread-context-import
      - id: resume-thread-import

  - id: thread-context-triple-no-suspend
    desc: Thread-context read, write and resume API imports
    conf: 0.88
    all:
      - id: get-thread-context-import
      - id: set-thread-context-import
      - id: resume-thread-import

  - id: thread-context-triple-no-get
    desc: Suspend, context-write and resume API references
    conf: 0.88
    all:
      - id: micro-behaviors/process/thread/lifecycle::suspend-thread-repeated-name
      - id: set-thread-context-import
      - id: resume-thread-import

  - id: thread-context-triple-no-set
    desc: Suspend, context-read and resume API references
    conf: 0.88
    all:
      - id: micro-behaviors/process/thread/lifecycle::suspend-thread-repeated-name
      - id: get-thread-context-import
      - id: resume-thread-import

  - id: thread-context-triple-no-resume
    desc: Suspend and thread-context read/write API references
    conf: 0.88
    all:
      - id: micro-behaviors/process/thread/lifecycle::suspend-thread-repeated-name
      - id: get-thread-context-import
      - id: set-thread-context-import
