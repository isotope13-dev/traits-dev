defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, powershell]

composite_rules:
  - id: thread-context-write-source
    desc: References Win32 or calls NT thread-context write API
    crit: notable
    conf: 0.95
    any:
