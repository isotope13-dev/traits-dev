# These APIs may belong to unrelated components or managed interop bindings.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: exception-thread-protection-event-api-clues
    desc: Exception, thread-context, memory-protection and event API references
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/exception/error-handling::add-vectored-exception-handler
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/process/sync/event::open-event
      - id: micro-behaviors/process/sync/event::create-event
