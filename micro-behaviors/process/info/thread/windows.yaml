# Process/Thread Information (Windows)
# Basic thread and module queries
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.9
traits:
- id: get-current-thread-id
  desc: Get current thread ID
  if:
    type: symbol
    exact: "GetCurrentThreadId"
- id: open-thread
  desc: Open thread handle
  crit: notable
  conf: 0.9
  attack: "T1055.004"
  if:
    type: symbol
    exact: "OpenThread"
- id: open-thread-source
  desc: Open thread handle
  crit: notable
  conf: 0.9
  attack: "T1055.004"
  for: [c, cpp, csharp, rust, go, python, powershell, batch]
  if:
    type: text
    word: "OpenThread"
- id: get-current-process-id
  desc: Get current process ID
  if:
    type: symbol
    exact: "GetCurrentProcessId"
- id: get-thread-context
  desc: Read thread execution context
  crit: notable
  conf: 0.92
  attack: "T1055.003"
  for: [c, cpp, csharp, rust, go, python, powershell, batch]
  if:
    type: text
    word: "GetThreadContext"
  unless:
  - id: metadata/package/testing/presence/harness::c-source-test-directory
  - id: metadata/package/testing/presence/harness::c-source-test-file
- id: set-thread-context
  desc: Modify thread execution context
  crit: notable
  conf: 0.94
  attack: "T1055.003"
  for: [c, cpp, csharp, rust, go, python, powershell, batch]
  if:
    type: text
    word: "SetThreadContext"
  unless:
  - id: metadata/package/testing/presence/harness::c-source-test-directory
  - id: metadata/package/testing/presence/harness::c-source-test-file
- id: managed-get-thread-context-reference
  desc: Managed GetThreadContext reference
  crit: notable
  conf: 0.94
  attack: "T1055.003"
  if:
    type: text
    regex: '(?i)\bGetThreadContext\b'
  unless:
  - id: metadata/lang/compiled::go-runtime-marker
  - id: metadata/lang/compiler/systems::go-pe-symtab
- id: managed-set-thread-context-reference
  desc: Managed SetThreadContext reference
  crit: notable
  conf: 0.94
  attack: "T1055.003"
  if:
    type: text
    regex: '(?i)\bSetThreadContext\b'
  unless:
  - id: metadata/lang/compiled::go-runtime-marker
  - id: metadata/lang/compiler/systems::go-pe-symtab
- id: managed-read-int32-reference
  desc: Managed integer memory read reference
  crit: notable
  conf: 0.88
  if:
    type: text
    word: ReadInt32
- id: managed-write-int32-reference
  desc: Managed integer memory write reference
  crit: notable
  conf: 0.88
  if:
    type: text
    word: WriteInt32
- id: hardware-breakpoint-register-field
  desc: Hardware breakpoint register field
  crit: component
  conf: 0.9
  for: [c, cpp]
  if:
    type: text
    regex: '\bD[rR][0-7]\b|\bCONTEXT_DEBUG_REGISTERS\b'
- id: suspend-thread
  desc: Suspend remote thread execution
  crit: notable
  conf: 0.9
  attack: "T1055.003"
  for: [c, cpp]
  downgrade:
    any:
    - id: well-known/tool/development/debugpy
    - id: well-known/tool/development/debugpy::package-path-marker
    - type: basename
      regex: '(?i)(debugpy|pydevd|attach\.cpp)'
    - type: text
      regex: debugpy
    - type: text
      regex: pydevd_attach_to_process
    - type: text
      regex: pydevd
  if:
    type: text
    word: "SuspendThread"
- id: suspend-thread-import
  desc: Suspend a Windows thread via imported API
  crit: notable
  conf: 0.9
  attack: "T1055.003"
  if:
    type: import
    exact: "SuspendThread"
  unless:
  - id: metadata/lang/compiled::go-runtime-marker
  - id: metadata/lang/compiler/systems::go-pe-symtab
- id: resume-thread
  desc: Windows ResumeThread API name reference
  crit: notable
  conf: 0.9
  for: [pe, dll, c, cpp, powershell, batch, vbs, javascript]
  downgrade:
    any:
    - id: well-known/tool/development/debugpy
    - id: well-known/tool/development/debugpy::package-path-marker
    - type: basename
      regex: '(?i)(debugpy|pydevd|attach\.cpp)'
    - type: text
      regex: debugpy
    - type: text
      regex: pydevd_attach_to_process
    - type: text
      regex: pydevd
  if:
    type: text
    word: "ResumeThread"
  unless:
  - id: metadata/lang/compiled::go-runtime-marker
  - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: well-known/game/mod::bedrockboot-preload-cpp-pdb

- id: resume-thread-source
  desc: Resumes a thread in source
  crit: notable
  conf: 0.9
  for: [csharp, rust, go, python]
  if:
    type: text
    word: ResumeThread
  unless:
  - id: metadata/lang/compiled::go-runtime-marker
  - id: metadata/lang/compiler/systems::go-pe-symtab

composite_rules:
- id: thread-quiescence-for-code-patch
  desc: Enumerates, suspends, and resumes threads around memory work
  crit: notable
  conf: 0.95
  attack: "T1055.003"
  all:
  - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  - id: suspend-thread-import
  - id: micro-behaviors/process/inject/runtime/call::get-thread-context-dup
  - id: micro-behaviors/process/info/thread::resume-thread-dup
- id: managed-thread-context-api-pair
  desc: Paired managed thread context APIs
  crit: notable
  conf: 0.96
  attack: "T1055.003"
  all:
  - id: managed-get-thread-context-reference
  - id: managed-set-thread-context-reference
  near_bytes: 512
- id: managed-thread-context-memory-ops
  desc: Managed paired memory operations
  crit: notable
  conf: 0.9
  all:
  - id: managed-read-int32-reference
  - id: managed-write-int32-reference
  near_bytes: 512
- id: hardware-breakpoint-register-manipulation
  desc: Hardware breakpoint register setup
  crit: notable
  conf: 0.9
  mbc: B0012
  for: [c, cpp]
  all:
  - id: get-thread-context
  - id: set-thread-context
  - id: hardware-breakpoint-register-field
  near_bytes: 512
- id: managed-hardware-breakpoint-setup
  desc: Managed thread-context setup with memory-field access
  crit: notable
  conf: 0.96
  mbc: B0012
  all:
  - id: managed-thread-context-api-pair
  - id: managed-thread-context-memory-ops
