defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1055.003
traits:
  - id: get-thread-context-vb6
    desc: VB6 reads thread CPU registers
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: GetThreadContext
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: micro-behaviors/process/info/thread::get-thread-context-import
  - id: set-thread-context-vb6
    desc: VB6 hijacks thread EIP/RIP register
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: SetThreadContext
    unless:
      # The symbol records the API being used; this also sees the name sitting in
      # data. Standing down there keeps one use from counting twice.
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: metadata/file/string/corpus::hashed-text-record
  - id: resume-thread-vb6
    desc: VB6 resumes suspended thread
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: ResumeThread
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: resume-thread-import
  # A VB source file that types out the x86 CONTEXT record is manipulating
  # another thread's registers; the API name it later calls may be encrypted,
  # so the structure declaration is the durable marker.
  - id: vb-context-struct-debug-regs
    desc: VB declares thread CONTEXT debug register
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bDr7\s+As\s+Long\b'
  - id: vb-context-flags-field-decl
    desc: VB declares CONTEXT ContextFlags field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bContextFlags\s+As\s+Long\b'
  - id: vb-entrypoint-register-pivot
    desc: VB sets thread EAX to entrypoint
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '\.Eax\s*=\s*[\w.]*\.?ImageBase\s*\+\s*[\w.]*AddressOfEntryPoint'
