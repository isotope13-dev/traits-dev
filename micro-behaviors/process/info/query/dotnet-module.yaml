# MainModule can inspect any Process, including one returned by
# GetProcessesByName. Neither getter establishes current-process identity.
defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: dotnet-main-module-getter
    desc: .NET process MainModule getter name
    conf: 0.92
    if:
      type: text
      exact: get_MainModule

  - id: dotnet-module-name-getter
    desc: .NET process module-name getter
    conf: 0.92
    if:
      type: text
      exact: get_ModuleName

composite_rules:
  - id: dotnet-process-module-name
    desc: Managed process-module name API references co-occur
    conf: 0.97
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/symbols/name/token::dotnet-processmodule-type-name
      - id: dotnet-main-module-getter
      - id: dotnet-module-name-getter
