defaults:
  platforms: [windows]
  crit: notable
  conf: 0.85
traits:
  - id: powershell-win32-process-query
    desc: PowerShell Win32_Process query reference
    for: [powershell, csharp, python, vbs, kotlin]
    if:
      type: text
      regex: 'Get-(CimInstance|WmiObject)(\s+-Class(Name)?)?\s+Win32_Process'
      case_insensitive: true
