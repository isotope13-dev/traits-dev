defaults:
  platforms: [macos, ios]
  for: [c, cpp, objectivec, swift, macho]
  crit: notable
  conf: 0.98

traits:
  - id: apple-pid-container-path
    desc: Apple PID-to-container path API reference
    if:
      type: symbol
      exact: sandbox_container_path_for_pid

  - id: apple-pid-container-path-dispatch
    desc: Dispatches Apple container path lookup API
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*$'
      arg:
        index: 0
        kind: identifier
        name: sandbox_container_path_for_pid
