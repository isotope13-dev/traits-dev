defaults:
  for:
    - pe
    - dll
  platforms:
    - windows

traits:
  - id: go-parent-pid-query
    desc: Go queries its parent PID
    crit: notable
    conf: 0.84
    for: [go]
    if:
      type: text
      regex: '(?i)Getppid\s*\(\)|ProcessEntry32'

  - id: go-explorer-parent-reference
    desc: Go examines the Windows parent executable
    crit: notable
    conf: 0.84
    for: [go]
    if:
      type: text
      regex: '(?i)StartedByExplorer|UTF16ToString.{0,80}ExeFile'

  - id: zw-query-information-process
    desc: ZwQueryInformationProcess import
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      exact: ZwQueryInformationProcess
    downgrade:
      any:
        - id: metadata/binary/symbols/plugin::ollydbg-plugin-export

  # SYSTEM_PROCESS_INFORMATION records are linked by NextEntryOffset. This
  # signature compares ImageName.Buffer and unlinks a matching record; the
  # objective rule supplies the API-resolution and writable-code context.
  - id: x64-system-process-query-result-filter
    desc: Filters x64 process query by image name
    crit: notable
    conf: 0.98
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: 'FF 15 ?? ?? ?? ?? 8B E8 85 C0 78 ?? 83 FF 05 75 ?? [0-80] 48 8B 4B 40 48 8D 15 ?? ?? ?? ?? E8 ?? ?? ?? ?? 85 C0 75 ?? 8B 03 85 C0 75 ?? 44 89 37 41 8B C6 48 8B DF EB ?? 01 07 48 8B DF 8B 07'

composite_rules:
  - id: go-parent-explorer-check
    desc: Go checks explorer.exe as parent
    crit: notable
    conf: 0.84
    for: [go]
    near_bytes: 768
    all:
      - id: go-parent-pid-query
      - id: go-explorer-parent-reference
