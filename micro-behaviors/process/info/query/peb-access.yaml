defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: peb-access-x86
    desc: PE contains x86 PEB access instructions
    if:
      type: metrics
      field: pe.peb_access_x86_count
      min: 1

  - id: peb-access-x64
    desc: PE contains x64 PEB access instructions
    if:
      type: metrics
      field: pe.peb_access_x64_count
      min: 1

composite_rules:
  - id: peb-access-both-architectures
    desc: PE contains both PEB instruction variants
    crit: notable
    conf: 0.96
    all:
      - id: peb-access-x86
      - id: peb-access-x64
