# MainModule belongs to any Process instance, including enumerated processes.
# The member chain does not establish that the queried process is the caller.
defaults:
  platforms: [windows, unix]
  for: [csharp]

traits:
  - id: mainmodule-filename-member
    desc: Reads a process MainModule.FileName member
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: member
      regex: '(^|\.)MainModule\.FileName$'
