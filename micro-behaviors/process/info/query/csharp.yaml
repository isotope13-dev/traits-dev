# MainModule belongs to any Process instance, including enumerated processes.
# The member chain does not establish that the queried process is the caller.
defaults:
  platforms: [windows, unix]
  for: [csharp]

traits:
  - id: mainmodule-filename-member
    desc: Reads a process MainModule.FileName member
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: member
      regex: '(^|\.)MainModule\.FileName$'

  - id: csharp-zwquery-information-process
    desc: Calls ZwQueryInformationProcess in C#
    crit: notable
    conf: 0.94
    platforms: [windows]
    attack: T1055
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ZwQueryInformationProcess$'

  - id: csharp-peb-basic-information-struct
    desc: Declares PROCESS_BASIC_INFORMATION struct
    crit: notable
    conf: 0.90
    platforms: [windows]
    if:
      type: text
      exclude_comments: true
      word: PROCESS_BASIC_INFORMATION
