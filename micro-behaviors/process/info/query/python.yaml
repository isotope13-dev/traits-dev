# Python helpers named for "is this process running" checks. A function name is
# a neutral clue that the program tests for a live process (single-instance
# guards, service supervisors, test harnesses such as MariaDB ColumnStore's
# cmapi). Relocated (2026-09) from objectives/command-and-control/dropper/
# delivery/http, which still uses them as corroboration for a Python dropper.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.85
  attack: T1057

traits:
  - id: python-is-process-running-function
    desc: Defines an is_process_running function
    if:
      type: function
      substr: is_process_running
  - id: python-isprocessrunning-function
    desc: Defines an isProcessRunning function
    if:
      type: function
      substr: isProcessRunning
  - id: python-check-if-running-function
    desc: Defines a check_if_running function
    if:
      type: function
      substr: check_if_running
  - id: python-process-running-function
    desc: Defines a function named like process_running
    if:
      type: function
      substr: process_running

