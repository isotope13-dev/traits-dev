defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-parent-process-id-member
    desc: Reads a parent process identifier member
    crit: notable
    conf: 0.95
    # A member read off a variable holds the same query result as a call-result
    # dereference split across statements, as in CartJacked stagers.
    if:
      type: text
      regex: '(?i)(\)|\$\w+)\s*\.\s*ParentProcessId\b'
