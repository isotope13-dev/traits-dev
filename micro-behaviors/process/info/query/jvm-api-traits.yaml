defaults:
  platforms: [windows, unix, android]
  for: [java, class]
traits:
  - id: java-runtime-getruntime-bytecode-reference
    desc: Java bytecode Runtime accessor
    crit: notable
    conf: 0.92
    for: [class]
    if:
      type: import
      exact: java/lang/Runtime.getRuntime
  - id: java-runtime-class-reference
    desc: Java Runtime class reference
    crit: notable
    conf: 0.86
    for: [jsp, java, class, html, javascript, python, vbs]
    if:
      type: text
      regex: 'java[/\\.]lang[/\\.]Runtime($|[^A-Za-z0-9_$])'
