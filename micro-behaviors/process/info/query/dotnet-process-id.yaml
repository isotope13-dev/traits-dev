# Looking up one known PID is not enumeration of running processes.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable

traits:
  - id: dotnet-get-process-by-id-member
    desc: .NET GetProcessById lookup API reference
    conf: 0.9
    if:
      type: text
      exact: GetProcessById
    unless:
      - type: value
        path: pe.clr.runtime_version
        exists: false
