defaults:
  crit: notable
  platforms: [windows, unix, android]
traits:
  - id: java-getruntime-ref
    desc: Accesses the current JVM Runtime object
    crit: notable
    conf: 0.84
    for: [jsp, class, python, javascript, java, vbs, html]
    if:
      type: text
      regex: '\bRuntime\.getRuntime\s*\('
    not:
      - regex: 'getRuntime\s*:\s*function'
