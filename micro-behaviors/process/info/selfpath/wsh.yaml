defaults:
  platforms: [windows]
  for: [vbs, javascript, batch]

traits:
  # `WScript.ScriptFullName` is how a Windows Script Host script learns its own
  # path — the WSH spelling of argv[0] / current_exe, which this directory
  # already covers for C, Rust, Perl, Java and batch. Relocated from
  # objectives/execution/interpreter/script/wsh, where reading a property was
  # filed as script-execution intent: self-location is what a script does to
  # find files next to itself (the Windows Installer SDK's WiCodepage.vbs
  # derives its temp directory that way), and equally what a dropper does to
  # copy itself. The composites that mean the latter reference this from here.
  - id: wscript-scriptfullname
    desc: WScript.ScriptFullName self-path read
    crit: notable
    conf: 0.5
    if:
      type: text
      substr: WScript.ScriptFullName
