defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: managed-executable-path-getter
    desc: Managed ExecutablePath getter name
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: get_ExecutablePath

composite_rules:
  - id: managed-entry-assembly-location-references
    desc: Entry-assembly and Location getter references
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/metaprogramming/reflection::dotnet-get-entry-assembly-reference
      - id: metadata/binary/symbols/name::location-getter-name

  - id: managed-self-path-references
    desc: Managed executable self-path API references
    crit: notable
    conf: 0.95
    any:
      - id: managed-executable-path-getter
      - id: managed-entry-assembly-location-references
