defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-script-path
    desc: PowerShell script path introspection
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(\$MyInvocation\.MyCommand\.Path|\$PSCommandPath)\b'
  - id: powershell-script-path-stored
    desc: PowerShell stores own script path in variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\$\w+\s*=\s*(\$MyInvocation\.MyCommand\.Path|\$PSCommandPath)(\s*\|)?'
    not:
      - regex: '\|$'
  # ROMULUS stagers track their own path through an environment variable
  # (`$env:__ST = $MyInvocation.MyCommand.Path`) so the final self-delete can
  # reference `$env:<name>` rather than the cmdlet variable the simple
  # `$var = $PSCommandPath` form captures. The env-var assignment is the same
  # self-path introspection; the name is attacker-chosen so it is not pinned.
  - id: powershell-script-path-stored-env
    desc: Stores script path in environment variable
    crit: notable
    conf: 0.9
    # The assignment is PowerShell even when a JavaScript, TypeScript, or Python
    # loader embeds the stager as a command string.
    for: [powershell, javascript, typescript, python]
    platforms: [windows, unix]
    if:
      type: text
      regex: '(?i)\$env:\w+\s*=\s*(\$MyInvocation\.MyCommand\.Path|\$PSCommandPath)\b'
