defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: current-process-path
    desc: .NET resolves the current executable path
    crit: notable
    conf: 0.9
    for: [csharp]
    if:
      type: symbol
      kind: member
      exact: Environment.ProcessPath

  - id: vbnet-current-process-path
    desc: VB.NET assigns the current executable path
    crit: notable
    conf: 0.88
    for: [vbs]
    if:
      type: text
      regex: '(?m)^[ \t]*Dim [A-Za-z_][A-Za-z0-9_]* = Environment\.ProcessPath\b'

  - id: dotnet-main-module-getter
    desc: .NET process MainModule getter name
    conf: 0.92
    if:
      type: text
      exact: get_MainModule

  - id: dotnet-module-name-getter
    desc: .NET process module-name getter
    conf: 0.92
    if:
      type: text
      exact: get_ModuleName

composite_rules:
  - id: dotnet-process-module-name
    desc: Reads a .NET process module name
    conf: 0.97
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/symbols/name::dotnet-processmodule-type-name
      - id: dotnet-main-module-getter
      - id: dotnet-module-name-getter
