defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: dotnet-application-startup-path
    desc: .NET StartupPath property token
    crit: baseline
    conf: 0.75
    if:
      type: text
      substr: get_StartupPath
    for:
      - pe

  - id: current-process-path
    desc: .NET resolves the current executable path
    crit: notable
    conf: 0.9
    for: [csharp]
    if:
      type: symbol
      kind: member
      exact: Environment.ProcessPath

  - id: vbnet-current-process-path
    desc: VB.NET assigns the current executable path
    crit: notable
    conf: 0.88
    for: [vbs]
    if:
      type: text
      regex: '(?m)^[ \t]*Dim [A-Za-z_][A-Za-z0-9_]* = Environment\.ProcessPath\b'
