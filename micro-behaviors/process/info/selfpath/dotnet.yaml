defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: dotnet-main-module-getter
    desc: .NET process MainModule getter name
    crit: component
    conf: 0.92
    if:
      type: text
      exact: get_MainModule

  - id: dotnet-module-name-getter
    desc: .NET process module-name getter
    crit: component
    conf: 0.92
    if:
      type: text
      exact: get_ModuleName

composite_rules:
  - id: dotnet-process-module-name
    desc: Reads a .NET process module name
    crit: notable
    conf: 0.97
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/os/api-resolution/dynamic::managed-process-module-reference
      - id: dotnet-main-module-getter
      - id: dotnet-module-name-getter
