defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, shell]

traits:
  - id: self-update-flow-marker
    desc: Source declares an explicit self-update flow
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '"self_update"'

composite_rules:
  # Shared benign context for download+execute clue profiles: the file is a
  # legitimate updater/installer bootstrap — it either declares an explicit
  # self-update flow or verifies every fetched payload against a pinned
  # digest before running it. Groups the two suppressors so consuming
  # rules carry one carve-out instead of two.
  - id: self-update-or-pinned-bootstrap-context
    desc: Self-updater or digest-pinned installer bootstrap flow
    crit: exception
    conf: 0.95
    any:
      - id: micro-behaviors/process/info/selfpath::self-update-flow-marker
      - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
