# Perl reads its own program name from $0.
#
# Relocated from objectives/anti-analysis/self-modify/runtime/ (2026-07), where
# it was named `perl-argv0-self-path` and reported as self-modification
# evidence. `my $prog = $0;` is the standard way every Perl script builds its
# own usage message — Debian's deluser/adduser do it — so as an objective it
# labelled ordinary scripts as anti-analysis. Reading the self path is a
# neutral process-info capability; the self-rewrite composite still references
# it and gets its intent from the source-splice and overwrite-open legs.
defaults:
  platforms: [windows, unix]
  for: [perl]

traits:
  - id: perl-argv0-assignment
    desc: Assigns Perl $0 program name
    crit: component
    conf: 0.84
    if:
      type: text
      regex: '\$[A-Za-z_][A-Za-z0-9_]{0,31}\s*=\s*\$0\b'
