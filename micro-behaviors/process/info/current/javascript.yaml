defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-process-ppid-access
    desc: Node process.ppid access
    conf: 0.8
    crit: notable
    if:
      type: text
      regex: '\bprocess\.ppid\b'

  - id: pid-literal
    desc: pid string literal
    crit: notable
    conf: 0.7
    if:
      type: string_literal
      exact: pid
    unless:
    - id: metadata/file/format/source-map::sourcemap
  - id: node-process-pid-access
    desc: Reads Node.js current process ID
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: member
      exact: process.pid
