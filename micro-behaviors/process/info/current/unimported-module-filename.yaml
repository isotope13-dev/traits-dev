defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.92
traits:
  - id: get-module-filename-a-text-no-import
    desc: GetModuleFileNameA API name absent from imports
    if:
      type: text
      word: GetModuleFileNameA
    unless:
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: metadata/binary/header/malformed::malformed-pe-structure
      - id: micro-behaviors/process/info/current::get-module-filename-ansi
