defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: get-current-process
    desc: Get current process handle
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: GetCurrentProcess

  - id: cross-lang-self-pid-or-path
    desc: Queries own PID or executable path
    crit: notable
    conf: 0.88
    for: [go, python]
    platforms: [windows, linux, macos]
    if:
      type: text
      regex: '\b(os\.Getpid|os\.getpid|os\.Executable)\s*\('

composite_rules:
  - id: self-process-or-module-query
    desc: Queries own process ID or executable image path
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, go, rust, python]
    platforms: [windows, linux, macos]
    any:
      - id: micro-behaviors/process/info/thread::get-current-process-id
      - id: get-module-filename-wide
      - id: get-module-filename-ansi
      - id: python-sys-executable
      - id: micro-behaviors/fs/path/self::source-self-module-path-read
      - id: cross-lang-self-pid-or-path
