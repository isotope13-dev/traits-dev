defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: get-module-filename-wide
    desc: Get module file path (Unicode)
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: GetModuleFileNameW
  - id: get-module-filename-ansi
    desc: Get module file path (ANSI)
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: GetModuleFileNameA
