# MD5-XOR ciphertext decodes to 164%u0030%u0000%u408b:
# the tail of an x86 FS:[0x30] load and a following MOV opcode.
defaults:
  for: [html, javascript]
  platforms: [windows]
  conf: 0.99
traits:
  - id: md5-xor-x86-peb-resolver-words
    desc: MD5-XOR encoded x86 PEB loader words
    crit: suspicious
    if:
      type: text
      substr: "%07%04%06CM%08U%05%02%16LRU%09Q%1CF%06UZW"
