# Encoded instruction/expression fingerprints; substitution variants require
# the fixed carrier alphabet. These are not general cipher decoders.
defaults:
  for: [html, javascript, text]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: dollar-decimal-x86-peb-load
    desc: Dollar-decimal encoded x86 FS PEB load
    if:
      type: text
      substr: '37$117$97$49$54$52$37$117$48$48$51$48$37$117$48$48$48$48'
  - id: substitution-x86-peb-load
    desc: Fixed-alphabet substitution of x86 FS PEB load
    if:
      type: text
      substr: '\@\$9y\(D\@\$\*\*\>\*\@\$\*\*\*\*\@\$D\*mJ'
