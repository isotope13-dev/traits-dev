defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.94

traits:
  - id: unsupported-host-process-diagnostic
    desc: Reports an unsupported host process
    if:
      type: text
      substr: 'Unsupported host process:'

composite_rules:
  - id: browser-host-name-selection
    desc: Browser image lookup and rejection diagnostic
    all:
      - id: get-module-filename-ansi
      - id: micro-behaviors/process/info/name::browser-process-name-main
      - id: unsupported-host-process-diagnostic
