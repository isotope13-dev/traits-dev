# Bind the operation argument to the called wrapper, rather than treating
# every prctl reference as process renaming. Legitimate thread naming matches.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
traits:
  - id: x64-pr-set-name-call
    desc: Calls PR_SET_NAME through a syscall wrapper
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "elf"
        rule x64_pr_set_name_call {
          strings:
            $call = { BF 0F 00 00 00 48 89 C6 31 C0 E8 ?? ?? ?? ?? }
            $prctl = { 53 49 89 CA 48 63 FF B8 9D 00 00 00 0F 05 }
          condition:
            elf.machine == elf.EM_X86_64 and
            for any s in (0..elf.number_of_sections-1) : (
              elf.sections[s].name == ".text" and
              for any c in (1..#call) : (
                @call[c] >= elf.sections[s].offset and
                @call[c]+!call[c] <= elf.sections[s].offset+elf.sections[s].size and
                for any p in (1..#prctl) : (
                  @prctl[p] >= elf.sections[s].offset and
                  @prctl[p]+!prctl[p] <= elf.sections[s].offset+elf.sections[s].size and
                  @call[c]+15+int32(@call[c]+11) == @prctl[p]
                )
              )
            )
        }
