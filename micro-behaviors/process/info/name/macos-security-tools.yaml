defaults:
  platforms:
  - macos
  for:
  - shell
  - macho
  - applescript
  crit: notable
  conf: 0.9
traits:
- id: little-snitch-name-reference
  desc: Little Snitch name reference
  if:
    type: text
    substr: Little Snitch
- id: lulu-name-reference
  desc: LuLu name reference
  if:
    type: text
    word: LuLu
- id: blockblock-name-reference
  desc: BlockBlock name reference
  if:
    type: text
    word: BlockBlock
  unless:
  - id: well-known/lib/vendor-sdk/sogen/
