# Sandboxes, watchdogs and task managers carry a table of Windows processes
# they must never touch or terminate. LSASS appears in that table beside the
# session manager, the Credential Guard trustlet, the Memory Compression
# pseudo-process and Defender's core service; a credential dumper names its
# one target instead of the whole protected roster.
defaults:
  platforms: [windows]
  for: [binaries, scripts, source]
  crit: notable
  conf: 0.85

traits:
  - id: lsaiso-executable-reference
    desc: References the Credential Guard trustlet
    if:
      type: text
      regex: '(?i)\bLsaIso\.exe\b'

  - id: memory-compression-process-name
    desc: Names the Memory Compression process
    if:
      type: text
      substr: Memory Compression

  - id: defender-core-service-reference
    desc: References Defender core service executable
    if:
      type: text
      regex: '(?i)\bMpDefenderCoreService\.exe\b'

composite_rules:
  - id: protected-system-process-roster
    desc: Table of protected Windows system processes
    needs: 3
    any:
      - id: micro-behaviors/fs/path/host-process::windows-smss-name
      - id: lsaiso-executable-reference
      - id: memory-compression-process-name
      - id: defender-core-service-reference
