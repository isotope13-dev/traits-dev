defaults:
  platforms: [linux]
traits:
- id: kworker-bracket-prefix
  desc: Kworker bracketed name prefix
  crit: component
  conf: 0.85
  for: [elf, c, cpp]
  if:
    type: text
    substr: "[kworker/"
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
- id: per-cpu-kworker-name-reference
  desc: Per-CPU kworker name in text
  crit: notable
  conf: 0.9
  for: [elf, c, cpp]
  if:
    type: text
    regex: '(?m)^[^\n]{0,200}\bkworker/[0-9]+(:[0-9]+)?\b'
  not:
  - regex: '^\s*(/\*|//|\*|#)'
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/tool/reverse-engineering/crash-utility::crash-utility-source
- id: per-cpu-ksoftirqd-name-reference
  desc: Per-CPU ksoftirqd name in text
  crit: notable
  conf: 0.92
  for: [elf, c, cpp]
  if:
    type: text
    regex: "^ksoftirqd/[0-9]+$"
- id: bracketed-kworker-name-reference
  desc: Bracketed kworker thread name in text
  crit: notable
  conf: 0.85
  for: [binaries]
  if:
    type: text
    regex: '\[kworker/[a-zA-Z0-9_:]{1,12}\]'
  unless:
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
