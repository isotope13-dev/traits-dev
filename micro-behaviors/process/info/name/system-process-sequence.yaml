# Application-control and monitoring software keeps the Windows critical
# processes in an exclusion list.  Seeing lsass.exe as one entry in that run is
# a list of processes to leave alone, not a process to open.  The entries are
# separate UTF-16 strings, so the run is only visible in the raw bytes.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.85

traits:
  - id: critical-system-process-name-sequence
    desc: Run of critical Windows process names
    if:
      type: raw
      case_insensitive: true
      regex: '(?s)w.i.n.l.o.g.o.n.\..e.x.e.{0,20}l.s.a.s.s.\..e.x.e.{0,20}c.s.r.s.s'
