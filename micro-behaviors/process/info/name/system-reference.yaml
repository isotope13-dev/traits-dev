# Observation reviewed independently of attacker intent.
traits:
- for:
  - scripts
  platforms:
  - windows
  id: windows-core-executable-reference
  desc: References a core Windows executable name
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?i)\b(svchost|lsass|winlogon|csrss)\.exe\b
