defaults:
  platforms:
  - linux
  - macos
  - windows
traits:
- id: linux-network-admin-tool-name-cluster
  desc: Packet-capture and admin tool name cluster
  crit: notable
  conf: 0.97
  for:
  - elf
  if:
    type: raw
    section: .rodata
    regex: wireshark.{0,8}tcpdump.{0,8}python.{0,8}iptables.{0,8}nano.{0,8}nvim
- id: wireshark-tool-name-reference
  desc: Wireshark executable name reference
  crit: notable
  conf: 0.8
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)(wireshark|tshark|dumpcap)\.exe
  unless:
  - id: well-known/tool/detection/wireshark/
  - type: path
    substr: Wireshark-
- id: fiddler-tool-name-reference
  desc: Fiddler executable name reference
  crit: notable
  conf: 0.8
  for:
  - pe
  if:
    type: text
    regex: (?i)\bfiddler\.exe\b
  not:
  - regex: (?i)[\\/][^\r\n]{0,200}\bfiddler\.exe\b
  unless:
  - id: metadata/signed/leaf::progress-software-corporation
  - id: well-known/app/system/stresstimulus/
  - id: well-known/tool/offensive/frameworks::al-khaser-benign-context
- id: burpsuite-tool-name-reference
  desc: Burp Suite executable or JAR name reference
  crit: notable
  conf: 0.8
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)\b(burpsuite(pro|community)?\.exe|burp\.jar)\b
  unless:
  - id: well-known/tool/offensive/pwn/
- id: charles-tool-name-reference
  desc: Charles Proxy executable name reference
  crit: notable
  conf: 0.8
  for:
  - pe
  - macho
  if:
    type: text
    regex: (?i)\bcharles\.exe\b
  not:
  - regex: (?i)[\\/][^\r\n]{0,200}\bcharles(\.exe)?\b
- id: procmon-tool-name-reference
  desc: Process Monitor executable name reference
  crit: component
  conf: 0.85
  for:
  - pe
  if:
    type: text
    regex: (?i)procmon(64)?\.exe
  downgrade: null
  unless:
  - id: well-known/tool/sysadmin/sysinternals/
  not:
  - regex: (?i)[\\/][^\r\n]{0,200}\bproc(mon|exp)(64)?\.exe\b
- id: procexp-tool-name-reference
  desc: Process Explorer executable name reference
  crit: component
  conf: 0.85
  for:
  - pe
  if:
    type: text
    regex: (?i)procexp(64)?\.exe
  unless:
  - id: well-known/tool/sysadmin/sysinternals::sysinternals-process-explorer
  - id: well-known/tool/sysadmin/sysinternals::sysinternals-microsoft-signed-component
- id: autoruns-tool-name-reference
  desc: Autoruns executable name reference
  crit: component
  conf: 0.8
  for:
  - pe
  if:
    type: text
    regex: (?i)autoruns(c)?(64)?\.exe
  downgrade: null
  unless:
  - id: well-known/tool/sysadmin/sysinternals/
- id: tcpview-tool-name-reference
  desc: TCPView executable name reference
  crit: notable
  conf: 0.8
  for:
  - pe
  if:
    type: text
    regex: (?i)tcpview(64)?\.exe
  unless:
  - id: well-known/tool/sysadmin/sysinternals::sysinternals-microsoft-signed-component
- id: regshot-tool-name-reference
  desc: Regshot executable name reference
  crit: notable
  conf: 0.8
  for:
  - pe
  if:
    type: text
    regex: (?i)regshot(64)?\.exe
- id: api-monitor-tool-name-reference
  desc: API Monitor executable name reference
  crit: notable
  conf: 0.85
  for:
  - pe
  if:
    type: text
    regex: (?i)apimonitor(-x64)?\.exe
  unless:
  - id: well-known/tool/offensive/peas/
- id: http-debugger-tool-name-reference
  desc: HTTP Debugger executable name reference
  crit: notable
  conf: 0.85
  for:
  - pe
  unless:
  - id: well-known/tool/offensive/frameworks::al-khaser-benign-context
  if:
    type: text
    regex: (?i)httpdebugger(ui)?\.exe
- id: cheatengine-tool-name-reference
  desc: Cheat Engine executable name reference
  crit: notable
  conf: 0.9
  for:
  - pe
  if:
    type: text
    regex: (?i)cheatengine[_-]?(x86[_-]?64|i386|x64)?\.exe
  not:
  - regex: (?i)[\\/][^\r\n]{0,200}\bcheatengine[_-]?(x86[_-]?64|i386|x64)?\.exe\b
- id: pestudio-tool-name-reference
  desc: PEStudio executable name reference
  crit: notable
  conf: 0.85
  for:
  - pe
  if:
    type: text
    regex: (?i)pestudio\.exe
- id: peid-tool-name-reference
  desc: PEiD executable name reference
  crit: notable
  conf: 0.85
  for:
  - pe
  if:
    type: text
    regex: (?i)peid\.exe
  not:
  - regex: (?i)[\\/][^\r\n]{0,200}\bpeid\.exe\b
- platforms:
  - windows
  - unix
  id: process-hacker-executable-name-reference
  desc: Process Hacker executable reference
  crit: notable
  conf: 0.6
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)\bprocesshacker(2)?\.exe\b
  unless:
  - id: well-known/tool/detection/malware-config-parser
