defaults:
  platforms: [unix, android, ios]
traits:
  - id: mirai-token
    desc: References the Mirai name
    crit: notable
    conf: 0.85
    for: [elf, shell, scripts, binaries]
    if:
      type: text
      word: mirai
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
