# Relocated from objectives/execution/lure/clipboard/page::macos-terminal-name:
# the matcher is a bare word that fires on any platform's terminal mention
# (including Windows lures), so the macOS identity, directory and platform
# gate were all wrong. Matcher and scope preserved; the macOS Terminal-paste
# composite references this neutral form now.
defaults:
  for: [html]

traits:
- platforms:
  - windows
  id: windows-terminal-name-reference
  desc: Windows terminal or interpreter name reference
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)\b(windows\s+terminal|powershell|command\s+prompt)\b
- platforms:
  - unix
  - windows
  id: terminal-name-reference
  desc: Terminal name reference
  crit: notable
  conf: 0.9
  if:
    type: text
    word: Terminal
