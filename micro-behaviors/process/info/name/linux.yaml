defaults:
  crit: notable
  platforms: [linux]
  for: [elf, c, cpp]

traits:
  - id: kworker-name
    desc: References the kworker process name
    conf: 0.78
    if:
      type: text
      exact: kworker

  - id: ksoftirqd-name
    desc: References the ksoftirqd process name
    conf: 0.82
    if:
      type: text
      exact: ksoftirqd
