defaults:
  for:
  - scripts
  - source
  - binaries
  platforms:
  - windows
traits:
- id: vboxservice-name
  desc: VirtualBox guest service process name
  crit: notable
  conf: 0.85
  if:
    type: text
    word: VBoxService
    case_insensitive: true
- id: vm-guest-tray-process-name
  desc: VM guest tray process name
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '\b(VBoxTray|vmwaretray)\b'
    case_insensitive: true
