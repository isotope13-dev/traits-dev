defaults:
  for:
  - scripts
  - source
  - binaries
  platforms:
  - windows
traits:
- id: vboxservice-name
  desc: VirtualBox guest service process name
  crit: notable
  conf: 0.85
  if:
    type: text
    word: VBoxService
    case_insensitive: true
- id: vmwaretray-name
  desc: VMware tray guest process name
  crit: notable
  conf: 0.85
  if:
    type: text
    word: vmwaretray
    case_insensitive: true
