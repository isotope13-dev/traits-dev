---
defaults:
  platforms:
  - windows
  for:
  - scripts
traits:
- id: sysproc-name-service
  desc: System-process exe name, service set
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: "(?i)\\b(services|spoolsv|wininit|conhost)\\.exe\\b"
composite_rules:
- id: sysproc-name-any
  desc: Windows system-process exe name
  crit: notable
  conf: 0.7
  any:
  - id: micro-behaviors/process/info/name::windows-core-executable-reference
  - id: micro-behaviors/process/info/name::sysproc-name-service
