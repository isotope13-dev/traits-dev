defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: defender-target-name-reference
    desc: Windows Defender process name
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (^MsMpEng$|^WinDefend$|msseces\.exe)
    unless:
      - id: metadata/signed/platform::microsoft
  - id: kaspersky-target-name-reference
    desc: Kaspersky process name
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (avp\.exe|klnagent|avpui\.exe)
  - id: mcafee-target-name-reference
    desc: McAfee process name
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (mcshield\.exe|mcafee\.exe|naPrdMgr\.exe)
