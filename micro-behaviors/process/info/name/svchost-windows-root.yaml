# svchost.exe ships only in System32 / SysWOW64. A script naming it directly
# under the Windows folder points at a dropped look-alike copy.
traits:
  - id: svchost-windows-root-path
    desc: Names svchost.exe in Windows root folder
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [batch, powershell, vbs]
    if:
      type: text
      regex: '(?i)[a-z]:\\windows\\svchost\.exe\b'
