# Evidence relocated without changing matcher or scope.
traits:
- platforms:
  - windows
  for:
  - pe
  - dll
  - csharp
  - source
  id: browser-process-name-main
  desc: Common browser process names
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (?i)\b(chrome|msedge|firefox)\.exe\b
- platforms:
  - windows
  for:
  - pe
  - dll
  - csharp
  - source
  id: browser-process-name-alt
  desc: Alternate Chromium browser process names
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: (?i)\b(brave|opera|vivaldi)\.exe\b
- id: chrome-exe-process-name
  desc: Standalone chrome.exe process-name token
  crit: notable
  conf: 0.5
  for:
  - pe
  - elf
  - python
  - javascript
  - powershell
  - c
  - cpp
  - go
  if:
    type: text
    regex: (?i)(^|[[:space:]"'(\[])chrome\.exe([[:space:]"')\]]|$)
    case_insensitive: true
  platforms:
  - windows
  - unix
