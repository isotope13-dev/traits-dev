defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: daemon-helper-name-token
    desc: Daemon-like helper name token
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '^[a-z]{4,12}-(helper|monitor|svc)$'
    # Rust may concatenate the adjacent HTTP header names age and alt-svc.
    not:
      - exact: agealt-svc
