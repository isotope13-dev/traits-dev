# Game client process names. Launchers, overlays, stat trackers and cheat
# injectors all look these processes up; the name alone says only which
# game the file interacts with.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
traits:
  - id: league-client-process-name
    desc: League of Legends client process name
    if:
      type: text
      regex: '(?i)\b(League of Legends|RiotClientServices)\.exe\b'
