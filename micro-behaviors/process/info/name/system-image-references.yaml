defaults:
  platforms: [windows]
  for: [pe, rust]
traits:
  - id: numeric-svchost-executable-name
    desc: Numeric svchost name with optional separator
    crit: notable
    conf: 0.9
    # Malware commonly adds digits to a trusted Windows process name while
    # retaining the .exe identity. Keep this language-neutral so source and
    # binary artifacts in different implementation languages are covered.
    for: [scripts, go, rust, c, cpp, csharp, python, powershell, batch, pe, dll]
    if:
      type: text
      regex: '(?i)\bsvchost[_-]?[0-9]+\.exe\b'
  - id: variable-suffixed-svchost-executable-name
    desc: Variable-suffixed svchost executable name
    crit: notable
    conf: 0.94
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)\bsvchost[_-]?\$[A-Za-z_]\w*\.exe\b'
