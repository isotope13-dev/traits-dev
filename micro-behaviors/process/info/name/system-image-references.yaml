defaults:
  platforms: [windows]
  for: [pe, rust]
traits:
  - id: audiodg-name
    desc: audiodg.exe process name
    crit: notable
    conf: 0.8
    if:
      type: text
      word: audiodg.exe
  - id: wininit-name
    desc: wininit.exe process name
    crit: notable
    conf: 0.8
    if:
      type: text
      word: wininit.exe
  - id: taskhost-name
    desc: taskhost.exe process name
    crit: notable
    conf: 0.8
    if:
      type: text
      word: taskhost.exe
  - id: numeric-svchost-executable-name
    desc: Numeric svchost name with optional separator
    crit: notable
    conf: 0.9
    # Malware commonly adds digits to a trusted Windows process name while
    # retaining the .exe identity. Keep this language-neutral so source and
    # binary artifacts in different implementation languages are covered.
    for: [scripts, go, rust, c, cpp, csharp, python, powershell, batch, pe, dll]
    if:
      type: text
      regex: '(?i)\bsvchost[_-]?[0-9]+\.exe\b'
  - id: variable-suffixed-svchost-executable-name
    desc: Variable-suffixed svchost executable name
    crit: notable
    conf: 0.94
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)\bsvchost[_-]?\$[A-Za-z_]\w*\.exe\b'
  - id: fontdrvhost-name
    desc: fontdrvhost.exe process name
    crit: notable
    conf: 0.84
    if:
      type: text
      word: fontdrvhost.exe

composite_rules:
  - id: windows-system-process-name-references
    desc: References Windows system-process executable names
    crit: notable
    conf: 0.85
    for: [scripts, go, rust, c, cpp, csharp, python, powershell, batch, pe, dll]
    any:
      - id: micro-behaviors/process/info/name::numeric-svchost-executable-name
      - id: micro-behaviors/process/info/name::variable-suffixed-svchost-executable-name
      - id: micro-behaviors/process/info/name::audiodg-name
      - id: micro-behaviors/process/info/name::wininit-name
      - id: micro-behaviors/process/info/name::taskhost-name
      - id: micro-behaviors/process/info/name::fontdrvhost-name
      - id: micro-behaviors/process/info/name::svchost-executable-reference
      - id: micro-behaviors/process/info/name::lsass-executable-reference
      - id: micro-behaviors/process/info/name::winlogon-executable-reference
