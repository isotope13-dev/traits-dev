defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.7
traits:
- id: masq-realtek
  desc: Assigns a Realtek-associated process label
  if:
    type: text
    regex: '(?i)(name|image|exe|file)\s*=\s*[\x27"]RealtekHDAudio'
- id: masq-windowsupdate
  desc: Assigns a Windows Update process label
  if:
    type: text
    regex: '(?i)(name|image|exe|file)\s*=\s*[\x27"]WindowsUpdate'
- id: masq-svchost
  desc: Assigns an svchost process label
  if:
    type: text
    regex: '(?i)(name|image|exe|file)\s*=\s*[\x27"]svchost'
