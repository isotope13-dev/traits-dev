defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.7
traits:
- id: masq-realtek
  desc: Masquerades as Realtek audio process
  if:
    type: text
    regex: '(?i)(name|image|exe|file)\s*=\s*[\x27"]RealtekHDAudio'
- id: masq-windowsupdate
  desc: Masquerades as Windows Update process
  if:
    type: text
    regex: '(?i)(name|image|exe|file)\s*=\s*[\x27"]WindowsUpdate'
- id: masq-svchost
  desc: Masquerades as svchost process
  if:
    type: text
    regex: '(?i)(name|image|exe|file)\s*=\s*[\x27"]svchost'
