defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.7
traits:
- id: masq-realtek
  desc: Assigns a Realtek-associated process label
  if:
    type: text
    regex: '(?i)[\x27"]RealtekHDAudio(\.exe)?[\x27"]'
- id: masq-windowsupdate
  desc: Assigns a Windows Update process label
  if:
    type: text
    regex: '(?i)[\x27"]Windows[_\s]?Update(\.exe)?[\x27"]'
- id: masq-svchost
  desc: Assigns an svchost process label
  if:
    type: text
    regex: '(?i)[\x27"]svchost(\.exe)?[\x27"]'
