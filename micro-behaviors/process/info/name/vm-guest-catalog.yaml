traits:
- platforms:
  - windows
  for:
  - scripts
  - source
  - binaries
  id: proc-prl-tools
  desc: Parallels guest tools process name
  crit: notable
  conf: 0.85
  if:
    type: text
    word: prl_tools
    case_insensitive: true
- platforms:
  - windows
  for:
  - scripts
  - source
  - binaries
  id: proc-xenservice
  desc: Xen guest service process name
  crit: notable
  conf: 0.85
  if:
    type: text
    word: xenservice
    case_insensitive: true
- platforms:
  - windows
  for:
  - scripts
  - source
  - binaries
  id: proc-spice-vdagent
  desc: SPICE/QEMU guest agent process name
  crit: notable
  conf: 0.85
  if:
    type: text
    word: spice-vdagent
    case_insensitive: true
- platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
  id: qemu-guest-agent-name-reference
  desc: QEMU guest-agent name reference
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: qemu-ga
composite_rules:
- platforms:
  - windows
  for:
  - scripts
  - source
  - binaries
  id: vm-guest-agent-name-cluster
  desc: References multiple hypervisor guest-agent names
  crit: notable
  conf: 0.9
  needs: 3
  any:
  - id: micro-behaviors/process/info/name::vboxservice-name
  - id: micro-behaviors/process/info/name::vm-guest-tray-process-name
  - id: micro-behaviors/process/info/name::proc-prl-tools
  - id: micro-behaviors/process/info/name::proc-xenservice
  - id: micro-behaviors/process/info/name::proc-spice-vdagent
  - id: micro-behaviors/process/info/name::vmtoolsd-name
  - id: micro-behaviors/process/info/name::qemu-guest-agent-name-reference
defaults: {}
