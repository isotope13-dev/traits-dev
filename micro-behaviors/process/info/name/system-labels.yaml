defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  - id: system-associated-process-labels
    desc: References system-associated process labels
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/process/info/name::masq-realtek
      - id: micro-behaviors/process/info/name::masq-windowsupdate
      - id: micro-behaviors/process/info/name::masq-svchost
      - id: micro-behaviors/process/info/name::lsass-target-token
