# Product/process name references are neutral context, not proof of targeting.
defaults:
  for:
  - binaries
  - scripts
  platforms:
  - windows
  - linux
  crit: notable
  conf: 0.9
traits:
- id: ics-process-plc
  desc: PLC controller process name reference
  if:
    type: text
    regex: (?i)\b(DesalPLC|WaterPLC|OsmosisPLC|ROController)\b
- id: ics-process-scada-generic-name-1
  desc: SCADA product name reference
  if:
    type: text
    regex: \b((?i:ScadaBR|WinCC)|iFIX)\b
- id: ics-process-scada-generic-name-2
  desc: SCADA runtime name reference
  if:
    type: text
    regex: (?i)\b(FactoryTalk|Wonderware\s+InTouch|AVEVA\s+InTouch)\b
- id: ics-process-water-treatment-name-1
  desc: Water-treatment controller name reference
  if:
    type: text
    regex: (?i)\b(ChlorineCtrl|ChlorineDose|WaterTreat)\b
- id: ics-process-water-treatment-name-2
  desc: Water-process controller name reference
  if:
    type: text
    regex: (?i)\b(BrineControl|SalinityCtrl)\b
- id: ics-process-reverse-osmosis-name-1
  desc: Reverse-osmosis process name reference
  if:
    type: text
    regex: (?i)\b(ReverseOsmosis|RO[-_]?(Pump|Filter|Membrane))\b
- id: ics-process-reverse-osmosis-name-2
  desc: RO controller name reference
  if:
    type: text
    regex: (?i)\b(SeaWaterRO|SchneiderRO)\b
- id: ics-process-reverse-osmosis-name-3
  desc: RO service name reference
  if:
    type: text
    regex: (?i)\b(DamRO|DesalFlow)[-_]?(Controller|Service|Process)\b
- id: ics-process-power-grid-name-1
  desc: Power dispatch process name reference
  if:
    type: text
    regex: (?i)\b(GridController|LoadDispatch)\b
- id: ics-process-power-grid-name-2
  desc: Grid control process name reference
  if:
    type: text
    regex: (?i)\b(BreakerCtrl|FrequencyCtrl|SubstationMgr|PowerSCADA)\b
- id: ics-process-gas-pipeline-name-1
  desc: Pipeline controller name reference
  if:
    type: text
    regex: (?i)\b(PipelineCtrl|CompressorCtrl|GasFlowCtrl)\b
- id: ics-process-gas-pipeline-name-2
  desc: Gas-process controller name reference
  if:
    type: text
    regex: (?i)\b(PressureMonitor|GasLeakDetect)\b
- id: ics-vendor-process-name-1
  desc: Industrial engineering process name context
  if:
    type: text
    regex: (?i)\b(RSLogix|TIA\s*Portal)\b.{0,40}(\.exe\b|service\b)
- id: ics-vendor-process-name-2
  desc: Industrial HMI process name context
  if:
    type: text
    regex: (?i)\b(Citect|Wonderware|GE\s*Proficy)\b.{0,40}(\.exe\b|service\b)
- id: ics-vendor-process-name-3
  desc: Industrial engineering process-name wording
  if:
    type: text
    regex: '(?i)\b(RSLogix|TIA\s*Portal|Citect)\b.{0,40}(process\b|Program Files)'
- id: ics-vendor-process-name-4
  desc: Industrial HMI process-name wording
  if:
    type: text
    regex: '(?i)\b(Wonderware|GE\s*Proficy)\b.{0,40}(process\b|Program Files)'
composite_rules:
- id: ics-process-scada-generic
  desc: Industrial scada generic name references
  any:
  - id: ics-process-scada-generic-name-1
  - id: ics-process-scada-generic-name-2
- id: ics-process-water-treatment
  desc: Industrial water treatment name references
  any:
  - id: ics-process-water-treatment-name-1
  - id: ics-process-water-treatment-name-2
- id: ics-process-reverse-osmosis
  desc: Industrial reverse osmosis name references
  any:
  - id: ics-process-reverse-osmosis-name-1
  - id: ics-process-reverse-osmosis-name-2
  - id: ics-process-reverse-osmosis-name-3
- id: ics-process-power-grid
  desc: Industrial power grid name references
  any:
  - id: ics-process-power-grid-name-1
  - id: ics-process-power-grid-name-2
- id: ics-process-gas-pipeline
  desc: Industrial gas pipeline name references
  any:
  - id: ics-process-gas-pipeline-name-1
  - id: ics-process-gas-pipeline-name-2
- id: ics-vendor-process
  desc: Industrial vendor name references
  any:
  - id: ics-vendor-process-name-1
  - id: ics-vendor-process-name-2
  - id: ics-vendor-process-name-3
  - id: ics-vendor-process-name-4
- id: ics-process-name-enumeration
  desc: Process enumeration beside industrial software names
  all:
  - id: micro-behaviors/process/enumerate
  needs: 2
  any:
  - id: ics-process-plc
  - id: ics-process-scada-generic
  - id: ics-process-water-treatment
  - id: ics-process-reverse-osmosis
  - id: ics-process-power-grid
  - id: ics-process-gas-pipeline
  - id: ics-vendor-process
  unless:
  - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-list
  - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-leaf
  - id: micro-behaviors/metaprogramming/generation/source::configured-source-builder
