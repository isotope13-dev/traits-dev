defaults:
  platforms: [windows]
  for: [pe, dll, rust, powershell, batch]
traits:
  - id: lsass-executable-reference
    desc: References the LSASS executable name
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\blsass\.exe\b'
    unless:
      - id: well-known/app/utility/siw::siw-family-identity
composite_rules:
- id: lsass-process-reference
  for: [pe, dll]
  desc: LSASS executable or system path reference
  crit: notable
  conf: 0.94
  any:
  - id: micro-behaviors/process/info/name::lsass-executable-reference
  - id: micro-behaviors/fs/path/system::lsass-system-path
  unless:
  - id: well-known/tool/offensive/peas/
  # Wine builtin DLLs reimplement the Windows API surface and carry the originals metadata by design.
  - id: metadata/lang/upstream::windows-system-implementer-dll
  - id: well-known/app/utility/siw::siw-family-identity
  # Service control and logon components name LSASS because they manage it.
  - id: well-known/app/system/reactos::system-component
  # An anti-malware or system-maintenance engine names lsass.exe in its
  # protected-process and self-defence tables; IObit Malware Fighter's GUI and
  # service and Advanced SystemCare's ASC.exe / ASCService.exe / diagnosis.exe
  # all embed the bare string with no dumping API around it. Widened from the
  # Malware Fighter product to the signed-IObit-component context, which is
  # what four other traits already use for this vendor.
  - id: well-known/app/system/iobit::iobit-component-context
  # The Aha sandbox lists Windows process names, including lsass.exe.
  - id: well-known/app/ai/trae::aha-sandbox-pdb
  # AngelDriver cheat protection driver and game cheats whitelist critical system processes from threatkill.
  - id: well-known/game/cheat/
