defaults:
  platforms: [windows]
  for: [pe, dll, rust, powershell, batch]
traits:
  - id: lsass-executable-reference
    desc: References the LSASS executable name
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\blsass\.exe\b'
composite_rules:
- id: lsass-process-reference
  for: [pe, dll]
  desc: LSASS executable or system path reference
  crit: notable
  conf: 0.94
  any:
  - id: micro-behaviors/process/info/name::lsass-executable-reference
  - id: micro-behaviors/fs/path/binary::lsass-system-path
