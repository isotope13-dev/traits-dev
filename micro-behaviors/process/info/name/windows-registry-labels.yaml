---
defaults:
  platforms:
  - windows
traits:
- id: windows-system-image-name-group-a
  desc: Windows core process image names
  crit: component
  conf: 0.8
  for:
  - go
  - pe
  - dll
  if:
    type: text
    regex: "(?i)\\b(explorer|svchost|lsass|csrss)\\.exe\\b"
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app/infrastructure/docker::source-tree
- id: windows-system-image-name-group-b
  desc: Windows service process image names
  crit: component
  conf: 0.8
  for:
  - go
  - pe
  - dll
  if:
    type: text
    regex: "(?i)\\b(smss|services|wininit|spoolsv)\\.exe\\b"
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app/infrastructure/docker::source-tree
- id: windows-system-image-name-group-c
  desc: Windows host process image names
  crit: component
  conf: 0.8
  for:
  - go
  - pe
  - dll
  if:
    type: text
    regex: "(?i)\\b(taskhostw|taskhost|audiodg|dwm)\\.exe\\b"
  unless:
  - id: metadata/signed/platform/
  - id: well-known/app/infrastructure/docker::source-tree
composite_rules:
- id: windows-system-name-references
  desc: Windows system name references
  crit: component
  conf: 0.85
  for:
  - go
  any:
  - id: micro-behaviors/os/application/target::windows-defender-identifier-reference
  - id: micro-behaviors/os/service/name::windows-service-label-references
  - id: micro-behaviors/process/info/name::windows-system-image-name-set
  unless:
  - id: well-known/app/infrastructure/docker::source-tree
- id: windows-system-image-name-set
  desc: Multiple Windows system image names
  crit: notable
  conf: 0.86
  for:
  - go
  needs: 2
  any:
  - id: micro-behaviors/process/info/name::windows-system-image-name-group-a
  - id: micro-behaviors/process/info/name::windows-system-image-name-group-b
  - id: micro-behaviors/process/info/name::windows-system-image-name-group-c
  unless:
  - id: well-known/app/infrastructure/docker::source-tree
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: metadata/package/testing/harness/unit::go-test
  - id: metadata/file/naming::test-directory-component
