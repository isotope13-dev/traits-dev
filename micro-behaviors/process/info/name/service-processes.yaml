defaults:
  platforms: [windows]
  for: [pe, dll, rust]
  crit: notable

traits:
  - id: csrss-executable-reference
    desc: References the CSRSS executable name
    conf: 0.75
    if:
      type: text
      regex: '(?i)csrss\.exe'
    unless:
      - type: text
        substr: DXGPROCESS for CSRSS.exe

  - id: services-executable-reference
    desc: References the Services executable name
    conf: 0.75
    if:
      type: text
      regex: '(?i)services\.exe'

  - id: winlogon-executable-reference
    desc: References the Winlogon executable name
    crit: notable
    conf: 0.82
    for: [pe, rust, powershell]
    if:
      type: text
      word: winlogon.exe

composite_rules:
  - id: windows-service-process-references
    desc: References Winlogon CSRSS Services or the System32 svchost path
    conf: 0.8
    any:
      - id: micro-behaviors/fs/path/system::system32-svchost-path
      - id: winlogon-executable-reference
      - id: csrss-executable-reference
      - id: services-executable-reference
