# FileSystemObject.BuildPath joins a core Windows process image name
# (svchost.exe, lsass.exe, ...) onto a folder held in a variable: the script
# addresses an executable with a system name outside the system directory.
defaults:
  platforms: [windows]
  for: [vbs, html]

traits:
  - id: wsh-buildpath-core-process-name
    desc: Builds a path to system-named executable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)BuildPath\s*\(\s*\w+\s*,\s*"(svchost|lsass|csrss|winlogon|smss|services)\.exe"'
