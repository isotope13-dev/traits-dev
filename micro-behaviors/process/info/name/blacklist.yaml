defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: blacklist-process-comm-diagnostic
    desc: Reports blacklist match on process name
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: 'blacklist comm: %s'
      section: rodata
  - id: blacklist-process-exe-diagnostic
    desc: Reports blacklist match on process executable
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: 'blacklist exe: %s'
      section: rodata
