# Neutral observations reviewed from stranded members.
defaults:
  platforms:
  - windows
  crit: notable
traits:
- id: taskmgr-executable-literal
  desc: Task Manager executable name literal
  conf: 0.78
  if:
    type: text
    exact: taskmgr.exe
  for:
  - pe
- id: mpcmdrun-executable-reference
  desc: Microsoft Defender command runner name
  conf: 0.95
  if:
    type: text
    regex: (?i)\bMpCmdRun\.exe\b
  unless:
  - id: well-known/app/utility/siw::siw-family-identity
  for:
  - scripts
  - binaries
  - data
