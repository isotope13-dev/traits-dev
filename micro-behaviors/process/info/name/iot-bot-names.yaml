defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: gafgyt-process-name-reference
    desc: References Gafgyt process name
    crit: notable
    conf: 0.97
    if:
      type: text
      word: gafgyt
      section: rodata

  - id: mirai-architecture-process-name-reference
    desc: References architecture-suffixed Mirai names
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\bmirai\.(arm|mips|mpsl)\b'
      section: rodata

composite_rules:
  - id: mirai-gafgyt-process-name-set
    desc: References Mirai architecture variants and Gafgyt names
    crit: notable
    conf: 0.99
    all:
      - id: mirai-architecture-process-name-reference
      - id: gafgyt-process-name-reference
