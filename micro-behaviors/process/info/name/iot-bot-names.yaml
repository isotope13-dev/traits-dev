defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: gafgyt-process-name-reference
    desc: References Gafgyt process name
    crit: notable
    conf: 0.97
    if:
      type: text
      word: gafgyt
      section: rodata

  - id: mirai-architecture-process-name-reference
    desc: References architecture-suffixed Mirai names
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\bmirai\.(arm|mips|mpsl)\b'
      section: rodata

  # Bare family names stored as whole strings are how IoT bots keep a table of
  # rival malware to evict.  Exact whole-string matches keep ordinary prose and
  # longer identifiers that merely contain the word out of scope.
  - id: kimwolf-process-name-reference
    desc: References Kimwolf process name
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: kimwolf

  - id: aisuru-process-name-reference
    desc: References Aisuru process name
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: aisuru

  - id: qbot-process-name-reference
    desc: References Qbot process name
    crit: notable
    conf: 0.85
    if:
      type: text
      exact: qbot

  - id: echobot-process-name-reference
    desc: References Echobot process name
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: echobot

  - id: bashlite-process-name-reference
    desc: References Bashlite process name
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: bashlite

composite_rules:
  - id: mirai-gafgyt-process-name-set
    desc: References Mirai architecture variants and Gafgyt names
    crit: notable
    conf: 0.99
    all:
      - id: mirai-architecture-process-name-reference
      - id: gafgyt-process-name-reference
