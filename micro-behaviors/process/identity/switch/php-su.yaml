defaults:
  platforms: [unix]
  for: [php]
traits:
  - id: php-shell-su-root
    desc: PHP shell call requests root through su
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^(system|exec|shell_exec|passthru)$'
      arg:
        index: 0
        kind: string
        regex: '^(/(usr/)?bin/)?su\s+(-\s+|--login\s+)?root(\s|$)'
