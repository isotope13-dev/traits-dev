defaults:
  platforms: [unix]
  for: [elf, macho]
composite_rules:
  - id: native-setid-shell-exec-references
    desc: Binary references set-ID, shell path and exec
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/process/identity/setuid::setuid-dup
      - id: micro-behaviors/fs/path/application/interpreter::bin-sh-path-reference
    any:
      - id: metadata/binary/symbols/name/process::execve-import
      - id: metadata/binary/symbols/name/process::exec-variant-symbol-text
    needs: 1
