defaults:
  platforms: [unix]
  for: [php]
  crit: notable
  conf: 0.9

traits:
  - id: posix-setuid
    desc: PHP changes process user ID
    if:
      type: symbol
      kind: call
      exact: posix_setuid

  - id: posix-setgid
    desc: PHP changes process group ID
    if:
      type: symbol
      kind: call
      exact: posix_setgid

  - id: posix-initgroups
    desc: PHP initializes supplementary groups
    if:
      type: symbol
      kind: call
      exact: posix_initgroups
