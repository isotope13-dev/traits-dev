traits:
  - id: setid-root-call-source
    desc: Source calls set*id with root ID 0
    platforms: [openwrt]
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      regex: '^(setuid|setgid|setreuid|setregid)$'
      arg:
        index: 0
        kind: number
        value: 0
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
