# Process Identity - Ruby
defaults:
  platforms: [unix]
traits:
  - id: ruby-setuid
    desc: Set user/group ID
    crit: notable
    conf: 0.93
    for: [ruby]
    if:
      type: symbol
      regex: "Process\\.setuid|Process\\.setgid|Process\\.seteuid|Process\\.setegid"
  # Text form so the call is still seen inside `ruby -e '...'` command lines
  # that do not parse as Ruby.
  - id: ruby-setuid-root-call-text
    desc: Ruby call sets user ID to root
    crit: notable
    conf: 0.9
    for: [ruby, shell]
    if:
      type: text
      regex: 'Process(::Sys)?\.set(e|re)?uid\(\s*0\s*[,)]'
