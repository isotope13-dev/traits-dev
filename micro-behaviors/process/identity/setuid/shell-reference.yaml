defaults:
  platforms: [unix]
  for: [elf, macho, c]
composite_rules:
  - id: setuid-shell-reference
    desc: Setuid API accompanies a /bin/sh reference
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/process/identity/setuid::setuid-dup
      - id: micro-behaviors/fs/path/application/executable::unix-shell-executable-path
    unless:
      - id: metadata/signed/platform::apple
    downgrade:
      any:
        - id: micro-behaviors/process/fork/clone::daemon-dup
  - id: setgid-shell-reference
    desc: Setgid API accompanies a /bin/sh reference
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/process/identity/setuid::setgid
      - id: micro-behaviors/fs/path/application/executable::unix-shell-executable-path
    unless:
      - id: metadata/signed/platform::apple
    downgrade:
      any:
        - id: micro-behaviors/process/fork/clone::daemon-dup

