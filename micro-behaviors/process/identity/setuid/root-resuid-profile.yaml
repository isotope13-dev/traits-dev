defaults:
  platforms: [unix]
  for: [c, cpp]

composite_rules:
  - id: root-setresuid-group-or-procfs-references
    for: [elf, class, c, kotlin]
    desc: Root setresuid with group setter or procfs memory references
    crit: notable
    conf: 0.98
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-rules-directory
      - id: well-known/app/ai/coding-agent/cursor-sandbox::cursor-sandbox-context
      # OpenSSH's configure.ac probes setresuid/setresgid and calls them in
      # an AC_RUN_IFELSE to check the platform honours them; that is the
      # autoconf feature test, not an escalation.
      - id: well-known/app/network/openssh::source-tree-path
      - id: well-known/app/network/openssh::portable-dev-list-address
      - id: well-known/app/network/openssh::solaris-package-init-variable
      # LXC sets UID/GID 0 while initializing a container's mapped identity;
      # its shared library also imports the same setters for callers, so those
      # references do not establish host privilege escalation.
      - id: metadata/path::lxc-runtime
      # Syscall test workloads (e.g. gVisor's trace workload) call each
      # setid variant as an isolated probe in its own test function; the
      # group setter there corroborates nothing about the root request.
      - id: metadata/file/profile/test-indications::testing-metadata-or-directory-name
    all:
      - id: micro-behaviors/process/identity/setuid::native-all-root-setresuid-reference
    # File-scoped co-occurrence, with no claim of privilege escalation.
    any:
      - id: micro-behaviors/process/identity/setuid::setgid
      - id: micro-behaviors/fs/proc/info/memory::c-procfs-mem-template
    needs: 1

