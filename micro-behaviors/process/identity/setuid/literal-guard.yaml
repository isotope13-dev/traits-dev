defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: notable
traits:
  - id: literal-guarded-root-uid-change
    desc: Literal-string equality guards setuid zero
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((if_statement
          condition: (parenthesized_expression
            (binary_expression
              left: (call_expression
                function: (identifier) @compare
                arguments: (argument_list (_) (string_literal)))
              operator: "=="
              right: (number_literal) @zero))
          consequence: (compound_statement
            (expression_statement
              (call_expression
                function: (identifier) @identity
                arguments: (argument_list (number_literal) @uid)))))
          (#eq? @compare "strcmp")
          (#eq? @zero "0")
          (#eq? @identity "setuid")
          (#eq? @uid "0"))
