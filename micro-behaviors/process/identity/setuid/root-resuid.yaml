defaults:
  platforms: [unix]
  for: [c, cpp]

traits:
  - id: native-all-root-setresuid-reference
    desc: References setresuid with all three UIDs zero
    crit: notable
    conf: 0.94
    for: [c, elf, kotlin, class]
    if:
      type: text
      # Normal C formatting puts spaces after the commas; the unspaced
      # spelling missed ordinarily formatted escalation stubs.
      regex: 'setresuid\s*\(\s*0\s*,\s*0\s*,\s*0\s*\)'
    unless:
      - id: well-known/app/system/samba::samba-source-tree
      # An autoconf feature probe compiles `setresuid(0,0,0)` to find out
      # whether the platform has it -- OpenSSH's configure.ac carries the
      # snippet verbatim and never runs it as the shipped program.
      - id: well-known/app/network/openssh::source-tree-path
      # Cursor's agent sandbox calls setresuid(0,0,0) inside a user namespace
      # to drop to "root" in the sandbox — not host privilege escalation.
      - id: well-known/app/ai/coding-agent/cursor-sandbox::cursor-sandbox-context
      - id: well-known/app/ai/coding-agent/cursor-sandbox::linux-sandbox-context
