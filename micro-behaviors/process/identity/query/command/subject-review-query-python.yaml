defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
  attack: T1033

traits:
  - id: python-subprocess-identity-command
    desc: Python subprocess runs an identity utility
    conf: 0.96
    if:
      # Require the identity utility to be the executable (the first argv
      # element), rather than merely a later argument or adjacent string.
      type: tree-sitter
      kind: call
      regex: '(?is)\bsubprocess\.(run|Popen|check_output)\s*\(\s*(\[\s*)?["''](/usr/bin/)?(id|whoami)["'']'

