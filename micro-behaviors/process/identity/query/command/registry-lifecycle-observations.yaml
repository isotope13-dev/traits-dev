defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source, manifests, documents, media, data]

traits:
- id: package-id-command-substitution
  desc: Package text uses id command substitution
  crit: notable
  conf: 0.93
  attack: T1033
  for: [package.json]
  if:
    type: text
    substr: $(id)
