defaults:
  platforms: [unix, windows]
traits:
  - id: python-whoami-then-pwd
    desc: Python whoami then pwd command
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '\b(subprocess|os)\.[A-Za-z_]+\([^)]{0,100}\bwhoami\b[;&|]+\s*(/bin/)?pwd\b'
  - id: python-pwd-then-whoami
    desc: Python pwd then whoami command
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '\b(subprocess|os)\.[A-Za-z_]+\([^)]{0,100}\b(/bin/)?pwd\b[;&|]+\s*whoami\b'
composite_rules:
  - id: whoami-pwd-pair
    desc: Adjacent whoami and pwd commands
    crit: notable
    conf: 0.86
    for: [shell, python]
    any:
      - id: micro-behaviors/process/identity/query/reference::whoami-then-pwd
      - id: micro-behaviors/process/identity/query/reference::pwd-then-whoami
      - id: micro-behaviors/process/identity/query/command::python-whoami-then-pwd
      - id: micro-behaviors/process/identity/query/command::python-pwd-then-whoami
