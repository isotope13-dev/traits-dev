defaults:
  platforms: ["unix", "windows"]
  for: ["javascript"]

traits:
  - id: npm-postinstall-whoami-logname-pipe-curl
    desc: Postinstall pipes whoami or logname into curl
    crit: component
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '(?i)\b(whoami(\.exe)?|logname)\b["'']?\s*\|\s*curl\b'
  - id: npm-postinstall-id-user-pipe-curl
    desc: Postinstall pipes id username into curl
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '(?i)\bid\s+-(un|u\s+-n|n\s+-u)\b["'']?\s*\|\s*curl\b'
  - id: npm-postinstall-user-env-pipe-curl
    desc: Postinstall pipes user environment into curl
    crit: notable
    conf: 0.99
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '(?i)\b(echo|printf)\s+["'']?\$\{?(USER|USERNAME)\}?["'']?\s*\|\s*curl\b'
composite_rules:
  - id: npm-postinstall-user-source-pipe-curl
    desc: Postinstall pipes a user query into curl
    crit: component
    conf: 0.99
    for: [package.json]
    any:
      - id: micro-behaviors/process/identity/query/command::npm-postinstall-whoami-logname-pipe-curl
      - id: micro-behaviors/process/identity/query/command::npm-postinstall-id-user-pipe-curl
      - id: micro-behaviors/process/identity/query/command::npm-postinstall-user-env-pipe-curl
