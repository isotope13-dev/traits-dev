defaults:
  for: [manifests]
  platforms: [unix, windows]
traits:
  - id: preinstall-info-field-hostname-whoami-pwd
    desc: Preinstall info field captures host user cwd
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: 'info=$(hostname && whoami && pwd)'
    unless:
      - id: metadata/file/catalog/pattern-rules::cleave-trait-definition-file
