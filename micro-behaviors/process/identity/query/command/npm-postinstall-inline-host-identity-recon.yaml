defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: inline-host-identity-recon
  desc: Postinstall references id and hostname commands
  crit: notable
  conf: 0.98
  if:
    type: value
    path: scripts.postinstall
    regex: "execSync\\([^)]{0,160}\\bid\\b.{0,100}\\bhostname\\b"
