defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  attack: T1033
traits:
  - id: execsync-quoted-whoami
    desc: execSync runs quoted whoami
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: (?i)\bexecSync\s*\(\s*['"]whoami['"]
  - id: execsync-shell-id-command
    desc: execSync runs id via shell string
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: (?i)\bexecSync\s*\(\s*["']id[\s;|&]
  - id: shell-substitution-user-cwd-query
    desc: Shell substitution queries user and cwd
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "\\$\\(\\s*whoami\\s*\\).{0,160}\\$\\(\\s*pwd\\s*\\)"
  - id: node-exec-shell-recon-chain
    desc: Node exec runs shell recon chain
    crit: suspicious
    conf: 0.92
    attack: T1033,T1082
    if:
      type: text
      regex: (?i)\bexec(Sync)?\s*\(\s*['"]whoami\s*&&\s*pwd\s*&&\s*ls\b
  # Shell identity query embedded in a JS string: the $(...) spelling only
  # executes inside a shell, so in JS source it marks a shell-out to whoami
  # (typically an exec/spawn argument). Sibling shell/manifest atoms do not
  # cover this file type.
  - id: js-shell-whoami-substitution
    desc: JS-embedded shell queries whoami
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "$(whoami)"
