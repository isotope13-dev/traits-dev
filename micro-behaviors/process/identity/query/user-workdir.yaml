# Neutral identity/work-directory queries; adjacency does not establish intent.
# Relocated from objectives/discovery/system/fingerprint/user.
defaults:
  platforms: [unix, windows]
traits:
  - id: whoami-then-pwd
    desc: whoami followed by pwd command text
    crit: notable
    conf: 0.86
    for: [shell]
    if:
      type: text
      regex: '\bwhoami(\.exe)?\b\s*[;&|]+\s*(/bin/)?pwd\b'
  - id: pwd-then-whoami
    desc: pwd followed by whoami command text
    crit: notable
    conf: 0.86
    for: [shell]
    if:
      type: text
      regex: '\b(/bin/)?pwd\b\s*[;&|]+\s*whoami(\.exe)?\b'
  - id: python-whoami-then-pwd
    desc: Python whoami then pwd command
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '\b(subprocess|os)\.[A-Za-z_]+\([^)]{0,100}\bwhoami\b[;&|]+\s*(/bin/)?pwd\b'
  - id: python-pwd-then-whoami
    desc: Python pwd then whoami command
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '\b(subprocess|os)\.[A-Za-z_]+\([^)]{0,100}\b(/bin/)?pwd\b[;&|]+\s*whoami\b'
composite_rules:
  - id: whoami-pwd-pair
    desc: Adjacent whoami and pwd commands
    crit: notable
    conf: 0.86
    for: [shell, python]
    any:
      - id: whoami-then-pwd
      - id: pwd-then-whoami
      - id: python-whoami-then-pwd
      - id: python-pwd-then-whoami
  - id: user-info
    desc: Current-user query or account-file reference
    crit: notable
    conf: 0.7
    any:
      - id: whoami-pwd-pair
      - id: micro-behaviors/process/user/query::host-user-pwd-chain
      - id: micro-behaviors/process/user/query::whoami-cmd
      - id: micro-behaviors/fs/path/config/accounts::account-files
      - id: micro-behaviors/os/env/read::user-home-env-pair
    unless:
      - id: well-known/app/system/drivers/
