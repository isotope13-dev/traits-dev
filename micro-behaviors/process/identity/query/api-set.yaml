# Aggregates process IDs as well as user/group IDs; it is not a user-only lookup.
composite_rules:
  - id: process-user-identity-api-set
    desc: Process, user or group identity APIs
    crit: notable
    conf: 0.85
    platforms: [unix, windows]
    any:
      - id: getuid-console-command-line
      - id: python-current-username
      - id: applescript-shell-whoami
      - id: os-getuid
      - id: node-os-alias-userinfo-call
      - id: os-userinfo-call
      - id: os-userinfo-username-read
      - id: node-os-alias-homedir-call
      - id: node-bracket-homedir-call
      - id: os-homedir-call
      - id: execsync-quoted-whoami
      - id: execsync-shell-id-command
      - id: shell-substitution-user-cwd-query
      - id: node-exec-shell-recon-chain
      - id: js-shell-whoami-substitution
      - id: console-user-stat-command
      - id: nsusername
      - id: node-runs-id
      - id: node-shell-id-command
      - id: npm-postinstall-os-userinfo-call
      - id: perl-getpwuid
      - id: perl-getpwnam
      - id: perl-win32-login-name
      - id: c-process-identity-command
      - id: identity-command-token
      - id: identity-command-substitution
      - id: getlogin
      - id: getpwnam
      - id: hostname-pwd-whoami
      - id: whoami-hostname-pwd
      - id: hostname-whoami-pwd
      - id: shell-user-field-capture
      - id: whoami-command-substitution
      - id: shell-home-field-capture
      - id: shell-pwd-field-capture
      - id: whoami-command-separator
      - id: whoami-command-backtick
      - id: whoami-command-quoted
      - id: whoami-exec-argument
      - id: logname-exec-argument
      - id: id-u-cmd
      - id: shell-capture-numeric-uid
      - id: id-cmd
      - id: id-cmd-shell
      - id: id-and-ls-recon
      - id: os-getlogin-python
      - id: host-user-pwd-chain
      - id: whoami-cmd
      - id: python-subprocess-identity-command
      - id: python-getpass-user
      - id: python-getuser-call
      - id: python-normalized-user
      - id: python-user-substring-condition
      - id: python-literal-user-substring-test
      - id: python-imported-getpass-user
      - id: python-normalized-username-substring
      - id: ruby-process-uid
      - id: ruby-process-gid
      - id: ruby-etc-user-lookup
      - id: rust-command-whoami
      - id: shell-whoami-command
      - id: groovy-identity-command-string
      - id: vbscript-username-property
      - id: windows-whoami-script-command
      - id: windows-whoami-binary-command
      - id: dotnet-user-name
      - id: windows-whoami-command
      - id: ruby-process-pid
      - id: ruby-process-ppid
      - id: getpid
      - id: getpid-text
      - id: gettid
      - id: getppid
      - id: getppid-text
      - id: get-uid
      - id: whoami-then-pwd
      - id: pwd-then-whoami
      - id: python-whoami-then-pwd
      - id: python-pwd-then-whoami
      - id: whoami-pwd-pair
      - id: user-info
      - id: micro-behaviors/os/user/lookup::getpwuid
    downgrade:
      # Preserve the moved lookup's effective level in ordinary runtimes.
      any:
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiled/
        - id: metadata/file/string/identity::system-shell-basename
