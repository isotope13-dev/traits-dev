defaults:
  for: [elf, macho, c]
  platforms:
    - linux
    - macos
  crit: notable
  mbc: E1033
  attack: T1033
traits:
  - id: identity-command-token
    desc: Shell text contains an identity command
    crit: notable
    conf: 0.96
    # Includes command text in quoted payloads; this is not proof of local
    # invocation. Shell separators are meaningful syntax in shell source. In native
    # binaries, unrelated Go string-table entries can abut as `;id` and make
    # the same byte regex look like a command that is never executed.
    for: [shell]
    if:
      type: text
      regex: '(?im)(^|[;&|][ \t]*)(id|whoami)([ \t;&|]|$)'
  # Bare `id` in single backticks is routinely a prose field-name reference
  # (record `id`, card `<id>`), not a shell substitution; the backtick branch
  # therefore requires flags or arguments (e.g. `id -u`). The $(...) branch
  # keeps its bare form since $( is shell-specific syntax.
