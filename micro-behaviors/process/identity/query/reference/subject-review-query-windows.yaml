defaults:
  crit: notable
  platforms: [windows]
  for: [batch, powershell, shell, binaries]
  attack: T1033
traits:
  - id: windows-whoami-binary-command
    desc: Windows whoami executable reference
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)(whoami\.exe\b|cmd(\.exe)?\s+/(c|k).{0,48}\bwhoami\b)'
  - id: dotnet-user-name
    desc: References .NET Environment UserName
    conf: 0.9
    for: [powershell, csharp]
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '(?i)(System\.)?Environment\]?(::|\.)UserName\b'
composite_rules:
  - id: windows-whoami-command
    desc: Windows whoami command reference
    conf: 0.9
    for: [batch, powershell, pe, dll]
    any:
      - id: micro-behaviors/process/identity/query/command::windows-whoami-script-command
      - id: micro-behaviors/process/identity/query/reference::windows-whoami-binary-command
