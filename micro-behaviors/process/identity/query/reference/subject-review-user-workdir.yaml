defaults:
  platforms: [unix, windows]
traits:
  - id: whoami-then-pwd
    desc: whoami followed by pwd command text
    crit: notable
    conf: 0.86
    for: [shell]
    if:
      type: text
      regex: '\bwhoami(\.exe)?\b\s*[;&|]+\s*(/bin/)?pwd\b'
  - id: pwd-then-whoami
    desc: pwd followed by whoami command text
    crit: notable
    conf: 0.86
    for: [shell]
    if:
      type: text
      regex: '\b(/bin/)?pwd\b\s*[;&|]+\s*whoami(\.exe)?\b'
composite_rules:
  - id: user-info
    desc: Current-user query or account-file reference
    crit: notable
    conf: 0.7
    any:
      - id: micro-behaviors/process/identity/query/command::whoami-pwd-pair
      - id: micro-behaviors/process/identity/query/principal::host-user-pwd-chain
      - id: micro-behaviors/process/identity/query/command::whoami-cmd
      - id: micro-behaviors/fs/path/config/accounts::account-files
      - id: micro-behaviors/os/env/user-info::user-home-env-pair
