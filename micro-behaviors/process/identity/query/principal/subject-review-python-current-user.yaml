defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

composite_rules:
  - id: python-current-username
    desc: Queries the current Python process username
    conf: 0.85
    any:
      - id: micro-behaviors/process/identity/query/principal::python-getpass-user
      - id: micro-behaviors/process/identity/query/principal::python-imported-getpass-user
      - id: micro-behaviors/process/identity/query/principal::os-getlogin-python
