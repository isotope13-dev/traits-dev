defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
  attack: T1033

traits:
  - id: python-getpass-user
    desc: Reads the current user through Python getpass
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: getpass.getuser

  - id: python-getuser-call
    desc: Calls an imported getuser function
    crit: component
    conf: 0.75
    if:
      type: symbol
      kind: call
      exact: getuser

  - id: python-normalized-user
    desc: Normalizes a current-user value for comparison
    conf: 0.88
    if:
      type: text
      regex: 'getpass\.getuser\s*\(\s*\)\s*\.\s*(lower|casefold)\s*\('

  - id: python-literal-user-substring-test
    desc: Tests literal substring against username
    conf: 0.88
    if:
      type: text
      regex: '["''][\w-]{3,}["'']\s+(not\s+in|in)\s+\w*user(name|_name|_id)?\b'
      case_insensitive: true

composite_rules:
  - id: python-user-substring-condition
    desc: User lookup near literal substring exclusion
    conf: 0.88
    all:
      - id: python-getpass-user
      - id: micro-behaviors/data/string/compare::python-user-variable-substring-exclusion
    near_bytes: 256

  - id: python-imported-getpass-user
    desc: Reads the current user through imported getpass
    conf: 0.94
    all:
      - id: metadata/import/builtin::python-getpass-module-import
      - id: micro-behaviors/process/identity/query/principal::python-getuser-call

  - id: python-normalized-username-substring
    desc: Tests a normalized Python username for a literal substring
    conf: 0.96
    all:
      - id: micro-behaviors/process/identity/query/principal::python-getpass-user
      - id: micro-behaviors/process/identity/query/principal::python-normalized-user
      - id: micro-behaviors/process/identity/query/principal::python-literal-user-substring-test
    near_lines: 8
