defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: preinstall-node-os-userinfo
  desc: Preinstall queries Node username
  crit: notable
  conf: 0.96
  if:
    type: value
    path: "scripts.preinstall"
    # The module is often assigned once and then used through an alias in
    # inline install scripts (e.g. `const o = require('os')`).
    regex: "require\\([\"']os[\"']\\)(\\.userInfo\\(\\)\\.username|.{0,300}\\b\\w+\\.userInfo\\(\\)\\.username)"
