# Splitting the running module's own directory on backslashes and taking the
# third component reads the account name out of `C:\Users\<name>\...`: the
# user's profile root recovered without asking the OS for it.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
traits:
  - id: js-username-from-module-path
    desc: Derives username from module directory path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '__dirname\.split\(\s*["''`]\\\\["''`]\s*\)\[2\]'
