defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85

traits:
- id: js-execsync-whoami
  desc: JavaScript runs whoami command
  crit: notable
  conf: 0.9
  attack: "T1033"
  if:
    type: value
    path: "scripts.preinstall"
    regex: '(?i)(execSync|spawnSync|child_process|node\s+-e).{0,160}\bwhoami\b'
  unless:
    - type: value
      path: scripts.preinstall
      regex: '\$\(whoami\)'
