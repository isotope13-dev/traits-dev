defaults:
  for: [elf, macho, c]
  platforms:
    - linux
    - macos
  crit: notable
  mbc: E1033
  attack: T1033
traits:
  - id: getlogin
    desc: Get login name
    conf: 0.5
    if:
      type: symbol
      regex: getlogin
  - id: getpwnam
    desc: Resolve username to password entry
    crit: baseline
    conf: 0.4
    for:
      - elf
      - macho
    if:
      type: symbol
      exact: getpwnam
  - id: logname-exec-argument
    desc: logname passed to a process-exec call
    crit: notable
    conf: 0.9
    for: [shell, python, javascript, ruby, go, php, perl]
    if:
      type: symbol
      kind: call
      regex: '^(system|popen|exec|run)\w*$'
      arg:
        kind: string
        exact: logname
  - id: id-u-cmd
    desc: id -u command
    conf: 0.5
    if:
      type: text
      substr: id -u
  - id: id-cmd
    desc: id command (with path)
    conf: 0.5
    if:
      type: text
      substr: /bin/id
  - id: id-and-ls-recon
    desc: id and ls recon command chain
    crit: notable
    conf: 0.7
    if:
      type: raw
      regex: '\bid\s*&&\s*ls\s'
  - id: os-getlogin-python
    desc: os.getlogin() Python username call
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: text
      regex: os\.getlogin\s*\(
composite_rules:
  - id: host-user-pwd-chain
    desc: Host user directory recon command chain
    crit: suspicious
    conf: 0.9
    any:
      - id: micro-behaviors/process/identity/query/command::hostname-pwd-whoami
      - id: micro-behaviors/process/identity/query/command::whoami-hostname-pwd
      - id: micro-behaviors/process/identity/query/command::hostname-whoami-pwd
