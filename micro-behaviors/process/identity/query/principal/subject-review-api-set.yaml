composite_rules:
  - id: process-user-identity-api-set
    desc: Process, user or group identity APIs
    crit: notable
    conf: 0.85
    platforms: [unix, windows]
    any:
      - id: micro-behaviors/process/identity/query/command/
      - id: micro-behaviors/process/identity/query/principal::python-current-username
      - id: micro-behaviors/process/identity/query/principal::os-getuid
      - id: micro-behaviors/process/identity/query/principal::node-os-alias-userinfo-call
      - id: micro-behaviors/process/identity/query/principal::os-userinfo-call
      - id: micro-behaviors/process/identity/query/principal::os-userinfo-username-read
      - id: micro-behaviors/process/identity/query/principal::node-os-alias-homedir-call
      - id: micro-behaviors/process/identity/query/principal::node-bracket-homedir-call
      - id: micro-behaviors/process/identity/query/principal::os-homedir-call
      - id: micro-behaviors/process/identity/query/principal::nsusername
      - id: micro-behaviors/process/identity/query/principal::node-runs-id
      - id: micro-behaviors/process/identity/query/principal::npm-postinstall-os-userinfo-call
      - id: micro-behaviors/process/identity/query/principal::perl-getpwuid
      - id: micro-behaviors/process/identity/query/principal::perl-getpwnam
      - id: micro-behaviors/process/identity/query/principal::perl-win32-login-name
      - id: micro-behaviors/process/identity/query/reference::identity-command-token
      - id: micro-behaviors/process/identity/query/principal::getlogin
      - id: micro-behaviors/process/identity/query/principal::getpwnam
      - id: micro-behaviors/process/identity/query/principal::logname-exec-argument
      - id: micro-behaviors/process/identity/query/principal::id-u-cmd
      - id: micro-behaviors/process/identity/query/principal::id-cmd
      - id: micro-behaviors/process/identity/query/principal::id-and-ls-recon
      - id: micro-behaviors/process/identity/query/principal::os-getlogin-python
      - id: micro-behaviors/process/identity/query/principal::host-user-pwd-chain
      - id: micro-behaviors/process/identity/query/principal::python-getpass-user
      - id: micro-behaviors/process/identity/query/principal::python-getuser-call
      - id: micro-behaviors/process/identity/query/principal::python-normalized-user
      - id: micro-behaviors/process/identity/query/principal::python-user-substring-condition
      - id: micro-behaviors/process/identity/query/principal::python-literal-user-substring-test
      - id: micro-behaviors/process/identity/query/principal::python-imported-getpass-user
      - id: micro-behaviors/process/identity/query/principal::python-normalized-username-substring
      - id: micro-behaviors/process/identity/query/principal::ruby-process-uid
      - id: micro-behaviors/process/identity/query/principal::ruby-process-gid
      - id: micro-behaviors/process/identity/query/principal::ruby-etc-user-lookup
      - id: micro-behaviors/process/identity/query/principal::vbscript-username-property
      - id: micro-behaviors/process/identity/query/reference::windows-whoami-binary-command
      - id: micro-behaviors/process/identity/query/reference::dotnet-user-name
      - id: micro-behaviors/process/identity/query/reference::windows-whoami-command
      - id: micro-behaviors/process/identity/query/process::ruby-process-pid
      - id: micro-behaviors/process/identity/query/process::ruby-process-ppid
      - id: micro-behaviors/process/identity/query/process::getpid
      - id: micro-behaviors/process/identity/query/process::getpid-text
      - id: micro-behaviors/process/identity/query/process::gettid
      - id: micro-behaviors/process/identity/query/process::getppid
      - id: micro-behaviors/process/identity/query/process::getppid-text
      - id: micro-behaviors/process/identity/query/principal::get-uid
      - id: micro-behaviors/process/identity/query/reference::whoami-then-pwd
      - id: micro-behaviors/process/identity/query/reference::pwd-then-whoami
      - id: micro-behaviors/process/identity/query/reference::user-info
      - id: micro-behaviors/os/user/lookup::getpwuid
    downgrade:
      # Preserve the moved lookup's effective level in ordinary runtimes.
      any:
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiled/
        - id: micro-behaviors/fs/path/application/interpreter::system-shell-basename
