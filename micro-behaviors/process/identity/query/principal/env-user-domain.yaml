defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # USERDOMAIN is a Windows-only environment variable. Its name alone is
  # identity evidence: scripts read it to label the logged-on account.
  - id: node-env-user-domain
    desc: Reads the Windows USERDOMAIN variable
    crit: notable
    conf: 0.85
    if:
      type: text
      word: "USERDOMAIN"
