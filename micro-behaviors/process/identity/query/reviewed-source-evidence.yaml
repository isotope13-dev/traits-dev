composite_rules:
- platforms:
  - linux
  - macos
  - windows
  for:
  - shell
  size_max: 5000000
  id: whoami-cmd-shell
  desc: Shell whoami command reference
  crit: notable
  conf: 0.55
  any:
  - id: micro-behaviors/process/identity/query::whoami-command-separator
  - id: micro-behaviors/process/identity/query::whoami-command-backtick
  - id: micro-behaviors/process/identity/query::whoami-command-quoted
  - id: micro-behaviors/process/identity/query::whoami-exec-argument
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
