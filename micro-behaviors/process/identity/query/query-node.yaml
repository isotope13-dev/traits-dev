defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  attack: T1033

traits:
  # The call target has to be a child-process launcher. Matching any callee at
  # all made `C("id")`, `t("id")`, and every other one-argument accessor in a
  # minified bundle read as a `id(1)` invocation.
  - id: node-shell-id-command
    desc: Child process runs the id command
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      regex: '\b(exec|spawn)\w*\s*\(\s*["'']id["'']\s*[,)]'
