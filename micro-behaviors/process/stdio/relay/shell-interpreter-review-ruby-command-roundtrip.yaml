defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
- id: ruby-stream-command-roundtrip
  desc: Executes stream input and returns command output
  crit: notable
  conf: 0.99
  if:
    type: tree-sitter
    language: ruby
    query: |
      (while
        condition: (assignment left: (identifier) @command
          right: (call receiver: (identifier) @socket method: (identifier) @read))
        body: (do
          (call receiver: (constant) @open3 method: (identifier) @popen
            arguments: (argument_list . (string . (interpolation (identifier) @input) .) .)
            block: (do_block
              parameters: (block_parameters . (identifier) (identifier) @stdout (identifier)? .)
              body: (body_statement
                (call receiver: (constant) @io method: (identifier) @copy
                  arguments: (argument_list . (identifier) @output . (identifier) @destination .))))))
        (#eq? @read "gets") (#eq? @open3 "Open3") (#eq? @popen "popen2e")
        (#eq? @io "IO") (#eq? @copy "copy_stream")
        (#eq? @command @input) (#eq? @stdout @output)
        (#eq? @socket @destination)) @command_loop
      (while
        condition: (assignment left: (identifier) @command
          right: (call receiver: (identifier) @socket method: (identifier) @read))
        body: (do
          (call receiver: (constant) @open3 method: (identifier) @popen
            arguments: (argument_list . (string . (interpolation (identifier) @input) .) .)
            block: (do_block
              parameters: (block_parameters . (identifier) (identifier) @stdout (identifier)? .)
              body: (body_statement
                (call receiver: (identifier) @destination method: (identifier) @write
                  arguments: (argument_list . (call receiver: (identifier) @output method: (identifier) @read_output) .))))))
        (#eq? @read "gets") (#eq? @open3 "Open3") (#eq? @popen "popen2e")
        (#eq? @write "write") (#eq? @read_output "read")
        (#eq? @command @input) (#eq? @stdout @output)
        (#eq? @socket @destination)) @command_loop
