defaults:
  platforms:
    - windows
    - unix
  for:
    - go
  crit: notable
  conf: 0.93
composite_rules:
  - id: go-stdin-copy-and-send
    desc: Go reads stdin, copies data, and sends
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/data/buffer/transfer::go-io-copy
      - id: micro-behaviors/process/stdio/read::go-stdin-read-call
    any:
      - id: micro-behaviors/communications/socket/send
