                      )
                    )
                  )
                ) or (
                  pe.machine == pe.MACHINE_I386 and
                  for any i in (1..#si_x86) : (
                    @si_x86[i] >= sec.raw_data_offset and
                    @si_x86[i] < sec.raw_data_offset + sec.raw_data_size and
                    for any j in (1..#rf_x86) : (
                      @rf_x86[j] > @si_x86[i] and @rf_x86[j] <= @si_x86[i] + 480 and
                      for all e in (@si_x86[i] .. @rf_x86[j]) : (
                        not (
                          (uint8(e) == 0x5b or uint8(e) == 0x5d or uint8(e) == 0x5e or uint8(e) == 0x5f or uint8(e) == 0xc9) and
                          (uint8(e + 1) == 0xc3 or uint8(e + 1) == 0xc2)
                        )
                      )
                    )
                  )
                )
              )
            )
        }

  - id: c-same-func-pipe-spawn-and-winsock-send
    desc: Spawns piped child and sends output
    conf: 0.96
    for: [c, cpp]
    if:
      type: tree-sitter
      query: |
        ((function_definition
          body: (compound_statement) @body) @evidence
          (#match? @body "\\bCreatePipe\\s*\\(")
          (#match? @body "\\bCreateProcess(AsUser)?[AW]?\\s*\\(")
          (#match? @body "\\bReadFile\\s*\\(")
          (#match? @body "\\b(WSA)?[Ss]end\\s*\\("))

  - id: c-readfile-to-winsock-send-loop
    desc: Passes ReadFile buffer to Winsock send
    conf: 0.92
    for: [c, cpp]
    if:
      type: text
      exclude_comments: true
      regex: '\bReadFile\s*\([^;{}]{1,90}\)[\s\S]{0,65}\b(WSA)?[Ss]end\s*\('

  - id: c-winsock-recv-to-writefile-loop
    desc: Passes Winsock recv buffer to WriteFile
    conf: 0.92
    for: [c, cpp]
    if:
      type: text
      exclude_comments: true
      regex: '\b(WSA)?[Rr]ecv\s*\([^;{}]{1,90}\)[\s\S]{0,65}\bWriteFile\s*\('

composite_rules:
  - id: pe-bidirectional-winsock-pipe-relay
    desc: Bidirectional Winsock and handle relay loops
    conf: 0.95
    for: [pe, dll]
    all:
      - id: pe-pipe-readfile-to-winsock-send-loop
      - id: pe-winsock-recv-to-pipe-writefile-loop

  - id: pe-winsock-pipe-stream-relay
    desc: PE relays spawned pipe over Winsock
    conf: 0.95
    for: [pe, dll]
    all:
      - id: micro-behaviors/fs/read/file/handle::read-file
    any:
      - id: pe-startupinfo-direct-winsock-pipe-relay
      - id: pe-startupinfo-indirect-winsock-pipe-relay
      - id: pe-bidirectional-winsock-pipe-relay

  - id: c-bidirectional-winsock-pipe-relay
    desc: Bidirectional Winsock and pipe relay loops
    conf: 0.95
    for: [c, cpp]
    all:
      - id: c-readfile-to-winsock-send-loop
      - id: c-winsock-recv-to-writefile-loop

  - id: c-winsock-pipe-stream-relay
    desc: C/C++ relays child pipe over Winsock
    conf: 0.96
    for: [c, cpp]
    all:
      - id: c-readfile-to-winsock-send-loop
    any:
      - id: c-same-func-pipe-spawn-and-winsock-send
      - id: c-bidirectional-winsock-pipe-relay
