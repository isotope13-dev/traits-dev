defaults:
  for:
  - shell
  platforms:
  - unix
  crit: notable
traits:
- id: shell-netcat-fifo-feedback
  desc: Shell and Netcat relay through one FIFO
  conf: 0.99
  if:
    type: value
    path: source.shell.fifo_network_loops[*].fifo
    regex: '.+'
- id: explicit-fifo-stdio-shell-netcat
  desc: mkfifo with shell and Netcat stdio
  conf: 0.97
  if:
    type: text
    regex: >-
      mkfifo\s+/tmp/\S+.{0,60}sh\s+-c\s+'sh\s+0</tmp/\S+\s*\|\s*nc\s+\S+\s+\d+\s+1>/tmp/\S+'
