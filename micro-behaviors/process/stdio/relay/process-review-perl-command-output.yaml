defaults:
  for: [perl]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: perl-captured-command-line-output
    desc: Prints lines captured from a shell command
    if:
      type: tree-sitter
      # Adjacent statements prevent an intervening array reassignment.
      # The literal-only print between capture and loop is presentation.
      query: |
        (source_file
          (expression_statement
            (assignment_expression
              left: (variable_declaration variable: (array) @captured)
              right: (command_string)))
          . (expression_statement
              (ambiguous_function_call_expression
                function: (function) @separator
                arguments: [(string_literal) (interpolated_string_literal)]))
          . (for_statement
              variable: (scalar) @item
              list: (array) @iterated
              block: (block
                . (expression_statement
                  (ambiguous_function_call_expression
                    function: (function) @printer
                    arguments: (binary_expression left: (scalar) @printed)))))
          (#eq? @captured @iterated)
          (#eq? @item @printed)
          (#eq? @separator "print")
          (#eq? @printer "print")) @output
