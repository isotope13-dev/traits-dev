# A PE that creates a WSASocket handle, stores one handle into all three
# STARTUPINFO std slots and spawns a process can give that child the socket
# itself as its console: no pipes and no relay loop. Whether the socket was
# accepted or connected is decided by the objectives that compose this.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

composite_rules:
  - id: pe-winsock-handle-as-child-stdio
    desc: Socket-ready handle as child process stdio
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/process/stdio/configure::x86-stack-startupinfo-shared-std-handle
      - id: micro-behaviors/communications/socket/init::wsa-socket
    any:
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: metadata/binary/symbols/name/process::create-process-w

  - id: pe-winsock-handle-as-child-stdio-x64
    desc: x64 socket-ready handle as child process stdio
    crit: notable
    conf: 0.92
    arch: [x86-64]
    all:
      - id: micro-behaviors/process/stdio/configure::x64-stack-startupinfo-shared-std-handle
      - id: micro-behaviors/communications/socket/init::wsa-socket
    any:
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: metadata/binary/symbols/name/process::create-process-w
