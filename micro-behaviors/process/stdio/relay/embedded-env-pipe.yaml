defaults:
  platforms: [windows]
  for: [javascript]
  crit: notable
traits:
  # This is a cmd command string inside a JS launcher. The caret escapes
  # defer expansion; neither the environment variable names nor the target
  # interpreter's basename is fixed by the technique.
  - id: javascript-cmd-env-pipe-to-stdin
    desc: Pipes environment data to command stdin
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?i)\bcmd(\.exe)?\s+(/d\s+)?/c\s+echo\s+\^?%[A-Za-z_]\w*\^?%\s*\|\s*%[A-Za-z_]\w*%\s+-\s*$'
