defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
composite_rules:
  - id: wsh-strings-beside-powershell-reflection
    desc: WSH strings beside PowerShell reflection
    crit: notable
    conf: 0.99
    platforms: [windows]
    for: [javascript, vbs]
    near_lines: 800
    all:
      - id: metadata/lang/source/literal/string/command::exec-string-literal
      - id: micro-behaviors/data/control-flow/dispatch/computed::wsh-chunked-stdin-string-write
      - id: micro-behaviors/fs/path/construct::wsh-buildpath-powershell-exe
      - id: micro-behaviors/metaprogramming/reflection/invoke::powershell-assembly-method-invoke
