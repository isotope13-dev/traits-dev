# Standard-input references describe an I/O capability, not a file profile.
# Matcher, criticality and effective scope are retained during relocation.
defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
    - python
    - shell
traits:
  - crit: notable
    conf: 0.9
    id: stdin-read-or-reference
    desc: Reads or references standard input
  # An @default process.stdin comment is not an input operation.
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: (?i)(json\.loads?\s*\(\s*\w*stdin|stdin(\.buffer)?\.read\s*\(|process\.stdin\b)
