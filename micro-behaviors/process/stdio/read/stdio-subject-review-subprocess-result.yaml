defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-subprocess-stdout-result-field
    desc: Subprocess stdout assigned to result field
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)subprocess\.run[\s\S]{0,700}["'']result["'']\s*:\s*\w+\.stdout\b'
