defaults:
  platforms:
  - windows
  for:
  - asp
  crit: notable
  conf: 0.94
traits:
- id: aspnet-process-output-read
  desc: ASP.NET reads redirected process output
  if:
    type: text
    regex: "(?is)Standard(Output|Error)\\s*\\.\\s*ReadToEnd\\s*\\("
composite_rules:
- id: aspnet-process-output-page-rendering
  desc: Process-output read beside page output syntax
  all:
  - id: micro-behaviors/process/stdio/read::aspnet-process-output-read
  any:
  - id: micro-behaviors/communications/http/server/managed::aspnet-control-text-or-html-encode
  - id: micro-behaviors/communications/http/response::asp-output-expression
