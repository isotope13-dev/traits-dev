defaults:
  crit: notable
  platforms:
    - linux
    - macos
    - windows
  for:
    - javascript
    - typescript
traits:
  - id: process-stdout-data-listener
    desc: Registers a stdout stream data listener
    conf: 0.9
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: (?i)stdout\s*\.\s*on\s*\(\s*["']data["']
