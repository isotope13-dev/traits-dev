defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-stdin-read
    desc: Node stdin on, read or resume call
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^process\.stdin\.(on|read|resume)$'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: node-read-stdin-fd
    desc: Reads Node stdin through file descriptor 0
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: fs.readFileSync
      arg:
        kind: number
        value: 0

  # Structured worker IPC: the child receives serialized data, not code.
  # A loader feeds its interpreter decodable or fetched bytes; JSON
  # serialization marks the data side of that boundary.
  - id: node-empty-child-stdout-handler
    desc: Stdout data event has an empty handler
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\.stdout\??\.on\s*\(\s*["'']data["'']\s*,\s*\(\s*\)\s*=>\s*\{\s*\}\s*\)'

  - id: node-empty-child-stderr-handler
    desc: Stderr data event has an empty handler
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\.stderr\??\.on\s*\(\s*["'']data["'']\s*,\s*\(\s*\)\s*=>\s*\{\s*\}\s*\)'

