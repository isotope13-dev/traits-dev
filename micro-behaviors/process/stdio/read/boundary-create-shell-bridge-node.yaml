defaults:
  platforms:
  - unix
  - windows
  for: [javascript]
  attack: T1059
  crit: notable
traits:
- id: getExecOutput
  desc: Node.js exec output capture (GitHub Actions)
  conf: 0.8
  if:
    type: symbol
    kind: call
    exact: getExecOutput
- id: silent-getexecoutput-text
  desc: Silenced output-capturing exec call
  conf: 0.85
  if:
    type: text
    regex: 'getExecOutput\s*\([^;]{0,800}silent\s*:\s*true'
