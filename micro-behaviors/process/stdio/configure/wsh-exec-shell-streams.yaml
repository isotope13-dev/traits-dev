# WScript.Shell.Exec of a bare cmd/powershell with no command line keeps the
# interpreter interactive; reading its output stream or writing its input
# stream afterwards drives that shell from the script.
defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1059.003

traits:
  - id: wsh-exec-interactive-shell-streams
    desc: Script drives an interactive shell's stdio
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\.Exec\s*\(\s*"(cmd|powershell)(\.exe)?"\s*\).{0,200}\.(Standard|Std)(Out|In)'
