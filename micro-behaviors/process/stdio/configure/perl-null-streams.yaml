defaults:
  for: [perl]
  platforms: [windows]
  crit: notable
traits:
  - id: perl-null-output-stream
    desc: Perl redirects output streams to NUL
    conf: 0.98
    if:
      type: text
      regex: '\bopen\s*\(?\s*STD(OUT|ERR)\s*,\s*["'']>["'']\s*,\s*["'']NUL["'']'
      exclude_comments: true
