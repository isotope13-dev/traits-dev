defaults:
  for: [python]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: python-both-streams-devnull
    desc: Redirects stdout and stderr to null
    if:
      type: tree-sitter
      query: |
        ((function_definition body: (block
          (expression_statement (assignment left: (identifier) @handle right: (call
            function: (identifier) @open
            arguments: (argument_list (attribute object: (identifier) @os attribute: (identifier) @devnull)))))
          (expression_statement (assignment left: (attribute object: (identifier) @sys1 attribute: (identifier) @stdout)
            right: (identifier) @stdout_handle))
          (expression_statement (assignment left: (attribute object: (identifier) @sys2 attribute: (identifier) @stderr)
            right: (identifier) @stderr_handle))))
          (#eq? @open "open") (#eq? @os "os") (#eq? @devnull "devnull")
          (#eq? @sys1 "sys") (#eq? @sys2 "sys") (#eq? @stdout "stdout") (#eq? @stderr "stderr")
          (#eq? @handle @stdout_handle) (#eq? @handle @stderr_handle))
