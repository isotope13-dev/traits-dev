# Keyword names alone do not establish subprocess stdio redirection.
defaults:
  platforms:
    - linux
    - windows
    - macos
  for:
    - python
    - pyc
traits:
  - id: python-custom-stdio
    desc: Subprocess call supplies custom stdio streams
    crit: notable
    conf: 0.96
    for: [python]
  # Keep the kwargs on the same call. A nearby subprocess invocation plus
  # dict(stdin=..., stdout=...) does not configure that child's descriptors.
    if:
      type: tree-sitter
      query: |
        (
          (call
            function: [(attribute) (identifier)] @callee
            arguments: (argument_list
              (keyword_argument name: (identifier) @stream1 value: (identifier) @value1)
              (keyword_argument name: (identifier) @stream2 value: (identifier) @value2))) @stdio
          (#match? @callee "^(subprocess\\s*\\.\\s*(Popen|run|call)|Popen)$")
          (#match? @stream1 "^(stdin|stdout|stderr)$")
          (#match? @stream2 "^(stdin|stdout|stderr)$")
          (#not-eq? @stream1 @stream2)
          (#not-match? @value1 "^(PIPE|STDOUT|DEVNULL)$")
          (#not-match? @value2 "^(PIPE|STDOUT|DEVNULL)$")
        )
  # A variable assigned from socket.socket()/create_connection() is the stdin,
  # stdout and stderr of a shell child, in any scope and for any call form
  # (statement, assignment, chained .wait()). A file handle or /dev/null shared
  # across the three streams is bound by open(), not by a socket constructor,
  # and does not match. Whether the socket is outbound is the caller's test.
  - id: python-shell-child-socket-stdio-object
    desc: Shell child stdio is a created socket
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: tree-sitter
      query: |
        (
          (_
            (expression_statement (assignment left: (identifier) @sock
              right: (call function: (attribute object: (identifier) @mod attribute: (identifier) @ctor))))
            [
              (expression_statement (call function: [(attribute) (identifier)] @callee
                arguments: (argument_list
                [(list . (string) @shell) (string) @shell]
                (keyword_argument name: (identifier) @k1 value: (identifier) @v1)
                (keyword_argument name: (identifier) @k2 value: (identifier) @v2)
                (keyword_argument name: (identifier) @k3 value: (identifier) @v3))))
              (expression_statement (assignment right: (call function: [(attribute) (identifier)] @callee
                arguments: (argument_list
                [(list . (string) @shell) (string) @shell]
                (keyword_argument name: (identifier) @k1 value: (identifier) @v1)
                (keyword_argument name: (identifier) @k2 value: (identifier) @v2)
                (keyword_argument name: (identifier) @k3 value: (identifier) @v3)))))
              (expression_statement (call function: (attribute object: (call function: [(attribute) (identifier)] @callee
                arguments: (argument_list
                [(list . (string) @shell) (string) @shell]
                (keyword_argument name: (identifier) @k1 value: (identifier) @v1)
                (keyword_argument name: (identifier) @k2 value: (identifier) @v2)
                (keyword_argument name: (identifier) @k3 value: (identifier) @v3))))))
            ])
          (#eq? @mod "socket") (#match? @ctor "^(socket|create_connection)$")
          (#match? @callee "^(subprocess[.](Popen|run|call)|Popen)$")
          (#eq? @k1 "stdin") (#eq? @k2 "stdout") (#eq? @k3 "stderr")
          (#eq? @v1 @sock) (#eq? @v2 @sock) (#eq? @v3 @sock)
          (#match? @shell "^.(/(usr/)?bin/)?(bash|sh|zsh|cmd)([.]exe)?( -i)?.$")
        )
composite_rules: []
