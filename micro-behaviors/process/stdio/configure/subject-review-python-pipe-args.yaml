# Keyword names alone do not establish subprocess stdio redirection.
defaults:
  platforms:
    - linux
    - windows
    - macos
  for:
    - python
    - pyc
traits:
  - id: python-custom-stdio
    desc: Subprocess call supplies custom stdio streams
    crit: notable
    conf: 0.96
    for: [python]
  # Keep the kwargs on the same call. A nearby subprocess invocation plus
  # dict(stdin=..., stdout=...) does not configure that child's descriptors.
    if:
      type: tree-sitter
      query: |
        (
          (call
            function: [(attribute) (identifier)] @callee
            arguments: (argument_list
              (keyword_argument name: (identifier) @stream1 value: (identifier) @value1)
              (keyword_argument name: (identifier) @stream2 value: (identifier) @value2))) @stdio
          (#match? @callee "^(subprocess\\s*\\.\\s*(Popen|run|call)|Popen)$")
          (#match? @stream1 "^(stdin|stdout|stderr)$")
          (#match? @stream2 "^(stdin|stdout|stderr)$")
          (#not-eq? @stream1 @stream2)
          (#not-match? @value1 "^(PIPE|STDOUT|DEVNULL)$")
          (#not-match? @value2 "^(PIPE|STDOUT|DEVNULL)$")
        )
composite_rules: []
