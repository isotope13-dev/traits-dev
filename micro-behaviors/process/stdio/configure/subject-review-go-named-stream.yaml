# Identifier spelling does not prove a socket type.
traits:
- id: go-named-stream-stdio-assignment
  desc: Assigns named stream to standard I/O
  crit: notable
  conf: 0.95
  for:
  - go
  platforms:
  - windows
  - unix
  if:
    type: text
    regex: \b[A-Za-z_$][A-Za-z0-9_$]*\.(Stdin|Stdout|Stderr)\s*=\s*(connection|conn|client|socket)\b
