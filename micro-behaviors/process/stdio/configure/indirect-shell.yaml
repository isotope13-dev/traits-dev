defaults:
  for: [shell]
  platforms: [unix]
  crit: notable

traits:
  - id: silenced-indirect-variable-launch
    desc: Discards indirect command output and errors
    if:
      # Bind the redirection to a variable command, excluding echo examples.
      type: tree-sitter
      query: |
        ((redirected_statement
          body: (command name: (command_name) @target
            argument: (string) @argument)) @evidence
          (#match? @target "^\\$\\{?[A-Za-z_]\\w*\\}?$")
          (#match? @argument "^\"\\$\\{?[A-Za-z_]\\w*\\}?\"$")
          (#match? @evidence ">\\s*/dev/null\\s+2>&1"))
