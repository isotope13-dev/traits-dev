# Stream operations alone do not establish socket or shell relay semantics.
defaults:
  for:
  - go
  platforms:
  - linux
  - macos
  - windows
traits:
- id: process-stdin-assignment
  desc: Assigns process standard input
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (cmd|proc)\.(Stdin|StandardInput)\s*=\s*(conn|socket)
