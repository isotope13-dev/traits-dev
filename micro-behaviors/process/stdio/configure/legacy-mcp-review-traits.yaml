---
defaults:
  for:
  - javascript
  - typescript
  - python
  - lua
  - markdown
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: stdio-server-transport-reference
  desc: Stdio server transport reference
  conf: 0.9
  if:
    type: string_literal
    regex: StdioServerTransport|server/stdio
- id: stdio-client-import
  desc: stdio_client import name
  conf: 0.94
  for:
  - python
  if:
    type: symbol
    kind: import
    exact: stdio_client
- id: stdio-server-parameters-import
  desc: StdioServerParameters import name
  conf: 0.94
  for:
  - python
  if:
    type: symbol
    kind: import
    exact: StdioServerParameters
