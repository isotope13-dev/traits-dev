defaults:
  crit: notable
  conf: 0.90
  platforms: [windows]
  for: [c, cpp, html, text]

traits:
  - id: pe-startupinfo-same-handle-stdio
    desc: PE stdio fields share one StartupInfo value
    crit: notable
    conf: 0.97
    for: [pe]
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: "C7 05 ?? ?? ?? ?? 44 00 00 00 C7 05 ?? ?? ?? ?? 01 01 00 00 A3 ?? ?? ?? ?? A3 ?? ?? ?? ?? A3 ?? ?? ?? ??"

  - id: pe-startupinfo-same-handle-stdio-x64
    desc: x64 PE stdio fields share one handle
    crit: notable
    conf: 0.97
    for: [pe]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: "(C7 44 24 ?? | C7 45 ??) 68 00 00 00 (C7 44 24 ?? | C7 45 ??) 01 01 00 00 48 89 5D ?? 48 89 5D ?? 48 89 5D ??"

  # Stack-frame form of the check above: STARTUPINFO.dwFlags gets
  # STARTF_USESTDHANDLES, then one register is stored into hStdInput,
  # hStdOutput and hStdError. One handle serving all three streams is how a
  # socket becomes a child's console; pipe redirection stores distinct ends.
  - id: x86-stack-startupinfo-shared-std-handle-esp-disp32
    desc: Child stdio slots esp disp32
    crit: notable
    conf: 0.95
    for: [pe, dll]
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: "C7 84 24 ?? ?? ?? ?? (00|01) 01 00 00 [0-16] (89 84 24 ?? ?? ?? ?? 89 84 24 ?? ?? ?? ?? 89 84 | 89 8C 24 ?? ?? ?? ?? 89 8C 24 ?? ?? ?? ?? 89 8C | 89 94 24 ?? ?? ?? ?? 89 94 24 ?? ?? ?? ?? 89 94 | 89 9C 24 ?? ?? ?? ?? 89 9C 24 ?? ?? ?? ?? 89 9C | 89 AC 24 ?? ?? ?? ?? 89 AC 24 ?? ?? ?? ?? 89 AC | 89 B4 24 ?? ?? ?? ?? 89 B4 24 ?? ?? ?? ?? 89 B4 | 89 BC 24 ?? ?? ?? ?? 89 BC 24 ?? ?? ?? ?? 89 BC)"

  - id: x86-stack-startupinfo-shared-std-handle-esp-disp8
    desc: Child stdio slots esp disp8
    crit: notable
    conf: 0.95
    for: [pe, dll]
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: "C7 44 24 ?? (00|01) 01 00 00 [0-16] (89 44 24 ?? 89 44 24 ?? 89 44 | 89 4C 24 ?? 89 4C 24 ?? 89 4C | 89 54 24 ?? 89 54 24 ?? 89 54 | 89 5C 24 ?? 89 5C 24 ?? 89 5C | 89 6C 24 ?? 89 6C 24 ?? 89 6C | 89 74 24 ?? 89 74 24 ?? 89 74 | 89 7C 24 ?? 89 7C 24 ?? 89 7C)"

  - id: x86-stack-startupinfo-shared-std-handle-ebp-disp8
    desc: Child stdio slots ebp disp8
    crit: notable
    conf: 0.95
    for: [pe, dll]
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: "C7 45 ?? (00|01) 01 00 00 [0-16] (89 45 ?? 89 45 ?? 89 45 | 89 4D ?? 89 4D ?? 89 4D | 89 55 ?? 89 55 ?? 89 55 | 89 5D ?? 89 5D ?? 89 5D | 89 6D ?? 89 6D ?? 89 6D | 89 75 ?? 89 75 ?? 89 75 | 89 7D ?? 89 7D ?? 89 7D)"

  - id: x86-stack-startupinfo-shared-std-handle-ebp-disp32
    desc: Child stdio slots ebp disp32
    crit: notable
    conf: 0.95
    for: [pe, dll]
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: "C7 85 ?? ?? ?? ?? (00|01) 01 00 00 [0-16] (89 85 ?? ?? ?? ?? 89 85 ?? ?? ?? ?? 89 85 | 89 8D ?? ?? ?? ?? 89 8D ?? ?? ?? ?? 89 8D | 89 95 ?? ?? ?? ?? 89 95 ?? ?? ?? ?? 89 95 | 89 9D ?? ?? ?? ?? 89 9D ?? ?? ?? ?? 89 9D | 89 AD ?? ?? ?? ?? 89 AD ?? ?? ?? ?? 89 AD | 89 B5 ?? ?? ?? ?? 89 B5 ?? ?? ?? ?? 89 B5 | 89 BD ?? ?? ?? ?? 89 BD ?? ?? ?? ?? 89 BD)"

  # x64 form of the stack check above: dwFlags gets STARTF_USESTDHANDLES,
  # then one 64-bit register (rax..rdi or r8..r15) is
  # stored into hStdInput, hStdOutput and hStdError, rbp- or rsp-relative
  # with 8- or 32-bit displacement.
  - id: x64-stack-startupinfo-shared-std-handle
    desc: x64 one handle fills child stdio slots
    crit: notable
    conf: 0.95
    for: [pe, dll]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: "C7 (84 24 ?? ?? ?? ?? | 44 24 ?? | 45 ?? | 85 ?? ?? ?? ??) (00|01) 01 00 00 [0-16] (48 89 45 ?? 48 89 45 ?? 48 89 45 | 48 89 4D ?? 48 89 4D ?? 48 89 4D | 48 89 55 ?? 48 89 55 ?? 48 89 55 | 48 89 5D ?? 48 89 5D ?? 48 89 5D | 48 89 6D ?? 48 89 6D ?? 48 89 6D | 48 89 75 ?? 48 89 75 ?? 48 89 75 | 48 89 7D ?? 48 89 7D ?? 48 89 7D | 48 89 85 ?? ?? ?? ?? 48 89 85 ?? ?? ?? ?? 48 89 85 | 48 89 8D ?? ?? ?? ?? 48 89 8D ?? ?? ?? ?? 48 89 8D | 48 89 95 ?? ?? ?? ?? 48 89 95 ?? ?? ?? ?? 48 89 95 | 48 89 9D ?? ?? ?? ?? 48 89 9D ?? ?? ?? ?? 48 89 9D | 48 89 AD ?? ?? ?? ?? 48 89 AD ?? ?? ?? ?? 48 89 AD | 48 89 B5 ?? ?? ?? ?? 48 89 B5 ?? ?? ?? ?? 48 89 B5 | 48 89 BD ?? ?? ?? ?? 48 89 BD ?? ?? ?? ?? 48 89 BD | 48 89 44 24 ?? 48 89 44 24 ?? 48 89 44 | 48 89 4C 24 ?? 48 89 4C 24 ?? 48 89 4C | 48 89 54 24 ?? 48 89 54 24 ?? 48 89 54 | 48 89 5C 24 ?? 48 89 5C 24 ?? 48 89 5C | 48 89 6C 24 ?? 48 89 6C 24 ?? 48 89 6C | 48 89 74 24 ?? 48 89 74 24 ?? 48 89 74 | 48 89 7C 24 ?? 48 89 7C 24 ?? 48 89 7C | 48 89 84 24 ?? ?? ?? ?? 48 89 84 24 ?? ?? ?? ?? 48 89 84 | 48 89 8C 24 ?? ?? ?? ?? 48 89 8C 24 ?? ?? ?? ?? 48 89 8C | 48 89 94 24 ?? ?? ?? ?? 48 89 94 24 ?? ?? ?? ?? 48 89 94 | 48 89 9C 24 ?? ?? ?? ?? 48 89 9C 24 ?? ?? ?? ?? 48 89 9C | 48 89 AC 24 ?? ?? ?? ?? 48 89 AC 24 ?? ?? ?? ?? 48 89 AC | 48 89 B4 24 ?? ?? ?? ?? 48 89 B4 24 ?? ?? ?? ?? 48 89 B4 | 48 89 BC 24 ?? ?? ?? ?? 48 89 BC 24 ?? ?? ?? ?? 48 89 BC | 4C 89 45 ?? 4C 89 45 ?? 4C 89 45 | 4C 89 4D ?? 4C 89 4D ?? 4C 89 4D | 4C 89 55 ?? 4C 89 55 ?? 4C 89 55 | 4C 89 5D ?? 4C 89 5D ?? 4C 89 5D | 4C 89 65 ?? 4C 89 65 ?? 4C 89 65 | 4C 89 6D ?? 4C 89 6D ?? 4C 89 6D | 4C 89 75 ?? 4C 89 75 ?? 4C 89 75 | 4C 89 7D ?? 4C 89 7D ?? 4C 89 7D | 4C 89 85 ?? ?? ?? ?? 4C 89 85 ?? ?? ?? ?? 4C 89 85 | 4C 89 8D ?? ?? ?? ?? 4C 89 8D ?? ?? ?? ?? 4C 89 8D | 4C 89 95 ?? ?? ?? ?? 4C 89 95 ?? ?? ?? ?? 4C 89 95 | 4C 89 9D ?? ?? ?? ?? 4C 89 9D ?? ?? ?? ?? 4C 89 9D | 4C 89 A5 ?? ?? ?? ?? 4C 89 A5 ?? ?? ?? ?? 4C 89 A5 | 4C 89 AD ?? ?? ?? ?? 4C 89 AD ?? ?? ?? ?? 4C 89 AD | 4C 89 B5 ?? ?? ?? ?? 4C 89 B5 ?? ?? ?? ?? 4C 89 B5 | 4C 89 BD ?? ?? ?? ?? 4C 89 BD ?? ?? ?? ?? 4C 89 BD | 4C 89 44 24 ?? 4C 89 44 24 ?? 4C 89 44 | 4C 89 4C 24 ?? 4C 89 4C 24 ?? 4C 89 4C | 4C 89 54 24 ?? 4C 89 54 24 ?? 4C 89 54 | 4C 89 5C 24 ?? 4C 89 5C 24 ?? 4C 89 5C | 4C 89 64 24 ?? 4C 89 64 24 ?? 4C 89 64 | 4C 89 6C 24 ?? 4C 89 6C 24 ?? 4C 89 6C | 4C 89 74 24 ?? 4C 89 74 24 ?? 4C 89 74 | 4C 89 7C 24 ?? 4C 89 7C 24 ?? 4C 89 7C | 4C 89 84 24 ?? ?? ?? ?? 4C 89 84 24 ?? ?? ?? ?? 4C 89 84 | 4C 89 8C 24 ?? ?? ?? ?? 4C 89 8C 24 ?? ?? ?? ?? 4C 89 8C | 4C 89 94 24 ?? ?? ?? ?? 4C 89 94 24 ?? ?? ?? ?? 4C 89 94 | 4C 89 9C 24 ?? ?? ?? ?? 4C 89 9C 24 ?? ?? ?? ?? 4C 89 9C | 4C 89 A4 24 ?? ?? ?? ?? 4C 89 A4 24 ?? ?? ?? ?? 4C 89 A4 | 4C 89 AC 24 ?? ?? ?? ?? 4C 89 AC 24 ?? ?? ?? ?? 4C 89 AC | 4C 89 B4 24 ?? ?? ?? ?? 4C 89 B4 24 ?? ?? ?? ?? 4C 89 B4 | 4C 89 BC 24 ?? ?? ?? ?? 4C 89 BC 24 ?? ?? ?? ?? 4C 89 BC)"

  - id: startupinfo-stdhandles-flag
    desc: STARTF_USESTDHANDLES flag reference
    conf: 0.92
    if:
      type: text
      word: STARTF_USESTDHANDLES

  - id: startupinfo-std-output-handle
    desc: hStdOutput field name
    conf: 0.90
    if:
      type: text
      word: hStdOutput

  - id: startupinfo-std-input-handle
    desc: hStdInput field name
    conf: 0.90
    if:
      type: text
      word: hStdInput

  - id: startupinfo-std-error-handle
    desc: hStdError field name
    conf: 0.90
    if:
      type: text
      word: hStdError

composite_rules:
  - id: startupinfo-stdio-handle-fields
    desc: StartupInfo explicit stdio flag and handle fields
    conf: 0.96
    near_bytes: 400
    all:
      - id: startupinfo-stdhandles-flag
      - id: startupinfo-std-output-handle
      - id: startupinfo-std-input-handle
      - id: startupinfo-std-error-handle

  - id: x86-stack-startupinfo-shared-std-handle
    desc: Same handle fills all child stdio slots
    crit: notable
    conf: 0.95
    for: [pe, dll]
    arch: [x86]
    any:
      - id: x86-stack-startupinfo-shared-std-handle-esp-disp32
      - id: x86-stack-startupinfo-shared-std-handle-esp-disp8
      - id: x86-stack-startupinfo-shared-std-handle-ebp-disp8
      - id: x86-stack-startupinfo-shared-std-handle-ebp-disp32
