defaults:
  crit: notable
  conf: 0.90
  platforms: [windows]
  for: [c, cpp, html, text]

traits:
  - id: pe-startupinfo-same-handle-stdio
    desc: PE stdio fields share one StartupInfo value
    crit: notable
    conf: 0.97
    for: [pe]
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: "C7 05 ?? ?? ?? ?? 44 00 00 00 C7 05 ?? ?? ?? ?? 01 01 00 00 A3 ?? ?? ?? ?? A3 ?? ?? ?? ?? A3 ?? ?? ?? ??"

  - id: pe-startupinfo-same-handle-stdio-x64
    desc: x64 PE stdio fields share one handle
    crit: notable
    conf: 0.97
    for: [pe]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: "(C7 44 24 ?? | C7 45 ??) 68 00 00 00 (C7 44 24 ?? | C7 45 ??) 01 01 00 00 48 89 5D ?? 48 89 5D ?? 48 89 5D ??"

  # Stack-frame form of the check above: STARTUPINFO.dwFlags gets
  # STARTF_USESTDHANDLES, then one register is stored into hStdInput,
  # hStdOutput and hStdError. One handle serving all three streams is how a
  # socket becomes a child's console; pipe redirection stores distinct ends.
  - id: x86-stack-startupinfo-shared-std-handle
    desc: Same handle fills all child stdio slots
    crit: notable
    conf: 0.95
    for: [pe, dll]
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: "C7 (84 24 ?? ?? ?? ?? | 44 24 ?? | 45 ?? | 85 ?? ?? ?? ??) (00|01) 01 00 00 [0-16] (89 84 24 ?? ?? ?? ?? 89 84 24 ?? ?? ?? ?? 89 84 | 89 44 24 ?? 89 44 24 ?? 89 44 | 89 45 ?? 89 45 ?? 89 45 | 89 85 ?? ?? ?? ?? 89 85 ?? ?? ?? ?? 89 85 | 89 8C 24 ?? ?? ?? ?? 89 8C 24 ?? ?? ?? ?? 89 8C | 89 4C 24 ?? 89 4C 24 ?? 89 4C | 89 4D ?? 89 4D ?? 89 4D | 89 8D ?? ?? ?? ?? 89 8D ?? ?? ?? ?? 89 8D | 89 94 24 ?? ?? ?? ?? 89 94 24 ?? ?? ?? ?? 89 94 | 89 54 24 ?? 89 54 24 ?? 89 54 | 89 55 ?? 89 55 ?? 89 55 | 89 95 ?? ?? ?? ?? 89 95 ?? ?? ?? ?? 89 95 | 89 9C 24 ?? ?? ?? ?? 89 9C 24 ?? ?? ?? ?? 89 9C | 89 5C 24 ?? 89 5C 24 ?? 89 5C | 89 5D ?? 89 5D ?? 89 5D | 89 9D ?? ?? ?? ?? 89 9D ?? ?? ?? ?? 89 9D | 89 AC 24 ?? ?? ?? ?? 89 AC 24 ?? ?? ?? ?? 89 AC | 89 6C 24 ?? 89 6C 24 ?? 89 6C | 89 6D ?? 89 6D ?? 89 6D | 89 AD ?? ?? ?? ?? 89 AD ?? ?? ?? ?? 89 AD | 89 B4 24 ?? ?? ?? ?? 89 B4 24 ?? ?? ?? ?? 89 B4 | 89 74 24 ?? 89 74 24 ?? 89 74 | 89 75 ?? 89 75 ?? 89 75 | 89 B5 ?? ?? ?? ?? 89 B5 ?? ?? ?? ?? 89 B5 | 89 BC 24 ?? ?? ?? ?? 89 BC 24 ?? ?? ?? ?? 89 BC | 89 7C 24 ?? 89 7C 24 ?? 89 7C | 89 7D ?? 89 7D ?? 89 7D | 89 BD ?? ?? ?? ?? 89 BD ?? ?? ?? ?? 89 BD)"

  - id: startupinfo-stdhandles-flag
    desc: STARTF_USESTDHANDLES flag reference
    conf: 0.92
    if:
      type: text
      word: STARTF_USESTDHANDLES

  - id: startupinfo-std-output-handle
    desc: hStdOutput field name
    conf: 0.90
    if:
      type: text
      word: hStdOutput

  - id: startupinfo-std-input-handle
    desc: hStdInput field name
    conf: 0.90
    if:
      type: text
      word: hStdInput

  - id: startupinfo-std-error-handle
    desc: hStdError field name
    conf: 0.90
    if:
      type: text
      word: hStdError

composite_rules:
  - id: startupinfo-stdio-handle-fields
    desc: StartupInfo explicit stdio flag and handle fields
    conf: 0.96
    near_bytes: 400
    all:
      - id: startupinfo-stdhandles-flag
      - id: startupinfo-std-output-handle
      - id: startupinfo-std-input-handle
      - id: startupinfo-std-error-handle
