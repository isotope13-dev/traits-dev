defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: child-output-ignored-option
    desc: Child stdout and stderr are ignored
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'stdio\s*:\s*(["'']ignore["'']|\[\s*[^,\]]{1,80},\s*["'']ignore["'']\s*,\s*["'']ignore["''])'
  - id: child-stdio-ignore-option
    desc: Child stdio option suppresses streams
    crit: notable
    conf: 0.85
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: "stdio\\s*:\\s*(\\[[^\\]]{0,220}['\"]ignore['\"]|['\"]ignore['\"])"
