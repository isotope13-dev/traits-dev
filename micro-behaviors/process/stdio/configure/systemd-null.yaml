defaults:
  platforms: [linux]
  for: [systemd-service]
  crit: notable
traits:
  - id: systemd-stdout-null
    desc: Systemd discards standard output
    if:
      type: value
      path: service.standard_output
      exact: 'null'
  - id: systemd-stderr-null
    desc: Systemd discards standard error
    if:
      type: value
      path: service.standard_error
      exact: 'null'
