defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-stdin-end-listener-removal-code
    desc: Writes Node EOF-listener removal code to stdin
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '[.]stdin[.]write$'
      arg:
        index: 0
        kind: string
        regex: 'process[.]stdin[.]removeAllListeners\(["'']end["'']\)'
