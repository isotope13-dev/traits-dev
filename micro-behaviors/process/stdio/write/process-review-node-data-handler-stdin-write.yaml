defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-data-handler-stdin-write
    desc: Data event callback writes child stdin
    crit: notable
    conf: 0.94
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: (member_expression
            property: (property_identifier) @event
            (#eq? @event "on"))
          arguments: (arguments
            (string) @name
            (#match? @name "^['\"]data['\"]$")
            [(arrow_function) (function_expression)] @handler
            (#match? @handler "\\.stdin\\.write\\s*\\(")))

