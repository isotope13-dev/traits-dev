defaults:
  crit: notable
  platforms: [windows]
  for: [javascript, vbs]
traits:
- id: wsh-exec-stdin-write-close
  desc: Writes to and closes WSH StdIn stream
  conf: 0.95
  if:
    type: text
    regex: '(?is)\.StdIn\.Write(Line)?\s*\([\s\S]{0,240}\.StdIn\.Close\s*\('

- id: wsh-bracket-stdin-write-call
  desc: Bracketed StdIn stream Write call
  conf: 0.93
  if:
    type: text
    regex: '(?is)["'']StdIn["''][\s\S]{0,200}["'']Write["''][\s\S]{0,80}\]\s*\('

