defaults:
  crit: notable
  platforms: [windows]
  for: [javascript, vbs]
traits:
- id: wsh-exec-stdin-write-close
  desc: Writes to and closes WSH StdIn stream
  conf: 0.95
  if:
    type: text
    regex: '(?is)\.StdIn\.Write(Line)?\s*\([\s\S]{0,240}\.StdIn\.Close\s*\('

- id: wsh-bracket-stdin-write-call
  desc: Calls bracketed WSH StdIn.Write or WriteLine
  conf: 0.93
  if:
    type: text
    regex: '\[["'']StdIn["'']\]\s*\[["'']Write(Line)?["'']\]\s*\('

