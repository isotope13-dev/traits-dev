defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  # Feeding a child process its script over a pipe instead of argv keeps the
  # code off the command line. Benign launchers pass file paths or flags;
  # writing executable content into stdin is the staging half of `-c` hiding.
  - id: python-child-stdin-write
    desc: Writes data to a child process stdin
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.\s*stdin\s*\.\s*write\s*\('
