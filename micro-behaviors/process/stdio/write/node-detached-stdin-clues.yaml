defaults:
  platforms: [unix, windows]
  for: [npm, tar, javascript, typescript]

composite_rules:
  - id: detached-node-stdin-clues
    for:
      - javascript
    desc: Detached Node process and stdin write clues
    crit: notable
    conf: 0.95
    scope: file
    near_bytes: 2048
    all:
      - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
      - id: metadata/file/profile/execution-api::node-interpreter-target
      - id: micro-behaviors/process/stdio/write::js-stdin-write
