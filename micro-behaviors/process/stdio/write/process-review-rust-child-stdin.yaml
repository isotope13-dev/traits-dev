defaults:
  platforms: [windows, unix]
  for: [rust]
  crit: notable
  conf: 0.97

traits:
  - id: rust-child-stdin-write-all
    desc: Rust writes bytes to child stdin
    if:
      type: symbol
      kind: call
      regex: '\.stdin(\.[A-Za-z_]+)*\.write_all$'
  # A fixed byte-string body written to child stdin, such as a check-in
  # beacon that does not carry the collected bytes.
  - id: rust-child-stdin-literal-write
    desc: Rust writes fixed bytes to child stdin
    if:
      type: text
      regex: '\.stdin[^;\n]{0,80}\.write_all\(b"'
  # The same fixed-byte write, reached only inside a block that tests a
  # collected buffer for content. A presence beacon reports whether the
  # credential reads returned anything; an unconditional post does not.
  - id: rust-child-stdin-gated-literal-write
    desc: Rust fixed-byte stdin write after data check
    if:
      type: text
      regex: 'is_empty\(\)\s*\{[^}]{0,400}\.stdin[^;\n]{0,80}\.write_all\(b"'


  # The parser cannot follow mutation of the accumulator through the for/if
  # and child closure. Bind the read result, append receiver, upload buffer,
  # and child handle structurally; all chosen identifiers remain arbitrary.
  - id: rust-read-aggregate-to-child-stdin
    desc: Rust file aggregate written to child stdin
    size_max: 131072
    if:
      type: tree-sitter
      query: |
        (
          (function_item
            (block
              (expression_statement
                (for_expression
                  (block
                    (expression_statement
                      (if_expression
                        (let_condition
                          (tuple_struct_pattern
                            (identifier) @ok
                            (identifier) @read_value
                          )
                          (call_expression
                            (scoped_identifier
                              (identifier) @read
                            )
                          )
                        )
                        (block
                          (expression_statement
                            (call_expression
                              (field_expression
                                (identifier) @aggregate
                                (field_identifier) @append
                              )
                              (arguments
                                (reference_expression
                                  (call_expression
                                    (generic_function
                                      (field_expression
                                        (call_expression
                                          (field_expression
                                            (call_expression
                                              (field_expression
                                                (identifier) @append_value
                                                (field_identifier) @chars
                                              )
                                            )
                                            (field_identifier) @take
                                          )
                                        )
                                        (field_identifier) @collect
                                      )
                                    )
                                  )
                                )
                              )
                            )
                          )
                        )
                      )
                    )
                  )
                )
              )
              (expression_statement
                (if_expression
                  (block
                    (let_declaration
                      (call_expression
                        (arguments
                          (closure_expression
                            (closure_parameters
                              (mut_pattern
                                (identifier) @child
                              )
                            )
                            (block
                              (expression_statement
                                (call_expression
                                  (field_expression
                                    (call_expression
                                      (field_expression
                                        (call_expression
                                          (field_expression
                                            (call_expression
                                              (field_expression
                                                (field_expression
                                                  (identifier) @stdin_child
                                                  (field_identifier) @stdin
                                                )
                                                (field_identifier) @take_stdin
                                              )
                                            )
                                            (field_identifier) @unwrap
                                          )
                                        )
                                        (field_identifier) @write
                                      )
                                      (arguments
                                        (call_expression
                                          (field_expression
                                            (identifier) @upload_value
                                            (field_identifier) @bytes
                                          )
                                        )
                                      )
                                    )
                                  )
                                )
                              )
                            )
                          )
                        )
                      )
                    )
                  )
                )
              )
            )
          ) @flow
          (#eq? @ok "Ok")
          (#eq? @read "read_to_string")
          (#eq? @append "push_str")
          (#eq? @chars "chars")
          (#eq? @take "take")
          (#eq? @collect "collect")
          (#eq? @stdin "stdin")
          (#eq? @take_stdin "take")
          (#eq? @unwrap "unwrap")
          (#eq? @write "write_all")
          (#eq? @bytes "as_bytes")
          (#eq? @read_value @append_value)
          (#eq? @aggregate @upload_value)
          (#eq? @child @stdin_child)
        )

        ((function_item body: (block
          (expression_statement (for_expression body: (block
            (expression_statement (if_expression
              condition: (let_condition
                pattern: (tuple_struct_pattern type: (identifier) @ok
                  (identifier) @read_value)
                value: (call_expression function: (scoped_identifier
                  name: (identifier) @read)))
              consequence: (block (expression_statement (call_expression
                function: (field_expression value: (identifier) @aggregate
                  field: (field_identifier) @append)
                arguments: (arguments (reference_expression value: (call_expression
                  function: (generic_function function: (field_expression
                    value: (call_expression function: (field_expression
                      value: (call_expression function: (field_expression
                        value: (identifier) @append_value
                        field: (field_identifier) @chars))
                      field: (field_identifier) @limit))
                    field: (field_identifier) @collect)))))))))))))
          (let_declaration value: (call_expression
            function: (field_expression
              value: (call_expression function: (field_expression
                value: (call_expression function: (field_expression
                  value: (call_expression function: (field_expression
                    field: (field_identifier) @command))
                  field: (field_identifier) @pipe))
                field: (field_identifier) @spawn))
              field: (field_identifier) @then)
            arguments: (arguments (closure_expression
              parameters: (closure_parameters (mut_pattern (identifier) @child))
              body: (block (expression_statement (call_expression
                function: (field_expression value: (call_expression
                  function: (field_expression value: (call_expression
                    function: (field_expression value: (call_expression
                      function: (field_expression value: (field_expression
                        value: (identifier) @stdin_child
                        field: (field_identifier) @stdin)
                        field: (field_identifier) @take_stdin))
                      field: (field_identifier) @unwrap))
                    field: (field_identifier) @write)
                  arguments: (arguments (call_expression function: (field_expression
                    value: (identifier) @upload_value
                    field: (field_identifier) @bytes))))
                  field: (field_identifier) @discard)))))))))) @flow
          (#eq? @ok "Ok")
          (#eq? @read "read_to_string")
          (#eq? @append "push_str")
          (#eq? @chars "chars")
          (#eq? @limit "take")
          (#eq? @collect "collect")
          (#eq? @command "args")
          (#eq? @pipe "stdin")
          (#eq? @spawn "spawn")
          (#eq? @then "and_then")
          (#eq? @stdin "stdin")
          (#eq? @take_stdin "take")
          (#eq? @unwrap "unwrap")
          (#eq? @write "write_all")
          (#eq? @bytes "as_bytes")
          (#eq? @discard "ok")
          (#eq? @read_value @append_value)
          (#eq? @aggregate @upload_value)
          (#eq? @child @stdin_child))
