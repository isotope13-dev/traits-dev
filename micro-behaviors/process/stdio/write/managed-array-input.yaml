defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  - id: dotnet-child-standardinput-getter-call
    desc: Obtains a child process standard-input writer
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: System.Diagnostics.Process.get_StandardInput
composite_rules:
  # Match actual call sites beside the argument-loading instruction shape,
  # rather than unrelated member names in a CLR metadata heap.
  - id: managed-field-array-child-input
    desc: Child stdin write beside captured-array argument loading
    conf: 0.98
    near_bytes: 32
    all:
      - id: dotnet-child-standardinput-getter-call
      - id: micro-behaviors/data/stream/write::dotnet-textwriter-writeline-call
      - id: micro-behaviors/data/control-flow/sequence::cil-getter-field-array-item-call
  - id: managed-socket-array-child-input
    desc: Socket receiver with captured-array child-input writes
    conf: 0.97
    all:
      - id: managed-field-array-child-input
      - id: micro-behaviors/communications/socket/receive::dotnet-begin-receive-method-token
