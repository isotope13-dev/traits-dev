defaults:
  platforms:
    - windows
  for:
    - asp
  crit: notable
  conf: 0.97
traits:
  - id: aspnet-process-stdin-variable-write
    desc: ASP.NET writes a variable to process stdin
    if:
      type: text
      exclude_html_comments: true
      regex: "\\bStandardInput\\s*\\.\\s*WriteLine\\s*\\(\\s*[A-Za-z_]\\w*\\s*\\)"
