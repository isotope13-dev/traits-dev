defaults:
  crit: baseline
  platforms: [windows]
  for: [pe]
  attack: T1129
traits:
- id: srw-lock-acquire
  desc: SRW lock acquisition
  conf: 0.65
  if:
    type: symbol
    exact: AcquireSRWLockExclusive
- id: srw-lock-release
  desc: SRW lock release
  conf: 0.65
  if:
    type: symbol
    exact: ReleaseSRWLockExclusive
- id: srw-lock-shared--acquiresrwlockshared
  desc: SRW shared lock read (AcquireSRWLockShared)
  conf: 0.65
  if:
    type: symbol
    regex: AcquireSRWLockShared
- id: srw-lock-shared--releasesrwlockshared
  desc: SRW shared lock read (ReleaseSRWLockShared)
  conf: 0.65
  if:
    type: symbol
    regex: ReleaseSRWLockShared
composite_rules:
- id: srw-lock-shared
  desc: SRW shared lock read
  conf: 0.65
  any:
  - id: micro-behaviors/process/sync/mutex::srw-lock-shared--acquiresrwlockshared
  - id: micro-behaviors/process/sync/mutex::srw-lock-shared--releasesrwlockshared
- id: srw-lock-ops
  desc: SRW lock operations
  conf: 0.7
  needs: 2
  any:
  - id: micro-behaviors/process/sync/mutex::srw-lock-acquire
  - id: micro-behaviors/process/sync/mutex::srw-lock-release
  - id: micro-behaviors/process/sync/mutex::srw-lock-shared
