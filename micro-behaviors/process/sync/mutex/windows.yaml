defaults:
  for:
    - pe
    - dll
    - c
    - cpp
  platforms:
    - windows
  mbc: C0042
traits:
  - id: create-mutex
    desc: CreateMutex API call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      regex: CreateMutex[AW]?$
  - id: create-mutex-ex
    desc: CreateMutexEx API call (extended)
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      regex: CreateMutexEx[AW]?$
  - id: open-mutex
    desc: OpenMutex API call
    crit: notable
    conf: 0.85
    if:
      type: symbol
      regex: OpenMutex[AW]?$
  - id: release-mutex
    desc: ReleaseMutex API call
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      exact: ReleaseMutex
  - id: global-prefix
    desc: Global namespace mutex prefix
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)^Global\\\\
  - id: local-prefix
    desc: Local namespace mutex prefix
    crit: baseline
    conf: 0.7
    if:
      type: text
      regex: (?i)^Local\\\\
  - id: dense-global-numeric-mutexes
    desc: Many numbered global mutex names
    crit: suspicious
    conf: 0.86
    count_min: 8
    if:
      type: text
      regex: (?i)\\bGlobal\\\\[0-9]{2,5}\\b
  - id: global-once-mutexes
    desc: Multiple Global\\name_once mutexes
    crit: suspicious
    conf: 0.94
    count_min: 2
    if:
      type: text
      regex: (?i)^Global\\\\[a-z0-9]{4,24}_once$
composite_rules:
  - id: mutex-api
    desc: Mutex creation/access API
    crit: baseline
    conf: 0.85
    any:
      - id: create-mutex
      - id: create-mutex-ex
      - id: open-mutex
  - id: dynamic-mutex-resolution
    desc: Dynamic resolution of mutex objects
    crit: notable
    conf: 0.8
    any:
      - id: create-mutex
      - id: open-mutex
  - id: guid-mutex
    desc: Mutex API paired with a braced GUID identifier
    crit: notable
    conf: 0.9
    near_bytes: 4096
    all:
      - id: mutex-api
      - id: micro-behaviors/data/format/string::braced-guid-string
  - id: global-mutex-single-instance
    desc: Global mutex for single instance check
    crit: notable
    conf: 0.85
    all:
      - id: global-prefix
    any:
      - id: create-mutex
      - id: open-mutex
  - id: mutex-instance-check
    desc: Mutex-based single instance enforcement
    crit: baseline
    conf: 0.8
    all:
      - id: mutex-api
    any:
      - id: micro-behaviors/process/terminate/kill::exit-process
      - id: micro-behaviors/os/exception/error-handling::get-last-error
