defaults:
  platforms: [windows]
  for: [python]

traits:
  - id: python-ctypes-create-mutex
    desc: Python calls Windows CreateMutex through ctypes
    crit: notable
    conf: 0.95
    mbc: C0042
    if:
      type: symbol
      kind: call
      regex: '^ctypes\.windll\.kernel32\.CreateMutex[AW]?$'
