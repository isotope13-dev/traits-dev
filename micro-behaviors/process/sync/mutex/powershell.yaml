defaults:
  for: [powershell]
  platforms: [windows]
  mbc: C0042
traits:
  - id: new-object-mutex
    desc: System.Threading.Mutex creation
    crit: notable
    conf: 0.9
    if:
      type: text
      # New-Object and the PS5+ [Type]::new() form are the two canonical
      # constructions of the same .NET mutex object.
      regex: '(?i)(New-Object\s+System\.Threading\.Mutex|\[System\.Threading\.Mutex\]::new)'
  - id: global-guid-name
    desc: Global GUID mutex name
    crit: notable
    conf: 0.94
    if:
      type: text
      # Windows mutex names conventionally brace the GUID; require neither
      # spelling to the exclusion of the other.
      regex: 'Global\\\{?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\}?'
      case_insensitive: true
  - id: mutex-release-call
    desc: Mutex release method
    crit: baseline
    conf: 0.82
    if:
      type: text
      substr: ReleaseMutex
  - id: mutex-wait-one
    desc: Mutex WaitOne ownership check
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.WaitOne\s*\('
composite_rules:
  - id: global-guid-mutex-management
    desc: Global GUID mutex with management context
    crit: notable
    conf: 0.93
    all:
      - id: new-object-mutex
      - id: global-guid-name
    any:
      - id: mutex-release-call
      - id: mutex-wait-one
      - id: micro-behaviors/process/exit/terminate::powershell-negated-flag-exit
