defaults:
  platforms: [unix, ios, android]
  for: [c, cpp, macho, elf, javascript, typescript]
  mbc: C0042
traits:
  - id: posix-pthread-mutex-init
    desc: POSIX pthread_mutex_init call
    crit: baseline
    conf: 0.9
    if:
      type: string_literal
      exact: pthread_mutex_init

  - id: posix-pthread-mutex-lock
    desc: POSIX pthread mutex lock call
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: pthread_mutex_lock

  - id: posix-pthread-mutex-unlock
    desc: POSIX pthread mutex unlock call
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: pthread_mutex_unlock

composite_rules:
  - id: pthread-worker-drain-poll
    desc: Pthread worker-count drain polling
    crit: notable
    conf: 0.92
    for: [c, cpp, elf, macho]
    all:
      - id: posix-pthread-mutex-lock
      - id: posix-pthread-mutex-unlock
    any:
      - id: micro-behaviors/time/query::usleep-func
    near_lines: 20
