defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: appmutex-option-name
    desc: AppMutex option name text
    crit: component
    conf: 0.86
    if:
      type: text
      exact: AppMutex
      section: rdata

  - id: setupmutex-option-name
    desc: SetupMutex option name text
    crit: component
    conf: 0.86
    if:
      type: text
      exact: SetupMutex
      section: rdata
composite_rules:
  - id: installer-mutex-name-pair
    desc: Installer mutex option name pair
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/process/sync/mutex::appmutex-option-name
      - id: micro-behaviors/process/sync/mutex::setupmutex-option-name
