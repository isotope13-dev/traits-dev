# Python event-object waits coordinate tasks; the receiver provenance filter
# prevents an arbitrary object's `.event.wait()` method from claiming this.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable

traits:
  - id: event-wait-call
    desc: Waits on a threading or asyncio Event
    conf: 0.86
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(event|Event)\.wait$'
      receiver:
        from:
          call: '^(threading|asyncio)\.Event$'
