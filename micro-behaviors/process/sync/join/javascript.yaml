# Concurrent-join primitives: one call that waits for several already-created
# async operations and resumes once all of them settle.  A join starts no
# process, thread, or worker -- it only synchronises work that already exists --
# so it belongs with the other synchronisation primitives rather than under
# process/create/workers/, where `Promise.all` used to sit and label every
# modern JavaScript file as worker creation.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: baseline
  conf: 0.88

traits:
  - id: promise-all-join
    desc: Waits for concurrent promises with Promise.all
    if:
      type: symbol
      kind: call
      regex: '(?i)^Promise\.all$'
