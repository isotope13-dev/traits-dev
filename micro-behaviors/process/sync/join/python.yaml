# asyncio.gather is the Python counterpart of Promise.all: it awaits coroutines
# that already exist and creates no worker.  The Python symbol projection files
# call targets alongside imports, so match the plain symbol rather than
# kind: call, and keep the `asyncio.` qualifier optional only for the bare
# `from asyncio import gather` form -- an unqualified `.gather` would collide
# with tensor and dataframe gather methods.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: baseline
  conf: 0.88

traits:
  - id: asyncio-gather-join
    desc: Waits for coroutines with asyncio.gather
    if:
      type: symbol
      regex: '^(asyncio\.)?gather$'
