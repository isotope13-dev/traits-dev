defaults:
  crit: notable
  platforms: [unix]
  for: [php]
traits:
  - id: sem-get
    desc: PHP semaphore creation access
    conf: 0.9
    if:
      type: symbol
      exact: sem_get
  - id: sem-acquire
    desc: PHP semaphore acquire call
    conf: 0.92
    if:
      type: symbol
      exact: sem_acquire
  - id: sem-release
    desc: PHP semaphore release call
    conf: 0.92
    if:
      type: symbol
      exact: sem_release
composite_rules:
  - id: semaphore-ops
    desc: PHP semaphore synchronization
    conf: 0.94
    needs: 2
    any:
      - id: sem-get
      - id: sem-acquire
      - id: sem-release
    unless:
      - id: well-known/lib/runtime/scripted/php-runtime::source-tree
