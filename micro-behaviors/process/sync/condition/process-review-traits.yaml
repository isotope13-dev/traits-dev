defaults:
  crit: baseline
  platforms: [windows]
  for: [pe]
  attack: T1129
traits:
- id: condition-variable-wait--sleepconditionvariablesrw
  desc: Condition variable (SleepConditionVariableSRW)
  conf: 0.65
  if:
    type: symbol
    regex: SleepConditionVariableSRW
- id: condition-variable-wait--sleepconditionvariablecs
  desc: Condition variable (SleepConditionVariableCS)
  conf: 0.65
  if:
    type: symbol
    regex: SleepConditionVariableCS
- id: condition-variable-signal--wakeconditionvariable
  desc: Condition variable (WakeConditionVariable)
  conf: 0.65
  if:
    type: symbol
    regex: WakeConditionVariable
- id: condition-variable-signal--wakeallconditionvariable
  desc: Condition variable (WakeAllConditionVariable)
  conf: 0.65
  if:
    type: symbol
    regex: WakeAllConditionVariable
composite_rules:
- id: condition-variable-wait
  desc: Condition variable wait
  conf: 0.65
  any:
  - id: micro-behaviors/process/sync/condition::condition-variable-wait--sleepconditionvariablesrw
  - id: micro-behaviors/process/sync/condition::condition-variable-wait--sleepconditionvariablecs
- id: condition-variable-signal
  desc: Condition variable signal
  conf: 0.65
  any:
  - id: micro-behaviors/process/sync/condition::condition-variable-signal--wakeconditionvariable
  - id: micro-behaviors/process/sync/condition::condition-variable-signal--wakeallconditionvariable
- id: condition-variable-ops
  desc: Condition variable ops
  conf: 0.7
  any:
  - id: micro-behaviors/process/sync/condition::condition-variable-wait
  - id: micro-behaviors/process/sync/condition::condition-variable-signal
