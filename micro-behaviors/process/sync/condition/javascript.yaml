defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  # SharedArrayBuffer futex wait primitives used by multi-threaded Wasm/worker
  # runtimes as well as synchronization and high-resolution timing gadgets.
  - id: js-atomics-wait
    desc: Waits on shared memory with Atomics.wait
    if:
      type: symbol
      kind: call
      regex: '^Atomics\.wait(Async)?$'
