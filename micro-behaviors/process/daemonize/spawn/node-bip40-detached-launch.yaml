composite_rules:
- platforms:
  - unix
  - windows
  for:
  - javascript
  id: node-detached-child-process
  desc: Starts a detached Node child process
  crit: notable
  conf: 0.99
  scope: file
  near_bytes: 500
  all:
  - id: micro-behaviors/process/create/subprocess/launch::node-spawn-or-fork-call
  any:
  - id: micro-behaviors/process/config/launch::node-detached-true-option
  - id: micro-behaviors/process/config/launch::node-detached-debug-options
