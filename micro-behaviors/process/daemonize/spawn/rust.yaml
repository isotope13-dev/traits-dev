defaults:
  crit: notable
  platforms: [windows, unix]
  for:
    - rust
  attack: T1059
traits:
  - id: rust-fork-daemon
    desc: Uses fork::daemon for background execution
    conf: 0.85
    mbc: F0005
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(daemon)$'
  - id: rust-daemonize-crate
    desc: Daemonize crate usage
    conf: 0.85
    mbc: F0005
    if:
      type: symbol
      kind: call
      regex: 'Daemonize::'
  - id: rust-spawn-detached-win
    desc: Process spawned in detached mode (Windows)
    conf: 0.7
    if:
      type: string_literal
      word: CREATE_NEW_PROCESS_GROUP
  - id: rust-setsid-call
    desc: Rust invokes setsid
    conf: 0.9
    if:
      type: text
      regex: '\b(nix::unistd::setsid|libc::setsid|setsid\s*\()'
  - id: rust-process-group-zero
    desc: Rust child starts a new process group
    conf: 0.9
    if:
      type: text
      regex: '\.process_group\s*\(\s*0\s*\)'
  - id: rust-new-process-group-flag
    desc: Rust child uses new process group
    conf: 0.9
    if:
      type: text
      regex: '\.creation_flags\s*\([^)]{0,160}(NEW_PROCESS_GROUP|0x0{0,4}_?0?200)'
composite_rules:
  - id: rust-forgets-spawned-child
    desc: Rust forgets a spawned child handle
    conf: 0.96
    near_bytes: 1200
    all:
      - id: micro-behaviors/process/create/subprocess/launch::rust-command-spawn-call
      - id: micro-behaviors/mem/gc::rust-mem-forget

  - id: rust-spawn-detached-unix
    desc: Rust child calls setsid before execution
    conf: 0.9
    all:
      - id: micro-behaviors/process/lifecycle/initialize::rust-pre-exec-method-call
      - id: rust-setsid-call
  - id: rust-spawn-detached
    desc: Process spawned in detached mode
    conf: 0.7
    any:
      - id: rust-spawn-detached-win
      - id: rust-spawn-detached-unix
      - id: rust-process-group-zero
      - id: rust-new-process-group-flag
  - id: daemonized-execution
    desc: Process daemonization in Rust
    conf: 0.85
    mbc: F0005
    any:
      - id: rust-fork-daemon
      - id: rust-daemonize-crate
