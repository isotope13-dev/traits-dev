defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: pm2-spawn
    desc: Calls spawn with PM2 executable
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn$'
      arg:
        index: 0
        kind: string
        regex: '(^|[/\\])pm2(\.cmd|\.exe)?$'
composite_rules:
  - id: pm2-detached
    desc: PM2 spawn near detached process option
    conf: 0.9
    all:
      - id: pm2-spawn
      - id: micro-behaviors/process/create/spawn::detached-true
    near_bytes: 600
