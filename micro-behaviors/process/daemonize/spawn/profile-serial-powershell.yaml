defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: serial-powershell-wsh-clues
    desc: Serial path, PowerShell and WSH clues
    crit: suspicious
    conf: 0.97
    for: [vbs]
    all:
      - id: micro-behaviors/fs/path/app-data/application::localappdata-serial-path
      - id: micro-behaviors/process/argument/option::powershell-flagged-command-line
    any:
      - id: metadata/file/profile/process/hidden::wscript-shell-hidden-run
      - id: metadata/file/profile/operation-reference::wsh-progid-near-run
      - id: metadata/file/profile/com/progid::wscript-shell-literal
