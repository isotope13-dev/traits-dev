defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: serial-powershell-wsh-clues
    desc: Serial path, PowerShell and WSH clues
    crit: notable
    conf: 0.97
    for: [vbs]
    all:
      - id: micro-behaviors/fs/path/app-data/application::localappdata-serial-path
      - id: micro-behaviors/process/argument/option::powershell-flagged-command-line
    any:
      - id: micro-behaviors/process/create/hidden::wscript-shell-hidden-run
      - id: micro-behaviors/process/create/shell/interpreter::wsh-progid-near-run
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
