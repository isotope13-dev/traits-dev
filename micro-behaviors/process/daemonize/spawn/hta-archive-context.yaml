defaults:
  platforms: [windows]
  for: [vbs, html]

composite_rules:
  - id: wsh-archive-extract-spawn-context
    desc: Detached spawn near curl and archive extraction
    crit: suspicious
    conf: 0.99
    for: [javascript]
    near_bytes: 2400
    all:
      - id: micro-behaviors/os/env/read::wsh-expand-environment-strings-call
      - id: micro-behaviors/communications/http/download/curl::source-curl-output-option
      - id: micro-behaviors/data/archive/extract/tar::js-tar-extract-command
      - id: micro-behaviors/process/daemonize/spawn::start-no-new-window
      - id: micro-behaviors/process/create/hidden::run-zero-style-argument
      - id: micro-behaviors/fs/path/extension::windows-exe-path-reference
