defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  # os.spawn* with P_NOWAIT or P_DETACH returns at once and leaves the child
  # running: the os-module spelling of a fire-and-forget launch. Neutral on
  # its own; startup-hook composites supply the concealment context.
  - id: python-os-spawn-nowait-mode
    desc: os.spawn call in no-wait or detach mode
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bos\.spawn[lv]p?e?\(\s*os\.P_(NOWAIT|NOWAITO|DETACH)\b'
