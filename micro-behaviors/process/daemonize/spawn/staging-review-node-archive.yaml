defaults:
  platforms:
  - unix
  - windows
  crit: notable
composite_rules:
- for:
  - javascript
  - typescript
  - package.json
  - npm
  id: node-module-call-detached-child-package
  desc: npm package with module call and detached child clues
  conf: 0.96
  scope: archive
  all:
  - id: metadata/package/files/included::npm-publish-root-manifest
  - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
  - id: micro-behaviors/process/daemonize/spawn::detached-node-interpreter-child
- for:
  - javascript
  - typescript
  id: node-module-call-detached-interpreter
  desc: Module-scope call near detached Node child clues
  conf: 0.95
  scope: file
  near_bytes: 2048
  all:
  - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
  - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn
  - id: micro-behaviors/process/interpreter/node::node-interpreter-target
