defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
composite_rules:
- for:
  - javascript
  - typescript
  - package.json
  - npm
  id: node-module-call-detached-child-package
  desc: Node package module call and detached child
  conf: 0.96
  scope: archive
  all:
  - id: metadata/package/files/included::npm-publish-root-manifest
  - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
  - id: micro-behaviors/process/daemonize/spawn::detached-node-interpreter-child
- for:
  - javascript
  - typescript
  id: node-module-call-detached-interpreter
  desc: Node module call and detached interpreter clues
  conf: 0.95
  scope: file
  near_bytes: 2048
  all:
  - id: micro-behaviors/data/control-flow/module-exec::direct-zero-arg-call
  - id: metadata/file/profile/execution-api::detached-ignored-unref-spawn
  - id: metadata/file/profile/execution-api::node-interpreter-target
