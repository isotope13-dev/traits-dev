defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: prototype-method-detached-spawn
    desc: Prototype method configures detached spawn
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      query: '((assignment_expression) @method (#match? @method "(?s)\\.prototype\\.\\w{1,40}\\s*=.{0,1000}spawn\\(.{0,200}detached\\s*:\\s*true"))' 

composite_rules:
  - id: detached-node-interpreter-child
    desc: Detached Node child ignores stdio and unrefs
    crit: notable
    conf: 0.95
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/process/create/spawn::node-interpreter-target
