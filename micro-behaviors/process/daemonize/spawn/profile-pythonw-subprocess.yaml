composite_rules:
  - platforms:
      - windows
    for:
      - python
    id: pythonw-windowless-subprocess-code
    desc: Pythonw reference near windowless subprocess code
    crit: notable
    conf: 0.96
    near_lines: 30
    all:
      - id: micro-behaviors/os/application/target/development::pythonw-executable-reference
      - id: micro-behaviors/process/create/subprocess/launch::process-execution
    any:
      - id: micro-behaviors/process/config/launch::python-or-create-no-window-hex
      - id: micro-behaviors/process/config/launch::python-create-no-window-hex
      - id: micro-behaviors/process/config/launch::python-create-no-window-getattr
      - id: micro-behaviors/process/config/launch::creationflags
      - id: micro-behaviors/process/config/launch::python-qualified-create-no-window
