defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, html, vbs, pe, dll]
  attack: T1059.003
  mbc: E1059
traits:
  - id: start-command
    desc: Windows 'start' command for background
    crit: notable
    conf: 0.85
    for: [batch, powershell]
    if:
      type: string_literal
      regex: \bstart\s+['"]?\{?\$?\w*executable
  - id: start-no-new-window
    desc: Windows start /b command reference
    crit: notable
    conf: 0.9
    if:
      type: text
      # START accepts an empty quoted window title before /b. This is common in
      # command strings assembled by WSH/HTA loaders.
      regex: '(?i)\bstart\s+(""\s+)?/b\s'
  - id: start-minimized
    desc: Windows 'start /min' minimized process
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: \bstart\s+/min\s
  - id: batch-start-minimized
    desc: Batch starts minimized process
    crit: notable
    conf: 0.82
    for: [batch]
    if:
      type: text
      regex: '(?i)\bstart(\.exe)?\s+/(min|m)\b'
  - id: powershell-hidden-tokenized
    desc: Tokenized PowerShell windowstyle marker
    crit: suspicious
    conf: 0.82
    if:
      type: text
      regex: (?i)WINl8y7.{0,24}wS.{0,24}ncibn4e81u2I
composite_rules:
  - id: background-pip-install
    desc: Background pip install via Windows
    crit: notable
    conf: 0.95
    for: [dll]
    all:
      - id: start-no-new-window
      - id: micro-behaviors/os/package-manager/reference-install::pip-install
