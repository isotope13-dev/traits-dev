defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: node-spawn-detached-option
    desc: Spawn call enables detached child option
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (_) @spawn
          arguments: (arguments
            (_) . (_)
            . (object
              (pair
                key: (property_identifier) @option
                value: (true))))) @call
          (#match? @spawn "(^|\\.)spawn$")
          (#eq? @option "detached"))
