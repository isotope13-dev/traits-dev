# Node.js event-loop handle detachment
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  mbc: "F0011"

traits:
  - id: detached-obfuscated-true
    desc: Detached spawn uses obfuscated true
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "['\"]detached['\"]\\s*:\\s*!!\\s*\\[\\s*\\]"
  - id: node-handle-indirect-unref
    desc: Indirect string-keyed unref dispatch
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\s*\([^)]{0,140}[''"]unref[''"]\s*\)\s*\(\s*\)'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
  # Large UMD bundles can lose call facts while retaining the expression.
  - id: node-handle-unref-text
    desc: Node handle unref call in bundled JavaScript
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.unref\s*\(\s*\)'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
