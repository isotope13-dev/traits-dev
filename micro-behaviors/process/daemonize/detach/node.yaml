# Node.js event-loop handle detachment
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  mbc: "F0011"

traits:
  - id: detached-obfuscated-true
    desc: Detached spawn uses obfuscated true
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "['\"]detached['\"]\\s*:\\s*!!\\s*\\[\\s*\\]"
  # javascript-obfuscator commonly spells true as !0x0 and property access as
  # ['unref']. Requiring both nearby distinguishes a detached child from an
  # arbitrary obfuscated boolean property.
  - id: node-obfuscated-detached-unref
    desc: Obfuscated detached process unrefs child
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '[''"]detached[''"]\s*:\s*!0x0.{0,512}\[[''"]unref[''"]\]\(\s*\)'
  - id: node-obfuscated-detached-unref-alias
    desc: Obfuscated detached unrefs via alias
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: "'detached'\\s*:\\s*!0x0"
  - id: node-handle-indirect-unref
    desc: Indirect string-keyed unref dispatch
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\s*\([^)(]{0,140}[''"]unref[''"]\s*\)\s*\(\s*\)'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
  # Plain-source spelling of the same detachment, matched as text rather than
  # as a call fact: large UMD bundles lose the call fact while keeping the
  # expression. The matcher tests no bundle property, so the description must
  # not claim one — `subprocess.unref()` in ordinary hand-written source (the
  # npm `open` package detaching the browser it launched) is exactly this.
  - id: node-handle-unref-text
    desc: Detaches a handle with unref()
    crit: notable
    conf: 0.86
    if:
      type: text
      # The handle is either bound to a name (`child.unref()`) or is the value
      # the creating call just returned (`spawn(...).unref()`, the
      # fire-and-forget spelling). Anchoring only on an identifier missed the
      # chained form entirely.
      regex: '(\)|\b[A-Za-z_$][A-Za-z0-9_$]*)\s*\.\s*unref\s*\(\s*\)'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
  # `spawn(...).unref()` — the handle is dropped on the same expression that
  # created the child, so the parent can exit and leave it running. The atoms
  # above key on `<identifier>.unref()`; a chained call has no identifier to
  # anchor on, which is exactly how fire-and-forget launchers are written.
  # Neutral by itself: `open`, `opener` and every "launch the browser" helper
  # detach their child this way.
  - id: node-spawn-result-unref
    desc: Unrefs the child returned by spawn
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bspawn(Sync)?\s*\([^(]{0,300}?\)\s*\.\s*unref\s*\(\s*\)'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
