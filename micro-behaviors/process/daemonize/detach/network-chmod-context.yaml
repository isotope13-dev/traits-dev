defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: raw-ip-chmod-nohup-context
    desc: nohup launch with raw-IP and chmod context
    crit: suspicious
    conf: 0.99
    attack: "T1105,T1059.004,T1222.002"
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-target
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
    any:
      - id: micro-behaviors/communications/http/download/cli::fetch-output-flag-script
      - id: micro-behaviors/communications/http/download/shell::shell-dev-tcp-http-get-download

