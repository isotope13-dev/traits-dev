defaults:
  platforms: [unix]
  for: [ruby]
traits:
  - id: ruby-module-load-nohup-shell
    desc: Ruby module-load nohup shell invocation
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: system
      module_level: true
      arg:
        index: 0
        kind: string
        regex: '^nohup\s+sh\s+-c\s'
