# PTY helpers and daemons both use this neutral session setup.
# These operations alone establish neither hidden payloads nor supply-chain abuse.
composite_rules:
  - id: python-fork-detach-stdio
    desc: Python forks, detaches, and duplicates stdio
    crit: notable
    conf: 0.96
    for: [python]
    platforms: [linux, macos]
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/process/fork/clone::python-fork-child-branch
      - id: micro-behaviors/process/fd/dup::python-dup2
      - id: micro-behaviors/process/daemonize/detach::python-setsid
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
