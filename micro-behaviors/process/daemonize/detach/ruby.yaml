defaults:
  platforms: [unix]
  for: [ruby, scripts]
  crit: notable
  conf: 0.85

traits:
  - id: ruby-fork-exit-detach
    desc: Ruby fork-and-exit process detachment
    if:
      type: text
      regex: '(?i)\b(exit\s+if\s+(Process\.)?fork|(Process\.)?fork\s*(and|&&)\s*exit)\b'
  - id: ruby-process-setsid-call
    desc: Ruby starts a new session with setsid
    conf: 0.95
    for: [ruby]
    if:
      type: symbol
      kind: call
      exact: Process.setsid
