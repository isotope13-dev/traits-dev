defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-detached-browser-clues
    desc: Install script has detached launch clues
    crit: notable
    conf: 0.97
    size_max: 10240
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: metadata/import/builtin::require-child-process
      - id: metadata/file/profile/command-options::detached-true
      - id: micro-behaviors/process/fd/stdio::child-stdio-ignore-option
    any:
      - id: micro-behaviors/fs/path/application/executable::installed-chrome-windows-path
      - id: micro-behaviors/process/create/shell/launch::node-starts-variable-target
