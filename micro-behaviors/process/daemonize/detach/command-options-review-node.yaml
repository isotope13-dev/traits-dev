defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: detached-true
    size_max: 262144
    desc: Detached process spawn option
    crit: notable
    conf: 0.85
    # Match the actual call, including TypeScript's (0, module.spawn)(...).
    # An options object passed to an unrelated API is not process detachment.
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (_) @callee
          arguments: (arguments
            (object (pair key: (_) @key value: (_) @value)))) @call
          (#match? @callee "(^|\\.)(spawn|fork|execFile)(Sync)?[\\s)]*$")
          (#match? @key "^[\"']?detached[\"']?$")
          (#match? @value "^(true|!\\s*0)$"))
  # Computed child_process["spawn"] access is not emitted as a tree-sitter
  # call to a named spawn identifier. Keep the same process-launch claim, but
  # bind Node -e and the detached option within the computed spawn call.
  - id: computed-node-spawn-detached-true
    desc: Computed Node spawn detached option
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (subscript_expression index: (string (string_fragment) @api))
          arguments: (arguments
            (string (string_fragment) @runtime)
            (array . (string (string_fragment) @flag))
            (object (pair key: (property_identifier) @option
              value: (true))))) @launch
          (#eq? @api "spawn")
          (#eq? @runtime "node")
          (#eq? @flag "-e")
          (#eq? @option "detached"))
