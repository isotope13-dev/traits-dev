defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
- id: python-detached-kwargs-new-session
  desc: Sets subprocess new-session keyword
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\["start_new_session"\]\s*=\s*True'
- id: python-subprocess-new-session-option
  desc: Python subprocess new-session option
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: "start_new_session=True"
  # The pre-3.2 spelling of the same capability: the child is given its own
  # POSIX process group via preexec, so terminal signals no longer reach it.
  # Neutral session setup for supervisors and daemons; concealment claims
  # belong to composites that add the payload context.
- id: python-subprocess-preexec-setpgrp
  desc: Python child in its own process group
  crit: notable
  conf: 0.9
  if:
    type: literal
    substr: preexec_fn=os.setpgrp
- id: python-detached-session-or-flag
  desc: Python detached session or process flag
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\bstart_new_session\s*=\s*True\b|\bDETACHED_PROCESS\b'

composite_rules:
- id: python-session-launch-directory-removal
  desc: Python session launch near directory removal
  crit: notable
  conf: 0.95
  near_lines: 20
  all:
  - id: python-subprocess-new-session-option
  - id: micro-behaviors/process/create/subprocess/launch::popen-ast
  - id: micro-behaviors/fs/delete/directory::shutil-rmtree
  any:
  - id: micro-behaviors/fs/path/hidden::hidden-tmp-dotfile-path
  - id: micro-behaviors/fs/path/archive::unix-temp-archive-path
  - id: micro-behaviors/data/archive/extract/capability::python-extractall-call
  - id: micro-behaviors/fs/chmod/modify::python-chmod-call-with-exec-bit
- id: python-detached-daemon-process
  desc: Python starts a detached daemon process
  crit: notable
  conf: 0.94
  near_bytes: 650
  all:
  - id: micro-behaviors/process/create/subprocess/launch::popen-ast
  any:
  - id: python-detached-session-or-flag
  - id: python-detached-kwargs-new-session
  - id: python-subprocess-preexec-setpgrp
