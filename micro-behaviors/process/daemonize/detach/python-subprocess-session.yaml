defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
- id: python-subprocess-new-session-option
  desc: Python subprocess new-session option
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: "start_new_session=True"
  # The pre-3.2 spelling of the same capability: the child is given its own
  # POSIX process group via preexec, so terminal signals no longer reach it.
  # Neutral session setup for supervisors and daemons; concealment claims
  # belong to composites that add the payload context.
- id: python-subprocess-preexec-setpgrp
  desc: Python child in its own process group
  crit: notable
  conf: 0.9
  if:
    type: literal
    substr: preexec_fn=os.setpgrp
