# Curl, unzip, chmod and detached launch clues coexist without a path binding
# from the fetched archive to the launched child.
defaults:
  platforms: [macos]
  for: [macho]

composite_rules:
  - id: macos-fetch-unzip-detached-launch-profile
    desc: Mach-O curl, unzip, chmod and detached-launch clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/download/curl::macos-libcurl-http
      - id: micro-behaviors/data/archive/extract/zip::unzip-command
      - id: micro-behaviors/fs/chmod/executable/dangerous::native-chmod-0777-command
      - id: micro-behaviors/process/daemonize/detach::native-nohup-hidden-output
