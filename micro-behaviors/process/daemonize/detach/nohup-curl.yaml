# Output redirection and nohup are ordinary unattended-job mechanics.
defaults:
  platforms: [unix]
  for: [scripts, source]
composite_rules:
  - id: nohup-curl-download-output-suppressed
    desc: nohup curl download with output suppressed
    crit: notable
    conf: 0.92
    near_lines: 1
    all:
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
      - id: micro-behaviors/process/daemonize/detach::nohup-devnull-same-command
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/communications/http/curl::curl-command-remote-url

