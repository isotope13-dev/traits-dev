defaults:
  platforms:
    - linux
    - macos
  for: [elf, macho]
traits:
  - id: native-double-fork-x64-shape
    desc: x64 double-fork control-flow shape
    crit: notable
    conf: 0.98
    for: [elf]
    platforms: [linux]
    if:
      type: hex
      section: .text
      pattern: 'E8 ?? ?? ?? ?? 85 C0 79 ?? [0-24] E8 ?? ?? ?? ?? 85 C0 78 ?? E8 ?? ?? ?? ?? 85 C0'

composite_rules:
  # GCC/Clang x86-64 double-fork daemon shape: fork, setsid, then fork again,
  # with the parent/error branches exiting around the sequence. This is much
  # narrower than the generic fork + setsid capability below.
  - id: native-double-fork-daemon-x64
    desc: Native process uses double-fork daemonization
    crit: notable
    conf: 0.98
    for: [elf]
    platforms: [linux]
    all:
      - id: micro-behaviors/process/fork/clone::fork
      - id: micro-behaviors/process/daemonize/detach::setsid-import
      - id: native-double-fork-x64-shape

  - id: python-fork-new-session
    desc: Python forks a process into a detached session
    crit: notable
    conf: 0.9
    for: [python]
    all:
      - id: micro-behaviors/process/fork/clone::python-os-fork
      - id: micro-behaviors/process/daemonize/detach::python-setsid

  - id: fork-new-session
    desc: Forks process into detached session
    crit: notable
    conf: 0.75
    all:
      - id: micro-behaviors/process/fork/clone::fork
      - id: micro-behaviors/process/daemonize/detach::setsid-import
    unless:
      - id: metadata/lang/compiler/systems::rustc-path
      - id: metadata/lang/compiler/systems::rust-src-path
      - id: metadata/lang/compiled::go-runtime-marker
      - id: metadata/lang/compiler/systems::go-binary-macho
  - id: self-exe-session-detach
    desc: Reads own executable while detaching process session
    crit: notable
    conf: 0.75
    for: [elf]
    platforms: [linux]
    all:
      - id: micro-behaviors/fs/proc/info/path::process-self-exe-path
      - id: micro-behaviors/process/daemonize/detach::setsid-import
    any:
      - id: micro-behaviors/process/fork/clone::fork
      - id: micro-behaviors/process/create/direct::execve-import
    unless:
      - id: well-known/tool/reverse-engineering/renderdoc/
  - id: full-daemon
    desc: Full daemon behavior (fork + setsid + devnull)
    crit: notable
    conf: 0.9
    for:
      - elf
    platforms:
      - linux
    all:
      - id: micro-behaviors/fs/path/device/special::dev-null
      - id: micro-behaviors/process/fork/clone::fork
      - id: micro-behaviors/process/daemonize/detach::setsid-import
    downgrade:
      any:
        - id: metadata/lang/compiler/systems/
        - id: metadata/binary/metrics/structural::many-imports
        - id: metadata/lang/compiler/systems::go-version-string
        - id: micro-behaviors/dylib/library/family/
        - id: micro-behaviors/dylib/library/family::shell-builtin-marker
