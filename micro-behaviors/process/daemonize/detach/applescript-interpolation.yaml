defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
traits:
  - id: applescript-nohup-interpolated-command
    desc: AppleScript builds an interpolated nohup command
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'do shell script [\\]*"nohup [\\]*"\s*&\s*[a-zA-Z_]\w*'
