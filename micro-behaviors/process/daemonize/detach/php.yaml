defaults:
  platforms: [unix]
  for: [php]
  crit: notable
  conf: 0.85

traits:
  - id: posix-setsid
    desc: PHP creates a new process session
    if:
      type: symbol
      kind: call
      exact: posix_setsid
    unless:
      - id: metadata/library/generated::php-manual-empty-function-stubs

composite_rules:
  - id: daemonize
    desc: PHP forks into a new session
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/process/fork/clone::pcntl-fork
      - id: posix-setsid
