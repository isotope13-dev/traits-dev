defaults:
  platforms: [windows]
  for: [python]
  crit: suspicious
  conf: 0.97

composite_rules:
  - id: setup-py-build-py-detached-devnull-popen
    desc: Python build_py hook starts a detached, silent child process
    scope: file
    all:
      - id: metadata/package/files/included::setup-py-basename
      - id: metadata/build/package/recipe/setup-hooks::setup-cmdclass-build-py
      - id: metadata/build/package/recipe/setup-hooks::setuptools-build-py-run-override
      - id: metadata/build/package/recipe/setup-hooks::run-override-calls-helper-after-super
      - id: micro-behaviors/fs/path/extension::exe-name-or-extension
      - id: micro-behaviors/process/config/launch::python-detached-process-use
      - id: micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment
    any:
      - id: micro-behaviors/process/create/subprocess/launch::popen-ast
      - id: micro-behaviors/process/create/subprocess/launch::python-subprocess-string-command
      - id: micro-behaviors/process/create/subprocess/launch::build-extension-subprocess-popen
