defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: setsid-hidden-command
    desc: Setsid command names hidden executable
    if:
      type: text
      regex: 'setsid([ \t]+--?[A-Za-z]+){0,3}[ \t]+(\S{1,80}/)?\.[\w-]{1,32}([ \t]|$)'
  - id: detached-python-launch-text
    desc: Launches Python in a detached session
    for: [go, shell]
    if:
      type: text
      regex: 'setsid[ \t]+python[23]?[ \t]+'
