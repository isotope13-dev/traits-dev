defaults:
  platforms: [windows, unix]
  for: [python]
composite_rules:
- id: setup-py-detached-devnull-popen
  crit: suspicious
  desc: Setup hook detaches a silenced subprocess
  conf: 0.96
  all:
  - id: metadata/package/files/included::setup-py-basename
  - id: metadata/build/package/recipe/setup-hooks::setuptools-run-override
  - id: micro-behaviors/process/config/launch::python-detached-process-use
  - id: "micro-behaviors/process/fd/stdio::python-subprocess-near-devnull-stdio-assignment"
  any:
  - id: micro-behaviors/process/create/subprocess/launch::popen-ast
  - id: micro-behaviors/process/create/subprocess/launch::python-subprocess-string-command
  - id: metadata/build/package/recipe/setup-hooks::setup-py-subprocess
  unless:
  - id: metadata/path/directory::test-directory-component
