defaults:
  platforms: [macos]
  for: [shell]
  crit: notable
  attack: T1059.004

traits:
  - id: nohup-quoted-macos-app-bundle
    desc: Detaches quoted macOS .app binary via nohup
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: nohup
      arg:
        index: 0
        kind: string
        regex: '^[^"''\r\n]{1,96}\.app/Contents/MacOS/[^/"''\r\n]+$'

  - id: nohup-unquoted-macos-app-bundle
    desc: Detaches macOS .app binary via nohup
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: nohup
      arg:
        index: 0
        kind: identifier
        name_regex: '^[^"''\r\n]{1,96}\.app/Contents/MacOS/[^/"''\r\n]+$'
