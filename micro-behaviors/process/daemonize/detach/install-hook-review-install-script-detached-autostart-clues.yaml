defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-detached-autostart-clues
    desc: Install script has detached-process and autostart references
    crit: suspicious
    conf: 0.99
    for:
      - npm
      - tar
      - package.json
      - javascript
    scope: archive
    all:
      - id: micro-behaviors/process/daemonize/detach::install-named-script-detach-options
    any:
      - id: micro-behaviors/os/registry/autostart/reference::currentversion-run
      - id: micro-behaviors/os/service/launchagent::source-launchagents-join
      - id: micro-behaviors/os/autorun/login-items::xdg-user-autostart-path
    unless:
      - id: well-known/app/ai/coding-agent/brokre::brokre-mcp-archive-context
      - id: well-known/app/ai/coding-agent/yaver::yaver-cli-archive-context
