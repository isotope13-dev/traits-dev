defaults:
  platforms: [unix]
  for: [shell, go, python]
  crit: notable
  conf: 0.9
traits:
  # A script interpreter launched in its own session on a script whose path
  # is a variable: the second half of a decode-then-run dropper.
  - id: detached-interpreter-variable-script
    desc: Detached interpreter runs a variable script
    if:
      type: text
      regex: '\b(setsid|nohup)\s+(python[0-9.]*|bash|sh|perl|ruby|node|php)\s+["'']?\$\{?[A-Za-z_]'
  # `pgrep -f X || (setsid X &)`: relaunch unless already running, the
  # watchdog line implants drop into shell rc files and cron.
  - id: relaunch-unless-running
    desc: Relaunches a process unless pgrep finds it
    if:
      type: text
      regex: '\b(pgrep|pidof)\s[^\n|;]{1,80}\)?\s*\|\|\s*\(?\s*(setsid|nohup|exec)\s'
  # Go child placed in its own session: it survives the parent and has no
  # controlling terminal.
  - id: go-setsid-sysprocattr
    desc: Go child process gets its own session
    for: [go]
    if:
      type: text
      regex: 'SysProcAttr\{[^}]{0,80}\bSetsid:\s*true'
