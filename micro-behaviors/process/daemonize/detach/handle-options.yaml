defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: js-bracket-unref-call
    desc: Bracket unref releases handle retention
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: "\\[['\"]unref['\"]\\]\\(\\)"

  - id: js-negated-detached-option
    desc: Detached process option uses boolean negation
    conf: 0.94
    if:
      type: text
      regex: 'detached[''"]?\s*:\s*!'
