---
defaults:
  for:
  - macho
  platforms:
  - macos
composite_rules:
- id: macho-sparse-shell-session-clues
  desc: Sparse Mach-O with shell and session clues
  crit: notable
  conf: 0.96
  all:
  - id: metadata/binary/section/ratio::macho-extreme-sparse-cstring-section
  - id: micro-behaviors/process/create/shell/
  - id: micro-behaviors/process/daemonize/detach::fork-new-session
  any:
  - id: micro-behaviors/process/create/subprocess/reference::excessive-popen
  - id: metadata/binary/section/entropy::macho-data-entropy-at-least-65
  - id: metadata/binary/layout/strings::high-entropy-strings-20
- id: macho-unsigned-popen-session-profile
  desc: Unsigned Mach-O with popen and session clues
  crit: notable
  conf: 0.99
  all:
  - id: metadata/binary/section/ratio::macho-extreme-sparse-cstring-section
  - id: metadata/binary/section/entropy::macho-data-entropy-at-least-65
  - id: micro-behaviors/process/create/subprocess/reference::excessive-popen
  - id: micro-behaviors/process/daemonize/detach::fork-new-session
  - id: metadata/binary/bundle::unsigned-generic-bundle-id
  any:
  - id: metadata/binary/layout/strings::high-entropy-strings-20
  - id: metadata/binary/code/density::extreme-text-to-string-ratio
