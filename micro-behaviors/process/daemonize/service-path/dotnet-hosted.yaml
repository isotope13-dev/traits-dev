defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll]
  crit: notable

traits:
  - id: dotnet-add-hosted-service
    desc: Registers a hosted background service
    conf: 0.9
    if:
      type: text
      exact: AddHostedService
  - id: dotnet-http-sink-startup-service
    desc: Names an HTTP sink startup service
    conf: 0.9
    if:
      type: text
      exact: HttpSinkStartupService
composite_rules:
  - id: dotnet-hosted-startup-service
    desc: Registers background hosted startup service
    conf: 0.9
    all:
      - id: dotnet-add-hosted-service
      - id: dotnet-http-sink-startup-service

