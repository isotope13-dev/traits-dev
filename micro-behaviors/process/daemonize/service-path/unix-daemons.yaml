# Absolute paths of ordinary Unix daemons. A kill-list or unit file that
# names them is not pretending to be them.
defaults:
  platforms: [linux, openwrt]
  for: [elf, c, cpp]
  crit: notable
  conf: 0.9

traits:
  - id: syslogd-daemon-path
    desc: References the syslogd daemon path
    if:
      type: text
      exact: /usr/sbin/syslogd

  - id: cron-daemon-path
    desc: References the cron daemon path
    if:
      type: text
      exact: /usr/sbin/cron

  - id: dbus-daemon-path
    desc: References the dbus-daemon path
    if:
      type: text
      exact: /usr/bin/dbus-daemon

  - id: sbin-auditd-cron-acpid
    desc: References auditd, cron, or acpid paths
    if:
      type: text
      regex: /usr/sbin/(auditd|cron[d]?|acpid)
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: sbin-atd-sshd-rsyslogd
    desc: References atd, sshd, or rsyslogd paths
    if:
      type: text
      regex: /usr/sbin/(atd|sshd|rsyslogd)
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

composite_rules:
  - id: syslogd-dbus-cron-path-set
    desc: References syslogd, dbus-daemon, and cron paths
    all:
      - id: syslogd-daemon-path
      - id: dbus-daemon-path
      - id: cron-daemon-path
