defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-detached-lifecycle-context
    desc: Detached option with daemon lifecycle evidence
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/process/create/spawn::detached-true
    any:
      - id: micro-behaviors/process/pid::node-pidfile-reference
      - id: micro-behaviors/fs/path/log/channel::node-daemon-log-reference
      - id: micro-behaviors/ui/terminal::node-daemon-pid-announcement
      - id: micro-behaviors/ui/terminal::node-daemon-server-banner
      - id: micro-behaviors/communications/socket/bind/address::bind-loopback-address
      - id: micro-behaviors/communications/socket/listen::node-server-listen

