defaults:
  platforms: [windows]
  for: [batch, powershell, shell, scripts]


traits:
  - id: batch-start-background-directory
    desc: Batch start background command with directory
    crit: notable
    conf: 0.9
    for: [batch]
    if:
      type: text
      regex: '(?i)\bstart\s+""\s+/d\s+\S+\s+/b\s+'
