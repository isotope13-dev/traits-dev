# Shell backgrounding: a subshell or command group launched as an async job
# with a trailing `&`. A neutral process-control capability — ubiquitous in
# parallel CI scripts and build pipelines (run N downloads concurrently, then
# `wait`). On its own it carries no intent; a C2/beacon composite must supply
# the polling, jitter, and exec legs.
defaults:
  platforms: [unix]
  for: [github-actions, shell]
traits:
  - id: sh-background-subshell
    desc: Shell backgrounds a subshell job
    crit: baseline
    conf: 0.75
    if:
      type: text
      regex: '\)\s*&\s*$'

  # A relative helper command runs in the background with output discarded.
  - id: path-helper-background-output-discarded
    desc: Path helper backgrounds with discarded output
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)(^|[;&|])[ \t]*(\./|[\w-]{1,20}/)[\w.-]{1,30}\s*>\s*/dev/null\s+2>&1\s*&'

  # A trailing ampersand backgrounds a fetch but does not establish detachment.
  - id: fetch-background-ampersand
    desc: Background curl or wget job
    crit: notable
    conf: 0.85
    for: [shell, python, javascript, typescript]
    if:
      type: text
      regex: '(?m)\b(curl|wget)\b[^\n]{0,220}\s&\s*$'
      not:
        - regex: '(-X\s*|--request\s+)POST\b'
        - regex: '(-d|--data[\w-]*)\b'
        - regex: '(-F|--form[\w-]*)\b'
