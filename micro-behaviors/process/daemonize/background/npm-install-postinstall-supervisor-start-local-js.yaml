defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: postinstall-supervisor-start-local-js
  desc: Postinstall starts a supervised Node script
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/process/daemonize/background::postinstall-supervisor-start-local-js-marker
  - id: metadata/package/dependencies/name-form::npm-dep-child-process
  # Umbrella over the inline decoders an obfuscated hook can use, so downstream
  # composites survive an attacker swapping char codes for base64/escape.
