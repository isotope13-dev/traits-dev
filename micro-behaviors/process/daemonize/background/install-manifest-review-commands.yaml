defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: npm-script-background-shell-command
    desc: npm script declares a background shell command
    crit: notable
    conf: 0.92
    if:
      type: value
      path: "scripts"
      # Require an actual shell script invocation followed by a background
      # ampersand. Redirections alone (for example `test.sh 2>/dev/null`) are
      # ordinary package test scripts, not background sidecars.
      regex: "(^|[;&|])\\s*(bash|sh)\\s+(\\./)?[A-Za-z0-9_./-]{1,120}\\.sh\\b[^&]{0,80}&(\\s|$)"
    unless:
      - id: well-known/app/ai/gateway/neurolink::benign-archive-context
