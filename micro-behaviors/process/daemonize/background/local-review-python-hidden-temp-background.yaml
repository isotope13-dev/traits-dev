defaults:
  for:
  - python
  platforms:
  - unix
traits:
- id: python-background-hidden-temp
  desc: Shell backgrounds hidden temporary path
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: call
    exact: os.system
    arg:
      index: 0
      kind: string
      regex: /tmp/\.[\w.-]+\s*&\s*$
