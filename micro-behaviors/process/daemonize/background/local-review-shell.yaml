defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: background-tmp-execution
    desc: Backgrounds executable from temporary path
    crit: notable
    conf: 0.9
    attack: T1059.004
    if:
      type: text
      regex: '(?m)(^|[;&|]\s*)(nohup\s+)?/(tmp|var/tmp|dev/shm)/["''\.\w$][^\n;|\r]{0,80}\s+&\s*$'
  - id: background-local-exec
    desc: "Executes local file in background (& operator)"
    crit: notable
    conf: 0.85
    attack: T1059.004
    if:
      type: text
      regex: '(?m)\./["''\.\w\$][^\n;&]{0,80}\s+&\s*$'
    downgrade:
      any:
        - id: metadata/path/directory::test-directory-component
    unless:
      - id: micro-behaviors/revision-control/repository::git-operations-1
      - id: metadata/lang/source/syntax/command/named-command::git-working-tree-command-reference
  - id: execute-variable-background
    desc: Backgrounds a shell-variable executable
    crit: notable
    conf: 0.9
    attack: T1059.004
    if:
      type: text
      regex: '(?m)^\s*["'']?\$\{?[A-Za-z_][A-Za-z0-9_]*\}?["'']?\s+&\s*$'
  - id: hidden-tmp-background-exec
    desc: Backgrounds a hidden temporary executable
    crit: notable
    conf: 0.94
    for: [shell, php, applescript, makefile, scala]
    if:
      type: text
      regex: '(?m)(^|[;&]\s*|nohup\s+)/(var/)?tmp/\.[A-Za-z0-9_][A-Za-z0-9._-]*[^;\n]{0,80}\s*&'
  - id: hidden-home-background-exec
    desc: Backgrounds a hidden home executable
    crit: notable
    conf: 0.94
    for: [shell, php]
    if:
      type: text
      regex: '(?m)(^|[;&]\s*)~/\.[A-Za-z0-9_][A-Za-z0-9._-]*[^;\n]{0,80}\s*&'
