# A backgrounded command group redirects its output to /dev/null.
defaults:
  platforms: [unix]
  for: [scripts, source, makefile, dockerfile, text, pbxproj]
  crit: notable
  conf: 0.85

traits:
  - id: subshell-detached-output-discarded
    desc: Backgrounded group with output discarded
    if:
      type: text
      regex: '\)\s*>\s*/dev/null\s*2>&1\s*&'
