defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: preinstall-nohup-node-dropper
  desc: Preinstall runs Node quietly with nohup
  crit: notable
  conf: 0.98
  all:
  - id: metadata/package/scripts/lifecycle::filtered-preinstall-hook
  - id: micro-behaviors/process/daemonize/background::preinstall-nohup-node
  - id: micro-behaviors/process/fd/stdio::preinstall-devnull-redir
