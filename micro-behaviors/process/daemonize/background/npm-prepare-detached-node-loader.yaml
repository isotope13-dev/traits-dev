defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: prepare-detached-node-loader
  desc: Prepare background Node commands
  crit: notable
  conf: 0.99
  all:
  - id: metadata/package/scripts/lifecycle::filtered-prepare-hook
  - id: micro-behaviors/process/daemonize/background::prepare-cross-platform-background
  any:
  - id: micro-behaviors/process/daemonize/background::prepare-detached-node-sidecar
  - id: micro-behaviors/process/daemonize/detach::nohup-hidden-output
