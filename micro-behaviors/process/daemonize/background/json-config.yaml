# A JSON config compiled into a binary that switches on background mode:
# the program detaches from its console. Neutral alone; services and agents
# ship the same key.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe]

traits:
  - id: json-background-mode-enabled
    desc: Embedded JSON config enables background mode
    crit: notable
    conf: 0.8
    if:
      type: raw
      regex: '"background"\s*:\s*true\b'
