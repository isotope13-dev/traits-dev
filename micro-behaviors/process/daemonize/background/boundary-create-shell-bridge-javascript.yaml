defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
traits:
  - id: js-execsync-backgrounds-variable-command
    desc: execSync backgrounds a variable command
    crit: notable
    conf: 0.94
    attack: T1059.007
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: \bexecSync\s*\(\s*`[^`\n]{0,180}\$\{[A-Za-z_$][\w$]*\}[^`\n]{0,80}&\s*`
