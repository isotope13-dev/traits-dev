defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [elf, macho, pe]
traits:
  - id: process-setsid
    desc: Create new session and become session leader
    conf: 0.7
    if:
      type: syscall
      name:
        - setsid
composite_rules:
  - id: daemon
    desc: Fork or clone and setsid syscalls coexist
    conf: 0.85
    for: [elf]
    platforms:
      - linux
    all:
      - id: micro-behaviors/process/create/fork::process-creation-primitive
      - id: process-setsid
  - id: daemon-full
    desc: Fork, setsid and dup syscall evidence
    conf: 0.9
    for: [elf]
    platforms:
      - linux
    all:
      - id: micro-behaviors/process/create/fork::process-creation-primitive
      - id: process-setsid
      - id: micro-behaviors/process/fd/dup::multiple-dup-syscall-sites-linux
  - id: daemon-macos
    desc: macOS daemon behavior - detaches from terminal
    conf: 0.85
    for: [macho]
    platforms:
      - macos
    all:
      - id: micro-behaviors/process/create/fork::process-creation-primitive
      - id: process-setsid
  - id: daemon-macos-full
    desc: Full macOS daemon pattern with FD redirection
    conf: 0.9
    for: [macho]
    platforms:
      - macos
    all:
      - id: micro-behaviors/process/create/fork::process-creation-primitive
      - id: process-setsid
      - id: micro-behaviors/process/fd/dup::syscall-dup-redirect-macos
