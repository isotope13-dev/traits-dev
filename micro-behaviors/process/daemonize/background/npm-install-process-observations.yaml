defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: postinstall-supervisor-start-local-js-marker
  desc: Postinstall starts a supervised Node script
  crit: suspicious
  conf: 0.97
  if:
    type: value
    path: "scripts.postinstall"
    regex: "^forever\\s+start\\s+(\\./)?[A-Za-z0-9_./-]{1,120}\\.(c?js|mjs)$"

- id: preinstall-nohup-node
  desc: Preinstall starts Node with nohup
  crit: suspicious
  conf: 0.95
  if:
    type: value
    path: "scripts.preinstall"
    regex: "\\bnohup\\s+node\\s+[^\"\\n]{1,80}\\.js\\b"
