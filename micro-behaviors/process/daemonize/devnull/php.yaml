defaults:
  platforms: [unix]
  for: [php]
traits:
  # The launched command's output is discarded and the job is backgrounded
  # with `&`, so the child outlives the request that started it. Matched on
  # the string constant so interpolated commands (`exec("php \"$f\" > ...")`)
  # still count.
  - id: php-background-execution-devnull
    desc: Backgrounds a command with output discarded
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '/dev/null\s+2>&1\s*&\s*$'
