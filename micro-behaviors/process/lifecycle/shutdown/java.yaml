# Java shutdown-hook registration is a lifecycle capability. The hook's work
# determines whether registration relates to cleanup, persistence, or anything
# else; registration by itself does not establish an objective.
defaults:
  platforms: [unix, windows]
  for: [class, java]
  crit: notable
  conf: 0.9

traits:
  - id: java-shutdown-hook-registration
    desc: Registers a Java shutdown hook
    if:
      type: text
      exact: addShutdownHook
