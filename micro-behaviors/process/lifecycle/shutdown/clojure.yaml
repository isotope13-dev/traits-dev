# JVM shutdown-hook registration is a neutral lifecycle capability. Cleanup,
# persistence, or destructive intent must come from surrounding behavior.
defaults:
  platforms: [unix, windows]
  for: [clojure]
  crit: notable
  conf: 0.9

traits:
  - id: clojure-shutdown-hook-registration
    desc: Registers a JVM shutdown hook
    if:
      type: symbol
      kind: call
      exact: .addShutdownHook
