defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: process-on-uncaught-exception
    desc: Node process uncaughtException handler
    if:
      type: symbol
      kind: call
      exact: process.on
      arg:
        kind: string
        exact: uncaughtException
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/file/format/source-map::sourcemap
      - id: metadata/file/format/source-map::sourcemap-context

  - id: process-on-unhandled-rejection
    desc: Node process unhandledRejection handler
    if:
      type: symbol
      kind: call
      exact: process.on
      arg:
        kind: string
        exact: unhandledRejection
    unless:
      - id: metadata/file/format/source-map::sourcemap
      - id: metadata/file/format/source-map::sourcemap-context
