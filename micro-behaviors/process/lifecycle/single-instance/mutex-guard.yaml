defaults:
  for:
  - c
  - cpp
  platforms:
  - windows
  crit: notable
  conf: 0.95
traits:
- id: mutex-already-exists-return-guard
  desc: Returns on mutex already-exists status
  if:
    type: text
    regex: GetLastError\(\)\s*==\s*ERROR_ALREADY_EXISTS\)\s*return\b
composite_rules:
- id: create-mutex-single-instance-guard
  desc: Mutex creation beside already-exists return guard
  all:
  - id: micro-behaviors/process/sync/mutex::create-mutex
  - id: mutex-already-exists-return-guard
  near_bytes: 256
