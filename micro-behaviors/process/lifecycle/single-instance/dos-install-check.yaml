# DOS resident programs answer a private "already installed?" call from
# inside their interrupt handler so a second copy does not load.
# Headerless resident bodies sniff as data.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data, static-lib]
  size_max: 65536

traits:
  # MOV AX,imm; IRET directly followed by CMP AX,imm; JE: the handler
  # returns a private reply to a private request, the residency check.
  # The second form tests a private AH request (CMP AH,imm; JNE) and
  # answers with MOV AX,imm; POPF; IRET before chaining other calls.
  # The third form tests a private AH request and answers by stepping AH
  # (DEC/INC AH; IRET) so the caller sees a changed function number.
  - id: dos-handler-install-check-reply
    desc: Handler replies to a private install check
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "(B8 ?? ?? CF 3D ?? ?? 74|B8 ?? ?? CF 3D ?? ?? 75|80 FC ?? 75 0? B8 ?? ?? 9D CF|80 FC ?? 75 03 FE CC CF|80 FC ?? 75 03 FE C4 CF)"
