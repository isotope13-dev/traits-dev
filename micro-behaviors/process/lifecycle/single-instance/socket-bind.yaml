defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.92
  mbc: B0024
  attack: T1480

traits:
  - id: mips-localhost-socket-single-instance
    desc: MIPS loopback socket single-instance guard
    arch: [mips]
    if:
      type: hex
      section: .text
      pattern: "00 01 02 3c 7f 00 42 34 [10-50] 09 f8 20 03 10 00 06 24 [4-30] 09 f8 20 03 01 00 05 24"
  # Same guard compiled for other IoT targets: store 127.0.0.1 and a port in a
  # sockaddr_in on the stack, then pass sizeof(sockaddr_in) to bind().
  - id: x86-localhost-socket-single-instance
    desc: x86 loopback socket single-instance guard
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: "C7 ?? ?? [0-1] 7F 00 00 01 [0-4] 66 C7 ?? [1-2] ?? ?? [0-12] 6A 10 [0-12] E8"
  - id: m68k-localhost-socket-single-instance
    desc: m68k loopback socket single-instance guard
    arch: [m68k]
    if:
      type: hex
      section: .text
      pattern: "2F 7C 7F 00 00 01 [2-4] 3F 7C ?? ?? [2-6] 48 78 00 10"
  # 32-bit ARM cannot load 0x0100007f in one immediate, so compilers emit
  # `mov rX, #0x01000000; add rX, rX, #0x7f` followed by sizeof(sockaddr_in)=16
  # into r2 before branching to bind().
  - id: arm-localhost-socket-single-instance
    desc: ARM loopback socket single-instance guard
    arch: [arm]
    if:
      type: hex
      section: .text
      pattern: "01 ?4 A0 E3 7F ?0 8? E2 [0-48] 10 20 A0 E3 [0-24] EB"
  - id: arc-localhost-socket-single-instance
    desc: ARC loopback socket single-instance guard
    if:
      type: hex
      section: .text
      pattern: "80 3F 00 01 7F 00 [0-12] 80 3F ?? ?? 02 00"
composite_rules:
  - id: localhost-socket-single-instance
    desc: Loopback socket single-instance guard
    crit: notable
    conf: 0.92
    any:
      - id: mips-localhost-socket-single-instance
      - id: x86-localhost-socket-single-instance
      - id: m68k-localhost-socket-single-instance
      - id: arm-localhost-socket-single-instance
      - id: arc-localhost-socket-single-instance
