defaults:
  platforms: [unix, windows]
  for: [jar]

composite_rules:
  - id: build-classload-delay
    for: [jar, class]
    desc: Build callback delays after class load
    crit: suspicious
    conf: 0.985
    all:
      - id: micro-behaviors/process/lifecycle/initialize::debug-model-class
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-class-forname-bytecode
      - id: micro-behaviors/process/thread/runtime::jvm-thread-class-reference
      - id: micro-behaviors/time/sleep/reference::jvm-sleep-name-text
