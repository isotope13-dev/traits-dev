defaults:
  platforms: [unix, windows]
  for: [jar]

composite_rules:
  - id: build-classload-delay
    for: [jar, class]
    desc: Build callback delays after class load
    crit: suspicious
    conf: 0.985
    all:
      - id: metadata/file/profile/jvm-constants::debug-model-class
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::java-class-forname-bytecode
      - id: metadata/file/profile/jvm-constants::thread-class
      - id: metadata/file/profile/jvm-constants::sleep-method
