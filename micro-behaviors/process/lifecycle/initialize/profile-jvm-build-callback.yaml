---
defaults:
  platforms:
  - unix
  - windows
  for:
  - jar
traits:
- id: debug-model-class
  desc: Debug model class path
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: tools/base/debug/model/DebugModel
- id: callback-helper-class
  desc: Build callback helper class
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: tools/base/debug/model/BuildSystemCallback
- id: static-init-trigger
  desc: Static init trigger label
  crit: notable
  conf: 0.97
  if:
    type: text
    substr: static-init
- id: build-debug-package-reference
  desc: Hardcoded callback package identifier
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: tools.base.build-system.debug:model
composite_rules:
- id: build-static-init-name-clues
  desc: Build class and static-init name clues
  crit: notable
  conf: 0.99
  all:
  - id: micro-behaviors/process/lifecycle/initialize::debug-model-class
  - id: micro-behaviors/process/lifecycle/initialize::callback-helper-class
  - id: metadata/lang/natural/vocabulary/action::report-word-text
  - id: micro-behaviors/process/lifecycle/initialize::static-init-trigger
