defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: vb6-shell-watchdog-name
    desc: VB6 shell capability with watchdog name
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/process/create/exec::vb6-shell-execution
      - id: watchdog-loader-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
