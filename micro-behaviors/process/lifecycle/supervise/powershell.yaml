defaults:
  for: [powershell]
  platforms: [windows]

composite_rules:
  - id: powershell-process-polling-loop
    desc: PowerShell loop, process query and delay
    crit: notable
    conf: 0.90
    # Co-occurrence, not a binding of a particular queried process to a launch.
    all:
      - id: micro-behaviors/process/enumerate/shell::powershell-get-process-query
      - id: micro-behaviors/data/control-flow/loop::infinite-loop-header
      - id: micro-behaviors/time/sleep/interval::ps-start-sleep
