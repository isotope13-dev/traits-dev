# Windows process supervision is a neutral availability capability.  The
# objective rule under persistence/system/restart requires it to coexist with
# a loader or payload-recovery technique before treating it as hostile.
defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust, python, powershell, batch]

traits:
  - id: supervisor-exit-query
    desc: Queries a process exit code
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bGetExitCodeProcess\s*\('

  - id: supervisor-active-state
    desc: Checks a process active state
    conf: 0.88
    if:
      type: text
      word: STILL_ACTIVE

  - id: watchdog-powershell-query
    desc: Polls a process with Get-Process
    conf: 0.88
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bGet-Process\b'

  - id: watchdog-process-filter
    desc: Filters a process-list result
    conf: 0.88
    for: [pe, dll, c, cpp, powershell, batch]
    if:
      type: text
      regex: '(?i)\btasklist(\.exe)?[^\r\n]{0,120}\b(find(\.exe)?|findstr(\.exe)?)\b'

  # Only the `timeout /t N` command form. The PowerShell half of this rule used
  # to match a bare `Start-Sleep -Seconds N` and describe it as a watchdog poll
  # interval, which made every Microsoft module that pauses look like part of a
  # supervision loop -- and duplicated
  # micro-behaviors/time/sleep/interval::ps-start-sleep. Consumers that want the
  # PowerShell spelling reference that canonical sleep trait instead.
  - id: timeout-command-delay
    desc: Delay using the timeout command
    conf: 0.88
    for: [pe, dll, c, cpp, batch]
    if:
      type: text
      regex: '(?i)\btimeout(\.exe)?\s+/t\s+[0-9]+\b'

  - id: watchdog-variable-delay
    desc: Delays watchdog polls using a variable interval
    conf: 0.9
    for: [pe, dll, c, cpp, powershell, batch]
    if:
      type: text
      regex: '(?i)\btimeout(\.exe)?\s+/t\s+%[A-Za-z_][A-Za-z0-9_]*%'

  # The drive letter needs a separator in front of it, as a real operand has
  # (`start "" C:\svc.exe`). Without one, any prose ending in a letter followed
  # by a colon and an escape matched: printf("...random start and end
  # positions:\n") read as `start ... s:\`.
  - id: watchdog-start-command
    desc: Starts a replacement process
    conf: 0.9
    for: [pe, dll, c, cpp, powershell, batch]
    if:
      type: text
      regex: '(?i)\bstart\b[^\r\n]{0,40}["''\s][A-Za-z]:\\'

  - id: watchdog-variable-start-command
    desc: Starts replacement from variable path
    conf: 0.9
    for: [pe, dll, c, cpp, powershell, batch]
    if:
      type: text
      regex: '(?i)\bstart\b[^\r\n]{0,40}%[A-Za-z_][A-Za-z0-9_]{1,63}%'

  - id: watchdog-loader-reference
    desc: References a loader executable
    conf: 0.88
    for: [pe, dll, c, cpp, powershell, batch]
    if:
      type: text
      regex: '(?i)\bloader\.exe\b'

composite_rules:
  - id: windows-process-exit-supervision
    desc: Process exit-state supervision
    conf: 0.93
    all:
      - id: supervisor-exit-query
      - id: supervisor-active-state
    # The handle-open half is the canonical OpenProcess atom under
    # process/create/spawn (symbol form for compiled code, text form for
    # scripts); supervision intent comes from the exit-code polling next to it,
    # not from the handle open, so this rule supplies the context rather than
    # keeping a second OpenProcess matcher of its own.
    any:
      - id: micro-behaviors/process/create/spawn::open-process
      - id: micro-behaviors/process/create/spawn::open-process-script
    needs: 1
    near_lines: 24

  - id: watchdog-process-query
    desc: Watchdog process query
    conf: 0.9
    any:
      - id: micro-behaviors/process/enumerate/shell::tasklist
      - id: watchdog-powershell-query

  - id: watchdog-relaunch-action
    desc: Watchdog relaunch action
    conf: 0.9
    any:
      - id: watchdog-start-command
      - id: watchdog-variable-start-command
      - id: watchdog-loader-reference

  - id: windows-process-watchdog-loop
    for: [pe, batch, c, powershell]
    desc: Process polling and relaunch loop
    conf: 0.94
    all:
      - id: watchdog-process-query
      - id: watchdog-process-filter
      - id: watchdog-relaunch-action
    any:
      - id: timeout-command-delay
      - id: watchdog-variable-delay
      - id: micro-behaviors/time/sleep/interval::ps-start-sleep
    near_lines: 24
