# Windows process supervision is a neutral availability capability.  The
# objective rule under persistence/system/restart requires it to coexist with
# a loader or payload-recovery technique before treating it as hostile.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust, python, powershell, batch]

traits:
  - id: supervisor-open-process
    desc: Opens a process for supervision
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bOpenProcess\s*\('

  - id: supervisor-exit-query
    desc: Queries a process exit code
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bGetExitCodeProcess\s*\('

  - id: supervisor-active-state
    desc: Checks a process active state
    crit: notable
    conf: 0.88
    if:
      type: text
      word: STILL_ACTIVE

  - id: watchdog-tasklist-query
    desc: Polls a process with tasklist
    crit: notable
    conf: 0.88
    for: [pe, dll, c, cpp, powershell, batch]
    if:
      type: text
      regex: '(?i)\btasklist(\.exe)?\b'

  - id: watchdog-powershell-query
    desc: Polls a process with Get-Process
    crit: notable
    conf: 0.88
    for: [powershell]
    if:
      type: text
      regex: '(?i)\bGet-Process\b'

  - id: watchdog-process-filter
    desc: Filters a process-list result
    crit: notable
    conf: 0.88
    for: [pe, dll, c, cpp, powershell, batch]
    if:
      type: text
      regex: '(?i)\btasklist(\.exe)?[^\r\n]{0,120}\b(find(\.exe)?|findstr(\.exe)?)\b'

  - id: watchdog-delay
    desc: Delays between watchdog polls
    crit: notable
    conf: 0.88
    for: [pe, dll, c, cpp, powershell, batch]
    if:
      type: text
      regex: '(?i)\btimeout(\.exe)?\s+/t\s+[0-9]+\b|\bStart-Sleep\s+(-Seconds|-s)\s+[0-9]+\b'

  - id: watchdog-start-command
    desc: Starts a replacement process
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, powershell, batch]
    if:
      type: text
      regex: '(?i)\bstart\b[^\r\n]{0,40}[A-Za-z]:\\'

  - id: watchdog-loader-reference
    desc: References a loader replacement
    crit: notable
    conf: 0.88
    for: [pe, dll, c, cpp, powershell, batch]
    if:
      type: text
      regex: '(?i)\bloader(\.exe)?\b'

composite_rules:
  - id: windows-process-exit-supervision
    desc: Process exit-state supervision
    crit: notable
    conf: 0.93
    all:
      - id: supervisor-open-process
      - id: supervisor-exit-query
      - id: supervisor-active-state
    near_lines: 24

  - id: watchdog-process-query
    desc: Watchdog process query
    crit: notable
    conf: 0.9
    any:
      - id: watchdog-tasklist-query
      - id: watchdog-powershell-query

  - id: watchdog-relaunch-action
    desc: Watchdog relaunch action
    crit: notable
    conf: 0.9
    any:
      - id: watchdog-start-command
      - id: watchdog-loader-reference

  - id: windows-process-watchdog-loop
    desc: Process polling and relaunch loop
    crit: notable
    conf: 0.94
    all:
      - id: watchdog-process-query
      - id: watchdog-process-filter
      - id: watchdog-delay
      - id: watchdog-relaunch-action
    near_lines: 24
