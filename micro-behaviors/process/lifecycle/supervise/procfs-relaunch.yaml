defaults:
  platforms: [linux]
  for: [elf, shell]
  crit: notable
traits:
  - id: failed-check-nohup-launch
    desc: Failed command check launches nohup
    if:
      type: text
      regex: '\|\|\s*nohup\b'
  - id: xargs-grep-process-check
    desc: Xargs invokes grep with option terminator
    if:
      type: text
      regex: '\|\s*xargs\s+(-r\s+)?grep\s+-[A-Za-z0-9]{1,12}\s+--'
composite_rules:
  - id: procfs-absent-process-relaunch
    desc: Procfs command-line check with fallback relaunch
    near_bytes: 180
    all:
      - id: micro-behaviors/fs/proc/cmdline::proc-cmdline-glob-or-variable-pid
      - id: xargs-grep-process-check
      - id: failed-check-nohup-launch
