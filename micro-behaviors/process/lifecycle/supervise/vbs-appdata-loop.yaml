defaults:
  platforms:
  - windows
  for:
  - vbs
composite_rules:
- id: vbs-appdata-run-survey-loop
  desc: VBS process survey, AppData Run, sleep loop
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/process/enumerate/wmi::win32-process-wql-enumeration
  - id: micro-behaviors/process/create/exec::wsh-run-roaming-microsoft-path
  - id: micro-behaviors/time/sleep/interval::wscript-sleep-loop
  any:
  - id: micro-behaviors/fs/path/application/executable::vbs-svchcst-exe-name
  - id: micro-behaviors/fs/path/application/executable::vbs-hash-shaped-exe-name
