defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: generated-shell-pid-file-check
    desc: Generated shell script checks PID file
    conf: 0.98
    if:
      type: literal
      regex: '(?s)^#!/bin/(ba|da|a)?sh\n.{0,180}test\s+-r\s+[^\n;]{1,100}\.pid'
  - id: pid-guard-local-shell-launch
    desc: PID guard precedes local shell launch
    conf: 0.98
    if:
      type: literal
      regex: '(?s)kill -(CHLD|0) \$\w+.{0,60}exit 0.{0,50}\n\./\S+ &>?/dev/null'
composite_rules:
  - id: generated-pid-watchdog-script
    desc: Generates a shell PID watchdog script
    conf: 0.98
    near_bytes: 300
    all:
      - id: generated-shell-pid-file-check
      - id: pid-guard-local-shell-launch
