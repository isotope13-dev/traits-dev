# A watchdog is a supervisor that restarts a process it finds stopped. It is
# a neutral availability mechanic: embedded firmware, service managers,
# container health checks, keep-alive helpers and IoT bots all ship one.
# Intent (a bot keeping itself alive while killing rivals) comes from the
# composites in objectives/impact/degrade/rival-bot/ that reference these.
defaults:
  platforms:
    - unix
    - android
    - ios
  for:
    - elf
    - shell
    - python
  attack: T1547

traits:
  - id: watchdog-monitor-process
    desc: References a watchdog process or service
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (?i)\bwatchdog([_ -](maintain|process|service|daemon))\b

  - id: watchdog-token
    desc: Watchdog process token
    crit: notable
    conf: 0.75
    for: [elf]
    if:
      type: text
      exact: watchdog
    unless:
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename

  - id: python-worker-restart-after-exit
    desc: Python restarts a worker after exit
    crit: notable
    conf: 0.9
    for: [python]
    attack: T1059.006
    if:
      type: text
      regex: '(?i)native worker[^\n]{0,40}exited; restarting'

composite_rules:
  - id: python-detached-worker-watchdog
    desc: Python supervises a detached worker
    crit: notable
    conf: 0.94
    for: [python]
    attack: T1059.006
    near_lines: 40
    all:
      - id: python-worker-restart-after-exit
      - id: micro-behaviors/process/create/subprocess::popen-ast
      - id: micro-behaviors/process/create/subprocess::subprocess-detached-session
