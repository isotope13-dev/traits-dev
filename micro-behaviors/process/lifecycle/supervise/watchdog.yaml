# A watchdog is a supervisor that restarts a process it finds stopped. It is
# a neutral availability mechanic: embedded firmware, service managers,
# container health checks, keep-alive helpers and IoT bots all ship one.
# Intent (a bot keeping itself alive while killing rivals) comes from the
# composites in objectives/impact/degrade/rival-bot/ that reference these.
defaults:
  platforms:
    - unix
    - android
    - ios
  for:
    - elf
    - shell
  attack: T1547

traits:
  - id: watchdog-monitor-process
    desc: References a watchdog process or service
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (?i)\bwatchdog([_ -](maintain|process|service|daemon))\b

  - id: watchdog-token
    desc: Watchdog process token
    crit: component
    conf: 0.75
    for: [elf]
    if:
      type: text
      exact: watchdog
    unless:
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
