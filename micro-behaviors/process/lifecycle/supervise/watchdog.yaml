defaults:
  crit: notable
  platforms:
  - unix
  - android
  - ios
  for:
  - elf
  - shell
  - python
traits:
- id: watchdog-monitor-process
  desc: Watchdog maintenance or supervisor name
  conf: 0.6
  if:
    type: text
    regex: (?i)\bwatchdog([_ -](maintain|process|service|daemon))\b
- id: python-worker-restart-after-exit
  desc: Python restarts a worker after exit
  conf: 0.9
  for:
  - python
  attack: T1059.006
  if:
    type: text
    regex: (?i)native worker[^\n]{0,40}exited; restarting
composite_rules:
- id: python-detached-worker-watchdog
  desc: Python supervises a detached worker
  conf: 0.94
  for:
  - python
  attack: T1059.006
  near_lines: 40
  all:
  - id: python-worker-restart-after-exit
  - id: micro-behaviors/process/create/subprocess::popen-ast
  - id: micro-behaviors/process/daemonize/detach::python-subprocess-new-session-option
