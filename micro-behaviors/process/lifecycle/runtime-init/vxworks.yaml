# VxWorks application bootstrap. `usrAppInit()` in usrAppInit.c is where
# Wind River's own project template tells every VxWorks application to start
# its tasks, so the name alone is an RTOS entry point, not a persistence
# implant. Relocated from objectives/persistence/system/init/boot, where it
# convicted at suspicious on wolfSSL's Workbench README.
defaults:
  platforms: [appliance, unix]
  for: [c, cpp, objc, elf]
  crit: notable
traits:
  - id: vxworks-usrappinit-hook
    desc: VxWorks usrAppInit entry point
    conf: 0.94
    if:
      type: text
      substr: usrAppInit
