# Android application-process bootstrap hooks.
#
# `attachBaseContext` is the ContextWrapper/Application override that runs
# before onCreate, i.e. the earliest point at which app code holds a Context.
# Relocated from micro-behaviors/process/create/loader (2026-08): the matcher
# only observes the override, which androidx MultiDexApplication, Hilt, and
# every Context-wrapping library also emit, so describing it as "Android loader
# hooks app context" asserted a staged-DEX loader the string does not
# establish. The loader and dropper composites still reference it from here and
# supply the BaseDexClassLoader-patching context themselves.
defaults:
  platforms: [android]
  for: [apk, zip, dex]
  crit: notable
  conf: 0.82

traits:
  - id: attach-base-context
    desc: Android attachBaseContext lifecycle override
    if:
      type: text
      substr: "attachBaseContext"
