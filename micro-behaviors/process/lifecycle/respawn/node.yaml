defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: node-interpreter-spawn-env-clone
  desc: Spawns Node interpreter with cloned environment
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: spawn\s*\(\s*process\.execPath[\s\S]{0,400}Object\.assign\(\s*\{\s*\}\s*,\s*process\.env
composite_rules:
- id: node-spawn-stage-clue-context
  desc: Node interpreter spawn with file-stage or remote-URL clue
  crit: suspicious
  conf: 0.94
  near_bytes: 8192
  all:
  - id: node-interpreter-spawn-env-clone
  any:
  - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
  - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
  - id: micro-behaviors/communications/url/external/github::github-release-download
  needs: 1
  unless:
  - id: metadata/package/testing/
  - id: metadata/build
  - id: metadata/build/recognized-contexts::benign-app-fp-context
  - id: metadata/path::test-directory-component
- id: node-self-daemon-cli-benign-context
  desc: Self-daemonizing Node CLI with local copy
  crit: exception
  conf: 0.97
  all:
  - id: micro-behaviors/process/create/exec::node-spawn-current-executable
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
  - id: micro-behaviors/fs/file/copy::js-copyfile-sync-call
- id: node-detached-script-self-relaunch-context
  desc: Node application schedules self-relaunch via detached helper script
  crit: exception
  conf: 0.95
  near_bytes: 4096
  all:
  - id: micro-behaviors/fs/write/file/full::node-write-file-promise-destructured
  - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
  - id: micro-behaviors/process/create/shell/script-host::cmd-exe-spawn
  - id: micro-behaviors/process/exit/terminate::node-explicit-success-exit
  any:
  - id: micro-behaviors/data/format/script::embedded-batch-script-header
  - id: micro-behaviors/fs/path/extension::batch-command-extension-literal
