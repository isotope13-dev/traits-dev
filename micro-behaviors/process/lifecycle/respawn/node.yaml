# The matcher sees Node spawning its interpreter and cloning process.env.
# It does not require the spawned argv to name this file, a new guard value,
# a guard check, or downloaded content reaching the child.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-interpreter-spawn-env-clone
    desc: Spawns Node interpreter with cloned environment
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'spawn\s*\(\s*process\.execPath[\s\S]{0,400}Object\.assign\(\s*\{\s*\}\s*,\s*process\.env'
composite_rules:
  - id: node-spawn-stage-clue-context
    desc: Node interpreter spawn with file-stage or remote-URL clue
    crit: suspicious
    conf: 0.94
    near_bytes: 8192
    all:
      - id: node-interpreter-spawn-env-clone
    any:
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
      - id: micro-behaviors/communications/url/external/github::github-release-download
    needs: 1
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/
      - id: metadata/build/recognized-contexts::benign-app-fp-context
  # Benign-context suppressor for self-daemonizing Node CLIs (EasyResearch,
  # opencode-style CLIs): the CLI copies its own executable beside itself
  # (Windows file-lock workaround), chmods the copy, spawns it detached with
  # unref, and polls its loopback /api/status endpoint until ready. The
  # "dropped executable" the dropper composites describe is the program
  # itself: nothing is downloaded. Each leg is individually notable; together
  # they are known-good. Referenced only from dropper-composite unless:
  # clauses, never from all:/any:/if:.
      - id: "metadata/file/naming::test-directory-component"
  - id: node-self-daemon-cli-benign-context
    desc: Self-daemonizing Node CLI with local copy
    crit: exception
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/spawn::process-execpath-spawn
      - id: micro-behaviors/process/create/spawn::detached-ignored-unref-spawn
      - id: micro-behaviors/fs/file/copy::js-copyfile-sync-call
