# The matcher sees Node spawning its interpreter and cloning process.env.
# It does not require the spawned argv to name this file, a new guard value,
# a guard check, or downloaded content reaching the child.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-interpreter-spawn-env-clone
    desc: Spawns Node interpreter with cloned environment
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'spawn\s*\(\s*process\.execPath[\s\S]{0,400}Object\.assign\(\s*\{\s*\}\s*,\s*process\.env'
composite_rules:
  - id: node-spawn-stage-clue-context
    desc: Node interpreter spawn with file-stage or remote-URL clue
    crit: suspicious
    conf: 0.94
    near_bytes: 8192
    all:
      - id: node-interpreter-spawn-env-clone
    any:
      - id: micro-behaviors/communications/http/download/handler::node-http-stream-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-make-executable
      - id: micro-behaviors/communications/url/external/github::github-release-download
    needs: 1
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/
      - id: metadata/build/recognized-contexts::benign-app-fp-context
