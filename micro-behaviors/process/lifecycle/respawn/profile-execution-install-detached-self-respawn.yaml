---
defaults:
  platforms:
  - windows
  - linux
  - macos
  - unix
  for:
  - python
  - javascript
  - typescript
  - shell
  - batch
  - powershell
  - ruby
  - php
composite_rules:
- id: install-named-detached-self-respawn-clues
  desc: Install- or beacon-named script has detached self-respawn clues
  crit: notable
  conf: 0.96
  scope: file
  for:
  - javascript
  - typescript
  all:
  - id: metadata/package/files/included::install-or-beacon-js-basename
  - id: micro-behaviors/process/lifecycle/respawn::node-self-respawn
  - id: micro-behaviors/process/daemonize/detach::detached-true
  - id: micro-behaviors/process/daemonize/detach::node-spawn-result-unref
