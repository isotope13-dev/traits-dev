---
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: process-argv-slice-self-reexec
  desc: Spawn text forwards current Node arguments
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: "\\bspawn\\s*\\(\\s*process\\.execPath,\\s*process\\.argv\\.slice\\(\\s*1\\s*\\)"
- id: node-self-respawn
  desc: Spawn text names current Node and script
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: spawn\s*\(\s*process\.execPath\s*,\s*\[\s*(__filename|process\.argv\s*\[\s*1\s*\])
