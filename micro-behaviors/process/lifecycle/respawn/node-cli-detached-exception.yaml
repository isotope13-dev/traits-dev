defaults:
  platforms: [unix, windows]
  for: [javascript]

composite_rules:
  - id: cli-daemon-self-relaunch-context
    desc: Node CLI self-relaunches with detached stdio
    crit: exception
    conf: 0.95
    # The host rule is archive-scoped, but its legs -- and this suppression --
    # are JavaScript facts read out of the package's own files.
    scope: leaf
    all:
      - id: micro-behaviors/process/interpreter/node::node-spawn-current-executable
      - id: micro-behaviors/process/lifecycle/respawn::process-argv-slice-self-reexec
      - id: micro-behaviors/process/daemonize/detach::detached-ignored-unref-spawn

