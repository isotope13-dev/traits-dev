defaults:
  platforms: [unix, windows]
composite_rules:
  - id: fabric-mod-self-relaunch
    for: [jar, zip, class]
    desc: Runnable Fabric mod with self-relaunch APIs
    crit: notable
    conf: 0.97
    scope: outer
    all:
      - id: metadata/package/config::fabric-runnable-mod-archive
    any:
      - id: micro-behaviors/process/lifecycle/respawn::java-self-jar-javaw-relaunch
      - id: micro-behaviors/process/lifecycle/respawn::java-obfuscated-self-jar-relaunch
      - id: micro-behaviors/process/lifecycle/respawn::java-encoded-command-self-jar-launch
      - id: micro-behaviors/process/lifecycle/respawn::java-obfuscated-process-launch-exit

