# PHP file-loading behavior: sibling includes are evaluated when the file is
# loaded. Intent-specific supply-chain composites add the surrounding context.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [php]
traits:
  - id: require-dir-php-sibling
    desc: require_once sibling helper file
    conf: 0.85
    if:
      type: text
      regex: 'require(_once)?\s*\(\s*__DIR__\s*\.\s*["''][^"'']{1,80}\.php'
  - id: php-file-check-before-variable-include
    desc: PHP file check precedes variable include
    conf: 0.9
    if:
      type: text
      regex: 'file_exists\s*\([^)]{1,80}\)[\s\S]{0,100}\binclude\s*\(?\s*\$'
  # Startup configuration also appears in WAF installers and profilers.
  # The directive alone establishes neither a write nor a webshell.
  - id: htaccess-auto-prepend-setting
    desc: Apache PHP auto-prepend directive text
    conf: 0.9
    for: [php, text]
    if:
      type: text
      regex: 'php_value\s+auto_prepend_file'
    unless:
      - id: well-known/tool/detection/pattern-catalog::php-scanner-signature-rule-table
