# PHP file-loading behavior: sibling includes are evaluated when the file is
# loaded. Intent-specific supply-chain composites add the surrounding context.
defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: require-dir-php-sibling
    desc: require_once sibling helper file
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'require(_once)?\s*\(\s*__DIR__\s*\.\s*["''][^"'']{1,80}\.php'
  # Same load-time evaluation, named target: a page that pulls in an `init.php`
  # bootstrap runs whatever that file defines before any of its own code.
  - id: php-include-init-script
    desc: PHP includes init.php bootstrap
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\binclude\s*\(?\s*[''"]init\.php[''"]'
  # A variable target is materially different from a fixed bootstrap path:
  # PHP parses and executes whichever file the caller supplies. This remains a
  # capability atom because plugin/autoload systems can use it legitimately;
  # supply-chain and webshell objectives add the request or masquerade context.
  - id: php-dynamic-require-variable
    desc: PHP dynamically requires a variable file path
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\brequire(_once)?\s*\(\s*\$[A-Za-z_][A-Za-z0-9_]*\s*\)'
  - id: php-file-check-before-variable-include
    desc: PHP file check precedes variable include
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'file_exists\s*\([^)]{1,80}\)[\s\S]{0,100}\binclude\s*\(?\s*\$'
