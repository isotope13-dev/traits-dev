defaults:
  platforms: [unix, windows]
  for: [c, cpp]

traits:
  - id: gcc-constructor-attr
    desc: GCC constructor runs before main
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: "__attribute__((constructor))"
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path

  # A DLL entry point that runs code in its DLL_PROCESS_ATTACH branch executes
  # that code the moment the module is loaded into any process (including one it
  # is injected into). The Windows load-time analog of a constructor. Benign
  # DLLs initialize here too, so this is a neutral capability -- the intent
  # comes from what the attach branch runs.
  - id: dllmain-process-attach-runs-code
    desc: DllMain runs code on process attach
    crit: notable
    conf: 0.85
    platforms: [windows]
    if:
      type: text
      regex: 'DLL_PROCESS_ATTACH\s*:\s*(return\s+)?[A-Za-z_]\w*\s*\('
