# Initializer tables are routine runtime capabilities, not malware verdicts.
defaults:
  platforms: [unix, windows]
  crit: baseline
  conf: 0.95
traits:
  - id: elf-native-initializer-table
    desc: ELF native initializer table
    for: [elf]
    if:
      type: section
      regex: '^\.(preinit_array|init_array|ctors)$'
  - id: pe-native-initializer-table
    desc: PE CRT initializer table
    for: [pe]
    if:
      type: section
      regex: '^\.CRT(\$XC[A-Z])?$'
