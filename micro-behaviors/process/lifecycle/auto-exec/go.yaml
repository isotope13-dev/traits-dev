defaults:
  for: [go]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: go-package-initializer
    desc: Defines Go package startup initialization
    if:
      type: value
      path: source.go.init_count
      regex: '^[1-9][0-9]*$'
  - id: go-package-global-initializer
    desc: Initializes Go package-level variables
    crit: baseline
    if:
      type: value
      path: source.go.global_initializer_count
      regex: '^[1-9][0-9]*$'
  - id: go-explicit-generator
    desc: Declares a command for explicit go generate
    if:
      type: value
      path: source.go.generate[*].argv[0]
      regex: '.+'
