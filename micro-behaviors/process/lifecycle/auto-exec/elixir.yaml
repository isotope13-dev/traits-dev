defaults:
  for: [elixir]
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.95

traits:
  - id: elixir-top-level-module-call
    desc: Elixir invokes module function at source root
    # Ordinary script entry calls (including a local main()) do not identify
    # a lifecycle hook or interesting callee behavior by themselves.
    crit: baseline
    # A line-anchored regex also matches calls inside ordinary function bodies.
    # Match a direct source child, retaining the original zero-argument scope.
    if:
      type: tree-sitter
      query: |
        ((source
          (call target: (dot left: (alias) right: (identifier))
            (arguments) @args) @call)
          (#match? @args "^\\(\\s*\\)$"))

  - id: elixir-module-load-callback
    desc: Declares Elixir module-load callback
    if:
      type: tree-sitter
      query: |
        ((unary_operator
          operator: "@"
          operand: (call target: (identifier) @attribute
            (arguments (atom) @callback)))
          (#eq? @attribute "on_load"))
