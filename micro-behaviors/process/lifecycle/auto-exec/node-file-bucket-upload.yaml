defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
- id: node-obfuscated-export-awaiter-invocation
  desc: Invokes an obfuscated export/awaiter call shape
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "exports\\[.{1,80}\\]\\)\\(\\)\\[.{1,40}\\]\\(_0x[0-9a-f]+=>__awaiter"
