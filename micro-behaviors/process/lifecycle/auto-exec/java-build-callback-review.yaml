defaults:
  platforms: [unix, windows]
  for: [jar]

composite_rules:
  - id: auto-loaded-annotation-processor
    for: [jar, class]
    desc: Auto-loaded build annotation processor
    crit: suspicious
    conf: 0.995
    all:
      - id: metadata/package/files/included::java-annotation-processor-service-descriptor
      - id: micro-behaviors/process/interpreter/runtime/jvm::processor-implementation
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-annotation-processor-api
      - id: micro-behaviors/process/interpreter/runtime/jvm::annotation-processor-trigger
