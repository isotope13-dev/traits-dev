defaults:
  platforms: [windows, unix]
  for: [php]

composite_rules:
  - id: php-curl-write-include-chain
    desc: PHP HTTP write near variable include
    crit: suspicious
    conf: 0.9
    near_bytes: 320
    all:
      - id: micro-behaviors/communications/http/download/curl::php-curl-variable-file-write
      - id: micro-behaviors/process/lifecycle/auto-exec::php-file-check-before-variable-include
