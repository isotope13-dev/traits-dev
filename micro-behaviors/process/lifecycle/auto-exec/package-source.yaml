# Source-level automatic execution surfaces used by package and build systems.
# Each atom is neutral on its own: build plugins and runtime modules often need
# initialization.  Supply-chain objectives add a secret gate and staging,
# process, or network behavior.
defaults:
  platforms: [linux, macos, windows]
  crit: component
  conf: 0.94

traits:
  - id: objc-class-load-method
    desc: Objective-C class executes when loaded
    for: [objectivec]
    if:
      type: text
      regex: '(?m)^\s*[+]\s*\(\s*void\s*\)\s*load\b'

  - id: swift-top-level-bootstrap-call
    desc: Swift source invokes bootstrap at top level
    for: [swift]
    if:
      type: text
      regex: '(?m)^\s*[A-Za-z_][A-Za-z0-9_]{2,}\s*\(\s*\)\s*$'

  - id: zig-package-build-function
    desc: Zig package defines automatic build function
    for: [zig]
    if:
      type: text
      regex: '\bpub\s+fn\s+build\s*\(.{0,80}[*]std[.]Build\b'

  - id: perl-makefile-loads-package-module
    desc: Perl Makefile loads package module
    for: [perl]
    if:
      type: text
      regex: '(?m)^\s*(use|require)\s+[A-Z][A-Za-z0-9_:]{2,}\s*;'

  - id: powershell-root-module-top-level-code
    desc: PowerShell module has gated code
    for: [powershell]
    if:
      type: text
      regex: '(?s)GetEnvironmentVariable\s*\(.{0,300}\b(return|exit)\b'

  - id: groovy-script-top-level-environment-branch
    desc: Groovy runs top-level environment branch
    for: [groovy]
    if:
      type: text
      regex: '(?m)^\s*if\s*\(\s*System[.]getenv\s*\('

  - id: scala-app-object-initializer
    desc: Scala App object executes during initialization
    for: [scala]
    if:
      type: text
      regex: '\bobject\s+[A-Za-z_][A-Za-z0-9_]*\s+extends\s+App\b'

  - id: kotlin-object-init-block
    desc: Kotlin object executes initialization block
    for: [kotlin]
    if:
      type: text
      regex: '\bobject\s+[A-Za-z_][A-Za-z0-9_]*\s*\{\s*init\s*\{'

  - id: java-static-initializer
    desc: Java class executes static initialization block
    for: [java]
    if:
      type: text
      regex: '\bstatic\s*\{'

  - id: jvm-static-class-initializer
    desc: JVM bytecode defines automatic class initializer
    for: [class, java_class]
    if:
      type: symbol
      kind: function
      exact: <clinit>

  - id: lua-rockspec-build-command
    desc: LuaRocks recipe executes build source
    for: [lua]
    if:
      type: text
      regex: '\bbuild_command\s*=\s*[''"]lua\s+.{1,80}[.]lua[''"]'

  - id: lua-module-top-level-environment-branch
    desc: Lua runs top-level environment branch
    for: [lua]
    if:
      type: text
      regex: '(?m)^\s*(local\s+.{1,80};\s*)?if\s+os[.]getenv\s*\('

  - id: perl-package-top-level-environment-branch
    desc: Perl package runs environment branch
    for: [perl]
    if:
      type: text
      regex: '(?s)\bpackage\s+[A-Z][A-Za-z0-9_:]+\s*;.{0,500}\bif\s*\(\s*\(?\s*\$ENV\s*\{'

  - id: gradle-plugin-service-descriptor
    desc: Gradle plugin implementation service descriptor
    for: [text]
    if:
      type: text
      regex: '(?m)^implementation-class=[A-Za-z_$][\w.$]{2,}$'

  - id: distro-postinstall-script-path
    desc: Distribution package post-install script
    for: [shell]
    if:
      type: path
      regex: '(^|[/\\])postinst$'
