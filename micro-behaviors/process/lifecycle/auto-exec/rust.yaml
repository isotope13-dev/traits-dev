# Rust load-time initializer surfaces.
#
# These are neutral capabilities: native libraries may use them for legitimate
# one-time registration, while supply-chain composites can add intent when the
# initializer is paired with an automatic payload or telemetry action.
defaults:
  platforms: [unix, windows]
  for: [rust]

traits:
  - id: rust-elf-init-array
    desc: Rust registers ELF load-time initializer
    crit: notable
    conf: 0.95
    if:
      type: value
      path: source.rust.initializers
      exact: elf-init-array
  - id: rust-ctor-initializer
    desc: Rust constructor runs at native initialization
    crit: notable
    conf: 0.95
    if:
      type: value
      path: source.rust.initializers
      exact: ctor
  - id: rust-macho-initializer
    desc: Rust registers a Mach-O load-time initializer
    crit: notable
    conf: 0.95
    if:
      type: value
      path: source.rust.initializers
      exact: macho-mod-init-func
  - id: rust-pe-initializer
    desc: Rust registers a PE CRT initializer
    crit: notable
    conf: 0.95
    if:
      type: value
      path: source.rust.initializers
      exact: pe-crt-initializer
