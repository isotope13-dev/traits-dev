# A helper name plus nearby operations does not establish hostile provenance.
defaults:
  platforms: [unix, windows]
  for: [php]
composite_rules:
  - id: php-read-helper-file-load-cooccurrence
    desc: Read helper and variable file-load co-occur
    crit: notable
    conf: 0.94
    near_bytes: 400
    all:
      - id: metadata/lang/source/declaration::php-read-named-function
      - id: micro-behaviors/fs/read/file/full::file-get-contents
      - id: micro-behaviors/process/interpreter/eval/source::php-variable-file-load
