defaults:
  for: [macho, elf]
  platforms: [macos, linux]
  arch: [x86-64]
  crit: notable
  conf: 0.97
traits:
  - id: x64-shared-source-stdio-triplet
    desc: Shared source descriptor targets stdio triplet
    if:
      type: hex
      # Explicit whole-file range avoids a preferred-slice section map.
      # The architecture restriction still clamps universal Mach-O bytes.
      offset_range: [0, null]
      # SysV arguments: unchanged r15d -> edi, esi = 0/1/2.
      # Each call's return value is checked before the next descriptor.
      pattern: '44 89 FF 31 F6 E8 [4] 83 F8 FF 0F 84 [4] 44 89 FF BE 01 00 00 00 E8 [4] 83 F8 FF 0F 84 [4] 44 89 FF BE 02 00 00 00 E8'
