defaults:
  platforms: [windows]
traits:
  - id: nt-duplicate-object
    desc: NtDuplicateObject API import
    crit: notable
    conf: 0.95
    for: [pe, dll]
    if:
      type: symbol
      exact: "NtDuplicateObject"
    unless:
      # Wine/ReactOS ntdll implements and exports NtDuplicateObject — it provides
      # the API rather than abusing it, so suppress rather than merely downgrade.
      - id: metadata/binary/vendor/
      - id: well-known/tool/sysadmin/chroot-win/
      - id: well-known/tool/sysadmin/sandboxie::sandboxie-known-signed-context
      - id: well-known/app/utility/locale-emulator::locale-emulator-native-context
    downgrade:
      any:
        - id: well-known/tool/sysadmin/systeminformer::systeminformer-product
        - id: well-known/tool/sysadmin/sysinternals/
