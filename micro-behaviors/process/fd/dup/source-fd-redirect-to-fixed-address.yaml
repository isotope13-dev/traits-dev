defaults:
  platforms:
  - unix
  for:
  - c
  - cpp

composite_rules:
  - id: source-fd-redirect-to-fixed-address
    desc: Stdio redirection with a fixed remote endpoint
    crit: notable
    conf: 0.95
    near_lines: 40
    all:
      - id: micro-behaviors/process/fd/dup::source-socket-fd-redirect
      - id: micro-behaviors/communications/ip/literal::external-ipv4-c-source-literal
      - id: micro-behaviors/communications/socket/port::c-source-hardcoded-port
    unless:
      - id: micro-behaviors/os/container/oci/
      - id: micro-behaviors/communications/socket/vsock/
