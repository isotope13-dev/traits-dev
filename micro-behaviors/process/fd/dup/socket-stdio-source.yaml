defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: notable
  conf: 0.95
traits:
  - id: source-socket-to-stdin
    desc: Socket descriptor is duplicated onto stdin
    if:
      type: symbol
      kind: call
      exact: dup2
      args:
        - index: 0
          from:
            call: '^(socket|accept|accept4)$'
        - index: 1
          kind: number
          value: 0
  - id: source-socket-to-stdout
    desc: Socket descriptor is duplicated onto stdout
    if:
      type: symbol
      kind: call
      exact: dup2
      args:
        - index: 0
          from:
            call: '^(socket|accept|accept4)$'
        - index: 1
          kind: number
          value: 1
  - id: source-socket-to-stderr
    desc: Socket descriptor is duplicated onto stderr
    if:
      type: symbol
      kind: call
      exact: dup2
      args:
        - index: 0
          from:
            call: '^(socket|accept|accept4)$'
        - index: 1
          kind: number
          value: 2
  - id: source-socket-to-named-standard-stream
    desc: Socket descriptor targets a named stdio fd
    if:
      type: symbol
      kind: call
      exact: dup2
      args:
        - index: 0
          from:
            call: '^(socket|accept|accept4)$'
        - index: 1
          kind: identifier
          name_regex: '^STD(IN|OUT|ERR)_FILENO$'
composite_rules:
  - id: source-socket-stdio-redirect
    desc: Socket descriptor is redirected onto stdio
    any:
      - id: source-socket-to-stdin
      - id: source-socket-to-stdout
      - id: source-socket-to-stderr
      - id: source-socket-to-named-standard-stream
