defaults:
  platforms: [unix, windows]
  for: [text]
traits:
- id: diff-native-dup2-call
  desc: Added patch line references dup2
  crit: notable
  conf: 0.9
  if:
    type: text
    # An added patch line, as the name says; a bare `dup2(` is in every
    # strace log and stdio-redirection snippet.
    regex: '(?m)^\+[^+\n][^\n]{0,118}\bdup2\s*\('
