defaults:
  platforms: [linux, macos]
  for: [python]
traits:
  - id: python-null-device-dup2
    desc: Duplicates Unix null-device descriptor
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: os.dup2
      arg:
        index: 0
        from:
          call: '^os\.open$'
          argument: 0
          literal: '^/dev/null$'
