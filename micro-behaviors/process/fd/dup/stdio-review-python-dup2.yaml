defaults:
  platforms:
    - linux
    - windows
    - macos
  for:
    - python
    - pyc
traits:
  - id: py-stdio-dup2
    desc: Python duplicates descriptor to stdio
    crit: notable
    conf: 0.8
    if:
      type: raw
      regex: os\.dup2\s*\(\s*[A-Za-z_]\w*(\.fileno\s*\(\s*\))?\s*,\s*[012]\s*\)
