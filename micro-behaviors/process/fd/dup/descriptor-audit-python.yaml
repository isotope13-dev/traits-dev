# Descriptor audit: neutral observations and explicit shell relay mechanisms.
defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: inline-python-socket-dup2
  desc: Socket connect and descriptor duplication syntax
  # Serialized Python remains visible even when a later pickle opcode fails.
  for: [python, pickle]
  conf: 0.95
  size_max: 50000
  if:
    type: text
    regex: socket\.socket[\s\S]{0,600}\.connect\s*\([\s\S]{0,600}os\.dup2\s*\(.{0,120}\.fileno\(\)
composite_rules:
- id: python-dup2-io-redirect
  desc: Socket and descriptor duplication references nearby
  conf: 0.9
  near_lines: 80
  all:
  - id: micro-behaviors/process/fd/dup::python-dup2
  - id: micro-behaviors/process/fd/query::python-fileno
  - id: micro-behaviors/communications/socket/connect/attempt::socket-connect-method
