# Descriptor audit: neutral observations and explicit shell relay mechanisms.
defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: inline-python-socket-dup2
  desc: Connects a socket and duplicates its descriptor
  conf: 0.95
  unless:
  - id: well-known/lib/ai/unsloth::unsloth-package-context
  - id: well-known/tool/detection/agent-glovebox::archive-context
  - id: well-known/tool/offensive/
  size_max: 50000
  if:
    type: text
    regex: socket\.socket[\s\S]{0,600}\.connect\s*\([\s\S]{0,600}os\.dup2\s*\(.{0,120}\.fileno\(\)
composite_rules:
- id: python-dup2-io-redirect
  desc: Socket connection with descriptor duplication
  conf: 0.9
  near_lines: 80
  unless:
  - id: well-known/tool/offensive/
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/harness/
  - id: metadata/import/python/unittest
  - id: metadata/import/python/test
  - id: "metadata/file/naming::test-directory-component"
  all:
  - id: micro-behaviors/process/fd/dup::python-dup2
  - id: micro-behaviors/process/fd/query::python-fileno
  - id: micro-behaviors/communications/socket/connect::socket-connect-method
