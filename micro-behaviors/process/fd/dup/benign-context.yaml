defaults:
  for: [elf, so]
  platforms: [linux, macos]
traits:
- id: posix-fd-redirect-shell-cond-0--inline-9702
  desc: Sulogin path in socket shell workflows
  crit: notable
  conf: 0.85
  size_max: 20000000
  if:
    type: path
    basename: true
    exact: sulogin
  count_max: 1009703
composite_rules:
- id: posix-fd-redirect-shell-benign-context
  desc: Benign socket shell helper context
  crit: exception
  conf: 0.94
  any:
  - id: posix-fd-redirect-shell-cond-0--inline-9702
  - id: micro-behaviors/ui/help/
  - id: micro-behaviors/communications/ssh/client/
  - id: well-known/dual-use/tunnel/shadowsocks-rust::shadowsocks-service-crate
  - id: well-known/tool/reverse-engineering/rizin::rz-test-usage
  - id: well-known/tool/development/tree-sitter::tree-sitter-cli-binary
- id: unix-dual-mode-socket-exec-benign-context
  desc: Recognized benign socket forwarding context
  crit: exception
  conf: 0.94
  any:
  - id: well-known/app/communication/exim::exim-mail-transfer-agent
  - id: micro-behaviors/ui/help/
  - id: micro-behaviors/communications/ssh/client/
  # NOTE: `micro-behaviors/dylib/library/family/` was removed as an exoneration
  # leg here. It matches a mere *reference* to a ubiquitous library (zlib,
  # libcurl, libuv, coreutils, gcc/llvm, X11/DRI…), which almost every ELF —
  # including real reverse shells — carries, so it silently suppressed genuine
  # socket+dup2+shell implants. The narrow `unless: lzma-ref` carve-out that
  # used to sit below was a post-xz patch for one symptom of the same flaw. A
  # shared object that legitimately exports these socket/exec symbols for its
  # host is already exonerated by `shared-object-type` on the parent rule;
  # sanitizer runtimes keep their own explicit leg below.
  - id: well-known/tool/reverse-engineering/rizin::rz-test-usage
  - id: well-known/tool/sysadmin/network::knc-utility
  - id: posix-fd-redirect-shell-cond-0--inline-9702
  - id: well-known/app/system/mit-krb5-appl::kerberos-ftp-daemon
  # Sanitizer runtimes (libtsan/libasan/liblsan/libubsan) export hundreds of
  # __interceptor_* stubs covering connect/listen/accept/bind/dup2/execve by
  # design; every gcc/clang install and dev container ships them.
  - id: well-known/lib/development/sanitizer-runtime::sanitizer-runtime-library
  unless:
  - id: metadata/file/extension/identity::linux-kernel-module-basename
- id: unix-terminal-socket-exec-benign-context
  desc: Terminal socket exec helper context
  crit: exception
  conf: 0.95
  for: [elf, so, gz, tar, zip, archives]
  any:
  - id: micro-behaviors/ui/help/
  - id: micro-behaviors/communications/ssh/client/
  - id: well-known/tool/reverse-engineering/rizin::rz-test-usage
  # `micro-behaviors/dylib/library/family/` removed — see note above; a bare
  # reference to a common library must not exonerate a socket command bridge.
  - id: posix-fd-redirect-shell-cond-0--inline-9702
  - id: well-known/lib/format/conda-package::tk-libtcl-shared-library
  - id: well-known/lib/development/sanitizer-runtime::sanitizer-runtime-library
  - id: well-known/tool/development/flow-bin::flow-native-binary
  - id: well-known/tool/sysadmin/busybox::busybox-banner
  unless:
  - id: metadata/file/extension/identity::linux-kernel-module-basename
