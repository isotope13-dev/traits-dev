defaults:
  for: [ruby]
  platforms: [unix]
traits:
  - id: ruby-socket-syscall-stdio-dup
    desc: Duplicates socket over standard descriptors
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((_ (assignment left: (identifier) @socket
               right: (call receiver: (constant) @socket_class method: (identifier) @create))
            (call receiver: (identifier) @connected method: (identifier) @connect
              arguments: (argument_list (call receiver: (constant) @address_class method: (identifier) @address)))
            (call receiver: (array (integer) @zero (integer) @one (integer) @two)
              method: (identifier) @each
              block: (block parameters: (block_parameters (identifier) @fd)
                body: (block_body (call method: (identifier) @syscall
                  arguments: (argument_list (integer) @number
                    (call receiver: (identifier) @dup_socket method: (identifier) @fileno)
                    (identifier) @dest))))))
          (#eq? @socket_class "Socket") (#eq? @create "new")
          (#eq? @connected @socket) (#eq? @connect "connect")
          (#eq? @address_class "Socket") (#eq? @address "sockaddr_in")
          (#eq? @zero "0") (#eq? @one "1") (#eq? @two "2")
          (#eq? @each "each") (#eq? @syscall "syscall")
          (#match? @number "^(33|63)$") (#eq? @dup_socket @socket)
          (#eq? @fileno "fileno") (#eq? @fd @dest))
