traits:
- crit: notable
  id: dup2-stdin-target-syscall
  desc: Redirects stdin via dup2/dup3 syscall
  conf: 0.85
  platforms:
  - linux
  for:
  - elf
  if:
    type: syscall
    name:
    - dup2
    - dup3
    args:
    - index: 1
      value: 0
- crit: notable
  id: dup2-stdout-target-syscall
  desc: Redirects stdout via dup2/dup3 syscall
  conf: 0.85
  platforms:
  - linux
  for:
  - elf
  if:
    type: syscall
    name:
    - dup2
    - dup3
    args:
    - index: 1
      value: 1
- crit: notable
  id: dup2-stderr-target-syscall
  desc: Redirects stderr via dup2/dup3 syscall
  conf: 0.85
  platforms:
  - linux
  for:
  - elf
  if:
    type: syscall
    name:
    - dup2
    - dup3
    args:
    - index: 1
      value: 2
- crit: notable
  id: x86-64-syscall-dup2
  desc: Direct x86-64 dup2 syscall
  conf: 0.9
  platforms:
  - linux
  for:
  - elf
  if:
    type: hex
    section: text
    pattern: B8 21 00 00 00 0F 05
  arch:
  - x86-64
- crit: notable
  id: x86-64-syscall-dup2-sectionless
  desc: Direct x86-64 dup2 syscall in sectionless code
  conf: 0.9
  platforms:
  - linux
  for:
  - elf
  if:
    type: hex
    offset_range:
    - 64
    - 262144
    pattern: b8 21 00 00 00 [0-24] 0f 05
  unless:
  - type: metrics
    field: sections.count
    min: 1
  arch:
  - x86-64
- crit: notable
  id: syscall-dup-redirect-macos
  desc: macOS dup2 syscall for fd redirection
  conf: 0.8
  platforms:
  - macos
  for:
  - macho
  count_min: 2
  if:
    type: syscall
    name:
    - dup2
