defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
traits:
  - id: remote-close-handle
    desc: Remote-close-handle identifier reference
    crit: notable
    conf: 0.85
    attack: "T1562"
    if:
      type: text
      regex: "[Rr]emote[Cc]lose[Hh]andle"
  - id: duplicate-close-source-flag
    desc: References the DUPLICATE_CLOSE_SOURCE flag
    crit: notable
    conf: 0.95
    if:
      type: text
      word: DUPLICATE_CLOSE_SOURCE
