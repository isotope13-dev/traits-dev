# File Descriptor Range Closure - Unix
# Broad descriptor closure is used for daemonization and process isolation.
defaults:
  crit: notable
  conf: 0.7
  for: [elf, c]
  platforms: [unix]
traits:
  - id: close-range
    desc: Close file descriptor ranges
    if:
      type: symbol
      exact: "close_range"
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: closefrom
    desc: Close all descriptors from limit
    if:
      type: symbol
      exact: "closefrom"
