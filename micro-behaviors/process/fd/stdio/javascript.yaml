defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  # `readline.createInterface` is how a Node program reads lines from a stream,
  # and interactive CLIs, setup wizards, REPLs and line-oriented protocol servers
  # all reach for it. Both of these lived in
  # objectives/command-and-control/backdoor/proxy/mcp/ at `notable`, which taught
  # the model that every prompt-driven CLI looked like an MCP relay backdoor --
  # stdio is the standard MCP transport, so ordinary servers matched too. The
  # composites there still consume them, paired with the JSON-RPC envelope and an
  # outbound HTTP post, which is where the relay intent actually comes from
  # (relocated 2026-09).
  - id: node-tty-interactive-check
    desc: Checks stdio for an interactive terminal
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: 'process\.(stdin|stdout)\.isTTY'

composite_rules: []
