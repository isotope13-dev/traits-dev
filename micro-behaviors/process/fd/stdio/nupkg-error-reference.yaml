defaults:
  platforms: [windows, unix]
traits:
  - id: dotnet-stderr-redirection-reference
    desc: .NET child stderr configuration references
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(set_RedirectStandardError|RedirectStandardError\s*=\s*true)'
    for:
      - pe
      - csharp
