defaults:
  platforms: [windows, unix]
  for: [java, class, kotlin]
  crit: notable

traits:
  - id: java-processbuilder-redirect-input
    desc: Java ProcessBuilder redirects standard input
    conf: 0.92
    if:
      type: import
      exact: java/lang/ProcessBuilder.redirectInput
  - id: java-processbuilder-redirect-output
    desc: Java ProcessBuilder redirects standard output
    conf: 0.92
    if:
      type: import
      exact: java/lang/ProcessBuilder.redirectOutput
  - id: java-processbuilder-redirect-errors
    desc: Java ProcessBuilder merges standard error
    conf: 0.92
    if:
      type: import
      exact: java/lang/ProcessBuilder.redirectErrorStream
  - id: java-processbuilder-redirect-error
    desc: Java ProcessBuilder redirects standard error
    conf: 0.96
    for: [class]
    if:
      type: import
      exact: java/lang/ProcessBuilder.redirectError
  - id: jvm-processbuilder-discard-reference
    desc: JVM references the child-stream discard target
    conf: 0.98
    for: [class]
    if:
      type: import
      exact: java/lang/ProcessBuilder$Redirect.DISCARD

composite_rules:
  - id: java-processbuilder-redirected-stdio
    desc: Java child input/output and merged error options
    conf: 0.96
    all:
      - id: java-processbuilder-redirect-input
      - id: java-processbuilder-redirect-output
      - id: java-processbuilder-redirect-errors
