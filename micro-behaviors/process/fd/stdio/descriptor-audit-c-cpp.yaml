# Descriptor audit: neutral observations and explicit shell relay mechanisms.
defaults:
  platforms:
  - unix
composite_rules:
- id: source-socket-fd-redirect
  desc: Socket connection with stdio redirection
  for:
  - c
  - cpp
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/communications/socket/connect::connect
  - id: micro-behaviors/process/fd/dup::source-dup2-stdio
  near_lines: 50
  unless:
  - id: micro-behaviors/process/fd/stdio::recognized-source-fd-redirect-context
  - id: micro-behaviors/os/container/oci/
  - id: micro-behaviors/communications/socket/vsock/
- id: recognized-source-fd-redirect-context
  desc: Recognized source descriptor-redirection context
  for:
  - c
  - cpp
  - elf
  - so
  crit: exception
  conf: 0.99
  any:
  - id: well-known/tool/sysadmin/busybox::source-tree-path
  - id: well-known/lib/crypto/mit-krb5::source-tree-context
  - id: well-known/tool/development/runtime/qemu::source-tree-path
  - id: micro-behaviors/communications/ssh/connect::libssh-proxycommand-source
  - id: micro-behaviors/process/create/shell/command-string::posix-tunnel-shell-spawn-source
- id: source-fd-redirect-to-fixed-address
  desc: Stdio redirection with a fixed remote endpoint
  for:
  - c
  - cpp
  crit: notable
  conf: 0.95
  near_lines: 40
  all:
  - id: micro-behaviors/process/fd/stdio::source-socket-fd-redirect
  - id: micro-behaviors/communications/ip/literal::external-ipv4-c-source-literal
  - id: micro-behaviors/communications/socket/port::c-source-hardcoded-port
  unless:
  - id: micro-behaviors/os/container/oci/
  - id: micro-behaviors/communications/socket/vsock/
  - id: well-known/tool/detection/
