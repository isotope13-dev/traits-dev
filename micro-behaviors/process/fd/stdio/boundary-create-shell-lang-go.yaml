defaults:
  platforms:
    - linux
    - macos
    - windows
  for: [go, elf, macho, pe]
  crit: notable
  conf: 0.7
traits:
  - id: stdin-pipe
    desc: Go StdinPipe child input
    conf: 0.5
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)StdinPipe$'
composite_rules:
  - id: stdio-or-pipe-redirection
    desc: Configures Go child-process standard I/O or pipe handling
    any:
      - id: micro-behaviors/process/fd/stdio::stdin-pipe
      - id: micro-behaviors/process/fd/stdio::go-stdout-pipe
      - id: micro-behaviors/process/fd/stdio::go-stderr-pipe
      - id: micro-behaviors/process/fd/stdio::go-stdio-field-assignment
