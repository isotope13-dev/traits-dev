defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
  conf: 0.96

traits:
  - id: python-http-body-to-child-stdin
    desc: HTTP response bytes fed to Python stdin
    if:
      type: tree-sitter
      query: |
        ((block
          (expression_statement (assignment
            left: (identifier) @response
            right: (call function: (attribute
              object: (identifier) @client attribute: (identifier) @get))))
          (expression_statement (assignment
            left: (identifier) @payload
            right: (call function: (attribute
              object: (attribute object: (identifier) @body_response
                attribute: (identifier) @body)
              attribute: (identifier) @encode))))
          (if_statement consequence: (block
            (expression_statement (assignment
              left: (identifier) @child
              right: (call function: (attribute
                object: (identifier) @subprocess attribute: (identifier) @popen)
                arguments: (argument_list (list
                  (attribute object: (identifier) @sys attribute: (identifier) @executable)
                  (string (string_content) @dash))))))
            (expression_statement (call function: (attribute
              object: (attribute object: (identifier) @sink_child
                attribute: (identifier) @stdin)
              attribute: (identifier) @write)
              arguments: (argument_list (identifier) @written))))))
          (#eq? @client "requests")
          (#eq? @get "get")
          (#eq? @response @body_response)
          (#eq? @body "text")
          (#eq? @encode "encode")
          (#eq? @subprocess "subprocess")
          (#eq? @popen "Popen")
          (#eq? @sys "sys")
          (#eq? @executable "executable")
          (#eq? @dash "-")
          (#eq? @child @sink_child)
          (#eq? @stdin "stdin")
          (#eq? @write "write")
          (#eq? @payload @written))
