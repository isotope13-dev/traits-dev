defaults:
  platforms: [unix, windows]
composite_rules:
- id: socket-connect-stdio-duplication
  desc: Python socket connect with stdio duplication
  crit: notable
  near_bytes: 4096
  conf: 0.9
  for:
  - python
  - pyc
  all:
  - id: micro-behaviors/process/fd/dup::py-stdio-dup2
  any:
  - id: metadata/file/profile/socket-api::socket-connect-call
  - id: micro-behaviors/communications/socket/connect/attempt::socket-connect-method
