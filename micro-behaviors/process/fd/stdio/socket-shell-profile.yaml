defaults:
  for: [c, cpp]
  platforms: [unix]

composite_rules:
  - id: socket-shell-stdio-api-profile
    desc: Socket, stdio-redirect and shell API references
    crit: notable
    conf: 0.98
    near_lines: 50
    all:
    - id: micro-behaviors/communications/socket/connect::connect
    - id: micro-behaviors/process/fd/dup::source-dup2-stdio
    any:
    - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
    - id: micro-behaviors/process/create/shell/spawn::system-fn
