defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
- id: python-subprocess-stdio-suppression
  desc: Python subprocess suppresses stdout or stderr
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: 'subprocess\.(run|Popen|call)\([\s\S]{0,700}\b(stdout|stderr)\s*=\s*subprocess\.DEVNULL'
  unless:
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
