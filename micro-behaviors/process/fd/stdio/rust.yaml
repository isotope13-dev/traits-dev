# Rust standard-I/O wiring primitives.
defaults:
  platforms: [linux, macos]
  for: [rust]

traits:
  - id: rust-stdio-from-raw-fd
    desc: Rust Stdio builds from raw fd
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Stdio::from_raw_fd\s*\('

  - id: rust-child-stdout-null
    desc: Rust child stdout is discarded
    crit: component
    conf: 0.94
    platforms: [windows, unix]
    if:
      type: text
      regex: '\.stdout\s*\(\s*Stdio::null\s*\(\s*\)\s*\)'

  - id: rust-child-stderr-null
    desc: Rust child stderr is discarded
    crit: component
    conf: 0.94
    platforms: [windows, unix]
    if:
      type: text
      regex: '\.stderr\s*\(\s*Stdio::null\s*\(\s*\)\s*\)'

composite_rules:
  - id: rust-child-output-discarded
    desc: Rust child stdout and stderr discarded
    crit: notable
    conf: 0.96
    near_bytes: 1200
    all:
      - id: micro-behaviors/process/create/direct::rust-spawn
      - id: rust-child-stdout-null
      - id: rust-child-stderr-null
