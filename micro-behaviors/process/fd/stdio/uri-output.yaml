defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: js-shell-output-uri-encoding
    desc: URI-encodes a bound shell-command result
    crit: notable
    conf: 0.98
    # Value provenance, not tree shape: the encoded value comes from execSync,
    # through any binding, `.toString()` or `.trim()`. The former tree-sitter
    # query walked every statement block for 5 s per minified bundle.
    if:
      type: symbol
      kind: call
      exact: encodeURIComponent
      arg:
        index: 0
        from:
          call: '(^|\.)execSync$'
          through:
            - call: '(^|\.)execSync\.toString$'
              receiver: true
            - call: '(^|\.)execSync(\.toString)?\.trim$'
              receiver: true
