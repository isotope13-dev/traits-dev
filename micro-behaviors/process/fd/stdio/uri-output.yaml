defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: js-shell-output-uri-encoding
    desc: URI-encodes a bound shell-command result
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (variable_declaration
            (variable_declarator name: (identifier) @bound value: (_) @command))
          (expression_statement
            (call_expression
              arguments: (arguments
                (binary_expression
                  right: (call_expression
                    function: (identifier) @encoder
                    arguments: (arguments (identifier) @used)))))))
          (#eq? @bound @used)
          (#eq? @encoder "encodeURIComponent")
          (#match? @command "\\.execSync\\("))
