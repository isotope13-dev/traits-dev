traits:
- crit: notable
  conf: 0.9
  id: stdin-read-or-reference
  desc: Reads or references standard input
  if:
    type: text
    regex: (?i)(json\.loads?\s*\(\s*\w*stdin|stdin(\.buffer)?\.read\s*\(|process\.stdin\b)
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - python
  - shell
