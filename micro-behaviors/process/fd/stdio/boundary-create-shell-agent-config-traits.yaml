defaults:
  platforms: [windows, unix]
  for: [json]
  crit: notable
  conf: 0.92

traits:
  - id: shell-command-output-redirect
    desc: Agent shell command redirects output
    crit: notable
    conf: 0.93
    if:
      type: value
      path: agents.*.adapter.config.args[1]
      regex: '>>?\s*[A-Za-z0-9._/$~\-]{1,120}(\s|$)'

