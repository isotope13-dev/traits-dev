# Keyword names alone do not establish subprocess stdio redirection.
defaults:
  platforms:
  - linux
  - windows
  - macos
  for:
  - python
  - pyc
traits:
- id: py-stdin-argument
  desc: Python stdin keyword argument
  crit: component
  conf: 0.6
  if:
    type: text
    regex: stdin\s*=
- id: py-stdout-argument
  desc: Python stdout keyword argument
  crit: component
  conf: 0.4
  if:
    type: text
    regex: stdout\s*=
- id: py-stderr-argument
  desc: Python stderr keyword argument
  crit: component
  conf: 0.4
  if:
    type: text
    regex: stderr\s*=
- id: py-stderr-stdout
  desc: stderr=STDOUT pipe argument (Python)
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: stderr\s*=\s*(subprocess\.)?STDOUT\b
- id: py-stdio-dup2
  desc: Python duplicates descriptor to stdio
  crit: notable
  conf: 0.8
  if:
    type: raw
    regex: os\.dup2\s*\(\s*[A-Za-z_]\w*(\.fileno\s*\(\s*\))?\s*,\s*[012]\s*\)
- id: pipe-constant
  desc: PIPE constant reference
  crit: component
  conf: 0.4
  for:
  - python
  if:
    type: text
    regex: \.PIPE\b
- id: dot-pipe
  desc: .pipe( method call
  crit: component
  conf: 0.4
  for:
  - python
  if:
    type: text
    substr: .pipe(
- id: python-custom-stdio
  desc: Subprocess call supplies custom stdio streams
  crit: notable
  conf: 0.96
  for: [python]
  # Keep the kwargs on the same call. A nearby subprocess invocation plus
  # dict(stdin=..., stdout=...) does not configure that child's descriptors.
  if:
    type: tree-sitter
    query: |
      (
        (call
          function: [(attribute) (identifier)] @callee
          arguments: (argument_list
            (keyword_argument name: (identifier) @stream1 value: (identifier) @value1)
            (keyword_argument name: (identifier) @stream2 value: (identifier) @value2))) @stdio
        (#match? @callee "^(subprocess\\s*\\.\\s*(Popen|run|call)|Popen)$")
        (#match? @stream1 "^(stdin|stdout|stderr)$")
        (#match? @stream2 "^(stdin|stdout|stderr)$")
        (#not-eq? @stream1 @stream2)
        (#not-match? @value1 "^(PIPE|STDOUT|DEVNULL)$")
        (#not-match? @value2 "^(PIPE|STDOUT|DEVNULL)$")
      )
composite_rules:
- id: python-stdio-keyword-arguments
  desc: Python standard-stream keyword arguments
  crit: component
  conf: 0.6
  any:
  - id: micro-behaviors/process/fd/stdio::py-stdin-argument
  - id: micro-behaviors/process/fd/stdio::py-stdout-argument
  - id: micro-behaviors/process/fd/stdio::py-stderr-argument
- id: pipe-methods
  desc: Pipe method or constant
  crit: component
  conf: 0.5
  any:
  - id: dot-pipe
  - id: pipe-constant
