# Keyword names alone do not establish subprocess stdio redirection.
defaults:
  platforms:
  - linux
  - windows
  - macos
  for:
  - python
  - pyc
traits:
- id: py-stdin-argument
  desc: Python stdin keyword argument
  crit: component
  conf: 0.6
  if:
    type: text
    regex: stdin\s*=
- id: py-stdout-argument
  desc: Python stdout keyword argument
  crit: component
  conf: 0.4
  if:
    type: text
    regex: stdout\s*=
- id: py-stderr-argument
  desc: Python stderr keyword argument
  crit: component
  conf: 0.4
  if:
    type: text
    regex: stderr\s*=
- id: py-stderr-stdout
  desc: stderr=STDOUT pipe argument (Python)
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: stderr\s*=\s*(subprocess\.)?STDOUT\b
- id: py-stdin-custom-stream
  desc: Custom stream supplied to Python stdin keyword
  crit: component
  conf: 0.75
  if:
    type: text
    regex: stdin\s*=\s*[A-Za-z_]\w*($|[^.\w])
    # PIPE, STDOUT and DEVNULL are the stock subprocess constants, not a
    # caller-supplied stream such as a socket or file object.
    not:
      - regex: '=\s*(subprocess\.)?(PIPE|STDOUT|DEVNULL)\b'
- id: py-stdout-custom-stream
  desc: Custom stream supplied to Python stdout keyword
  crit: component
  conf: 0.75
  if:
    type: text
    regex: stdout\s*=\s*[A-Za-z_]\w*($|[^.\w])
    # PIPE, STDOUT and DEVNULL are the stock subprocess constants, not a
    # caller-supplied stream such as a socket or file object.
    not:
      - regex: '=\s*(subprocess\.)?(PIPE|STDOUT|DEVNULL)\b'
- id: py-stderr-custom-stream
  desc: Custom stream supplied to Python stderr keyword
  crit: component
  conf: 0.75
  if:
    type: text
    regex: stderr\s*=\s*[A-Za-z_]\w*($|[^.\w])
    # PIPE, STDOUT and DEVNULL are the stock subprocess constants, not a
    # caller-supplied stream such as a socket or file object.
    not:
      - regex: '=\s*(subprocess\.)?(PIPE|STDOUT|DEVNULL)\b'
- id: py-stdio-dup2
  desc: Python duplicates descriptor to stdio
  crit: notable
  conf: 0.8
  if:
    type: raw
    regex: os\.dup2\s*\(\s*[A-Za-z_]\w*(\.fileno\s*\(\s*\))?\s*,\s*[012]\s*\)
- id: pipe-constant
  desc: PIPE constant reference
  crit: component
  conf: 0.4
  for:
  - python
  if:
    type: text
    regex: \.PIPE\b
- id: dot-pipe
  desc: .pipe( method call
  crit: component
  conf: 0.4
  for:
  - python
  if:
    type: text
    substr: .pipe(
composite_rules:
- id: python-stdio-keyword-arguments
  desc: Python standard-stream keyword arguments
  crit: component
  conf: 0.6
  any:
  - id: micro-behaviors/process/fd/stdio::py-stdin-argument
  - id: micro-behaviors/process/fd/stdio::py-stdout-argument
  - id: micro-behaviors/process/fd/stdio::py-stderr-argument
- id: pipe-methods
  desc: Pipe method or constant
  crit: component
  conf: 0.5
  any:
  - id: dot-pipe
  - id: pipe-constant
- id: python-custom-stdio
  desc: Python subprocess custom stdio streams
  crit: notable
  conf: 0.8
  for: [python]
  needs: 2
  # Generic stdout/stderr names also occur in Docker SDK options and ordinary
  # local assignments. Require a nearby Popen call to establish subprocess IO.
  all:
  - id: micro-behaviors/process/create/subprocess::popen-ast
  any:
  - id: py-stdin-custom-stream
  - id: py-stdout-custom-stream
  - id: py-stderr-custom-stream
  near_bytes: 700
