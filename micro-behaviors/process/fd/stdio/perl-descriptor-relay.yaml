# Canonical descriptor observations and socket-shell relays.
defaults:
  for:
  - perl
  - static-lib
  - text
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: stdin-socket-redir
  desc: Duplicates a handle onto standard input
  conf: 0.96
  if:
    type: text
    regex: open\s*\(\s*STDIN\s*,\s*"?>&[A-Z_]
- id: stdout-socket-redir
  desc: Duplicates a handle onto standard output
  conf: 0.96
  if:
    type: text
    regex: open\s*\(\s*STDOUT\s*,\s*"?>&[A-Z_]
- id: stderr-socket-redir
  desc: Duplicates a handle onto standard error
  conf: 0.96
  if:
    type: text
    regex: open\s*\(\s*STDERR\s*,\s*"?>&[A-Z_]
composite_rules:
- id: stdio-socket-redirect
  desc: Duplicates handles onto standard streams
  conf: 0.98
  all:
  - id: micro-behaviors/process/fd/stdio::stdin-socket-redir
  - id: micro-behaviors/process/fd/stdio::stdout-socket-redir
  - id: micro-behaviors/process/fd/stdio::stderr-socket-redir
