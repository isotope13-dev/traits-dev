defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: python-dup2-stdio-loop
    desc: Python loop duplicates descriptor onto stdio
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (for_statement
          left: (identifier) @fd
          right: [
            (tuple (integer) @zero (integer) @one (integer) @two)
            (list (integer) @zero (integer) @one (integer) @two)
          ]
          body: (block
            (expression_statement
              (call
                function: (attribute
                  object: (identifier) @module
                  attribute: (identifier) @method)
                arguments: (argument_list
                  (_)
                  (identifier) @destination)) @duplication))
          (#eq? @zero "0")
          (#eq? @one "1")
          (#eq? @two "2")
          (#eq? @module "os")
          (#eq? @method "dup2")
          (#eq? @fd @destination))
