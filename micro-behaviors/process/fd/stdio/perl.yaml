# Perl standard-stream descriptor operations are a neutral capability.  A
# socket target requires separate connection evidence before it is a shell.
defaults:
  for: [perl]
  platforms: [linux, macos, windows]

traits:
  - id: standard-stream-fd-reopen
    desc: Perl standard stream descriptor reopen
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bopen\s*\(\s*STD(IN|OUT|ERR)\s*,\s*["'']>&'
