# Neutral source and operation observations.
traits:
- id: shell-function-discards-output
  desc: Shell function contains discarded stdout
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?ms)\w{1,20}\(\)\s*\{[^}]{0,50}(echo|printf|cat)[^}]{0,50}[^}0-9&]> ?/dev/null[^}]{0,9}\}
  platforms:
  - unix
  for:
  - shell
