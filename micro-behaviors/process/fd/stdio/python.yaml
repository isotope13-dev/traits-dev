# Python standard-stream name references (`sys.stdout`, `print(..., file=sys.stderr)`).
#
# Relocated from micro-behaviors/process/create/subprocess: the matchers see
# only the stream names, which describe stdio use whether or not a child
# process exists. The subprocess result-field roll-up there references these
# cross-directory.
defaults:
  crit: notable
  conf: 0.84
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-stdout-stream-name
    desc: Python references the stdout stream
    if:
      type: text
      word: stdout
  - id: python-stderr-stream-name
    desc: Python references the stderr stream
    if:
      type: text
      word: stderr
