# Python standard-stream name references (`sys.stdout`, `print(..., file=sys.stderr)`).
#
# Relocated from micro-behaviors/process/create/subprocess: the matchers see
# only the stream names, which describe stdio use whether or not a child
# process exists. The subprocess result-field roll-up there references these
# cross-directory.
defaults:
  crit: notable
  conf: 0.84
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-stdout-stream-name
    desc: Python references the stdout stream
    if:
      type: text
      word: stdout
  - id: python-stderr-stream-name
    desc: Python references the stderr stream
    if:
      type: text
      word: stderr
  - id: python-stdio-stream-replacement
    desc: Python replaces a standard I/O stream
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'sys\.(stdout|stderr)\s*=\s*\w+'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
