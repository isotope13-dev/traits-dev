defaults:
  platforms: [windows, unix]
traits:
  - id: dotnet-stdin-redirection-reference
    desc: .NET child stdin configuration references
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(set_RedirectStandardInput|RedirectStandardInput\s*=\s*true)'
    for:
      - pe
      - csharp
