# Direct or locally assigned data transfer, including encode/decode adapters.
# Separate facts do not establish peer/child identity across callbacks.
defaults:
  for:
  - python
  platforms:
  - unix
  - windows
traits:
- id: python-received-data-to-stdin
  desc: Writes received data to standard input
  crit: notable
  conf: 0.95
  if:
    type: tree-sitter
    query: |
      ((call function: (attribute object: (attribute object: (identifier) @child attribute: (identifier) @stream) attribute: (identifier) @write) arguments: (argument_list (call function: (attribute object: (identifier) @peer attribute: (identifier) @read) arguments: (argument_list)))) @transfer
      (#eq? @read "recv")
      (#eq? @stream "stdin")
      (#eq? @write "write")
      )

      ((_
      (expression_statement (assignment left: (identifier) @buffer right: (call function: (attribute object: (identifier) @peer attribute: (identifier) @read) arguments: (argument_list))))
      (expression_statement (call function: (attribute object: (attribute object: (identifier) @child attribute: (identifier) @stream) attribute: (identifier) @write) arguments: (argument_list (identifier) @used)))
      ) @transfer
      (#eq? @read "recv")
      (#eq? @stream "stdin")
      (#eq? @write "write")
      (#eq? @buffer @used)
      )

      ((_
      (expression_statement (assignment left: (identifier) @buffer right: (call function: (attribute object: (identifier) @peer attribute: (identifier) @read) arguments: (argument_list))))
      (expression_statement (call function: (attribute object: (attribute object: (identifier) @child attribute: (identifier) @stream) attribute: (identifier) @write) arguments: (argument_list (call function: (attribute object: (identifier) @used attribute: (identifier) @consumer_codec) arguments: (argument_list)))))
      ) @transfer
      (#eq? @read "recv")
      (#eq? @stream "stdin")
      (#eq? @write "write")
      (#eq? @buffer @used)
      (#eq? @consumer_codec "decode")
      )

      ((call function: (attribute object: (attribute object: (identifier) @child attribute: (identifier) @stream) attribute: (identifier) @write) arguments: (argument_list (call function: (attribute object: (call function: (attribute object: (identifier) @peer attribute: (identifier) @read) arguments: (argument_list)) attribute: (identifier) @producer_codec) arguments: (argument_list)))) @transfer
      (#eq? @read "recv")
      (#eq? @stream "stdin")
      (#eq? @write "write")
      (#eq? @producer_codec "decode")
      )

      ((_
      (expression_statement (assignment left: (identifier) @buffer right: (call function: (attribute object: (call function: (attribute object: (identifier) @peer attribute: (identifier) @read) arguments: (argument_list)) attribute: (identifier) @producer_codec) arguments: (argument_list))))
      (expression_statement (call function: (attribute object: (attribute object: (identifier) @child attribute: (identifier) @stream) attribute: (identifier) @write) arguments: (argument_list (identifier) @used)))
      ) @transfer
      (#eq? @read "recv")
      (#eq? @stream "stdin")
      (#eq? @write "write")
      (#eq? @producer_codec "decode")
      (#eq? @buffer @used)
      )

      ((_
      (expression_statement (assignment left: (identifier) @buffer right: (call function: (attribute object: (call function: (attribute object: (identifier) @peer attribute: (identifier) @read) arguments: (argument_list)) attribute: (identifier) @producer_codec) arguments: (argument_list))))
      (expression_statement (call function: (attribute object: (attribute object: (identifier) @child attribute: (identifier) @stream) attribute: (identifier) @write) arguments: (argument_list (call function: (attribute object: (identifier) @used attribute: (identifier) @consumer_codec) arguments: (argument_list)))))
      ) @transfer
      (#eq? @read "recv")
      (#eq? @stream "stdin")
      (#eq? @write "write")
      (#eq? @producer_codec "decode")
      (#eq? @buffer @used)
      (#eq? @consumer_codec "decode")
      )
