defaults:
  for: [ruby]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: ruby-stdin-reopen
    desc: Reopens standard input onto another stream
    if:
      type: text
      regex: '(\$stdin|STDIN)\.reopen\s*\(\s*[A-Za-z_]\w*\s*\)'
  - id: ruby-stdout-reopen
    desc: Reopens standard output onto another stream
    if:
      type: text
      regex: '(\$stdout|STDOUT)\.reopen\s*\(\s*[A-Za-z_]\w*\s*\)'
