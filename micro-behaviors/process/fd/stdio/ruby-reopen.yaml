defaults:
  for: [ruby]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: ruby-stdin-reopen
    desc: Reopens standard input onto another stream
    if:
      type: tree-sitter
      query: |
        ((call receiver: (_) @stream method: (identifier) @method
          arguments: (argument_list (identifier))) @call
          (#match? @stream "^(STDIN|\\$stdin)$")
          (#eq? @method "reopen"))
  - id: ruby-output-stream-reopen
    desc: Reopens stdout or stderr onto another stream
    if:
      type: tree-sitter
      query: |
        ((call receiver: (_) @stream method: (identifier) @method
          arguments: (argument_list (identifier))) @call
          (#match? @stream "^(STDOUT|STDERR|\\$std(out|err))$")
          (#eq? @method "reopen"))
