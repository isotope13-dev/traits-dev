defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  attack: T1059.006
traits:
- id: python-subprocess-near-devnull-stdio-assignment
  desc: Subprocess text near DEVNULL stdio assignment
  crit: notable
  conf: 0.94
  mbc: C0017
  if:
    type: text
    regex: subprocess\.(run|Popen|call)\([\s\S]{0,700}\b(stdout|stderr)\s*=\s*subprocess\.DEVNULL
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: python-subprocess-near-devnull-text
  desc: Subprocess call near DEVNULL text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (\w+\.)?(subprocess\.)?(Popen|run)\([\s\S]{0,520}DEVNULL
