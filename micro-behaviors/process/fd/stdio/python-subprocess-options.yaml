defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  attack: T1059.006
traits:
- id: python-subprocess-stdio-options
  desc: Subprocess sets stdout or stderr options
  crit: notable
  conf: 0.9
  mbc: C0017
  if:
    type: tree-sitter
    kind: call
    regex: (?s)\bsubprocess\.(run|Popen|call)\s*\([^)]{0,700}\b(stdout|stderr)\s*=
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: well-known/tool/offensive/ctf-skills::source-context
- id: python-subprocess-near-devnull-stdio-assignment
  desc: Subprocess call near DEVNULL stdio assignment
  crit: notable
  conf: 0.94
  mbc: C0017
  if:
    type: text
    regex: subprocess\.(run|Popen|call)\([\s\S]{0,700}\b(stdout|stderr)\s*=\s*subprocess\.DEVNULL
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: python-subprocess-near-devnull-text
  desc: Subprocess call near DEVNULL text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: subprocess\.(Popen|run)\([\s\S]{0,520}DEVNULL
