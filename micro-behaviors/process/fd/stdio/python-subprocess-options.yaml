defaults:
  platforms:
  - windows
  - unix
  for:
  - python
traits:
- id: python-subprocess-near-devnull-stdio-assignment
  desc: Subprocess text near DEVNULL stdio assignment
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: subprocess\.\w+\([\s\S]{0,700}\bstd(out|err)\s*=\s*subprocess\.DEVNULL
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: python-subprocess-near-devnull-text
  desc: Subprocess call near DEVNULL text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (\w+\.)?(subprocess\.)?(Popen|run)\([\s\S]{0,520}DEVNULL
