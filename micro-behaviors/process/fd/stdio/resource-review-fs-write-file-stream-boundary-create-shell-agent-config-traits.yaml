defaults:
  platforms: [windows, unix]
  for: [json]
  crit: notable
  conf: 0.92

traits:
  - id: shell-command-temp-output
    desc: Agent shell command writes to /tmp
    crit: notable
    conf: 0.93
    if:
      type: value
      path: agents.*.adapter.config.args[1]
      regex: '>>?\s*/tmp/[A-Za-z0-9._-]{1,80}(\s|$)'

  # These text forms cover embedded JSON request bodies as well as standalone
  # configuration data. The MCP composite below adds stdio context before
  # interpreting the generic command and argument fields.
