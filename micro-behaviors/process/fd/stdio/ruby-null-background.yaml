defaults:
  platforms: [unix]
  for: [ruby]
traits:
  - id: ruby-system-null-stdio-background
    desc: Background command discards standard streams
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: system
      arg:
        index: 0
        kind: string
        regex: '\s+</dev/null\s+>/dev/null\s+2>&1\s+&\s*$'
