defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: python-stdin-fileno-argument
    desc: Supplies a descriptor as child stdin
    if:
      type: text
      regex: 'stdin\s*=\s*[A-Za-z_]\w*\.fileno\s*\(\s*\)'
  - id: python-stdout-fileno-argument
    desc: Supplies a descriptor as child stdout
    if:
      type: text
      regex: 'stdout\s*=\s*[A-Za-z_]\w*\.fileno\s*\(\s*\)'
