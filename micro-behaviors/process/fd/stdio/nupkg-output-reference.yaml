defaults:
  platforms: [windows, unix]
traits:
  - id: dotnet-stdout-redirection-reference
    desc: .NET child stdout configuration references
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(RedirectStandardOutput\s*=\s*true|set_RedirectStandardOutput|StandardOutput\.ReadToEnd)'
    for:
      - pe
      - csharp
    unless:
      - id: well-known/game/mod::bedrockboot-source-repository
