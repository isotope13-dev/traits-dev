# Shell standard-stream redirection capabilities. Discarding output is
# routine in cron jobs and installers; composites add the delivery or
# credential context that makes it worth surfacing.
defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.85

traits:
  - id: shell-stderr-devnull-redirect
    desc: Shell discards stderr to /dev/null
    if:
      type: text
      regex: '2>\s*/dev/null'
  - id: shell-failure-suppress-or-true
    desc: Shell suppresses failure with || true
    if:
      type: text
      regex: '\|\|\s*true\b'
