# Shell standard-stream redirection capabilities. Discarding output is
# routine in cron jobs and installers; composites add the delivery or
# credential context that makes it worth surfacing.
defaults:
  platforms: [unix, windows]
  for: [shell, package.json]
  crit: notable
  conf: 0.85

traits:
  - id: shell-stderr-devnull-redirect
    desc: Shell stderr discard command text
    if:
      type: text
      regex: '2>\s*/dev/null'
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
