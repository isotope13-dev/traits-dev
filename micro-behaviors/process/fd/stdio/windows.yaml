defaults:
  crit: notable
  conf: 0.90
  platforms: [windows]
  for: [c, cpp, html, text]

traits:
  - id: pe-startupinfo-same-handle-stdio
    desc: PE stdio fields share one StartupInfo value
    crit: notable
    conf: 0.97
    for: [pe]
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: "C7 05 ?? ?? ?? ?? 44 00 00 00 C7 05 ?? ?? ?? ?? 01 01 00 00 A3 ?? ?? ?? ?? A3 ?? ?? ?? ?? A3 ?? ?? ?? ??"

  - id: pe-startupinfo-same-handle-stdio-x64
    desc: x64 PE stdio fields share one handle
    crit: notable
    conf: 0.97
    for: [pe]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: "(C7 44 24 ?? | C7 45 ??) 68 00 00 00 (C7 44 24 ?? | C7 45 ??) 01 01 00 00 48 89 5D ?? 48 89 5D ?? 48 89 5D ??"

  - id: startupinfo-stdhandles-flag
    desc: Process startup specifies explicit stdio handles
    conf: 0.92
    if:
      type: text
      word: STARTF_USESTDHANDLES

  - id: startupinfo-std-output-handle
    desc: Process startup info references hStdOutput
    conf: 0.90
    if:
      type: text
      word: hStdOutput

  - id: startupinfo-std-input-handle
    desc: Process startup info references hStdInput
    conf: 0.90
    if:
      type: text
      word: hStdInput

  - id: startupinfo-std-error-handle
    desc: Process startup info references hStdError
    conf: 0.90
    if:
      type: text
      word: hStdError

composite_rules:
  - id: startupinfo-socket-stdio-redirection
    desc: Process startup info redirects stdio to socket
    conf: 0.96
    near_bytes: 400
    all:
      - id: startupinfo-stdhandles-flag
      - id: startupinfo-std-output-handle
      - id: startupinfo-std-input-handle
      - id: startupinfo-std-error-handle
