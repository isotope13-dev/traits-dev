# Resolved descriptors distinguish console output from generic file writes.
# Keep this visible in version diffs, including statically linked programs.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.95

traits:
  - id: stdout-write-syscall
    desc: Writes standard output via direct syscall
    if:
      type: syscall
      name: [write, writev]
      args:
        - index: 0
          value: 1

  - id: stderr-write-syscall
    desc: Writes standard error via direct syscall
    if:
      type: syscall
      name: [write, writev]
      args:
        - index: 0
          value: 2
