defaults:
  for: [ruby]
  platforms: [unix, windows]

traits:
  # Process.spawn / Kernel#spawn option hash that maps all three standard
  # streams of the child onto a freshly opened TCP socket.
  - id: ruby-spawn-stdio-to-tcp-socket
    desc: Maps child stdio onto a TCP socket
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\[:in,\s*:out,\s*:err\]\s*=>\s*TCPSocket\.(new|open)\('
