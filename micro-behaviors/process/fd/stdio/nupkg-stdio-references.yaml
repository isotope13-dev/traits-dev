defaults:
  platforms: [windows, unix]
composite_rules:
  - id: dotnet-child-stdio-config-references
    desc: .NET child-stdio configuration references
    crit: notable
    conf: 0.88
    for:
      - pe
    all:
      - id: metadata/binary/symbols/name/process::dotnet-processstartinfo-name
      - id: micro-behaviors/process/fd/stdio::dotnet-stdout-redirection-reference
    any:
      - id: micro-behaviors/process/fd/stdio::dotnet-stdin-redirection-reference
      - id: micro-behaviors/process/fd/stdio::dotnet-stderr-redirection-reference
      - id: micro-behaviors/process/create/subprocess/reference::dotnet-process-start-text
