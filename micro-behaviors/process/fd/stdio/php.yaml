defaults:
  platforms: [linux, macos, windows]
  for: [php]
  crit: notable
  conf: 0.92
traits:
  - id: php-shell-stdio-fd-redirection
    desc: PHP shell redirects stdin and stdout
    if:
      type: text
      regex: '<&[0-9]+\s+>&[0-9]+'

  - id: php-socket-proc-open-descriptors
    desc: PHP socket binds process stdin/stdout
    if:
      type: tree-sitter
      query: |
        ((_
          (expression_statement (assignment_expression
            left: (variable_name) @socket
            right: (function_call_expression function: (name) @connect)))
          (expression_statement (assignment_expression
            left: (variable_name) @descriptors
            right: (array_creation_expression
              (array_element_initializer (integer) @input_fd (variable_name) @input)
              (array_element_initializer (integer) @output_fd (variable_name) @output))))
          (expression_statement (assignment_expression
            right: (function_call_expression
              function: (name) @spawn
              arguments: (arguments
                (argument)
                (argument (variable_name) @spawn_descriptors)))))) @binding
          (#match? @connect "(?i)^fsockopen$")
          (#match? @spawn "(?i)^proc_open$")
          (#eq? @input_fd "0")
          (#eq? @output_fd "1")
          (#eq? @socket @input)
          (#eq? @socket @output)
          (#eq? @descriptors @spawn_descriptors))
