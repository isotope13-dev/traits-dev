# macOS primitives commonly used to carry a spawned process's stdio.
defaults:
  platforms: [macos]
  for: [macho, objc, swift]
  crit: notable
  mbc: C0001

traits:
  - id: nspipe-class-reference
    desc: References macOS NSPipe child I/O
    conf: 0.85
    if:
      type: symbol
      regex: '(^|_)OBJC_CLASS_\$_NSPipe$'
