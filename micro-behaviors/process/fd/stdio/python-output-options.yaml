defaults:
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: python-subprocess-output-options
  desc: subprocess call with stdout/stderr keyword
  crit: notable
  conf: 0.9
  if:
    type: tree-sitter
    query: "(\n(call\n function: (attribute object: (identifier) @owner attribute:\
      \ (identifier) @method)\n arguments: (argument_list (keyword_argument name:\
      \ (identifier) @option)))\n(#eq? @owner \"subprocess\")\n(#match? @method \"\
      ^(run|Popen|call)$\")\n(#match? @option \"^(stdout|stderr)$\")\n)"
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: well-known/tool/offensive/ctf-skills::source-context
