defaults:
  platforms: [unix, windows]
  for: [python]

traits:
- id: python-subprocess-output-options
  desc: Python subprocess configures output streams
  crit: notable
  conf: 0.9
  if:
    # Match the call node, so a nearby docstring or later unrelated use of
    # stdout/stderr cannot satisfy this rule by proximity alone.
    type: tree-sitter
    kind: call
    regex: '(?s)\bsubprocess\.(run|Popen|call)\s*\([^)]{0,700}\b(stdout|stderr)\s*='
  unless:
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
    - id: well-known/tool/offensive/ctf-skills::source-context
