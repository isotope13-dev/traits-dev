# Embedded command text is observable even when its output is discarded.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.9

traits:
  - id: binary-devnull-output-redirect
    desc: Binary contains null-device output redirect
    if:
      type: text
      regex: '(^|[;& \t])([12&]?>{1,2}|&>>)[ \t]*["'']?/dev/null(["'']|$|[ \t;&|])'
