# Descriptor audit: neutral observations and explicit shell relay mechanisms.
defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: python-socket-fileno-common
  desc: Extracts a descriptor from a named handle
  conf: 0.7
  if:
    type: text
    regex: \b(sock|socket|conn|client)\.fileno\(\)
- id: python-socket-fileno-short
  desc: Extracts a descriptor from a short-named handle
  conf: 0.65
  if:
    type: text
    regex: \b(s|c)\.fileno\(\)
composite_rules:
- id: python-fileno
  desc: Extracts a descriptor with fileno
  conf: 0.7
  any:
  - id: micro-behaviors/process/fd/query::python-socket-fileno-common
  - id: micro-behaviors/process/fd/query::python-socket-fileno-short
