defaults:
  platforms: [windows]
  for:
  - pe
  - dll
  - c
  - cpp
  crit: notable
  conf: 0.75
traits:
- id: is-file-object
  desc: File-object classification identifier reference
  if:
    type: text
    regex: "[Ii]s[Ff]ile[Oo]bj"
- id: is-disk-file
  desc: Disk-file classification identifier reference
  if:
    type: text
    regex: "[Ii]s[Dd]isk[Ff]ile"
- id: get-file-path-from-handle
  desc: File-path-from-handle identifier reference
  if:
    type: text
    regex: "[Gg]et[Ff]ile[Pp]ath.{0,20}[Hh]"
