# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: pidfd-open-syscall
    desc: Opens a process file descriptor
    crit: notable
    if:
      type: syscall
      name: [pidfd_open]
      arch: [x86_64, aarch64]
  - id: pidfd-getfd-syscall
    desc: Duplicates another process file descriptor
    crit: notable
    if:
      type: syscall
      name: [pidfd_getfd]
      arch: [x86_64, aarch64]
