# Debug Adapter Protocol memory access.
#
# `readMemory`/`writeMemory` are DAP requests that read and overwrite the
# memory of the process under debug, addressed by a `memoryReference`. A
# debugger UI is the obvious consumer — the Eclipse CDT Memory Inspector
# extension is built on exactly these two requests — but the same API is a
# clean way for any editor extension to scrape or patch the memory of whatever
# the developer happens to be debugging, without touching a native debug API
# or tripping a ptrace rule. Nothing covered this surface, so a memory tool and
# a memory scraper both rendered as ordinary webview traffic.
#
# Neutral capability, notable on both halves: reading is inspection, writing is
# mutation of a live process. Intent belongs to composites that add the
# collection or exfiltration legs.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json]
  crit: notable
  conf: 0.93
  mbc: C0049

traits:
  # The request method name as it goes on the wire, or the capability flag an
  # adapter advertises. Quoting keeps this a protocol request rather than any
  # method that happens to be called readMemory.
  - id: dap-read-memory-request
    desc: DAP readMemory request for debuggee memory
    if:
      type: text
      regex: '["'']readMemory["'']|supportsReadMemoryRequest'

  - id: dap-write-memory-request
    desc: DAP writeMemory request into debuggee
    if:
      type: text
      regex: '["'']writeMemory["'']|supportsWriteMemoryRequest'

  # The DAP field naming the address to read or write. Alone it is only the
  # protocol's vocabulary, which is why it is a component.
  - id: dap-memory-reference-field
    desc: DAP memoryReference address field
    crit: component
    conf: 0.9
    if:
      type: text
      word: memoryReference

composite_rules:
  - id: dap-debuggee-memory-access
    desc: Reads or writes memory of a debugged process
    crit: notable
    conf: 0.95
    all:
      - id: dap-memory-reference-field
    any:
      - id: dap-read-memory-request
      - id: dap-write-memory-request
