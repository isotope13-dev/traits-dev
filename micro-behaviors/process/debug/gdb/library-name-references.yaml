---
defaults:
  crit: baseline
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - shell
  - python
  - c
  - cpp
  - rust
  - go
  - javascript
traits:
- id: gdb-debugger-ref
  desc: GDB debugger reference
  crit: baseline
  conf: 0.9
  for:
  - elf
  - macho
  if:
    type: text
    regex: "(?i)\\bGNU gdb\\b"
- id: gdb-command-ref
  desc: GDB command-line usage marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  - macho
  if:
    type: text
    regex: "(?i)\\bgdb\\s+(version|debugging|remote|server)"
- id: gdbserver-ref
  desc: gdbserver marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  - macho
  if:
    type: text
    regex: "(?i)\\bgdbserver\\b"
- id: gdb-multiarch-ref
  desc: gdb-multiarch marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  - macho
  if:
    type: text
    regex: "(?i)\\bgdb-multiarch\\b"
