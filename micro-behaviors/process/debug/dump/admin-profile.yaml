# API/manifest co-occurrence; neither a target nor a completed dump is inferred.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: admin-manifest-minidump-api-profile
  desc: Administrator manifest with process-minidump APIs
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/process/debug/dump::minidump-write-dump-symbol
  - id: micro-behaviors/os/privilege/manifest::admin-manifest
  any:
  - id: micro-behaviors/process/info/name::lsass-process-reference
  - id: micro-behaviors/process/attach/rights::open-process
  unless:
  - id: metadata/signed/platform/
