defaults:
  platforms: [windows]
  for: [scripts, binaries]
traits:
  - id: procdump-full-memory-eula-flags
    desc: Full-memory dump flags with EULA acceptance
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)(\s+-accepteula\b[^\r\n]{0,120}\s+-ma\b|\s+-ma\b[^\r\n]{0,120}\s+-accepteula\b)'
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
      - id: well-known/tool/offensive/bingo/
