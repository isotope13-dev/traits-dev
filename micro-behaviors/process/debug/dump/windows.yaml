defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable

traits:
- id: minidump-write-dump-symbol
  desc: Windows minidump-generation API symbol
  conf: 0.95
  if:
    type: symbol
    exact: MiniDumpWriteDump
- id: minidump-write-dump-name
  desc: Windows minidump-generation API name
  conf: 0.9
  if:
    type: text
    word: MiniDumpWriteDump
  unless:
  - id: minidump-write-dump-symbol
