defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable

traits:
- id: minidump-write-dump-symbol
  desc: Windows minidump-generation API symbol
  conf: 0.95
  for: [pe, dll, c, cpp, csharp, rust]
  if:
    type: symbol
    exact: MiniDumpWriteDump
- id: minidump-write-dump-name
  desc: Windows minidump-generation API name
  conf: 0.9
  for: [pe, dll, powershell, python, batch, vbs, javascript]
  if:
    type: text
    word: MiniDumpWriteDump
  unless:
  - id: minidump-write-dump-symbol
- id: minidump-full-memory-flag
  desc: Requests full memory in minidump
  conf: 0.92
  for: [binaries, scripts, source, -go]
  if:
    type: text
    exclude_comments: true
    word: MiniDumpWithFullMemory
- id: pss-capture-snapshot-reference
  desc: PssCaptureSnapshot process snapshot API
  conf: 0.93
  for: [binaries, scripts, source]
  if:
    type: text
    exclude_comments: true
    word: PssCaptureSnapshot

composite_rules:
- id: minidump-full-memory-any
  desc: Requests MiniDumpWithFullMemory in native, script, or Go code
  crit: component
  conf: 0.92
  for: [binaries, scripts, source]
  any:
  - id: minidump-full-memory-flag
  - id: micro-behaviors/process/debug/dump::minidump-full-memory-flag-go-source
- id: minidump-write-dump-any
  desc: References or invokes Windows MiniDumpWriteDump API
  crit: component
  conf: 0.94
  for: [binaries, scripts, source]
  any:
  - id: minidump-write-dump-symbol
  - id: minidump-write-dump-name
  - id: micro-behaviors/process/debug/dump::minidump-write-dump-go-source
