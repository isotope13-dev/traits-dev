# Windows Error Reporting SilentProcessExit APIs and cloned-process minidump
# capabilities shared across credential-dumping and LOLBin proxy rules.
defaults:
  platforms: [windows]
  for: [binaries, scripts, source]

traits:
  - id: wer-silent-process-exit-api
    desc: SilentProcessExit reporting API name
    crit: notable
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '\b(WerUIReportSilentProcessExit|RtlReportSilentProcessExit)\b'

composite_rules:
  - id: lsass-process-or-query-target
    desc: References or queries the Windows LSASS process
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/process/info/name::lsass-executable-reference
      - id: micro-behaviors/process/info/name::lsass-target-token
      - id: micro-behaviors/process/enumerate/shell::powershell-get-process-lsass

  - id: toolhelp-snapshot-enum-any
    desc: Enumerates processes via Windows Toolhelp32 snapshot APIs
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot-source
      - id: micro-behaviors/process/enumerate/snapshot::process32-first
      - id: micro-behaviors/process/enumerate/snapshot::process32-first-source

  - id: cloned-process-minidump
    desc: Clones or snapshots a remote process and writes a minidump
    crit: suspicious
    conf: 0.96
    attack: T1003.001
    all:
      - id: micro-behaviors/process/attach/rights::process-handle-open-any
      - id: micro-behaviors/process/debug/dump::minidump-write-dump-any
    any:
      - id: micro-behaviors/process/create/fork::windows-process-clone-api-any
      - id: micro-behaviors/process/debug/dump::pss-capture-snapshot-reference
    unless:
      - id: well-known/app/system/microsoft/platform::microsoft-signed-system-component-context
      - id: metadata/vendor/identity::microsoft-corp-versioninfo
      # Sandboxes list clone APIs and protected processes they block.
      - id: micro-behaviors/process/info/name::protected-system-process-roster
