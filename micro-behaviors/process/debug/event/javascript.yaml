defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: debugger-statement
    desc: JavaScript debugger breakpoint statement
    conf: 0.95
    if:
      type: text
      regex: '(?m)[;{}():\n][ \t]*debugger\b[ \t]*;?'
  - id: repeated-debugger-statements
    desc: Multiple JavaScript debugger breakpoints
    conf: 0.9
    count_min: 2
    if:
      type: text
      regex: '(?m)[;{}():\n][ \t]*debugger\b[ \t]*;?'
  - id: debugger-infinite-loop
    desc: Debugger breakpoint followed by infinite loop
    conf: 0.98
    if:
      type: text
      regex: 'debugger\s*;\s*while\s*\(\s*true\s*\)'
