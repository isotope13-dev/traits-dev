defaults:
  platforms: [windows]
  for: [source, powershell, batch]
traits:
  - id: wait-for-debug-event-source
    desc: WaitForDebugEvent reference in source
    crit: notable
    conf: 0.9
    if:
      type: text
      word: WaitForDebugEvent
  - id: continue-debug-event-source
    desc: ContinueDebugEvent reference in source
    crit: notable
    conf: 0.9
    if:
      type: text
      word: ContinueDebugEvent
  - id: debug-process-flags-source
    desc: DEBUG_PROCESS child creation flags in source
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(DEBUG_ONLY_THIS_PROCESS|DEBUG_PROCESS)\b'
  - id: debug-active-process-source
    desc: DebugActiveProcess attach reference in source
    crit: notable
    conf: 0.9
    if:
      type: text
      word: DebugActiveProcess
composite_rules:
  - id: debugger-event-loop-source
    desc: Built-in debugger event loop in source
    crit: notable
    conf: 0.97
    all:
      - id: wait-for-debug-event-source
      - id: continue-debug-event-source
      - id: debug-process-flags-source
  # The CE-style watchpoint technique: attach to a running process, pump the
  # debug event loop, and program Dr0-Dr3 write breakpoints through the
  # thread context. File-level co-occurrence: proximity is not required
  # because toolkit sources reference the context APIs earlier as well.
  - id: debugger-hardware-breakpoint-session-source
    desc: Debug-attach session programs hardware breakpoints
    crit: notable
    conf: 0.95
    all:
      - id: debug-active-process-source
      - id: wait-for-debug-event-source
      - id: micro-behaviors/process/thread/config::set-thread-context
      - id: micro-behaviors/process/info/thread::hardware-breakpoint-address-write
