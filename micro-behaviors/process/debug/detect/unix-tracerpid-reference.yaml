# Nearby text references do not prove a debugger check or evasion.
defaults:
  platforms: [unix]
  for: [elf]
composite_rules:
  - id: unix-tracerpid-status-references
    desc: Nearby TracerPid and process status references
    crit: notable
    conf: 0.95
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/proc/info/path::tracerpid-status-field
    any:
      - id: micro-behaviors/fs/proc/info/path::process-self-status
      - id: micro-behaviors/fs/proc/info/path::tracerpid-adjacent-status-filename
