# A DevTools open-state property is a neutral debugger-awareness surface. Web
# applications may use it to adjust their UI or diagnostics; anti-analysis
# intent requires a response such as blocking inspection or wiping the page.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1622

traits:
  - id: browser-devtools-open-state-reference
    desc: References browser DevTools open-state flag
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(window\.)?devtools\.(isOpen|open)\b'
  # Inspects its own launch flags for a Node debugger attach (`--inspect` in
  # argv or NODE_OPTIONS). Test harnesses probe this to route child output;
  # the anti-analysis use pairs it with an immediate exit.
  - id: node-inspect-flag-check
    desc: Checks own flags for debugger attach
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/package/testing/harness/runtime::node-inspector-harness
    if:
      type: text
      regex: '(NODE_OPTIONS|argv|execArgv)[\s\S]{0,120}inspect'
  - id: node-inspector-builtin-require
    desc: Loads the Node.js inspector builtin
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/package/testing/harness/runtime::node-inspector-harness
    if:
      type: text
      regex: 'require\([''"]inspector[''"]\)'
  - id: react-native-devsettings-reference
    desc: References React Native DevSettings module
    crit: notable
    conf: 0.9
    platforms: [ios, android]
    if:
      type: text
      substr: NativeModules.DevSettings
