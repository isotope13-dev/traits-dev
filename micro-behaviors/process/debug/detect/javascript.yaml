# A DevTools open-state property is a neutral debugger-awareness surface. Web
# applications may use it to adjust their UI or diagnostics; anti-analysis
# intent requires a response such as blocking inspection or wiping the page.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]

traits:
  - id: browser-devtools-open-state-reference
    desc: References browser DevTools open-state flag
    crit: notable
    conf: 0.9
    attack: T1622
    if:
      type: text
      regex: '\b(window\.)?devtools\.(isOpen|open)\b'
