# A DevTools open-state property is a neutral debugger-awareness surface. Web
# applications may use it to adjust their UI or diagnostics; anti-analysis
# intent requires a response such as blocking inspection or wiping the page.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: T1622

traits:
  - id: browser-devtools-open-state-reference
    desc: References browser DevTools open-state flag
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(window\.)?devtools\.(isOpen|open)\b'
  # Require a call testing process/environment options. A launch configuration
  # containing NODE_OPTIONS: `--inspect=...` is not a debugger check.
  - id: node-inspect-options-call
    desc: Tests process or environment inspector options
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    unless:
      - id: metadata/package/testing/harness/runtime::node-inspector-harness
    if:
      type: tree-sitter
      kind: call
      regex: '^(process|env)\.[^;\n]{0,80}\.(includes|some|match)\([^;\n]{0,80}--inspect'
  - id: html-node-inspect-options-call
    desc: HTML source tests Node inspector options
    crit: notable
    conf: 0.85
    for: [html]
    if:
      type: text
      regex: '(^|[\s(])(process|env)\.[^;\n]{0,60}\.(includes|some|match)\(.{0,80}--inspect'
  - id: node-inspector-builtin-require
    desc: Loads the Node.js inspector builtin
    crit: notable
    conf: 0.9
    unless:
      - id: metadata/package/testing/harness/runtime::node-inspector-harness
    if:
      type: text
      regex: 'require\([''"]inspector[''"]\)'
  - id: react-native-devsettings-reference
    desc: References React Native DevSettings module
    crit: notable
    conf: 0.9
    platforms: [ios, android]
    if:
      type: text
      substr: NativeModules.DevSettings

composite_rules:
  - id: node-inspect-flag-check
    desc: Tests process or environment inspector options
    crit: notable
    conf: 0.9
    any:
      - id: node-inspect-options-call
      - id: html-node-inspect-options-call
