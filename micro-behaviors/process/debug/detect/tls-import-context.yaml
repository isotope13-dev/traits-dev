composite_rules:
- id: unsigned-tls-debugger-protect-imports
  desc: Unsigned TLS PE references debugger and memory-protection APIs
  crit: notable
  conf: 0.75
  platforms:
  - windows
  for:
  - pe
  - dll
  all:
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: metadata/binary/layout/tls::pe-tls-callback-table
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool/development
