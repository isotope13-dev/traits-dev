# `defined?(Byebug)` is Ruby's idiom for "is this optional gem loaded", and for
# a debugger it is written far more often to cooperate than to hide: test and
# assertion libraries use it to skip work the debugger already does, to expose a
# debugger-only entry point, or to drop the debugger's own frames out of a
# rendered backtrace. Ruby's bundled power_assert does all three. So the probe
# itself is a neutral capability and lives here beside the Python
# `sys.gettrace` query; the anti-analysis reading comes from what the code does
# with the answer, which the composites in
# objectives/anti-analysis/debugger-detect/ supply.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  attack: T1622

traits:
  - id: ruby-debugger-constant-defined-check
    desc: Ruby checks for a loaded debugger constant
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'defined\?\(\s*(Pry|Byebug|Debugger)\s*\)'
