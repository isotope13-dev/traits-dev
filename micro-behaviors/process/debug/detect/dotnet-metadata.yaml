defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
traits:
  - id: dotnet-debugger-type-reference
    desc: Managed Debugger type name in code section
    if:
      type: text
      exact: Debugger
      section: .text
composite_rules:
  # CLR metadata stores type/member names separately. These are references,
  # not proof of a conditional exit; newer parsers can also resolve imports.
  - id: dotnet-debugger-attachment-references
    desc: CLR debugger attachment probe references
    all:
      - id: metadata/binary/framework::clr-runtime-header
      - id: dotnet-debugger-type-reference
      - id: metadata/binary/symbols/name/token::dotnet-is-attached-getter-name
  - id: dotnet-debugger-logging-references
    desc: CLR debugger logging probe references
    all:
      - id: metadata/binary/framework::clr-runtime-header
      - id: dotnet-debugger-type-reference
      - id: metadata/binary/symbols/name/token::dotnet-is-logging-method-name
