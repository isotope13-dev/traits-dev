defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: debugger-timing-compat-api-profile
    desc: Debugger, timing and compatibility APIs
    crit: notable
    conf: 0.88
    size_min: 500000
    all:
      - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
    needs: 2
    any:
      - id: micro-behaviors/time/query::query-performance-counter
      - id: micro-behaviors/time/query::get-tick-count
      - id: micro-behaviors/os/compat/wow64::wow64-fs-redirect
      - id: micro-behaviors/os/compat/wow64::is-wow64-process
