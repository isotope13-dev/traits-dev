# Debugger Detection APIs — Windows
# Neutral debugging APIs used by both security tools and anti-debug code
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  crit: baseline
traits:
  - id: is-debugger-present-import
    desc: References the IsDebuggerPresent API
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "IsDebuggerPresent"
    unless:
      - id: metadata/binary/linking/api-set::api-set-forwarder-dll
  - id: check-remote-debugger
    desc: CheckRemoteDebuggerPresent API
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: "CheckRemoteDebuggerPresent"
  # Managed assemblies keep these Win32 API names in metadata rather than in
  # the native import table. Keep the string observations separate from the
  # import atoms so callers can distinguish the two evidence types.
  - id: is-debugger-present-string
    desc: IsDebuggerPresent API name in PE strings
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)IsDebuggerPresent(A|W)?'
  - id: check-remote-debugger-string
    desc: CheckRemoteDebuggerPresent name in PE strings
    crit: notable
    conf: 0.85
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)CheckRemoteDebuggerPresent(A|W)?'
composite_rules:
  - id: is-debugger-present-any
    desc: IsDebuggerPresent import or API name reference
    crit: notable
    conf: 0.9
    any:
      - id: is-debugger-present-import
      - id: is-debugger-present-string
  - id: check-remote-debugger-any
    desc: CheckRemoteDebuggerPresent import or API name reference
    crit: notable
    conf: 0.85
    any:
      - id: check-remote-debugger
      - id: check-remote-debugger-string
