# Debugger Detection APIs — Windows
# Neutral debugging APIs used by both security tools and anti-debug code
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
  crit: baseline
traits:
  - id: is-debugger-present-import
    desc: References the IsDebuggerPresent API
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "IsDebuggerPresent"
    unless:
      - id: metadata/binary/linking/api-set::api-set-forwarder-dll
  - id: check-remote-debugger
    desc: CheckRemoteDebuggerPresent API
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: "CheckRemoteDebuggerPresent"
  # Managed assemblies keep these Win32 API names in metadata rather than in
  # the native import table. Keep the string observations separate from the
  # import atoms so callers can distinguish the two evidence types.
  - id: is-debugger-present-string
    desc: IsDebuggerPresent API name in PE strings
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)IsDebuggerPresent(A|W)?'
  - id: check-remote-debugger-string
    desc: CheckRemoteDebuggerPresent name in PE strings
    crit: notable
    conf: 0.85
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)CheckRemoteDebuggerPresent(A|W)?'
composite_rules:
  # The import cluster is neutral evidence: crash reporters, game clients, and
  # debuggers commonly combine these APIs. Anti-analysis objectives add the
  # downloader, temporary payload, and elevation evidence.
  - id: resource-debugger-import-cluster
    desc: Resource and debugger API import cluster
    crit: notable
    conf: 0.96
    for: [pe]
    all:
      - id: is-debugger-present-import
      - id: micro-behaviors/os/exception/error-handling::set-unhandled-exception-filter-import
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-load-lock-chain
    any:
      - id: micro-behaviors/time/timing/delay::query-performance-counter
      - id: micro-behaviors/os/exception/handler::capture-context
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/
      - id: metadata/binary/framework/
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: metadata/package/testing/presence/fixture/
      - id: well-known/tool/sysadmin/console::microsoft-openconsole-host
      - id: well-known/app/utility/glary-utilities/
      - id: well-known/app/media/camtasia::camtasia-known-app-context

  - id: is-debugger-present-any
    desc: IsDebuggerPresent import or API name reference
    crit: notable
    conf: 0.9
    any:
      - id: is-debugger-present-import
      - id: is-debugger-present-string
  - id: check-remote-debugger-any
    desc: CheckRemoteDebuggerPresent import or API name reference
    crit: notable
    conf: 0.85
    any:
      - id: check-remote-debugger
      - id: check-remote-debugger-string
