defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: adjacent-debugger-api-names
    desc: Paired debugger-check API strings
    crit: notable
    conf: 0.96
    if:
      type: raw
      regex: 'IsDebuggerPresent.{0,64}CheckRemoteDebuggerPresent'
    unless:
      - id: well-known/tool/reverse-engineering/
      - id: metadata/signed/platform/
      - id: well-known/app/security/bitwarden::bitwarden-windows-binary
      - id: well-known/app/security/bitwarden::bitwarden-portable-context
      - id: well-known/app/security/bitwarden::bitwarden-portable-binary
      - id: well-known/lib/runtime/scripted/node-runtime::windows-runtime-identity
      - id: metadata/binary/debug::pdb-visual-studio
      - id: well-known/tool/detection/falconet::falconet-env-config-marker
composite_rules:
  - id: local-and-remote-debugger-api-references
    desc: Local and remote debugger API references
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/process/debug/detect::is-debugger-present-any
      - id: micro-behaviors/process/debug/detect::check-remote-debugger-any
    unless:
      - id: metadata/signed/platform/
      - id: well-known/lib/platform/advanced-inf::advanced-inf-setup-context
      - id: well-known/lib/data/ssh2::ssh2-pageant-helper-context
      - id: well-known/app/communication/telegram::telegram-desktop-signed-client-context

