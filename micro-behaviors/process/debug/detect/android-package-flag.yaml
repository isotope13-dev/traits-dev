defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-android-debuggable-flag-test
    desc: Tests for Android FLAG_DEBUGGABLE in output
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((comparison_operator
          (string (string_content) @flag)
          "in"
          (identifier)) @test
          (#eq? @flag "FLAG_DEBUGGABLE"))
