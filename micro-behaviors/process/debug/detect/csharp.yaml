defaults:
  platforms: [windows]
  for: [csharp]
traits:
  - id: dotnet-debugger-attached-property
    desc: Reads .NET debugger attachment state
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: member
      exact: Debugger.IsAttached

  - id: dotnet-debugger-attached-call
    desc: Calls managed debugger attachment getter
    crit: notable
    conf: 0.99
    for: [pe, dll]
    if:
      type: symbol
      kind: call
      exact: System.Diagnostics.Debugger.get_IsAttached
