composite_rules:
- platforms:
  - windows
  for:
  - pe
  id: debugger-termination-api-references
  desc: Debugger-check and termination API references
  crit: notable
  conf: 0.85
  size_max: 100000
  all:
  - id: micro-behaviors/process/debug/detect::local-and-remote-debugger-api-references
  - id: micro-behaviors/process/terminate/kill::terminate-process
  unless:
  - id: well-known/lib/data/ssh2::ssh2-pageant-helper-context
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/script/
  - id: well-known/app/utility/glary-utilities/
