# Debug helpers and crash reporters also reference this status flag. A token
# reference establishes neither an evasion response nor an executed test.
defaults:
  platforms: [freebsd, unix]
  for: [objc, macho]
traits:
  - id: bsd-traced-process-flag-reference
    desc: References BSD traced-process status flag
    crit: notable
    conf: 0.94
    if:
      type: text
      word: P_TRACED
