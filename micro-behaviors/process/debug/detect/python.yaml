# Debugger API names referenced from Python / bytecode (ctypes, windll, etc.)
defaults:
  platforms: [windows]
  for: [python, pyc]
  crit: notable

traits:
  - id: is-debugger-present-python-text
    desc: IsDebuggerPresent name in Python code
    crit: notable
    conf: 0.92
    attack: T1622
    if:
      type: text
      exact: IsDebuggerPresent

  # sys.gettrace is portable Python, so the file's Windows default does not
  # apply. Match the attribute rather than only the `sys.gettrace()` call so an
  # aliased module (`s = import_module('sys'); t = s.gettrace`) still counts.
  - id: python-runtime-trace-query
    desc: Python queries the current trace hook
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    for: [python]
    if:
      type: text
      regex: '\.gettrace\b'

  - id: python-trace-hook-alias
    desc: Stores sys.gettrace under another name
    crit: notable
    conf: 0.9
    for: [python]
    platforms: [unix, windows]
    if:
      type: text
      regex: '\b\w+\s*=\s*[\w.]*\.gettrace\s*($|[;,)])'
