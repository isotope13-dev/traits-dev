defaults:
  platforms: [unix, windows]
  for: [shell, batch, powershell]
  crit: notable
traits:
  - id: jstack-thread-dump-command
    desc: jstack command requests JVM thread stacks
    conf: 0.96
    if:
      type: text
      regex: '(?m)^[ \t]*jstack(\.exe)?[ \t]+(-[lmF][ \t]+){0,3}["\x27]?[%$0-9]'
