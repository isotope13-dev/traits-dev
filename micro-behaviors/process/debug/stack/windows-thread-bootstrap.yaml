# Windows thread bootstrap symbols are useful stack-walking anchors in
# profilers and debuggers. Objective rules add context-rewrite behavior before
# treating them as a synthetic call-stack chain.
defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.96

traits:
  - id: rtl-user-thread-start-reference-source
    desc: References RtlUserThreadStart
    if:
      type: text
      word: RtlUserThreadStart

  - id: base-thread-init-reference-source
    desc: References BaseThreadInitThunk
    if:
      type: text
      word: BaseThreadInitThunk

  - id: nt-continue-call-source
    desc: NtContinue call in native source
    for: [c, cpp, pe, dll]
    if:
      type: text
      regex: 'call\s+NtContinue\b|NtContinue\s*\('
    unless:
      - id: metadata/package/testing/presence/harness::rostests-directory-path
      - id: metadata/package/testing/presence/harness::winetests-directory-path

  - id: rtl-capture-context-call-source
    desc: RtlCaptureContext call in native source
    for: [c, cpp, pe, dll]
    if:
      type: text
      regex: 'call\s+RtlCaptureContext\b|RtlCaptureContext\s*\('
    unless:
      - id: metadata/package/testing/presence/harness::rostests-directory-path
      - id: metadata/package/testing/presence/harness::winetests-directory-path

composite_rules:
  - id: thread-bootstrap-reference-pair-source
    desc: References both thread-bootstrap routines
    conf: 0.97
    all:
      - id: rtl-user-thread-start-reference-source
      - id: base-thread-init-reference-source
    near_bytes: 400
