# A custom stack getter can observe or reshape debugger-visible traces. The
# accessor definition itself is neutral debugging behavior; objective rules
# supply any anti-analysis context.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9

traits:
  - id: javascript-stack-property-getter
    desc: Defines a custom JavaScript stack getter
    if:
      type: text
      regex: '(?is)defineProperty\s*\(\s*[^,]{1,80},\s*["'']stack["'']\s*,\s*\{[^}]{0,160}\bget\s*\('
      exclude_html_comments: true
