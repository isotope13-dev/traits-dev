# Go's runtime.Stack formats the stack trace of the calling goroutine, or of
# every goroutine in the process, into a caller-supplied buffer.  Crash
# reporters and diagnostic endpoints use it legitimately; it is also how a
# payload captures in-process state, so the capability is worth surfacing in a
# supply-chain diff.  Neutral on its own.
defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.9

traits:
  - id: go-runtime-stack-trace
    desc: Captures a Go goroutine stack trace
    if:
      type: symbol
      kind: call
      exact: runtime.Stack
