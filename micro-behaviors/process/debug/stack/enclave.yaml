defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, python]
  crit: notable
traits:
  - id: enclave-continuation-dispatch
    desc: Dispatches NtContinue through an enclave
    if:
      type: text
      regex: '\bCallEnclave\s*\([^;\n]{0,160}\bNtContinue\b'
  - id: instruction-stack-register-rewrite
    desc: Assigns instruction and stack context registers
    if:
      type: text
      regex: '(?s)\.(Rip|Eip)\s*=[^;\n]{1,80}[;\n].{0,180}\.(Rsp|Esp)\s*='

  - id: context-instruction-pointer-bind
    for: [c, cpp, csharp, rust, go, python]
    desc: Assigns a thread-context instruction pointer
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: bind
      regex: '\.(Rip|Eip)$'
