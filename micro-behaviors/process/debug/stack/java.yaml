defaults:
  platforms: [windows, unix]
  for: [java, class, java_class, jar]

traits:
  - id: java-linkageerror-stacktrace-reference
    desc: Java linkage and stack trace references
    crit: notable
    conf: 0.93
    for: [java, class, java_class]
    if:
      type: text
      regex: 'LinkageError.{0,80}StackTraceElement'
