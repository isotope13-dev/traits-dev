# Return-address access is a neutral low-level capability.  Anti-analysis
# intent requires the surrounding XOR/clearing/spoofing pattern.
defaults:
  for: [c, cpp, pe, dll]
  platforms: [windows]
  crit: notable
  conf: 1.0

traits:
  - id: address-of-return-address
    desc: Reads the compiler return-address slot
    if:
      type: symbol
      substr: "_AddressOfReturnAddress"
