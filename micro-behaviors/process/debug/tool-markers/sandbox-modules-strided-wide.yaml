# SbieDll.dll fragment stored as UTF-16 with a junk wide character after
# each real character, hiding the sandbox-module probe from plain matchers.
defaults:
  for: [pe]
  platforms: [windows]
  attack: T1497.001,T1027
traits:
  - id: sandboxie-dll-name-strided-wide
    desc: SbieDl name in junk-padded wide text
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: text
      pattern: '53 [3] 62 [3] 69 [3] 65 [3] 44 [3] 6C'
