# A human first name does not identify a debugging proxy.
defaults:
  platforms: [windows, unix]
traits:
  - id: python-charles-executable-reference
    desc: Charles Proxy executable or app reference
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: literal
      regex: '(?i)(^|[/\\])charles\.(exe|app)$'
