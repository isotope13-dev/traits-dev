# A program that carries several distinct sanitizer/crash-report marker
# strings together is a crash-triage or crash-confirmation oracle: it is
# built to recognize a target's memory-safety failure from its output.
# CI fuzzing harnesses, crash-report parsers and exploit confirmation
# tooling all share this capability, so the quorum composite stays
# notable; objective-tier composites add the delivery/target context
# that turns it into an attack.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: component
  conf: 0.85

traits:
  - id: addresssanitizer-marker-literal
    desc: AddressSanitizer crash-report marker string
    if:
      type: text
      substr: AddressSanitizer

  - id: threadsanitizer-marker-literal
    desc: ThreadSanitizer data-race marker string
    if:
      type: text
      substr: ThreadSanitizer

  - id: heap-use-after-free-marker-literal
    desc: heap-use-after-free sanitizer marker string
    if:
      type: text
      substr: heap-use-after-free

  - id: double-free-marker-literal
    desc: double-free sanitizer marker string
    if:
      type: text
      substr: double-free

  - id: segv-unknown-address-marker-literal
    desc: SEGV-on-unknown-address crash marker string
    if:
      type: text
      substr: SEGV on unknown address

composite_rules:
  - id: sanitizer-crash-marker-oracle
    desc: Recognizes sanitizer crash-report markers
    crit: notable
    conf: 0.9
    any:
      - id: addresssanitizer-marker-literal
      - id: threadsanitizer-marker-literal
      - id: heap-use-after-free-marker-literal
      - id: double-free-marker-literal
      - id: segv-unknown-address-marker-literal
    needs: 3
    near_bytes: 16384
