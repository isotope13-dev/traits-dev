traits:
- platforms:
  - windows
  - unix
  id: procmon
  desc: Process Monitor name reference
  crit: notable
  conf: 0.6
  for:
  - scripts
  - binaries
  if:
    type: text
    # The reference must not be a source-file name: host-audit tools ship
    # their own process-watch modules named procmon.rs/procmon.py, which are
    # not references to Sysinternals Process Monitor. Expressed as the
    # allowed followings (exe/dll suffix, non-word char, or end) because the
    # engine's regex dialect has no negative lookahead.
    regex: (?i)\bprocmon(64)?(\.exe\b|\.dll\b|[^.\w]|$)
  unless:
  - id: well-known/tool/sysadmin/sysinternals/
  not:
  - regex: (?i)[\\/][^\r\n]{0,200}\bprocmon(64)?\.exe\b
- platforms:
  - windows
  - unix
  id: x64dbg
  desc: x64dbg debugger name reference
  crit: notable
  conf: 0.6
  for:
  - scripts
  - binaries
  if:
    type: text
    word: x64dbg
    case_insensitive: true
  not:
  - regex: (?i)[\\/][^\r\n]{0,200}\bx64dbg(_[a-z_]+)?(\.qm|\.exe)?\b
- platforms:
  - windows
  - unix
  id: ollydbg
  desc: OllyDbg debugger name reference
  crit: notable
  conf: 0.6
  for:
  - scripts
  - binaries
  if:
    type: text
    word: ollydbg
    case_insensitive: true
  not:
  - regex: (?i)[\\/][^\r\n]{0,200}\bollydbg(\.exe|\.ini|\.js|\.lib)?\b
- platforms:
  - windows
  - unix
  id: fiddler
  desc: Fiddler tooling reference
  crit: notable
  conf: 0.6
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)\bfiddler(\.exe|core|rootcertmaker|certmaker)\b
    case_insensitive: true
- platforms:
  - windows
  - unix
  id: hybrid-analysis
  desc: Hybrid Analysis sandbox reference
  crit: notable
  conf: 0.7
  for:
  - scripts
  - binaries
  if:
    type: text
    substr: hybrid-analysis
    case_insensitive: true
- platforms:
  - windows
  - unix
  id: joe-sandbox
  desc: Joe Sandbox reference
  crit: notable
  conf: 0.7
  for:
  - scripts
  - binaries
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-documentation
  - id: metadata/file/string/corpus::hashed-text-record
  if:
    type: text
    substr: joe sandbox
    case_insensitive: true
- platforms:
  - windows
  - unix
  id: cuckoo--sandbox-form
  desc: Cuckoo sandbox name, DLL or agent file
  crit: notable
  conf: 0.7
  for:
  - scripts
  - binaries
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: metadata/file/string/identity::cuckoo-typeface-name-token
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  if:
    type: text
    regex: (?i)cuckoo(mon|[ _-]?sandbox)|\\cuckoo\b|\bcuckoo\.(exe|dll|py)\b
  not:
  - regex: '[a-z]{2,4}\.cuckoo'
  - regex: (?i)\b(an|the|this|that|cuckoo)\s+cuckoo\b|\bcuckoo\s+(clock|clocks|bird|birds|bee|bees|wasp|wasps|bumblebee|bumblebees)\b
- platforms:
  - windows
  - unix
  id: cuckoo--blocklist-entry
  desc: Cuckoo listed beside another analysis name
  crit: notable
  conf: 0.7
  for:
  - scripts
  - binaries
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: metadata/file/string/identity::cuckoo-typeface-name-token
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  if:
    type: text
    regex: (?i)["']cuckoo["'],\s*["'](sandbox|vmware|anubis|joe)
- platforms:
  - windows
  for:
  - pe
  - dll
  id: ollydbg-exact-name-reference
  desc: OllyDbg exact name reference
  crit: notable
  conf: 0.9
  if:
    type: text
    exact: OLLYDBG
    case_insensitive: true
composite_rules:
- platforms:
  - windows
  - unix
  id: cuckoo
  desc: Cuckoo sandbox reference
  crit: notable
  conf: 0.7
  any:
  - id: micro-behaviors/process/debug/tool-markers::cuckoo--sandbox-form
  - id: micro-behaviors/process/debug/tool-markers::cuckoo--blocklist-entry
- platforms:
  - windows
  id: analyst-tool-name-cluster
  desc: References at least three analysis tools
  crit: notable
  conf: 0.9
  for:
  - pe
  - dll
  needs: 3
  any:
  - id: micro-behaviors/process/debug/tool-markers::procmon
  - id: micro-behaviors/process/debug/tool-markers::process-hacker-executable-name-reference
  - id: micro-behaviors/process/debug/tool-markers::x64dbg
  - id: micro-behaviors/process/debug/tool-markers::ollydbg
  - id: micro-behaviors/process/debug/tool-markers::fiddler
  - id: micro-behaviors/process/debug/tool-markers::cuckoo
  - id: micro-behaviors/process/debug/tool-markers::joe-sandbox
  - id: micro-behaviors/process/debug/tool-markers::hybrid-analysis
  - id: micro-behaviors/process/debug/tool-markers::wireshark-name-reference
  unless:
  - id: metadata/binary/framework/
  - id: well-known/tool/sysadmin/sysinternals/
  - id: well-known/tool/offensive/frameworks::al-khaser-benign-context
  - id: well-known/game/cheat::nm7-cheat-context
defaults: {}
