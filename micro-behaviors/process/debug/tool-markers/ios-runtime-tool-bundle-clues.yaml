defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [ipa]
  crit: notable
composite_rules:
  - id: substrate-cycript-and-bundle-clues
    desc: Substrate or Cycript and bundle ID clues
    conf: 0.95
    all:
      - id: micro-behaviors/process/hook/instrumentation::substrate-or-cycript-references
      - id: metadata/binary/bundle::bundle-id-shape-clues
      - id: micro-behaviors/process/debug/tool-markers::ios-runtime-tool-references
  - id: ios-inspection-framework-references
    desc: RevealServer or CBInjection references
    conf: 0.85
    any:
      - id: well-known/lib/platform/reveal-server::name-reference
      - id: well-known/lib/platform/cbinjection::name-reference
  - id: runtime-tool-bundle-clues
    desc: Runtime tooling and bundle name clues
    conf: 0.9
    all:
      - id: metadata/binary/bundle::bundle-id-or-display-name-clues
      - id: micro-behaviors/process/debug/tool-markers::ios-runtime-tool-references
      - id: micro-behaviors/process/hook/instrumentation::substrate-or-cycript-references
