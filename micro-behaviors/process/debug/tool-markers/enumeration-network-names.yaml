# Process capabilities plus tool references are not artifact metadata.
# This co-occurrence neither probes nor rejects an analysis environment.
defaults:
  platforms: [linux, macos, windows]
composite_rules:
- id: process-enumeration-beside-network-analysis-names
  desc: Process enumeration beside network-analysis names
  crit: notable
  conf: 0.8
  all:
  - id: micro-behaviors/process/enumerate/
  any:
  - id: micro-behaviors/process/debug/tool-markers::wireshark-tool-name-reference
  - id: micro-behaviors/process/debug/tool-markers::fiddler-tool-name-reference
  - id: micro-behaviors/process/debug/tool-markers::burpsuite-tool-name-reference
  - id: micro-behaviors/process/debug/tool-markers::charles-tool-name-reference
  - id: micro-behaviors/process/debug/tool-markers::tcpview-tool-name-reference
  unless:
  - id: well-known/tool/offensive/peas/
  - id: well-known/tool/offensive/frameworks::al-khaser-benign-context
