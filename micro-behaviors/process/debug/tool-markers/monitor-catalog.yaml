composite_rules:
- id: monitoring-tool-name-cluster
  desc: Names three or more process-monitoring tools
  crit: notable
  conf: 0.85
  needs: 3
  any:
  - id: micro-behaviors/process/info/name::taskmgr-process
  - id: micro-behaviors/process/debug/tool-markers::procexp-tool-name-reference
  - id: micro-behaviors/process/debug/tool-markers::procmon-tool-name-reference
  - id: micro-behaviors/fs/path/basename::perfmon-process
  - id: micro-behaviors/fs/path/basename::resmon-process
  platforms:
  - linux
  - macos
  - windows
  for:
  - python
  - javascript
  - powershell
  - pe
  - elf
