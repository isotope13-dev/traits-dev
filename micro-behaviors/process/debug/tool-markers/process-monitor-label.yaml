traits:
- id: process-monitor-label-reference
  desc: Process Monitor tool-name reference
  crit: notable
  conf: 0.6
  for:
  - scripts
  - binaries
  if:
    type: text
    exact: process monitor
    case_insensitive: true
  unless:
  - id: well-known/tool/sysadmin/sysinternals/
  - id: well-known/tool/sysadmin/systeminformer
  - type: path
    regex: \.(jar|class)$
  platforms:
  - windows
  - unix
