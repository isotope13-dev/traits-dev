traits:
- id: encoded-analysis-tool-procmon
  desc: Encoded Process Monitor probe
  crit: notable
  conf: 0.98
  if:
    type: encoded
    encoding: xor
    regex: (?i)\bprocmon\b
- id: encoded-analysis-tool-procexp
  desc: Encoded Process Explorer probe
  crit: notable
  conf: 0.98
  if:
    type: encoded
    encoding: xor
    regex: (?i)\bprocexp\b
- id: encoded-analysis-tool-debugger
  desc: Encoded debugger probe names
  crit: notable
  conf: 0.98
  if:
    type: encoded
    encoding: xor
    regex: (?i)\b(x64dbg|x32dbg|ollydbg|windbg)\b
- id: encoded-analysis-tool-network
  desc: Encoded network analysis tool names
  crit: notable
  conf: 0.98
  if:
    type: encoded
    encoding: xor
    regex: (?i)\b(wireshark|fiddler|httpdebugger|fakenet)\b
composite_rules:
- id: encoded-analysis-tool-catalog
  desc: XOR-decoded analysis-tool name cluster
  crit: notable
  conf: 0.99
  any:
  - id: micro-behaviors/process/debug/tool-markers::encoded-analysis-tool-procmon
  - id: micro-behaviors/process/debug/tool-markers::encoded-analysis-tool-procexp
  - id: micro-behaviors/process/debug/tool-markers::encoded-analysis-tool-debugger
  - id: micro-behaviors/process/debug/tool-markers::encoded-analysis-tool-network
  needs: 3
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
