# Name references are analyst-tool markers, not product identities.
# Preserve the existing matchers and scope during this placement repair.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.98
  size_min: 0
  size_max: 120000000

traits:
  - id: wireshark-name-reference
    desc: Wireshark name substring reference
    crit: notable
    if:
      type: text
      substr: wireshark
    not:
      - regex: '[a-z]{2,4}\.wireshark'
    unless:
      - id: micro-behaviors/process/debug/tool-markers::unix-analysis-tool-lexicon-raw
      - id: metadata/document/html::doctype
      - id: metadata/document/html::legacy-doctype
      - id: metadata/package/documentation/manpage::unix-manpage
  - id: tshark-name-reference
    desc: Tshark name substring reference
    crit: notable
    if:
      type: text
      substr: tshark
    unless:
      - id: micro-behaviors/process/debug/tool-markers::unix-analysis-tool-lexicon-raw
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/document/html::doctype
      - id: metadata/document/html::legacy-doctype
      - id: metadata/package/documentation/manpage::unix-manpage
