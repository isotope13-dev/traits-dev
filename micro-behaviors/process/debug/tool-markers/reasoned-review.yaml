# Evidence-specific placement; matching does not imply attacker intent.
traits:
- id: source-x32dbg-literal
  desc: Source literal references x32dbg
  if:
    type: literal
    kind: string
    regex: (?i)\bx32dbg\.exe\b
- id: source-ollydbg-literal
  desc: Source literal references ollydbg
  if:
    type: literal
    kind: string
    regex: (?i)\bollydbg\b
- id: source-wireshark-literal
  desc: Source literal references wireshark
  if:
    type: literal
    kind: string
    regex: (?i)^wireshark(\.exe)?$
- id: source-dumpcap-literal
  desc: Source literal references dumpcap
  if:
    type: literal
    kind: string
    regex: (?i)\bdumpcap\b
- id: source-splunkd-literal
  desc: Source literal references splunkd
  if:
    type: literal
    kind: string
    regex: (?i)\bsplunkd\.exe\b
composite_rules:
- id: source-analysis-tool-name-literals
  desc: Source literals reference analysis tools
  any:
  - id: micro-behaviors/process/debug/tool-markers::source-x32dbg-literal
  - id: micro-behaviors/process/debug/tool-markers::source-ollydbg-literal
  - id: micro-behaviors/process/debug/tool-markers::source-wireshark-literal
  - id: micro-behaviors/process/debug/tool-markers::source-dumpcap-literal
  - id: micro-behaviors/process/debug/tool-markers::source-splunkd-literal
  unless:
  - id: metadata/file/catalog/identity::debian-packages-index
  - id: metadata/file/catalog/identity::nixpkgs-package-catalog
  - id: well-known/tool/development/toolchain/deno::source-archive-context
defaults:
  platforms:
  - windows
  for:
  - c
  - cpp
  - csharp
  - rust
  - go
  - source
  crit: notable
  conf: 0.95
