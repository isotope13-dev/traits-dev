# Bare analysis-tool names as they appear in process/hostname denylists.
#
# The sibling executable-reference traits require a `.exe` suffix, which is
# the right matcher for "runs or ships this tool". Malware kill-lists and
# sandbox-evasion arrays instead carry the bare lowercase names
# (`ollydbg`, `x32_dbg`, `fakenet`, `dumpcap`, ...) with no suffix, so the
# `.exe` matchers never fire on them. This trait matches those bare forms
# for tools with no legitimate single-name presence in a PE string table;
# generic admin utilities (taskmgr, regedit) and hypervisor agents
# (qemu-ga, vmusrvc) are deliberately excluded — the former co-occur in
# benign help text, the latter belong to the guest-agent cluster rule.
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: bare-analysis-tool-name-reference
    desc: Bare analysis-tool name reference
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\b(ollydbg|x32_?dbg|x64_?dbg|windbg|fiddler|dumpcap|fakenet|wpe pro)\b'
    unless:
      - id: well-known/tool/reverse-engineering/ollydbg/
      - id: well-known/tool/reverse-engineering/x64dbg/
      - id: well-known/tool/reverse-engineering/windows-debugger/
      - id: well-known/tool/detection/wireshark/
