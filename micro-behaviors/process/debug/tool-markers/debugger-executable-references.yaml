defaults:
  platforms:
  - linux
  - macos
  - windows
traits:
- id: x64dbg-executable-name-reference
  desc: x64dbg or x32dbg executable name reference
  crit: notable
  conf: 0.9
  for:
  - pe
  if:
    type: text
    regex: (?i)x(32|64)dbg\.exe
  not:
  - regex: (?i)[\\/][^\r\n]{0,200}\bx(32|64)dbg\.exe\b
  unless:
  - id: well-known/tool/reverse-engineering/x64dbg/
- id: ollydbg-executable-name-reference
  desc: OllyDbg executable name reference
  crit: notable
  conf: 0.9
  for:
  - pe
  if:
    type: text
    regex: (?i)olly(dbg|ice)\.exe
  downgrade:
    any:
    - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
  unless:
  - id: well-known/tool/reverse-engineering/ollydbg::ollydbg-executable-marker
  not:
  - regex: (?i)[\\/][^\r\n]{0,200}\bolly(dbg|ice)\.exe\b
- id: ida-executable-name-reference
  desc: IDA executable name reference
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)\b(ida(64)?|idaq(64)?)\.exe\b
  unless:
  - id: well-known/tool/reverse-engineering/frida/
  not:
  - regex: (?i)[\\/][^\r\n]{0,200}\b(ida(64)?|idaq(64)?)\.exe\b
- id: windbg-executable-name-reference
  desc: WinDbg executable name reference
  crit: notable
  conf: 0.85
  for:
  - pe
  if:
    type: text
    regex: (?i)windbg(x)?\.exe
  not:
  - regex: (?i)[\\/][^\r\n]{0,200}\bwindbg(x)?\.exe\b
  unless:
  - id: well-known/tool/reverse-engineering/windows-debugger/
  - id: well-known/tool/sysadmin/sysinternals::sysinternals-microsoft-signed-component
- id: ghidra-executable-name-reference
  desc: Ghidra executable name reference
  crit: notable
  conf: 0.85
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)\b(ghidra\.exe|ghidraRun)\b
  not:
  - substr: ghidrahacker
  - substr: unixAhomChamKawiLisuMiaoModiNewa
  unless:
  - type: text
    substr: pepperghidrahacker
  - id: well-known/tool/reverse-engineering/ghidra::ghidra-reverse-engineering-suite
  - id: well-known/tool/development/build/homebrew::source-tree
  - id: well-known/app/system/aptl/
