defaults:
  platforms:
    - unix
  for:
    - python
    - pyc
  crit: notable
  conf: 0.9
traits:
  - id: python-debugger-tool-string--radare2
    desc: Python debugger tool string (radare2)
    if:
      type: text
      word: radare2
composite_rules:
  - id: python-strace-ltrace-tool-string
    desc: Python strace or ltrace tool string
    unless:
      - id: metadata/build/pip::python-packaging-vendored-source
      - id: metadata/build/pip::python-packaging-tool-tests
      - id: metadata/build/pip::pip-wheel-installer-source
    any:
      - id: micro-behaviors/process/debug/tool-markers::python-strace-name-reference
      - id: micro-behaviors/process/debug/tool-markers::python-ltrace-name-reference
  - id: python-debugger-tool-string
    desc: Python debugger tool string
    not:
      - regex: (?i)xdebug
    unless:
      - id: metadata/build/pip::python-packaging-vendored-source
      - id: metadata/build/pip::python-packaging-tool-tests
      - id: metadata/build/pip::pip-wheel-installer-source
    any:
      - id: micro-behaviors/process/debug/tool-markers::gdb-name-reference
      - id: micro-behaviors/process/debug/tool-markers::python-debugger-tool-string--radare2
  - id: python-analysis-tool-name-set
    desc: References multiple analysis tool categories
    any:
      - id: micro-behaviors/process/debug/tool-markers::python-strace-ltrace-tool-string
      - id: micro-behaviors/process/debug/tool-markers::python-debugger-tool-string
      - id: micro-behaviors/os/application/target/security::python-packet-analysis-tool-string
    needs: 2
    unless:
      - id: well-known/app/development/calvyn-code
      - id: well-known/tool/offensive/sic-security/
