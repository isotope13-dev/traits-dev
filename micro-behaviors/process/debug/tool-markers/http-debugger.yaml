# A debugging-tool name reference, not process discovery. Matcher and scope
# preserved from process/info/name during the name-catalog audit.
defaults:
  platforms: [linux, macos, windows]
traits:
- id: http-debugger-tool-name-reference
  desc: HTTP Debugger executable name reference
  crit: notable
  conf: 0.85
  for:
  - pe
  unless:
  - id: well-known/tool/offensive/frameworks::al-khaser-benign-context
  if:
    type: text
    regex: (?i)httpdebugger(ui)?\.exe
