defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
  - id: gdb-name-reference
    desc: GDB executable path or branded reference
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(GNU[ \t]+gdb|gdbserver(\.exe)?|[/\\]gdb(\.exe)?([.\s:/\\-]|$))'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/file/catalog/identity/
      - id: metadata/build/autotools::autoconf-generated-script
      - id: metadata/build/autotools::autotools-config-basename
      - id: well-known/app/system/drivers/
      - id: well-known/dual-use/tunnel/mihomo::mihomo-comment-bundle
      # 7-Zip's file-extension association table lists `gdb` as a bare 3-letter
      # extension token among many (nsf ntf wdb db fdb gdb exe dll ...); the
      # `gdb` here is archive vocabulary, not a GDB debugger reference. Anchor
      # on the table's distinctive opening run so this stays scoped to 7-Zip.
      - type: text
        substr: "7z xz lzma ace arc arj bz tbz bz2 tbz2"

  - id: lldb-name-reference
    desc: LLDB debugger name reference
    crit: notable
    conf: 0.5
    if:
      type: text
      word: lldb

  - id: gdbserver-reference
    desc: GDB server reference in Python source
    crit: notable
    conf: 0.9
    for: [python, pyc]
    if:
      type: text
      word: gdbserver

  - id: gdb-debugger-text-marker
    desc: GDB debugger text marker
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '(?i)(GNU gdb|gdbserver|This GDB|This gdb)'

  - id: org-gnu-gdb-marker
    desc: org.gnu.gdb bundle identifier
    crit: baseline
    conf: 0.9
    if:
      type: text
      substr: org.gnu.gdb.

  - id: lldb-ptrace-text-marker
    desc: LLDB or ptrace text marker
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '(?i)(\blldb\b|LLDB_DEBUGSERVER_PATH|\bptrace_)'

  - id: lldb-debugger-ref-a
    desc: LLDB debugger context reference
    crit: baseline
    conf: 0.9
    for: [elf, macho]
    if:
      type: text
      regex: (?i)\blldb\b.{0,30}(debugger|breakpoint)

  - id: lldb-debugger-ref-b
    desc: LLDB frame or thread context reference
    crit: baseline
    conf: 0.9
    for: [elf, macho]
    if:
      type: text
      regex: (?i)\blldb\b.{0,30}(frame|thread)

  - id: lldb-python-path-query
    desc: Queries LLDB Python module path
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      substr: '["lldb", "-P"]'

composite_rules:
  - id: lldb-debugger-ref
    desc: LLDB debugger reference
    crit: baseline
    conf: 0.9
    for: [elf, macho]
    any:
      - id: lldb-debugger-ref-a
      - id: lldb-debugger-ref-b

  - id: debugger-tool-marker
    desc: Debugger tool (gdb, lldb, etc.)
    crit: baseline
    conf: 0.9
    for: [elf, macho]
    any:
      - id: micro-behaviors/dylib/library/family::gdb-debugger-ref
      - id: lldb-debugger-ref
      - id: micro-behaviors/dylib/library/family::debugger-ptrace-marker
