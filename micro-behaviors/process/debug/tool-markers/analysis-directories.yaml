defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, powershell, pe]
traits:
  - id: analysis-directory-path-reference
    desc: References the C:\analysis directory
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: C:\analysis
  - id: sandbox-directory-path-reference
    desc: References the C:\sandbox directory
    crit: notable
    conf: 0.6
    if:
      type: text
      # Intel IPP objects compiled into OpenCV record the builder checkout
      # C:\sandbox\eplankin\libraries.performance.ipp.base. The optional tail
      # is part of the match so not: can drop that build path and still keep
      # a bare C:\sandbox reference.
      regex: 'C:\\sandbox(\\eplankin\\libraries\.performance\.ipp\.base)?'
      not:
        - regex: 'C:\\sandbox\\eplankin\\libraries\.performance\.ipp\.base'
    unless:
      - id: metadata/package/testing/
