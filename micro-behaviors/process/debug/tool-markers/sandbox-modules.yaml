traits:
- platforms:
  - windows
  - unix
  id: sandboxie-dll-name-reference
  desc: Sandboxie instrumentation DLL name reference
  crit: notable
  conf: 0.9
  for:
  - pe
  - dll
  - csharp
  if:
    type: text
    substr: SbieDll.dll
- platforms:
  - windows
  id: sandbox-instrumentation-module-name-reference
  desc: References sandbox instrumentation module names
  crit: notable
  conf: 0.95
  for:
  - pe
  - dll
  if:
    type: text
    regex: (?i)\b(sbiedll|cw_sandbox|wpespy)\b
  unless:
  - id: well-known/app/utility/siw::siw-family-identity
  - id: well-known/tool/sysadmin/sandboxie::sandboxie-known-signed-context
  - id: well-known/tool/sysadmin/sandboxie::sandboxie-lowlevel-pdb
  - id: well-known/app/system/iobit::iobit-component-context
  - id: well-known/tool/offensive/frameworks::al-khaser-benign-context
