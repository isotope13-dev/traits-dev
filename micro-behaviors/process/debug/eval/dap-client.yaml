# Debug Adapter Protocol (DAP) "evaluate" requests issued by a JS/TS
# extension-host client.
#
# `session.customRequest("evaluate", {expression, frameId, context})` is the
# exact call VS Code's own Variables/Watch/Debug Console panels use to run an
# expression inside the paused debuggee. Any extension that adds hover
# tooltips, data viewers, or custom inspectors for a debugger reaches for the
# same API. Neutral capability: it proves the extension can run debuggee-side
# code through the debugger the user already attached, not that it does
# anything hostile — intent belongs to composites that add exfiltration or
# persistence legs.
defaults:
  platforms: [windows, macos, linux]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
  mbc: C0049

traits:
  - id: dap-evaluate-request
    desc: DAP evaluate request runs code in debuggee
    if:
      type: text
      regex: 'customRequest\(\s*["'']evaluate["'']'
