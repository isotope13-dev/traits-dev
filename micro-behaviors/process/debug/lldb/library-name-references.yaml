---
defaults:
  crit: baseline
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - shell
  - python
  - c
  - cpp
  - rust
  - go
  - javascript
traits:
- id: lldb-server-ref
  desc: LLDB server marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  - macho
  if:
    type: text
    regex: "(?i)lldb-server"
- id: lldb-argdumper-ref
  desc: LLDB argdumper marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  - macho
  if:
    type: text
    regex: "(?i)lldb-argdumper"
- id: lldb-sbdebugger-ref
  desc: LLDB SBDebugger API marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  - macho
  if:
    type: text
    regex: "(?i)SBDebugger"
- id: lldb-sbtarget-ref
  desc: LLDB SBTarget API marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  - macho
  if:
    type: text
    regex: "(?i)SBTarget"
- id: lldb-sbprocess-ref
  desc: LLDB SBProcess API marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  - macho
  if:
    type: text
    regex: "(?i)SBProcess"
- id: lldb-sbbreakpoint-ref
  desc: LLDB SBBreakpoint API marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  - macho
  if:
    type: text
    regex: "(?i)SBBreakpoint"
- id: lldb-sbframe-ref
  desc: LLDB SBFrame API marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  - macho
  if:
    type: text
    regex: "(?i)SBFrame"
- id: lldb-module-plugin-ref
  desc: LLDB module/plugin marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  - macho
  if:
    type: text
    regex: "(?i)\\bLLDB\\b.{0,20}(module|plugin)"
