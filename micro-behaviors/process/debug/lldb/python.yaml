# LLDB Python scripting APIs used to attach, break, and patch process state.
defaults:
  platforms: [unix]
  for: [python]
  crit: notable
  conf: 0.93

traits:
  - id: attach-by-process-name
    desc: LLDB attach by process name
    if:
      type: text
      substr: AttachToProcessWithName

  - id: breakpoint-by-symbol-name
    desc: LLDB breakpoint by symbol name
    if:
      type: text
      substr: BreakpointCreateByName

  - id: set-register-cstring
    desc: LLDB register value patch
    if:
      type: text
      substr: SetValueFromCString
