defaults:
  platforms: [windows]
  for: [c]
traits:
  - id: hardware-breakpoint-clearing-before-text
    desc: Text describes hardware-breakpoint clearing
    crit: notable
    conf: 0.97
    size_min: 500
    if:
      type: text
      regex: '(?i)(clear\w*|remov\w*|reset\w*|zero\w*).{0,80}hardware breakpoints'
