defaults:
  platforms: [linux, macos]
  for: [scripts, binaries]
traits:
- id: ptrace-traceme
  desc: PTRACE_TRACEME constant
  crit: notable
  conf: 0.7
  if:
    type: string_literal
    substr: PTRACE_TRACEME
  unless:
  # pwntools ships syscall tables and shellcraft templates as reference data.
  - id: well-known/tool/offensive/pwntools::pwntools-distribution
  - id: well-known/app/utility/cmdchamp/
  - id: metadata/file/format/source-header::linux-ptrace-system-header
  - id: metadata/build/generated::generated-attack-map-context
- id: pt-deny-attach
  desc: PT_DENY_ATTACH constant
  crit: notable
  conf: 0.7
  if:
    type: string_literal
    substr: PT_DENY_ATTACH
  unless:
  - id: well-known/app/ai/coding-agent/localcode::localcode-ai-coding-assistant
  - id: well-known/app/ai/coding-agent/localcode::debugger-hardening-entrypoint
  - id: well-known/lib/crypto/neverbleed/
  platforms: [macos]
- id: arm64-pt-deny-attach-argument-sequence
  desc: AArch64 setup uses Darwin deny-attach request
  crit: component
  conf: 0.99
  platforms: [macos]
  for: [macho]
  arch: [aarch64]
  if:
    type: hex
    section: text
    pattern: "e0 03 80 52 01 00 80 52 02 00 80 d2 03 00 80 52 ?? ?? ?? ?? 1f 04 00 31 40 4d 00 54"
composite_rules:
- id: arm64-pt-deny-attach-call
  desc: Calls ptrace with Darwin's PT_DENY_ATTACH request
  crit: suspicious
  conf: 0.99
  attack: T1622
  mbc: B0001.m01
  platforms: [macos]
  for: [macho]
  all:
    - id: arm64-pt-deny-attach-argument-sequence
    - id: micro-behaviors/os/syscall/invoke::ptrace-import
- id: tracing-request-constants
  desc: References self-tracing or deny-attach constant
  crit: notable
  conf: 0.8
  any:
  - id: micro-behaviors/process/debug/control::ptrace-traceme
  - id: micro-behaviors/process/debug/control::pt-deny-attach
  unless:
  - id: metadata/signature/verified/platform::apple
  - id: metadata/file/format/source-header::linux-ptrace-system-header
