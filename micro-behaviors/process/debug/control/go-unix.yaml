defaults:
  platforms: [linux]
  for: [go]

traits:
  - id: go-sys-ptrace-constant
    desc: Go source references SYS_PTRACE
    crit: notable
    mbc: B0001.m01
    if:
      type: text
      substr: SYS_PTRACE
    unless:
      - id: metadata/lang/generated::ccgo-libc-generated-banner
      - id: well-known/app/infrastructure/docker::source-tree
      - id: well-known/app/infrastructure/docker::docker-source-archive-context

  - id: go-ptrace-traceme-constant
    desc: Go source references the PTRACE_TRACEME request
    crit: notable
    mbc: B0001.m01
    if:
      type: text
      substr: PTRACE_TRACEME
    unless:
      - id: metadata/lang/generated::ccgo-libc-generated-banner

composite_rules:
  - id: go-raw-ptrace-traceme-control
    desc: Go invokes ptrace with PTRACE_TRACEME
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/syscall/invoke::go-syscall-wrapper-call
      - id: go-sys-ptrace-constant
      - id: go-ptrace-traceme-constant
