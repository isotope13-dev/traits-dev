defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  conf: 0.92

composite_rules:
  - id: debugger-remote-memory-api-profile
    crit: suspicious
    desc: Debugger and remote-memory API references
    conf: 0.99
    all:
      - id: micro-behaviors/process/debug/control::debugger-control-api-cluster
      - id: micro-behaviors/mem/combined::remote-process-memory-api-cluster
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
    unless:
      - id: metadata/lang/upstream::windows-system-implementer-dll
      - id: well-known/app/system/microsoft/platform::microsoft-signed-system-component-context
      - id: well-known/lib/runtime/scripted/node-runtime::windows-runtime-identity
      - id: well-known/game/cheat::inventory-changer-blackbone-context
      - id: well-known/app/system/reactos::version-resource-component
      - id: well-known/tool/detection/al-khaser::al-khaser-build-helper-context
      - id: well-known/lib/native/lief::node-lief-native-addon-context
      - id: well-known/lib/platform/vanara::vanara-binding-assembly
  - id: debugger-remote-memory-process-apis
    crit: suspicious
    desc: Debugger memory and process API references
    conf: 0.98
    all:
      - id: micro-behaviors/process/debug/control::debugger-control-api-cluster
      - id: micro-behaviors/mem/combined::remote-process-memory-api-cluster
      - id: metadata/binary/symbols/name/process::create-process-a
    any:
      - id: micro-behaviors/os/handler/open::shell-execute-ex
      - id: metadata/binary/symbols/name/process::create-process-w
    unless:
      - id: metadata/lang/upstream::windows-system-implementer-dll
      - id: well-known/app/system/microsoft/platform::microsoft-signed-system-component-context
      - id: well-known/lib/runtime/scripted/node-runtime::windows-runtime-identity
      - id: well-known/app/system/reactos::version-resource-component
