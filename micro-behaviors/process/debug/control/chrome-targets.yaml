defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: chrome-debugger-get-targets-call
    desc: Enumerates Chrome debugger targets
    if:
      # Large browser bundles can exceed the structured call-fact budget.
      type: text
      regex: '\b(chrome|chromeApi)\.debugger\.getTargets\s*\('
