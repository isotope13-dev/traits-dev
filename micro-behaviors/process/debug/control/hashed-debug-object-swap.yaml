defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Reading and replacing the calling thread's debug object (TEB
  # DbgSsReserved) around a process-creation call decides which debug object
  # a child created with DEBUG_PROCESS is attached to, or detaches it again.
  # Here all three APIs are resolved by CRC32 digest instead of imported,
  # which debuggers and crash handlers have no reason to do.
  - id: crc32-hashed-debug-object-swap-process-create
    desc: Hashed debug-object swap around process creation
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/api-resolution/digest-export/targets::crc32-dbgui-get-thread-debug-object
      - id: micro-behaviors/os/api-resolution/digest-export/targets::crc32-dbgui-set-thread-debug-object
    any:
      - id: micro-behaviors/os/api-resolution/digest-export/targets::crc32-create-process-internal-w
      - id: micro-behaviors/os/api-resolution/digest-export/targets::crc32-nt-create-user-process
