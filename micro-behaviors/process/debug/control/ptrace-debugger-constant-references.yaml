---
defaults:
  crit: baseline
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - shell
  - python
  - c
  - cpp
  - rust
  - go
  - javascript
traits:
- id: debugger-ptrace-marker-a
  desc: Debugger ptrace usage marker A
  crit: baseline
  conf: 0.7
  for:
  - elf
  - macho
  if:
    type: text
    regex: PTRACE_(ATTACH|DETACH|CONT|PEEKDATA)
- id: debugger-ptrace-marker-b
  desc: Debugger ptrace usage marker B
  crit: baseline
  conf: 0.7
  for:
  - elf
  - macho
  if:
    type: text
    regex: PTRACE_(POKEDATA|SINGLESTEP|GETREGS|SETREGS)
composite_rules:
- id: debugger-ptrace-marker
  desc: Debugger ptrace constant references
  crit: baseline
  conf: 0.7
  for:
  - elf
  - macho
  any:
  - id: micro-behaviors/process/debug/control::debugger-ptrace-marker-a
  - id: micro-behaviors/process/debug/control::debugger-ptrace-marker-b
