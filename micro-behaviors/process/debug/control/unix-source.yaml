# Pausing crash handling around a debugger-gated abort lets the attached
# developer debugger receive the signal instead of the crash reporter.
defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: component
  conf: 0.98

traits:
  - id: debugger-gated-block-source
    desc: Debugger-present conditional block
    if:
      type: text
      regex: 'if\s*\(\s*[A-Za-z_]\w*(Being)?Debugged\w*\s*\(\s*\)\s*\)'

  - id: crash-handler-disable-source
    desc: Disables a native crash handler
    if:
      type: text
      regex: '\bCrashHandler\b[^\n]{0,160}\bdisable\s*\(\s*\)'

  - id: raise-sigabrt-source
    desc: Raises SIGABRT in native source
    if:
      type: text
      regex: '\braise\s*\(\s*SIGABRT\s*\)'

  - id: crash-handler-enable-source
    desc: Enables a native crash handler
    if:
      type: text
      regex: '\bCrashHandler\b[^\n]{0,160}\benable\s*\(\s*\)'

composite_rules:
  - id: crash-handler-paused-for-debugger-sigabrt
    desc: Debugger-gated abort bypasses crash handler
    crit: notable
    conf: 0.98
    near_lines: 12
    all:
      - id: debugger-gated-block-source
      - id: crash-handler-disable-source
      - id: raise-sigabrt-source
      - id: crash-handler-enable-source
