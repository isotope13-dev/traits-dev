defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable

traits:
  - id: lnk-conhost-headless-powershell
    desc: LNK runs PowerShell via headless conhost
    conf: 0.94
    if:
      type: value
      path: lnk.arguments
      # conhost --headless starts the child without a console window; the
      # shortcut target is conhost.exe and the arguments begin with the
      # headless switch, so the executable name before it is optional.
      regex: '(?i)(^|[\s;&|])(con\^?host(\.exe)?\s+)?--headless\s+(powershell|pwsh)(\.exe)?\b'
