defaults:
  for: [javascript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: vscode-debug-powershell-runtime
    desc: Debug runtime executable names PowerShell
    platforms: [windows]
    if:
      type: text
      regex: '(?i)runtimeExecutable\s*:\s*["'']powershell(\.exe)?["'']'
