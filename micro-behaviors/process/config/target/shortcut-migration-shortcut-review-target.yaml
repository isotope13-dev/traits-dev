defaults:
  platforms: [windows]
  for: [lnk]

composite_rules:
  - id: conhost-powershell-proxy
    desc: LNK targets conhost with PowerShell arguments
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/process/config/target::lnk-conhost-target
      - id: micro-behaviors/process/argument/interpreter::powershell-in-args
