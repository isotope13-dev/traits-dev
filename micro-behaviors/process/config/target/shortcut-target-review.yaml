# Which program a Windows shortcut launches, and whether it passes arguments.
#
# Every one of these is a neutral capability: Windows itself ships
# `Windows PowerShell.lnk`, Visual Studio ships developer command prompts that
# run `cmd.exe /k vcvarsall.bat`, and Control Panel shortcuts run
# `rundll32.exe netshell.dll,StartNCW`. The interpreter or proxy binary a
# shortcut points at describes what the shortcut *does*; intent comes from the
# argument content, the window state, or the carrier that objective composites
# add on top.
defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable

traits:
- id: lnk-screensaver-target
  desc: Shortcut targets a screensaver executable
  if:
    # A `.scr` is a PE that Windows runs like any other. Genuine screensaver
    # shortcuts are rare on a modern desktop, and the extension is chosen by
    # malspam precisely because it does not read as "program" to a recipient.
    type: value
    path: lnk.target_path
    regex: (?i)\.scr$
- id: lnk-powershell-target
  desc: LNK targets PowerShell
  conf: 0.85
  if:
    type: value
    path: lnk.target_path
    regex: (?i)(^|[\\/])powershell\.exe$
- id: lnk-powershell-env-target
  desc: LNK targets PowerShell via environment variable
  conf: 0.85
  if:
    type: value
    path: lnk.environment_target
    regex: (?i)(^|[\\/])powershell\.exe$
- id: lnk-pwsh-target
  desc: LNK targets PowerShell Core (pwsh)
  conf: 0.85
  if:
    type: value
    path: lnk.target_path
    regex: (?i)(^|[\\/])pwsh\.exe$
- id: lnk-cmd-target
  desc: LNK targets cmd.exe
  conf: 0.7
  if:
    type: value
    path: lnk.target_path
    regex: (?i)(^|[\\/])cmd\.exe$
- id: lnk-wscript-target
  desc: LNK targets Windows Script Host (wscript)
  conf: 0.85
  if:
    type: value
    path: lnk.target_path
    regex: (?i)(^|[\\/])wscript\.exe\.?$
- id: lnk-cscript-target
  desc: LNK targets console script host (cscript)
  conf: 0.85
  if:
    type: value
    path: lnk.target_path
    regex: (?i)(^|[\\/])cscript\.exe$
- id: lnk-mshta-target
  desc: LNK targets mshta.exe
  conf: 0.9
  if:
    type: value
    path: lnk.target_path
    regex: (?i)(^|[\\/])mshta\.exe$
- id: lnk-regsvr32-target
  desc: LNK targets regsvr32.exe
  conf: 0.85
  if:
    type: value
    path: lnk.target_path
    regex: (?i)(^|[\\/])regsvr32\.exe$
- id: lnk-rundll32-target
  desc: LNK targets rundll32.exe
  conf: 0.85
  if:
    type: value
    path: lnk.target_path
    regex: (?i)(^|[\\/])rundll32\.exe$
- id: lnk-certutil-target
  desc: LNK targets certutil.exe
  conf: 0.85
  if:
    type: value
    path: lnk.target_path
    regex: (?i)(^|[\\/])certutil\.exe$
- id: lnk-conhost-target
  desc: LNK targets conhost.exe
  conf: 0.85
  if:
    type: value
    path: lnk.target_path
    regex: (?i)(^|[\\/])conhost\.exe$
- id: lnk-extensionless-target
  desc: Shortcut target has no file extension
  conf: 0.9
  if:
    # The final path component contains neither a separator nor a dot, so
    # ShellExecute cannot resolve a registered file type for it. Extension
    # hiding alone is neutral (folders and extensionless documents match),
    # but combined with Temp staging and traversal it marks a payload
    # launcher that evades extension-based detection.
    type: value
    path: lnk.target_path
    regex: (?i)(^|[\\/])[^\\/\.]+$
composite_rules:
- id: lnk-powershell-family
  desc: LNK targets a PowerShell interpreter
  crit: notable
  conf: 0.85
  any:
  - id: lnk-powershell-target
  - id: lnk-powershell-env-target
  - id: lnk-pwsh-target
- id: lnk-script-host-target
  desc: LNK targets a Windows Script Host
  crit: notable
  conf: 0.85
  any:
  - id: lnk-wscript-target
  - id: lnk-cscript-target
- id: lnk-lolbin-target
  desc: LNK targets a Windows proxy binary
  crit: notable
  conf: 0.9
  any:
  - id: lnk-mshta-target
  - id: lnk-regsvr32-target
  - id: lnk-rundll32-target
- id: lnk-cmd-with-args
  desc: LNK targets cmd.exe with arguments
  crit: notable
  conf: 0.8
  all:
  - id: lnk-cmd-target
  - id: micro-behaviors/process/config/launch::lnk-has-arguments
- id: lnk-interpreter-target-with-arguments
  desc: LNK interpreter target with arguments
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/process/config/launch::lnk-has-arguments
  any:
  - id: lnk-powershell-family
  - id: lnk-cmd-target
  - id: lnk-script-host-target
- id: lnk-interpreter-or-lolbin-target
  desc: LNK targets an interpreter or proxy binary
  crit: notable
  conf: 0.9
  any:
  - id: lnk-script-host-target
  - id: lnk-lolbin-target
  - id: lnk-certutil-target

