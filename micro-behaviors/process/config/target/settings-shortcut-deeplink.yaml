# What a Windows Settings shortcut (.SettingContent-ms) runs. Explorer hands
# the <DeepLink> field to the shell as a command line (CVE-2018-8414; later
# Windows builds no longer do). Windows' own entries open control.exe,
# ms-settings: pages or shell folders. A script interpreter, a proxy binary, a
# remote location or a URL handler there is the payload launch. filefacts
# joins the field's text across XML comments, so a comment after every
# character still reads as one command.
defaults:
  platforms: [windows]
  for: [xml]
  crit: notable
  conf: 0.9
  attack: T1204.002

traits:
  - id: deeplink-powershell
    desc: Settings DeepLink runs PowerShell
    attack: T1059.001
    if:
      type: value
      path: PCSettings.SearchableContent.ApplicationInformation.DeepLink
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\b'

  - id: deeplink-cmd
    desc: Settings DeepLink runs a cmd.exe command
    attack: T1059.003
    if:
      type: value
      path: PCSettings.SearchableContent.ApplicationInformation.DeepLink
      regex: '(?i)\bcmd(\.exe)?["\s]+/[ckr]\b'

  - id: deeplink-script-host
    desc: Settings DeepLink runs Windows Script Host
    attack: T1059.005
    if:
      type: value
      path: PCSettings.SearchableContent.ApplicationInformation.DeepLink
      regex: '(?i)\b[wc]script(\.exe)?\b'

  - id: deeplink-mshta
    desc: Settings DeepLink runs mshta
    attack: T1218.005
    if:
      type: value
      path: PCSettings.SearchableContent.ApplicationInformation.DeepLink
      regex: '(?i)\bmshta(\.exe)?\b'

  # rundll32 url.dll,FileProtocolHandler or OpenURL hands its argument to
  # ShellExecute: a proxy that opens a URL or runs a program.
  - id: deeplink-url-dll-handler
    desc: Settings DeepLink runs url.dll handler
    attack: T1218.011
    if:
      type: value
      path: PCSettings.SearchableContent.ApplicationInformation.DeepLink
      regex: '(?i)\burl\.dll\s*,\s*(FileProtocolHandler|OpenURL)\b'

  - id: deeplink-proxy-binary
    desc: Settings DeepLink runs a proxy binary
    attack: T1218
    if:
      type: value
      path: PCSettings.SearchableContent.ApplicationInformation.DeepLink
      regex: '(?i)\b(certutil|bitsadmin|regsvr32|msiexec)(\.exe)?\b'

  - id: deeplink-web-url
    desc: Settings DeepLink names a web URL
    attack: T1105
    if:
      type: value
      path: PCSettings.SearchableContent.ApplicationInformation.DeepLink
      regex: '(?i)\bhttps?://'

  - id: deeplink-unc-path
    desc: Settings DeepLink names a UNC path
    attack: T1105
    if:
      type: value
      path: PCSettings.SearchableContent.ApplicationInformation.DeepLink
      regex: '(^|[\s"''])\\\\[^\\\s"'']{2,64}\\'

composite_rules:
  - id: deeplink-launches-payload
    desc: Settings DeepLink launches a payload
    any:
      - id: deeplink-powershell
      - id: deeplink-cmd
      - id: deeplink-script-host
      - id: deeplink-mshta
      - id: deeplink-url-dll-handler
      - id: deeplink-proxy-binary
      - id: deeplink-web-url
      - id: deeplink-unc-path
