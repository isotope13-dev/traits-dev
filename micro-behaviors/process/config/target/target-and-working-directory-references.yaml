---
defaults:
  for:
  - c
  - cpp
  platforms:
  - windows
  crit: notable
  conf: 0.88
traits:
- id: set-working-directory-method-reference
  desc: SetWorkingDirectory symbol reference
  crit: notable
  conf: 0.88
  if:
    type: symbol
    substr: ".SetWorkingDirectory"
- id: targetpath-name-repeated
  desc: TargetPath member name occurs twice
  for:
  - pe
  - dll
  - csharp
  conf: 0.8
  count_min: 2
  if:
    type: text
    substr: TargetPath
- id: workingdirectory-name-repeated
  desc: WorkingDirectory member name occurs twice
  for:
  - pe
  - dll
  - csharp
  conf: 0.8
  count_min: 2
  if:
    type: text
    substr: WorkingDirectory
