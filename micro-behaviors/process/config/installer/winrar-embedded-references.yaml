defaults:
  platforms: [windows]
  for: [oledoc]

traits:
  - id: multiple-setup-labels-text
    desc: Multiple Setup= text occurrences
    crit: component
    conf: 0.9
    count_min: 2
    if:
      type: text
      substr: Setup=
composite_rules:
  - id: winrar-sfx-silent-overwrite-setup-clues
    desc: WinRAR silent overwrite and setup clues
    crit: notable
    conf: 0.97
    all:
      - id: well-known/tool/sysadmin/winrar-sfx::embedded-winrar-sfx-package
      - id: micro-behaviors/process/config/installer::multiple-setup-labels-text
      - id: micro-behaviors/data/archive/extract/options::silent-one-option-text
      - id: micro-behaviors/data/archive/extract/destination::overwrite-one-option-text
