defaults:
  platforms: [windows]
  for: [pe]

traits:
- id: sfx-comment-setup-decoy-ascii
  desc: SFX Setup opens media decoy
  crit: notable
  conf: 0.92
  attack: T1204.002
  # The script lives in the SFX stub's comment block (PE carrier) and in
  # bare extracted fragments alike.
  for: [pe, data]
  if:
    # Single-byte counterpart of the UTF-16 decoy observation: an SFX
    # comment line whose Setup target is a picture or document opens in
    # its associated viewer after extraction, so it works as a lure
    # while the real payload runs from another directive.
    type: raw
    regex: '(?im)^Setup[ \t]*=[ \t]*"?[^\r\n]{1,80}\.(jpe?g|png|gif|bmp|txt|pdf)"?[ \t]*\r?(\n|$)'
