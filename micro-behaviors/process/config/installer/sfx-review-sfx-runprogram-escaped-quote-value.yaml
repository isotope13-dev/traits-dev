defaults:
  platforms: [windows]
  for: [pe]

traits:
- id: sfx-runprogram-escaped-quote-value
  desc: SFX RunProgram value is an escaped path
  crit: notable
  conf: 0.94
  attack: T1204.002
  if:
    # Anchored on the CRLF that ends the previous directive, so this is the
    # start of a config line rather than the token appearing inside some
    # unrelated string.
    type: raw
    regex: '\r\nRunProgram\s*=\s*"\\"'
