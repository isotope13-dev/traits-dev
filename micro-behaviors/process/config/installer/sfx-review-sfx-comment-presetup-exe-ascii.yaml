defaults:
  platforms: [windows]
  for: [pe]

traits:
- id: sfx-comment-presetup-exe-ascii
  desc: SFX comment names presetup EXE
  crit: notable
  conf: 0.93
  attack: T1204.002
  # The script lives in the SFX stub's comment block (PE carrier) and in
  # bare extracted fragments alike.
  for: [pe, data]
  if:
    # Single-byte counterpart of the UTF-16 comment observation for bare
    # SFX comment fragments: a Presetup line naming an executable runs
    # before extraction completes, hidden when the script is silent.
    type: raw
    regex: '(?im)^Presetup[ \t]*=[ \t]*"?[^\r\n]{0,80}\.exe"?[ \t]*\r?(\n|$)'
