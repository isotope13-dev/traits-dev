defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: sfx-silent-presetup-overwrite
  desc: SFX silent presetup and overwrite directives
  crit: notable
  conf: 0.94
  attack: T1204.002
  for: [pe, static-lib, text]
  all:
    - id: micro-behaviors/process/config/installer::sfx-presetup-executable
    - id: micro-behaviors/data/archive/extract/options::sfx-silent-install
    - id: micro-behaviors/data/archive/extract/destination::sfx-overwrite-enabled

