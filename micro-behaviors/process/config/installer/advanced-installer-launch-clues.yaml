---
defaults:
  platforms:
  - windows
  for:
  - oledoc
  - msi
  conf: 0.92
  crit: notable
composite_rules:
- id: advanced-installer-embedded-exe-launch
  desc: Advanced Installer EXE launch configuration
  conf: 0.97
  all:
  - id: micro-behaviors/process/config/installer::advanced-installer-launchapp-toggle
  - id: micro-behaviors/process/argument/file::advanced-installer-app-file-exe
- id: advanced-installer-elevated-embedded-exe-launch
  desc: Elevated installer launch configuration
  conf: 0.98
  all:
  - id: micro-behaviors/process/config/installer::advanced-installer-embedded-exe-launch
  - id: micro-behaviors/process/config/installer::advanced-installer-runasadmin-exe
- id: advanced-installer-luajit-launch
  desc: Advanced Installer LuaJIT launch configuration
  conf: 0.98
  all:
  - id: micro-behaviors/process/config/installer::advanced-installer-launchapp-toggle
  - id: micro-behaviors/fs/path/application/interpreter::advanced-installer-luajit-app-file
  - id: micro-behaviors/process/argument/file::advanced-installer-luajit-script-args
