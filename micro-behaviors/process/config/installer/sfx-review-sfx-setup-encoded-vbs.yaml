defaults:
  platforms: [windows]
  for: [pe]

traits:
- id: sfx-setup-encoded-vbs
  desc: SFX Setup names encoded VBScript
  crit: notable
  conf: 0.96
  attack: T1204.002,T1059.005
  if:
    type: text
    # .vbe is the encoded form. A plain .vbs setup script is an ordinary
    # installer entry, so it does not belong on this matcher.
    regex: '(?i)\bSetup=[^\r\n]{1,120}\.vbe\b'
