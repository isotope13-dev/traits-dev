defaults:
  platforms: [windows]
  for: [pe]
  attack: T1204.002

traits:
- id: sfx-comment-setup-decoy-utf16
  desc: UTF-16 SFX Setup opens media decoy
  crit: notable
  conf: 0.92
  # A bare SFX comment fragment (for example the RAR Starter script) can
  # name a picture or document in Setup while the real payload runs from
  # Presetup. The Setup target opens in its associated viewer after
  # extraction, so it works as a lure, not as an installer program.
  # Lowercase extensions only; an uppercase-decoy variant is untested.
  for: [data]
  if:
    type: hex
    pattern: "53 00 65 00 74 00 75 00 70 00 3D 00 [0-64] 2E 00 (6A 00 70 00 67 00 | 6A 00 70 00 65 00 67 00 | 70 00 6E 00 67 00 | 67 00 69 00 66 00 | 62 00 6D 00 70 00 | 74 00 78 00 74 00 | 70 00 64 00 66 00) 0D 00 0A 00"

  # The same UTF-16 script inside a WinRAR SFX stub: the archive (carrying
  # the comment block) follows the mapped sections, so the overlay pins the
  # search space for the binary carrier.
- id: sfx-comment-setup-decoy-utf16-overlay
  desc: UTF-16 SFX Setup decoy in overlay
  crit: notable
  conf: 0.92
  if:
    type: hex
    pattern: "53 00 65 00 74 00 75 00 70 00 3D 00 [0-64] 2E 00 (6A 00 70 00 67 00 | 6A 00 70 00 65 00 67 00 | 70 00 6E 00 67 00 | 67 00 69 00 66 00 | 62 00 6D 00 70 00 | 74 00 78 00 74 00 | 70 00 64 00 66 00) 0D 00 0A 00"
    section: overlay
