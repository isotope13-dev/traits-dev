defaults:
  platforms: [windows]
  for: [pe]

traits:
- id: sfx-setup-exe-directive
  desc: SFX Setup directive runs an EXE program
  crit: notable
  conf: 0.93
  # Same carrier rule as the MSI directive: the script lives in the SFX stub's
  # comment block or in an extracted fragment. A Setup line naming an EXE runs
  # it after extraction. Combined with a silent overwrite, TempMode and a
  # document Setup line, it is the EXE-behind-a-decoy delivery shape.
  for: [pe, data]
  if:
    type: raw
    regex: '(?im)^Setup[ \t]*=[ \t]*"?[^\r\n]{1,80}\.exe"?[ \t]*\r?(\n|$)'
