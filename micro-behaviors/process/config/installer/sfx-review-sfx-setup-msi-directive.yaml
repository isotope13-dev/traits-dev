defaults:
  platforms: [windows]
  for: [pe]

traits:
- id: sfx-setup-installer-msi-directive
  desc: SFX Setup directive runs an MSI installer
  crit: notable
  conf: 0.93
  # The script lives in the SFX stub's comment block (PE carrier) and in
  # bare extracted fragments alike. A Setup line naming an installer package
  # runs it after extraction; paired with a document Setup line and a silent
  # configuration it is the installer-behind-a-decoy delivery shape.
  for: [pe, data]
  if:
    type: raw
    regex: '(?im)^Setup[ \t]*=[ \t]*"?[^\r\n]{1,80}\.msi"?[ \t]*\r?(\n|$)'
