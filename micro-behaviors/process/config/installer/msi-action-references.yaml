defaults:
  platforms: [windows]
  for: [oledoc, msi]
  crit: baseline
  conf: 0.9
traits:
  - id: msi-runtime-launch-action
    desc: MSI LaunchApp or LaunchFile action text
    crit: notable
    conf: 0.98
    if:
      type: raw
      regex: '(?is)LaunchApp|CustomAction.{0,512}LaunchFile'

  - id: msi-customaction-launchfile-reference
    desc: MSI CustomAction table has LaunchFile
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)CustomAction.{0,512}LaunchFile'

  - id: msi-launch-installed-application-action
    desc: MSI installed-application launch setting
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)LaunchInstalledApplication|LAUNCHAPP\s*=\s*["'']?1'
