defaults:
  platforms: [windows]
  for: [python]
traits:
  - id: python-detached-process-flag-combination
    desc: Python combines DETACHED_PROCESS flags
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((binary_operator
          left: (attribute object: (identifier) @module
            attribute: (identifier) @flag)
          operator: "|") @combination
          (#eq? @module "subprocess") (#eq? @flag "DETACHED_PROCESS"))
