defaults:
  for: [javascript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: vscode-debug-hidden-window-args
    desc: Debug runtime arguments specify hidden window
    platforms: [windows]
    if:
      type: text
      regex: '(?i)runtimeArgs\s*:\s*\[[^\]]{0,160}["'']-w["'']\s*,\s*["'']hidden["'']'
