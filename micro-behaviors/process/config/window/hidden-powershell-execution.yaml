defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
  - id: hidden-powershell-execution
    desc: Encoded command and hidden process options
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/process/argument/interpreter::encodedcommand-bypass
    any:
      - id: metadata/lang/source/syntax/call/construction::powershell-process-object
      - id: micro-behaviors/process/config/window::powershell-create-no-window-config
      - id: micro-behaviors/process/config/window::windowstyle-hidden
    needs: 2
