defaults:
  crit: notable
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-processstartinfo-hidden-window
    desc: WindowStyle Hidden configuration text
    conf: 0.95
    # PS2EXE keeps the same assignment. The enum form is
    # ProcessWindowStyle]::Hidden; the string form is WindowStyle = "Hidden".
    for: [powershell, pe]
    if:
      type: text
      regex: '(?i)(\.WindowStyle\s*=\s*["'']Hidden["'']|ProcessWindowStyle\]::Hidden)'
  - id: powershell-processstartinfo-obfuscated-window-setting
    desc: Obfuscated ProcessStartInfo window setting
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.(WindowStyle|CreateNoWindow)\s*=\s*(\(\s*\(|[^;\r\n]{0,200}-bxor\b)'
composite_rules:
  - id: powershell-processstartinfo-concealed-window
    desc: Concealed or obfuscated ProcessStartInfo window configuration
    conf: 0.94
    any:
      - id: powershell-processstartinfo-hidden-window
      - id: powershell-processstartinfo-no-window
      - id: powershell-create-no-window-config
      - id: powershell-processstartinfo-obfuscated-window-setting

