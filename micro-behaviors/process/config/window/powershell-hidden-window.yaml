defaults:
  crit: notable
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-processstartinfo-hidden-window
    desc: WindowStyle Hidden configuration text
    conf: 0.95
    # PS2EXE keeps the same assignment. The enum form is
    # ProcessWindowStyle]::Hidden; the string form is WindowStyle = "Hidden".
    for: [powershell, pe]
    if:
      type: text
      regex: '(?i)(\.WindowStyle\s*=\s*["'']Hidden["'']|ProcessWindowStyle\]::Hidden)'

