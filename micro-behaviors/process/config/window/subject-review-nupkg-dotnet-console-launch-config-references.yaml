defaults:
  platforms: [windows]
composite_rules:
  - id: dotnet-console-launch-config-references
    for: [pe, dll]
    desc: .NET console-window configuration references
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/process/config/window::dotnet-console-window-option-reference
      - id: metadata/binary/symbols/name/process::dotnet-processstartinfo-name
    any:
      - id: micro-behaviors/process/config/launch::use-shell-execute-property
      - id: metadata/import/framework::diagnostics-namespace-dotnet
      - id: micro-behaviors/process/config/launch::dotnet-process-start-and-config-references
