# A WSH Run call (window style 0) whose command line starts cmd to open a
# .lnk shortcut. Starting a shortcut through a hidden console launches
# whatever target and arguments the shortcut carries, without a visible
# window and without naming that target in the script.
defaults:
  for: [javascript, vbs, xml, html]
  platforms: [windows]
  crit: notable
  conf: 0.92

traits:
  - id: wsh-hidden-cmd-run-shortcut
    desc: Hidden WSH Run opens shortcut via cmd
    if:
      type: text
      regex: '(?i)\.Run\s*\(?\s*["'']cmd(\.exe)?\s+/[ck]\b[^"''\r\n]{0,400}\.lnk["'']\s*,\s*0\b'
