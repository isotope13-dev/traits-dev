defaults:
  platforms:
    - windows
  crit: notable
traits:
  - id: wsh-run-hidden-flags
    desc: WSH reference near hidden Run flags
    conf: 0.95
    if:
      type: text
      regex: (?i)WScript\.Shell.{0,160}\.Run\b.{0,80},\s*0\s*,\s*(false|true)\s*\)?
    for:
      - javascript
      - vbs
      - html
      - text
