# Go source references a hidden-window setting or flag; a launch is not required.
defaults:
  platforms: [windows, unix]
  for: [go]
  attack: T1564.003

traits:
  - id: go-create-no-window
    desc: Go hidden-window setting or flag
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'HideWindow:\s*true|CREATE_NO_WINDOW'
