defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-windows-env-cmd-path
    desc: Shortcut names system Command Prompt
    crit: component
    if:
      type: value
      path: lnk.environment_target
      regex: '(?i)^%(windir|systemroot)%\\sys(tem32|wow64)\\cmd\.exe$'

  - id: lnk-windows-absolute-cmd-path
    desc: Shortcut names system Command Prompt
    crit: component
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)^[a-z]:\\windows\\sys(tem32|wow64)\\cmd\.exe$'

  - id: lnk-windows-env-powershell-path
    desc: Shortcut names system Windows PowerShell
    crit: component
    if:
      type: value
      path: lnk.environment_target
      regex: '(?i)^%(windir|systemroot)%\\sys(tem32|wow64)\\windowspowershell\\v1\.0\\powershell\.exe$'

  - id: lnk-windows-absolute-powershell-path
    desc: Shortcut names system Windows PowerShell
    crit: component
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)^[a-z]:\\windows\\sys(tem32|wow64)\\windowspowershell\\v1\.0\\powershell\.exe$'

composite_rules:
  - id: lnk-windows-shell-without-arguments
    desc: Shortcut names a Windows shell and supplies no arguments
    crit: notable
    conf: 0.98
    any:
      - id: lnk-windows-env-cmd-path
      - id: lnk-windows-absolute-cmd-path
      - id: lnk-windows-env-powershell-path
      - id: lnk-windows-absolute-powershell-path
    unless:
      - id: micro-behaviors/process/config/launch::lnk-has-arguments
