defaults:
  platforms: [windows, unix]
traits:
  - id: use-shell-execute-property
    desc: References the .NET shell-launch setting
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(?i)(set_UseShellExecute|\bUseShellExecute\s*=\s*false\b)'
    for:
      - pe
      - dll
      - csharp
