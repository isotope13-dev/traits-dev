defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript, typescript]
composite_rules:
  - id: postinstall-detached-warnings-clues
    desc: Postinstall detached and warning suppression clues
    crit: suspicious
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/process/daemonize/detach::detached-obfuscated-true
      - id: micro-behaviors/os/env/write::node-no-warnings-env
