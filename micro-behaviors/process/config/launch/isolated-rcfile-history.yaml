defaults:
  attack: T1059
  for:
    - scripts
  platforms:
    - unix
composite_rules:
  - id: isolated-rcfile-history
    desc: Isolated interactive Bash session suppresses history
    crit: exception
    all:
      - id: micro-behaviors/process/config/launch::bash-explicit-rcfile
      - id: micro-behaviors/os/env/write::histfile-dev-null
