defaults:
  platforms: [windows, unix]
composite_rules:
  - id: dotnet-process-start-and-config-references
    desc: .NET process-start and configuration references
    crit: notable
    conf: 0.8
    for:
      - pe
    all:
      - id: metadata/binary/symbols/name/process::dotnet-processstartinfo-name
      - id: micro-behaviors/process/create/subprocess/reference::dotnet-process-start-text
      - id: metadata/import/framework::diagnostics-namespace-dotnet
    downgrade:
      any:
        - id: metadata/lang/compiler/managed::dotnet-metadata
