traits:
- id: node-detached-true-option
  desc: Sets detached option to true
  crit: baseline
  conf: 0.98
  if:
    type: text
    regex: \bdetached\s*:\s*true
    exclude_comments: true
- id: node-debug-mode-false
  desc: Sets debug mode to false
  crit: baseline
  conf: 0.98
  if:
    type: text
    regex: debugMode\s*=\s*false
    exclude_comments: true
- id: node-detached-negated-debug-option
  desc: Detached option negates debug mode
  crit: baseline
  conf: 0.98
  if:
    type: text
    regex: detached\s*:\s*!\s*debugMode
    exclude_comments: true
composite_rules:
- id: node-detached-debug-options
  desc: Combines detached and debug options
  crit: baseline
  conf: 0.99
  scope: file
  near_bytes: 12000
  all:
  - id: micro-behaviors/process/config/launch::node-debug-mode-false
  - id: micro-behaviors/process/config/launch::node-detached-negated-debug-option
defaults:
  for:
  - javascript
  platforms:
  - unix
  - windows
