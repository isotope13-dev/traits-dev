defaults:
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, binaries, objectivec, lua, data, dos_com]
traits:
  - id: mirc-config-click-run-executable
    desc: mIRC click binding configures EXE command
    crit: notable
    conf: 0.97
    platforms: [windows]
    for: [text, mirc]
    if:
      type: text
      # Include mIRC path expressions such as `$mircdir $+ helper.exe`.
      # Keep the executable at the command's target, not in later arguments.
      regex: '(?im)^\[clicks\][^\[]{0,900}^\w+=//run +(\$mircdir *\$\+ *)?[^\s|]{1,48}\.exe\b'
