defaults:
  platforms: [unix, windows]
  for: [rust]
composite_rules:
  - id: build-rs-detached-process-clues
    desc: Build script detached process configuration clues
    crit: suspicious
    conf: 0.9
    scope: file
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: micro-behaviors/process/fd/stdio::rust-child-stdout-null
      - id: micro-behaviors/process/fd/stdio::rust-child-stderr-null
    any:
      - id: micro-behaviors/process/daemonize/spawn::rust-spawn-detached-unix
      - id: micro-behaviors/process/config/launch::rust-detached-process-call
      - id: micro-behaviors/process/config/launch::rust-create-no-window-call

