defaults:
  platforms: [windows]
  for: [lnk]

composite_rules:
  - id: lnk-cmd-data-or-document-path
    desc: LNK cmd references data or document path
    crit: suspicious
    conf: 0.97
    any:
      - id: micro-behaviors/process/interpreter/shell::lnk-arg-cmd-c-txt
      - id: micro-behaviors/process/interpreter/shell::lnk-arg-cmd-c-doc
