defaults:
  platforms: [windows, unix]
  for: [csharp]
  crit: notable
traits:
  - id: dotnet-process-start-info
    desc: Constructs child process launch configuration
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ProcessStartInfo$'
    unless:
      - id: well-known/game/mod::bedrockboot-source-repository

  - id: csharp-create-no-window-member
    desc: Passes CREATE_NO_WINDOW launch flag
    platforms: [windows]
    conf: 0.94
    attack: T1564.003
    if:
      type: symbol
      kind: member
      regex: '\.CREATE_NO_WINDOW$'
