defaults:
  platforms: [windows, unix]
  for: [csharp]
  crit: notable
traits:
  - id: dotnet-process-start-info
    desc: Constructs child process launch configuration
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ProcessStartInfo$'
    unless:
      - id: well-known/game/mod::bedrockboot-source-repository
