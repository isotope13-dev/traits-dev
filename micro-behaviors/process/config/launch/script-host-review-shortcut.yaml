defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-arg-cscript-batch
    desc: Shortcut arguments request cscript batch mode
    crit: notable
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: 'cscript\s+(//[Bb]|/b)\b'
  - id: lnk-arg-wscript-batch
    desc: Shortcut arguments request wscript batch mode
    crit: notable
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: 'wscript\s+(//[Bb]|/b)\b'
