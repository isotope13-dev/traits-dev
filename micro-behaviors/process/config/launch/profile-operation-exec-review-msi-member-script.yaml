defaults:
  for: [msi]
  platforms: [windows]
traits:
  - id: msi-installed-exe-with-member-argument
    desc: MSI executable and file-table argument reference
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '"\[INSTALLFOLDER\][^"\r\n]{1,48}\.EXE"\s+"\[#[^\]]{1,32}\]"'
      case_insensitive: true
