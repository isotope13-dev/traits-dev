defaults:
  crit: notable
  platforms: [unix]
  for: [python]

traits:
  - id: python-sudo-argv-list
    desc: Builds sudo/doas argv list
    conf: 0.74
    if:
      type: text
      regex: '=\s*\[\s*["''](sudo|doas)["'']\s*\]'
    unless:
      - id: micro-behaviors/os/service/user-session::python-managed-user-service-context
      - id: micro-behaviors/os/package-manager/installer-script::package-manager
