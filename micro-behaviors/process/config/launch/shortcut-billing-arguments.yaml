defaults:
  platforms: [windows]
  for: [lnk]
composite_rules:
  - id: billing-pdf-concealed-command-args
    desc: Billing PDF LNK has concealed command args
    crit: notable
    conf: 0.98
    all:
      - id: metadata/filename/document-theme::billing-wording-lnk-basename
      - id: metadata/file/extension/executable::lnk-pdf-double-extension
