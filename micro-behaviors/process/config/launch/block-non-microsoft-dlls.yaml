# The "blockdlls" child-process mitigation: only Microsoft-signed DLLs may
# load into the new process, which keeps third-party EDR hook DLLs out of it.
# Browsers set the same policy on their own sandboxed children, so the name
# alone is a launch setting, not evasion.
defaults:
  platforms: [windows]
  crit: notable

traits:
  - id: block-non-microsoft-binaries-policy
    desc: Child mitigation blocks non-Microsoft DLLs
    conf: 0.95
    for: [pe, dll, csharp, powershell]
    if:
      type: text
      word: PROCESS_CREATION_MITIGATION_POLICY_BLOCK_NON_MICROSOFT_BINARIES_ALWAYS_ON

  # Source form of the parent-process attribute; compiled managed metadata is
  # covered by process/config/parent::parent-process-attribute.
  - id: parent-process-attribute-source
    desc: Parent-process startup attribute in source
    conf: 0.94
    for: [csharp, powershell]
    if:
      type: text
      word: PROC_THREAD_ATTRIBUTE_PARENT_PROCESS
