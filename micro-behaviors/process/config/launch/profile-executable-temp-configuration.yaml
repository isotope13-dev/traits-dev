defaults:
  crit: component
  platforms: [windows]
  for: [data]
traits:
- id: spawn-executable-config
  desc: Numeric Spawn configuration field
  conf: 0.9
  size_max: 512
  if:
    type: text
    regex: (?i)Spawn=\d+
composite_rules:
- id: spawn-and-executable-config
  crit: notable
  desc: Numeric Spawn and executable-name fields
  conf: 0.95
  all:
  - id: micro-behaviors/process/config/launch::spawn-executable-config
  - id: micro-behaviors/process/config/target::alphanumeric-executable-config
