defaults:
  for: [text]
  platforms: [windows]
  crit: notable
  conf: 0.95

traits:
  - id: config-run-executable-text
    desc: Config entry names run and an executable
    if:
      type: text
      regex: '(?im)^[a-z]+=[./]{0,2}run[ \t]+[^|\r\n]{1,160}\.exe\b'

  - id: config-run-system-name-variant-text
    desc: Config run entry names utility variant
    if:
      type: text
      regex: '(?im)^[a-z]+=[./]{0,2}run +(rundll32|svchost|lsass|regsvr32)[_-]\w{0,8}\.exe\b'
