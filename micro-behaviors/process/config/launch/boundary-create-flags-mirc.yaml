defaults:
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, binaries, objectivec, lua, data, dos_com]
traits:
  - id: mirc-run-fh-option
    desc: mIRC launched executable receives /fh option
    crit: notable
    conf: 0.9
    for: [mirc, ircii]
    if:
      type: text
      regex: '(?i)\brun\b[^|\r\n]{0,60}/fh\b'

