defaults:
  platforms:
    - unix
    - windows
  for: [javascript]
  attack: T1059
traits:
  - id: silent-true
    desc: Silent execution flag (hides output)
    crit: notable
    conf: 0.85
    mbc: F0005
    if:
      type: string_literal
      regex: silent:\s*true
  # Text twin of the two atoms above for bundled/minified files, where AST
  # and string-literal facts are unavailable (2MB+ bundles emit neither):
  # a silenced output-capturing exec, call and flag within one statement.
