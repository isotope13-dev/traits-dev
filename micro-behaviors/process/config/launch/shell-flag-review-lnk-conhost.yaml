defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-forfiles-c-argument
    desc: LNK forfiles arguments use /c
    crit: notable
    conf: 0.9
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bforfiles(\.exe)?\b[^\r\n]{0,120}\s/c\b'
  - id: lnk-conhost-headless-cmd
    desc: LNK arguments specify headless conhost cmd /c
    crit: notable
    conf: 0.94
    if:
      type: value
      path: lnk.arguments
      # conhost normally arrives as the shortcut target while --headless
      # starts the argument string, so the binary name is optional here; the
      # consuming proxy composite pairs this with lnk-conhost-target.
      # conhost may be caret-escaped (con^host) and cmd may enable delayed
      # expansion (/v:on) before /c; both spellings run the same hidden
      # command proxy.
      regex: '(?i)(^|[\s;&|])(con\^?host(\.exe)?\s+)?--headless\s+cmd(\.exe)?\s+(/v:(on|off)\s+)?/c\b'
