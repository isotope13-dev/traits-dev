defaults:
  platforms: [windows]
  for: [go]
  conf: 0.9
composite_rules:
  - id: go-explorer-parent-process-creation
    desc: Go launch with Explorer parent clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/config/parent::go-parent-process-attribute
      - id: metadata/lang/source/naming/interface/execution::go-update-proc-thread-attribute-reference
      - id: micro-behaviors/process/create/subprocess/reference::go-startupinfoex-createprocess
    any:
      - id: micro-behaviors/process/info/query::go-parent-explorer-check
