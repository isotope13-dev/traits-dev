defaults:
  platforms: [windows, unix]
  for: [json]
  crit: notable
  conf: 0.92

traits:
  - id: process-adapter-type
    desc: Agent config selects process adapter
    conf: 0.95
    if:
      type: value
      path: agents.*.adapter.type
      exact: process

  - id: shell-interpreter-command
    desc: Agent config selects shell interpreter
    conf: 0.94
    if:
      type: value
      path: agents.*.adapter.config.command
      regex: '^(/(usr/)?bin/)?(ba|z|da)?sh$'

  - id: shell-command-flag
    desc: Agent config passes shell command flag
    conf: 0.94
    if:
      type: value
      path: agents.*.adapter.config.args[0]
      exact: -c

  - id: shell-command-operators
    desc: Agent config embeds shell operators
    conf: 0.93
    if:
      type: value
      path: agents.*.adapter.config.args[1]
      regex: '[\x60>&|;]'

  - id: json-command-field-unix-shell
    desc: JSON command field selects Unix shell
    conf: 0.98
    platforms: [unix]
    for: [text, data, scripts, source]
    if:
      type: text
      regex: '["'']command["'']\s*:\s*["''](/(usr/)?bin/)?(ba|da|z|k)?sh["'']'

  - id: json-command-field-windows-shell
    desc: JSON command field selects Windows shell
    conf: 0.98
    platforms: [windows]
    for: [text, data, scripts, source]
    if:
      type: text
      regex: '(?i)["'']command["'']\s*:\s*["''](cmd|powershell|pwsh)(\.exe)?["'']'

  - id: argument-list-shell-command-flag
    desc: Argument list starts with shell command flag
    conf: 0.97
    for: [text, data, scripts, source]
    if:
      type: text
      regex: '(?i)["'']args["'']\s*:\s*\[\s*["''](-c|/c|-command)["'']'

  - id: config-args-windows-detached-start
    desc: Config args start detached Windows process
    conf: 0.96
    platforms: [windows]
    for: [scripts, source, json, yaml, markdown, text]
    if:
      type: text
      regex: '(?i)args["'']?\s*[:=]\s*\[[^\]]{0,120}["'']/c["'']\s*,\s*["'']start["'']'

composite_rules:
  - id: mcp-stdio-shell-command
    desc: MCP stdio configuration invokes command shell
    conf: 0.99
    for: [text, data, scripts, source]
    all:
      - id: metadata/file/profile/agent-config::mcp-stdio-config-command-field
      - id: metadata/file/profile/agent-config::mcp-stdio-config-args-field
      - id: micro-behaviors/process/config::argument-list-shell-command-flag
    any:
      - id: micro-behaviors/process/config::json-command-field-unix-shell
      - id: micro-behaviors/process/config::json-command-field-windows-shell
    near_bytes: 600
