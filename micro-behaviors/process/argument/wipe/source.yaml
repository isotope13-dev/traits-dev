# Anti-forensic argument wiping in C/C++ source
defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: "T1070"
traits:
  - id: bzero-argv
    desc: Wipes argv contents with bzero
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: bzero\s*\(\s*argv
  - id: memset-argv
    desc: Wipes argv contents with memset
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # The argv element itself must be the destination. Pointer arithmetic
      # into an argv-backed command buffer (for example argv[0] + offset) is
      # ordinary in parsers and does not erase a process argument.
      regex: 'memset\s*\(\s*argv\s*\[[^]]{1,20}\]\s*,'
    unless:
      - id: well-known/lib/runtime/php-runtime::source-tree
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-spdx-source-context
