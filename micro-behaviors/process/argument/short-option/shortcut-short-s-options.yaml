---
defaults:
  platforms:
  - windows
  for:
  - lnk
traits:
- id: lnk-short-s-option
  desc: LNK arguments contain an -s option
  crit: notable
  conf: 0.94
  if:
    type: value
    path: lnk.arguments
    regex: "(?i)(^|\\s)-s:\\S+"
- id: lnk-short-s-media-path
  desc: LNK -s option names media or log
  crit: notable
  conf: 0.96
  if:
    type: value
    path: lnk.arguments
    regex: (?i)-s:[^\r\n"']{1,120}\.(ico|png|jpg|log)\b
