defaults:
  platforms:
    - "windows"
  for:
    - "batch"
traits:
  - 
    id: "batch-argument-prefix-system-exe"
    desc: "Argument prefix forms system32 executable name"
    crit: "notable"
    conf: 0.96
    if:
      type: "text"
      regex: "(?im)^\\s*set\\s+\\w+=(%windir%|%systemroot%)\\\\system32\\\\%[1-9]32\\.exe\\s*$"
