defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component
  conf: 0.96

traits:
  - id: python-call-powershell-token
    desc: Python call contains PowerShell executable token
    crit: notable
    if:
      type: tree-sitter
      kind: call
      regex: '(?is)\b(os\.system|subprocess\.\w+)\s*\([^)]{0,120}\b(powershell|pwsh)(\.exe)?\b'

