defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component
  conf: 0.96

traits:
  - id: python-call-powershell-token
    desc: Python call contains PowerShell executable token
    crit: notable
    if:
      # The token must follow a quote, separator, path or switch (`"pwsh`,
      # `; powershell`, `\powershell.exe`, `/c powershell`), not prose such
      # as an echoed "payload,powershell attack" tool description.
      type: tree-sitter
      kind: call
      regex: '(?i)(os\.system|subprocess\.\w+)\([^)]{0,120}[^\w\s,.]\w*\s*(powershell|pwsh)\b'

