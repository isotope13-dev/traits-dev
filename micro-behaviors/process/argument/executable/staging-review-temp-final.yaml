defaults:
  platforms:
  - windows
  for:
  - pe
traits:
# A Notepad command whose file argument is a format placeholder: the program
# builds a path at runtime and opens it for the user. Logs and notes alike.
- id: notepad-placeholder-launch-format
  desc: Notepad command with file placeholder
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)\bnotepad(\.exe)?"?\s+"?(%l?s|%ws|\{0\})'
