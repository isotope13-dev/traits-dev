# Trojans and droppers sometimes build a ping.exe -t <host> command line for
# continuous ICMP to a remote host (beacon or distraction), not for diagnostics.
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: ping-continuous-host-command-format
    desc: ping.exe -t remote host command format
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'ping\.exe" -t [A-Za-z0-9][A-Za-z0-9.-]*\.[A-Za-z]{2,}'
