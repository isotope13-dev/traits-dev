# A command line selecting continuous ping (-t or /t, either side of the host)
# against a hard-coded domain. Nothing diagnostic needs an unbounded ping
# compiled into a program; keep-alive tools are the plausible benign use.
# Placeholder hosts and bare IPv4 keep-alive targets are deliberately excluded.
defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: ping-continuous-host-command-format
    desc: Continuous ping of a hard-coded host
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bping(\.exe)?"?\s+([-/]t\s+"?[\w.-]+\.[a-z]{2,}\b|"?[\w.-]+\.[a-z]{2,}"?\s+[-/]t\b)'
