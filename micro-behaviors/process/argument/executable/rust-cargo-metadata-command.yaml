defaults:
  crit: notable
  platforms: [windows, unix]
  for: [rust]
traits:
  - id: micro-behaviors/process/argument/executable::rust-cargo-metadata-command
    desc: Rust Cargo and metadata text references
    conf: 0.95
    if:
      type: text
      regex: '(?s)("CARGO"|"cargo")[\s\S]{0,120}["'']metadata["'']'
