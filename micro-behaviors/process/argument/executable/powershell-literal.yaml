# A string constant that is exactly the PowerShell executable name, the
# shape a spawn/execFile first argument takes even when the call itself is
# computed (obfuscator string arrays).
defaults:
  platforms: [windows]
  for: [javascript, typescript]
traits:
  - id: js-powershell-name-literal
    desc: String literal is PowerShell executable name
    crit: notable
    conf: 0.85
    attack: T1059.001
    if:
      type: literal
      kind: string
      regex: (?i)^(powershell|pwsh)(\.exe)?$
