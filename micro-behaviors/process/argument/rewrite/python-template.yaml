defaults:
  for: [python]
  platforms: [unix]
traits:
  - id: python-exec-argv0-template
    desc: Builds a shell command with custom argv0
    crit: notable
    conf: 0.96
    if:
      type: literal
      exclude_docstrings: true
      # The matcher retains the f-string prefix; the facts dump normalizes it.
      regex: '^(f["''])?exec -a ["'']?\{[^}]{1,60}\}["'']? (ba)?sh\b'
