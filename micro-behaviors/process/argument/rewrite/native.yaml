defaults:
  for: [c, cpp, elf]
  platforms: [unix]
  crit: notable
  conf: 0.9

traits:
  - id: strcpy-argv-zero
    desc: Copies string into argv zero
    if:
      type: text
      regex: 'strcpy\s*\(\s*argv\s*\[\s*0\s*\]\s*,'

  - id: strncpy-argv-zero
    desc: Copies bounded string into argv zero
    if:
      type: text
      regex: 'strncpy\s*\(\s*argv\s*\[\s*0\s*\]\s*,'

  - id: memset-argv-zero
    desc: Fills bytes in argv zero
    if:
      type: text
      regex: 'memset\s*\(\s*argv\s*\[\s*0\s*\]\s*,'
