defaults:
  platforms: [unix]
  for: [scripts, source, binaries]

traits:
  - id: quote-break-injects-tar-filter
    desc: Quoted path injects a tar filter argument
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: '(?i)[/\\][^\r\n/\\]{1,160}\\?["'']\s+--use-compress-program(=|\s+)[^\s"'']{1,160}\s+\\?["'']'
