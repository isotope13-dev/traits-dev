# `exec -a <name>` sets the argv[0] a process shows in `ps`. Taking the name from
# a variable is a neutral capability: supervisors tag helper processes so a
# later `pgrep -f` can find them (a group anchor named `app-group-anchor`),
# wrappers re-exec under a computed name, and masquerading malware picks a
# disguise at run time. Intent comes from the objective composites in
# objectives/evasion/masquerade/process/system-name, which pair it with a
# kernel-thread name pool.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.9

traits:
  - id: shell-exec-argv0-variable
    desc: Shell exec takes argv zero from variable
    mbc: F0004
    attack: T1036.004
    if:
      type: text
      # `exec -a $name` / `exec -a '$name'`: argv[0] comes from a variable, so
      # the name is only known at runtime. A tool subcommand such as
      # `convox exec -a <app>` takes a literal app name, never a bare
      # variable. The span covers the variable token (including `${..}` and
      # `name[N]` forms) so the exclusions below can see it.
      regex: '(?i)\bexec[ \t]+-a[ \t]+[''"]?\$\{?[A-Za-z0-9_@*#]+(\[[0-9]+\])?\}?'
    not:
      - regex: 'exec[ \t]+-a[ \t]+[''"]?\$\{?(RBENV|PYENV|NODENV)_COMMAND'
      # `exec -a "$0"` / `exec -a "${BASH_SOURCE[0]}"` keeps the script's own
      # name across a wrapper re-exec (e.g. a renamed git binary dispatching
      # to its sibling while preserving its identity): the assumed name is
      # known and self-identical.
      - regex: 'exec[ \t]+-a[ \t]+[''"]?\$\{?BASH_SOURCE\[[0-9]+\]\}?'
      - regex: 'exec[ \t]+-a[ \t]+[''"]?\$\{?0\}?($|[^0-9A-Za-z_])'
      - regex: 'exec[ \t]+-a[ \t]+[''"]?\$\{?ARG0\}?($|[^0-9A-Za-z_])'
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component
