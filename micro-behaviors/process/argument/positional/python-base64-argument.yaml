defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-base64-result-command-argument
    desc: Passes Base64 encoder output to a subprocess
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^subprocess[.](check_output|Popen|run|call)$'
      arg:
        index: 0
        from:
          call: '^base64\.(urlsafe_)?b64encode$'
          through:
            - call: '\.(decode|strip|rstrip)$'
              receiver: true
