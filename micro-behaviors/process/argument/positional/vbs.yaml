defaults:
  platforms: [windows]
  for: [vbs]
  crit: notable
  conf: 0.98

traits:
  - id: wscript-first-argument
    desc: References first WScript argument
    if:
      type: yara
      source: |
        rule vbs_first_argument_reference {
          strings:
            $code = /\bWScript\.Arguments(\.Item)?\(\s*0\s*\)/ nocase
          condition:
            $code and @code < 4096
        }
