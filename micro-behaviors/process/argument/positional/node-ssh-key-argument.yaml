defaults:
  platforms:
  - unix
  for:
  - javascript
  - typescript

traits:
- id: node-ssh-key-command-argument
  desc: SSH private-key path in process arguments
  crit: notable
  conf: 0.94
  if:
    type: symbol
    kind: call
    regex: '(^|\.)((exec|spawn)(File)?(Sync)?)$'
    arg:
      kind: string
      regex: '(?i)\.ssh[/\\]id_(e(d25519|cdsa)|[rd]sa)([\s;"'']|$)'
