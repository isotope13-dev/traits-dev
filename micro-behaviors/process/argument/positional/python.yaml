defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
traits:
  - id: python-sys-argv-first-positional
    desc: Reads the first command-line argument
    if:
      type: text
      regex: '\bsys\.argv\s*\[\s*1\s*\]'
  - id: python-sys-argv-second-positional
    desc: Reads the second command-line argument
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: 'sys\.argv\s*\[\s*2\s*\]'
composite_rules:
  - id: python-two-positional-arguments
    desc: Python references two positional arguments
    crit: baseline
    conf: 0.9
    all:
      - id: python-sys-argv-first-positional
      - id: python-sys-argv-second-positional
