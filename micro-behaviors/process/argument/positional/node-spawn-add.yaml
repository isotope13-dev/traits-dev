defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  - id: node-spawn-add-action-argument
    desc: Spawn arguments include add action
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn(Sync)?$'
      arg:
        index: 1
        from:
          value: '^add$'

