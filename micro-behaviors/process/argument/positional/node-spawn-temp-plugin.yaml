defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-spawn-temp-path-arg
    desc: Passes /tmp path to spawned child process
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(spawn|execFile)(Sync)?$'
      arg:
        from:
          value: '^/tmp/'

  - id: node-spawn-plugin-subcommand-argument
    desc: Spawn arguments include plugin subcommand
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn(Sync)?$'
      arg:
        index: 1
        from:
          value: '^(plugin|extension)$'
