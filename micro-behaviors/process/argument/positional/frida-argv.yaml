defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.97

traits:
  - id: python-frida-argv-origin
    desc: Python subprocess argv includes a Frida literal
    if:
      type: symbol
      kind: call
      regex: '^subprocess\.(run|Popen|call)$'
      arg:
        index: 0
        from:
          value: '^frida$'
