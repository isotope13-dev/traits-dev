# Executable-looking positional arguments in structured process telemetry.
# These are not claims that the referenced program ran; composites combine
# them with an execution gadget and a known parent process.
defaults:
  for: [json]
  platforms: [unix, windows]
  crit: notable
  conf: 0.96

traits:
  - id: executable-path-argument
    desc: Process receives an executable-path argument
    if:
      type: value
      path: process.args[*]
      regex: '(?i)^([a-z]:[\\/]|/(usr/)?(s?bin|opt|tmp)/)[^/\\\s]+(\.exe)?$'

  - id: auditd-executable-path-argument
    desc: Auditd records an executable-path argument
    platforms: [linux]
    if:
      type: value
      path: log.original
      regex: '(?i)\ba[0-9]+="?([a-z]:[\\/]|/(usr/)?(s?bin|opt|tmp)/)[^"\s]+'

  - id: posix-shell-path-argument
    desc: Process receives a POSIX shell argument
    platforms: [unix]
    if:
      type: value
      path: process.args[*]
      regex: '(?i)(^|[/\\])(ba|z|k)?sh$'

  - id: windows-shell-path-argument
    desc: Process receives a Windows shell argument
    platforms: [windows]
    if:
      type: value
      path: process.args[*]
      regex: '(?i)(^|[/\\])(cmd|powershell|pwsh)(\.exe)?$'

  - id: auditd-posix-shell-argument
    desc: Auditd records a POSIX shell argument
    platforms: [linux]
    if:
      type: value
      path: log.original
      regex: '(?i)\ba[0-9]+="?(/[^"\s]*/)?(ba|z|k)?sh"?(\s|$)'

  - id: auditd-windows-shell-argument
    desc: Auditd records a Windows shell argument
    platforms: [windows]
    if:
      type: value
      path: log.original
      regex: '(?i)\ba[0-9]+="?([a-z]:[\\/])?(cmd|powershell|pwsh)(\.exe)?"?'

composite_rules:
  - id: process-executable-path-argument
    desc: Process receives an executable path
    crit: notable
    any:
      - id: executable-path-argument
      - id: auditd-executable-path-argument

  - id: process-shell-path-argument
    desc: Process receives a shell path
    crit: notable
    any:
      - id: posix-shell-path-argument
      - id: windows-shell-path-argument
      - id: auditd-posix-shell-argument
      - id: auditd-windows-shell-argument
