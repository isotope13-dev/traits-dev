defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.97

traits:
  # Provenance establishes an argv contribution, not its executable position,
  # the device-side command, or successful instrumentation.
  - id: python-adb-argv-origin
    desc: Python subprocess argv includes an ADB literal
    if:
      type: symbol
      kind: call
      regex: '^subprocess\.(run|Popen|call)$'
      arg:
        index: 0
        from:
          value: '^adb$'

  - id: python-objection-argv-origin
    desc: Python subprocess argv has Objection literal
    if:
      type: symbol
      kind: call
      regex: '^subprocess\.(run|Popen|call)$'
      arg:
        index: 0
        from:
          value: '^objection$'
