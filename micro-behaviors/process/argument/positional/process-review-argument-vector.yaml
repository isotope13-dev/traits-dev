defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: node-spawn-skills-package-argument
    desc: Spawn arguments include skills package name
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn(Sync)?$'
      arg:
        index: 1
        from:
          value: '^skills$'

