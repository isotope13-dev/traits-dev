defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: node-base32-shell-argv
    desc: Shell argv uses decoder helper result
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator
              name: (identifier) @decoded
              value: (call_expression
                function: (identifier) @decoder)))
          . (expression_statement
            (call_expression
              function: (identifier) @launch
              arguments: (arguments
                (string (string_fragment) @shell)
                (array
                  (string (string_fragment) @flag)
                  (identifier) @used))))) @evidence
         (#match? @decoder "^(b32Decode|base32Decode)$")
         (#match? @launch "^execFile(Sync)?$")
         (#match? @shell "^(/bin/)?sh$")
         (#eq? @flag "-c")
         (#eq? @decoded @used))
