defaults:
  platforms: [unix, android, ios]
  for: [shell]

traits:
  - id: shell-set-positional-params
    desc: Shell resets positional parameters with set --
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(^|[;&\n])\s*set\s+--\s'

  # Staging shape: `set --` carrying a command line (two or more words), so
  # `$1`, `$2`, ... expand to a command plus arguments when run. A lone
  # constant (`set -- "."`, `set -- "$@"`) only defaults or forwards `$1`
  # and stages no hidden command.
  - id: shell-set-positional-command-stage
    desc: Shell stages multi-word set -- command
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)(^|[;&\n])[ \t]*set[ \t]+--[ \t]+\S+[ \t]+\S'
    # IFS reassigned to a non-whitespace delimiter to word-split a packed string
    # into an argv ("a,b,c" + IFS=, then unquoted $var). `IFS= read` (set to
    # empty/space) is the common benign idiom and is excluded by the class.

  # ClusterFuzz and autotools invoke the compiler from the environment
  # (`$CXX $CXXFLAGS`) without assigning it in the script.
