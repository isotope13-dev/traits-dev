defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.98
traits:
- id: python-base32-subprocess-argument
  desc: Subprocess argument derives from Base32 decoding
  if:
    type: symbol
    kind: call
    arg:
      index: 0
      from:
        call: ^base64\.b32decode(\.decode)?$
    exact: subprocess.run
