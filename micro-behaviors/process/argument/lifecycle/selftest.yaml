# Self-test lifecycle mode command-line option (/selftest, --selftest).
defaults:
  platforms: [unix, windows]
  for: [scripts, source, elf, macho, pe]
  crit: notable
  conf: 0.88

traits:
  - id: selftest-cli-option
    desc: Self-test CLI option (/selftest, --selftest)
    if:
      type: text
      regex: '(?i)(^|[\s"''`])(/|--?)selftest($|[\s"''`=])'
