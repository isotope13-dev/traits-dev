defaults:
  platforms: [unix]
  for: [shell]
  crit: notable

traits:
  - id: temporary-program-selftest-call
    desc: Runs temporary program in self-test mode
    ref: https://securelist.com/esxi-ransomware/121959/
    if:
      type: symbol
      kind: call
      regex: '^(/(var/)?tmp/|\./tmp/)[A-Za-z0-9._/-]{1,160}$'
      arg:
        kind: identifier
        name_regex: '^(/|--?)selftest$'
