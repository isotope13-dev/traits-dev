defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component
  conf: 0.96

traits:
  - id: powershell-noninteractive-flag
    desc: PowerShell disables interactive prompts
    crit: notable
    for: [scripts, source, pe, html]
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\b[^\r\n]{0,140}-NonInteractive\b'

  - id: code-powershell-noninteractive-options
    desc: Code invokes noninteractive PowerShell
    crit: notable
    for: [scripts, source]
    if:
      type: text
      regex: '(?is)\bpowershell(\.exe)?\b.{0,700}-NonInteractive\b'

  - id: powershell-no-logo-flag
    desc: PowerShell suppresses startup banner
    crit: notable
    for: [powershell, python, batch, pe, go, html]
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\b[^\r\n]{0,140}-NoLogo\b'

composite_rules:
  - id: powershell-no-profile-source-invocation
    desc: PowerShell child process disables profile loading
    crit: notable
    conf: 0.94
    attack: T1059.001
    for: [powershell]
    all:
      - id: micro-behaviors/process/create/shell/interpreter::powershell-process-call
      - id: metadata/file/profile/command-options::powershell-no-profile-option-text
    near_lines: 1

  # These call-text observations may come from neighboring calls. They do
  # not bind the executable to argv[0] or establish a single launch's flags.
