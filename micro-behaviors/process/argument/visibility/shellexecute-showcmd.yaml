traits:
- for:
  - javascript
  - vbs
  - html
  id: shellexecute-hidden-showcmd
  desc: ShellExecute with hidden show-command
  conf: 0.93
  if:
    type: text
    regex: (?i)\.ShellExecute\b[^;\r\n]{0,240},\s*0\s*\)?
- id: shellexecutew-hidden-showcmd-python
  desc: ShellExecuteW hides launched program window
  for: [python]
  crit: notable
  conf: 0.93
  if:
    type: symbol
    kind: call
    regex: '(^|\.)ShellExecuteW$'
    arg:
      index: 5
      kind: number
      value: 0
defaults:
  platforms:
  - windows
  crit: notable
