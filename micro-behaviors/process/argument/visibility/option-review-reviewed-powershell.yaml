defaults:
  crit: notable
composite_rules:
  - platforms:
      - windows
    attack: T1564.003
    id: hidden-console-execution
    desc: Hidden or minimized process launch options
    conf: 0.9
    any:
      - id: micro-behaviors/process/create/hidden::conhost-headless
      - id: micro-behaviors/process/config/window::conhost-split-headless-clues
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-window
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/ui/window/state::start-minimized-window
      - id: micro-behaviors/process/config/window::sfx-hidcon-prefix
