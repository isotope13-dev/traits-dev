defaults:
  platforms: [windows]
  for: [oledoc]
traits:
  - id: msi-hidden-window-option-text
    desc: MSI hidden-window option text
    crit: notable
    conf: 0.96
    if:
      type: raw
      regex: '(?i)-(w|windowstyle)\s+hidden\b'
    unless:
      - id: well-known/app/storage/cloud-drive-mapper::cloud-drive-mapper-msi-context
