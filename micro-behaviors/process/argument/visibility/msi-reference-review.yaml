defaults:
  platforms: [windows]
  for: [oledoc]
  attack: T1564.003

traits:
  - id: msi-hidden-window-switch
    desc: MSI embeds a hidden-window option
    crit: notable
    conf: 0.96
    if:
      type: raw
      regex: '(?i)(^|[^A-Za-z0-9_])-(W|WindowStyle)\s+Hidden\b'
  - id: msi-hidden-window-raw
    desc: MSI embeds hidden-window option text
    crit: notable
    conf: 0.9
    for: [oledoc, msi]
    if:
      type: text
      regex: (?i)(WindowStyle\s+Hidden|-w\s+h|-w\s+hidden)
