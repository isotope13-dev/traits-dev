defaults:
  platforms: [windows]
  for: [html, javascript]


traits:
  - id: powershell-hidden-ep-bypass-flags
    desc: PowerShell hidden window and policy bypass flags
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)powershell(\.exe)?\s+(-w(indowstyle)?\s+hidden|-w\s+h).{0,40}-ep\s+bypass'
