defaults:
  platforms: [windows]
  for: [html, javascript]

traits:
  - id: embedded-powershell-hidden-option
    desc: Embedded PowerShell hidden window option
    crit: notable
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\bpowershell(\.exe)?\s+[^;\r\n]{0,80}-w(indowstyle)?\s+h(idden)?\b'
  - id: embedded-powershell-policy-bypass-option
    desc: Embedded PowerShell policy bypass option
    crit: notable
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\bpowershell(\.exe)?\s+[^;\r\n]{0,100}-(ep|exec(utionpolicy)?)\s+bypass\b'
composite_rules:
  - id: powershell-hidden-ep-bypass-flags
    desc: PowerShell hidden window and policy bypass flags
    crit: component
    conf: 0.94
    near_lines: 0
    # A Node spawn of PowerShell with hidden window and bypass is reported by
    # the launch trait at the call site; this text-level composite would repeat
    # that same concealment claim as a second suspicious finding.
    unless:
      - id: metadata/file/format/security-corpus::inline-detection-rule-corpus
      - id: micro-behaviors/process/create/hidden::node-window-style-hidden-policy-bypass-launch
    # Clio Coder's Windows desktop launcher runs its bundled open.ps1 hidden
    # with execution policy bypass; the product context lowers it one step.
    downgrade:
      scope: archive
      any:
        - id: well-known/app/ai/coding-agent/clio-coder::clio-coder-context
    all:
      - id: embedded-powershell-hidden-option
      - id: embedded-powershell-policy-bypass-option
