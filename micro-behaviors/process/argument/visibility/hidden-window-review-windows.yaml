# Hidden Window Process Creation - Windows
# Neutral observations of hidden window execution flags.
# ATT&CK: T1564.003 (Hide Artifacts: Hidden Window)
# Many legitimate tools (services, background workers, installers) use hidden windows.
defaults:
  platforms: [windows]
traits:
  - id: powershell-hidden-window
    desc: PowerShell hidden-window command text
    crit: notable
    conf: 0.8
    for: [batch, vbs, powershell, pe, oledoc]
    if:
      type: text
      regex: '(?i)powershell[^\n]{0,30}-w\s+h(idden)?\b'
  - id: powershell-hidden-window-short
    desc: Hidden-window short option text
    crit: notable
    conf: 0.88
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)(^|[\s"''])(-w)\s+h(idden)?\b'

  - id: powershell-windowstyle-1-option
    desc: PowerShell WindowStyle option uses value 1
    crit: notable
    conf: 0.9
    for: [pe, batch, powershell]
    if:
      type: text
      regex: '(?i)\bpowershell[^\n]{0,40}-win(dowstyle|dow|do)?\s+1\b'

  - id: argv-array-windowstyle-hidden
    desc: Hidden-window flag in an argv array
    crit: notable
    conf: 0.94
    for: [go, javascript, typescript, python]
    if:
      type: text
      regex: '(?i)-WindowStyle["'']\s*,\s*["'']Hidden\b'
