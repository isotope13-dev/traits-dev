defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: powershell-bypass-file-hidden-flags
    desc: PowerShell hidden window and policy bypass
    crit: suspicious
    conf: 0.9
    for: [scripts, binaries]
    if:
      type: text
      regex: -ep\s+bypass.{0,80}-file.{0,200}-w\s+hidden|-w\s+hidden.{0,80}-ep\s+bypass
    unless:
      - id: metadata/package/documentation/security-exercise::assessment-playbook-examples
