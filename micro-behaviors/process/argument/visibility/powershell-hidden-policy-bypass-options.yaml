defaults:
  platforms:
    - unix
    - windows
  for:
    - python

composite_rules:
  - id: powershell-hidden-policy-bypass-options
    desc: PowerShell hidden and policy-bypass options
    crit: suspicious
    conf: 0.96
    near_bytes: 256
    all:
      - id: micro-behaviors/process/argument/interpreter::powershell-hidden-window-flag
      - id: micro-behaviors/process/argument/interpreter::powershell-hidden-window-value
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-flag
      - id: micro-behaviors/os/security/execution-policy::powershell-policy-bypass-option-alternatives
    unless:
      - id: well-known/tool/development/agent/ai-cli/shibaclaw::shibaclaw-official-release-updater-context
