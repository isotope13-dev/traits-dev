defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: python-argv-node-script-variable
    desc: Python spawns Node on variable script
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(run|call|Popen|check_call)\(\s*\[\s*["'']node(js)?(\.exe)?["'']\s*,\s*[A-Za-z_]'
