defaults:
  platforms: [unix, windows]
  for: [java, kotlin, class, java_class, jar, text, shell, markdown]
  crit: notable
  conf: 0.85
traits:
  - id: java-jar-command-line
    for: [java, kotlin, class, java_class, text, shell, markdown]
    desc: Text mentions java -jar
    if:
      type: text
      substr: java -jar

    unless:
      - id: metadata/file/format/news::serialized-news-article-catalog
