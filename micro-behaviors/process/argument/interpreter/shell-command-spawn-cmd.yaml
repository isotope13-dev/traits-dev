defaults:
  platforms: [windows, linux, macos]
  for: [python, go, rust, javascript, typescript, csharp]

traits:
  - id: shell-command-spawn-cmd
    desc: Windows cmd.exe /c inline execution flag
    crit: notable
    conf: 0.94
    not:
      - substr: "//"
    if:
      type: text
      regex: '(?i)(//[^\r\n]{0,30})?\bcmd(\.exe)?[^\r\n]{1,20}["''\s]/c\b'
