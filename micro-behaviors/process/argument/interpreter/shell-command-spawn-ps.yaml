defaults:
  platforms: [windows, linux, macos]
  for: [python, go, rust, javascript, typescript, csharp]

traits:
  - id: shell-command-spawn-ps
    desc: PowerShell -Command inline execution flag
    crit: notable
    conf: 0.94
    not:
      - substr: "//"
    if:
      type: text
      regex: '(?i)(//[^\r\n]{0,30})?\bpowershell[^\r\n]{1,24}-(c|command)\b'
