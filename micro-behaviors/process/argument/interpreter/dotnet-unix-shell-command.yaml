defaults:
  platforms: [unix]
  for: [csharp]

traits:
  - id: dotnet-unix-shell-command
    desc: C# /bin/sh and -c text nearby
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"/bin/sh"[\s\S]{0,180}-c\b'

  - id: dotnet-bash-command-exec
    desc: C# bash command exec
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'FileName = "/bin/bash"[\s\S]{0,120}-c \\"'
    unless:
      - id: metadata/package/testing/presence/path::msal-cache-storage-integration-test
