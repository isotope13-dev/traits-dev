defaults:
  platforms: [windows]
  for: [class, jar, zip]
composite_rules:
  - id: java-hidden-powershell
    desc: PowerShell hidden and bypass flag references
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/process/argument/interpreter::jvm-windowstyle-hidden-arguments
      - id: micro-behaviors/process/argument/interpreter::java-powershell-executionpolicy-bypass
    unless:
      # Hidden + Bypass here is aimed at the shared desktop and Start Menu
      # shortcut folders, which is how an app rewrites its own .lnk icons.
      - id: micro-behaviors/fs/path/user-directory::java-shared-desktop-programs-names
