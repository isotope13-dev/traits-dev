defaults:
  platforms: [unix, windows]
  for: [whl, zip, python, binaries]
  size_min: 512
  size_max: 500000000
composite_rules:
  - id: esquelesquad-and-hidden-encoded-powershell-text
    desc: EsqueleSquad and hidden encoded PowerShell text
    crit: notable
    conf: 0.95
    scope: archive
    all:
      - id: metadata/vendor/string::esquelesquad-name-reference
      - id: metadata/lang/source/syntax/command/launch::powershell-encoded-payload-command-text
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
