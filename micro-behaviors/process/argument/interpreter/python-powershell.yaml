traits:
- platforms:
  - windows
  - unix
  crit: notable
  conf: 0.9
  id: python-powershell-command-option
  desc: Python references PowerShell command option
  for:
  - python
  - pyc
  # A short ASCII marshal constant can merge its z/length header with the
  # preceding extracted run, so bytecode does not always have a word boundary.
  if:
    type: text
    regex: (?i)(\b|z.)powershell(\.exe)?\b.{0,80}-(Command|EncodedCommand)\b
