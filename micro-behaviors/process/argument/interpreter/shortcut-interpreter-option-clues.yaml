---
defaults:
  platforms:
  - windows
  for:
  - lnk
traits:
- id: lnk-execution-related-flags
  desc: LNK text references execution-related flags
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: "(-exec|-nop|-noni)"
    case_insensitive: true
- id: lnk-encoding-decode-flag
  desc: LNK contains -enc or -decode flag
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: "(-enc|-decode)"
    case_insensitive: true
- id: kv-encoding-flag
  desc: LNK arguments contain encoding flag
  crit: suspicious
  conf: 0.85
  if:
    type: value
    path: lnk.arguments
    regex: "(?i)-Encoding"
