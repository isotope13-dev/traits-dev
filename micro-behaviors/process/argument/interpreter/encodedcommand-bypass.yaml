defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
  - id: encodedcommand-bypass
    desc: Policy bypass and encoded command references
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/process/argument/interpreter::powershell-policy-bypass-flag
    any:
      - id: metadata/lang/source/syntax/command/launch::powershell-encoded-payload-command-text
      - id: micro-behaviors/process/deploy/interpreter-command::encodedcommand-invocation-source
      - id: micro-behaviors/process/deploy/interpreter-command::encodedcommand-process-launch
