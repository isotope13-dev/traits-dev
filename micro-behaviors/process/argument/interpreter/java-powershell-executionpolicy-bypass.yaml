defaults:
  platforms: [windows]
  for: [class, jar, zip]
traits:
  - id: java-powershell-executionpolicy-bypass
    desc: Java PowerShell ExecutionPolicy Bypass
    crit: notable
    conf: 0.88
    for: [class]
    if:
      type: text
      regex: '(?i)-ExecutionPolicy.{0,40}Bypass'
    unless:
      - id: well-known/lib/development/smallrye::smallrye-argumentrule-context
