# A process argument array (Swift, C#, Go, Rust, JS) that asks PowerShell for
# a hidden window and an -EncodedCommand body.
defaults:
  platforms: [windows]
  for: [swift, csharp, go, rust, javascript, typescript, python, java, kotlin]

traits:
  - id: argv-array-hidden-encodedcommand
    desc: Argument array runs hidden encoded PowerShell
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"Hidden"\s*,\s*"-EncodedCommand"'
