defaults:
  crit: notable
  platforms: [windows, unix]
traits:
  - id: password-required-flag
    desc: Password command-line argument
    conf: 0.8
    for:
      - scripts
      - binaries
    if:
      type: text
      regex: --password(\s+PASS|\s+\$?pass|\s|$|[''"])
      case_insensitive: true
    unless:
      # Completion catalogs describe flags but do not consume process
      # arguments. Keep this capability for actual command-line interfaces.
      - id: metadata/file/catalog/shell-completion::completion-schema-registration
  - id: suspicious-arg-passw
    desc: Password command-line flag
    for:
      - python
    if:
      type: string_literal
      exact: --passw
