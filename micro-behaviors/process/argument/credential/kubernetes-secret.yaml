# Follow the response, JSON parse, Base64 decode and decoded text into argv.
# This establishes secret-derived process arguments, not unauthorized access.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: python-kube-secret-process-argument
    desc: Kubernetes secret enters process arguments
    if:
      type: symbol
      kind: call
      regex: '^subprocess\.(run|Popen|call)$'
      arg:
        index: 0
        from:
          call: '^requests\.get$'
          argument: 0
          literal: '/api/v1/namespaces/[^/]{1,120}/secrets/'
          through:
            - call: '^requests\.get\.json$'
              receiver: true
            - call: '^base64\.b64decode$'
              arguments: [0]
            - call: '^base64\.b64decode\.decode$'
              receiver: true
