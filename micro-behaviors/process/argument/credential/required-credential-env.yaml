defaults:
  crit: notable
  platforms: [windows, unix]
traits:
  # Consent signal, not a finding: a CLI that refuses to run unless the
  # operator exports named credential variables cannot silently harvest
  # them -- the user knowingly supplies the secret for the documented
  # workflow. Stealers read keychains, files and IMDS without asking.
  - id: required-credential-env-error
    desc: CLI requires credential environment variables
    conf: 0.9
    for:
      - python
    if:
      type: text
      regex: 'parser\.error\([^)\n]{0,160}(TOKEN|SECRET|PASSWORD|ACCESS_KEY|JWT)'
