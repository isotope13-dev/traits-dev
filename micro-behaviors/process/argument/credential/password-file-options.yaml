defaults:
  platforms: [windows, unix]
  for: [binaries, python, go, c, cpp, rust]
composite_rules:
- id: password-with-bulk-file-options
  for: [binaries, '!dex', '!wasm', python, go, c, cpp, rust]
  desc: Password option with bulk-file options
  crit: notable
  conf: 0.9
  near_bytes: 4096
  all:
  - id: micro-behaviors/process/argument/credential::password-option-text
  needs: 2
  any:
  - id: micro-behaviors/process/argument/option::path-directory-option-text
  - id: micro-behaviors/process/argument/option::fast-mode-option
  - id: micro-behaviors/process/argument/option::spread-or-gpo-option
  - id: micro-behaviors/process/argument/option::shares-or-wipe-option-text
- id: password-with-spread-and-file-options
  for: [binaries, '!dex', '!wasm', python, go, c, cpp, rust]
  desc: Password, spread, and file-mode options
  crit: notable
  conf: 0.95
  near_bytes: 4096
  all:
  - id: micro-behaviors/process/argument/credential::password-option-text
  - id: micro-behaviors/process/argument/option::spread-or-gpo-option
  any:
  - id: micro-behaviors/process/argument/option::fast-mode-option
  - id: micro-behaviors/process/argument/option::shares-or-wipe-option-text
  - id: micro-behaviors/process/argument/option::path-directory-option-text
