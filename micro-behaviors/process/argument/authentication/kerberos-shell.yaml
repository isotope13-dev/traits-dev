defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: gettgt-variable-credential-pair
    desc: getTGT receives variable username and password
    if:
      type: tree-sitter
      node: command
      regex: '\b(getTGT\.py|impacket-getTGT)\s+["''][^"\n]{0,80}/\$\{?\w+\}?:\$\{?\w+'
