defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - batch
  - powershell
  - pe
  - elf
  - macho
traits:
  - id: miner-wallet-user-option
    desc: Miner command supplies Monero wallet identity
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(\s-u\s+|--user[=\s]+)4[A-Za-z0-9]{90,110}\b'
