# Structured command-line authentication material.  A paired encoded token
# and signature is a protocol shape, not a family or product name; keep the
# atomic observation neutral and let C2 composites infer intent.
defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: python-password-option
    desc: Python references a password CLI option
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: literal
      exact: --password

  - id: token-signature-argument
    desc: Process argument carries token and signature
    crit: notable
    conf: 0.91
    if:
      type: string_literal
      regex: '(?i)--[a-z0-9_-]*(token|auth)[a-z0-9_-]*=[a-z0-9+/=]{8,}[;,|:][a-z0-9+/=]{8,}'
