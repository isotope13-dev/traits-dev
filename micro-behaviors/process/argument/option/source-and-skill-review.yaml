traits:
- id: enc-equals-option-text
  desc: CLI -enc= option text
  if:
    type: text
    regex: (?i)(^|[\s"'`])-enc=(\d|[a-z_%"'])
- id: uac-netdrive-selfdelete-option-text
  desc: CLI UAC, network-drive or self-delete option
  if:
    type: text
    regex: (?i)(^|[\s"'`])-(uac|netdrive|selfdelete)\b
defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
  - c
  - cpp
  - csharp
  - go
  - rust
  crit: notable
  conf: 0.92
