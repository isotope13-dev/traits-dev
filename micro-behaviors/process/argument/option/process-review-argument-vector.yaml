defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: node-spawn-global-option-argument
    desc: Spawn arguments include global option
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn(Sync)?$'
      arg:
        index: 1
        from:
          value: '^(-g|--global)$'

