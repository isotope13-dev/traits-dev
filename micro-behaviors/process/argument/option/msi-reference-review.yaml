defaults:
  platforms: [windows]
  for: [oledoc]

traits:
  - id: msi-policy-bypass-switch
    desc: MSI embeds execution-policy override option
    crit: notable
    conf: 0.97
    attack: T1059.001
    if:
      type: raw
      regex: '(?i)(^|[^A-Za-z0-9_])-(Exec(utionPolicy)?|EP)\s+(Bypass|Unrestricted)\b'
