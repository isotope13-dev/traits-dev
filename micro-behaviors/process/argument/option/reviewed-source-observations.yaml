traits:
- for:
  - batch
  - powershell
  - shell
  - scripts
  id: exe-config-option-text
  desc: Executable command text includes --config
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\.exe\b.{0,80}--config(=|\s+)\S{1,80}
  unless:
  - id: well-known/app/infrastructure/containerd::containerd-source-archive-context
  - type: text
    regex: (?i)\bcontainerd\.exe\b.{0,80}--config
- for:
  - binaries
  - python
  - go
  - c
  - cpp
  - rust
  id: path-directory-option-text
  desc: CLI --path directory argument text
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: --path\s+DIR|--path\s+/vmfs|--path.{0,40}/datastore
    case_insensitive: true
  unless:
  - id: metadata/file/catalog/shell-completion::completion-schema-registration
defaults:
  platforms:
  - windows
  - unix
