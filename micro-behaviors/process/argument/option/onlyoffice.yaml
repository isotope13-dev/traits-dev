defaults:
  for: [python, javascript, shell]
  platforms: [unix, windows]
traits:
  - id: cache-flush-hash-argument
    desc: Cache-flush helper hash argument
    crit: notable
    conf: 1.0
    if:
      type: text
      regex: 'documentserver-flush-cache(\.sh)?["\x27]?[ ,\\\s]{1,30}["\x27]?--hash'
