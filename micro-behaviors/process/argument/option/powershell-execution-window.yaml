defaults:
  platforms: [windows]
  for: [data, batch, powershell]
traits:
  - id: powershell-execution-or-window-option
    desc: PowerShell execution or window option
    crit: notable
    conf: 0.96
    attack: T1059.001
    if:
      type: text
      regex: '(?is)\b(powershell|pwsh)(\.exe)?\b.{0,160}-(ExecutionPolicy|WindowStyle)\s+\w+'
