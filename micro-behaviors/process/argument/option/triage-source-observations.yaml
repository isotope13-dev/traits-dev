traits:
- platforms:
  - windows
  - unix
  for:
  - binaries
  - python
  - go
  - c
  - cpp
  - rust
  id: shares-or-wipe-option-text
  desc: --shares or --wipe option text
  crit: notable
  conf: 0.8
  unless:
  - id: metadata/file/catalog/shell-completion::completion-schema-registration
  if:
    type: text
    regex: --(shares|wipe)(\s|$|[''"])
    case_insensitive: true
