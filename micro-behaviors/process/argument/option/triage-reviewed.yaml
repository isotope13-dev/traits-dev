traits:
- for:
  - html
  - javascript
  - vbs
  - batch
  - powershell
  id: quiet-package-install-args
  desc: Quiet package install arguments
  conf: 0.93
  if:
    type: text
    regex: (?i)/package\b[^\r\n]{0,160}/(quiet|qn?)\b
- conf: 0.9
  id: powershell-flagged-command-line
  desc: PowerShell command line carries a flag
  for: [html, markdown, pe, dll, javascript, vbs, batch, powershell]
  if:
    type: text
    regex: (?i)\bpowershell(\.exe)?\b\s+[-/][A-Za-z]
  not:
  - substr: run 'Connect-AzAccount' from PowerShell
  unless:
  - id: well-known/tool/sysadmin/microsoft-office::office-license-cleanup-benign-context
  - id: metadata/binary/resource/
  - id: well-known/tool/detection/ai-guardrail/
  - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-source-path
  - id: well-known/dual-use/transfer/rclone::rclone-release-documentation-context
  - id: metadata/file/format/source-map::sourcemap
- id: powershell-encoded-command-text
  desc: PowerShell encoded-command option syntax
  conf: 0.96
  for:
  - html
  - vbs
  - javascript
  - batch
  - powershell
  if:
    type: text
    regex: (?i)\bpowershell(\.exe)?\s+-(enc|encodedcommand)\b
defaults:
  platforms:
  - windows
  crit: notable
composite_rules:
- id: windows-interpreter-command-syntax
  desc: Windows interpreter command or option syntax
  crit: notable
  conf: 0.94
  for:
  - scripts
  - source
  - html
  - markdown
  - pe
  - dll
  any:
  - id: micro-behaviors/process/create/shell/command-mode::windows-command-shell-invocation
  - id: powershell-flagged-command-line
