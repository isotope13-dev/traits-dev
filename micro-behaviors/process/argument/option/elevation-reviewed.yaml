traits:
- platforms:
  - windows
  for:
  - scripts
  - source
  - text
  - data
  attack: T1059.001
  id: powershell-hidden-command-text
  desc: PowerShell command text requests a hidden window
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\bpowershell(\.exe)?\b[^\r\n]{0,120}-(w|WindowStyle)\s+Hidden\b
  not:
  - regex: (?i)\bDo\s+NOT\s+use\s+-WindowStyle\s+Hidden\b
- platforms:
  - windows
  attack: T1564.003
  id: powershell-windowstyle-hidden-option
  desc: PowerShell WindowStyle Hidden option
  crit: notable
  conf: 0.9
  for:
  - batch
  - powershell
  - pe
  - pyc
  - python
  - oledoc
  - vbs
  - javascript
  if:
    type: text
    regex: (?i)(^|[\s"'])(-WindowStyle)[\s"',]+Hidden\b
- platforms:
  - windows
  attack: T1564.003
  id: powershell-windowstyle-hidden
  desc: PowerShell command text has WindowStyle Hidden
  crit: notable
  conf: 0.86
  for:
  - batch
  - vbs
  - powershell
  - pe
  - oledoc
  - java
  if:
    type: text
    regex: (?i)powershell(\.exe){0,1}[^\r\n]{0,80}-WindowStyle\s+Hidden\b
- platforms:
  - unix
  - windows
  for:
  - powershell
  crit: notable
  conf: 0.96
  id: powershell-no-profile-option-text
  desc: PowerShell NoProfile option text
  if:
    type: text
    regex: (?i)(^|\s)-(NoProfile|nop)\b
- platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
  id: python-string-powershell-flagged-command
  desc: PowerShell flag in a string
  for:
  - python
  attack: T1059.001
  if:
    type: string_literal
    regex: (?i)\bpowershell(\.exe)?\b\s+[-/][A-Za-z]
- platforms:
  - unix
  - windows
  for:
  - scripts
  - -powershell
  - source
  - pe
  - oledoc
  crit: notable
  conf: 0.7
  id: powershell-command-options-text
  desc: PowerShell command text with options
  if:
    type: text
    regex: (?im)(^|[\s"'(@;&|])\s*(powershell|pwsh)(\.exe)?\s+-[A-Za-z]
  unless:
  - id: metadata/binary/resource/identity::icon-font-resource-context
  - id: well-known/tool/development/cli/fzf::fzf-binary
  - id: well-known/lib/ui/monaco-editor/
  - id: well-known/lib/web/authoring/syntaxhighlighter::prismjs-package-reference
  - id: well-known/tool/detection/repo-trust-scan::repo-trust-scan-context
  - id: well-known/app/data/xore-honeypot::benign-context
  - id: metadata/file/catalog/identity::debian-packages-index
  - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  - type: text
    regex: (?i)terminalPowershell|terminal-powershell
