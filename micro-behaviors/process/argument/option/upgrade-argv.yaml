defaults:
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: subprocess-upgrade-argv
  desc: Python subprocess argv has upgrade flag
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: subprocess\.(run|Popen|call)\(\s*\[[^\]]{0,280}["']--upgrade["']
- id: subprocess-uppercase-u-argv
  desc: Python subprocess argv contains -U option
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: subprocess\.(run|Popen|call)\(\s*\[[^\]]{0,280}["']-U["']
