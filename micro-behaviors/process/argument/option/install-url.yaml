defaults:
  crit: notable
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: install-url-argument
    desc: "/i: or -i: HTTP URL command argument"
    if:
      type: text
      regex: "[/-]i:https?://"
      case_insensitive: true
  - id: encoded-install-url-argument
    for: [powershell, batch, vbs, javascript, html, pe]
    desc: "Encoded /i: or -i: URL argument"
    if:
      type: encoded
      encoding:
        - base64
        - hex
      regex: "[/-]i:https?://"
      case_insensitive: true
  - id: hex-install-url-argument
    desc: "Hex /i: or -i: URL argument"
    if:
      type: text
      regex: "(2f|2d)693a68747470"
      case_insensitive: true
  - id: regsvr32-no-register-install-args
    desc: "\"regsvr32 /n /i: DllInstall argument switch\""
    platforms: [windows]
    if:
      type: text
      regex: '(?i)\s/n\s+["'']?\\?"?/i:[^"\r\n]{3,160}'
