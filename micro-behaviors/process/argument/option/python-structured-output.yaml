defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-cli-structured-output-option
    desc: References CLI option for structured output
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\B(-o\b|--output[= ])[^\n]{0,12}\b(json(path)?|yaml|go-template)\b'
