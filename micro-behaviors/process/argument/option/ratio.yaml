defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, c, cpp, rust, go, csharp]
  crit: notable

traits:
  - id: ratio-percentage-option
    desc: Numeric ratio or percentage CLI option
    conf: 0.94
    if:
      type: text
      encoding: none
      regex: '(?i)(^|\s)(--ratio[= ]+\d{1,3}(\s|$)|-r ?\d{1,3}%)'
