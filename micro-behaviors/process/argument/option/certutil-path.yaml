traits:
- id: certutil-exe-path-reference
  desc: certutil command references an EXE path
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)certutil[^&|>\r\n]{0,200}\.exe\b
- id: certutil-dll-path-reference
  desc: certutil command references a DLL path
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)certutil[^&|>\r\n]{0,200}\.dll\b
defaults:
  platforms:
  - windows
  for:
  - scripts
