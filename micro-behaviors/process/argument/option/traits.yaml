# CLI option names are neutral process-argument observations. Their meaning
# comes from the surrounding command or a higher-level composite; a generic
# mount option is not evidence of ransomware by itself.
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]
  crit: notable
  conf: 0.85

traits:
  - id: variable-msi-quiet-install-args
    desc: Variable MSI path quiet-install arguments
    crit: component
    conf: 0.94
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: '(?i)/i\s+`?["'']?\$[A-Za-z_][A-Za-z0-9_]*`?["'']?\s+/qn\b'
  - id: python-shell-option
    desc: Python references a shell CLI option
    conf: 0.9
    for: [python]
    if:
      type: literal
      exact: --shell

  - id: limit-zero-option
    desc: CLI --limit 0 (no limit) option
    crit: notable
    conf: 0.9
    for: [binaries, scripts, c, cpp, rust, go, csharp]
    if:
      type: text
      regex: '(?i)(^|[\s])--limit(=|\s+)0\b'

  - id: mount-option
    desc: CLI mount or no-mount option
    if:
      type: text
      regex: '--(no-)?mount\b'

  - id: daemon-ui-option-pair
    desc: Nearby daemon and UI command-line options
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)--daemon\b[\s\S]{0,160}--ui\b|--ui\b[\s\S]{0,160}--daemon\b'

  - id: no-deliver-option
    desc: CLI suppresses normal result delivery
    crit: notable
    conf: 0.98
    for: [scripts, source]
    if:
      type: literal
      kind: string
      exact: --no-deliver
