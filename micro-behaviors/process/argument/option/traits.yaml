# CLI option names are neutral process-argument observations. Their meaning
# comes from the surrounding command or a higher-level composite; a generic
# mount option is not evidence of ransomware by itself.
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]
  crit: notable
  conf: 0.85

traits:
  - id: python-click-option-call
    desc: Python declares a Click CLI option
    conf: 0.9
    for: [python]
    if:
      type: symbol
      kind: call
      exact: click.option

  - id: variable-msi-quiet-install-args
    desc: Variable MSI path quiet-install arguments
    crit: notable
    conf: 0.94
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: '(?i)/i\s+`?["'']?([''"]\s*\+\s*)?\$[A-Za-z_][A-Za-z0-9_]*(\s*\+\s*[''"])?`?["'']?\s+/qn\b'
  - id: python-shell-option
    desc: Python references a shell CLI option
    conf: 0.9
    for: [python]
    if:
      type: literal
      exact: --shell

  # Relocated (2026-09) from objectives/command-and-control/dropper/delivery/
  # execute-download, where it was named for llamafile; the literal is any
  # program's `--server` flag (optuna-dashboard's CLI parses one).
  - id: python-server-option
    desc: Python references a --server CLI option
    conf: 0.9
    for: [python]
    if:
      type: string_literal
      exact: --server

  - id: limit-zero-option
    desc: CLI --limit 0 (no limit) option
    crit: notable
    conf: 0.9
    for: [binaries, scripts, c, cpp, rust, go, csharp]
    if:
      type: text
      regex: '(?i)(^|[\s])--limit(=|\s+)0\b'

  - id: mount-option
    desc: CLI mount or no-mount option
    if:
      type: text
      regex: '--(no-)?mount\b'

  - id: speed-mode-option
    desc: CLI speed mode option
    conf: 0.93
    if:
      type: text
      regex: '(?i)(^|[\s"''`])--mode\s+(fast|medium|slow)\b'

  - id: fast-mode-option
    desc: CLI fast-mode option name
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(?i)(^|[\s"''`])--(fast|superfast|ultrafast)\b'
    unless:
      - id: metadata/file/catalog/shell-completion::completion-schema-registration

  - id: daemon-ui-option-pair
    desc: Nearby daemon and UI command-line options
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)--daemon\b[\s\S]{0,160}--ui\b|--ui\b[\s\S]{0,160}--daemon\b'

  - id: no-deliver-option
    desc: CLI suppresses normal result delivery
    crit: notable
    conf: 0.98
    for: [scripts, source]
    if:
      type: literal
      kind: string
      exact: --no-deliver
