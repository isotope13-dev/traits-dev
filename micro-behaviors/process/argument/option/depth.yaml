# A depth argument can bound multipart nesting, directory traversal, or another
# recursive operation. The option alone does not identify a filesystem action.
# Matchers and effective scope preserved from process/argument/file.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, elf, macho, pe]
  crit: notable

traits:
  - id: depth-cli-option-token
    desc: Depth command-line option token
    conf: 0.85
    if:
      type: text
      regex: '(?i)(^|["''`])(/|--)depth($|["''`=\s])'

  - id: depth-cli-numeric-arg
    desc: Depth option with numeric argument
    conf: 0.9
    if:
      type: text
      regex: '(?i)(^|[\s"''`])(/|--?)depth[= \t]+[0-9]{1,3}\b'

composite_rules:
  - id: depth-cli-option
    desc: Depth command-line option
    conf: 0.88
    any:
      - id: depth-cli-option-token
      - id: depth-cli-numeric-arg
