defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  - batch
  - powershell
  - csharp
traits:
- id: powershell-value-one-option
  desc: PowerShell -Value 1 parameter text
  crit: component
  conf: 0.95
  if:
    type: text
    regex: (?i)-Value\s+1\b
- id: reg-data-one-option
  desc: reg.exe /d 1 parameter text
  crit: component
  conf: 0.95
  if:
    type: text
    regex: (?i)\b/d\s+1\b
