defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  - batch
  - powershell
  - csharp
traits:
- id: powershell-value-one-option
  desc: PowerShell -Value 1 parameter text
  crit: component
  conf: 0.95
  if:
    type: text
    regex: (?i)-Value\s+1\b
- id: reg-data-one-option
  desc: reg.exe REG_DWORD data 1, either order
  crit: component
  conf: 0.95
  if:
    type: text
    # reg.exe accepts /t and /d in either order; keep both within one command.
    regex: '(?i)/t\s+REG_DWORD\b[^&|]{0,60}/d\s+1\b|/d\s+1\b[^&|]{0,60}/t\s+REG_DWORD\b'
