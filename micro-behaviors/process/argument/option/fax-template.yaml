# This configuration surface selects arguments for a service executable;
# /c and -c are shell command-mode options, not proof of execution alone.
defaults:
  platforms: [windows, unix]
  for: [source, scripts, text, data]
traits:
  - id: fax-command-template-shell-option
    desc: Fax command arguments specify shell mode
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'system\.scan\.fax\.send\.command-args.{1,12}[-/]c\b'
