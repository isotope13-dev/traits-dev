# XMRig option spellings also occur in ordinary CLI help.
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - batch
  - powershell
  - pe
  - elf
  - macho
traits:
- id: xmrig-algo-randomx-option
  desc: XMRig rx/0 RandomX algo option token
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)--algo=["']?rx/0\b
- id: xmrig-randomx-mode-option
  desc: XMRig randomx-mode option token
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)--randomx-mode=
- id: xmrig-cpu-threads-hint-option
  desc: XMRig cpu-max-threads-hint option token
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)--cpu-max-threads-hint=
