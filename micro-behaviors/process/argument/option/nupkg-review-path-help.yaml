defaults:
  platforms: [windows, unix]
  for: [pe, dll]
traits:
  - id: path-directory-placeholder-help
    desc: --path <dir> target-directory flag
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '--path\s+<(dir|directory|path)>'
      case_insensitive: true
    unless:
      - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-cli-context
