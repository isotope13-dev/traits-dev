traits:
- platforms:
  - unix
  - windows
  for:
  - batch
  - pe
  - go
  - html
  - javascript
  - vbs
  conf: 0.96
  id: powershell-no-profile-flag
  desc: PowerShell disables profile loading
  if:
    type: text
    regex: (?i)\b(powershell|pwsh)(\.exe)?\b[^\r\n]{0,140}-(NoProfile|nop)\b
- platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - pe
  - html
  - text
  - data
  conf: 0.96
  id: powershell-policy-bypass-flag
  desc: PowerShell execution-policy bypass option
  if:
    type: text
    regex: (?i)\b(powershell|pwsh)(\.exe)?\b[^\r\n]{0,100}-(ExecutionPolicy|EP)\s+Bypass\b
  unless:
  - id: well-known/lib/ai/huggingface::hub-utils-package-file
  - id: well-known/lib/ai/huggingface::hub-runtime-bytecode
  - id: well-known/tool/development/observability/datadog-system-tests::system-tests-path
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - go
  - vbs
  - html
  - batch
  - powershell
  - pe
  - oledoc
  conf: 0.9
  id: powershell-policy-bypass-argument
  desc: PowerShell execution-policy bypass argument
  attack: T1059.001,T1562.001
  if:
    type: text
    regex: (?i)(^|[\s"'])(-ExecutionPolicy|-EP|-Exec)[\s"',]+Bypass\b
- platforms:
  - windows
  for:
  - pe
  - pyc
  - powershell
  - python
  attack: T1059.001
  id: powershell-policy-bypass
  desc: PowerShell execution-policy bypass option
  conf: 0.98
  if:
    type: text
    regex: (?im)^[ \t]*(powershell|pwsh)(\.exe)?\b[^\r\n]{0,100}-ExecutionPolicy\s+Bypass\b
- platforms:
  - windows
  conf: 0.88
  id: powershell-c-flag
  desc: PowerShell -Command or -c option text
  for:
  - powershell
  - batch
  - pe
  if:
    type: text
    regex: (?i)\bpowershell(\.exe)?[^\r\n]{0,120}\s+-(c|command)\b
composite_rules:
- platforms:
  - windows
  for:
  - pe
  - pyc
  - powershell
  - python
  attack: T1059.001
  id: powershell-policy-bypass-hidden
  desc: PowerShell policy bypass with hidden window
  conf: 0.99
  all:
  - id: micro-behaviors/fs/path/application/executable::powershell-executable-token
  - id: micro-behaviors/process/argument/option::powershell-policy-bypass
  - id: micro-behaviors/process/argument/option::powershell-windowstyle-hidden-option
  near_bytes: 768
- platforms:
  - windows
  attack: T1564.003
  id: hidden-console-execution
  desc: Hidden or minimized process launch options
  conf: 0.9
  any:
  - id: micro-behaviors/process/create/hidden::conhost-headless
  - id: micro-behaviors/process/create/hidden::conhost-headless-split-join
  - id: micro-behaviors/process/create/hidden::powershell-hidden-window
  - id: micro-behaviors/process/argument/option::powershell-hidden-command-text
  - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
  - id: micro-behaviors/ui/window/state::start-minimized-window
  - id: micro-behaviors/process/create/hidden::sfx-hidcon-prefix
defaults:
  crit: notable
