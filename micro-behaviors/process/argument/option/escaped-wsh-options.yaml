defaults:
  platforms:
  - windows
  for:
  - javascript
  - vbs
  - html
traits:
- id: escaped-executable-noprofile-fragment
  desc: Escaped executable NoProfile option fragment
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: .exe\x20-nop\x20
- id: escaped-noprofile-policy-bypass-fragment
  desc: Escaped NoProfile and policy-bypass fragment
  crit: notable
  conf: 0.96
  if:
    type: text
    substr: -nop\x20-ep\x20b
- id: escaped-file-argument-fragment
  desc: Escaped File option with opening quote
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: \x20-file\x20\x22
