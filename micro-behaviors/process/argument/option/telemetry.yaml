# Command-line options recovered from normalized process events or native
# Linux auditd records. These are neutral argument facts; parent/application
# context determines whether their use is suspicious.
defaults:
  for: [json]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: process-exec-gadget-option
    desc: Process receives an exec gadget option
    if:
      type: value
      path: process.args[*]
      regex: '^-exec(dir)?$'

  - id: auditd-exec-gadget-argument
    desc: Auditd records an exec gadget argument
    platforms: [linux]
    if:
      type: value
      path: log.original
      regex: '\ba[0-9]+="?-exec(dir)?"?(\s|$)'

composite_rules:
  - id: process-exec-gadget
    desc: Process receives an exec gadget
    crit: notable
    any:
      - id: process-exec-gadget-option
      - id: auditd-exec-gadget-argument
