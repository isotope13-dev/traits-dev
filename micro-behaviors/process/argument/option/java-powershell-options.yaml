defaults:
  platforms: [windows]
  for: [class]
  crit: notable
  conf: 0.96
traits:
  - id: jvm-noprofile-option
    desc: JVM constant names the NoProfile option
    if:
      type: value
      path: class.strings[*]
      exact: -NoProfile
  - id: jvm-noninteractive-option
    desc: JVM constant names the NonInteractive option
    if:
      type: value
      path: class.strings[*]
      exact: -NonInteractive
