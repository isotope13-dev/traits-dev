# A policy switch may belong to Set-ExecutionPolicy in the current host;
# it does not establish that a PowerShell process is created.
defaults:
  platforms: [unix, windows]
  for: [python]
  conf: 0.96
traits:
  - id: powershell-policy-bypass-switch-text
    crit: notable
    desc: PowerShell Bypass policy switch text
    for: [powershell]
    if:
      type: text
      regex: '(?i)-(ExecutionPolicy|EP)\s+Bypass\b'

composite_rules:
  - id: powershell-policy-bypass-option-alternatives
    desc: PowerShell policy bypass option forms
    crit: notable
    conf: 0.94
    for: [powershell, python]
    any:
      - id: powershell-policy-bypass-switch-text
      - id: micro-behaviors/process/create/flags::python-powershell-policy-bypass-argv-pair

