defaults:
  platforms: [windows]
  crit: notable
  conf: 0.97

traits:
  - id: text-output-hidden-option
    desc: Output call carries hidden-window option
    for: [c, cpp, python]
    if:
      type: symbol
      kind: call
      regex: '\.(print(ln)?|write)$'
      arg:
        index: 0
        kind: string
        regex: '(?i)-(w|WindowStyle)\s+Hidden\b'

  - id: ducky-hidden-window-output
    desc: Keyboard script types hidden-window option
    for: [text, powershell]
    if:
      type: text
      regex: '(?im)^STRING(LN)?[ \t]+[^\r\n]{0,200}-(w|WindowStyle)\s+Hidden\b'
