defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
traits:
  - id: go-x64-schtasks-hourly-command-setup
    desc: Go x64 schtasks hourly creation argument setup
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        import "pe"
        rule go_schtasks_hourly_command_setup {
          strings:
            $create = { 48 C7 84 24 [4] 07 00 00 00 48 8D 0D [4] 48 89 8C 24 ?? ?? ?? ?? }
            $hour = { 48 C7 84 24 [4] 06 00 00 00 48 8D 0D [4] 48 89 8C 24 ?? ?? ?? ?? }
            $cmd = { 48 8D 05 [4] BB 08 00 00 00 ( 48 8D 8C 24 ?? ?? ?? ?? | 48 8D 4C 24 ?? ) BF 0A 00 00 00 48 89 FE E8 ?? ?? ?? ?? }
          condition:
            pe.machine == pe.MACHINE_AMD64 and
            for any s in (0..pe.number_of_sections - 1) : (
              pe.sections[s].name == ".text" and
              for any i in (1..#create) : (
                @create[i] >= pe.sections[s].raw_data_offset and
                @create[i] < pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size and
                uint32(pe.rva_to_offset(pe.sections[s].virtual_address + @create[i] - pe.sections[s].raw_data_offset + 19 + int32(@create[i] + 15)) + 0) == 0x6572632f and
                        uint16(pe.rva_to_offset(pe.sections[s].virtual_address + @create[i] - pe.sections[s].raw_data_offset + 19 + int32(@create[i] + 15)) + 4) == 0x7461 and
                        uint8(pe.rva_to_offset(pe.sections[s].virtual_address + @create[i] - pe.sections[s].raw_data_offset + 19 + int32(@create[i] + 15)) + 6) == 0x65 and
                for any j in (1..#cmd) : (
                  @cmd[j] > @create[i] and @cmd[j] - @create[i] < 512 and
                  (uint32(pe.rva_to_offset(pe.sections[s].virtual_address + @cmd[j] - pe.sections[s].raw_data_offset + 7 + int32(@cmd[j] + 3))) == 0x74686373 and uint32((pe.rva_to_offset(pe.sections[s].virtual_address + @cmd[j] - pe.sections[s].raw_data_offset + 7 + int32(@cmd[j] + 3))) + 4) == 0x736b7361) and
                  for any k in (1..#hour) : (
                    @hour[k] > @create[i] and @hour[k] < @cmd[j] and
                    int32(@hour[k] + 4) == int32(@create[i] + 4) + 96 and
                    uint32(pe.rva_to_offset(pe.sections[s].virtual_address + @hour[k] - pe.sections[s].raw_data_offset + 19 + int32(@hour[k] + 15)) + 0) == 0x72756f68 and
                        uint16(pe.rva_to_offset(pe.sections[s].virtual_address + @hour[k] - pe.sections[s].raw_data_offset + 19 + int32(@hour[k] + 15)) + 4) == 0x796c
                  )
                )
              )
            )
        }
