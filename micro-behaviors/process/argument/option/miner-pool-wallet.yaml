defaults:
  platforms: [windows, unix]
  for: [scripts, batch, powershell, pe, elf, macho]
traits:
  - id: miner-pool-endpoint-option
    desc: Miner command supplies pool host and port
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(\s-o\s+|--url[=\s]+)([a-z][a-z+.-]{1,12}://)?[a-z0-9.-]+\.[a-z]{2,24}:\d{2,5}\b'
composite_rules:
  # Configuration alone does not prove unauthorized mining or renaming.
  - id: miner-pool-wallet-option-pair
    desc: Miner pool and wallet command options
    crit: notable
    conf: 0.95
    scope: file
    near_bytes: 400
    all:
      - id: miner-pool-endpoint-option
      - id: micro-behaviors/process/argument/authentication::miner-wallet-user-option
