defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-command-option-declaration
    desc: Declares a command CLI option
    if:
      type: symbol
      kind: call
      regex: '\.add_argument$'
      arg:
        index: 0
        kind: string
        regex: '^--(cmd|command)$'
