defaults:
  for: [scripts, source, binaries, -mirc, -ircii, -clojure]
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
traits:
  - id: x264-dump-yuv-option
    size_min: 1
    desc: x264 option dumps video frames
    if:
      type: text
      substr: dump-yuv=
      exclude_comments: true
  - id: x264-stats-output-option
    size_min: 1
    desc: x264 option writes encoder stats file
    if:
      type: text
      regex: '([:"''=&\s]|%3[aAdD])stats(=|%3[dD])[^&\s"''\r\n]{1,256}(\.(so|dll|DLL|yuv|log)|[$%{])'
      exclude_comments: true
