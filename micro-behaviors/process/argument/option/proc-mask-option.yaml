defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: proc-mask-option
    desc: --proc option with a mask argument
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(^|[\s"''`])--proc[ \t](["''][^"'']{1,80}["'']|\S{0,60}[*?]\S{0,40}|\S{1,36}\.exe)'
