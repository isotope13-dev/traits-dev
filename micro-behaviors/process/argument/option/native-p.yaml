defaults:
  platforms: [windows]
  for: [pe, dll]
  conf: 0.95
  size_min: 1000
traits:
  - id: wide-p-option-text
    desc: UTF-16 command text contains a -p option
    crit: notable
    if:
      type: hex
      pattern: '20 00 2d 00 70 00 20 00'
      section: .rdata
    unless:
      - id: well-known/tool/sysadmin/sysinternals::process-explorer-build-identity
