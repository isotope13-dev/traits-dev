defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  # Require command syntax; cmd variable names and mapping keys are inert.
  - id: windows-interpreter-option-syntax
    desc: Windows interpreter command has an option
    if:
      type: text
      case_insensitive: true
      regex: '(^|[^A-Za-z0-9_$-])(pwsh|powershell|cmd)(\.exe)?[ \t]+[-/][A-Za-z]'
