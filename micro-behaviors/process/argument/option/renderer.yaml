# The renderer flag is an ordinary Chromium option, not malicious alone.
# Shell call facts and AST command boundaries were tested: both fold nohup
# into a preceding pipeline in the line-delimited fixture. An anchored command
# pattern recovers that syntax while excluding comments and printed examples.
defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.96

traits:
  - id: shell-renderer-process-option
    desc: Renderer option in launch command text
    if:
      type: text
      regex: '(?m)(^|;)[ \t]*(nohup|setsid|exec)\b[^\n;&|]{1,180}[ \t]["'']?--type=renderer(["''\s]|$)'
  # Python spelling of the same launch shape: the renderer child option sits
  # inside the argument array of a process-launch call, where start_new_session
  # plays setsid's role. Call facts do not expose list-element arguments, so
  # anchor on the launch call's opening bracket; the flag must still be quoted
  # and inside the bracket for the match to land.
  - id: python-renderer-process-option
    desc: Renderer option in Python process launch
    for: [python]
    if:
      type: text
      regex: '\b(Popen|spawn\w*|run\w*)\s*\(\s*\[[^\]\n]{0,200}["'']--type=renderer["'']'
