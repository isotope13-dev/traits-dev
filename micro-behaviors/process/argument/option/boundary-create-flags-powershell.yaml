defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component
  conf: 0.96

traits:
  - id: python-call-noprofile-switch
    desc: Python call passes a -NoProfile/-nop switch
    crit: component
    if:
      type: tree-sitter
      kind: call
      regex: '(?is)\b(os\.system|subprocess\.\w+)\s*\([^)]{0,200}-(NoProfile|nop)\b'

  - id: powershell-hidden-window-flag
    crit: notable
    desc: PowerShell hidden-window option flag
    if:
      type: literal
      exact: -WindowStyle

  - id: powershell-hidden-window-value
    crit: notable
    desc: PowerShell hidden-window option value
    if:
      type: literal
      exact: Hidden

composite_rules:
  - id: python-powershell-no-profile-call
    desc: PowerShell token near Python NoProfile call
    crit: notable
    conf: 0.94
    attack: T1059.001
    all:
      - id: micro-behaviors/process/argument/option::python-call-noprofile-switch
      - id: micro-behaviors/process/argument/executable::python-call-powershell-token
    near_bytes: 128
