defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: busybox-bot-marker-command
    crit: notable
    desc: References BusyBox bot-marker applet syntax
    if:
      type: text
      regex: /bin/busybox\s+(FASTCAT|ECCHI|MIRAI)
  - id: busybox-uppercase-applet-command
    desc: References BusyBox nonstandard applet syntax
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: /bin/busybox\s+[A-Z]{5,10}\b
composite_rules:
  - id: busybox-nonstandard-applet-commands
    desc: References BusyBox nonstandard applet commands
    crit: notable
    conf: 0.95
    any:
      - id: busybox-bot-marker-command
      - id: busybox-uppercase-applet-command
