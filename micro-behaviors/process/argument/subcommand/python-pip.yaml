defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-interpreter-pip-argv
    desc: Builds Python -m pip argument vector
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((list
          . (attribute object: (identifier) @module attribute: (identifier) @exe)
          . (string) @mode
          . (string) @command)
         (#eq? @module "sys") (#eq? @exe "executable")
         (#match? @mode "^['\"]-m['\"]$")
         (#match? @command "^['\"]pip['\"]$"))
