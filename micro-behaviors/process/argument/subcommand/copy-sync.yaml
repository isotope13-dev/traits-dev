defaults:
  platforms: [windows, unix]
  for: [scripts]
  crit: notable
traits:
  - id: executable-copy-subcommand-text
    desc: Executable copy or sync subcommand text
    conf: 0.88
    for: [batch, powershell, shell, scripts]
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '(?i)\.exe[ \t]+(copy|sync)([ \t]|$)'
