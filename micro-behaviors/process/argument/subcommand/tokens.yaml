# Generic CLI subcommand/selector verb tokens ("get", "list", "item",
# "items"). Neutral parsing fragments that appear in countless programs; on
# their own they carry no credential or attack meaning. They exist only to be
# proximity-combined with a specific tool name inside higher-tier composites
# (e.g. `op item get`, `bw list items`). Kept in this neutral tier — not under
# an intent directory — so a bare subcommand literal never inflates a
# whole-directory reference such as `objectives/credential-access` via a
# standalone match.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: component
traits:
  - id: onepassword-cli-name
    desc: Call passes the bare string 'op'
    crit: component
    conf: 0.88
    if:
      type: tree-sitter
      query: |
        ((call
          arguments: (argument_list
            (string) @cmd))
         (#match? @cmd "^['\"]op['\"]$"))
  - id: cli-format-json-flag
    desc: CLI JSON output flag
    crit: notable
    conf: 0.84
    if:
      type: string_literal
      exact: --format=json
  - id: cli-verb-list
    desc: CLI list subcommand token
    conf: 0.82
    if:
      type: string_literal
      exact: list
  - id: cli-verb-item
    desc: CLI item subcommand token
    conf: 0.82
    if:
      type: string_literal
      exact: item
  - id: cli-verb-get
    desc: CLI get subcommand token
    conf: 0.82
    if:
      type: string_literal
      exact: get
  - id: cli-verb-prefs
    crit: notable
    desc: CLI prefs subcommand token
    conf: 0.82
    if:
      type: string_literal
      exact: prefs
  - id: cli-verb-print
    crit: notable
    desc: Process argument list contains print
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((call
          function: (_) @launcher
          arguments: (argument_list
            . [(list (string) @verb) (tuple (string) @verb)])) @call
          (#match? @launcher "^subprocess\\.(run|Popen|check_output|call)$")
          (#match? @verb "^['\"]print['\"]$"))
  - id: cli-verb-token
    desc: CLI token subcommand token
    conf: 0.82
    if:
      type: string_literal
      exact: token
  - id: python-sys-argv-install-membership
    desc: Python checks whether argv contains install
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '["'']install["'']\s+in\s+sys\.argv'
  - id: python-sys-argv-membership-test
    desc: Python argv membership test
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bin\s+sys\.argv'
  - id: python-subprocess-items-argument
    desc: Python subprocess argv contains items
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        ((call
          function: (attribute object: (identifier) @module
                               attribute: (identifier) @method)
          arguments: (argument_list (list (string) @item))) @call
         (#eq? @module "subprocess")
         (#match? @method "^(run|Popen|check_output)$")
         (#match? @item "^['\"]items['\"]$"))
  - id: range-target-flag
    desc: Network range scan target
    crit: notable
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '(?i)\b(h|host)\s+\d{1,3}(\.\d{1,3}){3}/\d{1,2}\b'
  - id: password-file-option
    desc: Scan accepts a password-file option
    crit: notable
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '(?i)(^|[\s"''/])--?password-file(=|\s+)\S+'
  - id: scan-pwdf-flag
    desc: Scan accepts a pwdf option
    crit: notable
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '(?i)(^|[\s"''/])--?pwdf(=|\s+)\S+'
  - id: scan-pass-file-flag
    desc: Scan accepts a pass-file option
    crit: notable
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '(?i)(^|[\s"''/])--?pass-file(=|\s+)\S+'
composite_rules:
  - id: scan-password-file-flag
    desc: Scanner accepts a password-file option
    crit: component
    conf: 0.9
    for: [scripts]
    any:
      - id: password-file-option
      - id: scan-pwdf-flag
      - id: scan-pass-file-flag
