# Underscored operation identifiers appear in RPC methods, API actions, and
# task protocols. These atoms describe the command vocabulary only; callers
# must combine them with concrete file or network behavior before assigning
# intent.
defaults:
  platforms: [unix, windows]
  for:
    [
      scripts,
      source,
      binaries,
      -shell,
      -batch,
      -jcl,
      -ruby,
      -php,
      -perl,
      -lua,
      -powershell,
      -applescript,
      -vbs,
      -c,
      -cpp,
      -swift,
      -objectivec,
      -groovy,
      -kotlin,
      -scala,
      -zig,
      -elixir,
      -dylib,
      -so,
      -dll,
      -class,
      -pyc,
      -beam,
      -wasm,
      -dex,
      -static-lib,
    ]
  crit: component
  conf: 0.9

traits:
  - id: underscored-file-enumeration-command
    desc: Underscored file-enumeration command identifier
    if:
      type: text
      regex: '["''](browse|list|collect)_[A-Za-z0-9_]{1,40}["'']'

  - id: underscored-file-transfer-command
    desc: Underscored file-transfer command identifier
    if:
      type: text
      regex: '["''](upload|download)_[A-Za-z0-9_]{1,40}["'']'
