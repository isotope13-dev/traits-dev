defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.98
traits:
  - id: go-run-child-subcommand
    desc: Go child arguments select run subcommand
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (selector_expression
            operand: (identifier) @pkg field: (field_identifier) @command)
          arguments: (argument_list
            . (interpreted_string_literal) @go
            . (interpreted_string_literal) @run)) @call
          (#eq? @pkg "exec") (#eq? @command "Command")
          (#eq? @go "\"go\"") (#eq? @run "\"run\""))
        ((call_expression
          function: (selector_expression
            operand: (identifier) @pkg field: (field_identifier) @command)
          arguments: (argument_list
            . (_) . (interpreted_string_literal) @go
            . (interpreted_string_literal) @run)) @call
          (#eq? @pkg "exec") (#eq? @command "CommandContext")
          (#eq? @go "\"go\"") (#eq? @run "\"run\""))
