defaults:
  platforms: [windows]
  for: [batch, powershell]

traits:
  # Lua accepts arbitrary script suffixes. The command alone establishes an
  # interpreter argument, not deceptive naming or malicious execution.
  - id: lua-interpreter-text-file-argument
    desc: Lua interpreter takes text-file argument
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(^|[\s&|"''])lua(jit|5[0-9])?(\.exe)?"?\s+"?[^\s"&|]{1,80}\.(txt|log|cfg|ini)\b'
