defaults:
  platforms: [windows, linux, macos]
  for: [json, package.json, text, shell]

traits:
  - id: import-flag-asset-directory
    desc: Import flag references an asset directory
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(--require|--import)[= ]\S{0,60}[/\\](fonts?|im(g|ages?)|icons?)[/\\]\S{1,60}'
      case_insensitive: true

  - id: import-flag-non-script-suffix
    desc: Import flag references a non-script path
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(--require|--import)[= ][^\s"'']{1,80}[/\\][^\s"'']{1,60}\.[a-z]\w{0,4}[^\w./]'
      case_insensitive: true
    not:
      - regex: '(?i)\.(m?js|cjs|[mc]?ts|node)[^\w./]$'

