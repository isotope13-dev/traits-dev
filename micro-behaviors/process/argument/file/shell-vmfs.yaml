defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: shell-vmfs-program-target
    desc: Invokes program with VMFS path argument
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '^(\./|/)[A-Za-z0-9._/-]{1,160}$'
      arg:
        kind: identifier
        name_regex: '^/vmfs(/|$)'
