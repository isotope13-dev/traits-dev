defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  # A command template supplies a script argument; it does not establish
  # that the template ran or what the referenced script implements.
  - id: python-script-command-line
    desc: Python command line specifies script path
    crit: notable
    conf: 0.99
    for: [text, shell, batch, powershell]
    if:
      type: text
      regex: '(?m)^[ \t]*python[23]?(\.exe)?[ \t]+[\w./\\:-]+\.py([ \t]|$)'

  # Python sibling of spawn-variable-program: the interpreter is a literal,
  # but the script argument is a bare variable or dotted path --
  # `subprocess.run(["python", helper_path])`. That is the launcher shape of a
  # staged second stage; benign build/test launchers mostly pass literal
  # script names. Composite objectives (dropper, remote fetch) supply the
  # hostile context.
  - id: python-variable-script-argv
    desc: Python argv has variable script path
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\[\s*["'']([A-Za-z0-9_./\\-]*python[\w.]*|py)["'']\s*,\s*[A-Za-z_][\w.]*\s*[,)\]]'
