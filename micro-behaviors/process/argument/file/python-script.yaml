defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  # A command template supplies a script argument; it does not establish
  # that the template ran or what the referenced script implements.
  - id: python-script-command-line
    desc: Python command line specifies script path
    crit: notable
    conf: 0.99
    for: [text, shell, batch, powershell]
    if:
      type: text
      regex: '(?m)^[ \t]*python[23]?(\.exe)?[ \t]+[\w./\\:-]+\.py([ \t]|$)'

  # Argument syntax alone does not prove download, staging or execution.
  # Keep this canonical for Python, Node and shell interpreter argv lists.
  - id: interpreter-variable-script-argv
    desc: Interpreter argv has variable script path
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\[\s*["'']([\w./\\-]*python[\w.]*|node|(ba)?sh|py)["'']\s*,\s*[^\W\d][\w.]*\s*[]),]'
