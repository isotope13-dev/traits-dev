# Node accepts JavaScript source irrespective of the entry file suffix.
# A nonstandard suffix alone establishes neither deception nor harmful code.
defaults:
  platforms: [windows, linux, macos]
  for: [json]
traits:
  # An extensionless entry may resolve to a .js file, an exact file, or a
  # directory module. Its basename alone establishes none of those forms,
  # nor that code is hidden in an asset directory. For example, the normal
  # build command `node build/icons` resolves to build/icons.js.
  - id: node-entry-asset-basename
    desc: Node command targets asset-like basename
    crit: notable
    conf: 0.9
    for: [json, package.json]
    if:
      type: text
      regex: '[\s";&|(]node(\.exe)?\s+\S{0,60}[/\\](fonts?|im(g|ages?)|icons?)["\s;&|)]'

  # Any JSON command string: VS Code tasks, per-OS command blocks, and the
  # tasks block some campaigns embed in workspace settings.
  - id: node-task-executes-non-script-suffix
    desc: Node command runs a non-script-suffix file
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '[";&|(]\s*node(\.exe)?(\s+-\S{0,40}){0,3}\s+[^"\s-][^"\s]{0,99}\.[a-z]\w{0,4}[^\w./]'
    not:
      - regex: '(?i)\.(m?js|cjs|[mc]?ts|[jt]sx|json|node)\W?$'
      - regex: '(?i)\.(woff2?|[ot]tf|eot)\W?$'
      # `-e/--eval/-p` run the next argument as code, not as a file path.
      - regex: '\s(-e|--eval|-p|--print)(\s|=)'
      # Node resolves an extensionless compound name (`retry.integ.spec`) to
      # `.spec.js`; these trailing words are conventions, not real suffixes.
      - regex: '(?i)\.(spec|test|e2e|bench|cy|min|dev|prod)\W?$'
      - regex: '(?i)\.(conf|config|setup|mock|fixtures?|stories|story|worker)\W?$'
      # Prose cites source files after `node` ("(node route_registry.rs)");
      # node cannot execute another language's source, so a source suffix
      # here is a documentation reference, not a masqueraded payload.
      # Unanchored like the matcher itself: citations sit mid-sentence.
      - regex: '(?i)\.(rs|go|py|rb|java|c|cpp|h|hpp|cs|php|swift|kt|scala|lua)[^\w./]'

  - id: node-runs-hidden-data-file
    desc: Node runs hidden data-suffixed file
    crit: suspicious
    conf: 0.92
    for: [json, package.json, shell]
    if:
      type: text
      regex: '\bnode\s+\S{0,60}/\.[\w-]{1,30}/\S{1,80}\.(png|jpg|dat|bin|db|txt|css)([\s";|)]|$)'
    not:
      # Claude Code hook commands reference $CLAUDE_PROJECT_DIR/.claude/hooks.
      - regex: '(?i)\$CLAUDE_PROJECT_DIR[\\/]\.claude[\\/]hooks'
      - regex: '(?i)\.claude[\\/]hooks[\\/]'
      # npm/yarn/pnpm executables linked into node_modules/.bin
      - regex: '(?i)node_modules[\\/]\.bin[\\/]'

  - id: vscode-task-folder-open-hidden-txt-command
    desc: Folder-open task targets hidden txt Node file
    crit: notable
    conf: 0.94
    if:
      type: value
      path: tasks[*]
      size_min: 3
      size_max: 32
      regex: '^\{[^{}]*"command":"node [^" ]*/\.[^" ]+\.txt"[^{}]*"runOptions":\{"runOn":"folderOpen"'

  - id: vscode-task-folder-open-hidden-txt-runoptions
    desc: Folder-open precedes hidden txt Node command
    crit: notable
    conf: 0.94
    if:
      type: value
      path: tasks[*]
      size_min: 3
      size_max: 32
      regex: '^\{[^{}]*"runOptions":\{"runOn":"folderOpen"\}[^{}]*"command":"node [^" ]*/\.[^" ]+\.txt"'

composite_rules:
  - id: vscode-folder-open-node-data-target
    desc: Folder-open Node target has nonstandard suffix
    crit: notable
    conf: 0.97
    all:
      - id: metadata/permission/activation::vscode-task-folder-open-activation
      - id: node-task-executes-non-script-suffix
