traits:
- crit: notable
  platforms:
  - unix
  - windows
  for:
  - powershell
  id: powershell-script-file-option-string
  desc: PowerShell string contains a script-file option
  conf: 0.85
  attack: T1059.001
  if:
    type: literal
    regex: (?is)(powershell|pwsh).{0,80}-File
- id: powershell-script-file-option-text
  desc: PowerShell command text selects a script file
  crit: notable
  conf: 0.92
  platforms: [windows]
  # Compiled launchers embed the same command line in string literals.
  for: [scripts, source]
  attack: T1059.001
  if:
    type: text
    regex: '(?i)\b(powershell|pwsh)(\.exe)?\b[^\r\n]{0,120}\s-(File|f)\s+["'']?[^"\r\n]{1,260}\.ps1\b'
- for:
  - pe
  - dll
  platforms:
  - windows
  id: quoted-dll-export-argument
  desc: Quoted DLL path with export argument
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: \\[^\\\r\n]{1,100}\.dll",[ \t]*[A-Za-z_][A-Za-z0-9_]{2,40}
- id: dll-init-export-command-format
  desc: DLL init-export command-line format string
  crit: notable
  conf: 0.95
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    regex: ^%s "%s",init( %s)?$
