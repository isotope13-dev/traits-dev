defaults:
  platforms: [windows]
  for: [batch, powershell, text, html, javascript, pe, dll]

traits:
- id: task-xml-unc-argument
  desc: Task option with UNC XML path
  crit: component
  conf: 0.93
  if:
    type: text
    regex: '(?i)/(xml|tn)\s+["'']?\\\\[^\s\\]{1,120}\\[^\s]{1,120}\.xml\b'
    case_insensitive: true
- id: task-xml-url-argument
  desc: Task option with XML URL
  crit: notable
  conf: 0.9
  if:
    type: text
    # Anchored on the task-definition switch, exactly like the UNC sibling
    # above. Without it the matcher was "any http(s) URL ending in .xml",
    # which every sitemap, feed, POM and XSD reference satisfies — a two-line
    # robots.txt (`Sitemap: https://auto-editor.com/sitemap.xml`) was reported
    # as a ClickFix scheduled-task fragment.
    regex: '(?i)/(xml|tn)\s+["'']?https?://[^\s]{1,200}\.xml\b'
    case_insensitive: true

composite_rules:
- id: task-xml-remote-argument
  desc: Task option with remote XML reference
  crit: component
  conf: 0.93
  any:
  - id: micro-behaviors/process/argument/file::task-xml-unc-argument
  - id: micro-behaviors/process/argument/file::task-xml-url-argument
