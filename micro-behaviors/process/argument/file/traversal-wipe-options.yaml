# Directory recursion-depth and file/log wipe command-line options.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, elf, macho, pe]
  crit: notable

traits:
  - id: wipe-cli-option
    desc: Wipe CLI option (/wipe or --wipe)
    conf: 0.88
    if:
      type: text
      regex: '(?i)(^|[\s"''`])(/|--?)wipe($|[\s"''`=])'

  - id: depth-cli-option-token
    desc: Traversal depth CLI option (/depth, --depth)
    conf: 0.85
    if:
      type: text
      regex: '(?i)(^|["''`])(/|--)depth($|["''`=\s])'

  - id: depth-cli-numeric-arg
    desc: Traversal depth CLI option with limit
    conf: 0.9
    if:
      type: text
      regex: '(?i)(^|[\s"''`])(/|--?)depth[= \t]+[0-9]{1,3}\b'

composite_rules:
  - id: depth-cli-option
    desc: Directory traversal depth command-line option
    conf: 0.88
    any:
      - id: depth-cli-option-token
      - id: depth-cli-numeric-arg
