# File/log wipe command-line option.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, elf, macho, pe]
  crit: notable

traits:
  - id: wipe-cli-option
    desc: Wipe CLI option (/wipe or --wipe)
    conf: 0.88
    if:
      type: text
      regex: '(?i)(^|[\s"''`])(/|--?)wipe($|[\s"''`=])'
