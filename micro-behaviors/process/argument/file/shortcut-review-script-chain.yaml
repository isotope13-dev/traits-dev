defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-script-engine-temp-argument
    desc: LNK script engine options reference temp path
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: '//E:\S{1,24}\s+//B\s+%TEMP%'
      case_insensitive: true
