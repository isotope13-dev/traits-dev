---
defaults:
  platforms:
  - windows
  for:
  - lnk
traits:
- id: lnk-args-msi-or-exe-stage
  desc: LNK arguments reference MSI or executable
  crit: notable
  conf: 0.92
  if:
    type: value
    path: lnk.arguments
    regex: (?i)(^|[\s"&|])[^\s"&|]{1,80}\.(msi|exe|scr)\b
- id: lnk-args-script-stage
  desc: LNK arguments reference a script path
  crit: notable
  conf: 0.92
  if:
    type: value
    path: lnk.arguments
    regex: (?i)(^|[\s"&|])[^\s"&|]{1,80}\.(bat|cmd|vbs)\b
- id: lnk-msi-package-argument
  desc: LNK arguments reference MSI package
  crit: notable
  conf: 0.94
  if:
    type: value
    path: lnk.arguments
    regex: (?i)(^|[\s"&|])[^\s"&|]{1,120}\.msi\b
