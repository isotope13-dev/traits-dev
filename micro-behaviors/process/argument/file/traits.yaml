defaults:
  platforms: [windows]
  for: [batch, lua, text]

traits:
  - id: executable-data-or-script-file-argument
    desc: Executable invoked with data or script file
    crit: notable
    conf: 0.95
    if:
      type: text
      # Horizontal whitespace prevents separate word-list lines from being
      # mistaken for a process invocation.
      regex: '\b[A-Za-z0-9._-]+\.exe[ \t]+[A-Za-z0-9._%\\/-]+\.(lua|txt|log|dat)\b'
