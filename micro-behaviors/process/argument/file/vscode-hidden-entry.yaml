# A normal hidden .js entry remains an ordinary capability. The bound
# folder-open observations below reject Node source suffixes and entry-name
# conventions; media/data suffixes and other unusual suffixes remain visible.
# Each value matcher reads one task object, preserving the source/trigger
# relationship. Collection size limits reject JSON-text impostors in tasks[].
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.97

traits:
  - id: node-task-hidden-file-entry
    desc: Node task declares a dot-path entry
    if:
      type: value
      path: tasks[*].command
      regex: '^node ([^"\s]*/)?\.[^"\s]+\.\w+$'
  - id: node-task-folder-open-hidden-atypical-command-first
    desc: Hidden Node autorun (command first)
    if:
      type: value
      path: tasks[*]
      size_min: 3
      size_max: 32
      regex: '^\{[^{]*"command":"node ([^"]*/)?\.[^"]+\.\w+"[^{}]*"runOptions":\{"runOn":"folderOpen"'
    not:
      - regex: '"command":"node [^"]* [^"]*"'
      - regex: '"command":"node [^"]*\\[tnr][^"]*"'
      - regex: '(?i)"command":"node [^"]*\.(m?js|cjs|[mc]?ts|[jt]sx|json|node)"'
      - regex: '(?i)"command":"node [^"]*\.(spec|test|e2e|bench|cy|min|dev|prod)"'
      - regex: '(?i)"command":"node [^"]*\.(conf|config|setup|mock|fixtures?|stories|story|worker)"'
      - regex: '(?i)"command":"node [^"]*\.(rs|go|py|rb|java|c|cpp|h|hpp|cs|php|swift|kt|scala|lua)"'
      - regex: '(?i)"command":"node [^"]*\.(sh|bash|zsh|ps1|bat|cmd|vbs)"'
  - id: node-task-folder-open-hidden-atypical-trigger-first
    desc: Hidden Node autorun (trigger first)
    if:
      type: value
      path: tasks[*]
      size_min: 3
      size_max: 32
      regex: '^\{[^{]*"runOptions":\{"runOn":"folderOpen"}[^{}]*"command":"node ([^"]*/)?\.[^"]+\.\w+"'
    not:
      - regex: '"command":"node [^"]* [^"]*"'
      - regex: '"command":"node [^"]*\\[tnr][^"]*"'
      - regex: '(?i)"command":"node [^"]*\.(m?js|cjs|[mc]?ts|[jt]sx|json|node)"'
      - regex: '(?i)"command":"node [^"]*\.(spec|test|e2e|bench|cy|min|dev|prod)"'
      - regex: '(?i)"command":"node [^"]*\.(conf|config|setup|mock|fixtures?|stories|story|worker)"'
      - regex: '(?i)"command":"node [^"]*\.(rs|go|py|rb|java|c|cpp|h|hpp|cs|php|swift|kt|scala|lua)"'
      - regex: '(?i)"command":"node [^"]*\.(sh|bash|zsh|ps1|bat|cmd|vbs)"'
