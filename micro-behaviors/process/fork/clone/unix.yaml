defaults:
  platforms: [linux, macos, android]
  for: [scripts, binaries]
traits:
  - id: fork
    desc: Process creation via fork or clone
    crit: notable
    conf: 0.86
    for:
      - elf
      - macho
    if:
      type: symbol
      regex: '^(fork|vfork|clone[0-9]?)$'
  - id: daemon-dup
    desc: Daemonize process
    crit: notable
    conf: 0.66
    for:
      - elf
      - macho
    if:
      type: symbol
      exact: daemon
  - id: python-os-fork
    desc: Python os.fork() call
    crit: baseline
    conf: 0.8
    for: [python]
    if:
      type: symbol
      kind: call
      exact: os.fork
  - id: python-os-fork-string
    desc: Python os.fork() call (string)
    crit: baseline
    conf: 0.6
    for: [python]
    if:
      type: text
      substr: os.fork()
  - id: c-fork-call
    desc: C fork child process
    crit: baseline
    conf: 0.8
    for: [c, cpp]
    if:
      type: text
      regex: '\bfork\s*\(\s*\)'
  # SYS_clone = 56 (0x38). Stripped static ELFs lose fork/clone symbols;
  # the immediate+syscall sequence still marks process duplication.
  - id: x86-64-clone-syscall
    desc: Direct x86-64 clone syscall
    crit: notable
    conf: 0.9
    platforms: [linux]
    for: [elf]
    if:
      type: hex
      section: text
      pattern: "B8 38 00 00 00 0F 05"
    unless:
      - id: metadata/lang/compiler/systems::go-binary
  - id: m68k-fork-syscall
    desc: Direct m68k fork syscall wrapper
    crit: notable
    conf: 0.99
    platforms: [linux]
    for: [elf]
    if:
      type: hex
      offset_range: [64, null]
      pattern: "4E 56 FF F8 70 02 4E 40 2D 40 FF F8"
  - id: fork-syscall
    desc: Process creation via fork syscall
    crit: notable
    conf: 0.8
    for: [elf, macho]
    if:
      type: syscall
      name: [fork, vfork, clone]
    unless:
      - id: metadata/lang/compiler/systems::go-binary

composite_rules:
  - id: process-creation-primitive
    desc: Process creation via fork or clone evidence
    crit: notable
    conf: 0.88
    for: [c, cpp, elf, macho, python]
    any:
      - id: c-fork-call
      - id: fork
      - id: fork-syscall
      - id: python-os-fork
      - id: python-os-fork-string
      - id: x86-64-clone-syscall
      - id: m68k-fork-syscall
