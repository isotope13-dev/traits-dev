defaults:
  platforms:
  - linux
  - macos
  - android
  for:
  - scripts
  - binaries
traits:
- id: daemon-dup
  desc: Daemonize process
  crit: notable
  conf: 0.66
  for:
  - elf
  - macho
  if:
    type: symbol
    exact: daemon
- id: python-fork-child-branch
  desc: Python forks and enters the child
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: os\.fork\(\)[^\n]{0,40}\n\s*if\s+\w+\s*==\s*0
