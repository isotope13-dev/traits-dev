# Branching on what fork() returned. The parent gets the child's PID and the
# child gets 0, so this comparison is how a program tells the two halves apart
# and gives each a different job. Neutral -- it is the first line of every
# correct use of fork -- and recorded here because its absence is the whole
# difference between a pre-forking server and a fork bomb: code that never
# looks at the return value has both halves loop and fork again. The DoS
# composites in objectives/impact/dos/fork-bomb/ read it from `unless:`.
defaults:
  for: [python]
  platforms: [unix]
  crit: notable
  conf: 0.9

traits:
  - id: python-fork-return-branch
    desc: Python branches on the fork return value
    if:
      type: text
      regex: '(?m)^\s*(pid|child|cpid|childpid)\s*=\s*os\.fork\s*\(\s*\)'
      case_insensitive: true

  - id: python-fork-child-zero-test
    desc: Python tests for the fork child branch
    if:
      type: text
      regex: '\bif\s+(not\s+)?\w*pid\w*\s*(==\s*0)?\s*:'
      case_insensitive: true
