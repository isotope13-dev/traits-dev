defaults:
  platforms: [unix]
  for: [php]

traits:
  - id: pcntl-fork
    desc: Process fork via pcntl_fork()
    crit: notable
    conf: 0.8
    mbc: "C0032"
    if:
      type: symbol
      exact: pcntl_fork
    unless:
      - id: metadata/library/generated::php-manual-empty-function-stubs

  - id: pcntl-waitpid
    desc: Wait for child process
    crit: baseline
    conf: 0.6
    if:
      type: symbol
      exact: pcntl_waitpid
