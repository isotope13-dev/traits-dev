defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  # Binds WebExtension scripting.executeScript in MAIN world to dynamic JS
  # evaluation (direct or indirect eval) in the injected function, covering
  # concise arrows, block returns, and function expressions.
  - id: main-world-eval-argument-injection
    desc: Main-world function evaluates supplied argument
    crit: notable
    conf: 0.96
    near_bytes: 360
    all:
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
      - id: micro-behaviors/process/inject/webextension::chrome-scripting-main-world
    any:
      - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-raw
