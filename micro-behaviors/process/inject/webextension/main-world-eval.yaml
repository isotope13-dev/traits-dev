defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: main-world-eval-argument-injection
    desc: Main-world function evaluates supplied argument
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @execute)
          arguments: (arguments (object
            (pair key: (property_identifier) @world value: (string) @main)
            (pair key: (property_identifier) @func value: (arrow_function
              parameter: (identifier) @parameter
              body: (statement_block (expression_statement (call_expression
                function: (parenthesized_expression (sequence_expression
                  (number) @zero (identifier) @eval))
                arguments: (arguments (identifier) @evaluated))))))
            (pair key: (property_identifier) @args value: (array))))) @injection
          (#eq? @execute "executeScript")
          (#eq? @world "world") (#match? @main "^[\"']MAIN[\"']$")
          (#eq? @func "func") (#eq? @args "args")
          (#eq? @zero "0") (#eq? @eval "eval")
          (#eq? @parameter @evaluated))
