defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96
traits:
  - id: tabs-execute-member-code
    desc: tabs.executeScript takes member-valued code
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression
            object: (member_expression property: (property_identifier) @tabs)
            property: (property_identifier) @execute)
          arguments: (arguments
            (_)
            (object
              (pair key: (property_identifier) @code
                value: (member_expression))))) @call
          (#eq? @tabs "tabs")
          (#eq? @execute "executeScript")
          (#eq? @code "code"))
