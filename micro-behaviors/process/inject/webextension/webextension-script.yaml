defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
traits:
- id: extension-storage-script-injection
  desc: Injects stored script into page DOM
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: storage\.local\.get[\s\S]{0,220}(prepend|append)\([^)]{0,80}<script
- id: chrome-scripting-api
  desc: Uses the Chrome extension scripting API
  if:
    type: symbol
    kind: member
    regex: ^chrome\.scripting\.[A-Za-z_]
- id: webextension-scripting-execute
  desc: Injects code through WebExtension scripting API
  if:
    type: symbol
    kind: call
    regex: ^(chrome|browser)\.scripting\.executeScript$
- id: chrome-scripting-main-world
  desc: Extension injects main-world script
  conf: 0.88
  ref: sha256:afbffa38a490d43ff8e56a13b0a4b4fbde5c87b06d53d90898d9e7e2fcd08f40
  if:
    type: text
    regex: (chrome|browser)\.scripting\.ExecutionWorld\.MAIN\b|world\s*:\s*["']MAIN["']
- id: chrome-scripting-insert-css
  desc: Chrome scripting insertCSS injection
  crit: baseline
  if:
    type: text
    regex: (chrome|browser)\.scripting\.insertCSS\b
- id: chrome-tabs-execute-script
  desc: MV2 tabs.executeScript injection
  if:
    type: text
    regex: (chrome|browser)\.tabs\.executeScript\b
- id: chrome-webview-execute-script
  desc: Chrome app injects script into embedded WebView
  if:
    type: symbol
    kind: call
    exact: webview.executeScript
- id: firefox-page-function-export
  desc: Exports a content-script function into the page
  conf: 0.9
  if:
    type: text
    regex: wrappedJSObject[\s\S]{0,400}\bexportFunction\s*\(
composite_rules:
- id: extension-page-script-injection
  desc: Extension injects page script
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/ui/window/insert-html::browser-create-script-element
  - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-get-url
  near_bytes: 4096
- id: active-tab-scripting-authority
  for:
  - javascript
  - typescript
  - chrome-manifest
  - crx
  - xpi
  - zip
  desc: Can inject code into a user-selected active tab
  crit: notable
  conf: 0.94
  ref: sha256:14e6689d364517cfb12e021b84a1ef2e97550a387fcadde09fe40c706098410a
  scope: archive
  all:
  - id: webextension-scripting-execute
  - id: metadata/permission/manifest::permission-scripting
  - id: metadata/permission/active-tab::permission-active-tab
  unless:
  - id: well-known/app/security/bitwarden::bitwarden-extension-manifest
- id: scripting-location-navigation
  desc: Script injection paired with page navigation
  crit: notable
  conf: 0.9
  all:
  - id: webextension-scripting-execute
  - id: micro-behaviors/ui/window/navigation::browser-location-href-assign
  near_lines: 80
