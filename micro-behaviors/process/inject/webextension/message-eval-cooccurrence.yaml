# Required facts co-occur; the matcher does not bind message data to eval.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, chrome-manifest, crx, zip]

traits:
- id: message-handler-code-argument-injection
  desc: Message listener injects a code member
  crit: notable
  conf: 0.97
  for: [javascript, typescript]
  if:
    type: tree-sitter
    query: |
      ((call_expression
         function: (member_expression
           object: (member_expression property: (property_identifier) @event)
           property: (property_identifier) @method)
         arguments: (arguments (arrow_function) @listener))
       (#eq? @event "onMessage")
       (#eq? @method "addListener")
       (#match? @listener "executeScript\\s*\\([\\s\\S]*args\\s*:\\s*\\[\\w+\\.(code|script|source)")
       (#match? @listener "\\(\\s*0\\s*,\\s*eval\\)\\s*\\("))
composite_rules:
  - id: extension-message-eval-injection-cooccurrence
    desc: Extension messaging, indirect eval and script injection co-occur
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/communications/ipc/message::chrome-runtime-on-message
      - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-variable
      - id: micro-behaviors/process/inject/webextension::webextension-scripting-execute
