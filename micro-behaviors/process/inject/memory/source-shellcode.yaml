defaults:
  platforms: [unix]
  for: [c, cpp]
composite_rules:
- id: memory-descriptor-shellcode-write-profile
  desc: Memory-descriptor write with shellcode text
  crit: suspicious
  conf: 0.85
  all:
  - id: micro-behaviors/fs/write/file/descriptor::write-mem-fd-call
  - id: micro-behaviors/fs/file/seek::lseek-code-cave-offset
  any:
  - id: metadata/lang/source/literal/value::code-cave-reference
  - id: metadata/lang/source/literal/value::shellcode-write-string
  - id: metadata/lang/source/literal/value::got-overwrite-string
  - id: metadata/lang/source/naming/resource::mem-fd-identifier-repeated
  needs: 2
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
