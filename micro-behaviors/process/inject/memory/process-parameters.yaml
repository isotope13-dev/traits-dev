# Windows process-parameter access primitives used by injectors and process
# inspection tools. Intent is established by composites in objectives/.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, go, python]
  attack: T1055

traits:
  - id: peb-base-address-member
    desc: Accesses a process PEB base address
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: member
      regex: '\.PebBaseAddress$'

  - id: peb-process-parameters-member
    desc: Accesses the PEB ProcessParameters pointer
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: member
      regex: '\.ProcessParameters$'

  - id: process-parameter-payload-buffer-member
    desc: Accesses an RTL process-parameter buffer
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: member
      regex: '\.(ShellInfo|CommandLine|WindowTitle|RuntimeData|DllPath|ImagePathName)\.Buffer$'

  - id: rtl-process-environment-field-access
    desc: Accesses the RTL process environment field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?s)\bRTL_USER_PROCESS_PARAMETERS\b.{0,800}\.[A-Za-z_][A-Za-z0-9_]*Environment\b'

composite_rules:
