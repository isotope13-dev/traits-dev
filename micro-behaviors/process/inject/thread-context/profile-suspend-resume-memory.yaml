defaults:
  platforms:
    - unix
    - windows
  for:
    - binaries
  size_max: 52428800

composite_rules:
  - id: process-thread-context-api-profile
    desc: Process creation and thread context APIs
    crit: suspicious
    conf: 0.9
    for:
      - pe
    all:
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/mem/sync/cache::instruction-cache-flush
      - id: micro-behaviors/process/info/thread::resume-thread-import
    unless:
      - id: metadata/binary/symbols/count::many-exports
      - id: metadata/binary/symbols/count::many-imports
      - id: well-known/game/steam/
      - id: well-known/app/utility/locale-injection/
    downgrade:
      any:
        - id: well-known/tool/reverse-engineering/windows-debugger/
        - id: well-known/tool/reverse-engineering/ida-debugger::ida-debugger-server
  - id: suspend-resume-memory-api-profile
    desc: Suspend resume and process memory APIs
    crit: suspicious
    conf: 0.88
    for:
      - pe
    platforms:
      - windows
    all:
      - id: micro-behaviors/process/thread/lifecycle::suspend-thread-repeated-name
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/process/attach/rights::open-process
