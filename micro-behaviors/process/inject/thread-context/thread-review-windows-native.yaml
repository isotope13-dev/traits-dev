defaults:
  for:
    - pe
  platforms:
    - windows

composite_rules:
  - id: suspended-child-remote-write-context-apis
    desc: Suspended child remote write and context APIs
    crit: suspicious
    conf: 0.98
    for:
      - c
      - csharp
    all:
      - id: micro-behaviors/process/config/launch::create-suspended-flag-reference
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-source
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
      - id: micro-behaviors/process/info/thread::get-thread-context
      - id: micro-behaviors/process/thread/config::set-thread-context
    any:
      - id: micro-behaviors/process/thread/lifecycle::resume-thread
      - id: micro-behaviors/process/info/thread::resume-thread-source
  - id: ntapi-memory-context-heavens-gate
    desc: NT memory context and Heaven’s Gate
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/inject/runtime/ntapi::nt-memory-protection-write-api-cluster
      - id: micro-behaviors/process/inject/runtime/ntapi::nt-get-context-thread-reference
      - id: micro-behaviors/process/inject/runtime/ntapi::nt-set-context-thread-reference
      - id: micro-behaviors/os/compat/wow64::x86-heavens-gate-transition
