defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Actual CIL calls, rather than unused P/Invoke declarations. This remains
  # a call profile: no shared process handle or successful pivot is asserted.
  - id: managed-unmap-write-context-resume-calls
    desc: Managed unmap, write and thread-context calls
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/mem/unmap::managed-section-unmap-call
      - id: micro-behaviors/mem/write/arbitrary::process-memory-write-call
      - id: micro-behaviors/process/thread/config::managed-thread-context-write-call
      - id: micro-behaviors/process/thread/lifecycle::resume-thread-call
