defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Actual CIL calls, rather than unused P/Invoke declarations. This remains
  # a call profile: no shared process handle or successful pivot is asserted.
  - id: managed-unmap-write-context-resume-calls
    desc: Managed unmap, write and thread-context calls
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/mem/unmap::managed-zw-unmap-view-call
      - id: micro-behaviors/mem/write/arbitrary::managed-write-process-memory-call
      - id: micro-behaviors/process/thread/config::managed-set-thread-context-call
      - id: micro-behaviors/process/thread/lifecycle::managed-resume-thread-call
