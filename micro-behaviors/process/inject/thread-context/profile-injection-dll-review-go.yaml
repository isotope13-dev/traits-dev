defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: go-cshared-context-memory-api-profile
    desc: Go DLL thread-context and memory APIs
    # Go's Windows runtime uses thread contexts for preemption and virtual
    # memory APIs for its heap. SyscallN dispatch and short local build paths
    # also occur in ordinary c-shared database drivers (e.g. teradatasql).
    # These imports establish an API profile, not cross-process injection.
    crit: notable
    conf: 0.98
    all:
      - id: metadata/lang/go-build::go-cshared-dll
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/mem/combined::virtual-memory-allocation-protection-api-pair
    any:
      - id: metadata/lang/compiler/systems::go-opaque-module-path
      - id: metadata/lang/compiler/systems::go-opaque-build-path
      - id: micro-behaviors/os/api-resolution/manual::go-syscall-dynamic-api-dispatch
