# API/reference conjunction only; no calls, shared buffer or hostile purpose proved.
# Keep mechanics visible without asserting a child-image injection sequence.
defaults:
  platforms:
  - unix
  - windows
  for:
  - binaries
  size_max: 52428800
composite_rules:
- id: child-remote-memory-thread-context-api-set
  desc: Remote-memory and thread-context API set
  crit: notable
  conf: 0.97
  attack: T1055.012
  all:
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
  - id: micro-behaviors/process/info/thread::set-thread-context-import
  unless:
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/tool/development
  - id: metadata/binary/vendor/
  - id: well-known/lib/platform/easyhook/
