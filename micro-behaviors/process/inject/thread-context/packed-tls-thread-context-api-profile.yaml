defaults:
  platforms: [windows]
  for: ["pe", "dll"]

composite_rules:
- id: packed-tls-thread-context-api-profile
  desc: Packed TLS and thread context API profile
  crit: suspicious
  conf: 0.99
  all:
  - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
  - id: metadata/binary/section/entropy::random-exec-payload-section
  - id: metadata/file/encoding/base64::pe-dense-data-base64-like-blobs
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: micro-behaviors/process/info/thread::get-thread-context-import
  - id: micro-behaviors/process/info/thread::set-thread-context-import
  - id: micro-behaviors/process/info/thread::resume-thread-import
  unless:
  - id: metadata/installer/product/
