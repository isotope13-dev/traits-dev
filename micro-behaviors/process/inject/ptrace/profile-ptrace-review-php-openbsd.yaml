defaults:
  platforms: [openbsd, bsd, unix]
  for: [php]

composite_rules:
  - id: php-ptrace-name-and-probe
    desc: PHP injection name and process probe
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/lang/source/naming/injection::php-ptrace-injection-name
      - id: micro-behaviors/process/info/query::php-proc-open-kill-probe
