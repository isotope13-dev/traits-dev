# Bundler plugin hooks that rewrite the application's HTML entry document at
# build time. Vite's `transformIndexHtml`, webpack's HtmlWebpackPlugin hooks,
# and Rollup's equivalents all let a dependency add markup — usually a script
# tag — into every page the project ships.
#
# This is a normal plugin capability (analytics, CSP nonces, preload hints) and
# stays neutral here. It matters because it is also the quietest place in a
# JavaScript project to put attacker code: nothing appears in the repository's
# own source, and the injected script only exists in the build output.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
  attack: T1195.002

traits:
  - id: vite-transform-index-html-hook
    desc: Plugin implements the HTML transform hook
    if:
      type: text
      regex: '\btransformIndexHtml\b'

  # The hook's return value describes the markup to add. A `tag: 'script'`
  # descriptor with an `injectTo` placement is the plugin API's way of saying
  # "run this code on every page".
  - id: build-plugin-script-tag-descriptor
    desc: Build plugin emits a script tag descriptor
    if:
      type: text
      regex: 'tag\s*:\s*[''"]script[''"]'

  - id: build-plugin-inject-to-placement
    desc: Build plugin selects HTML injection point
    if:
      type: text
      regex: 'injectTo\s*:\s*[''"](head|body)'

composite_rules:
  - id: build-plugin-injects-page-script
    desc: Build plugin injects a script into every page
    crit: notable
    conf: 0.94
    all:
      - id: vite-transform-index-html-hook
      - id: build-plugin-script-tag-descriptor
    any:
      - id: build-plugin-inject-to-placement
      - id: micro-behaviors/ui/window/manage/dom::browser-create-script-element
