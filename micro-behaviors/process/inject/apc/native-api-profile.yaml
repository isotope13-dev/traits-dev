defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: remote-write-apc-import-profile
    desc: Remote-memory and APC API import profile
    crit: notable
    conf: 0.96
    size_max: 5242880
    all:
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: metadata/file/profile/memory-protection-api::virtual-protect-ex
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/os/callback/apc::queue-user-apc
