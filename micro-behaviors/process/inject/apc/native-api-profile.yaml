defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: remote-write-apc-import-profile
    desc: Remote-memory and APC API import profile
    crit: notable
    conf: 0.96
    size_max: 5242880
    all:
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/mem/protect/modify::virtual-protect-ex
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/os/callback/apc::queue-user-apc
    unless:
      - id: metadata/binary/framework/
      - id: well-known/tool/sysadmin/sysinternals/
      - id: metadata/binary/linking/api-set::api-set-forwarder-dll
      - id: metadata/binary/vendor/
      # Wine/ReactOS kernelbase implements these process/memory APIs.
