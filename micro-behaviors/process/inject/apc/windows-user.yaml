# User-mode APC delivery APIs. These are neutral process-injection
# capabilities; intent is inferred by objective composites.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, rust, go, python]
  attack: T1055.004
  mbc: B0018

traits:
  - id: nt-queue-apc-thread-reference
    desc: NtQueueApcThread user-mode APC API reference
    crit: notable
    conf: 0.95
    if:
      type: text
      word: NtQueueApcThread

  - id: nt-queue-apc-thread-ex2-reference
    desc: NtQueueApcThreadEx2 special APC API reference
    crit: notable
    conf: 0.97
    if:
      type: text
      word: NtQueueApcThreadEx2

  - id: nt-test-alert-reference
    desc: NtTestAlert APC dispatch API reference
    crit: notable
    conf: 0.9
    if:
      type: text
      word: NtTestAlert
