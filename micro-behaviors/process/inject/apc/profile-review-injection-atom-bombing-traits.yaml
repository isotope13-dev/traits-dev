defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: atom-table-and-apc-api-profile
  desc: Atom-table and APC scheduling API references
  crit: component
  conf: 0.92
  all:
  - id: micro-behaviors/data/collection/atom-table::global-atom-table-readback
  - id: micro-behaviors/os/callback/apc::queue-user-apc
  unless:
  - id: well-known/app/system/microsoft/platform::microsoft-signed-kernel-api-dll-context
- id: atom-apc-hard-error-api-profile
  desc: Atom, APC and hard-error API references
  crit: notable
  conf: 0.98
  all:
  - id: atom-table-and-apc-api-profile
  - id: micro-behaviors/os/syscall/invoke::ntdll-hard-error-api-profile
  unless:
  - id: well-known/app/system/microsoft/platform::microsoft-signed-kernel-api-dll-context
  - id: well-known/app/system/reactos::system-component
