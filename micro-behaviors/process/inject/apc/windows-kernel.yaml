defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: "T1055"
  mbc: "E1055"
traits:
  - id: initialize-kernel-apc
    desc: Imports kernel APC initialization API
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: import
      exact: "KeInitializeApc"
  - id: queue-kernel-apc
    desc: Imports kernel APC queueing API
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: import
      exact: "KeInsertQueueApc"
  - id: lookup-thread-by-id
    desc: Imports kernel thread lookup by ID API
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: import
      exact: "PsLookupThreadByThreadId"
composite_rules:
  - id: kernel-apc-injection-primitives
    desc: Kernel APC injection API import set
    crit: suspicious
    conf: 0.97
    all:
      - id: initialize-kernel-apc
      - id: queue-kernel-apc
      - id: lookup-thread-by-id
    downgrade:
      any:
        - id: metadata/binary/resource/identity::kernel-driver-init
        - id: metadata/binary/resource/identity::kernel-driver-idata
        - id: well-known/lib/platform/wine/
        - id: well-known/app/system/reactos::system-component
