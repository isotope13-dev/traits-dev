defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1055.004
  mbc: B0018
composite_rules:
- id: apc-remote-write-load-api-profile
  desc: APC, remote write and loader API references
  crit: suspicious
  conf: 0.96
  for:
  - pe
  - dll
  - c
  - cpp
  all:
  - id: micro-behaviors/os/callback/apc::queue-user-apc
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
  any:
  - id: micro-behaviors/dylib/load/runtime::load-library-w
  - id: micro-behaviors/dylib/load/source::load-library-source
  - id: micro-behaviors/process/info/thread::open-thread
  - id: micro-behaviors/process/info/thread::open-thread-source
  - id: micro-behaviors/process/enumerate/snapshot::toolhelp-thread-enumeration-string
  needs: 2
  unless:
  - id: metadata/lang/source/shape::native-prototype-parser-context
  downgrade:
    any:
    - id: well-known/tool/reverse-engineering/cuckoo::cuckoo-instrumentation-source
