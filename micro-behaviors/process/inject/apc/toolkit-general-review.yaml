defaults:
  platforms:
    - unix
    - windows
  for:
    - binaries
  size_max: 52428800

composite_rules:
  - id: dotnet-apc-remote-memory-termination
    desc: Managed assembly with APC and remote memory API references
    crit: suspicious
    conf: 0.98
    platforms:
      - windows
    for:
      - pe
      - dll
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-dup
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/os/callback/apc::queue-user-apc
      - id: micro-behaviors/process/thread/lifecycle::resume-thread
      - id: micro-behaviors/process/terminate/kill::terminate-process-name-text
    # File-wide API names may come from separate embedded native libraries.
    downgrade:
      all:
        - id: metadata/binary/layout/embedded::embedded-pe-multi
        - id: metadata/binary/resource/size::clr-resource-large
    unless:
      - id: well-known/tool/reverse-engineering/corvus::corvus-reverse-engineering-tool
