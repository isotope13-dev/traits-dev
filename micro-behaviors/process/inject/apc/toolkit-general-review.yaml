defaults:
  platforms:
    - unix
    - windows
  for:
    - binaries
  size_max: 52428800

composite_rules:
  - id: dotnet-apc-remote-memory-termination
    desc: Managed APC remote memory and termination
    crit: suspicious
    conf: 0.98
    platforms:
      - windows
    for:
      - pe
      - dll
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-dup
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/os/callback/apc::queue-user-apc
      - id: micro-behaviors/process/thread/lifecycle::resume-thread
      - id: micro-behaviors/process/terminate/kill::terminate-process-name-text
