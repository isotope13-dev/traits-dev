defaults:
  platforms: [windows]
  for: [go]

composite_rules:
  - id: go-suspended-nt-loadlibrary-apis
    desc: Go suspended process and DLL injection APIs
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/process/inject/remote-thread::go-process-injection-api-triad
      - id: micro-behaviors/process/inject/runtime/call::go-ntcreatethreadex-wrapper
      - id: micro-behaviors/process/inject/runtime/call::go-loadlibraryw-wrapper
      - id: micro-behaviors/process/config/launch::create-suspended-flag-reference
