defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
# Co-occurrence does not bind RegSetValueEx to ServiceDLL. The reviewed loader
# contains both a ServiceDLL query and a separate delete-and-replace branch;
# it also writes Active Setup. This profile alone cannot distinguish them.
# These profiles establish neither a service hijack nor successful injection.
- id: resource-dll-injector-service-registry-api-profile
  desc: LanmanServer references with resource and DLL-injector APIs
  crit: notable
  conf: 0.99
  all:
  - id: "micro-behaviors/os/registry/keys/service::lanmanserver-parameters-regpath"
  - id: micro-behaviors/os/registry/value-name::service-dll-value
  - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/process/inject/dll::x86-remote-dll-export-thread
  - id: micro-behaviors/fs/write/file/handle::write-file

- id: dll-injector-service-registry-api-profile
  desc: LanmanServer references with registry-write and DLL-injector APIs
  crit: notable
  conf: 0.99
  all:
  - id: "micro-behaviors/os/registry/keys/service::lanmanserver-parameters-regpath"
  - id: micro-behaviors/os/registry/value-name::service-dll-value
  - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
  - id: micro-behaviors/process/inject/dll::x86-remote-dll-export-thread
  # Strict subset of resource-dll-injector-service-registry-api-profile above: when the
  # fuller resource-access API profile fires, this adds nothing.
  unless:
  - id: resource-dll-injector-service-registry-api-profile
