defaults:
  platforms: [unix, windows]
  for: [lua]

traits:
  - id: lua-debugger-attach-dlopen-clues
    desc: Debugger attach, spawn and dlopen clues
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule lua_debugger_attach_dlopen_clues {
          strings:
            $gdb = "\"gdb\""
            $lldb = "\"lldb\""
            $attach = "\"-p\""
            $batch = "\"--batch\""
            $load = "dlopen("
            $spawn = "sp.spawn"
          condition:
            ($gdb or $lldb) and $attach and $batch and $load and $spawn
        }
