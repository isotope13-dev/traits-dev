defaults:
  platforms: [windows]
  for: [rust]
  crit: notable
  conf: 0.94
traits:
  - id: rust-dll-injection-helper-call
    desc: Calls a DLL injection helper
    if:
      type: symbol
      kind: call
      regex: '(^|::)dll_inject$'
  - id: rust-reflective-dll-helper-call
    desc: Calls a reflective DLL injection helper
    if:
      type: symbol
      kind: call
      regex: '(^|::)dll_reflect$'
