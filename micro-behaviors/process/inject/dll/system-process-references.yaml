defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: remote-thread-apis-system-process-references
    desc: Remote-thread injection APIs co-occur with system-process names
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/process/info/name::windows-service-process-references
      - id: micro-behaviors/process/inject/dll::create-remote-thread
    any:
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
    unless:
      - id: well-known/tool/reverse-engineering/dynamorio::balloon-memory-test-utility
      - id: well-known/tool/detection/threat-intel::cuckoo-monitor-injector
      - id: well-known/app/system/drivers/
      - id: well-known/tool/reverse-engineering/scyllahide/
      - id: well-known/tool/reverse-engineering/sharpod/
