# API co-occurrence does not bind LoadLibrary to a remote thread's start
# address. Keep the API profile neutral; injection objectives need that link.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055.001
  mbc: B0033
composite_rules:
  - id: remote-loadlibrary-api-profile
    desc: Remote memory/thread and LoadLibrary APIs
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-dup
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
    any:
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
      - id: micro-behaviors/dylib/load/runtime::load-library-w
