defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  crit: notable

traits:
  - id: executable-mz-reflective-dll-trampoline-x86
    desc: Executable MZ header ReflectiveLoader stub
    conf: 0.99
    attack: T1620
    if:
      type: hex
      offset: 0
      # Stephen Fewer / Artifact Kit x86 executable DOS header: 'MZ' executes as
      # dec ebp; pop edx, followed by call $+5; pop <reg>, optional register move,
      # push edx; inc ebp (restoring EDX/EBP), and push ebp; mov ebp, esp.
      pattern: '4D 5A E8 00 00 00 00 (5B|58|59|5E|5F) [0-4] 52 45 55 89 E5'
