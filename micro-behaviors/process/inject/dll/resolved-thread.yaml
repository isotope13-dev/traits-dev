defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  # Tests EAX after export resolution, then supplies that same EAX as the
  # thread entry and ESI as its argument. Addresses and stack slots vary.
  # The API profile below provides the operation context for the indirect call.
  - id: x86-resolved-export-thread-handoff
    desc: x86 resolved export passed as thread entry
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: '50 FF 15 ?? ?? ?? ?? (09 C0|85 C0) 75 ?? [9] C3 8B 4C 24 ?? 6A 00 6A 00 56 50 6A 00 6A 00 51 FF 15 ?? ?? ?? ??'

composite_rules:
  - id: x86-remote-dll-export-thread
    desc: Remote DLL APIs with resolved-export thread handoff
    crit: suspicious
    conf: 0.97
    attack: T1055.001
    all:
      - id: x86-resolved-export-thread-handoff
      - id: micro-behaviors/process/inject/dll::remote-loadlibrary-api-profile
