defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: embedded-pe-remote-thread-api-profile
    desc: Embedded PEs and remote-thread API references
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/process/inject/runtime/call::remote-process-memory-api-cluster
      - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-dup
      - id: metadata/binary/layout/ratio::many-pe-embedded
