defaults:
  platforms: [windows]
  for: [data]

traits:
  - id: x86-resolved-export-thread-handoff-raw
    desc: x86 resolved export passed as thread entry
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: '50 FF 15 ?? ?? ?? ?? (09 C0|85 C0) 75 ?? [9] C3 8B 4C 24 ?? 6A 00 6A 00 56 50 6A 00 6A 00 51 FF 15 ?? ?? ?? ??'

  - id: unparsed-pe-virtual-alloc-ex
    desc: VirtualAllocEx API string in unparsed PE
    crit: component
    conf: 0.95
    if:
      type: text
      exact: VirtualAllocEx

  - id: unparsed-pe-write-process-memory
    desc: WriteProcessMemory API string in unparsed PE
    crit: component
    conf: 0.95
    if:
      type: text
      exact: WriteProcessMemory

  - id: unparsed-pe-create-remote-thread
    desc: CreateRemoteThread API string in unparsed PE
    crit: component
    conf: 0.95
    if:
      type: text
      exact: CreateRemoteThread

  - id: unparsed-pe-load-library-a
    desc: LoadLibraryA API string in unparsed PE
    crit: component
    conf: 0.95
    if:
      type: text
      exact: LoadLibraryA

composite_rules:
  - id: unparsed-pe-remote-dll-profile
    desc: Remote DLL injection API strings in unparsed PE
    crit: notable
    conf: 0.96
    all:
      - id: metadata/binary/header/malformed::overlapping-dos-pe-header
      - id: unparsed-pe-virtual-alloc-ex
      - id: unparsed-pe-write-process-memory
      - id: unparsed-pe-create-remote-thread
      - id: unparsed-pe-load-library-a
