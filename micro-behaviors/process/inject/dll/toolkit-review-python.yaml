defaults:
  platforms: [windows]
  for: [python]
  crit: suspicious
  conf: 0.95

composite_rules:
  - id: python-dll-helper-remote-thread
    desc: Python DLL helper and remote-thread APIs
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/inject/dll::python-injectdll-helper
      - id: micro-behaviors/process/inject/remote-thread::python-remote-thread-injection-api-chain
