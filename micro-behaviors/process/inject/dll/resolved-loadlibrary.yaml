defaults:
  for:
  - c
  - cpp
  - csharp
  - rust
  platforms:
  - windows
  crit: notable
  conf: 0.98
  attack: T1055.001
traits:
- id: remote-thread-resolved-loadlibrary
  desc: Remote thread starts at resolved LoadLibrary
  if:
    type: symbol
    kind: call
    regex: ^CreateRemoteThread(Ex)?$
    arg:
      index: 3
      from:
        call: ^GetProcAddress$
        argument: 1
        literal: ^LoadLibrary[AW]$
