# A diagnostic message references DLL injection; it does not prove invocation.
defaults:
  platforms: [windows]
  for: [pe, dll]
  size_min: 32768
  size_max: 2097152
traits:
  - id: attachdll-remote-thread-diagnostic
    desc: DLL-attachment remote-thread diagnostic message
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'AttachDllToProcess:\s*CreateRemoteThread'
      section: any
