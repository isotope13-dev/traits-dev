defaults:
  crit: suspicious
  platforms: [windows]
  for: [rust]
  conf: 0.95

composite_rules:
  - id: eldritch-dll-injection-api
    desc: Eldritch DLL injection helper call
    all:
      - id: metadata/import/package::eldritch-runtime-import-context
      - id: micro-behaviors/process/inject/dll::rust-dll-injection-helper-call
  - id: eldritch-reflective-dll-api
    desc: Eldritch reflective DLL helper call
    all:
      - id: metadata/import/package::eldritch-runtime-import-context
      - id: micro-behaviors/process/inject/dll::rust-reflective-dll-helper-call
