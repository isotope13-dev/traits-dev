defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: remote-dll-service-registry-api-profile
  desc: Remote DLL APIs with service registry references
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/process/inject/dll::remote-loadlibrary-api-profile
  - id: micro-behaviors/os/registry/keys/service::lanmanserver-parameters-regpath
  - id: micro-behaviors/os/registry/value-name::service-dll-value
  - id: micro-behaviors/os/registry/write::reg-set-value-ex-a
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: micro-behaviors/process/inject/dll::resource-dll-injector-service-registry-api-profile
