defaults:
  platforms:
    - unix
    - windows
  for:
    - binaries
  size_max: 52428800

composite_rules:
  - id: module-stomp-v2-browser-dll
    desc: Module stomp log and browser DLL
    crit: suspicious
    conf: 0.99
    all:
      - id: metadata/file/profile/process/injection::module-stomp-v2-log-text
      - id: micro-behaviors/fs/path/system/library::windows-browser-runtime-dll-name
    any:
      - id: micro-behaviors/os/telemetry/logging/payload-monitor::stomp-tag
      - id: metadata/file/profile/memory/protection-api::virtual-protect
    unless:
      - id: metadata/signed/platform/
