defaults:
  platforms:
    - unix
    - windows
  for:
    - binaries
  size_max: 52428800

composite_rules:
  - id: module-stomp-v2-browser-dll
    desc: Module stomp log and browser DLL
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/process/inject/module-stomping::module-stomp-v2-log-text
      - id: micro-behaviors/fs/path/system/library::windows-browser-runtime-dll-name
    any:
      - id: micro-behaviors/os/telemetry/logging/payload-monitor::stomp-tag
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
