defaults:
  platforms:
    - unix
    - windows
  for:
    - binaries
  size_max: 52428800

traits:
  - id: module-stomp-v2-log-text
    desc: Module stomp v2 log text
    crit: component
    conf: 0.95
    if:
      type: text
      substr: === MODULE STOMP v2 (SEC_IMAGE) ===

  - id: module-stomping-loader-log
    desc: Module stomping loader log text
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)(module stomping \(need SizeOfImage|Phantom stomp (OK|failed)|loader: stomped)'
