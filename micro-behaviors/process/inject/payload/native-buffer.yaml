defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

traits:
  - id: x64-rwx-buffer-write-thread-pattern
    desc: x64 allocation-write-thread call pattern
    crit: suspicious
    conf: 0.95
    attack: T1055
    if:
      type: hex
      section: .text
      # Indirect allocation: NULL address, MEM_COMMIT|MEM_RESERVE,
      # PAGE_EXECUTE_READWRITE, handle in RBX. Save result in RSI.
      # A subsequent five-argument call writes R14 to RSI with the same
      # handle; a seven-argument call then uses RSI as its start address.
      # Bound the resolver gaps; no encrypted names or cipher key required.
      # This is a calling pattern, not proof that a remote thread ran.
      pattern: 'C7 44 24 20 40 00 00 00 33 D2 41 B9 00 30 00 00 48 8B CB FF D0 48 8B F0 48 85 C0 0F 84 [4] [0-160] 4C 89 6C 24 20 4D 8B C6 48 8B D6 48 8B CB FF D0 85 C0 0F 84 [4] [0-160] 4C 89 6C 24 30 44 89 6C 24 28 4C 89 6C 24 20 4C 8B CE 45 33 C0 33 D2 48 8B CB FF D0'
