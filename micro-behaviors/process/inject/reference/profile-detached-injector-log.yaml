defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: detached-injector-log-text
    desc: Detached injector and target launch text
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)driver mapped.{0,128}spawned\s+\(detached\).{0,128}inject once\s+.{1,80}?\s+launches'

