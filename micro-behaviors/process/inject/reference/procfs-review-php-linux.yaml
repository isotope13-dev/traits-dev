defaults:
  platforms: [unix]
  for: [php]

traits:
  - id: php-injector-compile-command
    desc: PHP injector compilation command text
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'gcc -o [\s\S]{0,160}inject\.c[\s\S]{0,220}\.injector'
  - id: php-injector-command-status
    desc: PHP injector command and status text
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'injectCmd[\s\S]{0,220}INJECTED'

composite_rules:
  - id: php-injector-command-profile
    desc: PHP injector command with memory-open or compilation text
    crit: suspicious
    conf: 0.98
    any:
      - id: micro-behaviors/fs/proc/memory::php-proc-mem-write-open
      - id: micro-behaviors/process/inject/reference::php-injector-compile-command
    needs: 1
    all:
      - id: micro-behaviors/process/inject/reference::php-injector-command-status
