defaults:
  for:
    - macho
    - elf
  platforms:
    - macos
    - linux
composite_rules:
  - id: go-injection-websocket-rc4
    desc: Go injection names, WebSocket and RC4 clues
    crit: suspicious
    conf: 1.0
    # gorilla-websocket-module-marker is for: [go.mod, binaries], not go.
    all:
      - id: "metadata/import/package::gorilla-websocket-module-reference"
      - id: micro-behaviors/process/inject/reference::go-inject-mac-path
      - id: micro-behaviors/process/inject/reference::go-inject-mac-function
      - id: micro-behaviors/crypto/symmetric/stream/rc4/transform::rc4-decode-function
