defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1055.012
traits:
  # Reviewed CIL: CreateProcess delegate uses CREATE_SUSPENDED|CREATE_NO_WINDOW;
  # 179-int CONTEXT begins with CONTEXT_i386|CONTEXT_INTEGER (0x10002).
  # CONTEXT[44] (Eax) gets mapped base+entry RVA before context set/resume.
  # Metadata tokens and code distances vary; no type, method or campaign name
  # is required. This is probable injection mechanics, not an intent verdict.
  - id: cil-suspended-context-entry-transplant
    desc: CIL suspended flags and CONTEXT.Eax rewrite
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: '16 20 04 00 00 08 7E ?? ?? ?? 0A 14 02 7C ?? ?? ?? 04 02 7C ?? ?? ?? 04 6F ?? ?? ?? 06 [0-512] 02 20 B3 00 00 00 8D ?? ?? ?? 01 7D ?? ?? ?? 04 02 7B ?? ?? ?? 04 16 20 02 00 01 00 9E [0-2048] 02 7B ?? ?? ?? 04 1F 2C 02 7B ?? ?? ?? 04 28 ?? ?? ?? (06|0A) 02 7B ?? ?? ?? 04 58 9E'
  # The same mechanics with CONTEXT held in locals rather than object fields:
  # create hidden+suspended, initialize the integer-register context, then
  # assign its Eax slot a base-plus-entry-point sum. Tokens/local slots vary;
  # the conversion call may be a MemberRef (0A) or a local proxy MethodDef (06).
  - id: cil-local-suspended-context-entry-transplant
    desc: CIL suspended host with CONTEXT.Eax rewrite
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: '16 20 04 00 00 08 7E ?? ?? ?? 0A 14 12 ?? 12 ?? 6F ?? ?? ?? 06 [0-256] 20 B3 00 00 00 8D ?? ?? ?? 01 13 ?? [0-64] 16 20 02 00 01 00 9E [0-1536] 11 ?? 1F 2C 11 ?? 28 ?? ?? ?? (06|0A) 11 ?? 58 9E'
