defaults:
  platforms: [windows]
  for: [oledoc]
  crit: notable
  conf: 0.9
  attack: T1055

traits:
  - id: msi-embedded-get-thread-context
    desc: MSI embedded GetThreadContext reference
    if:
      type: text
      substr: GetThreadContext
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: micro-behaviors/process/info/thread::get-thread-context-import

  - id: msi-embedded-set-thread-context
    desc: MSI embedded SetThreadContext reference
    if:
      type: text
      substr: SetThreadContext
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: micro-behaviors/process/info/thread::set-thread-context-import

  - id: msi-embedded-resume-thread
    desc: MSI embedded ResumeThread reference
    if:
      type: text
      substr: ResumeThread
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: micro-behaviors/process/info/thread::resume-thread-import
