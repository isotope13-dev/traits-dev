defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
  conf: 0.98
traits:
  - id: x64-pe-section-copy-arguments
    desc: Prepares PE section source destination and size
    if:
      type: hex
      section: .text
      pattern: '8B 53 0C 49 03 D4 8B 4B 14 4C 8B C1 4C 03 45 ?? 44 8B 4B 10 49 8B CD E8 ?? ?? ?? ??'
  - id: x64-base-relative-context-rcx-store
    desc: Stores base-relative value in CONTEXT.Rcx
    if:
      type: hex
      section: .text
      pattern: '8B 8D ?? ?? ?? ?? 49 03 CC 48 8B 95 ?? ?? ?? ?? 48 89 8A 80 00 00 00'
