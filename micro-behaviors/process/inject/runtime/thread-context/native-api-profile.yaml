# These API references establish a capability profile, not image replacement,
# a connected execution chain, or evasion. Preserve the former matcher/scope.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: native-write-suspend-context-api-profile
    desc: Remote-write and suspend-context API profile
    crit: suspicious
    conf: 0.96
    attack: T1055
    all:
      - id: micro-behaviors/process/create/exec::create-process-a
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/process/info/thread::suspend-thread-import
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
