defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
traits:
  # CONTEXT.Ebx+8 is PEB.ImageBaseAddress. Write the replacement base there,
  # assign image_base+AddressOfEntryPoint to CONTEXT.Eax, then set and resume.
  # The pinned frame slots preserve the ABI relation: CONTEXT starts at a4,
  # Ebx is at 148 and Eax at 154. Other frame slots and IAT addresses vary.
  - id: x86-esp-peb-imagebase-context-rewrite
    desc: Rewrites remote PEB and saved entry
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '8D 44 24 ?? C7 44 24 10 00 00 00 00 89 44 24 08 8B 84 24 48 01 00 00 C7 44 24 0C 04 00 00 00 83 C0 08 89 44 24 04 8B 44 24 ?? 89 04 24 8B 44 24 ?? FF D0 83 EC 14 85 C0 74 ?? 8B 45 28 03 44 24 ?? 89 84 24 54 01 00 00 8D 84 24 A4 00 00 00 89 44 24 04 8B 44 24 ?? 89 04 24 FF 15 ?? ?? ?? ?? 83 EC 08 85 C0 74 ?? 8B 44 24 ?? 89 04 24 FF 15 ?? ?? ?? ??'
