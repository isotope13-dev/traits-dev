defaults:
  platforms:
  - windows
composite_rules:
- for:
  - pe
  - dll
  id: suspended-unmap-thread-api-profile
  desc: Suspended launch and remote thread API profile
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
  - id: micro-behaviors/mem/unmap::native-section-unmap-api-references
  - id: micro-behaviors/mem/write/arbitrary::remote-memory-write-api-references
  - id: micro-behaviors/process/info/thread::thread-context-api-pair
  unless:
  - id: well-known/tool/reverse-engineering/
  - id: metadata/build/generated::winmd-metadata
