defaults:
  platforms:
  - windows
composite_rules:
- for:
  - pe
  - dll
  id: suspended-unmap-thread-api-profile
  desc: Suspended launch and remote thread API profile
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
  - id: micro-behaviors/mem/unmap::native-section-unmap-api-references
  - id: micro-behaviors/mem/write/arbitrary::remote-memory-write-api-references
  - id: micro-behaviors/process/info/thread::thread-context-api-pair
  unless:
  - id: well-known/tool/reverse-engineering/
  - id: metadata/build/generated::winmd-metadata
- id: suspended-write-resume-api-profile
  desc: Suspended launch, memory and resume API profile
  crit: suspicious
  conf: 0.95
  for:
  - go
  - rust
  - c
  - cpp
  - csharp
  - pe
  - dll
  - powershell
  all:
  - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
  - id: micro-behaviors/mem/combined::remote-allocation-or-write-api-references
  - id: micro-behaviors/process/info/thread::thread-resume-api-references
  unless:
  - id: metadata/signed/platform/
  - id: well-known/game/mod::thcrap-source-tree
  - id: well-known/game/mod::we-linux-shim-launcher
  - id: well-known/tool/reverse-engineering/corvus::corvus-reverse-engineering-tool
  - id: well-known/lib/platform/terrafx/
  - id: well-known/lib/platform/vanara/
  - id: metadata/build/generated::winmd-metadata
