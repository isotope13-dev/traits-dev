defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
traits:
  # After writing the new image, write its base to PEB.ImageBaseAddress
  # (saved CONTEXT.Ebx + 8), then update saved Eax and set/resume the thread.
  # IAT addresses, frame slots and branch displacements vary across builds.
  - id: x86-peb-imagebase-context-rewrite
    desc: x86 PEB and thread-context rewrite sequence
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '6A 04 8D 45 ?? 50 8B 85 ?? ?? ?? ?? 83 C0 08 50 FF 75 ?? FF 15 ?? ?? ?? ?? 85 C0 74 ?? 8B 45 ?? 89 85 ?? ?? ?? ?? 8D 85 ?? ?? ?? ?? 50 FF 75 ?? FF 15 ?? ?? ?? ?? 85 C0 74 ?? FF 75 ?? FF 15 ?? ?? ?? ??'
  # CONTEXT.Ebx + 8 is PEB.ImageBaseAddress; CONTEXT.Eax at +0xb0
  # receives the replacement entry point before SetThreadContext/ResumeThread.
  # Stack slots, IAT addresses, image entry displacement and branches vary.
  - id: x86-stack-peb-imagebase-context-rewrite
    desc: x86 PEB and saved entry-point rewrite
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '8B 85 A4 00 00 00 83 C0 08 50 FF 37 FF 15 [4] 85 C0 [2-20] 8B 46 28 03 C1 55 89 85 B0 00 00 00 FF 77 04 FF 15 [4] 85 C0 [2-8] FF 77 04 FF 15 [4]'
composite_rules:
  - id: x86-remote-image-thread-context-transfer
    desc: Remote image and thread-context transfer code
    crit: suspicious
    conf: 0.98
    all:
      - id: x86-peb-imagebase-context-rewrite
      - id: remote-memory-thread-context-api-set
