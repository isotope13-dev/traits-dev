defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: importless-remote-context-api-set
  desc: Importless PE names remote-memory and thread APIs
  crit: notable
  conf: 0.98
  all:
  - id: metadata/binary/symbols/count::no-imports
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-text
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-text
  - id: micro-behaviors/process/info/thread::thread-context-api-reference-get
  - id: micro-behaviors/process/info/thread::thread-context-api-reference-set
  - id: micro-behaviors/process/info/thread::resume-thread
  - id: micro-behaviors/process/create/launch::create-process-api-name
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework/
  - id: well-known/tool/reverse-engineering/
- id: importless-context-loader-api-profile
  for: [pe]
  desc: Importless PE thread-context and loader API references
  crit: notable
  conf: 0.97
  all:
  - id: metadata/binary/symbols/count::no-imports
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-text
  - id: micro-behaviors/process/info/thread::thread-context-api-reference-set
  any:
  - id: micro-behaviors/process/info/thread::get-thread-context-import
  - id: micro-behaviors/process/info/thread::thread-context-api-reference-get
  - id: micro-behaviors/process/info/thread::resume-thread
  - id: micro-behaviors/process/create/launch::create-process-api-name
  - id: micro-behaviors/fs/path/application/executable::explorer-executable-reference
  - id: metadata/binary/instruction::int3-padding-runs
  needs: 3
  unless:
  - id: metadata/signed/platform/
  - id: metadata/lang/compiled/
  - id: metadata/binary/framework/
