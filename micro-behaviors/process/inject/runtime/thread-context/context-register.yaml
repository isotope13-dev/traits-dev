# Bind the CONTEXT.Rcx store to the buffer and SetThreadContext IAT slot.
# Both disp32 and disp8 context-buffer layouts retain the 0x80 offset.
defaults:
  platforms:
  - windows
  for:
  - pe
  arch:
  - x86-64
traits:
- id: x64-context-rcx-write-call
  desc: CONTEXT.Rcx write bound to SetThreadContext
  crit: suspicious
  conf: 0.98
  if:
    type: yara
    source: |
      import "pe"
      rule x64_context_rcx_write_call {
        strings:
          $rewrite = {
            48 8B 4B 08
            48 8D 94 24 ?? ?? ?? ??
            48 89 BC 24 ?? ?? ?? ??
            FF 15 ?? ?? ?? ??
          }
          $short = {
            4C 89 B4 24 ?? ?? ?? ?? 48 8B 4E 08
            48 8D 54 24 ?? FF 15 ?? ?? ?? ??
          }
        condition:
          pe.is_64bit() and
          (
          for any s in (0..pe.number_of_sections-1) : (
            pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
            for any m in (1..#rewrite) : (
              @rewrite[m] >= pe.sections[s].raw_data_offset and
              @rewrite[m]+!rewrite[m] <= pe.sections[s].raw_data_offset +
                pe.sections[s].raw_data_size and
              uint32(@rewrite[m]+16) == uint32(@rewrite[m]+8)+0x80 and
              for any i in (0..pe.number_of_imports-1) : (
                for any f in (0..pe.import_details[i].number_of_functions-1) : (
                  pe.import_details[i].functions[f].name == "SetThreadContext" and
                  pe.sections[s].virtual_address + @rewrite[m] -
                    pe.sections[s].raw_data_offset + !rewrite[m] +
                    int32(@rewrite[m]+22) ==
                    pe.import_details[i].functions[f].rva
                )
              )
            )
          ) or
          for any s in (0..pe.number_of_sections-1) : (
            pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
            for any m in (1..#short) : (
              @short[m] >= pe.sections[s].raw_data_offset and
              @short[m]+!short[m] <= pe.sections[s].raw_data_offset +
                pe.sections[s].raw_data_size and
              uint32(@short[m]+4) == uint8(@short[m]+16)+0x80 and
              for any i in (0..pe.number_of_imports-1) : (
                for any f in (0..pe.import_details[i].number_of_functions-1) : (
                  pe.import_details[i].functions[f].name == "SetThreadContext" and
                  pe.sections[s].virtual_address + @short[m] -
                    pe.sections[s].raw_data_offset + !short[m] +
                    int32(@short[m]+!short[m]-4) ==
                    pe.import_details[i].functions[f].rva
                )
              )
            )
          )
          )
      }
  downgrade:
    any:
    - id: metadata/binary/code/control-transfer::pe-return-entry-without-callbacks
