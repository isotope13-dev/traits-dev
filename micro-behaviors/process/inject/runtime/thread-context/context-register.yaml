defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
traits:
  # CONTEXT.Rcx is 0x80 bytes from the x64 CONTEXT base. The matcher
  # binds that store to the very buffer passed to SetThreadContext, and
  # resolves the RIP-relative call to the PE import slot. This is a
  # register rewrite, not proof that the supplied value is an entry point.
  - id: x64-context-rcx-write-call
    desc: CONTEXT.Rcx write bound to SetThreadContext
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: "import \"pe\"\nrule x64_context_rcx_write_call {\n  strings:\n    $rewrite = {\n      48 8B 4B 08\n      48 8D 94 24 ?? ?? ?? ??\n      48\
        \ 89 BC 24 ?? ?? ?? ??\n      FF 15 ?? ?? ?? ??\n    }\n  condition:\n    pe.is_64bit() and\n    for any s in (0..pe.number_of_sections-1) : (\n \
        \     pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and\n      for any m in (1..#rewrite) : (\n        @rewrite[m] >= pe.sections[s].raw_data_offset\
        \ and\n        @rewrite[m]+!rewrite[m] <= pe.sections[s].raw_data_offset +\n          pe.sections[s].raw_data_size and\n        uint32(@rewrite[m]+16)\
        \ == uint32(@rewrite[m]+8)+0x80 and\n        for any i in (0..pe.number_of_imports-1) : (\n          for any f in (0..pe.import_details[i].number_of_functions-1)\
        \ : (\n            pe.import_details[i].functions[f].name == \"SetThreadContext\" and\n            pe.sections[s].virtual_address + @rewrite[m] -\n\
        \              pe.sections[s].raw_data_offset + !rewrite[m] +\n              int32(@rewrite[m]+22) ==\n              pe.import_details[i].functions[f].rva\n\
        \          )\n        )\n      )\n    )\n}\n"
    downgrade:
      any:
      - id: metadata/binary/code/control-transfer::pe-return-entry-without-callbacks
