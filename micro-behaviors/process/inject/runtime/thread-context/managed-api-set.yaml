# API co-occurrence does not establish replacement-image mapping or concealment.
# Retains the former dotnet-process-hollowing matcher's scope and conditions.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: dotnet-suspended-injection-api-set
    desc: Managed suspended-process injection API references
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/create/launch::create-process-api-name
      - id: micro-behaviors/process/create/flags::create-suspended-flag-reference
      - id: micro-behaviors/mem/unmap::native-section-unmap-api-references
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/process/info/thread::thread-context-api-pair
      - id: micro-behaviors/process/thread/lifecycle::resume-thread
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/development/
      - id: well-known/tool/reverse-engineering/
      - id: metadata/build/generated::winmd-metadata
