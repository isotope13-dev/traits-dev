defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: dotnet-suspended-injection-api-set
  desc: Managed suspended-process injection API references
  crit: suspicious
  conf: 0.95
  all:
  - id: metadata/lang/compiler/managed::dotnet-assembly
  - id: micro-behaviors/process/create/exec::create-process-api-name
  - id: micro-behaviors/process/config/launch::create-suspended-flag-reference
  - id: micro-behaviors/mem/unmap::native-section-unmap-api-references
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-dup
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/process/info/thread::thread-context-api-pair
  - id: micro-behaviors/process/thread/lifecycle::resume-thread
  unless:
  - id: metadata/build/generated::winmd-metadata
