# Imports do not establish a suspended child, register rewrite or hollowing.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: unsigned-startupinfoex-thread-context-imports
    desc: Unsigned PE imports StartupInfoEx and thread-context APIs
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/process/create/exec::create-process-a
      - id: micro-behaviors/process/create/spawn::proc-thread-attribute-list
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/tool/development/
      - id: metadata/binary/installer/family/
