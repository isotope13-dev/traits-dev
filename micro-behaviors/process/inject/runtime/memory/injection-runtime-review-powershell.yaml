defaults:
  crit: suspicious
  for: [powershell, batch]
  platforms: [windows]

composite_rules:
  - id: ps-kernel32-injection-api-references
    desc: PowerShell kernel32 and injection API refs
    conf: 0.88
    near_lines: 80
    all:
      - id: micro-behaviors/dylib/load/ffi::dotnet-kernel32-pinvoke
    any:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-text
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/os/callback/apc::queue-user-apc
  - id: powershell-process-memory-api-profile
    desc: PowerShell process-memory API references
    conf: 0.98
    all:
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/process/create/exec::create-process-api-name
    any:
      - id: micro-behaviors/process/inject/runtime/memory::ps-kernel32-injection-api-references
      - id: metadata/lang/scripted::add-type-definition
    needs: 2
    unless:
      - id: micro-behaviors/process/debug/event::debugger-event-loop-source
  - id: powershell-crypto-process-api-profile
    for: [powershell]
    desc: PowerShell crypto and process API clues
    conf: 0.99
    all:
      - id: micro-behaviors/process/inject/runtime/memory::powershell-process-memory-api-profile
      - id: micro-behaviors/crypto/decrypt/transform/unspecified::powershell-base64-decryption-cooccurrence
    any:
      - id: micro-behaviors/process/enumerate/shell::get-process-by-name
      - id: micro-behaviors/process/sync/mutex::global-guid-mutex-management
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
    needs: 2
