defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: x86-inline-hook-two-string-capture
    desc: Inline hook copies two strings to globals
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule x86_inline_hook_two_string_capture {
          strings:
            $capture = { 8F 05 [4] FF 74 24 3C 89 05 [4] 89 3D [4] 89 0D [4] 8B 3D [4] 8A 08 40 88 0F 47 84 C9 75 F6 C6 07 00 }
          condition:
            $capture
        }
