defaults:
  platforms:
    - windows
  for:
    - pe
    - dll

composite_rules:
  - id: unsigned-thread-context-inline-patch
    desc: Unsigned thread APIs and inline code patch
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/process/info/thread::thread-context-suspend-resume-api-profile
      - id: micro-behaviors/mem/write/arbitrary::x64-inline-jump-patch-capability
      - id: metadata/signature/absent::unsigned-missing-signature-record
