defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: native-seven-byte-absolute-jump-stub
    desc: Constructs seven-byte absolute jump stub
    crit: suspicious
    conf: 0.97
    if:
      type: yara
      source: |
        rule native_seven_byte_absolute_jump_stub {
          strings:
            $stub = { C7 45 ?? BA 00 00 00 C7 45 ?? 00 00 FF E2 }
            $length = { C7 44 24 08 07 00 00 00 }
          condition:
            $stub and $length
        }
  - id: source-x64-movabs-rax-jump-stub
    desc: Constructs x64 movabs rax jump stub
    for: [c, cpp]
    platforms: [windows, linux, macos]
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (compound_statement
          (expression_statement
            (assignment_expression
              left: (subscript_expression
                argument: (identifier) @buf0
                index: (number_literal) @i0)
              right: (number_literal) @b0))
          (expression_statement
            (assignment_expression
              left: (subscript_expression
                argument: (identifier) @buf1
                index: (number_literal) @i1)
              right: (number_literal) @b1))
          (_)
          (expression_statement
            (assignment_expression
              left: (subscript_expression
                argument: (identifier) @buf2
                index: (number_literal) @i2)
              right: (number_literal) @b2))
          (expression_statement
            (assignment_expression
              left: (subscript_expression
                argument: (identifier) @buf3
                index: (number_literal) @i3)
              right: (number_literal) @b3))
          (#eq? @buf0 @buf1)
          (#eq? @buf0 @buf2)
          (#eq? @buf0 @buf3)
          (#eq? @i0 "0")
          (#eq? @i1 "1")
          (#eq? @i2 "10")
          (#eq? @i3 "11")
          (#match? @b0 "^0[xX]48$")
          (#match? @b1 "^0[xX][bB]8$")
          (#match? @b2 "^0[xX][fF]{2}$")
          (#match? @b3 "^0[xX][eE]0$")) @trampoline
