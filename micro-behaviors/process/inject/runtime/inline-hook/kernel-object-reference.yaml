defaults:
  for:
    - "pe"
  platforms:
    - "windows"
  arch:
    - "x86"
traits:
  - id: "x86-kernel-object-reference-detour-body"
    desc: "Kernel handle routine patched and called"
    crit: "suspicious"
    conf: 0.98
    if:
      type: "yara"
      source: |
        import "pe"
        rule x86_kernel_object_reference_detour_body {
          strings:
            // Restore five prologue bytes into the imported kernel routine, call it,
            // then construct/reinstall an E9 detour. These are code writes, not names.
            $target = { 8B 1D ?? ?? ?? ?? 6A 00 8D 45 ?? 50 FF 75 14 8D 75 ??
                        FF 75 10 8B FB FF 75 0C A5 FF 75 08 A4 FF D3 }
            $templates = { C6 45 ?? 8B C6 45 ?? 55 C6 45 ?? 8B C6 45 ?? EC C6 45 ?? E9 }
            $jump = { 2B C3 83 E8 05 89 45 ?? A5 A4 }
          condition:
            pe.is_pe and $templates and $jump and
            pe.imports("ntoskrnl.exe", "ObReferenceObjectByHandle") and
            for any t in (1..#target) : (
              uint32(@target[t]+2) == pe.image_base + pe.import_rva("ntoskrnl.exe", "ObReferenceObjectByHandle")
            )
        }
