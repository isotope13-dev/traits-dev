defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055
composite_rules:
  - id: remote-thread-resource-api-profile
    desc: Remote-thread and PE resource extraction APIs
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/process/inject/dll::create-remote-thread
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
    unless:
      - id: well-known/lib/platform/wine/
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/tool/browser::google-chrome-browser-context
      - id: well-known/app/security/itop-vpn::benign-context

  - id: resource-and-remote-memory-api-profile
    desc: Resource and remote-memory API co-occurrence
    crit: notable
    conf: 0.99
    all:
      - id: remote-thread-resource-api-profile
      - id: micro-behaviors/process/inject/runtime/call::remote-alloc-write-thread-api-set
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/tool/browser::google-chrome-browser-context
      - id: well-known/app/security/itop-vpn::benign-context

