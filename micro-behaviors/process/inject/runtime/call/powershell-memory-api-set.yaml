defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
  - id: powershell-native-memory-entry-thread
    desc: PowerShell native memory and thread API set
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/mem/alloc/virtual::powershell-virtualalloc-reference
      - id: micro-behaviors/mem/copy::marshal-copy-powershell
      - id: micro-behaviors/mem/protect/modify::powershell-virtualprotect-name
      - id: micro-behaviors/process/thread/create::powershell-emitted-createthread-pinvoke
  # Co-occurrence establishes an injection capability, not a linked buffer,
  # a reached remote branch, or a concealment objective. In Invoke-DCSync,
  # these APIs also occur in helpers while the wrapper maps its image locally.
