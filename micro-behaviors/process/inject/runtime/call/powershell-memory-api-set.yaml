defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
  - id: powershell-native-memory-entry-thread
    desc: PowerShell native memory and thread API set
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/mem/alloc/virtual::powershell-virtualalloc-reference
      - id: micro-behaviors/mem/copy::marshal-copy-powershell
      - id: micro-behaviors/mem/protect/modify::powershell-virtualprotect-name
      - id: micro-behaviors/process/create/thread::powershell-emitted-createthread-pinvoke
  # Co-occurrence establishes an injection capability, not a linked buffer,
  # a reached remote branch, or a concealment objective. In Invoke-DCSync,
  # these APIs also occur in helpers while the wrapper maps its image locally.
  - id: powershell-embedded-image-remote-thread-api-set
    desc: Embedded PE image beside remote-thread APIs
    crit: suspicious
    conf: 0.97
    attack: T1055
    all:
      - id: micro-behaviors/process/attach/rights::open-process-script
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-text
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-text
      - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-script
      - id: micro-behaviors/data/embedded/payload/native::line-wrapped-base64-pe-image
    unless:
      - id: micro-behaviors/process/inject/runtime/call::powershell-remote-reflective-image-call
