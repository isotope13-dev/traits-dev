defaults:
  for: [powershell]
  platforms: [windows]

composite_rules:
  - id: powershell-remote-thread-memory-api-profile
    desc: PowerShell remote allocation, write and thread API cluster
    crit: notable
    conf: 0.99
    attack: T1055.001
    all:
      - id: micro-behaviors/process/create/spawn::open-process-script
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-text
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-text
      - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-script
    any:
      - id: micro-behaviors/mem/query::virtualquery-ex-script
      - id: micro-behaviors/process/inject/runtime/call::read-process-memory
      - id: micro-behaviors/process/create/hidden::powershell-hidden-system-binary-launch
    needs: 1
