defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
  attack: T1055

traits:
  - id: python-rtlmovememory-call
    desc: Python copies a buffer with RtlMoveMemory
    conf: 0.96
    platforms: [windows]
    if:
      type: text
      regex: '(?i)\b[A-Za-z_]\w*\.RtlMoveMemory\s*\('

  - id: text-python-cfunctype-function-pointer-call
    desc: Text-carried Python native pointer call
    conf: 0.92
    platforms: [windows]
    for: [text]
    if:
      type: text
      regex: '(?is)\b(ctypes\.)?CFUNCTYPE\s*\([^)]{0,80}\)\s*\(\s*[A-Za-z_]\w{0,30}\s*\)\s*\('

  # Two-step pattern: CFUNCTYPE(...) then call with addressof(from_buffer(...)).
  # Common on Unix where mmap RWX replaces VirtualAlloc/HeapAlloc loaders.
  - id: python-cfunctype-from-buffer-address
    desc: Python CFUNCTYPE from buffer address
    conf: 0.94
    platforms: [unix]
    if:
      type: text
      regex: '(?s)CFUNCTYPE[\s\S]{0,280}addressof\s*\(\s*(ctypes\.)?c_char\.from_buffer'
