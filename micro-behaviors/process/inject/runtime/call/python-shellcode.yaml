defaults:
  platforms: [windows]
  for: [python]
  attack: T1055

traits:
  - id: python-rtlmovememory-call
    desc: Python copies a buffer with RtlMoveMemory
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b[A-Za-z_]\w*\.RtlMoveMemory\s*\('

  - id: python-cfunctype-function-pointer-call
    desc: Python native function-pointer wrapper
    crit: notable
    conf: 0.9
    if:
      # Parse call nodes so CFUNCTYPE examples in documentation do not count.
      type: tree-sitter
      language: python
      kind: call
      regex: '(?is)\bCFUNCTYPE\s*\([^)]{0,80}\)\s*\(\s*[A-Za-z_]\w{0,30}\s*\)'
    unless:
      # These are ctypes' standard wrappers around its own exported C helpers,
      # not a caller turning an allocated buffer into executable code.
      - type: text
        regex: '(?m)^\s*(?:memmove|memset)\s*=\s*CFUNCTYPE\([^\n]{0,180}\)\s*\(_(?:memmove|memset)_addr\)'
