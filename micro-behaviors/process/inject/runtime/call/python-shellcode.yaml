defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1055

traits:
  - id: python-rtlmovememory-call
    desc: Python copies a buffer with RtlMoveMemory
    crit: notable
    conf: 0.96
    platforms: [windows]
    if:
      type: text
      regex: '(?i)\b[A-Za-z_]\w*\.RtlMoveMemory\s*\('

  - id: python-cfunctype-function-pointer-call
    desc: Python native function-pointer wrapper
    crit: notable
    conf: 0.9
    platforms: [windows]
    if:
      # Parse call nodes so CFUNCTYPE examples in documentation do not count.
      type: tree-sitter
      language: python
      kind: call
      regex: '(?is)\bCFUNCTYPE\s*\([^)]{0,80}\)\s*\(\s*[A-Za-z_]\w{0,30}\s*\)'
    unless:
      # These are ctypes' standard wrappers around its own exported C helpers,
      # not a caller turning an allocated buffer into executable code.
      - type: text
        regex: '(?m)^\s*(memmove|memset)\s*=\s*CFUNCTYPE\([^\n]{0,180}\)\s*\(_(memmove|memset)_addr\)'

  # Two-step pattern: CFUNCTYPE(...) then call with addressof(from_buffer(...)).
  # Common on Unix where mmap RWX replaces VirtualAlloc/HeapAlloc loaders.
  - id: python-cfunctype-from-buffer-address
    desc: Python CFUNCTYPE from buffer address
    crit: notable
    conf: 0.94
    platforms: [unix]
    if:
      type: text
      regex: '(?s)CFUNCTYPE[\s\S]{0,280}addressof\s*\(\s*(ctypes\.)?c_char\.from_buffer'
