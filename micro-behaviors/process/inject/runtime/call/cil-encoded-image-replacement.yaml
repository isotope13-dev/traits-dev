# A complete API-name set is corroborated by CIL CREATE_SUSPENDED arguments
# and PE header/section reads. API names are UTF-16 Base64 constants, decoded
# before delegate resolution. No family, resource name or key is required.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: cil-base64-image-replacement-profile
    desc: Encoded APIs with suspended-image CIL profile
    crit: suspicious
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule cil_base64_image_replacement_profile {
          strings:
            $create = "Q3JlYXRlUHJvY2Vzc0E=" wide ascii
            $unmap = "WndVbm1hcFZpZXdPZlNlY3Rpb24=" wide ascii
            $write = "V3JpdGVQcm9jZXNzTWVtb3J5" wide ascii
            $alloc = "VmlydHVhbEFsbG9jRXg=" wide ascii
            $getctx = "R2V0VGhyZWFkQ29udGV4dA==" wide ascii
            $setctx = "U2V0VGhyZWFkQ29udGV4dA==" wide ascii
            $resume = "UmVzdW1lVGhyZWFk" wide ascii
            $b64 = "FromBase64String" fullword
            $bitconv = "BitConverter" fullword
            $blockcopy = "BlockCopy" fullword
            $code = { 11 04 14 03 73 ?? ?? ?? 0A
                      11 08 11 08 16 1A 11 08 14 11 0D 11 0A
                      6F ?? ?? ?? 06 }
            $header = { 02 1F 3C 28 ?? ?? ?? 0A }
          condition:
            all of them and
            for any s in pe.sections : (
              s.name == ".text" and
              $code in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1) and
              $header in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
            )
        }
