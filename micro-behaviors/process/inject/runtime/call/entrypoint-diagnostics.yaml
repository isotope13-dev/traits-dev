defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: entrypoint-redirection-diagnostic
    desc: Executable entry point redirection diagnostic
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: Redirected entry point, waiting for initialization
  - id: xmrig-injection-diagnostic
    desc: XMRig process injection failure diagnostic
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: XMRig injection failed
  - id: transacted-section-diagnostic
    desc: Transacted section failure diagnostic
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: Creating transacted section has failed
  - id: ppid-spoof-diagnostic
    desc: PPID spoof process creation diagnostic
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: CreateProcessW (PPID spoof) failed
  - id: payload-executing-diagnostic
    desc: Injected payload execution diagnostic
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: Thread resumed successfully, payload executing
