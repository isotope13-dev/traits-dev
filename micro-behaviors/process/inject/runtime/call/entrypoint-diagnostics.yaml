defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: entrypoint-redirection-diagnostic
    desc: Executable entry point redirection diagnostic
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: Redirected entry point, waiting for initialization
      section: .rdata
  - id: xmrig-injection-diagnostic
    desc: XMRig process injection failure diagnostic
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: XMRig injection failed
      section: .rdata
