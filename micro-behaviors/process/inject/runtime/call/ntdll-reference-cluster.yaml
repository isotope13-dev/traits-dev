defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
- id: ntdll-write-memory-api-references
  desc: ntdll and NtWriteVirtualMemory API references
  crit: notable
  conf: 0.9
  all:
    - id: micro-behaviors/os/syscall/invoke::ntdll-import
    - id: micro-behaviors/os/syscall/raw::nt-write-ssn
  unless:
    # Wine/ReactOS builtins implement these NT syscalls (ntdll/kernelbase) — they
    # provide the API, not abuse it, so suppress rather than merely downgrade.
    - id: metadata/binary/vendor/
    - id: well-known/app/system/reactos/
    - id: metadata/binary/symbols/exports::appcompat-gethookapis-export
    - id: well-known/tool/sysadmin/chroot-win/
    - id: well-known/tool/reverse-engineering/
    - id: micro-behaviors/os/syscall/invoke::nt-api-provider-tooling
  downgrade:
    any:
    - type: metrics
      field: exports.count
      min: 256
    - id: well-known/tool/sysadmin/systeminformer::systeminformer-product
