# A malware-analysis tool lists the Windows API names it looks for in a sample's
# imports (`["VirtualAllocEx", "WriteProcessMemory", "CreateRemoteThread"]`) to
# classify behavior. Those quoted names are the vocabulary of a detector, not
# calls the script makes. Injection code reaches the same functions as calls or
# as ffi bindings keyed `name: [...]`, never as a run of adjacent quoted names.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: winapi-injection-name-string-list
    desc: Quoted list of injection API names
    if:
      type: text
      regex: '["''](WriteProcessMemory|CreateRemoteThread|LoadLibrary\w*)["'']\s*,\s*["''][A-Z]\w{6,}'
