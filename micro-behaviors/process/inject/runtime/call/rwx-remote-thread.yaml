composite_rules:
- id: rwx-remote-thread-api-set
  desc: RWX allocation and remote-thread APIs
  # The primitive pair is a strong process-injection signal, but debuggers,
  # compatibility runtimes, and instrumentation can use it legitimately.
  # Hostile composites add a concrete injected payload or attacker objective.
  crit: notable
  for: [pe, dll, c, cpp]
  platforms: [windows]
  conf: 0.95
  all:
  - id: micro-behaviors/mem/alloc/executable::rwx-allocation
  - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-dup
  unless:
  - id: micro-behaviors/process/inject/runtime/call::rwx-remote-thread-context-exception
  - id: metadata/binary/framework::dotnet-metadata
  - id: metadata/lang/upstream::dotnet-pinvoke-binding-assembly
  - id: well-known/app/utility/locale-injection/
  - id: well-known/app/storage/syncback::syncback-backup-benign-context
  - id: well-known/app/storage/syncback::syncback-shell-ext-benign-context
  - id: well-known/tool/browser::chrome-product-name
  - id: metadata/file/extension/identity::markdown-file-basename
  # al-khaser touches RWX allocation and remote-thread primitives while
  # testing injection detection.
  - id: well-known/tool/offensive/frameworks::al-khaser-benign-context
