defaults:
  for: [pe, dll]
  platforms: [windows]

composite_rules:
  - id: download-and-remote-process-api-references
    desc: Download and remote-process manipulation API references
    crit: notable
    conf: 0.96
    scope: leaf
    all:
      - id: micro-behaviors/communications/http/client/urlmon::url-download-to-file
      - id: micro-behaviors/process/create/launch::create-process-api-name
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/info/thread::thread-context-api-pair
    any:
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
      - id: micro-behaviors/process/info/thread::resume-thread
      - id: micro-behaviors/communications/http/client/wininet::delete-url-cache-entry
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: metadata/binary/symbols/count::many-exports-200
      - id: well-known/app/system/iobit::advanced-systemcare-component-context
