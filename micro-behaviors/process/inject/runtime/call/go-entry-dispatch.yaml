# Go's Windows ABI passes the target procedure in AX and the first four
# arguments in BX, CX, DI and SI.  This byte shape is the call site produced by
# syscall.Syscall(entry, 1, 2, 3, 4): a computed address is invoked directly,
# rather than a named Win32 import.  The objective layer combines this neutral
# execution primitive with executable-memory allocation and obfuscation.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
  attack: T1620

traits:
  - id: go-syscall-computed-entry-dispatch-x64
    desc: Go calls computed address via syscall.Syscall
    crit: notable
    conf: 0.88
    if:
      type: hex
      section: .text
      pattern: '48 8B 84 24 ?? ?? ?? ?? BB 01 00 00 00 B9 02 00 00 00 BF 03 00 00 00 BE 04 00 00 00 E8 ?? ?? ?? ??'
