# Windows process-injection runtime primitives. These are the raw API
# capabilities (memory read/write into another process, remote thread
# creation, thread context manipulation, suspend/resume).
# Neutral capability tier per TAXONOMY.md — intent is inferred by the
# composite in `objectives/evasion/process/injection/thread-hijacking.yaml`
# and related composites, which reference these IDs across tiers.
defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
traits:
- id: write-process-memory-binary
  desc: WriteProcessMemory API reference
  crit: notable
  conf: 0.95
  attack: T1055
  mbc: C0032
  if:
    type: import
    exact: WriteProcessMemory
  unless:
  - id: well-known/game/mod::bedrockboot-preload-injector-pdb
  downgrade:
    any:
    - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
    - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
    - id: metadata/lang/compiled/
- id: write-process-memory-source
  desc: WriteProcessMemory API reference in source
  crit: notable
  conf: 0.95
  attack: T1055
  mbc: C0032
  for: [c, cpp, csharp, python, rust]
  if:
    type: symbol
    kind: call
    regex: '(^|\.)WriteProcessMemory$'
  unless:
  - id: well-known/tool/development/debugpy
  - id: well-known/tool/development/debugpy::package-path-marker
  downgrade:
    any:
    - type: basename
      regex: '(?i)(debugpy|pydevd|inject_dll\.cpp)'
    - type: text
      regex: debugpy
    - type: text
      regex: pydevd_attach_to_process
    - type: text
      regex: pydevd
- id: write-process-memory-rust-text
  desc: Rust source WriteProcessMemory API reference
  crit: notable
  conf: 0.9
  attack: T1055
  mbc: C0032
  for: [rust]
  if:
    type: text
    word: WriteProcessMemory
  unless:
  - id: write-process-memory-source
- id: write-process-memory-script
  desc: WriteProcessMemory API reference in script
  crit: notable
  conf: 0.95
  attack: T1055
  mbc: C0032
  for: [powershell, batch, vbs, javascript]
  if:
    type: symbol
    exact: WriteProcessMemory
  unless:
  - id: metadata/package/testing/
  - id: metadata/package/testing/presence/manifest::test-fixtures
# Dynamically resolved / delay-loaded imports often leave only the API name as
# a string — keep a text atom so injection composites still see the capability.
- id: write-process-memory-text
  desc: WriteProcessMemory API string reference
  crit: notable
  conf: 0.9
  attack: T1055
  mbc: C0032
  for: [pe, dll, powershell, batch, vbs, javascript]
  if:
    type: text
    word: WriteProcessMemory
  unless:
  - id: well-known/game/mod::bedrockboot-preload-injector-pdb
- id: create-remote-thread-script
  desc: CreateRemoteThread API reference in script
  crit: notable
  conf: 0.94
  attack: T1055.001
  mbc: C0032
  for: [powershell, batch, vbs, javascript]
  if:
    type: text
    word: CreateRemoteThread
- id: read-process-memory
  desc: References ReadProcessMemory process read API
  crit: notable
  conf: 0.95
  attack: T1005
  if:
    type: symbol
    exact: ReadProcessMemory
  downgrade:
    any:
    - id: metadata/package/quality/
    - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
- id: nt-read-virtual-memory-reference
  desc: NtReadVirtualMemory remote read API reference
  crit: notable
  conf: 0.95
  attack: T1005
  for: [pe, dll, c, cpp, csharp, rust, go, python]
  if:
    type: text
    word: NtReadVirtualMemory
  unless:
  - id: metadata/package/quality/
- id: nt-write-virtual-memory-source
  desc: Calls NtWriteVirtualMemory process-memory API
  crit: notable
  conf: 0.97
  attack: T1055
  mbc: C0032
  for: [c, cpp, csharp, rust, go, python]
  if:
    type: symbol
    kind: call
    exact: NtWriteVirtualMemory
  unless:
  - id: metadata/package/quality/
- id: set-thread-context-dup
  desc: SetThreadContext import
  crit: notable
  conf: 0.95
  attack: T1055
  if:
    type: import
    exact: SetThreadContext
  downgrade:
    any:
    - id: metadata/package/quality/
    - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
    - id: metadata/binary/framework/
    # Go's windows syscall runtime imports this API for its own thread
    # management.  The import alone is not evidence of thread hijacking.
    - id: metadata/lang/compiled::go-runtime-marker
    - id: metadata/lang/compiler/systems::go-pe-symtab
    - id: well-known/game/mod::bedrockboot-preload-cpp-pdb
- id: set-thread-context-text
  desc: SetThreadContext dynamic API string
  crit: notable
  conf: 0.9
  attack: T1055
  mbc: C0032
  if:
    type: text
    word: SetThreadContext
  # Only runtimes that genuinely embed this API name — the CLR, the Java
  # launcher, the Electron/Chromium runtime — are excluded. The former blanket
  # `metadata/binary/framework/` directory exclusion also covered VB6, MFC/ATL,
  # MinGW and UPX-packed images, which hid the thread-context string in exactly
  # the crypter stubs (VB6 `Declare Function` RunPE loaders) it should surface.
  unless:
    - id: metadata/binary/framework::dotnet-assembly
    - id: metadata/binary/framework::java-launcher-proxy-exports
    - id: metadata/binary/framework::electron-desktop-runtime
    - id: metadata/lang/compiled::go-runtime-marker
    - id: metadata/lang/compiler/systems::go-pe-symtab
    - id: well-known/game/mod::bedrockboot-preload-cpp-pdb
- id: get-thread-context-dup
  desc: GetThreadContext import
  crit: notable
  conf: 0.9
  attack: T1005
  if:
    type: import
    exact: GetThreadContext
  downgrade:
    any:
    - id: metadata/package/quality/
    - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
    - id: metadata/binary/framework/
    # Go's Windows runtime imports this API for scheduler/thread management;
    # the standalone import is not evidence of application-level hijacking.
    - id: metadata/lang/compiled::go-runtime-marker
    - id: metadata/lang/compiler/systems::go-pe-symtab
    - id: well-known/game/mod::bedrockboot-preload-cpp-pdb
- id: get-thread-context-text
  desc: GetThreadContext dynamic API string
  crit: notable
  conf: 0.9
  attack: T1005
  mbc: C0032
  if:
    type: text
    word: GetThreadContext
  # Narrowed for the same reason as set-thread-context-text above: keep the
  # managed/JIT runtimes that ship this API name, drop the blanket framework
  # directory that also exempted every VB6, MFC and UPX-packed image.
  unless:
    - id: metadata/binary/framework::dotnet-assembly
    - id: metadata/binary/framework::java-launcher-proxy-exports
    - id: metadata/binary/framework::electron-desktop-runtime
    - id: metadata/lang/compiled::go-runtime-marker
    - id: metadata/lang/compiler/systems::go-pe-symtab
    - id: well-known/game/mod::bedrockboot-preload-cpp-pdb
- id: go-write-process-memory-wrapper
  desc: Go remote memory-write wrapper
  crit: notable
  conf: 0.95
  attack: T1055
  if:
    type: text
    regex: '(?i)\bcallWriteProcessMemory\b'
- id: go-get-thread-context-wrapper
  desc: Go remote thread-context read wrapper
  crit: notable
  conf: 0.95
  attack: T1055
  if:
    type: text
    regex: '(?i)\bcallGetThreadContext\b'
- id: go-set-thread-context-wrapper
  desc: Go remote thread-context set wrapper
  crit: notable
  conf: 0.95
  attack: T1055
  if:
    type: text
    regex: '(?i)\bcallSetThreadContext\b'
- id: go-unmap-view-wrapper
  desc: Go call-wrapper for remote image unmapping
  crit: notable
  conf: 0.95
  attack: T1055.012
  if:
    type: text
    regex: '(?i)\bcallNtUnmapViewOfSection\b'
- id: suspend-thread
  desc: SuspendThread API reference
  crit: notable
  conf: 0.9
  attack: T1055
  if:
    type: text
    exact: SuspendThread
  count_min: 3
  downgrade:
    any:
    - id: metadata/package/quality/
    - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
  unless:
  - type: basename
    regex: \.pyd$
  - id: metadata/lang/compiler/systems/
  - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: metadata/binary/framework/
# Note: the extended-remote-thread symbol trait
# (`CreateRemoteThreadEx` / `NtCreateThreadEx` / `RtlCreateUserThread`) lives in
# `objectives/evasion/fileless/memory::create-thread-sym` — injection-tier
# composites that want it reference that ID directly, avoiding duplication here.
- id: mavinject-injectrunning-string
  desc: App-V mavinject /INJECTRUNNING injection flag
  crit: notable
  conf: 0.95
  attack: T1055
  if:
    type: text
    exact: /INJECTRUNNING
- id: binaryinjector-header-ref
  desc: binaryinjector.h source header reference
  crit: suspicious
  conf: 0.97
  if:
    type: text
    exact: binaryinjector.h
  unless:
    - id: metadata/signed/platform::microsoft
    - id: metadata/signed/leaf::microsoft-corporation
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
    - id: well-known/app/enterprise/microsoft-office-support::microsoft-office-support-bundle-context
    # The string is a source-header name, so it asserts something about how the
    # analysed program was BUILT. When the file also contains a whole other PE
    # (a prepending infector carrying its victim, a wrapper around a bundled
    # tool) the string may belong to that inner image, which cleave analyses as
    # its own leaf and where the Microsoft carve-outs above still apply. The
    # existing guards then silently stop working for the container, which is how
    # an unsigned Delphi file infector ended up described as built from injector
    # source because the Microsoft utility it had infected mentions the header.
    - id: metadata/binary/layout::pe-embedded
- id: onenote-elevation-pdb
  desc: OneNote elevation server PDB path
  crit: suspicious
  conf: 0.99
  if:
    type: text
    substr: onelev.pdb
- id: native-remote-thread-create--ntcreatethreadex
  desc: NtCreateThreadEx API reference
  crit: suspicious
  conf: 0.97
  for: [pe, dll, c, cpp, csharp, python]
  if:
    type: symbol
    exact: NtCreateThreadEx
  unless:
  - id: well-known/lib/platform/microsoft-wow64/
  - id: metadata/binary/vendor::windows-system-implementer-dll
  - id: metadata/binary/vendor::glarysoft-ltd
  - id: well-known/lib/platform/wine/
  - id: well-known/app/utility/dism-plus-plus::dism-plus-plus-main-context
  - id: well-known/app/utility/dism-plus-plus::dism-plus-plus-plugin-context
  - id: well-known/app/development/wu-framework::wu-framework-native-cli
  - id: well-known/app/system/iobit::advanced-systemcare-component-context
  # A broad import table is common in full application/runtime DLLs; an
  # import alone is not enough to call it suspicious in that context.
  downgrade:
    any:
    - id: metadata/binary/metrics/structural::many-imports
- id: native-remote-thread-create--rtlcreateuserthread
  desc: Native remote thread (RtlCreateUserThread)
  crit: suspicious
  conf: 0.97
  for: [pe, dll, c, cpp, csharp, python]
  if:
    type: symbol
    exact: RtlCreateUserThread
  unless:
  - id: metadata/binary/vendor::windows-system-implementer-dll
  - id: metadata/binary/vendor::glarysoft-ltd
  - id: well-known/lib/platform/wine/
  - id: well-known/app/utility/windows-wer-diag::wer-diag-controller-system-context
  - id: well-known/app/development/wu-framework::wu-framework-native-cli
  - id: well-known/app/system/iobit::advanced-systemcare-component-context
- id: native-remote-thread-create--rtlcreateuserthread-text
  desc: Resolved RtlCreateUserThread API string
  crit: notable
  conf: 0.95
  attack: T1055.001
  mbc: C0032
  for: [pe, dll, c, cpp, csharp, python]
  if:
    type: text
    word: RtlCreateUserThread
  unless:
  - id: metadata/binary/vendor::windows-system-implementer-dll
  - id: metadata/binary/vendor::glarysoft-ltd
  - id: well-known/lib/platform/wine/
  - id: well-known/app/utility/windows-wer-diag::wer-diag-controller-system-context
# Beacon's BOF API is a neutral process-injection capability. A declaration is
# useful context for a BOF header, while an actual call is the stronger signal;
# Havoc-specific intent is inferred only by composites in the known-entity tier.
- id: beacon-inject-process-api-declaration
  desc: Beacon BOF process injection API declaration
  crit: notable
  conf: 0.95
  attack: T1055
  mbc: C0032
  for: [c, cpp]
  if:
    type: text
    regex: 'DECLSPEC_IMPORT\s+[^;\n]{0,180}\bBeaconInjectProcess\s*\('

- id: beacon-inject-process-api-call
  desc: Beacon BOF process injection API call
  crit: notable
  conf: 0.98
  attack: T1055
  mbc: C0032
  for: [c, cpp]
  if:
    type: symbol
    kind: call
    exact: BeaconInjectProcess

# Go source uses syscall.NewLazyDLL/NewProc rather than PE imports. These are
# neutral API atoms; intent is inferred by the Go injection composites.
- id: go-ntcreatethreadex-wrapper
  desc: Go NtCreateThreadEx wrapper
  crit: notable
  conf: 0.98
  attack: T1055.001
  mbc: B0013
  for: [go]
  if:
    type: text
    regex: '(?i)(NewProc\("NtCreateThreadEx"\)|func\s+NtCreateThreadEx\s*\()'
- id: go-loadlibraryw-wrapper
  desc: Go LoadLibraryW wrapper
  crit: notable
  conf: 0.97
  attack: T1055.001
  mbc: B0013
  for: [go]
  if:
    type: text
    regex: '(?i)(NewProc\("LoadLibraryW"\)|func\s+LoadLibraryW\s*\()'
- id: go-create-remote-thread-wrapper
  desc: Go CreateRemoteThread API wrapper reference
  crit: notable
  conf: 0.95
  attack: T1055.001
  mbc: B0013
  for: [go]
  if:
    type: text
    regex: '(?i)(NewProc\("CreateRemoteThread"\)|func\s+CreateRemoteThread\s*\()'
- id: go-virtual-alloc-ex-wrapper
  desc: Go VirtualAllocEx API wrapper reference
  crit: notable
  conf: 0.95
  attack: T1055
  mbc: B0013
  for: [go]
  if:
    type: text
    regex: '(?i)(NewProc\("VirtualAllocEx"\)|func\s+VirtualAllocEx\s*\()'
- id: go-write-process-memory-api-wrapper
  desc: Go WriteProcessMemory API wrapper reference
  crit: notable
  conf: 0.95
  attack: T1055
  mbc: B0013
  for: [go]
  if:
    type: text
    regex: '(?i)(NewProc\("WriteProcessMemory"\)|func\s+WriteProcessMemory\s*\()'
composite_rules:
- id: remote-memory-write-thread-api-set
  desc: Remote memory write and thread APIs
  crit: notable
  conf: 0.96
  all:
  - id: create-remote-thread-dup
  - id: write-process-memory-dup
- id: remote-process-injection-api-set
  desc: Multiple remote-process manipulation APIs
  crit: notable
  conf: 0.94
  needs: 2
  any:
  - id: micro-behaviors/process/inject/dll::create-remote-thread
  - id: write-process-memory-dup
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
  - id: micro-behaviors/os/syscall/invoke::ntdll-direct-memory-op-a
- id: remote-process-memory-api-cluster
  desc: Two or more remote-process memory APIs
  crit: notable
  conf: 0.96
  needs: 2
  any:
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
  - id: write-process-memory-dup
  - id: micro-behaviors/mem/protect/modify::virtual-free-ex
  unless:
  - id: well-known/game/mod::bedrockboot-preload-injector-pdb
- id: native-remote-thread-create
  desc: Native remote thread creation API
  crit: suspicious
  conf: 0.97
  attack: T1055.001
  mbc: B0013
  for: [pe, dll, c, cpp, csharp, python]
  unless:
  - id: metadata/binary/vendor/
  - id: well-known/app/utility/dism-plus-plus::dism-plus-plus-main-context
  - id: well-known/app/utility/dism-plus-plus::dism-plus-plus-plugin-context
  - id: well-known/app/utility/windows-wer-diag::wer-diag-controller-system-context
  - id: well-known/app/development/wu-framework::wu-framework-native-cli
  - id: well-known/app/system/iobit::advanced-systemcare-component-context
# The thread-context primitives below are used by the Go runtime for GC
# stop-the-world and goroutine preemption, and by Microsoft Detours, Valve
# games, and OllyDbg plugins — all legitimate. Downgrade when any of those
# runtimes are present so only deliberate use (composite `thread-execution-hijacking`)
# surfaces as a finding.
  any:
  - id: native-remote-thread-create--ntcreatethreadex
  - id: native-remote-thread-create--rtlcreateuserthread
- id: create-remote-thread-dup
  desc: Remote thread creation API reference
  crit: notable
  conf: 0.98
  attack: T1055.001
  mbc: B0013
  for: [pe, dll, c, cpp, csharp, python, rust]
  any:
  - id: micro-behaviors/process/inject/dll::create-remote-thread
  - id: micro-behaviors/process/inject/dll::create-remote-thread-source
  - id: micro-behaviors/process/inject/dll::create-remote-thread-text
  - id: native-remote-thread-create
  downgrade:
    any:
    - id: metadata/package/quality/
    - id: metadata/package/quality/
    - id: metadata/lang/compiled/
    - id: metadata/binary/framework/
    - id: well-known/tool/development/debugpy::attach-helper-path
    - id: well-known/lib/runtime/v8::isolate-symbol
  unless:
  - id: well-known/game/mod::bedrockboot-preload-injector-pdb
- id: write-process-memory-dup
  desc: WriteProcessMemory API reference
  crit: notable
  conf: 0.95
  attack: T1055
  mbc: C0032
  for: [binaries, source, scripts]
  any:
  - id: write-process-memory-binary
  - id: write-process-memory-source
  - id: write-process-memory-rust-text
  - id: write-process-memory-script
  - id: write-process-memory-text
