# Windows process-injection runtime primitives. These are the raw API
# capabilities (memory read/write into another process, remote thread
# creation, thread context manipulation, suspend/resume).
# Neutral capability tier per TAXONOMY.md — intent is inferred by the
# composite in `objectives/evasion/process/injection/thread-hijacking.yaml`
# and related composites, which reference these IDs across tiers.
defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
traits:
- id: nt-read-virtual-memory-reference
  desc: NtReadVirtualMemory remote read API reference
  crit: notable
  conf: 0.95
  attack: T1005
  for: [pe, dll, c, cpp, csharp, rust, go, python]
  if:
    type: text
    word: NtReadVirtualMemory
  unless:
  - id: metadata/build/recognized-contexts/
- id: nt-write-virtual-memory-source
  desc: Calls NtWriteVirtualMemory process-memory API
  crit: notable
  conf: 0.97
  attack: T1055
  mbc: C0032
  for: [c, cpp, csharp, rust, go, python]
  if:
    type: symbol
    kind: call
    exact: NtWriteVirtualMemory
  unless:
  - id: metadata/build/recognized-contexts/
- id: go-write-process-memory-wrapper
  desc: Go remote memory-write wrapper
  crit: notable
  conf: 0.95
  attack: T1055
  if:
    type: text
    regex: '(?i)\bcallWriteProcessMemory\b'
- id: go-get-thread-context-wrapper
  desc: Go remote thread-context read wrapper
  crit: notable
  conf: 0.95
  attack: T1055
  if:
    type: text
    regex: '(?i)\bcallGetThreadContext\b'
- id: go-set-thread-context-wrapper
  desc: Go remote thread-context set wrapper
  crit: notable
  conf: 0.95
  attack: T1055
  if:
    type: text
    regex: '(?i)\bcallSetThreadContext\b'
- id: go-unmap-view-wrapper
  desc: Go call-wrapper for remote image unmapping
  crit: notable
  conf: 0.95
  attack: T1055.012
  if:
    type: text
    regex: '(?i)\bcallNtUnmapViewOfSection\b'
- id: suspend-thread
  desc: SuspendThread API reference
  crit: notable
  conf: 0.9
  attack: T1055
  if:
    type: text
    exact: SuspendThread
  count_min: 3
  downgrade:
    any:
    - id: metadata/build/recognized-contexts/
    - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
  unless:
  # The symbol records the API being used; this also sees the name sitting in
  # data. Standing down there keeps one use from counting twice.
  - id: micro-behaviors/process/info/thread::suspend-thread-import
  - type: basename
    regex: \.pyd$
  - id: metadata/lang/compiler/systems/
  - id: metadata/binary/framework/
# Note: the extended-remote-thread symbol trait
# (`CreateRemoteThreadEx` / `NtCreateThreadEx` / `RtlCreateUserThread`) lives in
# `micro-behaviors/process/inject/remote-thread::remote-thread-api-reference` — injection-tier
# composites that want it reference that ID directly, avoiding duplication here.
- id: mavinject-injectrunning-string
  desc: App-V mavinject /INJECTRUNNING injection flag
  crit: notable
  conf: 0.95
  attack: T1055
  if:
    type: text
    exact: /INJECTRUNNING
- id: binaryinjector-header-ref
  desc: binaryinjector.h source header reference
  crit: suspicious
  conf: 0.97
  if:
    type: text
    exact: binaryinjector.h
  unless:
    - id: metadata/signed/platform::microsoft
    - id: metadata/signed/leaf::microsoft-corporation
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
    - id: well-known/app/enterprise/microsoft-office-support::microsoft-office-support-bundle-context
    # The string is a source-header name, so it asserts something about how the
    # analysed program was BUILT. When the file also contains a whole other PE
    # (a prepending infector carrying its victim, a wrapper around a bundled
    # tool) the string may belong to that inner image, which cleave analyses as
    # its own leaf and where the Microsoft carve-outs above still apply. The
    # existing guards then silently stop working for the container, which is how
    # an unsigned Delphi file infector ended up described as built from injector
    # source because the Microsoft utility it had infected mentions the header.
    - id: metadata/binary/layout/embedded::pe-embedded
- id: onenote-elevation-pdb
  desc: OneNote elevation server PDB path
  crit: suspicious
  conf: 0.99
  if:
    type: text
    substr: onelev.pdb
- id: beacon-inject-process-api-declaration
  desc: Beacon BOF process injection API declaration
  crit: notable
  conf: 0.95
  attack: T1055
  mbc: C0032
  for: [c, cpp]
  if:
    type: text
    regex: 'DECLSPEC_IMPORT\s+[^;\n]{0,180}\bBeaconInjectProcess\s*\('

- id: beacon-inject-process-api-call
  desc: Beacon BOF process injection API call
  crit: notable
  conf: 0.98
  attack: T1055
  mbc: C0032
  for: [c, cpp]
  if:
    type: symbol
    kind: call
    exact: BeaconInjectProcess

# Go source uses syscall.NewLazyDLL/NewProc rather than PE imports. These are
# neutral API atoms; intent is inferred by the Go injection composites.
- id: go-ntcreatethreadex-wrapper
  desc: Go NtCreateThreadEx wrapper
  crit: notable
  conf: 0.98
  attack: T1055.001
  mbc: B0013
  for: [go]
  if:
    type: text
    regex: '(?i)(NewProc\("NtCreateThreadEx"\)|func\s+NtCreateThreadEx\s*\()'
- id: go-loadlibraryw-wrapper
  desc: Go LoadLibraryW wrapper
  crit: notable
  conf: 0.97
  attack: T1055.001
  mbc: B0013
  for: [go]
  if:
    type: text
    regex: '(?i)(NewProc\("LoadLibraryW"\)|func\s+LoadLibraryW\s*\()'
- id: go-create-remote-thread-wrapper
  desc: Go CreateRemoteThread API wrapper reference
  crit: notable
  conf: 0.95
  attack: T1055.001
  mbc: B0013
  for: [go]
  if:
    type: text
    regex: '(?i)(NewProc\("CreateRemoteThread"\)|func\s+CreateRemoteThread\s*\()'
- id: go-virtual-alloc-ex-wrapper
  desc: Go VirtualAllocEx API wrapper reference
  crit: notable
  conf: 0.95
  attack: T1055
  mbc: B0013
  for: [go]
  if:
    type: text
    regex: '(?i)(NewProc\("VirtualAllocEx"\)|func\s+VirtualAllocEx\s*\()'
- id: go-write-process-memory-api-wrapper
  desc: Go WriteProcessMemory API wrapper reference
  crit: notable
  conf: 0.95
  attack: T1055
  mbc: B0013
  for: [go]
  if:
    type: text
    regex: '(?i)(NewProc\("WriteProcessMemory"\)|func\s+WriteProcessMemory\s*\()'

composite_rules:
- id: remote-process-injection-api-set
  desc: Multiple remote-process manipulation APIs
  crit: notable
  conf: 0.94
  needs: 2
  any:
  - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
  - id: micro-behaviors/process/inject/runtime/call::ntdll-write-memory-api-references
- id: remote-process-memory-api-cluster
  desc: Two or more remote-process memory APIs
  crit: notable
  conf: 0.96
  needs: 2
  any:
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/mem/free::virtual-free-ex
  unless:
  - id: well-known/game/mod::bedrockboot-preload-injector-pdb
