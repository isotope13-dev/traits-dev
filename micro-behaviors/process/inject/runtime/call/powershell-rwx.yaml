defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-rwx-buffer-dispatch
    desc: PowerShell runs shellcode from RWX memory
    crit: notable
    conf: 0.97
    attack: T1620,T1106
    mbc: B0023
    all:
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-function-pointer-delegate
      - id: micro-behaviors/mem/alloc/executable::powershell-virtualalloc-call
      - id: micro-behaviors/mem/alloc/executable::powershell-rwx-protection-flag
      - id: "micro-behaviors/mem/copy::marshal-copy-powershell"
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-null-pointer-delegate-invoke
    unless:
      - id: micro-behaviors/mem/combined::powershell-delegate-alloc-copy-protect
      - id: metadata/build/scaffold::ruby-format-payload-placeholder
