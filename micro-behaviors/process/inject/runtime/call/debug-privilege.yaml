defaults:
  platforms: [windows]
  for: [pe, dll, rust]
  attack: T1055
  mbc: E1055
composite_rules:
# PoolParty attribution is not neutral API evidence; its own objective remains.
  - id: debug-privilege-remote-memory-api-cluster
    for: [pe]
    desc: Debug privilege with remote-memory injection APIs
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/os/privilege/token::high-risk-privilege-name
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges
    any:
      - id: micro-behaviors/process/inject/dll::create-remote-thread
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/os/syscall/raw::nt-write-ssn
    needs: 2
    unless:
      # Compiled AutoIt embeds a general-purpose interpreter with these token
      # and remote-process APIs regardless of the script payload.
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: micro-behaviors/process/inject/runtime/call::debug-privilege-product-context
      - id: well-known/lib/runtime/scripted/electron::nodejs-webstorage-marker
      - id: metadata/build/openra::openra-system-library-helper
      - id: metadata/binary/vendor::microsoft-corp-versioninfo
      - id: well-known/tool/sysadmin/sandboxie/
      # Shunwang MainProcKeeper is a cloud-terminal watchdog. It enables
      # SeDebugPrivilege and redirects its own helper thread; that is the
      # product, including when a dump classifies the DLL as a PE.
      - id: well-known/app/utility/shunwang-mainproc::main-proc-keeper-watchdog

  - id: debug-privilege-tooling-context
    desc: Known benign tooling context for debug-privilege API overlap
    crit: exception
    conf: 0.95
    any:
      - id: well-known/lib/media/ffmpeg/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/sysadmin/jvm::jdk-attach-library
      - id: metadata/binary/symbols/plugin/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/app/utility/installer::openra-installer
      # The versioned product description alone identifies BlueLife Hosts
      # Editor; the full four-field composite would push the parent rule
      # over its suppression budget.
      - id: well-known/app/utility/sordum::bluelife-hosts-editor-description
      - id: well-known/tool/detection/threat-intel/
      - id: well-known/tool/sysadmin/universal-extractor/
      - id: well-known/app/system/iobit/

  - id: debug-privilege-product-context
    desc: Known products using debug-privilege injection
    crit: exception
    conf: 0.99
    any:
      - id: micro-behaviors/process/inject/runtime/call::debug-privilege-tooling-context
      - id: well-known/tool/browser::google-chrome-installer
      - id: well-known/game/steam::valve-signed-steam-binary
      - id: well-known/game/cheat::inventory-changer-blackbone-context

