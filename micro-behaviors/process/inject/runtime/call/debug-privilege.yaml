defaults:
  platforms: [windows]
  for: [pe, dll, rust]
composite_rules:
# PoolParty attribution is not neutral API evidence; its own objective remains.
  - id: debug-privilege-remote-memory-api-cluster
    for: [pe]
    desc: Token privilege and remote-memory API cluster
    crit: notable
    conf: 0.92
    all:
      - id: metadata/file/system-info/privilege-name::high-risk-privilege-name
      - id: micro-behaviors/os/privilege/token::adjust-token-privileges-any
    any:
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
      - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-name
    needs: 2

