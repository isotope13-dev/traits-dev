defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86-64]
  crit: notable
  conf: 0.93
traits:
  # A byte-at-a-time copy loop (optionally with a serializing fence per byte)
  # whose fall-through jumps to a register: the copied bytes are code, entered
  # without a call frame. Seen in the instapp padded loader, which copies a
  # stub from .data into fresh RWX memory and `jmp r11`s into it.
  - id: byte-copy-loop-register-jump-x64
    desc: Byte-copy loop falls through to register jump
    attack: T1620
    if:
      type: hex
      section: .text
      pattern: '8A ?? [0-3] 88 ?? 48 FF C? 48 FF C? 48 FF C? 75 ?? [0-12] (41 FF E?|FF E?)'
  # `call $+5; pop reg` recovers the instruction pointer. x64 code addresses
  # its own data RIP-relatively, so compiled 64-bit code never needs this;
  # it is the position-independent shellcode idiom.
  - id: call-pop-getpc-x64
    desc: x64 call/pop instruction-pointer recovery
    if:
      type: hex
      section: .text
      pattern: 'E8 00 00 00 00 (58|59|5A|5B|5D|5E|5F|41 5?)'
  # Remote-thread parameter adapter stored in read-only data for copying into
  # a target process: unpacks a struct pointer in RCX into (0, 0, rcx+disp1,
  # rcx+disp2) and calls qword [rcx] (e.g. LdrLoadDll via CreateRemoteThread).
  - id: rdata-remote-thread-four-arg-adapter-x64
    desc: x64 four-arg remote-thread adapter in .rdata
    conf: 0.98
    attack: T1055
    if:
      type: hex
      section: .rdata
      pattern: '49 89 CA 48 83 EC 28 31 C9 31 D2 4D 8D 42 ?? 4D 8D 4A ?? 41 FF 12 48 83 C4 28 C3'
  # Remote-thread TLS callback dispatcher stored in read-only data for manual
  # mapping: iterates a null-terminated callback array and invokes each entry
  # with (ImageBase, DLL_PROCESS_ATTACH = 1, NULL).
  - id: rdata-remote-tls-callback-runner-x64
    desc: x64 remote TLS callback runner in .rdata
    conf: 0.98
    attack: T1055
    if:
      type: hex
      section: .rdata
      pattern: '48 8B 06 48 85 C0 74 ?? 48 8B 0B BA 01 00 00 00 45 31 C0 FF D0 48 83 C6 08 EB'
