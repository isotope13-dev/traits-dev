# Co-occurring FFI declarations and protection constants do not prove a
# source-to-entry-point relationship, remote injection, or malicious intent.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
composite_rules:
  - id: koffi-rwx-copy-thread-api-profile
    desc: Koffi RWX, memory-copy and thread API profile
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/dylib/load/binding::koffi-import
      - id: micro-behaviors/dylib/load/binding::koffi-load-call
      - id: micro-behaviors/mem/alloc/executable::javascript-virtualalloc-rwx-reference
      - id: micro-behaviors/mem/copy::javascript-rtlmovememory-reference
      - id: micro-behaviors/process/thread/create::javascript-createthread-reference
