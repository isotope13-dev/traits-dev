defaults:
  platforms: [windows]
composite_rules:
  - id: remote-allocation-write-thread-api-references
    size_min: 512
    size_max: 500000000
    desc: Remote allocation, write and thread API references
    crit: notable
    for:
    - pe
    needs: 3
    any:
    - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
    - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
    - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-dup
  - id: remote-process-api-profile
    for: [pe, dll]
    desc: Remote-process API cluster outside framework images
    crit: notable
    conf: 0.66
    mbc: "B0033"
    attack: "T1055"
    all:
      - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
    unless:
      - id: metadata/binary/symbols/count::many-exports-200
      - id: metadata/binary/symbols/plugin/
      - id: well-known/lib/ui/
      # Only suppress for authentic framework images — not string-table hits
      # in native runtimes. The framework directory contains the validated
      # metadata/header identities used by this rule.
      - id: metadata/binary/framework/
      - id: metadata/signed/leaf::google-inc
      - id: well-known/app/system/iobit::iobit-signed-component-context
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
      # syspin is a Pin To Taskbar utility; its remote-process API set is how
      # it asks Explorer to pin a shortcut. Require the full identity before
      # suppressing this capability.
      - id: well-known/tool/sysadmin/syspin/
      # pzLauncher uses remote memory APIs to patch its game target.
      - id: well-known/game/pvzlauncher::plants-vs-zombies-steam-target
