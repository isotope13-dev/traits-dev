defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  crit: notable
  conf: 0.96
traits:
  - id: executable-dos-header-call-pop-x86
    desc: DOS header computes and calls bootstrap
    if:
      type: hex
      offset: 0
      # MZ is executable x86 code here. call/pop recovers the image base,
      # passes it as an argument, and calls base + a variable bootstrap RVA.
      pattern: '4D 5A [2] E8 00 00 00 00 58 83 E8 09 50 05 ?? ?? ?? ?? FF D0 C3'
  - id: mapped-pe-entry-dispatch-x86
    desc: Dispatches mapped PE entry by DLL flag
    if:
      type: hex
      # PE AddressOfEntryPoint + image base; IMAGE_FILE_DLL selects the
      # three-argument DLL_PROCESS_ATTACH call versus a bare EXE call.
      # Appended bootstrap sits outside sections, within the final page.
      offset_range: [-4096, null]
      pattern: '8B 46 28 B9 00 20 00 00 03 C7 66 85 4E 16 74 ?? 53 6A 01 57 FF D0 EB ?? FF D0'
  - id: mapped-pe-signature-check-x86
    desc: Checks mapped DOS and NT signatures
    if:
      type: hex
      offset_range: [-4096, null]
      pattern: 'B8 4D 5A 00 00 66 39 07 0F 85 ?? ?? ?? ?? 8B 77 3C 03 F7 81 3E 50 45 00 00'
  - id: transformed-stack-buffer-dispatch-x86
    desc: Calls stack-local transformed buffer
    attack: T1620
    if:
      type: hex
      section: .text
      # A local transform/decrypt routine returns a buffer pointer in a stack
      # slot. The caller copies that pointer to another frame local and invokes
      # it indirectly. Requiring the call, cleanup, copy, and dispatch together
      # avoids treating an ordinary indirect call as in-memory execution.
      pattern: 'E8 ?? ?? ?? ?? 83 C4 14 8B 8D ?? FF FF FF 89 8D ?? FF FF FF FF 95 ?? FF FF FF'
