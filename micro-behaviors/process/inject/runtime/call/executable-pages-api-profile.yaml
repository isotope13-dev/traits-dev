composite_rules:
  - id: executable-pages-remote-process-api-set
    desc: Executable page and remote-process API set
    crit: notable
    platforms: [windows]
    for: [pe]
    conf: 0.92
    scope: file
    all:
      - id: metadata/binary/instruction/sequence::argument-patterns-outside-runtime-markers
      - id: metadata/file/profile/memory-protection-context::non-pagespeed-memory-protection
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
    downgrade:
      any:
        - id: well-known/lib/runtime/native-platform/mozilla-nspr/
        - id: well-known/app/system/drivers/
        - id: well-known/lib/data/sqlite/

