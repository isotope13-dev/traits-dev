# The PEB and API references do not prove import concealment or execution.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: peb-native-write-debug-api-profile
    desc: PEB access, NT write-memory name and debugger-query import
    crit: notable
    conf: 0.7
    all:
      - id: micro-behaviors/os/api-resolution/manual::peb-access-x86
      - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-name
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
