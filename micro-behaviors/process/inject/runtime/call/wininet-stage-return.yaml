defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  # The ROR13 InternetReadFile hash call receives into EBX. Bytes read
  # advance that pointer until EOF; RET then enters the saved stage address.
  # The byte count and request handle are passed through EDI and ESI.
  - id: x86-wininet-read-stage-return
    desc: WinINet read loop returns into downloaded code
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '57 68 00 20 00 00 53 56 68 12 96 89 E2 FF D5 85 C0 74 ?? 8B 07 01 C3 85 C0 75 ?? 58 C3'
