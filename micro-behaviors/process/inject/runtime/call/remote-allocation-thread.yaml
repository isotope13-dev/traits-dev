defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
- id: remote-allocate-write-api-profile
  desc: Remote allocation and memory-write API cluster
  crit: notable
  conf: 0.96
  all:
    - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
    - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
  any:
    - id: micro-behaviors/process/attach/rights::open-process
    - id: micro-behaviors/process/create/spawn::create-process-a
    - id: micro-behaviors/process/create/spawn::create-process-w
    - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  unless:
    - id: metadata/signed/platform/
    - id: well-known/tool/reverse-engineering/
    # Recognized automation, system-care, runtime and sandbox software --
    # see remote-alloc-write-known-benign-context.
    - id: micro-behaviors/process/inject/runtime/call::remote-alloc-write-known-benign-context
    # QtWebEngineProcess is a framework helper whose remote-process APIs
    # support Chromium's normal browser-process plumbing, not injection.
    - id: well-known/lib/ui/qt::qt-webengine-process-binary
    - id: well-known/tool/development/debug/debugpy/

- id: remote-alloc-write-known-benign-context
  desc: Recognized software writing into other processes
  crit: exception
  conf: 0.96
  any:
    # AutoItX3.dll is a UI-automation control vendored by RAutomation,
    # PyAutoIt and the Selenium Ruby gem; driving another process's windows
    # is the product's documented job.
    - id: well-known/tool/sysadmin/autoit::autoitx-official-control
    # Advanced SystemCare's service/helper components use the same
    # remote-process primitives for normal product operation.
    - id: well-known/app/system/iobit::advanced-systemcare-component-context
    # Electron's Chromium/Node runtime imports this API set for its normal
    # browser-process plumbing; require independent runtime markers before
    # suppressing the injection interpretation.
    - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
    - id: well-known/tool/sysadmin/conemu::conemu-setup-signature
    - id: well-known/tool/sysadmin/sandboxie::sandboxie-known-signed-context
    # Wine implements these Windows APIs as exports of its builtin runtime.
    - id: well-known/lib/platform/wine::wine-builtin-dll-marker

- id: remote-thread-memory-api-profile
  desc: Remote allocation, write and thread API cluster
  crit: notable
  conf: 0.98
  attack: T1055.001
  all:
    - id: micro-behaviors/process/inject/runtime/call::remote-allocate-write-api-profile
    - id: micro-behaviors/process/inject/runtime/call::create-remote-thread-dup
  unless:
    - id: well-known/tool/detection/threat-intel::cuckoo-monitor-injector
    - id: metadata/signed/platform/
    - id: well-known/tool/reverse-engineering/
    - id: well-known/lib/platform/wine::wine-builtin-dll-marker
    # pywin32's win32process extension is a thin binding over the Win32
    # API: it imports the allocation/write/thread primitives to expose
    # them to Python, not to inject anything itself.
    - id: well-known/lib/native/pywin32::pywin32-binding-module
    # NirSoft AdvancedRun (verified Nir Sofer signature + version identity)
    # legitimately combines remote allocation, memory writing, thread
    # creation, and process enumeration for its run-as launch modes.
    - id: well-known/tool/sysadmin/nirsoft::signed-advancedrun-utility
    # Crashpad clients (Chromium-family browsers, Electron apps) import
    # the same primitives for crash handling; the CPADinfo section marks
    # them.
    - id: well-known/lib/development/breakpad-legacy::crashpad-client-section
