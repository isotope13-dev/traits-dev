defaults:
  platforms:
    - windows
  for:
    - pe
  conf: 0.96
composite_rules:
  - id: remote-allocate-write-api-profile
    desc: Remote allocation and memory-write API cluster
    crit: notable
    all:
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
    any:
      - id: micro-behaviors/process/attach/rights::open-process
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
