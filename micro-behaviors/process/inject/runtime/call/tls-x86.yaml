defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  crit: notable
  conf: 0.95
traits:
  - id: tls-buffer-indirect-call-x86
    desc: Calls function pointer stored in TLS buffer
    if:
      type: hex
      section: .text
      pattern: '64 A1 2C 00 00 00 8B 08 8B 91 ?? ?? ?? ?? 89 55 ?? FF 55 ??'
