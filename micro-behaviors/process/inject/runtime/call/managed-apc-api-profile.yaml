defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: managed-apc-remote-memory-api-profile
  desc: .NET image contains APC, remote-memory and thread-resume API references
  conf: 0.99
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/process/create/launch::create-process-api-name
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-text
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
  - id: micro-behaviors/os/callback/apc::queue-user-apc
  - id: micro-behaviors/process/info/thread::resume-thread
  unless:
  - id: metadata/signed/platform/
  - id: metadata/lang/upstream::dotnet-pinvoke-binding-assembly
  - id: metadata/build/generated::winmd-metadata
  crit: notable
