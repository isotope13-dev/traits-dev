defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: managed-apc-remote-memory-api-profile
  desc: .NET image contains APC, remote-memory and thread-resume API references
  conf: 0.99
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: metadata/binary/symbols/name/process::create-process-api-name
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-text
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/os/callback/apc::queue-user-apc
  - id: micro-behaviors/process/thread/lifecycle::resume-thread
  crit: notable
