defaults:
  for: [pyc]
  platforms: [windows]
  crit: notable
traits:
  - id: pyc-cfunctype-reference
    desc: Python bytecode references CFUNCTYPE
    conf: 0.98
    if:
      type: text
      word: CFUNCTYPE
composite_rules:
  - id: pyc-mapped-buffer-pointer-call-profile
    desc: Python mapping and memmove with wrapped-call bytecode
    conf: 0.98
    all:
      - id: metadata/binary/code/bytecode::py310-copy-wrapper-call-sequence
      - id: pyc-cfunctype-reference
      - id: micro-behaviors/mem/copy::pyc-memmove-reference
      - id: micro-behaviors/mem/map::pyc-map-view-of-file-reference
      - id: micro-behaviors/mem/map::pyc-create-file-mapping-reference
