defaults:
  platforms: [windows]
  for: [text, powershell, vbs]
  crit: notable
  conf: 0.95
traits:
  - id: hex-payload-hollowing-api-names
    desc: Hex payload names creation and image unmapping
    if:
      type: text
      regex: '(?i)5A77556E6D6170566965774F6653656374696F6E[0-9a-f]{0,100}43726561746550726F6365737341'
  - id: hex-writeprocessmemory-name
    desc: Hex payload references WriteProcessMemory
    if:
      type: text
      substr: '577269746550726F636573734D656D6F7279'
      case_insensitive: true
  - id: hex-setthreadcontext-name
    desc: Hex payload references SetThreadContext
    if:
      type: text
      substr: '536574546872656164436F6E74657874'
      case_insensitive: true
