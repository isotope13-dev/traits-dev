defaults:
  platforms: [windows]
  for: [text, powershell, vbs]
  crit: notable
  conf: 0.95
traits:
  - id: hex-createprocessa-name
    desc: Hex payload references CreateProcessA
    if:
      type: text
      regex: '(?i)4372656174655[0_#]726F6365737341'
  - id: hex-unmapviewofsection-name
    desc: Hex payload references ZwUnmapViewOfSection
    if:
      type: text
      regex: '(?i)5A77556E6D617[0_#]566965774F6653656374696F6E'
  - id: hex-writeprocessmemory-name
    desc: Hex payload references WriteProcessMemory
    if:
      type: text
      regex: '(?i)57726974655[0_#]726F636573734D656D6F7279'
  - id: hex-setthreadcontext-name
    desc: Hex payload references SetThreadContext
    if:
      type: text
      regex: '(?i)536574546872656164436F6E74657874'
composite_rules:
  - id: hex-createprocess-unmap-names
    desc: Hex process creation and image-unmapping names
    all:
      - id: hex-createprocessa-name
      - id: hex-unmapviewofsection-name
