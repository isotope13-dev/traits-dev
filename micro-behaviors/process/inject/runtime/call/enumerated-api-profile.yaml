defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: process-enumeration-remote-thread-api-profile
    desc: Process enumeration and remote-thread API cluster
    crit: notable
    conf: 0.96
    attack: T1055
    mbc: B0033
    all:
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/
      # Hooking frameworks expose the same allocate-write-thread surface as
      # reusable plumbing; the host application needs stronger evidence.
      - id: well-known/lib/platform/easyhook/
