defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  # A stack-resident PE64 header is checked, then its security-directory
  # offset and size are read. The later transform takes the same RDI buffer
  # that is passed to a PAGE_EXECUTE_READ protection call and invoked.
  # No marker bytes, key length, section label or payload address is fixed.
  - id: x64-security-directory-rx-buffer-call
    desc: PE64 security-table reads with RX buffer call
    crit: notable
    conf: 0.98
    if:
      type: hex
      offset_range: [512, null]
      pattern: '81 7C 04 50 50 45 00 00 [0-16] B9 0B 02 00 00 66 39 4C 04 68 [0-16] 8B 94 04 F8 00 00 00 8B B4 04 FC 00 00 00 [0-384] 4D 8B C4 8B D6 48 8B CF E8 [4] 4C 8D 4C 24 ?? 41 B8 20 00 00 00 49 8B D7 48 8B CF FF 53 ?? 85 C0 74 ?? 45 33 C0 48 8B CF 41 8D 50 01 FF D7'
