defaults:
  platforms: [windows]
  for: [oledoc, msi]
  crit: notable
  conf: 0.9
  attack: T1055

traits:
  - id: msi-embedded-write-process-memory
    desc: MSI embedded WriteProcessMemory reference
    if:
      type: text
      substr: WriteProcessMemory
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: micro-behaviors/process/inject/runtime/call::write-process-memory-source
