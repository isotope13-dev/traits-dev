defaults:
  for: [pyc]
  platforms: [windows]
composite_rules:
  - id: pyc-allocated-buffer-pointer-call-profile
    desc: Allocated buffer and native-pointer call profile
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/code/bytecode::py37-copy-pointer-invoke-sequence
      - id: micro-behaviors/mem/alloc/virtual::pyc-virtualalloc-reference
      - id: micro-behaviors/mem/copy::pyc-memmove-reference
      - id: micro-behaviors/process/inject/runtime/call::pyc-cfunctype-reference
