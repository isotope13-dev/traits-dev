defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: powershell-decoded-pe-buffer
    desc: PEBytes buffer decoded from Base64
    if:
      type: text
      regex: '\$PEBytes\s*=\s*\[Byte\[\]\]\[Convert\]::FromBase64String\(\$PEBytes(32|64)\)'
  - id: powershell-remote-reflective-image-call
    desc: Reflective PE buffer and remote-handle call
    if:
      type: text
      substr: Invoke-MemoryLoadLibrary -PEBytes $PEBytes -ExeArgs $ExeArgs -RemoteProcHandle
