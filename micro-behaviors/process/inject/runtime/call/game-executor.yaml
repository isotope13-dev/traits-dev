defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  # The required strings and API references do not bind a buffer to a target,
  # prove execution transfer, or establish an unauthorized result.
  - id: game-executor-remote-memory-api-profile
    desc: Game executor vocabulary with remote memory API references
    crit: notable
    conf: 0.97
    size_max: 500000000
    all:
      - id: micro-behaviors/metaprogramming/reflection::script-runtime-introspection-api-names
      - id: micro-behaviors/process/info/name::mainstream-game-executable-name
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
    unless:
      - id: metadata/binary/layout/embedded::repeated-standard-pe-images
      - id: metadata/signed/platform/
      - id: metadata/binary/vendor/
