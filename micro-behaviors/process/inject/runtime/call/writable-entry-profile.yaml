defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: writable-entry-remote-api-profile
    desc: Writable-entry PE with remote-process APIs
    crit: notable
    conf: 0.98
    mbc: "B0033"
    attack: T1055
    all:
      - id: metadata/binary/section/header::pe-entry-in-writable-section
      - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
