composite_rules:
- id: rwx-remote-thread-context-exception
  desc: Windows runtime and remote-thread tools
  crit: exception
  for: [pe, dll, c, cpp]
  platforms: [windows]
  conf: 0.99
  any:
  - id: well-known/lib/runtime/native-platform/cygwin/
  - id: well-known/tool/development/vcs/git-for-windows::mingit-getprocaddr-helper
  - id: well-known/lib/platform/wine/
  - id: metadata/signed/platform/
  - id: well-known/tool/reverse-engineering/windows-debugger/
  - id: well-known/tool/reverse-engineering/radare2/
  - id: well-known/tool/sysadmin/console/
  - id: well-known/tool/sysadmin/conemu/
  - id: well-known/lib/media/chromium-angle::vk-swiftshader-basename
  - id: well-known/lib/runtime/scripted/nwjs::windows-runtime-context
