defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: remote-alloc-write-thread-api-set
    desc: Remote allocation, write, and thread API set
    crit: notable
    conf: 0.98
    unless:
      # A Windows API-provider DLL exports these routines as its normal
      # implementation surface; it does not perform an injection chain.
      - id: metadata/lang/upstream::windows-system-implementer-dll
      # CyberLink PowerCinema's verified remote-control module uses this
      # exact chain to install its hook in the selected media-window process.
      - id: well-known/app/media/cyberlink::cyberlink-verified-remote-control-module
      # QtWebEngineProcess is a framework helper whose process-management
      # APIs are implementation plumbing, not an injection objective.
      - id: well-known/lib/ui/qt::qt-webengine-process-binary
      # Google-signed browser/runtime binaries expose the same APIs for their
      # sandbox and renderer lifecycle; this API-only rule has no target or
      # execution evidence to distinguish that normal implementation use.
      - id: metadata/signed/leaf::google-inc
      # NW.js carries Chromium process-management and JIT APIs as runtime
      # plumbing; this API-only set is not evidence of an injection objective.
      - id: well-known/lib/runtime/scripted/nwjs::windows-runtime-context
    all:
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-text
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/inject/dll::create-remote-thread-text


