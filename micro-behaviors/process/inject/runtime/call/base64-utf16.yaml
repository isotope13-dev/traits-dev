# Large standalone blobs may exceed the generic decoded-string budget.
# These patterns recognize source API references in all three Base64 alignments;
# they do not claim execution, pointer data flow, or decoder invocation.
defaults:
  for: [data, text]
  platforms: [windows]
traits:
  - id: base64-utf16-memory-thread-api-profile
    desc: Base64 UTF16 memory-copy/thread API profile
    crit: suspicious
    conf: 0.97
    if:
      type: yara
      source: |
        rule base64_utf16_memory_thread_api_profile {
          strings:
            $alloc = "::VirtualAlloc(" wide base64
            $copy = "InteropServices.Marshal]::Copy(" wide base64
            $thread = "::CreateThread(" wide base64
          condition:
            all of them
        }
