# RustAegis embeds stable 64-bit identifiers for encrypted strings. The
# immediates below identify the named native APIs even when each build uses a
# new ciphertext and key. Keep these as primitive capabilities; objectives
# combine them into a concrete injection technique.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055
  mbc: C0032

traits:
  - id: encrypted-nt-allocate-virtual-memory
    desc: Encrypted RustAegis NtAllocateVirtualMemory ID
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: 49 b8 28 21 9a ce 27 71 92 87

  - id: encrypted-nt-write-virtual-memory
    desc: Encrypted RustAegis NtWriteVirtualMemory ID
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: 49 b8 56 83 07 53 39 10 4d d4

  - id: encrypted-nt-open-process
    desc: Encrypted RustAegis NtOpenProcess ID
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: 49 b8 c8 82 4b 5c ce 76 01 2a
