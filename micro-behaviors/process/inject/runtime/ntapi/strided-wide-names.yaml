# UTF-16 strings whose real characters sit at every second wide character,
# padded with junk wide characters (VB6 crypter stubs), so plain text and wide
# matchers cannot see the API names.
defaults:
  for: [pe]
  platforms: [windows]
  attack: T1055.012,T1027
traits:
  - id: nt-unmap-view-of-section-strided-wide
    desc: NtUnmapViewOf name in junk-padded wide text
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: text
      pattern: '4E [3] 74 [3] 55 [3] 6E [3] 6D [3] 61 [3] 70 [3] 56 [3] 69 [3] 65 [3] 77 [3] 4F [3] 66'
  - id: nt-resume-thread-strided-wide
    desc: NtResumeThread name in junk-padded wide text
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: text
      pattern: '4E [3] 74 [3] 52 [3] 65 [3] 73 [3] 75 [3] 6D [3] 65 [3] 54 [3] 68 [3] 72 [3] 65 [3] 61 [3] 64'
  - id: virtual-alloc-ex-strided-wide
    desc: VirtualAllocEx name in junk-padded wide text
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: text
      pattern: '56 [3] 69 [3] 72 [3] 74 [3] 75 [3] 61 [3] 6C [3] 41 [3] 6C [3] 6C [3] 6F [3] 63 [3] 45 [3] 78'
