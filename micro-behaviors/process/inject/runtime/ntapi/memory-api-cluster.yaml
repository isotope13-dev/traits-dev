composite_rules:
  - id: nt-memory-protection-write-api-cluster
    desc: NT allocation, protection and memory-write API references
    conf: 0.92
    all:
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
      - id: metadata/file/profile/memory-protection-api::nt-protect-virtual-memory-name
      - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-name
  - id: nt-memory-thread-api-cluster
    desc: NT allocation, protection, memory-write and thread API references
    conf: 0.94
    all:
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
      - id: metadata/file/profile/memory-protection-api::nt-protect-virtual-memory-name
      - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-name
    any:
      - id: micro-behaviors/process/thread/create::nt-create-thread-ex-name
defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
  crit: notable
