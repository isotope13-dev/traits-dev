composite_rules:
- id: nt-memory-protection-write-api-cluster
  desc: NT allocation, protection and memory-write API references
  conf: 0.92
  all:
  - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
  - id: micro-behaviors/mem/protect/modify::nt-protect-virtual-memory-name
  - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-name
  unless:
  - id: metadata/lang/upstream::windows-system-implementer-dll
  - id: well-known/lib/platform/wine/
  - id: well-known/lib/platform/microsoft-wow64::microsoft-wow64-system-context
  - id: well-known/game/cheat::inventory-changer-blackbone-context
  - id: well-known/tool/offensive/frameworks::al-khaser-pdb-path
- id: nt-memory-thread-api-cluster
  desc: NT allocation, protection, memory-write and thread API references
  conf: 0.94
  all:
  - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
  - id: micro-behaviors/mem/protect/modify::nt-protect-virtual-memory-name
  - id: micro-behaviors/process/inject/runtime/call::nt-write-virtual-memory-name
  any:
  - id: micro-behaviors/process/create/thread::nt-create-thread-ex-name
  unless:
  - id: metadata/lang/upstream::windows-system-implementer-dll
  - id: well-known/lib/platform/wine/
  - id: well-known/lib/platform/microsoft-wow64::microsoft-wow64-system-context
  - id: well-known/game/cheat::inventory-changer-blackbone-context
  - id: well-known/tool/offensive/frameworks::al-khaser-pdb-path
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
