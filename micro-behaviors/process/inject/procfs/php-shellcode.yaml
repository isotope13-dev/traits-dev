defaults:
  platforms: [openbsd, bsd, unix]
  for: [php]
  attack: T1055.008

composite_rules:
  - id: php-procfs-shellcode-write
    desc: PHP process memory path and shellcode write
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/proc/info/memory::php-interpolated-proc-mem-path
      - id: micro-behaviors/fs/write/file/handle/unspecified::php-shellcode-write
