defaults:
  platforms: [panos, appliance, unix]
  for: [go, elf, c]

composite_rules:
  - id: go-ptrace-constants-inject-name
    for: [go]
    desc: Go ptrace constants and injection identifier
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/attach/debugger::go-ptrace-attach-constants
      - id: metadata/lang/source/naming/injection::ptrace-inject-name
