defaults:
  platforms: [panos, appliance, unix]
  for: [kotlin, class, elf, c]

traits:
  - id: proc-mem-inject-name
    desc: Process-memory injection identifier text
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: inject_via_proc_mem

composite_rules:
  - id: proc-mem-template-inject-name
    for: [elf]
    desc: Process-memory template and injection identifier
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/proc/info/memory::c-procfs-mem-template
      - id: micro-behaviors/process/inject/procfs::proc-mem-inject-name
  - id: ptrace-and-inject-names
    for: [elf]
    desc: Ptrace import and injection identifier references
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/inject/reference::inject-process-name
      - id: micro-behaviors/process/inject/procfs::proc-mem-inject-name
      - id: micro-behaviors/os/syscall/invoke::ptrace-import
