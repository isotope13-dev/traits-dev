defaults:
  platforms: [windows]
  for: [source]

composite_rules:
  - id: hook-and-remote-memory-api-profile
    desc: Hook and remote-memory API references
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/process/inject/hook::set-windows-hook-ex-source
    any:
      - id: micro-behaviors/dylib/enumerate::enum-process-modules-source
      - id: micro-behaviors/ui/window/enumerate::shell-tray-wnd-class-reference
