defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: valorant-dynamic-hook-loader
    desc: VALORANT-targeting dynamic hook loader
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/signature/absent::unsigned-missing-signature-record
      - id: micro-behaviors/os/application/target/game::valorant-window-class
      - id: micro-behaviors/ui/window/hook::set-windows-hook-mapped-name
      - id: micro-behaviors/ui/window/hook::unhook-windows-hook-mapped-name
      - id: micro-behaviors/dylib/load/runtime::windows-load-library-api
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/os/message/queue::post-thread-message-w-mapped-name
      - id: micro-behaviors/os/module/lookup::dll-hook-loader-prompt
      - id: micro-behaviors/os/api-resolution/dynamic::hook-loader-export-search
      - id: micro-behaviors/process/hook/keywords::hook-loader-activation-message
