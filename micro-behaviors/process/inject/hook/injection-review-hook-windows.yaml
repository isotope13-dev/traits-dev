defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: valorant-dynamic-hook-loader
    desc: VALORANT-targeting dynamic hook loader
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/file/profile/process/injection::valorant-window-class
      - id: micro-behaviors/ui/window/hook::set-windows-hook-text
      - id: micro-behaviors/ui/window/hook::unhook-windows-hook-text
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/os/message/queue::post-thread-message-w-text
      - id: metadata/file/profile/process/injection::dll-hook-loader-prompt
      - id: metadata/file/profile/process/injection::hook-loader-export-search
      - id: metadata/file/profile/process/injection::hook-loader-activation-message
