defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: unsigned-winhttp-startupinfoex-remote-thread-profile
    desc: WinHTTP and remote-thread APIs with StartupInfoEx imports
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-connect
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
      - id: micro-behaviors/process/inject/runtime/thread-context::unsigned-startupinfoex-thread-context-imports
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/tool/development/
      - id: metadata/binary/installer/family/

