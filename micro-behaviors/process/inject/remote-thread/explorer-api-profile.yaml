defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: explorer-reference-remote-thread-api-set
    desc: Explorer executable reference with remote-thread injection API set
    crit: suspicious
    conf: 0.995
    mbc: B0033
    attack: T1055
    all:
      - id: micro-behaviors/process/inject/runtime/call::remote-process-memory-api-cluster
      - id: micro-behaviors/process/inject/remote-thread::remote-alloc-write-thread-api-set
      - id: micro-behaviors/fs/path/application/executable::explorer-executable-reference
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
      - id: well-known/game/anti-cheat/
