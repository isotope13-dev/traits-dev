# The references can be split across an archive. They do not bind the remote
# process to a browser or show that a key leaves it. Cookie-export libraries
# also carry this API set. Retain the boundary-crossing signal without an
# unsupported theft verdict.
defaults:
  platforms: [windows]
composite_rules:
  - id: browser-key-remote-thread-api-profile
    desc: Browser-key and remote-thread API references co-occur
    crit: suspicious
    conf: 0.97
    for: [source, crate, tar]
    scope: archive
    all:
      - id: micro-behaviors/crypto/key/representation::chromium-app-bound-key-name
      - id: micro-behaviors/crypto/provider/cryptoapi::ncrypt-open-storage-provider
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-rust-text
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-rust-text
    unless:
      - id: well-known/app/browser/
