defaults:
  platforms: [windows]
  for: [c]
  crit: component
  conf: 0.95

traits:
  - id: elirt-xcreateremotethread
    desc: EliRT xCreateRemoteThread symbol
    if:
      type: symbol
      kind: identifier
      exact: xCreateRemoteThread

  - id: elirt-xvirtualallocex
    desc: EliRT xVirtualAllocEx symbol
    if:
      type: symbol
      kind: identifier
      exact: xVirtualAllocEx

  - id: elirt-xopenthread
    desc: EliRT xOpenThread symbol
    if:
      type: symbol
      kind: identifier
      exact: xOpenThread

  - id: elirt-xcreateremotethread-text
    desc: EliRT xCreateRemoteThread string
    for: [static-lib, pe, dll]
    if:
      type: text
      substr: xCreateRemoteThread

  - id: elirt-xvirtualallocex-text
    desc: EliRT xVirtualAllocEx string
    for: [static-lib, pe, dll]
    if:
      type: text
      substr: xVirtualAllocEx

  - id: elirt-xopenthread-text
    desc: EliRT xOpenThread string
    for: [static-lib, pe, dll]
    if:
      type: text
      substr: xOpenThread

composite_rules:
  - id: elirt-remote-thread-unit
    desc: Delphi EliRT remote-thread and memory injection wrapper unit
    crit: suspicious
    conf: 0.92
    attack: T1055
    mbc: B0013
    all:
      - id: elirt-xcreateremotethread
      - id: elirt-xvirtualallocex
      - id: elirt-xopenthread

  - id: elirt-remote-thread-library
    desc: EliRT remote-thread and memory injection binary
    for: [static-lib, pe, dll]
    crit: suspicious
    conf: 0.95
    attack: T1055
    mbc: B0013
    all:
      - id: elirt-xcreateremotethread-text
      - id: elirt-xvirtualallocex-text
      - id: elirt-xopenthread-text
