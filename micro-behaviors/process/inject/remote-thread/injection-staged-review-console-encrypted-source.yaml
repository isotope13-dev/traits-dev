defaults:
  for: [c, cpp]
  platforms: [windows]
  conf: 0.95

composite_rules:
  - id: console-suspended-remote-thread-apis
    desc: Console suspended-child and remote APIs
    crit: suspicious
    all:
      - id: micro-behaviors/os/console/control::get-console-mode
      - id: micro-behaviors/process/config/launch::create-suspended-flag-reference
      - id: micro-behaviors/process/create/exec::native-process-launch-call-text
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-source
    near_lines: 80
