# HTTP reception and injection APIs in one image do not bind received bytes
# to remote memory. Gh0st derivatives can download to disk and independently
# inject a DLL path through LoadLibraryA.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: unsigned-wininet-remote-thread-api-profile
    desc: Unsigned WinInet and remote-thread API profile
    crit: notable
    conf: 0.995
    size_max: 524288
    all:
      - id: micro-behaviors/communications/http/client/wininet::wininet-session-request-api-set
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/mem/combined::remote-process-memory-api-cluster
      - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
