# API co-occurrence establishes neither ordering nor unauthorized use.
defaults:
  platforms: [windows]
composite_rules:
  - id: source-remote-memory-thread-api-references
    desc: Source references remote allocation, write, open and thread APIs
    crit: notable
    conf: 0.9
    mbc: B0033
    attack: T1055
    for: [rust, c, csharp]
    all:
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-source
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
    any:
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/process/attach/rights::open-process-script
    unless:
      - id: well-known/lib/platform/wine::wine-source-tree
      # One directory reference in place of the two radare2 leaves: it counts
      # once against the suppression budget and picks up any later addition.
      - id: well-known/tool/reverse-engineering/radare2/
      - id: well-known/lib/runtime/managed/openjdk/
      - id: well-known/app/communication/thunderbird/
      - id: well-known/lib/platform/windows-erg/
      - id: well-known/tool/sysadmin/kali/
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: well-known/game/mod/
