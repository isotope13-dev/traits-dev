defaults:
  platforms: [windows]
  for: [html, markdown, text]
  crit: notable
  conf: 0.95

traits:
  - id: remote-thread-api-name-in-documentation
    desc: Names CreateRemoteThread in documentation
    if:
      type: text
      word: CreateRemoteThread

  - id: shellcode-execution-remote-process-in-documentation
    desc: Shellcode executes in a remote process
    if:
      type: text
      regex: '(?i)execute shell(c(o)?|oc)de.{0,80}remote process'

  - id: pid-target-selection-in-documentation
    desc: Documents PID selection for a target process
    if:
      type: text
      regex: '(?i)process identifier.{0,120}-pid.{0,64}command line flag'
