# The final character is constructed on the stack in some native loaders.
# Match the long API prefix under any nonzero XOR key, without asserting a call.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98
traits:
  - id: xor-ntcreatethreadex-name-prefix
    desc: XOR-masked NtCreateThreadEx name prefix
    if:
      type: yara
      source: |
        import "pe"
        rule xor_native_thread_name_prefix {
          strings:
            $name = "NtCreateThreadE" xor(1-255)
          condition:
            for any s in pe.sections : (
              s.name == ".rdata" and
              for any i in (1..#name) : (
                @name[i] >= s.raw_data_offset and
                @name[i] + !name[i] <= s.raw_data_offset + s.raw_data_size
              )
            )
        }
