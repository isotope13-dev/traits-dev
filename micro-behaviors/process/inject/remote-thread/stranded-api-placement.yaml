# API observations retain their original scope and exclusions.
defaults:
  platforms:
  - windows
composite_rules:
- for:
  - pe
  - dll
  - c
  - cpp
  - csharp
  id: rtl-user-thread-memory-write-api-set
  desc: Remote allocation, write and native thread APIs
  conf: 0.95
  crit: suspicious
  attack: T1055
  size_min: 300000
  size_max: 1000000
  all:
  - id: micro-behaviors/process/inject/remote-thread::native-remote-thread-create
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
  any:
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
  unless:
  - id: metadata/signed/platform/
  - id: metadata/vendor/string::microsoft-corporation-name-reference
  - id: well-known/tool/sysadmin/kali/
  - id: metadata/file/encoding/container::powershell-base64-dominated-body
  - id: metadata/lang/scripted::ps-valid
  - id: well-known/tool/reverse-engineering/scylla::scylla-debugger-tool-context
- for:
  - powershell
  id: powershell-embedded-image-remote-thread-api-set
  desc: Embedded PE image beside remote-thread APIs
  crit: suspicious
  conf: 0.97
  attack: T1055
  all:
  - id: micro-behaviors/process/attach/rights::open-process-script
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-text
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-text
  - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-script
  - id: micro-behaviors/data/embedded/payload/native::line-wrapped-base64-pe-image
  unless:
  - id: micro-behaviors/process/inject/remote-thread::powershell-remote-reflective-image-call
- for:
  - powershell
  id: powershell-remote-thread-memory-api-profile
  desc: PowerShell remote allocation, write and thread API cluster
  crit: notable
  conf: 0.99
  attack: T1055
  all:
  - id: micro-behaviors/process/attach/rights::open-process-script
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-text
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-text
  - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-script
  any:
  - id: micro-behaviors/mem/query::virtualquery-ex-script
  - id: micro-behaviors/mem/read/cross-process::read-process-memory
  - id: micro-behaviors/process/create/hidden::powershell-hidden-system-binary-launch
  needs: 1
- for:
  - pe
  id: remote-thread-memory-api-profile
  desc: Remote allocation, write and thread API cluster
  crit: notable
  conf: 0.98
  attack: T1055
  all:
  - id: micro-behaviors/process/inject/runtime/call::remote-allocate-write-api-profile
  - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
- id: remote-allocation-write-thread-api-references
  size_min: 512
  size_max: 500000000
  desc: Remote allocation, write and thread API references
  crit: notable
  for:
  - pe
  needs: 3
  any:
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
- for:
  - pe
  - dll
  id: remote-alloc-write-thread-api-set
  desc: Remote allocation, write, and thread API set
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
- for:
  - pe
  - dll
  id: remote-memory-write-thread-api-set
  desc: Remote memory write and thread APIs
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
- for:
  - pe
  - dll
  - c
  - cpp
  - csharp
  - python
  id: native-remote-thread-create
  desc: Native thread-creation API references
  crit: notable
  conf: 0.97
  any:
  - id: micro-behaviors/process/inject/remote-thread::native-remote-thread-create--ntcreatethreadex
  - id: micro-behaviors/process/inject/remote-thread::native-remote-thread-create--rtlcreateuserthread
- for:
  - pe
  - dll
  id: enumerated-remote-thread-api-profile
  desc: Process enumeration with remote memory/thread APIs
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
- for:
  - pe
  id: remote-thread-apis-system-process-references
  desc: Remote-thread injection APIs co-occur with system-process names
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/process/info/name::windows-service-process-references
  - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
  any:
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
traits:
- for:
  - powershell
  crit: notable
  conf: 0.98
  id: powershell-remote-reflective-image-call
  desc: Reflective PE buffer and remote-handle call
  if:
    type: text
    substr: Invoke-MemoryLoadLibrary -PEBytes $PEBytes -ExeArgs $ExeArgs -RemoteProcHandle
- for:
  - powershell
  - batch
  - vbs
  - javascript
  id: create-remote-thread-script
  desc: CreateRemoteThread API reference in script
  crit: notable
  conf: 0.94
  attack: T1055
  mbc: C0032
  if:
    type: text
    word: CreateRemoteThread
  unless:
  - id: micro-behaviors/process/inject/remote-thread::vba-declare-createremotethread
- for:
  - pe
  - dll
  - c
  - cpp
  - csharp
  - python
  id: native-remote-thread-create--ntcreatethreadex
  desc: NtCreateThreadEx API reference
  crit: notable
  conf: 0.97
  if:
    type: symbol
    exact: NtCreateThreadEx
- for:
  - pe
  - dll
  - c
  - cpp
  - csharp
  - python
  id: native-remote-thread-create--rtlcreateuserthread
  desc: RtlCreateUserThread API reference
  crit: notable
  conf: 0.97
  if:
    type: symbol
    exact: RtlCreateUserThread
- for:
  - pe
  - dll
  - c
  - cpp
  - csharp
  - python
  id: native-remote-thread-create--rtlcreateuserthread-text
  desc: Resolved RtlCreateUserThread API string
  crit: notable
  conf: 0.95
  attack: T1055
  mbc: C0032
  if:
    type: text
    word: RtlCreateUserThread
  unless:
  - id: micro-behaviors/process/inject/remote-thread::native-remote-thread-create--rtlcreateuserthread
  - id: metadata/lang/upstream::windows-system-implementer-dll
  - id: metadata/signed/certificate/subject::glarysoft-ltd
  - id: well-known/app/utility/windows-wer-diag::wer-diag-controller-system-context
