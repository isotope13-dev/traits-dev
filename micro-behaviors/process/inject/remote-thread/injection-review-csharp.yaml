defaults:
  platforms: [windows]
  for: [csharp]
traits:
  - id: csharp-nt-create-thread-ex-ref
    desc: C# NtCreateThreadEx name
    crit: notable
    conf: 0.9
    if:
      type: text
      word: NtCreateThreadEx
    unless:
      - id: micro-behaviors/process/inject/remote-thread::native-remote-thread-create--ntcreatethreadex
composite_rules:
  - id: csharp-nt-remote-alloc-write-thread
    desc: C# NT remote memory and thread API names
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
      - id: micro-behaviors/mem/write/arbitrary::csharp-nt-write-virtualmemory-call
      - id: micro-behaviors/mem/protect/modify/unspecified::csharp-nt-protect-virtualmemory-call
      - id: micro-behaviors/process/inject/remote-thread::csharp-nt-create-thread-ex-ref
