defaults:
  platforms: [windows]
  for: [pe]
  attack: T1055
  mbc: B0033

composite_rules:
  - id: autoit-wininet-remote-memory-apis
    desc: AutoIt WinInet and remote injection APIs
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: micro-behaviors/process/inject/runtime/call::remote-process-injection-api-set
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
      - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
    unless:
      - id: metadata/signature/verified/developer/
      - id: well-known/app/utility/sordum::bluelife-hosts-editor
      - id: well-known/tool/sysadmin/universal-extractor::universal-extractor-application
