# API names and process-name strings are unbound references. Together they
# describe a sensitive remote-process capability profile, but do not show
# that Winlogon is the runtime target or establish attacker intent.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: winlogon-debug-remote-thread-api-profile
    desc: Winlogon and debug-privilege references with remote-memory and thread APIs
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/process/info/name::winlogon-executable-reference
      - id: micro-behaviors/os/privilege/token/adjust::debug-privilege-process-access
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
    any:
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
      - id: micro-behaviors/process/control/thread::native-set-thread-context-name
    needs: 1
