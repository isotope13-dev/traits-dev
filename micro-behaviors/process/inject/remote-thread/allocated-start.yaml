# Value provenance distinguishes an allocated start address from import-only
# API profiles. It does not assert what bytes were written or runtime success.
defaults:
  platforms: [windows]
  for: [rust, c, cpp, csharp]
traits:
  - id: allocated-memory-remote-thread-start
    desc: Remote thread starts at allocated memory
    crit: notable
    conf: 0.98
    attack: T1055
    if:
      type: symbol
      kind: call
      exact: CreateRemoteThread
      arg:
        index: 3
        from:
          call: '^VirtualAllocEx$'
