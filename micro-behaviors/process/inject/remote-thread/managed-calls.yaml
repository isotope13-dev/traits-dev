# Resolved CIL call sites distinguish a used injection API sequence from
# P/Invoke declarations alone. Proximity does not prove shared handles,
# an allocated start address, a hostile payload, or process hollowing.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: managed-create-remote-thread-call
    desc: Managed call to CreateRemoteThread
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)CreateRemoteThread$'
    unless:
      - type: value
        path: pe.clr.runtime_version
        exists: false
composite_rules:
  - id: managed-remote-allocation-write-thread-calls
    desc: Nearby managed remote allocation, write and thread calls
    crit: suspicious
    conf: 0.97
    attack: T1055
    all:
      - id: micro-behaviors/mem/alloc/virtual::managed-virtual-alloc-ex-call
      - id: micro-behaviors/mem/write/arbitrary::process-memory-write-call
      - id: managed-create-remote-thread-call
    near_bytes: 256
