defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: lsass-name-remote-thread-apis
    desc: LSASS name and remote-thread APIs
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/process/inject/remote-thread::enumerated-remote-thread-api-profile
      - id: micro-behaviors/process/info/name::lsass-process-reference
    unless:
      - id: micro-behaviors/process/info/name::critical-system-process-name-sequence
