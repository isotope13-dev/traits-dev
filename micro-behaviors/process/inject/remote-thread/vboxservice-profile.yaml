# This records co-occurrence, not a VM check, target selection or execution.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: unsigned-vboxservice-process-walk-api-profile
    desc: Unsigned remote-thread APIs with VBoxService and process-walk references
    crit: notable
    conf: 0.88
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/process/info/name::vboxservice-name
      - id: micro-behaviors/process/sync/mutex::create-mutex
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
      - id: micro-behaviors/process/inject/remote-thread::remote-allocation-write-thread-api-references
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/
