defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: remote-thread-api-reference
  desc: Remote thread creation API reference
  crit: notable
  conf: 0.98
  attack: T1055
  mbc: B0013
  for: [pe, dll, c, cpp, csharp, python, rust]
  any:
  - id: micro-behaviors/process/inject/remote-thread::create-remote-thread
  - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-source
  - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-text
  - id: micro-behaviors/process/inject/remote-thread::serialized-createremotethread-name
  - id: micro-behaviors/process/inject/runtime/call::native-remote-thread-create
  # The legitimate users of a remote-thread create are debuggers and runtimes
  # that attach to a live process: debugpy's injector, the V8/Node inspector,
  # and the Go runtime's stop-the-world machinery. Name them.
  #
  # Three directory references used to stand here -- `metadata/package/quality/`
  # (712 traits), `metadata/lang/compiled/` (170) and
  # `metadata/binary/framework/` (201) -- reaching over a thousand traits
  # between them. `metadata/lang/compiled/` is near-tautological against this
  # rule's own `for:` list, and `metadata/package/quality/` carries markers
  # that are themselves adverse (`version-suspicious`, `placeholder-module`),
  # so a low-quality package got its injection primitive quieted for being
  # low-quality. Being built by Electron or Qt is likewise not a reason to
  # stop reporting CreateRemoteThread.
  downgrade:
    any:
    - id: well-known/tool/development/debug/debugpy::attach-helper-path
    - id: well-known/lib/runtime/scripted/v8::isolate-symbol
    - id: metadata/lang/runtime::go-runtime-marker
  unless:
  - id: well-known/game/mod::bedrockboot-preload-injector-pdb