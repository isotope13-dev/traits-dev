# This is an API/reference profile. Large encoded constants may be certificates,
# VM names may be inventory data, and managed native APIs may be declarations
# with no call sites. Their co-occurrence establishes no hostile injection.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: encoded-blob-vm-thread-api-profile
    desc: Encoded blob and VM/remote-thread API references
    crit: notable
    conf: 0.95
    all:
      - id: metadata/file/encoded::large-base64-like-string
      - id: micro-behaviors/process/inject/remote-thread::remote-memory-write-thread-api-set
      - id: micro-behaviors/os/virtualization/hypervisor
    unless:
      - id: well-known/lib/runtime/scripted/electron::electron-chromium-runtime-strong
      - id: well-known/tool/browser::chromium-linker-section-set
