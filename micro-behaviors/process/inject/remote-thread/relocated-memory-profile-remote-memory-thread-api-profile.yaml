defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: remote-memory-thread-api-profile
  desc: Remote-thread and memory-preparation APIs
  crit: notable
  conf: 0.9
  attack: T1055
  all:
  - id: micro-behaviors/process/attach/rights::open-process-api-alternative
  - id: micro-behaviors/mem/write/arbitrary::remote-write-symbol-alternative
  - id: micro-behaviors/mem/combined::allocation-or-remote-protection-api
  - id: micro-behaviors/process/inject/remote-thread::remote-thread-api-reference
  unless:
  - id: metadata/binary/symbols/count::many-exports
  - id: micro-behaviors/process/debug/tool-markers::system-informer-reference
  - id: metadata/signed/leaf::google-inc
  - id: well-known/tool/reverse-engineering/exe2aut::exe2aut-decompiler
