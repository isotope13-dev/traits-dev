defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: go-process-injection-api-triad
    desc: Go process injection API triad
    crit: suspicious
    conf: 0.95
    mbc: F0003
    attack: T1055
    for:
      - go
    all:
      - id: micro-behaviors/process/inject/runtime/call::go-create-remote-thread-wrapper
      - id: micro-behaviors/process/inject/runtime/call::go-virtual-alloc-ex-wrapper
      - id: micro-behaviors/process/inject/runtime/call::go-write-process-memory-api-wrapper
