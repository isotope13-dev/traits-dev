defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: injected-data-starts-thread-log
    desc: Logs injected data starting remotely
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: successfully injected data, starting remote thread

  - id: remote-thread-wait-log
    desc: Logs waiting for remote-thread execution
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: RemoteThread started. Waiting for execution to finish
