defaults:
  platforms: [windows]
  for: [go]
  crit: notable
  conf: 0.98
traits:
  - id: go-remote-thread-wrapper-call
    desc: Calls a remote-thread creation wrapper
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ProcCreateRemoteThread\.Call$'
  - id: go-allocated-memory-remote-thread-start
    desc: Go remote thread starts at allocated memory
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ProcCreateRemoteThread\.Call$'
      arg:
        index: 3
        from:
          call: '(^|\.)ProcVirtualAllocEx\.Call$'
composite_rules:
  - id: go-remote-allocation-write-thread-calls
    desc: Remote allocation, memory write and thread calls
    crit: suspicious
    # Co-occurrence survives intervening error guards that clear may-flow
    # aliases. It does not prove that the operations share a target or buffer.
    all:
      - id: micro-behaviors/mem/alloc/remote::go-remote-allocation-wrapper-call
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
      - id: go-remote-thread-wrapper-call
    near_bytes: 1024
    unless:
      - id: go-allocated-thread-with-memory-write
  - id: go-allocated-thread-with-memory-write
    desc: Allocated remote thread start with memory write
    crit: suspicious
    # Both operations are present; this does not assert a shared process handle.
    all:
      - id: go-allocated-memory-remote-thread-start
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
    near_bytes: 512
