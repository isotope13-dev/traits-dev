defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-suspended-pe-entry-thread-call
    desc: PE entrypoint in suspended remote-thread call
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # AddressOfEntryPoint + remote image base becomes argument four.
      # Arguments five/seven are NULL and creation flags are suspended (4).
      pattern: '47 8B 4C 2F 28 4C 03 4D ?? 48 89 5C 24 30 C7 44 24 28 04 00 00 00 48 89 5C 24 20 45 33 C0 33 D2 48 8B 4D ?? FF D0'
