# Relocated without matcher/scope changes from service persistence. An
# unsigned image and API names do not prove installation or hostile intent.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: unsigned-service-path-injection-debug-api-profile
    desc: Unsigned service/injection/debug API profile
    crit: notable
    conf: 0.97
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/os/service/host::service-imagepath-value-name
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-text
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-text
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-text
      - id: micro-behaviors/process/debug/detect::is-debugger-present-import
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
