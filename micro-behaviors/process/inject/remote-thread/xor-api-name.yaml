# Encoded API reference; no invocation or import-concealment claim.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, elf, macho, static-lib]
  crit: notable
  conf: 0.95
traits:
  - id: xor-createremotethread-name-prefix
    desc: XOR-masked CreateRemoteThread name prefix
    if:
      type: yara
      source: |
        rule xor_remote_thread_start_name {
          strings:
            $name = "CreateRemoteThre" xor(1-255)
          condition:
            $name
        }
