# Remote-thread references alone do not establish DLL loading.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, c, cpp, pe]
  crit: notable
  conf: 0.95
  attack: T1055
traits:
  - id: create-remote-thread
    desc: CreateRemoteThread API reference
    if:
      type: symbol
      regex: 'CreateRemoteThread'
    unless:
      - id: well-known/game/mod::bedrockboot-preload-injector-pdb
  - id: create-remote-thread-source
    desc: Remote thread creation API in source
    for: [c, cpp, csharp, rust]
    if:
      type: symbol
      kind: call
      regex: '^CreateRemoteThread(Ex)?$'
  - id: create-remote-thread-text
    desc: CreateRemoteThread API string
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      word: CreateRemoteThread
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: micro-behaviors/process/create/load/vba::vba-declare-createremotethread
  - id: create-remote-thread-rust-text
    desc: Rust source CreateRemoteThread API reference
    for: [rust]
    if:
      type: text
      word: CreateRemoteThread
    unless:
      # The symbol records the API being used; this also sees the name sitting in
      # data. Standing down there keeps one use from counting twice.
      - id: micro-behaviors/process/create/load/vba::vba-declare-createremotethread
      - id: create-remote-thread-source
  - id: create-remote-thread-python-source
    desc: Python CreateRemoteThread call
    platforms: [windows]
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)CreateRemoteThread$'

  - id: serialized-createremotethread-name
    desc: Serialized Python CreateRemoteThread name
    crit: notable
    conf: 0.95
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      exact: aCreateRemoteThread
