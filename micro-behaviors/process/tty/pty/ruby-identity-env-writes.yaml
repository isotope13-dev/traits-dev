# Bind command writes to the first IO parameter from the PTY shell block.
# PTY IO order or other API misuse may prevent execution, so report the
# command-writing source rather than successful shell reconnaissance.
defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-pty-shell-identity-environment-writes
    desc: PTY shell has identity/env command writes
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call receiver: (constant) @pty method: (identifier) @spawn
          arguments: (argument_list (string (string_content) @shell))
          block: (do_block parameters: (block_parameters (identifier) @input (identifier) (identifier))
            body: (body_statement
              (call block: (do_block body: (body_statement
                (call receiver: (identifier) @id_input method: (identifier) @id_write
                  arguments: (argument_list (string (string_content) @id_command)))
                (call receiver: (identifier) @user_input method: (identifier) @user_write
                  arguments: (argument_list (string (string_content) @user_command)))
                (call receiver: (identifier) @system_input method: (identifier) @system_write
                  arguments: (argument_list (string (string_content) @system_command)))
                (call receiver: (identifier) @env_input method: (identifier) @env_write
                  arguments: (argument_list (string (string_content) @env_command)))))))))
          (#eq? @pty "PTY") (#eq? @spawn "spawn") (#match? @shell "^(/bin/)?(sh|bash|zsh)$")
          (#eq? @input @id_input) (#eq? @input @user_input)
          (#eq? @input @system_input) (#eq? @input @env_input)
          (#eq? @id_write "puts") (#eq? @user_write "puts")
          (#eq? @system_write "puts") (#eq? @env_write "puts")
          (#eq? @id_command "id") (#eq? @user_command "whoami")
          (#eq? @system_command "uname -a") (#match? @env_command "^(env|printenv)$"))
