defaults:
  platforms: [unix, windows]
traits:
- id: socat-pty-option
  desc: socat pseudo-terminal option syntax
  crit: notable
  conf: 0.8
  for:
  - shell
  - package.json
  - markdown
  if:
    type: text
    case_insensitive: true
    regex: socat\s+.{0,50}PTY
  unless:
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
