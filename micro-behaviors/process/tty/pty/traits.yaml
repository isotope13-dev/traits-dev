defaults:
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: node-pty-history-isolation
    desc: PTY teardown disables shell history
    crit: notable
    conf: 0.96
    attack: T1070.003
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bptyProcess\.write\s*\(\s*[''"](?s:.*?)set \+o history'

  - id: node-terminal-write-parsed-data
    desc: Node writes parsed data to a terminal
    crit: notable
    conf: 0.98
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bwriteTerminal\s*\(\s*parsed\.sessionId\s*,\s*parsed\.data\s*\)'

  - id: node-terminal-write-payload-data
    desc: Node writes payload data to a terminal
    crit: notable
    conf: 0.98
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bwriteTerminal\s*\(\s*payload\.sessionId\s*,\s*payload\.data\s*\)'

  - id: node-terminal-input-data-write
    desc: Node writes terminal-input data to a PTY
    crit: notable
    conf: 0.99
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?s)function\s+handleTerminalInput\s*\(.{0,900}\brecord\.pty\.write\s*\(\s*data\s*\)'

  - id: python-pty-fork
    desc: Python allocates a child PTY
    crit: notable
    conf: 0.92
    attack: T1059
    for: [python]
    if:
      type: text
      substr: "pty.fork()"

  - id: python-openpty-call
    desc: Python allocates a pseudoterminal pair
    crit: notable
    conf: 0.92
    attack: T1059
    for: [python]
    if:
      type: symbol
      kind: call
      exact: pty.openpty

  - id: python-pty-master-write
    desc: Python writes bytes to PTY master
    crit: notable
    conf: 0.92
    attack: T1059
    for: [python]
    if:
      type: text
      substr: "os.write(master"

  - id: rust-pty-allocation
    desc: References a Rust pseudoterminal API
    crit: notable
    conf: 0.9
    attack: T1059
    for: [rust]
    if:
      type: text
      regex: '\b(forkpty|openpty|posix_openpt)\s*\('

  - id: openpty-call
    desc: openpty() call
    crit: notable
    conf: 0.7
    attack: T1059
    for: [scripts, binaries]
    if:
      type: text
      substr: openpty
    unless:
      - type: basename
        regex: ^(node-pty|pty|conpty)\.node$
  - id: forkpty
    desc: Allocates a pseudoterminal for a child process
    crit: notable
    conf: 0.9
    attack: T1059
    mbc: B0022
    for: [elf, macho, c, cpp]
    if:
      type: symbol
      exact: forkpty
    unless:
      - type: basename
        regex: ^(node-pty|pty|conpty)\.node$
  - id: python-pty-shell-process
    desc: Python shell process attached to PTY
    crit: notable
    conf: 0.9
    attack: T1059.006
    mbc: B0022
    for: [python]
    if:
      type: text
      regex: '(?s)os\.openpty\(\).{0,320}subprocess\.Popen\(.{0,320}(stdin|stdout|stderr)\s*=\s*slave_fd'
  - id: pty-open-call
    desc: pty.Open call
    crit: notable
    conf: 0.7
    attack: T1059
    for: [scripts, binaries]
    if:
      type: text
      substr: pty.Open
  - id: posix-openpt
    desc: POSIX open pseudoterminal master
    crit: notable
    conf: 0.85
    attack: T1059
    for:
      - elf
      - macho
      - c
      - cpp
    if:
      type: symbol
      exact: posix_openpt
    unless:
      - type: basename
        regex: ^(node-pty|pty|conpty)\.node$
  - id: grantpt
    desc: Grant access to slave pseudoterminal
    crit: notable
    conf: 0.8
    attack: T1059
    for:
      - elf
      - macho
      - c
      - cpp
    if:
      type: symbol
      regex: grantpt
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - type: basename
        regex: ^(node-pty|pty|conpty)\.node$
  - id: unlockpt
    desc: Unlock slave pseudoterminal
    crit: notable
    conf: 0.8
    attack: T1059
    for:
      - elf
      - macho
      - c
      - cpp
    if:
      type: symbol
      regex: unlockpt
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - type: basename
        regex: ^(node-pty|pty|conpty)\.node$
  - id: ptsname-symbol
    desc: ptsname symbol
    crit: notable
    conf: 0.6
    attack: T1059
    for:
      - elf
      - macho
      - c
      - cpp
    if:
      type: symbol
      regex: ptsname
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - type: basename
        regex: ^(node-pty|pty|conpty)\.node$
  - id: ptsname-r-symbol
    desc: ptsname_r symbol
    crit: notable
    conf: 0.6
    attack: T1059
    for:
      - elf
      - macho
      - c
      - cpp
    if:
      type: symbol
      regex: ptsname_r
  - id: ttyname-r-symbol
    desc: ttyname_r symbol
    crit: notable
    conf: 0.6
    attack: T1059
    for:
      - elf
      - macho
      - c
      - cpp
    if:
      type: symbol
      regex: ttyname_r
  - id: vhangup
    desc: Virtual terminal hangup
    crit: notable
    conf: 0.85
    attack: T1059
    for:
      - elf
      - macho
    if:
      type: symbol
      exact: vhangup
  - id: getpass
    desc: Terminal password prompt
    crit: notable
    conf: 0.6
    attack: T1056
    for:
      - elf
      - macho
    if:
      type: symbol
      exact: getpass
  - id: import-pty
    desc: import pty statement
    crit: notable
    conf: 0.7
    attack: T1059
    for:
      - python
    if:
      type: text
      substr: import pty
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
  - id: from-pty-import
    desc: from pty import statement
    crit: notable
    conf: 0.7
    attack: T1059
    for:
      - python
    if:
      type: text
      substr: from pty import
  - id: pty-spawn
    desc: Calls Python PTY spawn API
    crit: notable
    conf: 0.9
    attack: T1059
    for:
      - python
    if:
      type: symbol
      kind: call
      exact: pty.spawn
    unless:
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
  - id: pty-spawn-inline-shell-text
    desc: Inline Python command spawns a PTY shell
    crit: notable
    conf: 0.96
    attack: T1059.006
    for:
      - python
    if:
      type: text
      regex: 'pty\.spawn\(\s*["'']/bin/(sh|bash)["'']\s*\)'
  - id: node-pty-module-ref
    desc: node-pty module reference
    crit: notable
    conf: 0.7
    attack: T1059.007
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      substr: node-pty
    not:
      - substr: node-pty Build
  - id: node-pty-spawn
    desc: Node.js PTY spawn
    crit: notable
    conf: 0.7
    attack: T1059.007
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: pty\.spawn\s*\(
  - id: node-pty-spawn-command-options
    desc: PTY spawns caller-supplied command and arguments
    crit: notable
    conf: 0.94
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: text
      # Accept both direct property arguments and the common local-variable
      # form used after extracting `launchCommand.command` / `.args`.
      regex: 'pty\.spawn\s*\(\s*([A-Za-z_$][\w$]*\.)?command\s*,\s*([A-Za-z_$][\w$]*\.)?args'

  - id: node-pty-resolved-command-launch
    desc: PTY launches resolved command
    crit: notable
    conf: 0.96
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bcreatePty\w*\s*\(\s*launchSpec\.command\s*,\s*launchSpec\.args'
  # Broader than the `pty.write(msg.data)` shapes in
  # objectives/command-and-control/backdoor/shell/pty: matches any WebSocket
  # (or socket) message handler whose body writes into a pty/term handle,
  # including the idiomatic `ws.on('message', d => term.write(d.toString()))`.
  - id: node-socket-message-pty-write
    desc: Socket message handler writes to a PTY
    crit: notable
    conf: 0.9
    attack: T1059.007
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?s)\.on\(\s*["'']message["''].{0,900}\b(pty|term|terminal)\w*\.write\s*\('
  - id: pty-js-require
    desc: require('pty.js') call
    crit: notable
    conf: 0.7
    attack: T1059.007
    for:
      - javascript
      - typescript
    if:
      type: text
      substr: require('pty.js')
  - id: go-creack-pty-path
    desc: github.com/creack/pty library path
    crit: notable
    conf: 0.95
    attack: T1059
    for: [elf, macho, go.mod]
    if:
      type: text
      substr: github.com/creack/pty
  - id: go-creack-pty-error
    desc: github.com/creack/pty error message
    crit: notable
    conf: 0.9
    attack: T1059
    for: [elf, macho]
    if:
      type: text
      substr: "failed to start pty: %v"
  - id: go-creack-pty-kv
    desc: github.com/creack/pty library dependency
    crit: notable
    conf: 1.0
    attack: T1059
    for: [elf, macho]
    if:
      type: value
      path: go.dependencies.path
      exact: github.com/creack/pty
  - id: winpty-dll-name
    desc: winpty DLL filename
    crit: notable
    conf: 0.86
    attack: T1059
    platforms: [windows]
    for: [pe]
    if:
      type: text
      substr: winpty.dll
  - id: winpty-agent-name
    desc: winpty agent executable filename
    crit: notable
    conf: 0.9
    attack: T1059
    platforms: [windows]
    for: [pe]
    if:
      type: text
      substr: winpty-agent.exe
  - id: go-embedded-winpty-path
    desc: Go embedded winpty executable path
    crit: notable
    conf: 0.95
    attack: T1059
    platforms: [windows]
    for: [pe]
    if:
      type: text
      regex: 'executables/[A-Za-z0-9_/.-]{1,80}winpty'
  - id: dev-ptmx
    desc: /dev/ptmx PTY master multiplexer device
    crit: component
    conf: 0.9
    platforms: [linux]
    for: [elf]
    if:
      type: text
      exact: /dev/ptmx
      section: rdata
  - id: login-tty-symbol
    desc: login_tty PTY session symbol
    crit: component
    platforms: [unix]
    for: [elf]
    if:
      type: symbol
      exact: login_tty
  - id: go-pty-start
    desc: Starts child process under Go PTY
    crit: notable
    conf: 0.95
    attack: T1059
    for: [go]
    if:
      type: symbol
      kind: call
      exact: pty.Start

  - id: go-pty-spawn-command
    desc: Go writes PTY spawn command to network
    crit: suspicious
    conf: 0.94
    attack: T1059
    mbc: B0022
    for: [go]
    if:
      type: text
      regex: '\.Write\([^\n]{0,220}pty\.spawn\('
    unless:
      # Gato is a recognized operator-side reverse-shell handler; its
      # documented PTY negotiation is not an implant finding.
      - id: well-known/tool/offensive/gato::gato-tool-context
      - id: well-known/tool/offensive/gato::source-member-marker

  # pexpect drives another program's terminal: it allocates a PTY for the
  # child, waits on prompt patterns and types replies.  That is how automation
  # answers an interactive credential prompt without a user -- benign in a
  # desktop privilege helper (Mugshot feeds `sudo chfn` the password from its
  # GTK dialog) and the same mechanic malware uses to auto-elevate.  Plain text
  # matchers so the atoms survive compilation: a .pyc keeps `pexpect` and
  # `sendline` as separate name-table entries, with no symbols or literals.
  - id: pexpect-library-reference
    desc: References the pexpect PTY automation library
    crit: notable
    conf: 0.9
    attack: T1059
    for: [python, pyc]
    platforms: [linux, macos]
    if:
      type: text
      word: pexpect

  - id: pexpect-sendline-write
    desc: Types a line into a pexpect child
    crit: notable
    conf: 0.88
    attack: T1059
    for: [python, pyc]
    platforms: [linux, macos]
    if:
      type: text
      word: sendline

composite_rules:
  - id: node-pty-usage
    desc: Node.js PTY library usage
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    any:
      - id: node-pty-module-ref
      - id: node-pty-spawn
      - id: pty-js-require

  - id: go-pty-shell
    desc: Go binary starts shell under PTY
    crit: notable
    conf: 0.8
    attack: T1059
    mbc: B0022
    for: [elf, macho]
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: go-creack-pty-path
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text

  - id: openpty
    desc: Open pseudoterminal
    crit: notable
    conf: 0.85
    attack: T1059
    for: [scripts, binaries, c, cpp]
    any:
      - id: openpty-call
      - id: pty-open-call
  - id: winpty-bundled-console
    desc: Bundled Windows PTY console support
    crit: notable
    conf: 0.92
    platforms: [windows]
    for: [pe]
    any:
      - id: winpty-dll-name
      - id: winpty-agent-name
      - id: go-embedded-winpty-path
    needs: 2
  - id: pty-allocation-symbols
    desc: Pseudoterminal allocation symbols
    crit: component
    conf: 0.8
    for:
      - elf
      - macho
      - c
      - cpp
    any:
      - id: openpty
      - id: posix-openpt
      - id: grantpt
      - id: unlockpt
      - id: ptsname
  - id: pty-allocation-sequence
    desc: Full manual PTY allocation sequence (posix_openpt + grantpt + unlockpt)
    crit: component
    conf: 0.85
    for:
      - elf
      - macho
      - c
      - cpp
    all:
      - id: posix-openpt
      - id: grantpt
      - id: unlockpt
  - id: pty-allocation-full
    desc: Full PTY allocation with slave-name resolution
    crit: component
    conf: 0.85
    for:
      - elf
      - macho
      - c
      - cpp
    all:
      - id: pty-allocation-sequence
      - id: ptsname
  # The two ways a program gets a usable PTY master pair. openpty(3) is the
  # libutil convenience wrapper; the POSIX route is posix_openpt + grantpt +
  # unlockpt + ptsname spelled out by hand. They are interchangeable, and code
  # that avoids linking libutil -- static builds, busybox-era embedded targets,
  # and the router implants that copy the rctl client -- takes the POSIX route.
  # Rules that key on openpty alone miss half the population.
  - id: pty-master-allocation
    desc: Allocates a pseudoterminal master
    crit: notable
    conf: 0.85
    attack: T1059
    for:
      - elf
      - macho
      - c
      - cpp
    any:
      - id: openpty
      - id: pty-allocation-full
  - id: ptsname
    desc: Get slave pseudoterminal name
    crit: notable
    conf: 0.8
    attack: T1059
    for:
      - elf
      - macho
      - c
      - cpp
    any:
      - id: ptsname-symbol
      - id: ptsname-r-symbol
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: ttyname-comp
    desc: Get terminal device pathname
    crit: notable
    conf: 0.8
    attack: T1059
    for:
      - elf
      - macho
      - c
      - cpp
    any:
      - id: micro-behaviors/process/tty/terminal::ttyname
      - id: ttyname-r-symbol
  - id: python-pty-comp
    desc: Python PTY module
    crit: notable
    conf: 0.85
    attack: T1059
    for:
      - python
    any:
      - id: import-pty
      - id: from-pty-import
  - id: python-pty-allocation
    desc: Python allocates a pseudoterminal
    crit: notable
    conf: 0.9
    attack: T1059
    for:
      - python
    any:
      - id: python-pty-fork
      - id: python-openpty-call
      - id: pty-spawn
  - id: source-pty-allocation
    desc: Source allocates a pseudoterminal
    crit: notable
    conf: 0.9
    attack: T1059
    for:
      - c
      - cpp
      - rust
    any:
      - id: openpty
      - id: forkpty
      - id: posix-openpt
      - id: rust-pty-allocation
  - id: interactive-shell
    desc: Interactive shell via PTY
    crit: notable
    conf: 0.8
    attack: T1059
    mbc: B0022
    for: [scripts, binaries, c, cpp]
    needs: 2
    any:
      - id: openpty
      - id: posix-openpt
      - id: grantpt
      - id: unlockpt
      - id: pty-spawn
      - id: ptsname
    downgrade:
      any:
        - id: metadata/signed/entitlements::debugger
        - id: metadata/signed/platform::apple
        - id: micro-behaviors/dylib/library/family/
  - id: posix-pty-shell
    # Full PTY allocation plus a shell spawn — the interactive-terminal
    # capability shared by terminal emulators, tmux, script(1), expect and
    # sshd. It is NOT a backdoor on its own; that requires redirecting the PTY
    # to a socket (see objectives/command-and-control/reverse-shell/pty, whose
    # composites add the network leg). Neutral capability: notable, accurate
    # name, no intent assertion.
    desc: Full PTY allocation with shell spawn
    crit: notable
    conf: 0.95
    attack: T1059
    mbc: B0022
    for:
      - elf
      - macho
    platforms:
      - linux
      - macos
    all:
      - id: posix-openpt
      - id: grantpt
      - id: unlockpt
      - id: ptsname
      - id: micro-behaviors/process/create/shell/
    downgrade:
      any:
        - id: metadata/binary/vendor/
        - id: micro-behaviors/dylib/library/family/
        - id: micro-behaviors/dylib/library/family/
        - id: micro-behaviors/dylib/library/family/
        - id: micro-behaviors/dylib/library/app
  - id: pty-network-backdoor
    desc: PTY with socket and fork operations
    crit: notable
    conf: 0.95
    attack: T1059
    mbc: B0022
    for:
      - elf
      - macho
      - c
      - cpp
    platforms:
      - linux
      - macos
    all:
      - id: micro-behaviors/communications/socket/create::create
      - id: micro-behaviors/communications/socket/connect::connect
      - id: micro-behaviors/process/fork/clone::fork
      - id: interactive-shell
    any:
      - id: micro-behaviors/communications/socket/receive::receive
      - id: micro-behaviors/communications/socket/send::send
      - id: micro-behaviors/process/create/direct::execve-import
      - id: micro-behaviors/process/create/shell/spawn::bin-sh
    downgrade:
      any:
        - id: metadata/signed/platform::apple
        - id: micro-behaviors/dylib/library/
        - id: metadata/binary/
  - id: go-creack-pty
    desc: github.com/creack/pty library
    crit: notable
    conf: 0.95
    attack: T1059
    for: [elf, macho, go.mod]
    any:
      - id: go-creack-pty-path
      - id: go-creack-pty-error
      - id: go-creack-pty-kv
