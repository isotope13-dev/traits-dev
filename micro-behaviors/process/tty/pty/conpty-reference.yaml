# ConPTY context is a terminal observation, not a generic process-name list.
defaults:
  platforms: [windows]

traits:
  - id: conpty-conhost-reference
    desc: ConPTY and conhost.exe references
    crit: notable
    conf: 0.88
    for: [javascript, typescript, scripts, source, markdown]
    if:
      type: text
      regex: '(?i)ConPTY.{0,160}conhost\.exe'
