# A network read callback that writes the received buffer straight into a
# shell/PTY descriptor turns the connection into the shell's keyboard. Paired
# with a PTY-attached shell process this is a remote interactive shell
# server: legitimate in admin/debug tools, and the core of a bind shell.
defaults:
  platforms: [linux, macos, windows]
  for: [python]
  attack: T1059.004

traits:
  - id: python-os-write-shell-fd-attribute
    desc: os.write to shell or PTY descriptor attribute
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '^\s+os\.write\(\s*self\.\w{0,20}(shell|pty|master|stdin|tty)\w{0,20}\s*,'

composite_rules:
  - id: python-read-callback-writes-shell-fd
    desc: Read callback writes to shell descriptor
    crit: notable
    conf: 0.9
    near_lines: 9
    all:
      - id: micro-behaviors/communications/socket/receive::python-receive-callback-method
      - id: python-os-write-shell-fd-attribute

  - id: python-network-fed-pty-shell
    desc: Network input drives a PTY-attached shell process
    crit: suspicious
    conf: 0.92
    scope: file
    all:
      - id: python-read-callback-writes-shell-fd
      - id: micro-behaviors/process/tty/pty::python-pty-shell-process
