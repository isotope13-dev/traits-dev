# A network read callback that writes the received buffer straight into a
# shell/PTY descriptor turns the connection into the shell's keyboard. Paired
# with a PTY-attached shell process this is a remote interactive shell
# server: legitimate in admin/debug tools, and the core of a bind shell.
defaults:
  platforms: [linux, macos, windows]
  for: [python]
  attack: T1059.004

traits:
  - id: python-read-callback-writes-shell-fd
    desc: Network read callback writes buffer to shell descriptor
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'def\s+\w*(read|recv|receive|received|message)\w*\(\s*self\s*,[^)]{0,80}\)\s*:(?:\n[^\n]{0,160}){0,8}?\n\s+os\.write\(\s*self\.\w{0,20}(shell|pty|master|stdin|tty)\w{0,20}\s*,'

composite_rules:
  - id: python-network-fed-pty-shell
    desc: Network input drives a PTY-attached shell process
    crit: suspicious
    conf: 0.92
    scope: file
    all:
      - id: python-read-callback-writes-shell-fd
      - id: micro-behaviors/process/tty/pty::python-pty-shell-process
