defaults:
  platforms: [windows, unix]
  for: [scripts]
composite_rules:
  - id: python-socket-pty-shell-api-set
    desc: Python socket and PTY shell API co-occurrence
    crit: notable
    conf: 0.95

    for:
    - python
    all:
    - id: micro-behaviors/process/tty/pty::python-pty-allocation
    - id: micro-behaviors/communications/socket/create::python-socket
    - id: micro-behaviors/communications/socket/connect/attempt::connect-python
    any:
    - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
    - id: micro-behaviors/fs/path/executable::bin-shell
    near_lines: 64
