# Co-occurrence of embedding, file-writing and terminal process APIs.
# No path/byte flow, remote controller, concealment or unauthorized use is required.
defaults:
  platforms: [unix, android]
  for: [elf, macho, so, dylib]

composite_rules:
  - id: embedded-script-and-pty-exec-apis
    desc: Embedded script with file-write and PTY-exec APIs
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/data/embedded/payload/array::embedded-script-blob-export
      - id: micro-behaviors/fs/file/open::fopen
      - id: micro-behaviors/fs/write/file/handle::write--fwrite
      - id: micro-behaviors/process/tty/pty::forkpty
      - id: micro-behaviors/process/create/exec::c-exec-variants

