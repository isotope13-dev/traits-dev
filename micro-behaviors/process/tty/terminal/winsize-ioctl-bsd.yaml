# TIOCGWINSZ reached through libc `ioctl(3)` on the BSD ABI, where the request
# encodes as 0x40087468 — `_IOR('t', 104, struct winsize)` — instead of Linux's
# flat 0x5413. The sibling raw-ioctl-x64.yaml covers the Linux spelling and
# anchors on a `syscall` instruction; a dynamically linked Darwin/BSD binary
# calls into libSystem instead, so the constant is loaded into esi and followed
# by a `call rel32`.
#
# Reading the window size is the most innocuous terminal ioctl there is — every
# pager, progress bar, and CLI that wraps its output issues it — so the request
# constant stays baseline on its own. What the composite adds is the fd it is
# issued on: a program that opens the controlling terminal by path first, rather
# than measuring an inherited stdio descriptor, is a dedicated size probe. That
# is the shape of the prebuilt `term-size` helpers that npm/pip packages vendor
# and shell out to, and it is worth naming so those binaries render as their
# actual purpose instead of an unexplained Mach-O with no findings.
#
# x86-64 only: arm64 materializes the 32-bit request with a `mov`/`movk` pair,
# so the four bytes are never contiguous and this pattern cannot see it.
defaults:
  platforms: [unix]
  for: [macho, dylib, elf]
  arch: [x86-64]
  crit: baseline
  conf: 0.85

traits:
  - id: tiocgwinsz-libc-ioctl-bsd
    desc: Queries terminal size via libc ioctl
    if:
      type: hex
      offset_range: [64, 1048576]
      pattern: "be 68 74 08 40 [0-16] e8"

composite_rules:
  - id: dev-tty-window-size-probe
    desc: Reads window size from /dev/tty
    crit: notable
    conf: 0.9
    all:
      - id: tiocgwinsz-libc-ioctl-bsd
      - id: micro-behaviors/fs/path/device/terminal::dev-tty
