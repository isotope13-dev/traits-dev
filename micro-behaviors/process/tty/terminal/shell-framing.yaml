defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-shell-readiness-template
    desc: Shell echo-off readiness marker template
    if:
      type: literal
      exclude_docstrings: true
      regex: '^(f["''])?stty -echo 2>/dev/null; echo; echo '
  - id: python-shell-status-frame-template
    desc: Shell template brackets command and exit status
    if:
      type: literal
      exclude_docstrings: true
      regex: '^(f["''])?echo "\{[^}]+\}"; \{[^}]+\}; echo "\{[^}]+\}\$\?'
  - id: python-shell-echo-restore-template
    desc: Shell template restores terminal echo
    if:
      type: literal
      exclude_docstrings: true
      exact: stty echo 2>/dev/null

composite_rules:
  # A framed automation terminal owns its command stream and restores echo
  # for a human handoff. Keep the neutral HISTFILE observation; this context
  # rules out inferring indicator removal from that setting alone.
  - id: framed-shell-history-isolation
    desc: Framed terminal automation isolates shell history
    crit: exception
    all:
      - id: micro-behaviors/os/env/write::histfile-dev-null
      - id: python-shell-readiness-template
      - id: python-shell-status-frame-template
      - id: python-shell-echo-restore-template
