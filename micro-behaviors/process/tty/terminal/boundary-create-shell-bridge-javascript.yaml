defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  crit: notable
traits:
- id: vscode-create-terminal
  desc: Creates a VS Code terminal
  conf: 0.9
  if:
    type: text
    regex: \bwindow\.createTerminal\s*\(
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: terminal-send-text
  desc: Sends text to terminal session
  conf: 0.85
  if:
    type: text
    regex: (?i)\b[\w$]*(term|pty)[\w$]*\s*\??\.\s*sendText\s*\(
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
composite_rules:
- id: vscode-terminal-command-dispatch
  desc: Dispatches commands through VS Code terminal
  conf: 0.92
  near_bytes: 4096
  all:
  - id: micro-behaviors/process/tty/terminal::vscode-create-terminal
  - id: micro-behaviors/process/tty/terminal::terminal-send-text
