defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  # A sendText call alone does not establish an LLM permission setting.
  # Keep the parsed call distinct from terminal-named text evidence.
  - id: send-text-method-call
    desc: Calls a sendText method
    if:
      type: symbol
      kind: call
      regex: '\.sendText$'
