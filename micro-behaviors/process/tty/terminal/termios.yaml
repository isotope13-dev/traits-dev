# Terminal line-discipline (termios) control and terminal initialization.
#
# These are attribute operations on *any* controlling terminal -- what a program
# calls to turn echo off for a password prompt, or to put the tty in raw mode for
# a full-screen UI. They are not pseudoterminal allocation (openpty/posix_openpt/
# grantpt, in ../pty/), which is the interactive-backdoor signal; filing them
# there labelled every password-prompting CLI a PTY user. The raw ioctl(2)
# spellings of the same behavior are in ./raw-ioctl-x64.yaml.
defaults:
  platforms: [linux, macos, windows]
traits:
  - id: tcgetattr
    desc: Get terminal attributes
    crit: notable
    conf: 0.75
    attack: T1059
    for:
      - elf
      - macho
      - c
      - cpp
    if:
      type: symbol
      regex: tcgetattr
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - type: basename
        regex: ^(node-pty|pty|conpty)\.node$
      - type: basename
        exact: bindings.node
      - type: basename
        regex: ^node\.napi\.armv[678]\.node$
      - type: basename
        regex: ^node\.napi\.(glibc|musl)\.node$
    downgrade:
      any:
        - id: metadata/file/string/identity::system-shell-basename
  - id: tcsetattr
    desc: Set terminal attributes
    crit: notable
    conf: 0.75
    attack: T1059
    for:
      - elf
      - macho
    if:
      type: symbol
      regex: tcsetattr
    unless:
      - type: basename
        regex: ^(node-pty|pty|conpty)\.node$
      - id: metadata/file/string/identity::system-shell-basename
      - type: basename
        exact: bindings.node
      - type: basename
        regex: ^node\.napi\.armv[678]\.node$
      - type: basename
        regex: ^node\.napi\.(glibc|musl)\.node$
  - id: cfmakeraw
    desc: Make terminal attributes raw-mode
    crit: component
    conf: 0.85
    attack: T1059
    for:
      - elf
      - macho
    if:
      type: symbol
      exact: cfmakeraw
  - id: cfsetispeed
    desc: Set terminal input baud rate attribute
    crit: component
    conf: 0.8
    attack: T1059
    for:
      - elf
      - macho
    if:
      type: symbol
      exact: cfsetispeed
    unless:
      - type: basename
        regex: ^(node-pty|pty|conpty)\.node$
      - type: basename
        exact: bindings.node
      - type: basename
        regex: ^node\.napi\.armv[678]\.node$
      - type: basename
        regex: ^node\.napi\.(glibc|musl)\.node$
  - id: cfsetospeed
    desc: Set terminal output baud rate attribute
    crit: component
    conf: 0.8
    attack: T1059
    for:
      - elf
      - macho
    if:
      type: symbol
      exact: cfsetospeed
    unless:
      - type: basename
        regex: ^(node-pty|pty|conpty)\.node$
      - type: basename
        exact: bindings.node
      - type: basename
        regex: ^node\.napi\.armv[678]\.node$
      - type: basename
        regex: ^node\.napi\.(glibc|musl)\.node$
  - id: setupterm
    desc: Terminal initialization
    crit: notable
    conf: 0.7
    attack: T1059
    for:
      - elf
      - macho
    if:
      type: text
      substr: setupterm

composite_rules:
  - id: terminal-control-stack
    desc: Interactive terminal control stack
    crit: baseline
    conf: 0.8
    for:
      - elf
      - macho
      - c
      - cpp
    needs: 3
    any:
      - id: micro-behaviors/process/tty/pty::openpty
      - id: tcgetattr
      - id: tcsetattr
      - id: cfsetispeed
      - id: cfsetospeed
      - id: setupterm
  - id: terminal-attribute-control
    desc: Terminal attribute control symbols
    crit: component
    conf: 0.8
    for:
      - elf
      - macho
    any:
      - id: tcgetattr
      - id: tcsetattr
      - id: cfmakeraw
      - id: cfsetispeed
      - id: cfsetospeed
      - id: setupterm
