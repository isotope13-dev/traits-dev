defaults:
  crit: notable
  platforms: [unix, windows]
  for: [java, class, kotlin, jar, zip]
traits:
  - id: jsp-multiple-input-stream-access-source
    desc: JSP has multiple input-stream accessor calls
    crit: notable
    conf: 0.9
    for: [jsp]
    count_min: 2
    if:
      type: text
      regex: '\.getInputStream\s*\('
  - id: jsp-multiple-output-stream-access-source
    desc: JSP has multiple output-stream accessor calls
    crit: notable
    conf: 0.9
    for: [jsp]
    count_min: 2
    if:
      type: text
      regex: '\.getOutputStream\s*\('
  - id: java-input-stream-access
    desc: Java input stream access
    conf: 0.86
    for: [java, jsp, class, kotlin]
    if:
      type: symbol
      kind: call
      exact: getInputStream
  - id: jvm-process-input-stream
    desc: JVM process output stream access
    conf: 0.94
    for: [class]
    if:
      type: import
      exact: java/lang/Process.getInputStream
  # `getOutputStream` is the generic JDK stream accessor — `Process`,
  # `Socket`, `HttpURLConnection`, `FileUtil` and every servlet response all
  # expose it — so it sits beside its `getInputStream` twin rather than under
  # communications/socket/send/, where it described a Word/OOXML writer as a
  # socket transmission. Composites that mean "socket send" supply the socket
  # leg themselves.
  - id: java-output-stream-access
    desc: Java output stream access
    conf: 0.86
    for: [java, jsp, class, kotlin]
    if:
      type: symbol
      kind: call
      exact: getOutputStream
  - id: java-output-stream-write
    desc: Java output stream write sequence
    conf: 0.9
    for: [java, class, kotlin, text]
    if:
      type: text
      regex: '(?s)getOutputStream\s*\(\)[^;\n]{0,240}\.write\s*\('
  - id: java-stream-transfer-to
    desc: Java stream transferTo calls
    conf: 0.9
    count_min: 2
    for: [java, jsp, class, kotlin]
    if:
      type: text
      regex: '\.transferTo\s*\('
