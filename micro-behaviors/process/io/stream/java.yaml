defaults:
  platforms: [unix, windows]
  for: [java, class, kotlin, jar, zip]
traits:
  - id: java-input-stream-access
    desc: Java input stream access
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: getInputStream
  - id: jvm-process-input-stream
    desc: JVM process output stream access
    crit: notable
    conf: 0.94
    for: [class, jar, zip]
    if:
      type: import
      exact: java/lang/Process.getInputStream
  # `getOutputStream` is the generic JDK stream accessor — `Process`,
  # `Socket`, `HttpURLConnection`, `FileUtil` and every servlet response all
  # expose it — so it sits beside its `getInputStream` twin rather than under
  # communications/socket/send/, where it described a Word/OOXML writer as a
  # socket transmission. Composites that mean "socket send" supply the socket
  # leg themselves.
  - id: java-output-stream-access
    desc: Java output stream access
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: getOutputStream
  - id: java-output-stream-write
    desc: Java output stream write sequence
    crit: notable
    conf: 0.9
    for: [java, class, kotlin, text]
    if:
      type: text
      regex: '(?s)getOutputStream\s*\(\)[^;\n]{0,240}\.write\s*\('
  - id: java-processbuilder-redirect-input
    desc: Java ProcessBuilder redirects standard input
    crit: notable
    conf: 0.92
    if:
      type: import
      exact: java/lang/ProcessBuilder.redirectInput
  - id: java-processbuilder-redirect-output
    desc: Java ProcessBuilder redirects standard output
    crit: notable
    conf: 0.92
    if:
      type: import
      exact: java/lang/ProcessBuilder.redirectOutput
  - id: java-processbuilder-redirect-errors
    desc: Java ProcessBuilder merges standard error
    crit: notable
    conf: 0.92
    if:
      type: import
      exact: java/lang/ProcessBuilder.redirectErrorStream

composite_rules:
  - id: java-processbuilder-redirected-stdio
    desc: Java ProcessBuilder redirects all standard streams
    crit: notable
    conf: 0.96
    all:
      - id: java-processbuilder-redirect-input
      - id: java-processbuilder-redirect-output
      - id: java-processbuilder-redirect-errors
