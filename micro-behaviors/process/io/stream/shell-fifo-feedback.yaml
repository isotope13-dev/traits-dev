# The source producer binds the declared FIFO, shell stdin, netcat stdout,
# literal shell argv and endpoint in one closed recipe.
defaults:
  for:
  - shell
  platforms:
  - unix
traits:
- id: shell-netcat-fifo-feedback
  desc: Shell and Netcat relay through one FIFO
  crit: notable
  conf: 0.99
  if:
    type: value
    path: source.shell.fifo_network_loops[*].mechanism
    exact: fifo-shell-netcat-feedback
