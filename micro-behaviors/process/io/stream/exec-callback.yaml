defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.96

traits:
  - id: exec-callback-output-forward
    desc: exec callback forwards stdout and stderr
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: (member_expression property: (property_identifier) @exec)
          arguments: (arguments
            . (_) . (function_expression
              parameters: (formal_parameters . (identifier) . (identifier) @stdout . (identifier) @stderr .)
              body: (statement_block
                (expression_statement (call_expression
                  arguments: (arguments (object
                    (pair value: (binary_expression
                      left: [
                        (identifier) @out
                        (parenthesized_expression (binary_expression left: (identifier) @out operator: "||"))
                      ]
                      operator: "+"
                      right: [
                        (identifier) @err
                        (parenthesized_expression (binary_expression left: (identifier) @err operator: "||"))
                      ])))))) @forward)))
          (#eq? @exec "exec")
          (#eq? @stdout @out)
          (#eq? @stderr @err))
