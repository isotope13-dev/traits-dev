# Reading and echoing child output is stream I/O, not descriptor configuration.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.98

traits:
  - id: php-proc-output-echo
    desc: Echoes output from proc_open pipes
    if:
      type: tree-sitter
      query: |
        ((_
          (expression_statement (assignment_expression
            right: (function_call_expression
              function: (name) @spawn
              arguments: (arguments
                (argument)
                (argument)
                (argument (variable_name) @pipes)))))
          [
            (echo_statement (function_call_expression
              function: (name) @read
              arguments: (arguments
                (argument (subscript_expression
                  (variable_name) @output (integer) @fd)))))
            (if_statement
              body: (compound_statement
                (echo_statement (function_call_expression
                function: (name) @read
                arguments: (arguments
                  (argument (subscript_expression
                    (variable_name) @output (integer) @fd)))))))
          ]) @relay
          (#match? @spawn "(?i)^proc_open$")
          (#match? @read "(?i)^(stream_get_contents|fread)$")
          (#match? @fd "^[12]$"))
