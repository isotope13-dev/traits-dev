# Receiver spelling supports generic stream syntax, not HTTP request ownership.
traits:
- crit: notable
  id: req-or-request-write-reference
  desc: req/request write method reference
  conf: 0.72
  if:
    type: symbol
    regex: ^(req|request)\.write$
- crit: notable
  id: req-or-request-end-reference
  desc: req/request end method reference
  conf: 0.72
  if:
    type: symbol
    regex: ^(req|request)\.end$
- crit: notable
  id: req-write-call-prefix-text-reference
  desc: req.write call-prefix text reference
  conf: 0.8
  if:
    type: text
    substr: req.write(
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
