---
defaults:
  crit: notable
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript
traits:
- id: js-stream-write-call
  desc: Calls a write method on a stream
  crit: baseline
  conf: 0.88
  if:
    type: symbol
    kind: call
    regex: "(^|[.])write$"
- id: node-stdout-reference
  desc: References Node.js stdout stream
  conf: 0.8
  if:
    type: symbol
    kind: member
    exact: process.stdout
- id: process-stdout-data-listener
  desc: Registers a stdout stream data listener
  conf: 0.9
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: text
    regex: (?i)stdout\s*\.\s*on\s*\(\s*["']data["']
- id: node-stream-data-event
  desc: Registers a Node stream data handler
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: \b[A-Za-z_$][\w$]{0,24}\.on\s*\(\s*['"]data['"]
- id: node-stream-end-event
  desc: Registers a Node stream end handler
  crit: baseline
  conf: 0.88
  if:
    type: text
    regex: \b[A-Za-z_$][\w$]{0,24}\.on\s*\(\s*['"]end['"]
- id: node-stream-to-stdin-pipe
  desc: Pipes a Node stream into child stdin
  crit: notable
  conf: 0.9
  platforms:
  - windows
  - unix
  if:
    type: text
    regex: "\\b[A-Za-z_$][\\w$]*\\.pipe\\s*\\(\\s*[A-Za-z_$][\\w$]*\\.stdin\\s*\\)"
- id: node-child-output-to-stream-pipe
  desc: Pipes child output to a stream
  crit: notable
  conf: 0.9
  platforms:
  - windows
  - unix
  if:
    type: text
    regex: "\\b[A-Za-z_$][\\w$]*\\.(stdout|stderr)\\.pipe\\s*\\(\\s*[A-Za-z_$][\\w$]*\\s*\\)"
composite_rules:
- id: node-stream-to-file
  desc: Writes an evented Node stream to a file
  conf: 0.93
  near_bytes: 1600
  all:
  - id: micro-behaviors/process/io/stream::node-stream-data-event
  - id: micro-behaviors/process/io/stream::node-stream-end-event
  - id: micro-behaviors/fs/write/file/full::node-write-data-variable-sync
