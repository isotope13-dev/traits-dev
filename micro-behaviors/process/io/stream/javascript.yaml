defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [javascript, typescript]

traits:
  # An unqualified `.write()` call. In JavaScript `write` is the Writable
  # stream interface -- sockets, HTTP responses, process stdio, PTYs and
  # fs.WriteStream all implement it -- so the call alone says "writes to a
  # stream", not "writes a file". It lived in fs/write/file/ and was folded
  # into every composite that referenced that directory, which fired the
  # hostile one-line-dropper rule on `term.slave.write()` in a node-pty test.
  - id: js-stream-write-call
    desc: Calls a write method on a stream
    crit: baseline
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '(^|[.])write$'

  - id: node-stdout-reference
    desc: References Node.js stdout stream
    conf: 0.8
    if:
      type: symbol
      kind: member
      exact: process.stdout

  - id: process-stdout-data-listener
    desc: Registers a process stdout data listener
    conf: 0.9
    if:
      type: text
      regex: '(?i)stdout\s*\.\s*on\s*\(\s*["'']data["'']'

  - id: node-stream-data-event
    desc: Registers a Node stream data handler
    crit: baseline
    conf: 0.88
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]{0,24}\.on\s*\(\s*[''"]data[''"]'

  - id: node-stream-end-event
    desc: Registers a Node stream end handler
    crit: baseline
    conf: 0.88
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]{0,24}\.on\s*\(\s*[''"]end[''"]'

composite_rules:
  - id: node-stream-to-file
    desc: Writes an evented Node stream to a file
    conf: 0.93
    near_bytes: 1600
    all:
      - id: node-stream-data-event
      - id: node-stream-end-event
      - id: micro-behaviors/fs/write/file/full::node-write-data-variable-sync
