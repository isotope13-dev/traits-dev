defaults:
  platforms: [unix, windows]
  for: [java, jsp]
  crit: notable
traits:
  - id: jvm-paired-stream-worker-construction
    desc: Java constructs paired stream workers
    conf: 0.95
    count_min: 2
    if:
      type: text
      regex: 'new\s+\w+\(\w+\.getInputStream\(\),\s*\w+\.getOutputStream\(\)\)'
      exclude_html_comments: true
