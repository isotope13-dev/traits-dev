defaults:
  crit: notable
  conf: 0.92
  platforms: [windows]
  for: [asp, vbs]

traits:
  - id: wsh-child-output-read-syntax
    desc: WSH child output stream read syntax
    if:
      type: text
      # ASP/VBScript has no call projection. Require the standard-stream
      # receiver chain; an arbitrary object's ReadAll() is insufficient.
      # Start on an executable line, excluding VB single-quote comments.
      regex: '(?im)^[^''\r\n]{0,100}\b\w+\.Std(Out|Err)\.Read(All|Line)\s*\('
