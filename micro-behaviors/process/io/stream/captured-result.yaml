defaults:
  platforms: [windows, unix]
  for: [source, scripts]

traits:
  - id: process-stdout-result-field
    desc: Captures process stdout in result
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '["'']stdout["'']\s*:\s*[A-Za-z_]\w*\.stdout'

  - id: process-stderr-result-field
    desc: Captures process stderr in result
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '["'']stderr["'']\s*:\s*[A-Za-z_]\w*\.stderr'

composite_rules:
  - id: process-stdout-stderr-result-fields
    desc: Captures both process output streams
    crit: notable
    conf: 0.97
    near_bytes: 320
    all:
      - id: process-stdout-result-field
      - id: process-stderr-result-field
