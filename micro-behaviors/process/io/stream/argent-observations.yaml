# Neutral source and operation observations.
traits:
- id: node-stdio-pipe
  desc: Calls pipe on a Node standard stream
  crit: notable
  conf: 0.92
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  if:
    type: symbol
    kind: call
    regex: (^|\.)std(in|out|err)\.pipe$
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
