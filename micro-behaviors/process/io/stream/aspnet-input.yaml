defaults:
  platforms: [windows]
  for: [asp]
  crit: notable
  conf: 0.97
traits:
  - id: aspnet-standard-input-redirection
    desc: ASP.NET enables child standard input redirection
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)RedirectStandardInput\s*=\s*true'
  - id: aspnet-sin-line-write
    desc: ASP.NET calls WriteLine on sIn writer
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\bsIn\.WriteLine\s*\('
  - id: aspnet-process-stdin-variable-write
    desc: ASP.NET writes a variable to process stdin
    if:
      type: text
      exclude_html_comments: true
      regex: '\bStandardInput\s*\.\s*WriteLine\s*\(\s*[A-Za-z_]\w*\s*\)'
composite_rules:
  - id: aspnet-input-redirect-or-line-write
    desc: ASP.NET stdin redirection or sIn line write
    any:
      - id: aspnet-standard-input-redirection
      - id: aspnet-sin-line-write
