defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
  # Bind both directions to the same connected peer and to the pipe array
  # produced by proc_open. Unrelated socket and file I/O cannot supply legs.
  - id: php-socket-process-duplex-relay
    desc: PHP relays socket and child pipes
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((_
          (expression_statement (assignment_expression
            left: (variable_name) @peer
            right: (function_call_expression function: (name) @connect)))
          (expression_statement (assignment_expression
            right: (function_call_expression function: (name) @spawn
              arguments: (arguments . (argument) . (argument) .
                (argument (variable_name) @pipes) .))))
          (while_statement body: (compound_statement
            (expression_statement (assignment_expression
              left: (variable_name) @incoming
              right: (function_call_expression function: (name) @read_peer
                arguments: (arguments . (argument (variable_name) @source)))))
            (if_statement body: (compound_statement
              (expression_statement (function_call_expression
                function: (name) @write_stdin
                arguments: (arguments .
                  (argument (subscript_expression
                    (variable_name) @input_pipes (integer) @stdin)) .
                  (argument (variable_name) @input_data) .)))))
            (if_statement body: (compound_statement
              (expression_statement (assignment_expression
                left: (variable_name) @outgoing
                right: (function_call_expression function: (name) @read_stdout
                  arguments: (arguments .
                    (argument (subscript_expression
                      (variable_name) @output_pipes (integer) @stdout))))))
              (if_statement body: (compound_statement
                (expression_statement (function_call_expression
                  function: (name) @write_peer
                  arguments: (arguments .
                    (argument (variable_name) @destination) .
                    (argument (variable_name) @output_data) .)))))))))) @relay
          (#eq? @connect "fsockopen")
          (#eq? @spawn "proc_open")
          (#eq? @read_peer "fread")
          (#eq? @read_stdout "fread")
          (#eq? @write_stdin "fwrite")
          (#eq? @write_peer "fwrite")
          (#eq? @peer @source)
          (#eq? @peer @destination)
          (#eq? @pipes @input_pipes)
          (#eq? @pipes @output_pipes)
          (#eq? @incoming @input_data)
          (#eq? @outgoing @output_data)
          (#eq? @stdin "0")
          (#match? @stdout "^[12]$"))
