defaults:
  platforms: [windows, unix]
  for: [rust]
  crit: notable
  conf: 0.97

traits:
  - id: rust-child-stdin-write-all
    desc: Rust writes bytes to child stdin
    if:
      type: symbol
      kind: call
      regex: '\.stdin(\.[A-Za-z_]+)*\.write_all$'


  # The parser cannot follow mutation of the accumulator through the for/if
  # and child closure. Bind the read result, append receiver, upload buffer,
  # and child handle structurally; all chosen identifiers remain arbitrary.
  - id: rust-read-aggregate-to-child-stdin
    desc: Rust file aggregate written to child stdin
    size_max: 131072
    if:
      type: tree-sitter
      query: |
        (
          (function_item
            (block
              (expression_statement
                (for_expression
                  (block
                    (expression_statement
                      (if_expression
                        (let_condition
                          (tuple_struct_pattern
                            (identifier) @ok
                            (identifier) @read_value
                          )
                          (call_expression
                            (scoped_identifier
                              (identifier) @read
                            )
                          )
                        )
                        (block
                          (expression_statement
                            (call_expression
                              (field_expression
                                (identifier) @aggregate
                                (field_identifier) @append
                              )
                              (arguments
                                (reference_expression
                                  (call_expression
                                    (generic_function
                                      (field_expression
                                        (call_expression
                                          (field_expression
                                            (call_expression
                                              (field_expression
                                                (identifier) @append_value
                                                (field_identifier) @chars
                                              )
                                            )
                                            (field_identifier) @take
                                          )
                                        )
                                        (field_identifier) @collect
                                      )
                                    )
                                  )
                                )
                              )
                            )
                          )
                        )
                      )
                    )
                  )
                )
              )
              (expression_statement
                (if_expression
                  (block
                    (let_declaration
                      (call_expression
                        (arguments
                          (closure_expression
                            (closure_parameters
                              (mut_pattern
                                (identifier) @child
                              )
                            )
                            (block
                              (expression_statement
                                (call_expression
                                  (field_expression
                                    (call_expression
                                      (field_expression
                                        (call_expression
                                          (field_expression
                                            (call_expression
                                              (field_expression
                                                (field_expression
                                                  (identifier) @stdin_child
                                                  (field_identifier) @stdin
                                                )
                                                (field_identifier) @take_stdin
                                              )
                                            )
                                            (field_identifier) @unwrap
                                          )
                                        )
                                        (field_identifier) @write
                                      )
                                      (arguments
                                        (call_expression
                                          (field_expression
                                            (identifier) @upload_value
                                            (field_identifier) @bytes
                                          )
                                        )
                                      )
                                    )
                                  )
                                )
                              )
                            )
                          )
                        )
                      )
                    )
                  )
                )
              )
            )
          ) @flow
          (#eq? @ok "Ok")
          (#eq? @read "read_to_string")
          (#eq? @append "push_str")
          (#eq? @chars "chars")
          (#eq? @take "take")
          (#eq? @collect "collect")
          (#eq? @stdin "stdin")
          (#eq? @take_stdin "take")
          (#eq? @unwrap "unwrap")
          (#eq? @write "write_all")
          (#eq? @bytes "as_bytes")
          (#eq? @read_value @append_value)
          (#eq? @aggregate @upload_value)
          (#eq? @child @stdin_child)
        )
