# Evidence-specific placement; matching does not imply attacker intent.
composite_rules:
- platforms:
  - unix
  - windows
  for:
  - go
  id: go-tokenization-command-output-cooccurrence
  desc: Nearby Go tokenization and command output
  crit: notable
  conf: 0.92
  near_lines: 12
  all:
  - id: micro-behaviors/data/string/split::go-strings-fields
  - id: micro-behaviors/process/create/subprocess::go-exec-command-call
  - id: micro-behaviors/process/fd/stdio::go-command-output-capture
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: metadata/package/testing/harness/unit::go-test
  - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-source-path
  - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-distribution
defaults: {}
