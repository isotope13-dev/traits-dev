# The object name does not distinguish a file from a network/memory stream.
defaults:
  platforms: [windows, unix]
  for: [csharp, powershell]
  crit: notable
traits:
  - id: stream-object-write-call
    desc: Calls Write on a .NET stream object
    conf: 0.93
    if:
      type: text
      regex: '(?i)\b(stream|fileStream)\s*\.\s*Write\s*\('
