# Stream copying is an I/O operation, separate from descriptor setup.
# Matchers and scopes preserved from process/fd/stdio/php.yaml.
defaults:
  platforms: [linux, macos, windows]
  for: [php]
  crit: notable
  conf: 0.92
traits:
  - id: php-stream-nonblocking
    desc: PHP disables blocking on a stream
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)^stream_set_blocking\s*\([^,]{1,120},\s*(false|0)\s*\)$'

  - id: php-stream-select
    desc: PHP waits for stream readiness
    if:
      type: symbol
      kind: call
      exact: stream_select

  - id: php-read-to-index-zero-stream
    desc: PHP read result feeds index-zero stream
    if:
      type: tree-sitter
      query: |
        ((compound_statement
          (expression_statement (assignment_expression
            left: (variable_name) @read_value
            right: (function_call_expression
              function: (name) @reader
              arguments: (arguments . (argument (variable_name))))))
          [
          (expression_statement (function_call_expression
            function: (name) @writer
            arguments: (arguments .
              (argument (subscript_expression (variable_name) (integer) @fd))
              . (argument (variable_name) @write_value))))
          (if_statement body: (compound_statement
            (expression_statement (function_call_expression
              function: (name) @writer
              arguments: (arguments .
                (argument (subscript_expression (variable_name) (integer) @fd))
                . (argument (variable_name) @write_value))))))
          ]) @relay
          (#match? @reader "(?i)^fread$")
          (#match? @writer "(?i)^fwrite$")
          (#eq? @fd "0")
          (#eq? @read_value @write_value))

  - id: php-index-one-two-read-to-stream
    desc: PHP index-one/two read feeds a stream
    if:
      type: tree-sitter
      query: |
        ((compound_statement
          (expression_statement (assignment_expression
            left: (variable_name) @read_value
            right: (function_call_expression
              function: (name) @reader
              arguments: (arguments .
                (argument (subscript_expression (variable_name) (integer) @fd))))))
          [
          (expression_statement (function_call_expression
            function: (name) @writer
            arguments: (arguments .
              (argument (variable_name))
              . (argument (variable_name) @write_value))))
          (if_statement body: (compound_statement
            (expression_statement (function_call_expression
              function: (name) @writer
              arguments: (arguments .
                (argument (variable_name))
                . (argument (variable_name) @write_value))))))
          ]) @relay
          (#match? @reader "(?i)^fread$")
          (#match? @writer "(?i)^fwrite$")
          (#match? @fd "^[12]$")
          (#eq? @read_value @write_value))

