defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: connect-callback-duplex-stdio-pipes
    desc: Connect callback bridges peer and child stdio
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression object: (identifier) @connected
            property: (property_identifier) @connect)
          arguments: (arguments
            [(arrow_function body: (statement_block
              (expression_statement (call_expression
                function: (member_expression object: (identifier) @peer_in
                  property: (property_identifier) @pipe_in)
                arguments: (arguments (member_expression object: (identifier) @child_in
                  property: (property_identifier) @stdin))))
              (expression_statement (call_expression
                function: (member_expression
                  object: (member_expression object: (identifier) @child_out
                    property: (property_identifier) @output)
                  property: (property_identifier) @pipe_out)
                arguments: (arguments (identifier) @peer_out)))))
             (function_expression body: (statement_block
              (expression_statement (call_expression
                function: (member_expression object: (identifier) @peer_in
                  property: (property_identifier) @pipe_in)
                arguments: (arguments (member_expression object: (identifier) @child_in
                  property: (property_identifier) @stdin))))
              (expression_statement (call_expression
                function: (member_expression
                  object: (member_expression object: (identifier) @child_out
                    property: (property_identifier) @output)
                  property: (property_identifier) @pipe_out)
                arguments: (arguments (identifier) @peer_out)))))])) @relay
          (#eq? @connect "connect") (#eq? @pipe_in "pipe") (#eq? @pipe_out "pipe")
          (#eq? @stdin "stdin") (#match? @output "^(stdout|stderr)$")
          (#eq? @connected @peer_in) (#eq? @peer_in @peer_out)
          (#eq? @child_in @child_out) (#not-eq? @peer_in @child_in))
composite_rules:
  - id: node-socket-connect-callback-stdio
    desc: Node socket connection callback bridges standard streams
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/socket/connect::node-net-socket-connect
      - id: connect-callback-duplex-stdio-pipes
