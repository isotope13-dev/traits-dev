defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.93

traits:
  - id: go-connection-stdio-redirect
    desc: Go child stdio uses a connection
    attack: T1059
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.(Stdin|Stdout|Stderr)\s*=\s*connection\b'
  - id: go-conn-stdio-redirect
    desc: Go child stdio uses a conn stream
    attack: T1059
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.(Stdin|Stdout|Stderr)\s*=\s*conn\b'
  - id: go-client-stdio-redirect
    desc: Go child stdio uses a client stream
    attack: T1059
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.(Stdin|Stdout|Stderr)\s*=\s*(client|socket)\b'

  - id: go-conn-write-call
    desc: Go writes to a conn stream
    crit: notable
    conf: 0.9
    attack: T1059
    if:
      type: symbol
      kind: call
      exact: conn.Write

  - id: go-connection-write-call
    desc: Go writes to a connection stream
    crit: notable
    conf: 0.9
    attack: T1059
    if:
      type: symbol
      kind: call
      exact: connection.Write

  - id: go-client-write-call
    desc: Go writes to a client stream
    crit: notable
    conf: 0.9
    attack: T1059
    if:
      type: symbol
      kind: call
      exact: client.Write

  - id: go-socket-write-call
    desc: Go writes to a socket stream
    crit: notable
    conf: 0.9
    attack: T1059
    if:
      type: symbol
      kind: call
      exact: socket.Write

  - id: go-tcp-conn-write-call
    desc: Go writes to a TCP connection stream
    crit: notable
    conf: 0.9
    attack: T1059
    if:
      type: symbol
      kind: call
      exact: tcpConn.Write

  - id: go-temp-conn-write-call
    desc: Go writes to a temporary connection stream
    crit: notable
    conf: 0.9
    attack: T1059
    if:
      type: symbol
      kind: call
      exact: tempConn.Write

  - id: go-stdin-read-call
    desc: Go reads bytes from stdin
    crit: notable
    conf: 0.9
    attack: T1059
    if:
      type: symbol
      kind: call
      exact: os.Stdin.Read

composite_rules:
  - id: go-network-stdio-redirect
    desc: Go child stdio uses a network stream
    crit: notable
    conf: 0.95
    any:
      - id: go-connection-stdio-redirect
      - id: go-conn-stdio-redirect
      - id: go-client-stdio-redirect

  - id: go-terminal-network-bridge
    desc: Go bridges terminal input and network output
    crit: notable
    conf: 0.94
    attack: T1059
    all:
      - id: micro-behaviors/fs/file/copy::io-copy
      - id: go-stdin-read-call
    any:
      - id: go-conn-write-call
      - id: go-connection-write-call
      - id: go-client-write-call
      - id: go-socket-write-call
      - id: go-tcp-conn-write-call
      - id: go-temp-conn-write-call
