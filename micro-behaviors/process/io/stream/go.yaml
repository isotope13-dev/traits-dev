# Co-occurring operations do not establish the direction of data flow.
defaults:
  platforms:
  - windows
  - unix
  for:
  - go
  crit: notable
  conf: 0.93
traits:
- id: go-stdin-read-call
  desc: Go reads bytes from stdin
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: os.Stdin.Read
- id: go-write-method-call
  conf: 0.65
  crit: notable
  desc: Go Write/WriteAt method call
  # A method name alone does not identify a file, socket, or process
  # channel. Objective composites add the surrounding operation and target.
  if:
    type: symbol
    kind: call
    regex: '\.Write(At)?$'

composite_rules:
- id: go-stdin-copy-and-send
  desc: Go reads stdin, copies data, and sends
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/data/buffer/transfer::go-io-copy
  - id: go-stdin-read-call
  any:
  - id: micro-behaviors/communications/socket/send
