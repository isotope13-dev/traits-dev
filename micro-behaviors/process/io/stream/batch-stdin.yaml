defaults:
  crit: notable
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-echo-variable-to-command-stdin
    desc: Batch pipes a variable into command stdin
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\s*echo\s+%+\w+%+\s*\|\s*"?%\w+%"?\s[^\r\n]{0,80}\s-\s*$'

  - id: wsh-exec-stdin-write-close
    desc: Writes to and closes WSH StdIn stream
    for: [javascript, vbs]
    conf: 0.95
    if:
      type: text
      regex: '(?is)\.StdIn\.Write(Line)?\s*\([\s\S]{0,240}\.StdIn\.Close\s*\('
