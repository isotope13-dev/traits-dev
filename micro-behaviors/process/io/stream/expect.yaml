defaults:
  platforms: [windows, unix]
  for: [scripts]
  crit: notable
  conf: 0.92

traits:
  - id: expect-pty-output-suppression
    desc: Expect script suppresses terminal output
    if:
      type: text
      regex: 'log_user\s+0'

  - id: expect-pty-input-send
    desc: Expect script sends scripted PTY input
    if:
      type: text
      regex: 'send\s+--'
