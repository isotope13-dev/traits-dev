defaults:
  platforms: [windows, unix]
  for: [scripts]
  crit: notable
  conf: 0.92

traits:
  - id: expect-pty-output-suppression
    desc: Expect script suppresses terminal output
    if:
      type: text
      regex: 'log_user\s+0'

  # `send` must sit at a Tcl command position — line start or just after a
  # `{`/`;` (the `expect "x" { send -- "y" }` idiom). An unanchored `send\s+--`
  # matched any hyphenated command taking a long option: `dbus-send --system`
  # in a Deepin desktop boot-sound script, `notify-send --urgency=...`.
  - id: expect-pty-input-send
    desc: Expect script sends scripted PTY input
    if:
      type: text
      regex: '(?m)(^[ \t]*|[{;]\s*)send\s+--'
