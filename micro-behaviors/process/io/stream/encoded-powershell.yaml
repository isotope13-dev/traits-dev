defaults:
  platforms: [windows, unix]
  for: [vbs, batch, powershell, javascript, python, typescript, csharp, html]
  crit: notable
traits:
  - id: encoded-powershell-bytes-stream-write
    desc: Decoded string bytes near stream write
    conf: 0.93
    if:
      type: encoded
      regex: '(?is)\.GetBytes\(.{0,100}\.Write\('
  - id: encoded-powershell-buffer-stream-read
    desc: Decoded stream read fills a byte buffer
    conf: 0.93
    if:
      type: encoded
      regex: '(?is)\.Read\(\s*\$[A-Za-z_]\w{0,63}\s*,\s*0\s*,\s*\$[A-Za-z_]\w{0,63}\.Length\s*\)'
