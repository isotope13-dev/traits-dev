defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-conditional-recv-or-fd-read
    desc: Python selects between recv and descriptor read
    conf: 0.96
    if:
      type: text
      regex: '\.recv\([^)]{1,40}\) if .{1,80} else os\.read\('

  - id: python-peer-or-stdin-buffer-write
    desc: Branch writes buffer to stdin or peer
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((if_statement
          condition: (comparison_operator (identifier) @source "is" (identifier) @peer)
          consequence: (block
            (expression_statement (call
              function: (attribute
                object: (attribute object: (identifier) @child attribute: (identifier) @stdin)
                attribute: (identifier) @write)
              arguments: (argument_list (identifier) @input))))
          alternative: (else_clause body: (block
            (expression_statement (call
              function: (attribute object: (identifier) @destination attribute: (identifier) @send)
              arguments: (argument_list (identifier) @output)))))) @relay
          (#eq? @stdin "stdin")
          (#eq? @write "write")
          (#eq? @send "sendall")
          (#eq? @peer @destination)
          (#eq? @input @output))
