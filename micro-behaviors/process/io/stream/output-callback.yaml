defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: child-output-callback-writes-peer
    desc: Child output callback forwards data to peer
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression
            object: (member_expression property: (property_identifier) @stream)
            property: (property_identifier) @on)
          arguments: (arguments (string) @event
            (_ [(identifier) @input (formal_parameters . (identifier) @input)]
              body: (statement_block
                [(expression_statement (call_expression
                   function: (member_expression object: (identifier) @peer
                     property: (property_identifier) @write)
                   arguments: (arguments . (identifier) @output)))
                 (if_statement consequence: (statement_block
                   (expression_statement (call_expression
                     function: (member_expression object: (identifier) @peer
                       property: (property_identifier) @write)
                     arguments: (arguments . (identifier) @output)))))]))))
          (#match? @stream "^(stdout|stderr)$") (#eq? @on "on")
          (#match? @event "^['\"]data['\"]$") (#eq? @write "write")
          (#eq? @input @output))
