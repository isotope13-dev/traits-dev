defaults:
  platforms: [windows, unix]
  for: [php]
  crit: notable
traits:
  - id: php-echo-statement
    desc: Emits data with a PHP echo statement
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      node: echo_statement
      substr: echo
  - id: php-print-r-variable
    desc: Dumps a variable with PHP print_r
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: print_r
      arg:
        kind: identifier

