defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: python-read-result-to-stream-write
    desc: Writes a read result to a stream
    if:
      type: symbol
      kind: call
      regex: '\.write$'
      arg:
        index: 0
        from:
          call: '\.read$'
