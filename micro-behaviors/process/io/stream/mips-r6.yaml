defaults:
  platforms: [linux]
  for: [elf]
  arch: [mips]
  crit: notable
  conf: 0.98
traits:
  - id: mips-r6-record-body-descriptor-write
    desc: MIPS R6 record-body descriptor write
    if:
      type: hex
      section: .text
      # Load output fd; buffer += 1; length -= 1; call write(fd,buffer,length).
      # Address, frame offsets and GOT entry vary across builds.
      pattern: '?? ?? 02 3C ?? ?? 44 8C ?? ?? C2 27 01 00 42 24 ?? ?? C3 8F FF FF 63 24 25 30 60 00 25 28 40 00 ?? ?? 82 8F 25 C8 40 00 00 00 19 F8'
