# A write method does not establish a disk destination: stdout and BytesIO
# have the same API. Keep these observations outside file-write selectors.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: baseline
traits:
  - id: python-write-method-call
    desc: Python write method call
    conf: 0.5
    if:
      type: symbol
      kind: call
      regex: '\.write(_bytes|_text)?$'
  - id: python-named-stream-write
    desc: Python stream-named write call text
    conf: 0.78
    if:
      type: text
      regex: '\b(stream|stdout|stderr|out)\.write\('
  - id: python-response-read-to-write
    desc: Writes a response-named stream's read result
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '\.write$'
      arg:
        index: 0
        from:
          call: '^(response|resp|r)\.read$'
composite_rules:
  - id: python-file-or-stream-write
    desc: Python file or stream write observation
    conf: 0.78
    any:
      - id: micro-behaviors/fs/write/file/handle::py-file-write-call
      - id: python-named-stream-write
      - id: micro-behaviors/fs/write/file/handle::py-log-write-call
      - id: python-write-method-call
