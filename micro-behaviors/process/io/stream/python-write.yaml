# Stream-named writes and response-read transfers. Generic write-method
# dispatch lives in data/control-flow/dispatch; its receiver is unknown.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: baseline
traits:
  - id: python-named-stream-write
    desc: Python stream-named write call text
    conf: 0.78
    if:
      type: text
      regex: '\b(stream|stdout|stderr|out)\.write\('
  - id: python-response-read-to-write
    desc: Writes a response-named stream's read result
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '\.write$'
      arg:
        index: 0
        from:
          call: '^(response|resp|r)\.read$'
