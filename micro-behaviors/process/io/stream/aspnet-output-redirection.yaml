defaults:
  platforms: [windows]
  for: [asp]
  crit: notable
  conf: 0.96
traits:
  - id: aspnet-standard-output-redirection
    desc: ASP.NET enables standard output redirection
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)RedirectStandardOutput\s*=\s*true'
  - id: aspnet-sout-read-to-end
    desc: ASP.NET reads sOut stream to its end
    if:
      type: text
      exclude_html_comments: true
      regex: '\bsOut\.ReadToEnd\s*\('
composite_rules:
  - id: aspnet-output-redirect-or-read
    desc: ASP.NET output redirection or sOut stream read
    any:
      - id: aspnet-standard-output-redirection
      - id: aspnet-sout-read-to-end
