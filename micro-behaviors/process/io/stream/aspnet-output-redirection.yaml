defaults:
  platforms: [windows]
  for: [asp]
  crit: notable
  conf: 0.96
traits:
  - id: aspnet-sout-read-to-end
    desc: ASP.NET reads sOut stream to its end
    if:
      type: text
      exclude_html_comments: true
      regex: '\bsOut\.ReadToEnd\s*\('
composite_rules:
  - id: aspnet-output-redirect-or-read
    desc: ASP.NET output redirection or sOut stream read
    any:
      - id: micro-behaviors/process/fd/stdio::dotnet-standard-output-redirection
      - id: aspnet-sout-read-to-end
