defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: echo-identifier-literal-pipeline-fragment
    desc: Identifier literal echoed into pipeline
    crit: component
    conf: 0.9
    platforms: [unix]
    if:
      type: text
      regex: "echo\\s+['\"]\\{?[A-Za-z_][A-Za-z0-9_]*\\}?['\"]\\s*\\|"
