# Both directions require the same peer and child names in a shared syntax node.
# Separate statements and comma sequences may appear in either order.
# Endpoint names alone do not prove network or process types.
defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
traits:
- id: node-duplex-stdio-pipe-pair
  desc: Pairs peer pipes with standard streams
  crit: notable
  conf: 0.95
  if:
    type: tree-sitter
    query: |
      ((_
      (expression_statement
        (call_expression
          function: (member_expression
            object: (identifier) @peer_in
            property: (property_identifier) @pipe_in)
          arguments: (arguments
            (member_expression
              object: (identifier) @child_in
              property: (property_identifier) @stdin))))
      (expression_statement
        (call_expression
          function: (member_expression
            object: (member_expression
              object: (identifier) @child_out
              property: (property_identifier) @output)
            property: (property_identifier) @pipe_out)
          arguments: (arguments (identifier) @peer_out)))
      ) @relay
      (#eq? @pipe_in "pipe")
      (#eq? @pipe_out "pipe")
      (#eq? @stdin "stdin")
      (#match? @output "^(stdout|stderr)$")
      (#eq? @peer_in @peer_out)
      (#eq? @child_in @child_out)
      (#not-eq? @peer_in @child_in)
      )

      ((_
      (expression_statement
        (call_expression
          function: (member_expression
            object: (member_expression
              object: (identifier) @child_out
              property: (property_identifier) @output)
            property: (property_identifier) @pipe_out)
          arguments: (arguments (identifier) @peer_out)))
      (expression_statement
        (call_expression
          function: (member_expression
            object: (identifier) @peer_in
            property: (property_identifier) @pipe_in)
          arguments: (arguments
            (member_expression
              object: (identifier) @child_in
              property: (property_identifier) @stdin))))
      ) @relay
      (#eq? @pipe_in "pipe")
      (#eq? @pipe_out "pipe")
      (#eq? @stdin "stdin")
      (#match? @output "^(stdout|stderr)$")
      (#eq? @peer_in @peer_out)
      (#eq? @child_in @child_out)
      (#not-eq? @peer_in @child_in)
      )

      ((_
      (call_expression
          function: (member_expression
            object: (identifier) @peer_in
            property: (property_identifier) @pipe_in)
          arguments: (arguments
            (member_expression
              object: (identifier) @child_in
              property: (property_identifier) @stdin)))
      (call_expression
          function: (member_expression
            object: (member_expression
              object: (identifier) @child_out
              property: (property_identifier) @output)
            property: (property_identifier) @pipe_out)
          arguments: (arguments (identifier) @peer_out))
      ) @relay
      (#eq? @pipe_in "pipe")
      (#eq? @pipe_out "pipe")
      (#eq? @stdin "stdin")
      (#match? @output "^(stdout|stderr)$")
      (#eq? @peer_in @peer_out)
      (#eq? @child_in @child_out)
      (#not-eq? @peer_in @child_in)
      )

      ((_
      (call_expression
          function: (member_expression
            object: (member_expression
              object: (identifier) @child_out
              property: (property_identifier) @output)
            property: (property_identifier) @pipe_out)
          arguments: (arguments (identifier) @peer_out))
      (call_expression
          function: (member_expression
            object: (identifier) @peer_in
            property: (property_identifier) @pipe_in)
          arguments: (arguments
            (member_expression
              object: (identifier) @child_in
              property: (property_identifier) @stdin)))
      ) @relay
      (#eq? @pipe_in "pipe")
      (#eq? @pipe_out "pipe")
      (#eq? @stdin "stdin")
      (#match? @output "^(stdout|stderr)$")
      (#eq? @peer_in @peer_out)
      (#eq? @child_in @child_out)
      (#not-eq? @peer_in @child_in)
      )
