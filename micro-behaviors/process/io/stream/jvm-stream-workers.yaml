# Stream operations alone do not establish socket or shell relay semantics.
defaults:
  for:
  - java
  - groovy
  - kotlin
  - scala
  - html
  - javascript
  - python
  - vbs
  platforms:
  - linux
  - macos
  - windows
traits:
- id: inputstream-property-assignment
  desc: Assigns an inputStream property
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (p|process)\.inputStream\s*=\s*(s|sock|client)
- id: input-output-stream-workers
  desc: Starts two input/output stream workers
  crit: notable
  conf: 0.97
  count_min: 2
  if:
    type: text
    regex: \w+\(\w+\.getInputStream\(\),\s*\w+\.getOutputStream\(\)\)\.start\(\)
