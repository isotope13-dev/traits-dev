# Bind the helper's spawn argument, Node's process receiver, dash argv,
# returned child and subsequent stream input in one syntactic block.
# Computed property names remain unresolved; the composite adds packing.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: helper-spawn-dash-computed-stream-input
    desc: Spawn helper feeds dash-argv child stream
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator
              name: (identifier) @child
              value: (call_expression
                arguments: (arguments
                  (identifier) @spawn
                  (subscript_expression object: (identifier) @process)
                  (array (string) @dash)
                  (object)))))
          (expression_statement
            (call_expression
              function: (subscript_expression
                object: (subscript_expression object: (identifier) @input_child))
              arguments: (arguments (identifier))))
          (expression_statement
            (call_expression
              function: (subscript_expression object: (identifier) @release_child)
              arguments: (arguments)))) @launch
          (#eq? @spawn "spawn")
          (#eq? @process "process")
          (#eq? @child @input_child)
          (#eq? @child @release_child)
          (#match? @dash "^['\"](-|\\\\x2[dD])['\"]$"))
