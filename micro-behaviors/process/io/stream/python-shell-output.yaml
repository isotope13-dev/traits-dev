defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, data]
  crit: notable
traits:
  - id: python-os-popen-read
    desc: Reads Python shell-command output stream
    conf: 0.98
    if:
      type: text
      # Include embedded UDF bodies; a local pipe read alone establishes
      # neither a return through SQL nor transfer to a remote destination.
      regex: '\bos\s*\.\s*popen\s*\([^()\r\n]{1,200}\)\s*\.\s*read\s*\('
