defaults:
  platforms: [windows]
  for: [powershell, batch]
  crit: notable
traits:
  - id: powershell-tcpclient-stream
    desc: PowerShell TcpClient stream acquisition
    conf: 0.97
    if:
      type: text
      # Both canonical constructions (New-Object and the PS5+ [Type]::new())
      # spell the same .NET type, so the type beside its GetStream call is
      # the acquisition evidence; a New-Object prefix missed the latter.
      regex: '(?i)Net\.Sockets\.TCPClient[\s\S]{0,500}\.GetStream\s*\(\s*\)'
