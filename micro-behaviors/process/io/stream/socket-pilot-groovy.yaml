# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - groovy
  platforms:
  - linux
  - macos
  - windows
  crit: notable
  conf: 0.93
traits:
- id: groovy-consume-process-output-socket
  desc: Copies child output to an output stream
  if:
    type: text
    regex: \.consumeProcessOutput\s*\(\s*[a-zA-Z_]\w*\.outputStream
