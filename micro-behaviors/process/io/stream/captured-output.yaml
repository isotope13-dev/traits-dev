defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, rust]
  crit: notable
  conf: 0.96

traits:
  - id: mapped-stdout-result-field
    desc: Maps captured process stdout to field
    if:
      type: text
      regex: '["'']stdout["'']\s*:\s*[A-Za-z_]\w*\.stdout'

  - id: mapped-stderr-result-field
    desc: Maps captured process stderr to field
    if:
      type: text
      regex: '["'']stderr["'']\s*:\s*[A-Za-z_]\w*\.stderr'

composite_rules:
  - id: mapped-stdout-stderr-result-fields
    desc: Maps captured process streams to fields
    conf: 0.97
    near_bytes: 320
    all:
      - id: mapped-stdout-result-field
      - id: mapped-stderr-result-field
