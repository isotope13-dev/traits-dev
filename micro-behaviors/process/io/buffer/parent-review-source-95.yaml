traits:
- platforms:
  - linux
  - macos
  - windows
  for:
  - c
  - cpp
  - objc
  crit: notable
  conf: 0.88
  id: native-looped-write-call
  desc: Native loop contains a descriptor write call
  if:
    type: text
    regex: for *\([^)]{0,40}\)[\s\S]{0,40}\bwrite\([^,()]{1,24},[^,()]{1,24},
  unless:
  - id: metadata/lang/compiler/systems::mercury-source
