defaults:
  platforms: [windows, unix]
  for: [java]
  crit: notable
  conf: 0.92
traits:
  - id: java-thread-enumeration-call
    desc: Java Thread.enumerate call
    if:
      type: text
      regex: '\bThread\s*\.\s*enumerate\s*\('
  - id: java-thread-group-enumeration-chain
    desc: Java thread-group enumeration call chain
    if:
      type: text
      regex: 'getThreadGroup\s*\(\s*\)\s*\.\s*enumerate\s*\('
composite_rules:
  - id: enumerate-dup
    desc: Java thread enumeration API context
    near_bytes: 192
    any:
      - id: java-thread-enumeration-call
      - id: java-thread-group-enumeration-chain
      - id: thread-group-enumeration-context
  - id: thread-group-enumeration-context
    desc: Thread-group access and recursive enumeration
    near_bytes: 192
    all:
      - id: micro-behaviors/process/thread/group::get-group
      - id: micro-behaviors/data/collection/array::java-recursive-enumeration-call
