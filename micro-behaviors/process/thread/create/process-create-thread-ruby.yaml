defaults:
  platforms: [windows, unix]
traits:
  - id: thread-loop-sleep
    desc: Background thread with loop and sleep
    crit: notable
    conf: 0.9
    for: [ruby]
    if:
      type: text
      exclude_comments: true
      regex: 'Thread\.new\s*(\{|do\b)\s*loop\s*(\{|do\b)[\s\S]{0,80}?\bsleep\b'
