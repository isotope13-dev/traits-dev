# Python threads started in one chained expression. Neutral: one-shot
# background workers are written this way. Loop, target and placement
# context decide what the spawn means.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  # Constructed and started in one expression, so no handle is kept and
  # nothing can ever join it. (Moved from objectives/impact/dos/thread:
  # the matcher establishes no denial of service.)
  - id: thread-chained-start-call
    desc: Thread constructed and started in one call
    conf: 0.9
    if:
      type: text
      regex: 'Thread\(.{0,60}\)\.start\(\)'
  # The chained start sits at column 0, i.e. in module-level code, so the
  # thread begins when the module is imported rather than when a caller
  # invokes anything.
  - id: module-level-thread-start
    desc: Thread started at module import time
    conf: 0.9
    if:
      type: text
      regex: '(?m)^threading\.Thread\([^)]{0,80}\)\.start\(\)'
