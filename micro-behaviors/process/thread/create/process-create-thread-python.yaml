# Native thread creation reached through Python's ctypes bridge.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1055.001

traits:
  - id: python-ctypes-create-thread
    desc: ctypes starts a Windows native thread
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(kernel32\.)?CreateThread$|^(ctypes\.)?windll\.kernel32\.CreateThread$'
