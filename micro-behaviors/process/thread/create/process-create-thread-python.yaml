# Native thread creation reached through Python's ctypes bridge.
defaults:
  platforms: [windows]
  for: [python]
  attack: T1055.001

traits:
  # Any dotted receiver matches: the universal ctypes idiom aliases the
  # library handle (`k32 = ctypes.windll.kernel32; k32.CreateThread(...)`),
  # so requiring a literal `ctypes.windll.kernel32` receiver misses the
  # standard spelling. Any Python call site naming CreateThread still
  # establishes native thread creation, including pywin32's wrapper.
  - id: python-ctypes-create-thread
    desc: Calls CreateThread from Python
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^([A-Za-z_]\w*\.)*CreateThread$'
