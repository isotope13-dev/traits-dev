defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-copied-rwx-buffer-thread
    desc: x86 copied RWX buffer becomes thread start
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # VirtualAlloc result -> ESI; memcpy destination -> ESI;
      # CreateThread start and argument both -> ESI. Addresses and sizes vary.
      pattern: '6A 40 68 00 30 00 00 68 ?? ?? ?? ?? 6A 00 8B F9 FF 15 ?? ?? ?? ?? 8B F0 85 F6 75 ?? 5F 5E C3 68 ?? ?? ?? ?? 8D 87 ?? ?? ?? ?? 50 56 E8 ?? ?? ?? ?? 83 C4 0C 6A 00 6A 00 56 56 6A 00 6A 00 FF 15 ?? ?? ?? ??'
