defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go]
traits:
  - id: go-init-with-goroutine
    desc: Go init launches goroutine
    conf: 0.85
    if:
      type: text
      regex: 'func\s+init\s*\(\s*\)\s*\{[\s\S]{0,400}\bgo\s+(func\s*\(|[A-Za-z_][A-Za-z0-9_]*\s*\()'
  - id: go-goroutine-launch-call
    desc: Go goroutine launch call
    conf: 0.75
    if:
      type: tree-sitter
      language: go
      query: '(go_statement (call_expression) @launch)'
  - id: go-goroutine-connect-call
    desc: Go goroutine launches connect call
    conf: 0.9
    if:
      type: text
      regex: '\bgo\s+([A-Za-z_]\w*\.)?connect\s*\('
  - id: go-goroutine-dial-call
    desc: Go goroutine launches dial call
    conf: 0.9
    if:
      type: text
      regex: '\bgo\s+([A-Za-z_]\w*\.)?dial\s*\('
  - id: go-init-body-net-dial
    desc: Go init body calls net.Dial
    conf: 0.92
    if:
      type: text
      regex: 'func\s+init\s*\(\s*\)\s*\{.{0,600}net\.Dial\s*\('
  - id: go-init-body-dial-method
    desc: Go init body calls a Dial method
    conf: 0.9
    if:
      type: text
      regex: 'func\s+init\s*\(\s*\)\s*\{.{0,600}\.Dial(Context)?\s*\('
  - id: go-init-body-http-request
    desc: Go init body issues HTTP client call
    conf: 0.9
    if:
      type: text
      regex: 'func\s+init\s*\(\s*\)\s*\{.{0,600}http\.(Get|Post|Head|NewRequest)\s*\('
