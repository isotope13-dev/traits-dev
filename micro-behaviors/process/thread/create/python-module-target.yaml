defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-thread-worker-loads-module
    desc: Daemon thread targets dynamic module code
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (function_definition
            name: (identifier) @worker
            body: (block
              (expression_statement
                (call function: (attribute attribute: (identifier) @execute)))))
          (expression_statement
            (call function: (attribute
              object: (call
                function: (_) @constructor
                arguments: (argument_list
                  (keyword_argument name: (identifier) @key
                    value: (identifier) @target)
                  (keyword_argument name: (identifier) @daemon value: (true))))
              attribute: (identifier) @start))))
          (#eq? @execute "exec_module")
          (#match? @constructor "(^|\\.)Thread$")
          (#eq? @key "target")
          (#eq? @daemon "daemon")
          (#eq? @worker @target)
          (#eq? @start "start"))
        ((module
          (expression_statement
            (call
              function: (attribute attribute: (identifier) @execute)
              arguments: (argument_list . (identifier) @loaded .)))
          (expression_statement
            (call function: (attribute
              object: (call
                function: (_) @constructor
                arguments: (argument_list
                  (keyword_argument name: (identifier) @key
                    value: (attribute object: (identifier) @target))
                  (keyword_argument name: (identifier) @daemon value: (true))))
              attribute: (identifier) @start))))
          (#eq? @execute "exec_module")
          (#match? @constructor "(^|\\.)Thread$")
          (#eq? @key "target")
          (#eq? @daemon "daemon")
          (#eq? @loaded @target)
          (#eq? @start "start"))
        ((module
          (function_definition
            name: (identifier) @worker
            body: (block
              (expression_statement
                (call function: (attribute attribute: (identifier) @execute)))))
          (function_definition
            name: (identifier) @starter
            body: (block
              (expression_statement
                (call function: (attribute
                  object: (call
                    function: (_) @constructor
                    arguments: (argument_list
                      (keyword_argument name: (identifier) @key
                        value: (identifier) @target)
                      (keyword_argument name: (identifier) @daemon value: (true))))
                  attribute: (identifier) @start)))))
          (expression_statement (call function: (identifier) @invoke)))
          (#eq? @execute "exec_module")
          (#match? @constructor "(^|\\.)Thread$")
          (#eq? @key "target")
          (#eq? @daemon "daemon")
          (#eq? @worker @target)
          (#eq? @starter @invoke)
          (#eq? @start "start"))
        ((module
          (function_definition
            name: (identifier) @worker
            body: (block
              (expression_statement
                (call function: (attribute attribute: (identifier) @execute)))))
          (expression_statement
            (assignment left: (identifier) @thread
              right: (call
                function: (_) @constructor
                arguments: (argument_list
                  (keyword_argument name: (identifier) @key
                    value: (identifier) @target)
                  (keyword_argument name: (identifier) @daemon value: (true))))))
          (expression_statement
            (call function: (attribute object: (identifier) @receiver
              attribute: (identifier) @start))))
          (#eq? @execute "exec_module")
          (#match? @constructor "(^|\\.)Thread$")
          (#eq? @key "target")
          (#eq? @daemon "daemon")
          (#eq? @worker @target)
          (#eq? @thread @receiver)
          (#eq? @start "start"))
