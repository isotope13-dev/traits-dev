# Dynamic Windows API dispatch table thread creation in C/C++ or text backups.
defaults:
  platforms: [windows]
  for: [c, cpp, text]

traits:
  - id: api-table-create-thread
    desc: Calls CreateThread via API dispatch table
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b[a-zA-Z_]\w{0,16}(\.|->)pCreateThread\s*\('
