defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: thread-creation-with-unwind-api-references
    desc: Thread creation and unwind API references
    crit: notable
    conf: 0.80
    all:
      - id: micro-behaviors/process/thread/create::create-thread
      - id: micro-behaviors/os/exception/register::rtl-add-function-table
      - id: micro-behaviors/os/exception/handler::virtual-unwind

  # Preserve the former async-directory selection for its message-queue consumer.
  - id: thread-creation-with-supporting-api-set
    desc: Thread creation with message, memory or unwind APIs
    crit: notable
    conf: 0.80
    any:
      - id: thread-creation-with-message-api-references
      - id: thread-creation-memory-context-api-references
      - id: thread-creation-with-unwind-api-references

  - id: thread-creation-with-message-api-references
    desc: Thread creation and message-queue API references
    crit: notable
    conf: 0.80
    all:
      - id: create-thread
      - id: micro-behaviors/os/message/queue::peek-message-a

  - id: thread-creation-memory-context-api-references
    desc: Thread, allocation and context-capture API references
    crit: notable
    conf: 0.75
    all:
      - id: create-thread
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/os/exception/handler::capture-context
