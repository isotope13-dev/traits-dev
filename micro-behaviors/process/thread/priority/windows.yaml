defaults:
  crit: notable
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: set-priority-class
    desc: Raise process priority class
    conf: 0.85
    if:
      type: symbol
      exact: "SetPriorityClass"
  - id: set-thread-priority
    desc: SetThreadPriority API symbol
    conf: 0.85
    if:
      type: symbol
      exact: "SetThreadPriority"
composite_rules:
  - id: priority-adjustment
    desc: Process or thread priority API reference
    conf: 0.88
    any:
      - id: set-priority-class
      - id: set-thread-priority
