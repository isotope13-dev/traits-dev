defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
traits:
  - id: create-fiber
    desc: Create a fiber object
    if:
      type: symbol
      exact: CreateFiber
  - id: create-fiber-api-string
    desc: CreateFiber API name in binary text
    if:
      type: text
      substr: CreateFiber
      section: ".rdata"
  - id: switch-to-fiber
    desc: Switch to a fiber object
    if:
      type: symbol
      exact: SwitchToFiber
  - id: convert-thread-to-fiber
    desc: Convert thread to fiber
    if:
      type: symbol
      exact: ConvertThreadToFiber

  - id: fiber-api-name-text
    desc: Names a Windows fiber API in text
    for: [pe, dll, csharp]
    conf: 0.84
    if:
      type: text
      # A bare `Fiber` word is React's reconciler and every coroutine library;
      # the loader evidence is the Win32 fiber API itself, spelled out in a
      # string pool or a C# P/Invoke declaration.
      regex: '\b(CreateFiber(Ex)?|ConvertThreadToFiber(Ex)?|SwitchToFiber)\b'
