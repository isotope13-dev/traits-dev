defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  - id: resume-thread-call
    desc: Thread-resume API call
    conf: 0.98
    # NtResumeThread/ZwResumeThread are the ntdll forms of ResumeThread.
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(Nt|Zw)?ResumeThread$'
