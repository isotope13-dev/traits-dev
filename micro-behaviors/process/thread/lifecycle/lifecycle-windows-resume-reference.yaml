defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.9

traits:
- id: resume-thread
  desc: ResumeThread named, not imported
  crit: notable
  conf: 0.9
  for: [pe, dll, c, cpp, powershell, batch, vbs, javascript, class]
  downgrade:
    # One reference, not six spellings of it: the debugpy directory already
    # carries the basename, source-path and package-text markers that were
    # inlined here (`attach.cpp` moved into its attach-helper trait), so the
    # extra legs only restated it.
    any:
    - id: well-known/tool/development/debug/debugpy
  if:
    type: text
    word: "ResumeThread"
  unless:
  # The symbol records the API being used; this also sees the name sitting in
  # data. Standing down there keeps one use from counting twice.
  - id: micro-behaviors/process/info/thread::resume-thread-import
  - id: metadata/lang/runtime::go-runtime-marker
  - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: well-known/game/mod::bedrockboot-preload-cpp-pdb
