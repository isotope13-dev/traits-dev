defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: go-lazyproc-thread-context-apis
    desc: Go LazyProc dispatch and thread-control APIs
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/os/api-resolution/manual::go-syscall-dynamic-api-dispatch
      - id: micro-behaviors/process/thread/lifecycle::suspend-thread-repeated-name
      - id: micro-behaviors/process/info/thread::resume-thread-import
      - id: micro-behaviors/process/info/thread::get-thread-context-import
      - id: micro-behaviors/process/info/thread::set-thread-context-import
    unless:
      - id: metadata/signature/verified/developer/
      - id: metadata/lang/compiler/aot::huge-runtime-function-count
      - id: micro-behaviors/communications/http/server/listener::listenandserve-call
    downgrade:
      any:
        - id: metadata/binary/resource/identity::pe-version-resource
