defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: suspend-thread-repeated-name
    desc: Repeated SuspendThread name references
    crit: notable
    conf: 0.9
    count_min: 3
    if:
      type: text
      exact: SuspendThread
    unless:
      - id: micro-behaviors/process/info/thread::suspend-thread-import
