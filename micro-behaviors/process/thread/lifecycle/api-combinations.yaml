defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable

composite_rules:
  - id: thread-control-pair-suspend-resume
    desc: Suspend plus resume thread
    conf: 0.8
    all:
      - id: micro-behaviors/process/inject/runtime/call::suspend-thread
      - id: micro-behaviors/process/info/thread::resume-thread-import

  - id: thread-control-apis-2of4
    desc: Two thread-control API references
    conf: 0.85
    any:
      - id: micro-behaviors/process/info/thread::thread-context-pair-suspend-get
      - id: micro-behaviors/process/info/thread::thread-context-pair-suspend-set
      - id: micro-behaviors/process/thread/lifecycle::thread-control-pair-suspend-resume
      - id: micro-behaviors/process/info/thread::thread-context-pair-get-set
      - id: micro-behaviors/process/info/thread::thread-context-pair-get-resume
      - id: micro-behaviors/process/info/thread::thread-context-pair-set-resume
    # Go's runtime supplies the read/write pair even in an empty program, so
    # the two-API grouping is just as routine as its constituent pair.
    downgrade:
      any:
        - id: metadata/lang/runtime::go-runtime-marker
        - id: metadata/lang/compiler/systems::go-pe-symtab

  - id: thread-control-apis-3of4
    desc: Three thread-control API references
    conf: 0.9
    any:
      - id: micro-behaviors/process/info/thread::thread-context-triple-no-suspend
      - id: micro-behaviors/process/info/thread::thread-context-triple-no-get
      - id: micro-behaviors/process/info/thread::thread-context-triple-no-set
      - id: micro-behaviors/process/info/thread::thread-context-triple-no-resume
