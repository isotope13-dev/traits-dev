# Dart's cross-isolate work runner.  `Isolate.run(fn)` hands a closure to a
# freshly spawned isolate; the SDK implements that handoff with the private
# `_RemoteRunner` class in `dart:isolate-patch/isolate_patch.dart`, whose
# `_remoteExecute` entry point is what the child isolate actually calls.
#
# "Remote" here means "another isolate in this process", not another host and
# not a shell: no network, no child process, no command string.  The AOT
# compiler keeps the qualified name in the snapshot's symbol table, so every
# Dart AOT binary that reaches Isolate.run carries this string -- dart-sass
# and the standalone `dart` runtime included.  That makes it a concurrency
# baseline for the Dart runtime rather than an execution signal on its own;
# composites that care about Dart/Flutter command dispatch reference it only
# as runtime context and take their intent from their other legs.
defaults:
  platforms: [macos, linux, windows]
  for: [binaries]
  crit: baseline
  conf: 0.9

traits:
  - id: dart-isolate-remote-runner
    desc: Dart isolate closure runner symbol
    mbc: C0038
    if:
      type: text
      substr: "_RemoteRunner._remoteExecute"
