defaults:
  platforms: [windows, linux, macos]
  for: [go]
traits:
  - id: pthread
    desc: pthread threading library
    crit: baseline
    conf: 0.5
    for: [elf, macho, c, cpp]
    if:
      type: symbol
      regex: pthread_create
  - id: goroutine
    desc: Go goroutine concurrency
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: goroutine\s+\d+|runtime\.goroutine
  - id: go-runtime-gomaxprocs-call
    desc: Go runtime GOMAXPROCS call
    crit: baseline
    conf: 0.75
    if:
      type: symbol
      kind: call
      exact: runtime.GOMAXPROCS
  - id: go-runtime-lock-osthread-call
    desc: Go runtime LockOSThread call
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: runtime.LockOSThread
  - id: python-multiprocessing-name
    desc: Python multiprocessing module name
    crit: baseline
    conf: 0.5
    for: [python]
    ref: sha256:98cf2b942c5daa7a4e2e32ed3a4cf83d1b8f86ae6868bfae35392621fca6b5a9
    if:
      type: string_literal
      substr: multiprocessing
  - id: rust-thread-spawn
    desc: Spawns a Rust OS thread
    crit: baseline
    conf: 0.75
    for: [rust]
    if:
      type: symbol
      kind: call
      regex: '(^|::)thread::spawn$'
  - id: go-goroutine-statement
    desc: Launches a Go goroutine
    crit: baseline
    conf: 0.75
    if:
      type: text
      regex: '\bgo\s+[A-Za-z_]\w*\s*\('
  - id: posix-barrier-sync
    desc: Synchronizes threads on POSIX barrier
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [elf, macho, c, cpp, rust, python, go]
    if:
      type: symbol
      regex: '(^|\.|::)(pthread_barrier_wait|pthread_barrier_init|Barrier)$'
composite_rules:
  - id: concurrent-worker-execution
    desc: Spawns or synchronizes worker threads
    crit: baseline
    conf: 0.8
    platforms: [windows, unix]
    for: [c, cpp, rust, go, python, elf, macho]
    any:
      - id: pthread
      - id: rust-thread-spawn
      - id: go-goroutine-statement
      - id: goroutine
      - id: micro-behaviors/process/thread/create::python-thread-create
      - id: posix-barrier-sync
