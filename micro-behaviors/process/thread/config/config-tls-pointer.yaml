defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: dense-x64-tls-array-access
    desc: Repeated x64 thread TLS-array pointer access
    crit: notable
    conf: 0.97
    arch: [x86-64]
    count_min: 16
    if:
      type: hex
      section: .text
      pattern: '65 (48|4C) 8B ?? 25 58 00 00 00'
