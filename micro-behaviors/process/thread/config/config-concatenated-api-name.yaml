# Adjacent API names lack word boundaries. The ordinary word-name
# matcher handles separated names; this variant covers concatenated data.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: concatenated-set-thread-context-api-name
  desc: Concatenated SetThreadContext API name
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: SetThreadContext[A-Za-z]
