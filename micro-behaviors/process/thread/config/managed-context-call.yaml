defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  # Wow64SetThreadContext and the ntdll Nt/ZwSetContextThread service write
  # the same register context as SetThreadContext.
  - id: managed-thread-context-write-call
    desc: Managed call to a thread-context write API
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)((Wow64)?SetThreadContext|(Nt|Zw)SetContextThread)$'
