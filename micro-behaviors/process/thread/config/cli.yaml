defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, c, cpp, rust, go, csharp, shell]
  size_max: 500000000
traits:
  - id: thread-count-cli-option
    desc: Numeric thread-count command-line option
    crit: notable
    conf: 0.88
    size_min: 0
    if:
      type: text
      regex: '(?i)(^|[\s])--?threads(=|\s+)[1-9][0-9]{0,2}\b'
    unless:
      - id: well-known/tool/development/chromium::gn-build-tool
