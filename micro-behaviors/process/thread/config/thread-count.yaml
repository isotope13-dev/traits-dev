defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries, python]
traits:
  - id: worker-thread-count-name
    desc: Numeric thread-count assignment text
    crit: notable
    conf: 0.78
    if:
      type: text
      regex: '(?i)(numThreads|num_threads|threadCount)[= ]\d+'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
