defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
- id: nt-set-context-thread-source
  desc: Calls NtSetContextThread in source
  crit: notable
  conf: 0.95
  for: [c, cpp, csharp, rust, go, python, powershell, javascript]
  if:
    type: symbol
    kind: call
    regex: '(^|\.)NtSetContextThread$'
