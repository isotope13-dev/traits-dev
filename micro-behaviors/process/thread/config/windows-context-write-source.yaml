defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, powershell]

composite_rules:
- id: thread-context-write-source
  desc: References Win32 or calls NT thread-context write API
  crit: notable
  conf: 0.95
  any:
    - id: micro-behaviors/process/info/thread::set-thread-context
    - id: micro-behaviors/process/info/thread::csharp-set-thread-context-reference
    - id: micro-behaviors/process/thread/config::nt-set-context-thread-source
