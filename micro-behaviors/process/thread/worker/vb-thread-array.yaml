# VB.NET assigning new worker threads into indexed array slots: the shape
# of a loop that starts N identical workers. Thread pools in ordinary apps
# do this too; it establishes fan-out, not what the workers do.
defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: vb-thread-array-worker-fanout
    desc: VB stores worker threads in an array
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b\w+\(\w+\)\s*=\s*New\s+Thread\(\s*AddressOf\s+\w+\s*\)'
