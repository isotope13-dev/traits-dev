# Node.js Worker Threads
# Detects worker_threads usage for parallel code execution
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: new-worker-require-resolve
    desc: Creates Worker from resolved module
    conf: 0.9
    if:
      type: text
      regex: 'new\s+Worker\s*\(\s*require\.resolve\s*\('

composite_rules:
  - id: new-worker-instance
    desc: Creates Node.js worker thread instance
    conf: 0.92
    all:
      - id: micro-behaviors/process/thread/worker::worker-constructor-call
    any:
      - id: micro-behaviors/process/thread/runtime::worker-threads-import
      - id: micro-behaviors/process/thread/runtime::worker-threads-require
    near_bytes: 8192
  - id: worker-eval-option
    desc: Node Worker near eval option
    conf: 0.95
    attack: T1059.007
    near_bytes: 8192
    all:
      - id: micro-behaviors/process/thread/worker::worker-constructor-call
      - id: metadata/lang/source/syntax/object::worker-eval-true-option
    any:
      - id: micro-behaviors/process/thread/runtime::worker-threads-import
      - id: micro-behaviors/process/thread/runtime::worker-threads-require
