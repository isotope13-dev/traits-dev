defaults:
  platforms: [windows, linux, macos, unix]
  for: [python]
composite_rules:
  - id: python-postinstall-documented-thread-clues
    desc: Postinstall-documented function and thread clues
    crit: suspicious
    conf: 0.93
    scope: file
    near_lines: 60
    all:
      - id: metadata/lang/source/declaration::python-post-install-hook-function
      - id: micro-behaviors/process/thread/create::python-thread-create
    any:
      - id: micro-behaviors/process/thread/create::python-nondaemon-thread-explicit
      - id: micro-behaviors/process/thread/create::python-daemon-thread
      - id: micro-behaviors/time/sleep/interval::python-sleep-1s-plus-arg
      - id: micro-behaviors/data/control-flow/error-handling/suppress::silent-exception-pass
