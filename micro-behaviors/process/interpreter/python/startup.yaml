defaults:
  conf: 0.95
  platforms: [windows, unix]
  for: [python]

traits:
  # A whole path literal references an interpreter startup surface; it does
  # not prove persistence. Anchoring also rejects fallback-extracted docstrings
  # whose parser section tag is missing in large source files.
  - id: usercustomize-path-literal
    desc: String literal names a Python usercustomize path
    crit: notable
    if:
      type: literal
      exclude_docstrings: true
      regex: '(?i)^[\w .:/\\~-]*[/\\]usercustomize\.py$'

  - id: usercustomize-startup-hook
    desc: Python usercustomize startup hook file
    crit: notable
    if:
      type: path
      basename: true
      exact: usercustomize.py

  # The syntactic half of every startup-import technique: a module-level
  # `import` line. A bare import shard says nothing on its own about what is
  # imported (universal in Python modules); startup-file composites join it
  # with a startup-file identity to express executable startup content.
  - id: module-import-statement
    desc: Top-level Python import statement line
    crit: baseline
    for: [python, shell, text]
    if:
      type: text
      # site.py executes only lines beginning with import at column zero;
      # indented imports and whitespace on a preceding line are not hooks.
      # Python module names are identifiers; protobuf imports quote a path.
      regex: '(?m)^import[ \t]+[A-Za-z_][A-Za-z0-9_]*\b'
  - id: python-addaudithook
    desc: Installs a Python audit hook
    crit: notable
    conf: 0.93
    for: [python, pyc]
    if:
      type: text
      substr: addaudithook
  - id: pth-path-config-file
    desc: Python .pth path configuration file
    for: [python, shell, text]
    crit: notable
    if:
      type: path
      basename: true
      regex: (?i)\.pth$
  - id: pth-filename-string-literal
    desc: String literal names a .pth file
    size_max: 131072
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["''][^"''\n]{0,48}\.pth["'']'
  - id: import-statement-string-literal
    desc: String literal holds an import statement
    size_max: 131072
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '=\s*["'']import\s+[A-Za-z_]\w*'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  # site.py imports sitecustomize/usercustomize by module name. A comparison
  # against that name is the same activation surface when the file was renamed.
  - id: python-site-hook-name-compare
    desc: Compares module name to site hook
    crit: notable
    conf: 0.9
    attack: T1546
    if:
      type: text
      regex: '__name__\s*==\s*[''"](site|user)customize[''"]'

  - id: sitecustomize-startup-hook
    desc: Python sitecustomize startup hook file
    # A filename identifies a startup hook but does not establish persistence;
    # hostile composites require execution or loading behavior.
    crit: notable
    conf: 0.95
    size_max: 131072
    attack: T1546
    downgrade:
      any:
      - id: well-known/tool/development/debug/debugpy
    if:
      type: path
      basename: true
      exact: sitecustomize.py
