defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: usercustomize-startup-hook
    desc: Python usercustomize startup hook file
    crit: notable
    conf: 0.95
    if:
      type: path
      basename: true
      exact: usercustomize.py

  # The syntactic half of every startup-import technique: a module-level
  # `import` line. A bare import shard says nothing on its own about what is
  # imported (universal in Python modules); startup-file composites join it
  # with a startup-file identity to express executable startup content.
  - id: module-import-statement
    desc: Top-level Python import statement line
    crit: baseline
    conf: 0.95
    for: [python, shell, text]
    if:
      type: text
      regex: '(?m)^\s*import[ \t]+'
