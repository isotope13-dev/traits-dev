# traits/micro-behaviors/execution/interpreter/python/dynamic.yaml
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: "T1059.006"
  mbc: "E1059"
traits:
  - id: eval-exec-decorator-expression
    desc: Python decorator invokes eval or exec
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?m)^\s*@(exec|eval)\s*\('

  - id: exec-after-file-read
    desc: Python exec after file read
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'read\(\)[\s\S]{0,500}exec\(\s*\w+,\s*\w+,\s*\w+\)'

  - id: exec-compiled-code
    desc: Python executes compiled code
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: exec(compile

  - id: compile-source-exec-mode
    desc: Python compiles source in exec mode
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'compile\s*\([^,\n]{1,120},\s*[^,\n]{1,120},\s*["'']exec["'']\s*\)'

  - id: eval-builtin
    desc: "Python eval() built-in function"
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: eval
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: well-known/tool/detection/security-scanner::code-pattern-catalog
      - id: well-known/tool/detection/security-scanner::python-taint-sink-map
      - id: well-known/tool/detection/agentskillmap/

  - id: exec-command-argument
    desc: Python exec() called with command variable
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        kind: identifier
        name: command

  # A mapping lookup passed directly to eval is an unsafe-evaluation
  # capability, but this atom alone does not establish a remote source.
  - id: eval-mapping-get
    desc: Python eval of mapping get result
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: "\\beval\\s*\\(\\s*[a-z_][A-Za-z0-9_]*\\s*\\.get\\s*\\([^)]{0,180},.{0,120}\\)\\s*\\)"
  - id: eval-constructed-expression
    desc: Python eval of a constructed expression string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\\beval\\s*\\([^()\\n]{0,180}\\+[^()\\n]{0,180}\\)'
  - id: eval-prefixed-configuration-expression
    desc: Evaluates prefixed Python expression
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'startswith\(\s*["'']eval%["'']\s*\)[\s\S]{0,240}\beval\s*\('
  - id: exec-builtin
    desc: Executes dynamic Python code with exec()
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: exec
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: well-known/tool/detection/security-remediation::compiled-remediation-catalog
      - id: well-known/tool/detection/security-scanner::code-pattern-catalog
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/agentskillmap/
      # A JSP page has no `jsp` file type in cleave and often lands on `python`;
      # its Java `exec(cmd)` helper is not the Python builtin.
      - id: metadata/lang/scripted::jsp-page-directive
  - id: exec-variable
    desc: Python exec() executes a variable value
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        kind: identifier
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/lang/scripted::jsp-page-directive
  - id: exec-variable-namespace
    desc: Python built-in exec() with explicit namespace
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      kind: call
      # Anchor at call start so string args (e.g. assertEqual('exec(foo, bar)'))
      # do not count. Method forms like Job.exec(...) also fail the ^exec guard.
      regex: '^exec\s*\(\s*[A-Za-z_]\w*\s*,\s*[A-Za-z_]\w*'

  - id: exec-generated-code
    desc: Python exec() of generated or compiled code
    crit: notable
    conf: 0.94
    if:
      type: text
      # Require compile(...) or an f-string opener — a bare `exec(foo` must not
      # match via the leading `f` of an identifier (AST dump assert fixtures).
      regex: '\bexec\s*\(\s*(compile\s*\(|[fF]["''])'
  - id: exec-open-read
    desc: Python exec() on file contents
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'exec\s*\(\s*open\s*\(.{1,160}\)\.read\s*\('
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: objectives/persistence/login/python-startup::pythonstartup-env

  - id: exec-file-read-namespace
    desc: Python exec() file contents into namespace
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'exec\s*\(\s*[A-Za-z_]\w*\.read\(\)\s*,\s*[A-Za-z_]\w+\s*\)'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: objectives/persistence/login/python-startup::pythonstartup-env
  - id: dunder-import-call
    desc: Python __import__ call
    crit: notable
    conf: 0.85
    if:
      type: tree-sitter
      kind: call
      regex: '\b__import__\s*\('
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - type: text
        regex: '__import__\(\s*[''"]pkgutil[''"]\s*\)\.extend_path'
      - type: text
        regex: '__import__\(\s*[''"]pkg_resources[''"]\s*\)\.declare_namespace'
      - id: well-known/tool/detection/security-scanner::code-pattern-catalog
  - id: dunder-import-string-call
    desc: Python imports named module dynamically
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: __import__
      arg:
        kind: string
  # zipimport is a normal Python runtime mechanism used by packaged
  # applications and libraries. It is a module-loading capability, not
  # static-analysis evasion; loader composites can still use this neutral fact
  # as one leg of their intent inference.
  - id: zipimporter-module-load
    desc: Python zipimporter loads module
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'zipimport(er)?[\s\S]{0,200}\.load_module|\.load_module[\s\S]{0,200}zipimport(er)?'
  # `inspect.getsource(fn)` hands back the text of a function the interpreter
  # already imported. Code that compiles THAT is patching itself at runtime --
  # the monkeypatching idiom ML training libraries use to rewrite trainer
  # methods (unsloth rewrites TRL's `compute_loss` this way). Nothing is
  # concealed: the source came from the running program, so it is on disk in
  # plain sight either way.
  - id: inspect-getsource-call
    desc: Reads a live object's source with inspect
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: inspect.getsource

  - id: compile-builtin
    desc: "Python compile() built-in function"
    crit: notable
    conf: 0.7
    if:
      type: symbol
      # `kind: call` is load-bearing: a bare `type: symbol` also matches the
      # `function` facts, so `def compile(self, id, params)` counted as a use
      # of the built-in. Compilers, template engines and regex wrappers all
      # define a method by that name — blueprint-compiler's LSP server has one
      # right next to its `decompile` handler. A call records the dotted target
      # for methods (`self.compile`), so the unqualified name is the built-in.
      kind: call
      exact: compile
    unless:
      - id: well-known/tool/detection/security-scanner::python-taint-sink-map
  - id: compile-exec-mode
    desc: Python compile() exec mode
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\bcompile\s*\([\s\S]{0,180}\bmode\s*=\s*["'']exec["'']'
  - id: compile-synthetic-filename
    desc: Python compile synthetic filename
    crit: baseline
    conf: 0.84
    if:
      type: text
      regex: '(^|[^.a-zA-Z0-9_])compile\(.{0,80}["'']<[A-Za-z0-9_]{4,}'
  - id: ipython-interactive-shell-import
    desc: Imports IPython interactive shell
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: IPython.core.interactiveshell
  - id: ast-parse-caller-code-exec
    desc: Parses caller code in exec mode
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'ast.parse(code or "", mode="exec")'
  - id: runpy-run-path
    desc: Python runpy.run_path execution
    crit: notable
    conf: 0.93
    if:
      type: symbol
      kind: call
      exact: runpy.run_path
  - id: runpy-run-module
    desc: Python runpy.run_module execution
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: runpy.run_module

composite_rules:
  - id: ipython-display-code-runner
    desc: IPython display code runner
    crit: notable
    conf: 0.95
    all:
      - id: ipython-interactive-shell-import
      - id: ast-parse-caller-code-exec
