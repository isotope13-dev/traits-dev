defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]
  attack: T1059.006
  mbc: E1059

traits:
  - id: python-vm-file-io-opcode
    desc: Python VM dispatches file I/O opcode
    conf: 0.95
    if:
      type: text
      regex: '_IO_OPS\s*=\s*frozenset\(\s*\{[^}\n]{0,160}["'']red["'']'

  - id: python-vm-network-io-opcode
    desc: Python VM dispatches network I/O opcode
    conf: 0.95
    if:
      type: text
      regex: '_IO_OPS\s*=\s*frozenset\(\s*\{[^}\n]{0,160}["'']get["'']'

  - id: python-vm-exec-io-opcode
    desc: Python VM dispatches process execution opcode
    conf: 0.95
    if:
      type: text
      regex: '_IO_OPS\s*=\s*frozenset\(\s*\{[^}\n]{0,160}["'']exe["'']'



  - id: rpyc-classic-connect-stream
    desc: Opens RPyC classic custom stream
    conf: 0.98
    if:
      type: symbol
      exact: rpyc.classic.connect_stream

  - id: rpyc-classic-stream-service
    desc: Serves RPyC classic over custom stream
    conf: 0.98
    if:
      type: text
      regex: 'rpyc\.classic\.connect_stream\([^)]{0,32}\)[\s\S]{0,64}\.serve_all\(\)'

composite_rules:
