# Evidence describes ordinary capabilities or static properties.
defaults:
  crit: notable
traits:
- platforms:
  - unix
  for:
  - python
  - pyc
  id: frozen-executable-check
  desc: Python frozen or base-executable attribute check
  conf: 0.8
  if:
    type: text
    regex: hasattr\(sys,\s*["']frozen["']\)|sys\.base_executable
  unless:
  - type: text
    regex: not\s+hasattr\(sys,\s*["']frozen["']\)
composite_rules:
- platforms:
  - windows
  - unix
  for:
  - python
  - shell
  size_max: 131072
  id: pth-startup-import
  desc: Python path configuration file contains an import line
  conf: 0.95
  all:
  - id: micro-behaviors/process/interpreter/python::pth-path-config-file
  - id: micro-behaviors/process/interpreter/python::module-import-statement
  unless:
  - id: metadata/build/bazel::site-init-pth-import
  - id: well-known/lib/data/ibm-db::dll-register-pth
  - id: micro-behaviors/dylib/load/runtime::python-add-dll-directory
