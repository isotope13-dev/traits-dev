defaults:
  platforms:
  - unix
  - windows
  for:
  - python

traits:
  - id: python-argc-runpy-profile
    desc: Python argc condition near runpy
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?s)Py_GetArgcArgv[\s\S]{0,500}if\s+\w+\.value\s*==\s*1[\s\S]{0,500}runpy\.run_path\('

