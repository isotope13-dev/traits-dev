# Archive-wide co-occurrence cannot bind a .pth import to a surveyed module,
# establish a local snapshot, or establish supply-chain compromise. Preserve
# every constituent observation as neutral startup context. In particular, a
# diagnostic import hook and an unrelated metadata client also satisfy it.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [whl, python, pkginfo]

composite_rules:
  - id: wheel-pth-metadata-json-context
    desc: Wheel startup imports and metadata/JSON code co-occur
    conf: 0.98
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::wheel-pth-startup-member
      - id: micro-behaviors/process/interpreter/python::pth-startup-import
      - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
      - id: micro-behaviors/communications/http/header/custom::gcp-metadata-flavor-header
      - id: micro-behaviors/data/serialize/json::json-dumps-call
    any:
      - id: micro-behaviors/fs/proc/cmdline::process-var-cmdline
      - id: micro-behaviors/os/env/enumeration::python-environ-items-loop
      - id: micro-behaviors/data/serialize/schema-object::host-field-key
