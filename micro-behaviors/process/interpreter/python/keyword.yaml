defaults:
  crit: notable
  platforms: [unix, windows]
  for: [shell, batch, powershell, ruby, perl, lua]
traits:
  - id: python-keyword
    desc: Invokes Python interpreter
    conf: 0.7
    for: [shell, batch, powershell, ruby, perl]
    unless:
      - id: metadata/lang/shebang/
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/build/conda/
      - type: text
        substr: "empty('python')"
      - type: text
        substr: "e.g. 'javascript', 'python'"
      - type: text
        regex: '(?im)^pkgdesc=.*\bpython\b'
    if:
      type: symbol
      regex: '(?i)^python(\d(\.\d+)?)?(\.exe)?$'
  - id: python-local-script
    desc: Python interpreter runs local script
    conf: 0.9
    for: [shell]
    if:
      type: symbol
      kind: call
      regex: '(?i)^python(\d(\.\d+)?)?(\.exe)?$'
      arg:
        kind: identifier
        substr: '/'
  # A Windows interpreter path assembled at runtime rather than taken from
  # sys.executable: the program means to run a python.exe it did not start
  # under, typically one it has just unpacked.
  - id: python-exe-path-join
    desc: Builds a path to a python.exe binary
    conf: 0.86
    for: [python]
    if:
      type: text
      regex: '(?i)os\.path\.join\([^)\n]{1,120}["'']pythonw?\.exe["'']'
