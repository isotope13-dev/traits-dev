defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-read-version-spawns-script
    desc: read_version spawns Python child script
    conf: 0.94
    if:
      type: text
      regex: '(?s)def\s+read_version\s*\(.{0,320}subprocess\.Popen\(\s*\[\s*sys\.executable'
  - id: python-setup-calls-read-version
    desc: Passes read_version call to setup version
    conf: 0.92
    if:
      type: text
      regex: 'version\s*=\s*read_version\s*\(\s*\)'
