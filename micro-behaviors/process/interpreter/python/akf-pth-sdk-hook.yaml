defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: akf-startup-sdk-patch-install
    desc: Installs AKF Python startup SDK hook
    crit: suspicious
    conf: 0.97
    if:
      type: yara
      source: |
        rule akf_startup_sdk_patch_install {
          strings:
            $name = "_PTH_FILENAME = \"akf_auto.pth\""
            $content = "_PTH_CONTENT = \"import akf._auto; akf._auto.activate()"
            $write = "pth_path.write_text(_PTH_CONTENT)"
            $patch = "sys.meta_path.insert(0, _AKFImportHook())"
          condition:
            all of them
        }
