# Windowless Python is a normal GUI/service capability, not a dropper verdict.
defaults:
  platforms: [windows]
  for: [python]
composite_rules:
  - id: pythonw-subprocess-no-window-profile
    desc: Pythonw with windowless subprocess code
    crit: notable
    conf: 0.96
    near_lines: 30
    all:
      - id: micro-behaviors/process/interpreter/python::pythonw-launch
      - id: micro-behaviors/process/create/subprocess::process-execution
    any:
      - id: micro-behaviors/process/create/flags::python-or-create-no-window-hex
      - id: micro-behaviors/process/create/flags::python-create-no-window-hex
