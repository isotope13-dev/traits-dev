defaults:
  for: [c, cpp]
  platforms: [windows, unix]
  conf: 0.9
  crit: notable

traits:
  - id: python-h-include
    desc: Python.h C API header in native source
    if:
      type: text
      regex: '#\s*include\s*[<"]Python\.h[>"]'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: pytype-object-reference
    desc: References CPython PyTypeObject C API
    if:
      type: text
      substr: PyTypeObject
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: pyarg-parsetuple
    desc: PyArg_ParseTuple C API argument parsing
    if:
      type: text
      substr: PyArg_ParseTuple
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: pycallable-check
    desc: PyCallable_Check C API reference
    if:
      type: text
      substr: PyCallable_Check
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: pyvarobject-head-init
    desc: PyVarObject_HEAD_INIT extension object macro
    if:
      type: text
      substr: PyVarObject_HEAD_INIT
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
composite_rules:
  - id: python-capi-extension-module
    desc: Python C extension module in native source
    crit: notable
    conf: 0.92
    all:
      - id: python-h-include
      - id: pytype-object-reference
    any:
      - id: pyarg-parsetuple
      - id: pyvarobject-head-init
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
