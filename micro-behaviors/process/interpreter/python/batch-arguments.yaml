defaults:
  attack: T1105
  platforms: [windows]
  for: [batch]
traits:
- id: python-bin-input-arg
  desc: Python script with binary input argument
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)\bpython(\.exe)?\s+[^\r\n]{1,80}\.py\s+-i\s+\S+\.bin\b'
- id: python-embed-zip-name
  desc: Python embeddable runtime ZIP filename reference
  crit: notable
  conf: 0.84
  for: [batch, powershell]
  if:
    type: text
    regex: '(?i)python-[0-9.]+[a-z0-9.-]*-embed-amd64\.zip'
