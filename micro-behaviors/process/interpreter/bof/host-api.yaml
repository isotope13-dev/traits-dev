# Beacon Object File host API names indicate BOF runtime compatibility.
# Text matching cannot establish that a name is exported, or that a BOF was
# fetched and executed. The generic COFF import marker lives with linker facts.
defaults:
  platforms: [linux, macos, windows]
  for: [binaries, go, c, cpp, pe, dll]
traits:
  - id: beacon-printf-api-name
    desc: BeaconPrintf BOF API name
    crit: notable
    conf: 0.95
    if:
      type: text
      word: BeaconPrintf
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: beacon-output-api-name
    desc: BeaconOutput BOF API name
    crit: notable
    conf: 0.95
    if:
      type: text
      word: BeaconOutput
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: beacon-data-parse-api-name
    desc: BeaconDataParse BOF API name
    crit: notable
    conf: 0.95
    if:
      type: text
      word: BeaconDataParse
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: beacon-data-int-api-name
    desc: BeaconDataInt BOF API name
    crit: notable
    conf: 0.95
    if:
      type: text
      word: BeaconDataInt
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: beacon-data-short-api-name
    desc: BeaconDataShort BOF API name
    crit: notable
    conf: 0.95
    if:
      type: text
      word: BeaconDataShort
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: beacon-data-length-api-name
    desc: BeaconDataLength BOF API name
    crit: notable
    conf: 0.95
    if:
      type: text
      word: BeaconDataLength
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: beacon-data-extract-api-name
    desc: BeaconDataExtract BOF API name
    crit: notable
    conf: 0.95
    if:
      type: text
      word: BeaconDataExtract
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: bof-executed-message
    desc: BOF execution status message
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: 'BOF (executed|execution failed)'
  - id: go-coffer-bof-loader
    desc: Go coffer COFF/BOF loader routine
    crit: suspicious
    conf: 0.96
    attack: T1620
    mbc: B0030
    if:
      type: text
      regex: 'coffer\.(Load|LoadAsync|AsyncBof)\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: go-goffloader-package
    desc: Go goffloader BOF loader package
    crit: suspicious
    conf: 0.96
    attack: T1620
    mbc: B0030
    if:
      type: text
      regex: 'goffloader/(coff|lighthouse)\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: exec-bof-routine-name
    desc: BOF execution handler or parameter type
    crit: notable
    conf: 0.92
    attack: T1620
    if:
      type: text
      regex: '(task|job|Params|Ans)ExecBof'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
composite_rules:
  - id: beacon-api-bof-runtime
    desc: Beacon Object File host API cluster
    crit: suspicious
    conf: 0.97
    attack: T1620
    mbc: B0030
    # Beacon* API is the Cobalt Strike BOF spec, but Sliver, Brute Ratel,
    # Havoc, Mythic and others all expose the same runtime API. Family
    # attribution belongs in well-known/.
    needs: 4
    any:
      - id: beacon-printf-api-name
      - id: beacon-output-api-name
      - id: beacon-data-parse-api-name
      - id: beacon-data-int-api-name
      - id: beacon-data-short-api-name
      - id: beacon-data-length-api-name
      - id: beacon-data-extract-api-name
      - id: bof-executed-message
      - id: metadata/binary/symbols/compiler::coff-import-pointer-prefix
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: bof-loader-capability
    desc: In-memory Beacon Object File loader runtime
    crit: suspicious
    conf: 0.97
    attack: T1620
    mbc: B0030
    any:
      - id: beacon-api-bof-runtime
      - id: go-coffer-bof-loader
      - id: go-goffloader-package
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
