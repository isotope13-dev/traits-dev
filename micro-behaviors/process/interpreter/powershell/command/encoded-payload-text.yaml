# EncodedCommand transports UTF-16LE text through command-line quoting.
# Text with a payload establishes neither launch nor a hidden window.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
traits:
  - id: powershell-encoded-payload-command-text
    desc: PowerShell encoded command text with payload
    crit: notable
    conf: 0.9
    attack: T1059.001
    if:
      type: text
      # Raw text is not syntax-aware, so require the following argument to
      # look like an encoded payload, and carry the bounded same-line prefix
      # in the match so `not:` can drop documented console-prompt examples
      # ("PS C:\> powershell.exe -enc ..."), which are documentation rather
      # than live command text.
      regex: '(?m)^.{0,64}\bpowershell\b[^\n]{0,180}\s-(EncodedCommand|enc)\b\s+["'']?[A-Za-z0-9+/]{16,}'
      case_insensitive: true
    not:
      # Comment-based help and README examples quote the interpreter behind a
      # console prompt ("PS C:\>", "C:\PS>").
      - regex: '(?i)PS\s+[A-Za-z]:\\>'
      # Keep the existing exclusion for standalone command-string assignment.
      - regex: '(?i)^\s*(const|let|var)\s+\w+\s*='
    unless:
      # Test files and unit-test modules quote an encoded command as analyzer
      # input; they do not invoke it.
      - id: metadata/package/testing/
      - id: micro-behaviors/process/create/hidden::ansible-encoded-command-context
      - type: path
        regex: '^Azure\.Core\.[0-9][^/]*\.nupkg/lib/net10\.0/Azure\.Core\.dll$'
      - id: well-known/app/system/businessdev-albuild/
      - id: well-known/app/system/colorscripts-enhanced::package-context
      - id: well-known/lib/runtime/scripted/bun-runtime::runtime-context
      # Same carve-out as the interpreter's `encodedcommand-flag-js`: sindresorhus/open
      # launches `powershell -EncodedCommand` as its Windows URL-opening
      # plumbing. A rollup/esbuild bundle of it (vite dist chunks, Electron
      # app bundles) is typed `javascript`, so the raw text rule sees the
      # full invocation and this `for:` list reaches it.
      - id: well-known/lib/runtime/scripted/sindresorhus-open::sindresorhus-open-library
      - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-sdk-bundle-runtime-marker
