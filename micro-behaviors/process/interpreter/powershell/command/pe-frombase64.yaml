# PowerShell source text embedded in a managed image. The call is Convert
# decoding, not a Windows Script Host statement.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98

traits:
  - id: pe-powershell-frombase64string
    desc: PE embeds a PowerShell FromBase64String call
    if:
      type: text
      substr: '[System.Convert]::FromBase64String'
