defaults:
  platforms: [unix, windows]
  for: [json]
  conf: 0.9

traits:
  - id: powershell-executable-script-api-reference
    desc: PowerShell executable near script API references
    crit: notable
    if:
      type: text
      regex: 'powershell\.exe[\s\S]{0,260}(DownloadString|IEX|Invoke-)'
      case_insensitive: true
    unless:
      - id: metadata/package/documentation/security-advisory::vulnerability-advisory-catalog
      - id: metadata/file/catalog/identity::elastic-security-detection-rule
      - id: well-known/tool/detection/crowdsec/

