defaults:
  platforms: [windows, unix]
  for: [powershell, data, batch, oledoc, javascript, typescript]
  attack: T1059.001
composite_rules:
  - id: encodedcommand-option-reference
    desc: PowerShell encoded-command option reference
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/process/create/hidden::encodedcommand-invocation-raw
      - id: micro-behaviors/process/create/hidden::encodedcommand-invocation-source
      - id: micro-behaviors/process/interpreter/powershell/command::encodedcommand-flag-js
    unless:
      # Markdown code examples can be content-sniffed as JavaScript, which
      # indexes fenced commands as string literals. They are not invocations.
      - id: metadata/file/extension/identity::markdown-file-basename

  - id: encodedcommand-process-launch
    desc: PowerShell EncodedCommand invocation
    crit: suspicious
    conf: 0.92
    for: [javascript, typescript]
    all:
      - id: encodedcommand-option-reference
    any:
      - id: encodedcommand-child-process-js
      - id: micro-behaviors/process/create/hidden::encodedcommand-exec-js
    unless:
      - id: metadata/package/testing/corpus/
      - id: metadata/package/testing/presence/harness/
      # Markdown code examples can be content-sniffed as JavaScript, which
      # indexes fenced commands as string literals. They are not invocations.
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: micro-behaviors/process/create/hidden::encodedcommand-known-benign-context
      - id: "metadata/file/naming::test-directory-component"
