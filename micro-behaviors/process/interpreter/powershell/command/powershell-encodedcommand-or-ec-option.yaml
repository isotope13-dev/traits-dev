defaults:
  platforms: [unix, windows]
  for: [powershell, batch, shell]
traits:
- id: powershell-encodedcommand-or-ec-option
  desc: PowerShell EncodedCommand or EC option
  crit: notable
  conf: 0.9
  for: [powershell]
  if:
    type: text
    regex: "(?i)-[Ee]ncoded[Cc]ommand|-[Ee][Cc]\\s"
  unless:
  - id: well-known/tool/sysadmin/console::gsudo-powershell-wrapper
  - id: well-known/tool/sysadmin/alpine-packages/package::alpine-ansible-core-package
  - id: well-known/app/infrastructure/ansible::ansible-powershell-context
  # Recognized Ansible PowerShell provenance: the module source tree, or an
  # executor wrapper (async_wrapper.ps1 and siblings, which predate the
  # #Requires-based markers the context above keys on).
  - id: well-known/app/infrastructure/ansible::ansible-powershell-provenance
  - id: well-known/app/system/businessdev-albuild/
  # (`Start-ChocolateyProcessAsAdmin` was listed separately; the
  # `ChocolateyProcessAsAdmin` substring above already covers it.)
  - id: well-known/app/system/colorscripts-enhanced::package-context
  - id: metadata/package/integrity::debian-md5sums-manifest
  # === Density-Based Obfuscation Detection ===
  # Legitimate PowerShell rarely uses many char casts.
  # Obfuscated code builds strings via [char]65+[char]66...
