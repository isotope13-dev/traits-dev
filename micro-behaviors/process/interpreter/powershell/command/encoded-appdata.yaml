defaults:
  for: [html, vbs, powershell, javascript]
  platforms: [windows]
traits:
  # The call operator can dispatch a native command or a script. It does not
  # prove in-process evaluation, nor which Windows file association is used.
  - id: encoded-powershell-appdata-script-command
    desc: Encoded PowerShell AppData script dispatch
    crit: notable
    conf: 0.98
    if:
      type: encoded
      encoding: base64
      regex: '(?i);\s*&\s*["”'']\$env:appdata\\[^"”'']+\.(js|vbs|ps1)["”'']'
