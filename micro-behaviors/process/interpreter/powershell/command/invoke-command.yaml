# Invoke-Command dispatches a command or ScriptBlock through a PowerShell host;
# it does not evaluate source text by itself.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [powershell]
  attack: T1059.001
  mbc: E1059

traits:
  - id: powershell-invoke-command
    desc: PowerShell Invoke-Command call
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bInvoke-Command\b'
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
