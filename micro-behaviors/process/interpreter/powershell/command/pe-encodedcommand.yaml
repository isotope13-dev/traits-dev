# PowerShell launch text and script fragments embedded in a native or
# managed image. -EncodedCommand hides the command line from process
# listings; a UTF-16 Base64 scriptblock runs text supplied at runtime.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious

traits:
  - id: pe-powershell-encodedcommand-launch-text
    desc: PE embeds a powershell -EncodedCommand launch
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bpowershell(\.exe)?\s[^\r\n]{0,60}-EncodedCommand\b'
    unless:
      - id: well-known/tool/detection/xgrep::xgrep-scanner-context
      - id: metadata/package/testing/presence/fixture::semgrep-rule-fixture

  - id: pe-unicode-base64-scriptblock-create
    desc: PE runs UTF-16 Base64 text as scriptblock
    conf: 0.95
    if:
      type: text
      regex: 'Unicode\.GetString.{0,80}scriptblock\]::Create'
