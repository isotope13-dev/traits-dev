# Neutral observation of a PowerShell process launched with an encoded-command
# option. Intent comes from the decoded behavior and execution context.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.94
  attack: T1059.001,T1027

traits:
  - id: encoded-command-line
    desc: PowerShell encoded-command launch
    if:
      type: text
      regex: '(?i)\bpowershell([.]exe)?\b[^\r\n]{0,80}\s-(e|enc|encodedcommand)\b'
