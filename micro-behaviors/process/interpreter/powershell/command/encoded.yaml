# Neutral observation of PowerShell command text with an encoded-command option.
# Matches command construction and test expectations too; it proves neither
# process launch nor concealment. Inspect the decoded behavior and call site.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.94
  attack: T1059.001

traits:
  - id: encoded-command-line
    desc: PowerShell encoded-command command text
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)\b[^\r\n]{0,80}\s-(e|enc|encodedcommand)\b'
