defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-encoded-command-option
    desc: LNK carries an encoded-command option
    crit: notable
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      # `-E` is the unique PowerShell command-line abbreviation for
      # `-EncodedCommand` (often combined with `-W 1` on malicious LNKs).
      regex: '(?i)(^|\s)-e(ncodedcommand|nc|c)?\s+[A-Za-z0-9+/=]{24,}'
  - id: lnk-cmd-powershell-command
    desc: LNK command shell invokes PowerShell
    crit: notable
    conf: 0.97
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)^/[ck]\s+["'']?(powershell|pwsh)(\.exe)?\s'

composite_rules:
  - id: lnk-cmd-powershell-proxy
    desc: Shortcut invokes PowerShell through cmd
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/process/config/target::lnk-cmd-target
      - id: lnk-cmd-powershell-command
  - id: lnk-powershell-launch-context
    desc: Shortcut launches PowerShell directly or through a proxy
    crit: notable
    conf: 0.97
    any:
      - id: micro-behaviors/process/config/target::lnk-powershell-family
      - id: micro-behaviors/process/config/target::lnk-conhost-headless-powershell
      - id: lnk-cmd-powershell-proxy
