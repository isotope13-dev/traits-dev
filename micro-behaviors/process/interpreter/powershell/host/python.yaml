# Bind creation, script submission and invocation to the same host variable.
# An AddScript token or an uninvoked script pipeline is insufficient.
defaults:
  for: [python]
  platforms: [windows]
  crit: notable
  conf: 0.97
traits:
  - id: python-created-powershell-script-invocation
    desc: Python submits and invokes PowerShell scripts
    if:
      type: tree-sitter
      query: |
        (block
          (expression_statement (assignment
            left: (identifier) @host
            right: (call function: (attribute) @factory)))
          .
          (expression_statement (call
            function: (attribute object: (identifier) @submitted
              attribute: (identifier) @add)))
          .
          (expression_statement (assignment
            right: (call function: (attribute object: (identifier) @invoked
              attribute: (identifier) @invoke))))
          (#eq? @host @submitted)
          (#eq? @host @invoked)
          (#eq? @factory "PowerShell.Create")
          (#eq? @add "AddScript")
          (#match? @invoke "^(BeginInvoke|Invoke)$"))
