# Hosting a script engine in an inline build task is a capability. A
# permissive authorization manager or concealed command adds separate evidence.
defaults:
  platforms: [windows]
  for: [xml]
  crit: notable
  attack: T1059.001
  mbc: E1059

composite_rules:
  - id: msbuild-inline-powershell-runspace
    desc: MSBuild inline task hosts a PowerShell runspace
    crit: notable
    conf: 0.96
    all:
      - id: metadata/build/manifest::msbuild-inline-task-declaration
      - id: micro-behaviors/process/interpreter/powershell/host::runspace-factory
      - id: micro-behaviors/process/interpreter/powershell/host::add-script
