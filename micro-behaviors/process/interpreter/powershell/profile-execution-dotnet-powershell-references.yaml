defaults:
  for:
  - pe
  - dll
  - csharp
  platforms:
  - windows
  crit: notable
  conf: 0.9
composite_rules:
- id: dotnet-powershell-host
  desc: .NET PowerShell host references
  all:
  - id: metadata/import/framework::sma-namespace
  any:
  - id: metadata/import/framework::powershell-create
  - id: metadata/lang/source/naming/function/runtime::create-runspace
- id: dotnet-powershell-exec
  desc: PowerShell host and script references
  all:
  - id: micro-behaviors/process/interpreter/powershell::dotnet-powershell-host
  any:
  - id: metadata/lang/source/naming/function/runtime::add-script
  - id: metadata/lang/source/syntax/call/member::add-command
  - id: metadata/lang/source/naming/function/runtime::add-parameter
  - id: metadata/lang/source/syntax/call/member::add-argument
  - id: metadata/lang/source/naming/function/runtime::create-runspace
  - id: metadata/import/framework::sma-host
  - id: metadata/import/framework::sma-runspaces
  - id: micro-behaviors/fs/path/script::embedded-ps1
  needs: 2
