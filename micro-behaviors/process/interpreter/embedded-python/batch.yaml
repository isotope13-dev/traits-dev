defaults:
  platforms: [windows]
  for: [batch, powershell, pe, dll]
  attack: T1059.006

traits:
  - id: ironpython-path-environment
    desc: IronPython path environment marker
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bIRONPYTHONPATH\b'

  - id: ironpython-runtime-executable
    desc: IronPython Windows runtime executable
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bipyw(32|64)?\.exe\b'

  - id: ironpython-script-launch
    desc: IronPython launcher executes a script
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bipyw(32|64)?\.exe\b[^\r\n]{0,160}\s-(x|c)\s+["'']?.{0,120}'
