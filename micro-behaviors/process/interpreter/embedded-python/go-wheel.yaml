# ZIP and process APIs plus embedded finder source describe a capability,
# not attack intent. Package scanners use the finder to stub dependencies.
defaults:
  platforms: [unix]
  for: [elf]
  crit: notable

composite_rules:
  - id: go-zip-python-finder-references
    desc: Go ZIP and process APIs with embedded Python finder
    conf: 0.97
    all:
      - id: micro-behaviors/data/archive/zip::go-zip-openreader-text
      - id: micro-behaviors/process/create/runtime-symbol::go-native-exec-command-reference
      - id: micro-behaviors/process/hook/interception::embedded-python-meta-path-finder
