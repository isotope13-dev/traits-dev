# JavaScript command strings that invoke Python inline.  These are neutral
# execution/network capabilities; reverse-shell intent is inferred by the
# objective composites that combine them with socket and shell behavior.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1059.006

traits:
  - id: js-exec-inline-python-command
    desc: JavaScript exec invokes inline Python
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        kind: string
        substr: "python -c"

  - id: js-inline-python-socket-create
    desc: Inline Python creates a socket
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        kind: string
        substr: "socket.socket"

  - id: js-inline-python-socket-connect
    desc: Inline Python connects a socket
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        kind: string
        substr: ".connect("

  - id: js-inline-python-dup2-stdio
    desc: Inline Python redirects socket standard streams
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        kind: string
        substr: "os.dup2"

  - id: js-inline-python-pty-shell
    desc: Inline Python spawns a POSIX shell PTY
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        kind: string
        substr: 'pty.spawn("/bin/sh")'

  - id: node-spawn-python-identifier
    desc: Node spawns selected Python interpreter
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '(^|\.)spawn$'
      arg:
        kind: identifier
        name: python
