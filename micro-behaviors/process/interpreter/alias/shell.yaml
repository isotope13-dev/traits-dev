defaults:
  crit: notable
  conf: 0.95
  for: [shell]
  platforms: [unix]

traits:
  - id: shell-alias-management-call
    desc: Shell alias definition or inspection call
    if:
      type: symbol
      kind: call
      regex: ^(alias|"alias"|'alias')$
    unless:
      - type: symbol
        kind: function
        exact: alias
      - type: tree-sitter
        query: '(ERROR) @error'
