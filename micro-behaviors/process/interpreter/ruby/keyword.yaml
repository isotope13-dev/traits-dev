defaults:
  platforms: [unix, windows]
  for: [shell, scripts]

traits:
  - id: ruby-command-invocation
    desc: Ruby interpreter command invocation
    crit: notable
    conf: 0.82
    for: [shell, batch]
    if:
      type: text
      regex: '(^|[;&|]\s*)ruby([0-9.]+)?\s+'

  - id: ruby-binary-path
    desc: Ruby interpreter binary path
    crit: notable
    conf: 0.82
    for: [scripts, dockerfile, makefile]
    if:
      type: string_literal
      regex: '(^|[/\\])bin/ruby\b|ruby\.exe\b'

  - id: ruby-keyword
    desc: Ruby interpreter command invocation
    crit: notable
    conf: 0.7
    # Bare word `ruby` is also the HTML ruby annotation element (ARIA maps,
    # Testing Library role tables). Require command-like context so a tag
    # name is not reported as an interpreter.
    for: [shell, batch, ruby, python, perl, javascript, typescript]
    unless:
      - id: metadata/lang/shebang::ruby
      - type: import
        regex: "^rich\\.syntax$"
    not:
      # Fence/language tags: evidence often starts at the last backtick, so
      # exclude both the three-tick form and a single tick before ruby.
      - regex: '```ruby'
      - regex: '`ruby'
    # Require a CLI flag or a .rb operand so prose ("a ruby Hash") and
    # version notes ("Testing with ruby 2.1.2") are not invocations.
    if:
      type: text
      regex: '(?m)(^|[;&|(\s])(/usr/bin/)?ruby[0-9.]{0,8}(\.exe)?\s+(-[A-Za-z]|\S+\.rb)'
  - id: ruby-inline-library-flag
    desc: Ruby inline or library flag
    crit: notable
    conf: 0.75
    for: [shell, batch, ruby]
    if:
      type: text
      regex: ruby\s+-(e|r(socket|open-uri|fiddle))\b

  - id: ruby-cross-interpreter-exec
    desc: Another runtime invokes Ruby interpreter
    crit: notable
    conf: 0.9
    for: [python, javascript, typescript]
    if:
      type: text
      regex: '(spawn|execFile|execSync|Popen)\s*\(\s*["''].{0,60}ruby(\.exe)?["'']'
