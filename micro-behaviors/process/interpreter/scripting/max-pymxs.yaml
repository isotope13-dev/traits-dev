# 3ds Max runs caller source through pymxs. A skill that refuses to compile
# until an explicit confirm flag is set is the host editor, not a hidden payload.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: pymxs-confirmed-caller-exec
    desc: Confirmed pymxs exec of caller source
    if:
      type: text
      regex: 'confirm_execution is not True[\s\S]{0,600}import pymxs\b[\s\S]{0,500}exec\(compile\('
