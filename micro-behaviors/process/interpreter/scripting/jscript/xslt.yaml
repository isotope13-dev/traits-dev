defaults:
  platforms: [windows]
  for: [vbs, html, javascript, xml]
  attack: T1059
  mbc: E1059

traits:
  - id: xslt-ms-script-block
    desc: Microsoft XSLT embeds script code
    crit: notable
    conf: 0.94
    for: [xml, html, javascript]
    if:
      type: text
      regex: '(?is)(<ms:script\b|<msxsl:script\b|%3c%6d%73%3a%73%63%72%69%70%74)'
    unless:
      - id: well-known/tool/offensive/payload-corpus::payloadsallthethings-release-member
      - id: metadata/library/pywin32::pywin32-binding-module

  - id: xslt-jscript-language
    desc: XSLT embeds Microsoft JScript
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'language\s*=\s*["'']{1,2}JScript'
