# A script block that reaches a SaveToFile call. The bounded span keeps
# drive-by file-write pages (script opens, unsafe method follows within the
# same block) while ordinary pages never name the method. Both the tag
# opener and the span are bounded for matcher performance.
defaults:
  for: [html]
  platforms: [windows]

traits:
  - id: script-block-savetofile-call
    desc: Script block reaches a SaveToFile call
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)<script\b[^>]{0,200}>.{0,800}?savetofile'
