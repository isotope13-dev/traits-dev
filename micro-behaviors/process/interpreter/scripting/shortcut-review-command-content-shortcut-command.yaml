---
defaults:
  platforms:
  - windows
  for:
  - lnk
composite_rules:
- id: lnk-jscript-vbscript
  desc: LNK references JScript or VBScript
  crit: suspicious
  conf: 0.85
  any:
  - id: micro-behaviors/process/interpreter/scripting::lnk-jscript-vbscript--jscript
  - id: micro-behaviors/process/interpreter/scripting::lnk-jscript-vbscript--vbscript
- id: script-indicators
  desc: Script language indicators in LNK
  crit: suspicious
  conf: 0.85
  any:
  - id: micro-behaviors/process/interpreter/scripting::lnk-javascript-ref
  - id: micro-behaviors/process/interpreter/scripting::lnk-jscript-vbscript
  - id: micro-behaviors/fs/path/script::lnk-script-ext-wsh
- id: lnk-javascript-shell-policy-encoding
  desc: LNK JavaScript, Shell, policy and encoding clues
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/process/interpreter/scripting::lnk-javascript-ref
  - id: micro-behaviors/os/security/policy::lnk-relaxed-execution-policy
  - id: micro-behaviors/process/argument/interpreter::kv-encoding-flag
  - id: micro-behaviors/process/interpreter/shell::lnk-shell-text-reference
- id: lnk-mshtml-and-script-reference
  desc: LNK mshtml and script references
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/process/interpreter/scripting::lnk-mshtml-protocol-reference
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::lnk-execscript-call
  - id: micro-behaviors/process/interpreter/scripting::lnk-javascript-ref
  - id: micro-behaviors/os/com/instantiation::lnk-createobject-htmlfile
  - id: micro-behaviors/process/interpreter/scripting::lnk-jscript-vbscript
