---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
composite_rules:
- id: node-interpreter-reference-clues
  desc: Interpreter reference clues
  crit: component
  for:
  - javascript
  - typescript
  any:
  - id: micro-behaviors/process/interpreter/python::python-keyword
  - id: micro-behaviors/fs/path/application/interpreter::bin-python
  - id: micro-behaviors/fs/path/application/interpreter::bin-bun
  - id: micro-behaviors/fs/path/application/interpreter::bin-node
  - id: micro-behaviors/fs/path/application/interpreter::node-runtime-executable-path
  - id: micro-behaviors/process/interpreter/ruby::ruby-cross-interpreter-exec
  - id: micro-behaviors/process/interpreter/perl::perl-keyword
