# importScripts() synchronously loads and evaluates scripts in an existing
# WorkerGlobalScope (including service workers). It does not create a worker.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92
  mbc: "C0017"
  attack: T1059.007

traits:
  - id: worker-importscripts-call
    desc: Worker imports additional scripts
    if:
      type: symbol
      kind: call
      exact: importScripts

  - id: worker-importscripts-dynamic-argument
    desc: Worker imports dynamically constructed script
    if:
      type: symbol
      kind: call
      exact: importScripts
      arg:
        kind: expression
