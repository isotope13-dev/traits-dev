# In-process AppleScript through Foundation's NSAppleScript: the same engine
# osascript(1) wraps, but without a child process for process-tree monitoring
# to see. Native macOS stealers use it for `display dialog` lures and
# `do shell script` without ever spawning osascript.
defaults:
  platforms: [macos]
  for: [macho]
  attack: T1059.002
  crit: notable
composite_rules:
  - id: nsapplescript-in-process-exec
    desc: NSAppleScript class and execution selector references
    conf: 0.92
    all:
      - id: well-known/lib/platform/apple-foundation::nsapplescript-class-reference
      - id: metadata/binary/symbols/name/function::objc-execute-return-error-selector
