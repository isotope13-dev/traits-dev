defaults:
  platforms: [macos]
  for: [javascript, typescript]
traits:
  - id: node-spawn-osascript
    desc: Node spawn calls the AppleScript interpreter
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: spawn
      arg:
        index: 0
        exact: /usr/bin/osascript
