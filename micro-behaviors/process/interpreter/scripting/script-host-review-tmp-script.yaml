defaults:
  for: [batch, html, javascript, powershell, vbs]
  platforms: [windows]
traits:
  - id: tmp-script-host-command
    desc: Script host launches script under TMP
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\b(wscript|cscript|mshta)(\.exe)?\s+"?%TMP%[\\/][^"\r\n&]{1,80}\.(vbs|js|hta)\b'
