defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, c, cpp]
  mbc: B0015
  attack: T1056.001
  crit: suspicious

composite_rules:
- id: osascript-keyword
  desc: osascript keyword (case variants)
  crit: notable
  # A bare `osascript` token is equally at home in a shell/AppleScript/JXA
  # script and in a compiled binary that spawns it, so this spans both the
  # file's binary default and the script types applescript-keystroke needs.
  for: [elf, macho, pe, c, cpp, javascript, shell, applescript]
  any:
  - id: micro-behaviors/process/deploy/interpreter-command::osascript-dup
  - id: micro-behaviors/process/interpreter/scripting::osascript-title
  - id: micro-behaviors/process/interpreter/scripting::osascript-upper
