# Autodesk Maya runs scene and command code on one UI thread. A host
# tool that compiles caller source has to hand that call to
# executeInMainThreadWithResult; the API name is the marshalling, not a
# payload.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: maya-main-thread-script-marshal
    desc: Marshals code onto Maya's main thread
    if:
      type: text
      substr: executeInMainThreadWithResult
