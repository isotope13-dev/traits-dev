defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, c, cpp]
  mbc: B0015
  attack: T1056.001
  crit: suspicious

composite_rules:
- id: node-applescript
  desc: Node.js AppleScript execution or library reference
  # A library reference alone is not keylogging; the keystroke hook remains
  # independently suspicious and the higher composites require it.
  crit: notable
  conf: 0.85
  attack: T1059.002
  platforms: [macos]
  for: [javascript]
  any:
  - id: micro-behaviors/process/interpreter/scripting::node-applescript-library-reference
  - id: micro-behaviors/process/deploy/interpreter-command::osascript-reference-and-execsync
# Split by evidence regime. In a COMPILED PE the hook type is an integer
# argument, so the constant is unavailable and a bare SetWindowsHookEx plus the
# capture-API cluster is the best available evidence -- unchanged below. In
# SOURCE the hook type is right there in the text, and treating any
# SetWindowsHookEx as keyboard interception convicted every GUI toolkit:
# WH_CALLWNDPROC / WH_GETMESSAGE / WH_CBT / WH_MOUSE_LL are ordinary window
# plumbing, and GetKeyboardState + MapVirtualKey + GetAsyncKeyState is the
# mandatory WM_KEYDOWN-to-character path in JUCE, Qt, wxWidgets, SDL and every
# Chromium/Electron windowing back-end. See windows-keylogger-source below.
