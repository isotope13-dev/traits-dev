defaults:
  for:
  - data
  - dos_com
  - pe
  - static-lib
  platforms:
  - windows
  - unix
  size_min: 482
  size_max: 8192
traits:
- id: micro-behaviors/process/interpreter/scripting::batch-pkx-self-native-bridge
  desc: Batch builds native image from itself
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule batch_pkx_self_native_bridge {\n strings:\n $echo = /@echo\\.PKX>[A-Za-z0-9_.-]{1,48}\\.exe\\r\\n/ nocase\n $copy = /@copy\\/b [A-Za-z0-9_.-]{1,48}\\.exe\\+%0\\.bat>nul\\r\\n/ nocase\n $run = /@[A-Za-z0-9_.-]{1,48}\\.exe\\x1a/ nocase\n condition:\n #echo > 0 and #echo <= 32 and #copy > 0 and #copy <= 32 and #run > 0 and #run <= 32 and\n for any e in (1..#echo) : (uint8(@echo[e]-5)==0x3a and uint16(@echo[e]-2)==0x0a0d and\n for any c in (1..#copy) : (@copy[c]==@echo[e]+!echo[e] and !copy[c]-21==!echo[e]-12 and\n for any r in (1..#run) : (@run[r]==@copy[c]+!copy[c] and !run[r]-2==!echo[e]-12 and\n for all n in (0..!echo[e]-13) : (\n (uint8(@echo[e]+10+n)|32)==(uint8(@copy[c]+8+n)|32) and\n (uint8(@echo[e]+10+n)|32)==(uint8(@run[r]+1+n)|32)))))\n}"
