# Chromium Embedded Framework navigation capabilities.
defaults:
  platforms: [linux, macos, windows]
  for: [c, cpp, csharp, rust, go, java]

traits:
  - id: cef-browser-type-reference
    desc: References CEF browser types
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bCef(Browser|Frame|RefPtr)\b'

  - id: load-url-method-call
    desc: Calls LoadURL navigation method
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(^|\.)LoadURL$'

composite_rules:
  - id: cef-load-url-call
    desc: CEF browser navigates to supplied URL
    crit: notable
    conf: 0.96
    all:
      - id: cef-browser-type-reference
      - id: load-url-method-call
    near_bytes: 1200
