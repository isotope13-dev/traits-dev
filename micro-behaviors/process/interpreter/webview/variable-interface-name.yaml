defaults:
  platforms: [android]
  for: [java, kotlin]
traits:
  - id: source-variable-named-javascript-interface
    desc: WebView bridge registered under dynamic name
    crit: notable
    conf: 0.93
    if:
      type: text
      # No parens in the first argument (except constructor calls with simple arguments):
      # otherwise the match slides past an inner comma (constructor parameters) and mistakes
      # a later parameter for the bridge name while the real name is a static literal.
      regex: 'addJavascriptInterface\s*\([^,()]{0,40}(\([^,()]{0,20}\))?[^,()]{0,40},\s*[a-z]\w*\s*\)'
    unless:
      - id: metadata/package/documentation/source::static-analysis-noncompliant-markers
