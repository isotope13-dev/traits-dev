# `ExecuteScript` is the script-injection entry point of WebView2, CEF
# wrappers and game script executors alike.
traits:
- id: execute-script-name
  desc: ExecuteScript method name in code
  for: [pe]
  platforms: [windows, unix]
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: ExecuteScript
    section: .text
  unless:
    - id: metadata/lang/compiled::autoit-compiled-script
