defaults:
  crit: notable
  conf: 0.9
  platforms: [macos, ios]
  for: [macho, dylib]

traits:
  - id: wkwebview-import
    desc: Imports WebKit embedded browser view
    if:
      type: import
      exact: 'OBJC_CLASS_$_WKWebView'

  - id: webview-file-url-selector
    desc: WebView local file load selector reference
    if:
      type: text
      exact: 'loadFileURL:allowingReadAccessToURL:'

  - id: webview-javascript-setting-selector
    desc: WebView JavaScript setting selector reference
    # The selector alone does not distinguish enabling from disabling scripts.
    if:
      type: text
      exact: 'setJavaScriptEnabled:'
