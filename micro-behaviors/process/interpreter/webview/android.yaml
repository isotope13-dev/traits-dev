# Android WebView JavaScript Bridge
# Detects WebView APIs that bridge JavaScript and Java, enabling JS to invoke native code
# Specificity comes from DEX-format Dalvik class name strings (Ldalvik/..., addJavascriptInterface)
# ATT&CK: T1411 (User Interface Spoofing)
defaults:
  platforms: [android]
  for: [apk, binaries]
  crit: notable
  conf: 0.85
  attack: "T1411"

traits:
  - id: source-javascript-interface-import
    desc: Android imports JavaScript bridge annotation
    for: [kotlin, java]
    if:
      type: symbol
      kind: import
      exact: android.webkit.JavascriptInterface

  - id: source-webview-import
    desc: Android source imports WebView
    for: [kotlin, java]
    if:
      type: symbol
      kind: import
      exact: android.webkit.WebView

  - id: source-add-javascript-interface-call
    desc: Android source registers JavaScript bridge
    for: [kotlin, java]
    if:
      type: text
      word: addJavascriptInterface

  - id: source-webview-load-url-call
    desc: Android source loads WebView URL
    for: [kotlin, java]
    if:
      type: text
      regex: '\.\s*loadUrl\s*\('

  - id: source-webview-evaluate-javascript-call
    desc: Android source evaluates JavaScript in a WebView
    for: [kotlin, java]
    if:
      type: symbol
      kind: call
      exact: evaluateJavascript

  - id: source-webview-javascript-enabled
    desc: Android source enables WebView JavaScript
    for: [kotlin, java]
    if:
      type: text
      regex: '\.\s*settings\s*\.\s*javaScriptEnabled\s*=\s*true'

  - id: source-webview-javascript-enabled-call
    desc: Android enables WebView JavaScript
    for: [kotlin, java]
    if:
      type: symbol
      kind: call
      exact: setJavaScriptEnabled

  - id: kotlin-javascript-callback-loadurl
    desc: Kotlin WebView callback JavaScript loadUrl
    for: [kotlin, java]
    if:
      type: text
      regex: 'loadUrl\(\s*jsCode\)|loadUrl\(.{0,120}javascript:'

  - id: add-javascript-interface
    desc: WebView addJavascriptInterface Java-JS bridge
    conf: 0.9
    mbc: "C0048"
    if:
      type: text
      exact: "addJavascriptInterface"

  - id: should-override-url-loading
    desc: WebView navigation intercept callback
    conf: 0.75
    if:
      type: text
      exact: "shouldOverrideUrlLoading"

  - id: webview-class-reference
    desc: Android WebView class reference
    conf: 0.86
    if:
      type: text
      substr: "Landroid/webkit/WebView;"

  - id: load-url-method-name
    desc: loadUrl method-name reference
    crit: baseline
    conf: 0.7
    if:
      type: text
      exact: "loadUrl"

  - id: webview-enable-javascript
    desc: Android WebView JavaScript enabled
    conf: 0.9
    if:
      type: text
      substr: "setJavaScriptEnabled"

  - id: webview-enable-dom-storage
    desc: Android WebView DOM storage enabled
    conf: 0.88
    if:
      type: text
      substr: "setDomStorageEnabled"

  - id: javascript-uri-webview
    desc: WebView javascript URI scheme
    conf: 0.9
    if:
      type: text
      exact: "javascript:"

  - id: load-url-unsafe
    desc: WebView loadUrlUnsafe method reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "loadUrlUnsafe"

  # Injected page script that posts form fields to a Java bridge method.
  # Benign hybrid apps rarely ship a global __sniffer guard plus
  # Android.snifferData; bankers use this for WebView overlays on bank apps.
  - id: webview-form-sniffer-bridge
    desc: WebView form sniffer posts to Android bridge
    crit: suspicious
    conf: 0.95
    attack: T1417.002
    if:
      type: text
      substr: "Android.snifferData"

  - id: webview-sniffer-guard
    desc: WebView form sniffer singleton guard
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "window.__sniffer"

composite_rules:
  - id: source-webview-js-bridge
    desc: Android source registers WebView JavaScript bridge
    crit: notable
    conf: 0.96
    for: [java, kotlin]
    all:
      - id: source-webview-import
      - id: source-add-javascript-interface-call

  - id: source-webview-url-javascript-content
    desc: Android source loads WebView URL with JavaScript
    crit: notable
    conf: 0.96
    for: [java, kotlin]
    all:
      - id: source-webview-import
      - id: source-webview-load-url-call
    any:
      - id: source-webview-javascript-enabled
      - id: source-webview-javascript-enabled-call
    needs: 1

  - id: webview-js-bridge
    desc: Android WebView JavaScript-to-native bridge
    # This is a security-sensitive capability, but is also standard in ad
    # SDKs and hybrid UI. Keep it notable unless a higher-level objective
    # combines it with payload delivery or code execution.
    crit: notable
    conf: 0.88
    mbc: "C0048"
    all:
      - id: webview-class-reference
      - id: add-javascript-interface
    unless:
      - id: well-known/app/system/ankidroid::package-member

  - id: webview-remote-content-shell
    desc: Android WebView remote content shell
    crit: notable
    conf: 0.92
    all:
      - id: webview-class-reference
      - id: load-url-method-name
    any:
      - id: webview-enable-javascript
      - id: webview-enable-dom-storage
      - id: should-override-url-loading
    needs: 2
