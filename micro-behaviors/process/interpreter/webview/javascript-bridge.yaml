# JavaScript in HTML/WebView pages calling injected native bridge objects
defaults:
  platforms: [unix, windows, android]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.85
  attack: T1411

traits:
  - id: javascript-android-bridge-call
    desc: JavaScript invokes Android WebView bridge object
    if:
      type: text
      regex: '\bandroid\.[A-Za-z_][A-Za-z0-9_]*\s*\('
