---
defaults:
  platforms:
  - windows
  for:
  - lnk
traits:
- id: lnk-arg-cmd-c-txt
  desc: LNK cmd arguments name text file
  crit: suspicious
  conf: 0.97
  if:
    type: value
    path: lnk.arguments
    regex: "\\bcmd(\\.exe)?\\s+/c\\s+\\S{1,80}\\.(txt|log|dat)"
    case_insensitive: true
- id: lnk-arg-cmd-c-doc
  desc: LNK cmd arguments name document
  crit: suspicious
  conf: 0.97
  if:
    type: value
    path: lnk.arguments
    regex: "\\bcmd(\\.exe)?\\s+/c\\s+\\S{1,80}\\.(docx?|pdf)"
    case_insensitive: true
