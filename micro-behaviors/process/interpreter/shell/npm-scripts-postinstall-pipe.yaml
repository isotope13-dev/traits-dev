defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: scripts-postinstall-pipe
  desc: Postinstall download and interpreter clues
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/download/cli/curl-wget::scripts-postinstall-pipe-1
  - id: metadata/package/scripts/command::postinstall-interpreter-command
  unless:
  - id: metadata/package/testing/corpus/security-tests::inert-scanner-attack-corpus
  - id: metadata/package/testing/presence/fixture::test-components-package-json-path
  # A deliberately malicious fixture under a scanner test tree is the data
  # its detector asserts on, not a shipped install hook.
