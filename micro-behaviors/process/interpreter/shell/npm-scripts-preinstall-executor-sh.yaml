defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: scripts-preinstall-executor-sh
  desc: Preinstall references sh command
  crit: notable
  conf: 0.75
  # `sh` as a standalone command word in launch position, not a filename
  # (`install.sh`) or a longer interpreter name (`bash`, `dash`): the bare
  # substring fired on version-gate preinstalls whose error text merely
  # mentions a `curl ... | bash` fallback command.
  if:
    type: value
    path: scripts.preinstall
    regex: '(^|[^.\w])sh(\s|[;)$]|$)'
