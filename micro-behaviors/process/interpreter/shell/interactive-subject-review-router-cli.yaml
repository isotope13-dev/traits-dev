defaults:
  platforms: [linux]
  for: [elf]

traits:
  - id: router-cli-shell-entry-sequence
    desc: Router CLI shell-entry command strings
    crit: notable
    conf: 0.97
    if:
      type: raw
      section: .rodata
      # Compilers can merge shell/sh suffixes into linuxshell and other
      # strings. Both layouts retain enable, system and linuxshell in order.
      regex: 'enable\x00{1,4}system\x00{1,4}(shell\x00{1,4}sh\x00{1,4})?linuxshell\x00'
