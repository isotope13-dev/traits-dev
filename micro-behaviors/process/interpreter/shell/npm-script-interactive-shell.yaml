defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  # Lifecycle scripts run without a terminal. An interactive shell flag (-i),
  # alone or combined with other flags, makes the shell read its standard
  # input. Matches "/bin/bash -i -c ...", "sh -ic ..." and similar forms.
  - id: npm-script-interactive-shell
    desc: npm script launches an interactive shell
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: 'scripts[*]'
      regex: '(?i)\b(ba|da|z|k)?sh\s+(-[a-z]+\s+){0,2}-[a-z]*i[a-z]*\b'
