defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: call-comspec
    desc: Call COMSPEC interpreter
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (?im)^\s*@?call\s+%comspec%\b
  - id: call-cmd
    desc: Call cmd interpreter
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?im)^\s*@?call\s+cmd(\.exe)?\s+(%[^*%]|[^%\s])'
