defaults:
  platforms:
  - unix
  - windows
  for: [shell, python, javascript, powershell, c]
traits:
- id: cmd-dotnet-user-string
  desc: cmd .NET user-string literal
  crit: component
  conf: 0.95
  for: [pe, dll]
  if:
    type: hex
    # ECMA-335 #US blob: one-byte payload length, UTF-16LE `cmd`, terminal byte.
    pattern: "07 63 00 6d 00 64 00 00"
    section: text
