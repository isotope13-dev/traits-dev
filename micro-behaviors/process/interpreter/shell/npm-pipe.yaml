defaults:
  for: [package.json]
  platforms: [unix, windows]
traits:
  - id: npm-preinstall-sh-pipe
    desc: Preinstall pipes output to sh
    crit: notable
    conf: 0.85
    if:
      type: value
      path: "scripts.preinstall"
      regex: "\\|\\s*sh\\b"
  - id: npm-preinstall-shell-pipe
    desc: Preinstall pipes output to shell
    crit: notable
    conf: 0.85
    if:
      type: value
      path: "scripts.preinstall"
      regex: "\\|\\s*shell\\b"
