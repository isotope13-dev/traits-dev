# Interactive router CLI shell entry, rather than a shell -c argument.
defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: router-cli-shell-entry-sequence
    desc: Router CLI command table attempts shell entry
    crit: notable
    conf: 0.97
    if:
      type: raw
      section: .rodata
      regex: 'enable\x00{1,4}system\x00{1,4}shell\x00{1,4}sh\x00{1,4}linuxshell\x00'
  - id: router-ping-shell-command
    desc: Ping command appends a shell invocation
    crit: notable
    conf: 0.96
    if:
      type: text
      section: .rodata
      regex: '^ping[ \t]*;[ \t]*sh$'
