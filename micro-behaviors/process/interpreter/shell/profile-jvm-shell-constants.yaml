defaults:
  platforms: [unix, windows]
  for: [java]

traits:
  - id: jvm-windows-shell-name-constant
    desc: JVM Windows command shell constant
    crit: component
    conf: 0.94
    for: [class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)^cmd(\.exe)?$'

  - id: jvm-windows-shell-command-flag
    desc: JVM constant pool contains cmd command flag
    crit: component
    conf: 0.94
    for: [class]
    if:
      type: value
      path: class.strings[*]
      exact: /c

  - id: jvm-c-option-literal
    desc: JVM class contains a -c option literal
    crit: component
    conf: 0.94
    for: [class]
    if:
      type: value
      path: class.strings[*]
      exact: -c

composite_rules:
  - id: jvm-posix-shell-command-flag
    desc: JVM class contains a POSIX shell path and -c option
    crit: component
    conf: 0.94
    for: [class]
    all:
      - id: micro-behaviors/process/interpreter/shell::jvm-c-option-literal
      - id: micro-behaviors/fs/path/binary::jvm-posix-shell-path-constant

