defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: pkgbuild-pkgver-dynamic-shell-clues
    desc: PKGBUILD version function has eval or shell pipeline clues
    crit: suspicious
    conf: 0.94
    near_lines: 20
    all:
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-pkgver-fn-shape
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::shell-eval
      - id: metadata/lang/source/syntax/command/pipeline::pipe-to-shell

