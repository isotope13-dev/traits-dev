---
defaults:
  crit: baseline
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - shell
  - python
  - c
  - cpp
  - rust
  - go
  - javascript
traits:
- id: shell-keyword-marker
  desc: Shell interpreter keyword marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  - macho
  if:
    type: text
    substr: is a shell keyword
- id: shell-builtin-marker
  desc: Shell interpreter builtin marker
  crit: baseline
  conf: 0.9
  for:
  - elf
  - macho
  if:
    type: text
    substr: shell builtin
composite_rules:
- id: shell-interpreter
  desc: Shell keyword or builtin text
  crit: baseline
  conf: 0.9
  for:
  - elf
  - macho
  any:
  - id: micro-behaviors/process/interpreter/shell::shell-keyword-marker
  - id: micro-behaviors/process/interpreter/shell::shell-builtin-marker
