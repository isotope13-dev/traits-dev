# Semantic alphabet lookup; independent of alphabet order, URLs and names.
defaults:
  for: [html, javascript]
  platforms: [windows]
  crit: notable
  conf: 0.98
  size_max: 262144
traits:
  - id: rotating-hex-cmd-exe
    desc: Rotating substitution carries hex cmd.exe
    if:
      type: yara
      source: |
        import "math"
        rule rotating_hex_cmd_exe {
        strings:
        $alphabet = /'([^'\\]|\\.){97}'/
        $argument = /[;}>]\w+\("/
        $slash = /[^\\]\\\\/
        condition:
        #alphabet >= 2 and $argument and
        for any d in (1..#alphabet) : (
        for any e in (1..#alphabet) : (
        @alphabet[e] != @alphabet[d] and
        @alphabet[e] < @alphabet[d]+300 and @alphabet[d] < @alphabet[e]+300 and
        with a = @alphabet[d]+1, b = @alphabet[e]+1 : (
        for any t in (1..#argument) : (
        for any rotation in (0..4) : (
        for any k0 in (0..!alphabet[e]-2) : (
        (k0 == 0 or uint8(b+k0-1) != 92 or (uint16(b+k0-2) == 0x5c5c and uint8(b+k0-3) != 92)) and
        (uint8(b+k0) == 92 or (uint8(b+k0) == 92 and uint8(b+k0+1) == 92)) and
        with oi0 = k0-math.count(92,b,k0)+(#slash in (b-1..b+k0-2)) : (
        for any j0 in (0..!alphabet[d]-2) : (
        (j0 == 0 or uint8(a+j0-1) != 92 or (uint16(a+j0-2) == 0x5c5c and uint8(a+j0-3) != 92)) and
        j0-math.count(92,a,j0)+(#slash in (a-1..a+j0-2)) == (oi0+rotation)%97 and
        for any p in (@argument[t]+!argument[t]..filesize-28) : (
        uint8(p) == uint8(a+j0) and
        (uint8(p) != 92 or uint8(p+1) == uint8(a+j0+1)) and
        (uint8(p-1) != 92 or (uint16(p-2) == 0x5c5c and uint8(p-3) != 92)) and
        for all quote in (@argument[t]+!argument[t]..p-1) : (
        uint8(quote) != 34 or
        (uint8(quote-1) == 92 and uint8(quote-2) != 92) or
        (uint8(quote-1) == 92 and uint16(quote-3) == 0x5c5c and
        uint8(quote-4) != 92)
        ) and
        with q0 = p,
        q1 = q0+1+math.count(92,q0,1),
        q2 = q1+1+math.count(92,q1,1),
        q3 = q2+1+math.count(92,q2,1),
        q4 = q3+1+math.count(92,q3,1),
        q5 = q4+1+math.count(92,q4,1),
        q6 = q5+1+math.count(92,q5,1),
        q7 = q6+1+math.count(92,q6,1),
        q8 = q7+1+math.count(92,q7,1),
        q9 = q8+1+math.count(92,q8,1),
        q10 = q9+1+math.count(92,q9,1),
        q11 = q10+1+math.count(92,q10,1),
        q12 = q11+1+math.count(92,q11,1),
        q13 = q12+1+math.count(92,q12,1),
        q14 = q13+1+math.count(92,q13,1),
        q15 = q14+1+math.count(92,q14,1),
        q16 = q15+1+math.count(92,q15,1),
        q17 = q16+1+math.count(92,q16,1),
        q18 = q17+1+math.count(92,q17,1),
        q19 = q18+1+math.count(92,q18,1),
        q20 = q19+1+math.count(92,q19,1),
        q21 = q20+1+math.count(92,q20,1),
        q22 = q21+1+math.count(92,q21,1),
        q23 = q22+1+math.count(92,q22,1),
        q24 = q23+1+math.count(92,q23,1),
        q25 = q24+1+math.count(92,q24,1),
        q26 = q25+1+math.count(92,q25,1),
        q27 = q26+1+math.count(92,q26,1) : (
        for all n in (1..27) : (
        for any q in (q1,q2,q3,q4,q5,q6,q7,q8,q9,q10,q11,q12,q13,q14,q15,q16,q17,q18,q19,q20,q21,q22,q23,q24,q25,q26,q27) : (
        ((n == 1 and q == q1) or
        (n == 2 and q == q2) or
        (n == 3 and q == q3) or
        (n == 4 and q == q4) or
        (n == 5 and q == q5) or
        (n == 6 and q == q6) or
        (n == 7 and q == q7) or
        (n == 8 and q == q8) or
        (n == 9 and q == q9) or
        (n == 10 and q == q10) or
        (n == 11 and q == q11) or
        (n == 12 and q == q12) or
        (n == 13 and q == q13) or
        (n == 14 and q == q14) or
        (n == 15 and q == q15) or
        (n == 16 and q == q16) or
        (n == 17 and q == q17) or
        (n == 18 and q == q18) or
        (n == 19 and q == q19) or
        (n == 20 and q == q20) or
        (n == 21 and q == q21) or
        (n == 22 and q == q22) or
        (n == 23 and q == q23) or
        (n == 24 and q == q24) or
        (n == 25 and q == q25) or
        (n == 26 and q == q26) or
        (n == 27 and q == q27)) and
        for any k in (0..!alphabet[e]-2) : (
        (k == 0 or uint8(b+k-1) != 92 or (uint16(b+k-2) == 0x5c5c and uint8(b+k-3) != 92)) and
        ((n == 1 and (uint8(b+k) == 120 or (uint8(b+k) == 92 and uint8(b+k+1) == 120))) or
        (n == 2 and (uint8(b+k) == 54 or (uint8(b+k) == 92 and uint8(b+k+1) == 54))) or
        (n == 3 and (uint8(b+k) == 51 or (uint8(b+k) == 92 and uint8(b+k+1) == 51))) or
        (n == 4 and (uint8(b+k) == 92 or (uint8(b+k) == 92 and uint8(b+k+1) == 92))) or
        (n == 5 and (uint8(b+k) == 120 or (uint8(b+k) == 92 and uint8(b+k+1) == 120))) or
        (n == 6 and (uint8(b+k) == 54 or (uint8(b+k) == 92 and uint8(b+k+1) == 54))) or
        (n == 7 and (uint8(b+k) == 100 or uint8(b+k) == 68 or (uint8(b+k) == 92 and (uint8(b+k+1) == 100 or uint8(b+k+1) == 68)))) or
        (n == 8 and (uint8(b+k) == 92 or (uint8(b+k) == 92 and uint8(b+k+1) == 92))) or
        (n == 9 and (uint8(b+k) == 120 or (uint8(b+k) == 92 and uint8(b+k+1) == 120))) or
        (n == 10 and (uint8(b+k) == 54 or (uint8(b+k) == 92 and uint8(b+k+1) == 54))) or
        (n == 11 and (uint8(b+k) == 52 or (uint8(b+k) == 92 and uint8(b+k+1) == 52))) or
        (n == 12 and (uint8(b+k) == 92 or (uint8(b+k) == 92 and uint8(b+k+1) == 92))) or
        (n == 13 and (uint8(b+k) == 120 or (uint8(b+k) == 92 and uint8(b+k+1) == 120))) or
        (n == 14 and (uint8(b+k) == 50 or (uint8(b+k) == 92 and uint8(b+k+1) == 50))) or
        (n == 15 and (uint8(b+k) == 69 or uint8(b+k) == 101 or (uint8(b+k) == 92 and (uint8(b+k+1) == 69 or uint8(b+k+1) == 101)))) or
        (n == 16 and (uint8(b+k) == 92 or (uint8(b+k) == 92 and uint8(b+k+1) == 92))) or
        (n == 17 and (uint8(b+k) == 120 or (uint8(b+k) == 92 and uint8(b+k+1) == 120))) or
        (n == 18 and (uint8(b+k) == 54 or (uint8(b+k) == 92 and uint8(b+k+1) == 54))) or
        (n == 19 and (uint8(b+k) == 53 or (uint8(b+k) == 92 and uint8(b+k+1) == 53))) or
        (n == 20 and (uint8(b+k) == 92 or (uint8(b+k) == 92 and uint8(b+k+1) == 92))) or
        (n == 21 and (uint8(b+k) == 120 or (uint8(b+k) == 92 and uint8(b+k+1) == 120))) or
        (n == 22 and (uint8(b+k) == 55 or (uint8(b+k) == 92 and uint8(b+k+1) == 55))) or
        (n == 23 and (uint8(b+k) == 56 or (uint8(b+k) == 92 and uint8(b+k+1) == 56))) or
        (n == 24 and (uint8(b+k) == 92 or (uint8(b+k) == 92 and uint8(b+k+1) == 92))) or
        (n == 25 and (uint8(b+k) == 120 or (uint8(b+k) == 92 and uint8(b+k+1) == 120))) or
        (n == 26 and (uint8(b+k) == 54 or (uint8(b+k) == 92 and uint8(b+k+1) == 54))) or
        (n == 27 and (uint8(b+k) == 53 or (uint8(b+k) == 92 and uint8(b+k+1) == 53)))) and
        with oi = k-math.count(92,b,k)+(#slash in (b-1..b+k-2)) : (
        for any j in (0..!alphabet[d]-2) : (
        (j == 0 or uint8(a+j-1) != 92 or (uint16(a+j-2) == 0x5c5c and uint8(a+j-3) != 92)) and
        j-math.count(92,a,j)+(#slash in (a-1..a+j-2)) == (oi+rotation)%97 and
        uint8(q) == uint8(a+j) and
        (uint8(q) != 92 or uint8(q+1) == uint8(a+j+1))
        )
        )
        )
        )
        )
        )
