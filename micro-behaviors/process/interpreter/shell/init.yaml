defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript, c, cpp, elf, macho]
  crit: notable
  conf: 0.84

traits:
  - id: bin-sh
    desc: /bin/sh shell interpreter path reference
    crit: notable
    conf: 0.6
    platforms: [unix]
    for: [scripts, binaries, c]
    if:
      type: literal
      regex: '(^|[^A-Za-z0-9_/.+-])/bin/sh($|[^A-Za-z0-9._-])'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog

  - id: shell-init-path
    desc: Shell startup file path reference
    if:
      type: string_literal
      regex: '([~/]\.bash_profile|[~/]\.bashrc|[~/]\.profile)\b'
    unless:
      - id: micro-behaviors/ui/help::shell-profile-setup-instruction
      - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context

  - id: system-profile-path
    desc: System-wide shell profile path reference
    if:
      type: text
      # Do not match the `/etc/profile` prefix of a more specific profile.d
      # path; that path has its own atom immediately below.
      regex: '/etc/profile($|[^.A-Za-z0-9_])'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context

  - id: system-profiled-path
    desc: System-wide shell profile.d path reference
    if:
      type: text
      regex: '/etc/profile\.d(/|\b)'

  - id: system-bashrc-path
    desc: System-wide Bash rc path reference
    if:
      type: text
      regex: '/etc/(bash\.)?bashrc\b'

  - id: system-zshrc-path
    desc: System-wide Zsh rc path reference
    if:
      type: text
      regex: '/etc/(zsh/)?zshrc\b'

  - id: system-fish-config-path
    desc: System-wide Fish config path reference
    if:
      type: text
      regex: '/etc/fish/config\.fish\b'
