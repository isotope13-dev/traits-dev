# A Java expression-language fragment (OGNL, SpEL, MVEL and similar share
# this syntax) that constructs a fully-qualified service object and calls
# its command-execution method. As observed text this is a command
# execution capability; whether it is application code, a configuration
# expression, or an injected payload is decided by delivery context in
# objectives. The proximity window tolerates the fragment boundary when
# an exploit script concatenates the expression from adjacent
# host-language string literals.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, json, html, jsp]
  crit: notable
  conf: 0.95

traits:
  - id: fqcn-object-construction
    desc: Constructs fully-qualified Java object
    if:
      type: text
      regex: 'new\s+([A-Za-z_$][\w$]*\.){2,}[A-Za-z_$][\w$]*\s*\(\s*\)'

  - id: command-method-invocation
    desc: Invokes a command execution method
    attack: T1059
    if:
      type: text
      regex: '\.\s*(execute|run|exec)[A-Za-z]*Command\s*\('

composite_rules:
  - id: java-expression-new-service-command-call
    desc: Java expression constructs command service
    crit: notable
    conf: 0.95
    attack: T1059
    near_bytes: 192
    all:
      - id: fqcn-object-construction
      - id: command-method-invocation
