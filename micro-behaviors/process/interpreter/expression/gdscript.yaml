# Godot GDScript Expression-based eval. Used by editor/game HTTP debug bridges
# for live scripting; dual-use with agent skill tooling.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, text, scripts]
  crit: notable
  conf: 0.93

traits:
  - id: gdscript-expression-new
    desc: Instantiates Godot Expression evaluator
    if:
      type: text
      regex: '\bExpression\.new\s*\(\s*\)'

  - id: gdscript-expression-execute
    desc: Executes a Godot Expression
    conf: 0.95
    if:
      type: text
      regex: '\bExpression\.new\s*\([\s\S]{0,400}\.execute\s*\('
