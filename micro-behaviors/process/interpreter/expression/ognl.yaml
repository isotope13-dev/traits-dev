# OGNL static access syntax: @fully.qualified.ClassName@member (or @class for
# the class literal). Reaching a class or static member from an expression
# is the step that puts JDK types such as ProcessBuilder in scope; ordinary
# OGNL property navigation does not use this form.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, json, html, jsp]
  crit: notable
  conf: 0.95

traits:
  - id: ognl-static-class-reference
    desc: OGNL references Java class or static member
    if:
      type: text
      regex: '@[A-Za-z_$][\w.$]{0,60}\.[\w.$]{0,60}@[A-Za-z_$][\w$]*\b'
