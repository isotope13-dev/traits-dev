# OLE string-table fields are absent from Atomscan 3.0 text extraction.
defaults:
  for: [msi, oledoc]
  platforms: [windows]
  crit: notable

traits:
  - id: msi-silent-vbs-launch-arguments
    desc: Silent VBS launcher arguments in MSI
    if:
      type: raw
      regex: '//B\s+//Nologo\s+"[^"\r\n]{1,100}\.vbs"\s+"'
      case_insensitive: true
