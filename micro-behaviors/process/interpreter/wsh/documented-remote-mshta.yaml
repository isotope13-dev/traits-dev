defaults:
  platforms: [windows]
  for: [markdown]
  crit: notable

traits:
  # Match a command line, including fenced or indented code, rather than
  # prose that merely discusses the interpreter. The served bytes and any
  # execution remain unknown.
  - id: documented-remote-mshta-command
    desc: Documents remote MSHTA command
    conf: 0.98
    attack: T1218.005
    if:
      type: text
      regex: '(?im)^[ \t]*mshta(\.exe)?[ \t]+["'']?https?://[^\s"''`]{1,200}'
