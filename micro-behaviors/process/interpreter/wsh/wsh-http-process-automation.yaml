defaults:
  platforms: [windows]
  for: [scripts, binaries]
composite_rules:
  - id: wsh-http-process-automation
    desc: WScript, process method and HTTP COM references
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/os/com/automation::wsh-automation-progid
      - id: micro-behaviors/process/interpreter/wsh::wsh-process-method
    any:
      - id: micro-behaviors/communications/http/client/xmlhttp::msxml-http-variants
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
