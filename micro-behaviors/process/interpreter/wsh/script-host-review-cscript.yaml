defaults:
  platforms: [windows]
  for: [batch]
  attack: T1059.005
traits:
  - id: cscript-nologo
    desc: cscript launched without logo banner
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: (?i)\bcscript(\.exe)?\b[^\n]{0,80}/nologo\b

  - id: js-cscript-nologo
    desc: JavaScript references cscript //nologo
    for: [javascript, typescript]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)['"]cscript(\.exe)?['"][^\n]{0,60}['"]//nologo['"]
