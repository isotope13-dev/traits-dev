defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.95

traits:
  - id: php-pdo-fetch-callback
    desc: Fetches database rows through a callback
    if:
      type: tree-sitter
      node: member_call_expression
      regex: '(?i)^[$\w>:-]+->fetchall\s*\(\s*PDO::FETCH_FUNC\b'
