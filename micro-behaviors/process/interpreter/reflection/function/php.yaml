defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.95

traits:
  - id: php-reflection-function
    desc: Inspects a PHP function through reflection
    if:
      type: tree-sitter
      node: object_creation_expression
      regex: '(?i)^new\s+\\?ReflectionFunction\s*\('
  - id: php-pdo-fetch-callback
    desc: Fetches database rows through a callback
    if:
      type: tree-sitter
      node: member_call_expression
      regex: '(?i)^[$\w>:-]+->fetchall\s*\(\s*PDO::FETCH_FUNC\b'
