defaults:
  platforms: [windows, unix]
  for: [pe, csharp]
  crit: notable

traits:
  - id: vb-newlatebinding
    desc: VB NewLateBinding dispatch helper
    conf: 0.92
    if:
      type: text
      word: NewLateBinding
    unless:
      - id: metadata/signed/platform::microsoft

  - id: vb-lateget-token
    desc: VB LateGet dispatch token
    crit: component
    conf: 0.9
    if:
      type: text
      word: LateGet

  - id: resolveeventhandler-token
    desc: ResolveEventHandler delegate token
    crit: component
    conf: 0.88
    if:
      type: text
      word: ResolveEventHandler

  - id: vb-latecall-token
    desc: VB late binding token
    crit: component
    conf: 0.86
    if:
      type: text
      exact: LateCall

  - id: vb-callbyname-token
    desc: VB CallByName late binding
    crit: component
    conf: 0.86
    if:
      type: hex
      section: .text
      pattern: 43 61 6C 6C 42 79 4E 61 6D 65
