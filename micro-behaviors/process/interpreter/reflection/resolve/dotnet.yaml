defaults:
  platforms: [windows, unix]
  for: [pe, csharp]
  crit: notable

traits:
  - id: assembly-load
    desc: .NET loads an assembly by name
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: Assembly.Load

  - id: assembly-load-file
    desc: .NET loads an assembly from a file
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: Assembly.LoadFile

  - id: assembly-load-buffer
    desc: .NET loads an assembly from bytes
    crit: notable
    conf: 0.9
    for: [pe, csharp, asp, html, javascript, powershell]
    if:
      type: text
      regex: '(System\.Reflection\.)?Assembly\.Load\s*\(\s*[A-Za-z_][A-Za-z0-9_]*\s*\)'

  # Evasive managed loaders resolve `Load` reflectively
  # (`GetMethod("Load").Invoke(bytes)`) so no `Assembly.Load` reference
  # appears for static matching; the Behinder ASP.NET template does this.
  - id: assembly-load-reflected-name
    desc: .NET resolves the Load method by name
    crit: notable
    conf: 0.92
    for: [csharp, asp, html, powershell]
    if:
      type: text
      regex: 'GetMethod\s*\(\s*["'']Load["'']'

  - id: resolve-method
    desc: Resolves .NET method metadata token
    conf: 0.82
    if:
      type: text
      word: ResolveMethod

  - id: resolve-type
    desc: Resolves .NET type metadata token
    conf: 0.82
    if:
      type: text
      word: ResolveType

  - id: get-fields-call
    desc: .NET GetFields reflection method reference
    conf: 0.72
    if:
      type: text
      word: GetFields
    unless:
      - id: metadata/lang/compiler/managed::delphi

composite_rules:
  - id: resolver-token-pair
    desc: Multiple .NET reflection resolver APIs
    crit: notable
    conf: 0.72
    needs: 2
    any:
      - id: resolve-method
      - id: resolve-type
      - id: get-fields-call
      - id: micro-behaviors/process/interpreter/reflection/runtime::create-delegate

  - id: resolver-api-cluster
    for: [pe]
    desc: .NET reflection metadata resolver cluster
    crit: notable
    conf: 0.91
    all:
      - id: metadata/lang/compiler/managed::reflection-namespace
      - id: resolver-token-pair
    downgrade:
      any:
        - id: metadata/binary/framework::dotnet-metadata
        - id: metadata/signed/platform::microsoft
        - id: well-known/tool/development/toolchain/microsoft-csharp-compiler/
