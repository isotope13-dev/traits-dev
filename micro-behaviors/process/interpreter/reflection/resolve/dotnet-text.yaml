defaults:
  platforms: [windows]
  for: [pe, csharp]
  crit: notable

traits:
  - id: assembly-load-text
    desc: .NET Assembly.Load reference
    if:
      type: text
      substr: Assembly.Load

  - id: type-gettype-call
    desc: .NET Type.GetType call
    if:
      # Anchored: a bare substring also matched `Type.GetTypeCode(typeof(T))`,
      # a compile-time type-code switch that resolves nothing dynamically.
      type: text
      regex: '\bType\.GetType\s*\('
