# Clojure resolves names to vars and classes at runtime, and that is the hinge
# every Clojure loader turns on: a symbol built from a string, handed to
# `resolve`/`requiring-resolve`/`Class/forName`, yields a callable the reader
# never named. Macro-heavy libraries use the same calls legitimately (a macro
# inspects the tag metadata of its arguments at expansion time), so these are
# neutral capabilities — the intent comes from what the resolved value is fed.
#
# Clojure had no trait coverage at all before this file, which meant a .clj/.jar
# payload rendered as nothing. `type: symbol, kind: call` reads the call targets
# the walker already extracts from Clojure forms, so it sees `(resolve sym)` but
# not the word "resolve" in a docstring or a local function named `resolve-path`.
defaults:
  platforms: [unix, windows]
  for: [clojure]
  crit: notable
  conf: 0.9

traits:
  # `resolve` and `ns-resolve` look a var up in an already-loaded namespace.
  # Two spellings of one operation, so one trait.
  - id: clojure-var-resolve
    desc: Resolves a Clojure var at runtime
    if:
      type: text
      # Require ns-resolve, or resolve of a quoted var name. Bare `(resolve env
      # input)` is a local function call (Pathom resolvers, Promise callbacks).
      regex: '\((ns-resolve\s|(clojure\.core/)?resolve\s+'')'

  # `requiring-resolve` additionally *loads* the namespace first, so it can pull
  # in code that no `:require` in the file declares.
  - id: clojure-requiring-resolve
    desc: Loads a namespace to resolve a var
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: requiring-resolve

  # `(Class/forName "…")` reaches any JVM class on the classpath by name,
  # including ones the `:import` clause never mentions.
  - id: clojure-class-for-name
    desc: Loads a JVM class by name
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '^(java\.lang\.)?Class/forName$'

  # `clojure.lang.RT` is the Clojure runtime's own internal entry point; calling
  # into it directly bypasses the public API a reader would expect.
  - id: clojure-runtime-rt-call
    desc: Calls the Clojure RT runtime class directly
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '^(clojure\.lang\.)?RT/'
