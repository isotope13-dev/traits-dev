defaults:
  platforms: [windows, unix]
  for: [pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: clr-method-pointer-resolution
    desc: CLR resolves methods to function pointers
    if:
      type: metrics
      field: pe.clr.resolver_pointer_method_count
      min: 1

  - id: clr-many-pointer-resolvers
    desc: CLR has 16+ method pointer resolvers
    if:
      type: metrics
      field: pe.clr.resolver_pointer_method_count
      min: 16
