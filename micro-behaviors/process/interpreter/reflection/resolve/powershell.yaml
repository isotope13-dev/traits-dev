defaults:
  platforms: [unix, windows]
  for: [powershell]
  crit: notable
  conf: 0.9

traits:
  - id: powershell-assembly-load
    desc: PowerShell loads a .NET assembly
    if:
      type: text
      regex: '(?i)\[(System\.)?Reflection\.Assembly\]::Load\('
    not:
      - substr: 'SharpZipLib.dll'

  - id: powershell-reflected-byte-assembly-load
    desc: Reflects Assembly.Load for a byte array
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)GetMethod\s*\(\s*["'']Load["'']\s*,\s*\[Type\[\]\]@\(\[byte\[\]\]'

  - id: powershell-fragmented-reflection-assembly
    desc: Fragmented System.Reflection.Assembly type
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)["'']Syst["'']\s*\+\s*["'']em\.Reflec'

  - id: powershell-assembly-load-partial
    desc: PowerShell loads a .NET assembly partially
    if:
      type: text
      regex: '(?i)\[System\.Reflection\.Assembly\]::LoadWithPartialName\('

  # Typed helpers (PhantomGate-style Add-Type stubs) expose LoadAssembly
  # rather than Assembly::Load directly — still in-memory assembly load.
  - id: powershell-typed-loadassembly
    desc: PowerShell typed LoadAssembly helper call
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)::LoadAssembly\s*\('
