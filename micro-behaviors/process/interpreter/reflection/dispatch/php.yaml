defaults:
  platforms: [windows, unix]
  for: [php]

traits:
  # Neutral PHP dynamic dispatch capabilities. `$var()` and `$obj->$method()`
  # are how PHP frameworks invoke handlers/getters/setters — a capability, not
  # obfuscation. Obfuscation/webshell/dropper composites reference these and add
  # the intent-specific evidence (string arrays, remote loaders, user hiding).
  - id: dynamic-function-execution
    desc: PHP invokes a variable-named function
    crit: notable
    if:
      type: tree-sitter
      # The #not-match predicate skips common framework callable variable names.
      query: |
        (function_call_expression
          function: (variable_name (name) @var)
          (#not-match? @var "^(handler|handlers|errorHandler|exceptionHandler|logger|callback|closure|next|middleware|listener|fn|callable|resolver|factory|visitor|walker|childMapper|mapper|mutator|canonicalize|decodeT|append|pass|fail|warn|check|checkNode|extractText|shouldStop|stripPunct|stripCoordPunct|securitySource|on[A-Z][A-Za-z0-9_]*)$"))
    unless:
      - type: text
        regex: "@package WordPress|ABSPATH\\s*\\.\\s*(WPINC|['\"]wp-admin/)"
      - type: text
        regex: "WP_UnitTestCase|@group\\s+[A-Za-z0-9_-]+"
      - type: text
        regex: "\\bClosure\\s+\\$next\\b"
      - type: text
        regex: 'namespace\s+Composer\\Autoload;[\s\S]{0,1200}class\s+ClassLoader'
      - type: text
        substr: '@generated by Composer'
      - id: metadata/library/web-frameworks/
      - id: metadata/package/testing/harness/unit/
  - id: dynamic-call-with-get-data
    desc: PHP dynamic call receives GET data
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\$[A-Za-z_][A-Za-z0-9_]*\s*\[[^\]\r\n]{1,80}\]\s*\([^;\r\n]{0,220}\bINPUT_GET\b'
  - id: array-index-dynamic-call
    desc: PHP array-indexed variable function call
    crit: notable
    # `$arr[N](...)` — a call whose target is an integer-indexed array element,
    # the shape produced when a `preg_match`/`explode` capture drives the callee
    # (`$matches[1]($matches[2])`). Neutral dynamic-dispatch capability on its
    # own (dispatch tables use it); webshell composites add the request-data
    # context that makes it an RCE sink.
    if:
      type: text
      regex: '\$[A-Za-z_]\w*\s*\[\s*\d+\s*\]\s*\('
    # scssphp (and similar compilers) embed `$value[1]($args)` inside a
    # double-quoted string as an interpolation template — not a live call.
    # Matched evidence is the call-shaped prefix `$value[1](`.
    not:
      - exact: '$value[1]('
  - id: dynamic-object-method-call
    desc: PHP invokes a variable-named object method
    crit: baseline
    # `$obj->$name(...)` — a method call whose name is a variable (dynamic
    # dispatch). Common, neutral capability in legit OOP PHP (WooCommerce/WP
    # magic getters/setters), so baseline (always in ML, not surfaced
    # standalone); webshell/dropper composites combine it with intent evidence.
    if:
      type: text
      regex: '\$\w+\s*->\s*\$\w+\s*\('

  # PHP libraries commonly build a class-method callable from a fixed method
  # name and pass it to a callback dispatcher. This records dynamic execution
  # without assigning webshell or obfuscation intent to the construction.
  - id: concatenated-callback-dispatch
    desc: PHP dispatches a concatenated callable name
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        (function_call_expression
          function: (name) @fn
          arguments: (arguments
            (argument
              (binary_expression operator: ".")))
          (#any-of? @fn
            "call_user_func" "call_user_func_array"
            "forward_static_call" "forward_static_call_array"))
