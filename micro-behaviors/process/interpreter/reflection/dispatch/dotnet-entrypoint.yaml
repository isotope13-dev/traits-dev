defaults:
  platforms: [windows]
  crit: notable

traits:
  - id: entrypoint-invoke-text
    desc: .NET EntryPoint.Invoke reference
    for: [csharp]
    conf: 0.9
    if:
      type: text
      substr: EntryPoint.Invoke

composite_rules:
  - id: dotnet-reflective-entrypoint-invoke
    desc: .NET reflectively invokes a method
    conf: 0.92
    for: [csharp, pe, dll]
    any:
      - id: micro-behaviors/process/interpreter/reflection/dispatch::entrypoint-invoke-text
      - id: micro-behaviors/process/interpreter/reflection/runtime::invoke-member-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::dotnet-reflected-method-invoke
