# Google Colab Runtime Capabilities
# Detects interactions with Google Colab specific APIs
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
traits:
  - id: register-callback
    desc: Colab callback-registration API reference
    if:
      type: text
      regex: 'google\.colab\.output\.register_callback|output\.register_callback'
  - id: invoke-function
    desc: Colab browser-to-kernel invocation reference
    if:
      type: text
      substr: "google.colab.kernel.invokeFunction"
  - id: browser-display-html-forward
    desc: IPython display after a Colab reference
    if:
      type: text
      regex: 'google\.colab[\s\S]{0,240}IPython\.display'
  - id: browser-display-html-reverse
    desc: IPython display before a Colab reference
    if:
      type: text
      regex: 'IPython\.display[\s\S]{0,240}google\.colab'
composite_rules:
  - id: browser-display-html
    desc: Colab and IPython display references
    crit: notable
    any:
      - id: browser-display-html-forward
      - id: browser-display-html-reverse
  - id: browser-recon-bridge
    desc: Colab callback and display bridge references
    crit: notable
    all:
      - id: micro-behaviors/process/interpreter/reflection/dispatch::register-callback
      - id: micro-behaviors/process/interpreter/reflection/dispatch::browser-display-html
    any:
      - id: micro-behaviors/process/interpreter/reflection/dispatch::invoke-function
      - id: micro-behaviors/communications/http/download/curl::fetch-call
