defaults:
  platforms: [windows]
  for: [pyc]

composite_rules:
  - id: pyc-clr-invoke-name-cluster
    desc: Python bytecode contains CLR and Invoke member names
    crit: component
    conf: 0.86
    all:
      - id: micro-behaviors/process/interpreter/runtime/clr::pyc-clr-name
      - id: "micro-behaviors/process/interpreter/reflection/runtime::invoke-member-name"
