defaults:
  platforms:
  - unix
  - windows
  for:
  - powershell
  crit: notable
composite_rules:
- id: ps-decode-and-load
  desc: PowerShell decode and reflective load
  conf: 0.95
  all:
  - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load
  - id: metadata/lang/source/naming/resource::dotnet-frombase64string-text
- id: ps-reflective-load
  desc: PowerShell reflective assembly loading
  conf: 0.93
  all:
  - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load
  any:
  - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-entrypoint-invoke
  - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-method-invoke
  unless:
  - id: well-known/app/infrastructure/ansible::ansible-powershell-provenance
- id: reflective-dotnet-loader
  desc: PowerShell reflective .NET loader
  conf: 0.95
  all:
  - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load
  - id: metadata/lang/source/naming/resource::dotnet-frombase64string-text
  any:
  - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-entrypoint-invoke
  - id: metadata/lang/scripted::invoke-prefixed-cmdlet-name
  - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-assembly-method-invoke
