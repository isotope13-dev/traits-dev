defaults:
  platforms: [windows]
  for: [pe, csharp]
  crit: notable
traits:
  - id: assembly-resolve-event-api
    desc: AssemblyResolve event subscription API reference
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: AppDomain\.CurrentDomain\.AssemblyResolve \+=|add_AssemblyResolve

composite_rules:
  - id: resource-resolver-text-output-api-surface
    desc: Resource/resolver/text-write APIs co-occur
    for: [pe]
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/interpreter/reflection/runtime::assembly-resolve-event-api
      - id: micro-behaviors/fs/write/file/full::dotnet-writealltext-token
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
      - id: metadata/binary/resource/size::dotnet-large-high-entropy-managed-resource

