defaults:
  platforms: [windows, unix]
  for: [pe, csharp]
  crit: notable

traits:
  - id: activator
    desc: .NET Activator type reference
    conf: 0.8
    if:
      type: text
      word: Activator
    unless:
      - id: well-known/game/mod::bedrockboot-source-repository
  - id: activator-create
    desc: .NET creates an object through Activator
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: Activator.CreateInstance
    unless:
      - id: well-known/game/mod::bedrockboot-source-repository

  - id: emit-il-instruction
    desc: .NET emits an intermediate-language instruction
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '(^|\.)Emit$'

  - id: create-delegate
    desc: Creates .NET reflection delegate
    conf: 0.8
    if:
      type: text
      word: CreateDelegate
  - id: dynamic-method-api-token
    desc: References the .NET DynamicMethod API
    crit: notable
    conf: 0.8
    for: [pe, dll, csharp]
    if:
      type: text
      word: DynamicMethod

  - id: appdomain-currentdomain
    desc: .NET AppDomain CurrentDomain accessor
    crit: component
    conf: 0.6
    for: [pe, dll, csharp]
    if:
      type: text
      exact: get_CurrentDomain

  - id: metadata-token
    desc: .NET MetadataToken member reference
    crit: component
    conf: 0.7
    for: [pe, dll, csharp]
    if:
      type: text
      word: MetadataToken

  - id: method-info-class
    desc: .NET MethodInfo class reference
    conf: 0.8
    if:
      type: text
      substr: System.Reflection.MethodInfo

  # Relocated from objectives/anti-static/obfuscation/reflection/invoke, where
  # these two sat while their identical sibling `method-info-class` above lived
  # here. All three matchers do the same thing — spot a `System.Reflection.*`
  # type name in the strings — and naming a reflection type is a neutral
  # capability, not evidence of obfuscation: every .NET assembly that carries
  # System.Private.CoreLib metadata has these names in it, self-contained
  # single-file publishes included. The obfuscation reading comes from the
  # composites that pair them with a loader or a decoder, and those reference
  # these atoms across directories.
  - id: property-info-class
    desc: .NET PropertyInfo class reference
    conf: 0.8
    if:
      type: text
      substr: System.Reflection.PropertyInfo

  - id: type-info-class
    desc: .NET TypeInfo class reference
    conf: 0.8
    if:
      type: text
      word: System.Reflection.TypeInfo

  - id: methodbase-class
    desc: .NET MethodBase class reference
    conf: 0.75
    if:
      type: text
      exact: MethodBase

  - id: invoke-member-token
    desc: .NET InvokeMember method reference
    conf: 0.82
    if:
      type: text
      exact: InvokeMember

  # Same runtime-agnostic caveat as get-method-token below: Delphi's
  # System.Rtti exposes TRttiField.SetValue, and SetValue is also an ordinary
  # member name in Array, WPF DependencyObject and countless wrappers. The bare
  # token shows a member-assignment name, not that the CLR is in use, so the
  # .NET composites referencing it supply their own CLR anchor.
  - id: field-setvalue-token
    desc: References the SetValue member name
    crit: component
    conf: 0.6
    if:
      type: text
      exact: SetValue

  - id: underlying-system-type-token
    desc: .NET reflection accesses underlying system type
    crit: notable
    conf: 0.84
    if:
      type: text
      exact: UnderlyingSystemType

  - id: get-properties-token
    desc: GetProperties member-name token
    crit: component
    conf: 0.6
    if:
      type: text
      word: GetProperties

  - id: invoke-token
    desc: References the .NET Invoke member name
    crit: component
    conf: 0.66
    if:
      type: text
      exact: Invoke

  - id: get-methods-token
    desc: GetMethods member-name token
    crit: component
    conf: 0.65
    if:
      type: text
      word: GetMethods

  - id: create-instance-token
    desc: CreateInstance member-name token
    crit: component
    conf: 0.8
    if:
      type: text
      word: CreateInstance

  - id: begin-invoke-token
    desc: BeginInvoke member-name token
    crit: component
    conf: 0.7
    if:
      type: text
      word: BeginInvoke

  - id: end-invoke-token
    desc: EndInvoke member-name token
    crit: component
    conf: 0.7
    if:
      type: text
      word: EndInvoke

  - id: csharp-reflection-method-lookup
    desc: C# resolves a reflected method
    crit: notable
    conf: 0.9
    for: [csharp]
    if:
      type: text
      word: GetMethod

  - id: csharp-reflection-invoke-call
    desc: C# calls an Invoke member
    crit: notable
    conf: 0.9
    for: [csharp]
    if:
      type: text
      regex: '\.Invoke\s*\('

composite_rules:
  # Runtime-agnostic on purpose: Delphi's System.Rtti exposes the same
  # GetMethod/GetMethods/MethodInfo names as .NET reflection, so these tokens
  # show reflection member lookup without identifying which runtime. The .NET
  # composites that build on it supply the CLR anchor themselves.
  - id: reflection-method-access
    desc: Reflection method-enumeration tokens
    crit: notable
    conf: 0.78
    needs: 2
    any:
      - id: method-info-class
      - id: metadata/lang/compiler/managed::get-method-token
      - id: get-methods-token

  - id: csharp-assembly-load-reflected-invoke
    desc: C# loads bytes for reflected method invocation
    crit: notable
    conf: 0.96
    attack: T1620
    for: [csharp]
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/interpreter/reflection/resolve::assembly-load
      - id: csharp-reflection-method-lookup
      - id: csharp-reflection-invoke-call

  - id: delegate-invocation-chain
    desc: .NET reflected delegate invocation
    crit: notable
    conf: 0.88
    all:
      - id: create-delegate
      - id: metadata/lang/compiler/managed::reflection-namespace
      - id: reflection-method-access
    any:
      - id: begin-invoke-token
      - id: end-invoke-token
