defaults:
  platforms: [windows, unix]
  for: [pe, csharp]
  crit: notable

traits:
  - id: activator-create
    desc: .NET creates an object through Activator
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: Activator.CreateInstance
    unless:
      - id: well-known/game/mod::bedrockboot-source-repository


  - id: dynamic-method-api-token
    desc: References the .NET DynamicMethod API
    crit: notable
    conf: 0.8
    for: [pe, dll, csharp]
    if:
      type: text
      word: DynamicMethod

  - id: get-entrypoint-token
    desc: .NET Assembly entry point accessor reference
    conf: 0.7
    for: [pe, dll, csharp]
    if:
      type: text
      exact: get_EntryPoint

  - id: activator-createinstance-token
    desc: .NET Activator.CreateInstance API reference
    conf: 0.8
    for: [pe, dll, csharp]
    if:
      type: text
      substr: Activator.CreateInstance

  - id: metadata-token
    desc: .NET MetadataToken member reference
    crit: notable
    conf: 0.7
    for: [pe, dll, csharp]
    if:
      type: text
      word: MetadataToken

  - id: method-info-class
    desc: .NET MethodInfo class reference
    conf: 0.8
    if:
      type: text
      substr: System.Reflection.MethodInfo

  # Relocated from objectives/anti-static/obfuscation/reflection/invoke, where
  # these two sat while their identical sibling `method-info-class` above lived
  # here. All three matchers do the same thing — spot a `System.Reflection.*`
  # type name in the strings — and naming a reflection type is a neutral
  # capability, not evidence of obfuscation: every .NET assembly that carries
  # System.Private.CoreLib metadata has these names in it, self-contained
  # single-file publishes included. The obfuscation reading comes from the
  # composites that pair them with a loader or a decoder, and those reference
  # these atoms across directories.
  - id: property-info-class
    desc: .NET PropertyInfo class reference
    conf: 0.8
    if:
      type: text
      substr: System.Reflection.PropertyInfo

  - id: type-info-class
    desc: .NET TypeInfo class reference
    conf: 0.8
    if:
      type: text
      word: System.Reflection.TypeInfo

  # Same runtime-agnostic caveat as get-method-token below: Delphi's
  # System.Rtti exposes TRttiField.SetValue, and SetValue is also an ordinary
  # member name in Array, WPF DependencyObject and countless wrappers. The bare
  # token shows a member-assignment name, not that the CLR is in use, so the
  # .NET composites referencing it supply their own CLR anchor.
  - id: underlying-system-type-token
    desc: .NET reflection accesses underlying system type
    crit: notable
    conf: 0.84
    if:
      type: text
      exact: UnderlyingSystemType

  - id: get-properties-token
    desc: GetProperties member-name token
    crit: component
    conf: 0.6
    if:
      type: text
      word: GetProperties

  - id: invoke-token
    desc: References the Invoke member name
    crit: component
    conf: 0.66
    if:
      type: text
      exact: Invoke

  - id: begin-invoke-token
    desc: BeginInvoke member-name token
    crit: component
    conf: 0.7
    if:
      type: text
      word: BeginInvoke

  - id: end-invoke-token
    desc: EndInvoke member-name token
    crit: component
    conf: 0.7
    if:
      type: text
      word: EndInvoke

  - id: csharp-reflection-method-lookup
    desc: C# resolves a reflected method
    crit: notable
    conf: 0.9
    for: [csharp, asp]
    if:
      type: text
      word: GetMethod

  - id: dotnet-reflected-method-invoke
    desc: Invokes a reflected .NET method
    crit: notable
    conf: 0.9
    for: [csharp, asp, html, javascript]
    if:
      type: text
      regex: '(?is)\.GetMethod\([^)]{1,120}\)[\s\S]{0,512}\.Invoke\s*\('

  - id: script-activator-createinstance-call
    desc: Script calls .NET Activator.CreateInstance
    crit: notable
    conf: 0.94
    platforms: [windows]
    for: [html, javascript, powershell]
    if:
      type: text
      regex: '(System\.)?Activator\.CreateInstance\s*\('

composite_rules:
  # Resource access and Activator/GetMethod can belong to separate features
  # of one assembly. This records the combined capability without claiming
  # that resource bytes are instantiated as code.
  - id: reflection-method-access
    desc: Reflection method-enumeration tokens
    crit: notable
    conf: 0.78
    needs: 2
    any:
      - id: method-info-class
      - id: micro-behaviors/metaprogramming/reflection::get-method-token
      - id: micro-behaviors/metaprogramming/reflection::get-methods-token

  - id: csharp-assembly-load-reflected-invoke
    desc: C# assembly loading alongside reflected method invocation
    crit: notable
    conf: 0.96
    attack: T1620
    for: [csharp]
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/interpreter/reflection/resolve::assembly-load
      - id: csharp-reflection-method-lookup
      - id: dotnet-reflected-method-invoke

  - id: delegate-invocation-chain
    for: [pe]
    desc: .NET reflected delegate invocation
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/metaprogramming/reflection::dotnet-create-delegate-reference
      - id: metadata/lang/compiler/managed::reflection-namespace
      - id: reflection-method-access
    any:
      - id: begin-invoke-token
      - id: end-invoke-token
