# Polyglot expressions can pivot from a bound JVM object to java.lang.Class,
# resolve process APIs by name, and invoke them reflectively. The complete
# reflection-plus-process chain is rare but still a capability; sandbox-escape
# intent is established by objective composites that require evaluator context.
defaults:
  platforms: [windows, unix]
  for: [json, python, javascript, typescript, java, go, ruby]
  attack: T1059

traits:
  - id: jvm-class-metatype-bootstrap
    desc: Object reaches JVM Class metatype
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)getClass\s*\(\s*\).{0,400}getClass\s*\(\s*\)'

  - id: jvm-reflective-class-resolution
    desc: Reflectively resolves a JVM class
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'getMethod\s*\(\s*["'']forName["'']|Class\s*\.\s*forName'

  - id: jvm-process-class-name
    desc: Names a JVM process class
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'java\.lang\.(Runtime|ProcessBuilder)'

  - id: jvm-reflective-process-method
    desc: Resolves a JVM process method
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'get(Declared)?Method\s*\(\s*["''](exec|start)["'']'

composite_rules:
  - id: polyglot-jvm-reflective-process-exec
    desc: Reflection invokes a JVM process API
    crit: suspicious
    conf: 0.99
    all:
      - id: jvm-class-metatype-bootstrap
      - id: jvm-reflective-class-resolution
      - id: jvm-process-class-name
      - id: jvm-reflective-process-method
    near_bytes: 2200
