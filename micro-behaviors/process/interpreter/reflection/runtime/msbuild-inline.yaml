defaults:
  for:
  - powershell
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: msbuild-code-task-factory
  desc: MSBuild CodeTaskFactory inline task declaration
  if:
    type: text
    substr: TaskFactory="CodeTaskFactory"
- id: runspacefactory-create-runspace
  desc: Invokes RunspaceFactory.CreateRunspace
  if:
    type: text
    regex: (?i)RunspaceFactory\.CreateRunspace\s*\(
