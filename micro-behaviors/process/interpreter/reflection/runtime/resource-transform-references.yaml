# These references do not bind Reverse or Base64 output to a resource or Invoke.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: resource-reverse-base64-reflection-references
    desc: Large resource with reverse/Base64/reflection references
    crit: notable
    conf: 0.93
    all:
      - id: metadata/binary/resource/entropy::clr-resource-size-and-entropy
      - id: metadata/binary/symbols/name::reverse-name-token
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resourcemanager
      - id: micro-behaviors/metaprogramming/reflection::invoke-member-token
    unless:
      - id: well-known/lib/ui/devexpress/
      - id: well-known/lib/ai/tiktoken::tiktoken-bpe-rank-table-resource
      - id: well-known/lib/runtime/managed/metalama/
