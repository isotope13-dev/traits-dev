defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: getdomain-member-token
    desc: GetDomain member-name token
    crit: notable
    conf: 0.82
    if:
      type: text
      exact: GetDomain

  - id: loadassembly-member-token
    desc: LoadAssembly member-name token
    crit: notable
    conf: 0.82
    if:
      type: text
      exact: LoadAssembly

  - id: get-exported-types-token
    desc: GetExportedTypes member-name token
    crit: notable
    conf: 0.82
    if:
      type: text
      exact: GetExportedTypes

  - id: gettypes-member-token
    desc: GetTypes member-name token
    crit: component
    conf: 0.6
    if:
      type: text
      exact: GetTypes

  - id: load-member-token
    desc: Load member-name token
    crit: component
    conf: 0.62
    if:
      type: text
      exact: Load

  - id: action-member-token
    desc: Action member-name token
    crit: component
    conf: 0.64
    if:
      type: text
      exact: Action

  # MethodBase.Invoke reaches a compiled PE as two separate metadata name
  # tokens; this bare word also matches Control/delegate Invoke callers, so
  # it stays a component and only means something beside MethodBase.
  - id: invoke-word-token
    desc: Invoke member-name word token
    crit: component
    conf: 0.6
    if:
      type: text
      word: Invoke

composite_rules:
  # A compiled PE that references MethodBase and an Invoke member carries the
  # same dynamic-invocation fact as the dotted source spelling, just split
  # across the metadata name heap. The pair is still only reflection
  # evidence; the entry-point and load-API composites supply the staging.
  - id: dotnet-metadata-invoke-members
    desc: MethodBase and Invoke metadata tokens in a compiled PE
    crit: notable
    conf: 0.75
    all:
      - id: micro-behaviors/process/interpreter/reflection/runtime::methodbase-class
      - id: invoke-word-token

  # Suffix-shared metadata heaps (an obfuscator trick that stores short
  # member names inside longer neighbors) hide a standalone Invoke token, so
  # the load-and-launch shape stands in: MethodBase beside an Assembly Load
  # member and an entry-point accessor. Still reflection evidence only.
  - id: dotnet-entrypoint-launch-members
    desc: MethodBase with Load and entry-point tokens
    crit: notable
    conf: 0.75
    all:
      - id: micro-behaviors/process/interpreter/reflection/runtime::methodbase-class
      - id: load-member-token
      - id: micro-behaviors/process/interpreter/reflection/runtime::get-entrypoint-token
