defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: getdomain-member-token
    desc: GetDomain member-name token
    crit: notable
    conf: 0.82
    if:
      type: text
      exact: GetDomain

  - id: loadassembly-member-token
    desc: LoadAssembly member-name token
    crit: notable
    conf: 0.82
    if:
      type: text
      exact: LoadAssembly

  - id: get-exported-types-token
    desc: GetExportedTypes member-name token
    crit: notable
    conf: 0.82
    if:
      type: text
      exact: GetExportedTypes

  - id: gettypes-member-token
    desc: GetTypes member-name token
    crit: component
    conf: 0.6
    if:
      type: text
      exact: GetTypes

  - id: reflection-assembly-type-token
    desc: System.Reflection.Assembly type reference
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: System.Reflection.Assembly

  - id: load-member-token
    desc: Load member-name token
    crit: component
    conf: 0.62
    if:
      type: text
      exact: Load

  - id: action-member-token
    desc: Action member-name token
    crit: component
    conf: 0.64
    if:
      type: text
      exact: Action
