composite_rules:
- platforms:
  - windows
  for:
  - pe
  - dll
  id: dotnet-appdomain-load-instance-tokens
  desc: AppDomain load and reflective instance references
  crit: notable
  conf: 0.96
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-class-token
  - id: micro-behaviors/process/interpreter/reflection/runtime::load-member-token
  - id: micro-behaviors/metaprogramming/reflection::invoke-member-token
  - id: metadata/binary/symbols/name/token::dotnet-create-instance-method-name
