# JVM member reflection reached through Clojure interop.
#
# Enumerating a class's fields or methods, and especially calling
# `.setAccessible`, is how JVM code reaches state the class never exposed —
# private fields, package-private methods, sealed internals. Clojure libraries do
# it legitimately (record-field introspection to generate faster accessors), so
# the capability is neutral; composites decide when it is an unhooking or
# sandbox-escape step.
#
# Written as interop call targets (`.getDeclaredFields`) because that is the
# form the Clojure walker records; the .NET/PowerShell spellings of the same
# concept live in the sibling files.
#
# The walker records the method name only, never the receiver, so the bare
# `.getFields` / `.getField` spellings are deliberately NOT matched: they are
# ordinary accessors on plenty of JVM domain objects (`Schema.getFields()` on an
# Avro record, protobuf descriptors, JDBC metadata), and matching them reported
# reflection in libraries that never touch `java.lang.Class`. Every spelling
# below is Class-only.
defaults:
  platforms: [unix, windows]
  for: [clojure]
  crit: notable
  conf: 0.88

traits:
  - id: clojure-class-member-enumeration
    desc: Enumerates JVM class members by reflection
    if:
      type: symbol
      kind: call
      regex: '^\.get(Declared)?(Methods|Constructors)$|^\.getDeclaredFields$'

  - id: clojure-class-member-lookup
    desc: Looks up a JVM class member
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^\.get(Declared)?(Method|Constructor)$|^\.getDeclaredField$'

  # `.setAccessible` is the access-control override itself: it is what turns a
  # reflected private member into a callable one.
  #
  # Notable rather than suspicious, matching the neutrality this file's header
  # states and the way every JVM library uses it: serializers (Jackson, Gson),
  # mocking frameworks, and JVM tooling that patches its own classpath all call
  # it. clj-async-profiler reaches `URLClassLoader.addURL` this way to add
  # tools.jar outside a REPL, which is the standard Clojure idiom and not an
  # attack. The composite below carries the escalation: overriding an access
  # check to reach a process API is the sandbox-escape shape.
  - id: clojure-reflective-access-override
    desc: Disables JVM member access checks from Clojure
    conf: 0.9
    mbc: F0006
    if:
      type: symbol
      kind: call
      exact: .setAccessible

composite_rules:
  - id: clojure-reflective-access-to-process-api
    desc: Reflection override near a JVM process API
    crit: suspicious
    conf: 0.9
    mbc: F0006
    attack: T1059
    all:
      - id: clojure-reflective-access-override
    any:
      - id: micro-behaviors/process/interpreter/runtime/jvm::clojure-jvm-runtime-accessor
      - id: micro-behaviors/process/create/shell/runner::clojure-process-builder-construct
    near_lines: 40
