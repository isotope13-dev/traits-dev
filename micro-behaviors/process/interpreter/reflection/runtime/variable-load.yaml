defaults:
  platforms: [windows]
  for: [text, powershell]
  crit: notable
  conf: 0.95
traits:
  - id: powershell-variable-static-load-sequence
    desc: Variable-named static Load call sequence
    if:
      type: text
      regex: '(?is)\$\w+\s*=\s*[''"]Load[''"].{0,180}\$\w+::\$\w+\(\$\w+\)'
  - id: powershell-method-two-variable-arguments
    desc: Reflected method takes two variable arguments
    if:
      type: text
      regex: '(?is)\.[''\"]?GetMethod[''\"]?\(\$\w+\)[\s\S]{0,400}\.Invoke\(\$\w+,\s*\(\$\w+,\$\w+\)\)'
  - id: powershell-assembly-type-variable
    desc: Binds Reflection.Assembly to a variable
    if:
      type: text
      regex: '\$\w+\s*=\s*\[[^\]\r\n]{0,24}Reflection\.Assembly[^\]\r\n]{0,24}\]'

  - id: powershell-variable-method-object-array-invoke
    desc: Variable method takes two object-array values
    if:
      type: text
      regex: '(?i)\$\w+\.\$\w+\(\$null,\s*\[object\[\]\]\s*\(\$\w+,\s*\$\w+\)\)'

composite_rules:
  - id: powershell-variable-assembly-load
    desc: PowerShell loads assembly through variables
    near_bytes: 400
    all:
      - id: powershell-assembly-type-variable
      - id: powershell-variable-static-load-sequence
