defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
  # Proximity establishes co-occurrence, not a source-to-sink relationship.
  - id: python-http-fetch-compile-exec-cooccurrence
    desc: Nearby Python HTTP fetch, source compilation and exec
    crit: notable
    conf: 0.9
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/process/interpreter/eval/compile::compile-source-exec-mode
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
