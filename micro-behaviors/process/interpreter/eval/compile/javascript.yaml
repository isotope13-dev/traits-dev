# Function-constructor compilation -- eval, specifically the "build a
# function object from text" half of dynamic execution. Direct eval() and
# indirect eval aliases stay in the parent; everything here routes code
# through `new Function(...)` / `Function(...)` / AsyncFunction, the
# constructor forms obfuscators prefer because they take whole programs as
# one string argument.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:

  - id: module-compile-marker
    desc: Node Module._compile runtime-code method
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      # The Module instance is commonly held in a short local alias. Match
      # the parsed call target so `_m._compile(source, filename)` is not lost
      # while comments and string literals cannot supply the behavior.
      type: symbol
      kind: call
      regex: '(^|\.)_compile$'

  - id: module-compile-hex-hidden
    desc: Hex-hidden Node _compile method
    crit: notable
    conf: 0.96
    attack: T1027,T1059.007
    if:
      type: encoded
      encoding: hex
      exact: _compile

  # Obfuscators route Module._compile through a computed call on a fresh
  # Module instance. Match the constructor plus the two-argument invocation
  # in text so megabyte ciphertext literals cannot defeat tree-sitter.
  - id: node-new-module-computed-invocation
    desc: new Module invoked via bracket notation
    crit: notable
    conf: 0.94
    attack: T1059.007
    if:
      type: text
      regex: 'new Module\s*\(.{0,40}\).{0,800}\[.{0,120}\]\(\s*\w+\s*,\s*\w+\s*\)'

  - id: js-async-function-constructor
    desc: JavaScript AsyncFunction compiles code
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: symbol
      kind: call
      exact: AsyncFunction
      arg:
        kind: identifier

  - id: js-async-function-constructor-alias
    desc: Recovers the AsyncFunction constructor
    crit: notable
    conf: 0.97
    attack: T1059.007
    if:
      type: text
      regex: 'async\s+function\s*\([^)]{0,80}\)\s*\{\s*\}\s*\.constructor'

  - id: js-asyncfunction-code-variable
    desc: AsyncFunction compiles a code variable
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: '\bnew\s+AsyncFunction(Constructor)?\s*\(\s*(instrumented)?[Cc]ode\s*\)'

  # `evaluate` is an ordinary user-defined name (template engines, expression
  # parsers, Puppeteer's page.evaluate), so the call shape alone establishes no
  # behavior — it only acquires meaning next to a payload source. Kept as a
  # component so dropper composites can join it to their own evidence without
  # this fragment claiming a remote-configuration read on its own.
  - id: function-ctor-call-expr-arg
    desc: Builds JavaScript function from call result
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: Function
      arg: {kind: call}
  - id: js-new-function-constructor
    desc: Calls JavaScript's new Function constructor
    crit: notable
    conf: 0.7
    if:
      # Match the executable constructor node rather than comments or string
      # literals that merely document `new Function(...)`.
      type: tree-sitter
      language: javascript
      query: |
        (new_expression
          constructor: (identifier) @name
          (#eq? @name "Function"))
    unless:
      - type: text
        substr: "new Function('return this')"
      - type: text
        substr: 'new Function("return this")'
      # gettext/plural-form evaluators compile `nplurals` formulas as
      # `new Function("n", "return " + formula)` — not dynamic malware eval.
      - type: text
        substr: 'new Function("n", "return "'
      - type: text
        substr: "new Function('n', 'return '"
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: well-known/lib/web/jquery/
  - id: js-function-constructor-require-parameter
    desc: Function constructor takes require parameter
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: 'new\s+Function\s*\(\s*[''\"]require[''\"]\s*,'
  - id: js-function-constructor-require-invocation
    desc: Invokes generated function with Node require
    crit: notable
    conf: 0.97
    attack: T1059.007
    if:
      type: text
      regex: 'new\s+Function\s*\(\s*[''\"]require[''\"][^\n)]{1,120}\)\s*\(\s*require\s*\)'
  # Same invocation when the parameter name is itself computed, e.g.
  # javascript-obfuscator's `new Function(_0xdec(0x2cc4,'k')+'re', code)(require)`:
  # the literal "require" is gone but the call still hands require to the body.
  - id: js-function-constructor-any-args-require-invocation
    desc: Generated function invoked with Node require
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: 'new\s+Function\s*\([^\n;]{1,200}\)\s*\(\s*require\s*\)'
  # The parameter name is assembled (`decoder() + "re"`) so the literal
  # `require` form above never sees it. The call still passes Node's require.
  - id: js-function-constructor-split-require
    desc: Builds require param then calls it
    crit: suspicious
    conf: 0.96
    attack: T1059.007
    if:
      type: text
      regex: 'new\s+Function\s*\(.{0,160}\+\s*[''\"]re[''\"]\s*,.{0,40}\)\s*\(\s*require\s*\)'
  # `new(decoder())(param, body)(require)` — Function itself is a decoded
  # value, so the `new Function` spelling never appears.
  - id: js-computed-constructor-require-call
    desc: Computed constructor invoked with require
    crit: suspicious
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: 'new\s*\([^;]{0,120}\)\s*\([^;]{0,80}\)\s*\(\s*require\s*\)'
  - id: js-function-constructor-commonjs-wrapper
    desc: Function constructor takes CommonJS parameters
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: 'new\s+Function\s*\(\s*[''"]require[''"]\s*,\s*[''"]module[''"]\s*,\s*[''"]exports[''"]'
  - id: js-commonjs-synthetic-module-run
    desc: Function runs via synthetic module object
    crit: notable
    conf: 0.94
    attack: T1059.007
    if:
      type: text
      regex: '\{\s*exports:\s*\{\s*\}\s*\}[\s\S]{0,120}\w+\s*\(\s*\w+\s*,\s*\w+\s*,\s*\w+\.exports\s*\)'
  - id: js-function-constructor
    desc: Constructs a JavaScript function dynamically
    crit: notable
    conf: 0.9
    if:
      # Require a JavaScript call node. The generic symbol fact extractor can
      # classify R documentation such as `function(x, y)` as a call to the
      # JavaScript Function constructor.
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: (identifier) @fn
          arguments: (arguments)
          (#eq? @fn "Function"))
    unless:
      - id: micro-behaviors/data/source/dynamic/eval::new-function-return-this
      # gettext plural-formula compilers (see js-new-function-constructor).
      - type: text
        substr: 'new Function("n", "return "'
      - type: text
        substr: "new Function('n', 'return '"
      # R documentation is sometimes content-typed as JavaScript; its
      # examples and prose must not become constructor evidence.
      - type: path
        regex: '(?i)\.R(?:d|md)$'
      # Dart is also content-typed as JavaScript. Type annotations such as
      # `Future<void> Function() body` are not Function() constructor calls.
      - type: path
        regex: '(?i)\.dart$'
  - id: js-new-function-variable-argument
    desc: Function constructor receives identifier
    crit: notable
    conf: 0.85
    if:
      # The JavaScript fact extractor records this `new Function(name)` form
      # in the call facts, but the symbol matcher indexes imports/exports and
      # misses constructor calls.  Match the source form directly so the
      # capability is retained for loader composites.
      type: text
      regex: 'new\s+Function\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\)'
    unless:
      # Bundlers commonly retain formula/i18n evaluators in otherwise benign
      # application libraries. The surrounding generated bundle is not enough
      # evidence to call this a dynamic loader; loader composites add their
      # own payload and execution context.
      - id: metadata/build/minifier::js-large-minified-bundle
  - id: js-indirect-function-constructor
    desc: Function constructor via prototype chain
    crit: notable
    conf: 0.9
    # `[].constructor.constructor`, `"".constructor.constructor`,
    # `({}).constructor.constructor` all resolve to the Function constructor
    # without ever writing the literal token `Function`/`eval`. This indirection
    # is an evasion idiom used to keep the dynamic-execution sink out of reach of
    # static `Function(`/`eval(` greps; legitimate code reaches Function directly.
    if:
      type: text
      regex: '\.constructor\s*\.\s*constructor\b'
    unless:
      - id: metadata/build/minifier::js-large-minified-bundle

  - id: js-function-then-require-call
    desc: Builds a function then passes require
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: 'new\s+Function\s*\([^;]{0,80}\)\s*;[^;]{0,60}\(\s*require\s*\)'
  - id: js-dom-event-handler-variable-code
    desc: DOM event handler executes variable code
    conf: 0.97
    attack: T1059.007
    if:
      # setAttribute("onchange", code) asks the browser to compile the second
      # argument as JavaScript. Match a parsed call so comments and examples
      # cannot stand in for execution.
      type: tree-sitter
      language: javascript
      kind: call
      regex: '\.setAttribute\s*\(\s*["'']on[a-z]{3,20}["'']\s*,\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\)'

composite_rules:
  - id: js-async-function-variable-code
    desc: AsyncFunction compiles variable-supplied code
    crit: notable
    conf: 0.98
    attack: T1059.007
    near_lines: 24
    all:
      - id: js-async-function-constructor-alias
      - id: js-asyncfunction-code-variable
