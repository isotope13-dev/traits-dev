# A "sealed module" loader: the package stores its own source as base64 text,
# XOR/stream-unmasks it with a key assembled in code, inflates it with zlib and
# runs it with exec(compile(...)) in the importing module's namespace. This is
# the shape of a commercial source protector and of a malware stager alike; the
# capability says only that source the reader cannot see is executed. Intent
# comes from what the sealed modules do and whether the package discloses it.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.9

composite_rules:
  - id: python-sealed-source-loader
    desc: Python decrypts, inflates and execs sealed source
    near_bytes: 1500
    all:
      - id: micro-behaviors/data/decode/base64::b64decode-call
      - id: micro-behaviors/data/compression::decompression-output-text-decode
      - id: micro-behaviors/process/interpreter/eval/compile::compile-source-exec-mode
    any:
      - id: micro-behaviors/crypto/symmetric/xor/loop::python-xor-bytes-comprehension
      - id: micro-behaviors/data/arithmetic::python-xor-expression
