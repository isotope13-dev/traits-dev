# InvokeReturnAsIs activates an already compiled ScriptBlock, like the
# created-scriptblock call operator in this leaf; it does not eval raw text.
defaults:
  platforms: [windows, unix]
  for: [powershell]
  crit: notable
traits:
  - id: powershell-invoke-return-as-is
    desc: PowerShell calls InvokeReturnAsIs method
    conf: 0.95
    if:
      type: text
      regex: '(?i)\.\s*InvokeReturnAsIs\s*\('
