# A parsed call binds the synthetic filename to compile argument one.
traits:
- platforms:
  - unix
  - windows
  for:
  - python
  id: python-compile-string-stdin-label
  desc: Python compile uses string or stdin label
  crit: notable
  conf: 0.94
  if:
    type: symbol
    kind: call
    exact: compile
    arg:
      index: 1
      kind: string
      regex: ^<(string|stdin)>$
