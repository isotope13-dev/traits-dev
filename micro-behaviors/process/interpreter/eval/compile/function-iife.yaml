defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript

traits:
  - id: new-function-iife
    desc: Immediate new Function invocation pattern
    crit: notable
    conf: 0.9
    attack: T1027
    mbc: B0032
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: [
            (new_expression
              constructor: (identifier) @name
            )
            (parenthesized_expression
              (new_expression
                constructor: (identifier) @name
              )
            )
          ]
          (#eq? @name "Function")
        )
    downgrade:
      any:
        - id: metadata/package/testing/harness/runtime/
        - id: metadata/package/testing/presence/harness/
    unless:
      - id: micro-behaviors/data/source/dynamic/eval::new-function-return-this
      - type: text
        regex: 'require\("\.\./transformation"\)'
      - id: well-known/lib/format/jsonpath-plus::jsonpath-plus-library

