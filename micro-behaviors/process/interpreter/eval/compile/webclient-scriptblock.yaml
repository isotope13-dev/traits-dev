defaults:
  crit: suspicious
  conf: 0.99
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-webclient-scriptblock-profile
    desc: WebClient and ScriptBlock invocation clues
    all:
      - id: micro-behaviors/communications/http/client/managed::webclient
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-scriptblock-constructor-text
      - id: micro-behaviors/process/interpreter/reflection/dispatch::powershell-variable-call-operator
    near_lines: 24
