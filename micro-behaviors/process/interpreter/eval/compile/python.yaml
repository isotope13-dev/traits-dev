defaults:
  platforms: [windows, unix]
  for: [python]
  attack: "T1059.006"
  mbc: "E1059"

traits:
  - id: exec-compiled-code
    desc: Python executes compiled code
    crit: notable
    conf: 0.92
    for: [python, text]
    if:
      type: text
      substr: exec(compile
  - id: compile-source-exec-mode
    desc: Python compiles source in exec mode
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'compile\s*\([^,\n]{1,120},\s*[^,\n]{1,120},\s*["'']exec["'']\s*\)'
  - id: compile-builtin
    desc: "Python compile() built-in function"
    crit: notable
    conf: 0.7
    if:
      type: symbol
      # `kind: call` is load-bearing: a bare `type: symbol` also matches the
      # `function` facts, so `def compile(self, id, params)` counted as a use
      # of the built-in. Compilers, template engines and regex wrappers all
      # define a method by that name — blueprint-compiler's LSP server has one
      # right next to its `decompile` handler. A call records the dotted target
      # for methods (`self.compile`), so the unqualified name is the built-in.
      kind: call
      exact: compile
    unless:
      - id: well-known/tool/detection/pattern-catalog::python-taint-sink-map
  - id: compile-exec-mode
    desc: Python compile() exec mode
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '\bcompile\s*\([\s\S]{0,180}\bmode\s*=\s*["'']exec["'']'
  - id: compile-synthetic-filename
    desc: Python compile synthetic filename
    crit: baseline
    conf: 0.84
    if:
      type: text
      regex: '(^|[^.a-zA-Z0-9_])compile\(.{0,80}["'']<[A-Za-z0-9_]{4,}'
  - id: ast-parse-caller-code-exec
    desc: Parses caller code in exec mode
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'ast.parse(code or "", mode="exec")'
  - id: caller-code-ast-exec
    desc: Python parses caller code in exec mode
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'ast\.parse\(\s*code\b[\s\S]{0,120}mode\s*=\s*["'']exec["'']\s*\)'
  - id: module-source-compile-exec
    desc: Python compiles module source in exec mode
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'compile\(\s*source\s*,\s*module\.__file__\s*,\s*["'']exec["'']\s*\)'

composite_rules:
  - id: caller-code-execution-handler
    desc: Python handler executes caller code
    crit: notable
    conf: 0.98
    all:
      - id: caller-code-ast-exec
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: module-source-execution-handler
    desc: Python handler executes module source
    crit: notable
    conf: 0.98
    all:
      - id: module-source-compile-exec
      - id: micro-behaviors/os/api-resolution/dynamic::python-types-moduletype-create
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
