defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-rest-scriptblock-invocation-cooccurrence
    desc: REST, ScriptBlock creation and invocation co-occur
    crit: notable
    conf: 0.98
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/client/library::powershell-rest-request
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-scriptblock-constructor-text
      - id: micro-behaviors/process/interpreter/reflection/dispatch::powershell-variable-call-operator
