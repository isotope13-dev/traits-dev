defaults:
  platforms: [windows, unix]
  for: [pe, csharp]
traits:
  - id: dotnet-expression-compile-reference
    desc: .NET expression-tree Compile API reference
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'System\.Linq\.Expressions\.[A-Za-z.]{1,40}\.Compile'
composite_rules:
  - id: expression-compilation
    desc: Runtime expression compilation
    conf: 0.8
    all:
      - id: micro-behaviors/process/interpreter/eval/compile::dotnet-expression-compile-reference
      - id: micro-behaviors/data/db/linq::expression-lambda
