defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-eval-chained-map-read
    desc: Evaluates a value from chained mapping reads
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call function: (identifier) @eval
          arguments: (argument_list . (call
            function: (attribute
              object: (call function: (attribute attribute: (identifier) @inner))
              attribute: (identifier) @outer)))) @evidence
          (#eq? @eval "eval") (#eq? @inner "get") (#eq? @outer "get"))
