defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-eval-subscripted-value
    desc: Evaluates a subscripted value as Python
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((call function: (identifier) @eval
          arguments: (argument_list . (subscript) @value)) @call
        (#eq? @eval "eval")
        )
