defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
  conf: 0.93

traits:
  - id: python-try-block-exec
    desc: Python try block calls exec
    crit: component
    if:
      type: text
      regex: '(?is)\btry\s*:[\s\S]{1,180}?(^|[^.\w])exec\s*\('

  - id: python-try-block-eval
    desc: Python try block calls eval
    crit: component
    if:
      type: text
      regex: '(?is)\btry\s*:[\s\S]{1,180}?(^|[^.\w])eval\s*\('

  - id: python-try-block-compile
    desc: Python try block calls compile
    crit: component
    if:
      type: text
      regex: '(?is)\btry\s*:[\s\S]{1,180}?(^|[^.\w])compile\s*\('

composite_rules:
  - id: python-try-except-eval-sink
    desc: Python try blocks wrap eval sinks
    conf: 0.95
    needs: 2
    any:
      - id: python-try-block-exec
      - id: python-try-block-eval
      - id: python-try-block-compile
