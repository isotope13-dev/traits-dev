defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
  conf: 0.93

traits:
  # The sink must open the clause. A try block that merely precedes an
  # unrelated eval() (interpreter conformance tests) is not a fallback.
  - id: python-try-body-eval-sink
    desc: Python try body starts with eval sink
    crit: component
    if:
      type: text
      regex: '\btry\s*:\s*(\n[ \t]+)?(return\s+|\w+\s*=\s*)?(exec|eval|compile)\s*\('

  - id: python-except-body-eval-sink
    desc: Python except handler starts with eval
    crit: component
    if:
      type: text
      regex: '\bexcept\b[^\n:]{0,80}:\s*(\n[ \t]+)?(return\s+|\w+\s*=\s*)?(exec|eval|compile)\s*\('

composite_rules:
  - id: python-try-except-eval-sink
    desc: Python except handler retries a failed eval
    conf: 0.95
    near_lines: 8
    all:
      - id: python-try-body-eval-sink
      - id: python-except-body-eval-sink
