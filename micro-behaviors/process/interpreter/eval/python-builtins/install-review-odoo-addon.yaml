defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95
composite_rules:
  - id: odoo-install-hook-with-dynamic-execution
    desc: Odoo addon hook and exec reference
    crit: notable
    conf: 0.9
    for: [python, whl, python-sdist, egg, zip, tar]
    scope: archive
    all:
      - id: metadata/package/ecosystem::odoo-addon-manifest
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
    any:
      - id: metadata/package/ecosystem::odoo-post-init-hook-key
      - id: metadata/package/ecosystem::odoo-pre-init-hook-key
      - id: metadata/package/ecosystem::odoo-uninstall-hook-key

  - id: odoo-install-hook-with-dynamic-evaluation
    desc: Odoo addon hook and eval reference
    crit: notable
    conf: 0.9
    for: [python, whl, python-sdist, egg, zip, tar]
    scope: archive
    all:
      - id: metadata/package/ecosystem::odoo-addon-manifest
      - id: micro-behaviors/process/interpreter/eval/python-builtins::eval-builtin
    any:
      - id: metadata/package/ecosystem::odoo-post-init-hook-key
      - id: metadata/package/ecosystem::odoo-pre-init-hook-key
      - id: metadata/package/ecosystem::odoo-uninstall-hook-key
