defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: python-exec-base64-format-placeholder
    desc: Exec decodes a Base64 format placeholder
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      kind: call
      regex: '^exec\s*\(\s*__import__\(\s*["'']base64["'']\s*\)\.b64decode\s*\(\s*["'']%s'
  - id: python-exec-base64-result
    desc: Python executes a Base64 decoder result
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        index: 0
        from:
          call: '(^|\.)b64decode$'
    unless:
      - id: metadata/lang/source/origin::heuristic-quoted-source
  - id: python-module-level-base64-exec
    desc: Executes Base64 result at module scope
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: exec
      module_level: true
      arg:
        index: 0
        from:
          call: '(^|\.)b64decode$'
          through:
            - call: '^bytes$'
              arguments: [0, 1]
            - call: '^enumerate$'
              arguments: [0]
