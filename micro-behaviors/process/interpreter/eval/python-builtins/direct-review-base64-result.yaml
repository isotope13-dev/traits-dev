defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: python-exec-base64-format-placeholder
    desc: Exec decodes a Base64 format placeholder
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      kind: call
      regex: '^exec\s*\(\s*__import__\(\s*["'']base64["'']\s*\)\.b64decode\s*\(\s*["'']%s'
  - id: python-exec-base64-result
    desc: Python executes a Base64 decoder result
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        index: 0
        from:
          call: '(^|\.)b64decode$'
    unless:
      - id: metadata/lang/source/origin::heuristic-quoted-source
  - id: python-module-level-base64-exec
    desc: Executes Base64 result at module scope
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: exec
      module_level: true
      arg:
        index: 0
        from:
          call: '(^|\.)b64decode$'
          through:
            - call: '^bytes$'
              arguments: [0, 1]
            - call: '^enumerate$'
              arguments: [0]
  - id: python-subprocess-inline-base64-exec
    desc: Child Python command decodes and executes Base64
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call function: (attribute object: (identifier) @subprocess attribute: (identifier) @popen)
          arguments: (argument_list (list
            (attribute object: (identifier) @sys attribute: (identifier) @executable)
            (string) @option (string) @code)))
          (#eq? @subprocess "subprocess") (#eq? @popen "Popen")
          (#eq? @sys "sys") (#eq? @executable "executable")
          (#match? @option "^.-c.$") (#match? @code "exec[(]base64[.]b64decode[(]"))

composite_rules:
  - id: python-exec-base64-direct-or-child
    desc: Python executes Base64 directly or in child
    crit: notable
    conf: 0.98
    any:
      - id: python-exec-base64-result
      - id: python-subprocess-inline-base64-exec
