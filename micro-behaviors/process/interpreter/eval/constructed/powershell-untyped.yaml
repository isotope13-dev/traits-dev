# Invocation syntax recovered from text whose carrier has no script type.
defaults:
  platforms: [windows]
  for: [data]
  crit: notable
  conf: 0.85

traits:
  - id: powershell-scriptblock-invoke-return-untyped
    desc: ScriptBlock InvokeReturnAsIs in untyped text
    if:
      type: text
      regex: '(?i)\.\s*InvokeReturnAsIs\s*\('
