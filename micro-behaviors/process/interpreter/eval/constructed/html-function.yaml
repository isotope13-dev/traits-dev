# HTML does not supply JavaScript call facts. Preserve the immediate invocation
# as source-text evidence, including when another part of the script is broken.
defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: html-function-immediate-invocation-text
    desc: Immediate Function invocation in HTML source
    crit: notable
    conf: 0.92
    attack: T1059.007
    if:
      type: text
      regex: '\bFunction\([^();\r\n]{1,120}\)\s*\(\s*\)'
      exclude_html_comments: true
