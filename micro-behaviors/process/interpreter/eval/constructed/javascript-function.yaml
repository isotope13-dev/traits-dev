# These patterns require a generated callable to be invoked. Constructor-only
# evidence remains under metaprogramming/compile.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: js-function-constructor-require-invocation
    desc: Invokes generated function with Node require
    conf: 0.97
    attack: T1059.007
    if:
      type: text
      regex: 'new\s+Function\s*\(\s*[''\"]require[''\"][^\n)]{1,120}\)\s*\(\s*require\s*\)'

  # `new` is optional for the Function constructor, and the invocation may
  # pass require beside other host objects: `(require, console, process)`.
  - id: js-function-constructor-any-args-require-invocation
    desc: Generated function invoked with Node require
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: '\bFunction\s*\([^\n;]{1,200}\)\s*\(([\w$\s,]{0,80},)?\s*require\s*[,)]'

  - id: js-function-constructor-split-require
    desc: Builds require param then calls it
    crit: suspicious
    conf: 0.96
    attack: T1059.007
    if:
      type: text
      regex: 'new\s+Function\s*\(.{0,160}\+\s*[''\"]re[''\"]\s*,.{0,40}\)\s*\(\s*require\s*\)'

  - id: js-computed-constructor-require-call
    desc: Computed constructor invoked with require
    crit: suspicious
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: 'new\s*\([^;]{0,120}\)\s*\([^;]{0,80}\)\s*\(\s*require\s*\)'

  - id: js-empty-param-constructor-invoke
    desc: Alias called as Function('', body)()
    conf: 0.8
    if:
      type: text
      regex: '\b[\w$]{1,24}\(\s*(''''|"")\s*,\s*[\w$]{1,24}\s*\)\s*\('

  - id: js-function-then-require-call
    desc: Builds a function then passes require
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: 'new\s+Function\s*\([^;]{0,80}\)\s*;[^;]{0,60}\(\s*require\s*\)'

  - id: js-function-constructor-alias-require-invocation
    desc: Runs Function.constructor code with require
    conf: 0.96
    attack: T1059.007
    if:
      type: text
      regex: 'Function\.constructor\(\s*["'']require["'']\s*,\s*\w+\);[\s\S]{0,80}\w+\(\s*require\)'

  # A dummy function's constructor member reaches the Function constructor
  # without naming it, and the built function takes 'require' as a string
  # parameter so the generated code can load modules. Either spelling of the
  # member access qualifies; the quoted parameter is the durable tell.
  - id: js-member-constructor-require-invocation
    desc: Invokes constructor-built function with require
    conf: 0.93
    attack: T1059.007
    if:
      type: text
      regex: 'constructor(\s*\]|\b)[\s\S]{0,100}\(\s*[''"]require[''"]\s*,'
  - id: base64-encoded-function-invocation
    desc: Encoded payload invokes new Function
    conf: 0.95
    attack: T1059.007
    for: [text, data, javascript, batch]
    if:
      type: encoded
      encoding: base64
      regex: 'new\s+Function\s*\([^)]*\)\s*;\s*\w+\s*\('
