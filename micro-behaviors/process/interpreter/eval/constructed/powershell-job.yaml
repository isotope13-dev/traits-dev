defaults:
  platforms: [windows, unix]
  for: [powershell]

traits:
  - id: powershell-created-scriptblock-job
    desc: Runs the just-created ScriptBlock as a job
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (statement_list
         (pipeline (assignment_expression (left_assignment_expression (logical_expression (bitwise_expression (comparison_expression (additive_expression (multiplicative_expression (format_expression (range_expression (array_literal_expression (unary_expression (variable))))))))))) @block (assignement_operator) @assign26 (pipeline (pipeline_chain (logical_expression (bitwise_expression (comparison_expression (additive_expression (multiplicative_expression (format_expression (range_expression (array_literal_expression (unary_expression (invokation_expression (argument_list (argument_expression_list (argument_expression (logical_argument_expression (bitwise_argument_expression (comparison_argument_expression (additive_argument_expression (multiplicative_argument_expression (format_argument_expression (range_argument_expression (unary_expression (variable)))))))))) @script_input)))))))))))))) @factory))
         . (pipeline (pipeline_chain (command (command_name) @job (command_elements (command_parameter) @parameter . (command_argument_sep) . (array_literal_expression (unary_expression (variable))) @job_input))))
         (#match? @block "^\\$[A-Za-z_]\\w*$")
         (#match? @factory "(?i)^\\[scriptblock\\]\\s*::\\s*create\\s*\\(\\s*\\$[A-Za-z_]\\w*\\s*\\)$")
         (#match? @job "(?i)^Start-Job$")
         (#match? @parameter "(?i)^-ScriptBlock$")
         (#eq? @block @job_input)
         (#eq? @assign26 "=")
        )
