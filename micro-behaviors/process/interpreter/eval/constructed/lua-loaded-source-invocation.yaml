defaults:
  platforms: [unix, windows]
  for: [lua]
  crit: notable
traits:
  - id: lua-loadstring-result-invoked
    desc: Lua invokes a loadstring result
    conf: 0.95
    if:
      type: tree-sitter
      language: lua
      node: function_call
      regex: '(?s)^loadstring\s*\([^)]{1,200}\)\s*\('
composite_rules:
  - id: lua-generated-source-invocation
    desc: Lua invokes loadstring near source name
    conf: 0.94
    near_bytes: 160
    all:
      - id: lua-loadstring-result-invoked
    any:
      - id: metadata/lang/source/naming/source-text::generated-source-identifier
      - id: metadata/lang/source/naming/source-text::model-source-identifier
