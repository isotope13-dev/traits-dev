# Decoder plus invocation is a neutral execution mechanism. The separate
# arithmetic-obfuscation objective reports concealment without claiming intent.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.98
composite_rules:
  - id: powershell-offset-scriptblock-eval
    desc: Offset-array decoding with ScriptBlock invocation
    near_bytes: 32768
    all:
      - id: micro-behaviors/data/decode/custom::powershell-negative-offset-character-decoder
      - id: powershell-constructed-scriptblock-invocation
