# The constructed function is immediately invoked.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript

traits:
  - id: new-function-iife
    desc: Immediate Function constructor invocation
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: [
            (call_expression
              function: (identifier) @name
            )
            (parenthesized_expression
              (call_expression
                function: (identifier) @name
              )
            )
            (new_expression
              constructor: (identifier) @name
            )
            (parenthesized_expression
              (new_expression
                constructor: (identifier) @name
              )
            )
          ]
          (#eq? @name "Function")
        )
    unless:
      - id: micro-behaviors/metaprogramming/generation/function::new-function-return-this
      - type: text
        regex: 'require\("\.\./transformation"\)'
      # regenerator-runtime's bootstrap exports its runtime through an
      # immediately invoked Function constructor whose body is a static
      # assignment (`Function("r","regeneratorRuntime = r")(o)`) — vendored
      # library plumbing (Babel/transpiled bundles), not constructed code.
      - type: text
        regex: 'Function\s*\(\s*["'']r["'']\s*,\s*["'']\w+\s*=\s*\w+["'']\s*\)'
      - id: well-known/lib/format/jsonpath-plus::jsonpath-plus-library


  # `new Function(x[i])()` compiles one element of an array (typically a
  # parsed response or config tuple) and runs it at once. The index may be
  # an obfuscated arithmetic expression; only the shape is recorded here.
  - id: new-function-indexed-element-iife
    desc: Function compiled from array element, then run
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'new\s+Function\s*\(\s*[A-Za-z_$][\w$]*\s*\[[^\[\]()\n]{1,60}\]\s*\)\s*\)?\s*\(\s*\)'

composite_rules:
  # Parsed JSON reaches the immediately invoked Function within one callback.
  - id: parsed-json-element-function-iife
    desc: Parsed JSON element run as Function
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    near_bytes: 320
    all:
      - id: micro-behaviors/data/parse/json::js-json-parse-direct-or-computed
      - id: new-function-indexed-element-iife
