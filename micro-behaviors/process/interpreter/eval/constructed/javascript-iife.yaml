# The constructed function is immediately invoked.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript

traits:
  - id: new-function-iife
    desc: Immediate Function constructor invocation
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: [
            (call_expression
              function: (identifier) @name
            )
            (parenthesized_expression
              (call_expression
                function: (identifier) @name
              )
            )
            (new_expression
              constructor: (identifier) @name
            )
            (parenthesized_expression
              (new_expression
                constructor: (identifier) @name
              )
            )
          ]
          (#eq? @name "Function")
        )
    unless:
      - id: micro-behaviors/metaprogramming/generation::new-function-return-this
      - type: text
        regex: 'require\("\.\./transformation"\)'
      - id: well-known/lib/format/jsonpath-plus::jsonpath-plus-library

