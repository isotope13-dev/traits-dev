# JJencode's execution tail: `X.$(X.$(X.$$+"\""+...)())()`, where X.$ is
# the Function constructor reached through a coerced ".constructor" and
# X.$$ spells "return". The inner Function returns the decoded source
# string; the outer one compiles and runs it.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.92
traits:
  - id: jjencode-function-constructor-invocation
    desc: Aliased Function constructor runs built source
    if:
      type: text
      regex: '[\w$]{1,8}\.\$\([\w$]{1,8}\.\$\([\w$]{1,8}\.\$\$\+'
