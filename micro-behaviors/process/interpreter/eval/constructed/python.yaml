# These findings require prepared or compiled code to reach exec. Compilation
# alone remains under metaprogramming/compile.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: "T1059.006"
  mbc: "E1059"

traits:
  - id: exec-compiled-code
    desc: Python executes compiled code
    crit: notable
    conf: 0.92
    for: [python, text]
    if:
      type: text
      regex: '\bexec\s*\(\s*compile\s*\('
    unless:
      - id: metadata/file/format/security-corpus::trait-expectation-catalog

  # Executing a local source file is how config and plugin loaders work. The
  # operation is notable; payload origin belongs in consuming objectives.
  - id: python-read-compile-exec-source
    desc: Reads, compiles, and execs a source file
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'compile\(\w+\.read\(\).{0,80}["'']exec["'']\)[\s\S]{0,400}\bexec\('
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: well-known/tool/detection/
      - id: well-known/lib/runtime/scripted/cpython::cpython-repl-startup-path
      - type: path
        regex: pipenv/environment\.py
      - type: text
        substr: activate_this
      - id: well-known/app/infrastructure/ansible::ansible-module-source-context
      - id: "metadata/file/naming::test-directory-component"

composite_rules:
  - id: caller-code-execution-handler
    desc: Python handler parses and executes caller code
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/metaprogramming/ast::caller-code-ast-exec
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin

  - id: module-source-execution-handler
    desc: Python handler compiles and executes module source
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/metaprogramming/generation::module-source-compile-exec
      - id: micro-behaviors/os/api-resolution/dynamic::python-types-moduletype-create
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
