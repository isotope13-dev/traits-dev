# These matchers require invocation of a ScriptBlock or an API dedicated to
# running one. ScriptBlock construction alone is metaprogramming/compile.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [powershell]
  attack: T1059.001
  mbc: E1059

traits:
  - id: powershell-invoke-with-context
    desc: PowerShell calls InvokeWithContext method
    conf: 0.94
    if:
      type: text
      regex: '(?i)\.\s*InvokeWithContext\s*\('

  - id: powershell-invoke-scriptblock-command
    desc: PowerShell invokes a ScriptBlock
    conf: 0.9
    for: [powershell, oledoc]
    if:
      type: text
      regex: '(?i)\bInvoke-ScriptBlock\b'

  - id: lnk-powershell-scriptblock-call-operator
    desc: LNK invokes a created ScriptBlock
    conf: 0.95
    for: [lnk]
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)[&.]\s*\(\s*\[\s*scriptblock\s*\]::create\s*\('

  - id: powershell-created-scriptblock-call
    desc: Invokes newly constructed PowerShell ScriptBlock
    conf: 0.96
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)[&.]\s*\(\s*\[scriptblock\]\s*::\s*Create\s*\(\s*\$\w+\s*\)\s*\)'

  - id: powershell-created-scriptblock-method-call
    desc: Invokes a newly created ScriptBlock by method
    conf: 0.96
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\[scriptblock\]\s*::\s*Create\(\s*\$\w+\s*\)\s*\.Invoke(ReturnAsIs)?\('

composite_rules:
  - id: powershell-constructed-scriptblock-invocation
    desc: Invokes a newly constructed PowerShell ScriptBlock
    conf: 0.96
    for: [scripts, source]
    any:
      - id: powershell-created-scriptblock-call
      - id: powershell-created-scriptblock-method-call

  - id: powershell-scriptblock-invoke-method
    desc: Calls PowerShell ScriptBlock invocation method
    conf: 0.94
    any:
      - id: powershell-invoke-return-as-is
      - id: powershell-invoke-with-context

  - id: powershell-scriptblock-create-invoke
    desc: ScriptBlock construction and method invocation co-occur
    crit: notable
    conf: 0.94
    near_lines: 8
    all:
      - id: micro-behaviors/metaprogramming/generation::powershell-scriptblock-constructor-text
      - id: powershell-scriptblock-invoke-method
