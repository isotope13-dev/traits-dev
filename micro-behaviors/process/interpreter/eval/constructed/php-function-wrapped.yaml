defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  attack: T1059
  mbc: E1059
traits:
  - id: php-eval-function-wrapped-source
    desc: PHP evals variable wrapped in function
    conf: 0.9
    if:
      type: text
      regex: 'eval\s*\(\s*.function\s+\w{1,40}\s*\([^)]{0,20}\)\s*\{.\s*\.\s*\$'

  - id: php-strip-open-tags-before-eval
    desc: PHP strips open and close tags
    conf: 0.8
    if:
      type: text
      regex: 'preg_replace\s*\(\s*.\/<\\\?php\|<\\\?\|\\\?>\/.\s*,\s*..\s*,'
