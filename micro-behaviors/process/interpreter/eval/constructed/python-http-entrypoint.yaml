defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  # Required evidence establishes co-occurrence, not remote-source provenance,
  # implicit invocation, or hidden behavior. Caller-selected workflows also match.
  - id: python-http-compile-exec-entrypoint-cooccurrence
    desc: HTTP fetch, compiled exec and entrypoint access co-occur
    crit: notable
    conf: 0.9
    scope: file
    near_bytes: 1200
    all:
      - id: micro-behaviors/process/deploy/script-eval::python-urllib-compile-exec-cooccurrence
    any:
      - id: micro-behaviors/process/interpreter/eval/constructed::python-exec-namespace-entrypoint-lookup
      - id: micro-behaviors/process/interpreter/eval/constructed::python-exec-compile-into-module-namespace
      - id: micro-behaviors/data/control-flow/return::python-delegates-to-loaded-module-run
      - id: micro-behaviors/data/control-flow/return::python-invokes-getattr-run-then-return
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
