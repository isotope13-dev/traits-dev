defaults:
  platforms: [windows]
  for: [powershell, ruby]
traits:
  - id: powershell-expression-scriptblock-call
    desc: Calls ScriptBlock built from an expression
    crit: notable
    conf: 0.95
    if:
      type: text
      # Unlike the variable-argument matcher, this observes nested expressions.
      regex: '(?i)[&.]\s*\(\s*\[scriptblock\]\s*::\s*Create\s*\(\s*\('
