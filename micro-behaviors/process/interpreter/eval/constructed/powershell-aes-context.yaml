# File-scoped co-occurrence does not bind decryptor output to ScriptBlock.
defaults:
  platforms: [windows, unix]
  for: [powershell]
composite_rules:
  - id: powershell-aes-scriptblock-invocation-references
    desc: AES decryption with ScriptBlock invocation references
    crit: notable
    conf: 0.95
    attack: T1059.001
    all:
      - id: micro-behaviors/crypto/symmetric/aes/library::dotnet-rijndael-any
      - id: micro-behaviors/crypto/decrypt::dotnet-create-decryptor
      - id: micro-behaviors/metaprogramming/generation::powershell-scriptblock-constructor-text
      - id: micro-behaviors/data/control-flow/dispatch/computed::powershell-variable-call-operator
    any:
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: metadata/file/encoding::powershell-many-base64-alphabet-lines
