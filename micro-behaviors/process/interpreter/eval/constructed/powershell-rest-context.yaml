# Construction and invocation co-occur; the composite does not assert data flow.
defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-rest-scriptblock-invocation-cooccurrence
    desc: REST, ScriptBlock creation and invocation co-occur
    crit: notable
    conf: 0.98
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/client/library::powershell-rest-request
      - id: micro-behaviors/metaprogramming/generation::powershell-scriptblock-constructor-text
      - id: micro-behaviors/data/control-flow/dispatch::powershell-variable-call-operator
