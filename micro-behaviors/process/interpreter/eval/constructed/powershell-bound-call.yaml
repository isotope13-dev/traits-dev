defaults:
  crit: notable
  platforms: [windows, unix]
  for: [powershell]
  attack: T1059.001

traits:
  # The source flow projection does not retain PowerShell static method calls.
  # Require adjacent construction and call statements with the same variable;
  # an unrelated variable invocation or an intervening reassignment cannot match.
  - id: powershell-bound-scriptblock-call
    desc: Calls the just-assigned ScriptBlock variable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (statement_list
         (pipeline (assignment_expression
          (left_assignment_expression) @bound
          (pipeline) @factory))
         . (pipeline (pipeline_chain (command
          (command_invokation_operator) @op
          (command_name_expr) @used)))
         (#match? @bound "^\\$[A-Za-z_]\\w*$")
         (#match? @factory "(?i)^\\[scriptblock\\]\\s*::\\s*create\\s*\\([^;\\r\\n]+\\)$")
         (#match? @op "^[&.]$")
         (#eq? @bound @used))

composite_rules:
  - id: powershell-base64-scriptblock-invocation
    desc: Base64 decoding beside invoked ScriptBlock
    conf: 0.98
    near_bytes: 4096
    near_lines: 8
    all:
      - id: micro-behaviors/metaprogramming/generation::powershell-base64-scriptblock-construction
      - id: powershell-bound-scriptblock-call
