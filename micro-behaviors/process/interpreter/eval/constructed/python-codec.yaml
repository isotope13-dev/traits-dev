defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
composite_rules:
  - id: python-decode-decompress-compile-exec
    desc: Python decoding, decompression, compile and exec calls
    conf: 0.96
    near_lines: 80
    all:
      - id: micro-behaviors/metaprogramming/generation::compile-builtin
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
      - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
    any:
      - id: micro-behaviors/data/decode/base85::b85decode-script
      - id: micro-behaviors/data/decode/base64::b64decode-call
