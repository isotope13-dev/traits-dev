defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: base64-buffer-function-iife
    desc: Immediately invokes Base64-decoded Function body
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (call_expression
            function: (identifier) @constructor
            arguments: (arguments . (call_expression
              function: (member_expression
                object: (call_expression
                  function: (member_expression
                    object: (identifier) @buffer
                    property: (property_identifier) @from)
                  arguments: (arguments . (_) . (string (string_fragment) @encoding)))
                property: (property_identifier) @to_string)) .))) @execution
          (#eq? @constructor "Function")
          (#eq? @buffer "Buffer")
          (#eq? @from "from")
          (#eq? @encoding "base64")
          (#eq? @to_string "toString"))
