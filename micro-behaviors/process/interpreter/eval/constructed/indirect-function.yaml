defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: indirect-function-result-invocation
    desc: Invokes an indirect Function constructor result
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: (call_expression
            function: (parenthesized_expression
              (sequence_expression
                . (number) @zero
                . (identifier) @fn .)))
          (#eq? @zero "0")
          (#eq? @fn "Function"))
