defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: indirect-function-result-invocation
    desc: Invokes an indirect Function constructor result
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      kind: call
      regex: '\(\s*0\s*,\s*Function\s*\)\s*\([^)]{1,100}\)\s*\('
