defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: js-message-content-function-execution
    desc: Function constructor executes content field
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression function: [
          (new_expression constructor: (identifier) @ctor
            arguments: (arguments (member_expression
              property: (property_identifier) @field)))
          (parenthesized_expression (new_expression constructor: (identifier) @ctor
            arguments: (arguments (member_expression
              property: (property_identifier) @field))))])
          (#eq? @ctor "Function") (#eq? @field "content"))
