defaults:
  crit: component
  platforms: [unix, windows]
  for: [python, go, javascript, typescript, powershell]
composite_rules:
  - id: generated-command-call-clues
    desc: Generated-command call or setup clues
    conf: 0.96
    any:
      - id: micro-behaviors/process/create/subprocess/reference::python-generated-command-process-text
      - id: metadata/lang/source/syntax/command/launch::javascript-generated-command-call-text
      - id: micro-behaviors/process/create/subprocess/launch::go-generated-command-launch
      - id: micro-behaviors/process/interpreter/eval/constructed::powershell-generated-command-eval-text
