# Compilation and exec co-occur with an HTTP fetch; this does not assert data flow.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-module-dict-name-assign
    desc: Assigns __name__ in a synthetic module dict
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'mod\.__dict__\[\s*["'']__name__["'']\s*\]\s*='

  - id: python-getattr-mod-run-main-fallback
    desc: Resolves loaded module run entrypoint
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'getattr\(\s*mod\s*,\s*["'']run["'']\s*,\s*None\s*\)'

  - id: python-retry-status-backoff-transfer
    desc: Defines HTTP retry status tuple
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '_RETRY_STATUS\s*=\s*\(\s*4[02][589]\s*,\s*42[59]\s*,'

  - id: python-spec-from-file-location-jobmod-bootstrap
    desc: Loads argv script as jobmod
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'importlib\.util\.spec_from_file_location\(\s*[''"]jobmod[''"]\s*,\s*sys\.argv\[1\]\s*\)'

  - id: python-mod-run-json-argv-manifest
    desc: Runs module with JSON manifest argument
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'mod\.run\(\s*\*\*json\.load\(\s*open\(\s*sys\.argv\[2\]'

  - id: python-aliased-urllib-imports
    desc: Aliases urllib inside retry fetch helper
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'import\s+urllib\.error\s+as\s+_ue\s+import\s+urllib\.request\s+as\s+_ur'

  - id: python-retry-codes-set
    desc: Defines urllib retry codes
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '_RETRY_CODES\s*=\s*\{408,\s*429,\s*502,\s*503,\s*504\}'

composite_rules:
  - id: python-inner-aliased-urllib-retry-fetch
    desc: Aliases urllib inside retry fetch helper
    crit: notable
    conf: 0.95
    scope: file
    all:
      - id: python-retry-codes-set
      - id: python-aliased-urllib-imports
  # Proximity establishes co-occurrence, not a source-to-sink relationship.
  - id: python-http-fetch-compile-exec-cooccurrence
    desc: Nearby Python HTTP fetch, source compilation and exec
    crit: notable
    conf: 0.9
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/metaprogramming/generation/compile::compile-source-exec-mode
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin

  # Same co-occurrence through the requests client.
  - id: python-requests-fetch-compile-exec-cooccurrence
    desc: Nearby requests fetch, source compilation and exec
    crit: notable
    conf: 0.9
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/metaprogramming/generation/compile::compile-source-exec-mode
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin

  # A package that fetches Python, installs it as a runtime module, and executes
  # it has a concrete remote-code loading path. Keep bare fetch/exec proximity
  # notable, but raise this more complete module-loader chain to suspicious.
  - id: python-remote-source-module-loader
    desc: Python package downloads source and executes it as a module
    crit: suspicious
    conf: 0.96
    attack: T1105,T1059.006
    all:
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/metaprogramming/generation/compile::compile-source-exec-mode
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
      - id: micro-behaviors/os/api-resolution/dynamic::python-types-moduletype-create
      - id: micro-behaviors/os/api-resolution/dynamic::python-sys-modules-write

  - id: python-http-client-fetch-compile-exec
    desc: Python HTTP client fetch near compiled exec
    crit: notable
    conf: 0.9
    any:
      - id: python-http-fetch-compile-exec-cooccurrence
      - id: python-requests-fetch-compile-exec-cooccurrence
