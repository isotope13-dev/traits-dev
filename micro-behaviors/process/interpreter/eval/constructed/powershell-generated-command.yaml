defaults:
  crit: notable
  platforms: [unix, windows]
  for: [powershell]
traits:
  - id: powershell-generated-command-eval-text
    desc: PowerShell eval text names generated input
    conf: 0.95
    if:
      type: text
      regex: '(?is)\b(Invoke-Expression|iex)\s+\$?(modelResponse|generatedCommand)\b'

