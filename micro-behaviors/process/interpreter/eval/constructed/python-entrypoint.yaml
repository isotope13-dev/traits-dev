defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-exec-namespace-entrypoint-lookup
    desc: Python exec namespace entrypoint lookup
    if:
      type: text
      regex: 'exec\(compile\([^\n]{0,80}\)\s+\w+\s*=\s*\w+\.get\(["'']'

  - id: python-exec-compile-into-module-namespace
    desc: Exec compiles source into module namespace dict
    if:
      type: text
      regex: 'exec\(compile\([^\n]{0,120}\)\s*,\s*\w+\.__dict__\)'

