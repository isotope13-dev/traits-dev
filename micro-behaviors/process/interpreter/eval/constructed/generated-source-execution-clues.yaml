defaults:
  platforms: [unix, windows]
  for: [python, go, lua, shell, javascript, typescript, powershell, rust]
composite_rules:
  - id: generated-source-execution-clues
    desc: Generated-source execution clues
    crit: component
    conf: 0.95
    any:
      - id: micro-behaviors/process/create/subprocess/reference::python-source-interpreter-input-clues
      - id: micro-behaviors/process/deploy/interpreter-command::go-inline-source-launch
      - id: micro-behaviors/process/create/subprocess/reference::javascript-lua-source-call-clues
      - id: micro-behaviors/process/create/subprocess/reference::generated-source-process-clues
      - id: micro-behaviors/process/interpreter/eval/constructed::lua-generated-source-invocation
