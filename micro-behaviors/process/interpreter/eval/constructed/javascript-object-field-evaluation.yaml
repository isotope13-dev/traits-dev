traits:
  - platforms:
      - windows
      - unix
    for:
      - javascript
      - typescript
    id: javascript-object-field-evaluation
    desc: Eval or Function text with code-named field
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: \b(eval|(new\s+)?Function)\s*\([^)]{0,120}\.(script|code|payload)\b
    unless:
      - id: metadata/package/documentation/page::docusaurus-docs-bundle
