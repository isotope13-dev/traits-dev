defaults:
  for: [xml]
  platforms: [unix, windows]

traits:
  - id: xml-embedded-jjencoded-script-execution
    desc: XML embeds executable JJencoded script
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        rule xml_embedded_jjencoded_script_execution {
          strings:
            $open = "<script>$=~[];"
            $table = "$.$_=($.$_=$+\"\")"
            $invoke = "$.$($.$($.$$+"
            $end = ")())();</script>"
          condition:
            all of them and @open < @table and @table < @invoke and @invoke < @end and
            @end - @open < 20000
        }
