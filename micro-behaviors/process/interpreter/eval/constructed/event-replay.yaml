defaults:
  platforms: [unix, windows]
  crit: notable

traits:
  - id: dom-handler-synthetic-click-carrier
    desc: Variable event source then synthetic click
    for: [html, php]
    conf: 0.9
    # Markup's inline JavaScript is not exposed as source call facts. Require
    # the invocation sequence, not just the source-compilation setter. This
    # observes adjacent operations; it does not bind their receiver names.
    if:
      type: text
      encoding: none
      regex: '\.setAttribute\s*\(\s*["'']onclick["''],\s*[\w$]+\s*\);\s*[\w$]+\.click\s*\('
      exclude_html_comments: true

  - id: parsed-dom-handler-synthetic-click
    desc: Compiles and clicks the same event handler
    for: [javascript, typescript]
    conf: 0.97
    # The invocation relation needs receiver equality and adjacent statements,
    # which the individual call facts cannot establish.
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((_
          (expression_statement (call_expression
            function: [(member_expression object: (identifier) @setter property: (property_identifier) @set)
                       (subscript_expression object: (identifier) @setter index: (string (string_fragment) @set))]
            arguments: (arguments . (string (string_fragment) @event) . (identifier) .)))
          . (expression_statement (call_expression
            function: [(member_expression object: (identifier) @clicked property: (property_identifier) @click)
                       (subscript_expression object: (identifier) @clicked index: (string (string_fragment) @click))]
            arguments: (arguments)))) @replay
          (#eq? @set "setAttribute")
          (#eq? @event "onclick")
          (#eq? @click "click")
          (#eq? @setter @clicked))

composite_rules:
  - id: dom-handler-synthetic-click
    desc: Event source compilation beside synthetic click
    for: [javascript, typescript, html, php]
    conf: 0.92
    any:
      - id: parsed-dom-handler-synthetic-click
      - id: dom-handler-synthetic-click-carrier
