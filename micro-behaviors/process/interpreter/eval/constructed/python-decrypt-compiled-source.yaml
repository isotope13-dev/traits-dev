defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-decrypt-then-exec-compiled-code
    desc: Decrypt helper and compiled execution
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'code\s*=\s*_decrypt\(encrypted\)[\s\S]{0,800}exec\(compile\(code\b'
