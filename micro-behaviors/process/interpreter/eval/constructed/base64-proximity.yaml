defaults:
  platforms:
  - windows
  - unix
  crit: notable
composite_rules:
- id: base64-function-invocation-proximity
  desc: Base64 decode near immediate Function invocation
  crit: notable
  conf: 0.95
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/data/decode/base64::base64-decoding
  any:
  - id: micro-behaviors/process/interpreter/eval/constructed::new-function-iife
  near_lines: 12
  unless:
  - id: well-known/lib/format/pdfjs/
  - id: well-known/lib/runtime/scripted/erb::erb-opal-runtime
  - id: metadata/build
  - id: well-known/app/enterprise/egroupware/
  - id: metadata/package/testing/harness/fixture::jsimplifier-benignjs-corpus-path
  - id: well-known/tool/detection/agent-glovebox::staticscan-eval-payload-fixture-context
  - id: metadata/path::compiled-directory-component
