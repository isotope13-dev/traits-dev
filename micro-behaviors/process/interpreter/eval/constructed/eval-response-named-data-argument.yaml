defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: eval-response-cookie-field
    desc: eval executes an HTTP response cookie field
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'eval\s*\(\s*[A-Za-z_$][\w$]*\.data\.cookie\s*\)'

  - id: eval-response-named-data-argument
    desc: Eval text with response-named data field
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'eval\(\s*(resp(onse)?|reply|xhr|request)\.data\s*\)'
