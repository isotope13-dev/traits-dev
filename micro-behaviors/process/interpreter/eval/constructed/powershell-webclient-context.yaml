# Construction and invocation co-occur with WebClient use.
defaults:
  crit: suspicious
  conf: 0.99
  platforms: [windows]
  for: [powershell]

composite_rules:
  - id: powershell-webclient-scriptblock-profile
    desc: PowerShell downloads remote content and invokes a ScriptBlock
    crit: notable
    all:
      - id: micro-behaviors/communications/http/client/managed::webclient
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/metaprogramming/generation::powershell-scriptblock-constructor-text
      - id: micro-behaviors/data/control-flow/dispatch/computed::powershell-variable-call-operator
    near_lines: 24
