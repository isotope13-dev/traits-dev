# JavaScript front matter. gray-matter (and parsers built on it) treat a
# block opened with "---js" or "---javascript" as code and evaluate it to
# get the metadata object, so whoever writes the Markdown runs code in the
# process that parses it. Static-site and agent-skill tooling routinely
# parse untrusted Markdown this way; real documents use YAML or TOML.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, shell]
  conf: 0.9

traits:
  - id: frontmatter-js-engine-block
    desc: Opens an evaluated JS front-matter block
    crit: notable
    if:
      type: text
      regex: '(?m)^---[ \t]*(js|javascript)[ \t]*\r?$'

  - id: frontmatter-child-process-call
    desc: Calls child_process or a sync exec API
    crit: notable
    if:
      type: text
      regex: 'child_process|\b(execSync|spawnSync|execFileSync)\s*\('
