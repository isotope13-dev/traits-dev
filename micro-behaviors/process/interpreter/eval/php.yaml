defaults:
  platforms: [windows, unix]
  for: [php]
  attack: "T1059.006"
  mbc: "E1059"
traits:
  # A direct eval() call is a code-execution capability (notable), not proof of
  # intent: legitimate libraries evaluate code (dompdf's PhpEvaluator, Carbon's
  # anonymous-class Mixin). The suspicious/hostile shapes — eval of user input,
  # eval(gzinflate(base64_decode(...))), fragmented tokens — are caught by the
  # composites and dedicated atoms below.
  - id: eval-call
    desc: Evaluates PHP source at runtime
    crit: notable
    conf: 0.75
    if:
      type: symbol
      kind: call
      exact: eval
    unless:
      - id: well-known/tool/offensive/bingo/
      - id: well-known/lib/crypto/phpseclib
      - id: metadata/library/runtime::htmlpurifier-library
      - id: metadata/library/runtime::pope-framework-library
      - id: metadata/package/testing/harness/unit/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      # Gherkin examples quote `eval()` in prose and embedded fixture output;
      # they are not PHP eval call sites in the feature specification itself.
      - id: metadata/package/testing/presence/fixture::gherkin-feature-file
  - id: error-suppressed-eval
    desc: PHP error-suppressed eval call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '@eval\s*\('
    unless:
      - id: well-known/app/enterprise/egroupware/
      - id: metadata/package/testing/harness/unit/
      - id: well-known/lib/runtime/php-runtime::source-tree
      - id: well-known/app/publishing/wordpress-plugins/
  - id: mixedcase-base64-decode-fragments
    desc: Mixed-case base64 decode fragments
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: BaSe64.{0,32}_deCOde
  - id: fragmented-eval-token
    desc: Fragmented eval token assembly
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: "'e'\\s*\\.\\s*'va'\\s*\\.\\s*'l'"
  - id: fragmented-gzinflate-token
    desc: Fragmented gzinflate assembly
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: "'g'\\s*\\.\\s*'zi'\\s*\\.\\s*'nf'\\s*\\.\\s*'l'\\s*\\.\\s*'at'\\s*\\.\\s*'e'"
  - id: create-function-reference
    desc: PHP create_function string reference
    crit: component
    conf: 0.98
    if:
      type: text
      substr: create_fun
    unless:
      - id: metadata/library/generated::php-manual-empty-function-stubs
      - id: well-known/lib/crypto/phpseclib
  - id: fragmented-create-function-token
    desc: Fragmented create_function assembly
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: "'create_fun'\\s*\\.\\s*'ct'\\s*\\.\\s*'io'\\s*\\.\\s*'n'"
  - id: eval-gzinflate-base64
    desc: eval gzinflate base64 chain
    crit: suspicious
    conf: 0.98
    if:
      type: encoded
      regex: 'eval\s*\(\s*gzinflate\s*\(\s*base64_decode\s*\('
  - id: eval-gzuncompress-base64
    desc: eval gzuncompress base64 chain
    crit: suspicious
    conf: 0.99
    if:
      type: encoded
      regex: 'eval\s*\(\s*gzuncompress\s*\(\s*base64_decode\s*\('
  - id: create-function-eval-loader
    desc: create_function staged eval loader
    crit: suspicious
    conf: 0.96
    if:
      type: encoded
      regex: 'create_function\s*\([^)]{0,120}eval\s*\(\s*gzinflate\s*\(\s*base64_decode\s*\('
  - id: create-function-gzuncompress-loader
    desc: create_function gzuncompress stage
    crit: suspicious
    conf: 0.98
    if:
      type: encoded
      regex: 'create_function.{0,80}gzuncompress.{0,40}base64_decode'
      case_insensitive: true
  - id: eval-user-input
    desc: PHP eval receives direct HTTP request input
    crit: suspicious
    conf: 0.98
    # Include script carriers because PHP is often embedded in a file whose
    # outer extension is JavaScript. The regex itself remains PHP-specific.
    for: [php, javascript]
    # `eval(... $_GET|$_POST|$_REQUEST ...)` — a request superglobal reaching an
    # eval() argument. The `eval(` prefix plus the superglobal keeps it FP-safe.
    if:
      type: text
      regex: '\beval\s*\([^)]{0,200}\$_(GET|POST|REQUEST)'
    unless:
      - type: path
        regex: '(?i)\.yar(a)?$'
      - id: well-known/app/publishing/wordpress-plugins::bitfire-plugin-path

      - id: well-known/tool/offensive/bingo/
  - id: php-filtered-expression-eval
    desc: PHP filtered expression reaches eval()
    crit: suspicious
    conf: 0.97
    attack: "T1059.001"
    if:
      type: text
      # A filter whose pattern mentions PHP expression characters, followed by
      # eval of the filtered value, is the vulnerable restricted-expression
      # sink described by the vBulletin advisory.  Keep the relationship local
      # to one call sequence so unrelated regexes and evals do not combine.
      regex: 'preg_replace\s*\(\s*["''].{0,200}\\d.{0,200}["'']\s*,[\s\S]{0,500}\beval\s*\('
    unless:
      - id: metadata/package/testing/harness/unit/
      - id: well-known/lib/runtime/php-runtime::source-tree

composite_rules:
  - id: staged-eval-loader
    desc: Staged PHP eval loader
    crit: suspicious
    conf: 0.99
    any:
      - id: eval-user-input
      - id: fragmented-eval-token
      - id: mixedcase-base64-decode-fragments
      - id: eval-gzinflate-base64
      - id: eval-gzuncompress-base64
      - id: fragmented-create-function-token
      - id: create-function-eval-loader
      - id: create-function-gzuncompress-loader
    unless:
      - id: well-known/app/publishing/wordpress-plugins::bitfire-plugin-path
