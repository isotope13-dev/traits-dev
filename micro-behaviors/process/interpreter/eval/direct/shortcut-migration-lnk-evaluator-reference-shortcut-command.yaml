---
defaults:
  platforms:
  - windows
  for:
  - lnk
traits:
- id: lnk-invoke-expression-reference
  desc: LNK expression-evaluator reference
  crit: notable
  conf: 0.95
  if:
    type: value
    path: lnk.arguments
    # PowerShell doubled-quote escaping (`I''E''X`) survives inside a
    # double-quoted -Command argument; allow quote runs between the letters.
    regex: "(?i)\\b(Invoke-Expression|i[\\x27\\x22]{0,4}e[\\x27\\x22]{0,4}x)\\b"
