defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
- id: js-eval-decode-named-helper
  desc: JavaScript eval calls a decode-named helper
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: \beval\s*\(\s*(decode\w*|from\d+)\s*\(
  not:
  - regex: decodeURI\s*\(
  unless:
  - id: well-known/lib/runtime/scripted/construct::html5-runtime-banner
  - id: well-known/app/ai/coding-agent/bito::vscode-extension-context
  - id: metadata/package/testing/presence/harness/
  - id: metadata/package/testing/harness/fixture::jsimplifier-benignjs-corpus-path
  - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
  - id: "metadata/file/naming::test-directory-component"
