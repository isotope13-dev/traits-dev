defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
  size_max: 2000000
traits:
  - id: eval-call-of-decoder-result
    desc: Evaluates a decoder invocation result
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |-
        (call_expression function: (identifier) @eval
          arguments: (arguments (call_expression function: (identifier) @decoder
            arguments: (arguments (identifier) @source)))
          (#eq? @eval "eval"))

