# `eval "$(curl URL)"` runs a download as shell code, like a pipe to `sh`.
defaults:
  platforms: [unix]
  for: [shell, scripts]

traits:
  - id: shell-eval-fetch-substitution
    desc: Shell evals a fetched response body
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(^|[;&|]\s*)eval\s+["'']?\$\(\s*(curl|wget)\b'
