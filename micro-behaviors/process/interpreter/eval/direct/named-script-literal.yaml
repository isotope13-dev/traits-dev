defaults:
  platforms: [android, unix]
  for: [elf, python, javascript, java, kotlin, c, cpp]
traits:
  - id: eval-script-name-literal
    desc: Eval call with script-name literal
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\beval\s*\(\s*["''](javascript|script)["'']'
