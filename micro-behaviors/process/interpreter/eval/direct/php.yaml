defaults:
  platforms: [windows, unix]
  for: [php]
  attack: "T1059"
  mbc: "E1059"
traits:
  # A direct eval() call is a code-execution capability (notable), not proof of
  # intent: legitimate libraries evaluate code (dompdf's PhpEvaluator, Carbon's
  # anonymous-class Mixin). The suspicious/hostile shapes — eval of user input,
  # eval(gzinflate(base64_decode(...))), fragmented tokens — are caught by the
  # composites and dedicated atoms below.
  - id: eval-variable-argument
    desc: Evaluates a PHP variable as source
    crit: notable
    conf: 0.9
    # Bare-PHP injections carry no opening tag, so the engine types the file
    # Text and produces no call facts; the same eval($var) source shape is
    # still PHP semantics there. Text also reaches decoded string layers.
    for: [php, text]
    if:
      type: text
      regex: '\beval\s*\(\s*\$[A-Za-z_][A-Za-z0-9_]*\s*\)'
  - id: eval-call
    desc: Evaluates PHP source at runtime
    crit: notable
    conf: 0.75
    if:
      type: symbol
      kind: call
      regex: '(?i)^eval$'
  - id: error-suppressed-eval
    desc: PHP error-suppressed eval call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '@eval\s*\('
  - id: eval-identifier-argument
    desc: PHP eval receives an identifier argument
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)^eval$'
      arg:
        index: 0
        kind: identifier
  - id: eval-call-result-argument
    desc: PHP eval receives call result argument
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(?i)^eval$'
      arg:
        index: 0
        kind: call
  - id: eval-xor-or-subscript-argument
    desc: PHP eval receives XOR or subscript
    crit: notable
    conf: 0.92
    if:
      type: text
      case_insensitive: true
      regex: '\beval\s*\(\s*([^;\r\n]{1,160}\^|\$[A-Za-z_][A-Za-z0-9_]*\s*\[)'
  - id: php-eval-named-function-argument
    desc: PHP eval invokes result of named function
    crit: notable
    conf: 0.92
    for: [php, text]
    if:
      type: text
      regex: '\beval\s*\(\s*[A-Za-z_][A-Za-z0-9_]*\s*\('
composite_rules:
  - id: php-eval-dynamic-payload
    desc: PHP eval receives a nonliteral expression
    crit: notable
    conf: 0.92
    all:
      - id: eval-call
    any:
      - id: eval-identifier-argument
      - id: eval-call-result-argument
      - id: eval-xor-or-subscript-argument
