defaults:
  platforms: [windows, unix]
  for: [php]
  attack: "T1059"
  mbc: "E1059"
traits:
  # A direct eval() call is a code-execution capability (notable), not proof of
  # intent: legitimate libraries evaluate code (dompdf's PhpEvaluator, Carbon's
  # anonymous-class Mixin). The suspicious/hostile shapes — eval of user input,
  # eval(gzinflate(base64_decode(...))), fragmented tokens — are caught by the
  # composites and dedicated atoms below.
  - id: eval-variable-argument
    desc: Evaluates a PHP variable as source
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\beval\s*\(\s*\$[A-Za-z_][A-Za-z0-9_]*\s*\)'
    unless:
      - id: well-known/lib/development/php-cs-fixer::php-cs-fixer-source-tree
  - id: eval-call
    desc: Evaluates PHP source at runtime
    crit: notable
    conf: 0.75
    if:
      type: symbol
      kind: call
      exact: eval
    unless:
      - id: well-known/tool/offensive/framework/bingo/
      - id: well-known/lib/crypto/phpseclib
      - id: well-known/lib/runtime/scripted/php-libraries::htmlpurifier-library
      - id: well-known/lib/runtime/scripted/php-libraries::pope-framework-library
  - id: error-suppressed-eval
    desc: PHP error-suppressed eval call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '@eval\s*\('
    unless:
      - id: well-known/app/enterprise/egroupware/
      - id: well-known/app/publishing/wordpress-plugins/
composite_rules: []
