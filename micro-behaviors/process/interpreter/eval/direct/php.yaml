defaults:
  platforms: [windows, unix]
  for: [php]
  attack: "T1059.006"
  mbc: "E1059"
traits:
  # A direct eval() call is a code-execution capability (notable), not proof of
  # intent: legitimate libraries evaluate code (dompdf's PhpEvaluator, Carbon's
  # anonymous-class Mixin). The suspicious/hostile shapes — eval of user input,
  # eval(gzinflate(base64_decode(...))), fragmented tokens — are caught by the
  # composites and dedicated atoms below.
  - id: eval-call
    desc: Evaluates PHP source at runtime
    crit: notable
    conf: 0.75
    if:
      type: symbol
      kind: call
      exact: eval
    unless:
      - id: well-known/tool/offensive/bingo/
      - id: well-known/lib/crypto/phpseclib
      - id: well-known/lib/runtime/scripted/php-libraries::htmlpurifier-library
      - id: well-known/lib/runtime/scripted/php-libraries::pope-framework-library
      - id: metadata/package/testing/harness/unit/
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      # Gherkin examples quote `eval()` in prose and embedded fixture output;
      # they are not PHP eval call sites in the feature specification itself.
      - id: metadata/package/testing/presence/path::gherkin-feature-file
  - id: error-suppressed-eval
    desc: PHP error-suppressed eval call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '@eval\s*\('
    unless:
      - id: well-known/app/enterprise/egroupware/
      - id: metadata/package/testing/harness/unit/
      - id: well-known/lib/runtime/scripted/php-runtime::source-tree
      - id: well-known/app/publishing/wordpress-plugins/
composite_rules:
  - id: php-filtered-expression-eval
    desc: PHP digit-filtered value reaches eval()
    crit: suspicious
    conf: 0.97
    # Structured call facts prevent `eval()` text inside a preg_replace string
    # argument (for example, stack-trace cleanup) from becoming an eval sink.
    all:
      - id: micro-behaviors/data/string/replace::php-preg-replace-digit-class
      - id: eval-call
    near_bytes: 768
    unless:
      - id: metadata/package/testing/harness/unit/
      - id: well-known/lib/runtime/scripted/php-runtime::source-tree
