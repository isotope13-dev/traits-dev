defaults:
  platforms: [unix, windows]
  for: [ruby]
composite_rules:
  - id: ruby-gemspec-http-eval-clues
    desc: Ruby gemspec has HTTP import and eval clues
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/package/files/rubygems::gemspec-file
      - id: metadata/import/package::ruby-http-client-imports
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-string-eval-call
