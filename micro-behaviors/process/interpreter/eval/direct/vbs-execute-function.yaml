# Execute of a function result is dynamic evaluation, not evidence of a loader.
# Consumers supply any decoding or concealment required for an attack claim.
traits:
- id: vbs-execute-function-call
  desc: VBScript Execute evaluates a function result
  crit: notable
  conf: 0.9
  # Not static-lib: C++ archives embed SQL test text such as
  # `EXECUTE v1(1)` (DuckDB prepared statements), which is not VBScript.
  for: [vbs, text]
  platforms: [windows]
  attack: T1059.005
  if:
    type: text
    regex: '(?i)^[ \t]*execute\s+[A-Za-z_]\w*\s*\('
  not:
  - substr: format(
  - substr: replace(
  # SQL EXECUTE AS changes execution context; AS is not a VBScript function.
  # This also covers ANTLR productions such as EXECUTE AS (SELF | OWNER).
  - regex: '(?i)execute\s+as\b'
  # SQL's dynamic statement, `EXECUTE IMMEDIATE (SELECT ...)`, in
  # MariaDB's mysql-test corpus (this atom also reads `text`).
  - regex: '(?i)execute\s+immediate\b'
  # Firebird PSQL's `EXECUTE BLOCK (...)` / `EXECUTE STATEMENT (...)`
  # in its sql.extensions documentation (this atom also reads `text`).
  - regex: '(?i)execute\s+(block|statement)\b'
  # English prose determiners in documentation ("Execute the (...)").
  - regex: '(?i)execute\s+(the|a|an|this|that|each|every|all|any|some|following)\b'
  unless:
  - id: metadata/package/documentation/manpage::unix-manpage
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: metadata/package/testing/presence/fixture::snapshot-file
  - type: path
    basename: true
    regex: '(?i)\.(sql|snap|out)$'
  # PostgreSQL pg_regress keeps a plain-text expected transcript at
  # `expected/<name>.out`; it embeds the run's SQL, including
  # `EXECUTE prepared-statement(...)` calls, beside psql result tables.
  # Vim script's own `execute printf(...)`: a .vim file is not VBScript
  # content-sniffed as text, whatever the detection order says.
  - type: path
    basename: true
    regex: '(?i)\.vim$'
