defaults:
  platforms: [windows]
  for: [powershell]

traits:
- id: powershell-content-pipe-iex-text
  desc: PowerShell pipes Content text to IEX
  crit: suspicious
  conf: 0.96
  for: [powershell, vbs, batch]
  if:
    type: text
    regex: '(?i)(Select-Object\s+-Expand\s+Content|\.Content)\s*\|\s*(IEX|Invoke-Expression)\b'
