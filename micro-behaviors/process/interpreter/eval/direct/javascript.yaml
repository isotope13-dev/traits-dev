# JavaScript Eval Detection
# MBC: B0009.016 (Dynamic Execution)
# ATT&CK: T1059.007
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-eval-data-property-source
    desc: JavaScript source string evaluates data property
    crit: notable
    conf: 0.88
    attack: T1059.007
    if:
      # Some browser applications construct preview scripts as string
      # literals. Keep this atomic descriptive of the source text; the
      # remote-command objective supplies the message-handler context.
      type: literal
      regex: '\beval\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\.data\s*\)'

  - id: evaluate-helper-identifier-call
    desc: Calls evaluate() on an identifier
    crit: component
    conf: 0.9
    if:
      # A text regex also matches method declarations such as
      # `evaluate(nowMs)`. Require the parsed call node so declarations and
      # comments cannot stand in for execution.
      type: symbol
      kind: call
      exact: evaluate
      arg:
        kind: identifier

  - id: js-eval-variable-argument
    desc: JavaScript eval executes a variable argument
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: eval
      arg:
        kind: identifier
    unless:
      - id: metadata/file/extension/identity::julia-source-basename

  - id: js-eval-message-data
    desc: JavaScript eval executes event or message data
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: text
      regex: '\beval\s*\(\s*(message|event)\.data\s*\)'

  - id: js-eval-call-expression-arg
    desc: JavaScript eval executes a call result
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: eval
      arg:
        kind: call

  # Keep this as an AST match: a source string that merely generates
  # `node -e 'eval(Buffer.from(...))'` is not itself an eval call.
  - id: js-eval-buffer-from-argument
    desc: JavaScript eval executes Buffer.from result
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: tree-sitter
      language: javascript
      query: |
        [
          (call_expression
            function: (identifier) @fn
            arguments: (arguments
              (call_expression
                function: (member_expression
                  object: (identifier) @obj
                  property: (property_identifier) @method)))
            (#eq? @fn "eval")
            (#eq? @obj "Buffer")
            (#eq? @method "from"))
          (call_expression
            function: (identifier) @fn
            arguments: (arguments
              (call_expression
                function: (member_expression
                  object: (call_expression
                    function: (member_expression
                      object: (identifier) @obj
                      property: (property_identifier) @inner))
                  property: (property_identifier) @outer)))
            (#eq? @fn "eval")
            (#eq? @obj "Buffer")
            (#eq? @inner "from")
            (#eq? @outer "toString"))
        ]
  - id: js-commonjs-module-wrapper
    desc: CommonJS text evaluation wrapper
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'new\s+Function\s*\(\s*["'']require["'']\s*,\s*["'']exports["'']\s*,\s*text\s*\)'
  - id: js-empty-function-charcode-property
    desc: Empty function has char-coded property
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\(function\(\)\{\}\)\[String\.fromCharCode'
  - id: js-computed-charcode-call
    desc: Computed call through character-coded property
    crit: notable
    conf: 0.92
    attack: T1059.007
    if:
      type: text
      # A function-valued property is selected with a runtime character-code
      # string and immediately called with an identifier payload.  The atom
      # describes the capability; decoder-plus-execution intent is inferred by
      # objective composites.
      regex: 'String\.fromCharCode\s*\([^;\]]{1,180}\)\s*\]\s*\('

  - id: js-base64-decoded-property
    desc: Base64-decoded computed method call
    crit: notable
    conf: 0.88
    attack: T1059.007
    if:
      type: text
      regex: '\[\s*Buffer\.from\([^;\n\]]{0,120}["'']base64["''][^;\n\]]{0,40}\)\s*\]\s*\('

  - id: js-eval-raw
    desc: Executes JavaScript dynamically with eval()
    crit: notable
    conf: 0.7
    if:
      # Migrated from a tree-sitter query to a `kind: call` match on
      # the pre-extracted call fact (no per-member cursor walk).
      type: symbol
      kind: call
      exact: 'eval'
    unless:
      - id: metadata/lang/compiled::erlang-module-marker
      - type: text
        substr: eval(path)
      - id: metadata/package/testing/harness/runtime::v8-native-intrinsic-call
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/harness/runtime/
      - type: text
        substr: "function eval_template"
      - id: metadata/file/extension/identity::julia-source-basename
    downgrade:
      any:
        - id: metadata/package/testing/harness/fixture::embedded-unit-test-fixture

  - id: js-eval-variable-text
    desc: Calls eval() with an identifier argument
    crit: notable
    conf: 0.9
    attack: T1059.007
    # Use the parse tree rather than a text fallback: documentation and source
    # comments commonly contain examples such as `eval(X)` without executing
    # anything. The symbol atom above covers the same call shape when the
    # symbol index is available; this rule is the syntax-aware fallback for
    # files where only the tree projection is populated.
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: (identifier) @fn
          arguments: (arguments
            (identifier) @arg)
          (#eq? @fn "eval"))
    unless:
      - id: metadata/file/extension/identity::julia-source-basename

  - id: js-eval-named-script-variable
    desc: Eval executes named script variable
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: (identifier) @fn
          arguments: (arguments
            (identifier) @arg)
          (#eq? @fn "eval")
          (#match? @arg "(?i)(source|script|module)$"))

  # A bare `\.eval\s*\(` matches any user method named `eval`: LESS, Stylus and
  # other CSS/AST interpreters call `node.eval(context)` on every tree node, and
  # `Evaluator.prototype.eval` is an ordinary visitor method.  A member `eval`
  # is only a code sink when the receiver is the JavaScript global object
  # (indirect eval) or the argument is a decoded value, so match those instead.
  - id: js-global-object-eval-call
    desc: Calls eval through the JavaScript global object
    crit: notable
    conf: 0.92
    attack: T1059.007
    if:
      type: text
      regex: '\b(window|globalThis|global|self)\.eval\s*\('
  - id: js-member-eval-decoded-argument
    desc: Member eval executes a decoded value
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: text
      regex: '\.eval\s*\(\s*(atob|unescape|Buffer|decode\w*)\s*[(.]'
  - id: js-eval-tostring-result
    desc: eval() executes toString() result
    crit: notable
    conf: 0.88
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/library/structure::google-tag-manager-bundle
    if:
      type: text
      regex: '\beval\s*\(\s*[\w$.]+\.toString\s*\(\s*\)\s*\)'
  - id: js-eval-object-property
    desc: eval() executes object property
    # The call shape is a real dynamic-execution capability, but it does not
    # establish attacker intent by itself.  Keep suspicious/hostile severity
    # in the objective composites that add remote-response or loader context.
    crit: notable
    conf: 0.75
    attack: T1059.007
    ref: sha256:3136a698ee6023e879bec6a1ff24d69f9ece7db5195e520acd82fed5b3efa220
    if:
      type: text
      regex: '(^|[^.$A-Za-z0-9_])eval\s*\(\s*[A-Za-z_$][\w$]*\.[A-Za-z_$][\w$]*\s*\)'
    unless:
      - id: metadata/library/structure/
      - id: metadata/library/runtime::angularjs-bundle
      - id: metadata/package/files/system-package::julia-runtime-path
      - id: well-known/lib/runtime/node-runtime::source-tree
      - id: well-known/lib/web/nextjs/
      - id: well-known/app/publishing/civicrm/
      - id: well-known/app/storage/bruno::app-bundle
      - id: metadata/library/runtime::websharper-runtime-marker
      - type: text
        substr: CriticalCmdDialog
    not:
      - regex: '(?i)eval\s*\(\s*window\.(game|softgames)[A-Za-z0-9_$]*\s*\)'
  - id: js-eval-response-text
    desc: JavaScript eval executes responseText property
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: text
      regex: '(^|[^.$A-Za-z0-9_])eval\s*\(\s*[A-Za-z_$][\w$]*\.responseText'
  - id: js-eval-response-array-like
    desc: Evaluated XHR response used as array-like data
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: text
      regex: '=\s*eval\(\w+\.responseText\);\s*\w+\s*=\s*\w+\.length'
  # Covers the Function-constructor twin `(0, Function)(src)` as well: the comma
  # operator yields a bare callee so the compiled code closes over global scope.
  - id: js-indirect-eval
    desc: Indirect eval or Function via comma operator
    crit: notable
    conf: 0.7
    if:
      # Restrict the syntax to an actual call expression.  Text scanning also
      # treated documentation examples inside comments as executable eval.
      type: tree-sitter
      kind: call
      regex: '\(\s*0\s*,\s*(eval|Function)\s*\)\s*\('
    # `(0,eval)(...)` is a standard transpiler/bundler idiom for global-scope
    # eval; suppress it on large minified bundles to avoid noise, matching the
    # js-new-function-constructor precedent above. Dropper composites use the
    # component fragment in supply-chain/hidden-payload/encoding instead, which
    # carries no bundle exclusion so megabyte single-line packers still match.
    unless:
      - id: metadata/library/structure::js-large-minified-bundle
  - id: js-indirect-eval-variable
    desc: Indirect eval executes an identifier value
    crit: notable
    conf: 0.9
    # This is narrower than the general indirect-eval capability: the comma
    # operator feeds a named decoded buffer directly into the execution sink.
    # Keep it visible in large files because packed loaders are commonly single
    # large lines and the surrounding decoder is what makes the combination
    # hostile.
    if:
      type: text
      regex: '\(\s*0\s*,\s*eval\s*\)\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]{0,80}\s*\)'
  - id: js-eval-alias-assignment
    desc: Variable aliases JavaScript eval
    crit: notable
    conf: 0.95
    attack: T1059.007
    if:
      type: text
      regex: '\b(var|let|const)\s+[A-Za-z_$][A-Za-z0-9_$]{0,40}\s*=\s*eval\s*[;,]'

composite_rules:
  - id: js-member-eval-call
    desc: Calls eval through an object member reference
    crit: notable
    conf: 0.9
    attack: T1059.007
    any:
      - id: js-global-object-eval-call
      - id: js-member-eval-decoded-argument

  - id: js-base64-decoded-computed-call
    desc: Calls a method selected from Base64-decoded text
    crit: notable
    conf: 0.92
    attack: T1059.007
    near_bytes: 256
    all:
      - id: js-base64-decoded-property
      - id: micro-behaviors/data/source/property/computed::js-computed-property-call

  - id: js-charcode-constructor-stage
    desc: Char-coded constructor property call
    crit: notable
    conf: 0.95
    attack: T1059.007
    near_bytes: 512
    all:
      - id: js-empty-function-charcode-property
      - id: js-computed-charcode-call
