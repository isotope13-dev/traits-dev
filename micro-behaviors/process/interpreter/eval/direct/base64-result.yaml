defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: python-exec-base64-result
    desc: Python executes a Base64 decoder result
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        index: 0
        from:
          call: '(^|\.)b64decode$'
