defaults:
  for: [batch]
  platforms: [windows]
traits:
  - id: powershell-iex-parenthesized-variable
    desc: PowerShell IEX with parenthesized variable
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)\biex\s*\(\s*\$[A-Za-z_]\w*\s*\)'

  # `[char]($byte -bxor $key[$i])` appended in a loop: each blob byte is XORed
  # with a repeating key and turned into a character, which is how a
  # PowerShell stage rebuilds its script text at run time.
