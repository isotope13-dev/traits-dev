defaults:
  for: [applescript]
  platforms: [macos]
traits:
- id: micro-behaviors/process/interpreter/eval/direct::run-script-command-text-reference
  desc: AppleScript run script text reference
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: run script
- id: micro-behaviors/process/interpreter/eval/direct::run-script-variable-text-reference
  desc: AppleScript run script variable text reference
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: \brun script\s+[A-Za-z_][A-Za-z0-9_]*\b
composite_rules:
- id: micro-behaviors/process/interpreter/eval/direct::run-script-execution-references
  desc: AppleScript run script text references
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::run-script-command-text-reference
  - id: micro-behaviors/process/interpreter/eval/direct::run-script-variable-text-reference
