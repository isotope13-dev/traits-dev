# execScript directly executes a string in another document's JScript engine.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable

traits:
  - id: js-dom-execscript-call-text
    desc: Script executes string in another document
    conf: 0.85
    if:
      type: text
      regex: '\.DOM\.Script\.execScript\s*\('
