defaults:
  crit: suspicious
  platforms: [linux, macos, windows]
  for: [php]

composite_rules:
  # File-scoped co-occurrence cannot establish request-to-eval data flow,
  # authorization, or implantation. Authenticated administration consoles
  # also expose these capabilities. Keep the existing matcher and scope.
  - id: php-post-base64-variable-eval-context
    desc: PHP POST, Base64 decoding and variable eval cooccur
    conf: 0.98
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::eval-variable-argument
      - id: micro-behaviors/data/decode/base64::php-base64-decode-call
      - id: micro-behaviors/communications/http/request/superglobal::post-dup
    unless:
      - id: well-known/app/publishing/wordpress-plugins/catalog::known-wordpress-plugin
      - id: metadata/path::test-directory-component
      - id: metadata/package/testing/harness/unit/
