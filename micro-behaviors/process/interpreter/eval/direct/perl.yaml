defaults:
  platforms: [unix, windows]
  for: [perl]
  attack: T1059.006

traits:
  # `$run` is the shell variable perl's pod builder interpolates inside a
  # heredoc (`eval $run`). Command eval in Perl source uses $cmd/$command/$exec.
  - id: perl-eval-command-variable
    desc: Perl eval command variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\beval\s+\$(cmd|command|exec)[A-Za-z0-9_]*\b'

  - id: perl-eval-payload-variable
    desc: Perl eval of payload or shellcode variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\beval\s+\$(payload|shellcode)[A-Za-z0-9_]*\b'

  # A generated callback is a dynamic-code capability, but `$code` is also
  # the conventional variable used by package managers to compile callbacks
  # from command-line formatting options. Keep that capability visible
  # without treating the variable name alone as payload evidence.
  - id: perl-eval-code-variable
    desc: Perl dynamically evaluates a code variable
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\beval\s+\$code[A-Za-z0-9_]*\b'

  - id: perl-eval-buffer-variable
    desc: Perl eval buffer variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\beval\s+\$(buf|buffer|msg|input)[A-Za-z0-9_]*\b'
  - id: perl-eval-response-variable
    desc: Perl eval response variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\beval\s+\$(resp|response|reply)[A-Za-z0-9_]*\b'
  - id: perl-eval-remote-variable
    desc: Perl eval remote variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\beval\s+\$(recv|received|remote|task)[A-Za-z0-9_]*\b'



composite_rules:
  - id: perl-eval-variable
    desc: Perl eval of a named variable
    crit: notable
    conf: 0.92
    any:
      - id: perl-eval-command-variable
      - id: perl-eval-payload-variable
      - id: perl-eval-buffer-variable
      - id: perl-eval-response-variable
      - id: perl-eval-remote-variable
