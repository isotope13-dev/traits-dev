defaults:
  crit: notable
  platforms: [windows, unix]
  for: [powershell]
  attack: T1059.001
  mbc: E1059

traits:
  - id: powershell-invoke-command
    desc: PowerShell Invoke-Command call
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bInvoke-Command\b'
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context











  - id: powershell-multiple-eval-fallbacks
    desc: PowerShell uses dynamic eval fallbacks
    conf: 0.95
    if:
      type: text
      regex: '(?is)Invoke-Expression[\s\S]{0,1000}\[ScriptBlock\]::Create[\s\S]{0,1000}&\s*\{\s*\.\s*\{'


composite_rules:
  - id: powershell-multiple-eval-paths
    desc: Multiple PowerShell dynamic eval methods
    conf: 0.95
    near_lines: 20
    all:
      - id: micro-behaviors/process/interpreter/eval/compile::powershell-scriptblock-constructor-text
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
