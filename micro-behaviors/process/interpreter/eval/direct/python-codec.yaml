# Decoding and decompression precede direct exec; no compile step is required.
defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable

composite_rules:
  - id: python-decode-decompress-exec
    desc: Python Base64 decoding, zlib decompression and exec calls
    conf: 0.92
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/decode/base64::b64decode-call
      - id: micro-behaviors/data/decompress/zlib::zlib-decompress-symbol
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
