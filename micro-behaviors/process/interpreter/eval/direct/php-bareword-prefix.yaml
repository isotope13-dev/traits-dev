# A short word prefix is an observation; surrounding code determines whether
# it is a bypass. A PHP closing tag, as used by Drupal's evaluator, is not one.
defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: php-eval-bareword-prefix
    desc: PHP eval prepends word to variable
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: "eval\\s*\\(\\s*['\\\"][A-Za-z_][A-Za-z0-9_]{0,3}['\\\"]\\s*\\.\\s*\\$[A-Za-z_]\\w*\\s*\\)"
