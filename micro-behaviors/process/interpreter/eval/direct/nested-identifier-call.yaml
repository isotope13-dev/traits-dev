defaults:
  platforms: [windows, unix]
  crit: notable
  for: [javascript, typescript]
traits:
  - id: js-eval-nested-identifier-call
    desc: Eval wraps a call on an identifier
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\beval\s*\(\s*[A-Za-z_$][\w$]{0,30}\s*\(\s*[A-Za-z_$][\w$]{0,30}\s*\)'
