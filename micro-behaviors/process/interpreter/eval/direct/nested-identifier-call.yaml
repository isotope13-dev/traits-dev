defaults:
  platforms: [windows, unix]
  crit: notable
  for: [javascript, typescript, html]
traits:
  - id: js-eval-nested-identifier-call
    desc: Eval executes an identifier-based helper call
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\beval\s*\(\s*[A-Za-z_$][\w$]{0,30}\s*\(\s*[\w$()\s]{1,64}\)'
