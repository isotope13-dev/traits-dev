defaults:
  platforms: [windows, unix]
  crit: notable
  for: [javascript, typescript, html, vbs]
traits:
  - id: eval-nested-identifier-expression
    desc: Eval receives a nested identifier expression
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\beval\s*\(\s*[A-Za-z_$][\w$]{0,30}\s*\(\s*[\w$()\s]{1,64}\)'
