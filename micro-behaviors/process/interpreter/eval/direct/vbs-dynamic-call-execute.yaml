# Execute runs `name & "(arg)"`: the function being called is held in a
# variable and the call statement only exists after concatenation, so the
# callee never appears as a call in the source.
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1059.005

traits:
  - id: vbs-execute-variable-callee
    desc: Execute calls a variable-named function
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bExecute(Global)?\s*\(?\s*[A-Za-z_]\w*\s*&\s*"\(\s*[A-Za-z_]\w*\s*\)"'
