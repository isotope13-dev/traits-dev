defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
traits:
- id: content-assignment-before-eval
  desc: Assigns .content then immediately evals
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: =[^\n;=]{0,120}\.content\s*;\s*eval\s*\(
  unless:
  - type: text
    regex: (?i)Pattern:\s*`[^`\n]*\.content\s*;\s*eval\s*\(
