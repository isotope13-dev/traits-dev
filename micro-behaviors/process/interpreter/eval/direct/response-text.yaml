defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059.007

traits:
  - id: js-eval-response-text
    desc: JavaScript eval executes responseText property
    conf: 0.9
    if:
      type: text
      regex: '(^|[^.$A-Za-z0-9_])eval\s*\(\s*[A-Za-z_$][\w$]{0,80}\.responseText\s*\)'
