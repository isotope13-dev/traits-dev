defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059.007

traits:
  - id: js-eval-response-text
    desc: JavaScript eval executes responseText property
    conf: 0.9
    if:
      type: text
      regex: '(\beval\s*\(\s*[\w$.]+\.responseText\s*\)|=\s*[\w$.]+\.responseText\s*;?\s*eval\s*\()'
