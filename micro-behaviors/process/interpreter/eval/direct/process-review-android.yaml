defaults:
  platforms: [android]
  for: [kotlin, java]
  crit: notable
  conf: 0.85
  attack: "T1411"

traits:
- id: source-webview-evaluate-javascript-call
  desc: Android source evaluates JavaScript in a WebView
  if:
    type: symbol
    kind: call
    exact: evaluateJavascript

- id: kotlin-javascript-callback-loadurl
  desc: Kotlin WebView callback JavaScript loadUrl
  if:
    type: text
    regex: 'loadUrl\(\s*jsCode\)|loadUrl\(.{0,120}javascript:'

