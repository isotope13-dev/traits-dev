defaults:
  platforms: [android]
  for: [kotlin, java]
  crit: notable
  conf: 0.85
  attack: "T1411"

traits:
- id: source-webview-evaluate-javascript-call
  desc: Android source evaluates JavaScript in a WebView
  if:
    type: symbol
    kind: call
    exact: evaluateJavascript
- id: kotlin-webview-evaluate-javascript-call
  desc: Kotlin invokes WebView evaluateJavascript
  for: [kotlin]
  if:
    type: text
    regex: '(\.|\?\.)\s*evaluateJavascript\s*\('

composite_rules:
- id: webview-evaluate-javascript-source
  desc: Android source calls WebView evaluateJavascript
  any:
    - id: source-webview-evaluate-javascript-call
    - id: kotlin-webview-evaluate-javascript-call

