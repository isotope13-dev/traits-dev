# PowerShell dynamic expression evaluation and computed script invocation across
# PowerShell scripts, batch launchers, and Windows shortcuts.
defaults:
  platforms: [windows, unix]
  for: [powershell, batch, lnk]
  crit: notable

traits:
  - id: powershell-invoke-expression-text
    desc: Calls PowerShell Invoke-Expression or iex
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: '(?im)(^|[|;&({]\s*)(Invoke-Expression|iex)\b'

  - id: lnk-arg-powershell-variable-call
    desc: Shortcut arguments invoke PowerShell variable
    platforms: [windows]
    for: [lnk]
    conf: 0.9
    if:
      type: value
      path: lnk.arguments
      regex: '&\s*`?\$[A-Za-z_]\w*\b'

composite_rules:
  - id: powershell-stage-eval
    desc: Evaluates or invokes PowerShell payload stage
    conf: 0.92
    any:
      - id: powershell-invoke-expression-text
      - id: micro-behaviors/process/interpreter/eval/direct::lnk-invoke-expression-reference
      - id: micro-behaviors/data/control-flow/dispatch/computed::powershell-variable-call-operator
      - id: lnk-arg-powershell-variable-call
