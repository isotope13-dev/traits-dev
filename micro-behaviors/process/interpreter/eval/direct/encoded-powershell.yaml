traits:
  - id: base64-powershell-eval-command
    desc: Base64-decoded PowerShell evaluation command
    crit: notable
    for: [scripts, "!shell", "!ruby", "!lua", "!perl", "!applescript", "!mirc", "!ircii", rust, go, csharp, html, lnk]
    platforms: [unix, windows]
    conf: 0.9
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\bInvoke-Expression\b|\|\s*iex\b|\biex(\s*\(|\s+(\$|&#36;)[A-Za-z_])'
    unless:
      - id: metadata/package/testing/harness/runtime::bun-assertion-suite
      - id: well-known/tool/sysadmin/console::gsudo-powershell-wrapper
