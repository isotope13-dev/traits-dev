# run script directly evaluates source assembled from quoted lines and returns.
# String concatenation does not construct a callable/code object before invocation.
# text also sees recovered strings inside native wrappers; no runtime success
# or malicious intent is asserted by this capability.
defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  crit: notable
  attack: T1059.002
traits:
  - id: applescript-eval-joined-lines
    desc: AppleScript evaluates return-joined source
    conf: 0.97
    if:
      type: text
      regex: '(?m)(^[ \t]*|osascript -e '')run script\s+""\s*&\s*return\s*&\s*"'
