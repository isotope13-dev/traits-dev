# Co-occurrence only: the variable evaluated need not hold the response.
defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-iex-near-downloadstring
    desc: PowerShell variable evaluation near DownloadString
    crit: notable
    conf: 0.95
    scope: file
    all:
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-text
    near_bytes: 2000
