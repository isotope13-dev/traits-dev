defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: js-eval-replacement-result
    desc: Evaluates replacement-derived JavaScript
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: eval
      arg:
        index: 0
        from:
          call: '\.replace$'
