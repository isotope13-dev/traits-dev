defaults:
  platforms: [unix, windows, macos]
composite_rules:
- id: jscript-eval-com-write-profile
  desc: JScript eval with COM and write clues
  crit: suspicious
  conf: 0.96
  platforms: [windows]
  for: [javascript]
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
  - id: micro-behaviors/os/com/automation::shell-application-progid
  - id: micro-behaviors/data/control-flow/loop::js-small-multistep-loop
  - id: micro-behaviors/fs/write/content::fso-text-file-write-api
