# Resource retrieval and ScriptEngine setup coexist, but the matcher does not
# bind the resource stream to the argument of eval.
defaults:
  platforms: [windows, unix]
  for: [java, class, java_class, jar]

composite_rules:
  - id: java-resource-scriptengine-eval-profile
    desc: Java resource and ScriptEngine eval clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/embedded/payload/resource::java-getresourceasstream
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-scriptengine-api
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-scriptengine-eval-descriptor
      - id: micro-behaviors/process/interpreter/jscript::java-javascript-engine-name
    any:
      - id: micro-behaviors/data/decompress/gzip::gzip-inputstream
      - id: micro-behaviors/crypto/library/provider::secretkeyspec
      - id: micro-behaviors/process/debug/stack::java-linkageerror-stacktrace-reference
