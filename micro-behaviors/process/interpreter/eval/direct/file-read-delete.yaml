defaults:
  for:
  - vbs
  platforms:
  - windows
  crit: notable
  conf: 0.99
traits:
- id: embedded-powershell-read-file-variable
  desc: PowerShell reads file into variable
  if:
    type: text
    regex: (?i)\$(\w+)\s*=\s*\[IO\.File\]::ReadAllText\(\$\w+\)
- id: embedded-powershell-delete-then-eval
  desc: PowerShell removes file before eval
  if:
    type: text
    regex: (?i)Remove-Item -LiteralPath \$\w+[^;\r\n]{0,70};iex \$\w+
