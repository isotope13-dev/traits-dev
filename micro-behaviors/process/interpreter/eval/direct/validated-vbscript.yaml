# Execute/ExecuteGlobal is a normal VBScript evaluation mechanism. Script
# validity plus an evaluation statement does not establish a malicious loader;
# decoding/concealment and downstream abuse are required by its consumers.
defaults:
  platforms: [windows]
  for: [vbs]

composite_rules:
  - id: validated-vbs-execute-statement
    desc: Valid VBScript evaluates code dynamically
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::vbs-execute-statement
      - id: metadata/lang/scripted::vbscript-valid
