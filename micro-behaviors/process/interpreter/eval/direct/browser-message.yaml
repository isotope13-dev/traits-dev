defaults:
  for: [javascript, typescript, html]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
traits:
  - id: evaluate-json-message-field
    desc: Evaluates a decoded JSON message field
    if:
      type: text
      regex: '\beval\s*\(\s*JSON\.parse\s*\(\s*[A-Za-z_$][\w$]*\.data\s*\)\.[\w$]+\s*\)'
