defaults:
  platforms:
  - windows
  for:
  - batch

traits:
  - id: batch-python-inline-requests
    desc: Batch starts inline Python importing requests
    crit: notable
    conf: 0.96
    attack: T1059.006
    if:
      type: text
      regex: '(?i)\b[\w.-]+\.exe["'']?\s+-c\s+["'']\s*import\s+requests\b'

