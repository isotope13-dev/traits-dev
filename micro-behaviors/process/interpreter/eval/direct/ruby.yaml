defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [ruby]
  attack: T1059
traits:
  - id: ruby-eval
    desc: Ruby dynamic code evaluation call
    downgrade:
      any:
        - id: well-known/lib/format/nokogiri::library-reference
        - id: well-known/lib/web/active-support::module
    if:
      type: symbol
      kind: call
      exact: eval
  - id: ruby-instance-eval
    desc: Ruby instance_eval call
    if:
      type: symbol
      kind: call
      exact: instance_eval
  - id: ruby-class-eval
    desc: Ruby class_eval call
    if:
      type: symbol
      kind: call
      exact: class_eval
  - id: ruby-module-eval
    desc: Ruby module_eval call
    if:
      type: symbol
      kind: call
      exact: module_eval
  - id: ruby-class-eval-string-argument
    desc: Ruby class_eval evaluates string source
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: class_eval
      arg:
        kind: string
  - id: ruby-instance-eval-string-argument
    desc: Ruby instance_eval evaluates string source
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: instance_eval
      arg:
        kind: string
