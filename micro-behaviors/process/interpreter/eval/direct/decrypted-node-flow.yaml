# Input provenance belongs in the trait name; the operation is direct eval.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-decryption-derived-eval-argument
    desc: Eval argument derives from cipher initialization
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: eval
      arg:
        index: 0
        from:
          call: '(^|\.)createDecipheriv$'
          through:
            - call: '\.(update|final)$'
              receiver: true
            - call: '^Buffer\.concat$'
              arguments: [0]
            - call: '\.toString$'
              receiver: true
