# Access automation exposes _Evaluate for expression evaluation. A bare
# _evaluate() can instead be a JavaScript method declaration; require a
# member receiver and a nonempty argument, without attributing worm intent.
defaults:
  platforms: [windows]
  for: [vbs, text, oledoc, ooxml, static-lib]

traits:
  - id: access-evaluate-member-call
    desc: Receiver-qualified _Evaluate expression call
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\.\s*_Evaluate\s*\(\s*[^\s)]'
