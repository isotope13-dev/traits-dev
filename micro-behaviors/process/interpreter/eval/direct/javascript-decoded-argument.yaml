defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: js-eval-url-decoded
  desc: eval() of URL-decoded data
  crit: notable
  conf: 0.9
  unless:
  - id: metadata/package/testing/harness/fixture::jsimplifier-benignjs-corpus-path
  - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
  - id: metadata/file/format/markup::adblock-filter-list
  if:
    type: text
    regex: eval\(\s*decodeURIComponent\s*\(
