# Python eval/exec builtins, named at the call site.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: "T1059.006"
  mbc: "E1059"

traits:
  - id: pyc-eval-name
    desc: Python bytecode names eval
    crit: notable
    for: [pyc]
    # The string table of the standard library and ordinary applications can
    # contain this name without an eval call.  The hidden-payload composite
    # supplies the additional context needed for an attack conclusion.
    conf: 0.95
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])eval([^A-Za-z0-9_]|$)'
  - id: eval-exec-decorator-expression
    desc: Python decorator invokes eval or exec
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?m)^\s*@(exec|eval)\s*\('
  - id: exec-after-file-read
    desc: Python exec after file read
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'read\(\)[\s\S]{0,500}exec\(\s*\w+,\s*\w+,\s*\w+\)'
  - id: exec-command-argument
    desc: Python exec() called with command variable
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        kind: identifier
        name: command
  - id: eval-builtin
    desc: "Python eval() built-in function"
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: eval
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: well-known/tool/detection/security-scanner::code-pattern-catalog
      - id: well-known/tool/detection/pattern-catalog::python-taint-sink-map
      - id: well-known/tool/detection/agentskillmap/
  # A mapping lookup passed directly to eval is an unsafe-evaluation
  # capability, but this atom alone does not establish a remote source.
  - id: eval-mapping-get
    desc: Python eval of mapping get result
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: "\\beval\\s*\\(\\s*[a-z_][A-Za-z0-9_]*\\s*\\.get\\s*\\([^)]{0,180},.{0,120}\\)\\s*\\)"
  - id: eval-constructed-expression
    desc: Python eval of a constructed expression string
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\\beval\\s*\\([^()\\n]{0,180}\\+[^()\\n]{0,180}\\)'
  - id: eval-prefixed-configuration-expression
    desc: Evaluates prefixed Python expression
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'startswith\(\s*["'']eval%["'']\s*\)[\s\S]{0,240}\beval\s*\('
  # `exec(...)` reached during import rather than from inside a function --
  # the shape that runs the moment setuptools imports setup.py to read
  # metadata. The plain `exec-builtin` atom says the capability is present
  # anywhere in the file, including inside a method nobody calls.
  - id: module-scope-exec-builtin
    desc: exec() runs at module import
    crit: suspicious
    conf: 0.9
    if:
      type: tree-sitter
      language: python
      # The argument must not be a plain string literal. `exec` over a constant
      # written in the source hides nothing and executes exactly what an
      # analyst can already read -- sympy's abc.py builds its symbol namespace
      # with `exec('from sympy import *', ns)` at module scope. The shapes this
      # trait is for keep matching: the crytic-compile typosquat's
      # `exec("subprocess.run(...'s.exe')" if sys.platform == 'win32' else
      # "pass")` is a conditional expression, and the decoded-payload form
      # `exec(base64.b64decode(blob))` is a call.
      #
      # `compile()` over a literal is the same constant, one indirection on:
      # pip's setuptools_build.py holds `exec(compile('''...''')` inside the
      # triple-quoted `_SETUPTOOLS_SHIM` template it writes into a subprocess,
      # and the archive-member parse reads that string body as code. A payload
      # that compiles decoded bytes (`exec(compile(decoded, ...))`) still
      # matches, because its argument is not a literal.
      #
      # A command-line conversion tool or packaging script may deliberately
      # interpret a local file read via open() (for example, a Bazel BUILD DSL
      # converter or setup.py reading _version.py). That is still reported by
      # exec-builtin and exec-open-read, but it is explicit local-file behavior
      # rather than a concealed import-time payload.
      query: |
        ((module
           (expression_statement
             (call function: (identifier) @fn
                   arguments: (argument_list . [
                     (call) (identifier) (attribute) (subscript)
                     (conditional_expression) (binary_operator)] @arg))))
         (#eq? @fn "exec")
         (#not-match? @arg "^compile\\([bruBRUf]{0,2}['\"]")
         (#not-match? @arg "\\bopen\\("))
        ((module
           (expression_statement
             (assignment right: (call function: (identifier) @fn
                   arguments: (argument_list . [
                     (call) (identifier) (attribute) (subscript)
                     (conditional_expression) (binary_operator)] @arg)))))
         (#eq? @fn "exec")
         (#not-match? @arg "^compile\\([bruBRUf]{0,2}['\"]")
         (#not-match? @arg "\\bopen\\("))
    unless:
      # Legacy setuptools recipes commonly read a checked-in version.py into
      # setup.py's namespace. The version module is scanned as its own archive
      # member, so hostile behavior there remains visible; keep the plain
      # notable exec atoms here, but do not call this packaging idiom suspicious.
      - type: text
        regex: '\bexec\s*\(\s*open\(["''][^"'']*(version|__init__|configurator)\.py["'']\)\.read\(\)'
      # virtualenv's relocatable-script prelude is a template string written
      # into generated scripts (`activate = "import os; ...
      # exec(compile(open(activate_this).read(), ...)) ..."`), and the
      # base64+zlib blobs beside it decode to activate/site.py text staged on
      # disk. The embedded-code parse sees an import-time-shaped exec, but
      # nothing executes at this module's import.
      - type: text
        regex: 'activate_this.*exec\(compile\(open\(activate_this\)'
      - type: text
        regex: '(convert_path|open)\(["''][^"'']*\.py["'']\)[\s\S]{0,240}\bexec\s*\(\s*[A-Za-z_]\w*\.read\(\)'
      # Standard setuptools/pip build shims (e.g. in Makefiles or build scripts)
      # execute a setup.py via `exec(compile(open(__file__).read(), ...))`.
      - type: text
        regex: '\bexec\s*\(\s*compile\s*\(\s*open\s*\(\s*(__file__|["''][^"'']*\.py["''])\s*\)\.read\(\)'
      # A scanner's corpus demonstrates the pattern it detects: agent-glovebox
      # ships tests/staticscan_fixtures/python_exec_decoded_payload.py, four
      # lines whose whole content is `exec(base64.b64decode(blob))` at module
      # scope. The plain `exec-builtin` atom still reports the capability in a
      # test tree; only the import-time sharpening is withheld there.
      - id: metadata/package/testing/presence/harness/
      # Microbenchmarks commonly generate a function from a parameterized
      # source template at import time so the timed call has no setup overhead.
      - type: path
        regex: '(^|[\\/])benchmarks?[\\/]'
      # numpy.polynomial generates each class from one template:
      # `exec(polytemplate.substitute(name='Chebyshev', ...))`.
      - type: text
        regex: '\bexec\s*\(\s*\w*template\.substitute\s*\('
      # setuptools idiom: read version metadata into a dict at import.
      # `ver_file = os.path.join(..., 'info.py'); exec(open(ver_file).read(), VARS)`.
      - type: text
        regex: '\bexec\s*\(\s*open\(\s*ver_file\s*\)\.read\(\)'
      # Versioneer bootstraps by exec'ing its own base64 source at import.
      - id: well-known/lib/development/versioneer::source-file
  - id: exec-builtin
    desc: Executes dynamic Python code with exec()
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: exec
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: well-known/tool/detection/security-remediation::compiled-remediation-catalog
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/agentskillmap/
      # A JSP page has no `jsp` file type in cleave and often lands on `python`;
      # its Java `exec(cmd)` helper is not the Python builtin.
      - id: metadata/lang/scripted::jsp-page-directive
  - id: python-exec-docstring
    desc: Executes text taken from a docstring
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'exec\([\s\S]{0,200}__doc__'
  # Keep these calls in the indented body immediately following run(). This
  # gives install-hook composites a local relationship between the hook method
  # and dynamic execution instead of correlating any exec/eval elsewhere in a
  # large setup.py (for example a separate top-level version-file reader).
  # Blank lines inside the body are allowed so padding cannot split the two;
  # an unindented line still ends the method. Limiting both body length and
  # per-line width keeps the regex bounded.
  - id: run-method-exec
    desc: Python run method invokes exec()
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?m)^[ \t]+def run\([^\n)]{0,40}\):\r?\n(([ \t]+[^\r\n]{0,120})?\r?\n){0,6}[ \t]+exec\('
  - id: run-method-eval
    desc: Python run method invokes eval()
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?m)^[ \t]+def run\([^\n)]{0,40}\):\r?\n(([ \t]+[^\r\n]{0,120})?\r?\n){0,6}[ \t]+eval\('
  - id: exec-variable
    desc: Python exec() executes a variable value
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        kind: identifier
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/lang/scripted::jsp-page-directive
  - id: exec-variable-namespace
    desc: Python built-in exec() with explicit namespace
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      kind: call
      # Anchor at call start so string args (e.g. assertEqual('exec(foo, bar)'))
      # do not count. Method forms like Job.exec(...) also fail the ^exec guard.
      regex: '^exec\s*\(\s*[A-Za-z_]\w*\s*,\s*[A-Za-z_]\w*'
  - id: exec-generated-code
    desc: Python exec() of generated or compiled code
    crit: notable
    conf: 0.94
    if:
      type: text
      # Require compile(...) or an f-string opener — a bare `exec(foo` must not
      # match via the leading `f` of an identifier (AST dump assert fixtures).
      regex: '\bexec\s*\(\s*(compile\s*\(|[fF]["''])'
  - id: exec-open-read
    desc: Python exec() on file contents
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'exec\s*\(\s*open\s*\(.{1,160}\)\.read\s*\('
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: objectives/persistence/login/python-startup::pythonstartup-env
  - id: exec-file-read-namespace
    desc: Python exec() file contents into namespace
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'exec\s*\(\s*[A-Za-z_]\w*\.read\(\)\s*,\s*[A-Za-z_]\w+\s*\)'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: objectives/persistence/login/python-startup::pythonstartup-env
