defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  attack: T1059.006
  mbc: E1059
  crit: notable
traits:
- id: eval-exec-decorator-expression
  desc: Python decorator invokes eval or exec
  conf: 0.98
  if:
    type: text
    regex: (?m)^\s*@(exec|eval)\s*\(
- id: exec-after-file-read
  desc: Python exec after file read
  conf: 0.94
  if:
    type: text
    regex: read\(\)[\s\S]{0,500}exec\(\s*\w+,\s*\w+,\s*\w+\)
- id: exec-command-argument
  desc: Python exec() called with command variable
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: exec
    arg:
      kind: identifier
      name: command
- id: eval-builtin
  desc: Python eval() built-in function
  conf: 0.85
  if:
    type: symbol
    kind: call
    exact: eval
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: well-known/tool/detection/security-scanner::code-pattern-catalog
  - id: well-known/tool/detection/pattern-catalog::python-taint-sink-map
  - id: well-known/tool/detection/agentskillmap/
- id: eval-mapping-get
  desc: Python eval of mapping get result
  conf: 0.85
  if:
    type: text
    regex: \beval\s*\(\s*[a-z_][A-Za-z0-9_]*\s*\.get\s*\([^)]{0,180},.{0,120}\)\s*\)
- id: eval-prefixed-configuration-expression
  desc: Evaluates prefixed Python expression
  conf: 0.92
  if:
    type: text
    regex: startswith\(\s*["']eval%["']\s*\)[\s\S]{0,240}\beval\s*\(
- id: module-scope-exec-builtin
  desc: Module-level exec() with dynamic argument
  conf: 0.9
  if:
    type: tree-sitter
    language: python
    query: |
      ((module
         (expression_statement
           (call function: (identifier) @fn
                 arguments: (argument_list . [
                   (call) (identifier) (attribute) (subscript)
                   (conditional_expression) (binary_operator)] @arg))))
       (#eq? @fn "exec")
       (#not-match? @arg "^compile\\([bruBRUf]{0,2}['\"]")
       (#not-match? @arg "\\bopen\\b"))
      ((module
         (expression_statement
           (assignment right: (call function: (identifier) @fn
                 arguments: (argument_list . [
                   (call) (identifier) (attribute) (subscript)
                   (conditional_expression) (binary_operator)] @arg)))))
       (#eq? @fn "exec")
       (#not-match? @arg "^compile\\([bruBRUf]{0,2}['\"]")
       (#not-match? @arg "\\bopen\\b"))
  unless:
  - id: well-known/lib/development/python-tooling::setup-version-file-exec
  - type: text
    regex: \bexec\(compile\(open\((activate_this|__file__|["'][^"']+\.py["'])
  - type: text
    regex: (?s)SourceFileLoader\(.{0,400}exec\(compile\(
  - type: path
    regex: (^|[\\/])(benchmarks?[\\/]|patches[\\/]patch-[^\\/]+$)
  - type: text
    regex: \bexec\s*\(\s*\w*template\.substitute\s*\(
  - id: micro-behaviors/metaprogramming/generation::python-exec-source-context
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: well-known/app/infrastructure/luci::swarming-bot-bootstrap-context
- id: exec-builtin
  desc: Executes dynamic Python code with exec()
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: exec
  unless:
  - id: micro-behaviors/metaprogramming/generation::python-execution-template-generator
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: well-known/tool/detection/security-remediation::compiled-remediation-catalog
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/agentskillmap/
  - id: metadata/lang/scripted::jsp-page-directive
- id: python-exec-docstring
  desc: Executes text taken from a docstring
  conf: 0.94
  if:
    type: text
    regex: exec\([\s\S]{0,200}__doc__
- id: run-method-exec
  desc: Python run method invokes exec()
  conf: 0.94
  if:
    type: text
    regex: (?m)^[ \t]+def run\([^\n)]{0,40}\):\r?\n(([ \t]+[^\r\n]{0,120})?\r?\n){0,6}[ \t]+exec\(
- id: run-method-eval
  desc: Python run method invokes eval()
  conf: 0.94
  if:
    type: text
    regex: (?m)^[ \t]+def run\([^\n)]{0,40}\):\r?\n(([ \t]+[^\r\n]{0,120})?\r?\n){0,6}[ \t]+eval\(
- id: exec-variable
  desc: Python exec() executes a variable value
  conf: 0.94
  if:
    type: symbol
    kind: call
    exact: exec
    arg:
      index: 0
      kind: identifier
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: metadata/lang/scripted::jsp-page-directive
- id: exec-variable-namespace
  desc: Python built-in exec() with explicit namespace
  conf: 0.95
  if:
    type: tree-sitter
    kind: call
    regex: ^exec\s*\(\s*[A-Za-z_]\w*\s*,\s*[A-Za-z_]\w*
- id: exec-file-read-result
  desc: Python exec() evaluates file-read results
  conf: 0.92
  if:
    type: text
    regex: exec\s*\(\s*(open\s*\(.{1,160}\)\.read\s*\(|\w+\.read\(\)\s*,\s*\w+\s*\))
  unless:
  - id: metadata/package/testing/harness/runtime/
- id: python-exec-triple-quoted-literal
  desc: exec() of a triple-quoted string literal
  conf: 0.92
  if:
    type: text
    regex: \bexec\s*\(\s*('{3}|"{3})
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: python-exec-with-copied-globals
  desc: exec() with a copy of module globals
  conf: 0.88
  ref: sha256:a6dfb93ccf1c019100eb55c65b0d5ccc26f835cf876f96fe8366a3376449052a
  if:
    type: text
    regex: globals\(\)\.copy\(\)[\s\S]{0,180}exec\s*\(
- id: python-eval-subscripted-config
  desc: eval() of a config or data subscript
  conf: 0.85
  if:
    type: tree-sitter
    kind: call
    regex: \beval\s*\(\s*(config|data|payload)\w*\s*\[
- id: exec-formatted-string
  desc: Python exec receives an f-string expression
  conf: 0.94
  if:
    type: text
    regex: \bexec\s*\(\s*[fF]["']
