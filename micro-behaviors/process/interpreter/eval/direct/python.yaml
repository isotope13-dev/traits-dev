# Python eval references.
defaults:
  platforms: [linux, macos, windows]

traits:
  - id: pyc-eval-name
    desc: Python bytecode names eval
    crit: notable
    for: [pyc]
    platforms: [windows, unix]
    # The string table of the standard library and ordinary applications can
    # contain this name without an eval call.  The hidden-payload composite
    # supplies the additional context needed for an attack conclusion.
    conf: 0.95
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])eval([^A-Za-z0-9_]|$)'
