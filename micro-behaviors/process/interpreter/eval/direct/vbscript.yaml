defaults:
  crit: notable
  platforms:
  - windows
  for:
  - vbs
  - asp
  attack: T1059.005
traits:
- id: executeglobal-variable
  desc: ExecuteGlobal on variable
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: (?i)^[^'\r\n]{0,200}\bExecuteGlobal\s*(\(\s*)?[A-Za-z_]\w*\b(\.OpenTextFile)?
  not:
  - regex: (?i)[\s(]CreateObject$|\.OpenTextFile$
  - regex: (?i)\bExecuteGlobal\s+(\(\s*)?include_
  unless:
  - id: well-known/lib/platform/node-regedit/
- id: vbs-executeglobal
  desc: ExecuteGlobal evaluates VBScript text
  conf: 0.95
  if:
    type: text
    regex: (?i)\bExecuteGlobal\b
- id: vbs-execute-statement
  desc: Execute statement evaluates VBScript code
  for:
  - vbs
  - asp
  - html
  - data
  unless:
  - id: metadata/file/magic/identity::sqlite3
  - id: metadata/file/format/source-map::sourcemap-sources-content
  conf: 0.9
  if:
    type: text
    regex: (?im)^([^\r\n']{0,256}(:|Then))?[ \t]*Execute(Global)?[ \t(][^\r\n]{1,160}
    exclude_html_comments: true
  not:
  - regex: (?i)Execute(Global)?[ \t]+[A-Za-z_]\w*[ \t]+[A-Za-z_]\w*
- id: vbs-eval-function
  desc: Eval evaluates a VBScript expression
  conf: 0.88
  if:
    type: text
    regex: (?i)\bEval[\s(]
