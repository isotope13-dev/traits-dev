defaults:
  crit: notable
  platforms:
  - windows
  for:
  - vbs
  - asp
  attack: T1059.005
traits:
- id: executeglobal-variable
  desc: ExecuteGlobal on variable
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)^[^'\r\n]{0,200}\bExecuteGlobal\s*(\(\s*)?[A-Za-z_]\w*\b(\.OpenTextFile)?
  not:
  - regex: (?i)[\s(]CreateObject$|\.OpenTextFile$
  - regex: (?i)\bExecuteGlobal\s+(\(\s*)?include_
- id: vbs-executeglobal
  desc: ExecuteGlobal evaluates VBScript text
  conf: 0.95
  if:
    type: text
    regex: (?i)\bExecuteGlobal\b
- id: vbs-eval-function
  desc: Eval evaluates a VBScript expression
  conf: 0.88
  if:
    type: text
    regex: (?i)\bEval[\s(]
