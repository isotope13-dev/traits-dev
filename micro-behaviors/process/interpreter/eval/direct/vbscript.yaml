# VBScript dynamic evaluation
# ATT&CK: T1059.005 (Command and Scripting Interpreter: Visual Basic)
defaults:
  platforms: [windows]
  for: [vbs]
  attack: T1059.005

traits:
  - id: vbs-executeglobal
    desc: ExecuteGlobal evaluates VBScript text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bExecuteGlobal\b'

  # `Execute` is a VBScript *statement*, so it only ever opens a line (or
  # follows a `:` separator / `Then`).  A word-boundary match instead swept up
  # the English verb in prose ("utility to execute SQL queries") and every
  # unrelated `.Execute` method call -- ADODB commands, MSI `view.Execute`.
  # Anchoring to statement position keeps the eval primitive and adds the
  # parenthesised `Execute(code)` spelling the old `\s+` form could not see.
  - id: vbs-execute-statement
    desc: Execute statement evaluates VBScript code
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^([^\r\n'']{0,90}(:|Then))?\s{0,40}Execute[\s(]\s{0,4}\S'

  - id: vbs-eval-function
    desc: Eval evaluates a VBScript expression
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bEval\s*\('
