defaults:
  platforms: [windows]
  for: [vbs, html]

traits:
  - id: eval-identifier-call-text
    desc: Calls eval with an identifier argument
    crit: notable
    conf: 0.85
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\beval\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\)'


