# Input provenance belongs in the trait name; the operation is direct eval.
defaults:
  platforms:
  - windows
  - unix
  crit: notable
  conf: 0.95
  for:
  - javascript
  - typescript
  - package.json
  - json
  - package-lock.json
  - text
traits:
- id: decoded-buffer-eval-command-text
  desc: Constructs eval over Base64-decoded UTF-8 code
  crit: notable
  if:
    type: text
    regex: >-
      \beval\s*\(\s*Buffer\.from\([\s\S]{0,999}?['"]base64['"]\)\.toString\(['"]utf8['"]\)\)
composite_rules:
- id: decoded-buffer-eval-call-or-command
  desc: Decoded Buffer eval call or command text
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-buffer-from-argument
  - id: micro-behaviors/process/interpreter/eval/direct::decoded-buffer-eval-command-text
  unless:
  - id: metadata/package/testing/harness/fixture::inert-detection-fixture-header
  - id: well-known/tool/detection/security-scanner::skilltotal-scanner-module-path
  - id: well-known/tool/detection/security-scanner::skilltotal-package-import-marker
