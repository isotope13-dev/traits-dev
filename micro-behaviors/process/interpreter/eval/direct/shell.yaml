defaults:
  platforms: [unix, windows]
  for: [shell]
  attack: T1059
traits:
  - id: shell-source-command
    desc: Sources code in the current shell
    crit: notable
    conf: 0.98
    platforms: [unix]
    if:
      type: symbol
      kind: call
      exact: source
  # HTML Help parameters can encode a network-share command one character at
  # a time. Keep the source, UNC prefix, pipe, and interpreter as separate
  # atoms and require their close co-occurrence below.
  - id: html-entity-more-command
    desc: HTML numeric references spell the more command
    crit: component
    conf: 0.95
    for: [html]
    if:
      type: text
      substr: '&#x6d;&#x6f;&#x72;&#x65;'
      case_insensitive: true
  - id: html-entity-unc-path
    desc: HTML entities encode a UNC prefix
    crit: component
    conf: 0.95
    for: [html]
    if:
      type: text
      substr: '&#x5c;&#x5c;'
      case_insensitive: true
  - id: html-entity-cmd-token
    desc: HTML entities encode caret-obfuscated cmd
    crit: component
    conf: 0.95
    for: [html]
    if:
      type: text
      substr: '&#x63;&#x5e;&#x6d;&#x5e;&#x64;'
      case_insensitive: true

  - id: shell-eval
    desc: Evaluates a shell command string
    crit: notable
    conf: 0.5
    if:
      type: symbol
      exact: eval
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: well-known/tool/development/build/gradle-wrapper/
  - id: shell-eval-github-variable
    desc: Eval of GitHub Actions variable
    mbc: E1059.004
    platforms: [unix]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'eval\s+"\$\{?GITHUB_[A-Za-z0-9_]+'
  - id: shell-eval-variable
    desc: Eval of shell variable content
    mbc: E1059.004
    conf: 0.8
    crit: notable
    platforms: [unix]
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/build/autotools::autoconf-generated-script
      - id: metadata/build/autotools::autotools-config-basename
      - id: metadata/build/autotools::libtool-generated-script
    if:
      type: text
      regex: eval\s+"\$[A-Za-z_]
  # Covers `eval $x`, `eval "${x}"` and `eval "$(cmd)"` alike: in every form the
  # command actually run is assembled at runtime. `github-actions` is included
  # because a workflow `run:` block is shell, and the C2-poll composite in
  # objectives/command-and-control/beacon/poll/ reads this trait there.
  - id: shell-evaluates-variable-command
    desc: Shell evaluates variable command
    conf: 0.9
    crit: notable
    for: [shell, github-actions]
    if:
      type: text
      regex: '(?m)(^|[;&|({])[ \t]*(eval|source|\.)[ \t]+["'']?\$[{(]?[A-Za-z_]'

composite_rules:
  - id: network-share-file-piped-to-cmd
    desc: Remote share file content is piped into cmd
    crit: notable
    conf: 0.97
    for: [html]
    platforms: [windows]
    near_bytes: 1800
    all:
      - id: html-entity-more-command
      - id: html-entity-unc-path
      - id: micro-behaviors/data/decode/markup::html-entity-pipe-character
      - id: html-entity-cmd-token
  - id: shell-dynamic-command-execution
    desc: Shell executes dynamic command
    crit: notable
    conf: 0.92
    any:
      - id: shell-evaluates-variable-command
      - id: micro-behaviors/process/create/shell/interpreter::shell-variable-file-exec
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
