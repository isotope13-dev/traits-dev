defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable

traits:
  - id: ruby-dense-instance-eval-strings
    desc: Dense Ruby instance_eval string references
    conf: 0.85
    count_min: 5
    per_kb_min: 2.0
    if:
      type: text
      regex: '\binstance_eval[[:space:]]*[(]?["'']'

