defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
  - id: php-eval-base64-result
    desc: PHP eval consumes Base64 decoder result
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: eval
      arg:
        index: 0
        from:
          call: '^base64_decode$'
