defaults:
  for:
    - python
  platforms:
    - unix
    - windows
composite_rules:
  - id: python-dynamic-code-evaluation
    desc: Python dynamic code evaluation
    crit: notable
    conf: 0.5
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::eval-builtin
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
    unless:
      - id: metadata/filename/identity::python-runpy-basename
      - id: metadata/filename/identity::python-optparse-basename
      - id: well-known/lib/stdlib/python-stdlib
      - id: well-known/lib/ai/scikit-learn
      - id: well-known/lib/platform/psutil
      - id: metadata/file/profile/threat-scanning::code-pattern-catalog
