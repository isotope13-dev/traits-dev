defaults:
  for: [python]
  platforms: [unix, windows]
composite_rules:
- id: python-dynamic-code-evaluation
  desc: Python dynamic code evaluation
  crit: notable
  conf: 0.5
  any:
  - id: micro-behaviors/process/interpreter/eval/direct::eval-builtin
  - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
  - id: micro-behaviors/process/interpreter/eval/compile::compile-builtin
  unless:
  - id: metadata/file/naming::python-runpy-basename
  - id: metadata/file/naming::python-optparse-basename
  - id: well-known/lib/stdlib/python-stdlib
  - id: metadata/package/testing/presence/harness/
  - id: well-known/lib/ai/scikit-learn
  - id: well-known/lib/platform/psutil/
  - id: well-known/tool/detection/security-scanner::code-pattern-catalog
  - id: "metadata/file/naming::test-directory-component"
