# Ordinary Groovy runtimes and deployment DSLs evaluate application scripts.
# Attack composites supply the untrusted source or control-tampering context.
defaults:
  for: [groovy]
  platforms: [unix, windows]
  crit: notable
  conf: 0.84
traits:
  - id: groovy-dynamic-evaluate
    desc: Groovy script-evaluation expression
    if:
      type: text
      regex: 'GroovyShell[\s\S]{0,80}\.evaluate\s*\(|\bEval\.me\s*\(\s*["'']|\bevaluate\s*\(\s*["'']'
    unless:
      - id: metadata/build/artifact::gradle-build-script-basename
      - type: path
        dirname: true
        regex: '(^|[\\/])tests?([\\/]|$)'
