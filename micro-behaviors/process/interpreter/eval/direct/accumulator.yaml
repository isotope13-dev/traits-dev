composite_rules:
- crit: notable
  platforms:
  - windows
  for:
  - javascript
  size_max: 5000000
  id: js-accumulator-eval-cooccurrence
  desc: String initialization and addition near eval
  conf: 0.95
  near_lines: 8
  all:
  - id: micro-behaviors/data/string/concat::js-empty-string-initializer
  - id: micro-behaviors/data/arithmetic::js-addition-assignment-identifier
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
  unless:
  - id: well-known/lib/development/js-beautify::package-context
