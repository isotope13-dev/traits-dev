defaults:
  platforms: [windows]
  for: [vbs, html]

composite_rules:
  - id: hta-hex-xor-eval-context
    desc: HTA eval near hex-XOR decoder and Base64 text
    crit: suspicious
    conf: 0.99
    # The hex-XOR profile requires an HTML-only <hta:application> element,
    # so this rule cannot fire on bare JavaScript.
    for: [html]
    all:
      - id: micro-behaviors/data/decode/custom::hta-hex-xor-string-decoder
      - id: metadata/file/encoding::large-base64-shaped-assignment
      - id: micro-behaviors/process/interpreter/eval/direct::html-eval-identifier-call-text
