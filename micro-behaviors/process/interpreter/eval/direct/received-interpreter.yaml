# Receiving data and evaluating it crosses a code/data boundary, including in
# local RPC test clients. The flow alone does not establish command tasking.
# Preserve this suspicious capability without asserting a C2 objective.
defaults:
  for: [python, ruby]
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.98

traits:
  - id: recv-result-code-eval
    desc: Evaluates data returned by recv
    attack: T1059
    if:
      type: symbol
      kind: call
      exact: eval
      arg:
        index: 0
        from:
          call: '(^|\.)recv$'
          through:
            - call: '\.decode$'
              receiver: true
            - call: '\.strip$'
              receiver: true
