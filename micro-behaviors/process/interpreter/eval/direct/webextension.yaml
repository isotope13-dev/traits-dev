# A browser extension that exposes a main-world postMessage-to-eval bridge on
# all sites.  This is a neutral dynamic-code execution capability; objective
# rules may combine it with remote payload delivery or other intent evidence.
defaults:
  platforms: [windows, unix]

composite_rules:
  - id: all-site-main-world-message-eval-bridge
    desc: All-site main-world extension message/eval bridge
    crit: notable
    conf: 0.98
    scope: archive
    for: [crx, xpi, zip]
    all:
      - id: metadata/permission/activation::content-script-main-world
      - id: metadata/permission/host::content-script-all-urls
      - id: micro-behaviors/communications/ipc/message::js-message-event-listener
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
