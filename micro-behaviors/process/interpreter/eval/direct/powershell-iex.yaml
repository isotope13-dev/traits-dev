# PowerShell dynamic expression evaluation primitives.
defaults:
  platforms: [windows, unix]
  for: [powershell]
  attack: T1059.001
  mbc: E1059

traits:
  - id: powershell-iex-call
    desc: PowerShell Invoke-Expression or iex call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)^(iex|Invoke-Expression)$'

  - id: embedded-powershell-iex
    desc: PowerShell Invoke-Expression command text
    crit: notable
    conf: 0.9
    for: [javascript, html, vbs, batch]
    if:
      # This also covers a WSH loader that stores the PowerShell command in an
      # environment variable and invokes it through a later child process.
      type: text
      # Do not treat a pipe-delimited PowerShell command catalogue as an IEX
      # call. A loader supplies an argument (or an opening call delimiter).
      regex: '(?i)\bInvoke-Expression\b\s*([\$"''`(]|[A-Za-z_])'
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
  - id: embedded-powershell-iex-alias
    desc: Embedded PowerShell IEX alias call
    crit: notable
    conf: 0.9
    for: [javascript, html, vbs, batch]
    if:
      type: text
      # HTML attributes entity-encode '$' as &#36; without changing the
      # PowerShell command which mshta/HHCtrl eventually executes.
      regex: '(?i)\biex(\s*\(|\s+(\$|&#36;)[A-Za-z_]\w*)'

  - id: embedded-powershell-chained-iex
    desc: PowerShell pipes IEX output to IEX
    crit: suspicious
    conf: 0.98
    for: [powershell, javascript, html, vbs]
    if:
      type: text
      regex: '(?i)\biex\s+\$[A-Za-z_]\w*\s*\|\s*iex\b'

  # Anchored at the literal's start: a Python docstring is a string literal,
  # so the unanchored form convicted any module that documents its own
  # `powershell -c "irm https://…/install.ps1 | iex"` install line in prose.
  # That matters because python-powershell-irm-iex pairs this atom with a
  # Popen in the same file to reach hostile — a shape an ordinary CLI
  # updater module has. Building the command still starts the literal.
  #
  # Not Python-specific. The command is a string handed to whatever spawns a
  # process, so the host language is incidental — the same literal appears in
  # the JavaScript of a VS Code extension calling `child_process.exec`, and
  # scoping this to Python left that unmatched by anything. The anchor is what
  # does the work against documentation prose, and it does so in every language.
  - id: powershell-irm-iex-command-string
    desc: PowerShell download-and-execute command string
    crit: notable
    conf: 0.95
    for: [scripts, source]
    if:
      type: literal
      kind: string
      regex: '(?i)^\s{0,8}powershell\b.{0,80}\birm\b.{0,120}\|\s*iex'

composite_rules:
  # This proximity proves a download-and-evaluate capability, but not that the
  # response is piped into IEX or that the execution is malicious. Stronger
  # objective rules add pipeline syntax, stealth, bypass, or payload evidence.
  - id: powershell-restmethod-near-iex
    desc: Invoke-RestMethod occurs near IEX
    crit: notable
    conf: 0.96
    attack: T1105
    for: [powershell, batch]
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-restmethod
      - id: powershell-iex-call
    near_bytes: 256

  # Either spelling of the fetch-execute command line: recovered as a parsed
  # literal, or read out of the decoded text when a packer escaped it. One name
  # for consumers so they need not know which surface carried it.
  - id: powershell-fetch-execute-command
    desc: PowerShell fetch-execute command present
    crit: notable
    conf: 0.92
    for: [scripts, source]
    any:
      - id: powershell-irm-iex-command-string
      - id: micro-behaviors/communications/http/download/cli::embedded-powershell-irm-iex-command

  - id: powershell-expression-eval
    desc: PowerShell expression evaluation call
    crit: notable
    conf: 0.9
    for: [powershell, javascript, html, vbs, batch]
    any:
      - id: powershell-iex-call
      - id: embedded-powershell-iex
      - id: embedded-powershell-iex-alias
