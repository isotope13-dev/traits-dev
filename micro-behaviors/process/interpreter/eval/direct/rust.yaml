# Rust wasm-bindgen declarations that expose JavaScript string evaluation.
defaults:
  platforms: [unix, windows]
  for: [rust]

traits:
  - id: wasm-bindgen-js-eval-binding
    desc: Exposes JavaScript eval through wasm-bindgen
    crit: notable
    conf: 0.99
    attack: T1059.007
    if:
      type: text
      substr: 'pub fn eval(js_source_text: &str) -> Result<JsValue, JsValue>;'
