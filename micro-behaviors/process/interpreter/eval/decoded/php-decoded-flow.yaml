defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
  - id: php-eval-base64-result
    desc: PHP eval consumes Base64 decoder result
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: eval
      arg:
        index: 0
        from:
          call: '^base64_decode$'

composite_rules:
  # Indirect form: the decoder result reaches eval() through a variable, so
  # the structured call provenance above cannot join the two call sites, and
  # bare-PHP injections typed Text produce no call facts at all. Co-location
  # of the variable eval beside a carrier-scale literal decode is the
  # evidence; it does not prove the decoded value is what eval consumes.
  - id: php-eval-base64-literal-indirect
    desc: Evaluates a variable beside a Base64 literal decode
    crit: suspicious
    conf: 0.9
    for: [php, text]
    near_lines: 4
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::eval-variable-argument
      - id: micro-behaviors/data/decode/embedded/base64::php-large-literal-base64-decode
