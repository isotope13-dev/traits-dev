defaults:
  platforms: [unix, windows]
  for: [ruby]

composite_rules:
  - id: extconf-base64-eval-install-payload
    desc: Extension hook Base64, eval and runtime clues
    crit: component
    conf: 0.98
    scope: file
    near_bytes: 2800
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/data/decode/base64/unspecified::ruby-base64-decode64-call
      - id: micro-behaviors/process/interpreter/eval/direct::ruby-eval
    any:
      - id: micro-behaviors/communications/socket/connect/tcp::ruby-socket-connect
      - id: micro-behaviors/communications/socket/send/stream::ruby-copy-stream-to-socket
      - id: micro-behaviors/process/thread/create::ruby-thread-new
