defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: js-eval-url-decoded
  desc: eval() of URL-decoded data
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: eval\(\s*decodeURIComponent\s*\(
- id: js-eval-final-line-base64
  desc: Final-line eval decodes long Base64 literal
  crit: notable
  conf: 0.94
  attack: T1059.007
  if:
    type: text
    regex: 'eval\(\s*(Buffer\.from|atob)\(\s*["''][A-Za-z0-9+/=_-]{500,}[^\r\n]{1,64}\s*\z'
