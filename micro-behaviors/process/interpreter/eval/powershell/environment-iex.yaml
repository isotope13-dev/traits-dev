defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
traits:
  - id: powershell-eval-environment-variable
    desc: PowerShell evaluates an environment variable
    conf: 0.95
    if:
      type: text
      regex: '(?im)(^|[;|])\s*(iex|Invoke-Expression)[ \t]+\$env:[A-Za-z_][A-Za-z0-9_]*\b'
