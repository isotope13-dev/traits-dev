defaults:
  platforms: [windows]
  for: [perl]
  crit: notable
  conf: 0.98
  attack: T1059.001

traits:
  - id: perl-process-pipe-eval
    desc: Perl passes pipe-to-IEX command text
    if:
      type: symbol
      kind: call
      exact: system
      arg:
        from:
          value: '(?i)\|\s*iex\b'
