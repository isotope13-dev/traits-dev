# Invoke-Expression consuming Encoding.GetString output in the same
# expression, so the evaluated text is the decoded byte buffer itself and not
# an unrelated variable that happens to share the file.
defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1059.001

traits:
  - id: powershell-iex-argument-getstring
    desc: Invoke-Expression argument is decoded bytes
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\b(iex|Invoke-Expression)\b\s*\(+\s*\[(System\.)?Text\.Encoding\]::\w+\.GetString'
  - id: powershell-getstring-piped-to-iex
    desc: Decoded bytes piped to Invoke-Expression
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\.GetString\([^)\n]{1,80}\)\s*\)?\s*\|\s*(iex|Invoke-Expression)\b'

composite_rules:
  - id: powershell-iex-of-decoded-bytes
    desc: Invoke-Expression evaluates decoded bytes
    crit: notable
    conf: 0.93
    any:
    - id: powershell-iex-argument-getstring
    - id: powershell-getstring-piped-to-iex
