defaults:
  crit: notable
  platforms: [windows, unix]
  for: [powershell]
composite_rules:
  - id: powershell-multiple-eval-paths
    desc: PowerShell ScriptBlock and eval references
    conf: 0.95
    near_lines: 20
    all:
      - id: micro-behaviors/metaprogramming/generation/function::powershell-scriptblock-constructor-text
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
