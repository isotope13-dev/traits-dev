defaults:
  crit: notable
  platforms: [windows, unix]
  for: [powershell]
  conf: 0.94

traits:
  - id: powershell-pipelined-outstring-iex
    desc: Pipes Out-String output into Invoke-Expression
    if:
      type: text
      regex: '(?i)\|\s*Out-String\s*\|\s*(Invoke-Expression|iex)\b'

  - id: powershell-dot-sourced-variable
    desc: Dot-sources a PowerShell variable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*\.\s+\$[A-Za-z_]\w*(\s+[^\r\n#;]{1,60})?\s*$'

  - id: powershell-try-block-iex
    desc: PowerShell try block invokes Invoke-Expression
    crit: component
    if:
      type: text
      regex: '(?is)\btry\s*\{[^}]{1,200}\b(Invoke-Expression|iex)\b'

  - id: powershell-try-block-scriptblock
    desc: PowerShell try block builds ScriptBlock
    crit: component
    if:
      type: text
      regex: '(?is)\btry\s*\{[^}]{1,200}\[ScriptBlock\]::Create\b'

  - id: powershell-try-block-add-type
    desc: PowerShell try block invokes Add-Type
    crit: component
    if:
      type: text
      regex: '(?is)\btry\s*\{[^}]{1,200}\bAdd-Type\b'

composite_rules:
  - id: powershell-try-catch-eval-sink
    desc: PowerShell try blocks wrap eval sinks
    conf: 0.95
    needs: 2
    any:
      - id: powershell-try-block-iex
      - id: powershell-try-block-scriptblock
      - id: powershell-try-block-add-type
