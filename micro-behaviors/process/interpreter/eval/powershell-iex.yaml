# PowerShell dynamic expression evaluation primitives.
defaults:
  platforms: [windows, unix]
  for: [powershell]
  attack: T1059.001
  mbc: E1059

traits:
  - id: powershell-iex-call
    desc: PowerShell Invoke-Expression or iex call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)^(iex|Invoke-Expression)$'

  - id: embedded-powershell-iex
    desc: PowerShell Invoke-Expression command text
    crit: notable
    conf: 0.9
    for: [javascript, html, vbs]
    if:
      # This also covers a WSH loader that stores the PowerShell command in an
      # environment variable and invokes it through a later child process.
      type: text
      # Do not treat a pipe-delimited PowerShell command catalogue as an IEX
      # call. A loader supplies an argument (or an opening call delimiter).
      regex: '(?i)\bInvoke-Expression\b\s*([\$"''`(]|[A-Za-z_])'
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
  - id: embedded-powershell-iex-alias
    desc: Embedded PowerShell IEX alias call
    crit: notable
    conf: 0.9
    for: [javascript, html, vbs]
    if:
      type: text
      regex: '(?i)\biex(\s*\(|\s+\$[A-Za-z_]\w*)'

  - id: embedded-powershell-chained-iex
    desc: PowerShell pipes IEX output to IEX
    crit: suspicious
    conf: 0.98
    for: [powershell, javascript, html, vbs]
    if:
      type: text
      regex: '(?i)\biex\s+\$[A-Za-z_]\w*\s*\|\s*iex\b'

  # Anchored at the literal's start: a Python docstring is a string literal,
  # so the unanchored form convicted any module that documents its own
  # `powershell -c "irm https://…/install.ps1 | iex"` install line in prose.
  # That matters because python-powershell-irm-iex pairs this atom with a
  # Popen in the same file to reach hostile — a shape an ordinary CLI
  # updater module has. Building the command still starts the literal.
  - id: powershell-irm-iex-command-string
    desc: PowerShell download-and-execute command string
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: literal
      kind: string
      regex: '(?i)^\s{0,8}powershell\b.{0,80}\birm\b.{0,120}\|\s*iex'

