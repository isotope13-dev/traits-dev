# Clojure's own interpreter surface: forms and source text compiled at runtime.
#
# `eval` takes a data structure and compiles it; `load-string` / `load-reader` /
# `load-file` compile source text. Macro-writing libraries call `eval` at
# expansion time for legitimate reasons, so these stay neutral capabilities;
# composites supply the intent (source arriving from a socket, a decoded blob,
# or an untrusted request body).
#
# `read-string` is included because `clojure.core/read-string` honours
# `*read-eval*` — a `#=(…)` form inside the string executes during parsing, which
# is why `clojure.edn/read-string` exists as the safe alternative. The matcher is
# anchored so the `edn/`-namespaced call does not match.
defaults:
  platforms: [unix, windows]
  for: [clojure]
  crit: notable
  conf: 0.9
  attack: T1059
  mbc: B0031

traits:
  - id: clojure-eval-call
    desc: Compiles a Clojure form with eval
    if:
      type: symbol
      kind: call
      exact: eval

  - id: clojure-load-source-call
    desc: Compiles Clojure source text at runtime
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '^load-(string|reader|file)$'

  - id: clojure-read-string-call
    desc: Parses Clojure with read-eval read-string
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: read-string
