# The name of the evaluator is assembled from the current date
# ("e"+(month-1)+"a"+"l", then a replace() swaps the number for "v"), so
# the stub only resolves eval in the month its author targeted and the
# word eval never appears in the source.
traits:
  - id: date-derived-eval-name
    desc: Builds evaluator name from the current date
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [javascript, html]
    if:
      type: text
      regex: '["'']e["'']\s*\+\s*\(?\s*parseInt\(\s*\w+\.get(Month|Date|Day|Hours)\(\)\s*\)\s*[-+]'
