defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-var-charcode-result-eval
    desc: Evaluates a variable built from character codes
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((_ (variable_declaration
              (variable_declarator name: (identifier) @value
                value: (call_expression
                  function: (member_expression object: (identifier) @string
                    property: (property_identifier) @from))))
            (expression_statement (call_expression
              function: (identifier) @eval
              arguments: (arguments (identifier) @used))))
          (#eq? @string "String")
          (#eq? @from "fromCharCode")
          (#eq? @eval "eval")
          (#eq? @value @used))
  - id: js-lexical-charcode-result-eval
    desc: Evaluates a lexical character-code result
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((_ (lexical_declaration
              (variable_declarator name: (identifier) @value
                value: (call_expression
                  function: (member_expression object: (identifier) @string
                    property: (property_identifier) @from))))
            (expression_statement (call_expression
              function: (identifier) @eval
              arguments: (arguments (identifier) @used))))
          (#eq? @string "String")
          (#eq? @from "fromCharCode")
          (#eq? @eval "eval")
          (#eq? @value @used))

composite_rules:
  - id: js-charcode-result-eval
    desc: Character-code result reaches eval
    crit: notable
    conf: 0.96
    any:
      - id: js-var-charcode-result-eval
      - id: js-lexical-charcode-result-eval
