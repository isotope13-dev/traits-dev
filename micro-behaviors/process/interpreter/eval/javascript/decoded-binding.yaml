defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.97
traits:
  # A function call and its guarded evaluation can live inside a function,
  # try body, or other block. Match adjacent statements and the same binding
  # in all three positions; unrelated calls/eval elsewhere do not qualify.
  - id: guarded-call-result-eval
    desc: Evaluates a guarded function result
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator name: (identifier) @decoded
              value: (call_expression function: (identifier) @called)))
          . (if_statement
              condition: (parenthesized_expression (identifier) @guarded)
              consequence: (expression_statement
                (call_expression function: (identifier) @sink
                  arguments: (arguments . (identifier) @evaluated .)))))
          (#eq? @decoded @guarded)
          (#eq? @decoded @evaluated)
          (#eq? @sink "eval"))

  - id: declared-decoder-result-eval
    desc: Evaluates a declared decoder result
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((program
          (function_declaration name: (identifier) @declared)
          (lexical_declaration
            (variable_declarator name: (identifier) @decoded
              value: (call_expression function: (identifier) @called)))
          (expression_statement
            (call_expression function: (identifier) @eval
              arguments: (arguments . (identifier) @evaluated))))
          (#eq? @declared @called)
          (#eq? @decoded @evaluated)
          (#eq? @eval "eval"))
