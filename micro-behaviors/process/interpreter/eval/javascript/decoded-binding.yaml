defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.97
traits:
  - id: declared-decoder-result-eval
    desc: Evaluates a declared decoder result
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((program
          (function_declaration name: (identifier) @declared)
          (lexical_declaration
            (variable_declarator name: (identifier) @decoded
              value: (call_expression function: (identifier) @called)))
          (expression_statement
            (call_expression function: (identifier) @eval
              arguments: (arguments . (identifier) @evaluated))))
          (#eq? @declared @called)
          (#eq? @decoded @evaluated)
          (#eq? @eval "eval"))
