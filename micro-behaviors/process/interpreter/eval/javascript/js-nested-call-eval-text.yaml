# Source-text observations of JavaScript eval() receiving a nested helper call
# or identifier argument across standalone JS/TS and HTML script blocks (where
# HTML does not populate a JavaScript AST).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable

traits:
  - id: js-eval-nested-identifier-call-text
    desc: Script eval executes helper call result
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: '(^|[^.$\w])((window|globalThis)\.)?eval\s*\(\s*[\w$]+\s*\(\s*[\w$]+\s*\)\s*\)'
    unless: &eval-text-exclusions
      - id: metadata/lang/locale/catalog::gettext-po-catalog
      - id: metadata/file/format/security-corpus::trait-expectation-catalog
      - id: metadata/lang/scripted::dts-declaration-file

  - id: js-eval-identifier-arg-text
    desc: Script eval executes identifier in text
    conf: 0.85
    if:
      type: text
      exclude_html_comments: true
      regex: '(^|[^.$\w])((window|globalThis)\.)?eval\s*\(\s*[A-Za-z_$][\w$]*\s*\)'
    unless: *eval-text-exclusions

  - id: js-eval-nested-encoded-literal-call-text
    desc: Script eval calls helper on encoded text
    conf: 0.92
    if:
      type: text
      exclude_html_comments: true
      regex: '(^|[^.$\w])(window\.)?eval\s*\(\s*[\w$]+\s*\(\s*["''][A-Za-z0-9+/=@_~.-]{64,}'
    unless: *eval-text-exclusions
