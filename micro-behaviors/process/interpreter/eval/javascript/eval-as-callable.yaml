# eval handed to a proxy function as a value (obfuscator.io call wrappers),
# so the call site reads helper(eval, code) instead of eval(code).
traits:
  - id: eval-passed-as-callable-argument
    desc: Passes eval as a function argument
    crit: notable
    conf: 0.85
    platforms: [windows, unix]
    for: [javascript, html]
    if:
      type: text
      regex: '\]\(\s*eval\s*,\s*\w+\s*\)'
