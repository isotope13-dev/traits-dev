# Function construction alone does not execute the HTTP response. Require
# invocation and connect the response member to the generated function body.
# Facts do not currently track new-expression arguments through value flow.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  attack: T1059.007

traits:
  - id: js-function-response-text-execution
    desc: Runs responseText through generated Function
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression function: [(new_expression constructor: (identifier) @ctor arguments: (arguments . (member_expression property: (property_identifier) @response) .))
        (call_expression function: (identifier) @ctor arguments: (arguments . (member_expression property: (property_identifier) @response) .))
        (parenthesized_expression (new_expression constructor: (identifier) @ctor arguments: (arguments . (member_expression property: (property_identifier) @response) .)))
        (parenthesized_expression (call_expression function: (identifier) @ctor arguments: (arguments . (member_expression property: (property_identifier) @response) .)))]) @evidence
         (#eq? @ctor "Function") (#eq? @response "responseText"))
        ; Adjacent binding preserves the response body without intervening writes.
        ((_ [(variable_declaration . (variable_declarator name: (identifier) @body value: (member_expression property: (property_identifier) @response)) .)
        (lexical_declaration . (variable_declarator name: (identifier) @body value: (member_expression property: (property_identifier) @response)) .)]
         . (expression_statement (call_expression function: [(new_expression constructor: (identifier) @ctor arguments: (arguments . (identifier) @used .))
        (call_expression function: (identifier) @ctor arguments: (arguments . (identifier) @used .))
        (parenthesized_expression (new_expression constructor: (identifier) @ctor arguments: (arguments . (identifier) @used .)))
        (parenthesized_expression (call_expression function: (identifier) @ctor arguments: (arguments . (identifier) @used .)))]))) @evidence
         (#eq? @ctor "Function") (#eq? @response "responseText")
         (#eq? @body @used))
        ; A compiled response may also be bound and then called in the next statement.
        ((_ [(variable_declaration . (variable_declarator name: (identifier) @compiled value: [(new_expression constructor: (identifier) @ctor arguments: (arguments . (member_expression property: (property_identifier) @response) .))
        (call_expression function: (identifier) @ctor arguments: (arguments . (member_expression property: (property_identifier) @response) .))
        (parenthesized_expression (new_expression constructor: (identifier) @ctor arguments: (arguments . (member_expression property: (property_identifier) @response) .)))
        (parenthesized_expression (call_expression function: (identifier) @ctor arguments: (arguments . (member_expression property: (property_identifier) @response) .)))]) .)
        (lexical_declaration . (variable_declarator name: (identifier) @compiled value: [(new_expression constructor: (identifier) @ctor arguments: (arguments . (member_expression property: (property_identifier) @response) .))
        (call_expression function: (identifier) @ctor arguments: (arguments . (member_expression property: (property_identifier) @response) .))
        (parenthesized_expression (new_expression constructor: (identifier) @ctor arguments: (arguments . (member_expression property: (property_identifier) @response) .)))
        (parenthesized_expression (call_expression function: (identifier) @ctor arguments: (arguments . (member_expression property: (property_identifier) @response) .)))]) .)]
         . (expression_statement (call_expression function: (identifier) @run))) @evidence
         (#eq? @ctor "Function") (#eq? @response "responseText")
         (#eq? @compiled @run))
