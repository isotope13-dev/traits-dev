defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
traits:
- id: eval-content-property
  desc: Evaluates a content property
  crit: suspicious
  conf: 0.98
  unless:
  - id: metadata/file/catalog/github-issue::github-issue-intel-catalog
  - id: well-known/tool/offensive/wirelessxpl::authorized-framework-context
  if:
    type: text
    regex: \beval\s*\(\s*[A-Za-z_$][\w$]*\.content\s*\)
