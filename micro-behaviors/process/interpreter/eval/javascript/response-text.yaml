defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059.007

traits:
  - id: js-eval-response-text
    desc: JavaScript evaluates HTTP responseText
    conf: 0.97
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression function: (identifier) @eval
          arguments: (arguments (member_expression
            property: (property_identifier) @response))) @direct
          (#eq? @eval "eval")
          (#eq? @response "responseText"))
        ((_ (expression_statement (assignment_expression
              left: (_) @stored
              right: (member_expression
                property: (property_identifier) @response)))
            . (expression_statement (call_expression
              function: (identifier) @eval
              arguments: (arguments (_) @executed)))) @binding
          (#eq? @eval "eval")
          (#eq? @response "responseText")
          (#eq? @stored @executed))
        ; A status/nonempty guard may sit between the binding and evaluation.
        ; Keep the guarded body to the single eval statement, and reject
        ; conditions that can call code or overwrite the stored response.
        ((_ [(variable_declaration . (variable_declarator
                name: (identifier) @stored
                value: (member_expression
                  property: (property_identifier) @response)) .)
             (lexical_declaration . (variable_declarator
                name: (identifier) @stored
                value: (member_expression
                  property: (property_identifier) @response)) .)]
            . (if_statement
                condition: (parenthesized_expression) @guard
                consequence: (statement_block
                  . (expression_statement (call_expression
                      function: (identifier) @eval
                      arguments: (arguments (identifier) @executed))) .))) @guarded
          (#eq? @eval "eval")
          (#eq? @response "responseText")
          (#eq? @stored @executed)
          (#match? @guard "^[A-Za-z0-9_$ .()!<>=&|\\s]+$")
          (#not-match? @guard "(^|[^=!<>])=[^=]")
          (#not-match? @guard "[A-Za-z_$][A-Za-z0-9_$]*\\s*\\(")
          (#not-match? @guard "\\b(new|await|yield|delete)\\b"))
        ((_ [(variable_declaration (variable_declarator
                name: (identifier) @stored
                value: (member_expression
                  property: (property_identifier) @response)))
             (lexical_declaration (variable_declarator
                name: (identifier) @stored
                value: (member_expression
                  property: (property_identifier) @response)))]
            . (expression_statement (call_expression
              function: (identifier) @eval
              arguments: (arguments (identifier) @executed)))) @binding
          (#eq? @eval "eval")
          (#eq? @response "responseText")
          (#eq? @stored @executed))
