defaults:
  for: [javascript]
  platforms: [windows, unix]
  crit: notable
traits:
  # Reuses the projected value graph, including local decoder returns and
  # string accumulation. A nearby independent conversion cannot supply it.
  - id: javascript-eval-charcode-origin
    desc: JavaScript eval consumes character-built data
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: eval
      arg:
        index: 0
        from:
          call: '^String\.fromCharCode$'
