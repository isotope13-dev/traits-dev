# A cipher round shipped as a string literal and run through eval, so the
# byte-mask loop never appears as code until runtime.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
traits:
  - id: eval-literal-byte-mask-loop
    desc: Evaluates string literal holding byte-mask loop
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '="[^"\n]{0,160}&0xff[^"\n]{0,160}";\s*eval\(\w+\)'
