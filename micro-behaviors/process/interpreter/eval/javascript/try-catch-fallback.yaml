defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
  conf: 0.93

traits:
  - id: js-try-block-eval
    desc: JavaScript try block calls eval
    crit: component
    if:
      type: text
      regex: '(?is)\btry\s*\{[^}]{1,180}(^|[^.$\w])eval\s*\('

  - id: js-try-block-function-ctor
    desc: JavaScript try block calls Function constructor
    crit: component
    if:
      type: text
      regex: '(?is)\btry\s*\{[^}]{1,180}\bnew\s+Function\s*\('

  - id: js-try-block-vm-context
    desc: JavaScript try block calls VM context
    crit: component
    if:
      type: text
      regex: '(?is)\btry\s*\{[^}]{1,180}\brunIn(This|New)Context\s*\('

composite_rules:
  - id: js-try-catch-eval-sink
    desc: JavaScript try blocks wrap eval sinks
    conf: 0.95
    needs: 2
    any:
      - id: js-try-block-eval
      - id: js-try-block-function-ctor
      - id: js-try-block-vm-context
