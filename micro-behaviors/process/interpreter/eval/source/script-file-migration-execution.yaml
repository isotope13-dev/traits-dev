defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: dot-source-script-command-text
    desc: Dot-source shell-script command text
    conf: 0.7
    for: [scripts]
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
      - id: metadata/build/autotools::autoconf-generated-script
      - type: basename
        regex: (?i)(^|[/\\!])(METADATA|PKG-INFO|README(\.[^/\\!]*)?)$
      - id: metadata/package/freeform::pkg-description-content-type-markdown
      - id: metadata/lang/embedded::shell
    if:
      type: text
      regex: (?m)(^|[\n;&|])\s*\.\s+\S{1,80}\.sh
