defaults:
  crit: notable
  conf: 0.95
  for: [shell]
  platforms: [unix]

traits:
  - id: shell-sources-debconf-confmodule
    desc: Shell sources Debconf configuration module
    if:
      type: symbol
      kind: import
      exact: /usr/share/debconf/confmodule

  # `source` is also a common prose word and config field name, and agent-skill
  # markdown is often typed as shell, so a bare `source` word match fired on
  # sentences like "`source` 为 `env` 时..." where nothing is sourced. Require
  # command position (line start or after a separator) and a filename argument:
  # the builtin errors out without one, so `source` alone is never a call.
  - id: shell-source-command
    desc: Sources code in the current shell
    attack: T1059
    if:
      type: text
      regex: '(?m)(^|[;|&])\s*source\s+\S'
