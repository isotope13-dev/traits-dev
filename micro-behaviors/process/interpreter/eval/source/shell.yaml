defaults:
  crit: notable
  conf: 0.95
  for: [shell]
  platforms: [unix]

traits:
  - id: shell-sources-debconf-confmodule
    desc: Shell sources Debconf configuration module
    if:
      type: symbol
      kind: import
      exact: /usr/share/debconf/confmodule

  # Parsed calls exclude prose, comments, and heredoc contents, none of which
  # execute as shell commands merely because they contain the word source.
  - id: shell-source-command
    desc: Sources code in the current shell
    attack: T1059
    if:
      type: symbol
      kind: call
      exact: source
