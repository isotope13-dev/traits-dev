# A classic script with src as its sole attribute loads source into the
# page interpreter. This excludes non-executable types and mere links.
defaults:
  platforms: [windows, unix]
  for: [html]

traits:
  - id: html-classic-script-src
    desc: Classic script element loads external source
    crit: notable
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      exclude_html_comments: true
      regex: '<script\s+src\s*=\s*["'']?[^"''<>\s]{1,200}["'']?\s*>'
