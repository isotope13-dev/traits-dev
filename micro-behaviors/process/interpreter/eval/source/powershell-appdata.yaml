# The call operator executes a script file in the current PowerShell host.
defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-appdata-script-invocation
    desc: PowerShell invokes a script under AppData
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: powershell
      query: |
        ((command (command_invokation_operator) @op
                  command_name: (command_name_expr) @path) @invoke
          (#eq? @op "&")
          (#match? @path "(?i)^[\"“”]\\$env:(local)?appdata[\\\\/][^\"“”\\r\\n]+\\.(js|vbs|ps1)[\"“”]$"))
