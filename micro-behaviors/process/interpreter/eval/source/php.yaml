# Variable-path inclusion evaluates a file when this statement runs; it may
# be inside an uncalled function. No automatic execution or request control
# is implied. Parse statements so quoted examples are not file evaluation.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
  - id: php-variable-file-load
    desc: PHP variable-path include or require
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((_ [(variable_name)
             (parenthesized_expression (variable_name))]) @load
          (#match? @load "(?i)^(include|require)(_once)?[ (]"))

  # The paths and adjacent statements must agree. A different bootstrap,
  # intervening reassignment, or quoted example is not this relationship.
  - id: php-read-then-include-same-path
    desc: Outputs then includes the same variable path
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((_ (_ (function_call_expression
                 function: (name) @read
                 arguments: (arguments . (argument (variable_name) @read_path) .))) @output
            . (expression_statement
                (_ [(variable_name) @include_path
                    (parenthesized_expression (variable_name) @include_path)])) @load)
          (#match? @read "(?i)^(file_get_contents|readfile)$")
          (#match? @output "(?i)^(echo|print)\\s")
          (#match? @load "(?i)^(include|require)(_once)?[ (]")
          (#eq? @read_path @include_path)) @chain

        ((_ (_ (_ (function_call_expression
                   function: (name) @read
                   arguments: (arguments . (argument (variable_name) @read_path) .)))) @output
            . (expression_statement
                (_ [(variable_name) @include_path
                    (parenthesized_expression (variable_name) @include_path)])) @load)
          (#match? @read "(?i)^(file_get_contents|readfile)$")
          (#match? @output "(?i)^print\\s")
          (#match? @load "(?i)^(include|require)(_once)?[ (]")
          (#eq? @read_path @include_path)) @chain
