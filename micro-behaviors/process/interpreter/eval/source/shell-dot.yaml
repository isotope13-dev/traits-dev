defaults:
  platforms: [unix]
  for: [shell, text]
traits:
  # Shebang-free shell regression inputs are often identified as plain text.
  # Require a complete command line and a relative file, not a prose dot.
  - id: shell-dot-relative-file
    desc: Dot-sources a relative file in shell
    crit: notable
    conf: 0.95
    attack: T1059.004
    if:
      type: text
      regex: '(?m)^[ \t]*\.[ \t]+\./[A-Za-z0-9_.][\w./-]*[ \t]*$'
