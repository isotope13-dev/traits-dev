defaults:
  platforms: [windows]
  for: [powershell, html, javascript]

traits:
- id: powershell-iex-file-content-cleanup
  desc: Evaluates file contents then deletes a path
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: '(?i)iex\s*\(\s*(gc|Get-Content)\s+\$\w+\s+-Raw\s*\)\s*;\s*ri\s+\$'

