# The call operator runs a PS1 in this PowerShell host, in a child scope.
# It does not create another OS process.
defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.9
traits:
  - id: powershell-call-script
    desc: PowerShell call operator invokes a script file
    attack: T1059.001
    if:
      type: text
      regex: '(?im)^\s*&\s+["''][^"''\r\n]{1,200}\.ps1["'']'
