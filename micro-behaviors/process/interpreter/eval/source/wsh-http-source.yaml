defaults:
  platforms:
  - windows
  for:
  - vbs
  - javascript
  crit: notable
traits:
- id: http-script-source-tag
  desc: Script tag references an HTTP source
  conf: 0.98
  crit: notable
  if:
    type: text
    regex: (?i)<script[^>]{0,120}\bsrc\s*=\s*["\']https?://
composite_rules:
- id: wsh-http-script-source
  desc: WSH job loads an HTTP script source
  crit: suspicious
  conf: 0.97
  all:
  - id: http-script-source-tag
  - id: metadata/file/format/markup::wsh-job-root-tag
