defaults:
  platforms: [unix, windows]
  for: [python]
composite_rules:
- id: python-exec-docstring-home-write
  desc: Module-level docstring exec and home-write clues
  crit: suspicious
  conf: 0.97
  near_lines: 16
  all:
  - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
  - id: micro-behaviors/process/interpreter/eval/python-builtins::python-exec-docstring
  - id: micro-behaviors/fs/write/file/unspecified::python-path-home-write-text
  - id: micro-behaviors/data/control-flow/module-exec::module-level-side-effect-call
