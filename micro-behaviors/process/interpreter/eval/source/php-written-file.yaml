defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: php-restore-then-include-same-path
    desc: PHP includes the path just conditionally written
    crit: notable
    conf: 0.98
    if:
      # Adjacent statements and equal path expressions bind check, write and
      # inclusion. The write takes variable operands; subsequent statements
      # may only adjust mode or invalidate bytecode, with literal arguments.
      # Reassignment, nested argument side effects and unrelated calls fail.
      type: tree-sitter
      query: |
        ((_ (if_statement
              condition: (parenthesized_expression
                (_ (function_call_expression
                  function: (name) @exists
                  arguments: (arguments . (argument (variable_name) @checked) .))) @negated)
              body: (compound_statement
                . (expression_statement (function_call_expression
                  function: (name) @write
                  arguments: (arguments
                    . (argument (variable_name) @written)
                    . (argument (variable_name)) .)))
                .))
            . (expression_statement
                (_ [(variable_name) @included
                    (parenthesized_expression (variable_name) @included)])) @load) @chain
          (#eq? @exists "file_exists")
          (#match? @negated "^!\\s*file_exists\\s*\\(")
          (#eq? @write "file_put_contents")
          (#match? @load "(?i)^(include|require)(_once)?[ (]")
          (#eq? @checked @written)
          (#eq? @written @included))

        ((_ (if_statement
              condition: (parenthesized_expression
                (_ (function_call_expression
                  function: (name) @exists
                  arguments: (arguments . (argument (variable_name) @checked) .))) @negated)
              body: (compound_statement
                . (expression_statement (function_call_expression
                  function: (name) @write
                  arguments: (arguments
                    . (argument (variable_name) @written)
                    . (argument (variable_name)) .)))
                . (expression_statement (function_call_expression
                  function: (name) @maintenance
                  arguments: (arguments
                    . (argument (variable_name))
                    . (argument [(integer) (boolean)]) .)))
                .))
            . (expression_statement
                (_ [(variable_name) @included
                    (parenthesized_expression (variable_name) @included)])) @load) @chain
          (#eq? @exists "file_exists")
          (#match? @negated "^!\\s*file_exists\\s*\\(")
          (#eq? @write "file_put_contents")
          (#match? @load "(?i)^(include|require)(_once)?[ (]")
          (#eq? @checked @written)
          (#eq? @written @included)
          (#match? @maintenance "^(chmod|opcache_invalidate)$"))

        ((_ (if_statement
              condition: (parenthesized_expression
                (_ (function_call_expression
                  function: (name) @exists
                  arguments: (arguments . (argument (variable_name) @checked) .))) @negated)
              body: (compound_statement
                . (expression_statement (function_call_expression
                  function: (name) @write
                  arguments: (arguments
                    . (argument (variable_name) @written)
                    . (argument (variable_name)) .)))
                . (expression_statement (function_call_expression
                  function: (name) @maintenance
                  arguments: (arguments
                    . (argument (variable_name))
                    . (argument [(integer) (boolean)]) .)))
                . (expression_statement (function_call_expression
                  function: (name) @maintenance
                  arguments: (arguments
                    . (argument (variable_name))
                    . (argument [(integer) (boolean)]) .)))
                .))
            . (expression_statement
                (_ [(variable_name) @included
                    (parenthesized_expression (variable_name) @included)])) @load) @chain
          (#eq? @exists "file_exists")
          (#match? @negated "^!\\s*file_exists\\s*\\(")
          (#eq? @write "file_put_contents")
          (#match? @load "(?i)^(include|require)(_once)?[ (]")
          (#eq? @checked @written)
          (#eq? @written @included)
          (#match? @maintenance "^(chmod|opcache_invalidate)$"))

        ; A decoded option assignment immediately preceding the matching write
        ; is also a restoration chain. Bind the source variable as well as the
        ; destination and exclude path reassignment or intervening statements.
        ((_ (if_statement
              condition: (parenthesized_expression
                (_ (function_call_expression
                  function: (name) @exists
                  arguments: (arguments . (argument (variable_name) @checked) .))) @negated)
              body: (compound_statement
                . (expression_statement (assignment_expression
                    left: (variable_name) @source
                    right: (function_call_expression
                      function: (name) @decompress
                      arguments: (arguments . (argument (function_call_expression
                        function: (name) @decode
                        arguments: (arguments . (argument (function_call_expression
                          function: (name) @option
                          arguments: (arguments . (argument (string)) .))) .))) .))))
                . (expression_statement (function_call_expression
                  function: (name) @write
                  arguments: (arguments
                    . (argument (variable_name) @written)
                    . (argument (variable_name) @data) .)))
                .))
            . (expression_statement
                (_ [(variable_name) @included
                    (parenthesized_expression (variable_name) @included)])) @load) @chain
          (#match? @exists "(?i)^file_exists$")
          (#match? @negated "(?i)^!\\s*file_exists\\s*\\(")
          (#match? @decompress "(?i)^(gzdecode|gzinflate|gzuncompress)$")
          (#match? @decode "(?i)^base64_decode$")
          (#match? @option "(?i)^get_option$")
          (#match? @write "(?i)^file_put_contents$")
          (#match? @load "(?i)^(include|require)(_once)?[ (]")
          (#eq? @checked @written)
          (#eq? @written @included)
          (#eq? @source @data)
          (#not-eq? @source @written))
