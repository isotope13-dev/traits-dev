defaults:
  platforms: [unix, windows]
  for: [php]
composite_rules:
  - id: php-shared-memory-file-recreation-inclusion
    desc: Shared-memory read with file restore and include
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/fs/write/file/full::php-missing-file-write
      - id: micro-behaviors/process/interpreter/eval/source::php-variable-file-load
    any:
      - id: micro-behaviors/mem/create/shared::shm-read
      - id: micro-behaviors/mem/create/shared::sysv-read-variable

