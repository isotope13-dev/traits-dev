defaults:
  platforms: [unix, windows]
  for: [shell]
  attack: T1059
traits:
  - id: shell-eval
    desc: Evaluates a shell command string
    crit: notable
    conf: 0.5
    if:
      type: symbol
      exact: eval
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: well-known/tool/development/gradle-wrapper/
