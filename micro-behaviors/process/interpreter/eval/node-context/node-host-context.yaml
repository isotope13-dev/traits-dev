defaults:
  for: [javascript]
  platforms: [unix, windows]
  crit: notable
  attack: T1059.007

traits:
  - id: js-call-with-node-host-context
    desc: Passes Node host objects to callable
    if:
      type: text
      regex: '\b[\w$]+\(\s*require,\s*process,\s*Buffer,\s*console,\s*__dirname,\s*__filename'
      exclude_comments: true
  - id: js-function-concatenated-body
    desc: Compiles concatenated variable function body
    if:
      type: text
      regex: 'new\s+Function\([^\n;]{1,200}\+\s*\([\w$]+\)\s*\+'
      exclude_comments: true

composite_rules:
  - id: js-generated-function-node-host-context
    desc: Compiles variable code beside invocation with Node host objects
    near_lines: 4
    all:
      - id: js-function-concatenated-body
      - id: js-call-with-node-host-context
