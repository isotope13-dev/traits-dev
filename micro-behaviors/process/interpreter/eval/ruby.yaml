defaults:
  platforms: [windows, unix]
  for: [ruby]
  attack: T1059
traits:
  - id: ruby-eval
    desc: Ruby dynamic code evaluation call
    crit: notable
    conf: 0.9
    downgrade:
      any:
        - id: well-known/lib/format/nokogiri::library-reference
        - id: well-known/lib/web/active-support::module
    if:
      type: symbol
      kind: call
      exact: eval
  - id: ruby-instance-eval
    desc: Ruby instance_eval call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: instance_eval
  - id: ruby-class-eval
    desc: Ruby class_eval call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: class_eval
  - id: ruby-module-eval
    desc: Ruby module_eval call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: module_eval
