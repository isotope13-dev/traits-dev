# Renaming the dynamic evaluator so calls to it no longer look like eval.
#
# A distinct technique from calling Invoke-Expression directly: the script first
# creates an alias for iex/Invoke-Expression under an unrelated name, then calls
# that name. A search for `iex`/`Invoke-Expression` call sites misses the
# execution entirely. Kept separate from eval/direct because the ML pipeline
# reads directory structure -- this is evaluator *concealment*, not a plain eval
# primitive.
defaults:
  platforms: [windows, unix]
  attack: T1027,T1059.001
  mbc: E1059

traits:
  # `New-Alias -Name pwn -Value iex` / `Set-Alias ... -Value Invoke-Expression`.
  # Legitimate scripts have no reason to give the evaluator a second name; the
  # alias exists to keep the eval step out of signatures and casual review.
  # Neutral capability on its own -- consuming composites add the fetch, loop,
  # or exfil that establishes intent.
  - id: iex-aliased-to-name
    desc: Aliases Invoke-Expression to another name
    crit: notable
    conf: 0.9
    for: [powershell, javascript, html, vbs, batch]
    if:
      type: text
      regex: '(?i)\b(New|Set)-Alias\b[^\r\n]{0,80}-Value\s+(iex|Invoke-Expression)\b'
