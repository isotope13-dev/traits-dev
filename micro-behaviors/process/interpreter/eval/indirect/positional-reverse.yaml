defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: positional-escaped-eval-reverse-stage
    desc: Positional prefix evaluates reversed shell code
    conf: 0.98
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @head) @cmd
          (#match? @head "^\\$\\{[@*]")
          (#match? @cmd "^[^\\n]{0,100}\"?\\$\\{[@*][,^~]{1,2}\\}\"?e\\\\val[ \\t]+\"\\$\\(")
          (#match? @cmd "^[^\\n]{0,200}r[\"']{0,3}e[\"']{0,3}v[ \\t]+<<<"))
