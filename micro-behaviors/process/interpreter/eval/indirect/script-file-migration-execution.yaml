defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: batch-call-script
    desc: Batch call to script file
    conf: 0.4
    for:
      - batch
    if:
      type: text
      regex: (?im)^\s*@?call\s+\"?[A-Za-z0-9_./\\%-]+\.(bat|cmd)\b
    not:
      - substr: 'build-gyp\\gyp.bat'
    unless:
      - type: basename
        regex: ^vcbuild\.bat$
