defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: dom-created-script-text-insertion
    desc: Inserts a created script with assigned source
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator
              name: (identifier) @created
              value: (call_expression
                function: (member_expression
                  object: (identifier) @document
                  property: (property_identifier) @create)
                arguments: (arguments . (string (string_fragment) @tag) .))))
          . (expression_statement
            (assignment_expression
              left: (member_expression
                object: (identifier) @assigned
                property: (property_identifier) @text)
              right: (_) @source))
          . (expression_statement (call_expression))*
          . (expression_statement
            (call_expression
              function: (member_expression
                object: (member_expression
                  object: (identifier) @insert_document
                  property: (property_identifier) @parent)
                property: (property_identifier) @append)
              arguments: (arguments . (identifier) @inserted .))))
        (#eq? @document "document")
        (#eq? @create "createElement")
        (#eq? @tag "script")
        (#eq? @text "textContent")
        (#eq? @insert_document "document")
        (#match? @parent "^(head|body|documentElement)$")
        (#eq? @append "appendChild")
        (#eq? @created @assigned)
        (#eq? @created @inserted))
