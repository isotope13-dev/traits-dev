defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-getattr-builtin-call
    desc: Invokes a builtin looked up via getattr
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'getattr\s*\(\s*(__builtins__|builtins)\s*,[^\)\n]{1,80}\)\s*\('
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
