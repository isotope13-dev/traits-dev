# `w["eval"]` / `window['eval']`: eval fetched by quoted property name, so
# the sink appears only as a string. Feeds carry such scripts in post markup
# or appended after the document, so xml is in scope.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, xml]

traits:
  - id: bracket-quoted-eval-lookup
    desc: Looks up eval by quoted property name
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '[\w$)\]]\[\s*["'']eval["'']\s*\]'
