# Native host APIs bridge into a JavaScript interpreter. Require the framework
# import and a parsed invocation; an evaluator method declaration, a quoted
# example, or an unrelated method with the same name does not suffice.
defaults:
  platforms: [macos, ios]
  for: [swift]
  crit: notable
  conf: 0.95

composite_rules:
  - id: swift-webkit-javascript-evaluation
    desc: WebKit import and JavaScript evaluation call
    all:
      - id: metadata/import/swift/webkit
      - id: metadata/lang/source/syntax/call/invocation::swift-evaluate-javascript-method-call

  - id: swift-javascriptcore-script-evaluation
    desc: JavaScriptCore import and script evaluation call
    all:
      - id: metadata/import/swift/javascriptcore
      - id: metadata/lang/source/syntax/call/invocation::swift-evaluate-script-method-call
