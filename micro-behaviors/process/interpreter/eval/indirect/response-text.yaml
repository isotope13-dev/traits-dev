# Co-occurrence is useful context, but proves neither data flow nor abuse.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: js-global-eval-near-response-text
    desc: Global evaluator near HTTP response-text read
    crit: notable
    conf: 0.93
    near_bytes: 8192
    all:
      - id: js-indirect-eval-window-named
      - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
