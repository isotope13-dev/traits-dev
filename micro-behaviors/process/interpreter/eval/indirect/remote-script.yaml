defaults:
  platforms: [linux, macos, windows, android]
  for: [javascript, typescript]

composite_rules:
  - id: js-fetch-and-evaluate-remote-script
    desc: JavaScript fetch, response read, and eval occur near one another
    crit: suspicious
    conf: 0.99
    scope: leaf
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-variable-argument
      - id: micro-behaviors/communications/http/request/resource::js-fetch-script-url-literal
      - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
    unless:
      - id: well-known/tool/development/vscode-extension/dbcode::extension-context
