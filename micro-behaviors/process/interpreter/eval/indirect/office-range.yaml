# Application.Run dispatches to a macro through a worksheet-range reference;
# it does not consume the range expression as source text.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
traits:
  - id: vba-run-sheet-range
    desc: VBA invokes Application.Run on a worksheet range
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)Application\.Run\s+Sheets?\([^)]{0,40}\)\.Range\('
