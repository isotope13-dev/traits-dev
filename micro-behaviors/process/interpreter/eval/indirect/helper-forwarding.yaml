defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: js-computed-helper-receives-eval
    desc: Computed helper receives eval and source
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (subscript_expression)
          arguments: (arguments (identifier) @evaluator (call_expression))) @forward
        (#eq? @evaluator "eval"))
