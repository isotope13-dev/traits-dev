# Parsed calls distinguish live callbacks from quoted regression inputs.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: js-promise-eval-callback
    desc: Passes eval as a promise callback
    attack: T1059.007
    if:
      type: symbol
      kind: call
      regex: '(^|\.)then$'
      arg:
        index: 0
        kind: identifier
        name: eval
