defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  size_max: 2097152
traits:
  # Call facts do not link computed property keys, factory aliases and the
  # immediately invoked return value. Keep those identities in the AST.
  - id: js-inline-transformed-factory-invocation
    desc: Invokes a computed factory on transformed source
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (_ (variable_declarator name: (identifier) @word
            value: (call_expression function: (identifier) @decoder
              arguments: (arguments (string) @key_material))))
          .
          (_ (variable_declarator name: (identifier) @key
            value: (call_expression function: (member_expression
              object: (identifier) @word_use property: (property_identifier) @prefix)
              arguments: (arguments (number) @start (number)))))
          .
          (_ (variable_declarator name: (identifier) @factory
            value: (subscript_expression object: (identifier) @decoder_property
              index: (identifier) @key_use)))
          .
          (expression_statement (call_expression
            function: (call_expression function: (identifier) @factory_call
              arguments: (arguments (string)
                (call_expression function: (identifier) @decoder_source
                  arguments: (arguments (string) @source)))) @evidence)))
          (#eq? @word @word_use) (#eq? @key @key_use)
          (#eq? @decoder @decoder_property) (#eq? @decoder @decoder_source)
          (#eq? @factory @factory_call)
          (#match? @prefix "^(substr|substring|slice)$")
          (#match? @start "^(0|0x0)$")
          (#match? @key_material "(?s)^.{16,}$")
          (#match? @source "(?s)^.{512,}$")
          (#set! cleave.ignore-comments "true"))
