# A named global eval call is an execution capability. Bracket notation alone
# does not establish concealment or an unwanted payload.
defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: js-global-eval-hex-escaped-key
    desc: Calls hex-escaped window eval
    crit: suspicious
    conf: 0.94
    attack: T1027.002,T1059.007
    if:
      type: text
      regex: '(window|self)\[\s*["'']\\x65\\x76\\x61\\x6c["'']\]\s*\('
    unless:
    - id: metadata/file/format/source-map::sourcemap
    - id: metadata/package/testing/
    - id: "metadata/file/naming::test-directory-component"
  - id: js-indirect-eval-window-named
    desc: Global-object eval or Function bracket lookup
    crit: notable
    conf: 0.85
    attack: "T1059.007"
    if:
      type: text
      # Require a complete global-object token: `_global['eval']` is a
      # Chromium Trusted Types adapter, not a window/global indirect-eval call.
      # The adapter's trustedScriptFromString argument is also an explicit
      # non-obfuscating execution path.
      regex: '\b(window|self|global)\[\s*["''](eval|Function)["'']\]\s*\('
    unless:
    # A `.js.map` is a description of code, not code: its `sourcesContent`
    # embeds the original text as JSON strings. Whatever it quotes is already
    # analyzed in the bundle the map describes, so a finding here is either a
    # duplicate of that one or text that never executes. Tabby ships
    # dist/bundle.js.map.
    - id: metadata/file/format/source-map::sourcemap
    - id: well-known/app/system/ilebora/
    - id: well-known/lib/platform/wine::wine-source-tree
    - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
    # Linter test corpora (biome noGlobalEval) ship window["eval"](...) fixtures
    # under tests/specs and .snap snapshots — not real indirect-eval obfuscation.
    # One directory reference for the shared "test fixture" semantic rather than
    # a leaf per fixture shape; it also counts as one against the suppression
    # budget, which the two leaves plus the sourcemap entry had pushed over.
    - id: metadata/package/testing/
    # The bracket form is also how two ordinary libraries reach indirect eval
    # without hiding a call target; see the exception composite below.
    - id: micro-behaviors/process/interpreter/eval/indirect::global-eval-bracket-idiom
    - id: "metadata/file/naming::test-directory-component"

composite_rules:
  - id: global-eval-bracket-idiom
    desc: Benign indirect-eval idiom
    crit: exception
    conf: 0.9
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::eval-parenthesized-expression
      - id: micro-behaviors/process/interpreter/eval/indirect::global-eval-of-trusted-script
