defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: shell-eval-case-swapped-source
    desc: Eval receives case-swapped program text
    conf: 0.99
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @evaluate
          argument: (string (command_substitution
            (variable_assignment name: (variable_name) @stage value: (_) @program)
            (command name: (command_name) @print
              argument: (string (expansion (variable_name) @use)) @flipped))))
         (#match? @evaluate "^e[\"']*v[\"']*a[\"']*l$")
         (#match? @print "^[\"']*p[\"']*r[\"']*i[\"']*n[\"']*t[\"']*f[\"']*$")
         (#eq? @stage @use)
         (#match? @flipped "^\"\\$\\{[A-Za-z_][A-Za-z0-9_]*~~\\}\"$"))
