defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  size_max: 2097152
traits:
  # The anonymous body is absent from current source flow. Bind the factory,
  # decoded inputs, compiled return value and invocation in its source tree.
  # No literal name, cipher key, version marker or decoded payload is needed.
  - id: js-permutation-code-factory-chain
    desc: Invokes nested permutation-built code factories
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (parenthesized_expression (function_expression
            "function" @evidence
            body: (statement_block
              (_ (variable_declarator name: (identifier) @final_params
                value: (string) @final_params_text))
              .
              (function_declaration name: (identifier) @transform_definition)
              .
              [(variable_declaration) (lexical_declaration)]
              .
              (_ (variable_declarator name: (identifier) @decoder_blob
                value: (string)))
              .
              (_ (variable_declarator name: (identifier) @factory
                value: (subscript_expression object: (identifier) @transform
                  index: (identifier)) @evidence))
              .
              (_ (variable_declarator name: (identifier) @decoder_params
                value: (string) @decoder_params_text))
              .
              (_ (variable_declarator name: (identifier) @factory_alias
                value: (identifier) @factory_reference))
              .
              (_ (variable_declarator name: (identifier) @decoder
                value: (call_expression function: (identifier) @factory_call
                  arguments: (arguments (identifier) @params_one
                    (call_expression function: (identifier) @transform_one
                      arguments: (arguments (identifier) @blob_reference))))))
              .
              (_ (variable_declarator name: (identifier) @program
                value: (call_expression function: (identifier) @decoder_call
                  arguments: (arguments (call_expression
                    function: (identifier) @transform_two
                    arguments: (arguments (string) @program_blob))))))
              .
              (_ (variable_declarator name: (identifier) @stage
                value: (call_expression function: (identifier) @final_factory
                  arguments: (arguments (identifier) @params_two
                    (identifier) @program_reference))))
              .
              (expression_statement (call_expression
                function: (identifier) @stage_call))))))
          (#eq? @transform_definition @transform)
          (#eq? @transform @transform_one)
          (#eq? @transform @transform_two)
          (#eq? @factory @factory_reference)
          (#eq? @factory @factory_call)
          (#eq? @factory_alias @final_factory)
          (#eq? @decoder @decoder_call)
          (#eq? @decoder_blob @blob_reference)
          (#eq? @decoder_params @params_one)
          (#eq? @final_params @params_two)
          (#eq? @program @program_reference)
          (#eq? @stage @stage_call)
          (#match? @final_params_text "^['\"]{2}$")
          (#match? @decoder_params_text "^['\"]{2}$")
          (#match? @program_blob "(?s)^.{2048,}$")
          (#set! cleave.ignore-comments "true"))
