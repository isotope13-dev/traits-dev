defaults:
  platforms: [unix, windows]
  for: [python]
traits:
- id: notebook-js-result-readback
  desc: Reads notebook JavaScript result
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\boutput\.eval_js\s{0,4}\('

composite_rules:
- id: notebook-remote-js-result-roundtrip
  desc: Notebook remote JavaScript and result readback
  crit: notable
  conf: 0.95
  all:
    - id: micro-behaviors/process/interpreter/eval/indirect::notebook-js-result-readback
  any:
    - id: micro-behaviors/os/module/require::python-remote-es-module-import
    - id: micro-behaviors/os/sysinfo/hardware::fingerprintjs-load-call
