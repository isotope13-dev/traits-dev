defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-getattr-evaluator-call
    desc: Invokes eval or exec through getattr
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((call
          function: (call
            function: (identifier) @lookup
            arguments: (argument_list . (identifier) @builtins . (string) @evaluator))
          arguments: (argument_list)) @invoke
          (#eq? @lookup "getattr")
          (#match? @builtins "^(__builtins__|builtins)$")
          (#match? @evaluator "^[\"'](exec|eval)[\"']$"))
