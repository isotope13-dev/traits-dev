defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: wasm-reference-catch
    desc: WASM reference near Promise catch
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(WebAssembly|\.wasm)[^\n]{0,160}\.catch\s*\('
  - id: empty-wasm-promise-catch
    desc: Empty catch near WebAssembly reference
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(WebAssembly|\.wasm)[^\n]{0,160}\.catch\(\s*\(\)\s*=>\s*\{\s*\}\s*\)'

composite_rules:
  - id: go-wasm-host-silent-failure-context
    desc: Go WASM host with long asset name and empty catch
    crit: suspicious
    conf: 0.95
    all:
      - id: go-wasm-runtime
      - id: webassembly-instantiate
      - id: wasm-reference-catch
      - id: empty-wasm-promise-catch
    any:
      - id: micro-behaviors/fs/path/basename::long-lowercase-wasm-filename
      - id: micro-behaviors/os/module/load::long-lowercase-sidecar-require
    unless:
      - id: metadata/package/testing/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/tool/detection/llm-scanner/
      - id: "metadata/file/naming::test-directory-component"
