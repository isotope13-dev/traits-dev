# Operator tasking message names for executing WebAssembly modules inside an
# agent (for example ExecWasmExtensionReq, RegisterWasmExtension). The names
# evidence a remote module-execution interface; they do not prove a module was
# received or run, and a host application embedding a WASM runtime for its own
# plugins keeps only the runtime finding.
defaults:
  platforms: [windows, linux, macos]
  for: [binaries, go]
  crit: notable
  conf: 0.8
traits:
  - id: wasm-exec-extension-tasking-names
    desc: WASM module-execution tasking message names
    if:
      type: text
      regex: '\bExec(ute)?WasmExtension(Req|Request|Cmd|Task|Command)?s?\b'
  - id: wasm-manage-extension-tasking-names
    desc: WASM extension registration tasking names
    if:
      type: text
      regex: '\b(Register|Deregister|List|Call)WasmExtension(Req|Request|Cmd)?s?\b'
composite_rules:
  - id: wasm-extension-tasking-message-names
    desc: WASM extension tasking message names
    any:
      - id: wasm-exec-extension-tasking-names
      - id: wasm-manage-extension-tasking-names
