defaults:
  platforms:
  - windows
  - unix
  for:
  - wasm
  crit: component
  conf: 0.9
traits:
- id: go-wasm-syscall-js-bridge
  desc: Go WASM with JS host bridge
  crit: notable
  if:
    type: import
    regex: ^syscall/js\.
- id: go-wasm-host-value-call
  crit: notable
  desc: WASM calls a JS host function
  if:
    type: import
    exact: syscall/js.valueCall
- id: go-wasm-host-value-new
  crit: notable
  desc: WASM builds a JS host object
  if:
    type: import
    exact: syscall/js.valueNew
composite_rules:
- id: go-wasm-js-host-interop
  desc: Go WASM payload drives the JavaScript host
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/process/interpreter/wasm::go-wasm-syscall-js-bridge
  any:
  - id: micro-behaviors/process/interpreter/wasm::go-wasm-host-value-call
  - id: micro-behaviors/process/interpreter/wasm::go-wasm-host-value-new
