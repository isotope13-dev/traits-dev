defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.98

traits:
  - id: base64-magic-regexp-extraction
    desc: Extracts base64 WASM magic using a regexp
    if:
      type: text
      regex: '\.match\(/[^\r\n]{1,70}AGFzbQE'

  - id: instantiate-with-empty-imports
    desc: Instantiates WASM with an empty imports object
    if:
      type: text
      regex: 'WebAssembly\.instantiate\([^,\r\n]{1,50},\s*\{\s*\}\s*\)'

  - id: decode-regexp-capture-base64
    desc: Base64-decodes a regexp capture using Buffer
    if:
      type: text
      regex: 'Buffer\.from\([\w$]+\[1\],\s*["'']base64["'']\)'

composite_rules:
  - id: node-text-wasm-extractor
    desc: Text extraction with importless WASM execution
    all:
      - id: base64-magic-regexp-extraction
      - id: instantiate-with-empty-imports
      - id: decode-regexp-capture-base64
      - id: micro-behaviors/fs/read/file/full::readfilesync-call
