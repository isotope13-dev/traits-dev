# WebAssembly execution from a JavaScript/Node host.
#
# Neutral capability mechanics: instantiating a WASM module, driving the
# Go/TinyGo `wasm_exec.js` host runtime, and hoisting Node builtins onto
# globalThis so the guest module can reach them. These are legitimate in
# WASM-backed tooling (tree-sitter, sql.js, esbuild-wasm); intent is inferred
# by composites that pair them with concealment (random payload names, silent
# error suppression) in objectives/.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85
traits:
  - id: webassembly-host-global-alias
    desc: Assigns the WebAssembly host global
    conf: 0.88
    if:
      type: text
      regex: ',\s*WebAssembly|=\s*WebAssembly\b'
  - id: webassembly-instantiate
    desc: Instantiates a WebAssembly module
    # WebAssembly.instantiate / instantiateStreaming / compile run a WASM
    # module — a real code-execution sink for a portable bytecode payload.
    for: [javascript, typescript, html]
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '\bWebAssembly\.(instantiate|instantiateStreaming|compile|compileStreaming)\s*\('
  - id: webassembly-module-instance-check
    desc: Constructs WebAssembly Module or Instance
    platforms: [windows, unix, android]
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\bnew\s+WebAssembly\.(Module|Instance)\s*\('
    unless:
      # Type declarations only quote the call in a doc comment.
      - id: metadata/lang/scripted::dts-declaration-file

  - id: unchecked-entry-pointer-write
    desc: write64 call uses entry-related address
    platforms: [windows, unix, android]
    for: [javascript, typescript, html]
    crit: suspicious
    conf: 0.99
    if:
      type: text
      # Require an actual write64 call with the address expression as its
      # first argument. A nearby helper name or parameter is not evidence that
      # the helper writes to that address (for example, a typed-array view may
      # ignore the supplied address and update a fixed local slot).
      regex: '(?i)\bwrite64\s*\(\s*.{0,40}\b(unchecked|entry)(Address|Pointer)?\b'

  - id: wasm-entry-pointer-helper-write
    desc: Memory write near unchecked or entry marker
    platforms: [windows, unix, android]
    for: [javascript, typescript, html]
    crit: suspicious
    conf: 0.96
    if:
      type: text
      # Match the helper and marker as complete identifiers. Prefix matches
      # such as `writeMemoryWiki...SourceEntry` are ordinary application API
      # names and do not describe an entry-pointer write. `writeMemory` is not
      # included here — it collides with benign persistence helpers that mention
      # an `entry` argument near a write call.
      regex: '(?i)\b(writePointer|writePtr)\b.{0,120}\b(unchecked|entry)\b'
    unless:
      - id: micro-behaviors/ui/graphics/draw::webgpu-api-source-context
  - id: go-wasm-runtime
    desc: Go/TinyGo wasm_exec host runtime object
    conf: 0.9
    # `new Go()` (optionally `new globalThis.Go()`) constructs the runtime
    # bridge the Go/TinyGo `wasm_exec.js` shim defines to host a Go-compiled
    # WASM module. Distinctive of running a Go WASM payload from JS.
    if:
      type: text
      regex: '\bnew\s+(globalThis\.)?Go\s*\(\s*\)'
  - id: go-wasm-getgroups-enosys
    desc: Go wasm_exec getgroups stub
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: "getgroups() { throw enosys(); }"
  - id: go-wasm-umask-enosys
    desc: Go wasm_exec umask stub
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: "umask() { throw enosys(); }"
  - id: go-wasm-run-instance
    desc: Runs an instantiated Go WASM instance
    crit: notable
    conf: 0.9
    # `go.run(instance)` starts the Go scheduler on the instantiated module.
    if:
      type: text
      regex: '\bgo\.run\s*\('
  - id: wasm-bytes-from-file
    desc: Instantiates WASM from a disk file
    crit: notable
    conf: 0.85
    # readFileSync feeding WebAssembly.instantiate — the WASM payload is read
    # from a sibling file rather than fetched, the npm/extension shape.
    if:
      type: text
      regex: 'WebAssembly\.(instantiate|compile)[A-Za-z]*\s*\(\s*[A-Za-z_$.]*readFileSync'
  # A WebAssembly module written inline as a JavaScript byte array: the
  # decimal magic header 0,97,115,109 ("\0asm") inside a Uint8Array literal.
  # Feature-detection probes (wasm-feature-detect), OCR/codec workers
  # (tesseract.js) and polyfills ship tiny modules this way. Intent comes
  # from what the module carries -- see
  # objectives/execution/exploit/shellcode::inline-wasm-bin-shellcode.
  - id: inline-wasm-module-byte-array
    desc: Uint8Array literal holds a Wasm header
    for: [javascript, typescript, html]
    conf: 0.94
    if:
      type: text
      substr: 'Uint8Array([0,97,115,109,'
  - id: inline-wasm-hex-header
    desc: Byte list holds a hex Wasm header
    for: [javascript, typescript, html]
    conf: 0.94
    if:
      type: text
      regex: '0x00,\s*0x61,\s*0x73,\s*0x6[dD]'
  - id: call-bind-wasm-export
    desc: Binds call to a Wasm export
    for: [javascript, typescript, html]
    conf: 0.93
    if:
      type: text
      regex: 'Function\.prototype\.call\.bind\s*\(\s*\w{1,24}\.exports\.'

composite_rules:
  - id: go-wasm-exec-shim
    desc: Go wasm_exec syscall shim
    crit: baseline
    conf: 0.92
    all:
      - id: go-wasm-getgroups-enosys
      - id: go-wasm-umask-enosys
  - id: go-wasm-host-execution
    desc: Runs a Go-compiled WASM module from a JS host
    crit: notable
    conf: 0.9
    all:
      - id: go-wasm-runtime
      - id: webassembly-instantiate
    any:
      - id: go-wasm-run-instance
      - id: wasm-bytes-from-file
      - id: micro-behaviors/data/property/assign::globalthis-host-property-assignment
