# TVBox's spider field declares a remotely loaded Android crawler archive.
# This says what the configuration requests, not that the URL was fetched.
defaults:
  crit: notable
  conf: 0.95
  platforms: [android]
traits:
  - id: configured-remote-spider-archive
    desc: Config declares remote Android spider archive
    for: [json]
    if:
      type: value
      path: spider
      regex: '^https?://'

  - id: encoded-remote-spider-archive-config
    desc: Base64 config declares remote spider archive
    for: [jpeg, png, gif, bmp, webp, data, text, json]
    if:
      type: encoded
      encoding: base64
      regex: '"spider"\s*:\s*"https?://'
