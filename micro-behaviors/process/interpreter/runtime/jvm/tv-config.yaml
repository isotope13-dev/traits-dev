# TVBox's spider field declares a remotely loaded Android crawler archive.
# This says what the configuration requests, not that the URL was fetched.
traits:
  - id: configured-remote-spider-archive
    desc: Config declares remote Android spider archive
    crit: notable
    conf: 0.95
    platforms: [android]
    for: [json]
    if:
      type: value
      path: spider
      regex: '^https?://'
