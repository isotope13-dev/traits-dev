defaults:
  platforms: [windows, unix]
  for: [java, class, java_class, jar]
  crit: notable
  conf: 0.9

traits:
  - id: java-jshell-eval-source
    desc: Java JShell evaluates supplied source text
    crit: notable
    conf: 0.94
    for: [jsp, java, html, javascript, python]
    if:
      type: text
      regex: '(?s)JShell\s*\.\s*builder\s*\(\s*\)[\s\S]{0,160}\.\s*eval\s*\('
  - id: java-annotation-processor-api
    desc: Java annotation processor API reference
    crit: notable
    conf: 0.97
    for: [class]
    if:
      type: import
      exact: javax/annotation/processing/AbstractProcessor

  - id: java-scriptengine-api
    desc: Java ScriptEngine API reference
    for: [java, class, java_class]
    if:
      type: text
      substr: javax/script/ScriptEngine

  - id: java-scriptengine-eval-api
    desc: Java ScriptEngine eval reference
    for: [java, class, java_class, jsp]
    if:
      type: text
      substr: ScriptEngine.eval

  - id: java-scriptengine-eval-descriptor
    desc: Java ScriptEngine eval descriptor
    for: [java, class, java_class]
    if:
      type: text
      substr: 'eval:(Ljava/'

  - id: java-scriptengine-getenginebyname
    desc: Java ScriptEngineManager lookup
    for: [java, class, java_class, jsp]
    if:
      type: text
      substr: getEngineByName

  # JSP command shells evaluate request input through a looked-up script
  # engine (usually Nashorn) instead of calling Runtime.exec directly, so the
  # process sink only appears inside a decoded string. These source-form atoms
  # cover the dotted imports and call chains that the slash-form bytecode
  # atoms above cannot see on a server page.
  - id: java-scriptengine-manager-new
    desc: Instantiates the Java ScriptEngineManager
    crit: notable
    conf: 0.93
    for: [jsp, java, html, javascript, python, vbs]
    if:
      type: text
      regex: 'new\s+ScriptEngineManager\s*\('

  - id: java-scriptengine-lookup-eval
    desc: Evaluates code through a looked-up script engine
    crit: notable
    conf: 0.92
    for: [jsp, java, html, javascript, python, vbs]
    if:
      type: text
      regex: 'getEngineByName\s*\(.{0,80}\)\s*\.eval\s*\('

  - id: java-scriptengine-manager-call
    desc: Calls the Java ScriptEngineManager constructor
    crit: notable
    for: [java, class, java_class]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ScriptEngineManager$'

  - id: java-scriptengine-eval-call
    desc: Calls Java ScriptEngine.eval
    crit: notable
    for: [java, class, java_class]
    if:
      type: symbol
      kind: call
      regex: '\.eval$'

  - id: java-scriptengine-eval-source
    desc: ScriptEngine evaluates a source variable
    conf: 0.95
    for: [java, kotlin]
    if:
      type: text
      # Require the *Source identifier to be the eval argument (or first of
      # several). `eval(scriptSource.getScriptAsString())` is framework
      # ScriptSource plumbing, not evaluating a source-named payload var.
      regex: '(?is)\bScriptEngine\b.{0,160}\beval\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*[Ss]ource\s*[,)]'

  - id: java-scriptengine-eval-module
    desc: ScriptEngine evaluates a module variable
    conf: 0.95
    for: [java, kotlin]
    if:
      type: text
      regex: '(?is)\bScriptEngine\b.{0,160}\beval\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*[Mm]odule\s*[,)]'

  - id: java-scriptengine-eval-code
    desc: ScriptEngine evaluates a code variable
    conf: 0.95
    for: [java, kotlin]
    if:
      type: text
      regex: '(?is)\bScriptEngine\b.{0,160}\beval\s*\(\s*[A-Za-z_$][A-Za-z0-9_$]*[Cc]ode\s*[,)]'

  - id: java-compiler-task-source
    desc: Java compiler task source reference
    crit: notable
    conf: 0.9
    for: [java]
    if:
      type: text
      substr: JavaCompiler.CompilationTask

  - id: java-toolprovider-system-compiler
    desc: Java ToolProvider system compiler call
    crit: notable
    conf: 0.94
    for: [java]
    if:
      type: symbol
      kind: call
      exact: getSystemJavaCompiler

  - id: java-toolprovider-system-compiler-bytecode
    desc: Java bytecode system compiler reference
    crit: notable
    conf: 0.94
    for: [class, java_class]
    if:
      type: hex
      pattern: 67 65 74 53 79 73 74 65 6D 4A 61 76 61 43 6F 6D 70 69 6C 65 72

  - id: java-urlclassloader-api
    desc: Java URLClassLoader API reference
    crit: notable
    conf: 0.9
    for: [java]
    if:
      type: symbol
      substr: URLClassLoader

  - id: java-custom-classloader-load
    desc: Java custom ClassLoader load method
    crit: notable
    conf: 0.9
    for: [java]
    if:
      type: text
      regex: 'new ClassLoader[\s\S]{0,320}loadClass'

composite_rules:
  - id: java-scriptengine-eval-variable
    desc: JVM evaluates a script module or source variable
    conf: 0.95
    for: [java, kotlin]
    any:
      - id: java-scriptengine-eval-source
      - id: java-scriptengine-eval-module
      - id: java-scriptengine-eval-code
