# Neutral JVM runtime access from Clojure. Runtime/getRuntime does not imply
# command execution: libraries use it for shutdown hooks and other lifecycle
# operations, while execution-specific composites require a real launch API.
defaults:
  platforms: [unix, windows]
  for: [clojure]
  crit: component
  conf: 0.86

traits:
  - id: clojure-jvm-runtime-accessor
    desc: Accesses the JVM Runtime object
    if:
      type: symbol
      kind: call
      regex: '^(java\.lang\.)?Runtime/getRuntime$'
