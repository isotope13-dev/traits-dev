defaults:
  for: [html]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
- id: applet-local-file-codebase
  desc: Java applet declares a local-file codebase
  if:
    type: text
    regex: '(?i)<applet[^>]{0,80}\bcodebase=["'']file://'
    exclude_html_comments: true
- id: applet-media-skin-archive
  desc: Java applet archive names a WMZ skin
  if:
    type: text
    regex: '(?i)<applet[^>]{0,100}\barchive=["''][^"'']{1,120}\.wmz'
    exclude_html_comments: true
