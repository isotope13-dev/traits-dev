defaults:
  platforms: [unix, windows]
  for: [jsp, java]
traits:
  - id: java-classloader
    desc: Java source ClassLoader reference
    crit: notable
    if:
      type: text
      substr: ClassLoader
    unless:
      - type: basename
        regex: \.sig$

  - id: java-custom-classloader-bytecode-definition
    desc: Custom ClassLoader defines bytecode from bytes
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'extends\s+\w*ClassLoader[\s\S]{0,400}byte\s*\[\]\s+\w+\s*\)[\s\S]{0,200}defineClass\s*\('

composite_rules:
  - id: java-class-loading-construction-references
    desc: Java class-loading and construction references
    crit: notable
    conf: 0.85
    for: [jsp, java, class, java_class]
    needs: 2
    any:
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-class-forname-source
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-classloader
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-defineclass-name-constant
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-loadclass
      - id: metadata/lang/source/naming/function/runtime::java-newinstance-text
