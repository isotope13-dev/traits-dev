defaults:
  platforms: [unix, windows]
  for: [jsp, java]
traits:
  - id: java-classloader
    desc: Java source ClassLoader reference
    crit: notable
    if:
      type: text
      substr: ClassLoader
    unless:
      - type: basename
        regex: \.sig$

composite_rules:
  - id: java-class-loading-construction-references
    desc: Java class-loading and construction references
    crit: notable
    conf: 0.85
    for: [jsp, java, class, java_class]
    needs: 2
    any:
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-class-forname-source
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-classloader
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-defineclass-name-constant
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-loadclass
      - id: micro-behaviors/metaprogramming/reflection::java-newinstance
    unless:
      - id: metadata/package/testing/presence/platform_suites::java-test-directory
      - id: metadata/package/testing/presence/platform_suites::java-generic-test-directory
      - id: metadata/package/testing/presence/platform_suites::java-test-filename

