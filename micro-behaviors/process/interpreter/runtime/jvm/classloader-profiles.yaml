defaults:
  platforms: [unix, windows]
  for: [java, class, java_class, jar, zip]
composite_rules:
  - id: context-classloader-handoff
    desc: Thread classloader and reflection references
    crit: notable
    conf: 0.92
    for: [class]
    all:
      - id: micro-behaviors/process/thread/lifecycle::java-current-thread-reference
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-context-classloader-setter
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-urlclassloader-bytecode
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::java-getdeclaredconstructor
      - id: micro-behaviors/metaprogramming/reflection/invoke::java-method-invoke-bytecode
    any:
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-defineclass-name-constant
      - id: micro-behaviors/data/embedded/payload/resource::java-getresourceasstream
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-class-forname-bytecode
  - id: system-classloader-bytearray-streams
    desc: System ClassLoader and byte-array stream refs
    crit: notable
    conf: 0.96
    for: [class, java_class]
    all:
      - id: micro-behaviors/process/interpreter/runtime/jvm::classloader-definition-resource-references
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-get-system-classloader
      - id: micro-behaviors/data/buffer/transfer::bytearrayinputstream-ref

  - id: java-defineclass-any
    desc: Java source or bytecode defineClass references
    crit: notable
    conf: 0.9
    for: [jsp, java, class, java_class]
    any:
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-defineclass-name-constant
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-defineclass-source
      - id: micro-behaviors/metaprogramming/reflection/resolve::java-reflective-defineclass-source
      - id: micro-behaviors/data/embedded/classfile::runtime-define-class
