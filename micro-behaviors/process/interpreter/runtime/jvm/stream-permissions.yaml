defaults:
  for: [class]
  platforms: [unix, windows]
  crit: notable
  conf: 0.96

composite_rules:
  - id: jvm-stream-classloader-unrestricted-permissions
    desc: JVM stream loader references AllPermission
    all:
      - id: metadata/import/jvm::jvm-classloader-class-reference
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-defineclass-name-constant
      - id: metadata/import/jvm::socket-input-stream-reference
      - id: micro-behaviors/data/buffer/transfer::jvm-data-input-readfully
      - id: metadata/import/jvm::jvm-allpermission-constructor-reference
