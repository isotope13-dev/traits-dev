# CFML Java interop creates arbitrary classes; it does not establish a process launch.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.85
traits:
  - id: cfml-java-createobject
    desc: CFML calls CreateObject for Java
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: createobject
      arg:
        index: 0
        from:
          whole_value: '(?i)^java$'
  - id: cfml-service-factory-createobject
    desc: CFML calls CreateObject for ServiceFactory
    if:
      type: symbol
      kind: call
      exact: createobject
      args:
        - index: 0
          from:
            whole_value: '(?i)^java$'
        - index: 1
          from:
            whole_value: '(?i)^coldfusion\.server\.ServiceFactory$'
