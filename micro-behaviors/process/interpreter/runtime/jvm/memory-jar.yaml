composite_rules:
- platforms:
  - unix
  - windows
  for:
  - class
  - java_class
  id: in-memory-jar-entry-classload
  desc: JVM memory JAR iteration accompanies class loading
  crit: notable
  conf: 0.93
  unless:
  - id: well-known/lib/runtime/scripted/jruby::package-path
  - id: well-known/lib/runtime/scripted/jruby::module-marker
  - id: well-known/lib/runtime/scripted/jruby::jruby-home-path
  - id: well-known/lib/runtime/managed/openjdk::source-archive-path
  - id: well-known/lib/web/server/spring-boot::executable-jar
  - id: metadata/build/bundler/vscode::vscode-language-server-library
  all:
  - type: trait
    id: micro-behaviors/data/archive/library::jarinputstream-ref
  - type: trait
    id: micro-behaviors/data/archive/library::jarinputstream-entry-iteration
  - type: trait
    id: micro-behaviors/data/buffer/transfer::bytearrayinputstream-ref
  - type: trait
    id: micro-behaviors/data/buffer/transfer::bytearrayoutputstream-ref
  - type: trait
    id: micro-behaviors/process/interpreter/runtime/jvm::java-loadclass
  any:
  - type: trait
    id: micro-behaviors/metaprogramming/reflection::java-constructor-newinstance-bytecode
