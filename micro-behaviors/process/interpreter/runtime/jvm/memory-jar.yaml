defaults:
  platforms: [unix, windows]

composite_rules:
  - id: in-memory-jar-entry-classload-archive
    desc: JVM archive has JAR iteration and class-loading references
    crit: notable
    conf: 0.93
    for: [jar, zip, class, java_class]
    scope: archive
    all:
      - id: micro-behaviors/data/archive/library::jarinputstream-ref
      - id: micro-behaviors/data/archive/library::jarinputstream-entry-iteration
      - id: micro-behaviors/data/buffer/transfer::bytearrayinputstream-ref
      - id: micro-behaviors/data/buffer/transfer::bytearrayoutputstream-ref
      - id: metadata/import/jvm::jvm-classloader-class-reference
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-defineclass-name-constant
    any:
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::java-constructor-newinstance-bytecode
      - id: micro-behaviors/metaprogramming/reflection/invoke::java-method-invoke-bytecode
  - id: in-memory-jar-entry-classload
    for: [class, java_class]
    desc: JVM memory JAR iteration accompanies class loading
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/data/archive/library::jarinputstream-ref
      - id: micro-behaviors/data/archive/library::jarinputstream-entry-iteration
      - id: micro-behaviors/data/buffer/transfer::bytearrayinputstream-ref
      - id: micro-behaviors/data/buffer/transfer::bytearrayoutputstream-ref
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-loadclass
    any:
      - id: micro-behaviors/metaprogramming/reflection/inspect/member::java-constructor-newinstance-bytecode
      - id: micro-behaviors/metaprogramming/reflection/invoke::java-method-invoke-bytecode
