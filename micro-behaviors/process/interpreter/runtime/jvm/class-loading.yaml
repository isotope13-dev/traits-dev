defaults:
  platforms: [unix, windows]
  for: [java, class, java_class, jar, zip]

traits:
  - id: java-urlclassloader-bytecode
    desc: JVM URLClassLoader class reference
    crit: notable
    conf: 0.94
    for: [class, java_class]
    if:
      type: value
      path: class.class_refs[*]
      exact: java/net/URLClassLoader

  - id: java-context-classloader-setter
    desc: Java context ClassLoader setter
    crit: notable
    conf: 0.92
    for: [java, class, java_class]
    if:
      type: text
      substr: setContextClassLoader

  - id: java-loadclass
    desc: Java loadClass reference
    crit: notable
    for: [java, class, java_class]
    if:
      type: value
      path: class.strings[*]
      exact: loadClass

  - id: java-get-system-classloader
    desc: JVM getSystemClassLoader method-name reference
    crit: notable
    conf: 0.9
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      exact: getSystemClassLoader

composite_rules:
  - id: java-urlclassloader-reference
    desc: JVM URLClassLoader reference in source or bytecode
    crit: notable
    conf: 0.94
    any:
      - id: java-urlclassloader-api
      - id: java-urlclassloader-bytecode

  - id: java-urlclassloader-reflective-invoke
    desc: JVM class loading with reflective invocation
    crit: notable
    conf: 0.92
    for: [java, class, java_class]
    all:
      - id: java-urlclassloader-reference
      - id: micro-behaviors/metaprogramming/reflection::java-method-invoke-any
