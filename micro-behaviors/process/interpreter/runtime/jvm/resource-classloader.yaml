# Class-definition and resource references, preserving the original scope and exclusions.
# This observes loader facilities, not source-code manipulation or a linked payload.
defaults:
  platforms: [unix, windows]
  for: [class, java_class]
composite_rules:
  - id: classloader-definition-resource-references
    desc: ClassLoader definition and resource-stream references
    crit: notable
    conf: 0.93
    all:
      - id: metadata/import/jvm::jvm-classloader-class-reference
      - id: micro-behaviors/process/interpreter/runtime/jvm::java-defineclass-name-constant
      - id: micro-behaviors/data/embedded/payload/resource::java-getresourceasstream
