# Unicode-decoded class definition syntax; no embedded class bytes required.
defaults:
  platforms: [windows, unix]
  for: [python, java, class]

traits:
  - id: unicode-escaped-define-class
    desc: Decoded Unicode-escape layer invokes defineClass
    crit: notable
    conf: 0.97
    for: [jsp, java]
    if:
      type: encoded
      encoding: unicode-escape
      regex: '\bdefineClass\s*\('
