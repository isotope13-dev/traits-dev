defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: gentee-runtime-init
    desc: Gentee runtime init API
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: gentee_init
  - id: gentee-runtime-deinit
    desc: Gentee runtime deinit API
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: gentee_deinit
  - id: gentee-runtime-load
    desc: Gentee runtime load API
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: gentee_load
  - id: gentee-runtime-set
    desc: Gentee runtime set API
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: gentee_set
  - id: gentee-runtime-call
    desc: Gentee runtime call API
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: gentee_call
composite_rules:
  - id: gentee-runtime-api-cluster
    desc: Gentee runtime API symbol cluster
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/interpreter/runtime/dynamic::gentee-runtime-init
      - id: micro-behaviors/process/interpreter/runtime/dynamic::gentee-runtime-deinit
      - id: micro-behaviors/process/interpreter/runtime/dynamic::gentee-runtime-load
      - id: micro-behaviors/process/interpreter/runtime/dynamic::gentee-runtime-set
      - id: micro-behaviors/process/interpreter/runtime/dynamic::gentee-runtime-call
