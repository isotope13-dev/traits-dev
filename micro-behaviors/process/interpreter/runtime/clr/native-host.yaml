composite_rules:
- id: pe-clr-hosting-api-profile
  desc: PE references CLR hosting and shutdown APIs
  platforms:
  - windows
  for:
  - pe
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/dylib/library/family::mscoree-dll-name
  - id: micro-behaviors/process/exit/terminate::corexitprocess-string
  - id: micro-behaviors/process/interpreter/runtime/clr::clr-native-hosting-apis
  any:
  - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
  - id: metadata/binary/layout/checksum::cert-table-present
  unless:
  - id: well-known/tool/reverse-engineering/cff-explorer/
  - id: well-known/game/steam/
  - id: well-known/app/utility/siw::siw-family-identity
  - id: well-known/dual-use/remote-admin/
  - id: well-known/tool/development/editor/jetbrains::signed-jetbrains-native-launcher
  downgrade:
    any:
    - id: metadata/signed/leaf::bitdefender-srl
    - id: metadata/signed/unknown::bitdefender-srl
    - id: well-known/game/mod/
    - id: metadata/binary/vendor/
