defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  # _AppDomain's IID supplies the interface identity; the code copies a byte
  # buffer into an accessed SAFEARRAY, unaccesses it, and passes that array to
  # vtable slot 45 (Load_3). Stack slots, IAT addresses and helper displacements
  # are variable. This is an in-process assembly-loading capability, also
  # used by legitimate native CLR hosts and commercial protectors.
  - id: native-appdomain-load-byte-array
    desc: Native CLR host loads byte-array assembly
    crit: notable
    conf: 0.97
    if:
      # Keep interface identity and the invocation sequence in one matcher.
      # A bare vtable displacement does not identify the called operation.
      type: yara
      source: |
        import "pe"
        rule native_appdomain_load_byte_array {
          strings:
            $iid = { DC 96 F6 05 29 2B 63 36 AD 8B C4 38 9C F2 A7 13 }
            $load = {
              55 57 50 E8 ?? ?? ?? ?? 83 C4 0C 56 FF 15 ?? ?? ?? ??
              [12-40] 8B 38 8D 4C 24 ?? 8B E8 81 C7 B4 00 00 00
              E8 ?? ?? ?? ?? 8B 0F 50 56 55 FF D1
            }
          condition:
            $iid in (
              pe.sections[pe.section_index(".rdata")].raw_data_offset ..
              pe.sections[pe.section_index(".rdata")].raw_data_offset +
                pe.sections[pe.section_index(".rdata")].raw_data_size - 1
            ) and
            $load in (
              pe.sections[pe.section_index(".text")].raw_data_offset ..
              pe.sections[pe.section_index(".text")].raw_data_offset +
                pe.sections[pe.section_index(".text")].raw_data_size - 1
            )
        }
