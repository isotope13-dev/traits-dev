defaults:
  platforms:
  - windows
  - unix
  for:
  - powershell
composite_rules:
- id: powershell-xor-assembly-reflection-profile
  desc: XOR, assembly-load and reflected-invocation references
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
  - id: micro-behaviors/metaprogramming/reflection/inspect/class::powershell-assembly-method-invoke
  - id: micro-behaviors/data/encoding/xor::powershell-modulo-xor-references
  any:
  - id: micro-behaviors/data/decode/base64::powershell-frombase64string
  - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
  unless:
  - id: well-known/tool/development
  - id: well-known/dual-use/remote-admin/
