defaults:
  platforms:
    - windows
    - unix
  for:
    - powershell
composite_rules:
  - id: powershell-xor-assembly-reflection-profile
    desc: XOR, assembly-load and reflected-invocation references
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/process/interpreter/runtime/clr::powershell-assembly-load-call
      - id: micro-behaviors/metaprogramming/reflection/invoke::powershell-assembly-method-invoke
      - id: micro-behaviors/data/bitwise/xor-forms/indexed::powershell-modulo-xor-references
    any:
      - id: micro-behaviors/data/decode/base64/unspecified::powershell-frombase64string
      - id: micro-behaviors/data/decode/base64/reference::dotnet-frombase64string-text
