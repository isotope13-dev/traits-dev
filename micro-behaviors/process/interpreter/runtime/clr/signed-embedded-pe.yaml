# Binary profile combines signer evidence, an AssemblyResolve hook,
# embedded PEs, and manual API resolution. These clues do not prove
# certificate abuse or a staged payload reaching an activation sink.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: signed-embedded-pe-resolution-api-profile
    desc: Signed embedded-PE CLR and native-resolution API profile
    crit: notable
    conf: 0.95
    all:
      - id: metadata/signed/trust-level::signer-evidence-present
      - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
      - id: metadata/binary/layout/ratio::multiple-pe-embedded
      - id: micro-behaviors/os/api-resolution/manual
    any:
      - id: micro-behaviors/process/create/exec::embedded-pe-process-as-user-profile
      - id: micro-behaviors/crypto/symmetric/aes
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/framework/
      - id: micro-behaviors/fs/temp/pyinstaller::pyinstaller-bundle
      - id: metadata/signed/unknown::tencent-technologyshenzhen-company-limited
      - id: metadata/signed/certificate/identity::benign-consumer-leaves
      - id: metadata/binary/installer/
