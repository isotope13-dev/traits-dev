defaults:
  platforms: [windows]
  for: [csharp]
  crit: notable
  conf: 0.95

traits:
  - id: csharp-appdomain-manager-subclass
    desc: Subclasses CLR AppDomainManager class
    if:
      type: text
      exclude_comments: true
      regex: '\bclass\s+[A-Za-z_]\w{0,60}\s*:\s*(System\.)?AppDomainManager\b'

  - id: csharp-initialize-new-domain-override
    desc: Overrides InitializeNewDomain startup hook
    if:
      type: text
      exclude_comments: true
      regex: '\boverride\s+void\s+InitializeNewDomain\s*\('
