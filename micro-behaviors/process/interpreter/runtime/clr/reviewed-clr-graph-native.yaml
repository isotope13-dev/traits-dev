traits:
- platforms:
  - windows
  - unix
  for:
  - pe
  - dll
  - csharp
  id: appdomain-currentdomain
  desc: .NET AppDomain CurrentDomain accessor
  conf: 0.6
  if:
    type: text
    exact: get_CurrentDomain
- platforms:
  - windows
  - unix
  for:
  - pe
  - dll
  - csharp
  id: appdomain-class-token
  desc: .NET AppDomain class reference
  conf: 0.65
  if:
    type: text
    exact: AppDomain
- platforms:
  - windows
  for:
  - pe
  - csharp
  id: assembly-resolve-event-api
  desc: AssemblyResolve event subscription API reference
  conf: 0.95
  if:
    type: text
    regex: AppDomain\.CurrentDomain\.AssemblyResolve \+=|add_AssemblyResolve
composite_rules:
- id: embedded-pe-screen-network-shell-api-cluster
  desc: Embedded PEs with CLR resolver, screen, network and shell API references
  crit: suspicious
  conf: 0.9
  platforms:
  - windows
  for:
  - pe
  all:
  - id: metadata/binary/layout/ratio::multiple-pe-embedded
  - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
  - id: micro-behaviors/hardware/display/screen::gdi-stretchblt
  - id: micro-behaviors/communications/socket/tcp::networkstream-dotnet-str
  - id: micro-behaviors/process/create/shellexec::shell-execute-call
- platforms:
  - windows
  for:
  - pe
  id: resource-resolver-api-references
  desc: .NET resource, resolver and reflection API references
  conf: 0.96
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/data/embedded/payload/resource::dotnet-managed-resource-access
  - id: micro-behaviors/process/interpreter/runtime/clr::assembly-resolve-event-api
  needs: 2
  any:
  - id: metadata/lang/compiler/managed::reflection-namespace
  - id: micro-behaviors/metaprogramming/reflection/resolve::get-method-token
  - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-currentdomain
  - id: micro-behaviors/data/codec::dotnet-gzip-compression
  unless:
  - id: well-known/lib
  - id: metadata/build/bundler/asset::costura-embedded-assembly-resource
  - id: well-known/lib/runtime/managed/dotnet-runtime::dotnet-reference-pack-context
  - id: well-known/tool/sysadmin/chocolatey::official-library-pe-context
defaults:
  crit: notable
