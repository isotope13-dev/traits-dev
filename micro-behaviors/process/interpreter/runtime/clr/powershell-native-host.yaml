defaults:
  platforms: [windows]
  for: [powershell]

composite_rules:
  # This is deliberately a capability profile. A runtime-tool path and native
  # bytes do not prove that the reflected method injects those bytes into it.
  - id: powershell-masked-assembly-native-host-profile
    desc: XOR assembly invocation with MZ array and Framework host path
    crit: suspicious
    conf: 0.96
    all:
      - id: powershell-xor-assembly-reflection-profile
      - id: micro-behaviors/data/embedded/payload/array::powershell-typed-mz-byte-array
      - id: micro-behaviors/fs/path/system::dotnet-framework-runtime-exe-path
