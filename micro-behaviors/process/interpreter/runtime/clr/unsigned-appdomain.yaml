# AppDomain is a CLR runtime facility. Its presence does not establish
# reflective dispatch: ordinary applications use CurrentDomain.BaseDirectory.
composite_rules:
- id: appdomain-unsigned-filename-mismatch
  desc: Unsigned filename-mismatched PE names AppDomain
  crit: notable
  conf: 0.95
  all:
  - id: metadata/signature/absent::unsigned-missing-signature-record
  - id: metadata/binary/provenance/version-info::pe-original-filename-mismatch
  - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-class-token
  for:
  - pe
  - dll
  platforms:
  - windows
