defaults:
  platforms: [unix, windows]
  for: [powershell]
  crit: notable
  conf: 0.9

traits:
  - id: powershell-assembly-load
    desc: PowerShell loads a .NET assembly
    if:
      type: text
      regex: '(?i)\[(System\.)?Reflection\.Assembly\]::Load\('
    not:
      - substr: 'SharpZipLib.dll'

  - id: powershell-assembly-load-partial
    desc: Loads .NET assembly by partial name
    if:
      type: text
      regex: '(?i)\[System\.Reflection\.Assembly\]::LoadWithPartialName\('

  - id: powershell-assembly-load-call
    desc: PowerShell .NET Assembly.Load call
    crit: notable
    conf: 0.96
    for: [powershell, javascript, html, vbs, text, data]
    if:
      type: text
      regex: '(?i)(System\.Reflection\.|Reflection\.)?Assembly\s*\]\s*::\s*Load\s*\('
