# A supplied argument is loaded before the module/type walk and instance
# construction. API names corroborate the CIL; this is a probable capability,
# not proof that a network buffer was the argument or that a plugin succeeded.
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: cil-input-assembly-module-instantiation
    desc: CIL input load and module instantiation
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        import "pe"
        rule cil_input_assembly_module_instantiation {
          strings:
            $clr = "BSJB"
            $assembly = "Assembly" ascii fullword
            $load = "Load" ascii fullword
            $modules = "GetModules" ascii fullword
            $types = "GetTypes" ascii fullword
            $instance = "CreateInstance" ascii fullword
            $input = { 02 28 ?? ?? ?? 0A 6F ?? ?? ?? 0A 0C 16 0D 2B ?? }
            $construct = { 07 6F ?? ?? ?? 0A 11 ?? 6F ?? ?? ?? 0A 6F ?? ?? ?? 0A 0A }
          condition:
            all of them and
            for any i in (1..#input) : (
              $construct in (@input[i] .. @input[i]+256) and
              for any s in pe.sections : (
                s.name == ".text" and
                @input[i] >= s.raw_data_offset and
                @input[i]+256 < s.raw_data_offset+s.raw_data_size
              )
            )
        }
