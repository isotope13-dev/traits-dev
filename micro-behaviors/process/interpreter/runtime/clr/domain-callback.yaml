defaults:
  platforms: [windows]
  for: [csharp]

traits:
  - id: csharp-created-domain-callback
    desc: Invokes callback in a newly created AppDomain
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((block
          (local_declaration_statement (variable_declaration
            (variable_declarator name: (identifier) @domain
              (invocation_expression function: (member_access_expression) @create))))
          (expression_statement (invocation_expression function: (member_access_expression
            expression: (identifier) @receiver name: (identifier) @callback)))) @evidence
          (#eq? @create "AppDomain.CreateDomain")
          (#eq? @domain @receiver)
          (#eq? @callback "DoCallBack"))
