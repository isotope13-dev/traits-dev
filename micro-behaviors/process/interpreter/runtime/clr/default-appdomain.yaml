defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, python, powershell, batch]
  crit: notable
traits:
  - id: clr-default-appdomain-method-call
    desc: Invokes DLL method through CLR default AppDomain
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])ExecuteInDefaultAppDomain$'
