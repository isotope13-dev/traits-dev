defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: appdomain-accessor-references
    desc: .NET AppDomain accessor references
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/process/interpreter/runtime/clr::appdomain-currentdomain
