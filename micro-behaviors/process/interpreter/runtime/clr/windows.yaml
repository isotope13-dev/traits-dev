defaults:
  platforms: [windows]
  for: [pe]
  crit: notable

traits:
  # CLRCreateInstance may be resolved from encrypted text. These official
  # CLR hosting identifiers remain useful without knowing a decoder's key.
  # Match embedded native images as well as the outer PE's sections.
  # https://github.com/dotnet/runtime/blob/main/src/coreclr/inc/metahost.idl
  - id: clr-metahost-interface-guids
    desc: CLR meta-host COM identifier pair
    conf: 0.99
    if:
      type: yara
      source: |
        rule clr_metahost_interface_guids {
          strings:
            $class = { 8D 18 80 92 8E 0E 67 48 B3 0C 7F A8 38 84 E8 DE }
            $interface = { 9E DB 32 D3 B3 B9 25 41 82 07 A1 48 84 F5 32 16 }
          condition:
            uint16(0) == 0x5a4d and $class and $interface
        }

  - id: clr-native-hosting-apis
    desc: Native PE references CLR hosting APIs
    conf: 0.93
    if:
      type: text
      regex: 'CLRCreateInstance|ICorRuntimeHost::Start'

  - id: clr-byte-array-assembly-load
    desc: CLR loads assembly byte array
    conf: 0.96
    if:
      type: text
      substr: '_AppDomain::Load(byte[])'

  - id: clr-entrypoint-invoke
    desc: CLR invokes managed entry point
    conf: 0.96
    if:
      type: text
      substr: '_MethodInfo::Invoke(entry point)'
