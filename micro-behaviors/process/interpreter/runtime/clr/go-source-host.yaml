defaults:
  platforms: [windows]
  for: [go]
  crit: component
  conf: 0.9

traits:
  - id: go-icorruntimehost-vtable
    desc: Go source defines an ICorRuntimeHost COM vtable
    if:
      type: text
      substr: 'type ICORRuntimeHostVtbl struct'

  - id: go-clr-runtime-info-get-interface
    desc: Go source calls CLR GetInterface
    if:
      type: text
      substr: '.GetInterface('

  - id: go-clr-vtable-create-domain-member
    desc: Go source defines the CLR CreateDomain slot
    if:
      type: text
      substr: 'CreateDomain uintptr'

composite_rules:
  - id: go-native-clr-host-start
    desc: Go source starts CLR through the native runtime host interface
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/process/interpreter/runtime/clr::go-icorruntimehost-vtable
      - id: micro-behaviors/process/interpreter/runtime/clr::go-clr-runtime-info-get-interface
      - id: micro-behaviors/process/interpreter/runtime/clr::go-clr-vtable-create-domain-member
      - id: micro-behaviors/os/syscall/invoke::go-syscall-wrapper-call
