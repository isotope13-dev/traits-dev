defaults:
  platforms: [windows]
  for: [go]
  crit: component
  conf: 0.9

traits:
  - id: go-icorruntimehost-vtable
    desc: Go source defines an ICorRuntimeHost COM vtable
    if:
      type: text
      substr: 'type ICORRuntimeHostVtbl struct'

  - id: go-clr-runtime-info-get-interface
    desc: Go source calls CLR GetInterface
    if:
      type: text
      substr: '.GetInterface('

  - id: go-clr-vtable-create-domain-member
    desc: Go source defines the CLR CreateDomain slot
    if:
      type: text
      substr: 'CreateDomain uintptr'

  - id: go-clr-create-safe-array
    desc: Go source wraps bytes in CLR SAFEARRAY
    if:
      type: text
      regex: 'CreateSafeArray\s*\(\s*\w+'

  - id: go-clr-create-metahost
    desc: Go source creates the CLR meta-host
    if:
      type: symbol
      kind: call
      exact: CLRCreateInstance

  - id: go-clr-appdomain-load
    desc: Go source loads bytes into CLR AppDomain
    if:
      type: text
      regex: '\.Load_3\s*\('

  - id: go-clr-get-entrypoint
    desc: Go source obtains CLR assembly entry point
    if:
      type: text
      regex: '\.GetEntryPoint\s*\('

  - id: go-clr-invoke-method
    desc: Go source invokes CLR method by reflection
    if:
      type: text
      regex: '\.Invoke_3\s*\('

  - id: go-clr-execute-dll-method
    desc: Go invokes disk DLL method through CLR
    if:
      type: symbol
      kind: call
      exact: runtimeHost.ExecuteInDefaultAppDomain

composite_rules:
  - id: go-native-clr-host-start
    desc: Go source starts CLR through the native runtime host interface
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/process/interpreter/runtime/clr::go-icorruntimehost-vtable
      - id: micro-behaviors/process/interpreter/runtime/clr::go-clr-runtime-info-get-interface
      - id: micro-behaviors/process/interpreter/runtime/clr::go-clr-vtable-create-domain-member
      - id: micro-behaviors/os/syscall/invoke::go-syscall-wrapper-call

  - id: go-clr-byte-array-assembly-execution
    desc: Go loads and invokes CLR assembly bytes
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/process/interpreter/runtime/clr::go-clr-create-safe-array
      - id: micro-behaviors/process/interpreter/runtime/clr::go-clr-appdomain-load
      - id: micro-behaviors/process/interpreter/runtime/clr::go-clr-get-entrypoint
      - id: micro-behaviors/process/interpreter/runtime/clr::go-clr-invoke-method

  - id: go-clr-disk-dll-execution
    desc: Go invokes disk DLL method through CLR
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/process/interpreter/runtime/clr::go-clr-execute-dll-method
      - id: micro-behaviors/process/interpreter/runtime/clr::go-clr-create-metahost
