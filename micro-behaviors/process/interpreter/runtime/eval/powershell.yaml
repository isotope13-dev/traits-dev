# PowerShell IEX of a variable: text-form eval when the AST call
# matcher does not apply (batch wrappers, unparsed .ps1).
defaults:
  platforms: [windows, unix]
  for: [powershell, batch]
  attack: T1059.001
  mbc: E1059

traits:
  - id: powershell-iex-text
    desc: PowerShell Invoke-Expression of a variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(iex|Invoke-Expression)\s+\$'

  # A driver loop that invokes candidate ScriptBlock variables one at a time,
  # each in its own try/catch, stopping at the first that does not throw.
  # `powershell-multiple-eval-fallbacks` sees the *set* of eval verbs a script
  # mentions; this sees the retry machinery that walks them, which is what
  # survives a rewrite that swaps Invoke-Expression for a different sink.
  - id: powershell-scriptblock-retry-loop
    desc: Retries ScriptBlock variables until one succeeds
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)foreach\s*\(\s*\$\w+\s+in\s+\$\w+\s*\)\s*\{\s*try\s*\{\s*&\s*\$\w+'
