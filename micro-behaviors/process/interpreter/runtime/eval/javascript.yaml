defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: eval-as-first-arg
    desc: Passes eval as the first call argument
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: string_literal
      regex: \(eval\s*,
  - id: eval-as-last-arg
    desc: Passes eval as the final call argument
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: string_literal
      regex: ',\s*eval\)'

  - id: vm-run-in-context-call
    desc: Evaluates code with vm.runInContext
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: symbol
      kind: call
      exact: vm.runInContext

  # JSON.parse(body) plus eval(ident.field) is distinct from generic
  # eval(obj.prop), which is suppressed on library bundles. Paste-site
  # loaders use this pair; fetch-eval composites add HTTP/C2 context.
  - id: js-eval-parsed-json-field
    desc: eval executes parsed JSON field
    crit: notable
    conf: 0.92
    attack: T1059.007
    if:
      type: text
      regex: 'JSON\.parse\s*\(\s*body\s*\)[\s\S]{0,200}eval\s*\(\s*[A-Za-z_$][\w$]*\.'

  - id: js-dom-event-handler-variable-code
    desc: DOM event handler executes variable code
    crit: notable
    conf: 0.97
    attack: T1059.007
    if:
      # setAttribute("onchange", code) asks the browser to compile the second
      # argument as JavaScript. Match a parsed call so comments and examples
      # cannot stand in for execution.
      type: tree-sitter
      language: javascript
      kind: call
      regex: '\.setAttribute\s*\(\s*["'']on[a-z]{3,20}["'']\s*,\s*[A-Za-z_$][A-Za-z0-9_$]*\s*\)'

composite_rules:
  - id: javascript-dynamic-evaluation
    desc: Uses JavaScript dynamic evaluation APIs
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-raw
      - id: vm-run-in-context-call

  - id: network-eval-child-process-chain
    desc: HTTP, eval, and child-process APIs
    crit: notable
    conf: 0.9
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/request/client::node-http-client-imports
      - id: javascript-dynamic-evaluation
      - id: micro-behaviors/process/create/exec::node-child-process-capability
