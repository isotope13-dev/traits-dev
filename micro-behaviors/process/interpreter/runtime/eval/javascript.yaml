defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: eval-as-first-arg
    desc: Passes eval as the first call argument
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: string_literal
      regex: \(eval\s*,
  - id: eval-as-last-arg
    desc: Passes eval as the final call argument
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: string_literal
      regex: ',\s*eval\)'

  - id: vm-run-in-context-call
    desc: Evaluates code with vm.runInContext
    crit: notable
    conf: 0.9
    attack: T1059.007
    if:
      type: symbol
      kind: call
      exact: vm.runInContext

composite_rules:
  - id: javascript-dynamic-evaluation
    desc: Uses JavaScript dynamic evaluation APIs
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/process/interpreter/eval::js-eval-raw
      - id: vm-run-in-context-call

  - id: network-eval-child-process-chain
    desc: HTTP, eval, and child-process APIs
    crit: notable
    conf: 0.9
    near_lines: 80
    all:
      - id: micro-behaviors/communications/http/request/client::node-http-client-imports
      - id: javascript-dynamic-evaluation
      - id: micro-behaviors/process/create/exec::node-child-process-capability
