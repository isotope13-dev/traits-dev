# Interpreter state operations; attack intent requires additional evidence.
defaults:
  for: [postscript]
  platforms: [linux, macos, windows]
  crit: notable

traits:
  - id: typecheck-handler
    desc: Replaces PostScript typecheck handler
    if:
      type: text
      regex: 'errordict\s+/typecheck\s*\{'
  - id: discard-loader-operands
    desc: Discards five operand stack values
    if:
      type: text
      regex: '\bpop\s+pop\s+pop\s+pop\s+pop\b'
  - id: capture-loader-stack
    desc: Captures operand stack into array
    if:
      type: text
      regex: '\bcount\s+array\s+astore\s+userdict\b'
  - id: inspect-filename-operand
    desc: Inspects indexed string stack operand
    if:
      type: text
      regex: '\b2\s+copy\s+get\s+type\s+/stringtype\s+eq\b'
  - id: register-font-path
    desc: Registers readonly font path array
    if:
      type: text
      regex: '\bFontmap\s+/[^\s/]{1,64}\s+[^\s]{1,64}\s+readonly\s+put\b'
  - id: retrieve-systemdict-reference
    desc: Retrieves system dictionary entry
    if:
      type: text
      regex: '\bsystemdict\s+/[^\s/]{1,64}\s+get\s+def\b'
  - id: store-operator-reference
    desc: Stores arithmetic operator reference
    if:
      type: text
      regex: '\bget\s+\w{1,40}\s+/(mul|sub|add|div)\s+load\s+put\b'
  - id: patch-reference-pointer
    desc: Writes indexed bytes with eight-byte offset
    if:
      type: text
      regex: '\b\w+\s+\w+\s+8\s+add\s+\w+\s+add\s+\w+\s+\w+\s+get\s+put\b'
  - id: execute-array-reference
    desc: Executes array-held interpreter reference
    if:
      type: text
      regex: '\bget\s+\w{1,40}\s+get\s+exec\b'

