defaults:
  for: [package.json]
  platforms: [unix, windows]
composite_rules:
  - id: npm-preinstall-interpreter-pipe
    desc: Preinstall pipes output to an interpreter
    crit: notable
    conf: 0.85
    unless:
    - id: well-known/tool/sysadmin/alpine-packages/package::alpine-langfuse-package
    - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-langfuse-next-app-path
    - id: well-known/tool/sysadmin/alpine-packages/package::datadog-libdatadog-package-json
    - id: well-known/tool/sysadmin/alpine-packages/package::datadog-libdatadog-package
    - id: micro-behaviors/os/package-manager/installer-script::wasm-pack-installer-script-url
    any:
    - id: micro-behaviors/process/interpreter/shell::npm-preinstall-sh-pipe
    - id: micro-behaviors/process/interpreter/shell::npm-preinstall-shell-pipe
    - id: micro-behaviors/process/interpreter/node::npm-preinstall-stdin-pipe
