defaults:
  crit: notable
  platforms: [windows, unix]
  for: [powershell]
  attack: T1059.001
  mbc: E1059

traits:
  - id: powershell-getcontent-piped-iex
    desc: PowerShell pipes file content into eval
    conf: 0.98
    if:
      type: text
      regex: '(?i)Get-Content[^\r\n|]{0,160}\|\s*(IEX|Invoke-Expression)\b'
