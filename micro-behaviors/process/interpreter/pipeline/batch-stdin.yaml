# A batch file that echoes an expanded variable into an interpreter reading
# its script from standard input keeps the script out of the command line.
defaults:
  crit: notable
  platforms: [windows]
  for: [batch]
  attack: T1059.001,T1027
traits:
  - id: batch-echo-variable-piped-to-interpreter-stdin
    desc: Batch pipes variable into interpreter stdin
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\s*echo\s+%+\w+%+\s*\|\s*"?%\w+%"?\s[^\r\n]{0,80}\s-\s*$'
