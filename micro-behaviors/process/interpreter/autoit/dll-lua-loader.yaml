# AutoIt script primitives for hidden execution, local DLL loading from
# @ScriptDir, string-delimiter deobfuscation helpers, and junk-obfuscated
# MSVC runtime / Lua VM / masqueraded script-file references.
defaults:
  platforms: [windows]
  for: [text]
  size_max: 2000000
  crit: notable
  conf: 0.9

traits:
  - id: autoit-no-tray-icon
    desc: AutoIt NoTrayIcon hides script tray icon
    conf: 0.85
    if:
      type: text
      regex: '(?mi)^\s*#NoTrayIcon\b'

  - id: autoit-scriptdir-dllopen
    desc: AutoIt DllOpen loads DLL from @ScriptDir
    if:
      type: text
      regex: '(?i)DllOpen\s*\(\s*@ScriptDir\b'

  - id: autoit-junked-vcruntime-dll
    desc: AutoIt references junked vcruntime DLL
    conf: 0.92
    if:
      type: text
      regex: 'v.{0,3}c.{0,3}r.{0,3}u.{0,3}n.{0,3}t.{0,3}i.{0,3}m.{0,3}e.{0,12}\..{0,3}d.{0,3}l.{0,3}l'

  - id: autoit-junked-lua-pcall-name
    desc: AutoIt call name spells lua_pcall with junk
    conf: 0.94
    if:
      type: text
      regex: 'l.{0,3}u.{0,3}a.{0,3}_.{0,3}p.{0,3}c.{0,3}a.{0,3}l.{0,3}l'

  - id: autoit-junked-lua-openlibs-name
    desc: AutoIt call name spells luaL_openlibs with junk
    conf: 0.94
    if:
      type: text
      regex: 'l.{0,3}u.{0,3}a.{0,3}L.{0,3}_.{0,3}o.{0,3}p.{0,3}e.{0,3}n.{0,3}l.{0,3}i.{0,3}b.{0,3}s'

  - id: autoit-scriptdir-config-path
    desc: AutoIt @ScriptDir references config file
    conf: 0.88
    if:
      type: text
      regex: '@ScriptDir\s*&\s*[^)\r\n]{1,65}\..{0,3}(i.{0,3}n.{0,3}i|d.{0,3}a.{0,3}t|c.{0,3}f.{0,3}g)'

  - id: autoit-stringreplace-junk-helper
    desc: AutoIt StringReplace strips junk delimiter
    if:
      type: text
      regex: '(?is)Func\s+\w+\s*\([^)\r\n]{1,30}\)[\s\S]{1,99}StringReplace\s*\([^;\r\n]{1,30},[''"]{2}\)'
