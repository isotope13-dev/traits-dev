defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: iexpress-autoit-script-payload
    desc: AutoIt command names compiled script
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)"AutoIt3\.exe"\s+[^\r\n"]{1,80}\.a3x\b'
  - id: iexpress-autoit-au3-payload
    desc: AutoIt command names source script
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)"AutoIt3\.exe"\s+[^\r\n"]{1,80}\.au3\b'
