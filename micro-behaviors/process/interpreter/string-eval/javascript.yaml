# JavaScript String-Eval Detection
# MBC: B0009.016 (Dynamic Execution)
# ATT&CK: T1059.007
defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [javascript, typescript, html, static-lib]
  attack: T1059.007

traits:
  - id: js-eval-concat-string
    desc: Eval of a concatenated string
    if:
      type: text
      regex: '(?i)\beval\s*\(\s*["\x27][^"\x27]{0,40}["\x27]\s*\+'
    unless:
      - id: metadata/package/testing/harness/runtime/
