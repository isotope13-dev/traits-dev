defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: notable
  attack: T1059

traits:
  - id: ruby-class-eval-string-argument
    desc: Ruby class_eval evaluates string source
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: class_eval
      arg:
        kind: string

  - id: ruby-instance-eval-string-argument
    desc: Ruby instance_eval evaluates string source
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: instance_eval
      arg:
        kind: string
