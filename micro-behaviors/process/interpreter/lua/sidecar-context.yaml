defaults:
  platforms: [windows]
  for: [lua, batch, text]

traits:
  - id: lua-runtime-dll-name
    desc: Lua runtime DLL name text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\blua[0-9]{1,2}\.dll\b'

composite_rules:
  - id: lua-runtime-file-argument-context
    desc: Lua DLL text with executable-file argument
    crit: suspicious
    conf: 0.96
    all:
      - id: lua-runtime-dll-name
      - id: micro-behaviors/process/argument/file::executable-data-or-script-file-argument

  - id: lua-ffi-runtime-file-context
    desc: Lua FFI and runtime file-argument context
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/dylib/load/ffi::lua-ffi-windows-api-declarations
      - id: lua-runtime-file-argument-context
