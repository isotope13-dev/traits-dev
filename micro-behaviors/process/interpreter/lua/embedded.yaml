defaults:
  platforms: [windows, unix]
  for: [binaries, c, cpp]
traits:
- id: lua-bytecode-magic
  desc: Embedded Lua bytecode magic
  crit: notable
  conf: 0.96
  for: [pe, dll]
  if:
    type: hex
    section: .rdata
    pattern: "1B 4C 75 61"
- id: lua-c-api-open
  desc: Lua C API open call
  crit: component
  conf: 0.94
  count_min: 3
  if:
    type: text
    word: lua_open
- id: lua-c-api-close
  desc: Lua C API close call
  crit: component
  conf: 0.94
  count_min: 3
  if:
    type: text
    word: lua_close
- id: lua-c-api-newstate
  desc: Lua C API state creation call
  crit: component
  conf: 0.94
  count_min: 3
  if:
    type: text
    word: luaL_newstate
- id: lua-c-api-openlibs
  desc: Lua C API library initialization call
  crit: component
  conf: 0.94
  count_min: 3
  if:
    type: text
    word: luaL_openlibs
- id: lua-c-api-loadbuffer
  desc: Lua C API buffer loader call
  crit: component
  conf: 0.94
  count_min: 3
  if:
    type: text
    word: luaL_loadbuffer
- id: lua-c-api-loadstring
  desc: Lua C API string loader call
  crit: component
  conf: 0.94
  count_min: 3
  if:
    type: text
    word: luaL_loadstring
- id: lua-c-api-pcall
  desc: Lua C API protected call
  crit: component
  conf: 0.94
  count_min: 3
  if:
    type: text
    word: lua_pcall
- id: lua-c-api-call
  desc: Lua C API call
  crit: component
  conf: 0.94
  count_min: 3
  if:
    type: text
    word: lua_call
- id: lua-c-api-load
  desc: Lua C API loader call
  crit: component
  conf: 0.94
  count_min: 3
  if:
    type: text
    word: lua_load
- id: lua-c-api-tolstring
  desc: Lua C API string conversion call
  crit: component
  conf: 0.94
  count_min: 3
  if:
    type: text
    word: lua_tolstring
- id: lua-c-api-pushstring
  desc: Lua C API string push call
  crit: component
  conf: 0.94
  count_min: 3
  if:
    type: text
    word: lua_pushstring
- id: lua-c-api-pushcclosure
  desc: Lua C API closure push call
  crit: component
  conf: 0.94
  count_min: 3
  if:
    type: text
    word: lua_pushcclosure
- id: lua-c-api-settable
  desc: Lua C API table setter call
  crit: component
  conf: 0.94
  count_min: 3
  if:
    type: text
    word: lua_settable
- id: lua-c-api-gettable
  desc: Lua C API table getter call
  crit: component
  conf: 0.94
  count_min: 3
  if:
    type: text
    word: lua_gettable
- id: lua-c-api-setglobal
  desc: Lua C API global setter call
  crit: component
  conf: 0.94
  count_min: 3
  if:
    type: text
    word: lua_setglobal
- id: lua-c-api-getglobal
  desc: Lua C API global getter call
  crit: component
  conf: 0.94
  count_min: 3
  if:
    type: text
    word: lua_getglobal
- id: lua-env-vars
  desc: Lua environment variables
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: \bLUA_(PATH|CPATH|INIT)\b
composite_rules:
- id: embedded-lua-vm
  desc: Embedded Lua virtual machine
  crit: notable
  conf: 0.96
  all:
  - id: lua-c-api-cluster
  any:
  - id: lua-bytecode-magic
  - id: lua-env-vars
- id: lua-c-api-cluster
  desc: Embedded Lua C API cluster
  crit: notable
  conf: 0.94
  any:
  - id: lua-c-api-open
  - id: lua-c-api-close
  - id: lua-c-api-newstate
  - id: lua-c-api-openlibs
  - id: lua-c-api-loadbuffer
  - id: lua-c-api-loadstring
  - id: lua-c-api-pcall
  - id: lua-c-api-call
  - id: lua-c-api-load
  - id: lua-c-api-tolstring
  - id: lua-c-api-pushstring
  - id: lua-c-api-pushcclosure
  - id: lua-c-api-settable
  - id: lua-c-api-gettable
  - id: lua-c-api-setglobal
  - id: lua-c-api-getglobal
