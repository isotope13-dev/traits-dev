# gopher-lua (github.com/yuin/gopher-lua) is the pure-Go Lua VM. Because it is
# a Go package rather than the C library, none of the lua_*/luaL_* C-API traits
# in embedded.yaml can see it: a Go program can create a Lua state, load a
# script off disk or out of a string, and call into it without emitting a
# single C-API symbol. Go tooling embeds it for user plugins; Go loaders embed
# it to keep the executed payload out of the compiled binary.
defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable

traits:
  - id: gopher-lua-import
    desc: Imports the gopher-lua Go Lua VM
    conf: 0.95
    if:
      type: import
      regex: '(^|/)yuin/gopher-lua($|/)'

  - id: gopher-lua-new-state
    desc: Creates a gopher-lua interpreter state
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(?i)lua\.NewState$'

  - id: gopher-lua-do-file
    desc: Executes a Lua script file via gopher-lua
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(?i)\.DoFile$'

  - id: gopher-lua-do-string
    desc: Executes Lua source text via gopher-lua
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(?i)\.DoString$'

  # CallByParam is gopher-lua's own protected-call entry point; the generic
  # .PCall spelling is deliberately not matched here because it collides with
  # unrelated Go APIs and would claim Lua execution it cannot establish.
  - id: gopher-lua-call-global
    desc: Calls a Lua-defined global from Go
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)\.CallByParam$'

composite_rules:
  - id: gopher-lua-script-execution
    desc: Runs Lua scripts in an embedded Go Lua VM
    crit: notable
    conf: 0.96
    all:
      - id: gopher-lua-import
      - id: gopher-lua-new-state
    any:
      - id: gopher-lua-do-file
      - id: gopher-lua-do-string
      - id: gopher-lua-call-global
