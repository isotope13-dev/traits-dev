---
defaults:
  for:
  - javascript
  - typescript
  - python
  - lua
  - markdown
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: lua-execution-tool-name
  desc: Lua execution tool name
  crit: notable
  conf: 0.94
  for:
  - python
  - javascript
  - typescript
  if:
    type: text
    regex: '["'']name["'']\s*:\s*["''][A-Za-z0-9_]*(execute|run|eval)_lua["'']'
- id: arbitrary-lua-description
  desc: arbitrary Lua description
  crit: notable
  conf: 0.94
  for:
  - python
  - javascript
  - typescript
  if:
    type: text
    substr: arbitrary Lua code
composite_rules:
- id: lua-arbitrary-code-tool-schema
  for:
  - python
  - javascript
  desc: Lua execution tool name and arbitrary-code description text
  crit: notable
  conf: 0.94
  near_lines: 8
  all:
  - id: micro-behaviors/process/interpreter/lua::lua-execution-tool-name
  - id: micro-behaviors/process/interpreter/lua::arbitrary-lua-description
