defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: javascript-interpreter-name
    desc: JavaScript process call names Lua
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(child_process|cp)\.(spawn|exec)$'
      arg:
        kind: string
        exact: lua

