defaults:
  platforms: [windows, unix]
  for: [pdf]
  crit: suspicious
  conf: 0.95
  attack: T1203

traits:
  - id: pdf-stream-collab-emailinfo
    desc: PDF stream calls Collab.collectEmailInfo
    if:
      type: value
      path: pdf.streams[*].decoded_text
      substr: Collab.collectEmailInfo
  - id: pdf-stream-collab-geticon
    desc: PDF stream calls Collab.getIcon
    if:
      type: value
      path: pdf.streams[*].decoded_text
      substr: Collab.getIcon
  - id: pdf-stream-media-newplayer
    desc: PDF stream calls media.newPlayer
    if:
      type: value
      path: pdf.streams[*].decoded_text
      substr: media.newPlayer
  - id: pdf-stream-spell-customdict
    desc: PDF stream opens custom dictionary
    if:
      type: value
      path: pdf.streams[*].decoded_text
      substr: spell.customDictionaryOpen
  - id: pdf-stream-util-printf-exploit
    desc: PDF stream util.printf exploit marker
    conf: 0.96
    if:
      type: value
      path: pdf.streams[*].decoded_text
      regex: 'util.{0,24}printf.{0,64}45000f'
  - id: pdf-stream-printseps
    desc: PDF stream calls printSeps
    conf: 0.92
    if:
      type: value
      path: pdf.streams[*].decoded_text
      substr: printSeps
  - id: pdf-stream-addtoolbutton
    desc: PDF stream calls app.addToolButton
    conf: 0.92
    if:
      type: value
      path: pdf.streams[*].decoded_text
      substr: app.addToolButton
  # app.launchURL() — JS API to open a URL; used in drive-by download chains.
  - id: js-launchurl
    desc: "PDF JS launchURL navigation"
    conf: 0.9
    if:
      type: text
      substr: "app.launchURL"
  # Acrobat JavaScript can decode streams and strings; useful for staged JS.
  - id: js-streamdecode
    desc: PDF JavaScript streamDecode decoder API
    conf: 0.9
    if:
      type: text
      regex: 'SOAP(\.|\[.{0,80})streamDecode'
  # Collab.collectEmailInfo — CVE-2007-5659 (Adobe Reader ≤8.1.2).
  - id: js-collab-email
    # === Known CVE Exploit Patterns ===

    desc: "PDF collectEmailInfo CVE-2007-5659"
    conf: 0.97
    if:
      type: text
      substr: "Collab.collectEmailInfo"
  # util.printf — CVE-2008-2992 (Adobe Reader ≤8.1.3).
  - id: js-util-printf
    desc: util.printf PDF exploit API
    conf: 0.97
    if:
      type: text
      substr: "util.printf"
  # spell.customDictionaryOpen — CVE-2009-0927 (Adobe Reader 9.0).
  - id: js-spell-dict
    desc: PDF JS customDictionaryOpen call
    conf: 0.97
    if:
      type: text
      substr: "spell.customDictionaryOpen"
  # getAnnots() — annotation enumeration used for heap spray allocation.
  - id: js-getannots
    desc: PDF getAnnots annotation enumeration
    conf: 0.9
    crit: notable
    if:
      type: text
      regex: "\\bgetAnnots\\s*\\("
  - id: pdf-stream-js-util-bytetochar
    desc: PDF stream uses util.byteToChar
    conf: 0.9
    if:
      type: value
      path: pdf.streams[*].decoded_text
      substr: byteToChar
    unless:
      - id: well-known/lib/format/pdfium::source-tree
  - id: pdf-stream-js-settimeout
    desc: PDF stream uses app.setTimeOut
    conf: 0.9
    attack: T1059.007
    if:
      type: value
      path: pdf.streams[*].decoded_text
      substr: app.setTimeOut
    unless:
      - id: well-known/lib/format/pdfium::source-tree
  - id: pdf-stream-event-richvalue
    desc: PDF stream references event.richValue
    conf: 0.9
    if:
      type: value
      path: pdf.streams[*].decoded_text
      substr: event.richValue
  - id: pdf-stream-resetform
    desc: PDF stream calls this.resetForm
    # The API behind every "Reset form" button an AcroForm ships.
    crit: notable
    conf: 0.88
    if:
      type: value
      path: pdf.streams[*].decoded_text
      substr: this.resetForm()

composite_rules:
  # Helper: any known CVE exploit pattern.
  - id: pdf-known-cve
    desc: PDF contains known CVE JavaScript exploit API call
    conf: 0.97
    any:
      - id: js-collab-email
      - id: js-util-printf
      - id: js-spell-dict
