# Node launches a script that ships beside the calling file. The Node runtime is
# named either as process.execPath or as the string 'node', and the argument
# list mentions __dirname, so the target lives inside the same package. This is
# the name-independent companion to the install-hook basename legs: a dropper
# can rename its helper, but the package-relative launch stays.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.88

traits:
  - id: execpath-package-relative-spawn
    desc: Node spawns a package-relative script
    if:
      type: text
      regex: 'spawn\s*\(\s*(process\.execPath|[''"]node[''"])\s*,\s*\[[^\]]{0,40}__dirname'
