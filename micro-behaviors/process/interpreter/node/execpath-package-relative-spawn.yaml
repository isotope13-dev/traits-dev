# Node launches a script that ships beside the calling file. spawn names the
# runtime as process.execPath or 'node'; fork takes the module path directly.
# Either way the argument mentions __dirname, so the target lives in the same
# package. This is the name-independent companion to the install-hook basename
# legs: a dropper can rename its helper, but the package-relative launch stays.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.88

traits:
  - id: execpath-package-relative-spawn
    desc: Node launches a package-relative script
    if:
      type: text
      regex: '(spawn\s*\(\s*(process\.execPath|["'']node["''])\s*,\s*\[|fork\s*\()[^\]\)]{0,40}__dirname'
  # process.argv[0] names the runtime that started the process, so a helper
  # that spawns it with the package script renamed to dodge execPath checks
  # is the same package-relative launch. Kept separate: the execPath regex
  # already uses its 90-byte budget.
  - id: argv0-package-relative-spawn
    desc: Node launches package script via argv[0]
    if:
      type: text
      regex: 'spawn\s*\(\s*process\.argv\[0\]\s*,\s*\[[^\]\)]{0,40}__dirname'
