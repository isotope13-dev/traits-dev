# Node respawns a script that ships beside the calling file. The launched path
# is joined to __dirname, so the target lives inside the same package. This is
# the name-independent companion to the install-hook basename legs: a dropper
# can rename its helper, but the package-relative launch stays.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.88

traits:
  - id: execpath-package-relative-spawn
    desc: Node execPath spawns a package-relative script
    if:
      type: text
      regex: 'spawn\s*\(\s*process\.execPath\s*,\s*\[\s*path\.join\(\s*__dirname\s*,'
