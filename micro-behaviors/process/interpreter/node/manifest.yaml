traits:
- platforms:
  - unix
  - windows
  for:
  - package.json
  id: manifest-node-inline-command
  desc: npm script starts a Node inline command
  crit: notable
  conf: 0.85
  unless:
  - type: value
    path: scripts.postinstall
    regex: require\.resolve\(['"]husky['"]\)
  - type: value
    path: scripts.preinstall
    regex: node\s+-e\s+\\?["'][^"\n]{0,120}\.(copyFileSync|mkdirSync|chmodSync)\(
  - type: value
    path: scripts.postinstall
    regex: node\s+-e\s+\\?["'][^"\n]{0,120}\.(copyFileSync|mkdirSync|chmodSync)\(
  - type: value
    path: scripts.postbuild
    regex: node\s+-e\s+\\?["'][^"\n]{0,120}\.(copyFileSync|mkdirSync|chmodSync)\(
  - type: value
    path: scripts.clean
    regex: node\s+-e\s+\\?["'][^"\n]{0,200}\.(rmSync|cpSync|mkdirSync)\(
  - type: value
    path: scripts.copy
    regex: node\s+-e\s+\\?["'][^"\n]{0,200}\.(rmSync|cpSync|mkdirSync)\(
  - type: value
    path: scripts.build
    regex: node\s+-e\s+\\?["'][^"\n]{0,200}\.rmSync\(
  if:
    type: value
    path: scripts[*]
    regex: ^\s*node\s+(-e|--eval)\b
