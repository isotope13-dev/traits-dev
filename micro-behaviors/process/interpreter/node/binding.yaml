defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: process-binding
    desc: Calls the internal Node.js process.binding API
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(process|freeProcess)\.binding$'
    unless:
      - type: symbol
        kind: call
        regex: '^(process|freeProcess)\.binding$'
        arg:
          kind: string
          exact: uv
      - id: micro-behaviors/process/interpreter/node::process-binding-evals
      - id: micro-behaviors/process/interpreter/node::process-binding-natives
      - id: metadata/package/testing/compiled/
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: process-binding-evals
    desc: Uses Node internal evals binding
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: "process\\.binding\\s*\\(\\s*['\"]evals['\"]\\s*\\)"
  - id: process-binding-natives
    desc: 'Access to process.binding'
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: "process\\.binding\\s*\\(\\s*['\"]natives['\"]\\s*\\)"
  - id: process-dlopen
    desc: Native addon loading via process.dlopen
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "process\\.dlopen\\s*\\("
