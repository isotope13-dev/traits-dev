# Filesystem paths to the Node.js executable in string literals.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1059.007

traits:
  # Relocated from objectives/command-and-control/dropper/node-bootstrap, where
  # it was `slash-node` (`/node([?#\s]|$)`). That matched any string ending in
  # "/node" — the `@types/node` dependency name in a bundled source map, API
  # routes — none of which reference the interpreter. Require a bin/ directory
  # or the Windows executable name.
  - id: node-binary-path
    desc: Node.js executable path string
    conf: 0.85
    if:
      type: string_literal
      regex: '[/\\](bin[/\\]node|node\.exe)([?#\s]|$)'
