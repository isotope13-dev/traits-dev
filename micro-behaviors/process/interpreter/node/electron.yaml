defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-electron-main-require
    desc: Node requires Electron main process module
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'require\(["'']electron["'']\)'
  - id: electron-app-when-ready
    desc: Electron app waits for ready event
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '(app\s*\.\s*whenReady|\bapp\s*\[\s*["'']whenReady["'']\s*\])\s*\(\s*\)'
  - id: electron-app-exit
    desc: Electron app explicitly calls exit
    crit: baseline
    conf: 0.88
    if:
      type: text
      regex: '(app\s*\.\s*exit|\bapp\s*\[\s*["'']exit["'']\s*\])\s*\('
