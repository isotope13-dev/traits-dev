defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: scripts-preinstall-node-e
  desc: Preinstall inline Node references URL
  crit: suspicious
  conf: 0.95
  unless:
  - id: metadata/package/scripts/interpreter-pipe::npm-preinstall-printed-curl-pipe-guidance-context
  if:
    type: value
    path: scripts.preinstall
    regex: node\s+-e\s+['"].{0,100}https?://
