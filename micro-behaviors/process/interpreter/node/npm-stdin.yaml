defaults:
  for: [package.json]
  platforms: [unix, windows]
traits:
- id: preinstall-pipe-node
  desc: Preinstall pipes command output to Node
  crit: notable
  conf: 0.85
  if:
    type: value
    path: "scripts.preinstall"
    regex: '(^|[^|])\|[ \t]*node([ \t]|$)'
- id: npm-postinstall-stdin-pipe
  desc: Postinstall pipes command output to Node stdin
  crit: notable
  conf: 0.94
  if:
    type: value
    path: "scripts.postinstall"
    # `|node=` is a POST-body field, not a pipe into the node binary.
    regex: '(^|[^|])\|\s*node\s*(-\s*)?($|[;&])'
  unless:
  - id: metadata/package/files/dependency::node-modules-path
