defaults:
  for: [pkginfo]
  platforms: [windows, unix]
traits:
- id: versioned-lifecycle-node-e
  desc: Lifecycle hook runs node -e
  crit: suspicious
  conf: 0.96
  if:
    type: text
    regex: "\"(preinstall|preupdate|test)\"\\s*:\\s*\"node\\s+-e\\s+\\\\?\""

composite_rules:
- id: versioned-preinstall-node-entry
  desc: preinstall runs node local script
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/os/console/io::pkginfo-dev-null-redirect
  - id: metadata/package/scripts/command::versioned-preinstall-node-entry--rx-3
- id: versioned-install-node-entry
  desc: install runs node local script
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/os/console/io::pkginfo-dev-null-redirect
  - id: metadata/package/scripts/command::versioned-install-node-entry--rx-6
