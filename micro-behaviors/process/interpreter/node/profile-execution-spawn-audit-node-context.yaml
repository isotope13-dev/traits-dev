---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: spawn-node
  desc: Node argument and spawn/eval clues coexist
  crit: notable
  conf: 0.88
  near_bytes: 256
  all:
  - id: micro-behaviors/process/create/subprocess/launch::spawn-call
  - id: metadata/lang/source/syntax/argument::call-arg-node-string
  any:
  - id: micro-behaviors/process/deploy/interpreter-command::spawn-node-eval
  - id: micro-behaviors/process/deploy/interpreter-command::spawn-node-eval-first-option
  - id: micro-behaviors/fs/path/temporary-artifact::js-path-under-tmp
