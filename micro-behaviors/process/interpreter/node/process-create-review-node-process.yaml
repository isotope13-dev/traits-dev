defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: spawn-node-process
    desc: Spawns Node.js process
    conf: 0.84
    mbc: "C0017"
    attack: "T1059.007"
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(child_process|cp)\.spawn$'
      arg:
        kind: string
        exact: node
