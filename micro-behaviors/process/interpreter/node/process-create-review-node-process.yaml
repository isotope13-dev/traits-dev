defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]
  mbc: "C0017"
  attack: "T1059.007"
traits:
  - id: spawn-node-process
    desc: Spawns Node.js process
    conf: 0.84
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(child_process|cp)\.spawn$'
      arg:
        kind: string
        exact: node
  - id: spawn-current-runtime-process
    desc: Spawns the current runtime binary
    conf: 0.86
    if:
      type: text
      regex: '\.spawn\s*\([^()]{0,60}\bexecPath\b'
