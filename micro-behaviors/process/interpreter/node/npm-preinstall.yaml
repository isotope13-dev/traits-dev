defaults:
  for: [package.json]
  platforms: [unix, windows]
traits:
  - id: npm-preinstall-stdin-pipe
    desc: Preinstall pipes command output into Node
    crit: notable
    conf: 0.85
    if:
      type: value
      path: "scripts.preinstall"
      regex: "(^|[^|])\\|\\s*node\\b"
  - id: npm-preinstall-node-command
    desc: Preinstall script invokes the Node interpreter
    crit: notable
    conf: 0.75
    if:
      type: value
      path: scripts.preinstall
      regex: '(^|[|;&[:space:]])node([[:space:]]|$)'
