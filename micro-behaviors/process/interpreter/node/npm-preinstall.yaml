defaults:
  for: [package.json]
  platforms: [unix, windows]
traits:
  # A Node version guard in preinstall (e.g. `process.versions.node` checks)
  # is ordinary compatibility gating, not vendor identity: any package can
  # carry one, so it lives here as a neutral capability rather than under a
  # product name.
  - id: npm-preinstall-node-version-check
    desc: Preinstall reads Node.js version
    crit: notable
    conf: 0.99
    if:
      type: value
      path: scripts.preinstall
      substr: process.versions.node
  - id: npm-preinstall-stdin-pipe
    desc: Preinstall pipes command output into Node
    crit: notable
    conf: 0.85
    if:
      type: value
      path: "scripts.preinstall"
      regex: "(^|[^|])\\|\\s*node\\b"
