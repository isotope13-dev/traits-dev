defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  # A tiny install-hook script that only compares process.versions.node and
  # exits is compatibility gating. It names no module, makes no request and
  # runs no child, so an install hook that merely points at it says nothing
  # about network or obfuscated code elsewhere in a bundled application.
  # A script that loads a sibling file, a built-in network/process module or
  # evaluates code is not a gate and does not qualify.
  - id: node-version-gate-script
    desc: Small script only gates on Node version
    crit: baseline
    conf: 0.9
    size_max: 1500
    if:
      type: text
      substr: process.versions.node
    unless:
      - type: text
        regex: '(require|import)\s*\(?\s*[''"](\.|node:)'
      - type: text
        regex: '(require|import)\s*\(?\s*[''"](child_process|https?|net)'
      - type: text
        regex: '(require|import)\s*\(?\s*[''"](fs|os)'
      - type: text
        regex: '\b(eval|spawn|exec)\s*\('
      - type: text
        regex: '\b(fetch|Function)\s*\('
