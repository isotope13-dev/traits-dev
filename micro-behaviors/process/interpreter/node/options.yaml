defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript, shell]
  attack: T1059.007
traits:
  # `node -e "try{require('x')..."` -- a one-liner that probes whether a module
  # loads. Native-module rebuilders and optional-dependency checks do exactly
  # this, so it is a probe idiom rather than evidence of a hook payload. The
  # idiom also lives in manifests (`postinstall: node -e "try{require(...)}"`),
  # which is where the encoded-npm-cmd rule looks -- without package.json in
  # scope that rule's carve-out for this probe could never fire there.
  - id: node-eval-require-probe
    desc: Node -e try/require module probe
    conf: 0.85
    for: [javascript, typescript, shell, package.json]
    if:
      type: text
      regex: 'node\s+-e\s+\\?"try\s*\{\s*require\('
  - id: require-preload-option
    desc: Node.js require preload option
    conf: 0.8
    if:
      type: text
      regex: '--require(=|\s+)'
    unless:
      - id: metadata/package/testing/harness/runtime/

  - id: node-eval-command
    desc: Node inline eval command
    conf: 0.75
    if:
      type: string_literal
      regex: '\bnode\s+-e\s+'
    unless:
      - type: basename
        regex: '\.(test|spec)\.[cm]?[jt]sx?$'
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern

  # spawn('node', ['-e', ...]) is the API spelling of the inline-eval
  # invocation above: a fresh interpreter staged on an inline script
  # rather than a shell one-liner. The string-literal matcher of
  # node-eval-command never sees it (its 'node' and '-e' are separate
  # array elements), so staged droppers using child_process.spawn slip
  # past. Same testing carve-outs as the shell spelling.
  - id: node-spawn-eval-argument
    desc: Spawned node runs inline eval script
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: 'spawn\s*\(\s*[''"]node[''"][\s\S]{0,260}[''"]-e[''"]'
    unless:
      - type: basename
        regex: '\.(test|spec)\.[cm]?[jt]sx?$'
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/files/dependency::node-modules-path

  - id: which-node-lookup
    desc: Locate node binary via `which node`
    conf: 0.97
    if:
      type: string_literal
      regex: '(^|[;&|(]\s*)which\s+node(\.exe)?(\s|$)'

  - id: where-node-lookup
    desc: Locate node binary via `where node`
    conf: 0.97
    if:
      type: string_literal
      regex: '(^|[;&|(]\s*)where\s+node(\.exe)?(\s|$)'
    not:
      - substr: "where node or an edge is added"
      - substr: "Hints for where node labels are to be placed"
      - substr: "which node and where node lookup"
