defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
traits:
  # Fetch one opcode, advance its instruction cursor, index a qword handler
  # table, rebase the relative handler, and transfer control to that handler.
  - id: x64-relative-opcode-dispatch
    desc: x64 bytecode relative handler-table dispatch
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: any
      pattern: '42 0F B6 44 25 00 49 FF C4 4D 8B 4C C5 00 4D 01 E9 41 FF E1'
