defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: stream-buffer-vm-evaluation
    desc: Stream accumulator reaches VM execution call
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (statement_block
        (expression_statement (call_expression
          function: (member_expression object: (identifier) @stream property: (property_identifier) @on_data)
          arguments: (arguments . (string (string_fragment) @data) .
            (arrow_function parameters: (formal_parameters . (identifier) @chunk .)
              body: (augmented_assignment_expression left: (identifier) @buffer
                operator: "+=" right: (identifier) @incoming)))))
        (expression_statement (call_expression
          function: (member_expression object: (identifier) @same property: (property_identifier) @on_end)
          arguments: (arguments . (string (string_fragment) @end) .
            (arrow_function body: (statement_block (expression_statement (call_expression
          function: (member_expression property: (property_identifier) @run)
          arguments: (arguments . (identifier) @used))))))))
        (#eq? @stream @same)
        (#eq? @on_data "on")
        (#eq? @on_end "on")
        (#eq? @data "data")
        (#eq? @end "end")
        (#eq? @chunk @incoming)
        (#eq? @buffer @used)
        (#match? @run "^runIn(Context|NewContext|ThisContext)$"))

        (statement_block
        (expression_statement (call_expression
          function: (member_expression object: (identifier) @stream property: (property_identifier) @on_data)
          arguments: (arguments . (string (string_fragment) @data) .
            (arrow_function parameters: (formal_parameters . (identifier) @chunk .)
              body: (augmented_assignment_expression left: (identifier) @buffer
                operator: "+=" right: (identifier) @incoming)))))
        (expression_statement (call_expression
          function: (member_expression object: (identifier) @same property: (property_identifier) @on_end)
          arguments: (arguments . (string (string_fragment) @end) .
            (arrow_function body: (statement_block (try_statement body: (statement_block (expression_statement (call_expression
          function: (member_expression property: (property_identifier) @run)
          arguments: (arguments . (identifier) @used))))))))))
        (#eq? @stream @same)
        (#eq? @on_data "on")
        (#eq? @on_end "on")
        (#eq? @data "data")
        (#eq? @end "end")
        (#eq? @chunk @incoming)
        (#eq? @buffer @used)
        (#match? @run "^runIn(Context|NewContext|ThisContext)$"))
