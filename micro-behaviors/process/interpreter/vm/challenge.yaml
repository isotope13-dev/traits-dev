# Remote challenge-VM program contexts. Anti-abuse clients receive a
# challenge config that names the interpreter VM to load and the program to
# interpret; `bgChallenge` is YouTube's BotGuard config field for exactly
# that. A reference identifies the challenge-VM context; it proves neither
# execution nor benign intent.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, html]
  crit: notable
  conf: 0.9

traits:
  - id: bg-challenge-config-reference
    desc: YouTube BotGuard challenge config reference
    if:
      type: text
      substr: bgChallenge
