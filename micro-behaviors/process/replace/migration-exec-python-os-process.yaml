# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  crit: notable
  conf: 0.85
traits:
  - id: python-os-exec-call
    desc: Python calls an os.exec process replacement API
    if:
      type: symbol
      kind: call
      regex: ^os\.exec[lv](e|p|pe)?$
  - id: python-os-execve-call
    desc: Python os.execve process replacement
    conf: 0.92
    platforms:
    - unix
    - android
    - ios
    attack: T1106
    if:
      type: symbol
      kind: call
      exact: os.execve
  - id: python-os-execvp-call
    desc: Python calls os.execvp
    if:
      type: symbol
      kind: call
      exact: os.execvp
  - id: python-windows-os-execve-call
    desc: Python calls os.execve on Windows
    platforms:
    - windows
    if:
      type: tree-sitter
      language: python
      query: "(call function: (attribute object: (identifier) @module attribute: (identifier) @method)\n  (#eq? @module\
        \ \"os\")\n  (#eq? @method \"execve\")) @call\n"
