# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  crit: notable
  platforms:
  - linux
  - macos
traits:
- id: c-exec-family-source
  desc: exec family call in C source
  crit: notable
  conf: 0.85
  for:
  - c
  - cpp
  if:
    type: symbol
    kind: call
    regex: ^exec(l[ep]?|v[ep]?|vpe)$
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
