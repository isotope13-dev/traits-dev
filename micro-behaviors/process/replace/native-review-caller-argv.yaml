defaults:
  platforms: [unix]
  for: [c, cpp]

traits:
  - id: shell-c-caller-argv-reference
    desc: Replaces process with shell and caller argv
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @exec
          arguments: (argument_list
            . (string_literal) @shell
            (string_literal) @flag
            . (subscript_expression argument: (identifier) @argv))) @call
          (#match? @exec "^execlp?$")
          (#match? @shell "^\"/bin/(ba|da)?sh\"$")
          (#eq? @flag "\"-c\"")
          (#eq? @argv "argv"))

