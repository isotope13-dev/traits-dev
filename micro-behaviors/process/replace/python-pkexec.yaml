# Execve target and argument shape, independent of library receiver spelling.
defaults:
  for: [python]
  platforms: [linux]
  crit: notable

traits:
  - id: python-execve-pkexec
    desc: Python execve invokes pkexec
    if:
      type: symbol
      kind: call
      regex: '(^|\.)execve$'
      arg:
        index: 0
        regex: '^(/usr/bin/)?pkexec$'

composite_rules:
  - id: python-pkexec-null-argv
    desc: Python pkexec invocation uses null argv syntax
    near_lines: 1
    all:
      - id: python-execve-pkexec
      - id: micro-behaviors/process/replace::python-execve-null-argv
