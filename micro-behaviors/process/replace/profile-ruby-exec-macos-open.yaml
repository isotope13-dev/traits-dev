defaults:
  crit: notable
  for:
    - python
    - shell
    - macho
  platforms:
    - macos
traits:
  - id: ruby-exec-open-command
    desc: Ruby exec invokes macOS open
    conf: 0.95
    for: [ruby]
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        kind: string
        regex: '^open\s+'
