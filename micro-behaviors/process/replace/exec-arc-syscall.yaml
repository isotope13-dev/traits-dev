# Linux ARC (ARCompact) execve wrapper in statically linked ELF files. See
# process/terminate/signal/arc-syscall.yaml for the `mov r8, <nr>; trap0` form.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99

traits:
  - id: arc-execve-syscall
    desc: ARC Linux execve syscall wrapper
    if:
      type: hex
      section: .text
      # mov r8, 221 (SYS_execve); trap0.
      pattern: "8A 20 43 17 6F 22 3F 00"
