# `exec "$@"` as the last word of a wrapper script: the script replaces itself
# with whatever command it was given. This is the standard container
# ENTRYPOINT shape, so the matcher alone is ordinary; it matters only as the
# point after which anything the wrapper started earlier keeps running
# unseen beside the expected CMD.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.9
  attack: T1059.004

traits:
  - id: shell-exec-argument-passthrough
    desc: Shell wrapper execs its own arguments
    if:
      type: text
      regex: '(?m)^\s*exec\s+"\$(@|\{@\})"\s*$'
