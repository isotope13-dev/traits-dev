defaults:
  platforms: [unix, windows]
  for: [ruby]
composite_rules:
  - id: extconf-process-replacement
    desc: Extension build script uses Ruby exec
    crit: notable
    conf: 1.0
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/process/replace::ruby-exec
