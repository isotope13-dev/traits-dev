defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: T1059.004

traits:
  - id: c-exec-posix-shell-call
    desc: C exec call replaces process with shell
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @callee
          arguments: (argument_list . (string_literal) @path))
          (#match? @callee "^(execl[ep]?|execve)$")
          (#match? @path "^\"/bin/(ba)?sh\"$"))
