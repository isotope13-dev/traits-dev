# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  platforms:
  - linux
  for:
  - elf
  conf: 0.9
traits:
- arch:
  - arm
  id: arm-eabi-execveat-empty-path-syscall
  desc: ARM execveat with AT_EMPTY_PATH
  crit: notable
  conf: 0.96
  if:
    type: hex
    section: .text
    # Thumb-2 call setup: syscall 387 (execveat), argv/envp from saved
    # process arguments, and flags=AT_EMPTY_PATH in the fifth syscall slot.
    pattern: '4F F4 80 53 31 46 01 93 7A 44 19 EE 10 3A CD ED 00 8A 40 F2 83 10 ?? F? ?? E?'
- id: execveat-empty-path-syscall
  desc: Executes a program by fd (fexecve)
  crit: notable
  if:
    type: syscall
    name:
    - execveat
    arch:
    - x86_64
    - aarch64
    args:
    - index: 4
      mask: 4096
