# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  for:
  - elf
traits:
- platforms:
  - unix
  id: syscall-execve-elf
  desc: ELF contains an execve-family syscall
  crit: notable
  conf: 0.8
  if:
    type: syscall
    name:
    - execve
    - execveat
- platforms:
  - linux
  arch:
  - x86
  - x86-64
  id: x86-execve-syscall-sequence
  desc: x86 execve syscall or trampoline sequence
  crit: notable
  conf: 0.9
  if:
    type: hex
    section: text
    pattern: (B8 3B 00 00 00 0F 05 | 53 B8 0B 00 00 00 8B 4C 24 0C 8B 54 24 10 8B 5C 24 08 65 FF 15 10 00 00 00
      | 8B 4C 24 ?? 8B 54 24 ?? 53 89 FB B8 0B 00 00 00 CD 80 5B 3D 00 F0 FF FF)
