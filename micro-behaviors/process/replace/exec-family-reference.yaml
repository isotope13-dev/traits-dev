# Relocated without changing matching: these APIs alone do not establish a
# privileged target. Escalation consumers must require their own target evidence.
defaults:
  platforms: [linux]
  for: [c, cpp, python]
composite_rules:
  - id: exec-family-source-reference
    desc: Source references exec process replacement APIs
    crit: notable
    conf: 0.92
    any:
      - id: metadata/binary/symbols/name/process::execve-import
      - id: micro-behaviors/process/replace::c-exec-family-source
      - id: metadata/binary/symbols/name/process::execve-fn
      - id: micro-behaviors/process/replace::python-os-execv-call
    unless:
      - id: well-known/lib/development/sanitizer-runtime::sanitizer-runtime-source-path
