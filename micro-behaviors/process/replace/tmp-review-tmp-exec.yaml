defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.8
traits:
  - id: executes-tmp-file-exec
    desc: Shell execs /tmp path directly
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(^|[\s;&])exec\s+\/tmp\/[A-Za-z0-9._-]+(\s|$)'
    not:
      # The executed path itself being a data or source file is not execution
      # evidence (formerly the tmp-rust-text-file-context exclusion atom).
      - regex: '/tmp/[A-Za-z0-9._-]+\.(rs|txt)\b'
