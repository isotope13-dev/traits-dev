defaults:
  attack: T1059
  for:
    - scripts
  platforms:
    - unix
traits:
  - id: c-exec-interactive-shell
    desc: C replaces process with interactive shell
    crit: notable
    conf: 0.97
    for: [c, cpp]
    if:
      type: text
      regex: '\bexecl\w*\s*\(\s*"/bin/(ba)?sh"[^;\n]{0,120}"-i"'
