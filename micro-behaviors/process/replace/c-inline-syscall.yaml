defaults:
  platforms: [linux]
  for: [c, cpp]

traits:
  - id: c-inline-asm-syscall-instruction
    desc: Inline assembly invokes raw syscall
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(__asm__|asm)\b[^\r\n;]{0,80}"(syscall|svc\s+#?0|int\s+\$?0x80)"'
      exclude_comments: true
  - id: c-linux-execve-syscall-number
    desc: Linux execve syscall constant or number
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\b(59|221|__NR_execve|SYS_execve)\b'
      exclude_comments: true

composite_rules:
  - id: c-inline-asm-execve-shell
    desc: Inline syscall assembly runs Unix shell
    crit: suspicious
    conf: 0.96
    near_bytes: 1024
    all:
      - id: c-inline-asm-syscall-instruction
      - id: c-linux-execve-syscall-number
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
