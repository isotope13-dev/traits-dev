defaults:
  platforms: [linux]
  for: [c, cpp]

traits:
  - id: c-inline-asm-syscall-instruction
    desc: Inline assembly invokes raw syscall
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(__asm__|asm)\b[^\r\n;]{0,80}"(syscall|svc\s+#?0|int\s+\$?0x80)"'
      exclude_comments: true
  - id: c-linux-execve-syscall-name
    desc: Names Linux __NR_execve syscall constant
    crit: notable
    conf: 0.85
    if:
      type: text
      word: __NR_execve
      exclude_comments: true

  - id: c-linux-execve-syscall-argument
    desc: Passes execve number to syscall
    crit: notable
    if:
      type: symbol
      kind: call
      exact: syscall
      arg: {index: 0, kind: number, value: 59}

  - id: c-linux-execve-syscall-argument-arm
    desc: Passes ARM64 execve number to syscall
    crit: notable
    if:
      type: symbol
      kind: call
      exact: syscall
      arg: {index: 0, kind: number, value: 221}

  # Numbers in tables or array subscripts say nothing about syscalls. Require
  # a syscall-number register or input constraint for inline assembly.
  - id: c-execve-register-input
    desc: Sets an execve syscall register input
    crit: notable
    if:
      type: text
      regex: '("a"\s*\(\s*59\b|\b(rax|eax)\s*=\s*59\b|\bx8\s*=\s*221\b)'
      exclude_comments: true

  - id: c-execve-x86-mov
    desc: Assembly sets x86 execve syscall number
    crit: notable
    if:
      type: text
      regex: '\bmov[qwl]?\s+\$?(59|0x3b),\s*%{0,2}(rax|eax)\b'
      exclude_comments: true

  - id: c-execve-arm64-mov
    desc: Assembly sets ARM64 execve syscall number
    crit: notable
    if:
      type: text
      regex: '\bmov\s+x8,\s*#?(221|0xdd)\b'
      exclude_comments: true

composite_rules:
  - id: c-linux-execve-syscall-number
    desc: Linux execve syscall constant or register input
    crit: notable
    conf: 0.9
    any:
      - id: c-linux-execve-syscall-name
      - id: metadata/lang/source/naming/declaration::sys-execve-source-constant
      - id: c-linux-execve-syscall-argument
      - id: c-linux-execve-syscall-argument-arm
      - id: c-execve-register-input
      - id: c-execve-x86-mov
      - id: c-execve-arm64-mov

  - id: c-inline-asm-execve-shell
    desc: Inline syscall assembly runs Unix shell
    crit: suspicious
    conf: 0.96
    near_bytes: 1024
    all:
      - id: c-inline-asm-syscall-instruction
      - id: c-linux-execve-syscall-number
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
