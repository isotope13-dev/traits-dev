# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - ruby
traits:
- id: ruby-exec
  desc: exec() replaces current process
  conf: 0.95
  if:
    type: tree-sitter
    query: "(call !receiver method: (identifier) @method\n  (#eq? @method \"exec\"))\n(call receiver: (constant)\
      \ @receiver method: (identifier) @method\n  (#match? @receiver \"^(Kernel|Process)$\")\n  (#eq? @method \"\
      exec\"))\n"
  not:
  - regex: \bexec\s*[\(\s]["']?\s*(BEGIN|COMMIT|ROLLBACK)\b
  - regex: \bexec\s*[\(\s]["']?\s*(SELECT|INSERT|UPDATE|DELETE)\b
  - regex: \bexec\s*[\(\s]["']?\s*(CREATE|DROP|ALTER|TRUNCATE)\b
  - regex: \bexec\s*[\(\s]["']?\s*(SHOW|SET|WITH|COPY)\b
  - regex: \bexec\s*\(\s*sql\b
