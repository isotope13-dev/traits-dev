# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - ruby
traits:
- id: ruby-exec
  unless:
  - id: metadata/lang/source/syntax/markup/markdown::fires-quiet-lesson-table
  desc: exec() replaces current process
  conf: 0.95
  if:
    type: tree-sitter
    # A database adapter's exec("SELECT ...") or exec(sql) runs SQL, not a
    # process: judge the first argument.
    query: |
      (call !receiver method: (identifier) @method
        arguments: (argument_list . (_) @arg)
        (#eq? @method "exec")
        (#not-match? @arg "^(sql\\b|[\"']?\\s*(BEGIN|COMMIT|ROLLBACK|SELECT|INSERT|UPDATE|DELETE|CREATE|DROP|ALTER|TRUNCATE|SHOW|SET|WITH|COPY)\\b)"))
      (call receiver: (constant) @receiver method: (identifier) @method
        arguments: (argument_list . (_) @arg)
        (#match? @receiver "^(Kernel|Process)$")
        (#eq? @method "exec")
        (#not-match? @arg "^(sql\\b|[\"']?\\s*(BEGIN|COMMIT|ROLLBACK|SELECT|INSERT|UPDATE|DELETE|CREATE|DROP|ALTER|TRUNCATE|SHOW|SET|WITH|COPY)\\b)"))
