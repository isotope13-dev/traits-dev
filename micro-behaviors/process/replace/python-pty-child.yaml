defaults:
  platforms: [unix]
  for: [python]
  crit: notable
  conf: 0.96

traits:
  - id: python-exec-in-pty-child
    desc: Python replaces the PTY child process
    # Match the child branch on the PID returned by pty.fork(). A nearby
    # exec call in the parent would not inherit the child's terminal.
    if:
      type: tree-sitter
      language: python
      query: |
        ((block
          (expression_statement (assignment
            left: [(pattern_list . (identifier) @pid . (identifier) .)
                   (tuple_pattern . (identifier) @pid . (identifier) .)]
            right: (call function: (attribute
              object: (identifier) @pty attribute: (identifier) @fork)
              arguments: (argument_list) @fork_args)))
          . (if_statement
            condition: (comparison_operator . (identifier) @child
              operators: "==" (integer) @status .)
            consequence: (block
              [(expression_statement (call function: (attribute
                  object: (identifier) @os attribute: (identifier) @exec)))
               (try_statement body: (block (expression_statement (call function: (attribute
                  object: (identifier) @os attribute: (identifier) @exec)))))])) @branch)
          (#eq? @pty "pty")
          (#eq? @fork "fork")
          (#match? @fork_args "^\\(\\s*\\)$")
          (#eq? @pid @child)
          (#eq? @status "0")
          (#eq? @os "os")
          (#match? @exec "^exec[lv]p?e?$"))
