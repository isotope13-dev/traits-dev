defaults:
  for: [python]
  platforms: [unix]

traits:
  # Python's resource module exposes the same process-limit operation as the
  # native rule, but Python files are intentionally outside that rule's scope.
  # Notable rather than baseline: unlike a libc-linked ELF, where the symbol
  # is ambient, an explicit `resource.setrlimit(...)` in Python source is a
  # deliberate confinement step worth seeing in a version diff — a supervisor
  # capping a child, or malware setting RLIMIT_CORE to 0 to suppress the core
  # dump that would otherwise preserve its memory image.
  - id: python-setrlimit
    desc: Python sets process resource limits
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      regex: '(?s)\bresource\.setrlimit\s*\('
