defaults:
  for: [python]
  platforms: [unix]

traits:
  # Python's resource module exposes the same process-limit operation as the
  # native rule, but Python files are intentionally outside that rule's scope.
  - id: python-setrlimit
    desc: Python sets process resource limits
    crit: baseline
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      regex: '(?s)\bresource\.setrlimit\s*\('
