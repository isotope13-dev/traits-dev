defaults:
  platforms: [unix, android]
  for: [shell]
  crit: notable
traits:
  - id: shell-android-idle-whitelist-add
    desc: Exempts an Android package from idle limits
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: dumpsys
      args:
        - index: 0
          kind: identifier
          name: deviceidle
        - index: 1
          kind: identifier
          name: whitelist
        - index: 2
          kind: identifier
          name_regex: '^\+[A-Za-z][A-Za-z0-9_.]+$'
