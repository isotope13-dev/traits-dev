defaults:
  platforms: [android]
composite_rules:
  - id: android-adb-doze-exemption
    desc: ADB shell requests a Doze exemption
    crit: notable
    conf: 0.96
    for: [java, kotlin, apk, zip, dex]
    all:
      - id: micro-behaviors/process/resources/limits::adb-shell-doze-whitelist-add
      - id: micro-behaviors/communications/socket/tcp::android-adb-shell-command-service-request
