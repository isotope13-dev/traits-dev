# ScriptTimeout is a server request resource limit, not a webshell by itself.
defaults:
  platforms: [windows]
  for: [vbs, html, elixir, asp]
  crit: notable

traits:
  - id: asp-script-timeout-assignment
    desc: Classic ASP assigns a numeric script timeout
    conf: 0.95
    for: [vbs, asp]
    if:
      type: text
      regex: '(?im)^[\t ]*Server\.ScriptTimeout[\t ]*=[\t ]*[0-9]+\b'

  # Retain the existing large-value observation and carrier scope for its
  # consumers. The value alone supplies no attacker intent.
  - id: asp-script-timeout-large
    desc: Classic ASP timeout assignment exceeds 9999s
    conf: 0.9
    if:
      type: text
      regex: '(?i)Server\.ScriptTimeout\s*=\s*[1-9][0-9]{4,}'
