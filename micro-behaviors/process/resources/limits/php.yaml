# PHP's per-request max_execution_time cap. Neutral on its own — bulk
# exporters, importers, and image processors all raise or clear it — but
# webshell composites in objectives/ reference it because a long-running
# request is what a file manager or brute-forcer needs.
defaults:
  platforms: [windows, unix]
  for: [php]

traits:
  - id: set-time-limit
    desc: Sets the PHP script execution time limit
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '@?set_time_limit\s*\('
    unless:
      - id: metadata/library/generated::php-manual-empty-function-stubs
