# Windows process-handle rights used while attaching to a live browser.
#
# 0x143a is the Granted Access mask called out for browser-targeted CDP
# enablement. The call-shape matcher keeps the fact tied to OpenProcess and
# to the source-written hexadecimal value instead of matching a bare number.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, go, python]
  attack: T1055

traits:
  - id: open-process-cdp-access-mask
    desc: OpenProcess CDP access mask 0x143a
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)OpenProcess$'
      arg:
        kind: number
        value: 5178
        radix: 16

  - id: open-process
    desc: Open process handle
    crit: notable
    conf: 0.95
    attack: "T1106"
    for: [pe, dll, c, cpp, rust, csharp]
    if:
      type: symbol
      exact: "OpenProcess"
    unless:
      - id: well-known/game/mod::bedrockboot-preload-injector-pdb
  - id: open-process-script
    desc: OpenProcess API reference in script
    crit: notable
    conf: 0.92
    attack: T1106
    for: [powershell, batch, vbs, javascript, python]
    if:
      type: text
      word: OpenProcess
