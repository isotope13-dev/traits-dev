defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]

composite_rules:
- id: vb6-process-attach-enumeration-apis
  desc: VB6 process attach and enumeration APIs
  conf: 0.88
  all:
  - id: metadata/lang/runtime::vb6-application-framework
  - id: micro-behaviors/process/attach/rights::open-process
  any:
  - id: micro-behaviors/process/enumerate/psapi::enum-processes
  - id: micro-behaviors/process/enumerate/snapshot::process32-first
  - id: micro-behaviors/process/enumerate/snapshot::process32-next
