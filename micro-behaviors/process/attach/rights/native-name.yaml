defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: open-process-binary-name
    desc: OpenProcess API name in binary strings
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: OpenProcess
    unless:
      - id: open-process
      # Go's runtime carries this API name even in a do-nothing program.
      - id: metadata/lang/compiler/systems::go-binary-comp
