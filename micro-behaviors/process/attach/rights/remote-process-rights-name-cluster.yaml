defaults:
  platforms: [windows]
  for: [pe]
  size_max: 524288

composite_rules:
  - id: remote-process-rights-name-cluster
    desc: Remote process-right name cluster
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/process/attach/rights::required-process-rights
    needs: 2
    any:
      - id: micro-behaviors/process/attach/rights::process-vm-operation-right-name
      - id: micro-behaviors/process/attach/rights::process-vm-write-right-name
      - id: micro-behaviors/process/attach/rights::process-create-thread-right-name
