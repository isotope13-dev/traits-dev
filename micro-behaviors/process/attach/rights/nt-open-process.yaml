defaults:
  platforms:
  - windows
  attack: T1106
traits:
- for:
  - pe
  - dll
  id: nt-open-process-name
  desc: NtOpenProcess API name reference
  crit: notable
  conf: 0.7
  if:
    type: text
    exact: NtOpenProcess
  downgrade:
    any:
    - id: metadata/vendor/identity::microsoft-corp-versioninfo
- for:
  - csharp
  id: csharp-nt-open-process-name
  desc: C# NtOpenProcess name
  crit: notable
  conf: 0.9
  if:
    type: text
    word: NtOpenProcess
- for:
  - c
  - cpp
  - rust
  - go
  - python
  - powershell
  id: nt-open-process-source
  desc: References NtOpenProcess native handle API
  crit: notable
  conf: 0.9
  if:
    type: text
    exclude_comments: true
    word: NtOpenProcess
composite_rules:
- id: process-handle-open-any
  for:
  - binaries
  - scripts
  - source
  desc: Opens or references Windows process-handle acquisition API
  crit: component
  conf: 0.9
  any:
  - id: nt-open-process-name
  - id: csharp-nt-open-process-name
  - id: nt-open-process-source
  - id: micro-behaviors/process/attach/rights::open-process
  - id: micro-behaviors/process/attach/rights::open-process-script
