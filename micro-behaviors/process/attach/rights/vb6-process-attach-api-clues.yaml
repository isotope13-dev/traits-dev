defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll]

composite_rules:
- id: vb6-process-attach-api-clues
  desc: VB6 process attach and control API clues
  conf: 0.92
  all:
  - id: metadata/lang/runtime::vb6-application-framework
  - id: micro-behaviors/process/attach/rights::open-process
  any:
  - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  - id: metadata/binary/symbols/name/process::create-process-a
  - id: micro-behaviors/process/terminate/kill::terminate-process
  downgrade:
    any:
    - id: metadata/binary/resource/identity::pe-version-resource
