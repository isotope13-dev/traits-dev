defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, python]
traits:
  - id: open-process-python-source
    desc: Python OpenProcess remote handle
    crit: notable
    conf: 0.92
    attack: T1106
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)OpenProcess$'
composite_rules:
  - id: source-open-process
    desc: Source references the OpenProcess API
    crit: component
    conf: 0.92
    any:
      - id: micro-behaviors/process/create/spawn::open-process
      - id: open-process-python-source
