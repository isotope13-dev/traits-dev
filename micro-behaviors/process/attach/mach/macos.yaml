defaults:
  platforms: [macos, ios]
  for: [macho]
  crit: notable
  conf: 0.98
  attack: T1055

traits:
  # `symbol` rather than `import` so the C sources that carry this call are
  # covered too — the Mach rules that consume it are declared `for: [macho, c]`.
  - id: task-for-pid
    desc: Obtains another process Mach task
    for: [macho, c]
    if:
      type: symbol
      exact: task_for_pid

  - id: task-memory-write
    desc: Writes another Mach task memory
    if:
      type: import
      exact: mach_vm_write
