# The HotSpot dynamic-attach handshake spelled out by hand instead of being
# reached through the JDK's Attach API: create /tmp/.attach_pid<pid>, signal
# the target JVM, then speak the NUL-delimited command protocol over the
# /tmp/.java_pid<pid> UNIX socket the JVM answers with. Profilers, APM agents
# and the JDK's own tooling normally go through com.sun.tools.attach; code that
# reimplements the wire format is usually doing so to load an agent from a
# language that has no JDK available to it.
#
# These traits carry the protocol artifacts only. Intent composites live in
# objectives/evasion/hijack-execution-flow/loader.
defaults:
  platforms: [unix]
  for: [python, shell, javascript, java, go, ruby, perl, elf]
  crit: notable
  conf: 0.9
  attack: T1055
  size_max: 536870912

traits:
  - id: hotspot-attach-trigger-path
    desc: HotSpot attach trigger file path
    conf: 0.92
    if:
      type: text
      regex: '\.attach_pid'

  - id: hotspot-attach-listener-socket-path
    desc: HotSpot attach listener socket path
    conf: 0.92
    if:
      type: text
      regex: '\.java_pid'

  - id: hotspot-attach-load-agent-args
    desc: HotSpot attach load-agent argument list
    conf: 0.93
    if:
      type: text
      regex: '["'']load["''][,\s]{1,4}["'']instrument["'']'

  - id: hotspot-attach-load-agent-nul-args
    desc: HotSpot attach load-agent NUL command
    conf: 0.95
    if:
      type: text
      regex: 'load\\x00instrument'

composite_rules:
  - id: hotspot-attach-load-agent-command
    desc: HotSpot attach load-agent command
    crit: notable
    conf: 0.94
    any:
      - id: hotspot-attach-load-agent-args
      - id: hotspot-attach-load-agent-nul-args

  - id: hotspot-attach-handshake-path
    desc: HotSpot attach handshake file path
    crit: notable
    conf: 0.92
    any:
      - id: hotspot-attach-trigger-path
      - id: hotspot-attach-listener-socket-path
