# A process-memory write can implement debugging or patching. Neither the
# address-space path nor STOP/CONT establishes injected code or concealment.
defaults:
  platforms: [unix]
  for: [javascript, typescript]
composite_rules:
  - id: node-procfs-ptrace-write-profile
    desc: Procfs path with ptrace write call
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/proc/memory::aix-proc-address-space-template
      - id: ptrace-instruction-write-call
    any:
      - id: micro-behaviors/process/control/signal::node-stop-cont-command-templates
      - id: metadata/lang/source/syntax/assignment::inject-cmd-assignment-text
      - id: bsd-ptrace-attach-call
    needs: 1
