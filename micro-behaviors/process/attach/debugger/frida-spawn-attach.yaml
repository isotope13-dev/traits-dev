# Frida attaches to a process that the same script created suspended and then
# resumes. Frida's own spawn helper does this internally, so the three legs
# are only a capability clue until a script also ships the spawn and attach
# calls itself.
defaults:
  for: [python]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: python-frida-attach-call
    desc: Python script calls frida.attach on a PID
    if:
      type: text
      regex: 'frida\.attach\s{0,8}\('

  - id: python-createprocess-wide-text
    desc: Python source names the CreateProcessW API
    if:
      type: text
      substr: CreateProcessW

  - id: python-resume-thread-text
    desc: Python source names the ResumeThread API
    if:
      type: text
      substr: ResumeThread

composite_rules:
  - id: frida-attach-suspended-launch-resume
    desc: Script attaches Frida to a process it created suspended
    crit: suspicious
    conf: 0.85
    scope: file
    all:
      - id: python-frida-attach-call
      - id: python-createprocess-wide-text
      - id: python-resume-thread-text
