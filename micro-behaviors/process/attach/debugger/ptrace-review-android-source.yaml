defaults:
  platforms: [android, unix, ios]
  for: [c, cpp]

composite_rules:
  - id: android-init-attach-and-pid-one-call
    desc: Android ptrace attach and PID one call
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/attach/debugger::ptrace-attach-call
    any:
      - id: micro-behaviors/process/debug/control::ptrace-pid-one-call
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/file/format/markup::roff-document
