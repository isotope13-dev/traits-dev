defaults:
  platforms: [unix]
  for: [c, cpp, python, javascript, go, rust, elf]

composite_rules:
  # Debuggers and conformance tests use this sequence without injecting code.
  - id: ptrace-seize-interrupt-register-read
    desc: ptrace seize, interrupt and register-read calls coexist
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/process/attach/debugger::ptrace-seize-call
      - id: micro-behaviors/process/attach/debugger::ptrace-interrupt-call
      - id: micro-behaviors/process/attach/debugger::ptrace-getregset-call
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/file/profile/source-indications/
      - id: micro-behaviors/process/debug/tool-markers::org-gnu-gdb-marker
      - id: micro-behaviors/process/debug/tool-markers::gdb-debugger-text-marker
      - id: metadata/package/testing/compiled::c-test-framework-marker
      - id: ptrace-syscall-supervisor-context

  # A seccomp-free sandbox supervisor seizes its own child tree, halts it, and
  # reads registers at each syscall entry to decide whether the call may run.
  # Pairing the syscall-stop resume with syscall-info decoding is strace-style
  # monitoring, not a staged memory patch.
  - id: ptrace-syscall-supervisor-context
    desc: ptrace syscall-entry supervisor context
    crit: exception
    conf: 0.95
    for: [c, cpp, rust, go, elf]
    all:
      - id: micro-behaviors/process/attach/debugger::ptrace-syscall-resume-call
      - id: micro-behaviors/process/attach/debugger::ptrace-get-syscall-info-call
