defaults:
  crit: notable
  platforms: [linux, android]
  for: [c, cpp, rust, go, elf]
  attack: T1055.008

# Syscall-entry tracing: strace-style supervisors resume the tracee with
# PTRACE_SYSCALL and decode each stop with PTRACE_GET_SYSCALL_INFO. Process
# injection stages memory writes and register changes instead, so the pair
# separates a syscall monitor from a seize-and-patch chain.
traits:
  - id: ptrace-syscall-resume-call
    desc: Calls ptrace to resume to syscall stop
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*(ptrace|[^/#*\s][^\n]{0,120}ptrace)\s*\(\s*PTRACE_SYSCALL\b'

  - id: ptrace-get-syscall-info-call
    desc: Calls ptrace to decode a syscall stop
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*(ptrace|[^/#*\s][^\n]{0,120}ptrace)\s*\(\s*PTRACE_GET_SYSCALL_INFO\b'
