defaults:
  platforms: [linux]
  for: [c, cpp, elf]
  crit: notable
  conf: 0.9
traits:
  - id: ptrace-getregset-prstatus-reference
    desc: ptrace register-read request with PRSTATUS text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'PTRACE_GETREGSET.{0,80}NT_PRSTATUS'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/binary/linking/runtime/
  - id: ptrace-setregset-prstatus-reference
    desc: ptrace register-write request with PRSTATUS text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'PTRACE_SETREGSET.{0,80}NT_PRSTATUS'
    unless:
      - id: well-known/lib/platform/wine::wine-source-tree
      - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
      - id: well-known/tool/reverse-engineering/radare2::radare2-go-module-source-path
      - id: metadata/file/naming::rizin-source-tree-path
      - id: well-known/app/utility/sudo::source-tree
      - id: well-known/lib/platform/gvisor::gvisor-source-tree
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-spdx-source-context
  - id: ptrace-poketext-reference
    desc: References the PTRACE_POKETEXT request constant
    crit: notable
    conf: 0.85
    for: [elf]
    if:
      type: text
      # Exclude regex-source forms such as `ptrace.*PTRACE_POKETEXT` stored in
      # defensive signature catalogs while retaining the standalone constant.
      regex: '(^|[^A-Za-z0-9_.*])PTRACE_POKETEXT\b'
    # legitimate debuggers (gdb/lldb) embed the constant in diagnostic
    # strings; exclude on their distinctive internal identity markers
    unless:
      - id: micro-behaviors/process/debug/tool-markers::org-gnu-gdb-marker
      - id: micro-behaviors/process/debug/tool-markers::gdb-banner-text
      - id: micro-behaviors/process/debug/tool-markers::lldb-debugserver-path-env
      - id: metadata/file/format/markup::roff-document
      # Same name-table carve-out as the ptrace-attach sibling above.
      - id: metadata/file/string/artifact::ptrace-constant-name-table
      # Go's runtime carries the whole PTRACE_* constant table in its string
      # data, so every Go binary matches this text regardless of what it calls:
      # traefik in three k3s airgap images, and the Go toolchain's own `vet`
      # and `fix`. The language already has a precise detector that keys on the
      # call rather than the constant --
      # `micro-behaviors/process/attach/debugger::go-ptrace-attach`
      # (`type: symbol`, `syscall.PtraceAttach`) -- so nothing is lost here.
      - id: metadata/lang/runtime::go-runtime-marker
      # Same argument as the gdb/lldb carve-outs above, reaching the case they
      # miss: GCC's and LLVM's sanitizer runtimes are debuggers. LeakSanitizer
      # stops threads and reads their memory through ptrace, so libasan and
      # liblsan both call these and embed the constants. The official
      # gcc:bookworm image scored libasan.so.8 and liblsan.so.0 suspicious
      # twice each on this.
      # The directory, not the `sanitizer-runtime-library` composite: that
      # composite requires the runtime banner in its `all:`, which libubsan
      # does not carry, so naming it cleared libasan and liblsan and left
      # libubsan scoring twice. Every trait under this directory identifies a
      # GCC/LLVM sanitizer runtime, so the directory reference is the same
      # acquittal applied consistently across the family.
      - id: well-known/lib/development/sanitizer-runtime/
      # The go-runtime-marker carve-out above reasons that Go's PTRACE_*
      # constant table is data, not a call. gccgo's `.gox` export data is the
      # same table with even less around it, and carries no runtime marker.
      - id: metadata/lang/compiler/generated::gccgo-export-data
