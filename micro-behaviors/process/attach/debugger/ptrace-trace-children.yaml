# Tracing a child process's fork, vfork and exec events through ptrace — the
# strace/GDB follow-mode option set, and how sandbox observers follow a
# workload's process tree. Observation of processes the tool itself launched;
# hiding claims belong to the objectives that add the intent.
defaults:
  platforms: [linux]
  for: [c, cpp, elf]
  crit: notable
  conf: 0.92

traits:
  - id: fork-exec-trace-options
    desc: ptrace traces fork and exec
    if:
      type: text
      regex: 'PTRACE_O_TRACEFORK.{0,160}PTRACE_O_TRACEEXEC'
    unless:
      - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
      - id: metadata/file/naming::rizin-source-tree-path
