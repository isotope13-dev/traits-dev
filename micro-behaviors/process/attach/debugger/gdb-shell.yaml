defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: gdb-pid-attach
    desc: GDB attaches to a process ID
    if:
      type: symbol
      kind: call
      regex: '^(/usr/bin/|/bin/)?gdb$'
      arg:
        kind: identifier
        name_regex: '^(-pid|--pid|-p)(=|$)'
  - id: gdb-command-file
    desc: GDB reads a command script file
    if:
      type: symbol
      kind: call
      regex: '^(/usr/bin/|/bin/)?gdb$'
      arg:
        kind: identifier
        name_regex: '^(--command|-x)(=|$)'
