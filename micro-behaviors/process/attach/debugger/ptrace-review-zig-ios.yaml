defaults:
  platforms: [ios, unix]
  for: [zig]

traits:
  - id: zig-ptrace-attach-pid1
    desc: Zig ptrace attach to PID one
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'ptrace\(c\.PTRACE_ATTACH,\s*1'

composite_rules:
  - id: zig-ptrace-pid1-and-name
    desc: Zig PID one attach and identifier
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/attach/debugger::zig-ptrace-attach-pid1
      - id: metadata/lang/source/naming/action/process::zig-ptrace-attach-name
