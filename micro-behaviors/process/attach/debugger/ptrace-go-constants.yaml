defaults:
  platforms: [panos, appliance, unix]
  for: [go, elf, c]

traits:
  - id: go-ptrace-attach-constants
    desc: Go ptrace syscall and attach constants
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: text
      regex: 'syscall\.SYS_PTRACE[^;\n]{0,120}syscall\.PTRACE_ATTACH'

