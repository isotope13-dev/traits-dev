defaults:
  crit: notable
  platforms: [android, unix, ios]
  for: [c, cpp]

traits:
  - id: ptrace-attach-call
    desc: POSIX ptrace process attach
    conf: 0.95
    if:
      type: text
      regex: 'ptrace\s*\(\s*PTRACE_ATTACH'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/file/catalog/identity::linux-ptrace-system-header

  - id: ptrace-attach-constant
    desc: References the PTRACE_ATTACH request constant
    conf: 0.9
    for: [c, cpp, rust, go, elf]
    if:
      type: text
      word: PTRACE_ATTACH
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/file/catalog/identity::linux-ptrace-system-header

  # PTRACE_SEIZE attaches to a running process without the stop semantics of
  # PTRACE_ATTACH; PTRACE_INTERRUPT then halts it. Debuggers, tracers and
  # sanitizers use both. A comment line documents the API instead of calling
  # it, so the call must lead a code line.
  - id: ptrace-seize-call
    desc: Calls ptrace to seize a running process
    conf: 0.9
    platforms: [linux, android]
    for: [c, cpp, python, javascript, go, rust, elf]
    attack: T1055.008
    if:
      type: text
      regex: '(?m)^[ \t]*(ptrace|[^/#*\s][^\n]{0,120}ptrace)\s*\(\s*PTRACE_SEIZE\b'

  - id: ptrace-interrupt-call
    desc: Calls ptrace to halt a seized process
    conf: 0.9
    platforms: [linux, android]
    for: [c, cpp, python, javascript, go, rust, elf]
    attack: T1055.008
    if:
      type: text
      regex: '(?m)^[ \t]*(ptrace|[^/#*\s][^\n]{0,120}ptrace)\s*\(\s*PTRACE_INTERRUPT\b'

  # Register snapshot with any request payload, unlike the NT_PRSTATUS-anchored
  # register-read atom.
  - id: ptrace-getregset-call
    desc: Calls ptrace to read process registers
    conf: 0.9
    platforms: [linux, android]
    for: [c, cpp, python, javascript, go, rust, elf]
    attack: T1055.008
    if:
      type: text
      regex: '(?m)^[ \t]*(ptrace|[^/#*\s][^\n]{0,120}ptrace)\s*\([^;]{0,120}PTRACE_GETREGSET\b'

  - id: ptrace-seize-constant
    desc: References the PTRACE_SEIZE request constant
    conf: 0.9
    for: [c, cpp, rust, go, elf]
    if:
      type: text
      word: PTRACE_SEIZE
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/file/catalog/identity::linux-ptrace-system-header

  - id: bsd-ptrace-attach-call
    desc: BSD ptrace process attach
    conf: 0.9
    for: [c, cpp, javascript, typescript, rust, go]
    if:
      type: text
      regex: 'ptrace\s*\([^;\n]{0,160}\bPT_ATTACH\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  # These request names also appear as declarations in generated platform
  # bindings. Keep references notable; action traits require a ptrace call.
  - id: bsd-ptrace-attach-constant
    desc: References the PT_ATTACH ptrace request constant
    conf: 0.9
    for: [javascript, typescript, c, cpp, rust, go]
    platforms: [unix]
    if:
      type: text
      word: PT_ATTACH

  - id: ptrace-instruction-write-constant
    desc: References PT_WRITE_I ptrace request constant
    conf: 0.9
    for: [javascript, typescript, c, cpp, rust, go]
    platforms: [unix]
    if:
      type: text
      word: PT_WRITE_I

  - id: ptrace-instruction-write-call
    desc: BSD ptrace call writes target instruction memory
    conf: 0.9
    for: [javascript, typescript, c, cpp, rust, go]
    platforms: [unix]
    if:
      type: text
      regex: 'ptrace\s*\([^;\n]{0,160}\bPT_WRITE_I\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: bsd-ptrace-write-call
    desc: BSD ptrace process memory write
    conf: 0.9
    if:
      type: text
      regex: 'ptrace\s*\([^;\n]{0,160}\bPT_WRITE_D\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: go-ptrace-attach
    desc: Go attaches to a traced process
    conf: 0.9
    for: [go, elf]
    platforms: [linux]
    if:
      type: symbol
      exact: syscall.PtraceAttach

  - id: go-ptrace-continue
    desc: Go resumes a traced process
    conf: 0.9
    for: [go, elf]
    platforms: [linux]
    if:
      type: symbol
      exact: syscall.PtraceCont

composite_rules:
  - id: go-ptrace-control
    desc: Go controls a traced process
    conf: 0.9
    for: [go, elf]
    platforms: [linux]
    any:
      - id: go-ptrace-attach
      - id: go-ptrace-continue
  - id: ptrace-attach-request
    desc: References a ptrace debugger-attach request constant
    conf: 0.9
    any:
      - id: ptrace-attach-constant
      - id: ptrace-seize-constant
