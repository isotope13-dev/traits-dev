# Process execution-domain control via the personality(2) syscall.
# personality() sets the process execution domain. Its security-relevant use is
# the ADDR_NO_RANDOMIZE flag, which disables ASLR (exploit / anti-analysis prep).
# filefacts resolves the syscall NUMBER but not its arguments, so this atomic
# can only assert "issues personality directly" — a rare, notable capability.
# The anti-ASLR conclusion needs argument resolution (a follow-up) and belongs
# in an objectives/anti-analysis composite once the flag is visible.
defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: personality-syscall
    desc: Sets execution domain via personality syscall
    crit: notable
    conf: 0.6
    if:
      type: syscall
      name: [personality]
  # personality() called with ADDR_NO_RANDOMIZE — disables ASLR for the process
  # (exploit reliability / anti-analysis). filefacts resolves the flag immediate
  # at the raw syscall site; this is the intent the neutral personality-syscall
  # capability can't express on its own. (aarch64 builds this constant with a
  # shifted movz the resolver doesn't reconstruct yet, so it fires on x86-64.)
  - id: personality-disable-aslr
    desc: personality syscall disables ASLR
    crit: suspicious
    conf: 0.85
    if:
      type: syscall
      name: [personality]
      # persona (arg 0) has ADDR_NO_RANDOMIZE (0x40000) set.
      args: [{ index: 0, mask: 262144 }]
