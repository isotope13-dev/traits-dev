# Process execution-domain control via the personality(2) syscall.
# personality() sets the process execution domain. Its security-relevant use is
# the ADDR_NO_RANDOMIZE flag, which disables ASLR (exploit / anti-analysis prep).
# filefacts resolves the syscall NUMBER but not its arguments, so this atomic
# can only assert "issues personality directly" — a rare, notable capability.
# The anti-ASLR conclusion needs argument resolution (a follow-up) and belongs
# in an objectives/anti-analysis composite once the flag is visible.
defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: personality-syscall
    desc: Sets execution domain via personality syscall
    crit: notable
    conf: 0.6
    if:
      type: syscall
      name: [personality]
