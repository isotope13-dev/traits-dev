defaults:
  platforms: [windows]
  for: [go]
  crit: notable
  conf: 0.97

traits:
  - id: go-resolve-set-priority-class
    desc: Go resolves process-priority control API
    if:
      type: symbol
      kind: call
      regex: '\.NewProc$'
      arg:
        index: 0
        kind: string
        exact: SetPriorityClass
