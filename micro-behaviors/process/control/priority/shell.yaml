defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.95

traits:
  - id: shell-nice-adjustment-call
    desc: Invokes nice with a priority adjustment option
    if:
      type: symbol
      kind: call
      exact: nice
      arg:
        index: 0
        kind: identifier
        name: '-n'
