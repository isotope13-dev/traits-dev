defaults:
  crit: notable
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: set-priority-class
    desc: Set process priority class
    conf: 0.85
    if:
      type: symbol
      exact: "SetPriorityClass"
composite_rules:
  - id: process-or-thread-priority-api
    desc: Process or thread priority API reference
    conf: 0.88
    any:
      - id: set-priority-class
      - id: micro-behaviors/process/thread/priority::set-thread-priority
