defaults:
  platforms: [unix]
  for: [c, cpp, rust, go, python, elf]
traits:
  - id: set-cpu-affinity
    desc: Pins process or thread CPU affinity
    crit: notable
    conf: 0.9
    if:
      type: symbol
      regex: '(^|\.|::)(sched_setaffinity|pthread_setaffinity_np|SchedSetaffinity|cpuset_setaffinity)$'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
