defaults:
  platforms: [linux, android, macos]
  for: [c, cpp, rust, go, elf, shell]

traits:
  - id: process-existence-probe
    desc: Tests whether a process is alive
    crit: notable
    conf: 0.91
    if:
      type: text
      regex: '(?i)\bkill\s*\(\s*[^,;\n]{1,80},\s*0\s*\)|(^|[;&|\s])kill\s+-0\b'
