defaults:
  platforms: [linux, android]
  for: [elf]
  arch: [arm]
  crit: notable
  conf: 0.99
traits:
  - id: arm-eabi-kill-signal-syscall
    desc: ARM EABI kill process-signal syscall wrapper
    if:
      type: hex
      section: .text
      # Preserve r7, select SYS_kill=37, and enter the kernel. The signal
      # argument is supplied by callers, so this alone asserts no termination.
      pattern: "(80 40 2D E9|04 70 2D E5) 25 70 A0 E3 00 00 00 EF"
