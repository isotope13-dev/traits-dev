defaults:
  conf: 0.9
  platforms: [unix, windows]
  for: [python]

traits:
  - id: setproctitle-application-worker-name
    desc: Application setproctitle worker rename
    crit: baseline
    if:
      type: text
      regex: "setproctitle\\.setproctitle\\([f]?[\"'][a-z][a-z0-9_-]{2,}"
  - id: setproctitle-call
    desc: Python changes its process title
    crit: notable
    if:
      type: symbol
      kind: call
      exact: setproctitle.setproctitle
  - id: python-process-title-api
    desc: Python process title API call
    crit: notable
    if:
      type: symbol
      kind: call
      regex: '(^|\.)setproctitle$'
  - id: python-os-kill-call
    desc: Python sends a process signal
    crit: notable
    if:
      type: symbol
      kind: call
      exact: os.kill
  - id: python-signal-handler-registration
    desc: Python registers a signal handler
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: signal.signal
