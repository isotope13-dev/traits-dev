defaults:
  crit: notable
  platforms:
  - unix
  - android
  for:
  - elf
  arch:
  - mips
traits:
- id: mips-o32-kill-syscall-be
  desc: Big-endian MIPS O32 direct kill syscall
  conf: 0.99
  if:
    type: hex
    section: .text
    pattern: 24 02 0F C5 00 00 00 0C
  unless:
  - type: value
    path: elf.machine
    exact: unknown
  - type: value
    path: elf.machine
    exact: s390
  - type: metrics
    field: elf.parse_failed
    min: 1
- id: mips-o32-kill-syscall-le
  desc: Little-endian MIPS O32 direct kill syscall
  conf: 0.99
  if:
    type: hex
    section: .text
    pattern: C5 0F 02 24 0C 00 00 00
  unless:
  - type: value
    path: elf.machine
    exact: s390
  - type: metrics
    field: elf.parse_failed
    min: 1
