defaults:
  platforms: [unix]
  for: [javascript, typescript]
traits:
  - id: js-kill-with-signal-flag
    desc: JS kill command with signal
    crit: notable
    conf: 0.9
    if:
      type: text
      # Require a Node/POSIX command-execution call around the command.  A
      # prose/help string such as `console.error('... kill -9')` is not an
      # invocation.
      regex: '\b(exec|spawn)(Sync)?\s*\([^)]{0,160}\b(kill|pkill|killall)\s+-[0-9A-Z]+\b'
