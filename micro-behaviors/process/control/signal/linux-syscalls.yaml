defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99

traits:
  # SYS_kill selects signal delivery. Its caller supplies the signal and PID;
  # neither process termination nor an external target follows from this pattern.
  - id: aarch64-kill-syscall
    desc: AArch64 kill process-signal syscall sequence
    arch: [aarch64]
    if:
      type: hex
      section: text
      pattern: "28 10 80 (D2|52) [0-48] 01 00 00 D4"

composite_rules:
  - id: iot-linux-kill-syscall
    desc: Direct Linux process-signal syscall wrappers
    any:
      - id: micro-behaviors/process/terminate/signal::powerpc-kill-syscall
      - id: micro-behaviors/process/terminate/signal::superh-kill-syscall
      - id: micro-behaviors/process/terminate/signal::sparc-kill-syscall
      - id: aarch64-kill-syscall
      - id: micro-behaviors/os/syscall/raw::riscv-kill-syscall
      - id: micro-behaviors/process/terminate/signal::i386-kill-syscall
      - id: micro-behaviors/process/terminate/signal::x86-64-kill-syscall
      - id: arm-eabi-kill-signal-syscall
      - id: micro-behaviors/process/terminate/signal::arm-oabi-kill-syscall
      - id: micro-behaviors/process/terminate/signal::m68k-kill-syscall
      - id: micro-behaviors/os/syscall/raw::mips-o32-kill-syscall-le
      - id: micro-behaviors/os/syscall/raw::mips-o32-kill-syscall-be
