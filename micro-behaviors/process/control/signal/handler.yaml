defaults:
  platforms: [linux, macos]
  for: [elf, macho]
  crit: notable
  conf: 0.5

traits:
  - id: sigchild-underscore
    desc: _sigchild child-reaper symbol
    if:
      type: text
      substr: _sigchild

  - id: sigchld-handler-string
    desc: sigchld_handler child-reaper symbol text
    if:
      type: text
      substr: sigchld_handler
    unless:
      - id: micro-behaviors/communications/ssh/connect::openssh
      - id: metadata/file/string/identity::system-shell-basename

  - id: handle-sigchld-string
    desc: Bare handle_sigchld child-reaper symbol text
    if:
      # Whole-token match excludes decorated helpers such as sudo's
      # handle_sigchld_pty, handle_sigchld_nopty, and mon_handle_sigchld.
      type: text
      word: handle_sigchld
    unless:
      - id: well-known/tool/reverse-engineering/rizin::rz-test-usage
      - id: well-known/tool/reverse-engineering/radare2/

composite_rules:
  - id: sigchld-child-reaper-handler
    desc: SIGCHLD child-reaper handler
    any:
      - id: sigchild-underscore
      - id: sigchld-handler-string
      - id: handle-sigchld-string
