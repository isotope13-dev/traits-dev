defaults:
  crit: notable
  platforms: [unix]
  for: [c, cpp, objc]

traits:
  - id: c-kill-sigstop
    desc: C sends SIGSTOP to a process
    conf: 0.85
    if:
      type: text
      regex: 'kill\s*\([^;]{0,120}SIGSTOP'
  - id: c-kill-sigkill
    desc: C sends SIGKILL to a process
    conf: 0.9
    if:
      type: text
      regex: 'kill\s*\([^;]{0,120}SIGKILL'
