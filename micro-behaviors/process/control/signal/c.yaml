defaults:
  crit: notable
  platforms: [unix]
  for: [c, cpp, objc]

traits:
  - id: posix-kill-function-definition
    desc: Defines the POSIX kill function
    conf: 0.9
    if:
      # Require the POSIX ABI, not an Objective-C -(void)kill method.
      type: tree-sitter
      query: |
        ((function_definition
          type: (primitive_type) @return
          declarator: (function_declarator
            declarator: (identifier) @name
            parameters: (parameter_list
              (parameter_declaration type: (type_identifier) @pid)
              (parameter_declaration type: (primitive_type) @signal)))) @definition
        (#eq? @return "int")
        (#eq? @name "kill")
        (#eq? @pid "pid_t")
        (#eq? @signal "int"))

  - id: c-kill-sigstop
    desc: C sends SIGSTOP to a process
    conf: 0.85
    if:
      type: text
      regex: 'kill\s*\([^;]{0,120}SIGSTOP'
  - id: c-kill-sigkill
    desc: C sends SIGKILL to a process
    conf: 0.9
    if:
      type: text
      regex: 'kill\s*\([^;]{0,120}SIGKILL'
