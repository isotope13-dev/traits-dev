defaults:
  platforms: [linux, android, macos]
  for: [elf, macho, so]
traits:
  - id: posix-kill-symbol
    desc: References POSIX process-signal API
    # Preserve the original baseline signal: stock runtimes include this API.
    # Specific signal arguments and attacker targets are separate observations.
    crit: baseline
    conf: 0.6
    if:
      type: symbol
      exact: kill
