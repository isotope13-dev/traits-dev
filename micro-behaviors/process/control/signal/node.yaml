defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-process-kill-call
    desc: Sends or probes a Node process signal
    crit: notable
    conf: 0.95
    # Includes signal 0 (a liveness probe) and forwarding a child's signal
    # to process.pid. The API alone establishes no hostile termination.
    if:
      type: symbol
      kind: call
      exact: process.kill

  - id: node-process-self-signal-call
    desc: Calls process.kill on its own PID
    crit: notable
    conf: 0.98
    if:
      # The argument fact is expression-shaped. Inspect the first argument
      # rather than combining unrelated process.kill and process.pid uses.
      type: tree-sitter
      query: |
        (call_expression
          function: [
            (member_expression
              object: (identifier) @api
              property: (property_identifier) @method)
            (subscript_expression
              object: (identifier) @api
              index: (string (string_fragment) @method))]
          arguments: [
            (arguments . [
              (member_expression
                object: (identifier) @owner
                property: (property_identifier) @pid)
              (subscript_expression
                object: (identifier) @owner
                index: (string (string_fragment) @pid))])
            (arguments . (comment)+ . [
              (member_expression
                object: (identifier) @owner
                property: (property_identifier) @pid)
              (subscript_expression
                object: (identifier) @owner
                index: (string (string_fragment) @pid))])]
          (#eq? @api "process")
          (#eq? @method "kill")
          (#eq? @owner "process")
          (#eq? @pid "pid"))

  - id: node-process-liveness-probe
    desc: Probes process existence with signal zero
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: process.kill
      arg:
        index: 1
        kind: number
        value: 0
