defaults:
  attack: T1489
  platforms:
    - linux
    - macos
  for:
    - shell
    - elf
    - macho
traits:
  - id: pkill-stop
    desc: Stop process with SIGSTOP via pkill
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: pkill\s+-STOP
  - id: pkill-continue
    desc: Resume stopped process with SIGCONT via pkill
    crit: suspicious
    conf: 0.75
    if:
      type: text
      regex: pkill\s+-CONT
  # Resolved direct kill/tgkill syscall instruction (no libc wrapper). Sending
  # a signal to a process or thread is neutral — a static Go runtime uses tgkill
  # for goroutine preemption, so the Go runtime is downgraded; termination
  # intent belongs in a process/terminate composite.
  - id: kill-syscall
    desc: Sends a process/thread signal via direct syscall
    crit: notable
    conf: 0.5
    platforms: [linux]
    for: [elf]
    if:
      type: syscall
      name: [kill, tgkill]
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiler/systems::go-version-string
composite_rules:
  - id: process-suspend-resume
    desc: Process suspension and resumption capability
    crit: suspicious
    conf: 0.9
    all:
      - id: pkill-stop
      - id: pkill-continue
