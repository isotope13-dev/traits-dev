# PHP Process Control Capabilities
# MBC: C0032 (Process Creation), F0004 (Process Name Spoofing)
# ATT&CK: T1036.004 (Masquerade Task or Service)
defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  # === Process Title Masquerading ===
  - id: cli-set-process-title
    desc: Set CLI process title
    crit: notable
    conf: 0.9
    mbc: "F0004"
    attack: "T1036.004"
    if:
      type: symbol
      exact: "cli_set_process_title"
    unless:
      - id: metadata/library/generated::php-manual-empty-function-stubs
  - id: setproctitle
    desc: Set process title (PECL)
    crit: notable
    conf: 0.9
    mbc: "F0004"
    attack: "T1036.004"
    if:
      type: symbol
      exact: "setproctitle"
    unless:
      - id: metadata/library/generated::php-manual-empty-function-stubs
  # === Time Control ===
  # set_time_limit() is a max_execution_time resource limit, not a signal
  # operation — it lives in micro-behaviors/process/resources/limits/php.yaml.
  - id: ignore-user-abort
    desc: Keeps PHP running after client disconnect
    crit: notable
    conf: 0.85
    if:
      type: symbol
      exact: ignore_user_abort
  - id: ignore-user-abort-true-call
    desc: Enables ignore_user_abort(true) background run
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '@?ignore_user_abort\s*\(\s*true\s*\)'
composite_rules:
  - id: process-masquerade
    desc: PHP process name masquerading
    crit: suspicious
    conf: 0.9
    mbc: "F0004"
    attack: "T1036.004"
    any:
      - id: cli-set-process-title
      - id: setproctitle
