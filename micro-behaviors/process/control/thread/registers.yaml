defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
traits:
  - id: native-get-thread-context-name
    desc: Native thread-context read API name
    conf: 0.95
    if:
      type: text
      regex: '\b(Nt|Zw)GetContextThread\b'
  - id: native-set-thread-context-name
    desc: Native thread-context write API name
    conf: 0.95
    if:
      type: text
      regex: '\b(Nt|Zw)SetContextThread\b'
