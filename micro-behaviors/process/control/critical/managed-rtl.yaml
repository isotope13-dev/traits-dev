defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: rtl-set-process-critical-call
    desc: Calls RtlSetProcessIsCritical
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: RtlSetProcessIsCritical
  - id: cil-true-byref-false-call-layout
    desc: CIL true/byref/false call argument layout
    crit: component
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '17 12 ?? 16 28 ?? ?? ?? 06'
composite_rules:
  # The nine-byte window binds the resolved call site to the enabling layout.
  # A disabling call uses ldc.i4.0, and an unused P/Invoke has no call fact.
  - id: managed-rtl-critical-enable
    desc: Requests termination-critical process state
    crit: suspicious
    conf: 0.98
    near_bytes: 9
    all:
      - id: rtl-set-process-critical-call
      - id: cil-true-byref-false-call-layout
