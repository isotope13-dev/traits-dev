defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # This is a supported call layout with corroborating API references,
  # not proof that Windows accepted the critical-process flag.
  - id: managed-break-on-termination-call-layout
    desc: Managed termination-critical call layout
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/instruction/sequence::cil-true-local-class29-byref-call
      - id: micro-behaviors/process/control/info::nt-set-information-process
