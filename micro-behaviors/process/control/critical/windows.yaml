defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: rtl-set-process-is-critical-reference
    desc: References the RtlSetProcessIsCritical API
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: RtlSetProcessIsCritical
    unless:
      - id: metadata/signed/leaf::microsoft-corporation
      - id: metadata/binary/linking/api-set::api-set-core-cluster

  - id: process-break-on-termination-source
    desc: ProcessBreakOnTermination class reference
    crit: notable
    conf: 0.98
    for: [c, cpp, csharp, rust, go, python]
    if:
      type: text
      word: ProcessBreakOnTermination

composite_rules:
  - id: current-process-break-on-termination-control
    desc: Modifies the current process termination-critical state
    crit: suspicious
    conf: 0.97
    for: [c, cpp, csharp, rust, go, python]
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/control/info::nt-set-information-process-source
      - id: process-break-on-termination-source
      - id: micro-behaviors/process/info/current::get-current-process-source

  - id: current-process-break-on-termination-binary
    desc: Sets current process termination-critical state
    crit: suspicious
    conf: 0.94
    for: [pe, dll]
    all:
      - id: micro-behaviors/process/control/info::nt-set-information-process
      - id: micro-behaviors/process/control/info::process-info-class-29-constant
      - id: micro-behaviors/os/module/load::get-current-process
