defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, go]

composite_rules:
  - id: termination-policy-api-references
    desc: Criticality and resolver API references
    crit: notable
    conf: 0.98
    for: [c, cpp, csharp, rust, go]
    all:
      - id: micro-behaviors/process/control/info::nt-set-information-process-source
      - id: micro-behaviors/process/control/critical::process-break-on-termination-source
      - id: micro-behaviors/dylib/lookup::get-proc-address-source-call
