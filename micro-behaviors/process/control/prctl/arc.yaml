# Linux ARC (ARCompact) prctl wrapper in statically linked ELF files. See
# process/terminate/signal/arc-syscall.yaml for the `mov r8, <nr>; trap0` form.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99

traits:
  - id: arc-prctl-syscall
    desc: ARC Linux prctl syscall wrapper
    if:
      type: hex
      section: .text
      # mov r8, 167 (SYS_prctl); trap0. The option comes from callers.
      pattern: "8A 20 C2 19 6F 22 3F 00"
