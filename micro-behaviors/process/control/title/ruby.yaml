defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-process-title-assignment
    desc: Changes the displayed process title
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        (assignment left: (global_variable) @title right: (string)
          (#eq? @title "$0"))
