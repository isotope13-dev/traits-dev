# Reaping a child process. Neutral on its own -- every supervisor, pre-forking
# server and test harness does it -- but its ABSENCE beside an unbounded fork
# loop is what separates a fork bomb from a worker pool, so the DoS composites
# in objectives/impact/dos/fork-bomb/ reference these from `unless:`.
defaults:
  for: [python]
  platforms: [unix]
  crit: notable
  conf: 0.9

traits:
  - id: python-wait-child
    desc: Python waits on a child process
    if:
      type: symbol
      kind: call
      regex: '^os\.wait(pid|id|status_to_exitcode)?$'

  - id: python-sigchld-handler
    desc: Python handles child-exit signals
    if:
      type: text
      regex: '\bSIG(CHLD|CLD)\b'
