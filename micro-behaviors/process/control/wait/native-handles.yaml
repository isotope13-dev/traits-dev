# Win32 process wait and exit-status queries on a child handle
defaults:
  for: ["pe", "dll"]
  platforms: ["windows"]
traits:
  - id: wait-for-single-object
    desc: Wait for process/object
    crit: baseline
    conf: 0.90
    for: [pe, dll, c, cpp]
    if:
      type: text
      word: "WaitForSingleObject"
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: micro-behaviors/process/control/wait::wait-for-single-object-api
  - id: get-exit-code-process
    desc: Get process exit code
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "GetExitCodeProcess"
