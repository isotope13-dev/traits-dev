defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-unref-handle
    desc: Unrefs a Node event-loop handle
    conf: 0.86
    if:
      type: text
      # The handle is either bound to a name (`child.unref()`) or is the value
      # the creating call just returned (`spawn(...).unref()`, the
      # fire-and-forget spelling). Anchoring only on an identifier missed the
      # chained form entirely.
      regex: '(\)|\b[A-Za-z_$][A-Za-z0-9_$]*)\s*\.\s*unref\s*\(\s*\)'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
