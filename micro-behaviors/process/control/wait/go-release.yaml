# Process.Release relinquishes resources and future Wait ownership; it does
# not create a detached OS session. This shares the child-supervision leaf
# with node-unref-handle, rather than claiming compiler use or daemonization.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
traits:
  - id: go-process-release
    desc: Go releases child process wait ownership
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '\.Process\.Release$'
