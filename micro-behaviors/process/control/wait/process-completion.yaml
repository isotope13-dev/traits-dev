# These imports support process-completion handling, not remote tasking.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: process-completion-api-set
    desc: Process launch, wait and exit-code API set
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: wait-for-single-object-api
      - id: get-exit-code-process
