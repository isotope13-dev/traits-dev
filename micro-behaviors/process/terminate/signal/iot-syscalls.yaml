defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99
traits:
  - id: powerpc-kill-syscall
    desc: PowerPC Linux kill syscall wrapper
    arch: [powerpc]
    if:
      type: hex
      section: text
      # li r0, 37 (SYS_kill) then sc. A wrapper may move the pid
      # into r3 between them; the adjacent form is the zero-gap case.
      pattern: "38 00 00 25 [0-8] 44 00 00 02"
  - id: superh-kill-syscall
    desc: SuperH Linux kill syscall wrapper
    arch: [superh]
    if:
      type: hex
      section: text
      # mov #37, r3 (SYS_kill) then trapa #18. The gap is the wrapper's
      # register shuffle: some builds use 8 bytes, others 2 or 16.
      pattern: "25 E3 [0-16] 12 C3"
  - id: sparc-kill-syscall
    desc: SPARC Linux kill syscall wrapper
    arch: [sparc]
    if:
      type: hex
      section: text
      pattern: "82 10 20 25 [0-16] 91 D0 20 10"
