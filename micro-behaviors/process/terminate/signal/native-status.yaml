defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: native-pid-kill-reason-log
    desc: Reports process killing with reasons
    crit: notable
    if:
      type: text
      exact: 'kill pid=%d exe=%s reason=%s'

  - id: native-named-pid-killer-log
    desc: Reports named process killer actions
    crit: notable
    conf: 0.99
    if:
      type: text
      exact: 'killer: %s pid=%d name=%s'
