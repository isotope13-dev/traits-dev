traits:
  - id: killall-terminal-command
    desc: Terminal process termination command reference
    crit: notable
    conf: 0.9
    platforms: [macos]
    for: [macho, shell, applescript]
    if:
      type: text
      substr: killall Terminal
    unless:
      # ATT&CK matrix prose quotes the command while describing OSX Proton
      # and similar techniques; the dataset documents the behavior.
      - id: metadata/file/catalog/identity::mitre-attack-dataset
