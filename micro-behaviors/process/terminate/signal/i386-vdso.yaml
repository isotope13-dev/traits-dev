defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]
  crit: notable
  conf: 0.99
traits:
  - id: i386-vdso-kill-wrapper
    desc: i386 kill syscall wrapper through VDSO
    if:
      type: hex
      section: .text
      pattern: "8B 4C 24 08 8B 5C 24 04 B8 25 00 00 00 65 FF 15 10 00 00 00"
  - id: i386-stack-signal-nine-call
    desc: i386 signal-nine call with stack process ID
    if:
      type: hex
      section: .text
      pattern: "6A 09 FF 74 24 ?? E8 ?? ?? ?? ??"
