defaults:
  for: [elf, macho, so]
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: kill
    desc: Send signal to process
    crit: baseline
    mbc: E1562
    attack: T1562
    conf: 0.6
    if:
      type: symbol
      exact: kill
    platforms:
      - linux
      - macos
    downgrade:
      any:
        - id: metadata/signed/platform::apple
        - id: metadata/file/string/identity::system-shell-basename

  - id: x86-64-kill-syscall
    desc: Direct x86-64 kill(2) syscall
    crit: notable
    conf: 0.92
    mbc: E1562
    attack: T1562
    platforms: [linux]
    for: [elf]
    if:
      type: hex
      section: .text
      pattern: "B8 3E 00 00 00 [0-24] 0F 05"
    unless:
      # Go's runtime carries this signal-delivery wrapper for fatal runtime
      # paths; it does not establish application-level process termination.
      - id: metadata/lang/compiler/systems::go-binary
  - id: killpg
    desc: Send signal to process group
    crit: baseline
    mbc: E1562
    attack: T1562
    conf: 0.7
    if:
      type: symbol
      exact: killpg
    platforms:
      - linux
      - macos
    downgrade:
      any:
        - id: metadata/file/string/identity::system-shell-basename
  - id: sigprocmask
    desc: Examine or change blocked signals
    crit: baseline
    conf: 0.6
    if:
      type: symbol
      exact: sigprocmask
    platforms:
      - linux
      - macos
  - id: _exit
    desc: Terminates process immediately without cleanup
    crit: baseline
    conf: 0.4
    if:
      type: symbol
      exact: _exit
    platforms:
      - linux
      - macos
