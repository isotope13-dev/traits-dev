defaults:
  for: [elf, macho, so]
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: kill
    desc: Send signal to process
    crit: baseline
    mbc: E1562
    attack: T1562
    conf: 0.6
    if:
      type: symbol
      exact: kill
    platforms:
      - linux
      - android
      - macos
    downgrade:
      any:
        - id: metadata/signed/platform::apple
        - id: metadata/file/string/identity::system-shell-basename

  - id: i386-kill-syscall
    desc: Direct i386 kill syscall wrapper
    crit: notable
    conf: 0.97
    mbc: E1562
    attack: T1562
    platforms: [linux]
    for: [elf]
    arch: [x86]
    if:
      type: hex
      section: .text
      # Linux i386 SYS_kill is syscall 37 (0x25) via int 0x80.
      pattern: "B8 25 00 00 00 CD 80"
    unless:
      # Go embeds a runtime signal-delivery wrapper with these exact bytes in
      # every 32-bit Linux binary; it is not application-level termination.
      - id: metadata/lang/compiler/systems::go-binary

  - id: m68k-kill-syscall
    desc: Direct m68k kill syscall wrapper
    crit: notable
    conf: 0.99
    platforms: [linux]
    for: [elf]
    if:
      type: hex
      offset_range: [64, null]
      pattern: "2F 02 20 6E 00 08 24 2E 00 0C 22 08 70 25 4E 40"
  - id: killpg
    desc: Send signal to process group
    crit: baseline
    mbc: E1562
    attack: T1562
    conf: 0.7
    if:
      type: symbol
      exact: killpg
    platforms:
      - linux
      - macos
    downgrade:
      any:
        - id: metadata/file/string/identity::system-shell-basename
  - id: sigprocmask
    desc: Examine or change blocked signals
    crit: baseline
    conf: 0.6
    if:
      type: symbol
      exact: sigprocmask
    platforms:
      - linux
      - macos
composite_rules:
  - id: procfs-miner-target-termination
    desc: Terminates named miners found through procfs
    crit: suspicious
    conf: 0.995
    platforms: [linux, android]
    for: [elf]
    all:
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/fs/proc/info/path::process-inspection-path-cluster
      - id: micro-behaviors/process/info/name::cpuminer-process-name
      - id: micro-behaviors/process/info/name::minerd-process-name
    any:
      - id: micro-behaviors/process/terminate/command::kill-force
      - id: i386-kill-syscall
      - id: micro-behaviors/process/control/signal::arm-oabi-kill-syscall
