defaults:
  for: [elf, macho, so]
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: kill
    desc: Send signal to process
    crit: baseline
    mbc: E1562
    attack: T1562
    conf: 0.6
    if:
      type: symbol
      exact: kill
    platforms:
      - linux
      - macos
    downgrade:
      any:
        - id: metadata/signed/platform::apple
        - id: metadata/file/string/identity::system-shell-basename

  - id: x86-64-kill-syscall
    desc: Direct x86-64 kill(2) syscall
    crit: notable
    conf: 0.92
    mbc: E1562
    attack: T1562
    platforms: [linux]
    for: [elf]
    if:
      type: hex
      section: .text
      pattern: "B8 3E 00 00 00 [0-24] 0F 05"
    unless:
      # Go's runtime carries this signal-delivery wrapper for fatal runtime
      # paths; it does not establish application-level process termination.
      - id: metadata/lang/compiler/systems::go-binary

  - id: i386-kill-syscall
    desc: Direct i386 kill syscall wrapper
    crit: notable
    conf: 0.97
    mbc: E1562
    attack: T1562
    platforms: [linux]
    for: [elf]
    arch: [x86]
    if:
      type: hex
      section: .text
      # Linux i386 SYS_kill is syscall 37 (0x25) via int 0x80.
      pattern: "B8 25 00 00 00 CD 80"
    unless:
      # Go embeds a runtime signal-delivery wrapper with these exact bytes in
      # every 32-bit Linux binary; it is not application-level termination.
      - id: metadata/lang/compiler/systems::go-binary

  - id: arm-oabi-kill-syscall
    desc: ARM OABI direct kill(2) syscall
    crit: notable
    conf: 0.99
    mbc: E1562
    attack: T1562
    platforms: [linux]
    for: [elf]
    arch: [arm]
    if:
      type: hex
      section: .text
      # Linux ARM OABI places SYS_kill (37) in the SVC immediate.
      pattern: "25 00 90 EF"
  - id: killpg
    desc: Send signal to process group
    crit: baseline
    mbc: E1562
    attack: T1562
    conf: 0.7
    if:
      type: symbol
      exact: killpg
    platforms:
      - linux
      - macos
    downgrade:
      any:
        - id: metadata/file/string/identity::system-shell-basename
  - id: sigprocmask
    desc: Examine or change blocked signals
    crit: baseline
    conf: 0.6
    if:
      type: symbol
      exact: sigprocmask
    platforms:
      - linux
      - macos
  - id: _exit
    desc: Terminates process immediately without cleanup
    crit: baseline
    conf: 0.4
    if:
      type: symbol
      exact: _exit
    platforms:
      - linux
      - macos

composite_rules:
  - id: procfs-miner-target-termination
    desc: Terminates named miners found through procfs
    crit: suspicious
    conf: 0.995
    platforms: [linux, android]
    for: [elf]
    all:
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/fs/proc/info/path::process-inspection-path-cluster
      - id: micro-behaviors/process/enumerate/proc::cpuminer-process-name
      - id: micro-behaviors/process/enumerate/proc::minerd-process-name
    any:
      - id: micro-behaviors/process/terminate/command::kill-force
      - id: i386-kill-syscall
      - id: arm-oabi-kill-syscall
