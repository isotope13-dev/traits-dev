# Linux ARC (ARCompact) kill wrapper in statically linked ELF files. ARC follows
# the asm-generic syscall table and enters the kernel with `mov r8, <nr>; trap0`.
# The 32-bit `mov r8, s12` packs the number as 0x1000 | (nr & 0x3F) << 6 |
# nr >> 6 in its second halfword, so SYS_kill (129) is `42 10`.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.99

traits:
  - id: arc-kill-syscall
    desc: ARC Linux kill syscall wrapper
    if:
      type: hex
      section: .text
      # mov r8, 129 (SYS_kill); trap0. The signal argument comes from callers,
      # so this alone asserts no termination.
      pattern: "8A 20 42 10 6F 22 3F 00"
