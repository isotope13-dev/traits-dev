defaults:
  for: [vbs]
  platforms: [windows]
traits:
  - id: vbs-terminate-statement
    desc: VBScript zero-argument Terminate statement
    crit: component
    if:
      type: text
      regex: '(?im)^[ \t]*[A-Z_]\w{0,40}\.Terminate[ \t]*(\([ \t]*\))?[ \t]*\r?$'
      exclude_comments: true
composite_rules:
  - id: vbs-wmi-termination
    desc: WMI process query with Terminate statement
    crit: notable
    conf: 0.95
    near_lines: 10
    all:
      - id: micro-behaviors/os/wmi/query::query-process-list
      - id: vbs-terminate-statement
