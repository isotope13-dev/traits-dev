defaults:
  for: [python, javascript, typescript, ruby, perl, lua, php]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: embedded-port-owner-force-kill
    desc: Embedded command force-kills a port owner
    conf: 0.97
    if:
      type: literal
      kind: string
      exclude_docstrings: true
      regex: '\bkill\s+(-9|-KILL)\s+\$\((sudo\s+)?lsof\s+-ti:[0-9]{1,5}\)'
