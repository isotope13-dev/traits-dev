# A negative PID selects a process group. SIGKILL alone establishes neither
# service disruption nor init persistence; supervisors also use it for cleanup.
defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: process-group-kill
    desc: SIGKILL command targets variable process group
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: \bkill\b\s+(-9|-SIGKILL|-KILL)\s+-\$?\{?[a-zA-Z_][a-zA-Z0-9_]*\}?
    not:
      - substr: kill -9 -$pid
    unless:
      # Retain the existing test-harness and tracked-worker exclusions so this
      # relocation does not broaden the three init-objective consumers.
      - id: metadata/path::test-directory-component
      - id: micro-behaviors/process/pid::node-pidfile-reference
