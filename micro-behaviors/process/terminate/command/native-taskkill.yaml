defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: compiled-taskkill-pid-force-arguments
    desc: Compiled taskkill PID and force arguments
    crit: notable
    conf: 0.98
    if:
      type: raw
      section: .rdata
      substr: taskkill.exe/PID/F
  - id: native-taskkill-pid-command
    desc: Native binary embeds taskkill by PID command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\btaskkill(\.exe)?\b[^\r\n]{0,80}/f\b[^\r\n]{0,80}/pid\b'
    unless:
      - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-cli-context
