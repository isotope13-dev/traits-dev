defaults:
  platforms: [windows, unix]
  # Plain command text is meaningful in shell files and binary strings.  JS
  # and TypeScript need the call-site-aware atoms below because documentation
  # strings are common there (for example, a console error can print a kill
  # command without executing it).
  for: [scripts, -javascript, -typescript, binaries]
traits:
  # Match an invocation carrying an explicit signal flag.  A bare executable
  # path such as `/bin/kill` is only a reference, not evidence of invocation.
  - id: kill-with-signal-flag
    desc: kill command invoked with a signal flag
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: '(^|[\s"'';&|])(/[A-Za-z0-9_.-]+/)?kill(\.exe)?\s+-[0-9A-Z]+\b'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/document/html/
  - id: kill-force
    desc: Force kill command
    crit: notable
    conf: 0.82
    platforms: [unix]
    if:
      type: text
      regex: '\b(pkill|killall|kill)\s+-9\b'
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/document/html/
  - id: js-kill-with-signal-flag
    desc: JS kill command with signal
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [javascript, typescript]
    if:
      type: text
      # Require a Node/POSIX command-execution call around the command.  A
      # prose/help string such as `console.error('... kill -9')` is not an
      # invocation.
      regex: '\b(exec|spawn)(Sync)?\s*\([^)]{0,160}\b(kill|pkill|killall)\s+-[0-9A-Z]+\b'
  - id: killall
    desc: killall command
    crit: notable
    conf: 0.8
    count_min: 2
    if:
      type: text
      word: killall
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/library/syntaxhighlighter::prismjs-package-reference
      - id: metadata/document/html/
  # tccd owns the macOS consent database and only reads it at start-up, so
  # killing it is how a caller forces a modified TCC.db to be reloaded.
  # launchd restarts it immediately — this is a reload, not a takedown, which
  # is why it sits with the other termination commands rather than under
  # impact/degrade/. The intent-bearing pairing with a TCC.db write lives in
  # objectives/evasion/tcc-manipulation/db/.
  - id: macos-tccd-daemon-kill
    desc: Kills the macOS TCC privacy daemon
    crit: notable
    conf: 0.93
    platforms: [macos]
    for: [scripts, source, macho]
    attack: T1562.001
    if:
      type: text
      regex: '\b(killall|pkill)\s+[-A-Za-z0-9\s]{0,12}tccd\b'

  - id: pkill
    desc: pkill process termination command
    crit: notable
    conf: 0.8
    if:
      type: text
      # Match an invocation, not a command-name list in a syntax highlighter
      # (for example `...|pkill|ps|...`).
      regex: '\bpkill\s+(-[A-Za-z0-9-]+\s+)?[^\s|;&)]{1,80}'
    unless:
      - id: metadata/library/syntaxhighlighter::prismjs-package-reference
      - id: metadata/library/syntaxhighlighter::prismjs-core
      - id: metadata/document/html/
    downgrade:
      any:
        - id: metadata/package/testing/presence/harness/
  - id: taskkill-explorer-force
    desc: Force kills Windows Explorer
    crit: notable
    conf: 0.94
    platforms: [windows]
    for: [batch, powershell, vbs, python]
    if:
      type: text
      regex: (?i)\btaskkill\b[^\r\n]{0,80}/f[^\r\n]{0,80}/im\s+explorer\.exe\b
  - id: taskkill-pid-force
    desc: Force kills process by PID
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [python]
    if:
      type: text
      regex: (?i)(^|[\s"/])taskkill(\.exe)?\b[^\r\n]{0,40}/f[^\r\n]{0,40}/pid\b
  - id: taskkill-token
    desc: taskkill command token
    ref: sha256:1fa1e028b2cad5297edcae7d505456d187bdf1bc29acba1e90d17f355951bca7
    crit: notable
    conf: 0.72
    platforms: [windows]
    for: [javascript, typescript, batch, powershell, vbs]
    if:
      type: text
      regex: '(?i)(^|[\s"'';&|])taskkill(\.exe)?([\s/]|$)'
  - id: taskkill-pid-argument
    desc: taskkill PID argument
    ref: sha256:1fa1e028b2cad5297edcae7d505456d187bdf1bc29acba1e90d17f355951bca7
    crit: notable
    conf: 0.78
    platforms: [windows]
    if:
      type: text
      exact: /PID
  - id: taskkill-svchost-force
    desc: Force kills svchost.exe by image name
    crit: notable
    conf: 0.94
    platforms: [windows]
    for: [batch, powershell, vbs]
    if:
      type: text
      regex: (?i)\btaskkill\b[^\r\n]{0,80}/f[^\r\n]{0,80}/im\s+svchost\.exe\b
  - id: taskkill-browser-image
    desc: Terminates browser process by image name
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [python]
    if:
      type: text
      regex: '(?i)\btaskkill(\.exe)?\b[^\r\n]{0,80}\b(brave|chrome|msedge|opera)\.exe\b'

  - id: pyc-taskkill-force-image
    desc: Python bytecode force-kills a process image
    crit: notable
    conf: 0.92
    platforms: [windows]
    for: [pyc]
    if:
      type: text
      regex: '(?i)\btaskkill\b[^\r\n]{0,80}/f[^\r\n]{0,80}/im\b'

  - id: js-taskkill-force-command
    desc: JavaScript force-kills a Windows process
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\btaskkill(\.exe)?\b[^\r\n]{0,80}(/im\b[^\r\n]{0,80}/f\b|/f\b[^\r\n]{0,80}/im\b)'
  - id: batch-taskkill-image-name
    desc: Batch force-kills a process by image name
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [batch]
    if:
      type: text
      regex: '(?i)\btaskkill\b.{0,80}/f.{0,80}/im\s+[A-Za-z0-9_.-]+\.exe\b'

  - id: powershell-taskkill-image-name
    desc: PowerShell force-kills a process by image name
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: '(?i)\btaskkill(\.exe)?\b.{0,80}/f.{0,80}/im\s+[A-Za-z0-9_.-]+\.exe\b'

  - id: native-taskkill-force-image
    desc: Native binary embeds force-kill command
    crit: notable
    conf: 0.92
    platforms: [windows]
    for: [pe, dll, c, cpp]
    if:
      type: text
      regex: '(?i)\btaskkill(\.exe)?\b[^\r\n]{0,100}/f[^\r\n]{0,100}/im\s+["'']?[A-Za-z0-9_.-]+\.exe\b'

  - id: taskkill-sensitive-target-cluster--database
    desc: Force-kills sensitive database process
    crit: component
    conf: 0.92
    platforms: [windows]
    for: [pe, dll, c, cpp, batch, powershell, python, javascript]
    if:
      type: text
      regex: '(?i)\btaskkill(\.exe)?\b.{0,60}/f.{0,40}\b(sqlservr|mysqld)\b'
  - id: taskkill-sensitive-target-cluster--office
    desc: Force-kills sensitive Office process
    crit: component
    conf: 0.92
    platforms: [windows]
    for: [pe, dll, c, cpp, batch, powershell, python, javascript]
    if:
      type: text
      regex: '(?i)\btaskkill(\.exe)?\b.{0,60}/f.{0,40}\b(winword|excel|outlook)\b'
  - id: lsof-listener-pid
    desc: lsof resolves listener port to PID
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [shell]
    if:
      type: text
      regex: '(?i)\blsof\b[^\r\n]{0,40}-(ti\b|t[^\r\n]{0,12}-i\b)'
  - id: windows-listener-owner-query
    desc: TCP query selects process owner
    crit: notable
    conf: 0.95
    platforms: [windows]
    for: [batch, javascript, typescript, powershell]
    if:
      type: text
      regex: '(?i)\bGet-NetTCPConnection\b[^\r\n]{0,160}\bOwningProcess\b'
  - id: windows-force-kill-by-pid
    desc: Windows force-kills process by PID
    crit: notable
    conf: 0.92
    platforms: [windows]
    for: [batch, javascript, typescript, powershell]
    if:
      type: text
      regex: '(?i)\btaskkill(\.exe)?\b[^\r\n]{0,80}/F[^\r\n]{0,80}/PID\b'

composite_rules:
  - id: taskkill-force-image-name
    desc: Force-kills a Windows process by image name
    crit: notable
    conf: 0.92
    platforms: [windows]
    for: [batch, powershell, javascript, typescript, pe, dll, c, cpp]
    any:
      - id: batch-taskkill-image-name
      - id: js-taskkill-force-command
      - id: powershell-taskkill-image-name
      - id: native-taskkill-force-image

  - id: taskkill-sensitive-target-cluster
    desc: Repeated kills of database or Office processes
    crit: suspicious
    conf: 0.92
    platforms: [windows]
    for: [pe, dll, c, cpp, batch, powershell, python, javascript]
    any:
      - id: taskkill-sensitive-target-cluster--database
      - id: taskkill-sensitive-target-cluster--office
  - id: listener-process-termination
    desc: Shell resolves listener port, then force-kills process
    crit: notable
    conf: 0.94
    platforms: [unix]
    for: [shell]
    all:
      - id: lsof-listener-pid
      - id: kill-force
  - id: windows-listener-process-termination
    desc: Windows kills listener process by PID
    crit: notable
    conf: 0.96
    platforms: [windows]
    for: [batch, javascript, typescript, powershell]
    all:
      - id: windows-listener-owner-query
      - id: windows-force-kill-by-pid
  - id: taskkill-pid-command
    desc: taskkill terminates by PID
    ref: sha256:1fa1e028b2cad5297edcae7d505456d187bdf1bc29acba1e90d17f355951bca7
    crit: notable
    conf: 0.86
    platforms: [windows]
    all:
      - id: taskkill-token
      - id: taskkill-pid-argument
