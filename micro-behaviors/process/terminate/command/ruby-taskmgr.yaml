defaults:
  for: [ruby]
  platforms: [windows]
traits:
  - id: ruby-taskmgr-forced-termination
    desc: Ruby forcibly terminates Task Manager
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: system
      arg:
        index: 0
        kind: string
        regex: '^taskkill /f /im taskmgr\.exe$'
