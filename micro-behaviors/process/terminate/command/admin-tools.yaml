defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell]
  crit: notable
  conf: 0.97
traits:
  - id: force-taskkill-task-manager
    desc: Taskkill /f command targets Task Manager
    if:
      type: text
      # Compiled fixed-width process names can immediately precede commands
      # without a NUL separator: taskmgr.exetaskkill /F /IM taskmgr.exe /T.
      regex: '(\b|\.exe)taskkill(\.exe)?\s+/f\s+/im\s+"?taskmgr\.exe\b'
      case_insensitive: true
  - id: force-taskkill-registry-editor
    desc: Taskkill /f command targets Registry Editor
    if:
      type: text
      regex: '\btaskkill(\.exe)?\s+/f\s+/im\s+"?regedit\.exe\b'
      case_insensitive: true
  - id: force-taskkill-management-console
    desc: Taskkill /f command targets Management Console
    if:
      type: text
      regex: '\btaskkill(\.exe)?\s+/f\s+/im\s+"?mmc\.exe\b'
      case_insensitive: true
