defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
traits:
  - id: hex-escaped-deleted-suffix-kill
    desc: Escaped deleted-suffix filter precedes kill -9
    conf: 0.97
    if:
      type: hex
      # The full escaped filter and kill command remain identifiable even
      # when an ELF section table is corrupt.
      offset_range: [0, null]
      # Shell parameter expansion %(deleted), then kill -9. The gap
      # allows quotes, NUL padding and split echo arguments; names vary.
      # Hex digit case is immaterial. This alone also fits maintenance.
      pattern: '5C 78 32 35 5C 78 32 38 5C 78 36 34 5C 78 36 35 5C 78 36 (43|63) 5C 78 36 35 5C 78 37 34 5C 78 36 35 5C 78 36 34 5C 78 32 39 [0-256] 5C 78 36 (42|62) 5C 78 36 39 5C 78 36 (43|63) 5C 78 36 (43|63) 5C 78 32 30 5C 78 32 (44|64) 5C 78 33 39'
  # Match one decoded string, including the space in Linux's " (deleted)"
  # suffix and intervening path exclusions. The older raw-byte matcher above
  # also handles split echo arguments; its bounded-gap contract is unchanged.
  - id: decoded-deleted-suffix-sigkill
    desc: Decoded deleted-suffix removal precedes kill -9
    conf: 0.97
    if:
      type: encoded
      regex: '%[ \t]*\(deleted\)\}[\s\S]{0,768}\bkill[ \t]+-9\b'
