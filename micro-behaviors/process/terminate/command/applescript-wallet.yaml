defaults:
  platforms: [macos]
  for: [applescript]
  crit: notable

traits:
  - id: scpt-pkill-wallet-application
    desc: AppleScript invokes pkill for a wallet app
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: syso.exec
      arg:
        kind: string
        regex: '^pkill\s+["'']?(Ledger (Live|Wallet)|Trezor Suite|Exodus)["'']?$'
