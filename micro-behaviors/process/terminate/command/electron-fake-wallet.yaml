# Counterfeit desktop-wallet Electron agents that kill the real app in
# /Applications, keep a stealth window ready, and exfiltrate BIP39 recovery
# phrases over Telegram. Inspired by Operation ASTERIX (fake Trezor Suite).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell, scripts, asar, dmg, pkg, zip]
  attack: T1185,T1567,T1555

traits:
  - id: taskkill-wallet-image
    desc: "taskkill /F with wallet application name"
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)taskkill.{0,80}/F.{0,80}(Trezor|Ledger|Exodus)'
composite_rules:
  - id: application-path-force-kill
    desc: "Force kill near a wallet application path"
    crit: suspicious
    conf: 0.94
    near_bytes: 240
    all:
      - id: micro-behaviors/fs/path/application/bundle::wallet-applications-path-marker
    any:
      - id: micro-behaviors/process/terminate/command::kill-force
      - id: micro-behaviors/process/terminate/command::js-kill-with-signal-flag
  - id: wallet-or-application-kill
    desc: "Wallet-context process termination"
    crit: suspicious
    conf: 0.95
    attack: T1489,T1185
    any:
      - id: micro-behaviors/process/terminate/command::taskkill-wallet-image
      - id: micro-behaviors/process/terminate/command::application-path-force-kill
