defaults:
  platforms: [unix]
  for: [lua, shell, python, perl, ruby, php]
traits:
  - id: killall-with-signal
    desc: Runs killall with a signal number
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'killall\s+-[0-9]+\b'
  - id: killall-netcat-command
    desc: Runs killall against netcat processes
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'killall\s+nc\b'
