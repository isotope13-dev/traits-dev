defaults:
  platforms: [windows]
  for: [ruby]
traits:
  - id: ruby-taskkill-force-image
    desc: Ruby force-kills a Windows process image
    crit: notable
    conf: 0.93
    if:
      type: tree-sitter
      language: ruby
      query: |
        ((subshell) @command
        (#match? @command "(?i)taskkill(\\.exe)?[ \t]+/f[ \t]+/im\\b"))
        (call method: (identifier) @method
          arguments: (argument_list [(string) (subshell)] @command)
          (#match? @method "^(system|exec|spawn|popen)$")
          (#match? @command "(?i)taskkill(\\.exe)?[ \t]+/f[ \t]+/im\\b"))
