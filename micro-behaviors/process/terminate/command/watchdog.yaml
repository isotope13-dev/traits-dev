defaults:
  platforms: [unix, android, ios]
  for: [shell, binaries]
traits:
  - id: shell-kill-watchdog-token
    desc: Shell kill command contains watchdog token
    crit: notable
    conf: 0.85
    unless:
      - id: well-known/tool/detection/cert-x-gen::scanner-source-member-context
    if:
      type: text
      regex: '(?im)^\s*(kill|pkill)\s+[^\n]{0,60}\bwatchdog\b'
