defaults:
  platforms: [windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: go-taskkill-force-image-command
    desc: Go constructs forced process-image termination
    if:
      type: symbol
      kind: call
      exact: exec.Command
      args:
        - index: 0
          kind: string
          regex: '(?i)^taskkill(\.exe)?$'
        - kind: string
          regex: '(?i)^/IM$'
        - kind: string
          regex: '(?i)^/F$'
