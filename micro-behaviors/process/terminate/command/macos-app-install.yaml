defaults:
  platforms: [macos]
  for: [macho, python, shell, applescript]
  crit: notable
  conf: 0.85

traits:
  - id: pkill-ledger-live
    desc: pkill command names Ledger Live
    conf: 0.7
    if:
      type: text
      regex: pkill.{0,30}Ledger Live
  - id: killall-ledger
    desc: killall command names a Ledger application
    conf: 0.7
    if:
      type: text
      regex: killall.{0,30}Ledger

composite_rules:
  - id: terminate-ledger-command
    desc: Process termination command names Ledger
    conf: 0.9
    any:
      - id: pkill-ledger-live
      - id: killall-ledger
