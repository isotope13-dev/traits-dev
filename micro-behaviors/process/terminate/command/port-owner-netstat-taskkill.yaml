# Windows port-owner termination from JavaScript. A program lists sockets with
# netstat and force-kills the PID that owns one of them. Each leg is a parsed
# call fact, so a string that merely mentions netstat or taskkill in prose or
# in a comment does not count. Both calls must sit in one function-sized
# window, which separates this from an unrelated netstat report or a
# standalone taskkill cleanup.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: netstat-listing-call
    desc: Invokes netstat to list sockets
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(execFileSync|execSync|spawnSync|execFile|exec|spawn)$'
      arg: {index: 0, kind: string, exact: netstat}

  - id: taskkill-process-call
    desc: Invokes taskkill to end a process
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(execFileSync|execSync|spawnSync|execFile|exec|spawn)$'
      arg: {index: 0, kind: string, exact: taskkill}

composite_rules:
  - id: netstat-listener-taskkill-port-owner
    desc: Kills a port owner found through netstat
    conf: 0.9
    scope: file
    near_lines: 40
    all:
      - id: netstat-listing-call
      - id: taskkill-process-call
