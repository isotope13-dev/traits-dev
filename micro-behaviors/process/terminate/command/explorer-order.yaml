defaults:
  platforms: [windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.94
traits:
  - id: taskkill-explorer-image-first
    desc: Force kills Explorer with image-first arguments
    if:
      type: text
      regex: '(?i)\btaskkill\b.{0,40}/im\s+explorer\.exe\b.{0,40}/f\b'
composite_rules:
  - id: taskkill-explorer-force
    desc: Force kills Windows Explorer
    any:
      - id: taskkill-explorer-force-first
      - id: taskkill-explorer-image-first
