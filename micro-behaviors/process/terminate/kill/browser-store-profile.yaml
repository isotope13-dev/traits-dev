# Store paths and kill APIs establish neither browser killing nor theft.
# Retain only neutral store evidence when moving this capability profile.
defaults:
  platforms:
  - windows
  crit: notable
  conf: 0.94
composite_rules:
- id: browser-store-process-termination-api-profile-source
  desc: Browser-store references with process-termination APIs
  for:
  - source
  all:
  - id: micro-behaviors/process/attach/rights::open-process
  - id: micro-behaviors/process/terminate/kill::terminate-process-source
  - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-source
  - id: micro-behaviors/fs/path/application/executable::browser-process-name-cluster
  any:
  - id: micro-behaviors/fs/path/password-store::chromium-login-data-browser-path-profile
  - id: micro-behaviors/data/db/sql::chromium-cookie-select-query
  - id: micro-behaviors/fs/path/password-store::firefox-key4-db-reference
  - id: micro-behaviors/data/db/access::firefox-history-query-context
- id: browser-store-process-termination-api-profile-pe
  desc: Browser-store references with process-termination APIs
  for:
  - pe
  - dll
  all:
  - id: micro-behaviors/process/attach/rights::open-process
  - id: micro-behaviors/process/terminate/kill::terminate-process
  - id: micro-behaviors/process/enumerate/snapshot/
  - id: micro-behaviors/fs/path/application/executable::browser-process-name-cluster
  any:
  - id: micro-behaviors/fs/path/password-store::chromium-login-data-browser-path-profile
  - id: micro-behaviors/data/db/sql::chromium-cookie-select-query
  - id: micro-behaviors/fs/path/password-store::firefox-key4-db-reference
  - id: micro-behaviors/data/db/access::firefox-history-query-context
  unless:
  - id: well-known/app/system/iobit::iobit-signed-component-context
  - id: well-known/lib/runtime/scripted/electron::chromium-engine-capability-context
