# Kernel termination capabilities, including security-software drivers.
# These profiles establish no defender target, destructive intent or IOCTL flow.
defaults:
  platforms: [windows]
  for: [pe]
  crit: suspicious
  conf: 0.97
composite_rules:
  - id: kernel-device-process-termination-api-profile
    desc: Kernel device-control and process-termination API profile
    conf: 0.97
    all:
      - id: metadata/binary/resource/identity::kernel-driver-init
      - id: micro-behaviors/os/kernel/device::kernel-device-control
      - id: micro-behaviors/process/terminate/kill::native-terminate-process-reference
  - id: kernel-process-termination
    for: [pe, c, cpp]
    desc: Kernel driver capability to terminate processes
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/process/terminate/kill::zw-terminate-process
    any:
      - id: micro-behaviors/process/terminate/kill::zw-open-process
      - id: micro-behaviors/os/kernel/routines::ob-open-object-by-pointer
    downgrade:
      any:
        - id: well-known/tool/sysadmin/sandboxie/
        - id: metadata/signed/platform/
        - id: well-known/lib/platform/wine/
    unless:
      - id: well-known/lib/platform/win32k/
      # Wine/ReactOS ntdll implements ZwTerminateProcess/ZwOpenProcess.
      - id: metadata/binary/vendor/
      - id: metadata/vendor/string::microsoft-corporation-name-reference
