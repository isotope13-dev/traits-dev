defaults:
  platforms: [unix]
  for: [scripts, binaries]

traits:
  - id: esxcli-vm-kill
    desc: ESXi VM process kill command
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'esxcli\s+vm\s+process\s+kill\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
