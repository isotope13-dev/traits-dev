defaults:
  crit: suspicious
  platforms: [windows]
  for: [vbs]
traits:
  - id: terminate-process-vb-reference
    desc: VB TerminateProcess API reference
    conf: 0.92
    if:
      type: text
      word: TerminateProcess
    unless:
    - id: micro-behaviors/process/create/load/vba::vba-declare-terminateprocess
    - id: metadata/lang/upstream::freebasic-windows-binding
    crit: notable

  - id: killapp-routine-vb6
    desc: VB KillApp function definition
    conf: 0.95
    if:
      type: text
      substr: Public Function KillApp(
    crit: notable

composite_rules:
  - id: toolhelp-kill-loop-vb6
    desc: VB6 Toolhelp terminate workflow
    conf: 0.97
    all:
    - id: terminate-process-vb-reference
    - id: micro-behaviors/process/attach/rights::open-process-script
    - id: killapp-routine-vb6
    - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-vb6
