# A product reference and process-management imports do not identify the
# terminated process. In particular, shell-child cleanup also uses this set.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: chinese-av-reference-termination-api-profile
    desc: Chinese AV reference with process termination APIs
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/process/terminate/kill::toolhelp-kill-loop-source
      - id: micro-behaviors/os/security/product::chinese-av-product-extended
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/sysadmin/
