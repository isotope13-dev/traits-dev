# .NET process termination patterns
defaults:
  for: [csharp, pe, dll]
  platforms: [windows]
traits:
  - id: close-main-window
    desc: .NET process window close
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: ".CloseMainWindow()"
  - id: process-kill
    desc: .NET process kill call
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: ".Kill()"
  # Symbol form of Kill(). Kept off process/create/spawn so a lone Kill()
  # does not satisfy composites that require process creation.
  - id: terminate
    desc: Process termination via Kill()
    crit: notable
    mbc: E1562
    attack: T1562
    conf: 0.95
    platforms: [windows, unix]
    for: [csharp]
    if:
      type: symbol
      kind: call
      regex: '\.Kill$'
  - id: process-kill-member
    desc: .NET Kill member token
    crit: component
    conf: 0.8
    for: [pe, dll]
    if:
      type: text
      exact: Kill
  - id: current-process-kill
    desc: .NET explicitly terminates the current process
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'kill\(Process\.GetCurrentProcess\(\)\.Id|GetCurrentProcess\(\)\.Kill'
composite_rules:
  - id: process-terminate-loop
    desc: .NET process termination loop
    crit: baseline
    conf: 0.94
    all:
      - id: micro-behaviors/process/enumerate/managed::get-processes-by-name
    any:
      - id: close-main-window
      - id: process-kill
  - id: process-kill-by-name
    desc: .NET terminates processes by name
    crit: notable
    conf: 0.94
    for: [pe, dll]
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/enumerate/managed::get-processes-by-name
      - id: process-kill-member
