# .NET process termination patterns
defaults:
  for: [csharp, pe, dll]
  platforms: [windows]
traits:
  - id: close-main-window
    desc: .NET process window close
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: ".CloseMainWindow()"
  - id: process-kill
    desc: .NET process kill call
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: ".Kill()"
  # Symbol form of Kill(). Kept off process/create/spawn so a lone Kill()
  # does not satisfy composites that require process creation.
  - id: terminate
    desc: Process termination via Kill()
    crit: notable
    mbc: E1562
    attack: T1562
    conf: 0.95
    platforms: [windows, unix]
    for: [csharp]
    if:
      type: symbol
      kind: call
      regex: '\.Kill$'
  - id: current-process-kill
    desc: .NET explicitly terminates the current process
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'kill\(Process\.GetCurrentProcess\(\)\.Id|GetCurrentProcess\(\)\.Kill'
composite_rules:
  - id: process-terminate-loop
    desc: .NET process termination loop
    crit: baseline
    conf: 0.94
    all:
      - id: micro-behaviors/process/enumerate/managed::get-processes-by-name
    any:
      - id: close-main-window
      - id: process-kill
  - id: process-kill-by-name
    # Co-occurring members do not establish that Kill targets the lookup result.
    desc: .NET process-name lookup and Kill references
    crit: notable
    conf: 0.94
    for: [pe, dll]
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/enumerate/managed::get-processes-by-name
      - id: metadata/binary/symbols/name/token::dotnet-kill-method-name
  - id: process-kill-by-id-references
    # CLR member names are separate heap entries. Their co-occurrence supports
    # the capability, but does not bind Kill to the process lookup result.
    desc: .NET process-ID lookup and Kill references
    crit: notable
    conf: 0.9
    for: [pe, dll]
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/info/query::dotnet-get-process-by-id-member
      - id: metadata/binary/symbols/name/token::dotnet-kill-method-name
