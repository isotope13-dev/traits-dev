defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]
  crit: notable
  conf: 0.99

traits:
  - id: i386-logged-sigkill-call-sequence
    desc: x86 logging followed by a SIGKILL call
    if:
      type: yara
      source: |
        import "elf"
        rule i386_logged_sigkill_call_sequence {
          strings:
            $site = { E8 ?? ?? ?? ?? 83 C4 18 6A 09 56 E8 ?? ?? ?? ?? }
            $kill = {
              53 83 EC 08 8B 54 24 10 8B 4C 24 14 87 D3
              B8 25 00 00 00 CD 80 87 D3
            }
          condition:
            elf.machine == elf.EM_386 and
            for any s in (0..elf.number_of_sections-1) : (
              elf.sections[s].name == ".text" and
              $site in (elf.sections[s].offset..elf.sections[s].offset+elf.sections[s].size) and
              $kill in (elf.sections[s].offset..elf.sections[s].offset+elf.sections[s].size) and
              for any c in (1..#site) : (
                for any k in (1..#kill) : (
                  @site[c]+16+int32(@site[c]+12) == @kill[k]
                )
              )
            )
        }
