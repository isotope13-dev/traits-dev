# Diagnostics from a listener that frees its port by terminating whichever
# process currently holds it. Dev servers and "kill-port" helpers do the same,
# so this is a capability, not intent.
defaults:
  for: [pe, dll]
  platforms: [windows]
  mbc: C0018

traits:
  - id: port-busy-killing-owner
    desc: Kills the owner of a busy port
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)port\b.{0,48}\bbusy\b.{0,48}\bkilling\s+owner'
  - id: killed-pid-holding-port
    desc: Killed the pid holding a port
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)killed\s+pid\b.{0,48}\bholding\s+port\b'
