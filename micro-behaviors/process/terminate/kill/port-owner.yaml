# Diagnostics from a listener that frees its port by terminating whichever
# process currently holds it. Dev servers and "kill-port" helpers do the same,
# so this is a capability, not intent.
defaults:
  for: [pe, dll]
  platforms: [windows]
  mbc: C0018

traits:
  - id: port-busy-killing-owner
    desc: Kills the owner of a busy port
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)port\b.{0,48}\bbusy\b.{0,48}\bkilling\s+owner'
  - id: killed-pid-holding-port
    desc: Killed the pid holding a port
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)killed\s+pid\b.{0,48}\bholding\s+port\b'

composite_rules:
  # Terminating another process to acquire a listen port crosses a process
  # boundary. Maintenance helpers can do this too; no attack intent or
  # general-purpose open proxy follows from the observation.
  - id: listener-port-owner-termination
    desc: Listener diagnostics report killing its port owner
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/socket/listen::winsock-listener-imports
      - id: terminate-process
      - id: port-busy-killing-owner
      - id: killed-pid-holding-port
