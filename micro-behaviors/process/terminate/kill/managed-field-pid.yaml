defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: dotnet-process-kill-call
    desc: Calls managed Process.Kill
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: System.Diagnostics.Process.Kill
composite_rules:
  - id: managed-captured-array-pid-kill
    desc: Captured-array PID lookup feeds process kill
    crit: notable
    conf: 0.98
    near_bytes: 26
    all:
      - id: metadata/binary/instruction/cil::cil-captured-array-conversion-call-chain
      - id: micro-behaviors/process/info/query::dotnet-process-by-id-call
      - id: dotnet-process-kill-call
