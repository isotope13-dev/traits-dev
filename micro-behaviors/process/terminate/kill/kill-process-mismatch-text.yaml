defaults:
  platforms: [windows, unix]
  for:
    - python

traits:
  - id: kill-process-mismatch-text
    desc: Kill process and mismatch text
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: '\bkill.{0,8}process\b.{0,20}mismatch|mismatch.{0,20}\bkill.{0,8}process\b'
