defaults:
  platforms: [windows, unix]
  for:
    - python

composite_rules:
  - id: kill-process-hash-or-mismatch-text
    desc: Kill process with hash or mismatch text
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/process/terminate/kill::kill-process-md5-text
      - id: micro-behaviors/process/terminate/kill::kill-process-mismatch-text
