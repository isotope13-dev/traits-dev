# Wildcard binding plus port-owner termination does not establish a backdoor.
# Preserve the port cleanup observation for legitimate LAN servers as well as
# malicious listeners; an objective needs evidence of unauthorized access.
defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: wildcard-listener-port-owner-termination
    desc: Wildcard listener with port-owner termination diagnostics
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/process/terminate/kill::listener-port-owner-termination
      - id: micro-behaviors/communications/socket/bind/address::listening-all-interfaces-text
