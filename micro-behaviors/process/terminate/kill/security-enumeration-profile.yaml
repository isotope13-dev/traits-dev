# API co-occurrence does not bind the terminated processes to the security
# product names. Retain the reviewed severity and all effective filters.
composite_rules:
  - id: security-name-enumeration-termination-api-profile
    desc: Security names with process enumeration and termination APIs
    crit: suspicious
    conf: 0.85
    for: [pe, dll]
    platforms: [windows]
    attack: "T1057"
    mbc: "B0036"
    all:
      - id: micro-behaviors/os/security/product::security-process-name-reference
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
      - id: micro-behaviors/process/enumerate/snapshot::process32-first
      - id: micro-behaviors/process/terminate/kill::terminate-process
    unless:
      - id: well-known/tool/reverse-engineering/ida-pin-tracer/
      - id: well-known/tool/reverse-engineering/armnf::marker
      - id: metadata/signed/platform/
      - id: well-known/tool/development/agent/openai-codex/
      # The Open Interpreter Rust Codex fork ships the same benign doctor
      # diagnostics (cli/src/doctor/security.rs) beside generic agent process
      # management; its own repo string is what distinguishes those builds.
      - id: well-known/tool/development/agent/open-interpreter/
    downgrade:
      any:
        - id: metadata/binary/installer/script/
        - id: metadata/binary/resource/identity::pe-version-resource
