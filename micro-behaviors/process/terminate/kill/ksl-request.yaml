# KSLDriver accepts several operations at 0x222044. Require command 8, the
# two-DWORD buffer, and the exact same DeviceIoControl call for both facts.
# Arbitrary PID control is suspicious; this does not establish an EDR target.
defaults:
  platforms: [windows]
  for: [c, cpp, python]
composite_rules:
  - id: ksl-pid-termination-request
    desc: Sends KSLDriver's command-8 process-termination request
    crit: suspicious
    conf: 0.98
    near_bytes: 0
    all:
      - id: micro-behaviors/os/kernel/device::ksl-eight-byte-device-control
      - id: micro-behaviors/os/kernel/device::command-eight-dword-device-buffer
