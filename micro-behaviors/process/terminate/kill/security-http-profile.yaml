# The required security-process survey/termination leg supplies the suspicious
# context. HTTP APIs establish neither payload loading nor a backdoor.
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1518.001
composite_rules:
- id: security-name-toolhelp-http-api-profile
  desc: Security process references, termination and HTTP APIs
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/process/terminate/kill::security-name-enumeration-termination-api-profile
  - id: micro-behaviors/communications/http/client/wininet::wininet-http-api-cluster
  downgrade:
    any:
    - id: metadata/binary/symbols/count::many-imports
    - id: metadata/binary/resource/identity::pe-version-resource
    - id: metadata/binary/vendor::microsoft-corp-versioninfo
    - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
    - id: metadata/binary/vendor::microsoft-corp-marker-rdata
