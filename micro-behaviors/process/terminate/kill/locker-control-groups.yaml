defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
composite_rules:
  - id: file-holder-shutdown-controls
    desc: File-holder shutdown help or API
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/process/terminate/kill::stop-using-process-help
      - id: micro-behaviors/os/event/shutdown::restart-manager-shutdown
  - id: process-mask-controls
    desc: Process-mask option or termination log
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/process/argument/option::proc-mask-option
      - id: micro-behaviors/process/terminate/kill::process-mask-kill-success-log
