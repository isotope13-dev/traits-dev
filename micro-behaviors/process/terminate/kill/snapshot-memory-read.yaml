# Process enumeration, memory access and termination are neutral capabilities.
defaults:
  for: [c, cpp]
  platforms: [windows]
composite_rules:
  - id: process-snapshot-memory-read-termination
    desc: Process snapshot, memory-read and termination API references
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration-source
      - id: micro-behaviors/mem/read/cross-process::read-process-memory-source
      - id: micro-behaviors/process/terminate/kill::terminate-process-source
    near_bytes: 2048
    unless:
      # Preserve the debugger exclusions from the original matcher; debug
      # event operations remain visible through their own capability traits.
      - id: micro-behaviors/process/debug/event::wait-for-debug-event-source
      - id: micro-behaviors/process/debug/event::continue-debug-event-source
      - id: micro-behaviors/mem/read/cross-process::peb-command-line-memory-read
