defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.95

traits:
  # Logging call followed by kill(pid, SIGKILL). The neighboring wrapper
  # match in the composite confirms that Linux signal delivery is present.
  - id: x64-logged-sigkill-call-sequence
    desc: x64 logged PID and SIGKILL call sequence
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: '31 C0 (E8 [4] BE 09 00 00 00 89 EF|BF 02 00 00 00 E8 [4] 44 89 F7 BE 09 00 00 00) E8 [4]'
  - id: arm-logged-sigkill-call-sequence
    desc: ARM logged PID and SIGKILL call sequence
    arch: [arm]
    if:
      type: hex
      section: .text
      pattern: '00 50 8D E5 ?? ?? ?? EB 05 00 A0 E1 09 10 A0 E3 ?? ?? ?? EB'
  - id: mips-be-logged-sigkill-call-sequence
    desc: MIPS BE logged PID and SIGKILL sequence
    arch: [mips]
    if:
      type: hex
      section: .text
      pattern: '03 20 F8 09 AF ?? 00 10 8F BC 00 18 [0-16] (24 05 00 09 [4-8] 03 20 F8 09|03 20 F8 09 24 05 00 09)'

composite_rules:
  - id: logged-sigkill-call-sequence
    desc: Logging followed by variable PID and SIGKILL arguments
    any:
      - id: x64-logged-sigkill-call-sequence
      - id: arm-logged-sigkill-call-sequence
      - id: i386-logged-sigkill-call-sequence
      - id: mips-be-logged-sigkill-call-sequence
