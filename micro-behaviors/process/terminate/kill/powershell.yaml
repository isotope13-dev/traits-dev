defaults:
  platforms: [windows, unix]
  for: [powershell]
  crit: notable
  conf: 0.88
traits:
  - id: stop-process
    desc: PowerShell Stop-Process command reference
    if:
      type: text
      word: Stop-Process
  - id: stop-process-force
    desc: PowerShell force-stops process
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bStop-Process\b[^\r\n]{0,160}-Force\b'

  # Restart helpers, watchdogs and stagers alike enumerate Win32_Process,
  # filter on CommandLine and pipe the match to Stop-Process or Terminate().
  # The pipeline is often embedded as a string in a host-language launcher.
  - id: wmi-commandline-filtered-process-kill
    desc: Kills WMI processes matched by command line
    for: [powershell, javascript, typescript, python, csharp, batch, vbs]
    if:
      type: text
      regex: '(?i)Win32_Process\b[\s\S]{0,240}\bCommandLine\b[\s\S]{0,240}(Stop-Process\b|\.Terminate\()'
