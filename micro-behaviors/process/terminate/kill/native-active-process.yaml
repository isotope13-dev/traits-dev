defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
  crit: notable

traits:
  - id: x86-open-check-terminate-process
    desc: Native active-process check precedes termination
    conf: 0.98
    if:
      type: yara
      source: |
        import "pe"
        rule x86_open_check_terminate_process {
          strings:
            $slot_cow = { 8D BD ?? ?? ?? ?? }
            $flow_cow = {
              89 5C 24 08 C7 44 24 04 00 00 00 00
              C7 04 24 01 10 00 00 FF 15 ?? ?? ?? ??
              83 EC 0C 85 C0 89 C6 74 ?? 89 7C 24 04
              C7 85 ?? ?? ?? ?? 00 00 00 00 89 04 24
              FF 15 ?? ?? ?? ?? 81 BD ?? ?? ?? ?? 03 01 00 00
              57 57 75 13 C7 44 24 04 01 00 00 00 89 34 24
              FF 15 ?? ?? ?? ??
            }
            $flow = {
              89 7C 24 08 C7 44 24 04 00 00 00 00
              C7 04 24 01 10 00 00 FF 15 ?? ?? ?? ??
              83 EC 0C 89 C3 85 C0 74 ??
              8D 85 ?? ?? ?? ?? 89 1C 24
              C7 85 ?? ?? ?? ?? 00 00 00 00 89 44 24 04
              FF 15 ?? ?? ?? ?? 81 BD ?? ?? ?? ?? 03 01 00 00
              50 50 75 13 C7 44 24 04 01 00 00 00 89 1C 24
              FF 15 ?? ?? ?? ??
            }
          condition:
            pe.machine == pe.MACHINE_I386 and
            pe.imports("KERNEL32.dll", "OpenProcess") and
            pe.imports("KERNEL32.dll", "GetExitCodeProcess") and
            pe.imports("KERNEL32.dll", "TerminateProcess") and
            (for any f in (1..#flow) : (
              uint32(@flow[f]+36) == uint32(@flow[f]+45) and
              uint32(@flow[f]+36) == uint32(@flow[f]+65)
            ) or for any f in (1..#flow_cow) : (
              uint32(@flow_cow[f]+40) == uint32(@flow_cow[f]+59) and
              for any s in (1..#slot_cow) : (
                @slot_cow[s] < @flow_cow[f] and @flow_cow[f]-@slot_cow[s] < 1024 and
                uint32(@slot_cow[s]+2) == uint32(@flow_cow[f]+40)
              )
            ))
        }
