defaults:
  for:
    - "pe"
  platforms:
    - "windows"
  arch:
    - "x86"
traits:
  - id: "x86-pid-matched-kernel-attach-terminate"
    desc: "PID match attaches and terminates in kernel"
    crit: "suspicious"
    conf: 0.98
    if:
      type: "yara"
      source: |
        import "pe"
        rule x86_pid_matched_kernel_attach_terminate {
          strings:
            $kill = { 3B D7 75 ?? 3B F3 74 ?? 56 FF 15 ?? ?? ?? ?? 53 53 FF 15 ?? ?? ?? ??
                      89 45 ?? FF 15 ?? ?? ?? ?? }
            $input = { 83 7D 0C 04 75 ?? 8B 45 08 8B 38 33 DB }
          condition:
            pe.is_pe and pe.imports("ntoskrnl.exe", "KeAttachProcess") and
            pe.imports("ntoskrnl.exe", "ZwTerminateProcess") and
            pe.imports("ntoskrnl.exe", "KeDetachProcess") and
            for any k in (1..#kill) : (
              uint32(@kill[k]+11) == pe.image_base+pe.import_rva("ntoskrnl.exe", "KeAttachProcess") and
              uint32(@kill[k]+19) == pe.image_base+pe.import_rva("ntoskrnl.exe", "ZwTerminateProcess") and
              uint32(@kill[k]+28) == pe.image_base+pe.import_rva("ntoskrnl.exe", "KeDetachProcess") and
              for any i in (1..#input) : (@input[i] < @kill[k] and @kill[k]-@input[i] < 128)
            )
        }
  - id: "x86-caller-configured-kernel-process-layout"
    desc: "Caller supplies kernel process layout offsets"
    crit: "notable"
    conf: 0.98
    if:
      type: "yara"
      source: |
        rule x86_caller_configured_kernel_process_layout {
          strings:
            $layout = { 83 7C 24 04 20 75 ?? 8B 08 89 0D ?? ?? ?? ??
                        8B 48 04 89 0D ?? ?? ?? ?? 8B 48 08 89 0D ?? ?? ?? ??
                        8B 48 0C 89 0D ?? ?? ?? ?? 8B 48 10 89 0D ?? ?? ?? ??
                        8B 48 14 89 0D ?? ?? ?? ?? 8B 48 18 89 0D ?? ?? ?? ??
                        8B 40 1C A3 ?? ?? ?? ?? }
          condition:
            $layout
        }
