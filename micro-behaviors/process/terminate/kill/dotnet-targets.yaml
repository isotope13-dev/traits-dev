defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: dotnet-kill-member-reference
    desc: .NET Process.Kill member reference
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)System\.Diagnostics\.Process(::|\.)Kill(\b|\()'

  # terminate-process-name-text lives in traits.yaml: its regex matches the
  # bare Win32 API name anywhere in a binary's strings, in any language, so it
  # is not a .NET-specific observation. The .NET context in the composites that
  # use it comes from their metadata/lang/compiler/managed::dotnet-assembly leg.

  - id: dotnet-msbuild-killer-helper-class
    desc: .NET MSBuild killer helper class
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: KillProceTarget
