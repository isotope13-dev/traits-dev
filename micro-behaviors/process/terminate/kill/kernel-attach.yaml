# A privileged termination capability. This API profile alone establishes no
# victim selection, unauthorized caller, or autonomous malicious action.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: kernel-attach-process-termination-profile
    desc: Kernel attachment and termination API profile
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/os/kernel/device::create-device-object
      - id: micro-behaviors/process/attach/address-space::attach-process-address-space
      - id: micro-behaviors/process/attach/address-space::detach-process-address-space
      - id: micro-behaviors/process/terminate/kill::zw-terminate-process
