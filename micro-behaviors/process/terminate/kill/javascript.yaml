# Process Termination - JavaScript
# Capabilities related to killing processes in JavaScript
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-sigsegv-kill
    desc: Node self-SIGSEGV call text
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'process\.kill\(process\.pid,\s*[''"]SIGSEGV[''"]\)'
    unless:
      - id: well-known/tool/development/observability/datadog-system-tests::system-tests-path
      - id: metadata/package/testing/harness/unit::javascript-vitest-unit-test-context
    downgrade:
      any:
        - id: metadata/package/testing/harness/fixture::tap-child-sigsegv-test
        - id: metadata/package/testing/assertion::tap-child-signal-test
        - id: metadata/package/testing/assertion::tap-child-signal-ok-test
  - id: js-sigkill-process
    desc: Node sends SIGKILL to process
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'process\.kill[\s\S]{0,120}[''\"]SIGKILL[''\"]'
    unless:
      - type: text
        regex: 'owned daemon process|DaemonProcess|shutdownDaemon|this\.process'
      - id: metadata/package/files/dependency::node-modules-path
