defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # Walk a DWORD PID vector and submit each PID and the AppRemover terminate
  # IOCTL to the same helper. This establishes termination capability, not the
  # identities of the selected processes or an EDR-disabling objective.
  - id: x86-appremover-pid-loop
    desc: AppRemover PID termination loop
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'FF 37 68 31 00 42 02 53 E8 ?? ?? ?? ?? 8B 45 ?? 8D 7F 04 83 C4 0C 40 89 45 ?? 3B C6 75 ??'
