defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.94

traits:
  - id: android-kill-background-processes-api
    desc: Android API terminates background processes
    if:
      type: text
      exact: killBackgroundProcesses
  - id: dex-kill-background-processes-call
    desc: DEX calls background process termination
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Landroid/app/ActivityManager;->killBackgroundProcesses'
