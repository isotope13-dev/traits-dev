# Python process termination APIs.  Target selection belongs in objectives;
# this file records only the capability to terminate a process.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-process-kill-call
    desc: Python calls a process kill method
    if:
      type: symbol
      kind: call
      regex: '(^|\.)kill$'
  - id: python-subprocess-taskkill-explorer
    desc: Python subprocess taskkill on explorer.exe
    crit: notable
    conf: 0.95
    platforms: [windows]
    if:
      type: text
      regex: '(?i)["'']taskkill["''][\s\S]{0,80}["'']/im["''][\s\S]{0,40}["'']explorer\.exe["'']'
