# Python process termination APIs.  Target selection belongs in objectives;
# this file records only the capability to terminate a process.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  # `.kill()` is not a process API by itself: gevent greenlets, eventlet
  # green threads and many job objects expose it too (pychrome's
  # `self.recv_gr.kill()`). The receiver is only a process when the file can
  # obtain one, so the method call is a fragment of python-process-kill-call.
  - id: python-kill-method-call
    desc: Python calls a .kill() method
    crit: component
    if:
      type: symbol
      kind: call
      regex: '(^|\.)kill$'
    not:
      - regex: '^os\.kill$'
  # os.kill / os.killpg is micro-behaviors/process/control/signal::
  # python-os-kill-call (notable); the method form below excludes it.
  - id: python-process-object-module-import
    desc: Imports a module that yields process objects
    crit: component
    if:
      type: symbol
      kind: import
      regex: '^(subprocess|psutil|multiprocessing|pexpect)$'
  # python-subprocess-taskkill-explorer folded into the canonical, language-
  # neutral micro-behaviors/process/terminate/command::taskkill-explorer-force,
  # which now accepts the argv-list spelling this one was written for.

composite_rules:
  - id: python-process-kill-call
    desc: Python kills a subprocess or psutil process
    all:
      - id: python-kill-method-call
      - id: python-process-object-module-import
