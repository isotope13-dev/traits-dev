# Python process termination APIs.  Target selection belongs in objectives;
# this file records only the capability to terminate a process.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-process-kill-call
    desc: Python calls a process kill method
    if:
      type: symbol
      kind: call
      regex: '(^|\.)kill$'
  # python-subprocess-taskkill-explorer folded into the canonical, language-
  # neutral micro-behaviors/process/terminate/command::taskkill-explorer-force,
  # which now accepts the argv-list spelling this one was written for.
