# API co-occurrence establishes capabilities, not a phone-home backdoor.
defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: unsigned-process-kill-http-api-set
    desc: Unsigned PE process-kill and HTTP API set
    crit: notable
    conf: 0.94
    attack: T1057,T1071.001
    all:
      - id: micro-behaviors/process/enumerate/snapshot::dynamic-toolhelp-process-traversal
      - id: micro-behaviors/process/terminate/kill::terminate-process-name-text
      - id: micro-behaviors/communications/http/dynamic::dynamic-wininet-http-api-cluster
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/

