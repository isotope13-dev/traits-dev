defaults:
  platforms: [linux, macos, windows]
  for: [shell, python, javascript, powershell, batch, pe]
traits:
  - id: mssql-kill-reference
    desc: Kill text near MSSQL
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: (?i)\bkill\b[^\n]{0,30}\bmssql\b
    not:
      - regex: '(?i)(docker|podman|\$CONTAINER\w*)\s+kill\b'
