defaults:
  platforms: [windows]
  crit: notable
  conf: 0.95
composite_rules:
  # Command strings alone are useful evidence, but an inert PE containing
  # only prose and commands has no demonstrated process-launch capability.
  - id: native-explorer-taskkill-launch-clues
    desc: Explorer taskkill text with process-launch API
    for: [pe, dll]
    all:
      - id: micro-behaviors/process/terminate/command::taskkill-explorer-force
    any:
      - id: metadata/binary/symbols/name/process::create-process-a
      - id: metadata/binary/symbols/name/process::create-process-w
      - id: metadata/binary/symbols/name/process::winexec
      - id: micro-behaviors/os/handler/open::win-shellexecute
  - id: script-explorer-taskkill-command
    desc: Explorer kill text with script launch evidence
    for: [scripts, pyc, class]
    all:
      - id: micro-behaviors/process/terminate/command::taskkill-explorer-force
    any:
      - id: micro-behaviors/process/terminate/command::taskkill-command-call
      - id: micro-behaviors/process/create/exec::child-process-execution
  - id: explorer-taskkill-execution-clues
    desc: Explorer taskkill script or native launch clues
    for: [scripts, binaries]
    any:
      - id: script-explorer-taskkill-command
      - id: x86-winexec-explorer-command
