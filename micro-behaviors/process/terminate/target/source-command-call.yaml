defaults:
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: python-explorer-taskkill-string-call
    desc: Python shell call targets Explorer with taskkill
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os\.system|subprocess\.(run|call|Popen))$'
      arg:
        index: 0
        kind: string
        regex: '(?i)^\s*taskkill(\.exe)?\b.{0,100}/im\s+explorer\.exe\b'
  - id: batch-explorer-taskkill-statement
    desc: Batch command requests forced Explorer stop
    for: [batch]
    if:
      type: text
      regex: '(?im)^[ \t]*@?taskkill(\.exe)?\s+/f\s+/im\s+explorer\.exe\b'
