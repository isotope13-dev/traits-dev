# The co-occurring API and name references suggest security-process targeting;
# they do not establish which process the APIs terminate.
composite_rules:
  - id: security-name-enumeration-termination-api-profile
    desc: Security names with process-management APIs
    crit: notable
    conf: 0.85
    for: [pe, dll]
    platforms: [windows]
    attack: "T1057"
    mbc: "B0036"
    all:
      - id: micro-behaviors/os/security/product::security-process-name-reference
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
      - id: micro-behaviors/process/enumerate/snapshot::process32-first
      - id: micro-behaviors/process/terminate/kill::terminate-process
