# A stop command can target the caller's own miner or an administrator's miner.
# Rival-bot intent must be established by a consuming objective.
defaults:
  platforms: [unix, android, ios]
  for: [elf, shell]
traits:
  - id: xmrig-termination-command
    desc: Shell command targets XMRig for termination
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(kill|pkill|killall)\b.{0,80}\bxmrig'
