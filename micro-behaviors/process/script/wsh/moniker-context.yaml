# A script URL and GetObject can coexist without binding that URL to the
# variable call. The direct GetObject URL-moniker atom is separate.
defaults:
  platforms: [windows]
  for: [vbs, batch, javascript, html]
  attack: T1059.005

composite_rules:
  - id: wsh-getobject-script-url-profile
    desc: Script URL moniker with GetObject clues
    crit: suspicious
    conf: 0.95
    for: [batch, javascript, vbs]
    all:
      - id: micro-behaviors/process/script/wsh::script-moniker-url
    any:
      - id: micro-behaviors/process/script/wsh::wsh-getobject-variable-argument
      - id: micro-behaviors/process/script/wsh::wsh-getobject-url-moniker
