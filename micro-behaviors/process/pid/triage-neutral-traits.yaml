---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
traits:
- id: node-pidfile-reference
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: References PID file or background process ID
  if:
    type: text
    regex: (?i)(writeFileSync\(\s*\w{0,24}pid|['"][^'"]{0,50}\.pid['"]|backgroundProcessId\b)
