defaults:
  platforms: [windows, unix]
  for: [c]

traits:
  - id: fixed-pid-comparison
    desc: Compares PID variable to fixed constant
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '\bpid\s*==\s*(0x[0-9A-Fa-f]{3,8}|[1-9][0-9]{3,8})'

  - id: node-ppid-comparison
    desc: Compares Node parent PID in an expression
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: tree-sitter
      language: javascript
      node: binary_expression
      regex: 'process[.]ppid[[:space:]]*[!=]={1,2}|[!=]={1,2}[[:space:]]*process[.]ppid'

