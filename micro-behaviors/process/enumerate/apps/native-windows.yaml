defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.96

traits:
  - id: native-microsoft-process-target-cluster
    desc: Three Microsoft executable targets
    attack: T1057
    if:
      type: raw
      regex: 'Microsoft\\[A-Za-z0-9 _.()-]{1,48}\\[A-Za-z0-9 _.()-]{1,96}\.exe'
      case_insensitive: true
    count_min: 3
