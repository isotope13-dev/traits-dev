# Process-name references for high-value client applications: database
# clients, SSH/terminal clients, and desktop cryptocurrency wallets. Targeted
# implants enumerate the running process list for these to decide whether a
# host is worth infecting (developer / operator / crypto-holder machines).
# Each name is a neutral discovery reference; the objective composites supply
# the enumeration + gating context.
defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1057
  mbc: E1592
  crit: notable
  conf: 0.85

traits:
  - id: db-client-navicat-process
    desc: Navicat database client process name
    if:
      type: text
      regex: '(?i)(^|[\s"''(\[/\\])navicat(\.exe)?([\s"'')\]]|$)'

  - id: db-client-dbeaver-process
    desc: DBeaver database client process name
    if:
      type: text
      regex: '(?i)(^|[\s"''(\[/\\])dbeaver(64)?(\.exe)?([\s"'')\]]|$)'

  # `.exe` is mandatory here, unlike its siblings: bare `xshell` is also a
  # Stata command abbreviation, so highlight.js's Stata keyword list read as an
  # SSH-client process reference. The implant-side form is always the image
  # name `Xshell.exe`.
  - id: ssh-client-xshell-process
    desc: Xshell SSH client process name
    if:
      type: text
      regex: '(?i)(^|[\s"''(\[/\\])xshell\.exe([\s"'')\]]|$)'

  - id: ssh-client-mobaxterm-process
    desc: MobaXterm SSH client process name
    if:
      type: text
      regex: '(?i)(^|[\s"''(\[/\\])mobaxterm(\.exe)?([\s"'')\]]|$)'

  - id: ssh-client-securecrt-process
    desc: SecureCRT SSH client process name
    if:
      type: text
      regex: '(?i)(^|[\s"''(\[/\\])securecrt(\.exe)?([\s"'')\]]|$)'

  - id: wallet-exodus-process
    desc: Exodus desktop wallet process name
    attack: T1057,T1005
    if:
      type: text
      regex: '(?i)(^|[\s"''(\[/\\])exodus\.exe([\s"'')\]]|$)'

  - id: wallet-ledger-live-process
    desc: Ledger Live desktop wallet process name
    attack: T1057,T1005
    if:
      type: text
      regex: '(?i)(^|[\s"''(\[/\\])ledger live(\.exe)?([\s"'')\]]|$)'

composite_rules:
  - id: high-value-client-app-targets
    desc: References two or more high-value client applications
    crit: notable
    conf: 0.85
    scope: file
    # Minified bundles collapse unrelated modules onto one line, so line
    # proximity alone can join an IDE inventory with a distant wallet-brand
    # list. Real process-target clusters keep their image names together.
    near_bytes: 4096
    near_lines: 30
    needs: 2
    any:
      - id: db-client-navicat-process
      - id: db-client-dbeaver-process
      - id: ssh-client-xshell-process
      - id: ssh-client-mobaxterm-process
      - id: ssh-client-securecrt-process
      - id: wallet-exodus-process
      - id: wallet-ledger-live-process
      - id: micro-behaviors/process/enumerate/apps::dev-apps-intellij
