# PATH probes for the CLI launcher of a VS Code-family editor.
#
# Each atom is one `which`/`where <cli>` probe — the neutral "is this editor
# installed?" question a devcontainer or a doctor command also asks. Splitting
# the family into separate atoms lets an objective require distinct editors.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell, batch, powershell, python]
  crit: notable
  conf: 0.9

traits:
  - id: vscode-cli-path-probe
    desc: Probes PATH for the VS Code CLI
    if:
      type: text
      regex: '\b(which|where)\s+code(-insiders)?\b'

  - id: vscodium-cli-path-probe
    desc: Probes PATH for the VSCodium CLI
    if:
      type: text
      regex: '\b(which|where)\s+(vs)?codium\b'

  - id: vscode-fork-cli-path-probe
    desc: Probes PATH for a VS Code fork
    if:
      type: text
      regex: '\b(which|where)\s+(cursor|windsurf|positron)\b'

  # Bundled stagers commonly construct `which <name> --...` from fragments,
  # so the literal command is not present as one token. This remains a
  # neutral process-discovery capability; editor identity is separate below.
  - id: cli-path-probe-command-builder
    desc: Builds a which CLI path-probe command
    if:
      type: text
      regex: "['\"]which['\"]\\s*\\+\\s*['\"]\\\\x20['\"]"

  - id: vscode-cursor-cli-identifier
    desc: Constructs the Cursor editor CLI identifier
    if:
      type: text
      regex: "['\"]curso['\"]\\s*\\+\\s*['\"]r['\"]"

  - id: vscodium-cli-identifier
    desc: Constructs the VSCodium editor CLI identifier
    if:
      type: text
      regex: '(?i)SCodi[\s\S]{0,600}ium'
