defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
- id: peb-toolhelp-api-profile
  desc: PEB access and Toolhelp export-lookup references
  # PEB access plus process enumeration is a generic runtime capability.
  # Hostile objectives add injection, evasion, or targeting context.
  crit: notable
  conf: 0.85
  size_min: 65536
  all:
    - id: micro-behaviors/process/info/query::peb-access-x86
    - id: micro-behaviors/process/enumerate/snapshot::toolhelp-names-with-export-lookup
