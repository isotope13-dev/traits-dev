defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: security-product-process-api-profile
  desc: Security names with enumeration/termination APIs
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/os/security/product::chinese-av-product-extended
  - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
  - id: micro-behaviors/process/terminate/kill::terminate-process

# Enumeration plus a product reference does not establish teardown or even
# that the named process is selected. Keep the co-occurrence as a capability.
- id: toolhelp-enumeration-with-defender-reference
  desc: Toolhelp enumeration with Defender image reference
  crit: notable
  conf: 0.94
  for: [c]
  all:
  - id: micro-behaviors/os/security/product::defender-engine-process-reference
  - id: toolhelp-process-enumeration-source
