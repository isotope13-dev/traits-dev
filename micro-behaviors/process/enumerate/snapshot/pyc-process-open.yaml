    type: yara
    source: "rule pyc_api_profile {\n  strings:\n    $s0 = \"CreateToolhelp32Snapshot\"\n    $s1 = \"Process32FirstW\"\n    $s2 = \"Process32NextW\"\n    $s3 = \"\
      OpenProcess\"\n  condition: all of them\n}"
