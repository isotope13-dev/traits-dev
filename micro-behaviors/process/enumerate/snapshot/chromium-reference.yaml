defaults:
  platforms: [windows]

composite_rules:
  - id: snapshot-with-chromium-library-reference
    for: [pe]
    desc: Process snapshot API with a Chromium library reference
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/process/enumerate/snapshot::create-toolhelp32-snapshot
      - id: micro-behaviors/fs/path/application/browser::chromium-main-library-name
    unless:
      # libcef names its own library and snapshots processes as the broker.
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-capability-context
