defaults:
  platforms: [unix]
  for: [elf, macho]
  crit: notable
  conf: 0.85
  attack: T1057

traits:
  # Native binaries pass ps a fixed column list to read pid, parent, owner
  # and command. The bare ps invocation is covered by the rust-ps-command
  # trait; this one catches an absolute /bin/ps path with the column format.
  - id: ps-pid-ppid-user-comm-format
    desc: ps pid,ppid,user,comm column format
    if:
      type: text
      substr: 'pid=,ppid=,user=,comm='
