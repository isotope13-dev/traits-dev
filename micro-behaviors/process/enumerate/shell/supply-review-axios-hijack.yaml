defaults:
  platforms:
    - windows
    - linux
    - macos
  size_max: 5000000

traits:
  - id: macho-ps-user-pid-command-text
    desc: Mach-O references ps process-list command
    crit: notable
    conf: 0.6
    for:
      - macho
    if:
      type: text
      substr: "ps -eo user,pid,command"
      section: rdata
