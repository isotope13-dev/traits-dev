defaults:
  platforms: [windows]
  for: [powershell, batch, python, javascript]
traits:
  - id: powershell-taskmgr-query
    desc: PowerShell queries Task Manager process
    crit: notable
    conf: 0.95
    attack: T1057
    if:
      type: text
      regex: '(?i)\bGet-Process\s+(-Name\s+)?["'']?taskmgr(\.exe)?\b'
