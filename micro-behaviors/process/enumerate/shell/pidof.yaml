defaults:
  crit: notable
  conf: 0.95
  for:
  - shell
  platforms:
  - linux
traits:
- id: shell-pidof-invocation
  desc: Shell invokes pidof process query
  if:
    type: symbol
    kind: call
    regex: ^(pidof|"pidof"|'pidof')$
  unless:
  - type: symbol
    kind: function
    exact: pidof
  - id: metadata/lang/source::shell-parser-recovery-node
