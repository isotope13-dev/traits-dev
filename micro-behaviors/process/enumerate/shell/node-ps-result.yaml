defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.98
traits:
- id: node-ps-base64-result
  desc: Returns Base64-encoded ps stdout through helper
  if:
    type: tree-sitter
    query: |
      (
        (call_expression
          function: (member_expression property: (property_identifier) @exec)
          arguments: (arguments
            .
            (string (string_fragment) @command)
            [
              (arrow_function
                parameters: (formal_parameters . (identifier) . (identifier) @out)
                body: (statement_block
                  (expression_statement
                    (call_expression
                      function: (identifier)
                      arguments: (arguments
                        (_)
                        *
                        (object
                          (pair
                            key: (property_identifier) @data
                            value: (call_expression
                              function: (member_expression
                                object: (call_expression
                                  function: (member_expression
                                    object: (identifier) @bufferP
                                    property: (property_identifier) @fromP)
                                  arguments: (arguments
                                    (binary_expression
                                      left: (identifier) @out_use
                                      operator: "||")))
                                property: (property_identifier) @strP)
                              arguments: (arguments
                                (string
                                  (string_fragment) @b64P))))))))))
              (function_expression
                parameters: (formal_parameters . (identifier) . (identifier) @out)
                body: (statement_block
                  (expression_statement
                    (call_expression
                      function: (identifier)
                      arguments: (arguments
                        (_)
                        *
                        (object
                          (pair
                            key: (property_identifier) @data
                            value: (call_expression
                              function: (member_expression
                                object: (call_expression
                                  function: (member_expression
                                    object: (identifier) @bufferP
                                    property: (property_identifier) @fromP)
                                  arguments: (arguments
                                    (binary_expression
                                      left: (identifier) @out_use
                                      operator: "||")))
                                property: (property_identifier) @strP)
                              arguments: (arguments
                                (string
                                  (string_fragment) @b64P))))))))))]))
        (#eq? @exec "exec")
        (#match? @command "^ps[ \t]+(aux|-ef|-A|-e)")
        (#eq? @out @out_use)
        (#eq? @data "data")
        (#eq? @bufferP "Buffer")
        (#eq? @fromP "from")
        (#eq? @strP "toString")
        (#eq? @b64P "base64"))
