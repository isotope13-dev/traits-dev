defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
  crit: notable
  conf: 0.6
  attack: T1057
traits:
  - id: ps-stat-comm-listing
    desc: ps lists process state and command
    platforms: [unix]
    for: [shell]
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: ps
      arg:
        kind: identifier
        name: stat=,comm=
  - id: awk-comm-name-filter
    desc: awk filters process command name
    platforms: [unix]
    for: [shell]
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: awk
      arg:
        kind: string
        exact: "$2 == name"
  - id: awk-zombie-state-filter
    desc: awk filters zombie process state
    platforms: [unix]
    for: [shell]
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: awk
      arg:
        kind: string
        exact: "$1 !~ /^Z/"
  - id: awk-multi-field-process-filter
    desc: awk selects processes on two fields
    crit: notable
    conf: 0.88
    if:
      # `awk '$11 ~ /-bash/ && $8 ~ /Ssl/'` -- two positional-field regex
      # tests joined by AND over `ps` output. Narrowing on a second column
      # means the command name alone was not a precise enough selector, which
      # is the shape of hunting for one specific process among lookalikes.
      type: text
      regex: '\$[0-9]{1,2}\s*~\s*/[^/\n]{1,16}/\s*&&\s*\$[0-9]{1,2}\s*~'
  # The three `ps` matchers below scan raw text, so a doc comment that merely
  # NAMES the command counted as running it. Measured on codeam-cli
  # `pair-auto.ts`, whose JSDoc says the token is passed by file "to keep it out
  # of `ps -ef`" — a sentence about AVOIDING process-list exposure scored both
  # ps-ef and ps-list-command, and ps-list-command is a required `all:` leg of
  # the hostile objectives/discovery/process/enumerate::ts-process-inventory.
  #
  # Fix: capture the rest of the line into the match so `not:` can see it (a
  # bare `not:` is shown only the matched text, not its context), then drop
  # matches whose line begins with a comment leader — `*` for a JSDoc/block
  # continuation, `//` for JS/TS, `#` for shell/Python/Perl/Ruby.
  #
  # The trailing `.{200}ps …` alternative keeps long minified lines detectable:
  # `(?m)^[^\n]{0,200}` can only reach 200 characters past a line start, so
  # without it a bundled one-liner would silently stop matching. That branch
  # starts mid-line, so the comment-leader filter never applies to it. This is
  # the same anchored-prefix style `tasklist` already uses in this file.
  - id: ps-aux
    desc: ps aux command
    if:
      type: text
      regex: '(?m)^[^\n]{0,200}ps aux|.{200}ps aux'
    not:
      - regex: '^\s*(\*|//|#)'
    unless:
      - id: metadata/document/html/
  - id: ps-ef
    desc: ps -ef command
    if:
      type: text
      regex: '(?m)^[^\n]{0,200}ps -ef|.{200}ps -ef'
    not:
      - regex: '^\s*(\*|//|#)'
    unless:
      - id: metadata/document/html/
  # Distinct ps listing flags not already covered by ps-aux ("ps aux") or
  # ps-ef ("ps -ef") — avoids double-matching the same command.
  - id: ps-listing-flags
    desc: ps process listing via -aux/-A/-e flags
    platforms: [unix]
    if:
      type: text
      regex: \bps\s+(-aux|-A|-e\b)
    unless:
      - id: metadata/document/html/
  # Same comment-leader fix as ps-aux/ps-ef above. No long-line alternative here
  # because the alternation budget is already spent on the four flag spellings;
  # the two that matter on a minified line, `ps -ef` and `ps aux`, keep their
  # own `.{200}` branch in the atoms above.
  - id: ps-list-command
    desc: ps process listing command
    platforms: [unix]
    conf: 0.92
    if:
      type: text
      regex: '(?m)^[^\n]{0,200}ps (-e -o pid,ppid,comm,args|-ef|aux|-al)'
    not:
      - regex: '^\s*(\*|//|#)'
    unless:
      - id: metadata/document/html/
  - id: ps-grep-filter
    desc: ps process listing filtered through grep
    platforms: [unix]
    conf: 0.85
    if:
      type: text
      regex: ps\s+(-ef|-aux)[^|]{0,30}\|[^|]{0,50}grep
    unless:
      - id: well-known/app/utility/ventoy/
  - id: pgrep-cmd
    desc: pgrep process search command
    platforms: [unix]
    if:
      type: text
      regex: \bpgrep\s+(-[a-zA-Z]+\s+)?["']?[A-Za-z]
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: ps-eo-user-pid-cmd
    desc: ps -eo user,pid,command process list
    if:
      type: text
      substr: "ps -eo user,pid,command"
    unless:
      - id: metadata/document/html/
  - id: ps-current-user-process-list
    desc: Lists the current user's processes with ps
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [shell]
    if:
      type: text
      regex: '\$\(\s*ps\s+-u\s+["'']?\$\{?USER\}?["'']?\s*(\||\))'
  # Command-name-only inventory (`ps -eo comm=`) used by install-time
  # recon implants that avoid full command lines. Catches future npm
  # preinstall process fingerprinting without hardcoding package names.
  - id: ps-eo-comm
    desc: ps -eo comm process-name list
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [scripts, binaries]
    if:
      type: text
      regex: 'ps\s+-eo\s+comm=?'
    unless:
      - id: metadata/document/html/
  - id: busybox-ps-encoded
    desc: XOR-obfuscated busybox ps command
    platforms:
      - unix
      - android
    for:
      - elf
    crit: notable
    conf: 0.82
    if:
      type: hex
      section: .rodata
      pattern: 7B 36 3D 3A 7B 36 21 27 2D 36 3B 2C 74 24 27 54
  - id: tasklist
    desc: Invokes the Windows tasklist command
    platforms:
      - windows
    for: [scripts, binaries]
    if:
      # Require a command-token boundary before `tasklist` that is NOT `/` or `.` — the
      # Windows command never has a leading slash. Excludes URL/REST path segments like
      # `/tasklist` (an API endpoint) and member access `x.tasklist`, while still matching
      # `tasklist`, `tasklist /svc`, and `tasklist.exe`. Do not treat a quoted
      # UI/icon label such as `"tasklist",` as a command; require whitespace,
      # a shell operator, or end-of-command after the token. This also filters
      # REST/UI strings that merely name the Windows command.
      type: text
      regex: '(?m)(^|[^/.\w])tasklist(\.exe)?([ \t]+/[A-Za-z]|[ \t]*[;&|>]|[ \t]*$)'
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
    downgrade:
      any:
        - id: metadata/binary/resource/
