# Neutral observations separated from attacker or product inferences.
composite_rules:
- id: tasklist-near-application-names
  desc: Tasklist reference near application name references
  crit: notable
  conf: 0.85
  scope: file
  all:
  - id: micro-behaviors/process/enumerate/shell::tasklist
  any:
  - id: micro-behaviors/os/application/target/browser::browser-apps
  - id: micro-behaviors/os/application/target/productivity::office-apps
  - id: micro-behaviors/os/application/target/development::dev-apps
  platforms:
  - unix
  - windows
  - macos
  for:
  - scripts
  - binaries
  near_bytes: 512
