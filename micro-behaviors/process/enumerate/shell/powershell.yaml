defaults:
  platforms: [windows, unix]
  for: [powershell, python]
traits:
  - id: get-process-by-name
    desc: PowerShell selects a process by name
    crit: notable
    conf: 0.9
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)\bGet-Process\s+-Name\s+["'']?[A-Za-z0-9_. -]+["'']?'

  - id: low-process-count
    desc: Check for low number of processes
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: '\(Get-Process\)\.Count\s*<\s*(30|50)'
