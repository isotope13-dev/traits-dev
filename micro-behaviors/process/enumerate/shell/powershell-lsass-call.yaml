defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
traits:
  - id: powershell-lsass-process-query-call
    desc: Get-Process selects LSASS in executable code
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(?i)^Get-Process$'
      arg:
        kind: identifier
        name: lsass
