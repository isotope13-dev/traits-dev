# CSV no-header output flags used by Windows CLI tools (e.g. tasklist, whoami)
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: node-sea-process-list-flags
    desc: Windows CSV no-header CLI flags
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: '"/fo","csv","/nh"'
