defaults:
  platforms: [windows]
  for: [powershell, html]
traits:
  - id: powershell-get-process-lsass
    desc: PowerShell queries the LSASS process
    crit: notable
    conf: 0.96
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '(?i)Get-Process\s+(-\w+\s+)?lsass\b'

