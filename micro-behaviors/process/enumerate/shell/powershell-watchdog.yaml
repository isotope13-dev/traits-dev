defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-process-query-empty-check
    desc: Named process query near empty-array check
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)Get-Process\s+-Name\s+\S+.{0,90}\$\w+\.(Length|Count)\s+-eq\s+0'
