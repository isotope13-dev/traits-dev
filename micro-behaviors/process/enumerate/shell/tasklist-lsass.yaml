defaults:
  platforms: [windows]
  for: [scripts]

traits:
  - id: tasklist-lsass-filter
    desc: tasklist filters for lsass.exe
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\btasklist\b[^\r\n]{0,80}\blsass\.exe\b'


  # The two shapes that capture the LSASS PID into a variable for later use,
  # as opposed to a bare `tasklist /fi "imagename eq lsass.exe"` query.
  - id: tasklist-pipe-findstr-lsass
    desc: tasklist piped to find for lsass
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\btasklist\b.{0,60}\^?\|\s*find(str)?\b.{0,30}\blsass'

  - id: for-f-tasklist-lsass-pid-capture
    desc: Loop captures LSASS PID from tasklist
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bfor\s+/f\b.{0,40}\btasklist\b.{0,80}\blsass'
