defaults:
  crit: notable
  platforms: [windows]
  for: [binaries, scripts, source]
traits:
  - id: powershell-get-process-query
    desc: Queries processes with Get-Process
    conf: 0.88
    for: [powershell]
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '(?i)\bGet-Process\b'

composite_rules:
- id: windows-process-query-reference
  desc: Windows process-query command references
  conf: 0.9
  any:
    - id: micro-behaviors/process/enumerate/shell::tasklist
    - id: micro-behaviors/process/enumerate/shell::powershell-get-process-query
