# The BSD/Darwin kernel process-table interface: sysctl with a
# {CTL_KERN, KERN_PROC, KERN_PROC_ALL} MIB returns an array of `kinfo_proc`
# describing every process on the host.  This is the documented way to list
# processes on macOS/iOS/*BSD -- `ps`, `top`, Activity Monitor, and every
# neofetch-style system-info tool read it -- so it is a neutral capability.
# Reconnaissance intent comes from what the caller does with the list
# (matching it against target applications, security products, or a kill
# list); those composites live in objectives/discovery/ and objectives/impact/
# and reference these atoms.
defaults:
  platforms: [unix, ios]
  for: [zig, c, cpp, objectivec, swift, rust, go]
  attack: T1057
  crit: notable

traits:
  # The selector has to appear in an expression -- assigned into a MIB slot,
  # listed in a MIB initializer, or passed as an argument -- for the process
  # table to actually be requested. A bare substring also matched the line that
  # *defines* the constant, `#define KERN_PROC_ALL 0`, which every BSD/Darwin
  # `sys/sysctl.h` carries: the Zig toolchain alone ships four copies, and so
  # does every vendored SDK, libc binding and header tree. The optional
  # qualifier prefix keeps `libc::KERN_PROC_ALL` and `syscall.KERN_PROC_ALL`.
  - id: kern-proc-all-mib
    desc: Requests process table via sysctl KERN_PROC_ALL
    conf: 0.9
    if:
      type: text
      regex: '[=,{(]\s*[\w.:]{0,16}KERN_PROC_ALL\b'

  # Named for what the matcher finds. A type name in the text says the BSD
  # process-record type is referenced; it does not say a record was read, and
  # on `sys/user.h` / `libutil.h` / `kvm.h` the reference *is* the declaration
  # of the type. Callers that genuinely walk the table pair this with the MIB
  # atom above, which is where the "requests the table" claim lives.
  - id: kinfo-proc-struct
    desc: References the BSD kinfo_proc record type
    conf: 0.9
    if:
      type: text
      # `struct kinfo_proc` in C; Zig's translate-c renames it to
      # `struct_kinfo_proc`, and Rust/Go libc bindings drop the tag entirely.
      regex: '\bstruct[ _]kinfo_proc\b'
