defaults:
  # Linux kernel-module headers — linux-only by definition.
  platforms: [linux]
  for:
    - c

traits:
  - id: for-each-process-macro-call
    desc: Invokes for_each_process iterator
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: for_each_process
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/lang/upstream::linux-kernel-source-tree-path
      - id: well-known/tool/development/toolchain/binutils-gdb-source::source-archive-member
