defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, c, cpp]
composite_rules:
  - id: handle-enum-and-classify
    desc: Handle enumeration with file type filtering
    conf: 0.85
    all:
      - id: micro-behaviors/process/enumerate/handle::get-process-handles
    any:
      - id: micro-behaviors/process/fd/query::is-file-object
      - id: micro-behaviors/process/fd/query::is-disk-file
      - id: micro-behaviors/process/fd/query::get-file-path-from-handle
    needs: 2
