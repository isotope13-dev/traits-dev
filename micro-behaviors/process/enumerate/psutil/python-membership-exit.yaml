defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-process-membership-exit-loop
    desc: Process enumeration loop exits on membership
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((for_statement
          right: (call function: (attribute
            object: (identifier) @module
            attribute: (identifier) @enumerator))
          body: (block (if_statement
            condition: (_) @condition
            consequence: (block (expression_statement
              (call function: (attribute
                object: (identifier) @sys
                attribute: (identifier) @exit))))))) @gate
          (#eq? @module "psutil")
          (#eq? @enumerator "process_iter")
          (#match? @condition "\\bin\\b")
          (#eq? @sys "sys")
          (#eq? @exit "exit"))
