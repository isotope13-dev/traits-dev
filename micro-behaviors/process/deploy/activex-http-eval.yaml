defaults:
  platforms: [windows]
  for: [javascript]

composite_rules:
- id: activex-http-response-eval
  desc: ActiveX HTTP client with response evaluation
  crit: notable
  conf: 0.98
  near_bytes: 2048
  unless:
  - id: well-known/lib/web/client-side/browser-libraries::dojo-toolkit-library
  - id: well-known/lib/web/authoring/syntaxhighlighter::shjs-syntax-highlighter
  - id: well-known/lib/format/ejs::ejs-legacy-browser-loader
  - id: well-known/app/publishing/tribalfusion::tribalfusion-ad-tag-script
  - id: micro-behaviors/communications/http/url/tld::reserved-documentation-tld-url
  - id: micro-behaviors/communications/http/client/xmlhttp::native-xhr-activex-fallback
  all:
  - id: micro-behaviors/os/com/automation::activex-constructor-call
  - id: micro-behaviors/process/interpreter/eval/direct::js-eval-response-text
  any:
  - id: micro-behaviors/communications/http/client/xmlhttp::msxml-xmlhttp-progid-text
  - id: micro-behaviors/communications/http/client/xmlhttp::http-client-msxml-serverxmlhttp-progid
  - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-open
  - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-open-obfuscated-method
  - id: micro-behaviors/communications/http/client/xmlhttp::js-xmlhttp-send
  needs: 1
