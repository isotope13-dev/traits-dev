defaults:
  platforms: [windows]
  for: [powershell, batch]

composite_rules:
  - id: powershell-download-extract-and-execute
    desc: PowerShell fetch, extract, and launch co-occur
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/download/cli::powershell-remote-file-fetch-reference
      - id: micro-behaviors/data/archive/extract/capability::powershell-archive-extract
    any:
      - id: micro-behaviors/process/create/start-process::start-process-call
      - id: micro-behaviors/process/create/exec::powershell-call-exe
    near_lines: 40
    unless:
      - id: well-known/tool/sysadmin/microsoft-powershell::powershell-download-archive-known-installer-context
      - id: well-known/lib/data/adios2::adios2-windows-ci-setup-context
      - id: well-known/app/system/aptl/
      - id: well-known/tool/sysadmin/kubernetes/bootstrap::kubernetes-windows-gce-ssh-installer-exception
      # Tirith release QA expands its own artifact and asserts blocks.
      - id: well-known/tool/detection/tirith::tirith-defensive-scanner-context
      - id: well-known/lib/runtime/scripted/nvidia-cuda::cuda-toolkit-installer-script
    downgrade:
      any:
        - id: micro-behaviors/crypto/hash/file::powershell-file-hash-compare

