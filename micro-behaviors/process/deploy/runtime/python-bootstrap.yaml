# API co-occurrence, without claiming a downloaded value reaches execution.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: interpreter-download-exec-api-profile
    desc: Python distribution URL with process and file APIs
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/request/client::js-http-get-or-fetch
      - id: interpreter-path-api-reference
      - id: process-execution-api
      - id: file-existence-api
      - id: micro-behaviors/communications/http/download/helper::python-standalone-release-reference
  - id: interpreter-path-api-reference
    desc: Interpreter executable path references
    crit: component
    any:
      - id: micro-behaviors/fs/path/application/interpreter::bin-python
      - id: micro-behaviors/fs/path/binary::python-executable-name
      - id: micro-behaviors/fs/path/application/interpreter::bin-node
      - id: micro-behaviors/fs/path/application/interpreter::bin-ruby
  - id: process-execution-api
    desc: Node process execution call
    crit: component
    any:
      - id: micro-behaviors/process/create/spawn::spawn-call
      - id: micro-behaviors/process/create/exec::js-execfile-call
      - id: micro-behaviors/process/create/shell/bridge::js-exec
  - id: file-existence-api
    desc: Node file existence or access check
    crit: component
    any:
      - id: micro-behaviors/fs/path/check::js-exists-sync-call
      - id: micro-behaviors/fs/path/check::js-access-call
