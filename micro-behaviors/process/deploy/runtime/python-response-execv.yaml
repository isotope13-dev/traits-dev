defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-response-write-and-execv
    desc: Response-to-file and execv calls coexist
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-bound-as-response
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-read-path
      - id: micro-behaviors/process/replace::python-os-execv-call
