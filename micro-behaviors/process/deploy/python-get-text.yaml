traits:
- platforms:
  - windows
  - unix
  for:
  - python
  id: python-get-response-text-exec
  desc: Python exec of GET response text
  crit: notable
  conf: 0.95
  if:
    type: tree-sitter
    kind: call
    regex: ^exec\s*\(.{0,50}\.get\s*\(.{0,50}\)\.text\s*\)
  unless:
  - id: well-known/tool/detection/agentskillmap/
