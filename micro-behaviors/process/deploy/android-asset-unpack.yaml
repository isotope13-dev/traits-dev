# The dex reads a bundled asset stream, writes it to a file and holds a chmod
# command string: a native helper is unpacked from the APK and made runnable
# at install time.  Daemon and push SDKs also do this, so it stays suspicious.
defaults:
  platforms: [android]
  attack: T1406,T1059.004

composite_rules:
  - id: android-dex-unpacks-asset-and-sets-permissions
    desc: DEX unpacks an asset to a file and sets permissions
    crit: suspicious
    conf: 0.9
    for: [dex]
    all:
      - id: micro-behaviors/process/create/loader::dalvik-get-assets-reference
      - id: micro-behaviors/fs/write/file/stream::dalvik-file-output-stream-class
      - id: micro-behaviors/fs/chmod/modify::dex-chmod-command-prefix
