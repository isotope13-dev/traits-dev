defaults:
  platforms: [unix]
  for: [pickle]

traits:
  # Match adjacent statements and compare both destination expressions byte
  # for byte, inside one exec reduction. Separate download and process calls
  # do not establish this link.
  - id: pickle-urlretrieve-setsid-same-path
    desc: Pickle source fetches and runs same script
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule pickle_urlretrieve_setsid_same_path {
          strings:
            $exec32 = /\x8c\x08builtins\x94?\x8c\x04exec\x94?\x93\x94?X..../s
            $exec8 = /\x8c\x08builtins\x94?\x8c\x04exec\x94?\x93\x94?\x8c./s
            $reduce = /\x94?\x85\x94?R/
            $download = /urllib\.request\.urlretrieve\(["']https?:\/\/[^"'\r\n]{1,256}["'],/
            $launch = /subprocess\.Popen\(\[["']setsid["'],["']python[23]?["'],/
            $path = /[A-Za-z_][A-Za-z0-9_]{0,15}\+["']\/[^"'\r\n]{1,100}\.py["']/
          condition:
            for any a in (1..#path): (
              for any b in (1..#path): (
                @path[b] > @path[a] and !path[a] == !path[b] and
                uint8(@path[a] + !path[a]) == 0x29 and
                uint8(@path[a] + !path[a] + 1) == 0x3b and
                uint8(@path[b] + !path[b]) == 0x5d and
                for any d in (1..#download): (
                  @download[d] + !download[d] == @path[a] and (
                    for any e in (1..#exec32): (
                      @download[d] >= @exec32[e] + !exec32[e] and
                      @path[b] + !path[b] < @exec32[e] + !exec32[e] + uint32(@exec32[e] + !exec32[e] - 4) and
                      for any r in (1..#reduce): (
                        @reduce[r] == @exec32[e] + !exec32[e] + uint32(@exec32[e] + !exec32[e] - 4)
                      )
                    ) or
                    for any e in (1..#exec8): (
                      @download[d] >= @exec8[e] + !exec8[e] and
                      @path[b] + !path[b] < @exec8[e] + !exec8[e] + uint8(@exec8[e] + !exec8[e] - 1) and
                      for any r in (1..#reduce): (
                        @reduce[r] == @exec8[e] + !exec8[e] + uint8(@exec8[e] + !exec8[e] - 1)
                      )
                    )
                  )
                ) and
                for any l in (1..#launch): (
                  @launch[l] == @path[a] + !path[a] + 2 and
                  @launch[l] + !launch[l] == @path[b]
                ) and
                for all k in (0..!path[a]-1): (
                  uint8(@path[a]+k) == uint8(@path[b]+k)
                )
              )
            )
        }
