# Decimal code comparisons recover API tokens without pinning the offset,
# helper names, download address or output filename. Whitespace-separated
# tables and variable-width integers are outside this representation.
defaults:
  platforms: [windows]
  for: [vbs, html]
traits:
  - id: vbs-offset-download-write-launch-table
    desc: Offset-encoded download/write/launch API table
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule vbs_offset_download_write_launch_table {
          strings:
            $table = /Array\([0-9]{5},/ nocase
            $end = /,[0-9]{5}\)/
