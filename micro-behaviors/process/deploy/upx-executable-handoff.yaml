defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
traits:
  - id: x64-unpack-mprotect-handoff
    desc: x64 unpack, executable mprotect, and jump
    crit: notable
    conf: 0.98
    if:
      type: hex
      offset_range: [0, 1048576]
      # Decompress into R13; restore base/length; mprotect(PROT_READ|EXEC);
      # jump to that same output base. No file address is pinned.
      pattern: 'FF D5 59 48 8B 74 24 18 48 8B 7C 24 10 6A 05 5A 6A 0A 58 0F 05 41 FF E5'
