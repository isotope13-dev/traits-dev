defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-rx-buffer-callback-argument
    desc: RX buffer passed as callback argument
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      # NtProtectVirtualMemory(..., &buffer, &size, PAGE_EXECUTE_READ, ...)
      # followed by callback(buffer, locale, flags). Call destinations vary.
      pattern: '41 B9 20 00 00 00 4C 8D 44 24 ?? 48 8B C8 48 8D 54 24 ?? 48 8D 44 24 ?? 48 89 44 24 20 E8 ?? ?? ?? ?? 45 33 C0 BA ?? ?? ?? ?? 48 8B CB FF 15 ?? ?? ?? ??'
