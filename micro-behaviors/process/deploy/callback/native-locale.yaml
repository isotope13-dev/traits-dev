defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-locale-callback-from-local-buffer
    desc: Local buffer passed in locale callback position
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: text
      pattern: '6A 00 6A 00 8B 4D ?? 51 FF 15 [4]'
  - id: x86-rwx-allocation-local-buffer
    desc: RWX allocation saved to a frame local
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: text
      pattern: '6A 40 68 00 30 00 00 8B 45 ?? 50 6A 00 FF 15 [4] 89 45 ??'
