defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: file-stage-codepage-callback
    desc: Likely file-staged codepage callback
    crit: suspicious
    conf: 0.98
    for: [c, cpp]
    all:
      - id: micro-behaviors/os/sysinfo/platform/locale::enum-system-codepages-call
      - id: micro-behaviors/fs/file/open/unspecified::file-create-win
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-rwx-source-reference
    near_lines: 120
  - id: time-format-memory-stage
    desc: Likely memory-staged time-format callback
    crit: suspicious
    conf: 0.98
    for: [c, cpp]
    all:
      - id: micro-behaviors/os/sysinfo/platform/locale::enum-time-formats-ex-call
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-source
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/mem/copy::native-memcpy-byte-copy
    near_lines: 96
  - id: time-format-file-stage
    desc: Likely file-staged time-format callback
    crit: suspicious
    conf: 0.99
    for: [c, cpp]
    all:
      - id: micro-behaviors/os/sysinfo/platform/locale::enum-time-formats-ex-call
      - id: micro-behaviors/fs/file/open/unspecified::file-create-win
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-source
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/mem/copy::native-memcpy-byte-copy
    near_lines: 120
