defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-buffer-file-write-shell-launch-stub
    desc: x86 shared-path file-write and ShellExecute stub
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        import "pe"
        rule native_buffer_write_shell_launch {
          strings:
            $open = { B8 ?? ?? ?? ?? 50 8D 85 ?? ?? ?? ?? 50 E8 ?? ?? ?? ?? 83 C4 08 89 85 ?? ?? ?? ?? }
            $write = { E8 ?? ?? ?? ?? 83 C4 08 [0-24] 8B 8D ?? ?? ?? ?? 51 B9 01 00 00 00 51 8B 0A 51 50 E8 ?? ?? ?? ?? 83 C4 10 }
            $launch = { E8 ?? ?? ?? ?? 83 C4 08 B9 ?? ?? ?? ?? 51 B9 00 00 00 00 51 B9 00 00 00 00 51 8D 8D ?? ?? ?? ?? 51 50 B8 00 00 00 00 50 E8 ?? ?? ?? ?? }
          condition:
            uint16(0) == 0x5a4d and
            pe.imports("msvcrt.dll", "fopen") and
            pe.imports("msvcrt.dll", "fwrite") and
            pe.imports("shell32.dll", "ShellExecuteA") and
            $open and $write and $launch and
            for any i in (1..#open) : (
              for any j in (1..#write) : (
                for any k in (1..#launch) : (
                  @open[i] < @write[j] and @write[j] < @launch[k] and
                  @launch[k] - @open[i] < 1024 and
                  uint32(@open[i] + 8) == uint32(@launch[k] + 28) and
                  uint32(@open[i] + 23) == uint32(@write[j] + !write[j] - 23)
                )
              )
            )
        }
