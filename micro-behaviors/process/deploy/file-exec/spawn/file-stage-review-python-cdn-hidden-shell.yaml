defaults:
  platforms: [windows]
  for: [python]
composite_rules:
  - id: python-cdn-executable-hidden-shell
    desc: Hidden HTTP file launch beside Discord executable URL
    crit: suspicious
    conf: 0.98
    attack: T1105,T1059.003
    all:
      - id: micro-behaviors/process/deploy/file-exec/spawn::python-streamed-download-hidden-shell
      - id: micro-behaviors/communications/http/url/cloud::discord-cdn-executable-url
