defaults:
  platforms: [windows, unix]

composite_rules:
  - id: python-library-write-and-exe-launch
    desc: Python library write and executable launch
    crit: suspicious
    conf: 0.95
    for:
      - python
    all:
      - id: micro-behaviors/fs/file/open/write::python-library-write-open
    any:
      - id: micro-behaviors/process/create/subprocess/launch::python-exe-library-subprocess
      - id: micro-behaviors/process/create/shell/command-string::python-exe-library-os-system
    near_bytes: 4096
