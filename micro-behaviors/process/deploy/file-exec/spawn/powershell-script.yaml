defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  # Also explain a recovered stage when scanned independently, without the
  # encoded carrier's attack context. These operations suggest deployment,
  # but do not prove that the variables identify one file or response.
  - id: powershell-download-hidden-script-launch
    desc: WebClient content write with hidden script launch
    crit: notable
    conf: 0.95
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::webclient-downloadstring
      - id: micro-behaviors/process/create/hidden::start-process-hidden-window-option
      - id: micro-behaviors/process/argument/file::powershell-variable-script-file-option
    any:
      - id: micro-behaviors/fs/write/file/full/string::powershell-set-content-call
      - id: micro-behaviors/fs/write/file/full/string::encoded-powershell-variable-content-write
