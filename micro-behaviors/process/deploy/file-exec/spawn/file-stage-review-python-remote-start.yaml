defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1195.002,T1105,T1059.003
traits:
  - id: python-top-level-retrieve-start-attempt
    desc: Top-level executable retrieval and start attempt
    crit: notable
    conf: 0.98
    # This is intent evidence, including a misspelled urllib.urlrequest
    # receiver. It does not claim that the transfer succeeded or that the
    # following start call is reachable when attribute lookup fails.
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (try_statement body: (block
            (expression_statement (call
              function: (attribute
                object: (attribute object: (identifier) @module
                  attribute: (identifier) @request)
                attribute: (identifier) @retrieve)
              arguments: (argument_list .
                (string (string_content) @url)
                (string (string_content) @saved))))
            (expression_statement (call
              function: (_) @runner
              arguments: (argument_list .
                (list . (string (string_content) @start)
                  (string (string_content) @launched))
                (keyword_argument name: (identifier) @shell
                  value: (true)))))))) @attempt
          (#eq? @module "urllib")
          (#match? @request "^(request|urlrequest)$")
          (#eq? @retrieve "urlretrieve")
          (#match? @url "^https?://[^[:space:]]{1,240}[.]exe([?#]|$)")
          (#eq? @saved @launched)
          (#eq? @start "start")
          (#eq? @shell "shell")
          (#match? @runner "^(run|call|check_call|subprocess[.](run|call|check_call))$"))
