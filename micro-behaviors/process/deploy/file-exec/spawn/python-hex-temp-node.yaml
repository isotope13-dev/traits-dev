defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  # The temporary-files fact stops at the try boundary in this loader.
  # Bind the decoded value, written handle and executed handle explicitly.
  - id: python-hex-temp-node-launch
    desc: Runs decoded hex through temporary Node file
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((block
          (expression_statement (assignment left: (identifier) @source
            right: (call function: (attribute
              object: (call function: (attribute object: (identifier) @bytes
                attribute: (identifier) @fromhex))
              attribute: (identifier) @decode))))
          (expression_statement (assignment left: (identifier) @handle
            right: (call function: (attribute attribute: (identifier) @temp))))
          (try_statement body: (block
            (expression_statement (call function: (attribute
              object: (identifier) @writer attribute: (identifier) @write)
              arguments: (argument_list (identifier) @written)))
            (expression_statement (call function: (attribute
              object: (identifier) @closer attribute: (identifier) @close)))
            (try_statement body: (block
              (expression_statement (call function: (attribute attribute: (identifier) @run)
                arguments: (argument_list (list . (string) @node . (attribute
                  object: (identifier) @executed attribute: (identifier) @name)))))))))) @chain
          (#match? @bytes "^(bytes|bytearray)$")
          (#eq? @fromhex "fromhex") (#eq? @decode "decode")
          (#eq? @temp "NamedTemporaryFile")
          (#eq? @handle @writer) (#eq? @write "write")
          (#eq? @source @written)
          (#eq? @handle @closer) (#eq? @close "close")
          (#match? @run "^(run|call|Popen)$")
          (#match? @node "^['\"]node(js)?(\\.exe)?['\"]$")
          (#eq? @handle @executed) (#eq? @name "name"))
        ; Flat variant: the write and close are plain statements and only the
        ; Node launch sits inside the try that unlinks the file.
        ((block
          (expression_statement (assignment left: (identifier) @source
            right: (call function: (attribute
              object: (call function: (attribute object: (identifier) @bytes
                attribute: (identifier) @fromhex))
              attribute: (identifier) @decode))))
          (expression_statement (assignment left: (identifier) @handle
            right: (call function: (attribute attribute: (identifier) @temp))))
          (expression_statement (call function: (attribute
            object: (identifier) @writer attribute: (identifier) @write)
            arguments: (argument_list (identifier) @written)))
          (expression_statement (call function: (attribute
            object: (identifier) @closer attribute: (identifier) @close)))
          (try_statement body: (block
            (expression_statement (call function: (attribute attribute: (identifier) @run)
              arguments: (argument_list (list . (string) @node . (attribute
                object: (identifier) @executed attribute: (identifier) @name)))))))) @chain
          (#match? @bytes "^(bytes|bytearray)$")
          (#eq? @fromhex "fromhex") (#eq? @decode "decode")
          (#eq? @temp "NamedTemporaryFile")
          (#eq? @handle @writer) (#eq? @write "write")
          (#eq? @source @written)
          (#eq? @handle @closer) (#eq? @close "close")
          (#match? @run "^(run|call|Popen)$")
          (#match? @node "^['\"]node(js)?(\\.exe)?['\"]$")
          (#eq? @handle @executed) (#eq? @name "name"))
