defaults:
  platforms: [windows]
  for: [python]
traits:
  # Facts identify copy and launch individually but do not preserve the
  # mkstemp tuple slot through the intervening close operation.
  - id: python-temporary-executable-copy-launch
    desc: Copies and launches a temporary executable
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((block
          (expression_statement (assignment
            left: (pattern_list (identifier) @fd (identifier) @path)
            right: (call function: (attribute object: (identifier) @tempfile
              attribute: (identifier) @mkstemp)
              arguments: (argument_list (keyword_argument name: (identifier) @suffix
                value: (string) @extension)))))
          .
          (expression_statement (call function: (attribute object: (identifier) @os
            attribute: (identifier) @close)
            arguments: (argument_list (identifier) @fd_use)))
          .
          (expression_statement (call function: (attribute object: (identifier) @shutil
            attribute: (identifier) @copy)
            arguments: (argument_list (_) (identifier) @destination)))
          .
          (expression_statement (call function: (attribute object: (identifier) @subprocess
            attribute: (identifier) @popen)
            arguments: (argument_list (list (identifier) @launch_path) @evidence))))
          (#eq? @tempfile "tempfile") (#eq? @mkstemp "mkstemp")
          (#eq? @suffix "suffix") (#match? @extension "(?i)^[\"'][.]exe[\"']$")
          (#eq? @os "os") (#eq? @close "close") (#eq? @fd @fd_use)
          (#eq? @shutil "shutil") (#match? @copy "^(copy|copy2|copyfile)$")
          (#eq? @subprocess "subprocess") (#eq? @popen "Popen")
          (#eq? @path @destination) (#eq? @path @launch_path)
          (#set! cleave.ignore-comments "true"))
