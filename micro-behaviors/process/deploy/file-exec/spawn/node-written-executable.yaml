defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: node-written-chmod-execfile-path
    desc: Writes, chmods, and executes same path
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (expression_statement (call_expression
            function: [(identifier) @write
              (member_expression property: (property_identifier) @write)]
            arguments: (arguments (identifier) @written)))
          . (expression_statement (call_expression
            function: [(identifier) @chmod
              (member_expression property: (property_identifier) @chmod)]
            arguments: (arguments (identifier) @armed)))
          . (try_statement body: (statement_block
            (lexical_declaration (variable_declarator value: [
              (call_expression
                function: [(identifier) @launch
                  (member_expression property: (property_identifier) @launch)]
                arguments: (arguments (identifier) @executed))
              (call_expression function: (member_expression
                object: (call_expression
                  function: [(identifier) @launch
                    (member_expression property: (property_identifier) @launch)]
                  arguments: (arguments (identifier) @executed))))
            ])))))
          (#eq? @write "writeFileSync")
          (#eq? @chmod "chmodSync")
          (#eq? @launch "execFileSync")
          (#eq? @written @armed)
          (#eq? @written @executed))
