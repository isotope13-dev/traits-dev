defaults:
  platforms: [unix, windows]
  for: [ruby]

composite_rules:
  - id: extconf-base64-spawn-install-payload
    desc: Extension hook Base64, write and spawn clues
    crit: component
    conf: 0.98
    scope: file
    near_bytes: 1200
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/data/decode/base64::ruby-base64-decode64-call
      - id: metadata/lang/source/syntax/member::ruby-file-write-reference
      - id: micro-behaviors/process/create/exec::ruby-spawn
    any:
      - id: micro-behaviors/communications/socket/connect/tcp::ruby-socket-connect
      - id: micro-behaviors/process/create/exec::ruby-decode64-write-spawn-script
