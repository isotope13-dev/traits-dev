defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-http-task-download-launch-loop
    desc: Polls HTTP tasks to download and launch
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule x86_http_task_download_launch_loop {
         strings:
          $task = { 8D 85 7C DA F9 FF 50 8D 85 FC FE FF FF 50 E8 ?? ?? ?? ?? 59 59 8D 85 7C DA F9 FF 50 E8 ?? ?? ?? ?? 59 68 ?? ?? ?? ?? 8D 85 7C DA F9 FF 50 E8 ?? ?? ?? ?? 59 59 8D 85 7C DA F9 FF 50 E8 ?? ?? ?? ?? 59 83 F8 05 0F 86 03 01 00 00 0F BE 85 7C DA F9 FF 83 F8 68 0F 85 F3 00 00 00 0F BE 85 7F DA F9 FF 83 F8 70 0F 85 E3 00 00 00 8D 85 7C DA F9 FF 50 FF 15 ?? ?? ?? ?? 59 50 8D 85 FC FC FF FF 50 E8 ?? ?? ?? ?? 59 59 68 ?? ?? ?? ?? 8D 85 7C DA F9 FF 50 FF 15 ?? ?? ?? ?? 59 59 50 8D 85 FC FD FF FF 50 E8 ?? ?? ?? ?? 59 59 68 ?? ?? ?? ?? 8D 85 FC FC FF FF 50 FF 15 ?? ?? ?? ?? 59 59 40 50 8D 85 FC FC FF FF 50 E8 ?? ?? ?? ?? 59 59 8D 85 7C DA F9 FF 50 E8 ?? ?? ?? ?? 59 8D 85 7C DA F9 FF 50 E8 ?? ?? ?? ?? 59 8D 85 7C DA F9 FF 50 8D 85 FC FD FF FF 50 E8 ?? ?? ?? ?? 59 59 8D 85 7C DA F9 FF 50 E8 ?? ?? ?? ?? }
          $reader = { 55 8B EC B8 5C 50 00 00 E8 ?? ?? ?? ?? 68 ?? ?? ?? ?? FF 75 08 E8 ?? ?? ?? ?? 59 59 FF 35 ?? ?? ?? ?? FF 75 08 E8 ?? ?? ?? ?? 59 59 68 ?? ?? ?? ?? FF 75 08 E8 ?? ?? ?? ?? 59 59 83 3D ?? ?? ?? ?? 00 74 11 68 ?? ?? ?? ?? FF 75 08 E8 ?? ?? ?? ?? 59 59 EB 0F 68 ?? ?? ?? ?? FF 75 08 E8 ?? ?? ?? ?? 59 59 68 ?? ?? ?? ?? FF 75 0C E8 ?? ?? ?? ?? 59 59 6A 00 6A 00 6A 00 6A 00 68 ?? ?? ?? ?? FF 15 ?? ?? ?? ?? 89 85 A8 AF FF FF 83 BD A8 AF FF FF 00 74 6F 6A 00 6A 00 6A 00 6A 00 FF 75 08 FF B5 A8 AF FF FF FF 15 ?? ?? ?? ?? 89 85 A4 AF FF FF 83 BD A4 AF FF FF 00 74 3E 8D 85 AC AF FF FF 50 68 50 4E 00 00 8D 85 B0 B1 FF FF 50 FF B5 A4 AF FF FF FF 15 ?? ?? ?? ?? 8B 85 AC AF FF FF 80 A4 05 B0 B1 FF FF 00 8D 85 B0 B1 FF FF 50 FF 75 0C E8 ?? ?? ?? ?? 59 59 }
          $download = { 55 8B EC 81 EC 34 08 00 00 6A 00 6A 00 6A 00 6A 00 68 ?? ?? ?? ?? FF 15 ?? ?? ?? ?? 89 85 D4 F7 FF FF 83 BD D4 F7 FF FF 00 0F 84 AF 00 00 00 6A 00 6A 00 6A 00 6A 00 FF 75 08 FF B5 D4 F7 FF FF FF 15 ?? ?? ?? ?? 89 85 D0 F7 FF FF 83 BD D0 F7 FF FF 00 0F 84 85 00 00 00 68 ?? ?? ?? ?? FF 75 0C FF 15 ?? ?? ?? ?? 59 59 89 85 CC F7 FF FF 83 BD CC F7 FF FF 00 74 66 8D 85 DC F7 FF FF 50 68 00 08 00 00 8D 85 00 F8 FF FF 50 FF B5 D0 F7 FF FF FF 15 ?? ?? ?? ?? 85 C0 75 02 EB 2F FF B5 CC F7 FF FF 6A 01 FF B5 DC F7 FF FF 8D 85 00 F8 FF FF 50 FF 15 ?? ?? ?? ?? 83 C4 10 6A 64 FF 15 ?? ?? ?? ?? 83 BD DC F7 FF FF 00 77 AC FF B5 CC F7 FF FF FF 15 ?? ?? ?? ?? 59 6A 01 58 EB 02 33 C0 C9 C3 }
          $launch = { 55 8B EC 83 EC 54 6A 44 6A 00 8D 45 AC 50 E8 ?? ?? ?? ?? 83 C4 0C 8D 45 F0 50 8D 45 AC 50 6A 00 6A 00 6A 00 6A 00 6A 00 6A 00 FF 75 08 6A 00 FF 15 ?? ?? ?? ?? C9 C3 }
          $temp = { 55 8B EC 81 EC 00 02 00 00 8D 85 00 FE FF FF 50 FF 15 ?? ?? ?? ?? 50 68 ?? ?? ?? ?? 68 ?? ?? ?? ?? FF 15 ?? ?? ?? ?? 8D 85 00 FE FF FF 50 FF 75 08 E8 ?? ?? ?? ?? 59 59 33 C0 C9 }
          $back = { 68 00 9F 24 00 FF 15 ?? ?? ?? ?? E9 04 FE FF FF }
          $decoder = { 55 8B EC 51 C7 45 FC 00 00 00 00 EB 09 8B 45 FC 83 C0 01 89 45 FC 8B 4D 08 51 E8 ?? ?? ?? ?? 83 C4 04 39 45 FC 73 16 8B 55 08 03 55 FC 0F BE 02 83 F0 02 8B 4D 08 03 4D FC 88 01 EB D0 8B 45 08 8B E5 5D C3 }
          $lookup = { 68 ?? ?? ?? ?? E8 ?? ?? ?? ?? 83 C4 04 50 A1 ?? ?? ?? ?? 50 FF 15 ?? ?? ?? ?? A3 ?? ?? ?? ?? }
          $resolve = { 68 ?? ?? ?? ?? E8 ?? ?? ?? ?? 59 50 FF 35 ?? ?? ?? ?? FF 15 ?? ?? ?? ?? A3 ?? ?? ?? ?? }
          $api_InternetOpenUrlA = "InternetOpenUrlA" xor(2)
          $api_InternetReadFile = "InternetReadFile" xor(2)
          $getproc = "GetProcAddress" xor(2)
          $copy = { FF 25 ?? ?? ?? ?? }
         condition:
          for any idx_lookup in (1..#lookup) : (
          pe.machine == pe.MACHINE_I386 and
          all of them and
          for any cp in (1..#copy) : (uint32(@copy[cp]+2) == pe.image_base+pe.import_rva("MSVCRT.dll","strcpy")) and
          for any s in pe.sections : (s.characteristics & pe.SECTION_MEM_EXECUTE != 0 and @task >= s.raw_data_offset and @task+!task <= s.raw_data_offset+s.raw_data_size) and
          for any s in pe.sections : (s.characteristics & pe.SECTION_MEM_EXECUTE != 0 and @lookup[idx_lookup] >= s.raw_data_offset and @lookup[idx_lookup]+!lookup[idx_lookup] <= s.raw_data_offset+s.raw_data_size) and
          uint32(@launch+49) == pe.image_base+pe.import_rva("KERNEL32.dll","CreateProcessA") and
          uint32(@download+99) == pe.image_base+pe.import_rva("MSVCRT.dll","fopen") and
          uint32(@download+66) == uint32(@reader+168) and
          uint32(@download+147) == uint32(@reader+214) and
          uint32(@download+180) == pe.image_base+pe.import_rva("MSVCRT.dll","fwrite") and
          uint32(@temp+35) == pe.image_base+pe.import_rva("KERNEL32.dll","GetTempFileNameA") and
          uint32(@lookup[idx_lookup]+22) == pe.image_base+pe.import_rva("KERNEL32.dll","GetProcAddress") and
          $getproc at pe.rva_to_offset(uint32(@lookup[idx_lookup]+1)-pe.image_base) and
          for any s in (0..pe.number_of_sections-1) : (
            pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
            @task >= pe.sections[s].raw_data_offset and @back+!back <= pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size and
            ($copy at pe.rva_to_offset(pe.sections[s].virtual_address+@reader-pe.sections[s].raw_data_offset+247+int32(@reader+243)) and uint16(pe.rva_to_offset(pe.sections[s].virtual_address+@reader-pe.sections[s].raw_data_offset+247+int32(@reader+243))) == 0x25ff and uint32(pe.rva_to_offset(pe.sections[s].virtual_address+@reader-pe.sections[s].raw_data_offset+247+int32(@reader+243))+2) == pe.image_base+pe.import_rva("MSVCRT.dll","strcpy")) and
            ($copy at pe.rva_to_offset(pe.sections[s].virtual_address+@task-pe.sections[s].raw_data_offset+134+int32(@task+130)) and uint16(pe.rva_to_offset(pe.sections[s].virtual_address+@task-pe.sections[s].raw_data_offset+134+int32(@task+130))) == 0x25ff and uint32(pe.rva_to_offset(pe.sections[s].virtual_address+@task-pe.sections[s].raw_data_offset+134+int32(@task+130))+2) == pe.image_base+pe.import_rva("MSVCRT.dll","strcpy")) and
            ($copy at pe.rva_to_offset(pe.sections[s].virtual_address+@task-pe.sections[s].raw_data_offset+169+int32(@task+165)) and uint16(pe.rva_to_offset(pe.sections[s].virtual_address+@task-pe.sections[s].raw_data_offset+169+int32(@task+165))) == 0x25ff and uint32(pe.rva_to_offset(pe.sections[s].virtual_address+@task-pe.sections[s].raw_data_offset+169+int32(@task+165))+2) == pe.image_base+pe.import_rva("MSVCRT.dll","strcpy")) and
            ($copy at pe.rva_to_offset(pe.sections[s].virtual_address+@task-pe.sections[s].raw_data_offset+205+int32(@task+201)) and uint16(pe.rva_to_offset(pe.sections[s].virtual_address+@task-pe.sections[s].raw_data_offset+205+int32(@task+201))) == 0x25ff and uint32(pe.rva_to_offset(pe.sections[s].virtual_address+@task-pe.sections[s].raw_data_offset+205+int32(@task+201))+2) == pe.image_base+pe.import_rva("MSVCRT.dll","strcpy")) and
            ($copy at pe.rva_to_offset(pe.sections[s].virtual_address+@temp-pe.sections[s].raw_data_offset+54+int32(@temp+50)) and uint16(pe.rva_to_offset(pe.sections[s].virtual_address+@temp-pe.sections[s].raw_data_offset+54+int32(@temp+50))) == 0x25ff and uint32(pe.rva_to_offset(pe.sections[s].virtual_address+@temp-pe.sections[s].raw_data_offset+54+int32(@temp+50))+2) == pe.image_base+pe.import_rva("MSVCRT.dll","strcpy")) and
        $reader at pe.rva_to_offset(pe.sections[s].virtual_address+@task-pe.sections[s].raw_data_offset+19+int32(@task+15)) and
            $temp at pe.rva_to_offset(pe.sections[s].virtual_address+@task-pe.sections[s].raw_data_offset+232+int32(@task+228)) and
            $download at pe.rva_to_offset(pe.sections[s].virtual_address+@task-pe.sections[s].raw_data_offset+252+int32(@task+248)) and
            $launch at pe.rva_to_offset(pe.sections[s].virtual_address+@task-pe.sections[s].raw_data_offset+266+int32(@task+262)) and
            @back > @task+!task and @back-@task < 512 and
            @back+!back+int32(@back+12) < @task and
            @task-(@back+!back+int32(@back+12)) < 128 and
            $decoder at pe.rva_to_offset(pe.sections[s].virtual_address+@lookup[idx_lookup]-pe.sections[s].raw_data_offset+10+int32(@lookup[idx_lookup]+6)) and
            for any r in (1..#resolve) : (
            @resolve[r] >= pe.sections[s].raw_data_offset and @resolve[r]+!resolve[r] <= pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size and
            $api_InternetOpenUrlA at pe.rva_to_offset(uint32(@resolve[r]+1)-pe.image_base) and
            $decoder at pe.rva_to_offset(pe.sections[s].virtual_address+@resolve[r]-pe.sections[s].raw_data_offset+10+int32(@resolve[r]+6)) and
            uint32(@resolve[r]+20) == uint32(@lookup[idx_lookup]+27) and
            uint32(@resolve[r]+25) == uint32(@reader+168)
          ) and
            for any r in (1..#resolve) : (
            @resolve[r] >= pe.sections[s].raw_data_offset and @resolve[r]+!resolve[r] <= pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size and
            $api_InternetReadFile at pe.rva_to_offset(uint32(@resolve[r]+1)-pe.image_base) and
            $decoder at pe.rva_to_offset(pe.sections[s].virtual_address+@resolve[r]-pe.sections[s].raw_data_offset+10+int32(@resolve[r]+6)) and
            uint32(@resolve[r]+20) == uint32(@lookup[idx_lookup]+27) and
            uint32(@resolve[r]+25) == uint32(@reader+214)
          )
          )
          )
        }
