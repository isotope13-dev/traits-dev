# The same saved-path relationship with an explicitly visible Run call.
# Call facts do not link two calls by the identity of their path variable.
# Keep the hidden-window observation separate, without broadening its claim.
defaults:
  platforms: [windows]
  for: [javascript]
  crit: notable
traits:
  - id: parsed-adodb-saved-path-visible-rundll32
    desc: ADODB saved path passed to visible rundll32
    conf: 0.99
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (variable_declaration (variable_declarator
            name: (identifier) @stream
            value: (new_expression constructor: (identifier) @factory
              arguments: (arguments . (string (string_fragment) @progid) .))))
          . (expression_statement (assignment_expression
            left: (member_expression object: (identifier) @type_stream
              property: (property_identifier) @type)
            right: (number) @binary))
          . (expression_statement (call_expression
            function: (member_expression object: (identifier) @open_stream
              property: (property_identifier) @open)
            arguments: (arguments)))
          . (expression_statement (call_expression
            function: (member_expression object: (identifier) @write_stream
              property: (property_identifier) @write)
            arguments: (arguments . (_) .)) @evidence)
          . (expression_statement (call_expression
            function: (member_expression object: (identifier) @save_stream
              property: (property_identifier) @save)
            arguments: (arguments . (identifier) @saved . (number) .)))
          . (expression_statement (call_expression
            function: (member_expression object: (identifier) @close_stream
              property: (property_identifier) @close)
            arguments: (arguments)))
          . (expression_statement (call_expression
            function: (member_expression property: (property_identifier) @run)
            arguments: (arguments
              . (binary_expression
                left: (binary_expression left: (string (string_fragment) @prefix)
                  operator: "+" right: (identifier) @launched)
                operator: "+" right: (string (string_fragment) @export))
              . (number) @hidden . (false) .))))
          (#eq? @factory "ActiveXObject")
          (#match? @progid "(?i)^ADODB\\.Stream$")
          (#eq? @stream @type_stream)
          (#eq? @stream @open_stream)
          (#eq? @stream @write_stream)
          (#eq? @stream @save_stream)
          (#eq? @stream @close_stream)
          (#eq? @type "Type")
          (#eq? @binary "1")
          (#eq? @open "Open")
          (#eq? @write "Write")
          (#eq? @save "SaveToFile")
          (#eq? @close "Close")
          (#eq? @run "Run")
          (#eq? @saved @launched)
          (#eq? @hidden "1")
          (#set! cleave.ignore-comments "true")
          (#match? @prefix "(?i)^rundll32(\\.exe)?[ \\t]+[\"']?$")
          (#match? @export "^[\"']?[ ,]+[A-Za-z_][A-Za-z0-9_@]*$"))

composite_rules:
