defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-module-http-tempfile-binary-launch
    desc: Downloads bytes to temp file, executes it
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (expression_statement (assignment left: (identifier) @response
            right: (call function: (attribute object: (identifier) @requests
              attribute: (identifier) @get))))
          (with_statement (with_clause (with_item value: (as_pattern
            (call function: (attribute object: (identifier) @tempfile
              attribute: (identifier) @named))
            alias: (as_pattern_target (identifier) @handle))))
            body: (block (expression_statement (call function: (attribute
              object: (identifier) @writer attribute: (identifier) @write)
              arguments: (argument_list (attribute object: (identifier) @response_read
                attribute: (identifier) @content))))))
          (expression_statement (call function: (attribute object: (identifier) @subprocess
            attribute: (identifier) @launch)
            arguments: (argument_list (list (attribute object: (identifier) @executed
              attribute: (identifier) @name))))))
          (#eq? @requests "requests") (#eq? @get "get")
          (#eq? @tempfile "tempfile") (#eq? @named "NamedTemporaryFile")
          (#eq? @write "write") (#eq? @content "content")
          (#eq? @response @response_read) (#eq? @handle @writer)
          (#eq? @handle @executed) (#eq? @name "name")
          (#eq? @subprocess "subprocess") (#match? @launch "^(call|run|Popen)$"))
