defaults:
  platforms: [windows]
  for: [png, powershell, batch]
traits:
  # The assignment, quoted DLL argument and Start-Process share the same
  # extracted path. Only the complete staging chain below claims deployment.
  - id: powershell-extracted-dll-hidden-launch
    desc: Extracted DLL passed to hidden rundll32
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule powershell_extracted_dll_hidden_launch {
          strings:
            $bind = /if\s*\(\$ext\s*-eq\s*"\.dll"\)\s*\{\s*\$extractedDll\s*=\s*\$outPath\s*\}/ nocase
            $arg = "$argument = \"`\"$extractedDll`\", $DllFunction\"" nocase
            $launch = /Start-Process\s+rundll32\.exe\s+-ArgumentList\s+\$argument\s+-WindowStyle\s+Hidden/ nocase
          condition:
            // Raw code inside PNG is meaningful here only in the bundle carrier.
            (uint32be(0) != 0x89504e47 or
              uint32be(filesize-4) == 0x53544733) and
            for any a in (1..#arg) : (
              $bind in (@arg[a]-512..@arg[a]) and
              $launch in (@arg[a]+!arg[a]..@arg[a]+!arg[a]+128)
            )
        }
composite_rules:
  - id: powershell-bundle-hidden-dll-deploy
    desc: PowerShell writes bundle members and launches the extracted DLL hidden
    crit: notable
    conf: 0.98
    near_bytes: 1024
    all:
      - id: micro-behaviors/data/archive/extract/capability::powershell-offset-member-write
      - id: powershell-extracted-dll-hidden-launch
