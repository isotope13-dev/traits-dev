defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: node-written-path-conditional-spawn
    desc: Conditionally spawns a written path
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (expression_statement
            (call_expression
              function: (member_expression property: (property_identifier) @write)
              arguments: (arguments (identifier) @written)))
          . (if_statement
            alternative: (else_clause
              (if_statement
                consequence: (statement_block
                  (expression_statement
                    (call_expression
                      function: (identifier) @spawn
                      arguments: (arguments (identifier) @executed))))))) @branch) @chain
        (#eq? @write "writeFileSync")
        (#eq? @spawn "spawn")
        (#eq? @written @executed)
        (#not-match? @branch "\\b(const|let|var)\\b")
        (#not-match? @branch "[^=!<>]=[^=>=]"))
  # A PowerShell -File launch passes the written path as the final argument
  # of a spawn inside an if-branch. The branch need not be an else chain.
  - id: node-written-path-powershell-file-spawn
    desc: Spawns PowerShell -File on the written path
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (expression_statement
            (call_expression
              function: (member_expression property: (property_identifier) @write)
              arguments: (arguments (identifier) @written)))
          (if_statement
            consequence: (statement_block
              (expression_statement
                (call_expression
                  function: (identifier) @spawn
                  arguments: (arguments (string) (array (identifier) @executed))))))) @chain
        (#eq? @write "writeFileSync")
        (#eq? @spawn "spawn")
        (#eq? @written @executed))
composite_rules:
  - id: node-written-path-launch
    desc: Node launches the path it just wrote
    crit: notable
    conf: 0.95
    any:
      - id: node-written-path-conditional-spawn
      - id: node-written-path-powershell-file-spawn
