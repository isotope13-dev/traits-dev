defaults:
  platforms:
    - windows
  for:
    - python
composite_rules:
  - id: python-thread-start-download-launch-code
    desc: Download/launch with module thread-start code
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/process/thread/create::module-level-thread-start
      - id: micro-behaviors/process/deploy/file-exec/spawn::python-urlretrieve-interpreter-same-path
      - id: metadata/file/profile/process::pythonw-windowless-subprocess-code
