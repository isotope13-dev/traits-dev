defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
- id: shell-download-chmod-exec
  desc: HTTP download, chmod and local execution co-occur
  crit: notable
  conf: 0.9
  # Keep the three capabilities in one local command sequence. A file-wide
  # conjunction makes ordinary test scripts look like droppers when an
  # unrelated curl and chmod occur in different phases of the test.
  near_bytes: 176
  unless:
  - id: micro-behaviors/communications/url/external/github::shadowsocks-build-deb-bootstrap
  - id: well-known/tool/sysadmin/kubernetes
  - id: metadata/path::openshift-release-ci-step-context
  - id: micro-behaviors/os/package-manager/installer-script::installer-script
  - id: micro-behaviors/os/package-manager/installer-script::verified-github-release-installer
  - id: micro-behaviors/os/package-manager/installer-script::linuxdeploy-appimage-build-context
  - id: micro-behaviors/os/package-manager/installer-script::appimagetool-appimage-build-context
  - id: micro-behaviors/os/package-manager/installer-script::ci-test-github-release-bootstrap
  - id: well-known/tool/development/ci/osbuild-composer::osbuild-composer-test-script-context
  all:
  # Require an actual curl/wget command. URL-valued package metadata (for
  # example an Arch source= entry) is not itself a runtime download operation.
  - id: micro-behaviors/communications/http/download/shell::shell-curl-wget-url-fetch
  - id: micro-behaviors/fs/chmod/executable/mode
  any:
  - id: micro-behaviors/process/create/local-exec::tmp-path-execution
  - id: micro-behaviors/process/create/local-exec::local-execution
  - id: micro-behaviors/process/create/local-exec::chmod-exec-var-local
  - id: micro-behaviors/process/create/local-exec::hidden-dotfile-chmod-exec
  - id: micro-behaviors/process/create/local-exec::chmod-then-local-execute-command
