defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  # Equal captures bind the write destination to the program argument. The
  # branch may be skipped. Reject local declarations and assignments that
  # could replace the path binding; this is capability, not reachability.
  - id: node-written-path-conditional-spawn
    desc: Conditionally spawns a written path
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (expression_statement
            (call_expression
              function: (member_expression property: (property_identifier) @write)
              arguments: (arguments (identifier) @written)))
          . (if_statement
            alternative: (else_clause
              (if_statement
                consequence: (statement_block
                  (expression_statement
                    (call_expression
                      function: (identifier) @spawn
                      arguments: (arguments (identifier) @executed))))))) @branch) @chain
        (#eq? @write "writeFileSync")
        (#eq? @spawn "spawn")
        (#eq? @written @executed)
        (#not-match? @branch "\\b(const|let|var)\\b")
        (#not-match? @branch "[^=!<>]=[^=>=]"))
