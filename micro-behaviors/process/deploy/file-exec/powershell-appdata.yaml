defaults:
  platforms: [windows]
  for: [powershell, batch]

composite_rules:
  - id: powershell-appdata-download-invoke-item-cluster
    desc: Download, AppData EXE and Invoke-Item cluster
    crit: notable
    conf: 0.98
    attack: T1105,T1059.001
    mbc: B0030,E1059
    near_bytes: 8192
    all:
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/process/create/shellexec::powershell-invoke-item
    any:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/communications/http/download/cli::powershell-restmethod-outfile

