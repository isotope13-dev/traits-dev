defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: multiarch-fallback-launch-cleanup
    desc: Multi-arch launch and variable deletion co-occur
    crit: notable
    conf: 0.99
    attack: T1105,T1059.004
    near_lines: 24
    all:
      - id: micro-behaviors/process/deploy/file-exec::multiarch-fallback-launch-profile
      - id: micro-behaviors/fs/delete/file/command::rm-force-variable-target
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/autotools::autoconf-generated-script
      - id: micro-behaviors/os/package-manager/installer-script::installer-script
      - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
      - id: micro-behaviors/crypto/hash/file::sha512-pinned-download-context
      - id: "metadata/file/naming::test-directory-component"
