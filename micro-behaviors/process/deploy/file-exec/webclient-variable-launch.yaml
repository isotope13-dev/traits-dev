# The two variable tokens must be identical. Proximity alone would also match
# a download followed by launching an unrelated maintenance program.
defaults:
  platforms: [windows]
  for: [html, powershell, batch, pe]
traits:
  - id: webclient-downloadfile-same-variable-launch
    desc: DownloadFile variable passed to Start-Process
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule webclient_downloadfile_same_variable_launch {
          strings:
            $chain = /\bDownloadFile[ \t]*\([ \t]*["']https?:\/\/[^"'$\r\n]{1,400}["'][ \t]*,[ \t]*\$[a-z_][a-z0-9_]{0,63}[ \t]*\)[ \t]*;[ \t\r\n]{0,40}Start-Process[ \t]+(-FilePath[ \t]+)?\$[a-z_][a-z0-9_]{0,63}([ \t\r\n;"'&<)]|$)/ nocase
            $var = /\$[a-z_][a-z0-9_]{0,63}\b/ nocase
          condition:
            for any c in (1..#chain) : (
              for any p in (1..#var) : (
                @var[p] > @chain[c] and
                @var[p] + !var[p] < @chain[c] + !chain[c] and
                for any q in (1..#var) : (
                  @var[q] > @var[p] + !var[p] and
                  (@var[q] + !var[q] == @chain[c] + !chain[c] or
                   @var[q] + !var[q] == @chain[c] + !chain[c] - 1) and
                  !var[p] == !var[q] and
                  for all k in (0..!var[p]-1) : (
                    (uint8(@var[p]+k) | 32) == (uint8(@var[q]+k) | 32)
                  )
                )
              )
            )
        }
