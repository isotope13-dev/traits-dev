defaults:
  platforms: [windows]
  for: [go]
composite_rules:
  - id: go-hidden-powershell-download-launch
    desc: Go combines file download and hidden PowerShell
    crit: notable
    conf: 0.98
    all:
      # Constructing an exec.Cmd without invoking it does not deploy anything.
      - id: micro-behaviors/process/create/subprocess::go-powershell-launch-call
      - id: micro-behaviors/process/create/subprocess::go-exec-command-call
      - id: micro-behaviors/process/create/subprocess::go-powershell-command
      - id: micro-behaviors/communications/http/download/cli::go-powershell-web-download-to-file
      - id: micro-behaviors/process/create/hidden::argv-array-windowstyle-hidden
      - id: metadata/lang/source/syntax/argument::go-start-process-powershell-filepath
    unless:
      - id: metadata/package/testing/harness/runtime/
      # Prefer the richer context when certutil decoding is also present.
      - id: go-powershell-certutil-script-launch
  - id: go-powershell-certutil-script-launch
    desc: Go downloads, certutil-decodes and launches script
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/process/create/subprocess::go-powershell-launch-call
      - id: micro-behaviors/process/create/subprocess::go-exec-command-call
      - id: micro-behaviors/process/create/subprocess::go-powershell-command
      - id: micro-behaviors/communications/http/download/cli::go-powershell-web-download-to-file
      - id: micro-behaviors/data/decode/command::certutil-decode-command
      - id: micro-behaviors/data/decode/command::certutil-decodes-powershell-script
      - id: metadata/lang/source/syntax/argument::go-start-process-powershell-filepath
      - id: micro-behaviors/process/create/hidden::argv-array-windowstyle-hidden
    unless:
      - id: metadata/package/testing/harness/runtime/
