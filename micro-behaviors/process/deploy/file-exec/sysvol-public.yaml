defaults:
  platforms: [windows]
composite_rules:
  - id: sysvol-public-shell-launch
    desc: SYSVOL copy near Public executable launch
    crit: notable
    conf: 0.96
    for: [scripts]
    all:
      - id: micro-behaviors/fs/file/copy::sysvol-script-file-transfer
      - id: micro-behaviors/process/create/launch::cmd-public-executable-launch
    near_lines: 2
