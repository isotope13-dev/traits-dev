defaults:
  platforms: [unix]
  for: [shell]
  conf: 0.93
composite_rules:
  # Neither public-IP deployment nor a CPU build matrix proves botnet membership.
  # Suspicious trust-boundary crossings remain separate from a malware verdict.
  - id: public-ip-fetch-chmod-local-launch
    desc: Public-IP transfer, chmod and local launch coexist
    crit: suspicious
    near_lines: 4
    all:
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-literal
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
      - id: micro-behaviors/process/create/local-exec::execute-dot-slash-literal
    any:
      - id: micro-behaviors/communications/http/download/shell::shell-curl-wget-url-fetch
      - id: micro-behaviors/communications/ftp/download/busybox::ftpget-utility-command
  - id: multiarch-transfer-launch-cleanup-sweep
    desc: Multi-architecture transfers, launches and cleanup coexist
    crit: suspicious
    all:
      - id: micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist
      - id: micro-behaviors/fs/directory/chdir::writable-dir-fallback-exact-chain
      - id: micro-behaviors/process/create/local-exec::chmod-exec-literal-local
      - id: micro-behaviors/fs/delete/file/command::rm-local-named-file
    any:
      - id: micro-behaviors/communications/http/download/shell::wget-http-literal-download-cluster
      - id: micro-behaviors/communications/ftp/download/busybox::repeated-ftpget-utility-fetch
