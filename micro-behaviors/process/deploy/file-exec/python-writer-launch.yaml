defaults:
  platforms:
  - unix
  - windows
  for:
  - python
traits:
- id: python-write-then-popen-same-path
  desc: Writes HTTP response then launches same path
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: |2

      ((block
        (expression_statement (assignment left: (identifier) @download
          right: (attribute object: (call function: (attribute object: (identifier) @requests attribute: (identifier) @get)) attribute: (identifier) @body)))
        . (expression_statement (assignment left: (identifier) @destination
          right: (call function: (attribute object: (attribute object: (identifier) @os attribute: (identifier) @pathmodule) attribute: (identifier) @join))))
        .   (with_statement
          (with_clause (with_item value: (as_pattern
            (call function: (identifier) @open arguments: (argument_list (identifier) @path (string) @mode))
            alias: (as_pattern_target (identifier) @handle))))
          body: (block (expression_statement (call function: (attribute object: (identifier) @writer attribute: (identifier) @write) arguments: (argument_list (identifier) @written)))))
        . (expression_statement (call function: (attribute object: (identifier) @sp attribute: (identifier) @popen)
          arguments: (argument_list (list (identifier) @launched))))) @stage
        (#eq? @requests "requests") (#eq? @get "get")
        (#eq? @body "content") (#eq? @download @written)
        (#eq? @destination @path) (#eq? @os "os") (#eq? @pathmodule "path") (#eq? @join "join")
        (#eq? @open "open") (#match? @mode "wb")
        (#eq? @handle @writer) (#eq? @write "write")
        (#eq? @path @launched) (#eq? @sp "subprocess") (#eq? @popen "Popen"))


      ((block
        (expression_statement (assignment left: (identifier) @download
          right: (call function: (attribute object: (identifier) @requests attribute: (identifier) @get))))
        .   (with_statement
          (with_clause (with_item value: (as_pattern
            (call function: (identifier) @open arguments: (argument_list (identifier) @path (string) @mode))
            alias: (as_pattern_target (identifier) @handle))))
          body: (block (expression_statement (call function: (attribute object: (identifier) @writer attribute: (identifier) @write) arguments: (argument_list (attribute object: (identifier) @written attribute: (identifier) @body))))))
        . (expression_statement (call function: (attribute object: (identifier) @sp attribute: (identifier) @popen)
          arguments: (argument_list (list (identifier) @launched))))) @stage
        (#eq? @requests "requests") (#eq? @get "get")
        (#eq? @body "content") (#eq? @download @written)
        (#eq? @open "open") (#match? @mode "wb")
        (#eq? @handle @writer) (#eq? @write "write")
        (#eq? @path @launched) (#eq? @sp "subprocess") (#eq? @popen "Popen"))
