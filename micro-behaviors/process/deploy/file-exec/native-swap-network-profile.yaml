# A signed-resource denial elsewhere in an image does not establish that its
# self-updater downloads malware. The reviewed updater asks the user first.
# This profile records co-occurrence without binding a network result to the
# swap sequence or upgrading ordinary deployment through another conviction.
defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: native-image-swap-network-download-profile
    desc: Native image swap with network-download references
    crit: notable
    conf: 0.96
    all:
      - id: x86-image-swap-relaunch
      - id: micro-behaviors/data/config/schema::download-url-field-name
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-runtime-text-download-flow
