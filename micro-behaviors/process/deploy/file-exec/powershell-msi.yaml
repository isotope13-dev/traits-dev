defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-temp-msi-install
    desc: File download near quiet TEMP MSI installation
    crit: notable
    conf: 0.98
    near_bytes: 1024
    all:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-download
      - id: micro-behaviors/fs/path/temp::temp-msi-staging
      - id: micro-behaviors/process/create/installer::powershell-variable-msi-quiet-install
    any:
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: micro-behaviors/process/create/installer::msiexec-norestart-switch
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::useb-flag
