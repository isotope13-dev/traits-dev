defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: indexed-drive-self-copy-launch-templates
  desc: Indexed-drive self-copy with launch templates
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule indexed_drive_self_copy_launch_templates {\n strings:\n$own = /call:[A-Za-z_][A-Za-z0-9_]{0,23}\
      \ \"%~dpnx0\" \"%[A-Za-z_][A-Za-z0-9_]{0,23}%\\\\\"/ nocase\n$head = /call:[A-Za-z_][A-Za-z0-9_]{0,23} / nocase\n\
      $copydef = /:[A-Za-z_][A-Za-z0-9_]{0,23}\\r?\\n([^:\\r\\n]{0,240}\\r?\\n){0,3}copy \"%~1\" \"%~dp2\"\\r?\\\
      nattrib \"%~1\" \\+s \\+h\\r?\\nattrib \"%~dp2%~nx1\" \\+s \\+h\\r?\\ngoto :eof/ nocase\n$vbcall = /call:[A-Za-z_][A-Za-z0-9_]{0,23}\
      \ >\"%[A-Za-z_][A-Za-z0-9_]{0,23}%\\\\%~n0\\.vbe\"/ nocase\n$vbdef = /:[A-Za-z_][A-Za-z0-9_]{0,23}\\r?\\necho\\\
      .set [A-Za-z_][A-Za-z0-9_]{0,23}=wscript\\.createobject\\(\"wscript\\.shell\"\\)\\r?\\necho\\.[A-Za-z_][A-Za-z0-9_]{0,23}\\\
      .run \"%~nx0 \\/start\",0\\r?\\ngoto :eof/ nocase\n$obj = /echo\\.set [A-Za-z_][A-Za-z0-9_]{0,23}=/ nocase\n\
      $run = /echo\\.[A-Za-z_][A-Za-z0-9_]{0,23}\\.run/ nocase\n$infcall = /call:[A-Za-z_][A-Za-z0-9_]{0,23} >%[A-Za-z_][A-Za-z0-9_]{0,23}%\\\
      \\autorun\\.inf/ nocase\n$infdef = /:[A-Za-z_][A-Za-z0-9_]{0,23}\\r?\\necho\\.\\[AutoRun\\]\\r?\\necho\\.open=wscript\\\
      .exe %~n0\\.vbe\\r?\\necho\\.shell\\\\open\\\\Command=wscript\\.exe %~n0\\.vbe/ nocase\n$select = /set [A-Za-z_][A-Za-z0-9_]{0,23}=![A-Za-z_][A-Za-z0-9_]{0,23}:~%[A-Za-z_][A-Za-z0-9_]{0,23}%,1!:/\
      \ nocase\n$selhead = /set [A-Za-z_][A-Za-z0-9_]{0,23}=/ nocase\n$readhead = /![A-Za-z_][A-Za-z0-9_]{0,23}:~/\
      \ nocase\n$range = /set [A-Za-z_][A-Za-z0-9_]{0,23}=CDEFGHIJKLMNOPQRSTUVWXYZ/ nocase\n condition:\n#own >\
      \ 0 and #own <= 32 and #head > 0 and #head <= 32 and #copydef > 0 and #copydef <= 32 and #vbcall > 0 and #vbcall\
      \ <= 32 and #vbdef > 0 and #vbdef <= 32 and #obj > 0 and #obj <= 32 and #run > 0 and #run <= 32 and #infcall\
      \ > 0 and #infcall <= 32 and #infdef > 0 and #infdef <= 32 and #select > 0 and #select <= 32 and #selhead\
      \ > 0 and #selhead <= 32 and #readhead > 0 and #readhead <= 32 and #range > 0 and #range <= 32 and\nfor any\
      \ c in (1..#own) : (\nfor any ch in (1..#head) : (\nfor any cd in (1..#copydef) : (\nfor any v in (1..#vbcall)\
      \ : (\nfor any vh in (1..#head) : (\nfor any vd in (1..#vbdef) : (\nfor any o in (1..#obj) : (\nfor any r\
      \ in (1..#run) : (\nfor any ic in (1..#infcall) : (\nfor any ih in (1..#head) : (\nfor any id in (1..#infdef)\
      \ : (\nfor any s in (1..#select) : (\nfor any sh in (1..#selhead) : (\nfor any rh in (1..#readhead) : (\n\
      for any t in (1..#range) : (\n(@own[c] == 0 or uint8(@own[c]-1) == 10) and\n@head[ch] == @own[c] and\n(@copydef[cd]\
      \ == 0 or uint8(@copydef[cd]-1) == 10) and (uint8(@copydef[cd]+1+(!head[ch]-6)) == 13 or uint8(@copydef[cd]+1+(!head[ch]-6))\
      \ == 10) and (!head[ch]-6) == (!head[ch]-6) and for all k in (0..(!head[ch]-6)-1) : ((uint8(@head[ch]+5+k)\
      \ | 32) == (uint8(@copydef[cd]+1+k) | 32)) and\n(@vbcall[v] == 0 or uint8(@vbcall[v]-1) == 10) and\n@head[vh]\
      \ == @vbcall[v] and\n(@vbdef[vd] == 0 or uint8(@vbdef[vd]-1) == 10) and (uint8(@vbdef[vd]+1+(!head[vh]-6))\
      \ == 13 or uint8(@vbdef[vd]+1+(!head[vh]-6)) == 10) and (!head[vh]-6) == (!head[vh]-6) and for all k in (0..(!head[vh]-6)-1)\
      \ : ((uint8(@head[vh]+5+k) | 32) == (uint8(@vbdef[vd]+1+k) | 32)) and\n@obj[o] > @vbdef[vd] and @obj[o]+!obj[o]\
      \ < @vbdef[vd]+!vbdef[vd] and\n(@obj[o] == 0 or uint8(@obj[o]-1) == 10) and\n@run[r] > @obj[o] and @run[r]+!run[r]\
      \ < @vbdef[vd]+!vbdef[vd] and\n(@run[r] == 0 or uint8(@run[r]-1) == 10) and\n(!obj[o]-10) == (!run[r]-9) and\
      \ for all k in (0..(!obj[o]-10)-1) : ((uint8(@obj[o]+9+k) | 32) == (uint8(@run[r]+5+k) | 32)) and\n(@infcall[ic]\
      \ == 0 or uint8(@infcall[ic]-1) == 10) and\n@head[ih] == @infcall[ic] and\n(@infdef[id] == 0 or uint8(@infdef[id]-1)\
      \ == 10) and (uint8(@infdef[id]+1+(!head[ih]-6)) == 13 or uint8(@infdef[id]+1+(!head[ih]-6)) == 10) and (!head[ih]-6)\
      \ == (!head[ih]-6) and for all k in (0..(!head[ih]-6)-1) : ((uint8(@head[ih]+5+k) | 32) == (uint8(@infdef[id]+1+k)\
      \ | 32)) and\n(!own[c]-!head[ch]-15) == (!vbcall[v]-!head[vh]-14) and for all k in (0..(!own[c]-!head[ch]-15)-1)\
      \ : ((uint8(@own[c]+!head[ch]+12+k) | 32) == (uint8(@vbcall[v]+!head[vh]+3+k) | 32)) and\n(!own[c]-!head[ch]-15)\
      \ == (!infcall[ic]-!head[ih]-15) and for all k in (0..(!own[c]-!head[ch]-15)-1) : ((uint8(@own[c]+!head[ch]+12+k)\
      \ | 32) == (uint8(@infcall[ic]+!head[ih]+2+k) | 32)) and\n(@select[s] == 0 or uint8(@select[s]-1) == 10) and\n\
      (@range[t] == 0 or uint8(@range[t]-1) == 10) and\n@selhead[sh] == @select[s] and\n@readhead[rh] == @select[s]+!selhead[sh]\
      \ and\n(!own[c]-!head[ch]-15) == (!selhead[sh]-5) and for all k in (0..(!own[c]-!head[ch]-15)-1) : ((uint8(@own[c]+!head[ch]+12+k)\
      \ | 32) == (uint8(@selhead[sh]+4+k) | 32)) and\n(!range[t]-29) == (!readhead[rh]-3) and for all k in (0..(!range[t]-29)-1)\
      \ : ((uint8(@range[t]+4+k) | 32) == (uint8(@readhead[rh]+1+k) | 32)) and\n@range[t] < @select[s] and @select[s]\
      \ < @infcall[ic] and @infcall[ic] < @vbcall[v] and @vbcall[v] < @own[c]\n)\n)\n)\n)\n)\n)\n)\n)\n)\n)\n)\n\
      )\n)\n)\n)\n}"
