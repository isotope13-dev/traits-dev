defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: shell-launches-heredoc-written-python
    desc: Launches Python written from a heredoc
    conf: 0.99
    if:
      type: tree-sitter
      language: shell
      query: |
        ((program
           (redirected_statement body: (command name: (command_name) @writer .)
             redirect: (file_redirect ">" destination: [
               (simple_expansion (variable_name) @file)
               (string . (simple_expansion (variable_name) @file) .)])
             redirect: (heredoc_redirect)) .
           (command name: (command_name) @interpreter .
             argument: [
               (simple_expansion (variable_name) @launched)
               (string . (simple_expansion (variable_name) @launched) .)]))
         (#eq? @writer "cat")
         (#match? @interpreter "^python[23]?$" )
         (#eq? @file @launched))
