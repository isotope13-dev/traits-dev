defaults:
  for: [scripts, manifests, html, xml, dockerfile, package-lock.json, groovy]
  platforms: [linux, macos, windows]

composite_rules:
- id: hidden-chmod-local-exec-source
  desc: C source has hidden chmod and launch clues
  crit: suspicious
  conf: 0.97
  for:
    - c
    - cpp
  near_lines: 3
  all:
    - id: micro-behaviors/fs/chmod/executable/hidden::chmod-hidden-path-source
  any:
    - id: micro-behaviors/process/deploy/file-exec/command::arch-cat-setuid-short-payload
    - id: micro-behaviors/process/daemonize/background::background-local-exec
    - id: micro-behaviors/process/daemonize/background::background-tmp-execution
    - id: micro-behaviors/process/create/shell/interpreter::bash-local-relative-script
    - id: micro-behaviors/process/deploy/file-exec/command::cat-payload-chmod-exec
    - id: micro-behaviors/process/deploy/file-exec/command::chmod-777-wildcard-then-exec
    - id: micro-behaviors/process/deploy/file-exec/command::chmod-setuid-wildcard-then-exec
    - id: micro-behaviors/process/deploy/file-exec/command::composer-linked-hidden-background-invocation
    - id: micro-behaviors/process/create/shell/interpreter::dash-local-relative-script
    - id: micro-behaviors/process/daemonize/background::dockerfile-hidden-tmp-background-exec
    - id: metadata/lang/source/syntax/command/launch::execute-dot-slash-empty-path
    - id: micro-behaviors/process/deploy/interpreter-command::osascript-dup
    - id: micro-behaviors/process/create/shell/variable-command::batch-for-start-variable
    - id: micro-behaviors/process/create/shell/command-mode::batch-powershell-setacl-command-text
