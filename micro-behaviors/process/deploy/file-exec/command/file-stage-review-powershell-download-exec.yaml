defaults:
  platforms: [windows]
  for: [pe, powershell, javascript, vbs]
composite_rules:
  - id: powershell-file-variable-download-launch
    desc: Downloads and launches $file
    crit: notable
    conf: 0.97
    for: [batch, powershell]
    near_bytes: 1600
    all:
      - id: micro-behaviors/communications/http/download/cli::iwr-outfile-file-variable
      - id: metadata/lang/source/syntax/command/launch::start-process-file-variable
  # WebClient.DownloadFile to an executable-typed destination, then
  # Start-Process nearby. Co-occurrence, not a proven shared path: the
  # destination-typing atom already requires an executable extension.
