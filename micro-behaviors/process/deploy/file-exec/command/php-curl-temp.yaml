# These are operations, not an attack verdict: ordinary installers can do this.
# Filefacts supplies argument provenance; no live AST query is needed.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.97
traits:
  - id: php-shell-temp-path-command
    desc: PHP shell command uses temp-derived path
    if:
      type: symbol
      kind: call
      exact: shell_exec
      arg:
        index: 0
        from:
          call: '^sys_get_temp_dir$'
          through:
            - call: '^escapeshellarg$'
              arguments: [0]
  - id: php-temp-path-proc-open
    desc: PHP proc_open uses temp-derived variable
    if:
      type: symbol
      kind: call
      exact: proc_open
      arg:
        index: 0
        kind: identifier
        from:
          call: '^sys_get_temp_dir$'
  - id: php-temp-path-chmod
    desc: PHP chmod uses temp-derived path
    if:
      type: symbol
      kind: call
      exact: chmod
      arg:
        index: 0
        from:
          call: '^sys_get_temp_dir$'
composite_rules:
  - id: php-curl-temp-chmod-launch
    desc: PHP curl transfer near temporary-path chmod and proc_open
    near_lines: 24
    all:
      - id: php-shell-temp-path-command
      - id: micro-behaviors/communications/http/client/reference::curl-fail-silent-url-reference
      - id: php-temp-path-chmod
      - id: php-temp-path-proc-open
