defaults:
  crit: notable
  platforms: [android, unix]
  for: [shell]
composite_rules:
  - id: termux-local-file-temp-runner
    desc: Temporary-copy and runner command clues
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/temp::termux-temp-exe-run-path
      - id: micro-behaviors/fs/file/copy/command::copy-input-file-to-temp-variable
      - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
      - id: micro-behaviors/process/create/shell/variable-command::execute-temp-variable-with-arguments
