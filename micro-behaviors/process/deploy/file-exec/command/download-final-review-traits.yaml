defaults:
  platforms: [windows, unix]
  crit: suspicious
  for: [python, shell]

traits:
  - id: download-chmod-execute
    desc: Download chmod and os.system text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: "(curl|wget).{0,50}chmod.{0,50}\\+x.{0,50}os\\.system"

composite_rules:
  - id: python-download-run-temp-exe
    desc: Python URL open and temporary executable launch clues
    crit: notable
    conf: 0.94
    for: [python]
    all:
      - id: micro-behaviors/fs/temp/file::python-mktemp-exe-suffix
      - id: metadata/lang/source/syntax/call/argument-identifier::python-subprocess-tmp-argument
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
