defaults:
  platforms: [windows, unix]
  crit: suspicious
  for: [python, shell]

traits:
  - id: write-system-or-chmod-text
    desc: Write with system or chmod text
    crit: suspicious
    conf: 0.90
    if:
      type: text
      regex: 'write\(fileData\).{0,16}system.{0,16}&|write\(.{0,16}\).{0,16}chmod.{0,16}\+x'
    downgrade:
      any:
        - id: metadata/package/testing/harness/runtime::benchmark-task-agent-record
