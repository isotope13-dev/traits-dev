# Architecture selection and decryption also occur in legitimate updaters.
# Preserve those capabilities without inferring an attacker-controlled loader.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
composite_rules:
  - id: shell-architecture-encrypted-download-detach
    desc: Architecture references accompany download, AES decoding, chmod and nohup
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/download/shell::fetch-var-output-var
      - id: micro-behaviors/crypto/decrypt/transform/symmetric::openssl-aes-decrypt
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
      - id: micro-behaviors/os/sysinfo/platform/arch::multi-arch-target
  - id: shell-architecture-download-detach
    desc: Architecture query accompanies download, chmod and nohup
    conf: 0.98
    near_lines: 40
    all:
      - id: micro-behaviors/process/deploy/file-exec/command::download-chmod-nohup-cooccurrence
      - id: micro-behaviors/os/sysinfo/platform/arch::sh-uname-fingerprint
    any:
      - id: micro-behaviors/fs/path/hidden::hidden-tmp-path
      - id: micro-behaviors/communications/http/download/curl::curl-output-staging-path
    unless:
      - id: micro-behaviors/os/package-manager/installer-script::installer-script
