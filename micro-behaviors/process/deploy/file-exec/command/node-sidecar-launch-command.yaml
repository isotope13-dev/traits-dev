defaults:
  platforms: [unix, windows]
  for: [shell]

composite_rules:
  - id: micro-behaviors/process/deploy/file-exec/command::node-sidecar-launch-command
    desc: Sidecar shell or cmd launch text
    crit: component
    for: [javascript, typescript]
    any:
      - id: micro-behaviors/process/deploy/file-exec/command::node-shell-sidecar-launch
      - id: micro-behaviors/process/deploy/file-exec/command::node-cmd-sidecar-launch
