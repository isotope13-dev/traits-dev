defaults:
  platforms: [unix, windows]
  for: [shell]

traits:
  - id: micro-behaviors/process/deploy/file-exec/command::node-shell-sidecar-launch
    desc: Shell sidecar command text
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      regex: '/bin/shell\s+[^"''\n]{1,120}\.(sh|shell)\b'
