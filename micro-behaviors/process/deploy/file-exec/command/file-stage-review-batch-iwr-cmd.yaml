defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-powershell-iwr-cmd-sequence
    desc: PowerShell file fetch precedes cmd launch
    crit: notable
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      exclude_comments: true
      # Keep the download and child-shell syntax in one bounded command text.
      # This records co-occurrence and order without claiming that the output
      # path is the cmd target; the hostile objective adds policy-bypass context.
      regex: '(?s)\bpowershell\b.{0,130}\b(iwr|Invoke-WebRequest).{0,60}-(o|OutFile)\b.{0,80}\bcmd\s+/c'
  - id: batch-iwr-cmd-same-filename
    desc: Batch downloads and launches the same executable
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      language: batch
      query: |
        (program
          (cmd (command_name) @ps
            (argument_list
              . (argument_value) @download . (argument_value) @url
              . (argument_value) @option . (argument_value) @written .))
          . (cmd (command_name) @shell
            (argument_list
              . (command_option) @mode . (argument_value) @executed .))
          (#match? @ps "(?i)^powershell(\\.exe)?$")
          (#match? @download "(?i)^(Invoke-WebRequest|iwr)$")
          (#match? @url "(?i)^https?://")
          (#match? @option "(?i)^-OutFile$")
          (#match? @written "(?i)^[a-z0-9_.-]+[.]exe$")
          (#match? @shell "(?i)^cmd(\\.exe)?$")
          (#match? @mode "(?i)^/c$")
          (#eq? @written @executed))
