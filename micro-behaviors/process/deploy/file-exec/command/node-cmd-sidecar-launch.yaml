defaults:
  platforms: [unix, windows]
  for: [shell]

traits:
  - id: micro-behaviors/process/deploy/file-exec/command::node-cmd-sidecar-launch
    desc: Node spawn cmd slash-c sidecar
    crit: notable
    for: [javascript, typescript]
    if:
      type: text
      regex: 'spawn\([^\n]{0,32}cmd\.exe[^\n]{0,32}/c[^\n]{0,120}\.(bat|cmd)'
