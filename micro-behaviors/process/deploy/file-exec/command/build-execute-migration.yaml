defaults:
  platforms:
    - unix
    - windows
  crit: suspicious
traits:
  - id: setup-py-chmod-bash-tmp-sh
    desc: setup.py chmods and runs /tmp shell script
    crit: suspicious
    conf: 0.95
    for:
      - python
    if:
      type: text
      regex: chmod\s+777\s+/tmp/.{1,40}\.sh\s+&&\s+bash\s+/tmp/.{1,40}\.sh

composite_rules:
  - id: rust-build-rs-delayed-target-start
    desc: build.rs delays package binary execution
    crit: suspicious
    conf: 0.98
    for:
      - rust
    all:
      - id: metadata/build/ecosystem::cargo-build-script-basename
      - id: micro-behaviors/fs/path/location::rust-join-target-component
      - id: micro-behaviors/process/create/path-execution::rust-build-rs-wait-loop-start
    any:
      - id: micro-behaviors/process/daemonize/detach::background-ampersand-hidden
      - id: micro-behaviors/os/console/io::redirect-dev-null
