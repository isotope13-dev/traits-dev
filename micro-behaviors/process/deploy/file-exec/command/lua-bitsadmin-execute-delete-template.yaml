defaults:
  platforms: [windows, unix]
  for: [lua]
traits:
  - id: lua-bitsadmin-execute-delete-template
    desc: Formats BITS download-execute-delete commands
    crit: suspicious
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: string.format
      arg:
        index: 0
        kind: string
        regex: '(?i)bitsadmin(\.exe)?\s+/transfer.{0,120}&&\s*"?%s"?\s*&&\s*del\s+"?%s"?'
