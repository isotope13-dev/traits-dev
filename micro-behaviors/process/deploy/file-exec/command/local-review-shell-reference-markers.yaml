defaults:
  platforms: [unix]
  for: [shell]
traits:
- id: hidden-dotfile-chmod-exec
  desc: Hidden-file chmod and relative invocation text
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'chmod\s+\+x\s+\.[\w-]{1,12}\s+&&\s+\./\.[\w-]{1,12}'
- id: chmod-setuid-wildcard-then-exec
  desc: chmod setuid wildcard then execute
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'chmod\s+\+s\s+\*;[^\n]{0,80}\./[A-Za-z0-9._-]{1,40}'
# Classic multi-arch IoT stager: `cat <arch> >s;chmod +s *;./s …; rm -rf s`.
- id: arch-cat-setuid-short-payload
  desc: Repeated copy, setuid chmod and launch text
  crit: notable
  conf: 0.96
  count_min: 3
  if:
    type: text
    regex: 'cat\s+[A-Za-z0-9._-]{2,12}\s*>s;chmod\s+\+s\s+\*;\./s\b'
- id: chmod-777-wildcard-then-exec
  desc: chmod 777 wildcard then relative invocation text
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'chmod\s+777\s+\*;[^\n]{0,80}\./[A-Za-z0-9._-]{2,40}'
- id: cat-payload-chmod-exec
  desc: Repeated copy, chmod and launch text
  crit: notable
  conf: 0.98
  count_min: 3
  if:
    type: text
    regex: 'cat\s+[^;\s]{1,20}\s*>\s*[^;\s]{1,20};\s*chmod\s+\+[xs]\s+[^;\s]{1,20};\s*\./\S{1,20}'
