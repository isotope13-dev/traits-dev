defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable
traits:
  - id: lnk-php-script-execution
    desc: LNK arguments name a PHP script
    conf: 0.93
    if:
      type: value
      path: lnk.arguments
      # php.exe test.php / php script.php: interpreter plus a .php operand.
      # The operand name is unrestricted so renamed payloads still match.
      regex: '(?i)\bphp(\.exe)?\s+[^\r\n&|]{1,160}\.php\b'
