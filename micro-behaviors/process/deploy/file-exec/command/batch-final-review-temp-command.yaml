defaults:
  platforms: [windows]
  for: [class, swift, scripts, source, c, cpp, batch]
traits:
  - id: temporary-batch-command-chain
    desc: Chained temporary batch command outside comments
    crit: notable
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      regex: '(?i)%TEMP%\\{1,2}[\w.-]{1,80}[.](cmd|bat)\s*&&\s*%TEMP%\\{1,2}[\w.-]{1,80}[.](cmd|bat)'
