defaults:
  platforms:
    - linux
    - macos
    - windows
  for:
    - shell
traits:
  - id: shell-tmp-self-copy-exec-sequence
    desc: Mentions /tmp, cp $0, then exec
    crit: notable
    conf: 0.9
    for: [shell, text]
    if:
      type: text
      regex: '(?m)/tmp/[\s\S]{0,40}\bcp\s+\$0\b[\s\S]{0,40}\bexec\s+'
