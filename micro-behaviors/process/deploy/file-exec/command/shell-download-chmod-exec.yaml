defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: shell-curl-wget-http-fetch
    desc: Shell curl or wget appears near an HTTP URL
    crit: notable
    conf: 0.88
    near_bytes: 320
    all:
      - id: micro-behaviors/communications/http/request/client/command::curl-wget-command-position
      - id: micro-behaviors/communications/url/reference::shell-http-url-reference

  - id: shell-download-chmod-exec
    desc: HTTP download, chmod and local execution co-occur
    crit: notable
    conf: 0.9
  # Keep the three capabilities in one local command sequence. A file-wide
  # conjunction makes ordinary test scripts look like droppers when an
  # unrelated curl and chmod occur in different phases of the test.
    near_bytes: 512
    all:
  # Require a shell curl/wget command near an HTTP URL, including a URL
  # stored in a variable.
      - id: shell-curl-wget-http-fetch
      - id: micro-behaviors/fs/chmod/executable/evidence::executable-mode-evidence
    any:
      - id: metadata/lang/source/syntax/command/launch::tmp-path-execution
      - id: micro-behaviors/process/create/path-execution::local-execution
      - id: micro-behaviors/process/deploy/file-exec/command::chmod-exec-var-local
      - id: micro-behaviors/process/deploy/file-exec/command::hidden-dotfile-chmod-exec
      - id: micro-behaviors/process/create/shell/variable-command::sh-dynamic-command-target
      - id: metadata/lang/source/syntax/command/launch::chmod-then-local-execute-command
