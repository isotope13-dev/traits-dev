defaults:
  conf: 0.99
  platforms: [linux]
  for: [desktop-entry]
  attack: T1059.004,T1105,T1140
  mbc: B0023
composite_rules:
  - id: desktop-entry-native-download-execute
    desc: Desktop Entry downloads and launches executable
    # Some legitimate launchers self-update this way; hostile consumers add
    # either a document lure or persistence evidence.
    crit: suspicious
    attack: T1105,T1204.002
    all:
      - id: micro-behaviors/process/config/target::desktop-exec-shell-command-mode
      - id: micro-behaviors/communications/http/download/cli/curl-wget::desktop-exec-download-tool
      - id: micro-behaviors/fs/chmod/executable/mode::desktop-exec-chmod
    any:
      - id: micro-behaviors/process/create/path-execution::desktop-entry-user-data-executable-launch
      - id: metadata/package/entrypoint/command::desktop-entry-hidden-temp-executable-launch
      - id: metadata/package/entrypoint/command::desktop-entry-chmod-variable-launch
      - id: metadata/package/entrypoint/command::desktop-entry-chmod-relative-launch
