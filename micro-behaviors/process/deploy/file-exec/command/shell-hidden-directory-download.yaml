# Bind the output, chmod target, and launched path; installers may also do this.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1105,T1059.004,T1564.001

traits:
  - id: shell-hidden-directory-download-exec
    desc: Downloads and runs hidden directory file
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      language: shell
      query: |
        ((program
          (command name: (command_name) @fetch
            argument: (_) @url
            argument: (word) @output_flag . argument: (_) @output)
          (command name: (command_name) @chmod
            argument: (word) @mode . argument: (_) @armed)
          (command name: (command_name) @launched)) @chain
          (#eq? @fetch "curl")
          (#match? @url "^https?://")
          (#match? @output_flag "^(-o|--output)$")
          (#match? @output "^/([A-Za-z0-9_-]+/)*\\.[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+$")
          (#eq? @chmod "chmod") (#eq? @mode "+x")
          (#eq? @output @armed) (#eq? @output @launched))
