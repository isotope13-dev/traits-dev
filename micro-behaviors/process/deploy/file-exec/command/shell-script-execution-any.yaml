defaults:
  attack: T1059.004
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
composite_rules:
  - id: shell-script-execution-any
    desc: Executes a shell script file (.sh)
    conf: 0.7
    any:
      - id: micro-behaviors/process/create/shell/interpreter::shell-script-execution
      - id: micro-behaviors/process/create/shell/interpreter::shell-script-execution-env
      - id: micro-behaviors/process/create/shell/interpreter::shell-script-execution-alt
      - id: micro-behaviors/process/interpreter/eval/source::dot-source-script-command-text
      - id: micro-behaviors/process/create/path-execution::shell-script-relative-execution
