defaults:
  platforms: [unix]
  for: [shell]
composite_rules:
  - id: chmod-exec-var-local
    desc: chmod and variable launch clues
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/create/path-execution::execute-dot-slash-var
    near_bytes: 180
  # Same chmod→run chain when the path is invoked as `"$var"` rather than `./$var`.
  - id: chmod-exec-quoted-var-local
    desc: chmod and quoted-variable launch clues
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/create/shell/variable-command::execute-quoted-var
    near_bytes: 180
  - id: chmod-exec-literal-local
    desc: chmod and local launch clues
    crit: notable
    conf: 0.9
    for:
      - shell
      - text
    all:
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
    any:
      - id: micro-behaviors/process/create/path-execution::execute-dot-slash-literal
      - id: micro-behaviors/process/create/shell/interpreter::shell-interpreter-local-script
      - id: metadata/lang/source/syntax/command/launch::relative-executable-command-text
    near_bytes: 180
  - id: temp-exec-capability-probe
    desc: Temporary execution probe clues coexist
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/fs/write/file/redirect::noop-exit-shebang-script-write
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/create/shell/variable-command::execute-quoted-var
      - id: micro-behaviors/fs/delete/file/command::rm-force-variable-target
    near_bytes: 512
