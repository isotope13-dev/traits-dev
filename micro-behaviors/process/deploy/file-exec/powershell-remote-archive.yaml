defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: remote-archive-extract-executable-launch
    desc: Extracts and launches a downloaded executable
    crit: suspicious
    conf: 0.94
    if:
      type: yara
      source: |
        rule powershell_remote_archive_extract_executable_launch {
          strings:
            $download = /\b(Invoke-WebRequest|iwr)\b[^\r\n]{0,320}-OutFile\b[^\r\n]{1,180}/ nocase
            $extract = /\bExpand-Archive\b[^\r\n]{0,300}(-DestinationPath|\-Dest)\b[^\r\n]{1,180}/ nocase
            $select = /\bGet-ChildItem\b[^\r\n]{0,300}-Filter\s+["']\*\.(exe|dll)["'][^\r\n]{0,160}-Recurse\b/ nocase
            $launch = /\b(Start-Process|Invoke-Item)\b[^\r\n]{0,180}(FullName|\.exe)/ nocase
          condition:
            $download and $extract and $select and $launch
        }
