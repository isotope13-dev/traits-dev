# Compare adjacent download and launch calls in one lexical block. A literal
# or unchanged identifier binds the destination to argv's executable slot.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-urlretrieve-same-path-argv
    desc: Download destination reused as executable
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((block
          (expression_statement (call
            function: (attribute) @download
            arguments: (argument_list . (_) . [(string) (identifier)] @saved)))
          .
          (expression_statement [
            (call function: (attribute) @launch
              arguments: (argument_list (list . [(string) (identifier)] @executed)))
            (assignment right: (call function: (attribute) @launch
              arguments: (argument_list (list . [(string) (identifier)] @executed))))
          ])) @chain
          (#eq? @download "urllib.request.urlretrieve")
          (#match? @launch "^subprocess[.](run|Popen|call|check_call)$")
          (#eq? @saved @executed))
