defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: download-chmod-launch
    desc: Downloads, chmods, launches one literal path
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((block
          (expression_statement
            (call
              function: (attribute) @download
              arguments: (argument_list (_) (string) @saved)))
          (expression_statement
            (call
              function: (attribute
                object: (call
                  function: (identifier) @path
                  arguments: (argument_list (string) @chmodded))
                attribute: (identifier) @chmod)
              arguments: (argument_list (integer) @mode)))
          (expression_statement
            (call
              function: (attribute) @launch
              arguments: (argument_list (list (string) @launched))))) @flow
          (#eq? @download "urllib.request.urlretrieve")
          (#eq? @path "Path")
          (#eq? @chmod "chmod")
          (#match? @mode "^(0o755|0o700|493|448)$")
          (#eq? @launch "subprocess.Popen")
          (#eq? @saved @chmodded)
          (#eq? @saved @launched))
