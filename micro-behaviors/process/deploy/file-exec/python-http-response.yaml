# The response variable and saved/launched path must agree. An image download
# beside an unrelated credential-helper subprocess is not a deployment chain.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-http-response-file-launch
    desc: Writes and launches one HTTP response file
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((block
          (expression_statement (assignment
            left: (identifier) @response
            right: (call function: (attribute) @request)))
          (expression_statement (call
            function: (attribute
              object: (call function: (identifier) @path
                arguments: (argument_list (identifier) @saved))
              attribute: (identifier) @write)
            arguments: (argument_list (attribute
              object: (identifier) @body
              attribute: (identifier) @content))))
          (expression_statement (call
            function: (attribute) @launch
            arguments: (argument_list (list (identifier) @launched))))) @deployment
          (#match? @request "^requests\\.(get|post)$")
          (#eq? @response @body)
          (#eq? @path "Path")
          (#eq? @write "write_bytes")
          (#eq? @content "content")
          (#match? @launch "^subprocess\\.(run|Popen)$")
          (#eq? @saved @launched))
