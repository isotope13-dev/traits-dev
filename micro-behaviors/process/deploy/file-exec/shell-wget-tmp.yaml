# Same matcher as the former hostile staging rule. These ordinary deployment
# operations have benign installer uses; the explicit exploit rules supply
# attack context for a worm. Keep the capability notable in all contexts.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1105
  mbc: B0030
composite_rules:
- id: shell-wget-tmp-chmod-exec
  desc: Wget, tmp chmod and execution co-occur
  crit: notable
  conf: 0.97
  attack: "T1105,T1222.002"
  near_lines: 20
  unless:
  - id: metadata/file/extension/identity::python-artifact-extension
  all:
  - id: micro-behaviors/communications/http/download/wget::wget-http-url-reference
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-tmp-file
  - id: micro-behaviors/process/create/local-exec::tmp-path-execution
