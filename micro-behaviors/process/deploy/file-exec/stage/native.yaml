# Capability legs of a native drop-and-run stage: write the payload, mark it
# executable, and conceal or receive it. Each is ordinary on its own (every
# daemon writes and chmods files); they live here rather than under
# objectives/evasion/indicator-removal so a reference to that objective tree
# does not count bare write()/chmod() as removing indicators.
defaults:
  platforms: [linux, macos]
  for: [elf, macho]

composite_rules:
  - id: native-stage-file-write-capability
    desc: Native stage file-write API reference
    crit: component
    conf: 0.7
    any:
      - id: micro-behaviors/fs/write/file/descriptor::write
      - id: micro-behaviors/fs/write/file/handle/unspecified::fputc

  - id: native-stage-chmod-capability
    desc: Native stage chmod API reference
    crit: component
    conf: 0.7
    any:
      - id: micro-behaviors/fs/chmod/modify::chmod-symbol
      - id: micro-behaviors/fs/chmod/modify::fchmod-symbol
      - id: micro-behaviors/fs/chmod/modify::fchmodat-symbol
      - id: micro-behaviors/fs/chmod/modify::lchmod-symbol
      - id: micro-behaviors/fs/chmod/modify::static-chmod-symbol-text
      - id: micro-behaviors/fs/chmod/modify::chmod-direct-syscall
      - id: micro-behaviors/fs/chmod/modify::aarch64-fchmodat-syscall-sequence

  - id: native-stage-concealment-or-delivery
    desc: Hidden stage path, socket, XOR, or kthread
    crit: component
    conf: 0.85
    any:
      - id: micro-behaviors/fs/path/hidden::nul-terminated-hidden-temp-stage-path
      - id: micro-behaviors/fs/path/hidden::hidden-tmp-dotfile-path
      - id: micro-behaviors/fs/path/hidden::hidden-tmp-path
      - id: micro-behaviors/fs/path/hidden::var-tmp-hidden
      - id: micro-behaviors/fs/path/hidden::dev-shm-hidden-path
      - id: micro-behaviors/communications/socket/receive::recv-symbol
      - id: micro-behaviors/data/encoding/xor/unspecified-key::macho-stack-indexed-byte-xor-loop
      - id: micro-behaviors/process/info/name::bracketed-kworker-name-reference
      - id: micro-behaviors/process/info/name::bracketed-kthreadd-name-reference
      - id: micro-behaviors/process/info/name::bracketed-rcu-thread-name-reference
