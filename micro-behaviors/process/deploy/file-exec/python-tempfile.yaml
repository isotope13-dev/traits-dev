# Response text is written through one temporary-file handle, whose name
# is then passed to a Python interpreter. Intent is supplied by consumers.
# This query is needed because filefacts does not retain with-item handle flow.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-written-tempfile-interpreter
    desc: Executes response text through temporary script
    if:
      type: tree-sitter
      query: |
        (
        (block
          (expression_statement (assignment
            left: (identifier) @response
            right: (call function: (attribute attribute: (identifier) @_get))))
          (expression_statement (assignment
            left: (identifier) @content
            right: (attribute object: (identifier) @response_read attribute: (identifier) @_text)))
          (with_statement
            (with_clause (with_item value: (as_pattern
              (call function: (attribute attribute: (identifier) @_temp))
              alias: (as_pattern_target (identifier) @handle))))
            body: (block
              (expression_statement (call
                function: (attribute object: (identifier) @writer attribute: (identifier) @_write)
                arguments: (argument_list (identifier) @written)))
              (expression_statement (assignment
                left: (identifier) @path
                right: (attribute object: (identifier) @named_handle attribute: (identifier) @_name)))))
          (expression_statement (assignment right: (call
            function: (attribute attribute: (identifier) @_run)
            arguments: (argument_list (list
              [(string) (attribute)] @interpreter
              (identifier) @executed_path)))))) @chain
        (#eq? @_get "get")
        (#eq? @_text "text")
        (#eq? @response @response_read)
        (#eq? @content @written)
        (#eq? @_temp "NamedTemporaryFile")
        (#eq? @_write "write")
        (#eq? @_name "name")
        (#match? @_run "^(run|Popen)$")
        (#match? @interpreter "^(['\"]python[23]?(\\.exe)?['\"]|sys\\.executable)$")
        (#eq? @handle @writer)
        (#eq? @handle @named_handle)
        (#eq? @path @executed_path)
        )
