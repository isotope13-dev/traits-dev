defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-release-cli-operation-cooccurrence
    desc: Release download and CLI execution coexist
    crit: notable
    conf: 0.96
    near_lines: 120
    all:
      - id: micro-behaviors/communications/url/external/github::github-release-download
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/fs/file/open::binary-write-mode
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-read
      - id: micro-behaviors/fs/chmod/executable/mode
      - id: micro-behaviors/process/create/subprocess::python-binary-path-argv-proxy
