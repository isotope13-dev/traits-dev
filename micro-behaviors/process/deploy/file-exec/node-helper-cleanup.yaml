defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-awaited-helper-chmod-launch-cleanup
    desc: Awaits helper, chmods, launches and deletes path
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (expression_statement
            (await_expression
              (call_expression
                function: (identifier) @helper
                arguments: (arguments (_) (identifier) @saved))))
          (expression_statement
            (call_expression
              function: (identifier) @chmod
              arguments: (arguments (identifier) @chmodded (number) @mode)))
          (expression_statement
            (call_expression
              function: (identifier) @launch
              arguments: (arguments (identifier) @launched (array) (object))))
          (try_statement
            body: (statement_block
              (expression_statement
                (call_expression
                  function: (identifier) @unlink
                  arguments: (arguments (identifier) @deleted)))))) @sequence
          (#eq? @chmod "chmodSync")
          (#match? @mode "^0o[1357][0-7][0-7]$")
          (#eq? @launch "spawnSync")
          (#eq? @unlink "unlinkSync")
          (#eq? @saved @chmodded)
          (#eq? @saved @launched)
          (#eq? @saved @deleted))
