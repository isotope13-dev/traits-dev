# A fetched Python file is written to disk, loaded as a module, and invoked
# from a child Python interpreter. Caller-requested job runners can do this too.
defaults:
  for: [whl, python]
  platforms: [unix, windows]
  attack: T1105,T1059.006
  mbc: E1105
composite_rules:
  - id: python-child-interpreter-spec-loader
    desc: Python child interpreter executes importlib spec loader
    crit: notable
    conf: 0.92
    scope: file
    near_lines: 60
    all:
      - id: micro-behaviors/os/module/load::python-importlib-spec-exec-module
      - id: micro-behaviors/process/create/eval::sys-executable-c-popen
    unless:
      - id: metadata/package/testing/presence/harness::python-test-file
      - id: metadata/path::test-directory-component

  - id: urllib-downloaded-python-child-loader
    desc: urllib download and child-interpreter module loader co-occur
    crit: suspicious
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-download-to-binary-output
      - id: micro-behaviors/process/deploy/file-exec::python-child-interpreter-spec-loader
