defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  # The helper receives (source, output pathname). Only on success does the
  # caller hand that same pathname to the imported WinExec, hidden (zero).
  # This records the path handoff; the consumer establishes hostile acquisition.
  - id: x86-helper-output-path-to-winexec
    desc: Helper output pathname reused by hidden WinExec
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        import "pe"
        rule x86_helper_output_path_to_winexec {
          strings:
            $chain = { 8D 85 [4] 50 56 E8 [4] 83 C4 08 85 C0 75 ??
                       50 8D 8D [4] 51 FF 15 [4] 83 F8 20 }
          condition:
            pe.machine == pe.MACHINE_I386 and
            for any c in (1..#chain) : (
              pe.sections[pe.section_index(@chain[c])].characteristics & 0x20000000 != 0 and
              uint32(@chain[c]+2) == uint32(@chain[c]+23) and
              for any lib in pe.import_details : (
                lib.library_name matches /^kernel32[.]dll$/i and
                for any f in lib.functions : (
                  f.name == "WinExec" and
                  uint32(@chain[c]+30) == pe.image_base + f.rva
                )
              )
            )
        }
