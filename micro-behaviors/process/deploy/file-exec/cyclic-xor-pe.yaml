defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
composite_rules:
  - id: cyclic-xor-pe-file-launch
    desc: Concealed PE with bound file-write and launch stub
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/file/encoding/xor::visible-key-cyclic-xor-pe
      - id: micro-behaviors/data/encoding/xor::x86-signed-remainder-byte-xor-loop
      - id: micro-behaviors/process/deploy/file-exec::x86-buffer-file-write-shell-launch-stub
      - id: micro-behaviors/fs/file/open::fopen
      - id: micro-behaviors/fs/write/file/handle::write--fwrite
      - id: micro-behaviors/process/create/shellexec::shell-execute-a
