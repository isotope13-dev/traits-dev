# Bind two getters of one constructed object through the same keyed transform,
# buffer reconstruction, fs calls and imported detached spawn. Runtime computed
# methods remain unresolved; the atom records this observable structural chain.
defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable
  conf: 0.96
traits:
  - id: node-paired-getters-buffer-detached-spawn
    desc: Paired getters feed detached buffer stage
    if:
      type: tree-sitter
      query: |-
        (program
          (lexical_declaration
            (variable_declarator name: (identifier) @fs
              value: (call_expression function: (identifier) @require
                arguments: (arguments . (string (string_fragment) @module) .)))
            (variable_declarator name: (object_pattern
              (pair_pattern key: (property_identifier) @spawn_key value: (identifier) @spawn))
              value: (call_expression function: (identifier) @loader)))
          (function_declaration body: (statement_block
            (lexical_declaration (variable_declarator name: (identifier) @contract
              value: (new_expression constructor: (subscript_expression)
                arguments: (arguments . (identifier) . (identifier) . (identifier) .))))
            (function_declaration body: (statement_block
              (try_statement body: (statement_block
                (variable_declaration
                  (variable_declarator name: (identifier) @cipher1 value: (await_expression
                    (call_expression function: (subscript_expression object: (identifier) @contract1))))
                  (variable_declarator name: (identifier) @cipher2 value: (await_expression
                    (call_expression function: (subscript_expression object: (identifier) @contract2)))))
                (expression_statement (binary_expression right: (parenthesized_expression
                  (sequence_expression
                    (assignment_expression left: (identifier) @plain1 right: (await_expression
                      (call_expression function: (identifier) @decrypt1
                        arguments: (arguments . (identifier) @encrypted1 . (identifier) @key1 .))))
                    (assignment_expression left: (identifier) @plain2 right: (await_expression
                      (call_expression function: (identifier) @decrypt2
                        arguments: (arguments . (identifier) @encrypted2 . (identifier) @key2 .))))
                    (ternary_expression alternative: (parenthesized_expression
                    (sequence_expression
                      (assignment_expression left: (identifier) @hex1 right: (identifier) @decrypted1)
                      (assignment_expression left: (identifier) @hex2 right: (identifier) @decrypted2)
                      (assignment_expression left: (identifier) @buffer
                        right: (call_expression function: (subscript_expression
                          object: (identifier) @Buffer index: (string (string_fragment) @concat))
                          arguments: (arguments . (array
                            (call_expression arguments: (arguments . (identifier) @chunk1 .))
                            (call_expression arguments: (arguments . (identifier) @chunk2 .))) .)))
                      (call_expression function: (subscript_expression object: (identifier) @fs1)
                        arguments: (arguments . (identifier) @path . (identifier) @data .))
                      (assignment_expression left: (identifier) @box right: (object .
                        (pair value: (identifier) @saved) .))
                      (call_expression function: (subscript_expression object: (identifier) @fs2))
                      (assignment_expression left: (identifier) @alias
                        right: (subscript_expression object: (identifier) @box2))
                      (call_expression function: (subscript_expression
                        object: (call_expression function: (identifier) @launch
                          arguments: (arguments . (subscript_expression object: (identifier) @runtime) .
                            (array . (identifier) @launched .) .
                            (object (pair key: (string (string_fragment) @detached)
                              value: (unary_expression argument: (number) @zero))
                              (pair key: (string (string_fragment) @stdio)
                                value: (string (string_fragment) @ignore)))))
                        index: (string (string_fragment) @unref)))))))))))))))) @stage
          (#eq? @contract @contract1) (#eq? @contract @contract2)
          (#eq? @cipher1 @encrypted1) (#eq? @cipher2 @encrypted2)
          (#eq? @decrypt1 @decrypt2) (#eq? @key1 @key2)
          (#eq? @plain1 @decrypted1) (#eq? @plain2 @decrypted2)
          (#eq? @hex1 @chunk1) (#eq? @hex2 @chunk2)
          (#eq? @require "require") (#eq? @module "fs")
          (#eq? @spawn_key "spawn") (#eq? @loader "require") (#eq? @spawn @launch)
          (#eq? @Buffer "Buffer") (#eq? @concat "concat")
          (#eq? @fs @fs1) (#eq? @fs @fs2) (#eq? @buffer @data)
          (#eq? @path @saved) (#eq? @box @box2) (#eq? @alias @launched)
          (#eq? @runtime "process") (#eq? @detached "detached")
          (#eq? @zero "0x0") (#eq? @stdio "stdio") (#eq? @ignore "ignore")
          (#eq? @unref "unref"))
