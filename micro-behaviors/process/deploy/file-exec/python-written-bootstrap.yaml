# Bind source constant -> file writer -> same path in the interpreter argv.
# This observes staging and activation, without asserting hostile provenance.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-written-bootstrap-interpreter
    desc: Writes source then launches that Python file
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((module
          (expression_statement (assignment
            left: (identifier) @source
            right: (string)))
          (function_definition body: (block
            (expression_statement (assignment
              left: (identifier) @path
              right: (call function: (attribute) @join
                arguments: (argument_list (identifier) (string) @filename))))
            (with_statement
              (with_clause (with_item value: (as_pattern
                (call function: (identifier) @open
                  arguments: (argument_list . (identifier) @opened (string) @mode))
                alias: (as_pattern_target (identifier) @handle))))
              body: (block (expression_statement (call
                function: (attribute object: (identifier) @writer
                  attribute: (identifier) @write)
                arguments: (argument_list . (identifier) @written .)))))
            (expression_statement (assignment right: (call
              function: (attribute) @launch
              arguments: (argument_list (list .
                (attribute) @interpreter (identifier) @executed)))))))) @staging
          (#eq? @join "os.path.join")
          (#match? @filename "\\.py['\"]$")
          (#eq? @open "open")
          (#match? @mode "^['\"]w['\"]$")
          (#eq? @path @opened) (#eq? @path @executed)
          (#eq? @handle @writer) (#eq? @write "write")
          (#eq? @source @written)
          (#eq? @interpreter "sys.executable")
          (#match? @launch "^subprocess\\.(Popen|run)$"))
