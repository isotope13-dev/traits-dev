# The PowerShell flow projection does not preserve these argument-list values.
# Bind the writer's first argument to the child's -ArgumentList in the AST.
# Bind the launched executable to a Node path assignment as well.
defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-written-node-script-launch
    desc: Written text path handed to Node
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((statement_list (pipeline (assignment_expression (left_assignment_expression (logical_expression (bitwise_expression (comparison_expression (additive_expression (multiplicative_expression (format_expression (range_expression (array_literal_expression (unary_expression (variable) @runtime)))))))))) value: (_) @runtime_value)) (try_statement (statement_block (statement_list
        (pipeline (pipeline_chain (logical_expression (bitwise_expression (comparison_expression (additive_expression (multiplicative_expression (format_expression (range_expression (array_literal_expression (unary_expression (invokation_expression (type_literal) @filetype (member_name) @writer (argument_list (argument_expression_list . (argument_expression (logical_argument_expression (bitwise_argument_expression (comparison_argument_expression (additive_argument_expression (multiplicative_argument_expression (format_argument_expression (range_argument_expression (unary_expression (variable) @written)))))))))))))))))))))))
        (pipeline (pipeline_chain (command
          command_name: (command_name) @launch
          command_elements: (command_elements
          (command_parameter) @fileparam
          . (command_argument_sep)
          . (array_literal_expression . (unary_expression (variable) @launched))
            (command_parameter) @arglist
            . (command_argument_sep)
            . (array_literal_expression . (unary_expression (variable) @passed))))))) @staging)))
        (#match? @filetype "(?i)^\\[System\\.IO\\.File\\]$")
        (#match? @writer "(?i)^WriteAllText$")
        (#match? @launch "(?i)^Start-Process$")
        (#match? @arglist "(?i)^-ArgumentList$")
        (#eq? @written @passed)
        (#match? @runtime_value "(?i)\\\\node\\.([\"']\\s*\\+\\s*[\"'])?exe")
        (#match? @fileparam "(?i)^-FilePath$")
        (#eq? @runtime @launched))
