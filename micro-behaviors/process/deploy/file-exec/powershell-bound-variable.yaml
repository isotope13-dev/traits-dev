defaults:
  platforms:
  - windows
  for:
  - powershell
  crit: notable
  conf: 0.98
traits:
- id: powershell-same-variable-outfile-launch
  desc: Downloads and launches the same path variable
  if:
    type: tree-sitter
    query: |-
      (statement_list
        (pipeline (pipeline_chain . (command
          command_name: (command_name) @download
          command_elements: (command_elements
            (command_parameter) @outfile . (command_argument_sep)
            . (array_literal_expression (unary_expression (variable) @written))))))
        . (pipeline (pipeline_chain . (command
          command_name: (command_name) @launch
          command_elements: (command_elements
            . (command_argument_sep) . (command_parameter) @filepath
            . (command_argument_sep)
            . (array_literal_expression (unary_expression (variable) @executed))))))
        (#match? @download "(?i)^(Invoke-WebRequest|iwr)$")
        (#match? @outfile "(?i)^-OutFile$")
        (#match? @launch "(?i)^Start-Process$")
        (#match? @filepath "(?i)^-FilePath$")
        (#eq? @written @executed))

- id: powershell-same-variable-hidden-launch
  desc: Downloads and hides the same path
  if:
    type: tree-sitter
    query: |-
      (statement_list
        (pipeline (pipeline_chain . (command
          command_name: (command_name) @download
          command_elements: (command_elements
            (command_parameter) @outfile . (command_argument_sep)
            . (array_literal_expression (unary_expression (variable) @written))))))
        . (pipeline (pipeline_chain . (command
          command_name: (command_name) @launch
          command_elements: (command_elements
            . (command_argument_sep) . (command_parameter) @filepath
            . (command_argument_sep)
            . (array_literal_expression (unary_expression (variable) @executed)))) @launch_command))
        (#match? @download "(?i)^(Invoke-WebRequest|iwr)$")
        (#match? @outfile "(?i)^-OutFile$")
        (#match? @launch "(?i)^Start-Process$")
        (#match? @filepath "(?i)^-FilePath$")
        (#eq? @written @executed)
        (#match? @launch_command "(?i)-WindowStyle[ \t]+Hidden\\b"))
