# Bind the output operand, permission operand and command name. Adjacency
# excludes reassignments, opposite branches and unrelated chmod/launch calls.
# An environment assignment on the final command is allowed by Bash's AST.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: shell-curl-chmod-same-variable-exec
    desc: Curl output chmodded then executed by variable
    if:
      type: tree-sitter
      query: |
        ((program
          (command name: (command_name (word) @fetch)
            argument: (word) @out . argument: (string (simple_expansion (variable_name) @dest))
            . argument: (string (string_content) @url) .)
          . (command name: (command_name (word) @chmod)
            . argument: (word) @mode . argument: (string (simple_expansion (variable_name) @permitted)) .)
          . (command name: (command_name (string (simple_expansion (variable_name) @run))))) @chain
          (#eq? @fetch "curl") (#match? @out "^(-o|--output)$") (#match? @url "^https?://")
          (#eq? @chmod "chmod") (#eq? @mode "+x") (#eq? @dest @permitted) (#eq? @dest @run))
