# Bind the output operand, permission operand and command name. Adjacency
# excludes reassignments, opposite branches and unrelated chmod/launch calls.
# An environment assignment on the final command is allowed by Bash's AST.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: shell-curl-variable-file-invocation
    desc: Curl output launched via same variable
    if:
      type: tree-sitter
      language: shell
      query: |
        ((program
          (command name: (command_name (word) @client) !redirect
            . argument: (word)* @flags
            . argument: [(word) (raw_string) (string . (string_content) .)] @url
            . argument: (word) @output
            . argument: (string . (simple_expansion (variable_name) @dest) .) .)
          . (command name: (command_name (word) @interpreter)
            . argument: (string . (simple_expansion (variable_name) @run) .) .))
          (#eq? @client "curl")
          (#match? @url "^['\"]?https?://")
          (#match? @output "^(-o|--output)$")
          (#match? @interpreter "^(/(usr/)?bin/)?(sh|bash|dash|zsh)$")
          (#eq? @dest @run))
        ((do_group
          (command name: (command_name (word) @client) !redirect
            . argument: (word)* @flags
            . argument: [(word) (raw_string) (string . (string_content) .)] @url
            . argument: (word) @output
            . argument: (string . (simple_expansion (variable_name) @dest) .) .)
          . (command name: (command_name (word) @interpreter)
            . argument: (string . (simple_expansion (variable_name) @run) .) .))
          (#eq? @client "curl")
          (#match? @url "^['\"]?https?://")
          (#match? @output "^(-o|--output)$")
          (#match? @interpreter "^(/(usr/)?bin/)?(sh|bash|dash|zsh)$")
          (#eq? @dest @run))
        ((compound_statement
          (command name: (command_name (word) @client) !redirect
            . argument: (word)* @flags
            . argument: [(word) (raw_string) (string . (string_content) .)] @url
            . argument: (word) @output
            . argument: (string . (simple_expansion (variable_name) @dest) .) .)
          . (command name: (command_name (word) @interpreter)
            . argument: (string . (simple_expansion (variable_name) @run) .) .))
          (#eq? @client "curl")
          (#match? @url "^['\"]?https?://")
          (#match? @output "^(-o|--output)$")
          (#match? @interpreter "^(/(usr/)?bin/)?(sh|bash|dash|zsh)$")
          (#eq? @dest @run))

  - id: shell-curl-chmod-same-variable-exec
    desc: Curl output chmodded then executed by variable
    if:
      type: tree-sitter
      query: |
        ((program
          (command name: (command_name (word) @fetch)
            argument: (word) @out . argument: (string (simple_expansion (variable_name) @dest))
            . argument: (string (string_content) @url) .)
          . (command name: (command_name (word) @chmod)
            . argument: (word) @mode . argument: (string (simple_expansion (variable_name) @permitted)) .)
          . (command name: (command_name (string (simple_expansion (variable_name) @run))))) @chain
          (#eq? @fetch "curl") (#match? @out "^(-o|--output)$") (#match? @url "^https?://")
          (#eq? @chmod "chmod") (#eq? @mode "+x") (#eq? @dest @permitted) (#eq? @dest @run))
