defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: node-buffered-response-runtime-launch
  desc: HTTP response saved and launched by Node
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: (member_expression object: (identifier) @http property: (property_identifier) @get)
        arguments: (arguments (_) (_)?
          (arrow_function parameters: (formal_parameters (identifier) @response)
            body: (statement_block
              (expression_statement (call_expression
                function: (member_expression object: (identifier) @data_response property: (property_identifier) @on_data)
                arguments: (arguments (string (string_fragment) @data_event)
                  (arrow_function parameters: (formal_parameters (identifier) @chunk)
                    body: (statement_block (expression_statement (augmented_assignment_expression
                      left: (identifier) @body1 operator: "+=" right: (identifier) @copied_chunk)))))))
              (expression_statement (call_expression
                function: (member_expression object: (identifier) @end_response property: (property_identifier) @on_end)
                arguments: (arguments (string (string_fragment) @end_event)
                  (arrow_function body: (statement_block
                    (expression_statement (call_expression function: (_) @writer
                      arguments: (arguments (identifier) @saved (identifier) @body2)))
                    (lexical_declaration (variable_declarator value: (call_expression
                      function: (identifier) @spawn
                      arguments: (arguments
                        (member_expression object: (identifier) @process property: (property_identifier) @execpath)
                        (array (identifier) @launched)))))))))))))) @handoff
        (#match? @http "^https?$") (#eq? @get "get")
        (#eq? @response @data_response) (#eq? @response @end_response)
        (#eq? @on_data "on") (#eq? @on_end "on")
        (#eq? @data_event "data") (#eq? @end_event "end")
        (#eq? @chunk @copied_chunk) (#eq? @body1 @body2)
        (#match? @writer "(^|\\.)writeFileSync$")
        (#eq? @spawn "spawn") (#eq? @process "process") (#eq? @execpath "execPath")
        (#eq? @saved @launched))
