# Bind the download destination to the launched path. Independent occurrences
# of an output option and Start-Process do not establish a payload chain.
# Accept curl -o with ordinary or Python-escaped backslashes.
defaults:
  platforms: [windows]
  for: [python]
traits:
  - id: python-curl-download-launch-same-temp-exe
    desc: curl downloads and starts same TEMP executable
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule python_curl_download_launch_same_temp_exe {
          strings:
            $chain = /\bcurl(\.exe)?[ \t]+[^;\r\n\x00]{1,256}-o[ \t]+["']?\$env:(TEMP|TMP)\\{1,2}[a-z0-9_.-]{1,80}\.exe["']?[ \t]*;[ \t\r\n]*Start-Process[ \t]+(-FilePath[ \t]+)?["']?\$env:(TEMP|TMP)\\{1,2}[a-z0-9_.-]{1,80}\.exe(["'; \t\r\n]|$)/ nocase
            $path = /\$env:(TEMP|TMP)\\{1,2}[a-z0-9_.-]{1,80}\.exe/ nocase
          condition:
            for any c in (1..#chain) : (
              for any p in (1..#path) : (
                @path[p] >= @chain[c] and
                @path[p] + !path[p] < @chain[c] + !chain[c] and
                for any q in (1..#path) : (
                  @path[q] > @path[p] + !path[p] and
                  @path[q] + !path[q] >= @chain[c] + !chain[c] - 1 and
                  @path[q] + !path[q] <= @chain[c] + !chain[c] and
                  !path[p] == !path[q] and
                  for all k in (0..!path[p]-1) : (
                    (uint8(@path[p]+k) | 32) == (uint8(@path[q]+k) | 32)
                  )
                )
              )
            )
        }
