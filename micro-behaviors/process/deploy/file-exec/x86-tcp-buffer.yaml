defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-tcp-buffer-write-process-launch
    desc: Native TCP buffer is written and launched
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        import "pe"
        rule x86_tcp_buffer_write_process_launch {
          strings:
            // Receive into EDI + received-byte count, accumulating EAX.
            $receive = {
              8B 85 [4] 01 F8 89 44 24 04 FF 15 [4]
              83 EC 10 85 C0 7E ?? 01 85 [4] 8B 85
            }
            // Open EBX's path for writing; retain returned handle in ESI.
            $open = {
              C7 44 24 04 00 00 00 40 89 1C 24 FF 15 [4]
              83 EC 1C 89 C6
            }
            // Write EDI buffer to ESI handle, then close that handle.
            $write = {
              89 34 24 89 44 24 0C 8B 85 [4]
              C7 44 24 10 00 00 00 00 89 44 24 08 89 7C 24 04
              FF 15 [4] 83 EC 14 89 34 24 8B 35 [4] FF D6
            }
            // CreateProcessW application path is the same EBX buffer.
            $launch = {
              89 1C 24 89 44 24 24 8D 85 [4]
              C7 85 [4] 44 00 00 00 89 44 24 20
              C7 44 24 1C 00 00 00 00 C7 44 24 18 00 00 00 00
              C7 44 24 14 00 00 00 00 C7 44 24 10 00 00 00 00
              C7 44 24 0C 00 00 00 00 C7 44 24 08 00 00 00 00
              C7 44 24 04 00 00 00 00 FF 15 [4] 83 EC 28 85 C0
            }
          condition:
            pe.machine == pe.MACHINE_I386 and
            pe.imports("WS2_32.dll", "recv") and
            pe.imports("KERNEL32.dll", "CreateFileW") and
            pe.imports("KERNEL32.dll", "WriteFile") and
            pe.imports("KERNEL32.dll", "CreateProcessW") and
            for any s in pe.sections : (
              s.name == ".text" and
              for any r in (1..#receive) : (
                @receive[r] >= s.raw_data_offset and
                for any o in (1..#open) : (
                  @receive[r] < @open[o] and
                  for any w in (1..#write) : (
                    @open[o] < @write[w] and
                    for any l in (1..#launch) : (
                      @write[w] < @launch[l] and
                      @launch[l] - @receive[r] < 2048 and
                      @launch[l] + !launch[l] <= s.raw_data_offset + s.raw_data_size
                    )
                  )
                )
              )
            )
        }
