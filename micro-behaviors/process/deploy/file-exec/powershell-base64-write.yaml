defaults:
  platforms: [windows]
  for: [powershell]
composite_rules:
  - id: powershell-base64-write-launch-cooccurrence
    desc: Base64 decoding, byte writes and launch co-occur
    crit: notable
    conf: 0.95
    # Keep the three stages in one compact chain. Without proximity, an
    # installer that decodes a signing certificate and much later launches an
    # unrelated MSI is mislabeled as executing the decoded certificate.
    near_lines: 20
    all:
      - id: metadata/lang/source/naming/resource::dotnet-frombase64string-text
      - id: micro-behaviors/fs/write/file/full::write-all-bytes
      - id: micro-behaviors/process/create/exec::start-process-call
    any:
      - id: micro-behaviors/fs/path/temp::get-temp-path
      - id: micro-behaviors/fs/path/temp::env-temp
    unless:
