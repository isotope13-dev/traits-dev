# Bind the HTTP source, saved file, helper return and child-process argument.
# User-defined names and payload filenames are deliberately unconstrained.
defaults:
  platforms: [windows]
  for: [python]
traits:
  - id: python-streamed-download-hidden-shell
    desc: Streamed HTTP file reaches a hidden shell
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (function_definition
            name: (identifier) @download
            parameters: (parameters . (identifier) @url (_)* )
            body: (block
              (with_statement
                (with_clause (with_item value: (as_pattern
                  (call function: (attribute object: (identifier) @http
                    attribute: (identifier) @get)
                    arguments: (argument_list . (identifier) @requested (_)*))
                  alias: (as_pattern_target (identifier) @response))))
                body: (block
                  (with_statement
                    (with_clause (with_item value: (as_pattern
                      (call function: (identifier) @open
                        arguments: (argument_list . (identifier) @saved (string) @mode .))
                      alias: (as_pattern_target (identifier) @file))))
                    body: (block
                      (for_statement left: (identifier) @chunk
                        right: (call function: (attribute object: (identifier) @stream
                          attribute: (identifier) @iter))
                        body: (block (expression_statement
                          (call function: (attribute object: (identifier) @output
                            attribute: (identifier) @write)
                            arguments: (argument_list . (identifier) @written .)))))))))
              (return_statement (identifier) @returned)))
          (function_definition
            name: (identifier) @runner
            parameters: (parameters . (identifier) @path .)
            body: (block (try_statement body: (block
              (expression_statement (call function: (attribute
                object: (identifier) @subprocess attribute: (identifier) @popen)
                arguments: (argument_list . (identifier) @executed
                  (keyword_argument name: (identifier) @flags
                    value: (attribute object: (identifier) @flag_module
                      attribute: (identifier) @no_window))
                  (keyword_argument name: (identifier) @shell value: (true)))))))))
          (function_definition body: (block
            (if_statement consequence: (block
              (expression_statement (assignment left: (identifier) @stage
                right: (call function: (identifier) @fetch_call)))
              . (expression_statement (call function: (identifier) @run_call
                arguments: (argument_list . (identifier) @activated .)))))))) @chain
          (#eq? @http "requests") (#eq? @get "get")
          (#eq? @url @requested) (#eq? @response @stream)
          (#eq? @open "open") (#match? @mode "^[\"']wb[\"']$")
          (#eq? @iter "iter_content") (#eq? @file @output)
          (#eq? @write "write") (#eq? @chunk @written)
          (#eq? @saved @returned) (#eq? @subprocess "subprocess")
          (#eq? @flags "creationflags") (#eq? @flag_module "subprocess")
          (#eq? @no_window "CREATE_NO_WINDOW") (#eq? @shell "shell")
          (#eq? @popen "Popen") (#eq? @path @executed)
          (#eq? @download @fetch_call) (#eq? @runner @run_call)
          (#eq? @stage @activated))
