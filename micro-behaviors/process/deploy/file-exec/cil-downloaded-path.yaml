# The same local is DownloadFile's destination and the following Start argument.
# API names and CIL shape corroborate a probable chain; no runtime claim.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: cil-download-start-same-local-profile
    desc: CIL download and launch share path
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        import "pe"
        rule cil_download_start_same_local_profile {
          strings:
            $clr = "BSJB"
            $client = "WebClient" fullword
            $download = "DownloadFile" fullword
            $process = "Process\x00"
            $start = "Start\x00"
            $chain = { 08 06 18 9A 07 6F ?? ?? ?? 0A
                       07 28 ?? ?? ?? 0A 26 }
          condition:
            all of them and
            for any s in pe.sections : (
              s.name == ".text" and
              $chain in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
            )
        }
