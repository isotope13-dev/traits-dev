defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: vb-executable-download-minimized-launch-profile
  desc: VB download with minimized-launch references
  crit: notable
  conf: 0.98
  if:
    type: yara
    source: |
      import "pe"
      rule vb_executable_download_minimized_launch_profile {
        strings:
          $code = { 18 16 15 28 ?? ?? ?? 0A 26 }
          $download = "DownloadFile" ascii fullword
          $interaction = "Interaction" ascii fullword
          $shell = "Shell" ascii fullword
          $url = /http:\/\/[^\x00\s\x22]{1,150}\.exe/ wide ascii nocase
        condition:
          all of them and
          for any s in pe.sections : (
            s.name == ".text" and
            $code in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
          )
      }
