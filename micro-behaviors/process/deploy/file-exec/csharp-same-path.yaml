# Adjacent calls save and launch the same identifier-shaped path. This is
# neutral deployment; neither the supplied bytes nor the path proves abuse.
defaults:
  for: [csharp]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: csharp-writeallbytes-start-same-path
    desc: Writes bytes and starts the same path
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((block
          (expression_statement (invocation_expression
            function: (member_access_expression) @save
            arguments: (argument_list . (argument (identifier) @saved) . (argument (_) @bytes) .)))
          . (expression_statement (invocation_expression
            function: (member_access_expression) @start
            arguments: (argument_list . (argument (identifier) @executed) .)))) @chain
          (#match? @save "^(System\\.IO\\.)?File\\.WriteAllBytes$")
          (#match? @start "^(System\\.Diagnostics\\.)?Process\\.Start$")
          (#eq? @saved @executed))
