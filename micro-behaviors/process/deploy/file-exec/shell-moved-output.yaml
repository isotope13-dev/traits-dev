defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: variable-output-move-clear-mode-launch-chain
    desc: Variable output moves through -c, +x, launch
    crit: notable
    conf: 0.97
    size_max: 50000
    # Bind the download output through mv to the attribute/mode operands and
    # final command. A compound telemetry block may precede activation. The
    # command names remain variables; callers supply the curl/xattr/chmod facts.
    if:
      type: tree-sitter
      query: |
        ((list
          (list
            (list
              (list
                (list
                  (command name: (command_name (expansion (variable_name)))
                    argument: (word) argument: (word) @output
                    argument: (expansion (variable_name) @download)
                    argument: (expansion (variable_name)))
                  "&&" (command name: (command_name (word) @mv)
                    argument: (expansion (variable_name) @mvsource)
                    argument: (expansion (variable_name) @mvdest)))
                "&&" (command name: (command_name (expansion (variable_name)))
                  argument: (word) @clear
                  argument: (expansion (variable_name) @cleared)))
              "&&" (command name: (command_name (expansion (variable_name)))
                argument: (word) @mode
                argument: (expansion (variable_name) @executable)))
            "&&" (compound_statement))
          "&&" (command name: (command_name (expansion (variable_name) @launched)))) @chain
          (#eq? @output "-o") (#eq? @mv "mv") (#eq? @mvsource @download)
          (#eq? @clear "-c") (#eq? @mode "+x")
          (#eq? @mvdest @cleared) (#eq? @mvdest @executable)
          (#eq? @mvdest @launched))
