# The response, written path, moved path, formatted command and launch argument
# are linked by identifiers. Unrelated downloads and child processes do not pass.
defaults:
  platforms: [windows]
  for: [python]
traits:
  - id: python-response-move-win32-launch
    desc: Moves and launches staged response file
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((block
          (expression_statement (assignment left: (identifier) @response
            right: (call)))
          (expression_statement (call
            function: (attribute object: (identifier) @written
              attribute: (identifier) @write)
            arguments: (argument_list . (attribute object: (identifier) @body
              attribute: (identifier) @bodyfield) .)))
          (if_statement consequence: (block
            (expression_statement (call function: (attribute) @move
              arguments: (argument_list .
                (call function: (identifier) @str1
                  arguments: (argument_list . (identifier) @origin .))
                (call function: (identifier) @str2
                  arguments: (argument_list . (identifier) @target .)) .)))
            . (expression_statement (assignment left: (identifier) @command
              right: (string (interpolation expression: (identifier) @formatted))))
            (expression_statement (call function: (attribute) @launch
              arguments: (argument_list . (none) (identifier) @executed)))))) @deployment
          (#eq? @response @body) (#eq? @bodyfield "body")
          (#eq? @write "write_bytes") (#eq? @written @origin)
          (#eq? @move "shutil.move") (#eq? @str1 "str") (#eq? @str2 "str")
          (#eq? @target @formatted) (#eq? @command @executed)
          (#eq? @launch "ctypes.windll.kernel32.CreateProcessW"))
