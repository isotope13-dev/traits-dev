defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable

traits:
  # Compare complete TEMP batch paths (Windows ASCII case-insensitive), not an output
  # option or an unrelated Start-Process as evidence of linked activation.
  # Both ASCII and native UTF-16LE command text are supported.
  - id: lnk-bits-temp-batch-launch
    desc: BITS downloads then starts identical TEMP batch
    conf: 0.99
    size_max: 65536
    if:
      type: yara
      source: |
        rule lnk_bits_temp_batch_launch {
          strings:
            $bits = /Start-BitsTransfer[ \t]+-Source[ \t]+['"]https?:\/\/[^'"\r\n]{1,240}['"][ \t]+-Destination[ \t]+/ ascii wide nocase
            $run = /;[ \t]*Start-Process[ \t]+/ ascii wide nocase
            $path = /\$env:TEMP\\[a-zA-Z0-9_.-]{1,80}\.bat/ ascii wide nocase
          condition:
            #bits > 0 and #run > 0 and #path >= 2 and #path <= 32 and
            for any p in (1..#path) : (
              for any d in (1..#bits) : (@path[p] == @bits[d] + !bits[d]) and
              for any q in (1..#path) : (
                @path[q] > @path[p] and @path[q] - @path[p] < 1024 and
                !path[p] == !path[q] and
                for any e in (1..#run) : (
                  @run[e] == @path[p] + !path[p] and
                  @path[q] == @run[e] + !run[e]
                ) and
                for any t in (0, 9, 32, 34, 39, 59) : (
                  uint8(@path[q]+!path[q]) == t
                ) and
                for all k in (0..!path[p]-1) : (
                  (uint8(@path[p]+k) | 32) == (uint8(@path[q]+k) | 32)
                )
              )
            )
        }
