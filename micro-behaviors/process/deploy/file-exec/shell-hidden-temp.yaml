# Requires both commands in one && list and the exact same staging path.
# Suspicious: an installer can intentionally download and run a shell script.
# The destination is a hidden temporary file, independent of a host or basename.
defaults:
  platforms: [unix]
  for: [shell]
  crit: suspicious
  conf: 0.97
  attack: T1105,T1059.004

traits:
  - id: shell-hidden-temp-download-execute
    desc: Downloads and runs a hidden temporary script
    if:
      type: tree-sitter
      language: shell
      query: |
        ((list .
          [
            (command name: (command_name (word) @curl) !redirect
              . argument: (word)* @flags
              . argument: (word) @output
              . argument: [(word) (raw_string) (string . (string_content) .)] @download
              . argument: [(word) (raw_string) (string . (string_content) .)] @url .)
            (command name: (command_name (word) @curl) !redirect
              . argument: (word)* @flags
              . argument: [(word) (raw_string) (string . (string_content) .)] @url
              . argument: (word) @output
              . argument: [(word) (raw_string) (string . (string_content) .)] @download .)
          ]
          "&&" . (command name: (command_name (word) @shell) !redirect
            . argument: [(word) (raw_string) (string . (string_content) .)] @executed .) .) @chain
          (#eq? @curl "curl")
          (#match? @flags "^(-[fsSLk]+|--silent|--fail|--location)$")
          (#match? @output "^(-[fsSLk]*o|--output)$")
          (#match? @url "^['\"]?https?://")
          (#match? @download "^['\"]?/(tmp|var/tmp|dev/shm)/\\.[A-Za-z0-9_.-]+['\"]?$")
          (#eq? @download @executed)
          (#match? @shell "^(sh|bash|dash)$"))
