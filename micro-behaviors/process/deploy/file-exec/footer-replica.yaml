# Self-image read followed by footer-controlled copying,
# rewriting the descendant's recursion counters, and launching the SAME output
# path. This is the linked replication routine, not an API co-occurrence rule.
# Relocations/call displacements and generated names are deliberately unpinned.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

traits:
  - id: native-footer-replica-loop-layout
    desc: Footer rewrite and replica-launch loop
    crit: suspicious
    conf: 0.98
    if:
      type: yara
      source: |
        import "pe"
        rule footer_self_replica_launch {
          strings:
            // Resolve this image's pathname, open it, size it, allocate a
            // buffer and read the entire image before consuming its footer.
            $read = {
              41 B8 E7 03 00 00 48 8D 94 24 [4] 33 C9 FF 15 [4]
              41 B8 F4 01 00 00 48 8D 94 24 [4] 48 8D 4C 24 30 E8 [4]
              48 8D 15 [4] 48 8D 4C 24 30 E8 [4]
              33 D2 48 8B C8 48 8B F8 44 8D 42 02 E8 [4]
              48 8B CF E8 [4] 45 33 C0 4C 63 F8 33 D2 48 8B CF E8 [4]
              49 8B CF E8 [4] 4C 8B CF 4D 8B C7 BA 01 00 00 00
              48 8B C8 4C 8B F0 E8 [4] 48 8B CF E8 [4] 43 8B 4C 37 F8
            }
            // Last two dwords of the image buffer become depth and fan-out.
            $footer = {
              43 8B 4C 37 F8 33 ED 43 8B 54 37 FC FF C9
              89 54 24 20 89 4C 24 24 85 D2 0F 8E [4]
              48 89 B4 24 [4] BE ?? ?? ?? ?? 85 C9 0F 88 [4] BA 08 00 00 00
            }
            // Write the image minus its tail, append generated padding,
            // write depth/fan-out, close, launch rdi, and repeat.
            $copy = {
              41 8D 8F 00 FF FF FF 4C 8B C8 4C 63 C1
              BA 01 00 00 00 49 83 E8 08 49 8B CE 48 8B D8 E8 [4]
              48 63 D6 48 8D 0D [4] E8 [4] 48 8B C8 48 8B D3 E8 [4]
              BA 04 00 00 00 48 8D 4C 24 24 4C 8B CB 44 8D 42 FD E8 [4]
              BA 04 00 00 00 48 8D 4C 24 20 4C 8B CB 44 8D 42 FD E8 [4]
              48 8B CB E8 [4] 48 8B CF E8 [4]
              FF C5 81 C6 ?? ?? ?? ?? 3B 6C 24 20 7D ?? 8B 4C 24 24 E9 [4]
              48 8B B4 24
            }
            // Command-line conversion and Win32 process-creation helper.
            $spawn = {
              B8 ?? ?? ?? ?? E8 [4] 48 2B E0 48 8B 05 [4] 48 33 C4
              48 89 84 24 [4] 0F 57 C0 C7 44 24 70 68 00 00 00
              [78-90] 48 8B D1 49 FF C0 48 8D 8C 24 [4] E8 [4]
              48 8D 44 24 50 45 33 C9 48 89 44 24 48
              48 8D 94 24 [4] 48 8D 44 24 70 45 33 C0
              48 89 44 24 40 33 C9 33 C0 48 89 44 24 38
              48 89 44 24 30 89 44 24 28 89 44 24 20 FF 15 [4] 48 8B 8C 24
            }
            // Another compiler layout opens argv[0] and inlines the launch.
            // Retain the complete read -> tail counters -> rewritten copy ->
            // same-path CreateProcess flow, rather than generic API overlap.
            $inline_read = {
              48 8D 15 [4] 49 8B 0C 24 E8 [4] 48 8B F8
              41 BD 02 00 00 00 45 8B C5 33 D2 48 8B C8 E8 [4]
              48 8B CF E8 [4] 48 63 D8 89 5C 24 50
              45 33 C0 33 D2 48 8B CF E8 [4] 48 8B CB E8 [4]
              48 8B F0 48 89 44 24 78 4C 8B CF 4C 8B C3
              49 8B D6 48 8B C8 E8 [4] 48 8B CF E8 [4]
              8B 4C 33 F8
            }
            $inline_footer = {
              8B 4C 33 F8 8B 54 33 FC 89 54 24 70 FF C9
              89 4C 24 74 33 DB 8B F3 85 D2 0F 8E [4]
              41 BF ?? ?? ?? ?? 4C 8B 6C 24 78 44 8B 64 24 50
              85 C9 0F 88 [4] BA 08 00 00 00
              48 8D 0D [4] E8 [4] 48 8B F8
              48 8D 15 [4] 48 8B C8 E8 [4] 48 8B D8
            }
            $inline_copy = {
              41 8D 8C 24 00 FF FF FF 4C 63 C1 49 83 E8 08
              4C 8B C8 49 8B D6 49 8B CD E8 [4]
              49 63 D7 48 8D 0D [4] E8 [4] 48 8B C8 48 8B D3 E8 [4]
              4C 8B CB 4D 8B C6 BA 04 00 00 00 48 8D 4C 24 74 E8 [4]
              4C 8B CB 4D 8B C6 BA 04 00 00 00 48 8D 4C 24 70 E8 [4]
              48 8B CB E8 [4] 0F 57 C0
            }
            $inline_spawn = {
              49 FF C0 42 38 04 07 75 F7 49 FF C0 48 8B D7
              48 8D 8D [4] E8 [4] 48 8D 45 D0 48 89 44 24 48
              48 8D 45 10 48 89 44 24 40 33 DB
              48 89 5C 24 38 48 89 5C 24 30 89 5C 24 28 89 5C 24 20
              45 33 C9 45 33 C0 48 8D 95 [4] 33 C9 FF 15 [4]
              FF C6 41 81 C7 ?? ?? ?? ?? 3B 74 24 70 7D ??
              8B 4C 24 74 E9
            }
            // UCRT-import layout: argv[0] is read into R14, R13 retains
            // the image size, and the footer counters are rewritten through
            // three fwrite imports before the SAME RDI path is launched.
            $crt_read = {
              48 8D 15 ?? ?? ?? ?? 48 8B 0E FF 15 ?? ?? ?? ?? 48 8B F8 33
              D2 44 8D 42 02 48 8B C8 FF 15 ?? ?? ?? ?? 48 8B CF FF 15 ??
              ?? ?? ?? 4C 63 E8 45 33 C0 33 D2 48 8B CF FF 15 ?? ?? ?? ??
              49 8B CD FF 15 ?? ?? ?? ?? 4C 8B F0 4C 8B CF 4D 8B C5 49 8B
              D4 48 8B C8 FF 15 ?? ?? ?? ?? 48 8B CF FF 15 ?? ?? ?? ?? 43
              8B 4C 35 F8
            }
            $crt_footer = {
              43 8B 4C 35 F8 43 8B 54 35 FC 89 54 24 54 FF C9 89 4C 24 58
              33 DB 89 5C 24 50 85 D2 0F 8E ?? ?? ?? ?? 41 BC ?? ?? ?? ??
              85 C9 0F 88 ?? ?? ?? ?? BA 08 00 00 00 48 8D 0D ?? ?? ?? ??
              E8 ?? ?? ?? ?? 48 8B F8 48 8D 15 ?? ?? ?? ?? 48 8B C8 FF 15
              ?? ?? ?? ?? 48 8B D8
            }
            $crt_copy = {
              41 8D 8D 00 FF FF FF 4C 63 C1 49 83 E8 08 4C 8B C8 BA 01 00
              00 00 49 8B CE FF 15 ?? ?? ?? ?? 49 63 D4 48 8D 0D ?? ?? ??
              ?? E8 ?? ?? ?? ?? 48 8B C8 48 8B D3 FF 15 ?? ?? ?? ?? 4C 8B
              CB BA 04 00 00 00 44 8D 42 FD 48 8D 4C 24 58 FF 15 ?? ?? ??
              ?? 4C 8B CB BA 04 00 00 00 44 8D 42 FD 48 8D 4C 24 54 FF 15
              ?? ?? ?? ?? 48 8B CB FF 15 ?? ?? ?? ??
            }
            $crt_spawn = {
              48 8B CF E8 ?? ?? ?? ?? 4C 8D 40 01 48 8B D7 48 8D 4D 40 FF
              15 ?? ?? ?? ?? 48 8D 45 90 48 89 44 24 48 48 8D 45 D0 48 89
              44 24 40 33 DB 48 89 5C 24 38 48 89 5C 24 30 89 5C 24 28 89
              5C 24 20 45 33 C9 45 33 C0 48 8D 55 40 33 C9 FF 15 ?? ?? ??
              ?? 8B 44 24 50 FF C0 89 44 24 50 41 81 C4 ?? ?? ?? ?? 3B 44
              24 54 7D ?? 8B 4C 24 58 E9 ?? ?? ?? ??
            }
          condition:
            pe.machine == pe.MACHINE_AMD64 and
            pe.imports("kernel32.dll", "CreateProcessW") and
            (
            (pe.imports("kernel32.dll", "GetModuleFileNameW") and
            for any s in pe.sections : (
              s.name == ".text" and
              $read in (s.raw_data_offset..s.raw_data_offset + s.raw_data_size) and
              $footer at (@read + !read - 5) and
              $copy in (@footer..@footer + 128) and
              // The replica-path call at copy+114 targets this helper.
              $spawn at (@copy + 119 + int32(@copy + 115))
            )) or
            for any s in pe.sections : (
              s.name == ".text" and
              $inline_read in (s.raw_data_offset..s.raw_data_offset + s.raw_data_size) and
              $inline_footer at (@inline_read + !inline_read - 4) and
              $inline_copy at (@inline_footer + !inline_footer) and
              $inline_spawn in (@inline_copy + !inline_copy..@inline_copy + !inline_copy + 96) and
              // All three fwrite calls use the same stream and target.
              @inline_copy + 29 + int32(@inline_copy + 25) ==
                @inline_copy + 76 + int32(@inline_copy + 72) and
              @inline_copy + 29 + int32(@inline_copy + 25) ==
                @inline_copy + 97 + int32(@inline_copy + 93) and
              // The indirect launch really targets the CreateProcessW IAT.
              int32(@inline_spawn + 82) + s.virtual_address + @inline_spawn + 86 - s.raw_data_offset ==
                pe.import_rva("kernel32.dll", "CreateProcessW") and
              // The backedge rechecks the decremented depth before copying.
              @inline_spawn + !inline_spawn + 4 + int32(@inline_spawn + !inline_spawn) ==
                @inline_footer + 46
            ) or
            for any s in pe.sections : (
              s.name == ".text" and
              $crt_read in (s.raw_data_offset..s.raw_data_offset + s.raw_data_size) and
              $crt_footer at (@crt_read + !crt_read - 5) and
              $crt_copy at (@crt_footer + !crt_footer) and
              $crt_spawn in (@crt_copy + !crt_copy..@crt_copy + !crt_copy + 64) and
              // Resolve the file read rather than trusting an indirect call.
              int32(@crt_read + 86) + s.virtual_address + @crt_read + 90 - s.raw_data_offset ==
                pe.import_rva("api-ms-win-crt-stdio-l1-1-0.dll", "fread") and
              // Original image, decremented depth and fan-out share fwrite.
              @crt_copy + 31 + int32(@crt_copy + 27) ==
                @crt_copy + 81 + int32(@crt_copy + 77) and
              @crt_copy + 31 + int32(@crt_copy + 27) ==
                @crt_copy + 104 + int32(@crt_copy + 100) and
              int32(@crt_copy + 27) + s.virtual_address + @crt_copy + 31 - s.raw_data_offset ==
                pe.import_rva("api-ms-win-crt-stdio-l1-1-0.dll", "fwrite") and
              int32(@crt_spawn + 77) + s.virtual_address + @crt_spawn + 81 - s.raw_data_offset ==
                pe.import_rva("kernel32.dll", "CreateProcessW") and
              // The converted RDI pathname is the output file's pathname.
              // The loop returns to the saved decremented-depth check.
              @crt_spawn + !crt_spawn + int32(@crt_spawn + !crt_spawn - 4) ==
                @crt_footer + 40
            ))
        }
