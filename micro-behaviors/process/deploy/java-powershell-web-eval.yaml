# Command evidence alone supplies a capability, not malicious intent.
defaults:
  platforms: [windows]
  for: [class, java]
composite_rules:
  - id: java-powershell-remote-eval-command
    desc: Java embeds a PowerShell web-evaluation command
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/application/executable::powershell-executable-token
    any:
      - id: micro-behaviors/process/deploy::embedded-irm-iex-pipeline
      - id: micro-behaviors/process/deploy::embedded-iex-irm-call
      - id: micro-behaviors/communications/http/download/cli::embedded-powershell-irm-iex-command
      - id: micro-behaviors/communications/http/download/cli::embedded-iwr-pipe-iex
