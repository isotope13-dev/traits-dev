# A linked, same-module extraction -> callback -> Python-script execution
# chain. The probe filename and all application helper/parameter names may
# change. This does not call --imports-only, is_file(), or a readiness receipt
# a sandbox, and it does not assert that a human approval is absent.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-extracted-archive-probe-execution
    desc: Extracted archive runs its staged Python probe
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (function_definition
            name: (identifier) @extractor
            parameters: (parameters . (identifier) @archive (identifier) @destination .)
            body: (block
              (with_statement
                (with_clause (with_item value: (as_pattern
                  (call function: (attribute
                    object: (identifier) @zip_module attribute: (identifier) @zip_type)
                    arguments: (argument_list (call
                      function: (attribute attribute: (identifier) @bytes_io)
                      arguments: (argument_list (identifier) @archive_bytes))))
                  alias: (as_pattern_target (identifier) @zip_handle))))
                body: (block
                  (expression_statement (call function: (attribute
                    object: (identifier) @opened_zip attribute: (identifier) @extractall)
                    arguments: (argument_list (identifier) @extracted_to)))))))
          (function_definition
            name: (identifier) @probe
            parameters: (parameters . (identifier) @probe_directory .)
            body: (block
              (expression_statement (assignment
                left: (identifier) @script
                right: (binary_operator
                  left: (call function: (identifier) @path_constructor
                    arguments: (argument_list (identifier) @script_directory))
                  operator: "/" right: (string))))
              . (if_statement)?
              . (expression_statement (assignment right: (call
                function: (attribute object: (identifier) @subprocess
                  attribute: (identifier) @launch)
                arguments: (argument_list (list
                  . (attribute object: (identifier) @sys attribute: (identifier) @executable)
                  . (call function: (identifier) @stringify
                    arguments: (argument_list (identifier) @launched_script)))))))))
          (function_definition
            parameters: (parameters
              . (identifier) @wrapper_archive
              (default_parameter name: (identifier) @wrapper_callback value: (identifier) @default_probe))
            body: (block (with_statement body: (block
              (return_statement (call function: (identifier) @stage_call
                arguments: (argument_list
                  . (identifier) @forwarded_archive
                  (_)* (identifier) @forwarded_callback .)))))))
          (function_definition
            name: (identifier) @stage_function
            parameters: (parameters
              . (identifier) @stage_archive
              (identifier) @stage_callback .)
            body: (block (try_statement body: (block
              (expression_statement (call function: (identifier) @extract_call
                arguments: (argument_list
                  . (identifier) @extraction_archive (identifier) @stage .)))
              (expression_statement (call function: (identifier) @probe_call
                arguments: (argument_list (call function: (identifier) @stage_stringify
                  arguments: (argument_list (identifier) @probed_stage))))))))))
         (#eq? @zip_module "zipfile") (#eq? @zip_type "ZipFile")
         (#eq? @bytes_io "BytesIO") (#eq? @archive @archive_bytes)
         (#eq? @zip_handle @opened_zip) (#eq? @extractall "extractall")
         (#eq? @destination @extracted_to)
         (#eq? @probe_directory @script_directory)
         (#eq? @path_constructor "Path") (#eq? @script @launched_script)
         (#eq? @subprocess "subprocess") (#match? @launch "^(run|Popen|call|check_call)$")
         (#eq? @sys "sys") (#eq? @executable "executable") (#eq? @stringify "str")
         (#eq? @probe @default_probe) (#eq? @wrapper_archive @forwarded_archive)
         (#eq? @wrapper_callback @forwarded_callback)
         (#eq? @stage_call @stage_function) (#eq? @extractor @extract_call)
         (#eq? @stage_archive @extraction_archive) (#eq? @stage_callback @probe_call)
         (#eq? @stage @probed_stage) (#eq? @stage_stringify "str"))
