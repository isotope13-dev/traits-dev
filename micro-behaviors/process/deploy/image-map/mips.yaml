defaults:
  platforms: [linux]
  for: [elf]
  arch: [mips]

traits:
  - id: mips-unpack-mprotect-handoff
    desc: MIPS executable mprotect and image handoff
    crit: notable
    conf: 0.99
    if:
      type: hex
      offset_range: [0, 1048576]
      # mprotect(mapped output, length, PROT_READ|PROT_EXEC), then load
      # the image entry relative to s4 and jump to it through ra.
      # Preserve the big-endian sequence and accept the same MIPSEL code.
      pattern: '(24 06 00 05 8F A5 00 0C 8F A4 00 08 24 02 10 1D 00 00 00 0C 22 9F 00 10 [8] 03 E0 00 08 | 05 00 06 24 0C 00 A5 8F 08 00 A4 8F 1D 10 02 24 0C 00 00 00 10 00 9F 22 [8] 08 00 E0 03)'
