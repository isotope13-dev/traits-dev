defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  # RWX reserve/commit setup, save the returned pointer, copy a buffer, then
  # reload that saved pointer and call it. Do not claim a remote source from
  # these instructions: the source can also be a local sidecar.
  - id: x86-rwx-copied-buffer-call
    desc: x86 RWX buffer copy and indirect execution
    crit: suspicious
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '6A 40 68 00 30 00 00 40 50 6A 00 89 7D F8 FF 15 ?? ?? ?? ?? 89 45 FC 85 C0 74 ?? 8B 0E 8B 57 10 51 52 50 E8 ?? ?? ?? ?? 83 C4 0C [0-40] 8B 5D FC 53 5E [0-16] FF D6'
