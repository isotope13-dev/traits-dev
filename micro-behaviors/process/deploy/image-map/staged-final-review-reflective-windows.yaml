defaults:
  conf: 0.98
  crit: suspicious
  for:
    - pe
    - dll
  platforms:
    - windows

composite_rules:
  - id: go-manualmap-dll-entry-trampoline
    desc: Go manual-map DLL entry trampoline
    for:
      - go
    all:
      - id: metadata/lang/source/naming/injection::go-shellcode-initializer-text
      - id: metadata/lang/source/literal/array::go-b9-a-placeholder-bytes
      - id: metadata/lang/source/literal/array::go-ba-one-byte-sequence
      - id: metadata/lang/source/literal/array::go-b8-a-placeholder-bytes
      - id: metadata/lang/source/syntax/assignment/value::go-handle-entrypoint-offsets
      - id: metadata/lang/source/literal/array::go-stack-align-byte-comment
  - id: tls-opaque-inline-pe-clues
    desc: TLS opaque PE and memory-protection clues
    all:
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
      - id: metadata/binary/section/entropy::high-entropy-rdata-section
      - id: micro-behaviors/fs/file/pe-inspect::inline-pe-signature-check
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: metadata/signature/absent::unsigned-missing-signature-record
    unless:
      - id: metadata/lang/compiler/native::mingw-pseudo-reloc-runtime
      - id: well-known/lib/media/ogg/
