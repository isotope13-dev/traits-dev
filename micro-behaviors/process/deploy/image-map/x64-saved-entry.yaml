defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-pe-saved-entry-mapped-call
    desc: Saved PE entry called from mapped base
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # SizeOfImage and AddressOfEntryPoint are read from the same header.
      # The saved entry is later loaded, added to mapped base RDI and called.
      # Stack displacements and mapping-call relocations are variable.
      pattern: '45 8B 64 1F 50 41 8B 44 1F 28 41 8B CC 89 45 ?? E8 [4] [0-512] 8B 45 ?? 85 C0 75 ?? [0-64] 48 03 C7 FF D0'
