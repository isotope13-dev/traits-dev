defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-pe-tls-directory-entry-call
    desc: PE TLS-directory check and entry-point call
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # R14 points at the NT header. Test its TLS directory RVA/size, then
      # add AddressOfEntryPoint to the mapped base in RSI and invoke it.
      # This is local activation; it establishes neither a remote source nor
      # malicious intent. TLS callback handling takes the other branch.
      pattern: '41 8B 96 D4 00 00 00 41 8B 86 D0 00 00 00 85 D2 74 ?? 85 C0 0F 85 ?? ?? ?? ?? 41 8B 46 28 48 01 F0 FF D0'
