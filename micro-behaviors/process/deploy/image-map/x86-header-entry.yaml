# A raw image can be entered at its first byte instead of through the OS
# loader. The call/pop obtains that image base, then e_lfanew and the NT
# header's AddressOfEntryPoint are followed before jumping to base + RVA.
# This proves a local entry handoff, not allocation, imports, or hostile intent.
defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

traits:
  - id: x86-header-relative-entry-jump
    desc: PE header trampoline jumps to image entry
    crit: notable
    conf: 0.99
    if:
      type: hex
      offset: 4
      pattern: 'E8 00 00 00 00 58 83 E8 09 8B C8 83 C0 3C 8B 00 03 C1 83 C0 28 03 08 FF E1'
