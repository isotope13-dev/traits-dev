defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
traits:
  - id: x64-private-section-image-entry-call
    desc: Private image section mapping and entry call
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule x64_private_image_section_entry_call {
          strings:
            $protect = { 48 6B C8 11 44 0F B6 44 19 30 8B 54 19 24 8B 4C 19 20 48 03 CE FF 15 ?? ?? ?? ?? }
            $entry = { 8B 43 0C 48 03 C6 74 ?? 48 8B CD FF D0 }
          condition:
            $protect and $entry and @entry > @protect and @entry - @protect < 128
        }
