defaults:
  platforms: [windows]
  for: [python]
  crit: notable
  conf: 0.95
traits:
  - id: pe-raw-section-copy-python
    desc: Copies raw PE sections to virtual addresses
    # Member reads appear in symbols, but field provenance is unresolved.
    # The query binds the section fields to this copy's actual operands.
    if:
      type: tree-sitter
      query: |
        ((call
          function: (attribute attribute: (identifier) @fn)
          arguments: (argument_list
            (binary_operator operator: "+"
              right: (attribute attribute: (identifier) @va))
            (binary_operator operator: "+"
              right: (attribute attribute: (identifier) @raw))
            (attribute attribute: (identifier) @size))) @evidence
          (#match? @fn "^(mem(cpy|move)|(Rtl)?CopyMemory)$")
          (#eq? @va "VirtualAddress")
          (#eq? @raw "PointerToRawData")
          (#eq? @size "SizeOfRawData"))
composite_rules:
  - id: mapped-pe-raw-section-copy-python
    desc: Copies raw PE sections into mapped view
    near_bytes: 1
    all:
      - id: pe-raw-section-copy-python
      - id: micro-behaviors/mem/copy::mapped-view-copy-destination
