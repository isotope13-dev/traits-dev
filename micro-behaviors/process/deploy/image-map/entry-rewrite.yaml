defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: native-entry-clear-dll-flag
    desc: PE entry cleared and DLL flag set
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule native_entry_clear_dll_flag {
          strings:
            $clear = { 8B 45 ?? C7 40 28 00 00 00 00 }
            $dll = { 0F B7 40 16 80 CC 20 89 C2 8B 45 ?? 66 89 50 16 }
          condition:
            $clear and $dll and @dll > @clear and @dll - @clear < 64
        }
