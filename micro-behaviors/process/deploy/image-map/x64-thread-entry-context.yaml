defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-thread-context-image-entry-call
    desc: Calls mapped entry from a thread context
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Thread context holds mapped base and AddressOfEntryPoint. Invoke
      # base+entry with DLL_PROCESS_ATTACH; no remote process is involved.
      pattern: '45 31 C0 BA 01 00 00 00 48 89 C8 48 8B 09 8B 40 08 48 01 C8 FF D0'
