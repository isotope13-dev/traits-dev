defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
  crit: notable
  conf: 0.98
traits:
  - id: x86-pe-headers-and-sections-copy
    desc: Copies PE headers and sections into memory
    if:
      type: hex
      section: any
      # SizeOfHeaders, NumberOfSections, SizeOfOptionalHeader, and each
      # section's RVA/raw size/raw offset establish a PE image mapping.
      # Stack locals and section-loop branch displacements are unconstrained.
      pattern: '89 C7 8B 46 3C 8B 4C 06 54 FC F3 A4 8B 45 ?? 8B 58 3C 01 C3 0F B7 4B 06 0F B7 53 14 8D 5C 13 18 51 8B 7D ?? 03 7B 0C 8B 4B 10 85 C9 74 ?? 8B 75 ?? 03 73 14 FC F3 A4 83 EB D8 59 E2 ??'
  - id: x86-pe-entry-dll-attach-call
    desc: Calls mapped DLL entry for process attach
    if:
      type: hex
      section: any
      pattern: '8B 45 ?? 8B 58 3C 01 C3 8B 5B 28 09 DB 74 ?? 01 C3 55 6A 00 6A 01 50 FF D3 5D'
composite_rules:
  - id: x86-pe-sections-to-dll-entry
    desc: PE section mapping beside DLL entry activation
    near_bytes: 512
    all:
      - id: x86-pe-headers-and-sections-copy
      - id: x86-pe-entry-dll-attach-call
