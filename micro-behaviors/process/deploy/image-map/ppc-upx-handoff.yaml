defaults:
  platforms: [linux]
  for: [elf]
  arch: [powerpc]

traits:
  - id: ppc-unpack-mprotect-handoff
    desc: PPC executable mprotect and image handoff
    crit: notable
    conf: 0.99
    if:
      type: hex
      offset_range: [0, 1048576]
      # mprotect(output, length, PROT_READ|PROT_EXEC), then branch through
      # CTR to the unpacked image. Register roles survive address changes.
      pattern: '38 A0 00 05 7E E4 BB 78 7F 03 C3 78 38 00 00 7D 44 00 00 02 [12] 38 16 00 10 7C 09 03 A6 4E 80 04 20'
