# googledrive.com/host/<folder-id> was Google Drive's public web hosting
# (retired 2016). Pages used it as free, anonymous JavaScript hosting; the
# script body lives in someone's Drive folder rather than with the site.
defaults:
  for: [html]
  platforms: [windows, unix]
  crit: notable
  conf: 0.9
traits:
  - id: googledrive-host-script-src
    desc: Loads script from Google Drive web hosting
    if:
      type: text
      exclude_html_comments: true
      regex: '<script\b[^>]{0,40}\bsrc=["'']https?://googledrive\.com/host/'
