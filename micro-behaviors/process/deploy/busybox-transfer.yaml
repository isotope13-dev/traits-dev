defaults:
  platforms: [unix, windows]
  for: [shell]

composite_rules:
  - id: busybox-transfer-chmod-exec-proximity
    desc: BusyBox transfer near chmod and local execution
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/local-exec::chmod-exec-literal-local
    any:
      - id: micro-behaviors/communications/http/download/busybox::wget
      - id: micro-behaviors/communications/tftp/download::tftp
      - id: micro-behaviors/communications/ftp/download/busybox::ftpget
      - id: micro-behaviors/communications/tftp/download::command
    near_bytes: 220
