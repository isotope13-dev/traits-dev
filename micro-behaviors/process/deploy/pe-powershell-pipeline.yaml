defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: pe-irm-iex-pipeline-text
  desc: PE contains PowerShell IRM-to-IEX pipeline text
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)\b(irm|Invoke-RestMethod)\b[^\r\n|]{0,160}\|\s*iex\b
    not:
    - substr: bun.sh/install.ps1
    - substr: bun.com/install.ps1
  unless:
  - id: well-known/lib/runtime/scripted/bun-runtime::runtime-context
  - id: well-known/lib/runtime/scripted/bun-runtime::bun-standalone-graph-trailer
  - id: well-known/lib/runtime/scripted/bun-runtime::unix-runtime-context

