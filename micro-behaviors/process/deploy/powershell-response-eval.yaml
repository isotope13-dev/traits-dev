defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1059.001,T1105
  mbc: B0030

traits:
- id: powershell-web-response-piped-eval-text
  desc: PowerShell web response piped to evaluator
  crit: notable
  conf: 0.97
  # Alias and full cmdlet names alike: droppers spell out
  # Invoke-RestMethod -Uri 'https://…' | Invoke-Expression.
  for: [vbs, powershell, batch]
  if:
    type: text
    regex: '(?i)\b(irm|iwr|Invoke-(RestMethod|WebRequest))[^\r\n|]{0,99}\|\s*(iex|Invoke-Expression)\b'
  not:
    - regex: '(?i)\b(?:irm|Invoke-RestMethod)\s+(?:-Uri\s+)?["'']?https://raw\.githubusercontent\.com/ScoopInstaller/Install/(?:master|main)/install\.ps1["'']?\s*\|\s*(?:iex|Invoke-Expression)\b'
    - regex: '(?i)astral\.sh/uv/'
    - regex: '(?i)downloads\.slack-edge\.com/slack-cli/'
  unless:
    - id: well-known/tool/sysadmin/chocolatey::official-profile-provisioner
    - id: well-known/tool/sysadmin/scoop::scoop-bootstrap-installer-context
    # Comment-based help documents the vendor one-liner; not executable code.
    - id: metadata/package/documentation/powershell-help::powershell-comment-help-piped-url-example
    - id: metadata/package/documentation/powershell-help::powershell-comment-help-irm-iex-example
    # Tirith release QA asserts its own blocks on iwr|iex strings.
    - id: well-known/tool/detection/tirith::tirith-defensive-scanner-context
    - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    - id: well-known/app/ai/coding-agent/skillshare::skillshare-windows-installer-context
    - id: well-known/app/ai/coding-agent/easyeda-agent::easyeda-agent-github-raw-install

- id: powershell-rest-response-piped-eval-line
  desc: PowerShell REST response piped to evaluator
  crit: notable
  conf: 0.97
  # Native binaries frequently embed vendor documentation or installer help
  # containing the canonical Bun `irm|iex` command.  This rule is for script
  # source, where the pipeline is executable code rather than inert PE text.
  for: [vbs, powershell, batch]
  if:
    type: text
    # Do not treat a commented install example as executable code.
    # The eval side accepts the full Invoke-Expression cmdlet name as well
    # as the iex alias: droppers spell it out
    # (Invoke-RestMethod -Uri 'https://...' | Invoke-Expression).
    regex: '(?im)^[ \t]*\b(irm|Invoke-RestMethod)\b[^\r\n|]{0,240}\|\s*(iex|Invoke-Expression)\b'
  not:
    - regex: '(?i)\b(?:irm|Invoke-RestMethod)\s+(?:-Uri\s+)?["'']?https://raw\.githubusercontent\.com/ScoopInstaller/Install/(?:master|main)/install\.ps1["'']?\s*\|\s*(?:iex|Invoke-Expression)\b'
  unless:
    - id: well-known/lib/ai/unsloth::unsloth-package-context
    - id: well-known/app/productivity/ferronote::ferronote-windows-installer-context
    - id: well-known/app/ai/gateway/ollama::official-install-ps1-url
    # Bun publishes this exact bootstrap as its supported Windows installer.
    - id: micro-behaviors/os/package-manager/install::bun-powershell-piped-installer-command
    - id: well-known/tool/packaging/uv::uv-powershell-piped-installer-command
    # PowerShell comment-based help can document the one-liner used to fetch
    # this same script; that inert example is not fileless execution.
    - id: metadata/package/documentation/powershell-help/
    - id: well-known/tool/sysadmin/scoop::scoop-bootstrap-installer-context
    - id: well-known/app/communication/slack::official-install-windows-ps1-url
    - id: well-known/app/ai/coding-agent/skillshare::skillshare-windows-installer-context

composite_rules:
- id: powershell-rest-response-evaluator-call
  desc: REST pipeline includes PowerShell evaluator call
  crit: notable
  for: [powershell]
  conf: 0.96
  attack: "T1105"
  all:
  - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
  - id: micro-behaviors/process/deploy::powershell-rest-response-piped-eval-line
  near_bytes: 256
  unless:
  - id: well-known/tool/packaging/avengineers-bootstrap-installer::bootstrap-installer-powershell-context
  - id: well-known/app/productivity/ferronote::ferronote-windows-installer-context
  - id: well-known/tool/sysadmin/scoop::scoop-bootstrap-installer-context
  - id: micro-behaviors/os/package-manager/install::bun-powershell-piped-installer-command
  - id: well-known/tool/packaging/uv::uv-powershell-piped-installer-command
  - id: well-known/app/ai/coding-agent/skillshare::skillshare-windows-installer-context
  - id: well-known/app/ai/coding-agent/byteask::byteask-windows-installer-context
  - id: well-known/app/ai/coding-agent/kimi-cli::official-kimi-cli-installer-context
- id: powershell-https-rest-response-eval
  desc: HTTPS REST response piped to PowerShell evaluator
  crit: notable
  conf: 0.96
  all:
    - id: micro-behaviors/communications/http/download/cli::irm-https-url
    - id: micro-behaviors/process/deploy::powershell-rest-response-piped-eval-line
  unless:
    - id: well-known/lib/ai/unsloth::unsloth-package-context
    - id: well-known/app/productivity/ferronote::ferronote-windows-installer-context
    - id: well-known/app/ai/gateway/ollama::official-install-ps1-url
    - id: micro-behaviors/os/package-manager/install::bun-powershell-piped-installer-command
    - id: well-known/tool/packaging/uv::uv-powershell-piped-installer-command
    - id: metadata/package/documentation/powershell-help::powershell-comment-help-piped-url-example
    - id: metadata/package/documentation/powershell-help::powershell-comment-help-irm-iex-example
    - id: well-known/app/communication/slack::official-install-windows-ps1-url
    - id: well-known/app/ai/coding-agent/karajan-code::windows-installer-context
- id: powershell-https-rest-eval-one-line
  desc: One-line HTTPS REST response evaluation
  crit: notable
  conf: 0.96
  all:
    - id: micro-behaviors/communications/http/download/cli::irm-https-url
    - id: metadata/file/line::file-one-liner
    - id: micro-behaviors/process/deploy::powershell-rest-response-piped-eval-line
  unless:
    - id: well-known/lib/ai/unsloth::unsloth-package-context
    - id: well-known/app/productivity/ferronote::ferronote-windows-installer-context
    - id: well-known/app/ai/gateway/ollama::official-install-ps1-url
    - id: micro-behaviors/os/package-manager/install::bun-powershell-piped-installer-command
    - id: well-known/tool/packaging/uv::uv-powershell-piped-installer-command
    - id: metadata/package/documentation/powershell-help::powershell-comment-help-piped-url-example
    - id: metadata/package/documentation/powershell-help::powershell-comment-help-irm-iex-example
    - id: well-known/app/communication/slack::official-install-windows-ps1-url
    - id: well-known/app/ai/coding-agent/karajan-code::windows-installer-context
- id: powershell-https-ps1-response-eval
  desc: HTTPS PS1 response piped to evaluator
  crit: notable
  conf: 0.95
  all:
    - id: micro-behaviors/communications/http/download/cli::irm-https-ps1-url
    - id: micro-behaviors/process/deploy::powershell-rest-response-piped-eval-line
  unless:
    - id: well-known/lib/ai/unsloth::unsloth-package-context
    - id: well-known/app/productivity/ferronote::ferronote-windows-installer-context
    - id: well-known/app/ai/gateway/ollama::official-install-ps1-url
    - id: micro-behaviors/os/package-manager/install::bun-powershell-piped-installer-command
    - id: well-known/tool/packaging/uv::uv-powershell-piped-installer-command
    - id: metadata/package/documentation/powershell-help::powershell-comment-help-piped-url-example
    - id: metadata/package/documentation/powershell-help::powershell-comment-help-irm-iex-example
    - id: well-known/app/communication/slack::official-install-windows-ps1-url
    - id: well-known/app/ai/coding-agent/karajan-code::windows-installer-context
# HTTPS download and evaluation occur in the same local region.
- id: powershell-https-web-response-eval
  desc: HTTPS web response piped to PowerShell evaluator
  crit: notable
  conf: 0.96
  near_bytes: 512
  all:
    - id: micro-behaviors/communications/http/download/cli::irm-https-url
    - id: micro-behaviors/process/deploy::powershell-web-response-piped-eval-text
  unless:
    - id: well-known/lib/ai/unsloth::unsloth-package-context
    - id: well-known/app/productivity/ferronote::ferronote-windows-installer-context
    - id: well-known/app/ai/gateway/ollama::official-install-ps1-url
    - id: micro-behaviors/os/package-manager/install::bun-powershell-piped-installer-command
    - id: well-known/tool/packaging/uv::uv-powershell-piped-installer-command
    - id: metadata/package/documentation/powershell-help::powershell-comment-help-piped-url-example
    - id: metadata/package/documentation/powershell-help::powershell-comment-help-irm-iex-example
    - id: well-known/app/communication/slack::official-install-windows-ps1-url
    - id: well-known/app/ai/coding-agent/karajan-code::windows-installer-context
