defaults:
  platforms:
    - unix
    - windows
  for:
    - python

composite_rules:
  - id: encoded-powershell-variable-launch-clues
    desc: Hidden PowerShell encoded-variable command clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/process/argument/interpreter::python-powershell-long-encoded-variable
      - id: micro-behaviors/data/format/command::powershell-command-fstring
      - id: micro-behaviors/process/argument/visibility::powershell-hidden-command-text
