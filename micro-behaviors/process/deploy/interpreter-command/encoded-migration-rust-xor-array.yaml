defaults:
  for: [rust]
  platforms: [unix]
  crit: suspicious
  conf: 0.98
traits:
  - id: rust-xor-array-shell-argument
    desc: XOR-decoded byte array supplies shell command
    if:
      type: tree-sitter
      query: |
        ((source_file
         [(static_item name: (identifier) @table value: (array_expression))
          (const_item name: (identifier) @table value: (array_expression))]
         (function_item name: (identifier) @decoder return_type: (type_identifier) @string
          body: (block . (call_expression function: (field_expression value: (call_expression function: (field_expression value: (call_expression function: (field_expression value: (identifier) @table_use field: (field_identifier) @iter) arguments: (arguments)) field: (field_identifier) @map) arguments: (arguments (closure_expression parameters: (closure_parameters (identifier) @byte)
         body: (type_cast_expression value: (parenthesized_expression
         (binary_expression left: (identifier) @byte_use "^" right: (_))) type: (primitive_type) @char)))) field: (field_identifier) @collect) arguments: (arguments)) .))
         (function_item body: (block
          (let_declaration pattern: (identifier) @command value: (call_expression function: (identifier) @decoder_use)) @binding .
          (let_declaration value: (call_expression function: (field_expression value: (call_expression function: (field_expression value: (call_expression function: (field_expression value: (call_expression function: (scoped_identifier) @factory arguments: (arguments (string_literal) @shell)) field: (field_identifier) @arg_flag) arguments: (arguments (string_literal) @flag)) field: (field_identifier) @arg_command) arguments: (arguments [(identifier) @command_use (reference_expression value: (identifier) @command_use)])) field: (field_identifier) @execute) arguments: (arguments))))))
         (#eq? @table @table_use)
         (#eq? @decoder @decoder_use)
         (#eq? @command @command_use)
         (#eq? @byte @byte_use)
         (#eq? @string "String")
         (#eq? @char "char")
         (#eq? @iter "iter")
         (#eq? @map "map")
         (#eq? @collect "collect")
         (#eq? @arg_flag "arg")
         (#eq? @arg_command "arg")
         (#match? @execute "^(spawn|status|output)$")
         (#match? @factory "^(std::process::)?Command::new$")
         (#match? @shell "^\"(/(usr/)?bin/)?(ba|z|da)?sh\"$")
         (#eq? @flag "\"-c\"")
         (#not-match? @binding "^let\\s+mut\\b")
         (#set! cleave.ignore-comments "true"))
