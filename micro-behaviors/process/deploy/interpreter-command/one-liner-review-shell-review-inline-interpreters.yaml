defaults:
  platforms:
    - unix
traits:
  - conf: 0.9
    id: python-shell-exec-system
    desc: python -c with exec/system/popen text
    crit: notable
    for:
      - shell
    if:
      type: text
      regex: \bpython[23]?\s+-c\s+['"].{0,200}\b(exec|system|popen)\b
    not:
      - regex: platform\.system
  - conf: 0.9
    id: python-shell-spawn-subprocess
    desc: python -c with spawn/subprocess text
    crit: notable
    for:
      - shell
    if:
      type: text
      regex: \bpython[23]?\s+-c\s+['"].{0,200}\b(spawn|subprocess)\b
  - conf: 0.9
    id: perl-shell-execution
    desc: perl -e with exec/system text
    crit: notable
    for:
      - shell
    if:
      type: text
      regex: perl\s+-e\s+['"].{0,200}(exec\(|system\()
  - conf: 0.9
    id: ruby-shell-execution
    desc: ruby -e with exec/system text
    crit: notable
    for:
      - shell
    if:
      type: text
      regex: ruby\s+-e\s+['"].{0,200}(exec\(|system\()
composite_rules:
  - conf: 1.0
    id: python-shell-execution
    desc: python -c with process or eval text
    crit: notable
    for:
      - shell
    any:
      - id: micro-behaviors/process/deploy/interpreter-command::python-shell-exec-system
      - id: micro-behaviors/process/deploy/interpreter-command::python-shell-spawn-subprocess
  - conf: 0.9
    id: unix-inline-interpreter-execution
    desc: Inline interpreter or shell command text
    crit: notable
    any:
      - id: micro-behaviors/process/deploy/interpreter-command::python-shell-execution
      - id: micro-behaviors/process/deploy/interpreter-command::perl-shell-execution
      - id: micro-behaviors/process/deploy/interpreter-command::ruby-shell-execution
      - id: micro-behaviors/process/create/shell/command-mode::sh-c-exec
