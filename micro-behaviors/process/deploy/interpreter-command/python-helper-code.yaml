defaults:
  for: [python]
  platforms: [unix, windows]
  crit: component
  conf: 0.95
traits:
  - id: python-child-import-call-literal
    desc: Process argument contains Python helper code
    if:
      type: symbol
      kind: call
      regex: '^subprocess\.(Popen|run|call)$'
      arg:
        index: 0
        from:
          value: '^import [\w.]+( as \w+)?[;\r\n]\s*\w+(\.\w+)+\('
