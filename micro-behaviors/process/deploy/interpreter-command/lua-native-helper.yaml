defaults:
  for: [lua]
  platforms: [windows]
traits:
  - id: lua-module-native-interpreter-helper
    desc: Lua module invokes a native script launcher
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: lua
      query: |
        ((chunk
          (function_declaration name: (identifier) @helper
            parameters: (parameters . (identifier) @parameter .)
            body: (block
              (if_statement condition: (function_call name: (dot_index_expression) @native
                arguments: (arguments . (_) .
                  (function_call arguments: (arguments . (identifier) @usedparameter .)))))))
          (function_call name: (identifier) @invoked
            arguments: (arguments . (string) @command .)))
          (#eq? @helper @invoked) (#eq? @parameter @usedparameter)
          (#match? @native "\\.CreateProcessW$")
          (#match? @command "(?i)lua(jit)?\\.exe.{1,140}\\.lua")
          (#set! cleave.ignore-comments "true"))
