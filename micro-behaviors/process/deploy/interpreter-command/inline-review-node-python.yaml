defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96
traits:
  - id: node-python-inline-source
    desc: Node launches Python with inline source
    attack: T1059.006
    if:
      # Call facts expose an array shape but not its positional elements.
      # Bind the executable, first option, and code to the same launch.
      type: tree-sitter
      query: |
        (call_expression
          function: [
            (identifier) @launch
            (member_expression property: (property_identifier) @launch)
          ]
          arguments: (arguments
            . (string (string_fragment) @executable)
            . (array . (string (string_fragment) @option) . (_) @source))
          (#match? @launch "^(execFile|execFileSync|spawn|spawnSync)$")
          (#match? @executable "(^|[/\\\\])python[23]?(\\.exe)?$")
          (#eq? @option "-c")) @execution
