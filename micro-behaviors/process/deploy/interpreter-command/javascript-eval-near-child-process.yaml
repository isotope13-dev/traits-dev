defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

composite_rules:
  - id: javascript-eval-near-child-process
    desc: JavaScript dynamic evaluation and child-process launch occur nearby
    conf: 0.9
    near_bytes: 4096
    all:
      - id: micro-behaviors/process/create/exec::node-process-launch-call
    any:
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-variable-argument
      - id: micro-behaviors/process/interpreter/eval/javascript::js-eval-call-expression-arg
      - id: micro-behaviors/metaprogramming/generation/function::embedded-eval-variable-source
      - id: metadata/file/encoding/shape::encoded-eval-expression-reference
