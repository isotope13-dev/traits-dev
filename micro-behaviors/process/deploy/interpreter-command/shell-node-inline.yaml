defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: shell-node-inline-eval
    desc: Shell invokes Node with inline JavaScript
    if:
      type: symbol
      kind: call
      regex: '(^|/)(node|nodejs)(\.exe)?$'
      arg:
        kind: identifier
        name_regex: '^(-e|--eval)$'
