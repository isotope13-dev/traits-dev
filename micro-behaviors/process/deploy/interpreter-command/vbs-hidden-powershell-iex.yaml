defaults:
  platforms: [windows]
  for: [vbs]
traits:
- id: vbs-hidden-powershell-iex
  desc: Hidden PowerShell and IEX text
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: '(?is)powershell.{0,120}(-windowstyle\s+hidden|-w\s+hidden).{0,120}IEX'
  unless:
  - id: metadata/file/format/record-sequence::hashed-text-record
