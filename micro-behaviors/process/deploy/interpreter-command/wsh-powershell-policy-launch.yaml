defaults:
  platforms:
    - windows
  for:
    - javascript
composite_rules:
  - id: wsh-powershell-policy-launch
    desc: WSH, file API and policy override references
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/process/create/shell/interpreter::wsh-progid-near-run
      - id: micro-behaviors/data/control-flow/dispatch/run::run-zero-boolean-arguments
      - id: micro-behaviors/data/control-flow/dispatch/run::wscript-shell-run-statement
      - id: micro-behaviors/process/create/hidden::wscript-shell-run-obfuscated
      - id: micro-behaviors/data/control-flow/dispatch/named::wscript-shell-exec-indirect
    all:
      - id: micro-behaviors/os/com/automation::wscript-shell-literal
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: micro-behaviors/os/security/policy::execution-policy-bypass
