defaults:
  platforms: [windows]
  for: [java, kotlin]
traits:
  - id: jvm-powershell-command-launch
    desc: JVM launches PowerShell command text
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'ProcessBuilder\(["'']powershell["''][^;]{0,240}"-Command"[^;]{0,80}\)\.start\('
