defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
traits:
  - id: python-powershell-command-argv
    desc: Python subprocess supplies PowerShell source
    conf: 0.98
    attack: T1059.001
    if:
      # The first argv item must be the interpreter; a later argument merely
      # mentioning PowerShell does not establish interpreter execution.
      type: tree-sitter
      query: |
        ((call
          function: (attribute
            object: (identifier) @module
            attribute: (identifier) @method)
          arguments: (argument_list
            (list . (string (string_content) @exe)
              (_)* (string (string_content) @option) . (_) @source))) @launch
          (#eq? @module "subprocess")
          (#match? @method "^(run|call|Popen|check_call)$")
          (#match? @exe "(?i)^(powershell|pwsh)(\\.exe)?$")
          (#match? @option "(?i)^-command$"))
