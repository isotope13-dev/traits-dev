defaults:
  platforms: [windows]
  for: [text, batch, powershell]
  attack: T1059.001

traits:
  - id: text-powershell-encoded-command
    desc: PowerShell encoded-command Base64 switch
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\s+-(e|enc|encodedcommand)\s+[A-Za-z0-9+/]{32,}'
