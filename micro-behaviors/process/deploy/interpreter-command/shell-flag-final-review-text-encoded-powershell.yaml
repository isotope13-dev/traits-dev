defaults:
  platforms: [windows]
  for: [text, batch, powershell]
  attack: T1059.001

traits:
  - id: text-powershell-encoded-command
    desc: PowerShell encoded-command Base64 switch
    crit: suspicious
    conf: 0.96
    unless:
      - id: metadata/file/format/database-dump::postgresql-data-dump
      - id: metadata/file/format/command-input-corpus::toml-command-scenario-records
      - id: metadata/file/format/command-input-corpus::guard-command-corpus
    if:
      type: text
      regex: '(?i)\b(powershell|pwsh)(\.exe)?\s+-(e|enc|encodedcommand)\s+[A-Za-z0-9+/]{32,}'
