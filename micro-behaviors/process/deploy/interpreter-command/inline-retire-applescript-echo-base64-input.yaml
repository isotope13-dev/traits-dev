defaults:
  platforms: [macos]
  for: [shell, html, javascript, markdown]


traits:
  - id: osascript-e-echo-cmdsubst
    desc: Osascript -e from echo or printf
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bosascript\s+-e.{0,40}\$\(\s*(echo|printf)\b'

composite_rules:
  - id: osascript-e-base64-decode
    desc: Osascript -e and Base64 decoding clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/process/deploy/interpreter-command::osascript-e-echo-cmdsubst
    any:
      - id: micro-behaviors/data/decode/command::base64-decode-command-option
      - id: micro-behaviors/data/decode/command::base64-decode-command
    near_bytes: 800
