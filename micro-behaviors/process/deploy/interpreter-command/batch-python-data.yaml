defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-python-pyd-main-input
    desc: Python executes pyd-named main script
    crit: notable
    conf: 0.97
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^start\s+""\s+/b\s+"[^"\r\n]*\\python\.exe"\s+"[^"\r\n]+\.pyd"'
