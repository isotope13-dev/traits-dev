traits:
- id: sys-executable-c-popen
  desc: Popen executable and inline Python argument
  conf: 0.94
  if:
    type: text
    regex: (\w+\.)?Popen\s*\(\s*\[\s*[\w.]+\.executable\s*,\s*(['"]-I['"]\s*,\s*)?['"]-c['"]
- id: sys-executable-c-arg-list
  desc: Interpreter executable with -c inline argument
  conf: 0.94
  if:
    type: text
    regex: \[\s*[\w.]+\.executable\s*,\s*(['"]-I['"]\s*,\s*)?['"]-c['"]
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  attack: T1059.006
  crit: notable
  mbc: E1059.006
