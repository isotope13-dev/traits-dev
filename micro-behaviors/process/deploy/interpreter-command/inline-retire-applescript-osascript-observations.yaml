defaults:
  for: [source]
  platforms:
    - macos
    - ios
  attack: T1059.002
traits:
  - id: osascript-exec
    desc: osascript inline command text
    crit: notable
    conf: 0.8
    for: [shell, applescript, macho]
    if:
      type: text
      regex: osascript\s+-e\s+\\?['"]
  - id: osascript-do-shell-script-var
    desc: osascript shell variable command text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: osascript\s+-e\s+["']do shell script\s+\$[A-Za-z0-9_]+
