# Naming alone cannot establish DNS tasking. These retain the observed
# command-building context; actual DNS-sourced execution needs provenance.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
composite_rules:
  - id: txt-helper-shell-argv-clues
    desc: TXT-named helper near shell command arguments
    crit: notable
    conf: 0.98
    near_lines: 30
    scope: file
    all:
      - id: metadata/lang/source/naming/function/name-form::txt-fields-helper-reference
      - id: micro-behaviors/process/deploy/interpreter-command::jvm-sh-c-argument-pass
  - id: js-txt-helper-execfile-clues
    desc: TXT-named helper near execFile and Unix shell path
    crit: notable
    conf: 0.98
    near_lines: 30
    for:
      - javascript
      - typescript
    scope: file
    all:
      - id: metadata/lang/source/naming/function/name-form::txt-fields-helper-reference
      - id: micro-behaviors/process/create/exec::js-execfile-call
      - id: micro-behaviors/fs/path/application/interpreter::unix-shell-executable-path
