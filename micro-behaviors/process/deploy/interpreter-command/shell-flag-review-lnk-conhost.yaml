defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-cmd-c-argument
    desc: LNK cmd /c argument
    crit: notable
    conf: 0.9
    if:
      type: value
      path: lnk.arguments
      # cmd may enable delayed expansion (/v:on) before /c; same execution.
      regex: '(?i)\bcmd(\.exe)?\s+(/v:(on|off)\s+)?/c\b'
