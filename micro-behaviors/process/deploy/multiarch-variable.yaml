defaults:
  platforms: [unix, windows]
  for: [shell]
composite_rules:
  - id: raw-ip-multiarch-variable-launch
    desc: Raw-IP fetch and variable multi-arch launch
    crit: suspicious
    conf: 0.99
    attack: "T1105,T1059.004,T1222.002"
    all:
      - id: micro-behaviors/communications/ip/literal::shell-external-ipv4-reference
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
      - id: micro-behaviors/process/create/local-exec::shell-variable-exec-with-args
      - id: "micro-behaviors/os/sysinfo/platform/arch::multi-arch-target"
    any:
      - id: micro-behaviors/communications/http/download/shell::fetch-var-output-var
      - id: micro-behaviors/communications/http/download/shell::fetch-variable-input-output-command
