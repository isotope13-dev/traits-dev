# CIL output array local 2 is filled by XOR and copied to native local 4.
# RX protection and the thread-start argument reuse native local 4.
# Metadata tokens, key value and payload size are not pinned.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: cil-xor-array-rx-thread-local-layout
    desc: CIL XOR array to RX/thread-start local layout
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '08 09 06 09 91 07 61 D2 9C 09 17 58 0D [40-80] 08 16 11 04 08 8E 69 28 ?? ?? ?? 0A 00 11 04 08 8E 69 1F 20 12 ?? 28 ?? ?? ?? 06 [12-32] 7E ?? ?? ?? 0A 16 11 04 7E ?? ?? ?? 0A 16 12 ?? 28 ?? ?? ?? 06'
