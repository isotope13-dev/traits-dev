defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
traits:
  - id: x64-copy-buffer-offset-jump
    desc: x64 buffer copy then offset jump
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # Save allocation base, copy from a host-relative location, then
      # jump to base+offset. No particular size or host RVA is required.
      pattern: '50 41 5A 48 89 C7 48 8D B3 [4] B9 [4] F3 A4 4D 8D 92 [4] 41 FF E2'
