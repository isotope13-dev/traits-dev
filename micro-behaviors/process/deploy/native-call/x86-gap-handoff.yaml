defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]

traits:
  - id: x86-gap-protected-buffer-offset-call
    desc: Buffer offset call after protection setup
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # PAGE_EXECUTE_READ, size, buffer, branch over host code; resolve the
      # protection target, then pass buffer and invoke buffer+entry offset.
      # Argument shape is asserted here; the consumer requires VirtualProtect.
      pattern: '68 20 00 00 00 E9 [4] [0-512] 68 [4] FF F7 E9 [4] [0-64] 8B 54 24 ?? E9 [4] [0-32] 81 C2 [4] FF 12 E9 [4] [0-32] 57 81 C7 [4] E9 [4] [0-64] FF D7 61 C2 00 00'
