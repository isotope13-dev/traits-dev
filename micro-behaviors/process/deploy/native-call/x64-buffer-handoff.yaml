defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
traits:
  - id: x64-buffer-protection-offset-call
    desc: x64 buffer call after protection-shaped call
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: text
      # Rewind output cursor; preserve base; pass base/length/EXECUTE_READ/
      # old-protection pointer; invoke base+offset and restore host stack.
      # This pattern asserts the argument shape, not the imported target.
      pattern: '49 81 EB [4] 49 8B FB 48 89 F9 48 BA [8] 4D B8 20 00 00 00 00 00 00 00 4B 89 E1 42 FF 15 [4] 48 8B CF 48 81 C7 [4] 48 FF D7 48 89 EC'
