# Bind allocation output, ReadFile destination and callback to one register.
# No campaign names, fixed sizes, fixed register number or fixed stride.
defaults:
  platforms: [windows]
  for: [data, text]
  size_max: 2000000
traits:
  - id: strided-nsis-file-rwx-callback-commands
    desc: Strided file-to-RWX callback command chain
    crit: notable
    conf: 0.99
