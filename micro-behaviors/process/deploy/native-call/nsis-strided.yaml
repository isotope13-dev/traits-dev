                uint8(((a+n*s)+(19+digits+57+readsize)*s)+13*s) == 0x72
                      and uint8((a+n*s)+(19+digits+57+readsize+14)*s) >= 0x30 and
                      uint8((a+n*s)+(19+digits+57+readsize+14)*s) <= 0x39 and
