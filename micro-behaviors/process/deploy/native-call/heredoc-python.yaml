defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: heredoc-python-native-memory-callback
    desc: Python heredoc invokes native-memory callbacks
    conf: 0.98
    if:
      type: tree-sitter
      language: shell
      query: |
        ((heredoc_body) @body
         (#match? @body "\\bctypes\\.CFUNCTYPE\\(")
         (#match? @body "\\b(base64\\.b64decode|ctypes\\.memmove)\\(")
         (#match? @body "\\b(VirtualAlloc|mprotect)[ \\t]*\\(")
         (#match? @body "PROT_EXEC|ctypes\\.c_int\\(0x40\\)"))
