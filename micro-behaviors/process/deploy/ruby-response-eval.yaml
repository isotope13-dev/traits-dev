# Ruby eval whose argument the flow graph traces to a get/open/read call
# result (Net::HTTP.get, URI.open(...).read). Receiver identity is not kept,
# so consumers pair this with an HTTP client import before claiming a fetch.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  attack: T1059,T1105

traits:
  - id: ruby-eval-of-fetch-call-result
    desc: Ruby eval of a get/open/read call result
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: eval
      arg:
        from:
          call: '^(get|get_response|open|read)$'
