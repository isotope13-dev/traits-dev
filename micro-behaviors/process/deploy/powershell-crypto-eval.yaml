defaults:
  platforms: [windows]
  for: [powershell, batch]
  crit: notable
  conf: 0.98
traits:
  - id: powershell-inline-crypto-transform-evaluation
    desc: Evaluates an inline crypto transform result
    if:
      type: text
      regex: '(?i)\b(Invoke-Expression|iex)\s*\([^;\r\n]{0,160}\.TransformFinalBlock\s*\('

# File-local API co-occurrence supports a capability observation. It does not
# bind a decryptor's output to IEX, and is not an admission rule for malware.
composite_rules:
  - id: powershell-decrypt-eval-cooccurrence
    desc: PowerShell decryption and eval APIs co-occur
    for: [powershell]
    conf: 0.9
    all:
      - id: micro-behaviors/crypto/symmetric/decrypt::powershell-create-decryptor-call
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-text
