defaults:
  platforms: [windows]
  for: [powershell, batch]
  crit: notable
  conf: 0.98
traits:
  - id: powershell-inline-crypto-transform-evaluation
    desc: Evaluates an inline crypto transform result
    if:
      type: text
      regex: '(?i)\b(Invoke-Expression|iex)\s*\([^;\r\n]{0,160}\.TransformFinalBlock\s*\('
