defaults:
  platforms:
  - unix
composite_rules:
- for:
  - shell
  attack: T1105,T1059.004
  id: repeated-ftp-multiarch-local-launch
  desc: Repeated FTP fetches, architecture references and local launches coexist
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-shell-literal
  - id: micro-behaviors/os/sysinfo/platform/string::multi-arch-runtime-wordlist
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
  - id: micro-behaviors/process/create/local-exec::execute-dot-slash-literal
  any:
  - id: micro-behaviors/communications/ftp/download/busybox::repeated-ftpget-fetch
  - id: micro-behaviors/communications/ftp/download/busybox::repeated-ftpget-utility-fetch
- attack: T1105,T1059.004,T1222.002
  id: raw-ip-wget-chmod-local-exec
  desc: Public-IP wget, chmod and local launch co-occur
  crit: notable
  conf: 0.97
  near_bytes: 256
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  - id: micro-behaviors/communications/http/download/shell::wget-http-literal-download
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
  - id: micro-behaviors/process/create/local-exec::execute-dot-slash-literal
- attack: T1105,T1059.004,T1222.002
  id: tmp-raw-ip-wget-chmod-local-exec
  desc: Temporary-directory staging and public-IP launch co-occur
  crit: notable
  conf: 0.97
  near_bytes: 256
  all:
  - id: micro-behaviors/fs/directory/chdir::shell-cd-slash-tmp
  - id: micro-behaviors/process/deploy::raw-ip-wget-chmod-local-exec
