defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-urllib-response-exec
    desc: Python directly evaluates urllib response body
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      kind: call
      regex: '^exec\s*\(\s*urllib(\.request)?\.urlopen\([^)]{0,120}\)\.read\('
