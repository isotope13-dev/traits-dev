# Bind the download destination to the launched path. Independent occurrences
# of OutFile and Start-Process do not establish a payload chain.
defaults:
  platforms: [windows]
  for: [pe, dll, powershell, batch, javascript]
traits:
  - id: powershell-download-launch-same-temp-exe
    desc: Command downloads and launches same TEMP EXE
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule powershell_download_launch_same_temp_exe {
          strings:
            $chain = /\b(iwr|Invoke-WebRequest)[ \t]+[^;\r\n\x00]{1,256}-OutFile[ \t]+["']?\$env:(TEMP|TMP)\\[a-z0-9_.-]{1,80}\.exe["']?[ \t]*;[ \t\r\n]*Start-Process[ \t]+(-FilePath[ \t]+)?["']?\$env:(TEMP|TMP)\\[a-z0-9_.-]{1,80}\.exe/ nocase
            $path = /\$env:(TEMP|TMP)\\[a-z0-9_.-]{1,80}\.exe/ nocase
          condition:
            for any c in (1..#chain) : (
              for any p in (1..#path) : (
                @path[p] >= @chain[c] and
                @path[p] + !path[p] < @chain[c] + !chain[c] and
                for any q in (1..#path) : (
                  @path[q] > @path[p] + !path[p] and
                  @path[q] + !path[q] == @chain[c] + !chain[c] and
                  !path[p] == !path[q] and
                  for all k in (0..!path[p]-1) : (
                    (uint8(@path[p]+k) | 32) == (uint8(@path[q]+k) | 32)
                  )
                )
              )
            )
        }
