defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-gzip-base64-compile-exec
    desc: Executes gzip-Base64 decoded Python source
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (function_definition
          body: (block
            (if_statement consequence: (block
              (try_statement body: (block
                (expression_statement (assignment
                  left: (identifier) @decoded
                  right: (call function: (attribute
                    object: (call function: (attribute
                      object: (identifier) @gzip
                      attribute: (identifier) @decompress)
                      arguments: (argument_list
                        (call function: (attribute
                          object: (identifier) @base64
                          attribute: (identifier) @b64decode))))
                    attribute: (identifier) @decode))))
                (expression_statement (call
                  function: (identifier) @exec
                  arguments: (argument_list (call
                    function: (identifier) @compile
                    arguments: (argument_list (identifier) @source)))) ) @activation
              ))
            ))
          )
          (#eq? @gzip "gzip")
          (#eq? @decompress "decompress")
          (#eq? @base64 "base64")
          (#eq? @b64decode "b64decode")
          (#eq? @decode "decode")
          (#eq? @exec "exec")
          (#eq? @compile "compile")
          (#eq? @decoded @source)
        )
