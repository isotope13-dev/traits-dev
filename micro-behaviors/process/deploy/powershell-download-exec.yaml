# Bind the downloaded file to the launched file: Invoke-WebRequest -OutFile
# followed by Start-Process in one command. Independent occurrences of either
# do not establish a payload chain; sibling powershell-temp-exe.yaml pins the
# TEMP-path form, this one covers arbitrary destinations (Users\Public, C:\,
# profile paths) and variable-held paths.
defaults:
  platforms: [windows]
  for: [pe, powershell, javascript, vbs]

traits:
  - id: powershell-outfile-start-process-chain
    desc: PowerShell downloads a file and starts it
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule powershell_outfile_start_process_chain {
          strings:
            $chain = /(^|[^-a-z])((iwr|Invoke-WebRequest)[ \t]+[^;\r\n\x00]{0,256}-OutFile[ \t]+[^;\r\n\x00]{1,160}[ \t]*;[ \t\r\n]{0,40}Start-Process[ \t]+(-FilePath[ \t]+)?[^;\r\n\x00]{1,160})/ nocase
          condition:
            $chain
        }
  # Encoded-layer coverage: the same chain inside a Base64/hex-encoded
  # command string (encoded script loaders).
  - id: encoded-outfile-start-process-chain
    desc: Encoded OutFile-to-Start-Process chain
    crit: notable
    conf: 0.9
    if:
      type: encoded
      regex: '-OutFile[^;\r\n]{0,120};[^;\r\n]{0,40}Start-Process'
