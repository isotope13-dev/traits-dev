defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  # NT optional header AddressOfEntryPoint (+0x28) plus image base in ESI
  # becomes EDI. Call that same EDI with (image, DLL_PROCESS_ATTACH, context).
  # A helper call and four inline bytes intervene; their contents, addresses
  # and the local context slot vary independently of the entry handoff.
  - id: x86-image-entry-dll-attach-call
    desc: Image-relative entry called for DLL attach
    crit: notable
    conf: 0.97
    attack: T1620
    if:
      type: hex
      section: .text
      pattern: '8B 85 ?? ?? ?? ?? 8B 78 28 03 FE E8 ?? ?? ?? ?? [4] FF 75 ?? 6A 01 56 FF D7'
