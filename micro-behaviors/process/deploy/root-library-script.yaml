# A <script> whose src is a popular library filename directly under the site
# root (`/vue.min.js`, `/jquery.js`). Many hand-built sites do this; CMS
# themes and bundlers keep libraries under asset directories, so on a CMS
# page it is a common spot for an injected loader wearing a library name.
defaults:
  for: [html]
  platforms: [windows, unix]
  crit: notable
  conf: 0.85
traits:
  - id: root-library-named-script-src
    desc: Script loads library-named file from site root
    if:
      type: text
      exclude_html_comments: true
      regex: '<script\b[^>]{0,60}\bsrc=["'']/(vue|jquery|react|angular)[\w.-]{0,12}\.js["'']'
