defaults:
  platforms: [linux]
  for: [shell]
  attack: T1105,T1059.004,T1222.002

# These profiles do not establish fleet membership or a control channel.
# Raw-IP HTTP executable acquisition crosses an unverified trust boundary;
# architecture selection and ordinary HTTP client fallback alone are notable.
composite_rules:
  - id: raw-ip-multiarch-fallback-launch
    desc: Raw-IP HTTP fallback, architecture selection and local launch co-occur
    crit: suspicious
    conf: 0.99
    all:
    - id: micro-behaviors/communications/transfer::multiple-download-clients
    - id: "micro-behaviors/os/sysinfo/platform/arch::multi-arch-target"
    - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
    - id: micro-behaviors/process/create/local-exec::execute-dot-slash-var
    any:
    - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
    - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
    needs: 1
  - id: multiarch-fallback-launch-profile
    desc: Multi-arch HTTP fallback, chmod and launch references co-occur
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/communications/transfer::multiple-download-clients
      - id: "micro-behaviors/os/sysinfo/platform/arch::multi-arch-target"
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-var-target
    any:
      - id: micro-behaviors/process/create/local-exec::shell-variable-exec-with-args
      - id: micro-behaviors/process/create/local-exec::chmod-exec-var-local
      - id: micro-behaviors/process/create/local-exec::execute-dot-slash-var

    unless:
      - id: metadata/build/archive::source-archive-member
      - id: metadata/build/autotools::autoconf-generated-script
      - id: micro-behaviors/os/package-manager/installer-script::installer-script
      - id: micro-behaviors/os/package-manager/installer-script::verified-github-release-installer
      - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
      - id: micro-behaviors/crypto/hash/file::sha512-pinned-download-context
