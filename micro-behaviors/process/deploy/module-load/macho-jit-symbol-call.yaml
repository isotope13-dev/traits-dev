defaults:
  platforms: [macos]
  for: [c, cpp]
traits:
  - id: macho-jit-resolved-symbol-call
    desc: JIT mapping to resolver, result called
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      language: c
      query: |
        ((_
          (declaration declarator: (init_declarator
            declarator: (pointer_declarator declarator: (identifier) @allocation)
            value: (call_expression function: (identifier) @mmap
              arguments: (argument_list . (_) . (_) . (_)
                . [(identifier) @jit
                   (binary_expression operator: "|" right: (identifier) @jit)]))))
          (declaration declarator: (init_declarator
            declarator: (identifier) @image
            value: (cast_expression value: (identifier) @mapped)))
          (declaration declarator: (init_declarator
            declarator: (pointer_declarator declarator: (identifier) @address)
            value: (call_expression function: (identifier) @resolver
              arguments: (argument_list . (cast_expression value: (identifier) @resolved_image)))))
          (declaration declarator: (init_declarator
            declarator: (function_declarator
              declarator: (parenthesized_declarator
                (pointer_declarator declarator: (identifier) @entry)))
            value: (cast_expression value: (identifier) @entry_address)))
          (expression_statement (call_expression function: (identifier) @invoked)))
          (#match? @mmap "^(syscall_)?mmap$")
          (#eq? @jit "MAP_JIT")
          (#match? @resolver "^(find|resolve|lookup)_(symbol|sym)$")
          (#eq? @allocation @mapped)
          (#eq? @image @resolved_image)
          (#eq? @address @entry_address)
          (#eq? @entry @invoked))
