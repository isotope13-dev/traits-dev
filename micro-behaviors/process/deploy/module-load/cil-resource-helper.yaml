defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: neighbor-xor-resource-load-profile
  desc: Resource decoder accompanies assembly load shape
  crit: suspicious
  conf: 0.98
  if:
    type: yara
    source: |
      import "pe"
      rule neighbor_xor_resource_load_profile {
        strings:
          $code = { 02 72 ?? ?? ?? 70 28 ?? ?? ?? 0A 28 ?? ?? ?? 06 0C 08 28 ?? ?? ?? 0A 0A }
          $transform = { 91 61 02 50 07 17 D6 02 50 8E B7 5D 91 DA 20 00 01 00 00 D6 20 00 01 00 00 5D B4 9C }
          $resource = "GetManifestResourceStream" ascii fullword
          $b64 = "FromBase64String" ascii fullword
          $assembly = "Assembly" ascii fullword
          $load = "Load" ascii fullword
        condition:
          all of them and
          for any s in pe.sections : (
            s.name == ".text" and
            $code in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
          )
      }
