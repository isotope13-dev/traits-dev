# Load(arg0) -> entry method -> declaring-type instance -> MethodBase.Invoke.
# This is neutral activation of supplied managed bytes. The calling task
# dispatcher, rather than reflection itself, supplies attack admission.
defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: cil-byte-array-instance-invocation
    desc: CIL supplied-byte load and instance invocation
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        import "pe"
        rule cil_byte_array_instance_invocation {
          strings:
            $load = { 28 ?? ?? ?? 0A 02 6F ?? ?? ?? 0A 0B
                      07 6F ?? ?? ?? 0A 0D 07 09
                      6F ?? ?? ?? 0A 6F ?? ?? ?? 0A
                      28 ?? ?? ?? 0A 0C }
            $invoke = { 09 08 28 ?? ?? ?? 0A 11 ?? 6F ?? ?? ?? 0A 26 }
            $load_name = "Load" ascii fullword
            $instance = "CreateInstance" ascii fullword
            $method = "MethodBase" ascii fullword
            $invoke_name = "Invoke" ascii fullword
          condition:
            for any s in pe.sections : (
              s.name == ".text" and
              for all of them : (
                $ in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
              ) and
              for any a in (1..#load) : (
                for any b in (1..#invoke) : (
                  @invoke[b] > @load[a] and @invoke[b] < @load[a]+256
                )
              )
            )
        }
