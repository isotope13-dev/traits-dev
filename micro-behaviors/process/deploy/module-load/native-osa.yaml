defaults:
  platforms: [macos]
  for: [macho]
traits:
  # Reverse-engineered native OSA host sequence: AECreateDesc(buffer,length),
  # OSALoad(descriptor,&scriptID), AEDisposeDesc, wipe buffer, then OSAExecute
  # (scriptID,&resultID). Match the complete ABI sequence, not hashed API IDs.
  # The long wipe and descriptor-to-ID handoff distinguish a bare call table.
  - id: native-osa-load-wipe-execute
    desc: Native script load, wipe, execute sequence
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        rule native_osa_load_wipe_execute {
          strings:
            $sequence = { 48 8D 8D ?? ?? ?? ?? 89 C7 48 89 DE 4C 89 F2 41 FF D4 66 85 C0 74 ?? [0-40] C7 45 ?? 00 00 00 00 [0-32] 4C 89 FF 4C 89 EE 31 D2 FF 15 ?? ?? ?? ?? [0-8] 4C 89 EF FF 15 ?? ?? ?? ?? [0-48] 42 C6 04 23 00 42 C6 44 23 01 00 [0-160] 8B 75 ?? 4C 8D 85 ?? ?? ?? ?? 4C 89 FF 31 D2 31 C9 FF 15 ?? ?? ?? ?? }
          condition:
            $sequence
        }
