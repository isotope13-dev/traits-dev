# HTTP bytes are bound to loading and invocation; legitimate plugin hosts exist.
defaults:
  for:
  - csharp
  platforms:
  - windows
  attack: T1105,T1620
  mbc: E1620
composite_rules:
- id: csharp-httpclient-bytes-assembly-invoke
  desc: C# loads HttpClient bytes as assembly and invokes
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/get::getbytearrayasync
  - id: micro-behaviors/metaprogramming/reflection/inspect/class::csharp-assembly-load-reflected-invoke
  - id: micro-behaviors/os/module/load::http-assembly-method-invocation
  near_bytes: 1024
