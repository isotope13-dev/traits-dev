defaults:
  platforms: [macos]
  for: [c, cpp]

traits:
  - id: macho-linked-module-symbol-call
    desc: In-memory Mach-O module symbol called indirectly
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: c
      query: |
        ((_
          (declaration declarator: (init_declarator
            value: (call_expression function: (identifier) @create
              arguments: (argument_list (_) (_) (pointer_expression argument: (identifier) @image)))))
          (declaration declarator: (init_declarator
            declarator: (pointer_declarator declarator: (identifier) @module)
            value: (call_expression function: (identifier) @link
              arguments: (argument_list (identifier) @linked_image))))
          (declaration declarator: (init_declarator
            declarator: (pointer_declarator declarator: (identifier) @symbol)
            value: (call_expression function: (identifier) @lookup
              arguments: (argument_list (identifier) @lookup_module))))
          (declaration declarator: (init_declarator
            declarator: (pointer_declarator declarator: (identifier) @address)
            value: (call_expression function: (identifier) @resolve
              arguments: (argument_list (identifier) @resolved_symbol))))
          (declaration declarator: (init_declarator
            declarator: (function_declarator
              declarator: (parenthesized_declarator
                (pointer_declarator declarator: (identifier) @entry)))
            value: (cast_expression value: (identifier) @entry_address)))
          (expression_statement (call_expression function: (identifier) @invoked)))
          (#match? @create "^NSCreateObjectFileImageFromMemory(_func)?$")
          (#match? @link "^NSLinkModule(_func)?$")
          (#match? @lookup "^NSLookupSymbolInModule(_func)?$")
          (#match? @resolve "^NSAddressOfSymbol(_func)?$")
          (#eq? @image @linked_image)
          (#eq? @module @lookup_module)
          (#eq? @symbol @resolved_symbol)
          (#eq? @address @entry_address)
          (#eq? @entry @invoked))
