defaults:
  platforms: [windows]
  for: [c, cpp]
traits:
  - id: http-coff-rwx-symbol-entry-call
    desc: HTTP object feeds RWX symbol-entry loader
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((translation_unit
          (function_definition
            declarator: (function_declarator declarator: (identifier) @loader
              parameters: (parameter_list . (parameter_declaration
                declarator: (pointer_declarator declarator: (identifier) @object))))
            body: (compound_statement
              (declaration declarator: (init_declarator
                declarator: (pointer_declarator declarator: (identifier) @mapped)
                value: (call_expression function: (identifier) @alloc
                  arguments: (argument_list (_) (_) (_) (identifier) @protection))))
              (for_statement body: (compound_statement
                (expression_statement (call_expression function: (identifier) @copy
                  arguments: (argument_list
                    (binary_expression left: (identifier) @copy_dest)
                    (binary_expression left: (identifier) @copy_source) (_))))))
              (declaration declarator: (init_declarator declarator: (identifier) @entry
                value: (cast_expression value: (call_expression
                  function: (identifier) @lookup arguments: (argument_list
                    . (identifier) @lookup_image (_)* (string_literal))))))
              (if_statement condition: (parenthesized_expression (identifier) @guard)
                consequence: (expression_statement (call_expression
                  function: (identifier) @invoked arguments: (argument_list) @args)))))
          (function_definition body: (compound_statement
            (declaration declarator: (init_declarator
              declarator: (pointer_declarator declarator: (identifier) @download)
              value: (call_expression function: (identifier) @get)))
            (expression_statement (call_expression function: (identifier) @loader_call
              arguments: (argument_list . (identifier) @passed)))))) @chain
          (#eq? @alloc "VirtualAlloc") (#eq? @protection "PAGE_EXECUTE_READWRITE")
          (#eq? @copy "memcpy") (#eq? @mapped @copy_dest)
          (#eq? @object @copy_source) (#eq? @mapped @lookup_image)
          (#match? @lookup "^(resolve|lookup)_coff_symbol$")
          (#eq? @entry @guard) (#eq? @entry @invoked) (#eq? @args "()")
          (#eq? @get "http_get_bytes") (#eq? @download @passed)
          (#eq? @loader @loader_call))
