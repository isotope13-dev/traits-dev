# Bind the HTTP helper's return value to the compiled executor's parameter.
# Generic call provenance cannot follow the to_thread callback and the two
# async helper boundaries, so use their syntax and identifier relationships.
# This is a neutral deployment capability, also usable by plugin hosts.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98
traits:
  - id: python-http-helper-compiled-exec
    desc: HTTP body passed to compiled Python helper
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (function_definition
            name: (identifier) @fetch
            parameters: (parameters . (identifier) @url .)
            body: (block . (return_statement
              (attribute
                object: (parenthesized_expression (await (call
                  function: (attribute object: (identifier) @asyncio
                    attribute: (identifier) @thread)
                  arguments: (argument_list
                    . (attribute object: (identifier) @client
                        attribute: (identifier) @get)
                    . (identifier) @requested))))
                attribute: (identifier) @body)) .))
          (function_definition
            name: (identifier) @executor
            parameters: (parameters . (identifier) @parameter .)
            body: (block . (expression_statement (call
              function: (identifier) @exec
              arguments: (argument_list . (call
                function: (identifier) @compile
                arguments: (argument_list
                  . (identifier) @compiled . (string) . (string) @mode))))) .))
          (function_definition
            body: (block
              (expression_statement (assignment
                left: (identifier) @received
                right: (await (call function: (identifier) @fetch_call))))
              . (expression_statement (await (call
                function: (identifier) @exec_call
                arguments: (argument_list . (identifier) @submitted .)))))))
          (#eq? @asyncio "asyncio")
          (#eq? @thread "to_thread")
          (#match? @client "^(requests|httpx)$")
          (#eq? @get "get")
          (#eq? @body "text")
          (#eq? @url @requested)
          (#eq? @exec "exec")
          (#eq? @compile "compile")
          (#match? @mode "^['\"]exec['\"]$")
          (#eq? @parameter @compiled)
          (#eq? @fetch @fetch_call)
          (#eq? @executor @exec_call)
          (#eq? @received @submitted))
    unless:
      - id: metadata/lang/source/origin::heuristic-quoted-source
