defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  crit: notable
traits:
- id: powershell-webclient-download-eval-text
  desc: PowerShell evaluates WebClient DownloadString
  conf: 0.97
  attack: T1059.001
  size_min: 512
  size_max: 50000000
  if:
    type: text
    regex: (?i)(iex|invoke-expression)\s*\( *new-object +net\.webclient\)\.downloadstring\(
- id: powershell-downloadstring-call
  desc: Downloads a string via WebClient DownloadString
  conf: 0.9
  platforms:
  - windows
  - unix
  for:
  - powershell
  if:
    type: symbol
    kind: call
    exact: DownloadString
composite_rules:
- id: powershell-downloadstring-iex
  desc: IEX consumes a DownloadString result
  conf: 0.95
  platforms:
  - windows
  - unix
  for:
  - powershell
  near_lines: 3
  all:
  - id: powershell-downloadstring-call
  - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call
- id: powershell-loopback-download-eval-command
  desc: Loopback PowerShell download/eval launch text
  conf: 0.97
  size_min: 512
  size_max: 50000000
  near_bytes: 256
  all:
  - id: powershell-webclient-download-eval-text
  - id: micro-behaviors/communications/http/client/managed::loopback-downloadstring-url
  any:
  - id: metadata/lang/source/syntax/command::encoded-command-line
  - id: micro-behaviors/process/create/flags::execution-policy-bypass-abbrev-flag
