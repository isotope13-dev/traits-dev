defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

composite_rules:
  - id: fetch-and-promise-eval-nearby
    desc: JavaScript fetch call near an eval promise callback
    near_lines: 3
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/process/interpreter/eval/indirect::js-promise-eval-callback
