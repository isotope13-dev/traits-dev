# Bind a binary file read, text conversion, captured substring, Base64 decode
# and evaluator in the same block. This does not establish the file's format
# or the decoded program's intent; those need independent evidence.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-binary-file-capture-base64-eval
    desc: Evaluates Base64 captured from binary file
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator name: (identifier) @file
            value: (call_expression function: (member_expression
              property: (property_identifier) @read))))
          (lexical_declaration (variable_declarator name: (identifier) @text
            value: (call_expression function: (member_expression
              object: (identifier) @file_used property: (property_identifier) @convert)
              arguments: (arguments (string (string_fragment) @binary)))))
          (lexical_declaration (variable_declarator name: (identifier) @captured
            value: (call_expression function: (member_expression
              object: (identifier) @text_used property: (property_identifier) @match))))
          (if_statement consequence: (statement_block
            (lexical_declaration (variable_declarator name: (identifier) @decoded
              value: (call_expression function: (member_expression
                object: (call_expression function: (member_expression
                  object: (identifier) @buffer property: (property_identifier) @from)
                  arguments: (arguments
                    . (subscript_expression object: (identifier) @captured_used index: (number) @one)
                    . (string (string_fragment) @encoding)))
                property: (property_identifier) @stringify))))
            (expression_statement (call_expression function: (identifier) @eval
              arguments: (arguments . (identifier) @decoded_used .))))))
          (#eq? @read "readFileSync") (#eq? @file @file_used)
          (#eq? @convert "toString") (#match? @binary "^(binary|latin1)$")
          (#eq? @text @text_used) (#eq? @match "match")
          (#eq? @captured @captured_used) (#eq? @one "1")
          (#eq? @buffer "Buffer") (#eq? @from "from") (#eq? @encoding "base64")
          (#eq? @stringify "toString") (#eq? @eval "eval") (#eq? @decoded @decoded_used))
