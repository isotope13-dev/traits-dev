defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-source-file-written
    desc: Writes a Python source file
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\.py["''][\s\S]{0,200}open[\s\S]{0,100}\.write'

  - id: python-importlib-exec-module
    desc: Runs a module through an importlib loader
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'importlib\.util\.spec_from_file_location.{0,400}module_from_spec.{0,300}exec_module'

composite_rules:
  - id: python-fetched-script-module-execution
    desc: Fetches Python source and executes it as a loaded module
    crit: suspicious
    conf: 0.96
    scope: archive
    for: [whl, python]
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen
      - id: python-source-file-written
      - id: python-importlib-exec-module

  - id: python-http-source-staging
    desc: Stages a Python file from an HTTP response
    crit: suspicious
    conf: 0.95
    scope: archive
    for: [whl, python]
    all:
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen
      - id: python-source-file-written
