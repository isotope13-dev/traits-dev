# Adjacent statements bind the saved and executed path; download-and-run alone is neutral.
traits:
- id: python-urlretrieve-interpreter-same-path
  desc: Downloads and interprets the same path
  crit: notable
  conf: 0.99
  for:
  - python
  platforms:
  - unix
  - windows
  if:
    type: tree-sitter
    query: |
      ([
        (module
          (expression_statement
            (call function: (attribute) @fetch
              arguments: (argument_list . (_) . [(identifier) (string)] @saved)))
          . (expression_statement
            (call function: (attribute) @launch
              arguments: (argument_list
                (list . (string) @interpreter . [(identifier) (string)] @executed)))))
        (block
          (expression_statement
            (call function: (attribute) @fetch
              arguments: (argument_list . (_) . [(identifier) (string)] @saved)))
          . (expression_statement
            (call function: (attribute) @launch
              arguments: (argument_list
                (list . (string) @interpreter . [(identifier) (string)] @executed)))))
      ] @flow
        (#eq? @fetch "urllib.request.urlretrieve")
        (#match? @launch "^subprocess\.(run|Popen|call|check_call)$")
        (#match? @interpreter "^[\"'](python[0-9.w]*|node|(ba)?sh)(\.exe)?[\"']$")
        (#eq? @saved @executed))
