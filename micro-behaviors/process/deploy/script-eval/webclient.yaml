traits:
- platforms:
  - windows
  attack: T1059.001,T1105
  id: embedded-powershell-webclient-script-eval
  desc: Embedded IEX DownloadString command text
  crit: notable
  conf: 0.96
  for:
  - javascript
  - html
  - powershell
  - vbs
  - batch
  if:
    type: literal
    regex: (?i)IEX\s*\(\s*\(?\s*New-Object\s+Net\.WebClient\s*\)?\.DownloadString\s*\(
  unless:
  - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
  - id: metadata/package/testing/corpus/
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: metadata/file/extension/identity::markdown-powershell-basename
  - id: well-known/tool/offensive/pwn/
  - id: well-known/tool/offensive/bloodhound/
