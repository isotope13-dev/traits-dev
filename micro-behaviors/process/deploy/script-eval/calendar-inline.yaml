defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: published-calendar-eval
    desc: Evaluates a fetched published calendar response
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: shell
      query: |
        (command name: (command_name (word) @eval)
          . argument: (string
            . (command_substitution
              . (command name: (command_name (word) @curl)
                . argument: (word) @flags
                . argument: [(word) (raw_string) (string (string_content))] @url .)
              .) .) .
          (#eq? @eval "eval") (#eq? @curl "curl")
          (#match? @flags "^-[fsSL]+$")
          (#match? @url "^['\"]?https?://([a-z0-9-]+\\.)?caldav\\.icloud\\.com/published/"))
