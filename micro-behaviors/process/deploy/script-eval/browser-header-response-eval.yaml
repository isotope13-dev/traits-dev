# Browser headers and evaluation of an HTTP response are useful capabilities,
# including in legitimate loaders. Neither establishes a masked dropper.
# Require a response-related evaluator, rather than an arbitrary nearby eval.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python]

composite_rules:
  - id: browser-headers-near-response-eval
    desc: Browser HTTP headers near response evaluation
    crit: notable
    conf: 0.96
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/header/accept::script-client-browser-header-pair
    any:
      - id: micro-behaviors/process/interpreter/eval/direct::js-eval-response-text
      - id: micro-behaviors/communications/http/response::http-response-data-eval
      - id: micro-behaviors/process/deploy/script-eval::python-urllib-body-value-exec
      - id: micro-behaviors/process/deploy/script-eval::python-urllib-response-exec
