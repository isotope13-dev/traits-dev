# A browser script element acquires source and activates it in the page's
# interpreter; it does not create an operating-system process.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, php, binaries]
  crit: notable
  conf: 0.88

traits:
  - id: massed-remote-script-tags
    desc: Massed back-to-back remote script tags
    conf: 0.9
    # Counts adjacent remote script elements, including distinct dependencies.
    # Neither volume nor async loading establishes unauthorized injection,
    # identical URLs, obfuscation, or a malicious payload.
    for: [html]
    count_min: 50
    if:
      type: text
      case_insensitive: true
      exclude_html_comments: true
      # This spelling recognizes src-first elements; attribute order carries
      # no intent claim.
      regex: '</script>\s*<script\s+src=[''"]?https?://'
composite_rules:
  # A variable-built element fed a concatenated source: the concealed
  # remote-element injection shape. Either half occurs in ordinary dynamic
  # UI code, so the pairing stays suspicious.
  - id: concealed-script-element-load
    desc: Variable-built element with concatenated src
    crit: suspicious
    conf: 0.88
    for: [html, javascript]
    near_bytes: 512
    all:
      - id: micro-behaviors/data/collection/dom::variable-tag-createelement
      - id: micro-behaviors/data/property/assign::concatenated-src-assignment
  # An HTA that moves itself off-desktop while building its element from
  # fragments: trusted-application hiding plus concealed injection. The
  # filename leg has no position, so this pairs by file co-occurrence.
  - id: hta-hidden-window-element-load
    desc: HTA hides window and loads concealed element
    crit: suspicious
    conf: 0.88
    for: [html]
    all:
      - id: metadata/file/extension/identity::hta-html-application-extension
      - id: micro-behaviors/ui/window/control::window-moveto-large-coordinate
      - id: micro-behaviors/data/collection/dom::variable-tag-createelement
