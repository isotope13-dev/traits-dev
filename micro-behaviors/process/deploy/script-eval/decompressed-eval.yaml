defaults:
  for:
  - scripts
  platforms:
  - linux
  - macos
  - windows
  crit: notable
traits:
- id: decompressed-script-evaluation
  desc: Evaluates a decompression call result
  crit: notable
  if:
    type: text
    # A hash comment, backtick example, regex literal or quoted string
    # (`exec(zlib.decompress(`) is not an executable call.
    regex: '(?m)^[^#\n`]{0,400}(exec|eval)\s*\(.{0,80}decompress\s*\('
  not:
  - regex: '(?i)^\s*(//|#|/\*|\*|--)'
  - regex: '(?i)[''"`/]\s*(exec|eval)\s*\('
  - regex: '(?i)\.\s*(exec|eval)\s*\('
  unless:
  - id: micro-behaviors/metaprogramming/generation::python-execution-template-generator
- id: python-exec-zlib-marshal-chain
  desc: Executes nested zlib and marshal deserialization
  crit: notable
  conf: 0.97
  for: [python]
  if:
    type: tree-sitter
    query: |
      ((call function: (identifier) @exec
        arguments: (argument_list (call
          function: (attribute object: (identifier) @marshal
            attribute: (identifier) @loads)
          arguments: (argument_list (call
            function: (attribute object: (identifier) @zlib
              attribute: (identifier) @decompress)))))) @chain
        (#eq? @exec "exec")
        (#eq? @marshal "marshal") (#eq? @loads "loads")
        (#eq? @zlib "zlib") (#eq? @decompress "decompress"))
- id: json-exec-decompressed-base64-expression
  desc: JSON string evaluates decompressed Base64 code
  crit: notable
  conf: 0.96
  for: [json]
  if:
    type: text
    regex: '(?i)\b(exec|eval)\s*\(\s*(gzip|zlib|bz2|lzma)\.decompress\s*\(\s*(base64\.)?b64decode\s*\('
  unless:
  - id: metadata/package/documentation/security-advisory::osv-advisory-report-structure
  - id: metadata/package/documentation/security-advisory::json-ghsa-poc-advisory-context
  - id: metadata/package/testing/corpus/
