defaults:
  for:
  - scripts
  platforms:
  - linux
  - macos
  - windows
  crit: notable
traits:
- id: decompressed-script-evaluation
  desc: Evaluates a decompression call result
  crit: notable
  if:
    type: text
    regex: \b(eval|exec)\s*\(.{0,80}decompress\s*\(
  unless:
  - id: micro-behaviors/metaprogramming/generation::python-execution-template-generator
- id: python-exec-zlib-marshal-chain
  desc: Executes nested zlib and marshal deserialization
  crit: notable
  conf: 0.97
  for: [python]
  if:
    type: tree-sitter
    query: |
      ((call function: (identifier) @exec
        arguments: (argument_list (call
          function: (attribute object: (identifier) @marshal
            attribute: (identifier) @loads)
          arguments: (argument_list (call
            function: (attribute object: (identifier) @zlib
              attribute: (identifier) @decompress)))))) @chain
        (#eq? @exec "exec")
        (#eq? @marshal "marshal") (#eq? @loads "loads")
        (#eq? @zlib "zlib") (#eq? @decompress "decompress"))
