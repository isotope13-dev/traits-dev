# Download-and-evaluate is also used by ordinary installers. Neither this
# chain nor a PowerShell launcher alone establishes attacker control.
defaults:
  for: [batch]
  platforms: [windows]
traits:
- id: batch-powershell-long-irm-iex
  desc: Batch PowerShell command pipes irm to iex
  crit: notable
  conf: 0.93
  attack: T1059.001
  if:
    type: text
    regex: '(?i)powershell\b.{0,500}\birm\b[^\r\n|]{0,240}\|\s*iex\b'
composite_rules:
- id: batch-powershell-irm-iex
  desc: Batch runs a remote script via irm
  crit: notable
  conf: 0.97
  attack: T1059.001,T1105
  all:
  - id: micro-behaviors/process/deploy/script-eval::embedded-irm-iex-pipeline
  - id: batch-powershell-long-irm-iex
