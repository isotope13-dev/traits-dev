defaults:
  platforms:
  - windows
  - unix
  for:
  - python
traits:
- id: python-offset-powershell-command-argument
  desc: Python launches offset-encoded PowerShell text
  crit: notable
  conf: 0.97
  if:
    type: tree-sitter
    # Tree-sitter permits intervening siblings without an explicit wildcard.
    # Repeating (_) here needlessly enumerated every option-list prefix.
    query: |
      ((module
        (expression_statement
          (assignment left: (identifier) @stage
            right: (string (string_content) @payload)))
        . (expression_statement
          (call
            function: (attribute object: (identifier) @module
              attribute: (identifier) @method)
            arguments: (argument_list .
              (list . (string (string_content) @exe)
                (string (string_content) @option)
                . (identifier) @used))))) @evidence
        (#eq? @stage @used)
        (#eq? @module "subprocess")
        (#any-of? @method "run" "call" "Popen" "check_call")
        (#match? @exe "(?i)^(powershell|pwsh)(\\.exe)?$")
        (#match? @option "(?i)^-command$")
        (#match? @payload "@\\(\\s*-[0-9]+\\s*,\\s*-[0-9]+")
        (#match? @payload "(?i)\\[char\\]\\s*\\([^\\n]*\\$[A-Za-z_][A-Za-z_0-9]*\\[[^\\]\\n]+\\]\\s*[+-]")
        (#match? @payload "(?i)\\[scriptblock\\]::\\s*Create\\(\\s*\\$\\w+\\s*\\)\\s*\\.Invoke\\("))
