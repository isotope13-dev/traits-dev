# MSHTA fetches and interprets its URL operand. This is a neutral configured
# acquisition-to-activation chain; automatic activation is a separate claim.
defaults:
  platforms: [windows]
  for: [json]
  crit: notable
  conf: 0.98

traits:
  - id: vscode-task-mshta-remote-url
    desc: Task invokes MSHTA with HTTP source
    if:
      type: value
      path: tasks[*].command
      regex: (?i)^\s*mshta(\.exe)?\s+https?://

  # Each match is one serialized task, rather than a file-wide conjunction
  # that can borrow a folderOpen trigger from an unrelated build task.
  - id: vscode-mshta-folder-open-command-first
    desc: Remote MSHTA task precedes folderOpen trigger
    if:
      type: value
      path: tasks[*]
      regex: '"command":"mshta(\.exe)?\s+https?://[^"]*".*"runOptions":\{"runOn":"folderOpen"'
      case_insensitive: true

  - id: vscode-mshta-folder-open-trigger-first
    desc: FolderOpen task precedes remote MSHTA command
    if:
      type: value
      path: tasks[*]
      regex: '"runOptions":\{"runOn":"folderOpen"\}.*"command":"mshta(\.exe)?\s+https?://'
      case_insensitive: true
