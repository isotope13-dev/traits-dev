defaults:
  crit: notable
  platforms:
  - unix
  for:
  - shell
traits:
- id: powershell-webrequest-iex-command-literal
  desc: Command literal pipes PowerShell download to IEX
  crit: notable
  conf: 0.92
  for:
  - scripts,-powershell,-batch,-shell,-python
  attack: T1059.001
  if:
    type: literal
    regex: (?i)(iwr|irm|Invoke-(WebRequest|RestMethod))\b.{0,160}\\?\|\s*(iex|Invoke-Expression)\b
    exclude_docstrings: true
- id: powershell-webrequest-iex-script-text
  desc: Script text contains download-to-IEX pipeline
  crit: notable
  conf: 0.92
  for:
  - powershell
  - batch
  - shell
  attack: T1059.001
  if:
    type: text
    regex: (?i)(iwr|irm|Invoke-(WebRequest|RestMethod))\b.{0,160}\\?\|\s*(iex|Invoke-Expression)\b
  platforms:
  - windows
  - unix
- id: powershell-webrequest-iex-document-text
  desc: Document text contains download-to-IEX pipeline
  crit: notable
  conf: 0.92
  for:
  - markdown
  - html
  attack: T1059.001
  if:
    type: text
    regex: (?i)(iwr|irm|Invoke-(WebRequest|RestMethod))\b.{0,160}\\?\|\s*(iex|Invoke-Expression)\b
    exclude_html_comments: true
- id: powershell-downloadstring-iex-inline
  desc: PowerShell evaluator near DownloadString call
  crit: notable
  conf: 0.92
  for:
  - scripts
  - source
  - markdown
  - html
  - text
  - data
  attack: T1059.001
  if:
    type: text
    regex: (?i)(iex|Invoke-Expression)[^\r\n]{0,40}DownloadString\s*\(
composite_rules:
- id: agent-skill-powershell-pipe-install-documentation
  desc: Agent skill documents web download piped to IEX
  for:
  - markdown
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.93
  all:
  - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: micro-behaviors/process/deploy/script-eval::powershell-webrequest-to-iex-pipeline
- id: powershell-webrequest-to-iex-pipeline
  desc: PowerShell download-to-IEX command text
  crit: notable
  conf: 0.92
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - markdown
  - html
  any:
  - id: powershell-webrequest-iex-command-literal
  - id: powershell-webrequest-iex-document-text
  - id: powershell-webrequest-iex-script-text
