# Ruby eval whose argument the flow graph traces to a get/open/read call
# result. Receiver identity is not retained: an HTTP import elsewhere does
# not establish that this value came from the network.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  attack: T1059,T1105

traits:
  - id: ruby-eval-of-read-call-result
    desc: Ruby eval of a get/open/read call result
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: eval
      arg:
        from:
          call: '^(get|get_response|open|read)$'
