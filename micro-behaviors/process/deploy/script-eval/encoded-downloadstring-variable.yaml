# Bind the conventional $script result variable at both adjacent statements.
# This deliberately covers this common spelling, rather than claiming a
# general data-flow analysis for arbitrary PowerShell variable names.
# Base64 transport alone is not suspicious; feeding fetched text into the
# interpreter crosses the network-to-code boundary even for legitimate tools.
defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: encoded-downloadstring-script-variable-eval
    desc: Encoded DownloadString result passed to IEX
    crit: suspicious
    conf: 0.96
    attack: T1059.001,T1105
    if:
      type: encoded
      encoding: base64
      regex: '(?im)^\$script *= *\$\w+\.DownloadString\([^)]+\)\s*Invoke-Expression +\$script$'
