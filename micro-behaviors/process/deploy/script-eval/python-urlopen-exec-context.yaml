defaults:
  platforms: [windows, unix]
  for: [python]
traits:
- id: urlopen-before-exec
  desc: urlopen precedes exec within 900 bytes
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: urlopen\s*\(.{0,120}\)[\s\S]{0,900}\bexec\s*\(
  unless:
  - id: micro-behaviors/process/deploy/script-eval::python-urllib-response-exec
  - id: metadata/package/testing/
  - id: "metadata/file/naming::test-directory-component"
