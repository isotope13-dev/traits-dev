# Explicit transaction-response to evaluator flow. Dynamic delivery alone
# does not establish concealment or malicious intent.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: http-transaction-hex-eval-flow
  desc: HTTP transaction hex-decoding feeds eval
  crit: notable
  conf: 0.99
  if:
    type: tree-sitter
    query: "(statement_block\n  (lexical_declaration\n    (variable_declarator name: (identifier) @response\n\
      \      value: (await_expression\n        (call_expression function: (identifier) @fetch\n      \
      \    arguments: (arguments (string (string_fragment) @url)\n            (object (pair key: (property_identifier)\
      \ @body value: (call_expression\n              function: (member_expression object: (identifier)\
      \ @json\n                property: (property_identifier) @stringify)\n              arguments: (arguments\
      \ (object (pair\n                key: (property_identifier) @method\n                value: (string\
      \ (string_fragment) @rpc))))))))))))\n  (lexical_declaration\n    (variable_declarator name: (identifier)\
      \ @tx\n      value: (member_expression object: (parenthesized_expression\n        (await_expression\
      \ (call_expression function: (member_expression\n          object: (identifier) @response_read\n\
      \          property: (property_identifier) @json_read))))\n        property: (property_identifier)\
      \ @result)))\n  (lexical_declaration\n    (variable_declarator name: (identifier) @code\n      value:\
      \ (call_expression function: (member_expression\n        object: (call_expression function: (member_expression\n\
      \          object: (identifier) @buffer property: (property_identifier) @from)\n          arguments:\
      \ (arguments\n            (call_expression function: (member_expression\n              object: (member_expression\
      \ object: (identifier) @tx_read\n                property: (property_identifier) @input)\n     \
      \         property: (property_identifier) @slice))\n            (string (string_fragment) @encoding)))\n\
      \        property: (property_identifier) @to_string)) ))\n  (expression_statement (call_expression\
      \ function: (identifier) @eval\n    arguments: (arguments (identifier) @evaluated)))\n  (#eq? @fetch\
      \ \"fetch\")\n  (#match? @url \"^https?://\")\n  (#eq? @json \"JSON\")\n  (#eq? @stringify \"stringify\"\
      )\n  (#eq? @method \"method\")\n  (#eq? @rpc \"eth_getTransactionByHash\")\n  (#eq? @response @response_read)\n\
      \  (#eq? @json_read \"json\")\n  (#eq? @result \"result\")\n  (#eq? @tx @tx_read)\n  (#eq? @input\
      \ \"input\")\n  (#match? @slice \"^(slice|substring)$\")\n  (#eq? @buffer \"Buffer\")\n  (#eq? @from\
      \ \"from\")\n  (#eq? @encoding \"hex\")\n  (#eq? @to_string \"toString\")\n  (#eq? @eval \"eval\"\
      )\n  (#eq? @code @evaluated)) @chain\n"
