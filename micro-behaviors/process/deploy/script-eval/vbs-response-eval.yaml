# VBScript running the text body of an HTTP response as code: either
# ExecuteGlobal/Execute applied to `obj.responseText` directly, or the body
# assigned to a variable that the very next statements hand to ExecuteGlobal.
# Neutral chain: an ordinary self-updating script has the same shape.
defaults:
  platforms: [windows]
  for: [vbs, asp]
  attack: T1059.005,T1105

traits:
  - id: vbs-execute-response-text-direct
    desc: Executes HTTP responseText as VBScript
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^[^''\r\n]{0,200}\bExecute(Global)?\s*\(?\s*[A-Za-z_]\w*\.responseText\b'

composite_rules:
  - id: vbs-response-text-executeglobal
    desc: Runs fetched HTTP response as VBScript
    crit: notable
    conf: 0.92
    any:
      - id: vbs-execute-response-text-direct
      - id: vbs-response-text-then-executeglobal

  - id: vbs-response-text-then-executeglobal
    desc: Response body variable passed to ExecuteGlobal
    crit: notable
    conf: 0.88
    near_bytes: 300
    all:
      - id: micro-behaviors/communications/http/client/response-body::vbs-response-text-assignment
      - id: micro-behaviors/process/interpreter/eval/direct::executeglobal-variable
