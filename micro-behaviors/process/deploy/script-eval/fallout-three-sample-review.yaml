traits:
- id: php-eval-http-read-text
  desc: PHP eval text reads an HTTP URL
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: (?i)@?eval\s*\([^)]{0,80}file_get_contents\s*\(\s*["']https?://
- id: php-eval-uri-read-text
  desc: PHP eval reads URI or stream-wrapper text
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: '(?i)@?eval\s*\([^)]{0,40}file_get_contents\s*\(\s*["''](https?|ftp|php):'
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
