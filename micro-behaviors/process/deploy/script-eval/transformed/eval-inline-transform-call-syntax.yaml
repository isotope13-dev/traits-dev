defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
traits:
  - id: eval-inline-transform-call-syntax
    desc: Eval syntax wraps an inline transform function
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: eval\(\s*\(?\s*function\b
    unless:
      - id: objectives/anti-static/obfuscation/obfuscator/js-obfuscator::dean-edwards-packed-script
