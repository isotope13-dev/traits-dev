defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-decrypted-marshal-exec
    desc: Executes decrypted marshal code
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        index: 0
        from:
          call: '\.decrypt$'
          through:
            - call: '^marshal\.loads$'
              arguments: [0]
