defaults:
  platforms: [windows]
  for: [powershell, batch]
  crit: notable
  conf: 0.98
composite_rules:
  - id: powershell-decrypt-eval-cooccurrence
    desc: PowerShell decryption and eval APIs co-occur
    for: [powershell]
    conf: 0.9
    all:
      - id: micro-behaviors/crypto/decrypt/initialize::powershell-create-decryptor-call
    any:
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-text
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-iex-call
      - id: micro-behaviors/process/interpreter/eval/constructed::powershell-created-scriptblock-call
      - id: micro-behaviors/process/interpreter/eval/constructed::powershell-created-scriptblock-method-call
