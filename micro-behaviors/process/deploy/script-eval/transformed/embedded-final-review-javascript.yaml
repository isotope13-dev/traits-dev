defaults:
  for:
    - javascript
  platforms:
    - windows
composite_rules:
  - id: packed-table-decoder-indirect-eval-stage
    desc: Table decoder and indirect eval sink share one stage
    crit: suspicious
    conf: 0.95
    scope: file
    near_bytes: 2048
    all:
      - id: micro-behaviors/data/decode/custom::js-indexof-charat-lookup
      - id: micro-behaviors/data/control-flow/loop/counted::js-two-step-loop
      - id: micro-behaviors/process/interpreter/eval/indirect::js-indirect-eval-variable
    unless:
      - id: well-known/lib/web/authoring/google-closure-library::closure-compiled-global-eval
      - id: well-known/lib/web/authoring/google-closure-library::closure-library-copyright
