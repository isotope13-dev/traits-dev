defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
traits:
  # Text also covers a loader deliberately emitted as Python source code.
  - id: python-compiled-compressed-response-text
    desc: Compiles compressed response text for exec
    if:
      type: text
      regex: 'exec\(compile\(zlib\.decompress\(base64\.b64decode\(\w+\.text\)\)'
