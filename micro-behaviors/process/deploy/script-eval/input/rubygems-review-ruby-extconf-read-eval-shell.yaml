defaults:
  platforms: [unix, windows]
  for: [ruby]
composite_rules:
  - id: ruby-extconf-read-eval-shell
    desc: Ruby extension has read-eval and shell command clues
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: metadata/import/package::ruby-http-client-imports
      - id: micro-behaviors/process/deploy/script-eval/input::ruby-eval-of-read-call-result
      - id: micro-behaviors/os/package-manager/hook-install::extconf-shell-command
