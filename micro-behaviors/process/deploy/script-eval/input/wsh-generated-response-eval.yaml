# Text that a script writes out (WriteLine/echo) contains a VBScript
# `ExecuteGlobal <obj>.responseText` statement: the file being generated is
# itself a loader that runs an HTTP response body. Matches inside string
# literals on purpose; the direct statement form is covered separately.
defaults:
  platforms: [windows]
  for: [vbs, html, batch]
  attack: T1059.005

traits:
  - id: generated-executeglobal-response-text
    desc: Writes a line executing HTTP response text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(WriteLine|Write|echo)\b[^\r\n]{0,80}\bExecute(Global)?\s+[A-Za-z_]\w*\.responseText\b'
