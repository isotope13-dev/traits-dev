defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: hidden-powershell-getcontent-iex
    desc: Hidden PowerShell Get-Content IEX
    crit: suspicious
    conf: 0.95
    near_lines: 10
    all:
      - id: micro-behaviors/process/interpreter/eval/source::powershell-getcontent-piped-iex
      - id: micro-behaviors/process/create/command::start-process-call
      - id: micro-behaviors/process/create/hidden::start-process-windowstyle-hidden
      - id: metadata/file/profile/visibility::hidden-text-token
    downgrade:
      any:
        - id: well-known/app/media/maester/
        - id: well-known/app/infrastructure/microsoft-azure/azure-dev-cli/
