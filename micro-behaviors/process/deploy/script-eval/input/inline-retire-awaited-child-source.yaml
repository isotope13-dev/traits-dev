defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: awaited-source-node-inline-child
    desc: Awaited source appended to Node inline code
    crit: notable
    conf: 0.99
    # Bind the immutable awaited value to the child argument. An unrelated
    # eval in the block does not establish or invalidate this separate sink.
    if:
      type: tree-sitter
      query: |
        (statement_block
          (lexical_declaration "const"
            (variable_declarator name: (identifier) @source
              value: (await_expression)))
          (expression_statement
            [
             (call_expression function: (member_expression object:
              (call_expression function: (identifier) @spawn
                arguments: (arguments . (string (string_fragment) @runtime) .
                  (array . (string (string_fragment) @flag) .
                    (binary_expression operator: "+" right: (identifier) @child))))
              property: (property_identifier) @unref))
             (sequence_expression
              (call_expression function: (member_expression object:
                (call_expression function: (identifier) @spawn
                  arguments: (arguments . (string (string_fragment) @runtime) .
                    (array . (string (string_fragment) @flag) .
                      (binary_expression operator: "+" right: (identifier) @child))))
                property: (property_identifier) @unref)))
            ])
          (#eq? @spawn "spawn")
          (#eq? @runtime "node")
          (#eq? @flag "-e")
          (#eq? @unref "unref")
          (#eq? @source @child)) @transfer
