# Fixture suffixes are inert inputs to scanners. A directory alone is not
# enough: also require a reserved URL in the member's own content.
defaults:
  for: [javascript, shell]
  platforms: [unix, windows]

composite_rules:
  - id: reserved-url-source-fixture
    desc: Inert scanner fixture containing only .invalid HTTP URLs
    crit: exception
    unless:
      - id: micro-behaviors/communications/url/host/tld-http::http-url-outside-invalid-tld
    all:
      - id: metadata/path/development::suffixed-testdata-fixture-path
      - id: micro-behaviors/communications/url/host/tld-http::invalid-tld-url
