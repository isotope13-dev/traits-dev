defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: transaction-xor-node-inline-source
    desc: Transaction XOR output feeds Node eval
    crit: notable
    conf: 0.99
    size_max: 131072
    if:
      # Source-flow projections do not summarize this local await/Buffer/
      # atob/XOR closure. Bind its input parameter, accumulator and return to
      # the exact Node argv value, rather than co-occurring API strings.
      type: tree-sitter
      query: |
        ((try_statement body: (statement_block (lexical_declaration kind: "const" (variable_declarator name: (identifier) @payload
              value: (call_expression function: (parenthesized_expression (arrow_function parameters: (formal_parameters (identifier) @input)
                    body: (statement_block (lexical_declaration (variable_declarator name: (identifier) @accumulator
                          value: (string) @empty))
                      .
                      (for_statement initializer: (lexical_declaration (variable_declarator name: (identifier) @counter_init
                            value: (number) @zero))
                        condition: [
                        (binary_expression left: (identifier) @counter_test
                          operator: "<"
                          right: [
                          (_ object: (identifier) @input_length [
                          (property_identifier) @length
                          (string (string_fragment) @length)
                          ])
                          (parenthesized_expression (_ object: (identifier) @input_length [
                            (property_identifier) @length
                            (string (string_fragment) @length)
                            ]))
                          ])
                        (parenthesized_expression (binary_expression left: (identifier) @counter_test
                            operator: "<"
                            right: [
                            (_ object: (identifier) @input_length [
                            (property_identifier) @length
                            (string (string_fragment) @length)
                            ])
                            (parenthesized_expression (_ object: (identifier) @input_length [
                              (property_identifier) @length
                              (string (string_fragment) @length)
                              ]))
                            ]))
                        ]
                        increment: (update_expression argument: (identifier) @counter_inc
                          operator: "++")
                        body: (statement_block (expression_statement (augmented_assignment_expression left: (identifier) @acc_append
                              operator: "+="
                              right: (call_expression function: (_ object: _ [
                                (property_identifier) @fromchar
                                (string (string_fragment) @fromchar)
                                ])
                                arguments: (arguments [
                                  (binary_expression left: [
                                    (call_expression function: (_ object: (identifier) @input_char [
                                      (property_identifier) @charcode
                                      (string (string_fragment) @charcode)
                                      ])
                                      arguments: (arguments (identifier) @unit_index))
                                    (parenthesized_expression (call_expression function: (_ object: (identifier) @input_char [
                                        (property_identifier) @charcode
                                        (string (string_fragment) @charcode)
                                        ])
                                        arguments: (arguments (identifier) @unit_index)))
                                    ]
                                    operator: "^"
                                    right: (identifier) @key_unit)
                                  (parenthesized_expression (binary_expression left: [
                                      (call_expression function: (_ object: (identifier) @input_char [
                                        (property_identifier) @charcode
                                        (string (string_fragment) @charcode)
                                        ])
                                        arguments: (arguments (identifier) @unit_index))
                                      (parenthesized_expression (call_expression function: (_ object: (identifier) @input_char [
                                          (property_identifier) @charcode
                                          (string (string_fragment) @charcode)
                                          ])
                                          arguments: (arguments (identifier) @unit_index)))
                                      ]
                                      operator: "^"
                                      right: (identifier) @key_unit))
                                  ]))))
                          .))
                      .
                      (empty_statement)*
                      .
                      (return_statement (identifier) @acc_return)
                      .)))
                arguments: (arguments (call_expression function: (identifier) @base64
                    arguments: (arguments (subscript_expression object: (call_expression function: (_ object: (call_expression function: (_ object: (call_expression function: (_ object: [
                              (identifier) @buffer_name
                              (_ object: (identifier) [
                              (property_identifier) @buffer_name
                              (string (string_fragment) @buffer_name)
                              ])
                              ] [
                              (property_identifier) @from
                              (string (string_fragment) @from)
                              ])
                              arguments: (arguments (call_expression function: (_ object: (subscript_expression object: (parenthesized_expression (await_expression (call_expression function: (identifier) @request
                                          arguments: (arguments [
                                            (binary_expression left: (string (string_fragment) @tx_endpoint)
                                              operator: "+"
                                              right: (identifier) @transaction)
                                            (binary_expression left: (parenthesized_expression (binary_expression left: (string (string_fragment) @tx_endpoint)
                                                  operator: "+"
                                                  right: (identifier) @transaction))
                                              operator: "+"
                                              right: [
                                              (string)
                                              (parenthesized_expression (string))
                                              ])
                                            (parenthesized_expression (binary_expression left: (string (string_fragment) @tx_endpoint)
                                                operator: "+"
                                                right: (identifier) @transaction))
                                            (parenthesized_expression (binary_expression left: (parenthesized_expression (binary_expression left: (string (string_fragment) @tx_endpoint)
                                                    operator: "+"
                                                    right: (identifier) @transaction))
                                                operator: "+"
                                                right: [
                                                (string)
                                                (parenthesized_expression (string))
                                                ]))
                                            ]))))
                                    index: (string (string_fragment) @input_field)) [
                                  (property_identifier) @substring
                                  (string (string_fragment) @substring)
                                  ])
                                  arguments: (arguments (number) @two))
                                (string (string_fragment) @hex))) [
                            (property_identifier) @tostring
                            (string (string_fragment) @tostring)
                            ])
                            arguments: (arguments (string (string_fragment) @utf8))) [
                          (property_identifier) @split
                          (string (string_fragment) @split)
                          ])
                          arguments: (arguments (string (string_fragment) @separator)))
                        index: (number) @one)))))))
            (expression_statement (call_expression function: (_ object: (call_expression function: _
                  arguments: (arguments (string (string_fragment) @module))) [
                (property_identifier) @spawn @evidence
                (string (string_fragment) @spawn @evidence)
                ])
                arguments: (arguments (string (string_fragment) @runtime)
                  (array .
                    (string (string_fragment) @flag)
                    .
                    [
                    (identifier) @used
                    (binary_expression left: _
                      operator: "+"
                      right: (identifier) @used)
                    (parenthesized_expression (binary_expression left: _
                        operator: "+"
                        right: (identifier) @used))
                    ]))))))
        (#eq? @input @input_char)
        (#eq? @input @input_length)
        (#eq? @counter_init @unit_index)
        (#eq? @counter_init @counter_test)
        (#eq? @counter_init @counter_inc)
        (#eq? @accumulator @acc_append)
        (#eq? @accumulator @acc_return)
        (#eq? @payload @used)
        (#eq? @fromchar "fromCharCode")
        (#eq? @charcode "charCodeAt")
        (#eq? @length "length")
        (#eq? @input_field "input")
        (#eq? @substring "substring")
        (#eq? @buffer_name "Buffer")
        (#eq? @from "from")
        (#eq? @hex "hex")
        (#eq? @tostring "toString")
        (#eq? @utf8 "utf8")
        (#eq? @split "split")
        (#eq? @separator "..")
        (#eq? @base64 "atob")
        (#eq? @spawn "spawn")
        (#eq? @runtime "node")
        (#eq? @flag "-e")
        (#match? @empty "^['\"]['\"]$")
        (#match? @zero "^(0|0[xX]0+)$")
        (#match? @one "^(1|0[xX]0*1)$")
        (#match? @two "^(2|0[xX]0*2)$")
        (#match? @module "^(node:)?child_process$")
        (#match? @tx_endpoint "^https://api[.]binplorer[.]com/getTxInfo/")
        )
