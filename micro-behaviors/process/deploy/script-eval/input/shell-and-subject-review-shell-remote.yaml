defaults:
  platforms:
    - unix
  crit: suspicious
  for:
    - shell
traits:
  - id: shell-openssl-output-eval
    desc: Shell evaluates OpenSSL command output
    crit: suspicious
    conf: 0.8
    attack: T1059.004 - '*'
    for:
      - shell
      - macho
    if:
      type: text
      regex: eval\s*"\$\(openssl
composite_rules:
  - id: shell-command-substitution-eval
  # Bind the path to this member while reading package identity across files.
    downgrade:
      scope: archive
      all:
        - id: well-known/tool/detection/code-analysis/disclude::static-fixture-package-without-interpreter
        - type: path
          regex: '(^|[\\/])tests[\\/]fixtures[\\/]'
    desc: Shell command-substitution evaluation
    crit: suspicious
    conf: 0.9
    attack: T1059.004
    for:
      - shell
      - macho
    any:
  # Plain curl-to-eval is a neutral deployment capability, not C2 admission.
      - id: micro-behaviors/process/deploy/script-eval/network::eval-curl-backtick
      - id: micro-behaviors/process/deploy/script-eval/network::eval-wget-subshell
      - id: micro-behaviors/process/deploy/script-eval/network::eval-wget-backtick
      - id: micro-behaviors/process/deploy/script-eval/input::shell-openssl-output-eval
      - id: micro-behaviors/process/deploy/script-eval/network::curl-variable-eval
