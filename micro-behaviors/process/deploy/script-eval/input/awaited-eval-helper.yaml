defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  # Callback bodies are absent from the flow projection for this form.
  # A proximity composite cannot establish which value reaches both sinks.
  - id: awaited-source-eval-helper-reuse
    desc: Awaited source reused by eval and helper
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration "const"
            (variable_declarator name: (identifier) @source
              value: (await_expression (call_expression))))
          (if_statement consequence: (expression_statement
            (call_expression function: (identifier) @eval
              arguments: (arguments
                (binary_expression left: (identifier) @prefix
                  operator: "+"
                  right: (identifier) @evaluated)))))
          (expression_statement (await_expression
            (call_expression function: (identifier)
              arguments: (arguments
                (binary_expression left: (identifier) @helper_prefix
                  operator: "+"
                  right: (identifier) @forwarded)))))) @reuse
          (#eq? @eval "eval")
          (#eq? @source @evaluated) (#eq? @source @forwarded)
          (#eq? @prefix @helper_prefix))
