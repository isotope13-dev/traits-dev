defaults:
  platforms:
    - windows
    - unix
  for:
    - python
composite_rules:
  - id: inline-python-decoded-exec-loader
    desc: Inline Python decoded exec loader
    crit: suspicious
    conf: 0.94
    for:
      - shell
      - github-actions
    near_bytes: 1500
    all:
      - id: micro-behaviors/process/deploy/interpreter-command::python-inline-command
      - id: micro-behaviors/process/interpreter/eval/python-builtins::inline-python-exec-text
    any:
      - id: metadata/lang/source/syntax/member::inline-python-base64-decoder-reference
      - id: micro-behaviors/data/serialize/binary::inline-python-marshal-loads-text
      - id: micro-behaviors/data/decompress/zlib::inline-python-zlib-decompress-reference
