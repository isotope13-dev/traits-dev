---
defaults:
  crit: notable
  conf: 0.9
  platforms:
  - windows
  - unix
  for:
  - json
traits:
- id: vscode-task-pipes-powershell-eval
  desc: Task command pipes into PowerShell eval
  attack: T1059.001
  if:
    type: value
    path: tasks[*].command
    regex: "\\|\\s*(iex|invoke-expression)\\b"
    case_insensitive: true
