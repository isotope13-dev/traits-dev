defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  # Callback/async helper flow is incomplete for this form. Bind the const
  # awaited value to the immediately following eval sink without imposing
  # any requirement on a separate child process or helper call.
  - id: awaited-source-inline-eval
    desc: Awaited source appended to inline eval
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        (statement_block
          (lexical_declaration "const"
            (variable_declarator name: (identifier) @source
              value: (await_expression (call_expression))))
          . [
            (if_statement consequence: (expression_statement
              (call_expression function: (identifier) @eval
                arguments: (arguments . (binary_expression
                  left: (identifier) operator: "+"
                  right: (identifier) @evaluated) .))))
            (expression_statement (binary_expression operator: "||"
              right: (call_expression function: (identifier) @eval
                arguments: (arguments . (binary_expression
                  left: (identifier) operator: "+"
                  right: (identifier) @evaluated) .))))
          ] @evidence
          (#eq? @eval "eval")
          (#eq? @source @evaluated))
