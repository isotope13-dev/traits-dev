defaults:
  platforms:
    - windows
    - unix
  for:
    - python
composite_rules:
  - id: python-exec-shell-output-clues
    desc: Python exec near shell command output
    crit: suspicious
    conf: 0.97
    near_bytes: 512
    all:
      - id: micro-behaviors/process/interpreter/eval/python-builtins::exec-builtin
      - id: micro-behaviors/process/create/shell/command-string::getoutput-content
