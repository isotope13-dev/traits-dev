defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: deno-data-uri-command
    desc: Deno command with JavaScript data URI
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?is)\.deno\\bin\\deno\.exe.{0,80}-A.{0,120}data:application/javascript;base64,'
composite_rules:
  - id: deno-data-uri-runtime-command
    desc: Deno runtime and data URI command
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/fs/path/application/interpreter::deno-userprofile-runtime-path
      - id: micro-behaviors/process/deploy/script-eval/input::deno-data-uri-command
  - id: deno-runtime-acquisition-data-uri-exec
    desc: Deno acquisition and data URI execution
    crit: suspicious
    conf: 0.99
    all:
      - id: micro-behaviors/process/deploy/runtime::curl-tar-deno-runtime-acquisition
      - id: micro-behaviors/process/deploy/script-eval/input::deno-data-uri-command
