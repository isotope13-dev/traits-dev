defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
traits:
- id: interval-fetch-reply-field-eval
  desc: Interval helper evaluates fetch reply field
  crit: suspicious
  conf: 0.98
  if:
    type: tree-sitter
    query: |-
      ((program
        (function_declaration name: (identifier) @worker
          body: (statement_block (try_statement body:
      (statement_block
        (lexical_declaration
          (variable_declarator name: (identifier) @response value: (await_expression
            (call_expression function: (identifier) @fetch)))
          (variable_declarator name: (object_pattern
            (pair_pattern value: (identifier) @code))
            value: (await_expression (call_expression function: [
              (subscript_expression object: (identifier) @read)
              (member_expression object: (identifier) @read)]))))
        (if_statement consequence: (try_statement body: (statement_block
          (expression_statement (call_expression function: (identifier) @eval
            arguments: (arguments . (identifier) @executed .))))))))))
        (try_statement body: (statement_block
          (expression_statement (sequence_expression
            (call_expression function: (identifier) @initial)
            (call_expression function: (identifier) @timer
              arguments: (arguments . (arrow_function body: (statement_block
                (expression_statement (call_expression function: (identifier) @repeated))))
                . (number) .))))))) @operation
        (#eq? @fetch "fetch") (#eq? @response @read)
        (#eq? @eval "eval") (#eq? @code @executed)
        (#eq? @worker @initial) (#eq? @worker @repeated) (#eq? @timer "setInterval"))
