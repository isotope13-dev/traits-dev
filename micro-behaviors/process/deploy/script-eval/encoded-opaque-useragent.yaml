defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: base64-irm-opaque-useragent-pipeline
    desc: Decoded IRM-to-IEX opaque User-Agent pipeline
    crit: notable
    conf: 0.97
    # Command text may be inert; the objective consumer requires the outer
    # decoder's result to be passed to an evaluator as well.
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\birm\s[^|\r\n]{1,160}-UserAgent\s+["''][a-z]{80,256}["'']\s*\|\s*iex\b'
  - id: encoded-stage-webclient-constructor
    desc: Encoded source constructs a .NET WebClient
    crit: notable
    conf: 0.97
    if:
      type: encoded
      encoding: base64
      regex: '(?i)New-Object\s+System\.Net\.WebClient'
  - id: encoded-stage-opaque-useragent-value
    desc: Encoded source assigns a long opaque value
    crit: component
    conf: 0.97
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\$userAgent\s*=\s*["''][A-Za-z0-9]{80,256}["'']'
  - id: encoded-stage-useragent-header-use
    desc: Encoded source uses $userAgent as HTTP header
    crit: notable
    conf: 0.97
    if:
      type: encoded
      encoding: base64
      regex: '(?i)Headers\.Add\(\s*["'']User-Agent["'']\s*,\s*\$userAgent\s*\)'
  - id: encoded-stage-downloadstring-into-script
    desc: Encoded source assigns DownloadString to $script
    crit: notable
    conf: 0.97
    attack: T1105
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\$script\s*=\s*\$[A-Za-z_]\w*\.DownloadString\s*\(\s*\$[A-Za-z_]\w*\s*\)'
  - id: encoded-stage-iex-script-variable
    desc: Encoded source evaluates $script with IEX
    crit: notable
    conf: 0.97
    attack: T1059.001
    if:
      type: encoded
      encoding: base64
      regex: '(?i)Invoke-Expression\s+\$script\b'

composite_rules:
  - id: base64-webclient-opaque-useragent-source
    desc: Encoded stage fetches and evaluates response with opaque User-Agent
    crit: notable
    conf: 0.97
    all:
      - id: encoded-stage-webclient-constructor
      - id: encoded-stage-opaque-useragent-value
      - id: encoded-stage-useragent-header-use
      - id: encoded-stage-downloadstring-into-script
      - id: encoded-stage-iex-script-variable
    near_bytes: 1
