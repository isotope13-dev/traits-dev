defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: base64-irm-opaque-useragent-pipeline
    desc: Decoded IRM-to-IEX opaque User-Agent pipeline
    crit: notable
    conf: 0.97
    # Command text may be inert; the objective consumer requires the outer
    # decoder's result to be passed to an evaluator as well.
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\birm\s[^|\r\n]{1,160}-UserAgent\s+["''][a-z]{80,256}["'']\s*\|\s*iex\b'
