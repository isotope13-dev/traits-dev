# Rendering returned HTML and activating its scripts is dual-use. These atoms
# do not bind the response to the script sink, so name the co-occurrence only.
# An attack objective must independently require theft, deception or abuse.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]

composite_rules:
  - id: profiled-post-dom-script-sink
    desc: Browser profile, POST and DOM script assignment co-occur
    crit: notable
    conf: 0.98
    all:
      - id: metadata/lang/source/naming/interface::browser-router-profile-field-cluster
      - id: micro-behaviors/communications/http/post::xhr-post-open-send
      - id: micro-behaviors/communications/http/client/response-body::response-text
      - id: micro-behaviors/process/deploy/script-eval::dom-script-text-body-assign
    near_bytes: 4800
