defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
composite_rules:
- id: function-require-streamed-data
  desc: Require-enabled Function receives response data
  crit: suspicious
  conf: 0.99
  near_bytes: 360
  all:
  - id: micro-behaviors/process/interpreter/eval/constructed::new-function-iife
  - id: micro-behaviors/metaprogramming/generation/function::js-function-constructor-require-parameter
  - id: micro-behaviors/data/string/conversion::tostring-call
  any:
  - id: micro-behaviors/communications/http/response::node-http-get-data-handler
  - id: metadata/lang/source/syntax/call/member::node-data-event-call-text
# A Node http(s).get call, a read of its streamed reply and a Function
# constructor that names `require` as a parameter, all within one callback-
# sized window. How the chunks are collected (data events or async
# iteration) and whether the function is invoked inline or stored do not
# matter. Proximity, not proven data flow, ties the reply to the body.
- id: http-get-reply-require-function
  desc: HTTP GET reply compiled with require access
  crit: suspicious
  conf: 0.97
  attack: T1059.007,T1105
  near_bytes: 512
  all:
  - id: micro-behaviors/metaprogramming/generation/function::js-function-constructor-require-parameter
  - id: micro-behaviors/data/stream/read::js-stream-chunk-read
  any:
  - id: micro-behaviors/communications/http/request/get::node-http-client-get
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/communications/http/request/inline::node-require-https-inline-get
- id: request-callback-body-function
  desc: Request callback body becomes Function
  crit: suspicious
  conf: 0.97
  near_bytes: 360
  all:
  - id: micro-behaviors/data/control-flow/dispatch/callback::request-callback-b-param
  - id: micro-behaviors/metaprogramming/generation/function::function-constructor-require-b
