defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
traits:
  - id: powershell-inline-downloadstring-eval
    desc: Evaluates inline DownloadString expression
    conf: 0.98
    if:
      # Decoded commands have text evidence but no source AST. Parentheses
      # can immediately follow IEX, as in iex((New-Object ...).DownloadString()).
      type: text
      exclude_comments: true
      regex: '(?i)\b(iex|Invoke-Expression)\s*[^;\r\n]{0,100}\.DownloadString\s*\('
