defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
traits:
  - id: powershell-inline-downloadstring-eval
    desc: Evaluates inline DownloadString expression
    conf: 0.98
    if:
      type: tree-sitter
      node: command
      regex: '(?i)^(iex|Invoke-Expression)\s+[^\r\n]{0,100}\.DownloadString\s*\('
