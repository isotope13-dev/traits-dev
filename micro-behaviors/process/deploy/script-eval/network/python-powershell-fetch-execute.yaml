# Neutral capability atoms for a program that invokes PowerShell with hidden
# execution settings. Intent is supplied by objective composites.
defaults:
  crit: notable
  platforms: [windows]
  for: [pe, pyc, powershell, python]

composite_rules:
  - id: python-powershell-fetch-execute
    desc: PowerShell, irm and iex subprocess clues
    conf: 0.99
    for: [python]
    all:
      - id: micro-behaviors/process/deploy/interpreter-command::python-powershell-subprocess
      - id: micro-behaviors/process/deploy/interpreter-command::python-powershell-fetch-alias
      - id: micro-behaviors/process/deploy/interpreter-command::powershell-expression-pipeline
    near_bytes: 512
