defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.98
traits:
  - id: python-http-json-response-code-exec
    desc: Executes code field from HTTP JSON response
    if:
      type: tree-sitter
      language: python
      query: |
        ((block
          . (expression_statement (assignment
              left: (identifier) @task
              right: (call) @response))
          . (if_statement
              alternative: (elif_clause
                consequence: (block
                  (expression_statement (call
                    function: (identifier) @exec
                    arguments: (argument_list
                      (subscript value: (identifier) @received
                                 subscript: (string) @field))))))))
         (#match? @response "^(requests|httpx)\\.post\\([^\\n]{0,240}\\)\\.json\\(\\)$")
         (#eq? @task @received)
         (#eq? @exec "exec")
         (#match? @field "^['\"]code['\"]$"))
