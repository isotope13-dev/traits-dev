defaults:
  platforms: [windows]
  for: [powershell, batch]
  attack: T1059.001,T1105
  mbc: B0030

traits:
  - id: powershell-nested-rest-response-eval
    desc: PowerShell directly evaluates a REST response
    crit: notable
    conf: 0.98
    for: [powershell]
    if:
      type: tree-sitter
      node: command
      regex: '(?i)^(iex|Invoke-Expression)\s*\(\s*(irm|Invoke-RestMethod)\b'
