defaults:
  platforms:
    - unix
  crit: suspicious
  for:
    - shell
traits:
  - id: eval-curl-backtick
    desc: eval `curl ...`
    crit: suspicious
    conf: 0.7
    attack: T1059.004 - '*'
    if:
      type: text
      regex: eval\s*`curl
  - id: eval-wget-subshell
    desc: eval "$(wget ..."
    crit: suspicious
    conf: 0.7
    attack: T1059.004 - '*'
    if:
      type: text
      regex: eval\s*"\$\(wget
    unless:
      - id: metadata/package/testing/presence/path::pkgbuild-test-fixture-path
      - id: well-known/tool/detection/ai-guardrail::command-rule-corpus
      - id: metadata/file/catalog/pattern-rules::cleave-trait-definition-file
  - id: eval-wget-backtick
    desc: eval `wget ...`
    crit: suspicious
    conf: 0.7
    attack: T1059.004 - '*'
    if:
      type: text
      regex: eval\s*`wget
  - id: curl-cmd-variable-eval
    desc: curl output assigned to cmd then evaluated
    crit: suspicious
    conf: 0.92
    attack: T1059.004
    for:
      - shell
      - macho
    if:
      type: text
      regex: (?is)\bcmd=\$\(curl\b.{0,400}\).*?(eval|(ba|z)?sh\s+-c)\s+["']?\$cmd\b
  - id: curl-script-variable-eval
    desc: curl output assigned to script then evaluated
    crit: suspicious
    conf: 0.92
    attack: T1059.004
    for:
      - shell
      - macho
    if:
      type: text
      regex: (?is)\bscript=\$\(curl\b.{0,400}\).*?(eval|(ba|z)?sh\s+-c)\s+["']?\$script\b
  - id: curl-payload-variable-eval
  # Bind the path to this member while reading package identity across files.
    downgrade:
      scope: archive
      all:
        - id: well-known/tool/detection/code-analysis/disclude::static-fixture-package-without-interpreter
        - type: path
          regex: '(^|[\\/])tests[\\/]fixtures[\\/]'
    desc: curl output assigned to payload then evaluated
    crit: suspicious
    conf: 0.92
    attack: T1059.004
    for:
      - shell
      - macho
    if:
      type: text
      regex: (?is)\bpayload=\$\(curl\b.{0,400}\).*?(eval|(ba|z)?sh\s+-c)\s+["']?\$payload\b
  - id: shell-curl-process-sub
    desc: shell <(curl ...)
    crit: suspicious
    conf: 0.7
    attack: T1059.004 - '*'
    if:
      type: text
      regex: shell\s+<\(curl
  - id: sh-curl-process-sub
    desc: sh <(curl ...) process substitution
    crit: notable
    conf: 0.7
    attack: T1059.004 - '*'
    if:
      type: text
      regex: (^|[^A-Za-z])sh\s+<\(curl
    not:
      - substr: raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash
      - substr: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint
  - id: source-curl-process-sub
    desc: source <(curl ...)
    crit: notable
    conf: 0.7
    attack: T1059.004 - '*'
    if:
      type: text
      regex: source\s+<\(curl
  - id: source-wget-process-sub
    desc: source <(wget ...)
    crit: notable
    conf: 0.7
    attack: T1059.004 - '*'
    if:
      type: text
      regex: source\s+<\(wget
composite_rules:
  - id: curl-variable-eval
  # Bind the path to this member while reading package identity across files.
    downgrade:
      scope: archive
      all:
        - id: well-known/tool/detection/code-analysis/disclude::static-fixture-package-without-interpreter
        - type: path
          regex: '(^|[\\/])tests[\\/]fixtures[\\/]'
    desc: curl response variable eval
    crit: suspicious
    conf: 0.97
    attack: T1059.004
    for:
      - shell
      - macho
    any:
      - id: micro-behaviors/process/deploy/script-eval/network::curl-cmd-variable-eval
      - id: micro-behaviors/process/deploy/script-eval/network::curl-script-variable-eval
      - id: micro-behaviors/process/deploy/script-eval/network::curl-payload-variable-eval
  - id: process-substitution
    desc: Shell process substitution with remote content
    crit: notable
    conf: 0.85
    attack: T1059.004
    any:
      - id: micro-behaviors/process/deploy/script-eval/network::shell-curl-process-sub
      - id: micro-behaviors/process/deploy/script-eval/network::sh-curl-process-sub
      - id: micro-behaviors/process/deploy/script-eval/network::source-curl-process-sub
      - id: micro-behaviors/process/deploy/script-eval/network::source-wget-process-sub
