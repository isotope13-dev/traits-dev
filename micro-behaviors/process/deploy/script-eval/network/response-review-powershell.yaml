defaults:
  platforms: [windows]
  for: [powershell]

traits:
- id: powershell-irm-eval-text
  desc: PowerShell IRM fetch-eval text
  crit: suspicious
  conf: 0.98
  if:
    type: text
    substr: "iex(irm "

- id: ps-restmethod-bare-domain-eval-call
  desc: PowerShell evals RestMethod bare domain
  crit: suspicious
  conf: 0.97
  size_min: 1
  if:
    type: text
    regex: '\biex\s*\(\s*(irm|Invoke-RestMethod)\s+[a-z0-9][a-z0-9.-]*\.[a-z]{2,}\s*\)'
    case_insensitive: true
