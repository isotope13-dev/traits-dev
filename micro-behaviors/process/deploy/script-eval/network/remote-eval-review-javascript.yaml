defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.8
traits:
- id: eval-response-data-content
  desc: eval executes response data content
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: \beval\s*\(\s*(response|resp|res|r)\.data\.content(_[A-Za-z0-9_$]+)?\s*\)
- id: await-fetch-text-eval
  desc: eval awaits fetched response text
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: eval\s*\(\s*await\s*\(\s*await\s+fetch\(.{1,120}\)\)\.text\(\)\s*\)
  unless:
  - id: well-known/lib/runtime/use-m::use-m-published-cdn-bootstrap
- id: userscript-gm-response-eval-flow
  desc: Userscript HTTP response reaches eval
  crit: suspicious
  conf: 0.99
  mbc: B0024
  if:
    type: text
    regex: GM_xmlhttpRequest\([\s\S]{0,500}responseText[\s\S]{0,80}eval\s*\(
