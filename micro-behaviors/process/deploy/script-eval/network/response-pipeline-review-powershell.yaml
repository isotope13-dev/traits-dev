defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: irm-bare-domain-eval
    desc: PowerShell evaluates an IRM bare-domain response
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/process/deploy/script-eval/network::powershell-irm-eval-text
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::irm-bare-domain
    near_bytes: 256
  - id: ps-webrequest-content-iex-pipeline
    desc: PowerShell evaluates downloaded response content
    crit: suspicious
    conf: 0.96
    for: [powershell, vbs, batch]
    all:
      - id: micro-behaviors/process/interpreter/eval/powershell::powershell-content-pipe-iex-text
    any:
      - id: micro-behaviors/communications/http/lib/invoke-webrequest::invoke-webrequest
      - id: micro-behaviors/communications/http/client/library::powershell-rest-request
    near_bytes: 384
    near_lines: 1
    not:
      - regex: '(?i)githubusercontent\.com'
      - regex: '(?i)//github\.com/'
