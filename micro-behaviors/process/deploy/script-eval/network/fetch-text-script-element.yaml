# A bound fetch response supplies a newly created and inserted script node.
# Calls and proximity alone cannot distinguish a response display, a static
# script, a different response, or insertion of a different node. Use syntax
# relationships and equal captures for this small, adjacent-statement idiom.
# These are ordinary loader mechanics, including legitimate dynamic loaders;
# neither remote code loading nor POST alone establishes malicious intent.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: fetch-text-script-element
    desc: Inserts fetched response text as browser script
    if:
      type: tree-sitter
      query: |
        ((statement_block
        [(lexical_declaration . (variable_declarator
          name: (identifier) @response
          value: (await_expression (call_expression
            function: (identifier) @fetch))) .)
         (variable_declaration . (variable_declarator
          name: (identifier) @response
          value: (await_expression (call_expression
            function: (identifier) @fetch))) .)]
        .
        [(lexical_declaration . (variable_declarator
          name: (identifier) @element
          value: (call_expression
            function: (member_expression object: (identifier) @document
              property: (property_identifier) @create)
            arguments: (arguments . (string (string_fragment) @tag) .))) .)
         (variable_declaration . (variable_declarator
          name: (identifier) @element
          value: (call_expression
            function: (member_expression object: (identifier) @document
              property: (property_identifier) @create)
            arguments: (arguments . (string (string_fragment) @tag) .))) .)]
        .
        (expression_statement (assignment_expression
          left: (member_expression object: (identifier) @assigned
            property: (property_identifier) @content)
          right: (await_expression (call_expression
            function: (member_expression object: (identifier) @read_response
              property: (property_identifier) @text)
            arguments: (arguments)))))
        .
        (expression_statement (call_expression
          function: (member_expression
            object: (member_expression object: (identifier) @document2
              property: (property_identifier) @parent)
            property: (property_identifier) @append)
          arguments: (arguments . (identifier) @inserted .))))
        (#eq? @fetch "fetch")
        (#eq? @response @read_response)
        (#eq? @element @assigned)
        (#eq? @element @inserted)
        (#eq? @document "document")
        (#eq? @document2 "document")
        (#eq? @create "createElement")
        (#eq? @tag "script")
        (#match? @content "^(text|textContent|innerHTML)$")
        (#eq? @text "text")
        (#match? @parent "^(head|body|documentElement)$")
        (#match? @append "^(appendChild|append)$")
        (#set! cleave.ignore-comments "true"))
        
        ((statement_block
        [(lexical_declaration . (variable_declarator
          name: (identifier) @response
          value: (await_expression (call_expression
            function: (identifier) @fetch))) .)
         (variable_declaration . (variable_declarator
          name: (identifier) @response
          value: (await_expression (call_expression
            function: (identifier) @fetch))) .)]
        .
        (try_statement body: (statement_block .
        [(lexical_declaration . (variable_declarator
          name: (identifier) @element
          value: (call_expression
            function: (member_expression object: (identifier) @document
              property: (property_identifier) @create)
            arguments: (arguments . (string (string_fragment) @tag) .))) .)
         (variable_declaration . (variable_declarator
          name: (identifier) @element
          value: (call_expression
            function: (member_expression object: (identifier) @document
              property: (property_identifier) @create)
            arguments: (arguments . (string (string_fragment) @tag) .))) .)]
        .
        (expression_statement (assignment_expression
          left: (member_expression object: (identifier) @assigned
            property: (property_identifier) @content)
          right: (await_expression (call_expression
            function: (member_expression object: (identifier) @read_response
              property: (property_identifier) @text)
            arguments: (arguments)))))
        .
        (expression_statement (call_expression
          function: (member_expression
            object: (member_expression object: (identifier) @document2
              property: (property_identifier) @parent)
            property: (property_identifier) @append)
          arguments: (arguments . (identifier) @inserted .))))))
        (#eq? @fetch "fetch")
        (#eq? @response @read_response)
        (#eq? @element @assigned)
        (#eq? @element @inserted)
        (#eq? @document "document")
        (#eq? @document2 "document")
        (#eq? @create "createElement")
        (#eq? @tag "script")
        (#match? @content "^(text|textContent|innerHTML)$")
        (#eq? @text "text")
        (#match? @parent "^(head|body|documentElement)$")
        (#match? @append "^(appendChild|append)$")
        (#set! cleave.ignore-comments "true"))
