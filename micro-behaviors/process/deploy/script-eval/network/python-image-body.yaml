defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-image-response-decoded-exec
    desc: Executes code from image-named HTTP
    conf: 0.99
    if:
      type: symbol
      kind: call
      regex: '^(exec|eval)$'
      arg:
        index: 0
        from:
          call: '^requests\.get$'
          argument: 0
          literal: '\.(png|jpe?g|gif|webp)(\?|$)'
          through:
            - call: '^base64\.b64decode$'
              arguments: [0]
            - call: '^compile$'
              arguments: [0]
