defaults:
  platforms:
    - windows
    - unix
  for:
    - python
traits:
  - id: exec-get-content
    desc: exec() on HTTP response .content
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: exec\s*\(.{0,50}\.get\s*\(.{0,50}\)\.content\s*\)
    unless:
      - id: well-known/tool/detection/agent/agentskillmap::cli-context
  - id: eval-get-text
    desc: eval() on HTTP response .text
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: eval\s*\(.{0,50}\.get\s*\(.{0,50}\)\.text\s*\)
    unless:
      - id: well-known/tool/detection/agent/agentskillmap::cli-context
      - id: metadata/package/testing/corpus/labeled::scanner-labeled-tuple-testdata
      - id: metadata/package/testing/presence/harness::verified-python-test-file
  - id: non-url-param-request-compile-exec-flow
    desc: Non-URL function fetches and compiles source
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (expression_statement
            (assignment
              left: (identifier) @code_url
              right: (binary_operator)))
          (function_definition
            parameters: (parameters . (default_parameter name: (identifier)) .)
            body: (block
              (expression_statement
                (assignment
                  left: (identifier) @req
                  right: (call
                    function: (identifier) @req_fn
                    arguments: (argument_list . (identifier) @req_url (_)*))))
              (with_statement
                (with_clause (with_item value: (as_pattern
                  (call function: (identifier) @open
                    arguments: (argument_list . (identifier) @open_req (_)*))
                  alias: (as_pattern_target (identifier) @response))))
                body: (block
                  (expression_statement
                    (assignment left: (identifier) @source
                      right: (call
                        function: (attribute
                          object: (call
                            function: (attribute object: (identifier) @read_response
                              attribute: (identifier) @read)
                            arguments: (argument_list))
                          attribute: (identifier) @decode)
                        arguments: (argument_list))))))
              (_)*
              (expression_statement
                (call function: (identifier) @exec
                  arguments: (argument_list .
                    (call function: (identifier) @compile
                      arguments: (argument_list . (identifier) @compiled_source . (identifier) @compiled_url)))))))) @flow
          (#eq? @req_fn "Request")
          (#eq? @req_url @code_url)
          (#eq? @open "urlopen")
          (#eq? @open_req @req)
          (#eq? @read_response @response)
          (#eq? @read "read")
          (#eq? @decode "decode")
          (#eq? @source @compiled_source)
          (#eq? @compiled_url @code_url)
          (#eq? @compile "compile")
          (#eq? @exec "exec"))
