defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
  attack: T1059.004
traits:
- id: shell-c-curl-subshell
  desc: shell c curl subshell
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: shell\s+-c\s+.{0,10}\$\(curl
- id: sh-c-curl-subshell
  desc: sh -c runs curl command substitution output
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: (?m)^[^#\n]{0,80}\bsh\s+-c\s+.{0,10}\$\(curl
  unless:
  - id: micro-behaviors/os/package-manager/installer-script::installer-script
  - id: metadata/path/software::proxmoxve-community-scripts
  - id: well-known/tool/detection/pattern-catalog::js-fetch-decode-shell-classifier
  - id: well-known/tool/detection/pattern-catalog::detection-rulespec-table
  - type: text
    regex: \$\(curl[^)\n]{0,80}https://mise\.(run|jdx\.dev)([/"\x27)\s]|$)
- id: shell-c-wget-subshell
  desc: shell c wget subshell
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: shell\s+-c\s+.{0,10}\$\(wget
composite_rules:
- id: shell-subshell-stager
  desc: Shell stager via command substitution
  crit: suspicious
  conf: 0.9
  any:
  - id: micro-behaviors/process/deploy/script-eval/network::shell-c-curl-subshell
  - id: micro-behaviors/process/deploy/script-eval/network::sh-c-curl-subshell
  - id: micro-behaviors/process/deploy/script-eval/network::shell-c-wget-subshell
