defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-urlopen-response-shell-command
    desc: Runs urlopen response through shell
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((block
          (try_statement body: (block
            (expression_statement (assignment left: (identifier) @response
              right: (call function: (identifier) @open)))
            . (expression_statement (assignment left: (identifier) @body
              right: (call function: (attribute
                object: (call function: (attribute
                  object: (call function: (attribute object: (identifier) @read_response
                    attribute: (identifier) @read))
                  attribute: (identifier) @decode))
                attribute: (identifier) @strip))))))
          . (if_statement condition: (identifier) @guard consequence: (block
            (expression_statement (call
              function: (attribute object: (identifier) @subprocess attribute: (identifier) @popen)
              arguments: (argument_list . (list . (string (string_content) @shell)
                . (string (string_content) @flag)
                . (binary_operator left: (identifier) @command))))) ))) @flow
          (#eq? @open "urlopen")
          (#eq? @response @read_response)
          (#eq? @read "read")
          (#eq? @decode "decode")
          (#eq? @strip "strip")
          (#eq? @subprocess "subprocess")
          (#match? @popen "^(Popen|run|call)$")
          (#match? @shell "(^|/)(ba|z|da|k)?sh$")
          (#eq? @flag "-c")
          (#eq? @body @guard)
          (#eq? @body @command))
