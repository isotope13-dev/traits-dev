defaults:
  platforms: [unix]
  for: [shell]
  crit: notable

traits:
  - id: eval-curl-subshell
    desc: Shell eval of curl command substitution
    conf: 0.95
    attack: T1059.004
    if:
      type: symbol
      kind: call
      exact: eval
      arg:
        index: 0
        regex: '^\$\(curl\b'
