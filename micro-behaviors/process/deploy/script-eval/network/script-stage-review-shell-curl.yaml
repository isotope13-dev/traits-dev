defaults:
  platforms: [unix]
  for: [shell]
  crit: notable

traits:
  - id: eval-curl-subshell
    desc: Shell eval of curl command substitution
    conf: 0.95
    attack: T1059.004
    if:
      type: symbol
      kind: call
      exact: eval
      arg:
        index: 0
        regex: '^\$\(curl\b'
    unless:
      - id: well-known/tool/packaging/gimme::gimme-bootstrap-context
      - id: well-known/lib/development/elastic-apm::jenkins-script-context
      - id: well-known/lib/development/elastic-apm::source-archive-context
      - id: metadata/file/catalog/identity::cleave-trait-definition-file
      - id: metadata/package/testing/presence/path::test-spec-path-benign-context
