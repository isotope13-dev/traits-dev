defaults:
  platforms: [windows, unix]
  for: [python]
composite_rules:
  - id: python-urlopen-compile-exec-proximity
    desc: urlopen, compile and exec co-occur
    crit: notable
    conf: 0.9
    near_bytes: 900
    all:
      - id: micro-behaviors/process/deploy/script-eval/network::urlopen-before-exec
      - id: micro-behaviors/metaprogramming/generation/compile::compile-source-exec-mode
