defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: js-response-text-eval-flow
    desc: JavaScript evals .text() call result
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: eval
      arg:
        index: 0
        from:
          call: '(^|\.)text$'

  - id: js-module-response-text-eval-flow
    desc: Module-level eval of .text() call result
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: eval
      module_level: true
      arg:
        index: 0
        from:
          call: '(^|\.)text$'
