defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: python-module-git-clone-chdir-python
    desc: Clones repo then runs Python after chdir
    if:
      type: tree-sitter
      query: |
        ((module
          (if_statement consequence: (block (expression_statement (call
            function: (attribute object: (attribute object: (identifier) @git attribute: (identifier) @repo_class) attribute: (identifier) @clone)
            arguments: (argument_list (identifier) @url (identifier) @destination)))))
          (expression_statement (call function: (attribute object: (identifier) @os attribute: (identifier) @chdir)
            arguments: (argument_list (identifier) @directory)))
          (expression_statement (call function: (attribute object: (identifier) @subprocess attribute: (identifier) @run)
            arguments: (argument_list (list (string) @python (string) @script)))))
          (#eq? @git "git") (#eq? @repo_class "Repo") (#eq? @clone "clone_from")
          (#eq? @os "os") (#eq? @chdir "chdir") (#eq? @destination @directory)
          (#eq? @subprocess "subprocess") (#eq? @run "run")
          (#match? @python "^[\"']python(3([.][0-9]+)?)?[\"']$")
          (#match? @script "[.]py[\"']$"))
