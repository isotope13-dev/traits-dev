# Inline page script that fetches, reads the response as text and calls
# eval() nearby: the shape of a loader that runs downloaded script. Inline
# HTML has no symbol facts to prove the text reaches eval (and loaders often
# park it in a module map first), so this is co-occurrence, described as such.
# Old module loaders do the same, so it stays a suspicious capability.
defaults:
  platforms: [windows, unix, ios]
  for: [html]
  attack: T1059.007

composite_rules:
  - id: html-fetched-text-near-eval
    desc: Inline script evals near fetched response text
    crit: suspicious
    conf: 0.85
    near_lines: 200
    all:
      - id: micro-behaviors/communications/http/request/html::html-fetch-call
      - id: micro-behaviors/communications/http/client/response-body::html-response-text-read
      - id: micro-behaviors/process/interpreter/eval/javascript::eval-call-text
