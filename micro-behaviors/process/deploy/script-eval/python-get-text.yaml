traits:
- platforms:
  - windows
  - unix
  for:
  - python
  id: python-get-response-text-exec
  desc: Python executes HTTP GET-derived values
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: exec
    arg:
      index: 0
      from:
        call: '^(requests|httpx)\.get$'
        through:
          - call: '\.(json|get|decode)$'
            receiver: true
          - call: '^compile$'
            arguments: [0]
  unless:
  - id: well-known/tool/detection/agentskillmap/
