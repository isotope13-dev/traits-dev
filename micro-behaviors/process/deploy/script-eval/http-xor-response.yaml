# Preserve the response-to-eval signal as a conjunction of inexpensive facts.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  size_max: 2000000
traits:
- id: xor-charcode-decoder-helper
  desc: XOR character-code operation
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: |-
      ((binary_expression
        left: (call_expression function: (member_expression
          property: (property_identifier) @charcode))
        operator: "^")
        (#eq? @charcode "charCodeAt"))

- id: http-request-by-node-client
  desc: Uses the Node HTTP request client
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: |-
      ((call_expression function: (member_expression
        object: (call_expression arguments: (arguments (string (string_fragment) @http)))
        property: (property_identifier) @request)
        arguments: (arguments (_)*))
        (#eq? @request "request")
        (#eq? @http "http"))

- id: eval-call-of-decoder-result
  desc: Evaluates a decoder invocation result
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: |-
      (call_expression function: (identifier) @eval
        arguments: (arguments (call_expression function: (identifier) @decoder
          arguments: (arguments (identifier) @source)))
        (#eq? @eval "eval"))

composite_rules:
- id: http-xor-helper-response-eval
  desc: Evaluates XOR-decoded HTTP response bytes
  crit: suspicious
  conf: 0.99
  attack: T1105,T1140,T1059.007
  all:
  - id: xor-charcode-decoder-helper
  - id: http-request-by-node-client
  - id: micro-behaviors/process/io/stream::node-stream-data-event
  - id: micro-behaviors/process/io/stream::node-stream-end-event
  - id: eval-call-of-decoder-result
