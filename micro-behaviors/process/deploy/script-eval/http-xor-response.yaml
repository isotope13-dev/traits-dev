# Bind response chunks, Promise resolution, XOR input and eval argument.
# A nearby HTTP client or an unrelated evaluator cannot satisfy this chain.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  size_max: 2000000
traits:
- id: http-xor-helper-response-eval
  desc: Evaluates XOR-decoded HTTP response bytes
  crit: suspicious
  conf: 0.99
  attack: T1105,T1140,T1059.007
  if:
    type: tree-sitter
    query: |-
      ((statement_block
        (lexical_declaration (variable_declarator
          name: (identifier) @decoder
          value: (arrow_function parameters: (formal_parameters (identifier) @cipher) body: (statement_block
            (for_statement body: (statement_block
              (expression_statement (augmented_assignment_expression
                left: (identifier) @output
                operator: "+="
                right: (call_expression function: (member_expression
                  object: (identifier) @string property: (property_identifier) @fromchar)
                  arguments: (arguments (binary_expression left: (call_expression function: (member_expression object: (identifier) @cipheruse property: (property_identifier) @charcode)) operator: "^")))))))
            (return_statement (identifier) @returned)))))
        (lexical_declaration (variable_declarator
          name: (identifier) @download
          value: (await_expression (new_expression
            constructor: (identifier) @promise
            arguments: (arguments (arrow_function
              parameters: (formal_parameters (identifier) @resolve)
              body: (statement_block
                (lexical_declaration (variable_declarator
                  value: (call_expression
                    function: (member_expression object: (call_expression
                      arguments: (arguments (string (string_fragment) @http)))
                      property: (property_identifier) @request)
                    arguments: (arguments (object) (arrow_function
                      parameters: (formal_parameters (identifier) @response)
                      body: (statement_block
                        (expression_statement (call_expression
                          function: (member_expression object: (identifier) @dataresponse
                            property: (property_identifier) @dataon)
                          arguments: (arguments (string (string_fragment) @data)
                            (arrow_function
                              parameters: (formal_parameters (identifier) @chunk)
                              body: (parenthesized_expression
                                (augmented_assignment_expression
                                  left: (identifier) @accumulator
                                  operator: "+="
                                  right: (identifier) @chunkuse))))))
                        (expression_statement (call_expression
                          function: (member_expression object: (identifier) @endresponse
                            property: (property_identifier) @on)
                          arguments: (arguments (string (string_fragment) @end)
                            (arrow_function body: (call_expression
                              function: (identifier) @resolveuse
                              arguments: (arguments (identifier) @body)))))))))))))))))
        ))
        (expression_statement (call_expression function: (identifier) @eval
          arguments: (arguments (call_expression function: (identifier) @decoderuse
            arguments: (arguments (identifier) @downloaduse)))))) @chain
        (#eq? @cipher @cipheruse)
        (#eq? @charcode "charCodeAt")
        (#eq? @dataresponse @response)
        (#eq? @dataon "on")
        (#eq? @data "data")
        (#eq? @accumulator @body)
        (#eq? @chunk @chunkuse)
        (#eq? @string "String")
        (#eq? @fromchar "fromCharCode")
        (#eq? @output @returned)
        (#eq? @promise "Promise")
        (#eq? @http "http")
        (#eq? @request "request")
        (#eq? @response @endresponse)
        (#eq? @on "on")
        (#eq? @end "end")
        (#eq? @resolve @resolveuse)
        (#eq? @eval "eval")
        (#eq? @decoder @decoderuse)
        (#eq? @download @downloaduse))
