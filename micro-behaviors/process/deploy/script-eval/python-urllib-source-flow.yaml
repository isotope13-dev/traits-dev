defaults:
  platforms: [unix, windows]
  for: [python, whl]

composite_rules:
- id: urllib-response-source-exec
  desc: Executes source fetched with urllib
  crit: suspicious
  conf: 0.98
  attack: T1105,T1059.006
  mbc: B0024,B0032
  scope: archive
  all:
  - id: micro-behaviors/process/interpreter/eval/constructed::exec-compiled-code
  any:
  - id: micro-behaviors/process/deploy/script-eval::python-urllib-response-decoded-source-exec-flow
  - id: micro-behaviors/process/deploy/script-eval::python-urllib-response-read-source-exec-flow
  - id: micro-behaviors/process/deploy/script-eval::python-urllib-urlopen-read-source-exec-flow

