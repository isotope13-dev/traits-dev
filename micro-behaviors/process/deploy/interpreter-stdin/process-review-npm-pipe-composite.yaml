defaults:
  for: [package.json]
  platforms: [unix, windows]
composite_rules:
  - id: npm-preinstall-interpreter-pipe
    desc: Preinstall pipes output to an interpreter
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/process/interpreter/shell::npm-preinstall-sh-pipe
      - id: micro-behaviors/process/interpreter/shell::npm-preinstall-shell-pipe
      - id: micro-behaviors/process/interpreter/node::npm-preinstall-stdin-pipe
