defaults:
  platforms: [linux, macos, windows]
  for: [shell, batch, text]
composite_rules:
  - id: micro-behaviors/process/deploy/interpreter-stdin::download-pipe-null-redirection
    for: [shell, batch]
    desc: Download pipe shell output suppressed
    crit: component
    conf: 0.84
    all:
      - id: metadata/lang/source/syntax/command/pipeline::shell-pipe-output-redirect-text
      - id: micro-behaviors/os/console/io::null-redirect-stdout-stderr
    any:
      - id: micro-behaviors/process/deploy/interpreter-stdin::curl-pipe-sh-command
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
      - id: micro-behaviors/process/deploy/interpreter-stdin::wget-pipe-sh
      - id: micro-behaviors/process/deploy/interpreter-stdin::curl-pipe-cmd-command-line
      - id: micro-behaviors/process/deploy/interpreter-stdin::curl-pipe-cmd-literal

