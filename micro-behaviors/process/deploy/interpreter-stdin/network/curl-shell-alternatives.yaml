defaults:
  for:
  - shell
  - python
  - javascript
  - ruby
  - perl
  - applescript
  platforms:
  - windows
  - linux
  - macos
  crit: notable
  attack: T1059.004
traits:
- id: curl-pipe-dash
  desc: curl piped to dash
  conf: 0.7
  if:
    type: text
    regex: curl\s+.{0,200}\|\s*dash\b
- id: curl-pipe-ksh
  desc: curl piped to ksh
  conf: 0.7
  if:
    type: text
    regex: curl\s+.{0,200}\|\s*ksh\b
- id: curl-pipe-shell-word
  desc: curl piped to shell
  conf: 0.7
  unless:
  - id: metadata/lang/source/syntax/key-value::security-rule-runtime-script-floating-url
  if:
    type: text
    regex: curl\s+.{0,200}\|\s*shell\b
composite_rules:
- id: curl-pipe-shell
  desc: Curl output piped to shell
  conf: 0.95
  any:
  - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-sh-command
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
  - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-shell-word
  - id: metadata/lang/source/syntax/command/download::curl-pipe-zsh
  - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-ksh
  unless:
  - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-pipe-dash
