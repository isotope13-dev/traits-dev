# Curl-to-PowerShell pipelines are execution capabilities; intent needs other evidence.
defaults:
  platforms: [windows, unix]
  for: [batch, shell, powershell]
  crit: notable
  conf: 0.94
  attack: T1059.001

traits:
  - id: curl-pipe-powershell
    desc: curl to PowerShell pipeline text
    if:
      type: text
      regex: '(?i)\bcurl(\.exe)?\s+[^\r\n|]{1,200}\|\s*(powershell|pwsh)(\.exe)?\b'
