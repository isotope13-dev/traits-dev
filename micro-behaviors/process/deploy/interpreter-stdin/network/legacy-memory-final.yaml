composite_rules:
- id: curl-osascript-stdin
  for:
  - shell
  - applescript
  desc: Curl output piped into osascript stdin
  crit: suspicious
  conf: 1.0
  all:
  - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-osascript
  - id: micro-behaviors/process/deploy/interpreter-stdin/input::osascript-stdin
defaults:
  platforms:
  - macos
traits:
- id: curl-osascript
  desc: Curl output piped to osascript
  crit: suspicious
  conf: 0.95
  unless:
  - id: metadata/file/format/markup::adblock-filter-list
  if:
    type: text
    regex: curl\s+[^\n]{0,800}\|\s*(/usr/bin/)?osascript\b
  for:
  - shell
  - applescript
  - javascript
  - html
  - macho
