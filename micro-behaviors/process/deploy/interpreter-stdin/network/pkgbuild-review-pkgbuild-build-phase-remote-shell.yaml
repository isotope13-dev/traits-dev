defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: pkgbuild-build-phase-remote-shell
    desc: PKGBUILD build phase pipes a remote response to a shell
    crit: suspicious
    conf: 0.98
    near_lines: 30
    all:
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-build-fn
      - id: micro-behaviors/communications/http/download/package::pkgbuild-build-phase-fetch
      - id: metadata/lang/source/syntax/command/download::curl-pipe-sh-text
      - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
    unless:
      - id: well-known/tool/detection/security-scanner-identity::ks-aur-test-or-crate-member
