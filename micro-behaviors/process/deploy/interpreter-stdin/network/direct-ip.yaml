# A raw IP and an interpreter sink establish execution mechanics, not an
# unauthorized operation. Preserve the risk signal without convicting installers.
defaults:
  platforms: [unix]
  attack: T1105,T1059.004
composite_rules:
- id: raw-ip-curl-shell-pipeline
  desc: Raw-IP curl download piped to shell
  conf: 0.98
  crit: suspicious
  for:
  - shell
  - text
  near_bytes: 256
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-command-line
  unless:
  - id: metadata/path/directory::test-directory-component
- id: embedded-raw-ip-curl-shell-command
  desc: Embedded raw-IP curl-to-shell command
  crit: suspicious
  conf: 0.99
  for:
  - python
  - javascript
  - ruby
  - perl
  scope: file
  near_bytes: 256
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  any:
  - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-literal
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
- id: raw-ip-shell-c-fetch-substitution
  # `bash -c "$(curl http://<ip>/x)"` hands the response body to the shell as
  # its command string: the same sink as a pipe, without the `|`. Proximity
  # binds the raw-IP URL to the fetch substitution; it does not prove the
  # command runs.
  desc: Shell -c runs raw-IP fetch substitution
  crit: suspicious
  conf: 0.97
  for:
  - shell
  - scripts
  near_bytes: 160
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  - id: micro-behaviors/process/create/shell/command-mode::shell-c-command-substitution-fetch
