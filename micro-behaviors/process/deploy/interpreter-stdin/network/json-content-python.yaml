# Bind acquisition, JSON content extraction, and interpreter input in one
# executable pipeline. The member's filename does not establish its behavior.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.97
traits:
  - id: shell-curl-json-content-sudo-python
    desc: Shell pipes fetched JSON into sudo Python
    for: [shell]
    if:
      type: tree-sitter
      query: |
        ((pipeline (command name: (command_name (word) @sudo))) @pipe
          (#eq? @sudo "sudo")
          (#match? @pipe "curl[^|]{1,200}\\|\\s*jq[^|]{1,120}\\.content[^|]{0,16}\\|\\s*sudo\\s+python3?\\b"))
  - id: js-exec-curl-json-content-sudo-python
    desc: Exec pipes fetched JSON into sudo Python
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)exec(Sync)?$'
      arg:
        index: 0
        kind: string
        regex: 'curl[^|]{1,200}\|\s*jq[^|]{1,120}\.content[^|]{0,16}\|\s*sudo\s+python3?\b'
composite_rules:
  - id: curl-json-content-sudo-python
    desc: Fetched JSON content piped to privileged Python
    for: [shell, javascript, typescript]
    any:
      - id: shell-curl-json-content-sudo-python
      - id: js-exec-curl-json-content-sudo-python
