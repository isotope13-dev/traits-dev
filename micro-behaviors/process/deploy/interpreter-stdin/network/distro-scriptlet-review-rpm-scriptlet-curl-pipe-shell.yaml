defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: rpm-scriptlet-curl-pipe-shell
    desc: RPM scriptlet executes a curl response
    crit: suspicious
    conf: 0.99
    scope: leaf
    all:
      - id: metadata/build/package/maintainer-scripts::rpm-install-scriptlet-body
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::curl-response-shell-stdin

