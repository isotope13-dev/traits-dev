traits:
- id: curl-pipe-cmd-literal
  desc: Literal pipes download into cmd
  conf: 0.93
  for:
  - python
  - javascript
  - typescript
  - go
  - rust
  - ruby
  - php
  - java
  platforms:
  - windows
  attack: T1059.003
  if:
    type: literal
    regex: (?i)\b(curl|wget)\b[^|\n]{1,220}\|\s*cmd(\.exe)?\b
- id: curl-pipe-cmd-command-line
  desc: Command pipes download into cmd
  conf: 0.92
  for:
  - batch
  platforms:
  - windows
  attack: T1059.003
  if:
    type: text
    regex: \b(curl|wget)\b[^|\n]{1,220}\|\s*cmd(\.exe)?\b
- id: curl-pipe-sh-command
  desc: curl piped to sh
  conf: 0.7
  if:
    type: text
    regex: (?m)^[[:space:]]*(/bin/sh\s+-c\s+)?curl\s+.{0,160}\|\s*sh\b
  not:
  - regex: 'curl\s+-LsSf\s+\.\.\.\s*\|\s*sh\b'
  platforms:
  - windows
  - linux
  - macos
  for:
  - shell
  - python
  - javascript
  - ruby
  - perl
  - applescript
- id: download-options-pipe-sh
  desc: Downloader options piped into sh
  conf: 0.95
  if:
    type: text
    regex: (?m)^[[:space:]]*[^#\n]{0,80}\b(curl\s+-[so]|wget\s+-[qO])\s+[^|\n]{0,50}\|\s*sh\b
  unless:
  - id: metadata/package/freeform::pkg-description-content-type-markdown
  not:
  - substr: apt.u.doover.com/install.sh
  platforms:
  - unix
  for:
  - shell
defaults:
  attack: T1059.004
  crit: notable
composite_rules:
- id: shortened-url-shell-pipeline
  desc: Code references a shortened URL and shell pipeline
  crit: notable
  conf: 0.95
  attack: T1059,T1105
  near_bytes: 512
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - javascript
  - typescript
  - rust
  - -shell
  all:
  - id: micro-behaviors/communications/url/shortener/
  any:
  - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-literal
  - id: curl-pipe-cmd-literal
  - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-text
  - id: metadata/lang/source/syntax/command/download::curl-pipe-shell-in-code
  unless:
  - id: metadata/file/format/structured::twitter-status-created-at
