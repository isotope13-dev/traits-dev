---
defaults:
  platforms:
  - windows
  - unix
  for:
  - json
traits:
- id: tasks-osx-curl-pipe-shell
  desc: OSX task pipes curl into shell
  crit: notable
  conf: 0.9
  if:
    type: value
    path: tasks[*].osx.command
    regex: "\\bcurl\\b[^|\\n]{1,240}\\|\\s*(bash|sh)\\b"
- id: tasks-linux-curl-pipe-shell
  desc: Linux task pipes curl into shell
  crit: notable
  conf: 0.9
  if:
    type: value
    path: tasks[*].linux.command
    regex: "\\bcurl\\b[^|\\n]{1,240}\\|\\s*(bash|sh)\\b"
- id: tasks-windows-curl-pipe-cmd
  desc: Windows task pipes curl into cmd
  crit: notable
  conf: 0.9
  if:
    type: value
    path: tasks[*].windows.command
    regex: "\\bcurl\\b[^|\\n]{1,240}\\|\\s*cmd\\b"
