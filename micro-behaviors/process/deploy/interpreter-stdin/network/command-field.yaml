defaults:
  for: [shell]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: shell-remote-pipeline-command-field
    desc: Command field contains shell pipeline
    crit: component
    if:
      type: text
      regex: '["'']command["'']\s*:\s*["''][^"''\n]{0,160}\b(curl|wget)\b[^|\n]{0,160}\|\s*(ba)?sh\b'

composite_rules:
  - id: shell-command-field-download-pipeline
    desc: Command field contains a download-to-shell pipeline
    conf: 0.95
    attack: T1059.004
    near_lines: 1
    all:
      - id: metadata/lang/source/syntax/key-value::quoted-command-string-field
    any:
      - id: shell-pipes-downloaded-script
      - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-command-line
