defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: pacman-scriptlet-curl-process-substitution-bootstrap
    desc: Pacman scriptlet runs curl process substitution
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/build/package/maintainer-scripts::pacman-lifecycle-hook-fn
      - id: micro-behaviors/process/interpreter/shell::curl-process-substitution
    unless:
      - id: metadata/package/testing/harness/unit::go-test-source-file
      - id: metadata/package/testing/presence/harness::verified-python-test-file
      - id: well-known/tool/detection/trustsight::trustsight-defensive-scanner-context
