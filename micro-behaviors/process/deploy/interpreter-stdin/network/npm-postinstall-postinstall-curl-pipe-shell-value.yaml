defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: postinstall-curl-pipe-shell-value
  desc: Postinstall pipes curl output to shell
  crit: suspicious
  conf: 0.96
  if:
    type: value
    path: scripts.postinstall
    regex: \bcurl\b[^"\n]{0,120}\|\s*(sh|bash)\b
  # Inert parser seeds in the scanner's own fuzz corpus: downgraded, not
  # suppressed, so a copy outside fuzz/seeds keeps its severity.
  # websec-validator's own supply-chain fixture (tests/fixtures/) is a
  # deliberate postinstall pipe; one step lower keeps it visible. The
  # container identity is the only join available beside the fuzz-seed path
  # (downgrade operands cannot nest), so this lowers the tool archive's own
  # postinstall pipes one step, not just the fixture member.
  downgrade:
    scope: archive
    any:
      - id: well-known/tool/detection/websec-validator::websec-validator-tool
      - type: path
        regex: '(^|[\\/])fuzz[\\/]seeds[\\/]'
  unless:
  - id: well-known/tool/detection/agent/agent-audit-kit::scanner-context
  - id: metadata/package/testing/corpus/security-tests/scanner::inert-scanner-attack-corpus
  - id: well-known/tool/development/lint/linter::golangci-download-pipe-script
  - id: well-known/tool/development/lint/linter::actionlint-download-pipe-script
