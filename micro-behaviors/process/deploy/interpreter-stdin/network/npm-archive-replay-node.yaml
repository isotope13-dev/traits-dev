defaults:
  platforms: [unix, windows]
  for: [package.json, npm]

composite_rules:
  - id: npm-preinstall-archive-replay-node-stdin
    desc: Preinstall pipes replayed source into Node stdin
    crit: notable
    conf: 0.99
    all:
      - id: metadata/package/scripts/lifecycle::has-preinstall-script
      - id: metadata/package/scripts/interpreter-pipe::preinstall-curl-http-pipe-node
      - id: metadata/package/scripts/command::preinstall-archive-replay-url
