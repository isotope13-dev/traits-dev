# Download-to-interpreter pipelines also implement ordinary installers.
# These observations make no C2 or malicious-origin claim.
defaults:
  platforms: [windows, linux, macos]
  for: [shell, python, javascript, ruby, perl, applescript]
  attack: T1059.004
traits:
  - id: wget-pipe-sh
    for: [shell]
    desc: Wget pipeline feeds sh stdin
    crit: notable
    conf: 0.7
    if:
      type: tree-sitter
      # An elided URL is documentation, not a concrete download command.
      query: '((pipeline) @pipe (#match? @pipe "^wget\\s[^|\\n]*\\|\\s*sh\\b") (#not-match? @pipe "wget\\s+\\.\\.\\.\\s*\\|\\s*sh"))'
  - id: wget-pipe-shell-word
    desc: Text pipes wget into command named shell
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(?m)^[[:space:]]*(wget\b|[^#[:space:]][^\n]{0,220}\bwget\s+)[^|\n]{1,200}\|\s*shell\b'
    not:
      - substr: apt.u.doover.com/install.sh
  - id: wget-pipe-zsh
    desc: Text pipes wget into zsh
    crit: notable
    conf: 0.7
    # Same carve-outs as wget-pipe-{bash,shell-word,dash}: defensive scanners and
    # their test harnesses quote wget|zsh as DENY fixtures, not as droppers.
    if:
      type: text
      regex: '(?m)^[[:space:]]*(wget\b|[^#[:space:]][^\n]{0,220}\bwget\s+)[^|\n]{1,200}\|\s*zsh\b'
  - id: wget-pipe-ksh
    desc: Text pipes wget into ksh
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(?m)^[[:space:]]*(wget\b|[^#[:space:]][^\n]{0,220}\bwget\s+)[^|\n]{1,200}\|\s*ksh\b'
  - id: wget-pipe-dash
    desc: Text pipes wget into dash
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(?m)^[[:space:]]*(wget\b|[^#[:space:]][^\n]{0,220}\bwget\s+)[^|\n]{1,200}\|\s*dash\b'
composite_rules:
  - id: wget-pipe-shell
    desc: Wget output piped to shell
    crit: notable
    conf: 0.95
    any:
      - id: wget-pipe-sh
      - id: micro-behaviors/process/deploy/interpreter-stdin/network::wget-pipe-bash
      - id: wget-pipe-shell-word
      - id: wget-pipe-zsh
      - id: wget-pipe-ksh
      - id: wget-pipe-dash
    unless:
      - id: well-known/tool/sysadmin/alpine-packages/binary::alpine-docker-machine-binary
      - id: well-known/tool/detection/mcp-fence::context
      - id: well-known/tool/detection/cleave::cleave-static-analysis-context
