defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: postinstall-node-pipe-exec
  desc: Postinstall pipes Node output to Node
  crit: notable
  conf: 0.96
  all:
  - id: metadata/package/scripts/lifecycle::filtered-postinstall-hook
  - id: micro-behaviors/process/deploy/interpreter-stdin::postinstall-node-loader-pipe
  any:
  - id: micro-behaviors/process/create/shell/pipeline::npm-postinstall-stdin-pipe
  - id: metadata/package/scripts/command::postinstall-interpreter-command
