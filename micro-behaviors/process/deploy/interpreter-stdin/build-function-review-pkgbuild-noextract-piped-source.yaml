defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: pkgbuild-noextract-piped-source
    desc: PKGBUILD pipes a noextract source into an interpreter
    crit: suspicious
    conf: 0.93
    near_lines: 40
    all:
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-noextract-nonempty
      - id: micro-behaviors/process/create/shell/pipeline::pkgbuild-src-pipe-shell

