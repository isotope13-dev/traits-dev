traits:
  - id: curl-pipe-node-stdin
    desc: Pipes curl response into Node source input
    crit: notable
    conf: 0.9
    platforms: [linux, macos, windows]
    for: [shell, python, javascript, ruby, perl, applescript]
    if:
      type: text
      regex: '(?m)^\s*curl\s+[^|\n]{1,200}\|\s*node\s*(-)?\s*($|[;&])'

  # VBScript loaders stage the interpreter script in a process environment
  # variable and launch `cmd /v:on /c echo ^%VAR^% | !prog! -`, so the staged
  # source never appears on a command line or on disk. The escaped-percent
  # echo piped into a dash-stdin argument is the mechanism; the staged
  # content and its intent stay with the referencing composites.
  - id: env-var-cmd-echo-interpreter-stdin
    desc: Cmd echoes env variable into interpreter stdin
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [vbs, scripts]
    if:
      type: text
      regex: '(?i)cmd(\.exe)? /v:on /c echo \^%[A-Za-z_]\w{0,29}\^% \| ![A-Za-z_]\w{0,29}! -'

  - id: npm-postinstall-curl-node-stdin
    desc: Postinstall pipes curl response to Node stdin
    crit: notable
    platforms: [unix, windows]
    for: [package.json]
    conf: 0.95
    if:
      type: value
      path: scripts.postinstall
      regex: '(^|[;&])\s*curl\s+(-[fLsSk]+\s+)*https?://[^\s|;&]+\s*\|\s*node\s*$'

  - id: npm-postinstall-wget-node-stdin
    desc: Postinstall pipes wget response to Node stdin
    crit: notable
    platforms: [unix, windows]
    for: [package.json]
    conf: 0.95
    if:
      type: value
      path: scripts.postinstall
      regex: '(^|[;&])\s*wget\s+-q?O\s*-\s+https?://[^\s|;&]+\s*\|\s*node\s*$'

  - id: npm-postinstall-wayback-node-stdin
    desc: Postinstall pipes Wayback response to Node stdin
    crit: notable
    platforms: [unix, windows]
    for: [package.json]
    conf: 0.99
    if:
      type: value
      path: scripts.postinstall
      regex: '^curl( -[fLsSk]+)? https://web\.archive\.org/web/[^\s|;&]+ \| node$'

composite_rules:
  - id: npm-postinstall-http-node-stdin
    desc: Postinstall pipes an HTTP response into Node stdin
    crit: notable
    conf: 0.98
    platforms: [unix, windows]
    for: [package.json, npm, tar]
    scope: archive
    any:
      - id: npm-postinstall-curl-node-stdin
      - id: npm-postinstall-wget-node-stdin
