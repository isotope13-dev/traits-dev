defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: node-spawn-interpreter-stdin
    desc: Node spawns interpreter with stdin clues
    crit: suspicious
    conf: 0.9
    for:
      - javascript
      - typescript
    all:
      - id: metadata/file/profile/operation-reference::node-spawn-method-clues
      - id: metadata/file/profile/operation-reference::node-stdin-method-clues
      - id: metadata/lang/source/syntax/array::single-dash-array-literal
      - id: metadata/file/profile/operation-reference::node-interpreter-reference-clues
