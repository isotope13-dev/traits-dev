# A raw IP and an interpreter sink establish execution mechanics, not an
# unauthorized operation. Preserve the risk signal without convicting installers.
defaults:
  platforms: [unix]
  attack: T1105,T1059.004
composite_rules:
- id: raw-ip-curl-shell-pipeline
  desc: Raw-IP curl download piped to shell
  conf: 0.98
  crit: suspicious
  for:
  - shell
  - text
  near_bytes: 256
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  - id: micro-behaviors/communications/http/curl::curl-command-remote-url
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-command-line
  unless:
  - id: metadata/package/testing/
  - id: metadata/path/directory::test-directory-component
  - id: well-known/tool/detection/
- id: embedded-raw-ip-curl-shell-command
  desc: Embedded raw-IP curl-to-shell command
  crit: suspicious
  conf: 0.99
  for:
  - python
  - javascript
  - ruby
  - perl
  scope: file
  near_bytes: 256
  unless:
  - id: well-known/tool/detection/
  all:
  - id: micro-behaviors/communications/ip/literal::external-ipv4-http-url
  any:
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-literal
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-bash-execution
