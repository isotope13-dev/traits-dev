defaults:
  for:
  - shell
  - python
  - javascript
  - ruby
  - perl
  - applescript
  platforms:
  - windows
  - linux
  - macos
  crit: notable
  conf: 0.75
traits:
- id: wget-pipe-ruby
  desc: wget piped to ruby
  attack: T1059
  if:
    type: text
    regex: (?m)^\s*([^#\s][^\n]{0,220}\b)?wget\s+[^|\n]{0,200}\|\s*ruby\b
  unless:
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::bwat-dev-vsix
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::bwat-dev-member-path
  - id: metadata/package/testing/
  - id: well-known/tool/detection/
