# A disclosed download-to-shell pipeline is a neutral deployment capability.
# CI context and archive membership do not establish inspection evasion.
defaults:
  platforms: [unix, windows]
  for: [github-actions, tgz, zip]
  attack: T1059.004

composite_rules:
- id: gha-download-shell-pipeline
  desc: Composite action archive contains a download-to-shell pipeline
  crit: notable
  conf: 0.99
  # Composite action evidence can span the manifest and its extracted steps.
  scope: archive
  size_max: 33554432
  # The claimed stage is something an action step executes, so documentation
  # prose types stay out of scope: a release-notes line quoting a removed
  # `curl | bash` installer (Camunda's actionlint hardening changelog) is
  # history about a pipe, not a pipe an action runs. The pipe leg keeps its
  # own wider scope for its notable fact; this composite describes pipes in
  # file types that can execute one.
  for: [source, applescript, github-actions, javascript, lua, perl, php, python, ruby, shell, tgz, zip]
  all:
  - id: metadata/build/ci/step::composite-action-type
  - id: micro-behaviors/communications/http/curl::workflow-curl-http-request
  - id: micro-behaviors/process/create/shell/pipeline::curl-pipe-shell-text
  unless:
      # The size bound above was not enough: k3s (690KB) and cargo-binstall
      # (312KB) are project source trees, far under it, whose composite action
      # sits in `.github/actions/` while the `curl | sh` is their own
      # installer script. A repo-internal helper action is not the published
      # action this rule is about.
  - id: metadata/build/ci/github-actions::nested-action-manifest-path
  - id: gha-known-installer-pipe-context
  - id: micro-behaviors/os/package-manager/installer-script::install-script-pipe
  - id: micro-behaviors/os/package-manager/installer-script::getter-script-pipe
      # The pipe-to-shell in the archive is a recognized toolchain bootstrap
      # (pinned golangci-lint install.sh, NodeSource setup, ...) in a CI
      # workflow, not a stage the published action pipes into a shell.
  - id: micro-behaviors/os/package-manager/installer-script::gha-recognized-pipe-installer
      # The pipe text lives in unit-test code: a canary string asserting
      # that config serialization rejects curl-to-shell stages (or similar
      # negative fixtures). Tests never execute as action steps.
  - id: metadata/package/testing/harness/unit/
      # Security scanners include documented hostile examples in playgrounds
      # and release logs; those can otherwise combine with an unrelated action.
  - id: metadata/package/documentation/security-testing::scanner-threat-example-documentation-context

- id: gha-known-installer-pipe-context
  desc: Recognized pinned installer pipes
  crit: exception
  any:
  - id: micro-behaviors/os/package-manager/installer-script::rustup-installer-pipe
  - id: micro-behaviors/os/package-manager/installer-script::jbang-installer-pipe
  - id: micro-behaviors/os/package-manager/installer-script::pyenv-installer-pipe
