defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: postinstall-curl-pipe-shell-value
  desc: Postinstall pipes curl output to shell
  crit: suspicious
  conf: 0.96
  if:
    type: value
    path: scripts.postinstall
    regex: \bcurl\b[^"\n]{0,120}\|\s*(sh|bash)\b
  unless:
  - id: well-known/tool/detection/agent/agent-audit-kit::scanner-context
  - id: metadata/package/testing/corpus/security-tests::inert-scanner-attack-corpus
  - id: well-known/tool/development/lint/linter::golangci-download-pipe-script
  - id: well-known/tool/development/lint/linter::actionlint-download-pipe-script
