defaults:
  platforms: [windows, unix]
composite_rules:
  - id: js-python-stdin-payload-exec
    desc: Spawned interpreter receives stdin payload
    crit: suspicious
    conf: 0.94
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/process/stdio/write::js-stdin-write
      - id: metadata/lang/source/naming/variable::exec-bin-text
      - id: micro-behaviors/process/create/exec::child-process-member-spawn
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: well-known/lib/platform/raycast-api/

