defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: node-python-standalone-stdin-clues
    desc: Python distribution reference and stdin exec
    crit: suspicious
    conf: 0.95
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/communications/http/download/helper::python-standalone-release-reference
      - id: micro-behaviors/process/deploy/interpreter-stdin::node-spawn-interpreter-stdin
