defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: node-execsync-curl-pipe-python
    desc: Node shell pipes curl downloads into Python
    if:
      type: symbol
      kind: call
      substr: execSync
      arg:
        kind: string
        regex: '\bcurl\s+[^|\n]{0,120}\|\s*python[23]?\b'
