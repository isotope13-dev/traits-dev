defaults:
  platforms:
  - macos
  for:
  - html
  - markdown
  - javascript
  - typescript
  crit: notable
composite_rules:
- id: base64-decode-near-shell-execution
  for:
  - html
  - javascript
  - typescript
  desc: Base64 decode option near shell execution text
  conf: 0.92
  all:
  - id: micro-behaviors/data/decode/command::base64-decode-command-option
  any:
  - id: micro-behaviors/process/create/shell/pipeline::text-shell-pipe-sink
  - id: micro-behaviors/process/create/shell/command-mode::embedded-sh-c-text
  - id: micro-behaviors/process/create/shell/command-string::do-shell-script-web-text
  near_lines: 1
