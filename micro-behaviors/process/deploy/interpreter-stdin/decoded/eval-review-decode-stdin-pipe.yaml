# A pipeline hands a NEW interpreter its source on stdin: `base64 -d | python3`
# and siblings. This is the stdin sibling of python-inline-command's `python -c`
# and heredoc forms, and a standard "hidden quick fix" one-liner in agent-skill
# documentation, so prose types stay in scope alongside the shells. The decode
# step is the point: the source text is not visible in the document.
defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]

traits:
  - id: decoded-stdin-interpreter
    desc: Base64 decode piped to an interpreter
    for: [shell, github-actions, markdown, text, python, applescript]
    if:
      type: text
      regex: '\bbase64\s+(-[dD]|--decode)\s*\|\s*(python3?|perl|ruby|node)\b'
