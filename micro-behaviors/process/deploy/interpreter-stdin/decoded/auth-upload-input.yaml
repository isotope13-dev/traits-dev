defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: literal-shell-auth-upload-input
    desc: Shell input contains auth-file upload clues
    crit: suspicious
    conf: 0.98
    # The AST emits the quoted literal itself. Decoded evidence points to its
    # content start, one byte later. A different literal cannot join this span.
    near_bytes: 2
    all:
      - id: literal-base64-decoded-shell-pipeline
      - id: micro-behaviors/communications/http/upload/file::encoded-curl-form-file-attachment
      - id: micro-behaviors/communications/url/encoded::encoded-http-url
    any:
      - id: micro-behaviors/fs/path/secret-config::encoded-asterisk-auth-config-path
      - id: micro-behaviors/fs/path/secret-config::postfix-relay-password-path
