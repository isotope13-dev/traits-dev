# Require a parsed literal/decoder/interpreter pipeline. Producer-specific
# shadow exclusions must not suppress the other producer. Emit the literal
# offset so consumers can join decoded evidence to this exact input.
defaults:
  platforms:
  - unix
  for:
  - shell
  crit: suspicious
traits:
- id: literal-base64-printf-shell-pipeline
  desc: printf decodes a literal into a shell
  conf: 0.98
  if:
    type: tree-sitter
    language: shell
    query: |
      ((pipeline
        . (command name: (command_name) @producer
          argument: (raw_string) @format
          . argument: [(raw_string) (string)] @blob @evidence .)
        . "|" . (command name: (command_name) @decoder
          argument: (word) @decode .)
        . "|" . (command name: (command_name) @shell .) .)
        (#eq? @producer "printf") (#eq? @format "'%s'")
        (#match? @blob "^[\"'][A-Za-z0-9+/]{40,}={0,2}[\"']$")
        (#eq? @decoder "base64") (#match? @decode "^(-d|--decode|-D)$")
        (#match? @shell "^(/bin/)?(sh|bash|zsh|dash)$"))
  unless:
  - type: symbol
    kind: function
    exact: printf
  - type: symbol
    kind: function
    exact: base64
  - type: symbol
    kind: function
    exact: sh
  - id: metadata/lang/source/naming/function/command::shell-bash-function-definition
  - type: symbol
    kind: function
    exact: zsh
  - type: symbol
    kind: function
    exact: dash
- id: literal-base64-echo-shell-pipeline
  desc: echo decodes a literal into a shell
  conf: 0.98
  if:
    type: tree-sitter
    language: shell
    query: |
      ((pipeline
        . (command name: (command_name) @producer
          . argument: (word) @option
          . argument: [(raw_string) (string)] @blob @evidence .)
        . "|" . (command name: (command_name) @decoder
          argument: (word) @decode .)
        . "|" . (command name: (command_name) @shell .) .)
        (#eq? @producer "echo") (#eq? @option "-n")
        (#match? @blob "^[\"'][A-Za-z0-9+/]{40,}={0,2}[\"']$")
        (#eq? @decoder "base64") (#match? @decode "^(-d|--decode|-D)$")
        (#match? @shell "^(/bin/)?(sh|bash|zsh|dash)$"))
      ((pipeline
        . (command name: (command_name) @producer
          . argument: [(raw_string) (string)] @blob @evidence .)
        . "|" . (command name: (command_name) @decoder
          argument: (word) @decode .)
        . "|" . (command name: (command_name) @shell .) .)
        (#eq? @producer "echo")
        (#match? @blob "^[\"'][A-Za-z0-9+/]{40,}={0,2}[\"']$")
        (#eq? @decoder "base64") (#match? @decode "^(-d|--decode|-D)$")
        (#match? @shell "^(/bin/)?(sh|bash|zsh|dash)$"))
  unless:
  - type: symbol
    kind: function
    exact: echo
  - type: symbol
    kind: function
    exact: base64
  - type: symbol
    kind: function
    exact: sh
  - id: metadata/lang/source/naming/function/command::shell-bash-function-definition
  - type: symbol
    kind: function
    exact: zsh
  - type: symbol
    kind: function
    exact: dash
composite_rules:
- id: literal-base64-decoded-shell-pipeline
  desc: Decodes literal base64 directly into shell
  conf: 0.98
  any:
  - id: literal-base64-printf-shell-pipeline
  - id: literal-base64-echo-shell-pipeline
