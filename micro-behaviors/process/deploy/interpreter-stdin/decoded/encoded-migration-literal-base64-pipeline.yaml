defaults:
  platforms: [unix]
  for: [shell]
  crit: suspicious
traits:
  - id: literal-base64-decoded-shell-pipeline
    desc: Decodes literal base64 directly into shell
    conf: 0.98
    if:
      type: tree-sitter
      language: shell
      query: |
        ((pipeline
          . (command name: (command_name) @producer
            argument: (raw_string) @format
            . argument: (raw_string) @blob .)
          . "|" . (command name: (command_name) @decoder
            argument: (word) @decode .)
          . "|" . (command name: (command_name) @shell .) .) @pipeline
          (#eq? @producer "printf") (#eq? @format "'%s'")
          (#match? @blob "^'[A-Za-z0-9+/]{40,}={0,2}'$")
          (#eq? @decoder "base64") (#match? @decode "^(-d|--decode)$")
          (#match? @shell "^(sh|bash|zsh|dash)$"))
    unless:
      - {type: symbol, kind: function, exact: printf}
      - {type: symbol, kind: function, exact: base64}
      - {type: symbol, kind: function, exact: sh}
      - id: metadata/lang/source/naming/function/command::shell-bash-function-definition
      - {type: symbol, kind: function, exact: zsh}
      - {type: symbol, kind: function, exact: dash}
