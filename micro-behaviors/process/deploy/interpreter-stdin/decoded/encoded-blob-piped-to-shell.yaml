defaults:
  platforms: [unix]
  for: [scripts, source, makefile, dockerfile, text, pbxproj]
  crit: notable
  conf: 0.9

composite_rules:
  - id: encoded-blob-piped-to-shell
    attack: T1027,T1059.004
    mbc: B0032
    desc: Encoded blob and shell-pipe clues
    crit: suspicious
    conf: 0.95
    near_lines: 2
    all:
      - id: micro-behaviors/data/stream/transfer::encoded-blob-piped-onward
      - id: metadata/lang/source/syntax/command/pipeline::shell-pipe-token
    # The inner decoder supplies curl's URL; only the HTTP response reaches
    # the outer shell. This is covered by the encoded-destination loader.
    unless:
      - id: metadata/package/documentation/security-testing::python-rule-exploit-example
      - id: micro-behaviors/process/create/shell/pipeline::curl-decoded-destination-shell-stdin
      - id: metadata/path/directory::test-directory-component
      # Security-scanner rule-catalog YAML files embed hostile patterns and
      # hostile example fixtures as detector definitions (curl|bash,
      # base64-to-shell); the catalog is inert data, not a pipeline.
      - id: metadata/file/catalog/pattern-rules::yaml-pattern-rule-list
      - id: metadata/package/documentation/page::documentation-web-page
      - id: metadata/package/testing/harness/unit::go-test-source-file
