# Decoder-to-shell transport alone need not conceal an embedded payload.
# The anti-static rule additionally requires an inline hex literal.
defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: xxd-hexdecode-shell-stdin
    desc: xxd-to-shell pipeline command text
    crit: notable
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: '\bxxd\s+(-r[^|\n]{0,16}|-p(s)?\s+-r|-rp|-pr)\s*\|\s*(/[\w./-]{1,80}/)?(ba|da|a|z|k)?sh\b'
