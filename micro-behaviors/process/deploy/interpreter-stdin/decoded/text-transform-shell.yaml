# Text-transform decoder pipelines into shell stdin (rev string reversal and
# tr character rotation). Bare pipeline transport is a notable capability and
# command observation; anti-static obfuscation rules additionally require an
# inline concealed literal and an actual shell script or host launch site.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, build, github-actions]
  crit: notable

traits:
  - id: rev-reverse-shell-stdin
    desc: rev string-reversal pipeline feeds a shell
    conf: 0.9
    if:
      type: text
      regex: '\|\s*rev\s*\|\s*(/(usr/)?bin/)?([bd]a|[zk])?sh\b'

  - id: tr-rotate-shell-stdin
    desc: tr character-rotation pipeline feeds a shell
    conf: 0.88
    # Same-case wraparound (ZA or za) distinguishes Caesar/ROT alphabet
    # rotations (N-ZA-Mn-za-m, n-za-m, d-za-c) from plain case folding (A-Z a-z).
    if:
      type: text
      regex: '\|\s*tr +\S*[Aa]-[Zz]\S* +\S*(ZA|za)\S*\s*\|\s*(/(usr/)?bin/)?([bd]a|[zk])?sh\b'

  - id: literal-rev-herestring-shell-stdin
    desc: Here-string literal reversed into shell stdin
    conf: 0.92
    if:
      type: text
      regex: 'rev *<<< *([''"][^\n]{2,160}[''"]|[^|;\n$]{2,80}) *\| *(/bin/)?([bd]a|[zk])?sh\b'

  - id: literal-tr-herestring-shell-stdin
    desc: Here-string rotated by tr into shell stdin
    conf: 0.92
    if:
      type: text
      regex: 'tr +\S*[Aa]-[Zz]\S* +\S*(ZA|za)\S* *<<< *[^\n]{2,160}\| *(/bin/)?(ba|da|z)?sh\b'

composite_rules:
  - id: literal-rev-echo-shell-stdin
    desc: Inline literal reversed into shell stdin
    conf: 0.92
    near_lines: 1
    all:
      - id: micro-behaviors/data/string/transform::literal-rev-producer
      - id: rev-reverse-shell-stdin

  - id: literal-rev-shell-stdin
    desc: Reversed inline literal feeds a shell
    conf: 0.92
    any:
      - id: literal-rev-echo-shell-stdin
      - id: literal-rev-herestring-shell-stdin

  - id: literal-tr-echo-shell-stdin
    desc: Inline literal rotated by tr into shell stdin
    conf: 0.9
    near_lines: 1
    all:
      - id: micro-behaviors/data/string/transform::literal-tr-producer
      - id: tr-rotate-shell-stdin

  - id: literal-tr-rotate-shell-stdin
    desc: Rotated inline literal feeds a shell
    conf: 0.9
    any:
      - id: literal-tr-echo-shell-stdin
      - id: literal-tr-herestring-shell-stdin
