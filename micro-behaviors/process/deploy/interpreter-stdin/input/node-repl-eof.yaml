defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: detached-node-repl-stdin-eof-bypass
    desc: Detached Node REPL with stdin EOF-bypass clues
    crit: suspicious
    conf: 0.96
    near_bytes: 2048
    all:
      - id: micro-behaviors/process/create/exec::node-interactive-mode-spawn
      - id: micro-behaviors/process/daemonize/spawn::node-spawn-detached-option
      - id: micro-behaviors/process/stdio/write::node-stdin-end-listener-removal-code
      - id: micro-behaviors/process/control/wait::node-unref-handle
