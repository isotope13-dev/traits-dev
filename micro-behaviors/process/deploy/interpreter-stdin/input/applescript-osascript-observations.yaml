defaults:
  for: [source]
  platforms:
    - macos
    - ios
  attack: T1059.002
traits:
  - id: osascript-stdin
    desc: osascript reading from stdin
    crit: suspicious
    conf: 0.9
    for: [shell, applescript]
    if:
      type: text
      regex: '(?m)(^|[|;&]\s*)(/usr/bin/)?osascript\s+-\s*($|[|;&])'
  - id: pipe-osascript
    desc: Pipe output to osascript
    crit: notable
    conf: 0.9
    for: [shell, applescript, macho]
    if:
      type: text
      regex: \|\s*osascript\b
