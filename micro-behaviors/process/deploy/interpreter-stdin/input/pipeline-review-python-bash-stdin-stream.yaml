defaults:
  crit: notable
  platforms: [unix]
  for: [shell]
traits:
- id: python-bash-stdin-stream
  desc: Python run supplies stdin to bash argument
  crit: notable
  conf: 0.92
  for: [python]
  if:
    type: tree-sitter
    kind: call
    regex: '(?s)run\(\s*\[\s*bash\s*\][^)]{0,240}\bstdin\s*='
