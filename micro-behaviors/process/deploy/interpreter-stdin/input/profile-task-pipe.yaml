---
defaults:
  crit: notable
  conf: 0.9
  attack: T1059
  platforms:
  - windows
  - unix
  for:
  - json
traits:
- id: vscode-task-pipes-shell
  desc: Task command pipes into shell
  if:
    type: value
    path: tasks[*].command
    regex: "\\|\\s*(sh|bash|cmd)\\b"
    case_insensitive: true
- id: vscode-task-os-pipes-shell
  desc: Per-OS Task command pipes into shell
  if:
    type: value
    path: tasks[*].*.command
    regex: "\\|\\s*(sh|bash|cmd)\\b"
    case_insensitive: true
composite_rules:
- id: vscode-task-pipes-shell-any-os
  desc: Any-OS Task command pipes into shell
  any:
  - id: vscode-task-pipes-shell
  - id: vscode-task-os-pipes-shell
