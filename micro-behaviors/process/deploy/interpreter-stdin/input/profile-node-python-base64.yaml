defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: node-python-distribution-stdin-base64-clues
    desc: Python distribution, stdin and Base64 clues
    crit: suspicious
    conf: 0.95
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/process/deploy/runtime::interpreter-download-exec-api-profile
      - id: micro-behaviors/process/deploy/interpreter-stdin/input::node-spawn-interpreter-stdin
      - id: micro-behaviors/data/encoding/base64::node-base64-buffer-clues
