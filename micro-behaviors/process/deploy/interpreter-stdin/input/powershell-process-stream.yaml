defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
traits:
  - id: powershell-process-filename
    desc: Sets PowerShell as process executable
    if:
      type: text
      regex: '(?i)\.FileName\s*=\s*["''](powershell|pwsh)(\.exe)?["'']'
      exclude_comments: true
  - id: powershell-process-stdin-arguments
    desc: Sets process arguments to stdin script
    if:
      type: text
      regex: '(?i)\.Arguments\s*=\s*["''](-|-Command\s+-)["'']'
      exclude_comments: true
composite_rules:
  - id: powershell-process-stdin-script
    desc: PowerShell stdin script configuration beside stream writes
    near_lines: 16
    all:
      - id: powershell-process-filename
      - id: powershell-process-stdin-arguments
      - id: micro-behaviors/process/stdio/configure::powershell-redirect-standard-input
      - id: micro-behaviors/process/stdio/write::powershell-child-stdin-stream-write
