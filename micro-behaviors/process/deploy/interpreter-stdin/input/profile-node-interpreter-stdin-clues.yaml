defaults:
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
composite_rules:
  - id: node-spawn-interpreter-stdin
    desc: Node spawn and interpreter stdin clues
    crit: notable
    conf: 0.9
    for:
      - javascript
      - typescript
    all:
      - id: micro-behaviors/process/create/subprocess/launch::node-spawn-method-clues
      - id: micro-behaviors/process/stdio/write::node-stdin-method-clues
      - id: metadata/lang/source/syntax/array::single-dash-array-literal
      - id: micro-behaviors/process/interpreter/scripting::node-interpreter-reference-clues
