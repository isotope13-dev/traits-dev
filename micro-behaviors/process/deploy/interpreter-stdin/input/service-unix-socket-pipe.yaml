traits:
  - id: service-unix-netcat-pipe-shell
    desc: Service pipes Unix socket input into shell
    crit: notable
    conf: 0.95
    for: [systemd-service]
    platforms: [linux]
    if:
      type: value
      path: service.exec_start
      regex: >-
        ^(/bin/)?sh -c ['"][^|]*\|\s*nc -Uu? [^|]+\|\s*(ba)?sh['"]$
