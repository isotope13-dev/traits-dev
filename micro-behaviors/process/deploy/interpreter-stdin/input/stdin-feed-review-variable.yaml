defaults:
  platforms: [unix]
  for: [shell, scripts]
  crit: notable
  conf: 0.85
  attack: T1059.006
traits:
  - id: php-snippet-piped-into-php-stdin
    desc: PHP snippet piped into php standard input
    if:
      type: text
      # Close the quoted snippet before the pipe. A regex alternation such
      # as /<\?(?:xml|php|asp)/ is not an interpreter pipeline.
      regex: '<\?php[^|\n]{0,300}[''"]\s*\|\s*[''"]?[\w/.-]*php\b'
