defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: node-execsync-curl-shell-stdin
  desc: Node runs curl-to-shell stdin pipeline
  crit: notable
  conf: 0.99
  attack: T1059.004
  if:
    type: symbol
    kind: call
    regex: (^|\.)execSync$
    arg:
      index: 0
      kind: string
      regex: ^curl\b[^;\n]{0,160}\|\s*(ba|z)?sh\b
