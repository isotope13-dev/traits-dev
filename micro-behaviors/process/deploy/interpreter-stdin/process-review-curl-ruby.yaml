defaults:
  platforms: [windows, linux, macos]
  for: [shell, python, javascript, ruby, perl, applescript]
traits:
  - id: curl-pipe-ruby-stdin
    desc: Curl output piped to Ruby stdin
    crit: notable
    conf: 0.75
    unless:
      - id: well-known/lib/runtime/scripted/jruby::archive-basename
      - id: well-known/lib/runtime/scripted/jruby::embedded-runtime-member
      - id: well-known/lib/runtime/scripted/jruby::embedded-runtime-path
      - id: well-known/lib/runtime/scripted/jruby::jruby-home-path
      - id: well-known/lib/runtime/scripted/jruby::module-marker
      - id: well-known/lib/runtime/scripted/jruby::stdlib-archive-marker
    if:
      type: text
      regex: curl\s+.{0,200}\|\s*ruby
    not:
      - substr: encoding.spec.whatwg.org/encodings.json
      - substr: example.com
