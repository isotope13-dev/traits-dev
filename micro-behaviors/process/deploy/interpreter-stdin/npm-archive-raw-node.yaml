defaults:
  for: [package.json]
  platforms: [unix, windows]
traits:
  - id: preinstall-archive-raw-node-pipeline
    desc: Preinstall archive-proxy raw-source Node pipe
    crit: notable
    conf: 0.99
    if:
      type: value
      path: scripts.preinstall
      regex: '^curl .{0,20}https://web\.archive\.org/web/https?://[^|]{1,200}/raw[^|]{0,80}\| *node$'
composite_rules:
  - id: preinstall-archive-raw-node-stdin
    desc: Preinstall pipes archived raw source to Node
    crit: notable
    conf: 0.98
    all:
      - id: preinstall-archive-raw-node-pipeline
      - id: metadata/package/scripts/lifecycle::has-preinstall-script
      - id: micro-behaviors/communications/http/curl::npm-preinstall-curl
      - id: micro-behaviors/process/interpreter/node::npm-preinstall-stdin-pipe
