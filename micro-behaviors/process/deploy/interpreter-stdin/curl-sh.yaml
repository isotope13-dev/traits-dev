traits:
- id: curl-pipe-cmd-literal
  desc: Literal pipes download into cmd
  conf: 0.93
  for:
  - python
  - javascript
  - typescript
  - go
  - rust
  - ruby
  - php
  - java
  platforms:
  - windows
  attack: T1059.003
  if:
    type: literal
    regex: (?i)\b(curl|wget)\b[^|\n]{1,220}\|\s*cmd(\.exe)?\b
- id: curl-pipe-cmd-command-line
  desc: Command pipes download into cmd
  conf: 0.92
  for:
  - batch
  platforms:
  - windows
  attack: T1059.003
  if:
    type: text
    regex: \b(curl|wget)\b[^|\n]{1,220}\|\s*cmd(\.exe)?\b
- id: curl-pipe-sh-command
  desc: curl piped to sh
  conf: 0.7
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/lang/source/syntax/key-value::security-rule-runtime-script-floating-url
  - id: metadata/build
  - type: basename
    regex: ^(METADATA|PKG-INFO)$
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: well-known/lib/runtime/compiled/wasmer::wasmer-installer-prompt
  - id: metadata/file/extension/identity::rust-source-extension
  - id: well-known/tool/packaging/uv::uv-install-sh-bootstrap-url
  if:
    type: text
    regex: (?m)^[[:space:]]*(/bin/sh\s+-c\s+)?curl\s+.{0,160}\|\s*sh\b
  not:
  - regex: curl\s+.{0,200}npmjs\.org/install\.sh.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}npmjs\.com/install\.sh.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}rustwasm\.github\.io/wasm-pack/installer/init\.sh.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}install\.fuel\.sh.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}install\.fuel\.network.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}golangci-lint\.run/install\.sh.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}raw\.githubusercontent\.com/golangci/golangci-lint/.{0,80}/install\.sh.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}raw\.githubusercontent\.com/securego/gosec/.{0,80}/install\.sh.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}raw\.githubusercontent\.com/anchore/syft/.{0,80}/install\.sh.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}aka\.ms/apm-unix.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}astral\.sh.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}raw\.githubusercontent\.com/fredericrous/amont/.{0,80}/install\.sh.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}raw\.githubusercontent\.com/(creationix|nvm-sh)/nvm/.{0,80}/install\.sh.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}yarnpkg\.com/install\.sh.{0,200}\|\s*sh\b
  - regex: curl\s+-LsSf\s+\.\.\.\s*\|\s*sh\b
  - regex: curl\s+.{0,80}\{UV_INSTALL_URL\}\s*\|\s*sh\b
  - regex: curl\s+.{0,200}ollama\.com.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}rustup\.rs.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}get\.docker\.com.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}get\.k3s\.io.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}docs\.chainloop\.dev/install\.sh.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}dl\.chainloop\.dev/cli/install\.sh.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}tailscale\.com/install\.sh.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}install\.julialang\.org.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}nixos\.org/nix/install.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}mise\.(run|jdx\.dev).{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}create-awesome-vlang-app\.vercel\.app.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}karajancode\.com/install\.sh.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}raw\.githubusercontent\.com/manufosela/karajan-code/.{0,80}/scripts/install-binary\.sh.{0,200}\|\s*sh\b
  - regex: curl\s+.{0,200}opencode\.ai/install.{0,200}\|\s*(sh|bash)\b
  - regex: window\.location\.origin[^\n]{0,80}install\.sh\s*\|\s*sh\b
  platforms:
  - windows
  - linux
  - macos
  for:
  - shell
  - python
  - javascript
  - ruby
  - perl
  - applescript
- id: download-options-pipe-sh
  desc: Downloader options piped into sh
  conf: 0.95
  if:
    type: text
    regex: (?m)^[[:space:]]*[^#\n]{0,80}\b(curl\s+-[so]|wget\s+-[qO])\s+[^|\n]{0,50}\|\s*sh\b
  unless:
  - id: metadata/package/freeform::pkg-description-content-type-markdown
  not:
  - substr: apt.u.doover.com/install.sh
  platforms:
  - unix
  for:
  - shell
defaults:
  attack: T1059.004
  crit: notable
