defaults:
  platforms: [unix]
  for: [javascript, typescript]
traits:
  # Callback bodies are not always projected into the source flow graph.
  # Bind the command initializer to the exec argument in the same block.
  - id: node-concatenated-curl-shell-command
    desc: Executes concatenated curl-to-shell command
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (_ (variable_declarator name: (identifier) @execute
            value: (member_expression
              object: (call_expression function: (identifier) @require
                arguments: (arguments (string (string_fragment) @library)))
              property: (property_identifier) @api)))
          (_ (variable_declarator
            name: (identifier) @command
            value: (binary_expression) @pipeline))
          .
          [(variable_declaration) (lexical_declaration)]*
          .
          (expression_statement (call_expression
            function: (identifier) @called
            arguments: (arguments (identifier) @argument))))
          (#eq? @require "require")
          (#match? @library "^(node:)?child_process$")
          (#match? @api "^exec(Sync)?$")
          (#eq? @execute @called)
          (#eq? @command @argument)
          (#match? @pipeline "curl[ \\t]+")
          (#match? @pipeline "[|][ \\t]*(/(usr/)?bin/)?(ba|z)?sh\\b")
          (#set! cleave.ignore-comments "true"))
