defaults:
  platforms:
  - macos
composite_rules:
- id: dmg-curl-shell-background
  desc: Disk image contains background curl and curl-to-shell text
  crit: suspicious
  conf: 0.96
  attack: T1105,T1059.004
  for:
  - dmg
  scope: archive
  all:
  - id: micro-behaviors/communications/http/download/cli::dmg-nohup-silent-curl
  - id: micro-behaviors/process/create/shell/pipeline::dmg-curl-piped-bash
