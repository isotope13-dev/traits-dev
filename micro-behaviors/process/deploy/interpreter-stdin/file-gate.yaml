defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.98

traits:
  - id: shell-file-gated-curl-to-shell
    desc: File-test branch pipes curl response to shell
    if:
      type: tree-sitter
      query: |
        ((if_statement
          condition: (test_command) @test
          (pipeline
            (command name: (command_name) @fetch)
            . (command name: (command_name) @shell)) @pipe) @branch
          (#match? @test "^\\[\\s+-[ef]\\s+")
          (#eq? @fetch "curl")
          (#match? @shell "^(/bin/)?(ba)?sh$")
          (#match? @pipe "https?://"))
