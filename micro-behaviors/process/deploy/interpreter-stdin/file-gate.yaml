defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.98

traits:
  - id: shell-file-gated-curl-to-shell
    desc: File-test branch pipes curl response to shell
    unless:
      - id: metadata/lang/source/naming/function/command::shell-curl-function-definition
      - {type: symbol, kind: function, exact: sh}
      - {type: symbol, kind: function, exact: bash}
      - id: metadata/lang/source/naming/function/command::shell-nohup-function-definition
    if:
      type: tree-sitter
      query: |
        ((if_statement
          condition: (test_command) @test
          [
            (pipeline
              (command name: (command_name) @fetch) @download
              . (command name: (command_name) @shell)) @pipe
            (redirected_statement body: (pipeline
              (command name: (command_name) @fetch) @download
              . (command name: (command_name) @shell)) @pipe)
          ]) @branch
          (#match? @test "^\\[\\s+-[ef]\\s+")
          (#match? @fetch "^(nohup|(/usr/bin/)?curl)$")
          (#match? @download "^(?:nohup\\s+)?(?:/usr/bin/)?curl(?:\\s+(?:-[fsSLv]+|--(?:silent|show-error|fail|location)))*\\s+['\"]?https?://[^\\s'\"]+['\"]?$")
          (#match? @shell "^(/(usr/)?bin/)?(ba)?sh$"))
