defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: published-calendar-to-shell
    desc: Downloads calendar bytes into shell stdin
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: shell
      query: |
        (program
          (variable_assignment name: (variable_name) @variable
            value: (string (string_content) @url))
          . (command name: (command_name (word) @curl)
            . argument: (word) @flags
            . argument: (string (simple_expansion (variable_name) @used_variable))
            . argument: (word) @output
            . argument: (word) @destination .)
          . (pipeline
            . (command name: (command_name (word) @cat)
              . argument: (word) @input .)
            . (command name: (command_name (word) @shell)
              . argument: (word) @stdin .) .)
          (#eq? @variable @used_variable)
          (#match? @url "^https?://([a-z0-9-]+\\.)?caldav\\.icloud\\.com/published/")
          (#eq? @curl "curl") (#match? @flags "^-[fsSL]+$")
          (#match? @output "^(-o|--output)$")
          (#eq? @destination @input) (#eq? @cat "cat")
          (#match? @shell "^(/(usr/)?bin/)?(zsh|bash|sh|ksh)$")
          (#eq? @stdin "-s"))
