defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: "T1059.007,T1105"
  mbc: "B0024"
traits:
- id: preinstall-curl-piped-node
  desc: Preinstall pipes curl output directly into Node
  crit: suspicious
  conf: 0.99
  if:
    type: value
    path: "scripts.preinstall"
    regex: '(?is)^\s*curl\b[^|;&#]{0,160}\bhttps?://[^|;&#]{1,180}\|\s*node(js)?(\s+-)?\s*$'
