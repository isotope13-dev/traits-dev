# Thread-start and download/launch code co-occur; thread-to-payload flow is unproven.
defaults:
  platforms:
  - windows
  for:
  - python
composite_rules:
- id: python-thread-start-download-launch-code
  desc: Download/launch with module thread-start code
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/process/create/thread::module-level-thread-start
  - id: micro-behaviors/process/deploy::python-urlretrieve-interpreter-same-path
  - id: micro-behaviors/process/create/subprocess::pythonw-windowless-subprocess-code
