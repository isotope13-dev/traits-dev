defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-embedded-image-run-export-thunk
    desc: Embedded x86 image mapper invokes run export
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .data
      # Position-independent mapper thunk passes run to its export resolver,
      # then invokes the resolved address with the caller's context pointer.
      pattern: '55 8B EC 57 8B 7D 08 E8 ?? ?? ?? ?? 5F 5D C3 55 8B EC 51 8D 45 FC 50 C7 45 FC 72 75 6E 00 E8 ?? ?? ?? ?? 59 C9 C3'
