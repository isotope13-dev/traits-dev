defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: curl-base64-temp-exe-start
  desc: Starts curl-decoded TEMP .exe basename
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule bound_flow {\n strings:\n\n$fetch = /\\$[A-Za-z_][A-Za-z0-9_]{0,23}=curl(\\.exe)? [^;\\r\\n|&]{0,80}https?:\\\
      /\\/[^'\";\\s|&]{1,200};/ nocase\n$assign = /\\$[A-Za-z_][A-Za-z0-9_]{0,23}=curl/ nocase\n$save = /\\[IO\\\
      .File\\]::WriteAllBytes\\('%temp%\\\\[A-Za-z0-9_.-]{1,80}\\.exe',\\s*\\[Convert\\]::FromBase64String\\(\\\
      $[A-Za-z_][A-Za-z0-9_]{0,23}\\)\\)/ nocase\n$dst = /'%temp%\\\\[A-Za-z0-9_.-]{1,80}\\.exe'/ nocase\n$decode\
      \ = /FromBase64String\\(\\$[A-Za-z_][A-Za-z0-9_]{0,23}\\)/ nocase\n\n$run = /start [A-Za-z0-9_.-]{1,80}\\\
      .exe/ nocase\n\n $cwd = /(^|\\n)(cd|chdir) (\\/d )?%temp%(\\r?\\n)/ nocase\n$cwdchange = /(^|\\n)(cd|chdir|pushd|popd)(\
      \ |\\r?\\n)/ nocase\n\n$pscopy = /copy \\/y %windir%\\\\System32\\\\WindowsPowerShell\\\\v1\\.0\\\\powershell\\\
      .exe [A-Za-z0-9_.-]{1,60}\\.exe >nul/ nocase\n$psdest = /[A-Za-z0-9_.-]{1,60}\\.exe >nul/ nocase\n$pspipe\
      \ = /\\| [A-Za-z0-9_.-]{1,60}\\/(W 1 \\/)?Comm -/ nocase\n$psargs = /\\/(W 1 \\/)?Comm -/ nocase\n$echo =\
      \ /(^|\\n)echo / nocase\n\ncondition:\n\n#fetch > 0 and #fetch <= 16 and #assign <= 16 and #save <= 16 and\
      \ #dst <= 32 and #decode <= 32 and\nfor any a in (1..#fetch) : (\n for any b in (1..#assign) : (\n  @assign[b]\
      \ == @fetch[a] and\n  for any c in (1..#save) : (\n   @save[c] == @fetch[a] + !fetch[a] and\n   for any d\
      \ in (1..#dst) : (\n    @dst[d] == @save[c] + 25 and\n    for any e in (1..#decode) : (\n     @decode[e] >\
      \ @dst[d] + !dst[d] and @decode[e] + !decode[e] + 1 == @save[c] + !save[c] and\n     !assign[b] - 5 == !decode[e]\
      \ - 18 and\n     for all k in (0..!assign[b]-6) : ((uint8(@assign[b]+k) | 32) == (uint8(@decode[e]+17+k) |\
      \ 32))\n\nand #pscopy > 0 and #pscopy <= 16 and #psdest <= 32 and #pspipe <= 32 and #psargs <= 32 and #echo\
      \ <= 32 and\nfor any ca in (1..#pscopy) : (\n (@pscopy[ca] == 0 or uint8(@pscopy[ca]-1) == 10) and @pscopy[ca]+!pscopy[ca]\
      \ < @fetch[a] and\n for any cb in (1..#psdest) : (\n  @psdest[cb] > @pscopy[ca] and @psdest[cb]+!psdest[cb]\
      \ == @pscopy[ca]+!pscopy[ca] and\n  for any cc in (1..#pspipe) : (\n   @pspipe[cc] >= @save[c]+!save[c] and\
      \ @pspipe[cc]-(@save[c]+!save[c]) <= 16 and\n   for all ws in (@save[c]+!save[c]..@pspipe[cc]-1) : (uint8(ws)\
      \ == 32 or uint8(ws) == 9) and\n   for any cd in (1..#psargs) : (\n    @psargs[cd] > @pspipe[cc]+2 and @psargs[cd]+!psargs[cd]\
      \ == @pspipe[cc]+!pspipe[cc] and\n    @psargs[cd]-@pspipe[cc]-2 == !psdest[cb]-9 and\n    for all cp in (0..!psdest[cb]-10)\
      \ : ((uint8(@psdest[cb]+cp) | 32) == (uint8(@pspipe[cc]+2+cp) | 32)) and\n    for any ce in (1..#echo) : (\n\
      \     @echo[ce]+!echo[ce] <= @fetch[a] and @pspipe[cc]-(@echo[ce]+!echo[ce]) < 768 and\n     for all cl in\
      \ (@echo[ce]+!echo[ce]..@pspipe[cc]-1) : (uint8(cl) != 10 and uint8(cl) != 13)\n    )\n   )\n  )\n )\n)\n\n\
      \     \nand #cwd > 0 and #cwd <= 16 and #cwdchange <= 32 and #run > 0 and #run <= 16 and\nfor any f in (1..#run)\
      \ : (\n for any h in (1..#cwd) : (\n  @cwd[h]+!cwd[h] <= @save[c] and\n  for all j in (1..#cwdchange) : (@cwdchange[j]\
      \ <= @cwd[h] or @cwdchange[j] >= @run[f])\n ) and\n @run[f] > @save[c] + !save[c] and @run[f] - @save[c] <\
      \ 1024 and\n ( @run[f] == 0 or uint8(@run[f]-1) == 10 ) and\n ( @run[f]+!run[f] == filesize or uint8(@run[f]+!run[f])\
      \ == 13 or uint8(@run[f]+!run[f]) == 10 ) and\n !run[f]-6 == !dst[d]-9 and\n for all k in (0..!run[f]-7) :\
      \ ((uint8(@run[f]+6+k) | 32) == (uint8(@dst[d]+8+k) | 32))\n)\n\n    )\n   )\n  )\n )\n)\n\n}"
