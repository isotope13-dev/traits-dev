defaults:
  platforms:
    - "windows"
  for:
    - "batch"
traits:
  - 
    id: "batch-temp-module-entry-call"
    desc: "Temporary executable invokes module export"
    crit: "notable"
    conf: 0.96
    if:
      type: "text"
      regex: "(?im)^\\s*%temp%\\\\[^\\s\\r\\n]{1,80}\\.exe\\s+%[^%\\r\\n]{1,40}%,(%[^%\\r\\n]{1,40}%|#[0-9]+)\\s*$"
  - 
    id: "batch-temp-exe-data-argument"
    desc: "Calls temporary executable with data-named file"
    crit: "notable"
    conf: 0.96
    if:
      type: "text"
      regex: "(?im)^\\s*call\\s+%temp%\\\\[^\\s\\r\\n]{1,80}\\.exe\\s+[^\\s\\r\\n]{1,160}\\.(asc|dat|png|jpg)\\s*$"
