defaults:
  platforms:
  - windows
  for:
  - python
traits:
- id: python-spawn-dll
  desc: Python source names a spawn_dll routine
  crit: notable
  conf: 0.9
  if:
    type: text
    word: spawn_dll

composite_rules:
- id: python-alertable-dll-host
  desc: Python alertable and DLL-spawn names
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/process/thread/runtime::python-spawn-alertable
  - id: micro-behaviors/process/deploy/library::python-spawn-dll
