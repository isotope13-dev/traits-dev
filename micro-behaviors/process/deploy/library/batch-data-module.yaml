defaults:
  platforms:
    - "windows"
  for:
    - "batch"
traits:
  - 
    id: "batch-data-file-export-call"
    desc: "Command invokes data-suffixed module export"
    crit: "notable"
    conf: 0.96
    if:
      type: "text"
      regex: "(?im)^\\s*\\S+\\s+\\S{1,160}\\.(dat|png|asc|jpg),[a-z_][\\w@]{0,60}\\s*$"
