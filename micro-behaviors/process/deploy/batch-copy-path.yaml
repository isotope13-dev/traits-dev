# Quoted script paths are compared byte-for-byte. No attacker-chosen basename
# is required, and an unrelated copy beside cmd /c does not satisfy the link.
defaults:
  platforms: [windows]
  for: [batch, powershell]

traits:
  - id: batch-copied-script-execution
    desc: cmd executes a copied wildcard-script path
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule batch_copied_script_execution {
          strings:
            $copy = /(^|[\r\n])[ \t]*@?copy[ \t]+\/b[ \t]+"[^"\r\n]{1,180}\\\*\.[a-z0-9]{1,8}"[ \t]+/ nocase
            $exec = /(^|[\r\n])[ \t]*@?cmd(\.exe)?[ \t]+\/c[ \t]+/ nocase
            $path = /"[^"\r\n]{1,180}\.(cmd|bat)"/ nocase
          condition:
            #copy > 0 and #exec > 0 and #path <= 128 and
            for any p in (1..#path) : (
              for any c in (1..#copy) : (@path[p] == @copy[c] + !copy[c]) and
              for any q in (1..#path) : (
                @path[q] > @path[p] and @path[q] - @path[p] < 512 and
                !path[p] == !path[q] and
                for any e in (1..#exec) : (@path[q] == @exec[e] + !exec[e]) and
                for all k in (0..!path[p]-1) : (
                  uint8(@path[p]+k) == uint8(@path[q]+k)
                )
              )
            )
        }
