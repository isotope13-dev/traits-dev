defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
  crit: notable

traits:
  - id: x86-image-swap-relaunch
    desc: Native image swap precedes same-path launch
    conf: 0.98
    if:
      # Bind the same stack path to both replacement calls and launch.
      # Ordinary self-updaters implement this too; intent is separate.
      type: yara
      source: |
        import "pe"
        rule x86_image_swap_relaunch {
          strings:
            $swap = {
              8D 85 ?? ?? ?? ?? 52 89 74 24 04 8B 35 ?? ?? ?? ??
              C7 44 24 08 01 00 00 00 89 04 24 FF D6
              8D 85 ?? ?? ?? ?? 83 EC 0C C7 44 24 08 01 00 00 00
              89 44 24 04 89 1C 24 FF D6
            }
            $launch = {
              8D 85 ?? ?? ?? ?? 8B 1D ?? ?? ?? ??
              C7 44 24 14 01 00 00 00 89 44 24 10
              8D 85 ?? ?? ?? ?? C7 44 24 0C 00 00 00 00
              89 44 24 08 C7 44 24 04 ?? ?? ?? ??
              C7 04 24 00 00 00 00 FF D3
            }
          condition:
            pe.machine == pe.MACHINE_I386 and
            pe.imports("KERNEL32.dll", "MoveFileExW") and
            pe.imports("SHELL32.dll", "ShellExecuteW") and
            for any s in (1..#swap) : (
              uint32(@swap[s]+2) == uint32(@swap[s]+32) and
              for any l in (1..#launch) : (
                @launch[l] > @swap[s]+56 and @launch[l]-@swap[s] < 512 and
                uint32(@swap[s]+2) == uint32(@launch[l]+26)
              )
            )
        }
