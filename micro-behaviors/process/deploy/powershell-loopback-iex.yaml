# Native programs can embed local development/bootstrap commands as well as
# malicious stages. A local URL and PowerShell flags do not establish abuse.
defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable

traits:
  - id: powershell-webclient-download-eval-text
    desc: PowerShell evaluates WebClient DownloadString
    conf: 0.97
    attack: T1059.001
    size_min: 512
    size_max: 50000000
    if:
      type: text
      # Require the download call, not just IEX constructing a WebClient.
      regex: '(?i)(iex|invoke-expression)\s*\( *new-object +net\.webclient\)\.downloadstring\('

  - id: powershell-downloadstring-call
    desc: Downloads a string via WebClient DownloadString
    conf: 0.9
    platforms: [windows, unix]
    for: [powershell]
    if:
      type: symbol
      kind: call
      exact: DownloadString

composite_rules:
  # The broader poll-eval form: a DownloadString fetch with the evaluator on
  # the same lines. Sibling of the loopback shape above; kept apart from the
  # generic IEX atom so a locally built Invoke-Expression string (env-var
  # assignment, config interpolation) cannot pose as remote tasking.
  - id: powershell-downloadstring-iex
    desc: IEX consumes a DownloadString result
    crit: notable
    conf: 0.95
    platforms: [windows, unix]
    for: [powershell]
    near_lines: 3
    all:
      - id: powershell-downloadstring-call
      - id: micro-behaviors/process/interpreter/eval/direct::powershell-iex-call

  - id: powershell-loopback-download-eval-command
    desc: Loopback PowerShell download/eval launch text
    conf: 0.97
    size_min: 512
    size_max: 50000000
    near_bytes: 256
    all:
      - id: powershell-webclient-download-eval-text
      - id: micro-behaviors/communications/http/client/managed::loopback-downloadstring-url
    any:
      - id: micro-behaviors/process/interpreter/powershell/command::encoded-command-line
      - id: micro-behaviors/process/create/flags::execution-policy-bypass-abbrev-flag

