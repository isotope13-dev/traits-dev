# A browser script element acquires source and activates it in the page's
# interpreter; it does not create an operating-system process.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, php, binaries]
  crit: notable
  conf: 0.88

traits:
  - id: local-script-element-load
    desc: Loads local script element
    conf: 0.92
    for: [html]
    if:
      type: text
      regex: '<script[^>]{0,160}\bsrc\s*=\s*["''](\.{1,2}/|/[^/])[./A-Za-z0-9_-]{0,158}["'']'
  - id: massed-remote-script-tags
    desc: Massed back-to-back remote script tags
    conf: 0.9
    # An author includes each library once, so a head block holds a handful
    # of consecutive script tags at most; a mass-injected page carries the
    # same loader hundreds of times wherever the injector landed (273
    # adjacent pairs on the motivating sample versus 4 on a large benign
    # blog). The linear-time engine supports no backreference for exact
    # identity, so adjacency at volume is the observable footprint and the
    # count keeps ordinary head blocks out. Magento 1 emits every unmerged
    # include as an absolute URL, so an ordinary store head reaches 36
    # distinct adjacent tags; 50 stays above that while the regression
    # fixture's injected block carries 58.
    for: [html]
    count_min: 50
    if:
      type: text
      case_insensitive: true
      # `src` has to be the first attribute. A module bundle puts
      # `defer` and `type="module"` first; the injected copy puts `src` first
      # and repeats that same tag.
      regex: '</script>\s*<script\s+src=[''"]?https?://'
  # Variable-argument twin of the literal above: fragment-assembled tag names
  # (`createElement(cluxek60)` where the variable holds 'S'+'cR'+'iPt') dodge
  # the literal matcher. Component factories build elements from variables
  # too, so this stays notable; the composites pair it with the concealed
  # source and the hiding context.
  - id: variable-tag-createelement
    desc: Creates element from variable tag name
    conf: 0.85
    for: [javascript, typescript, html, php, svg, binaries, makefile, text]
    if:
      type: text
      regex: 'createElement\(\s*[A-Za-z_$][\w$]*\s*\)'
composite_rules:
  # A variable-built element fed a concatenated source: the concealed
  # remote-element injection shape. Either half occurs in ordinary dynamic
  # UI code, so the pairing stays suspicious.
  - id: concealed-script-element-load
    desc: Variable-built element with concatenated src
    crit: suspicious
    conf: 0.88
    for: [html, javascript]
    near_bytes: 512
    all:
      - id: variable-tag-createelement
      - id: micro-behaviors/data/property/assign::concatenated-src-assignment
  # An HTA that moves itself off-desktop while building its element from
  # fragments: trusted-application hiding plus concealed injection. The
  # filename leg has no position, so this pairs by file co-occurrence.
  - id: hta-hidden-window-element-load
    desc: HTA hides window and loads concealed element
    crit: suspicious
    conf: 0.88
    for: [html]
    all:
      - id: metadata/file/extension/identity::hta-html-application-extension
      - id: micro-behaviors/ui/window/control::window-moveto-large-coordinate
      - id: variable-tag-createelement
