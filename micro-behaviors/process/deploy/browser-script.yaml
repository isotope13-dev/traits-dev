# A browser script element acquires source and activates it in the page's
# interpreter; it does not create an operating-system process.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, php, binaries]
  crit: notable
  conf: 0.88

traits:
  - id: external-script-element-load
    desc: Loads external script element
    conf: 0.92
    for: [html, php]
    if:
      type: text
      exclude_html_comments: true
      case_insensitive: true
      regex: '<script\b[^>]{0,160}\bsrc\s*=\s*["'']?(https?:)?//[^/"''\s>]'
  - id: local-script-element-load
    desc: Loads local script element
    conf: 0.92
    for: [html]
    if:
      type: text
      regex: '<script[^>]{0,160}\bsrc\s*=\s*["''](\.{1,2}/|/[^/])[./A-Za-z0-9_-]{0,158}["'']'
  - id: dynamic-script-element-load
    desc: Dynamically loads script element
    conf: 0.9
    # svg: an SVG document's inline script can inject a <script> element at
    # runtime to pull the real payload from a remote endpoint — the loader
    # shape used by SVG-attachment phishing campaigns.
    for: [javascript, typescript, html, php, svg, binaries, makefile, text]
    unless:
      - id: well-known/lib/development/next-swc::next-swc-native-compiler-pdb
    if:
      type: text
      regex: 'createElement\(\s*[''"]script[''"]\s*\)[\s\S]{0,260}[A-Za-z_$][A-Za-z0-9_$]*\.src\s*='
