# These are downloader observations, independent of lifecycle hooks or trust.
# The path-identifier leg connects the helper destination to the spawn call;
# the HTTP, release-URL and chmod legs provide file-local context.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
composite_rules:
  - id: node-versioned-download-chmod-spawn
    desc: Versioned download, chmod and spawn share context
    conf: 0.97
    scope: leaf
    near_bytes: 8192
    all:
      - id: micro-behaviors/communications/http/download/release::forge-release-version-download-url
      - id: micro-behaviors/communications/http/download/handler::node-http-response-to-file
      - id: micro-behaviors/fs/chmod/executable/mode::node-chmod-exec-mode-755
      - id: micro-behaviors/process/deploy::download-helper-then-spawnsync-path

  - id: node-versioned-bootstrap-full-environment-context
    desc: Release bootstrap and environment field co-occur
    conf: 0.97
    scope: leaf
    near_bytes: 8192
    all:
      - id: node-versioned-download-chmod-spawn
      - id: micro-behaviors/os/env/read::node-process-env-object-field
