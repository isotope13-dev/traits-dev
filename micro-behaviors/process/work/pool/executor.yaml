defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]

traits:
  - id: worker-pool
    desc: References a worker, thread, or goroutine pool
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (worker|thread|goroutine)[_-]?pool
      case_insensitive: true

  - id: parallel-thread-executor
    desc: Constructs a Python ThreadPoolExecutor
    crit: notable
    conf: 0.88
    for: [python, javascript, typescript, go, rust, lua, powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)ThreadPoolExecutor$'
