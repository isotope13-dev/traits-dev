# Neutral parallel/batch execution via xargs. `xargs` (and `xargs -P` for
# parallelism) is a standard build/CI/batch idiom. Objective composites
# reference these cross-directory and supply the destructive context.
defaults:
  crit: notable
  platforms: [unix, android, ios]
  for: [shell]
traits:
  - id: xargs-cmd
    desc: xargs command usage
    conf: 0.6
    if:
      type: symbol
      exact: xargs
  - id: xargs-parallel-flag
    desc: xargs with parallel flag (-P)
    conf: 0.7
    if:
      type: string_literal
      regex: xargs\s+.{0,50}-P\s*\d*
  # Relocated from objectives/discovery/network/scan/port (pipe-loop-pattern):
  # per-line/replace xargs flags (-L1, -I{}, -n 1) preceded by whitespace, so
  # the long flags --null and --no-run-if-empty do not match.
  - id: xargs-per-item-pipe
    desc: Pipes input to xargs per item
    conf: 0.7
    if:
      type: text
      regex: \|\s*xargs\s+[^\n]{0,80}\s-[LlIin][0-9 {]
