defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: execute-task-call
    desc: Calls the tasks.executeTask API
    if:
      type: text
      regex: '\.tasks\.executeTask\s*\('

composite_rules:
  - id: unattended-github-shell-task
    desc: GitHub npx command near a task execution call
    near_bytes: 1024
    all:
      - id: micro-behaviors/os/package-manager/run::github-runner-shell-execution
      - id: micro-behaviors/process/work/task::execute-task-call
