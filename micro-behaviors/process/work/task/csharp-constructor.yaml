defaults:
  for: [csharp]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: csharp-constructor-background-task
    desc: Constructor queues a background task
    # Facts expose Task.Run but do not expose its enclosing constructor.
    if:
      type: tree-sitter
      query: |
        ((constructor_declaration
          body: (block
            (expression_statement
              (invocation_expression
                function: (member_access_expression
                  expression: (identifier) @type
                  name: (identifier) @method)
                arguments: (argument_list
                  (argument (lambda_expression)))) @evidence)))
        (#eq? @type "Task")
        (#eq? @method "Run"))
