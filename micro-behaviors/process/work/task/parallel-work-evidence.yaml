defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
composite_rules:
  - id: parallel-work-clues
    desc: Parallel worker or concurrency clues
    crit: component
    conf: 0.8
    any:
      - id: micro-behaviors/process/thread/worker::worker-constructor-call
      - id: micro-behaviors/process/thread/worker::worker-constructor-text
      - id: micro-behaviors/process/thread/worker::shared-worker-constructor
      - id: micro-behaviors/process/thread/worker::new-worker-instance
      - id: micro-behaviors/process/thread/runtime::worker-thread-label
      - id: micro-behaviors/process/thread/config::worker-thread-count-name
      - id: metadata/lang/source/syntax/command/options::thread-or-worker-count-flag
      - id: metadata/lang/natural/phrasing/system::go-routine-count-limit-label
      - id: micro-behaviors/process/work/queue::xargs-parallel-flag
