# These PE geometry and API facts do not establish staging data flow.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: native-tls-readwrite-allocation-clues
    desc: PE allocation, thread pool and TLS clues
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtualalloc-readwrite-commit-resolved-x64-register-order
      - id: micro-behaviors/process/work/task::threadpool-work-lifecycle
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: metadata/binary/section/ratio::pe-near-total-code-data
      - id: metadata/binary/layout/tls::pe-multiple-tls-callbacks
    unless:
      - id: well-known/lib/ui/cef::cef-runtime-binary-context
