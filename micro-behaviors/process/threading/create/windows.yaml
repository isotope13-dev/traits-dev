# Windows threading API references.
#
# Pure capability atoms — these names being present in a binary means
# it can spawn threads. Notable on their own (defines program purpose:
# "this code is multithreaded"), with composites in objectives/ for
# the suspicious combinations (e.g. CreateRemoteThread for injection).
defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: create-thread-text
    desc: CreateThread API name reference
    crit: baseline
    conf: 0.7
    if:
      type: text
      word: CreateThread

  - id: create-threadpool-work
    desc: Create a Windows thread-pool work item
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, rust]
    if:
      type: symbol
      exact: CreateThreadpoolWork

  - id: submit-threadpool-work
    desc: Submit a Windows thread-pool work item
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, rust]
    if:
      type: symbol
      exact: SubmitThreadpoolWork

  - id: wait-threadpool-work
    desc: Wait for a Windows thread-pool work item
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, rust]
    if:
      type: symbol
      exact: WaitForThreadpoolWorkCallbacks

  - id: close-threadpool-work
    desc: Close a Windows thread-pool work item
    crit: baseline
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, rust]
    if:
      type: symbol
      exact: CloseThreadpoolWork

  - id: threadpool-callback-signature
    desc: Windows thread-pool callback signature
    crit: notable
    conf: 0.95
    for: [c, cpp]
    if:
      type: text
      regex: '\bPTP_(CALLBACK_INSTANCE|WORK_CALLBACK)\b'

  - id: context-cast-and-invoke
    desc: Casts context to function and invokes
    crit: suspicious
    conf: 0.98
    for: [c, cpp]
    if:
      type: text
      regex: 'reinterpret_cast\s*<\s*void\s*\(\s*\*\s*\)\s*\(\s*\)\s*>\s*\([^)]{1,80}\)\s*\(\s*\)'

composite_rules:
  - id: threadpool-callback-invokes-context-pointer
    desc: Thread-pool callback invokes context pointer
    crit: suspicious
    conf: 0.98
    for: [c, cpp]
    all:
      - id: threadpool-callback-signature
      - id: context-cast-and-invoke
    near_bytes: 768

  - id: threadpool-work-lifecycle
    desc: Create, submit, wait for, and close a thread-pool work item
    crit: notable
    conf: 0.95
    for: [pe, dll, c, cpp, csharp, rust]
    all:
      - id: create-threadpool-work
      - id: submit-threadpool-work
      - id: wait-threadpool-work
      - id: close-threadpool-work
