# Job/task queue identifiers in scripting-language sources. Worker pools,
# schedulers and C2 teamservers all keep one; the teamserver objective only
# counts it alongside SOCKS, sleep-jitter and kill-date fields.
defaults:
  platforms: [unix, windows]
  for: [python, ruby, perl, go]

traits:
  # Relocated from objectives/command-and-control/infrastructure/framework/
  # server, where it was `field-job-queue` ("Job queue data field"). The
  # matcher sees any identifier or string naming a job/task queue.
  - id: job-queue-identifier
    desc: Job or task queue identifier
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(?i)(job_?queue|task_queue)'
