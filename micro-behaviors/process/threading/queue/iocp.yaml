# Windows I/O completion-port work queues.  The individual APIs are neutral
# concurrency capabilities; ransomware intent is supplied by the objective
# composite that combines the queue with recursive encrypted-file processing.
defaults:
  crit: notable
  platforms: [windows]
  for: [c, cpp, pe, dll]

traits:
  - id: create-io-completion-port
    desc: CreateIoCompletionPort symbol reference
    conf: 0.92
    if:
      type: symbol
      exact: CreateIoCompletionPort
    unless:
      - id: metadata/lang/compiler/systems::go-binary-comp

  - id: post-queued-completion-status
    desc: PostQueuedCompletionStatus symbol reference
    conf: 0.92
    if:
      type: symbol
      exact: PostQueuedCompletionStatus
    unless:
      - id: metadata/lang/compiler/systems::go-binary-comp

  - id: get-queued-completion-status
    desc: GetQueuedCompletionStatus symbol reference
    conf: 0.92
    if:
      type: symbol
      exact: GetQueuedCompletionStatus
    unless:
      - id: metadata/lang/compiler/systems::go-binary-comp

  - id: get-queued-completion-status-ex
    desc: GetQueuedCompletionStatusEx symbol reference
    conf: 0.92
    if:
      type: symbol
      exact: GetQueuedCompletionStatusEx
    unless:
      - id: metadata/lang/compiler/systems::go-binary-comp

composite_rules:
  - id: iocp-work-queue
    desc: Windows IOCP producer/consumer API set
    conf: 0.96
    all:
      - id: create-io-completion-port
      - id: post-queued-completion-status
    any:
      - id: get-queued-completion-status
      - id: get-queued-completion-status-ex
    unless:
      - id: metadata/lang/compiler/systems::go-binary-comp
