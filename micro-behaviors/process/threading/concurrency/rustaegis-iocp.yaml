defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055

traits:
  - id: encrypted-zw-set-io-completion
    desc: Encrypted RustAegis ZwSetIoCompletion ID
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: 49 b8 2c ae 6b f9 c8 29 49 88

  - id: encrypted-post-queued-completion-status
    desc: Encrypted RustAegis IOCP post API ID
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: 49 b8 f2 83 be 79 fb fb dd 8e

  - id: encrypted-io-completion-object-type
    desc: Encrypted RustAegis IoCompletion type ID
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: 49 b8 93 8f 7e a2 57 f6 e7 e2
