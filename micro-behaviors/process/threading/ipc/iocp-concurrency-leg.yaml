# Preserve the original concurrency selector's five IOCP members after their move.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: concurrency-or-iocp-evidence
    desc: Concurrency or IOCP API reference
    crit: component
    conf: 0.8
    any:
      - id: micro-behaviors/process/threading/concurrency/
      - id: micro-behaviors/process/threading/queue::create-io-completion-port
      - id: micro-behaviors/process/threading/queue::post-queued-completion-status
      - id: micro-behaviors/process/threading/queue::get-queued-completion-status
      - id: micro-behaviors/process/threading/queue::get-queued-completion-status-ex
      - id: micro-behaviors/process/threading/queue::iocp-work-queue
