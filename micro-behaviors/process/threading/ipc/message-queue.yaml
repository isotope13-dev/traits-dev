# Message Queue Threading Pattern
# Detects server-based malware using message queues
# Generic indicator for RATs, command servers
defaults:
  crit: notable
  platforms: [windows]
  for: [pe]
  mbc: "C0019"
  attack: "T1129"
traits: []
# Removed peek-message-api, post-thread-message-a, get-message-a duplicates
# Use canonical: micro-behaviors/os/message/queue::peek-message-a, ::post-thread-message-a, ::get-message-a
composite_rules:
- id: non-iocp-queue-evidence
  desc: Dispatch, thread-pool or task queue evidence
  crit: component
  conf: 0.8
  any:
  - id: micro-behaviors/process/threading/queue::dispatch-queue-create
  - id: micro-behaviors/process/threading/queue::dispatch-get-global-queue
  - id: micro-behaviors/process/threading/queue::dispatch-async-symbol
  - id: micro-behaviors/process/threading/queue::dispatch-sync-symbol
  - id: micro-behaviors/process/threading/queue::dispatch-source
  - id: micro-behaviors/process/threading/queue::dispatch-queue
  - id: micro-behaviors/process/threading/queue::dispatch-async
  - id: micro-behaviors/process/threading/queue::queue-user-work-item
  - id: micro-behaviors/process/threading/queue::queue-user-work-item-call
  - id: micro-behaviors/process/threading/queue::job-queue-identifier
- id: message-queue-threading
  desc: Message queue-based thread communication
  crit: notable
  conf: 0.8
  all:
  - id: "micro-behaviors/process/create"
  - id: micro-behaviors/process/threading/advanced-sync/
  - id: micro-behaviors/process/threading/async/
  - id: concurrency-or-iocp-evidence
  - id: micro-behaviors/process/threading/create/
  - id: non-iocp-queue-evidence
  any:
  - id: micro-behaviors/os/message/queue::peek-message-a
  - id: micro-behaviors/os/message/queue::get-message-a     # not-dupe (threading IPC context)
- id: message-based-command-server
  desc: Message queue command server pattern
  crit: notable
  conf: 0.85
  all:
  - id: message-queue-threading
  - id: micro-behaviors/os/message/queue::post-thread-message-a     # not-dupe (threading IPC context)
- id: message-dispatch-framework
  desc: Message dispatch framework
  crit: notable
  conf: 0.9
  all:
  - id: message-based-command-server
  - id: "micro-behaviors/process/create"
