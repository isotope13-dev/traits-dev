defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  attack: T1033
traits:
  - id: node-os-alias-userinfo-call
    desc: Node os-alias user identity query
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.userInfo$'
  - id: os-userinfo-call
    desc: os.userInfo() user query
    conf: 0.8
    if:
      type: symbol
      exact: os.userInfo
    unless:
      - id: metadata/package/testing/harness/runtime/
  # Bundler-tolerant sibling of os-homedir-call below, mirroring the pair that
  # already exists for userInfo (above) and hostname (os/sysinfo/hostname/node).
  # `homedir` was the only one of the three os identity queries with no alias
  # form, and it is the most load-bearing: 10+ stealer / exfiltration /
  # credential-theft composites reference os-homedir-call as the leg that reaches
  # ~/.ssh, ~/.npmrc and browser profiles.
  #
  # Why it matters: esbuild renames a deconflicted `import * as os from 'os'` to
  # os2/os3, so a bundle reads `os3.homedir()` and the `exact: os.homedir`
  # matcher below sees nothing. Measured on @adhdev/session-host's ESM bundle,
  # which contains os2.homedir AND os3.homedir — os-homedir-call fired there only
  # because that bundle happens to ALSO retain two plain `os.homedir` calls. A
  # bundle where every os import got suffixed would have gone dark. Verified with
  # a two-line fixture: `os.homedir()` fires, `os2.homedir()` fired nothing.
  # Same defect class as the fs namespace fix in fs/enumerate/directory/.
  #
  # Kept as a separate atom rather than widening os-homedir-call, because that
  # atom's `unless:` list is tuned to the exact plain-`os.homedir()` text of its
  # known false positives; widening the matcher would leave those suppressions
  # matching only part of what it now caught.
  - id: node-os-alias-homedir-call
    desc: Node os-alias home directory query
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*\.homedir$'
  # Third form of the same query: the property name reaches the call site as a
  # string rather than an identifier. Minifiers emit it, and obfuscator.io's
  # string table turns every member access into exactly this shape, which is why
  # neither symbol-based sibling above sees it — the call has no target name at
  # all in the symbol view.
  #
  # `type: encoded` is required for the obfuscator.io spelling that hex-escapes
  # the property name (`obj['\x68\x6f\x6d\x65\x64\x69\x72']()`); raw text never
  # contains the clear `homedir` token.
  - id: node-bracket-homedir-call
    desc: Node bracket-named home directory query
    crit: notable
    conf: 0.86
    if:
      type: encoded
      regex: '[A-Za-z_$][\w$]{0,24}\[[''"]homedir[''"]\]\s*\('
  - id: os-homedir-call
    desc: os.homedir() user home directory
    conf: 0.7
    if:
      type: symbol
      exact: os.homedir
    unless:
      - type: text
        substr: const homeDirectory = os.homedir();
      - type: text
        regex: "path\\.join\\(os\\.homedir\\(\\),\\s*(envPath\\.slice\\(1\\)|['\"]\\.npm(rc)?['\"])"
      - type: text
        regex: "path\\.join\\(os\\.homedir\\(\\),\\s*['\"]\\.[A-Za-z0-9_-]{1,40}['\"]\\)"
      - type: text
        substr: reportedCWD = os.homedir() + reportedCWD.substring(1)
      - id: well-known/app/ai/gateway/opencode-router
      - id: well-known/app/ai/assistant/nitin-ai
  - id: execsync-quoted-whoami
    desc: execSync runs quoted whoami
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: (?i)\bexecSync\s*\(\s*['"]whoami['"]
  - id: execsync-quoted-hostname
    desc: execSync runs quoted hostname
    crit: notable
    conf: 0.9
    attack: T1082
    if:
      type: text
      regex: (?i)\bexecSync\s*\(\s*['"]hostname['"]
  - id: shell-substitution-user-cwd-query
    desc: Shell substitution queries user and cwd
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "\\$\\(\\s*whoami\\s*\\).{0,160}\\$\\(\\s*pwd\\s*\\)"
