defaults:
  platforms: [windows]
  for: [batch, powershell, shell, binaries]
  attack: T1033
traits:
  - id: windows-whoami-script-command
    desc: Windows whoami shell command
    crit: notable
    conf: 0.9
    for: [batch, powershell]
    if:
      type: text
      regex: (?i)(^|[\r\n&|({])\s*whoami(\.exe)?\b
  - id: windows-whoami-binary-command
    desc: Windows whoami executable reference
    crit: notable
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)(whoami\.exe\b|cmd(\.exe)?\s+/(c|k).{0,48}\bwhoami\b)'
  - id: dotnet-user-name
    desc: Reads .NET Environment UserName
    crit: notable
    conf: 0.9
    for: [powershell, csharp]
    if:
      type: text
      regex: '(?i)(System\.)?Environment\]?(::|\.)UserName\b'
composite_rules:
  - id: windows-whoami-command
    desc: Windows whoami command reference
    crit: notable
    conf: 0.9
    for: [batch, powershell, pe, dll]
    any:
      - id: windows-whoami-script-command
      - id: windows-whoami-binary-command
