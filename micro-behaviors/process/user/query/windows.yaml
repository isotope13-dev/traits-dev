defaults:
  platforms: [windows]
  for: [batch, powershell, shell, binaries]
  attack: T1033
traits:
  # `^` anchors per extracted string run, not per file. In .pyc and .class the
  # constant pool stores each interned name as its own run, so a method or CLI
  # subcommand named `whoami` becomes a run that starts with `whoami` -- an
  # identifier, not a command line. Native binaries keep the command reading.
  - id: windows-whoami-command
    desc: Windows whoami command
    crit: notable
    conf: 0.7
    for: [batch, powershell, shell, binaries, -pyc, -class]
    if:
      type: text
      regex: (?i)(^|[\r\n&|({])\s*whoami(\.exe)?\b
  - id: dotnet-user-name
    desc: Reads .NET Environment UserName
    crit: notable
    conf: 0.9
    for: [powershell, csharp]
    if:
      type: text
      regex: '(?i)(System\.)?Environment\]?(::|\.)UserName\b'
