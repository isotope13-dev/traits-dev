# Process user identity - Rust
#
# Rust reads the current account name by spawning the `whoami` utility through
# std::process::Command.  Neutral capability on its own; the recon objectives
# compose it with a hostname/IP lookup and a report destination.
#
# Matched as text, not as a call symbol: the Rust walker records no target
# name for `Command::new(...)`, so `type: symbol, kind: call` never fires.
defaults:
  platforms: [unix, windows]
  for: [rust]
  mbc: E1033
  attack: T1033
traits:
  - id: rust-command-whoami
    desc: Rust runs the whoami command
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'Command::new("whoami")'
