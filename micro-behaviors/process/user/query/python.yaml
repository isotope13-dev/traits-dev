defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
  attack: T1033

traits:
  - id: python-subprocess-identity-command
    desc: Python subprocess runs an identity utility
    conf: 0.96
    if:
      # Require the identity utility to be the executable (the first argv
      # element), rather than merely a later argument or adjacent string.
      type: tree-sitter
      kind: call
      regex: '(?is)\bsubprocess\.(run|Popen|check_output)\s*\(\s*(\[\s*)?["''](/usr/bin/)?(id|whoami)["'']'

  - id: python-getpass-user
    desc: Reads the current user through Python getpass
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: getpass.getuser

  - id: python-getpass-module-import
    desc: Imports Python's getpass module
    conf: 0.9
    if:
      type: import
      exact: getpass

  - id: python-getuser-call
    desc: Calls an imported getuser function
    crit: component
    conf: 0.75
    if:
      type: symbol
      kind: call
      exact: getuser

  - id: python-normalized-user
    desc: Normalizes a current-user value for comparison
    conf: 0.88
    if:
      type: text
      regex: 'getpass\.getuser\s*\(\s*\)\s*\.\s*(lower|casefold)\s*\('

  - id: python-user-substring-condition
    desc: Conditionally tests a username substring
    conf: 0.88
    if:
      type: tree-sitter
      kind: conditional
      regex: '(?i)\bnot\s+in\b.{0,80}\b(username|user)\b'

  - id: python-literal-user-substring-test
    desc: Tests literal substring against username
    conf: 0.88
    if:
      type: text
      regex: '["''][\w-]{3,}["'']\s+(not\s+in|in)\s+\w*user(name|_name|_id)?\b'
      case_insensitive: true

composite_rules:
  - id: python-imported-getpass-user
    desc: Reads the current user through imported getpass
    conf: 0.94
    all:
      - id: python-getpass-module-import
      - id: python-getuser-call

  - id: python-normalized-username-substring
    desc: Tests a normalized Python username for a literal substring
    conf: 0.96
    all:
      - id: python-getpass-user
      - id: python-normalized-user
      - id: python-literal-user-substring-test
    near_lines: 8
