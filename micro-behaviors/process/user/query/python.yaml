defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1033

traits:
  - id: python-subprocess-identity-command
    desc: Python subprocess runs an identity utility
    crit: notable
    conf: 0.96
    if:
      # Require the identity utility to be the executable (the first argv
      # element), rather than merely a later argument or adjacent string.
      type: tree-sitter
      kind: call
      regex: '(?is)\bsubprocess\.(run|Popen|check_output)\s*\(\s*(\[\s*)?["''](/usr/bin/)?(id|whoami)["'']'

  - id: python-getpass-user
    desc: Reads the current user through Python getpass
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: getpass.getuser

  - id: python-normalized-user
    desc: Normalizes a current-user value for comparison
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'getpass\.getuser\s*\(\s*\)\s*\.\s*(lower|casefold)\s*\('

  - id: python-user-substring-condition
    desc: Conditionally tests a username substring
    crit: component
    conf: 0.88
    if:
      type: tree-sitter
      kind: conditional
      regex: '(?i)\bnot\s+in\b.{0,80}\b(username|user)\b'
