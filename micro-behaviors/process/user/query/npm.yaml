defaults:
  platforms: [unix, windows]
  for: [package.json]
  attack: T1033

traits:
  - id: npm-postinstall-os-userinfo-call
    desc: npm postinstall queries OS user identity
    crit: notable
    conf: 0.94
    if:
      type: value
      path: scripts.postinstall
      regex: "require\\(['\"]os['\"]\\)[\\s\\S]{0,240}\\.userInfo\\s*\\(\\s*\\)\\.username"
