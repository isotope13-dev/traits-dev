defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-runs-id
    desc: Node wrapper runs identity command
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(^|\.)run$'
      arg:
        index: 0
        exact: id
    unless:
      # Tirith extractor tests exercise identity-command vectors as corpus.
      - id: well-known/tool/detection/tirith::tirith-defensive-scanner-context
