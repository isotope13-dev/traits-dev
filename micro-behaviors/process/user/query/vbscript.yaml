# Classic ASP / VBScript reads the logged-on account as a property on a
# WScript Network or WMI object.
defaults:
  for: [vbs]
  platforms: [windows]

traits:
  - id: vbscript-username-property
    desc: Reads a UserName property in VBScript
    crit: notable
    conf: 0.85
    attack: T1033
    if:
      type: text
      regex: '(?i)\.UserName\b'
