defaults:
  platforms: [macos]
  for: [macho, swift, objc]

traits:

  - id: console-user-stat-command
    desc: Resolves macOS console user with stat
    crit: notable
    conf: 0.94
    attack: T1033
    for: [shell, applescript]
    if:
      type: text
      regex: '\bstat\s+-f\s+["'']?%Su["'']?\s+/dev/console\b'

  - id: nsusername
    desc: Reads current macOS username
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: NSUserName
