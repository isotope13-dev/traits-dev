defaults:
  for: [elf, macho, c]
  platforms:
    - linux
    - macos
  crit: notable
  mbc: E1033
  attack: T1033
traits:
  - id: c-process-identity-command
    desc: C process API runs an identity utility
    crit: notable
    conf: 0.96
    for: [c]
    if:
      type: tree-sitter
      kind: call
      regex: '(?is)\b(system|popen|exec\w*)\s*\(\s*["'']\s*(/usr/bin/)?(id|whoami)\b'

  - id: identity-command-token
    desc: Shell invokes an identity utility
    crit: notable
    conf: 0.96
    # Shell separators are meaningful syntax only in shell source. In native
    # binaries, unrelated Go string-table entries can abut as `;id` and make
    # the same byte regex look like a command that is never executed.
    for: [shell]
    if:
      type: text
      regex: '(?im)(^|[;&|][ \t]*)(id|whoami)([ \t;&|]|$)'
    unless:
      - id: well-known/tool/development/go-toolchain::go-toolchain-source-path
      - id: well-known/tool/development/go-toolchain::go-toolchain-distribution
      - id: well-known/tool/detection/agentskillmap/
      - id: micro-behaviors/process/create/launch::shell-self-executable-jar

  - id: identity-command-substitution
    desc: Captures id output in shell substitution
    crit: notable
    conf: 0.9
    for: [shell]
    platforms: [unix]
    if:
      type: text
      regex: '\$\(\s*id(\s+[^)]{0,40})?\)|`\s*id(\s+[^`]{0,40})?`'

  # `pwd` reports the working directory, not the user — it lives in
  # micro-behaviors/fs/directory/cwd/shell.yaml with the other cwd queries.
  - id: getlogin
    desc: Get login name
    conf: 0.5
    if:
      type: symbol
      regex: getlogin
  - id: getpwuid
    desc: Imports UID password-entry lookup API
    conf: 0.5
    if:
      type: import
      regex: '^getpwuid(_r)?$'
    unless:
      - id: metadata/file/string/identity::python3-interpreter-basename
    downgrade:
      # Go's os/user package statically imports getpwuid_r on Darwin/BSD to
      # implement user.Current / user.Lookup.
      any:
        - id: metadata/lang/compiler/systems::go-binary-macho
        - id: metadata/lang/compiled/
        - id: metadata/file/string/identity::system-shell-basename
  - id: getpwnam
    desc: Resolve username to password entry
    crit: baseline
    conf: 0.4
    for:
      - elf
      - macho
    if:
      type: symbol
      exact: getpwnam
  - id: hostname-pwd-whoami
    desc: Chained recon commands hostname pwd whoami
    crit: suspicious
    conf: 0.9
    for: [scripts, c, elf, macho]
    if:
      type: text
      regex: 'hostname\s*&&\s*pwd\s*&&\s*whoami'
      case_insensitive: true
  - id: whoami-hostname-pwd
    desc: Chained recon commands whoami hostname pwd
    crit: suspicious
    conf: 0.9
    for: [scripts, c, elf, macho]
    if:
      type: text
      regex: 'whoami\s*&&\s*hostname\s*&&\s*pwd'
      case_insensitive: true
  - id: hostname-whoami-pwd
    desc: Chained recon commands hostname whoami pwd
    crit: suspicious
    conf: 0.9
    for: [scripts, c, elf, macho]
    if:
      type: text
      regex: 'hostname\s*&&\s*whoami\s*&&\s*pwd'
      case_insensitive: true
  # Bare `whoami` in command position only reads as a command in a shell
  # language (or in the extracted strings of a compiled binary). In a
  # general-purpose language it is an ordinary identifier -- `import whoami`,
  # `user = whoami()`, `whoami = api.whoami` -- so those file types are served
  # by whoami-exec-argument below instead.
  # Host-profile field captures: a shell recon preamble assigns whoami / $HOME
  # / pwd into named variables so they can be formatted into one payload. Each
  # is a neutral capture on its own (status lines and prompts do the same);
  # objectives/supply-chain/recon-exfil composes them into the recon signal.
  - id: shell-user-field-capture
    desc: Shell captures whoami into a user field
    crit: notable
    conf: 0.96
    for: [shell, package.json]
    if:
      type: text
      substr: "user=$(whoami)"
  - id: shell-home-field-capture
    desc: Shell captures HOME into a home field
    crit: notable
    conf: 0.95
    for: [shell, package.json]
    unless:
      - id: metadata/package/testing/presence/harness/
    if:
      type: text
      substr: "home=$(echo $HOME)"
  - id: shell-pwd-field-capture
    desc: Shell captures pwd into a pwd field
    crit: notable
    conf: 0.96
    for: [shell, package.json]
    unless:
      - id: metadata/package/files/dependency::os-image-root-file-path
      - id: well-known/app/system/kagent::kagent-source-path
    if:
      type: text
      substr: "pwd=$(pwd)"
  - id: whoami-command-separator
    desc: whoami command after shell separator
    conf: 0.5
    for: [shell, c, elf, macho]
    if:
      type: text
      # Case-sensitive: the shell command is always lowercase. Upper-case
      # WHOAMI is the SunRPC bootparams procedure name (rpcsvc/bootparam_prot.x
      # and its generated headers), not a command invocation.
      regex: '(^|[;&()|\s])\s*(/usr/bin/)?whoami(\s|[;&)])'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/package/files/system-package::shell-completion-script
      - id: metadata/library/syntaxhighlighter::prismjs-package-reference
      - id: metadata/library/syntaxhighlighter::prismjs-core
      - id: well-known/tool/offensive/ctf-skills::source-context
  - id: whoami-command-backtick
    desc: whoami command in shell backticks
    conf: 0.5
    for: [shell, c, elf, macho]
    if:
      type: text
      regex: '`\s*(/usr/bin/)?whoami\s*`'
      case_insensitive: true
  - id: whoami-command-quoted
    desc: whoami passed to a shell interpreter
    conf: 0.55
    for: [shell, c, elf, macho]
    if:
      type: text
      # Quoted prose such as "the 'whoami' command" is not execution; require
      # an interpreter's -c argument before the command.
      regex: '(?i)\b(sh|bash|dash|zsh|ksh)\s+-c\s+.{0,20}\b(/usr/bin/)?whoami\b'
    unless:
      - id: metadata/package/files/system-package::shell-completion-script
  # Scripted/compiled languages spell the command as a quoted argument to an
  # exec API. Requiring that receiver keeps ordinary CLI wiring that merely
  # registers a subcommand named "whoami" out of the match.
  - id: whoami-exec-argument
    desc: whoami passed to a process-exec call
    crit: notable
    conf: 0.9
    for: [shell, python, javascript, ruby, go, php, perl]
    if:
      type: symbol
      kind: call
      regex: '^(system|popen|exec|run)\w*$'
      arg:
        kind: string
        exact: whoami
  - id: logname-exec-argument
    desc: logname passed to a process-exec call
    crit: notable
    conf: 0.9
    for: [shell, python, javascript, ruby, go, php, perl]
    if:
      type: symbol
      kind: call
      regex: '^(system|popen|exec|run)\w*$'
      arg:
        kind: string
        exact: logname
  - id: id-u-cmd
    desc: id -u command
    conf: 0.5
    if:
      type: text
      substr: id -u
  - id: shell-capture-numeric-uid
    desc: Shell captures numeric user ID
    crit: notable
    conf: 0.95
    for: [shell]
    if:
      type: text
      substr: "uid=$(id -u)"
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: id-cmd
    desc: id command (with path)
    conf: 0.5
    if:
      type: text
      substr: /bin/id
  - id: id-cmd-shell
    desc: Invokes bare `id` in shell scripts
    crit: notable
    conf: 0.7
    for: [shell]
    if:
      type: symbol
      exact: id
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/file/format/structured::sourcemap
      - id: metadata/file/format/structured::sourcemap-context
  - id: id-and-ls-recon
    desc: id and ls recon command chain
    crit: notable
    conf: 0.7
    if:
      type: raw
      regex: '\bid\s*&&\s*ls\s'
  - id: os-getlogin-python
    desc: os.getlogin() Python username call
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: text
      regex: os\.getlogin\s*\(
composite_rules:
  - id: host-user-pwd-chain
    desc: Host user directory recon command chain
    crit: suspicious
    conf: 0.9
    any:
      - id: hostname-pwd-whoami
      - id: whoami-hostname-pwd
      - id: hostname-whoami-pwd
  - id: whoami-cmd
    desc: whoami command
    crit: notable
    conf: 0.55
    any:
      - id: whoami-command-separator
      - id: whoami-command-backtick
      - id: whoami-command-quoted
      - id: whoami-exec-argument
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
