defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: fiber-pe-parsing-api-profile
    desc: Fiber APIs with PE parsing or byte decoding
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/process/fiber::switch-to-fiber
      - id: micro-behaviors/process/fiber::convert-thread-to-fiber
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    any:
      - id: micro-behaviors/data/decode/xor/transform::x64-byte-subtract-xor-store
      - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
      - id: micro-behaviors/data/format/pe-parser::pe-header-compare-immediate-multiple
