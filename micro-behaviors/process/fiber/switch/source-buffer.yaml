defaults:
  for: [c, cpp]
  platforms: [windows]
  crit: notable
  conf: 0.97
traits:
  - id: source-switch-to-fiber
    desc: Source switches execution to a fiber
    if:
      type: symbol
      kind: call
      exact: SwitchToFiber
composite_rules:
  - id: source-rwx-fiber-callback
    desc: Source combines RWX allocation and fibers
    crit: notable
    all:
      - id: micro-behaviors/process/create/fiber::source-fiber-buffer-callback
      - id: source-switch-to-fiber
      - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-source
