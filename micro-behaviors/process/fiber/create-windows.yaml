defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
traits:
  - id: create-fiber
    desc: CreateFiber API symbol reference
    if:
      type: symbol
      exact: CreateFiber
  - id: create-fiber-api-string
    desc: CreateFiber API name in binary text
    if:
      type: text
      substr: CreateFiber
      section: ".rdata"

