defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
composite_rules:
  - id: fiber-memory-thread-api-profile
    for: [pe]
    desc: Fiber APIs with memory or thread-control indicators
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/process/fiber::create-fiber
      - id: micro-behaviors/process/fiber::switch-to-fiber
    any:
      # Co-occurrence does not bind an allocation or a remote handle to the
      # fiber callback. Thread-context pairs also occur in pthread cancellation.
      - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
      - id: micro-behaviors/mem/protect/modify/executable::virtualprotect-rwx-direct-call-x86
      - id: metadata/binary/instruction/operand::x86-40-minus-one-indirect-call
      - id: micro-behaviors/mem/protect/modify/executable::virtualprotect-executable-resolved-x64
      - id: micro-behaviors/process/inject/
      - id: micro-behaviors/mem/combined::remote-process-memory-api-cluster
      - id: micro-behaviors/process/thread/lifecycle::thread-control-apis-2of4
      - id: metadata/binary/section/permission::wx-section

