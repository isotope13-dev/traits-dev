defaults:
  platforms: [windows, unix]
traits:
  - id: js-process-on-exit-hook
    desc: Node process exit hook registered
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: process.on
      arg:
        index: 0
        kind: string
        regex: '^(exit|beforeExit)$'
    unless:
      - id: metadata/package/testing/harness/runtime/
