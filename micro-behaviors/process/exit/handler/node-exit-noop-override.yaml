# Assigning an empty function to `process.exit` disarms every exit call made
# by code that runs afterwards in the same process. Loaders do this to
# require() a script written as a standalone program (a CLI or an install
# hook that ends with process.exit) without that script terminating the host.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-process-exit-noop-override
    desc: Replaces process.exit with a no-op
    crit: notable
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: 'process\.exit\s*=\s*(\(\s*\)\s*=>\s*\{\s*\}|function\s*\(\s*\)\s*\{\s*\})'
