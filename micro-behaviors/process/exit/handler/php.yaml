defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.9

# Callback-capable APIs are not webshells. Match actual calls, not detector
# lists or comments. Arguments may be safe fixed callbacks or omitted.
traits:
  - id: php-shutdown-callback-registration
    desc: Registers PHP shutdown callback
    crit: baseline
    if:
      type: symbol
      kind: call
      exact: register_shutdown_function
