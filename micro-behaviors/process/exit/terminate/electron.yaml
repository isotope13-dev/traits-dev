# Electron and Node.js explicit application/process termination calls.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92

traits:
  - id: electron-app-quit-call
    desc: Terminates Electron application via app.quit
    if:
      type: symbol
      kind: call
      regex: '(^|\.)app\.quit$'

  - id: node-process-exit-call
    desc: Terminates Node.js process via process.exit
    if:
      type: symbol
      kind: call
      exact: process.exit
