defaults:
  platforms:
  - windows
  for:
  - csharp
  - pe
  - dll
traits:
- id: current-process-kill
  desc: .NET explicitly terminates the current process
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: kill\(Process\.GetCurrentProcess\(\)\.Id|GetCurrentProcess\(\)\.Kill
- id: powershell-stop-self-pid
  desc: PowerShell terminates its own process via $PID
  crit: notable
  conf: 0.94
  platforms: [windows, unix]
  for: [powershell]
  if:
    type: text
    exclude_comments: true
    regex: '(?i)\bStop-Process\b[^\r\n;|]{0,80}-Id\s+\$PID\b'
