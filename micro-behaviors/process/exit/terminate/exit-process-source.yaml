defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: exit-process-source
    desc: ExitProcess call in C source
    crit: baseline
    conf: 0.85
    for:
      - c
      - cpp
    if:
      type: symbol
      exact: ExitProcess
    unless:
      - id: metadata/file/profile/source-indications/
