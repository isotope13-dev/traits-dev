defaults:
  platforms: [windows, unix]
traits:
  - id: exit-call
    desc: Generic exit call
    crit: baseline
    conf: 0.3
    for: [scripts, binaries]
    if:
      type: string_literal
      exact: exit
  # Relocated from objectives/anti-analysis/sandbox-detect/timing (2026-07):
  # a clean zero exit is normal CLI behaviour, not evasion evidence.
  - id: js-process-exit-zero
    desc: Node process.exit(0) call
    crit: baseline
    conf: 0.84
    for: [javascript, typescript]
    if:
      type: text
      regex: 'process\.exit\(\s*0\s*\)'
  # A script too small to hold anything besides the exit implements nothing.
  # Packages ship these to satisfy a `bin`/`main` target while the real work
  # happens elsewhere, so the fact is worth seeing in a diff -- but generated
  # shims and scaffolding look identical, so intent comes from the composite.
  - id: tiny-script-immediate-exit
    desc: Tiny script body is a clean exit
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    size_max: 256
    if:
      id: js-process-exit-zero
  - id: sys-exit
    desc: Python sys.exit call
    crit: baseline
    conf: 0.3
    for:
      - python
    if:
      type: string_literal
      substr: sys.exit
  - id: process-exit
    desc: Node.js process.exit call
    crit: baseline
    conf: 0.3
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      substr: process.exit
  - id: dotnet-environment-exit
    desc: .NET Environment.Exit call
    crit: baseline
    conf: 0.9
    platforms: [windows]
    for: [csharp, pe, dll]
    if:
      type: text
      regex: 'Environment\.Exit\(\s*[-+]?\d+\s*\)'
  # CorExitProcess is the native CLR process-termination entry point. Native
  # runtimes and MSVC/JNI compatibility code may carry the name without
  # hosting or injecting a managed payload.
  - id: corexitprocess-string
    desc: CorExitProcess CLR termination reference
    crit: baseline
    conf: 0.8
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      word: CorExitProcess
  - id: lua-os-exit
    desc: Lua os.exit call
    crit: baseline
    conf: 0.75
    for:
      - lua
    if:
      type: symbol
      exact: os.exit
  - id: process-exit-zero-repeat
    desc: Repeated Node.js clean exits
    crit: baseline
    conf: 0.7
    for:
      - javascript
      - typescript
    count_min: 4
    if:
      type: text
      substr: process.exit(0)
  - id: process-on-exit
    desc: Node.js process exit event listener registered
    crit: baseline
    conf: 0.7
    for:
      - javascript
      - typescript
    if:
      type: symbol
      exact: process.on
  - id: js-process-on-exit-hook
    desc: Node process exit hook registered
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bprocess\.on\s*\(\s*["''](exit|beforeExit)["'']'
    unless:
      - id: metadata/package/testing/harness/runtime/
