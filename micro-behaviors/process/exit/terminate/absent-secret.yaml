defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: exit-when-secret-missing--rx-1
  desc: Exit when a secret-named variable is absent
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: if\s*\(![A-Za-z_][A-Za-z0-9_]*(secret|token)[A-Za-z0-9_]*\)[\s\S]{0,120}process\.exit\(0\)
- id: exit-when-secret-missing--rx-2
  desc: Exit when a secret-named variable is absent
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: if\s*\(![A-Za-z_][A-Za-z0-9_]*(key|auth)[A-Za-z0-9_]*\)[\s\S]{0,120}process\.exit\(0\)
- id: exit-when-secret-missing--rx-3
  desc: Exit when a secret-named variable is absent
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: if\s*\(![A-Za-z_][A-Za-z0-9_]*(pass|api)[A-Za-z0-9_]*\)[\s\S]{0,120}process\.exit\(0\)
composite_rules:
- id: exit-when-secret-missing
  desc: Exits cleanly when secret missing
  crit: notable
  conf: 0.92
  any:
  - id: exit-when-secret-missing--rx-1
  - id: exit-when-secret-missing--rx-2
  - id: exit-when-secret-missing--rx-3
