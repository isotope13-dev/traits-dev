defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-any-test-immediate-exit
    desc: Python any-test condition calls os._exit
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((if_statement
          condition: (call function: (identifier) @test)
          consequence: (block (expression_statement
            (call function: (attribute
              object: (identifier) @module
              attribute: (identifier) @exit))))) @gate
          (#eq? @test "any") (#eq? @module "os") (#eq? @exit "_exit"))
