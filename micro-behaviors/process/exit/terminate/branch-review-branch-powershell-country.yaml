defaults:
  platforms:
  - windows
  for:
  - powershell

traits:
  - id: powershell-membership-exit
    desc: PowerShell country membership branch exits
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)\$\w*(country|region|locale)\w*\s+(-contains|-in)\s+\$\w*\)\s*\{\s*exit\b'
