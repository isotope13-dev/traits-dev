defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: python-membership-systemexit-branch
    desc: Python membership-test branch raises SystemExit
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((if_statement
          condition: (call
            function: (identifier) @predicate
            arguments: (generator_expression
              body: (comparison_operator) @membership))
          consequence: (block
            (raise_statement (call function: (identifier) @exception)))) @branch
          (#eq? @predicate "any")
          (#match? @membership "^[A-Za-z_][A-Za-z_0-9]* in [A-Za-z_][A-Za-z_0-9]*$")
          (#eq? @exception "SystemExit"))
