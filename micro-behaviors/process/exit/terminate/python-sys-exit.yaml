# sys.exit() — process-exit capability (normal control flow). Relocated from
# anti-analysis/sandbox-detect; the sandbox exit-gate composites reference it
# cross-directory.
defaults:
  conf: 0.84
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-sys-exit-symbol
    desc: Python sys.exit symbol
    crit: notable
    if:
      type: symbol
      exact: sys.exit
  - id: python-system-exit-raise
    desc: Python SystemExit constructor call
    crit: baseline
    if:
      type: symbol
      kind: call
      exact: SystemExit

  - id: python-conditional-exit-expression
    desc: Conditional expression that exits
    crit: notable
    conf: 0.8
    if:
      type: tree-sitter
      language: python
      query: |
        ((conditional_expression) @expr
          (#match? @expr "(os\\._exit|sys\\.exit|(^|[^.\\w])(exit|quit))\\s*\\(\\s*\\d*\\s*\\)"))
