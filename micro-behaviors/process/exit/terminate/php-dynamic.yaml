defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: exit-dynamic-call-result
    desc: PHP exits with a variable-function call result
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        (function_call_expression
          function: (name) @exit
          arguments: (arguments
            (argument
              (function_call_expression function: (variable_name))))
          (#any-of? @exit "die" "exit"))
