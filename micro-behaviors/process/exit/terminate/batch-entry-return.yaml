defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-entry-immediate-return
    desc: Batch script returns before later commands
    crit: notable
    conf: 0.99
    # Only whitespace and optional ECHO OFF may precede the return. A prior
    # CALL or GOTO can enter later labels and must not match this observation.
    if:
      type: text
      regex: '(?i)\A\s*(?:@?echo off\s*\r?\n\s*)?@?(exit(?: /b)?|goto :eof)[ \t]*(\r?\n|$)'
