defaults:
  platforms: [linux, macos, windows]
traits:
  - id: abort
    desc: Abort program execution
    crit: baseline
    conf: 0.90
    for: ["pe", "elf", "macho"]
    if:
      type: symbol
      exact: "abort"

  # Match the two arguments on the same signal() call.  The former native
  # byte-pattern atoms only saw `mov <reg>, 1; mov <reg>, 1`, which also occurs
  # in ordinary allocators (for example calloc(1, 1)) and is not evidence of
  # SIG_IGN.
