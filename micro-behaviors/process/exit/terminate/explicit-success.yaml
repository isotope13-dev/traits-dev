defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: node-explicit-success-exit
    desc: Node explicitly exits with status zero
    crit: notable
    conf: 0.9
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: process\.exit\s*\(\s*0\s*\)
