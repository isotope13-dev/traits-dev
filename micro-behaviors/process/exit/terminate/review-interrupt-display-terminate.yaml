# DOS operation review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - windows
  - unix
  for:
  - dos_com
  - data
  size_max: 65536
traits:
- id: dos-terminate-after-service
  desc: DOS program terminate after service call
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: CD 21 CD 20
- id: dos-terminate-process
  desc: DOS program exit with return code
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: B4 4C [0-8] CD 21
- id: dos-terminate-ah00
  desc: DOS program terminate via AH=00h
  crit: notable
  conf: 0.85
  if:
    type: hex
    pattern: B4 00 CD 21
- id: dos-terminate-ax4c00
  desc: DOS program terminate via AX=4C00h
  crit: notable
  conf: 0.88
  if:
    type: hex
    pattern: B8 00 4C CD 21
