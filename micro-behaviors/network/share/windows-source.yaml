defaults:
  for: [c, cpp]
  platforms: [windows]
traits:
  # WNetAddConnection2, NetUserEnum, NetScheduleJobAdd, NetRemoteTOD share-API
  # markers live in micro-behaviors/os/service/remote/smb.yaml (for: [c, cpp, pe]).
  # Keeping a single canonical definition there avoids dedup/dup-pattern overlap.
  - id: ipc-null-session-path
    desc: IPC$ null session path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'ipc\\$'

  - id: c-network-share-enumeration-decl
    desc: Declares Windows network share enumeration
    crit: notable
    conf: 0.94
    attack: T1135
    if:
      type: text
      regex: '\bEnum(Net)?Shares\s*\([^;\r\n]{0,80}(SHARE_LIST|SHARE_INFO|ShareList)\b'
