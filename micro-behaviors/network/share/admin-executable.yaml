traits:
- platforms:
  - windows
  for:
  - binaries
  - scripts
  - source
  attack: T1021.002
  mbc: B0030
  id: admin-share-c-windows-temp-executable
  desc: Administrative share Temp executable path
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: \\\\[\w.%${}<>-]{1,80}\\c\$\\windows\\temp\\[^\\\s]{1,120}\.(exe|dll|bin)\b
    case_insensitive: true
