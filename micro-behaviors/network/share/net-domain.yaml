defaults:
  crit: notable
  platforms: [windows]

traits:
  - id: net-view-domain-flag
    desc: net view domain-wide share listing
    conf: 0.9
    for: [batch, powershell, scripts]
    if:
      type: text
      regex: '(?i)\bnet(\.exe)?(["'']?(\s+|,\s*["'']))view\b[^\r\n]{0,80}/domain\b'

  # `net use \\host /user:name` passes a credential on the command line.
  # Admin scripts do this; the hostile reading is supplied by the caller.
