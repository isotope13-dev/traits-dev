# UNC paths used by Windows domain logon scripts.
defaults:
  crit: notable
  platforms: [windows]
  for: [powershell]
  attack: T1570

traits:
  - id: netlogon-share-path
    desc: References a NETLOGON UNC path
    conf: 0.9
    for: [scripts]
    if:
      type: text
      regex: '(?i)\\\\.{0,80}\\NETLOGON\\'

  - id: sysvol-scripts-share-path
    desc: References a SYSVOL scripts UNC path
    conf: 0.92
    for: [scripts, pe, dll, go, c]
    if:
      type: text
      regex: '(?i)\\\\+[^\\\r\n]{1,120}\\+SYSVOL\\+[^\\\r\n]{1,120}\\+scripts(\\|["'']|\b)'
