# C source prototype for WNetAddConnection2. Share-connection calls are often
# resolved at run time through mpr.dll, so the import atoms in windows.yaml
# never see them. The typedef states a network-resource connection signature.
# It does not establish the remote host or the administrative share.
defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.93
  attack: T1021.002

traits:
  - id: wnet-add-connection-prototype-typedef
    desc: WNetAddConnection2 prototype typedef
    if:
      type: text
      regex: 'DWORD \(__stdcall ?\*\w+\)\(LPNETRESOURCE,LPCTSTR,LPCTSTR,DWORD\)'
      exclude_comments: true
