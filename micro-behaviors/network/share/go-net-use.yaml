defaults:
  platforms: [windows]
  for: [go]
  crit: notable
  conf: 0.98

traits:
  - id: go-cmd-net-use-command
    desc: Go constructs a CMD net-use command
    if:
      type: symbol
      kind: call
      exact: exec.Command
      args:
        - index: 0
          kind: string
          regex: '(?i)^cmd(\.exe)?$'
        - index: 1
          kind: string
          regex: '(?i)^/C$'
        - index: 2
          kind: string
          regex: '(?i)^net(\.exe)?$'
        - index: 3
          kind: string
          regex: '(?i)^use$'
