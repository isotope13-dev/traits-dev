defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, batch, powershell]

traits:
- id: admin-share-aspx-path
  desc: Admin-share ASPX or ASHX path
  conf: 0.95
  if:
    type: text
    regex: '\\\\\S{1,80}\\[a-zA-Z]\$\\\S{0,200}\.(aspx|ashx)'
- id: admin-share-jsp-path
  desc: Admin-share JSP or JSPX path
  conf: 0.95
  if:
    type: text
    regex: '\\\\\S{1,80}\\[a-zA-Z]\$\\\S{0,200}\.(jsp|jspx)'
- id: admin-share-php-path
  desc: Admin-share PHP path
  conf: 0.95
  if:
    type: text
    regex: '\\\\\S{1,80}\\[a-zA-Z]\$\\\S{0,200}\.(php)'
- id: inetpub-admin-share-path
  desc: Admin-share inetpub path
  conf: 0.97
  if:
    type: text
    regex: '\\\\\S{1,80}\\[a-zA-Z]\$\\inetpub\\'
- id: exchange-admin-share-path
  desc: Admin-share Microsoft Exchange path
  conf: 0.97
  if:
    type: text
    regex: '\\\\\S{1,80}\\[a-zA-Z]\$\\Program Files\\Microsoft\\Exchange'
    case_insensitive: true

composite_rules:
- id: admin-share-web-path-clues
  desc: Admin-share web script or web-root path
  conf: 0.97
  any:
  - id: admin-share-web-script-path
  - id: inetpub-admin-share-path
  - id: exchange-admin-share-path
- id: admin-share-web-script-path
  desc: Admin-share web script path
  conf: 0.95
  any:
  - id: admin-share-aspx-path
  - id: admin-share-jsp-path
  - id: admin-share-php-path
