traits:
- id: admin-share-admin-temp-executable
  desc: ADMIN$ Temp executable path reference
  crit: notable
  conf: 0.96
  for:
  - pe
  - dll
  - batch
  - powershell
  - c
  - cpp
  - csharp
  - go
  - rust
  - python
  if:
    type: text
    regex: \\{2,4}[\w<>.-]{1,80}\\{1,2}ADMIN\$\\{1,2}Temp\\{1,2}[^\\\s]{1,120}\.(exe|dll|bin)\b
    case_insensitive: true
  platforms:
  - windows
