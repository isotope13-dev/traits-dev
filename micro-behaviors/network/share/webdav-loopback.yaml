defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.97

traits:
  - id: net-use-loopback-webdav-share
    desc: Net use maps a loopback WebDAV share
    if:
      type: text
      regex: '\bnet(\.exe)?\s+use\s+.{0,60}\\\\(localhost|127\.0\.0\.1)@[0-9]+\\'
      case_insensitive: true
