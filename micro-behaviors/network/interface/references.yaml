# Interface-specific content supports probable network-interface capability.
# Reference evidence does not distinguish enumeration from configuration.
defaults:
  platforms:
  - unix
  for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
traits:
- id: veth-str
  desc: Virtual Ethernet interface reference
  crit: component
  if:
    type: text
    word: veth
- id: bridge-str
  desc: Bridge interface management reference
  crit: notable
  if:
    type: text
    regex: \b(brctl|docker0|virbr[0-9]+)\b|/sys/class/net/\w+/bridge
