---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.9
traits:
- id: broadcast-mac-address
  desc: Six-byte broadcast MAC address literal
  crit: notable
  conf: 0.95
  for:
  - python
  - c
  - cpp
  - go
  - rust
  if:
    type: text
    regex: (?i)(b["'](\\xff){6}["']|b["']\\xff["']\s*\*\s*6)
