# IPAddress.Loopback is an address constant, not a network-adapter name.
defaults:
  crit: notable
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: loopback-adapter-name
    desc: Loopback adapter or interface name reference
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bloopback[ _-](pseudo[- ]?)?(adapter|interface)\b'
