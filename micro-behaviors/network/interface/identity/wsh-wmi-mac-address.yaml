# Reads the MACAddress property of a Win32_NetworkAdapterConfiguration
# instance. A MAC address is a stable per-host identifier; inventory and
# licensing scripts read it as readily as implants that key a victim id.
defaults:
  platforms: [windows]
  for: [vbs, html]

traits:
  - id: wmi-adapter-mac-address-read
    desc: Reads network adapter MAC address property
    crit: notable
    conf: 0.9
    attack: T1016
    if:
      type: text
      regex: '(?i)\b[A-Za-z_]\w*\.MACAddress\b'
