defaults:
  platforms: [windows]
  for: [powershell, batch, binaries]
  crit: notable
  conf: 0.98
traits:
  - id: netsh-interface-admin-state
    desc: netsh sets network interface admin state
    if:
      type: text
      regex: '(?i)\bnetsh(\.exe)? +interface +set +interface[^\r\n]{0,160} +admin=(enable|disable)\b'
