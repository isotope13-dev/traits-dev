# Android cellular network selection in Java/Kotlin source. Requesting the
# cellular transport and binding the process to it exposes the subscriber
# identity to servers; carrier billing depends on exactly that signal.
defaults:
  platforms: [android]
  for: [java, kotlin]

traits:
  - id: android-cellular-transport-request
    desc: Requests Android cellular transport network
    crit: notable
    conf: 0.92
    if:
      type: text
      # A NetworkRequest builder asking for the cellular transport — not a
      # capability read: caps.hasTransport(TRANSPORT_CELLULAR) only tests a
      # candidate network, which VPN underlay scoring does for every transport.
      regex: 'addTransportType\s*\(\s*[^)\n]{0,80}TRANSPORT_CELLULAR'
  - id: android-process-network-bind
    desc: Binds Android process to a network
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'bindProcessToNetwork\s*\('
