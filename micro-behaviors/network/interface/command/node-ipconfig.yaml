defaults:
  platforms: [windows]
  for: [javascript, typescript]
traits:
- id: node-ipconfig-all-command
  desc: ipconfig /all command text
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '(?i)(^|[^/.\w])ipconfig\s+/all\b'

- id: node-spawns-ipconfig-command
  desc: Spawns cmd.exe with ipconfig
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: (identifier) @spawn
        arguments: (arguments
          . (string (string_fragment) @program)
          . (array) @arguments)) @call
        (#eq? @spawn "spawn")
        (#eq? @program "cmd.exe")
        (#match? @arguments "ipconfig"))
