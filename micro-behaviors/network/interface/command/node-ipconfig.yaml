defaults:
  platforms: [windows]
  for: [javascript, typescript]
traits:
- id: node-ipconfig-all-command
  desc: ipconfig /all command text
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '(?i)(^|[^/.\w])ipconfig\s+/all\b'

- id: node-spawns-ipconfig-command
  desc: Node spawns Windows network configuration query
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: 'spawn\s*\(\s*["'']cmd\.exe["''][\s\S]{0,180}["'']ipconfig["'']'
