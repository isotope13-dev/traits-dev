# The adapter class registry key and PowerShell advanced-property cmdlet are
# the supported ways to override a NIC's MAC address. Administrators and VM
# or lab setups do this; the claim is a MAC override, not spoofing intent.
defaults:
  platforms: [windows]
  for: [powershell, batch, pe, dll]
  crit: notable
  conf: 0.95

traits:
  - id: adapter-class-networkaddress-reg-command
    desc: reg command sets NIC NetworkAddress override
    if:
      type: text
      regex: '(?i)08002BE10318\}\S{0,40}\s+/v\s+"?NetworkAddress"?\s+/t\s+REG_SZ'

  - id: adapter-advanced-property-networkaddress
    desc: PowerShell sets NIC NetworkAddress property
    for: [powershell]
    if:
      type: text
      regex: '(?i)Set-NetAdapterAdvancedProperty[^\r\n]{0,120}Keyword\s+["'']?NetworkAddress\b'
