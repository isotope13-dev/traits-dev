# RTNetlink virtual Ethernet (veth) peer creation across network namespaces.
defaults:
  platforms: [linux]
  for: [c, cpp, go, python]
  crit: notable

traits:
  - id: rtm-newlink-constant
    desc: References RTM_NEWLINK Netlink constant
    conf: 0.9
    if:
      type: text
      word: RTM_NEWLINK
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

  - id: veth-peer-netlink-attr
    desc: References veth peer Netlink attributes
    conf: 0.93
    if:
      type: text
      regex: '\b(VETH_INFO_PEER|IFLA_NET_NS_PID)\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context

composite_rules:
  - id: rtnetlink-veth-peer-create
    desc: Creates veth pair across namespaces via RTNetlink
    conf: 0.95
    near_lines: 40
    all:
      - id: rtm-newlink-constant
      - id: veth-peer-netlink-attr
      - id: micro-behaviors/network/interface/identity::veth-str
