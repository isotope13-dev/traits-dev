defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.98

traits:
  - id: ifconfig-mac-override
    desc: Invokes ifconfig MAC address override
    if:
      type: symbol
      kind: call
      regex: '(^|/)ifconfig$'
      arg:
        index: 1
        kind: identifier
        name_regex: '^(ether|lladdr)$'
