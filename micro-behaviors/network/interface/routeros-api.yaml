defaults:
  platforms: [routeros, appliance]
  for: [python, pyc]
  attack: T1082

traits:
  - id: routeros-api-interface-query
    desc: RouterOS API interface query
    crit: notable
    conf: 0.91
    if:
      type: text
      regex: '/interface(/(bridge|vlan|wireless))?/print'
    unless:
      - id: well-known/app/development/jennifer::source-syntax-func
