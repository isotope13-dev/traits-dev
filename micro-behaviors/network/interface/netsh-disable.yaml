# Preserve the former batch matcher; interface state alone is not disk wiping.
defaults:
  platforms: [windows]
  for: [pe, dll, powershell, batch]
traits:
  - id: netsh-interface-disable-command-text
    desc: Netsh interface-disable command text
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)netsh\s+interface\s+set\s+interface.{0,100}\bDISABLE\b'
