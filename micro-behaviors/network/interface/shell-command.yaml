defaults:
  crit: notable
  conf: 0.7
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: exec-ifconfig
    desc: execSync ifconfig command
    if:
      type: text
      regex: "exec(Sync)?\\(['\"]ifconfig['\"]"
  - id: exec-ip-addr
    desc: execSync ip addr command
    if:
      type: text
      regex: "exec(Sync)?\\(['\"]ip addr['\"]"
  - id: exec-ip-a
    desc: execSync ip a command
    if:
      type: text
      regex: "exec(Sync)?\\(['\"]ip a['\"]"
composite_rules:
  - id: javascript-interface-query-command
    desc: JavaScript invokes interface query commands
    crit: notable
    conf: 0.9
    any:
      - id: exec-ifconfig
      - id: exec-ip-addr
      - id: exec-ip-a
