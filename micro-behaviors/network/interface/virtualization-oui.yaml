# OUI references identify interface vendors; they do not prove a VM probe.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - pe
  - dll
  - so
  - dylib
traits:
- id: virtualization-oui-vmware-1
  desc: VMware MAC-prefix reference 00:0c:29
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: 00:0c:29
    case_insensitive: true
- id: virtualization-oui-vmware-2
  desc: VMware MAC-prefix reference 00:50:56
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: 00:50:56
- id: virtualization-oui-vmware-3
  desc: VMware MAC-prefix reference 00:05:69
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: 00:05:69
- id: virtualization-oui-vbox
  desc: VirtualBox MAC-prefix reference 08:00:27
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: 08:00:27
- id: virtualization-oui-xen
  desc: Xen MAC-prefix reference 00:16:3e
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: 00:16:3e
    case_insensitive: true
- id: virtualization-oui-hyperv
  desc: Hyper-V MAC-prefix reference 00:15:5d
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: 00:15:5d
    case_insensitive: true
- id: virtualization-oui-parallels
  desc: Parallels MAC-prefix reference 00:1c:42
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: 00:1c:42
    case_insensitive: true
composite_rules:
- id: virtualization-oui-reference
  desc: References a virtualization vendor MAC prefix
  crit: notable
  conf: 0.85
  any:
  - id: virtualization-oui-vmware-1
  - id: virtualization-oui-vmware-2
  - id: virtualization-oui-vmware-3
  - id: virtualization-oui-vbox
  - id: virtualization-oui-xen
  - id: virtualization-oui-hyperv
  - id: virtualization-oui-parallels
