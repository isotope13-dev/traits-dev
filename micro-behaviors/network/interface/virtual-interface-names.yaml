# Names alone do not prove enumeration, filtering, or VM detection.
defaults:
  crit: notable
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: isatap-interface-name-reference
    desc: ISATAP tunnel interface name reference
    conf: 0.9
    if:
      type: text
      word: isatap
      case_insensitive: true
  - id: teredo-interface-name-reference
    desc: Teredo tunnel interface name reference
    conf: 0.9
    if:
      type: text
      word: teredo
      case_insensitive: true
  - id: hyperv-virtual-adapter-name
    desc: Hyper-V network adapter name reference
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bHyper-V[ _-](virtual[ _-])?(ethernet[ _-])?adapter\b'
composite_rules:
  - id: virtual-interface-name-cluster
    desc: Nearby virtual-interface name references
    conf: 0.9
    near_bytes: 192
    needs: 3
    any:
      - id: isatap-interface-name-reference
      - id: teredo-interface-name-reference
      - id: hyperv-virtual-adapter-name
      - id: loopback-adapter-name
