defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.75
  mbc: E1016
  attack: T1016
traits:
  - id: net-interfaces
    desc: Go network interface enumeration
    if:
      type: symbol
      kind: call
      exact: net.Interfaces
  - id: net-interfaceaddrs
    desc: Queries local network interface addresses in Go
    if:
      type: symbol
      kind: call
      exact: net.InterfaceAddrs
  # Exclude net.HardwareAddr type constructors: they supply a MAC value.
  - id: go-interface-hardware-addr
    desc: References an interface HardwareAddr field
    conf: 0.85
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\.HardwareAddr\b'
    not:
      - exact: net.HardwareAddr
