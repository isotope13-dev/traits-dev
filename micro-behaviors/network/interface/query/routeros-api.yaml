defaults:
  platforms: [routeros, appliance, unix]
  for: [python, pyc, c, cpp, objc, rust, go, elf]
  attack: T1082

traits:
  - id: routeros-api-interface-query
    desc: RouterOS API interface query
    crit: notable
    conf: 0.91
    if:
      type: text
      regex: '/interface(/(bridge(/port)?|vlan|wireless|ethernet|list(/member)?))?/print'
    unless:
      - id: well-known/app/development/jennifer::source-syntax-func
