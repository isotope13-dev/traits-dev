defaults:
  for: [shell]
  platforms: [linux]
  crit: notable
traits:
  - id: shell-ip-address-list
    desc: Lists network interface addresses via ip
    if:
      type: symbol
      kind: call
      exact: ip
      args:
        - index: 1
          kind: identifier
          name: show
        - index: 0
          kind: identifier
          name_regex: '^(a|addr|address)$'
