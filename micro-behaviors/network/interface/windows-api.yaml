defaults:
  for: [pe, dll, c, cpp]
  platforms: [windows]
  attack: "T1016"
traits:
- id: get-adapters-info
  desc: Enumerate local adapters via GetAdaptersInfo
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: "GetAdaptersInfo"
- id: get-adapters-info-text
  desc: References GetAdaptersInfo API name as text
  crit: component
  conf: 0.9
  if:
    type: text
    word: GetAdaptersInfo
  unless:
    # Fires only where the import does not: an imported API's name is in the
    # binary's strings too, so without this the same fact counted twice.
    - id: get-adapters-info
- id: ip-adapter-info-struct-token
  desc: IP_ADAPTER_INFO structure token
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: IP_ADAPTER_INFO
  unless:
    - id: get-adapters-info
    - id: metadata/build/generated::winmd-metadata
    - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
- id: get-adapters-addresses
  desc: Enumerate local network adapter addresses
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: "GetAdaptersAddresses"
- id: get-if-table
  desc: Enumerate network interfaces via GetIfTable
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: "GetIfTable"
- id: get-if-table2
  desc: Enumerate interfaces via GetIfTable2
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: "GetIfTable2"
- id: get-if-entry2
  desc: Query interface row via GetIfEntry2
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: "GetIfEntry2"
- id: get-ip-interface-table
  desc: Enumerate IP interfaces table
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: "GetIpInterfaceTable"
- id: get-ip-interface-entry
  desc: Query IP interface row
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: "GetIpInterfaceEntry"
composite_rules:
- id: generic-adapter-enumeration-surface
  desc: Generic adapter enumeration surface
  crit: component
  conf: 0.9
  needs: 3
  any:
  - id: get-adapters-info
  - id: get-adapters-addresses
  - id: get-if-table
  - id: get-if-table2
