defaults:
  platforms: [windows]
  for: [batch, powershell]
  crit: notable
  conf: 0.98
  attack: T1090

traits:
  - id: batch-netsh-portproxy-add-line
    desc: Batch line starts netsh portproxy add
    crit: component
    for: [batch]
    if:
      type: text
      regex: '(?im)^[ \t]*@?netsh(\.exe)?[ \t]+interface[ \t]+portproxy[ \t]+add[ \t]+v[46]tov[46]\b'
  - id: powershell-netsh-portproxy-add-call
    desc: PowerShell netsh portproxy add call
    crit: component
    for: [powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)^netsh(\.exe)?$'
      args:
        - index: 0
          kind: identifier
          name: interface
        - index: 1
          kind: identifier
          name: portproxy
        - index: 2
          kind: identifier
          name: add
        - index: 3
          kind: identifier
          name_regex: '(?i)^v[46]tov[46]$'
  - id: powershell-call-operator-portproxy-add
    desc: Invokes netsh portproxy add via PowerShell
    crit: component
    for: [powershell]
    if:
      type: tree-sitter
      query: |
        (command
          (command_invokation_operator)
          command_name: (command_name_expr) @command
          command_elements: (command_elements
            . (command_argument_sep)
            . (_) @interface
            . (command_argument_sep)
            . (_) @portproxy
            . (command_argument_sep)
            . (_) @add
            . (command_argument_sep)
            . (_) @direction)
          (#match? @command "(?i)^netsh(\\.exe)?$")
          (#match? @interface "(?i)^interface$")
          (#match? @portproxy "(?i)^portproxy$")
          (#match? @add "(?i)^add$")
          (#match? @direction "(?i)^v[46]tov[46]$"))
  - id: netsh-portproxy-add-text-reference
    desc: Contains netsh portproxy add command text
    for: [csharp, python, javascript, pe, dll]
    if:
      type: text
      regex: '(?i)\bnetsh(\.exe)?\s+interface\s+portproxy\s+add\s+v[46]tov[46]\b'

composite_rules:
  - id: netsh-portproxy-add
    desc: Contains a netsh portproxy add invocation
    any:
      - id: batch-netsh-portproxy-add-line
      - id: powershell-netsh-portproxy-add-call
      - id: powershell-call-operator-portproxy-add
