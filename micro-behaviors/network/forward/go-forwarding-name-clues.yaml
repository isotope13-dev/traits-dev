---
defaults:
  crit: notable
  platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - pe
  - go
traits:
- id: go-forward-loop
  desc: Go forwarding loop routine
  crit: notable
  conf: 0.72
  if:
    type: text
    substr: forwardLoop
  unless:
  - id: metadata/lang/compiler/managed::dotnet-assembly
- id: go-forward-dial
  desc: Go forwarding dial routine
  crit: notable
  conf: 0.72
  if:
    type: text
    substr: forwardDial
  unless:
  - id: metadata/lang/compiler/managed::dotnet-assembly
- id: go-port-forward-inforward
  desc: Go inForward port forwarding module
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: inForward\.(Start|Stop|addTask)
- id: go-port-forward-portforward
  desc: Go portForward module
  crit: notable
  conf: 0.9
  if:
    type: text
    word: portForward
- id: go-port-forward-tunnelforward
  desc: Go tunnelForward module
  crit: notable
  conf: 0.9
  if:
    type: text
    word: tunnelForward
composite_rules:
- id: go-tunnel-forwarding
  desc: Go tunnel and forwarding name clues
  crit: notable
  conf: 0.82
  any:
  - id: micro-behaviors/network/tunnel::go-tunnel-type
  - id: micro-behaviors/network/tunnel::go-tunnel-close
  - id: micro-behaviors/network/tunnel::go-tunnel-listen
  - id: micro-behaviors/network/forward::go-forward-loop
  - id: micro-behaviors/network/forward::go-forward-dial
  needs: 2
- id: go-port-forward-module
  desc: Go port forwarding module
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/network/forward::go-port-forward-inforward
  - id: micro-behaviors/network/forward::go-port-forward-direct
- id: go-port-forward-direct
  desc: Go portForward or tunnelForward module
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/network/forward::go-port-forward-portforward
  - id: micro-behaviors/network/forward::go-port-forward-tunnelforward
