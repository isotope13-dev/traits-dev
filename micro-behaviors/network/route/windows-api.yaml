defaults:
  platforms:
  - windows
traits:
- for:
  - pe
  id: create-ip-forward-entry
  desc: References CreateIpForwardEntry route API
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: CreateIpForwardEntry
- for:
  - pe
  id: create-ip-forward-entry2
  desc: References CreateIpForwardEntry2 route API
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: CreateIpForwardEntry2
- for:
  - pe
  id: delete-ip-forward-entry
  desc: References DeleteIpForwardEntry route API
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: DeleteIpForwardEntry
- for:
  - pe
  id: delete-ip-forward-entry2
  desc: References DeleteIpForwardEntry2 route API
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: DeleteIpForwardEntry2
- for:
  - pe
  id: set-ip-forward-entry2
  desc: References SetIpForwardEntry2 route API
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: SetIpForwardEntry2
- for:
  - pe
  - dll
  - c
  - cpp
  id: get-ip-forward-table
  desc: References route-table lookup API
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: GetIpForwardTable
- id: get-best-interface-ex
  desc: References route-based interface API
  crit: notable
  conf: 0.9
  if:
    type: symbol
    exact: GetBestInterfaceEx
  for:
  - pe
  - dll
  - c
  - cpp
composite_rules:
- for:
  - pe
  id: route-entry-api-reference-set
  desc: References multiple route-entry APIs
  crit: notable
  conf: 0.9
  needs: 2
  any:
  - id: create-ip-forward-entry
  - id: create-ip-forward-entry2
  - id: delete-ip-forward-entry
  - id: delete-ip-forward-entry2
  - id: set-ip-forward-entry2
  downgrade:
    any:
    - id: metadata/binary/symbols/count::high-export-count-marker
    - id: metadata/signed/trust-level::signer-evidence-present
    - id: well-known/dual-use/tunnel/netch/
