defaults:
  platforms: [routeros, appliance]
  for: [javascript]

traits:
- id: routeros-js-routing-query
  desc: Writes RouterOS routing query path
  crit: suspicious
  conf: 0.91
  if:
    type: tree-sitter
    language: javascript
    query: |
      (call_expression
        function: (member_expression
          object: (identifier) @client
          property: (property_identifier) @method)
        arguments: (arguments . (string (string_fragment) @path) .)
        (#match? @client "^(client|socket|conn|connection)$")
        (#eq? @method "write")
        (#match? @path "^/routing/(bgp/connection|ospf/instance|table)/print$"))
- id: routeros-js-routing-path-reference
  desc: References RouterOS routing query path
  crit: notable
  conf: 0.82
  if:
    type: string_literal
    regex: '^/routing/(bgp/connection|ospf/instance|table)/print$'
  unless:
  - id: routeros-js-routing-query
