# Tailscale settings and enrollment do not by themselves establish C2.
defaults:
  platforms: [unix, windows]
  for: [go, c, cpp, pe, dll, shell, scripts]

traits:
  - id: userspace-networking-mode
    for: [python, shell, scripts]
    desc: Tailscale userspace-networking option reference
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(tailscale|tailscaled)\b[^\n]{0,180}--tun[= ]userspace-networking'

  - id: memory-only-node-state
    for: [python, shell, scripts]
    desc: Tailscale memory-only state option reference
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)\btailscaled\b.{0,300}--state(=|\s+)mem:'

  - id: client-telemetry-suppression
    for: [python, shell, scripts]
    desc: Tailscale client logging disabled option
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?is)\btailscaled\b.{0,300}--no-logs-no-support\b'

  - id: accept-routes
    for: [python, shell, scripts]
    desc: Tailscale accept-routes option reference
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)\b(tailscale|tailscaled)\b.{0,220}--accept-routes\b'

composite_rules:
  - id: ephemeral-mesh-egress-enrollment
    for: [python, shell, scripts]
    desc: Mesh enrollment and SOCKS settings co-occur
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/network/tunnel::userspace-networking-mode
      - id: micro-behaviors/network/tunnel::auth-key-enrollment
      - id: micro-behaviors/communications/proxy/socks::local-socks-egress-proxy
    near_lines: 12

  - id: memory-only-telemetry-suppressed-egress
    for: [python, shell, scripts]
    desc: Memory-only Tailscale SOCKS relay suppresses logs
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/network/tunnel::memory-only-node-state
      - id: micro-behaviors/network/tunnel::client-telemetry-suppression
      - id: micro-behaviors/communications/proxy/socks::local-socks-egress-proxy
    near_lines: 8
  - id: userspace-memory-state-no-logs
    desc: Userspace, memory state and no logs co-occur
    crit: suspicious
    conf: 0.98
    near_bytes: 2000
    all:
      - id: micro-behaviors/network/tunnel::userspace-networking-reference
      - id: metadata/lang/source/syntax/command::tailscale-no-logs-option
    any:
      - id: metadata/lang/source/literal::memory-state-mem-literal
      - id: metadata/lang/source/syntax/command::tailscale-memory-state-option
      - id: micro-behaviors/network/tunnel::memory-only-node-state
    downgrade:
      scope: archive
      any:
        - id: well-known/dual-use/tunnel/cloud-tailscale::package-context

