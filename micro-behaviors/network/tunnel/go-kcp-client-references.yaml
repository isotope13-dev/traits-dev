defaults:
  crit: notable
  platforms: [linux, macos]
  for: [go, elf, macho]
traits:
  - id: go-kcp-tunnel-client-call
    desc: KCP tunnel client symbol reference
    conf: 0.82
    if:
      type: symbol
      exact: transport.KCPTunClient

  - id: go-kcp-tunnel-client-text
    desc: Go KCP tunnel client reference
    conf: 0.72
    if:
      type: text
      substr: KCPTunClient

composite_rules:
  - id: go-kcp-tunnel-client
    desc: KCP client symbol or text
    conf: 0.84
    any:
      - id: micro-behaviors/network/tunnel::go-kcp-tunnel-client-call
      - id: micro-behaviors/network/tunnel::go-kcp-tunnel-client-text
