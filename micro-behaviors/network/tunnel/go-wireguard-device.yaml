defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.98
traits:
  - id: go-constructed-wireguard-device-config
    desc: Configures a constructed Go WireGuard device
    if:
      type: symbol
      kind: call
      regex: '\.IpcSetOperation$'
      receiver:
        from:
          call: '^golang\.zx2c4\.com/wireguard/device\.NewDevice$'
