---
defaults:
  crit: notable
  platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - pe
  - go
traits:
- id: go-tunnel-type--rx-1
  desc: Go tunnel and config type names
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: "\\*tunnel\\.(Tunnel|Config)\\b"
- id: go-tunnel-type--rx-2
  desc: Go proxy and SSH tunnel type names
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: "\\*tunnel\\.(Proxy|sshTunnel)\\b"
- id: go-tunnel-type--rx-3
  desc: Go tunnel UDP type names
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: "\\*tunnel\\.(udpConn|udpListener)\\b"
- id: go-tunnel-close
  desc: Go tunnel close routine
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: CloseTunnel
  unless:
  - id: metadata/lang/compiler/managed::dotnet-assembly
- id: go-tunnel-listen
  desc: Go tunnel listen routine
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: listenTunnel
  unless:
  - id: metadata/lang/compiler/managed::dotnet-assembly
composite_rules:
- id: go-tunnel-type
  desc: Go tunnel type reference
  crit: notable
  conf: 0.75
  any:
  - id: micro-behaviors/network/tunnel::go-tunnel-type--rx-1
  - id: micro-behaviors/network/tunnel::go-tunnel-type--rx-2
  - id: micro-behaviors/network/tunnel::go-tunnel-type--rx-3
