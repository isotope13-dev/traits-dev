defaults:
  platforms: [linux]
  for: [c, cpp, rust, go, python, shell, elf]
  crit: notable
  conf: 0.95

traits:
  - id: ip-xfrm-state-write-command
    desc: IP command writes IPsec ESP state
    for: [shell, elf]
    if:
      type: text
      regex: '\bip\s+xfrm\s+state\s+(add|update)\b[^\n]{0,240}\bproto\s+esp\b'

  - id: ip-xfrm-state-write-source-command
    desc: Command literal writes IPsec ESP state
    for: [c, cpp, rust, go, python]
    if:
      type: literal
      regex: '\bip\s+xfrm\s+state\s+(add|update)\b[^\n]{0,240}\bproto\s+esp\b'

  # Structured nodes exclude source comments. Call facts cannot describe
  # initializer arrays passed through a command-execution helper.
  - id: ip-xfrm-state-write-initializer
    desc: XFRM state write in argument initializer
    for: [c, cpp]
    if:
      type: tree-sitter
      node: initializer_list
      regex: '["'']xfrm["'']\s*,\s*["'']state["'']\s*,\s*["''](add|update)["'']'

  - id: ip-xfrm-state-write-assignment
    desc: XFRM state write in assigned arguments
    for: [rust, go]
    if:
      type: tree-sitter
      kind: assignment
      regex: '["'']xfrm["'']\s*,\s*["'']state["'']\s*,\s*["''](add|update)["'']'

  - id: ip-xfrm-state-write-call
    desc: XFRM state write in call arguments
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '["'']xfrm["'']\s*,\s*["'']state["'']\s*,\s*["''](add|update)["'']'

  - id: ip-xfrm-esp-protocol-argv
    desc: Argument pair selects IPsec ESP protocol
    for: [c, cpp, rust, go, python]
    if:
      type: text
      regex: '["'']proto["'']\s*,\s*["'']esp["'']'

composite_rules:
  - id: ip-xfrm-state-write-argv
    desc: Argument array creates or updates XFRM state
    for: [c, cpp, rust, go, python]
    any:
      - id: ip-xfrm-state-write-initializer
      - id: ip-xfrm-state-write-assignment
      - id: ip-xfrm-state-write-call

  - id: ip-xfrm-esp-state-write-argv
    desc: XFRM state write arguments with ESP selection
    for: [c, cpp, rust, go, python]
    all:
      - id: ip-xfrm-state-write-argv
      - id: ip-xfrm-esp-protocol-argv
