defaults:
  platforms: [windows, unix]

traits:
- for: [go, c, cpp, pe, dll, shell, scripts]
  id: userspace-networking-reference
  desc: Userspace networking configuration reference
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)userspace-networking\b
- id: auth-key-enrollment
  for: [python, shell, scripts]
  desc: Tailscale auth-key node enrollment
  crit: notable
  conf: 0.94
  attack: T1090.001,T1021
  if:
    type: text
    regex: '(?is)\btailscale(d)?\b.{0,360}--auth-key(=|\s+)\S+'
  not:
    - regex: '--auth-key(=|\s+)(…|\.{3})'
    - regex: 'examples?"?\s*:\s*(\[|\n)'
    - regex: '--auth-key(=|\s+)["'']?\$'
    - regex: '--auth-key=file:'
  unless:
    - id: metadata/file/catalog/threat-pattern::secret-rule-regex-catalog
