# Kernel traffic-policy ABI references are neutral. Intent requires the
# otherwise unrelated page-splice, netlink-tap and ESP paths in objectives.
defaults:
  platforms: [linux]
  for: [c, cpp, rust, go, python]
  crit: notable
  conf: 0.95

traits:
  - id: nfqueue-full-packet-copy-mode
    desc: References NFQUEUE full-packet copy mode
    if:
      type: symbol
      kind: identifier
      exact: NFQNL_COPY_PACKET

  - id: tc-pedit-parameters
    desc: References tc packet-edit parameters
    if:
      type: symbol
      kind: identifier
      regex: '^TCA_PEDIT_PARMS(_EX)?$'

  - id: tc-egress-redirect-action
    desc: References tc egress redirect action
    if:
      type: symbol
      kind: identifier
      exact: TCA_EGRESS_REDIR
