defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: grep-excludes-ipv4-lines
    desc: Grep excludes IPv4 address lines
    if:
      type: text
      regex: 'grep[ \t]+-[EFv]{0,2}v\b[ \t]+["'']?([0-9]{1,3}\.){3}[0-9]{1,3}'
  - id: netstat-inverse-output-filter
    desc: Filters matching netstat output lines
    if:
      type: text
      regex: '(?m)^[ \t]*(busybox[ \t]+)?netstat[^\r\n|]{0,60}\|[ \t]*grep[ \t]+-[EFv]{0,2}v\b'
