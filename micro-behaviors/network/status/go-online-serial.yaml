defaults:
  platforms: [unix, windows]
  for: [go]

traits:
  - id: go-check-online-serial-call
    desc: Calls CheckOnline with a serial argument
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: CheckOnline
      arg:
        kind: identifier
        name: serial

composite_rules:
  - id: go-online-serial-hex-check
    desc: Online serial check with hexadecimal formatting
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/data/format/string::go-sprintf-zero-padded-hex
      - id: micro-behaviors/network/status::go-check-online-serial-call


