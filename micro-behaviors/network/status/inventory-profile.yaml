defaults:
  platforms: [windows]
  for: [batch, powershell]

composite_rules:
  - id: inventory-and-reachability-commands
    desc: Inventory and reachability command references
    crit: notable
    conf: 0.86
    any:
      - id: micro-behaviors/network/status::ipconfig-all
      - id: micro-behaviors/os/sysinfo/query::wmic-product-version
      - id: micro-behaviors/communications/icmp::ping-internal-hosts
    needs: 2
