defaults:
  platforms: [unix]
  for: [shell, elf]

traits:
  - id: shell-arp-display-flag-call
    desc: Shell calls arp with display flags
    crit: notable
    conf: 0.9
    for: [shell]
    unless:
      - id: metadata/package/files/system-package::shell-completion-script
      - type: text
        regex: 'COMPREPLY[+]?=.*(arp -an|ip neigh show)'
      - type: text
        substr: 'Dummy "arp -an" emulator'
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command
          name: (command_name (word) @tool)
          . argument: (word) @flag) @invocation
          (#eq? @tool "arp")
          (#match? @flag "^-[ane]*a[ane]*$")
          (#not-match? @invocation "(?i)(^|[ \\t])(-[a-z]*[sdf][a-z]*|--(set|delete|file))([ \\t]|$)"))
  - id: shell-arp-display-text-reference
    desc: Contains arp display command text
    crit: notable
    conf: 0.9
    for: [elf]
    if:
      type: text
      regex: '(?m)(^|[;&|(){}\[\]\s]|/)(arp\s+-[A-Za-z]*a[A-Za-z]*\b)'
    unless:
      - id: metadata/package/files/system-package::shell-completion-script
      - type: text
        regex: 'COMPREPLY[+]?=.*(arp -an|ip neigh show)'
      - type: text
        substr: 'Dummy "arp -an" emulator'
  - id: shell-ip-neigh-display-call
    desc: Shell calls ip neigh show or list
    crit: notable
    conf: 0.85
    for: [shell]
    platforms: [unix, windows]
    if:
      type: symbol
      kind: call
      exact: ip
      args:
        - index: 0
          kind: identifier
          name: neigh
        - index: 1
          kind: identifier
          name_regex: '^(show|list)$'
  - id: shell-ip-neigh-stats-display-call
    desc: Shell calls ip stats neighbor display
    crit: notable
    conf: 0.85
    for: [shell]
    platforms: [unix, windows]
    if:
      type: symbol
      kind: call
      exact: ip
      args:
        - index: 0
          kind: identifier
          name: -s
        - index: 1
          kind: identifier
          name: neigh
        - index: 2
          kind: identifier
          name_regex: '^(show|list)$'
  - id: shell-ip-neigh-display-text-reference
    desc: Contains ip neighbor display command text
    crit: notable
    conf: 0.85
    platforms: [unix, windows]
    for: [elf]
    if:
      type: text
      regex: '(?i)\bip\s+neigh\s+(show|list)\b'

composite_rules:
  - id: ip-neigh-display
    desc: Shell calls ip to display neighbors
    crit: notable
    conf: 0.85
    for: [shell]
    platforms: [unix, windows]
    any:
      - id: shell-ip-neigh-display-call
      - id: shell-ip-neigh-stats-display-call
