defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.9
traits:
  - id: go-command-arp-argument
    desc: Go Command call names arp program
    if:
      type: symbol
      kind: call
      exact: exec.Command
      arg:
        index: 0
        kind: string
        exact: arp
  - id: go-command-arp-display-arguments
    desc: Go Command call passes arp display args
    if:
      type: symbol
      kind: call
      exact: exec.Command
      args:
        - index: 0
          kind: string
          exact: arp
        - index: 1
          kind: string
          regex: '^-[ane]*a[ane]*$'
