defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-arp-display-call
    desc: PowerShell calls arp with display flag
    crit: notable
    conf: 0.88
    if:
      type: tree-sitter
      query: |
        ((command
          command_name: (command_name) @command
          command_elements: (command_elements
            (command_parameter) @flag)) @invocation
          (#match? @command "(?i)^arp(\\.exe)?$")
          (#match? @flag "(?i)^-[ane]*a[ane]*$")
          (#not-match? @invocation "(?i)(^|[ \\t])(-[a-z]*[sdf][a-z]*|--(set|delete|file))([ \\t]|$)"))
  - id: powershell-arp-display-call-operator
    desc: PowerShell invokes arp display command
    crit: notable
    conf: 0.88
    if:
      type: tree-sitter
      query: |
        ((command
          (command_invokation_operator)
          command_name: (command_name_expr) @command
          command_elements: (command_elements
            (command_parameter) @flag)) @invocation
          (#match? @command "(?i)^arp(\\.exe)?$")
          (#match? @flag "(?i)^-[ane]*a[ane]*$")
          (#not-match? @invocation "(?i)(^|[ \\t])(-[a-z]*[sdf][a-z]*|--(set|delete|file))([ \\t]|$)"))

composite_rules:
  - id: powershell-arp-display
    desc: PowerShell calls arp for cache display
    crit: notable
    conf: 0.88
    any:
      - id: powershell-arp-display-call
      - id: powershell-arp-display-call-operator
