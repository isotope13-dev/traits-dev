# References and API co-occurrence do not establish bound data flow.
composite_rules:
- platforms:
  - windows
  for:
  - pe
  id: hosts-path-dns-flush-api-cooccurrence
  desc: Hosts path and DNS-cache flush references coexist
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/fs/path/config/system::hosts-file-path
  - id: micro-behaviors/communications/dns/flush::dns-flush-resolver-cache
  unless:
  - id: well-known/dual-use/tunnel/sing-box/
