defaults:
  platforms: [unix]
  for: [php]
  crit: notable
traits:
  - id: php-reads-bind-zone-configuration
    desc: PHP reads BIND zone configuration
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^(file|file_get_contents)$'
      arg:
        index: 0
        kind: string
        regex: '^/etc/(bind/)?named\.conf$'
