defaults:
  for: [pe, dll, csharp]
  platforms: [windows]
traits:
  - id: netsh-set-dns
    desc: netsh set interface DNS server
    crit: notable
    conf: 0.92
    attack: T1565.001
    if:
      type: text
      regex: netsh\s+interface\s+(ip|ipv4)\s+(set|add)\s+dns\s+name=
      case_insensitive: true
    downgrade:
      any:
        - type: metrics
          field: pe.cert_table_size
          min: 1
  - id: ipconfig-flushdns-renew
    desc: Flush and renew DNS resolver state
    crit: suspicious
    conf: 0.9
    attack: T1565.001
    if:
      type: text
      regex: ipconfig\s+/flushdns.{0,40}ipconfig\s+/renew
      case_insensitive: true
composite_rules:
  - id: dns-reconfiguration-cli
    desc: DNS configuration rewritten via CLI
    crit: notable
    conf: 0.93
    all:
      - id: netsh-set-dns
    any:
      - id: ipconfig-flushdns-renew
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
