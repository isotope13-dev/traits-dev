defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: shell-nameserver-line-literal
    desc: Shell literal starts with nameserver directive
    crit: notable
    conf: 0.95
    if:
      type: string_literal
      regex: '^nameserver[ \t]'

composite_rules:
  - id: shell-resolver-and-nameserver-literals
    desc: Resolver path and nameserver directive coexist
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/config/network::config-resolv
      - id: shell-nameserver-line-literal
