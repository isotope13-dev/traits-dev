defaults:
  platforms: [windows]
  for: [powershell, pe, dll]
  crit: notable
  conf: 0.96
traits:
  - id: powershell-set-dns-server-address-text
    desc: DNS server-address configuration command text
    if:
      type: text
      regex: '(?i)\bSet-DnsClientServerAddress\b[^\r\n]{0,120}-ServerAddresses\b'
