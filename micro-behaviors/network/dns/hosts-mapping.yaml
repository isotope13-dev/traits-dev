defaults:
  platforms: [windows, unix]
  for: [text, batch]

traits:
  - id: public-ip-hosts-mapping
    desc: Public IPv4 mapped to dotted hostname
    crit: notable
    conf: 0.9
    if:
      type: text
      # Require a domain label, not a second numeric traceroute-table column.
      regex: '(?m)^[ \t]*[0-9.]{7,15}[ \t]+[\w.-]{1,200}\.[A-Za-z]{2,24}([ \t#]|$)'
      is: external_ip
