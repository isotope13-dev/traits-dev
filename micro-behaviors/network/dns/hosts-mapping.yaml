defaults:
  platforms: [windows, unix]
  for: [text, batch]

traits:
  - id: public-ip-hosts-mapping
    desc: Public IPv4 mapped to dotted hostname
    crit: notable
    conf: 0.9
    if:
      type: text
      # Require a domain label, not a second numeric traceroute-table column.
      # Hosts files commonly use CRLF. Accept the carriage return before the
      # line end so public-address mappings in Windows hosts files remain
      # visible to consumers that require this structural fact.
      regex: '(?m)^[ \t]*[0-9.]{7,15}[ \t]+[\w.-]{1,200}\.[A-Za-z]{2,24}([ \t#]|\r?$)'
      is: external_ip
