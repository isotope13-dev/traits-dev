defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  # libusb0's driver control codes (notably 0x222024) collide with known
  # vulnerable-driver terminate IOCTLs; a file exporting the libusb transfer
  # API issues those codes to libusb0.sys for USB transfers, not EDR teardown.
  - id: libusb-api-export
    desc: Exports libusb USB transfer API
    conf: 0.95
    if:
      type: export
      exact: usb_init
