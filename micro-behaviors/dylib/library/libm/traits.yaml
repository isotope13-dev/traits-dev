# libm (math library) symbols. Bare imported math functions emitted by any
# program importing C math APIs. These identify math capabilities;
# they do not establish cryptography or payload decoding.
defaults:
  platforms: [linux, macos]
  for: [elf, macho]
  crit: notable
  conf: 0.85
traits:
  - id: libm-cos-symbol
    desc: libm cos import
    if:
      type: symbol
      kind: import
      exact: cos
  - id: libm-sin-symbol
    desc: libm sin import
    if:
      type: symbol
      kind: import
      exact: sin
  - id: libm-tan-symbol
    desc: libm tan import
    if:
      type: symbol
      kind: import
      exact: tan
  - id: libm-exp-symbol
    desc: libm exp import
    if:
      type: symbol
      kind: import
      exact: exp
  - id: libm-pow-symbol
    desc: libm pow import
    if:
      type: symbol
      kind: import
      exact: pow
  - id: libm-hypot-symbol
    crit: notable
    desc: libm hypot import
    if:
      type: symbol
      kind: import
      exact: hypot
  - id: libm-log1p-symbol
    crit: notable
    desc: libm log1p import
    if:
      type: symbol
      kind: import
      exact: log1p
  - id: libm-fmod-symbol
    desc: libm fmod import
    if:
      type: symbol
      kind: import
      exact: fmod
