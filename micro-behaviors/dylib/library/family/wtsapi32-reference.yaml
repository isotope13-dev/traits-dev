defaults:
  platforms: [windows]
  for: [pe, dll, python, rust, go, c, cpp, scripts]
  crit: notable
traits:
  - id: wtsapi32-dll-reference
    desc: References Windows Terminal Services API DLL
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bwtsapi32\.dll\b'

# Preserve the former PE-only WTS selector for conjunction consumers.
composite_rules:
  - id: pe-terminal-services-library-reference
    desc: PE references Terminal Services API library
    crit: notable
    conf: 0.9
    for: [pe]
    any:
      - id: micro-behaviors/dylib/load/wtsapi::wts-disconnect
      - id: micro-behaviors/dylib/load/wtsapi::wts-session-notification
      - id: micro-behaviors/dylib/library/family::wtsapi32-dll-reference
