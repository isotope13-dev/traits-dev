# Original matchers and effective scopes are retained.
traits:
- platforms:
  - windows
  for:
  - source
  id: enum-process-modules-source
  desc: EnumProcessModules reference in source
  crit: notable
  conf: 0.9
  downgrade:
    any:
    - id: metadata/file/profile/source-indications/
    - type: basename
      regex: (?i)(debugpy|pydevd|py_win_helpers\.hpp)
    - type: basename
      regex: (?i)^killall(\.c)?$
  if:
    type: text
    word: EnumProcessModules
  unless:
  - type: basename
    regex: (?i)\.(h|hh|hpp|hxx)$
