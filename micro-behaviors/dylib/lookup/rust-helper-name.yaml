defaults:
  platforms: [windows]
  for: [rust]
traits:
  - id: rust-helper-result-api-name
    desc: Rust helper result supplies resolved API name
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((block
          (let_declaration pattern: (identifier) @name
            value: (call_expression function: (identifier)
              arguments: (arguments (string_literal) (integer_literal) (integer_literal))))
          (let_declaration value: (call_expression
            function: (identifier) @lookup
            arguments: (arguments (_) (call_expression
              function: (field_expression value: (identifier) @name_used field: (field_identifier) @pointer)
              arguments: (arguments)))))) @lookup_block
         (#eq? @lookup "GetProcAddress")
         (#eq? @pointer "as_ptr")
         (#eq? @name @name_used))
