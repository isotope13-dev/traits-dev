# Sparse imports do not establish concealment. This neutral observation also
# applies to legitimate loader hosts; consumers must supply attack evidence.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: sparse-pe-dynamic-linking
    desc: Dynamic-linking APIs with under 40 imports
    crit: notable
    conf: 0.95
    size_min: 8193
    all:
      - id: micro-behaviors/dylib/lookup::pe-dynamic-linking-api-references
      - id: metadata/binary/symbols/count::pe-imports-under-40
