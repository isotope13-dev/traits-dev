defaults:
  platforms:
  - linux
  - macos
  - windows
composite_rules:
- id: dlsym-cleanup-or-error-api-profile
  desc: Symbol lookup with cleanup or error API references
  crit: notable
  conf: 0.85
  for:
  - elf
  - macho
  all:
  - id: micro-behaviors/dylib/lookup::dlsym-symbol
  any:
  - id: micro-behaviors/dylib/unload::dlclose
  - id: micro-behaviors/dylib/load/runtime::dlerror
  unless:
  - id: metadata/file/string/identity::system-shell-basename
  - id: well-known/app/system/drivers/
  - id: well-known/tool/reverse-engineering/frida/
