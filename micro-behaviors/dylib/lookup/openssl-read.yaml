defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: notable
  conf: 0.98

traits:
  - id: rtld-next-ssl-read-call
    desc: Resolves next OpenSSL read implementation
    if:
      type: symbol
      kind: call
      exact: dlsym
      args:
        - index: 0
          kind: identifier
          name: RTLD_NEXT
        - index: 1
          kind: string
          exact: SSL_read
