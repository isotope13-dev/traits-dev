defaults:
  platforms: [windows, unix]
  for: [c, cpp]
traits:
  - id: native-helper-result-api-name
    desc: Native helper result supplies resolved API name
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @lookup
          arguments: (argument_list
            (_)
            (call_expression
              function: (identifier)
              arguments: (argument_list (string_literal) (_) (_))))) @lookup_call
         (#match? @lookup "^(GetProcAddress|dlsym)$"))
