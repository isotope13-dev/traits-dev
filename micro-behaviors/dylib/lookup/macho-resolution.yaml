defaults:
  platforms: [macos]
  for: [macho]
composite_rules:
  - id: macho-sparse-imports-dlsym
    desc: Mach-O uses dlsym with fewer than 40 imports
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/dylib/lookup::dlsym-symbol
      - id: metadata/binary/symbols/count::imports-under-40
    unless:
      - id: metadata/build/debug::macos-dsym-debug-symbol
  - id: macho-dlsym-and-system
    desc: Mach-O references dlsym and system
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/dylib/lookup::dlsym-symbol
      - id: micro-behaviors/process/create/subprocess/reference::system-command-api-clues
