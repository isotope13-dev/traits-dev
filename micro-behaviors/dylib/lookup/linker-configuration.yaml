defaults:
  platforms: [linux]
  for: [elf]
composite_rules:
  - id: dynamic-linker-configuration-references
    desc: Symbol lookup and dynamic-linker configuration references
    crit: notable
    conf: 0.7
    all:
      - id: micro-behaviors/dylib/lookup::dlsym-symbol
    any:
      - id: micro-behaviors/os/linker::rtld-global-ref
      - id: micro-behaviors/os/linker::la-symbind-ref
      - id: micro-behaviors/os/env/runtime::ld-preload
      - id: micro-behaviors/os/linker::ld-audit
