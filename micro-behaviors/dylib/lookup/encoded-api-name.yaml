defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  - id: encoded-createprocess-name
    desc: Encoded CreateProcess API name
    conf: 0.95
    if:
      type: encoded
      encoding: [xor, base64, hex]
      regex: '^CreateProcess[AW]$'
  - id: encoded-shellexecute-name
    desc: Encoded ShellExecute API name
    conf: 0.95
    if:
      type: encoded
      encoding: [xor, base64, hex]
      regex: '^ShellExecute[AW]$'
composite_rules:
  - id: encoded-win32-api-name
    desc: Encoded Win32 execution or memory API name
    conf: 0.95
    any:
      - id: micro-behaviors/mem/alloc/virtual::encoded-virtualalloc-name
      - id: micro-behaviors/mem/protect/modify::encoded-virtualprotect-name
      - id: encoded-createprocess-name
      - id: encoded-shellexecute-name
