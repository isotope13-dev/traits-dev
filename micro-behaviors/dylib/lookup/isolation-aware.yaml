defaults:
  platforms: [windows]
  for: [c, cpp, javascript, text]

traits:
  # The SDK helper loads the configured module and calls GetProcAddress.
  # Its ROT13-style identifier is a compile-time name, not a decoded API.
  # Require the return-value assignment as well as call syntax: .inl files
  # are misparsed as JS, leaving only an identifier fact for this call.
  - id: isolation-aware-export-lookup-call
    desc: Calls SDK activation-aware export resolver
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\bproc\s*=\s*IsolationAwarePrivatezltRgCebPnQQeRff\s*\('
