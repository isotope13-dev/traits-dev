# RTLD_NEXT lookup is ordinary interposition, including auditing wrappers.
# Scope includes native source embedded in scripts that build an interposer.
defaults:
  platforms: [unix]
  crit: notable
  conf: 0.95
traits:
  - id: rtld-next-readdir-lookup
    desc: Resolves next directory enumeration function
    for: [c, cpp, rust]
    if:
      type: symbol
      kind: call
      regex: '(^|::)dlv?sym$'
      args:
        - index: 0
          kind: identifier
          name: RTLD_NEXT
        - index: 1
          kind: string
          regex: '^readdir(64)?$'
  - id: embedded-rtld-next-readdir-lookup
    desc: Embedded source resolves next directory reader
    for: [scripts]
    if:
      type: text
      regex: '\bdlv?sym\s*\(\s*[\w:.]*RTLD_NEXT\s*,\s*"readdir(64)?"'
