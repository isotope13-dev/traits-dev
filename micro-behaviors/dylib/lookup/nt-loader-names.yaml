defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.97
traits:
  - id: ldr-get-procedure-address-name
    desc: LdrGetProcedureAddress API name reference
    if:
      type: text
      word: LdrGetProcedureAddress

composite_rules:
  - id: native-loader-memory-api-table
    desc: Native loader and memory API name table
    crit: notable
    conf: 0.97
    near_bytes: 400
    all:
      - id: ldr-get-procedure-address-name
      - id: micro-behaviors/mem/alloc/virtual::nt-allocate-virtual-memory-api
      - id: micro-behaviors/mem/protect/modify::nt-protect-virtual-memory-name
      - id: micro-behaviors/mem/copy::rtl-move-memory-name
