defaults:
  platforms: [windows]
  conf: 0.9
composite_rules:
  - id: pe-dynamic-linking-api-references
    desc: PE references dynamic-linking APIs
    crit: notable
    for: [pe]
    any:
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      # Source-language GetProcAddress references (non-PE).
      - id: micro-behaviors/dylib/lookup::get-proc-address

    downgrade:
      # Preserve the baseline treatment of universal toolchain resolver imports.
      any:
        - id: well-known/tool/development/toolchain/llvm/
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiler/systems::go-module-path
