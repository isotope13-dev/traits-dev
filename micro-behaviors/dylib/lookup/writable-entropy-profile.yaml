composite_rules:
- id: unsigned-writable-entry-high-entropy-api-lookup
  desc: GetProcAddress import in unsigned writable-entry high-code-entropy PE
  conf: 0.97
  all:
  - id: metadata/binary/section/header::pe-entry-in-writable-section
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  - id: metadata/binary/code/entropy::high-code-entropy
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/framework/
  - id: well-known/app
  - id: metadata/binary/section/label::vmp-section-name
  for:
  - pe
- id: unsigned-writable-entry-api-lookup-debugger-imports
  desc: Unsigned writable-entry PE imports API lookup and debugger-query functions
  conf: 0.96
  all:
  - id: metadata/binary/section/header::pe-entry-in-writable-section
  - id: metadata/binary/section/permission::wx-section
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  - id: micro-behaviors/process/debug/detect::is-debugger-present-import
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: metadata/binary/installer/family/
  - id: well-known/tool/reverse-engineering/
  for:
  - pe
- id: rwx-reloc-api-and-layout-profile
  desc: RWX relocation section with API-loading or unusual-layout indicators
  conf: 0.98
  all:
  - id: metadata/binary/section/entropy::large-high-entropy-rwx-reloc
  any:
  - id: metadata/binary/layout/size::pe-file-alignment-under-512
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  - id: micro-behaviors/dylib/load/runtime::load-library-a
  - id: metadata/binary/symbols/count::recovered-function-count-under-10
  needs: 2
  for:
  - pe
  - dll
defaults:
  platforms:
  - windows
  crit: notable
