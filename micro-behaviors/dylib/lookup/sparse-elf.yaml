# Sparse imports plus loader APIs are ordinary in native libraries.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable

composite_rules:
  - id: sparse-elf-dynamic-linking
    desc: ELF symbol lookup with fewer than 20 imports
    conf: 0.8
    size_min: 32768
    all:
      - id: micro-behaviors/dylib/lookup::dlsym-symbol
    unless:
      - id: metadata/binary/symbols/count::many-imports-20
      - id: metadata/package/versioning/
      - id: well-known/app/system/drivers/
    downgrade:
      any:
        - id: metadata/binary/section/label::upx-section
        - id: well-known/dual-use/packaging/pecompact::pecompact-signature
