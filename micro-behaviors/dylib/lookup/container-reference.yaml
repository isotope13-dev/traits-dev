defaults:
  platforms: [windows]
  for: [data]
traits:
  - id: get-proc-address-container-reference
    desc: GetProcAddress API reference in opaque content
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z])GetProcAddress([^A-Za-z]|$)'
    unless:
      - id: metadata/file/magic/identity::sqlite3
