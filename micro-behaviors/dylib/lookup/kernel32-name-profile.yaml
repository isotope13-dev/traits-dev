composite_rules:
  - id: kernel32-loader-api-name-cluster
    desc: Kernel32 loading and memory API-name cluster
    needs: 2
    any:
      - id: metadata/binary/symbols/name/process::mapview-createprocessw-concatenated-name
      - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-ex-name-without-import
      - id: micro-behaviors/dylib/load/runtime::loadlibraryexa-name-not-imported
  - id: kernel32-loader-lookup-pe-header-profile
    desc: Kernel32 API names, dynamic lookup and PE-header access
    all:
      - id: micro-behaviors/dylib/lookup::kernel32-loader-api-name-cluster
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/data/parse/portable-executable::pe-header-walk-x64
defaults:
  platforms:
    - windows
  for:
    - pe
  crit: notable
  conf: 0.97
