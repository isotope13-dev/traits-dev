defaults:
  platforms:
    - unix
    - windows
  for:
    - c
    - elf

composite_rules:
  - id: arch-aware-resolver-reference-profile
    desc: Resolver identifier with architecture guards
    crit: notable
    for: [c]
    conf: 0.85
    all:
      - id: micro-behaviors/dylib/lookup::source-library-resolver-identifier
    any:
      - id: micro-behaviors/os/sysinfo/platform/arch::elif-arch-macro-branch
      - id: micro-behaviors/os/sysinfo/platform/arch::elif-aarch64-macro-branch
      - id: metadata/lang/source/syntax/directive::ifdef-x86-arm-arch-guard
      - id: metadata/lang/source/syntax/directive::ifdef-aarch64-arch-guard
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/lang/upstream::linux-kernel-source-tree-path
      - id: metadata/package/documentation/manpage::unix-manpage
      - id: well-known/tool/development/toolchain/gcc-toolchain::gcc-bootstrap-benign-context
      - id: well-known/tool/development/testing/aflplusplus::aflplusplus-context
      - id: metadata/path::rizin-source-tree-path
