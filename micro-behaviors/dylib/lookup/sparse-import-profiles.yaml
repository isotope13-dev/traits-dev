composite_rules:
- platforms:
  - linux
  - macos
  - windows
  id: large-binary-sparse-import-resolution
  desc: 'Large binary: sparse imports, dynamic linking'
  crit: notable
  conf: 0.9
  for:
  - pe
  - elf
  - macho
  - -go
  - -rust
  size_min: 5242880
  all:
  - id: metadata/binary/symbols/count::max-30-imports
  any:
  - id: micro-behaviors/dylib/load/runtime::load-library-a
  - id: micro-behaviors/dylib/lookup::get-proc-address
  - id: micro-behaviors/dylib/load/runtime::dlopen
  - id: micro-behaviors/dylib/lookup::dlsym-symbol
  unless:
  - id: metadata/binary/framework::clr-runtime-header
  - id: metadata/lang/compiler/systems::go-binary
  - id: metadata/lang/compiled/
  - id: metadata/binary/linking/static/
  - id: metadata/package/vendor::bitdefender-ctc-module
  - id: well-known/app/system/iobit::iobit-signed-component-context
  - id: well-known/app/browser/phantomjs::phantomjs-official-binary
