# A forwarded export delegates symbol resolution to a different module: the
# loader resolves the name in the target library rather than in this one.
#
# Compatibility shims and versioned wrapper libraries declare these for good
# reasons, so the directive says only "this library re-exports another one".
# It is also how a sideloading DLL keeps the application that loaded it working
# while running its own code from DllMain — that reading is supplied by the
# objectives/evasion/masquerade/dll/sideload composites, and the finished
# binary's equivalent is metadata/binary/symbols/exports::pure-proxy-dll.
defaults:
  platforms: [windows]
  for: [c, cpp]
traits:
  - id: source-forwarded-export-directive
    desc: Forwards an export to another module
    crit: notable
    conf: 0.95
    attack: T1574.002
    if:
      type: text
      regex: '(?i)/export:\s*\w{1,64}\s*=\s*[\w.-]{1,64}\.\w'
