defaults:
  platforms: [macos]
  for: [macho, c, cpp, objc]
traits:
  - id: nslookup-symbol-module-api
    desc: Mach-O module-symbol lookup API reference
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: "NSLookupSymbolInModule"
  - id: nsaddress-symbol-api
    desc: Mach-O symbol-address API reference
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: "NSAddressOfSymbol"
  # shared_region_check_np returns the dyld shared-cache base, letting code
  # find dyld and libSystem internals by walking the cache with no imports.
  - id: dyld-shared-cache-syscall-wrapper
    desc: References dyld shared-cache base syscall
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: shared_region_check_np
