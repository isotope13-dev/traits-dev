defaults:
  platforms: [macos]
  for: [macho]
traits:
  - id: nslookup-symbol-module-api
    desc: Mach-O module-symbol lookup API reference
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: "NSLookupSymbolInModule"
  - id: nsaddress-symbol-api
    desc: Mach-O symbol-address API reference
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: "NSAddressOfSymbol"
