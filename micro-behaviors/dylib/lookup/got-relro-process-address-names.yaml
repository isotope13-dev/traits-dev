defaults:
  for: [c, cpp]
  platforms: [unix]

composite_rules:
- id: got-relro-process-address-names
  desc: GOT RELRO and process address names
  crit: notable
  conf: 0.94
  all:
  - id: metadata/lang/source/naming/variable::got-address-name
  - id: metadata/lang/source/naming/variable::got-offset-name
  - id: metadata/lang/source/naming/variable::relro-active-name
  any:
  - id: metadata/lang/source/naming/variable::process-stack-return-address-name
  - id: metadata/lang/source/naming/variable::libc-dlopen-mode-address-name
  needs: 2
