defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.96
traits:
  - id: powershell-system-process-export-lookup
    desc: Resolves the PsInitialSystemProcess export
    if:
      type: text
      regex: '(?i)GetProcAddress\([^;\r\n]{0,100}["'']PsInitialSystemProcess["'']\)'
