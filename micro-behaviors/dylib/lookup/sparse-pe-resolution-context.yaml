defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: sparse-pe-export-resolution-context
    desc: Sparse PE export-resolution API context
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    any:
      - id: micro-behaviors/os/module/load::get-module-handle-ansi
      - id: micro-behaviors/communications/http/client/wininet::internet-open
      - id: micro-behaviors/os/com/invoke::co-initialize
    needs: 1
    unless:
      - id: metadata/binary/symbols/count::many-imports-20
