defaults:
  platforms:
  - windows
  for:
  - pyc
traits:
- id: pyc-dynamic-procedure-resolution
  desc: Bytecode runtime procedure resolution
  crit: notable
  conf: 0.96
  if:
    type: yara
    source: "rule pyc_api_profile {\n  strings:\n    $s0 = \"GetModuleHandleW\"\n    $s1 = \"GetProcAddress\"\n  condition: all of them\n}"
