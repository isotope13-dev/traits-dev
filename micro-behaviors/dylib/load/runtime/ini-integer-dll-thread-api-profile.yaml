defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: ini-integer-dll-thread-api-profile
  desc: INI integer access with DLL loading and thread APIs
  crit: suspicious
  conf: 0.91
  all:
  - id: micro-behaviors/fs/config/system::ini-read-int-write-cycle
  - id: micro-behaviors/dylib/load/runtime::load-library-w
  - id: micro-behaviors/dylib/lookup::get-proc-address
  - id: micro-behaviors/process/thread/create::create-thread
  any:
  - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
  - id: micro-behaviors/fs/file/copy/call::copyfile-w
  - id: metadata/binary/symbols/name/process::create-process-w
  downgrade:
    any:
    - id: metadata/filename/name-form::is-microsoft-named
    - id: metadata/filename/brand::is-windows-named
    - id: metadata/binary/resource/identity::pe-version-resource
    - id: metadata/binary/symbols/count::many-exports
