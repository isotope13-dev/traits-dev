defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: few-import-runtime-library-resolution
    desc: Few-import PE references LoadLibraryA and COM/CLR runtime
    crit: notable
    conf: 0.9
    size_max: 524288
    all:
      - id: metadata/binary/symbols/imports::import-dll-count-under-4
      - id: micro-behaviors/dylib/load/runtime::load-library-a-string-no-import
    any:
      - id: metadata/file/profile/com-api::combase-dll-reference
      - id: micro-behaviors/fs/path/library::mscoree-dll-name
