defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, elf, macho, pe]
  crit: notable
  conf: 0.95

traits:
  - id: bun-ffi-module
    desc: Bun FFI module import
    attack: T1106
    if:
      type: text
      substr: bun:ffi
    unless:
      - id: well-known/lib/development/next-swc::next-swc-native-compiler-pdb

  # Bun bundles can replace the literal `bun:ffi` import with an internal
  # module index. This observes the resolved FFI surface in the embedded code.
  - id: bun-ffi-internal-module-reference
    desc: Bun internal FFI module reference
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '\bvar\s+_ffi\s*=\s*__require\('

  - id: bun-ffi-dlopen-binding
    desc: Bun FFI dynamic library binding
    crit: component
    conf: 0.94
    if:
      type: text
      substr: 'dlopen = _ffi['

  - id: bun-ffi-pointer-binding
    desc: Bun FFI native pointer binding
    crit: component
    conf: 0.94
    if:
      type: text
      substr: 'ptr = _ffi['

  - id: bun-ffi-buffer-binding
    desc: Bun FFI buffer conversion binding
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '\bvar\s+toBuffer\s*=\s*_ffi\['

composite_rules:
  # These APIs are the native implementation surface of Bun's supported FFI
  # runtime.  Stock Bun and applications compiled with Bun legitimately carry
  # the full set; attack intent comes only from the loader/VFS evidence in the
  # objective composites that consume this capability.
  - id: bun-ffi-native-loader-api-set
    desc: Bun FFI native loader API set
    crit: notable
    conf: 0.95
    platforms: [windows]
    for: [pe]
    all:
      - id: micro-behaviors/os/exception/register::rtl-add-function-table
      - id: micro-behaviors/fs/path/construct::search-path-api
      - id: bun-ffi-module
    any:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/create/thread::create-thread
  - id: bun-ffi-dynamic-loader-wrapper
    desc: Bun FFI dynamic loader wrapper
    crit: notable
    conf: 0.96
    all:
      - id: bun-ffi-internal-module-reference
      - id: bun-ffi-dlopen-binding
      - id: bun-ffi-pointer-binding
      - id: bun-ffi-buffer-binding
