defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, elf, macho, pe]
  crit: notable
  conf: 0.95

traits:
  - id: bun-ffi-module
    desc: Bun FFI module import
    attack: T1106
    if:
      type: text
      substr: bun:ffi
    unless:
      - id: well-known/lib/development/next-swc::next-swc-native-compiler-pdb

composite_rules:
  # These APIs are the native implementation surface of Bun's supported FFI
  # runtime.  Stock Bun and applications compiled with Bun legitimately carry
  # the full set; attack intent comes only from the loader/VFS evidence in the
  # objective composites that consume this capability.
  - id: bun-ffi-native-loader-api-set
    desc: Bun FFI native loader API set
    crit: notable
    conf: 0.95
    platforms: [windows]
    for: [pe, javascript]
    all:
      - id: micro-behaviors/os/exception/register::rtl-add-function-table
      - id: micro-behaviors/fs/path/construct::search-path-api
      - id: bun-ffi-module
    any:
      - id: micro-behaviors/mem/protect/modify::virtual-alloc
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/thread/create::create-thread
