defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.8

traits:
  - id: a-prefixed-kernel32-name
    desc: Text names Akernel32.dll
    if:
      type: text
      substr: "Akernel32.dll"
    unless:
      - id: well-known/app/system/cvte-crashrpt/
      - id: well-known/tool/development/editor/jetbrains/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/installer/script/
      - id: well-known/tool/packaging/inno-setup/
      - id: metadata/signed/leaf::adobe-systems-incorporated

