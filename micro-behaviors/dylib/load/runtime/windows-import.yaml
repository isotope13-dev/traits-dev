defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: windows-load-library-import
    desc: Windows LoadLibrary import for module loading
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: import
      regex: '^LoadLibrary(Ex)?[AW]$'
    unless:
      - id: metadata/lang/compiler/systems::go-binary-comp
      - id: metadata/lang/runtime::go-runtime-marker
      - id: well-known/lib/platform/wine::wine-builtin-dll-marker

composite_rules:
  - id: windows-load-library-api
    desc: Windows LoadLibrary dynamic module loading API
    crit: notable
    conf: 0.9
    any:
      - id: windows-load-library-import
      - id: load-library-a-string-no-import
      - id: loadlibraryexa-name-not-imported
    unless:
      - id: metadata/lang/compiler/systems::go-binary-comp
      - id: metadata/lang/runtime::go-runtime-marker
      - id: well-known/lib/platform/wine::wine-builtin-dll-marker
