defaults:
  platforms: [android]
  for: [android_apk, binaries]
  crit: notable
  conf: 0.9
  attack: "T1406"

traits:
  - id: system-load-library-call
    desc: Android System loadLibrary call
    conf: 0.86
    # Bare "loadLibrary" matches C++ helpers (e.g. GSKLibraryManager::loadLibrary)
    # in non-Android ELF; require the Java/Android System API form.
    ref: sha256:093c727149837d576d10f843edce933436efe648e74b9008ccd91badf197fc5c
    if:
      type: text
      regex: 'System\.loadLibrary\s*\('


