defaults:
  platforms: [unix, android, ios]
  for: [shell]

traits:
  # Relocated from objectives/evasion/hijack-execution-flow/preload, where it
  # was `dlopen-call`. The matcher only sees the token `dlopen` in a shell
  # string — a neutral reference to runtime dynamic loading, not preload
  # hijacking. The hijack intent comes from the composite's dlsym leg.
  - id: dlopen-reference
    desc: Shell script references dlopen
    crit: notable
    conf: 0.5
    attack: T1574.006
    if:
      type: string_literal
      substr: dlopen
    unless:
      - id: metadata/build/autotools::autoconf-generated-script
      # libtool's ltmain.sh ships verbatim in essentially every autotools
      # source tarball and always carries -dlopen/-dlpreopen option handling
      # and help text.
      - id: metadata/build/autotools::libtool-script-basename
      - id: well-known/lib/xml2
      - id: well-known/lib/xslt
