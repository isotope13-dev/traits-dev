defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: rwx-peb-reflective-dll-loader
    desc: Reflective DLL loader with PEB and RWX allocation patterns
    crit: notable
    conf: 0.97
    # Same-process image loading establishes neither remote injection nor
    # evasion. Keep this capability visible in signed loaders as well.
    all:
      - id: stdcall-reflective-loader-name
      - id: micro-behaviors/os/api-resolution/manual::peb-access-x86
    any:
      - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-reserve-commit-x86
      - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-reserve-commit-x86-frame-indirect
      - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-reserve-commit-x86-frame-locals
      - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-reflective-call-x86
