defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: rwx-peb-reflective-dll-loader
    desc: Reflective name, PEB and call-pattern evidence
    crit: notable
    conf: 0.97
    # Same-process image loading establishes neither remote injection nor
    # evasion. Keep this capability visible in signed loaders as well.
    all:
      - id: stdcall-reflective-loader-name
      - id: micro-behaviors/process/info/query::peb-access-x86
    any:
      - id: metadata/binary/instruction/call::x86-push-40-3000-zero-indirect
      - id: metadata/binary/instruction/call::x86-push-40-3000-frame-indirect
      - id: metadata/binary/instruction/call::x86-local-40-3000-zero-indirect
      - id: metadata/binary/instruction/call::x86-local-40-push-3000-indirect
