# Require import descriptors, not DLL-name text in paths or captured memory.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.99

traits:
  - id: pe-imports-dsound
    desc: PE imports DirectSound DLL
    if:
      type: yara
      source: |
        import "pe"
        rule pe_imports_dsound {
          strings:
            $name = "dsound.dll" ascii nocase
          condition:
            $name and pe.imports("dsound.dll") > 0
        }
  - id: pe-imports-d3d11
    desc: PE imports Direct3D 11 DLL
    if:
      type: yara
      source: |
        import "pe"
        rule pe_imports_d3d11 {
          strings:
            $name = "d3d11.dll" ascii nocase
          condition:
            $name and pe.imports("d3d11.dll") > 0
        }
  - id: pe-imports-avrt
    desc: PE imports AVRT DLL
    if:
      type: yara
      source: |
        import "pe"
        rule pe_imports_avrt {
          strings:
            $name = "avrt.dll" ascii nocase
          condition:
            $name and pe.imports("avrt.dll") > 0
        }
  - id: pe-imports-mfplat
    desc: PE imports Media Foundation DLL
    if:
      type: yara
      source: |
        import "pe"
        rule pe_imports_mfplat {
          strings:
            $name = "mfplat.dll" ascii nocase
          condition:
            $name and pe.imports("mfplat.dll") > 0
        }
  - id: pe-imports-dxgi
    desc: PE imports DXGI DLL
    if:
      type: yara
      source: |
        import "pe"
        rule pe_imports_dxgi {
          strings:
            $name = "dxgi.dll" ascii nocase
          condition:
            $name and pe.imports("dxgi.dll") > 0
        }
  - id: pe-imports-dwrite
    desc: PE imports DirectWrite DLL
    if:
      type: yara
      source: |
        import "pe"
        rule pe_imports_dwrite {
          strings:
            $name = "dwrite.dll" ascii nocase
          condition:
            $name and pe.imports("dwrite.dll") > 0
        }

# Exact union for consumers selecting any one of these import declarations.
composite_rules:
  - id: windows-media-dll-imports
    desc: PE imports a Windows media or graphics DLL
    any:
      - id: pe-imports-dsound
      - id: pe-imports-d3d11
      - id: pe-imports-avrt
      - id: pe-imports-mfplat
      - id: pe-imports-dxgi
      - id: pe-imports-dwrite
