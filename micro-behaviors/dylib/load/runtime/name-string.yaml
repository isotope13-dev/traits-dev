defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: loadlibraryexa-name-not-imported
    desc: LoadLibraryExA name string, not imported
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: LoadLibraryExA
    unless:
      - id: micro-behaviors/dylib/load/runtime::load-library-ex-a
      # The import signal this trait negates is itself suppressed on Node
      # native addons (see load-library-ex-a), so "not imported" cannot be
      # established there: a .node file can both import LoadLibraryExA and
      # carry its name as data.
      - id: metadata/file/extension/identity::node-native-addon-extension
      - id: well-known/lib/platform/parcel-watcher::parcel-watcher-native-addon
      - id: metadata/lang/compiler/systems::go-binary-comp
      - id: well-known/game/beamng::beamng-drive-identity
      - id: metadata/package/testing/corpus::concatenated-pe-poc-corpus

  - id: reflective-loader-name-string
    desc: ReflectiveLoader name in PE data
    crit: notable
    size_min: 512
    size_max: 500000000
    if:
      type: text
      substr: ReflectiveLoader
      section: any
