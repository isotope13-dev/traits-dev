defaults:
  platforms: [windows]
  for: [pe, dll, data]
  crit: notable
  conf: 0.98
traits:
  # The DOS header is also executable x86 code: recover the current address,
  # call an image-relative loader, then call its returned entry with reason 4.
  # Pin the bytes at zero; no parsed section is available on altered PEs.
  - id: mzre-x86-loader-bootstrap
    desc: MZRE x86 image-relative loader bootstrap
    if:
      type: hex
      offset: 0
      pattern: '4D 5A 52 45 E8 00 00 00 00 5B 89 DF 55 89 E5 81 C3 ?? ?? ?? ?? FF D3 68 ?? ?? ?? ?? 68 04 00 00 00 57 FF D0'
  # Relocated from the family catalog: header and symbol text alone support
  # reflective-loading context, not a Cobalt Strike family attribution.
  - id: mzre-reflective-loader-name
    desc: MZRE header with decorated ReflectiveLoader name
    size_min: 65536
    size_max: 5000000
    if:
      type: yara
      source: |
        rule mzre_reflective_loader_name {
          strings:
            $mzre = { 4D 5A 52 45 }
            $rfl = "_ReflectiveLoader@" ascii
          condition:
            $mzre at 0 and $rfl
        }
