defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1106

traits:
  - id: node-ffi-rs-binding
    desc: Node.js loads the ffi-rs native binding
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)require\s*\(\s*[''"'']ffi-rs[''"'']\s*\)|from\s+[''"'']ffi-rs[''"'']'

  # Any Node.js foreign-function module that can call Win32 exports such as
  # WriteProcessMemory or CreateRemoteThread directly from script.
  - id: node-native-ffi-module-import
    desc: Node.js imports a native FFI module
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(require\s*\(|from\s+)\s*[''"](@[\w-]+/)?(ffi(-napi|-rs)?|koffi|edge-js|win32-api)[''"]'
