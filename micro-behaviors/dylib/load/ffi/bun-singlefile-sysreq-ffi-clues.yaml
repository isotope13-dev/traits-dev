defaults:
  platforms: [windows]
  for: [pe, javascript]
composite_rules:
  - id: bun-singlefile-sysreq-ffi-clues
    for: [pe]
    desc: Bun single-file, sysreq and FFI clues
    crit: suspicious
    conf: 0.98
    all:
      - id: metadata/binary/section/name::bun-section-name
      - id: micro-behaviors/dylib/load/ffi::bun-ffi-module
      - id: micro-behaviors/fs/path/application/interpreter::bun-vfs-loader-entry
      - id: micro-behaviors/fs/path/application/interpreter::sysreq-js-name-reference
    unless:
      - id: metadata/signature/verified/developer/
