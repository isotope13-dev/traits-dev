defaults:
  crit: notable
  for: [python]
  platforms: [linux, macos, windows]
traits:
  - id: ctypes-windll-library-access
    desc: Accesses ctypes Windows DLL loader attribute
    conf: 0.98
    platforms: [windows]
    if:
      type: symbol
      kind: member
      regex: '^ctypes\.windll\.\w+$'
  - id: ctypes-callback-cast
    desc: Casts address to ctypes callback
    conf: 0.9
    if:
      type: text
      regex: '(?s)(ctypes\.)?cast\s*\(.{0,160}?,\s*(ctypes\.)?CFUNCTYPE\s*\('
