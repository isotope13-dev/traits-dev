defaults:
  platforms: [windows]
  for: [pe, javascript]
composite_rules:
  - id: bun-ffi-native-memory-api-clues
    for: [pe]
    desc: Bun VFS, FFI and native memory API clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/application/interpreter::bun-vfs-loader-entry
      - id: micro-behaviors/dylib/load/ffi::bun-ffi-module
      - id: micro-behaviors/os/exception/register::rtl-add-function-table
      - id: micro-behaviors/fs/path/construct::search-path-api
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    any:
      - id: metadata/binary/section/name::bun-section-name
      - id: micro-behaviors/communications/http/url/api-path/telemetry::report-status-update-api-clues
      - id: micro-behaviors/os/sysinfo/report::desktop-recon-report-field-cluster
