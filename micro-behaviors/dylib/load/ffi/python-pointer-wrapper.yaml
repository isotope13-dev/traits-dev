# Constructing an FFI pointer wrapper does not establish process injection.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-cfunctype-pointer-wrapper
    desc: Python native function-pointer wrapper
    conf: 0.9
    if:
      type: tree-sitter
      language: python
      kind: call
      regex: '(?is)\bCFUNCTYPE\s*\([^)]{0,80}\)\s*\(\s*[A-Za-z_]\w{0,30}\s*\)'
    unless:
      # Preserve the original exclusion for ctypes' own C helper wrappers.
      - type: text
        regex: '(?m)^\s*(memmove|memset)\s*=\s*CFUNCTYPE\([^\n]{0,180}\)\s*\(_(memmove|memset)_addr\)'
