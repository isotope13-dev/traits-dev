defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go]
traits:
  - id: go-cgo-import
    desc: Go Cgo native interface
    conf: 0.9
    if:
      type: text
      regex: 'import\s+"C"'
  - id: go-cgo-directive
    desc: Go Cgo compiler directive
    conf: 0.86
    if:
      type: text
      regex: '(?m)^#cgo[ \t]+([^:\n]{1,100}[ \t]+)?(CFLAGS|CPPFLAGS|CXXFLAGS|FFLAGS|LDFLAGS|pkg-config):'
  - id: go-cgo-sysroot-linker-flag
    desc: Go Cgo linker flags select a sysroot
    conf: 0.95
    if:
      type: text
      regex: '#cgo.{0,80}LDFLAGS:.{0,80}--sysroot'
