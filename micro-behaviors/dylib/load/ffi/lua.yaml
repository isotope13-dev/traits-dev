defaults:
  platforms: [windows]
  for: [lua, batch, text]

traits:
  - id: lua-ffi-cdef
    desc: LuaJIT FFI declaration block
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: ffi.cdef

  - id: lua-ffi-process-api
    desc: LuaJIT FFI CreateProcessW declaration
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'ffi\.cdef.{0,512}\bCreateProcessW\b'
      case_insensitive: true
    unless:
      - id: well-known/tool/development/toolchain/darling/

composite_rules:
  - id: lua-ffi-windows-api-declarations
    desc: LuaJIT FFI with Windows API clues
    crit: suspicious
    conf: 0.98
    all:
      - id: lua-ffi-cdef
    any:
      - id: micro-behaviors/hardware/display/state::gdi-screen-dimensions-source
      - id: micro-behaviors/ui/graphics/image::gdi-dib-section-source
      - id: micro-behaviors/ui/graphics/draw::gdi-bitblt-source
      - id: lua-ffi-process-api
    needs: 2
    near_bytes: 512
