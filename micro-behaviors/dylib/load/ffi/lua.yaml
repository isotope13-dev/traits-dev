defaults:
  platforms: [windows]
  for: [lua, batch, text]

traits:
  - id: lua-ffi-cdef
    desc: LuaJIT FFI cdef reference
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: ffi.cdef

  - id: lua-ffi-process-api
    desc: LuaJIT FFI near CreateProcessW
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'ffi\.cdef.{0,512}\bCreateProcessW\b'
      case_insensitive: true

  - id: lua-ffi-cng-provider
    desc: LuaJIT FFI loads Windows CNG crypto library
    crit: notable
    conf: 0.96
    for: [lua]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)load$'
      arg:
        index: 0
        kind: string
        exact: bcrypt

  - id: lua-ffi-ncrypt-provider
    desc: LuaJIT FFI loads Windows NCrypt library
    crit: notable
    conf: 0.96
    for: [lua]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)load$'
      arg:
        index: 0
        kind: string
        exact: ncrypt
composite_rules:
  - id: lua-ffi-windows-api-declarations
    desc: LuaJIT FFI with Windows API clues
    crit: suspicious
    conf: 0.98
    all:
      - id: lua-ffi-cdef
    any:
      - id: micro-behaviors/hardware/display/state::gdi-screen-dimensions-source
      - id: micro-behaviors/ui/graphics/image::gdi-dib-section-source
      - id: micro-behaviors/ui/graphics/draw::gdi-bitblt-source
      - id: lua-ffi-process-api
    needs: 2
    near_bytes: 512
