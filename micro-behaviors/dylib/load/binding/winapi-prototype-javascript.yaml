# Koffi binds native functions from C-style prototype strings, for example
# lib.func('void* VirtualAlloc(void*, size_t, uint32_t, uint32_t)'). The
# prototype stays a plain string even after obfuscator.io moves every name
# into its string array and rewrites constants as arithmetic, so it survives
# where import, call, and constant matchers go blind. Escaped spaces (\x20)
# are how obfuscator.io writes those strings.
#
# Text rather than literal: loaders pad the file with hundreds of MB of
# ciphertext arithmetic, above the size where the literal index is built.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  crit: notable
  attack: T1106

traits:
  - id: virtualalloc-c-prototype
    desc: Declares a VirtualAlloc C prototype string
    conf: 0.95
    if:
      type: text
      regex: 'void(\s|\\x20)*\*(\s|\\x20)*(__stdcall(\s|\\x20)+)?VirtualAlloc\('

  - id: rtlmovememory-c-prototype
    desc: Declares an RtlMoveMemory C prototype string
    conf: 0.95
    if:
      type: text
      regex: 'void(\s|\\x20)+(__stdcall(\s|\\x20)+)?RtlMoveMemory\('

  - id: createthread-c-prototype
    desc: Declares a CreateThread C prototype string
    conf: 0.95
    if:
      type: text
      regex: '(void(\s|\\x20)*\*|HANDLE|uintptr_t)(\s|\\x20)*(__stdcall(\s|\\x20)+)?CreateThread\('
