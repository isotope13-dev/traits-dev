defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-ffi-dll-entry-prototype
    desc: Declares a stdcall DLL-entry prototype
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '\.proto$'
      arg:
        kind: string
        regex: '(int|bool|uint32)\s+__stdcall\s+\w+\(void\s*\*\w+,\s*(uint32|DWORD)\s+\w+,\s*void\s*\*\w+\)'
