defaults:
  crit: notable
  for: [c, cpp]
  platforms: [windows]
  attack: "T1129"
traits:
  - id: load-library-source
    desc: Dynamic library load in source
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bLoadLibrary(Ex)?[AW]?\s*\('
    unless:
      - id: well-known/lib/network/grpc-ruby::grpc-ruby-native-loader-source
  - id: load-library-a-source
    desc: Calls LoadLibraryA in source
    conf: 0.95
    for: [c, cpp, rust, python]
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])LoadLibraryA$'
  # Remote-thread injectors commonly pass LoadLibraryW as a function pointer
  # to CreateRemoteThread instead of calling it.  The source parser therefore
  # records the API as an identifier, not a call target; keep this atom source
  # scoped so the generic library-load capability remains accurate.
  - id: load-library-w-source-reference
    desc: References LoadLibraryW in source
    conf: 0.95
    if:
      type: text
      word: LoadLibraryW
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: micro-behaviors/dylib/load/runtime::load-library-w
