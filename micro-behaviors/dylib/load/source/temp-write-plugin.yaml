# Nearby temp, write, LoadLibrary and export lookup calls do not bind the
# written file to the library path; the supported subject is dynamic loading.
defaults:
  platforms: [windows]
  for: [c, cpp]
  attack: T1129

composite_rules:
  - id: native-temp-write-library-load-profile
    desc: Temp write, library load and export-resolution clues
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/fs/temp/directory::get-temp-path-source-call
      - id: micro-behaviors/fs/write/file/handle::write-file-source
      - id: micro-behaviors/dylib/load/source::load-library-a-source
      - id: micro-behaviors/os/module/load::get-proc-address-source-call
    near_lines: 40
