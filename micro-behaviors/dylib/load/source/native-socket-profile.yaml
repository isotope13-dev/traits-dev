# DLL load/write and socket/key context coexist without an established
# command channel or remote administration surface.
defaults:
  platforms: [windows]
  for: [c, cpp]

composite_rules:
  - id: native-module-load-socket-profile
    desc: Native module-load and socket-record clues
    crit: suspicious
    conf: 0.97
    all:
      - id: native-temp-write-library-load-profile
      - id: micro-behaviors/communications/socket/connect::native-pipe-record-connect-key-profile
