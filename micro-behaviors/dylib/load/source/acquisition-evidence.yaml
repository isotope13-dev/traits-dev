# Preserve loading-only selector membership while unloading uses a legacy leaf.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, pe, dll]
composite_rules:
  - id: native-library-acquisition-evidence
    desc: Native library acquisition evidence
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/dylib/load/binding/
      - id: micro-behaviors/dylib/load/dsprop/
      - id: micro-behaviors/dylib/load/ffi/
      - id: micro-behaviors/dylib/load/runtime/
      - id: go-plugin-package-import
      - id: go-plugin-open-call
      - id: go-plugin-dynamic-load
      - id: load-library-source
      - id: load-library-a-source
      - id: load-library-w-source-reference
      - id: native-module-load-socket-profile
      - id: native-temp-write-library-load-profile
      - id: micro-behaviors/dylib/load/wtsapi/
