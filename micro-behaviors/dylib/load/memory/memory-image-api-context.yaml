traits:
  - id: nslink-module-api
    desc: Mach-O module-linking API reference
    crit: notable
    conf: 0.9
    platforms: [macos]
    for: [macho, c, cpp, objc]
    if:
      type: text
      substr: "NSLinkModule"
  - id: dyld4-jit-loader-maker
    desc: Dyld4 loader-construction API reference
    crit: notable
    conf: 0.92
    platforms: [macos]
    for: [macho, c, cpp, objc]
    if:
      type: text
      substr: JustInTimeLoader4make
  - id: dyld4-fixup-api
    desc: Dyld4 fixup API-name reference
    crit: notable
    conf: 0.92
    platforms: [macos]
    for: [macho, c, cpp, objc]
    if:
      type: text
      substr: applyFixups
  - id: dyld4-initializer-api
    desc: Dyld4 initializer API-name reference
    crit: notable
    conf: 0.92
    platforms: [macos]
    for: [macho, c, cpp, objc]
    if:
      type: text
      substr: runInitializersBottomUpPlusUpwardLinks
  - id: custom-memory-loader-module
    desc: Memload module-name reference
    crit: notable
    conf: 0.65
    platforms: [windows, unix]
    for: [pe, dll, javascript, typescript]
    if:
      type: text
      substr: memload
composite_rules:
  - id: fileless-macos-hostile
    desc: Mach-O image-loading and hidden temp references
    conf: 0.95
    crit: notable
    platforms: [macos]
    for: [macho, c, cpp, objc]
    all:
      - id: micro-behaviors/os/module/resource::nscreate-objectfile-memory
      - id: micro-behaviors/fs/path/hidden::tmp-hidden-file
  - id: mach-o-legacy-memory-module-loader
    desc: Mach-O memory image and module-linking API set
    conf: 0.96
    crit: notable
    platforms: [macos]
    for: [macho, c, cpp, objc]
    all:
      - id: micro-behaviors/os/module/resource::nscreate-objectfile-memory
      - id: micro-behaviors/dylib/load/memory::nslink-module-api
    any:
      - id: micro-behaviors/dylib/lookup::nslookup-symbol-module-api
      - id: micro-behaviors/dylib/lookup::nsaddress-symbol-api
      - id: micro-behaviors/os/module/resource::nsdestroy-objectfile-api
  - id: mach-o-dyld4-memory-module-loader
    desc: Dyld4 loader API-name cluster
    conf: 0.96
    crit: notable
    platforms: [macos]
    for: [macho, c, cpp, objc]
    all:
      - id: micro-behaviors/dylib/load/memory::dyld4-jit-loader-maker
      - id: micro-behaviors/os/module/resource::dyld4-segment-layout-api
      - id: micro-behaviors/dylib/load/memory::dyld4-fixup-api
      - id: micro-behaviors/dylib/load/memory::dyld4-initializer-api
  - id: mach-o-memory-module-loader
    desc: Mach-O memory-module loading API references
    conf: 0.96
    crit: notable
    platforms: [macos]
    for: [macho, c, cpp, objc]
    any:
      - id: micro-behaviors/dylib/load/memory::mach-o-legacy-memory-module-loader
      - id: micro-behaviors/dylib/load/memory::mach-o-dyld4-memory-module-loader
