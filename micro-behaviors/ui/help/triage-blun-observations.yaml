traits:
  - id: recursive-search-wording
    desc: Text mentions recursive search or traversal
    for: [javascript, typescript]
    platforms: [windows, unix]
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: '(?i)recursiv\w*\s+(search|scan|walk|list)\b'
  - id: press-return-wording
    desc: Text tells reader to press Return
    for: [html]
    platforms: [macos]
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\b(press|hit|tap|then)\b[^\n.]{0,40}\bReturn\b'
