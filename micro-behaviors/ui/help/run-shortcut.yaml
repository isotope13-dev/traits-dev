# Canonical observation; attack context belongs in consuming composites.
traits:
- id: html-winr-shortcut-instruction
  desc: Displays Windows Run keyboard shortcut
  crit: notable
  conf: 0.94
  for:
  - html
  - javascript
  if:
    type: text
    regex: (?i)\b(windows?|win)(\s+key)?(</(kbd|b|strong)>)?\s*\+\s*(<(kbd|b|strong)>)?r\b
  platforms:
  - macos
  - windows
