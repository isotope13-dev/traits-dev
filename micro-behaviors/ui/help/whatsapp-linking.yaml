defaults:
  platforms: [unix, windows]
  for: [html]
  crit: notable
  conf: 0.95
traits:
  - id: whatsapp-authorization-heading
    desc: Heading offers authorization through WhatsApp
    if:
      type: text
      regex: '<h2>Autorizzazione[^<]{0,65}WhatsApp</h2>'
      exclude_html_comments: true
  - id: whatsapp-linked-device-instructions
    desc: WhatsApp linked-device code entry instructions
    if:
      type: text
      regex: 'Dispositivi collegati[^<]{0,100}inserisci questo codice'
      exclude_html_comments: true
  - id: authorization-data-protection-claim
    desc: WhatsApp login claims data protection
    if:
      type: text
      substr: 'Autorizzazione tramite WhatsApp ci permette di proteggere i tuoi dati'
      exclude_html_comments: true
