defaults:
  platforms: [windows, unix]
  for: [binaries]

traits:
  - id: help-long-flag
    desc: --help flag
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: --help
      section: rdata
  - id: long-option-enumeration
    desc: Text enumerates comma-separated long options
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    size_min: 512
    size_max: 500000000
    if:
      type: text
      regex: "(--[a-z][a-z0-9-]{1,30}\\s*,\\s*){2,}--[a-z][a-z0-9-]{1,30}"
  - id: usage-lower
    desc: 'usage: label (lowercase)'
    crit: baseline
    conf: 0.5
    if:
      type: text
      substr: 'usage:'
      section: rdata
  - id: usage-title
    desc: 'Usage: label (title case)'
    crit: baseline
    conf: 0.5
    if:
      type: text
      substr: 'Usage:'
      section: rdata
  - id: options-title
    desc: 'Options: label'
    crit: baseline
    conf: 0.5
    if:
      type: text
      substr: 'Options:'
      section: rdata
  - id: usage-upper
    desc: 'USAGE: label (uppercase)'
    crit: baseline
    conf: 0.5
    if:
      type: text
      substr: 'USAGE:'
      section: .text
  - id: usage-title-german
    desc: 'Aufruf: label (German usage)'
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: 'Aufruf:'
      section: rdata
  - id: options-title-german
    desc: 'Optionen: label (German options)'
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: 'Optionen:'
      section: rdata
  - id: use-colon-usage
    desc: 'use: command usage header'
    crit: baseline
    conf: 0.6
    if:
      type: text
      regex: '(^|\n)use: [A-Za-z0-9_.-]+ \['
      section: rdata
  - id: help-single-dash-option
    desc: '-help option description'
    crit: baseline
    conf: 0.6
    if:
      type: text
      regex: '(^|\n)\s*-help\s{2,}(prints?|shows?|displays?)\b'
      section: rdata
  - id: libxslt-configure-js
    desc: libxslt configure.js script
    for: [elf, macho, pe]
    crit: baseline
    conf: 1.0
    if:
      type: raw
      regex: Configure script for libxslt, specific for Windows
      section: .text

composite_rules:
  - id: usage-label
    desc: Command line usage text
    crit: component
    conf: 0.75
    any:
      - id: usage-lower
      - id: usage-title
      - id: usage-upper
      - id: options-title
      - id: usage-title-german
      - id: options-title-german
      - id: use-colon-usage
  - id: has-help
    desc: Contains help or usage information
    crit: notable
    conf: 0.85
    needs: 2
    any:
      - id: help-long-flag
      - id: help-single-dash-option
      - id: usage-lower
      - id: usage-title
      - id: options-title
      - id: usage-upper
      - id: usage-title-german
      - id: options-title-german
      - id: use-colon-usage
  - id: documented-cli-binary
    desc: Documented command line program
    crit: component
    conf: 0.85
    all:
      - id: usage-label
    any:
      - id: metadata/binary/layout/strings::high-string-count-1000
      - id: metadata/binary/code/complexity::high-function-count-200
      - id: metadata/binary/symbols/count::many-imports-50
      - id: metadata/binary/layout/strings::rich-sentence-strings-20pct
  - id: benign-cli-tool
    desc: Documented or licensed userland tool
    crit: component
    conf: 0.85
    any:
      - id: documented-cli-binary
      - id: usage-label
      - id: help-long-flag
      - id: version-text
      - id: has-help
      - id: metadata/package/license::gpl-warranty
      - id: metadata/package/license::gpl-word
      - id: metadata/package/license::spdx-identifier
      - id: metadata/package/license::apache-license-text
      - id: metadata/package/license::mit-license-text
