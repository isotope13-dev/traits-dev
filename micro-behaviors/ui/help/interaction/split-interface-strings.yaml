defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]

traits:
  - id: command-run-instruction
    desc: Command execution help instruction
    crit: notable
    conf: 0.84
    for: [scripts, markdown, html, documents]
    if:
      type: text
      regex: '(^|[.!?:"''] *)(run|execute) +(this command|the following|the command)\b'
      case_insensitive: true
    unless:
      - id: metadata/file/format/news::serialized-news-article-catalog
