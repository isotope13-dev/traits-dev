defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.98

traits:
  - id: ecard-launch-instruction
    desc: Instructs launching an e-card file
    if:
      type: text
      regex: '(?i)double-click to launch[^<\r\n]{0,60}\be-card\b'
      exclude_html_comments: true

