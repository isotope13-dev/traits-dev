# Instructions telling the reader to activate an embedded icon or picture.
# Wording alone proves neither execution nor deception: manuals say it too.
defaults:
  platforms: [windows, unix]
  for: [rtf, oledoc, text]
  crit: notable
  conf: 0.85

traits:
  - id: double-click-embedded-icon-instruction
    desc: Asks reader to double-click an icon
    if:
      type: text
      regex: '(?i)\bdouble[- ]?click\s+(on\s+)?(the|this)\s+(icon|image|attachment|object)\b'
