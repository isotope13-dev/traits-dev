# HTML body text is not a JavaScript string literal. Require explicit pressing
# wording within one markup text run so a source-code `return` cannot complete it.
traits:
  - id: html-paste-press-enter-instruction
    desc: HTML text instructs paste then press Enter
    crit: notable
    conf: 0.94
    platforms: [windows]
    for: [html]
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\bpaste\b[^<\r\n]{0,100}\bpress\s+(Enter|Return)\b'
