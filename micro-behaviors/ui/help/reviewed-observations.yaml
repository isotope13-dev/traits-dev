traits:
- for:
  - applescript
  - macho
  - swift
  - objc
  id: update-latest-version-message
  desc: Message advises updating to the latest version
  conf: 0.84
  if:
    type: text
    substr: update to the latest version
    case_insensitive: true
- for:
  - applescript
  - macho
  conf: 0.9
  id: security-update-text
  desc: References a Security Update
  if:
    type: text
    regex: (?i)Security\s+Update
defaults:
  platforms:
  - macos
  crit: notable
