# Neutral observations and discriminating identities.
traits:
- platforms:
  - unix
  - windows
  for:
  - html
  - scripts
  - markdown
  id: paste-command-instruction
  desc: Instruction to paste a supplied command
  crit: notable
  conf: 0.84
  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: well-known/tool/development/vscode-extension/vscode-marketplace::marketplace-extension-detail-page
  if:
    type: text
    regex: \bpaste\s+(the following|the command)\b|\bpaste\s+this\s+command\b
    case_insensitive: true
