defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.95

traits:
  - id: tcp-probe-port-option-help
    desc: Help text describes TCP probe-port selection
    if:
      type: text
      regex: '(?i)\bTCP ports? to prob(e|ing)\b'
  - id: cidr-target-option-help
    desc: Interface text names IP or CIDR targets
    if:
      type: text
      regex: '(?i)\b(IPs?/CIDRs?|CIDR (targets?|ranges?))\b'
