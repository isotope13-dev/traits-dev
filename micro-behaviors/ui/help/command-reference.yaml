# Command catalogs display escaped payloads and copy their visible text. Require
# the runtime display/copy/storage paths, and reject active network or execution
# calls. String contents are not call facts, so textbook examples do not veto it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: escaped-command-pre-display
    desc: Displays HTML-escaped command or payload text
    if:
      type: text
      regex: '<pre>\$\{escapeHtml\([a-z]+\.(cmd|code)\)\}</pre>'
    unless:
      # Inspect this source AST rather than inherited decoded examples.
      - type: tree-sitter
        kind: call
        regex: '^(new\s+)?((window|globalThis)\.)?(fetch|XMLHttpRequest)\s*\('
      - type: tree-sitter
        kind: call
        regex: '^(new\s+)?((window|globalThis)\.)?(WebSocket|Function)\s*\('
      - type: tree-sitter
        kind: call
        regex: '^((window|globalThis)\.)?(eval|atob)\s*\('
      - type: tree-sitter
        kind: call
        regex: '^(browser|chrome)\.scripting\.executeScript\s*\('
      - type: tree-sitter
        kind: call
        regex: '^(browser|chrome)\.runtime\.(sendNativeMessage|connectNative)\s*\('
composite_rules:
  - id: escaped-local-command-reference
    desc: Local command reference renders escaped text for copying
    crit: exception
    scope: leaf
    all:
      - id: escaped-command-pre-display
      - id: micro-behaviors/os/clipboard/write::browser-clipboard-write-dom-text
      - id: micro-behaviors/data/db/web-storage::chrome-storage-local-get
      - id: micro-behaviors/data/db/web-storage::chrome-storage-local-set
