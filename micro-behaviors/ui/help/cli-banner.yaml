# Help surfaces embedded in interpreted programs. The sibling traits in this
# directory read `Usage:` / `Options:` out of a compiled binary's .rdata, so a
# script that ships the very same banner in a string literal went undetected.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
  conf: 0.85

traits:
  # Requires the three parts of a real synopsis line — the `usage:` label, the
  # invoked program name, and a bracketed option placeholder — so prose that
  # merely says "usage:" does not match. Fires on npm semver's `bin/semver`
  # (`Usage: semver [options] <version> ...`) and on argparse/commander/getopts
  # front-ends generally.
  - id: cli-usage-synopsis
    desc: Script prints a CLI usage synopsis
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)usage:\s{1,4}\S{1,40}\s{1,4}\[options?\]'
