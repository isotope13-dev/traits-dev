traits:
- platforms:
  - macos
  - windows
  id: html-press-win-instruction
  desc: Instruction to press the Windows key
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: Press <strong>Win</strong>
- platforms:
  - macos
  - windows
  id: html-press-ctrl-instruction
  desc: Instruction to press the Control key
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: Then press <strong>Ctrl</strong>
- platforms:
  - macos
  - windows
  id: html-bold-r-text
  desc: Bold R text in markup
  crit: notable
  conf: 0.75
  if:
    type: text
    substr: <strong>R</strong>
- platforms:
  - macos
  - windows
  id: html-bold-v-text
  desc: Bold V text in markup
  crit: notable
  conf: 0.75
  if:
    type: text
    substr: <strong>V</strong>
- platforms:
  - macos
  - windows
  id: html-press-enter-instruction
  desc: Instruction to press the Enter key
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: Press <strong>Enter</strong>
- platforms:
  - windows
  id: open-run-dialog-instruction
  desc: Instruction to open the Run dialog
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\bopen\s+(up\s+)?(the\s+)?(Windows\s+)?Run\s+(dialog|box|window|prompt)\b
composite_rules:
- platforms:
  - macos
  - windows
  id: html-run-paste-execution-sequence
  desc: Run, paste and Enter keyboard instructions
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/ui/help::html-press-win-instruction
  - id: micro-behaviors/ui/help::html-bold-r-text
  - id: micro-behaviors/ui/help::html-press-ctrl-instruction
  - id: micro-behaviors/ui/help::html-bold-v-text
  - id: micro-behaviors/ui/help::html-press-enter-instruction
defaults:
  for:
  - html
