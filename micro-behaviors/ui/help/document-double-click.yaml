defaults:
  platforms: [windows]
  for: [documents]
  crit: notable
  conf: 0.94

traits:
  - id: document-double-click-instruction-text
    desc: Document contains double-click instructions
    for: [documents, -pdf]
    # Preserve the former lure atom's text matcher. PDFs use the raw view
    # below: their analyzer supplies no text strings to this matcher.
    # Wording alone proves neither execution nor deception.
    if:
      type: text
      regex: '(?i)\bdouble-click\s+(on\s+)?(me\b|the\s+[a-z0-9_.-]+\.[a-z]{3,4}\b)'
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component

  - id: pdf-double-click-instruction-bytes
    desc: PDF bytes contain double-click instructions
    for: [pdf]
    # The PDF analyzer supplies structural values but may supply no page-text
    # strings. This observation covers plaintext wording in the PDF bytes;
    # it does not claim visibility or decode compressed content streams.
    if:
      type: raw
      regex: '(?i)\bdouble-click\s+(on\s+)?(me\b|the\s+[a-z0-9_.-]+\.[a-z]{3,4}\b)'
    unless:
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component

composite_rules:
  # One instruction role for the lure composite, independent of the text view.
  - id: document-double-click-instruction
    desc: Document contains double-click instruction wording
    any:
      - id: document-double-click-instruction-text
      - id: pdf-double-click-instruction-bytes
