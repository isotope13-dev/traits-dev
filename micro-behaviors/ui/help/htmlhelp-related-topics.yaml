defaults:
  for: [html]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: htmlhelp-related-topics-param
    desc: HTML Help Related Topics command parameter
    if:
      type: text
      regex: '(?i)<param[^>]{0,80}value\s*=\s*["'']Related Topics, MENU'
  - id: htmlhelp-global-window-param
    desc: HTML Help shared global window parameter
    if:
      type: text
      regex: '(?i)value\s*=\s*["'']\$global_ifl["'']'
