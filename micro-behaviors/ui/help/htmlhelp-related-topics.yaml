defaults:
  for: [html]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: htmlhelp-related-topics-param
    desc: HTML Help Related Topics command parameter
    if:
      type: text
      regex: '(?i)VALUE\s*(=|%3d)\s*(["'']|%22)Related( |%20)Topics(, |%2c%20)MENU'
  - id: htmlhelp-global-window-param
    desc: HTML Help shared global window parameter
    if:
      type: text
      regex: '(?i)VALUE\s*(=|%3d)\s*(["'']|%22)(\$global_ifl|%24global%5fifl)\b'
