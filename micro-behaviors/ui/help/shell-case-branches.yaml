defaults:
  platforms: [unix, android, ios]
  for: [shell]
  crit: notable
  conf: 0.92

traits:
  - id: shell-help-case-echo
    desc: Shell --help case branch prints text
    size_max: 500000
    count_min: 1
    if:
      type: text
      regex: '--help\)\s+echo'

  - id: shell-version-case-echo
    desc: Shell --version case branch prints text
    size_max: 500000
    count_min: 1
    if:
      type: text
      regex: '--version\)\s+echo'

  - id: usage-colon-text
    desc: 'Usage: help text marker'
    size_max: 500000
    count_min: 1
    if:
      type: text
      regex: 'Usage:\s'
