# Help/usage surfaces printed by interpreted CLI programs.
#
# The sibling traits in traits.yaml read `Usage:` / `Options:` out of a
# compiled binary's .rdata, so a Node/Python/shell front-end that ships the
# very same banner in a string literal matched nothing. This covers the script
# side. A usage screen is a program-identity fact: it says the file is a
# documented command-line entry point, which is worth surfacing on its own in
# a package diff (a library release that suddenly grows a CLI entry point
# deserves a look) and as benign context for dual-use rules.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts]
  crit: notable
  conf: 0.9

traits:
  - id: package-install-remediation
    desc: Shows package installation remediation help
    crit: notable
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?is)package.{0,160}not (found|installed).{0,200}npm install'

  # One trait, because both branches evidence the same fact — a printed usage
  # screen — and splitting them produced two notable findings for one banner.
  # The alternation covers the two layouts help text is written in: a synopsis
  # line carrying a bracketed `[options]` placeholder (`Usage: semver [options]
  # <version>`, the argparse/commander/getopts shape), or a `Usage:` line
  # followed by an `Options:` heading. Requiring one of the two keeps this off
  # scripts that merely mention "usage:" in an error string or a comment.
  - id: script-usage-screen
    desc: Script prints a CLI usage screen
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)usage:[\s\S]{0,400}(\[options?\]|\n\s{0,8}options:)'
