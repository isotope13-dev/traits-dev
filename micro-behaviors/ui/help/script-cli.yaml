# Help/usage surfaces printed by interpreted CLI programs.
#
# The traits in traits.yaml read compiled-binary string tables (`section:
# rdata`), so a Node/Python/shell CLI that prints the very same screen matched
# nothing. These cover the script side. A usage banner is a program-identity
# fact: it says the file is a documented command-line entry point, which is
# useful on its own in a package diff (a library release that suddenly grows a
# CLI entry point is worth a look) and as benign context for dual-use rules.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts]
  crit: notable
  conf: 0.9

traits:
  # Both headings, close together: the shape of a generated or hand-written
  # help screen. Requiring the pair keeps this off scripts that merely mention
  # "usage:" in an error string or a comment.
  - id: usage-and-options-screen
    desc: CLI help screen with usage and options
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Usage:[\s\S]{0,400}\n\s{0,8}Options:'
      case_insensitive: true
