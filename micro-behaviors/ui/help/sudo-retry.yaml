defaults:
  platforms: [unix, android]
  for: [elf, macho]
  crit: notable

traits:
  - id: native-sudo-retry-advice
    desc: Diagnostic suggests rerunning with sudo
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(try( again)?|please|consider)[^\n]{0,80}(with|using|rerun)[ \t`]{1,8}sudo\b'
