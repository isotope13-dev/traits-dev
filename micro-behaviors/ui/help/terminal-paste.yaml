defaults:
  platforms: [windows, unix]
  for: [javascript, html]
traits:
  - id: powershell-paste-instruction
    desc: Paste instruction mentioning PowerShell
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: '(?i)\bpaste\b.{0,80}\bpowershell\b'
  - id: macos-paste-terminal-cue
    desc: Instructs paste into Terminal
    crit: notable
    conf: 0.9
    platforms: [macos]
    for: [html, markdown, javascript, typescript]
    if:
      type: text
      regex: '(?is)\bpaste\b.{0,40}\bterminal\b|\bterminal\b.{0,40}\bpaste\b'
  - id: macos-paste-press-return-cue
    desc: Instructs paste then press Return
    crit: notable
    conf: 0.88
    platforms: [macos]
    for: [html, markdown, javascript, typescript]
    # Split from the Terminal cue above: a bare `paste...return` window also
    # matches framework event tables (`case"paste":return null` in React's
    # event switch), so the Return branch requires the "press Return"
    # phrasing of the lure instead.  Confirmed again on this sample: the old
    # 160-character `paste...return` window fired on a markdown converter and
    # on a Next.js dashboard chunk, neither of which contains lure copy.
    if:
      type: text
      regex: '(?is)\bpaste\b.{0,40}\b(press|hit) return\b'
  - id: macos-terminal-launch-reference
    desc: Terminal app launch reference
    crit: notable
    conf: 0.5
    platforms: [macos]
    if:
      type: text
      regex: '\bTerminal\.app\b|\b(open|launch|start)\s+(the\s+)?Terminal\b'
  - id: macos-terminal-open-paste-instruction
    desc: Instructs opening Terminal and pasting text
    crit: notable
    conf: 0.93
    for: [html, markdown, javascript, typescript]
    platforms: [macos]
    if:
      type: text
      regex: '(?is)\b(open|launch)\s+(the\s+)?terminal\b[\s\S]{0,320}\b(copy\s+and\s+paste|paste)\b'
composite_rules:
  - id: macos-terminal-copy-paste-instructions
    desc: macOS Terminal copy-paste instructions
    crit: notable
    conf: 0.9
    platforms: [macos]
    all:
      - id: macos-terminal-launch-reference
    any:
      - id: powershell-paste-instruction
      - id: macos-paste-terminal-cue
      - id: macos-paste-press-return-cue
      - id: micro-behaviors/ui/help::macos-terminal-open-paste-instruction
    near_bytes: 240
