defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  # A program that reads the user's own Application Default Credentials and, when
  # they are missing, tells the user to run the login command is consuming the
  # credential on the user's behalf; a collector has no reason to explain how to
  # create it.
  - id: gcloud-adc-login-guidance
    desc: Guides user to gcloud ADC login
    crit: notable
    conf: 0.9
    for: [python, javascript, typescript, shell, go]
    if:
      type: text
      substr: gcloud auth application-default login
  - id: no-telemetry-privacy-claim
    desc: User interface claims no telemetry collection
    crit: notable
    conf: 0.98
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '(?i)\bno ["'']?anonymous["'']? usage statistics\b|\bno telemetry\b'

  - id: usage-help
    desc: Short -h help flag
    crit: baseline
    conf: 0.7
    if:
      type: text
      regex: -h[^a-z]
      section: .rdata
  - id: version-text
    desc: Version information string
    crit: baseline
    conf: 0.7
    if:
      type: text
      regex: --version|^version [0-9]|^v[0-9]+\.[0-9]
      case_insensitive: true
      section: .rdata

  - id: options-usage-string
    desc: Options usage text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "Usage: %s [OPTIONS]"

  - id: options-accepted-string
    desc: Options accepted help text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: "The following OPTIONS are accepted:"

  - id: shell-profile-setup-instruction
    desc: Shell profile setup instruction
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: "To complete setup, add this to"

  - id: mpcmdrun-signature-removal-help
    desc: MpCmdRun removal-option help text
    crit: notable
    conf: 0.98
    for: [pe]
    if:
      type: text
      regex: '(?i)(Please use|See the) MPCMDRUN(\.exe)? -(RemoveDefinitions|RemoveDynamicSignature)'

  - id: command-run-instruction
    desc: Command execution help instruction
    crit: notable
    conf: 0.84
    for: [scripts, markdown, html, documents]
    if:
      type: text
      regex: '(^|[.!?:"''] *)(run|execute) +(this command|the following|the command)\b'
      case_insensitive: true
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
