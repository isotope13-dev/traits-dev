defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]

composite_rules:
- id: prompt-search-enumeration-phrase
  desc: Prompt contains search or enumeration wording
  crit: component
  conf: 0.9
  near_bytes: 80
  needs: 2
  any:
  - id: micro-behaviors/ui/help/message::file-enumeration-wording
  - id: micro-behaviors/ui/help/message::file-secret-search-wording
- id: llm-inventory-action-cluster
  desc: Filesystem inventory action cluster
  crit: component
  conf: 0.9
  needs: 2
  any:
  - id: micro-behaviors/ui/help/message::file-enumeration-wording
  - id: micro-behaviors/ui/help/message::file-secret-search-wording
  - id: micro-behaviors/ui/help/interaction::recursive-search-wording
  - id: "micro-behaviors/fs/search/command::locate-token"
  - id: micro-behaviors/fs/path/temp::prompt-tmp-inventory-path
  - id: metadata/lang/natural/phrasing/agent::prompt-environment-definition-phrase
- id: llm-inventory-instruction-anchor
  desc: File-inventory context clues
  crit: component
  conf: 0.92
  any:
  - id: metadata/lang/natural/phrasing/agent::prompt-environment-definition-phrase
  - id: micro-behaviors/fs/path/temp::prompt-tmp-inventory-path
  - id: metadata/lang/natural/vocabulary/configuration::configuration-word
  - id: micro-behaviors/fs/path/credential::keystore-path-literal
  - id: metadata/lang/natural/credential::secret-acquisition-wording
