traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: file-enumeration-wording
  desc: Quoted file or secret enumeration request
  crit: notable
  conf: 0.7
  if:
    type: string_literal
    regex: (?i)\benumerate\s+(\w+\s+){0,3}(files?|secrets?|tokens?)\b
    case_insensitive: true
