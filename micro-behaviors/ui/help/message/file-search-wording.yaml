# Neutral evidence retained from the objective placement review.
defaults:
  platforms:
  - windows
  - unix
  crit: component
  conf: 0.2
  for:
  - binaries
  - scripts
  - source
traits:
- id: file-secret-search-wording
  desc: File or secret search wording
  crit: notable
  conf: 0.4
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    regex: \bsearch\s+(for\s+(files?|secrets?|tokens?)|files?|secrets?)\b
    case_insensitive: true
