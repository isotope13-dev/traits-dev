defaults:
  platforms: [windows, unix]
  for: [binaries]

traits:
  - id: user-feedback-submission-marker
    desc: User feedback submission UI marker
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'SUBMIT_FEEDBACK|\bsubmitFeedback\b|Send Feedback|\bfeedbackSent\b'
  - id: help-support-section-label
    desc: Help and support section label
    crit: notable
    conf: 0.85
    for: [html, javascript, typescript, markdown, text]
    if:
      type: text
      substr: 'Help & Support'
      case_insensitive: true
    not:
      - regex: '(?i)with\s+help\s*&\s*support'
  - id: python-windows-unavailable-message
    desc: Python reports Windows unavailability
    crit: notable
    conf: 0.8
    for: [python]
    if:
      type: literal
      kind: string
      substr: 'not available on Windows'
