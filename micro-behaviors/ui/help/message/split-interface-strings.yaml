defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]

traits:
  - id: no-telemetry-privacy-claim
    desc: User interface claims no telemetry collection
    crit: notable
    conf: 0.98
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '(?i)\bno ["'']?anonymous["'']? usage statistics\b|\bno telemetry\b'
