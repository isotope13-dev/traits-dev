defaults:
  platforms: [unix]
  for: [shell, markdown, text]
  crit: notable
  conf: 0.97

traits:
  # Commented install instructions live in ui/help/curl-install-usage.yaml.
  # The same publication, printed instead of commented. An installer that
  # documents itself through `--help` rather than a header comment is making
  # the identical statement -- this command is meant to be run by a user --
  # and the comment-anchored sibling above could not see it. systemg's
  # scripts/index.sh, served from https://sh.sysg.dev/, echoes four such lines
  # and scored hostile as an OS-gated pipe loader.
  - id: help-text-curl-pipe-usage
    desc: Echo prints a quoted curl-to-shell example
    if:
      type: text
      regex: '(?m)^\s*echo\s+["''][^"''$`\n]{0,80}\bcurl\b[^"''$`\n]{0,99}\|\s*(ba)?sh\b[^"''$`\n]{0,40}["'']'

