defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]

traits:
  # A command selector is terminal dispatch, not an input prompt. Arbitrary
  # comparisons with 'get' also occur in HTTP methods and financial options.
  - id: explicit-install-subcommand-dispatch
    desc: Command selector checks install/download/get
    conf: 0.8
    if:
      type: text
      regex: '\b(cmd|(sub)?command|(parts|argv)\[\d+\])\s*(==|in\s*\()\s*["''](install|download|get)["'']'
  - id: python-console-capture-flag
    desc: console_capture output flag
    if:
      type: text
      word: console_capture
  - id: python-capture-console-flag
    desc: capture_console output flag
    if:
      type: text
      word: capture_console
composite_rules:
  - id: python-console-output-capture
    desc: Configures interpreter console output capture
    conf: 0.9
    any:
      - id: python-console-capture-flag
      - id: python-capture-console-flag
