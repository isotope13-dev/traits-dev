defaults:
  crit: notable
  platforms: [unix, windows]
  for: [python]

traits:
  # Require the CLI argument surface. A remote task's command selector is not
  # terminal dispatch, even when the command happens to be "download".
  - id: explicit-install-subcommand-dispatch
    desc: CLI argv checks install/download/get
    conf: 0.8
    if:
      type: text
      regex: '\b(sys\.)?argv\[\d+\]\s*(==|in\s*\()\s*["''](install|download|get)["'']'
  - id: python-console-capture-flag
    desc: console_capture output flag
    if:
      type: text
      word: console_capture
  - id: python-capture-console-flag
    desc: capture_console output flag
    if:
      type: text
      word: capture_console
composite_rules:
  - id: python-console-output-capture
    desc: Configures interpreter console output capture
    conf: 0.9
    any:
      - id: python-console-capture-flag
      - id: python-capture-console-flag
