defaults:
  platforms:
  - windows
  - unix
  for:
  - python
traits:
- id: python-recovered-string-sink
  desc: Prints a decoded or plaintext-named variable
  crit: notable
  conf: 0.75
  if:
    type: tree-sitter
    regex: (?i)^print\s*\(\s*(decoded|recovered|plaintext|decrypted)\w{0,32}
    kind: call
- id: python-recovered-cleartext-sink
  desc: Prints a cleartext-named variable
  crit: notable
  conf: 0.75
  if:
    type: tree-sitter
    regex: (?i)^print\s*\(\s*cleartext\w{0,32}
    kind: call
