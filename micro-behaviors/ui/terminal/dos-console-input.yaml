# DOS programs read the keyboard through BIOS INT 16h or the INT 21h
# console-input services (AH=01h, 07h, 08h, 0Ah, 0Ch). Destructive disk
# composites use this as a veto: a program that waits for a key or a typed
# line is giving the operator a chance to confirm.
defaults:
  platforms: [windows]
  for: [dos_com, data, static-lib]
  size_max: 65536

traits:
  - id: dos-console-key-input
    desc: DOS program reads keyboard input
    crit: notable
    conf: 0.85
    if:
      type: yara
      source: |
        rule dos_console_key_input {
          strings:
            $bios_key = { B4 ( 00 | 01 | 10 | 11 ) [0-8] CD 16 }
            $dos_in   = { ( B4 | B8 ?? ) ( 01 | 07 | 08 | 0A | 0C ) [0-12] CD 21 }
          condition:
            any of them
        }
    unless:
      - id: well-known/tool/reverse-engineering/pedump::pedump-packer-marker
