# Colorama's WinTerm receiver distinguishes terminal operations from generic
# methods named set_title or erase_line. Match calls, not definitions or prose.
defaults:
  platforms: [windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: colorama-erase-screen
    desc: Erases Windows terminal screen cells
    if:
      type: symbol
      kind: call
      exact: winterm.erase_screen

  - id: colorama-erase-line
    desc: Erases Windows terminal line cells
    if:
      type: symbol
      kind: call
      exact: winterm.erase_line

  - id: colorama-move-cursor
    desc: Moves the Windows terminal cursor
    if:
      type: symbol
      kind: call
      regex: '^winterm\.(set_cursor_position|cursor_adjust)$'

  - id: colorama-set-title
    desc: Sets the Windows terminal title
    if:
      type: symbol
      kind: call
      exact: winterm.set_title
