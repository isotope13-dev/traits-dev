defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.96

traits:
  - id: game-ban-adapter-guid-message
    desc: Game-ban adapter GUID cleanup message
    if:
      type: text
      section: rdata
      regex: '(?i)\badapters? GUID.{0,48}\b(Fortnite|game) bans?\b'
  - id: game-tracking-file-cleanup-message
    desc: Game tracking-file cleanup message
    if:
      type: text
      section: rdata
      regex: '(?i)\b(Fortnite|game) (tracking|trace) files\b'

