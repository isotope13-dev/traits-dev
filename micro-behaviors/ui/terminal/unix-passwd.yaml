defaults:
  for: [elf]
  platforms: [linux]
  crit: notable
traits:
  - id: unix-current-password-prompt
    desc: Unix current password prompt
    if:
      type: text
      substr: '(current) UNIX password:'
  - id: unix-passwd-success-message
    desc: Unix passwd success message
    if:
      type: text
      substr: 'passwd: all authentication tokens have been successfully updated.'
