defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: shell-authentication-success-output
    desc: Shell prints authentication/verification success
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: echo
      arg:
        kind: string
        regex: '(?i)^(authenticated|authentication successful|verification successful)$'
