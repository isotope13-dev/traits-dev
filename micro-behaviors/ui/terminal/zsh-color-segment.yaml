defaults:
  platforms: [unix]
  for: [javascript, typescript]
traits:
  # The raw member value must be the const's value and a template substitution.
  # A sanitized call result does not satisfy the member-expression branch.
  - id: raw-object-text-zsh-color-segment
    desc: Formats object text into zsh prompt segment
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (
          (function_declaration
            body: (statement_block
              (lexical_declaration
                kind: "const"
                (variable_declarator
                  name: (identifier) @text
                  value: (ternary_expression consequence: (member_expression))))
              (return_statement
                (template_string (template_substitution (identifier) @used)) @format)))
          (#eq? @text @used)
          (#match? @format "^`%F\\{")
          (#match? @format "%f`$")
        )
