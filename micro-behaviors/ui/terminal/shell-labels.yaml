defaults:
  crit: notable
  conf: 0.85
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
traits:
  - id: micro-behaviors/ui/terminal::interactive-shell-label
    desc: Shell interface label in binary text
    if:
      type: text
      word: interactive_shell
    unless:
      - id: well-known/tool/detection/imhex-patterns::imhex-pattern-library-member-path
      - id: metadata/file/string/identity::system-shell-basename
      - id: metadata/file/string/identity::shell-loadable-builtin-path
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/package/testing/presence/harness::binary-test-directory
      - id: well-known/tool/development/agent/reason-machines::reason-machines-agent-context
  - id: micro-behaviors/ui/terminal::exec-shell-label
    desc: Shell interface label in binary text
    if:
      type: text
      word: Exec_shell
  - id: micro-behaviors/ui/terminal::execshell-label
    desc: Shell interface label in binary text
    if:
      type: text
      word: execShell
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
composite_rules:
  - id: micro-behaviors/ui/terminal::shell-mode-labels
    desc: Shell interface label in binary text
    any:
      - id: micro-behaviors/ui/terminal::interactive-shell-label
      - id: micro-behaviors/ui/terminal::exec-shell-label
      - id: micro-behaviors/ui/terminal::execshell-label
