# User-facing output embedded in a PE-format demonstration. The message is
# neutral on its own; it identifies code that explains its manual import
# resolution rather than concealing that behavior.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: pe-manual-import-demo-message
    desc: PE manual-import demonstration output
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: "a PE32+ with no data directory, resolving imports manually"
