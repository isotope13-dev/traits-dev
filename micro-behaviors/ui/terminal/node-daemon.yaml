defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-daemon-pid-announcement
    desc: Daemon PID or stop-command announcement text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(daemon started with PID|\bTo stop:\s*kill\b|\bstarted on port\b.{1,20}PID\b)'

  - id: node-daemon-server-banner
    desc: Daemon background-start banner text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)daemon.{1,30}starting in (a )?background'

