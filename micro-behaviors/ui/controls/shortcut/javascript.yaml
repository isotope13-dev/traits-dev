# JavaScript keyboard-shortcut presentation helpers. These are UI markers,
# not OS-conditional execution evidence.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: js-get-kbd-keys-map-symbol
    desc: JavaScript keyboard shortcut key-map helper
    if:
      type: symbol
      exact: getKbdKeysMap

  - id: js-get-kbd-keys-label-map-symbol
    desc: JavaScript keyboard shortcut label-map helper
    if:
      type: symbol
      exact: getKbdKeysLabelMap

  - id: js-get-kbd-screen-reader-text-symbol
    desc: JS keyboard shortcut accessibility helper
    if:
      type: symbol
      exact: getKbdScreenReaderFriendlyText

  - id: js-kbd-key-symbol
    desc: JavaScript keyboard shortcut key type
    if:
      type: symbol
      exact: KbdKey

  - id: js-shortcut-template-label
    desc: JavaScript keyboard shortcut display label
    conf: 0.85
    if:
      type: text
      substr: 'Shortcut: ${'

composite_rules:
  - id: js-keyboard-shortcut-ui-marker
    desc: JavaScript keyboard shortcut UI marker
    crit: notable
    conf: 0.9
    any:
      - id: js-get-kbd-keys-map-symbol
      - id: js-get-kbd-keys-label-map-symbol
      - id: js-get-kbd-screen-reader-text-symbol
      - id: js-kbd-key-symbol
      - id: js-shortcut-template-label
