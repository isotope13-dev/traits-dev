# A manifest keybinding that claims the bare Tab key whenever the editor has
# focus. Tab is the editor's indent and completion-accept key; completion
# providers bind it only under a suggestion-visible context. Binding it on
# plain text focus routes every Tab press through the extension's command.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: vscode-bare-tab-editor-focus-binding
    desc: Manifest binds bare Tab on editor focus
    crit: notable
    conf: 0.9
    if:
      type: value
      path: contributes.keybindings[*]
      regex: '(?i)"key"\s*:\s*"tab".*"when"\s*:\s*"editorTextFocus"'
