# Android launcher shortcuts may route a nominal uninstall action back into the
# app. This is a capability marker; monetization intent is established by the
# objective rule that also requires uninstall-specific interstitial-ad logic.
defaults:
  crit: notable
  platforms: [android]
  for: [android_apk, zip, xml, dex]

traits:
  - id: custom-uninstall-shortcut-routing-flag
    desc: Flag routes uninstall shortcut into app
    conf: 0.98
    for: [xml, dex]
    if:
      type: text
      exact: from_uninstall_shortcut

  - id: android-shortcut-id-intent-extra
    desc: Android shortcut identifier intent extra
    conf: 0.95
    for: [xml, dex]
    if:
      type: text
      exact: android.intent.extra.shortcut.ID

composite_rules:
  - id: app-routed-uninstall-shortcut
    desc: Routes a nominal uninstall shortcut back into the app
    conf: 0.98
    all:
      - id: custom-uninstall-shortcut-routing-flag
      - id: android-shortcut-id-intent-extra
