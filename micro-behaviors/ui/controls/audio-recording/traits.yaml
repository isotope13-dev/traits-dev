# User-facing audio-recording controls. A visible toggle that starts and
# stops microphone recording (tooltip "Click to start/stop recording", a
# Record button, a start/stop workflow pair) puts the capture under the
# user's hand — disclosed, user-initiated recording, the shape of a voice
# assistant's input panel rather than covert collection.
defaults:
  platforms: [windows, unix]
  for: [java, kotlin, javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: audio-recording-toggle-control
    desc: User-facing start/stop recording toggle
    if:
      type: text
      regex: '(?i)(click to start/stop record\w*|start[/\\]?stop[- ]recording|toggle[- ]recording)'
