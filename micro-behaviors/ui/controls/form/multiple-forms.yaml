# A page that declares more than one HTML form. Pre-addressed loaders that
# draw their login form from a remote script carry none or one; ordinary
# multi-form pages (search plus login plus newsletter) carry several.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: component
  conf: 0.9

traits:
  - id: html-multiple-form-elements
    desc: Page declares two or more HTML forms
    count_min: 2
    if:
      type: text
      regex: '(?i)<form\b'
