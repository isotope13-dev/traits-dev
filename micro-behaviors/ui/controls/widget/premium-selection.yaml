defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  # Only a plain premium predicate with an immediate modal and return qualifies.
  # An entitlement test in this condition, or a modal that permits continuing,
  # is a near miss. This does not by itself establish fraud: another component
  # could update the premium flag after a legitimate subscription purchase.
  - id: premium-selection-modal-return
    desc: Premium selection opens modal and returns
    if:
      type: tree-sitter
      query: |
        ((if_statement
          condition: (parenthesized_expression
            (member_expression property: (property_identifier) @premium))
          consequence: (statement_block
            . (expression_statement
              (call_expression function: (identifier) @modal))
            (return_statement) .)) @guard
          (#eq? @premium "premium")
          (#match? @modal "^(open|show)PremiumModal$"))
