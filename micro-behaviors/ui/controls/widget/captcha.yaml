# CAPTCHA widget configuration. Invisible widgets are ordinary anti-abuse
# tooling on sign-up and login pages (Element Call, every reCAPTCHA v2
# invisible integration). The Ledger-Google-Ads kit initializes an invisible
# hCaptcha at submit time (hcaptcha.render with size invisible, then
# hcaptcha.execute) so automated sandboxes stall while real victims pass;
# the phishing composites in objectives/credential-access/phishing/ supply
# that intent.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable

traits:
  - id: hcaptcha-render-call
    desc: Calls hCaptcha render API
    conf: 0.92
    if:
      type: text
      regex: '\bhcaptcha\s*\.\s*render\s*\('

  - id: invisible-captcha-size
    desc: Invisible captcha size option
    conf: 0.9
    if:
      type: text
      regex: '\bsize\b\s*:\s*["'']invisible["'']|\bdata-size\s*=\s*["'']invisible["'']'

composite_rules:
  - id: invisible-hcaptcha-render
    desc: hCaptcha rendered in invisible mode
    conf: 0.9
    all:
      - id: hcaptcha-render-call
      - id: invisible-captcha-size
    near_lines: 12
