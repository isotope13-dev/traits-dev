---
defaults:
  for:
  - html
  - javascript
  platforms:
  - windows
  - unix
traits:
- id: constructed-like-iframe-coordinate-position
  desc: Constructed Like iframe uses event coordinates
  crit: notable
  conf: 0.96
  if:
    type: yara
    source: |-
      rule constructed_iframe_coordinate_style {
       strings:
        $x = /\b[A-Za-z_]\w{0,63}\s*=\s*[A-Za-z_]\w{0,63}\.(pageX|clientX)\b/
        $y = /\b[A-Za-z_]\w{0,63}\s*=\s*[A-Za-z_]\w{0,63}\.(pageY|clientY)\b/
        $rx = /\b[A-Za-z_]\w{0,63}\s*[-+;]/
        $ry = /\b[A-Za-z_]\w{0,63}\s*[-+;]/
        $left = /\b[A-Za-z_]\w{0,63}\.style\.left\s*=\s*\(?\s*[A-Za-z_]\w{0,63}\s*[-+;]/
        $top = /\b[A-Za-z_]\w{0,63}\.style\.top\s*=\s*\(?\s*[A-Za-z_]\w{0,63}\s*[-+;]/
        $element = /\b[A-Za-z_]\w{0,63}\s*=\s*document\.createElement\(\s*['"]iframe['"]\s*\)/
        $source = /\b[A-Za-z_]\w{0,63}\.src\s*=\s*['"]https?:\/\/(www\.)?facebook\.com\/(v[0-9.]+\/)?(widgets|plugins)\/like\.php\?/
       condition:
        all of them and
        for any e in (1..#element) : (for any l in (1..#left) : (for any t in (1..#top) : (
         (@left[l] > @element[e] or @element[e]-@left[l] < 4000) and @left[l] < @element[e] + 4000 and
         (@top[t] > @left[l] or @left[l]-@top[t] < 400) and @top[t] < @left[l] + 400 and
         for any n in (1..64) : (
          (uint8(@element[e]+n) == 61 or uint8(@element[e]+n) == 32 or uint8(@element[e]+n) == 9 or uint8(@element[e]+n) == 10) and
          (uint8(@left[l]+n) == 46) and
          for all j in (0..n-1) : (uint8(@element[e]+j) == uint8(@left[l]+j))
        ) and for any n in (1..64) : (
          (uint8(@element[e]+n) == 61 or uint8(@element[e]+n) == 32 or uint8(@element[e]+n) == 9 or uint8(@element[e]+n) == 10) and
          (uint8(@top[t]+n) == 46) and
          for all j in (0..n-1) : (uint8(@element[e]+j) == uint8(@top[t]+j))
        ) and
         for any x in (1..#x) : (for any r in (1..#rx) : (
          @x[x] < @rx[r] and @rx[r]-@x[x] < 800 and
          @rx[r] > @left[l] and @rx[r] < @left[l]+!left[l] and for any n in (1..64) : (
          (uint8(@x[x]+n) == 61 or uint8(@x[x]+n) == 32 or uint8(@x[x]+n) == 9) and
          (uint8(@rx[r]+n) == 32 or uint8(@rx[r]+n) == 43 or uint8(@rx[r]+n) == 45 or uint8(@rx[r]+n) == 59) and
          for all j in (0..n-1) : (uint8(@x[x]+j) == uint8(@rx[r]+j))
        )
         )) and
         for any y in (1..#y) : (for any s in (1..#ry) : (
          @y[y] < @ry[s] and @ry[s]-@y[y] < 800 and
          @ry[s] > @top[t] and @ry[s] < @top[t]+!top[t] and for any n in (1..64) : (
          (uint8(@y[y]+n) == 61 or uint8(@y[y]+n) == 32 or uint8(@y[y]+n) == 9) and
          (uint8(@ry[s]+n) == 32 or uint8(@ry[s]+n) == 43 or uint8(@ry[s]+n) == 45 or uint8(@ry[s]+n) == 59) and
          for all j in (0..n-1) : (uint8(@y[y]+j) == uint8(@ry[s]+j))
        )
         )) and for any z in (1..#source) : (
        @source[z] > @element[e] and @source[z]-@element[e] < 1500 and
        for any n in (1..64) : (
          (uint8(@element[e]+n) == 61 or uint8(@element[e]+n) == 32 or uint8(@element[e]+n) == 9) and
          uint8(@source[z]+n) == 46 and
          for all j in (0..n-1) : (uint8(@element[e]+j) == uint8(@source[z]+j))
        )
      )
        )))
      }
- id: markup-like-iframe-coordinate-position
  desc: Markup Like iframe uses event coordinates
  crit: notable
  conf: 0.96
  if:
    type: yara
    source: |-
      rule markup_iframe_coordinate_style {
       strings:
        $x = /\b[A-Za-z_]\w{0,63}\s*=\s*[A-Za-z_]\w{0,63}\.(pageX|clientX)\b/
        $y = /\b[A-Za-z_]\w{0,63}\s*=\s*[A-Za-z_]\w{0,63}\.(pageY|clientY)\b/
        $rx = /\b[A-Za-z_]\w{0,63}\s*[-+;]/
        $ry = /\b[A-Za-z_]\w{0,63}\s*[-+;]/
        $left = /\b[A-Za-z_]\w{0,63}\.left\s*=\s*\(?\s*[A-Za-z_]\w{0,63}\s*[-+;]/
        $top = /\b[A-Za-z_]\w{0,63}\.top\s*=\s*\(?\s*[A-Za-z_]\w{0,63}\s*[-+;]/
        $element = /\b[A-Za-z_]\w{0,63}\s*=\s*document\.getElementById\(\s*['"][A-Za-z_]\w{0,63}['"]\s*\)\.style/
        $lookup = /['"][A-Za-z_]\w{0,63}['"]\s*\)\.style/
        $markup = /<iframe\b[^>]{0,700}facebook\.com\/(v[0-9.]+\/)?(widgets|plugins)\/like\.php\?[^>]{0,700}/
        $id = /id=['"][A-Za-z_]\w{0,63}['"]/
       condition:
        all of them and
        for any e in (1..#element) : (for any l in (1..#left) : (for any t in (1..#top) : (
         (@left[l] > @element[e] or @element[e]-@left[l] < 4000) and @left[l] < @element[e] + 4000 and
         (@top[t] > @left[l] or @left[l]-@top[t] < 400) and @top[t] < @left[l] + 400 and
         for any n in (1..64) : (
          (uint8(@element[e]+n) == 61 or uint8(@element[e]+n) == 32 or uint8(@element[e]+n) == 9 or uint8(@element[e]+n) == 10) and
          (uint8(@left[l]+n) == 46) and
          for all j in (0..n-1) : (uint8(@element[e]+j) == uint8(@left[l]+j))
        ) and for any n in (1..64) : (
          (uint8(@element[e]+n) == 61 or uint8(@element[e]+n) == 32 or uint8(@element[e]+n) == 9 or uint8(@element[e]+n) == 10) and
          (uint8(@top[t]+n) == 46) and
          for all j in (0..n-1) : (uint8(@element[e]+j) == uint8(@top[t]+j))
        ) and
         for any x in (1..#x) : (for any r in (1..#rx) : (
          @x[x] < @rx[r] and @rx[r]-@x[x] < 800 and
          @rx[r] > @left[l] and @rx[r] < @left[l]+!left[l] and for any n in (1..64) : (
          (uint8(@x[x]+n) == 61 or uint8(@x[x]+n) == 32 or uint8(@x[x]+n) == 9) and
          (uint8(@rx[r]+n) == 32 or uint8(@rx[r]+n) == 43 or uint8(@rx[r]+n) == 45 or uint8(@rx[r]+n) == 59) and
          for all j in (0..n-1) : (uint8(@x[x]+j) == uint8(@rx[r]+j))
        )
         )) and
         for any y in (1..#y) : (for any s in (1..#ry) : (
          @y[y] < @ry[s] and @ry[s]-@y[y] < 800 and
          @ry[s] > @top[t] and @ry[s] < @top[t]+!top[t] and for any n in (1..64) : (
          (uint8(@y[y]+n) == 61 or uint8(@y[y]+n) == 32 or uint8(@y[y]+n) == 9) and
          (uint8(@ry[s]+n) == 32 or uint8(@ry[s]+n) == 43 or uint8(@ry[s]+n) == 45 or uint8(@ry[s]+n) == 59) and
          for all j in (0..n-1) : (uint8(@y[y]+j) == uint8(@ry[s]+j))
        )
         )) and for any u in (1..#lookup) : (
         @lookup[u] > @element[e] and @lookup[u] < @element[e]+!element[e] and
         for any m in (1..#markup) : (for any i in (1..#id) : (
           @id[i] > @markup[m] and @id[i] < @markup[m]+!markup[m] and
           for all j in (0..!id[i]-6) : (uint8(@id[i]+4+j) == uint8(@lookup[u]+1+j)) and
           (uint8(@lookup[u]+!id[i]-4) == 34 or uint8(@lookup[u]+!id[i]-4) == 39)
         ))
        )
        )))
      }
