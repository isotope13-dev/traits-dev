defaults:
  platforms: [windows]
  for: [html]
  crit: notable
  conf: 0.95

traits:
  - id: html-object-click-call
    desc: HTML invokes object Click method
    if:
      type: text
      regex: '(\.|%2[Ee])Click(\s*\(\s*\)|%28%29)'

  - id: html-obfuscated-click-call
    desc: HTML stores Click in a string table
    conf: 0.94
    if:
      type: text
      regex: '=\[[^\]]{0,500}["'']Click["'']'

  - id: html-onerror-click-call
    desc: HTML error handler invokes Click
    if:
      type: text
      regex: 'onerror\s*=\s*["''][^"'']{0,80}\.Click\s*\('

  - id: html-getelement-click-call
    desc: HTML element lookup invokes Click
    if:
      type: text
      regex: 'getElementById\s*\([^)]{1,80}\)\.Click\s*\('

  # Generated object markup can split an unquoted value across JS strings.
  - id: htmlhelp-split-shortcut-command-param
    desc: Split unquoted HTML Help Shortcut parameter
    if:
      type: text
      regex: '(?i)name=Command\s+value["'']\s*\+\s*["'']=ShortCut>'
