# Tkinter GUI Framework Capabilities
defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: tkinter-button
    desc: Tkinter Button widget
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '^(tkinter\.|tk\.|)Button$'
  - id: tkinter-label
    desc: Tkinter Label widget
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '^(tkinter\.|tk\.|)Label$'
  - id: tkinter-entry
    desc: Tkinter Entry widget
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '^(tkinter\.|tk\.|)Entry$'
  - id: tkinter-text
    desc: Tkinter Text widget
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      kind: call
      regex: '^(tkinter\.|tk\.|)Text$'
  - id: tkinter-scrolledtext
    desc: Tkinter ScrolledText widget
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      kind: call
      substr: 'scrolledtext.ScrolledText'
composite_rules:
  - id: tkinter-widget
    desc: Uses Tkinter widgets
    crit: baseline
    conf: 0.8
    any:
      - id: tkinter-button
      - id: tkinter-label
      - id: tkinter-entry
      - id: tkinter-text
      - id: tkinter-scrolledtext
