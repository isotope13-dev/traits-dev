defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.97

traits:
  - id: repeated-first-anchor-clicks
    desc: At least ten first-anchor script clicks
    count_min: 10
    if:
      type: text
      regex: 'document\.querySelector\(["'']a["'']\)\.click\(\)'
      exclude_html_comments: true
