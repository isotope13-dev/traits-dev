defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]

traits:
  - id: facebook-like-control-markup
    desc: Facebook Like markup or XFBML parsing
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)<fb:like\b|FB\.XFBML\.parse\s*\('

  - id: facebook-like-success-callback
    desc: Handles successful Facebook Like actions
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)FB\.Event\.subscribe\s*\(\s*["'']edge\.create["'']'

  - id: facebook-like-iframe-source
    desc: Facebook Like iframe endpoint reference
    crit: notable
    conf: 0.98
    if:
      type: text
      # Graph versions sit in front of the plugin path
      # (`/v2.5/plugins/like.php`); that is still Facebook's widget.
      regex: 'facebook\.com/(v\d+(\.\d+)?/)?(widgets|plugins)/like\.php\?'
  # A Like-action iframe whose endpoint is NOT Facebook: the control wears
  # Like plugin parameters (action=like, show_faces, layout) but reports to
  # a third-party host. Genuine widgets match the rule above and are
  # excluded here, so this leg names the impersonation, not the control.
  - id: offbrand-like-action-iframe
    desc: Like-action iframe from non-Facebook host
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)<iframe\b[^>]{0,400}[?&]action\s*=\s*like\b'
    unless:
      - id: facebook-like-iframe-source

  # Global fan-page setting read by drop-in Like widgets loaded from another
  # host ("var fan_page_url = 'https://www.facebook.com/...'"). The setting
  # names the page to promote; the remote script decides how the Like
  # control is shown.
  - id: facebook-fan-page-url-setting
    desc: Script sets a Facebook fan_page_url variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bfan_page_url\s*=\s*["'']https?://(www\.)?facebook\.com/'
