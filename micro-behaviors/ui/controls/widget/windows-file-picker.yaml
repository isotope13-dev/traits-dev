defaults:
  platforms: [windows]
  for: [pe, dll, csharp]
  crit: notable
  conf: 0.95

traits:
  - id: windows-file-open-dialog-interface
    desc: References Windows file-picker COM interface
    # IFileOpenDialog is the shell file picker, not evidence of file theft.
    if:
      type: text
      word: IFileOpenDialog
