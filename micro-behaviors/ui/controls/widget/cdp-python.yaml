defaults:
  crit: notable
  conf: 0.94
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-embedded-dom-selector-click
    desc: Embedded script clicks selected DOM element
    if:
      type: text
      regex: 'document\.querySelector\([^\r\n]{0,180}\.click\(\)'

  - id: python-embedded-dom-selector-value-assignment
    desc: Embedded script assigns selected DOM value
    if:
      type: text
      regex: 'document\.querySelector\([^\r\n]{0,220}\.value\s*='
