defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: captcha-solver-task-type
    desc: References a CAPTCHA solver task type
    crit: notable
    conf: 0.98
    if:
      type: literal
      regex: '^((Recaptcha|Turnstile)[A-Za-z0-9]*Task[A-Za-z0-9]*|ImageToTextTask|CoordinatesTask)$'
      exclude_docstrings: true
composite_rules:
  - id: python-external-solver-workflow
    desc: Python external CAPTCHA solver API structure
    crit: notable
    conf: 0.97
    all:
      - id: captcha-solver-task-type
      - id: micro-behaviors/communications/url/resource-path/collection::task-result-or-res-php-path-python
      - id: micro-behaviors/communications/http/request/target::literal-http-call-target
