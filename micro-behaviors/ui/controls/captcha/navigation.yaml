defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
composite_rules:
- id: turnstile-dynamic-navigation
  desc: Turnstile markers with dynamic navigation
  crit: notable
  conf: 0.95
  any:
  - id: micro-behaviors/ui/controls/captcha::turnstile-verification-markers
  all:
  - id: micro-behaviors/ui/window/navigation::window-navigation-call
- id: cloudflare-branded-turnstile-navigation
  desc: Cloudflare-branded Turnstile navigation
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/ui/controls/captcha::turnstile-dynamic-navigation
  any:
  - id: well-known/app/development/cloudflare::cloudflare-title-element
  - id: micro-behaviors/communications/http/services/cloudflare::turnstile-integration-url
  - id: micro-behaviors/communications/http/services/cloudflare::turnstile-challenge-api-script
