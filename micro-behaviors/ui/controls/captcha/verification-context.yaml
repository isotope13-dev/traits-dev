# Neutral observations; intent belongs in the consuming objective.
traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  id: spinner-i-element
  desc: Spinner UI element identifier
  crit: notable
  conf: 0.4
  if:
    type: text
    regex: (^|[^A-Za-z0-9_-])spinner-i([^A-Za-z0-9_-]|$)
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  id: vfclick-element
  desc: Verification click element identifier
  crit: notable
  conf: 0.5
  if:
    type: text
    substr: vfclick
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  id: not-a-robot-text
  desc: CAPTCHA not-a-robot text
  crit: notable
  conf: 0.6
  if:
    type: text
    regex: I('m|\s+am)\s+not\s+a\s+robot
    case_insensitive: true
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  id: checking-human-text
  desc: Human verification waiting text
  crit: notable
  conf: 0.78
  if:
    type: text
    substr: Checking if you are human. This may take a few seconds.
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  id: review-security-connection-text
  desc: Connection security review text
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: review the security of your connection before proceeding
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  id: cloudflare-footer-branding
  desc: Cloudflare security footer branding
  crit: notable
  conf: 0.78
  if:
    type: text
    regex: Platform performance and security.{0,40}Cloudflare
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  id: cloudflare-ray-id
  desc: Cloudflare Ray ID markup
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: Ray ID:\s*<code class=\"ray-id\">[a-z0-9]{12,20}</code>
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  id: cloudflare-copyright-text
  desc: Cloudflare copyright notice text
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '&copy;.{0,10}20[0-9]{2}.{0,10}Cloudflare'
- platforms:
  - macos
  - windows
  for:
  - html
  id: verification-code-label
  desc: Verification Code label text
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: Verification Code
composite_rules:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  id: verification-ui-identifiers
  desc: Verification UI identifier fragments
  crit: notable
  conf: 0.6
  any:
  - id: micro-behaviors/ui/controls/captcha::spinner-i-element
  - id: micro-behaviors/ui/controls/captcha::vfclick-element
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  id: verification-text-with-identifiers
  desc: Human verification text with UI identifiers
  crit: notable
  conf: 0.8
  all:
  - id: micro-behaviors/ui/controls/captcha::verify-human-text
  - id: micro-behaviors/ui/controls/captcha::verification-ui-identifiers
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  id: cloudflare-style-verification-page
  desc: Cloudflare-style human verification wording
  crit: notable
  conf: 0.94
  any:
  - id: micro-behaviors/ui/controls/captcha::verify-human-text
  - id: micro-behaviors/ui/controls/captcha::checking-human-text
  - id: micro-behaviors/ui/controls/captcha::review-security-connection-text
  - id: micro-behaviors/ui/controls/captcha::just-a-moment-title
  - id: micro-behaviors/ui/controls/captcha::cloudflare-footer-branding
  - id: micro-behaviors/ui/controls/captcha::cloudflare-ray-id
  needs: 4
