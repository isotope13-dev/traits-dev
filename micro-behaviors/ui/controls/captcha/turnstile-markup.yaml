defaults:
  platforms: [windows, unix]
  for: [html, php, javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: turnstile-widget-class
    desc: Turnstile widget class attribute
    if:
      type: text
      exclude_html_comments: true
      case_insensitive: true
      regex: '\bclass\s*=\s*["'']([^"''<>]{0,48}\s)?cf-turnstile(\s|["''])'
