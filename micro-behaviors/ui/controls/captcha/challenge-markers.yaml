defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, php]

traits:
  - id: challenge-container-tag
    desc: Challenge container tag
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '(?i)<[^><]{0,40}(id|class)\s*=\s*["''][^"''>]{0,24}\bchallenge-container\b'

  - id: captcha-container-tag
    desc: CAPTCHA container tag
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '(?i)<[^><]{0,40}(id|class)\s*=\s*["''][^"''>]{0,24}\bcaptcha-container\b'

  - id: verification-container-tag
    desc: Element with a verification-container class
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '(?i)<[^><]{0,40}(id|class)\s*=\s*["''][^"''>]{0,24}\bverification-container\b'

composite_rules:
- id: verification-container-label
  desc: Verification container label
  crit: notable
  conf: 0.86
  any:
  - id: challenge-container-tag
  - id: captcha-container-tag
  - id: verification-container-tag
- id: visible-verification-area
  for: [javascript, html]
  desc: Visible challenge container
  crit: notable
  conf: 0.9
  all:
  - id: verification-container-label
  - id: micro-behaviors/data/format/html::aria-visible
  near_bytes: 220
- for:
  - javascript
  - typescript
  - html
  id: human-verification-markers
  desc: Contains multiple human-verification markers
  crit: notable
  conf: 0.7
  needs: 2
  any:
  - id: micro-behaviors/ui/controls/captcha::verify-human-text
  - id: micro-behaviors/ui/controls/captcha::completing-action-text
  - id: micro-behaviors/ui/controls/captcha::just-a-moment-title
  - id: micro-behaviors/communications/http/services/cloudflare::turnstile-integration-url
  - id: micro-behaviors/communications/http/services/cloudflare::turnstile-challenge-api-script
  - id: micro-behaviors/ui/keywords::success-message-literal
  - id: micro-behaviors/ui/keywords::verifying-status-literal
