defaults:
  platforms: [unix, windows]
  for: [python, pkginfo, binaries]

composite_rules:
  - id: captcha-provider-list
    desc: Captcha solving claim and provider names
    crit: notable
    conf: 0.9
    # Container types listed so the pooled scope has a node to run on (cleave archive for: gate, 2026-09).
    scope: archive
    for: [pkginfo, package.json, python, javascript, typescript, go, rust, ruby, php, source, text, markdown, npm, whl, python_sdist, zip, tar]
    all:
      - id: micro-behaviors/ui/controls/captcha::browser-captcha-solving-capability
    needs: 3
    any:
      - id: micro-behaviors/os/application/target::recaptcha-name-reference
      - id: micro-behaviors/os/application/target::hcaptcha-name-reference
      - id: micro-behaviors/os/application/target::arkose-name-reference
      - id: micro-behaviors/os/application/target::turnstile-name-reference
      - id: micro-behaviors/os/application/target::geetest-name-reference
    unless:
      - id: well-known/lib/network/crawlo::crawlo-benign-automation-context
      # An icon pack names every product it draws; that is a logo set, not a
      # target list.
      - id: well-known/lib/ui/iconify::svg-icon-body-map

  # Vendor cardinality requires an evasion claim to support suspicious intent.
