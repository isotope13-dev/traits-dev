# Failure/expiry callback wiring is a UI observation. Deceptive navigation
# and decryption context remain required by the phishing composites.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
traits:
  - id: turnstile-error-callback-complete
    desc: Turnstile error callback uses completion handler
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: data-error-callback="onTurnstileComplete"
  - id: turnstile-expired-callback-complete
    desc: Turnstile expired callback reuses completion
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: data-expired-callback="onTurnstileComplete"
  - id: turnstile-error-completion-reference
    # Mirrors turnstile-expired-completion-reference with a wider body window:
    # obfuscator decoder shims push the completion call further into the
    # error handler (observed ~870 chars), so the call is matched within
    # the function body rather than at its opening brace.
    desc: Error callback near completion reference
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '''error-callback''\s*:\s*function[\s\S]{0,1000}\bonTurnstileComplete\b'
  - id: turnstile-expired-completion-reference
    # Same decoder-shim prologue variance as the error leg above: this kit
    # variant declares two shim functions before the conditional completion
    # call (measured ~710 chars in ticketcathayoct12-1.0.2), just past the
    # old 700-char window, so the window matches the error leg's 1000.
    desc: Expiry callback near completion reference
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '''expired-callback''\s*:\s*function[\s\S]{0,1000}\bonTurnstileComplete\b'
composite_rules:
  - id: turnstile-error-fallback-callback
    desc: Turnstile error callback completion reference
    crit: notable
    conf: 1.0
    any:
    - id: turnstile-error-callback-complete
    - id: turnstile-error-completion-reference
  - id: turnstile-expired-fallback-callback
    desc: Turnstile expiry callback completion reference
    crit: notable
    conf: 1.0
    any:
    - id: turnstile-expired-callback-complete
    - id: turnstile-expired-completion-reference
  - id: turnstile-unified-fallback-callbacks
    desc: Turnstile error and expiry completion references
    crit: suspicious
    conf: 0.9
    all:
      - id: turnstile-error-fallback-callback
      - id: turnstile-expired-fallback-callback
