defaults:
  for:
  - javascript
  - typescript
  - html
  platforms:
  - windows
  - unix
  crit: notable
traits:
- id: verify-human-text
  desc: Contains a verify-human prompt
  conf: 0.5
  if:
    type: text
    substr: Verify you are human
    case_insensitive: true
- id: completing-action-text
  desc: Contains a complete-action prompt
  conf: 0.4
  if:
    type: text
    substr: completing the action below
- id: just-a-moment-title
  desc: Contains a challenge-page waiting title
  conf: 0.7
  if:
    type: text
    substr: Just a moment...
