defaults:
  for: [javascript, typescript, python, rust, go, csharp]
  platforms:
    - linux
    - macos
    - windows
traits:
  - id: spinner-table-declaration
    desc: Declares a named terminal spinner table
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '(?m)^SPINNERS\s*=\s*\{'
