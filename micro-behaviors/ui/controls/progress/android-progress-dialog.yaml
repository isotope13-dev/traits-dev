# Compiled Dalvik call sites that advance an Android ProgressDialog.
defaults:
  platforms: [android]
  for: [dex]
  crit: component
  conf: 0.95

traits:
  - id: dex-progress-dialog-set-progress-call
    desc: DEX advances a ProgressDialog
    if:
      type: symbol
      kind: call
      exact: Landroid/app/ProgressDialog;->setProgress

composite_rules:
  - id: dex-progress-dialog-timed-advance
    desc: DEX advances a ProgressDialog on a sleep timer
    crit: notable
    all:
      - id: dex-progress-dialog-set-progress-call
      - id: micro-behaviors/time/sleep/interval::dex-thread-sleep-call
