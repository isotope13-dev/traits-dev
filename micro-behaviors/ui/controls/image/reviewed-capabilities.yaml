traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - python
  - typescript
  - json
  - text
  id: img-onerror-handler
  desc: HTML image tag declares an onerror handler
  crit: notable
  conf: 0.9
  not:
  - substr: jQuery.fn.extend
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/harness/
  - id: metadata/lang/scripted::dts-declaration-file
  - id: well-known/lib/web/npm-frameworks::angularjs-bundle
  - type: basename
    regex: (^|[\\/])angular-sanitize(\.min)?\.js$
  if:
    type: text
    regex: <img.{0,50}onerror\s*=
    case_insensitive: true
