defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.96
traits:
  - id: shared-file-signin-copy
    desc: Shared-file viewing requires sign-in
    if:
      type: text
      regex: '(?i)view your shared file[^<]{0,60}sign in'
      exclude_html_comments: true
  - id: linkedin-business-network-copy
    desc: Page displays LinkedIn Business Network branding
    if:
      type: text
      substr: LinkedIn Business Network
      exclude_html_comments: true
