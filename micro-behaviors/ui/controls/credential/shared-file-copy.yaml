defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.96
traits:
  - id: shared-file-signin-copy
    desc: Shared-file viewing requires sign-in
    if:
      type: text
      regex: '(?i)view your shared file[^<]{0,60}sign in'
      exclude_html_comments: true
  - id: linkedin-business-network-copy
    desc: Page displays LinkedIn Business Network branding
    if:
      type: text
      substr: LinkedIn Business Network
      exclude_html_comments: true
  - id: secured-document-signin-copy
    desc: Secured document viewing requires password
    if:
      type: text
      regex: '(?i)password\s+to\s+(view|open)\s+secured\s+document'
      exclude_html_comments: true
  - id: protected-file-password-prompt-copy
    desc: Protected file prompt requires password
    if:
      type: text
      regex: '(?i)file\s+is\s+protected[^\n<]{0,40}password\s+to\s+open'
      exclude_html_comments: true
  - id: document-view-signin-copy
    desc: Document viewing requires sign in
    if:
      type: text
      regex: '(?i)\bsign\s+in\s+to\s+(view|open)\s+(the\s+)?document\b'
      exclude_html_comments: true

