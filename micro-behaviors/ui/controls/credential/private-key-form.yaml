# Credential UI markup does not establish phishing.
defaults:
  conf: 0.94
  platforms: [windows, linux, macos]
  for: [javascript, typescript]

traits:
  - id: private-key-before-password-type
    desc: Private-key input precedes password type
    crit: notable
    if:
      type: text
      regex: '(?is)<input[^>]{0,180}private[ _-]*key[^>]{0,180}type\s*=\s*["'']password["'']'

  - id: password-type-before-private-key
    desc: Password type precedes private-key input
    crit: notable
    if:
      type: text
      regex: '(?is)<input[^>]{0,180}type\s*=\s*["'']password["''][^>]{0,180}private[ _-]*key'

composite_rules:
  - id: private-key-password-field
    desc: Private-key password input markup
    crit: notable
    any:
      - id: private-key-before-password-type
      - id: password-type-before-private-key

  - id: remote-script-private-key-form
    desc: Remote script alongside private-key field
    crit: notable
    all:
      - id: private-key-password-field
      - id: micro-behaviors/process/create/load/script::vscode-webview-remote-script-load
