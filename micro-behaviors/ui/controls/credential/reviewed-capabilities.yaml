traits:
- for:
  - html
  - javascript
  - typescript
  id: password-then-email-inputs
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: Password input followed by an email input
  conf: 0.86
  if:
    type: text
    regex: type\s*=\s*["']password["'][\s\S]{0,900}type\s*=\s*["']email["']
- for:
  - html
  - makefile
  - text
  id: html-password-input-tag
  desc: HTML input declares type=password
  conf: 0.9
  if:
    type: text
    regex: (?i)<input.{0,80}type\s*=\s*["']?password
defaults:
  crit: notable
  platforms:
  - unix
  - windows
