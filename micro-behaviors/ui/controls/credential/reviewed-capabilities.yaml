traits:
- for:
  - html
  - javascript
  - typescript
  id: password-then-email-inputs
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: Password input followed by an email input
  conf: 0.86
  if:
    type: text
    # Both legs are anchored to <input tags: a bare type="password" ...
    # type="email" pair also matches stylesheet attribute selectors
    # (input[type="password"]), which describe styling rather than a
    # credential form.
    regex: (?i)<input[^>]{0,200}password[\s\S]{0,900}<input[^>]{0,200}email
- for:
  - html
  - makefile
  - text
  id: html-password-input-tag
  desc: HTML input declares type=password
  conf: 0.9
  if:
    type: text
    # Same quote-escaping tolerance as text-input-tag: kits assemble the
    # tag inside script strings (type=\"password\"). The window stays inside
    # the tag (`[^>]`) so it tolerates kit input tags carrying long attribute
    # lists (name, id, value, autocomplete, class, minlength, maxlength
    # before type) without reaching into neighbouring markup.
    regex: (?i)<input[^>]{0,200}type\s*=\s*\W{0,6}password
- for:
  - html
  - javascript
  id: text-input-tag
  desc: HTML input declares type=text
  conf: 0.9
  if:
    type: text
    # \W tolerates quote-escaping in script-built markup (type=\"text\")
    # as well as plain markup (type="text").
    regex: (?i)<input.{0,80}type\s*=\s*\W{0,6}text
- for:
  - html
  - javascript
  - text
  id: password-glyph-masking-style
  desc: Stylesheet masks glyphs with password dots
  conf: 0.9
  if:
    type: text
    # text-security replaces rendered glyphs with dots or squares. On an
    # input that is the documented way to build a custom password field;
    # here it is the masking half of a detector-dodging harvest control.
    regex: (?i)text-security\s*:\s*(disc|circle|square)
- for:
  - html
  - php
  id: positioned-credential-input
  desc: Credential input absolutely positioned inline
  conf: 0.88
  if:
    type: text
    # Image-slice kits overlay pixel-placed inputs on a screenshot of the
    # real login instead of laying the form out: the input carries inline
    # absolute coordinates. Ordinary styled logins position the form, not
    # each credential control, so this stays notable until a harvest
    # composite adds the receiver.
    regex: (?i)<input[^>]{0,160}type\s*=\s*\W?(password|text)\b[^>]{0,160}position\s*:\s*absolute
composite_rules:
- id: masked-text-password-input
  desc: Text input visually masked as password field
  conf: 0.9
  all:
  - id: text-input-tag
  - id: password-glyph-masking-style
  near_bytes: 1024
defaults:
  crit: notable
  platforms:
  - unix
  - windows
