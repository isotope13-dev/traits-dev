# Placement review: matcher and effective scope preserved.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - php
  crit: notable
  conf: 0.85
traits:
- id: php-password-input-element
  desc: PHP markup declares a password input
  if:
    type: text
    regex: <input[^>]{0,120}type=['"]password['"]
  unless:
  - id: well-known/lib/web/server/wordpress-core::wordpress-core-package-doc
  - id: well-known/lib/web/server/wordpress-core::wordpress-phpunit-test-case
  - id: well-known/lib/web/server/wordpress-core::wordpress-core-include-bootstrap
  downgrade:
    any:
    - id: metadata/lang/source/naming/interface::wordpress-lowercase-api-symbol
    - id: metadata/lang/source/naming/interface::wordpress-uppercase-api-symbol
