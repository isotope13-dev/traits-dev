traits:
- for:
  - javascript
  - typescript
  id: human-verification-marker
  desc: Human-verification widget or Turnstile marker
  conf: 0.9
  if:
    type: literal
    kind: string
    regex: verify-you-are-human|cf-turnstile
- for:
  - html
  - javascript
  id: browser-verification-status-text
  desc: Security-verification status page
  conf: 0.93
  if:
    type: text
    regex: (?i)(request is being verified|process is automatic|verify you are human)
defaults:
  platforms:
  - windows
  - unix
  crit: notable
