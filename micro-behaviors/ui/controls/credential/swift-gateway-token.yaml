defaults:
  platforms: [macos]
  for: [swift]
  crit: notable
  conf: 0.98
traits:
  - id: swift-gateway-token-secure-field
    desc: Secure entry field for a gateway token
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'SecureField\s*\(\s*"remote gateway auth token \(gateway\.remote\.token\)"'
