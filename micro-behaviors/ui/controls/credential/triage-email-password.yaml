defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: email-password-inputs
    desc: Email and password inputs within 900 bytes
    crit: notable
    conf: 0.86
    near_bytes: 900
    all:
      - id: micro-behaviors/ui/window/username-field::email-input-field
      - id: micro-behaviors/ui/window/password-field::password-input-field
    unless:
      - id: metadata/package/testing/corpus::inert-security-input-module
