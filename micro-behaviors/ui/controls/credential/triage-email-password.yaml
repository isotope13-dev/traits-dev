defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]

traits:
- id: email-then-password-inputs
  unless:
    - id: metadata/package/testing/corpus::inert-security-input-module
  desc: Email input followed by a password input
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: type\s*=\s*["']email["'][\s\S]{0,900}type\s*=\s*["']password["']

