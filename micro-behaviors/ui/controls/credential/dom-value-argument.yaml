# Direct DOM reads passed as arguments, rather than assignments back to inputs.
# Semantic field names are evidence of the input's purpose, not kit identifiers.
defaults:
  platforms: [unix, windows]
  for: [html]
  crit: notable
  conf: 0.96
traits:
  - id: password-dom-value-argument
    desc: Passes password input value to a function
    # Text comment exclusion was insufficient for commented script elements.
    # Retain byte ranges and reject only matches inside HTML comments.
    if:
      type: yara
      source: |
        rule password_dom_value_argument {
          strings:
            $behavior = /[,(]\s*document\.(getElementById|querySelector)\(.{0,80}password.{0,40}\)\.value[,)]/ nocase
            $comment = /<!--(.|\n|\r)*?-->/
          condition:
            for any i in (1..#behavior) : (
              not for any j in (1..#comment) : (
                @behavior[i] >= @comment[j] and
                @behavior[i] < @comment[j] + !comment[j]
              )
            )
        }
