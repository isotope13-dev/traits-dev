defaults:
  platforms: [unix, windows]
  crit: notable

traits:
  - id: password-input-field
    desc: HTML password input form field
    crit: notable
    conf: 0.82
    for: [html, php]
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<input\b[^>]{0,1000}\btype\s*=\s*["'']?password["'']?'
