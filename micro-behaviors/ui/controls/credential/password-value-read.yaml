# Reading the live value of a page password input. Selecting the field is a
# UI observation; reading `.value` straight off the selector is the step a
# form grabber needs to obtain the typed secret.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: password-input-value-read
    desc: Reads value of a page password input
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)querySelector\w{0,3}\([^;)]{0,40}password[^;]{0,30}\)\??\.value\b'
