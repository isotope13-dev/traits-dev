# Login pages show a rejection after the server answers. A page that ships
# the rejection text in its own markup can show it whatever the server said.
defaults:
  platforms: [windows, unix]
  for: [rtf]

traits:
  - id: rtf-url-encoded-password-rejection
    desc: Encoded page text says password is incorrect
    crit: notable
    conf: 0.85
    if:
      type: encoded
      encoding: url
      regex: '(?i)password\s{1,3}is\s{1,3}incorrect'
