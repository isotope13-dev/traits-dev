defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1555
  mbc: B0028
  crit: component
  conf: 0.86

traits:
  - id: private-key-import-label
    desc: "Private-key import label"
    crit: notable
    conf: 0.96
    for: [html, javascript, svg]
    unless:
      - id: metadata/build/scaffold::openapi-javascript-required-parameter-template
    if:
      type: text
      # Only allow short direct-entry fillers.  This must not match prose such
      # as “private-key import fails” in an unrelated test or error message.
      # The leading `[^-\w]` also rules out a hyphenated verb: WebCrypto code
      # comments like `// Re-import private key to make it unextractable`
      # describe a CryptoKey round-trip, not a wallet-entry label.
      # A label ends at a quote, tag, label colon/asterisk, or line boundary;
      # prose such as "Import a private key to create a wallet" does not.
      regex: '(?m)[^-\w]import\s+((your|the|a|wallet)\s+)?private[ _-]*key(\s*[:*]|[<"''`]|$)'
      case_insensitive: true
  - id: private-key-enter-label
    # This atom cannot establish that "private key" means a wallet key. API
    # clients also use that wording; wallet intent is added by composites.
    desc: "Private-key entry label"
    crit: notable
    conf: 0.96
    for: [html, javascript, svg]
    unless:
      # Authenticator enrollment calls a TOTP seed a "private key"; it is
      # ordinary MFA setup, not a cryptocurrency-wallet recovery prompt.
      - id: micro-behaviors/ui/window/otp-field::authenticator-app-phrase
    if:
      type: text
      regex: '\benter\s+((your|the|a|wallet)\s+)?private[ _-]*key\b'
      case_insensitive: true
  - id: private-key-input-label
    desc: "Private-key input label"
    crit: notable
    conf: 0.96
    for: [html, javascript, svg]
    if:
      type: text
      regex: '\binput\s+((your|the|a|wallet)\s+)?private[ _-]*key\b'
      case_insensitive: true
  - id: private-key-recovery-label
    desc: "Private-key recovery label"
    crit: notable
    conf: 0.96
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
      - id: well-known/lib/cloud/aws-sdk-js/
      - id: well-known/lib/crypto/bitgo-js::bitgo-js-archive-context
      - id: well-known/app/finance/canopy::canopy-wallet-app-context
    for: [html, javascript, svg]
    if:
      type: text
      regex: '\b(restore|recover)\b.{0,60}\bprivate[ _-]*key\b'
      case_insensitive: true
composite_rules:
  - id: private-key-entry-label
    desc: "Private-key entry label"
    crit: notable
    conf: 0.96
    for: [html, javascript, svg, crx, xpi, zip]
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
      - id: well-known/lib/cloud/aws-sdk-js/
      - id: well-known/lib/crypto/bitgo-js::bitgo-js-archive-context
      - id: well-known/app/finance/canopy::canopy-wallet-app-context
      - id: well-known/lib/crypto/openpgp-js::openpgp-extension-ui-context
    any:
      - id: micro-behaviors/ui/controls/credential::private-key-import-label
      - id: micro-behaviors/ui/controls/credential::private-key-enter-label
      - id: micro-behaviors/ui/controls/credential::private-key-input-label
  - id: credential-entry-label
    desc: "Secret-entry label"
    crit: notable
    conf: 0.97
    for: [html, javascript, svg, crx, xpi, zip]
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
      - id: well-known/app/finance/pearl::pearl-wallet-app-context
      - id: well-known/app/finance/canopy::canopy-wallet-app-context
      - id: well-known/app/enterprise/egroupware/
    any:
      - id: micro-behaviors/ui/controls/wallet::wallet-seed-phrase-entry-label
      - id: micro-behaviors/ui/controls/wallet::wallet-secret-phrase-entry-label
      - id: micro-behaviors/ui/controls/wallet::wallet-recovery-phrase-entry-label
      - id: micro-behaviors/ui/controls/wallet::wallet-mnemonic-entry-label
      - id: micro-behaviors/ui/controls/credential::private-key-entry-label
      - id: micro-behaviors/ui/controls/credential::private-key-recovery-label
  # Label + input in one member is the page-level claim; objectives that pool
  # it with handlers in other members set `scope: archive` themselves.
  - id: credential-input-surface
    desc: "Secret-entry label with an input field"
    downgrade:
      scope: outer
      any:
        - id: micro-behaviors/ui/controls/credential::known-wallet-secret-entry-context
    crit: notable
    conf: 0.96
    for: [html, javascript, svg, crx, xpi, zip, chrome-manifest]
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
      - id: well-known/app/finance/rabby::rabby-wallet-extension-context
      - id: well-known/app/finance/canopy::canopy-wallet-app-context
      - id: well-known/lib/crypto/openpgp-js::openpgp-extension-ui-context
      - id: well-known/app/enterprise/egroupware/
      # A password manager's own vault UI has the labels and the password
      # field by construction. Referenced as these two strong identities, not
      # the `well-known/app/security/bitwarden/` directory: that directory's
      # `bitwarden-text-marker` is a bare `substr: bitwarden`, which a
      # Bitwarden-themed phishing page would carry too. The extension manifest
      # is sha-pinned, and the script form additionally requires
      # `chrome.runtime` -- a page being phished is not an extension.
      - id: well-known/app/security/bitwarden::bitwarden-extension-manifest
      - id: well-known/app/security/bitwarden::bitwarden-extension-script
    all:
      - id: micro-behaviors/ui/controls/credential::credential-entry-label
    any:
      - id: micro-behaviors/ui/controls/wallet::numbered-wallet-word-inputs
      - id: micro-behaviors/ui/controls/wallet::numbered-seed-word-inputs
      - id: micro-behaviors/ui/controls/wallet::wallet-secret-textarea
      - id: micro-behaviors/ui/window/password-field::password-input-field
      - id: micro-behaviors/ui/window/password-field::password-input-field-script

  - id: known-wallet-secret-entry-context
    desc: Known wallet secret-entry interface context
    crit: exception
    conf: 0.99
    scope: outer
    for: [crx, xpi, zip, html, javascript]
    any:
      - id: micro-behaviors/crypto/mnemonic::browser-extension-bip39-wallet
      - id: well-known/app/finance/nostrkey::nostrkey-extension-context
