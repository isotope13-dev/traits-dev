defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: native-login-email-field
    desc: Login email form-field identifier
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: login_email
  - id: native-login-password-field
    desc: Login password form-field identifier
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: login_password
composite_rules:
  - id: native-login-email-password-field-pair
    desc: Login email and password form-field identifiers
    crit: notable
    conf: 0.95
    all:
      - id: native-login-email-field
      - id: native-login-password-field
