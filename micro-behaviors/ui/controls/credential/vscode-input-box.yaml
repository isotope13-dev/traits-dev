# The editor's input box with `password: true` masks what the user types.
# Extensions use it for API keys and tokens; the call alone says only that a
# secret is collected through the editor's own UI.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: vscode-masked-input-box
    desc: Editor input box masks typed secret
    crit: notable
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: 'showInputBox\(\s*\{[^}]{0,400}\bpassword\s*:\s*(true|!0)\b'
