defaults:
  platforms: [windows, linux, macos, android, ios]
  for: [source, scripts]
  crit: component
  conf: 0.92

traits:
  - id: wifi-ssid-field
    desc: Wi-Fi SSID entry field
    if:
      type: text
      regex: '(?i)\b(ssid|wifi[_-]?ssid|wlan[_-]?ssid)\b'

  - id: wifi-password-field
    desc: Wi-Fi password entry field
    if:
      type: literal
      kind: string
      regex: '(?i)\b(wifi|wlan)[_-]?(password|passwd|pass)\b'
