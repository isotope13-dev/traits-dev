# Neutral observation; objective consumers supply attack context.
defaults:
  platforms:
  - unix
  - windows
  for:
  - html
  - javascript
  - typescript
composite_rules:
- id: browser-login-card-otp-fields
  desc: Login, card and OTP fields near form-value reads
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/data/parse/payment::payment-card-field-name
  - id: metadata/lang/source/syntax/key-value::user-password-key-context
  - id: micro-behaviors/ui/window/form-input::browser-form-value-read
  any:
  - id: micro-behaviors/ui/window/otp-field::browser-otp-data-property
  - id: micro-behaviors/ui/window/otp-field::browser-verification-data-property
  near_bytes: 1800
- id: browser-login-or-card-otp-fields
  desc: Login fields or card-and-OTP fields with value reads
  crit: notable
  conf: 0.96
  any:
  - id: micro-behaviors/ui/controls/credential::browser-credential-field-reference
  - id: micro-behaviors/ui/controls/credential::browser-login-card-otp-fields
