defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: readline-password-question
    desc: Readline question mentions password
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)question$'
      arg:
        kind: string
        substr: password
  - id: readline-secret-question
    desc: Readline question requests a secret value
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)question$'
      arg:
        kind: string
        regex: '(?i)passwd|password|passphrase|secret|token|api[ _-]?key|private[ _-]?key|auth[ _-]?code'
