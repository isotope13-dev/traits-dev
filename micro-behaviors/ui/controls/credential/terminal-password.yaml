defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: batch-password-input-prompt
    desc: Batch set /p password prompt
    crit: notable
    conf: 0.95
    for: [batch]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)\bset\s+/p\b[^=\r\n]{0,60}=[^\r\n]{0,80}password'
  - id: readline-password-question
    desc: Readline question mentions password
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)question$'
      arg:
        kind: string
        substr: password
  - id: readline-secret-question
    desc: Readline question requests a secret value
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)question$'
      arg:
        kind: string
        regex: '(?i)passwd|password|passphrase|secret|token|api[ _-]?key|private[ _-]?key|auth[ _-]?code'
