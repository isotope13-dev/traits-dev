defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: rotated-password-control-selectors
    desc: Bit-rotated password control selectors
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule rotated_password_selectors {
          strings:
            $field0_0 = { e0 c2 e6 e6 ee de e4 c8 b6 e6 e8 e4 e0 c2 e6 e6 ee de e4 c8 }
            $field0_1 = { c1 85 cd cd dd bd c9 91 6d cd d1 c9 c1 85 cd cd dd bd c9 91 }
            $field0_2 = { 83 0b 9b 9b bb 7b 93 23 da 9b a3 93 83 0b 9b 9b bb 7b 93 23 }
            $field0_3 = { 07 16 37 37 77 f6 27 46 b5 37 47 27 07 16 37 37 77 f6 27 46 }
            $field0_4 = { 0e 2c 6e 6e ee ed 4e 8c 6b 6e 8e 4e 0e 2c 6e 6e ee ed 4e 8c }
            $field0_5 = { 1c 58 dc dc dd db 9c 19 d6 dc 1d 9c 1c 58 dc dc dd db 9c 19 }
            $field0_6 = { 38 b0 b9 b9 bb b7 39 32 ad b9 3a 39 38 b0 b9 b9 bb b7 39 32 }
            $field1_0 = { e0 c2 e6 e6 ee de e4 c8 b6 e0 ee }
            $field1_1 = { c1 85 cd cd dd bd c9 91 6d c1 dd }
            $field1_2 = { 83 0b 9b 9b bb 7b 93 23 da 83 bb }
            $field1_3 = { 07 16 37 37 77 f6 27 46 b5 07 77 }
            $field1_4 = { 0e 2c 6e 6e ee ed 4e 8c 6b 0e ee }
            $field1_5 = { 1c 58 dc dc dd db 9c 19 d6 1c dd }
            $field1_6 = { 38 b0 b9 b9 bb b7 39 32 ad 38 bb }
          condition:
            any of ($field0_*) and any of ($field1_*)
        }
