defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: drag-finish
    desc: DragFinish shell drag-and-drop release import
    crit: notable
    conf: 0.8
    if:
      type: import
      exact: DragFinish
  # === Shell File Operations ===
  - id: shell-drag-drop
    desc: Invoke shell drag drop
    crit: notable
    conf: 0.93
    if:
      type: symbol
      exact: SHDoDragDrop
  - id: shell-drag-query-file
    desc: Shell drag query API
    crit: notable
    conf: 0.92
    if:
      type: symbol
      exact: DragQueryFileW
