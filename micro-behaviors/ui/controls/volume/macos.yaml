# macOS output-volume controls are neutral user-interface capabilities. Their
# presence becomes evasive only when an objective combines them with collection
# or when a mute/unmute bracket cannot be explained by an ordinary level setter.
defaults:
  platforms: [macos]
  for: [scripts, source, macho]
  crit: notable

traits:
  - id: applescript-mute
    desc: Mutes macOS output via AppleScript
    conf: 0.9
    if:
      type: text
      regex: 'set volume (with output muted|output muted true)'

  - id: applescript-unmute
    desc: Unmutes macOS output via AppleScript
    conf: 0.9
    if:
      type: text
      regex: 'set volume (without output muted|output muted false)'

  - id: applescript-set-level
    desc: Sets macOS output volume level
    conf: 0.9
    if:
      type: text
      regex: 'set volume output volume\s+(\d{1,3}|\{[A-Za-z_][A-Za-z0-9_]*\})'

  - id: zero-level-branch
    desc: Branches on zero output volume
    conf: 0.86
    for: [python]
    if:
      type: text
      regex: '\bif\s+level\s*==\s*0\s*:'
