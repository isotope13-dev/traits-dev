defaults:
  platforms:
  - windows
  - macos
  for:
  - html
  crit: notable
  conf: 0.96
traits:
- id: micro-behaviors/ui/controls/button::download-labelled-button
  desc: HTML button advertises a download
  if:
    type: text
    regex: (?i)<button\b[^>]{0,120}>\s*Download\b
    exclude_html_comments: true
- id: dom-control-click-handler
  desc: DOM control registers a click handler
  if:
    type: text
    regex: getElementById\(['"][\w-]{1,40}['"]\)\.addEventListener\(['"]click
    exclude_html_comments: true
