# A DOM selector for social "Add Friend" buttons by their accessible label.
# Accessibility tooling reads labels too; locating this one control is the
# first step of scripted friend-request sending.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: add-friend-button-selector
    desc: Selects Add Friend buttons by aria-label
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)aria-label\*?=\\?["'']Add Friend'
