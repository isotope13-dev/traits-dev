defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.94
traits:
  - id: document-access-button-label
    desc: Button offers document access
    if:
      type: text
      exclude_html_comments: true
      regex: '(?is)<button\b[^>]{0,160}>\s*(view|open|download)\s+document\s*</button>'
