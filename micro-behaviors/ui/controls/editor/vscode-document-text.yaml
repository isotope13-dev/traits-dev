# Reading the full text buffer of the editor's active document: whatever the
# user is looking at or typing, saved or not.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: vscode-active-editor-text-read
    desc: Reads full text of an editor document
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      regex: '(activeTextEditor|[eE]ditor)(\s*\?)?\.document\.getText\(\s*\)'
