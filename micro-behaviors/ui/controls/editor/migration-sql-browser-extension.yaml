defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: avanty-ace-event-channel
  desc: Avanty Ace editor event channel
  conf: 0.95
  if:
    type: text
    substr: avantyAceCommunication
- id: sql-editor-set-value
  desc: Sets SQL editor value
  conf: 0.86
  if:
    type: text
    regex: (?i)sql.{0,40}editor\.setValue|editor\.setValue.{0,40}sql
- id: avanty-codemirror-event-channel
  desc: Avanty CodeMirror event channel
  conf: 0.95
  if:
    type: text
    substr: avantyCodeMirrorCommunication
- id: pgadmin-sqleditor-container
  desc: SQL editor container identifier
  conf: 0.88
  if:
    type: text
    substr: sqleditor-container
composite_rules:
- id: metabase-ace-editor-bridge
  desc: Bridges Metabase Ace editor
  conf: 0.92
  all:
  - id: micro-behaviors/ui/controls/editor::avanty-ace-event-channel
  - id: micro-behaviors/data/property/read::metabase-store-access
  - id: micro-behaviors/ui/controls/input::ace-editor-access
  - id: micro-behaviors/ui/controls/editor::sql-editor-set-value
- id: pgadmin-codemirror-editor-bridge
  desc: Bridges pgAdmin CodeMirror editor
  conf: 0.92
  all:
  - id: micro-behaviors/ui/controls/editor::avanty-codemirror-event-channel
  - id: micro-behaviors/ui/controls/editor::pgadmin-sqleditor-container
  - id: micro-behaviors/communications/http/security/csrf::pgadmin-csrf-token-read
