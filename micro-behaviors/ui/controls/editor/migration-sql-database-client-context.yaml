defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
composite_rules:
- id: ai-sql-assistant-editor-bridge
  desc: SQL assistance with editor integration clues
  crit: notable
  conf: 0.9
  scope: archive
  for:
  - javascript
  - typescript
  - chrome-manifest
  - crx
  - xpi
  all:
