# Ordinary authentication can carry the already-entered email in a hidden
# field. Neither a populated field nor its hidden type establishes phishing.
defaults:
  platforms: [windows, unix]
  for: [html, makefile, text]
  crit: notable
  conf: 0.9

traits:
  - id: email-valued-input
    desc: HTML input value contains an email address
    if:
      type: text
      # 400, not 240: kit inputs bury value behind long style attributes
      # (cursor and touch-callout hardening on the victim address field).
      regex: '<input\b[^>]{0,400}\bvalue\s*=\s*["''][\w.+-]+@[\w.-]+'
  - id: hidden-email-valued-input
    desc: Hidden input value contains an email address
    if:
      type: text
      regex: '<input[^>]{0,160}\btype=["'']hidden["''][^>]{0,160}\bvalue=["''][\w.+-]+@[\w.-]+'
