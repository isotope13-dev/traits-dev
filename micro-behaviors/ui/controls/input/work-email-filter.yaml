# Consumer webmail domain lists and work-email validation prompts in web UIs.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: component
  conf: 0.88

traits:
  - id: gmail-domain-literal
    desc: Quoted gmail.com domain literal
    if:
      type: text
      regex: '["'']gmail\.com["'']'
      case_insensitive: true

  - id: yahoo-domain-literal
    desc: Quoted yahoo.com domain literal
    if:
      type: text
      regex: '["'']yahoo\.com["'']'
      case_insensitive: true

  - id: outlook-domain-literal
    desc: Quoted outlook.com domain literal
    if:
      type: text
      regex: '["'']outlook\.com["'']'
      case_insensitive: true

  - id: hotmail-domain-literal
    desc: Quoted hotmail.com domain literal
    if:
      type: text
      regex: '["'']hotmail\.com["'']'
      case_insensitive: true

  - id: work-email-required-prompt
    desc: Prompts user for work email address
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)enter a work email( address)?'

composite_rules:
  - id: consumer-webmail-domain-set
    desc: Lists multiple consumer webmail domains
    crit: notable
    conf: 0.92
    near_bytes: 300
    needs: 3
    any:
      - id: gmail-domain-literal
      - id: yahoo-domain-literal
      - id: outlook-domain-literal
      - id: hotmail-domain-literal
