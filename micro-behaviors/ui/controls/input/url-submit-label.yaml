defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.93

traits:
  - id: html-submit-input-type
    desc: HTML input declares a submit control
    if:
      type: text
      regex: '(?i)\btype\s*=\s*submit\b'
  - id: html-input-url-value
    desc: HTML input value displays an absolute URL
    if:
      type: text
      regex: '(?i)\bvalue\s*=\s*["'']https?://'
