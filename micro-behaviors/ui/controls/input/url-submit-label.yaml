defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  crit: notable
  conf: 0.93
traits:
- id: html-submit-input-type
  desc: HTML input declares a submit control
  if:
    type: text
    exclude_html_comments: true
    regex: (?i)<input\b[^>]{0,999}\stype\s*=\s*["']?submit\b
- id: html-input-url-value
  desc: HTML input declares an absolute URL value
  if:
    type: text
    exclude_html_comments: true
    regex: (?i)<input\b[^>]{0,999}\svalue\s*=\s*["']https?://
