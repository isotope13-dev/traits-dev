defaults:
  platforms: [unix]
  for: [python]
  crit: notable

traits:
  - id: x11-xtest-library-ref
    desc: References X11 XTest shared library
    conf: 0.92
    if:
      type: text
      substr: libXtst

  - id: x11-xtest-fake-input
    desc: Calls XTest synthetic input API
    conf: 0.94
    if:
      type: text
      regex: 'XTestFake(Motion|Button|Key)Event'

composite_rules:
  - id: x11-xtest-synthetic-input
    desc: Python injects synthetic X11 XTest input
    conf: 0.96
    all:
      - id: x11-xtest-library-ref
      - id: x11-xtest-fake-input
