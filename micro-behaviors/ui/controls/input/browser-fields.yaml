defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: username-or-email-input-literal
    crit: notable
    desc: JavaScript string names username or email input
    for: [javascript, typescript]
    if:
      type: literal
      regex: '(?i)<input\b[^>]{0,80}\bname\s*=\s*["''](username|user_?id|email)["'']'
  - id: username-or-email-selector-literal
    desc: JavaScript selector names username or email
    for: [javascript, typescript]
    if:
      type: literal
      regex: '(?i)\[name\s*=\s*["''](username|user_?id|email)["'']'
  - id: username-or-email-input-markup
    crit: notable
    desc: HTML input names username or email
    for: [html, php]
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,80}\bname\s*=\s*["''](username|user_?id|email)["'']'
  - id: username-or-email-selector-markup
    desc: HTML selector names username or email
    for: [html, php]
    if:
      type: text
      regex: '(?i)\[name\s*=\s*["''](username|user_?id|email)["'']'
  - id: email-input-query-selector
    desc: Queries an email input by type
    for: [javascript, typescript, html, php]
    if:
      type: text
      regex: 'querySelector\s*\([^)]{0,40}input\[type=["'']email["'']\]'
composite_rules:
  - id: username-or-email-input-reference
    desc: Username or email input markup or selector
    for: [html, php, javascript, typescript]
    any:
      - id: username-or-email-input-literal
      - id: username-or-email-selector-literal
      - id: username-or-email-input-markup
      - id: username-or-email-selector-markup
      - id: micro-behaviors/ui/window/username-field::email-input-field
      - id: email-input-query-selector
