defaults:
  platforms: [unix, windows]
  for: [html, php]
  crit: baseline
  conf: 0.95

traits:
  - id: html-checkbox-input
    desc: HTML checkbox input control
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<input\b[^>]{0,180}\btype\s*=\s*["'']?checkbox\b'

  - id: html-document-filename-input
    desc: Input value names an Office/PDF document
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<input\b[^>]{0,180}\bvalue=["''][^"'']{1,100}\.(pdf|docx?|xlsx?)["'']'

composite_rules:
  - id: html-document-selection-inputs
    desc: Nearby checkbox and document filename inputs
    near_bytes: 180
    all:
      - id: html-checkbox-input
      - id: html-document-filename-input
