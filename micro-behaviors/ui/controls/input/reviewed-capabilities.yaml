defaults:
  platforms:
  - windows
  - unix
traits:
- for:
  - html
  - makefile
  - text
  id: html-hidden-input-tag
  desc: HTML input declares type=hidden
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)<input.{0,80}type\s*=\s*["']?hidden
- for:
  - html
  - javascript
  id: text-input-tag
  desc: HTML input declares type=text
  crit: notable
  conf: 0.9
  if:
    type: text
    # \W tolerates quote-escaping in script-built markup (type=\"text\")
    # as well as plain markup (type="text").
    regex: (?i)<input.{0,80}type\s*=\s*\W{0,6}text
