defaults:
  for: [perl]
  platforms: [unix, windows]

traits:
  - id: html-command-named-input
    desc: HTML input named command
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '<input[^>\n]{0,120}name="command"'
  - id: html-command-action-input
    desc: HTML input selects command execution
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)<input[^>\n]{0,72}\bvalue\s*=\s*[''"]?(command|execute|run-command)[''"\s>]'

composite_rules:
  - id: html-command-interface-input
    desc: HTML command input or action
    crit: component
    conf: 0.86
    any:
      - id: html-command-named-input
      - id: html-command-action-input
