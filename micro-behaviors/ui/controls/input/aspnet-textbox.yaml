# ASP.NET Web Forms text box rendered server-side: its .Text value is
# posted back and readable by the page's code-behind or inline script.
defaults:
  platforms: [windows]
  for: [html, asp]
  crit: notable
  conf: 0.9
traits:
  - id: aspnet-server-textbox-control
    desc: Page declares a server-side asp:TextBox
    if:
      type: text
      regex: '(?i)<asp:TextBox\b[^>]{0,200}runat="server"'
