defaults:
  platforms: [windows]
  for: [asp]
  crit: notable
  conf: 0.9

traits:
  - id: named-textarea-tag
    desc: HTML textarea declares a field name
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<textarea\b[^>]{0,100}\bname\s*=\s*["'']?[a-z][\w-]{0,20}'
