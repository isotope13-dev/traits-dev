defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  attack: T1555
  mbc: B0028
  crit: component
  conf: 0.86

traits:
  - id: generic-recovery-phrase-entry-prompt
    desc: Generic recovery phrase entry prompt
    downgrade:
      scope: archive
      any:
        - id: micro-behaviors/crypto/mnemonic::browser-extension-bip39-wallet
    crit: suspicious
    conf: 0.88
    unless:
      - id: well-known/app/finance/pearl::pearl-wallet-app-context
      - id: well-known/app/communication/frenfoil::frenfoil-messenger-context
    if:
      type: text
      substr: Enter your recovery phrase
  - id: optional-passphrase-word
    desc: "Optional mnemonic passphrase label"
    crit: suspicious
    conf: 0.86
    if:
      type: text
      substr: 25th word
  - id: restore-from-recovery-copy
    desc: Restore from recovery phrase copy
    crit: notable
    conf: 0.82
    if:
      type: text
      substr: Restore from recovery phrase
  - id: numbered-seedword-inputs
    desc: Numbered seedword input grid
    crit: suspicious
    conf: 0.92
    count_min: 12
    if:
      type: text
      regex: 'id=["'']seedword[0-9]{1,2}["'']'
  - id: seedword-input-name
    desc: Seedword input identifier
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: seedword
  # The two textarea shapes below are legs of wallet-secret-textarea, which
  # is the one report for "this page has a recovery-secret textarea"; a
  # textarea alone is what real wallets ship too, so intent comes from
  # credential::credential-input-surface (label + input) and objectives.
  - id: wallet-seed-textarea
    desc: Textarea attribute names a seed
    crit: component
    conf: 0.96
    unless:
      - id: well-known/app/finance/pearl::pearl-wallet-app-context
    if:
      type: text
      regex: '(?i)<textarea[^>]{0,120}(id|name|placeholder|aria-label)\s*=\s*["''][^"'']{0,40}\bseed\b'
  - id: wallet-recovery-textarea
    desc: Textarea beside recovery/seed/mnemonic text
    crit: component
    conf: 0.96
    unless:
      - id: well-known/app/finance/pearl::pearl-wallet-app-context
    if:
      type: text
      regex: '(?i)<textarea\b[\s\S]{0,500}\b(recovery phrase|seed phrase|mnemonic)\b'
  - id: wallet-seed-phrase-entry-label
    desc: Wallet seed phrase entry label
    crit: notable
    conf: 0.96
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
      - id: well-known/app/finance/pearl::pearl-wallet-app-context
    if:
      type: text
      regex: '\b(import|enter|restore|recover)\b.{0,60}\bseed phrase\b'
      case_insensitive: true
  - id: wallet-secret-phrase-entry-label
    desc: Wallet secret phrase entry label
    crit: notable
    conf: 0.96
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
    if:
      type: text
      regex: '\b(import|enter|restore|recover)\b.{0,60}\bsecret phrase\b'
      case_insensitive: true
  - id: wallet-recovery-phrase-entry-label
    desc: Wallet recovery phrase entry label
    crit: notable
    conf: 0.96
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
      - id: well-known/app/finance/pearl::pearl-wallet-app-context
    if:
      type: text
      regex: '\b(import|enter|restore|recover)\b.{0,60}\brecovery phrase\b'
      case_insensitive: true
  - id: wallet-mnemonic-entry-label
    desc: Wallet mnemonic entry label
    crit: notable
    conf: 0.96
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
      - id: well-known/lib/vendor-sdk/openchamber::openchamber-credential-import-context
      - id: well-known/lib/vendor-sdk/openchamber::openchamber-assembly-grammar-context
      - id: well-known/app/finance/pearl::pearl-wallet-app-context
    if:
      type: text
      regex: '\b(import|enter|restore|recover)\b.{0,60}\bmnemonic\b'
      case_insensitive: true
    not:
      - substr: mnemonic.general-purpose
      - substr: keyword.operator.word.mnemonic
      - substr: mnemonics-intel-isa
  - id: numbered-wallet-word-inputs
    desc: Numbered wallet word input grid
    crit: notable
    conf: 0.95
    count_min: 12
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,240}\bname=["'']word[0-9]{1,2}["'']'
  - id: numbered-seed-word-inputs
    desc: Numbered seed-word input grid
    crit: notable
    conf: 0.97
    count_min: 12
    if:
      type: text
      regex: 'name=["'']seed[-_ ]word[-_ ]?[0-9]{1,2}["'']'
  - id: wallet-seed-word-field-code
    desc: Selects seed-word input fields
    crit: notable
    conf: 0.96
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
    if:
      type: symbol
      kind: call
      regex: '(^|\.)querySelector(All)?$'
      arg:
        kind: string
        regex: 'input\[name[\^*]?=["'']seed[-_ ]word'
  - id: invalid-seed-phrase-error
    desc: Invalid seed-phrase error text
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\binvalid\s+(seed|mnemonic)(\s+(phrase|words?))?\b'
composite_rules:
  - id: web-mnemonic-entry-form
    desc: "Recovery-phrase entry interface text"
    downgrade:
      scope: archive
      any:
        - id: micro-behaviors/crypto/mnemonic::browser-extension-bip39-wallet
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/ui/controls/wallet::recovery-phrase-entry-prompt
      - id: micro-behaviors/crypto/mnemonic::seed-phrase-word
    any:
      - id: micro-behaviors/ui/controls/wallet::recovery-phrase-word-count-prompt
      - id: micro-behaviors/ui/controls/wallet::optional-passphrase-word
      - id: micro-behaviors/ui/controls/wallet::restore-from-recovery-copy
  - id: web-seedword-entry-form
    desc: "Numbered recovery-phrase entry form"
    downgrade:
      scope: archive
      any:
        - id: micro-behaviors/crypto/mnemonic::browser-extension-bip39-wallet
    crit: suspicious
    conf: 0.94
    for: [html, javascript, crx, xpi, zip]
    all:
      - id: micro-behaviors/ui/controls/wallet::generic-recovery-phrase-entry-prompt
      - id: micro-behaviors/ui/controls/wallet::numbered-seedword-inputs
      - id: micro-behaviors/ui/controls/wallet::seedword-input-name
  - id: wallet-secret-textarea
    desc: Textarea for a wallet recovery secret
    crit: notable
    conf: 0.96
    for: [html, javascript, crx, xpi, zip]
    unless:
      - id: well-known/app/finance/did-wallet::did-wallet-extension-context
      - id: well-known/app/finance/did-wallet::did-wallet-secret-safety-warning
      - id: well-known/app/finance/canopy::canopy-wallet-app-context
      - id: well-known/app/finance/pearl::pearl-wallet-app-context
    any:
      - id: micro-behaviors/ui/controls/wallet::wallet-seed-textarea
      - id: micro-behaviors/ui/controls/wallet::wallet-recovery-textarea
