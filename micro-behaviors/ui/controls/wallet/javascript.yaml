defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: wallet-connect-cta
    desc: Wallet connection call-to-action text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bconnect\s+(your\s+wallet|(your\s+)?(crypto|cryptocurrency)\s+wallet)\b'
      case_insensitive: true

  - id: hardware-wallet-connect-cta
    desc: Hardware-wallet connection call-to-action text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b(connect|pair)\s+(your\s+)?(ledger|trezor|hardware\s+wallet)\b'
      case_insensitive: true

  - id: transaction-signing-instruction
    desc: Transaction signing instruction text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b(verify|review|confirm)\s*(&|and)\s*sign\s+(the\s+)?transaction\b'
      case_insensitive: true
