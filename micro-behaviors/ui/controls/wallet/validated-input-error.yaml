defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: validated-word-array-forwarded-then-error
    desc: Validated words forwarded before error state
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((arrow_function body: (statement_block
          (lexical_declaration (variable_declarator name: (identifier) @result
            value: (call_expression arguments: (arguments (identifier) @words))))
          (expression_statement (sequence_expression
            (binary_expression left: (identifier) @checked
              right: (parenthesized_expression (sequence_expression
                (await_expression (call_expression arguments: (arguments
                  (call_expression function: (member_expression object: (identifier) @joined_words
                    property: (property_identifier) @join)
                    arguments: (arguments (string (string_fragment) @separator))))))
                (call_expression arguments: (arguments (string (string_fragment) @error))))))))))
          (#eq? @result @checked)
          (#eq? @words @joined_words)
          (#eq? @join "join")
          (#eq? @separator " ")
          (#eq? @error "error"))
