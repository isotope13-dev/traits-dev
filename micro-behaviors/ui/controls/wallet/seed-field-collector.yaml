# The direct-pass kit shape behind dom-value-report-channel's third
# alternative: a password-input DOM selector over named seed fields, a
# .value read beside it, and a collector named for telemetry receiving the
# data object. Same evidentiary standard as the joined aggregation
# alternative — a browser-input source plus a report channel — recorded as
# file co-occurrence, not a cross-function value-flow proof.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: seed-field-values-collector-call
    desc: Seed-field selector, value read, and collector data call
    crit: notable
    conf: 0.94
    scope: file
    all:
      - id: wallet-seed-word-field-code
      - id: micro-behaviors/data/property/access::js-value-property-read
      - id: micro-behaviors/os/telemetry/logging/analytics::telemetry-data-object-call
