defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: seed-phrase-code-reference
  desc: Code references a seedPhrase-named field
  crit: notable
  conf: 0.5
  for:
  - html
  - javascript
  - typescript
  if:
    type: text
    substr: seedPhrase
  unless:
  - id: metadata/file/extension/identity::declaration-file-extension
