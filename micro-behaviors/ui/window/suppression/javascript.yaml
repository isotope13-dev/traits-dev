defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  # Generated HTML can be embedded in any source language or native binary.
  for: [scripts, source, pyc, html]

traits:
  - id: browser-window-contextmenu-suppression
    desc: Global context menu cancellation handler
    if:
      type: text
      exclude_html_comments: true
      regex: '\b(window|document)\.oncontextmenu\s*=[^}]{0,320}(\.preventDefault\s*\(|return\s+false\b)'

  - id: browser-window-keydown-suppression
    desc: Global keydown cancellation handler
    if:
      type: text
      exclude_html_comments: true
      regex: '\b(window|document)\.onkeydown\s*=[^}]{0,320}(\.preventDefault\s*\(|return\s+false\b)'

  # Go's joined string table can omit the generated page from extracted text.
  - id: native-contextmenu-cancellation
    desc: Embedded global context menu cancellation
    for: [pe, elf, macho]
    if:
      type: raw
      regex: '\b(window|document)\.oncontextmenu\s*=[^}]{0,320}(\.preventDefault\s*\(|return\s+false\b)'

  # Go's joined string table can omit the generated page from extracted text.
  - id: native-keydown-cancellation
    desc: Embedded global keydown cancellation
    for: [pe, elf, macho]
    if:
      type: raw
      regex: '\b(window|document)\.onkeydown\s*=[^}]{0,320}(\.preventDefault\s*\(|return\s+false\b)'
