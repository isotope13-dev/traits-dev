defaults:
  platforms: [unix, windows]
  for: [javascript]

traits:
  - id: browser-window-contextmenu-suppression
    desc: Suppresses global context menu
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      kind: assignment
      language: javascript
      regex: '\bwindow\.oncontextmenu\b\s*=.{0,320}(preventDefault\s*\(|return\s+false)'

  - id: browser-window-keydown-suppression
    desc: Suppresses global keydown actions
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      kind: assignment
      language: javascript
      regex: '\bwindow\.onkeydown\b\s*=.{0,320}(preventDefault\s*\(|return\s+false)'
