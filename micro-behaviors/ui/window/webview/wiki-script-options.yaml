defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: webview-enables-scripts
    desc: Enables scripts in editor webview
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((assignment_expression
          left: (member_expression
            object: (member_expression property: (property_identifier) @webview)
            property: (property_identifier) @options)
          right: (object (pair key: (property_identifier) @scripts value: (true))))
          (#eq? @webview "webview")
          (#eq? @options "options")
          (#eq? @scripts "enableScripts"))

  - id: webview-displays-wiki-html
    desc: Assigns rendered wiki HTML to webview
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((assignment_expression
          left: (member_expression
            object: (member_expression property: (property_identifier) @webview)
            property: (property_identifier) @html)
          right: (identifier) @value)
          (#eq? @webview "webview")
          (#eq? @html "html")
          (#eq? @value "html"))
