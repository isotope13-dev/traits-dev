defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [c, cpp, csharp, rust, go, java]
traits:
  - id: cef-browser-type-reference
    desc: References CEF browser types
    conf: 0.95
    if:
      type: text
      regex: '\bCef(Browser|Frame|RefPtr)\b'

composite_rules:
  - id: cef-load-url-call
    desc: CEF browser navigates to supplied URL
    conf: 0.96
    all:
      - id: micro-behaviors/ui/window/webview::cef-browser-type-reference
      - id: micro-behaviors/data/control-flow/dispatch/named::load-url-method-call
    near_bytes: 1200
