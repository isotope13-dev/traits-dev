defaults:
  platforms: [android]
  for: [java, kotlin]

traits:
  - id: webview-dom-password-type-eq
    desc: Checks DOM input type password
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.type\b[^\r\n]{0,40}===?\s*\\?["'']password\\?["'']'

  - id: webview-dom-password-css-selector
    desc: Queries DOM password input selector
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)input\s*\[\s*type\s*=\s*\\?["'']?password\b'

  - id: webview-dom-input-selector
    desc: Queries DOM input or form elements
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'querySelectorAll\s*\(\s*\\?["''][^"''\r\n]{0,60}\b(input|password|form)\b'

  - id: webview-dom-direct-input-listener
    desc: Direct DOM input event listener
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'addEventListener\s*\(\s*\\?["''](submit|input|change)\\?["'']'

  - id: webview-dom-loop-input-listener
    desc: Iterated DOM input event listener
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\\?["'']input\\?["'']\s*,\s*\\?["'']change\\?["''][\s\S]{0,140}addEventListener'

  - id: webview-dom-storage-read
    desc: Reads WebView localStorage or sessionStorage
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(localStorage|sessionStorage)\.(getItem|key)\s*\('

composite_rules:
  - id: webview-dom-password-field-check
    desc: Script checks DOM password inputs
    crit: notable
    conf: 0.93
    any:
      - id: webview-dom-password-type-eq
      - id: webview-dom-password-css-selector

  - id: webview-dom-submit-or-input-listener
    desc: Listens for DOM input or submit
    crit: notable
    conf: 0.88
    any:
      - id: webview-dom-direct-input-listener
      - id: webview-dom-loop-input-listener
