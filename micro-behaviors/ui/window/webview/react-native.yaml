# React Native WebView rendering patterns where remote content is selected at
# runtime instead of being bundled with the component.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.93

traits:
  - id: react-native-webview-state-uri-source
    desc: WebView loads URI from state
    if:
      type: text
      regex: '<WebView[^>]{0,200}source=\{\{\s*uri:\s*[A-Za-z_][A-Za-z0-9_]*'

  - id: react-native-modal-hosted-webview
    desc: Full-screen Modal hosts a React Native WebView
    if:
      type: text
      regex: '<Modal[\s\S]{0,400}<WebView'
