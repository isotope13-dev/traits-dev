defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.98

traits:
  - id: dex-webview-bundled-asset-load
    desc: Android WebView loads a bundled asset URL
    if:
      type: symbol
      kind: call
      exact: 'Landroid/webkit/WebView;->loadUrl'
      arg:
        index: 0
        kind: string
        substr: 'file:///android_asset/'
