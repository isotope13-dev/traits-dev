# Text form of the script-enable option, covering shapes the assignment
# query misses (options passed straight to createWebviewPanel, or a
# variable holding the options object). Same subject and claim as
# webview-enables-scripts: the option name is mandated by the platform.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.93
traits:
  - id: webview-enable-scripts-option
    desc: Webview options literal enables scripts
    if:
      type: text
      regex: '\benableScripts\s*:\s*true\b'
