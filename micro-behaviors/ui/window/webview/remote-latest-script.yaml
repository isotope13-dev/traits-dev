# Detects a mutable microfrontend entry selected into a rendered script tag.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.97
traits:
  - id: latest-rcs-script-template
    desc: Loads latest RCS script in webview template
    if:
      type: yara
      source: |
        rule latest_rcs_script_template {
          strings:
            $url = "frontends/rcs/prd-latest/remoteEntry.js" ascii
            $argument = "scriptUri:r" ascii
            $render = "renderTemplate(\"rcs\",a)" ascii
            $tag = "<script nonce=" ascii
            $template = "name:\"scriptUri\"" ascii
          condition:
            all of them and @argument > @url and @argument - @url < 800 and
            @render > @argument and @render - @argument < 800 and
            for any i in (1..#tag) : (
              for any j in (1..#template) : (
                @template[j] > @tag[i] and @template[j] - @tag[i] < 800
              )
            )
        }
