# The bridges are real interfaces named by the EMBRACE technical write-up.
# Calls alone do not establish prompt injection or a false reported origin.
# Text also covers HTML and JavaScript generated inside a Blob/template.
defaults:
  for: [javascript, typescript, html]
  platforms: [linux, macos, windows]
  crit: notable
  conf: 0.96

traits:
  - id: cursor-element-selected-send
    desc: Sends element selection through Cursor bridge
    if:
      type: text
      regex: '\bcursorBrowser\.send\s*\(\s*["'']element-selected["'']'
      exclude_html_comments: true

  - id: copilot-preview-url-change-invoke
    desc: Invokes Copilot preview URL-change bridge
    if:
      type: text
      regex: 'invoke\s*\(\s*["'']plugin:browser-preview\|submit_browser_preview_url_change'
      exclude_html_comments: true
