# Replacing history.pushState / replaceState with a wrapper. Single-page
# apps navigate through these calls without a page load, so the wrapper
# sees every in-app route change.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: history-push-state-override
    desc: Overrides history pushState or replaceState
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bhistory\.(pushState|replaceState)\s*=\s*function\b'
