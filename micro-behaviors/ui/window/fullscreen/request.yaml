# Programmatic fullscreen request. Entering fullscreen hides the browser
# chrome (address bar, tabs, window controls). Legitimate for video players
# and games; a scare page uses it to make the tab look like the whole OS and
# to remove the visual exits. Neutral on its own; the browser-lock composite
# pairs it with keyboard/exit blocking.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: request-fullscreen-call
    desc: Calls browser fullscreen request method
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(webkit|moz|ms)?requestfullscreen$'
  # HTML facts currently expose script text without JavaScript call records.
  # Keep that weaker observation explicit rather than claim a parsed call.
  - id: html-fullscreen-request-syntax
    desc: HTML contains fullscreen request method syntax
    for: [html]
    if:
      type: text
      regex: '(?i)\.(webkit|moz|ms)?requestfullscreen\s*\('
