# Programmatic fullscreen request. Entering fullscreen hides the browser
# chrome (address bar, tabs, window controls). Legitimate for video players
# and games; a scare page uses it to make the tab look like the whole OS and
# to remove the visual exits. Neutral on its own; the browser-lock composite
# pairs it with keyboard/exit blocking.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: request-fullscreen-call
    desc: Requests fullscreen to hide browser chrome
    if:
      type: text
      regex: '(?i)\.(webkit|moz|ms)?requestfullscreen\s*\('
