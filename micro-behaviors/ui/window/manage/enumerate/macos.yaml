defaults:
  for: [macho]
  platforms: [macos]

traits:
  # Text rather than import: cleave recovers no import table for small
  # statically-stubbed Mach-O executables, so an import-only spelling misses
  # window enumeration in compiled surveillance agents.
  - id: cgwindow-list-copy-window-info
    desc: Enumerate macOS windows through Core Graphics
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: CGWindowListCopyWindowInfo
  - id: get-frontmost-application
    desc: Query current frontmost application
    crit: notable
    conf: 0.9
    if:
      type: text
      section: __TEXT,__objc_methname
      substr: frontmostApplication
