defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9

traits:
- id: browser-body-innertext-read
  desc: Reads visible browser body text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b(document\.)?body\.innerText\b'

  # Open Graph tags are server-rendered into <head>, so they carry a page's
  # identity (profile name, title, description) before any client framework
  # renders — which is why scrapers read them in preference to the DOM.
- id: browser-og-meta-read
  desc: Reads Open Graph meta tag content
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'meta\[property\s*=\s*["'']og:'

- id: page-script-element-enumeration
  desc: Enumerates scripts with querySelectorAll()
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'querySelectorAll\s*\(\s*[''"]script[''"]\s*\)'
