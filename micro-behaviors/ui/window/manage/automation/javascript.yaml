defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: dom-dispatch-click-call
    desc: Dispatches a synthetic DOM click event
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.dispatchEvent\s*\(\s*new\s+MouseEvent\s*\(\s*["'']click["'']'

  - id: dom-dispatch-mousemove-call
    desc: Dispatches a synthetic DOM mousemove event
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.dispatchEvent\s*\(\s*new\s+MouseEvent\s*\(\s*["'']mousemove["'']'

  - id: dom-dispatch-change-event
    desc: Dispatches synthetic DOM change event
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      language: javascript
      kind: call
      regex: '\.dispatchEvent\s*\(\s*new\s+(Event|CustomEvent)\s*\(\s*["'']change["'']'

  - id: dom-dispatch-input-event
    desc: Dispatches synthetic DOM input event
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      language: javascript
      kind: call
      regex: '\.dispatchEvent\s*\(\s*new\s+(Event|CustomEvent)\s*\(\s*["'']input["'']'

  - id: dom-dispatch-submit-event
    desc: Dispatches synthetic DOM submit event
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      language: javascript
      kind: call
      regex: '\.dispatchEvent\s*\(\s*new\s+(Event|CustomEvent)\s*\(\s*["'']submit["'']'

  - id: dom-dispatch-load-event
    desc: Dispatches synthetic DOM load event
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      language: javascript
      kind: call
      regex: '\.dispatchEvent\s*\(\s*new\s+(Event|CustomEvent)\s*\(\s*["'']load["'']'

  - id: dom-dispatch-error-event
    desc: Dispatches synthetic DOM error event
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      language: javascript
      kind: call
      regex: '\.dispatchEvent\s*\(\s*new\s+(Event|CustomEvent)\s*\(\s*["'']error["'']'

composite_rules:
  - id: dom-dispatch-non-pointer-event
    desc: Dispatches synthetic non-pointer DOM event
    crit: notable
    conf: 0.92
    any:
      - id: dom-dispatch-change-event
      - id: dom-dispatch-input-event
      - id: dom-dispatch-submit-event
      - id: dom-dispatch-load-event
      - id: dom-dispatch-error-event
