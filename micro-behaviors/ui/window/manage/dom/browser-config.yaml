defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92

traits:
  # The remote origin of the config is intentionally supplied by composites.
  # This atom only states the observable DOM data flow.
  - id: config-derived-innerhtml-content
    desc: Writes config-derived content into DOM
    if:
      type: text
      regex: 'innerHTML\s*=[\s\S]{0,900}\bconfig\.(bannerText|codePageUrl)'
