# Popunder / opener-focus window management. Kept out of manage/dom to avoid
# overflowing that directory's ML feature bucket. Generic .blur() calls live in
# visibility/; composites here combine open+blur+focus for popunder intent.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9

traits:
  - id: browser-window-open-external-url
    desc: Opens window to external HTTP URL
    conf: 0.92
    if:
      type: text
      regex: '\bwindow\.open\s*\(\s*[''"]https?://'
