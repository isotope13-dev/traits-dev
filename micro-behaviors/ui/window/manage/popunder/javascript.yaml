# Popunder / opener-focus window management. Kept out of manage/dom to avoid
# overflowing that directory's ML feature bucket.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9

traits:
  - id: browser-window-open-external-url
    desc: Opens window to external HTTP URL
    conf: 0.92
    if:
      type: text
      regex: '\bwindow\.open\s*\(\s*[''"]https?://'

  - id: browser-opened-window-blur
    desc: Blurs a previously opened window
    conf: 0.9
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]*\.blur\s*\(\s*\)'
