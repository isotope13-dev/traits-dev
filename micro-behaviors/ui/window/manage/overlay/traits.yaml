defaults:
  platforms: [android]
  for: [apk, zip]
  crit: notable
  conf: 0.86

traits:
  - id: floating-window-layouts
    desc: Android floating overlay layouts
    crit: component
    conf: 0.86
    if:
      type: text
      regex: "res/layout/(block_|tourch_)?floating_window\\.xml"
      offset_range: [-262144, null]

  - id: system-ui-visibility
    desc: Android system UI visibility control
    if:
      type: text
      exact: setSystemUiVisibility

  - id: immersive-system-ui-flags
    desc: Android immersive or nav-hiding UI flags
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "SYSTEM_UI_FLAG_(IMMERSIVE_STICKY|HIDE_NAVIGATION|FULLSCREEN)"

  - id: lock-task-start
    desc: Starts Android lock-task mode
    crit: notable
    conf: 0.9
    for: [apk, zip, java, kotlin]
    if:
      type: text
      exact: startLockTask

  - id: lock-task-package-policy
    desc: Configures Android lock-task packages
    crit: notable
    conf: 0.9
    for: [apk, zip, java, kotlin]
    if:
      type: text
      exact: setLockTaskPackages

  - id: input-method-manager
    desc: Android input method manager
    if:
      type: text
      exact: "Landroid/view/inputmethod/InputMethodManager;"

  - id: toggle-soft-input
    desc: Toggles Android soft input
    if:
      type: text
      exact: toggleSoftInput

  - id: window-manager-reference
    desc: Android WindowManager reference
    crit: component
    conf: 0.88
    if:
      type: text
      exact: "Landroid/view/WindowManager;"

  - id: window-layoutparams-reference
    desc: Android window LayoutParams reference
    crit: component
    conf: 0.88
    if:
      type: text
      exact: "Landroid/view/WindowManager$LayoutParams;"

  - id: manage-overlay-permission-intent
    desc: Requests Android overlay settings
    crit: notable
    conf: 0.9
    attack: T1411
    if:
      type: text
      exact: "android.settings.action.MANAGE_OVERLAY_PERMISSION"

  - id: can-draw-overlays-check
    desc: Checks Android overlay grant
    crit: notable
    conf: 0.9
    attack: T1411
    if:
      type: text
      exact: canDrawOverlays

  # Banker lock-screen overlays commonly expose start/stop/status helpers
  # named *lockoverlay*; pairing with accessibility is handled in objectives.
  - id: lock-overlay-control-helpers
    desc: Android lock-overlay control helpers
    crit: notable
    conf: 0.92
    attack: T1411
    for: [apk, zip, java, kotlin, dex]
    if:
      type: text
      regex: '(?i)(start|stop|status)lockoverlay'

  # Invisible/transparent overlays that still receive touches are used to
  # harvest PIN pad taps without obscuring the victim UI.
  - id: android-overlay-watch-outside-touch-flag
    desc: Android overlay watches outside touches
    crit: notable
    conf: 0.92
    for: [java, kotlin, apk, zip, dex]
    attack: T1411
    if:
      type: text
      word: FLAG_WATCH_OUTSIDE_TOUCH

  - id: android-overlay-not-focusable-flag
    desc: Android overlay not-focusable window flag
    crit: notable
    conf: 0.9
    for: [java, kotlin, apk, zip, dex]
    if:
      type: text
      word: FLAG_NOT_FOCUSABLE

  - id: android-source-touch-listener
    desc: Android source registers OnTouchListener
    crit: notable
    conf: 0.9
    for: [java, kotlin]
    if:
      type: text
      regex: '\bsetOnTouchListener\s*[\({]'

  - id: window-manager-add-view
    desc: Adds Android managed view
    crit: component
    conf: 0.86
    if:
      type: text
      exact: addView

  - id: android-source-overlay-window-type
    desc: Android source application overlay window type
    crit: notable
    conf: 0.92
    for: [java, kotlin]
    if:
      type: text
      regex: 'TYPE_(APPLICATION_OVERLAY|SYSTEM_ALERT|PHONE)'

  - id: android-source-overlay-add-view
    desc: Android source adds an overlay view
    crit: notable
    conf: 0.9
    for: [java, kotlin]
    if:
      type: text
      regex: '\bWindowManager\b[\s\S]{0,260}\.addView\s*\('

  - id: android-source-overlay-grant-check
    desc: Android source checks overlay permission
    crit: notable
    conf: 0.9
    for: [java, kotlin]
    if:
      type: symbol
      kind: call
      exact: canDrawOverlays

  - id: android-source-overlay-grant-check-syntax
    desc: Android source checks overlay permission
    crit: notable
    conf: 0.9
    for: [java, kotlin]
    if:
      type: text
      regex: '\bSettings\s*\.\s*canDrawOverlays\s*\('

  # The regex sees any element `.src =` near a remote URL, not specifically an
  # iframe's — Algolia's autocomplete loader (`"https://alg.li/…"; …
  # n.src=`) creates a *script* element. The overlay composite supplies the
  # iframe context through its own `browser-create-iframe-element` leg.
  - id: remote-url-near-element-src-assignment
    desc: Remote URL near an element src assignment
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'https?://[^/]{3,120}\b[A-Za-z_$][A-Za-z0-9_$]*\.src\s*='

composite_rules:
  - id: kiosk-ui-control
    desc: Android system UI combined with kiosk lock-task controls
    crit: suspicious
    conf: 0.9
    all:
      - id: system-ui-visibility
    any:
      - id: immersive-system-ui-flags
      - id: lock-task-start
      - id: lock-task-package-policy

  - id: runtime-overlay-window
    desc: Android runtime overlay window
    crit: suspicious
    conf: 0.93
    attack: T1411
    all:
      - id: micro-behaviors/os/privilege/manifest::system-alert-window
      - id: manage-overlay-permission-intent
      - id: can-draw-overlays-check
      - id: window-manager-reference
    any:
      - id: window-layoutparams-reference
      - id: window-manager-add-view

  - id: android-source-runtime-overlay-window
    desc: Android source runtime overlay window
    crit: suspicious
    conf: 0.95
    for: [java, kotlin]
    all:
      - id: android-source-overlay-window-type
      - id: android-source-overlay-add-view

  - id: android-transparent-touch-capture-overlay
    desc: Transparent overlay captures outside touches
    crit: suspicious
    conf: 0.96
    for: [java, kotlin]
    attack: T1411,T1056.002
    all:
      - id: android-source-overlay-window-type
      - id: android-source-overlay-add-view
      - id: android-overlay-watch-outside-touch-flag
      - id: android-source-touch-listener
    any:
      - id: android-overlay-not-focusable-flag
      - id: android-source-overlay-grant-check-syntax
      - id: android-source-overlay-grant-check
    needs: 1
