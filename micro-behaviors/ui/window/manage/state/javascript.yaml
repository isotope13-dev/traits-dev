defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9

traits:
  - id: browser-dom-class-state-addition
    desc: Adds active or complete DOM class
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)classList\.add\s*\(\s*["''](active|complete)["'']\s*\)'
    downgrade:
      any:
        - id: metadata/file/format/structured::sourcemap-sources-content
        - id: metadata/lang/scripted::dts-declaration-file

  # A flag written onto the document root, where every script in the page can
  # read it. Sibling of the class-state markers above: same DOM-state write,
  # but on `<html>` rather than a component, and therefore page-global.
  #
  # Extensions use it to publish "I am installed" to the site under them, which
  # is a real feature (skip the install prompt, enable a companion UI) and also
  # the receipt half of a paid-install funnel. Neutral here; the objectives
  # decide which one they are looking at.
  - id: document-root-presence-flag
    desc: Flags a marker on the document root
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'document\.documentElement\.dataset\.[A-Za-z0-9_$]{1,40}\s*='

  - id: document-root-presence-attribute
    desc: Marks the document root with an attribute
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'documentElement\.setAttribute\(\s*["''][a-z-]{1,40}["'']\s*,'
