# HTML insertion capabilities; sibling of neutral HTML structure.
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - html
  - -kotlin
  crit: notable
  conf: 0.82

traits:
- id: browser-innerhtml-assignment
  desc: Writes HTML into the DOM with innerHTML
  conf: 0.8
  for: [javascript]
  if:
    type: tree-sitter
    kind: assignment
    language: javascript
    regex: '\.innerHTML\s*=|\[\s*["'']innerHTML["'']\s*\]\s*='
  unless:
  - id: metadata/lang/source::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/source::linux-kernel-primary-tree-path
  - type: text
    substr: '"sourcesContent":'
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/document/html/
