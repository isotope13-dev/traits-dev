defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: component
traits:
# `classList.add("active")` is the state toggle of every tabbed nav, stepper,
# and progress UI (Zig's own documentation viewer included), so it carries no
# intent on its own; the update-lure composite in
# objectives/command-and-control/dropper/delivery/html/ adds that.
- id: dom-active-class-toggle
  desc: Adds an active or complete DOM class
  crit: baseline
  conf: 0.95
  if:
    type: text
    regex: '(?i)classList\.add\s*\(\s*["''](active|complete)["'']\s*\)'
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
- id: css-display-none
  desc: CSS display none declaration
  conf: 0.9
  if:
    type: text
    regex: \bdisplay\s*:\s*none\b
- id: browser-iframe-hidden-remote
  desc: Hides a dynamically created iframe
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'createElement\(\s*["'']iframe["'']\s*\)[\s\S]{0,260}display\s*:\s*none'
- id: css-opacity-zero
  desc: CSS opacity zero declaration
  conf: 0.9
  if:
    type: text
    regex: \bopacity\s*:\s*0\b
- id: css-visibility-hidden
  desc: CSS visibility hidden declaration
  conf: 0.9
  if:
    type: text
    regex: \bvisibility\s*:\s*hidden\b
- id: css-offscreen-position
  desc: CSS off-screen positioning hides an element
  for: [php, html, javascript, typescript]
  conf: 0.9
  if:
    type: text
    regex: 'position\s*:\s*absolute\s*;\s*(left|top)\s*:\s*-9{3,}(px|em)'
- id: css-fixed-position
  desc: CSS fixed-position declaration
  conf: 0.9
  if:
    type: text
    regex: '\bposition\s*:\s*fixed\b'
- id: browser-style-position-assignment
  desc: Assigns CSS position through DOM style
  conf: 0.9
  if:
    type: text
    substr: style.position
- id: browser-root-pointer-events-assignment
  desc: Assigns pointer-events on a browser root element
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\bdocument\.(body|documentElement)\.style\.pointerEvents\s*='
  # A source map does not make executable JavaScript inert: bundled code can
  # still perform this assignment at runtime. Keep the atom visible so an
  # objective composite can correlate it with other page-sabotage behavior.
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: browser-body-overflow-hidden
  desc: Hides body overflow in the browser
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\bdocument\.body\.style\.overflow\s*=\s*["'']hidden["'']'
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
# "property", not "Sets": each regex covers two different things, and only the
# second is an assignment. `\bheight\s*:` matches a declaration — a CSS rule, a
# TypeScript type, or any object literal with a `height:` key, which is most JS
# ever written; a 243-byte DOM helper that merely *reads* a DOMRect and returns
# `{width: e.width, height: e.height}` was being reported as setting a style.
# The declaration branch is kept because the one composite that consumes these
# (objectives/credential-access/phishing/tactics/web::full-window-iframe-shell)
# needs to see an overlay sized either way, and it supplies the discrimination:
# iframe element + fixed position + cookie mirror, all within 1 KB.
- id: size-prop--height
  desc: CSS or DOM height property
  if:
    type: text
    regex: '\bheight\s*:|\.style\.height\s*='
- id: size-prop--width
  desc: CSS or DOM width property
  if:
    type: text
    regex: '\bwidth\s*:|\.style\.width\s*='
composite_rules:
- id: size-prop
  desc: DOM or CSS size property
  any:
  - id: size-prop--height
  - id: size-prop--width
