# Neutral page-actuation gestures: driving a page's own controls the way a
# person would. Test harnesses, accessibility helpers, form fillers, RPA
# scripts and AI browser copilots all do this, so nothing here infers intent —
# the objective composites supply the targeting (which site, which control,
# who asked for it).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: scroll-into-view-call
    desc: Scrolls a DOM element into view
    # This is deliberately only the scroll operation.  A broad text window
    # cannot prove that a later `.click()` targets the same element or is on
    # the same execution path; composites add a separate click atom when the
    # surrounding context supports an automation interpretation.
    if:
      type: symbol
      kind: member
      regex: '\.scrollIntoView$'
