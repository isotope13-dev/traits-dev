defaults:
  platforms: [windows]
  for: [oledoc]
  crit: notable
  conf: 0.86

traits:
  # OleDoc leaves extracted-string index empty (strings=0), so type:text
  # never sees VBA API names. type:raw is rejected for plain ASCII by
  # policy; hex matches the same run in the compound-file bytes.
  - id: vba-appactivate
    desc: VBA activates a window by title
    if:
      type: hex
      pattern: "41 70 70 41 63 74 69 76 61 74 65"

  # These are neutral Office object-model capabilities.  The hostile
  # interpretation belongs in an objective composite that also sees an
  # auto-open macro and a remote macro-enabled document target.
  - id: vba-commandbar-reference
    desc: VBA accesses the Office CommandBars collection
    crit: component
    conf: 0.9
    if:
      type: raw
      regex: '(?i)CommandBars'

  - id: vba-commandbar-controls
    desc: VBA references a controls collection
    crit: component
    conf: 0.9
    if:
      type: raw
      regex: '(?i)Controls'

  - id: vba-commandbar-onaction
    desc: VBA references the Office OnAction member
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "4F 6E 41 63 74 69 6F 6E"

  - id: vba-commandbar-execute
    desc: VBA references standalone Execute member
    crit: notable
    conf: 0.92
    if:
      # Do not match the ExecuteExcel4Macro identifier.  That is a separate
      # Excel 4 evaluator capability, not a CommandBar action; the exact
      # standalone token is the evidence needed by the remote-macro composite.
      type: raw
      regex: '(?i)\bExecute\b'

  - id: vba-office-macro-action-target
    desc: CommandBar action targets a macro document
    crit: notable
    conf: 0.95
    if:
      type: raw
      regex: '(?i)\.(docm|dotm|xlsm|xltm|pptm|potm)!'
