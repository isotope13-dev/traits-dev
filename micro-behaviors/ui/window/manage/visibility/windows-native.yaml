# Native full-screen overlay construction. A topmost popup sized from the
# desktop bounds is the language-independent Win32 equivalent of framework
# fullscreen/topmost settings.
defaults:
  platforms: [windows]
  for: [source]

traits:
  - id: desktop-client-rectangle-query
    desc: Queries the desktop client rectangle
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bGetClientRect\s*\(\s*GetDesktopWindow\s*\(\s*\)\s*,'

  - id: topmost-popup-window-style
    desc: Combines topmost and popup window styles
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?is)\bWS_EX_TOPMOST\b.{0,400}\bWS_POPUP\b|\bWS_POPUP\b.{0,400}\bWS_EX_TOPMOST\b'

composite_rules:
  - id: native-fullscreen-topmost-overlay
    desc: Native desktop-sized topmost popup overlay
    crit: notable
    conf: 0.96
    all:
      - id: desktop-client-rectangle-query
      - id: topmost-popup-window-style
