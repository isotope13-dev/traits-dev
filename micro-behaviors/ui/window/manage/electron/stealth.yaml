# Electron BrowserWindow options used to keep a process invisible while it
# waits to replace a legitimate desktop app. Individually these are UI
# capabilities; intent is supplied by wallet-replacement / seed-exfil composites.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92
  attack: T1564.003

traits:
  - id: electron-browserwindow-constructor
    desc: Creates an Electron BrowserWindow
    if:
      type: text
      regex: '\bnew\s+BrowserWindow\s*\('

  - id: electron-skip-taskbar
    desc: Electron window skips the taskbar
    if:
      type: text
      regex: '\bskipTaskbar\s*:\s*true\b'

  - id: electron-zero-opacity-window
    desc: Electron BrowserWindow opacity set to zero
    crit: component
    if:
      type: text
      regex: 'BrowserWindow\s*\([^)]{0,400}?\bopacity\s*:\s*0(\s*[,}]|$)'

  - id: electron-one-pixel-window
    desc: Electron BrowserWindow sized to one pixel
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'BrowserWindow\s*\([^)]{0,600}?(width|height)\s*:\s*1\b'

composite_rules:
  - id: electron-stealth-browserwindow
    desc: Electron stealth transparent taskbar-hidden window
    crit: suspicious
    conf: 0.96
    all:
      - id: electron-browserwindow-constructor
      - id: electron-skip-taskbar
      - id: electron-zero-opacity-window
    any:
      - id: electron-one-pixel-window
      - id: micro-behaviors/ui/window/manage/style::css-opacity-zero
    needs: 1
