# CSS selector tokens that name advertising or tracking page elements, plus the
# query-and-detach shape that content blockers use. Selector text only - the
# tokens must look like selectors, not like camelCase JS property paths
# (`.positionTracking`, `.nodeLocationTracking`), which is why the tracking
# pattern is case-sensitive and anchored to a selector boundary.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: component
  conf: 0.8

traits:
  - id: ad-selector-token
    desc: Ad-related CSS selector token
    if:
      type: literal
      regex: '(?i)[#.]ads?([-_][a-z0-9_-]+)?([ .#:\[\],>+~]|$)|advertisement|adsbygoogle'

  - id: tracking-selector-token
    desc: Tracking CSS selector token
    if:
      type: literal
      regex: '(^|[\s,>+~])[#.][a-z0-9_-]*tracking[a-z0-9_-]*|\[[a-z-]{0,24}tracking'

composite_rules:
  - id: ad-tracker-removal-selectors
    desc: Ad and tracker removal selector list
    crit: component
    conf: 0.9
    all:
      - id: browser-queryselectorall-call
      - id: micro-behaviors/ui/window/manage/dom::browser-node-remove
    any:
      - id: ad-selector-token
      - id: tracking-selector-token
