defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, -kotlin]
  crit: notable
traits:
  - id: browser-queryselectorall-call
    desc: Queries multiple DOM elements
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      regex: '(^|\.)querySelectorAll$'
  - id: browser-create-tree-walker
    desc: Traverses DOM nodes with TreeWalker
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)createTreeWalker$'
  - id: browser-show-text-node-filter
    desc: Selects browser DOM text nodes
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: member
      exact: NodeFilter.SHOW_TEXT
  - id: browser-text-content-assignment
    desc: Assigns text on a DOM traversal node
    crit: notable
    conf: 0.9
    if:
      type: text
      # The text-node rewrite composite needs an assignment to the node
      # yielded by TreeWalker.  A popup's resultDiv.textContent assignment is
      # ordinary UI rendering and must not be treated as rewriting page text.
      regex: '\b(node|textNode|text_node|currentNode)\.(nodeValue|textContent|innerText)\s*='
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/lang/scripted::dts-declaration-file
  - id: dom-template-text-assignment
    desc: Assigns template literal to node text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]{0,31}\.textContent\s*=\s*`'
  - id: domparser-parse-html
    desc: Parses HTML with DOMParser
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: 'parseFromString\([^)]{0,80}text/html'
  - id: domparser-constructor
    desc: Constructs a DOMParser
    crit: notable
    conf: 0.76
    if:
      type: symbol
      exact: DOMParser
    unless:
      - type: text
        substr: text/xml
  - id: domparser-parse-from-string
    desc: Calls DOMParser parseFromString
    crit: notable
    conf: 0.76
    if:
      type: symbol
      exact: parseFromString
    unless:
      - type: text
        substr: text/xml
  # Reads the URL of the currently executing script, including optional
  # chaining (`document.currentScript?.src`). Loaders use this for base-path
  # discovery; collectors use it to recover query-string payloads.
  - id: current-script-src-read
    desc: Reads document.currentScript src URL
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'document\.currentScript(\?\.|\.)src'
  # Collectors recover a query payload from the tag that loaded them:
  # `document.currentScript.src.split('?')`.
  - id: current-script-src-query-split
    desc: Splits currentScript src on query
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'currentScript(\?\.|\.)src(\?\.|\.)split\s*\(\s*[''"]\?[''"]'
  - id: template-queryselector
    desc: Template expression queries DOM element
    crit: notable
    conf: 0.85
    count_min: 6
    if:
      type: text
      regex: \$\{[^}]{0,160}querySelector
  - id: template-getattribute
    desc: Template expression reads DOM attributes
    crit: notable
    conf: 0.85
    count_min: 2
    if:
      type: text
      regex: \$\{[^}]{0,160}getAttribute
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: template-textcontent
    desc: Template expression reads node text
    crit: notable
    conf: 0.85
    count_min: 4
    if:
      type: text
      regex: \$\{[^}]{0,160}textContent
  - id: template-htmlcontent-read
    desc: Template literal reads node HTML
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: \$\{[^}]{0,160}(innerHTML|outerHTML)
  - id: extension-active-page-html-read
    desc: Reads active tab document HTML
    conf: 0.94
    ref: sha256:da7012fa6e7ae7403af3635e14bd7f7bf1d43f985fbc83aaead59095ce4b96db
    if:
        type: text
        regex: 'chrome\.scripting\.executeScript\s*\([\s\S]{0,520}document\.documentElement\.outerHTML'
  - id: browser-enumerates-page-images
    desc: Enumerates page image elements
    conf: 0.9
    ref: sha256:4fcdbf8912196b7e1541615dc3c51b0715aa125d1a223387055231551d255e70
    if:
      type: symbol
      kind: call
      exact: document.querySelectorAll
      arg:
        kind: string
        regex: '^img$'
  - id: browser-selects-anchor-hrefs
    desc: Selects page anchor elements by href
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: document.querySelectorAll
      arg:
        kind: string
        exact: a[href]
  - id: dom-text-content-read
    desc: Reads DOM text content
    crit: notable
    conf: 0.82
    ref: sha256:3b744d89517c857b4c07fa0068aca8d2b1d688731bfd032bf98c1018bd027e64
    if:
      type: text
      regex: '\.(textContent|innerHTML)\b'
    unless:
    - id: metadata/file/format/structured::sourcemap-sources-content
    - id: metadata/lang/scripted::dts-declaration-file
  - id: dom-xpath-evaluate-call
    desc: Evaluates DOM XPath selector
    crit: notable
    conf: 0.86
    ref: sha256:3b744d89517c857b4c07fa0068aca8d2b1d688731bfd032bf98c1018bd027e64
    if:
      type: text
      regex: 'document\.evaluate\s*\([^)]{0,180}XPathResult\.FIRST_ORDERED_NODE_TYPE'
    unless:
    - id: metadata/file/format/structured::sourcemap-sources-content
    - id: metadata/lang/scripted::dts-declaration-file
    # NOTE: the `.value` read that used to live here matched every JavaScript
    # `.value` property access, not just DOM form fields, so it now lives at
    # micro-behaviors/data/source/property/read::js-value-property-read.
    # Composites that want the DOM meaning combine it with a lookup leg below.
  - id: dom-element-lookup--getelementbyid
    desc: Looks up a DOM element with getElementById
    crit: baseline
    conf: 0.9
    if:
      type: text
      word: getElementById
  - id: dom-element-lookup--queryselector
    desc: Looks up a DOM element with querySelector
    crit: baseline
    conf: 0.9
    if:
      type: text
      word: querySelector
composite_rules:
  - id: browser-dom-text-node-rewrite
    desc: Rewrites DOM text while walking text nodes
    crit: notable
    conf: 0.97
    # Minified handlers can place the walker and its assignment a few
    # kilobytes apart while remaining inside one compact injected routine.
    near_bytes: 4096
    all:
      - id: browser-create-tree-walker
      - id: browser-show-text-node-filter
      - id: browser-text-content-assignment
  - id: template-dom-access-cluster
    desc: Multiple DOM reads inside template expressions
    crit: notable
    conf: 0.9
    needs: 3
    any:
    - id: template-queryselector
    - id: template-getattribute
    - id: template-textcontent
    - id: template-htmlcontent-read
