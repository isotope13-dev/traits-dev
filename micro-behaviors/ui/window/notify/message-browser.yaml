defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: component
  conf: 0.84

traits:
  - id: password-incorrect-feedback
    crit: notable
    desc: Password feedback says the value is incorrect
    if:
      type: text
      regex: '(?i)\bpassword\b[^"'';{}\n]{0,80}\bincorrect\b|\bincorrect\b[^"'';{}\n]{0,80}\bpassword\b'

  - id: password-try-again-feedback
    crit: notable
    desc: Password feedback requests another attempt
    if:
      type: text
      regex: '(?i)\bpassword\b[^"'';{}\n]{0,80}\btry again\b|\btry again\b[^"'';{}\n]{0,80}\bpassword\b'

  - id: password-invalid-feedback
    crit: notable
    desc: Password feedback says the value is invalid
    if:
      type: text
      regex: '(?i)\bpassword\b[^"'';{}\n]{0,80}\binvalid\b|\binvalid\b[^"'';{}\n]{0,80}\bpassword\b'

  - id: password-verify-feedback
    crit: notable
    desc: Password feedback requests verification
    if:
      type: text
      regex: '(?i)\bpassword\b[^"'';{}\n]{0,80}\bverify\b|\bverify\b[^"'';{}\n]{0,80}\bpassword\b'

  - id: alert-document-domain-argument
    crit: notable
    desc: Browser alert displays document.domain
    conf: 0.95
    if:
      type: tree-sitter
      kind: call
      regex: '^(window\.)?alert\s*\(\s*document\.domain\s*\)$'

  # The probe carried as inert string data (quoted, or inside a template
  # substitution that only yields the string): escaping test fixtures
  # keep it in exactly this form to prove it does not execute.
  - id: alert-document-domain-probe-string
    crit: notable
    desc: alert(document.domain) probe in a string
    conf: 0.9
    if:
      type: text
      regex: '["''\x60]\$\{alert\(document\.domain\)\}["''\x60]'

  # A decoded string fragment whose whole content is the substitution
  # form was inert escaped data in its source string, not a template.
  - id: alert-document-domain-probe-decoded
    crit: notable
    desc: Decoded probe substitution string content
    conf: 0.9
    if:
      type: text
      regex: '^\$\{alert\(document\.domain\)\}\s*$'

  # An accessible status announcement (`role="status"` / `aria-live`): the
  # page tells the user, and their screen reader, that something changed.
  - id: aria-live-status-region
    crit: baseline
    desc: Creates an ARIA live status announcement
    if:
      type: text
      regex: 'setAttribute\(\s*["'']aria-live["'']\s*,\s*["''](polite|assertive)["'']'

composite_rules:
  - id: password-retry-feedback
    desc: Password validation or retry feedback
    crit: component
    conf: 0.84
    any:
      - id: password-incorrect-feedback
      - id: password-try-again-feedback
      - id: password-invalid-feedback
      - id: password-verify-feedback
