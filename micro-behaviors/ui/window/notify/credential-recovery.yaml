defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  conf: 1.0
traits:
  - id: credential-recovery-failure-wording
    crit: notable
    desc: Account or credential recovery failure wording
    if:
      type: text
      regex: (password|account|credential).{0,80}cannot.{0,30}recover
      case_insensitive: true
