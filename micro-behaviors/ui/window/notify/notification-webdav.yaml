# A literal popup Address is configuration, not proof of rendering or NTLM.
# Preserve the record-boundary and remote-host checks for neutral triage.
defaults:
  for: [text, python, powershell, cpp]
  platforms: [windows]
traits:
  - id: notification-popup-webdav-address
    desc: Popup configuration references remote WebDAV
    crit: notable
    conf: 0.95
    if: &popup_webdav
      type: yara
      source: |
        rule notification_popup_webdav_address {
          meta:
            filetypes = "text,python,powershell,cpp,csharp,go,ruby,javascript"
          strings:
            $popup = /(^|\n)[ \t]*\[PopWindow[0-9]+\][^\[]{0,2048}/ nocase
            $address = /\n[ \t]*Address[ \t]*=[ \t]*["']?(file:\/\/[a-zA-Z0-9][a-zA-Z0-9.@_-]{0,252}\/DavWWWRoot\/|\\\\[a-zA-Z0-9][a-zA-Z0-9.@_-]{0,252}\\DavWWWRoot\\)[^\r\n"' \t]+/ nocase
            $local = /\n[ \t]*Address[ \t]*=[ \t]*["']?(file:\/\/|\\\\)(localhost\.?|127\.[0-9.]+|0\.0\.0\.0)(@[a-zA-Z0-9]+){0,2}[\/\\]/ nocase
          condition:
            for any p in (1..#popup) : (
              for any a in (1..#address) : (
                not for any l in (1..#local) : (@local[l] == @address[a]) and
                @address[a] >= @popup[p] and
                @address[a] + !address[a] <= @popup[p] + !popup[p]
              )
            )
        }

  # Disjoint source scope shares the matcher above. Inline YARA traits admit
  # at most four file types; do not fork the record-boundary/path logic.
  - id: notification-popup-webdav-address-source
    desc: Source embeds WebDAV popup configuration
    for: [csharp, go, ruby, javascript]
    crit: notable
    conf: 0.95
    if: *popup_webdav
