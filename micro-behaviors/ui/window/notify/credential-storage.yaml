defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: credential-storage-notification
    desc: UI notification reports credential storage
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)showInformationMessage$'
      arg:
        index: 0
        kind: string
        regex: '(?i)(api.?key|credential|token).{0,24}(sav|stor)'
