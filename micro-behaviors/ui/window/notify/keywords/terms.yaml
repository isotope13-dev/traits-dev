---
defaults:
  platforms:
  - windows
  - unix
  crit: component
  conf: 0.2
  for:
  - binaries
  - scripts
  - source
traits:
- id: notification-alert-word
  desc: UI toast or popup notification term
  crit: component
  conf: 0.9
  if:
    type: text
    regex: "(?i)\\b(toast|popup|notifyUser)\\b|通知"
  unless:
    - id: well-known/lib/cloud/aws-sdk-ruby::namespace
- id: notification-config-word
  desc: UI notification dispatch API marker
  crit: component
  conf: 0.86
  if:
    type: text
    regex: "(?i)\\bnotify(User|Desktop|Toast)\\b|推送"
- id: login-notification-phrase
  desc: Login notification UI phrase
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: Login Notification
