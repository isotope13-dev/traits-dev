defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: component
  conf: 0.84

traits:
  - id: password-incorrect-feedback
    desc: Password feedback says the value is incorrect
    if:
      type: text
      regex: '(?i)\bpassword\b.{0,120}\bincorrect\b|\bincorrect\b.{0,120}\bpassword\b'

  - id: password-try-again-feedback
    desc: Password feedback requests another attempt
    if:
      type: text
      regex: '(?i)\bpassword\b.{0,120}\btry again\b|\btry again\b.{0,120}\bpassword\b'

  - id: password-invalid-feedback
    desc: Password feedback says the value is invalid
    if:
      type: text
      regex: '(?i)\bpassword\b.{0,120}\binvalid\b|\binvalid\b.{0,120}\bpassword\b'

  - id: password-verify-feedback
    desc: Password feedback requests verification
    if:
      type: text
      regex: '(?i)\bpassword\b.{0,120}\bverify\b|\bverify\b.{0,120}\bpassword\b'

composite_rules:
  - id: password-retry-feedback
    desc: Password validation or retry feedback
    crit: component
    conf: 0.84
    any:
      - id: password-incorrect-feedback
      - id: password-try-again-feedback
      - id: password-invalid-feedback
      - id: password-verify-feedback
