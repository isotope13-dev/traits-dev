# HTML email bodies used as phishing or bulk-mail templates.
# An e-mail body is a few KB. The brand and pretext matchers are Unicode-aware
# case-insensitive scans, and over 1.7 MB cspell trie dictionaries (typed text)
# the E*TRADE and Citibank ones each ran 90-240 s and were reported as analysis
# bombs, so the whole file is bounded.
defaults:
  platforms: [unix, windows]
  for: [html, text, markdown, makefile]
  size_max: 1048576

traits:
  - id: limited-access-to-account-pretext
    desc: Claims access to the account was limited
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(have|has)\s+\w{0,14}\s*limited\s+access\s+to[\s\S]{0,40}account'
      exclude_html_comments: true
