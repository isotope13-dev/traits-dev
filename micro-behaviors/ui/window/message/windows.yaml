defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: send-message
    desc: Send message to window
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: SendMessageW
  - id: send-message-a
    desc: Send message to window (ANSI)
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: SendMessageA
  - id: send-message-timeout
    desc: Send message with timeout
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: SendMessageTimeoutW
  - id: dispatch-message
    desc: Dispatch window message
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: DispatchMessageW
  - id: call-window-proc
    desc: Call window procedure
    crit: baseline
    conf: 0.88
    attack: T1106
    if:
      type: text
      regex: ^CallWindowProc[AW]$
  - id: def-window-proc
    desc: Default window procedure
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: DefWindowProcW
  - id: post-quit-message
    desc: Post quit message
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: PostQuitMessage
  - id: get-message-pos
    desc: Get message cursor position
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: GetMessagePos
  - id: get-message-time
    desc: Read the current Windows message time
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: GetMessageTime
  - id: set-timer
    desc: Create window timer
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: SetTimer
  - id: kill-timer
    desc: Destroy window timer
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: KillTimer
