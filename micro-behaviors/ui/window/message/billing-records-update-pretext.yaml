# HTML email bodies used as phishing or bulk-mail templates.
# An e-mail body is a few KB. The brand and pretext matchers are Unicode-aware
# case-insensitive scans, and over 1.7 MB cspell trie dictionaries (typed text)
# the E*TRADE and Citibank ones each ran 90-240 s and were reported as analysis
# bombs, so the whole file is bounded.
defaults:
  platforms: [unix, windows]
  for: [html, text, markdown, makefile]
  size_max: 1048576

traits:
  - id: billing-records-update-pretext
    desc: Urges billing records update
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'billing\s+(information\s+)?records?\b'
      case_insensitive: true
      exclude_html_comments: true

  # Account-termination deadline threat ("will result in account
  # termination"). Genuine service notices threaten termination too, so this
  # stays notable; composites pair it with link deception or brand context.
