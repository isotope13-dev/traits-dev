# HTML email bodies used as phishing or bulk-mail templates.
# An e-mail body is a few KB. The brand and pretext matchers are Unicode-aware
# case-insensitive scans, and over 1.7 MB cspell trie dictionaries (typed text)
# the E*TRADE and Citibank ones each ran 90-240 s and were reported as analysis
# bombs, so the whole file is bounded.
defaults:
  platforms: [unix, windows]
  for: [html, text, markdown, makefile]
  size_max: 1048576

traits:
  - id: account-agreement-update-pretext
    desc: Claims account needs agreement reconfirmation
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)not\s+been\s+updated\s+to\s+the\s+latest[^<]{0,100}(agreement|terms)'
      exclude_html_comments: true

  # New-terms pretext ("our new Terms & Conditions"): the consent lure that
  # rides with agreement-update phish copy. Real notices use the phrase too,
  # so this stays notable; composites add the brand or deceptive link.
