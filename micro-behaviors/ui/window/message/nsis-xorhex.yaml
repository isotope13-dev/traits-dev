# Decode a repeated 32-bit XOR key from the first command word. Compare
# subsequent hex nibbles against the same key; no campaign key is pinned.
defaults:
  platforms: [windows]
  for: [data, text]
  crit: notable
traits:
  - id: xorhex-nsis-callwindowproc
    desc: XOR-hex NSIS CallWindowProcW command
    conf: 0.99
    if:
      type: yara
      source: |
        rule xorhex_nsis_callwindowproc {
          strings:
            $hex = /[0-9A-F]{128,}/
          condition:
            for any r in (1..#hex) : (
              for any a in (@hex[r]..@hex[r]+!hex[r]-48) : (
                (uint32(a) != 0x33373537 or uint32(a+4) != 0x32373536) and
                for all i in (0..7) : (
                          (((uint8(a+i) & 15) + 9 * (uint8(a+i) >> 6)) ^ ((uint8(a+8+i) & 15) + 9 * (uint8(a+8+i) >> 6))) == ((0x46415F48 >> ((7-i)*4)) & 15)
                        ) and
                for all i in (0..7) : (
                          (((uint8(a+i) & 15) + 9 * (uint8(a+i) >> 6)) ^ ((uint8(a+16+i) & 15) + 9 * (uint8(a+16+i) >> 6))) == ((0x3612091E >> ((7-i)*4)) & 15)
                        ) and
                for all i in (0..7) : (
                          (((uint8(a+i) & 15) + 9 * (uint8(a+i) >> 6)) ^ ((uint8(a+24+i) & 15) + 9 * (uint8(a+24+i) >> 6))) == ((0x221A0B16 >> ((7-i)*4)) & 15)
                        ) and
                for all i in (0..7) : (
                          (((uint8(a+i) & 15) + 9 * (uint8(a+i) >> 6)) ^ ((uint8(a+32+i) & 15) + 9 * (uint8(a+32+i) >> 6))) == ((0x1A043500 >> ((7-i)*4)) & 15)
                        ) and
                for all i in (0..7) : (
                          (((uint8(a+i) & 15) + 9 * (uint8(a+i) >> 6)) ^ ((uint8(a+40+i) & 15) + 9 * (uint8(a+40+i) >> 6))) == ((0x1A10325A >> ((7-i)*4)) & 15)
                        )
              )
            )
        }
