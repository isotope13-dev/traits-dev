# HTML email bodies used as phishing or bulk-mail templates.
# An e-mail body is a few KB. The brand and pretext matchers are Unicode-aware
# case-insensitive scans, and over 1.7 MB cspell trie dictionaries (typed text)
# the E*TRADE and Citibank ones each ran 90-240 s and were reported as analysis
# bombs, so the whole file is bounded.
defaults:
  platforms: [unix, windows]
  for: [html, text, markdown, makefile]
  size_max: 1048576

traits:
  - id: suspended-account-pretext
    desc: Claims account or activity was suspended
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bsuspended\s+(activity\s+on\s+|access\s+to\s+)?(your|this)\s+account\b'
      exclude_html_comments: true
  # Suspension-by-verb variant ("suspend access to your account"): the scare
  # names the threatened action instead of the resulting state. Same
  # notable-only standing; composites pair it with brand and link context.
