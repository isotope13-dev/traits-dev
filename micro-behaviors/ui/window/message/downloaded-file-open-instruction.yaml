# Page text telling the reader the "actual" file is in their downloads and to
# open it there: the visible page is a stand-in for a document that arrives
# by a separate download.
traits:
  - id: downloaded-file-open-instruction
    desc: Page says to open the downloaded file
    platforms: [windows, unix]
    for: [html]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)check (your |the )?downloads? folder to (view|open|see)'
