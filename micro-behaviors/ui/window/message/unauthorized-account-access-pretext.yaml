# HTML email bodies used as phishing or bulk-mail templates.
# An e-mail body is a few KB. The brand and pretext matchers are Unicode-aware
# case-insensitive scans, and over 1.7 MB cspell trie dictionaries (typed text)
# the E*TRADE and Citibank ones each ran 90-240 s and were reported as analysis
# bombs, so the whole file is bounded.
defaults:
  platforms: [unix, windows]
  for: [html, text, markdown, makefile]
  size_max: 1048576

traits:
  - id: unauthorized-account-access-pretext
    desc: Claims account accessed by unauthorized party
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)account.{0,60}(accessed|compromised) by\s+(an?\s+)?(unauthorized|outside|third)\s+\w+'
      exclude_html_comments: true
  # Kits misspell the article ("accessed by and unauthorized") and break the
  # phrase across a line. The spaced form above does not cover that typo.
