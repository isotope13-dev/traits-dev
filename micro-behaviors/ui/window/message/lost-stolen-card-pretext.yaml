# HTML email bodies used as phishing or bulk-mail templates.
# An e-mail body is a few KB. The brand and pretext matchers are Unicode-aware
# case-insensitive scans, and over 1.7 MB cspell trie dictionaries (typed text)
# the E*TRADE and Citibank ones each ran 90-240 s and were reported as analysis
# bombs, so the whole file is bounded.
defaults:
  platforms: [unix, windows]
  for: [html, text, markdown, makefile]
  size_max: 1048576

traits:
  - id: lost-stolen-card-pretext
    desc: Reports card lost or stolen
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\breported as lost or stolen\b|\bcard\b[^.<]{0,40}\blost or stolen\b'
      exclude_html_comments: true

  # Impersonal "Dear <brand> user" salutation. Legitimate banks personalize;
  # phish kits use the generic form. Bulk mail does too, so this stays notable
  # until a composite pairs it with scare copy.
