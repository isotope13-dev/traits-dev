# HTML email bodies used as phishing or bulk-mail templates.
# An e-mail body is a few KB. The brand and pretext matchers are Unicode-aware
# case-insensitive scans, and over 1.7 MB cspell trie dictionaries (typed text)
# the E*TRADE and Citibank ones each ran 90-240 s and were reported as analysis
# bombs, so the whole file is bounded.
defaults:
  platforms: [unix, windows]
  for: [html, text, markdown, makefile]
  size_max: 1048576

traits:
  - id: certificate-wording-reference
    desc: Certificate type or update-center wording
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(electronic|digital|security)\s+certificate|certificate\s+update\s+center'
      exclude_html_comments: true

  # Billing-records update pretext ("Billing Information records are out of
  # date", "update your billing records"): the record-update lure of payment
  # and bank confirmation phishes. Genuine billing notices use the same
  # phrases, so this stays notable; composites pair it with link deception.
