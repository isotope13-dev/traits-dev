# HTML email bodies used as phishing or bulk-mail templates.
# An e-mail body is a few KB. The brand and pretext matchers are Unicode-aware
# case-insensitive scans, and over 1.7 MB cspell trie dictionaries (typed text)
# the E*TRADE and Citibank ones each ran 90-240 s and were reported as analysis
# bombs, so the whole file is bounded.
defaults:
  platforms: [unix, windows]
  for: [html, text, markdown, makefile]
  size_max: 1048576

traits:
  - id: unauthorized-access-across-break
    desc: Claims unauthorized access across a break
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)account[\s\S]{0,100}accessed by an?\s*[\r\n][ \t\r\n]{0,80}unauthorized\s+third party'
      exclude_html_comments: true

  # An email that tells a customer to use an SSN as both login ID and password
  # makes a specific credential request; the phishing objective pairs this
  # copy with the bank identity, account scare, and link structure.
