# Microsoft Entra sign-in field names are provider-specific UI observations.
# A first-party Entra page and a browser automation workflow can contain these
# same fields, so the fields themselves are neutral. Phishing composites add
# the off-origin collection and post-auth navigation that infer hostile intent.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9
traits:
  - id: entra-loginfmt-field-reference
    desc: References the Entra loginfmt account field
    if:
      type: text
      regex: '(?i)(\bname\s*=\s*["'']?loginfmt\b|\[\s*["'']loginfmt["'']\s*\])'
composite_rules:
  - id: entra-signin-field-set
    desc: Contains Entra account password and code fields
    conf: 0.94
    needs: 3
    any:
      - id: entra-loginfmt-field-reference
      - id: micro-behaviors/ui/window/otp-field::entra-otc-field-reference
      - id: micro-behaviors/ui/window/password-field::entra-passwd-field-reference
