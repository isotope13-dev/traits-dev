# Email and Google sign-in identifier properties in JS/TS UI components.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.88

traits:
  - id: js-email-input-type-prop
    desc: JS object declares email input type
    if:
      type: text
      regex: '\btype\s*:\s*["'']email["'']'

  - id: google-identifier-id-prop
    desc: JS object sets identifierId element ID
    conf: 0.92
    if:
      type: text
      regex: '\bid\s*:\s*["'']identifierId["'']'
