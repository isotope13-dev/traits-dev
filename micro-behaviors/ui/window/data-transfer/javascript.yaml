defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]

traits:
  - id: browser-data-transfer-text-read
    desc: Reads text from browser data transfer
    # `DataTransfer.getData("text")` occurs in both paste and drag-and-drop
    # handlers. Keep this neutral atom a component; clipboard composites add
    # the nearby paste-event context before presenting a stronger capability.
    crit: component
    conf: 0.84
    if:
      type: text
      regex: "\\.getData\\s*\\(\\s*['\"]text(/plain)?['\"]\\s*\\)"
