# Electron BrowserWindow options used to keep a process invisible while it
# waits to replace a legitimate desktop app. Individually these are UI
# capabilities; intent is supplied by wallet-replacement / seed-exfil composites.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92
  attack: T1564.003

traits:
  - id: electron-browserwindow-constructor
    desc: Creates an Electron BrowserWindow
    if:
      type: symbol
      kind: call
      exact: BrowserWindow

  - id: electron-skip-taskbar
    desc: Electron window skips the taskbar
    if:
      type: text
      regex: '\bskipTaskbar\s*:\s*true\b'

  - id: electron-zero-opacity-window
    desc: Electron BrowserWindow opacity set to zero
    crit: notable
    if:
      type: text
      regex: 'BrowserWindow\s*\([^)]{0,400}?\bopacity\s*:\s*0(\s*[,}]|$)'

  - id: electron-one-pixel-window
    desc: Electron BrowserWindow sized to one pixel
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'BrowserWindow\s*\([^)]{0,600}?(width|height)\s*:\s*1\b'

  # Replacing the prototype methods with empty functions disables every
  # future show/focus/center call, so the process keeps running without any
  # visible window. Each atom is a single method; the composite requires the
  # visibility-suppressing trio.
  - id: electron-show-prototype-stub
    desc: Stubs BrowserWindow.prototype.show
    conf: 0.95
    if:
      type: text
      regex: 'BrowserWindow\.prototype\.show\s*=\s*function\s*\(\s*\)\s*\{\s*\}'

  - id: electron-focus-prototype-stub
    desc: Stubs BrowserWindow.prototype.focus
    conf: 0.95
    if:
      type: text
      regex: 'BrowserWindow\.prototype\.focus\s*=\s*function\s*\(\s*\)\s*\{\s*\}'

  - id: electron-center-prototype-stub
    desc: Stubs BrowserWindow.prototype.center
    conf: 0.95
    if:
      type: text
      regex: 'BrowserWindow\.prototype\.center\s*=\s*function\s*\(\s*\)\s*\{\s*\}'

composite_rules:
  - id: electron-stealth-browserwindow
    desc: Electron stealth transparent taskbar-hidden window
    crit: suspicious
    conf: 0.96
    all:
      - id: electron-browserwindow-constructor
      - id: electron-skip-taskbar
      - id: electron-zero-opacity-window
    any:
      - id: electron-one-pixel-window
      - id: micro-behaviors/ui/window/style::css-opacity-zero
    needs: 1

  - id: electron-visibility-prototype-suppressed
    desc: Stubs BrowserWindow show, focus and center
    crit: suspicious
    conf: 0.96
    all:
      - id: electron-show-prototype-stub
      - id: electron-focus-prototype-stub
      - id: electron-center-prototype-stub
