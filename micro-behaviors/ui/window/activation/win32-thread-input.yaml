# Bypassing Windows foreground-activation restrictions by attaching the calling
# thread's input queue to the current foreground window thread before calling
# `SetForegroundWindow`.
defaults:
  platforms: [windows]
  crit: notable

traits:
  - id: win32-attach-thread-input
    desc: Calls Win32 AttachThreadInput API
    conf: 0.92
    for: [csharp, c, cpp, python, rust, go]
    if:
      type: symbol
      kind: call
      regex: '(^|\.|::)AttachThreadInput$'

  - id: win32-attach-thread-input-ps
    desc: PowerShell invokes AttachThreadInput member
    conf: 0.92
    for: [powershell]
    if:
      type: symbol
      kind: identifier
      exact: AttachThreadInput

  - id: win32-set-foreground-window-ps
    desc: PowerShell invokes SetForegroundWindow member
    conf: 0.9
    for: [powershell]
    if:
      type: symbol
      kind: identifier
      exact: SetForegroundWindow

composite_rules:
  - id: win32-thread-input-foreground-activation
    desc: Forces window foreground via AttachThreadInput
    conf: 0.95
    for: [csharp, c, cpp, python, rust, go]
    all:
      - id: win32-attach-thread-input
      - id: set-foreground-window-source

  - id: powershell-thread-input-foreground-activation
    desc: PowerShell forces foreground via AttachThreadInput
    conf: 0.95
    for: [powershell]
    all:
      - id: win32-attach-thread-input-ps
      - id: win32-set-foreground-window-ps
