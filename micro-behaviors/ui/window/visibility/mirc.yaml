# mIRC client window visibility control.
#
# `showmirc -t` drops the client into the system tray and `-n` minimizes it,
# so the chat session runs with no window and no taskbar button. Bots arm it
# from their start handler so the victim never sees the client autostarted
# at login.
defaults:
  platforms: [windows]
  for: [mirc]
traits:
  - id: mirc-hide-client-window
    desc: mIRC hides its client window
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bshowmirc\s+-[a-z]*t\b'

  - id: mirc-dll-hide-call
    for: [mirc, lua, text, data]
    desc: mIRC hides client through helper DLL
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(\$dll\(\s*\w+\.dll\s*,\s*HideMirc\b|\bdll\s+\w+\.dll\s+HideMirc\s+on\b)'

  - id: mirc-dll-hidewindow-reference
    for: [mirc, lua, text, data]
    desc: mIRC calls DLL function named HideWindow
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\$dll\([^,\r\n]{1,80},\s*HideWindow\b'

  - id: mirc-config-perform-hide-channel
    for: [text]
    desc: mIRC perform list declares channel hiding
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\[perform\][^\[]{0,200}/window[ \t]+-h[ \t]+#[^\s]{1,80}'

  - id: mirc-config-click-exit-hooks
    for: [text, mirc]
    desc: mIRC click bindings exit client
    crit: notable
    conf: 0.97
    count_min: 3
    if:
      type: text
      regex: '(?im)^[a-z]{4,8}=[^\r\n|]{1,120}\|\s*/?exit\r?$'

  # A [fonts] entry that renders the status or a channel window in a symbol
  # face (Wingdings, Webdings, Marlett, Symbol) turns every line of IRC
  # traffic into glyphs, so whoever opens the client cannot read what the
  # session is doing. Ordinary themes pick text faces.
  - id: mirc-config-symbol-font-window
    for: [text]
    desc: mIRC renders chat windows in symbol font
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?im)^f(status|channel|query|#[^=\r\n]{1,40})=(Wingdings|Webdings|Marlett|Symbol)\b'
