defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.98
traits:
  - id: iframe-display-none-markup
    desc: Iframe markup declares display none style
    if:
      type: text
      exclude_html_comments: true
      regex: "(?is)<iframe\\b[^>]{0,160}\\bstyle=[\"\\x27][^>]{0,100}display\\s*:\\s*none"
