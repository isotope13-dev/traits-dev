defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.98
traits:
  - id: iframe-display-none-markup
    desc: Iframe markup declares display none style
    if:
      type: text
      exclude_html_comments: true
      regex: "(?is)<iframe\\b[^>]{0,160}\\bstyle=[\"\\x27][^>]{0,100}display\\s*:\\s*none"
  # The classic injected-frame tag: `width="1" height="1" frameborder="0"
  # scrolling="no"`. A frame at most one pixel tall with no border and no
  # scrollbar renders nothing the visitor can see while its document still
  # loads and runs. Legitimate ad-sync frames usually hide with display or
  # visibility styles instead, so this attribute run is concealment-shaped.
  - id: one-pixel-borderless-noscroll-frame
    desc: Borderless non-scrolling frame at most 1px tall
    crit: suspicious
    conf: 0.9
    for: [html]
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\bheight=["'']?[01]["'']?\s+frameborder=["'']?0["'']?\s+scrolling=["'']?no\b'
  # Two-to-three-pixel frames hide exactly like the classic one-pixel frame
  # while dodging 1px detections. Collected rename artifacts (.hc, .txt)
  # arrive as plain text, so this scans the text scope too. Zero- and
  # one-pixel frames stay with the sibling traits: hidden zero-size loaders
  # and 1x1 ad-conversion pixels are ordinary web plumbing.
  - id: few-pixel-remote-frame
    desc: Iframe shrunk to two or three pixels
    crit: suspicious
    conf: 0.9
    for: [html, javascript, text]
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<iframe\b[^>]{0,200}\b(width|height)\s*=\s*["'']?[23]["''\s/]'
    unless:
      # Renderer test fixtures size iframes arbitrarily to exercise
      # aspect-ratio and class-name logic; concealment is not in play.
      - id: metadata/path::test-directory-component
  # The canonical injected hidden-frame attribute run (`width=0 height=0
  # frameborder=0`) — the tag shape the iframe-injection campaigns append to
  # compromised pages. Hidden preload embeds usually stop at the dimensions;
  # the borderless switch stacked on an invisible frame is the injected run.
  # Only the canonical attribute order is matched.
  - id: hidden-frame-attribute-run
    desc: Injected zero-size borderless iframe tag run
    crit: suspicious
    conf: 0.9
    for: [html, javascript, text]
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<iframe[^>]{0,80}width=0[^>]{0,40}height=0[^>]{0,40}frameborder=0'
