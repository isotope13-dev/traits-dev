defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.98
traits:
  - id: iframe-display-none-markup
    desc: Iframe markup declares display none style
    if:
      type: text
      exclude_html_comments: true
      regex: "(?is)<iframe\\b[^>]{0,160}\\bstyle=[\"\\x27][^>]{0,100}display\\s*:\\s*none"
  # The classic injected-frame tag: `width="1" height="1" frameborder="0"
  # scrolling="no"`. A frame at most one pixel tall with no border and no
  # scrollbar renders nothing the visitor can see while its document still
  # loads and runs. Legitimate ad-sync frames usually hide with display or
  # visibility styles instead, so this attribute run is concealment-shaped.
  - id: one-pixel-borderless-noscroll-frame
    desc: Borderless non-scrolling frame at most 1px tall
    crit: suspicious
    conf: 0.9
    for: [html]
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\bheight=["'']?[01]["'']?\s+frameborder=["'']?0["'']?\s+scrolling=["'']?no\b'
