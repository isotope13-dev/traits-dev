# Proximity establishes co-occurrence, not frame-to-URL data flow or an exploit.
defaults:
  platforms: [unix, windows, ios]
  for: [html, javascript, typescript]
composite_rules:
  - id: hidden-iframe-near-executable-query
    desc: Hidden iframe near nested executable URL query
    crit: notable
    conf: 0.99
    near_bytes: 4096
    all:
      - id: micro-behaviors/ui/window/visibility::hidden-iframe
      - id: micro-behaviors/communications/http/url/query::nested-executable-url-value

