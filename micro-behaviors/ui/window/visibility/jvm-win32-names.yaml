# Win32 console/window-hiding API names bound from the JVM (JNA). A JNA
# interface keeps the Win32 name as a method or constant string in the class
# file; that name is all that is visible. Neutral alone: the hide-the-console
# intent is in objectives/evasion/fileless/memory/java-jna.yaml's
# console-hide-primitives. Relocated from there (as *-ref atoms), where every
# JVM class naming ShowWindow read as fileless-memory evasion.
defaults:
  platforms: [windows]
  for: [java, class]
  attack: T1564.003
traits:
  - id: jvm-console-window-class-name
    desc: JVM class names ConsoleWindowClass
    crit: notable
    conf: 0.95
    if:
      type: text
      word: ConsoleWindowClass

  - id: jvm-find-window-a-name
    desc: JVM class names FindWindowA
    crit: notable
    conf: 0.95
    if:
      type: text
      word: FindWindowA

  - id: jvm-show-window-name
    desc: JVM class names ShowWindow
    crit: notable
    conf: 0.95
    if:
      type: text
      word: ShowWindow

  - id: jvm-sw-hide-name
    desc: JVM class names SW_HIDE
    crit: notable
    conf: 0.95
    if:
      type: text
      word: SW_HIDE
