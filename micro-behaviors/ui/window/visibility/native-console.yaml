defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
  crit: notable
  conf: 0.98
traits:
  - id: get-console-window-import
    desc: Imports current console window lookup
    if:
      type: import
      exact: GetConsoleWindow
composite_rules:
  - id: native-console-hide-profile
    desc: Console lookup with zero-argument visibility tailcall
    all:
      - id: metadata/binary/instruction/operand::x64-zero-second-argument-import-tailcall
      - id: micro-behaviors/ui/window/control::show-window
      - id: get-console-window-import
