defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript, php]
  crit: notable
  conf: 0.9

traits:
  - id: hidden-anchor-with-href
    desc: HTML anchor has hidden attribute and href
    crit: notable
    conf: 0.9
    unless:
      - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
      - id: well-known/tool/development/vcs/github-web::github-repo-fetched-path
    if:
      type: text
      regex: '(?i)<a\b[^>]{0,80}\shidden(\s|=|>)[^>]{0,80}\bhref\s*=\s*["'']'

