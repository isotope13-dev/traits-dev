defaults:
  for: [pyc]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: pyc-window-fullscreen-option
    desc: Bytecode contains fullscreen window option
    conf: 0.9
    if:
      type: text
      substr: '-fullscreen'
  - id: pyc-window-topmost-option
    desc: Bytecode contains topmost window option
    conf: 0.9
    if:
      type: text
      substr: '-topmost'
