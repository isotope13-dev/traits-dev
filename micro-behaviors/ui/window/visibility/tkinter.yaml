# Tkinter Window Management Capabilities
defaults:
  crit: notable
  conf: 0.8
  platforms: [windows, unix]
  for: [python]
traits:
  - id: tkinter-fullscreen
    desc: Sets Tkinter window to fullscreen
    if:
      type: text
      regex: 'attributes\([''"]-fullscreen[''"]\s*,\s*True\)'
  - id: tkinter-resize-disable
    desc: Disables Tkinter window resizing
    if:
      type: text
      regex: 'resizable\(0,\s*0\)|resizable\(False,\s*False\)'
  - id: tkinter-protocol-intercept
    desc: Intercepts window close event
    if:
      type: text
      regex: 'protocol\([''"]WM_DELETE_WINDOW[''"]'
  - id: tkinter-topmost
    desc: Sets Tkinter window to always on top
    if:
      type: text
      regex: 'attributes\([''"]-topmost[''"]\s*,\s*True\)'
  - id: tkinter-overrideredirect
    desc: Removes window decorations (frameless)
    if:
      type: text
      substr: 'overrideredirect(True)'
  - id: tkinter-canvas-create-rectangle
    desc: Tkinter canvas create_rectangle call
    conf: 0.9
    if:
      type: text
      substr: canvas.create_rectangle
  - id: tkinter-rectangle-outline-kwarg
    desc: Tkinter rectangle outline keyword argument
    conf: 0.9
    if:
      type: text
      substr: outline=

composite_rules:
  - id: tkinter-canvas-region-select-overlay
    desc: Tkinter canvas drag selection rectangle
    conf: 0.92
    crit: notable
    all:
      - id: tkinter-canvas-create-rectangle
      - id: tkinter-rectangle-outline-kwarg
