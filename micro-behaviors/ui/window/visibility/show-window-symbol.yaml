defaults:
  platforms: [windows]
  for: [javascript, vbs, c, cpp, csharp]
traits:
  - id: show-window-property-symbol
    desc: References ShowWindow visibility API or property
    crit: notable
    conf: 0.86
    if:
      type: symbol
      regex: '(^|\.)ShowWindow$'
    unless:
      - id: well-known/game/mod::bedrockboot-source-repository
