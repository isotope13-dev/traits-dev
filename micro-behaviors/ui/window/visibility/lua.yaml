defaults:
  for: [lua]
  platforms: [windows]
traits:
  - id: lua-hide-window-call
    desc: Lua ShowWindow call uses proven zero mode
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ShowWindow$'
      arg:
        index: 1
        from:
          whole_number: 0
