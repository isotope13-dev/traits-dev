defaults:
  for: [lua]
  platforms: [windows]
traits:
  - id: lua-hide-window-call
    desc: Lua ShowWindow call uses proven zero mode
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ShowWindow$'
      arg:
        index: 1
        from:
          whole_number: 0
  - id: lua-showwindow-zero-local-call
    desc: Lua ShowWindow uses a zero-valued local
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      language: lua
      query: |
        ((chunk
          (variable_declaration (assignment_statement
            (variable_list . (identifier) @mode .)
            (expression_list . (number) @zero .)))
          . (variable_declaration (assignment_statement
            (variable_list . (identifier) @intervening .)))
          . (if_statement (block . (function_call
            name: (dot_index_expression field: (identifier) @show)
            arguments: (arguments . (_) . (identifier) @used .)) .)))
          (#eq? @mode @used) (#not-eq? @mode @intervening)
          (#eq? @zero "0") (#eq? @show "ShowWindow"))
