defaults:
  platforms: [windows]
  for: [python]
  crit: notable
  conf: 0.90
traits:
- id: sw-hide-source-token
  desc: SW_HIDE window flag token
  conf: 0.85
  for: [javascript, vbs, c, cpp, csharp]
  if:
    type: text
    word: "SW_HIDE"
- id: sw-showdefault-token
  desc: SW_SHOWDEFAULT window flag token
  conf: 0.86
  for: [c, cpp]
  if:
    type: text
    word: SW_SHOWDEFAULT
  unless:
  - type: text
    regex: '#define\s+SW_SHOWDEFAULT'
  - id: metadata/file/profile/source-indications/
- id: show-window-hidden-assignment
  desc: Assigns hidden ShowWindow value
  conf: 0.88
  for: [javascript, vbs, html]
  if:
    type: text
    regex: '(?i)\bShowWindow\s*=\s*0'
