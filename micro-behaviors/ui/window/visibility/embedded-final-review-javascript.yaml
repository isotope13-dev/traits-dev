defaults:
  for:
    - javascript
  platforms:
    - windows
composite_rules:
  - id: hex-table-document-call-tiny-iframe-clues
    desc: Hex table, document call and tiny iframe clues
    crit: suspicious
    conf: 0.96
    for: [html]
    platforms: [windows, unix]
    all:
      - id: metadata/lang/encoding/shape/escape::javascript-hex-escape-string-table
      - id: micro-behaviors/data/control-flow/dispatch/computed::js-computed-document-call
      - id: micro-behaviors/ui/window/visibility::tiny-iframe-at-most-one
