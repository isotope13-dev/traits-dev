# DOM element concealment: scripts and markup that hide, shrink or park an
# element off-screen. Hidden iframes are the classic injector shape; the
# single-property atoms stay notable and composites add intent.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, elixir, scala, asp]
traits:
- id: browser-download-display-toggle
  desc: Toggles download or verify UI display
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: '(?i)\b(download|captcha)\b.{0,80}\.style\.display\s*='
- id: browser-status-display-toggle
  desc: Toggles display for browser status UI text
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: '(?i)\b(verify|connecting|redirect)\b.{0,160}\.style\.display\s*='
- id: iframe-create
  desc: Creates iframe element
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: 'createElement\s*\(\s*["'']iframe["'']\s*\)'
  unless:
    - id: metadata/file/format/structured::serialized-news-article-catalog
- id: display-none-style
  desc: Script hides an element via style.display
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: 'style\.display\s*=\s*["'']none["'']'
- id: element-visibility-hidden
  desc: Sets element visibility hidden style
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: 'style\.visibility\s*=\s*["'']hidden["'']'

- id: html-list-hidden-attribute
  desc: HTML list has the hidden attribute
  crit: notable
  conf: 0.9
  for: [html, javascript, typescript, php]
  if:
    type: text
    regex: '(?is)<(ul|ol)\b[^>]{0,240}\s+hidden(\s|=|>)'
- id: html-list-display-none-style
  desc: HTML list has inline display none style
  crit: notable
  conf: 0.9
  for: [html, javascript, typescript, php]
  if:
    type: text
    regex: '(?is)<(ul|ol)\b[^>]{0,240}\s+style\s*=\s*["''][^"'']{0,100}\bdisplay\s*:\s*none\b'
- id: zero-dimension-inline-style
  desc: Inline style sizes an element to zero
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: 'style\s*=\s*["''][^"'']{0,180}\bwidth\s*:\s*0(%|px)?[^"'']{0,180}\bheight\s*:\s*0(%|px)?'
- id: tiny-iframe-width-height
  desc: Sets iframe width and height to one
  crit: notable
  conf: 0.9
  for: [html, scala, elixir, asp]
  if:
    type: text
    regex: 'iframe[^>]{0,80}width\s*=\s*["'']1["''][^>]{0,80}height\s*=\s*["'']1["'']'
- id: tiny-iframe-height-width
  desc: Sets iframe height and width to one
  crit: notable
  conf: 0.9
  for: [html, scala, elixir, asp]
  if:
    type: text
    regex: 'iframe[^>]{0,80}\bheight\s*=\s*["'']1["''][^>]{0,80}\bwidth\s*=\s*["'']1["'']'
- id: iframe-width-at-most-one
  desc: Sets iframe width to at most one
  crit: notable
  conf: 0.9
  for: [html, scala, elixir, asp]
  if:
    type: text
    regex: 'iframe[^>]{0,160}\bwidth\s*=\s*["''](0\.[0-9]+|0|1|1\.0+)["'']'
- id: iframe-unquoted-zero-width
  desc: Sets iframe width to unquoted zero
  crit: notable
  conf: 0.9
  for: [html, scala, elixir, asp]
  if:
    type: text
    regex: 'iframe[^>]{0,160}\bwidth\s*=\s*0[\s>]'
- id: iframe-height-at-most-one
  desc: Sets iframe height to at most one
  crit: notable
  conf: 0.9
  for: [html, scala, elixir, asp]
  if:
    type: text
    regex: 'iframe[^>]{0,160}\bheight\s*=\s*["''](0\.[0-9]+|0|1|1\.0+)["'']'
- id: iframe-unquoted-zero-height
  desc: Sets iframe height to unquoted zero
  crit: notable
  conf: 0.9
  for: [html, scala, elixir, asp]
  if:
    type: text
    regex: 'iframe[^>]{0,160}\bheight\s*=\s*0[\s>]'
# Third way to conceal an element, and the one this family was missing: shove
# it off the canvas with a large negative offset (`style.left = '-999em'`).
# Injectors reach for it precisely BECAUSE it is not display:none or
# visibility:hidden -- an off-screen frame still loads and runs its document,
# where hidden ones historically did not in some engines. Requiring 3+ digits
# keeps ordinary layout nudges (-8px, -20px) out; genuine off-canvas parking
# is -999/-9999. On its own this is a style fragment, so it stays component
# and only means something next to the iframe-create leg below.
- id: offscreen-negative-offset-style
  desc: Moves element off-screen with negative offset
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: 'style\.(top|left)\s*=\s*["'']-\d{3,}(em|px)'
- id: sockjs-client-bundle
  desc: SockJS browser client is bundled
  crit: component
  conf: 0.9
  for: [javascript, typescript, html]
  if:
    type: text
    substr: sockjs-client
composite_rules:
- id: browser-status-or-download-display-toggle
  desc: Toggles display for status, download, or verification UI text
  crit: notable
  conf: 0.7
  any:
  - id: browser-download-display-toggle
  - id: browser-status-display-toggle
- id: hidden-list-container
  desc: HTML list element is hidden
  crit: notable
  conf: 0.9
  for: [html, javascript, typescript, php]
  any:
  - id: html-list-hidden-attribute
  - id: html-list-display-none-style
- id: tiny-iframe
  desc: Embeds an iframe at or below one-pixel size
  crit: notable
  conf: 0.9
  for: [html, scala, elixir, asp]
  any:
  - id: tiny-iframe-width-height
  - id: tiny-iframe-height-width
  - id: tiny-iframe-at-most-one
  - id: tiny-iframe-unquoted-zero
- id: tiny-iframe-at-most-one
  desc: Embeds iframe at or below one-pixel size
  crit: notable
  conf: 0.9
  for: [html, scala, elixir, asp]
  all:
  - id: iframe-width-at-most-one
  - id: iframe-height-at-most-one
  near_bytes: 256
- id: tiny-iframe-unquoted-zero
  desc: Embeds iframe with unquoted zero size
  crit: notable
  conf: 0.9
  for: [html, scala, elixir, asp]
  all:
  - id: iframe-unquoted-zero-width
  - id: iframe-unquoted-zero-height
  near_bytes: 256
- id: hidden-iframe
  desc: Creates hidden iframe element
  crit: notable
  conf: 0.88
  all:
  - id: iframe-create
  any:
  - id: display-none-style
  - id: element-visibility-hidden
  - id: offscreen-negative-offset-style
  - id: zero-dimension-inline-style
  near_bytes: 600
  # YUI Connection (and similar XHR shims) park a transport iframe off-screen;
  # that is library plumbing, not a lure/injector hide.
  unless:
    - id: metadata/file/format/structured::serialized-news-article-catalog
    - id: well-known/lib/ui/yui/
  # Two kinds of context make this plumbing rather than a hide: a test file,
  # or a library that is known to park a transport iframe off-screen.
  #
  # Two legs used to sit here that said neither of those things:
  # `js-large-module-bundle` (literally `imports.count >= 200`) and
  # `benign-build-tooling-context` (built by a bundler/minifier/CI). Between
  # them they made a hidden iframe baseline in essentially every bundled web
  # app -- and a compromised dependency ships through a bundler like any
  # other, so "webpack emitted it" is not an argument for benignity. They also
  # handed an attacker two trivial ways to silence the rule.
  downgrade:
    any:
    - type: basename
      regex: '(?i)(^|[-_.])(test|spec)\.[jt]sx?$'
    - id: metadata/package/testing/presence/manifest::test-fixtures
    - id: hidden-iframe-transport-library
# The iframe-as-transport pattern: a hidden frame used for cross-domain XHR,
# postMessage relay or tag delivery. These libraries are identified by name
# rather than by bulk, which is what keeps this a narrow trigger -- see the
# note on `hidden-iframe`. YUI belongs to the same family but sits in that
# rule's `unless:` because its transport iframe carries no lure risk at all.
- id: hidden-iframe-transport-library
  desc: Library that parks a transport iframe off-screen
  crit: component
  conf: 0.9
  any:
  - id: sockjs-client-bundle
  - id: metadata/build/bundler/asset::google-tag-manager-bundle
  - id: well-known/lib/ui/react/
