# These settings are also observable in PowerShell command strings embedded
# in other scripts. They do not establish an input lock or a ransom demand.
defaults:
  platforms: [windows]
  for: [powershell, javascript, typescript, html]
  crit: notable
  conf: 0.95

traits:
  - id: powershell-topmost-window-assignment
    desc: PowerShell sets a window above others
    if:
      type: text
      regex: '(?i)\$[\w]+\.TopMost\s*=\s*\$true\b'
  - id: powershell-borderless-form-assignment
    desc: PowerShell removes a form border
    if:
      type: text
      regex: '(?i)\$[\w]+\.FormBorderStyle\s*=\s*\\?[''"]None\\?[''"]'
  - id: powershell-maximized-window-assignment
    desc: PowerShell sets a maximized window state
    if:
      type: text
      regex: '(?i)\$[\w]+\.WindowState\s*=\s*\\?[''"]Maximized\\?[''"]'
