defaults:
  platforms: [windows, macos]
  for: [vbs, oledoc, ooxml]
traits:
  - id: worksheet-visibility-assignment
    desc: Sets worksheet visibility from VBA
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(Sheets?|Worksheets?)\([^)]{0,50}\)\.Visible\s*='
  - id: vba-hide-worksheet
    desc: VBA sets a worksheet to hidden visibility
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Sheets?\([^)]{0,50}\)\.Visible\s*=\s*(False|0)\b'
