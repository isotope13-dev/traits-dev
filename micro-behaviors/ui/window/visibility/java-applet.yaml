defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.98
traits:
  - id: one-pixel-java-applet
    desc: Java applet is sized to one pixel
    if:
      type: text
      regex: '(?i)<applet\b[^>]{0,240}\bwidth=1\s+height=1[\s>]'
      exclude_html_comments: true
