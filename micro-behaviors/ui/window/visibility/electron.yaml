defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: electron-hidden-browserwindow
    desc: Creates a browser window initially hidden
    if:
      type: tree-sitter
      query: |
        ((new_expression
          constructor: [(identifier) @constructor
            (member_expression property: (property_identifier) @constructor)]
          arguments: (arguments (object (pair
            key: [(property_identifier) (string)] @key
            value: (false))))) @window
          (#eq? @constructor "BrowserWindow")
          (#match? @key "^['\"]?show['\"]?$"))

  - id: electron-hide-enumerated-windows
    desc: Hides windows in an Electron window enumeration
    platforms: [linux, macos, windows]
    for: [scripts, binaries, typescript, go, rust]
    if:
      type: text
      regex: 'BrowserWindow\.getAllWindows\(\)\.forEach\([\s\S]{0,500}\.hide\('
