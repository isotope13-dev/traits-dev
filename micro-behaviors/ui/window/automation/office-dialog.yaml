# Programmatic Office dialog manipulation. The Office UA control exposes
# ShowDialog and SelectTabSDM so script can open an application dialog by
# numeric ID and pick one of its tabs; no other control offers that pair.
# These identify neutral dialog automation; security-bypass intent is
# inferred by composites under objectives/ that require the full
# instantiate, activate, open-dialog and pick-tab combination.
defaults:
  crit: notable
  conf: 0.9
  platforms: [windows]
  for: [html, javascript]

traits:
  - id: showdialog-dialog-id-call
    desc: Invokes ShowDialog with numeric dialog ID
    if:
      type: text
      regex: '\.ShowDialog\s*\(\s*0[xX][0-9A-Fa-f]+'
  - id: selecttabsdm-tab-id-call
    desc: Selects dialog tab by numeric ID
    if:
      type: text
      regex: '\.SelectTabSDM\s*\(\s*0[xX][0-9A-Fa-f]+'
