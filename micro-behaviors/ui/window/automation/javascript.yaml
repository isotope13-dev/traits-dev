defaults:
  platforms: [windows, unix]
traits:
  - id: dom-dispatch-click-call
    for: [javascript, typescript]
    desc: Dispatches a synthetic DOM click event
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.dispatchEvent\s*\(\s*new\s+MouseEvent\s*\(\s*["'']click["'']'
  - id: dom-dispatch-mousemove-call
    for: [javascript, typescript]
    desc: Dispatches a synthetic DOM mousemove event
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.dispatchEvent\s*\(\s*new\s+MouseEvent\s*\(\s*["'']mousemove["'']'
  - id: dom-dispatch-change-event
    for: [javascript, typescript]
    desc: Dispatches synthetic DOM change event
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      language: javascript
      kind: call
      regex: '\.dispatchEvent\s*\(\s*new\s+(Event|CustomEvent)\s*\(\s*["'']change["'']'
  - id: dom-dispatch-input-event
    for: [javascript, typescript]
    desc: Dispatches synthetic DOM input event
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      language: javascript
      kind: call
      regex: '\.dispatchEvent\s*\(\s*new\s+(Event|CustomEvent)\s*\(\s*["'']input["'']'
  - id: dom-dispatch-submit-event
    for: [javascript, typescript]
    desc: Dispatches synthetic DOM submit event
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      language: javascript
      kind: call
      regex: '\.dispatchEvent\s*\(\s*new\s+(Event|CustomEvent)\s*\(\s*["'']submit["'']'
  - id: dom-dispatch-load-event
    for: [javascript, typescript]
    desc: Dispatches synthetic DOM load event
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      language: javascript
      kind: call
      regex: '\.dispatchEvent\s*\(\s*new\s+(Event|CustomEvent)\s*\(\s*["'']load["'']'
  - id: dom-dispatch-error-event
    for: [javascript, typescript]
    desc: Dispatches synthetic DOM error event
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      language: javascript
      kind: call
      regex: '\.dispatchEvent\s*\(\s*new\s+(Event|CustomEvent)\s*\(\s*["'']error["'']'
  - id: dom-click-call
    for: [javascript, typescript, html, -kotlin]
    crit: notable
    desc: Calls click() on a DOM element
    conf: 0.82
    if:
      type: symbol
      kind: call
      regex: '(^|\.)click$'
  - id: steam-confirm-tradeoffer-call
    for: [javascript, typescript, html, -kotlin]
    crit: notable
    desc: Steam ConfirmTradeOffer call
    conf: 0.92
    if:
      type: text
      substr: ConfirmTradeOffer
  - id: steam-act-on-trade-offer
    for: [javascript, typescript, html, -kotlin]
    crit: notable
    desc: Steam ActOnTradeOffer call
    conf: 0.92
    if:
      type: text
      substr: ActOnTradeOffer
  - id: steam-trade-confirm-button
    for: [javascript, typescript, html, -kotlin]
    crit: notable
    desc: Steam trade confirm button reference
    conf: 0.9
    if:
      type: text
      substr: trade_confirmbtn
  - id: steam-trade-accept-button
    for: [javascript, typescript, html, -kotlin]
    crit: notable
    desc: Steam trade accept button reference
    conf: 0.9
    if:
      type: text
      substr: trade_offer_accept_btn
  - id: steam-tradeoffers-redirect
    for: [javascript, typescript, html, -kotlin]
    crit: notable
    desc: Steam tradeoffers redirect
    conf: 0.88
    if:
      type: text
      substr: steamcommunity.com/my/tradeoffers/sent
  - id: window-postmessage-opnskin
    for: [javascript, typescript, html, -kotlin]
    crit: notable
    desc: OpnSkin window postMessage bridge
    conf: 0.9
    if:
      type: text
      substr: 'window.postMessage({type:"OPNSKIN_'
composite_rules:
  - id: dom-dispatch-non-pointer-event
    for: [javascript, typescript]
    desc: Dispatches synthetic non-pointer DOM event
    crit: notable
    conf: 0.92
    any:
      - id: dom-dispatch-change-event
      - id: dom-dispatch-input-event
      - id: dom-dispatch-submit-event
      - id: dom-dispatch-load-event
      - id: dom-dispatch-error-event
