defaults:
  platforms: [windows]
  for: [pe]
  attack: T1113

traits:
- id: remote-desktop-control-fragments--rx-1
  desc: Repeated rd_start remote-desktop command token
  crit: notable
  conf: 0.85
  count_min: 2
  if:
    type: text
    substr: rd_start
- id: remote-desktop-control-fragments--rx-2
  desc: Repeated rd_block remote-desktop command token
  crit: notable
  conf: 0.85
  count_min: 2
  if:
    type: text
    substr: rd_block
composite_rules:
- id: remote-desktop-control-fragments
  desc: Repeated remote-desktop start and block command tokens
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/ui/window/automation::remote-desktop-control-fragments--rx-1
  - id: micro-behaviors/ui/window/automation::remote-desktop-control-fragments--rx-2
  unless:
  - id: well-known/lib/ui/gui::openfl-lime-cpp-rtti
