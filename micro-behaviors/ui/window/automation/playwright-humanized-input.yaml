defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: playwright-humanized-input-helper
    desc: Human-like Playwright input helper
    if:
      type: function
      regex: '(?i)^_?(human([_-]?like|ized)|click_human|human_mouse_path)'
    unless:
      - id: well-known/lib/platform/browser-automation/drivers/selenium::google-flow-browser-auth-client
      - id: well-known/lib/network/crawlo::crawlo-benign-automation-context
