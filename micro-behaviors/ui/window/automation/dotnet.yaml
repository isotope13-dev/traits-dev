# Named .NET screenshot methods and their neutral API context.
defaults:
  crit: notable
  for: [pe, dll]
  platforms: [windows]
  attack: T1113
  mbc: C0014

composite_rules:
  - id: dotnet-capture-or-input-apis
    desc: .NET desktop capture or input APIs
    conf: 0.95
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
    any:
      - id: micro-behaviors/hardware/display/screenshot/reference::copyfromscreen-dotnet
      - id: micro-behaviors/hardware/input/video::avicap32-device-enum
      - id: micro-behaviors/hardware/input/video::avicap32-dll
      - id: micro-behaviors/hardware/display/screenshot/unspecified::dotnet-gdi-managed-screen-capture
      - id: micro-behaviors/hardware/input/mouse::mouse-event
