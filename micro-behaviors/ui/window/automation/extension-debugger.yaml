# Permission, attachment and input dispatch establish automation capability.
# They do not establish unwanted UI modification or defacement.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip]

composite_rules:
- id: debugger-driven-input-automation
  desc: Broad-site extension uses debugger input dispatch
  crit: notable
  conf: 0.96
  scope: archive
  all:
  - id: metadata/permission/debugger::permission-debugger
  - id: micro-behaviors/process/attach/webextension::chrome-debugger-attach
  - id: micro-behaviors/communications/http/devtools/client::cdp-input-event-injection
  any:
  - id: "metadata/permission/host::broad-content-script-matches"
  - id: "metadata/permission/activation::content-script-all-frames"
  - id: metadata/permission/host::host-permission-all-http
