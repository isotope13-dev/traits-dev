defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
composite_rules:
- id: window-text-bitmap-control-api-set
  desc: Window text/bitmap/DC references beside window-control indicators
  conf: 0.9
  all:
  - id: micro-behaviors/ui/window/enumerate::get-window-text
  - id: micro-behaviors/hardware/display/screen::gdi-create-compatible-bitmap
  - id: micro-behaviors/hardware/display/screen::gdi-create-compatible-dc
  any:
  - id: micro-behaviors/ui/window/control
  needs: 4
