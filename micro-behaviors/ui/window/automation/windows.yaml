defaults:
  platforms: [windows]
traits:
  - id: powershell-ui-automation-root-element
    for: [powershell]
    crit: notable
    conf: 0.9
    desc: PowerShell accesses UI Automation root
    if:
      type: text
      regex: '(?i)\[System\.Windows\.Automation\.AutomationElement\]\s*::\s*RootElement\b'
  - id: powershell-ui-automation-control-search
    for: [powershell]
    crit: notable
    desc: PowerShell searches UI Automation controls
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bFindFirst\s*\(.{0,80}TreeScope\]::Descendants\b'
  - id: powershell-ui-automation-invoke-control
    for: [powershell]
    crit: notable
    desc: PowerShell invokes a UI Automation control
    conf: 0.92
    if:
      type: text
      regex: '(?i)InvokePattern\].{0,80}\.Invoke\s*\('
  - id: ui-automation-from-handle
    desc: UI automation lookup from window handle
    crit: baseline
    conf: 0.82
    for: [pe, dll, csharp, powershell]
    if:
      type: text
      word: AutomationElement.FromHandle
  - id: python-ui-automation-library
    desc: Python imports Windows UI Automation
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?i)\bimport\s+uiautomation\b|\bfrom\s+uiautomation\b'
  - id: python-ui-automation-text-read
    desc: Python reads text through UI Automation
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      # GetChildren was dropped: it is not a text read, and case-insensitively
      # it matches Python's stdlib ElementTree `getchildren()` plus every other
      # tree-walking API of that name (lxml, docutils/Sphinx, AST helpers).
      # The three remaining names are uiautomation-specific.
      regex: '(?i)\b(GetFocusedControl|GetForegroundControl|GetTextPattern)\s*\('
  - id: python-ui-automation-text-property
    desc: Python reads a UI Automation text property
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?i)\bTextPattern\.Current\.(Text|DocumentRange)\b'
  - id: powershell-ui-automation-from-handle
    desc: PowerShell gets a UI Automation element
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: 'AutomationElement\]\s*::\s*FromHandle'
  - id: ui-automation-controltype-edit
    desc: Windows UI Automation edit control selector
    crit: baseline
    conf: 0.8
    for: [pe, dll, csharp]
    if:
      type: text
      word: ControlType.Edit
  - id: ui-automation-valuepattern-value
    desc: Windows UI Automation value pattern read
    crit: baseline
    conf: 0.82
    for: [pe, dll, csharp]
    if:
      type: text
      word: ValuePattern.Current.Value
  - id: powershell-ui-automation-text-read
    desc: PowerShell reads a UI Automation text pattern
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '(?i)\b(DocumentRange\s*\.\s*GetText|TextPattern\]\s*::\s*Pattern)\b'
composite_rules:
  - id: ui-automation-edit-value-read
    for: [pe, dll]
    desc: Read UI Automation edit-control values from a foreground window
    crit: notable
    conf: 0.88
    all:
      - id: ui-automation-from-handle
      - id: ui-automation-controltype-edit
      - id: ui-automation-valuepattern-value
  - id: python-ui-automation-text-read-flow
    desc: Python reads another window through UI Automation
    crit: notable
    conf: 0.94
    for: [python]
    all:
      - id: python-ui-automation-library
      - id: python-ui-automation-text-read
      - id: python-ui-automation-text-property
  - id: powershell-ui-automation-text-read-flow
    desc: PowerShell reads another window through UI Automation
    crit: notable
    conf: 0.94
    for: [powershell]
    all:
      - id: powershell-ui-automation-from-handle
      - id: powershell-ui-automation-text-read
