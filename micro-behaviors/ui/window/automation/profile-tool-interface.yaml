---
defaults:
  for:
  - javascript
  - typescript
  - python
  - lua
  - markdown
  platforms:
  - unix
  - windows
  crit: notable
traits:
- id: browser-tool-intent-category-a
  desc: Browser intent category
  crit: notable
  conf: 0.98
  for:
  - python
  if:
    type: literal
    kind: string
    regex: "^browser\\.(navigation|inspect|interact)$"
- id: browser-tool-intent-category-b
  desc: Browser privileged intent category
  crit: notable
  conf: 0.98
  for:
  - python
  if:
    type: literal
    kind: string
    regex: "^browser\\.(transfer|privileged)$"
- id: browser-tool-intercept-label
  desc: Browser intercept surface label
  crit: notable
  conf: 0.97
  for:
  - python
  if:
    type: literal
    kind: string
    exact: network_intercept
- id: browser-tool-password-label
  desc: Browser password surface label
  crit: notable
  conf: 0.97
  for:
  - python
  if:
    type: literal
    kind: string
    exact: password_field
composite_rules:
- id: browser-sensitive-intent-label-clues
  desc: Browser intent and sensitive-surface labels
  crit: notable
  conf: 0.98
  for:
  - python
  all:
  - id: micro-behaviors/ui/window/automation::browser-tool-intent-category
  - id: micro-behaviors/ui/window/automation::browser-tool-sensitive-surface-label
- id: browser-tool-intent-category
  desc: Browser intent categories
  crit: notable
  conf: 0.98
  for:
  - python
  any:
  - id: micro-behaviors/ui/window/automation::browser-tool-intent-category-a
  - id: micro-behaviors/ui/window/automation::browser-tool-intent-category-b
- id: browser-tool-sensitive-surface-label
  desc: Browser sensitive surface labels
  crit: notable
  conf: 0.97
  for:
  - python
  any:
  - id: micro-behaviors/ui/window/automation::browser-tool-intercept-label
  - id: micro-behaviors/ui/window/automation::browser-tool-password-label
  - id: micro-behaviors/ui/window/automation::browser-tool-transfer-surface-label
- id: browser-tool-transfer-surface-label
  desc: Browser transfer surface label
  crit: notable
  conf: 0.97
  for:
  - python
  all:
  - id: micro-behaviors/ui/window/automation::browser-tool-intent-category-b
  any:
  - id: micro-behaviors/ui/keywords::download-action-label
  - id: micro-behaviors/ui/keywords::upload-action-label
