# The JSON/template composites below remain co-occurrence observations. The
# icon-specific composite separately binds one record field to an HTML attribute.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: object-url-anchor-interpolation
    desc: Object URL field enters anchor markup
    conf: 0.96
    if:
      type: text
      regex: '(?is)<a\b[^>]{0,160}\bhref="\$\{[A-Za-z_$][\w$]*\.(url|href)\}"'
  - id: interpolated-icon-image-source
    desc: Interpolates icon value into image source
    conf: 0.97
    if:
      type: text
      regex: '<img\s+src="\$\{icon_url\}"'

  - id: object-link-paragraph-interpolation
    desc: Link field enters paragraph markup
    conf: 0.98
    if:
      type: text
      regex: '>\$\{link\.[A-Za-z_$][\w$]*\}</p>'
composite_rules:
  # These observations do not bind the JSON response to the rendered value,
  # inspect escaping, or establish an executable attacker-controlled payload.
  - id: json-response-record-markup-cooccurrence
    desc: JSON response near record iteration and HTML markup
    conf: 0.99
    all:
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/ui/window/insert-html::object-field-in-html-body-markup
      - id: micro-behaviors/ui/window/insert-html::interpolated-shortcut-link-markup
      - id: micro-behaviors/data/control-flow/dispatch/named::js-append-method-call
      - id: metadata/lang/source/syntax/assignment/value::data-assignment-before-record-iteration
      - id: metadata/lang/source/syntax/call/arguments::dollar-call-interpolated-link-field
    near_bytes: 3500
  - id: record-icon-enters-image-source-attribute
    desc: Record icon enters image source markup
    crit: notable
    conf: 0.97
    all:
      - id: metadata/lang/source/syntax/conditional::optional-record-icon-fallback
      - id: metadata/lang/source/syntax/assignment/value::icon-assignment-record-url-reference
      - id: interpolated-icon-image-source
    near_bytes: 1200
  - id: json-response-and-link-body-markup
    desc: JSON response with link body markup
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/ui/window/insert-html::object-field-in-html-body-markup
      - id: object-url-anchor-interpolation
      - id: micro-behaviors/ui/window/insert-html::shortcut-link-markup-and-append-call
    near_bytes: 2500
  - id: json-response-and-paragraph-markup
    desc: JSON response with paragraph link markup
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: metadata/lang/source/syntax/assignment/value::data-assignment-before-render-call
      - id: object-link-paragraph-interpolation
      - id: micro-behaviors/ui/window/insert-html::shortcut-link-markup-and-append-call
    near_bytes: 2500
  - id: json-response-and-link-insertion
    desc: JSON response with link markup and append
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/ui/window/insert-html::shortcut-link-markup-and-append-call
    near_bytes: 2500
  - id: json-response-and-anchor-target-markup
    desc: JSON response with anchor target markup
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: object-url-anchor-interpolation
      - id: micro-behaviors/ui/window/insert-html::shortcut-link-markup-and-append-call
    near_bytes: 2500
