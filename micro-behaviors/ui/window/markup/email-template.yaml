# HTML email bodies used as phishing or bulk-mail templates.
# An e-mail body is a few KB. The brand and pretext matchers are Unicode-aware
# case-insensitive scans, and over 1.7 MB cspell trie dictionaries (typed text)
# the E*TRADE and Citibank ones each ran 90-240 s and were reported as analysis
# bombs, so the whole file is bounded.
defaults:
  platforms: [unix, windows]
  for: [html, text, markdown, makefile]
  size_max: 1048576

traits:
  - id: html-msonormal-table-class
    desc: HTML table uses the MsoNormalTable class
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'class="MsoNormalTable"'
  - id: html-merge-company-placeholder
    desc: HTML template merges company placeholder
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: '{{COMPANY}}'
  - id: html-merge-favicon-placeholder
    desc: HTML template merges favicon placeholder
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: '{{FAVICON}}'
  # Bank-phish lure copy: the E*TRADE asterisk brand is distinctive enough to
  # key on directly; legitimate E*TRADE mail carries it too, so this stays a
  # neutral capability and lure intent comes from the phishing composites.
  - id: etrade-brand-reference
    desc: References E*TRADE brand text
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'E\s*\*\s*TRADE'
      case_insensitive: true
      exclude_html_comments: true
  - id: usbank-brand-reference
    desc: References U.S. Bank brand text
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'U\.S\.\s*Bank\b'
      case_insensitive: true
      exclude_html_comments: true
  - id: ebay-brand-reference
    desc: References eBay brand text
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\beBay\b'
      exclude_html_comments: true

  - id: paypal-brand-reference
    desc: References PayPal brand text
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bPayPal\b'
      exclude_html_comments: true
  # "confirm your e-mail address" / "confirm your personal information".
  # Banks say this too, so the lure composites add the deceptive link.
  - id: confirm-contact-information-request
    desc: Asks to confirm contact information
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)confirm your (e-?mail address|personal information)'
      exclude_html_comments: true
  # Account-compromise scare pretext, reused across bank brands ("account may
  # have been accessed by an unauthorized third party"). Real fraud alerts use
  # the same vocabulary, so this stays notable; the lure composites pair it
  # with brand or salutation context.
  - id: unauthorized-account-access-pretext
    desc: Claims account accessed by unauthorized party
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)account.{0,60}(accessed|compromised) by (an? )?(unauthorized|outside|third) \w+'
      exclude_html_comments: true
  # Kits misspell the article ("accessed by and unauthorized") and break the
  # phrase across a line. The spaced form above does not cover that typo.
  - id: and-unauthorized-access-pretext
    desc: Claims and-unauthorized account access
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)accessed by and\s+unauthorized'
      exclude_html_comments: true
  # Same claim when a mail line break sits between "account" and "accessed".
  - id: unauthorized-access-across-break
    desc: Claims unauthorized access across a break
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)account.{0,40}accessed by an unauthorized'
      exclude_html_comments: true
  # Account-suspension scare pretext ("account has been suspended", "suspension
  # of this account"). Phishing lures urge immediate record updates to lift
  # the block. This stays notable; composites pair it with brand and link context.
  - id: account-suspension-pretext
    desc: Claims account has been suspended
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\baccount.{0,40}(has been|is|will be)\s+suspended\b|\bsuspension of this account\b'
      exclude_html_comments: true
  # Verb-first twin ("we have temporarily suspended activity on your account"):
  # the scare names the completed action. Same notable standing.
  - id: suspended-account-pretext
    desc: Claims account or activity was suspended
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bsuspended\s+(activity\s+on\s+|access\s+to\s+)?(your|this)\s+account\b'
      exclude_html_comments: true
  # Suspension-by-verb variant ("suspend access to your account"): the scare
  # names the threatened action instead of the resulting state. Same
  # notable-only standing; composites pair it with brand and link context.
  - id: suspend-access-account-pretext
    desc: Threatens suspending account access
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bsuspend\s+(access\s+to\s+)?(your|this)\s+account\b'
      exclude_html_comments: true
  # Card-PIN update requests can be legitimate notices, so the pretext stays
  # notable and phishing composites add brand and destination deception.
  - id: payment-card-pin-update-pretext
    desc: Directs user to update payment card PIN
    crit: notable
    conf: 0.92
    for: [html, makefile, text]
    if:
      type: text
      regex: '(?i)(update|change|reset)[^.<]{0,50}\b((ATM|debit|payment)\s+)?card\b[^.<]{0,40}\bPIN\b'
      exclude_html_comments: true
  # Conditional variants can threaten suspension as the consequence of not
  # performing the requested action.
  - id: conditional-account-suspension-threat
    desc: Threatens suspension when action is incomplete
    crit: notable
    conf: 0.9
    for: [html, makefile, text]
    if:
      type: text
      regex: '(?i)account[^.<]{0,100}\bmay be subject to (temporary )?suspension\b'
      exclude_html_comments: true
  # Lost-or-stolen card notice ("a card ... has been reported as lost or
  # stolen"). Genuine fraud departments send these too, so this stays
  # notable; composites pair it with brand and link deception.
  - id: lost-stolen-card-pretext
    desc: Reports card lost or stolen
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\breported as lost or stolen\b|\bcard\b[^.<]{0,40}\blost or stolen\b'
      exclude_html_comments: true

  # Impersonal "Dear <brand> user" salutation. Legitimate banks personalize;
  # phish kits use the generic form. Bulk mail does too, so this stays notable
  # until a composite pairs it with scare copy.
  - id: impersonal-brand-user-salutation
    desc: Impersonal Dear-brand-user salutation
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)Dear\s+[A-Za-z0-9*.''''() -]{2,30}\s+(user|account holder|customer|member)\b'
      exclude_html_comments: true

  # Account limitation/restriction scare pretext ("access to your account
  # will be limited", "your access to use our services has been limited").
  - id: account-limitation-pretext
    desc: Claims account access is limited
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(\byour\s+access[^.<]{0,40}|\baccount\s+)(will be|has been|is)\s+(limited|restricted)'
      exclude_html_comments: true
  # Verb-first twin ("we have limited access to your account", including
  # an adverb such as "temporarily"): the scare names the action.
  - id: limited-access-to-account-pretext
    desc: Claims access to the account was limited
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(have|has)\s+\w{0,14}\s*limited\s+access\s+to[\s\S]{0,40}account'
      exclude_html_comments: true

  - id: remove-limitations-pretext
    desc: Urges steps to remove account limitations
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(steps\s+to\s+)?(remove|lift)\s+(the\s+)?limitations?\b'
      exclude_html_comments: true

  # Citibank brand copy. The bank's own pages carry it too, so this stays a
  # neutral brand marker; the phishing composites pair it with scare copy or
  # link deception.
  - id: citibank-brand-reference
    desc: References Citibank brand text
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i-u)\bciti[\s-]?bank\b'
      exclude_html_comments: true

  # Agreement/terms-update pretext ("has not been updated to the latest ...
  # Agreement"): the record-update lure of bank confirmation phishes. Real
  # notices announce genuine agreement changes, so this stays notable;
  # composites pair it with brand or link-deception context.
  - id: account-agreement-update-pretext
    desc: Claims account needs agreement reconfirmation
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)not\s+been\s+updated\s+to\s+the\s+latest[^<]{0,100}(agreement|terms)'
      exclude_html_comments: true

  # New-terms pretext ("our new Terms & Conditions"): the consent lure that
  # rides with agreement-update phish copy. Real notices use the phrase too,
  # so this stays notable; composites add the brand or deceptive link.
  - id: new-terms-conditions-pretext
    desc: Cites new terms and conditions
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)new\s+terms\s*(&amp;|&)\s*conditions'
      exclude_html_comments: true

  # Identity-confirmation directive ("confirming your identity", "verify your
  # identity"): banks use it in genuine flows too, so this stays notable; the
  # composites add the brand or deceptive-link context that makes it a lure.
  - id: identity-confirmation-request-pretext
    desc: Directs user to confirm their identity
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)(confirming|verifying|confirm|verify)\s+your\s+identity'
      exclude_html_comments: true

  # SunTrust banking brand reference
  - id: washington-mutual-brand-reference
    desc: References Washington Mutual brand text
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\b(Washington\s+Mutual|wamu(\.com)?)\b'
      exclude_html_comments: true

  - id: suntrust-brand-reference
    desc: References SunTrust brand text
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bSun\s*Trust(\s+Bank)?\b'
      exclude_html_comments: true

  # Wording alone establishes neither a bank nor an update request.
  # Phishing consumers supply their own brand and deception evidence.
  - id: certificate-wording-reference
    desc: Certificate type or update-center wording
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(electronic|digital|security)\s+certificate|certificate\s+update\s+center'
      exclude_html_comments: true

  # Billing-records update pretext ("Billing Information records are out of
  # date", "update your billing records"): the record-update lure of payment
  # and bank confirmation phishes. Genuine billing notices use the same
  # phrases, so this stays notable; composites pair it with link deception.
  - id: billing-records-update-pretext
    desc: Urges billing records update
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'billing\s+(information\s+)?records?\b'
      case_insensitive: true
      exclude_html_comments: true

  # Account-termination deadline threat ("will result in account
  # termination"). Genuine service notices threaten termination too, so this
  # stays notable; composites pair it with link deception or brand context.
  - id: account-termination-threat-pretext
    desc: Threatens account termination
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'results?\s+in\s+account\s+termination'
      case_insensitive: true
      exclude_html_comments: true

  # Same deadline threat naming suspension instead of termination
  # ("will result in account suspension"). Genuine notices use it too.
  - id: account-suspension-threat-pretext
    desc: Threatens account suspension
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'results?\s+in\s+account\s+suspension'
      case_insensitive: true
      exclude_html_comments: true

  # "our bank ... security" update copy. Genuine bank mail uses it too, so
  # this stays notable; the IP-hosted link composite supplies the deception.
  - id: bank-payment-security-update-pretext
    desc: Bank claims payment security update
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(our|your)\s+bank\b.{0,80}\bsecurity\b'
      exclude_html_comments: true

  # Bank security warning alert pretext ("BANK WARNING", "protection of your assets")
  - id: bank-security-warning-pretext
    desc: Claims bank security alert or warning
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bbank\s+warning\b|protection of (all )?your assets'
      exclude_html_comments: true

  # Chase banking brand reference, keyed on brand-adjacent tokens (logo, team,
  # bank, domain) rather than the bare word, which is also a common verb.
  # The bank's own pages carry it too, so this stays a neutral brand marker;
  # the phishing composites pair it with scare copy or link deception.
  - id: chase-brand-reference
    desc: References Chase brand text
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)chase([_. ]?(logo|team|bank)|\.com)\b'
      exclude_html_comments: true

  # Unusual-activity verification pretext ("noticed unusual activities on your
  # account ... verify your account information"): the record-confirmation lure
  # of bank verification phishes. Genuine fraud alerts use the same wording,
  # so this stays notable; composites pair it with brand or fallback-button
  # context.
  - id: unusual-activity-verify-pretext
    desc: Urges verification over unusual activity
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)unusual activit[^.<]{0,60}account[^.<]{0,100}verif'
      exclude_html_comments: true

  # Outlook-only VML call-to-action button (v:roundrect/v:button with an href).
  # These live inside <!--[if mso]> conditional comments by design, so unlike
  # the other atoms here this one must NOT exclude HTML comments. Legitimate
  # marketing mail uses them, so this stays notable; composites pair it with
  # verify-lure copy that legitimate mail rarely carries beside such a button.
  - id: mso-vml-cta-button
    desc: Outlook-only VML call-to-action button
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)<v:(roundrect|button)[^>]{0,300}href\s*='
  - id: caja-madrid-brand-reference
    desc: References Caja Madrid brand
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bCaja\s+Madrid\b'
      exclude_html_comments: true
  - id: spanish-account-will-be-suspended
    desc: Says the account will be suspended
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bcuenta\s+ser[aá]\s+suspendida\b'
      exclude_html_comments: true
  - id: spanish-secret-question-request
    desc: Asks for a secret question
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bpregunta\s+secreta\b'
      exclude_html_comments: true
  - id: view-document-credential-pretext
    desc: Urges login with password to view document
    crit: notable
    conf: 0.92
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\b(sign|log)\s*in\b[^<]{0,40}\bpassword\b[^<]{0,40}\bview\b'


