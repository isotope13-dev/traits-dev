# HTML email bodies used as phishing or bulk-mail templates.
# An e-mail body is a few KB. The brand and pretext matchers are Unicode-aware
# case-insensitive scans, and over 1.7 MB cspell trie dictionaries (typed text)
# the E*TRADE and Citibank ones each ran 90-240 s and were reported as analysis
# bombs, so the whole file is bounded.
defaults:
  platforms: [unix, windows]
  for: [html, text, markdown]
  size_max: 1048576

traits:
  - id: html-msonormal-table-class
    desc: HTML table uses the MsoNormalTable class
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: 'class="MsoNormalTable"'
  - id: html-merge-company-placeholder
    desc: HTML template merges company placeholder
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: '{{COMPANY}}'
  - id: html-merge-favicon-placeholder
    desc: HTML template merges favicon placeholder
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: '{{FAVICON}}'
  # Bank-phish lure copy: the E*TRADE asterisk brand is distinctive enough to
  # key on directly; legitimate E*TRADE mail carries it too, so this stays a
  # neutral capability and lure intent comes from the phishing composites.
  - id: etrade-brand-reference
    desc: References E*TRADE brand text
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'E\s*\*\s*TRADE'
      case_insensitive: true
      exclude_html_comments: true
  - id: usbank-brand-reference
    desc: References U.S. Bank brand text
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'U\.S\.\s*Bank\b'
      case_insensitive: true
      exclude_html_comments: true
  - id: ebay-brand-reference
    desc: References eBay brand text
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\beBay\b'
      exclude_html_comments: true
  # Account-compromise scare pretext, reused across bank brands ("account may
  # have been accessed by an unauthorized third party"). Real fraud alerts use
  # the same vocabulary, so this stays notable; the lure composites pair it
  # with brand or salutation context.
  - id: unauthorized-account-access-pretext
    desc: Claims account accessed by unauthorized party
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)account.{0,60}(accessed|compromised) by (an? )?(unauthorized|outside|third) \w+'
      exclude_html_comments: true
  # Account-suspension scare pretext ("account has been suspended", "suspension
  # of this account"). Phishing lures urge immediate record updates to lift
  # the block. This stays notable; composites pair it with brand and link context.
  - id: account-suspension-pretext
    desc: Claims account has been suspended
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\baccount.{0,40}(has been|is)\s+suspended\b|\bsuspension of this account\b'
      exclude_html_comments: true
  # Impersonal "Dear <brand> user" salutation. Legitimate banks personalize;
  # phish kits use the generic form. Bulk mail does too, so this stays notable
  # until a composite pairs it with scare copy.
  - id: impersonal-brand-user-salutation
    desc: Impersonal Dear-brand-user salutation
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)Dear\s+[A-Za-z0-9*.''''() -]{2,30}\s+(user|account holder|customer|member)\b'
      exclude_html_comments: true

  # Account limitation/restriction scare pretext ("access to your account
  # will be limited", "your access to use our services has been limited").
  - id: account-limitation-pretext
    desc: Claims account access is limited
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(\byour\s+access[^.<]{0,40}|\baccount\s+)(will be|has been|is)\s+(limited|restricted)'
      exclude_html_comments: true

  # Citibank brand copy. The bank's own pages carry it too, so this stays a
  # neutral brand marker; the phishing composites pair it with scare copy or
  # link deception.
  - id: citibank-brand-reference
    desc: References Citibank brand text
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i-u)\bciti[\s-]?bank\b'
      exclude_html_comments: true

  # Agreement/terms-update pretext ("has not been updated to the latest ...
  # Agreement"): the record-update lure of bank confirmation phishes. Real
  # notices announce genuine agreement changes, so this stays notable;
  # composites pair it with brand or link-deception context.
  - id: account-agreement-update-pretext
    desc: Claims account needs agreement reconfirmation
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)not\s+been\s+updated\s+to\s+the\s+latest[^<]{0,100}(agreement|terms)'
      exclude_html_comments: true

  # New-terms pretext ("our new Terms & Conditions"): the consent lure that
  # rides with agreement-update phish copy. Real notices use the phrase too,
  # so this stays notable; composites add the brand or deceptive link.
  - id: new-terms-conditions-pretext
    desc: Cites new terms and conditions
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)new\s+terms\s*(&amp;|&)\s*conditions'
      exclude_html_comments: true

  # Identity-confirmation directive ("confirming your identity", "verify your
  # identity"): banks use it in genuine flows too, so this stays notable; the
  # composites add the brand or deceptive-link context that makes it a lure.
  - id: identity-confirmation-request-pretext
    desc: Directs user to confirm their identity
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)(confirming|verifying|confirm|verify)\s+your\s+identity'
      exclude_html_comments: true

  # SunTrust banking brand reference
  - id: suntrust-brand-reference
    desc: References SunTrust brand text
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bSun\s*Trust(\s+Bank)?\b'
      exclude_html_comments: true

  # Bank certificate update pretext ("ELECTRONIC CERTIFICATE", "digital certificate update", "certificate update center")
  - id: bank-certificate-update-pretext
    desc: Urges bank security certificate update
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(electronic|digital|security)\s+certificate|certificate\s+update\s+center'
      exclude_html_comments: true

  # Bank security warning alert pretext ("BANK WARNING", "protection of your assets")
  - id: bank-security-warning-pretext
    desc: Claims bank security alert or warning
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bbank\s+warning\b|protection of (all )?your assets'
      exclude_html_comments: true


