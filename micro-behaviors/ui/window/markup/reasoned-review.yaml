# Evidence-specific placement; matching does not imply attacker intent.
traits:
- platforms:
  - unix
  - windows
  for:
  - html
  - text
  - markdown
  - makefile
  size_max: 1048576
  id: identity-confirmation-request-text
  desc: Text asks users to confirm their identity
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: (?i)(confirming|verifying|confirm|verify)\s+your\s+identity
    exclude_html_comments: true
defaults: {}
