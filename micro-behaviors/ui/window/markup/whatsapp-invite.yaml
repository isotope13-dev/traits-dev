# WhatsApp group-invite page text: the brand's invite claim and the
# adult-content hook that scam clones use as a traffic lure. Both are neutral
# alone (real invite pages and legitimate adult communities share the words);
# the harvest composites pair them with credential routing.
defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: whatsapp-group-invite-claim
    desc: Page presents a WhatsApp group invite
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)whatsapp\s+group\s+invite'
      exclude_html_comments: true
  # Split by order (regex budget): the marker before the join affordance,
  # as in "adults 18+ only, join chat". Consumed with an any-leg so either
  # order pairs with the invite claim or the login route.
  - id: adult-hook-before-join
    desc: Adult-age marker before group join
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)18\s*\+[\s\S]{0,300}(group\s+invite|join\s+chat)'
      exclude_html_comments: true
  - id: adult-hook-after-join
    desc: Group join before adult-age marker
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(group\s+invite|join\s+chat)[\s\S]{0,300}18\s*\+'
      exclude_html_comments: true
