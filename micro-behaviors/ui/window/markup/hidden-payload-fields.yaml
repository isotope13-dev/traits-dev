defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.96
traits:
  - id: large-hidden-base64-input-values
    desc: Hidden inputs hold long Base64-shaped values
    if:
      type: text
      regex: '(?i)<input\s+hidden\b[^>]{0,120}\bvalue=["''][A-Za-z0-9+/]{256}'
      exclude_html_comments: true
    count_min: 3
  - id: displayed-document-password
    desc: Page displays a document password label
    if:
      type: text
      regex: '(?i)\b(document|archive|file)\s+password\s*:'
      exclude_html_comments: true
