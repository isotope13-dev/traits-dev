# HTML markup tokens used to draw synthetic browser window chrome (title bar,
# traffic-light buttons, URL/omnibox bar). Neutral UI-building blocks on their
# own; phishing intent is asserted only when objectives composites combine
# these with identity-provider login hosts or login iframes.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.86

traits:
  - id: synthetic-url-bar-markup
    desc: Markup for a synthetic URL bar
    conf: 0.88
    if:
      type: text
      regex: '(?i)(id|class)\s*=\s*["''][^"'']{0,30}(url-?bar|omnibox)'

  - id: synthetic-window-chrome-markup
    desc: Markup for synthetic window title-bar chrome
    if:
      type: text
      # Require hyphenated title-bar or explicit window chrome controls.
      # VS Code webview custom title bars use class="titlebar" (no hyphen) and
      # are not browser-in-browser spoofing.
      regex: '(?i)<(div|header|section)\b.{0,120}(title-bar|window-controls|traffic-lights?)'

  - id: vscode-webview-titlebar-header
    desc: VS Code webview title bar header markup
    if:
      type: text
      regex: '(?i)<header\s+class="titlebar"'
