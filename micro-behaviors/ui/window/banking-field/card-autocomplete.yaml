defaults:
  platforms: [windows, unix]
  for: [html, php, javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: card-number-autocomplete-input
    desc: Input declares payment-card number autocomplete
    if:
      type: text
      exclude_html_comments: true
      case_insensitive: true
      regex: '<input\b[^>]{0,180}\bautocomplete\s*=\s*["'']cc-number["'']'
  - id: card-security-autocomplete-input
    desc: Input declares card security-code autocomplete
    if:
      type: text
      exclude_html_comments: true
      case_insensitive: true
      regex: '<input\b[^>]{0,180}\bautocomplete\s*=\s*["'']cc-csc["'']'
