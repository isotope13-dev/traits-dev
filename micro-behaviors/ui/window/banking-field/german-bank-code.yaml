# German bank-code (Bankleitzahl/BLZ) input fields: the routing-code half of
# German banking logins, twin to the UK sort-code field over in
# objectives/credential-access/phishing/ui. Kits harvesting Sparkasse and
# other German online-banking credentials ship a `blz` input beside the
# username and PIN; the field alone is a neutral banking capability, and
# the landing composites add the password POST that makes it a harvest.
defaults:
  platforms: [unix, windows]
  for: [html, php]
  crit: notable
  conf: 0.88

traits:
  - id: german-bank-code-input
    desc: Bankleitzahl bank-code input field
    if:
      type: text
      regex: '(?i)<input[^>]{0,240}(bankleitzahl|["'']blz["''])[^>]{0,120}>'
