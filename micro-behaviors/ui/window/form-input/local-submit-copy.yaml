defaults:
  platforms: [windows, unix]
  for: [html, javascript, rtf]
  crit: notable
  conf: 0.95

traits:
  - id: jquery-copy-value-before-cancel
    desc: Copies field value before canceling submission
    if:
      type: text
      regex: '\.val\([\w$]+\.val\(\)\);[^{}]{0,240}\}\s*return\s+false'
