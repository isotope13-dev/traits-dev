# Neutral observations relocated during release-diff triage.
defaults:
  platforms: [windows, unix]
  crit: notable
traits:
- for:
  - html
  - javascript
  - typescript
  - php
  id: noscript-fallback-form
  desc: No-JavaScript form fallback
  conf: 0.9
  if:
    type: text
    regex: (?is)<noscript\b.{0,500}<form\b
- for:
  - php
  - html
  id: html-account-named-input
  desc: HTML input has an account-related name
  conf: 0.86
  if:
    type: text
    regex: (?i)<input[^>]{0,240}(name|id)[^>]{0,120}(account|crd_acc)[^>]{0,120}>
