defaults:
  for: [javascript, typescript, html]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: emitter-event-value
    desc: Emits browser event target value
    if:
      type: text
      regex: '\.emit\s*\([^;\n]{0,160}\b\w+\.target\.value'
  - id: payment-autocomplete-selector
    desc: Payment card autocomplete field selector
    if:
      type: string_literal
      regex: '\[autocomplete\s*=\s*["'']cc-(number|csc)["'']\]'
  - id: otp-autocomplete-selector
    desc: One-time code autocomplete field selector
    if:
      type: string_literal
      regex: '\[autocomplete\s*=\s*["'']one-time-code["'']\]'
composite_rules:
  - id: edit-handler-emits-value
    desc: Input listener accompanies event value emission
    crit: notable
    near_bytes: 180
    all:
      - id: element-value-event-listener
      - id: emitter-event-value
