# Neutral observation; objective consumers supply attack context.
defaults:
  platforms:
  - unix
  - windows
  for:
  - html
  - javascript
  - typescript
traits:
- id: form-value-member-read
  desc: Reads a browser form value member
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)\b(input|option|form)\s*\.\s*(value|innerText)\b
composite_rules:
- id: browser-form-value-read
  desc: Browser code reads a form value
  crit: notable
  conf: 0.92
  any:
  - id: micro-behaviors/ui/window/form-input::form-value-member-read
  - id: micro-behaviors/ui/window/form-input::browser-event-target-value-reference
  - id: micro-behaviors/ui/window/form-input::browser-native-form-value-descriptor-read
