# Personal-data field labels in documents are neutral form behavior. They are
# useful evidence only as a group; ordinary onboarding and application forms
# can legitimately request the same fields, so intent is supplied by consuming
# objective composites rather than by these labels.
defaults:
  platforms: [windows, unix]
  for: [xml, html, pdf, rtf, text]
  crit: component
  conf: 0.9

traits:
  - id: residential-address-field-label
    desc: Residential or official address field label
    if:
      type: text
      substr: Residential/Official
      case_insensitive: true

  - id: telephone-mobile-field-label
    desc: Telephone or mobile number field label
    if:
      type: text
      substr: Telephone/Mobile
      case_insensitive: true

  - id: occupation-job-field-label
    desc: Occupation or job title field label
    if:
      type: text
      substr: Occupation/Job
      case_insensitive: true

  - id: birth-age-field-label
    desc: Birth date or age field label
    if:
      type: text
      substr: Birth/Age
      case_insensitive: true

composite_rules:
  - id: personal-data-questionnaire
    desc: Document requests multiple personal-data fields
    crit: notable
    conf: 0.94
    needs: 3
    any:
      - id: residential-address-field-label
      - id: telephone-mobile-field-label
      - id: occupation-job-field-label
      - id: birth-age-field-label
