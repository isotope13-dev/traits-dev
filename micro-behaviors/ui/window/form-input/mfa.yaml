# Markup and selectors that name a second-factor input.
#
# A one-time-code box is ordinary authentication UI: the real identity provider
# renders one, and so does every application that supports TOTP. These atoms
# therefore say only "this page has, or reaches for, an MFA field". They were
# previously defined under objectives/credential-access/phishing/mfa-relay/,
# where the directory alone read the presence of a verification-code box as a
# phishing kit. The relay composites still reference them and supply the intent
# (collection paired with off-origin delivery and a post-auth redirect).
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript, php]
  crit: notable
  conf: 0.92

traits:
  - id: html-otp-input-field
    desc: HTML OTP input field
    if:
      type: text
      regex: '(?i)<input\b.{0,100}(otp|mfa|factor)'

  - id: html-verification-input-field
    desc: HTML verification-code input
    if:
      type: text
      # Anti-CSRF fields such as __RequestVerificationToken contain the word
      # "verification" but do not collect a code from the victim.  Require a
      # verification-code or passcode token in the input tag.
      regex: '(?i)<input\b.{0,100}(verification|passcode)[-_ ]?code\b'

  - id: js-mfa-field-selector
    desc: JavaScript MFA field selector
    if:
      type: text
      regex: '(?i)querySelector.{0,80}\binput\b.{0,30}(otp|mfa|verification|passcode)'

  - id: one-time-password-phrase
    desc: One-time password UI phrase
    conf: 0.9
    if:
      type: text
      substr: One Time Password

  - id: authenticator-app-phrase
    desc: Authenticator app UI phrase
    conf: 0.9
    if:
      type: text
      substr: authenticator app
      case_insensitive: true

composite_rules:
  - id: browser-mfa-field-reference
    desc: Browser MFA field reference
    crit: notable
    conf: 0.94
    any:
      - id: html-otp-input-field
      - id: html-verification-input-field
      - id: js-mfa-field-selector
      - id: one-time-password-phrase
      - id: authenticator-app-phrase
