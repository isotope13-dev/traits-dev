# Stylesheet declarations that change how a native form control renders.
# `appearance: none` on a select is the standard reset every CSS framework
# ships (Tailwind forms, Bootstrap, daisyUI, Bulma), so on its own it is a
# neutral styling fact. Composites that infer concealment — e.g. the masked
# select keylogger in objectives/collection/keylog/css-selector/ — pair it
# with the opacity/text-security legs that supply the intent.
defaults:
  platforms: [unix, windows]
  for: [html, text]

traits:
  - id: select-appearance-none-style
    desc: Stylesheet removes native select appearance
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bselect\s*\{[^}]{0,600}\bappearance\s*:\s*none\b'
