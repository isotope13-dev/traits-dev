defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  attack: T1056.001

traits:
  - id: password-field-attribute-update
    desc: "Password field and attribute-setting context"
    crit: suspicious
    conf: 0.88
    for: [html]
    if:
      type: text
      regex: 'type="password"[\s\S]{0,260}setAttribute\('
composite_rules:
  - id: password-field-stylesheet-attribute-context
    desc: "Password field attribute update with stylesheet reference"
    crit: suspicious
    conf: 0.93
    for: [html]
    all:
      - id: micro-behaviors/fs/path/reference::bad-css-href
      - id: micro-behaviors/ui/window/form-input::password-field-attribute-update
