# Structural fields used by browser-based remote-support workflows. Individual
# fields are neutral UI capabilities; scam intent is established by composites
# that require the remote-session, financial, operator, and delivery context.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript, php]
  crit: notable
  conf: 0.9

traits:
  - id: remote-session-id-input
    desc: Browser requests a remote-session ID
    if:
      type: text
      regex: '(?i)\bname\s*=\s*["'']remote(access)?[-_]?(id|code)["'']'

  - id: remote-session-secret-input
    desc: Browser form requests a remote-session password
    if:
      type: text
      regex: '(?i)\bname\s*=\s*["'']remote(access)?[-_]?(password|passcode|secret)["'']'

  - id: support-agent-id-input
    desc: Browser form requests a support-agent identifier
    if:
      type: text
      regex: '(?i)\bname\s*=\s*["''](support[-_]?)?agent[-_]?id["'']'

  - id: support-agent-name-input
    desc: Browser form requests a support-agent name
    if:
      type: text
      regex: '(?i)\bname\s*=\s*["''](support[-_]?)?agent[-_]?name["'']'

  - id: refund-amount-input
    desc: Browser form requests a refund amount
    if:
      type: text
      regex: '(?i)\bname\s*=\s*["'']refund[-_]?(amount|value)["'']'

  - id: bank-name-input
    desc: Browser form requests a bank name
    if:
      type: text
      regex: '(?i)\bname\s*=\s*["'']bank[-_]?name["'']'

  - id: crypto-account-input
    desc: Browser requests a cryptocurrency account
    if:
      type: text
      regex: '(?i)\bname\s*=\s*["''](crypto|bitcoin)[-_]?(user(name)?|account|wallet)["'']'

  - id: antivirus-product-input
    desc: Browser form requests an antivirus product name
    if:
      type: text
      regex: '(?i)\bname\s*=\s*["''](antivirus|security)[-_]?(product|software|name)["'']'
