# An input value compared against a dash-grouped uppercase literal such as
# "ABCD12-PRO-FREE": a hardcoded activation/unlock code checked client-side.
traits:
  - id: input-value-hardcoded-code-compare
    desc: Compares input to hardcoded unlock code
    crit: notable
    conf: 0.86
    platforms: [windows, unix]
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\.value(\.trim\(\))? ?===? ?["''][A-Z0-9]{3,}(-[A-Z0-9]{2,}){1,3}["'']'
