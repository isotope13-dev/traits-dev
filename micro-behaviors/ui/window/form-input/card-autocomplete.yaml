defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: reads-card-number-autocomplete
    desc: Assigns card-number autocomplete value
    if:
      type: text
      exclude_comments: true
      regex: "===?\\s*['\"]cc-number['\"][^;\\n]{0,80}\\)\\s*[^;\\n]{0,80}=\\s*[\\w$]+"
  - id: reads-card-expiry-autocomplete
    desc: Assigns card-expiry autocomplete value
    if:
      type: text
      exclude_comments: true
      regex: "===?\\s*['\"]cc-exp['\"][^;\\n]{0,80}\\)\\s*[^;\\n]{0,80}=\\s*[\\w$]+"
  - id: reads-card-security-autocomplete
    desc: Assigns card-security autocomplete value
    if:
      type: text
      exclude_comments: true
      regex: "===?\\s*['\"]cc-csc['\"][^;\\n]{0,80}\\)\\s*[^;\\n]{0,80}=\\s*[\\w$]+"
composite_rules:
  - id: reads-card-autocomplete-inputs
    desc: Reads card number, expiry and security code
    near_bytes: 1000
    all:
      - id: reads-card-number-autocomplete
      - id: reads-card-expiry-autocomplete
      - id: reads-card-security-autocomplete
