# Native masked-password input controls. These widgets are legitimate UI
# capabilities on their own; phishing intent comes from objective composites
# that combine them with a system-login impersonation surface.
defaults:
  platforms: [windows]
  for: [source]

traits:
  - id: native-masked-password-control
    desc: Native EDIT control uses password mask
    crit: notable
    conf: 0.94
    for: [c, cpp, rust, go]
    if:
      type: text
      regex: '(?is)\bL?["'']EDIT["''].{0,300}\bES_PASSWORD\b'

  - id: dotnet-masked-password-control
    desc: .NET password control enables masking
    crit: notable
    conf: 0.92
    for: [csharp]
    if:
      type: text
      regex: '\bUseSystemPasswordChar\s*=\s*true\b|\bPasswordChar\s*=\s*[^;\r\n]{1,40}'

composite_rules:
  - id: windows-masked-password-control
    desc: Creates a masked Windows password control
    crit: notable
    conf: 0.96
    any:
      - id: native-masked-password-control
      - id: dotnet-masked-password-control
