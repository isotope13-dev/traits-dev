defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: autocomplete-username-attribute
    desc: Username autocomplete attribute text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'autocomplete\s*=\s*[''\"]username[''\"]'

  - id: autocomplete-current-password-attribute
    desc: Password autocomplete attribute text
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'autocomplete\s*=\s*[''\"]current-password[''\"]'

