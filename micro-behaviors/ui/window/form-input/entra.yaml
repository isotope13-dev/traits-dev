# Microsoft Entra sign-in field names are provider-specific UI observations.
# A first-party Entra page and a browser automation workflow can contain these
# same fields, so the fields themselves are neutral. Phishing composites add
# the off-origin collection and post-auth navigation that infer hostile intent.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9

traits:
  - id: entra-loginfmt-field-reference
    desc: References the Entra loginfmt account field
    if:
      type: text
      regex: '(?i)(\bname\s*=\s*["'']?loginfmt\b|\[\s*["'']loginfmt["'']\s*\])'

  # Kits reach these fields through rendered name attributes or selector-style
  # field expressions. Require that context because `otc` and `passwd` alone
  # are short enough to collide with unrelated text.
  - id: entra-otc-markup-field
    desc: Markup names the Entra otc code field
    conf: 0.88
    if:
      type: text
      regex: '(?i)name\s*=\s*["'']?otc\b'

  - id: entra-otc-literal-field
    desc: Field expression names the Entra otc field
    conf: 0.86
    if:
      type: text
      regex: '(?i)name\s*:\s*["'']?otc\b'

  - id: entra-passwd-markup-field
    desc: Markup names the Entra passwd field
    conf: 0.85
    if:
      type: text
      regex: '(?i)name\s*=\s*["'']?passwd\b'

  - id: entra-passwd-literal-field
    desc: Field expression names the Entra passwd field
    conf: 0.8
    if:
      type: text
      regex: '(?i)name\s*:\s*["'']?passwd\b'

composite_rules:
  - id: entra-otc-field-reference
    desc: References the Entra one-time-code field
    conf: 0.88
    any:
      - id: entra-otc-markup-field
      - id: entra-otc-literal-field

  - id: entra-passwd-field-reference
    desc: References the Entra passwd field
    conf: 0.85
    any:
      - id: entra-passwd-markup-field
      - id: entra-passwd-literal-field

  - id: entra-signin-field-set
    desc: Contains Entra account password and code fields
    conf: 0.94
    needs: 3
    any:
      - id: entra-loginfmt-field-reference
      - id: entra-otc-field-reference
      - id: entra-passwd-field-reference
