defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

composite_rules:
  - id: dom-event-value-reporting-call
    desc: Value reporting and DOM edit/submit listener coexist
    scope: file
    all:
      - id: micro-behaviors/data/property/access::value-property-reporting-call
    any:
      - id: micro-behaviors/ui/window/form-input::element-edit-event-listener
      - id: micro-behaviors/ui/window/form-input::form-submit-listener
