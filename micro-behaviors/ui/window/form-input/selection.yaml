defaults:
  for: [javascript, typescript, html]
  platforms: [unix, windows]
traits:
  - id: zero-argument-select-call
    desc: Calls a zero-argument select method
    crit: notable
    conf: 0.8
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @method)
          arguments: (arguments) @args) @call
          (#eq? @method "select")
          (#eq? @args "()"))
