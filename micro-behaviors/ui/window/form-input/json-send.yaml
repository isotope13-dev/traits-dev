defaults:
  for: [javascript, typescript, html]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
traits:
  - id: send-json-selected-input-value
    desc: Sends JSON containing a selected input value
    if:
      type: text
      regex: '\.send\s*\(\s*JSON\.stringify\s*\(\s*\{[^;]{0,160}querySelector\([^;]{0,80}\.value'
