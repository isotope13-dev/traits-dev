defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: browser-phone-input-marker
    desc: Browser markup requests a phone number
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript, php]
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,80}(type\s*=\s*["'']tel["'']|name\s*=\s*["''](phone|mobile|telephone)["''])'

  - id: browser-password-input-literal
    desc: JavaScript string names a password input field
    crit: component
    conf: 0.9
    for: [javascript, typescript]
    if:
      # Parser literals exclude examples embedded in comments and declaration
      # documentation while retaining HTML template strings and selectors.
      type: literal
      regex: '(?i)(type\s*=\s*["'']password["'']|\[name\s*=\s*["'']password["''])'
    unless:
      # Form-validation and editor libraries bind delegated handlers to every
      # input type at once, so `[type='password']` turns up as one element of
      # a selector list beside `[type='color']` and `[type='range']`. Such a
      # list targets no particular field and must not read as a credential
      # form; a real login page or harvester names the password field alone.
      - type: text
        regex: '\[type\s*=\s*["''][a-z-]{2,18}["'']\][\s\S]{0,12}\[type\s*='
        case_insensitive: true

  - id: browser-password-input-markup
    desc: HTML markup names a password input field
    crit: component
    conf: 0.9
    for: [html, php]
    if:
      type: text
      regex: '(?i)(type\s*=\s*["'']password["'']|\[name\s*=\s*["'']password["''])'

  - id: password-input-query-selector
    desc: Queries a browser password input field
    crit: notable
    conf: 0.92
    for: [html, javascript, typescript, php]
    if:
      type: text
      # Both tokens must sit inside the selector argument — `[^)]` stops the
      # match at the closing paren. The previous `.{0,80}…\binput\b.{0,30}`
      # form let the word arrive from whatever followed the call, so
      # `querySelector(`input`).value = settings.password` (EasyProxy's popup,
      # whose fields are `type="text"`) read as a query for a password field.
      regex: '(?i)querySelector\w{0,3}\([^)]{0,20}input[^)]{0,30}(password|passwd|passcode)'
    unless:
      # Legitimate show/hide-password toggles inspect the same field but do
      # not collect it.
      - type: text
        regex: '(?i)(toggle password visibility|this\.type\s*===\s*["'']password["''])'

  - id: password-focus-call
    desc: Focuses a password input
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript, php]
    if:
      type: text
      regex: '(?i)\b(password|passwd|passcode)\b[^\n]{0,160}\.focus\s*\('

  # `website` / `homepage` / `url` are the conventional anti-bot honeypot field
  # names, but they are equally the ordinary "your site" field of a comment,
  # contact or profile form (WordPress ships `<input name="url">` in every
  # comment form). The name alone proves nothing; hidden-field context is
  # represented by the composite below.
  - id: browser-website-url-input-marker
    desc: Markup names a website or url input
    crit: component
    conf: 0.86
    for: [html, javascript, typescript, php]
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,80}\bname\s*=\s*["''](website|homepage|url)["'']'

  - id: negative-tabindex-input
    desc: Input removed from the keyboard tab order
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript, php]
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,80}\btabindex\s*=\s*["'']-1["'']'

  - id: aria-hidden-input
    desc: Aria-hidden input
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript, php]
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,80}\baria-hidden\s*=\s*["'']?true'

  - id: hidden-style-input
    desc: Display-hidden input
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript, php]
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,120}\bdisplay\s*:\s*none'

  - id: capture-phase-input-listener
    desc: Registers capture-phase browser input listener
    if:
      type: text
      # Accept both named callbacks and inline handlers. The former matcher
      # stopped at the first comma inside an anonymous function body.
      regex: 'document\.addEventListener\(\s*["'']input["''][\s\S]{1,800},\s*true\s*\)'

  - id: document-input-listener
    # Sibling of `capture-phase-input-listener`, which requires the `, true)`
    # capture flag. A form grabber does not need the capture phase to see every
    # field -- the June 2024 WordPress.org plugin compromise registered a plain
    # bubble-phase `document.addEventListener("input", ...)` -- so the flagged
    # form alone left the technique unmatched.
    desc: Registers a document-wide input listener
    if:
      type: text
      regex: 'document\.addEventListener\(\s*["\'']input["\'']'

  - id: browser-input-selector
    desc: Browser selector targets input elements
    crit: component
    conf: 0.9
    if:
      type: string_literal
      regex: '(?i)(^|,)\s*input(\b|[\[.:#])'

  - id: browser-textarea-selector
    desc: Browser selector targets textarea elements
    crit: component
    conf: 0.9
    if:
      type: string_literal
      regex: '(?i)(^|,)\s*textarea(\b|[\[.:#])'

  - id: browser-contenteditable-selector
    desc: Browser selector targets editable page content
    crit: component
    conf: 0.92
    if:
      type: string_literal
      regex: '(?i)\[contenteditable(\]|[~|^$*]?=)'

  # `field` was in this alternation and matched every GraphQL/protobuf/ORM
  # descriptor loop (`field.type` / `field.value`) in server-side code, which is
  # not a browser form read at all. Swapped for `input`, the canonical DOM
  # form-field read that form-stealers use and that nothing here covered.
  - id: browser-form-control-value-read
    desc: Reads input, form or option value
    if:
      type: symbol
      kind: member
      regex: '(input|option|form)\.(value|innerText)$'
  - id: browser-value-event-member-read
    desc: Reads event/target value or innerText
    if:
      type: symbol
      kind: member
      regex: '(event|evt|target)\.(value|innerText)$'

  - id: generic-element-value-member-read
    desc: Reads generic element value member
    crit: component
    conf: 0.92
    if:
      type: symbol
      kind: member
      exact: element.value

  - id: native-form-element-type-check
    desc: Checks native browser form element type
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'instanceof\s+HTML(Input|TextArea|Select)Element'

  - id: browser-event-target-value-reference
    desc: Reads a browser event value
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(event|evt|e|inputEvent)\s*\.\s*(target|currentTarget)\s*\.\s*value\b'

  # Keep the value read and the send on one call site. A composite of the two
  # file-wide fragments mis-associated unrelated UI and analytics code in
  # minified bundles, especially when decoded-layer offsets mapped to one span.
  - id: browser-event-value-send-call
    desc: Sends a browser event value
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\.(send|postMessage)\s*\(\s*[$\w]+\s*\.\s*(target|currentTarget)\s*\.\s*value\b'

  # Inline JavaScript in HTML has no JavaScript call-site facts. Cover the
  # common form-grabber shape where the event value is nested inside a JSON
  # record passed to send(), while keeping source and sink on one call site.
  - id: browser-json-event-value-send-call
    desc: Sends JSON-wrapped browser event value
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\.send\s*\(\s*JSON\.stringify\s*\([\s\S]{0,400}\b\w+\.target\.value\b'

  - id: browser-native-form-value-descriptor-read
    desc: Reads native form value descriptor
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: 'getOwnPropertyDescriptor\(\s*HTML(Input|TextArea)Element\.prototype'

  - id: svg-event-target-value-read
    desc: SVG reads event target value
    crit: notable
    conf: 0.92
    for: [svg]
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\s*\.\s*target\s*\.\s*value\b'
  - id: browser-value-event-b
    desc: Reads a browser event or active-element value
    if:
      type: symbol
      kind: member
      regex: '(currentTarget|activeElement)\.(value|innerText)$'

  # The write side of the form surface. Everything above reads a control's
  # value; these two set it, which is how a script fills a page's form for the
  # user. Dual-use — password managers, accessibility helpers and legitimate
  # autofill extensions all do it — so both stay notable and the intent is left
  # to the composites that add the fan-out (objectives/evasion/security-bypass/
  # signup-abuse/) or the solved challenge (.../anti-bot/).
  - id: browser-checked-property-assignment
    desc: Sets a checkbox or radio checked state
    crit: notable
    conf: 0.92
    for: [javascript]
    if:
      type: tree-sitter
      kind: assignment
      language: javascript
      regex: '(?i)\b(input|checkbox|radio|control|element|field|target)\w*\.checked\s*=[^=]'

  # Generic `field.value` and `element.value` assignments are common in
  # parsers, ORMs, and protocol models. Require a variable name that identifies
  # an input or textarea control rather than inferring DOM use from `.value`.
  - id: browser-form-control-value-write
    desc: Assigns a value into a form control
    crit: notable
    conf: 0.88
    for: [javascript]
    if:
      type: tree-sitter
      kind: assignment
      language: javascript
      regex: '(?i)\b(input|textarea)\w*\.value\s*=[^=]'

  - id: browser-input-capture-message
    desc: Sends captured input to extension background
    conf: 0.92
    if:
      type: text
      regex: 'type\s*:\s*["'']INPUT_CAPTURED["''][\s\S]{0,140}(text|url)\s*:'

  - id: browser-file-upload-message
    desc: Sends browser file metadata to extension
    if:
      type: text
      regex: 'type\s*:\s*["'']FILE_UPLOAD["''][\s\S]{0,140}(summary|url)\s*:'

  - id: browser-anonymize-message
    desc: Requests remote PII anonymization
    conf: 0.92
    if:
      type: text
      regex: 'type\s*:\s*["'']ANONYMIZE_TEXT["''][\s\S]{0,120}text\s*:'

  - id: browser-password-entry
    desc: Enters a password into a browser form
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'page\.type\s*\([^)]{0,120}password'
      case_insensitive: true

  # In script source, a string literal distinguishes an actual form fragment
  # from comments or documentation that merely mention password inputs.
  - id: password-input-field-script
    desc: Script string contains a password input field
    crit: notable
    conf: 0.82
    for: [javascript, typescript, php]
    if:
      type: string_literal
      regex: 'type\s*=\s*["'']password["'']'
    unless:
      # Form-validation and editor libraries bind delegated handlers to every
      # input type at once, so `[type='password']` turns up as one element of
      # a selector list beside `[type='color']` and `[type='range']`. Such a
      # list targets no particular field and must not read as a credential
      # form; a real login page or harvester names the password field alone.
      - type: text
        regex: '\[type\s*=\s*["''][a-z-]{2,18}["'']\][\s\S]{0,12}\[type\s*='
        case_insensitive: true

  - id: browser-otp-entry
    desc: Enters OTP or verification value in browser
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'page\.type\s*\([^)]{0,120}(otp|idvPin|phoneNumberId)'
      case_insensitive: true

  - id: browser-password-field-automation
    desc: Fills password field through browser script
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)typeText\s*\(\s*document\.querySelector\(.{0,80}password'

  - id: browser-bank-field-automation
    desc: Fills banking field through browser script
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)typeText\s*\(\s*document\.querySelector\(.{0,80}bank'

  - id: browser-pin-field-automation
    desc: Fills PIN field through browser script
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)typeText\s*\(\s*document\.querySelector\(.{0,80}pin'

  - id: browser-account-field-automation
    desc: Fills account field through browser script
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)typeText\s*\(\s*document\.querySelector\(.{0,80}(account|userpass)'

  - id: browser-submit-button-click
    desc: Clicks a browser form submit control
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(submitButton|formSubmit|bankOption)\.click\s*\('

  - id: browser-submit-selector
    desc: Selects a browser form submit control
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)querySelector\(.{0,80}button.{0,40}(submit|type)'

  - id: browser-banking-data-labels
    desc: Browser data record contains banking fields
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)inputData.{0,100}(accountNumber|bankName)'

  # Anchored on the `inputData` record like the banking sibling above: without
  # it the regex was just "the word password (or the substring pin) twice
  # within 80 chars", which fires on any CLI `--password <password>` flag,
  # on prose, and on unrelated words containing "pin" (spinner, typing, ...).
  - id: browser-credential-data-labels
    desc: Browser data record has credential fields
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)inputData.{0,100}\b(password|pin)\b'

composite_rules:
  - id: browser-form-element-value-read
    desc: Reads a validated browser form value
    crit: notable
    conf: 0.95
    scope: file
    near_lines: 16
    all:
      - id: generic-element-value-member-read
      - id: native-form-element-type-check

  - id: browser-password-input-marker
    desc: Browser markup names a password input field
    crit: component
    conf: 0.9
    any:
      - id: browser-password-input-literal
      - id: browser-password-input-markup

  - id: hidden-website-url-input
    desc: Hides a website-like form input from users
    crit: notable
    conf: 0.9
    all:
      - id: browser-website-url-input-marker
    any:
      - id: negative-tabindex-input
      - id: aria-hidden-input
      - id: hidden-style-input
    near_bytes: 180

  - id: browser-credential-field-pair
    desc: Browser form pairs username and password fields
    crit: notable
    conf: 0.95
    for: [html, javascript, typescript, php]
    all:
      - id: micro-behaviors/ui/window/form-input::browser-password-input-marker
      - id: micro-behaviors/ui/window/form-input::browser-username-input-marker
    near_bytes: 700

  - id: browser-editable-content-selector-sweep
    desc: Targets form fields and editable page content
    crit: notable
    conf: 0.94
    near_bytes: 256
    all:
      - id: browser-input-selector
      - id: browser-textarea-selector
      - id: browser-contenteditable-selector

  - id: browser-value-property-read
    desc: Reads value or innerText from DOM-like member
    crit: notable
    conf: 0.9
    any:
      - id: browser-form-control-value-read
      - id: browser-value-event-member-read
      - id: browser-form-element-value-read
      - id: browser-value-event-b

  - id: browser-value-socket-send
    desc: Sends a browser value over a JavaScript socket
    crit: notable
    conf: 0.94
    all:
      - id: browser-value-event-member-read
      - id: micro-behaviors/communications/socket/send::javascript-socket-send

  - id: browser-password-or-otp-entry
    desc: Automated browser entry of a password or verification value
    crit: notable
    conf: 0.94
    any:
      - id: browser-password-entry
      - id: browser-otp-entry

  - id: browser-sensitive-field-automation
    desc: Fills password and banking fields in browser
    crit: notable
    conf: 0.96
    all:
      - id: browser-password-field-automation
    any:
      - id: browser-bank-field-automation
      - id: browser-pin-field-automation
      - id: browser-account-field-automation

  - id: browser-banking-credential-data-record
    desc: Browser record combines banking and credential fields
    crit: notable
    conf: 0.96
    all:
      - id: browser-banking-data-labels
      - id: browser-credential-data-labels

  # Both halves of an automated fill: choosing an option and typing into a
  # field, close enough together to be one routine rather than two unrelated
  # DOM touches elsewhere in a bundle.
  # "Page" is the operative word, and it needs the lookup leg to be true: a
  # React form library sets .checked/.value on elements it rendered from its
  # own props (PrimeReact's controlled-input binding fired this in the Eclipse
  # Memory Inspector webview), whereas a form-filler queries the controls out
  # of a page it did not build. Proximity is in bytes because these bundles are
  # a handful of very long lines, where near_lines constrains nothing.
  - id: browser-form-autofill-write
    desc: Fills page form controls programmatically
    crit: notable
    conf: 0.92
    near_bytes: 1200
    all:
      - id: browser-checked-property-assignment
      - id: browser-form-control-value-write
    any:
      - id: browser-input-selector
      - id: browser-textarea-selector
