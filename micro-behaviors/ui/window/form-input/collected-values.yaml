---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: password-field-values-collected-joined
  desc: Collects password values into joined string
  crit: notable
  conf: 0.93
  if:
    type: tree-sitter
    query: |
      ((function_declaration body:
          (statement_block
            (lexical_declaration
              (variable_declarator value:
                (call_expression function:
                  (member_expression property:
                    (property_identifier) @query) arguments:
                  (arguments
                    (string
                      (string_fragment) @kind)))))
            (expression_statement
              (call_expression function:
                (member_expression property:
                  (property_identifier) @each) arguments:
                (arguments
                  (arrow_function parameter:
                    (identifier) @input body:
                    (statement_block
                      (lexical_declaration
                        (variable_declarator value:
                          (call_expression function:
                            (member_expression object:
                              (member_expression object:
                                (identifier) @source property:
                                (property_identifier) @value) property:
                              (property_identifier) @trim)))))))))
            (return_statement
              (call_expression function:
                (member_expression property:
                  (property_identifier) @join)))))
        (#eq? @query "querySelectorAll")
        (#match? @kind "(?i)password")
        (#eq? @source @input)
        (#eq? @each "forEach")
        (#eq? @value "value")
        (#eq? @trim "trim")
        (#eq? @join "join"))
composite_rules:
- id: dom-value-report-channel
  desc: DOM event reporting, joined values, or collector data calls
  crit: notable
  conf: 0.96
  scope: file
  any:
  - id: micro-behaviors/ui/window/form-input::dom-event-value-reporting-call
  - id: micro-behaviors/ui/window/form-input::password-field-values-collected-joined
  - id: micro-behaviors/ui/controls/wallet::seed-field-values-collector-call
