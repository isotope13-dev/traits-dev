defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: component
  conf: 0.9

traits:
  - id: browser-file-input-assignment
    desc: Assigns a FileList between browser file inputs
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\b\w*input\w*\.files\s*=\s*\w*(input|transfer)\w*\.files'

  - id: dom-value-local-assignment
    desc: DOM input value assigned locally
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(const|let|var)\s+\w+\s*=\s*\w+\.value(\.trim\(\))?'

  - id: username-name-input-literal
    desc: JavaScript string names username or email input
    for: [javascript, typescript]
    if:
      type: literal
      regex: '(?i)<input\b[^>]{0,80}\bname\s*=\s*["''](username|email)["'']'

  - id: username-selector-literal
    desc: JavaScript selector names username or email
    for: [javascript, typescript]
    if:
      type: literal
      regex: '(?i)\[name\s*=\s*["''](username|email)["'']'

  - id: username-name-input-markup
    desc: HTML input names username or email
    for: [html, php]
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,80}\bname\s*=\s*["''](username|email)["'']'

  - id: username-selector-markup
    desc: HTML selector names username or email
    for: [html, php]
    if:
      type: text
      regex: '(?i)\[name\s*=\s*["''](username|email)["'']'

  # Native window.prompt(string) collects a line of user input. CLI prompt
  # libraries pass a question object or array, not a string, so the arg
  # filter keeps this on the browser dialog (and prompt-sync-style CLIs).
  - id: window-prompt-string-call
    desc: Calls prompt() with a string
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: prompt
      arg:
        kind: string

composite_rules:
  - id: dom-input-to-telemetry-callback
    desc: Forwards a DOM input value to a telemetry-style callback
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    scope: file
    near_bytes: 800
    all:
      - id: dom-value-local-assignment
      - id: micro-behaviors/data/source/function/names::telemetry-data-object-call

  - id: browser-username-input-marker
    desc: Browser markup or selector names username input
    any:
      - id: username-name-input-literal
      - id: username-selector-literal
      - id: username-name-input-markup
      - id: username-selector-markup
      - id: micro-behaviors/ui/window/manage/dom::email-input-field

  # Either spelling of "this page has a password box" — the markup attribute or
  # a script reaching for it. Neutral: every sign-in page in existence matches.
  # Previously defined in objectives/credential-access/phishing/mfa-relay/,
  # where the directory asserted a phishing kit for an ordinary login form.
  - id: browser-credential-field-reference
    desc: Browser password field reference
    crit: notable
    conf: 0.94
    for: [html, javascript, typescript, php]
    any:
      - id: micro-behaviors/ui/window/manage/dom::password-input-field
      - id: password-input-query-selector
