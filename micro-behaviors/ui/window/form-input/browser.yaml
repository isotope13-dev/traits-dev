defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: component
  conf: 0.9

traits:
  - id: dom-value-local-assignment
    desc: DOM input value assigned locally
    crit: baseline
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(const|let|var)\s+\w+\s*=\s*\w+\.value(\.trim\(\))?'

  - id: username-name-input-marker
    desc: Browser input names username or email
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,80}\bname\s*=\s*["''](username|email)["'']'

  - id: username-selector-marker
    desc: Browser selector names username or email
    if:
      type: text
      regex: '(?i)\[name\s*=\s*["''](username|email)["'']'

composite_rules:
  - id: dom-input-to-telemetry-callback
    desc: Forwards a DOM input value to a telemetry-style callback
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    scope: file
    near_bytes: 800
    all:
      - id: dom-value-local-assignment
      - id: micro-behaviors/data/source/function/names::telemetry-data-object-call

  - id: browser-username-input-marker
    desc: Browser markup or selector names username input
    any:
      - id: username-name-input-marker
      - id: username-selector-marker
      - id: micro-behaviors/ui/window/manage/dom::email-input-field

  # Either spelling of "this page has a password box" — the markup attribute or
  # a script reaching for it. Neutral: every sign-in page in existence matches.
  # Previously defined in objectives/credential-access/phishing/mfa-relay/,
  # where the directory asserted a phishing kit for an ordinary login form.
  - id: browser-credential-field-reference
    desc: Browser password field reference
    crit: notable
    conf: 0.94
    for: [html, javascript, typescript, php]
    any:
      - id: micro-behaviors/ui/window/manage/dom::password-input-field
      - id: password-input-query-selector
