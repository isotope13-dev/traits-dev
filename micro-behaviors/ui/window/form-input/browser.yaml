defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: component
  conf: 0.9
traits:
  # A feedback form: a submit/send-feedback handler carrying the title and
  # body the user typed. Such a form posts to whatever webhook it is
  # configured with, which is application transport rather than exfiltration.
  - id: feedback-form-submission
    desc: User feedback form submission fields
    if:
      type: text
      regex: '(?i)(submit|send)[-_ ]feedback.{0,700}(title|subject).{0,700}(body|message)'
  - id: browser-file-input-assignment
    desc: Assigns a FileList between browser file inputs
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\b\w*input\w*\.files\s*=\s*\w*(input|transfer)\w*\.files'
  # Native window.prompt(string) collects a line of user input. CLI prompt
  # libraries pass a question object or array, not a string, so the arg
  # filter keeps this on the browser dialog (and prompt-sync-style CLIs).
  - id: window-prompt-string-call
    desc: Calls prompt() with a string
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: prompt
      arg:
        kind: string
