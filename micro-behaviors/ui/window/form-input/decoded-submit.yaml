defaults:
  for: [html, javascript]
  platforms: [windows, unix]
traits:
  - id: percent-encoded-form-submit
    desc: Percent-encoded JavaScript calls a submit method
    crit: notable
    conf: 0.96
    if:
      type: encoded
      encoding: url
      regex: '\b[A-Za-z_$][\w$]{0,40}\.submit\(\s*\)'
