# Parsed declarations do not imply rendering, submission, or command execution.
defaults:
  platforms: [unix, windows]
  for: [cfml]
traits:
  - id: cfml-command-form-field
    desc: CFML declares a command-named form control
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(html:(input|textarea|select|button)|cf(input|textarea|select))$'
      arg:
        index: 0
        from:
          field: name
          whole_value: '(?i)^(command|cmd|opts)$'
