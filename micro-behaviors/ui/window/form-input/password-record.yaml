defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: password-input-value-returned-in-record
    desc: Returns password input value in record
    # Same lexical block: a const-bound password input supplies a returned
    # record field. A selector used only for existence or key binding does
    # not establish this read. Output field and variable names are arbitrary.
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator name: (identifier) @input
              value: (call_expression
                function: (member_expression
                  property: (property_identifier) @select)
                arguments: (arguments (string) @selector)))) @binding
          (return_statement (object
            (pair value: (member_expression object: (identifier) @source
              property: (property_identifier) @value))))) @capture
          (#match? @binding "^const\\s")
          (#eq? @select "querySelector")
          (#match? @selector "input\\[type\\s*=\\s*[\"']password[\"']\\]")
          (#eq? @value "value")
          (#eq? @input @source))
