# Window-title reads bound from the JVM through JNA (the method name is all a
# class file keeps). Previously `carlambo-browser-window-bitmap--rx-2`
# ("Matches 'GetWindowTextA'") in the carLambo family directory.
defaults:
  platforms: [windows]
  for: [class, java_class]
traits:
  - id: jvm-get-window-text-name
    desc: JVM class names GetWindowTextA
    crit: notable
    conf: 0.9
    attack: T1010
    if:
      type: text
      regex: '^GetWindowText[AW]?$'
