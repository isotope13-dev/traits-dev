composite_rules:
- platforms:
  - windows
  for:
  - pe
  - dll
  id: window-process-title-api-profile
  desc: Window title, owner and enumeration APIs
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/ui/window/enumerate::get-window-thread-process-id
  - id: micro-behaviors/ui/window/enumerate::get-window-text
  any:
  - id: micro-behaviors/ui/window/enumerate::enum-windows
  - id: micro-behaviors/ui/window/enumerate::enum-child-windows-import
  unless:
  - id: metadata/binary/framework::vb6-runtime-library
  - id: metadata/filename/identity::p-user-proxy-dll
  - id: well-known/tool/reverse-engineering/ollydbg::ollydbg-executable-marker
