defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: enum-desktops
    desc: Enumerate Windows desktop objects
    crit: notable
    conf: 0.86
    if:
      type: symbol
      regex: '^EnumDesktops[AW]$'
  - id: enum-desktop-windows-import
    desc: Enumerate desktop windows
    crit: baseline
    conf: 0.86
    if:
      type: import
      exact: EnumDesktopWindows
  - id: enum-child-windows-import
    desc: Enumerate child windows
    crit: baseline
    conf: 0.8
    if:
      type: import
      exact: EnumChildWindows
  # Canonical atom for EnumWindows. Matched as text rather than an import so
  # the managed P/Invoke declaration form is covered by the same trait; a
  # duplicate previously lived under window/manage/visibility/, where the
  # directory claimed a show/hide behavior this matcher never observes.
  - id: enum-windows
    desc: Enumerate top-level windows
    crit: notable
    conf: 0.85
    if:
      type: text
      exact: EnumWindows
    unless:
      - id: metadata/lang/compiler/systems::go-binary-comp
  # Canonical atom for GetWindowThreadProcessId. Matched as text rather than an
  # import so the managed P/Invoke declaration form is covered by the same
  # trait; a duplicate previously lived under window/manage/visibility/.
  - id: get-window-thread-process-id
    desc: Map window handle to owning process
    crit: baseline
    conf: 0.85
    if:
      type: text
      exact: GetWindowThreadProcessId
  - id: set-cursor-pos-import
    desc: Move cursor position
    crit: baseline
    conf: 0.82
    if:
      type: text
      exact: SetCursorPos
  - id: python-enumerates-top-level-windows
    desc: Python enumerates top-level Windows windows
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\b(user32\.)?EnumWindows\b'
  - id: find-window-ex
    desc: Find window by class/title
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: FindWindowExW
  - id: find-window-a-import
    desc: Find window by class/title (ANSI)
    crit: baseline
    conf: 0.75
    if:
      type: import
      exact: FindWindowA
  - id: find-window-w-import
    desc: Find window by class/title (Wide)
    crit: baseline
    conf: 0.75
    if:
      type: import
      exact: FindWindowW
  - id: set-foreground-window
    desc: Bring window to foreground
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: SetForegroundWindow
  - id: get-foreground-window
    desc: Query current foreground window
    crit: baseline
    conf: 0.8
    for:
      - pe
      - dll
      - go
    if:
      type: import
      exact: GetForegroundWindow
  - id: go-get-foreground-window-call
    desc: Go queries the active foreground window
    crit: notable
    conf: 0.84
    for: [go]
    if:
      type: symbol
      kind: call
      exact: GetForegroundWindow
  - id: get-foreground-window-pinvoke
    desc: GetForegroundWindow P/Invoke name, not imported
    crit: baseline
    conf: 0.86
    ref: sha256:102dd32a30d7a0cf86955e6045e0426a26dfef393ce946d49c006d19c4c036e9
    if:
      type: text
      exact: GetForegroundWindow
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: get-foreground-window
  - id: get-foreground-window-source
    desc: Source queries the foreground window
    crit: baseline
    conf: 0.84
    for: [javascript, typescript, python, powershell, c, cpp, csharp, rust, go, source]
    if:
      type: text
      word: GetForegroundWindow
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: rust-foreground-window-api
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: go-get-foreground-window-call
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: get-foreground-window
  - id: get-window-text-source
    desc: Source reads active window title text
    crit: baseline
    conf: 0.84
    for: [javascript, typescript, python, powershell, c, cpp, csharp, rust, go, source]
    if:
      type: text
      regex: '\bGetWindowText[AW]?\b'
  - id: get-window-text
    desc: Read active window title text
    crit: baseline
    conf: 0.8
    for:
      - pe
      - dll
      - go
    if:
      type: import
      regex: ^GetWindowText[AW]?$
  - id: get-window-text-length
    desc: Query active window title length
    crit: baseline
    conf: 0.75
    for:
      - pe
      - dll
      - go
    if:
      type: symbol
      regex: ^GetWindowTextLength[AW]?$
  - id: set-window-text
    desc: Set window title/text
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: SetWindowTextW
  - id: is-window
    desc: Check if window exists
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: IsWindow
  - id: is-window-visible
    desc: Check if window is visible
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: IsWindowVisible
composite_rules:
  - id: desktop-window-enumeration
    desc: Enumerate desktop window state
    crit: baseline
    conf: 0.9
    all:
      - id: enum-desktop-windows-import
      - id: micro-behaviors/ui/window/enumerate::get-window-text
    any:
      - id: set-cursor-pos-import
