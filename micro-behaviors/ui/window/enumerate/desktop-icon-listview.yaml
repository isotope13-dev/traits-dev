# Walking Progman -> SHELLDLL_DefView -> SysListView32 finds the desktop
# icon list view. Desktop tools do this to read icon positions; it only
# establishes that the code locates that window.
defaults:
  platforms: [windows]
  for: [vbs, csharp]
  crit: notable

traits:
  - id: desktop-icon-listview-lookup
    desc: Looks up desktop icon list view
    conf: 0.92
    if:
      type: text
      regex: '"SHELLDLL_DefView"[\s\S]{0,160}"SysListView32"'
