defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1056.001
  mbc: B0015

traits:
  - id: rust-window-title-api
    desc: Rust window title API usage
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: GetWindowTextW
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  - id: rust-window-title-length-api
    desc: Rust window title length API usage
    crit: notable
    conf: 0.82
    if:
      type: symbol
      kind: call
      exact: GetWindowTextLengthW
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
