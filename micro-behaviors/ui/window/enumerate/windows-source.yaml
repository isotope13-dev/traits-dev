defaults:
  platforms: [windows]
  for: [csharp]
traits:
  - id: rust-foreground-window-api
    desc: Rust foreground window API usage
    crit: notable
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: GetForegroundWindow
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  - id: shell-tray-wnd-class-reference
    desc: References Explorer taskbar window class
    crit: notable
    conf: 0.9
    if:
      type: text
      word: Shell_TrayWnd
