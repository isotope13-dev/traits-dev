# Windows Screenshot Capture via GDI + GDI+ Encoding
# Full screenshot pipeline: GDI capture -> GDI+ PNG encode -> exfil
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1113
  mbc: "C0014"

traits:
- id: powershell-enum-child-windows
  desc: PowerShell enumerates child windows
  crit: notable
  conf: 0.95
  for: [powershell]
  if:
    type: text
    word: EnumChildWindows
- id: powershell-find-webview-child
  desc: PowerShell finds WebView child
  crit: notable
  conf: 0.95
  for: [powershell]
  if:
    type: text
    word: FindWebViewChild
composite_rules:
- id: powershell-child-window-enumeration
  desc: PowerShell enumerates window children
  crit: notable
  conf: 0.97
  for: [powershell]
  any:
  - id: micro-behaviors/ui/window/enumerate::powershell-enum-child-windows
  - id: micro-behaviors/ui/window/enumerate::powershell-find-webview-child
