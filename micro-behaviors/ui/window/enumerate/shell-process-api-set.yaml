defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: shell-window-process-api-set
    desc: Shell-window class with window-to-process enumeration APIs
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/ui/window/control::windows-shell-window-class
      - id: micro-behaviors/ui/window/enumerate::get-window-thread-process-id
      - id: micro-behaviors/ui/window/enumerate::get-window-text
      - id: micro-behaviors/ui/window/enumerate::enum-windows
