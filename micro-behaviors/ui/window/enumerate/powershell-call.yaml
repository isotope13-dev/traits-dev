defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-window-enumeration-call
    desc: Calls Win32 window enumeration from PowerShell
    crit: notable
    conf: 0.97
    # A static method invocation, excluding P/Invoke declaration and help text.
    if:
      type: tree-sitter
      node: invokation_expression
      regex: '(?i)::Enum(Child)?Windows\s*\('
