defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # The facts CLI exposes CIL calls that some scan builds omit. The method
  # token remains available in both; describe this as a reference.
  - id: dotnet-main-window-title-getter-reference
    desc: .NET process main-window-title getter reference
    crit: notable
    conf: 0.98
    if:
      type: text
      exact: get_MainWindowTitle
      section: .text
  - id: get-window-text-pinvoke-name
    desc: Window-title API name outside native imports
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '^GetWindowText[AW]?$'
      section: .text
    unless:
      - id: get-window-text
composite_rules:
  - id: managed-active-window-title-api-set
    desc: Managed foreground-window title API references
    crit: notable
    conf: 0.94
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: managed-foreground-window-api-reference
      - id: managed-window-title-api-reference

  - id: managed-foreground-window-api-reference
    desc: Foreground-window query import or API name
    crit: notable
    conf: 0.94
    any:
      - id: get-foreground-window
      - id: get-foreground-window-name-reference
  - id: managed-window-title-api-reference
    desc: Window-title query import or API name
    crit: notable
    conf: 0.94
    any:
      - id: get-window-text
      - id: get-window-text-pinvoke-name
