# Enumerating every open application window, on Linux. This directory covered
# only the Win32 side (EnumWindows, EnumDesktopWindows) plus a macOS file, so on
# Linux the recon step that precedes targeted screenshotting, keylogging, or
# acting on a specific application produced no finding at all.
#
# Neutral: a window manager, a taskbar, a screen recorder and a session-cleanup
# utility all read the client list. It is worth surfacing because it answers
# "does this program know what else you have open", which is the question an
# analyst asks of anything that also captures the screen or targets an app by
# name. The intent belongs to the objectives that combine it with those.
defaults:
  platforms: [linux]
  for: [binaries, scripts, source, -applescript]
  crit: notable
  conf: 0.88

traits:
  # The EWMH property a compliant window manager keeps on the root window: the
  # list of every managed client. Reading it is the X11 equivalent of
  # EnumWindows, and the name is specific enough to stand alone.
  - id: net-client-list-atom
    desc: Reads the EWMH window client list
    conf: 0.9
    if:
      type: text
      substr: _NET_CLIENT_LIST

  # Xlib's raw window-tree walk, which works without a compliant WM.
  - id: x-query-tree-call
    desc: Walks the X11 window tree
    conf: 0.9
    if:
      type: text
      word: XQueryTree

  - id: wmctrl-list-command
    desc: Lists X11 windows with wmctrl
    conf: 0.85
    if:
      type: text
      regex: '(?m)(^|[;&|`$(\s])wmctrl\s[^\n]{0,40}-l\b'

  # xdotool's search verb enumerates windows by name/class before acting on
  # them; the bare binary name is too common to stand alone.
  - id: xdotool-search-command
    desc: Searches X11 windows with xdotool
    conf: 0.85
    if:
      type: text
      regex: '(?m)\bxdotool\s+(search|getactivewindow|windowactivate)\b'
