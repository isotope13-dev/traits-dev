defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  - id: resize-to-available-screen
    desc: Resizes window to available screen dimensions
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\.resizeTo\(\s*screen\.availWidth\s*,\s*screen\.availHeight\s*\)'
