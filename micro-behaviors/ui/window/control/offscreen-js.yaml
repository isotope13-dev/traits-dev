defaults:
  platforms: [windows, unix]
  for: [javascript, html, text]
traits:
  - id: move-window-far-offscreen
    desc: Moves browser window far offscreen
    crit: suspicious
    # Both axes at 2000+ are off-desktop on standard single displays; this
    # matches the large-coordinate leg's threshold while requiring both axes.
    if:
      type: text
      regex: '\b(self|window)\.moveTo\(\s*[2-9]\d{3,}\s*,\s*[2-9]\d{3,}\s*\)'
