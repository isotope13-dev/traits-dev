defaults:
  platforms: [windows, unix]
  for: [javascript, html, text]
traits:
  - id: move-window-far-offscreen
    desc: Moves browser window far offscreen
    crit: suspicious
    # Both axes at 2000+ are off-desktop on standard single displays; this
    # matches the large-coordinate leg's threshold while requiring both axes.
    # The leading (^|[^/]) keeps commented-out calls out: a bare text scan
    # otherwise fires on `//self.moveTo(5000,5000);` left dead in a script,
    # which moves no window.
    if:
      type: text
      regex: '(^|[^/])\b(self|window)\.moveTo\(\s*[2-9]\d{3,}\s*,\s*[2-9]\d{3,}\s*\)'
      exclude_html_comments: true
  # Popup opened with window features that place it off the desktop
  # (top and left both 2000+): the window exists but the user never sees
  # it. Same threshold as move-window-far-offscreen.
  - id: open-window-far-offscreen
    desc: Opens popup window positioned far offscreen
    crit: suspicious
    if:
      type: text
      regex: 'window\.open\([^)]{0,200}\btop=[2-9]\d{3,}[^)]{0,40}\bleft=[2-9]\d{3,}'
      exclude_html_comments: true
