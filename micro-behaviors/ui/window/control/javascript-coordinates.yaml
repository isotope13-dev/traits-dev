defaults:
  platforms: [windows]
  for: [html, text, data]
traits:
  - id: script-window-zero-negative-coordinates
    desc: Window call uses zero or negative coordinates
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: '(?i)window\.(resizeTo|moveTo)\s*\([^\)\r\n]{0,80}(-\d+|0\s*,\s*0)'
    unless:
      - id: "metadata/file/naming::test-directory-component"
