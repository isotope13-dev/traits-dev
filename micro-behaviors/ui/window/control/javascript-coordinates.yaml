defaults:
  platforms: [windows]
  for: [html, text, data]
traits:
  - id: browser-mouse-click-near-element-bounds
    desc: Click follows element bounding-box lookup
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    platforms: [windows, unix]
    if:
      type: text
      regex: 'boundingBox\(\)[\s\S]{0,500}mouse\.click\('
  - id: script-window-zero-negative-coordinates
    desc: Window call uses zero or negative coordinates
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: '(?i)window\.(resizeTo|moveTo)\s*\([^\)\r\n]{0,80}(-\d+|0\s*,\s*0)'
    unless:
      - id: metadata/path::test-directory-component
