defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: register-class
    desc: Register window class
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      regex: ^RegisterClass(Ex)?[AW]$
  - id: get-class-info
    desc: Get window class information
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: GetClassInfoW
  - id: create-window-ex
    desc: Create window (extended)
    crit: notable
    conf: 0.85
    if:
      type: symbol
      regex: ^CreateWindowEx[AW]$
    downgrade:
      any:
        - id: metadata/binary/symbols/count::many-imports-50
        - id: metadata/binary/framework::dotnet-metadata
  - id: destroy-window
    desc: Destroy window
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: DestroyWindow
  - id: show-window
    desc: Show or hide window
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: ShowWindow
  - id: set-window-pos
    desc: Change window position/size
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: SetWindowPos
  - id: set-window-pos-source
    desc: Change window position/size in source
    crit: baseline
    conf: 0.72
    for:
      - csharp
    if:
      type: symbol
      kind: call
      exact: SetWindowPos
  - id: set-parent-api
    desc: Reparent window via SetParent
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      exact: SetParent
  - id: get-window-rect
    desc: Get window rectangle
    crit: baseline
    conf: 0.7
    if:
      type: import
      exact: GetWindowRect
  - id: get-window-rect-pinvoke
    desc: .NET window rectangle API entrypoint
    crit: baseline
    conf: 0.84
    ref: sha256:102dd32a30d7a0cf86955e6045e0426a26dfef393ce946d49c006d19c4c036e9
    if:
      type: text
      exact: GetWindowRect
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: get-window-rect
  - id: screen-to-client
    desc: Convert screen to client coordinates
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: ScreenToClient
  - id: get-window-long
    desc: Get window data
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: GetWindowLongW
  - id: set-window-long
    desc: Set window data
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: SetWindowLongW
  - id: set-class-long
    desc: Set window class data
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: SetClassLongW
  - id: is-window-enabled
    desc: Check if window is enabled
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: IsWindowEnabled
  - id: enable-window
    desc: Enable/disable window
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: EnableWindow
  - id: char-next
    desc: Move to next character
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: CharNextW
  - id: char-prev
    desc: Move to previous character
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: CharPrevW
  - id: exit-windows-ex
    desc: ExitWindowsEx shutdown/restart API symbol
    crit: notable
    conf: 0.85
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      exact: ExitWindowsEx
