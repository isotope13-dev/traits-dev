defaults:
  platforms: [windows]
  for: [vbs, asp, html]

traits:
  - id: hta-width-zero-attr
    desc: HTA sets width attribute to zero
    crit: component
    conf: 0.85
    for: [html, asp, vbs, javascript]
    if:
      type: text
      regex: '<hta:application\b[^>]{0,240}?\bwidth\s*=\s*["'']?0(["'']|\s|>)'
      case_insensitive: true

  - id: hta-height-zero-attr
    desc: HTA sets height attribute to zero
    crit: component
    conf: 0.85
    for: [html, asp, vbs, javascript]
    if:
      type: text
      regex: '<hta:application\b[^>]{0,240}?\bheight\s*=\s*["'']?0(["'']|\s|>)'
      case_insensitive: true

  - id: asp-hta-taskbar-hidden
    desc: ASP HTA markup suppresses taskbar entry
    crit: notable
    conf: 0.93
    for: [asp]
    if:
      type: text
      regex: '<hta:application\b[\s\S]{0,800}?showintaskbar\s*=\s*["'']?no\b'
      case_insensitive: true

  - id: asp-window-resizeto-zero
    desc: ASP script resizes window to zero
    crit: notable
    conf: 0.9
    for: [asp]
    if:
      type: text
      regex: '\b(window|self)\.resizeTo\(\s*[01]\s*,\s*[01]\s*\)'
      case_insensitive: true

  - id: chr-frag-lt-ht
    desc: Chr-encoded fragment matching "<ht"
    crit: component
    conf: 0.82
    if:
      type: text
      regex: 'chrw?\(\s*60\s*\)\s*[&+]\s*chrw?\(\s*(72|104)\s*\)\s*[&+]\s*chrw?\(\s*(84|116)\s*\)'
      case_insensitive: true

  - id: chr-frag-ta-colon
    desc: Chr-encoded fragment matching "ta:"
    crit: component
    conf: 0.82
    if:
      type: text
      regex: 'chrw?\(\s*(84|116)\s*\)\s*[&+]\s*chrw?\(\s*(65|97)\s*\)\s*[&+]\s*chrw?\(\s*58\s*\)'
      case_insensitive: true

  - id: chr-frag-ar-eq
    desc: Chr-encoded fragment matching "ar="
    crit: component
    conf: 0.78
    if:
      type: text
      regex: 'chrw?\(\s*(65|97)\s*\)\s*[&+]\s*chrw?\(\s*(82|114)\s*\)\s*[&+]\s*chrw?\(\s*61\s*\)'
      case_insensitive: true

  - id: chr-frag-res-prefix
    desc: Chr-encoded fragment matching "res"
    crit: component
    conf: 0.75
    if:
      type: text
      regex: 'chrw?\(\s*(82|114)\s*\)\s*[&+]\s*chrw?\(\s*(69|101)\s*\)\s*[&+]\s*chrw?\(\s*(83|115)\s*\)'
      case_insensitive: true

  - id: chr-frag-to-open-zero
    desc: Chr-encoded fragment matching "o(0"
    crit: component
    conf: 0.82
    if:
      type: text
      regex: 'chrw?\(\s*(79|111)\s*\)\s*[&+]\s*chrw?\(\s*40\s*\)\s*[&+]\s*chrw?\(\s*48\s*\)'
      case_insensitive: true

  - id: chr-frag-comma-zero-close
    desc: Chr-encoded fragment matching ",0)"
    crit: component
    conf: 0.82
    if:
      type: text
      regex: 'chrw?\(\s*44\s*\)\s*[&+]\s*chrw?\(\s*48\s*\)\s*[&+]\s*chrw?\(\s*41\s*\)'
      case_insensitive: true

composite_rules:
  - id: hta-zero-dimensions
    desc: HTA sets width and height to zero
    crit: notable
    conf: 0.93
    for: [html, asp, vbs, javascript]
    near_bytes: 300
    all:
      - id: hta-width-zero-attr
      - id: hta-height-zero-attr

  - id: chr-encoded-hta-taskbar-hidden
    desc: Chr-encoded HTA tag with taskbar attribute
    crit: notable
    conf: 0.95
    near_bytes: 1000
    all:
      - id: chr-frag-lt-ht
      - id: chr-frag-ta-colon
      - id: chr-frag-ar-eq

  - id: chr-encoded-window-resizeto-zero
    desc: Chr-encoded resizeTo(0,0) window call
    crit: notable
    conf: 0.96
    near_bytes: 180
    all:
      - id: chr-frag-res-prefix
      - id: chr-frag-to-open-zero
      - id: chr-frag-comma-zero-close

  - id: any-hta-concealed-window
    desc: HTA suppresses taskbar or shrinks window
    crit: notable
    conf: 0.94
    for: [vbs, asp, html, javascript]
    any:
      - id: hta-zero-dimensions
      - id: asp-hta-taskbar-hidden
      - id: asp-window-resizeto-zero
      - id: chr-encoded-hta-taskbar-hidden
      - id: chr-encoded-window-resizeto-zero
      - id: hta-hidden-or-minimized-window-request
      - id: window-resizeto-trivial
