traits:
- id: hta-windowstate-minimized-or-hidden
  desc: HTA requests minimization or hiding
  conf: 0.93
  if:
    type: text
    regex: (?i)<hta:application\b[\s\S]{0,800}?windowstate\s*=\s*["']?(minimize|hidden)\b
- id: window-moveto-standalone-negative
  desc: moveTo with standalone negative coordinate
  conf: 0.85
  if:
    type: text
    regex: (?i)(\bwindow\.|[^.\w])(moveTo\(([^):]{0,20}[\s,(])?-[1-9]\d+)
- id: window-moveto-large-coordinate
  desc: moveTo with large off-desktop coordinate
  conf: 0.85
  if:
    type: text
    regex: (?i)(\bwindow\.|[^.\w])(moveTo\([^):]{0,20},\s*[2-9]\d{3})
  unless:
    - id: metadata/file/format/security-corpus::trait-expectation-catalog

- id: window-resizeto-trivial-text
  desc: Text contains trivial-size resizeTo syntax
  conf: 0.85
  platforms: [windows, unix]
  for: [html, vbs, text, data, mp3]
  if:
    type: text
    regex: (?i)(\b(window|self)\.|[^.\w])resizeTo\(\s*[01]\s*,\s*[01]\s*\)
- id: window-resizeto-trivial-call
  desc: JavaScript resizes window to trivial dimensions
  conf: 0.98
  platforms: [windows, unix]
  for: [javascript]
  if:
    type: tree-sitter
    query: |
      ((call_expression function: (_) @callee
        arguments: (arguments (number) @width (number) @height)) @resize
        (#match? @callee "^(window\\.|self\\.)?resizeTo$")
        (#match? @width "^[01]$")
        (#match? @height "^[01]$"))
- id: hta-taskbar-hidden
  desc: HTA requests no taskbar entry
  conf: 0.93
  if:
    type: text
    regex: (?i)<hta:application\b[\s\S]{0,800}?showintaskbar\s*=\s*["']?no\b
  unless:
  - id: metadata/package/tooling::contools-script-path
# One suppressed chrome flag alone is a kiosk-style UI choice; caption, menu,
# and border suppressed together leave a window with no user controls, which
# is the shape hidden HTA droppers use to run script with nothing on screen.
# One atom per flag keeps each regex short; the composite below joins them.
- id: hta-caption-suppressed
  desc: HTA suppresses its caption bar
  conf: 0.88
  if:
    type: text
    regex: (?i)<hta:application\b[^>]{0,400}?caption\s*=\s*["']?no\b
- id: hta-sysmenu-suppressed
  desc: HTA suppresses its system menu
  conf: 0.88
  if:
    type: text
    regex: (?i)<hta:application\b[^>]{0,400}?sysmenu\s*=\s*["']?no\b
- id: hta-border-none
  desc: HTA removes its window border
  conf: 0.88
  if:
    type: text
    regex: (?i)<hta:application\b[^>]{0,400}?border\s*=\s*["']?none\b
defaults:
  platforms:
  - windows
  for:
  - javascript
  - html
  - vbs
  - text
  - data
  - mp3
  crit: notable
composite_rules:
- id: window-resizeto-trivial
  desc: resizeTo to a trivial size
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  any:
  - id: window-resizeto-trivial-text
  - id: window-resizeto-trivial-call
- platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  id: hta-chromeless-window
  desc: HTA suppresses caption, menu, and border
  conf: 0.92
  all:
  - id: hta-caption-suppressed
  - id: hta-sysmenu-suppressed
  - id: hta-border-none
- platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  id: hta-hidden-or-minimized-window-request
  desc: HTA requests taskbar hiding or minimization
  conf: 0.94
  any:
  - id: micro-behaviors/ui/window/control::hta-taskbar-hidden
  - id: micro-behaviors/ui/window/control::hta-windowstate-minimized-or-hidden
