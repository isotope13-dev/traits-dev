defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries, -beam, -wasm, -static-lib]
  crit: notable
  conf: 0.95

traits:
  - id: chromium-tiny-window-size
    desc: Chromium command requests a tiny window
    if:
      type: text
      regex: '--window-size=[1-9],[1-9]\b'

  - id: chromium-far-offscreen-position
    desc: Chromium command positions window far offscreen
    if:
      type: text
      regex: '--window-position=-?[1-9][0-9]{3,6},-?[1-9][0-9]{3,6}\b'
