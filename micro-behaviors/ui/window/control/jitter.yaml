defaults:
  platforms: [windows, unix]
  for: [javascript, html]
traits:
  - id: browser-random-relative-movement
    desc: Browser moveBy uses random coordinates
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\b(self|window)\.moveBy\s*\([^;\r\n]{0,120}Math\.random\(\)[^;\r\n]{0,120}Math\.random\(\)'
