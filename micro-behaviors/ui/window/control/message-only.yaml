defaults:
  platforms: [windows]
  for: [pe, rust, c, cpp]
  crit: notable
traits:
  - id: hwnd-message-const
    desc: Message-only window parent constant reference
    if:
      type: text
      word: HWND_MESSAGE
composite_rules:
  # These references alone establish neither a clipboard listener nor a
  # SetParent argument relationship. Message-only windows are ordinary IPC.
  - id: set-parent-message-window-references
    for: [pe]
    desc: SetParent and message-only window references
    conf: 0.9
    all:
      - id: set-parent-api
      - id: hwnd-message-const
