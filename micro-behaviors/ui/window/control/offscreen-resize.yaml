composite_rules:
  - id: window-offscreen-or-trivial-resize
    desc: Window moves off-screen or shrinks
    crit: notable
    conf: 0.9
    platforms:
    - windows
    for:
    - javascript
    - html
    - vbs
    - text
    - data
    - mp3
    any:
    - id: micro-behaviors/ui/window/control::window-moveto-standalone-negative
    - id: micro-behaviors/ui/window/control::window-moveto-large-coordinate
    - id: micro-behaviors/ui/window/control::window-resizeto-trivial
    unless:
    - id: metadata/file/format/security-corpus::trait-expectation-catalog
    - id: metadata/file/extension/identity::declaration-file-extension
    - id: metadata/package/tooling::contools-script-path
