# Configuration-purpose review; matcher and effective scope preserved.
---
defaults:
  for:
  - text
  - mirc
  platforms:
  - windows
traits:
- id: mirc-windows-update-app-title
  desc: INI application title claims Windows Update
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: "(?im)^aptitle=[^\\r\\n]{0,120}Windows Update[^\\r\\n]{0,250}\\r?$"
