defaults:
  platforms: [windows]
  for: [html, javascript, vbs]
  crit: notable
  conf: 0.92

composite_rules:
  # One window-concealment role for hidden-HTA composites: the dropper may
  # hide via HTA attributes (SHOWINTASKBAR=no, WINDOWSTATE=minimize) or via
  # script (moveTo off-screen, resizeTo trivial). Any single method suffices.
  - id: hta-concealed-window
    desc: HTA hides its window via attributes or script
    any:
      - id: micro-behaviors/ui/window/control::hta-taskbar-hidden
      - id: micro-behaviors/ui/window/control::hta-windowstate-minimized-or-hidden
      - id: micro-behaviors/ui/window/control::window-offscreen-or-trivial-resize
