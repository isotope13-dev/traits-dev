defaults:
  platforms:
  - android
  for:
  - java
  - kotlin
traits:
- id: android-recent-task-call
  desc: Android recent-task API call syntax
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\b(getRecentTasks|getRunningTasks|moveTaskToBack)\s*\(
  unless:
  - id: metadata/file/catalog/identity::debian-packages-index
  - type: basename
    regex: (?i)^(CHANGELOG|CHANGES|HISTORY|NEWS)(\.|$)
