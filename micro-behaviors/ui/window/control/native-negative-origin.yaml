defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: x86-create-window-far-negative-origin
    desc: Creates window beyond negative screen axes
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        import "pe"
        rule far_negative_window_origin {
          strings:
            // Y, X, style, title, class, ex-style, CreateWindowEx IAT call.
            $origin = { 68 [4] 68 [4] 68 [4] 68 [4] 68 [4] 6A 00 FF 15 ?? ?? ?? ?? }
          condition:
            pe.machine == pe.MACHINE_I386 and for any n in (1..#origin) : (
              uint32(@origin[n]+1) >= 0x80000000 and
              uint32(@origin[n]+1) <= 0xfffffc00 and
              uint32(@origin[n]+6) >= 0x80000000 and
              uint32(@origin[n]+6) <= 0xfffffc00 and
              (uint32(@origin[n]+29) == pe.image_base + pe.import_rva("user32.dll", "CreateWindowExA") or
               uint32(@origin[n]+29) == pe.image_base + pe.import_rva("user32.dll", "CreateWindowExW")) and
              for any s in pe.sections : (
                s.characteristics & pe.SECTION_MEM_EXECUTE != 0 and
                @origin[n] >= s.raw_data_offset and
                @origin[n]+!origin[n] <= s.raw_data_offset+s.raw_data_size
              )
            )
        }
