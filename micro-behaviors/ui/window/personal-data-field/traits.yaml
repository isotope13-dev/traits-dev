defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: browser-phone-input-marker
    desc: Browser markup requests a phone number
    crit: notable
    conf: 0.9
    for: [html, javascript, typescript, php]
    if:
      type: text
      regex: '(?i)<input\b[^>]{0,80}(type\s*=\s*["'']tel["'']|name\s*=\s*["''](phone|mobile|telephone)["''])'
  # `website` / `homepage` / `url` are the conventional anti-bot honeypot field
  # names, but they are equally the ordinary "your site" field of a comment,
  # contact or profile form (WordPress ships `<input name="url">` in every
  # comment form). The name alone proves nothing; hidden-field context is
  # represented by the composite below.
  - id: mobile-id-input
    desc: Markup names a mobile or phone id
    if:
      type: text
      regex: '(?i)\bid\s*=\s*["'']?(mobile|phone)[^A-Za-z]'
  - id: maxlength-eleven-input
    desc: Input capped at eleven characters
    if:
      type: text
      regex: 'maxlength\s*=\s*["'']?11\b'
  # A bare "code" id (SMS/verification code) without a verification or OTP
  # prefix. Coupon and captcha fields share the shape, so this leg only
  # convicts beside a phone field. The value must not start with `=`: a JS
  # strict-equality guard such as `id === HAS_CODE_CHANGES_FIELD` is a
  # comparison, not markup.
  - id: code-id-input
    desc: Markup names a short code id
    if:
      type: text
      # Require the input element: `const id = vscode...` is an assignment,
      # even though the identifier happens to contain the substring "code".
      case_insensitive: true
      regex: '<input\b[^>]{0,80}\b(id|name)\s*=\s*["'']?[\w-]{0,11}(code|otp|verify)\b'
composite_rules:
  # An 11-digit cap is the China-mobile shape: the id plus the cap together
  # name a phone field that name-based detectors miss.
  - id: mobile-id-length-capped-input
    desc: Mobile-id input capped at eleven digits
    near_bytes: 200
    all:
      - id: mobile-id-input
      - id: maxlength-eleven-input
  # Phone number plus SMS-code boxes side by side: the smishing lead shape.
  # Ordinary checkouts pair phone with coupon codes too, so this stays
  # suspicious; a packed redirect on the same page makes it a funnel.
  - id: phone-sms-code-harvest-pair
    desc: Phone number paired with SMS code input
    crit: suspicious
    conf: 0.85
    near_lines: 30
    all:
      - id: mobile-id-length-capped-input
      - id: code-id-input
