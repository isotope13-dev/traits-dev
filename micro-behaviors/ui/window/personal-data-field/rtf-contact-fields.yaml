defaults:
  platforms: [windows, unix]
  for: [rtf]

traits:
  - id: rtf-full-name
    desc: Document requests a full name
    crit: component
    if:
      type: text
      regex: '(?i)\bfull name\b'
  - id: rtf-address
    desc: Document references an address
    crit: component
    if:
      type: text
      regex: '(?i)\baddress\b'
  - id: rtf-phone-number
    desc: Document references a phone number
    crit: component
    if:
      type: text
      regex: '(?i)\b(telephone|mobile|cell phone)\b'
