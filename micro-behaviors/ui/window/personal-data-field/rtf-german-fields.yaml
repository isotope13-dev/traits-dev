defaults:
  platforms: [windows, unix]
  for: [rtf]

traits:
  - id: rtf-german-personal-data-fields
    desc: RTF names multiple German personal-data fields
    crit: notable
    if:
      type: yara
      source: |
        rule german_rtf_personal_fields {
          strings:
            $birth1 = "GEBURTSDATUM" ascii nocase
            $birth2 = "GEB.DATUM" ascii nocase
            $phone = "TELEFON" ascii nocase
            $job = "BERUF" ascii nocase
            $address = "ANSCHRIFT" ascii nocase
            $city = "WOHNORT" ascii nocase
          condition:
            1 of ($birth*) and $phone and 1 of ($job, $address, $city)
        }
