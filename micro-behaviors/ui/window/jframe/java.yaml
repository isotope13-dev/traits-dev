defaults:
  crit: notable
  conf: 0.8
  platforms: [unix, windows]
  for: [java, class]
traits:
  - id: jframe-import
    desc: "Java Swing JFrame Import"
    if:
      type: text
      word: "javax.swing.JFrame"
  - id: jframe-new
    desc: "Java Swing JFrame Creation"
    if:
      type: text
      exact: "new JFrame"
