defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript, html]

traits:
  - id: html-area-href-attribute
    desc: HTML area element has an href attribute
    conf: 0.97
    if:
      type: text
      regex: '(?is)<\s*area\b[^>\r\n]{0,160}\bhref\s*='

  - id: deutsche-bank-anchor
    desc: Anchor links to Deutsche Bank banking
    conf: 0.98
    for: [html]
    if:
      type: text
      regex: '<a\b[^>]{0,80}href\s*=\s*["'']https://meine\.deutsche-bank\.de/'
      case_insensitive: true
      exclude_html_comments: true
  - id: deutsche-bank-cid-image
    desc: Image references Deutsche Bank CID attachment
    conf: 0.98
    for: [html]
    if:
      type: text
      regex: '<img\b[^>]{0,80}src\s*=\s*["'']cid:[^"'']{1,120}@deutsche-bank\.de'
      case_insensitive: true
      exclude_html_comments: true
  - id: html-area-public-ip-href
    desc: Image-map area links to public IPv4
    conf: 0.98
    for: [html]
    if:
      type: text
      regex: '<area\b[^>]{0,160}href\s*=\s*["'']https?://[0-9.]{7,15}[:/]'
      is: external_ip
      case_insensitive: true
      exclude_html_comments: true
  - id: html-area-encoded-authority-href
    desc: Image-map area has percent-encoded authority
    conf: 0.98
    for: [html]
    if:
      type: text
      regex: '<area\b[^>]{0,160}href\s*=\s*["'']https?://(%[0-9A-Fa-f]{2}){4,}'
      case_insensitive: true
      exclude_html_comments: true
  - id: html-image-usemap
    desc: HTML image uses a named image map
    conf: 0.97
    for: [html]
    if:
      type: text
      regex: '<img\b[^>]{0,240}\busemap\s*=\s*["'']#'
      case_insensitive: true
      exclude_html_comments: true
  # Mail-embedded artwork: the image is a cid: attachment, so the whole
  # lure renders inside the victim's mail client with no remote fetch.
  # Newsletters use the same mechanism; the objective composites add the
  # attacker destination.
  - id: cid-embedded-image
    desc: Image loads embedded mail attachment
    conf: 0.95
    for: [html]
    if:
      type: text
      regex: '(?i)<img\b[^>]{0,80}\bsrc\s*=\s*["'']cid:'
      exclude_html_comments: true
  # Official-brand decoy links: the page borrows trust by linking the real
  # brand site while its harvest link points elsewhere. The objective
  # composites supply that second destination.
  - id: paypal-official-anchor
    desc: Anchor links to official PayPal site
    conf: 0.95
    for: [html]
    if:
      type: text
      regex: '(?i)<a\b[^>]{0,120}\bhref\s*=\s*(3D)?["'']https?://(www\.|images\.)?paypal\.com/'
      exclude_html_comments: true
  # Link-text deception: the visible text is itself an absolute URL, so the
  # reader sees one destination while the href sends another. Legitimate
  # "paste this link" text is usually not wrapped in an anchor at all; the
  # phishing composites pair this with the mail context that carries it.
  # The href host is one site and a later path segment is another
  # hostname (`evil.example/secure.brand.com/login`). The visible URL, when
  # present, is matched separately. Exclude common document/script suffixes:
  # WordPress permalinks such as `/article.html/` are not embedded hosts.
  - id: href-path-embeds-hostname
    desc: Href path embeds another hostname
    conf: 0.93
    for: [html]
    if:
      type: text
      regex: '(?i)href="https?://[^"/]{1,40}/[a-z0-9.-]{1,24}\.(com|net|org|edu)/[^"]{0,50}"'
      exclude_html_comments: true
    not:
      - regex: '(?i)href="https?://(pkg\.go\.dev|godoc\.org|web\.archive\.org)/'
  # Visible host ends at `.com/` while the href host keeps another dotted
  # suffix (`brand.com.attacker.tld`). A real `.com.au` host has no second
  # dot before the slash, and showing the full href as text has no `.com/`.
  - id: anchor-text-hides-dotcom-suffix-host
    desc: Anchor text hides host past dot-com
    conf: 0.94
    for: [html]
    if:
      type: text
      regex: 'href="https?://\S{1,24}\.com\.\S{1,8}\.\S{1,8}/\S{0,48}">https?://\S{1,20}\.com/'
      exclude_html_comments: true
      case_insensitive: true
  - id: url-text-anchor
    desc: Anchor display text shows a URL
    conf: 0.93
    for: [html]
    if:
      type: text
      # The href run is unbounded short of the tag close so a payload-long
      # href (smuggled script in the query) still reaches its anchor text;
      # [^>] cannot cross the tag boundary, so the adjacency claim holds.
      # `=3D` is the quoted-printable form of `=` in mailed HTML.
      # Some malformed/phishing mail HTML corrupts the href separator with
      # a control byte. Accept a short non-alphanumeric separator as well as
      # normal `=` / quoted-printable `=3D`, while still requiring the URL
      # scheme immediately after it.
      regex: '<a\b[^>]{0,50}\bhref(\s*=\s*(3D)?|[^\w>]{1,5})["'']?h?ttps?://[^>]{0,999}>\s*https?://'
      exclude_html_comments: true
      case_insensitive: true
  # Formatted twin of url-text-anchor: the URL shown as link text sits
  # inside an inline <font>/<span>/<b> wrapper, which old mail templates
  # and phishing kits use and which the bare-anchor matcher cannot see.
  - id: url-text-anchor-inline-formatted
    desc: Formatted anchor text shows a URL
    conf: 0.92
    for: [html]
    if:
      type: text
      regex: '<a\b[^>]{0,350}href=[^>]{0,350}>\s*<(b|font|span|strong)[^>]{0,80}>\s*https?[:;]'
      case_insensitive: true
      exclude_html_comments: true
  # The visible text is a login.html URL and the href is some other
  # address. A link whose href already points at login.html is the
  # ordinary "show the URL you will open" case and is excluded.
  - id: login-html-text-off-href
    desc: Login URL text on a different href
    conf: 0.92
    for: [html]
    if:
      type: text
      regex: '<a\b[^>]{0,20}href="https?://[^"]{1,60}">\s*https?://[^<\s]{0,40}login\.html'
      case_insensitive: true
      exclude_html_comments: true
    not:
      - regex: 'href="https?://[^"]{0,80}login\.html'
  # Bulk-mail furniture: unsubscribe and view-in-browser links mark a
  # legitimate sender. Phish kits omit them; the phishing composites use this
  # as the benign-context exclusion for mailed link deception.
  - id: bulk-mail-furniture-reference
    desc: Bulk-mail furniture reference
    conf: 0.9
    for: [html]
    if:
      type: text
      regex: '(?i)unsubscribe|view.{0,20}in.{0,20}browser|list-unsubscribe'
      exclude_html_comments: true
      case_insensitive: true
  # Link-text deception via form-label binding: a label bound by for= shows an
  # absolute URL as its visible text. A label never needs to display a bare
  # URL; the phishing construct pairs it with a separately href'd target so
  # the reader is shown one destination while activation sends another.
  - id: label-url-display-text
    desc: Form label displays absolute URL
    conf: 0.93
    for: [html]
    if:
      type: text
      regex: '(?i)<label\b[^>]{0,100}\bfor\s*=[^>]{0,60}>\s*(<[a-z][^>]{0,80}>\s*)?h?ttps?://'
      exclude_html_comments: true
  # Invisible click target: an anchor carrying a href but no text content
  # cannot be read or clicked directly; it exists to be activated another way
  # (label for=, script) or as a hidden hit area. Link-display spoofs pair it
  # with a visible decoy. Ordinary in-page anchors point at fragment hrefs and
  # carry anchor text, so the href must be an absolute URI.
  - id: empty-href-anchor
    desc: Href anchor has no text content
    conf: 0.85
    for: [html]
    if:
      type: text
      regex: '(?i)<a\b[^>]{0,100}\bhref\s*=\s*["''][^"'']{1,150}["''][^>]{0,60}>\s*</a>'
      exclude_html_comments: true
