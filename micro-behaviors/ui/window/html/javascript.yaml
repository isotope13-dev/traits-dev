defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript, html]

traits:
  - id: html-area-href-attribute
    desc: HTML area element has an href attribute
    conf: 0.97
    if:
      type: text
      regex: '(?is)<\s*area\b[^>\r\n]{0,160}\bhref\s*='

  # These are DOM capabilities. Their security significance comes from an
  # objective composite that also observes session collection or forwarding.
  #
  # `innerHTML` is NOT matched here: it has a canonical atom at
  # micro-behaviors/ui/window/insert-html::browser-innerhtml-assignment, which
  # five composites reference and which carries the source-map / .d.ts / kernel
  # exclusions. This trait previously repeated that matcher, so a single
  # `el.innerHTML = ...` was reported twice, under two directories and two ML
  # features. It now covers only the two sinks the canonical atom does not.
  - id: html-active-handler-marker
    desc: HTML contains an inline event handler
    conf: 0.95
    if:
      # Keep the tag and handler in one parser-extracted literal.  React and
      # other DOM frameworks contain nearby implementation code such as
      # `<script>` plus `onclick = ...`; byte-text matching incorrectly joined
      # those unrelated tokens into an active HTML handler.
      type: literal
      regex: '(?is)<[a-z][a-z0-9-]{0,12}\b[^>]{0,100}\bon[a-z]{3,12}\s*='

  - id: deutsche-bank-anchor
    desc: Anchor links to Deutsche Bank banking
    conf: 0.98
    for: [html]
    if:
      type: text
      regex: '<a\b[^>]{0,80}href\s*=\s*["'']https://meine\.deutsche-bank\.de/'
      case_insensitive: true
      exclude_html_comments: true
  - id: deutsche-bank-cid-image
    desc: Image references Deutsche Bank CID attachment
    conf: 0.98
    for: [html]
    if:
      type: text
      regex: '<img\b[^>]{0,80}src\s*=\s*["'']cid:[^"'']{1,120}@deutsche-bank\.de'
      case_insensitive: true
      exclude_html_comments: true
  - id: html-area-public-ip-href
    desc: Image-map area links to public IPv4
    conf: 0.98
    for: [html]
    if:
      type: text
      regex: '<area\b[^>]{0,160}href\s*=\s*["'']https?://[0-9.]{7,15}[:/]'
      is: external_ip
      case_insensitive: true
      exclude_html_comments: true
  - id: html-image-usemap
    desc: HTML image uses a named image map
    conf: 0.97
    for: [html]
    if:
      type: text
      regex: '<img\b[^>]{0,240}\busemap\s*=\s*["'']#'
      case_insensitive: true
      exclude_html_comments: true
