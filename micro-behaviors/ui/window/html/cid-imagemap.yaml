defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: cid-image-ip-imagemap
    desc: CID image map beside IPv4 destination
    crit: notable
    conf: 0.97
    near_bytes: 600
    all:
      - id: micro-behaviors/ui/window/html::cid-embedded-image
      - id: micro-behaviors/ui/window/html::html-image-usemap
      - id: micro-behaviors/ui/window/html::html-area-href-attribute
    any:
      - id: micro-behaviors/ui/window/html::html-area-public-ip-href
      - id: micro-behaviors/communications/ip/literal::percent-encoded-ip-destination
  - id: encoded-ip-imagemap
    desc: Image-map IP destination uses percent encoding
    crit: notable
    conf: 0.96
    near_bytes: 600
    all:
      - id: micro-behaviors/communications/ip/literal::percent-encoded-ip-destination
      - id: micro-behaviors/ui/window/html::html-area-href-attribute
      - id: micro-behaviors/ui/window/html::html-image-usemap
