# HTML email bodies used as phishing or bulk-mail templates.
# An e-mail body is a few KB. The brand and pretext matchers are Unicode-aware
# case-insensitive scans, and over 1.7 MB cspell trie dictionaries (typed text)
# the E*TRADE and Citibank ones each ran 90-240 s and were reported as analysis
# bombs, so the whole file is bounded.
defaults:
  platforms: [unix, windows]
  for: [html, text, markdown, makefile]
  size_max: 1048576

traits:
  - id: html-merge-favicon-placeholder
    desc: HTML template merges favicon placeholder
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: '{{FAVICON}}'
  # Bank-phish lure copy: the E*TRADE asterisk brand is distinctive enough to
  # key on directly; legitimate E*TRADE mail carries it too, so this stays a
  # neutral capability and lure intent comes from the phishing composites.
