defaults:
  platforms: [windows, unix]
  for: [html, javascript, makefile]
  crit: notable
  conf: 0.95
traits:
  - id: iframe-opening-tag
    desc: Contains HTML iframe opening tag text
    if:
      type: text
      regex: '(?i)<iframe[\s>]'
      exclude_html_comments: true
  # A src-less iframe inside noscript is not the analytics fallback pattern
  # (those load a collector URL); an empty frame here splits crawler and
  # victim views while contributing no content.
  - id: noscript-empty-iframe
    desc: Empty iframe inside noscript element
    if:
      type: text
      regex: '(?i)<noscript>\s*<iframe\s*>\s*<\/iframe>'
  # Ad-conversion frames load beacons and collectors; a frame whose source
  # is an HTML document is pulling a page into the visitor's browser —
  # static (.htm/.html) or server-rendered (.php, the TDS-gate spelling).
  - id: frame-src-html-document
    desc: Iframe src loads a remote HTML document
    crit: notable
    conf: 0.85
    for: [html, javascript, text]
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<iframe\b[^>]{0,200}\bsrc\s*=\s*["'']?https?://\S+(\.h?tml?|\.php)([?#"\''\s>]|$)'
  # Same page-load as the remote atom, when the source is a colon-free path
  # (`timwp.html`, `/landing.htm`) rather than an http(s) URL. A colon in
  # `http://` cannot sit in this path, so absolute URLs stay on the remote
  # atom. Server .php gates stay there too.
  - id: frame-src-path-html
    desc: Iframe src is an HTML path
    crit: notable
    conf: 0.86
    for: [html, javascript, text]
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<iframe[^>]{0,100}\ssrc=["'']?[\w./%-]{1,48}\.html?\b'
  # The traffic-direction gate path the injection kits standardize on
  # (`/tds/in.php`): the frame hands the visitor to the kit's router, which
  # decides exploit versus ad-fraud per fingerprint.
  - id: frame-src-tds-gate-path
    desc: Iframe src targets a TDS gate path
    crit: suspicious
    conf: 0.92
    for: [html, javascript, text]
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<iframe\b[^>]{0,200}\bsrc\s*=\s*["'']?https?://[^"''>\s]{0,120}/tds/[a-z]{1,12}\.php'
  # A document whose entire content is one iframe element: the injected-frame
  # fragment appended to compromised pages, collected standalone. Wrapper
  # pages that re-embed content to dodge X-Frame-Options render the frame
  # visible; a bare iframe document has nothing for a visitor to see.
  - id: iframe-only-document
    desc: Document consists solely of an iframe element
    crit: suspicious
    conf: 0.9
    for: [html, text]
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\A\s*<iframe\b[\s\S]{0,300}</iframe>\s*\.?\s*\z'
  # A frame whose name claims a service or sign-in purpose (social brand,
  # login, verification, payment). Neutral on its own: legitimate embeds
  # and login widgets use such names, so intent comes from the composites
  # that pair the name with a remote source.
  - id: service-named-frame
    desc: Iframe carries a service or sign-in name
    if:
      type: text
      regex: '(?i)<iframe[^>]{0,80}\bname\s*=\s*["'']?(twitter|facebook|login|verify|paypal)\b["''>\s]'
      exclude_html_comments: true

composite_rules:
  # Remote and relative HTML sources are one observation: the frame loads a
  # page. Beacons and image pixels match neither leg.
  - id: iframe-html-document-src
    desc: Iframe src loads an HTML document
    crit: notable
    conf: 0.86
    for: [html, javascript, text]
    any:
      - id: frame-src-html-document
      - id: frame-src-path-html
