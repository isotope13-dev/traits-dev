defaults:
  platforms: [unix, windows]
  for: [html, javascript, php]
  crit: notable
  conf: 0.9

traits:
  - id: negative-tabindex-iframe
    desc: Iframe removed from keyboard tab order
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<iframe\b[^>]{0,220}\btabindex\s*=\s*["'']?-1\b'
