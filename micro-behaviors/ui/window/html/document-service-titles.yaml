defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.92

traits:
  - id: acrobat-page-title
    desc: Page title claims Adobe Acrobat
    if:
      type: text
      regex: '(?i)<title\b[^>]{0,40}>[^<]{0,60}Adobe\s+Acrobat[^<]{0,20}</title>'

  - id: docusign-page-title
    desc: Page title claims DocuSign
    if:
      type: text
      regex: '(?i)<title\b[^>]{0,40}>[^<]{0,60}DocuSign[^<]{0,20}</title>'
