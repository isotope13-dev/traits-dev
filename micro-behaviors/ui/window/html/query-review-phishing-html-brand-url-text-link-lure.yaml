defaults:
  platforms:
  - windows
  - unix
  for:
  - html

composite_rules:
  - id: inline-image-url-link-context
    desc: Inline image and URL link coexist
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/ui/window/html::url-text-anchor
      - id: micro-behaviors/ui/window/html::cid-embedded-image
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference
  - id: label-url-empty-anchor-context
    desc: URL label and empty anchor coexist
    crit: notable
    conf: 0.9
    near_bytes: 500
    all:
      - id: micro-behaviors/ui/window/html::label-url-display-text
      - id: micro-behaviors/ui/window/html::empty-href-anchor
    unless:
      - id: micro-behaviors/ui/window/html::bulk-mail-furniture-reference
  # The visible text is an absolute URL and the href is a non-eBay host whose
  # path still says eBay. Unsubscribe furniture does not make that pairing
  # legitimate; copied brand footers keep it.
