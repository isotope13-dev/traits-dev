# Script-side writes to the page title and favicon. Both are routine page code,
# so each leg stays neutral; the tab-masking intent comes from the objective
# composite that requires them together with a school-platform preset.
defaults:
  platforms: [unix, windows]
  for: [html, javascript]

traits:
  - id: js-document-title-assignment
    desc: Script assigns the document title
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: 'document\.title\s*=[^=]'

  - id: js-favicon-link-rel-icon
    desc: Script creates a rel=icon link element
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\.rel\s*=\s*["'']icon["'']'
