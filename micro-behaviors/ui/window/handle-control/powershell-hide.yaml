defaults:
  platforms: [unix, windows]
  for: [powershell, batch, shell]
traits:
- id: powershell-showwindow-mainwindow-hide
  desc: PowerShell ShowWindow hides main window
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: ShowWindow\s*\([^)]{0,120}MainWindowHandle[^)]{0,40},\s*0\s*\)
    case_insensitive: true
