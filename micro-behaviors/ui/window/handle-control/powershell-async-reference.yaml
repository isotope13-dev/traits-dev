defaults:
  platforms: [unix, windows]
  for: [powershell, batch, shell]
traits:
- id: showwindowasync-before-mainwindow-text
  desc: ShowWindowAsync before MainWindowHandle
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: ShowWindowAsync\s*\([^\n\)]{0,80}MainWindowHandle
    case_insensitive: true
- id: mainwindow-before-showwindowasync-text
  desc: MainWindowHandle before ShowWindowAsync
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: MainWindowHandle[^\n]{0,120}ShowWindowAsync
    case_insensitive: true
composite_rules:
- id: showwindowasync-mainwindow-reference
  desc: ShowWindowAsync and MainWindowHandle text
  crit: notable
  conf: 0.88
  any:
  - id: micro-behaviors/ui/window/handle-control::showwindowasync-before-mainwindow-text
  - id: micro-behaviors/ui/window/handle-control::mainwindow-before-showwindowasync-text
# Hidden calc.exe launch is a classic malware/red-team PoC for proving code
# execution while suppressing the calculator UI (T1564.003 + T1059.001).
