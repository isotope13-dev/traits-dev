# Password input declarations written as JS/TS object properties (React/JSX).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.88

traits:
  - id: js-password-input-type-prop
    desc: JS object declares password input type
    if:
      type: text
      regex: '\btype\s*:\s*["'']password["'']'

composite_rules:
  - id: browser-password-field-any
    desc: Password input markup or JS property
    for: [javascript, typescript, html]
    conf: 0.92
    any:
      - id: js-password-input-type-prop
      - id: micro-behaviors/ui/controls/credential::browser-password-input-marker
