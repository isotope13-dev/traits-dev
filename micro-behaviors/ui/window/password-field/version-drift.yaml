# Neutral observations relocated during release-diff triage.
traits:
- platforms:
  - netbsd
  - unix
  for:
  - php
  id: html-root-password-label
  desc: HTML label mentions password and root
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)<label\b[^>]{0,80}>[^<\n]{0,80}password[^<\n]{0,40}root
