# Microsoft Entra sign-in field names are provider-specific UI observations.
# A first-party Entra page and a browser automation workflow can contain these
# same fields, so the fields themselves are neutral. Phishing composites add
# the off-origin collection and post-auth navigation that infer hostile intent.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9
traits:
  - id: entra-passwd-markup-field
    desc: Markup names the Entra passwd field
    conf: 0.85
    if:
      type: text
      regex: '(?i)name\s*=\s*["'']?passwd\b'
  - id: entra-passwd-literal-field
    desc: Field expression names the Entra passwd field
    conf: 0.8
    if:
      type: text
      regex: '(?i)name\s*:\s*["'']?passwd\b'
composite_rules:
  - id: entra-passwd-field-reference
    desc: References the Entra passwd field
    conf: 0.85
    any:
      - id: entra-passwd-markup-field
      - id: entra-passwd-literal-field
