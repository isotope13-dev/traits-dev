# The name passwd is shared by many providers and does not identify Entra.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9
traits:
  - id: passwd-markup-field
    desc: Markup names a passwd field
    conf: 0.85
    if:
      type: text
      regex: '(?i)name\s*=\s*["'']?passwd\b'
  - id: passwd-literal-field
    desc: Field expression names a passwd field
    conf: 0.8
    if:
      type: text
      regex: '(?i)name\s*:\s*["'']?passwd\b'
composite_rules:
  - id: passwd-field-reference
    desc: References a passwd field
    conf: 0.85
    any:
      - id: passwd-markup-field
      - id: passwd-literal-field
