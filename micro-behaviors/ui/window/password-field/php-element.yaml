defaults:
  platforms: [linux, macos, windows]
  for: [php]
traits:
- id: php-password-input-element
  desc: HTML password form in PHP
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: <input[^>]{0,120}type=['"]password['"]
  unless:
  - id: well-known/lib/web/wordpress-core::wordpress-core-package-doc
  - id: well-known/lib/web/wordpress-core::wordpress-phpunit-test-case
  - id: well-known/lib/web/wordpress-core::wordpress-core-include-bootstrap
  # The phpunit-test-case leg is not repeated here: it already sits in
  # `unless:` above, which wins, so a downgrade on it could never be reached.
  downgrade:
    any:
    - id: well-known/lib/web/wordpress-core::wordpress-core-api-symbols
