# Same-tag matching matters: a normal password field beside an invisible
# decorative input must not become a transparent-password finding. Text
# co-occurrence cannot bind the three attributes; this bounded byte signature
# handles either attribute order in HTML and in generated markup literals.
defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript, php, python]
traits:
  - id: transparent-password-input-markup
    desc: Password input has zero-opacity inline style
    crit: notable
    conf: 0.96
    if:
      type: yara
      source: |
        rule transparent_password_input_markup {
          strings:
            $input = /<input\b[^<>]{1,1024}>/ nocase
            $password = /\btype\s*=\s*["']password["']/ nocase
            $style = /\bstyle\s*=\s*["'][^"'<>]{0,512}\bopacity\s*:\s*0(\.0+)?\s*(;|["'])/ nocase
          condition:
            all of them and
            for any i in (1..#input) : (
              for any p in (1..#password) : (
                @password[p] > @input[i] and
                @password[p] + !password[p] < @input[i] + !input[i] and
                for any s in (1..#style) : (
                  @style[s] > @input[i] and
                  @style[s] + !style[s] < @input[i] + !input[i]
                )
              )
            )
        }
