defaults:
  platforms: [macos]
  for: [macho, swift, objc]
  crit: notable
  conf: 0.78
traits:
  - id: macos-secure-text-field-control
    desc: Uses the macOS secure text field control
    if:
      type: symbol
      exact: 'OBJC_CLASS_$_NSSecureTextField'
  # A view that masks typed characters itself instead of using
  # NSSecureTextField. The system field turns on Secure Event Input; a
  # hand-rolled mask does not, so this is how a prompt keeps the password
  # readable to the process drawing it.
  - id: custom-masked-password-view
    desc: Custom masked password view type
    if:
      type: text
      regex: '(Masked|Hidden|Obscured)Password(Input|Text(View|Field)|Field|View)'
  # Swift/ObjC type names for a window that plays the role of the macOS
  # authorization sheet (SecurityAgent). Genuine elevation goes through
  # Authorization Services and never draws this window in-process.
  - id: authorization-prompt-view-type
    desc: In-app authorization prompt window type
    if:
      type: text
      regex: '(Authori[sz]ation|SecurityAgent|AdminAuth)Prompt(Window|View|Panel)'
  - id: password-attempt-counter
    desc: Counts failed password attempts
    if:
      type: text
      regex: '(?i)(invalid|failed|wrong|bad)Password(Attempts|Count|Tries)'
