# Hidden Window Process Creation - Windows
# Neutral observations of hidden window execution flags.
# ATT&CK: T1564.003 (Hide Artifacts: Hidden Window)
# Many legitimate tools (services, background workers, installers) use hidden windows.
defaults:
  platforms: [windows]
traits:
  - id: lnk-powershell-windowstyle-hidden-argument
    desc: LNK PowerShell hidden window option
    crit: notable
    conf: 0.92
    for: [lnk]
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)(^|[\s;&|]|(powershell|pwsh)(\.exe)?\s+)-(WindowStyle|w)\s+Hidden\b'
  # Languages that build an argv list rather than a command line split the flag
  # and its value into adjacent quoted elements (`"-WindowStyle", "Hidden"`).
  # One matcher covers Go's []string{...} and the JS/TS args arrays that Node
  # and Deno spawn helpers take.
