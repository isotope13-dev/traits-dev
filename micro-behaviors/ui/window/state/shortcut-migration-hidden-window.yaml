defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable

traits:
  # Moved from objectives/command-and-control/dropper/lnk/command-content/:
  # an argument that hides the interpreter window is a launch mechanic, not
  # an attacker goal; objective composites reference it for the stealth leg.
  - id: lnk-hidden-window-flag
    desc: LNK arguments contain hidden-window option
    crit: notable
    conf: 0.92
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)(^|\s)-(WindowStyle|w)\s+Hidden\b'

composite_rules:
  # The stealth-window claim needs both halves: a PowerShell target and a
  # window state that keeps it out of sight. Minimized shortcuts alone are
  # ordinary (installers, background launches), so the window legs never
  # stand without the interpreter leg.
  - id: lnk-powershell-stealth-window
    desc: LNK PowerShell target and window clues
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/process/config/target::lnk-powershell-family
    any:
      - id: micro-behaviors/ui/window/state::lnk-hidden-window
      - id: "micro-behaviors/ui/window/state::lnk-minimized-inactive-window"
      - id: lnk-hidden-window-flag

  # Either concealment form: an explicit -WindowStyle Hidden argument (any
  # interpreter chain) or a PowerShell target shown hidden or minimized.
  - id: lnk-concealed-interpreter-window
    desc: LNK hidden or minimized window clues
    crit: notable
    conf: 0.92
    any:
      - id: lnk-hidden-window-flag
      - id: lnk-powershell-stealth-window
