# Saved window rectangles. -1 is mIRC's default-size sentinel, not a hide.
defaults:
  for: [text, mirc]
  platforms: [windows]
  crit: notable
  conf: 0.9
traits:
  - id: saved-main-window-unusable-width
    desc: Saved main window width is unusable
    if:
      type: text
      case_insensitive: true
      # x,y,width,height. Width of 0-8px, or negative other than the -1
      # default, cannot show a client. A normal or default window stays out.
      regex: '(?m)^\[windows\][^\[]{0,99}^main=-?\d+,-?\d+,(-([2-9]|\d{2,})|[0-8]),'
