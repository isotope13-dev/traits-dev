defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript, php]
  crit: notable
  conf: 0.92

traits:
  - id: challenge-dependent-panel-visibility
    desc: Panel visibility depends on challenge state
    if:
      type: text
      regex: '\.hidden\s*=[^;\n]{0,100}\.(challenge|auth_step)\b'
      exclude_html_comments: true
