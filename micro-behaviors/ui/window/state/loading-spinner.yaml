defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript, php]
  crit: notable
  conf: 0.9

traits:
  - id: loading-spinner-identifier
    desc: References a loadingSpinner UI identifier
    crit: notable
    conf: 0.5
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      word: loadingSpinner

