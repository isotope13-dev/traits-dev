defaults:
  platforms:
  - windows
  for:
  - lnk
  crit: notable

traits:
- id: lnk-minimized-inactive-window
  desc: LNK requests a minimized inactive window
  conf: 0.8
  if:
    type: value
    path: lnk.header.show_command
    exact: minimized_no_active

- id: lnk-hidden-window
  desc: LNK requests a hidden window
  conf: 0.85
  if:
    type: value
    path: lnk.header.show_command
    exact: hidden
