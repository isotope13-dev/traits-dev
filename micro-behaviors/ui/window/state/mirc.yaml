defaults:
  platforms: [unix, windows]
  for: [mirc, ircii, scripts, binaries, objectivec, lua, data, dos_com]
traits:
  - id: mirc-appstate-not-hidden
    desc: mIRC checks that its window is hidden
    crit: notable
    conf: 0.9
    for: [mirc, ircii]
    if:
      type: text
      regex: '(?i)\$appstate\s*!=\s*hidden'

