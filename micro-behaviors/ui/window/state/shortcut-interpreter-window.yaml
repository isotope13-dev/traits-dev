defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable
composite_rules:
- id: minimized-interpreter-window
  desc: LNK requests a minimized interpreter window
  crit: notable
  conf: 0.85
  all:
  - id: "micro-behaviors/ui/window/state::lnk-minimized-inactive-window"
  - id: micro-behaviors/process/config/target::lnk-interpreter-target-with-arguments

- id: hidden-or-minimized-window
  desc: LNK requests hidden or minimized execution
  crit: notable
  conf: 0.9
  any:
    - id: micro-behaviors/ui/window/state::lnk-hidden-window
    - id: micro-behaviors/ui/window/state::minimized-interpreter-window
