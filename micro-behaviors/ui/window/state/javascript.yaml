defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9

traits:
  - id: browser-dom-class-state-addition
    desc: Adds active or complete DOM class
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)classList\.add\s*\(\s*["''](active|complete)["'']\s*\)'
    downgrade:
      any:
        - id: metadata/file/format/source-map::sourcemap-sources-content
        - id: metadata/lang/scripted::dts-declaration-file

  # A flag written onto the document root, where every script in the page can
  # read it. Sibling of the class-state markers above: same DOM-state write,
  # but on `<html>` rather than a component, and therefore page-global.
  #
  # Extensions use it to publish "I am installed" to the site under them, which
  # is a real feature (skip the install prompt, enable a companion UI) and also
  # the receipt half of a paid-install funnel. Neutral here; the objectives
  # decide which one they are looking at.
  - id: document-root-presence-flag
    desc: Flags a marker on the document root
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'document\.documentElement\.dataset\.[A-Za-z0-9_$]{1,40}\s*='

  - id: document-root-presence-attribute
    desc: Marks the document root with an attribute
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'documentElement\.setAttribute\(\s*["''][a-z-]{1,40}["'']\s*,'
  # Sibling of the timer-blanked status atom in
  # objectives/evasion/masquerade/traffic/browser-url-concealment: that one
  # hides the destination, this one replaces the hover preview with a
  # lookalike URL while the real destination sits in the link.
  - id: status-bar-url-assignment
    desc: Script sets status bar to a URL
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'window\.status\s*=\s*[''"]https?://'
  # Old mail sets the hover preview with an inline handler, not window.status.
  - id: mouseover-status-url-assignment
    desc: Mouseover sets status bar to a URL
    conf: 0.9
    if:
      type: text
      regex: '(?i)onmouseover\s*=\s*["''][^"'']{0,40}\bstatus\s*=\s*[''"]https?://'
  # A phone-sized popup asks the site for its mobile page only while that
  # window is focused, then drops the override when the window is wider.
  - id: narrow-window-user-agent-toggle
    desc: Narrow window toggles one-host user agent
    conf: 0.93
    if:
      type: text
      regex: 'width<\d+[\s\S]{0,200}UserAgent[\s\S]{0,500}urlFilter:"\*://\*\.[a-z0-9.-]+/\*"'
  # An extension creates a phone-dimensioned popup window for mobile preview/testing.
  - id: mobile-preview-popup-create
    desc: Creates phone-sized mobile preview popup
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'windows\.create\s*\([\s\S]{0,120}width\s*:\s*[34]\d{2}'
