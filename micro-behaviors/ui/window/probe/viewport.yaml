# Browser viewport measurements are neutral UI observations. DevTools intent
# is inferred only when this capability is combined with other anti-inspection
# signals in objectives/anti-analysis/browser-detect.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.86

traits:
  - id: console-firebug-property
    desc: Checks the browser console Firebug property
    if:
      type: text
      substr: console.firebug

  - id: viewport-outer-inner-delta
    desc: Compares browser outer and inner viewport sizes
    if:
      type: text
      regex: '(window\.)?outer(Width|Height)\s*-\s*(window\.)?inner(Width|Height)\s*[<>]=?'
