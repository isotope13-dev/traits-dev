defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9
traits:
  - id: viewport-delta-threshold
    desc: Window dimension delta exceeds threshold
    if:
      type: text
      regex: 'outer(Width|Height)\s*-\s*[^;{}\n]{0,12}inner(Width|Height)\W{0,4}>=?\s*\d{2,4}'
  - id: viewport-delta-threshold-reversed
    desc: Threshold below window dimension delta
    if:
      type: text
      regex: '\d{2,4}\s*<=?[^;{}\n]{0,30}outer(Width|Height)\s*-\s*[^;{}\n]{0,12}inner(Width|Height)'
