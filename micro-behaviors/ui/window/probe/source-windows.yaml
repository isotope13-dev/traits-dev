# Browser-targeted low-level keyboard hooks in native source.
# A global low-level hook is dual-use; pairing it with a browser window-class
# target list and foreground-window/title inspection identifies credential
# capture without relying on a family name or a prose label.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, go, source]
  attack: T1056.001
  mbc: B0015

traits:
  - id: gui-window-class-reference
    desc: "GUI window class name reference"
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(ieframe|xdesk|xtrava|sunawtframe)\b'
