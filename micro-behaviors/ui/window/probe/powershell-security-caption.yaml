defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-security-text-comparison
    desc: PowerShell comparison tests for Security text
    crit: notable
    conf: 0.90
    if:
      type: tree-sitter
      node: comparison_expression
      regex: '(?i)-match\s+["''][^"'']{0,100}security[^"'']{0,100}["'']'
