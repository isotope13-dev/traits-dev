defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: managed-bank-window-title-references
    desc: Window-title API with Persian banking strings
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule managed_bank_window_title_references {
         strings:
          $title = "get_MainWindowTitle" ascii fullword
          $test = "Contains" ascii fullword
          $foreground = "GetForegroundWindow" ascii fullword
          $processes = "GetProcessesByName" ascii fullword
            $bank1 = { 7E 06 31 06 2F 06 27 06 2E 06 2A 06 20 00 27 06 CC 06 46 06 2A 06 31 06 46 06 2A 06 CC 06 }
            $bank2 = { 45 06 34 06 2E 06 35 06 27 06 2A 06 20 00 A9 06 27 06 31 06 2A 06 }
            $bank3 = { 28 06 27 06 46 06 A9 06 2F 06 27 06 31 06 CC 06 20 00 27 06 CC 06 46 06 2A 06 31 06 46 06 2A 06 CC 06 }
            $bank4 = { 28 06 27 06 46 06 A9 06 2F 06 27 06 31 06 4A 06 20 00 27 06 4A 06 46 06 2A 06 31 06 46 06 2A 06 4A 06 }
         condition:
          uint16(0) == 0x5a4d and
          all of ($title, $test, $foreground, $processes) and 2 of ($bank*)
        }
