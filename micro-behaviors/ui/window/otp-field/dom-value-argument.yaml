defaults:
  platforms: [unix, windows]
  for: [html]
traits:
  - id: otp-dom-value-argument
    desc: Passes OTP input value to a function
    crit: notable
    conf: 0.96
    # Text comment exclusion was insufficient for commented script elements.
    # Retain byte ranges and reject only matches inside HTML comments.
    if:
      type: yara
      source: |
        rule otp_dom_value_argument {
          strings:
            $behavior = /[,(]\s*document\.(getElementById|querySelector)\(.{0,80}\botp\b.{0,40}\)\.value[,)]/ nocase
            $comment = /<!--(.|\n|\r)*?-->/
          condition:
            for any i in (1..#behavior) : (
              not for any j in (1..#comment) : (
                @behavior[i] >= @comment[j] and
                @behavior[i] < @comment[j] + !comment[j]
              )
            )
        }
