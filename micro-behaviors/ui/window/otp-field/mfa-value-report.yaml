defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
traits:
  - id: js-mfa-code-value-access
    desc: MFA selector near a value accessor
    conf: 0.94
    # Preserve the original observation: it can match a read or a write.
    if:
      type: text
      regex: 'auth[-_]?mfa[-_]?otp[\s\S]{0,100}\.(value\b|val\s*\()'
      case_insensitive: true
  - id: mfa-input-value-to-sensitive-report
    desc: Reports MFA input value with sensitive tag
    conf: 0.98
    # Same lexical block and same value binding. A generated OTP assigned to
    # the input, an unrelated report, or mere selector text does not match.
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          [
            (lexical_declaration (variable_declarator
              name: (identifier) @value
              value: (member_expression
                object: (call_expression
                  function: (member_expression property: (property_identifier) @select)
                  arguments: (arguments (string) @selector))
                property: (property_identifier) @property)))
            (variable_declaration (variable_declarator
              name: (identifier) @value
              value: (member_expression
                object: (call_expression
                  function: (member_expression property: (property_identifier) @select)
                  arguments: (arguments (string) @selector))
                property: (property_identifier) @property)))
          ]
          (expression_statement (call_expression
            function: [(identifier) @report
                       (member_expression property: (property_identifier) @report)]
            arguments: (arguments (string) @category
              [(identifier) @sent (object (pair value: (identifier) @sent))])))) @capture
          (#eq? @select "querySelector")
          (#match? @selector "(?i)auth[-_]?mfa[-_]?otp")
          (#eq? @property "value")
          (#eq? @report "report")
          (#match? @category "^[\"']sensitive[\"']$")
          (#eq? @value @sent))
