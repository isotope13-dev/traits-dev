# MFA step-up command tokens and React autofill props. Neutral UI/protocol
# observations; phishing relays combine them with credential capture and C2.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.92

traits:
  - id: js-one-time-code-autocomplete-prop
    desc: JS prop requests one-time-code autofill
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\bautocomplete\s*:\s*["'']one-time-code["'']'

  - id: mfa-step-command-literals
    desc: MFA challenge step command literals
    if:
      type: text
      regex: '["''](sms_code|auth_code|tap_code)(_error)?["'']'

  - id: okta-mfa-step-command-literals
    desc: Okta MFA step command literals
    if:
      type: text
      regex: '["'']okta_(push|code|auth|sms)(_error)?["'']'

  - id: okta-signin-step-literals
    desc: Okta credential step command literals
    if:
      type: text
      regex: '["'']okta_(login|login_error|pass_error|user)["'']'
