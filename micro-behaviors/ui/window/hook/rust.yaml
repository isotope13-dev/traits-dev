defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1056.001
  mbc: B0015

traits:
  - id: windows-window-hook-api-call
    desc: "Calls SetWindowsHookExW window hook API"
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: SetWindowsHookExW
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
composite_rules:
  - id: rust-window-hook-message-loop
    desc: "Rust window hook and message-loop APIs"
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/ui/window/hook::windows-hook-lifecycle
    any:
      - id: micro-behaviors/os/message/queue::get-message-w
      - id: micro-behaviors/os/message/queue::post-thread-message-w
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
