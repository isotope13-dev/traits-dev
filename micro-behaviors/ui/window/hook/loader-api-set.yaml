# These imports do not bind a loaded DLL to a hook or prove remote injection.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Wine builtin DLLs implement the Windows hook API surface themselves. Their
  # exported API names plus ordinary message-loop imports resemble a named
  # hook injector, but do not show a caller resolving those APIs to inject.
  - id: wine-builtin-hook-api-implementation
    desc: Wine builtin DLL implementation of Windows hook APIs
    crit: exception
    conf: 0.99
    all:
      - id: well-known/lib/platform/wine::wine-builtin-dll-marker
      - id: micro-behaviors/ui/window/hook::set-windows-hook-text
      - id: micro-behaviors/ui/window/hook::unhook-windows-hook-text

  - id: unsigned-imported-window-hook-loader-api-set
    desc: Unsigned PE imports window hooks and loader APIs
    crit: notable
    conf: 0.97
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/ui/window/hook::set-windows-hook
      - id: micro-behaviors/ui/window/hook::unhook-windows-hook
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/os/message/queue::post-thread-message-w
    unless:
      - id: wine-builtin-hook-api-implementation

  # API names are an alternative to the imported hook surface.
  # Stand down when the import form already recorded the hook.
  - id: unsigned-named-window-hook-loader-api-set
    desc: Unsigned PE names window hooks with loader imports
    crit: notable
    conf: 0.97
    all:
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: micro-behaviors/ui/window/hook::set-windows-hook-text
      - id: micro-behaviors/ui/window/hook::unhook-windows-hook-text
      - id: micro-behaviors/dylib/load/runtime::load-library-a
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
      - id: micro-behaviors/os/message/queue::post-thread-message-w-text
    unless:
      - id: unsigned-imported-window-hook-loader-api-set
      - id: wine-builtin-hook-api-implementation

