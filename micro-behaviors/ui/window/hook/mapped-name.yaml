# Hook API names that live only in a PE overlay belong to an embedded image.
# A mapped section is the image that can resolve the name.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.84

traits:
  - id: set-windows-hook-rdata-name
    desc: SetWindowsHookEx name in rdata
    if:
      type: text
      substr: SetWindowsHookEx
      section: rdata
  - id: set-windows-hook-data-name
    desc: SetWindowsHookEx name in data
    if:
      type: text
      substr: SetWindowsHookEx
      section: data
  - id: set-windows-hook-text-name
    desc: SetWindowsHookEx name in text
    if:
      type: text
      substr: SetWindowsHookEx
      section: text
  - id: set-windows-hook-code-name
    desc: SetWindowsHookEx name in CODE
    if:
      type: text
      substr: SetWindowsHookEx
      section: CODE
  - id: unhook-windows-hook-rdata-name
    desc: UnhookWindowsHookEx name in rdata
    if:
      type: text
      substr: UnhookWindowsHookEx
      section: rdata
  - id: unhook-windows-hook-data-name
    desc: UnhookWindowsHookEx name in data
    if:
      type: text
      substr: UnhookWindowsHookEx
      section: data
  - id: unhook-windows-hook-text-name
    desc: UnhookWindowsHookEx name in text
    if:
      type: text
      substr: UnhookWindowsHookEx
      section: text
  - id: unhook-windows-hook-code-name
    desc: UnhookWindowsHookEx name in CODE
    if:
      type: text
      substr: UnhookWindowsHookEx
      section: CODE

composite_rules:
  - id: set-windows-hook-mapped-name
    desc: SetWindowsHookEx name in a mapped section
    conf: 0.9
    any:
      - id: set-windows-hook-rdata-name
      - id: set-windows-hook-data-name
      - id: set-windows-hook-text-name
      - id: set-windows-hook-code-name
  - id: unhook-windows-hook-mapped-name
    desc: UnhookWindowsHookEx name in a mapped section
    conf: 0.9
    any:
      - id: unhook-windows-hook-rdata-name
      - id: unhook-windows-hook-data-name
      - id: unhook-windows-hook-text-name
      - id: unhook-windows-hook-code-name
