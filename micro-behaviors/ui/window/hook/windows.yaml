defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
  attack: T1056.001
  mbc: E1056.001

traits:
  - id: set-windows-hook
    desc: Install Windows event hook
    crit: notable
    conf: 0.9
    downgrade:
      any:
        - id: metadata/lang/compiler/managed/
    if:
      type: symbol
      regex: ^SetWindowsHookEx(A|W)?$
    unless:
      - id: metadata/build/generated::rust-bindings-source
  - id: unhook-windows-hook
    desc: Remove Windows event hook
    crit: notable
    conf: 0.85
    downgrade:
      any:
        - id: metadata/lang/compiler/managed/
    if:
      type: symbol
      exact: UnhookWindowsHookEx
    unless:
      - id: metadata/build/generated::rust-bindings-source
  - id: call-next-hook-ex
    desc: Forward events in Windows hook chain
    crit: notable
    conf: 0.8
    downgrade:
      any:
        - id: metadata/lang/compiler/managed/
    if:
      type: symbol
      exact: CallNextHookEx
    unless:
      - id: metadata/build/generated::rust-bindings-source
  - id: set-windows-hook-text
    desc: SetWindowsHookEx API string
    crit: notable
    conf: 0.84
    for: [pe, rust, c, csharp, data]
    if:
      type: text
      substr: SetWindowsHookEx
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  # Relocated from metadata/file/format/iso::iso-setwindowshookexa (2026-08).
  # A bare "SetWindowsHookExA" run is a hook capability reference wherever it
  # is found -- there is nothing ISO-specific about the matcher, and under a
  # file-format metadata path it reported as an ISO fact on ordinary PEs
  # (yara's tests/data/ca21e1c3..., which already reports the parsed
  # `windows-hook-install`). It covers carriers cleave cannot descend, so the
  # `for:` list deliberately excludes every type that gets a symbol table.
  - id: set-windows-hook-a-container-string
    desc: SetWindowsHookExA API name in opaque content
    crit: notable
    conf: 0.97
    for: [data]
    if:
      type: text
      exact: SetWindowsHookExA
  - id: unhook-windows-hook-text
    desc: UnhookWindowsHookEx API string
    crit: notable
    conf: 0.84
    for: [pe, rust, c, csharp, data]
    if:
      type: text
      substr: UnhookWindowsHookEx
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  - id: call-next-hook-ex-text
    desc: CallNextHookEx API string
    crit: notable
    conf: 0.84
    for: [pe, rust, c, csharp, data]
    if:
      type: text
      substr: CallNextHookEx
    unless:
      - id: well-known/lib/platform/rust-system-bindings::windows-rs-generated-api-source
  - id: hookon-hookoff-exports
    desc: HookOn and HookOff export names
    crit: notable
    conf: 0.88
    for: [pe, dll]
    if:
      type: text
      regex: 'HookOn[\s\S]{0,160}HookOff|HookOff[\s\S]{0,160}HookOn'
  - id: hookon-export-text
    desc: HookOn export name
    crit: notable
    conf: 0.84
    for: [pe, dll]
    if:
      type: text
      substr: HookOn
  - id: hookoff-export-text
    desc: HookOff export name
    crit: notable
    conf: 0.84
    for: [pe, dll]
    if:
      type: text
      substr: HookOff
  - id: python-window-hook-install
    desc: "Python installs a Windows event hook"
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SetWindowsHookExW?$'
composite_rules:
  - id: windows-hook-chain-api-cluster
    desc: Windows event-hook lifecycle API cluster
    crit: notable
    conf: 0.96
    for: [pe, rust, c, csharp, data]
    all:
      - id: micro-behaviors/ui/window/hook::set-windows-hook-text
      - id: micro-behaviors/ui/window/hook::unhook-windows-hook-text
      - id: micro-behaviors/ui/window/hook::call-next-hook-ex-text
  # Keeps the id the keylog composite already references. These labels are
  # only a supporting fragment: editor grammars and terminal tables also map
  # editing and navigation names, so the hostile keylogger composite supplies
  # the actual keyboard polling and append-write behavior.
  - id: windows-hook-lifecycle
    desc: Windows hook install and chain-management APIs
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/ui/window/hook::windows-hook-install
    any:
      - id: micro-behaviors/ui/window/hook::call-next-hook-ex
      - id: micro-behaviors/ui/window/hook::unhook-windows-hook
      - id: micro-behaviors/ui/window/hook::call-next-hook-ex-text
      - id: micro-behaviors/ui/window/hook::unhook-windows-hook-text
      - id: micro-behaviors/ui/window/hook::hookon-hookoff-exports
  - id: windows-hook-install
    desc: Windows hook install API
    crit: notable
    conf: 0.86
    any:
      - id: micro-behaviors/ui/window/hook::set-windows-hook
      - id: micro-behaviors/ui/window/hook::set-windows-hook-text
  - id: windows-hook-chain-management
    desc: Windows hook chain management API
    crit: component
    conf: 0.86
    any:
      - id: micro-behaviors/ui/window/hook::call-next-hook-ex
      - id: micro-behaviors/ui/window/hook::unhook-windows-hook
      - id: micro-behaviors/ui/window/hook::call-next-hook-ex-text
      - id: micro-behaviors/ui/window/hook::unhook-windows-hook-text
      - id: micro-behaviors/ui/window/hook::hookon-hookoff-exports
  - id: hookon-hookoff-export-pair
    for: [pe]
    desc: HookOn and HookOff export pair
    crit: component
    conf: 0.88
    all:
      - id: micro-behaviors/ui/window/hook::hookon-export-text
      - id: micro-behaviors/ui/window/hook::hookoff-export-text
