defaults:
  for: [source]
  platforms: [windows]
traits:
  - id: set-windows-hook-ex-source
    desc: SetWindowsHookEx reference in source
    crit: notable
    conf: 0.96
    if:
      type: text
      word: SetWindowsHookEx
  - id: set-windows-hook-ex-call-or-name-source
    desc: Source calls or resolves SetWindowsHookEx API
    crit: notable
    conf: 0.94
    for: [c, cpp]
    if:
      type: text
      regex: '("SetWindowsHookEx[AW]?"|\bSetWindowsHookEx[AW]?\s*\()'
