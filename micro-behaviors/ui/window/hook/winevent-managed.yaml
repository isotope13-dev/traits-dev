defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # Managed MemberRef names live in .text. This is a GUI accessibility/event
  # callback API, independent of keyboard recording or global input hooks.
  - id: set-win-event-hook-text-name
    desc: SetWinEventHook API name in code section
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: SetWinEventHook
      section: .text

  - id: set-win-event-hook-declaration
    desc: Declares the SetWinEventHook native API
    crit: notable
    conf: 0.96
    for: [pe, dll, powershell, csharp]
    if:
      type: text
      regex: '\bextern\s+IntPtr\s+SetWinEventHook\s*\('
