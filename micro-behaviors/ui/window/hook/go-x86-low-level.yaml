defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
- id: go-x86-hook-id13-argument-vector
  desc: Go x86 builds hook-ID-13 argument vector
  crit: notable
  conf: 0.94
  if:
    type: hex
    section: .text
    pattern: 'C7 00 0D 00 00 00 8B 4C 24 ?? 89 48 04 C7 40 08 00 00 00 00 C7 40 0C 00 00 00 00 [0-16] 89 44 24 ?? C7 44 24 ?? 04 00 00 00 C7 44 24 ?? 04 00 00 00 E8'
- id: x86-keydown-system-keydown-branch
  desc: x86 branches on keyboard-down message codes
  crit: notable
  conf: 0.95
  if:
    type: hex
    section: .text
    pattern: '81 FA 00 01 00 00 74 ?? 81 FA 04 01 00 00 0F 85'
composite_rules:
- id: go-x86-keyboard-hook-profile
  desc: Keyboard hook argument and event-handler code co-occur
  crit: notable
  conf: 0.96
  all:
  - id: go-x86-hook-id13-argument-vector
  - id: x86-keydown-system-keydown-branch
  - id: set-windows-hook-text
