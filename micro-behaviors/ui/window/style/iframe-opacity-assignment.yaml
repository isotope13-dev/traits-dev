defaults:
  platforms: [windows, unix]
  for: [html]

traits:
  - id: created-iframe-receiver-low-opacity
    desc: Created iframe receiver gets low DOM opacity
    crit: notable
    conf: 0.95
    if:
      # HTML facts do not currently project inline-script ASTs. Compare the
      # receiver's bytes rather than borrowing another element's opacity.
      # This handles ordinary bare identifiers up to 64 bytes; it is not
      # a JavaScript dataflow analysis (aliases/reassignment are unresolved).
      # Bound the second operation to 1500 bytes after the constructor.
      type: yara
      source: |
        rule created_iframe_receiver_low_dom_opacity {
          strings:
            $create = /\b[A-Za-z_]\w{0,63}\s*=\s*document\.createElement\(\s*['"]iframe['"]\s*\)/
            $opacity = /\b[A-Za-z_]\w{0,63}\.style\.opacity\s*=\s*['"]?0(\.0[0-9]*)?['"]?([;\s]|$)/
          condition:
            $create and $opacity and
            for any c in (1..#create) : (
              (@create[c] == 0 or uint8(@create[c]-1) != 46) and
              for any a in (1..#opacity) : (
                (@opacity[a] == 0 or uint8(@opacity[a]-1) != 46) and
                @opacity[a] > @create[c]+!create[c] and
                @opacity[a]-@create[c] < 1500 and
                for any n in (1..64) : (
                  uint8(@opacity[a]+n) == 46 and
                  (uint8(@create[c]+n) == 61 or
                   uint8(@create[c]+n) == 32 or
                   uint8(@create[c]+n) == 9 or
                   uint8(@create[c]+n) == 10 or
                   uint8(@create[c]+n) == 13) and
                  for all j in (0..n-1) : (
                    uint8(@create[c]+j) == uint8(@opacity[a]+j)
                  )
                )
              )
            )
        }
