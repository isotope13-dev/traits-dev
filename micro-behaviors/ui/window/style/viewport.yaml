defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
traits:
  - id: viewport-width-css
    desc: CSS viewport width declaration
    conf: 0.95
    if:
      type: string_literal
      regex: '\bwidth\s*:\s*100vw\b'
  - id: viewport-height-css
    desc: CSS viewport height declaration
    conf: 0.95
    if:
      type: string_literal
      regex: '\bheight\s*:\s*100vh\b'
  - id: transparent-background-css
    desc: CSS transparent background declaration
    conf: 0.95
    if:
      type: string_literal
      regex: '\bbackground\s*:\s*transparent\b'
