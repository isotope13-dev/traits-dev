defaults:
  platforms: [unix, windows]
  for: [html]
  conf: 0.95
traits:
  - id: invalid-css-color-padding
    desc: Repeated non-hex alphabetic CSS colors
    crit: notable
    count_min: 10
    if:
      type: text
      regex: 'color:\s*#[A-Za-z]{0,5}[G-Zg-z][A-Za-z]{0,5};'
      exclude_html_comments: true
