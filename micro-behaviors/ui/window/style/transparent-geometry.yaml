defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: css-one-pixel-dimension
    desc: CSS sets a dimension to 1px
    if:
      type: text
      regex: '(^|[;{\s\x22\x27])(width|height)\s*:\s*1px\b'
      case_insensitive: true

  - id: ie-filter-zero-opacity
    desc: IE alpha filter sets zero opacity
    if:
      type: text
      regex: '\balpha\s*\(\s*opacity\s*=\s*0\s*\)'
      case_insensitive: true

  - id: zero-font-size-style
    desc: CSS sets zero font size
    if:
      type: text
      regex: '(^|[;{\s\x22\x27])font-size\s*:\s*0(px)?\s*[;}]'
      case_insensitive: true

  - id: transparent-text-color-style
    desc: CSS sets transparent text color
    if:
      type: text
      regex: '(^|[;{\s\x22\x27])color\s*:\s*transparent\s*[;}]'
      case_insensitive: true

composite_rules:
  - id: zero-opacity-style
    desc: CSS or IE filter specifies zero opacity
    any:
      - id: css-opacity-zero
      - id: ie-filter-zero-opacity

  - id: transparent-small-or-hidden-style
    desc: Zero opacity near 1px or hidden CSS
    scope: file
    near_bytes: 500
    all:
      - id: zero-opacity-style
    any:
      - id: css-one-pixel-dimension
      - id: css-visibility-hidden

  # Zero font size plus transparent color plus zero opacity hides text from
  # the rendered page while keeping it in the markup: the cloaked-pretext
  # shape (fake-warning pages hide their lure copy from the victim and show
  # a branded image instead). Email preheaders hide text with display:none
  # or 1px sizing rather than this triple, so the conjunction stays
  # suspicious on its own.
  - id: triple-zero-cloaked-text
    desc: Text hidden by zero size, color, opacity
    crit: suspicious
    conf: 0.85
    scope: file
    near_bytes: 300
    all:
      - id: zero-opacity-style
      - id: zero-font-size-style
      - id: transparent-text-color-style
