defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: low-opacity-configuration
    desc: Opacity configuration below ten percent
    if:
      type: text
      regex: '\bopacity\s*=\s*0(\.0[0-9]*)?\s*;'

  - id: iframe-dynamic-opacity-style
    desc: Iframe style interpolates an opacity variable
    if:
      type: text
      regex: '<iframe\b[^\n]{0,600}opacity:["'']\s*\+\s*opacity\b'

  - id: pointer-offset-near-left-style-write
    desc: Pointer offset near element left-position write
    if:
      type: text
      regex: '\b(pageX|clientX)\s*-\s*\d+[\s\S]{0,400}\.left\s*='

  - id: element-style-alias-assignment
    desc: Assigns element style to a variable
    if:
      type: text
      regex: '=\s*document\.getElementById\([^)]{1,160}\)\.style\s*;'

composite_rules:
  - id: pointer-following-opacity-iframe
    desc: Pointer movement positions an opacity iframe
    near_bytes: 7000
    all:
      - id: iframe-dynamic-opacity-style
      - id: pointer-offset-near-left-style-write
      - id: element-style-alias-assignment
      - id: micro-behaviors/hardware/input/event::user-activity-event-listener
