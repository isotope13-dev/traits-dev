# A stylesheet rule whose selector is the bare `iframe` element and whose
# declarations collapse both dimensions to zero hides every frame on the page
# at once, without putting a size on any single tag. Layout CSS sizes frames
# by class or container; zeroing the element type renders each frame the page
# loads invisible while its document still runs.
defaults:
  platforms: [unix, windows]
  for: [html]
traits:
  - id: iframe-element-zero-size-rule
    desc: Stylesheet collapses every iframe to zero size
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\biframe\s*\{\s*(width|height)\s*:\s*0(px)?\s*;\s*(width|height)\s*:\s*0(px)?\s*;'
