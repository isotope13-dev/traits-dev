defaults:
  platforms: [unix, windows]
  # Stylesheet sources are classified as plain `text`, including Sass partials
  # and minified CSS. Keep the library markers available for those assets too.
  for: [documents, data, text]
traits:
  - id: css-responsive-utility-class-text
    desc: Responsive CSS utility class text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.(container-xxl|d-print-inline|text-xl-center)'
  - id: css-custom-form-class-text
    desc: Custom form CSS class text
    crit: notable
    conf: 0.9
    for: [text]
    if:
      type: text
      regex: '\.(custom-(control|file)-(input|label)|was-validated)\b'
  - id: sass-layout-theme-variable-text
    desc: Sass layout or theme variable text
    crit: notable
    conf: 0.95
    for: [text]
    if:
      type: text
      regex: '\$(grid-breakpoints|container-max-widths|theme-colors|enable-rounded)\b'
