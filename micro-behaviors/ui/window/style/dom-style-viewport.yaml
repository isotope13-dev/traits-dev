# DOM style objects (Object.assign(el.style, {...}) or el.style.zIndex = ...)
# that pin an element over the whole viewport. The CSS-text forms live in
# style.yaml (fixed-viewport-style, high-z-index-style).
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.88

traits:
  - id: dom-style-seven-digit-z-index
    desc: DOM style sets 7+ digit zIndex
    if:
      type: text
      regex: '\bzIndex\s*[:=]\s*["'']?\d{7,}'

  - id: dom-style-fixed-full-viewport
    desc: DOM style object pins element to viewport
    if:
      type: text
      regex: 'position:\s*["'']fixed["''],[^}]{0,120}(width|height):\s*["'']100(vw|vh|%)'
