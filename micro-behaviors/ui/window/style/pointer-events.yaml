defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: browser-root-pointer-events-disabled
    desc: Disables pointer input on the browser root
    conf: 0.97
    if:
      type: tree-sitter
      kind: assignment
      regex: '\bdocument\.(body|documentElement)\.style\.pointerEvents\s*=\s*["'']none["'']'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
