defaults:
  platforms: [windows, unix, ios]
  for: [javascript, html]
traits:
  - id: iframe-inline-offscreen-style
    desc: Iframe markup sets negative screen offset
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      exclude_html_comments: true
      regex: '(?i)<iframe\b[^>]{0,200}\bstyle\s*=\s*["''][^>]{0,160}\b(left|top)\s*:\s*-\d{3,}(px|em)\b'
