# `marked` (and its legacy `marked(...)` call form) passes raw inline HTML
# through unmarked; assigning its output to innerHTML renders that HTML live.
# A DOMPurify.sanitize( or equivalent wrapper between the parse and the
# assignment breaks the shape this matches, so hardened renderers stay out.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9
traits:
  - id: marked-parse-innerhtml-assignment
    desc: Renders marked markdown into innerHTML
    if:
      type: text
      regex: 'innerHTML\s*=\s*[\w$.]{0,30}marked\s*(\.\s*parse\s*)?\('
