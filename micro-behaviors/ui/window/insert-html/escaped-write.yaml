defaults:
  platforms: [windows, unix]
traits:
- id: escaped-document-write-reference
  desc: Hex-escaped document and write references
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: (?i)\\x64\\x6f\\x63\\x75\\x6d\\x65\\x6e\\x74.{0,120}\\x77\\x72\\x69\\x74\\x65
