defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.9

traits:
  # The `.text()` call must be awaited, returned, or an arrow body, the shape
  # of a Response read rather than a jQuery/DOM getter; the composite below
  # also requires the nearby fetch body read. fetch(...).text() whose result is assigned to innerHTML in the same
  # promise chain or async body: `.then(r => r.text()).then(h => el.innerHTML
  # = h)`, `const h = await r.text(); el.innerHTML = h`, or
  # `el.innerHTML = await (await fetch(u)).text()`. The right-hand side must be
  # a bare value, not a template or literal, and the span may not cross into
  # a new named function. Style/CSS-named targets are excluded: filling a
  # <style> element with fetched CSS is ordinary theming, not markup.
  - id: response-text-innerhtml-write
    desc: Awaited .text() result assigned to innerHTML
    crit: component
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '(?s)(await|=>|return)\s*[\w$]+\.text\(\)[^`]{0,200}?\.innerHTML\s*=\s*[\w$]+\s*[;,)}\n]'
    not:
      - regex: '\}\s*[\w$]+\s*\([^)]{0,80}\)\s*\{|\bfunction\s+[\w$]+\s*\('
      - regex: '(?i)(style|css|sheet)[\w$]*\.innerHTML\s*='
  - id: inline-fetch-text-innerhtml-write
    desc: innerHTML set to awaited fetch response text
    for: [html, javascript, typescript]
    if:
      type: text
      regex: '\.innerHTML\s*=\s*await\s*\(\s*await\s+fetch\s*\([^)]{1,300}\)\s*\)\s*\.text\('
    not:
      - regex: '(?i)(style|css|sheet)[\w$]*\.innerHTML\s*='

composite_rules:
  - id: fetch-text-innerhtml-write
    desc: Fetched response text assigned to innerHTML
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/client/response-body::fetch-response-body-read
    near_bytes: 500
    any:
      - id: micro-behaviors/ui/window/insert-html::response-text-innerhtml-write
      - id: micro-behaviors/ui/window/insert-html::inline-fetch-text-innerhtml-write
  # Plain spelling: document.write(xhr.responseText). Bounded co-occurrence
  # only; the matcher does not prove the response reaches the document
  # unmodified, only that both halves are present nearby.
  - id: literal-response-text-document-write
    desc: Document write receives HTTP response text
    all:
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
      - id: micro-behaviors/communications/http/client/response-body::response-text
    near_bytes: 600
  # Concealed spelling: document[dec(write)](xhr[dec(responseText)]) with the
  # method and property names built from character-code arrays. Same bounded
  # co-occurrence contract as the literal form above.
  - id: encoded-response-text-document-write
    desc: Computed document call with encoded response-text and write names
    all:
      - id: micro-behaviors/communications/http/client/response-body::charcode-response-text-name
      - id: micro-behaviors/ui/window/insert-html::charcode-write-name
      - id: micro-behaviors/ui/window/dom-access::computed-document-call-computed-input
    near_bytes: 2048
  # Either spelling establishes the same observable sink: an HTTP response
  # body rendered into the document.
  - id: response-text-document-write
    desc: HTTP response text written into the document
    any:
      - id: micro-behaviors/ui/window/insert-html::literal-response-text-document-write
      - id: micro-behaviors/ui/window/insert-html::encoded-response-text-document-write
