defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.9

composite_rules:
  # Plain spelling: document.write(xhr.responseText). Bounded co-occurrence
  # only; the matcher does not prove the response reaches the document
  # unmodified, only that both halves are present nearby.
  - id: literal-response-text-document-write
    desc: Document write receives HTTP response text
    all:
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
      - id: micro-behaviors/communications/http/client/response-body::response-text
    near_bytes: 600
  # Concealed spelling: document[dec(write)](xhr[dec(responseText)]) with the
  # method and property names built from character-code arrays. Same bounded
  # co-occurrence contract as the literal form above.
  - id: encoded-response-text-document-write
    desc: Computed document call with encoded response-text and write names
    all:
      - id: micro-behaviors/communications/http/client/response-body::charcode-response-text-name
      - id: micro-behaviors/ui/window/insert-html::charcode-write-name
      - id: micro-behaviors/ui/window/dom-access::computed-document-call-computed-input
    near_bytes: 2048
  # Either spelling establishes the same observable sink: an HTTP response
  # body rendered into the document.
  - id: response-text-document-write
    desc: HTTP response text written into the document
    any:
      - id: micro-behaviors/ui/window/insert-html::literal-response-text-document-write
      - id: micro-behaviors/ui/window/insert-html::encoded-response-text-document-write
