defaults:
  for:
  - html
  platforms:
  - windows
traits:
- id: packed-iframe-document-tokens
  desc: Packed iframe and document names
  crit: component
  conf: 0.95
  if:
    type: text
    substr: '|iframe|document|'
    exclude_html_comments: true
- id: encoded-php-property-output
  desc: Encoded PHP echoes an object property
  crit: notable
  conf: 0.95
  if:
    type: encoded
    encoding: base64
    regex: echo\s+\$[A-Za-z_][\w]*->[A-Za-z_]\w*\s*;
  platforms:
  - unix
  - windows
