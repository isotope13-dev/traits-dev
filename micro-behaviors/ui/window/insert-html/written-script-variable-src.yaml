# document.write of a <script> tag whose src is a runtime-built variable.
traits:
  - id: document-write-script-variable-src
    desc: Writes script tag with computed src
    crit: notable
    conf: 0.85
    platforms: [windows, unix]
    for: [javascript, html]
    if:
      type: text
      regex: 'document\.write\(\s*''<script[^'']{0,60}src="''\s*\+\s*\w+'
