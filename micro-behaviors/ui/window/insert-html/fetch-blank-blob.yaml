defaults:
  platforms: [windows, unix]
  for: [html]

composite_rules:
  # A browser or arcade can offer blank/blob tabs and separately use fetch
  # and document.write. Co-occurrence supplies neither camouflage nor a
  # binding between the fetched bytes and the written document.
  - id: fetch-document-write-with-blank-blob-urls
    desc: Fetch and document.write with blank/blob URL references
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/url/scheme::blank-and-blob-scheme-pair
      - id: micro-behaviors/communications/http/request/html::html-fetch-call
      - id: micro-behaviors/ui/window/insert-html::browser-document-write
