defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97
traits:
  - id: document-write-script-src-markup-origin
    desc: Document write receives script source markup
    if:
      type: symbol
      kind: call
      exact: document.write
      arg:
        index: 0
        from:
          value: '^<script\b[^>]{0,80}\bsrc\s*='
  - id: document-write-base64-javascript-uri-origin
    desc: Document write receives Base64 JavaScript URI
    if:
      type: symbol
      kind: call
      exact: document.write
      arg:
        index: 0
        from:
          value: '^data:text/javascript;base64,'
  - id: document-write-nested-percent-writer-uri-origin
    desc: Written URI encodes percent markup writer
    if:
      type: symbol
      kind: call
      exact: document.write
      arg:
        index: 0
        from:
          value: '^data:text/javascript;base64,ZG9jdW1lbnQud3JpdGUodW5lc2NhcGUo'
  - id: document-write-uri-percent-script-tag
    desc: Written URI carries a percent script tag
    if:
      type: symbol
      kind: call
      exact: document.write
      arg:
        index: 0
        from:
          value: 'JTNDJTczJTYzJTcyJTY5JTcwJTc0|UzQyU3MyU2MyU3MiU2OSU3MCU3N|lM0MlNzMlNjMlNzIlNjklNzAlNz'
  - id: document-write-uri-percent-http-scheme
    desc: Written URI carries percent HTTP scheme
    if:
      type: symbol
      kind: call
      exact: document.write
      arg:
        index: 0
        from:
          value: 'JTY4JTc0JTc0JTcwJTNBJTJGJTJG|U2OCU3NCU3NCU3MCUzQSUyRiUyR|lNjglNzQlNzQlNzAlM0ElMkYlMk'
composite_rules:
  - id: clock-gated-base64-script-element-write
    desc: Clock-gated cookie update writes encoded script
    crit: notable
    scope: file
    near_bytes: 0
    all:
      - id: document-write-base64-javascript-uri-origin
      - id: document-write-script-src-markup-origin
      - id: micro-behaviors/time/schedule/conditional::clock-gated-cookie-update-and-call
  - id: clock-gated-nested-remote-script-write
    desc: Clock gate writes a nested remote script
    crit: notable
    scope: file
    near_bytes: 0
    all:
      - id: clock-gated-base64-script-element-write
      - id: document-write-nested-percent-writer-uri-origin
      - id: document-write-uri-percent-script-tag
      - id: document-write-uri-percent-http-scheme
