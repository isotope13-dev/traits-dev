# A query-string parameter of the current page written into innerHTML:
# whoever builds the link chooses markup (and event-handler script) that
# runs in the page.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: url-query-param-innerhtml
    desc: Writes a URL query parameter into innerHTML
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'searchParams\w*\.get\([\s\S]{0,900}\.innerHTML\s*=\s*[\w$]+\s*;'
