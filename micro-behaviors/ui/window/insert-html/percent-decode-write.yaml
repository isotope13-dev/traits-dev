defaults:
  for: [html]
  platforms: [windows, unix]
traits:
  - id: source-unescape-then-document-write
    desc: Percent decoder precedes document write
    crit: notable
    conf: 0.97
    if:
      type: text
      encoding: none
      regex: 'unescape\s*\(\w+\);\s*document\.write\s*\(\w+\)'
      exclude_html_comments: true
  # The sibling above matches the accumulator idiom literally
  # (`d=unescape(m);document.write(d)`). Nested packers carry the same
  # idiom one encoding level down (`unescape%28m%29%3Bdocument.write%28`),
  # so the literal matcher never sees it.
  - id: encoded-unescape-write-accumulator
    desc: Encoded unescape-then-write accumulator
    crit: notable
    conf: 0.94
    if:
      type: text
      encoding: none
      regex: 'unescape(\(|%28)m(\)|%29)%3Bdocument\.write(\(|%28)'
      exclude_html_comments: true
  # The matching tell for the next level down: a document.write call whose
  # parentheses arrive percent-encoded (`document.write%28d%29`). Legitimate
  # pages never encode their own call punctuation.
  - id: document-write-encoded-parens
    desc: Document-write call with encoded parentheses
    crit: notable
    conf: 0.94
    if:
      type: text
      encoding: none
      regex: 'document\.write%25[0-9a-fA-F]{2}'
      exclude_html_comments: true
