defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: browser-document-body-clear
    desc: Clears document.body with empty innerHTML
    conf: 0.95
    if:
      type: tree-sitter
      kind: assignment
      regex: '^\s*document\s*\.\s*body\s*\.\s*innerHTML\s*=\s*(""|'''')\s*$'
