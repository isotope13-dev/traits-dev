# The JSON/template composites below remain co-occurrence observations. The
# icon-specific composite separately binds one record field to an HTML attribute.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: object-url-anchor-interpolation
    desc: Object URL field enters anchor markup
    conf: 0.96
    if:
      type: text
      regex: '(?is)<a\b[^>]{0,160}\bhref="\$\{[A-Za-z_$][\w$]*\.(url|href)\}"'
  - id: optional-record-icon-fallback
    desc: Selects optional icon field before fallback
    conf: 0.96
    if:
      type: text
      regex: '\bicon_url\s*=\s*link\.icon\s*\?\s*link\.icon\s*:'
  - id: icon-assignment-record-url-reference
    desc: Icon assignment references record URL
    conf: 0.96
    if:
      type: text
      regex: 'icon_url\s*=.{0,100}link\.url'
  - id: interpolated-icon-image-source
    desc: Interpolates icon value into image source
    conf: 0.97
    if:
      type: text
      regex: '<img\s+src="\$\{icon_url\}"'

  - id: object-link-paragraph-interpolation
    desc: Link field enters paragraph markup
    conf: 0.98
    if:
      type: text
      regex: '>\$\{link\.[A-Za-z_$][\w$]*\}</p>'
  - id: data-assignment-before-render-call
    desc: Data assignment before a rendering call
    conf: 0.94
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]*\s*=\s*data\s*;\s*(create|render|update)[A-Za-z_$\w]*\s*\('

composite_rules:
  - id: record-icon-enters-image-source-attribute
    desc: Record icon enters image source markup
    crit: notable
    conf: 0.97
    all:
      - id: optional-record-icon-fallback
      - id: icon-assignment-record-url-reference
      - id: interpolated-icon-image-source
    near_bytes: 1200
  - id: json-response-and-link-body-markup
    desc: JSON response with link body markup
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/ui/window/insert-html::object-field-in-html-body-markup
      - id: object-url-anchor-interpolation
      - id: micro-behaviors/ui/window/insert-html::shortcut-link-markup-and-append-call
    near_bytes: 2500
  - id: json-response-and-paragraph-markup
    desc: JSON response with paragraph link markup
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: data-assignment-before-render-call
      - id: object-link-paragraph-interpolation
      - id: micro-behaviors/ui/window/insert-html::shortcut-link-markup-and-append-call
    near_bytes: 2500
  - id: json-response-and-link-insertion
    desc: JSON response with link markup and append
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: micro-behaviors/ui/window/insert-html::shortcut-link-markup-and-append-call
    near_bytes: 2500
  - id: json-response-and-anchor-target-markup
    desc: JSON response with anchor target markup
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/request/json::fetch-json-response
      - id: object-url-anchor-interpolation
      - id: micro-behaviors/ui/window/insert-html::shortcut-link-markup-and-append-call
    near_bytes: 2500
