# Markup written via innerHTML whose <style> element body is an unescaped
# template value. A value containing `</style>` closes the element and
# whatever follows is parsed as live HTML in the page.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: innerhtml-style-template-interpolation
    desc: innerHTML style block interpolates a variable
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'innerHTML\s*=\s*`\s*<style>\$\{\s*[\w$.]+\s*\}\s*</style>'
