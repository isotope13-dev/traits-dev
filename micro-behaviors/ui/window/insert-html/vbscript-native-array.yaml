defaults:
  platforms: [windows]
  for: [javascript, typescript]
traits:
  # Facts bind this text to the actual write argument. Merely quoting a
  # document.write example does not supply a call site.
  - id: writes-vbscript-decimal-pe-block
    desc: Writes VBScript containing decimal PE bytes
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)document\.write$'
      arg:
        index: 0
        kind: string
        regex: '(?is)<script\b.{0,120}vbs.{0,1800}array\(\s*77,\s*90,\s*144,\s*0'
