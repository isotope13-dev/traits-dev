defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: browser-appends-inline-script-body
    desc: Appends script element with inline body
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((_
          (_
            (variable_declarator
              name: (identifier) @created
              value: (call_expression
                function: (member_expression property: (property_identifier) @create)
                arguments: (arguments . (string (string_fragment) @tag)))))
          (expression_statement
            (assignment_expression
              left: (member_expression
                object: (identifier) @assigned
                property: (property_identifier) @body)))
          (expression_statement
            (call_expression
              function: (member_expression property: (property_identifier) @append)
              arguments: (arguments . (identifier) @appended))))
          (#eq? @create "createElement")
          (#eq? @tag "script")
          (#match? @body "^(textContent|text)$")
          (#eq? @append "appendChild")
          (#eq? @created @assigned)
          (#eq? @created @appended))
