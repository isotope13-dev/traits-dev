# document.write of a <style> block whose tag, selector and declarations are
# all array elements decoded at runtime: the page gains a CSS rule that is
# not visible anywhere in the source.
traits:
  - id: document-write-array-assembled-style-rule
    desc: Writes style rule assembled from decoded array
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [javascript, html]
    if:
      type: text
      regex: 'document\.write\(''<''\+\w+\[\d\]\+''\s?''\+\w+\[\d\]\+''>\.''\+\w+\[\d\]\+''\{''\+\w+\[\d\]\+''\}'
