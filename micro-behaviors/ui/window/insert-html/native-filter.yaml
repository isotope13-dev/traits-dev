# Observed native response-rewriting ingredients. This conjunction does not
# prove a particular stream's origin, injection destination or operator intent.
defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.94
traits:
  - id: native-script-src-tag-prefix
    desc: Native binary embeds script src tag prefix
    if:
      type: text
      regex: '<script( type="text/javascript")? src="'
  - id: native-closing-head-marker
    desc: Native binary embeds closing HTML head marker
    # Six-byte, NUL-terminated fragments fall below extracted-text limits.
    if:
      type: hex
      pattern: '3C 2F (68 65 61 64 | 48 45 41 44) 00'
      section: '.rdata'
composite_rules:
  - id: native-script-tag-driver-filter-api-profile
    desc: Script-tag and HTML markers with driver filter APIs
    all:
      - id: native-script-src-tag-prefix
      - id: native-closing-head-marker
      - id: micro-behaviors/fs/file/handle::device-io-control-win
      - id: micro-behaviors/os/service/create::create-service
