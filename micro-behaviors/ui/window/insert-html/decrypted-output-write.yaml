# The value returned by a decrypt() call is written straight into the page:
# the document's real markup exists only as ciphertext in the source.
traits:
  - id: decrypted-output-document-write
    desc: Writes decrypted text into the document
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [javascript, html]
    if:
      type: text
      regex: '\bvar \w+\s*=\s*[\w.]{1,40}\.decrypt\([^)\n]{1,80}\);?\s*document\.write(ln)?\(\w+\)'
