defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  # User-edited shortcuts and HTML rendering do not establish an attack.
  # This preserves the co-occurrence observation without claiming injection,
  # an attacker-controlled source, or a demonstrated executable payload.
  - id: shortcut-storage-and-link-markup
    desc: Shortcut storage accompanies HTML link rendering
    crit: notable
    conf: 0.94
    near_bytes: 6000
    all:
      - id: micro-behaviors/ui/controls/input::shortcut-name-form-value
      - id: micro-behaviors/ui/controls/input::shortcut-url-form-value
      - id: micro-behaviors/data/collection/array::shortcut-form-values-build-record
      - id: micro-behaviors/data/db/web-storage::shortcuts-record-persist
      - id: micro-behaviors/data/db/web-storage::dom-storage-getitem-call
      - id: micro-behaviors/ui/window/insert-html::jquery-appended-link-markup
