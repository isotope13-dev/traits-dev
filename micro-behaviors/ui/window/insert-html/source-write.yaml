defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.95
traits:
  - id: script-tag-document-write-unescape
    desc: Script element writes percent-decoded markup
    if:
      type: text
      regex: '(?is)<script\b[^>]{0,80}>.{0,900}?document\.write\s*\(\s*unescape\s*\('
