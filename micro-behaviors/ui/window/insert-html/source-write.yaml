defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.95
traits:
  - id: script-tag-document-write-unescape
    desc: Script element writes percent-decoded markup
    if:
      type: yara
      source: |
        rule script_element_percent_writer {
          strings:
            $writer = /<script\b[^>]{0,80}>[\s\S]{0,900}document\.write\s*\(\s*unescape\s*\(/ nocase
            $comment = /<!--(.|\n|\r)*?-->/
          condition:
            for any i in (1..#writer) : (
              not for any j in (1..#comment) : (
                @writer[i] >= @comment[j] and
                @writer[i] < @comment[j] + !comment[j]
              )
            )
        }
