defaults:
  platforms: [windows]
  for: [chm]

composite_rules:
- id: chm-single-topic-unescape-write
  desc: Single-topic CHM writes unescaped HTML
  crit: suspicious
  conf: 0.98
  scope: archive
  for: [chm, html, javascript]
  all:
    - id: metadata/document/chm::chm-single-user-entry
    - id: metadata/document/chm::chm-has-objinst
    - id: micro-behaviors/data/decode/url::unescape-write-method-argument
    - id: micro-behaviors/ui/window/insert-html::browser-document-write-unescape
  unless:
    - id: metadata/document/chm::chm-data-basename

