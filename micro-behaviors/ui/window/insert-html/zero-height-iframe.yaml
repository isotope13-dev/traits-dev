defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  - id: zero-height-iframe-raw-write
    desc: Raw bytes write zero-height iframe markup
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule zero_height_written_iframe_forms {
          strings:
            $plain = /document\.write\(["']<iframe width=[0-9]+ height=0 src=/
            $octal = /\\144\\157\\143\\165\\155\\145\\156\\164\\56\\167\\162\\151\\164\\145\\50\\(?:42|47)\\74\\151\\146\\162\\141\\155\\145\\40\\167\\151\\144\\164\\150\\75(\\[0-7]{2,3}){1,8}\\40\\150\\145\\151\\147\\150\\164\\75\\60\\40\\163\\162\\143\\75/
          condition:
            any of them
        }
  # The Script Encoder conceals the written markup from raw-byte scans; the
  # decoded layer carries the document.write call literally.
  - id: zero-height-iframe-script-decoded-write
    desc: Script-decoded zero-height iframe write
    crit: notable
    conf: 0.95
    if:
      type: encoded
      encoding: script
      regex: 'document\.write\(["'']<iframe width=[0-9]+ height=0 src='
composite_rules:
  - id: zero-height-iframe-document-write
    desc: Writes iframe markup with zero height
    crit: notable
    conf: 0.98
    any:
      - id: zero-height-iframe-raw-write
      - id: zero-height-iframe-script-decoded-write
