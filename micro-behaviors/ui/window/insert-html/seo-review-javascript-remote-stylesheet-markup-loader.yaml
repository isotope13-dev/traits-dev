defaults:
  platforms: [unix, windows]
  for: [javascript]
  conf: 0.9
composite_rules:
- id: javascript-remote-stylesheet-markup-loader
  desc: JavaScript injects a stylesheet-looking remote response as page markup
  crit: suspicious
  conf: 0.99
  attack: T1189
  all:
  - id: micro-behaviors/communications/http/client/resource::css-url-before-fetch
  - id: micro-behaviors/communications/http/client/response-body::js-response-text-read
  - id: micro-behaviors/ui/window/insert-html::browser-innerhtml-assignment
