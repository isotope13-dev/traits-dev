defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  conf: 0.9
composite_rules:
# Payload disguised as a stylesheet: a remote `.css` URL is fetched and its
# body is rendered as HTML rather than applied as CSS (BengalSEO-style
# loader). Both halves must sit together: the CSS URL ahead of the fetch,
# and that fetch's response text assigned to innerHTML. A page that merely
# lists CDN stylesheets near an unrelated fetch (e.g. an iCal download
# parsed by a calendar widget, with template-literal innerHTML elsewhere)
# does not qualify.
- id: javascript-remote-stylesheet-markup-loader
  desc: Renders fetched .css body as page HTML
  crit: suspicious
  conf: 0.95
  attack: T1189
  all:
  - id: micro-behaviors/communications/http/client/resource::css-url-before-fetch
  - id: micro-behaviors/ui/window/insert-html::fetch-text-innerhtml-write
  near_bytes: 1400
