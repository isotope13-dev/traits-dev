defaults:
  platforms: [android]
  for: [apk, zip, dex]
  crit: component
  conf: 0.9

traits:
  - id: android-interstitial-ad-api
    desc: Android interstitial advertising API
    if:
      type: text
      regex: 'Lcom/(facebook/ads|google/android/gms/ads)/InterstitialAd;'

  - id: android-ad-display-time-state
    desc: Stores Android advertisement display time
    if:
      type: text
      exact: LAST_SHOW_TIME

  - id: android-ad-display-count-state
    desc: Tracks Android advertisement display count
    if:
      type: text
      exact: getShowCount

composite_rules:
  - id: android-interstitial-display-pacing
    desc: Android paces repeated interstitial displays
    crit: notable
    conf: 0.94
    all:
      - id: android-interstitial-ad-api
      - id: android-ad-display-time-state
      - id: android-ad-display-count-state
