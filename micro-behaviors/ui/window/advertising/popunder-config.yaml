defaults:
  platforms: [windows, unix]
  for: [html, makefile, text]

traits:
  - id: popunder-config-entry
    desc: Popunder configuration array entry
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '_pop\.push\(\[''(siteId|minBid|popundersPerIP)'

  # PropellerAds-style onclick ("popunder") zone tag: a script whose source is
  # apu.php with a numeric zoneid on a rotating ad-serving host
  # (go.onclasrv.com, onclkds.com, ...). Ordinary site monetization, but the
  # opened windows are a common malvertising and scam-redirect channel.
  - id: popunder-zone-tag-script
    desc: Loads apu.php popunder ad zone script
    crit: notable
    conf: 0.9
    for: [html]
    if:
      type: text
      regex: '(?i)<script\b[^>]{0,99}\bsrc=["''](https?:)?//[^"''/\s]{3,80}/apu\.php\?zoneid=\d+'
