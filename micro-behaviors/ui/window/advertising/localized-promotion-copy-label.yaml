# These are static source-content clues used to exclude e-commerce UI code
# from a generic ad-injection heuristic. They do not establish that the text is
# displayed, or that any advertising operation occurs.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html, package.json, chrome-manifest]
  crit: component
  conf: 0.9
traits:
- id: localized-promotion-copy-label
  desc: Artifact has promotion disclaimer label key
  if:
    type: text
    substr: disclaimerPromotionTitle
