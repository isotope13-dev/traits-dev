defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, -kotlin]
  crit: notable
  conf: 0.82
traits:
- id: browser-ad-label-text-assignment
  desc: Assigns an Ad label to DOM text
  conf: 0.95
  for: [javascript, typescript]
  if:
    type: tree-sitter
    query: |
      (assignment_expression
        left: (member_expression property: (property_identifier) @property)
        right: (string (string_fragment) @label)
        (#eq? @property "textContent")
        (#eq? @label "Ad")) @assignment
- id: browser-query-sponsored-marker
  desc: Queries sponsored-content marker
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'querySelector\([^)]{0,220}sponsored'
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
- id: browser-hide-sponsored-element
  desc: Hides or removes sponsored element
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'sponsored[A-Za-z_$]*\.style\.display\s*=\s*["'']none["'']'
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
- id: browser-hides-promoted-content-class
  desc: Hides promoted content with a CSS class
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'classList\.add\([^)]{0,120}\b(hide|hidden)[-_]promoted\b'
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
