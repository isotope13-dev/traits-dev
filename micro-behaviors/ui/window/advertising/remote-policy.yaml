defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96
traits:
  - id: remote-banner-placement-record
    desc: Reads banner or overlay placement records
    if:
      type: text
      regex: '\.data\.(bannerlist|popupoverlaylist)\s*\['
  - id: remote-ad-display-switch
    desc: Checks banner or popup display policy
    if:
      type: text
      regex: '\.data\.(banner_injection_status|popupOverlay_status|popup_status)\s*=='
  - id: keyword-redirect-policy-record
    desc: Reads keyword and redirect policy records
    if:
      type: text
      regex: '\.data\.keywordlist\s*\[\s*["''](patch_url|keyword)["'']\s*\+'
