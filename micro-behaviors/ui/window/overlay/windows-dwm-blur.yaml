defaults:
  for: [pe]
  platforms: [windows]
traits:
  # Desktop Window Manager blur-behind is the usual way to give an external
  # (separate-process) overlay a per-pixel transparent swap chain on top of
  # another application's window. Ordinary apps use it for glass effects.
  - id: dwm-enable-blur-behind-import
    desc: Imports DWM blur-behind window API
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: import
      exact: DwmEnableBlurBehindWindow
