# Archive-scoped code/authority co-occurrence. This establishes neither that
# the same handler supplies every leg nor that clicked URLs leave the browser.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip]
composite_rules:
  - id: broad-host-click-url-message-code
    desc: Broad host grant with click and URL-message code
    crit: notable
    conf: 0.95
    scope: archive
    all:
      - id: micro-behaviors/ui/window/click::browser-global-click-listener
      - id: micro-behaviors/ui/window/click::clicked-anchor-url-read
      - id: micro-behaviors/communications/ipc/message::cancelled-event-url-runtime-message
      - id: metadata/permission/host::broad-host-access
