defaults:
  platforms: [windows, unix]
  for: [svg]
  crit: notable
traits:
  - id: svg-rectangle-inline-click
    desc: SVG rectangle has inline click handler
    if:
      type: text
      regex: '<rect\b[^>]{0,160}\bonclick\s*='
  - id: svg-transparent-pointer-target
    desc: SVG transparent target uses pointer cursor
    if:
      type: text
      regex: 'fill=["'']transparent["'']\s+cursor=["'']pointer["'']'
