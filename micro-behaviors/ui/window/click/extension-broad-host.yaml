# Cancellation plus internal messaging does not establish the eventual target.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, chrome-manifest, crx, xpi, zip]
composite_rules:
  - id: extension-broad-host-link-click-forwarding
    desc: Broad-host link clicks cancelled and forwarded
    crit: suspicious
    conf: 0.97
    scope: archive
    all:
      - id: micro-behaviors/ui/window/click::extension-document-link-click-forwarding
      - id: metadata/permission/host::broad-host-access
    unless:
      # Preserve the established exemption for download-only forwarding.
      - id: download-gated-click-interception-context

  # Download-only handling retains the existing scoped exemption.
  - id: download-gated-click-interception-context
    desc: Download-gated click interception context
    crit: exception
    conf: 0.96
    for: [javascript, typescript]
    near_lines: 140
    all:
      - id: micro-behaviors/ui/window/click::browser-global-click-listener
      - id: micro-behaviors/ui/window/click::clicked-anchor-url-read
      - id: micro-behaviors/communications/ipc/message::cancelled-event-url-runtime-message
    any:
      - id: micro-behaviors/ui/window/click::download-attribute-gate
      - id: micro-behaviors/ui/window/click::download-url-target-gate

