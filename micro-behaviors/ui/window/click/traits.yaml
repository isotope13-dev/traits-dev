defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript, html]
traits:
  - id: programmatic-element-click
    desc: Programmatically clicks a DOM element
    conf: 0.9
    if:
      type: text
      regex: '\b[a-zA-Z_$][\w$]*\.click\s*\(\s*\)'
    not:
      - regex: '[\w$]*(Ref|Input|Button|Menu|Modal|Form|Field|Element)[\w$]*\.click\s*\('
      - regex: 'current\.click\s*\('

  - id: browser-click-listener
    desc: Registers browser click event listener
    conf: 0.88
    if:
      type: symbol
      kind: call
      regex: '^([A-Za-z_$][A-Za-z0-9_$]*\.)?addEventListener$'
      arg:
        kind: string
        exact: click
  - id: browser-global-click-listener
    desc: Registers document-wide click event listener
    conf: 0.94
    if:
      type: text
      regex: '\b(document|window|document\.body)\.addEventListener\s*\(\s*["'']click["'']'
  # Popup UI sends the anchor's own href to the background so the popup
  # document does not navigate away. That is a tab open, not page hijacking.
  - id: popup-open-same-href
    desc: Popup message opens the clicked href
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: 'sendMessage\(\{\s*action:\s*"open_link",\s*url:\s*\w+\.href\s*\}\)'
  - id: clicked-anchor-url-read
    desc: Reads clicked anchor URL from event
    conf: 0.92
    if:
      type: text
      regex: '\.target\.(closest\s*\(\s*["'']a(\[href\])?["'']|href\b)'
  # Download-manager scoping: the handler only acts when the anchor carries
  # the HTML download attribute (or the code reads the element's download
  # property). Ordinary page navigation never sets it, so a click handler
  # gated on it intercepts file downloads, not browsing. Used as benign
  # context where a global click listener would otherwise read as hijacking.
  - id: download-attribute-gate
    desc: Click handling checks anchor download attribute
    conf: 0.93
    if:
      type: text
      regex: '(get|has)Attribute\s*\(\s*["'']download["'']|\.download\s*([!=]=|[&|?])'
  # Download URL scheme scoping: checks for download/transfer protocols
  # (magnet:, urn:btih:, ftp:, ed2k:).
  - id: download-scheme-target-check
    desc: Checks URL for download scheme
    conf: 0.93
    if:
      type: text
      regex: '(?i)(startsWith|test|match)\s*\(\s*["''](magnet:|urn:btih:|ftp:\/\/|ed2k:\/\/)'
  - id: magnet-url-predicate-call
    desc: Calls a magnet URL predicate
    conf: 0.93
    if:
      type: text
      # A shared library may hold the URL-scheme test while the click handler
      # invokes the predicate to decide whether to cancel and forward a link.
      regex: '\.isMagnet\s*\(\s*[^)]{1,80}\)'
  # Anchor href download scheme selector (e.g. a[href^='magnet:'])
  - id: anchor-download-scheme-selector
    desc: Checks anchor selector for download scheme
    conf: 0.93
    if:
      type: text
      regex: '(?i)a\[href\^?=\s*["'']?(magnet:|urn:btih:|ftp:\/\/|ed2k:\/\/)'
  # Download URL file extension scoping: checks for file download extensions
  # (.torrent, .zip, etc.).
  - id: download-extension-target-check
    desc: Checks URL for download file extension
    conf: 0.93
    if:
      type: text
      regex: '(?i)\.endsWith\s*\(\s*["'']\.(torrent|zip|rar|7z|exe|dmg|iso)["'']'
  # Bound-handler capture flag; `[^;\n]` blocks cross-statement `, true)` FPs.
  - id: capture-phase-click-named-handler
    desc: Capture-phase click listener with named handler
    conf: 0.88
    if:
      type: text
      regex: '\.addEventListener\(["'']click["''],\s*[\w$.]+,\s*(true|!0)\s*\)'
  # Inline function handler ending in capture `true`.
  - id: capture-phase-listener-inline
    desc: Capture-phase listener with inline function
    conf: 0.88
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @method)
          arguments: (arguments (_) (function_expression) (true))) @call
          (#eq? @method "addEventListener"))
  # Byte-local pairing — near_bytes alone is unreliable on long minified lines.
  - id: paired-prevent-and-stop
    desc: preventDefault then stopImmediatePropagation
    conf: 0.9
    if:
      type: text
      regex: '\.preventDefault\s*\(\s*\)[\s\S]{0,80}\.stopImmediatePropagation\s*\(\s*\)'
  - id: stop-then-location-href
    desc: stopImmediatePropagation then location.href
    conf: 0.9
    if:
      type: text
      regex: '\.stopImmediatePropagation\s*\(\s*\)[\s\S]{0,200}location\.href\s*='
  - id: stop-then-window-open
    desc: stopImmediatePropagation then window.open
    conf: 0.9
    if:
      type: text
      regex: '\.stopImmediatePropagation\s*\(\s*\)[\s\S]{0,200}window\.open\s*\('
  - id: stop-then-cached-open
    desc: stopImmediatePropagation then cachedOpen
    conf: 0.9
    if:
      type: text
      regex: '\.stopImmediatePropagation\s*\(\s*\)[\s\S]{0,200}cachedOpen\s*\('
  - id: browser-computed-click-listener
    desc: Registers computed browser click listener
    conf: 0.86
    if:
      type: text
      # The event argument must actually be click; pageshow is not a click.
      regex: '(document|window)\s*\[["'']addEventListener["'']\]\s*\(\s*["'']click["'']'
  - id: dom-computed-click-call
    desc: Calls click through computed DOM property
    conf: 0.86
    if:
      type: text
      # The leading `[\w$)\]]` requires a receiver the subscript can apply to
      # (`el["onclick"]()`, `f()[k]()`).  Without it the pattern also matched a
      # Markdown link in a doc comment — `[Average click position](https://…)`
      # — which is prose, not a computed property call.
      regex: '[\w$)\]]\[[^\]\n]{1,80}click[^\]\n]{0,80}\]\s*\('
  # Relocated from objectives/evasion/decoy/lure (2026-08). Picking the
  # mousedown event over click on one browser is ordinary tap/latency handling
  # -- FastClick, the library LocalCDN and thousands of sites bundle, is built
  # on it. The hijack intent comes from cancelling the navigation first, which
  # `cancel-event-then-navigate` supplies.
  - id: browser-mousedown-click-selection
    desc: Selects mousedown over click by browser
    conf: 0.9
    if:
      type: text
      regex: '(?i)\?\s*["'']mousedown["'']\s*:\s*["'']click["'']'
  # Browser-automation harnesses (CDP/Playwright-style bootstrap scripts) lock
  # popups down so the controlled tab never spawns a second window the
  # automation can't see. Locking the global reference this way is a distinct,
  # narrower technique than a click-hijack's local override -- ordinary decoy
  # scripts redirect one link's handler, they don't disable window.open for
  # the whole page.
  - id: window-open-property-override
    desc: Redefines global window.open via defineProperty
    conf: 0.9
    if:
      type: text
      regex: "Object\\.defineProperty\\(\\s*window\\s*,\\s*['\"]open['\"]"
  # Reads an anchor's target attribute to find _blank links. Paired with the
  # override above, this is the "force everything into one tab" automation
  # idiom rather than link-hijacking, which does not need to enumerate targets.
  - id: target-blank-attribute-check
    desc: Checks anchor target attribute equals _blank
    conf: 0.85
    if:
      type: text
      regex: "getAttribute\\(\\s*['\"]target['\"]\\s*\\)\\s*===?\\s*['\"]_blank['\"]"

  - id: anchor-click-scoped-to-container
    desc: Anchor click handling checks containment
    conf: 0.9
    if:
      type: text
      # The handler resolves the clicked anchor and then checks that it
      # belongs to the app's own containers (a known element id or a
      # `.contains()` membership test) before acting. Extension pages use
      # this shape for their own dropdown menus and saved-link lists;
      # page-wide click forwarding does not gate on containment.
      regex: 'closest\s*\(\s*["'']a\[href\]["'']\s*\)[\s\S]{0,220}(closest\s*\(\s*["'']#|\.contains\s*\()'
  - id: anchor-click-origin-check
    desc: Anchor click handler checks origin
    conf: 0.88
    if:
      type: text
      regex: '\b(origin\s*===?\s*(window\.)?location\.origin|location\.origin\s*===)'
composite_rules:
  - id: capture-phase-event-listener
    desc: Registers capture-phase DOM event listener
    conf: 0.88
    any:
      - id: capture-phase-click-named-handler
      - id: capture-phase-listener-inline
  - id: cancel-event-then-navigate
    desc: Cancels DOM event then navigates
    conf: 0.92
    all:
      - id: paired-prevent-and-stop
    any:
      - id: stop-then-location-href
      - id: stop-then-window-open
      - id: stop-then-cached-open
  - id: download-url-target-gate
    desc: Checks link for download target
    conf: 0.93
    any:
      - id: download-scheme-target-check
      - id: magnet-url-predicate-call
      - id: anchor-download-scheme-selector
      - id: download-extension-target-check
  - id: anchor-click-scoped-to-origin
    desc: Anchor click handling checks link origin
    crit: notable
    conf: 0.9
    near_lines: 30
    all:
      - id: clicked-anchor-url-read
      - id: anchor-click-origin-check
  - id: extension-document-link-click-forwarding
    desc: Extension forwards URLs from cancelled click events
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: browser-global-click-listener
      - id: clicked-anchor-url-read
      - id: micro-behaviors/communications/ipc/message::cancelled-event-url-runtime-message
    unless:
      # A popup asks the background to open the anchor's own href. That is
      # the extension UI choosing a tab, not page-wide click forwarding.
      - id: popup-open-same-href
    downgrade:
      any:
        # Container-scoped link handling is the extension acting on its own
        # UI (route the click through the background tab opener); only
        # unscoped forwarding reads as navigation hijacking.
        - id: anchor-click-scoped-to-container
        - id: anchor-click-scoped-to-origin
