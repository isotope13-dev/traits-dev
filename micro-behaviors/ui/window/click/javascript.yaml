defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: document-body-click-handler
    desc: Installs document body click handler
    if:
      type: symbol
      exact: document.body.onclick
  - id: opener-element-click
    desc: Clicks an element in an opener window
    crit: notable
    conf: 0.94
    for: [javascript, typescript, html, php, shell, python, powershell]
    if:
      type: text
      regex: '(?i)\b(window|parent|top)\.opener\.[A-Za-z_$][A-Za-z0-9_$]*\.click\b'
