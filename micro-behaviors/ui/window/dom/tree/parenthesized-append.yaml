# The call-fact extractor may omit calls on parenthesized fallback receivers.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
traits:
  - id: document-fallback-append-child
    desc: Appends node to fallback document container
    if:
      type: text
      regex: '\(document\.(head|body)\s*\|\|\s*document\.documentElement\)\.appendChild\s*\('
composite_rules:
  - id: append-child-insertion
    desc: Inserts a child through a DOM receiver
    any:
      - id: micro-behaviors/data/collection/dom::source-append-child-call
      - id: document-fallback-append-child
