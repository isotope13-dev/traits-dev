defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, -kotlin]
  crit: notable
  conf: 0.82
traits:
- id: source-append-child-call
  desc: Appends a node to a DOM parent
  crit: notable
  conf: 0.9
  for: [scripts, html]
  if:
    type: text
    regex: '\bappendChild\s*\('

- id: parent-document-body-append
  desc: Appends node into parent document body
  crit: notable
  conf: 0.96
  if:
    type: symbol
    kind: call
    exact: parent.document.body.appendChild
- id: document-root-append
  desc: Appends element to document root
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: document.documentElement.appendChild
# A call, not a mention. As raw text this also matched `.appendChild(` inside
# comments and doc examples: LibreWolf Portable's about:addons AddonCard
# source carries `*    document.body.appendChild(...)` in a JSDoc block, and
# that comment satisfied the DOM leg of the ad-injection composite. The
# existing sourcemap/d.ts exclusions below are the same class of problem
# handled one carrier at a time.
- id: document-domain-member-read
  desc: Reads document.domain property
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: member
    exact: document.domain
- id: browser-append-child
  desc: Appends child DOM node
  crit: notable
  conf: 0.8
  if:
    type: symbol
    regex: '(^|\.)appendChild$'
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
- id: browser-insert-before
  desc: Inserts DOM node before reference node
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '\.insertBefore\s*\('
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
- id: browser-node-remove
  desc: Removes a child node from the DOM
  conf: 0.8
  if:
    type: text
    regex: '\.removeChild\s*\(|\b(document|querySelector|getElementById)\b.{0,40}\.remove\(\s*\)'
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
- id: dom-blob-download-link
  desc: Triggers Blob download link
  conf: 0.88
  if:
    type: text
    regex: '(?s)new\s+Blob\s*\(.{0,260}URL\.createObjectURL\s*\(.{0,260}\.download\s*='
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
