defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, -kotlin]
  crit: notable
  conf: 0.82
traits:
- id: parent-document-body-append
  desc: Appends node into parent document body
  crit: notable
  conf: 0.96
  if:
    type: symbol
    kind: call
    exact: parent.document.body.appendChild
- id: document-domain-member-read
  desc: Reads document.domain property
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: member
    exact: document.domain
# The Blob and its object URL appear in either order (a named Blob passed to
# createObjectURL, or `URL.createObjectURL(new Blob(...))` inline); one atom
# per order keeps each regex short, and dom-blob-download-link joins them.
- id: dom-blob-object-url-download
  desc: Downloads a Blob through an object URL
  conf: 0.88
  if:
    type: text
    regex: '(?s)new\s+Blob\s*\(.{0,260}URL\.createObjectURL\s*\(.{0,260}\.download\s*='
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
- id: dom-inline-blob-object-url-download
  desc: Downloads an inline Blob object URL
  conf: 0.88
  if:
    type: text
    regex: '(?s)URL\.createObjectURL\s*\(.{0,260}new\s+Blob\s*\(.{0,260}\.download\s*='
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file

composite_rules:
- id: dom-blob-download-link
  desc: Triggers Blob download link
  conf: 0.88
  any:
  - id: dom-blob-object-url-download
  - id: dom-inline-blob-object-url-download
