# Syntax clues do not establish an automatic or unwanted download.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
traits:
  - id: object-url-click-or-download-attribute
    desc: Object URL click or download-attribute syntax
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'createObjectURL[\s\S]{0,300}(\.click\(|download\s*=)|downloadElement\.download\s*='
    not:
      - substr: duplicati-config.
      - substr: downloadFile(o,e){let t=window.URL.createObjectURL(o)
