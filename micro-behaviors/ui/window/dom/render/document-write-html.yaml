# Writing an HTML variable into the current document (`document.write(html)`).
# Setting page content from a markup string is a neutral rendering primitive:
# browser-automation libraries use it to load a page's own markup. Phishing,
# credential-harvest, and redirect evidence belongs to the composites that cite it.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable

traits:
  - id: document-write-html
    desc: Writes html variable to current document
    if:
      type: text
      regex: 'document\.write\s*\(\s*html\s*\)'
