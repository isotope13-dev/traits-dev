defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  # Facts do not expose the repeated-callback binding or the relationship
  # between the decremented identifier and its displayed value. Proximity
  # alone would also match a real countdown beside an unrelated clamp.
  - id: timed-positive-floor-counter
    desc: Timed counter stops above zero
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression function: (identifier) @timer
          arguments: (arguments .
            [(arrow_function body: (statement_block
               (expression_statement (assignment_expression
                 left: (identifier) @counter
                 right: (call_expression function: (member_expression
                   object: (identifier) @math property: (property_identifier) @max)
                   arguments: (arguments . (number) @floor .
                     (binary_expression left: (identifier) @previous
                       operator: "-" right: (number) @step)))))
               (expression_statement (assignment_expression
                 left: (member_expression property: (property_identifier) @property)
                 right: (identifier) @display))))
             (function_expression body: (statement_block
               (expression_statement (assignment_expression
                 left: (identifier) @counter
                 right: (call_expression function: (member_expression
                   object: (identifier) @math property: (property_identifier) @max)
                   arguments: (arguments . (number) @floor .
                     (binary_expression left: (identifier) @previous
                       operator: "-" right: (number) @step)))))
               (expression_statement (assignment_expression
                 left: (member_expression property: (property_identifier) @property)
                 right: (identifier) @display))))])) @counter_timer
          (#eq? @timer "setInterval")
          (#eq? @math "Math")
          (#eq? @max "max")
          (#eq? @counter @previous)
          (#eq? @counter @display)
          (#match? @property "^(textContent|innerText|innerHTML)$")
          (#match? @floor "^[1-9][0-9]*$")
          (#match? @step "^[1-9][0-9]*$"))
  - id: repeated-randomized-dom-text
    desc: Timer displays randomized array selections
    conf: 0.9
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression function: (identifier) @timer
          arguments: (arguments .
            [(arrow_function body: (statement_block
               (expression_statement (assignment_expression
                 left: (member_expression property: (property_identifier) @property)
                 right: (binary_expression) @content))))
             (function_expression body: (statement_block
               (expression_statement (assignment_expression
                 left: (member_expression property: (property_identifier) @property)
                 right: (binary_expression) @content))))])) @randomized_text
          (#eq? @timer "setInterval")
          (#match? @property "^(textContent|innerText|innerHTML)$")
          (#match? @content "\\[\\s*Math\\.floor\\(\\s*Math\\.random\\(")
          (#match? @content "Math\\.random\\(\\)[^;]{1,240}Math\\.random\\(\\)"))
