defaults:
  platforms: [windows, unix]
  for: [javascript, html, text]
traits:
  - id: fractional-constructor-dimensions
    desc: Fractional dimensions in constructor arguments
    crit: component
    conf: 0.95
    if:
      type: text
      regex: '\("\./\w+\.\w+","\w+","0\.1","0\.1","9",'
  - id: swfobject-write-packer-tokens
    desc: SWFObject write tokens in packer table
    crit: notable
    if:
      type: text
      substr: '|SWFObject|write|'
