# Writing HTML or executable script content into a child/popup window handle
# (`popup.document.write(...)`, `popup.document.body.innerHTML = ...`).
# Print-preview helpers also write static HTML into a blank popup, so these
# stay neutral rendering primitives; attack composites add sandbox-escape,
# script-execution, credential-harvest, download-lure, or exfiltration legs.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable

traits:
  - id: popup-handle-document-write-dot
    desc: Calls document.write on child window handle
    conf: 0.93
    if:
      type: text
      exclude_comments: true
      exclude_html_comments: true
      regex: '(\b[A-Za-z_$][\w$]*|\)\s*)\.\s*document\s*\.\s*write(ln)?\s*\('
    not:
      - regex: '^\b(window|self|top|parent|globalThis|frames|this)\s*\.'
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/lang/scripted::dts-declaration-file

  - id: popup-handle-document-write-bracket
    desc: Calls bracketed document write on window
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      exclude_html_comments: true
      regex: '\b[A-Za-z_$][\w$]*\s*\[\s*["'']document["'']\s*\]\s*\[\s*["'']write(ln)?["'']\s*\]\s*\('
    not:
      - regex: '^\b(window|self|top|parent|globalThis|frames|this)\s*\['
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/lang/scripted::dts-declaration-file

  - id: popup-handle-document-innerhtml
    desc: Assigns innerHTML on child window document
    conf: 0.93
    if:
      type: text
      exclude_comments: true
      exclude_html_comments: true
      regex: '\b[A-Za-z_$][\w$]*\.\s*document\.(body|documentElement)\.innerHTML\s*='
    not:
      - regex: '^\b(window|self|top|parent|globalThis|frames|this)\.'
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/lang/scripted::dts-declaration-file

  - id: literal-script-element-tag
    for: [javascript, typescript]
    desc: String literal embeds HTML script tag
    conf: 0.92
    if:
      type: literal
      regex: '(?i)<\s*script(\s|>)'
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/lang/scripted::dts-declaration-file

  - id: escaped-closing-script-tag
    for: [html]
    desc: Escaped closing script tag in HTML
    conf: 0.92
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)(<\\/script\b|["''`]\s*<\s*script(\s|>))'

  - id: child-window-script-element-create
    desc: Creates script node in child window
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      exclude_html_comments: true
      regex: '\b[A-Za-z_$][\w$]*\.document\.createElement\(\s*["'']script["'']\s*\)'
    not:
      - regex: '^\b(window|self|top|parent|globalThis|frames|this)\.'
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/lang/scripted::dts-declaration-file

  - id: child-window-eval-call
    desc: Calls eval on child window handle
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      exclude_html_comments: true
      regex: '\b[A-Za-z_$][\w$]*\s*\.\s*(eval|Function)\s*\('
    not:
      # WebAssembly.Function wraps a JS callable for a Wasm table (JS-API
      # type reflection); it evaluates no source in any window.
      - regex: '^\b(window|self|top|parent|globalThis|frames|this|JSON|Object|WebAssembly)\s*\.'
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/lang/scripted::dts-declaration-file

composite_rules:
  - id: popup-window-markup-injection
    desc: Injects HTML markup into child window
    conf: 0.93
    any:
      - id: popup-handle-document-write-dot
      - id: popup-handle-document-write-bracket
      - id: popup-handle-document-innerhtml

  - id: popup-script-execution-sink
    desc: Injects or evaluates script in child window
    conf: 0.93
    any:
      - id: literal-script-element-tag
      - id: escaped-closing-script-tag
      - id: child-window-script-element-create
      - id: child-window-eval-call
