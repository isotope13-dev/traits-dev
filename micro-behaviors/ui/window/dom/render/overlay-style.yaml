defaults:
  crit: notable
  platforms: [windows, unix]
traits:
  # An element pinned to the whole viewport above all page content. Cookie
  # banners and modals use it too, so it only means something beside a lure
  # prompt or a redirect.
  - id: fixed-fullscreen-high-z-overlay-style
    desc: Fullscreen fixed overlay with high z-index
    for: [html, php, javascript]
    conf: 0.8
    if:
      type: text
      regex: '(?i)fixed\s*;\s*inset\s*:\s*0[^"''}<]{0,120}z-index\s*:\s*\d{4,}'
  - id: full-width-css-value
    desc: CSS width is one hundred percent
    crit: component
    for: [html, php]
    if:
      type: text
      regex: '(?i)width\s*:\s*100%'
  - id: full-height-css-value
    desc: CSS height is one hundred percent
    crit: component
    for: [html, php]
    if:
      type: text
      regex: '(?i)height\s*:\s*100%'
  - id: extreme-css-z-index
    desc: CSS z-index has six or more digits
    crit: component
    for: [html, php]
    if:
      type: text
      regex: '(?i)z-index\s*:\s*\d{6,}'
  - id: fixed-css-position
    desc: CSS position is fixed
    crit: component
    conf: 0.9
    for: [html, php]
    if:
      type: text
      regex: '(?i)position\s*:\s*fixed'

composite_rules:
  - id: fixed-viewport-high-z-overlay-style
    desc: Fixed full-viewport overlay with high z-index
    crit: component
    conf: 0.9
    for: [html, php]
    near_bytes: 320
    all:
      - id: full-width-css-value
      - id: full-height-css-value
      - id: extreme-css-z-index
      - id: fixed-css-position
