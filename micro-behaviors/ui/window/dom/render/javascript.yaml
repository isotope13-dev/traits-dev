defaults:
  crit: notable
  platforms: [windows, unix]
traits:
  # Require the object field to terminate the right-hand side. A nested access
  # such as `el.innerHTML = t.data.output_html` does not assign `.data` itself.
  - id: browser-innerhtml-object-field--rx-1
    for: [javascript, typescript]
    desc: innerHTML from html or body field
    conf: 0.9
    if:
      type: text
      regex: \.innerHTML\s*=\s*\w+\.(html|body)(\s*[;,)\]}]|\s*$)
  - id: browser-innerhtml-object-field--rx-2
    for: [javascript, typescript]
    desc: innerHTML from content or payload field
    conf: 0.9
    if:
      type: text
      regex: \.innerHTML\s*=\s*\w+\.(content|payload)(\s*[;,)\]}]|\s*$)
  - id: browser-innerhtml-object-field--rx-3
    for: [javascript, typescript]
    desc: innerHTML from markup or responseText field
    conf: 0.9
    if:
      type: text
      regex: \.innerHTML\s*=\s*\w+\.(markup|responseText)(\s*[;,)\]}]|\s*$)
  - id: browser-innerhtml-object-field--rx-4
    for: [javascript, typescript]
    desc: innerHTML from data field
    conf: 0.9
    if:
      type: text
      regex: \.innerHTML\s*=\s*\w+\.data(\s*[;,)\]}]|\s*$)
  - id: delayed-checkbox-or-loader-ui
    for: [javascript, typescript, html, -kotlin]
    desc: Delayed checkbox or loader UI transition
    conf: 0.88
    if:
      type: text
      regex: 'loader-ring[^\n]{0,120}setTimeout|checkbox[^\n]{0,120}setTimeout'
  - id: browser-set-rtl-direction
    for: [javascript, typescript, html, -kotlin]
    desc: Sets DOM text direction to RTL
    conf: 0.94
    if:
      type: text
      regex: '\.setAttribute\(\s*[''"]dir[''"]\s*,\s*[''"]rtl[''"]\s*\)'
    unless:
    - id: metadata/file/format/structured::sourcemap-sources-content
    - id: metadata/lang/scripted::dts-declaration-file
  - id: browser-native-sanitizer
    for: [javascript, typescript, html, -kotlin]
    desc: Uses browser Sanitizer API
    conf: 0.82
    if:
      type: text
      regex: '\bwindow\.Sanitizer\b|\.sanitizeToFragment\s*\('
    unless:
    - id: metadata/file/format/structured::sourcemap-sources-content
composite_rules:
  - id: browser-innerhtml-object-field
    for: [javascript, typescript]
    desc: Assigns object field to innerHTML
    conf: 0.9
    any:
      - id: browser-innerhtml-object-field--rx-1
      - id: browser-innerhtml-object-field--rx-2
      - id: browser-innerhtml-object-field--rx-3
      - id: browser-innerhtml-object-field--rx-4
    not:
      - substr: ".innerHTML=e.html"
      - substr: ".innerHTML = e.css"
      - substr: ".innerHTML = state.css"
      - substr: ".innerHTML = block.innerHTML"
      - substr: ".innerHTML = obj.outerHTML"
      - substr: ".innerHTML = result.value"
      - substr: ".innerHTML = headerData.description"
      - substr: ".innerHTML = item.description"
      - substr: ".innerHTML = templateEl.innerHTML"
      - substr: ".innerHTML=nb.highlighter"
      - substr: ".innerHTML=this._maybeSanitize"
      - substr: ".innerHTML=this.content"
      - substr: ".innerHTML=e.innerHTML"
      - substr: ".innerHTML=a.value"
      - substr: ".innerHTML=r.html"
      - substr: ".innerHTML=g.html"
      - substr: ".innerHTML = w.html"
      - substr: ".innerHTML = goog.html"
      - substr: ".innerHTML =\n          goog.html"
      - substr: ".innerHTML=goog.html"
