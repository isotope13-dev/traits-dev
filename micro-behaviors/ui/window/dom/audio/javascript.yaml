# Browser audio-element creation and playback are DOM/UI capabilities, not
# microphone input. Network media URLs remain separate HTTP URL observations.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: browser-audio-element-create
    desc: Creates browser audio element
    conf: 0.88
    ref: sha256:b5ad7ae1aa9174ae0f9e922e426bca209538fe454cdd2bfd206188096741fd3a
    if:
      type: symbol
      kind: call
      exact: document.createElement
      arg:
        kind: string
        exact: audio

  - id: browser-audio-source-attribute
    desc: Assigns browser audio source attribute
    conf: 0.86
    ref: sha256:b5ad7ae1aa9174ae0f9e922e426bca209538fe454cdd2bfd206188096741fd3a
    if:
      type: text
      regex: 'createElement\(["'']audio["'']\)[\s\S]{0,160}setAttribute\(["'']src'

  - id: browser-audio-source-property
    desc: Assigns browser audio source property
    conf: 0.9
    if:
      type: text
      regex: 'createElement\(["'']audio["'']\)[\s\S]{0,160}\.src\s*='

  - id: browser-audio-loop-enabled
    desc: Enables looping on browser audio playback
    conf: 0.9
    if:
      type: text
      regex: 'createElement\(["'']audio["'']\)[\s\S]{0,240}\.loop\s*=\s*(!0|true)'

  - id: browser-audio-play-call
    desc: Starts browser audio playback with play()
    conf: 0.9
    if:
      type: text
      regex: '(new Audio|createElement\(["'']audio["'']\))[\s\S]{0,400}\.play\('

composite_rules:
  - id: browser-audio-element-with-source
    desc: Browser audio element with assigned source
    crit: notable
    conf: 0.9
    ref: sha256:b5ad7ae1aa9174ae0f9e922e426bca209538fe454cdd2bfd206188096741fd3a
    near_bytes: 256
    all:
      - id: browser-audio-element-create
    any:
      - id: browser-audio-source-attribute
      - id: browser-audio-source-property
