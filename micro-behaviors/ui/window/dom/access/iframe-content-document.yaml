# Reading iframe.contentDocument is only possible for a same-origin frame.
# A cross-origin document throws, so this access is a same-origin DOM read,
# not evidence that a third-party page was loaded.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9

traits:
  - id: iframe-content-document-read
    desc: Reads an iframe content document
    if:
      type: text
      regex: '\.contentDocument\b'
