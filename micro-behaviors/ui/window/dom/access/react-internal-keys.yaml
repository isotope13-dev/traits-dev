defaults:
  crit: notable
  conf: 0.97
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: fiber-key-prefix-test
    desc: Tests for React internal fiber keys
    if:
      type: symbol
      kind: call
      regex: '(^|\.)startsWith$'
      arg:
        kind: string
        regex: '^__react(Fiber|InternalInstance)\$$'

  - id: hook-state-member
    desc: Accesses an object member named memoizedState
    if:
      type: symbol
      kind: member
      regex: '(^|\.)memoizedState$'

  - id: memoized-props-member
    desc: Accesses an object member named memoizedProps
    if:
      type: symbol
      kind: member
      regex: '(^|\.)memoizedProps$'

  - id: props-internal-key
    desc: React internal props key
    if:
      type: text
      substr: __reactProps$

  - id: event-handlers-internal-key
    desc: React internal event-handler key
    if:
      type: text
      substr: __reactEventHandlers$

  - id: react-fiber-key-search
    desc: Searches for React fiber keys
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(startsWith|indexOf)$'
      arg:
        kind: string
        regex: '^__react(Fiber|InternalInstance)\$'
