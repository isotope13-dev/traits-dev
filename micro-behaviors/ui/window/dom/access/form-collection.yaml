defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.93

traits:
  - id: browser-all-form-selector
    desc: Selects forms from a DOM subtree
    if:
      type: text
      regex: '\.(getElementsByTagName|querySelectorAll)\s*\(\s*["'']form["'']'
  - id: browser-indexed-form-field-read
    desc: Indexes a form elements collection
    if:
      type: text
      regex: '\b(form|forms\s*\[[^\]]{1,32}\])\.elements\s*\[[^\]\r\n]{1,48}\]'
