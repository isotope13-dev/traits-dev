# Reading `iframe.contentWindow` obtains the WindowProxy of a child frame.
# Legitimate embed bridges use it for `postMessage`, while sandbox-escape
# scripts use a freshly created child iframe's unpatched `contentWindow.open`.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.9

traits:
  - id: iframe-content-window-dot
    desc: Accesses an iframe contentWindow property
    if:
      type: text
      exclude_comments: true
      exclude_html_comments: true
      regex: '\.contentWindow\b'
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/lang/scripted::dts-declaration-file

  - id: iframe-content-window-bracket
    desc: Accesses contentWindow via bracket subscript
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      exclude_html_comments: true
      regex: '\[\s*["'']contentWindow["'']\s*\]'
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/lang/scripted::dts-declaration-file

composite_rules:
  - id: iframe-content-window-access
    desc: Reads an iframe contentWindow handle
    conf: 0.92
    any:
      - id: iframe-content-window-dot
      - id: iframe-content-window-bracket
