defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: react-fiber-key-prefix-test
    desc: Tests for React internal fiber keys
    if:
      type: symbol
      kind: call
      regex: '(^|\.)startsWith$'
      arg:
        index: 0
        kind: string
        exact: __reactFiber$
