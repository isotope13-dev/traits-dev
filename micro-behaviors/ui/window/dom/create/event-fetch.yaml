defaults:
  platforms: [unix, windows]
  for: [scripts, html, text]
traits:
  - id: html-event-fetch-request
    desc: HTML event handler fetch request
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)<(img|svg)\b[^<>\r\n]{0,160}\bon(error|load)\s*=\s*["'']?\s*fetch\s*\('
