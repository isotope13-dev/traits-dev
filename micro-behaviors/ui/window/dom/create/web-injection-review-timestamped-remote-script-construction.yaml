defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: timestamped-remote-script-construction
    desc: Cache-busted script element insertion clues
    crit: suspicious
    conf: 0.96
    attack: T1105,T1059.001
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
      - id: micro-behaviors/communications/http/client/resource::unix-timestamp-src-cache-bust
      - id: micro-behaviors/data/collection/dom::insert-before-call
    near_bytes: 2048

  - id: cache-busted-dynamic-script-load
    desc: Dynamically injects script element with timestamp cache-busted src
    crit: notable
    conf: 0.92
    for: [javascript, typescript, html]
    near_bytes: 512
    all:
      - id: micro-behaviors/data/collection/dom::script-create-near-src-assignment
      - id: micro-behaviors/communications/http/client/resource::timestamp-query-src-assignment
      - id: micro-behaviors/data/collection/dom::dom-node-insertion-call
