defaults:
  platforms: [windows, unix]
  attack: T1105
composite_rules:
  - id: browser-gated-timestamped-script-construction
    desc: Browser-targeted cache-busted script insertion
    crit: suspicious
    conf: 0.97
    attack: T1105,T1189
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/ui/window/dom/create::timestamped-remote-script-construction
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-conditional
    near_bytes: 2048

  # Keitaro / SocGholish / Balada TDS loaders: the rotating domain serves
  # the redirection stage from an opaque alphanumeric/base64url token path.
