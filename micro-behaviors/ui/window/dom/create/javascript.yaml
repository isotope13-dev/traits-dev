# Creating an anchor is a DOM construction primitive. It is not a download
# by itself; download behavior belongs to a composite that also sees a Blob,
# download attribute, and activation.
defaults:
  platforms: [windows, unix]
traits:
  - id: browser-create-method-reference
    for: [javascript, typescript]
    crit: notable
    desc: References a DOM element creation method
    conf: 0.85
    if:
      type: text
      regex: '\b(createElement|createContextualFragment)\b'
  - id: browser-insert-mutate-method-reference
    for: [javascript, typescript]
    crit: notable
    desc: References a DOM insertion or mutation method
    conf: 0.85
    if:
      type: text
      regex: '\b(appendChild|setAttribute)\b'
  - id: dom-anchor-element-creation
    for: [javascript, typescript]
    crit: notable
    desc: Creates an anchor DOM element
    conf: 0.85
    if:
      type: text
      regex: 'createElement\s*\(\s*["'']a["'']\s*\)'
  # Moved here from process/create/load/remote-code (as js-head-append-
  # script-node): the matcher proves only that a node is attached to
  # document.head — a DOM-construction primitive that every stylesheet,
  # meta-tag and analytics injector also performs. The remote-code reading
  # comes from the composites that pair this with a script element and a
  # remote src.
  - id: document-head-append
    for: [javascript, typescript]
    desc: Appends a node to document head
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: document.head.appendChild
  - id: browser-create-element
    for: [javascript, typescript, html, -kotlin]
    crit: notable
    desc: Creates DOM element
    conf: 0.96
    if:
      type: symbol
      kind: call
      exact: document.createElement
  - id: browser-create-form-element
    for: [javascript, typescript, html, -kotlin]
    crit: notable
    desc: Creates form DOM element
    conf: 0.82
    if:
      type: text
      regex: createElement\(['"]form['"]\)
    unless:
    - id: well-known/lib/web/jquery
    - id: metadata/document/html/
  - id: browser-iframe-element
    for: [javascript, typescript, html, -kotlin]
    desc: References an iframe HTML element
    crit: component
    conf: 0.78
    if:
      type: text
      substr: iframe
    unless:
    - id: metadata/lang/javascript-features::sourcemap-sources-content
    - id: well-known/lib/format/marked/
    - id: well-known/lib/web/jquery/
    - id: metadata/document/html/
    - id: well-known/app/browser/google-web::official-google-web-asset

  - id: browser-create-input-element
    desc: Creates an input DOM element
    crit: notable
    conf: 0.95
    for: [javascript, typescript, html]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)createElement$'
      arg:
        index: 0
        exact: input
