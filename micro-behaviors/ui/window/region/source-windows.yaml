# Windows Screenshot Capture via GDI + GDI+ Encoding
# Full screenshot pipeline: GDI capture -> GDI+ PNG encode -> exfil
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1113
  mbc: "C0014"

traits:
- id: powershell-window-bounds
  desc: PowerShell queries window bounds
  crit: notable
  conf: 0.92
  for: [powershell]
  if:
    type: text
    word: GetWindowRect
  unless:
  # The symbol records the API being used; this also sees the name sitting in
  # data. Standing down there keeps one use from counting twice.
  - id: micro-behaviors/ui/window/control::get-window-rect
