defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: set-window-rgn
    desc: Apply shaped window region
    crit: baseline
    conf: 0.78
    if:
      type: text
      exact: SetWindowRgn
  - id: set-window-display-affinity
    desc: Set display affinity for a window
    crit: baseline
    conf: 0.82
    for: [pe, dll, csharp, javascript, typescript]
    if:
      type: text
      word: SetWindowDisplayAffinity
  - id: wda-exclude-from-capture
    desc: Window display affinity excludes capture
    crit: notable
    conf: 0.88
    for: [pe, dll, csharp, javascript, typescript]
    if:
      type: text
      word: WDA_EXCLUDEFROMCAPTURE
  - id: create-rect-rgn
    desc: Create rectangular GDI region
    crit: baseline
    conf: 0.74
    if:
      type: text
      exact: CreateRectRgn
  - id: create-shaped-region-import
    desc: Create a shaped GDI window region
    crit: baseline
    conf: 0.74
    if:
      type: import
      regex: '^Create(Rect|Polygon|RoundRect)Rgn$'
  - id: frame-region-import
    desc: Frame a GDI window region
    crit: baseline
    conf: 0.74
    if:
      type: import
      exact: FrameRgn
  - id: combine-rgn
    desc: Combine GDI regions
    crit: baseline
    conf: 0.74
    if:
      type: text
      exact: CombineRgn
  - id: get-dc
    desc: Get device context
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: GetDC
  - id: get-window-dc
    desc: Get window device context
    crit: baseline
    conf: 0.75
    if:
      type: text
      exact: GetWindowDC
  - id: release-dc
    desc: Release device context
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: ReleaseDC
  - id: invalidate-rect
    desc: Invalidate window region
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: InvalidateRect
composite_rules:
  - id: window-region-shaping
    desc: Shape window with GDI regions
    crit: notable
    conf: 0.86
    all:
      - id: set-window-rgn
      - id: create-rect-rgn
      - id: combine-rgn
  - id: window-anti-capture-affinity
    desc: Window excluded from screen capture through display affinity
    crit: notable
    conf: 0.9
    for: [pe, dll, csharp, javascript, typescript]
    all:
      - id: set-window-display-affinity
      - id: wda-exclude-from-capture
