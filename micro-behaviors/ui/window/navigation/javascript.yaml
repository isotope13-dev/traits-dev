defaults:
  platforms: [windows, unix]
  crit: notable
traits:
- id: browser-window-open-external-url
  desc: Opens window to external HTTP URL
  conf: 0.92
  for: [javascript, typescript, html]
  if:
    type: text
    regex: '\bwindow\.open\s*\(\s*[''"]https?://'
- id: browser-location-replace
  for: [javascript, html]
  conf: 0.9
  desc: Replaces explicit browser window location
  if:
    type: text
    regex: '(window|document)\.location\.replace\s*\('
- id: computed-location-replace
  for: [javascript, html]
  desc: Replaces a computed browser location
  crit: notable
  conf: 0.94
  if:
    # Covers window[decodedLocation]["replace"](url) without treating an
    # unrelated object method named replace as browser navigation.
    type: text
    regex: '\bwindow\s*\[[^\]\r\n]{1,120}\]\s*\[\s*["'']replace["'']\s*\]\s*\('
- id: browser-window-open-reference
  conf: 0.9
  desc: Stores browser window.open function reference
  for: [javascript, typescript, html]
  if:
    type: text
    regex: '\b[A-Za-z_$][\w$]*\s*=\s*(window|w)\.open\s*;'
- id: indexed-child-location-write
  desc: Navigates indexed child browsing context
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'window\s*\[\s*\d{1,3}\s*\]\.location\.href\s*='
- id: computed-query-source
  desc: Parses query from computed window member
  crit: notable
  conf: 0.9
  for: [javascript, typescript, html]
  if:
    type: text
    regex: 'URLSearchParams\s*\(\s*window\s*\[[^\]]{1,80}\]\s*\[[^\]]{1,80}\]\s*\)'
- id: computed-window-target-url-call
  desc: Computed window method receives targetUrl
  crit: notable
  conf: 0.88
  for: [javascript, typescript, html]
  if:
    type: text
    regex: 'window\s*\[[^\]]{1,80}\]\s*\[[^\]]{1,80}\]\s*\(\s*targetUrl\s*\['
- id: discord-authenticated-route-navigation
  desc: Navigates to Discord authenticated route
  for: [javascript, typescript]
  conf: 0.98
  if:
    type: literal
    substr: 'https://discord.com/channels/@me'
- id: browser-meta-refresh-external-url
  for: [javascript, html]
  conf: 0.9
  desc: Browser meta refresh to external URL
  # Meta refresh is a neutral browser-navigation mechanism. Phishing and
  # SSRF composites add page or endpoint evidence before inferring intent.
  if:
    type: text
    regex: '(?i)http-equiv=["'']refresh["''].{0,80}\burl=https?://'
  unless:
  - id: well-known/lib/crypto/microsoft-auth::microsoft-live-auth-runtime-context
  - id: well-known/lib/crypto/microsoft-auth::microsoft-oauth-error-relay-context
  - id: metadata/package/testing/presence/harness::test-directory-path
- id: browser-window-open
  for: [javascript, typescript]
  desc: Opens browser window or tab
  conf: 0.8
  if:
    type: symbol
    exact: window.open
- id: browser-window-open-text-call
  for: [javascript, typescript, html, vbs, powershell]
  desc: Browser window.open text call
  conf: 0.9
  if:
    # HTML and non-JavaScript hosts do not consistently expose this as a call
    # symbol, so retain the punctuation as the structural boundary.
    type: text
    regex: '\bwindow\.open\s*\('
# A variable URL opened in a new tab. This is the ordinary "open this link in
# a new tab" idiom -- it says the destination is computed rather than written
# in the markup, and nothing more. It arrived here from
# objectives/credential-access/phishing/captcha/, where it was named
# `captcha-window-open-blank` ("CAPTCHA opens redirect tab") even though the
# regex checks nothing about a CAPTCHA; the phishing composite still references
# it, and gets the CAPTCHA identity from its other leg.
- id: browser-window-open-variable-blank
  for: [javascript, typescript, html, -kotlin]
  desc: Opens a computed URL in new tab
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: 'window\.open\(\s*[A-Za-z_$][\w$]*\s*,\s*[''"]_blank[''"]'
- id: browser-window-move
  for: [javascript, typescript, html, -kotlin]
  desc: Moves browser window
  conf: 0.82
  if:
    type: symbol
    kind: call
    exact: window.moveTo
- id: browser-window-focus
  for: [javascript, typescript, html, -kotlin]
  desc: Focuses browser window
  conf: 0.82
  if:
    type: symbol
    kind: call
    exact: window.focus
- id: browser-window-stop
  for: [javascript, typescript, html, -kotlin]
  desc: Stops browser page loading
  conf: 0.82
  if:
    type: symbol
    kind: call
    exact: window.stop
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: browser-link-href-assignment
  for: [javascript, typescript, html, -kotlin]
  desc: Assigns browser link href
  conf: 0.9
  if:
    type: text
    regex: \b[a-zA-Z_$][\w$]*\.href\s*=\s*[a-zA-Z_$][\w$]*\.(toString|href)\(
  unless:
  - id: micro-behaviors/ui/window/automation::steam-tradeoffers-redirect
- id: browser-location-assign
  for: [javascript, typescript, html, -kotlin]
  desc: Navigates browser location
  conf: 0.82
  if:
    type: text
    regex: '\b(window\.)?location\.assign\s*\('
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
- id: top-location-replace-string
  for: [javascript, typescript, html, -kotlin]
  desc: String contains top location replace
  crit: notable
  conf: 0.82
  if:
    type: text
    substr: top.location.replace(
    case_insensitive: true
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
- id: browser-location-reload
  for: [javascript, typescript, html, -kotlin]
  desc: Reloads browser location
  conf: 0.84
  if:
    type: symbol
    kind: call
    exact: location.reload
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
- id: browser-query-propagated-redirect
  for: [javascript, typescript, html, -kotlin]
  desc: Browser query parameter redirect
  conf: 0.84
  ref: sha256:afbffa38a490d43ff8e56a13b0a4b4fbde5c87b06d53d90898d9e7e2fcd08f40
  if:
    type: text
    regex: 'window\.location\.search[\s\S]{0,240}(redirectURL|location\s*=)'
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
- id: browser-location-href-assign
  for: [javascript, typescript, html, -kotlin]
  desc: Navigates via location.href assignment
  conf: 0.82
  # The trailing `[^=]` keeps the comparison out: `location.href ===` starts
  # with `=`, so the bare pattern read `if (location.href === STATE.lastUrl)`
  # — the standard SPA URL-change watcher, present in most content scripts —
  # as a navigation. That mattered: 13 composites consume this atom, several
  # of them hostile-tier redirect, cloaking and phishing rules.
  if:
    type: text
    regex: '(window\.)?location\.href\s*=[^=]'
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
- id: browser-location-external-method
  for: [javascript, typescript, html, -kotlin]
  desc: Location API targets an external URL
  conf: 0.82
  if:
    type: text
    regex: "(?i)(window\\.)?location\\.(href\\s*=|(replace|assign)\\s*\\()\\s*['\\\"]https?://"
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
- id: browser-location-external-assign
  for: [javascript, typescript, html, -kotlin]
  desc: Assigns external URL to browser location
  conf: 0.82
  if:
    type: text
    # `location = url`, `window.location = url`, and
    # `document.location = url` are equivalent browser navigations.  The bare
    # global spelling is especially common in compact injected scripts.
    regex: "(?i)\\b((window|document)\\.)?location\\s*=\\s*['\\\"]https?://"
  unless:
  - id: metadata/file/format/structured::sourcemap-sources-content
  - id: metadata/document/html/
- id: browser-form-submit
  for: [javascript, typescript, html, -kotlin]
  desc: Programmatically submits a browser form
  crit: notable
  conf: 0.9
  # The receiver has to be a form. Any `<ident>.submit(` matched unrelated
  # submit-a-job APIs — libusb `transfer.submit(buf)`, thread/task pools,
  # promise queues — and called them browser form submissions.
  if:
    type: text
    regex: '(?i)\b[\w$]*forms?(\[[^\]]{0,12}\])?\.submit\s*\('
  unless:
    - type: text
      substr: 'form.submit() manually, consider using form.requestSubmit()'
- id: document-named-form-submit
  for: [javascript, typescript, html, -kotlin]
  desc: Programmatically submits named document form
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '(?i)\bdocument\.[A-Za-z_$][\w$]*\.submit\s*\('
- id: objecturl-open-new-tab
  for: [javascript, typescript, html, -kotlin]
  desc: Opens object URL in new tab
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: 'createObjectURL[\s\S]{0,300}window\.open'
composite_rules:
  # Any spelling of "send the browser to another site". Neutral navigation:
  # sign-in flows, SSO hand-offs and link shims all do it. Previously defined
  # in objectives/credential-access/phishing/mfa-relay/, where the directory
  # read a plain cross-origin navigation as phishing; the relay composites
  # there now reference this atom and supply the credential evidence.
  - id: browser-external-redirect
    desc: Browser external redirect
    crit: notable
    conf: 0.92
    for: [html, javascript, typescript, php]
    any:
      - id: micro-behaviors/ui/window/navigation::browser-location-external-method
      - id: micro-behaviors/ui/window/navigation::browser-location-external-assign
      - id: micro-behaviors/communications/http/response::php-location-redirect
  - id: obfuscated-query-navigation
    desc: Obfuscated navigation propagates URL query
    crit: suspicious
    conf: 0.92
    for: [javascript, typescript, html]
    all:
      - id: computed-query-source
      - id: micro-behaviors/communications/http/url/query::obfuscated-urlsearchparams-iteration
      - id: micro-behaviors/communications/http/url/query::computed-target-url-params-call
      - id: computed-window-target-url-call
    near_bytes: 1000
