# A zero-second meta refresh to a file:// URL. With a host in the URL
# (file://HOST/share/x) Windows treats it as an SMB/UNC path and the browser
# or mail client opens a connection to that host on its own.
traits:
  - id: meta-refresh-instant-file-url
    desc: Meta refresh instantly loads a file URL
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [html]
    if:
      type: text
      regex: '(?is)http-equiv=["'']refresh["''].{0,80}content\s*=\s*["'']0\s*;\s*url\s*=\s*[''"]?file://'
