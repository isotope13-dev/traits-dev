defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: throttled-captured-click-popup
    desc: Throttled popup in global click handler
    if:
      type: tree-sitter
      query: |
        ((function_declaration body: (statement_block (lexical_declaration (variable_declarator name: (identifier) @handler value: (arrow_function body: (statement_block (lexical_declaration (variable_declarator value: (call_expression function: [(member_expression object: (identifier) @clock_owner property: (property_identifier) @clock_method) (subscript_expression object: (identifier) @clock_owner index: (string (string_fragment) @clock_method))]))) (expression_statement (binary_expression right: (parenthesized_expression (sequence_expression (binary_expression right: (parenthesized_expression (sequence_expression (call_expression function: [(member_expression object: (identifier) @open_owner property: (property_identifier) @open_method) (subscript_expression object: (identifier) @open_owner index: (string (string_fragment) @open_method))] (arguments (identifier) (string (string_fragment) @blank) (_)))))))))))))) (return_statement (sequence_expression (call_expression function: [(member_expression object: (identifier) @listen_owner property: (property_identifier) @listen_method) (subscript_expression object: (identifier) @listen_owner index: (string (string_fragment) @listen_method))] (arguments (string (string_fragment) @click) (identifier) @registered [(unary_expression operator: "!" argument: (number) @capture) (true) @capture])))))) @popup
          (#eq? @open_owner "window")
          (#eq? @open_method "open")
          (#eq? @blank "_blank")
          (#eq? @clock_owner "Date")
          (#eq? @clock_method "now")
          (#eq? @listen_owner "document")
          (#eq? @listen_method "addEventListener")
          (#eq? @click "click")
          (#eq? @handler @registered)
          (#match? @capture "^(0|0[xX]0+|true)$"))
