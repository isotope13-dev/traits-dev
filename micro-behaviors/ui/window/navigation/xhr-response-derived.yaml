# Browser navigation selected from an XMLHttpRequest response.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.93

traits:
  - id: xhr-response-url-navigation
    desc: Response-selected browser URL navigation
    if:
      type: text
      regex: 'responseText\.startsWith\(["'']http["'']\)[\s\S]{0,400}window\.location\.replace\s*\('
