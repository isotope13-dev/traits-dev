# Neutral observation; objective consumers supply attack context.
defaults:
  platforms:
  - unix
  - windows
  for:
  - html
  - javascript
  - typescript
traits:
- id: browser-command-route-map
  desc: Maps page-control command keys to HTML paths
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)\b(to|go|show|next)_\w{1,20}\s*:\s*["'][\w./-]{1,40}\.html?["']
    not:
    - regex: (?i)\bnext_url\b
  unless:
  - id: well-known/tool/development/ci/github-actions/docker-build-push-action::repository-url
  - id: well-known/tool/development/ci/github-actions/docker-build-push-action::dist-tree
  - type: text
    regex: :\s*["']settings/
- id: browser-route-navigation
  desc: Browser route navigation call
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)\blocation\s*\.\s*(assign|replace)\s*\(|\blocation\s*\.\s*href\s*=
composite_rules:
- id: browser-page-command-dispatch
  desc: Page-command map, indexing and navigation co-occur
  crit: notable
  conf: 0.96
  unless:
  - id: metadata/package/files/dependency::node-modules-path
  - id: well-known/tool/development/editor/vscodium::vscodium-core-bundle-path
  any:
  - id: micro-behaviors/data/property/access::command-field-table-index
  - id: micro-behaviors/data/control-flow/dispatch::command-variable-dispatch-index
  all:
  - id: micro-behaviors/ui/window/navigation::browser-command-route-map
  - id: micro-behaviors/ui/window/navigation::browser-route-navigation
  near_bytes: 500
