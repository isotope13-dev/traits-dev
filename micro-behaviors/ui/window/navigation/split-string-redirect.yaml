# Redirect pages that never spell the destination, `atob` or `location` in
# one piece: the URL is stored as short base64 fragments, and the property
# names are joined from character groups at run time. Each trick is common in
# minified code; together on a tiny page they only serve to hide a redirect.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.9

traits:
  - id: base64-fragment-array-reduce
    desc: Short base64 fragments joined by reduce
    if:
      type: text
      regex: '\[("[A-Za-z0-9+/=]{1,8}",\s*){6,}"[A-Za-z0-9+/=#]{1,8}"\]\.reduce\('

  - id: atob-name-joined-from-letters
    desc: atob name assembled from characters
    if:
      type: text
      regex: '\[\s*[''"]a[''"]\s*,\s*[''"]t[''"]\s*,\s*[''"]o[''"]\s*,\s*[''"]b[''"]\s*\]\.join\('

  - id: location-name-joined-from-parts
    desc: location name assembled from parts
    if:
      type: text
      regex: '\[\s*[''"]lo[''"]\s*,\s*[''"]cat[''"]\s*,\s*[''"]ion[''"]\s*\]\.join\('

  - id: window-bracket-href-assignment
    desc: Window href assigned through brackets
    if:
      type: text
      regex: 'window\[\w+\]\[''href''\]\s*='
