defaults:
  platforms:
  - windows
  - unix
  crit: notable
traits:
- for:
  - html
  id: browser-open-self-location
  desc: Window opens its own location
  conf: 0.9
  if:
    type: text
    regex: window\.open\(\s*self\.location[^)]{0,20}\)
    exclude_html_comments: true
- for:
  - html
  - javascript
  id: browser-close-then-open-external
  desc: Window closes then opens external URL
  conf: 0.95
  if:
    type: text
    regex: window\.close\(\)\s*;\s*window\.open\(["']https?://
