defaults:
  platforms: [windows, unix]
  for: [html]

composite_rules:
  # An absolute URL can belong to the uploading site or its storage CDN.
  # Completion wording plus refresh proves neither hijacking nor concealment.
  - id: upload-status-instant-http-redirect
    desc: Upload status with instant HTTP(S) redirect
    crit: notable
    conf: 0.9
    size_max: 2048
    all:
      - id: micro-behaviors/ui/window/navigation::meta-refresh-instant-external
      - id: metadata/document/html::upload-completion-message
