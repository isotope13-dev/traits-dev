defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.9
composite_rules:
  # This shape describes navigation only. A relative Login.php target remains
  # on the current origin, and the session parameter alone does not establish
  # credential theft or traffic hijacking.
  - id: script-only-page-redirects-to-login
    desc: Script-only page redirects top window to tokenized login URL
    crit: notable
    conf: 0.9
    size_max: 4096
    all:
      - id: metadata/document/html::script-only-html-page
      - id: micro-behaviors/ui/window/navigation::top-location-assignment
      - id: micro-behaviors/ui/window/navigation::browser-whole-window-navigation
      - id: micro-behaviors/communications/http/url/php-endpoint::login-page-long-session-token

  - id: browser-whole-window-navigation
    desc: Browser navigates the whole window
    any:
      - id: micro-behaviors/ui/window/navigation::top-location-assignment
      - id: micro-behaviors/ui/window/navigation::browser-location-replace
      - id: micro-behaviors/ui/window/navigation::window-variable-location-assignment
      - id: micro-behaviors/ui/window/navigation::browser-meta-refresh-instant-relative-url
