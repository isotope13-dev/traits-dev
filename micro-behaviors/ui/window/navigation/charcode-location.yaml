# A `window.location` run inside a hash-delimited charcode blob means the
# unpacked script touches the location object, typically to navigate the
# visitor the referrer gate selected.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.85
traits:
  - id: charcode-concealed-location
    desc: Charcode payload conceals location reference
    if:
      type: text
      exclude_html_comments: true
      substr: 119#105#110#100#111#119#46#108#111#99#97#116#105#111#110
