# A zero-delay disk-image target beneath a CMS administration directory is
# unusual delivery behavior. It does not establish image contents, mounting,
# execution, or compromise of the serving site. Require the target in the
# refresh directive itself, rather than an unrelated nearby hyperlink.
defaults:
  for: [html]
  platforms: [windows, unix]
traits:
  - id: instant-refresh-wordpress-admin-disk-image
    desc: Instant refresh to WordPress-admin disk image
    crit: suspicious
    conf: 0.93
    if:
      type: text
      case_insensitive: true
      exclude_html_comments: true
      regex: 'http-equiv="refresh"\s+content="0; *url=[^"]{1,99}/wp-admin/[^"]{1,99}\.iso"'
