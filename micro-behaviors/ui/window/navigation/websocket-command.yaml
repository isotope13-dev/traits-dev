# A remote page controller can be legitimate. The objective consumer adds
# credential capture; this atom binds a WebSocket message to a page-table lookup.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: websocket-message-command-page-navigation
    desc: WebSocket command selects navigation target
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((program
          (lexical_declaration
            (variable_declarator
              name: (identifier) @socket
              value: (new_expression constructor: (identifier) @constructor)))
          (expression_statement
            (call_expression
              function: (member_expression
                object: (identifier) @receiver
                property: (property_identifier) @listen)
              arguments: (arguments
                (string (string_fragment) @event)
                (arrow_function
                  parameters: (formal_parameters (identifier) @parameter)
                  body: (statement_block
                    (lexical_declaration
                      (variable_declarator
                        name: (identifier) @command
                        value: (member_expression
                          object: (call_expression
                            function: (member_expression
                              object: (identifier) @json
                              property: (property_identifier) @parse)
                            arguments: (arguments
                              (member_expression
                                object: (identifier) @event_object
                                property: (property_identifier) @data)))
                          property: (property_identifier) @command_field)))
                    (if_statement
                      condition: (parenthesized_expression
                        (subscript_expression
                          object: (identifier) @routes
                          index: (identifier) @guard_command))
                      consequence: (expression_statement
                        (call_expression
                          function: (member_expression
                            object: (identifier) @location
                            property: (property_identifier) @navigate)
                          arguments: (arguments
                            (subscript_expression
                              object: (identifier) @target_routes
                              index: (identifier) @target_command))) @navigation))))))))
          (#eq? @constructor "WebSocket")
          (#eq? @socket @receiver)
          (#eq? @listen "addEventListener")
          (#eq? @event "message")
          (#eq? @json "JSON")
          (#eq? @parse "parse")
          (#eq? @parameter @event_object)
          (#eq? @data "data")
          (#eq? @command_field "command")
          (#eq? @command @guard_command)
          (#eq? @command @target_command)
          (#eq? @routes @target_routes)
          (#eq? @location "location")
          (#match? @navigate "^(assign|replace)$"))
