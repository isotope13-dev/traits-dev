defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: meta-refresh-instant-external
    desc: Instant meta refresh to HTTP(S) URL
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: '(?is)http-equiv=["'']refresh["''][^>]{0,40}content=["'']0\s*;\s*(url\s*=\s*)?https?://'
  - id: meta-refresh-content-first-instant-external
    desc: Content-first instant refresh to HTTP(S) URL
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: '(?is)content=["'']0\s*;\s*(url\s*=\s*)?https?://[^>]{1,99}http-equiv=["'']refresh'
