defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.9
  attack: T1105
composite_rules:
  - id: browser-meta-refresh-archive-download
    desc: Meta refresh near a packaged-file URL
    near_bytes: 400
    all:
      - id: micro-behaviors/ui/window/navigation/refresh::browser-meta-refresh-external-url
      - id: micro-behaviors/communications/url/resource-path/file::archive-file-url
