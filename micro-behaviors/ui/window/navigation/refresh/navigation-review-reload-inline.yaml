defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.9

traits:
  - id: inline-browser-location-reload
    desc: HTML references browser location reload call
    if:
      type: text
      exclude_html_comments: true
      regex: '\b(window\s*\.\s*)?location\s*\.\s*reload\s*\('
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
