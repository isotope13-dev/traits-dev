defaults:
  for: [html]
  platforms: [windows, unix]
traits:
  - id: instant-refresh-wordpress-admin-disk-image
    desc: Instant refresh to WordPress-admin disk image
    crit: suspicious
    conf: 0.93
    if:
      type: text
      case_insensitive: true
      exclude_html_comments: true
      regex: 'http-equiv="refresh"\s+content="0; *url=[^"]{1,99}/wp-admin/[^"]{1,99}\.iso"'
