# Navigation redundancy and session tokens do not establish credential theft.
defaults:
  platforms: [unix, windows]
  for: [html]
  crit: notable
  size_max: 2048

composite_rules:
  - id: hex-tracked-multi-navigation-stub
    desc: Hex-tracked target uses three browser navigation mechanisms
    crit: suspicious
    conf: 0.93
    all:
      - id: browser-meta-refresh-instant-relative-url
      - id: micro-behaviors/ui/window/navigation/location::browser-location-replace
      - id: micro-behaviors/ui/window/navigation/location::window-variable-location-assignment
      - id: micro-behaviors/communications/url/query/structure::token-key-long-hex-value

  - id: instant-redirect-to-hex-tracked-target
    desc: Page instantly forwards to a hex-tracked URL
    size_max: 4096
    near_bytes: 1500
    all:
      - id: browser-meta-refresh-instant-relative-url
      - id: micro-behaviors/communications/url/query/structure::token-key-long-hex-value
