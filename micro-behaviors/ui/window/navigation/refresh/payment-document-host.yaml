# Attachment pages that exist only to bounce the reader to a lure host.
#
# Brazilian and Iberian banking-trojan campaigns mail an HTML "boleto",
# "fatura" or "nota fiscal" whose whole job is an instant refresh to a host
# named after both a payment slip and a document attachment
# (boletoclientevp.anexodocumentos.com). Banks serve their own slips from
# their brand domain; they do not ship a blank page that leaves for one.
defaults:
  platforms: [windows, unix]
  for: [html]
  conf: 0.88
  crit: notable

traits:
  - id: url-host-payment-slip-word
    desc: URL host names a payment slip
    if:
      type: text
      regex: '(?i)https?://[^"''/\s]{0,60}(boleto|fatura|factura)'
  - id: url-host-tax-invoice-word
    desc: URL host names a tax invoice
    if:
      type: text
      regex: '(?i)https?://[^"''/\s]{0,60}(nota-?fiscal|nfe|cobranca)'
  - id: url-host-payment-receipt-word
    desc: URL host names a payment receipt
    if:
      type: text
      regex: '(?i)https?://[^"''/\s]{0,60}(pagamento|recibo|comprovante)'
  - id: url-host-attachment-word
    desc: URL host names a document attachment
    if:
      type: text
      regex: '(?i)https?://[^"''/\s]{0,60}(anexo|documento|arquivo)'
  - id: url-host-download-word
    desc: URL host names a document download
    if:
      type: text
      regex: '(?i)https?://[^"''/\s]{0,60}(download|visualizar|segunda-?via)'

  # Body holds only tags and whitespace: nothing for the reader to see
  # before the refresh fires.
  - id: html-body-without-text
    desc: HTML body contains no visible text
    crit: component
    size_max: 20000
    if:
      type: text
      regex: '(?is)<body[^>]{0,200}>(\s{0,40}<[^>]{0,60}>){0,12}\s{0,40}</body>'

composite_rules:
  - id: url-host-payment-word
    desc: URL host names a payment document
    any:
      - id: url-host-payment-slip-word
      - id: url-host-tax-invoice-word
      - id: url-host-payment-receipt-word
  - id: url-host-document-word
    desc: URL host names a document
    any:
      - id: url-host-attachment-word
      - id: url-host-download-word
  # Both words fall inside the one refresh URL.
  - id: meta-refresh-payment-and-document-host
    desc: Instant refresh to payment-document lure host
    near_bytes: 160
    all:
      - id: meta-refresh-instant-external
      - id: url-host-payment-word
      - id: url-host-document-word
