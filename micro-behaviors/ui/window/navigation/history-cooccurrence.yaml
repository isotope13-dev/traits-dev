defaults:
  platforms: [windows, unix]
  for: [html]
composite_rules:
  - id: history-push-popstate-cooccurrence
    desc: History push and popstate listener co-occur
    crit: notable
    conf: 0.9
    near_bytes: 1500
    all:
      - id: micro-behaviors/ui/window/navigation::history-push-state-entry
      - id: micro-behaviors/ui/window/navigation::popstate-navigation-listener
    unless:
      - id: well-known/lib/web/authoring/swagger-ui::swagger-ui-bundle-global
      - id: micro-behaviors/ui/window/navigation::popstate-state-field-restore
      - id: micro-behaviors/ui/window/navigation::history-pathname-query-push
