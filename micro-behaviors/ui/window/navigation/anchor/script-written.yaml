# A script that writes an anchor into the page and then clicks it by id turns
# a scripted decision into a user-looking navigation. Alone each half is
# ordinary DOM code; the objective composite pairs this with the shared
# element-id click trait.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: component
  conf: 0.9

traits:
  - id: document-write-anchor-literal
    desc: Script writes anchor tag into page
    if:
      type: text
      exclude_html_comments: true
      regex: 'document\.write\(\s*[`"'']<a\s'
