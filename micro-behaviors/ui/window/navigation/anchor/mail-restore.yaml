# Bind the action label to its own absolute href. Exclusions filter each
# matched anchor, so an unrelated Microsoft link cannot suppress an offsite one.
defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: offsite-mail-restoration-anchor
    desc: Mail restore link avoids Microsoft hosts
    crit: notable
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      exclude_html_comments: true
      regex: '<a\b[^>]{0,240}href\s*=\s*["'']https?://[^>]{1,600}>\s*(<[^>]{1,80}>\s*)?RESTORE\s+MESSAGES'
    not:
      - regex: '(?i)\bhref\s*=\s*["'']https?://([\w-]+\.)*(microsoft|office|outlook)\.com(:\d{1,5})?[/?#"'']'
      - regex: '(?i)href\s*=\s*["'']https?://([\w-]+\.)*(microsoftonline|office365)\.com(:\d{1,5})?[/?#"'']'
