defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries, -beam, -wasm, -static-lib]
  crit: notable
  conf: 0.95

traits:
  - id: chromium-inline-html-data-uri
    desc: Browser command opens Base64 HTML data URI
    if:
      type: text
      regex: '\b(msedge|chrome|chromium)(\.exe)?\b.{0,350}data:text/html;base64,'
      case_insensitive: true
