defaults:
  platforms: [unix, windows]
  for: [html, javascript]
  crit: notable
  conf: 0.96

traits:
  - id: charcode-concealed-location-assignment
    desc: Hash charcodes assign window.location
    if:
      type: text
      exclude_html_comments: true
      # window.location=, rather than a read or documentation reference.
      substr: 119#105#110#100#111#119#46#108#111#99#97#116#105#111#110#61
