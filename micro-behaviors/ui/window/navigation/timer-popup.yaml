defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.98
traits:
  - id: timer-text-focus-call
    desc: Repeated timer callback text calls self.focus
    count_min: 2
    if:
      type: text
      regex: '\bsetTimeout\(["''][^\r\n]{0,180}\bself\.focus\(\)'
  - id: timer-ranking-entry-url
    desc: Timers open referral-tagged ranking entry URLs
    count_min: 2
    for: [html]
    if:
      type: text
      regex: 'setTimeout\(["''][\w$]{1,32}\([''"]https?://[^''"\r\n]{1,80}/in\.php\?id='
  - id: assigned-global-open-blank-window
    desc: Assigns global open result for blank window
    for: [html]
    if:
      type: text
      regex: '=\s*open\(\s*["'']["'']\s*,'
  - id: window-variable-location-assignment
    desc: Window-named object receives location assignment
    if:
      type: text
      regex: '\b\w*[Ww]in\w*\.location\s*=\s*\w+\s*;'
