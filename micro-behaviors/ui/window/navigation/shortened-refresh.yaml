# Bind the shortened destination and refresh directive to one meta element.
# This is destination concealment, not proof of a malicious landing payload.
defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: instant-shortened-meta-refresh
    desc: Immediate refresh through a shortened URL
    crit: suspicious
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      case_insensitive: true
      regex: '<meta content=''0;url=https?://bit\.ly/[^''>]{1,80}'' http-equiv=''refresh'''
