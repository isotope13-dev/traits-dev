# A `location` token in Packer's `'...'.split('|')` dictionary means the
# unpacked script touches window/self/top.location, typically to navigate.
defaults:
  for: [html, javascript]
  platforms: [windows, unix]
  crit: notable
  conf: 0.85
traits:
  - id: packer-dictionary-location-token
    desc: Packer token dictionary includes location
    if:
      type: text
      exclude_html_comments: true
      regex: '\|location\|[^'']{0,600}''\.split\(''\|''\)'
