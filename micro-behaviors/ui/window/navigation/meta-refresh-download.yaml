# A meta refresh is an automatic, click-free navigation. Pointing it at an
# archive or executable file starts a download instead of showing a page.
defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.9
  attack: T1105
composite_rules:
  - id: browser-meta-refresh-archive-download
    desc: Meta refresh targets a packaged download
    near_bytes: 400
    all:
      - id: micro-behaviors/ui/window/navigation::browser-meta-refresh-external-url
      - id: micro-behaviors/communications/http/url/archive::archive-file-url
