# Opening popups from a child frame's `contentWindow` or targeting `about:blank`
# / empty URLs. Calling `frame.contentWindow.open(...)` invokes a fresh Window
# realm's native `open` method rather than the current window's patched `window.open`.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable

traits:
  - id: child-frame-contentwindow-open-symbol
    for: [javascript, typescript]
    desc: Calls open on child frame contentWindow
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '\.contentWindow\.open$'
    unless:
      - id: metadata/file/format/news::serialized-news-article-catalog

  - id: child-frame-contentwindow-open-dot
    desc: Calls open on frame contentWindow
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      exclude_html_comments: true
      regex: '\??\.\s*contentWindow\s*\??\.\s*open\s*\('
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/file/format/news::serialized-news-article-catalog

  - id: child-frame-contentwindow-open-bracket
    desc: Calls bracketed open on contentWindow
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      exclude_html_comments: true
      regex: '(\.contentWindow|\[\s*["'']contentWindow["'']\s*\])\s*\[\s*["'']open["'']\s*\]\s*\('
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/file/format/news::serialized-news-article-catalog

  - id: window-open-blank-url
    desc: Calls window.open with blank URL
    crit: component
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      exclude_html_comments: true
      regex: '\b(window|self|globalThis)\s*\.\s*open\s*\(\s*(["'']about:blank["'']|["'']{2}\s*[,)])'

  - id: contentwindow-open-blank-url
    desc: Opens blank popup from frame contentWindow
    crit: component
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      exclude_html_comments: true
      regex: 'contentWindow["''\]\s]*(\??\.open|\[["'']open["'']\])\s*\(\s*(["'']about:blank["'']|["'']{2})'

composite_rules:
  - id: child-frame-contentwindow-open
    desc: Opens window via child frame contentWindow
    conf: 0.95
    any:
      - id: child-frame-contentwindow-open-symbol
      - id: child-frame-contentwindow-open-dot
      - id: child-frame-contentwindow-open-bracket

  - id: blank-popup-window-open
    desc: Opens an about:blank or empty popup
    conf: 0.92
    any:
      - id: window-open-blank-url
      - id: contentwindow-open-blank-url
    unless:
      - id: metadata/file/format/source-map::sourcemap-sources-content
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/file/format/news::serialized-news-article-catalog
