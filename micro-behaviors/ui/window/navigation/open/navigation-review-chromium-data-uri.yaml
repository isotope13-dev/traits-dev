defaults:
  platforms: [windows, linux, macos]
  for: [scripts, source, binaries, -beam, -wasm, -static-lib]
  crit: notable
  conf: 0.95

traits:
  - id: chromium-inline-html-data-uri
    desc: Browser command opens Base64 HTML data URI
    if:
      # Multiline argv and shell continuations retain the same CLI semantics.
      type: text
      regex: '\b(msedge|chrom(e|ium))(\.exe)?\b[\s\S]{0,600}data:text/html;base64,'
      case_insensitive: true
