defaults:
  platforms: [windows, unix]
  for: [svg, html, javascript]

composite_rules:
  - id: svg-html-blob-new-tab-clues
    desc: SVG script, HTML Blob and new-tab clues
    crit: suspicious
    conf: 0.95
    for: [svg]
    all:
      - id: metadata/file/format/markup::inline-svg-script-body
      - id: micro-behaviors/data/format/html::blob-html-document
      - id: micro-behaviors/ui/window/navigation/open::objecturl-open-new-tab
