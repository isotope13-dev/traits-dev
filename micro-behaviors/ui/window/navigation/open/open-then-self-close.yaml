# Opens a new window/tab and immediately closes the current one: an extension
# popup or page hands the user off to another URL and disappears.
traits:
  - id: window-open-then-self-close
    desc: Opens a URL then closes own window
    crit: notable
    conf: 0.88
    platforms: [windows, unix]
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'window\.open\([^;\n]{1,80}\);?\s*window\.close\(\)'
