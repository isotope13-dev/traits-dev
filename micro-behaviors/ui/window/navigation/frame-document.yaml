# Scripted frame navigation that loads an Office document. A page that
# retargets its own frame at a Word, Excel or PowerPoint document hands
# execution to Office; exploit intent is inferred by composites under
# objectives/ that pair this handoff with a preceding security downgrade.
defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [html, javascript]

traits:
  - id: frame-location-office-document
    desc: Navigates frame to Office document
    if:
      type: text
      regex: 'frames\[[^]]{0,40}\]\.location\s*=\s*["''][^"''\r\n]{0,80}\.(doc|xls|ppt)x?["'']'
