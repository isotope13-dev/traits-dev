# Belt-and-braces redirect through a string table: the same target is passed
# to window.location.replace() and document.location.replace() back to
# back, with every property name fetched by index so neither "location" nor
# "replace" appears in the source.
traits:
  - id: table-indexed-window-and-document-redirect
    desc: Table-indexed redirect on window and document
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [javascript, html]
    if:
      type: text
      regex: 'window\[\w+\[0x\w+\]\]\[\w+\[0x\w+\]\]\(\w+\);document\[\w+\[0x\w+\]\]\['
