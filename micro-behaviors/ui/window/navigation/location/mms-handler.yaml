# mms:// is registered to Windows Media Player. Assigning it to the page
# location from script starts the player without a prompt.
defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
traits:
  - id: mms-scheme-location-assignment
    desc: Script navigates to an mms:// handler
    crit: notable
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: 'location(\.href)?\s*=\s*["'']mms://'
