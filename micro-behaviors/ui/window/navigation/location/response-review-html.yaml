defaults:
  platforms: [windows, unix]
  for: [html, javascript]
composite_rules:
  - id: fetch-json-base64-navigation
    desc: HTTPS fetch, JSON decoding and navigation
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/client::fetch-literal-https-url
      - id: micro-behaviors/data/parse/json::json-call-atob-proximity
      - id: micro-behaviors/data/property/assign::location-href-write-text
    near_bytes: 900
