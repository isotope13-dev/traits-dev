defaults:
  platforms: [unix, windows]
  for: [html]
traits:
  - id: ea-provider-navigation
    desc: Navigates browser to EA provider domain
    crit: notable
    conf: 0.98
    # Text comment exclusion was insufficient for commented script elements.
    # Retain byte ranges and reject only matches inside HTML comments.
    if:
      type: yara
      source: |
        rule ea_provider_navigation {
          strings:
            $behavior = /\blocation\.(href\s*=|replace\(|assign\()\s*["']https?:\/\/([\w.-]{1,80}\.)?ea\.com\// nocase
            $comment = /<!--(.|\n|\r)*?-->/
          condition:
            for any i in (1..#behavior) : (
              not for any j in (1..#comment) : (
                @behavior[i] >= @comment[j] and
                @behavior[i] < @comment[j] + !comment[j]
              )
            )
        }
