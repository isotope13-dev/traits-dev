defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.9
composite_rules:
  - id: script-only-page-redirects-to-login
    desc: Script-only page redirects top window to tokenized login URL
    crit: notable
    conf: 0.9
    size_max: 4096
    all:
      - id: metadata/document/html/structure::script-only-html-page
      - id: micro-behaviors/ui/window/navigation/location::top-location-assignment
      - id: micro-behaviors/ui/window/navigation/location::browser-whole-window-navigation
      - id: micro-behaviors/communications/url/query/credential::login-page-long-session-token

  - id: browser-whole-window-navigation
    desc: Browser navigates the whole window
    any:
      - id: micro-behaviors/ui/window/navigation/location::top-location-assignment
      - id: micro-behaviors/ui/window/navigation/location::browser-location-replace
      - id: micro-behaviors/ui/window/navigation/location::window-variable-location-assignment
      - id: micro-behaviors/ui/window/navigation/refresh::browser-meta-refresh-instant-relative-url
