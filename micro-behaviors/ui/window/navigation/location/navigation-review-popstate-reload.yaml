defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  - id: popstate-hash-location-replace
    desc: Popstate hash check before location replacement
    crit: notable
    conf: 0.94
    if:
      type: text
      exclude_html_comments: true
      regex: '(?s)popstate.{0,80}if\s*\(\s*location\.hash.{0,240}location\.replace\('
  - id: popstate-push-then-replace
    desc: Popstate pushes history then replaces location
    crit: notable
    conf: 0.94
    if:
      type: text
      exclude_html_comments: true
      regex: '(?s)popstate.{0,45}history\.pushState\([^;]{0,80};\s*location\.replace\('
  # A popstate handler that navigates to an absolute remote URL: routers
  # restore same-document state on Back, they do not replace the page with
  # a third-party destination. Handler and target are separate atoms;
  # the exit-trap composite joins them.
  - id: location-replace-remote-url
    desc: Location replace with remote URL
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: "location\\.replace\\s*\\(\\s*['\"]https?://"
  # The destination can also be laundered through a call: kits wrap the
  # landing page in a function (`location.replace(fn())`) so no absolute
  # URL literal appears beside the sink. The bounded middle span covers a
  # plain or dotted callee (`fn()`, `obj.fn()`, `await fn()`); a bare
  # variable or member (`location.replace(nextUrl)`,
  # `location.replace(location.href)`) stays out, keeping reload-keepers
  # and same-page routers below this line.
  - id: location-replace-call-target
    desc: Location replace with call-result target
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: 'location\.replace\s*\(\s*[A-Za-z_$][\w$.\s]{0,40}\('
