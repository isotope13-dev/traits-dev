defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
    - html
composite_rules:
  - id: window-navigation-call
    desc: Browser navigation using open or location replace
    crit: notable
    conf: 1.0
    any:
      - id: micro-behaviors/ui/window/navigation/open::browser-window-open-variable-blank
      - id: micro-behaviors/ui/window/navigation/location::browser-location-bracket-replace
      - id: micro-behaviors/ui/window/navigation/location::browser-location-replace
