defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: packed-search-referrer-navigation
    desc: Packed referrer controls browser navigation
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule packed_search_referrer_navigation {
          strings:
            $open = /<script(?: type=['"]text\/javascript['"])?>\s{0,40}eval\(/ nocase
            $unpacker = "function(p,a,c,k,e,d){e=function(c){return c.toString(36)};if(!''.replace(/^/,String)){while(c--){d[c.toString(a)]=k[c]||c.toString(a)}k=[function(e){return d[e]}];e=function(){return'\\\\w+'};c=1};while(c--){if(k[c]){p=p.replace(new RegExp('\\\\b'+e(c)+'\\\\b','g'),k[c])}}return p}" private
            $body = "('e 1=d.f;g(1.2(\"b\")>0||1.2(\"i\")>0||1.2(\"a\")>0||1.2(\"9\")>0||1.2(\"h\")>0){8.6=\\'"
            $url = /7:\/\/[a-z0-9.\/-]{1,220}\\'/
            $else = "}m{8.6=\\'" private
            $args = "}',28,28,'|" private
            $head = /[a-z]\|indexOf\|(?:\w{0,63}\|){3}/ private
            $keys = "location|http|self|aol|yahoo|google||document|var|referrer|if|yandex|bing|"
            $domains = /(?:\w{0,63}\|){3}else\|(?:\w{0,63}\|){4}\w{1,63}/ private
            $end = /'\.split\('\|'\),0,\{\}\)\)\s{0,40}<\/script>/ private
            $comment = "<!--" private
            $comment_end = "-->" private
            $inert = /<(textarea|template|noscript)\b/i private
          condition:
            $open and $unpacker and $body and $keys and
            for any b in (1..#body) : (
              $unpacker at (@body[b] - 277) and
              for any s in (1..#open) : (
                @open[s] + !open[s] == @body[b] - 277 and
                (#comment == 0 or for all c in (1..#comment) : (
                  @comment[c] > @open[s] or
                  for any e in (1..#comment_end) : (
                    @comment_end[e] > @comment[c] and @comment_end[e] < @open[s]
                  )
                )) and
                (#inert == 0 or for all i in (1..#inert) : (
                  @inert[i] > @open[s]
                ))
              ) and
              for any u in (1..#url) : (
                @url[u] == @body[b] + 78 and
                $else at (@url[u] + !url[u]) and
                for any v in (1..#url) : (
                  @url[v] == @url[u] + !url[u] + 9 and
                  $args at (@url[v] + !url[v]) and
                  for any h in (1..#head) : (
                    @head[h] == @url[v] + !url[v] + 11 and
                    $keys at (@head[h] + !head[h]) and
                    for any d in (1..#domains) : (
                      @domains[d] == @head[h] + !head[h] + 74 and
                      $end at (@domains[d] + !domains[d])
                    )
                  )
                )
              )
            )
        }
