defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable

traits:
  - id: js-url-variable-external-literal
    desc: Assigns external HTTP URL to variable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(const|let|var)\s+[a-z_$][\w$]{0,24}\s*=\s*["'']https?://[^"''\s]{4,140}["'']'
    not:
      - regex: '(?i)https?://([\w-]+\.){0,32}(microsoft|microsoftonline|sharepoint|live|office)\.com\b'
      - regex: '(?i)https?://([\w-]+\.){0,32}(w3|schemas?\.[a-z]+)\.org\b'
      - regex: '(?i)https?://([\w-]+\.){0,32}example\.(com|org|net)\b'
      - regex: '(?i)https?://localhost\b'

composite_rules:
  - id: variable-external-location-redirect
    desc: Navigates browser location via external URL variable
    conf: 0.94
    near_bytes: 512
    all:
      - id: js-url-variable-external-literal
    any:
      - id: browser-location-assignment
      - id: browser-location-replace
      - id: browser-location-assign
