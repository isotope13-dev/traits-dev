defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
traits:
  - id: hashchange-property-redirect
    desc: Hashchange property callback navigates
    if:
      type: text
      regex: 'onhashchange\s*=\s*function[^{}]{0,40}\{[^{}]{0,300}location\.(href\s*=|replace\s*\()'
  - id: hashchange-listener-redirect
    desc: Hashchange event callback navigates
    if:
      type: text
      regex: '["'']hashchange["'']\s*,\s*function[^{]{0,40}\{[^{}]{0,300}location\.(href\s*=|replace\s*\()'
