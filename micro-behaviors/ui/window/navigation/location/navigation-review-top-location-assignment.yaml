defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.9
traits:
  - id: top-location-assignment
    desc: Assigns top.location to navigate whole window
    if:
      type: text
      regex: '\btop\.location(\.href)?\s*=[^=]'
  - id: top-window-location-assignment
    desc: Assigns top.window.location to navigate window
    if:
      type: text
      regex: '\btop\.window\.location(\.href)?\s*=[^=]'
