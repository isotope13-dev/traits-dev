# Navigating to the domain part of an e-mail address the page just read.
# Harvest kits send the victim on to their real webmail ("https://" + the
# text after "@") once the password is captured, so the theft ends on a
# familiar page.
defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  conf: 0.88

traits:
  - id: email-domain-part-extraction
    desc: Slices domain part from an e-mail address
    crit: component
    if:
      type: text
      regex: '(indexOf\(\s*["'']@["'']\s*\)|split\(\s*["'']@["'']\s*\)(\s*\[\s*1\s*\]|\.pop\(\)))'

  - id: scheme-prefixed-variable-host-call
    desc: Location call to scheme plus variable
    crit: component
    if:
      type: text
      regex: 'location\.(replace|assign)\(\s*["'']https?://["'']\s*\+\s*[A-Za-z_$][\w$]*\s*[);]'

  - id: scheme-prefixed-variable-host-assignment
    desc: Location set to scheme plus variable
    crit: component
    if:
      type: text
      regex: 'location(\.href)?\s*=\s*["'']https?://["'']\s*\+\s*[A-Za-z_$][\w$]*\s*[);]'

composite_rules:
  - id: email-domain-redirect
    desc: Browser is sent to the domain taken from an e-mail address
    crit: notable
    near_lines: 60
    all:
      - id: email-domain-part-extraction
    any:
      - id: scheme-prefixed-variable-host-call
      - id: scheme-prefixed-variable-host-assignment
