# window[table[i]][table[j]] = table[k] (optionally through atob): the
# "location"/"href" names and the destination all come from an _0x string
# table, so the redirect never spells any of them in the source.
traits:
  - id: hex-table-indexed-location-assignment
    desc: Assigns window property from _0x string table
    crit: notable
    conf: 0.85
    platforms: [windows, unix]
    for: [javascript, html]
    if:
      type: text
      regex: 'window\[_0x\w+\[\d+\]\]\[_0x\w+\[\d+\]\]\s*=\s*(atob\(\s*)?_0x\w+\[\d+\]'
