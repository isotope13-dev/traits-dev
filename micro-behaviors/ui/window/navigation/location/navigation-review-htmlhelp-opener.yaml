defaults:
  platforms: [windows]
  for: [html, javascript]
  crit: notable
  conf: 0.95
traits:
  - id: opener-assign-method-capture
    desc: Saves opener location assign method
    if:
      type: text
      regex: '=\s*opener\.location\.assign\s*;'
  - id: opener-res-navigation
    desc: Navigates opener to resource scheme
    if:
      type: text
      regex: 'opener\.location\s*=\s*["'']res:["'']'
  - id: msitstore-location-replace
    desc: Navigates to HTML Help store
    if:
      type: text
      regex: '(?i)location\.replace\(["'']mk:@MSITStore:'
