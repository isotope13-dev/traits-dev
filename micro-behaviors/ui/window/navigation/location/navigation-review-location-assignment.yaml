defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: location-value-assignment
    desc: Writes explicit browser location property
    crit: notable
    conf: 0.92
    if:
      # A local path binding called location is not browser navigation.
      # Parsed assignment targets also exclude comments and declarations.
      type: symbol
      kind: bind
      regex: '^(window|document|globalThis)\.location(\.href)?$'
