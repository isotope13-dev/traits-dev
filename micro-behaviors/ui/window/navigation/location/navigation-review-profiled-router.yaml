defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
composite_rules:
  - id: profiled-post-response-navigation
    desc: Browser profile, POST and response navigation co-occur
    crit: notable
    conf: 0.98
    all:
      - id: metadata/lang/source/naming/interface/presentation::browser-router-profile-field-cluster
      - id: micro-behaviors/communications/http/post::xhr-post-open-send
      - id: micro-behaviors/ui/window/navigation/location::xhr-response-url-navigation
      - id: micro-behaviors/communications/http/client/response-body::response-text
    near_bytes: 4800
