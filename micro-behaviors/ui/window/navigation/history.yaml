defaults:
  platforms: [windows, unix]
  for: [html, javascript, makefile]
  conf: 0.95
traits:
  - id: history-go-call
    desc: Script walks the browser history
    crit: notable
    if:
      type: text
      regex: '(?i)\.history\.go\s*\('
  # Fabricated history entries (pushState/replaceState) are the setup half
  # of a back-button trap: the page rewrites what Back means before the
  # visitor presses it. Ordinary routers push real routes; traps push
  # decoys, which the composites below distinguish by what follows.
  - id: history-entry-forge
    desc: Script forges browser history entries
    crit: notable
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: '\.history\.(pushState|replaceState)\s*\('
  # A popstate listener alone is ordinary router plumbing; beside forged
  # entries it is the trigger half of the trap.
  - id: popstate-navigation-listener
    desc: Script listens for history back navigation
    crit: notable
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: 'addEventListener\s*\(\s*[''"]popstate[''"]'
