defaults:
  platforms: [windows, unix]
  for: [html, javascript, makefile]
  conf: 0.95
traits:
  - id: history-go-call
    desc: Script walks the browser history
    crit: notable
    if:
      type: text
      regex: '(?i)\.history\.go\s*\('
  # History state updates also support ordinary SPA routing and undo.
  # Deceptive navigation requires independent trapping/redirect evidence.
  - id: history-state-update
    desc: Calls browser history pushState or replaceState
    crit: notable
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: '(^|[^.\w])(\w+\.)?history\.(pushState|replaceState)\s*\('
  # Only pushState adds an entry to the session history; replaceState edits
  # the current one in place (scroll-spy hash sync on docs pages), so it can
  # never stack the decoy entries a back-button trap needs.
  - id: history-push-state-entry
    desc: Adds a browser history entry via pushState
    crit: notable
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: '(^|[^.\w])(\w+\.)?history\.pushState\s*\('
  # A popstate listener alone is ordinary router plumbing; beside forged
  # entries it is the trigger half of the trap.
  - id: popstate-navigation-listener
    desc: Script listens for history back navigation
    crit: notable
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: 'addEventListener\s*\(\s*[''"]popstate[''"]'
  # A popstate handler that reads a named field of the popped entry's state
  # object (`e.state.selection_guid`, `event.state.page`) is restoring the
  # application view it saved with pushState -- SPA routing and in-app undo
  # history. Back-button traps push null/decoy state and never read it back.
  - id: popstate-state-field-restore
    desc: Popstate handler reads saved state fields
    crit: notable
    conf: 0.85
    for: [html, javascript]
    if:
      type: text
      regex: '\b(e|ev|evt|event|popStateEvent)\.state\.[A-Za-z_$][\w$]*'
  # The hashchange twin of the popstate listener: kits that forge `#<ts>`
  # decoy entries watch `window.onhashchange` instead of popstate for the
  # Back press. Hash routers listen too, so this stays notable until a
  # forced redirect joins it in the trap composite.
  - id: hashchange-navigation-listener
    desc: Script listens for hash fragment navigation
    crit: notable
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: '(onhashchange\s*=|addEventListener\s*\(\s*[''"]hashchange[''"])'
