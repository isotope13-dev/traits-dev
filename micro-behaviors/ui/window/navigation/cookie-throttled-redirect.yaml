# Direct navigation evidence is distinct from unresolved property-key writes.
# The string-table composite reports co-occurrence, not recovered data flow.
defaults:
  platforms: [windows, unix, android]
  for: [html, javascript]
  crit: notable
  conf: 0.88
traits:
  - id: expiring-cookie-then-window-location
    desc: Sets expiring cookie then navigates window
    if:
      type: text
      regex: 'document\.cookie\s*=.{0,60}expires=.{0,60};\s*window\.location\s*='
  - id: location-property-string
    desc: String contains quoted location property name
    crit: component
    if:
      type: text
      substr: '"location"'
composite_rules:
  - id: cookie-expiry-with-computed-browser-writes
    desc: Cookie-expiry tokens and computed browser writes
    crit: notable
    conf: 0.88
    near_bytes: 4000
    all:
      - id: micro-behaviors/communications/http/cookies::cookie-property-expiry-strings
      - id: location-property-string
      - id: micro-behaviors/data/property/assign::string-table-document-property-write
      - id: micro-behaviors/data/property/assign::string-table-window-property-write
