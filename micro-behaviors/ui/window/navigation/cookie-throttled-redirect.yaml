# Script sets an expiring cookie and immediately reassigns window.location:
# the cookie marks the visitor so the navigation fires once per window
# (the caller checks for it before redirecting again).
defaults:
  platforms: [windows, unix, android]
  for: [html, javascript]
  crit: notable
  conf: 0.88
traits:
  - id: expiring-cookie-then-window-location
    desc: Sets expiring cookie then navigates window
    if:
      type: text
      regex: 'document\.cookie\s*=.{0,60}expires=.{0,60};\s*window\.location\s*='
  - id: string-table-cookie-key
    crit: component
    desc: Hex string table contains cookie key
    if:
      type: text
      substr: '"cookie"'
  - id: string-table-expires-key
    crit: component
    desc: Hex string table contains expires key
    if:
      type: text
      substr: 'expires='
  - id: string-table-location-key
    crit: component
    desc: Hex string table contains location key
    if:
      type: text
      substr: '"location"'
  - id: computed-document-cookie-assignment
    desc: Assigns document cookie through computed key
    if:
      type: text
      regex: 'document\[_0x[\w$]+\[\d+\]\]\s*=\s*_0x[\w$]+\[\d+\]'
  - id: computed-window-location-assignment
    desc: Assigns window location through computed key
    if:
      type: text
      regex: 'window\[_0x[\w$]+\[\d+\]\]\s*=\s*[_\w$]+'
composite_rules:
  - id: obfuscated-expiring-cookie-then-window-location
    desc: Sets expiring cookie then navigates window through string-table keys
    crit: notable
    conf: 0.88
    near_bytes: 3000
    all:
      - id: string-table-cookie-key
      - id: string-table-expires-key
      - id: string-table-location-key
      - id: computed-document-cookie-assignment
      - id: computed-window-location-assignment
