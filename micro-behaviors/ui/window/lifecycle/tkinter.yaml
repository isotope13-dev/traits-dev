# Tkinter GUI Framework Capabilities
defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: tk-constructor-call
    desc: Tk constructor-name fragment
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(tkinter\.|tk\.|)Tk$'

composite_rules:
  - id: tkinter-init
    desc: Calls Tk constructor with Tkinter import
    crit: notable
    conf: 0.9
    all:
      - id: tk-constructor-call
      - id: metadata/import/python/tkinter
