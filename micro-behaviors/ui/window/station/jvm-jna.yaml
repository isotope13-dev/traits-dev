# Desktop-object API names bound from the JVM. A JNA interface that declares
# `CreateDesktop` / `SetThreadDesktop` keeps the Win32 name as a method name
# in the class constant pool, which is all the binding leaves behind -- there
# is no native import table to read. Neutral alone (kiosk and multi-desktop
# utilities use them); the HVNC composites pair them with window capture.
defaults:
  platforms: [windows]
  for: [class, java_class]
  crit: notable
  conf: 0.88
  attack: T1564.003
traits:
  - id: jvm-create-desktop-name
    desc: JVM class names CreateDesktop
    if:
      type: text
      regex: '^CreateDesktop[AW]?$'
  - id: jvm-set-thread-desktop-name
    desc: JVM class names SetThreadDesktop
    if:
      type: text
      exact: SetThreadDesktop
