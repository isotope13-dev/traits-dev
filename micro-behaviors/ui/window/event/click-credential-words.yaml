defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: body-click-user-password-words
  desc: Body click handler near user/password words
  crit: notable
  conf: 0.94
  if:
    type: text
    # Whole credential words: a handler named `userInteractionHandler` is not
    # a username read.
    regex: document\.body\.(on|addEventListener\(\s*['"])click.{0,99}\b(user(name)?|pass(word|wd)?)\b
- id: body-click-credential-words-fragment
  desc: Body click handler near credential words
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: document\.body\.(on|addEventListener\(\s*['"])click.{0,120}(cred|login)
composite_rules:
- id: body-click-credential-words
  desc: Body click handler near credential words
  crit: notable
  conf: 0.94
  any:
  - id: body-click-user-password-words
  - id: body-click-credential-words-fragment
