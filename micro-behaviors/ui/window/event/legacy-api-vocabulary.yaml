# Legacy event API words occur in ordinary React compatibility code too.
# They establish API vocabulary, not a packer dictionary or library identity.
# Preserve the existing Packer consumers and their suppression semantics.
defaults:
  platforms: [unix, windows]
  for: [javascript, shell, html, text]
  crit: notable
  conf: 0.95

traits:
  - id: legacy-attach-event-token
    desc: References legacy attachEvent API
    if:
      type: text
      word: attachEvent

  - id: legacy-detach-event-token
    desc: References legacy detachEvent API
    if:
      type: text
      word: detachEvent

  - id: legacy-source-element-token
    desc: References legacy srcElement property
    if:
      type: text
      word: srcElement

composite_rules:
  - id: legacy-event-api-vocabulary
    desc: Legacy browser event API vocabulary
    crit: exception
    conf: 0.95
    all:
      - id: legacy-attach-event-token
      - id: legacy-detach-event-token
      - id: legacy-source-element-token
