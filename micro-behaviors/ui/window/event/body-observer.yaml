defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
- id: document-body-observe-call
  desc: ".observe(document.body) call"
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: observer\.observe\(document\.body|observe\(document\.body

composite_rules:
- id: mutation-observer-body
  desc: Observes mutations on document body
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/ui/window/event::browser-mutation-observer
  - id: document-body-observe-call
  - id: metadata/permission/runtime::is-extension
