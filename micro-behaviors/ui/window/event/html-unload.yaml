defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.95
traits:
  - id: html-body-onload-handler
    desc: Body element registers an onload handler
    if:
      type: text
      regex: '(?i)<body\b[^>]{0,240}\sonload\s*='
      exclude_html_comments: true
  - id: html-body-unload-handler
    desc: Body element registers an unload handler
    if:
      type: text
      regex: '(?i)<body\b[^>]{0,240}\sonunload\s*='
      exclude_html_comments: true
  - id: html-svg-onload-handler
    desc: SVG element registers onload handler
    for: [html, text, svg]
    if:
      type: text
      regex: '(?i)<svg\b[^>]{0,240}\sonload\s*='
      exclude_html_comments: true
  # Script-registered unload persistence (`attachEvent('onunload')` /
  # `addEventListener('unload')`): same exit hook as the body attribute
  # above, reachable when the markup carries no onunload of its own.
  # Analytics beacons use it too; composites add the malicious payload.
  - id: script-unload-handler-registration
    desc: Script registers unload handler
    if:
      type: text
      regex: 'attachEvent\s*\(\s*[''"]onunload[''"]|addEventListener\s*\(\s*[''"]unload[''"]'
      exclude_html_comments: true
