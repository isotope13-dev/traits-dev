defaults:
  platforms: [unix, windows]
  for: [html, javascript, typescript]
traits:
  - id: window-onload-handler-assignment
    desc: Script assigns a window load handler
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bwindow\.onload\s*=\s*[A-Za-z_$][\w$]*'
      exclude_html_comments: true
