defaults:
  platforms: [unix, windows]
  for: [html, svg]
traits:
  - id: svg-smil-begin-handler
    desc: SVG animation has an onbegin handler
    crit: notable
    conf: 0.96
    if:
      # HTML facts do not project inline handlers. The equivalent bounded
      # text regex showed lazy-DFA growth; use a byte signature to retain
      # the tag boundary without relaxing it to same-file co-occurrence.
      type: yara
      source: |
        rule svg_smil_begin_handler {
          strings:
            $event = /<(set|animate)\b[^<>]{0,300}\bonbegin\s*=/ nocase
          condition:
            $event
        }
