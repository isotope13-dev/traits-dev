defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]

traits:
  - id: f12-cancellation-branch
    size_max: 262144
    desc: F12 branch calls preventDefault
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((if_statement condition: (_) @condition consequence: (_) @branch)
          (#match? @condition "\\.key\\s*===?\\s*[\"']F12[\"']")
          (#match? @branch "\\.preventDefault\\s*\\("))

  - id: html-f12-near-event-cancellation
    desc: F12 branch calls preventDefault in HTML
    crit: notable
    conf: 0.88
    for: [html]
    if:
      type: text
      regex: '(?s)\.key\s*===?\s*["'']F12["''][^{}]{0,80}\{[^{}]{0,160}\.preventDefault\s*\('

  - id: html-f12-inline-cancellation
    desc: F12 branch calls preventDefault without braces
    crit: notable
    conf: 0.88
    for: [html]
    if:
      type: text
      regex: '(?s)\.key\s*===?\s*["'']F12["''][^;{}]{0,200}\)\s*\w+\.preventDefault\s*\('

composite_rules:
  - id: browser-f12-with-event-cancellation
    desc: F12 key comparison near event cancellation
    crit: notable
    conf: 0.9
    any:
      - id: f12-cancellation-branch
      - id: html-f12-near-event-cancellation
      - id: html-f12-inline-cancellation
