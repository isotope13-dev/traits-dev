defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]

composite_rules:
  - id: browser-f12-with-event-cancellation
    desc: F12 key comparison near event cancellation
    # Production web applications and kiosk-style UI helpers may intentionally
    # suppress inspection shortcuts. Keep this as a notable capability; the
    # debugger tripwires remain separate intent signals.
    crit: notable
    conf: 0.9
    near_lines: 5
    all:
      - id: micro-behaviors/hardware/input/event::browser-f12-key-comparison
      - id: micro-behaviors/ui/window/event::browser-prevent-default-call
