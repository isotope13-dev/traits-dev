defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
traits:
  - id: named-contextmenu-navigation
    desc: Context menu handler replaces location
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((program
          (function_declaration
            name: (identifier) @handler
            body: (statement_block
              (if_statement consequence: (statement_block
                (expression_statement (call_expression
                  function: (member_expression
                    object: (member_expression
                      object: (identifier) @window
                      property: (property_identifier) @location)
                    property: (property_identifier) @replace)))))))
          (expression_statement (assignment_expression
            left: (member_expression property: (property_identifier) @event)
            right: (identifier) @registered)))
          (#eq? @handler @registered)
          (#eq? @window "window")
          (#eq? @location "location")
          (#eq? @replace "replace")
          (#eq? @event "oncontextmenu"))
  - id: inline-contextmenu-navigation
    desc: Inline context menu handler replaces location
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'oncontextmenu\s*=\s*function\s*\([^)]{0,80}\)\s*\{[^}]{0,600}location\.replace\s*\('
