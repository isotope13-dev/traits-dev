defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, -kotlin]
  crit: notable
  conf: 0.82
traits:
- id: browser-prevent-default-call
  desc: Cancels browser event default action
  crit: baseline
  conf: 0.85
  if:
    type: text
    substr: ".preventDefault("
  # Polling which named frame holds focus tells a click-trap when its
  # concealed control was activated, so it can stop trailing the pointer
  # and hide the success. Ordinary focus management compares against form
  # fields, not a bare frame id.
- id: activeelement-frame-focus-check
  desc: Compares active element against a frame id
  conf: 0.88
  if:
    type: text
    regex: 'activeElement[\s\S]{0,150}==\s*["''][A-Za-z0-9_]+["'']'
- id: browser-keydown-handler
  desc: Installs browser keydown handler
  conf: 0.78
  if:
    type: text
    regex: '\b(window\.)?onkeydown\b\s*='
- id: browser-contextmenu-handler
  desc: Installs browser context menu handler
  conf: 0.78
  if:
    type: text
    regex: '\b(window\.)?oncontextmenu\b\s*='
- id: browser-beforeunload-handler
  desc: Installs browser beforeunload handler
  conf: 0.86
  if:
    type: text
    regex: '\b(window\.)?onbeforeunload\b\s*='
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: well-known/lib/web/jquery/
  # Inverted hover visibility: the element hides when the pointer arrives and
  # shows when it leaves. Ordinary menus do the opposite (show on hover), so
  # this inverse pair is the evasion half of a pointer-following trap: the
  # trap yields to genuine controls and re-covers bare page instead.
- id: mouseover-hide-handler
  desc: Hover handler hides an element
  conf: 0.85
  if:
    type: text
    regex: '(?i)\.mouseover\([^;]{0,120}hide'
- id: mouseout-show-handler
  desc: Unhover handler shows an element
  conf: 0.85
  if:
    type: text
    regex: '(?i)\.mouseout\([^;]{0,120}show'
- id: browser-mutation-observer
  desc: Watches DOM changes with MutationObserver
  conf: 0.8
  if:
    type: symbol
    kind: call
    regex: '(^|\.)MutationObserver$'
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
- id: browser-intersection-observer
  desc: Observes DOM element visibility
  conf: 0.82
  if:
    type: text
    regex: '\bnew\s+IntersectionObserver\s*\('
  unless:
  - id: metadata/file/format/source-map::sourcemap-sources-content
  - id: metadata/lang/scripted::dts-declaration-file
composite_rules:
- id: hover-hide-unhover-show-handlers
  desc: Hover hides element, unhover shows it
  conf: 0.85
  near_bytes: 600
  all:
  - id: mouseover-hide-handler
  - id: mouseout-show-handler
