defaults:
  crit: notable
  platforms: [windows]
  for: [vbs]
traits:
  - id: set-windowlong-wndproc-vb6
    desc: VB6 WndProc replacement API
    conf: 0.93
    if:
      type: text
      substr: SetWindowLongA Lib "user32"

  - id: call-windowproc-vb6
    desc: VB6 calls previous WndProc
    conf: 0.92
    if:
      type: text
      substr: CallWindowProcA Lib "user32"

  - id: gwl-wndproc-constant-vb6
    desc: VB6 GWL_WNDPROC constant
    conf: 0.9
    if:
      type: text
      word: GWL_WNDPROC

composite_rules:
  - id: vb6-wndproc-thunk-hook
    desc: VB6 window procedure thunk hook
    conf: 0.94
    all:
      - id: micro-behaviors/ui/window/event::set-windowlong-wndproc-vb6
      - id: micro-behaviors/ui/window/event::call-windowproc-vb6
      - id: micro-behaviors/ui/window/event::gwl-wndproc-constant-vb6
      - id: micro-behaviors/mem/copy::rtlmovememory-vb6
    any:
      - id: metadata/file/profile/memory-protection-api::virtual-alloc-vb6
