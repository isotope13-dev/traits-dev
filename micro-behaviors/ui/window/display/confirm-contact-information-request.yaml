# HTML email bodies used as phishing or bulk-mail templates.
# An e-mail body is a few KB. The brand and pretext matchers are Unicode-aware
# case-insensitive scans, and over 1.7 MB cspell trie dictionaries (typed text)
# the E*TRADE and Citibank ones each ran 90-240 s and were reported as analysis
# bombs, so the whole file is bounded.
defaults:
  platforms: [unix, windows]
  for: [html, text, markdown, makefile]
  size_max: 1048576

traits:
  - id: confirm-contact-information-request
    desc: Asks to confirm contact information
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)confirm your (e-?mail address|personal information)'
      exclude_html_comments: true
  # Account notices may mention further information after an account review.
  # This stays notable because genuine service notices use the same wording;
  # brand and destination deception supply intent.
