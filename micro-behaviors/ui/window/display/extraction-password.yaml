defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: password-label-text
    desc: HTML contains password label text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(Document\s+)?password\s*(:|is\b|to\s+(access|open)\b)'
      exclude_html_comments: true
  # Element text stating a short password value ("Password is 64189</p>"):
  # the page hands the reader a key, typically for an archive it also
  # delivers. Form labels ("Password:</label>", "Password: <input") do not
  # match because a value must sit between the label and a closing tag.
  # Require a value delimiter, including after an optional purpose phrase.
  # "Convert password to plaintext" and "password to open the document"
  # are instructions, not disclosed passwords.
  - id: inline-password-value-text
    desc: Displays a literal password value in markup
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bpassword( to [^:<]{1,20})?\s*(is\b|:)\s*(<\w+>\s*)?\w{3,24}\s*</'
      exclude_html_comments: true
