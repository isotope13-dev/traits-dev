defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: password-label-text
    desc: HTML contains password label text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(Document\s+)?password\s*(:|is\b|to\s+(access|open)\b)'
      exclude_html_comments: true
  # Element text stating a short password value ("Password is 64189</p>"):
  # the page hands the reader a key, typically for an archive it also
  # delivers. Form labels ("Password:</label>", "Password: <input") do not
  # match because a value must sit between the label and a closing tag.
  # Require a value delimiter, including after an optional purpose phrase.
  # "Convert password to plaintext" and "password to open the document"
  # are instructions, not disclosed passwords.
  - id: inline-password-delimited-value-text
    for: [html, javascript]
    desc: Displays a delimited password value in markup
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bpassword( to [^:<]{1,16})?\s*(is|:)(&nbsp;?)?\s*(<[^>]{1,80}>)?\s*\w{3,24}\s*</'
      exclude_html_comments: true
  # "Your password to access the document <b>TTK1Z</b>": no "is"/":" but the
  # purpose phrase runs straight into an emphasised value element. Requiring
  # the inline tag keeps bare instructions ("password to open the
  # document</p>") from matching.
  - id: inline-password-purpose-tagged-value-text
    for: [html, javascript]
    desc: Shows tagged password value after purpose
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bpassword (to|for) [\w ]{2,40}<(b|strong|em|code|u)>\s*[^\s<]{3,24}\s*</'
      exclude_html_comments: true
composite_rules:
  - id: inline-password-value-text
    desc: Displays a literal password value in markup
    for: [html, javascript]
    crit: notable
    conf: 0.9
    any:
      - id: inline-password-delimited-value-text
      - id: inline-password-purpose-tagged-value-text
