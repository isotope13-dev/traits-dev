defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.95
traits:
  - id: html-document-downloaded-status
    desc: HTML claims a document was downloaded
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)>\s*(The\s+)?document\s+(was\s+[^<d]{0,32})?downloaded'

  - id: html-document-download-instruction
    desc: Page instructs downloading the document
    if:
      type: text
      exclude_html_comments: true
      regex: '>\s*to download the document\s*<'
      case_insensitive: true
