# Android window/display brightness control. Setting a window's
# screenBrightness to the minimum (or writing the system screen-brightness
# setting) blanks the display while keeping it on — the black-screen
# concealment used during remotely driven sessions. The APIs themselves are
# neutral (screen dimmers, night mode); objective composites combine them
# with remote-control evidence.
defaults:
  platforms: [android]
  for: [java, kotlin]
  crit: notable
  conf: 0.9

traits:
  - id: android-screen-brightness-zero
    desc: Sets Android window screen brightness to zero
    conf: 0.94
    if:
      type: text
      regex: 'screenBrightness\s*=\s*0\b'

  - id: android-screen-brightness-reference
    desc: Android window screen brightness field reference
    for: [apk, zip, dex]
    conf: 0.86
    if:
      type: text
      word: screenBrightness

  - id: android-system-screen-brightness-write
    desc: Writes Android system screen brightness setting
    conf: 0.92
    if:
      type: text
      regex: 'Settings\.System\.putInt\s*\([^)]{0,80}(SCREEN_BRIGHTNESS|"screen_brightness")'

  - id: android-system-screen-brightness-write-reference
    desc: System screen brightness write reference
    for: [apk, zip, dex]
    conf: 0.86
    if:
      type: text
      word: screen_brightness
