# A short plain-text note that states a password or access code value. The
# keyword list covers English/German and Cyrillic lure wording. The label must
# sit directly before the colon and the value must end the line, so prose that
# merely mentions a password does not match.
defaults:
  for: [text]
  platforms: [unix, windows]
  size_max: 2048
traits:
- id: plain-text-access-code-value
  desc: Short note states a password value
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '(?im)(passwor[dt]|пароль|код доступ[уа]) {0,3}: *[A-Za-z0-9]{3,16} *\r?$'
