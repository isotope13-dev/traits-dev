# A short plain-text note that states a password or access code value. The
# keyword list covers English/German and Cyrillic lure wording. The label must
# begin an active line, sit directly before the colon and end at the value; a
# commented configuration setting is not an access-code note.
defaults:
  for: [text]
  platforms: [unix, windows]
  size_max: 2048
traits:
- id: plain-text-access-code-value
  desc: Short note states a password value
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '(?im)^ *(passwor[dt]|пароль|код доступ[уа]) {0,3}: *[A-Za-z0-9]{3,16}\b'
# Cheat and crack bundles word the same hand-over as an "Unlock code" or
# "Archive key" line with a dash, colon or equals sign before a short value.
- id: unlock-code-note-value
  desc: Short note states an unlock code value
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '(?im)^ *(unlock|archive|unzip) ?(code|key|pass) {0,3}[-:=] *[A-Za-z0-9]{3,16}\b'
composite_rules:
- id: archive-access-code-note
  desc: Short note states a password or unlock code
  crit: notable
  conf: 0.88
  any:
    - id: plain-text-access-code-value
    - id: unlock-code-note-value
