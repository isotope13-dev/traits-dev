# HTML email bodies used as phishing or bulk-mail templates.
# An e-mail body is a few KB. The brand and pretext matchers are Unicode-aware
# case-insensitive scans, and over 1.7 MB cspell trie dictionaries (typed text)
# the E*TRADE and Citibank ones each ran 90-240 s and were reported as analysis
# bombs, so the whole file is bounded.
defaults:
  platforms: [unix, windows]
  for: [html, text, markdown, makefile]
  size_max: 1048576

traits:
  - id: ssn-as-login-credential
    desc: Asks SSN as ID and password
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bsocial security number\b.{0,60}\bas both your\b.{0,60}\bpersonal id and password\b'
      exclude_html_comments: true
  # An account-suspension claim ("account has been suspended", "suspension of
  # this account") also appears in legitimate status notices. Keep it as a
  # notable content signal; phishing composites pair it with brand and link
  # context before inferring a lure.
