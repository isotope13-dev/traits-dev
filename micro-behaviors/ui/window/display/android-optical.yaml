defaults:
  for: [java]
  platforms: [android]
  crit: notable

traits:
  - id: indexed-byte-bit
    desc: Extracts a bit from indexed bytes
    if:
      type: text
      regex: '\[[^\n\[\]]{1,48}\]\s*>>\s*\([^\n\[]{1,48}\)\)\s*&\s*1\b'
      exclude_comments: true

  - id: complementary-half-bit
    desc: Selects complementary bit levels
    if:
      type: text
      regex: '\?\s*(\w{1,24})\s*==\s*1\s*:\s*\w{1,24}\s*==\s*0'
      exclude_comments: true

  - id: half-bit-parity
    desc: Tests alternating half-bit parity
    if:
      type: text
      regex: '\(\w{1,24}\s*&\s*1\)\s*==\s*0\s*\?'
      exclude_comments: true

  - id: variable-rgb-background
    desc: Renders variable RGB background
    if:
      type: text
      regex: 'setBackgroundColor\(Color\.rgb\([a-zA-Z_]\w{0,23},\s*\w{1,24},\s*\w{1,24}\)\)'
      exclude_comments: true

composite_rules:
  - id: manchester-bit-levels
    desc: Indexed byte bits with complementary Manchester half-bit levels
    near_lines: 4
    all:
      - id: indexed-byte-bit
      - id: complementary-half-bit
      - id: half-bit-parity

  - id: screen-byte-transmitter
    desc: Repeated screen updates with Manchester byte encoding
    crit: notable
    all:
      - id: manchester-bit-levels
      - id: variable-rgb-background
      - id: micro-behaviors/time/schedule/interval::android-subsecond-self-rescheduling-handler

  - id: android-manchester-screen-signal
    desc: Repeated screen color updates with a Manchester bit-pair encoding
    crit: notable
    conf: 0.9
    all:
      - id: variable-rgb-background
      - id: micro-behaviors/data/encoding/manchester::java-half-bit-complement
      - id: micro-behaviors/time/schedule/interval::android-subsecond-self-rescheduling-handler
