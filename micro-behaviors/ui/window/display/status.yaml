defaults:
  platforms: [windows, unix, macos]
  for: [html, javascript, typescript, macho]
  crit: baseline
  conf: 0.7

traits:
  - id: please-wait-status-text
    desc: Displays generic wait or connection status text
    if:
      type: text
      regex: '(?i)\b(Please wait|Connecting to|Joining)\b'
