defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: shared-document-heading
    desc: HTML heading labels a shared document
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<(title|h1)\b[^>]{0,40}>\s*(shared document|document partag[eé])'
