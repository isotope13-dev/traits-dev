defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: shared-document-heading
    desc: HTML heading labels a shared document
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<(title|h1)[^>]{0,12}>\s*(shared doc\w+|document partag.|zahlungsbericht)'

  - id: secure-document-ready-heading
    desc: HTML heading says secure document ready
    crit: notable
    conf: 0.94
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<(title|h[1-3])\b[^>]{0,48}>\s*(your\s+)?secure\s+document\s+is\s+ready\b'
