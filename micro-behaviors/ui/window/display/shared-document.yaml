defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: shared-document-heading
    desc: HTML heading labels a shared document
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<(title|h1)[^>]{0,12}>\s*(shared doc\w+|document partag.|zahlungsbericht)'
