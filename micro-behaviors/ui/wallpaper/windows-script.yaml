defaults:
  crit: notable
  platforms: [windows]
  for: [batch, powershell]
traits:
  - id: powershell-set-wallpaper-value
    desc: Sets the desktop wallpaper registry value
    conf: 0.96
    for: [powershell]
    if:
      type: yara
      source: |
        rule powershell_set_wallpaper {
          strings:
            $set = /Set-ItemProperty[ \t]+-path[ \t]+['"]HKCU:\\Control Panel\\Desktop\\?['"][ \t]+-name[ \t]+wallpaper[ \t]+-value\b/ nocase
          condition:
            $set
        }
  - id: registry-wallpaper-value
    desc: Desktop wallpaper registry value
    conf: 0.9
    if:
      type: text
      regex: (?i)Control Panel\\Desktop[^\r\n]{0,80}/v\s+Wallpaper\b
  - id: refresh-wallpaper-settings
    desc: Refreshes per-user wallpaper settings
    conf: 0.9
    if:
      type: text
      substr: UpdatePerUserSystemParameters
composite_rules:
  - id: set-desktop-wallpaper-via-registry
    desc: Sets desktop wallpaper via registry
    conf: 0.96
    all:
      - id: registry-wallpaper-value
      - id: refresh-wallpaper-settings
