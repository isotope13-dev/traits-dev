defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Compiled C# uses the numeric SPI_SETDESKWALLPAPER action (20), so
  # its symbolic constant need not survive in metadata. The call layout
  # and desktop-value context corroborate the API reference, but do not
  # resolve its MethodDef token or establish a successful desktop change.
  - id: managed-wallpaper-update-references
    desc: Managed wallpaper API and update-call layout
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/binary/instruction/sequence::cil-call-20-zero-local-three
      - id: micro-behaviors/ui/controls/widget::system-parameters-info-string
      - id: micro-behaviors/os/registry/write::managed-registry-setter-token
      - id: micro-behaviors/os/registry/keys/path::control-panel-desktop-key
      - id: micro-behaviors/os/registry/value-name::wallpaper-style-value-name
