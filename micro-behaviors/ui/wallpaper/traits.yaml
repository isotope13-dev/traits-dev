defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
traits:
  - id: windows-lockscreen-background-directory
    desc: Windows lock-screen background path
    crit: notable
    conf: 0.96
    for: [source, scripts, binaries]
    if:
      type: text
      regex: '(?i)([A-Z]:)?\\{1,2}Windows\\{1,2}Web\\{1,2}Screen(\\{1,2}|/)'

  - id: spi-setdeskwallpaper-const
    desc: SPI_SETDESKWALLPAPER constant
    crit: component
    if:
      type: text
      word: SPI_SETDESKWALLPAPER
composite_rules:
  - id: set-desktop-wallpaper
    desc: Sets desktop wallpaper (SystemParametersInfo)
    crit: notable
    conf: 0.95
    all:
      - id: spi-setdeskwallpaper-const
      - id: micro-behaviors/ui/controls/widget::system-parameters-info
