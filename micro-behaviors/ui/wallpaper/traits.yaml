defaults:
  crit: notable
  platforms:
    - windows
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
traits:
  - id: windows-lockscreen-background-directory
    desc: Windows lock-screen background path
    conf: 0.96
    for: [source, scripts, binaries]
    if:
      type: text
      regex: '(?i)([A-Z]:)?\\{1,2}Windows\\{1,2}Web\\{1,2}Screen(\\{1,2}|/)'

  - id: spi-setdeskwallpaper-const
    desc: SPI_SETDESKWALLPAPER constant
    if:
      type: text
      word: SPI_SETDESKWALLPAPER

  # Compiled code folds the SPI_ constant into an immediate, so a native
  # wallpaper writer is recognised by the bitmap it saves and applies. The
  # nine-character literal is shorter than the strings the text extractor
  # reports, hence the byte match (UTF-16 or ANSI) in any section.
  - id: wall-bmp-path
    desc: Wallpaper bitmap path wall.bmp
    conf: 0.85
    for: [pe, dll]
    if:
      type: hex
      section: any
      pattern: '00 (5C 00 77 00 61 00 6C 00 6C 00 2E 00 62 00 6D 00 70 00 | 5C 77 61 6C 6C 2E 62 6D 70) 00'
composite_rules:
  - id: set-desktop-wallpaper
    for: [pe, c]
    desc: Wallpaper-setting API and action references
    conf: 0.95
    all:
      - id: spi-setdeskwallpaper-const
      - id: micro-behaviors/ui/controls/widget::system-parameters-info
    unless:
      # Cross-compiled extensions (e.g. mingw-built Ruby gems) carry whole
      # windows.h macro tables in .debug_macro; the constants there are
      # debug metadata, not calls the binary makes.
      - id: metadata/binary/section/label/conventional::dwarf-macro-table
