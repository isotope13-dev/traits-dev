defaults:
  platforms: [android]
  for: [apk, zip]
  crit: notable
  conf: 0.86

traits:
  - id: wallpaper-manager
    desc: Android WallpaperManager reference
    if:
      type: text
      substr: "Landroid/app/WallpaperManager;"

  - id: set-bitmap-wallpaper
    desc: Sets Android bitmap wallpaper
    if:
      type: text
      regex: "WallpaperManager.{0,80}setBitmap|setBitmap.{0,80}WallpaperManager"

  - id: set-resource-wallpaper
    desc: Sets Android resource wallpaper
    if:
      type: text
      regex: "WallpaperManager.{0,80}setResource|setResource.{0,80}WallpaperManager"

composite_rules:
  - id: set-android-wallpaper
    desc: Sets Android device wallpaper
    crit: notable
    conf: 0.9
    all:
      - id: wallpaper-manager
    any:
      - id: set-bitmap-wallpaper
      - id: set-resource-wallpaper
