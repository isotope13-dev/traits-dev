defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  # PyWallpaper's change_wallpaper() swaps the desktop image. It is the common
  # ransom-screen step in Python lockers, and ordinary wallpaper scripts use it
  # too, so this atom stays notable and only supports composites.
  - id: python-pywallpaper-change-call
    desc: Python PyWallpaper change_wallpaper call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)change_wallpaper$'
