# A reference to the Windows Forms assembly identifies the UI framework the
# code is built on. It is program-identity context for triage, not a
# clipboard behavior: every WinForms application references this assembly
# whether or not it touches the clipboard. Clipboard intent comes from the
# clipboard read/write atoms that consume this trait cross-directory.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.92

traits:
  - id: winforms-assembly-reference
    desc: Code references Windows Forms assembly
    if:
      type: text
      substr: System.Windows.Forms
