# GTK desktop UI toolkit reached from Python through PyGObject (`gi`).
# Neutral UI-framework usage, and the identity fact that explains why a script
# shells out, reads /etc/passwd or talks to D-Bus: it is a desktop settings
# application, not a headless implant.  Text matchers so the atoms survive
# compilation -- a .pyc keeps these as name-table entries with no symbols.
defaults:
  platforms: [linux, macos]
  for: [python, pyc]

traits:
  - id: pygobject-repository-import
    desc: Imports a GTK-stack module through PyGObject
    crit: notable
    conf: 0.92
    if:
      type: text
      word: gi.repository

  - id: gdk-pixbuf-image-loader
    desc: GdkPixbuf image loading (GTK image stack)
    crit: baseline
    conf: 0.9
    if:
      type: text
      word: GdkPixbuf

  - id: gtk-builder-ui-definition
    desc: Loads a GTK widget tree with Gtk.Builder
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '\bGtk\.Builder\b'
