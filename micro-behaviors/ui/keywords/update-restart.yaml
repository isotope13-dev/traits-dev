defaults:
  platforms: [windows, unix]
  for: [html, php, javascript]
traits:
  - id: required-update-restart-message
    desc: Message claims required update and restart
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)update is required\.{0,1}\s+Your (PC|computer) will restart'
