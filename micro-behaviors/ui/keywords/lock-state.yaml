defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: system-locked-phrase
    desc: Mentions the system being locked
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (?i)\bsystem[ \t]+((is|has been)[ \t]+)?locked\b
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
