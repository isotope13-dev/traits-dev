defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: update-progress-status-text
    desc: Update progress screen status text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(updates are underway|working on updates|installing updates|configuring windows updates)'
      case_insensitive: true

  - id: update-keep-computer-on-text
    desc: Screen asks to keep computer powered on
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(keep your (computer|pc) on|do not (turn off|shut down) your (computer|pc))'
