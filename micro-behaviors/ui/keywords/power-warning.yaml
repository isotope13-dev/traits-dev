# Updaters, firmware tools and recovery utilities also display this warning.
# Ransom-note composites may use it only with independent extortion evidence.
defaults:
  platforms: [unix, windows]
  for: [binaries]

traits:
  - id: power-interruption-warning
    desc: Warns against powering off or rebooting computer
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bdo\s+not\s+(turn\s+off|reboot)\b.{0,20}\b(computer|pc|system)\b'
