# Existing literal wording cues, relocated without broadening their scopes.
# These incomplete cues establish neither a wallet, Web3 library, staking,
# fraud nor an executed operation. They remain available to existing consumers;
# the synthetic-pressure behavior detection does not use English wording.
defaults:
  platforms: [windows, unix]
  crit: component
traits:
  - id: reward-action-wording
    desc: Reward claim or redelegation wording
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: literal
      regex: '\b(claim|withdraw|redelegate)\s+(the\s+)?(staking\s+)?rewards?\b'
      case_insensitive: true
  - id: reward-claim-wording
    desc: Reward claim or withdrawal wording
    conf: 0.65
    for: [shell, javascript, typescript, python]
    if:
      type: literal
      regex: '(?i)\b(claim|withdraw)\s+(the\s+)?(staking\s+)?rewards?\b'
