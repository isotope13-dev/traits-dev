defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.95
traits:
  - id: reimbursement-report-heading
    desc: HTML heading presents a reimbursement report
    if:
      type: text
      regex: '(?i)<h1>Relatório\s+Reembolso\b'
  - id: recipient-specific-report-claim
    desc: Report claims recipient-specific content
    if:
      type: text
      regex: '(?i)gerado especificamente para [^<\r\n]{5,100}@'
  - id: confidential-information-claim
    desc: Page claims confidential information
    if:
      type: text
      substr: contém informações confidenciais
  - id: verified-document-status-claim
    desc: Page asserts document validity and verification
    if:
      type: text
      regex: '(?i)Documento Válido e Verificado'
  - id: short-verification-token-display
    desc: HTML displays a short verification hash token
    if:
      type: text
      regex: 'Hash Verificação:</span>\s*<span[^>]{0,80}>[a-z0-9]{4,12}</span>'
