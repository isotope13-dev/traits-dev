# User-facing wording that presents the program as running locally and
# keeping data on the machine. Neutral on its own — legitimate local-first
# software says this too — but it is the statement a transcript-upload
# finding contradicts, so triage can quote exactly what the user was told.
defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: anonymous-viewing-feedback-claim
    desc: Claims anonymous viewing data or feedback
    crit: notable
    conf: 0.98
    for: [scripts, html, json]
    if:
      type: text
      regex: '(?i)anonymous (viewing (insights|data)|feedback)'

  - id: nothing-leaves-machine-claim
    desc: Claims nothing leaves the machine
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)nothing leaves your (computer|machine)'

  - id: local-model-private-claim
    desc: Advertises free private local operation
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)free.{0,16}private'

  - id: offline-local-claim
    desc: Claims fully local offline operation
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)100% local|fully offline'

composite_rules:
  - id: local-private-operation-claim
    desc: Advertises local private operation
    crit: notable
    conf: 0.85
    any:
      - id: nothing-leaves-machine-claim
      - id: local-model-private-claim
      - id: offline-local-claim
