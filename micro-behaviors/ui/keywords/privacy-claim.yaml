# User-facing wording that presents the program as running locally and
# keeping data on the machine. Neutral on its own — legitimate local-first
# software says this too — but it is the statement a transcript-upload
# finding contradicts, so triage can quote exactly what the user was told.
defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: anonymous-viewing-feedback-claim
    desc: Claims anonymous viewing data or feedback
    crit: notable
    conf: 0.98
    for: [scripts, html, json]
    if:
      type: text
      regex: '(?i)anonymous (viewing (insights|data)|feedback)'

  - id: nothing-leaves-machine-claim
    desc: Claims nothing leaves the machine
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)nothing leaves your (computer|machine)'

  - id: no-source-upload-claim
    desc: Claims source code stays on device
    crit: notable
    conf: 0.98
    for: [scripts, markdown, html]
    if:
      type: text
      regex: '(?i)no source code is sent to external servers|nothing leaves your editor'

  - id: local-model-private-claim
    desc: Advertises free private local operation
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)free.{0,16}private'

  - id: offline-local-claim
    desc: Claims fully local offline operation
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)100% local|fully offline'

  - id: local-only-storage-claim
    desc: Claims data stays stored on device only
    crit: component
    conf: 0.9
    for: [scripts, html, markdown, text, json]
    if:
      type: text
      regex: '(?i)(stored|kept) (on (your )?device|locally) only'

  - id: never-sent-to-servers-claim
    desc: Claims user data never sent to servers
    crit: component
    conf: 0.9
    for: [scripts, html, markdown, text, json]
    if:
      type: text
      regex: '(?i)never (sent|uploaded|transmitted) to .{0,16}servers?'

  - id: arabic-local-device-only-claim
    desc: Claims device-only storage without server upload
    crit: notable
    conf: 0.94
    for: [scripts, html, markdown, text, json]
    if:
      type: text
      regex: 'جهازك فقط.{0,24}لا يتم إرسالها.{0,24}خوادم'

composite_rules:
  - id: local-private-operation-claim
    desc: Advertises local private operation
    crit: notable
    conf: 0.85
    any:
      - id: nothing-leaves-machine-claim
      - id: local-model-private-claim
      - id: offline-local-claim

  - id: english-local-device-only-claim
    desc: Claims local storage without server upload
    crit: notable
    conf: 0.92
    for: [scripts, html, markdown, text, json]
    near_lines: 6
    all:
      - id: local-only-storage-claim
      - id: never-sent-to-servers-claim

  - id: local-device-only-data-claim
    desc: Claims data stays on device without upload
    crit: notable
    conf: 0.92
    for: [scripts, html, markdown, text, json]
    any:
      - id: nothing-leaves-machine-claim
      - id: no-source-upload-claim
      - id: english-local-device-only-claim
      - id: arabic-local-device-only-claim
