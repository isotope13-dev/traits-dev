# Generic UI status-message text literals. Neutral capability strings that
# appear in countless benign apps; they only imply intent when a composite
# combines them with other signals (e.g. fake-CAPTCHA verification flows).
defaults:
  platforms: [unix, windows]
  for: [text, scripts, javascript, typescript, html]
traits:
  # Sibling of success-message-literal: a progress label shown while something
  # is being checked. OAuth device flows, form validators, upload widgets and
  # loading states all print it, so it says nothing on its own. It sat at
  # `notable` inside objectives/credential-access/phishing/captcha/ until
  # 2026-09, which put a phishing label on any program containing the word
  # (relocated here; the fake-CAPTCHA composite still references it).
  - id: verifying-status-literal
    desc: Generic verifying progress text literal
    crit: component
    conf: 0.3
    if:
      type: text
      substr: Verifying...
  - id: success-message-literal
    desc: Generic success message text literal
    crit: component
    conf: 0.3
    if:
      type: text
      substr: Success!

  # Earning language is common in legitimate jobs and rewards programs. Keep
  # this as neutral UI content; intent comes from what the page offers payment
  # for, not from the call to action itself.
  - id: earnings-call-to-action
    desc: Earnings or payment call to action
    crit: component
    conf: 0.7
    if:
      type: text
      regex: '(?i)\b(let''?s\s+earn|earn\s+(money|cash|rewards?)|get\s+paid)\b'
  - id: download-status-msg
    desc: Download status message
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)Download\s*failed|Download\s*OK'
    unless:
    - type: trait
      id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: launch-status-msg
    desc: Launch status message
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)Launch\s*failed|Launch\s*OK'

  - id: download-action-label
    desc: Generic download action label
    crit: component
    conf: 0.7
    for: [python]
    if:
      type: literal
      kind: string
      exact: download

  - id: upload-action-label
    desc: Generic upload action label
    crit: component
    conf: 0.7
    for: [python]
    if:
      type: literal
      kind: string
      exact: upload

  - id: kotlin-login-success-status
    desc: Kotlin login success status text
    crit: notable
    conf: 0.75
    platforms: [unix, android, windows]
    for: [kotlin]
    if:
      type: literal
      regex: '(?i)\b(login|registration)\s+successful\b'
composite_rules:
  - id: download-and-launch-status
    desc: Download and launch status messages
    crit: component
    conf: 0.9
    all:
      - id: download-status-msg
      - id: launch-status-msg
