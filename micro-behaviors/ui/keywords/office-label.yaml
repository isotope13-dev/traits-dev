defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.94

traits:
  - id: macro-office-filename-markup-label
    desc: Markup label displays macro Office filename
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)>[^<>\r\n]{1,120}\.(xlsb|xlsm|docm|dotm)\s*</[a-z0-9]{1,6}>'
