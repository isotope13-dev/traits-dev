# A sales title, not a bare brand/replica mention in an article or library.
# This is content context; it establishes neither fraud nor navigation alone.
defaults:
  platforms: [windows, unix]
  for: [html]
traits:
  - id: replica-designer-sales-title
    desc: Title advertises cheap designer replicas
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      case_insensitive: true
      regex: '<title>\s*cheap louis vuitton [a-z ]{1,40},\s*replica louis vuitton'
