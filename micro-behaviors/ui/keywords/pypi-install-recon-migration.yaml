defaults:
  platforms:
  - unix
  - windows
  for:
  - python
composite_rules:
- id: decoy-init-py
  desc: Tiny init file and install message
  crit: suspicious
  conf: 0.85
  all:
  - id: metadata/file/size::init-py-file
  - id: metadata/file/size::tiny-python-file
  - id: micro-behaviors/ui/keywords::python-print-installed-message
