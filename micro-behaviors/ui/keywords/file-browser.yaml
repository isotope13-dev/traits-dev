defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source, -mirc, -ircii, -static-lib]
traits:
  - id: file-browser-word
    desc: References a file-browser feature name
    crit: notable
    conf: 0.2
    if:
      type: text
      substr: file_browser
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
