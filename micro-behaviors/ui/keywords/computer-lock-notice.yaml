defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: computer-locked-phrase
    desc: Message says your computer is locked
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (?i)\byour computer (is|has been) (now )?locked\b
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: windows-locked-phrase
    desc: Message says Windows is locked
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (?i)\bwindows[ \t]+(is[ \t]+)?locked\b
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
