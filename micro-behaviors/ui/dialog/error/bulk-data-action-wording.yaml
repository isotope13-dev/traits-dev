traits:
- platforms:
  - unix
  - windows
  for:
  - python
  - go
  - lua
  - shell
  - javascript
  - typescript
  - powershell
  - rust
  id: bulk-data-action-wording
  desc: Bulk data deletion or theft wording
  crit: notable
  conf: 0.94
  unless:
  - id: well-known/lib/network/getstream-stream-node::stream-node-sdk-official
  - id: well-known/lib/network/getstream-stream-node::stream-openapi-models-index-path
  - id: well-known/lib/data/lancedb::lancedb-python-distribution
  - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
  - id: well-known/app/ai/governance/nexus-agents::npm-package-name
  - id: metadata/file/format/structured::javascript-sourcemap-path
  if:
    type: text
    regex: (?i)\b(delete|exfiltrate|steal)\w*\s+all\s+(files|data)\b
  not:
  - regex: (?i)deletes? all files uploaded
  - regex: (?i)delete all files older than
