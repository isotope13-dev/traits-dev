# "Your browser is not supported ... download" wording: the classic lure for
# pushing a different browser or installer. Websites print it about their
# own support matrix; injected into arbitrary sites it is a lure.
traits:
  - id: browser-unsupported-download-wording
    desc: Browser-unsupported text urges a download
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [html, javascript, typescript, json]
    if:
      type: text
      regex: '(?i)browser is not supported[^<\n"]{0,100}\bdownload\b'
