defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: data-loss-warning
    crit: notable
    desc: Warns that data will be lost
    if:
      type: text
      case_insensitive: true
      regex: data (will be|is) lost
    unless:
    - type: trait
      id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
