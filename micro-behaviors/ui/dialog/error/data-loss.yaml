defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: data-loss-warning
    crit: notable
    desc: Warns that data will be lost
    if:
      type: text
      case_insensitive: true
      regex: data (will be|is) lost
    unless:
    - type: trait
      id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: file-data-recovery-failure-wording
    crit: notable
    desc: Files or data recovery failure wording
    if:
      type: text
      case_insensitive: true
      regex: '\bcannot\b.{0,20}\brecover\b.{0,30}\b(files?|data|decrypt)\b'
