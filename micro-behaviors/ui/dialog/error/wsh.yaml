defaults:
  platforms: [windows]
  for: [batch, vbs, javascript]

traits:
  - id: wsh-timed-error-popup
    desc: WSH displays timed error or warning popup
    crit: notable
    conf: 0.94
    if:
      type: text
      # WScript.Shell.Popup(message, timeout, title, type) also has a
      # parenthesis-free VBScript form. Require a nonzero timeout and the
      # standard critical/exclamation icon flags rather than matching prose.
      regex: '(?i)\b\w+\.Popup\s+[^,\r\n]{1,160},\s*[1-9]\d*,[^,\r\n]{0,100},\s*(16|48)\b'
