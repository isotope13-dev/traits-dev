traits:
- platforms:
  - linux
  - macos
  - windows
  for:
  - elf
  - macho
  - pe
  - vbs
  - javascript
  - powershell
  - batch
  id: data-destruction-warning
  desc: Data destruction warning wording
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: \bdestroy\b.{0,30}\b(your|all)\b.{0,30}\b(files|data|documents)\b
    case_insensitive: true
  not:
  - regex: destroy\(
  - regex: (?i)\bdestroy your data\b
  - regex: (?i)destroy\s+\(parts of\)\s+(all\s+)?your\s+data
  - exact: destroy all keys and data
  - regex: (?i)\b(secret-?keys?|keyring|private key)s?\b
  - regex: (?i)THIS MAY DESTROY
  - regex: (?i)MAY DESTROY \(PARTS OF\)
  - regex: (?i)\bAI\s+wants\s+to\b
  - regex: (?i)\bdestroy\b.{0,30}\b(tenant|organization|workspace|account|project|cluster|resource)\b
  - regex: (?i)\bloses?\s+(all\s+)?data\b
  - regex: (?i)\ball\s+its\s+(data|files|documents)\b
  unless:
  - type: text
    regex: (?i)\bto install \w+.{0,120}\brepartitioned\b.{0,120}\bdestroy all data on the disk\b
  - type: text
    regex: (?i)\b(could|might|would)\s+destroy\s+[^\r\n]{0,10}\b(files|data)\b
