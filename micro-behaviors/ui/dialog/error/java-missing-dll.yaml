defaults:
  platforms: [windows]
  for: [class]
traits:
  - id: missing-dll-reinstallation-message
    desc: Missing-DLL reinstall error-message constant
    crit: notable
    conf: 0.98
    if:
      type: value
      path: class.strings[*]
      substr: 'DLL file was not found. Re-install the application'
