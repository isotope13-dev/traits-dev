defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
traits:
  - id: document-preview-disabled
    desc: Page claims document preview is disabled
    if:
      type: text
      exclude_html_comments: true
      regex: '>\s*Preview(ing)? is disabled[.!]?\s*<'
      case_insensitive: true
