# A VBScript MsgBox whose whole text is a bare "error" with no detail, near
# the top of the file. Real error reports say what failed; a context-free
# error popup at start-up tells the user the file "did not work".
defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: vbs-opening-bare-error-msgbox
    desc: Opens with a bare error message box
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?im)^[ \t]*MsgBox[ \t(]+"(error|an error (has )?occurred)[.!]?"'
      offset_range: [0, 512]
