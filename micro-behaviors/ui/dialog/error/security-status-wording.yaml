defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.8

traits:
  - id: potential-threat-wording
    desc: Potential-threat warning wording
    if:
      type: text
      regex: '(?i)potential\s+threats?'
    unless:
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-capability-context
  - id: infected-files-wording
    desc: Infected-file status wording
    if:
      type: text
      regex: '(?i)files\s+infected'
    unless:
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-capability-context
  - id: full-scan-wording
    desc: Full-scan prompt wording
    if:
      type: text
      regex: '(?i)full\s+scan\s+of\s+your'
    unless:
      - id: well-known/lib/runtime/scripted/electron::chromium-engine-capability-context
