defaults:
  platforms: [windows, unix]
  for: [powershell, batch, vbs, javascript, html, pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: document-corrupt-error-message
    desc: Document reported corrupt
    if:
      type: encoded
      regex: '(?i)(this|the|your|[\n"''`(:>])\s*(document|pdf|file)\s(is|appears to be)\scorrupt(ed)?\b'
    unless:
      - id: well-known/app/system/reactos::system-component
  - id: document-damaged-error-message
    desc: Document reported damaged
    if:
      type: encoded
      regex: '(?i)(this|the|your|[\n"''`(:>])\s*(document|pdf|file)\s(is|appears to be)\sdamaged\b'
    unless:
      - id: well-known/app/system/reactos::system-component

composite_rules:
  - id: document-unreadable-error-message
    desc: Document reported corrupt or damaged
    any:
      - id: document-corrupt-error-message
      - id: document-damaged-error-message
