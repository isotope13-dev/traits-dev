# Electron dialog display. Showing a message or error box is ordinary user
# feedback; malware that quits silently on a gated check typically skips it,
# so gate composites reference this to exclude benign kiosk and updater flows.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: baseline

traits:
  - id: electron-dialog-box-call
    desc: Shows Electron message or error dialog
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)show(ErrorBox|MessageBox(Sync)?)$'
