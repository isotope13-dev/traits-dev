# Window titles of the Windows dialogs that stand between a user and a change
# to their machine.
#
# These are plain string constants, so each atom claims only that the binary
# carries the title -- an installer's help text can mention User Account
# Control, and a registry utility can name the Registry Editor. What makes them
# worth naming is that a program which intends to *suppress* one of these
# windows has to carry its title in order to recognise it during a window
# enumeration sweep, so the literal is the anchor a suppression composite needs.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: uac-consent-dialog-title
    desc: UAC consent dialog window title
    if:
      type: text
      exact: User Account Control

  # Matched as a prefix because the suppressors do: comparing against a short
  # leading slice of "Registry Editor" survives the localisation and the
  # "Registry Editor - [path]" variants that an exact title would miss, and
  # carrying the truncated form is itself characteristic of that technique.
  - id: registry-editor-window-title
    desc: Registry Editor window title prefix
    conf: 0.88
    if:
      type: text
      regex: '^Registry Edi'

  - id: tooltip-window-class-name
    desc: Windows tooltip window class name
    crit: baseline
    conf: 0.85
    if:
      type: text
      exact: tooltips_class32
