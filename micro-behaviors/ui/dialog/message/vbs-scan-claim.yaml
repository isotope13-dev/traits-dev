# A VBScript message box whose text says the computer is being scanned or
# disinfected. Security tools print progress in their own UI; a bare MsgBox
# making that claim is how a script poses as one.
defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: vbs-msgbox-computer-scan-claim
    desc: Message box claims to scan the computer
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)MsgBox\s*\(?\s*"[^"\n]{0,99}\b(scan|scanning|disinfect)\b[^"\n]{0,60}\b(computer|PC)\b'
