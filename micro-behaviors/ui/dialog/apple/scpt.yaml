defaults:
  for: [applescript]
  platforms: [macos]
  crit: notable
traits:
  - id: scpt-display-dialog-call
    desc: Calls the AppleScript display dialog event
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: syso.dlog

  # This records the parameter descriptor, not its Boolean value. Both
  # hidden-answer true and hidden-answer false legitimately use this surface.
  - id: scpt-dialog-hidden-answer-parameter
    desc: Compiled dialog has hidden-answer parameter
    conf: 0.97
    if:
      type: hex
      pattern: '0A 68 74 78 74 [0-128] 2E 73 79 73 6F 64 6C 6F 67'
