defaults:
  for: [scripts, source, macho]
  platforms: [macos]
  crit: notable

traits:
  - id: display-dialog-password
    desc: Display dialog asking for password
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?si)display dialog.{0,512}password

  - id: default-answer-password
    desc: Default answer field for password
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?si)default answer.{0,100}password

  - id: icon-caution
    desc: Dialog with caution icon
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: with icon caution

  - id: icon-stop
    desc: Dialog with stop icon
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: with icon stop

  - id: hidden-answer
    desc: AppleScript hidden answer (password masking)
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: with hidden answer
    unless:
      - id: well-known/tool/detection/security-scanner-identity::apple-xprotectd-scanner-context
      - id: well-known/tool/detection/cleave::cleave-static-analysis-context

  - id: compiled-osascript-password-prompt
    desc: Compiled osascript password prompt
    crit: notable
    conf: 0.93
    for: [macho]
    if:
      type: text
      regex: 'osascript[\x00-]{0,2}-e.{0,40}Get password'

composite_rules:
  - id: dialog-customization-options
    desc: Dialog input masking, icon, or system title
    crit: notable
    conf: 0.7
    any:
      - id: micro-behaviors/ui/dialog/apple::hidden-answer
      - id: micro-behaviors/ui/dialog/apple::icon-caution
      - id: micro-behaviors/ui/dialog/apple::icon-stop
      - id: micro-behaviors/ui/dialog/title::applescript-system-preferences-title

