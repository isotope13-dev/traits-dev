defaults:
  platforms: [android]
  for: [java, kotlin]

traits:
  # A mobile app that tells the user an update is waiting and to tap to install
  # it. Store apps hand updates to the store, so the wording only becomes a
  # lure when the same code also installs a package itself.
  - id: tap-to-install-update-prompt
    desc: Update-available notice asks user to tap
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '(?i)\bupdate available\b[^"\n]{0,24}\b(tap|click|press)\b'
