defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, html, python]
traits:
  - id: verify-human-echo-prompt
    desc: Echo prints a human-verification ENTER prompt
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)echo\s+["'']?\s*-{2,}\s*Verify\s+you\s+are\s+human.{0,80}press\s+ENTER'
