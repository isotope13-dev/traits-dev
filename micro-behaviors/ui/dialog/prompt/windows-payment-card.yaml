defaults:
  for: [pe]
  platforms: [windows]

traits:
  - id: pe-atm-pin-prompt
    desc: PE prompt requests an ATM PIN
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: "Please, enter your ATM PIN"
      section: any
  - id: pe-cvv2-prompt
    desc: PE prompt requests a card CVV2
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: "Please, enter your CVV2 (3-digit code on back of card)"
      section: any
  - id: pe-card-number-prompt
    desc: PE prompt requests a card number
    crit: notable
    conf: 0.94
    if:
      type: text
      exact: "Please, enter your Card Number"
      section: any
  - id: pe-card-brand-choice
    desc: PE prompt requests a card brand
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: "Please, select Card (Visa/MasterCard)"
      section: any
