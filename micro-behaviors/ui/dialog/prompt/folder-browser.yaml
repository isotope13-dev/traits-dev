defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: browse-for-folder
    desc: Display folder browse dialog
    crit: notable
    conf: 0.70
    if:
      type: symbol
      exact: "SHBrowseForFolderW"
  - id: browse-for-folder-name-reference
    desc: References the Windows folder-browse API name
    crit: notable
    conf: 0.88
    if:
      type: text
      exact: SHBrowseForFolderW
    unless:
      - id: browse-for-folder
