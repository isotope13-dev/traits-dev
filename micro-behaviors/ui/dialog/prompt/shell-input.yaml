defaults:
  platforms: [unix, windows]
  for: [shell]
composite_rules:
  - id: shell-read-or-password-prompt
    desc: Shell read prompt or password prompt text
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/ui/dialog/prompt::shell-read-prompt-input
      - id: micro-behaviors/ui/dialog/prompt::read-silent-password
      - id: micro-behaviors/ui/dialog/prompt::sudo-authentication-prompt-text
    unless:
      - id: well-known/app/ai/coding-agent/reason-machines::reason-machines-cli-context
