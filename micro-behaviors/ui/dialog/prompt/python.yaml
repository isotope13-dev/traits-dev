defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-builtins-input-call
    desc: Python calls the builtins.input prompt
    conf: 0.6
    if:
      type: text
      regex: '(__builtins__|builtins)\.input\('

  - id: python-builtins-input-wrapper
    desc: Python input wrapper delegates to builtins
    conf: 0.9
    if:
      type: text
      regex: 'def input\s*\(.{0,30}\):[\s\S]{0,300}(__builtins__|builtins)\.input\s*\('

  - id: python-input-literal-prompt
    desc: Python input prompt with literal text
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: input
      arg:
        kind: string
  # TUI consoles read commands through their own input loop instead of
  # builtins.input, so consent shows up as an explicit install/download/get
  # subcommand dispatch: the operator must type the install verb before the
  # tool fetches anything. Malware droppers run without asking; admin tools
  # with an install subcommand ask by requiring it to be typed.
  - id: explicit-install-subcommand-dispatch
    desc: Console dispatches explicit install subcommand
    conf: 0.8
    if:
      type: text
      regex: '\bin\s*\(\s*["''](install|download|get)["'']|==\s*["''](install|download|get)["'']'
  - id: input-continue-prompt
    desc: "Python input prompt waits user confirmation"
    conf: 0.78
    if:
      type: text
      case_insensitive: true
      regex: '\binput\s*\(\s*["''][^"''\n]{0,80}(continue|press|enter)["'']'
