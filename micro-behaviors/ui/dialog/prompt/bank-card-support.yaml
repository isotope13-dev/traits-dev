defaults:
  platforms: [windows, unix]
  for: [html]
  crit: notable
  conf: 0.95

traits:
  - id: bank-account-record-confirmation
    desc: Requests confirmation of bank account records
    if:
      type: text
      regex: '(?i)confirm your bank account records'
      exclude_html_comments: true
  - id: account-confirmation-suspension-threat
    desc: Threatens suspension for unconfirmed records
    if:
      type: text
      regex: '(?i)failure to confirm.{0,60}account suspension'
      exclude_html_comments: true
  - id: greeting-card-pickup-notice
    desc: Announces a greeting card awaiting pickup
    if:
      type: text
      regex: '(?i)Greeting\s+Card\s+is\s+waiting for you'
      exclude_html_comments: true
  - id: card-pickup-browser-instruction
    desc: Tells users to open a card-pickup address
    if:
      type: text
      regex: '(?i)CLICK this\s+pick-up\s+address or COPY and PASTE into your browser'
      exclude_html_comments: true
  - id: vendor-support-phone-instruction
    desc: Instructs user to call vendor support
    if:
      type: text
      regex: '(?i)Call (Apple|Microsoft) Support \(Toll-Free\)'
      exclude_html_comments: true
  - id: urgent-support-protection-installation
    desc: Urges support contact to install protection
    if:
      type: text
      regex: '(?i)immediately to connect with.{0,70}installing the Protection Software'
      exclude_html_comments: true
  - id: vendor-security-breach-alarm
    desc: Displays emphatic vendor security breach warning
    if:
      type: text
      regex: '(?i)(APPLE|MICROSOFT) SECURITY BREACH!!'
      exclude_html_comments: true
  - id: personal-data-transfer-alarm
    desc: Claims ongoing personal-data transfer
    if:
      type: text
      regex: '(?i)Transfe(r|rr)ing Your Personal Data and Pictures'
      exclude_html_comments: true
