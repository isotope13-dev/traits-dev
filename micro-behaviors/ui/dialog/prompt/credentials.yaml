defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]

traits:
  - id: recovery-phrase-input-prompt
    desc: References a recovery phrase input prompt
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(enter|input|prompt)\b.{0,64}\b(seed|recovery)\s+phrase\b'

  - id: secret-key-input-prompt
    desc: References a secret-key input prompt
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(enter|input|prompt)\b.{0,64}\bsecret\s+key\b'
