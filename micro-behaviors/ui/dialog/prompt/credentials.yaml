defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [scripts, binaries]

traits:
  # Prose that asks the reader to provide or copy a password / authorization
  # code. Setup guides and API docs say this too (wolfSSL's sslSniffer README:
  # "provide the text string password"); the agent-skill SMTP lure composites
  # in objectives/credential-access/phishing/credential/ add the intent.
  - id: password-or-auth-code-request-text
    desc: Text asks for password or auth code
    conf: 0.98
    for: [markdown]
    if:
      type: text
      regex: '(?i)\b(provide|copy)\b.{0,80}\b(password|authorization code|app password)\b'

  - id: recovery-phrase-input-prompt
    desc: References a recovery phrase input prompt
    if:
      type: text
      regex: '(?i)\b(enter|input|prompt)\b.{0,64}\b(seed|recovery)\s+phrase\b'

  - id: secret-key-input-prompt
    desc: References a secret-key input prompt
    if:
      type: text
      regex: '(?i)\b(enter|input|prompt)\b.{0,64}\bsecret\s+key\b'
