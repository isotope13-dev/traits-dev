defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-card-list-input-prompt
    desc: Python prompt requests card list
    if:
      type: symbol
      kind: call
      exact: input
      arg:
        index: 0
        from:
          value: '(?i)\bcard\s+list\b'
