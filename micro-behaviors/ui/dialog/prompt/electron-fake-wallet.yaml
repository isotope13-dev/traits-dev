# Secret-phrase label text; the unqualified alternative need not concern a wallet.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell, scripts, asar, dmg, pkg, zip]
  attack: T1185,T1567,T1555

traits:
  - id: secret-phrase-label
    desc: "Secret-phrase label text"
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?im)(TREZOR|LEDGER|EXODUS|WALLET)\s+SECRET\s+PHRASE|(^|[''"`>])\s*SECRET\s+PHRASE\s*:'
    not:
      - substr: ConvertTo-RedactedText
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: "metadata/file/naming::test-directory-component"
