defaults:
  platforms: [unix, windows]
traits:
- id: security-verification-copy
  desc: HTML displays security verification copy
  crit: notable
  for: [html]
  conf: 0.9
  unless:
    - id: well-known/lib/network/push-rocks::smartmta-unified-email-server-basename
    - id: well-known/lib/network/push-rocks::smartmta-rust-security-bridge-basename
    - id: well-known/lib/network/push-rocks::smartmta-package-text-marker
  if:
    type: text
    regex: '(?i)>\s*(verifying security|security verification)[ .!]{0,3}<'
