defaults:
  for: [source]
  platforms:
    - windows
traits:
  - id: messagebox-call-source
    desc: Windows MessageBox API call in source
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: (?i)\bMessageBox(A|W)?\s*\(
  # Real invocations go through a host UI object, such as
  # `$Host.UI.PromptForCredential(...)`. A bare `PromptForCredential(` with
  # `override` is only the method signature of a custom PSHostUserInterface;
  # automation hosts commonly implement it to refuse interactive prompting.
  - id: powershell-prompt-for-credential
    desc: PowerShell invokes credential prompt
    crit: notable
    conf: 0.95
    for: [powershell, csharp]
    if:
      type: text
      regex: (?i)\.\s*PromptForCredential\s*\(
