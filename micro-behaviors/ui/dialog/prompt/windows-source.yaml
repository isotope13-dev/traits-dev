defaults:
  for: [source]
  platforms:
    - windows
traits:
  - id: messagebox-call-source
    desc: Windows MessageBox API call in source
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: (?i)\bMessageBox(A|W)?\s*\(
  # Real invocations go through the host UI object -- `$Host.UI.PromptForCredential(...)`.
  # A bare `PromptForCredential(` declared with `override` is the C# method
  # signature of a custom PSHostUserInterface subclass, which automation hosts
  # override precisely to *refuse* prompting in non-interactive mode. Match
  # that override signature, not the dotted call form (which is the ordinary,
  # benign `$Host.UI.PromptForCredential(...)` invocation this trait must not
  # flag).
  - id: powershell-prompt-for-credential
    desc: PowerShell credential prompt API
    crit: suspicious
    conf: 0.95
    for: [powershell, csharp]
    if:
      type: text
      regex: (?i)\boverride\b[^\r\n]{0,60}\bPromptForCredential\s*\(
