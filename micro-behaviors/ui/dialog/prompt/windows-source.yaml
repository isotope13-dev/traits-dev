defaults:
  for: [source]
  platforms:
    - windows
traits:
  - id: messagebox-call-source
    desc: Windows MessageBox API call in source
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: (?i)\bMessageBox(A|W)?\s*\(
  # Real invocations go through the host UI object -- `$Host.UI.PromptForCredential(...)`.
  # A bare `PromptForCredential(` with no member access is the C# method
  # signature of a custom PSHostUserInterface subclass, which automation hosts
  # override precisely to *refuse* prompting in non-interactive mode.
  - id: powershell-prompt-for-credential
    desc: PowerShell credential prompt API
    crit: suspicious
    conf: 0.95
    for: [powershell]
    if:
      type: text
      regex: (?i)\.PromptForCredential\s*\(
