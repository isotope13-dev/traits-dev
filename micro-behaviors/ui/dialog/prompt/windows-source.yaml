defaults:
  for: [source]
  platforms:
    - windows
traits:
  - id: messagebox-call-source
    desc: Windows MessageBox API call in source
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: (?i)\bMessageBox(A|W)?\s*\(
  - id: powershell-prompt-for-credential
    desc: PowerShell credential prompt API
    crit: suspicious
    conf: 0.95
    for: [powershell]
    if:
      type: text
      regex: (?i)\bPromptForCredential\s*\(
