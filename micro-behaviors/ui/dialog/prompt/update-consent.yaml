# Records the diagnostic, not proof that a dialog executes or an exclusion
# for updaters. In the reviewed native program, MessageBoxW's IDYES branch
# precedes the download/swap; the other branch logs a declined update.
defaults:
  for: [pe]
  platforms: [windows]

traits:
  - id: self-update-consent-decision-diagnostic
    desc: Self-update consent decision diagnostic
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\b(check)?update: user (chose to|declined) update\b'
