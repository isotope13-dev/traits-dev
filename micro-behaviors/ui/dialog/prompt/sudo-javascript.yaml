# A UI label or placeholder that asks the user for a sudo password. The field
# value is the credential that the same program later feeds to sudo.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: javascript-sudo-password-prompt
    desc: UI text asks for a sudo password
    if:
      type: literal
      regex: '(?i)(enter|type|input)\s+(your\s+)?sudo\s+password|sudo\s+password\s*:'
