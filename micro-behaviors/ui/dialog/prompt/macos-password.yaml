defaults:
  for: [scripts, source, macho]
  platforms: [macos]
  crit: notable

traits:
  - id: compatibility-password-message
    desc: App compatibility message requests a password
    conf: 0.96
    if:
      type: text
      regex: '(?is)(not (fully )?compatible|work correctly).{0,180}(enter|provide|input).{0,40}password'

  - id: enter-password-prompt
    desc: Prompts user to enter password
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (?i)(please\s+)?enter(\s+your)?\s+password\b

  - id: shell-password-prompt-to-file
    desc: Shell prints password prompt to file
    crit: notable
    conf: 0.93
    for: [shell]
    if:
      type: text
      regex: '(?i)\b(printf|echo)\b[^\r\n|]{0,100}\bpassword\b[^\r\n|]{0,100}\|\s*tee\s+\S+'

  - id: enter-admin-password-prompt
    desc: Prompts user to enter admin password
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (?i)enter(\s+your)?\s+admin\s+password\b

  - id: enter-system-password-prompt
    desc: Prompts user to enter system password
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (?i)enter(\s+your)?\s+system\s+password\b

  - id: enter-login-password-prompt
    desc: Prompts user to enter login password
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (?i)enter(\s+your)?\s+login\s+password\b

  - id: enter-account-password-prompt
    desc: Prompts user to enter account password
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (?i)enter(\s+your)?\s+account\s+password\b

  - id: enter-keychain-password-prompt
    desc: Prompts user to enter keychain password
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (?i)enter(\s+your)?\s+keychain\s+password\b

  - id: admin-email-password-text
    desc: Admin email and password text
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?is)admin@[A-Za-z0-9._%+-]+\.[A-Za-z]{2,}.{0,80}password

  - id: applescript-pdf-export-password-prompt
    desc: AppleScript PDF export password prompt
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: (?i)password for the PDF

composite_rules:
  - id: password-prompt-pattern
    desc: Password dialog prompt
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/ui/dialog/apple::display-dialog-password
      - id: micro-behaviors/ui/dialog/apple::default-answer-password
      - id: micro-behaviors/ui/dialog/prompt::enter-password-prompt
      - id: micro-behaviors/ui/dialog/prompt::enter-admin-password-prompt
      - id: micro-behaviors/ui/dialog/prompt::enter-system-password-prompt
      - id: micro-behaviors/ui/dialog/prompt::enter-login-password-prompt
      - id: micro-behaviors/ui/dialog/prompt::enter-account-password-prompt
      - id: micro-behaviors/ui/dialog/prompt::enter-keychain-password-prompt

  - id: system-cred-prompt
    desc: System credential prompt
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/ui/dialog/prompt::enter-keychain-password-prompt
      - id: micro-behaviors/ui/dialog/prompt::enter-admin-password-prompt
