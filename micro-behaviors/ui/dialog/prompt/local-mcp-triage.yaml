defaults:
  platforms: [macos]
  for: [applescript, macho, swift, objc]
  crit: notable

traits:
  - id: software-update-action-text
    desc: Software update action prompt text
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(?i)(download (the )?update|install.{0,12}latest version|update required)'

  - id: latest-version-update-prompt
    desc: Latest version update prompt text
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: update to the latest version
      case_insensitive: true

