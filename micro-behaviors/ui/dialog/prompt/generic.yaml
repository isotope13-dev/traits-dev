defaults:
  crit: notable
  platforms: [windows, unix]
  for: [applescript, shell, python, ruby, javascript]

traits:
  - id: target-owner-consent-prompt
    desc: Prompts for target-owner testing consent
    conf: 0.96
    for: [shell]
    if:
      type: literal
      regex: '(?i)explicit written consent.{0,40}target owner'

  - id: explicit-risk-acceptance-prompt
    desc: Prompts for explicit operation-risk acceptance
    conf: 0.94
    for: [shell]
    if:
      type: literal
      substr: I ACCEPT ALL RISKS

  - id: node-readline-question-call
    desc: Prompts through Node readline.question
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)readline\.question$'

  - id: shell-read-prompt-input
    desc: Shell read with a prompt string
    for: [shell]
    conf: 0.9
    if:
      type: text
      regex: '(?m)^\s*read\s+(-[a-zA-Z]{1,4}\s+){0,3}-p\s'

  - id: press-to-continue
    desc: Prompts the user to continue
    conf: 0.75
    if:
      type: literal
      regex: (?i)press.{0,30}to continue
    not:
      - regex: (?i)press\s+y\s+to\s+continue
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: agent-permission-grant-labels
    desc: Lists agent permission-prompt button labels
    conf: 0.94
    if:
      type: text
      regex: '(?i)["'']always allow["''][^\n]{0,40}["'']allow once["'']'
