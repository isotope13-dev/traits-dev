defaults:
  platforms: [windows, unix]
  for: [applescript, shell, python, ruby, javascript]

traits:
  - id: system-update-message-text
    desc: References system-update user-facing text
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bsystem update (is )?(available|required)|\binstall system update\b'

  - id: node-readline-question-call
    desc: Prompts through Node readline.question
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)readline\.question$'

  - id: press-to-continue
    desc: Prompts the user to continue
    crit: notable
    conf: 0.75
    if:
      type: literal
      regex: (?i)press.{0,30}to continue
    not:
      - regex: (?i)press\s+y\s+to\s+continue
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path

  # Relocated from a legacy UI-manipulation objective. The matcher finds
  # the button vocabulary of an agent permission prompt -- "Always allow" beside
  # "Allow once" -- which is UI text, not intent. The app that *owns* the prompt
  # carries the full set of choices because it renders them: hermes-agent's TUI
  # bundle was flagged `suspicious` for the dialog it presents. The intent lives
  # in the other legs of the composite that consumes this (finding the button in
  # the DOM and clicking it), so it supplies the meaning; this atom only
  # establishes that approval-prompt labels are present.
  - id: agent-permission-grant-labels
    desc: Lists agent permission-prompt button labels
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)["'']always allow["''][^\n]{0,40}["'']allow once["'']'
