defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.97
traits:
  - id: video-activex-install-prompt
    desc: Video prompt requests ActiveX installation
    if:
      type: text
      regex: '(?i)confirm\s*\(["'']Video ActiveX Object Error\.[^\r\n]{1,240}download and install'
  - id: alert-result-branches-call-handlers
    desc: Both alert-result branches call handlers
    if:
      type: text
      regex: 'if\s*\(alert\([^)]{1,200}\)\)\s*\{\s*\w+\(\);\s*}\s*else\s*\{\s*\w+\(\);'
