defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: python-payment-card-input-prompt
    desc: Python input prompts for card details
    if:
      type: symbol
      kind: call
      exact: input
      arg:
        index: 0
        from:
          value: '(?i)\bcard\s*[|/]\s*month\s*[|/]\s*year\s*[|/]\s*cvv\b'
