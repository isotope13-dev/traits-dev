    type: text
    section: .text
    exact: CredUIPromptForWindowsCredentials
- id: managed-credential-buffer-unpack-name
  desc: Managed credential buffer unpacking API
  if:
    type: text
    section: .text
    exact: CredUnPackAuthenticationBuffer
