defaults:
  platforms: [unix]
  crit: notable
traits:
  - id: sudo-authentication-prompt-text
    desc: sudo password prompt or authentication retry
    conf: 0.82
    for: [elf, macho, shell]
    if:
      type: text
      regex: '(\[?sudo\]\s+password|do\]\s+password|sudo: .{0,80}password|Sorry, try again)'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
