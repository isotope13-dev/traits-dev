traits:
- id: paste-then-enter-instruction
  desc: String instructs paste then Enter
  crit: notable
  conf: 0.88
  platforms: [windows]
  # InstallFix/ClickFix delivery scripts are often shipped as .js as well as .html
  for: [html, javascript]
  if:
    # Require one user-facing string to contain the full instruction. Source
    # keywords such as `return` must not complete an unrelated "paste" label.
    type: literal
    kind: string
    # A source map's sourcesContent is one literal holding a whole file, so
    # the gap may not cross an escape, statement or block boundary.
    regex: '(?i:Ctrl\s*(\+|and)\s*V|\bpaste\b)[^\\;{}]{0,120}\b(Enter|Return)\b'
