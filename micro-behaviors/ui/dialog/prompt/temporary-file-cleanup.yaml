defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  - id: temporary-file-removal-alert
    desc: Alert claims removal of temporary files
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\balert\(["''][^"''\r\n]{0,80}removing[^"''\r\n]{0,40}temporary files'
