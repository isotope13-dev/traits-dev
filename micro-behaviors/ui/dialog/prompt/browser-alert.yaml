defaults:
  for: [html, javascript]
  platforms: [windows, unix]
traits:
  - id: browser-window-alert-call
    desc: Calls browser modal alert dialog
    crit: notable
    conf: 0.99
    if:
      type: text
      exclude_html_comments: true
      regex: '(^|[^.\w$])(window\.)?alert\s*\('
  # Scareware confirm(): the dialog text itself claims infection or
  # detected malicious programs, pressing the victim toward the payload.
  # Ordinary confirm() usage (navigation, deletion) has no such claim.
  - id: infection-scare-confirm-call
    desc: Confirm dialog claims infection
    crit: notable
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: 'confirm\([^()\r\n]{0,120}(nfect|alicious programs)'
  - id: virusscan-infection-alert-text
    desc: Alert claims VirusScan detected an infection
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_html_comments: true
      regex: 'alert\([^\r\n]{0,60}VirusScan has detected[^\r\n]{0,60}virus'
  # A timer that calls alert() on every tick freezes the page in a modal.
  - id: interval-alert-dialog
    desc: Repeating timer calls a modal alert
    crit: notable
    conf: 0.94
    if:
      type: text
      exclude_html_comments: true
      regex: 'setInterval\s*\(\s*function\s*\(\s*\)\s*\{\s*alert\s*\('
