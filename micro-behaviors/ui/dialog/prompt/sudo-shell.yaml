defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.95
traits:
  - id: shell-read-sudo-password-prompt
    desc: Shell read displays a sudo password prompt
    if:
      type: symbol
      kind: call
      exact: read
      arg:
        kind: string
        substr: '[sudo] password'
  - id: shell-interactive-password-prompt
    desc: Prompts the operator for a password
    if:
      type: text
      regex: 'whiptail\s+.{0,40}--passwordbox|\bread\s+-[srp]*s\b|systemd-ask-password'
