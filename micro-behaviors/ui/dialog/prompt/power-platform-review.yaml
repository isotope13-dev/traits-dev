traits:
- for:
  - scripts
  - binaries
  id: critical-patch-wording
  desc: Critical patch required or available wording
  if:
    type: text
    regex: (?i)\b(critical|required)\b.{0,50}\b(patch)\b.{0,50}\b(required|available)\b
- for:
  - html
  id: preview-unavailable-wording
  desc: Preview unavailable or display-failure wording
  if:
    type: text
    regex: (?i)preview[^<]{0,120}unavailable|not displayed correctly
defaults:
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.85
