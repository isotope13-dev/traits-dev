defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: html2canvas-document-body
    desc: Renders document body with html2canvas
    crit: notable
    conf: 0.98
    if:
      type: text
      exclude_comments: true
      regex: '\bhtml2canvas\s*\(\s*document\s*\.\s*body\b'
