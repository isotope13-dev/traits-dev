defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
composite_rules:
- id: dotnet-pixel-rgb-resource-api-profile
  desc: Pixel, RGB channel and GetObject API references
  conf: 0.93
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/ui/graphics/image::getpixel-api-name
  - id: metadata/binary/symbols/name/token::dotnet-get-r-member-name
  - id: metadata/binary/symbols/name/token::dotnet-get-g-member-name
  - id: metadata/binary/symbols/name/token::dotnet-get-b-member-name
  - id: metadata/binary/symbols/name/token::dotnet-getobject-member-name
  unless:
  - id: well-known/dual-use/remote-admin/screenconnect/
  - id: well-known/app/ai/browser-agent/botzilla/
  - id: well-known/lib/ui
  - id: well-known/tool/development/lint/ndepend/
  - id: well-known/tool/sysadmin/chocolatey::official-library-pe-context
  - id: metadata/signed/platform/
  - id: well-known/app/utility/picoscope::picoscope-suite-context
- id: dotnet-rgb-byte-array-profile
  desc: Pixel/RGB getters beside CIL byte-array code
  conf: 0.96
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/ui/graphics/image::getpixel-api-name
  - id: metadata/binary/symbols/name/token::dotnet-get-r-member-name
  - id: metadata/binary/symbols/name/token::dotnet-get-g-member-name
  - id: metadata/binary/symbols/name/token::dotnet-get-b-member-name
  - id: metadata/binary/instruction/sequence::cil-three-getters-byte-array-call
