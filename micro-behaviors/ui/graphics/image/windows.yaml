defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
  attack: T1113
  mbc: C0014
composite_rules:
- id: gdi-raster-copy-image-save
  desc: GDI raster copy with GDI+ image saving
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/ui/graphics/draw::gdi-bitblt
  any:
  - id: micro-behaviors/data/encode/image/gdiplus::save-image-to-stream
  - id: micro-behaviors/data/encode/image/gdiplus::save-image-to-file
- id: directx-gdiplus-image-encoding
  desc: DirectX graphics with bitmap PNG encoding
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/hardware/display/render::d3d11-device-swapchain
  - id: micro-behaviors/data/encode/image/gdiplus::create-bitmap-from-hbitmap
  - id: micro-behaviors/data/encode/image/gdiplus::png-encoder-clsid
