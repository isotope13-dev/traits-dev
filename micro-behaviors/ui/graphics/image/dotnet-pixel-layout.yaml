# Pixel operation and layout names establish references, not encoding or
# extraction of a hidden payload. PixelFormat alone is also used by screenshots.
defaults:
  crit: baseline
  platforms:
    - unix
    - windows
  for: [csharp, pe]
traits:
  - id: dotnet-color-toargb-reference
    desc: References .NET Color.ToArgb conversion
    conf: 0.78
    if:
      type: text
      word: ToArgb
    unless:
      - id: metadata/lang/compiled/
      - id: metadata/lang/compiler/systems/
  - id: dotnet-bitmap-setpixel-reference
    desc: References .NET Bitmap.SetPixel write
    conf: 0.8
    if:
      type: text
      word: SetPixel
    unless:
      - id: metadata/lang/compiled/
      - id: metadata/lang/compiler/systems/
  - id: dotnet-bitmap-lockbits-reference
    desc: References .NET Bitmap.LockBits buffer lock
    conf: 0.8
    if:
      type: text
      word: LockBits
    unless:
      - id: metadata/lang/compiled/
      - id: metadata/lang/compiler/systems/
  - id: dotnet-bitmapdata-reference
    desc: References .NET BitmapData descriptor
    conf: 0.8
    if:
      type: text
      word: BitmapData
    unless:
      - id: metadata/lang/compiled/
      - id: metadata/lang/compiler/systems/
  - id: dotnet-scan0-reference
    desc: References .NET Scan0 buffer pointer
    conf: 0.8
    if:
      type: text
      word: Scan0
    unless:
      - id: metadata/lang/compiled/
      - id: metadata/lang/compiler/systems/
  - id: dotnet-stride-reference
    desc: References .NET Stride layout field
    conf: 0.8
    if:
      type: text
      word: Stride
    unless:
      - id: metadata/lang/compiled/
      - id: metadata/lang/compiler/systems/
  - id: dotnet-imagelockmode-reference
    desc: References .NET ImageLockMode flag
    conf: 0.8
    if:
      type: text
      word: ImageLockMode
    unless:
      - id: metadata/lang/compiled/
      - id: metadata/lang/compiler/systems/
  - id: dotnet-pixelformat-reference
    desc: References .NET PixelFormat enum
    conf: 0.8
    if:
      type: text
      word: PixelFormat
    unless:
      - id: metadata/lang/compiled/
      - id: metadata/lang/compiler/systems/
composite_rules:
  - id: dotnet-pixel-operation-references
    desc: .NET pixel operation name references
    conf: 0.8
    any:
      - id: micro-behaviors/ui/graphics/image::getpixel-api-name
      - id: dotnet-color-toargb-reference
      - id: dotnet-bitmap-setpixel-reference
      - id: dotnet-bitmap-lockbits-reference
      - id: dotnet-bitmapdata-reference
  - id: dotnet-pixel-layout-references
    desc: .NET pixel layout name references
    conf: 0.8
    any:
      - id: dotnet-scan0-reference
      - id: dotnet-stride-reference
      - id: dotnet-imagelockmode-reference
      - id: dotnet-pixelformat-reference
  - id: dotnet-pixel-api-references
    desc: .NET pixel operation or layout references
    conf: 0.8
    any:
      - id: dotnet-pixel-operation-references
      - id: dotnet-pixel-layout-references

  - id: pixel-api-or-byte-conversion-references
    for: [scripts, source, binaries]
    platforms: [linux, macos, windows]
    desc: Pixel APIs, layout or byte conversion references
    conf: 0.8
    any:
      - id: dotnet-pixel-api-references
      - id: micro-behaviors/data/encode/image/pixel/
