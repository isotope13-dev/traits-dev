defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: dotnet-pixel-reflection-references
    desc: Pixel API or layout names with reflection references
    crit: notable
    conf: 0.82
    all:
      - id: micro-behaviors/ui/graphics/image::pixel-operation-or-layout-references
    any:
      - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-load-invoke-api-references
      - id: micro-behaviors/metaprogramming/reflection/resolve::dotnet-reflection-or-assembly-load
    unless:
      - id: metadata/binary/layout/size::large-file-1mb
