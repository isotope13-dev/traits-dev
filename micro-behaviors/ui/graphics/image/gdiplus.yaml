defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: gdiplus-create-bitmap-from-stream
    desc: GDI+ bitmap created from stream
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: GdipCreateBitmapFromStream
  - id: gdiplus-get-image-width
    desc: GDI+ query decoded image width
    crit: baseline
    conf: 0.85
    if:
      type: symbol
      exact: GdipGetImageWidth
  - id: gdiplus-get-image-height
    desc: GDI+ query decoded image height
    crit: baseline
    conf: 0.85
    if:
      type: symbol
      exact: GdipGetImageHeight
  - id: gdiplus-bitmap-get-pixel
    desc: GDI+ per-pixel bitmap readback
    crit: notable
    conf: 0.92
    if:
      type: symbol
      exact: GdipBitmapGetPixel
  - id: gdiplus-startup
    desc: GDI+ library initialization
    crit: baseline
    conf: 0.85
    if:
      type: symbol
      exact: GdiplusStartup
composite_rules:
  - id: gdiplus-bitmap-stream-pixel-readback
    desc: GDI+ stream decode with pixel extraction
    crit: notable
    conf: 0.93
    all:
      - id: gdiplus-create-bitmap-from-stream
      - id: gdiplus-get-image-width
      - id: gdiplus-get-image-height
      - id: gdiplus-bitmap-get-pixel
