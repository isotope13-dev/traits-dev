defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Co-occurrence does not bind image bytes to a socket or establish theft.
  - id: image-winsock-host-api-profile
    desc: Image-save, Winsock and host or IP API profile
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/ui/graphics/image::gdi-raster-copy-image-save
      - id: micro-behaviors/communications/socket/connect::winsock-client-symbol-lifecycle
    any:
      - id: micro-behaviors/os/sysinfo/profile::windows-host-profile-api-set
      - id: micro-behaviors/communications/http/ip-discovery::geo-api
      - id: micro-behaviors/communications/ip/literal::external-ipv4-binary
