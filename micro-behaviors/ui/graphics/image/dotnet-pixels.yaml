defaults:
  platforms: [windows, unix]
  for: [pe, dll, csharp]
traits:
  - id: getpixel-api-name
    desc: GetPixel pixel-read API name reference
    crit: notable
    conf: 0.8
    if:
      type: text
      word: GetPixel
  - id: dotnet-color-red-accessor
    desc: .NET color red-channel accessor name
    crit: notable
    conf: 0.8
    if:
      type: hex
      pattern: "67 65 74 5F 52 00"
      section: .text
  # Siblings of the red-channel atom: stego crypters alias the Color
  # channel getters as get_R/get_G/get_B and call all three while
  # decomposing resource pixels. The null terminator keeps framework
  # get_Red/get_Green/get_Blue names out, same as the red atom.
  - id: dotnet-color-green-accessor
    desc: .NET color green-channel accessor name
    crit: notable
    conf: 0.8
    if:
      type: hex
      pattern: "67 65 74 5F 47 00"
      section: .text
  - id: dotnet-color-blue-accessor
    desc: .NET color blue-channel accessor name
    crit: notable
    conf: 0.8
    if:
      type: hex
      pattern: "67 65 74 5F 42 00"
      section: .text
