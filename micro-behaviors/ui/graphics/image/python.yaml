defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.75

traits:
  # A generic screenshot() method can render a browser page, canvas, or other
  # application surface; it does not by itself prove physical screen capture.
  - id: python-screenshot-image-method
    desc: Calls Python screenshot image method
    if:
      type: symbol
      kind: call
      regex: '(^|\.)screenshot$|^screenshot_now$'
