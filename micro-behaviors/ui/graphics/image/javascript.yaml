defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html, text]
  crit: baseline
  conf: 0.9

traits:
  # This is a DOM image operation, not necessarily network activity: the
  # source can be a data: URL or an object URL. HTTP composites add evidence
  # about the assigned value before describing it as a request.
  - id: js-image-src-assignment
    desc: Creates Image and assigns its source
    if:
      type: text
      regex: '(\(new\s+Image\)\.src\s*=|new\s+Image\s*\(\s*\)[\s\S]{0,120}\.src\s*=)'
