defaults:
  platforms: [windows, unix]
  for: [python]

traits:
- id: python-image-getdata
  desc: Reads pixel data with image getdata
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (Image|image|img)\.getdata\s*\(
- id: python-image-getpixel
  desc: Python calls getpixel on an image-named receiver
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (Image|image|img)\.getpixel\s*\(
