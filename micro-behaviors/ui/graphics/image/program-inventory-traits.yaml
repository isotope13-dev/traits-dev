# Display Output Operations
# Console and display-related capabilities
defaults:
  crit: notable
  mbc: C0014
  attack: T1113
  for: [pe, dll]
  platforms: [windows]

composite_rules:
  - id: raw-gdi-bitmap-readback-primitives
    desc: "GDI bitmap readback and scaling APIs"
    conf: 0.96
    for: [pe]
    all:
      - id: micro-behaviors/ui/graphics/image::gdi-getdibits
      - id: micro-behaviors/ui/graphics/image::gdi-create-compatible-bitmap
      - id: micro-behaviors/ui/graphics/draw::gdi-stretchblt
    near_bytes: 8192
