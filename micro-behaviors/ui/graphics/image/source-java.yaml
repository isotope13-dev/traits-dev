defaults:
  platforms: [windows, unix, android]
  for:
    - java
    - class
    - jar
    - zip

composite_rules:
  - id: java-robot-png-output
    desc: "Java Robot with PNG output evidence"
    crit: notable
    conf: 0.9
    mbc: C0014
    attack: T1113
    all:
      - id: micro-behaviors/hardware/input/robot::java-awt-robot-ref
    any:
      - id: micro-behaviors/ui/graphics/image::java-png-write
      - id: micro-behaviors/fs/path/temp::java-temp-png-output-path
