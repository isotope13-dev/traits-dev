# Screenshot capture in source code
# ATT&CK: T1113 (Screen Capture)
defaults:
  attack: T1113
  mbc: C0014

traits:
- id: ps-addtype-bitmap-reference
  desc: "PowerShell loads bitmap or capture APIs"
  crit: notable
  conf: 0.9
  for: [powershell]
  platforms: [windows]
  if:
    type: text
    regex: '(?is)\bAdd-Type\b.{0,400}(Bitmap|CopyFromScreen)'
- id: rust-save-image-error
  desc: "Image save failure string"
  crit: notable
  conf: 0.93
  for: [rust]
  platforms: [windows, unix]
  if:
    type: string_literal
    exact: "Failed to save image!"
- id: rust-capture-frame-error
  desc: Frame capture failure string
  crit: notable
  conf: 0.93
  for: [rust]
  platforms: [windows, unix]
  if:
    type: string_literal
    exact: "Failed to capture frame"
