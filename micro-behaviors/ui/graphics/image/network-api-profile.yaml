defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: gdi-image-save-network-api-profile
  desc: GDI image-saving and HTTP or Telegram references
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/ui/graphics/image::gdi-raster-copy-image-save
  any:
  - id: micro-behaviors/communications/http/post
  - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
  - id: micro-behaviors/communications/http/upload
