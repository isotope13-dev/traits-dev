defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, csharp]

traits:
  - id: dotnet-bitmap-type-token
    desc: .NET Bitmap type reference
    conf: 0.82
    if:
      type: text
      word: System.Drawing.Bitmap

  # Decoded API names establish references, without a payload or evasion claim.
  - id: dotnet-decoded-image-api-reference
    desc: Decoded .NET pixel or color API reference
    conf: 0.88
    if:
      type: encoded
      regex: '(?i)\b(GetPixel|FromArgb|ToArgb|LockBits)\b'

composite_rules:
  - id: dotnet-bitmap-resource-api-references
    for: [pe]
    desc: .NET Bitmap and ResourceManager references co-occur
    conf: 0.9
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: dotnet-bitmap-type-token
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resourcemanager

  - id: dotnet-bitmap-resource-pixel-api-references
    for: [pe]
    desc: .NET bitmap, resource and pixel API references co-occur
    conf: 0.92
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: dotnet-bitmap-type-token
      - id: micro-behaviors/data/embedded/payload/resource::dotnet-resourcemanager
    any:
      # These references do not by themselves bind pixels to resource data.
      - id: micro-behaviors/ui/graphics/image::getpixel-api-name
      - id: micro-behaviors/ui/graphics/image::dotnet-bitmap-lockbits-reference
