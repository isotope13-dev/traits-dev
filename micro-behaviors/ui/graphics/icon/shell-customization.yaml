defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: shell-icon-overlay
    desc: Shell icon overlay API
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: SHGetIconOverlayIndexW
  - id: shell-icon-extract
    desc: Shell icon extract API
    crit: notable
    conf: 0.94
    if:
      type: symbol
      exact: SHDefExtractIconW
composite_rules:
  - id: shell-icon-customization
    desc: Shell object icon customization
    crit: notable
    conf: 0.95
    all:
    - id: micro-behaviors/os/application/shell-namespace::shell-localized-name
    any:
    - id: shell-icon-overlay
    - id: shell-icon-extract
    - id: micro-behaviors/fs/path/construct::shell-unique-name
