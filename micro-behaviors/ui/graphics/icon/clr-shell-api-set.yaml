defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: unsigned-clr-tray-shell-api-set
    desc: Unsigned PE has CLR diagnostic, tray and ShellExecute APIs
    crit: notable
    conf: 0.96
    all:
      - id: metadata/lang/compiler/managed::msvc-clr-dllmain-diagnostic
      - id: micro-behaviors/ui/graphics/icon::shell-notify-icon
      - id: micro-behaviors/process/create/shellexec::shell-execute-call
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      # The stock AutoIt interpreter contains tray and ShellExecute support;
      # those imports do not describe the embedded script's behavior.
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      # The official PhantomJS 2.x Windows build is UPX-packed and statically
      # includes WebKit's mixed-mode UI/runtime support. Its tray and
      # ShellExecute imports are browser-engine capabilities, not persistence.
      - id: well-known/app/browser/phantomjs::phantomjs-official-binary
