defaults:
  platforms: [windows, unix]
  for: [pdf]
  crit: suspicious
  conf: 0.95
  attack: T1203

traits:
  - id: pdf-stream-collab-geticon
    desc: PDF stream calls Collab.getIcon
    if:
      type: value
      path: pdf.streams[*].decoded_text
      substr: Collab.getIcon
  - id: js-collab-geticon-source
    desc: Source code calls the PDF Collab.getIcon API
    for: [ruby, javascript, html, text]
    if:
      type: text
      regex: '(?i)\bCollab\s*\.\s*getIcon\s*\('
