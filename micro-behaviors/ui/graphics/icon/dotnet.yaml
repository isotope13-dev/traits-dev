# Icon manipulation in PE build and customization tooling.
defaults:
  platforms: [windows]
  for: [pe, csharp]
  crit: suspicious
  conf: 0.85

traits:
  - id: icon-injector-class
    desc: IconInjector class (icon replacement)
    crit: notable
    conf: 0.9
    if:
      type: text
      word: IconInjector

  - id: inject-icon-function
    desc: InjectIcon function name (icon injection)
    crit: notable
    conf: 0.9
    if:
      type: text
      word: InjectIcon

  - id: extract-icon-function
    desc: ExtractIcon function name (icon extraction)
    crit: notable
    conf: 0.85
    if:
      type: text
      word: ExtractIcon

  - id: change-icon-class
    desc: ChangeIcon class (icon manipulation)
    crit: notable
    conf: 0.88
    if:
      type: text
      word: ChangeIcon

  # .NET's per-file icon extraction. Worms call it to clone a victim file's
  # icon onto a decoy launcher; icon editors use the same API.
  - id: csharp-icon-extract-associated
    desc: Extracts an associated file icon
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Icon.ExtractAssociatedIcon

  - id: csharp-win32icon-compiler-option
    desc: Win32icon compiler option embeds an icon
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /win32icon
