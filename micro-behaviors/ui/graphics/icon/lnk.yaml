defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable

traits:

  - id: lnk-edge-icon-location
    desc: LNK icon location references Microsoft Edge
    crit: notable
    conf: 0.98
    if:
      type: value
      path: lnk.icon_location
      regex: '(?i)(^|[\\/])msedge\.exe$'

  - id: lnk-notepad-icon-location
    desc: LNK icon location references Notepad
    conf: 0.95
    if:
      type: value
      path: lnk.icon_location
      regex: '(?i)\\notepad\.exe$'

  - id: lnk-chrome-icon-location
    desc: LNK icon location references Google Chrome
    conf: 0.98
    if:
      type: value
      path: lnk.icon_location
      regex: '(?i)(^|[\\/])chrome\.exe$'

  - id: lnk-firefox-icon-location
    desc: LNK icon location references Firefox
    conf: 0.98
    if:
      type: value
      path: lnk.icon_location
      regex: '(?i)(^|[\\/])firefox\.exe$'

  - id: lnk-transcoded-chrome-edge-icon
    desc: Shortcut text references Chrome or Edge icon
    conf: 0.94
    if:
      type: text
      regex: '(?i)(Google\\Chrome|Microsoft\\Edge)\\Application\\(chrome|msedge)\.exe'

  - id: lnk-transcoded-firefox-icon
    desc: Shortcut text references Firefox icon
    conf: 0.94
    if:
      type: text
      regex: '(?i)Mozilla Firefox\\firefox\.exe'

composite_rules:
  - id: lnk-browser-icon
    desc: LNK references a web browser icon
    crit: notable
    conf: 0.95
    any:
      - id: lnk-edge-icon-location
      - id: lnk-chrome-icon-location
      - id: lnk-firefox-icon-location
      - id: lnk-transcoded-chrome-edge-icon
      - id: lnk-transcoded-firefox-icon
