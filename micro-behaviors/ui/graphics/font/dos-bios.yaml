defaults:
  platforms: [windows]
  for: [dos_com, data]
  arch: [x86]
  size_max: 65536

traits:
  - id: bios-load-custom-font-block
    desc: BIOS loads 256 custom character glyphs
    crit: notable
    conf: 0.98
    if:
      type: hex
      offset_range: [0, 1024]
      # ES:BP font data, BH character height, BL font block, CX count,
      # DX first character, and AX=1110h select BIOS user-font loading.
      pattern: 'BD ?? ?? BF ?? ?? 8A 3D B9 00 01 33 D2 32 DB B8 10 11 CD 10 C3'
