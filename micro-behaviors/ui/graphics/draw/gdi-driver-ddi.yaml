# Eng* callbacks are the GDI device-driver interface that user-mode printer
# drivers (DLLs) import from gdi32. Several of them in one
# import table is driver plumbing; outside a driver it is out of place.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: gdi-driver-ddi-import
    desc: Imports three or more GDI driver calls
    crit: notable
    conf: 0.9
    count_min: 3
    if:
      type: symbol
      regex: '^Eng[A-Z][A-Za-z]+$'
