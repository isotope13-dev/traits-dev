defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: gdi-bitmap-transfer-primitives
    desc: Windows GDI bitmap transfer primitives
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/ui/graphics/draw::gdi-bitblt
      - id: micro-behaviors/ui/graphics/draw::gdi-create-compatible-dc
      - id: micro-behaviors/ui/graphics/image::gdi-create-compatible-bitmap
    any:
      - id: micro-behaviors/ui/window/region::get-window-dc
      - id: micro-behaviors/ui/window/probe::get-desktop-window
      - id: micro-behaviors/ui/window/region::get-dc
  - id: gdi-dib-bitmap-transfer-primitives
    desc: GDI DIB bitmap transfer API set
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/ui/graphics/draw::gdi-bitblt
      - id: micro-behaviors/ui/graphics/image::create-dib-section
