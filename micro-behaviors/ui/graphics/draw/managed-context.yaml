defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  - id: dotnet-graphics-gethdc-reference
    desc: Managed Graphics.GetHdc API reference
    conf: 0.99
    if:
      type: import
      exact: System.Drawing.Graphics.GetHdc
  - id: dotnet-graphics-fromhwnd-reference
    desc: Managed Graphics.FromHwnd API reference
    conf: 0.99
    if:
      type: import
      exact: System.Drawing.Graphics.FromHwnd
composite_rules:
  - id: managed-window-dc-member-pair
    desc: Managed window graphics and DC API references
    conf: 0.98
    all:
      - id: dotnet-graphics-fromhwnd-reference
      - id: dotnet-graphics-gethdc-reference
