# Windows Screenshot Capture via GDI + GDI+ Encoding
# Full screenshot pipeline: GDI capture -> GDI+ PNG encode -> exfil
defaults:
  for: [pe, dll]
  platforms: [windows]
  attack: T1113
  mbc: "C0014"

composite_rules:
- id: gdi-raster-copy-gdiplus-init
  desc: "GDI raster copy with GDI+ initialization"
  crit: suspicious
  conf: 0.88
  all:
  - id: micro-behaviors/hardware/display/screen::gdi-bitblt
  - id: micro-behaviors/data/encode/image/gdiplus::startup
  unless:
  - id: metadata/binary/symbols/count::many-exports
  downgrade:
    any:
    - id: metadata/binary/symbols/count::many-imports
    - id: metadata/package/versioning/scheme::pe-version-resource
