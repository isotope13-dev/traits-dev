defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: gdi-desktop-network-delete-api-set
  desc: GDI, desktop, WinSock and deletion API set
  crit: notable
  conf: 0.94
  all:
    - id: micro-behaviors/ui/graphics/draw::gdi-create-compatible-dc
    - id: micro-behaviors/ui/window/probe::get-desktop-window
    - id: micro-behaviors/communications/socket/init::wsa-startup
    - id: micro-behaviors/fs/delete/file/library::deletefile-w
  any:
    - id: micro-behaviors/fs/file/timestamp::set-file-time
    - id: micro-behaviors/os/handler/open::shell-execute
    - id: micro-behaviors/communications/ipc/named-pipe::pipe-path-prefix
  unless:
    - id: metadata/lang/compiler/native::mingw-pseudo-reloc-runtime
