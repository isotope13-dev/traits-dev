# Screenshot capture in source code
# ATT&CK: T1113 (Screen Capture)
defaults:
  platforms: [windows]
  attack: T1113
  mbc: C0014

traits:
- id: bitblt-dllimport
  desc: "BitBlt raster-copy declaration"
  crit: notable
  conf: 0.9
  for: [csharp]
  if:
    type: text
    substr: BitBlt(IntPtr
- id: ps-addtype-drawing-reference
  desc: "PowerShell loads drawing APIs"
  crit: notable
  conf: 0.9
  for: [powershell]
  if:
    type: text
    regex: '(?is)\bAdd-Type\b.{0,400}(System\.Drawing|Graphics)'
- id: ps-addtype-bitblt-reference
  desc: "PowerShell loads raster-copy API"
  crit: notable
  conf: 0.9
  for: [powershell]
  if:
    type: text
    regex: '(?is)\bAdd-Type\b.{0,400}(BitBlt)'
- id: ps-virtual-screen-graphics
  desc: "PowerShell display bounds and graphics"
  crit: notable
  conf: 0.9
  for: [powershell]
  if:
    type: text
    regex: '(?is)(SystemInformation\.VirtualScreen|Screen\.AllScreens).{0,400}(Graphics)'
- id: ps-primary-screen-graphics
  desc: "PowerShell primary-screen graphics APIs"
  crit: notable
  conf: 0.9
  for: [powershell]
  if:
    type: text
    regex: '(?is)(Screen\.PrimaryScreen).{0,400}(CopyFromScreen|BitBlt|Graphics)'
composite_rules:
- id: ps-addtype-drawing-apis
  desc: "PowerShell loads drawing or bitmap APIs"
  crit: component
  conf: 0.9
  for: [powershell]
  any:
  - id: micro-behaviors/ui/graphics/draw::ps-addtype-drawing-reference
  - id: micro-behaviors/ui/graphics/image::ps-addtype-bitmap-reference
  - id: micro-behaviors/ui/graphics/draw::ps-addtype-bitblt-reference
- id: ps-screen-graphics-apis
  desc: "PowerShell screen geometry and graphics APIs"
  crit: component
  conf: 0.9
  for: [powershell]
  any:
  - id: micro-behaviors/hardware/display/screenshot::ps-virtual-screen-pixel-copy
  - id: micro-behaviors/ui/graphics/draw::ps-virtual-screen-graphics
  - id: micro-behaviors/ui/graphics/draw::ps-primary-screen-graphics
