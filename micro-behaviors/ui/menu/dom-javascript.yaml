defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: baseline
  conf: 0.85

traits:
  - id: browser-contextmenu-listener
    desc: Handles DOM context menu event
    if:
      type: text
      substr: document.addEventListener('contextmenu'
    unless:
      - id: well-known/lib/web/mermaid::architecture-fixture
  - id: browser-contextmenu-suppress
    desc: Suppresses DOM context menu
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: "addEventListener\\(\\s*['\"]contextmenu['\"][\\s\\S]{0,400}\\.preventDefault\\s*\\("
    unless:
      - id: well-known/lib/web/mermaid::architecture-fixture
  - id: decoded-contextmenu-false-handler
    desc: Decoded context menu handler returns false
    crit: notable
    conf: 0.95
    if:
      type: encoded
      encoding: url
      regex: 'document\.oncontextmenu\s*=\s*[\w$]+;\s*function\s+[\w$]+\(\)\s*\{\s*return\s+false'
