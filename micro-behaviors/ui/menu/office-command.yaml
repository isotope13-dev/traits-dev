defaults:
  for: [oledoc]
  platforms: [windows]
  crit: notable
traits:
  - id: office-macro-command-reference
    desc: References an Office macro management command
    conf: 0.92
    if:
      type: raw
      regex: '(?i)\b(ToolsMacro|ExtrasMakro|FileTemplates|DateiDokVorlagen|FileMacro)\b[^$]'

  # Word runs a VBA procedure whose name matches a built-in command, so this
  # declaration intercepts the command that opens the VB editor.
  - id: view-vb-code-procedure
    desc: Declares Word ViewVBCode command procedure
    conf: 0.93
    for: [oledoc, ooxml, vbs]
    if:
      type: text
      regex: '(?i)\bSub\s+ViewVBCode\b'
