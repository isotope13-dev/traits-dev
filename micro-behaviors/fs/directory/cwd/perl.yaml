defaults:
  platforms: [unix]
  for: [perl]
traits:
  # Preserve readdir::cwd-call's matcher and scope. A word reference proves
  # neither an API call nor directory enumeration.
  - id: perl-cwd-word-reference
    desc: Perl cwd current-directory word reference
    crit: baseline
    conf: 0.68
    if:
      type: text
      word: cwd
