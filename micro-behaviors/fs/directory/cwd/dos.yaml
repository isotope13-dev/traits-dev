defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  size_max: 65536

traits:
  - id: dos-int21-get-cwd
    desc: DOS queries current directory via INT 21h
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 47 [0-4] (B2 00|32 D2|2A D2) [0-4] (BE ?? ??|8D B6 ?? ??) [0-4] CD 21"
