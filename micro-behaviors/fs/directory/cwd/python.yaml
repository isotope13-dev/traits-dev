defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-os-getcwd
    desc: Calls Python os.getcwd
    if:
      type: symbol
      kind: call
      exact: os.getcwd
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: python-path-cwd
    desc: Gets the current directory with Path.cwd
    if:
      type: symbol
      kind: call
      exact: Path.cwd
