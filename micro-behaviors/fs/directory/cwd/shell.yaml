# Shell working-directory queries. `pwd` is neutral plumbing — the
# `cd "$(dirname "$0")" && pwd` idiom that resolves a script's own directory
# opens most well-behaved shell scripts. Recon composites in objectives/
# reference it alongside the identity and host queries that give it intent.
defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: pwd-command
    desc: Queries the current working directory
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?m)(^|[;&|]\s*)pwd(\s|$)'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
