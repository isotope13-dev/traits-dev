defaults:
  platforms: [unix]
  for: [elf]
  crit: notable
  conf: 0.95

traits:
  - id: getcwd-import
    desc: Imports the C getcwd directory API
    if:
      type: symbol
      kind: import
      exact: getcwd
    # Go binaries may retain a C-library getcwd symbol as an implementation
    # detail of their runtime without exposing a direct C directory query.
    unless:
      - id: metadata/lang/compiler/systems::go-binary
