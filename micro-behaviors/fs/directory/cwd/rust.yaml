defaults:
  platforms: [windows, unix]
  for: [rust]

traits:
  - id: rust-current-directory
    desc: Rust reads current directory
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'std::env::current_dir\s*\('

  - id: rust-set-current-directory
    desc: Rust changes current directory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'std::env::set_current_dir\s*\('

  - id: rust-current-directory-error
    desc: Rust current-directory error text
    crit: baseline
    conf: 0.9
    if:
      type: string_literal
      exact: 'Failed to get current directory: '

  - id: rust-set-current-directory-error
    desc: Rust change-directory error text
    crit: baseline
    conf: 0.9
    if:
      type: string_literal
      exact: 'Failed to change directory: '
