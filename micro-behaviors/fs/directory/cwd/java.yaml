# A bare `pwd` string constant in a class file: evidence that the code shells
# out to read the working directory, but too weak to stand alone, which is why
# the discovery composites in objectives/ combine it with the other host queries.
defaults:
  platforms: [unix]
  for: [class, jar, zip]

traits:
  - id: jvm-pwd-command-literal
    desc: JVM pwd command literal
    crit: component
    conf: 0.9
    if:
      type: value
      path: class.strings[*]
      exact: pwd
