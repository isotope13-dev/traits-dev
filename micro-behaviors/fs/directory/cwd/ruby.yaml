defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  - id: ruby-dir-chdir
    desc: Ruby changes the working directory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bDir\.chdir\s*\('

  - id: ruby-dir-pwd-call
    desc: Queries the Ruby working directory
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: Dir.pwd
