# Meterpreter getlwd queries the operator's LOCAL working directory. It is not
# the target-side getwd command and does not enumerate a victim's files.
defaults:
  platforms: [unix, windows]
  for: [scripts, text]
  crit: notable
  conf: 0.95

traits:
  - id: getlwd-console-command-line
    desc: Local working-directory console command line
    if:
      type: text
      regex: '(?m)^[ \t]*getlwd[ \t]*\r?$'
