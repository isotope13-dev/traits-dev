defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: node-readdir-async-call
    desc: Calls Node.js asynchronous directory enumeration
    crit: notable
    conf: 0.84
    if:
      type: symbol
      kind: call
      # Covers destructured `const { readdir } = require('fs')` as well as
      # the ordinary fs.readdir form; API use alone is only a capability.
      regex: '^(readdir|[\w$]{0,24}fs[\w$]{0,8}(\.default)?\.readdir)$'
  - id: node-readdir-dynamic-name
    desc: Node readdir name in a string table
    crit: notable
    conf: 0.86
    if:
      type: string_literal
      exact: readdir
  - id: node-readfile-dynamic-name
    desc: Node readFile name in a string table
    crit: notable
    conf: 0.86
    if:
      type: string_literal
      exact: readFile
