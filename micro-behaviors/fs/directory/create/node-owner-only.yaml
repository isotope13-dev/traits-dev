defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-mkdir-owner-only-mode
    desc: Node mkdir requests owner-only 0700 mode
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: [(identifier) @mkdir
                     (member_expression property: (property_identifier) @mkdir)]
          arguments: (arguments . (_) . (object
            (pair key: [(property_identifier) @key
                        (string (string_fragment) @key)] value: (number) @mode))))
          (#match? @mkdir "^(mkdir|mkdirSync)$")
          (#eq? @key "mode")
          (#match? @mode "^(0[oO]?700|448|0[xX]1[cC]0)$")) @create
