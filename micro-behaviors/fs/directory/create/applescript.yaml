# The quoted command prefix and concatenated operand establish construction
# of a mkdir command, without asserting that an arbitrary mkdir word runs.
defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  crit: notable
traits:
  - id: applescript-shell-mkdir-parent
    desc: AppleScript builds mkdir with parent creation
    conf: 0.95
    if:
      type: text
      regex: '(?m)(^|& ")[ \t]*do shell script \\?"mkdir -p \\?"\s*&\s*\w+'
