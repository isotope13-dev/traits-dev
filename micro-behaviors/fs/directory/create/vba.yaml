# Reviewed observation: no attacker intent is inferred by this matcher.
defaults:
  for:
  - vbs
  platforms:
  - windows
  crit: notable
  conf: 0.85
traits:
- id: vb-mkdir-statement
  desc: VB MkDir directory creation statement
  crit: notable
  if:
    type: text
    regex: '(?im)^[ \t]*MkDir[ \t]+[^\r\n]{1,240}'
