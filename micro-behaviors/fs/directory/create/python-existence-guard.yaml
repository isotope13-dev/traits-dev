# Bind the existence test to the created path. This is ordinary directory
# preparation, including in benign caches; it establishes no persistence.
defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-create-missing-directory
    desc: Creates a directory after testing its absence
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((if_statement
          condition: (not_operator argument: (call
            function: (attribute) @exists
            arguments: (argument_list . (_) @checked .)))
          consequence: (block
            (expression_statement (call
              function: (attribute) @makedirs
              arguments: (argument_list . (_) @created (_)*))))) @creation
          (#eq? @exists "os.path.exists")
          (#eq? @makedirs "os.makedirs")
          (#eq? @checked @created))
