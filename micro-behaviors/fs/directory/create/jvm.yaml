defaults:
  for: [class]
  platforms: [unix, windows]
traits:
  - id: jvm-file-mkdir-reference
    desc: JVM File.mkdir directory-creation reference
    crit: notable
    conf: 0.99
    if:
      type: import
      exact: java/io/File.mkdir
  - id: jvm-file-mkdirs-reference
    desc: JVM File.mkdirs parent-directory creation
    crit: notable
    conf: 0.99
    if:
      type: import
      exact: java/io/File.mkdirs
