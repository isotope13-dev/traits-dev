defaults:
  conf: 0.9
  platforms: [unix, windows]
  for: [go]
traits:
  - id: os-mkdirall
    desc: Creates a directory tree with Go os.MkdirAll
    crit: notable
    if:
      type: symbol
      exact: os.MkdirAll
  - id: os-mkdir
    desc: Create directory via os.Mkdir
    crit: baseline
    if:
      type: symbol
      exact: os.Mkdir
  - id: go-os-mkdirall-text
    desc: Go os.MkdirAll symbol text
    crit: notable
    conf: 0.92
    for: [pe, elf, macho]
    if:
      type: text
      exact: os.MkdirAll
composite_rules:
  - id: go-mkdirall-any
    desc: Go recursive directory creation
    crit: notable
    conf: 0.9
    for: [go, pe, elf, macho]
    any:
      - id: os-mkdirall
      - id: go-os-mkdirall-text
