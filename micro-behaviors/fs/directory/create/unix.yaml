defaults:
  crit: baseline
  conf: 0.66
  platforms: [linux, macos]
  for: [elf, macho, c]
traits:
  - id: mkdir-base
    desc: Create directories
    if:
      type: symbol
      exact: mkdir
  - id: mkdirat
    desc: Create directories
    if:
      type: symbol
      exact: mkdirat
composite_rules:
  - id: mkdir
    desc: Create directories
    any:
      - id: mkdir-base
      - id: mkdirat
