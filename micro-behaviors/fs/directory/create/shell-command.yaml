defaults:
  platforms: [unix, windows]
  for: [shell, markdown, json, yaml]
traits:
  - id: batch-repeated-md
    desc: Batch source repeats directory creation
    crit: notable
    conf: 0.92
    for: [batch, static-lib]
    count_min: 20
    unless:
      # This is a derived view of a source batch file. The source itself is
      # scanned and carries the complete context and repeated commands.
      - type: basename
        regex: '(?i)##batch-expansion@\d+$'
    if:
      type: text
      regex: '(?im)^md \S'

  - id: mkdir-parent-absolute-path-command
    desc: mkdir -p command names an absolute directory
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)(^|[;&|`"\x27])\s*mkdir\s+-p\s+/[A-Za-z0-9_./-]+'
