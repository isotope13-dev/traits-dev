defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
- id: dos-mkdir-mutated-path-loop
  desc: Repeated DOS mkdir attempts mutate path bytes
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule dos_mkdir_mutated_path_loop {\n strings:\n  $loop = { B9 ?? ?? 51 B4 39 BA ?? ?? CD 21 BE ?? ??\
      \ FE 04 59 E2 ?? }\n  $path = /[A-Za-z]:\\\\[^\\x00\\r\\n]{1,100}\\x00/\n condition:\n  #loop > 0 and #loop\
      \ <= 32 and #path <= 32 and\n  for any l in (1..#loop) : (\n   uint16(@loop[l]+1) > 1 and uint16(@loop[l]+1)\
      \ <= 4096 and\n   @loop[l]+19+int8(@loop[l]+18) == @loop[l]+3 and\n   for any p in (1..#path) : (\n    (@path[p]\
      \ == uint16(@loop[l]+7) or @path[p]+256 == uint16(@loop[l]+7)) and\n    uint16(@loop[l]+12) >= uint16(@loop[l]+7)+3\
      \ and\n    uint16(@loop[l]+12) < uint16(@loop[l]+7)+!path[p]-1\n   )\n  )\n}"
