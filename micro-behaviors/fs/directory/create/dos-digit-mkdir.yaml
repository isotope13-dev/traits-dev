# AH=39h creates the directory named at DS:DX. The digit walker and the
# CX countdown are separate; a disk-fill composite joins them. YARA so a
# short COM image is still scanned.
defaults:
  for:
  - dos_com
  - data
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
  - id: dos-int21-mkdir-imm-dx
    desc: DOS creates a directory by name
    crit: notable
    conf: 0.9
    if:
      type: yara
      source: |
        rule dos_int21_mkdir_imm_dx {
          meta:
            filetypes = "dos_com,data"
          strings:
            $mk = { B4 39 BA ?? ?? CD 21 }
          condition:
            $mk
        }

  # INC the indexed byte, and if it passes '9' store '0' and step back.
  - id: dos-ascii-digit-carry
    desc: Increments an ASCII digit with carry
    crit: notable
    conf: 0.92
    if:
      type: yara
      source: |
        rule dos_ascii_digit_carry {
          meta:
            filetypes = "dos_com,data"
          strings:
            $dig = { FE 01 80 39 39 76 ?? C6 01 30 4B 75 ?? }
          condition:
            $dig
        }

  # POP the remaining count, stop at zero, otherwise decrement and jump back.
  - id: dos-cx-countdown-restart
    desc: Counts down CX and jumps back
    crit: notable
    conf: 0.9
    if:
      type: yara
      source: |
        rule dos_cx_countdown_restart {
          meta:
            filetypes = "dos_com,data"
          strings:
            $cx = { 59 83 F9 00 74 ?? 49 51 EB ?? }
          condition:
            $cx
        }
