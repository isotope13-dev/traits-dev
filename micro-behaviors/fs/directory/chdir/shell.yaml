defaults:
  crit: notable
  platforms: [unix, android]
  for: [elf, shell, c, cpp]
traits:
  - id: shell-change-directory
    desc: Shell changes working directory
    conf: 0.95
    platforms: [unix]
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: cd
    unless:
      - id: well-known/tool/development/build/gradle-wrapper/
    downgrade:
      any:
        # Entering an extracted source directory is routine in PKGBUILD.
        - id: metadata/file/string/identity::pkgbuild-basename
  - id: shell-change-filesystem-root
    desc: Shell changes to filesystem root
    conf: 0.98
    platforms: [unix]
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: cd
      arg:
        index: 0
        kind: identifier
        name: /
  - id: tmpdir-change-directory
    desc: Shell changes into temporary directory
    conf: 0.9
    platforms: [unix]
    for: [shell]
    if:
      type: text
      regex: '\bcd\s+\$TMPDIR\b'
  - id: shell-cd-slash-tmp
    desc: Shell changes into /tmp
    conf: 0.9
    platforms: [unix]
    for: [shell]
    if:
      type: text
      regex: '(?m)^\s*cd\s+/tmp\b'
  # IoT loaders try /tmp, then /var/run, before fetching a payload.
  - id: shell-cd-tmp-or-var-run
    desc: Falls back from /tmp to /var/run
    conf: 0.92
    platforms: [unix]
    for: [shell]
    if:
      type: text
      regex: 'cd\s+/tmp\s*\|\|\s*cd\s+/var/run\b'
  - id: android-local-tmp-cd
    desc: Android local tmp staging
    conf: 0.9
    if:
      type: text
      substr: cd /data/local/tmp/
