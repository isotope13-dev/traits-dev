# Parent navigation is a directory-change capability, even in a lifecycle hook.
# Preserve reviewed matchers and exclusions; navigation alone is not compromise.
defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: npm-preinstall-parent-directory
    desc: preinstall declares parent-directory navigation
    crit: notable
    conf: 0.93
    unless:
      - id: metadata/package/publishing::is-private
      - id: metadata/package/dependencies/source::npm-local-dependencies
    if:
      type: value
      path: scripts.preinstall
      # npm starts a lifecycle hook in the package directory under node_modules.
      # Two or more parent segments can reach the consumer project; `cd ../`
      # after first entering a package-owned subdirectory can just move between
      # this repository's workspaces.
      regex: '^\s*(cd|pushd)\s+["'']?(\.\.[/\\]){2,}'

  - id: npm-install-parent-directory
    desc: Install declares parent-directory navigation
    crit: notable
    conf: 0.93
    unless:
      - id: metadata/package/publishing::is-private
      - id: metadata/package/dependencies/source::npm-local-dependencies
    if:
      type: value
      path: scripts.install
      regex: '^\s*(cd|pushd)\s+["'']?(\.\.[/\\]){2,}'

  - id: npm-postinstall-parent-directory
    desc: postinstall declares parent-directory navigation
    crit: notable
    conf: 0.93
    # Multi-root VS Code extensions commonly install their client and server
    # subprojects in sequence (`cd client ... cd ../server`). The parent
    # segment returns from one child to the extension root; it does not cross
    # the package boundary.
    unless:
      - id: metadata/package/runtime::vscode-workspace-install-extension
      - id: micro-behaviors/os/package-manager/hook-install::postinstall-nested-subdir-bare-install
      - id: metadata/package/publishing::is-private
      - id: metadata/package/dependencies/source::npm-local-dependencies
    if:
      type: value
      path: scripts.postinstall
      regex: '^\s*(cd|pushd)\s+["'']?(\.\.[/\\]){2,}'
