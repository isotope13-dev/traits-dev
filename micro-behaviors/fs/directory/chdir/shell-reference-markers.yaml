defaults:
  platforms: [unix]
  for: [shell]
traits:
- id: temp-dir-fallback-chain
  desc: Shell directory-change fallback chain
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: 'cd /tmp || cd /var/run || cd /dev/shm'
- id: writable-dir-fallback-chain
  desc: Shell directory-change fallback chain
  crit: notable
  conf: 0.95
  count_min: 3
  if:
    type: text
    substr: 'cd /tmp || cd /var/run || cd /mnt || cd /root || cd /'
- id: writable-dir-fallback-exact-chain
  desc: Shell directory-change fallback chain
  crit: notable
  conf: 0.95
  if:
    type: text
    substr: 'cd /tmp || cd /var/run || cd /mnt || cd /root || cd /'
# Same Mirai prologue with the final `cd /` omitted. One copy shows up in
# writeups; repeating it is the dropper stub.
- id: writable-dir-fallback-short-chain
  desc: Shell directory-change fallback chain
  crit: notable
  conf: 0.93
  count_min: 3
  if:
    type: text
    substr: 'cd /tmp || cd /var/run || cd /mnt || cd /root'
# Mirai-family bash droppers often set the SUID bit (`chmod +s *`) instead of
# `+x` before `./payload`. Mirror the +x wildcard atom so setuid staging is
# visible as its own capability rather than slipping past +x-only composites.
