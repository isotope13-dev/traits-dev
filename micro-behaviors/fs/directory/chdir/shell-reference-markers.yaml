defaults:
  platforms: [unix]
  for: [shell]
traits:
# Any three-step `cd /a || cd /b || cd /c` chain: IoT droppers reorder the
# writable candidates (/tmp, /var/run, /dev/shm, /mnt, /root) per campaign,
# so the regex subsumes the classic Mirai prologue literals.
- id: writable-dir-fallback-any-chain
  desc: Three-step absolute cd fallback chain
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'cd /[\w./-]{0,40}\s{0,4}\|\|\s{0,4}cd /[\w./-]{0,40}\s{0,4}\|\|\s{0,4}cd /'
# One copy shows up in writeups; repeating it per payload is the dropper stub.
- id: writable-dir-fallback-chain
  desc: Repeated three-step cd fallback chain
  crit: notable
  conf: 0.95
  count_min: 3
  if:
    type: text
    regex: 'cd /[\w./-]{0,40}\s{0,4}\|\|\s{0,4}cd /[\w./-]{0,40}\s{0,4}\|\|\s{0,4}cd /'
# Mirai-family bash droppers often set the SUID bit (`chmod +s *`) instead of
# `+x` before `./payload`. Mirror the +x wildcard atom so setuid staging is
# visible as its own capability rather than slipping past +x-only composites.
