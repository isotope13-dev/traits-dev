# A command in prepare can navigate to sibling source-repository tooling.
# This establishes a directory-change command, not consumer-project rewriting
# or supply-chain compromise. Preserve the original matcher and exclusions;
# the dependency-injection objective separately requires a package install.
defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: npm-prepare-parent-directory
    desc: Prepare declares parent-directory navigation
    crit: notable
    conf: 0.93
    unless:
      - id: metadata/package/publishing::is-private
      - id: metadata/package/dependencies/source::npm-local-dependencies
      # Retain the existing bounded Husky setup exclusion. Additional commands
      # and shell expansions must still retain the navigation observation.
      - type: value
        path: scripts.prepare
        regex: '^(cd|pushd) +["'']?\.\.([/\\]\.\.)*["'']? *&& *(npx +)?husky( +install( +\S+)?)?$'
        not:
          - regex: '[;|`$<>%!\r\n]|&&.*&'
    if:
      type: value
      path: scripts.prepare
      regex: '(^|[;&|]\s*)(cd|pushd)\s+["'']?\.\.[/\\]'
