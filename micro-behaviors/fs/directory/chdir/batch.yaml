# Batch navigation into the OS directory (`cd windows` after climbing to the
# drive root): the setup step of the era's destruction trojans, which then
# delete or overwrite the executables living there. Alone it is just
# navigation; composites pair it with what happens next.
defaults:
  platforms: [windows]
  for: [batch, text]

traits:
  # A Windows launcher commonly stores its configured temp path and enters it
  # immediately before pruning temporary files. The destination is still a
  # meaningful cwd change, while an objective can use it as cleanup context.
  - id: batch-enters-configured-temp-directory
    desc: Batch enters a configured temp directory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)set TMP_DIR=%[A-Z_]+%\\(tmp|temp)\s*\r?\ncd "%TMP_DIR%"'
  - id: batch-cd-windows-directory
    desc: Batch changes into the Windows directory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^\s*cd\s+(c:)?\\?(windows|winnt)\b'
