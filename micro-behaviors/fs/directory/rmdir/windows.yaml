defaults:
  crit: baseline
  conf: 0.7
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: remove-directory-a
    desc: Remove directory (ANSI)
    if:
      type: symbol
      exact: RemoveDirectoryA
  - id: remove-directory-w
    desc: Remove directory (Unicode)
    if:
      type: symbol
      exact: RemoveDirectoryW
