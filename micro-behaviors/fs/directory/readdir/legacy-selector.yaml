defaults:
  platforms: [windows, unix, macos, linux]
  for: [scripts, binaries, class, java_class]

composite_rules:
  - id: directory-listing-evidence
    desc: Directory enumeration API or syntax evidence
    crit: baseline
    conf: 0.9
    any:
      - id: micro-behaviors/fs/enumerate/directory/
      - id: crt-findfirst
      - id: crt-findnext
      - id: find-next-file
      - id: find-first-file
      - id: find-next-file-a
      - id: find-first-file-a
      - id: find-first-file-ex
      - id: find-close
      - id: find-first-file-source
      - id: find-next-file-source
      - id: find-close-source
      - id: find-first-file-undecorated-source
      - id: find-next-file-undecorated-source
      - id: lnk-glob-pattern-source
      - id: python-json-glob
      - id: powershell-fullname-collection
      - id: micro-behaviors/fs/directory/traverse::powershell-recursive-file-enumeration
      - id: mfc-cfilefind-init
      - id: mfc-find-file
      - id: mfc-find-next-file
      - id: mfc-get-file-path
      - id: mfc-is-dots
      - id: find-file-walker
      - id: find-file-walker-wide
      - id: find-file-walker-wide-ex
      - id: find-file-walker-any-variant
      - id: find-file-source-walker
      - id: mfc-cfilefind-enumeration
      - id: find-file-undecorated-source-walker
      - id: file-enumeration-with-access
