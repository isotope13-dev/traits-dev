defaults:
  platforms:
  - windows
  for:
  - pe

traits:
  - id: findfirst
    desc: Starts a CRT directory listing
    crit: notable
    conf: 0.8
    if:
      type: symbol
      regex: '^_?findfirst(64)?$'
  - id: findnext
    desc: Advances a CRT directory listing
    crit: notable
    conf: 0.8
    if:
      type: symbol
      regex: '^_?findnext(64)?$'
