defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: x86-linked-directory-result-compaction
    desc: x86 linked directory-result buffer compaction
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .text
      # Remaining bytes = total - current offset - NextEntryOffset;
      # move the subsequent records over the current one.
      pattern: '8B CE 2B 4D 1C 8B 16 8B 45 20 2B C2 2B C1 50 03 D6 52 56 E8 ?? ?? ?? ?? 83 C4 0C'
  - id: x86-linked-directory-result-compaction-register-layout
    desc: Linked directory-result removal register layout
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: text
      pattern: '8B 06 8B 4D ?? 2B C8 2B CE 03 4D ?? 03 C6 51 50 56 E8 [4] 83 C4 0C'
