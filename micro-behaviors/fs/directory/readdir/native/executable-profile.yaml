defaults:
  platforms: [windows]
  for: [c, text]


composite_rules:
  - id: findfirst-executable-mask-profile
    desc: FindFirstFile reference beside executable wildcard
    crit: notable
    conf: 0.94
    for: [c]
    near_bytes: 200
    all:
      - id: metadata/lang/source/literal/string::executable-wildcard-text
      - id: micro-behaviors/fs/directory/readdir/native::find-first-file-source
    unless:
      - id: well-known/app/media/obs-studio
