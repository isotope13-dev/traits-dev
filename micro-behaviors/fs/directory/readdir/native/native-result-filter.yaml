# Native directory results use several FILE_INFORMATION_CLASS layouts with
# NextEntryOffset chains. After a successful query, this routine accepts the
# directory layouts (1, 2, 3, 12, 37, 38), selects a record, and moves the
# remaining buffer over it. Jump-table addresses, branch targets and the copy
# target are deliberately variable; the filename predicate is outside the
# pattern. Filtering a local result buffer alone need not imply concealment.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-native-directory-result-compaction
    desc: Compacts native directory-query results
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: 'FF 15 ?? ?? ?? ?? 44 8B E0 85 C0 0F 88 ?? ?? ?? ?? 83 FB 26 0F 87 ?? ?? ?? ?? 48 B8 0E 10 00 00 60 00 00 00 48 0F A3 D8 0F 83 ?? ?? ?? ?? [0-512] 8B 17 8B C2 85 D2 0F 84 ?? ?? ?? ?? 48 63 C6 44 8B CF 45 2B CF 0F B6 84 03 ?? ?? ?? ?? 8B 8C 83 ?? ?? ?? ?? 48 03 CB FF E1 8B C2 EB ?? 33 C0 45 8B C5 44 2B C0 48 63 C6 45 2B C1 0F B6 84 03 ?? ?? ?? ?? 8B 8C 83 ?? ?? ?? ?? 48 03 CB FF E1 33 D2 48 03 D7 48 8B CF E8 ?? ?? ?? ??'
