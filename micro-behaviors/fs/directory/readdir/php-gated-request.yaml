defaults:
  for: [php]
  platforms: [unix, windows]
composite_rules:
  - id: php-ip-restricted-request-directory-list
    desc: IP-restricted PHP page lists request-selected directory
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/request/cgi::ip-allowlist-remote-addr-gate
      - id: micro-behaviors/fs/directory/readdir::php-opendir
      - id: micro-behaviors/communications/http/request/superglobal::get-dup
