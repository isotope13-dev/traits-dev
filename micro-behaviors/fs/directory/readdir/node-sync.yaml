defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: node-readdir-sync-call
    desc: Calls Node.js synchronous directory enumeration
    crit: notable
    conf: 0.84
    if:
      type: symbol
      kind: call
      # Parsed call targets tolerate multiline member access and exclude
      # comments and quoted examples; retain common bundled fs aliases.
      regex: '^[\w$]{0,24}fs[\w$]{0,8}(\.default)?\.readdirSync$'
  - id: node-readdir-stat-collect
    desc: Lists and stats entries before collecting them
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bfs[\w$]{0,3}\.readdirSync[\s\S]{0,300}\.statSync[\s\S]{0,300}\w+\.push'
