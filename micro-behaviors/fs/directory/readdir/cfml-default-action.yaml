defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.95
traits:
  - id: cfdirectory-default-list
    desc: Directory tag uses default list action
    if:
      type: symbol
      kind: call
      exact: cfdirectory
      args:
        - index: 0
          from: {field: directory, field_exists: true}
        - index: 0
          from: {field: action, field_absent: true}
        - index: 0
          from: {field: attributecollection, field_absent: true}
