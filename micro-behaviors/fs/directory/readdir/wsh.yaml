# Directory Listing - Windows Script Host (FileSystemObject)
# ATT&CK: T1083 (File and Directory Discovery)
defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
  crit: notable
  conf: 0.88
  attack: T1083

traits:
  - id: fso-getfolder
    desc: FileSystemObject retrieves folder object
    crit: baseline
    conf: 0.85
    if:
      type: text
      regex: '(?i)\.GetFolder\s*\('

  - id: fso-folder-files
    desc: Access folder files via FileSystemObject
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\.GetFolder\s*\([^\r\n]{0,120}\)\.Files\b'

  - id: wsh-for-each-files
    desc: For Each loop iterates folder files
    crit: notable
    conf: 0.88
    for: [vbs, html]
    if:
      type: text
      regex: '(?i)\bFor\s+Each\s+[^\r\n]{0,40}\bin\s+[^\r\n]{0,80}\.Files\b'

  - id: js-enumerator-folder-files
    desc: Enumerator iterates a folder Files collection
    crit: notable
    conf: 0.96
    for: [html, javascript]
    if:
      type: text
      regex: '(?i)new\s+Enumerator\s*\(\s*\w+\.files\s*\)'

composite_rules:
  - id: wsh-folder-files-enumeration
    desc: WSH enumerates files in folder
    crit: notable
    conf: 0.9
    any:
      - id: fso-folder-files
      - id: wsh-for-each-files
      - id: js-enumerator-folder-files
