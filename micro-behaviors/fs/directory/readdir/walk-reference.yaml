defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell]

composite_rules:
  - id: directory-listing-or-recursive-walk
    desc: Directory read API or recursive walk reference
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/fs/directory/readdir::node-readdir-sync-call
      - id: micro-behaviors/fs/directory/traverse::python-walk-or-shell-find
