# Reusable "the program lists or walks directories" legs for composites that
# need that capability in an all: clause. Each is an any: over readdir and
# traverse observations, so it is a component: the observations themselves
# are what the report shows.
defaults:
  platforms: [windows, unix, android]

composite_rules:
  - id: listing-or-traversal
    desc: Lists or walks directories
    crit: component
    conf: 0.86
    any:
      - id: micro-behaviors/fs/directory/traverse::relative-find-command-text
      - id: micro-behaviors/fs/search/command::python-walk-or-shell-find
      - id: micro-behaviors/fs/directory/readdir/language::node-readdir-sync-call
      - id: micro-behaviors/fs/directory/readdir/profile::node-dirent-directory-walk
      - id: micro-behaviors/fs/directory/traverse::filepath-walk
      - id: micro-behaviors/fs/directory/traverse::traverse-walk
      - id: micro-behaviors/fs/directory/traverse::finddepth-walker
      - id: micro-behaviors/fs/directory/traverse::recursive-walk
      - id: micro-behaviors/fs/directory/traverse::cpp-recursive-directory-iterator
      - id: micro-behaviors/fs/directory/traverse::cpp-recursive-directory-iterator-source
      - id: micro-behaviors/fs/directory/traverse::cpp-recursive-copy-scaffold
      - id: micro-behaviors/fs/directory/traverse::traverse-fts
      - id: micro-behaviors/fs/directory/traverse::nftw
      - id: micro-behaviors/fs/directory/traverse::ftw
      - id: micro-behaviors/fs/directory/traverse::rust-recursive-search
      - id: micro-behaviors/fs/directory/traverse::java-listfiles-directory-descent
      - id: micro-behaviors/fs/directory/readdir/native::findfirst
      - id: micro-behaviors/fs/directory/readdir/native::findnext
      - id: micro-behaviors/fs/directory/traverse::traverse-rglob-call
  - id: native-or-source-listing
    desc: Lists directories natively or in source
    crit: component
    conf: 0.86
    for: [binaries, source, python]
    any:
      - id: listing-or-traversal
      - id: micro-behaviors/fs/directory/readdir/native::readdir-opendir
      - id: micro-behaviors/fs/directory/readdir/native::readdir-readdir
      - id: micro-behaviors/fs/directory/readdir/native::readdir-readdir64
      - id: micro-behaviors/fs/directory/readdir/language::getdents-syscall
      - id: micro-behaviors/fs/directory/readdir/language::readdir-python
      - id: micro-behaviors/fs/directory/readdir/language::readdir-go
      - id: micro-behaviors/fs/directory/traverse::rust-walkdir-capability
  - id: rust-listing-or-walk
    desc: Rust directory listing or walk
    crit: component
    platforms: [windows, unix]
    attack: T1083
    conf: 0.92
    for: [rust, binaries]
    any:
      - id: micro-behaviors/fs/directory/traverse::rust-walkdir-capability
      - id: micro-behaviors/fs/directory/readdir/language::rust-read-dir
