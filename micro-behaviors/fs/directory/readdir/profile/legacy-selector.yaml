defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, class, java_class]

composite_rules:
  - id: directory-listing-evidence
    desc: Directory enumeration API or syntax evidence
    crit: baseline
    conf: 0.9
    any:
      - id: micro-behaviors/fs/directory/readdir/native/
      - id: micro-behaviors/fs/directory/readdir/command/
      - id: micro-behaviors/fs/directory/readdir/language/
      - id: micro-behaviors/fs/directory/readdir/target/
      # Content filters such as `grep -v` do not enumerate directories.
      - id: micro-behaviors/fs/directory/readdir/profile::listing-or-traversal
      - id: micro-behaviors/fs/directory/readdir/descriptor::jvm-file-filter-array-descriptor
      - id: micro-behaviors/fs/path/glob::lnk-glob-pattern-source
      - id: micro-behaviors/fs/directory/traverse::powershell-recursive-file-enumeration
