defaults:
  platforms: [windows, unix, macos, linux]
  for: [scripts, binaries, class, java_class]

composite_rules:
  - id: directory-listing-evidence
    desc: Directory enumeration API or syntax evidence
    crit: baseline
    conf: 0.9
    any:
      - id: micro-behaviors/fs/directory/readdir/native/
      - id: micro-behaviors/fs/directory/readdir/command/
      - id: micro-behaviors/fs/directory/readdir/language/
      - id: micro-behaviors/fs/search/
      - id: metadata/binary/symbols/descriptor::jvm-file-filter-array-descriptor
      - id: metadata/lang/source/literal/value::lnk-glob-pattern-source
      - id: micro-behaviors/fs/directory/traverse::powershell-recursive-file-enumeration
