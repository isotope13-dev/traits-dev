defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: node-readdir-repeated
    desc: Calls Node.js readdir at least twice
    crit: notable
    conf: 0.6
    unless:
      - type: basename
        exact: post-install.js
    if:
      type: text
      regex: '\b[\w$]{0,24}fs[\w$]{0,8}(\.default)?\.readdir(Sync)?\s*\('
    count_min: 2
    not:
      - substr: self.fs.readdir(abs, readdirCb(this, abs, cb))
      - substr: const pluginNames = yield fs.readdir(pluginDir);
      - substr: var files = fs.readdirSync(dir);
      - substr: files = fs.readdirSync(folder);
      - substr: const versionFolder = fs.readdirSync(CONPTY_DIR)[0];

composite_rules:
  - id: directory-enumeration-with-node-listing
    desc: Directory enumeration API or Node listing evidence
    # Preserve baseline API-reference evidence from the legacy selector.
    # Actual repeated Node listing remains independently notable above.
    crit: baseline
    conf: 0.6
    for: [javascript, python, powershell, perl, pe]
    any:
      - id: micro-behaviors/fs/enumerate/directory/
      - id: node-readdir-sync-call
      - id: node-readdir-stat-collect
      - id: node-readdir-repeated
