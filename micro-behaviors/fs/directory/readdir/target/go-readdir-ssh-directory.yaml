defaults:
  platforms: ["unix", "windows"]
  for: ["go", "binaries"]
traits:
  - id: go-readdir-ssh-directory
    desc: Go enumerates a user SSH directory
    crit: notable
    conf: 0.9
    for: [go]
    platforms: [unix]
    attack: T1083
    if:
      type: symbol
      kind: call
      exact: os.ReadDir
      arg:
        kind: identifier
        name: sshDir
