defaults:
  platforms: ["unix", "windows"]
  for: ["go", "binaries"]
traits:
  - id: go-readdir-var-log
    desc: Go enumerates the system log directory
    crit: notable
    conf: 0.9
    for: [go]
    platforms: [unix]
    attack: T1083
    if:
      type: symbol
      kind: call
      exact: os.ReadDir
      arg:
        kind: string
        exact: /var/log
