defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]
  attack: T1083

traits:
- id: opt-dir-enum
  desc: Enumerates /opt directory
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: readdirSync\(\s*['\"]?/opt['\"]?\s*\)
- id: opt-root-explore-call
  desc: Calls exploreDirectory on /opt
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: exploreDirectory('/opt');
