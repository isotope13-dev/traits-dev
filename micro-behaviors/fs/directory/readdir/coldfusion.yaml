# `<cfdirectory action="list">` enumerates a directory into a query object.
# FileFacts identifies ColdFusion pages as `cfml`.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.88
traits:
  - id: cfdirectory-list
    desc: ColdFusion cfdirectory lists a directory
    if:
      type: text
      regex: '<\s*cfdirectory\s+action\s*=\s*["'']?list'
      case_insensitive: true
  - id: cfdirectory-query-list
    desc: ColdFusion cfdirectory query listing
    if:
      type: text
      regex: '<\s*cfdirectory\b[^>]{0,180}\b(directory|name)\s*=\s*[^>]{0,100}\b(name|sort)\s*='
      case_insensitive: true
