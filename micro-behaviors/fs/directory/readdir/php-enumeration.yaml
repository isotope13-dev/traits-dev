defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
  - id: php-readdir-call
    desc: PHP reads the next directory entry
    if:
      type: symbol
      kind: call
      exact: readdir
  - id: php-scandir-call
    desc: PHP lists directory entries with scandir
    if:
      type: symbol
      kind: call
      exact: scandir
  - id: php-directory-iterator
    desc: References a PHP directory entry iterator
    if:
      type: symbol
      kind: identifier
      regex: '^(Directory|Filesystem)Iterator$'
  - id: php-recursive-directory-iterator
    desc: References PHP RecursiveDirectoryIterator
    if:
      type: symbol
      kind: identifier
      exact: RecursiveDirectoryIterator
composite_rules:
  - id: php-directory-entry-call
    desc: PHP lists or searches directory entries
    any:
      - id: php-readdir-call
      - id: php-scandir-call
      - id: micro-behaviors/fs/search::php-glob-call
  - id: php-directory-enumeration
    desc: PHP enumerates directory entries
    any:
      - id: php-directory-entry-call
      - id: php-directory-iterator
      - id: php-recursive-directory-iterator
