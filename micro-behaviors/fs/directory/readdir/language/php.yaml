defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable

traits:
  - id: php-opendir
    desc: Opens directory with PHP opendir
    if:
      type: symbol
      kind: call
      exact: opendir
  - id: php-glob-onlydir
    desc: Uses GLOB_ONLYDIR constant
    crit: notable
    conf: 0.88
    if:
      type: text
      word: GLOB_ONLYDIR
