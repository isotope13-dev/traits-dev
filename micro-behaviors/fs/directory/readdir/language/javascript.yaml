defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
traits:
  - id: node-readdir-cwd-call
    desc: Reads entries from current working directory
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: '\bfs\.readdir\s*\(\s*process\.cwd\s*\(\s*\)'
  - id: readdir-node
    desc: List directory contents (Node.js)
    crit: baseline
    conf: 0.66
    if:
      type: string_literal
      regex: \.readdir(Sync)?\(
