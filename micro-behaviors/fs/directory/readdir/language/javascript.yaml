defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
traits:
  - id: node-readdir-cwd-call
    desc: Reads entries from current working directory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bfs\.readdir\s*\(\s*process\.cwd\s*\(\s*\)'
  - id: node-cwd-query-near-sync-readdir
    desc: Nearby cwd query and sync directory listing
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'process\.cwd\s*\(\s*\)[\s\S]{0,200}\breaddirSync\s*\(\s*[A-Za-z_$]'
  - id: readdir-node
    desc: List directory contents (Node.js)
    crit: baseline
    conf: 0.66
    if:
      type: string_literal
      regex: \.readdir(Sync)?\(
