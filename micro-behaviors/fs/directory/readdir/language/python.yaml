# Directory Listing - Python
# MBC: E1083 (File and Directory Discovery)
# ATT&CK: T1083
defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: readdir-python
    desc: List directory contents (Python)
    crit: baseline
    conf: 0.66
    if:
      type: text
      substr: .listdir(
  - id: python-text-and-log-globs
    desc: Names both text and log glob patterns
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\(\s*["'']\*\.txt["'']\s*,\s*["'']\*\.log["'']\s*\)'

  - id: python-directory-listing
    desc: Python lists directory entries
    crit: notable
    conf: 0.86
    attack: T1083
    if:
      type: symbol
      kind: call
      regex: '^os\.(listdir|scandir)$'
