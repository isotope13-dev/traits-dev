# `<cfdirectory action="list">` enumerates a directory into a query object.
# FileFacts identifies ColdFusion pages as `cfml`.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.88
traits:
  - id: cfdirectory-list
    desc: ColdFusion cfdirectory lists a directory
    if:
      type: symbol
      kind: call
      exact: cfdirectory
      arg:
        index: 0
        from:
          field: action
          whole_value: '(?i)^list$'
