# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: getdents-syscall
    desc: Reads directory entries via Linux syscall
    crit: baseline
    if:
      type: syscall
      name: [getdents, getdents64]
      arch: [x86_64, aarch64]
