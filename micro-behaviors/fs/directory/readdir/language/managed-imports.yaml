defaults:
  for: [pe]
  platforms: [windows]
  crit: notable
traits:
  - id: dotnet-directory-get-files-import
    desc: Imports managed directory file enumeration
    if:
      type: symbol
      kind: import
      exact: System.IO.Directory.GetFiles
  - id: dotnet-directory-get-directories-import
    desc: Imports managed subdirectory enumeration
    if:
      type: symbol
      kind: import
      exact: System.IO.Directory.GetDirectories
