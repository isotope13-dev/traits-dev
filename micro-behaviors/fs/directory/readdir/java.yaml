defaults:
  platforms: [windows, unix]
  for:
    - java
    - class
traits:
  - id: readdir-java
    desc: List directory contents (Java)
    crit: baseline
    conf: 0.66
    if:
      type: text
      word: listFiles

  - id: jvm-file-listfiles
    desc: JVM File.listFiles directory enumeration
    crit: notable
    conf: 0.94
    for: [class]
    if:
      type: import
      exact: java/io/File.listFiles

  - id: java-listfiles-reference
    desc: Java listFiles directory enumeration
    crit: notable
    conf: 0.88
    platforms: [android]
    for: [apk, zip, dex]
    if:
      type: text
      word: listFiles
