defaults:
  platforms: [windows, unix, android]
  for:
    - java
    - kotlin
    - class
traits:
  - id: readdir-java
    desc: List directory contents (Java)
    crit: baseline
    conf: 0.66
    if:
      type: text
      word: listFiles

  - id: jvm-file-listfiles
    desc: JVM File.listFiles directory enumeration
    crit: notable
    conf: 0.94
    for: [class]
    if:
      type: import
      exact: java/io/File.listFiles

  - id: java-listfiles-reference
    desc: Java listFiles directory enumeration
    crit: notable
    conf: 0.88
    platforms: [android]
    for: [dex]
    if:
      type: text
      word: listFiles

  - id: java-listfiles-no-arg-call
    desc: Calls File.listFiles() without a filter
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.listFiles\(\s*\)'
