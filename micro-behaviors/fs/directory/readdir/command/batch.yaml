# cmd.exe recursive directory walk. Also matched in HTML/JavaScript because
# clipboard-lure pages carry the command as a string literal rather than
# running it themselves.
defaults:
  platforms: [windows]
  for: [batch, powershell, html, javascript]
  attack: T1083
  mbc: C0049

traits:
  - id: batch-dir-command
    desc: Invokes DIR directory-listing command
    crit: notable
    conf: 0.96
    for: [batch]
    if:
      type: text
      regex: '(?im)^[ \t]*@?dir([ \t>\r\n]|$)'

  - id: batch-recursive-for-loop
    desc: cmd.exe recursively walks a directory tree
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bfor\s+/r\b'
