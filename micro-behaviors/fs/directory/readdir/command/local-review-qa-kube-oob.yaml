defaults:
  platforms:
  - linux
  for:
  - javascript
traits:
  - id: node-exec-serviceaccount-recon-command
    desc: Exec queries user and lists service-account dir
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: exec
      arg:
        index: 0
        from:
          value: 'whoami.{0,160}ls -la /var/run/secrets/kubernetes\.io/serviceaccount'
