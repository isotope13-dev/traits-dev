defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source, manifests, documents, media, data]

traits:
- id: package-data-logs-list-substitution
  desc: Package text lists /data/logs via substitution
  crit: notable
  conf: 0.96
  attack: T1083
  for: [manifests]
  if:
    type: text
    regex: "\\$\\(ls\\s+-la\\s+/data/logs/?\\)"

  # === Specific Triple Exfil Pattern ===
