defaults:
  platforms: [unix, windows]
  for: [gyp]
traits:
  - id: gyp-container-secret-directory-list-command
    desc: gyp lists container secret directory
    crit: suspicious
    conf: 0.99
    if:
      type: value
      path: targets[*].actions[*].action[*]
      regex: 'ls\s+-laR\s+/var/run/secrets/'
