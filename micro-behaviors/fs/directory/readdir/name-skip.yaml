defaults:
  platforms: [unix]
  crit: notable
  conf: 0.93
traits:
  - id: readdir-name-skip-loop
    desc: Directory reader skips matching names in loop
    for: [c, cpp]
    if:
      type: tree-sitter
      query: |
        ((function_definition
          declarator: (pointer_declarator
            declarator: (function_declarator declarator: (identifier) @name))
          body: (compound_statement
            (_ body: (compound_statement
              (if_statement
                condition: (_) @condition
                consequence: (compound_statement (continue_statement))))))) @filter
         (#match? @name "^readdir(64)?$")
         (#match? @condition "strn?cmp\\s*\\([^;{}]{0,160}d_name"))
  - id: embedded-dirent-name-skip
    desc: Embedded directory reader skips matching names
    for: [scripts]
    if:
      type: text
      regex: '\breaddir(64)?\s*\(\s*DIR\s*\*[\s\S]{0,600}d_name[^{}]{0,100}\{\s*continue;'
