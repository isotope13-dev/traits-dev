# Directory-listing method names as standalone binary strings. Neutral: the
# .NET Framework itself carries `ListDirectory` (WebRequestMethods.Ftp) and
# file managers, FTP clients and SDKs name the operation the same way.
# Relocated (2026-09) from objectives/command-and-control/backdoor/rat/recon,
# whose Go directory-enumeration composite still references them.
defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]
  crit: notable
  conf: 0.8
  attack: T1083

traits:
  - id: getdirlist-method-name
    desc: GetDirList method name string
    if:
      type: text
      exact: GetDirList
  - id: listdirectory-method-name
    desc: ListDirectory method name string
    if:
      type: text
      exact: ListDirectory
