defaults:
  platforms: [macos]
  for: [applescript]
  attack: T1083

traits:
  - id: applescript-list-folder-assignment
    desc: AppleScript assigns a folder-entry listing
    crit: notable
    conf: 0.95
    for: [applescript, shell, python, javascript, swift, go, macho]
    if:
      # Cover source and quoted osascript lines, including decoded native text.
      # Neither recursion nor invisible-file enumeration follows from this.
      type: text
      regex: '(?im)(^|["''])[ \t]*set[ \t]+\w+[ \t]+to[ \t]+list[ \t]+folder\b'

  - id: desktop-file-enumeration
    desc: AppleScript enumerates Desktop files
    crit: notable
    conf: 0.92
    for: [applescript, shell, python, javascript, swift, go, macho]
    if:
      type: text
      regex: '(?i)\bevery\s+file\s+of\s+(the\s+)?desktop\b'

  - id: documents-file-enumeration
    desc: AppleScript enumerates Documents-folder files
    crit: notable
    conf: 0.92
    for: [applescript, shell, python, javascript, swift, go, macho]
    if:
      # Also accept AppleScript quoted inside an osascript command string.
      type: text
      regex: '(?i)\bevery\s+file\s+of\s+folder\s+\\{0,3}"Documents\\{0,3}"'
