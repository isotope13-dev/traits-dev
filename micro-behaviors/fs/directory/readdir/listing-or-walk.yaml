defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell]
composite_rules:
- id: listing-or-walk-evidence
  desc: Directory listing or recursive-walk evidence
  crit: notable
  conf: 0.85
  any:
  - id: node-readdir-sync-call
  - id: micro-behaviors/fs/directory/traverse::traverse-walk
  - id: micro-behaviors/fs/directory/traverse::relative-find-command-text
  unless:
  - id: well-known/tool/detection/security-scanner::code-pattern-catalog
