defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: vb6-rtcdir
    desc: VB6 directory enumeration helper
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: rtcDir
  - id: vb6-ordinal-rtcdir
    desc: VB6 ordinal directory enumeration helper
    crit: baseline
    conf: 0.94
    if:
      type: symbol
      exact: 'ORDINAL 645'
