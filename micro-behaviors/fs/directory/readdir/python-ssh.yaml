defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - python
  crit: notable
traits:
- id: python-path-home-ssh-walk
  desc: Python walks .ssh after Path.home()
  conf: 0.95
  if:
    type: text
    regex: Path\.home\(\)[\s\S]{0,180}["']\.ssh["'][\s\S]{0,100}(glob|iterdir)\s*\([^)]{0,12}
  not:
  - regex: glob\s*\(\s*["'']\*\.pub["'']
  unless:
  - id: well-known/app/ai/coding-agent/
  - id: well-known/app/infrastructure/datadog-agent::source-context
- id: python-expanduser-ssh-list
  desc: Python lists an expanded .ssh path
  conf: 0.94
  unless:
  - id: well-known/tool/sysadmin/multissh::multissh-context
  if:
    type: text
    regex: expanduser\s*\(\s*["']~[/\\]\.ssh["']\s*\)[\s\S]{0,70}(listdir|scandir)\s*\(
- id: python-expanduser-ssh-walk
  desc: Python walks an expanded .ssh path
  conf: 0.94
  if:
    type: text
    regex: expanduser\s*\(\s*["']~[/\\]\.ssh["']\s*\)[\s\S]{0,70}(glob|iterdir)\s*\(
  not:
  - regex: glob\.glob\s*\(
- id: python-os-ssh-list
  desc: Python lists an OS .ssh path
  conf: 0.94
  if:
    type: text
    regex: os\.(listdir|scandir)\s*\([^)\n]{0,80}[/\\]\.ssh
composite_rules:
- id: python-ssh-directory-listing-context
  desc: SSH directory listing or nearby path/listing context
  conf: 0.95
  any:
  - id: python-path-home-ssh-walk
  - id: python-expanduser-ssh-walk
  - id: python-os-ssh-list
  - id: python-expanduser-ssh-list
  - id: python-ssh-path-and-directory-listing
  unless:
  - id: well-known/app/ai/coding-agent/
  - id: well-known/tool/sysadmin/multissh::multissh-context
- id: python-ssh-path-and-directory-listing
  desc: SSH path and Python directory listing co-occur
  conf: 0.94
  near_bytes: 512
  all:
  - id: micro-behaviors/fs/path/config/ssh::ssh-directory-literal
  - id: micro-behaviors/fs/directory/readdir::python-directory-listing
  unless:
  - id: well-known/tool/sysadmin/multissh::multissh-context
