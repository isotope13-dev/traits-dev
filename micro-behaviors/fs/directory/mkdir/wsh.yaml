defaults:
  platforms: [windows]
  for: [javascript, vbs]
  crit: notable
  conf: 0.8
traits:
  - id: wsh-createfolder
    # Match the method call itself.  A word boundary avoids treating helpers
    # such as gDriveFindOrCreateFolder as Windows Script Host code.
    desc: Calls a CreateFolder directory method
    if:
      type: text
      regex: '(?i)\bCreateFolder\s*\('
