defaults:
  platforms: [windows]
  for: [javascript, vbs]
  crit: notable
  conf: 0.8
traits:
  - id: wsh-createfolder
    # The FileSystemObject method is reached through a receiver and spelled
    # with a capital C.  A bare case-insensitive `CreateFolder(` caught every
    # JavaScript app carrying its own `createFolder()` helper -- Drive clients,
    # IMAP mailbox managers, editors -- none of them Windows Script Host.
    desc: Calls the FileSystemObject CreateFolder method
    if:
      type: text
      regex: '\.\s*CreateFolder\s*\('

  # Obfuscator.io and similar packs rewrite FSO calls as obj['CreateFolder'](...).
  - id: wsh-createfolder-bracket
    desc: Bracket-accessed CreateFolder method call
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: '\[[''"]CreateFolder[''"]\]\s*\('

  # Method name kept as a string token in the decoder map (call site reconstructed).
  - id: wsh-createfolder-method-name
    desc: CreateFolder method name string literal
    conf: 0.85
    for: [javascript]
    if:
      type: text
      regex: '[''"]CreateFolder[''"]'
