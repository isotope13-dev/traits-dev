defaults:
  platforms: [windows]
  for: [javascript, vbs]
  crit: notable
  conf: 0.8
traits:
  - id: wsh-createfolder
    # Match the method call itself.  A word boundary avoids treating helpers
    # such as gDriveFindOrCreateFolder as Windows Script Host code.
    desc: Calls a CreateFolder directory method
    if:
      type: text
      regex: '(?i)\bCreateFolder\s*\('

  # Obfuscator.io and similar packs rewrite FSO calls as obj['CreateFolder'](...).
  - id: wsh-createfolder-bracket
    desc: Bracket-accessed CreateFolder method call
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: '\[[''"]CreateFolder[''"]\]\s*\('

  # Method name kept as a string token in the decoder map (call site reconstructed).
  - id: wsh-createfolder-method-name
    desc: CreateFolder method name string literal
    conf: 0.85
    for: [javascript]
    if:
      type: text
      regex: '[''"]CreateFolder[''"]'
