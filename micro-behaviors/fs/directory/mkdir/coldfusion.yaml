# Source-confirmed in the reviewed CFML file manager.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.9
traits:
  - id: cfdirectory-create
    desc: ColdFusion cfdirectory creates a directory
    if:
      type: symbol
      kind: call
      exact: cfdirectory
      arg:
        index: 0
        from:
          field: action
          whole_value: '(?i)^create$'
