defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: ssh-directory-mkdir-command
    desc: Shell command creates the .ssh directory
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [shell]
    if:
      type: text
      regex: 'mkdir\s+[^|;&\n]{0,20}\.ssh\b'

  - id: mkdir-command
    desc: Command text invokes mkdir
    crit: notable
    conf: 0.8
    # markdown covers skill installation guidance carrying the same command in
    # fenced blocks; (?m) lets block-indented mkdir (inside if/then, lists)
    # match at its line start.
    for: [shell, batch, markdown]
    if:
      type: text
      regex: '(?m)(^|[;&|`])\s*mkdir(\s+-[A-Za-z]*|\s+)[^\r\n;&|]{1,120}'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
      - id: metadata/package/files/system-package::shell-completion-script
