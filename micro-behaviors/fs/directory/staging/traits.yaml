# Directory create-and-replace is a neutral operation sequence.  Build systems
# and atomic writers use it routinely; evasive intent belongs in objective
# composites that add a temporary or hidden placement signal.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

composite_rules:
  - id: directory-create-then-move
    desc: Creates a directory and moves it in the same source span
    crit: notable
    conf: 0.82
    all:
      - id: micro-behaviors/fs/directory/mkdir
      - id: micro-behaviors/fs/file/move
    near_lines: 8
    near_bytes: 160

  - id: directory-create-then-rename
    desc: Creates a directory and renames it in the same source span
    crit: notable
    conf: 0.82
    all:
      - id: micro-behaviors/fs/directory/mkdir
      - id: micro-behaviors/fs/file/rename
    near_lines: 8
    near_bytes: 160
