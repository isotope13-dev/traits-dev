defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.8
  mbc: C0047
  attack: T1070.004
traits:
  - id: rimraf
    desc: Calls the rimraf recursive-deletion API
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: '\brimraf(\.sync)?\s*\('
  - id: rm-rf
    desc: References an rm -rf deletion command
    for: [scripts, binaries, -shell]
    unless:
      - type: basename
        regex: (^|[\\/])node_modules[\\/].{0,200}[\\/]test[\\/]
      - id: metadata/package/testing/harness/runtime/
      - id: micro-behaviors/process/create/shell/git::git-operations-1
      - id: well-known/app/data/xore-honeypot::benign-context
      - id: micro-behaviors/process/create/shell/git::git-operations-2
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
      - id: well-known/app/infrastructure/k9x-satan::attack-fixture-context
      - type: text
        regex: '(?m)DEFAULT_DENIED_KEYWORDS\s*=\s*\['
      - id: well-known/tool/offensive/ctf-skills::source-context
    if:
      type: text
      regex: '\brm\s+-rf\b'
  - id: shell-rm-rf-package-build-path
    desc: Shell recursively deletes package build path
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: 'rm\s+-rf\s+["'']?\$\{?(pkgdir|DESTDIR|srcdir)'
  - id: rm-f
    desc: rm -f shell command (force, non-recursive)
    crit: component
    for: [scripts, binaries]
    if:
      type: text
      substr: rm -f
  - id: windows-rmdir-recursive
    desc: Windows recursively deletes a directory tree
    crit: notable
    conf: 0.88
    platforms: [windows]
    for: [batch]
    unless:
      - type: basename
        exact: build-pty4j-libpty.bat
    if:
      type: text
      regex: '(?i)\b(rd|rmdir)\s+/[sq]\b'
  - id: shutil-rmtree
    desc: Calls rmtree() to delete a directory tree
    crit: notable
    for:
      - python
    if:
      type: symbol
      kind: call
      # `from shutil import rmtree` records the bare name, which the previous
      # `exact: shutil.rmtree` missed — that gap is why a second, looser
      # `rmtree\s*\(` copy existed under fs/file/delete/.
      regex: '^(shutil\.)?rmtree$'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: fs-rm-recursive
    desc: Node.js fs.rm with recursive option
    crit: notable
    for:
      - javascript
      - typescript
    if:
      type: text
      # Obfuscated loaders bind `fs` to a hex id (`_0x….rmSync(..., {recursive:true})`).
      regex: '\.rm(Sync)?\s*\([^)]{0,80}recursive'
  - id: rmdirSync-recursive
    desc: Node.js rmdirSync with recursive option
    for:
      - javascript
      - typescript
    if:
      type: string_literal
      regex: rmdirSync\s*\([^)]{0,50}recursive

  - id: python-root-directory-delete
    desc: Python recursively deletes root directory
    crit: suspicious
    conf: 0.99
    attack: T1485
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: 'shutil\.rmtree\s*\(\s*["'']/["'']\s*\)'

  - id: node-root-directory-delete
    desc: Node recursively deletes root directory
    crit: suspicious
    conf: 0.99
    attack: T1485
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: call
      regex: 'fs\.rmSync\s*\(\s*["'']/["''].{0,120}\brecursive\s*:\s*true\b'

composite_rules:
  - id: iterative-file-deletion
    desc: Iteratively deletes files from directory
    crit: notable
    conf: 0.88
    scope: leaf
    near_lines: 30
    all:
      - id: micro-behaviors/fs/directory/traverse::traverse-readdir-walk-find
    any:
      - id: micro-behaviors/fs/file/delete::fs-unlinkSync
      - id: micro-behaviors/fs/file/delete::py-remove
      - id: micro-behaviors/fs/directory/traverse::delete-shell
    unless:
      - id: metadata/library/structure::js-large-minified-bundle
      - id: well-known/lib/development/ts-compiler-lib::typescript-compiler-lib-context
      - id: well-known/tool/development/webdriver-manager::selenium-webdriver-driver-manager-package
      - id: well-known/app/development/dotnet-agent-skills::dotnet-agent-skills-identity
  - id: recursive-delete
    desc: Recursively deletes a directory tree
    crit: notable
    conf: 0.85
    unless:
      - id: metadata/package/quality/benign-context::stacksjs-stx-framework-context
    any:
      - id: rimraf
      - id: rm-rf
      - id: shutil-rmtree
      - id: windows-rmdir-recursive
