# Resolve the code's real position-relative decoder, key and counted range.
# No decoded instruction is claimed from a differently keyed string elsewhere.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536
traits:
  - id: dos-xor-parent-search-loop
    desc: XOR-hidden search ascends parent directories
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_xor_parent_search_loop {
          strings:
            $decode = { E8 00 00 5F 81 EF ?? ?? B9 ?? ?? 8A 95 ?? ?? 30 95 ?? ?? 47 E2 F9 C3 }
            $parent = "\xb4\x3b\x8d\x96" xor(1-255)
            $find = "\x33\xc9\xb4\x4e\x8d\x96" xor(1-255)
          condition:
            for any d in (1..#decode) : (
              @decode[d]+3 >= uint16(@decode[d]+6) and
              (@decode[d]+3-uint16(@decode[d]+6))+uint16(@decode[d]+13) < filesize and
              @parent >= (@decode[d]+3-uint16(@decode[d]+6))+uint16(@decode[d]+17) and
              @parent+!parent <= (@decode[d]+3-uint16(@decode[d]+6))+uint16(@decode[d]+17)+uint16(@decode[d]+9) and
              (uint8(@parent) ^ 180) == uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13)) and
              @find >= (@decode[d]+3-uint16(@decode[d]+6))+uint16(@decode[d]+17) and
              @find+!find <= (@decode[d]+3-uint16(@decode[d]+6))+uint16(@decode[d]+17)+uint16(@decode[d]+9) and
              (uint8(@find) ^ 51) == uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13)) and
              @parent > @find and
              (uint16((@decode[d]+3-uint16(@decode[d]+6))+(uint16(@parent+4) ^ (uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))*257))) ^ (uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))*257)) == 0x2e2e and (uint8((@decode[d]+3-uint16(@decode[d]+6))+(uint16(@parent+4) ^ (uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))*257))+2) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 0 and
              (uint16(@parent+6) ^ (uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))*257)) == 0x21cd and
              (uint8(@parent+8) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 0x72 and (uint8(@parent+10) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == 0xeb and
              @parent+12+(uint8(@parent+11) ^ uint8(@decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13))) == @find+256
            )
        }
