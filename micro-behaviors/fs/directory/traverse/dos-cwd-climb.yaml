defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  size_max: 65536

traits:
  - id: dos-cwd-save-chdir-climb-restore
    desc: Saves CWD, climbs parent dirs, restores CWD
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: >-
        B4 47 [0-4] (B2 00|32 D2|2A D2) [0-4] (BE ?? ??|8D B6 ?? ??) [0-4] CD 21
        [0-12] E8 ?? ?? [0-8] (BA ?? ?? [0-2] B4 3B|B4 3B [0-2] BA ?? ??) CD 21 73 (E8|E9|EA|EB|EC|ED|EE|EF|F0|F1|F2|F3|F4|F5|F6|F7|F8)
        [0-24] (BA ?? ?? [0-2] B4 3B|B4 3B [0-2] BA ?? ??) CD 21
