defaults:
  for: [pyc]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: pyc-walk-name-record
    desc: Bytecode contains walk name record
    conf: 0.8
    if:
      type: raw
      regex: '(?-u:[\x7a\x5a\xfa\xda]\x04walk)'
    unless:
      # CPython ast.py defines ast.walk(node) over syntax trees, not directories.
      - type: value
        path: pyc.source_files
        regex: '(^|[\\/])ast\.py$'
