defaults:
  platforms:
    - unix
    - windows
  for:
    - python
    - pyc
traits:
  - id: traverse-walk
    desc: Traverse filesystem hierarchy (os.walk)
    crit: baseline
    conf: 0.66
    if:
      type: text
      substr: os.walk
  - id: traverse-walk-call
    desc: Calls os.walk for filesystem enumeration
    crit: notable
    conf: 0.84
    if:
      type: symbol
      kind: call
      # email.message.Message.walk and graph walkers are not file traversal.
      # Only the explicit filesystem API establishes this observation.
      exact: os.walk
  - id: traverse-rglob-call
    desc: Calls pathlib rglob for recursive enumeration
    crit: notable
    conf: 0.84
    if:
      type: symbol
      kind: call
      regex: '(^|\.)rglob$'
  - id: python-dotenv-filename-in-walk
    desc: Directory enumeration checks for dotenv filename
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']\.env["'']\s+in\s+(files|os\.listdir\s*\()'
  - id: python-pathlib-parent-directory-walk
    desc: Python pathlib walks parent directories
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\(\s*start\s*,\s*\*start\.parents\s*\)|for\s+\w+\s+in\s+\w+\.parents\b'
  # Upward search: climb with dirname until the root, where dirname(x) == x.
  - id: python-dirname-root-break-walk
    desc: Python climbs parent dirs until dirname root
    crit: notable
    conf: 0.88
    if:
      type: text
      exclude_comments: true
      regex: '=\s*(os\.)?(path\.)?dirname\(\s*\w+\s*\)\s+if\s+\w+\s*==\s*\w+\s*:\s*break'
  - id: python-dirname-while-ne-walk
    desc: Python loops until dirname reaches root
    crit: notable
    conf: 0.88
    if:
      type: text
      exclude_comments: true
      regex: 'while\s+\w+\s*!=\s*(os\.)?(path\.)?dirname\(\s*\w+\s*\)'
