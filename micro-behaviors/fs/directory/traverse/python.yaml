defaults:
  platforms:
    - unix
    - windows
  for:
    - python
    - pyc
traits:
  - id: traverse-walk
    desc: Traverse filesystem hierarchy (os.walk)
    crit: baseline
    conf: 0.66
    if:
      type: text
      substr: os.walk
  - id: traverse-walk-call
    desc: Calls os.walk for filesystem enumeration
    crit: notable
    conf: 0.84
    if:
      type: symbol
      kind: call
      exact: os.walk
  - id: traverse-rglob-call
    desc: Calls pathlib rglob for recursive enumeration
    crit: notable
    conf: 0.84
    if:
      type: symbol
      kind: call
      regex: '(^|\.)rglob$'
  - id: traverse-glob-call
    desc: Calls Python glob for file enumeration
    crit: notable
    conf: 0.84
    if:
      type: symbol
      kind: call
      regex: '(^|\.)glob$'
  - id: python-dotenv-filename-in-walk
    desc: Directory enumeration checks for dotenv filename
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']\.env["'']\s+in\s+(files|os\.listdir\s*\()'
