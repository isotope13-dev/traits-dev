defaults:
  platforms: [windows]
  for: [powershell]

traits:
  # Relocated from objectives/collection/file-targeting/filter/ransomware.yaml,
  # where a bare `Get-ChildItem -Recurse` was filed as file targeting for
  # collection. Walking a tree recursively is the neutral half of that: an
  # installer locating its own extracted binary does it (bob-nvim's install.ps1
  # runs `Get-ChildItem -Path $tempExtract -Filter "bob.exe" -Recurse`), and so
  # does every build and packaging script. The high-value keyword and document
  # extension clusters in that composite carry the targeting intent.
  - id: powershell-recursive-child-item
    desc: PowerShell recursively enumerates files
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(Get-ChildItem|gci|dir)\b[^\r\n]{0,180}\s-Recurse\b'
    not:
      - regex: '(?i)-Include\s+"\*\.(ts|tsx|js|jsx)"'
    unless:
      - id: well-known/lib/ai/pyaigis/
      - id: well-known/app/ai/coding-agent/copilot-delegate::copilot-delegate-hook-script

  # Relocated from objectives/credential-access/env/dotenv/traits.yaml, where
  # PowerShell drive-root enumeration was misfiled as suspicious dotenv theft.
  # Enumerating a drive root (e.g. C:\) is a neutral filesystem traversal primitive.
  - id: powershell-drive-root-enumeration
    desc: PowerShell enumerates drive root directory
    crit: notable
    conf: 0.85
    for: [powershell, python, batch]
    if:
      type: text
      regex: '(?i)\b(Get-ChildItem|gci|dir)\b.{0,40}-Path\s+["'']?[A-Z]:\\\\["'']?.{0,40}(-Recurse|-Force)'

