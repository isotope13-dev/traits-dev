# Directory Traversal with Delete Operations
# Micro-behaviors for iterating directories with deletion operations
defaults:
  platforms: [windows, unix]
  crit: baseline
  conf: 0.85
traits:
  - id: traverse-readdir-walk-find
    desc: Traverses directories using common APIs
    for: [javascript, typescript, python, shell]
    if:
      type: text
      regex: fs\.readdirSync|os\.walk|find\s+\./?\s
    unless:
      - id: well-known/tool/detection/security-scanner::code-pattern-catalog
  - id: python-temp-cache-file-cleanup
    desc: Python removes files from temporary cache
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: 'temporary_cache_dir[\s\S]{0,260}os\.walk[\s\S]{0,260}os\.remove'
  - id: delete-flag-shell
    desc: Delete flag in shell command
    for: [shell]
    if:
      type: text
      substr: -delete

  - id: shell-find-root-delete
    desc: Shell find deletes root filesystem entries
    crit: suspicious
    conf: 0.98
    attack: T1485
    for: [shell]
    if:
      type: text
      # Require a command-line-shaped root traversal and the destructive
      # find action. This does not match prose or comments prefixed with #.
      regex: '(?m)^[ \t]*find[ \t]+/[ \t]+.{0,180}\-delete\b.{0,80}$'

  - id: absolute-tree-top-level-find
    desc: Find limits absolute tree traversal depth
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\bfind\s+/[A-Za-z0-9_./-]{1,160}\s+[^\r\n]{0,160}-maxdepth\s+1\b'

  - id: find-exec-recursive-remove
    desc: Find recursively removes each match
    crit: notable
    conf: 0.92
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)-exec\s+rm\s+-[a-z]*(rf|fr)[a-z]*\s+\{\}\s+\+'
composite_rules:
  - id: top-level-tree-recursive-delete
    desc: Recursively deletes top-level tree contents
    crit: suspicious
    conf: 0.96
    for: [scripts, source]
    all:
      - id: absolute-tree-top-level-find
      - id: find-exec-recursive-remove
    near_lines: 1
    unless:
      - id: metadata/package/tooling::proxmoxve-community-scripts

  - id: go-recursive-removeall
    desc: Go recursive filesystem traversal and deletion
    crit: notable
    conf: 0.78
    for: [pe, elf, macho]
    platforms: [windows, unix, macos]
    size_max: 52428800
    all:
      - id: micro-behaviors/fs/directory/traverse::filepath-walk
      - id: micro-behaviors/fs/delete/directory::os-RemoveAll-string
  - id: delete-shell
    desc: Shell deletion operation
    crit: baseline
    conf: 0.85
    for: [shell]
    any:
      - id: delete-flag-shell
      - id: micro-behaviors/fs/delete/directory::rm-rf
