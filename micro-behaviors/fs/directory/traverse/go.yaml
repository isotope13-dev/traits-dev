defaults:
  crit: notable
  platforms: [windows, unix]
  for: [go, pe, elf, macho]
  attack: T1083
traits:
  - id: filepath-walk
    desc: Go recursively walks a directory
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^filepath\.Walk(Dir)?$'
  - id: go-file-matching-routine
    desc: Go file matching routine
    conf: 0.93
    if:
      type: text
      substr: FindMatchingFiles
