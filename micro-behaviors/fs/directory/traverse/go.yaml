defaults:
  crit: notable
  platforms: [windows, unix]
  for: [go, pe, elf, macho]
  attack: T1083
traits:
  - id: filepath-walk
    desc: Go recursively walks a directory
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^filepath\.Walk(Dir)?$'
  # The compiled twin of filepath-walk: a stripped Go binary has no call
  # symbols, but the pclntab keeps the name of every linked function, and the
  # linker drops the walkers unless something calls them.
  - id: filepath-walk-pclntab
    desc: Go binary links a recursive directory walker
    conf: 0.88
    for: [elf, macho, pe]
    if:
      type: text
      regex: '^(path/filepath\.Walk(Dir)?|io/fs\.WalkDir)$'
  - id: go-file-matching-routine
    desc: Go file matching routine
    conf: 0.93
    if:
      type: text
      substr: FindMatchingFiles
