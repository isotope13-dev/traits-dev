defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
- id: dos-parent-search-repeated-self-drop
  desc: Parent ascent repeats search and image drop
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule dos_parent_search_repeated_self_drop {\n meta:\n filetypes = \"com,dos\"\n strings:\n\n$parent = { B4 3B BA ?? ?? CD 21 72 ?? B4\
      \ 4E BA ?? ?? CD 21 }\n$drop = { BA ?? ?? B9 00 00 B4 3C CD 21 8B D8 B9 ?? ?? BA 00 01 B4 40 CD 21 B4 3E CD\
      \ 21 }\n$nextphase = { B4 1A BA ?? ?? CD 21 B4 4E BA ?? ?? CD 21 72 ?? }\n$up = { 2E 2E 00 }\n\n condition:\n\
      #parent > 0 and #parent <= 32 and #drop > 0 and #drop <= 32 and #nextphase > 0 and #nextphase <= 32 and #up\
      \ <= 32 and\nfor any p in (1..#parent) : (\n for any u in (1..#up) : (@up[u]+256 == uint16(@parent[p]+3))\
      \ and\n for any d in (1..#drop) : (\n  @drop[d] > @parent[p]+!parent[p] and @drop[d]-@parent[p] < 2048 and\n\
      \  for any n in (1..#nextphase) : (\n   @nextphase[n] > @drop[d]+!drop[d] and @nextphase[n]-@drop[d] < 128\
      \ and\n   @nextphase[n]+16+int8(@nextphase[n]+15) == @parent[p]\n  )\n )\n)\n}"
