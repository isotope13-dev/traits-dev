# Observation reviewed independently of attacker intent.
traits:
- for:
  - powershell
  platforms:
  - windows
  id: powershell-recursive-file-enumeration
  desc: PowerShell recursively collects file paths
  crit: notable
  conf: 0.91
  if:
    type: text
    regex: (?i)Get-ChildItem[^\r\n]{0,160}-Recurse[^\r\n]{0,160}(-File|\.FullName)
