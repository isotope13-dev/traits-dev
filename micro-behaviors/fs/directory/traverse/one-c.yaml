defaults:
  platforms: [windows]
  for: [text]
  crit: notable
  conf: 0.94

traits:
  - id: one-c-directory-queue-read
    desc: Reads directory path from traversal queue
    if:
      type: text
      case_insensitive: true
      regex: 'GetValue\(x, "Path"\);\s*Name = fs\.FindFirstFile\(Path \+ "\*\.\*"\)'

  - id: one-c-subdirectory-queue-append
    desc: Queues discovered child directory paths
    if:
      type: text
      case_insensitive: true
      regex: 'mid\(Attribute, 4, 1\) = "1"[\s\S]{0,180}tabPath\.Path = Path \+ Name'

composite_rules:
  - id: one-c-queued-directory-traversal
    desc: Traverses directories using an expanding queue
    near_lines: 12
    all:
      - id: one-c-directory-queue-read
      - id: one-c-subdirectory-queue-append
