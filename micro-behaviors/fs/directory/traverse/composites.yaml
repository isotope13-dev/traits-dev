defaults:
  platforms: [windows, unix, macos, android]

composite_rules:
  - id: directory-enumeration-or-traversal
    desc: Directory enumeration or traversal logic
    crit: notable
    conf: 0.86
    unless:
      - id: metadata/package/testing/
      - id: metadata/path::test-directory-component
    any:
      - id: relative-find-command-text
      - id: python-walk-or-shell-find
      - id: micro-behaviors/fs/directory/readdir::node-readdir-sync-call
      - id: node-dirent-directory-walk
      - id: root-dirs-list
      - id: multi-os-root-scan
      - id: filepath-walk
      - id: traverse-walk
      - id: file-find-module
      - id: finddepth-walker
      - id: recursive-walk
      - id: cpp-recursive-directory-iterator
      - id: cpp-recursive-directory-iterator-source
      - id: cpp-recursive-copy-scaffold
      - id: traverse-fts
      - id: nftw
      - id: ftw
      - id: rust-recursive-search
      - id: java-listfiles-directory-descent
      - id: findfirst
      - id: findnext
      - id: traverse-rglob-call
