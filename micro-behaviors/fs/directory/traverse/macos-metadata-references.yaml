# File-scoped co-occurrence, not a source-to-sink collection claim.
# Editors, indexers and backup tools also traverse while excluding .DS_Store.
defaults:
  for:
  - macho
  platforms:
  - macos
composite_rules:
- id: macos-metadata-path-traversal
  desc: Traversal with macOS metadata path references
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/fs/path/metadata-store::ds-store-path
  - id: micro-behaviors/fs/path/location::macos-user-location-references
  - id: micro-behaviors/fs/search/content::recursive-file-discovery
  unless:
  - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
  - id: well-known/app/ai/coding-agent/anthropic-claude-code::macos-native-signed-binary
  - id: well-known/app/ai/coding-agent/anthropic-claude-code::native-npm-package-name
  - id: well-known/app/ai/agent-runtime/nagobot::nagobot-identity
  - id: well-known/lib/runtime/scripted/bun-runtime::bun-source-repository-reference
