defaults:
  platforms: [macos]
  for: [macho]
traits:
  - id: cpp-recursive-directory-iterator
    desc: C++ recursive directory iterator
    crit: notable
    conf: 0.9
    mbc: E1083
    if:
      type: symbol
      regex: recursive_directory_iterator
  - id: cpp-temp-directory-path
    desc: C++ temporary directory path
    crit: baseline
    conf: 0.85
    if:
      type: symbol
      regex: temp_directory_path
composite_rules:
  - id: cpp-recursive-copy-scaffold
    desc: C++ recursive-iterator and file-copy API references
    # std::filesystem recursive iteration plus copy is a legitimate library
    # capability (for example, model/runtime staging).  Intent-specific file
    # collection composites add the surrounding evidence before escalating.
    crit: notable
    conf: 0.9
    all:
      - id: cpp-recursive-directory-iterator
      - id: micro-behaviors/fs/file/copy/call::cpp-filesystem-copy-file
    unless:
      - id: metadata/build/bundler/vscode::vscode-packaged-native-tool
