# Java/Kotlin directory descent expressed as the File.listFiles loop shape.
defaults:
  platforms: [windows, unix, android]
  for: [java, kotlin]
  attack: T1083

traits:
  - id: java-directory-child-dispatch
    desc: Dispatches a Java directory child
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.isDirectory\(\)\s*\)\s*\{?\s*[A-Za-z_$][A-Za-z0-9_$]*\([^;]{0,80}\);'

composite_rules:
  - id: java-listfiles-directory-descent
    desc: Java listFiles directory descent
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/fs/directory/readdir::readdir-java
      - id: java-directory-child-dispatch
    near_lines: 14
