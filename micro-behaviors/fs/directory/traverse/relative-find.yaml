defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell]
traits:
- id: relative-find-command-text
  desc: References find over a relative directory
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: find\s+\./?\s
  unless:
  - id: well-known/tool/detection/security-scanner::code-pattern-catalog
