defaults:
  platforms: [windows, unix]
  for: [php]

traits:
  - id: parent-walk-to-root
    desc: Walks parent directories to the root
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'while\s*\(\s*\$\w+\s*!==?\s*[''"]/[''"]'
    unless:
      - id: metadata/package/testing/harness/unit/

