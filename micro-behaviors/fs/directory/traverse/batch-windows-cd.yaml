# DOS `cd` into a Windows directory. A path mention without `cd` is not a
# directory change.
defaults:
  platforms: [windows]
  for: [batch, text]
  crit: notable
  conf: 0.9

traits:
  - id: dos-cd-windows-system
    desc: Changes directory to Windows system
    if:
      type: text
      regex: '(?im)^cd ?\\windows\\system\b'
  - id: dos-cd-windows-temp
    desc: Changes directory to Windows temp
    if:
      type: text
      regex: '(?im)^cd ?\\windows\\temp\b'
