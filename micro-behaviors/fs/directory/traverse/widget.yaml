defaults:
  for: [html, javascript]
  platforms: [windows, macos]
traits:
  - id: widget-recursive-desktop-listing
    desc: Widget source recursively lists Desktop
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'filesystem\.getDirectoryContents\(system\.userDesktopFolder,\s*true\)'
  - id: widget-recursive-pictures-listing
    desc: Widget source recursively lists Pictures
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'filesystem\.getDirectoryContents\(system\.userPicturesFolder,\s*true\)'
  - id: widget-recursive-music-listing
    desc: Widget source recursively lists Music
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: 'filesystem\.getDirectoryContents\(system\.userMusicFolder,\s*true\)'
composite_rules:
  - id: widget-recursive-personal-folder-set
    desc: Widget source lists Desktop, Pictures and Music
    crit: notable
    conf: 0.99
    all:
      - id: widget-recursive-desktop-listing
      - id: widget-recursive-pictures-listing
      - id: widget-recursive-music-listing
