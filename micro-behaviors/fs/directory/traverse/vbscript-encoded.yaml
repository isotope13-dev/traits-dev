defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: vbs-encoded-vbs-file-filter
    desc: Encoded folder iteration with a VBS filter
    crit: component
    conf: 0.96
    if:
      type: text
      case_insensitive: true
      regex: '477073216662.{0,500}4A67215644627466.{0,1000}2F57435423'
  - id: vbs-encoded-subfolder-enumeration
    desc: Encoded VBScript subfolder enumeration
    crit: component
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      substr: '477073216662646921676268687075216A6F21656A73627475702F74766367706D65667374'
  - id: vbs-encoded-recursive-call
    desc: Encoded call on each child folder
    crit: component
    conf: 0.95
    if:
      type: text
      substr: '63736662747521676268687075'

composite_rules:
  - id: vbs-encoded-vbs-filtered-file-iteration
    desc: VBScript enumerates files after a VBS filter
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/data/decode/custom::vbs-hex-offset-decode-execute
      - id: vbs-encoded-vbs-file-filter
  - id: vbs-encoded-recursive-subfolder-enumeration
    desc: VBScript recursively enumerates child folders
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/data/decode/custom::vbs-hex-offset-decode-execute
      - id: vbs-encoded-subfolder-enumeration
      - id: vbs-encoded-recursive-call
