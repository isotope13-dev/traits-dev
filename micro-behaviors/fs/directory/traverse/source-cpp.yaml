defaults:
  platforms: [windows, unix]
  for: [c, cpp]
  attack: T1083
  mbc: E1083
traits:
  - id: cpp-recursive-directory-iterator-source
    desc: C++ source recursively enumerates directories
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: recursive_directory_iterator

  - id: scan-directory-symbol-source
    desc: C/C++ source names ScanDirectory routine
    crit: notable
    conf: 0.85
    if:
      type: symbol
      regex: '(^|::)ScanDirectory$'
