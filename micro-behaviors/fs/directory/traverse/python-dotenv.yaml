defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-dotenv-walk-load-context
    desc: Directory walking with dotenv load context
    crit: notable
    conf: 0.96
    near_bytes: 1024
    all:
      - id: micro-behaviors/fs/directory/traverse::traverse-walk-call
      - id: micro-behaviors/fs/path/secret-config::dotenv-filename-literal
      - id: micro-behaviors/os/env/config::python-dotenv-load
    unless:
      - id: micro-behaviors/os/env/config::python-dotenv-joined-config-load
