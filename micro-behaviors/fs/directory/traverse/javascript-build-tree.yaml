defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-build-filesystem-tree
    desc: Tree builder enumerates filesystem entries
    crit: notable
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: 'function buildTree\([^)]{0,120}\)\s*\{[^{}]{0,240}\breaddir(Sync)?\('
