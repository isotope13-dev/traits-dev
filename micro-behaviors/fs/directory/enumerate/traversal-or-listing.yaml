defaults:
  platforms: [windows, unix, macos, android]

composite_rules:
  - id: directory-enumeration-or-traversal
    desc: Directory enumeration or traversal logic
    crit: notable
    conf: 0.86
    any:
      - id: micro-behaviors/fs/directory/traverse::relative-find-command-text
      - id: micro-behaviors/fs/search/command::python-walk-or-shell-find
      - id: micro-behaviors/fs/directory/readdir/language::node-readdir-sync-call
      - id: micro-behaviors/fs/directory/enumerate::node-dirent-directory-walk
      - id: micro-behaviors/fs/directory/traverse::filepath-walk
      - id: micro-behaviors/fs/directory/traverse::traverse-walk
      - id: micro-behaviors/fs/directory/traverse::finddepth-walker
      - id: micro-behaviors/fs/directory/traverse::recursive-walk
      - id: micro-behaviors/fs/directory/traverse::cpp-recursive-directory-iterator
      - id: micro-behaviors/fs/directory/traverse::cpp-recursive-directory-iterator-source
      - id: micro-behaviors/fs/directory/traverse::cpp-recursive-copy-scaffold
      - id: micro-behaviors/fs/directory/traverse::traverse-fts
      - id: micro-behaviors/fs/directory/traverse::nftw
      - id: micro-behaviors/fs/directory/traverse::ftw
      - id: micro-behaviors/fs/directory/traverse::rust-recursive-search
      - id: micro-behaviors/fs/directory/traverse::java-listfiles-directory-descent
      - id: micro-behaviors/fs/directory/enumerate::findfirst
      - id: micro-behaviors/fs/directory/enumerate::findnext
      - id: micro-behaviors/fs/directory/traverse::traverse-rglob-call
