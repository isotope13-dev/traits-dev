defaults:
  platforms:
  - windows
  for:
  - pe

traits:
  - id: findfirst
    desc: Find first file (DOS/Windows)
    crit: notable
    conf: 0.8
    if:
      type: symbol
      regex: '^_?findfirst(64)?$'
  - id: findnext
    desc: Find next file (DOS/Windows)
    crit: notable
    conf: 0.8
    if:
      type: symbol
      regex: '^_?findnext(64)?$'
