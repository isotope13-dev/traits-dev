defaults:
  for:
    - pe
  platforms:
    - windows
composite_rules:
  - id: recursive-directory-traversal-source
    desc: Directory walker and cwd API name clues
    crit: notable
    conf: 0.9
    for:
      - c
    all:
      - id: metadata/lang/source/naming/function/file::set-current-directory-source
      - id: micro-behaviors/fs/directory/readdir/native::find-file-source-walker
    any:
      - id: metadata/lang/source/naming/function/file::get-current-directory-source
