defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1083
composite_rules:
  - id: rust-directory-enumeration-capability
    desc: Rust filesystem enumeration capability
    crit: notable
    conf: 0.92
    for: [rust, binaries]
    any:
      - id: micro-behaviors/fs/directory/traverse::rust-walkdir-capability
      - id: micro-behaviors/fs/directory/readdir/language::rust-read-dir
