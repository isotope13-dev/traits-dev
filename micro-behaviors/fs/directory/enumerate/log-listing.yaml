defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: shell-var-log-directory-listing
    desc: Lists entries in the system log directory
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^(/bin/|/usr/bin/)?ls$'
      arg:
        kind: identifier
        name: /var/log
