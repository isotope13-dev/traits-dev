# Process root changes to a mounted filesystem path.
defaults:
  platforms:
  - unix
  crit: notable
traits:
- for:
  - scripts
  - binaries
  id: host-root-chroot-command
  desc: Command chroots into mounted host path
  conf: 0.96
  if:
    type: text
    regex: (?i)\bchroot\s+/(host|mnt|rootfs)\b
- for:
  - scripts
  - binaries
  id: host-root-chroot-argv
  desc: Argv chroots into mounted host path
  conf: 0.96
  if:
    type: text
    regex: '["'']chroot["'']\s*,\s*["'']/(host|mnt|rootfs)["'']'
composite_rules:
- for:
  - shell
  - python
  - go
  - c
  - cpp
  - elf
  id: host-root-chroot
  desc: Changes process root to a mounted host path
  conf: 0.97
  any:
  - id: host-root-chroot-command
  - id: host-root-chroot-argv
