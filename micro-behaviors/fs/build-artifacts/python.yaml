# Removing package metadata while cleaning a Python build tree is ordinary
# packaging activity. Self-deletion intent is inferred by the objective
# composite that combines this behavior with package self-location and cache
# removal.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.94

traits:
  - id: python-package-metadata-removal-before-rmtree
    desc: Python removes metadata before rmtree
    if:
      type: text
      regex: '(?i)(dist-info|egg-info)[\s\S]{0,80}shutil\.rmtree'
  - id: python-package-metadata-removal-after-rmtree
    desc: Python rmtree targets package metadata
    if:
      type: text
      regex: '(?i)shutil\.rmtree[\s\S]{0,80}(dist-info|egg-info)'
