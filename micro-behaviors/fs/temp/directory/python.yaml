defaults:
  platforms:
    - unix
    - windows
  for:
    - python
    - pyc
traits:
  - id: directory-python
    desc: Temp directory string lookup
    crit: baseline
    conf: 0.66
    if:
      type: text
      substr: gettempdir
  - id: directory-python-symbol
    desc: Gets temp directory path
    crit: baseline
    conf: 0.75
    if:
      type: symbol
      exact: tempfile.gettempdir
  - id: python-temporary-directory-context
    desc: Uses a Python TemporaryDirectory context
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(TemporaryDirectory|tempfile\.TemporaryDirectory)'
  - id: python-tempdir-exe
    desc: Stages EXE under temp directory
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'gettempdir\(\)[\s\S]{0,80}\.exe'
  - id: python-named-temp-exe
    desc: Temporary file uses an EXE suffix
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'NamedTemporaryFile\([^)\n]{0,120}suffix\s*=\s*["'']\.exe["'']'
  - id: tmp-prefix-token
    desc: Temporary path uses tmp_ name prefix
    crit: notable
    conf: 0.9
    platforms: [windows]
    if:
      # CPython marshal SHORT_ASCII (`\xda` + len) for the 'tmp_' const, then
      # an .exe ASCII const within a short bytecode span (tmp_NNNNN.exe drop).
      type: raw
      regex: '\xda\x04tmp_.{0,48}\x7a\x04\.exe'
composite_rules:
  - id: temp-directory
    desc: Gets system temp directory
    crit: baseline
    conf: 0.75
    any:
      - id: directory-python
      - id: directory-python-symbol
