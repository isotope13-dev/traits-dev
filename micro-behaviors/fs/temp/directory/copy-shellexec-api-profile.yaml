defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
- id: temp-copy-shellexec-api-profile
  desc: Temp, self-path, copy and ShellExecute API sets
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  - id: micro-behaviors/process/create/shellexec::shell-execute-a
  - id: micro-behaviors/fs/path/check::get-module-filename
  any:
  - id: micro-behaviors/fs/file/copy::copyfile-w
  - id: micro-behaviors/fs/file/copy::copyfile-a
  - id: micro-behaviors/fs/file/move::move-file
  - id: micro-behaviors/fs/file/move::move-file-ex
  unless:
  - id: metadata/binary/framework/
  - id: metadata/binary/installer/
  - id: well-known/tool/
  - id: well-known/app/
  - id: well-known/lib/native/pywin32::pywin32-binding-module
  # The MFC runtime itself copies and shell-executes files for its own shell
  # helpers; shipping mfc*.dll beside an installer is not a staged loader.
  - id: well-known/lib/platform/mfc::mfc-runtime-basename
