defaults:
  crit: baseline
  conf: 0.66
  platforms: [linux, macos]
  for: [elf, macho, c, cpp]
traits:
  - id: directory-create
    desc: Create temporary directory
    if:
      type: symbol
      regex: mkdtemp
composite_rules:
  - id: directory-env
    desc: Read temp directory from TMPDIR
    mbc: E1083
    attack: T1083
    all:
      - id: micro-behaviors/os/env/user-paths::tmpdir-var
      - id: micro-behaviors/os/env/read::getenv
