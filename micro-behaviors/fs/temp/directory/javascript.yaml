# Temporary Directory Operations - JavaScript/Node.js
# MBC: E1083 (File and Directory Discovery)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: os-tmpdir
    desc: Uses the Node.js system temporary directory
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      kind: member
      regex: '(^|\.)tmpdir$'
  - id: node-vsix-temp-path
    desc: Builds VSIX path in Node temp
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)tmpdi[\s\S]{0,320}\.vsix\b'
  - id: node-computed-tmpdir-fragment
    desc: Contains split temp-directory property
    crit: component
    conf: 0.9
    if:
      type: string_literal
      exact: tmpdi
  # mkdtemp asks the OS for a directory name nobody can predict, so whatever is
  # written there cannot be found by path alone. Ordinary build tooling uses it
  # for scratch space; droppers use it to stage a downloaded runtime or payload
  # that is unlinked again once it has run. Neutral on its own — the staging
  # composites in objectives/ supply the intent.
  - id: node-mkdtemp-os-tmpdir
    desc: Creates a randomized temp staging directory
    crit: notable
    conf: 0.88
    if:
      type: text
      # Obfuscated loaders bind `fs`/`path`/`os` to hex ids, so require the
      # mkdtemp(+Sync) call with a tmpdir() argument rather than literal
      # `path.join(os.tmpdir()`.
      regex: '\.mkdtemp(Sync)?\s*\(\s*([\w$.]+\.join\s*\(\s*)?[\w$.]*tmpdir\s*\('
  - id: tmpdir-variable
    desc: "var named tmpDir referencing temp dir"
    crit: baseline
    conf: 0.6
    if:
      type: text
      word: tmpDir
  - id: tempdir-variable
    desc: "var named tempDir referencing temp dir"
    crit: baseline
    conf: 0.6
    if:
      type: text
      word: tempDir
