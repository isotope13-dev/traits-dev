defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
traits:
  - id: get-temp-path-dup
    desc: Look up temp directory via GetTempPath
    crit: baseline
    conf: 0.66
    if:
      type: text
      regex: ^GetTempPath(2)?[AW]?$
  # The anchored text form above only matches a PE import name. On C/C++ source
  # the API appears as a call target, which a bare `type: text`/`symbol` never
  # sees — so a source-scoped call matcher is required to catch it.
  - id: get-temp-path-source-call
    desc: Look up temp directory via GetTempPath call
    crit: baseline
    conf: 0.66
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      regex: ^GetTempPath(2)?[AW]?$
  - id: get-temp-file-name
    desc: Build temporary file name via GetTempFileName
    crit: baseline
    conf: 0.75
    if:
      type: text
      regex: ^GetTempFileName[AW]$
composite_rules:
  - id: temp-file-staging-primitives
    desc: Temp directory staging primitives
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/fs/temp/directory::get-temp-path-dup
    any:
      - id: get-temp-file-name
      - id: micro-behaviors/fs/file/move::move-file-ex
    unless:
      - id: metadata/library/generated::winmd-metadata
