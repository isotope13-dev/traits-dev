defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: gettemppath2w-rdata-reference
    desc: "GetTempPath2W name in read-only data"
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: GetTempPath2W
      section: .rdata
    unless:
      - id: micro-behaviors/fs/temp/directory::get-temp-path-name

  - id: gettempfilename-rdata-reference
    desc: "GetTempFileName name in read-only data"
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: ^GetTempFileName[AW]?$
      section: .rdata
    unless:
      - id: micro-behaviors/fs/temp/directory::get-temp-file-name


composite_rules:
  - id: temp-path-and-file-api-references
    desc: Temp-path and temp-file API name references
    crit: notable
    conf: 0.85
    needs: 2
    any:
      - id: gettemppath2w-rdata-reference
      - id: gettempfilename-rdata-reference
    unless:
      - id: well-known/app/utility/siw::siw-family-identity
      - id: metadata/binary/bundle::nodejs-sea-runtime

