composite_rules:
- platforms:
  - windows
  for:
  - pe
  id: temp-path-file-open-launch-api-profile
  desc: Temp-path, file-open and launch API references
  crit: notable
  conf: 0.8
  size_max: 10485760
  all:
  - id: micro-behaviors/fs/temp/directory::get-temp-path-name
  - id: micro-behaviors/fs/file/open::fopen
  any:
  - id: micro-behaviors/process/create/exec::create-process-a
  - id: micro-behaviors/process/create/shellexec::shell-execute-a
