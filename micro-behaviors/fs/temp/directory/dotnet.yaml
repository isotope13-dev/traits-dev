defaults:
  platforms: [windows, unix]
  for: [csharp]
traits:
  - id: dotnet-get-temp-path-call
    desc: C# Path.GetTempPath call
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\b(System\.IO\.)?Path\s*\.\s*GetTempPath\s*\('
composite_rules:
  - id: temp-file-staging-dotnet
    desc: C# temporary-directory and path manipulation calls
    crit: notable
    conf: 0.9
    all:
      - id: dotnet-get-temp-path-call
    any:
      - id: micro-behaviors/fs/path-ops/join::dotnet-combine-method-token
      - id: micro-behaviors/fs/path-ops/parse::dotnet-get-directory-name-token
