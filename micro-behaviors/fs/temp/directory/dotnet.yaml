defaults:
  platforms:
  - windows
  - unix
  for:
  - csharp
  crit: notable
traits:
- id: dotnet-get-temp-path-call
  desc: C# Path.GetTempPath call
  conf: 0.94
  if:
    type: text
    regex: \b(System\.IO\.)?Path\s*\.\s*GetTempPath\s*\(
composite_rules:
- id: temp-file-staging-dotnet
  desc: C# temporary-directory and path manipulation calls
  conf: 0.9
  all:
  - id: dotnet-get-temp-path-call
  any:
  - id: micro-behaviors/fs/path-ops::dotnet-combine-method-token
  - id: micro-behaviors/fs/path-ops::dotnet-get-directory-name-token
