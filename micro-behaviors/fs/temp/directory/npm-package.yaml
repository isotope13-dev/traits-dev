defaults:
  platforms: [unix, windows]
traits:
  - id: npm-postinstall-temp-package-reference
    desc: Postinstall temp utility and manifest references
    crit: notable
    conf: 0.96
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '(?is)(mktemp|tmpdir|mkdtemp).{0,180}package\.json'
