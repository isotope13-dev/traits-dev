defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: embedded-pe-script-host-temp-api-profile
  desc: Embedded PE and script-host name with temp/launch APIs
  crit: notable
  conf: 0.94
  all:
  - id: metadata/binary/layout/embedded::pe-embedded
  - id: micro-behaviors/process/info/name::windows-script-host-executable-reference
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  any:
  - id: micro-behaviors/process/create/exec::create-process-a
  - id: micro-behaviors/process/create/spawn::child-process-creation-api
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/sysadmin/
  - id: well-known/tool/development/
  - id: well-known/tool/detection/
