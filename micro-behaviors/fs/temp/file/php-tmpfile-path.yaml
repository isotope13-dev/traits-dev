# PHP tmpfile() returns an anonymous handle; reading its 'uri' from
# stream_get_meta_data() recovers a real filesystem path that can then be
# passed to include, exec or another process.
defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: php-tmpfile-meta-uri
    desc: Reads tmpfile path from stream metadata
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?s)tmpfile\s*\(\s*\).{0,160}stream_get_meta_data\s*\(.{0,120}\[\s*[''"]uri[''"]\s*\]'
