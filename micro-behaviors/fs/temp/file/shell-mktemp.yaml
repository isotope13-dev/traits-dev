defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.98
traits:
  - id: shell-mktemp-file-call
    desc: Shell creates default temporary file
    unless:
      - type: function
        exact: mktemp
    if:
      type: tree-sitter
      language: shell
      query: |
        (command name: (command_name (word) @name) !argument
          (#match? @name "^(/usr/bin/)?mktemp$"))
