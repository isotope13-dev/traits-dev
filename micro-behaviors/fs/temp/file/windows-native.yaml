defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, zig, python]

traits:
  - id: ntcreatefile-hidden-attribute
    desc: NtCreateFile uses hidden file attributes
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?s)\bNtCreateFile\s*\([^;]{0,900}\bFILE_ATTRIBUTE_HIDDEN\b'

  - id: ntcreatefile-delete-on-close
    desc: NtCreateFile uses delete-on-close semantics
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?s)\bNtCreateFile\s*\([^;]{0,900}\bFILE_DELETE_ON_CLOSE\b'

composite_rules:
  - id: ntcreatefile-hidden-delete-on-close
    desc: Creates a hidden delete-on-close file
    crit: notable
    conf: 0.97
    near_lines: 24
    all:
      - id: ntcreatefile-hidden-attribute
      - id: ntcreatefile-delete-on-close
