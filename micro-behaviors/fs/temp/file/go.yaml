defaults:
  crit: baseline
  platforms:
    - unix
    - windows
  for: [go, elf, macho, pe, wasm]
traits:
  - id: go-tempfile-api-reference
    desc: References Go temporary-file creation API
    crit: notable
    conf: 0.9
    if:
      type: symbol
      regex: ^(ioutil\.TempFile|os\.CreateTemp)$
  - id: create-temp-runtime-string
    desc: Go CreateTemp runtime string
    conf: 0.82
    for: [elf, macho, pe]
    if:
      type: text
      exact: createtemp
