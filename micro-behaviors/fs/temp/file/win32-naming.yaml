defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
traits:
  - id: get-temp-file-name
    desc: GetTempFileName temporary-file API reference
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: ^GetTempFileName[AW]$
composite_rules:
  - id: temp-path-file-api-primitives
    desc: Temp-path lookup beside file naming or move APIs
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-reference
    any:
      - id: micro-behaviors/fs/temp/file::get-temp-file-name
      - id: micro-behaviors/fs/file/move::move-file-ex
    unless:
      - id: metadata/build/generated::winmd-metadata
