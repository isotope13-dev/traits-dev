defaults:
  platforms:
    - windows
  for:
    - pe
traits:
  - id: py2exe-pythondll
    desc: py2exe embedded Python DLL reference
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: python[0-9]+\.dll
  - id: py2exe-scriptres
    desc: py2exe SCRIPT resource marker
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: PYTHONSCRIPT
composite_rules:
  - id: py2exe-packed-executable
    desc: py2exe packed Windows executable
    crit: notable
    conf: 0.9
    all:
      - id: py2exe-pythondll
      - id: py2exe-scriptres
    any:
      - id: metadata/package/files/name::zipimport-bytecode-member
      - id: py2exe-verbose-env
      - id: py2exe-activation-ctx-error
