defaults:
  platforms: [windows]
  for: [zip]

traits:
  - id: archive-zip-pyarmor-runtime
    desc: ZIP member path for PyArmor runtime
    crit: notable
    conf: 0.94
    if:
      type: value
      path: archive.members[*].path
      regex: (?i)(^|/)[^/]{0,96}/pyarmor_runtime[_0-9a-f-]{0,16}/pyarmor_runtime\.pyd$

  - id: archive-zip-psutil-windows-member
    desc: ZIP member path for Windows psutil extension
    crit: notable
    conf: 0.9
    if:
      type: value
      path: archive.members[*].path
      regex: (?i)(^|/)psutil/_psutil_windows\.pyd$

  - id: archive-embeddable-python-exe
    desc: ZIP member path for embeddable python.exe
    crit: notable
    conf: 0.88
    if:
      type: value
      path: archive.members[*].path
      regex: (?i)(^|/)python\.exe$
