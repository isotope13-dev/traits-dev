# PyInstaller stealer builders name the encrypted wrapper script with a
# "crypted_" prefix in the archive table of contents, so the entry point shown
# to the bootloader is a decrypt-and-run stub rather than the real program.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.8
  attack: T1027.002
traits:
  - id: pyinstaller-crypted-script-entry
    desc: PyInstaller TOC names a crypted_ script entry
    if:
      type: raw
      regex: 'scrypted_[a-z0-9]{4,16}\x00'
      offset_range: [-16384, null]
