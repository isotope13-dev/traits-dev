# Shell dry-run temporary path reservation (`mktemp -u`), distinct from creating
# a file on disk (`micro-behaviors/fs/temp/file::shell-mktemp-file-call`).
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.96

traits:
  - id: shell-mktemp-dry-run
    desc: Shell reserves dry-run mktemp path
    unless:
      - type: function
        exact: mktemp
    if:
      type: symbol
      kind: call
      exact: mktemp
      arg:
        kind: identifier
        name: "-u"
