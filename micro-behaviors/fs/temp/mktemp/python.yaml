defaults:
  crit: baseline
  platforms: [windows, unix]
  for: [python]
traits:
  - id: tempfile-mkstemp
    conf: 0.9
    desc: tempfile.mkstemp call
    if:
      type: symbol
      kind: call
      exact: tempfile.mkstemp
  - id: tempfile-mkdtemp
    conf: 0.9
    desc: tempfile.mkdtemp call
    if:
      type: symbol
      kind: call
      exact: tempfile.mkdtemp
  - id: tempfile-named-temporary-file
    conf: 0.9
    desc: tempfile.NamedTemporaryFile call
    if:
      type: symbol
      kind: call
      exact: tempfile.NamedTemporaryFile
  - id: python-tempfile-named
    mbc: C0016
    desc: tempfile.NamedTemporaryFile usage
    conf: 0.6
    if:
      type: string_literal
      substr: tempfile.NamedTemporaryFile
  - id: python-tempfile-mkstemp
    mbc: C0016
    desc: tempfile.mkstemp usage
    conf: 0.6
    if:
      type: string_literal
      substr: tempfile.mkstemp
composite_rules:
  - id: python-tempfile
    mbc: C0016
    desc: Temporary file creation (tempfile module)
    conf: 0.7
    any:
      - id: micro-behaviors/fs/temp/mktemp::python-tempfile-named
      - id: micro-behaviors/fs/temp/mktemp::python-tempfile-mkstemp
      - id: micro-behaviors/fs/temp/mktemp::tempfile-mkdtemp
