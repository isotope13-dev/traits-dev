defaults:
  crit: baseline
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
  - id: tempfile-ref
    desc: Reference to tempfile module
    conf: 0.7
    if:
      # Not preceded by `/`: Go binaries carry the stdlib source path
      # `os/tempfile.go` in their line tables, which is not the module.
      type: text
      regex: '(^|[^/\w])tempfile\b'
  - id: environ-tmp
    desc: Reference to TMP environment variable
    conf: 0.7
    if:
      type: text
      regex: environ\[['"]TMP
composite_rules:
  - id: temp-dir-reference
    desc: Reference to a temporary directory
    conf: 0.4
    any:
      - id: metadata/file/string/file::tmp
      - id: micro-behaviors/fs/temp/reference::environ-tmp
      - id: micro-behaviors/fs/temp/reference::tempfile-ref
