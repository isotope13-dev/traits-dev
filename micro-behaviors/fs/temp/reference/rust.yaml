defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1056.001
  mbc: B0015

composite_rules:
  - id: rust-temp-log-name-construction
    desc: "Rust temporary log name construction"
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/fs/path/reference::log-filename-template
      - id: metadata/file/naming::rust-random-name-module
      - id: micro-behaviors/fs/path/temp::rust-temp-dir
    any:
      - id: micro-behaviors/data/format/string::formatted-heading-template
      - id: micro-behaviors/os/event/loop::tokio-spawn
