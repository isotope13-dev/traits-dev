defaults:
  platforms: [macos]
  for: [macho, python, shell, applescript]
  crit: notable
  conf: 0.85

traits:
  - id: remove-app-then-unzip
    desc: Removes an app bundle then runs unzip
    conf: 0.7
    if:
      type: text
      regex: rm.{0,50}\.app.{0,30}&&.{0,30}unzip
  - id: remove-app-then-copy
    desc: Removes an app bundle then runs cp
    conf: 0.7
    if:
      type: text
      regex: rm.{0,50}\.app.{0,30}&&.{0,30}cp

composite_rules:
  - id: remove-app-then-copy-or-unzip
    desc: Removes an application before copying or unzipping
    conf: 0.85
    any:
      - id: remove-app-then-unzip
      - id: remove-app-then-copy
