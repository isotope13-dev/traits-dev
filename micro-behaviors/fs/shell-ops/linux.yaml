defaults:
  platforms: [unix]
  for: [elf, rust, shell]
  crit: notable
  conf: 0.9

traits:
  # Split from a single `(rm -rf|shred)` alternation (2026-07): the two branches
  # are independent signals, not spellings of one. `rm -f`/`rm -rf` is in every
  # installer, cleanup script and Makefile -- Debian's own libselinux1.postinst
  # runs one -- while `shred` is an anti-forensic secure-wipe tool present in a
  # tiny fraction of scripts. Merged, every ordinary cleanup carried an atom
  # whose name announced a wiping tool it never invoked, and no composite could
  # weight `shred /var/log/audit/...` above `rm -f` on the same path. Both stay
  # neutral until an objective composite correlates them with the audit path.
  - id: rm-force-command-fragment
    desc: rm force/recursive command fragment
    crit: component
    conf: 0.9
    for: [elf, go, rust, shell]
    if:
      type: text
      regex: 'rm\s+-[rf]+(\s+-\S+){0,4}\s+'

  - id: shred-command-fragment
    desc: shred secure-wipe command fragment
    crit: component
    conf: 0.9
    for: [elf, go, rust, shell]
    if:
      type: text
      regex: 'shred(\s+-\S+){0,4}\s+'

  - id: cp-command
    desc: Shell text contains a cp file-copy command
    if:
      type: text
      regex: '(^|[\s;&|`$({])cp[ \t]+[-"''$~./][^\r\n;&|]{1,200}'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
      - id: metadata/package/files/system-package::shell-completion-script
