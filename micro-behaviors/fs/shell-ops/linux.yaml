defaults:
  platforms: [unix]
  for: [elf, rust, shell]
  crit: notable
  conf: 0.9

traits:
  # Split from a single `(rm -rf|shred)` alternation (2026-07): the two branches
  # are independent signals, not spellings of one. `rm -f`/`rm -rf` is in every
  # installer, cleanup script and Makefile -- Debian's own libselinux1.postinst
  # runs one -- while `shred` is an anti-forensic secure-wipe tool present in a
  # tiny fraction of scripts. Merged, every ordinary cleanup carried an atom
  # whose name announced a wiping tool it never invoked, and no composite could
  # weight `shred /var/log/audit/...` above `rm -f` on the same path. Both stay
  # neutral until an objective composite correlates them with the audit path.
  - id: rm-force-command-fragment
    desc: rm force/recursive command fragment
    crit: component
    conf: 0.9
    for: [elf, go, rust, shell]
    if:
      type: text
      regex: 'rm\s+-[rf]+(\s+-\S+){0,4}\s+'

  - id: shred-command-fragment
    desc: shred secure-wipe command fragment
    crit: component
    conf: 0.9
    for: [elf, go, rust, shell]
    if:
      type: text
      regex: 'shred(\s+-\S+){0,4}\s+'

  # Same family as the rm/shred fragments above: `truncate -s 0` zeroes a file
  # but names no target, so on its own it is an ordinary truncation primitive
  # (log rotation, cache resets). It stays a neutral fragment until an objective
  # composite correlates it with the path being cleared. Relocated from
  # objectives/evasion/indicator-removal/audit/ (2026-09), where it was named
  # `go-audit-truncate-clear` despite matching neither Go nor an audit path --
  # it fired as "audit log clearing" on IoT bot `truncate -s 0 /var/log/auth*`.
  - id: truncate-zero-command-fragment
    desc: truncate -s 0 zero-size command fragment
    crit: component
    conf: 0.9
    for: [elf, go, rust, shell]
    if:
      type: text
      regex: 'truncate\s+-s\s*0\s+'
composite_rules:
