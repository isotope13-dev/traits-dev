defaults:
  platforms: [unix]
  for: [elf, rust, shell]
  crit: notable
  conf: 0.9

traits:
  # The first argument must open with an option flag, path, variable, or quote
  # sigil -- the shape every real `cp` invocation has. Without that anchor the
  # word `cp` followed by any prose matched, so help text and documentation that
  # merely *names* the tool ("similar to the traditional cp utility, but ...",
  # "the cp command copies files") read as a copy being performed.
  - id: cp-command
    desc: Invokes cp file-copy command
    if:
      type: text
      regex: '(^|[\s;&|`$({])cp[ \t]+[-"''$~./][^\r\n;&|]{1,200}'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
      - id: metadata/package/files/system-package::shell-completion-script
