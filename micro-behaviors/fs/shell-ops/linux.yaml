defaults:
  platforms: [unix]
  for: [elf, rust, shell]
  crit: notable
  conf: 0.9

traits:
  # A command fragment is neutral until it is correlated with the audit-log
  # path by the indicator-removal objective composite.
  - id: rm-shred-command-fragment
    desc: rm or shred shell command fragment
    crit: component
    conf: 0.9
    for: [elf, go, rust, shell]
    if:
      type: text
      regex: '(rm\s+-[rf]+|shred)(\s+-\S+){0,4}\s+'

  - id: cp-command
    desc: Invokes cp file-copy command
    if:
      type: text
      regex: '(^|[\s;&|`$({])cp[ \t]+[-"''$~./][^\r\n;&|]{1,200}'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
      - id: metadata/package/files/system-package::shell-completion-script
