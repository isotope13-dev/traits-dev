defaults:
  crit: notable
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: fileutils-single-quote
    desc: '''fileutils'' require string'
    conf: 0.5
    if:
      type: string_literal
      substr: '''fileutils'''
  - id: fileutils-double-quote
    desc: '"fileutils" require string'
    conf: 0.5
    if:
      type: string_literal
      substr: '"fileutils"'
composite_rules:
  - id: ruby-fileutils
    desc: Imports FileUtils library
    conf: 0.6
    any:
      - id: micro-behaviors/fs/shell-ops::fileutils-single-quote
      - id: micro-behaviors/fs/shell-ops::fileutils-double-quote
