defaults:
  platforms: [macos]
  for: [scripts, source, class, java_class]
  crit: notable
  conf: 0.9

traits:
  - id: xattr-tool-literal
    desc: Literal references the xattr utility
    # This is a utility/command reference, not proof of invocation, attribute
    # deletion, quarantine removal, or a relation to another file in the source.
    if:
      type: literal
      regex: '^(/usr/bin/)?xattr(\s|$)'

  - id: class-xattr-tool
    desc: Class string references the xattr utility
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      exact: xattr
