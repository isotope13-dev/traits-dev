defaults:
  platforms: [macos]
  for: [shell]
traits:
  - id: shell-clear-sign-open-same-app
    desc: Clears attributes, signs and opens same app
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      language: shell
      query: |
        (program
          (command name: (command_name (word) @xattr)
            . argument: (word) @clear . argument: (word) @cleared .)
          . (command name: (command_name (word) @codesign)
            . argument: (word) @force . argument: (word) @deep
            . argument: (word) @sign . argument: (word) @adhoc
            . argument: (word) @signed .)
          . (command name: (command_name (word) @open)
            . argument: (string . (string_content) @opened .) .)
          (#eq? @xattr "xattr") (#match? @clear "^-(cr|rc)$")
          (#eq? @codesign "codesign") (#eq? @force "--force")
          (#eq? @deep "--deep") (#eq? @sign "--sign") (#eq? @adhoc "-")
          (#eq? @open "open") (#eq? @cleared @signed) (#eq? @signed @opened)
          (#match? @opened "^/tmp/\\.[^/]+\\.app$"))
