# kMDItemWhereFroms holds the URL(s) a file was downloaded from. Installer
# scripts that read it for their own package can recover the referring URL
# and its campaign query parameters; this atom claims only the read.
defaults:
  platforms: [macos]
  for: [shell]
  crit: notable
traits:
  - id: shell-read-download-origin
    desc: Reads macOS download-origin metadata
    conf: 0.96
    attack: T1082
    if:
      type: text
      exclude_comments: true
      regex: '\b(xattr\s+-[lpxz][^\n;|w]{0,30}|mdls\s[^\n;|]{0,30})kMDItemWhereFroms\b'
