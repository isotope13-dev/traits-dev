# The sequence does not prove quarantine was present or Gatekeeper bypassed.
defaults:
  platforms: [macos]
traits:
  - id: xattr-clear-before-chmod-or-launch
    desc: xattr clearing before chmod or relative launch
    crit: notable
    conf: 0.9
    for:
      - shell
    if:
      type: text
      regex: xattr\s+-c\s+[^&\n]{1,120}&&[^&\n]{0,120}(chmod|\.\/)
