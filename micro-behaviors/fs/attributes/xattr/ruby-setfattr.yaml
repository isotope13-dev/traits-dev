defaults:
  platforms: [linux]
  for: [ruby]
traits:
  - id: ruby-setfattr-delete-command
    desc: Ruby subshell removes named extended attribute
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        (subshell (string_content) @command
          (#match? @command "^setfattr +(-x|--remove) +")) @remove
