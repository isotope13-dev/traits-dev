defaults:
  for: [javascript, typescript]
  platforms: [macos]
  crit: notable
  conf: 0.96

traits:
  - id: node-quarantine-attribute-delete
    desc: Node argv deletes macOS quarantine attribute
    mbc: E1222
    attack: T1222
    if:
      type: text
      regex: '["'']xattr["'']\s*,\s*\[[^]]{0,60}["'']-d["''][^]]{0,60}com\.apple\.quarantine'

  # The argv-array spelling of the clear-all form: `execFile('xattr',
  # ['-cr', path])` removes every extended attribute, quarantine included.
  # Unpack helpers also run this on bundled files, so it stays notable;
  # consumers supply the download or persistence context.
  - id: node-xattr-clear-argv
    desc: Node argv clears extended attributes
    mbc: E1222
    attack: T1222
    if:
      type: text
      regex: '[''\"]xattr[''\"]\s*,\s*\[[^\]]{0,80}[''\"]-[a-z]*c[a-z]*[''\"]'

  - id: node-shell-quarantine-attribute-delete
    desc: Node shell command deletes macOS quarantine
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(exec|execSync)$'
      arg:
        index: 0
        kind: string
        regex: '^xattr\s+-[rsvx]*d[rsvx]*\s+com\.apple\.quarantine\s+'
