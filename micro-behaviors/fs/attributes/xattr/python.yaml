# Quarantine deletion is a filesystem operation, not proof of evasion.
# Match an executable Python argv list, excluding comments and docstrings.
defaults:
  platforms: [macos]
  for: [python]
traits:
  - id: python-xattr-quarantine-argv
    desc: Python argv specifies macOS quarantine deletion
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        (call
          function: (_) @launcher
          arguments: (argument_list
            (list
              . (string) @tool
              (string)*
              (string) @delete
              . (string) @attribute) @argv)
          (#match? @launcher "^(subprocess[.])?(run|Popen|call)$")
          (#match? @tool "^[\"'](/usr/bin/)?xattr[\"']$")
          (#match? @delete "^[\"']-d[\"']$")
          (#match? @attribute "^[\"']com[.]apple[.]quarantine[\"']$"))
