defaults:
  platforms: [macos]
  for: [pkg]
composite_rules:
- id: macpkg-xattr-dylib-download-clues
  desc: Installer hook, dylib, xattr, and download clues
  crit: suspicious
  conf: 0.99
  scope: archive
  platforms: [macos, windows, linux]
  for: [source, scripts, '!jcl', '!vbs', class, macho, pe, pkg]
  all:
    - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
    - id: micro-behaviors/fs/path/library::dylib-name-literal
    - id: micro-behaviors/fs/attributes/xattr::xattr-clear
    - id: micro-behaviors/communications/http/download/curl::curl-output-staging-path

