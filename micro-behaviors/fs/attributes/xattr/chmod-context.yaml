# Neutral mechanics; these conditions do not establish an attacker objective.
defaults:
  platforms: [macos]
  for: [shell]
composite_rules:
  - id: clear-with-executable-chmod
    desc: Attribute clearing near executable chmod
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/fs/attributes/xattr::xattr-clear
      - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
    near_bytes: 1024
    unless:
      - id: metadata/build/package/provenance::swift-app-bundle-code-sealing-context
      - id: well-known/tool/detection/stackrox::release-helper-context
