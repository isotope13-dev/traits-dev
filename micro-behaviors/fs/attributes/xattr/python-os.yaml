defaults:
  platforms:
  - linux
  - macos
  for:
  - python
traits:
- id: python-listxattr-call
  desc: Python enumerates extended file attributes
  crit: notable
  conf: 0.97
  if:
    type: symbol
    kind: call
    exact: os.listxattr
- id: python-getxattr-call
  desc: Python reads an extended file attribute
  crit: notable
  conf: 0.97
  if:
    type: symbol
    kind: call
    exact: os.getxattr
- id: python-setxattr-call
  desc: Python writes an extended file attribute
  crit: notable
  conf: 0.97
  if:
    type: symbol
    kind: call
    exact: os.setxattr
- id: python-removexattr-call
  desc: Python removes an extended file attribute
  crit: notable
  conf: 0.97
  if:
    type: symbol
    kind: call
    exact: os.removexattr
