# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: setxattr-syscall
    desc: Sets extended attributes via Linux syscall
    crit: notable
    if:
      type: syscall
      name: [setxattr, lsetxattr, fsetxattr]
      arch: [x86_64, aarch64]
  - id: removexattr-syscall
    desc: Removes extended attributes via Linux syscall
    crit: baseline
    if:
      type: syscall
      name: [removexattr, lremovexattr, fremovexattr]
      arch: [x86_64, aarch64]
