defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.97
traits:
  - id: printf-xattr-name-format
    desc: printf constructs an xattr command name
    if:
      type: symbol
      kind: call
      exact: printf
      arg:
        index: 0
        kind: string
        regex: '^(x|\\170|\\x78)(a|\\141|\\x61)(t|\\164|\\x74)(t|\\164|\\x74)(r|\\162|\\x72)$'
  - id: printf-xattr-name-percent-b
    desc: printf constructs an xattr command name
    if:
      type: symbol
      kind: call
      exact: printf
      args:
        - index: 0
          kind: string
          exact: '%b'
        - index: 1
          kind: string
          regex: '^(x|\\170|\\x78)(a|\\141|\\x61)(t|\\164|\\x74)(t|\\164|\\x74)(r|\\162|\\x72)$'


composite_rules:
  - id: printf-xattr-name
    desc: printf constructs an xattr command name
    conf: 0.97
    any:
      - id: printf-xattr-name-format
      - id: printf-xattr-name-percent-b
