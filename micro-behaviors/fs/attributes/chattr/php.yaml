# A quoted command alone is a reference; this requires a process call.
defaults:
  platforms: [linux]
  for: [php]
traits:
  - id: php-execute-set-immutable
    desc: PHP executes chattr to set immutability
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^(system|exec|shell_exec|passthru)$'
      arg:
        index: 0
        kind: string
        regex: '^\s*chattr[ \t]+\+[a-z]*i[a-z]*[ \t]+\S'
