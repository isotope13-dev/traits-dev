defaults:
  platforms:
  - linux
  for:
  - shell
traits:
- id: authorized-keys-set-immutable
  desc: chattr sets immutability on SSH authorized_keys
  crit: notable
  conf: 0.99
  if:
    type: tree-sitter
    kind: call
    regex: ^chattr[ \t]+\+[a-z]*i[a-z]*[ \t]+[^\n;|&]{0,160}authorized_keys\b
