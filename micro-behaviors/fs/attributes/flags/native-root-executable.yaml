defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: attrib-system-hidden-root-executable-command
    desc: Attrib hides system/root-drive executable
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule attrib_system_hidden_root_executable_command {
          strings:
            $hide = /attrib +\+r +\+s +\+h +[A-Za-z]:\\[^ \r\n]{1,80}\.exe/ nocase
          condition:
            $hide
        }
