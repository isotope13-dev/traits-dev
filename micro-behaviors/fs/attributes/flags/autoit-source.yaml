defaults:
  platforms: [windows]
  for: [text, data, vbs]
traits:
  - id: autoit-set-hidden-system-attributes
    desc: AutoIt sets hidden and system file flags
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)FileSetAttrib\s*\([^\r\n]{1,160},\s*"\+[AR]*(H[AR]*S|S[AR]*H)'
