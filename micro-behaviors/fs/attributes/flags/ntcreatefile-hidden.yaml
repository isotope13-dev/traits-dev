traits:
- platforms:
  - windows
  for:
  - c
  - cpp
  - csharp
  - go
  - rust
  - zig
  - python
  id: ntcreatefile-hidden-attribute
  desc: NtCreateFile uses hidden file attributes
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?s)\bNtCreateFile\s*\([^;]{0,900}\bFILE_ATTRIBUTE_HIDDEN\b
