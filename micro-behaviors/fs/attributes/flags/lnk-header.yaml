# File-attribute bits recorded in a shortcut's own header (the link file, not
# its target).  Explorer hides a Hidden+System file from normal folder views.
defaults:
  for: [lnk]
  platforms: [windows]
  crit: notable
  conf: 0.95

traits:
  - id: lnk-header-hidden-attribute
    desc: LNK header marks the shortcut Hidden
    if:
      type: value
      path: 'lnk.header.file_attributes[*]'
      exact: hidden

  - id: lnk-header-system-attribute
    desc: LNK header marks the shortcut System
    if:
      type: value
      path: 'lnk.header.file_attributes[*]'
      exact: system

composite_rules:
  - id: lnk-header-hidden-system-attributes
    desc: LNK is both Hidden and System
    all:
      - id: lnk-header-hidden-attribute
      - id: lnk-header-system-attribute
