defaults:
  for: [c, cpp]
  platforms: [windows]
traits:
  - id: file-attribute-hidden-repeated
    desc: FILE_ATTRIBUTE_HIDDEN flag in source
    crit: notable
    conf: 0.88
    if:
      type: text
      word: "FILE_ATTRIBUTE_HIDDEN"
    count_min: 5
  - id: file-attribute-hidden-switch-field
    desc: Switch struct field sets hidden attribute
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'BOOL\s+attrib_hidden\s*;'
