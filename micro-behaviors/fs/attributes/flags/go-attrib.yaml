defaults:
  platforms: [windows]
  for: [go]
  crit: notable
  conf: 0.99

traits:
  - id: go-attrib-clear-readonly-command
    desc: Go constructs ATTRIB read-only clearing command
    if:
      type: symbol
      kind: call
      exact: exec.Command
      args:
        - index: 0
          kind: string
          regex: '(?i)^attrib(\.exe)?$'
        - kind: string
          regex: '(?i)^-R$'
