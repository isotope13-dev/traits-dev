defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: set-file-attributes-a
    desc: Set file attributes (ANSI)
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "SetFileAttributesA"
  - id: set-file-attributes-w
    desc: Set file attributes (Unicode)
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "SetFileAttributesW"
  - id: set-file-attributes-source
    desc: SetFileAttributes API in source
    crit: notable
    conf: 0.88
    for: [c, cpp]
    if:
      type: symbol
      exact: "SetFileAttributes"
  - id: file-attribute-hidden-source
    desc: Source sets the hidden file attribute
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?is)SetFileAttributes(A|W)?\s*\([^;]{0,240}\bFILE_ATTRIBUTE_HIDDEN\b'
