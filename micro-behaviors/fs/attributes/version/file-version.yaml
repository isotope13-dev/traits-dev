defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: get-file-version-info-size
    desc: Queries Windows file-version metadata size
    crit: notable
    conf: 0.8
    if:
      type: import
      exact: GetFileVersionInfoSizeA

  - id: shell-rcedit-resource-editor
    desc: Invokes rcedit PE resource editor
    crit: notable
    conf: 0.96
    platforms: [windows, unix]
    for: [shell]
    if:
      type: text
      regex: '(?mi)^\s*(wine\s+)?\S*rcedit(-x64)?\.exe\b'
