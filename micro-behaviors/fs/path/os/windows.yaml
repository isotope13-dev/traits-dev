# Windows Path Detection
# Capabilities related to handling Windows file paths
defaults:
  platforms: [windows]
  for: [pe, powershell, batch, vbs]
traits:
- id: hardcoded-windows-root
  for: [pe, powershell, batch]
  desc: Hardcoded Windows root path (C:\, D:\, etc.)
  crit: baseline
  conf: 0.8
  if:
    type: raw
    regex: '["''][A-Z]:[\\/][^"''\r\n<>|*?]{0,120}'
  # Rust embeds compiler input paths in release binaries. A Cargo registry
  # source path records build provenance, not a runtime filesystem target.
  not:
  - regex: '(?i)\.cargo[\\/]registry[\\/]src\b'
  unless:
  - type: basename
    regex: '\.vcxproj\.filters$'
  downgrade:
    any:
      - id: metadata/library/cloud-sdk::botocore-lib
      - id: metadata/import/python::boto3
      - id: well-known/lib/network/paramiko::paramiko-python-library
composite_rules: []
