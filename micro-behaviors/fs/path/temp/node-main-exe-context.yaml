defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: temp-main-exe-path-clues
    desc: Temporary path and main.exe name clues
    crit: notable
    conf: 0.94
    near_bytes: 80
    all:
      - id: micro-behaviors/fs/path/temp::any-temp-path
      - id: micro-behaviors/fs/path/executable::main-exe-name-text

