defaults:
  platforms: [linux, macos]
  for: [elf, macho, go, shell, python, javascript, typescript]
traits:
# Observes a hidden dotfile-shaped /tmp pathname, with ordinary desktop and
# temporary-directory exclusions. The name proves neither a state-file role
# nor staging, secrecy intent, creation, or execution.
- id: hidden-tmp-dotfile-path
  desc: Hidden dotfile path in /tmp
  crit: notable
  conf: 0.8
  for: [elf, macho, go, shell, python, javascript, typescript, swift]
  if:
    type: text
    # A slash after the hidden component means it is a directory prefix, not
    # the state file this trait describes; hidden directories are covered by
    # hidden-tmp-path in linux.yaml.
    regex: '(^|[^A-Za-z0-9_./-])/tmp/\.[A-Za-z0-9][A-Za-z0-9_-]{1,64}([^A-Za-z0-9._$/-]|$)'
  not:
    # Benign desktop/IPC sockets and lockfiles that live as hidden /tmp dotfiles.
    - regex: '/tmp/\.[A-Za-z0-9]+-unix'   # .X11-unix .ICE-unix .font-unix .XIM-unix
    - regex: '/tmp/\.X[0-9]+-lock'        # X server display locks
    - regex: '/tmp/\.s\.PGSQL'            # PostgreSQL unix-domain socket
    - regex: '/tmp/\.(pulse|esd|com\.apple)' # audio / macOS system sockets
    # Hidden mktemp/PID temp directories are working directories, not stashed
    # state files; keep literal hidden dotfiles such as /tmp/.foo_sent covered.
    - regex: '/tmp/\.[A-Za-z0-9][A-Za-z0-9._-]{1,64}\.X{3,}'
    - regex: '/tmp/\.[A-Za-z0-9][A-Za-z0-9._-]{1,64}\$\$'
    - substr: '.curl'
    - substr: '/tmp/.gocache'
    - substr: '/tmp/.noeta-tavily-'
    - substr: '/tmp/.homebrew_pkg_user'
  unless:
    - id: metadata/lang/upstream::linux-kernel-primary-tree-path
    - id: metadata/file/extension/identity::squashfs-container-filename
    - id: well-known/dual-use/remote-admin/x11vnc::x11vnc-binary
    - id: well-known/tool/detection/chkrootkit::source-tree
    - type: text
      substr: 'secrets.token_hex'
    - type: text
      regex: 'mktemp\s+-d\s+/tmp/\.[A-Za-z0-9][A-Za-z0-9._-]{1,64}\.X{3,}'
    - type: text
      regex: 'TMPDIR=/tmp/\.[A-Za-z0-9][A-Za-z0-9._-]{1,64}\$\$'
# Nearby path references can repeat one file; they prove no staging roles.
- id: hidden-tmp-file-cluster
  desc: Three nearby hidden /tmp path references
  crit: notable
  conf: 0.85
  for: [elf, macho]
  if:
    type: raw
    regex: '/tmp/\.\w{1,16}[^\w./-][^/]{0,32}/tmp/\.\w{1,16}[^\w./-][^/]{0,32}/tmp/\.\w'
  not:
    - substr: '-unix'
    - substr: '/tmp/.X'
