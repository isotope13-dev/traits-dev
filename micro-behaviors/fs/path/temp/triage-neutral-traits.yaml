---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.9
traits:
- id: multiple-temporary-directory-references
  desc: References multiple temporary storage paths
  if:
    type: text
    regex: "/tmp.{0,50}/var/tmp|/var/tmp.{0,50}/dev/shm|/tmp.{0,50}/dev/shm"
  unless:
  - type: basename
    regex: "^tempfile\\.py$"
  - id: metadata/lang/javascript-features::sourcemap-sources-content
