# Temp Path Access in PowerShell
defaults:
  platforms: [windows]
  for: [powershell, pe]
  crit: notable
  conf: 0.9
traits:
  - id: get-temp-path
    desc: Gets temp path
    if:
      type: text
      regex: '(?i)\[System\.IO\.Path\]::\s*GetTempPath'
  - id: env-temp
    desc: "Accesses temp environment variable"
    if:
      type: text
      regex: '(?i)\$env:(TEMP|TMP)\b'
  - id: join-path-temp-msi
    desc: Builds TEMP MSI staging path
    if:
      type: text
      regex: '(?i)Join-Path\s+\$env:(TEMP|TMP)\s+[''"].{1,80}\.msi[''"]'
  - id: combine-temp-msi
    desc: Combines TEMP with MSI filename
    if:
      type: text
      regex: '(?i)::Combine\(\s*\$env:(TEMP|TMP)\s*,[^\r\n;]{1,160}\.msi[''"]\s*\)'

  - id: temp-powershell-script-path
    desc: References a PowerShell script in TEMP
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)(%TEMP%|%TMP%|\$env:TEMP|\$env:TMP)[^\\\r\n]{0,40}\\[A-Za-z0-9._-]+\.ps1'

composite_rules:
  - id: temp-msi-staging
    desc: Builds TEMP MSI staging path
    any:
      - id: join-path-temp-msi
      - id: combine-temp-msi
