defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable
traits:
  - id: lnk-temp-batch-or-hta-path
    desc: LNK TEMP batch or HTA path reference
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: '%TEMP%\\\\?\S{1,40}\.(bat|cmd|hta)'
      case_insensitive: true
  - id: lnk-temp-executable-path
    desc: LNK TEMP executable path reference
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: '%TEMP%\\\\?\S{1,40}\.(exe|scr|com|pif)'
      case_insensitive: true
