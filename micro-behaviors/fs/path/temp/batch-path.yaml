defaults:
  platforms: [windows]
  for: [batch, powershell]

traits:
- id: temp-tmp-path-reference
  desc: TEMP .tmp path reference
  crit: suspicious
  conf: 0.82
  if:
    type: text
    regex: (?i)(%TEMP%|%TMP%|\$env:TEMP|\$env:TMP)[^\\\r\n]{0,40}\\[A-Za-z0-9._-]+\.tmp
  unless:
  - type: text
    regex: (?i)(%TEMP%|%TMP%)\\_(envset|envget)\.tmp\b
  - type: text
    substr: pscult.tmp
- id: temp-dat-path-reference
  desc: TEMP .dat path reference
  crit: suspicious
  conf: 0.84
  if:
    type: text
    regex: (?i)(%TEMP%|%TMP%|\$env:TEMP|\$env:TMP)[^\\\r\n]{0,40}\\[A-Za-z0-9._-]+\.dat
