defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: baseline
  conf: 0.7
traits:
  - id: batch-temp-file-assignment
    desc: Batch assigns temporary .dat or .tmp path
    crit: notable
    conf: 0.86
    for: [batch]
    platforms: [windows]
    if:
      type: text
      regex: (?i)\bset\s+[A-Za-z0-9_]{3,}=(%TEMP%|%TMP%)[^\r\n]{0,80}\.(dat|tmp)\b
  - id: temporary-directory-candidate-loop
    desc: Shell loops over temporary directory candidates
    crit: notable
    conf: 0.9
    for: [shell]
    platforms: [unix]
    if:
      type: text
      regex: '(?m)^\s*for\s+\w+\s+in\s+.{0,160}/(tmp|var/tmp|dev/shm)'
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: shell-case-temp-directory-arm
    desc: Shell case arm matches temporary paths
    crit: component
    conf: 0.94
    for: [shell]
    platforms: [unix]
    if:
      type: text
      regex: '(?im)^\s*case\s+["'']?\$\w+["'']?\s+in\s*/(tmp|var/tmp|dev/shm)/[^)\r\n]{0,100}\)'
  - id: unix-temp
    desc: Unix /tmp/ path reference
    if:
      type: text
      substr: /tmp/
    not:
      # Docstring / tutorial placeholders (e.g. cramjam File("/tmp/file.txt")).
      - /tmp/file.txt
  - id: temporary-source-file-path
    desc: Temporary source-file path literal
    crit: component
    conf: 0.9
    for: [source]
    platforms: [unix]
    if:
      type: literal
      regex: '^/tmp/[A-Za-z0-9_.-]+\.(py|c|sh)$'
  - id: unix-var-temp
    desc: Unix /var/tmp/ path reference
    if:
      type: text
      substr: /var/tmp/
  - id: unix-var-temp-fragment
    desc: Unix var/tmp path fragment
    if:
      type: text
      substr: var/tmp
  - id: tmp-zip-path
    desc: Temporary directory ZIP path reference
    crit: notable
    conf: 0.6
    if:
      type: literal
      regex: /tmp/.{0,50}\.zip
  - id: temporary-lockfile-path
    desc: Temporary directory path ending in a lockfile
    crit: component
    conf: 0.8
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)(%TEMP%|%TMP%|[\\/](temp|tmp)[\\/])[^"\r\n]{0,120}\.lock\b'
  - id: tmp-out-zip
    desc: /tmp/out.zip path reference
    crit: notable
    conf: 0.6
    if:
      type: literal
      substr: /tmp/out.zip
  - id: tmp-tar-path
    desc: Temporary directory path ending in .tar
    crit: notable
    conf: 0.6
    for: [shell, source]
    if:
      type: text
      regex: /tmp/.{0,50}\.tar\b
  - id: tmp-gz-path
    desc: Temporary directory path ending in .gz
    crit: notable
    conf: 0.6
    for: [shell, source]
    if:
      type: text
      regex: /tmp/.{0,50}\.gz\b
  - id: tmp-jar-path
    desc: Temporary directory path ending in .jar
    crit: notable
    conf: 0.7
    for: [shell, python, javascript, java, go, ruby, perl]
    if:
      type: text
      regex: /(var/)?tmp/[\w.$-]{1,48}\.jar\b
  # A relative path that climbs three or more levels and lands in a
  # world-writable staging directory. Ordinary relative references do not need
  # that many hops to reach /tmp; a crafted traversal payload aimed at a file
  # the attacker already dropped there does.
  - id: traversal-into-temp-path
    desc: Parent-directory traversal into /tmp
    crit: notable
    conf: 0.9
    for: [shell, python, javascript, java, go, ruby, perl]
    if:
      type: text
      regex: '(\.\./){3,}(var/)?tmp/'
  - id: var-tmp-zip
    desc: /var/tmp ZIP path reference
    crit: notable
    conf: 0.6
    if:
      type: literal
      regex: /var/tmp/.{0,50}\.zip
  - id: win-temp-env
    desc: Windows %TEMP% or %TMP% environment reference
    if:
      type: text
      regex: (?i)%(TEMP|TMP)%
  - id: win-temp-path
    desc: Windows Temp directory path
    if:
      type: text
      # `\Temp` must be a whole path component (separator / quote / space / end),
      # not a prefix of a word — otherwise it matches PHP/.NET namespaces and
      # class names like `\Template`, `\TemplateNotFound`, `\Temporary`.
      regex: '(?i)\\Temp([\\/"'' ]|$)'

  # JScript string literals often escape backslashes as `\x5c` under obfuscators.
  - id: js-escaped-c-temp-path
    desc: "Escaped C:\\Temp\\ path in JavaScript"
    crit: notable
    conf: 0.92
    for: [javascript]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)C:(\\x5c|\\\\)Temp(\\x5c|\\\\)'

  - id: js-tempfolder-staging-key
    desc: tempFolder staging property name
    crit: notable
    conf: 0.9
    for: [javascript]
    platforms: [windows]
    if:
      type: text
      regex: '[''"]tempFolder[''"]'

  - id: windows-temp-executable-path
    desc: Windows Temp executable path
    crit: notable
    conf: 0.9
    platforms: [windows]
    if:
      type: text
      regex: '(?i)\\Temp\\[^\\\s"'']{1,120}\.(exe|dll|bin)\b'
  - id: node-temp-env-executable-path
    desc: Node builds TEMP executable path
    crit: notable
    conf: 0.96
    attack: T1105
    for: [javascript, typescript]
    platforms: [windows]
    if:
      type: text
      regex: 'path\.join\s*\(\s*process\.env\.(TEMP|TMP)\s*,\s*["''][^"'']{1,120}\.(exe|dll|bin)["'']'
  - id: windows-temp-percent-executable-path
    desc: Windows TEMP executable path
    crit: notable
    conf: 0.96
    for: [batch, powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)(%TEMP%|%TMP%)\\[^\\\s"'']{1,120}\.(exe|dll|bin)\b'
  - id: word-temp-staging-file
    desc: Word-like temp staging filename
    crit: suspicious
    conf: 0.9
    platforms:
      - windows
    if:
      type: text
      regex: (?i)^~WRD[0-9]{4}\.tmp$
  - id: java-tmpdir-property
    desc: Java temp directory property reference
    crit: baseline
    conf: 0.95
    for: [java]
    if:
      type: text
      substr: java.io.tmpdir
  - id: java-tmpdir-property-class
    desc: Java class reads the temp directory property
    crit: baseline
    conf: 0.95
    for: [class, jar, zip]
    if:
      type: value
      path: class.strings[*]
      exact: java.io.tmpdir
  - id: rust-temp-dir
    desc: Rust std::env::temp_dir reference
    crit: baseline
    conf: 0.8
    for: [rust]
    if:
      type: text
      regex: 'std::env::temp_dir|env::temp_dir'
  - id: rust-literal-temp-path
    desc: Rust literal references a temporary file
    crit: baseline
    conf: 0.88
    for: [rust]
    if:
      type: string_literal
      regex: '^/(var/)?tmp/[A-Za-z0-9_.-]+$'
  - id: rust-temp-powershell-script-path
    desc: Rust builds a temporary PowerShell script path
    crit: notable
    conf: 0.94
    for: [rust]
    platforms: [windows]
    if:
      type: text
      regex: '(std::)?env::temp_dir\s*\(\s*\)[\s\S]{0,240}["''][^"''\r\n]{1,120}\.ps1["'']'
  - id: rust-temp-vbscript-path
    desc: Rust builds a temporary VBScript path
    crit: notable
    conf: 0.94
    for: [rust]
    platforms: [windows]
    if:
      type: text
      regex: '(std::)?env::temp_dir\s*\(\s*\)[\s\S]{0,240}["''][^"''\r\n]{1,120}\.vbs["'']'
  - id: node-os-tmpdir
    desc: Node.js os.tmpdir() call
    crit: baseline
    conf: 0.8
    for: [javascript, typescript]
    if:
      type: symbol
      exact: os.tmpdir
  - id: npm-postinstall-os-tmpdir
    desc: npm postinstall resolves temporary directory
    crit: notable
    conf: 0.9
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]{0,32}\.tmpdir\s*\(\s*\)'
  - id: dotnet-gettempfilename-token
    desc: .NET temp filename helper
    crit: notable
    conf: 0.86
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      exact: GetTempFileName
  - id: dotnet-gettemppath-token
    desc: .NET temporary directory helper token
    crit: notable
    conf: 0.88
    platforms: [windows]
    for: [pe, dll]
    if:
      type: text
      exact: GetTempPath
  - id: android-local-tmp-path
    desc: Android local tmp path
    crit: component
    conf: 0.88
    platforms: [unix, android]
    for: [elf, shell, c, cpp]
    if:
      type: text
      substr: /data/local/tmp
  - id: android-hidden-local-tmp-dotfile
    desc: Android hidden local tmp dotfile
    crit: suspicious
    conf: 0.94
    platforms: [unix, android]
    for: [elf, shell, c, cpp]
    if:
      type: text
      regex: '/data/local/tmp/\.[A-Za-z0-9][A-Za-z0-9._-]{1,40}\b'
  - id: java-temp-png-output-path
    desc: Java File constructor for temporary PNG output
    crit: notable
    conf: 0.82
    platforms: [windows, unix, android]
    for: [java]
    if:
      type: symbol
      kind: call
      exact: File
      arg:
        kind: string
        regex: '(?i)(/tmp/|/var/tmp/|\\temp\\).{0,40}\.png$'

  - id: macos-package-archive-path
    desc: macOS temp or Downloads .pkg path
    crit: notable
    conf: 0.86
    platforms: [macos]
    for: [shell, scripts, source]
    if:
      type: text
      regex: '(?i)(/tmp/|/Downloads/).{0,120}\.pkg\b'
composite_rules:
  - id: rust-temp-windows-script-launcher-pair
    desc: Rust stages PowerShell and VBScript paths in temporary storage
    crit: notable
    conf: 0.97
    for: [rust]
    platforms: [windows]
    near_bytes: 1200
    all:
      - id: rust-temp-powershell-script-path
      - id: rust-temp-vbscript-path

  - id: rust-temp-path
    desc: Rust references temporary file storage
    for: [rust]
    any:
      - id: rust-temp-dir
      - id: rust-literal-temp-path

  - id: any-temp-path
    desc: Any temporary directory path reference
    any:
      - id: unix-temp
      - id: unix-var-temp
      - id: win-temp-env
      - id: win-temp-path
      - id: java-tmpdir-property
      - id: rust-temp-dir
      - id: node-os-tmpdir
      - id: dotnet-gettempfilename-token
      - id: dotnet-gettemppath-token
      - id: android-local-tmp-path
      - id: android-hidden-local-tmp-dotfile
      - id: java-temp-png-output-path
