defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: baseline
  conf: 0.7
traits:
  - id: temporary-directory-candidate-loop
    desc: Shell loops over temporary directory candidates
    crit: notable
    conf: 0.9
    for: [shell]
    platforms: [unix]
    if:
      type: text
      regex: '(?m)^\s*for\s+\w+\s+in\s+.{0,160}/(tmp|var/tmp|dev/shm)'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: shell-case-temp-directory-arm
    desc: Shell case arm matches temporary paths
    crit: notable
    conf: 0.94
    for: [shell]
    platforms: [unix]
    if:
      type: text
      regex: '(?im)^\s*case\s+["'']?\$\w+["'']?\s+in\s*/(tmp|var/tmp|dev/shm)/[^)\r\n]{0,100}\)'
  - id: unix-temp
    desc: Unix /tmp/ path reference
    if:
      type: text
      substr: /tmp/
    not:
      # Docstring / tutorial placeholders (e.g. cramjam File("/tmp/file.txt")).
      - /tmp/file.txt
  - id: unix-var-temp
    desc: Unix /var/tmp/ path reference
    if:
      type: text
      substr: /var/tmp/
  - id: traversal-into-temp-path
    desc: Repeated parent traversal into tmp or var/tmp
    crit: notable
    conf: 0.9
    for: [shell, python, javascript, java, go, ruby, perl]
    if:
      type: text
      regex: '(\.\./){3,}(var/)?tmp/'
  - id: win-temp-env
    desc: Windows %TEMP% or %TMP% environment reference
    if:
      type: text
      regex: (?i)%(TEMP|TMP)%
  - id: win-temp-path
    desc: Windows Temp directory path
    if:
      type: text
      # `\Temp` must be a whole path component (separator / quote / space / end),
      # not a prefix of a word — otherwise it matches PHP/.NET namespaces and
      # class names like `\Template`, `\TemplateNotFound`, `\Temporary`.
      regex: '(?i)\\Temp([\\/"'' ]|$)'

  # JScript string literals often escape backslashes as `\x5c` under obfuscators.
  - id: js-escaped-c-temp-path
    desc: "Escaped C:\\Temp\\ path in JavaScript"
    crit: notable
    conf: 0.92
    for: [javascript]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)C:(\\x5c|\\\\)Temp(\\x5c|\\\\)'

  - id: js-tempfolder-staging-key
    desc: tempFolder staging property name
    crit: notable
    conf: 0.9
    for: [javascript]
    platforms: [windows]
    if:
      type: text
      regex: '[''"]tempFolder[''"]'

  - id: java-tmpdir-property
    desc: Java temp directory property reference
    crit: baseline
    conf: 0.95
    for: [java]
    if:
      type: text
      substr: java.io.tmpdir
  - id: java-tmpdir-property-class
    desc: JVM temporary-directory property reference
    for:
    - class
    conf: 0.95
    if:
      type: value
      path: class.strings[*]
      exact: java.io.tmpdir
  - id: npm-postinstall-os-tmpdir
    desc: npm postinstall resolves temporary directory
    crit: notable
    conf: 0.9
    for: [package.json]
    if:
      type: value
      path: scripts.postinstall
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]{0,32}\.tmpdir\s*\(\s*\)'
  - id: dotnet-gettemppath-token
    desc: .NET temporary-directory getter import
    crit: notable
    conf: 0.88
    platforms: [windows]
    for: [pe, dll]
    if:
      type: import
      exact: System.IO.Path.GetTempPath
  - id: android-local-tmp-path
    desc: Android local tmp path
    crit: notable
    conf: 0.88
    platforms: [unix, android]
    for: [elf, shell, c, cpp]
    if:
      type: text
      substr: /data/local/tmp
  - id: temp-path-segment
    desc: Temp or Tmp path segment
    crit: notable
    conf: 0.75
    for: [scripts, source, text, json]
    if:
      type: text
      regex: '(?i)[\\/](Temp|Tmp)[\\/]'
    unless:
      # TypeScript incremental build caches embed dependency paths such as
      # node_modules/@types/tmp/index.d.ts — not host temp-directory use.
      - type: basename
        regex: '\.tsbuildinfo$'


  # JavaScript file paths under a temp directory. Neutral on its own: build
  # tools, test runners, and sandbox runtimes all stage scripts in /tmp.
  # Stronger composites must establish the relevant behavior separately.
  #
  # Relocated from that dropper directory (was `temp-js-file`): the matcher only
  # recognizes a path literal, so it is a filesystem-path capability, not a
  # staging objective. The old pattern also lacked the separator after `tmp`, so
  # `\./tmp[^/]{0,120}\.js` matched any relative ESM chunk import whose basename
  # merely began with "tmp" -- openclaw's bundler emitted
  # `./tmp-openclaw-dir-uPgNO8da.js`, and every dist chunk importing it was
  # reported as a temp-staged payload. Requiring `tmp/` fixes that.
composite_rules:
  - id: rust-temp-windows-script-launcher-pair
    desc: Rust stages PowerShell and VBScript paths in temporary storage
    crit: notable
    conf: 0.97
    for: [rust]
    platforms: [windows]
    near_bytes: 1200
    all:
      - id: micro-behaviors/fs/path/temporary-artifact::rust-temp-powershell-script-path
      - id: micro-behaviors/fs/path/temporary-artifact::rust-temp-vbscript-path
  - id: rust-temp-path
    desc: Rust references temporary file storage
    for: [rust]
    any:
      - id: micro-behaviors/os/sysinfo/directories::rust-temp-dir
      - id: micro-behaviors/fs/path/temporary-artifact::rust-literal-temp-path
  - id: any-temp-path
    desc: Any temporary directory path reference
    any:
      - id: unix-temp
      - id: unix-var-temp
      - id: win-temp-env
      - id: win-temp-path
      - id: java-tmpdir-property
      - id: micro-behaviors/os/sysinfo/directories::rust-temp-dir
      - id: micro-behaviors/os/sysinfo/directories::node-os-tmpdir
      - id: micro-behaviors/fs/temp/file::gettempfilename-api-name
      - id: dotnet-gettemppath-token
      - id: android-local-tmp-path
      - id: micro-behaviors/fs/path/hidden::android-hidden-local-tmp-dotfile
      - id: micro-behaviors/fs/path/temporary-artifact::java-temp-png-output-path