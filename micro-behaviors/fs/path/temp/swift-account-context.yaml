# Classified by required operations; references do not establish data flow.
defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
composite_rules:
  - id: swift-staged-account-copy
    desc: Account paths with hidden staging-path ref
    crit: notable
    conf: 0.96
    for: [swift]
    platforms: [unix]
    all:
      - id: micro-behaviors/fs/path/temp::swift-hidden-system-logs-path-reference
      - id: micro-behaviors/fs/path/public-key::swift-authorized-keys-path
      - id: micro-behaviors/fs/path/config/accounts::unix-account-database-path-reference

