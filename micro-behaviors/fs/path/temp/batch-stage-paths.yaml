defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: batch-exe-path-reference
  desc: Batch temp EXE path reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)(%TEMP%|\\Windows\\Temp\\)[^ \r\n'"]{1,40}\.exe
- id: batch-dll-path-reference
  desc: Batch temp DLL path reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)(%TEMP%|\\Windows\\Temp\\|\\ProgramData\\)[^ \r\n'"]{1,48}\.dll
- id: batch-data-path-reference
  desc: Batch temp data path reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)(%TEMP%|\\Windows\\Temp\\|\\Microsoft\\)[^ \r\n'"]{1,48}\.(tmp|dat|b64)
- id: batch-script-path-reference
  desc: Batch temp script path reference
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)(%TEMP%|\\Windows\\Temp\\|\\Microsoft\\)[^ \r\n'"]{1,48}\.(py|vbs|js|ps1)
