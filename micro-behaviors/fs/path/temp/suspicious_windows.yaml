defaults:
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
  platforms: [windows]
traits:
  - id: windows-public-temp-directory-path
    desc: Windows public or temp directory path
    crit: notable
    conf: 0.82
    for: [python, c, cpp, csharp, rust, go, powershell, batch, pe, dll]
    if:
      type: text
      regex: '(?i)(%TEMP%|C:\\Users\\Public)'
  - id: temporary-batch-path-reference
    desc: Temporary-directory batch path reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(%temp%|%tmp%|\$env:temp|\$temp|\\temp\\|/tmp/).{0,32}\.(bat|cmd)'
