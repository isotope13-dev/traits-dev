defaults:
  platforms: [windows]
  for: [scripts, binaries]
traits:
  - id: windows-temp-path
    desc: Windows temporary directory path reference
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: '(?i)%TEMP%|%TMP%|[\\/]Temp[\\/]|\\\\Temp\\\\'
    not:
      # AWS credential config samples use lowercase POSIX paths such as
      # web_identity_token_file=/temp/token — not Windows %TEMP% staging.
      - regex: '[\\/]temp[\\/]'
    unless:
      - id: "metadata/file/naming::readme-requirements-install-basename"
