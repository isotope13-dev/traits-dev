defaults:
  platforms: [windows, unix]
  for:
    - python
  attack: T1113
  mbc: B0002

traits:
  - id: screenshot-name-artifact
    desc: Screenshot filename artifact
    crit: notable
    conf: 0.7
    if:
      type: string_literal
      exact: scrn.jpg
  - id: screenshot-image-extension
    desc: Screenshot filename artifact
    crit: notable
    conf: 0.65
    if:
      type: text
      regex: screenshot.{0,30}\.(jpg|jpeg|png)
