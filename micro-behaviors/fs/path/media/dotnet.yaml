# Named .NET screenshot methods and their neutral API context.
defaults:
  crit: notable
  for: [pe, dll]
  platforms: [windows]
  attack: T1113
  mbc: C0014

traits:
  - id: screenshot-jpg-template
    desc: Screenshot JPEG filename template
    conf: 0.82
    if:
      type: text
      exact: screenshot_{0}.jpg
