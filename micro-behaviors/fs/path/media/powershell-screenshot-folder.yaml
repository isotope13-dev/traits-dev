defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1041
  mbc: B0030

traits:
  - id: powershell-screenshot-folder
    desc: PowerShell screenshot folder target
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\$env:USERPROFILE\\Documents\\ScreenShot\\'
      case_insensitive: true
