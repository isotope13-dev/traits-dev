defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll, elf, macho]

traits:
  - id: xor-encoded-staging-image-path
    desc: XOR-encoded staging image file path
    crit: suspicious
    conf: 0.96
    attack: T1027,T1113
    if:
      type: encoded
      encoding: xor
      regex: '(?i)(programdata|appdata|tmp)[\\/][^\r\n"''\\/]{1,48}\.(jpg|png)$'
