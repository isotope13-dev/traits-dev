# Updater name references include optional executable/PDB suffixes.
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: updater-name-reference
    desc: Updater-themed name tokens
    crit: notable
    conf: 0.72
    if:
      type: text
      regex: (?i)\b(auto[_ -]?updater(\.exe|\.pdb)?|pc\s*app\s*store(\s*updater)?)\b
    downgrade:
    unless:
      - id: well-known/lib/runtime/scripted/v8::isolate-symbol
