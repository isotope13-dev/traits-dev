defaults:
  platforms: [unix]
  for: [c, cpp]
  attack: T1059.004

traits:
  - id: c-csh-image-path-variable
    desc: C source stores a C-shell executable path
    crit: notable
    conf: 0.94
    if:
      type: text
      # Keep this path reference neutral; objective composites add the exec
      # call and attack-specific trigger.
      regex: '(?im)^\s*char\s+[A-Za-z_]\w{0,30}\[\]\s*=\s*"/(usr/)?bin/(tc)?csh"'
