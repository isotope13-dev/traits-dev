# Node's legacy global module folders. `require()` still searches
# `$HOME/.node_modules` and `$HOME/.node_libraries` after the local
# node_modules chain, so the paths appear in every Node-compatible runtime as
# well as in code that plants modules there for another process to load.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: node-home-global-module-path
    desc: Node home global module directory path
    if:
      type: text
      regex: '(^|[\\/"''`])\.node_(modules|libraries)\b'
