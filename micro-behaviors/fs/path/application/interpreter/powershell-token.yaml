defaults:
  platforms: [unix, windows]
  for: [scripts, typescript, pe, dll, pyc, csharp, class, java]
  crit: notable
  conf: 0.98
traits:
  - id: powershell-executable-token
    desc: PowerShell executable name or command options
    if:
      type: text
      # A bare token in an extracted binary string can be a MIME label. Require
      # the executable suffix or an option-bearing command string.
      regex: '(?i)\bpowershell\.exe\b|\bpowershell[ \t]+-[A-Za-z]'
