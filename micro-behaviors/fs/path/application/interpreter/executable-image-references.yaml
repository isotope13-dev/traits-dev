# Image-name reference; does not establish a process launch.
defaults:
  platforms: [windows]
traits:
  - id: cmd-exe-image-name
    desc: References cmd.exe by image name
    for: [binaries, scripts, source, text]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_])cmd\.exe($|[^A-Za-z0-9_])'
      case_insensitive: true
    unless:
      - id: well-known/app/data/xore-honeypot::benign-context

  - id: jvm-cmd-exe-string
    desc: JVM string names cmd.exe
    crit: notable
    conf: 0.97
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)(^|[^A-Za-z0-9_])cmd\.exe($|[^A-Za-z0-9_])'

  - id: pe-dword-stack-cmd-exe
    desc: Builds cmd.exe from 32-bit stack immediates
    crit: notable
    conf: 0.96
    for: [pe, dll]
    if:
      type: yara
      source: |
        import "pe"
        rule pe_dword_stack_cmd_exe {
          strings:
            $lo_hi = {
              C7 ( 45 ?? | 44 24 ?? | 85 ?? ?? ?? ?? | 84 24 ?? ?? ?? ?? ) 63 6D 64 2E
              [0-12]
              C7 ( 45 ?? | 44 24 ?? | 85 ?? ?? ?? ?? | 84 24 ?? ?? ?? ?? ) 65 78 65 00
            }
            $hi_lo = {
              C7 ( 45 ?? | 44 24 ?? | 85 ?? ?? ?? ?? | 84 24 ?? ?? ?? ?? ) 65 78 65 00
              [0-12]
              C7 ( 45 ?? | 44 24 ?? | 85 ?? ?? ?? ?? | 84 24 ?? ?? ?? ?? ) 63 6D 64 2E
            }
          condition:
            for any sec in pe.sections : (
              sec.characteristics & pe.SECTION_MEM_EXECUTE != 0 and (
                for any i in (1..#lo_hi) : (
                  @lo_hi[i] >= sec.raw_data_offset and
                  @lo_hi[i] < sec.raw_data_offset + sec.raw_data_size
                ) or
                for any i in (1..#hi_lo) : (
                  @hi_lo[i] >= sec.raw_data_offset and
                  @hi_lo[i] < sec.raw_data_offset + sec.raw_data_size
                )
              )
            )
        }
