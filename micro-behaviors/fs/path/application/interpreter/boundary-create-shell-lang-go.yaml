defaults:
  platforms:
  - linux
  - macos
  - windows
  for: [go, elf, macho, pe]
  crit: notable
  conf: 0.86
traits:
- id: shell-fallback-paths--rx-1
  desc: "Nearby zsh/ksh and other shell paths"
  crit: notable
  if:
    type: text
    regex: /bin/(zsh|ksh).{0,24}/bin/(zsh|ksh|csh)
- id: shell-fallback-paths--rx-2
  desc: "Nearby csh and other shell paths"
  crit: notable
  if:
    type: text
    regex: /bin/(csh).{0,24}/bin/(zsh|ksh|csh)
composite_rules:
- id: shell-fallback-paths
  desc: Multiple shell fallback paths
  crit: component
  any:
  - id: micro-behaviors/fs/path/application/interpreter::shell-fallback-paths--rx-1
  - id: micro-behaviors/fs/path/application/interpreter::shell-fallback-paths--rx-2
