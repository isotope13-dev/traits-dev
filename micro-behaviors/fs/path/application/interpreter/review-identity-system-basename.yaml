defaults:
  crit: notable
  platforms: [unix]
  for: [binaries]
traits:
  - id: system-shell-basename
    desc: Shell executable basename reference
    conf: 1.0
    platforms: [unix, windows]
    for: [elf, macho, pe]
    if:
      type: path
      basename: true
      regex: '(?i)^(sh|bash|dash|zsh|fish|ksh|mksh|tcsh|csh)(\.exe)?$'

  # A bash loadable builtin is a separate .so that links bash's own globals --
  # `interactive_shell` among them -- so it reads as shell internals under a
  # name of its own. RabbitMQ's image ships usr/lib/bash/fltexpr.
