defaults:
  platforms: [windows]
  for: [pe, javascript]
traits:
  - id: bun-vfs-loader-entry
    desc: Bun VFS timestamped loader entry path
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: 'B:/~BUN/root/loader_[0-9]{8}_'

  - id: sysreq-js-name-reference
    desc: sysreq.js name reference
    crit: component
    conf: 0.94
    if:
      type: text
      substr: 'sysreq.js'

  # Obfuscated NWHStealer-style Bun payloads embed a minified host-and-desktop
  # recon object (screen geometry, process count, browser tally, path harvest).
