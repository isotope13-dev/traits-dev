defaults:
  platforms: [windows]
  for: [python]

traits:
  - id: python-appdata-interpreter-path
    desc: Python AppData interpreter path
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'AppData\\Local\\Programs\\Python'

  - id: python-interpreter-lib-directory
    desc: Python interpreter Lib directory
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 'Lib\'

  - id: python-interpreter-version
    desc: Versioned Python interpreter path
    crit: notable
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(?i)(^|[\\/])Python[0-9]{2,4}([\\/]|\.exe\b)'
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: python-multiple-windows-user-paths
    desc: Multiple dynamic Windows profile paths
    crit: notable
    conf: 0.88
    if:
      type: text
      # Require a dynamically substituted profile name so documentation-only
      # examples do not count as operational user-path construction, and
      # anchor `Users` to a Windows drive letter or backslash: a bare
      # `Users/{name}/` also spells a REST route (`/api/users/{user}/likes`),
      # which is not a Windows profile directory.
      regex: '(?i)([A-Z]:[\\/]|\\)Users[\\/]+\{[a-z_]+\}[\\/]+'

composite_rules:
  - id: python-installed-library-path
    desc: Installed Python library path
    crit: notable
    conf: 0.92
    all:
      - id: python-appdata-interpreter-path
      - id: python-interpreter-version
      - id: python-interpreter-lib-directory
