defaults:
  for: [class]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98

traits:
  - id: jvm-command-shell-path
    desc: JVM constant names a command shell
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)^(/bin/(ba)?sh|([a-z]:[/\\]windows[/\\]system32[/\\])?cmd\.exe)$'
