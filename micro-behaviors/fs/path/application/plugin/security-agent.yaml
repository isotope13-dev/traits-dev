# Reports the supported capability or configuration without inferring hostile intent.
defaults:
  platforms:
  - macos
  for:
  - scripts
  - binaries
traits:
- id: security-agent-plugins-path
  desc: macOS SecurityAgentPlugins directory reference
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: SecurityAgentPlugins
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: well-known/app/system/ukelele::ukelele-release-member
  - id: well-known/tool/development/toolchain/darling/
  - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
  - id: well-known/tool/development/agent/open-computer-use::open-computer-use-helper-utility
