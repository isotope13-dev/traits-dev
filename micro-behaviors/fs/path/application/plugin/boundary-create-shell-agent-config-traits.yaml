defaults:
  platforms: [windows, unix]
  for: [json]
  crit: notable
  conf: 0.92

traits:
  - id: ai-agent-statusline-cached-plugin-wrapper
    desc: Status line runs cached plugin wrapper
    conf: 0.97
    if:
      type: text
      regex: '(?i)plugins[\\/]cache[\\/].{0,700}wrapper\.sh'

  # Paperclip-style agent configurations describe a process adapter as data.
  # These are neutral execution capabilities; hostile intent comes from the
  # objective composites that pair them with reconnaissance and staging.
