traits:
- id: comfyui-custom-nodes-directory-reference
  desc: ComfyUI custom_nodes plugin path
  if:
    type: text
    regex: (?i)custom_nodes/.{0,50}/
- id: module-plugin-subdirectory-reference
  desc: Module tree contains plugin subdirectory
  if:
    type: text
    regex: (?i)(modules|middleware)/.{0,30}/(plugin|addon|extensions?)/
  not:
  - substr: /node_modules/
  - substr: node_modules/.pnpm/
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  crit: notable
  conf: 0.9
