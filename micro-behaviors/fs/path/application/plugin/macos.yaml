defaults:
  platforms: [macos]
  for: [scripts, binaries]

traits:
  - id: application-bundle-directory
    desc: References application bundle plug-in directory
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(/Applications|~/Applications)/[^\n]{1,180}/Contents/PlugIns\b'

  - id: library-bundle-directory
    desc: References Library bundle plug-in directory
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(^|[^A-Za-z])(/Library|~/Library)/[^\n]{1,180}/Contents/PlugIns\b'

  - id: system-plugin-directory
    desc: References macOS system plug-in directory
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '/Library/(QuickLook|Spotlight|Internet Plug-Ins)'
