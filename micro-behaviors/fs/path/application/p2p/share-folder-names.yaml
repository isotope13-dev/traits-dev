# Folder names a P2P-seeding worm looks for by name rather than by client
# registry key. The hardcoded-client approach (Kazaa\LocalContent,
# eDonkey2000 Downloads\, ...) is covered by the sibling files here; this one
# covers the client-agnostic variant, which keeps working as clients come and
# go and is therefore the form still seen in new samples.
#
# Each name on its own is an ordinary English word that any program may carry,
# so the individual atoms are components and only the proximity composite --
# the three names sitting together as a lookup table -- is a real observation.
# Even that stays neutral: it says "this binary knows the usual share-folder
# names", not that it writes to them. objectives/lateral-movement/worm/p2p
# supplies the copy-into-them intent.
defaults:
  platforms: [windows, unix]
  for: [binaries]
  crit: component
  conf: 0.9

traits:
  - id: share-folder-name
    desc: Share folder name literal
    if:
      type: text
      word: share
      case_insensitive: true
  - id: incoming-folder-name
    desc: Incoming folder name literal
    if:
      type: text
      word: incoming
      case_insensitive: true
  - id: received-folder-name
    desc: Received folder name literal
    if:
      type: text
      word: received
      case_insensitive: true

composite_rules:
  - id: generic-share-folder-name-set
    desc: Share incoming and received names together
    crit: notable
    conf: 0.92
    # A table of folder names, not three words scattered through a large
    # binary: all three have to land inside one 96-byte span.
    near_bytes: 96
    all:
      - id: share-folder-name
      - id: incoming-folder-name
      - id: received-folder-name
