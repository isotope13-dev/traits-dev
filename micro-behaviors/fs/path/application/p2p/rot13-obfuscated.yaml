# ROT13-encoded references to specific P2P client registry keys. A benign
# program has no reason to hide which P2P client it targets behind ROT13 --
# these are the same well-known client keys as windows-source.yaml's plaintext
# legacy-p2p-share-folders set, just obfuscated the way MyDoom-family worm
# droppers do (see micro-behaviors/data/encode/rot13/pe.yaml).
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
  attack: T1027,T1091

traits:
  - id: rot13-kazaa-transfer-key
    desc: ROT13-encoded Kazaa Transfer registry key
    if:
      type: text
      substr: 'Fbsgjner\Xnmnn\Genafsre'
  - id: rot13-imesh-general-key
    desc: ROT13-encoded iMesh General registry key
    if:
      type: text
      substr: 'Fbsgjner\vZrfu\Trareny'

composite_rules:
  - id: rot13-p2p-client-key-reference
    desc: ROT13-obfuscated P2P client share-folder key
    crit: suspicious
    conf: 0.95
    any:
      - id: rot13-kazaa-transfer-key
      - id: rot13-imesh-general-key
