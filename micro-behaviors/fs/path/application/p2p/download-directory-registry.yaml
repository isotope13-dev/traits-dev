# The registry values a P2P client keeps its download directory in.
#
# A worm that wants its copies shared does not have to find the share folder --
# it can move the share folder to wherever its copies already are. KaZaA and
# the FastTrack clients built on it (Morpheus, Grokster) store that path in
# `Software\<client>\Transfer\DlDir0`; eMule and eDonkey keep equivalents.
# Reading the value is what a worm does to find the folder; writing it is what
# a worm does to choose one.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  attack: T1091
traits:
  - id: fasttrack-download-directory-value
    desc: FastTrack client download directory value
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)Software\\[\w ]{1,24}\\Transfer\\DlDir'

  - id: emule-incoming-directory-value
    desc: eMule incoming directory config key
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\\eMule\\(Incoming|Temp)\b'
