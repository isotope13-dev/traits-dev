defaults:
  crit: notable
  conf: 0.95
  platforms: [windows]
  for: [scripts, binaries]

traits:
  - id: default-downloads-folder
    desc: Legacy default My Downloads directory
    if:
      type: text
      case_insensitive: true
      regex: '(?i)[A-Z]:\\My Downloads\b'

  - id: p2p-client-registry-key-kazaa
    desc: Kazaa registry key reference
    if:
      type: text
      case_insensitive: true
      substr: '\software\Kazaa'

  - id: p2p-client-registry-key-limewire
    desc: LimeWire registry key reference
    if:
      type: text
      case_insensitive: true
      substr: '\software\LimeWire'

  - id: p2p-client-registry-key-shareaza
    desc: Shareaza registry key reference
    if:
      type: text
      case_insensitive: true
      substr: '\software\shareaza'

  - id: p2p-client-registry-key-morpheus
    desc: Morpheus registry key reference
    if:
      type: text
      case_insensitive: true
      substr: '\software\morpheus'

  - id: p2p-client-registry-key-xolox
    desc: Xolox registry key reference
    if:
      type: text
      case_insensitive: true
      substr: '\software\Xolox'

  - id: p2p-client-registry-key-edonkey
    desc: eDonkey2000 registry key reference
    if:
      type: text
      case_insensitive: true
      substr: 'Uninstall\eDonkey2000'

composite_rules:
  - id: p2p-client-registry-sweep
    desc: Queries multiple P2P client registry keys
    crit: notable
    conf: 0.96
    any:
      - id: p2p-client-registry-key-kazaa
      - id: p2p-client-registry-key-limewire
      - id: p2p-client-registry-key-shareaza
      - id: p2p-client-registry-key-morpheus
      - id: p2p-client-registry-key-xolox
      - id: p2p-client-registry-key-edonkey
    needs: 2
