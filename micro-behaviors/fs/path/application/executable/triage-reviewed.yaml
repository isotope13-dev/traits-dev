traits:
- for:
  - html
  id: html-concatenated-msiexec-name
  desc: Concatenates the msiexec executable name
  conf: 0.95
  if:
    type: text
    regex: (?i)msiexec['"]\s*\+\s*['"]\.exe
- for:
  - javascript
  - vbs
  - html
  - batch
  - scripts
  - binaries
  id: windows-script-host-executable-reference
  desc: Windows Script Host executable reference
  conf: 0.8
  if:
    type: text
    regex: (?i)[^\r\n]{0,80}\b[wc]script\.exe\b
  not:
  - regex: ^\s{0,8}(['#*]|REM\s|//)
  - regex: (?i)\b(or|and|nor)\s{1,4}[wc]script\.exe$
  unless:
  - id: well-known/app/data/xore-honeypot::benign-context
defaults:
  platforms:
  - windows
  crit: notable
