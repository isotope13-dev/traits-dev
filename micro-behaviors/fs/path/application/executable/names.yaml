defaults:
  platforms: [windows, unix]
  for: [pe, elf, python, javascript, powershell]
  crit: baseline
traits:
  - id: installed-chrome-windows-path
    desc: Installed Chrome Windows executable path
    for: [binaries, scripts, source, -class, -pyc, -beam, -wasm, -staticlib]
    if:
      type: literal
      regex: '(?i)Google\\Chrome\\Application\\chrome\.exe'

  - id: installed-edge-windows-path
    desc: Installed Edge Windows executable path
    for: [binaries, scripts, source, -class, -pyc, -beam, -wasm, -staticlib]
    if:
      type: literal
      regex: '(?i)Microsoft\\Edge\\Application\\msedge\.exe'

  - id: installed-firefox-windows-path
    desc: Installed Firefox Windows executable path
    for: [binaries, scripts, source, -class, -pyc, -beam, -wasm, -staticlib]
    if:
      type: literal
      regex: '(?i)Mozilla Firefox\\firefox\.exe'

  - id: installed-chrome-macos-path
    desc: Installed Chrome macOS executable path
    for: [binaries, scripts, source, -class, -pyc, -beam, -wasm, -staticlib]
    if:
      type: literal
      exact: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome

  - id: installed-edge-macos-path
    desc: Installed Edge macOS executable path
    for: [binaries, scripts, source, -class, -pyc, -beam, -wasm, -staticlib]
    if:
      type: literal
      exact: /Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge

  - id: installed-firefox-macos-path
    desc: Installed Firefox macOS executable path
    for: [binaries, scripts, source, -class, -pyc, -beam, -wasm, -staticlib]
    if:
      type: literal
      exact: /Applications/Firefox.app/Contents/MacOS/firefox

  - id: installed-chrome-unix-path
    desc: Installed Chrome-family Unix executable path
    for: [binaries, scripts, source, -class, -pyc, -beam, -wasm, -staticlib]
    if:
      type: literal
      regex: '(?i)/usr/(local/)?bin/(google-chrome|chromium)'

  - id: installed-edge-unix-path
    desc: Installed Edge Unix executable path
    for: [binaries, scripts, source, -class, -pyc, -beam, -wasm, -staticlib]
    if:
      type: literal
      regex: '(?i)/usr/(local/)?bin/microsoft-edge'

  - id: installed-firefox-unix-path
    desc: Installed Firefox Unix executable path
    for: [binaries, scripts, source, -class, -pyc, -beam, -wasm, -staticlib]
    if:
      type: literal
      regex: '(?i)/usr/(local/)?bin/firefox'

  - id: charles-process-name
    desc: Charles proxy process-name fragment
    crit: component
    conf: 0.85
    for: [python]
    if:
      type: literal
      exact: charles
      case_insensitive: true
  - id: taskmgr-process
    desc: Task Manager process name
    crit: notable
    conf: 0.8
    for: [scripts, binaries]
    if:
      type: text
      regex: (?i)taskmgr(\.exe)?
  - id: perfmon-process
    desc: Performance Monitor process name
    crit: notable
    conf: 0.75
    for: [scripts, binaries]
    if:
      type: text
      regex: (?i)(^|[[:space:]/\\])perfmon\.exe($|[[:space:]/\\])
  - id: resmon-process
    desc: Resource Monitor process name
    crit: notable
    conf: 0.75
    for: [scripts, binaries]
    if:
      type: text
      regex: (?i)\bresmon(\.exe)?\b
  # Chromium injectors/BOFs that enable CDP inside a live browser ship as
  # C/C++/Go (and scripted helpers). Keep process-name atoms on those carriers
  # so in-process CDP composites can see their target without opening every
  # source language under the text-matcher type cap.
  - id: chrome-exe-process-name
    desc: Standalone chrome.exe process-name token
    crit: notable
    conf: 0.5
    for: [pe, elf, python, javascript, powershell, c, cpp, go]
    if:
      type: text
      # Match an argv/process-name token, not a URL or package path such as
      # chromium-browser-official in a source-download endpoint.
      regex: '(?i)(^|[[:space:]"''(\[])chrome\.exe([[:space:]"'')\]]|$)'
      case_insensitive: true
  - id: google-chrome-unix-path
    desc: References a Google Chrome Unix executable path
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [elf, python, javascript, shell, c, cpp, go]
    if:
      type: text
      regex: '(?i)(/usr/bin/|/opt/google/chrome/)google-chrome(-stable)?\b'
  - id: google-chrome-flag-command
    desc: Invokes Google Chrome with command flags
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [python, javascript, shell, c, cpp, go]
    if:
      type: text
      regex: '(?i)(^|[\s"''(])google-chrome(-stable)?\s+--[a-z]'
  - id: chromium-browser-process-name
    desc: Standalone chromium-browser process-name token
    crit: notable
    conf: 0.5
    for: [pe, elf, python, javascript, powershell, c, cpp, go]
    if:
      type: text
      regex: '(?i)(^|[[:space:]"''(\[])chromium-browser([[:space:]"'')\]]|$)'
      case_insensitive: true
    unless:
      - type: text
        substr: application/x-google-chrome-extension
  - id: browser-apps-firefox-exe
    desc: Firefox Windows executable
    conf: 0.5
    for: [pe, dll, elf, c, cpp, python, javascript, powershell, batch]
    if:
      type: text
      word: firefox.exe
      case_insensitive: true
  - id: browser-apps-firefox-bin
    desc: Firefox Linux binary
    conf: 0.5
    if:
      type: text
      regex: (?i)\bfirefox-bin\b
      case_insensitive: true
  - id: browser-apps-firefox-browser
    desc: Firefox browser package name
    conf: 0.5
    if:
      type: text
      regex: (?i)\bfirefox-browser\b
      case_insensitive: true
  - id: browser-apps-firefox-esr
    desc: Firefox ESR package name
    conf: 0.5
    if:
      type: text
      regex: (?i)\bfirefox-esr\b
      case_insensitive: true
  - id: browser-apps-firefox-app
    desc: Firefox macOS app bundle
    conf: 0.5
    if:
      type: text
      substr: /Applications/Firefox.app
      case_insensitive: true
  - id: browser-apps-msedge-safari
    desc: Microsoft Edge executable name
    conf: 0.5
    for: [pe, elf, python, javascript, powershell, c, cpp, go]
    if:
      type: text
      word: msedge
      case_insensitive: true
  - id: browser-apps-safari
    desc: Browser app safari
    conf: 0.5
    count_max: 1
    if:
      type: text
      regex: (?i)\b(safari\.exe|/Applications/Safari\.app)\b
  - id: browser-apps-opera-brave
    desc: Browser app opera
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: (?i)\b(opera\.exe|opera-browser|opera_stable)\b
    unless:
      - id: metadata/lang/javascript-features::closure-externs-annotation
    downgrade:
      any:
        - id: metadata/binary/resource/
        - id: metadata/package/quality/
        - type: text
          substr: X3DOM Runtime, http://www.x3dom.org/
  - id: browser-apps-brave
    desc: Brave browser application-name token
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: (?i)\b(brave\.exe|brave-browser|bravebrowser)\b
    unless:
      - id: metadata/file/catalog/identity/
    downgrade:
      any:
        - id: metadata/binary/resource/
  - id: browser-apps-iexplore
    desc: Browser app iexplore
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: (?i)\biexplore\b
    unless:
      - id: metadata/package/quality/
    downgrade:
      any:
        - id: metadata/binary/resource/
  - id: office-apps-word-excel
    desc: Office app winword
    crit: baseline
    conf: 0.5
    if:
      type: text
      word: winword
      case_insensitive: true
  - id: office-apps-excel
    desc: References Excel executable or app bundle
    crit: notable
    conf: 0.5
    count_max: 2
    if:
      type: text
      regex: (?i)\b(excel\.exe|/Applications/Microsoft Excel\.app)\b
    not:
      - substr: file-excel
    unless:
      - type: text
        substr: application/vnd.ms-excel
      - id: metadata/file/catalog/identity/
    downgrade:
      any:
        - id: metadata/signed/platform::microsoft-windows
  - id: office-apps-powerpoint-soffice
    desc: Office app powerpnt
    crit: notable
    conf: 0.5
    if:
      type: text
      word: powerpnt
      case_insensitive: true
    downgrade:
      any:
        - id: metadata/signed/platform::microsoft-corporation
        - id: metadata/signed/platform::microsoft-windows
  - id: office-apps-soffice
    desc: Office app soffice
    crit: notable
    conf: 0.5
    if:
      type: text
      word: soffice
      case_insensitive: true
    unless:
      # A generated TextMate grammar is a symbol table, not program logic:
      # its per-language alternation lists every keyword the language has.
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
    downgrade:
      any:
        - id: metadata/signed/platform::microsoft-corporation
        - id: metadata/signed/platform::microsoft-windows
  - id: office-apps-outlook-onenote
    desc: Office app outlook
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: (?i)\boutlook\.exe\b
    unless:
      - type: text
        substr: application/vnd.ms-outlook
    downgrade:
      any:
        - id: metadata/signed/platform::microsoft-corporation
        - id: metadata/signed/platform::microsoft-windows
  - id: office-apps-onenote
    desc: References OneNote executable or app
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: (?i)\bonenote(\.exe|\.app|\.desktop)\b
      case_insensitive: true
    unless:
      - id: metadata/document/office/container/
      - type: text
        substr: application/onenote
    downgrade:
      any:
        - id: metadata/signed/platform::microsoft-corporation
        - id: metadata/signed/platform::microsoft-windows
  - id: dev-apps-sublime
    desc: Dev app sublime_text
    crit: notable
    conf: 0.5
    if:
      type: text
      word: sublime_text
      case_insensitive: true
  - id: dev-apps-notepad-vim
    desc: Dev app notepad++
    crit: notable
    conf: 0.5
    if:
      type: text
      word: notepad++
      case_insensitive: true
  - id: dev-apps-vim
    desc: Repeated Vim name references
    # "vim" is a generic 3-letter word that appears in benign command/package
    # lookup tables (e.g. `"vim": "vim"`, which alone satisfies count_min:2 on
    # one line). Too weak to be a notable enumeration signal standalone; it is
    # only meaningful as part of the broader dev-apps enumeration composite.
    crit: component
    conf: 0.5
    count_min: 2
    if:
      type: text
      word: vim
      case_insensitive: false
    not:
      - substr: /vim
    unless:
      - id: well-known/tool/development/fzf::fzf-binary
  - id: dev-apps-emacs
    desc: Repeated Emacs name references
    crit: component
    conf: 0.5
    count_min: 2
    if:
      type: text
      word: emacs
      case_insensitive: true
    not:
      - regex: '(?i)(/terminfo/|github\.com/|/usr/share/)'
    unless:
      - type: text
        substr: dired
      - type: basename
        exact: CHANGES
      - id: well-known/tool/development/fzf::fzf-binary
    downgrade:
      any:
        - id: metadata/file/string/identity::system-shell-basename
  - id: dev-apps-pycharm-exe
    desc: PyCharm Windows executable
    crit: component
    conf: 0.5
    if:
      type: text
      regex: (?i)\bpycharm(64|32)?\.exe\b
      case_insensitive: true
  - id: dev-apps-pycharm-shell
    desc: PyCharm shell launcher
    crit: component
    conf: 0.5
    if:
      type: text
      regex: (?i)\bpycharm\.sh\b
      case_insensitive: true
  - id: dev-apps-pycharm-app
    desc: PyCharm macOS app bundle
    crit: component
    conf: 0.5
    if:
      type: text
      regex: (?i)\bpycharm\.app\b
      case_insensitive: true
  - id: dev-apps-pycharm-path
    desc: PyCharm path component
    crit: component
    conf: 0.5
    if:
      type: text
      regex: '[/\\]pycharm\b'
      case_insensitive: true
    unless:
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: dev-apps-intellij
    desc: IntelliJ executable or launcher name
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: '(?i)\b(idea|intellij)(64)?\.(exe|sh|app)\b'
    unless:
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
composite_rules:
  - id: installed-browser-executable-paths
    desc: Multiple installed browser executable paths
    crit: notable
    conf: 0.96
    for: [binaries, scripts, source]
    needs: 2
    any:
      - id: installed-chrome-executable-path
      - id: installed-edge-executable-path
      - id: installed-firefox-executable-path

  - id: installed-chrome-executable-path
    desc: Installed Chrome executable path
    for: [binaries, scripts, source]
    any:
      - id: installed-chrome-windows-path
      - id: installed-chrome-macos-path
      - id: installed-chrome-unix-path

  - id: installed-edge-executable-path
    desc: Installed Edge executable path
    for: [binaries, scripts, source]
    any:
      - id: installed-edge-windows-path
      - id: installed-edge-macos-path
      - id: installed-edge-unix-path

  - id: installed-firefox-executable-path
    desc: Installed Firefox executable path
    for: [binaries, scripts, source]
    any:
      - id: installed-firefox-windows-path
      - id: installed-firefox-macos-path
      - id: installed-firefox-unix-path

  - id: browser-apps
    desc: References a browser executable name
    crit: notable
    conf: 0.5
    for: [pe, elf, python, javascript, powershell, c, cpp, go]
    unless:
      - id: well-known/tool/development/webdriver-manager::selenium-webdriver-driver-manager-package
    any:
      - id: chrome-process-name
      - id: browser-apps-firefox
      - id: browser-apps-msedge-safari
      - id: browser-apps-safari
      - id: browser-apps-opera-brave
      - id: browser-apps-brave
      - id: browser-apps-iexplore
  - id: chrome-process-name
    desc: Standalone Chrome-family application-name token
    crit: notable
    conf: 0.5
    for: [pe, elf, python, javascript, powershell, c, cpp, go]
    any:
      - id: chrome-exe-process-name
      - id: google-chrome-unix-path
      - id: google-chrome-flag-command
      - id: chromium-browser-process-name
  - id: browser-apps-firefox
    desc: References a Firefox executable or application package
    crit: baseline
    conf: 0.5
    any:
      - id: browser-apps-firefox-exe
      - id: browser-apps-firefox-bin
      - id: browser-apps-firefox-browser
      - id: browser-apps-firefox-esr
      - id: browser-apps-firefox-app
  - id: office-apps
    desc: Office/Productivity application names
    crit: notable
    conf: 0.5
    any:
      - id: office-apps-word-excel
      - id: office-apps-excel
      - id: office-apps-powerpoint-soffice
      - id: office-apps-soffice
      - id: office-apps-outlook-onenote
      - id: office-apps-onenote
  - id: dev-apps
    desc: Developer/Editor application names
    crit: baseline
    conf: 0.5
    any:
      - id: well-known/app/development/vscode::vscode-name
      - id: dev-apps-sublime
      - id: dev-apps-notepad-vim
      - id: dev-apps-vim
      - id: dev-apps-emacs
      - id: dev-apps-pycharm
      - id: dev-apps-intellij
  - id: dev-apps-pycharm
    desc: Dev app pycharm
    crit: notable
    conf: 0.5
    any:
      - id: dev-apps-pycharm-exe
      - id: dev-apps-pycharm-shell
      - id: dev-apps-pycharm-app
      - id: dev-apps-pycharm-path
