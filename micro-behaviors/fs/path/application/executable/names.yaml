---
defaults:
  platforms:
  - windows
  - unix
  for:
  - pe
  - elf
  - python
  - javascript
  - powershell
  crit: baseline
traits:
- id: installed-firefox-macos-path
  desc: Installed Firefox macOS executable path
  for:
  - binaries
  - scripts
  - source
  - "-class"
  - "-pyc"
  - "-beam"
  - "-wasm"
  - "-staticlib"
  if:
    type: literal
    exact: "/Applications/Firefox.app/Contents/MacOS/firefox"
- id: installed-chrome-unix-path
  desc: Installed Chrome-family Unix executable path
  for:
  - binaries
  - scripts
  - source
  - "-class"
  - "-pyc"
  - "-beam"
  - "-wasm"
  - "-staticlib"
  if:
    type: literal
    regex: "(?i)/usr/(local/)?bin/(google-chrome|chromium)"
- id: installed-edge-unix-path
  desc: Installed Edge Unix executable path
  for:
  - binaries
  - scripts
  - source
  - "-class"
  - "-pyc"
  - "-beam"
  - "-wasm"
  - "-staticlib"
  if:
    type: literal
    regex: "(?i)/usr/(local/)?bin/microsoft-edge"
- id: installed-firefox-unix-path
  desc: Installed Firefox Unix executable path
  for:
  - binaries
  - scripts
  - source
  - "-class"
  - "-pyc"
  - "-beam"
  - "-wasm"
  - "-staticlib"
  if:
    type: literal
    regex: "(?i)/usr/(local/)?bin/firefox"
- id: google-chrome-unix-path
  desc: References a Google Chrome Unix executable path
  crit: notable
  conf: 0.9
  platforms:
  - unix
  for:
  - elf
  - python
  - javascript
  - shell
  - c
  - cpp
  - go
  if:
    type: text
    regex: "(?i)(/usr/bin/|/opt/google/chrome/)google-chrome(-stable)?\\b"
- id: installed-office-executable-path
  desc: Microsoft Office install executable path
  crit: notable
  conf: 0.95
  platforms:
  - windows
  for:
  - scripts
  - source
  - binaries
  if:
    type: literal
    regex: "(?i)\\\\Microsoft Office\\\\(root\\\\)?Office[0-9]{2}\\\\[A-Za-z0-9_.-]+\\.exe\\b"
composite_rules:
- id: installed-chrome-executable-path
  desc: Installed Chrome executable path
  for:
  - binaries
  - scripts
  - source
  any:
  - id: micro-behaviors/fs/path/application/executable::installed-chrome-windows-path
  - id: micro-behaviors/fs/path/application/executable::installed-chrome-macos-path
  - id: micro-behaviors/fs/path/application/executable::installed-chrome-unix-path
- id: installed-edge-executable-path
  desc: Installed Edge executable path
  for:
  - binaries
  - scripts
  - source
  any:
  - id: micro-behaviors/fs/path/application/executable::installed-edge-windows-path
  - id: micro-behaviors/fs/path/application/executable::installed-edge-macos-path
  - id: micro-behaviors/fs/path/application/executable::installed-edge-unix-path
- id: installed-firefox-executable-path
  desc: Installed Firefox executable path
  for:
  - binaries
  - scripts
  - source
  any:
  - id: micro-behaviors/fs/path/application/executable::installed-firefox-windows-path
  - id: micro-behaviors/fs/path/application/executable::installed-firefox-macos-path
  - id: micro-behaviors/fs/path/application/executable::installed-firefox-unix-path
