# Character arrays encoding /bin/sh. Alone they establish an encoded path;
# shell selection additionally requires the String[] constructor and -c argv.
defaults:
  platforms: [unix, windows]
  for: [jsp, java, html, javascript, python, vbs]
traits:
  - id: decimal-posix-shell-character-array
    desc: Decimal array encodes POSIX shell path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\{\s*47\s*,\s*98\s*,\s*105\s*,\s*110\s*,\s*47\s*,\s*115\s*,\s*104\s*\}'
  - id: hex-posix-shell-character-array
    desc: Hex array encodes POSIX shell path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\{\s*0x2f\s*,\s*0x62\s*,\s*0x69\s*,\s*0x6e\s*,\s*0x2f\s*,\s*0x73\s*,\s*0x68\s*\}'
