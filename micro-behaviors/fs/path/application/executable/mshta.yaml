defaults:
  platforms: [windows]
  for: [scripts, binaries, -powershell]

traits:
  - id: mshta-name-reference
    desc: MSHTA executable name reference
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bmshta(\.exe)?\b'
    unless:
      - id: well-known/dual-use/tunnel/mihomo::mihomo-comment-bundle
