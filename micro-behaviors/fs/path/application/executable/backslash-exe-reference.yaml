# Doubled backslashes occur in escaped local paths as well as UNC paths.
# This observation does not distinguish either form or prove execution.
defaults:
  platforms: [windows]
  for: [html, vbs, asp]

traits:
  - id: backslash-exe-path-reference
    desc: Backslash-separated executable path reference
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\\\\[A-Za-z0-9_.-]{1,80}\\[^"''\r\n]{0,80}\.exe'
