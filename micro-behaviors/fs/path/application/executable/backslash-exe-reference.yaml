# Doubled backslashes occur in escaped local paths as well as UNC paths.
# This observation does not distinguish either form or prove execution.
defaults:
  platforms: [windows]
  for: [html, vbs, asp]

traits:
  - id: backslash-exe-path-reference
    desc: Backslash-separated executable path reference
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\\\\[A-Za-z0-9_.-]{1,80}\\[^"''\r\n]{0,80}\.exe'
    unless:
      - id: metadata/document/html/
      - id: metadata/file/format/structured/
      - id: metadata/file/extension/asset::javascript-source-map-path
      - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path
      - type: text
        regex: '(CopyFileEx_meth|_WinAPI_CopyFileEx|simulates the move by using the CopyFile)'
      - id: metadata/file/string/corpus::hashed-text-record
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/file/catalog/pattern-rules::secret-pattern-catalog-known-benign-context
