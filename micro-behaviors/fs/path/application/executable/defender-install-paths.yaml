defaults:
  platforms: [windows]
  for: [binaries, scripts, c, cpp, csharp, go, rust]
traits:
  - id: security-health-service-binary
    desc: Windows Security health service binary path
    crit: notable
    conf: 0.9
    for: [batch, scripts, c, cpp, csharp, go, rust]
    if:
      type: text
      regex: (?i)\bSecurityHealthService\.exe\b


composite_rules:
  - id: defender-install-path-references
    desc: Names multiple Defender install paths
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/fs/path/application/prefix::defender-program-files-directory
      - id: micro-behaviors/fs/path/app-data::defender-programdata-directory
      - id: micro-behaviors/fs/path/application/prefix::defender-atp-directory
      - id: micro-behaviors/fs/path/system::defender-boot-driver-directory
      - id: security-health-service-binary
      - id: micro-behaviors/fs/path/library::smartscreen-module-file
    needs: 2

