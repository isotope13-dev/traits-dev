defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: bare-posix-shell-name-literal
    desc: Literal names a POSIX shell executable
    crit: notable
    conf: 0.95
    if:
      type: literal
      regex: '^(ba|z|k|c)?sh$'
composite_rules:
  - id: command-shell-executable-reference
    desc: References a command shell executable
    crit: notable
    conf: 0.9
    any:
      - id: bare-posix-shell-name-literal
      - id: unix-shell-executable-path
      - id: cmd-exe-image-name
      - id: powershell-executable-token
