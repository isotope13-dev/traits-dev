# A quoted interpreter path is a reference, not a JVM process launch.
defaults:
  platforms: [unix, windows]
  for: [jsp, java, html]
traits:
  - id: source-command-shell-reference
    desc: Quoted command-shell executable path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["''](/bin/(ba)?sh|cmd\.exe)["'']'
