# A path reference establishes neither shell selection nor execution.
# Canonical POSIX shell paths replace language-specific path observations.
defaults:
  crit: notable
  platforms: [unix]
  for: [scripts, binaries, c, cpp, typescript, go]

traits:
  - id: unix-shell-executable-path
    desc: References a Unix shell executable path
    # Preserve the established C/C++, Python and Go path observations
    # while consolidating these observations into their filesystem home.
    conf: 0.8
    if:
      type: literal
      regex: '(^|[^A-Za-z0-9_/.+-])/(usr/)?bin/(ba|z|k|c)?sh($|[^A-Za-z0-9._-])'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
