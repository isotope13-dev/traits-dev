# A UNC EXE path is a reference, not proof that the program writes or runs it.
defaults:
  platforms: [windows]
  for: [html, vbs, asp]

traits:
  - id: unc-exe-path-reference
    desc: UNC path naming an EXE
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\\\\[A-Za-z0-9_.-]{1,80}\\[^"''\r\n]{0,80}\.exe'
    unless:
      - id: metadata/document/html/
      - id: metadata/file/format/structured/
      - id: metadata/build/bundler/vscode::javascript-source-map-file
      - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path
      - type: text
        regex: '(CopyFileEx_meth|_WinAPI_CopyFileEx|simulates the move by using the CopyFile)'
      - id: metadata/file/string/corpus::hashed-text-record
      - id: metadata/package/testing/
