defaults:
  platforms: [windows]
  crit: notable
  conf: 0.96

traits:
  - id: node-executable-path-join
    desc: Node joins path with executable filename
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: path.join
      arg:
        from:
          whole_value: '\.(exe|dll)$'
  - id: powershell-shortcut-exe-target-value
    desc: Shortcut TargetPath assigned an EXE path
    for: [powershell]
    if:
      type: text
      regex: '\.TargetPath\s*=\s*"[^"\r\n]{1,160}\.exe"'

composite_rules:
  - id: node-appdata-near-executable-path-join
    desc: AppData reference near executable path join
    for: [javascript, typescript]
    near_bytes: 400
    all:
      - id: micro-behaviors/os/env/user-paths::node-appdata-access
      - id: node-executable-path-join
  - id: powershell-appdata-near-shortcut-exe-target
    desc: AppData reference near EXE shortcut target
    for: [powershell]
    near_lines: 12
    all:
      - id: micro-behaviors/os/env/user-paths::env-appdata
      - id: powershell-shortcut-exe-target-value
