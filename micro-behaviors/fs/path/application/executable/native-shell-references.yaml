# Relocated by the supported observation; matchers and scope preserved.
defaults:
  platforms:
  - unix
  for:
  - elf
  - macho
  crit: notable
traits:
- id: bash-path-reference
  desc: Native binary references Bash shell path
  conf: 0.75
  if:
    type: text
    regex: (^|[/\\\\"'])(/bin/bash|/usr/bin/bash)\b
    section: rodata
- id: local-prefix-bash-path
  desc: Native binary references /usr/local bash path
  conf: 0.85
  if:
    type: text
    regex: (^|[/\\"'])/usr/local/bin/bash\b
- id: bin-sh-path-reference
  desc: References the /bin/sh shell path
  conf: 0.65
  if:
    type: text
    exact: /bin/sh
  downgrade:
    any:
    - id: metadata/file/string/identity::system-shell-basename
composite_rules:
- id: multiple-shell-path-references
  desc: References several shell interpreter paths
  conf: 0.9
  needs: 3
  any:
  - id: micro-behaviors/fs/path/application/executable::bash-path-reference
  - id: micro-behaviors/fs/path/application/executable::local-prefix-bash-path
  - id: micro-behaviors/fs/path/application/executable::bin-sh-path-reference
  - id: micro-behaviors/fs/path/application/executable::bin-busybox-path
