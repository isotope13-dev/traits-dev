# Installed-browser executable paths as JVM class constants. names.yaml
# excludes class files from its literal-typed path atoms; these are the
# class-file text twins. Previously carLambo "process path strings"
# (suspicious) although any browser launcher carries them.
defaults:
  platforms: [windows]
  for: [class, java_class]
  crit: baseline
  conf: 0.95
  attack: T1518
traits:
  - id: jvm-installed-chrome-windows-path
    desc: JVM class names Chrome install path
    if:
      type: text
      substr: Google\Chrome\Application\chrome.exe
  - id: jvm-installed-firefox-windows-path
    desc: JVM class names Firefox install path
    if:
      type: text
      substr: Mozilla Firefox\firefox.exe
composite_rules:
  - id: jvm-chrome-and-firefox-paths
    desc: JVM names Chrome and Firefox install paths
    crit: notable
    for: [class, java_class, jar, zip]
    all:
      - id: jvm-installed-chrome-windows-path
      - id: jvm-installed-firefox-windows-path
