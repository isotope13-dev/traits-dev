defaults:
  platforms: [windows]
  for: [powershell, batch]

traits:
  - id: powershell-environment-executable-path
    desc: Environment-rooted PowerShell EXE path
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?i)\$env:(TEMP|APPDATA|LOCALAPPDATA|PROGRAMDATA)[\\/][^"\r\n]{0,120}\.exe\b'
