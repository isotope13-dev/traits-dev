---
defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - elf
  - shell
  crit: notable
traits:
- id: hi3511-app-path
  desc: Hi3511 application path reference
  conf: 0.85
  if:
    type: text
    substr: app/hi3511
- id: davinci-app-path
  desc: DaVinci application path reference
  conf: 0.9
  if:
    type: text
    substr: home/Davinci
- id: kylin-app-path
  desc: Kylin application path reference
  conf: 0.85
  if:
    type: text
    substr: var/Kylin
- id: dvr-gui-app-path
  desc: DVR GUI application path reference
  conf: 0.8
  if:
    type: text
    substr: mnt/mtd/app/gui
composite_rules:
- id: hi3511-executable-references
  desc: Hi3511 executable references
  conf: 0.95
  any:
  - id: micro-behaviors/fs/path/basename::hi3511-dvr-executable-name
  - id: micro-behaviors/fs/path/application/executable::hi3511-app-path
- id: dvr-platform-executable-references
  desc: DVR executable name or path references
  conf: 0.93
  any:
  - id: micro-behaviors/fs/path/application/executable::hi3511-executable-references
  - id: micro-behaviors/fs/path/basename::gmdvr-executable-name
  - id: micro-behaviors/fs/path/basename::hikvision-dvr-executable-reference
  - id: micro-behaviors/fs/path/application/executable::davinci-app-path
  - id: micro-behaviors/fs/path/application/executable::kylin-app-path
