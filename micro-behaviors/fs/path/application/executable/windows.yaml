defaults:
  platforms: [windows]
  for: [scripts, source]
  crit: notable
  conf: 0.86

traits:
  - id: appdata-exe-path
    for: [scripts, pe, dll, csharp]
    desc: Windows AppData executable path
    attack: T1083
    mbc: E1083
    if:
      type: text
      regex: '(LOCAL)?APPDATA%?[/\\][^\r\n\"\x27]{1,180}\.exe\b'
  - id: node-runtime-helper-exe-basename
    for: [javascript, typescript, json]
    desc: node_runtime_helper executable basename
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: node_runtime_helper
  - id: edge-executable-search-path
    desc: Windows Edge executable search path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)%programfiles(\(x86\))?%.*?Microsoft[\\/]Edge.*?msedge\.exe'
