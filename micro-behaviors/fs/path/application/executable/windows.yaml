defaults:
  platforms: [windows]
  for: [scripts, source]
  crit: notable
  conf: 0.86

traits:
  - id: appdata-exe-path
    for: [scripts, pe, dll, csharp]
    desc: Windows AppData executable path
    attack: T1083
    mbc: E1083
    if:
      type: text
      regex: '(?i)(LOCAL)?APPDATA%?[/\\][^\r\n\"\x27]{1,180}\.exe($|[^\w.\\/-])'
  - id: edge-executable-search-path
    desc: Windows Edge executable search path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)%programfiles(\(x86\))?%.*?Microsoft[\\/]Edge.*?msedge\.exe'
  - id: nvidia-display-tray-path
    desc: NVIDIA Display Tray executable path
    for: [scripts, pe, dll, source]
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(Program Files( \(x86\))?[\\/])?NVIDIA Corporation[\\/]Display[\\/]nvtray\.exe'
