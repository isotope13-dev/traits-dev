# A path reference establishes neither an executable drop nor persistence.
defaults:
  platforms: [windows]
  for: [powershell, batch, pe, go, text]
  size_min: 8
  size_max: 500000000

traits:
  - id: appdata-svchost32-executable-path
    desc: AppData svchost32 executable path reference
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)appdata%?[\\/](\w+[\\/]){0,2}svchost32[\\/]svchost32\.exe'
