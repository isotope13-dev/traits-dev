# Relocated by the supported observation; matchers and scope preserved.
defaults:
  platforms:
  - linux
  for:
  - elf
  crit: notable
traits:
- id: bin-sh-rodata-substring
  desc: Read-only data contains /bin/sh bytes
  conf: 0.9
  if:
    type: raw
    substr: /bin/sh
    section: .rodata
composite_rules:
- id: go-bin-sh-binary-reference
  desc: Go binary contains the /bin/sh path
  conf: 0.95
  all:
  - id: metadata/lang/compiler/systems::go-binary
  - id: micro-behaviors/fs/path/application/executable::bin-sh-rodata-substring
