defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: regsvr32-name-reference
    desc: Regsvr32 executable name reference
    conf: 0.8
    for: [scripts, binaries, elixir, -powershell]
    if:
      type: text
      regex: \bregsvr32(\.exe)?
      case_insensitive: true
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  - id: regsvr32-encoded-name
    for: [powershell, batch, vbs, javascript, pe, dll]
    desc: Encoded Regsvr32 executable name reference
    conf: 0.8
    if:
      type: encoded
      encoding:
        - base64
        - hex
      regex: regsvr32(\.exe)?
      case_insensitive: true
  - id: regsvr32-hex-name
    desc: Hexadecimal Regsvr32 executable name reference
    conf: 0.8
    if:
      type: text
      regex: 7265677376723332(2e657865)?
      case_insensitive: true

composite_rules:
  - id: regsvr32-reference-or-call
    desc: Regsvr32 name reference or invocation
    conf: 0.9
    for: [scripts, binaries, elixir]
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    any:
      - id: regsvr32-name-reference
      - id: micro-behaviors/process/create/launch::regsvr32-powershell-call
