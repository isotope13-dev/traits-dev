traits:
- id: node-executable-name-reference
  desc: String references a node.exe executable filename
  crit: notable
  for:
  - scripts
  - source
  if:
    type: string_literal
    substr: node.exe
- crit: notable
  for:
  - javascript
  - typescript
  id: node-runtime-executable-path
  desc: String references a Node executable path
  conf: 0.85
  if:
    type: string_literal
    regex: '[/\\](bin[/\\]node|node\.exe)([?#\s]|$)'
defaults:
  platforms:
  - windows
  - unix
