# A referenced executable name is not malware-family attribution.
defaults:
  platforms: [windows]
  for: [pe, html]
traits:
  - id: numbered-installer-executable-reference
    desc: References install_NN.exe executable name
    crit: notable
    conf: 0.9
    size_max: 20000000
    if:
      type: text
      regex: '\binstall_\d{1,3}\.exe\b'
