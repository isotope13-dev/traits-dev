defaults:
  for: [pe, batch, powershell, javascript, vbs, python, csharp, cpp]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  # A name reference alone establishes neither a temporary path nor a launch.
  - id: hyphenated-setup-exe-name
    desc: References hyphenated setup executable filename
    if:
      type: text
      regex: '(?i)(^|[\\/])[A-Za-z0-9._ -]{1,80}-setup\.exe\b'
