defaults:
  platforms:
  - windows
  for:
  - vbs
traits:
- id: vbs-svchcst-exe-name
  desc: VBS svchcst.exe filename reference
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: svchcst.exe
- id: vbs-hash-shaped-exe-name
  desc: VBS hash-shaped EXE filename reference
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '[a-f0-9]{32,64}\.exe'
