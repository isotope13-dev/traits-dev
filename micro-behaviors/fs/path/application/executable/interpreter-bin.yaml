traits:
- id: bin-python
  desc: bin/python path
  if:
    type: string_literal
    substr: bin/python
  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog
- id: bin-node
  desc: bin/node path
  if:
    type: string_literal
    substr: bin/node
- id: bin-ruby
  desc: bin/ruby path
  if:
    type: string_literal
    substr: bin/ruby
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
