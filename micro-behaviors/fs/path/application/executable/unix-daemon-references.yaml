defaults:
  platforms: [unix, android]
  for: [elf]
  crit: notable
  conf: 0.9
traits:
  - id: cron-daemon-commandline
    desc: References a cron daemon command line
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: /usr/sbin/cron[d]?\s+-[fn]
  - id: sshd-daemon-commandline
    desc: References an sshd daemon command line
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: /usr/sbin/sshd\s+-[Dd]
    unless:
      - id: well-known/lib/cloud/sailresearch-sdk::official-native-addon
  - id: syslogd-or-smartd-path
    desc: References a syslogd or smartd executable path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: /usr/sbin/(syslogd|smartd)
  - id: cron-foreground-commandline
    platforms: [linux, openwrt]
    for: [elf, c, cpp]
    desc: Contains cron -f foreground command line
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: "/usr/sbin/cron -f"
  - id: sbin-auditd-cron-acpid
    desc: References auditd, cron, or acpid paths
    platforms: [linux, openwrt]
    for: [elf, c, cpp]
    if:
      type: text
      regex: /usr/sbin/(auditd|cron[d]?|acpid)
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: sbin-atd-sshd-rsyslogd
    desc: References atd, sshd, or rsyslogd paths
    platforms: [linux, openwrt]
    for: [elf, c, cpp]
    if:
      type: text
      regex: /usr/sbin/(atd|sshd|rsyslogd)
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

composite_rules:
  - id: multiple-daemon-executable-path-groups
    desc: Multiple system daemon path groups
    crit: notable
    conf: 0.9
    needs: 2
    any:
      - id: micro-behaviors/fs/path/application/executable::sbin-auditd-cron-acpid
      - id: micro-behaviors/fs/path/application/executable::sbin-atd-sshd-rsyslogd
      - id: syslogd-or-smartd-path
