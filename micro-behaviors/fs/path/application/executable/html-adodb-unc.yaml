# A UNC EXE path beside the ADODB ProgID is a path profile, not evidence that
# the stream writes that path.
defaults:
  platforms: [windows]
  for: [html]

composite_rules:
  - id: html-adodb-unc-exe-profile
    desc: HTML ADODB.Stream and UNC EXE path clues
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/com/automation::html-adodb-stream-progid-reference
      - id: micro-behaviors/fs/path/application/executable::unc-exe-path-reference
