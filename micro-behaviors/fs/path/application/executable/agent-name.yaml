# Executable basenames ending in `agent` (e.g. foo-agent.exe). Neutral path
# observation — RMM enrollment composites reference this; the bare name is not
# itself remote-administration intent (build agents, monitoring agents, etc.).
defaults:
  platforms: [windows]
  for: [batch, powershell, javascript, vbs, pe, scripts, source]
  crit: notable
  conf: 0.92

traits:
  - id: agent-suffixed-exe-or-msi-name
    desc: Executable or MSI name ends with agent
    attack: T1083
    if:
      type: literal
      kind: string
      regex: '(?i)\b([A-Za-z0-9_-]{2,32}agent|([A-Za-z0-9_-]{2,32}\.)?clientsetup)\.(exe|msi)\b'
    not:
      # Cursor IDE CLI binary paths (cursor-agent), not an installed agent binary.
      - substr: cursor-agent
