defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # The svchost.exe misspelling, as a path suffix or as a bare launch target
  # (`Open=SCVHOST.exe` in a worm autorun.inf). A delimiter before the name
  # keeps longer identifiers ("…myscvhost.exe") from matching.
  - id: scvhost-executable-name-reference
    desc: References the scvhost.exe executable name
    crit: notable
    conf: 0.95
    for: [pe, dll, batch, powershell, vbs, text]
    if:
      type: text
      regex: '(?i)(^|[\\/"''=:\s])scvhost\.exe'
