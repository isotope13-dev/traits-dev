defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95

traits:
  - id: explorer-executable-reference
    desc: References Windows Explorer executable name
    crit: notable
    conf: 0.94
    for: [pe, dll, c, cpp, powershell, batch, go, vbs, javascript]
    if:
      type: text
      regex: (?i)\bexplorer\.exe\b
