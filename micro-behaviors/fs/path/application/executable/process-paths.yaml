traits:
- platforms:
  - unix
  - android
  for:
  - elf
  id: sofia-executable-path
  desc: References Sofia appliance executable path
  crit: notable
  conf: 0.98
  if:
    type: text
    exact: /var/Sofia
    section: .rodata
- id: svchost-windows-root-path
  desc: Names svchost.exe in Windows root folder
  crit: notable
  conf: 0.9
  platforms:
  - windows
  for:
  - batch
  - powershell
  - vbs
  if:
    type: text
    regex: (?i)[a-z]:\\windows\\svchost\.exe\b
- id: node-executable-name-bytecode
  desc: JVM bytecode references node.exe
  crit: notable
  conf: 0.95
  for:
  - class
  platforms:
  - windows
  if:
    type: hex
    pattern: 6E 6F 64 65 2E 65 78 65
defaults: {}
