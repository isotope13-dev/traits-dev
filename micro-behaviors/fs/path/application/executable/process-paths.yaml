traits:
- platforms:
  - unix
  - android
  for:
  - elf
  id: sofia-executable-path
  desc: References Sofia appliance executable path
  crit: notable
  conf: 0.98
  if:
    type: text
    substr: /var/Sofia
    section: .rodata
- id: svchost-windows-root-path
  desc: Names svchost.exe in Windows root folder
  crit: notable
  conf: 0.9
  platforms:
  - windows
  for:
  - batch
  - powershell
  - vbs
  if:
    type: text
    regex: (?i)[a-z]:\\windows\\svchost\.exe\b
defaults: {}
