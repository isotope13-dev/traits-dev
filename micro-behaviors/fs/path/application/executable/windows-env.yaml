defaults:
  crit: notable
traits:
- platforms:
  - windows
  for:
  - batch
  - c
  - cpp
  - csharp
  - go
  - rust
  - python
  - powershell
  - javascript
  - typescript
  id: windows-environment-executable-path
  desc: Environment-based executable path
  conf: 0.92
  if:
    type: text
    regex: (?i)(%\w{1,64}%|\$env:\w{1,64})[\\/][^"\r\n]{0,120}\.exe\b
