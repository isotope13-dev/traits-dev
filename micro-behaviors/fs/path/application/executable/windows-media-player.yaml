# Localized Program Files folder names (Programmer, Programme, Programmi,
# Archivos de programa, ...) tried one after another locate the installed
# player on any Windows locale. One path is routine; several are a probe.
defaults:
  platforms: [windows]
  for: [javascript, vbs, html]
traits:
  - id: wmplayer-install-path-probe
    desc: Probes localized Windows Media Player paths
    crit: notable
    conf: 0.93
    count_min: 3
    if:
      type: text
      case_insensitive: true
      regex: 'Windows Media Player\\+wmplayer\.exe'
