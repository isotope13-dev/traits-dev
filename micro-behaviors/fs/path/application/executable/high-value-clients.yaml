---
defaults:
  platforms:
  - windows
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.85
traits:
- id: db-client-navicat-process
  desc: Navicat database client process name
  if:
    type: text
    regex: (?i)(^|[\s"'(\[/\\])navicat(\.exe)?([\s"')\]]|$)
- id: db-client-dbeaver-process
  desc: DBeaver database client process name
  if:
    type: text
    regex: (?i)(^|[\s"'(\[/\\])dbeaver(64)?(\.exe)?([\s"')\]]|$)
- id: ssh-client-xshell-process
  desc: Xshell SSH client process name
  if:
    type: text
    regex: (?i)(^|[\s"'(\[/\\])xshell\.exe([\s"')\]]|$)
- id: ssh-client-mobaxterm-process
  desc: MobaXterm SSH client process name
  if:
    type: text
    regex: (?i)(^|[\s"'(\[/\\])mobaxterm(\.exe)?([\s"')\]]|$)
- id: ssh-client-securecrt-process
  desc: SecureCRT SSH client process name
  if:
    type: text
    regex: (?i)(^|[\s"'(\[/\\])securecrt(\.exe)?([\s"')\]]|$)
- id: wallet-exodus-process
  desc: Exodus desktop wallet process name
  if:
    type: text
    regex: (?i)(^|[\s"'(\[/\\])exodus\.exe([\s"')\]]|$)
- id: wallet-ledger-live-process
  desc: Ledger Live desktop wallet process name
  if:
    type: text
    regex: (?i)(^|[\s"'(\[/\\])ledger live(\.exe)?([\s"')\]]|$)
composite_rules:
- id: high-value-client-app-targets
  desc: References two or more high-value client applications
  crit: notable
  conf: 0.85
  scope: file
  near_bytes: 4096
  near_lines: 30
  needs: 2
  any:
  - id: micro-behaviors/fs/path/application/executable::db-client-navicat-process
  - id: micro-behaviors/fs/path/application/executable::db-client-dbeaver-process
  - id: micro-behaviors/fs/path/application/executable::ssh-client-xshell-process
  - id: micro-behaviors/fs/path/application/executable::ssh-client-mobaxterm-process
  - id: micro-behaviors/fs/path/application/executable::ssh-client-securecrt-process
  - id: micro-behaviors/fs/path/application/executable::wallet-exodus-process
  - id: micro-behaviors/fs/path/application/executable::wallet-ledger-live-process
  - id: micro-behaviors/os/application/target/development::dev-apps-intellij
