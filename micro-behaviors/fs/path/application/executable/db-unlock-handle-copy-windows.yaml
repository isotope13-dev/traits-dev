defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]

traits:
  - id: browser-process-edge
    desc: References msedge.exe process name
    crit: notable
    conf: 0.82
    for: [pe, dll, c, cpp]
    platforms: [windows]
    if:
      type: text
      word: msedge.exe
  - id: browser-process-brave
    desc: Brave browser process name
    crit: notable
    conf: 0.82
    for: [pe, dll, c, cpp]
    platforms: [windows]
    if:
      type: text
      word: brave.exe
  - id: browser-process-opera
    desc: References opera.exe process name
    crit: notable
    conf: 0.82
    for: [pe, dll, c, cpp]
    platforms: [windows]
    if:
      type: text
      word: opera.exe
composite_rules:
  - id: browser-process-name-cluster
    desc: Multiple browser process names
    crit: component
    conf: 0.88
    for: [pe, dll, source]
    platforms: [windows]
    near_bytes: 512
    needs: 2
    any:
      - id: micro-behaviors/fs/path/application/executable::chrome-exe-process-name
      - id: micro-behaviors/fs/path/application/executable::browser-apps-firefox-exe
      - id: micro-behaviors/fs/path/application/executable::browser-process-edge
      - id: micro-behaviors/fs/path/application/executable::browser-process-brave
      - id: micro-behaviors/fs/path/application/executable::browser-process-opera
