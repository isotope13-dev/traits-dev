defaults:
  platforms: [unix, windows]
  for: [scripts, source, jsp, xml, text]
  crit: notable
  conf: 0.98

traits:
  - id: peoplesoft-environment-xml-path
    desc: PeopleSoft environment metadata XML file path
    if:
      type: text
      regex: 'envmetadata[/\\]+data[/\\]+environment[/\\]+[^"''<>\r\n]{1,160}\.xml\b'

  - id: peoplesoft-metadata-write-target
    desc: PeopleSoft command targets environment metadata
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\bm_targetFile\s*[:=][^\r\n]{0,200}envmetadata[/\\]'
