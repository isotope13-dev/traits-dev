defaults:
  platforms: [unix, windows]
  for: [scripts, source, jsp, xml, text]
  crit: notable
  conf: 0.98

traits:
  - id: peoplesoft-environment-xml-path
    desc: PeopleSoft environment metadata XML file path
    if:
      type: text
      regex: 'envmetadata[/\\]+data[/\\]+environment[/\\]+[^"''<>\r\n]{1,160}\.xml\b'
