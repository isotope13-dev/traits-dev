# Neutral observations relocated during release-diff triage.
defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - php
  - text
  id: wordpress-theme-path-reference
  desc: WordPress theme directory path reference
  conf: 0.9
  if:
    type: text
    substr: wp-content/themes/
- for:
  - scripts
  - html
  id: wordpress-application-authorization-route
  desc: WordPress application authorization route
  conf: 0.97
  if:
    type: text
    regex: (?i)wp-admin/authorize-application\.php
