defaults:
  platforms: [windows, unix]
  for: [php, text]
traits:
  - id: wp-plugin-path
    desc: WordPress plugin directory reference
    crit: component
    conf: 0.5
    if:
      type: text
      substr: wp-content/plugins
  - id: wp-plugin-path-encoded
    desc: Base64 encoded WordPress plugin path
    crit: notable
    conf: 0.85
    mbc: B0032
    attack: T1027
    if:
      type: text
      substr: d3AtY29udGVudC9wbHVnaW5z
  - id: wp-mu-plugin-path
    desc: WordPress Must-Use plugin path reference
    crit: component
    conf: 0.9
    if:
      type: text
      substr: wp-content/mu-plugins
    unless:
      - id: metadata/library/web-frameworks::wordpress-core-package-doc
      - type: text
        regex: "WP_UnitTestCase|@group\\s+[A-Za-z0-9_-]+"
      - id: metadata/library/web-frameworks::wordpress-core-include-bootstrap
    downgrade:
      any:
        - id: metadata/library/web-frameworks::wordpress-phpunit-test-case
        - id: metadata/library/web-frameworks::wordpress-core-api-symbols
  - id: wp-includes-path
    desc: WordPress core includes path reference
    crit: component
    conf: 0.7
    if:
      type: text
      substr: wp-includes/
    unless:
      - id: metadata/library/web-frameworks::wordpress-core-package-doc
      - id: metadata/library/web-frameworks::wordpress-core-include-bootstrap
    downgrade:
      any:
        - id: metadata/library/web-frameworks::wordpress-phpunit-test-case
        - id: metadata/library/web-frameworks::wordpress-core-api-symbols

  # Neutral ABSPATH concatenation (require/include under the WP root). Intent
  # for hostile uploaders lives in the webshell composites that also require
  # unauth REST routes and file writes — not in this atom alone.
  - id: php-abspath-path-join
    desc: Builds a filesystem path under ABSPATH
    crit: notable
    conf: 0.92
    for: [php]
    if:
      type: tree-sitter
      kind: binary_op
      regex: '\bABSPATH\s*\.\s*'
    unless:
      - type: text
        substr: "wp-admin/includes/upgrade.php"
      - type: text
        substr: "wp-admin/includes/file.php"

composite_rules:
  - id: wordpress-web-path
    desc: WordPress web application path
    crit: baseline
    conf: 0.75
    any:
      - id: wp-plugin-path
      - id: wp-mu-plugin-path
      - id: wp-includes-path
