defaults:
  platforms: [macos]
  for: [macho, python, shell, applescript, javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: app-contents-path
    desc: References an application Contents path
    conf: 0.6
    if:
      type: text
      substr: .app/Contents/
  - id: wallet-app-bundle-path
    desc: Cryptocurrency wallet application bundle path
    conf: 0.85
    if:
      type: text
      regex: /Applications/(Ledger (Live|Wallet)|Trezor Suite|Exodus)\.app
  - id: asar-zip-part-name
    desc: References a split app.asar ZIP part
    conf: 0.92
    if:
      type: text
      substr: app.asar.zip.part
  - id: tmp-app-asar
    desc: References app.asar under /tmp
    conf: 0.9
    if:
      type: text
      substr: /tmp/app.asar
