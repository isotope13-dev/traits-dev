defaults:
  platforms: [windows, unix]
  for: [shell]

traits:
  - id: appimage-glob-reference
    desc: References an AppImage bundle filename glob
    crit: notable
    conf: 0.9
    # A glob used to list, sign, or package executables is a path reference;
    # it establishes neither chmod nor any other permission change.
    if:
      type: text
      substr: '*.AppImage'
