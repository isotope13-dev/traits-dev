defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: electron-asar-path
    desc: Electron app.asar bundle path
    conf: 0.9
    if:
      type: string_literal
      substr: app.asar
    unless:
      - id: metadata/package/testing/harness/runtime/

  - id: electron-helper-app-path
    desc: Electron Helper.app bundle path
    if:
      type: string_literal
      regex: '(^|/)[A-Za-z0-9._ -]*Helper\.app(/Contents(/|$)|$)'
