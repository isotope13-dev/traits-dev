defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: electron-asar-path
    desc: Electron app.asar bundle path
    conf: 0.9
    if:
      type: string_literal
      substr: app.asar
  - id: electron-resources-asar-path-text
    desc: References an Electron resources/app.asar path
    conf: 0.8
    for: [scripts, source, binaries]
    if:
      type: text
      regex: (?i)resources[/\\]+app\.asar

  - id: app-asar-path-mention
    desc: Mentions an app.asar path
    crit: component
    conf: 0.7
    for: [scripts, binaries]
    if:
      type: text
      regex: (?i)app\.asar
  - id: electron-helper-app-path
    desc: Electron Helper.app bundle path
    if:
      type: string_literal
      regex: '(^|/)[A-Za-z0-9._ -]*Helper\.app(/Contents(/|$)|$)'

  - id: electron-resources-app-path
    desc: Electron resources/app directory path
    conf: 0.85
    if:
      type: string_literal
      regex: '(^|[\\/])resources[\\/]app([\\/]|$)'
  - id: electron-process-resources-path
    desc: References Electron process resources path
    conf: 0.85
    if:
      type: string_literal
      substr: process.resourcesPath
