traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  id: vscode-app-bundle-path
  desc: VS Code application bundle path reference
  crit: notable
  conf: 0.7
  if:
    type: text
    # A repository slug such as microsoft/vscode/code is not an installed app.
    # Keep spaced installation names, .app bundles and portable resources.
    regex: '(?i)[/\\]((Visual Studio |VS ?)Code\.app|(Microsoft )?VS Code|VSCode[/\\]resources)[/\\]'
