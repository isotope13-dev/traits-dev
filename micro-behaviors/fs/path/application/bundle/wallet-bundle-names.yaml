defaults:
  platforms: [macos]
  for: [macho, shell, go, c]
  crit: notable

traits:
  - id: ledger-live-bundle-name
    desc: References the Ledger Live app bundle name
    crit: notable
    if:
      type: text
      word: Ledger Live.app

  - id: trezor-suite-bundle-name
    desc: References the Trezor Suite app bundle name
    crit: notable
    if:
      type: text
      word: Trezor Suite.app

composite_rules:
  - id: hardware-wallet-app-bundle-name
    desc: References a hardware-wallet app bundle name
    crit: notable
    any:
      - id: micro-behaviors/fs/path/application/bundle::ledger-live-bundle-name
      - id: micro-behaviors/fs/path/application/bundle::trezor-suite-bundle-name
