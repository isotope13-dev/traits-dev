traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  id: client-distribution-directory
  desc: Client or installer distribution directory
  crit: notable
  conf: 0.92
  unless:
  - id: well-known/lib/network/atproto-api::atproto-api-pnpm-bundle-path
  - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
  if:
    type: text
    regex: (?i)(dist|download|release)[\\/](client|installer|update)[\\/]
