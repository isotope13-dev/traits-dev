defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: app-version-dir
  desc: Electron app-* version directory pattern
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: '[/\\]app-[0-9*]'
composite_rules:
- id: asar-with-version-dir
  desc: app.asar with version directory
  crit: notable
  all:
  - id: micro-behaviors/fs/path/application/bundle::app-asar-path-mention
  - id: micro-behaviors/fs/path/application/bundle::app-version-dir
- id: electron-asar-path-context
  desc: Electron resources ASAR or versioned application path references
  crit: notable
  conf: 0.8
  any:
  - id: micro-behaviors/fs/path/application/bundle::electron-resources-asar-path-text
  - id: micro-behaviors/fs/path/application/bundle::asar-with-version-dir
