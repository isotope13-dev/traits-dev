defaults:
  attack: T1083
  mbc: E1083
  for:
    - macho
    - objc
    - swift
    - applescript
  platforms:
    - macos

traits:
  - id: screen-saver-bundle-path
    desc: References a macOS screen-saver bundle path
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      regex: '(/Library|~/Library)/Screen Savers|[/\\][^/\\\s]{1,80}\.saver\b'
    not:
      - substr: --screen-saverdir
      - substr: "Target location for Screen Savers"

  - id: application-macos
    desc: "/Applications/*.app/Contents/MacOS/ path"
    crit: notable
    conf: 0.66
    if:
      type: text
      regex: /Applications/[\w\s.\-]+\.app/Contents/MacOS/[\w.\-]+
