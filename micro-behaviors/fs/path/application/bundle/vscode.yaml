traits:
- id: vscode-application-root-access
  desc: References VS Code application root
  conf: 0.96
  if:
    type: symbol
    kind: member
    exact: vscode.env.appRoot
- id: vscode-host-main-file-reference
  desc: References VS Code host main.js path
  conf: 0.94
  if:
    type: text
    regex: (?i)[\\/](out|bootstrap|vs)[\\/][^;\r\n]{0,60}main\.js|workbench[^;\r\n]{0,60}main\.js
- id: vscode-host-workbench-file-reference
  desc: References VS Code workbench HTML filename
  conf: 0.94
  if:
    type: text
    regex: (?i)workbench(\.esm)?\.html
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
