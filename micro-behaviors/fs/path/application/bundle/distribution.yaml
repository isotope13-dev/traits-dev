defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: client-distribution-directory-path
    desc: Client or installer distribution directory path
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(^|[\\/])(client|installer|setup|update)[\\/](dist|download|release)[\\/]'
  - id: client-instfiles-dir-path
    desc: ClientInstFiles distribution directory
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)ClientInstFiles[\\/]'
  - id: client-installer-exe-name
    desc: Client or installer executable name
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '(?i)(^|[\\/"''])(client|installer|setup|update)[^\\/"''\r\n]{0,60}\.(exe|msi)\b'
composite_rules:
  - id: client-installer-dir-path
    desc: Client distribution directory path
    crit: component
    conf: 0.92
    any:
      - id: client-instfiles-dir-path
      - id: client-distribution-directory-path
      - id: client-distribution-directory
  - id: client-distribution-installer-path
    desc: Client installer path in distribution tree
    crit: notable
    conf: 0.94
    near_bytes: 512
    all:
      - id: client-installer-dir-path
    any:
      - id: client-installer-exe-name
      - id: micro-behaviors/os/package-manager/installer-script::installer-package-filename
