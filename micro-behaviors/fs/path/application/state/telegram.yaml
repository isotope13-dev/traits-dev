defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, csharp, package.json, rust, source]
  crit: notable
  conf: 0.85

traits:
  - id: telegram-desktop-data-path
    desc: Telegram Desktop application-data path
    conf: 0.9
    if:
      type: text
      regex: '(?i)Telegram Desktop[/\\]+(tdata|[A-Za-z0-9_.-]+[/\\]+tdata)\b'
  - id: telegram-data-path
    desc: Telegram application-data path
    if:
      type: text
      regex: 'Telegram[/\\]+tdata\b'
  - id: telegram-tdata-path-parts
    desc: Adjacent Telegram tdata path components
    if:
      type: text
      regex: >-
        Telegram( Desktop)?['"][ \t]{0,4},[ \t]{0,4}['"]tdata\b
  - id: telegram-appstore-data-path
    desc: Telegram App Store application-data path
    conf: 0.95
    if:
      type: text
      substr: '6N38VWS5BX.ru.keepcoder.Telegram/appstore'
  - id: telegram-desktop-tdata-compact-path
    desc: TelegramDesktop tdata path segment
    conf: 0.9
    if:
      type: text
      regex: '(?i)TelegramDesktop[/\\]tdata\b'

composite_rules:
  - id: telegram-session-data-location
    desc: References a Telegram session-data location
    conf: 0.9
    any:
      - id: telegram-desktop-data-path
      - id: telegram-data-path
      - id: telegram-tdata-path-parts
      - id: telegram-desktop-tdata-compact-path
