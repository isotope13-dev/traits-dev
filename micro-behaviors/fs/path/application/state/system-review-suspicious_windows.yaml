defaults:
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
  platforms: [windows]
traits:
  - id: programdata-directory-path
    desc: ProgramData directory path reference
    crit: notable
    conf: 0.82
    for: [source, scripts, binaries]
    if:
      type: text
      regex: '(?i)(\\ProgramData|%ProgramData%|%ALLUSERSPROFILE%)\\[A-Za-z0-9._ -]{3,64}'
    unless:
      - id: metadata/file/profile/syntax-tree::source-no-parsed-call-sites
  - id: programdata-dropper-subdir-path
    desc: ProgramData path with a directory named dropper
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\\ProgramData\\dropper\\'
