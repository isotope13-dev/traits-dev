# Mutable editor state; a path alone does not establish credential access.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.96

traits:
  - id: windsurf-global-storage-database-path
    desc: Windsurf global state database path
    if:
      type: text
      regex: '(?i)\bWindsurf( - Next)?[/\\]+User[/\\]+globalStorage[/\\]+state\.vscdb(["''\s]|$)'
