defaults:
  platforms: [windows]
  for: [pe]
  crit: notable

traits:
  - id: auto-file-path
    desc: ProgramData auto file path
    if:
      type: text
      substr: 'C:\ProgramData\auto.txt'

  - id: dump-directory-path
    desc: ProgramData System dump directory path
    if:
      type: text
      substr: 'C:\ProgramData\System\Dump\'

