# Configuration files documented for self-managed GitLab Linux package
# installations. These paths are notable even in legitimate tooling;
# traversal-based theft is inferred in objective-level composites.
defaults:
  platforms: [linux]
  for: [scripts, source, text, data, binaries]

traits:
  - id: gitlab-secret-config-path
    desc: GitLab Linux-package configuration path
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)/etc/gitlab/(gitlab-secrets\.json|gitlab\.rb)\b'
