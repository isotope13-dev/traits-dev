defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell, markdown, text]
  crit: notable
  conf: 0.9

traits:
  - id: cursor-config-directory
    desc: Cursor config directory path
    # The bare `\.cursor[\\/]` form must be a path segment, not a property
    # access followed by division (e.g. minified `o.cursor/100`), so require a
    # non-identifier delimiter before it (char class, not an extra alternation).
    unless:
      - id: metadata/file/format/markup::adblock-filter-list
      - id: well-known/tool/detection/repo-trust-scan::repo-trust-scan-context
      - id: well-known/lib/ui/monaco-editor/
    if:
      type: text
      regex: '["'']\.cursor["'']|[\\/]\.cursor([\\/]|$)|[\s"''`(=:,]\.cursor[\\/]'

  - id: claude-config-directory
    desc: Claude Code config directory path
    unless:
      - id: metadata/file/format/markup::adblock-filter-list
      - id: well-known/tool/detection/repo-trust-scan::repo-trust-scan-context
      - id: metadata/file/string/corpus::hashed-text-record
    if:
      type: text
      # Quoted paths and real path separators. Single `\` before `.claude` in
      # prose Windows paths (e.g. C:\Users\Bob\.claude\plans) is not a config
      # reference — only escaped `\\` in source strings or `/` on Unix.
      regex: '["'']\.claude["'']|/\.claude([\\/]|$)|\\\\\.claude([\\/]|$)'
      not:
        - regex: '\.claude[\\/]CLAUDE\.md'

  - id: claude-settings-json
    desc: Claude Code project settings JSON path
    crit: notable
    conf: 0.97
    for: [json]
    if:
      type: path
      regex: '(?i)(^|[\\/])\.claude[\\/]settings\.json$'

  - id: claude-project-settings-path
    desc: Claude Code project settings path
    crit: notable
    conf: 0.96
    for: [javascript, typescript, python, shell, powershell, ruby]
    if:
      type: string_literal
      regex: '(?i)(^|[\\/])\.claude[\\/]settings\.json$'

  - id: claude-global-settings-path
    desc: Claude Code global settings path
    crit: notable
    conf: 0.96
    for: [python, shell]
    if:
      type: text
      regex: '(?i)(~|[$]HOME)[\\/]\.claude[\\/]settings\.json|Path\.home\(\)\s*/\s*["'']\.claude["'']'

  - id: claude-global-settings-path-js
    desc: JavaScript Claude settings path
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: 'path\.join\(os\.homedir\(\),\s*["'']\.claude["'']\s*,\s*["'']settings\.json["'']\s*\)'

  # The constant name projects use for the path above.  Relocated from
  # well-known/app/ai/gateway/neurolink, where the same substring was described as a
  # "NeuroLink Claude settings path" and so attributed every unrelated
  # TypeScript project that names this constant to that product.
  - id: claude-settings-path-constant
    desc: CLAUDE_SETTINGS_PATH constant reference
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: 'CLAUDE_SETTINGS_PATH'

  - id: claude-session-projects-directory
    desc: Claude Code session projects directory path
    crit: notable
    conf: 0.97
    for: [javascript, typescript, python, shell]
    if:
      type: text
      regex: '(?i)[\\/]\.claude[\\/]projects([\\/]|$)|["'']\.claude["'']\s*(/|,)\s*["'']projects["'']'

  - id: claude-session-history-file
    desc: Claude Code session history file path
    crit: notable
    conf: 0.97
    for: [javascript, typescript, python, shell]
    if:
      type: text
      regex: '(?i)[\\/]\.claude[\\/]history\.jsonl|["'']\.claude["'']\s*/\s*["'']history\.jsonl["'']'

  - id: gemini-config-directory
    desc: Gemini CLI config directory path
    unless:
      - id: micro-behaviors/fs/path/application/state::gemini-antigravity-brain-output
    if:
      type: text
      regex: '["'']\.gemini["'']|[\\/]\.gemini([\\/]|$)|\.gemini[\\/]'

  - id: codex-config-directory
    desc: Codex config directory path
    if:
      type: text
      regex: '["'']\.codex["'']|[\\/]\.codex([\\/]|$)|\.codex[\\/]'

  - id: codex-global-hooks-path
    desc: Codex global hooks path
    crit: notable
    conf: 0.96
    for: [python, shell]
    if:
      type: text
      regex: '(?i)(~|[$]HOME)[\\/]\.codex[\\/]hooks\.json|Path\.home\(\)\s*/\s*["'']\.codex["'']'

  - id: codex-absolute-config-directory
    desc: Absolute Codex config directory path
    if:
      type: literal
      kind: string
      regex: '[\\/]\.codex$'

  - id: codex-config-toml
    desc: Codex config TOML path
    ref: sha256:a709234609a3c0423f68d9ebc1c219f349879cb4f29786d2d5e797e6b098cfd3
    if:
      type: text
      regex: '\.codex[\\/]config\.toml|["'']\.codex["'']\s*/\s*["'']config\.toml'

  - id: codex-skills-directory
    desc: Codex skills directory path
    if:
      type: text
      regex: '\.codex[\\/]skills[\\/]'

  # Claude's skill roots: `~/.agents/skills/` (Claude Code) and
  # `<Claude config>/agents/skills/` (Claude Desktop). Matched as path
  # segments, so any implementation hits regardless of what the surrounding
  # code names its variables.
  - id: agents-skills-directory
    desc: Claude agents skills directory path
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '[\\/]\.?agents[\\/]skills[\\/]'

  # Same directory, built segment-by-segment (path.join(h, '.agents',
  # 'skills', …) / os.path.join / Join-Path) rather than written as a literal.
  - id: agents-skills-path-join
    desc: Joins a Claude agents skills directory path
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '["'']\.?agents["'']\s*,\s*["'']skills["'']'

  - id: claude-skills-directory
    desc: Claude Code skills directory path
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\.claude[\\/]skills[\\/]'

  - id: openclaw-workspace-skills-directory
    desc: OpenClaw workspace skills directory path
    if:
      type: text
      regex: 'workspace-assistant-\$\{[A-Za-z_$][A-Za-z0-9_$]*\}.{0,80}["'']skills["'']'

  - id: openclaw-config-directory
    desc: OpenClaw config directory path
    if:
      type: text
      regex: '["'']\.openclaw["'']|[\\/]\.openclaw([\\/]|$)|\.openclaw[\\/]'

  - id: openclaw-paired-operator-state
    desc: References OpenClaw paired operator state
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: 'paired\.json[\s\S]{0,700}(roles|scopes)[\s\S]{0,700}operator'
      case_insensitive: true

  - id: openclaw-workspace-soul-path
    desc: OpenClaw workspace SOUL identity path
    crit: notable
    conf: 0.98
    for: [javascript, typescript, python, shell]
    if:
      type: string_literal
      regex: '(?i)(^|[\\/])\.openclaw[\\/]workspace[\\/]SOUL\.md$'

  - id: openclaw-config-json-literal
    desc: Literal .openclaw/openclaw.json path segment
    crit: notable
    conf: 0.96
    for: [python, shell, javascript, typescript]
    if:
      type: text
      regex: '\.openclaw[\\/]openclaw\.json'

  - id: openclaw-config-json-path-join
    desc: Path.home join for openclaw.json
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: 'Path\.home\(\)\s*/\s*["'']\.openclaw["'']\s*/\s*["'']openclaw\.json["'']'



  - id: ai-plugin-registry-files
    desc: AI plugin registry filenames
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: 'known_marketplaces\.json[\s\S]{0,120}installed_plugins\.json'

  - id: claude-commands-directory
    desc: Claude commands directory path
    ref: sha256:f9b935ef1d644960445911670b391fed77ba2cc0a5024fc114eaa19c7b5c0aab
    unless:
      - id: metadata/file/format/markup::adblock-filter-list
    if:
      type: text
      regex: '\.claude[\\/]commands[\\/]'

  - id: opencode-skills-directory
    desc: OpenCode skills directory path
    ref: sha256:f9b935ef1d644960445911670b391fed77ba2cc0a5024fc114eaa19c7b5c0aab
    if:
      type: text
      regex: '\.opencode[\\/]skills[\\/]'

  - id: gemini-antigravity-skills-directory
    desc: Gemini Antigravity skills directory path
    ref: sha256:f9b935ef1d644960445911670b391fed77ba2cc0a5024fc114eaa19c7b5c0aab
    if:
      type: text
      regex: '\.gemini[\\/]antigravity[\\/]skills[\\/]'

  - id: windsurf-config-directory
    desc: Windsurf config directory path
    if:
      type: text
      regex: '[\\/]\.windsurf([\\/]|$)|\.codeium[\\/]windsurf'

  - id: windsurf-quoted-config-directory
    desc: Windsurf quoted config directory
    if:
      type: text
      regex: '["'']\.windsurf["'']|\.windsurf[\\/]'

  - id: pearai-config-directory
    desc: PearAI config directory path
    if:
      type: text
      regex: '["'']\.pearai["'']|[\\/]\.pearai([\\/]|$)|\.pearai[\\/]'

  - id: eigent-config-directory
    desc: Eigent config directory path
    if:
      type: text
      regex: '["'']\.eigent["'']|[\\/]\.eigent([\\/]|$)|\.eigent[\\/]'

  - id: mcp-json-filename
    desc: MCP config filename
    crit: component
    if:
      type: text
      word: mcp.json

  - id: kiro-settings-mcp-config-path
    desc: Kiro IDE settings MCP config path
    # ~/.kiro/settings/mcp.json is the Kiro (Amazon agentic IDE) MCP server
    # configuration target implicated in the CVE-2026-10591 config-injection
    # chain. Match the path either threaded via os.path.join/home or as a
    # literal segment, mirroring the other per-vendor config-directory atoms.
    crit: notable
    conf: 0.94
    unless:
      - id: well-known/tool/detection/repo-trust-scan::repo-trust-scan-context
    if:
      type: text
      regex: '[\\/]\.kiro[\\/]settings[\\/]mcp\.json'

  - id: mcp-config-json-filename
    desc: Windsurf MCP config filename
    crit: component
    if:
      type: text
      word: mcp_config.json

  - id: agent-instruction-path-literal
    desc: References an AI agent instruction path
    for: [javascript, typescript, python, shell]
    if:
      type: literal
      regex: '(^|[\\/])(AGENTS|CLAUDE|GEMINI)\.md$'

  - id: claude-desktop-config-path
    desc: Claude Desktop configuration file path
    crit: notable
    conf: 0.96
    if:
      type: text
      # Require path/IO context; a help paragraph that merely names the
      # configuration file is not a file-path operation.
      regex: '(?i)\b(path|open|read|write)\b.{0,120}claude[_-]desktop[_-]config\.json'

  # Claude Code hook *protocol* behaviors (PreToolUse, UserPromptSubmit, updatedInput,
  # hookSpecificOutput, …) live in micro-behaviors/communications/ipc/agent-hook/ —
  # they are agent IPC, not config paths. This file keeps only config-path detections.

  - id: codex-hook-script
    desc: Codex hook script path
    if:
      type: text
      regex: '\.codex[\\/]hooks[\\/].{1,120}\.sh'

composite_rules:
  - id: openclaw-config-json-path
    desc: OpenClaw openclaw.json config path
    crit: notable
    conf: 0.96
    any:
      - id: openclaw-config-json-literal
      - id: openclaw-config-json-path-join

  - id: ai-coding-tool-config-directory-cluster
    desc: Multiple AI coding tool config directories
    crit: notable
    conf: 0.92
    needs: 2
    unless:
      - id: metadata/file/format/markup::adblock-filter-list
      - id: well-known/tool/detection/repo-trust-scan::repo-trust-scan-context
    any:
      - id: cursor-config-directory
      - id: claude-config-directory
      - id: gemini-config-directory
      - id: codex-config-directory
      - id: windsurf-config-directory
      - id: windsurf-quoted-config-directory
      - id: pearai-config-directory
      - id: eigent-config-directory
      - id: openclaw-config-directory

  - id: mcp-client-config-target
    desc: AI MCP client config target
    crit: notable
    conf: 0.92
    unless:
      - id: well-known/tool/detection/repo-trust-scan::repo-trust-scan-context
    all:
      - id: ai-coding-tool-config-directory-cluster
    any:
      - id: mcp-json-filename
      - id: mcp-config-json-filename

  - id: claude-mcp-json-target
    desc: Claude MCP JSON config target
    crit: notable
    conf: 0.94
    ref: sha256:a709234609a3c0423f68d9ebc1c219f349879cb4f29786d2d5e797e6b098cfd3
    unless:
      - id: well-known/tool/detection/repo-trust-scan::repo-trust-scan-context
    all:
      - id: claude-config-directory
      - id: mcp-json-filename

  - id: codex-mcp-toml-target
    desc: Codex MCP TOML config target
    crit: notable
    conf: 0.94
    ref: sha256:a709234609a3c0423f68d9ebc1c219f349879cb4f29786d2d5e797e6b098cfd3
    all:
      - id: codex-config-toml
      - id: micro-behaviors/communications/ipc/mcp::mcp-client-config-key--mcp-servers-toml

  - id: ai-agent-skill-install-directory
    desc: AI agent skill install directory
    crit: notable
    conf: 0.93
    ref: sha256:f9b935ef1d644960445911670b391fed77ba2cc0a5024fc114eaa19c7b5c0aab
    any:
      - id: codex-skills-directory
      - id: claude-commands-directory
      - id: agents-skills-directory
      - id: agents-skills-path-join
      - id: claude-skills-directory
      - id: opencode-skills-directory
      - id: gemini-antigravity-skills-directory
