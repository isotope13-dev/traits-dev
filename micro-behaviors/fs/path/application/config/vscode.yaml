defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: vscode-user-dir-components
    desc: VS Code user config directory components
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '["'']Code["'']\s*,\s*["'']User["'']'

  - id: vscode-settings-json-filename
    desc: VS Code settings.json filename
    crit: component
    conf: 0.95
    if:
      type: text
      substr: settings.json

  - id: vscode-workspace-dir
    desc: VS Code workspace directory
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '["'']/?(\./)?\.(vscode)["'']'

  - id: jetbrains-idea-dir
    desc: JetBrains IDEA directory
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '["'']/?(\./)?\.(idea)["'']'

  - id: vscode-tasks-json-filename
    desc: VS Code tasks.json filename
    crit: component
    conf: 0.95
    if:
      type: text
      substr: tasks.json

  - id: vscode-project-settings-path
    desc: VS Code project settings path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: .vscode/settings.json

  - id: vscode-project-tasks-path
    desc: VS Code project tasks path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: .vscode/tasks.json

  - id: vscode-project-setup-path
    desc: VS Code project setup script path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: .vscode/setup.

composite_rules:
  - id: editor-agent-config-path-cluster
    desc: References multiple editor-agent config paths
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: micro-behaviors/fs/path/application/config::claude-project-settings-path
      - id: vscode-project-settings-path
      - id: vscode-project-tasks-path
      - id: vscode-project-setup-path

  - id: vscode-global-settings-path
    desc: VS Code global settings path
    crit: notable
    conf: 0.94
    all:
      - id: vscode-user-dir-components
      - id: vscode-settings-json-filename

  - id: vscode-global-tasks-path
    desc: VS Code global tasks path
    crit: notable
    conf: 0.94
    all:
      - id: vscode-user-dir-components
      - id: vscode-tasks-json-filename
