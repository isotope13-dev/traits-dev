defaults:
  platforms: [unix]
  for: [python]

traits:
  - id: wireguard-config-directory
    desc: WireGuard configuration directory path
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      substr: /etc/wireguard
    unless:
      - type: path
        regex: '(^|[\\/])(tests?|fixtures?|mocks?)([\\/]|$)'
      - type: path
        regex: '(^|[\\/])test[_-].*\.py$'
