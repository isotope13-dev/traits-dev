# OpenCode (sst/opencode) agent config surfaces.
#
# OpenCode reads `opencode.json` from `~/.config/opencode/`, `~/.opencode/` and
# the working directory, and loads custom agent definitions from an adjacent
# `agents/` directory. Both are the write targets a plugin needs to rewrite in
# order to change which agent runs and what it is allowed to do, so the paths
# belong beside the other per-vendor AI config-path atoms in this directory
# rather than inside any one product's well-known/ tree.
#
# Paths alone are neutral — OpenCode's own tooling names them too. The intent
# comes from the composites in objectives/ that pair a config-path target with
# a permission-gate change and a file write.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell, json, markdown]
  crit: notable
  conf: 0.93

traits:
  - id: opencode-config-directory
    desc: OpenCode config directory path
    if:
      type: text
      regex: '["'']\.opencode["'']|[\\/]\.opencode([\\/]|$)|\.opencode[\\/]'

  - id: opencode-config-json-path
    desc: OpenCode config JSON path
    conf: 0.96
    if:
      type: text
      regex: 'opencode[\\/]opencode\.json|["'']opencode\.json["'']'

  - id: opencode-agents-directory
    desc: OpenCode custom agents directory path
    conf: 0.94
    if:
      type: text
      regex: '\.?opencode[\\/]agents([\\/]|$)|["'']opencode["''],\s*["'']agents["'']'

composite_rules:
  # One concrete, writable agent configuration file. Used by objectives/ rules
  # that need "this code targets an AI coding agent's own config" without also
  # demanding two different vendors the way
  # `ai-coding-tool-config-directory-cluster` does — a single-vendor hijacker
  # only ever touches one.
  - id: ai-agent-config-file-target
    desc: Targets an AI coding agent config file
    crit: notable
    conf: 0.94
    unless:
      - id: well-known/tool/detection/repo-trust-scan::repo-trust-scan-context
    any:
      - id: opencode-config-json-path
      - id: claude-settings-json
      - id: claude-project-settings-path
      - id: claude-global-settings-path
      - id: claude-global-settings-path-js
      - id: codex-config-toml
      - id: openclaw-config-json-path
      - id: claude-desktop-config-path
      - id: kiro-settings-mcp-config-path
