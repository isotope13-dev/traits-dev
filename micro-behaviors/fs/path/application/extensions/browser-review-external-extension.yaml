# Chromium reads every `*.json` under its application-side `External
# Extensions` directory at startup and installs what they name. The directory
# sits beside the browser binary rather than inside a user profile, so a write
# there survives profile resets and applies to every user of the machine.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, data]
  crit: notable
  conf: 0.92
  attack: T1176
traits:
  - id: chromium-external-extensions-directory
    desc: Chromium External Extensions drop directory
    if:
      type: text
      regex: '(?i)External Extensions([/\\]|["'']|$)'
