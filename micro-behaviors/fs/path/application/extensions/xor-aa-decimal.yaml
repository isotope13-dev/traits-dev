defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: component
traits:
  - id: xor-aa-extension-path-prefix
    desc: Encoded extension path prefix
    if:
      type: text
      regex: '\b230\s*,\s*197\s*,\s*201\s*,\s*203\s*,\s*198\s*,\s*138\s*,\s*239\s*,\s*210\b'
  - id: xor-aa-extension-path-middle
    desc: Encoded extension path middle
    if:
      type: text
      regex: '\b222\s*,\s*207\s*,\s*196\s*,\s*217\s*,\s*195\s*,\s*197\s*,\s*196\s*,\s*138\b'
  - id: xor-aa-extension-path-suffix
    desc: Encoded extension path suffix
    if:
      type: text
      regex: '\b249\s*,\s*207\s*,\s*222\s*,\s*222\s*,\s*195\s*,\s*196\s*,\s*205\s*,\s*217\b'
composite_rules:
  # These values decode to "Local Extension Settings" with key 0xaa.
  # This records the encoded path; it does not establish a read or upload.
  - id: xor-aa-local-extension-settings-numeric-sequence
    desc: XOR-AA Chromium extension settings path
    crit: notable
    conf: 0.95
    near_bytes: 256
    all:
      - id: xor-aa-extension-path-prefix
      - id: xor-aa-extension-path-middle
      - id: xor-aa-extension-path-suffix
