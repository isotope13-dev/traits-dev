defaults:
  platforms: [windows, unix]
  for: [class]
  conf: 0.98
traits:
  - id: minecraft-curseforge-instance-root
    desc: CurseForge Minecraft instances path
    crit: component
    if:
      type: value
      path: class.strings[*]
      exact: curseforge/minecraft/Instances
  - id: minecraft-prism-instance-root
    desc: Prism Launcher instances path
    crit: component
    if:
      type: value
      path: class.strings[*]
      exact: PrismLauncher/instances
  - id: minecraft-modrinth-profile-root
    desc: Modrinth profiles path
    crit: component
    if:
      type: value
      path: class.strings[*]
      exact: com.modrinth.theseus/profiles
  - id: minecraft-default-mods-root
    desc: Default Minecraft mods path
    crit: component
    if:
      type: value
      path: class.strings[*]
      exact: .minecraft/mods
  - id: minecraft-feather-profile-root
    desc: Feather user profiles path
    crit: component
    if:
      type: value
      path: class.strings[*]
      exact: Feather/user-profiles
  - id: minecraft-gdlauncher-instance-root
    desc: GDLauncher instances path
    crit: component
    if:
      type: value
      path: class.strings[*]
      exact: GDLauncher/instances
composite_rules:
  - id: minecraft-multiple-launcher-profile-roots
    desc: Minecraft launcher profile directory references
    crit: notable
    needs: 3
    any:
      - id: minecraft-curseforge-instance-root
      - id: minecraft-prism-instance-root
      - id: minecraft-modrinth-profile-root
      - id: minecraft-default-mods-root
      - id: minecraft-feather-profile-root
      - id: minecraft-gdlauncher-instance-root
