defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: minecraft-multiple-launcher-profile-roots
    desc: Multiple Minecraft launcher profile-directory references
    crit: notable
    conf: 0.98
    count_min: 3
    if:
      type: value
      path: class.strings[*]
      regex: '^(curseforge/minecraft/Instances|PrismLauncher/instances|com\.modrinth\.theseus/profiles|\.minecraft/mods|Feather/user-profiles|GDLauncher/instances)$'
