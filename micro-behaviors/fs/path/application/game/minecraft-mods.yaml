defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: minecraft-multiple-launcher-profile-roots
    desc: Multiple Minecraft launcher profile paths
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule minecraft_multiple_launcher_profile_roots {
          strings:
            $root1 = "curseforge/minecraft/Instances" ascii
            $root2 = "PrismLauncher/instances" ascii
            $root3 = "com.modrinth.theseus/profiles" ascii
            $root4 = ".minecraft/mods" ascii
            $root5 = "Feather/user-profiles" ascii
            $root6 = "GDLauncher/instances" ascii
          condition:
            uint32be(0) == 0xcafebabe and 3 of them
        }
