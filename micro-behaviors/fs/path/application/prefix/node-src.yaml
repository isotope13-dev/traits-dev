defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
- id: node-cwd-src-path-context
  desc: References cwd beside source-directory literal
  crit: notable
  conf: 0.95
  unless:
    - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
    - id: well-known/app/ai/governance/nexus-agents::nexus-llm-threat-taxonomy-labels
  if:
    type: text
    regex: 'process\.cwd\(\)[\s\S]{0,80}["'']src["'']|["'']src["''][\s\S]{0,80}process\.cwd\(\)'
