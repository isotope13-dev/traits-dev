defaults:
  platforms: [windows]
  for: [pe, dll, go, c, cpp, csharp, rust, powershell, batch, python]
  crit: notable
  conf: 0.92

traits:
  - id: gdata-windows-install-dir
    desc: G DATA Windows install directory path
    if:
      type: text
      regex: '(?i)[a-z]:[\\/]+(Program Files( \(x86\))?[\\/]+)?G DATA( [a-z ]{1,18})?[\\/]'

  - id: kaspersky-windows-install-dir
    desc: Kaspersky Windows install directory path
    if:
      type: text
      regex: '(?i)[a-z]:[\\/]+(Program Files( \(x86\))?[\\/]+)?Kaspersky( Lab)?[\\/]'

  - id: bitdefender-windows-install-dir
    desc: Bitdefender Windows install directory path
    if:
      type: text
      regex: '(?i)[a-z]:[\\/]+(Program Files( \(x86\))?[\\/]+)?Bitdefender[\\/]'

  - id: avast-windows-install-dir
    desc: Avast Windows install directory path
    if:
      type: text
      regex: '(?i)[a-z]:[\\/]+(Program Files( \(x86\))?[\\/]+)?(AVAST Software|Avast)[\\/]'

  - id: avg-windows-install-dir
    desc: AVG Windows install directory path
    if:
      type: text
      regex: '(?i)[a-z]:[\\/]+(Program Files( \(x86\))?[\\/]+)?AVG[\\/]'

  - id: eset-windows-install-dir
    desc: ESET Windows install directory path
    if:
      type: text
      regex: '(?i)[a-z]:[\\/]+(Program Files( \(x86\))?[\\/]+)?ESET[\\/]'

  - id: malwarebytes-windows-install-dir
    desc: Malwarebytes Windows install directory path
    if:
      type: text
      regex: '(?i)[a-z]:[\\/]+(Program Files( \(x86\))?[\\/]+)?Malwarebytes[\\/]'

  - id: mcafee-windows-install-dir
    desc: McAfee Windows install directory path
    if:
      type: text
      regex: '(?i)[a-z]:[\\/]+(Program Files( \(x86\))?[\\/]+)?McAfee[\\/]'

composite_rules:
  - id: security-vendor-install-directory
    desc: Security vendor install directory path
    crit: notable
    conf: 0.93
    any:
      - id: gdata-windows-install-dir
      - id: kaspersky-windows-install-dir
      - id: bitdefender-windows-install-dir
      - id: avast-windows-install-dir
      - id: avg-windows-install-dir
      - id: eset-windows-install-dir
      - id: malwarebytes-windows-install-dir
      - id: mcafee-windows-install-dir
