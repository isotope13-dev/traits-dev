# Conventional container/application root prefixes. A string literal beginning
# `/src/`, `/app/`, `/srv/` or `/opt/` is a filesystem path inside an image and
# nothing more: Dockerfiles, CI configs, source maps and stack traces are full
# of them. These were defined under objectives/credential-access/files/
# hdf5-external/, where the HDF5 external-storage composites that consume them
# supply the actual disclosure primitive — but the atoms themselves carried a
# credential-access finding into every containerized project.
defaults:
  platforms: [unix]
  for: [scripts]
  crit: component
  conf: 0.9
traits:
  - id: container-app-root-path
    desc: Absolute container application root path
    if:
      # A string literal, not a URL: page links and repository URLs commonly
      # contain /src/ without naming a filesystem target.
      type: literal
      kind: string
      regex: '(?i)^/(src|srv|app|opt)/'
  - id: container-app-script-path
    desc: Script file under a container app root
    if:
      type: literal
      kind: string
      regex: '(?i)^/(src|app)/.{1,160}\.(js|py|ts)$'
