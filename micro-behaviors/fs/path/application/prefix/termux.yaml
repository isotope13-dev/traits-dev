defaults:
  platforms: [android, unix]
  for: [shell, javascript, python, elf]
  crit: component
  conf: 0.9
traits:
  - id: termux-usr-prefix
    crit: notable
    desc: Termux usr prefix path
    if:
      type: text
      substr: "/data/data/com.termux/files/usr"
  - id: termux-usr-bin
    crit: notable
    desc: Termux usr bin path
    if:
      type: text
      substr: "/data/data/com.termux/files/usr/bin"
  - id: termux-usr-library
    crit: notable
    desc: Termux usr library path
    if:
      type: text
      substr: "/data/data/com.termux/files/usr/lib"
  - id: termux-prefix-bin-construction
    crit: notable
    desc: Constructs the Termux PREFIX bin directory path
    if:
      type: text
      regex: 'path\.join\(\s*PREFIX\s*,\s*["'']bin["'']\s*\)'
