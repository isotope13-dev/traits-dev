# Security installation path review; matcher and effective scope preserved.
---
defaults:
  platforms:
  - unix
  - windows
traits:
- id: antivirus-directory-path-reference
  desc: Antivirus directory path reference
  crit: notable
  conf: 0.9
  for:
  - batch
  - scripts
  - pe
  if:
    type: text
    regex: "(?i)[\\\\/](antivi[a-z~0-9]{0,6}|inocul[a-z~0-9]{0,6}|f-secure)[\\\\/]"
