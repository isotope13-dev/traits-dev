defaults:
  for:
    - macho
    - objc
    - swift
    - applescript
    - shell
  platforms:
    - macos
traits:
  - id: firefox-extensions
    desc: Firefox/extensions directory path
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: Firefox/extensions
  - id: safari-extensions
    desc: Safari/Extensions directory path
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: Safari/Extensions
  - id: chrome-extensions-dir
    desc: Chrome browser extensions directory path
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: Chrome/Default/Extensions/
  - id: brave-extensions-dir
    desc: Brave browser extensions directory path
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: Brave-Browser/Default/Extensions/
  - id: edge-extensions-dir
    desc: MS Edge browser extensions dir path
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: Microsoft Edge/Default/Extensions/
  - id: opera-extensions-dir
    desc: Opera browser extensions directory path
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: com.operasoftware.Opera/Extensions/
  - id: vivaldi-extensions-dir
    desc: Vivaldi browser extensions directory path
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: Vivaldi/Default/Extensions/
  - id: arc-extensions-dir
    desc: Arc browser extensions directory path
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: Arc/User Data/Default/Extensions/
composite_rules:
  - id: application-browser-extensions
    desc: Browser extension paths
    crit: notable
    conf: 0.66
    any:
      - id: micro-behaviors/fs/path/application/browser/extension::firefox-extensions
      - id: micro-behaviors/fs/path/application/browser/extension::safari-extensions
      - id: micro-behaviors/fs/path/application/browser/extension::chrome-extensions-dir
      - id: micro-behaviors/fs/path/application/browser/extension::brave-extensions-dir
      - id: micro-behaviors/fs/path/application/browser/extension::edge-extensions-dir
      - id: micro-behaviors/fs/path/application/browser/extension::opera-extensions-dir
      - id: micro-behaviors/fs/path/application/browser/extension::vivaldi-extensions-dir
      - id: micro-behaviors/fs/path/application/browser/extension::arc-extensions-dir
