defaults:
  platforms: [unix, windows]
  for: [scripts, pe, elf, macho]
composite_rules:
  - id: edge-browser-data-references
    desc: Edge name and browser data path references
    crit: notable
    conf: 0.85
    all:
      - id: metadata/file/string/application-name::edge-name-reference
    any:
      - id: micro-behaviors/fs/path/personal::history-file
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
