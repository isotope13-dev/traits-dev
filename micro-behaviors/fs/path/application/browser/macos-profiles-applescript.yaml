# Gecko profile-path references do not establish access or credential theft.
defaults:
  crit: notable
  conf: 0.85
  platforms: [macos]
  for: [applescript, shell]

traits:
- id: firefox-profiles-path
  desc: References a Firefox profiles path
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: Firefox/Profiles/
  unless:
  - id: micro-behaviors/crypto/certificate/usage::certutil-ca-bundle-export
- id: waterfox-profiles-path
  desc: References a Waterfox profiles path
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: Waterfox/Profiles/
