defaults:
  attack: T1555.003
  platforms:
  - linux
  - macos
  - windows
  for: [scripts, binaries, source]

traits:
- id: chrome-path
  desc: Chrome credential database path reference
  crit: notable
  conf: 0.7
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/app/media/kopuz::music-player-context
  - id: well-known/tool/offensive/psbits::source-tree-member
  if:
    type: text
    regex: (?i)Google[/\\]Chrome[/\\]User Data[/\\].{0,40}(Login Data|Cookies)
# Same rationale as chrome-path: a Brave/Edge/Opera profile locator alone is
# inventory evidence used by download managers and session-import tools, not
# theft. Composites below supply the credential-access intent legs.
- id: brave-path
  desc: Brave browser profile path
  crit: notable
  conf: 0.7
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/app/media/kopuz::kopuz-isolated-cookie-module
  - id: well-known/app/media/kopuz::kopuz-isolated-cookie-leaf
  - id: well-known/app/media/kopuz::music-player-context
  - id: well-known/tool/browser::idm-download-manager-context
  if:
    type: text
    regex: (?i)BraveSoftware[/\\]Brave-Browser.{0,80}(Login Data|Cookies)
  downgrade:
    any:
    - id: metadata/binary/layout/size::massive-executable
- id: edge-path
  desc: Microsoft Edge browser profile path
  crit: notable
  conf: 0.7
  unless:
    - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    - id: well-known/app/browser/microsoft-edge::microsoft-edge-package-context
    - id: well-known/app/media/kopuz::kopuz-isolated-cookie-module
    - id: well-known/app/media/kopuz::kopuz-isolated-cookie-leaf
    - id: well-known/app/media/kopuz::music-player-context
    - id: well-known/tool/browser::idm-download-manager-context
  if:
    type: text
    regex: (?i)Microsoft[/\\]Edge.{0,80}(Login Data|Cookies)
    case_insensitive: true
- id: opera-macos-path
  desc: Opera macOS profile path
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: /com.operasoftware.Opera/
  unless:
    - id: well-known/app/media/kopuz::kopuz-isolated-cookie-module
    - id: well-known/app/media/kopuz::kopuz-isolated-cookie-leaf
    - id: well-known/app/media/kopuz::music-player-context
    - id: well-known/lib/development/browser-cookie3::browser-cookie3-library-context
    - id: well-known/app/utility/macos-cleaners::macos-cleaner-app
- id: opera-windows-path
  desc: Opera Windows profile path
  crit: notable
  conf: 0.7
  unless:
    - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
    - id: well-known/app/media/kopuz::kopuz-isolated-cookie-module
    - id: well-known/app/media/kopuz::kopuz-isolated-cookie-leaf
    - id: well-known/app/media/kopuz::music-player-context
    - id: well-known/tool/browser::idm-download-manager-context
  if:
    type: text
    regex: (?i)Opera Software[/\\](Opera|Opera GX Stable).{0,80}(Login Data|Cookies)
- id: operagx-path
  desc: Opera GX macOS credential store path
  crit: notable
  conf: 0.7
  if:
    type: text
    # Credential-store context required, matching the chrome/brave/edge
    # siblings: a bare container path also matches cache-only listings
    # (Caches/com.operasoftware.OperaGX/Cache), which disk cleaners carry by
    # design. The Windows "Opera GX Stable" form lives in opera-windows-path.
    regex: (?i)/com\.operasoftware\.OperaGX/.{0,40}(Login Data|Cookies)
  unless:
    - id: well-known/app/media/kopuz::kopuz-isolated-cookie-module
    - id: well-known/app/media/kopuz::kopuz-isolated-cookie-leaf
    - id: well-known/app/media/kopuz::music-player-context
    - id: well-known/lib/development/browser-cookie3/
    - id: well-known/app/utility/macos-cleaners::macos-cleaner-app
- id: vivaldi-path
  desc: Vivaldi browser profile path
  crit: suspicious
  conf: 0.7
  unless:
  - id: well-known/app/media/kopuz::music-player-context
  if:
    type: text
    substr: User Data/Vivaldi
- id: yandex-path
  desc: Yandex browser profile path
  crit: notable
  conf: 0.7
  unless:
  # A browser-data cleaner enumerates every browser's profile directory
  # because clearing it is the product -- DeepCleanMac and Avast's
  # BrowsingDataCleanerCore both matched on their own inventory.
  - id: well-known/app/utility/macos-cleaners::macos-cleaner-app
  - id: well-known/app/security/avast::browsing-data-cleaner-framework
  - id: well-known/app/media/kopuz::music-player-context
  - id: metadata/package/testing/presence/harness::test-directory
  - id: well-known/app/ai/tool-server/linkedin-mcp-server::browser-import-discovery-context
  - id: well-known/app/ai/tool-server/linkedin-mcp-server::browser-import-archive-context
  if:
    type: text
    substr: Yandex/YandexBrowser
  downgrade:
    any:
    - id: metadata/binary/layout/size::massive-executable
- id: coccoc-path
  desc: Coccoc browser profile path
  crit: suspicious
  conf: 0.7
  unless:
  - id: well-known/app/media/kopuz::music-player-context
  if:
    type: text
    substr: /com.coccoc.Coccoc/
composite_rules:
- id: opera-path
  desc: Opera browser profile path
  crit: notable
  conf: 0.7
  unless:
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/app/media/kopuz::music-player-context
  - id: well-known/tool/browser::idm-download-manager-context
  any:
  - id: micro-behaviors/fs/path/application/browser::opera-macos-path
  - id: micro-behaviors/fs/path/application/browser::opera-windows-path
