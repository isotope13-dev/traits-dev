defaults:
  platforms: [windows, unix]
  for: [pe, elf, python, javascript, powershell]
traits:
  - id: installed-chrome-windows-path
    desc: Installed Chrome Windows executable path
    crit: notable
    for: [binaries, scripts, source, -class, -pyc, -beam, -wasm, -staticlib]
    if:
      type: literal
      regex: '(?i)Google[/\\]Chrome[/\\]Application[/\\]chrome\.exe'

