defaults:
  platforms: [unix, windows]
  for: [scripts, pe, elf, macho]

traits:
  - id: safari-bookmarks-plist-path
    desc: Safari Bookmarks.plist path reference
    crit: component
    conf: 0.9
    if:
      type: text
      substr: Bookmarks.plist

composite_rules:
  - id: browser-data-files
    desc: Browser data file references
    crit: notable
    conf: 0.7
    any:
    - id: micro-behaviors/fs/path/personal::history-file
    - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
    - id: micro-behaviors/fs/path/password-store::login-data
    - id: micro-behaviors/fs/path/personal::places-sqlite
    - id: safari-bookmarks-plist-path
    unless:
    - id: well-known/app/browser/palemoon/
    - id: well-known/tool/detection/cleave::cleave-static-analysis-context
    - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
