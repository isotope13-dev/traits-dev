defaults:
  attack: T1083
  mbc: E1083
  for:
    - macho
    - objc
    - swift
    - applescript
    - shell
  platforms:
    - macos
traits:
  - id: firefox-profile-prefs-path
    desc: Firefox profile prefs.js path
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(?i)Firefox[/\\]Profiles[/\\][^/\\\n]{1,80}[/\\]prefs\.js\b'
  - id: mozilla-profile-prefs-path
    desc: Mozilla profile prefs.js path
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(?i)\.mozilla[/\\][^/\\\n]{1,80}[/\\]prefs\.js\b'
  - id: firefox-extensions
    desc: Firefox/extensions directory path
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: Firefox/extensions
  # Notable, not suspicious: a bare path substring, and the objective rule
  # built on it -- `objectives/persistence/system/surface/extension::
  # safari-extension-surface` -- is where the persistence claim lives and
  # already stands down for uninstaller utilities. That guard worked on
  # Pearcleaner and AppCleaner SmartDelete; this unguarded leaf reported them
  # at suspicious anyway, which is the whole finding on both samples.
  - id: safari-extensions
    desc: Safari/Extensions directory path
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: Safari/Extensions
  - id: chrome-extensions-dir
    desc: Chrome browser extensions directory path
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: Chrome/Default/Extensions/
  - id: brave-extensions-dir
    desc: Brave browser extensions directory path
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: Brave-Browser/Default/Extensions/
  - id: edge-extensions-dir
    desc: "MS Edge browser extensions dir path"
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: Microsoft Edge/Default/Extensions/
  - id: opera-extensions-dir
    desc: Opera browser extensions directory path
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: com.operasoftware.Opera/Extensions/
  - id: vivaldi-extensions-dir
    desc: Vivaldi browser extensions directory path
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: Vivaldi/Default/Extensions/
  - id: arc-extensions-dir
    desc: Arc browser extensions directory path
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: Arc/User Data/Default/Extensions/
  - id: chrome-directory
    desc: Google/Chrome directory path
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: Google/Chrome
  - id: chrome-profile-path
    desc: Chrome browser profile path reference
    crit: notable
    conf: 0.8
    for: [applescript, shell]
    if:
      type: text
      substr: Google/Chrome/
  - id: chrome-macos-support-path
    desc: Chrome macOS Application Support path
    crit: notable
    conf: 0.85
    # All supported source parsers now cache string literals. The former
    # language exclusions predated that coverage and hid the same path in
    # Perl, Kotlin, Zig, and Elixir packages.
    for: [scripts, source]
    if:
      type: literal
      substr: Application Support/Google/Chrome
  - id: chrome-macos-support-path-class
    desc: JVM Chrome macOS support path
    crit: notable
    conf: 0.9
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      substr: Application Support/Google/Chrome
  - id: arc-profile-path
    desc: Arc browser profile path
    crit: notable
    conf: 0.8
    for: [python, applescript]
    if:
      type: text
      substr: Arc/User Data
composite_rules:
  - id: firefox-preferences-file-path
    desc: Firefox preferences file path
    crit: notable
    conf: 0.82
    any:
      - id: firefox-profile-prefs-path
      - id: mozilla-profile-prefs-path
  # The whole browser-extension-directory family is notable, not suspicious.
  # Each leg is a bare path substring (`Chrome/Default/Extensions/`,
  # `Safari/Extensions`), and naming the directory is what uninstallers,
  # backup tools and extension managers do -- Pearcleaner and AppCleaner
  # SmartDelete were reported on it. These are micro-behaviours: the objective
  # rules built on them (persistence/system/surface/extension, and the browser
  # stealer rules) carry the claim and already stand down for cleaner apps.
  - id: application-browser-extensions
    desc: Browser extension paths
    crit: notable
    conf: 0.66
    any:
      - id: firefox-extensions
      - id: safari-extensions
      - id: chrome-extensions-dir
      - id: brave-extensions-dir
      - id: edge-extensions-dir
      - id: opera-extensions-dir
      - id: vivaldi-extensions-dir
      - id: arc-extensions-dir
