defaults:
  platforms: [windows, linux, macos]
  for: [scripts, source, html, json]
  crit: notable
  conf: 0.98

traits:
  - id: edge-autolaunch-protocol-policy-path
    desc: Edge protocol auto-launch component policy path
    if:
      type: text
      regex: '(?i)AutoLaunchProtocolsComponent[/\\][^/\\]{1,40}[/\\]protocols\.json'
