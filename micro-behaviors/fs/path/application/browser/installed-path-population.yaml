defaults:
  platforms: [windows, unix]
  for: [pe, elf, python, javascript, powershell]
  crit: baseline
composite_rules:
  - id: installed-browser-executable-paths
    desc: Multiple installed browser executable paths
    crit: notable
    conf: 0.96
    for: [binaries, scripts, source]
    needs: 2
    any:
      - id: micro-behaviors/fs/path/application/executable::installed-chrome-executable-path
      - id: micro-behaviors/fs/path/application/executable::installed-edge-executable-path
      - id: micro-behaviors/fs/path/application/executable::installed-firefox-executable-path

