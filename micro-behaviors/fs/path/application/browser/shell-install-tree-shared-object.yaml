# A shared object named inside a browser's own /opt install directory. Browsers
# ship their libraries from the package at install time; a shell command that
# writes a new .so there is placing code the browser process will load.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1574.006

traits:
  - id: browser-install-tree-shared-object
    desc: Shared object path in browser install dir
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '/opt/(google|chromium|brave|microsoft|opera|vivaldi)[\w.-]*/[\w./-]{0,60}\.so\b'
