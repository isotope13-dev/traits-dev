---
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  crit: notable
  conf: 0.95
traits:
- id: chromium-profile-history-path
  desc: Chromium profile History database path
  if:
    type: text
    regex: "(?i)(Chrome|Edge)[\\\\/]User Data[^\\r\\n]{0,64}[\\\\/]History\\b"
- id: firefox-profile-store-path
  desc: Firefox profile login or history path
  if:
    type: text
    regex: "(?i)Firefox[\\\\/]Profiles[^\\r\\n]{0,48}[\\\\/](places\\.sqlite|logins\\.json)"
composite_rules:
- id: browser-profile-store-file-reference
  desc: Browser profile data-store path reference
  any:
  - id: micro-behaviors/fs/path/application/browser::chromium-profile-history-path
  - id: micro-behaviors/fs/path/application/browser::firefox-profile-store-path
  - id: micro-behaviors/fs/path/application/browser::chrome-path
  - id: micro-behaviors/fs/path/application/browser::edge-path
  - id: micro-behaviors/fs/path/application/browser::brave-path
