# Chromium App-Bound Encryption bypass through a browser memory snapshot and
# same-process decryption. The API names are intentionally language-neutral so
# the composite applies to native and managed implementations alike.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, rust, go, python]
  attack: T1555.003,T1055.004
  mbc: B0028

traits:
  - id: chromium-browser-store-set
    desc: "Browser login or state filename"
    crit: notable
    conf: 0.92
    if:
      # Login Data and Local State are distinctive Chromium store names.  The
      # generic Cookies label is intentionally excluded: HTML clients and
      # cookie-jar helpers commonly use that word without touching Chromium.
      type: literal
      regex: '^(Login Data|Local State)$'
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/lib/vendor-sdk/chrome-agent::copy-chrome-cookies-routine
      - id: micro-behaviors/process/create/script/automation::chrome-profile-clone-routine
      - id: micro-behaviors/process/create/script/automation::playwright-persistent-browser-context
