defaults:
  mbc: E1083
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: tencent-qqbrowser-path
    desc: Tencent QQBrowser directory path
    crit: notable
    conf: 0.8
    attack: T1083
    if:
      type: text
      regex: (?i)Tencent\\\\QQBrowser
  - id: tencent-qqbrowser-extensions
    desc: Tencent QQBrowser extensions path
    crit: suspicious
    conf: 0.9
    attack: T1547.001
    if:
      type: text
      regex: (?i)Tencent\\\\QQBrowser\\\\User Data\\\\Default\\\\Extensions
  - id: chrome-windows-profile
    desc: Chrome Windows profile path
    crit: notable
    conf: 0.8
    for: [scripts, binaries, source]
    if:
      type: text
      regex: (?i)Google[/\\]{1,2}Chrome[/\\]{1,2}(User Data|Default|Profile [0-9]+)[/\\]{0,2}
  - id: chrome-unix-profile
    desc: Chrome Unix profile path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)google-chrome[/\\](Default|Profile [0-9]+)[/\\]?
  - id: chrome-windows-userdata-path
    desc: Chrome Windows User Data path
    crit: notable
    conf: 0.85
    platforms: [windows]
    for: [scripts, source, -ruby, -php, -perl, -lua, -vbs, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: literal
      substr: Local/Google/Chrome/User Data
  - id: chrome-appdata-path
    desc: Chrome AppData path
    crit: notable
    conf: 0.85
    platforms: [windows]
    for: [scripts, source, -ruby, -php, -perl, -lua, -vbs, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: literal
      substr: AppData/Local/Google/Chrome
  - id: chrome-linux-config-directory
    desc: Chrome Linux config directory path
    crit: notable
    conf: 0.85
    platforms: [unix]
    for: [scripts, source, -batch, -powershell, -vbs, -applescript, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: literal
      substr: .config/google-chrome
  - id: edge-windows-profile
    desc: Edge Windows profile path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)Microsoft[/\\]Edge[/\\](User Data|Default|Profile [0-9]+)[/\\]?
  - id: edge-unix-profile
    desc: Edge Unix profile path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)microsoft-edge[/\\](Default|Profile [0-9]+)[/\\]?
  - id: brave-profile-directory
    desc: Brave browser profile directory path
    crit: notable
    conf: 0.84
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)Brave-Browser[/\\]{1,2}(User Data|Default|Profile [0-9]+)'
  - id: opera-windows-profile-directory
    desc: Opera Windows profile directory path
    crit: notable
    conf: 0.84
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)Opera Software[/\\]{1,2}Opera Stable[/\\]?'
  # The macOS profile lives under Application Support, and that prefix is
  # required here: a bare `com.operasoftware.Opera` is only Opera's bundle
  # identifier. Default-browser lookup tables (the `default-browser` npm
  # package, LSCopyDefaultHandler maps) list every browser's bundle id without
  # ever touching a profile — that read is browser identification, not profile
  # access, and it was reaching the CDP profile-hijack composites.
  - id: opera-macos-profile-directory
    desc: Opera macOS profile directory path
    crit: notable
    conf: 0.84
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)Application Support[/\\]{1,2}com\.operasoftware\.Opera[/\\]?'
  - id: vivaldi-profile-directory
    desc: Vivaldi browser profile directory path
    crit: notable
    conf: 0.84
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)Vivaldi[/\\]{1,2}(User Data|Default|Profile [0-9]+)'
  - id: firefox-profile-directory
    desc: Firefox browser profile directory path
    crit: notable
    conf: 0.86
    for: [scripts, source, binaries]
    if:
      type: text
      regex: (?i)(Mozilla[/\\]{1,2})?Firefox[/\\]{1,2}Profiles|/\\.mozilla/firefox
  - id: palemoon-profile-directory
    desc: Pale Moon browser profile directory path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)Pale Moon[/\\]Profiles|Moonchild Productions[/\\]Pale Moon
  - id: browser-extension-storage
    desc: Browser extension storage or profile path
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: (?i)User Data\\\\.{1,30}\\\\Extensions\\\\
    unless:
      - id: well-known/lib/runtime/electron::electron-known-debug-extension-loader
  - id: browser-extension-manifest-path
    desc: Browser extension manifest path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)Extensions[/\\]{1,2}.{1,120}[/\\]{1,2}manifest\.json\b'
  - id: firefox-profiles-ini-path
    desc: Firefox profiles.ini path
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: (?i)Mozilla\\\\Firefox\\\\profiles\.ini
  - id: firefox-proxy-type-pref
    desc: Firefox proxy type preference
    crit: component
    conf: 0.86
    if:
      type: text
      exact: network.proxy.type
  - id: firefox-proxy-http-pref
    desc: Firefox HTTP proxy preference
    crit: component
    conf: 0.86
    if:
      type: text
      exact: network.proxy.http
  - id: firefox-proxy-port-pref
    desc: Firefox proxy port preference
    crit: component
    conf: 0.86
    if:
      type: text
      exact: network.proxy.http_port
  - id: firefox-proxy-autoconfig-pref
    desc: Firefox proxy autoconfig preference
    crit: component
    conf: 0.86
    if:
      type: text
      exact: network.proxy.autoconfig_url
composite_rules:
  - id: browser-data-path
    desc: Browser profile or data directory path
    crit: notable
    conf: 0.85
    for: [scripts, source, binaries]
    platforms: [unix, windows, macos]
    any:
      - id: chrome-windows-userdata-path
      - id: chrome-appdata-path
      - id: chrome-linux-config-directory
      - id: firefox-profile-directory
  - id: chrome-user-data
    desc: Chrome profile or user-data path
    crit: notable
    conf: 0.8
    for: [scripts, binaries, source]
    any:
      - id: chrome-windows-profile
      - id: chrome-unix-profile
  - id: edge-user-data
    desc: Edge profile or user-data path
    crit: notable
    conf: 0.8
    any:
      - id: edge-windows-profile
      - id: edge-unix-profile
  - id: chromium-profile-directory-path
    desc: Installed Chromium browser profile path
    crit: notable
    conf: 0.88
    for: [scripts, source, binaries]
    any:
      - id: chrome-windows-profile
      - id: chrome-unix-profile
      - id: chrome-windows-userdata-path
      - id: chrome-appdata-path
      - id: chrome-linux-config-directory
      - id: edge-windows-profile
      - id: edge-unix-profile
      - id: brave-profile-directory
      - id: opera-windows-profile-directory
      - id: opera-macos-profile-directory
      - id: vivaldi-profile-directory
      - id: chrome-macos-support-path
      - id: arc-profile-path
  - id: firefox-proxy-config-reference
    desc: Firefox proxy configuration reference
    crit: notable
    conf: 0.9
    all:
      - id: firefox-profiles-ini-path
    any:
      - id: firefox-proxy-type-pref
      - id: firefox-proxy-http-pref
      - id: firefox-proxy-port-pref
      - id: firefox-proxy-autoconfig-pref
    needs: 2
