defaults:
  mbc: E1083
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: tencent-qqbrowser-path
    desc: Tencent QQBrowser directory path
    crit: notable
    conf: 0.8
    attack: T1083
    if:
      type: text
      regex: (?i)Tencent\\\\QQBrowser
  - id: tencent-qqbrowser-extensions
    desc: Tencent QQBrowser extensions path
    crit: suspicious
    conf: 0.9
    attack: T1547.001
    if:
      type: text
      regex: (?i)Tencent\\\\QQBrowser\\\\User Data\\\\Default\\\\Extensions
  - id: chrome-windows-profile
    desc: Chrome Windows profile path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)Google[/\\]Chrome[/\\](User Data|Default|Profile [0-9]+)[/\\]?
  - id: chrome-unix-profile
    desc: Chrome Unix profile path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)google-chrome[/\\](Default|Profile [0-9]+)[/\\]?
  - id: chrome-windows-userdata-path
    desc: Chrome Windows User Data path
    crit: notable
    conf: 0.85
    platforms: [windows]
    for: [scripts, source, -ruby, -php, -perl, -lua, -vbs, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: literal
      substr: Local/Google/Chrome/User Data
  - id: chrome-appdata-path
    desc: Chrome AppData path
    crit: notable
    conf: 0.85
    platforms: [windows]
    for: [scripts, source, -ruby, -php, -perl, -lua, -vbs, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: literal
      substr: AppData/Local/Google/Chrome
  - id: chrome-linux-config-directory
    desc: Chrome Linux config directory path
    crit: notable
    conf: 0.85
    platforms: [unix]
    for: [scripts, source, -batch, -powershell, -vbs, -applescript, -groovy, -kotlin, -scala, -zig, -elixir]
    if:
      type: literal
      substr: .config/google-chrome
  - id: edge-windows-profile
    desc: Edge Windows profile path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)Microsoft[/\\]Edge[/\\](User Data|Default|Profile [0-9]+)[/\\]?
  - id: edge-unix-profile
    desc: Edge Unix profile path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)microsoft-edge[/\\](Default|Profile [0-9]+)[/\\]?
  - id: firefox-profile-directory
    desc: Firefox browser profile directory path
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: (?i)Mozilla[/\\]Firefox[/\\]Profiles|/\\.mozilla/firefox|Firefox[/\\]Profiles
  - id: palemoon-profile-directory
    desc: Pale Moon browser profile directory path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)Pale Moon[/\\]Profiles|Moonchild Productions[/\\]Pale Moon
  - id: browser-extension-storage
    desc: Browser extension storage or profile path
    crit: suspicious
    conf: 0.7
    if:
      type: text
      regex: (?i)User Data\\\\.{1,30}\\\\Extensions\\\\
  - id: firefox-profiles-ini-path
    desc: Firefox profiles.ini path
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: (?i)Mozilla\\\\Firefox\\\\profiles\.ini
  - id: firefox-proxy-type-pref
    desc: Firefox proxy type preference
    crit: component
    conf: 0.86
    if:
      type: text
      exact: network.proxy.type
  - id: firefox-proxy-http-pref
    desc: Firefox HTTP proxy preference
    crit: component
    conf: 0.86
    if:
      type: text
      exact: network.proxy.http
  - id: firefox-proxy-port-pref
    desc: Firefox proxy port preference
    crit: component
    conf: 0.86
    if:
      type: text
      exact: network.proxy.http_port
  - id: firefox-proxy-autoconfig-pref
    desc: Firefox proxy autoconfig preference
    crit: component
    conf: 0.86
    if:
      type: text
      exact: network.proxy.autoconfig_url
composite_rules:
  - id: browser-data-path
    desc: Browser profile or data directory path
    crit: notable
    conf: 0.85
    for: [scripts, source, binaries]
    platforms: [unix, windows, macos]
    any:
      - id: chrome-windows-userdata-path
      - id: chrome-appdata-path
      - id: chrome-linux-config-directory
      - id: firefox-profile-directory
  - id: chrome-user-data
    desc: Chrome profile or user-data path
    crit: notable
    conf: 0.8
    any:
      - id: chrome-windows-profile
      - id: chrome-unix-profile
  - id: edge-user-data
    desc: Edge profile or user-data path
    crit: notable
    conf: 0.8
    any:
      - id: edge-windows-profile
      - id: edge-unix-profile
  - id: firefox-proxy-config-reference
    desc: Firefox proxy configuration reference
    crit: notable
    conf: 0.9
    all:
      - id: firefox-profiles-ini-path
    any:
      - id: firefox-proxy-type-pref
      - id: firefox-proxy-http-pref
      - id: firefox-proxy-port-pref
      - id: firefox-proxy-autoconfig-pref
    needs: 2
