defaults:
  crit: notable
traits:
  - platforms:
      - android
      - unix
    for:
      - binaries
      - scripts
      - source
    id: android-chromium-secret-store-path
    desc: Android Chrome cookie or login store paths
    conf: 0.9
    if:
      type: text
      regex: '/data/(user/[0-9]+/)?com\.android\.chrome.{0,80}(Cookies|Login Data)'
