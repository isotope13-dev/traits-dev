defaults:
  crit: notable
  platforms: [android, unix]
  for: [binaries, scripts, source]
traits:
  - id: android-chromium-secret-store-path
    desc: Android Chrome cookie or login store paths
    conf: 0.9
    if:
      type: text
      # user/<id>/ is the multi-user form; data/ is the legacy single-user
      # mount of the same per-app directory.
      regex: '/data/(user/[0-9]+/|data/)?com\.android\.chrome.{0,80}(Cookies|Login Data)'

  - id: android-chromium-history-store-path
    desc: Android Chrome browsing-history store path
    conf: 0.95
    if:
      type: text
      regex: '/com\.android\.chrome/app_chrome/[^/\r\n"'']{1,80}/History(["''\s]|$)'

composite_rules:
  # Keep history out of the credential-only selector used by credential-access
  # consumers. This broader selector describes browser state, including activity.
  - id: android-chromium-store-path
    desc: Android Chrome cookie, login or history-store path
    conf: 0.9
    any:
      - id: android-chromium-secret-store-path
      - id: android-chromium-history-store-path
