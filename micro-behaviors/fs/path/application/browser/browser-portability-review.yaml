traits:
- platforms:
  - android
  - unix
  for:
  - binaries
  - scripts
  - source
  id: android-chromium-secret-store-path
  desc: Android browser secret path
  conf: 0.9
  if:
    type: text
    regex: /data/com\.android\.chrome.{0,80}(Cookies|Login Data)
- platforms:
  - unix
  - windows
  for:
  - elf
  - macho
  - pe
  - scripts
  id: chromium-profile-subdirectory-reference
  desc: Chromium profile subdirectory reference
  conf: 0.85
  if:
    type: text
    regex: Profile [0-9].{0,50}Local Extension|Default.{0,50}Profile [0-9]
composite_rules:
- platforms:
  - unix
  - windows
  for:
  - elf
  - macho
  - pe
  - scripts
  id: safari-data-path-reference
  desc: Safari name and browser-data path co-occur
  conf: 0.85
  all:
  - id: metadata/file/string/application-name::safari-browser-name-literal
  any:
  - id: micro-behaviors/fs/path/personal::safari-history-db
  - id: micro-behaviors/fs/path/config/app::safari-preferences-plist
  - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
- platforms:
  - unix
  - windows
  for:
  - elf
  - macho
  - pe
  - scripts
  id: multiple-browser-data-references
  desc: Browser names and data filenames co-occur
  conf: 0.9
  all:
  - id: micro-behaviors/os/application/target::multiple-browser-names
  - id: micro-behaviors/fs/path/application/browser::browser-data-files
defaults:
  crit: notable
