defaults:
  attack: T1555.003
  platforms:
    - unix
    - windows
    - macos
  for:
    - shell
    - applescript
    - macho

traits:
  - id: localstorage
    desc: Safari LocalStorage path
    crit: suspicious
    conf: 0.75
    platforms:
      - macos
    if:
      type: text
      substr: Safari/LocalStorage
    unless:
      - id: well-known/app/utility/macos-cleaners::macos-cleaner-app
