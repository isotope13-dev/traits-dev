defaults:
  platforms: [windows]
  for: [javascript]
  crit: notable
  conf: 0.94
traits:
  - id: chrome-profile-executable-fragments-array
    desc: Array text contains Chrome and exe fragments
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((array) @array
          (#match? @array "['\"]Chrome['\"]")
          (#match? @array "['\"]User( |\\\\x20)Data['\"]")
          (#match? @array "['\"]chrome\\.e['\"]"))
