defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: opera-path-segment
    desc: References an Opera browser path segment
    crit: notable
    conf: 0.4
    if:
      type: text
      # Source comments that name browsers ("Firefox/Opera/IE") are not paths.
      exclude_comments: true
      regex: '[./\\]Opera[/\\]'
