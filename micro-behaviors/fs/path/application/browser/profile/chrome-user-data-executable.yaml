defaults:
  platforms: [windows]
  for: [javascript]
  crit: notable
  conf: 0.96
traits:
  - id: chrome-user-data-executable-path
    desc: Constructs Chrome exe path under user data
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((lexical_declaration
          (variable_declarator name: (identifier) @file value: (_) @filename)
          (variable_declarator name: (identifier) @dir
            value: (call_expression function: (_) @join1
              arguments: (arguments . (call_expression function: (_) @home)
                . (string (string_fragment) @appdata)
                . (string (string_fragment) @local)
                . (string (string_fragment) @google)
                . (string (string_fragment) @chrome)
                . (string (string_fragment) @userdata) .)))
          (variable_declarator name: (identifier) @destination
            value: (call_expression function: (_) @join2
              arguments: (arguments . (identifier) @diruse . (identifier) @fileuse .))))
          (#match? @filename "(?i)^(['\"]chrome\\.exe['\"]|['\"]chrome\\.e['\"]\\s*\\+\\s*['\"]xe['\"])$")
          (#match? @join1 "^path(\\.join|\\[['\"]join['\"]\\])$")
          (#match? @join2 "^path(\\.join|\\[['\"]join['\"]\\])$")
          (#match? @home "^os(\\.homedir|\\[['\"]homedir['\"]\\])$")
          (#eq? @appdata "AppData")
          (#eq? @local "Local")
          (#eq? @google "Google")
          (#eq? @chrome "Chrome")
          (#eq? @userdata "User Data")
          (#eq? @dir @diruse)
          (#eq? @file @fileuse))

  - id: chrome-user-data-download-stream
    desc: HTTP stream targets Chrome profile executable
    crit: suspicious
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((arrow_function body: (statement_block
          (lexical_declaration
            (variable_declarator name: (identifier) @file value: (_) @filename)
            (variable_declarator name: (identifier) @dir
              value: (call_expression function: (_) @join1
                arguments: (arguments . (call_expression function: (_) @home)
                  . (string (string_fragment) @appdata)
                  . (string (string_fragment) @local)
                  . (string (string_fragment) @google)
                  . (string (string_fragment) @chrome)
                  . (string (string_fragment) @userdata) .)))
            (variable_declarator name: (identifier) @destination
              value: (call_expression function: (_) @join2
                arguments: (arguments . (identifier) @diruse . (identifier) @fileuse .))))
          (lexical_declaration (variable_declarator name: (identifier) @client
            value: (ternary_expression consequence: (identifier) @https alternative: (identifier) @http)))
          (expression_statement (call_expression
            function: (subscript_expression object: (call_expression
              function: (subscript_expression object: (identifier) @clientuse
                index: (string (string_fragment) @get))
              arguments: (arguments (_) (arrow_function parameter: (identifier) @response
                body: (statement_block
                  (lexical_declaration (variable_declarator name: (identifier) @stream
                    value: (call_expression function: (_) @writer
                      arguments: (arguments . (identifier) @written .))))
                  (expression_statement (sequence_expression
                    (call_expression function: (subscript_expression object: (identifier) @responseuse
                      index: (string (string_fragment) @pipe))
                      arguments: (arguments . (identifier) @streamuse .)))))))))))))
          (#match? @filename "(?i)^(['\"]chrome\\.exe['\"]|['\"]chrome\\.e['\"]\\s*\\+\\s*['\"]xe['\"])$")
          (#match? @join1 "^path(\\.join|\\[['\"]join['\"]\\])$")
          (#match? @join2 "^path(\\.join|\\[['\"]join['\"]\\])$")
          (#match? @home "^os(\\.homedir|\\[['\"]homedir['\"]\\])$")
          (#match? @writer "^fs(\\.createWriteStream|\\[['\"]createWriteStream['\"]\\])$")
          (#eq? @appdata "AppData")
          (#eq? @local "Local")
          (#eq? @google "Google")
          (#eq? @chrome "Chrome")
          (#eq? @userdata "User Data")
          (#eq? @dir @diruse)
          (#eq? @file @fileuse)
          (#eq? @destination @written)
          (#eq? @https "https")
          (#eq? @http "http")
          (#eq? @client @clientuse)
          (#eq? @get "get")
          (#eq? @response @responseuse)
          (#eq? @pipe "pipe")
          (#eq? @stream @streamuse))
