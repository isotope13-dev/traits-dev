defaults:
  mbc: E1083
  platforms:
    - unix
    - windows
  for:
    - scripts
    - binaries
traits:
  - id: tencent-qqbrowser-path
    desc: Tencent QQBrowser directory path
    crit: notable
    conf: 0.8
    attack: T1083
    if:
      type: text
      regex: "(?i)Tencent\\\\\\\\QQBrowser"
  - id: chrome-google-profile-path
    desc: Google Chrome profile path reference
    crit: notable
    conf: 0.8
    for:
      - scripts
      - binaries
      - source
    if:
      type: text
      regex: "(?i)Google[/\\\\]{1,2}Chrome[/\\\\]{1,2}(User Data|Default|Profile [0-9]+)[/\\\\]{0,2}"
  - id: chrome-unix-profile
    desc: Chrome Unix profile path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: "(?i)google-chrome[/\\\\](Default|Profile [0-9]+)[/\\\\]?"
  - id: chrome-windows-userdata-path
    desc: Chrome Windows User Data path
    crit: notable
    conf: 0.85
    platforms:
      - windows
    for:
      - scripts
      - source
      - "-ruby"
      - "-php"
      - "-perl"
      - "-lua"
      - "-vbs"
      - "-groovy"
      - "-kotlin"
      - "-scala"
      - "-zig"
      - "-elixir"
    if:
      type: literal
      substr: Local/Google/Chrome/User Data
  - id: chrome-appdata-path
    desc: Chrome AppData path
    crit: notable
    conf: 0.85
    platforms:
      - windows
    for:
      - scripts
      - source
      - "-ruby"
      - "-php"
      - "-perl"
      - "-lua"
      - "-vbs"
      - "-groovy"
      - "-kotlin"
      - "-scala"
      - "-zig"
      - "-elixir"
    if:
      type: literal
      substr: AppData/Local/Google/Chrome
    not:
      - substr: AppData/Local/Google/Chrome/Application
      - regex: "(?i)Google[/\\\\]Chrome[/\\\\]Application"
  - id: chrome-linux-config-directory
    desc: Chrome Linux config directory path
    crit: notable
    conf: 0.85
    platforms:
      - unix
    for:
      - scripts
      - source
      - "-batch"
      - "-powershell"
      - "-vbs"
      - "-applescript"
      - "-groovy"
      - "-kotlin"
      - "-scala"
      - "-zig"
      - "-elixir"
    if:
      type: literal
      substr: ".config/google-chrome"
  - id: edge-windows-profile
    desc: Edge Windows profile path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: "(?i)Microsoft[/\\\\]Edge[/\\\\](User Data|Default|Profile [0-9]+)[/\\\\]?"
  - id: edge-unix-profile
    desc: Edge Unix profile path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: "(?i)microsoft-edge[/\\\\](Default|Profile [0-9]+)[/\\\\]?"
  - id: brave-profile-directory
    desc: Brave browser profile directory path
    crit: notable
    conf: 0.84
    for:
      - scripts
      - source
      - binaries
    if:
      type: text
      regex: "(?i)Brave-Browser[/\\\\]{1,2}(User Data|Default|Profile [0-9]+)"
  - id: opera-windows-profile-directory
    desc: Opera Windows profile directory path
    crit: notable
    conf: 0.84
    for:
      - scripts
      - source
      - binaries
    if:
      type: text
      regex: "(?i)Opera Software[/\\\\]{1,2}Opera Stable[/\\\\]?"
  - id: opera-macos-profile-directory
    desc: Opera macOS profile directory path
    crit: notable
    conf: 0.84
    for:
      - scripts
      - source
      - binaries
    if:
      type: text
      regex: "(?i)Application Support[/\\\\]{1,2}com\\.operasoftware\\.Opera[/\\\\]?"
  - id: vivaldi-profile-directory
    desc: Vivaldi browser profile directory path
    crit: notable
    conf: 0.84
    for:
      - scripts
      - source
      - binaries
    if:
      type: text
      regex: "(?i)Vivaldi[/\\\\]{1,2}(User Data|Default|Profile [0-9]+)"
  - id: firefox-profile-directory
    desc: Firefox browser profile directory path
    crit: notable
    conf: 0.86
    for:
      - scripts
      - source
      - binaries
      - html
    if:
      type: text
      regex: "(?i)(Mozilla[/\\\\]{1,2})?Firefox[/\\\\]{1,2}Profiles|/\\\\.mozilla/firefox"
  - id: palemoon-profile-directory
    desc: Pale Moon browser profile directory path
    crit: notable
    conf: 0.8
    for:
      - scripts
      - source
      - binaries
    if:
      type: text
      regex: "(?i)Pale Moon[/\\\\]Profiles|Moonchild Productions[/\\\\]Pale Moon"
  - id: waterfox-profile-directory
    desc: Waterfox browser profile directory path
    crit: notable
    conf: 0.8
    for:
      - scripts
      - source
      - binaries
    if:
      type: text
      regex: "(?i)Waterfox[/\\\\]Profiles|[/\\\\]\\.waterfox[/\\\\]?"
  - id: firefox-profiles-ini-path
    desc: Firefox profiles.ini path
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: "(?i)Mozilla\\\\\\\\Firefox\\\\\\\\profiles\\.ini"
composite_rules:
  - id: browser-data-path
    desc: Browser profile or data directory path
    crit: notable
    conf: 0.85
    for:
      - scripts
      - source
      - binaries
    platforms:
      - unix
      - windows
      - macos
    any:
      - id: micro-behaviors/fs/path/application/browser/profile::chrome-windows-userdata-path
      - id: micro-behaviors/fs/path/application/browser/profile::chrome-appdata-path
      - id: micro-behaviors/fs/path/application/browser/profile::chrome-linux-config-directory
      - id: micro-behaviors/fs/path/application/browser/profile::firefox-profile-directory
  - id: chrome-user-data
    desc: Chrome profile or user-data path
    crit: notable
    conf: 0.8
    for:
      - scripts
      - binaries
      - source
    any:
      - id: micro-behaviors/fs/path/application/browser/profile::chrome-google-profile-path
      - id: micro-behaviors/fs/path/application/browser/profile::chrome-unix-profile
  - id: edge-user-data
    desc: Edge profile or user-data path
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/fs/path/application/browser/profile::edge-windows-profile
      - id: micro-behaviors/fs/path/application/browser/profile::edge-unix-profile
  - id: chromium-profile-directory-path
    desc: Installed Chromium browser profile path
    crit: notable
    conf: 0.88
    for:
      - scripts
      - source
      - binaries
    any:
      - id: micro-behaviors/fs/path/application/browser/profile::chrome-google-profile-path
      - id: micro-behaviors/fs/path/application/browser/profile::chrome-unix-profile
      - id: micro-behaviors/fs/path/application/browser/profile::chrome-windows-userdata-path
      - id: micro-behaviors/fs/path/application/browser/profile::chrome-appdata-path
      - id: micro-behaviors/fs/path/application/browser/profile::chrome-linux-config-directory
      - id: micro-behaviors/fs/path/application/browser/profile::edge-windows-profile
      - id: micro-behaviors/fs/path/application/browser/profile::edge-unix-profile
      - id: micro-behaviors/fs/path/application/browser/profile::brave-profile-directory
      - id: micro-behaviors/fs/path/application/browser/profile::opera-windows-profile-directory
      - id: micro-behaviors/fs/path/application/browser/profile::opera-macos-profile-directory
      - id: micro-behaviors/fs/path/application/browser/profile::vivaldi-profile-directory
      - id: micro-behaviors/fs/path/application/browser/profile::chrome-macos-support-path
      - id: micro-behaviors/fs/path/application/browser/profile::arc-profile-path
