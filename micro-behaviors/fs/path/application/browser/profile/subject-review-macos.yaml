defaults:
  for:
    - macho
    - objc
    - swift
    - applescript
    - shell
  platforms:
    - macos
traits:
  - id: firefox-profile-prefs-path
    desc: Firefox profile prefs.js path
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: "(?i)Firefox[/\\\\]Profiles[/\\\\][^/\\\\\\n]{1,80}[/\\\\]prefs\\.js\\b"
  - id: mozilla-profile-prefs-path
    desc: Mozilla profile prefs.js path
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: "(?i)\\.mozilla[/\\\\][^/\\\\\\n]{1,80}[/\\\\]prefs\\.js\\b"
  - id: chrome-directory
    desc: Google/Chrome directory path
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: Google/Chrome
  - id: chrome-profile-path
    desc: Chrome browser profile path reference
    crit: notable
    conf: 0.8
    for:
      - applescript
      - shell
    if:
      type: text
      substr: Google/Chrome/
  - id: chrome-macos-support-path
    desc: Chrome macOS Application Support path
    crit: notable
    conf: 0.85
    for:
      - scripts
      - source
    if:
      type: literal
      substr: Application Support/Google/Chrome
  - id: chrome-macos-support-path-class
    desc: JVM Chrome macOS support path
    crit: notable
    conf: 0.9
    for:
      - class
      - java_class
    if:
      type: value
      path: class.strings[*]
      substr: Application Support/Google/Chrome
  - id: arc-profile-path
    desc: Arc browser profile path
    crit: notable
    conf: 0.8
    for:
      - python
      - applescript
    if:
      type: text
      substr: Arc/User Data
