defaults:
  platforms: [windows, unix]
  for: [scripts, source, data, pe, dll, elf]
  crit: notable
  conf: 0.92
traits:
  - id: iwa-profile-directory
    desc: Isolated Web App profile directory
    conf: 0.95
    if:
      type: text
      regex: '(?i)User Data[/\\][^"\r\n]{0,60}[/\\]iwa[/\\]'

  - id: iwa-key-distribution-component
    desc: Isolated Web App key distribution path
    conf: 0.95
    if:
      type: text
      substr: IwaKeyDistribution
composite_rules:
  - id: chromium-iwa-profile-key-distribution-references
    desc: Chromium references IWA key distribution and profile paths
    crit: notable
    conf: 0.95
    for: [data, source, batch, javascript, lua, pe, perl, php, powershell, python, ruby, vbs]
    all:
      - id: iwa-key-distribution-component
    any:
      - id: iwa-profile-directory
      - id: micro-behaviors/fs/path/application/browser/installation::signed-web-bundle-file
