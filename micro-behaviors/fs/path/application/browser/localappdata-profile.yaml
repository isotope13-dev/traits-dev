traits:
  - id: browser-localappdata-userdata-root
    for: [html, javascript, powershell, batch]
    platforms: [windows]
    desc: LocalAppData browser profile root
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)(%LocalAppData%|AppData[\\/]Local)[\\/].{1,48}[\\/]User Data'

  # `Cache_Data` (Chromium) and `cache2` (Firefox) are on-disk cache directory
  # names. `cache2` must be preceded by a path separator: as a bare word it is
  # an ordinary minifier-generated identifier (cytoscape ships `function
  # cache2(fn, name)` inside mermaid.js).
