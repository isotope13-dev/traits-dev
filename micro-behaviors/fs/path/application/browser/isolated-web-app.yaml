# On-disk footprint of Chromium Isolated Web Apps.  An IWA ships as a signed
# web bundle (`.swbn`) staged inside the browser profile, and Chromium decides
# which signing keys to trust from the IwaKeyDistribution component.  Supported
# deployment goes through enterprise policy, so code that names these paths
# itself is installing a bundle behind the browser's back.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, data, pe, dll, elf]
  crit: notable
  conf: 0.92
traits:
  - id: signed-web-bundle-file
    desc: Signed web bundle (.swbn) file reference
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.swbn\b'

  - id: iwa-profile-directory
    desc: Isolated Web App profile directory
    conf: 0.95
    if:
      type: text
      regex: '(?i)User Data[/\\][^"\r\n]{0,60}[/\\]iwa[/\\]'

  - id: iwa-key-distribution-component
    desc: Isolated Web App key distribution path
    conf: 0.95
    if:
      type: text
      substr: IwaKeyDistribution
