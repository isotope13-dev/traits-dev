defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - csharp
  crit: notable
  conf: 0.9

traits:
  - id: chromium-local-extension-settings-path
    desc: Chromium Local Extension Settings path
    crit: notable
    conf: 0.78
    for: [python, javascript, typescript, scripts, binaries, rust, source]
    if:
      type: text
      substr: Local Extension Settings
  # These native strings can sit in long constant-pool buffers not emitted by
  # text extraction. Require the real profile directory on either separator.
  - id: compiled-chromium-local-extension-settings-path
    desc: Compiled Chromium extension storage path
    for: [elf, macho, pe]
    if:
      type: raw
      regex: 'Default[/\\]Local Extension Settings'

  - id: chromium-sync-extension-settings-path
    desc: Chromium Sync Extension Settings directory
    if:
      type: text
      substr: /Sync Extension Settings/
