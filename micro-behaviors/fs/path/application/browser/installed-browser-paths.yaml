defaults:
  platforms: [windows, unix]
  for: [pe, elf, python, javascript, powershell]
  crit: baseline
traits:
  - id: installed-firefox-windows-path
    desc: Installed Firefox Windows executable path
    for: [binaries, scripts, source, -class, -pyc, -beam, -wasm, -staticlib]
    if:
      type: literal
      regex: '(?i)Mozilla Firefox\\firefox\.exe'

  - id: installed-chrome-macos-path
    desc: Installed Chrome macOS executable path
    for: [binaries, scripts, source, -class, -pyc, -beam, -wasm, -staticlib]
    if:
      type: literal
      exact: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome

  - id: installed-edge-macos-path
    desc: Installed Edge macOS executable path
    for: [binaries, scripts, source, -class, -pyc, -beam, -wasm, -staticlib]
    if:
      type: literal
      exact: /Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge

