# Chromium resource-pack files sit beside the browser executable and contain
# compiled resources consumed by the browser. A reference is neutral on its
# own; objectives combine it with protected-profile mutation and cryptography.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries, data]
  crit: notable
  conf: 0.92

traits:
  - id: chromium-resources-pak-file
    desc: Chromium resources.pak file reference
    if:
      type: text
      regex: '(?i)\bresources\.pak\b'
