# An embedded browser path is a resource reference, not file metadata.
# Preserve the original scope, spelling and filtering independently of the
# more specific credential-store path rules in this directory.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: opera-path-segment
    desc: References an Opera browser path segment
    crit: notable
    conf: 0.4
    if:
      type: text
      regex: 'Opera[/\\]'
    not:
      - substr: \BraveSoftware\
