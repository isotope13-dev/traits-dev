defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
  mbc: OB0003
  attack: T1555.003

traits:
  - id: profiles-ini
    desc: References Firefox profiles.ini locator
    crit: component
    if:
      type: text
      regex: (?i)[/\\]profiles\.ini\b
    not:
      - substr: complete -c
