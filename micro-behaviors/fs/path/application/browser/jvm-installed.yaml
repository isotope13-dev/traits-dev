traits:
- for:
  - class
  - java_class
  crit: notable
  conf: 0.95
  id: jvm-installed-chrome-windows-path
  desc: JVM class names Chrome install path
  if:
    type: text
    substr: Google\Chrome\Application\chrome.exe
- for:
  - class
  - java_class
  crit: notable
  conf: 0.95
  id: jvm-installed-firefox-windows-path
  desc: JVM class names Firefox install path
  if:
    type: text
    substr: Mozilla Firefox\firefox.exe
composite_rules:
- for:
  - class
  - java_class
  - jar
  - zip
  crit: notable
  conf: 0.95
  id: jvm-chrome-and-firefox-paths
  desc: JVM names Chrome and Firefox install paths
  all:
  - id: micro-behaviors/fs/path/application/browser::jvm-installed-chrome-windows-path
  - id: micro-behaviors/fs/path/application/browser::jvm-installed-firefox-windows-path
defaults:
  platforms:
  - windows
