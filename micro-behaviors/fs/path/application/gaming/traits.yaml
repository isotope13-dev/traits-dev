defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, csharp]
  crit: notable
  conf: 0.9

traits:
  - id: steam-loginusers-file
    desc: Steam loginusers.vdf path reference
    if:
      type: text
      substr: loginusers.vdf

  - id: steam-config-file
    desc: Steam config.vdf path reference
    if:
      type: text
      # `localconfig.vdf` stores per-user game/family settings and is a
      # separate, common launcher surface; this atom is for config.vdf only.
      regex: '(^|[^A-Za-z0-9_])config\.vdf([^A-Za-z0-9_]|$)'
