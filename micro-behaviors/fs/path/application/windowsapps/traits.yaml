# Per-user WindowsApps directory (%LocalAppData%\Microsoft\WindowsApps). It is
# on the default user PATH and holds app-execution aliases, which makes it a
# convenient drop location for a follow-on executable that is then launched by
# bare name. The path reference is a neutral filesystem location; dropper
# composites supply the write + execute intent.
defaults:
  platforms: [windows]
  for: [csharp, dll, pe, powershell, scripts, binaries]
  crit: notable
  conf: 0.9
  attack: T1105

traits:
  - id: windowsapps-user-path
    desc: Per-user WindowsApps execution-alias directory
    if:
      type: text
      regex: '(?i)(Local[\\/])?Microsoft[\\/]WindowsApps\b'
