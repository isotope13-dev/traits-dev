defaults:
  for: [python]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: encoded-telegram-desktop-reference
    desc: Encoded source references Telegram Desktop
    if:
      type: encoded
      encoding: base64
      regex: '(?i)telegram desktop'
  - id: encoded-tdata-directory-reference
    desc: Encoded source references tdata directory
    if:
      type: encoded
      encoding: base64
      regex: '["'']tdata["'']'
composite_rules:
  - id: encoded-telegram-desktop-tdata-reference
    desc: Encoded source references Telegram Desktop and tdata
    all:
      - id: encoded-telegram-desktop-reference
      - id: encoded-tdata-directory-reference
