# Telegram tdata is an authentication store, not a selected token.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, csharp, package.json, rust, source]
  crit: notable
  conf: 0.85

traits:
  # Telegram Desktop's tdata store has a distinctive key_datas directory
  # and 16-hex-character session files (including the suffixed variants).
  # Treat this selector as a capability indicator; theft is established only
  # when a consumer also sees collection, packaging and upload behavior.
  - id: node-telegram-tdata-key-store-tokens
    desc: References tdata and key_datas directories
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: 'key_datas[\s\S]{0,300}tdata'

  - id: node-telegram-hex-session-file-filter
    desc: References Telegram hex session filename filter
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      substr: '[A-F0-9]{16}s'

  - id: telegram-desktop-data-path
    desc: Telegram Desktop session-data path
    conf: 0.9
    if:
      type: text
      regex: '(?i)Telegram Desktop[/\\]+(tdata|[A-Za-z0-9_.-]+[/\\]+tdata)'

composite_rules:
  - id: node-telegram-session-file-selector
    desc: Selects Telegram tdata session files
    crit: notable
    conf: 0.96
    all:
      - id: node-telegram-tdata-key-store-tokens
      - id: node-telegram-hex-session-file-filter

  - id: telegram-session-data-location
    desc: References a Telegram session-data location
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/token::compiled-telegram-support-tdata-path
      - id: telegram-desktop-data-path
      - id: micro-behaviors/fs/path/token::telegram-data-path
      - id: micro-behaviors/fs/path/token::telegram-tdata-path-parts
      - id: micro-behaviors/fs/path/token::telegram-desktop-tdata-compact-path
