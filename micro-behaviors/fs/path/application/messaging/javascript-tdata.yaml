defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: javascript-tdata-directory-reference
    desc: References Telegram tdata directory paths
    crit: notable
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?i)(^|[/\\])tdata([/\\]|$)'
