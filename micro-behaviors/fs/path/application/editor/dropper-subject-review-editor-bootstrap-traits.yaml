defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: editor-dir-var
    desc: Variable holds a home editor config dir
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?im)^\s*(export\s+)?\w+=["'']?\$\{?HOME\}?/[.]?(vscode|cursor|windsurf)["'']?\s*$'
  # Final stage: a JavaScript payload lands in the editor dir and a Node
  # binary (often a portable one the stager just unpacked) runs it.
