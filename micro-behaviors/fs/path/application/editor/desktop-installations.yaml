defaults:
  platforms: [unix, windows]
  for: [source, scripts]
  crit: notable
  conf: 0.96
traits:
  - id: cursor-desktop-install-path
    desc: Cursor desktop installation path
    if:
      type: string_literal
      regex: '(?i)(/Applications/Cursor\.app|\\Programs\\cursor\\)'
  - id: windsurf-desktop-install-path
    desc: Windsurf desktop installation path
    if:
      type: string_literal
      regex: '(?i)(/Applications/Windsurf\.app|\\Programs\\windsurf\\)'
  - id: vscodium-desktop-install-path
    desc: VSCodium desktop installation path
    if:
      type: string_literal
      regex: '(?i)(/Applications/VSCodium\.app|\\Programs\\VSCodium\\)'
  - id: positron-desktop-install-path
    desc: Positron desktop installation path
    if:
      type: string_literal
      regex: '(?i)(/Applications/Positron\.app|\\Programs\\Positron\\)'
composite_rules:
  - id: several-desktop-editor-install-paths
    desc: Paths identify several desktop editors
    any:
      - id: cursor-desktop-install-path
      - id: windsurf-desktop-install-path
      - id: vscodium-desktop-install-path
      - id: positron-desktop-install-path
    needs: 3
