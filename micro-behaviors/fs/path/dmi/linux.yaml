defaults:
  platforms: [linux]
  for: [elf, so, c, cpp, shell, python]
  crit: notable
  conf: 0.96

traits:
  - id: linux-smbios-raw-table-path
    desc: References Linux raw SMBIOS table path
    if:
      type: text
      substr: /sys/firmware/dmi/tables/DMI

  - id: linux-smbios-entry-point-path
    desc: References Linux SMBIOS entry-point path
    if:
      type: text
      substr: /sys/firmware/dmi/tables/smbios_entry_point
