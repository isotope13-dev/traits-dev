# Foxmail stores each mail account's settings, including the encoded account
# password, in an Accounts\Account.rec0 file under its data directory.
defaults:
  platforms: [windows]
  for: [binaries, scripts, csharp]
  crit: notable
  conf: 0.85

traits:
  - id: foxmail-account-store-path
    desc: Foxmail Account.rec0 account store path
    if:
      type: text
      substr: '\Accounts\Account.rec0'
