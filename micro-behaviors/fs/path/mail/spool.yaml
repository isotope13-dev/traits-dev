# Reference to the Unix user mail spool. Relocated from
# objectives/evasion/indicator-removal/logs/ (2026-07): /var/spool/mail is user
# mail, not a log file, so a bare reference to it asserted log-tampering on
# every tool that touches the mail spool -- MTA/MDA wrappers, container image
# setup, and Debian's own base-files.postinst, which creates the
# /var/spool/mail -> ../mail symlink. The log-wipe composites in that objective
# still reference this atom; the wipe intent comes from their rm/truncate legs.
defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: user-mail-spool-path
    desc: /var/spool/mail user mail spool path
    crit: component
    conf: 0.7
    if:
      type: text
      substr: /var/spool/mail
    unless:
      - id: metadata/package/testing/presence/harness::test-fixture-directory
      - type: path
        regex: '(^|[\\/])testdata[\\/]'
      - type: path
        regex: '(^|[\\/])lib[\\/]apk[\\/]db[\\/]scripts\.tar$'
      - id: well-known/tool/sysadmin/alpine-packages::alpine-apk-scripts-db
