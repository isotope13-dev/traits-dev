# Thunderbird profile directory location. Constructs or references the
# user profile path on Windows, macOS, or Linux. Used by mail readers,
# backup utilities, and stealer composites.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, csharp]
  crit: notable
  conf: 0.85

traits:
  - id: thunderbird-profiles-path
    desc: Thunderbird Profiles directory path
    if:
      type: text
      regex: Thunderbird[/\\]Profiles
    unless:
      - id: well-known/app/utility/siw::siw-family-identity
      - id: well-known/app/communication/thunderbird/
      - id: metadata/signed/platform::mozilla
      - id: metadata/signed/leaf::mozilla-corporation
