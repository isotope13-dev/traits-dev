defaults:
  for: [scripts, source]
  platforms: [unix, windows]
traits:
  - id: ssh-authorized-keys-path-literal
    desc: Literal SSH authorized-key trust file path
    crit: notable
    conf: 0.99
    if:
      type: string_literal
      regex: '[/\\](\.ssh[/\\]authorized_keys2?|ssh[/\\]administrators_authorized_keys)$'
