defaults:
  platforms: [linux, macos, windows]
  for: [binaries, scripts, source]
traits:
- id: known-hosts-path-reference
  desc: SSH .ssh/known_hosts path reference
  crit: notable
  conf: 0.5
  attack: T1552.004
  if:
    type: text
    regex: '(?i)\.ssh[/\\]known_hosts\b'
  downgrade:
    any:
    - id: micro-behaviors/data/format/editor-syntax::syntax-bundle-context
    - id: micro-behaviors/communications/ssh/connect::openssh
    - type: basename
      regex: ^ssh(-.{1,32})?(\.exe)?$
