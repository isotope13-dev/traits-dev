# known_hosts: the record of hosts this account has reached. Not a secret --
# reading it enumerates lateral-movement targets.
defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript]

traits:
  - id: known-hosts-path-reference
    desc: References an SSH known_hosts path
    crit: notable
    conf: 0.92
    for: [binaries]
    platforms: [unix]
    attack: T1552.004
    if:
      type: text
      substr: .ssh/known_hosts
