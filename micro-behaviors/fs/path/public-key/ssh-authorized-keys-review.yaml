defaults:
  crit: suspicious
  for: [scripts, binaries]
  platforms:
  - unix
  size_max: 104857600
composite_rules:
# `js-ssh-config-path-reference` matches the substring authorized_keys, so it
# added nothing once ssh-authorized-keys was required: one
# path.join(os.homedir(), '.ssh', 'authorized_keys') satisfied every leg.
# Security scanners that read that file are not cross-platform home coverage.
# The extra leg has to be a different root: a /home or /Users path, or the
# Windows drive-letter walk.
- id: js-cross-platform-ssh-homes
  for: [javascript]
  desc: JavaScript references SSH paths across home roots
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/fs/path/public-key::ssh-authorized-keys
  - id: micro-behaviors/fs/path/secret-config::js-ssh-homedir-path
  any:
  - id: micro-behaviors/fs/path/secret-config::js-ssh-platform-home-path
  - id: micro-behaviors/fs/enumerate/drives::js-windows-drive-enumeration
  near_bytes: 1200
