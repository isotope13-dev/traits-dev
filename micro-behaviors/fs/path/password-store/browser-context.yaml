composite_rules:
- platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - binaries
  - source
  id: chromium-login-data-browser-path-profile
  desc: Login Data with Chromium-specific references
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/fs/path/password-store::login-data-string
  any:
  - id: micro-behaviors/fs/path/application/browser::chrome-path
  - id: micro-behaviors/fs/path/application/browser::brave-path
  - id: micro-behaviors/fs/path/application/browser::edge-path
  - id: micro-behaviors/fs/path/application/browser::opera-macos-path
  - id: micro-behaviors/fs/path/application/browser::opera-windows-path
  - id: micro-behaviors/fs/path/application/browser::operagx-path
  - id: micro-behaviors/fs/path/application/browser::vivaldi-path
  - id: micro-behaviors/fs/path/application/browser::yandex-path
  - id: micro-behaviors/fs/path/application/browser::arc-profile-path
  - id: micro-behaviors/fs/path/application/browser::coccoc-path
  - id: micro-behaviors/data/config/schema::encrypted-key-field-reference
  - id: micro-behaviors/communications/http/cookie-store::chromium-os-crypt-reference
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: well-known/tool/reverse-engineering/forenselab::browser-forensics-module
  - id: well-known/tool/development/docs/pandoc::package-path
  - id: metadata/file/profile/test-indications::harness-metadata-or-directory-name
  - id: well-known/tool/media/youtube-dl/
  - id: well-known/app/communication/thunderbird::firefox-omni-runtime-path
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/app/productivity/keepercommander::official-package-source
  - id: well-known/app/security/bitwarden::macos-signed-native-module-context
