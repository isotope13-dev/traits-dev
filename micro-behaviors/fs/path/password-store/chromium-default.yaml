# A Login Data pathname is a sensitive-store reference, not a read or theft.
defaults:
  platforms: [openbsd, bsd, unix, windows]
  for: [cpp, elf, csharp, pe]
traits:
  - id: native-chromium-login-data
    desc: "Default profile Login Data path"
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: /Default/Login Data
    unless:
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/package/testing/presence/harness::c-source-test-file
