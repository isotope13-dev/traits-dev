---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - python
  id: browser-cookie-database-reference
  desc: Browser cookie or login database reference
  conf: 0.9
  if:
    type: text
    regex: "(?i)cookies\\.sqlite|login data"
- for:
  - markdown
  - python
  - shell
  - powershell
  - ruby
  - perl
  - php
  id: agent-browser-database-reference
  desc: Agent wording near browser database path
  conf: 0.96
  unless:
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
  - id: well-known/tool/detection/skill-scanner::drskill-injection-file-context
  if:
    type: text
    regex: "(?is)\\b(skill|agent)\\b.{0,240}[/\\\\](Default|Profile [0-9]+)[/\\\\](Login
      Data|Cookies)"
  not:
  - substr: aui-agent-builder
- for:
  - python
  id: browser-credential-terms
  desc: Names browser passwords, cookies or history
  conf: 0.9
  if:
    type: text
    regex: "(?i)\\bbrowsers?[_ -]?(cookies?|passwords?|history)\\b"
