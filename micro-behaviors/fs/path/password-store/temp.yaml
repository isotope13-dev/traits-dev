# Stores that hold credentials at rest for an application or the OS.

defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

traits:
  - id: hidden-temp-password-path
    desc: Hidden temp password path
    crit: notable
    conf: 0.88
    for: [binaries, scripts, c, cpp, objc, rust, zig]
    if:
      type: text
      substr: /tmp/.password
