# A bare database filename proves neither an open nor a read. This retains
# the Python/bytecode scope of the former fs/file/open observation; the
# macOS AppleScript/native pathname observation requires a slash separately.
defaults:
  platforms: [windows, unix]
  for: [python, pyc]
traits:
  - id: python-key4-db-reference
    desc: References the Gecko key4.db filename
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: key4.db
