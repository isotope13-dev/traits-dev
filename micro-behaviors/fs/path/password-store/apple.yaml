# Stores that hold credentials at rest for an application or the OS.

defaults:
  platforms:
    - macos
    - ios
  crit: notable
  conf: 0.8
  for:
    - scripts
    - source
    - binaries

traits:
  - id: keychain-data
    desc: Reference to Apple Keychain data
    if:
      type: text
      regex: (?i)(Library/)?Keychains
  - id: macos-login-keychain
    desc: Reference to login keychain
    if:
      type: text
      substr: Library/Keychains/login.keychain
  - id: macos-login-keychain-db
    desc: Reference to login keychain database
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: login.keychain-db
