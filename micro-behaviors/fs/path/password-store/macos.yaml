# Browser credential databases -- Chromium `Login Data`, Firefox `logins.json`,
# the OS keyring entries that unwrap them, and stored payment cards.

defaults:
  crit: notable
  conf: 0.8
  platforms: [windows, unix]
  for: [scripts, binaries, csharp]

traits:
  - id: chromium-safe-storage-service-name
    desc: Chromium Safe Storage keychain service name
    for: [scripts, source, macho]
    platforms: [macos]
    if:
      type: string_literal
      regex: '\b[A-Z][A-Za-z]{1,14}( [A-Z][A-Za-z]{1,14})? Safe Storage\b'
    unless:
      - id: well-known/lib/platform/browser-automation/drivers/selenium::google-flow-browser-auth-client
      - id: well-known/app/ai/gateway/kimi-chat-opencode::kimi-chat-opencode-context
      - id: metadata/package/testing/presence/harness::test-directory
      - id: well-known/app/ai/tool-server/linkedin-mcp-server::browser-import-source-context
      - id: well-known/app/ai/tool-server/linkedin-mcp-server::browser-import-archive-context
      - id: well-known/app/ai/usage/ai-box::ai-box-extension-context
  # A deny list of browser-profile files a tool must never copy. Stealers name
  # `Login Data` as a target; a variable called NEVER_COPY, SKIP or EXCLUDE
  # lists it as a boundary.
  - id: profile-file-exclusion-list
    desc: Browser profile files in an exclusion list
    for: [javascript, typescript, python, go, rust]
    if:
      type: text
      regex: '(?i)\b\w*(never|skip|exclude|ignore|deny|block)\w*\s*=\s*[/\[][^;\n]{0,200}Login Data'
  - id: login-data
    desc: Chromium Login Data filename reference
    attack: T1555.003
    for: [scripts, binaries, csharp, go, rust]
    if:
      type: text
      substr: Login Data
    unless:
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
