composite_rules:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - pe
  - elf
  - macho
  id: chrome-browser-data-reference
  desc: Chrome name accompanies browser-store filenames
  crit: notable
  conf: 0.85
  all:
  - id: metadata/file/string/application-name::chrome-browser-name-literal
  any:
  - id: micro-behaviors/fs/path/personal::history-file
  - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
  - id: micro-behaviors/fs/path/password-store::login-data
  downgrade:
    any:
    - id: metadata/file/naming::chromium-basename-word
