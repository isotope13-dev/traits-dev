defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, csharp]
  crit: notable
  conf: 0.85

traits:
  - id: filezilla-sitemanager-path
    desc: FileZilla site-manager XML path reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)[/\\]sitemanager\.xml\b
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
