defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
traits:
  - id: applescript-keychain-source-list
    desc: AppleScript loop names login Keychain source
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'repeat with \w+ in \{[^\r\n]{0,800}Keychains/login\.keychain-db'
