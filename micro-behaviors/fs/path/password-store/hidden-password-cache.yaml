traits:
- platforms:
  - macos
  for:
  - applescript
  - shell
  id: hidden-pwd-path-reference
  desc: References a hidden .pwd pathname
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: /\.pwd\b\S{0,8}
  not:
  - regex: \.pwd\.lock\b
  unless:
  - id: metadata/file/format/news::serialized-news-article-catalog
  - id: metadata/package/files/system-package::debian-account-tool-basename
  - type: text
    regex: \.alpine-smime
