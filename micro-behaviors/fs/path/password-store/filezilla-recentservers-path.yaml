defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, csharp]
  crit: notable
  conf: 0.85

traits:
  - id: filezilla-recentservers-path
    desc: FileZilla recent-server XML path reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)[/\\]recentservers\.xml\b
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
