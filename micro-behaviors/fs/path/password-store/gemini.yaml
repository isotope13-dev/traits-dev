# The workspace token and its master key are dedicated Gemini auth stores.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.94

traits:
  - id: gemini-workspace-auth-artifact-path
    desc: Gemini workspace token or master-key filename
    if:
      type: text
      regex: '(?i)\bgemini-cli-workspace-token\.json\b|\.gemini-cli-workspace-master-key\b'
