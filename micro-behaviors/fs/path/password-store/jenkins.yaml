# Jenkins creates this password under JENKINS_HOME/secrets. Its location is
# configurable; do not require /var/lib/jenkins or a particular drive letter.
# A path reference alone does not establish credential acquisition.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.98

traits:
  - id: jenkins-bootstrap-password-path
    desc: Jenkins bootstrap password path reference
    if:
      type: text
      case_insensitive: true
      regex: '(^|[/\\"''])secrets([/\\]{1,2}|["'']\s*,\s*["''])initialAdminPassword($|["''\s\x00])'
