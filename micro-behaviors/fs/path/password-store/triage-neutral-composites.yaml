---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
composite_rules:
- for:
  - python
  conf: 0.9
  id: browser-credential-store-reference
  desc: Browser credential-store reference
  any:
  - id: micro-behaviors/fs/path/password-store::browser-cookie-database-reference
  - id: micro-behaviors/fs/path/password-store::browser-credential-terms
- for:
  - scripts
  - binaries
  id: browser-process-or-credential-store-reference
  desc: Browser process or credential-store reference
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  any:
  - id: micro-behaviors/fs/path/application/executable::chrome-process-name
  - id: micro-behaviors/fs/path/application/executable::browser-apps-firefox
  - id: micro-behaviors/fs/path/password-store::login-data
  - id: micro-behaviors/data/db/sql::chromium-cookie-select-query
