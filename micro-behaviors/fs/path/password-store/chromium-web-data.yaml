# Stores holding credentials at rest.

defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries, csharp]
  crit: notable
  conf: 0.9
  attack: T1555.003

traits:
  - id: chromium-web-data-file
    desc: Chromium Web Data database filename
    if:
      type: text
      regex: '([/\\]|["''`])Web Data\b'
