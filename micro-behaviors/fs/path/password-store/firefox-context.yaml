defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source]
composite_rules:
  - id: firefox-profile-credential-stores
    desc: Firefox profile and credential-store references
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/fs/path/application/browser::firefox-profile-directory
    any:
      - id: micro-behaviors/data/db/sqlite::nss-private-table
      - id: micro-behaviors/fs/path/password-store::logins
      - id: micro-behaviors/fs/path/password-store::firefox-key4-db-reference
