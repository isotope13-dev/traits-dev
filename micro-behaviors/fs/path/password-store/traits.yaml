defaults:
  platforms:
  - linux
  - macos
  - windows
  for: [scripts, binaries, source]

traits:
- id: login-data-string
  desc: Login Data artifact string
  crit: component
  conf: 0.75
  attack: T1555.003
  if:
    type: text
    regex: (?i)Login\s+Data
  unless:
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  # The engine's own password-store filename. Stealer composites that require
  # this string should not treat libcef as a second browser it is looting.
  - id: well-known/lib/runtime/scripted/electron::chromium-engine-binary-context
