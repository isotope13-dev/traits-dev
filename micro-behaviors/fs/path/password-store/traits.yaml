defaults:
  platforms:
  - linux
  - macos
  - windows
  for: [scripts, binaries, source]

traits:
- id: login-data-string
  desc: Login Data artifact string
  crit: component
  conf: 0.75
  attack: T1555.003
  if:
    type: text
    regex: (?i)Login\s+Data
  unless:
  - id: well-known/lib/runtime/scripted/electron::chromium-engine-binary-context
