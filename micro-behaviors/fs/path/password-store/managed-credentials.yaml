# Adjacent #US entries used when joining Microsoft/Credentials path segments.
# The canonical Windows directory names establish the subject; this does not
# assert a root directory, access, successful decryption, or data transfer.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95

traits:
  - id: managed-microsoft-credentials-path-components
    desc: CLR Microsoft and Credentials path components
    if:
      type: hex
      section: .text
      pattern: 13 4D 00 69 00 63 00 72 00 6F 00 73 00 6F 00 66 00 74 00 00 17 43 00 72 00 65 00 64 00 65 00 6E 00 74 00 69 00 61 00 6C 00 73 00 00
