# Resolve the ldstr tokens into the CLR #US heap instead of requiring heap
# adjacency: Microsoft is often interned much earlier than Credentials.
# This is an argument layout, not proof of access, decryption, or transfer.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98

traits:
  - id: managed-microsoft-credentials-path-components
    desc: CLR local Microsoft/Credentials arguments
    if:
      type: yara
      source: |
        import "pe"
        rule managed_local_credentials_path_arguments {
          strings:
            $root = "BSJB" ascii
            $us = "#US\x00" ascii
            $microsoft = { 13 4D 00 69 00 63 00 72 00 6F 00 73 00 6F 00 66 00 74 00 (00|01) }
            $credentials = { 17 43 00 72 00 65 00 64 00 65 00 6E 00 74 00 69 00 61 00 6C 00 73 00 (00|01) }
            $flow = { 1F 1C 28 ?? ?? ?? 0A 72 ?? ?? ?? 70 72 ?? ?? ?? 70 28 ?? ?? ?? 0A }
          condition:
            pe.data_directories[14].virtual_address != 0 and
            all of them and
            for any r in (1..#root) : (
              @root[r] == pe.rva_to_offset(uint32(pe.rva_to_offset(pe.data_directories[14].virtual_address)+8)) and
              for any u in (1..#us) : (
                @us[u] > @root[r] and @us[u] < @root[r]+256 and
                for any f in (1..#flow) : (
                  for any s in (0..pe.number_of_sections-1) : (
                    pe.sections[s].name == ".text" and
                    @flow[f] >= pe.sections[s].raw_data_offset and
                    @flow[f]+!flow[f] <= pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size
                  ) and
                  for any m in (1..#microsoft) : (
                    @microsoft[m] == @root[r]+uint32(@us[u]-8)+(uint32(@flow[f]+8)&0x00ffffff)
                  ) and
                  for any c in (1..#credentials) : (
                    @credentials[c] == @root[r]+uint32(@us[u]-8)+(uint32(@flow[f]+13)&0x00ffffff)
                  )
                )
              )
            )
        }
