defaults:
  platforms: [macos]
  for: [macho]

traits:
  - id: key4-db-basename
    desc: "Key4 database filename reference"
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: key4.db
    unless:
      - id: well-known/tool/detection/security-scanner-identity::apple-xprotectd-scanner-context
