defaults:
  platforms: [windows]
  for: [batch, vbs, text]
  attack: T1555

traits:
  - id: batch-firefox-credential-store-locations
    desc: "Firefox profile and credential-store references"
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: 'Mozilla\\Firefox\\Profiles[\s\S]{0,360}(logins\.json|key4\.db)'
