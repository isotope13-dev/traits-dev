# Browser credential databases -- Chromium `Login Data`, Firefox `logins.json`,
# the OS keyring entries that unwrap them, and stored payment cards.

defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries, csharp]
  crit: notable
  conf: 0.9
  attack: T1555.003

traits:
  - id: chrome-safe-storage
    desc: Chrome safe storage
    if:
      type: text
      regex: Chrome.{0,50}Safe Storage
  - id: firefox-logins
    desc: Firefox logins database
    if:
      type: text
      substr: moz_logins
  - id: browser-credit-cards
    desc: Browser credit card database
    if:
      type: text
      substr: credit_cards
  # "Web Data" is the Chromium autofill database, but it is also an ordinary
  # English noun phrase — the case-insensitive bare-word form matched prose
  # such as "Semantic Web data" in library documentation. Require the path
  # separator or string quote that surrounds the real filename, and keep the
  # exact spelling Chromium uses.
