# Stores that hold credentials at rest for an application or the OS.

defaults:
  platforms: [fortios, appliance, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.98
  attack: T1552.001

traits:
  - id: fortios-device-secret-path
    desc: FortiOS device secret path
    if:
      type: text
      substr: /data/etc/fsv_sync.dat
