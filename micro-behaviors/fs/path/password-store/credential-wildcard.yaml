defaults:
  platforms: [windows, unix]
  crit: notable
  conf: 0.9

traits:
- id: credential-filename-wildcard
  desc: Credential filename wildcard string in PE
  for: [pe]
  if:
    type: text
    regex: '(?i)(^|[^*])\*(psw|pass|login|sife?r)\*([^*]|$)'
- id: source-credential-filename-wildcard
  desc: Credential filename wildcard string constant
  for: [python, javascript, powershell, perl]
  if:
    type: literal
    exclude_docstrings: true
    regex: '(?i)^\*(psw|pass|login|sife?r)\*$'
