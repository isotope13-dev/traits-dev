defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: suspicious
  conf: 0.8
  mbc: OB0003
  attack: T1555.003

traits:
  - id: web-data-copy-db
    desc: "Copied Web Data filename reference"
    if:
      type: text
      regex: '(?i)Web_Data_copy\.db'
  - id: login-data-copy-db
    desc: "Copied Login Data filename reference"
    if:
      type: text
      regex: '(?i)Login_Data_copy\.db'
