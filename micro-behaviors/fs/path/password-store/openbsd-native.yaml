defaults:
  platforms:
  - openbsd
  - bsd
  - unix
  for:
  - cpp
  - elf
  attack: T1555.003
  crit: suspicious
  conf: 0.92
traits:
- id: native-firefox-logins-path
  desc: Browser logins.json path reference
  if:
    type: text
    substr: /logins.json
  unless:
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: metadata/path::test-directory-component
  - id: metadata/package/testing/presence/harness::c-source-test-file
- id: native-firefox-key4-path
  desc: Browser key4.db path reference
  if:
    type: text
    substr: /key4.db
  unless:
  - id: metadata/path::test-directory-component
  - id: metadata/package/testing/presence/harness::c-source-test-file
  - id: well-known/lib/crypto/nss::nss-source-tree
