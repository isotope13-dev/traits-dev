defaults:
  attack: T1555.003
  platforms:
    - unix
    - windows
  for: [scripts, binaries, source]

traits:
  - id: firefox-key4-db-reference
    desc: "Firefox-family key4.db store reference"
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)(Firefox|Waterfox|Pale Moon).{0,80}key4\.db
    unless:
      - id: well-known/tool/detection/pattern-catalog::embedded-deny-policy-catalog
