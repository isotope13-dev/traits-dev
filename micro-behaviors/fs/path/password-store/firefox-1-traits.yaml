defaults:
  attack: T1555.003
  platforms:
    - unix
    - windows
  for: [scripts, binaries, source]

traits:
  - id: firefox-key4-db-reference-trailing
    desc: "Firefox-family key4.db store reference trailing"
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(Firefox|Waterfox|Pale Moon).{0,80}key4\.db'
    unless:
      - id: well-known/tool/detection/pattern-catalog::embedded-deny-policy-catalog

  - id: firefox-key4-db-reference-leading
    desc: "Firefox-family key4.db store reference leading"
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)key4\.db.{0,80}(Firefox|Waterfox|Pale Moon)'
    unless:
      - id: well-known/tool/detection/pattern-catalog::embedded-deny-policy-catalog

composite_rules:
  - id: firefox-key4-db-reference
    desc: "Firefox-family key4.db store reference"
    crit: notable
    conf: 0.9
    any:
      - id: firefox-key4-db-reference-trailing
      - id: firefox-key4-db-reference-leading
