# Browser credential databases -- Chromium `Login Data`, Firefox `logins.json`,
# the OS keyring entries that unwrap them, and stored payment cards.

defaults:
  platforms:
    - macos
  for:
    - applescript
    - macho
  attack: T1555.003

traits:
  - id: edge-credential-store-path
    desc: Microsoft Edge credential database path
    crit: notable
    conf: 0.85
    for: [applescript, shell]
    if:
      type: text
      regex: '(?i)Microsoft Edge[/\\].{0,80}(Login Data|Cookies)'
  - id: vivaldi-credential-store-path
    desc: Vivaldi credential database path
    crit: notable
    conf: 0.85
    for: [applescript, shell]
    if:
      type: text
      regex: '(?i)Vivaldi[/\\].{0,80}(Login Data|Cookies)'
  - id: login-data-path-concat
    desc: Browser login data path concatenation
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '&\s*"/Login\s+Data"'
