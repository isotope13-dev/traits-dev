defaults:
  platforms: [windows, unix]
  for: [java, class, java_class]

traits:
  - id: java-browser-login-stores
    desc: "Browser login-store filename pair"
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'Login Data[\s\S]{0,220}logins\.json'
  - id: jvm-login-data-bytes
    desc: "Login Data filename bytes"
    crit: notable
    conf: 0.94
    for: [class, java_class]
    if:
      type: hex
      pattern: 4C 6F 67 69 6E 20 44 61 74 61

composite_rules:
  - id: jvm-browser-login-store-path
    desc: JVM browser login store path
    crit: notable
    conf: 0.94
    for: [java, class, java_class, jar]
    scope: archive
    any:
      - id: java-browser-login-stores
      - id: jvm-login-data-bytes

