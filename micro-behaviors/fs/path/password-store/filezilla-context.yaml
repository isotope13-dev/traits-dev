defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, csharp]

composite_rules:
  - id: filezilla-configuration-path-references
    desc: FileZilla configuration file path references
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/fs/path/password-store::filezilla-sitemanager-path
      - id: micro-behaviors/fs/path/password-store::filezilla-recentservers-path
      - id: micro-behaviors/fs/path/app-config::filezilla-config-path
    unless:
      - id: well-known/tool/detection/security-scanner::titus-defensive-secret-scanner-context
