defaults:
  platforms: [linux]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: mounted-windows-developer-credentials
    desc: Git credentials under mounted Windows profile
    if:
      type: literal
      # Match the store and Windows user-profile hierarchy, independent of the
      # mount label, username, implementation language or campaign staging root.
      regex: '/mnt/[^/]+/Users/[^/]+/(\.git-credentials|\.config/gh/hosts\.yml)$'
  - id: mounted-windows-browser-login-store
    desc: Login database under mounted Windows profile
    if:
      type: literal
      regex: '/mnt/[^/]+/Users/[^/]+/AppData/(Local|Roaming|\*)/.{1,100}/Login Data$'
