defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1555.003

traits:
  - id: browser-safe-storage-label
    desc: Browser safe storage labels
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: Chrome Safe Storage|Brave Safe Storage
    unless:
      - id: well-known/lib/platform/browser-automation/drivers/selenium::google-flow-browser-auth-client
      - id: metadata/package/testing/presence/harness::test-directory
      - id: well-known/app/ai/tool-server/linkedin-mcp-server::browser-import-source-context
      - id: well-known/app/ai/tool-server/linkedin-mcp-server::browser-import-archive-context
      - id: well-known/lib/development/browser-cookie3/
      - id: well-known/app/finance/emoney-mcp::session-reuse-context
