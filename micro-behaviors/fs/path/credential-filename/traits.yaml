# Files whose *name* marks them as credential-bearing, independent of which
# product owns them -- `auth.json`, `*.credentials`, `secrets.*`. This is the
# one genuinely form-axis member of the set: the sibling directories answer
# "what kind of secret", this one answers "the filename says secret".
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [binaries, scripts, source]

traits:
  - id: pgpass
    desc: .pgpass credentials file
    conf: 0.9
    if:
      type: text
      regex: '(?i)(^|[\/\\\\]|~[\/\\\\]|\$HOME[\/\\\\])\.pgpass\b'

  - id: mycnf
    desc: .my.cnf credentials file
    conf: 0.9
    if:
      type: text
      regex: '(?i)(^|[\/\\\\]|~[\/\\\\]|\$HOME[\/\\\\])\.my\.cnf\b'

  - id: secrets-json-file
    desc: Secrets JSON filename reference
    conf: 0.85
    if:
      type: text
      regex: (^|[/~\\\\])secrets\.json\b
  - id: production-key-file
    desc: Production key credential file
    conf: 0.85
    if:
      type: text
      regex: (^|[/~\\\\])production\.key\b
  - id: token-text-file
    desc: Token credential text file
    conf: 0.8
    if:
      type: text
      regex: (^|[/~\\\\])token\.txt\b
  - id: api-key-text-file
    desc: API key credential text file
    conf: 0.85
    if:
      type: text
      regex: (^|[/~\\\\])api_key\.txt\b
  - id: seed-text-file
    desc: Seed credential text file
    conf: 0.85
    if:
      type: text
      regex: (^|[/~\\\\])seed\.txt\b
  - id: phrase-text-file
    desc: Recovery phrase credential text file
    conf: 0.85
    if:
      type: text
      regex: (^|[/~\\\\])phrase\.txt\b
  - id: mnemonic-text-file
    desc: Mnemonic credential text file
    conf: 0.9
    if:
      type: text
      regex: (^|[/~\\\\])mnemonic\.txt\b
  - id: credentials-json-file
    desc: References a credentials.json file
    conf: 0.85
    if:
      type: text
      regex: (^|[/~\\\\])credentials\.json\b
  - id: recovery-text-file
    desc: Recovery credential text file
    conf: 0.85
    if:
      type: text
      regex: (^|[/~\\\\])recovery\.txt\b
