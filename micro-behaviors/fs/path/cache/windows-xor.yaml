defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: xor-localappdata-inetcache-components
    desc: XOR-masked LOCALAPPDATA and INetCache names
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule xor_localappdata_inetcache_components {
          strings:
            $root = "LOCALAPPDATA" xor(1-255)
            $cache = "INetCache" xor(1-255)
          condition:
            all of them and
            for any i in (1..#root) : (
              for any j in (1..#cache) : (
                @root[i] <= @cache[j] + 96 and @cache[j] <= @root[i] + 96 and
                (uint8(@root[i]) ^ 0x4c) == (uint8(@cache[j]) ^ 0x49)
              )
            )
        }
