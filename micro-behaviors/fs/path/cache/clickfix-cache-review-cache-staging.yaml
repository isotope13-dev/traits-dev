defaults:
  platforms: [windows]
  for: [html, javascript, powershell, batch]


composite_rules:
  - id: browser-profile-cache-data-path
    desc: Browser profile and cache directory paths
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/application/browser/profile::browser-localappdata-userdata-root
    any:
      - id: micro-behaviors/fs/path/cache::browser-cache-directory-name
    near_bytes: 1024
