# Evidence-only observations; consumers supply any attack context.
traits:
- platforms:
  - windows
  for:
  - html
  - javascript
  - powershell
  - batch
  id: browser-cache-directory-name
  desc: Browser cache directory name reference
  crit: notable
  conf: 0.92
  unless:
  - id: metadata/package/files/dependency::node-modules-path
  - id: metadata/package/files/dependency::vsix-bundled-output-path
  - id: well-known/lib/development/ts-compiler-lib::typescript-compiler-lib-context
  - id: well-known/lib/development/typescript-compiler::compiler-diagnostics-bundle
  if:
    type: text
    regex: (?i)([\\/]cache2|[\\/"']Cache_Data)\b
