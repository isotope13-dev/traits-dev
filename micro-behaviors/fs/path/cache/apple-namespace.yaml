defaults:
  platforms: [macos]
  for: [shell, javascript, typescript, go, python, macho]
traits:
  - id: macos-apple-cache-directory
    desc: References Apple-namespaced user cache
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)/Library/Caches/com\.apple\.(metadata|trustd|homeenergyd|softwareupdate|securityd)\b'
