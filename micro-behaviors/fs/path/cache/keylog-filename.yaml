defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  attack: T1056.001
  mbc: E1056.001

traits:
  - id: evt-marker-file
    desc: Event marker file in /Library/Caches
    crit: suspicious
    conf: 0.85
    platforms:
      - macos
    if:
      type: string_literal
      regex: touch\s+/Library/Caches/\.evt_|/Library/Caches/\.evt_
