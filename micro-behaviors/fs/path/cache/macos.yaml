defaults:
  platforms: [macos]
  for: [macho, shell, go]
  crit: baseline

traits:
  - id: library-cache-path-reference
    desc: References macOS Library cache path
    crit: notable
    conf: 0.95
    for: [javascript]
    if:
      type: literal
      kind: string
      substr: /Library/Caches/

  - id: system-library-cache-path
    desc: macOS system Library cache path
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: /Library/Caches/

  - id: hidden-system-cache-file
    desc: Hidden file in macOS system cache
    crit: suspicious
    conf: 0.85
    attack: T1564.001
    if:
      type: text
      regex: /Library/Caches/\.[a-zA-Z0-9_\-]+

  - id: apple-named-user-library-cache-path
    desc: User Apple-named Library cache path
    crit: baseline
    conf: 0.85
    for: [python, shell, go, macho]
    if:
      type: text
      regex: ~/Library/Caches/com\.apple\.[a-z][a-z0-9.-]{2,40}

  - id: apple-named-system-library-cache-path
    desc: System Apple-named Library cache path
    crit: baseline
    conf: 0.85
    for: [python, shell, go, macho]
    if:
      type: text
      # Require a root/argument boundary. Apple toolchains embed build-source
      # paths such as /AppleInternal/BuildRoot/Library/Caches/com.apple.*.
      regex: '(^|[^/A-Za-z0-9_.-])/Library/Caches/com\.apple\.[a-z][a-z0-9.-]{2,40}'
    unless:
      # Apple's build server bakes its own cache path into what it ships:
      # libarclite carries `/Library/Caches/com.apple.xbs/Sources/arclite/...`
      # as a debug source path, so every binary linked against the ARC
      # compatibility shim carries it -- facebook's xctool and its Xcode shims
      # among them. `xbs` is the build host's cache, not a runtime path.
      - type: text
        substr: /Library/Caches/com.apple.xbs/Sources/
