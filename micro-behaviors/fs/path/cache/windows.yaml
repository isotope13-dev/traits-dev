# Browser / WinInet cache paths used as camouflage staging directories.
defaults:
  platforms: [windows]
  for: [scripts, binaries, class, java_class, jar, zip]
  crit: notable
  conf: 0.9

traits:
  - id: windows-inetcache-path
    desc: Windows INetCache staging path reference
    crit: notable
    conf: 0.93
    for: [class, java_class, jar, zip]
    if:
      type: value
      path: class.strings[*]
      exact: INetCache

  - id: windows-inetcache-path-text
    desc: Windows INetCache path text reference
    crit: notable
    conf: 0.9
    for: [scripts, pe, dll, text]
    if:
      type: text
      regex: '(?i)\bINetCache\b'
