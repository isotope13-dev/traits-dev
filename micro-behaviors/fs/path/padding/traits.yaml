defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: many-random-root-executable-paths
    desc: Many randomized root executable paths
    crit: notable
    count_min: 50
    if:
      type: text
      regex: 'C:\\([a-zA-Z0-9_]){8}\.exe'
  - id: sandbox-paths
    desc: Hash-named sandbox temporary path
    crit: component
    if:
      type: text
      regex: 'Temp\\([a-fA-F0-9]){64}\.exe'
  - id: sandbox-analysis-artifact-path
    desc: Timestamped sandbox analysis artifact path
    crit: component
    if:
      type: text
      regex: 'c:\\analyse\\\d{9,}\.\d+_[0-9a-f-]{36}'
      case_insensitive: true

composite_rules:
  - id: sandbox-execution-path-padding
    desc: Multiple sandbox execution paths embedded as padding
    crit: suspicious
    conf: 0.98
    all:
      - id: sandbox-paths
      - id: sandbox-analysis-artifact-path
