defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: many-random-root-executable-paths
    desc: Many randomized root executable paths
    crit: notable
    count_min: 50
    if:
      type: text
      regex: 'C:\\([a-zA-Z0-9_]){8}\.exe'
  - id: sandbox-paths
    desc: Hash-named sandbox temporary path
    crit: notable
    if:
      type: text
      regex: 'Temp\\([a-fA-F0-9]){64}\.exe'
  - id: sandbox-analysis-artifact-path
    desc: Timestamped sandbox analysis artifact path
    crit: notable
    if:
      type: text
      regex: 'c:\\analyse\\\d{9,}\.\d+_[0-9a-f-]{36}'
      case_insensitive: true

  - id: many-user-download-executable-paths
    desc: Many user Downloads executable paths
    crit: notable
    conf: 0.98
    count_min: 20
    if:
      type: text
      regex: 'C:\\Users\\[^\\\r\n]{1,64}\\Downloads\\[^\\\r\n]{1,120}\.exe'

  - id: many-user-desktop-executable-paths
    desc: Many user Desktop executable paths
    crit: notable
    conf: 0.98
    count_min: 20
    if:
      type: text
      regex: 'C:\\Users\\[^\\\r\n]{1,64}\\Desktop\\[^\\\r\n]{1,120}\.exe'

  - id: many-user-temp-executable-paths
    desc: Many user Temp executable paths
    crit: notable
    conf: 0.98
    count_min: 20
    if:
      type: text
      regex: 'C:\\Users\\[^\\\r\n]{1,64}\\AppData\\Local\\Temp\\[^\\\r\n]{1,120}\.exe'

  # Hash-named drive-root paths (C:\<32-64 hex>) are a neutral corpus shape:
  # malware drop-target lists, collector blocklists and sandbox telemetry all
  # share it, so the strings alone establish no sandbox check and no drop.
  # Relocated from
  # objectives/anti-analysis/sandbox-detect/environment/path::sandbox-root-hash-path-list,
  # whose matcher only counted these strings while its name and directory
  # claimed a compare-against-own-path-and-exit check the matcher never
  # verified. One or two such paths are build leaks, so the count (8+) is the
  # signal; consuming composites supply the intent-specific context.
  - id: many-hash-named-root-paths
    desc: Many hash-named drive-root paths
    crit: notable
    conf: 0.9
    count_min: 8
    size_max: 5242880
    if:
      type: text
      regex: '(?i)^C:\\[0-9a-f]{32,64}$'

composite_rules:
  - id: many-user-profile-executable-paths
    desc: Many user-profile executable paths
    crit: notable
    conf: 0.98
    any:
      - id: many-user-download-executable-paths
      - id: many-user-desktop-executable-paths
      - id: many-user-temp-executable-paths
