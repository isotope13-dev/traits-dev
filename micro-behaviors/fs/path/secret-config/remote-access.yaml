defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.92

traits:
  - id: mremoteng-confcons-path
    desc: mRemoteNG confCons.xml path reference
    conf: 0.94
    if:
      type: text
      regex: '(?i)(mRemoteNG[/\\]+confCons\.xml\b|[/\\]confCons\.xml\b|%APPDATA%[/\\]+mRemoteNG\b)'

  - id: ftpinfo-appdata-path
    desc: FTPInfo configuration path reference
    conf: 0.92
    if:
      type: text
      regex: '(?i)(%APPDATA%[/\\]+FTPInfo\b|FTPInfo[/\\]+FTPInfo\.xml\b)'
