# Configuration that carries or locates secrets.

defaults:
  platforms: [unix]
  for: [elf, macho, shell, python, perl, ruby, text]
  crit: component
  conf: 0.8

traits:
  - id: ssh-directory-literal
    crit: notable
    desc: References the user SSH directory
    # The directory rather than one key file: a sweep opens the folder and
    # takes what is in it.
    if:
      type: text
      regex: '(^|[^\w.])\.ssh(/|$|["'' ])'
