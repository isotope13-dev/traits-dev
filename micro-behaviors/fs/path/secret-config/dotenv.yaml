# Configuration files that carry secrets. Sensitive for what they *contain*,
# not what they are: the same file shape is ordinary config without the
# credential stanza. Holder is the filename.
defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

traits:
  - id: hidden-app-dotenv
    desc: Hidden app dotenv path
    crit: notable
    conf: 0.86
    downgrade:
      any:
        - id: well-known/app/ai/assistant/nitin-ai
    if:
      type: string_literal
      regex: (^|[/~])\.[A-Za-z0-9._-]{2,64}/\.env$
  - id: dotenv-filename-literal
    desc: .env filename literal
    crit: component
    conf: 0.85
    if:
      type: literal
      kind: string
      regex: '(^|[/~\\\\])\.env$'
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: well-known/tool/detection/skill-scanner::source-context

  # NOTE: the `/etc/passwd`-style account-database path literal is matched once,
  # by micro-behaviors/fs/path/config/accounts::unix-account-database-path-reference.
  # A second copy lived here as `unix-account-database-path` ("Multiple Unix
  # account database paths"), which both reported the same literal twice and
  # claimed a count the matcher never checked. Reference the accounts trait.
  - id: dotenv-filename-encoded
    desc: Decoded dotenv filename
    crit: component
    conf: 0.8
    for: [javascript, typescript, python, go, rust, java, csharp, powershell]
    if:
      type: encoded
      exact: .env
