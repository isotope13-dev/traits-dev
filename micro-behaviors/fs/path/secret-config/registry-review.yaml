traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  conf: 0.9
  id: npm-pypi-credential-file-reference
  desc: NPM or PyPI credential-file path
  if:
    type: text
    regex: (\.npmrc|\.pypirc)
- platforms:
  - unix
  for:
  - python
  id: encoded-registry-credential-path
  desc: Decoded registry credential-file path
  conf: 0.95
  if:
    type: encoded
    regex: \.docker/config\.json|\.pypirc|\.npmrc|\.netrc
defaults:
  crit: notable
