defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
composite_rules:
  - id: git-configuration-path
    desc: Git global or repository configuration path
    any:
      - id: micro-behaviors/fs/path/secret-config::gitconfig-file
      - id: micro-behaviors/fs/path/secret-config::git-repository-config-file
