defaults:
  platforms: [windows, unix]
  for: [source, scripts, binaries]
  crit: notable
  conf: 0.94

traits:
  - id: package-manager-config-path-marker
    desc: References npm or NuGet credential config
    if:
      type: text
      regex: '(?i)(NuGet[/\\]{1,2}NuGet\.Config|NuGet["'']\s*,\s*["'']NuGet\.Config|["'']\.npmrc["''])'
