# Configuration that carries or locates secrets, and the contexts in which
# such a path is being described rather than read.

defaults:
  platforms: [fortios, appliance, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.98
  attack: T1552.001

traits:
  - id: fortios-global-config-archive-path
    desc: FortiOS global config archive path
    if:
      type: text
      substr: /data/config/sys_global.conf.gz
  - id: fortios-interface-config-archive-path
    desc: FortiOS interface config archive path
    if:
      type: text
      substr: /data/config/global_system_interface.gz
  - id: fortios-vdom-config-archive-path
    desc: FortiOS compressed VDOM config path
    if:
      type: text
      regex: '/data/config/sys_vd_[A-Za-z0-9_.+-]{1,96}\.conf\.gz'
