defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.97

traits:
  # These are references to credential-bearing configuration, not reads.
  - id: asterisk-auth-config-path
    desc: Asterisk authentication configuration path
    if:
      type: text
      regex: '/etc/asterisk/(manager|pjsip\.auth|sip_registrations)\.conf'
  - id: encoded-asterisk-auth-config-path
    desc: Encoded Asterisk authentication config path
    for: [shell, python, javascript, typescript, php, ruby, perl, powershell]
    if:
      type: encoded
      regex: '/etc/asterisk/(manager|pjsip\.auth|sip_registrations)\.conf'
  - id: pbx-database-config-path
    desc: PBX database configuration path
    if:
      type: text
      regex: '/etc/(asterisk/)?(amportal|freepbx|issabel|elastix)\.conf'
  - id: postfix-relay-password-path
    desc: Postfix SMTP relay password map path
    if:
      type: text
      substr: /etc/postfix/sasl_passwd
