defaults:
  platforms: [netscaler, appliance, unix]
  for: [scripts, binaries, go, java, kotlin, csharp, swift, zig, elf]
  attack: T1041

traits:
  - id: netscaler-nsconfig-path
    desc: NetScaler ns.conf path
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '/(flash/)?ns_?config/(running/)?ns\.conf\b'
  - id: netscaler-license-path
    desc: NetScaler license file path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: /nsconfig/license.dat
