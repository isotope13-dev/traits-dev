# GitLab Runner's config.toml contains runner authentication tokens. Both
# system and user installations use a gitlab-runner/.gitlab-runner directory.
# Match the resource, independently of the code's language and variable names.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.97

traits:
  - id: gitlab-runner-auth-config-path
    desc: GitLab Runner auth config path reference
    if:
      type: text
      case_insensitive: true
      regex: '(^|[/\\"''])\.?gitlab-runner([/\\]{1,2}|["'']\s*,\s*["''])config\.toml($|["''\s\x00])'
