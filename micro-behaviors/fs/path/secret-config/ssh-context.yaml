# Configuration that carries or locates secrets, and the contexts in which
# such a path is being described rather than read.

defaults:
  platforms: [unix, windows]
  crit: component
  conf: 0.9

traits:
  - id: ssh-client-basename
    desc: File is an ssh client binary
    for: [elf, macho, pe]
    if:
      type: path
      basename: true
      regex: '^ssh(-.+)?(\.exe)?$'

  # `>>> ` is a Python REPL prompt: the path is being shown, not opened.
  - id: ssh-path-in-repl-transcript
    desc: SSH path inside a REPL transcript
    for: [scripts, source, documents]
    if:
      type: text
      regex: '>>>\s+.{0,200}\.ssh/'
