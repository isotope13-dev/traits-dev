defaults:
  platforms: [unix]
  for: [shell]
  attack: "T1552.001, T1041"

composite_rules:
- id: package-auth-file-harvest
  desc: Two package registry credential files named together
  crit: component
  conf: 0.9
  any:
    - id: micro-behaviors/fs/path/secret-config::npmrc-then-pypirc-or-netrc
    - id: micro-behaviors/fs/path/secret-config::pypirc-or-netrc-then-npmrc
    - id: micro-behaviors/fs/path/secret-config::pypirc-then-netrc
    - id: micro-behaviors/fs/path/secret-config::netrc-then-pypirc
