defaults:
  platforms: [appliance, unix]
  for: [perl]
traits:
  - id: netscaler-nsrootkey-path
    desc: References NetScaler nsrootkey secret file
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: /nsconfig/nsrootkey
  - id: netscaler-license-lic-path
    desc: References NetScaler license.lic file
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: /nsconfig/license.lic
