defaults:
  platforms:
  - unix
  - windows
  for:
  - binaries
  - scripts
  - python
  - java
  - class
  - kotlin
  - c
  - cpp
  crit: notable
  conf: 0.95
  attack: T1552.001
traits:
- id: docker-config
  desc: Docker config.json path
  for:
  - binaries
  - scripts
  - source
  if:
    type: text
    regex: (?i)\.docker[/\\]config\.json
  unless:
  - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
  - id: well-known/tool/detection/agent/agentskillmap::cli-context
- id: kube-config
  desc: Kubernetes config path
  for:
  - binaries
  - scripts
  - python
  - java
  - class
  - kotlin
  - c
  - cpp
  - go
  - rust
  if:
    type: text
    regex: (?i)\.kube[/\\]config\b
  unless:
  - id: well-known/tool/detection/llm-scanner::llm-scanner-context
  - id: metadata/file/profile/threat-scanning::auditr-defensive-signature-catalog
  - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
  - id: well-known/tool/detection/agent/agentskillmap::cli-context
  downgrade:
    any:
    - id: well-known/tool/sysadmin/container/
- id: docker-config-path-components
  desc: Docker config path components
  conf: 0.92
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: path\.join\s*\([^)]{0,160}["']\.docker["'][^)]{0,80}["']config\.json["']
  unless:
  - id: metadata/file/profile/security-scanner/
- id: kube-config-path-components
  desc: Kubernetes config path components
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: path\.join\s*\([^)]{0,160}["']\.kube["'][^)]{0,80}["']config["']
  unless:
  - id: well-known/tool/sysadmin/container/
