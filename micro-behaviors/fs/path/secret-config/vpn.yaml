# Configuration carrying or locating secrets.

defaults:
  platforms: [unix]
  for: [go, elf, c, cpp, objc, python]

traits:
  - id: openvpn-path-or-config-ref
    desc: OpenVPN path or configuration reference
    crit: notable
    conf: 0.9
    if:
      type: text
      # Path/config shape only. A bare word had to be followed by whitespace,
      # which made every prose mention match — FreeBSD sys/priv.h's
      # `/* Administer OpenVPN DCO. */` comment is not a config reference.
      # A separator (`/` or `.`) keeps /etc/openvpn/, openvpn.conf, *.ovpn.
      regex: '(?i)\bopenvpn[/.]|\.ovpn\b'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
