# Configuration that carries or locates secrets.

defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript]

traits:
  - id: ssh-dir-reference
    desc: SSH configuration directory reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(\bls\b|\bcd\b)\s+(-[A-Za-z0-9-]+\s+)?~/?\.ssh\b'
  - id: node-ssh-home-path
    desc: Node builds home SSH directory path
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    attack: T1552.004
    if:
      type: text
      regex: 'homedir\s*\(\)[\s\S]{0,100}["'']\.ssh["'']'
  - id: node-ssh-home-env-path
    desc: Node builds HOME SSH directory path
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    attack: T1552.004
    if:
      type: text
      regex: 'process\.env\.HOME[\s\S]{0,100}["'']\.ssh["'']'
  - id: ssh-config-artifact
    desc: SSH config artifact path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: .ssh/config
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module

  # These path strings establish sensitive-file awareness, not access or
  # theft intent. Stock OpenSSH configuration templates embed both.
