defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-userprofile-ssh-dir
    desc: Constructs the user profile SSH directory path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Join-Path\s+\$env:USERPROFILE\s+["'']\.ssh["'']'
    unless:
      - id: well-known/tool/detection/vtk/
      - type: text
        regex: '(?i)Credential Audit Script'
      - type: text
        regex: '(?i)Shai-Hulud Machine Infection Checker'

