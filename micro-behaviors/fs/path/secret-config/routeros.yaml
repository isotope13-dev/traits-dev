# Configuration that carries or locates secrets, and the contexts in which
# such a path is being described rather than read.

# Rationale carried over with these traits:
# A RouterOS `.rsc` export is the device configuration in script form, and it
# carries the user table, PPP secrets and SNMP communities inline.  The path
# reference alone is appliance-triage context; credential theft intent needs a
# reader that pairs it with a secret filter or an egress channel.

defaults:
  platforms: [routeros, appliance, unix]
  for: [java, kotlin, rust, elf]

traits:
  - id: routeros-config-backup-path
    desc: RouterOS hidden configuration backup path
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: /.config/backup.rsc
