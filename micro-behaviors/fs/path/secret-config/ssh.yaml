# Configuration files that carry secrets. Sensitive for what they *contain*,
# not what they are: the same file shape is ordinary config without the
# credential stanza. Holder is the filename.
defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

traits:
  - id: js-ssh-homedir-path
    desc: JavaScript builds the user SSH directory path
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(os\.)?homedir\s*\(\s*\)[\s\S]{0,100}["'']\.ssh["'']'
  - id: js-ssh-home-env-bracket-path
    desc: JavaScript builds bracket-access HOME .ssh path
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: 'process\.env\s*\[\s*["'']HOME["'']\s*\][\s\S]{0,100}["'']\.ssh["'']'
  - id: js-ssh-platform-home-path
    desc: JavaScript references platform SSH home path
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '(/Users/|/home/)[^''"`\n]{0,80}/\.ssh\b|USERPROFILE[^''"`\n]{0,80}\\\.ssh\\'
  - id: ssh-dir
    desc: .ssh directory path
    crit: notable
    if:
      type: text
      regex: \.ssh/
    not:
      - substr: "$HOME/.ssh/"
      - substr: ".ssh/authorized_keys"
      - regex: '\.ssh/config\b'
      - substr: ".ssh/known_hosts"
      - regex: 'vagrant insecure public key'
    unless:
      - type: text
        regex: '\.ssh(/authorized_keys)? type=(dir|file)\b'
    downgrade:
      any:
        - id: ssh-tooling-or-transcript-context
        - id: syntax-bundle-context
        - id: well-known/tool/sysadmin/kubernetes/iac/
        - id: micro-behaviors/process/interpreter/vm/
  # Reading known_hosts is a sensitive-path capability, but the path alone
  # does not establish host harvesting or lateral movement intent.
