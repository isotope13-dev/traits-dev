# The canonical places a CTF or lab environment leaves its flag.
#
# `/flag`, `/flag.txt`, `/root/flag.txt`, `/app/flag` -- these are not paths a
# program discovers, they are paths it was told about. Naming both the bare
# root one and a nested one is location knowledge worth keeping in diffs, but
# on its own it establishes no opening, looping, or reading -- the operation
# legs live in the consuming composites. It stays notable here; the
# credential-access weight comes from actual secret reads.
#
# Split in two rather than counted through one alternation: a count over
# alternatives cannot tell two spellings of `/flag` from the same one twice,
# and the pair is the point.
defaults:
  platforms: [unix]
  for: [scripts, source]
  crit: notable
  conf: 0.9
  attack: T1083,T1552.001

traits:
  - id: flag-file-root-path
    desc: Names a root-level flag file path
    if:
      type: text
      regex: '["'']/flag(\.txt)?["'']'

  - id: flag-file-nested-path
    desc: Names a nested flag file path
    if:
      type: text
      regex: '["'']/\w{1,10}/[\w./]{0,24}flag(\.txt)?["'']'

composite_rules:
  - id: ctf-flag-file-path-list
    desc: Names root and nested flag file paths
    crit: notable
    conf: 0.92
    all:
      - id: flag-file-root-path
      - id: flag-file-nested-path
