# Configuration that carries or locates secrets, and the contexts in which
# such a path is being described rather than read.

defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript]

composite_rules:
  - id: ssh-host-artifact-cluster
    desc: Multiple SSH host-artifact paths
    crit: notable
    conf: 0.96
    needs: 2
    any:
      - id: micro-behaviors/fs/path/personal::bash-history-artifact
      - id: micro-behaviors/fs/path/secret-config::ssh-config-artifact
    unless:
      - id: micro-behaviors/fs/path/config/system::config-hosts
      - id: metadata/file/string/identity::system-shell-basename
      - id: well-known/app/ai/coding-agent/vtcode::vtcode-agent-package
