# Configuration carrying or locating secrets.

defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

composite_rules:
  - id: orchestration-credentials
    desc: Orchestration credential paths
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/fs/path/secret-config::kube-config
      - id: micro-behaviors/fs/path/secret-config::kube-config-path-components
    unless:
      - id: well-known/lib/ai/pyaigis/
