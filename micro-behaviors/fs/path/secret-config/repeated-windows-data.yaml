defaults:
  for: [batch, powershell, pe]
  platforms: [windows]
traits:
  - id: windows-crypto-data-path
    desc: Repeated Windows crypto data path
    crit: notable
    count_min: 2
    if:
      type: text
      substr: ProgramData\Microsoft\Crypto
      case_insensitive: true
  - id: documents-secrets-path
    desc: Repeated Documents Secrets path
    crit: notable
    count_min: 2
    if:
      type: text
      substr: Documents\Secrets
      case_insensitive: true
