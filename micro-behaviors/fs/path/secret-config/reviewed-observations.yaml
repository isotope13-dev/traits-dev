traits:
- id: cargo-credentials-path-marker
  desc: References the Cargo credentials path
  if:
    type: text
    # Literal paths and adjacent path-join arguments are the same store
    # reference. Accept native and source-escaped Windows separators too.
    regex: '(^|[./\\''"`])\.cargo([/\\]{1,2}|[''"]\s*,\s*[''"])credentials\b'
- id: rubygems-credentials-path-marker
  desc: References the RubyGems credentials path
  if:
    type: text
    regex: '(^|[./\\''"`])\.gem([/\\]{1,2}|[''"]\s*,\s*[''"])credentials\b'
defaults:
  for:
  - scripts
  - binaries
  - source
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
