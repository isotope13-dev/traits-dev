traits:
- id: cargo-credentials-path-marker
  desc: References the Cargo credentials path
  if:
    type: text
    regex: (^|[./\\'"`])\.cargo/credentials\b
- id: rubygems-credentials-path-marker
  desc: References the RubyGems credentials path
  if:
    type: text
    regex: (^|[./\\'"`])\.gem/credentials\b
defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.9
