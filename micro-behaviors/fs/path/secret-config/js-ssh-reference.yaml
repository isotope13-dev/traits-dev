traits:
  - id: js-ssh-config-path-reference
    desc: JavaScript SSH configuration path reference
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    platforms: [unix]
    size_max: 104857600
    if:
      type: text
      regex: '(?i)([/\\]\.ssh[/\\]|authorized_keys|id_(rsa|ed25519|ecdsa)(\.pub)?\b)'
