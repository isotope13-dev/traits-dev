# Configuration carrying or locating secrets.

defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

composite_rules:
  - id: container-orchestration-tooling-context
    desc: Container or orchestration tooling
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/os/container/runtime/
      - id: well-known/tool/sysadmin/container/
      - id: well-known/tool/sysadmin/kubernetes/iac/
      - id: well-known/tool/development/dagdotdev/
      - id: well-known/app/infrastructure/kubeflow-community::notebook-scripts
      - id: well-known/dual-use/tunnel/shadowsocks-libev::shadowsocks-libev-source
