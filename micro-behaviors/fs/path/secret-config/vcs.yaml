# Configuration files that carry secrets. Sensitive for what they *contain*,
# not what they are: the same file shape is ordinary config without the
# credential stanza. Holder is the filename.
defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

traits:
  - id: gitconfig-file
    desc: Git global configuration file
    crit: notable
    if:
      type: text
      # Reject editor/highlighter globs like `.gitconfig*` — the trailing star is
      # a filename pattern, not a path to the live config file.
      regex: '(^|[/~\\\\])\.gitconfig($|[/\\\s])'
  - id: git-repository-config-file
    desc: Git repository configuration file path
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'path\.join\s*\([^)]{0,160}["'']\.git["''][^)]{0,80}["'']config["'']'
