defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: npm-script-auth-config-dotfile
  desc: npm script references auth config dotfile
  crit: notable
  conf: 0.9
  unless:
  - type: value
    path: "scripts[*]"
    regex: '(?i)docker\s+buildx?\s+build\b[^"\n]{0,400}--secret\s+'
  if:
    type: value
    path: "scripts[*]"
    regex: '[/~]?\.(npmrc|pypirc|netrc)\b'
