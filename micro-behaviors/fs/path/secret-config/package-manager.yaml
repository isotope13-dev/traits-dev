defaults:
  platforms:
  - unix
  - windows
  for:
  - binaries
  - scripts
  - python
  - java
  - class
  - kotlin
  - c
  - cpp
  crit: notable
  conf: 0.95
traits:
- id: pypirc-credentials-file
  desc: PyPI credentials file path reference
  conf: 0.9
  for:
  - binaries
  - scripts
  - python
  - java
  - class
  - kotlin
  - c
  - cpp
  - go
  - rust
  - javascript
  - typescript
  if:
    type: string_literal
    substr: .pypirc
- id: package-manager-credential-path-set
  desc: References netrc, npm, and PyPI credential files
  conf: 0.94
  for:
  - shell
  if:
    type: text
    regex: \.netrc[\s\S]{0,220}\.npmrc[\s\S]{0,220}\.pypirc
- id: composer-auth-file
  desc: Composer auth file path reference
  conf: 0.9
  for:
  - binaries
  - scripts
  - source
  if:
    type: text
    regex: (?i)(^|[/\\'"`])\.?composer([/\\]{1,2}|['"]\s*,\s*['"])auth\.json\b
- id: gem-credentials-file
  desc: RubyGems credentials file path reference
  conf: 0.9
  if:
    type: literal
    substr: .gem/credentials
- id: netrc
  desc: .netrc credentials file
  for:
  - binaries
  - scripts
  - source
  if:
    type: text
    regex: (^|[\s\/\\\\"']|~[\/\\\\])\.netrc\b
