# Configuration files that carry secrets. Sensitive for what they *contain*,
# not what they are: the same file shape is ordinary config without the
# credential stanza. Holder is the filename.
defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

traits:
  - id: pypirc-credentials-file
    desc: PyPI credentials file path reference
    conf: 0.9
    for: [binaries, scripts, python, java, class, kotlin, c, cpp, go, rust, javascript, typescript]
    if:
      type: string_literal
      substr: .pypirc
    unless:
      - id: metadata/file/catalog/identity/
      - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
      - id: metadata/build/pip::setuptools-package-index
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
      - id: metadata/package/config::sensitive-file-exclusion-list
    downgrade:
      any:
        - id: metadata/build/pip/
  - id: package-manager-credential-path-set
    desc: References netrc, npm, and PyPI credential files
    crit: notable
    conf: 0.94
    for: [shell]
    if:
      type: text
      regex: '\.netrc[\s\S]{0,220}\.npmrc[\s\S]{0,220}\.pypirc'
  - id: composer-auth-file
    desc: Composer auth file path reference
    conf: 0.9
    if:
      type: literal
      regex: '(\.composer|composer)/auth\.json'
  - id: gem-credentials-file
    desc: RubyGems credentials file path reference
    conf: 0.9
    if:
      type: literal
      substr: .gem/credentials
  - id: netrc
    desc: .netrc credentials file
    crit: notable
    # A `.netrc` path reads the same in every language, so this is the single
    # canonical matcher; the file default omits go/rust/js/ts, which is what
    # drove a duplicate copy into objectives/exfiltration/stealer/credential/.
    for: [binaries, scripts, source]
    downgrade:
      any:
        - id: metadata/package/testing/harness/runtime/
        - id: metadata/package/testing/presence/harness/
        - id: metadata/binary/metrics/text-density::shell-high-import-density
    unless:
      - id: micro-behaviors/process/interpreter/vm/
      - id: well-known/tool/detection/sast/
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
      - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
      - id: well-known/tool/detection/agentskillmap/
    if:
      type: text
      regex: (^|[\/\\\\]|~[\/\\\\])\.netrc\b
  - id: npmrc-credentials
    desc: NPM registry credentials file path literal
    crit: notable
    for: [binaries, scripts, python, java, class, kotlin, c, cpp, go, rust, javascript, typescript]
    if:
      type: literal
      regex: (^|[/~\\\\])\.npmrc\b
    unless:
      - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
