defaults:
  platforms: [windows]
  for: [powershell, text]

traits:
  - id: powershell-fragmented-startup-folder
    desc: Constructs a fragmented Startup folder path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)st["'']\s*\+\s*["'']art["'']\s*\+\s*["'']up["'']\s*\+\s*["'']\\'
