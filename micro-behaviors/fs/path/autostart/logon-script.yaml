# Neutral observations and discriminating identities.
defaults:
  platforms:
  - windows
  for:
  - scripts
  - binaries
traits:
- id: group-policy-logon-script-path
  desc: Group Policy logon script path fragment
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: \Group Policy\Scripts\Logon
- id: windows-logon-script-path
  desc: Windows logon script path fragment
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: \Scripts\Logon
- id: policy-system-scripts-path
  desc: Windows policy System Scripts path fragment
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: \Policies\System\Scripts
