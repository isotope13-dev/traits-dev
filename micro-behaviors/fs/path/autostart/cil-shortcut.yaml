defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  # SpecialFolder.Startup is enum value 7. Require the filename-construction
  # sequence, GetFolderPath reference and a .lnk user string, rather than
  # interpreting any isolated ldc.i4.7/call as a Startup-folder lookup.
  - id: cil-startup-shortcut-path-construction
    desc: CIL Startup shortcut path construction
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        import "pe"
        rule cil_startup_shortcut_path_construction {
          strings:
            $path = { 1D 28 ?? ?? ?? 0A 72 ?? ?? ?? 70
                      7E ?? ?? ?? 04 28 ?? ?? ?? 0A
                      72 ?? ?? ?? 70 28 ?? ?? ?? 0A 13 ?? }
            $folder = "GetFolderPath" ascii fullword
            $filename = "GetFileNameWithoutExtension" ascii fullword
            $lnk = ".lnk" wide fullword
          condition:
            for any s in pe.sections : (
              s.name == ".text" and
              for all of them : (
                $ in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
              )
            )
        }
