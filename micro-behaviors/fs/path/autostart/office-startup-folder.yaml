# Office loads every workbook, template or add-in placed in its startup
# folder (Excel XLStart, Word's Startup path). Naming the folder is neutral;
# add-in installers do it too.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  crit: notable
  conf: 0.9
  attack: T1137

traits:
  - id: office-startup-folder-reference
    desc: References an Office startup folder
    if:
      type: text
      regex: '(?i)(\\XLStart\\|\bwdStartupPath\b|\bApplication\.(Alt)?StartupPath\b)'

composite_rules:
  - id: office-global-macro-location
    desc: Targets Office startup folder or templates
    crit: notable
    conf: 0.9
    any:
      - id: office-startup-folder-reference
      - id: micro-behaviors/data/document/open::word-template-iteration
