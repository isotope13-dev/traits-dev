defaults:
  platforms:
  - windows
  for:
  - lnk
traits:
- id: lnk-startup-shortcut-path
  desc: LNK command constructs a Startup shortcut path
  crit: notable
  conf: 0.95
  if:
    type: value
    path: lnk.arguments
    regex: (?i)GetFolderPath\(['"]Startup['"]\)\s*\+\s*['"][^'"\r\n]{1,100}\.lnk
