# Referencing an autostart location is a capability. Persistence objectives
# add evidence of installing, copying, or launching something there.
defaults:
  platforms: [windows]
  for: [binaries, scripts, source, oledoc]
  crit: notable
  conf: 0.85

traits:
  - id: windows-startup-directory
    desc: Windows Start Menu Startup directory reference
    if:
      type: text
      regex: '(?i)Start Menu[/\\]{1,2}(Programs[/\\]{1,2})?Startup\b'

  - id: shell-startup-uri
    desc: Windows shell:startup folder reference
    if:
      type: text
      word: shell:startup
      case_insensitive: true

  - id: go-startup-path-join
    desc: Go constructs a Windows Startup path
    for: [go]
    conf: 0.95
    if:
      type: text
      regex: 'filepath\.Join\([^\r\n]{1,260}["'']Start Menu["''][^\r\n]{1,160}["'']Startup["'']'

composite_rules:
  - id: windows-startup-reference
    desc: References or resolves Windows Startup folder
    any:
      - id: windows-startup-directory
      - id: shell-startup-uri
      - id: go-startup-path-join
