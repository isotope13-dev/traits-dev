defaults:
  platforms: [windows]
  for: [powershell, javascript, typescript, go, html]
traits:
- id: powershell-startup-special-folder
  desc: PowerShell resolves Startup special folder
  crit: notable
  conf: 0.9
  for: [powershell, javascript, typescript]
  if:
    type: text
    regex: '(?i)GetFolderPath\(\s*["'']Startup["'']\s*\)|Environment\+SpecialFolder\]::Startup'
composite_rules:
- id: windows-startup-folder-reference
  desc: References or resolves Windows Startup folder
  crit: notable
  any:
  - id: powershell-startup-special-folder
  - id: micro-behaviors/fs/path/autostart::powershell-startup-csidl-number
  - id: micro-behaviors/fs/path/autostart::windows-startup-reference
  - id: micro-behaviors/fs/path/location::wsh-startup-folder-lookup
