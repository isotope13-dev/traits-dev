defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
traits:
  - id: go-x64-startup-path-component-array
    desc: Go Microsoft/Startup path component array
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        import "pe"
        rule go_six_part_startup_path_setup {
          strings:
            $head = { 48 C7 84 24 [4] 09 00 00 00 48 8D 0D [4] 48 89 8C 24 ?? ?? ?? ?? }
            $tail = { 48 C7 84 24 [4] 07 00 00 00 48 8D 0D [4] 48 89 8C 24 [4] 48 8D 84 24 [4] BB 06 00 00 00 48 89 D9 E8 ?? ?? ?? ?? }
          condition:
            pe.machine == pe.MACHINE_AMD64 and
            for any s in (0..pe.number_of_sections - 1) : (
              pe.sections[s].name == ".text" and
              for any i in (1..#tail) : (
                @tail[i] >= pe.sections[s].raw_data_offset and
                @tail[i] < pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size and
                uint32(pe.rva_to_offset(pe.sections[s].virtual_address + @tail[i] - pe.sections[s].raw_data_offset + 19 + int32(@tail[i] + 15)) + 0) == 0x72617453 and
                        uint16(pe.rva_to_offset(pe.sections[s].virtual_address + @tail[i] - pe.sections[s].raw_data_offset + 19 + int32(@tail[i] + 15)) + 4) == 0x7574 and
                        uint8(pe.rva_to_offset(pe.sections[s].virtual_address + @tail[i] - pe.sections[s].raw_data_offset + 19 + int32(@tail[i] + 15)) + 6) == 0x70 and
                for any j in (1..#head) : (
                  @head[j] < @tail[i] and @tail[i] - @head[j] < 200 and
                  int32(@tail[i] + 4) == int32(@head[j] + 4) + 64 and
                  (uint32(pe.rva_to_offset(pe.sections[s].virtual_address + @head[j] - pe.sections[s].raw_data_offset + 19 + int32(@head[j] + 15)) + 0) == 0x7263694d and uint32((pe.rva_to_offset(pe.sections[s].virtual_address + @head[j] - pe.sections[s].raw_data_offset + 19 + int32(@head[j] + 15)) + 0) + 4) == 0x666f736f) and
                        uint8(pe.rva_to_offset(pe.sections[s].virtual_address + @head[j] - pe.sections[s].raw_data_offset + 19 + int32(@head[j] + 15)) + 8) == 0x74
                )
              )
            )
        }
