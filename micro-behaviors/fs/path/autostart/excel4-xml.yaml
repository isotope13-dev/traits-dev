# A Windows Startup-folder path segment ("\Startup\") in an Excel 4.0
# macrosheet part, tolerating the word being split into concatenated string
# fragments ("\Sta"&"rtup\", escaped as &amp; in the XML). A reference, not
# proof of a write.
defaults:
  for: [xml]
  platforms: [windows]
  conf: 0.9

traits:
  - id: excel4-startup-folder-segment
    desc: XLM text names a Startup folder segment
    crit: notable
    if:
      type: text
      regex: '(?i)\\S("&amp;")?t("&amp;")?a("&amp;")?r("&amp;")?t("&amp;")?u("&amp;")?p\\'
