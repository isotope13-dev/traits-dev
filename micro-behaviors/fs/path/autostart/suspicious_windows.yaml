defaults:
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
  platforms: [windows]
traits:
  - id: startup-executable-path
    desc: Startup-folder executable path reference
    crit: notable
    for: [scripts, binaries, ooxml]
    if:
      type: text
      regex: (?i)Start\s+Menu\\Programs\\Startup\\[^\\]{1,120}\.(exe|vbs|js)
    unless:
      - id: metadata/file/extension/identity::markdown-file-basename
      - id: metadata/file/extension/identity::markdown-powershell-basename
      - id: metadata/package/documentation/
  - id: startup-batch-path
    desc: Startup-folder script path reference
    crit: notable
    for: [scripts, binaries, ooxml]
    if:
      type: text
      regex: (?i)Start\s+Menu\\Programs\\Startup\\[^\\]{1,120}\.bat
    unless:
      - id: well-known/tool/offensive/
composite_rules:
  - id: startup-executable-paths
    desc: Startup-folder executable path cluster
    crit: notable
    conf: 0.8
    for: [scripts, binaries, ooxml]
    any:
      - id: startup-executable-path
      - id: startup-batch-path
