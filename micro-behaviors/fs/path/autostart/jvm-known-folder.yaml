# JVM code resolving Windows shell folders by name: a JNA Shell32
# getFolderPath(...) call with the CSIDL enum constant names STARTUP /
# COMMON_STARTUP (and APP_DATA for the copy target) left in the constant pool.
defaults:
  platforms: [windows]
  for: [class]
  conf: 0.88

traits:
  - id: jvm-shell-folder-path-call
    desc: JVM code calls a Shell32-style getFolderPath
    crit: component
    if:
      type: text
      word: getFolderPath

  - id: jvm-startup-folder-constant
    desc: Constant pool names the Startup shell folder
    crit: component
    if:
      type: text
      regex: '\bCOMMON_STARTUP\b|(^|[^A-Z_])STARTUP($|[^A-Z_])'

  - id: jvm-own-code-location
    desc: JVM code reads its own CodeSource location
    crit: component
    if:
      type: text
      word: getCodeSource

composite_rules:
  - id: jvm-startup-folder-resolution
    desc: JVM code resolves the Windows Startup folder through Shell32
    crit: notable
    all:
      - id: jvm-shell-folder-path-call
      - id: jvm-startup-folder-constant
