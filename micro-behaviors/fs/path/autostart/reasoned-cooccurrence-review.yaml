# References and API co-occurrence do not establish bound data flow.
composite_rules:
- platforms:
  - windows
  id: startup-folder-composition-api-cooccurrence
  desc: Startup path beside shell-folder and path-composition APIs
  crit: notable
  conf: 0.88
  for:
  - pe
  - dll
  all:
  - id: micro-behaviors/fs/path/location::shell-get-folder-path
  - id: micro-behaviors/fs/path/autostart::windows-startup-directory
  any:
  - id: micro-behaviors/fs/path/construct::path-combine
  - id: micro-behaviors/fs/path/construct::path-append
