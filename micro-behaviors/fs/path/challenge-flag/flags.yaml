defaults:
  platforms: [unix]
  for: [javascript]
traits:
  - id: temporary-ctf-flag-path
    desc: Temporary challenge flag path literal
    crit: notable
    conf: 0.99
    if:
      type: string_literal
      exact: /tmp/flag.txt

  - id: container-flag-path
    desc: Container challenge flag path reference
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: /usr/src/app/flag

