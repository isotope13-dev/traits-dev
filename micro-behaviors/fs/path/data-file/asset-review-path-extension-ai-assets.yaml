defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - source
  crit: notable
  conf: 0.88

traits:
  - id: model-extension-reference--checkpoint-or-h5
    desc: Checkpoint or H5 filename suffix
    crit: component
    conf: 0.88
    if:
      type: text
      # `.pb` is deliberately excluded: gnostic and many other tools use it
      # for ordinary Protocol Buffer outputs, not model weights.
      regex: '(?i)(^|[/\\s"''])[\w.-]+\.(ckpt|h5)([/\\s"'']|$)'
  - id: model-extension-reference--onnx-or-pickle
    desc: ONNX or pickle filename suffix
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)(^|[/\\s"''])[\w.-]+\.(onnx|pkl)([/\\s"'']|$)'
  - id: model-extension-reference--pytorch-or-safetensors
    desc: PT or SafeTensors path suffix
    crit: notable
    conf: 0.88
    # .pt can be Portugal's ccTLD; require a local path with a directory.
    # URL schemes and bare hostnames do not satisfy the quoted-path matcher.
    if:
      type: text
      regex: '(?i)["'']([A-Z]:)?[\w.-]*[/\\][\w./\\-]+\.(pt2?|safetensors?)["'']'

  - id: safetensors-file-suffix
    desc: SafeTensors filename suffix literal
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)["''][\w.-]+\.safetensors?["'']'

  - id: checkpoint-extension-after-model-context
    desc: Checkpoint extension after model context
    if:
      type: text
      regex: '(?i)(model|checkpoint|weights?|torch)[^\r\n]{0,40}\.pt(h)?\b'
  - id: checkpoint-extension-before-model-context
    desc: Checkpoint extension before model context
    if:
      type: text
      regex: '(?i)\.pt(h)?\b[^\r\n]{0,40}(model|checkpoint|weights?|torch)'
  - id: vector-index-extension-reference
    desc: Vector index or GGML filename suffix
    if:
      type: text
      # Require a path/filename boundary so dotted member access, namespace
      # text, and ordinary prose ending in `.vec` are not treated as an asset
      # path.  Keep the same filename shape as the other extension atoms.
      #
      # Case-sensitive on purpose: these are on-disk artefact names, which
      # fastText, llama.cpp and FAISS all write in lower case, whereas a
      # capitalised final segment after dots is a class. Under `(?i)` the
      # Clojure class `clojure.core.Vec` — quoted in a docs corpus — was
      # reported as a vector-index file.
      # `.vec` additionally requires a real path separator. fastText writes
      # word vectors to `data/model.vec`, but a bare dotted token ending in
      # `vec` is usually a namespace -- Closure Library's `goog.vec` math
      # package is quoted 5849 times in its own sources.
      regex: '((^|[/\\s"''])[\w.-]{1,40}\.(faiss|ggml|gguf)|[/\\][\w.-]{1,40}\.vec)([/\\s"'']|$)'

  - id: dataset-extension-reference--columnar
    desc: Arrow, DuckDB or Feather filename suffix
    crit: notable
    conf: 0.88
    if:
      type: text
      # A filename/path boundary is required so JavaScript member access such
      # as `middleware.arrow` is not treated as a dataset filename.
      regex: '(?i)[/\\''"`][\w.-]{1,40}\.(arrow|duckdb|feather)([/\\''"`]|$)'
    unless:
      # Prolog module facts such as `scope('C.arrow', ...)` use dotted class
      # identifiers; the `.pl` extension can be misparsed as Perl.
      - id: metadata/lang/source/syntax/directive::prolog-module-directive
  - id: dataset-extension-reference--array
    desc: NumPy array filename suffix
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)[/\\''"`][\w.-]{1,40}\.(npy|npz)([/\\''"`]|$)'
  - id: dataset-extension-reference--record
    desc: Parquet or TFRecord filename suffix
    crit: notable
    conf: 0.88
    if:
      type: text
      # Include the whole token so Go module symbols can be distinguished
      # from filenames rather than matching just their final path component.
      regex: '(?i)([\w.-]+/){0,8}[\w.-]{1,40}\.(parquet|tfrecord)(["''`]|$)'
    not:
      - regex: '^github\.com/'
      - regex: '^application/vnd\.'

