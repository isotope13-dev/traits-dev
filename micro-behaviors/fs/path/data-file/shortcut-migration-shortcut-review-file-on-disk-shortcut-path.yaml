---
defaults:
  platforms:
  - windows
  for:
  - lnk
composite_rules:
- id: lnk-script-host-relative-data-path
  desc: Script-host LNK references a data path
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/process/config/target::lnk-script-host-target
  any:
  - id: micro-behaviors/fs/path/data-file::lnk-relative-data-extension
  - id: micro-behaviors/fs/path/media::lnk-relative-media-extension
  - id: micro-behaviors/fs/path/document::lnk-relative-document-extension
