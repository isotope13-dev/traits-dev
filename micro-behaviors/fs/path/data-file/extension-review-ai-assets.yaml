  # AI/ML file suffixes are filename-format references, not proof that a program
# encrypts or otherwise targets those files.  Ransomware intent is inferred by
# the objective composite that combines these observations with file mutation
# and encryption behavior.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source]
  crit: notable
  conf: 0.88

traits:
  - id: pt-model-load-file-argument
    for: [python, javascript, typescript]
    desc: Loader call names a PT model file
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(load|load_state_dict|load_file)$'
      arg:
        kind: string
        regex: '\.pt2?$'

  # `.pth` is also a Python site-path file.  Require model/checkpoint context
  # before treating it as a PyTorch checkpoint suffix reference.
composite_rules:
  - id: pytorch-checkpoint-extension-reference
    desc: PyTorch checkpoint extension reference
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/data-file::checkpoint-extension-after-model-context
      - id: micro-behaviors/fs/path/data-file::checkpoint-extension-before-model-context
  - id: ai-asset-extension-reference
    desc: Multiple model or dataset filename clues
    crit: notable
    conf: 0.92
    any:
      - id: model-extension-reference
      - id: pytorch-checkpoint-extension-reference
      - id: micro-behaviors/fs/path/data-file::vector-index-extension-reference
      - id: dataset-extension-reference
    needs: 2

  - id: model-extension-reference
    desc: Model loader or model-adjacent filename suffix
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/fs/path/data-file::model-extension-reference--checkpoint-or-h5
      - id: micro-behaviors/fs/path/data-file::model-extension-reference--onnx-or-pickle
      - id: micro-behaviors/fs/path/data-file::model-extension-reference--pytorch-or-safetensors
      - id: pt-model-load-file-argument
      - id: micro-behaviors/fs/path/data-file::safetensors-file-suffix
    for: [python, javascript, typescript]
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index
      # The public suffix list is a dictionary of every TLD on earth, so the
      # `.pt2?` branch matches Portugal's ccTLD entries verbatim — `"net.pt"`,
      # `"gov.pt"` — and reported a cookie-export add-on that bundles psl.js as
      # referencing PyTorch weights. Anything that vendors the PSL (cookie
      # libraries, URL parsers, email validators) hit this the same way.
      - id: well-known/lib/network/public-suffix-list::public-suffix-list-content

  - id: dataset-extension-reference
    desc: Array, record or columnar filename suffix
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/fs/path/data-file::dataset-extension-reference--columnar
      - id: micro-behaviors/fs/path/data-file::dataset-extension-reference--array
      - id: micro-behaviors/fs/path/data-file::dataset-extension-reference--record