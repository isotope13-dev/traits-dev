# Filename-shaped text only; neither encryption nor a payload is established.
defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: payload-data-filename-text
  desc: Payload-prefixed data filename text
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)\bpayload[\w.-]{0,40}\.(bin|dat|enc|db)\b
- id: stage-data-filename-text
  desc: Stage-prefixed data filename text
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)\bstage[\w.-]{0,40}\.(bin|dat|enc|db)\b
composite_rules:
- id: payload-or-stage-data-filename-text
  desc: Payload- or stage-prefixed data filename text
  crit: component
  conf: 0.85
  any:
  - id: payload-data-filename-text
  - id: stage-data-filename-text
