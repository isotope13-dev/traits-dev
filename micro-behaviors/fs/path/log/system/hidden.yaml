defaults:
  platforms: [unix]
  for: [scripts, source]
traits:
  # /var/log holds named service logs; a dotfile there is concealed from
  # administrators browsing the log directory (seen in a TACACS+ injector
  # staging XOR-encoded credential records at /var/log/.tacplus.acct).
  - id: var-log-hidden-path-reference
    desc: References hidden path below /var/log
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '/var/log/\.[^:/\s]{1,40}(/|$)'

