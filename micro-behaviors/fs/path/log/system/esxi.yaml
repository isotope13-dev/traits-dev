# VMware ESXi hypervisor log file paths (/var/log and /var/run/log).
defaults:
  crit: notable
  platforms: [unix]
  for: [scripts, source, elf, macho]

traits:
  - id: esxi-vmkernel-log-path
    desc: VMware ESXi vmkernel log path
    conf: 0.96
    if:
      type: text
      regex: '/var/(run/)?log/vmkernel\.log\b'

  - id: esxi-hostd-vobd-log-path
    desc: ESXi hostd or vobd daemon log path
    conf: 0.95
    if:
      type: text
      regex: '/var/(run/)?log/(hostd|vobd)\.log\b'

  - id: esxi-shell-log-path
    desc: ESXi or Unix shell audit log path
    conf: 0.9
    if:
      type: text
      regex: '/var/(run/)?log/shell\.log\b'

composite_rules:
  - id: esxi-hypervisor-log-path
    desc: References VMware ESXi hypervisor log path
    conf: 0.95
    any:
      - id: esxi-vmkernel-log-path
      - id: esxi-hostd-vobd-log-path

  - id: esxi-multi-hypervisor-logs
    desc: References multiple ESXi hypervisor and shell log paths
    conf: 0.97
    needs: 2
    any:
      - id: esxi-vmkernel-log-path
      - id: esxi-hostd-vobd-log-path
      - id: esxi-shell-log-path
