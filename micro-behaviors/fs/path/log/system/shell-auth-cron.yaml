defaults:
  platforms: [unix, android, ios]
  for: [shell]
traits:
  - id: authentication-log-path-prefix
    desc: Authentication system log path reference
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: /var/log/auth
  - id: cron-log-path-prefix
    desc: Cron system log path reference
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: /var/log/cron
