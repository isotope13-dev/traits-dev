defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85

traits:
- id: postinstall-cloud-init-read
  desc: Postinstall references cloud-init log
  crit: suspicious
  conf: 0.95
  attack: "T1005"
  if:
    type: value
    path: "scripts.postinstall"
    substr: "/var/log/cloud-init-output.log"
