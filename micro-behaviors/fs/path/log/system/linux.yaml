defaults:
  crit: notable
  platforms: [unix]
  for: [scripts, binaries]
traits:
  - id: log-var
    desc: References messages, secure, or auth log
    conf: 0.66
    if:
      type: text
      regex: /var/log/(auth\.log|secure|messages)
  - id: var-log-directory-text
    desc: System log directory text
    conf: 0.82
    for: [binaries]
    if:
      type: text
      regex: '/var/log(/|$)'

  - id: four-var-log-path-references
    desc: Contains four system log path references
    conf: 0.84
    count_min: 4
    if:
      type: text
      regex: '/var/log/[A-Za-z0-9._/*-]+'

  - id: zimbra-log-path
    desc: Zimbra service log path
    conf: 0.98
    for: [text, data]
    if:
      type: text
      exact: /var/log/zimbra.log
