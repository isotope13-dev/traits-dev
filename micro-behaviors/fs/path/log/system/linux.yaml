defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: log-var
    desc: Reference to sensitive Linux log files
    crit: notable
    conf: 0.66
    if:
      type: text
      regex: /var/log/(auth\.log|secure|messages)
  - id: var-log-directory-text
    desc: System log directory text
    crit: notable
    conf: 0.82
    platforms: [unix]
    for: [binaries]
    if:
      type: text
      regex: '/var/log(/|$)'

  - id: multiple-var-log-paths
    desc: References multiple system log paths
    crit: notable
    conf: 0.84
    platforms: [unix]
    count_min: 4
    if:
      type: text
      regex: '/var/log/[A-Za-z0-9._/*-]+'

  - id: zimbra-log-path
    desc: Zimbra service log path
    crit: notable
    conf: 0.98
    platforms: [unix]
    for: [text, data]
    if:
      type: text
      exact: /var/log/zimbra.log
