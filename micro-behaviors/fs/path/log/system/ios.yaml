traits:
  - id: apple-diagnostic-log-path
    desc: Apple crash-report or launchd log path
    crit: notable
    conf: 0.99
    platforms: [ios, macos]
    for: [scripts, source, html, data, macho]
    if:
      type: text
      regex: '/var/(mobile/Library/Logs/CrashReporter/|log/com\.apple\.xpc\.launchd/launchd\.log\b)'
