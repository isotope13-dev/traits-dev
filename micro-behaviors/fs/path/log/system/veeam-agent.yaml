defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, powershell, python, go, rust]
  crit: notable
  conf: 0.98

traits:
  - id: veeam-endpoint-service-log-path
    desc: References the Veeam Endpoint Backup service log
    if:
      type: text
      regex: '(?i)C:[/\\]ProgramData[/\\]Veeam[/\\]Endpoint[/\\]Svc[.]VeeamEndpointBackup[.]log'
