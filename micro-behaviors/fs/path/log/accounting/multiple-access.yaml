defaults:
  platforms: [unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
traits:
  - id: wtmp-log-path-text
    desc: References wtmp login history path
    if:
      type: text
      substr: /var/log/wtmp

  - id: btmp-log-path-text
    desc: References btmp failed-login path
    if:
      type: text
      substr: /var/log/btmp

composite_rules:
  - id: multiple-log-files
    desc: References wtmp and btmp accounting logs
    all:
      - id: wtmp-log-path-text
      - id: btmp-log-path-text
