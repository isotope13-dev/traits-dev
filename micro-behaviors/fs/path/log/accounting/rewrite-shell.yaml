# utmpdump is a legitimate forensic converter. These atoms retain that neutral
# meaning; an evasion objective combines export, transformation, reconstruction,
# and replacement of a live accounting database.
defaults:
  platforms: [unix]
  for: [scripts, source]

traits:
  - id: utmpdump-live-database-export
    desc: Exports live login accounting database
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\butmpdump\s+/var/(log|run)/(utmpx?|wtmpx?|btmp)\b'

  - id: utmpdump-record-rebuild
    desc: Rebuilds binary login accounting records
    crit: notable
    conf: 0.96
    for: [shell, python, javascript, c, cpp, go, rust]
    if:
      type: symbol
      kind: call
      exact: utmpdump
      arg:
        kind: identifier
        name: -r

  - id: login-database-replacement-move
    desc: Moves replacement over login database
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '\bmv\s+\S{1,120}\s+/var/(log|run)/(utmpx?|wtmpx?|btmp)\b'
