# Login-accounting editors that fabricate sessions (rather than only delete
# them) report the inserted record and the record whose fields they replaced.
defaults:
  platforms: [unix]
  for: [elf, macho, c]

traits:
  - id: inserted-login-entry-report
    desc: Reports inserting a user login entry
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\badded\s+user\b.{0,60}\bentry\b'

  - id: replaced-login-entry-report
    desc: Reports replacing a user login entry
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\breplaced\b.{0,40}\bentry\b.{0,40}%s'
