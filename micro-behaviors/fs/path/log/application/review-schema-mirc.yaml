# Configuration-purpose review; matcher and effective scope preserved.
---
defaults:
  for:
  - text
  - mirc
  platforms:
  - windows
traits:
- id: mirc-dot-only-log-directory
  desc: mIRC log directory is a dot-only path
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "(?im)^\\[dirs\\][^\\[]{0,160}^logdir=\\.{3,32}\\\\\\r?$"
