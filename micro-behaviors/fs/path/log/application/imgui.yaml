# Dear ImGui library detection
# Dear ImGui is an immediate-mode GUI library used by ordinary applications,
# game overlays, and developer tools.  Its presence is a library identity, not
# evidence of abuse; objective rules must supply any intent inference.
defaults:
  for: [pe, dll, so]
  platforms: [windows, android]
  crit: component
  conf: 0.95
traits:
  - id: imgui-log-file
    crit: notable
    desc: ImGui debug log file reference
    if:
      type: text
      word: "imgui_log.txt"

