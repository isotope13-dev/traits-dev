defaults:
  platforms: [unix, windows]
  for: [xml, text]
  crit: notable
  conf: 0.95
traits:
  - id: xml-access-log-htdocs-path
    desc: XML access-log setting names htdocs path
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)<accesslog>[^<]{0,200}[/\\]htdocs[/\\][^<]{1,200}</accesslog>'
