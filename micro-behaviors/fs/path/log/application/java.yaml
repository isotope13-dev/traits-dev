# Name references are neutral; the deletion composites require operations.
defaults:
  platforms: [unix, windows]
  for: [java]
  crit: notable
  conf: 0.98
traits:
  - id: java-active-server-log-name
    desc: Java references active server-log filename
    if:
      type: literal
      exact: server.log
  - id: java-rotated-server-log-name
    desc: Java references rotated server-log prefix
    if:
      type: literal
      exact: server.log.
