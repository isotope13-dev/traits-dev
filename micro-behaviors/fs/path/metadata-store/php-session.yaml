defaults:
  platforms: [linux, macos, windows]
  for: [scripts]
traits:
  - id: php-session-file-path
    desc: PHP session file path
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)/var/lib/php/sessions?/sess_[A-Za-z0-9_-]+'
    unless:
      - id: well-known/tool/offensive/bingo/
