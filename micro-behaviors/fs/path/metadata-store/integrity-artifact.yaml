# Filenames reference integrity artifacts; they prove no signing operation.
defaults:
  platforms: [windows, linux, macos]
  for: [shell, scripts, source, github-actions, python, javascript, typescript, ruby, go, rust]
  crit: notable
  conf: 0.95
traits:
  - id: checksum-manifest-filename
    desc: References SHA checksum manifest filename
    if:
      type: literal
      regex: '\bSHA(256|512)SUMS?\b'
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  - id: detached-signature-filename
    desc: References detached signature artifact filename
    if:
      type: literal
      regex: '\b[\w-]+\.\w{1,8}\.(asc|sig)\b'
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
