defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: ntds-database-path-reference
    desc: References the NTDS.dit database path
    crit: notable
    conf: 0.96
    if:
      type: literal
      kind: string
      regex: '(?i)(^|[/\\])ntds\.dit\b'
  - id: ntds-ifm-registry-hive-path
    desc: References an ntdsutil IFM registry hive path
    crit: notable
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(?i)(^|[/\\])registry[/\\]{1,2}(SYSTEM|SECURITY|SAM)$'
