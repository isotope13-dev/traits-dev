# Neutral observations relocated from attack and product-identity rules.
traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  id: windows-ntds-database-path-text
  desc: References a Windows NTDS database path
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: (?i)Windows[/\\]NTDS[/\\]ntds\.dit\b
