defaults:
  platforms: [unix]
  for: [javascript, typescript]

traits:
  - id: node-passwd-path-reference
    desc: JavaScript references the passwd database path
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: /etc/passwd
  - id: node-shadow-path-reference
    desc: JavaScript references the shadow database path
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: /etc/shadow
