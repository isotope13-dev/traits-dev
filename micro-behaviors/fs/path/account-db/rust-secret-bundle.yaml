defaults:
  platforms: [routeros, appliance, unix]
  for: [rust, elf]
  attack: T1041

traits:
  - id: rust-unix-secret-path-bundle
    desc: Rust Unix secret path bundle
    crit: suspicious
    conf: 0.9
    unless:
      - id: metadata/package/testing/harness/unit::rust-test
      - id: metadata/package/testing/presence/harness::test-directory
    if:
      type: text
      regex: '/etc/shadow[\s\S]{0,260}/root/\.ssh/(id_rsa|authorized_keys)'
