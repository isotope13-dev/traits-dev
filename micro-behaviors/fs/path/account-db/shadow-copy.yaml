# A snapshot credential-store path is unusual, but a reference alone does not
# establish copying or acquisition. Keep it separate from source-bound copy
# operations and their credential-access composites.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
traits:
  - id: shadow-copy-ntds-database-path
    desc: References an NTDS database snapshot path
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)HarddiskVolumeShadowCopy\d+[\\/]+Windows[\\/]+NTDS[\\/]+NTDS\.dit\b'
