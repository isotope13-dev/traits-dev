# System account databases: the OS's own record of users and password hashes.
defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

traits:
  - id: credential-config-path-corpus--config
    desc: Config account database path
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(^|["''])/[^"'']{0,60}/Config/(accounts?|passwd)([./"'']|$)'
      case_insensitive: true
  - id: credential-config-path-corpus--etc
    desc: Etc account database path
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(^|["''])/[^"'']{0,60}/etc/(accounts?|passwd)([./"'']|$)'
      case_insensitive: true
  - id: unix-shadow-root-ssh-paths
    desc: Unix shadow and root SSH paths
    crit: suspicious
    unless:
    - id: well-known/lib/ai/unsloth::unsloth-package-context
    - id: metadata/package/testing/presence/harness::test-directory
    - id: well-known/tool/offensive/pentestkit/
    - id: well-known/tool/offensive/sqlmap::source-tree-member
    # Go unit tests for archive traversal deliberately use credential paths as
    # rejected ZIP-entry fixtures; this is not credential access.
    - id: metadata/package/testing/harness/unit::go-test
    # Agent Security Harness keeps these paths as MCP traversal test vectors;
    # the harness does not read them.
    - id: well-known/tool/detection/agent-security-harness::mcp-traversal-fixture-context
    - id: well-known/tool/offensive/mcpsec/
    conf: 0.92
    platforms: [unix]
    for: [source, scripts, binaries]
    if:
      type: text
      regex: '/etc/shadow[\s\S]{0,260}/root/\.ssh/id_rsa'
