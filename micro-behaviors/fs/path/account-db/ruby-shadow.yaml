# A parsed path constant is a reference, not a scan or an OpenBSD identity.
defaults:
  platforms: [unix]
  for: [ruby]
  crit: notable
traits:
  - id: ruby-shadow-path-literal
    desc: Ruby literal references /etc/shadow
    conf: 0.97
    if:
      type: literal
      kind: string
      exact: /etc/shadow
