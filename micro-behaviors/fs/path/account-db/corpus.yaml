# System account databases.

defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

composite_rules:
  - id: credential-config-path-corpus
    desc: Multiple account database paths
    crit: notable
    conf: 0.85
    any:
      - id: credential-config-path-corpus--config
      - id: credential-config-path-corpus--etc
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
