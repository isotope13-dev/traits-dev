# System account databases.

defaults:
  platforms: [unix]
  for: [elf, macho, shell, python, perl, ruby, text]
  crit: component
  conf: 0.8

traits:
  - id: etc-passwd-path-literal
    crit: baseline
    desc: References the account database
    # Component and deliberately weightless on its own: Go's os/user reads
    # /etc/passwd, so this string sits in the standard library and appears in
    # every Go binary, including the corpus's do-nothing fixtures.
    if:
      type: text
      exact: /etc/passwd
