# System account databases.

# Rationale carried over with these traits:
# Neutral path references to the Unix account and key material locations.
# Intent belongs to objectives/collection/file-targeting/identity-set, which
# requires several of these together.

defaults:
  platforms: [unix]
  for: [elf, macho, shell, python, perl, ruby, text]
  crit: component
  conf: 0.8

traits:
  - id: etc-passwd-path-literal
    crit: baseline
    desc: References the account database
# Component and deliberately weightless on its own: Go's os/user reads
# /etc/passwd, so this string sits in the standard library and appears in
# every Go binary, including the corpus's do-nothing fixtures.
    if:
      type: text
      exact: /etc/passwd
  # The analysed file's own path ends at the account database, as a member
  # of a rootfs archive or a tree being staged for one. The backup copy a
  # device restores from (`passwd_original`, or the classic `passwd-`)
  # is a separate member with its own recovery role.
  - id: etc-passwd-file-path
    desc: File path is an etc/passwd database
    crit: notable
    conf: 0.97
    for: [text, data]
    if:
      type: path
      regex: '(^|/)etc/passwd$'
  - id: etc-passwd-backup-file-path
    desc: File path is a passwd backup database
    crit: notable
    conf: 0.97
    for: [text, data]
    if:
      type: path
      regex: '(^|/)etc/passwd(_original|-)$'
  # The same members seen through an archive's member index. A passwd
  # member's content is typed as opaque data and may never become an
  # analysed file of its own, so the member path is the durable fact.
  - id: archive-etc-passwd-member
    desc: Archive member is an etc/passwd database
    crit: notable
    conf: 0.97
    for: [tar, zip, 7z, cpio]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|[^A-Za-z0-9_.-])etc/passwd$'
  - id: archive-etc-passwd-backup-member
    desc: Archive member is a passwd backup database
    crit: notable
    conf: 0.97
    for: [tar, zip, 7z, cpio]
    if:
      type: value
      path: "archive.members[*].path"
      regex: '(^|[^A-Za-z0-9_.-])etc/passwd(_original|-)$'
  # A passwd-format entry (name:passwd:0:0:gecos:home:shell) granting uid 0
  # to a name other than root, with a general login shell. Factory account
  # databases do ship such entries, so the entry alone stays notable;
  # objectives supply the implant reading. `toor` is BSD's shipped
  # alternate-root account, disabled by its password field.
  - id: passwd-entry-uid-zero-shell-account-text
    desc: Passwd entry grants UID 0 shell
    crit: notable
    conf: 0.94
    for: [shell, python, javascript, text, data]
    if:
      type: text
      regex: '(?m)(^|["''])\w[\w-]{0,30}:[^:\n]{0,120}:0:0:[^:\n]{0,40}:[^:\n]{0,40}:/(usr/)?s?bin/\w*sh'
      not:
        - regex: '(^|["''])(root|toor):[^:\n]{0,40}:0:0:'
  # Inside an uncompressed tar the entry sits in member bytes the string
  # extractor never surfaces, so the same entry is matched on raw bytes.
  - id: passwd-entry-uid-zero-shell-account-raw
    desc: Passwd entry grants UID 0 shell
    crit: notable
    conf: 0.94
    for: [tar]
    if:
      type: raw
      regex: '(?m)(^|["''])\w[\w-]{0,30}:[^:\n]{0,120}:0:0:[^:\n]{0,40}:[^:\n]{0,40}:/(usr/)?s?bin/\w*sh'
      not:
        - regex: '(^|["''])(root|toor):[^:\n]{0,40}:0:0:'
  # Installer branches keyed on an upload filename use the extension as
  # the selector, so a `.passwd` name identifies an account-database
  # payload the same way a format-mandated name identifies its format.
  - id: passwd-extension-basename
    desc: Filename uses the .passwd extension
    crit: notable
    conf: 0.97
    for: [text, data]
    if:
      type: basename
      regex: '\.passwd$'

composite_rules:
  - id: passwd-entry-uid-zero-shell-account
    desc: Passwd entry grants UID 0 shell
    crit: notable
    conf: 0.94
    for: [shell, python, javascript, text, data, tar]
    any:
      - id: passwd-entry-uid-zero-shell-account-text
      - id: passwd-entry-uid-zero-shell-account-raw
