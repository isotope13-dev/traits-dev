defaults:
  crit: component
  platforms: [windows, linux, macos]
  for: [scripts, binaries, csharp]
composite_rules:
  - id: steam-account-config-references
    desc: Steam account and configuration file references
    conf: 0.8
    all:
      - id: micro-behaviors/fs/path/account-db::steam-loginusers-file
      - id: micro-behaviors/fs/path/config/app::steam-config-file
    unless:
      - id: well-known/game/steamtools::member
