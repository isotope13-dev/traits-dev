# Ordered text references to account databases and crontab.
# Presence does not establish reads, copying, staging, or data flow.
traits:
- platforms:
  - unix
  for:
  - javascript
  - typescript
  id: js-account-and-cron-path-text-cluster
  desc: JS account/cron path-text cluster
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: /etc/passwd[\s\S]{0,220}/etc/shadow[\s\S]{0,220}/etc/crontab
