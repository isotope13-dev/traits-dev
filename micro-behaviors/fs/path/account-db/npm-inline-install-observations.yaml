defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85
  attack: T1005

traits:
- id: postinstall-host-root-file-probes
  desc: Postinstall host account or hostname paths
  crit: suspicious
  conf: 0.97
  if:
    type: value
    path: "scripts.postinstall"
    regex: '/host/etc/(hostname|shadow|passwd)\b'
- id: postinstall-host-shadow-file-read
  desc: Postinstall references host shadow path
  crit: suspicious
  conf: 0.98
  if:
    type: value
    path: "scripts.postinstall"
    regex: '/host/etc/shadow\b'
- id: postinstall-local-shadow-file-read
  desc: Postinstall references local shadow path
  crit: suspicious
  conf: 0.98
  if:
    type: value
    path: "scripts.postinstall"
    regex: '(^|[^[:alnum:]_])/etc/shadow\b'
