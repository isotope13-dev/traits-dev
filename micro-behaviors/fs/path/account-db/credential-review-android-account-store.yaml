defaults:
  platforms: [android, unix]
  for: [dex, elf, java, kotlin, text]
  crit: notable
  conf: 0.98
traits:
  - id: android-account-store-path
    desc: Android account database path reference
    if:
      type: text
      regex: '/data/system(_[cd]e/[0-9]+/accounts_[cd]e|/users/[0-9]+/accounts)\.db'
