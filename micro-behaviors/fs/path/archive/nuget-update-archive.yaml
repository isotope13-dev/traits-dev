defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: versioned-nuget-update-archive-reference
    desc: Versioned full or delta NuGet archive filename
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '[A-Za-z0-9_.-]+-[0-9][A-Za-z0-9_.-]*-(full|delta)\.nupkg'
      section: rdata
