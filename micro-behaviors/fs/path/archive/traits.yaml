defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]

traits:
  - id: windows-archive-path
    desc: Windows archive file path
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\b[A-Za-z]:[\\/][^"\r\n]{1,180}\.(zip|7z|rar)\b'

  - id: unix-temp-archive-path
    desc: Unix temporary archive path
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)["''`=[:space:]][\\/](tmp|temp)[\\/][^"\r\n]{1,180}\.(zip|7z|rar)\b'
