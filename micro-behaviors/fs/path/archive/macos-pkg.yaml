defaults:
  platforms: [macos]
  for: [macho, objc, swift, shell, applescript]

traits:
  - id: pkg-filename-reference
    desc: References a macOS package filename
    crit: component
    conf: 0.8
    if:
      type: text
      # Require a standalone flat-package filename, not wildcard extension
      # lists (`*.pkg`) or concatenated format names (`.dmg.pkg.deb`).
      regex: '(^|[/\s=\x22\x27])[A-Za-z0-9][^/\s\x22\x27?&#]{0,20}\.pkg($|[\s\x22\x27?&#,;)])'
