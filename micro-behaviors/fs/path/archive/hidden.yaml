defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: hidden-archive-path
    desc: References a hidden archive pathname
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      # The extension must end the token: without the trailing boundary,
      # ordinary property access such as `.target.target` reads as `.tar`.
      regex: \/\.[^.].{0,20}\.(tar|gz|zip)($|[^A-Za-z0-9])
