---
defaults:
  platforms:
  - macos
composite_rules:
- id: macos-package-temp-path-reference
  desc: macOS package filename and temporary path references
  crit: notable
  conf: 0.8
  all:
  - id: micro-behaviors/fs/path/archive::pkg-filename-reference
  any:
  - id: micro-behaviors/fs/path/temporary-artifact::macos-package-archive-path
  - id: micro-behaviors/fs/path/temp::unix-temp
  - id: micro-behaviors/fs/path/temp::unix-var-temp
  for:
  - macho
  - objc
  - swift
  - shell
  - applescript
