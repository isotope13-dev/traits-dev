defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: bare-cab-filename-string
    desc: String is a bare .cab filename
    crit: notable
    conf: 0.8
    if:
      type: text
      # A whole string that is only a file name ending in .cab, no directory:
      # the companion file is expected beside the binary.
      regex: '^[A-Za-z][A-Za-z0-9_-]{2,30}\.cab$'
