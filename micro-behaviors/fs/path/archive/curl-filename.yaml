# Filename reference only: an archive can be uploaded or downloaded.
defaults:
  platforms: [windows, unix]
traits:
  - id: curl-archive-update-filename
    desc: curl archive or update filename reference
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html, markdown, shell, powershell, batch]
    if:
      type: text
      regex: '(?i)\bcurl\b.{0,260}\.(zip|update|7z|rar)\b'
