# Sensitive configuration artifacts created by local AI agents. These path
# atoms do not assert collection intent; objective composites combine them
# with file reads and cross-vendor targeting.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source, javascript, typescript, python, powershell, shell, go, rust, c, cpp]
  crit: notable
  conf: 0.94
  attack: T1552.001

traits:
  - id: claude-root-config-artifact-path
    desc: Claude Code root configuration artifact path
    if:
      type: text
      regex: '(?i)(^|[~\\/])\.claude\.json\b'

  - id: codex-sensitive-config-artifact-path
    desc: Codex sensitive configuration artifact path
    if:
      type: text
      regex: '(?i)\.codex[/\\](config\.toml|\.env)\b'

  - id: copilot-config-artifact-path
    desc: GitHub Copilot configuration artifact path
    if:
      type: text
      regex: '(?i)\.copilot[/\\]config\.json\b'

  - id: gemini-sensitive-config-artifact-path
    desc: Gemini CLI sensitive configuration artifact path
    if:
      type: text
      regex: '(?i)\.gemini[/\\](config\.json|\.env)\b'
