# Session and chat stores created by local AI agents.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source, javascript, typescript, python, powershell, shell, go, rust, c, cpp]
  crit: notable
  conf: 0.94
  attack: T1005

traits:
  - id: codex-session-artifact-path
    desc: Codex session or history artifact path
    if:
      type: text
      regex: '(?i)\.codex[/\\](sessions|archived_sessions|session_index\.jsonl|history\.jsonl)\b'

  - id: claude-session-artifact-path
    desc: Claude Code session or project artifact path
    if:
      type: text
      regex: '(?i)\.claude[/\\](sessions|projects|history\.jsonl)\b'

  - id: cursor-chat-store-artifact-path
    desc: Cursor chat SQLite store path
    if:
      type: text
      regex: '(?i)\.cursor[/\\]chats[/\\].{0,80}store\.db\b'

  - id: cursor-global-storage-artifact-path
    desc: Cursor global state store path
    if:
      type: text
      regex: '(?i)Cursor[/\\]User[/\\]globalStorage[/\\](state\.vscdb|storage\.json)\b'

  - id: antigravity-session-store-artifact-path
    desc: Antigravity CLI conversation store path
    if:
      type: text
      regex: '(?i)\.gemini[/\\]antigravity-cli[/\\](conversations|conversation_summaries\.db)\b'

  - id: copilot-session-store-artifact-path
    desc: Copilot CLI session-state store path
    if:
      type: text
      regex: '(?i)\.copilot[/\\]session-state\b'

  - id: opencode-chat-store-artifact-path
    desc: opencode chat SQLite store path
    if:
      type: text
      regex: '(?i)opencode[/\\]opencode\.db\b'

  - id: codex-state-database-artifact-path
    desc: Codex state database path
    if:
      type: text
      regex: '(?i)state_5\.sqlite\b'

  - id: codex-rollout-transcript-artifact-path
    desc: Codex rollout transcript path
    if:
      type: text
      regex: '(?i)rollout-.{0,64}\.jsonl'

  - id: cline-task-transcript-artifact-path
    desc: Cline-family task transcript path
    if:
      type: text
      regex: '(?i)(ui_messages|cline_messages)\.json\b'

  - id: aider-chat-history-artifact-path
    desc: Aider chat history path
    if:
      type: text
      regex: '(?i)\.aider\.chat\.history\.md\b'

  - id: kimi-wire-transcript-artifact-path
    desc: Kimi wire transcript path
    if:
      type: text
      regex: '(?i)sessions[/\\].{0,80}wire\.jsonl'

  - id: continue-usage-transcript-artifact-path
    desc: Continue usage transcript path
    if:
      type: text
      regex: '(?i)(tokensGenerated|tokens_generated)\.jsonl'

  - id: gemini-chat-transcript-artifact-path
    desc: Gemini CLI chat transcript path
    if:
      type: text
      regex: '(?i)[/\\]chats[/\\]session-[\w*.-]+\.jsonl?'

  - id: openclaw-checkpoint-transcript-artifact-path
    desc: OpenClaw checkpoint transcript path
    if:
      type: text
      regex: '(?i)\.checkpoint\..{1,24}\.jsonl'
