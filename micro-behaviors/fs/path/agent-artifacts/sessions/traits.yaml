# Session and chat stores created by local AI agents.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source, javascript, typescript, python, powershell, shell, go, rust, c, cpp]
  crit: notable
  conf: 0.94
  attack: T1005

traits:
  - id: codex-session-artifact-path
    desc: Codex session or history artifact path
    if:
      type: text
      regex: '(?i)\.codex[/\\](sessions|archived_sessions|session_index\.jsonl|history\.jsonl)\b'

  - id: claude-session-artifact-path
    desc: Claude Code session or project artifact path
    if:
      type: text
      regex: '(?i)\.claude[/\\](sessions|projects|history\.jsonl)\b'

  - id: cursor-chat-store-artifact-path
    desc: Cursor chat SQLite store path
    if:
      type: text
      regex: '(?i)\.cursor[/\\]chats[/\\].{0,80}store\.db\b'

  - id: antigravity-session-store-artifact-path
    desc: Antigravity CLI conversation store path
    if:
      type: text
      regex: '(?i)\.gemini[/\\]antigravity-cli[/\\](conversations|conversation_summaries\.db)\b'
