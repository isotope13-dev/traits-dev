# Node.js Path Manipulation Capabilities
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: path-join-dirname
    desc: path.join with __dirname
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: 'path\.join\s*\(\s*__dirname'
  # A parent step followed by a hidden dot-directory (the bundled-payload
  # staging shape: go up from the package, then into ".name"). No unbounded
  # gap: the two adjacent string literals are the whole matcher.
  - id: node-hidden-exec-dir-join
    desc: Node parent step into hidden dir
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '"\.\."\s*,\s*"\.[A-Za-z][\w-]*"'
  # The counterpart to path-join-dirname. `__dirname` roots a path in the
  # module's OWN directory; `process.cwd()` and npm's `INIT_CWD` root it in the
  # directory the tool was invoked from, which during a dependency install is
  # the consumer's checkout rather than the package's folder in node_modules.
  # Constructing a path there is the boundary crossing, and is what separates a
  # build step writing its own output from a script reaching into someone
  # else's tree -- so it is worth seeing on its own in a diff. Intent is left
  # to the composites that pair it with a write and an install trigger.
  - id: invocation-root-path-join
    desc: Builds a path under the invocation directory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(join|resolve)\s*\(\s*(process\.cwd\(\)|process\.env\.INIT_CWD)'

  - id: esm-module-directory-path
    desc: Derives the current ESM module directory
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: 'path\.dirname\s*\(\s*fileURLToPath\s*\(\s*import\.meta\.url\s*\)\s*\)'
  - id: dirname-template-ref
    desc: Template literal references __dirname
    crit: baseline
    conf: 0.7
    size_max: 1000000
    if:
      type: text
      regex: '\$\{?__dirname\}?'
  - id: local-script-path
    desc: Local script path reference
    crit: baseline
    conf: 0.7
    if:
      type: text
      regex: '__dirname.{0,50}\.(js|mjs|cjs)[''"]'
  - id: node-package-manager-shim-name
    desc: Node package-manager filename in path.join
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: path.join
      arg:
        kind: string
        regex: '^(npm|npx|pnpm|yarn|node|git|python|pip)$'
  - id: parent-directory-path-join
    desc: Node path.join includes parent-directory segment
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: path.join
      arg:
        kind: string
        substr: ".."
  - id: script-dirname-ref
    desc: References script directory path
    crit: notable
    conf: 0.6
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/presence/manifest::test-fixtures
    if:
      type: text
      substr: __dirname

  - id: path-basename-call
    desc: Extracts final path component
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: path.basename

  - id: node-modules-database-path-reference
    desc: Node path references dotfile DB in node_modules
    crit: notable
    conf: 0.94
    # The trailing segment must itself be a quoted dot-prefixed name (".cache",
    # ".package-lock.json"). Matching a bare `\.<ext>"` instead made ordinary
    # module resolution (`join(cwd,"node_modules",pkg,"dist","index.ts")`)
    # look like a dotfile database reference.
    if:
      type: text
      regex: 'process\.cwd\(\)[\s\S]{0,99}["'']node_modules["''][\s\S]{0,99}["'']\.[\w-]{1,12}["'']'

  - id: node-modules-package-data-path-reference
    desc: Node path references package data file
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'process\.cwd\(\)[\s\S]{0,120}["'']node_modules["''][\s\S]{0,180}["''][A-Za-z0-9_.-]{1,80}["'']'

  - id: dependency-library-javascript-path
    desc: Constructs a dependency library JavaScript path
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'path\.join\([^;\n]{0,80}["'']lib["''][^;\n]{0,80}["''][^"'']{1,80}\.js["'']'

composite_rules:
  - id: javascript-local-path
    desc: JavaScript constructs a local script path
    crit: baseline
    conf: 0.7
    any:
      - id: local-script-path
      - id: path-join-dirname
  - id: node-module-relative-path
    desc: Node constructs a path relative to its module
    crit: baseline
    conf: 0.9
    any:
      - id: path-join-dirname
      - id: esm-module-directory-path
