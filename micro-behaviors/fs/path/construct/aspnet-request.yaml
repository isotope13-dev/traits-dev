# Request-selected paths. Without a parsed C# data flow these rules require
# the request read to sit directly in, or immediately before, the path check.
defaults:
  platforms: [windows]
  for: [asp, csharp]
  crit: notable

traits:
  - id: aspnet-request-value-path-check
    desc: Request value precedes a path existence check
    conf: 0.9
    if:
      type: text
      exclude_html_comments: true
      regex: '(?is)=\s*Request\b[^;\[]{0,12}\[[^\]]{1,60}\]\s*;.{0,300}\b(File|Directory)\.Exists\s*\('
  - id: aspnet-request-path-check-direct
    desc: Path existence check reads request value
    conf: 0.94
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\b(File|Directory)\.Exists\s*\(\s*Request\b[^;\[)]{0,12}\['
