# Neutral observations and discriminating identities.
traits:
- crit: notable
  conf: 0.9
  id: powershell-join-path-executable
  desc: PowerShell joins path to executable filename
  for: [powershell]
  if:
    type: text
    regex: '(?i)\bJoin-Path\s+\$[A-Za-z_][A-Za-z0-9_]*\s+["''][^"'']{1,80}\.exe["'']'
- crit: notable
  conf: 0.92
  id: js-concatenated-exe-path
  desc: Concatenates string fragments into EXE path
  for: [html, javascript]
  if:
    type: text
    regex: '(?i)["''][^"''\r\n]{1,40}["'']\s*\+\s*["''][^"''\r\n]{1,40}(\.e["'']\s*\+\s*["'']xe|\.exe)["'']'
- crit: notable
  conf: 0.96
  id: node-executable-path-join
  desc: Node joins executable filename into path
  if:
    type: symbol
    kind: call
    exact: path.join
    arg:
      from:
        whole_value: \.(exe|dll)$
composite_rules:
- crit: notable
  conf: 0.96
  id: node-appdata-near-executable-path-join
  desc: AppData reference near executable path join
  near_bytes: 400
  all:
  - id: micro-behaviors/fs/path/construct::node-executable-path-join
  any:
  - id: micro-behaviors/os/env/path::node-appdata-access
  - id: micro-behaviors/os/env/path::node-localappdata-access
defaults:
  for:
  - javascript
  - typescript
  platforms:
  - windows
