# Neutral observations and discriminating identities.
traits:
- crit: notable
  conf: 0.96
  id: node-executable-path-join
  desc: Node joins executable filename into path
  if:
    type: symbol
    kind: call
    exact: path.join
    arg:
      from:
        whole_value: \.(exe|dll)$
composite_rules:
- crit: notable
  conf: 0.96
  id: node-appdata-near-executable-path-join
  desc: AppData reference near executable path join
  near_bytes: 400
  all:
  - id: micro-behaviors/os/env/user-paths::node-appdata-access
  - id: micro-behaviors/fs/path/construct::node-executable-path-join
defaults:
  for:
  - javascript
  - typescript
  platforms:
  - windows
