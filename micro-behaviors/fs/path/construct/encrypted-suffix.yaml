defaults:
  platforms: [windows, unix]
  for: [source, scripts]

traits:
  # `.enc` alone is intentionally weak and common. This matcher requires Java
  # code to derive a new sibling path from an existing File path, which is the
  # concrete filesystem operation used by Android lockers.
  - id: java-dot-enc-sibling-path
    desc: Java builds .enc sibling path
    crit: notable
    conf: 0.94
    platforms: [windows, unix, android]
    for: [java, kotlin]
    if:
      type: text
      regex: '(getAbsolutePath|getPath)\(\)\s*\+\s*["'']\.enc["'']'

  - id: kotlin-dot-enc-sibling-path
    desc: Kotlin builds .enc sibling path
    crit: notable
    conf: 0.94
    platforms: [windows, unix, android]
    for: [kotlin]
    if:
      type: text
      regex: '\.(absolutePath|path)\s*\+\s*["'']\.enc["'']'

  - id: encrypted-suffix-path-construction
    desc: Constructs path with encrypted suffix
    crit: notable
    conf: 0.94
    if:
      type: text
      case_insensitive: true
      regex: '\b(with[_-]?(name|suffix))\s*\([^;\n]{0,160}["''`]\.(encrypted|locked|crypt|encrt)["''`]'

composite_rules:
  - id: jvm-dot-enc-sibling-path
    desc: JVM builds .enc sibling path
    crit: notable
    conf: 0.94
    platforms: [windows, unix, android]
    for: [java, kotlin]
    any:
      - id: java-dot-enc-sibling-path
      - id: kotlin-dot-enc-sibling-path
