defaults:
  platforms: [windows, unix]
composite_rules:
- id: named-sidecar-path-or-launch
  desc: Sidecar name with path or launch clues
  crit: suspicious
  conf: 0.97
  for: [javascript]
  # Do not require near_bytes: obfuscated loaders declare the payload name
  # at module scope and exec it hundreds of lines later after the download.
  all:
  - id: micro-behaviors/fs/path/script::named-javascript-sidecar-reference
  any:
  - id: micro-behaviors/fs/path/construct::node-join-script-directory
  - id: micro-behaviors/process/create/variable::js-execfilesync-resolved-program
