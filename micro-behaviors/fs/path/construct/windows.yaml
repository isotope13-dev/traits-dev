# Windows path construction primitives
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: msi-path-token-host-bootstrap-arguments
    desc: Passes installer path and bootstrap fields
    for: [oledoc]
    crit: notable
    conf: 0.99
    attack: T1219
    if:
      type: hex
      pattern: "62 6F 6F 74 73 74 72 61 70 20 2D 2D 69 6E 73 74 61 6C 6C 2D 64 61 74 61 20 22 5B 4F 72 69 67 69 6E 61 6C 44 61 74 61 62 61 73 65 5D 7C 5B 42 4F 4F 54 53 54 52 41 50 5F 54 4F 4B 45 4E 5D 7C 5B 53 45 52 56 45 52 5F 55 52 4C 5D 22"

  - id: path-combine
    desc: Combine filesystem paths via Shlwapi
    crit: baseline
    conf: 0.78
    if:
      type: symbol
      exact: "PathCombineW"
  - id: path-append
    desc: Append child path via Shlwapi
    crit: baseline
    conf: 0.78
    if:
      type: symbol
      exact: "PathAppendW"
  - id: search-path-api
    desc: Search executable path via Windows API
    crit: notable
    conf: 0.9
    if:
      type: symbol
      regex: '^SearchPath[AW]$'
  - id: windows-system-path-join-format
    desc: Windows path join format string
    crit: component
    conf: 0.95
    if:
      type: hex
      section: data
      pattern: '25 73 5C 25 73'
  - id: sprintf-format-api
    desc: sprintf string formatting API
    crit: baseline
    conf: 0.82
    if:
      type: symbol
      exact: "sprintf"
composite_rules:
  - id: construct-system-path
    desc: Construct system path from components
    crit: notable
    conf: 0.9
    all:
      - id: windows-system-path-join-format
      - id: sprintf-format-api
      - id: micro-behaviors/os/sysinfo/directories::get-system-directory
