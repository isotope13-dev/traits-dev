# Python path construction
defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-cwd-variable-path-join
    desc: Joins current directory with a variable path
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      regex: '\bos\.path\.join\s*\(\s*os\.getcwd\s*\(\s*\)\s*,\s*[A-Za-z_]\w*\s*\)'
  # A shell script addressed relative to a directory the program computed at
  # runtime, rather than a fixed system path: `pkg_dir / "start.sh"` or
  # `os.path.join(base, "run.sh")`. Neutral by itself -- build helpers do this
  # -- and it is the payload-location half of composites that also observe the
  # script being armed and launched.
  - id: python-slash-operator-shell-script
    desc: Pathlib builds a shell-script path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\w\s*/\s*["''][^"''/\n]{1,48}\.sh["'']'
  - id: python-path-join-shell-script
    desc: os.path.join builds a shell-script path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'os\.path\.join\s*\([^)\n]{1,64}["''][^"''/\n]{1,48}\.sh["'']'
composite_rules:
  - id: python-variable-dir-shell-script
    desc: Shell-script path under a computed dir
    crit: notable
    conf: 0.9
    any:
      - id: python-slash-operator-shell-script
      - id: python-path-join-shell-script
