defaults:
  platforms: [unix, windows]
  for: [python, go, csharp, javascript, typescript]

traits:
  - id: source-path-builder-call
    desc: Calls a source path-building function
    crit: baseline
    conf: 0.86
    if:
      # filepath.Join, os.path.join, path.join, and Path.Combine all expose a
      # final call target with one of these two names.
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(join|combine)$'
