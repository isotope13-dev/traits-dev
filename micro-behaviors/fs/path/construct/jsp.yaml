defaults:
  platforms: [unix, windows]
  for: [jsp]
traits:
- id: jsp-webroot-request-path-source
  desc: JSP builds a request-selected webroot path
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '(?is)application\s*\.\s*getRealPath\s*\([^)]{0,100}\)\s*\+\s*request\s*\.\s*getParameter'
