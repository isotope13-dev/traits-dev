defaults:
  crit: notable
  platforms: [windows, unix]
  for: [php]

traits:
  # Relocated from objectives/.../webshell/stager (php-file-manager-encoded-
  # paths). Defining a path encoder is a neutral helper; the file-manager
  # webshell composite supplies the intent from its upload/delete legs.
  # The `$` parameter keeps it PHP: without it the JavaScript `encodePath(e)`
  # helper in bundled source maps matched.
  - id: php-encode-path-function
    desc: Defines a PHP encodePath/decodePath function
    conf: 0.92
    for: [php, html, data, text]
    if:
      type: text
      regex: function\s+(en|de)codePath\s*\(\s*\$.{0,80}\)

  - id: php-escaped-sibling-path-prefix
    desc: PHP builds escaped sibling path
    conf: 0.97
    if:
      type: text
      regex: '__DIR__\s*\.\s*["'']\\(57|x2[fF])'

  - id: realpath-call
    desc: Resolves canonical filesystem path
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: realpath

composite_rules:
  - id: php-obfuscated-sibling-script-path
    desc: Obfuscated sibling PHP script path
    conf: 0.97
    near_bytes: 160
    all:
      - id: php-escaped-sibling-path-prefix
      - id: micro-behaviors/fs/path/script::php-script-path-suffix
