defaults:
  platforms: [windows, unix]
  for: [php]

traits:
  - id: php-escaped-sibling-path-prefix
    desc: PHP builds escaped sibling path
    crit: component
    conf: 0.97
    if:
      type: text
      regex: '__DIR__\s*\.\s*["'']\\(57|x2[fF])'

  - id: php-script-path-suffix
    desc: PHP script path suffix
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(\.|\\(56|x2[eE]))(p|\\(160|x70))(h|\\(150|x68))(p|\\(160|x70))["'']'

  - id: realpath-call
    desc: Resolves canonical filesystem path
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: realpath

composite_rules:
  - id: php-obfuscated-sibling-script-path
    desc: Obfuscated sibling PHP script path
    crit: notable
    conf: 0.97
    near_bytes: 160
    all:
      - id: php-escaped-sibling-path-prefix
      - id: php-script-path-suffix
