---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - javascript
  - typescript
  id: node-join-plugins-directory
  desc: Joins path containing plugins directory
  conf: 0.94
  if:
    type: text
    regex: join\([^)]{0,120}["']plugins["']
- id: node-join-script-directory
  desc: Joins path with scriptDir identifier
  conf: 0.88
  for:
  - javascript
  if:
    type: text
    regex: path\.join\([^)]{0,80}scriptDir
