defaults:
  platforms:
  - openwrt
  - unix
  for:
  - zig
traits:
- id: zig-hidden-temp-shell-path
  desc: Hidden temporary shell script path text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: /tmp/\.[A-Za-z0-9_.-]{3,64}\.sh
- id: zig-hidden-syshealthd-path
  desc: Hidden temporary syshealthd path text
  crit: component
  conf: 0.9
  if:
    type: text
    substr: /tmp/.syshealthd
