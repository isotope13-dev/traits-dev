defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: baseline
  conf: 0.7

traits:
  - id: node-tmpdir-hidden-entry-reference
    desc: Node tmpdir path references a hidden entry
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(path\.)?join\(\s*os\.tmpdir\(\)\s*,\s*[''"]\.[A-Za-z0-9._-]{2,64}[''"]'
  # The same hidden-marker shape built without path.join: string
  # concatenation, template interpolation, or path.resolve. Kept as
  # separate atoms so existing consumers keep their exact matcher; the
  # node-tmpdir-hidden-entry composite below unions all spellings.
  - id: node-tmpdir-hidden-plus-reference
    desc: Node os.tmpdir() plus hidden subdirectory
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'os\.tmpdir\(\)\s*\+\s*[''"]\/?\.[A-Za-z0-9._-]{2,64}[''"]'
  - id: node-tmpdir-hidden-template-reference
    desc: Node tmpdir hidden entry template
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '\$\{\s*os\.tmpdir\(\)\s*\}\/\.[A-Za-z0-9._-]{2,64}'
  - id: node-tmpdir-hidden-resolve-reference
    desc: Node tmpdir hidden entry resolve
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '(path\.)?resolve\(\s*os\.tmpdir\(\)\s*,\s*[''"]\.[A-Za-z0-9._-]{2,64}[''"]'
  - id: android-hidden-local-tmp-dotfile
    desc: Hidden Android local-tmp dotfile path
    crit: notable
    conf: 0.94
    platforms: [unix, android]
    for: [elf, shell, c, cpp]
    if:
      type: text
      regex: '/data/local/tmp/\.[A-Za-z0-9][A-Za-z0-9._-]{1,40}\b'

composite_rules:
  - id: node-tmpdir-hidden-entry
    desc: Node builds a hidden tmpdir entry path
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    any:
      - id: node-tmpdir-hidden-entry-reference
      - id: node-tmpdir-hidden-plus-reference
      - id: node-tmpdir-hidden-template-reference
      - id: node-tmpdir-hidden-resolve-reference
