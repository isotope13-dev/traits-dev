defaults:
  platforms:
  - unix
  - windows
  for:
  - elf
  - shell

traits:
  - id: hidden-temp-format-path
    desc: Hidden temporary format path
    crit: notable
    conf: 0.86
    platforms: [linux]
    for: [elf]
    if:
      type: text
      substr: /tmp/.%s
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
