defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.97
traits:
  - id: printf-hidden-temp-path-format
    desc: printf constructs a hidden temporary path
    if:
      type: symbol
      kind: call
      exact: printf
      arg:
        index: 0
        kind: string
        regex: '^(/|\\057|\\x2f)((v|\\166|\\x76)(a|\\141|\\x61)(r|\\162|\\x72)(/|\\057|\\x2f))?(t|\\164|\\x74)(m|\\155|\\x6d)(p|\\160|\\x70)(/|\\057|\\x2f)(\.|\\056|\\x2e)'
  - id: printf-hidden-temp-path-percent-b
    desc: printf constructs a hidden temporary path
    if:
      type: symbol
      kind: call
      exact: printf
      args:
        - index: 0
          kind: string
          exact: '%b'
        - index: 1
          kind: string
          regex: '^(/|\\057|\\x2f)((v|\\166|\\x76)(a|\\141|\\x61)(r|\\162|\\x72)(/|\\057|\\x2f))?(t|\\164|\\x74)(m|\\155|\\x6d)(p|\\160|\\x70)(/|\\057|\\x2f)(\.|\\056|\\x2e)'


composite_rules:
  - id: printf-hidden-temp-path
    desc: printf constructs a hidden temporary path
    conf: 0.97
    any:
      - id: printf-hidden-temp-path-format
      - id: printf-hidden-temp-path-percent-b
