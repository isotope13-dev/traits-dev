defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-path-join-dot-prefix
    desc: Builds path with hidden dot prefix
    crit: notable
    conf: 0.9
    if:
      type: text
      # The parent-traversal `".."` starts with a dot but names no hidden
      # entry; require a further non-dot, non-quote character after the dot.
      regex: 'os\.path\.join\([^\n]{0,100},\s*["'']\.[^"''\.\n]'
