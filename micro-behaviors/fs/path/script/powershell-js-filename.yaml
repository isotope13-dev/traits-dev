# Relocated from objectives/command-and-control/dropper/node-bootstrap/:
# a bare `\name.js` path fragment is a filename reference, not a dropped
# stage. As a standalone `suspicious` dropper trait it fired on ordinary
# installers that reference their own entry point (e.g. `bin\pantheon.js`
# reached through Join-Path). The stager composite references it from here;
# the staging intent comes from its other legs.
defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.9

traits:
  - id: powershell-js-filename-path
    desc: PowerShell references a .js filename path
    if:
      type: text
      regex: '\\[A-Za-z]{8,16}\.js\b'
    unless:
      - id: well-known/tool/development/runtime/setup-php::setup-php-action-source
      - id: well-known/tool/sysadmin/cdp::cdp-project-switcher
