traits:
# A batch file naming itself in COPY/CALL input is neutral self-location until
# a persistence surface joins it: launchers routinely resolve their own
# directory (e.g. `set "home=%~dpnx0"` then `call :dirname "%home%"`) to find
# an install root, which the batch-expansion layer renders as a self-path call
# argument. This stays notable here; the Startup/Run-key/COM-hijack composites
# that consume it supply the persistence verdict.
- crit: notable
  for:
  - batch
  platforms:
  - windows
  id: batch-current-script-copy-or-call-input
  desc: Current-script pathname in COPY/CALL input
  conf: 0.9
  unless:
  - type: text
    regex: (?i)copy\s+/y\s+"?%~f0"?\s+"?%temp%\\[^"]+\.sed"?
  - id: metadata/file/string/application-name::microsoft-activation-tool-script
  if:
    type: text
    regex: (?i)(copy\s+(/[a-z]\s+)?"?%~f0|call\s*:?\s*[a-z_]\w*\s+"?%~dpnx0)
  downgrade:
    any:
    - id: well-known/tool/development/cli/batch-scripts::everythingportable-launcher-path
    - id: "metadata/file/naming::iexpress-example-subpath"
    - id: "metadata/file/naming::bat2exe-version-one-basename"
    - id: well-known/tool/offensive/psbits::source-tree-member
