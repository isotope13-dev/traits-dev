traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  id: public-or-web-named-directory-script-path
  desc: Script path under public/web-named directory
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)(^|[\\/])(public|htdocs|w(ww|eb)root)[\\/][^"'\s]{1,60}\.(php|aspx?|jsp|cgi|pl|py)\b
