defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
- id: math-symbol-javascript-name-reference
  desc: References a Math_Symbol.js script name
  crit: notable
  conf: 0.97
  if:
    type: literal
    regex: '(?i)(^|[/\\])Math_Symbol\.js$'

- id: math-init-javascript-name-reference
  desc: References a math_init.js script name
  crit: notable
  conf: 0.97
  if:
    type: text
    # Path-basename matching only hit the sidecar file itself; droppers name
    # the payload in a string (often `const E = "math_init.js"`) inside setup.mjs.
    regex: '(?i)(^|[^A-Za-z0-9_])math_init\.js\b'

composite_rules:
- id: installer-sidecar-javascript-name
  desc: References a known installer sidecar script name
  crit: component
  conf: 0.95
  any:
  - id: micro-behaviors/fs/path/script::math-symbol-javascript-name-reference
  - id: micro-behaviors/fs/path/script::math-init-javascript-name-reference
  - id: micro-behaviors/fs/path/script::execution-javascript-name-reference
