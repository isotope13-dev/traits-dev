# The source-input and AppData command can be separate operations. This is
# self-path context, not a bound self-install or a logon activation mechanism.
defaults:
  platforms: [windows]
  for: [batch]
  crit: notable

composite_rules:
- id: batch-self-input-appdata-transfer-context
  desc: Self-path input alongside AppData copy/move command
  conf: 0.95
  all:
  - id: batch-current-script-copy-or-call-input
  any:
  - id: micro-behaviors/fs/file/copy::batch-copy-to-appdata
  - id: micro-behaviors/fs/file/move::batch-move-to-appdata
