composite_rules:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: js-temp-script-write-launch-context
  desc: JavaScript temp path with write or launch clues
  crit: notable
  conf: 0.8
  near_bytes: 2048
  all:
  - id: micro-behaviors/fs/path/temporary-artifact::js-path-under-tmp
  - id: metadata/file/profile/file-operation/write-context::js-file-write
  any:
  - id: micro-behaviors/fs/path/script::temp-pattern-js-filename
  - id: micro-behaviors/process/create/exec::node-process-launch-call
