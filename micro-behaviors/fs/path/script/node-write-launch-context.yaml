composite_rules:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: js-temp-script-write-launch-context
  desc: JavaScript temp path with write or launch clues
  crit: notable
  conf: 0.8
  near_bytes: 2048
  all:
  - id: micro-behaviors/fs/path/temp::js-path-under-tmp
  - id: micro-behaviors/fs/write/file/full::js-file-write
  any:
  - id: micro-behaviors/fs/path/script::temp-pattern-js-filename
  - id: micro-behaviors/process/create/exec::node-process-launch-call
  unless:
  - id: well-known/app/ai/gateway/neurolink::benign-archive-context
  - id: well-known/tool/development/agent/anthropic-claude-agent/
  - id: well-known/app/infrastructure/pulumi::pulumi-source-tree
  - id: well-known/lib/web/site-platforms/stacksjs/stx::stacksjs-stx-framework-context
