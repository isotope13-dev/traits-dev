---
defaults:
  crit: notable
  conf: 0.9
traits:
- platforms:
  - windows
  for:
  - javascript
  - typescript
  id: node-local-python-script-path
  desc: JS joins path to local .py script
  if:
    type: text
    regex: path\.join\(.{0,80}\.py['"]\)
- platforms:
  - unix
  - windows
  id: execution-javascript-name-reference
  desc: References execution.js script filename
  for:
  - javascript
  if:
    type: text
    regex: '\bexecution\.js\b'
