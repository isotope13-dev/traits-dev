defaults:
  platforms:
  - windows
traits:
- id: temp-script-path-reference
  desc: Windows temp or Microsoft-rooted script path
  crit: notable
  conf: 0.9
  for:
  - scripts
  if:
    type: text
    regex: (?i)(%TEMP%|\\Windows\\Temp\\|\\Microsoft\\)[^ \r\n'\"]{1,48}\.(py|vbs|js|ps1)
- id: temp-output-script-path
  desc: TEMP path names a script file
  crit: notable
  conf: 0.9
  for:
  - html
  - javascript
  - powershell
  - batch
  if:
    type: text
    regex: (?i)%TEMP%[\\/].{1,60}\.(js|ps1|hta)\b
composite_rules:
- id: windows-staged-script-path
  desc: Windows temp or Microsoft-rooted script path
  crit: notable
  conf: 0.92
  for:
  - scripts
  - html
  any:
  - id: temp-script-path-reference
  - id: temp-output-script-path
