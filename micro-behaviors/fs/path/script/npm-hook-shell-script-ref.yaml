defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: shell-script-ref
    desc: References shell script file (.sh)
    crit: component
    conf: 0.7
    for:
      - javascript
      - typescript
    if:
      type: text
      # A .sh path must be anchored by a quote, slash or backslash (string
      # literal, path segment or Windows path) and followed by a delimiter.
      # This rejects property/member access such as `obj.sh` or `this.sh`,
      # which a bare identifier boundary accepts and which common library
      # fields (e.g. cache-policy "shared" flags) use in bundled JavaScript.
      # Comments are excluded so prose and markdown-quoted mentions of
      # member-access names cannot serve as staging evidence.
      exclude_comments: true
      regex: (["'`/\\])[A-Za-z0-9_./-]{0,60}\.sh(["'` ),;:?\\]|$)
