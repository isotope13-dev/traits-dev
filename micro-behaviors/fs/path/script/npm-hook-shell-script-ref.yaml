defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: shell-script-ref
    desc: References shell script file (.sh)
    crit: component
    conf: 0.7
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: (^|[^A-Za-z0-9_./-])[A-Za-z0-9_./-]+\.sh(["' ),]|$)
