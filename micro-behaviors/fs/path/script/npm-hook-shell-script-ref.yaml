defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: shell-script-path-literal
    desc: Shell script path literal
    crit: component
    conf: 0.9
    for:
      - javascript
      - typescript
    if:
      type: literal
      # Require a complete path/URL constant. A diagnostic telling the user
      # to build a helper.sh is not evidence of a staged shell payload.
      regex: '^[^\s"''`]{1,160}\.sh([?:][^\s"''`]{0,80})?$'

  - id: shell-script-command-argument
    desc: Shell script in process command argument
    for: [javascript, typescript]
    crit: component
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(exec(File)?(Sync)?|spawn(Sync)?)$'
      arg:
        regex: '\.sh($|[\s"''`;])'

composite_rules:
  - id: shell-script-ref
    desc: Shell script path or process argument
    for: [javascript, typescript]
    crit: component
    conf: 0.9
    any:
      - id: shell-script-path-literal
      - id: shell-script-command-argument
