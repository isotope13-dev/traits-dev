---
defaults:
  platforms:
  - windows
  for:
  - lnk
traits:
- id: lnk-script-ext-wsh
  desc: LNK references .wsh/.wsf/.sct extension
  crit: suspicious
  conf: 0.8
  if:
    type: text
    regex: "\\.(wsh|wsf|sct)\\b"
    case_insensitive: true
- id: lnk-hta-extension
  desc: LNK references .hta extension
  crit: suspicious
  conf: 0.85
  if:
    type: text
    regex: "\\.hta\\b"
    case_insensitive: true
- id: lnk-js-extension
  desc: LNK references JavaScript file extension
  crit: suspicious
  conf: 0.8
  if:
    type: raw
    regex: "\\.js\\b"
    case_insensitive: true
