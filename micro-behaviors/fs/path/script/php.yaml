defaults:
  crit: notable
  platforms: [windows, unix]
  for: [php]

traits:
  - id: php-script-path-suffix
    for: [scripts, source, text, data]
    desc: PHP script path suffix
    conf: 0.94
    if:
      type: text
      regex: '[A-Za-z0-9_/-](\.|\\(56|x2[eE]))(p|\\(160|x70))(h|\\(150|x68))(p|\\(160|x70))["'']'

  # Extension-filter evasions that keep a destination executable while
  # dodging a literal ".php" blocklist: case variants are covered by the
  # case-insensitive upload matchers; what remains distinctive here is the
  # percent-encoded form (%70 = "p", %2e = "."), single- or double-encoded,
  # which can occur in both attack probes and ordinary URL serialization.
  - id: url-encoded-php-extension
    for: [scripts, source, text, json, data]
    desc: URL-encoded PHP extension
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(%2ephp|\.%70hp|\.%2570%2568%2570)["''?#]'
