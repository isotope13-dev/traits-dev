defaults:
  crit: notable
  platforms: [windows, unix]
  for: [php]

traits:
  - id: php-script-path-suffix
    for: [scripts, source, text, data]
    desc: PHP script path suffix
    conf: 0.94
    if:
      type: text
      regex: '(\.|\\(56|x2[eE]))(p|\\(160|x70))(h|\\(150|x68))(p|\\(160|x70))["'']'
