# Neutral observations relocated from attack-context rules; matchers and scopes retained.
traits:
- platforms:
  - windows
  - unix
  for:
  - batch
  id: batch-build-powershell-script-path
  desc: Batch references a local build.ps1 script
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: (?i)(%~dp0(eng[\\/])?|-File\s+(\.[\\/])?)build\.ps1\b
