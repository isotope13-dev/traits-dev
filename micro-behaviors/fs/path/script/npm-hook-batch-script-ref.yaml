defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: batch-script-ref
    desc: References batch script file (.bat/.cmd)
    crit: component
    conf: 0.7
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: (^|[^A-Za-z0-9_./-])[A-Za-z0-9_./-]+\.(bat|cmd)(["' ),]|$)
