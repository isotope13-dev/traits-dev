defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: batch-script-ref
    desc: References batch script file (.bat/.cmd)
    crit: component
    conf: 0.7
    for:
      - javascript
      - typescript
    if:
      type: text
      # Same anchor rule as shell-script-ref: a quote, slash or backslash must
      # precede the path and a delimiter must follow, so member access such as
      # `ctx.cmd` or `opts.bat` is not read as a batch file reference, and
      # prose mentions in comments are excluded for the same reason.
      exclude_comments: true
      regex: (["'`/\\])[A-Za-z0-9_./-]{0,60}\.(bat|cmd)(["'` ),;:?\\]|$)
