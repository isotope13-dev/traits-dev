# Package-local paths that resolve a native sidecar shipped beside Python code.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-package-dotdir-binary-path
    desc: Python resolves package dotdir binary
    if:
      type: text
      regex: 'parent\s*/\s*["'']\.[^"'']{1,24}["'']'
