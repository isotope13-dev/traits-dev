defaults:
  platforms:
  - android
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.9
composite_rules:
- id: android-app-runtime-path-references
  desc: Android application or runtime path references
  crit: notable
  conf: 0.9
  any:
