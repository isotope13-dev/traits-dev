# Resolving the current user's home directory at runtime, in any language.
# Per-language spellings already exist as separate atoms; this file adds the
# two missing ones and one aggregator so composites that care whether code
# looks *in the home directory* (rather than in a project tree it was handed)
# need a single leg.
defaults:
  crit: notable
  conf: 0.85
  platforms: [windows, unix]

traits:
  - id: python-path-home-call
    desc: Python resolves home via Path.home()
    for: [python]
    if:
      type: text
      regex: '\bPath\.home\(\)'
  - id: shell-home-dotpath
    desc: Shell path to a dot-entry under $HOME
    for: [shell]
    if:
      type: text
      regex: '(\$HOME|\$\{HOME\}|~)/\.[A-Za-z]'

composite_rules:
  - id: home-directory-resolution
    desc: Resolves the user's home directory
    conf: 0.85
    for: [scripts, source, binaries]
    any:
      - id: micro-behaviors/fs/path/location::python-expanduser-tilde
      - id: micro-behaviors/fs/path/location::home-hidden-dotpath
      - id: python-path-home-call
      - id: shell-home-dotpath
      - id: micro-behaviors/process/user/query::os-homedir-call
      - id: micro-behaviors/process/user/query::node-os-alias-homedir-call
      - id: micro-behaviors/process/user/query::node-bracket-homedir-call
      - id: micro-behaviors/os/env/user-paths::node-home-access
      - id: micro-behaviors/os/env/user-paths::userprofile-var
      - id: micro-behaviors/os/user/lookup::go-home-dir
