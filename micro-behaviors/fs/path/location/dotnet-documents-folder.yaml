defaults:
  for: [csharp]
  platforms: [windows]
  crit: notable
  conf: 0.9
traits:
  # The Documents special folder is a user-data root; the enum member name
  # alone says nothing about access, so the consumer composites supply the
  # enumeration and send legs.
  - id: dotnet-documents-special-folder
    desc: C# resolves the Documents special folder
    if:
      type: text
      regex: 'SpecialFolder\s*\.\s*(MyDocuments|Personal)\b'
