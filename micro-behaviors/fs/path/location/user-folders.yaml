defaults:
  crit: notable
  platforms:
  - unix
  for:
  - scripts
traits:
- id: windows-user-profile-desktop-documents-path-reference
  desc: Windows user-profile folder path reference
  conf: 0.8
  platforms:
  - windows
  for:
  - pe
  - dll
  - scripts
  if:
    type: text
    regex: (?i)(\bUSERPROFILE\b|\\(Desktop|Documents|Downloads))
  unless:
  - id: metadata/binary/debug::pdb-users-path
- id: desktop-folder-target
  desc: Desktop folder path reference
  conf: 0.75
  if:
    type: text
    regex: (?i)(^|[^A-Za-z0-9_./-])(~|/Users/[^/\\]{1,64})[/\\]Desktop\b
- id: documents-folder-target
  desc: Documents folder path reference
  conf: 0.75
  for:
  - scripts
  - swift
  - objc
  - applescript
  if:
    type: text
    regex: (?i)(^|[^A-Za-z0-9_./-])(~|\$\{?HOME\}?|/Users/[^/\\]{1,64})[/\\]Documents\b
- id: downloads-folder-target
  desc: Downloads folder path reference
  conf: 0.75
  for:
  - scripts
  - swift
  - objc
  - applescript
  platforms:
  - macos
  if:
    type: text
    regex: (?i)(^|[^A-Za-z0-9_./-])(~|/Users/[^/\\]{1,64})[/\\]Downloads\b
- id: python-personal-folder-name-sequence
  desc: Sequence names two personal folders
  conf: 0.85
  platforms:
  - unix
  - windows
  for:
  - python
  if:
    type: text
    regex: '[\(\[,]\s*["''](Documents|Desktop|Pictures)["'']\s*,\s*["''](Documents|Desktop|Pictures)["'']'
- id: onedrive-folder-target
  desc: OneDrive folder path reference
  conf: 0.75
  platforms:
  - windows
  - unix
  if:
    type: text
    regex: (?i)(^|[^A-Za-z0-9_./-])(~|/Users/[^/\\]{1,64})[/\\]OneDrive\b
- id: localized-user-folder-path
  desc: Spanish or Portuguese user folder path
  conf: 0.85
  platforms:
  - windows
  for:
  - scripts
  - typescript
  if:
    type: text
    regex: (?i)[/\\](Descargas|Escritorio|Documentos|Transfer[eê]ncias)["']
- id: wsh-specialfolders-lookup
  desc: WSH resolves a shell special folder
  conf: 0.92
  platforms:
  - windows
  for:
  - vbs
  - javascript
  - html
  if:
    type: text
    regex: (?i)(\.SpecialFolders\s*\(|\[\s*['"]SpecialFolders['"]\s*\]\s*\()
- id: home-user-folder-path-expression
  desc: Home-related user folder path expression
  conf: 0.85
  platforms:
  - windows
  - unix
  for:
  - scripts
  - typescript
  if:
    type: text
    regex: (?i)(homedir|HOMEPATH|USERPROFILE)[^\n]{0,24}[/\\]{1,2}(Desktop|OneDrive)
- id: home-desktop-path-expression
  desc: Home-related Desktop path expression
  conf: 0.85
  platforms:
  - windows
  - unix
  for:
  - scripts
  - typescript
  if:
    type: text
    regex: (?i)(homedir|HOMEPATH|USERPROFILE)[^\n]{0,24}[/\\]{1,2}Desktop
- id: home-cloud-sync-path-expression
  desc: Home-related cloud-sync path expression
  conf: 0.85
  platforms:
  - windows
  - unix
  for:
  - scripts
  - typescript
  if:
    type: text
    regex: (?i)(homedir|HOMEPATH|USERPROFILE)[^\n]{0,24}[/\\]{1,2}(OneDrive|Dropbox|iCloud)
- id: desktop-text-file-path
  desc: Desktop text or HTML file path
  conf: 0.85
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  - binaries
  if:
    type: text
    regex: '[/\\]Desktop[/\\][^/\\]{1,50}\.(html?|txt)'
- id: powershell-userprofile-desktop-target
  desc: PowerShell resolves user Desktop folder
  conf: 0.94
  platforms:
  - windows
  for:
  - powershell
  if:
    type: text
    regex: (?i)\bJoin-Path\s+\$env:USERPROFILE\s+["']Desktop["']
- id: powershell-userprofile-downloads-target
  desc: PowerShell resolves user Downloads folder
  conf: 0.94
  platforms:
  - windows
  for:
  - powershell
  if:
    type: text
    regex: (?i)\bJoin-Path\s+\$env:USERPROFILE\s+["']Downloads["']
- id: powershell-userprofile-documents-target
  desc: PowerShell resolves user Documents folder
  conf: 0.94
  platforms:
  - windows
  for:
  - powershell
  if:
    type: text
    regex: (?i)\bJoin-Path\s+\$env:USERPROFILE\s+["']Documents["']
- id: powershell-userprofile-onedrive-target
  desc: PowerShell resolves user OneDrive folder
  conf: 0.94
  platforms:
  - windows
  for:
  - powershell
  if:
    type: text
    regex: (?i)\bJoin-Path\s+\$env:USERPROFILE\s+["']OneDrive["']
composite_rules:
- id: common-user-folders
  desc: Multiple common user folders referenced
  conf: 0.8
  needs: 3
  any:
  - id: desktop-folder-target
  - id: documents-folder-target
  - id: downloads-folder-target
  - id: onedrive-folder-target
  unless:
  - id: metadata/package/testing/
  - id: metadata/document/html::doctype
  - id: metadata/document/html::legacy-doctype
  - id: metadata/path::test-directory-component
- id: powershell-common-user-folders
  desc: PowerShell resolves common user folders
  conf: 0.97
  platforms:
  - windows
  for:
  - powershell
  needs: 3
  any:
  - id: powershell-userprofile-desktop-target
  - id: powershell-userprofile-downloads-target
  - id: powershell-userprofile-documents-target
  - id: powershell-userprofile-onedrive-target
- id: user-folder-file-write
  desc: File write with home-related folder paths
  conf: 0.85
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  all:
  - id: home-user-folder-path-expression
  any:
  - id: micro-behaviors/fs/write/file
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
