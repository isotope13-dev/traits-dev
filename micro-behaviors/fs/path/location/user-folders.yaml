defaults:
  platforms: [unix]
  for: [scripts]
traits:
- id: desktop-folder-target
  desc: Desktop folder path reference
  crit: notable
  conf: 0.75
  if:
    type: text
    regex: (?i)(^|[^A-Za-z0-9_./-])(~|/Users/[^/\\]{1,64})[/\\]Desktop\b
- id: documents-folder-target
  desc: Documents folder path reference
  crit: notable
  conf: 0.75
  for: [scripts, swift, objc, applescript]
  if:
    type: text
    regex: '(?i)(^|[^A-Za-z0-9_./-])(~|\$\{?HOME\}?|/Users/[^/\\]{1,64})[/\\]Documents\b'
- id: downloads-folder-target
  desc: Downloads folder path reference
  crit: notable
  conf: 0.75
  for: [scripts, swift, objc, applescript]
  platforms: [macos]
  if:
    type: text
    regex: (?i)(^|[^A-Za-z0-9_./-])(~|/Users/[^/\\]{1,64})[/\\]Downloads\b
# The OneDrive sync root was the one user-visible folder with no atom here. It
# is a strictly better drop target than Desktop for an attacker: the file lands
# in front of the user AND is replicated to their cloud and every other signed-in
# device. Every prior OneDrive match in the tree is a masquerade reference
# (OneDrive.exe, OneDriveStandaloneUpdater sideload host, an OneDriveUpdate task
# name) -- none of them the folder as a write target.
- id: onedrive-folder-target
  desc: OneDrive folder path reference
  crit: notable
  conf: 0.75
  platforms: [windows, unix]
  if:
    type: text
    regex: (?i)(^|[^A-Za-z0-9_./-])(~|/Users/[^/\\]{1,64})[/\\]OneDrive\b
- id: wsh-startup-folder-lookup
  desc: WSH resolves the Startup folder
  crit: notable
  conf: 0.92
  platforms: [windows]
  for: [vbs, javascript]
  if:
    type: text
    regex: '(?i)SpecialFolders\s*\(\s*["'']Startup["'']\s*\)'
# These are lexical path-expression observations, not resolved destinations.
# An identifier spelled homedir can hold a function rather than its result;
# this matcher does not prove that it evaluates to the user's home directory.
- id: home-user-folder-path-expression
  desc: Home-related user folder path expression
  crit: notable
  conf: 0.85
  platforms: [windows, unix]
  for: [scripts, typescript]
  if:
    type: text
    regex: (?i)(homedir|HOMEPATH|USERPROFILE)[^\n]{0,24}[/\\]{1,2}(Desktop|OneDrive)
# Specific user-folder path expressions are useful standalone observations.
# Their co-occurrence does not establish a write destination or planting intent.
- id: home-desktop-path-expression
  desc: Home-related Desktop path expression
  crit: notable
  conf: 0.85
  platforms: [windows, unix]
  for: [scripts, typescript]
  if:
    type: text
    regex: (?i)(homedir|HOMEPATH|USERPROFILE)[^\n]{0,24}[/\\]{1,2}Desktop
- id: home-cloud-sync-path-expression
  desc: Home-related cloud-sync path expression
  crit: notable
  conf: 0.85
  platforms: [windows, unix]
  for: [scripts, typescript]
  # A lexical cloud-folder reference does not establish a resolved sync root.
  if:
    type: text
    regex: (?i)(homedir|HOMEPATH|USERPROFILE)[^\n]{0,24}[/\\]{1,2}(OneDrive|Dropbox|iCloud)
- id: desktop-text-file-path
  desc: Desktop text or HTML file path
  crit: notable
  conf: 0.85
  platforms: [windows, unix]
  for: [scripts, source, binaries]
  if:
    type: text
    regex: '[/\\]Desktop[/\\][^/\\]{1,50}\.(html?|txt)'

composite_rules:
- id: common-user-folders
  desc: Multiple common user folders referenced
  crit: notable
  conf: 0.8
  needs: 3
  any:
  - id: desktop-folder-target
  - id: documents-folder-target
  - id: downloads-folder-target
  - id: onedrive-folder-target
  unless:
  - id: metadata/package/testing/
  # HTML/docs pages label menus "Desktop"/"Documents"/"Downloads" without
  # targeting those paths as a collection surface.
  - id: metadata/document/html::doctype
  - id: metadata/document/html::legacy-doctype
# File-write and home-related path evidence co-occur in one file. This does not
# resolve the write destination, connect a dataflow, or establish activation.
# Keep the neutral observations visible without attributing planting intent.
- id: user-folder-file-write
  desc: File write with home-related folder paths
  crit: notable
  conf: 0.85
  platforms: [windows, unix]
  for: [javascript, typescript]
  all:
  - id: home-user-folder-path-expression
  # Directory reference rather than the four writeFile/appendFile ids: any
  # write primitive that lands in there should join this, including ones added
  # later.
  any:
  - id: micro-behaviors/fs/write/file/direct/
  unless:
  - id: metadata/package/testing/
