defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: postinstall-home-dot-path
  desc: postinstall references home dot-directory
  crit: notable
  conf: 0.9
  not:
  - substr: ./.git/hooks
  if:
    type: value
    path: scripts.postinstall
    regex: (^|[\s;&])~?/\.
- id: npm-install-hook-dot-path
  desc: Install script references dot-prefixed path
  crit: notable
  conf: 0.75
  if:
    type: value
    path: scripts
    regex: '"(preinstall|postinstall|install)":".{0,220}/\.[ac-z]'
  unless:
  - type: value
    path: scripts[*]
    regex: (?i)commands/\*\.md.{0,180}/opencode/command
  - type: value
    path: scripts[*]
    regex: (?i)(mkdir|sass)[^\n]{0,160}/\.tmp(?:/|\s|$)
