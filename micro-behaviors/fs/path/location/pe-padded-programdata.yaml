defaults:
  platforms: [windows]
  for: [pe]
traits:
  # Raw bytes retain path references embedded in printable runs that the
  # string extractor rejects or bounds. This does not establish file access.
  - id: pe-raw-programdata-path
    desc: PE contains a ProgramData directory path
    crit: notable
    conf: 0.9
    if:
      type: yara
      source: |
        rule pe_raw_programdata_path {
          strings:
            $path = /\\ProgramData\\[A-Za-z0-9._ -]{3,64}/ nocase
          condition:
            $path
        }
