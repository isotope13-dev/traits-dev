defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: get-path-from-idlist
    desc: Extract file path
    crit: baseline
    conf: 0.70
    if:
      type: symbol
      exact: "SHGetPathFromIDListW"
  - id: shell-get-special-folder-location
    desc: Resolve special folder location via Shell32
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      exact: "SHGetSpecialFolderLocation"
  - id: shell-get-path-from-idlist-a
    desc: Convert Shell folder ID to path (ANSI)
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      exact: "SHGetPathFromIDListA"
  - id: shell-get-folder-path
    desc: Resolve special folder path via Shell32
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      exact: "SHGetFolderPathW"
  - id: shell-get-folder-path-a
    desc: Resolve special folder path via Shell32 ANSI
    crit: notable
    conf: 0.88
    if:
      type: symbol
      exact: "SHGetFolderPathA"
    unless:
      # A statically linked Go binary's import table is the runtime's, not the
      # program's: the Go runtime pulls this API in regardless of what the
      # program does, so the import is not evidence the program queried it.
      # That makes the finding wrong here, not merely less interesting — which
      # is `unless:`, not a downgrade to a tier that would claim every program
      # does this.
      - id: metadata/lang/compiler/systems::go-binary-comp
      - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: shell-get-special-folder-path
    desc: Resolve special folder path directly
    crit: baseline
    conf: 0.82
    if:
      type: symbol
      exact: "SHGetSpecialFolderPathW"
  - id: shell-get-special-folder-path-a
    desc: Resolve special folder path ANSI
    crit: baseline
    conf: 0.82
    if:
      type: symbol
      exact: SHGetSpecialFolderPathA
