defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
  - python
  - javascript
  - elf
composite_rules:
- id: hidden-scratch-operation-text
  desc: Operation text names hidden scratch files
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/fs/file/create::hidden-scratch-touch-mktemp-text-1
  - id: micro-behaviors/fs/file/create::hidden-scratch-touch-mktemp-text-2
  - id: micro-behaviors/fs/file/create::hidden-scratch-touch-mktemp-text-3
  - id: micro-behaviors/fs/file/open::open-hidden-temp-path
  - id: micro-behaviors/fs/file/open::hidden-scratch-open-text-5
  - id: micro-behaviors/fs/file/open::hidden-scratch-open-text-6
  - id: micro-behaviors/fs/file/read-write::hidden-scratch-write-text-7
  - id: micro-behaviors/fs/file/read-write::hidden-scratch-write-text-8
  - id: micro-behaviors/fs/file/read-write::hidden-scratch-write-text-9
  - id: micro-behaviors/fs/chmod/executable/mode::chmod-hidden-scratch-target
  - id: micro-behaviors/communications/http/download/curl::curl-hidden-scratch-output
  - id: micro-behaviors/fs/chmod/modify::hidden-scratch-chmod-text-11
  - id: micro-behaviors/communications/http/download/cli::hidden-scratch-curl-output-text-11
  - id: micro-behaviors/fs/chmod/modify::hidden-scratch-chmod-text-12
  - id: micro-behaviors/communications/http/download/cli::hidden-scratch-curl-output-text-12
  - id: micro-behaviors/communications/http/download/cli::hidden-scratch-wget-output-text
  - id: micro-behaviors/communications/http/download/cli::hidden-scratch-wget-output-text-14
  - id: micro-behaviors/fs/write/file/redirect::hidden-scratch-redirect-text-14
  - id: micro-behaviors/communications/http/download/cli::hidden-scratch-wget-output-text-15
  - id: micro-behaviors/fs/write/file/redirect::hidden-scratch-redirect-text-15
  unless:
  - id: well-known/tool/development/vscode-extension/tencent-codebuddy::codebuddy-marker
  - id: metadata/build/minifier::js-large-minified-bundle
  - id: well-known/lib/development/vscode::vscode-extension-marker
  - id: well-known/tool/development/vscode-extension/devdb::extension-context
  - id: micro-behaviors/fs/path/temp::encrypted-editor-shared-memory-workspace
  not:
  - substr: statSync("/run/.containerenv
  - regex: /(tmp|var/tmp|run|dev/shm)/\.(netdata|X11|ICE|Test|cache|gnupg|config)[a-zA-Z0-9._-]*
  - regex: mktemp\s+-d\s+/(tmp|var/tmp|run|dev/shm)/\.[A-Za-z0-9][A-Za-z0-9._-]{1,64}\.X{3,}
  - regex: /(tmp|var/tmp|run|dev/shm)/\.spinner\.pid\b
  - regex: /tmp/\.[A-Za-z0-9._-]*(check|probe|test)[A-Za-z0-9._-]*
