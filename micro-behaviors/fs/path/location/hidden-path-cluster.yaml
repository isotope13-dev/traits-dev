defaults:
  for: [elf, shell]
  platforms: [unix]

composite_rules:
- id: hidden-temp-and-run-paths
  desc: References hidden temporary and runtime paths
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/fs/path/temp::hidden-tmp-path
  - id: micro-behaviors/fs/path/system::hidden-run-file-path
