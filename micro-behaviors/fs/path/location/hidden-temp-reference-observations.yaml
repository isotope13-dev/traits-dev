# Static reference/co-occurrence observations; no destination or execution binding.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - scripts
  - source
  crit: component
  conf: 0.92
traits:
- id: temporary-path-expression-text-reference
  desc: Temporary-path expression text reference
  if:
    type: text
    regex: (System[.]tmp_dir|sys_get_temp_dir|File::Spec->tmpdir|TMPDIR|/tmp)
- id: source-dot-idx-path-text-reference
  desc: Source dot-idx path text reference
  if:
    type: text
    regex: (^|[/\\"'`\s])[.][A-Za-z0-9_][A-Za-z0-9._-]{2,}[.]idx\b
