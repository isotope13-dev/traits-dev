defaults:
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
  platforms:
    - windows
traits:
  - id: localappdata-marker
    desc: LOCALAPPDATA path marker
    crit: baseline
    conf: 0.95
    if:
      type: text
      exact: LOCALAPPDATA
  - id: path-suspicious-appdata-exe
    desc: "Writes exe to %AppData% env var directly"
    if:
      type: text
      regex: (?i)%[A-Z0-9_]+%\.exe
  - id: path-suspicious-root-exe
    desc: Drive-root executable path reference
    if:
      type: text
      regex: (?i)[C-Z]:\\[^\\\r\n'"]{1,120}\.exe
    not:
      - regex: '(?i)[C-Z]:\\[sSdDwWbBrRnNtTvV]'
  - id: hash-subdir-executable-in-root
    desc: Hash-named executable under root subdirectory
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: (?i)[C-Z]:\\[a-f0-9]{8}\\[a-f0-9]{8}\.exe
  - id: roaming-appdata-executable-path
    desc: Roaming AppData executable path
    crit: notable
    conf: 0.82
    for: [scripts, binaries, go]
    if:
      type: text
      regex: (?i)\\AppData\\Roaming\\[^\\]{1,48}\\[^\\]{1,80}\.exe
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  # User Downloads is a common writable staging dir for EXE droppers that avoid
  # %TEMP%/%ProgramData% (those are already covered elsewhere).
  - id: win-downloads-executable-path
    desc: Windows Downloads folder executable path
    crit: notable
    conf: 0.9
    for: [powershell, batch, pe]
    if:
      type: text
      regex: '(?i)USERPROFILE.{0,24}Downloads\\[^\\\n]{1,80}\.exe'
  - id: win-users-downloads-executable-path
    desc: Users profile Downloads executable path
    crit: notable
    conf: 0.9
    for: [powershell, batch, pe]
    if:
      type: text
      regex: '(?i)\\Users\\[^\\]{1,40}\\Downloads\\[^\\]{1,80}\.exe'
  - id: json-userprofile-downloads-executable
    desc: JSON path uses USERPROFILE Downloads executable
    crit: notable
    conf: 0.94
    platforms: [windows, unix]
    for: [json]
    if:
      type: value
      path: path
      regex: '(?i)^%USERPROFILE%\\Downloads\\[^\\]{1,80}\.exe$'
  - id: json-users-downloads-executable
    desc: JSON path uses Users Downloads executable
    crit: notable
    conf: 0.94
    platforms: [windows, unix]
    for: [json]
    if:
      type: value
      path: path
      regex: '(?i)^[A-Z]:\\Users\\[^\\]{1,40}\\Downloads\\[^\\]{1,80}\.exe$'
  - id: localappdata-short-subdir
    desc: LocalAppData short staging directory
    crit: notable
    conf: 0.84
    for: [batch, powershell, pe, javascript, vbs]
    if:
      type: text
      regex: '(?i)%LOCALAPPDATA%\\[A-Za-z0-9_-]{3,8}\b'
  - id: programdata-directory-path
    desc: ProgramData directory path reference
    crit: notable
    conf: 0.82
    for: [python, c, cpp, csharp, rust, go, powershell, batch, pe, dll]
    if:
      type: text
      regex: '(?i)(\\ProgramData\\|%ProgramData%\\|C:\\ProgramData\\)[A-Za-z0-9._ -]{3,64}'
    unless:
      - id: metadata/file/profile/metrics::powershell-no-parsed-call-sites
  - id: windows-common-data-tree-path
    desc: Windows ProgramData/Users/inetpub path
    crit: notable
    conf: 0.78
    if:
      type: text
      regex: '(?i)([A-Z]:\\|\\\\)(ProgramData|Users|inetpub)(\\[\w .-]{1,40}){1,4}'
    # Compiler paths under a Cargo registry identify source provenance, not a
    # runtime reference to writable Windows user data.
    not:
      - regex: '(?i)\.cargo[\\/]registry[\\/]src\b'
  - id: windows-user-profile-data-path
    desc: Windows Documents/Desktop/Roaming path
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(?i)\\Users\\[^\\\r\n]{1,40}\\(Documents|Desktop|AppData\\Roaming)'
  - id: windows-appdata-directory-path
    desc: Windows AppData directory path reference
    crit: notable
    conf: 0.82
    for: [python, c, cpp, csharp, rust, go, powershell, batch, pe, dll]
    if:
      type: text
      regex: '(?i)(%APPDATA%|%LOCALAPPDATA%|AppData)[\\/][A-Za-z0-9._ -]{1,64}'
    unless:
      - id: metadata/package/testing/harness/unit::rust-test
  - id: appdata-powershell-script-path
    desc: References a PowerShell script under AppData
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?i)(\$env:APPDATA|AppData)[^\n]{0,80}\.ps1\b'
  - id: windows-public-temp-directory-path
    desc: Windows public or temp directory path
    crit: notable
    conf: 0.82
    for: [python, c, cpp, csharp, rust, go, powershell, batch, pe, dll]
    if:
      type: text
      regex: '(?i)(%TEMP%|C:\\Users\\Public)'
  - id: windows-dll-file-path-reference
    desc: Windows DLL file path reference
    crit: notable
    conf: 0.82
    for: [python, c, cpp, csharp, rust, go, powershell, batch, pe, dll]
    if:
      type: text
      regex: '(?im)^[^/\r\n]{0,160}C:\\[^"\r\n]{1,120}\.dll\b'
    unless:
      - id: metadata/package/testing/harness/unit::rust-test

  - id: users-public-executable-path
    desc: Executable path under Users\Public
    crit: notable
    conf: 0.9
    if:
      type: text
      # Match both runtime paths (single backslash) and source/JSON escapes
      # (`Users\\Public\\...exe`) used when the path is written as a string
      # literal or JSON value.
      regex: '(?i)(Users\\+Public\\+|Users/Public/|%PUBLIC%\\+|%PUBLIC%/).{0,120}\.exe\b'
  - id: programdata-executable-path
    desc: ProgramData executable file path
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\\ProgramData\\[^\\\r\n''"]{1,80}(\\[^\\\r\n''"]{1,80})?\.exe'
  - id: programdata-env-executable-path
    desc: Environment ProgramData executable path
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)%ProgramData%\\[^\\\r\n''"]{1,80}(\\[^\\\r\n''"]{1,80})?\.exe'
  - id: programdata-powershell-executable-path
    desc: PowerShell ProgramData executable path
    crit: notable
    conf: 0.86
    for: [powershell]
    if:
      type: text
      regex: '(?i)\$env:ProgramData\\[^\\\r\n''"]{1,80}(\\[^\\\r\n''"]{1,80})?\.exe'
  - id: temporary-batch-path-reference
    desc: Temporary-directory batch path reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(%temp%|%tmp%|\$env:temp|\$temp|\\temp\\|/tmp/).{0,32}\.(bat|cmd)'
  - id: path-suspicious-startup
    desc: Startup-folder executable path reference
    for: [scripts, binaries, ooxml]
    if:
      type: text
      regex: (?i)Start\s+Menu\\Programs\\Startup\\[^\\]{1,120}\.(exe|vbs|js)
  - id: path-suspicious-startup-scripts
    desc: Startup-folder script path reference
    for: [scripts, binaries, ooxml]
    if:
      type: text
      regex: (?i)Start\s+Menu\\Programs\\Startup\\[^\\]{1,120}\.bat
  - id: path-documents-settings-exe
    desc: Documents and Settings executable name
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)\bDocuments and Settings\.exe\b
  - id: path-program-files-exe
    desc: Program Files executable name
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)\bProgram Files\.exe\b

  # System-process-name-in-user-writable-path masquerade (svchost in Documents,
  # AppData, Temp, ...) now lives canonically as an evasion/masquerade objective
  # in objectives/evasion/masquerade/process/path/windows-system.yaml, alongside
  # its Linux systemd-service sibling. Composites reference it cross-directory.
  - id: path-system-folder-exe
    desc: System folder executable name
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: (?i)\b(System Volume Information|Recycler)\.exe\b
  - id: path-screenshot-album-dir
    desc: Screenshot album staging directory
    crit: suspicious
    conf: 0.96
    if:
      type: text
      exact: \Screenshot album
  - id: appdata-percent-dll
    desc: "%AppData% env var references DLL path"
    crit: component
    if:
      type: text
      regex: '(?i)%appdata%[^"\r\n]{0,120}\.dll'
  - id: localappdata-percent-dll
    desc: "%LocalAppData% env var references DLL path"
    crit: component
    if:
      type: text
      regex: '(?i)%localappdata%[^"\r\n]{0,120}\.dll'
  - id: ps-env-appdata-dll
    desc: PowerShell $env:AppData references DLL path
    crit: component
    if:
      type: text
      regex: '(?i)\$env:appdata[^"\r\n]{0,120}\.dll'
  - id: ps-env-localappdata-dll
    desc: PowerShell $env:LocalAppData references DLL path
    crit: component
    if:
      type: text
      regex: '(?i)\$env:localappdata[^"\r\n]{0,120}\.dll'
  - id: getenv-appdata-dll
    desc: getenv(APPDATA) references DLL path
    crit: component
    if:
      type: text
      regex: '(?i)getenv\([''"]appdata[''"][^"\r\n]{0,80}\.dll'
  - id: getenv-localappdata-dll
    desc: getenv(LOCALAPPDATA) references DLL path
    crit: component
    if:
      type: text
      regex: '(?i)getenv\([''"]localappdata[''"][^"\r\n]{0,80}\.dll'
composite_rules:
  - id: user-writable-dll-path-reference
    desc: DLL path references a user-writable directory
    crit: notable
    conf: 0.9
    all:
      - id: windows-dll-file-path-reference
    any:
      - id: programdata-directory-path
      - id: windows-appdata-directory-path
      - id: windows-public-temp-directory-path
    near_bytes: 256
    unless:
      - id: well-known/app/productivity/1password::onepassword-sdk-context
      - id: well-known/app/productivity/1password::onepassword-sdk-desktop-ipc-context

  - id: json-win-downloads-executable-path
    desc: JSON path names Windows Downloads executable
    crit: notable
    conf: 0.95
    platforms: [windows, unix]
    for: [json]
    any:
      - id: json-userprofile-downloads-executable
      - id: json-users-downloads-executable
  - id: path-suspicious-startup-any
    desc: Startup-folder executable path cluster
    crit: suspicious
    conf: 0.8
    for: [scripts, binaries, ooxml]
    any:
      - id: path-suspicious-startup
      - id: path-suspicious-startup-scripts
  - id: path-directory-name-exe
    desc: Directory-like Windows name with .exe
    crit: suspicious
    conf: 0.9
    any:
      - id: path-documents-settings-exe
      - id: path-program-files-exe
      - id: path-system-folder-exe
  - id: path-screenshot-album-payload
    desc: Screenshot album directory combined with executable payload reference
    crit: suspicious
    conf: 0.98
    all:
      - id: path-screenshot-album-dir
      - id: micro-behaviors/fs/path/extension::exe-dup
  - id: user-profile-dll-path
    desc: User-profile env var references a DLL path
    crit: suspicious
    conf: 0.95
    any:
      - id: appdata-percent-dll
      - id: localappdata-percent-dll
      - id: ps-env-appdata-dll
      - id: ps-env-localappdata-dll
      - id: getenv-appdata-dll
      - id: getenv-localappdata-dll
