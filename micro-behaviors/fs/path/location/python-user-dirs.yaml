composite_rules:
  # objectives/collection/app-data/metadata::user-directory-enum inherits its
  # own file's `for: [macho, objc, swift, applescript]` even though all four
  # of its `any:` legs are already declared for: [scripts, ...] (scripts
  # includes python) or explicitly for: [python, ...]. Re-pool the same legs
  # here with a python-scoped wrapper instead of the narrower macOS one.
  - id: python-user-directory-refs
    desc: References multiple user directories
    platforms: [unix, windows]
    for: [python]
    crit: notable
    conf: 0.8
    needs: 2
    any:
      - id: micro-behaviors/fs/path/location::user-library-path
      - id: micro-behaviors/fs/path/location::downloads-folder-target
      - id: micro-behaviors/fs/path/location::documents-folder-target
      - id: micro-behaviors/os/env/user-info::home-var
