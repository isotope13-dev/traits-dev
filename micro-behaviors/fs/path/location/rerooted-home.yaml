# A user home folder addressed through a path prefix rather than at the root.
#
# The sibling atoms in user-folders.yaml deliberately require the home path to
# start at `/Users/...` or `~/...`, which is how ordinary code names it. This
# one matches the opposite shape: `/Users/<name>/Desktop` reached *underneath*
# some other directory, e.g. `/tmp/.snap_read/Users/alice/Documents`.
#
# That only happens when the volume holding the home directory is mounted
# somewhere other than `/` — a Time Machine snapshot mount, a restored disk
# image, a target-disk-mode volume, or the `/System/Volumes/Data` firmlink.
# Neutral capability: backup, migration and forensic tooling all build such
# paths legitimately. The evasion reading — the same user data is readable at
# this path without the TCC prompt the real path would raise — is composed in
# objectives/evasion/tcc-manipulation/bypass/. Top-level protected folders and
# the user Library are separate atoms so an objective can require a sensitive
# Library artifact rather than treating every rerooted Library as credential
# access.
defaults:
  platforms: [macos]
  for: [scripts, source, binaries]
  attack: T1006

traits:
  - id: rerooted-user-folder-path
    desc: User home folder under a non-root mount
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '/[A-Za-z0-9._-]{1,40}/Users/[^/\s"'']{1,32}/(Desktop|Documents|Downloads)'

  - id: rerooted-user-library-path
    desc: User Library under a non-root mount
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '/[A-Za-z0-9._-]{1,40}/Users/[^/\s"'']{1,32}/Library/'
