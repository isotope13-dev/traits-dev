defaults:
  platforms: [windows, unix]
  for: [scripts, text]

traits:
  # The dot is a literal dot: a quoted string that *starts* with `.name/`.
  # It was written `\\.` — a literal backslash followed by "any character" —
  # which never matched a real ".ssh/" literal and instead matched any C format
  # string beginning with an escape, e.g. fprintf(fp, "\nglobal/glocal ...").
  # The trailing `/` is what keeps this off assembler directives in inline-asm
  # strings (".byte", ".section"), none of which are followed by a slash.
  - id: jvm-library-path-component
    desc: JVM macOS Library path component
    crit: baseline
    conf: 0.95
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      exact: Library

  - id: jvm-caches-path-component
    desc: JVM macOS Caches path component
    crit: baseline
    conf: 0.95
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      exact: Caches

