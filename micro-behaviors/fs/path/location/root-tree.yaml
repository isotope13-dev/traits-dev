# Absolute path literals rooted at the top of the filesystem rather than inside
# a user or application tree. Relocated (2026-08) from
# objectives/execution/exploit/sandbox-escape, where the same regex was named
# and described as a "sandbox root path". The matcher only observes that a path
# literal starts at /root, /mounts or /pkg -- /root is simply the root account's
# home directory and appears in ordinary user-lookup code and unit tests, with
# no sandbox or exploit meaning of its own. The escape inference comes from the
# other legs of the composite that references this (a /proc mountinfo read plus
# a process-exec API).
defaults:
  platforms: [unix]
  for: [c, cpp, python, shell, go, rust]

traits:
  - id: top-level-root-path
    desc: References top-level /root path
    crit: notable
    conf: 0.96
    if:
      # Scan the source text so an interpolated suffix (`$root/pkg`) is not
      # mistaken for the absolute `/root` or `/pkg` path fragment.
      type: text
      regex: '(?m)(^|["''\s=:(])/root(/|["''\s;)]|$)'

  - id: top-level-mounts-path
    desc: References top-level /mounts path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?m)(^|["''\s=:(])/mounts(/|["''\s;)]|$)'

  - id: top-level-pkg-path
    desc: References top-level /pkg path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?m)(^|["''\s=:(])/pkg(/|["''\s;)]|$)'

composite_rules:
  - id: top-level-root-tree-path
    desc: References selected top-level directory path
    crit: notable
    conf: 0.96
    any:
      - id: top-level-root-path
      - id: top-level-mounts-path
      - id: top-level-pkg-path
