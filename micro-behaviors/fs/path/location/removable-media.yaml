# Absolute path literals for conventional removable/external volume mount
# roots. Relocated (2026-09) from
# objectives/lateral-movement/usb-worm/drive-infector, where bare `/media` and
# `/removable` substrings were filed and named as USB drive-infector fragments.
# The matcher observes conventional mount-root spellings, not mounted devices.
# In source, /media/ can also denote a web resource. These neutral filesystem
# location strings occur in file managers, backup
# tools, media players, disk-image packagers and udisks consumers alike. The
# unanchored `/media` substring also matched unrelated identifiers such as
# `mime/mediatype.go` in Go binaries; the regexes below require real path
# delimiters. The worm inference comes from the other legs of the composite
# that references these (the `.hidden_agent.exe` copy plus the `.autostart.sh`
# drop).
defaults:
  crit: notable
  conf: 0.9
  platforms: [unix]
  for: [binaries, scripts, source]
  attack: T1083

traits:
  - id: media-mount-path
    desc: References an absolute /media path
    attack: none
    if:
      type: text
      regex: '(?m)(^|["''\s=:(])/media(/|["''\s;)]|$)'

  - id: removable-mount-path
    desc: References the /removable mount root
    if:
      type: text
      regex: '(?m)(^|["''\s=:(])/removable(/|["''\s;)]|$)'

  - id: volume-mount-root-path
    desc: References a volume mount root path
    if:
      type: text
      regex: '(?m)(^|["''\s=:(])/(Volumes|mnt/usb|media/usb)(/|["''\s;)]|$)'
