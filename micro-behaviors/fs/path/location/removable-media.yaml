# Absolute path literals for the conventional Linux removable-media mount
# points. Relocated (2026-09) from
# objectives/lateral-movement/usb-worm/drive-infector, where bare `/media` and
# `/removable` substrings were filed and named as USB drive-infector fragments.
# The matcher only observes that a path literal points at a removable-media
# mount root -- a neutral filesystem location used by file managers, backup
# tools, media players and udisks consumers alike. The unanchored `/media`
# substring also matched unrelated identifiers such as `mime/mediatype.go` in
# Go binaries; the regexes below require real path delimiters. The worm
# inference comes from the other legs of the composite that references these
# (the `.hidden_agent.exe` copy plus the `.autostart.sh` drop).
defaults:
  platforms: [unix]
  for: [binaries, scripts, source]
  attack: T1083

traits:
  - id: media-mount-path
    desc: References the /media removable-mount root
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)(^|["''\s=:(])/media(/|["''\s;)]|$)'

  - id: removable-mount-path
    desc: References the /removable mount root
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)(^|["''\s=:(])/removable(/|["''\s;)]|$)'
