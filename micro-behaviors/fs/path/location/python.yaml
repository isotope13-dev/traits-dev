defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python, pyc]

traits:
  - id: python-dot-prefixed-joined-path
    desc: Python joins dot-prefixed path
    conf: 0.9
    for: [python]
    if:
      type: symbol
      kind: call
      exact: os.path.join
      arg:
        kind: string
        regex: '^\.[A-Za-z0-9_.-]{3,}$'
  - id: python-cache-path-home
    desc: Uses home directory for cache
    conf: 0.92
    if:
      type: text
      regex: 'Path\.home\(\)\s*/\s*["'']\.cache["'']'
  - id: python-cache-path-env
    desc: Reads cache directory environment
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '^os\.(getenv|environ\.get)$'
      arg:
        kind: string
        regex: '^[A-Z0-9_]*(CACHE_DIR|CACHE_HOME)[A-Z0-9_]*$'

  # Common notebook/managed-runtime data mount used by stealer telemetry
  # packages that scan uploaded user files.
  - id: python-mnt-data-path
    desc: Hardcoded /mnt/data directory path
    conf: 0.9
    for: [python]
    if:
      type: literal
      kind: string
      exact: /mnt/data

  - id: python-hidden-device-identifier-path
    desc: Hidden device identifier path
    conf: 0.9
    if:
      type: text
      regex: 'expanduser.{0,120}~/\.[^"'']{0,80}(device|machine|hwid|host)[_-]?id'
  - id: python-open-hidden-path
    desc: Python open() with hidden path literal
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: open
      arg:
        kind: string
        substr: '/.'

composite_rules:
  - id: python-user-cache-root
    desc: Builds a user cache root
    conf: 0.92
    any:
      - id: python-cache-path-home
      - id: python-cache-path-env
