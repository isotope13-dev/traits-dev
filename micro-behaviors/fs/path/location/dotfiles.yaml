# Per-user hidden dotfiles — .ssh, shell history, .cache. A reference to one
# of these paths is neutral path evidence: SSH clients look for .ssh, shell
# helpers read history, and dev tools live in .cache. Which program names
# them, and what it does with them, is what the referencing composites supply.
defaults:
  platforms: [windows, unix]
  for: [kotlin, class]
  crit: notable
  conf: 0.92

traits:
  - id: user-dotfile-path-reference
    desc: References a user dotfile path
    if:
      type: text
      regex: '\.(ssh|bash_history|zsh_history|cache)'
