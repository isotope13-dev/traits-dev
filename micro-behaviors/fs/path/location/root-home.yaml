defaults:
  platforms: [unix, windows]
traits:
  - id: root-home-path-pair
    desc: References adjacent /root and /home paths
    crit: notable
    conf: 0.8
    for:
      - elf
      - shell
    if:
      type: text
      substr: /root /home
    unless:
      - id: metadata/package/testing/harness/runtime::benchmark-task-agent-record
