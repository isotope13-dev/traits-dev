defaults:
  platforms: [windows]
  for: [scripts]

traits:
  # --- user-writable location markers (path fragments) ---
  - id: path-user-shell-folder
    desc: User shell-folder path marker
    crit: notable
    conf: 0.6
    if:
      type: literal
      regex: '(?i)[\\/](Documents|Downloads|Desktop)[\\/]'
      not:
        - regex: '^https?://'

  # The slash-delimited form above misses the idiomatic PowerShell way of
  # building the same location — `Join-Path $env:USERPROFILE "Documents"` —
  # where the folder name is a bare quoted argument with no separators around
  # it. Paired with the profile env var below so the plain English word alone
  # never carries this.
  - id: shell-folder-quoted-arg
    desc: User shell-folder string argument
    crit: notable
    conf: 0.6
    for: [powershell, batch, csharp]
    if:
      type: string_literal
      regex: '(?i)^(Documents|Downloads|Desktop)$'

composite_rules:
  - id: path-user-shell-folder-cmdlet
    desc: Shell folder built from profile env var
    crit: notable
    conf: 0.6
    for: [batch, powershell]
    all:
      - id: shell-folder-quoted-arg
      - id: micro-behaviors/os/env/user-paths::userprofile-var
    near_bytes: 60

  - id: writable-path-any
    desc: User-writable Windows path marker
    crit: notable
    conf: 0.6
    any:
      - id: path-user-shell-folder
      - id: path-user-shell-folder-cmdlet
      - id: micro-behaviors/fs/path/app-data::windows-appdata-path-marker
      - id: micro-behaviors/os/env/user-paths::appdata-path-lookup
      - id: micro-behaviors/os/env/user-paths::env-appdata
      - id: micro-behaviors/os/env/user-paths::node-localappdata-access
      - id: micro-behaviors/fs/temp/reference::windows-public-or-temp-path

