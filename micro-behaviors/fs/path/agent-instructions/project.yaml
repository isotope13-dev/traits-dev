# Project-scoped agent instruction surfaces, alongside the per-user ones in
# traits.yaml. Every file here is read automatically at the start of an agent
# session in the checkout that contains it, so its contents reach the model as
# standing instruction rather than as documentation. Neutral: a project author
# writes these deliberately, and tooling reads them. What is not ordinary is a
# third party writing them during `npm install`, which is the composite in
# objectives/supply-chain/trojanized/app/config-injection/.
defaults:
  platforms: [windows, unix]
  for: [markdown, shell, python, javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: copilot-instructions-path
    desc: GitHub Copilot repository instructions path
    if:
      type: path
      case_insensitive: true
      regex: '(^|[\\/])copilot-instructions\.md$'

  - id: cursor-project-rule-path
    desc: Cursor project rule file path
    if:
      type: path
      regex: '[\\/]rules[\\/][\w.-]{1,64}\.mdc$'

  - id: agent-rules-dotfile-path
    desc: Agent rules dotfile path
    if:
      type: path
      regex: '(^|[\\/])\.(clinerules|windsurfrules|cursorrules)$'

  - id: agent-rule-directory-path
    desc: AI agent repository rule path
    if:
      type: path
      regex: '[\\/]\.(claude|windsurf|devin|clinerules)[\\/]'

  - id: scoped-copilot-instructions-path
    desc: Scoped Copilot instruction path
    if:
      type: basename
      regex: '\.instructions\.md$'

  # Content-level literals are useful when a helper constructs paths dynamically
  # and the resolved target is not emitted as a path fact.
  - id: project-agents-md-target-literal
    desc: References project AGENTS.md
    if:
      type: text
      substr: "AGENTS.md"

  - id: project-claude-md-target-literal
    desc: References project CLAUDE.md
    if:
      type: text
      substr: "CLAUDE.md"

  - id: project-gemini-md-target-literal
    desc: References project GEMINI.md
    if:
      type: text
      substr: "GEMINI.md"

  - id: aider-project-config-basename
    desc: Aider project configuration file
    if:
      type: basename
      regex: '^\.aider\.conf\.ya?ml$'
