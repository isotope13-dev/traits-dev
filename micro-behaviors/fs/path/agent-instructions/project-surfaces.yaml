defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, zip, whl, python-sdist]

composite_rules:
  - id: project-agent-instruction-target
    desc: References a project agent instruction surface
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/fs/path/agent-instructions::copilot-instructions-path
      - id: micro-behaviors/fs/path/agent-instructions::cursor-project-rule-path
      - id: micro-behaviors/fs/path/agent-instructions::agent-rules-dotfile-path
      - id: micro-behaviors/fs/path/agent-config/file::agent-instruction-path-literal
