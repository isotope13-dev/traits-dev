defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, npm, tar, zip, whl, python-sdist]

traits:
  - id: windsurf-global-instruction-target-in-code
    desc: References a Windsurf global instruction target
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      substr: .windsurfrules

  - id: agent-plugin-instructions-path
    desc: Agent plugin instructions file path
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']plugins["''][^\r\n]{0,240}["'']instructions\.md["'']'

composite_rules:
  - id: project-agent-instruction-target
    desc: References a project agent instruction surface
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/fs/path/agent-instructions::copilot-instructions-path
      - id: micro-behaviors/fs/path/agent-instructions::cursor-project-rule-path
      - id: micro-behaviors/fs/path/agent-instructions::agent-rules-dotfile-path
      - id: micro-behaviors/fs/path/agent-config/file::agent-instruction-path-literal
      - id: agent-plugin-instructions-path
      - id: micro-behaviors/fs/write/file/target::calls-global-instruction-writer-helper
