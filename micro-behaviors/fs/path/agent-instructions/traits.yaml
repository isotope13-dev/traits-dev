defaults:
  platforms: [windows, unix]
  for: [markdown, shell, python, javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: cursor-global-rules-path
    desc: Cursor global rules file path
    if:
      type: text
      substr: ".cursor/rules/global.mdc"

  - id: claude-global-instructions-path
    desc: Claude Code global instructions file path
    if:
      type: text
      substr: ".claude/CLAUDE.md"

  - id: gemini-global-instructions-path
    desc: Gemini CLI global instructions file path
    if:
      type: text
      substr: ".gemini/GEMINI.md"

  - id: codex-global-instructions-path
    desc: Codex global instructions file path
    if:
      type: text
      substr: ".codex/instructions.md"

  # `SKILL.md` is the fixed filename of the Agent Skills format, so a path ending
  # in it identifies the instruction file an agent host loads and follows. Skill
  # authoring guides, packaging scripts and the skills themselves all name it, so
  # this is the pointer that tells an analyst which file to read next rather than
  # a finding on its own.
  - id: agent-skill-md-path-reference
    desc: References an agent skill SKILL.md path
    crit: notable
    conf: 0.92
    for: [markdown, shell, python, javascript, typescript, java]
    unless:
      - id: well-known/tool/offensive/yaklang-hack-skills::yaklang-hack-skills-archive-context
    if:
      type: text
      substr: /SKILL.md
