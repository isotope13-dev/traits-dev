defaults:
  platforms: [windows, unix]
  for: [markdown, shell, python, javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: cursor-global-rules-path
    desc: Cursor global rules file path
    if:
      type: text
      substr: ".cursor/rules/global.mdc"

  - id: claude-global-instructions-path
    desc: Claude Code global instructions file path
    if:
      type: text
      substr: ".claude/CLAUDE.md"

  - id: gemini-global-instructions-path
    desc: Gemini CLI global instructions file path
    if:
      type: text
      substr: ".gemini/GEMINI.md"

  - id: codex-global-instructions-path
    desc: Codex global instructions file path
    if:
      type: text
      substr: ".codex/instructions.md"
