# A filename advertising a customer record: business PII (names, contact
# details, purchase history) sitting in a workspace or fixture file. Reading
# one is ordinary application behavior for CRM, billing and support tooling,
# so this stays a neutral reference fact. Exfiltration composites pair it with
# a delivery mechanism; the reference alone convicts nothing.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.85
  # No binaries: the text-matcher file-type cap is 33.
  for: [scripts, source]

traits:
  - id: customer-record-file-reference
    desc: References a customer-record file
    if:
      type: text
      regex: 'customer[-_]record'
