defaults:
  platforms:
  - unix
  - windows
  for:
  - source
  - c
  - cpp
  - go
  - java
  - java_class
  - class
  - kotlin
  - ruby
  - python
  - javascript
  - typescript
  - csharp
  - php
  - perl
  - swift
  - rust
  - zig
  - elixir

traits:
- id: source-user-home-path
  desc: User-home path prefix
  crit: component
  conf: 0.9
  if:
    type: text
    regex: '(?i)(~/|\$HOME[/\\]|\$\{HOME\}[/\\]|/home/|/Users/|%USERPROFILE%[/\\])'

- id: java-hidden-path-component
  desc: Java class contains a hidden path component
  crit: component
  conf: 0.9
  platforms: [macos]
  for: [java, java_class, class]
  if:
    type: text
    regex: '\.[a-z0-9][a-z0-9._-]{3,}'
