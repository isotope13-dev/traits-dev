# User personal data and activity records.

defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

traits:
  - id: shell-history-file-path
    desc: References a shell history file path
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      regex: '(?i)(\.bash|\.zsh|\.sh)_history\b|ConsoleHost_history\.txt\b'
  # Relocated from objectives/credential-access/files/config
  # (login-secret-file-paths--rx-7): a history path named in source is a
  # personal-data path reference, not credential access by itself.
  - id: bash-zsh-history-path-text
    desc: Bash or zsh history path literal
    conf: 0.9
    for: [source, scripts]
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: metadata/package/testing/presence/fixture::stub-secret-store-canary-wording
    if:
      type: text
      regex: '(\.bash_history|\.zsh_history)\b'
  # Relocated from objectives/credential-access/shell/history (zsh-history).
  # The matcher sees a delimited `.zsh_history` path, not a read of it.
  - id: zsh-history-path
    desc: Zsh history file path literal
    conf: 0.8
    platforms: [unix]
    attack: T1552.003
    for: [shell, python, elf, macho, go, c, cpp, objc]
    if:
      type: text
      regex: "(^|[~/\\\\'\"`=\\s])\\.zsh_history\\b"
    unless:
      - type: basename
        regex: ^(zsh|test_.*)\.py$
      # Terminal-emulator shell integration (VS Code, Qt Creator, iTerm2)
      # configures HISTFILE to the canonical history path via ZDOTDIR.
      - type: text
        regex: 'HISTFILE=[^\n]{0,40}\.zsh_history'
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
    downgrade:
      any:
        - type: basename
          exact: zsh
        - type: basename
          regex: n?vim
        - id: micro-behaviors/fs/path/personal::fuzzy-history-picker-source
        - type: text
          regex: com\.apple\.[a-z][a-z0-9.-]+
