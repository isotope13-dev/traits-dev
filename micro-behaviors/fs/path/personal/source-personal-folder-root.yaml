defaults:
  platforms:
  - unix
  - windows
  for:
  - source
  - c
  - cpp
  - go
  - java
  - java_class
  - class
  - kotlin
  - ruby
  - python
  - javascript
  - typescript
  - csharp
  - php
  - perl
  - swift
  - rust
  - zig
  - elixir

traits:
- id: source-personal-folder-root
  desc: Source references a personal folder root
  crit: notable
  conf: 0.9
  if:
    type: text
    # Require a path component boundary: `rancher-desktop` is an app-owned
    # VM path, not the user's Desktop directory. Do not match subfolders.
    regex: '(?i)[/\\](Documents|Desktop|Pictures)([/\\]\*|["\x27\s,;}]|$|\*)'
