# User personal data: messages, notes, contacts, clipboard. Not credentials --
# nothing here unlocks anything. Kept out of `sensitive/` deliberately: the ML
# feature keeps three directory levels, so filing these beside private keys
# would teach the model that reading someone's notes and reading their
# `id_rsa` are the same event.
defaults:
  platforms:
    - macos
    - ios
  crit: notable
  conf: 0.8
  for:
    - scripts
    - source
    - binaries

traits:
  - id: ios-call-history-db
    desc: Reference to iOS call history
    platforms:
      - ios
    for:
      - macho
    if:
      type: text
      substr: /private/var/mobile/Library/CallHistoryDB/CallHistory.storedata
  - id: ios-address-book-db
    desc: Reference to iOS contacts database
    platforms:
      - ios
    for:
      - macho
    if:
      type: text
      substr: /private/var/mobile/Library/AddressBook/AddressBook.sqlitedb
