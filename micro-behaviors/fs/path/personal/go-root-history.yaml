defaults:
  platforms: [unix]
  for: [go, elf]
  attack: T1041

traits:
  - id: go-root-history-paths
    desc: Go root shell history paths
    crit: suspicious
    conf: 0.94
    unless:
      - id: well-known/tool/detection/tool-guard-core::defensive-attack-corpus-context
      - id: well-known/tool/detection/tool-guard-core::repository-module
      # Busybox `.ash_history` listed beside bash, or a history file that is
      # only created, is a debugger seeding the user's own command into a
      # container shell rather than history harvesting.
      - type: text
        regex: '/root/\.ash_history'
      - type: text
        regex: 'os\.Create\("/root/\.bash_history"\)'
    if:
      type: text
      regex: '/root/\.(bash|zsh|mysql)_history'
