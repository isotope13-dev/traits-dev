defaults:
  platforms: [macos]
  for: [scripts, binaries]
  crit: notable

traits:
  - id: notestore-wal
    desc: Apple Notes write-ahead log
    conf: 0.85
    if:
      type: text
      substr: NoteStore.sqlite-wal
  - id: notestore-shm
    desc: Apple Notes shared memory file
    conf: 0.85
    if:
      type: text
      substr: NoteStore.sqlite-shm
  - id: notes-accounts
    desc: Apple Notes Accounts directory
    conf: 0.85
    if:
      type: text
      substr: 'group.com.apple.notes/Accounts'
  - id: notes-media
    desc: Apple Notes Media/attachments directory
    conf: 0.85
    if:
      type: text
      regex: group\.com\.apple\.notes.{0,50}Media
