# User personal data and activity records -- not credentials.

defaults:
  platforms:
    - macos
    - ios
  crit: notable
  conf: 0.8
  for:
    - scripts
    - source
    - binaries

traits:
  - id: safari-history-path
    desc: Safari history database path reference
    crit: notable
    conf: 0.85
    platforms:
      - macos
    if:
      type: text
      regex: (Safari|WebKit)[/\\\\].{0,50}History\.db|History\.db.{0,30}Safari
