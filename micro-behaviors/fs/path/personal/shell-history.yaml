# User personal data and activity records -- not credentials.

defaults:
  conf: 0.9
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript]

traits:
  # A module that exports a PowerShell-history reader. Reading
  # `ConsoleHost_history.txt` is what a history-stealing rule looks for, so a
  # tool that does it as its declared, exported purpose is the benign shape
  # those rules suppress on -- named here for what it is rather than repeated
  # inline in each `unless:`.
  - id: pwsh-history-fetch-export
    desc: Exported PowerShell history reader
    crit: component
    if:
      type: text
      substr: export async function fetchPwshHistory

  - id: bash-history-artifact
    desc: Bash history artifact path
    crit: notable
    if:
      type: text
      substr: .bash_history
