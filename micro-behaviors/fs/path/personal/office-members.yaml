# Office container member names identify document-content resources.
# These references do not establish that the contents are read.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.92

traits:
  - id: python-xlsx-shared-strings-member
    desc: References Excel sharedStrings.xml member
    if:
      type: literal
      kind: string
      regex: '(?i)sharedStrings\.xml$'

  - id: python-docx-document-xml-member
    desc: References Word document.xml member
    if:
      type: literal
      kind: string
      regex: '(?i)(^|/)word/document\.xml$'

  - id: python-pptx-slide-xml-member
    desc: References PowerPoint slide XML member
    if:
      type: literal
      kind: string
      regex: '(?i)ppt/slides/slide'
