defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - binaries
  crit: notable
  conf: 0.92
traits:
- id: shell-repl-history-filename-reference
  desc: References a shell or REPL history filename
  if:
    type: text
    regex: \.(bash|zsh|python)_history\b
- id: database-client-history-filename-reference
  desc: MySQL or PostgreSQL history filename reference
  if:
    type: text
    regex: \.(mysql|psql)_history\b
