# A Chromium personal-data database filename, not a password-store path.
# Its presence alone establishes neither access nor credential acquisition.

defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries, csharp]
  crit: notable
  conf: 0.9

traits:
  - id: chromium-web-data-file
    desc: Chromium Web Data database filename
    if:
      type: text
      regex: '([/\\]|["''`])Web Data\b'
