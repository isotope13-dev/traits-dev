defaults:
  platforms: [unix]
  for: [shell]
  attack: "T1552.001, T1041"

composite_rules:
- id: shell-history-harvest-files
  desc: Two shell or database history files named together
  crit: component
  conf: 0.9
  any:
    - id: micro-behaviors/fs/path/personal::shell-history-then-other-shell-history
    - id: micro-behaviors/fs/path/personal::other-shell-history-then-shell-history
    - id: micro-behaviors/fs/path/personal::shell-history-then-db-history
    - id: micro-behaviors/fs/path/personal::db-history-then-shell-history
    - id: micro-behaviors/fs/path/personal::db-history-then-other-db-history
    - id: micro-behaviors/fs/path/personal::other-db-history-then-db-history
