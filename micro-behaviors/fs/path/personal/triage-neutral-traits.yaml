---
defaults:
  platforms:
  - linux
  - macos
  for:
  - shell
  - applescript
  crit: notable
  conf: 0.9
traits:
- id: downloads-directory-reference
  desc: Downloads directory reference
  unless:
  - id: metadata/file/format/source-map::sourcemap
  - id: metadata/file/format/source-map::sourcemap-sources-content
  if:
    type: text
    regex: "(?i)(~/|\\$HOME/|/home/|/users/)[^;\\r\\n]{0,50}downloads"
