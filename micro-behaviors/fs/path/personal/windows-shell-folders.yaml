defaults:
  platforms: [windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.82
traits:
  - id: windows-documents-or-desktop-path
    desc: Windows Documents or Desktop path reference
    if:
      type: text
      regex: '(?i)\\Users\\[^\\\r\n]{1,40}\\(Documents|Desktop)'
  - id: windows-public-path
    desc: Windows Public profile path reference
    conf: 0.6
    for: [scripts, binaries, source]
    if:
      type: text
      # Include escaped source paths as well as literal Windows separators.
      regex: '(?i)[\\/]+Users[\\/]+Public[\\/]+'
    unless:
      - id: metadata/filename/name-form::readme-requirements-install-basename
