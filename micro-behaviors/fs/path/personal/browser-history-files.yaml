defaults:
  platforms: [unix, windows]
  for: [scripts, pe, elf, macho]

traits:
  - id: history-file-path
    desc: Browser history file path
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: (User Data|Default|Profile)[/\\]History$

  - id: history-file-db
    desc: Browser history database reference
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: '[/\\]History\.db\b|\bhistory\.sqlite\b'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: places-sqlite
    desc: References Firefox places.sqlite database
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: places.sqlite
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

composite_rules:
  - id: history-file
    desc: History file reference
    crit: notable
    conf: 0.5
    any:
    - id: micro-behaviors/fs/path/personal::history-file-path
    - id: micro-behaviors/fs/path/personal::history-file-db
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
