defaults:
  platforms: [macos]
  for: [scripts, binaries]
traits:
  - id: notestore-sqlite-filename
    desc: References the Notes SQLite database filename
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bNoteStore\.sqlite\b'
composite_rules:
  - id: notes-container-database-references
    desc: Notes container and SQLite filename references
    crit: notable
    conf: 0.95
    all:
      - id: notes-data
      - id: notestore-sqlite-filename
  # Keep the original complete-path alternative. The second observes separate
  # fragments, without claiming a statically resolved path or any file access.
  - id: notes-database-location-reference
    desc: Notes database path or container-name references
    crit: notable
    conf: 0.95
    any:
      - id: apple-notes-store
      - id: notes-container-database-references
