# User personal data: messages, notes, contacts, clipboard. Not credentials --
# nothing here unlocks anything. Kept out of `sensitive/` deliberately: the ML
# feature keeps three directory levels, so filing these beside private keys
# would teach the model that reading someone's notes and reading their
# `id_rsa` are the same event.
defaults:
  platforms:
    - macos
    - ios
  crit: notable
  conf: 0.8
  for:
    - scripts
    - source
    - binaries

traits:
  - id: stickies-data
    desc: Reference to Apple Stickies data
    if:
      type: text
      regex: (?i)Library/Containers/com\.apple\.Stickies|Library/StickiesDatabase
  - id: notes-data
    desc: Reference to Apple Notes data
    if:
      type: text
      regex: (?is)Library.{0,160}group\.com\.apple\.notes
  - id: apple-notes-store
    desc: Reference to Apple Notes store
    if:
      type: text
      regex: (?is)Library.{0,240}com\.apple\.notes.{0,120}NoteStore\.sqlite
