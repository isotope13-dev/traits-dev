# User personal data: messages, notes, contacts, clipboard. Not credentials --
# nothing here unlocks anything. Kept out of `sensitive/` deliberately: the ML
# feature keeps three directory levels, so filing these beside private keys
# would teach the model that reading someone's notes and reading their
# `id_rsa` are the same event.
defaults:
  platforms:
    - macos
    - ios
  crit: notable
  conf: 0.8
  for:
    - scripts
    - source
    - binaries

traits:
  - id: imessage-chat-db
    desc: Reference to iMessage chat.db
    if:
      type: text
      substr: Library/Messages/chat.db
  - id: ios-sms-db
    desc: Reference to iOS SMS database
    platforms:
      - ios
      - unix
    for:
      - python
      - macho
    if:
      type: text
      regex: '(?i)(/private)?/var/mobile/Library/SMS/sms\.db'
