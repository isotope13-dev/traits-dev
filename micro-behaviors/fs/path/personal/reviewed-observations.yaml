traits:
- for:
  - shell
  - python
  - elf
  - macho
  - go
  - c
  - cpp
  - objc
  platforms:
  - unix
  id: fish-history-reference
  desc: References Fish shell history path
  conf: 0.8
  if:
    type: text
    substr: .local/share/fish/fish_history
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: well-known/tool/detection/bagel::bagel-go-module-path
  downgrade:
    any:
    - type: basename
      exact: fish
    - id: micro-behaviors/fs/path/personal::fuzzy-history-picker-source
- for:
  - shell
  - python
  - elf
  - macho
  - go
  - c
  - cpp
  - objc
  platforms:
  - unix
  id: python-history-reference
  desc: References Python REPL history path
  conf: 0.8
  if:
    type: text
    regex: (?i)\bregister\s+~/\.python_history\b|(^|[~/\\"'`=\s])\.python_history\b
  not:
  - regex: (?i)^register\s+~/\.python_history$
  unless:
  - type: basename
    regex: ^python\d+(\.\d+)*$
- for:
  - scripts
  - binaries
  platforms:
  - windows
  - unix
  id: consolehost-history-reference
  desc: References ConsoleHost_history.txt
  conf: 0.85
  if:
    type: text
    substr: ConsoleHost_history.txt
  unless:
  - id: metadata/package/testing/
  - type: basename
    regex: ^test_.*\.py$
  - type: text
    substr: import pytest
  - id: micro-behaviors/fs/path/personal::pwsh-history-fetch-export
  - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
  - id: "metadata/file/naming::test-directory-component"
- for:
  - scripts
  - binaries
  platforms:
  - windows
  - unix
  id: consolehost-history-path-reference
  desc: PSReadLine ConsoleHost history location
  conf: 0.85
  if:
    type: text
    regex: PSReadLine.{0,10}ConsoleHost_history
  unless:
  - id: metadata/package/testing/
  - id: micro-behaviors/fs/path/personal::pwsh-history-fetch-export
  - id: "metadata/file/naming::test-directory-component"
- for:
  - scripts
  - binaries
  platforms:
  - windows
  - unix
  id: psreadline-history-path-reference
  desc: PowerShell PSReadLine history location
  conf: 0.8
  if:
    type: text
    regex: PowerShell.{0,10}PSReadLine
  unless:
  - id: metadata/package/testing/
  - type: basename
    regex: ^test_.*\.py$
  - id: micro-behaviors/fs/path/personal::pwsh-history-fetch-export
  - id: "metadata/file/naming::test-directory-component"
- platforms:
  - unix
  for:
  - go
  - macho
  id: home-media-directory-sequence
  desc: Documents, Desktop and Downloads sequence
  conf: 0.94
  if:
    type: text
    regex: Documents[\s\S]{0,120}Desktop[\s\S]{0,120}Downloads
defaults:
  crit: notable
