# User personal data and activity records -- not credentials.

defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries, csharp]
  crit: notable
  conf: 0.9
  attack: T1555.003

traits:
  - id: firefox-formhistory
    desc: Firefox form history database
    if:
      type: text
      substr: moz_formhistory

  - id: firefox-formhistory-file
    desc: Firefox form-history database filename
    if:
      type: text
      regex: '\bformhistory\.sqlite\b'
