defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: downloads-exe-path-text
  desc: EXE path under a Downloads directory
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)Downloads[/\\][^\r\n"']{1,40}\.exe\b
- id: homedir-downloads-path
  desc: Joins home directory with Downloads
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)homedir\s*\([^)]{0,12}\).{0,40}Downloads'
