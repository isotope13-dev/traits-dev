defaults:
  platforms:
    - windows
    - unix
  for:
    - python
    - javascript
    - shell
    - go
    - pe
traits:
  - id: android-downloads
    desc: Android Downloads directory path reference
    crit: notable
    if:
      type: text
      regex: (/sdcard|/storage/emulated/[0-9]+).{0,40}/Downloads?(/|$)
    unless:
      - id: well-known/lib/platform/platformdirs::user-directory-doc
      - type: raw
        regex: downloads_dir\s*=
