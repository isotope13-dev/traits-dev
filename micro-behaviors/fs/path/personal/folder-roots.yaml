defaults:
  platforms: [unix, windows]
  for: [swift, python, ruby, javascript, typescript, csharp]
  crit: notable
  conf: 0.95

traits:
  - id: documents-root-path-literal
    desc: Path names the Documents directory itself
    if:
      type: literal
      regex: '[/\\]Documents$'

  - id: desktop-root-path-literal
    desc: Path names the Desktop directory itself
    if:
      type: literal
      regex: '[/\\]Desktop$'
