defaults:
  platforms:
  - windows
  for:
  - lnk
traits:
- id: lnk-args-document-extension
  desc: LNK arguments name a document suffix
  crit: notable
  conf: 0.88
  if:
    type: value
    path: lnk.arguments
    # A document-looking prefix of an archive/executable is not a document.
    regex: '(?i)[^"\s&|]+\.(pdf|docx?|xlsx?)(["\s&|]|$)'
