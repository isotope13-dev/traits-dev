traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  id: sensitive-record-file-keywords
  desc: Document path includes a sensitive-record label
  crit: notable
  conf: 0.92
  if:
    type: literal
    kind: string
    regex: (?i)[/\\][\w.-]*(medical|patient|confidential)[\w.-]*\.(pdf|docx?)\b
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  - id: well-known/lib/ai/pyaigis/
