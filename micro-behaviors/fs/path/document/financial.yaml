# Neutral observations and discriminating identities.
traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  id: financial-path-keyword
  desc: Financial keyword in path or glob literal
  crit: notable
  conf: 0.92
  if:
    type: literal
    kind: string
    regex: (?i)[/\\*][\w.-]{0,40}\b(finance|accounting|insurance)\b
  not:
  - regex: (?i)^application/[a-z0-9.*+-]+
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  - id: well-known/lib/ai/pyaigis/
