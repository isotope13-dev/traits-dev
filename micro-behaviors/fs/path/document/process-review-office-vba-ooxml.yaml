defaults:
  for: [oledoc, ooxml]
  platforms: [windows, macos]
  crit: notable
  conf: 0.88
traits:
  - id: embedded-docm-name
    desc: Embedded DOCM payload name
    crit: suspicious
    conf: 0.97
    unless:
      # Conversion suites keep macro-enabled Word files under src/test.
      - type: path
        regex: '(^|[/\\])src[/\\]test[/\\]'
    if:
      type: text
      regex: (?i)\b[A-Za-z0-9_-]+\.docm\b
