defaults:
  platforms: [unix, windows]
  for: [scripts]
traits:
  - id: security-report-path-reference
    desc: Security-report path or glob literal
    crit: notable
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(?i)^([A-Z]:)?[\w.*/\\ -]{0,40}[/\\*]security[_ -]?reports?\b'
    unless:
      - id: well-known/lib/ai/pyaigis/
