defaults:
  for: [oledoc]
  platforms: [windows]
  crit: notable
  conf: 0.85

traits:
- id: wordbasic-normal-dot-ref
  desc: Reference to NORMAL.DOT default template
  if:
    type: text
    regex: '(?i)NORMAL\.DOT'

  # WordBasic addresses macros inside a container with `Container:MacroName`
  # (e.g. FileName$() & ":autoOpen", "Global:autoOpen"). These literals are how
  # Word 6 macro viruses name their auto-run macro in the opened document and
  # in the global template when copying it between the two; ordinary documents
  # do not store container-qualified macro paths.
- id: wordbasic-template-ref
  desc: WordBasic document template reference
  if:
    type: raw
    regex: '(?i)\\[a-z0-9_-]{1,16}\.dot\b'

