defaults:
  platforms: [windows, linux, macos]
  for: [javascript, package.json, pe, elf, macho, python]
  crit: notable

traits:
  - id: slack-storage-cookies
    desc: References Slack cookies path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)Slack[/\\]Network[/\\]Cookies

  - id: slack-cookies-path
    desc: References Slack cookies path path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)Slack[/\\]Cookies

  - id: signal-storage-cookies
    desc: References Signal cookies database path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)(\.config|AppData|Application Support)[/\\].{0,12}Signal[/\\]Network[/\\]Cookies'

  - id: signal-cookies-path
    desc: References Signal cookies database path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)(\.config|AppData|Application Support)[/\\].{0,12}Signal[/\\]Cookies'

