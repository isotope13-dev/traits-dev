traits:
  - id: apple-library-cookie-path-literal
    desc: Apple Library binary-cookie path literal
    platforms: [macos, ios]
    crit: notable
    conf: 0.98
    for: [c, csharp, elixir, go, ruby, javascript, typescript]
    if:
      type: literal
      regex: '(?i)Library/Cookies/Cookies\.binarycookies'
