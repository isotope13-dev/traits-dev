# Resolve the array's ldstr operands into #US. Ordinary profile-directory
# references remain notable; this does not claim file access or transmission.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.98

traits:
  - id: managed-chromium-cookie-path-components
    desc: CLR User Data/Default/Cookies path arguments
    if:
      type: yara
      source: |
        import "pe"
        rule managed_chromium_cookie_path_components {
          strings:
            $root = "BSJB"
            $us = "#US\x00"
            $profile = { 13 55 00 73 00 65 00 72 00 20 00 44 00 61 00 74 00 61 00 (00|01) }
            $default = { 0F 44 00 65 00 66 00 61 00 75 00 6C 00 74 00 (00|01) }
            $cookies = { 0F 43 00 6F 00 6F 00 6B 00 69 00 65 00 73 00 (00|01) }
            $array = { 11 ?? 19 72 ?? ?? ?? 70 A2
                       11 ?? 1A 72 ?? ?? ?? 70 A2
                       11 ?? 1B 72 ?? ?? ?? 70 A2
                       11 ?? 28 ?? ?? ?? 0A }
          condition:
            pe.data_directories[14].virtual_address != 0 and
            all of them and
            for any r in (1..#root) : (
              @root[r] == pe.rva_to_offset(uint32(pe.rva_to_offset(pe.data_directories[14].virtual_address)+8)) and
              for any u in (1..#us) : (
                @us[u] > @root[r] and @us[u] < @root[r]+256 and
                for any a in (1..#array) : (
                  uint8(@array[a]+1) == uint8(@array[a]+10) and
                  uint8(@array[a]+1) == uint8(@array[a]+19) and
                  uint8(@array[a]+1) == uint8(@array[a]+28) and
                  for any s in pe.sections : (
                    s.name == ".text" and
                    @array[a] >= s.raw_data_offset and
                    @array[a]+!array[a] <= s.raw_data_offset+s.raw_data_size
                  ) and
                  for any p in (1..#profile) : (
                    @profile[p] == @root[r]+uint32(@us[u]-8)+(uint32(@array[a]+4)&0x00ffffff)
                  ) and
                  for any d in (1..#default) : (
                    @default[d] == @root[r]+uint32(@us[u]-8)+(uint32(@array[a]+13)&0x00ffffff)
                  ) and
                  for any c in (1..#cookies) : (
                    @cookies[c] == @root[r]+uint32(@us[u]-8)+(uint32(@array[a]+22)&0x00ffffff)
                  )
                )
              )
            )
        }
