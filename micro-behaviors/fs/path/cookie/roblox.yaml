# Cookie jars: session state that replays authentication.

defaults:
  platforms: [windows, macos]
  for: [scripts, source, binaries, python, pyc]

traits:
  - id: roblox-cookie-file
    desc: References Roblox cookie store file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)robloxcookies\.dat|Roblox[/\\]+LocalStorage
