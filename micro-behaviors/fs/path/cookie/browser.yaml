# Browser cookie jars: session state that replays authentication without the
# password. Holder is the filename.

defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries, csharp]
  crit: notable
  conf: 0.9
  attack: T1555.003

traits:
  - id: firefox-cookies
    desc: Firefox cookies database
    if:
      type: text
      substr: moz_cookies
  - id: chrome-cookies-path-1
    desc: Chrome cookies database path variant 1
    if:
      type: text
      regex: Chrome/.{0,50}Cookies
  - id: chrome-cookies-path-2
    desc: Chrome cookies database path variant 2
    if:
      type: text
      regex: Google/Chrome/.{0,50}Cookies
  - id: chrome-cookies-path-3
    desc: Chrome cookies database path variant 3
    if:
      type: text
      regex: Chromium/.{0,50}Cookies
  - id: chrome-cookies-path-4
    desc: Chrome cookies database path variant 4
    if:
      type: text
      regex: \.config/chromium/.{0,50}Cookies
  - id: chromium-network-cookies-path
    desc: Chromium Network Cookies database path
    conf: 0.86
    if:
      type: text
      regex: '(?i)[/\\]Network[/\\]Cookies([^A-Za-z0-9_]|$)'
    unless:
      - id: metadata/library/automation::google-flow-browser-auth-client
  - id: browser-cookies-file-path
    desc: Browser Cookies database file path
    conf: 0.8
    for: [scripts, binaries, csharp, source]
    if:
      # The Chromium cookie store is an extension-less `Cookies` file, so the
      # path component must NOT be followed by a dot. Allowing `Cookies.`
      # matched every source file named Cookies.<ext> — `HTTP/Cookies.pm`
      # (libwww-perl), `net/http/cookies.go`, `Cookies.js` — and reported
      # them as browser credential-store access. The engine has no
      # lookaround, so the trailing delimiter is spelled as a class.
      # Safari's `Library/Cookies/Cookies.binarycookies` still matches on
      # its `/Cookies/` directory component.
      type: text
      regex: '[/\\]{1,2}Cookies([^A-Za-z0-9_.]|$)|[/\\]{1,2}cookies\.sqlite\b'
    unless:
      - type: text
        substr: stng::xor::classify
      - id: metadata/library/data::overwolf-vendor-string
composite_rules:
  - id: chrome-cookies
    desc: Chrome cookies database
    any:
      - id: chrome-cookies-path-1
      - id: chrome-cookies-path-2
      - id: chrome-cookies-path-3
      - id: chrome-cookies-path-4
      - id: micro-behaviors/fs/path/password-store::chrome-safe-storage
  - id: browser-sensitive-data
    desc: Browser cookies, logins, or credit cards
    crit: notable
    conf: 0.95
    any:
      - id: firefox-cookies
      - id: chrome-cookies
      - id: micro-behaviors/fs/path/password-store::firefox-logins
      - id: micro-behaviors/fs/path/personal::firefox-formhistory
      - id: micro-behaviors/fs/path/password-store::browser-credit-cards