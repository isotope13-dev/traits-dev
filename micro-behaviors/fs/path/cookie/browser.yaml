# Browser cookie jars: session state that replays authentication without the
# password. Holder is the filename.

defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries, csharp]
  crit: notable
  conf: 0.9

traits:
  - id: firefox-cookies
    desc: Firefox cookies database
    if:
      type: text
      substr: moz_cookies
  - id: chrome-cookies-path-1
    desc: Chrome cookies database path variant 1
    if:
      type: text
      regex: Chrome/.{0,50}Cookies
  - id: chrome-cookies-path-2
    desc: Chrome cookies database path variant 2
    if:
      type: text
      regex: Google/Chrome/.{0,50}Cookies
  - id: chrome-cookies-path-3
    desc: Chrome cookies database path variant 3
    if:
      type: text
      regex: Chromium/.{0,50}Cookies
  - id: chrome-cookies-path-4
    desc: Chrome cookies database path variant 4
    if:
      type: text
      regex: \.config/chromium/.{0,50}Cookies
  - id: dotnet-chrome-cookies-path-combine
    desc: Builds a Chrome Cookies path with Path.Combine
    for: [csharp]
    if:
      type: symbol
      kind: call
      exact: Path.Combine
      args:
        - kind: string
          exact: Chrome
        - kind: string
          exact: Cookies
  - id: chromium-network-cookies-path
    desc: Chromium Network Cookies database path
    conf: 0.86
    if:
      type: text
      regex: '(?i)[/\\]Network[/\\]Cookies([^A-Za-z0-9_]|$)'
    unless:
      - id: well-known/lib/platform/browser-automation/drivers/selenium::google-flow-browser-auth-client
  - id: browser-cookies-source-path
    desc: Browser cookie database path literal
    conf: 0.8
    for: [scripts, source, csharp]
    if:
      type: literal
      regex: '(^|[/\\])[\w -]+[/\\]Cookies([^\w.]|$)|[/\\]cookies\.sqlite\b'

  - id: browser-cookies-binary-path
    desc: Browser cookie database path in binary text
    conf: 0.8
    for: [binaries]
    if:
      type: text
      regex: '[/\\]{1,2}Cookies([^A-Za-z0-9_.]|$)|[/\\]{1,2}cookies\.sqlite\b'
    unless:
      - id: well-known/game/overwolf::overwolf-vendor-string
composite_rules:
  - id: browser-cookies-file-path
    desc: References a browser cookie database path
    conf: 0.8
    for: [scripts, binaries, csharp, source]
    any:
      - id: browser-cookies-source-path
      - id: browser-cookies-binary-path
  - id: chrome-cookies
    desc: Chrome cookies database
    any:
      - id: chrome-cookies-path-1
      - id: chrome-cookies-path-2
      - id: chrome-cookies-path-3
      - id: chrome-cookies-path-4
      - id: dotnet-chrome-cookies-path-combine
