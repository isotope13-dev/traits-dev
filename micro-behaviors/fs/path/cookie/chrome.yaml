# Browser cookie jars: session state that replays authentication without the
# password. Holder is the filename.

defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: baseline
  conf: 0.6

traits:
  - id: chrome-cookies-string
    desc: References Chrome cookies
    if:
      type: text
      regex: (?i)chrome.{0,100}cookie
