# Browser cookie jars: session state that replays authentication without the
# password. Holder is the filename.

defaults:
  platforms:
    - macos
  for:
    - applescript
    - macho
  attack: T1555.003

traits:
  - id: cookies-path-concat
    desc: Browser cookies path concatenation
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: '&\s*"/Cookies"'
