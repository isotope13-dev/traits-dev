# A database filename alone establishes no browser-extension backdoor.
# This also recognizes the singular filename and standalone basename forms
# omitted by browser-cookies-source-path's separator requirement.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: cookie-sqlite-database-reference
    desc: References a cookie SQLite database filename
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)cookies?\.sqlite'
