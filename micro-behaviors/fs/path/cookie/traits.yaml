defaults:
  attack: T1555.003
  platforms:
    - unix
    - windows
    - macos
  for:
    - shell
    - applescript
    - macho

traits:
  - id: objectivec-binarycookies-path
    desc: "System binary-cookie store path reference"
    crit: notable
    conf: 0.95
    platforms: [macos]
    for: [objectivec]
    if:
      type: text
      substr: /Library/Cookies/Cookies.binarycookies
  - id: cookies-path
    desc: macOS system cookies path
    crit: notable
    conf: 0.8
    platforms:
      - macos
    for:
      - python
      - javascript
      - shell
    if:
      type: string_literal
      substr: /Library/Cookies
  - id: binarycookies
    desc: References a macOS browser binary cookies file
    crit: notable
    conf: 0.8
    platforms:
      - macos
    if:
      type: text
      regex: '(?i)(Safari[/\\]+|/Library/Cookies[/\\]+)[^/\\\n]{1,80}\.binarycookies\b'
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/app/ai/media/comfy-desktop::comfy-reset-mac-path
      - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
      - id: well-known/app/utility/macos-cleaners::macos-cleaner-app
  - id: cookies-binarycookies
    desc: References Safari Cookies.binarycookies path
    crit: notable
    conf: 0.85
    platforms:
      - macos
    if:
      type: text
      regex: '(?i)(Safari[/\\]+|/Library/Cookies[/\\]+)Cookies\.binarycookies\b'
    unless:
      - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
      - id: well-known/app/utility/macos-cleaners::macos-cleaner-app
composite_rules:
  - id: safari-cookie-artifact-reference
    desc: Safari cookie artifact reference
    crit: notable
    conf: 0.85
    platforms:
      - macos
    any:
      - id: micro-behaviors/fs/path/cookie::cookies-path
      - id: micro-behaviors/fs/path/cookie::binarycookies
      - id: micro-behaviors/fs/path/cookie::cookies-binarycookies
    unless:
      - id: well-known/app/storage/carbon-copy-cloner::official-carbon-copy-cloner-member
