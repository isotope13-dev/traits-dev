# Stores that hold credentials at rest for an application or the OS.

defaults:
  platforms:
    - macos
    - ios
  crit: notable
  conf: 0.8
  for:
    - scripts
    - source
    - binaries

traits:
  - id: ios-mobile-cookies-db
    desc: Reference to iOS cookies database
    platforms:
      - unix
      - ios
    for:
      - lua
      - macho
    if:
      type: text
      substr: /var/mobile/Library/Cookies/Cookies.db
  - id: safari-binary-cookies
    desc: Reference to Safari cookies
    if:
      # The old pattern required the word "Cookies" a second time before the
      # filename, which only the iOS layout (Library/Cookies/Cookies.binary-
      # cookies) satisfies. The macOS jar every desktop stealer actually reads
      # lives at ~/Library/Safari/Cookies.binarycookies and never matched.
      # The filename is distinctive on its own; Library keeps it path-anchored.
      type: text
      regex: (?is)Library.{0,240}Cookies\.binarycookies
