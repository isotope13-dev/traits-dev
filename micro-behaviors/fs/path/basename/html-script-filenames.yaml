defaults:
  platforms: [windows]
  for: [html]
  crit: notable
  conf: 0.95

traits:
  - id: html-cache-db-filename-reference
    desc: cache.db filename reference
    if:
      type: text
      substr: 'cache.db'
  - id: html-startup-lnk-filename-reference
    desc: StartUp.lnk filename reference
    if:
      type: text
      substr: 'StartUp.lnk'
