traits:
- id: hi3511-dvr-executable-name
  desc: Hi3511 DVR executable name reference
  conf: 0.95
  if:
    type: text
    substr: stm_hi3511_dvr
  platforms:
  - unix
  - android
  - ios
  for:
  - elf
  - shell
  crit: notable
- id: gmdvr-executable-name
  desc: gmDVR executable name reference
  conf: 0.9
  if:
    type: text
    substr: gmDVR
  platforms:
  - unix
  - android
  - ios
  for:
  - elf
  - shell
  crit: notable
- id: hikvision-dvr-executable-reference
  desc: Hikvision DVR executable reference
  conf: 0.9
  if:
    type: text
    substr: dvr_main _8182T
  platforms:
  - unix
  - android
  - ios
  for:
  - elf
  - shell
  crit: notable
- id: anko-dvr-executable-reference
  desc: Anko DVR executable reference
  conf: 0.85
  if:
    type: text
    substr: ankosample _8182T
  platforms:
  - unix
  - android
  - ios
  for:
  - elf
  - shell
  crit: notable
- id: perfmon-process
  desc: Performance Monitor executable name reference
  crit: notable
  conf: 0.75
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)(^|[[:space:]/\\])perfmon\.exe($|[[:space:]/\\])
  platforms:
  - windows
  - unix
- id: resmon-process
  desc: Resource Monitor executable name reference
  crit: notable
  conf: 0.75
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)\bresmon(\.exe)?\b
  platforms:
  - windows
  - unix
- id: chromium-browser-process-name
  desc: Standalone chromium-browser process-name token
  crit: notable
  conf: 0.5
  for:
  - pe
  - elf
  - python
  - javascript
  - powershell
  - c
  - cpp
  - go
  if:
    type: text
    regex: (?i)(^|[[:space:]"'(\[])chromium-browser([[:space:]"')\]]|$)
    case_insensitive: true
  unless:
  - type: text
    substr: application/x-google-chrome-extension
  platforms:
  - windows
  - unix
- id: browser-apps-firefox-exe
  desc: Firefox executable name reference
  conf: 0.5
  for:
  - pe
  - dll
  - elf
  - c
  - cpp
  - python
  - javascript
  - powershell
  - batch
  if:
    type: text
    word: firefox.exe
    case_insensitive: true
  platforms:
  - windows
  - unix
  crit: baseline
- id: browser-apps-firefox-bin
  desc: Firefox binary name reference
  conf: 0.5
  if:
    type: text
    regex: (?i)\bfirefox-bin\b
    case_insensitive: true
  platforms:
  - windows
  - unix
  for:
  - pe
  - elf
  - python
  - javascript
  - powershell
  crit: baseline
- id: browser-apps-iexplore
  desc: Internet Explorer executable stem reference
  crit: notable
  conf: 0.5
  if:
    type: text
    regex: (?i)\biexplore\b
  unless:
  - id: metadata/build/recognized-contexts/
  downgrade:
    any:
    - id: metadata/binary/resource/
  platforms:
  - windows
  - unix
  for:
  - pe
  - elf
  - python
  - javascript
  - powershell
