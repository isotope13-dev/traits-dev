# Architecture suffixes in filename references, independent of the
# scanned file machine type and whether those files are fetched or run.
# Keep one atom per architecture family so a consumer can require distinct
# families rather than multiple occurrences of the same architecture.
defaults:
  for: [text, shell]
  platforms: [unix]
  crit: notable
  conf: 0.9
traits:
  - id: payload-name-arm
    desc: Filename with an ARM architecture suffix
    if:
      type: text
      # Case-sensitive: MariaDB's ARCHIVE engine names its metadata <table>.ARM.
      regex: '\b[A-Za-z0-9_-]{2,32}\.arm[4-8]?l?\b'

  - id: payload-name-mips
    desc: Filename with a MIPS architecture suffix
    if:
      type: text
      regex: '(?i)\b[A-Za-z0-9_-]{2,32}\.(mips|mipsel|mpsl)\b'

  - id: payload-name-x86
    desc: Filename with an x86 architecture suffix
    if:
      type: text
      regex: '(?i)\b[A-Za-z0-9_-]{2,32}\.(x86|x86_64)\b'

  - id: payload-name-ppc
    desc: Filename with a PowerPC architecture suffix
    if:
      type: text
      regex: '(?i)\b[A-Za-z0-9_-]{2,32}\.(ppc|ppc64)\b'

  - id: payload-name-sh4
    desc: Filename with a SuperH architecture suffix
    if:
      type: text
      regex: '(?i)\b[A-Za-z0-9_-]{2,32}\.sh4\b'
