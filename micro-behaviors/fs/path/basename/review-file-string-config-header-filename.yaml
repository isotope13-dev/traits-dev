defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, source]
  conf: 0.2

traits:
  - id: config-header-filename--source
    desc: Generic C header filename configs.h
    crit: component
    for: [scripts, source]
    if:
      type: string_literal
      exact: configs.h
  - id: config-header-filename--binary
    desc: Generic C header filename configs.h
    crit: component
    for: [binaries]
    if:
      type: string_literal
      exact: configs.h

composite_rules:
  - id: config-header-filename
    desc: Generic C header filename configs.h
    crit: notable
    any:
      - id: config-header-filename--source
      - id: config-header-filename--binary
