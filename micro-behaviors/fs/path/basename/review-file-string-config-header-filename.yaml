# Source literals require parsed literal evidence; binary strings use text.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - binaries
  - scripts
  - source
  conf: 0.2
traits:
- id: config-header-filename--source
  desc: Generic C header filename configs.h
  crit: component
  if:
    type: string_literal
    exact: configs.h
  for:
  - scripts
  - source
- id: config-header-filename--binary
  desc: Generic C header filename configs.h
  crit: component
  if:
    type: text
    exact: configs.h
  for:
  - binaries
composite_rules:
- id: config-header-filename
  desc: Generic C header filename configs.h
  crit: notable
  any:
  - id: config-header-filename--source
  - id: config-header-filename--binary
