# x86 dword stores of drop basenames. Plaintext names do not match.
defaults:
  platforms: [windows]
  for: [oledoc]
  crit: notable
  conf: 0.98
traits:
  - id: ole-svchost-exe-dword-suffix
    desc: Shellcode stores SVCHOST.EXE immediates
    if:
      type: hex
      pattern: 'C7 04 07 5C 53 56 43 C7 44 07 04 48 4F 53 54 C7 44 07 08 2E 45 58 45'
  - id: ole-temp-exe-dword-suffix
    desc: Shellcode stores temp.exe immediates
    if:
      type: hex
      pattern: 'C7 04 07 5C 74 65 6D C7 44 07 04 70 2E 65 78'
