# References name the utility; they do not establish invocation.
traits:
- id: bitsadmin-text-reference
  desc: Bitsadmin utility name reference
  conf: 0.94
  if:
    type: text
    substr: bitsadmin
    case_insensitive: true
- id: certutil-text-reference
  desc: Certutil utility name reference
  conf: 0.94
  if:
    type: text
    substr: certutil
    case_insensitive: true
- id: cscript-text-reference
  desc: Cscript interpreter name reference
  conf: 0.94
  if:
    type: text
    regex: (?i)\bcscript\b
- id: wscript-text-reference
  desc: Wscript interpreter name reference
  conf: 0.94
  if:
    type: text
    regex: (?i)\bwscript\b
defaults:
  platforms:
  - windows
  for:
  - html
  crit: notable
