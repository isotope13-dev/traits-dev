---
defaults:
  platforms:
  - windows
  for:
  - scripts
  - binaries
  crit: notable
traits:
- id: office-vpreview-executable-reference
  desc: References the Office preview executable name
  conf: 0.9
  if:
    type: text
    exact: vpreview.exe
- id: office-icons-executable-reference
  desc: References the Office icons executable name
  conf: 0.9
  if:
    type: text
    exact: icons.exe
- id: mavinject32-executable-reference
  desc: References the App-V mavinject32.exe name
  conf: 0.95
  for:
  - binaries
  platforms:
  - unix
  - windows
  if:
    type: text
    exact: mavinject32.exe
- id: mavinject32-name-reference
  desc: References the App-V mavinject32 name
  conf: 0.92
  for:
  - binaries
  platforms:
  - unix
  - windows
  if:
    type: text
    substr: mavinject32
composite_rules:
- id: office-appv-executable-name-set
  desc: References multiple Office or App-V executable names
  conf: 0.92
  for:
  - pe
  needs: 2
  any:
  - id: micro-behaviors/fs/path/basename::office-vpreview-executable-reference
  - id: micro-behaviors/fs/path/basename::office-icons-executable-reference
  - id: micro-behaviors/fs/path/basename::mavinject32-executable-reference
