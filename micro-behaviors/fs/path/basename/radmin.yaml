# A bare referenced executable filename does not identify the containing file as
# Radmin, verify a signature, or establish remote-administration behavior.
# Preserve the original matcher, file-type scope, and inherited size bounds.
defaults:
  platforms: [windows]
  for: [pe, c, cpp, powershell, python]
  crit: notable
  conf: 0.95
  size_min: 1
  size_max: 5000000

traits:
  - id: radmin-interface-executable-reference
    desc: References Radmin interface executable
    if:
      type: text
      regex: '(?i)\bFamItrf(c|2)\.exe\b'
