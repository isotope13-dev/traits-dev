# Names identify referenced executable basenames, not installed paths.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  - csharp
  crit: notable
traits:
- id: netsh-exe-reference
  desc: netsh.exe utility reference
  conf: 0.8
  if:
    type: text
    exact: netsh.exe
- id: route-exe-reference
  desc: route.exe utility reference
  conf: 0.78
  if:
    type: text
    exact: route.exe
