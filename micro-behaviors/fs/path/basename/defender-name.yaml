defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: defender-exe-name-reference
  desc: Windows Defender.exe name reference
  crit: notable
  conf: 0.96
  if:
    type: text
    exact: Windows Defender.exe
- id: defender-like-exe-name
  desc: Defender-like executable name reference
  crit: notable
  conf: 0.94
  for:
  - scripts
  - typescript
  - csharp
  if:
    type: literal
    kind: string
    regex: (?i)^windows defender( [a-z0-9_.-]{1,40})?\.exe$
