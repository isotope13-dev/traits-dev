defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: rar-filename-wildcard-reference
    desc: RAR filename wildcard reference
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .rdata
      # Wide-string extraction can omit punctuation-heavy masks.
      pattern: '(5C 2A 2E 72 61 72 | 5C 00 2A 00 2E 00 72 00 61 00 72 00)'
