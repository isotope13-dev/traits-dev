defaults:
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
  platforms: [windows]
traits:
  - id: path-documents-settings-exe
    desc: Documents and Settings executable name
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)\bDocuments and Settings\.exe\b
  - id: path-program-files-exe
    desc: Program Files executable name
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)\bProgram Files\.exe\b
  # System-process-name-in-user-writable-path masquerade (svchost in Documents,
  # AppData, Temp, ...) now lives canonically as an evasion/masquerade objective
  # in objectives/evasion/masquerade/process/path/windows-system.yaml, alongside
  # its Linux systemd-service sibling. Composites reference it cross-directory.
  - id: path-system-folder-exe
    desc: System folder executable name
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: (?i)\b(System Volume Information|Recycler)\.exe\b
composite_rules:
  - id: path-directory-name-exe
    desc: Directory-like Windows name with .exe
    crit: suspicious
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/basename::path-documents-settings-exe
      - id: micro-behaviors/fs/path/basename::path-program-files-exe
      - id: micro-behaviors/fs/path/basename::path-system-folder-exe
