defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: base64-decoded-executable-path
    desc: Base64-decoded executable path reference
    crit: notable
    conf: 0.9
    if:
      type: encoded
      encoding: base64
      regex: '(?i)(~[/\\]|[A-Za-z]:[/\\])[^\r\n]{1,120}\.exe\b'
