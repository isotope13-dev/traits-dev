defaults:
  platforms: [windows]
  for: [scripts, source]
traits:
  - id: temporary-system-process-image-path
    desc: System-process executable name in temporary path
    crit: notable
    conf: 0.94
    if:
      type: literal
      regex: '(?i)[\\/]te?mp[\\/][^"''\r\n]{0,64}\b(svchost|lsass|services)\.exe($|[\s"''<>])'
    unless:
      - id: metadata/lang/source/shape::javascript-literal-tables-pure-helpers
