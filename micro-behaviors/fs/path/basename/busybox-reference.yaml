defaults:
  platforms: [linux, android]
traits:
- id: busybox-name-reference
  desc: BusyBox utility referenced by name
  crit: notable
  conf: 0.6
  for: [elf, shell]
  size_min: 512
  size_max: 500000000
  if:
    type: text
    word: busybox
    case_insensitive: true
  unless:
  # The symbol records the API being used; this also sees the name sitting in
  # data. Standing down there keeps one use from counting twice.
  - id: micro-behaviors/process/create/shell/busybox::busybox-command
