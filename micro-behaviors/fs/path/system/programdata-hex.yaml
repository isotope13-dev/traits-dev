defaults:
  platforms: [windows]
  for: [powershell, batch, pe, dll, python, c, cpp, csharp, rust, go]

traits:
  - id: programdata-hex-directory-path
    desc: References a hex-named ProgramData directory
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(\\ProgramData\\|%ProgramData%\\)[0-9a-f]{8,32}\b'
