defaults:
  platforms:
    - windows
traits:
  - id: windows-tasks-dir
    desc: Windows Tasks directory path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)(Windows|%(windir|SystemRoot)%)[\\/]+Tasks[\\/]
    for:
      - batch
      - powershell
      - python
      - c
      - text
  # A file named under C:\Windows\Tasks. Windows keeps only legacy .job files
  # there, and standard users can write to it, so loaders stage side-load
  # sets in it.
  - id: windows-tasks-dll-file
    desc: DLL file path in Windows Tasks
    crit: notable
    conf: 0.9
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)Windows[\\/]+Tasks[\\/]+[\w.-]{1,64}\.dll\b'
  - id: windows-tasks-exe-file
    desc: EXE file path in Windows Tasks
    crit: notable
    conf: 0.9
    for: [batch, powershell]
    if:
      type: text
      regex: '(?i)Windows[\\/]+Tasks[\\/]+[\w.-]{1,64}\.exe\b'
