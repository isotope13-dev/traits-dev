defaults:
  platforms: [macos]
  for: [macho]
traits:
  - id: macos-kernel-service-path
    desc: macOS binary references kernel service path
    crit: notable
    conf: 0.97
    if:
      type: text
      substr: /Library/kernel_service
  - id: macos-kernel-marker-paths
    desc: macOS binary references kernel marker files
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '/Library/\.kernel_(pid|time|complete)'
