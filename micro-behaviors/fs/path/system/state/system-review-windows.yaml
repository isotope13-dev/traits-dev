defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: system32-dllcache-path
    desc: Windows File Protection dllcache path
    crit: notable
    conf: 0.94
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)[\\/]system32[\\/]dllcache\b'
