defaults:
  platforms: [windows]
  for: [pe, dll, batch, powershell]
  crit: notable
traits:
  - id: winre-wim-reference
    desc: References Winre.wim recovery image
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'Winre\.wim(\.[A-Za-z0-9]{4,14})?'
      case_insensitive: true
  - id: winre-recovery-path
    desc: References Recovery\WindowsRE path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\\Recovery\\WindowsRE\\'
      case_insensitive: true
  - id: reagent-xml-reference
    desc: References ReAgent.xml WinRE config
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'ReAgent\.xml(\.[A-Za-z0-9]{4,14})?'
      case_insensitive: true
composite_rules:
  - id: winre-artifact-reference-set
    desc: Multiple WinRE recovery artifact references
    crit: notable
    conf: 0.97
    needs: 3
    any:
      - id: winre-wim-reference
      - id: winre-recovery-path
      - id: reagent-xml-reference
      - id: micro-behaviors/fs/path/system/state::boot-sdi-recovery-loader
