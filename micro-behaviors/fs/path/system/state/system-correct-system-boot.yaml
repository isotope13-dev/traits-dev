defaults:
  platforms:
    - unix
    - windows
  for: [elf]
traits:
  - id: system-boot
    desc: Reference to /boot
    crit: notable
    conf: 0.66
    if:
      type: text
      regex: /boot/[\%\w\.\-/]{4,32}
    not:
      # Haiku embeds /boot/system/... terminfo paths in cross-platform DBs.
      - substr: /boot/system/
