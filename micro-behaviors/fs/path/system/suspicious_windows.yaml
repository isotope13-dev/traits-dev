defaults:
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
  platforms: [windows]
traits:
  - id: hash-subdir-executable-in-root
    desc: Hash-named executable under root subdirectory
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: (?i)[C-Z]:\\[a-f0-9]{8}\\[a-f0-9]{8}\.exe
  - id: programdata-directory-path
    desc: ProgramData directory path reference
    crit: notable
    conf: 0.82
    for: [source, scripts, binaries]
    if:
      type: text
      regex: '(?i)(\\ProgramData|%ProgramData%|%ALLUSERSPROFILE%)\\[A-Za-z0-9._ -]{3,64}'
    unless:
      - id: metadata/file/function::source-no-parsed-call-sites
  - id: programdata-dropper-subdir-path
    desc: ProgramData path with a directory named dropper
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\\ProgramData\\dropper\\'
  - id: windows-common-data-tree-path
    desc: Windows ProgramData/Users/inetpub path
    crit: notable
    conf: 0.78
    if:
      type: text
      regex: '(?i)([A-Z]:\\|\\\\)(ProgramData|Users|inetpub)(\\[\w .-]{1,40}){1,4}'
    # Compiler paths under a Cargo registry identify source provenance, not a
    # runtime reference to writable Windows user data.
    not:
      - regex: '(?i)\.cargo[\\/]registry[\\/]src\b'
    # A user-profile path embedded in PE debug metadata is a build/source
    # location, not a runtime reference to a writable Windows directory.
    unless:
      - id: metadata/binary/debug::pdb-users-path
  - id: users-public-executable-path
    desc: Executable path under Users\Public
    crit: notable
    conf: 0.9
    if:
      type: text
      # Match both runtime paths (single backslash) and source/JSON escapes
      # (`Users\\Public\\...exe`) used when the path is written as a string
      # literal or JSON value.
      regex: '(?i)(Users[\\/]+Public[\\/]+|%PUBLIC%[\\/]+)[^"''\r\n;]{0,120}\.exe\b'
  - id: users-public-script-path
    desc: Script path under Users\Public
    crit: notable
    conf: 0.92
    for: [batch, powershell, javascript, vbs, html, csharp, pe, dll]
    if:
      type: text
      regex: '(?i)(Users\\+Public|%PUBLIC%)\\+[^\r\n"'']{1,180}\.(hta|cmd|bat|vbs|js)\b'
  - id: programdata-executable-path
    desc: ProgramData executable file path
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\\ProgramData\\[^\\\r\n''"]{1,80}(\\[^\\\r\n''"]{1,80})?\.exe'
  - id: programdata-env-executable-path
    desc: Environment ProgramData executable path
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)%ProgramData%\\[^\\\r\n''"]{1,80}(\\[^\\\r\n''"]{1,80})?\.exe'
  - id: programdata-powershell-executable-path
    desc: PowerShell ProgramData executable path
    crit: notable
    conf: 0.86
    for: [powershell]
    if:
      type: text
      regex: '(?i)\$env:ProgramData\\[^\\\r\n''"]{1,80}(\\[^\\\r\n''"]{1,80})?\.exe'
  - id: path-documents-settings-exe
    desc: Documents and Settings executable name
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)\bDocuments and Settings\.exe\b
  - id: path-program-files-exe
    desc: Program Files executable name
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: (?i)\bProgram Files\.exe\b
  # System-process-name-in-user-writable-path masquerade (svchost in Documents,
  # AppData, Temp, ...) now lives canonically as an evasion/masquerade objective
  # in objectives/evasion/masquerade/process/path/windows-system.yaml, alongside
  # its Linux systemd-service sibling. Composites reference it cross-directory.
  - id: path-system-folder-exe
    desc: System folder executable name
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: (?i)\b(System Volume Information|Recycler)\.exe\b
  - id: path-screenshot-album-dir
    desc: Screenshot album staging directory
    crit: suspicious
    conf: 0.96
    if:
      type: text
      exact: \Screenshot album
composite_rules:
  - id: path-directory-name-exe
    desc: Directory-like Windows name with .exe
    crit: suspicious
    conf: 0.9
    any:
      - id: path-documents-settings-exe
      - id: path-program-files-exe
      - id: path-system-folder-exe
  - id: path-screenshot-album-payload
    desc: Screenshot album directory combined with executable payload reference
    crit: suspicious
    conf: 0.98
    all:
      - id: path-screenshot-album-dir
      - id: micro-behaviors/fs/path/extension::exe-name-or-extension
