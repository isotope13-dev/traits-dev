defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: root-dirs-list-mnt-media
    desc: Root directories list includes mnt/media
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: "[\"']/(mnt|media)[\"'],\\s*[\"']/(mnt|media)[\"']"
  - id: root-dirs-list-volumes
    desc: Root directories list includes Volumes
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '["'']/Volumes["'']'
  - id: root-drives-push
    desc: Adds root directory to a named list
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: "rootDrives\\.push\\(['\"]/['\"]\\)"
composite_rules:
  - id: root-dirs-list
    desc: Root directory list references
    crit: notable
    conf: 0.8
    any:
      - id: root-dirs-list-mnt-media
      - id: root-dirs-list-volumes
