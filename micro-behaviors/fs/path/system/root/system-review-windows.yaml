defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: windows-root
    desc: C:\\Windows\\ directory path
    crit: baseline
    conf: 0.66
    mbc: E1083
    attack: T1083
    if:
      type: text
      regex: '[Cc]:\\Windows\\[\w\\]+'
  - id: windows-dir
    desc: Windows directory path reference
    crit: baseline
    conf: 0.5
    if:
      type: text
      # Windows paths are case-insensitive and scripts spell them lowercase.
      regex: '(?i)[A-Za-z]:\\Windows(\\System32)?|\\Windows\\System32|/Windows/System32'
