defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: multi-os-root-scan
    desc: Multi-OS root directory selection clues
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/fs/path/system/root::root-dirs-list
      - id: micro-behaviors/fs/path/system/root::root-drives-push
      - id: micro-behaviors/os/sysinfo/platform/branch::js-platform-win32-check
