defaults:
  for:
    - macho
    - shell
  platforms:
    - macos
  attack: T1113
  mbc: C0014

traits:
  - id: private-etc-image-path
    desc: "Image path beneath private etc"
    crit: suspicious
    conf: 0.88
    if:
      type: text
      regex: '/private/etc/[^ \t\r\n]{1,80}\.(jpg|jpeg|png)'
