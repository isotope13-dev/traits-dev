defaults:
  platforms: [windows, unix]
  for: [scripts, shell, python, javascript, pe, elf]
traits:
  - id: hidden-sbin-reference
    # A dotfile reference alone does not establish concealment or execution.
    desc: References a dotfile path under sbin
    crit: notable
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(^|[\s"'':;,=])/(usr/)?sbin/\.\w[\w-]{2,}'
    not:
      - substr: jruby
    unless:
      - id: well-known/tool/sysadmin/alpine-packages/
  - id: hidden-local-system-bin-reference
    desc: References a local system binary dotfile path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(^|[\s"'':;,=])/usr/local/(s?bin|libexec)/\.\w[\w-]{2,}'
    not:
      - substr: /usr/bin/.sysless
      - substr: /bin/.dev_mode
      - regex: Fake[A-Za-z0-9_/.-]*/bin/\.exists
      - substr: /usr/local/sbin/.iptables-legacy
      - substr: jruby
    unless:
      - id: well-known/tool/sysadmin/alpine-packages/
      - id: micro-behaviors/fs/path/system::hidden-atomic-update-staging-path
      - type: basename
        exact: scanner
  - id: hidden-usr-bin-reference
    desc: References a dotfile path under /usr/bin
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(^|[\s"'':;,=])/usr/bin/\.\w[\w-]{2,}'
    not:
      - substr: /usr/bin/.sysless
      - substr: /usr/bin/.config
    unless:
      - id: well-known/tool/sysadmin/alpine-packages/
      - id: micro-behaviors/fs/path/system::hidden-atomic-update-staging-path
      - type: basename
        exact: scanner
composite_rules:
  - id: hidden-system-bin-reference
    desc: References a system binary directory dotfile
    crit: notable
    conf: 0.95
    any:
      - id: hidden-sbin-reference
      - id: hidden-local-system-bin-reference
      - id: hidden-usr-bin-reference
