# The Windows side-by-side assembly store. A `%windir%\\winsxs\\amd64_microsoft-`
# path is where Windows keeps versioned copies of its own components, so rules
# about launching or hijacking system binaries use it as ordinary context.
#
# `for:` is the union of the types the referencing rules declare -- a named
# trait narrower than its consumers would silently drop their exclusion.
defaults:
  platforms: [windows]
  for: [pe, dll, batch, vbs, powershell, python, rust]
  crit: baseline
  conf: 0.95
traits:
  - id: winsxs-assembly-path
    desc: Windows side-by-side assembly path
    # Plain extractable ASCII, so `text` reaches it on every one of these
      # types -- `raw` caps at three, and cleave's own raw-should-use-text
      # check prefers text for literals like this.
    if:
      type: text
      substr: '%windir%/winsxs/amd64_microsoft-'
