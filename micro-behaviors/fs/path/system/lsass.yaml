defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
- id: lsass-system-path
  desc: LSASS system path reference
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)systemroot[/\\]+system32[/\\]+lsass\.exe
  unless:
  - id: well-known/app/utility/360-file-guard::360-file-guard-identity
