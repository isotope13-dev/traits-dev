# A dot-entry directly under a shared system data/library directory
# (`/usr/share/.cache/...`, `/usr/lib/.x`). Packages install under named
# subdirectories here; a hidden top-level entry is not something a package
# manager creates. This records the path only; intent comes from consumers.
# Excluded: RPM's `/usr/lib/.build-id` debug links and the yarn/corepack
# cache that node base images keep under `/usr/local/share/.cache`.
defaults:
  platforms: [unix]
  for: [shell, dockerfile]
  crit: notable
  conf: 0.88

traits:
  - id: usr-data-dir-hidden-entry
    desc: Hidden entry directly under /usr data dir
    if:
      type: text
      regex: '/usr/(local/)?(share|lib|lib64)/\.[A-Za-z0-9_][\w.-]{1,40}(/[\w.-]{1,40})?'
      not:
        - substr: '/usr/lib/.build-id'
        - regex: '^/usr/local/share/\.(cache|config)/(yarn|corepack)'
