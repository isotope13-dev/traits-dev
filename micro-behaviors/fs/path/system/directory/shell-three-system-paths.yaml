defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: three-system-paths
    desc: Three system and shared memory paths
    crit: notable
    needs: 3
    any:
      - id: micro-behaviors/fs/path/storage::lost-found-path
      - id: micro-behaviors/fs/path/config/system::etc-openal-path
      - id: micro-behaviors/fs/path/config/system::etc-thermald-path
      - id: micro-behaviors/fs/path/device/special::dev-shm-bare
      - id: micro-behaviors/fs/path/system/state::system-run
