defaults:
  platforms: [windows]
traits:
- id: ntdll-module-name-source
  desc: Source names the ntdll.dll module
  crit: notable
  conf: 0.9
  for: [c, cpp, csharp, go, rust, python, powershell]
  if:
    type: text
    regex: '(?i)\bntdll\.dll\b'
  unless:
  - id: well-known/lib/development/sanitizer-runtime::sanitizer-runtime-source-path
