defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # A DLL name does not establish a query. Raw matching also covers images
  # whose intentionally changed PE signature prevents import recovery.
  - id: dnsapi-dll
    desc: References Windows DNSAPI library name
    crit: notable
    conf: 0.98
    if:
      type: raw
      regex: '(?i)\bdnsapi\.dll\b'
