# PDPOP's smart-filter helper library, named in its clients. A name reference,
# not proof the library is loaded.
defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
  conf: 0.99

traits:
  - id: sfpdpop-helper-dll
    desc: PDPOP smartfilter helper DLL
    if:
      type: text
      exact: sfpdpop.dll
      section: .rdata
