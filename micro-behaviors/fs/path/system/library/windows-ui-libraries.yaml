defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: user32-dll-name
    desc: User32 library name reference
    crit: baseline
    conf: 0.86
    if:
      type: text
      regex: (?i)^user32\.dll$
  - id: gdi32-dll-name
    desc: GDI32 library name reference
    crit: baseline
    conf: 0.86
    if:
      type: text
      regex: (?i)^gdi32\.dll$
