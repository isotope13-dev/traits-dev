defaults:
  platforms: [windows]
  for: [binaries, scripts, source]
traits:
  - id: fodhelper-exe-reference
    desc: References fodhelper auto-elevated binary
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)fodhelper\.exe'
    unless:
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
      - id: micro-behaviors/fs/path/system::winsxs-assembly-path
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/tool/detection/debian-security-tracker::security-tracker-cve-leaf
      - id: metadata/file/naming::generated-attack-map-context
