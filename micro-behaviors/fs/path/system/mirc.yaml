defaults:
  platforms: [unix, windows]
  for: [mirc, text, data]
traits:
  - id: mirc-windows-system-directory-reference
    desc: mIRC variable names a Windows system directory
    crit: notable
    conf: 0.95
    if:
      type: text
      # A directory component, not arbitrary 'system' text in a path.
      regex: '(?im)^%mircdir[ \t]+[A-Z]:\\windows\\(system(32)?|syswow64)(\\|[ \t]*\r?$)'
