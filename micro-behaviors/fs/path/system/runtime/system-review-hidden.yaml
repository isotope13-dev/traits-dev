defaults:
  platforms: [windows, unix]
  for: [scripts, shell, python, javascript, pe, elf]
traits:
  - id: hidden-sbin-reference
    # A dotfile reference alone does not establish concealment or execution.
    desc: References a dotfile path under sbin
    crit: notable
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(^|[\s"'':;,=])/(usr/)?sbin/\.\w[\w-]{2,}'
  - id: hidden-local-system-bin-reference
    desc: References a local system binary dotfile path
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(^|[\s"'':;,=])/usr/local/(s?bin|libexec)/\.\w[\w-]{2,}'
  - id: hidden-usr-bin-reference
    desc: References a dotfile path under /usr/bin
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(^|[\s"'':;,=])/usr/bin/\.\w[\w-]{2,}'
composite_rules:
  - id: hidden-system-bin-reference
    desc: References a system binary directory dotfile
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/fs/path/system/runtime::hidden-sbin-reference
      - id: micro-behaviors/fs/path/system/runtime::hidden-local-system-bin-reference
      - id: micro-behaviors/fs/path/system/runtime::hidden-usr-bin-reference
