defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: system32-charmap-path-reference
    desc: System32 charmap.exe path reference
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: '\System32\charmap.exe'
  - id: system32-calc-path-reference
    desc: System32 calc.exe path reference
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: '\System32\calc.exe'
  - id: system32-applicationframehost-path-reference
    desc: System32 ApplicationFrameHost.exe path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '\System32\ApplicationFrameHost.exe'
