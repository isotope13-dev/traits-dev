defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: system32-substr
    desc: System32 substring reference
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: System32
  - id: whitespace-spoofed-windows-system-path
    desc: Whitespace-spoofed Windows system path
    crit: suspicious
    conf: 0.99
    attack: T1036
    platforms: [windows]
    for: [scripts, binaries, source]
    unless:
      - id: well-known/lib/platform/wine::wine-compatibility-test-source
    if:
      type: text
      # Accept both runtime paths and source literals where each separator is
      # escaped. A space between "Windows" and the separator changes the
      # directory identity while remaining easy to miss in logs and allowlists.
      regex: '(?i)\b[A-Z]:\\{1,2}Windows[ \t]+\\{1,2}(System32|SysWOW64)(\\{1,2}|["''\s]|$)'
  - id: windows-system32
    desc: Windows System32 directory reference
    crit: notable
    conf: 0.66
    for: [scripts, binaries, html]
    if:
      type: text
      regex: '(?i)[Cc]:\\Windows\\System32\\'

  - id: windows-system-directory
    desc: References the C:\Windows\System directory
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [pe, dll, scripts, dos_com, data]
    if:
      type: text
      # System32 is a different directory; an optional slash previously
      # accepted its System prefix.
      regex: '(?i)C:\\Windows\\System(\\|$)'

  - id: javascript-windows-system32
    desc: JavaScript System32 path
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: string_literal
      regex: 'System32\\\\(\$\{|[A-Za-z_])'
    unless:
      - id: metadata/lang/source/declaration::pony-method-declaration-syntax
  - id: windows-system-drop-template
    desc: Windows system path format string
    crit: notable
    conf: 0.88
    platforms: [windows]
    if:
      type: text
      regex: '^[Cc]:\\[Ww]indows\\([Ss]ystem32\\|[Ss]ystem\\)?%s$'
  - id: systemroot-system32-env-path
    for: [scripts, binaries, lnk]
    desc: References %SystemRoot%\System32 path
    crit: notable
    conf: 0.85
    platforms: [windows]
    if:
      type: text
      substr: '%SystemRoot%\System32\'
