defaults:
  platforms: [windows, unix]
  for: [scripts, source, data, elf]
  crit: notable
  conf: 1.0

traits:
  - id: hidden-atomic-update-staging-path
    desc: Hidden path in system binary directory
    if:
      type: text
      regex: '/usr/(local/)?(s?bin|libexec)/\.\w[\w.-]*(\.(X{6,}|[a-z]{3,})\b|\.\$[\$\w]+|-new\b)'
  - id: move-system-binary-to-original-backup
    desc: Moves system binary to original backup
    if:
      type: text
      regex: 'mv\s+(-f\s+)?/usr/(local/)?s?bin/\w+\s+/usr/(local/)?s?bin/\.\w+-orig\b'
  - id: restore-system-binary-original-backup
    desc: Restores original system binary backup
    if:
      type: text
      regex: 'mv\s+(-f\s+)?/usr/(local/)?s?bin/\.\w+-orig\s+/usr/(local/)?s?bin/\w+'

composite_rules:
  - id: hidden-original-backup-and-restore
    desc: Hidden original binary backup and restore
    crit: exception
    near_lines: 30
    all:
      - id: move-system-binary-to-original-backup
      - id: restore-system-binary-original-backup
