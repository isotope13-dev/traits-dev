defaults:
  platforms: [windows]
  for: [text, xml, powershell, batch, pe]
  crit: suspicious
  conf: 0.99
  attack: T1036.005

traits:
  - id: base64-whitespace-system-path
    desc: Base64 spoofed Windows system path
    if:
      type: encoded
      encoding: base64
      regex: '(?i)[A-Z]:\\Windows +\\(System32|SysWOW64)\b'
