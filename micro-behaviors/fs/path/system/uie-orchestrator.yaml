defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.98

traits:
  - id: uie-orchestrator-update-path
    desc: References UUS orchestrator executable path
    if:
      type: text
      regex: '(?i)\buus[\\/]+(amd64|arm64|x86|x64)[\\/]+UIEOrchestrator\.exe\b'
