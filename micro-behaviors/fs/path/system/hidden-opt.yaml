defaults:
  platforms: [windows, unix]
  for: [scripts, shell, python, javascript, pe, elf]
traits:
  - id: hidden-opt-path-reference
    desc: Hidden /opt dotfile path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(^|[\s"'':;,=])/opt/\.\w[\w-]{2,}([/\s"'':;,]|$)'
    not:
      - substr: /.aarch
      - substr: /.x86_64
      - substr: /.arm64
      - substr: /.riscv
    unless:
      - id: metadata/file/magic/identity::php-archive
      - id: well-known/lib/platform/wine/
      - id: well-known/app/storage/community-scripts-proxmoxve::bitmagnet-installer-context
      - id: metadata/package/files/system-package::os-package-manager-library
    downgrade:
      any:
        - id: metadata/binary/provenance/
