defaults:
  platforms:
    - unix
    - windows
  for: [elf]
composite_rules:
  - id: power-utility-path-set
    desc: Linux reboot and shutdown utility paths
    crit: notable
    conf: 0.94
    platforms: [linux, android]
    for: [source, binaries, scripts]
    needs: 2
    any:
      - id: micro-behaviors/fs/path/system/power::reboot-utility-path
      - id: micro-behaviors/fs/path/system/power::shutdown-utility-path
      - id: micro-behaviors/fs/path/system/power::halt-utility-path
      - id: micro-behaviors/fs/path/system/power::poweroff-utility-path
