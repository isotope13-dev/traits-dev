# macOS privileged helper install location. A privileged-install surface, not
# a credential -- a helper dropped here runs with elevated rights.
defaults:
  platforms:
    - macos
    - ios
  crit: notable
  conf: 0.8
  for:
    - scripts
    - source
    - binaries

traits:
  - id: privileged-helper-tools-path
    desc: References macOS privileged helper directory
    conf: 0.9
    if:
      type: text
      substr: /Library/PrivilegedHelperTools
