defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries, batch]
traits:
  - id: legacy-boot-config
    desc: References DOS boot configuration files
    crit: notable
    conf: 0.8
    mbc: E1083
    attack: T1083
    if:
      type: text
      regex: (?i)\b(config\.sys|fdconfig\.sys|autoexec\.bat|fdauto\.bat)\b
  - id: batch-windows-dir-change
    desc: Batch changes into a Windows directory
    crit: notable
    conf: 0.88
    for: [batch]
    if:
      type: text
      regex: '(?i)\bcd\s+(win|windows|wind|windos|win95|wind95|win-95)\b'
