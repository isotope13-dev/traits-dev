traits:
  - id: public-directory-executable-path-reference
    desc: Public-directory executable path
    crit: notable
    conf: 0.92
    platforms: [windows]
    for: [batch, c, cpp, csharp, go, rust, python, powershell, javascript, typescript]
    if:
      type: text
      regex: '(?i)[\\/]Users[\\/]Public[\\/][^"\r\n]{0,120}\.exe\b'
