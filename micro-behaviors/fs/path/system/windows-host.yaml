traits:
- id: system32-svchost-path
  desc: Windows System32 svchost executable path
  for:
  - pe
  - dll
  platforms:
  - windows
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: (?i)system32[/\\]+svchost\.exe
  unless:
  - id: well-known/app/utility/360-file-guard::360-file-guard-identity
  - id: well-known/app/system/iobit::iobit-component-context
  - id: micro-behaviors/os/service/host::svchost-k-service-group
  downgrade:
    any:
    - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
