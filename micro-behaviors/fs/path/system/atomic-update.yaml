defaults:
  platforms: [windows, unix]
  for: [scripts, source, data, elf]
  crit: notable
  conf: 1.0

traits:
  - id: hidden-atomic-update-staging-path
    desc: Hidden atomic-update staging path
    if:
      type: text
      regex: '/usr/local/(bin|libexec)/\.\w[\w-]*(\.(new|tmp|X{6,}|[a-z]{4,})\b|\.\$\$|\.\$\w+)'
