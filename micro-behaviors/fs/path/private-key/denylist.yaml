# Security guards keep private-key filenames in a read-deny list. Defensive
# policy, not a key being read -- referenced from `unless:` as benign context.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: denylist-context
    desc: SSH private-key filenames in a path denylist
    crit: baseline
    conf: 0.98
    if:
      type: text
      regex: 'DEFAULT_PATH_DENY\s*=\s*\[[^\]]{0,400}[/"'']id_(rsa|ed25519|ecdsa)'
