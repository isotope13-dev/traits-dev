# GnuPG's private-key stores, including the modern agent directory and the
# legacy secret keyring. Public keyrings and gpg.conf are not private keys.
# A reference alone does not establish a read, collection or export.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.98
traits:
  - id: gnupg-private-key-store-path
    desc: GnuPG private-key store path literal
    if:
      type: literal
      exclude_docstrings: true
      regex: '(^|[/\\])(private-keys-v1\.d|secring\.gpg)([/\\]|$)'
