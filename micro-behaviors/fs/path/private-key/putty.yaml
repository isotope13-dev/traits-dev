defaults:
  platforms: [unix, windows]
  for: [source, markdown, html, text, binaries]
traits:
  - id: putty-key-extension-reference
    desc: References PuTTY private-key extension
    crit: notable
    conf: 0.75
    attack: T1552.004
    for: [python, javascript, powershell, perl, pe, macho]
    if:
      type: literal
      regex: \.ppk\b|["']\.ppk["']
    unless:
      - id: metadata/package/config::sensitive-file-exclusion-list
      # This hit is a four-byte coincidence inside a verified QSetup SFX
      # payload, not a path reference in the installer's mapped code.
      - id: metadata/binary/installer/sfx::qsetup-signed-self-extracting-installer-context
