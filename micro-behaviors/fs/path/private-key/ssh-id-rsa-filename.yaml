defaults:
  for: [shell, python, javascript, powershell, c, cpp]
  platforms: [linux, macos, windows]

composite_rules:
- id: ssh-id-rsa-filename-reference
  desc: SSH id_rsa filename reference
  crit: notable
  conf: 0.6
  all:
  - id: micro-behaviors/fs/path/private-key::id-rsa
  downgrade:
    any:
    - id: micro-behaviors/communications/ssh/connect::openssh
    - id: micro-behaviors/fs/write/credential::ssh-deploy-key-provisioning
    - id: well-known/tool/detection/ai-guardrail/
    - type: basename
      regex: ^ssh(-.{1,32})?(\.exe)?$
  unless:
  - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
