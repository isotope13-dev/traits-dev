# Windows DPAPI master keys: the OS-held secret that unwraps every other
# DPAPI-protected credential on the machine.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, rust, go, python, powershell]
  crit: notable
  conf: 0.9

traits:
  - id: windows-dpapi-master-key-path
    desc: Windows DPAPI master-key path reference
    attack: T1555
    if:
      type: text
      regex: '(?i)Protect[/\\]+S-1-'
