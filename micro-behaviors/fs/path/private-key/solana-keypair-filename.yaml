# Solana CLI keypair convention: `solana-keygen new` writes the ed25519
# keypair to id.json (its default --outfile, and the file `solana` reads via
# the default --keypair path). A reference to that filename is private-key
# material evidence — the same subject family as the id_rsa/id_ecdsa
# filename rules in this directory — not an application config file.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, go, rust, java, csharp, powershell]
  crit: notable
  conf: 0.8

traits:
  - id: id-json-filename-text
    desc: Solana keypair id.json filename in text
    platforms: [macos]
    for: [applescript, macho]
    if:
      type: text
      # Word-bounded: the bare substring also matched session-artifact names
      # such as invalid-resume-id.jsonl.
      regex: '\bid\.json\b'

  - id: id-json-filename-literal
    desc: Solana keypair id.json filename literal
    if:
      type: literal
      kind: string
      exact: id.json

  - id: id-json-filename-encoded
    desc: Decoded Solana keypair id.json filename
    if:
      type: encoded
      exact: id.json
