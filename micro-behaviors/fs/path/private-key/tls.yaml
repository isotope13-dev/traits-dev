# Private key material.

defaults:
  platforms: [unix]
  for: [go, elf, c, cpp, objc, python]

traits:
  - id: tls-client-key-path
    desc: TLS client.key file path
    crit: notable
    conf: 0.85
    if:
      type: text
      # Bare `client.key` is a common TLS KeyFile example (Consul, etc.).
      # Keep this to OpenVPN-shaped paths.
      regex: '(?i)openvpn.{0,40}client\.key'
