defaults:
  platforms: [netscaler, appliance, unix]
  for: [scripts, binaries, go, java, kotlin, csharp, swift, zig, elf]
  attack: T1041

traits:
  - id: netscaler-ssl-material-path
    desc: NetScaler SSL material path
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '/nsconfig/ssl/.{1,80}\.(pem|key)\b'
