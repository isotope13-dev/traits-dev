defaults:
  crit: notable
  platforms: [android, unix, windows]
  for: [swift]

traits:
  - id: swift-ssh-rsa-key-path
    desc: SSH RSA private-key filename reference
    conf: 0.93
    if:
      type: text
      substr: "id_rsa"

  - id: swift-ssh-ed25519-key-path
    desc: SSH ED25519 private-key filename reference
    conf: 0.93
    if:
      type: text
      substr: "id_ed25519"

  - id: swift-ssh-ecdsa-key-path
    desc: SSH ECDSA private-key filename reference
    conf: 0.9
    if:
      type: text
      substr: "id_ecdsa"

  - id: swift-ssh-dsa-key-path
    desc: SSH DSA private-key filename reference
    conf: 0.9
    if:
      type: text
      substr: "id_dsa"
