# Paths to private key material: the secret half of a keypair, a keystore, or
# an OS master key. Filed by what the file *is*; the holder (ssh, TLS, Java,
# DPAPI) is the filename, which is not part of the trait id.

defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

traits:
  - id: pem-file-extension-reference
    desc: References a PEM certificate or key file
    conf: 0.75
    attack: T1552.004
    if:
      type: string_literal
      regex: '\.pem\b|["'']\.pem["'']'
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/package/testing/harness/runtime/
      - id: micro-behaviors/crypto/certificate/usage
      - id: well-known/app/system/crunr::crunr-key-path
      - id: metadata/package/config::secret-file-classifier-function
      - id: micro-behaviors/communications/http/services/aws-ec2::ec2-create-key-pair
      - id: metadata/library/cloud-sdk::aws-python-sdk-source
      # UI file-type allowlists are not sensitive-file references. Auth0's
      # upload controls use `.pem` as a permitted certificate format.
      - type: text
        regex: '(?i)\b(?:accept|FileUpload)\b[^\n]{0,200}\.pem'
  - id: ssh-private-key-filename-ed25519
    desc: id_ed25519 filename constant
    crit: notable
    for: [binaries, scripts, java, class, kotlin, c, cpp, objc, rust, zig]
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_.-])id_ed25519($|[^A-Za-z0-9_.-])'
    unless:
      - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
      # Markus and similar security guards put these names in an explicit
      # denylist; that is defensive policy, not filename enumeration.
      - id: micro-behaviors/fs/path/private-key::denylist-context
  - id: ssh-private-key-filename-ecdsa
    desc: id_ecdsa filename constant
    crit: notable
    for: [binaries, scripts, java, class, kotlin, c, cpp, objc, rust, zig]
    # Word boundary (matching the id_rsa sibling): a bare substr matched the
    # SSH key filename embedded inside crypto OID symbol names — OpenSSL's
    # der_ec.h defines `ossl_der_oid_ecdsa_with_SHA1` and
    # `id_ecdsa_with_sha3_224`, none of which is the `~/.ssh/id_ecdsa` key file.
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_.-])id_ecdsa($|[^A-Za-z0-9_.-])'
    unless:
      - id: micro-behaviors/fs/path/private-key::denylist-context
  - id: ssh-private-key-filename-rsa
    desc: id_rsa filename constant
    crit: notable
    for: [javascript, typescript, python, ruby, php, perl, shell, powershell, binaries, java, class, kotlin, c, cpp, rust, zig]
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_.-])id_rsa($|[^A-Za-z0-9_.-])'
    unless:
      - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
      - id: micro-behaviors/fs/path/private-key::denylist-context
  - id: ssh-private-key
    desc: SSH private-key path literal
    crit: notable
    for: [binaries, scripts, python, java, class, kotlin, c, cpp, objc, go, rust, zig]
    if:
      type: text
      regex: '(?i)\.ssh[/\\]id_(rsa|dsa|ecdsa|ed25519)\b'
    downgrade:
      any:
        # The three named ssh traits, the `ssh`/`scp` basename and the REPL
        # transcript were one idea spelled five ways: the path shows up in ssh
        # tooling or in documentation, not in code reading someone's key.
        - id: micro-behaviors/fs/path/sensitive/credentials::ssh-tooling-or-transcript-context
        - id: micro-behaviors/process/interpreter/vm/
        - type: text
          substr: safe_eval(
    unless:
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
      - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
  - id: shell-ssh-private-key-path-pair
    desc: Shell references two SSH key paths
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: '\.ssh/id_rsa[\s\S]{0,260}\.ssh/id_ed25519|\.ssh/id_ed25519[\s\S]{0,260}\.ssh/id_rsa'
  - id: ssh-private-key-existence-check
    desc: Checks whether an SSH key exists
    crit: notable
    conf: 0.85
    for: [shell]
    if:
      type: text
      regex: '-f\s+[^\n]{0,30}id_(rsa|dsa|ecdsa|ed25519)'
  - id: dropbear-key-path
    desc: Dropbear host-key path reference
    crit: notable
    conf: 0.9
    for: [scripts, binaries, pyc]
    platforms: [unix, openwrt]
    if:
      type: text
      regex: '/etc/dropbear/(dropbear_|id_|ssh_host_)[A-Za-z0-9_-]{0,40}'
    unless:
      - id: well-known/app/network/dropbear::server-binary
  - id: private-key-suffix
    desc: Private key file suffix
    crit: component
    conf: 0.8
    if:
      type: string_literal
      regex: '(^|[/~\\])[^/\\\s]{1,120}\.(key|priv)$'
  - id: private-pem-suffix
    desc: Private PEM file suffix
    crit: component
    conf: 0.8
    if:
      type: string_literal
      regex: '(^|[/~\\])[^/\\\s]*(private|secret|key)[^/\\\s]*\.pem$'
  - id: keystore-suffix
    desc: Keystore file path suffix
    crit: component
    conf: 0.8
    # Require a path-shaped literal so TLS option property names like
    # `options.pfx` (xmlhttprequest-ssl) are not treated as credential paths.
    if:
      type: string_literal
      regex: '(^|[/~\\])[^/\\\s]{1,120}\.(p12|pfx|p8)$'
  - id: java-keystore-extension-reference
    desc: References a Java keystore filename extension
    crit: component
    conf: 0.8
    for: [python, javascript, powershell, perl, pe]
    if:
      type: text
      regex: '\.(jks|keystore)\b|["'']\.(jks|keystore)["'']'
  - id: private-keys-dir-segment
    desc: Private directory contains key file
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: '(?i)/(private|secret|secrets|keys)/[^/\s]{1,80}\.(key|pem|p12|jks)\b'
    not:
      # macOS Unix-domain socket paths use /private/tmp, not a key store.
      - regex: '/private/tmp/'
      # REST/API path segments (e.g. /api/v2/.../secrets/, /private/legacy/)
      # and Go package source paths (.../secret/secret.go) are not filesystem
      # credential-store directories.
      - regex: '/(api|private/legacy)/'
      - regex: '/(private|secret|secrets|keys)/[^/\s]{1,80}\.go\b'
    unless:
      # The container/Kubernetes secrets mount (/run/secrets, /var/run/secrets)
      # has its own canonical traits under micro-behaviors/os/container/runtime.
      # Without this, one injected-volume path is counted a second time as a
      # private-key directory and inflates needs:N credential-store clusters.
      - id: micro-behaviors/os/container/runtime::container-runtime-secrets-path
      - id: metadata/lang/scripted::dts-declaration-file
composite_rules:
  - id: ssh-private-key-filename-enum
    desc: Enumerates SSH private key filenames
    crit: notable
    conf: 0.85
    any:
      - id: ssh-private-key-filename-ed25519
      - id: ssh-private-key-filename-ecdsa
      - id: ssh-private-key-filename-rsa
    needs: 2
    unless:
      - id: metadata/package/config::sensitive-file-exclusion-list
      - id: well-known/tool/detection/security-scanner::push-guard-defensive-context
      - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
      - id: micro-behaviors/fs/path/private-key::denylist-context
    downgrade:
      any:
        - id: micro-behaviors/communications/ssh/connect::openssh
        - id: micro-behaviors/communications/ssh/client::libssh
        - type: basename
          regex: '^ssh(-.+)?(\.exe)?$'
