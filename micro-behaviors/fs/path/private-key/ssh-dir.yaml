# Private key material and the directories that hold it.

defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript]

traits:
  - id: keys
    for: [scripts, binaries]
    desc: SSH keys directory path literal
    crit: component
    conf: 0.8
    attack: T1552.004
    if:
      type: text
      substr: /.ssh/
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
      - id: metadata/file/format/structured::sourcemap-sources-content
      # ECC.py documents an OpenSSH path but does not access the filesystem.
      - id: well-known/lib/crypto/pycryptodome::pycryptodome-bytecode-path
