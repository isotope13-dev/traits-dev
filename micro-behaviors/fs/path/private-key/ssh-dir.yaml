# Private key material and the directories that hold it.

# Rationale carried over with these traits:
# `/.ssh/` is a universal Unix path, not a macOS one. This trait lived in
# macos.yaml under `platforms: [macos]`, so it could not match a Linux ELF or
# a Windows PE -- leaving SSH key-directory access (T1552.004) undetected in
# compiled binaries, and silently scoping all ten of its consumers to macOS.
# Moved here from fs/path/sensitive/ssh/ with the typed split; the id is now
# micro-behaviors/fs/path/private-key::keys.

defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript]

traits:
  - id: keys
    for: [scripts, binaries]
    desc: SSH keys directory path literal
    crit: component
    conf: 0.8
    attack: T1552.004
    if:
      type: text
      substr: /.ssh/
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
      - id: metadata/file/format/structured::sourcemap-sources-content
# ECC.py documents an OpenSSH path but does not access the filesystem.
      - id: well-known/lib/crypto/pycryptodome::pycryptodome-bytecode-path
