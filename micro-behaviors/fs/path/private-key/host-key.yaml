# SSH *host* keys -- the server's identity, distinct from a user's key.
defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript]

traits:
  - id: host-private-key-path-set
    desc: References RSA and Ed25519 SSH host-key paths
    crit: notable
    conf: 0.92
    for: [binaries]
    platforms: [unix]
    attack: T1552.004
    if:
      type: text
      regex: '/etc/ssh/ssh_host_rsa_key[\s\S]{0,220}/etc/ssh/ssh_host_ed25519_key'
