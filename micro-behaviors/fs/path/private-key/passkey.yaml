# Private key material.

defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, c, cpp, rust, go, csharp]
  crit: notable
  conf: 0.85

traits:
  - id: chrome-passkey-enclave-state-file
    desc: Chrome passkey enclave state file
    conf: 0.9
    if:
      type: text
      substr: passkey_enclave_state

  # The profile's Sync Data LevelDB — where synced WebAuthn credential records
  # are persisted. Distinct from the Local Storage leveldb (see generic.yaml);
  # this is the passkey/sync store specifically. Matched across a path
  # separator or a path.join() argument break.
