# Key material identified by filename shape rather than a known product path.
defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, source]

traits:
  - id: master-key-file
    desc: Master key credential file
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: (^|[/~\\\\])master\.key\b
