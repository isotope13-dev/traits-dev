traits:
- id: ssh-id-dsa-filename-reference
  desc: SSH id_dsa filename reference
  conf: 0.6
  if:
    type: text
    regex: (\.ssh[/\\]|[/\\])id_dsa$|^id_dsa$
  downgrade:
    any:
    - id: micro-behaviors/communications/ssh/connect::openssh
    - type: basename
      regex: ^ssh(-.{1,32})?(\.exe)?$
  unless:
  - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
- id: ssh-id-ecdsa-filename-reference
  desc: SSH id_ecdsa filename reference
  conf: 0.6
  if:
    type: text
    regex: (\.ssh[/\\]|[/\\])id_ecdsa$|^id_ecdsa$
  downgrade:
    any:
    - id: micro-behaviors/communications/ssh/connect::openssh
    - type: basename
      regex: ^ssh(-.{1,32})?(\.exe)?$
  unless:
  - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
- id: ssh-id-ed25519-filename-reference
  desc: SSH id_ed25519 filename reference
  conf: 0.6
  if:
    type: text
    regex: (\.ssh[/\\]|[/\\])id_ed25519$|^id_ed25519$
  downgrade:
    any:
    - id: micro-behaviors/communications/ssh/connect::openssh
    - type: basename
      regex: ^ssh(-.{1,32})?(\.exe)?$
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - shell
  - python
  - javascript
  - powershell
  - c
  - cpp
  crit: notable
