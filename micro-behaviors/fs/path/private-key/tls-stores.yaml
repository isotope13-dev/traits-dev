# Conventional TLS private-key resources targeted by the LiteLLM collector.
# These are path references, not proof of reading or exporting key material.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.98

traits:
  - id: tls-system-private-key-directory-path
    desc: System TLS private-key directory path literal
    if:
      type: literal
      exclude_docstrings: true
      regex: '^/etc/(ssl/private|pki/tls/private)(/|$)'

