# SSH private-key filename constants (id_rsa, id_ecdsa, id_ed25519)
# in JVM bytecode or Kotlin source. A filename alone is a reference: the
# credential-collection objectives add the file-read and transfer evidence.
defaults:
  platforms: [freebsd, unix]
  for: [kotlin, class]
  attack: T1552.004

composite_rules:
  # Named for the matcher: SSH key *filename strings* in a JVM artifact. The
  # old "Kotlin reads ... paths" name claimed both a language (these fire on
  # Java classes too) and a read behavior (a bare constant is not a read).
  - id: jvm-ssh-key-filename-strings
    desc: SSH private-key filename in JVM code
    crit: notable
    conf: 0.92
    # Grouped over the canonical filename atoms in ssh.yaml (their word
    # boundaries already exclude ASN.1 OID names such as id_dsa_with_sha1
    # and id_ecdsa_with_sha3_256); this rule adds the JVM-specific
    # implementer and non-code exclusions below.
    any:
      - id: ssh-private-key-filename-rsa
      - id: ssh-private-key-filename-ecdsa
      - id: ssh-private-key-filename-ed25519
    unless:
      # A class with no method references contains no executable code, so its
      # key-filename constants cannot be read by anything in it. Scoped to
      # class files; source findings are unaffected by the out-of-scope leg.
      - id: metadata/file/function::jvm-class-no-code
      # Implementers, not callers: the SSH and crypto libraries whose job is
      # to know these filenames. `well-known/lib/network/jsch/` was already
      # excluded on the collection composites but never on this leaf, which is
      # what produced the standalone suspicious finding. Bouncy Castle is here
      # for the bare `id_dsa` its X9 OID table still carries after the
      # boundary fix; JGit's SshConstants is literally the constant list.
      # sshj (net.schmizz.sshj) is the same kind of implementer as JSch: the
      # SSH client JetBrains IDEs and Jenkins plugins ship, carrying default
      # key-file names for authentication rather than collection.
      - id: well-known/lib/network/jsch/
      - id: well-known/lib/network/sshj/
      - id: well-known/lib/network/trilead-ssh2/
      - id: well-known/lib/crypto/jgit/
      - id: well-known/lib/crypto/bouncycastle/
      # Documentation that the language detector mistakes for Kotlin source
      # shows id_rsa examples; prose is not a program reading a key.
      - id: metadata/file/extension/identity::markdown-file-basename
