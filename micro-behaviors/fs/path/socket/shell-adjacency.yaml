defaults:
  platforms: [linux, unix, macos]
  for: [elf, macho]

composite_rules:
  - id: unix-socket-path-beside-shell
    desc: Unix socket path stored beside a shell path
    crit: notable
    conf: 0.9
    near_bytes: 1024
    all:
      - id: micro-behaviors/fs/path/socket::non-stock-unix-socket-path
    any:
      - id: micro-behaviors/process/create/shell/native::bash-binary-name
      - id: micro-behaviors/process/create/shell/spawn::bin-sh-binary-text
