# Socket path observations do not prove a connection or container operation.
traits:
- platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  - go
  id: docker-sock
  desc: Docker socket path
  crit: notable
  conf: 0.7
  if:
    type: string_literal
    substr: /run/docker.sock
- platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  - go
  id: docker-var-run-sock
  desc: Docker socket path
  crit: notable
  conf: 0.75
  if:
    type: text
    substr: /var/run/docker.sock
  unless:
  - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
- crit: notable
  platforms:
  - unix
  for:
  - scripts
  - binaries
  id: docker-socket-path-scripts-binaries
  desc: Docker daemon Unix socket path reference
  conf: 0.9
  if:
    type: string_literal
    exact: /var/run/docker.sock
- crit: notable
  platforms:
  - unix
  for:
  - source
  id: docker-socket-path-source
  desc: Docker daemon socket path in source
  conf: 0.9
  if:
    type: string_literal
    kind: string
    exact: /var/run/docker.sock
- crit: notable
  platforms:
  - unix
  for:
  - scripts
  - source
  id: docker-socket-path-percent-encoded
  desc: Percent-encoded Docker daemon socket path
  conf: 0.92
  if:
    type: string_literal
    regex: (?i)%2fvar%2frun%2fdocker\.sock
composite_rules:
- crit: notable
  platforms:
  - unix
  for:
  - scripts
  - source
  - binaries
  id: docker-socket-path
  desc: Docker daemon socket path reference
  conf: 0.9
  any:
  - id: micro-behaviors/fs/path/socket::docker-socket-path-scripts-binaries
  - id: micro-behaviors/fs/path/socket::docker-socket-path-source
  - id: micro-behaviors/fs/path/socket::docker-socket-path-percent-encoded
