# Native endpoint path references; stock daemon paths remain excluded.
traits:
- crit: notable
  platforms:
  - linux
  - macos
  id: non-stock-unix-socket-path
  desc: Names a non-stock Unix socket path
  conf: 0.9
  for:
  - elf
  - macho
  - so
  - dylib
  if:
    type: text
    regex: ^/(run|var/run|tmp)/[^\r\n]{1,180}\.(sock(et)?|pipe)$
  not:
  - substr: example.com
  - substr: example.org
  - substr: example.net
  - substr: mysqld.sock
  - substr: mysql.sock
  - substr: /haproxy/
  - substr: docker.sock
  - substr: containerd.sock
