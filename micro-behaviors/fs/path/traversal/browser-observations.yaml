defaults:
  for:
  - html
  - makefile
  - vbs
  platforms:
  - windows
  crit: notable
  conf: 0.98
traits:
- id: parent-relative-executable-path
  desc: Parent-relative Windows path to an executable
  if:
    type: text
    regex: (?i)(\.\.\\{1,2}){3}.{0,80}\.exe
- id: html-multiple-parent-path
  desc: HTML contains multiple parent-path segments
  if:
    type: text
    regex: (\.\.[\\/]{1,2}){3,}
  for:
  - html
  platforms:
  - windows
  - unix
  conf: 0.96
