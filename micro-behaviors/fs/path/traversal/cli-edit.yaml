defaults:
  platforms: [fortios, unix]
  for: [scripts, source]

traits:
  # The edit command alone does not identify the configuration section or
  # establish an exploit. Require that context in the consuming objective.
  - id: cli-edit-parent-directory-path
    desc: CLI edit names repeated parent-directory path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?im)^[ \t]*edit\s+["'']?(\.\.[\\/]){2,}[^\n"'']{1,120}'
