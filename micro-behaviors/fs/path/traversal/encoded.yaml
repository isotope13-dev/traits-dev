defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: encoded-parent-dir-traversal
    desc: URL-encoded parent-directory traversal
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)((%2e%2e|\.\.)(%2f|%5c)){2,12}
  - id: encoded-parent-directory-segment
    desc: URL-encoded parent-directory segment literal
    crit: notable
    conf: 0.95
    if:
      type: literal
      regex: '(?i)^\.\.(%2f|%5c)$'
  - id: encoded-parent-directory-string-multiplication
    desc: Multiplies encoded parent-directory segment
    crit: notable
    conf: 0.96
    for: [python, ruby]
    if:
      type: text
      regex: '(?i)["''](%2e%2e|\.\.)(%2f|%5c)["'']\s*\*\s*([a-z_]\w*|[3-9]\d*)'
