defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: encoded-parent-dir-traversal
    desc: URL-encoded parent-directory traversal
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)((%2e%2e|\.\.)(%2f|%5c)){2,12}'
    unless:
      - id: well-known/tool/detection/kagesec::defensive-scanner-context
      - id: well-known/tool/offensive/
      - id: metadata/package/testing/
      # Sigma rules quote payloads as detection values. The field/modifier
      # syntax distinguishes a rule exemplar from code that sends the path.
      - type: text
        regex: '(?i)\bcs-uri-stem\|contains\s*:'
      # Design documentation may explicitly state that the implementation
      # does not use an encoded multi-level traversal payload.
      - type: text
        regex: '(?i)\b(no|not|never)\b[^\n]{0,80}(\.\.%2f){2}'
      # Security-review and security-fix copy quoting encoded `../` as the
      # hazard being described, decoded, or refused -- not a payload the
      # code sends. Nodemailer's RFC 2231 continuation guard documents its
      # fix by naming what a receiver reads back from the attack string.
      - type: text
        regex: 'after URL-decoding|decodes to|reads back as|emitted as'
      # Input-validation prose: a docstring that names the encoded payload it
      # rejects, next to the rejection vocabulary. Path-traversal guards
      # routinely quote the exact string they refuse, on either side of the
      # sentence, so accept the payload before or after the cue word.
      - type: text
        regex: '(?i)(reject|validat|sanitiz)[\s\S]{0,800}\.\.(%2f|%5c)'
      - type: text
        regex: '(?i)\.\.(%2f|%5c)[\s\S]{0,800}(reject|validat|sanitiz)'

  - id: encoded-parent-directory-segment
    desc: URL-encoded parent-directory segment literal
    crit: notable
    conf: 0.95
    if:
      type: literal
      regex: '(?i)^\.\.(%2f|%5c)$'
