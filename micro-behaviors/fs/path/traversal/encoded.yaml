defaults:
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  - id: encoded-parent-dir-traversal
    desc: URL-encoded parent-directory traversal
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)((%2e%2e|\.\.)(%2f|%5c)){2,12}'
    unless:
      - id: well-known/tool/detection/kagesec::defensive-scanner-context
      - id: well-known/tool/offensive/
      - id: metadata/package/documentation/security-testing::pentest-skill-methodology
      - id: metadata/file/profile/test-indications/
      - type: text
        regex: '(?i)\bcs-uri-stem\|contains\s*:'
      - type: text
        regex: (?i)\b(no|not|never)\b[^\n]{0,80}(\.\.%2f){2}
      - id: metadata/package/documentation/docstring::path-decoding-security-doc
      - type: text
        regex: (?i)(reject|validat|escap)[\s\S]{0,800}\.\.(%2f|%5c)
      - type: text
        regex: (?i)\.\.(%2f|%5c)[\s\S]{0,800}(reject|validat|escap)
  - id: encoded-parent-directory-segment
    desc: URL-encoded parent-directory segment literal
    crit: notable
    conf: 0.95
    if:
      type: literal
      regex: '(?i)^\.\.(%2f|%5c)$'
