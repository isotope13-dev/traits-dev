# A shell path containing parent hops is a path reference, not an exploit.
# The fax-selector composites supply the service abuse context.
defaults:
  platforms: [windows, unix]
  for: [source, scripts, text, data]

traits:
  - id: parent-traversal-windows-shell-path
    desc: Parent-relative Windows cmd shell path reference
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)(\.\.[/\\]){2,}Windows[/\\]System32[/\\]cmd(\.exe)?([\s&"'']|$)'

  - id: parent-traversal-unix-shell-path
    desc: Parent-relative Unix shell path reference
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(\.\./){2,}(usr/)?bin/(ba|da|z)?sh([\s&"'']|$)'

