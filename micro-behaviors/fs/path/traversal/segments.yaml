defaults:
  platforms: [windows, unix]
  for: [source, scripts, pe, dll]

traits:
  - id: repeated-parent-directory-segments
    desc: Repeated parent-directory traversal path
    crit: component
    conf: 0.94
    if:
      type: string_literal
      regex: '(\.\.[\\/]){2,12}[A-Za-z0-9_$ .\\/\-]{2,160}'
