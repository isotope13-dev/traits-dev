defaults:
  platforms: [windows, unix]
  for: [source, scripts, python, pe, dll]

traits:
  - id: repeated-parent-directory-segments
    desc: Path has repeated parent-directory segments
    crit: notable
    conf: 0.94
    if:
      type: string_literal
      regex: '(\.\.[\\/]){2,12}[A-Za-z0-9_$ .\\/\-]{2,160}'
      exclude_docstrings: true
    not:
      # A relative module specifier ('../../cose.js',
      # '../../../helpers/iso/index.js') is module resolution, not a
      # traversal payload: payload targets rarely end in a source extension.
      - regex: '^(\.\.[\\/])+[\w.\-\\/]+\.(js|mjs|cjs|ts|mts|cts|jsx|tsx|json)$'
      # A bare relative directory import ('../../hooks') names a sibling
      # module directory, not a traversal target: payloads descend into
      # named directories or sensitive files.
      - regex: '^(\.\.[\\/])+[\w.\-]+$'
      # A bare hops-only literal ('../../', '../../../') resolves to an
      # ancestor package root; it names no target, so there is nothing to
      # traverse to. The class above accepts dots and slashes, so trailing
      # hops otherwise read as a body. Runtime-built climbs stay covered by
      # the repeat and multiplication traits.
      - regex: '^(\.\.[\\/])+$'
      # A two-hop extensionless relative climb ('../../src/constants',
      # '../../core/extension/extension') reads as module resolution in JS/TS
      # sources. Longer climbs and file targets still fire: depth is the shape
      # that escapes a served tree.
      - regex: '^(\.\.[\\/]){2}([A-Za-z_$][\w$-]*[\\/]){0,2}[A-Za-z_$][\w$-]*$'

  - id: parent-directory-string-multiplication
    desc: Multiplies parent-directory path segment
    crit: notable
    conf: 0.97
    for:
    - python
    - ruby
    if:
      type: text
      regex: '["'']\.\.[\\/]["'']\s*\*\s*([3-9]|[1-9][0-9]+)'
    unless:
    - id: metadata/package/testing/presence/harness::python-test-file
  - id: parent-directory-string-repeat-call
    desc: Repeats parent-directory path segment
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']\.\.[\\/]["'']\.repeat\s*\(\s*([3-9]|[1-9][0-9]+)\s*\)'
    unless:
      - id: metadata/package/testing/presence/harness::test-directory
      - id: metadata/path::test-directory-component
      - id: metadata/filename/name-form::fuzz-corpus-path

  - id: parent-directory-list-join
    desc: Joins repeated parent-directory segments
    crit: notable
    conf: 0.97
    for: [python]
    if:
      # The PoC joins a multiplied [".."] list, rather than repeating "../".
      # Match executable syntax, including a variable or max() repetition count.
      type: tree-sitter
      query: |
        ((call
          function: (attribute
            object: (string) @separator
            attribute: (identifier) @method)
          arguments: (argument_list
            (binary_operator
              left: (list . (string) @segment .)
              operator: "*"
              right: (_)))) @path
          (#eq? @method "join")
          (#match? @separator "^[\"']/[\"']$")
          (#match? @segment "^[\"']\\.\\.[\"']$"))

  # Three or more parent hops into /etc/cron.d is the same class of path-plant
  # used when a network service is tricked into writing under cron's drop-in
  # directory (syslog path handling, upload APIs, etc.).
  - id: traversal-into-cron-d-path
    desc: Parent-directory traversal into /etc/cron.d
    crit: notable
    conf: 0.94
    if:
      type: literal
      regex: '(\.\./){3,}etc/cron\.d/'
      exclude_docstrings: true

  # Two or more parent hops into a deployed web-application root (Tomcat
  # webapps, IIS wwwroot, Apache htdocs, ...) steer a server-side write into
  # a live, web-served directory, so the dropped file becomes reachable over
  # HTTP and, for a server-executable page, executed on request. This is the
  # destination half of traversal-to-webshell upload chains; exploit
  # composites add the upload delivery that proves the write.
  - id: traversal-into-web-application-root
    desc: Traversal into web application root
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(\.\.[\\/]){2,}(webapps|wwwroot|htdocs|public_html|httpdocs)[\\/]'

composite_rules:
  - id: parent-directory-traversal-payload
    desc: Repeated parent-directory path or construction
    crit: notable
    conf: 0.94
    any:
      - id: parent-directory-string-multiplication
      - id: parent-directory-string-repeat-call
      - id: traversal-into-cron-d-path
      - id: repeated-parent-directory-segments
      - id: parent-directory-list-join
