defaults:
  platforms: [windows, unix]
  for: [source, scripts, python, pe, dll]

traits:
  - id: repeated-parent-directory-segments
    desc: Repeated parent-directory traversal path
    crit: component
    conf: 0.94
    if:
      type: string_literal
      regex: '(\.\.[\\/]){2,12}[A-Za-z0-9_$ .\\/\-]{2,160}'

  - id: parent-directory-string-multiplication
    desc: Multiplies parent-directory path segment
    crit: notable
    conf: 0.97
    for:
    - python
    - ruby
    if:
      type: text
      regex: '["'']\.\.[\\/]["'']\s*\*\s*([3-9]|[1-9][0-9]+)'
    unless:
    - id: metadata/package/testing/presence/harness::python-test-file
  - id: parent-directory-string-repeat-call
    desc: Repeats parent-directory path segment
    crit: suspicious
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']\.\.[\\/]["'']\.repeat\s*\(\s*([3-9]|[1-9][0-9]+)\s*\)'
    unless:
      - id: metadata/package/testing/presence/harness::test-directory
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/file/naming::fuzz-corpus-path

  # Three or more parent hops into /etc/cron.d is the same class of path-plant
  # used when a network service is tricked into writing under cron's drop-in
  # directory (syslog path handling, upload APIs, etc.).
  - id: traversal-into-cron-d-path
    desc: Parent-directory traversal into /etc/cron.d
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(\.\./){3,}etc/cron\.d/'

  # Two or more parent hops into a deployed web-application root (Tomcat
  # webapps, IIS wwwroot, Apache htdocs, ...) steer a server-side write into
  # a live, web-served directory, so the dropped file becomes reachable over
  # HTTP and, for a server-executable page, executed on request. This is the
  # destination half of traversal-to-webshell upload chains; exploit
  # composites add the upload delivery that proves the write.
  - id: traversal-into-web-application-root
    desc: Traversal into web application root
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(\.\.[\\/]){2,}(webapps|wwwroot|htdocs|public_html|httpdocs)[\\/]'

composite_rules:
  - id: parent-directory-traversal-payload
    desc: Builds multi-level parent-directory traversal
    crit: notable
    conf: 0.94
    any:
      - id: parent-directory-string-multiplication
      - id: parent-directory-string-repeat-call
      - id: traversal-into-cron-d-path
