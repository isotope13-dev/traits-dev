defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: suspicious
  conf: 0.97

traits:
  - id: nul-suffixed-parent-path-literal
    desc: Parent traversal path contains embedded NUL
    if:
      type: literal
      regex: '(\.\.[/\\]){2,}[^\x00\r\n]{1,180}\x00'
      exclude_docstrings: true
