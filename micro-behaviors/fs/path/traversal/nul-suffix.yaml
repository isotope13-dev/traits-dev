defaults:
  platforms: [unix, windows]
  # Shell and PowerShell string literals never treat backslash as an escape, so
  # a decoded NUL from `\0` in a plain Windows path (..\scripts\01-core\..) is
  # a decoder artifact, not runtime content (batch extracts no such literals).
  # Keep the languages whose `\0` decoding matches runtime semantics, where an
  # embedded NUL literal is real source intent.
  for: [scripts, source, -powershell, -shell, -batch]
  crit: suspicious
  conf: 0.97

traits:
  - id: nul-suffixed-parent-path-literal
    desc: Parent traversal path contains embedded NUL
    if:
      type: literal
      regex: '(\.\.[/\\]){2,}[^\x00\r\n]{1,180}\x00'
      exclude_docstrings: true
