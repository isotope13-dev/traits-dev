# An icon download record redirects its destination out of the asset tree
# into Windows' installed-programs directory. Require the neighboring checksum
# and URL fields: an ordinary relative icon reference is not a download target.
# Text matching binds the fields across CRLF/LF record lines; facts currently
# provide no structured INI field values.
defaults:
  platforms: [windows]
  for: [text]
traits:
  - id: icon-config-program-directory-traversal
    desc: Icon download traverses into Program Files
    crit: suspicious
    conf: 0.96
    if:
      type: text
      case_insensitive: true
      regex: '(?m)^icon=(\.\.[\\/])+Program Files\b[^\n]{1,512}\nmd5=\w{32}\s+url=https?://'
