defaults:
  platforms: [unix, windows]
  for: [python]

traits:
- id: repeated-parent-directory-text
  desc: Text contains repeated parent path segments
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \.\./(\.\./){2,}

- id: python-joins-named-filename
  desc: Python joins a filename argument
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'os\.path\.join\([^,\n]{1,80},\s*(filename|file_name|user_path|relative_path)\s*\)'

- id: python-opens-joined-path
  desc: Python opens a named variable
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: 'open\(\s*\w+\s*\)'

# A filename-named join close to an open is observable path handling, but it
# does not establish whether the value is input-derived, contained, or validated.
composite_rules:
- id: python-opens-path-near-filename-join
  desc: Python opens path near filename join
  crit: notable
  conf: 0.9
  all:
  - id: python-joins-named-filename
  - id: python-opens-joined-path
  near_lines: 8
