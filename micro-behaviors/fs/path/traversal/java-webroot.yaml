defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: java-webroot-parent-traversal
    desc: Parent-relative Java webroot path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: (?i)(\.\.[\\/]){1,12}[^\s"']{0,160}[\\/]webapps[\\/]ROOT[\\/]
    unless:
    - id: micro-behaviors/metaprogramming/generation::configured-assessment-plugin
