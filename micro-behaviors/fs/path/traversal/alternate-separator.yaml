defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: double-colon-parent-segments
    desc: Double-colon parent segments at path boundary
    crit: suspicious
    conf: 0.97
    if:
      type: literal
      # Require a path boundary; colon/dot shading in glyphs is not a path.
      regex: '(?i)(^|[/\\]|%(25){0,2}(2f|5c))((\.|%(25){0,2}2e){2}(:|%(25){0,2}3a){2}){2,32}([\w%.-]|$)'
