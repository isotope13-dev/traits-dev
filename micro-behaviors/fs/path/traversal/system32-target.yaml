# A parent-directory path that lands on a System32 binary, written near an
# HTTP URL: the shape of a download destination that climbs out of a working
# directory into the Windows system tree. A path observation only; the
# privilege-escalation composites add the installer that would write it.
defaults:
  platforms: [windows]
  for: [python, powershell, batch, pe, dll]

composite_rules:
  - id: system32-traversal-near-url
    desc: Traversal path to System32 binary near URL
    crit: notable
    conf: 0.95
    near_bytes: 1024
    all:
      - id: micro-behaviors/fs/path/traversal::repeated-parent-directory-segments
      - id: micro-behaviors/fs/path/binary::system32-executable-path
      - id: micro-behaviors/communications/url/scheme::http-url-literal
