# PEAR installs a command-line dispatcher named pearcmd.php. References to the
# dispatcher are neutral on their own, but become an include gadget when paired
# with traversal and query-string command arguments.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, data]
  crit: notable
  conf: 0.96

traits:
  - id: pear-command-script-path
    desc: References the PEAR command script
    if:
      type: text
      regex: '(?i)(^|[\\/]|%(25)?(2f|5c))pearcmd\.php\b'
