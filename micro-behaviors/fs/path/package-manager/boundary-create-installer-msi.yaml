defaults:
  platforms: [windows]
  for: [batch, powershell, vbs, javascript, python, scripts, lnk]
  attack: T1105,T1218.007

traits:
  - id: msiexec-programdata-msi
    desc: msiexec targets an MSI in ProgramData
    crit: suspicious
    conf: 0.95
    attack: T1218.007
    for: [powershell, batch, pe]
    if:
      type: text
      regex: (?i)msiexec(\.exe)?.{0,80}(C:\\ProgramData|%ProgramData%).{0,80}\.msi
