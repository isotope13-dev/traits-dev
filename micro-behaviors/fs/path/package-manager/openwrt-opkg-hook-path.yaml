defaults:
  platforms: [openwrt]
  for: [php, shell, javascript, typescript]
traits:
  - id: micro-behaviors/fs/path/package-manager::openwrt-opkg-post-install-dir
    desc: OpenWrt opkg post-install hook directory
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /etc/opkg/post-install.d/

  - id: micro-behaviors/fs/path/package-manager::openwrt-opkg-pre-install-dir
    desc: OpenWrt opkg pre-install hook directory
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /etc/opkg/pre-install.d/

