defaults:
  platforms: [macos]
  for: [shell, python, javascript, typescript]

traits:
  - id: homebrew-cellar-path
    desc: Homebrew Cellar directory path reference
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '/(opt/homebrew|usr/local)/Cellar/[A-Za-z0-9._@-]{1,60}/'

  - id: homebrew-bin-tool-path
    # /usr/local/bin is Intel-Mac Homebrew and also every Linux image.
    desc: References a Homebrew or /usr/local/bin tool
    crit: notable
    conf: 0.78
    if:
      type: text
      regex: '/(opt/homebrew|usr/local)/bin/[A-Za-z0-9._@-]{1,60}\b'
