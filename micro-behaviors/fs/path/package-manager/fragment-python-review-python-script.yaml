defaults:
  platforms:
    - unix
    - windows
  for:
    - python
traits:
  - id: localappdata-pip-text
    desc: LOCALAPPDATA and pip text nearby
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: LOCALAPPDATA[\s\S]{0,160}["']pip["']
  - id: localappdata-pip-exe-text
    desc: LOCALAPPDATA, pip and EXE text nearby
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: LOCALAPPDATA[\s\S]{0,160}[\"']pip[\"'][\s\S]{0,120}\.exe
  - id: dot-pip-exe-text
    desc: pip directory and EXE text nearby
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '[\"'']\.pip[\"''][\s\S]{0,120}\.exe'
composite_rules:
  - id: pip-exe-path-clues
    desc: pip and EXE path clues
    crit: notable
    conf: 0.92
    any:
      - id: micro-behaviors/fs/path/package-manager::localappdata-pip-exe-text
      - id: micro-behaviors/fs/path/package-manager::dot-pip-exe-text
