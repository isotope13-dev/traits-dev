defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85

traits:
- id: postinstall-root-npmrc-read
  desc: Postinstall references root npm configuration
  crit: suspicious
  conf: 0.97
  attack: "T1552.001"
  if:
    type: value
    path: "scripts.postinstall"
    substr: "/root/.npmrc"
