defaults:
  platforms: [windows]
  for: [batch, powershell, scripts, javascript]
traits:
  - id: get-pip-script-name-reference
    desc: get-pip.py text reference
    crit: notable
    conf: 0.86
    unless:
      - id: micro-behaviors/os/package-manager/dependency-setup::python-runtime-pip-install
      - id: micro-behaviors/os/package-manager/dependency-setup::ensurepip-bootstrap
      - id: well-known/app/system/crunr::crunr-demo-marker
      - id: well-known/app/ai/coding-agent/jaccoder::jaccoder-extension-context
    if:
      type: text
      regex: '(?i)\bget-pip\.py\b'
