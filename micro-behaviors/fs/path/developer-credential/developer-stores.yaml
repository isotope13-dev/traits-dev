# References spanning token files and secret configuration stores.

defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

traits:
  - id: go-user-secret-dotfiles
    desc: Secret dotfile path-list fragment
    crit: notable
    conf: 0.8
    for: [go]
    if:
      type: text
      regex: '(?s)\.(netrc.{0,500}(pgpass|my\.cnf)|pgpass.{0,500}netrc|my\.cnf.{0,500}netrc)'

composite_rules:
  - id: developer-credential-stores
    desc: References developer credential store paths
    crit: notable
    conf: 0.92
    for: [scripts, binaries, source]
    any:
      - id: micro-behaviors/fs/path/token::cloud-credentials
      - id: micro-behaviors/fs/path/secret-config::orchestration-credentials
      - id: micro-behaviors/fs/path/config/app::package-manager-or-netrc-config-path
