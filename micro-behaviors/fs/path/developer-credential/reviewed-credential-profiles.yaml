---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
composite_rules:
- for:
  - source
  - scripts
  id: developer-credential-path-reference
  desc: Credential path table in source
  conf: 0.9
  any:
  - id: micro-behaviors/fs/path/secret-config::npm-pypi-credential-file-reference
  - id: micro-behaviors/fs/path/secret-config::git-or-github-credential-file-reference
  - id: micro-behaviors/fs/path/private-key::ssh-private-key
  - id: micro-behaviors/fs/path/secret-config::terraform-credentials-path-reference
  - id: micro-behaviors/fs/path/account-db::repeated-shadow-path-reference
- for:
  - source
  - scripts
  id: developer-auth-file-reference
  desc: References a developer credential file
  conf: 0.92
  any:
  - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
  - id: micro-behaviors/fs/path/private-key::ssh-private-key
  - id: micro-behaviors/fs/path/secret-config::docker-config
  - id: micro-behaviors/fs/path/secret-config::kube-config
  - id: micro-behaviors/fs/path/secret-config::gcloud-config-path-reference
  - id: micro-behaviors/fs/path/credential::azure-credential-path-reference
  - id: micro-behaviors/fs/path/secret-config::terraform-credentials-path-reference
  - id: micro-behaviors/fs/path/token::aws-credentials
  - id: micro-behaviors/fs/path/config/app::package-manager-or-netrc-config-path
  - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
- for:
  - shell
  - python
  - go
  - rust
  - perl
  - javascript
  - typescript
  - powershell
  - c
  - cpp
  id: multiple-developer-credential-path-groups
  desc: References multiple developer credential path groups
  conf: 0.96
  needs: 3
  any:
  - id: micro-behaviors/fs/path/developer-credential::developer-credential-stores
  - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
  - id: micro-behaviors/fs/path/credential::ssh-key-or-host-store-reference
  - id: micro-behaviors/fs/path/credential::container-credentials
  - id: micro-behaviors/fs/path/token::vault-token-file
