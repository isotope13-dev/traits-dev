traits:
- id: windows-system-tool-temp-path
  desc: Windows temporary path names a system executable
  crit: notable
  conf: 0.82
  if:
    type: literal
    regex: '(?i)(%temp%|\\temp\\|/tmp/).{0,48}(svchost|lsass|explorer)\.exe'
  platforms: [windows]
  for: [python]
- id: new-file-suffix-format
  desc: Filename format appends a .new suffix
  crit: notable
  conf: 0.86
  if:
    type: text
    exact: '%s.new'
  platforms:
  - android
  for:
  - elf
