defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]
traits:
- id: lanman-share-registry-path
  desc: LanMan network share registry path
  crit: notable
  conf: 0.9
  for: [vbs, javascript, static-lib]
  if:
    type: text
    substr: 'Network\LanMan\'
- id: admin-share-executable-path
  desc: Executable path on Windows administrative share
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)\\\\[^\\]{1,80}\\(ADMIN\$|C\$)\\.{0,120}\.(exe|dll|sys)\b
