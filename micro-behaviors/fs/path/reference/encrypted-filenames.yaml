traits:
- id: compound-crypt-encrypted-locked-filename
  desc: Compound filename with an encrypted suffix
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (^|[^\w.-])[\w-]+\.[A-Za-z0-9]{1,8}\.(crypt|encrypted|locked)$
  not:
  - regex: (^|[^\w.-])[\w-]+\.[A-Za-z0-9]*[A-Z][A-Za-z0-9]*\.(crypt|encrypted|locked)$
  - regex: \.[0-9]+x[0-9]+\.(crypt|encrypted|locked)$
  - regex: \.streams?\.locked$
  - regex: (^|[^\w.-])wallet\.json\.encrypted$
  unless:
  - type: text
    regex: ^matplotlib$
  - type: text
    regex: ^tex$
  for:
  - elf
  - macho
  - pe
- id: compound-enc-crypted-cry-filename
  desc: Compound filename with an encrypted suffix
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (^|[^\w.-])[\w-]+\.[A-Za-z0-9]{1,8}\.(enc|crypted|cry)$
  not:
  - regex: ^[A-Z][A-Za-z0-9_]*__
  - regex: cat\.face\.cry
  unless:
  - type: text
    regex: ^payload\.enc$
  - type: text
    regex: ^matplotlib$
  - type: text
    regex: ^tex$
  for:
  - elf
  - macho
  - pe
composite_rules:
- id: compound-encrypted-filename-reference
  desc: References a compound filename with an encrypted suffix
  crit: notable
  conf: 0.85
  for:
  - elf
  - macho
  - pe
  - c
  - cpp
  any:
  - id: micro-behaviors/fs/path/reference::compound-crypt-encrypted-locked-filename
  - id: micro-behaviors/fs/path/reference::compound-enc-crypted-cry-filename
defaults:
  platforms:
  - linux
  - macos
  - windows
