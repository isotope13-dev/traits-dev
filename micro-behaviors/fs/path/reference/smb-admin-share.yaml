defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
  - id: smb-windows-administrative-share
    desc: UNC-form SMB administrative share path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\\+[A-Za-z0-9_.-]+\\+(ADMIN\$|C\$|IPC\$)'

  # Forward-slash form also appears in file-URI documentation such as
  # file://server/c$/folder/file.txt; this records a path reference only.
  - id: smb-slash-administrative-share
    desc: Slash-form SMB administrative share path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)//[A-Za-z0-9_.-]+/(ADMIN\$|C\$|IPC\$)'
