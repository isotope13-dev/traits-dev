defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: admin-share-drive-root-template
    desc: Per-host administrative share path template
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\\\\%s\\(admin\$|[A-Z]\$)\\[\w.-]{1,40}\.exe'
      case_insensitive: true

  - id: ipc-share-template
    desc: Per-host IPC$ share path template
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\\\\%s\\ipc\$'
      case_insensitive: true

