# Config.Msi is a Windows Installer-owned rollback store, not an attacker name.
defaults:
  platforms: [windows]
  for: [source, binaries, python]
  crit: notable
  conf: 0.98

traits:
  - id: installer-rollback-directory
    desc: Installer rollback directory reference
    if:
      type: literal
      kind: string
      regex: '(?i)[A-Z]:\\{1,2}Config\.Msi(\\|"|$)'

  - id: installer-rollback-script-path
    desc: Config.Msi rollback script path
    if:
      type: literal
      kind: string
      regex: '(?i)[A-Z]:\\{1,2}Config\.Msi\\{1,2}[^\r\n"]{1,180}\.rbs("|$)'

  - id: installer-rollback-backup-path
    desc: Config.Msi rollback backup path
    if:
      type: literal
      kind: string
      regex: '(?i)[A-Z]:\\{1,2}Config\.Msi\\{1,2}[^\r\n"]{1,180}\.rbf("|$)'
