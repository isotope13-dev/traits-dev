# Conventional job/state file and directory names.  These matchers recognize a
# filename or a path segment and nothing more, so they are neutral path
# references.  They were previously defined under
# objectives/command-and-control/channel/deaddrop/github/ as GitHub Contents
# mailbox components, which handed a C2 finding to every project that ships a
# result.json, an output.json, or an upload/ directory.  The GitHub Contents
# mailbox composites still consume them, paired with the Contents API endpoint.
defaults:
  platforms: [windows, unix]
  for: [rust, go, python, javascript, typescript, shell, c, cpp]
  crit: baseline
  conf: 0.9

traits:
  # The leading `[^A-Za-z0-9_-]` guard requires the state name to be the
  # filename itself, not a hyphen-joined suffix of a longer name: a bare
  # `\b` let `github-result.json` (a local temp file holding an API
  # response) match `result.json`, handing a dead-drop C2 composite to
  # benign automation that talks to the GitHub contents API.
  - id: command-state-json-filename
    desc: Beacon, cmd or result JSON filename
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z0-9_-])(beacon|cmd|result)\.json\b'

  - id: task-state-json-filename
    desc: Task, output or status JSON filename
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z0-9_-])(task|output|status)\.json\b'

  - id: upload-path-segment
    desc: Upload path segment
    if:
      type: text
      regex: '(?i)(^|[/\\])upload([/\\]|$)'

composite_rules:
  - id: job-state-json-filename
    desc: References a job state JSON filename
    crit: component
    conf: 0.9
    any:
      - id: command-state-json-filename
      - id: task-state-json-filename
