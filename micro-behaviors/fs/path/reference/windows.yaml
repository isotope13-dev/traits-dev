defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: analysis-sandbox-directory-path
    desc: References a sandbox or analysis directory
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'C:\\(sandbox|analysis|malware)'
      case_insensitive: true
    unless:
      - id: well-known/app/development/github-desktop/

  - id: windows-path-like-string
    desc: Contains a Windows drive-letter path
    crit: baseline
    if:
      type: text
      regex: '[A-Za-z]:\\\\[^\s]{1,120}'
      case_insensitive: true
    not:
      - substr: C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe
    unless:
      - id: metadata/package/documentation/manpage::unix-manpage
composite_rules:
  - id: exe-extension-string
    desc: Contains Windows executable file path
    crit: baseline
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/documentation/manpage::unix-manpage
    all:
      - id: micro-behaviors/fs/path/extension::exe-dup
      - id: windows-path-like-string
