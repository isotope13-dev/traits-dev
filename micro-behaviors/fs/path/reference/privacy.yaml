defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1119

traits:
- id: telemetry-json-path-reference
  desc: "Telemetry JSON filename reference"
  crit: component
  conf: 0.96
  if:
    type: text
    substr: telemetry.json
- id: new-file-path-label
  desc: "New file path label"
  crit: notable
  conf: 0.86
  if:
    type: text
    word: newFilePath
- id: tsconfig-path-label
  desc: "TypeScript configuration path label"
  crit: notable
  conf: 0.86
  if:
    type: text
    word: tsconfigPath
- id: shell-path-label
  desc: "Shell executable path label"
  crit: notable
  conf: 0.86
  if:
    type: text
    word: shellPath
