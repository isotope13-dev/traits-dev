# Configuration carrying or locating secrets.

defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

composite_rules:
  - id: ssh-tooling-or-transcript-context
    desc: SSH tooling or documentation transcript
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/communications/ssh/
      - id: ssh-client-basename
      - id: ssh-path-in-repl-transcript