# Configuration that carries or locates secrets, and the contexts in which
# such a path is being described rather than read.

# Rationale carried over with these traits:
# Contexts in which a `.ssh/` path is the subject being described rather than a
# credential being read: the ssh client's own binary, and documentation that
# shows the path in a REPL transcript.
# The file *is* an ssh client, so a `.ssh/` path in it is the tool's own
# configuration surface rather than someone else's key.

defaults:
  platforms: [unix, windows]
  crit: component
  conf: 0.9

traits:
  - id: ssh-client-basename
    desc: File is an ssh client binary
    for: [elf, macho, pe]
    if:
      type: path
      basename: true
      regex: '^ssh(-.+)?(\.exe)?$'

# `>>> ` is a Python REPL prompt: the path is being shown, not opened.
  - id: ssh-path-in-repl-transcript
    desc: SSH path inside a REPL transcript
    for: [scripts, source, documents]
    if:
      type: text
      regex: '>>>\s+.{0,200}\.ssh/'
