defaults:
  for: [batch, powershell, pe]
  platforms: [windows]
composite_rules:
  - id: multiple-windows-data-locations
    desc: Multiple Windows application or data paths
    crit: notable
    conf: 1.0
    needs: 2
    any:
    - id: micro-behaviors/fs/path/credential/private-key::windows-crypto-data-path
    - id: micro-behaviors/fs/path/credential/generic-basename::documents-secrets-path
    - id: micro-behaviors/fs/path/app-data/platform::roaming-appdata-path
    - id: micro-behaviors/fs/path/webserver::inetpub-webroot-path
    - id: micro-behaviors/fs/path/credential/password-store::filezilla-configuration-path-references
    - id: micro-behaviors/fs/path/personal::windows-documents-or-desktop-path
    - id: micro-behaviors/fs/path/app-data/platform::windows-user-roaming-path
