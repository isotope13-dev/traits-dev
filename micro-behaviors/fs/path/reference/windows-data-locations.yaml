defaults:
  for: [batch, powershell, pe]
  platforms: [windows]
composite_rules:
  - id: multiple-windows-data-locations
    desc: Multiple Windows application or data paths
    crit: notable
    conf: 1.0
    needs: 2
    any:
    - id: micro-behaviors/fs/path/secret-config::windows-crypto-data-path
    - id: micro-behaviors/fs/path/secret-config::documents-secrets-path
    - id: micro-behaviors/fs/path/app-data::roaming-appdata-path
    - id: micro-behaviors/fs/path/system::inetpub-webroot-path
    - id: micro-behaviors/fs/path/password-store::filezilla-configuration-path-references
    - id: micro-behaviors/fs/path/app-data::windows-user-profile-data-path
