defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: grabber-logger-test-path-literal
    desc: Tool-name and temporary path literal
    crit: notable
    conf: 0.75
    if:
      type: string_literal
      regex: '(?i)[\\/](grabber|logger)[\\/].{0,40}[\\/](test|tmp)[\\/]'
  - id: grabber-logger-temp-path-literal
    desc: Tool-name and temporary path literal
    crit: notable
    conf: 0.75
    if:
      type: string_literal
      regex: '(?i)[/\\\\](grabber|logger)[/\\\\](temp|boot|lmao)[/\\\\]'
  # `stealer`/`bot` must be a whole path segment, as in siblings -a and -b. The
  # earlier `\bbot\b` spelling matched anywhere inside a path-like run, so the
  # stock Telegram Bot API test endpoint
  # `https://api.telegram.org/bot{token}/test/{method}` (aiogram, python-telegram-bot,
  # every Telegram library) read as a stealer working directory.
  - id: stealer-bot-test-path-literal
    desc: Tool-name and temporary path literal
    crit: notable
    conf: 0.75
    if:
      type: string_literal
      regex: '(?i)[\\/](stealer|bot)[\\/][^\n]{0,50}\b(test|tmp)\b'
  - id: stealer-bot-temp-path-literal
    desc: Tool-name and temporary path literal
    crit: notable
    conf: 0.75
    if:
      type: string_literal
      regex: '(?i)[\\/](stealer|bot)[\\/][^\n]{0,50}\b(temp|boot|lmao)\b'
composite_rules:
  - id: tool-name-temp-path-literal
    desc: Tool-name and temporary path literal
    crit: notable
    conf: 0.75
    any:
      - id: grabber-logger-test-path-literal
      - id: grabber-logger-temp-path-literal
      - id: stealer-bot-test-path-literal
      - id: stealer-bot-temp-path-literal
