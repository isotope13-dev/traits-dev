# Path references remain accurate in libraries and test files.
defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: root-path-pair-array
    desc: 'Array starts with filesystem roots or /home'
    crit: notable
    if:
      type: text
      # One line: a blank line inside this string required two trailing
      # newlines and missed ["C:\\","D:\\","/","/home"] style surveys.
      regex: '\[\s*[''"]([A-Z]:\\\\|/)[''"]\s*,\s*[''"]([A-Z]:\\\\|/home)[''"]'
  - id: node-multiple-drive-roots
    desc: Lists distinct Windows drive roots
    crit: notable
    conf: 0.99
    for: [javascript, typescript]
    if:
      type: tree-sitter
      query: |
        ((array . (string) @root1 . (string) @root2)
        (#match? @root1 "^[\"'][A-Za-z]:\\\\{2,}[\"']$")
        (#match? @root2 "^[\"'][A-Za-z]:\\\\{2,}[\"']$")
        (#not-eq? @root1 @root2))
