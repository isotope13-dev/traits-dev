defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: low-directory-executable-reference
    desc: Executable path beneath a Low directory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\\Low\\[^\\\r\n"'']{1,80}\.exe'
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/code/entropy::code-entropy-near-zero
