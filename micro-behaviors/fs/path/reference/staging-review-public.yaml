defaults:
  platforms:
    - windows
  for:
    - javascript
    - powershell
    - batch
    - python
traits:
  - id: public-folder-script-fragment
    desc: Public folder path text fragment
    crit: component
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: '(?i)Users.{0,40}Public.{0,40}[a-z0-9_-]{4,16}'

