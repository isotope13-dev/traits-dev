defaults:
  for: [lua]
  platforms: [windows, unix, network-appliance]
composite_rules:
  - id: lua-windows-command-tool-reference
    desc: Lua references Windows command utilities
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/fs/path/host-process::lua-certutil-name
      - id: micro-behaviors/fs/path/host-process::lua-mshta-name
      - id: micro-behaviors/fs/path/host-process::lua-rundll32-name
      - id: micro-behaviors/communications/http/download/cli::bitsadmin-cmd
      - id: micro-behaviors/process/create/shell/command-mode::lua-wmic-process-create-reference

