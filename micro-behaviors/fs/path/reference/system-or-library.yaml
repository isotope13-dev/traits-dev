composite_rules:
  - id: system-or-library-path-references
    desc: System or library directory path references
    platforms: [unix, windows]
    for: [scripts, binaries]
    crit: component
    conf: 0.4
    any:
      - id: micro-behaviors/fs/path/system/
      # Preserve the original home-directory member after resource placement.
      - id: micro-behaviors/fs/path/personal::home-dir
      - id: well-known/app/utility/windows-update::uie-orchestrator-update-path
      # Preserve the relocated executable-name observation in this selector.
      - id: micro-behaviors/os/application/target/utility::computerdefaults-exe-reference
      - id: micro-behaviors/fs/path/library::system-lib64
      - id: micro-behaviors/fs/path/library::system-lib-python
