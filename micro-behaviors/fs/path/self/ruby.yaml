defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: baseline
  conf: 0.9
traits:
  - id: ruby-expand-file-path
    desc: Expands a path using Ruby __FILE__
    if:
      type: symbol
      kind: call
      exact: File.expand_path
      arg:
        kind: identifier
        name: __FILE__
  # A command line that starts the Ruby interpreter on this very script,
  # e.g. "ruby #{__FILE__}" built into a cron line or shell startup file.
  - id: ruby-self-relaunch-command-string
    desc: Command string relaunches this Ruby script
    crit: notable
    if:
      type: text
      regex: '\bruby +#\{[^}\n]{0,40}(__FILE__|\$0|\$PROGRAM_NAME)[^}\n]{0,12}\}'
