defaults:
  platforms:
  - windows
  for:
  - source
  - vbs
traits:
- id: vb6-self-exe-name
  desc: VB6 constructs own EXE name
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: App\.EXEName\s*[+&]\s*"\.exe"
- id: vb6-self-injectionpath-assignment
  desc: VB6 assigns self path to InjectionPath
  crit: notable
  conf: 0.93
  if:
    type: text
    substr: InjectionPath = ThisExe
