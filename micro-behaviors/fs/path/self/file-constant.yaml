defaults:
  crit: suspicious
  platforms: [unix]
  for: [perl, static-lib]
traits:
  - id: file-constant-variable-value
    desc: __FILE__ variable-value expression
    for: [perl, static-lib, text, php]
    platforms: [unix, windows]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\$\w+\s*=\s*__FILE__'
