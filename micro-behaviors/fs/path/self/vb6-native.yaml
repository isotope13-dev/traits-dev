# App.Path and App.EXEName are vtable methods 0x50 and 0x58 in VB6.
# The interface and bounded native method pair are a probable self-path
# capability; the observation does not assert a particular subsequent write.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: vb6-app-executable-path-profile
    desc: VB6 App reference with path-method calls
    crit: notable
    conf: 0.95
    all:
      - id: metadata/lang/runtime::vb6-app-interface-reference
      - id: metadata/binary/instruction::x86-vtable-method-50-58-pair
      - id: micro-behaviors/fs/path/extension::utf16-exe-suffix-token
