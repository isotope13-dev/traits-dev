defaults:
  platforms: [windows]
  for: [c, cpp, html, text]
traits:
  - id: null-handle-module-path-call
    desc: Reads module path with null handle
    crit: notable
    conf: 0.95
    for: [c, cpp, csharp, python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)GetModuleFileName[AW]?$'
      arg:
        index: 0
        kind: "null"

  - id: zero-handle-module-path-call
    desc: Reads module path with zero handle
    crit: notable
    conf: 0.95
    for: [c, cpp, csharp, python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)GetModuleFileName[AW]?$'
      arg:
        index: 0
        kind: number
        value: 0

  # Retain source listings where no language parser provides call facts.
  - id: self-module-path-source-listing
    desc: Listing references own module path lookup
    crit: notable
    conf: 0.85
    for: [html, text]
    if:
      type: text
      regex: '\bGetModuleFileName[AW]?\s*\(\s*(NULL|nullptr|0)\s*,'

composite_rules:
  - id: source-self-module-path-read
    desc: Source reads own module file name
    for: [c, cpp, csharp, python, html, text]
    crit: notable
    conf: 0.95
    any:
      - id: null-handle-module-path-call
      - id: zero-handle-module-path-call
      - id: self-module-path-source-listing

