defaults:
  platforms: [unix, android, ios]
  for: [shell]

traits:
  - id: realpath-current-script
    desc: Resolves current script path with realpath
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'realpath\s+["'']?\$0'
  # The AppImage AppRun self-location idiom: the launcher resolves the bundle
  # root from its own path so bundled libraries and resources are addressed
  # relative to the mount point rather than the host system.
  - id: apprun-here-bundle-root
    desc: AppRun resolves bundle root from own path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'HERE\s*=[^;\n]{0,80}dirname[^;\n]{0,80}readlink[^;\n]{0,80}\$\{?0\}?'
