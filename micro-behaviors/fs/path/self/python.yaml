# Paths a Python module derives from its own installed location. Ordinary on
# its own -- packaged data files and templates are addressed this way -- but it
# is what makes a launcher point at something shipped inside the package rather
# than at a system tool, so it is measured separately from the launch itself.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: baseline
  conf: 0.9
traits:
  - id: python-pathlib-module-dir
    desc: Pathlib directory of the running module
    if:
      type: text
      regex: 'Path\s*\(\s*__file__\s*\)\s*(\.\s*\w+\s*\(\s*\)\s*)?\.\s*parent'
  - id: python-ospath-module-dir
    desc: os.path directory of the running module
    if:
      type: text
      regex: 'os\.path\.dirname\s*\(\s*(os\.path\.\w+\s*\(\s*)?__file__'
composite_rules:
  - id: python-module-directory
    desc: Python derives its own package directory
    crit: baseline
    conf: 0.9
    any:
      - id: python-pathlib-module-dir
      - id: python-ospath-module-dir
