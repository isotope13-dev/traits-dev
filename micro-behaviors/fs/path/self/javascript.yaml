# File Read Operations - JavaScript/Node
# MBC: C0051 (Read File)
# ATT&CK: T1005
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: script-directory-install-path-field
    desc: installPath field stores the script directory
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\binstallPath\s*:\s*__dirname\b'
  - id: exports-binary-path
    desc: Module exports a binaryPath property
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'module\.exports\.binaryPath\s*=\s*[A-Za-z_$][A-Za-z0-9_$]*'

  - id: cwd-reference
    desc: References the Node.js current working directory
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: process.cwd()
  - id: node-package-dot-cache-path
    desc: Node path joins package dir to dot-cache
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'path\.join\(\s*__dirname\s*,\s*[''"]\.cache[''"]\s*\)'
  - id: script-relative-bin-join
    desc: Joins script dir to .bin path
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)join$'
      args:
        - kind: identifier
          name: __dirname
        - kind: string
          substr: ".bin"
