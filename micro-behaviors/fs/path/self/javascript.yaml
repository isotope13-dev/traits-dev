# File Read Operations - JavaScript/Node
# MBC: C0051 (Read File)
# ATT&CK: T1005
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: json-install-path-and-cwd-keys
    desc: JSON object names install path and cwd
    crit: notable
    conf: 0.9
    attack: T1082
    if:
      type: text
      regex: 'installPath\s*:[\s\S]{0,160}\bcwd\s*:'
  - id: cwd-reference
    desc: References the Node.js current working directory
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: process.cwd()
  - id: node-package-dot-cache-path
    desc: Node path joins package dir to dot-cache
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'path\.join\(\s*__dirname\s*,\s*[''"]\.cache[''"]\s*\)'
