# File Read Operations - JavaScript/Node
# MBC: C0051 (Read File)
# ATT&CK: T1005
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: cwd-reference
  desc: References the Node.js current working directory
  crit: notable
  conf: 0.84
  if:
    type: text
    substr: process.cwd()
