# File Read Operations - JavaScript/Node
# MBC: C0051 (Read File)
# ATT&CK: T1005
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: script-directory-install-path-field
    desc: installPath field stores the script directory
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\binstallPath\s*:\s*__dirname\b'
  - id: exports-binary-path
    desc: Module exports a binaryPath property
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'module\.exports\.binaryPath\s*=\s*[A-Za-z_$][A-Za-z0-9_$]*'

  - id: node-package-dot-cache-path
    desc: Node path joins package dir to dot-cache
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'path\.join\(\s*__dirname\s*,\s*[''"]\.cache[''"]\s*\)'
  - id: script-relative-bin-path
    desc: Joins script directory with bin pathname
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)join$'
      args:
        - kind: identifier
          name: __dirname
        - kind: string
          regex: '\.bin$'

  - id: script-directory-path-join
    desc: path.join with __dirname
    crit: baseline
    conf: 0.5
    if:
      type: text
      regex: 'path\.join\s*\(\s*__dirname'

  # From node_modules/<pkg>/ two parent hops reach the installing project;
  # a scoped package needs three. Bind the hops to __dirname in one call so a
  # relative import path elsewhere in the file does not count.
  - id: script-dir-ancestor-path
    desc: Resolves two levels above script directory
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '^path\.(resolve|join)$'
      args:
        - kind: identifier
          name: __dirname
        - kind: string
          regex: '^\.\.[/\\]\.\.([/\\]|$)'
  - id: script-dir-ancestor-path-segments
    desc: Joins two parent segments to script directory
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '^path\.(resolve|join)$'
      args:
        - kind: identifier
          name: __dirname
        - kind: string
          exact: '..'
        - kind: string
          exact: '..'
