defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: script-path-or-cwd-reference
    desc: References script path or working directory
    crit: notable
    conf: 0.88
    scope: file
    any:
      - id: micro-behaviors/fs/directory/cwd::process-cwd-call
      - id: micro-behaviors/fs/path/self::script-dirname-ref
