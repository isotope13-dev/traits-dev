defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-install-path-context-field
    desc: References script path or working directory
    crit: notable
    conf: 0.88
    scope: file
    any:
      - id: micro-behaviors/fs/path/self::cwd-reference
      - id: micro-behaviors/fs/path/self::script-dirname-ref
