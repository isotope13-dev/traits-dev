# NTFS alternate data streams are a storage capability.  Payload intent is
# inferred by objectives that combine this path with decryption and execution.
defaults:
  platforms: [windows]
  for: [source, scripts]
  attack: T1564.004

traits:
  - id: ntfs-ads-path-source
    desc: NTFS alternate data stream path
    crit: notable
    conf: 0.96
    if:
      type: text
      # Require a path-shaped prefix.  The former expression accepted any
      # decoded `%TOKEN%...:name` or `X:\...:name` fragment, including
      # punctuation in obfuscated JavaScript strings.  Keep the Windows path
      # and ADS name character sets explicit so source text must describe an
      # actual path rather than merely contain a colon.
      # `\b` before the drive letter keeps the last letter of a longer scheme
      # word from standing in for one: the WMI moniker
      # `winmgmts:\\.\root\default:StdRegProv` otherwise read as drive `s:`
      # plus an ADS name on every script that binds StdRegProv.
      #
      # A drive letter and an environment variable share one tail, and that tail
      # now pins the two parts of the shape that a real stream path always has:
      #
      #   * a *backslash* right after the drive or `%VAR%`.  A `[\\/]` here let
      #     a forward slash open the path, and cleave's text corpus for source
      #     files also carries its single-byte transforms of the file — under
      #     XOR 0x07 the ubiquitous minified-bundle idiom `t=(this[Ir]=this`
      #     decodes to `s:/sont\NuZ:sont`, which read as drive `s:`, path
      #     `sont\NuZ`, stream `sont` on two Admin Columns admin bundles.
      #   * a `.ext` immediately before the stream colon.  The old middle clause
      #     accepted a stray backslash anywhere as proof of "path-shaped", which
      #     is what the decoded `\NuZ` supplied.  Real streams hang off a named
      #     file (`ntusers.dat:script.js`, `log.txt:evil`), so requiring the
      #     extension costs nothing and closes the shape.  It also keeps an
      #     escaped newline from standing in for a path: emmet's CSS test parses
      #     `'a{b:\nc:d;}'`, formerly drive `b:`, path `\nc`, stream `d`.
      #
      # The stream name must also start like a name.  A trailing `[\w.$-]+`
      # accepted a lone digit, so decoded noise such as `a://.:9` in a bundled
      # WordPress admin app read as an alternate data stream; the `not:` below
      # drops URL-scheme shapes for the same reason.
      regex: '(\b[A-Za-z]:|%\w+%)\\[\w.\\ -]{0,60}\.[A-Za-z0-9]{1,8}:[A-Za-z_$][\w.$-]{0,63}'
      case_insensitive: true
    not:
      - substr: '://'
    unless:
      - id: metadata/library/structure::js-large-minified-bundle

  - id: ntfs-stream-api-source
    desc: NTFS alternate stream API reference
    crit: notable
    conf: 0.92
    for: [c, cpp, csharp, go, rust]
    if:
      type: symbol
      kind: call
      regex: '^(FindFirstStream[AW]|FindNextStream[AW]|Backup(Read|Write))$'
