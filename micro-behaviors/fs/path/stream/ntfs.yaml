# NTFS alternate data streams are a storage capability.  Payload intent is
# inferred by objectives that combine this path with decryption and execution.
defaults:
  platforms: [windows]
  for: [source, scripts]
  attack: T1564.004

traits:
  - id: ntfs-ads-path-source
    desc: NTFS alternate data stream path
    crit: notable
    conf: 0.96
    if:
      type: text
      # Require a path-shaped prefix.  The former expression accepted any
      # decoded `%TOKEN%...:name` or `X:\...:name` fragment, including
      # punctuation in obfuscated JavaScript strings.  Keep the Windows path
      # and ADS name character sets explicit so source text must describe an
      # actual path rather than merely contain a colon.
      # `\b` before the drive letter keeps the last letter of a longer scheme
      # word from standing in for one: the WMI moniker
      # `winmgmts:\\.\root\default:StdRegProv` otherwise read as drive `s:`
      # plus an ADS name on every script that binds StdRegProv.
      #
      # A drive letter and an environment variable share one tail now, and the
      # `[.\\]` in it requires the part before the stream name to look like a
      # path — a directory separator or a file extension. Without that a single
      # letter sufficed, so an escaped newline inside an ordinary string closed
      # the shape: emmet's CSS test parses `'a{b:\nc:d;}'`, which read as drive
      # `b:`, path `\nc`, stream `d`.
      regex: '(\b[A-Za-z]:|%\w+%)[\\/][\w.\\ /-]*[.\\][\w.\\ /-]*:[\w.$-]+'
      case_insensitive: true
    unless:
      - id: metadata/library/structure::js-large-minified-bundle

  - id: ntfs-stream-api-source
    desc: NTFS alternate stream API reference
    crit: notable
    conf: 0.92
    for: [c, cpp, csharp, go, rust]
    if:
      type: symbol
      kind: call
      regex: '^(FindFirstStream[AW]|FindNextStream[AW]|Backup(Read|Write))$'
