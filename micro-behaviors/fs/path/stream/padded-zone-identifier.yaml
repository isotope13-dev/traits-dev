traits:
  - id: punctuation-separated-zone-identifier
    desc: Punctuation-separated Zone.Identifier literal
    platforms: [windows]
    for: [javascript, vbs]
    crit: notable
    conf: 0.98
    if:
      type: literal
      regex: 'Z\W*o\W*n\W*e\.\W*I\W*d\W*e\W*n\W*t\W*i\W*f\W*i\W*e\W*r'
    unless:
      - id: micro-behaviors/fs/path/stream::zone-identifier-reference
