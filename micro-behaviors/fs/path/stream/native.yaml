defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: native-stream-basename
    desc: UTF-16 NTFS-style stream basename
    crit: notable
    conf: 0.85
    if:
      type: raw
      # Short UTF-16 stream names are absent from the text projection.
      section: .rdata
      regex: ':\x00[A-Za-z_$]\x00([A-Za-z0-9_.$-]\x00){0,63}\x00\x00'
