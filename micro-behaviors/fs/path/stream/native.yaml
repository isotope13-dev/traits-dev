defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: native-stream-basename
    desc: UTF-16 NTFS-style stream basename
    crit: notable
    conf: 0.85
    if:
      type: raw
      # Require a standalone UTF-16 string, excluding HH:mm:ss suffixes.
      # Short stream names are absent from the text projection.
      section: .rdata
      regex: '\x00\x00:\x00[A-Za-z_$]\x00([A-Za-z0-9_.$-]\x00){0,63}\x00\x00'
