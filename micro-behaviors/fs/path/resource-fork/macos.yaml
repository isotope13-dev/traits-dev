# HFS+ exposes a file's resource fork at <file>/..namedfork/rsrc. Shell copies
# into that path stash whole files inside another file's hidden fork; the
# old-world use (classic Mac resources) never needed a shell `cp` to reach it.
defaults:
  platforms: [macos]
  for: [macho, shell, applescript]
  attack: T1564.004

traits:
  - id: copy-into-resource-fork
    desc: Shell copy into a file's resource fork
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'cp [^\n]{0,60}/\.\.namedfork/rsrc'
