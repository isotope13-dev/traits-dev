defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: php-is-writable-call
    desc: Checks path writability via PHP is_writable()
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(is_writable|php_is_writable)$'
  - id: php-is-file-call
    desc: PHP checks regular-file existence
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: is_file
