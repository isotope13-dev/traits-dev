defaults:
  platforms: [windows]
  for: [javascript, vbs, html]

traits:
  - id: fso-file-exists
    desc: FileSystemObject checks whether a path exists
    crit: notable
    conf: 0.92
    if:
      type: text
      # Case-sensitive: the FSO method is documented and written `FileExists`,
      # and JScript requires that casing to resolve it at all. The lowercase
      # `fileExists` is the camelCase convention of every other ecosystem —
      # auto-editor's `config.nims` calls Nim's `system.fileExists(...)` and,
      # because a Nim build script types as JavaScript, was reported as a WSH
      # FileSystemObject probe.
      regex: '\b[A-Za-z_][A-Za-z0-9_]{0,40}\.\s*FileExists\s*\('
