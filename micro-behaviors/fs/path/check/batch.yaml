defaults:
  conf: 0.9
  platforms: [windows]
  for: [batch]
  crit: component
traits:
  - id: batch-if-exist-goto-branch
    desc: Batch GOTO branch on existing path
    crit: notable
    if:
      type: text
      regex: '(?im)^[ \t]*if[ \t]+exist[ \t]+"?[^"\r\n]{1,160}"?[ \t]+goto\b'

  - id: batch-multiple-if-exist-gates
    desc: Batch checks multiple paths for existence
    crit: notable
    count_min: 3
    if:
      type: text
      regex: '(?im)^[ \t]*if[ \t]+exist[ \t]+"?[^"\r\n]{1,160}"?[ \t]+goto\b'
