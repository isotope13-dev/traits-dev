defaults:
  for: [python]
  platforms: [unix, windows]

traits:
  - id: python-absolute-path-string-prefix
    desc: Absolute path strings compared by prefix
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((call function: (attribute
            object: (call function: (_) @left_function arguments: (argument_list (_) ))
            attribute: (identifier) @method)
          arguments: (argument_list . (call function: (_) @right_function arguments: (argument_list (_) )))) @call
        (#match? @left_function "(^|[.])abspath$")
        (#eq? @left_function @right_function)
        (#eq? @method "startswith")
        )
