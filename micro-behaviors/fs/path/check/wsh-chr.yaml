defaults:
  platforms: [windows]
  for: [vbs, asp, html]

traits:
  - id: chr-frag-dot-fi
    desc: Chr-encoded fragment matching ".Fi"
    crit: component
    conf: 0.78
    if:
      type: text
      regex: 'chrw?\(\s*46\s*\)\s*[&+]\s*chrw?\(\s*(70|102)\s*\)\s*[&+]\s*chrw?\(\s*(73|105)\s*\)'
      case_insensitive: true

  - id: chr-frag-exi-mid
    desc: Chr-encoded fragment matching "Exi"
    crit: component
    conf: 0.78
    if:
      type: text
      regex: 'chrw?\(\s*(69|101)\s*\)\s*[&+]\s*chrw?\(\s*(88|120)\s*\)\s*[&+]\s*chrw?\(\s*(73|105)\s*\)'
      case_insensitive: true

  - id: chr-frag-ts-open
    desc: Chr-encoded fragment matching "ts("
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'chrw?\(\s*(84|116)\s*\)\s*[&+]\s*chrw?\(\s*(83|115)\s*\)\s*[&+]\s*chrw?\(\s*40\s*\)'
      case_insensitive: true

composite_rules:
  - id: chr-encoded-fso-file-exists
    desc: Chr-encoded FSO FileExists call
    crit: notable
    conf: 0.95
    near_bytes: 160
    all:
      - id: chr-frag-dot-fi
      - id: chr-frag-exi-mid
      - id: chr-frag-ts-open
