# Killswitch marker file paths
# Malware checks for a specific file before executing; absence triggers exit
defaults:
  for: [elf, macho]
  platforms: [linux, macos]
  crit: suspicious
  conf: 0.9
traits:
  - id: killswitch-log-file
    desc: References /tmp/log_de.log killswitch path
    if:
      type: text
      substr: /tmp/log_de.log
