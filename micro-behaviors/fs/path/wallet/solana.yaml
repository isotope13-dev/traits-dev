# Cryptocurrency wallet files and seed material.

defaults:
  platforms: [unix]
  for: [javascript, typescript]

traits:
  - id: node-user-solana-config-directory
    desc: References user Solana config directory
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '["'']\.config["'']\s*,\s*["'']solana["'']'

  # `~/.config/solana/id.json` is where `solana-keygen` puts the CLI's default
  # signing keypair, so a reference to it is the single most useful pointer for
  # deciding whether a script reads, copies or overwrites a developer's funded
  # Solana identity. Benign Solana tooling names this path constantly (the CLI's
  # own docs, validator runbooks, Anchor test setup), so the path alone is
  # context for triage rather than evidence of theft -- the stealer composites in
  # objectives/exfiltration/stealer/wallet/ supply the read-and-exfiltrate intent.
  - id: solana-cli-default-keypair-path
    desc: References the default Solana CLI keypair file
    crit: notable
    conf: 0.9
    platforms: [unix, windows]
    for: [scripts, binaries]
    attack: T1552.001
    if:
      type: text
      substr: /.config/solana/id.json
