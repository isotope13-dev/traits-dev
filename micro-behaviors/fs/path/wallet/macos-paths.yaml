# Wallet data locations referenced by local-store acquisition consumers.
# These observations do not themselves establish a file read or transfer.
defaults:
  crit: suspicious
  platforms: [macos]
  for: [applescript, shell]
  attack: T1005
  mbc: B0028

traits:
- id: exodus-wallet-path
  desc: Exodus wallet path target
  crit: suspicious
  conf: 0.85
  attack: T1555.005
  if:
    type: text
    substr: Exodus/
- id: atomic-wallet-path
  platforms: [windows, unix]
  for: [python, javascript, typescript, elf, macho, pe, applescript, shell]
  desc: Atomic wallet local-storage path
  crit: notable
  conf: 0.85
  attack: T1555.005
  if:
    type: text
    regex: '(?i)atomic[/\\]Local Storage\b'
- id: trezor-suite-path
  desc: Trezor Suite path target
  crit: suspicious
  conf: 0.85
  attack: T1555.005
  if:
    type: text
    substr: "@trezor/suite-desktop/"
composite_rules:
  - id: wallet-target-bundle
    desc: "References multiple wallet data locations"
    conf: 0.95
    attack: T1555.005
    needs: 4
    any:
    - id: micro-behaviors/fs/path/wallet::electrum-wallets-dir
    - id: micro-behaviors/fs/path/wallet::coinomi-wallets-dir
    - id: micro-behaviors/fs/path/wallet::exodus-wallet-path
    - id: micro-behaviors/fs/path/wallet::atomic-wallet-path
    - id: micro-behaviors/fs/path/wallet::trezor-suite-path
