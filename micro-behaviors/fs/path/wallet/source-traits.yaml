defaults:
  for: [scripts, binaries, csharp]
  attack: T1555
  mbc: B0028
  crit: suspicious
  platforms:
  - macos
  - windows
  - linux

traits:
- id: node-ethereum-keystore-path
  desc: JavaScript constructs Ethereum keystore path
  crit: suspicious
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?i)path\.join.{0,120}\.ethereum.{0,60}keystore'
- id: node-wallet-vault-path
  desc: JavaScript constructs wallet vault path
  crit: suspicious
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '(?i)path\.join.{0,120}wallet.{0,60}vault'
- id: electrum-wallets-dir
  desc: .electrum/wallets directory
  conf: 0.7
  crit: notable
  if:
    type: text
    regex: '(?i)\.electrum[/\\]wallets?\b'
- id: electrum-wallet-file
  desc: .electrum wallet file
  conf: 0.7
  crit: notable
  if:
    type: text
    regex: '(?i)[\\/]\.electrum[\\/].{0,30}\bwallet\b'
- id: electrum-default
  desc: electrum default_wallet
  conf: 0.7
  crit: notable
  if:
    type: text
    regex: (?i)electrum.{0,80}default_wallet|default_wallet.{0,80}electrum
- id: coinomi-wallets-dir
  desc: Coinomi/wallets directory
  conf: 0.7
  crit: notable
  if:
    type: text
    regex: '(?i)Coinomi[/\\]wallets?\b'
- id: coinomi-wallet-dat
  desc: Coinomi wallet.dat
  conf: 0.7
  crit: notable
  if:
    type: text
    regex: Coinomi.{0,30}wallet\.dat
- id: atomic-local-storage
  desc: atomic wallet path token
    # Narrow to paths that look like the Atomic Wallet data directory, not any
    # `atomic/` substring (Go's sync/atomic package path hits the raw substr).
  conf: 0.7
  crit: suspicious
  if:
    type: text
    regex: (?i)(%APPDATA%|AppData[\\/]Roaming|Application Support|\.config)[\\/]atomic[\\/]
- id: atomic-wallet-name
  desc: Atomic Wallet storage context
  conf: 0.7
  crit: suspicious
  if:
    type: text
    regex: '(?i)Atomic Wallet.{0,60}(path|directory|storage)'
- id: walletwasabi-lower
  desc: .walletwasabi directory
  conf: 0.7
  crit: notable
  if:
    type: text
    substr: .walletwasabi
  unless:
  - id: well-known/tool/detection/cleave::cleave-static-analysis-context
  - id: well-known/tool/detection/stng::stng-string-extractor-context
  - id: well-known/tool/detection/litmus::litmus-classifier-context
  - id: well-known/tool/detection/ascan::ascan-defensive-scanner-context
  - id: well-known/tool/detection/ascan::ascan-package-context
  - id: well-known/tool/detection/ascan::ascan-package-path
- id: walletwasabi-upper
  desc: .WalletWasabi directory
  conf: 0.7
  crit: notable
  if:
    type: text
    substr: .WalletWasabi
  unless:
  - id: well-known/tool/detection/cleave::cleave-static-analysis-context
  - id: well-known/tool/detection/stng::stng-string-extractor-context
  - id: well-known/tool/detection/litmus::litmus-classifier-context
  - id: well-known/tool/detection/ascan::ascan-defensive-scanner-context
  - id: well-known/tool/detection/ascan::ascan-package-context
  - id: well-known/tool/detection/ascan::ascan-package-path
- id: binance-app-store
  desc: Binance/app-store.json
  conf: 0.7
  crit: notable
  if:
    type: text
    substr: Binance/app-store.json
- id: tonkeeper-config
  desc: tonkeeper config.json
  conf: 0.7
  crit: notable
  if:
    type: text
    regex: tonkeeper.{0,30}config\.json
- id: ledger-live-dir
  desc: Ledger Live/ directory
  conf: 0.7
  crit: notable
  if:
    type: text
    substr: Ledger Live/
- id: ledger-accounts
  desc: Ledger Live wallet accounts
  conf: 0.7
  crit: suspicious
  if:
    type: text
    # Require the "Ledger Live" desktop-wallet brand near "accounts". The bare
    # words ledger+accounts collide with blockchain-node ledger/accounts data
    # dirs — e.g. Solana validators use /mnt/ledger + /mnt/accounts.
    regex: '(?i)Ledger Live/[\s\S]{0,60}accounts|accounts[\s\S]{0,60}Ledger Live/'
  unless:
  - id: well-known/lib/crypto/ledger-live::ledger-wallet-framework-import
  - id: well-known/lib/crypto/ledger-live::sign-credential-deployment-api
- id: trezor-suite
  desc: Trezor Suite desktop data path reference
  conf: 0.7
  crit: suspicious
  if:
    type: text
    regex: '(?i)(Application Support|AppData[\\/]|\\.config[\\/])@trezor[\\/]suite-desktop'
- id: guarda-local-storage
  desc: Guarda wallet path token
  conf: 0.7
  crit: notable
  if:
    type: text
    substr: Guarda/
- id: bitcoin-wallet-dat
  desc: .bitcoin/wallet.dat
  conf: 0.7
  crit: suspicious
  if:
    type: text
    substr: .bitcoin/wallet.dat
- id: bitcoin-wallets-dir
  desc: .bitcoin/wallets directory
  conf: 0.7
  crit: suspicious
  if:
    type: text
    substr: .bitcoin/wallets
- id: bitcoin-app-wallets
  desc: Bitcoin/wallets directory
  conf: 0.7
  crit: notable
  if:
    type: text
    substr: Bitcoin/wallets
- id: ethereum-keystore
  desc: Ethereum/keystore
  conf: 0.7
  crit: suspicious
  if:
    type: text
    substr: Ethereum/keystore
  unless:
  - id: well-known/tool/detection/cleave::cleave-static-analysis-context
  - id: well-known/tool/detection/stng::stng-string-extractor-context
  - id: well-known/tool/detection/litmus::litmus-classifier-context
  - id: well-known/tool/detection/ascan::ascan-defensive-scanner-context
  - id: well-known/tool/detection/ascan::ascan-package-context
  - id: well-known/tool/detection/ascan::ascan-package-path
- id: mist-keystore
  desc: Mist Ethereum keystore path reference
  conf: 0.7
  crit: suspicious
  if:
    type: text
    substr: Mist/keystore
- id: doteth-keystore
  desc: .ethereum/keystore
  conf: 0.7
  crit: suspicious
  if:
    type: text
    substr: .ethereum/keystore
  unless:
  - id: well-known/tool/detection/
  - id: well-known/app/finance/quorum/
  - id: well-known/app/finance/go-ethereum::go-ethereum-module-path
- id: monero-wallets
  desc: Monero wallet directory path reference
  conf: 0.7
  crit: notable
  if:
    type: text
    substr: Monero/wallets
  unless:
  - id: well-known/app/finance/monero-gui::official-monero-gui-context
  - id: well-known/tool/detection/cleave::cleave-static-analysis-context
  - id: well-known/tool/detection/stng::stng-string-extractor-context
  - id: well-known/tool/detection/litmus::litmus-classifier-context
  - id: well-known/tool/detection/ascan::ascan-defensive-scanner-context
  - id: well-known/tool/detection/ascan::ascan-package-context
- id: bitmonero-wallets
  desc: .bitmonero/wallets
  conf: 0.7
  crit: suspicious
  if:
    type: text
    substr: .bitmonero/wallets
- id: litecoin-wallet-dat
  desc: .litecoin/wallet.dat
  conf: 0.7
  crit: suspicious
  if:
    type: text
    substr: .litecoin/wallet.dat
- id: litecoin-wallets
  desc: Litecoin/wallets
  conf: 0.7
  crit: notable
  if:
    type: text
    substr: Litecoin/wallets
- id: dashcore-wallets
  desc: DashCore/wallets
  conf: 0.7
  crit: notable
  if:
    type: text
    substr: DashCore/wallets
- id: dash-wallet-dat
  desc: .dashcore/wallet.dat
  conf: 0.7
  crit: suspicious
  if:
    type: text
    substr: .dashcore/wallet.dat
- id: electrum-ltc
  desc: Electrum-LTC wallet data path
  conf: 0.85
  crit: notable
  if:
    type: text
    substr: .electrum-ltc/wallets
  unless:
  - id: well-known/tool/detection/cleave::cleave-static-analysis-context
  - id: well-known/tool/detection/stng::stng-string-extractor-context
  - id: well-known/tool/detection/litmus::litmus-classifier-context
  - id: well-known/tool/detection/ascan::ascan-defensive-scanner-context
  - id: well-known/tool/detection/ascan::ascan-package-context
- id: electron-cash
  desc: Electron Cash wallet data path
  conf: 0.85
  crit: notable
  if:
    type: text
    substr: .electron-cash/wallets
  unless:
  - id: well-known/tool/detection/cleave::cleave-static-analysis-context
  - id: well-known/tool/detection/stng::stng-string-extractor-context
  - id: well-known/tool/detection/litmus::litmus-classifier-context
  - id: well-known/tool/detection/ascan::ascan-defensive-scanner-context
- id: dogecoin-wallets
  desc: Dogecoin/wallets
  conf: 0.7
  crit: notable
  if:
    type: text
    substr: Dogecoin/wallets
- id: dogecoin-wallet-dat
  desc: .dogecoin/wallet.dat
  conf: 0.7
  crit: suspicious
  if:
    type: text
    substr: .dogecoin/wallet.dat
composite_rules:
- id: node-wallet-store-path
  desc: JavaScript constructs a crypto wallet path
  crit: suspicious
  conf: 0.9
  for: [javascript, typescript]
  any:
  - id: micro-behaviors/fs/path/wallet::node-ethereum-keystore-path
  - id: micro-behaviors/fs/path/wallet::node-wallet-vault-path
- id: electrum
  desc: "Electrum wallet-location reference"
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/wallet::electrum-wallets-dir
  - id: micro-behaviors/fs/path/wallet::electrum-wallet-file
  - id: micro-behaviors/fs/path/wallet::electrum-default
- id: wasabi
  desc: "Wasabi wallet-location reference"
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/wallet::walletwasabi-lower
  - id: micro-behaviors/fs/path/wallet::walletwasabi-upper
- id: trezor
  desc: "Trezor wallet-location reference"
  crit: suspicious
  conf: 0.85
  scope: file
  any:
  - id: micro-behaviors/fs/path/wallet::trezor-suite
  unless:
  - id: well-known/lib/crypto/sdk::trezor-connect-webextension-library
- id: bitcoin-core
  desc: "Bitcoin Core wallet-location reference"
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/wallet::bitcoin-wallet-dat
  - id: micro-behaviors/fs/path/wallet::bitcoin-wallets-dir
  - id: micro-behaviors/fs/path/wallet::bitcoin-app-wallets
- id: ethereum
  desc: "Ethereum wallet-location reference"
  crit: suspicious
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/wallet::ethereum-keystore
  - id: micro-behaviors/fs/path/wallet::mist-keystore
  - id: micro-behaviors/fs/path/wallet::doteth-keystore
  unless:
  - id: well-known/app/finance/quorum/
  - id: well-known/app/finance/go-ethereum::go-ethereum-module-path
  - id: well-known/tool/detection/ascan::ascan-defensive-scanner-context
  - id: well-known/tool/detection/ascan::ascan-package-path
- id: monero
  desc: "Monero wallet-location reference"
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/wallet::monero-wallets
  - id: micro-behaviors/fs/path/wallet::bitmonero-wallets
  unless:
  - id: well-known/app/finance/monero-gui::official-monero-gui-context
  - id: well-known/tool/detection/ascan::ascan-defensive-scanner-context
  - id: well-known/tool/detection/ascan::ascan-package-context
- id: litecoin-core
  desc: "Litecoin Core wallet-location reference"
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/wallet::litecoin-wallet-dat
  - id: micro-behaviors/fs/path/wallet::litecoin-wallets
  - id: micro-behaviors/fs/path/wallet::electrum-ltc
- id: dash-core
  desc: "Dash Core wallet-location reference"
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/wallet::dashcore-wallets
  - id: micro-behaviors/fs/path/wallet::dash-wallet-dat
- id: dogecoin-core
  desc: "Dogecoin Core wallet-location reference"
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/fs/path/wallet::dogecoin-wallets
  - id: micro-behaviors/fs/path/wallet::dogecoin-wallet-dat
