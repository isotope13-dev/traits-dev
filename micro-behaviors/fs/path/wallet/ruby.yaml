# Cryptocurrency wallet files and seed material.

defaults:
  conf: 0.9
  platforms: [freebsd, unix]
  for: [ruby]
  crit: notable

traits:
  - id: ruby-desktop-wallet-directory-a
    desc: Ruby hidden desktop-wallet directory literal
    if:
      type: literal
      regex: '^\.(ethereum|bitcoin|monero)$'
  - id: ruby-desktop-wallet-directory-b
    desc: Ruby alternate desktop-wallet directory literal
    if:
      type: literal
      regex: '^\.(zcash|solana|dashcore)$'
  # Solana CLI keypair lives at ~/.config/solana/id.json. Ruby builds the
  # path with File.join('.config', 'solana', ...), so the literals are split
  # across separate arguments and the match spans the joining punctuation.
  - id: ruby-solana-keypair-path
    desc: Ruby builds Solana CLI config keypair path
    if:
      type: text
      regex: '\.config\W{1,6}solana'
