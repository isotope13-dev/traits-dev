# Cryptocurrency wallet files and seed material.

defaults:
  conf: 0.9
  platforms: [freebsd, unix]
  for: [ruby]
  crit: notable

traits:
  - id: ruby-desktop-wallet-directory-a
    desc: Ruby hidden desktop-wallet directory literal
    if:
      type: literal
      regex: '^\.(ethereum|bitcoin|monero)$'
  - id: ruby-desktop-wallet-directory-b
    desc: Ruby alternate desktop-wallet directory literal
    if:
      type: literal
      regex: '^\.(zcash|solana|dashcore)$'
