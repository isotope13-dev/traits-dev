defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.7

traits:
  - id: exodus-wallet-file-reference
    desc: References the Exodus wallet data filename
    if:
      type: text
      substr: exodus.wallet

  - id: exodus-seed-container-reference
    desc: References the Exodus encrypted seed container
    conf: 0.95
    if:
      type: text
      regex: '(^|["''/\\])seed\.seco(["'']|$)'
