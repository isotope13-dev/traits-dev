defaults:
  platforms: [windows, linux, macos]
  for: [python, javascript, csharp, go, pe, elf]
  attack: T1555
  mbc: B0028
  crit: suspicious

traits:
- id: keystore-file
  desc: Ethereum UTC keystore filename
  crit: suspicious
  conf: 0.85
  if:
    type: text
    # The UTC--timestamp--address form is the distinctive Ethereum
    # keystore filename; generic `keystore.json` prose is too common.
    regex: '(?i)UTC--[0-9T:+-]+--[a-f0-9]{40}\b'
  unless:
  - id: well-known/tool/detection/
  - id: well-known/app/finance/sidesail/
  - id: well-known/app/finance/go-ethereum::go-ethereum-tool
  - id: metadata/package/testing/presence/harness/
  - id: well-known/app/ai/knowledge/animica::package-context
  - id: well-known/app/ai/knowledge/animica::package-source-path
