# Cryptocurrency wallet files and seed material.

defaults:
  platforms: [macos]
  for: [scripts, binaries]

traits:
  - id: crypto-wallets
    desc: Reference to macOS cryptocurrency wallet paths
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: /Library/Application Support/(Bitcoin|Electrum|Exodus)
    unless:
      - id: well-known/lib/crypto/browser-libraries::opentimestamps-browser-bundle-context
      - id: well-known/tool/detection/security-scanner-identity::apple-xprotectd-scanner-context
      - id: well-known/app/finance/bitcoin-core::bitcoin-core-test-context
