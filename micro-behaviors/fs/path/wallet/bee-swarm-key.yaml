# Bee (Swarm) nodes keep their encrypted Ethereum V3 keystore at
# `data-dir/keys/swarm.key`, beside a `config.yaml` that can carry the
# password that decrypts it. Either filename alone is ordinary; the pair
# referenced together is the complete wallet-credential set, which is why
# the pairing is recorded as one observation. The filenames are written by
# the Bee node itself, not chosen by whoever references them.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell, scripts, source, binaries]
  crit: notable
  attack: T1555.005

traits:
  - id: swarm-key-file-path
    desc: References the Bee swarm.key keystore file
    conf: 0.9
    if:
      type: text
      regex: 'swarm\.key\b'

  - id: swarm-key-config-pair
    desc: References swarm.key beside its node config.yaml
    conf: 0.95
    if:
      type: text
      regex: '(swarm\.key[\s\S]{0,500}config\.ya?ml|config\.ya?ml[\s\S]{0,500}swarm\.key)'

  # The same pairing for other Ethereum-style wallets: an encrypted
  # keystore file (UTC-- form or a `.keystore` name) referenced beside a
  # YAML config that may hold its unlock password. The two filename atoms
  # are ordinary alone; the composite below records their pairing.
  - id: ethereum-keystore-file-name
    desc: References an Ethereum keystore filename
    conf: 0.85
    if:
      type: text
      regex: '(UTC--[\w:+-]+--[\w-]{8,}|[\w.-]+\.keystore\b)'

  - id: config-yaml-file-name
    desc: References a config.yaml filename
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'config\.ya?ml\b'

composite_rules:
  - id: keystore-file-config-pair
    desc: Keystore file beside YAML config
    crit: notable
    conf: 0.88
    near_bytes: 500
    all:
      - id: ethereum-keystore-file-name
      - id: config-yaml-file-name

  - id: wallet-key-config-pair
    desc: References a wallet keystore and its config together
    crit: notable
    conf: 0.93
    any:
      - id: swarm-key-config-pair
      - id: keystore-file-config-pair
