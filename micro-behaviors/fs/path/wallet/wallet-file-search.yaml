defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
  attack: T1552.001

traits:
- id: python-monero-wallet-directory
  desc: "Per-user Monero wallet directory reference"
  crit: suspicious
  conf: 0.96
  for: [python]
  if:
    type: text
    regex: '(?i)(/home/[^/\s]{1,64}/Monero\b|[\\/]Documents[\\/]Monero\b)'
