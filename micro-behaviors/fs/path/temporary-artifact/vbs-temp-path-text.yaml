---
defaults:
  platforms:
  - windows
  for:
  - lnk
  - batch
traits:
- id: vbs-tmp-path-reference
  desc: VBS path references temp directory
  crit: suspicious
  conf: 0.8
  unless:
  - id: metadata/lang/natural/phrasing/system::windows-safe-mode-toggle-title
  if:
    type: text
    regex: "(?i)(\\$env:tmp|%tmp%).{0,50}\\.vbs"
