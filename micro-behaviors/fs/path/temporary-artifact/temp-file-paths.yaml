defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: baseline
  conf: 0.7
traits:
  - id: batch-temp-file-assignment
    desc: Batch assigns temporary .dat or .tmp path
    crit: notable
    conf: 0.86
    for: [batch]
    platforms: [windows]
    if:
      type: text
      regex: (?i)\bset\s+[A-Za-z0-9_]{3,}=(%TEMP%|%TMP%)[^\r\n]{0,80}\.(dat|tmp)\b
  - id: tmp-pid-format-path
    desc: /tmp/pid.%s path format
    crit: notable
    conf: 0.94
    platforms: [linux]
    for: [elf]
    if:
      type: text
      substr: '/tmp/pid.%s'
  - id: temporary-source-file-path
    desc: Temporary source-file path literal
    crit: notable
    conf: 0.9
    for: [source]
    platforms: [unix]
    if:
      type: literal
      regex: '^/tmp/[A-Za-z0-9_.-]+\.(py|c|sh)$'
  - id: tmp-zip-path
    desc: Temporary directory ZIP path reference
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: /tmp/.{0,50}\.zip
  - id: temporary-lockfile-path
    desc: Temporary directory path ending in a lockfile
    crit: notable
    conf: 0.8
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)(%TEMP%|%TMP%|[\\/](temp|tmp)[\\/])[^"\r\n]{0,120}\.lock\b'
  - id: tmp-out-zip
    desc: /tmp/out.zip path reference
    crit: notable
    conf: 0.6
    if:
      type: literal
      substr: /tmp/out.zip
  - id: tmp-tar-path
    desc: Temporary directory path to a tar archive
    crit: notable
    conf: 0.6
    for: [shell, source]
    if:
      type: text
      regex: '/tmp/[^\s"''`<>;|]{1,100}\.tar([\s"''`<>;|]|$)'
  - id: tmp-gz-path
    desc: Temporary directory path ending in .gz
    crit: notable
    conf: 0.6
    for: [shell, source]
    if:
      type: text
      regex: /tmp/.{0,50}\.gz\b
  - id: tmp-jar-path
    desc: Temporary directory path ending in .jar
    crit: notable
    conf: 0.7
    for: [shell, python, javascript, java, go, ruby, perl]
    if:
      type: text
      regex: /(var/)?tmp/[\w.$-]{1,48}\.jar\b
  # A relative path that climbs three or more levels and lands in a
  # world-writable staging directory. Ordinary relative references do not need
  # that many hops to reach /tmp; a crafted traversal payload aimed at a file
  # the attacker already dropped there does.
  - id: var-tmp-zip
    desc: /var/tmp ZIP path reference
    crit: notable
    conf: 0.6
    if:
      type: literal
      regex: /var/tmp/.{0,50}\.zip
  - id: windows-temp-executable-path
    desc: TEMP executable path or PowerShell path operands
    for: [scripts, binaries, html]
    crit: notable
    conf: 0.9
    platforms: [windows]
    if:
      type: text
      regex: '(?i)(\bTemp\\+|\$env:te?mp\s+[''"])[^\\\s"'']{1,120}\.(exe|dll|bin)\b'
    not:
      - substr: "collect.exe"
  - id: node-temp-env-executable-path
    desc: Node builds TEMP executable path
    crit: notable
    conf: 0.96
    attack: T1105
    for: [javascript, typescript]
    platforms: [windows]
    if:
      type: text
      regex: 'path\.join\s*\(\s*process\.env\.(TEMP|TMP)\s*,\s*["''][^"'']{1,120}\.(exe|dll|bin)["'']'
  - id: windows-temp-percent-executable-path
    desc: Windows TEMP executable path
    crit: notable
    conf: 0.96
    for: [batch, powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)(%TEMP%|%TMP%)\\[^\\\s"'']{1,120}\.(exe|dll|bin)\b'
  - id: word-style-temp-filename
    desc: Word-style temporary filename reference
    crit: notable
    conf: 0.9
    platforms:
      - windows
    if:
      type: text
      regex: (?i)^~WRD[0-9]{4}\.tmp$
  - id: rust-literal-temp-path
    desc: Rust literal references a temporary file
    crit: baseline
    conf: 0.88
    for: [rust]
    if:
      type: string_literal
      regex: '^/(var/)?tmp/[A-Za-z0-9_.-]+$'
  - id: ruby-temporary-html-preview-path
    desc: Ruby references temporary HTML preview path
    crit: notable
    conf: 0.9
    for: [ruby]
    platforms: [unix]
    if:
      type: literal
      kind: string
      regex: '^/(var/)?tmp/.{0,100}(preview|render)[^/]{0,80}\.html$'
  - id: rust-temp-powershell-script-path
    desc: Rust builds a temporary PowerShell script path
    crit: notable
    conf: 0.94
    for: [rust]
    platforms: [windows]
    if:
      type: text
      regex: '(std::)?env::temp_dir\s*\(\s*\)[\s\S]{0,240}["''][^"''\r\n]{1,120}\.ps1["'']'
  - id: rust-temp-vbscript-path
    desc: Rust builds a temporary VBScript path
    crit: notable
    conf: 0.94
    for: [rust]
    platforms: [windows]
    if:
      type: text
      regex: '(std::)?env::temp_dir\s*\(\s*\)[\s\S]{0,240}["''][^"''\r\n]{1,120}\.vbs["'']'
  - id: java-temp-png-output-path
    desc: Java File constructor for temporary PNG output
    crit: notable
    conf: 0.82
    platforms: [windows, unix, android]
    for: [java]
    if:
      type: symbol
      kind: call
      exact: File
      arg:
        kind: string
        regex: '(?i)(/tmp/|/var/tmp/|\\temp\\).{0,40}\.png$'
  - id: macos-package-archive-path
    desc: macOS temp or Downloads .pkg path
    crit: notable
    conf: 0.86
    platforms: [macos]
    for: [shell, scripts, source]
    if:
      type: text
      regex: '(?i)(/tmp/|/Downloads/).{0,120}\.pkg\b'
  # A directory segment is a path reference, not evidence of creation.
  - id: js-path-under-tmp
    desc: JavaScript file path under a temp directory
    crit: notable
    conf: 0.75
    for: [javascript, typescript]
    if:
      type: string_literal
      regex: '\.?/tmp/[^/\r\n''"`\s]{0,120}\.js\b'
