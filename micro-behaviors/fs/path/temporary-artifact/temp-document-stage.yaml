# Temporary office/PDF document staging paths written by scripts.
defaults:
  platforms: [windows, unix]
  for: [powershell, batch, python, javascript, typescript, vbs]
  crit: notable

traits:
  - id: document-subpath-literal
    desc: Path separator before office or PDF filename
    conf: 0.88
    if:
      type: text
      exclude_comments: true
      # Filename characters only: an escaped "\n" before code such as
      # getHref(options.doc) is not a path to a .doc file.
      regex: '(?i)[\\/][^\\/\r\n"'';=,{}<>]{1,64}\.(pdf|docx?|xlsx?|pptx?|hwpx?|rtf)\b'

composite_rules:
  - id: script-temp-dir-lookup
    desc: Queries temporary directory path in script
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/temp::env-temp
      - id: micro-behaviors/fs/path/temp::get-temp-path
      - id: micro-behaviors/fs/path/temp::win-temp-env
      - id: micro-behaviors/os/sysinfo/directories::python-temp-directory-lookup
      - id: micro-behaviors/os/sysinfo/directories::node-os-tmpdir

  - id: script-file-write-call
    desc: Writes content to local file in script
    conf: 0.9
    any:
      - id: micro-behaviors/fs/write/file/redirect::out-file
      - id: micro-behaviors/fs/write/file/full/string::powershell-set-content-call
      - id: micro-behaviors/fs/write/file/content::dotnet-file-write-method-text
      - id: micro-behaviors/fs/file/io-mode::write-append-create-mode
      - id: micro-behaviors/fs/write/file/full/string::python-pathlib-write-text
      - id: micro-behaviors/fs/write/file/content::js-file-write

  - id: temp-document-write-staging
    desc: Writes document file inside temp directory
    conf: 0.92
    near_bytes: 240
    all:
      - id: script-temp-dir-lookup
      - id: document-subpath-literal
      - id: script-file-write-call
