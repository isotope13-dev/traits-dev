---
defaults:
  platforms:
  - windows
  - unix
  for:
  - swift
traits:
- id: swift-temp-exe-pair-reference
  desc: Repeated temporary executable path references
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: "%TEMP%\\\\\\\\[A-Za-z0-9_.-]+\\.exe[\\s\\S]{0,80}%TEMP%\\\\\\\\[A-Za-z0-9_.-]+\\.exe"
