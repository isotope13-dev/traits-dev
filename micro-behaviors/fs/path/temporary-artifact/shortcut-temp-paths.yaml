defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-relative-temp-short-name
    desc: LNK relative path has short Temp name
    crit: component
    conf: 0.84
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)[\\/]Local[\\/]Temp[\\/][^\\/.]{1,3}$'
  - id: lnk-target-local-temp-path
    desc: LNK target path is Local Temp
    crit: notable
    conf: 0.86
    if:
      type: value
      path: lnk.target_path
      regex: '(?i)^Local[\\/]Temp[\\/]'
  - id: lnk-relative-temp-exe
    desc: LNK relative path is a Temp executable
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: lnk.relative_path
      regex: '(?i)[\\/]Temp[\\/][^\\/]+\.exe$'
  - id: lnk-text-local-temp-path
    desc: LNK text contains Local Temp path
    crit: component
    conf: 0.84
    if:
      type: text
      regex: '(?i)Local.{0,80}Temp'
  - id: lnk-text-temp-hex-exe
    desc: Hex-named executable in a Temp directory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)Local\\Temp\\[a-f0-9]{16,64}\.exe'
  - id: lnk-text-user-temp-dir
    desc: User Temp directory in a shortcut
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '(?i)\\Users\\[^\\]{1,40}\\AppData\\Local\\Temp\\'
  - id: lnk-text-temp-shortname
    desc: LNK text references Temp 8.3 name
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)Local\\Temp\\[A-Z0-9]{1,8}~[0-9]'
  - id: lnk-temp-path-mz-filename
    desc: Temp target uses MZ-prefixed filename
    crit: notable
    conf: 0.9
    if:
      # The shortcut resolves into Local Temp at a file whose name starts
      # with MZ, the DOS executable magic droppers reuse as a payload
      # marker. This records the staged name only; no embedded executable
      # or DOS header is claimed.
      type: value
      path: lnk.target_path
      regex: '(?i)Temp[\\/]MZ'
