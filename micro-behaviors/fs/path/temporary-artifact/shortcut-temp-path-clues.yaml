defaults:
  platforms: [windows]
  for: [lnk]

composite_rules:
  - id: lnk-traversal-local-temp-reference
    desc: LNK traversal and Local Temp reference
    crit: suspicious
    conf: 0.91
    all:
      - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
    any:
      - id: micro-behaviors/fs/path/temporary-artifact::lnk-target-local-temp-path
      - id: micro-behaviors/fs/path/temporary-artifact::lnk-text-local-temp-path
    needs: 1
  - id: lnk-user-temp-hex-exe-reference
    desc: LNK references user Temp and hex EXE
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/temporary-artifact::lnk-text-temp-hex-exe
      - id: micro-behaviors/fs/path/temporary-artifact::lnk-text-user-temp-dir
  - id: lnk-user-temp-shortname-references
    desc: LNK references user Temp and 8.3 name
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/temporary-artifact::lnk-text-temp-shortname
      - id: micro-behaviors/fs/path/temporary-artifact::lnk-text-user-temp-dir
  - id: lnk-temp-path-mz-filename-clues
    desc: LNK Temp target with MZ-named file clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/temporary-artifact::lnk-temp-path-mz-filename
      - id: micro-behaviors/fs/path/temporary-artifact::lnk-traversal-local-temp-reference
