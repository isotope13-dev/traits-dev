defaults:
  platforms: [windows]
  for: [powershell]
traits: []
composite_rules:
  - id: temp-exe-character-fragments
    desc: PowerShell TEMP executable and character fragments
    crit: suspicious
    conf: 0.94
    any:
      - id: micro-behaviors/fs/path/temporary-artifact::ps-temp-char-exe-path
      - id: metadata/lang/source/literal/fragment/sequence::ps-char-exe-fragment
