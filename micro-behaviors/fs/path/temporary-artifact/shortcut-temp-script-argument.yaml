defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-temp-script-path-argument
    desc: LNK references a temp script path
    crit: suspicious
    conf: 0.95
    if:
      type: value
      path: lnk.arguments
      regex: '%TEMP%\\\\?\S{1,40}\.(ps1|vbs|js)'
      case_insensitive: true
