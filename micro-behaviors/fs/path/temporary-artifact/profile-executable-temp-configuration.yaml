defaults:
  crit: component
  platforms: [windows]
  for: [data]
traits:
- id: temp-83-dat-path-config
  desc: Short-path temporary DAT configuration entry
  conf: 0.9
  size_max: 512
  if:
    type: text
    regex: (?i)C:\\DOCUME~1\\[^\\]{1,16}\\LOCALS~1\\Temp\\[^,]{1,40}\.dat,\d
- id: repeated-temp-dat-config
  desc: Repeated temporary DAT configuration entries
  conf: 0.88
  size_max: 512
  count_min: 2
  if:
    type: text
    regex: (?i)\\Temp\\[^,]{1,40}\.dat,\d
composite_rules:
- id: short-and-repeated-temp-dat-config
  crit: notable
  desc: Short and repeated temporary DAT entries
  conf: 0.94
  all:
  - id: micro-behaviors/fs/path/temporary-artifact::temp-83-dat-path-config
  - id: micro-behaviors/fs/path/temporary-artifact::repeated-temp-dat-config
