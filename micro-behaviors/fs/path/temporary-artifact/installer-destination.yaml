# Where an installer put an extracted entry, read off the analysis path rather
# than off file content.
#
# NSIS records each `File` destination as a script variable, and every NSIS
# unpacker (7-Zip, cleave's own extractor) reproduces those variables as the
# leading path component of the extracted entry: `$PLUGINSDIR/…`, `$INSTDIR/…`,
# `$TEMP/…`. So the path segment identifies the install-time destination
# directory, not a real on-disk location.
#
# `$PLUGINSDIR` is deliberately not covered here: it is the normal, expected
# home for NSIS plugin DLLs and carries no signal. `$TEMP` is the interesting
# one — it is the user temp directory, outside anything the uninstaller tracks,
# and it is where crypter-style installers drop a loader plus its payload before
# handing control over. Plenty of legitimate installers stage a helper there
# too, which is why this is a neutral location fact; composites add the shape of
# what was dropped.
defaults:
  platforms: [windows]
  for: [pe, dll, data]
  crit: notable
  conf: 0.9

traits:
  - id: nsis-temp-destination-entry
    desc: Installer extracts entry to NSIS $TEMP
    if:
      type: path
      regex: '\$TEMP[\\/]'
