# The loader's filename is also present in the official Microsoft binaries.
# It establishes a library reference, not impersonation or sideloading.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: webview2-loader-dll-name
    desc: WebView2 loader DLL name
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: WebView2Loader.dll
