defaults:
  platforms: [macos]
  for: [scripts, source, class, java_class]
  crit: notable
  conf: 1.0

traits:
  - id: dylib-name-literal
    desc: Literal references a .dylib name
    # A name alone establishes neither payload delivery nor library loading.
    if:
      type: literal
      substr: .dylib

  - id: class-dylib-name
    desc: Class string references a .dylib name
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      substr: .dylib
