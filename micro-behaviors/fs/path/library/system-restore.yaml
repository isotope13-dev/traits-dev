defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]

traits:
  - id: srclient-dll-reference
    desc: System Restore client DLL reference
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: srclient.dll
    unless:
      - id: metadata/file/profile/source-indications/
      - id: metadata/binary/vendor::python-software-foundation-marker
      - id: metadata/signed/unknown::python-software-foundation
      - id: metadata/signed/leaf::python-software-foundation
