defaults:
  platforms:
    - macos
  for:
    - macho
    - shell
    - go
traits:
  - id: ds-store-path
    desc: .DS_Store metadata path reference
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: .DS_Store
  - id: library-caches-path
    desc: /Library/Caches directory reference
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: /Library/Caches/
  - id: library-fonts-path
    desc: /Library/Fonts directory reference
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: /Library/Fonts/
  - id: library-osrecovery-path
    desc: /Library/OSRecovery directory reference
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: /Library/OSRecovery/
  - id: library-group-containers
    desc: /Library/Group Containers reference
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: /Library/Group Containers/
  - id: hidden-library-caches
    desc: Hidden file in /Library/Caches
    crit: suspicious
    conf: 0.85
    attack: T1564.001
    if:
      type: text
      regex: /Library/Caches/\.[a-zA-Z0-9_\-]+
  - id: hidden-library-fonts
    desc: Hidden file in /Library/Fonts
    crit: suspicious
    conf: 0.85
    attack: T1564.001
    if:
      type: text
      regex: /Library/Fonts/\.[a-zA-Z0-9_\-]+
  - id: library-application-support
    desc: /Library/Application Support path reference
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: "/Library/Application Support/"
  - id: user-library-application-support
    desc: User Library Application Support path
    crit: baseline
    conf: 0.7
    if:
      type: text
      substr: "Library/Application Support"
  - id: library-logs-path
    desc: /Library/Logs path reference
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: "/Library/Logs/"
  - id: user-library-caches-apple-path
    desc: User Library Apple-named cache path reference
    crit: baseline
    conf: 0.85
    for: [python, shell, go, macho]
    if:
      type: text
      regex: ~/Library/Caches/com\.apple\.[a-z][a-z0-9.-]{2,40}
  - id: system-library-caches-apple-path
    desc: System Library Apple-named cache path reference
    crit: baseline
    conf: 0.85
    for: [python, shell, go, macho]
    if:
      type: text
      # Require a root/argument boundary. Apple toolchains embed build-source
      # paths such as /AppleInternal/BuildRoot/Library/Caches/com.apple.*.
      regex: '(^|[^/A-Za-z0-9_.-])/Library/Caches/com\.apple\.[a-z][a-z0-9.-]{2,40}'
