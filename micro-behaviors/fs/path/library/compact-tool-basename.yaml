defaults:
  platforms:
    - windows
    - unix
  for:
    - scripts
    - pe
    - elf
    - macho
traits:
  - id: compact-tool-basename
    desc: Compact utility module basename
    crit: notable
    conf: 1.0
    for:
      - javascript
    if:
      type: path
      basename: true
      regex: ^(rimraf|run-(script-)?os|ipv6(grep)?)$
