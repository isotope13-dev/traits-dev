  - id: micro-behaviors/fs/path/library::dll-reference-osppc
  - id: micro-behaviors/fs/path/library::dll-reference-osppcext
  - id: metadata/file/string/application-name::official-7zip-dll-reference
  - id: micro-behaviors/fs/path/library::dll-reference-mapi32
  - id: micro-behaviors/fs/path/library::dll-reference-version
  unless:
  - id: metadata/file/string/application-name::7zip-gui-official-manifest
