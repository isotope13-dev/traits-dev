defaults:
  platforms: [windows]
  for: [c, cpp, csharp, javascript, typescript, powershell, python]
  crit: notable
  conf: 0.95

traits:
  - id: appdata-microsoft-updater-dll
    desc: AppData DLL path names a Microsoft updater
    if:
      type: literal
      regex: '(?i)^%APPDATA%[\\/]Microsoft[^\\/]{0,64}Update[^\\/]{0,32}\.dll$'
