defaults:
  crit: notable
  conf: 0.8
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: scrobj-name-reference
    desc: References the scrobj.dll scriptlet library
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: scrobj\.dll
      case_insensitive: true
  - id: scrobj-encoded-name-reference
    for: [powershell, batch, vbs, javascript, html, pe, dll]
    desc: Encoded scrobj.dll library-name reference
    if:
      type: encoded
      encoding:
        - base64
        - hex
      regex: scrobj\.dll
      case_insensitive: true
  - id: scrobj-hex-name-reference
    desc: Hex scrobj.dll library-name reference
    if:
      type: text
      substr: 7363726f626a2e646c6c
