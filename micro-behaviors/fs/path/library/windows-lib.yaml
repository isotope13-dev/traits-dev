# Lib is a library-directory component, not Python interpreter identity.
# Requiring its leading separator excludes TypeLib registry paths.
defaults:
  platforms: [windows]
  for: [python]
traits:
  - id: windows-lib-directory-component
    desc: Windows Lib directory path component
    crit: notable
    conf: 0.92
    if:
      type: literal
      kind: string
      regex: '(^|[\\/])Lib[\\/]'
