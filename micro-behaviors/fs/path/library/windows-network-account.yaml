defaults:
  platforms: [windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: ip-helper-dll-path-literal
    desc: IP Helper DLL path literal
    if:
      type: literal
      regex: '(?i)(^|[\\/])iphlpapi\.dll$'
      exclude_docstrings: true

  - id: sam-client-dll-path-literal
    desc: SAM client DLL path literal
    if:
      type: literal
      regex: '(?i)(^|[\\/])samcli\.dll$'
      exclude_docstrings: true
