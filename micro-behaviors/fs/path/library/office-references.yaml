# References do not establish loading, side-loading or masquerading.
defaults:
  platforms: [windows]
  for: [pe]
traits:
- id: office-mso-win32client-dll-reference
  desc: Office Mso Win32 client DLL name reference
  crit: notable
  conf: 0.93
  if:
    type: text
    section: any
    regex: (?i)mso(20|30|40(ui)?|99L)win32client\.dll
- id: office-mso-dll-reference
  desc: Office MSO.dll library name reference
  crit: notable
  conf: 0.92
  if:
    type: text
    section: any
    exact: MSO.dll
