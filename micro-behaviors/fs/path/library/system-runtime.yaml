defaults:
  platforms: [unix, windows]
  for: [elf]
traits:
  - id: system-lib64
    desc: Reference to /lib64
    crit: baseline
    conf: 0.66
    if:
      type: text
      regex: /lib64/[\w\.\-/]+
  - id: system-lib-python
    desc: Reference to Python library paths
    crit: baseline
    conf: 0.66
    if:
      type: text
      regex: /usr/lib/python[\d\.]+/[\w\.\-/]+
