# WinINet also exposes connectivity and FTP APIs. Its library name alone
# establishes neither an HTTP request nor a constructed stack string.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.95
traits:
  - id: wininet-dll-name-reference
    desc: WinINet DLL name reference
    if:
      type: text
      exact: WININET.dll
      case_insensitive: true
  - id: wininet-dll-name-in-text
    desc: WinINet DLL name in text section
    if:
      type: text
      substr: wininet.dll
      case_insensitive: true
      section: .text
