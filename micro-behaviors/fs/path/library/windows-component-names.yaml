defaults:
  platforms: [windows, unix]
  for: [binaries]
traits:
  - id: windows-browser-runtime-dll-name
    desc: Windows browser or runtime DLL name
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(chakra|mshtml|edgehtml|mscoree)\.dll'
  - id: windows-system-component-dll-name
    desc: Windows system component DLL name
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(clbcatq|wow64log|ualapi|msdtcprx)\.dll'
