defaults:
  platforms: [windows]
  for: [csharp]
  crit: notable
  conf: 0.85
traits:
  - id: csharp-combine-library-name
    desc: Combines path with DLL filename
    if:
      type: symbol
      kind: call
      exact: Path.Combine
      arg:
        index: 1
        kind: string
        regex: '(?i)^[\w.-]{1,80}\.dll$'
