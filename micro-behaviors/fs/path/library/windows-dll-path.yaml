defaults:
  platforms: [windows]
traits:
  - id: windows-dll-file-path-reference
    desc: Windows DLL file path reference
    crit: notable
    conf: 0.82
    for: [python, c, cpp, csharp, rust, go, powershell, batch, pe, dll]
    if:
      type: text
      regex: '(?im)^[^/\r\n]{0,160}C:\\[^"\r\n]{1,120}\.dll\b'
    unless:
      - id: metadata/package/testing/harness/unit::rust-test
