defaults:
  platforms: [windows, unix]
  for: [javascript]

traits:
  - id: prebuilds-quoted-addon-node-filename
    desc: Quoted prebuilds path ending in .node
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '["'']prebuilds["''][^\n]{0,120}["''][A-Za-z0-9_.-]+\.node["'']'
  - id: prebuilds-relative-require-path
    desc: require() targets ./prebuilds platform path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'require\s*\(\s*["'']\.\/prebuilds\/[^"'']{1,120}["'']\s*\)'

composite_rules:
  - id: prebuilds-node-addon-name-pair
    desc: References prebuilds and Node addon names
    crit: notable
    conf: 0.96
    any:
      - id: prebuilds-quoted-addon-node-filename
      - id: prebuilds-relative-require-path
