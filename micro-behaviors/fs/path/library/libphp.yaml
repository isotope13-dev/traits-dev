# Module lookup names also occur in scanners' target catalogs. This records
# the name without asserting that the analyzed program implements PHP.
traits:
  - id: libphp-module-name-reference
    desc: References a libphp runtime module name
    crit: notable
    conf: 0.96
    platforms: [linux, macos, windows]
    for: [source, binaries, -class, -pyc, -beam, -wasm, -static-lib]
    size_max: 600000000
    if:
      type: text
      regex: '(?i)^(libphp|libphp\.so|libphp\.so\.[0-9.]{1,32})$'
