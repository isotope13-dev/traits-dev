# JavaScript that maps a platform key to a plain shared library under
# `prebuilds/<os>-<arch>/` (`libfoo.so`, `libfoo.dylib`) rather than a Node
# addon (`*.node`). Such a library is not loadable with require(); it is meant
# for an FFI/dlopen loader, so its exports are C entry points, not N-API.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92

traits:
  - id: prebuilds-platform-shared-library-path
    desc: JS maps prebuilds dir to .so/.dylib
    if:
      type: text
      regex: 'prebuilds/(linux|darwin|win32)-\w{2,6}/[\w.-]{1,60}\.(so|dylib)\b'
