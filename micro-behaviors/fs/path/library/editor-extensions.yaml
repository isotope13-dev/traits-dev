defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: editor-extensions-directory-reference
    desc: References an editor extensions directory
    crit: notable
    conf: 0.85
    if:
      type: text
      # Matches both a literal path (~/.vscode/extensions) and a joined one
      # (path.join(os.homedir(), '.vscode', 'extensions')). Covers the VS Code
      # forks that reuse the same on-disk layout.
      regex: '\.(vscode|cursor|windsurf)["'']?\s*[,/\\]\s*["'']?extensions([/\\"'']|$)'
