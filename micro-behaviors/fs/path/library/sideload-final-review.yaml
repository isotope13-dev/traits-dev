defaults:
  platforms:
    - windows
  for: [scripts, binaries]

traits:
  - id: shell-suffixed-dll-reference
    desc: Shell-suffixed DLL name reference
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: \w+_shell\.dll
  - id: version-dll-path-format
    desc: Formatted version DLL path reference
    crit: notable
    conf: 0.96
    for:
      - pe
    if:
      type: text
      exact: '%s\version.dll'
