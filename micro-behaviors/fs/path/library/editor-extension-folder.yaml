# VS Code-family editors install each extension under
# <extensions root>/<publisher>.<name>-<version>/. Filtering directory names by
# a "publisher.name-" prefix and joining a bundled script beneath the match
# locates another extension's code on disk. Reading or rewriting it is a
# separate step; these traits only establish the location.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: versioned-extension-folder-prefix-filter
    desc: Filters folders by extension ID prefix
    if:
      type: text
      regex: '\.startsWith\(\s*["''][a-z][a-z0-9-]{1,39}\.[a-z][a-z0-9-]{1,59}-["'']\s*\)'

  - id: extension-folder-script-join
    desc: Joins a bundled script inside extension folder
    if:
      type: text
      regex: 'join\(\w+,\s*\w+,\s*["''](webview|out|dist|media)["'']\s*,\s*["''][\w.-]{1,40}\.js["'']'

composite_rules:
  - id: installed-extension-script-locator
    desc: Locates a script inside an installed extension
    near_bytes: 400
    all:
      - id: versioned-extension-folder-prefix-filter
      - id: extension-folder-script-join
