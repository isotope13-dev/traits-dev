defaults:
  platforms: [windows]
traits:
  - id: programdata-library-path
    desc: ProgramData DLL file path
    crit: notable
    conf: 0.9
    for: [python, c, cpp, csharp, rust, go, powershell, batch, pe, dll]
    if:
      type: text
      regex: '(?i)([A-Z]:\\+ProgramData\\+|%ProgramData%\\+|\$env:ProgramData\\+)[^"''\r\n]{1,160}\.dll\b'
