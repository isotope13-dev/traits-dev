traits:
- for:
  - batch
  - c
  - cpp
  - csharp
  - go
  - rust
  - python
  - powershell
  - javascript
  - typescript
  id: environment-library-path
  desc: Environment-based DLL path
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)%(TEMP|APPDATA|LOCALAPPDATA|PROGRAMDATA)%[\\/][^"\r\n]{0,120}\.dll\b
- for:
  - powershell
  id: powershell-environment-library-path
  desc: PowerShell user-writable DLL path
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)\$env:(TEMP|APPDATA|LOCALAPPDATA|PROGRAMDATA)[\\/][^"\r\n]{0,120}\.dll\b
defaults:
  platforms:
  - windows
