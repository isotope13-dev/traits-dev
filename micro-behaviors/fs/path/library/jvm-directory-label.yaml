# A constant-pool directory label, not a Java runtime property or a user-home
# path by itself. Dylib staging consumers supply the surrounding behavior.
defaults:
  platforms: [macos]
  for: [class, java_class]
  attack: T1574.004
  mbc: F0015

traits:
  - id: jvm-lib-directory-label
    desc: JVM class names a lib directory
    crit: notable
    conf: 0.95
    if:
      type: value
      path: class.strings[*]
      exact: lib
    unless:
      - id: well-known/tool/development/build/gradle-wrapper::gradle-wrapper-package-class
