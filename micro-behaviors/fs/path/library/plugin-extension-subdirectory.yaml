traits:
- platforms:
  - windows
  - unix
  for:
  - scripts
  crit: notable
  conf: 0.9
  id: plugins-or-extensions-subdirectory-reference
  desc: References nested plugins or extensions path
  if:
    type: text
    regex: (?i)(plugins|extensions)/[^/\n]{0,40}(plugin|addon|ext)([^A-Za-z0-9_/][^/\n]{0,20})?/
  not:
  - substr: /node_modules/
  - substr: node_modules/.pnpm/
