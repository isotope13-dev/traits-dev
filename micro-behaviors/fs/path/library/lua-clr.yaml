# A CLR DLL location points at a library, regardless of its Windows ancestor.
defaults:
  platforms: [windows]
  for: [lua]
  crit: notable
  conf: 0.98
traits:
  - id: lua-clr-runtime-library-path
    desc: Lua literal names Windows CLR library path
    if:
      type: literal
      regex: '(?i)[\\/]Microsoft\.NET[\\/]Framework(64)?[\\/].*[\\/]clr\.dll$'
