# A DLL path alone establishes neither loading nor evasion. Keep the public
# profile refinement here; objectives supply the load/launch relationship.
defaults:
  platforms: [windows]
  for: [scripts, source]
traits:
  - id: public-directory-dll-path
    desc: Public-directory DLL path reference
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)[\\/]Users[\\/]Public[\\/][^"\r\n]{0,120}\.dll\b'
