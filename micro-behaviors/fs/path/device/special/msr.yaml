defaults:
  platforms: [linux]
  for: [binaries, scripts, source]
  crit: notable
  conf: 0.98

traits:
  # CPU indices may be concrete, printf substitutions, or fmt placeholders.
  # The path identifies a register device; it proves neither access nor abuse.
  - id: cpu-msr-device-path
    desc: References Linux CPU MSR device path
    if:
      type: text
      regex: '/dev/cpu/([0-9]+|%[du]|\{[^/}]{0,20}\})/msr\b'
