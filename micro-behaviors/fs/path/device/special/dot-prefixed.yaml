defaults:
  for: [elf, shell]
  platforms: [unix]
traits:
- id: dot-prefixed-dev-path-reference
  desc: References a dot-prefixed /dev path
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '(^|[\s"''=:(])\/dev\/[.][A-Za-z0-9._-]{1,30}\b'
  # Android init's own boot markers, not a hidden payload path.
  not:
  - /dev/.booting
  - /dev/.coldboot_done
  # Linux initramfs boot progress and netboot configuration markers.
  - /dev/.progress
  - /dev/.kernel_ipconfig
  - /dev/.storage_netboot
  - /dev/.flash_netboot
  - /dev/.update_disabled
  # SUSE sysconfig network state staged under /dev inside boot images
  # (KIWI-style appliance boot) and removed after configuration.
  - /dev/.sysconfig
  # Apache Release Audit Tool (RAT) configuration file in repo dev/ directory
  - /dev/.rat-excludes
  # ChromeOS release-milestone marker that Chromium and Dart tooling test for.
  - /dev/.cros_milestone
  # Magisk mknods a transient evdev node here, opens and unlinks it at once,
  # and reads EVIOCGBIT to test the volume-down safe-mode key at boot.
  - /dev/.ev
  unless:
  - type: text
    regex: /dev/\.null\b
  - type: text
    substr: /dev/./
  - type: text
    regex: /dev/\.tmp\.md
  # The dot-prefixed names that container, device manager, and init runtimes
  # create in /dev by design: udev, devfsd, mdev (e.g. mdev-like-a-boss), and
  # buildkit.
  - type: text
    regex: '/dev/\.(udev|devfsd|buildkit_|mdev)'
  # LXC/Incus create /dev/.lxc / /dev/.incus runtime mounts and credentials
  # inside containers, and dracut and initramfs-tools use /dev/.initramfs and
  # /dev/.in_sysinit while assembling the early root.
  - type: text
    regex: '/dev/\.(lxc|incus|initramfs|in_sysinit)'
  # Systemd generators commonly embed unit-description templates whose
  # substitution placeholder leaves a string such as /dev/.service. That is
  # generated metadata, not a hidden device path.
  - type: text
    regex: '(?i)Description=.*on /dev/\.[A-Za-z0-9._-]+'
  # util-linux libmount stores the userspace mount table at /dev/.mount/utab
  # when /run/mount/utab is unavailable. The dotted directory is the library's
  # own path, not a hidden payload.
  - type: text
    regex: /dev/\.mount\b
  - id: metadata/package/files/wheel-sdist::python-wheel-vendored-shlib-dir
  - id: metadata/package/files/system-package::os-bundled-native-library
