defaults:
  platforms: [linux]
  for: [elf, shell, python]
  crit: notable

traits:
  # A device pathname establishes neither a memory read nor credential dumping.
  # XMRig, for example, uses this device as a fallback for SMBIOS discovery.
  - id: dev-mem-path
    desc: References Linux physical-memory device path
    conf: 0.99
    if:
      type: text
      regex: '/dev/mem\b'
