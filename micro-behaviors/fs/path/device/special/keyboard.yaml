# Keyboard device nodes. Referencing one is what every legitimate keyboard
# backend does — SDL, X11, console utilities, BSD kbdcontrol — so the bare path
# is a neutral device-access capability, not evidence of capture. The keylogging
# intent lives in objectives/collection/keylog/device/, which composes this atom
# with read-side evidence.
defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]
  crit: notable
  conf: 0.9

traits:
  - id: dev-kbd-path
    desc: References a /dev/kbd keyboard device node
    mbc: E1083
    attack: T1083
    if:
      type: text
      substr: /dev/kbd
