composite_rules:
- platforms:
  - unix
  for:
  - shell
  - python
  - go
  - rust
  - perl
  - javascript
  - typescript
  - c
  - cpp
  id: unix-block-device-reference
  desc: References Unix block-device paths
  crit: notable
  conf: 0.9
  unless:
  - id: well-known/app/infrastructure/docker::source-tree
  - id: well-known/app/infrastructure/docker::docker-source-archive-context
  any:
  - id: micro-behaviors/fs/enumerate/device::block-device-path-enumeration
  - id: "micro-behaviors/fs/path/device/storage::dev-sd"
  - id: micro-behaviors/fs/path/device/storage::unix-block-device-path
  - id: micro-behaviors/fs/proc/mounts::proc-mounts-dev-path-scan
