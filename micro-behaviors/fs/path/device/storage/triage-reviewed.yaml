composite_rules:
- platforms:
  - unix
  for:
  - shell
  - python
  - go
  - rust
  - perl
  - javascript
  - typescript
  - c
  - cpp
  id: block-device-location-observations
  desc: Block-device path or inventory references
  conf: 0.9
  unless:
  - id: well-known/app/infrastructure/docker::source-tree
  - id: well-known/app/infrastructure/docker::docker-source-archive-context
  any:
  - id: micro-behaviors/fs/enumerate/device::block-device-path-enumeration
  - id: micro-behaviors/fs/path/device/storage::linux-scsi-sata-device-path
  - id: micro-behaviors/fs/path/device/storage::unix-block-device-path
  - id: micro-behaviors/fs/proc/mounts::proc-mounts-dev-path-scan
traits:
- for:
  - binaries
  - scripts
  - -python
  platforms:
  - linux
  id: linux-scsi-sata-device-path
  desc: References a /dev/sd SCSI/SATA device path
  conf: 0.8
  if:
    type: text
    regex: /dev/sd[a-z]
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
defaults:
  crit: notable
