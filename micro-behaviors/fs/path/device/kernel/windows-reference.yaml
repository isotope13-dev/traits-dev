defaults:
  platforms: [windows]
traits:
  - id: windows-kernel-device-path-reference
    desc: Windows kernel-device path reference
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, go, rust, powershell]
    if:
      type: text
      # Match both the runtime form (`\\.\Name`) and C/C++ source escapes
      # (`\\\\.\\Name`) so device opens in injector source are visible.
      regex: '(?i)(\\\\\.\\|\\\\\\\\\.\\\\)([A-Za-z_][A-Za-z0-9_.-]{2,80}|\{[0-9a-f-]{8,80}\})'
    not:
      # `\\.\pipe\` and `\\.\mailslot\` are IPC endpoints, not devices, and have
      # their own traits under communications/ipc/; calling them a kernel device
      # handle mis-describes every ordinary named-pipe server.
      - regex: '(?i)^(\\\\\.\\|\\\\\\\\\.\\\\)(pipe|mailslot)$'
      # `\\.\root\...` is the WMI namespace path (e.g. `[wmiclass]"\\.\root\subscription:..."`),
      # not a kernel device.
      - regex: '(?i)^(\\\\\.\\|\\\\\\\\\.\\\\)root$'
      - regex: '(?i)^(\\\\\.\\|\\\\\\\\\.\\\\)UNC$'
