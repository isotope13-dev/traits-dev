defaults:
  platforms: [unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.7

traits:
  - id: dev-kmsg-path
    desc: References /dev/kmsg kernel message device
    if:
      type: text
      substr: /dev/kmsg

  - id: windows-kernel-device-path
    desc: References a Windows kernel device path
    crit: notable
    conf: 0.85
    platforms: [windows]
    not:
      # `\\.\pipe\<name>` is the named-pipe device, i.e. local IPC, not raw
      # device access; describing it as a kernel device path misleads triage.
      # micro-behaviors/communications/ipc/named-pipe/ carries that spelling.
      - substr: '\\.\\pipe'
    if:
      type: text
      # Require a complete device-name component followed by a path
      # boundary.  Without this, escaped JavaScript regex tokens such as
      # `\\\\.\\\\d{` were mistaken for `\\\\.\\\\Device...` paths.
      regex: '(?i)\\\\\.\\\\[a-z][a-z0-9_.-]{2,31}(/|\\\\|$)'
