defaults:
  platforms: [unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.7

traits:
  - id: dev-kmsg-path
    desc: References /dev/kmsg kernel message device
    if:
      type: text
      substr: /dev/kmsg

  - id: windows-kernel-device-path
    desc: References a Windows kernel device path
    crit: notable
    conf: 0.85
    platforms: [windows]
    if:
      type: text
      regex: '(?i)\\\\\.\\\\[A-Za-z0-9_.{}-]{2,80}'
