defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: windows-root-directory-wildcard
    desc: Windows directory wildcard path
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'C:\Windows\*'
  - id: windows-root-filename-format
    desc: Filename formatted under Windows directory
    crit: notable
    conf: 0.96
    if:
      type: text
      substr: 'C:\Windows\%s'
