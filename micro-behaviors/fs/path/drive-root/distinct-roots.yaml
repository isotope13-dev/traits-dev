# Distinct Windows drive-root literals, without an enumeration claim.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-multiple-drive-roots
    desc: Lists distinct Windows drive roots
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((array . (string) @root1 . (string) @root2)
        (#match? @root1 "^[\"'][A-Za-z]:\\\\{2,}[\"']$")
        (#match? @root2 "^[\"'][A-Za-z]:\\\\{2,}[\"']$")
        (#not-eq? @root1 @root2))
