traits:
- id: batch-drive-letter-string
  desc: Batch assigns a drive-letter candidate range
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: (?i)\bset\s+["']?[A-Za-z_]\w*\s*=\s*CDEFGHIJKLMNOPQRSTUVWXYZ
- id: batch-drive-letter-index-read
  desc: Batch constructs an indexed drive prefix
  crit: suspicious
  conf: 0.94
  if:
    type: text
    regex: '(?i)![A-Za-z_]\w*:~%[A-Za-z_]\w*%,1!:'
defaults:
  platforms:
  - windows
  for:
  - batch
