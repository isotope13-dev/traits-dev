# The short NUL-terminated paths are absent from cleave's extracted text.
defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: many-root-executable-paths
    desc: Table of drive-root executable paths
    crit: notable
    conf: 0.95
    count_min: 6
    if:
      type: raw
      regex: '(?i)[a-z]:\\[a-z0-9_.-]{1,32}\.exe\x00'
      section: .rdata
