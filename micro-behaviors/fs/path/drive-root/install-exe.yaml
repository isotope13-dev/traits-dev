# Drive-root install.exe is a path, not proof the file is copied or run.
defaults:
  platforms: [windows]
  for: [batch, text, scripts]
  crit: notable
  conf: 0.86

traits:
  - id: drive-root-install-exe
    desc: Drive-root install.exe path
    if:
      type: text
      regex: '(?i)[A-Za-z]:\\install\.exe\b'
