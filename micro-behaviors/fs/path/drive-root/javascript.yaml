# A literal list does not establish directory or drive enumeration.
# Preserve the previous text matcher and scope; actual readdir calls have
# their own directory-listing observation.
defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: windows-drive-root-literal-list
    desc: Lists consecutive Windows drive-root literals
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "(\\[\\s*)?([\"'][A-Za-z]:\\\\\\\\[\"']\\s*,\\s*){2,}[\"'][A-Za-z]:\\\\\\\\[\"']"
