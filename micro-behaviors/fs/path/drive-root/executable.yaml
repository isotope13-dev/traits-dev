defaults:
  for: [scripts, binaries]
  platforms: [windows]
  crit: notable
  conf: 0.8
traits:
  - id: drive-root-executable-path
    desc: Drive-root executable path reference
    if:
      type: text
      regex: (?i)[C-Z]:\\[A-Za-z0-9_. -]{1,120}\.exe
    not:
      - regex: '(?i)[C-Z]:\\[sSdDwWbBrRnNtTvV]'
