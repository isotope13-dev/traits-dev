# A literal list of several bare drive roots ('D:\', 'E:\', ...) names
# candidate secondary or removable volumes to walk. Backup and cleanup
# scripts do this too, so the list stays an observation; collection and
# exfiltration composites supply the intent.
defaults:
  platforms: [windows]
  for: [powershell]
traits:
- id: powershell-drive-root-literal-list
  desc: PowerShell lists several drive-letter roots
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)(["''][A-Z]:\\["'']\s*,\s*){2,}["''][A-Z]:\\["'']'
