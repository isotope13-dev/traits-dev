defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: chromium-login-data-path-fragment
    desc: Chromium login database path prefix
    conf: 0.96
    if:
      type: literal
      kind: string
      exact: /Login Dat
  - id: exodus-wallet-path-fragment
    desc: Exodus wallet store path fragment
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '^(xodus/exod|dus/exodus|xodus\.wall|us\.wallet)$'
