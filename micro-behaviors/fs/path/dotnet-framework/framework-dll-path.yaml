defaults:
  platforms: [windows]
  for: [text, scripts, source, pe, dll]
  crit: notable

traits:
  - id: dotnet-framework-system-dll-path
    desc: References .NET Framework system DLL path
    conf: 0.94
    if:
      type: text
      regex: '(?i)\\Microsoft\.NET\\Framework(64)?\\v[0-9]\.[0-9]\.[0-9]{5}\\[a-z0-9_.-]+\.dll\b'
