defaults:
  platforms: [windows]
  crit: notable
  conf: 0.9
traits:
  - id: dotnet-framework-versioned-exe-tail
    desc: Tail of a .NET Framework tool path
    for: [pe, dll]
    if:
      type: text
      regex: '(?i)\\v[0-9]\.[0-9]\.[0-9]{5}\\[\w-]+\.exe\b'
  - id: mscorsvw-ngen-binary
    desc: References .NET NGEN mscorsvw.exe worker
    for: [scripts, source, binaries]
    if:
      type: text
      word: mscorsvw.exe
      case_insensitive: true
