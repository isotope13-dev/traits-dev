defaults:
  for:
  - pe
  platforms:
  - windows
traits:
- id: framework-v2-cvtres-resource-path
  desc: .NET v2 cvtres resource path
  crit: notable
  conf: 0.995
  size_min: 2000000
  size_max: 4000000
  # A configured path alone does not prove that this image is hollowed. The
  # reviewed loader actually substitutes RegAsm.exe for this cvtres setting.
  if:
    type: text
    substr: 'C:\Windows\Microsoft.NET\Framework\v2.0.50727\cvtres.exe'
    section: .rsrc
- id: delimited-framework-path-field
  desc: Delimited .NET Framework path field
  crit: notable
  conf: 0.99
  if:
    type: raw
    section: .rsrc
    regex: '@[A-Za-z]:\\Windows\\Microsoft\.NET\\Framework\\'
