traits:
- for:
  - class
  - java_class
  id: jvm-bash-history-bytecode-path
  desc: JVM bytecode bash history path
  conf: 0.92
  if:
    type: value
    path: class.strings[*]
    regex: (^|[/\\])\.bash_history$
- for:
  - class
  - java_class
  id: jvm-zsh-history-bytecode-path
  desc: JVM bytecode zsh history path
  conf: 0.92
  if:
    type: value
    path: class.strings[*]
    regex: (^|[/\\])\.zsh_history$
- for:
  - shell
  - python
  - elf
  - macho
  - go
  - c
  - cpp
  - objc
  id: bash-history-path-literal
  desc: Bash history path string literal
  conf: 0.8
  if:
    type: literal
    regex: (^|[~/\\'"`=\s])\.bash_history\b|/commandhistory/\.bash_history\b
composite_rules:
- for:
  - scripts
  - source
  - class
  - java_class
  id: shell-history-file-reference
  desc: References a shell history file
  conf: 0.9
  any:
  - id: micro-behaviors/fs/path/activity-history::bash-zsh-history-path-text
  - id: micro-behaviors/fs/path/activity-history::jvm-bash-history-bytecode-path
  - id: micro-behaviors/fs/path/activity-history::jvm-zsh-history-bytecode-path
defaults:
  platforms:
  - unix
  crit: notable
