---
defaults:
  platforms:
  - windows
  for:
  - lnk
traits:
- id: lnk-target-downloads-exe
  desc: LNK targets executable in user Downloads
  crit: suspicious
  conf: 0.88
  if:
    type: value
    path: lnk.target_path
    regex: "(?i)\\\\Users\\\\[^\\\\]+\\\\Downloads\\\\[^\\\\]+\\.exe$"
- id: lnk-target-user-staging-exe
  desc: LNK target is user-directory EXE
  crit: suspicious
  conf: 0.92
  if:
    type: value
    path: lnk.target_path
    regex: "(?i)\\\\Users\\\\[^\\\\]+\\\\(Downloads|AppData\\\\Local\\\\Temp)\\\\[^\\\\]+\\.exe$"
- id: lnk-relative-sibling-executable
  desc: LNK targets an executable beside itself
  crit: notable
  conf: 0.92
  if:
    type: value
    path: lnk.relative_path
    regex: "(?i)^\\.[\\\\/][^\\\\/]{1,60}\\.(exe|scr|com|pif|bat|cmd)$"
- id: lnk-screensaver-target
  desc: LNK target is a screensaver executable
  crit: suspicious
  conf: 0.93
  if:
    type: value
    path: lnk.relative_path
    regex: "(?i)\\.scr$"
- id: lnk-drive-root-executable-target
  desc: LNK target is a drive-root executable
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: lnk.target_path
    regex: "(?i)^[A-Z]:\\\\[^\\\\]{1,40}\\.(exe|scr|com|pif)$"
- id: lnk-relative-random-sibling-exe
  desc: LNK targets long alnum sibling EXE
  crit: notable
  conf: 0.9
  if:
    type: value
    path: lnk.relative_path
    regex: "(?i)^\\.[\\\\/]([a-z0-9]{11,}[0-9][a-z0-9]*|[a-z0-9]*[0-9][a-z0-9]{11,})\\.exe$"
- id: lnk-relative-downloads-exe
  desc: LNK relative path is Downloads EXE
  crit: suspicious
  conf: 0.9
  if:
    type: value
    path: lnk.relative_path
    regex: "(?i)[\\\\/]Downloads[\\\\/][^\\\\/]+\\.exe$"
- id: lnk-relative-random-named-exe
  desc: LNK relative path is long alnum EXE
  crit: notable
  conf: 0.9
  if:
    type: value
    path: lnk.relative_path
    regex: "(?i)[\\\\/]([a-z0-9]{11,}[0-9][a-z0-9]*|[a-z0-9]*[0-9][a-z0-9]{11,})\\.exe$"
- id: lnk-target-roaming-exe-path
  desc: LNK target path is Roaming EXE
  crit: notable
  conf: 0.86
  if:
    type: value
    path: lnk.target_path
    regex: "(?i)^Roaming[\\\\/][^\\\\/]+[\\\\/][^\\\\/]+\\.exe$"
- id: lnk-text-roaming-exe
  desc: LNK text references a Roaming executable
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: "(?i)AppData\\\\Roaming\\\\[^\\\\]{1,40}\\\\[^\\\\]{1,40}\\.exe"
- id: lnk-text-roaming-binary
  desc: LNK text references a Roaming binary
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: "(?i)AppData\\\\Roaming\\\\[^\\\\]{1,40}\\\\[^\\\\]{1,40}\\.(exe|dll|scr)"
- id: lnk-text-desktop-generic-name
  desc: LNK text references generic Desktop EXE name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "(?i)\\\\Desktop\\\\(executable|payload|sample)\\.exe"
- id: lnk-text-desktop-exe-target
  desc: LNK text references Desktop executable path
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: "(?i)\\\\Users\\\\[^\\\\]{1,40}\\\\Desktop\\\\[^\\\\]{1,40}\\.exe"
- id: lnk-text-syswow64-exe
  desc: LNK text references SysWOW64 executable
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "(?i)Windows\\\\SysWOW64\\\\[^\\\\]{1,40}\\.exe"
- id: lnk-target-systemdir-exe
  desc: LNK target is a system-directory executable
  crit: notable
  conf: 0.93
  if:
    type: value
    path: lnk.target_path
    regex: "(?i)^[A-Z]:\\\\Windows\\\\(System32|SysWOW64)\\\\[^\\\\]{1,60}\\.exe$"
