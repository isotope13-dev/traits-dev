defaults:
  platforms:
  - unix
  - windows
  for: [shell, python, javascript, powershell, c]
traits:
- id: rsh-remote-shell-client
  desc: References /usr/bin/rsh remote shell client
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: /usr/bin/rsh
- id: usr-bin-sh
  desc: References /usr/bin/sh shell executable
  crit: notable
  mbc: E1059.004
  attack: T1059.004
  conf: 0.6
  if:
    type: literal
    regex: '(^|[^A-Za-z0-9_/.+-])/usr/bin/sh($|[^A-Za-z0-9._-])'
  platforms:
  - unix
  for:
  - scripts
  - binaries
- id: bin-shell
  desc: References /bin/shell executable path
  crit: notable
  mbc: E1059.004
  attack: T1059.004
  conf: 0.6
  if:
    type: string_literal
    substr: /bin/shell
  platforms:
  - unix
  for:
  - scripts
  - binaries
