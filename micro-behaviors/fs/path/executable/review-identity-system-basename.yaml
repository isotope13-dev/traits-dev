defaults:
  crit: notable
  platforms: [unix]
  for: [binaries]
traits:
  - id: dos-utility-basename-reference
    desc: DOS utility executable basename reference
    conf: 0.95
    platforms: [windows]
    for: [pe]
    if:
      type: path
      basename: true
      regex: '(?i)^(COMMAND\.COM|KEYB\.EXE|DISPLAY\.EXE)$'
