# A filename ending in Service.exe does not establish service registration.
# Keep the filename reference with executable paths; service objectives must
# supply independent evidence of a service operation or privileged action.
defaults:
  platforms: [windows]
  for: [scripts, source, pe, dll]

traits:
  - id: service-suffix-executable-reference
    desc: References filename ending in Service.exe
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\b[A-Za-z0-9_.-]{1,80}Service\.exe\b'
