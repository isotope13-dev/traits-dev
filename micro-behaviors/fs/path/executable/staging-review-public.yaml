defaults:
  platforms:
    - windows
  for:
    - javascript
    - powershell
    - batch
    - python
traits:
  - id: public-folder-nested-exe-path
    desc: Nested executable path under Users Public
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)Users[\\/]+Public[\\/]+[a-z0-9_-]{3,12}[\\/]+[a-z0-9_-]{3,12}\.exe\b'
    unless:
      - type: text
        regex: '(?i)Users[\\/]+Public[\\/]+(Desktop|Documents|Downloads)[\\/]'
      - type: text
        regex: '(?i)Users[\\/]+Public[\\/]+(Libraries|Music|Pictures|Videos)[\\/]'
