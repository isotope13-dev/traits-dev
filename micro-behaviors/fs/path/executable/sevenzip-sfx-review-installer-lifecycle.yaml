---
defaults:
  platforms:
  - windows
  for:
  - pe
traits:
- id: uninstaller-name-rdata-text
  desc: Uninst.exe name in PE data
  crit: component
  conf: 0.97
  if:
    type: text
    exact: Uninst.exe
    section: ".rdata"
- id: uninstaller-name-overlay-text
  desc: Uninst.exe name after 1 MiB
  crit: component
  conf: 0.97
  size_min: 1000000
  if:
    type: text
    exact: Uninst.exe
    offset_range:
    - 1048576
    - 
