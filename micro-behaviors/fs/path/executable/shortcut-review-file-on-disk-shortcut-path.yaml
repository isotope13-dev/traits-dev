---
defaults:
  platforms:
  - windows
  for:
  - lnk
composite_rules:
- id: lnk-desktop-generated-looking-relative-path
  desc: LNK Desktop workdir and generated-looking path
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/fs/path/user-directory::lnk-workingdir-user-desktop
  needs: 1
  any:
  - id: micro-behaviors/fs/path/executable::lnk-relative-random-sibling-exe
  - id: micro-behaviors/fs/path/file::lnk-relative-random-like-path
- id: lnk-downloads-long-exe-path
  desc: LNK Downloads workdir and long EXE path
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/fs/path/user-directory::lnk-workingdir-user-downloads
  - id: micro-behaviors/fs/path/executable::lnk-relative-random-named-exe
  - id: micro-behaviors/fs/path/executable::lnk-relative-downloads-exe
- id: lnk-desktop-generic-exe-references
  desc: LNK text references generic Desktop EXE
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/executable::lnk-text-desktop-generic-name
  - id: micro-behaviors/fs/path/executable::lnk-text-desktop-exe-target
