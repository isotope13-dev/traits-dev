defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
composite_rules:
  - id: downloads-exe-path-clues
    desc: Downloads path and executable path clues
    crit: notable
    conf: 0.94
    # Requires are typically at file top; dest path lives in the drop helper.
    near_lines: 80
    all:
      - id: micro-behaviors/fs/path/personal::homedir-downloads-path
      - id: micro-behaviors/fs/path/personal::downloads-exe-path-text

