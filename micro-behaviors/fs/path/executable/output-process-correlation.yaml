defaults:
  platforms: [windows]
  for: [javascript]
composite_rules:
  - id: executable-output-process-correlation
    desc: Output-path name near executable and process clues
    crit: notable
    conf: 0.92
    all:
      - id: metadata/lang/source/naming/variable::output-or-executable-path-identifier
      - id: micro-behaviors/fs/path/extension::executable-output-extension
    any:
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
      - id: micro-behaviors/fs/write/file/full/unspecified::write-file-async
      - id: micro-behaviors/fs/write/file/stream::create-write-stream
      - id: micro-behaviors/process/create/exec::js-execfile-call
      - id: micro-behaviors/process/create/subprocess/launch::spawn-call
    near_bytes: 512
