defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  size_max: 5000000

traits:
- id: shh-bin-path-reference
  size_min: 512
  size_max: 500000000
  desc: References a /shh/bin path
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: "/shh/bin"
    section: ".text"
