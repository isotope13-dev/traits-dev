---
defaults:
  platforms:
  - windows
  for:
  - lnk
composite_rules:
- id: lnk-userdir-exe-shortcut
  desc: LNK traversal and user-directory EXE clues
  crit: suspicious
  conf: 0.91
  all:
  - id: micro-behaviors/fs/path/traversal::lnk-relative-deep-parent-chain
  - id: micro-behaviors/fs/path/executable::lnk-target-user-staging-exe
  unless:
  - id: well-known/app/storage/peazip::peazip-shortcut-target
- id: lnk-drive-root-executable-shortcut
  desc: LNK targets EXE from drive-root workdir
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/fs/path/executable::lnk-drive-root-executable-target
  - id: micro-behaviors/fs/path/drive-root::lnk-workingdir-drive-root
