defaults:
  platforms: [windows, unix]
  for: [csharp]
  crit: notable
traits:
  - id: csharp-combine-executable-name
    desc: Combines path with executable filename
    if:
      type: symbol
      kind: call
      exact: Path.Combine
      arg:
        index: 1
        kind: string
        regex: '(?i)^[\w.-]{1,80}\.exe$'
