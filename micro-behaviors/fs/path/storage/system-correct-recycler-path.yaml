defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: recycler-path
    desc: Recycler directory path reference
    crit: suspicious
    conf: 0.9
    attack: T1564.001
    if:
      type: text
      # A namespace segment followed by an identifier is not a path.
      # Match a leading Recycler component or a filename beneath it.
      regex: '(?i)(^|[^\w\\])\\?RECYCLER\\{1,2}[\w.-]+|\bRECYCLER\\{1,2}[\w.-]+\.[a-z0-9]+'
    not:
      - substr: RECYCLER.BIN
      - substr: RECYCLER\not_a_virus.txt
    unless:
      - id: well-known/app/utility/360-file-guard::360-file-guard-identity
