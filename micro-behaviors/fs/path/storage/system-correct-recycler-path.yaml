defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: recycler-path
    desc: Recycler directory path reference
    crit: suspicious
    conf: 0.9
    attack: T1564.001
    if:
      type: text
      regex: (?i)\bRECYCLER\\[a-zA-Z0-9_.]+
    not:
      - substr: RECYCLER.BIN
      - substr: RECYCLER\not_a_virus.txt
    unless:
      - id: well-known/app/utility/360-file-guard::360-file-guard-identity
