defaults:
  crit: notable
  platforms: [android]
  for: [dex]

traits:
  - id: android-external-storage-directory-reference
    desc: Android external storage directory reference
    conf: 0.86
    if:
      type: text
      substr: getExternalStorageDirectory

  - id: android-sdcard-root-path
    desc: Android shared-storage root path
    conf: 0.98
    if:
      type: text
      exact: "/sdcard/"
