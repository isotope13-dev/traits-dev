defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: recycler-literal
    desc: RECYCLER literal path marker
    crit: notable
    conf: 0.9
    # Excluded on JVM bytecode: a constant-pool UTF8 entry is an identifier,
    # not a path, and "RECYCLER" is the field name behind Netty's Recycler
    # object pool. Every consumer of this trait pairs it with VB6/PE context.
    for: [scripts, binaries, -class]
    if:
      type: text
      exact: RECYCLER
