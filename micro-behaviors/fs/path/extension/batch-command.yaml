defaults:
  platforms: [windows]
  for: [javascript]
traits:
  - id: batch-command-extension-literal
    desc: Batch or command file extension literal
    conf: 0.95
    crit: notable
    if:
      type: string_literal
      regex: '(?i)\.(bat|cmd)$'
    unless:
    - id: "metadata/file/naming::test-directory-component"
    - id: metadata/package/testing/presence/fixture::snapshot-file
    - id: metadata/package/documentation/page::static-documentation-html-page
