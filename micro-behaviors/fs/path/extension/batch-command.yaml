defaults:
  platforms: [windows]
  for: [javascript]
traits:
  - id: batch-command-extension-literal
    desc: Literal ending in .bat or .cmd
    conf: 0.95
    crit: notable
    if:
      type: literal
      regex: '(?i)\.(bat|cmd)$'
    unless:
    - id: metadata/package/documentation/page::documentation-heading-html-page
