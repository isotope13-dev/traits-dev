defaults:
  platforms: [macos]
  for: [macho]

traits:
  # Clang emits the XOR-0x5a bytes for ".pth\0" as two immediates. These
  # patterns include both the terminator and the four-byte suffix so ordinary
  # uses of either numeric constant do not become a path-extension signal.
  - id: xor-5a-pth-suffix-x86-64
    desc: x86-64 code constructs XOR-0x5A .pth suffix
    crit: component
    conf: 0.99
    arch: [x86-64]
    if:
      type: hex
      section: __text
      pattern: "C6 45 ?? 5A C7 45 ?? 74 2A 2E 32"

  - id: xor-5a-pth-suffix-aarch64
    desc: AArch64 code constructs XOR-0x5A .pth suffix
    crit: component
    conf: 0.99
    arch: [aarch64]
    if:
      type: hex
      section: __text
      pattern: "48 0B 80 52 [4] 88 4E 85 52 C8 45 A6 72"

composite_rules:
  - id: xor-5a-pth-suffix-construction
    desc: Native code constructs an XOR-obfuscated .pth suffix
    crit: notable
    conf: 0.99
    any:
      - id: xor-5a-pth-suffix-x86-64
      - id: xor-5a-pth-suffix-aarch64
