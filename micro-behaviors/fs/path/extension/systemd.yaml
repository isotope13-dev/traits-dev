defaults:
  platforms: [linux]

traits:
  - id: service-unit-filename-literal
    desc: References a systemd service filename literal
    crit: notable
    conf: 0.9
    # A source-language string literal is required. A raw text matcher also
    # mistakes member access such as Go's `p.Service` for a unit filename.
    for: [shell, python, go, rust, objc, c, cpp, javascript]
    if:
      type: literal
      kind: string
      regex: '(?i)(^|[/\\])[A-Za-z0-9_.@-]+\.service$|^[A-Za-z0-9_.@-]+\.service$'
    # OpenTelemetry / RPC semantic-convention attribute keys are dotted
    # namespaces that end in `.service` (`rpc.service` in aws-sdk-go-v2's
    # retry metrics); they name a telemetry field, not a unit file.
    not:
      - regex: '^(rpc|db|net|peer)\.service$'
      - regex: '^(http|messaging|faas|otel)\.service$'
      - regex: '^(cloud|k8s|host|span)\.service$'
    # Schedule.Service is the Windows Task Scheduler COM ProgID, not a
    # systemd unit basename.
    unless:
      - id: micro-behaviors/os/autorun/scheduled::task-scheduler-com-progid
      # Generated protobuf descriptors record qualified schema field names such
      # as `google.protobuf.FileDescriptorProto.service`; those are identifiers,
      # not systemd unit basenames.
      - id: metadata/lang/source::python-protobuf-generated
