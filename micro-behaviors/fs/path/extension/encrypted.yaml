defaults:
  platforms: [windows, unix]
  for: [pe, dll, source, scripts]

traits:
  # A suffix declaration is a neutral path/extension fact.  It becomes
  # ransomware evidence only when paired with a ransom note and file impact.
  - id: encrypted-filename-suffix-variable
    desc: Encrypted filename suffix variable
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)\b(encrypted[_-]?(suffix|extension))\b\s*(=|:)'

  - id: encrypted-filename-suffix-literal
    desc: Distinctive encrypted filename suffix literal
    crit: component
    conf: 0.94
    # `.enc` is a common application artifact (for example, an encrypted
    # signing store), so it is not distinctive enough for this signal.
    if:
      type: literal
      kind: string
      regex: '(?i)^\.(encrypted|locked|crypt|encrt)$'

composite_rules:
  - id: encrypted-filename-suffix-assignment
    desc: Assigns a distinctive encrypted filename suffix
    crit: notable
    conf: 0.94
    all:
      - id: encrypted-filename-suffix-variable
      - id: encrypted-filename-suffix-literal
    near_lines: 2
