# AI/ML file suffixes are filename-format references, not proof that a program
# encrypts or otherwise targets those files.  Ransomware intent is inferred by
# the objective composite that combines these observations with file mutation
# and encryption behavior.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source]
  crit: notable
  conf: 0.88

traits:
  - id: model-extension-reference
    desc: AI model filename extension reference
    count_min: 2
    if:
      type: text
      regex: '(?i)(^|[/\\s"''])[\w.-]+\.(ckpt|h5|onnx|pb|pkl|pt2?|safetensors?)([/\\s"'']|$)'
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index

  # `.pth` is also a Python site-path file.  Require model/checkpoint context
  # before treating it as a PyTorch checkpoint suffix reference.
  - id: checkpoint-extension-after-model-context
    desc: Checkpoint extension after model context
    if:
      type: text
      regex: '(?i)(model|checkpoint|weights?|torch)[^\r\n]{0,40}\.pt(h)?\b'
  - id: checkpoint-extension-before-model-context
    desc: Checkpoint extension before model context
    if:
      type: text
      regex: '(?i)\.pt(h)?\b[^\r\n]{0,40}(model|checkpoint|weights?|torch)'
  - id: vector-index-extension-reference
    desc: Vector index extension reference
    count_min: 2
    if:
      type: text
      regex: '(?i)\.(faiss|ggml|gguf|vec)\b'

  - id: dataset-extension-reference
    desc: Machine-learning dataset extension reference
    count_min: 2
    if:
      type: text
      regex: '(?i)\.(arrow|duckdb|feather|npy|npz|parquet|tfrecord)\b'

composite_rules:
  - id: pytorch-checkpoint-extension-reference
    desc: PyTorch checkpoint extension reference
    crit: notable
    conf: 0.9
    any:
      - id: checkpoint-extension-after-model-context
      - id: checkpoint-extension-before-model-context

  - id: ai-asset-extension-reference
    desc: References multiple AI or ML asset extensions
    crit: notable
    conf: 0.92
    any:
      - id: model-extension-reference
      - id: pytorch-checkpoint-extension-reference
      - id: vector-index-extension-reference
      - id: dataset-extension-reference
