  # AI/ML file suffixes are filename-format references, not proof that a program
# encrypts or otherwise targets those files.  Ransomware intent is inferred by
# the objective composite that combines these observations with file mutation
# and encryption behavior.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source]
  crit: notable
  conf: 0.88

traits:
  - id: model-extension-reference--checkpoint-or-h5
    desc: AI checkpoint or H5 extension
    crit: component
    conf: 0.88
    if:
      type: text
      # `.pb` is deliberately excluded: gnostic and many other tools use it
      # for ordinary Protocol Buffer outputs, not model weights.
      regex: '(?i)(^|[/\\s"''])[\w.-]+\.(ckpt|h5)([/\\s"'']|$)'
  - id: model-extension-reference--onnx-or-pickle
    desc: AI ONNX or pickle extension
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)(^|[/\\s"''])[\w.-]+\.(onnx|pkl)([/\\s"'']|$)'
  - id: model-extension-reference--pytorch-or-safetensors
    desc: AI PyTorch or SafeTensors extension
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)(^|[/\\s"''])[\w.-]+\.(pt2?|safetensors?)([/\\s"'']|$)'

  # `.pth` is also a Python site-path file.  Require model/checkpoint context
  # before treating it as a PyTorch checkpoint suffix reference.
  - id: checkpoint-extension-after-model-context
    desc: Checkpoint extension after model context
    if:
      type: text
      regex: '(?i)(model|checkpoint|weights?|torch)[^\r\n]{0,40}\.pt(h)?\b'
  - id: checkpoint-extension-before-model-context
    desc: Checkpoint extension before model context
    if:
      type: text
      regex: '(?i)\.pt(h)?\b[^\r\n]{0,40}(model|checkpoint|weights?|torch)'
  - id: vector-index-extension-reference
    desc: Vector index filename extension reference
    if:
      type: text
      # Require a path/filename boundary so dotted member access, namespace
      # text, and ordinary prose ending in `.vec` are not treated as an asset
      # path.  Keep the same filename shape as the other extension atoms.
      regex: '(?i)(^|[/\\s"''])[\w.-]{1,40}\.(faiss|ggml|gguf|vec)([/\\s"'']|$)'

  - id: dataset-extension-reference--columnar
    desc: Columnar dataset extension
    crit: component
    conf: 0.88
    if:
      type: text
      # A filename/path boundary is required so JavaScript member access such
      # as `middleware.arrow` is not treated as a dataset filename.
      regex: '(?i)[/\\''"`][\w.-]{1,40}\.(arrow|duckdb|feather)([/\\''"`]|$)'
  - id: dataset-extension-reference--array
    desc: Array dataset extension
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)[/\\''"`][\w.-]{1,40}\.(npy|npz)([/\\''"`]|$)'
  - id: dataset-extension-reference--record
    desc: Record dataset extension
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)[/\\''"`][\w.-]{1,40}\.(parquet|tfrecord)([/\\''"`]|$)'

composite_rules:
  - id: pytorch-checkpoint-extension-reference
    desc: PyTorch checkpoint extension reference
    crit: notable
    conf: 0.9
    any:
      - id: checkpoint-extension-after-model-context
      - id: checkpoint-extension-before-model-context

  - id: ai-asset-extension-reference
    desc: References multiple AI or ML asset extensions
    crit: notable
    conf: 0.92
    any:
      - id: model-extension-reference
      - id: pytorch-checkpoint-extension-reference
      - id: vector-index-extension-reference
      - id: dataset-extension-reference
    needs: 2

  - id: model-extension-reference
    desc: AI model filename extension reference
    crit: notable
    conf: 0.88
    any:
      - id: model-extension-reference--checkpoint-or-h5
      - id: model-extension-reference--onnx-or-pickle
      - id: model-extension-reference--pytorch-or-safetensors
    unless:
      - id: metadata/file/catalog/identity::debian-packages-index

  - id: dataset-extension-reference
    desc: Dataset filename extension reference
    crit: notable
    conf: 0.88
    any:
      - id: dataset-extension-reference--columnar
      - id: dataset-extension-reference--array
      - id: dataset-extension-reference--record
