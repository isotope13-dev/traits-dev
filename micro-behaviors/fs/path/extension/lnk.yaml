defaults:
  platforms: [windows, unix]

traits:
  # A native binary's .lnk string is a useful shortcut-related fragment, but
  # it is not a file-extension identity and is not malicious on its own.
  - id: lnk-extension-reference
    desc: Native code references a .lnk filename
    crit: component
    conf: 0.8
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      substr: .lnk

  # Require the actual suffix predicate so prose, comments, and unrelated
  # documentation mentioning ".lnk" do not look like shortcut enumeration.
  - id: lnk-suffix-filter
    desc: Source filters paths by .lnk suffix
    crit: component
    conf: 0.85
    for: [python, javascript, powershell, perl, csharp]
    if:
      type: text
      regex: '\\.endswith\\s*\\(\\s*["'']\\.lnk["'']'
      case_insensitive: true
