---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - python
  id: log-extension-literal
  desc: References log filename extension
  conf: 0.7
  if:
    type: text
    substr: '".log"'
- for:
  - python
  id: git-env-extension-list
  desc: Log or Git environment file-extension list
  conf: 0.8
  if:
    type: text
    regex: \[[^\]]{0,160}"\.(git|env)"[^\]]{0,160}"\.(git|env)"[^\]]{0,160}\]
- for:
  - python
  - javascript
  - powershell
  - perl
  - pe
  conf: 0.4
  id: conf-extension-reference
  desc: Config file extension
  unless:
  - id: metadata/build/
  - id: metadata/package/files/system-package::debian-account-tool-basename
  if:
    type: text
    # The extension must be followed by a path/string terminator (quote,
    # bracket, comma, newline, redirect). Bare dotted identifiers such as
    # Python's `django.conf` module access (`...conf import ...`,
    # `...conf.urls`) never satisfy this.
    regex: '\.conf[ \t]*["'')\],;\n>]'
