defaults:
  for: [csharp]
  platforms: [windows, linux, macos]
  conf: 0.98

# Suffix checks classify paths; certificate-bypass intent requires the
# separate verifier-control-flow evidence in the consuming WSUS composite.
traits:
  - id: csharp-checks-txt-suffix
    desc: Checks TXT filename suffix
    crit: baseline
    if:
      type: symbol
      kind: call
      substr: EndsWith
      arg:
        kind: string
        exact: .txt

  - id: csharp-checks-esd-suffix
    desc: Checks ESD filename suffix
    crit: notable
    if:
      type: symbol
      kind: call
      substr: EndsWith
      arg:
        kind: string
        exact: .esd
