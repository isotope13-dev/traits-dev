# A download file name made of a random identifier plus a Windows script
# extension: every visitor receives a differently named .js/.vbs/.hta file.
traits:
  - id: random-identifier-script-filename
    desc: Random identifier joined to a script extension
    crit: notable
    conf: 0.85
    platforms: [windows, unix]
    for: [javascript, html]
    if:
      type: text
      regex: '\w+\(\w+\((0x)?[0-9a-f]+,\s*(0x)?[0-9a-f]+\)\)\s*\+\s*[''"]\.(js|jse|vbs|vbe|wsf|hta)[''"]'
