traits:
  - id: python-path-endswith-variable
    desc: Checks a path suffix against a variable
    platforms: [unix, windows]
    for: [python]
    crit: notable
    conf: 0.82
    if:
      type: text
      # `str.endswith(variable)` is common application logic.  Keep this atom
      # specific to file/path/name variables before combining it with the
      # indexed-extension and Fernet rewrite evidence in
      # objectives/impact/ransom/encrypt/filesystem.
      regex: '(?i)\b(file|path|name)\w*\.endswith\(\w+\)'
