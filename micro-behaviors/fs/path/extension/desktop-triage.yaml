defaults:
  platforms: [macos]
  for: [scripts, binaries, source]

traits:
  - id: user-kext-path-reference
    desc: References user kernel extension path
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(^|[^A-Za-z0-9_./~-])(/Library|~/Library)/Extensions/[^\s]{1,120}\.kext\b'
    unless:
    - id: metadata/package/files/ecosystem::conda-shell-activation-layout
    - id: micro-behaviors/os/kernel/driver::kextfind-tool-reference

