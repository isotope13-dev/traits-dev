defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: hta-extension
    desc: References an HTA filename or path
    crit: notable
    conf: 0.8
    for: [scripts, binaries, html, c]
    if:
      type: text
      regex: '(?i)\.hta\b'
  # A bare extension mention is often local (an mshta.exe path, a registry
  # key). An absolute http(s) URL ending in .hta names a remotely fetched
  # HTML Application, which runs with script privileges when opened in
  # mshta. Query strings are allowed: delivery gates mint per-victim URLs
  # (`payload.hta?sid=...`).
  - id: remote-hta-url
    desc: Remote URL targets an HTA file
    crit: notable
    conf: 0.9
    for: [html, javascript]
    if:
      type: text
      regex: 'https?://[^\s''"<>]{1,200}\.hta(\?[^\s''"<>]{0,160})?'
