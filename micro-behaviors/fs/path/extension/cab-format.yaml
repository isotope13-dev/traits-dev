# CAB backup filename evidence used by parasitic file infectors.
# The specific format string is combined with file replacement behavior by
# objectives/impact/infect/binary/rewrite/parasitic.yaml.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.95
traits:
  - id: cab-filename-format-string
    desc: CAB filename format string
    crit: baseline
    conf: 0.97
    if:
      type: text
      regex: '%s(%s)?\.cab'
