defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # A suffix reference establishes neither encryption nor ransom intent.
  # Text facts include ASCII and decoded UTF-16; do not claim wide encoding.
  - id: dot-encrypted-suffix-reference
    desc: References the .encrypted filename suffix
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: '.encrypted'
