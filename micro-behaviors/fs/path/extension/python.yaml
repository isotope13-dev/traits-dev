defaults:
  platforms: [windows, linux, macos]
  for: [python]
  attack: T1071.001

traits:
  - id: python-server-script-literal
    desc: Python server-script path literal
    crit: component
    conf: 0.97
    if:
      type: string_literal
      regex: '(?i)\.(php[3-8]?|phtml|pht|phar|jspx?|aspx?|ashx|asmx|cfm|cfc|cgi|pl|shtml)$'

  # vt-py submits the opened file handle to VirusTotal's scanning API.  The
  # import-plus-call shape avoids treating an unrelated method named
  # `scan_file` as a remote upload.
  - id: python-path-join-bin-dat-blob-file
    desc: Joins a path to a .bin/.dat/.blob file
    platforms: [unix, windows]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'os\.path\.join\([\s\S]{0,160}["''][A-Za-z0-9._-]{1,80}\.(bin|dat|blob)["'']'
  - id: python-path-join-cache-payload-pack-file
    desc: Joins a path to a .cache/.payload/.pack file
    platforms: [unix, windows]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'os\.path\.join\([\s\S]{0,160}["''][A-Za-z0-9._-]{1,80}\.(cache|payload|pack)["'']'
