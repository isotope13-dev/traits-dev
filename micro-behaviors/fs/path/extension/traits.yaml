defaults:
  platforms: [windows, linux, macos]
  for: [elf, macho, pe]

traits:
  - id: php-script-extension-token
    desc: PHP server-script extension token
    crit: component
    conf: 0.9
    for: [scripts, source, text]
    if:
      type: string_literal
      regex: '(?i)^\.?(php[3-8]?|phtml|pht|phar)$'
  - id: managed-script-extension-token
    desc: Managed server-script extension token
    crit: component
    conf: 0.9
    for: [scripts, source, text]
    if:
      type: string_literal
      regex: '(?i)^\.?(jspx?|aspx?|ashx|asmx|cfm|cfc)$'
  - id: cgi-script-extension-token
    desc: CGI server-script extension token
    crit: component
    conf: 0.9
    for: [scripts, source, text]
    if:
      type: string_literal
      regex: '(?i)^\.?(cgi|pl|shtml)$'
  - id: download-extension-target-check
    desc: Checks string for archive or installer extension
    crit: notable
    conf: 0.93
    platforms: [windows, unix]
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '(?i)\.endsWith\s*\(\s*["'']\.(torrent|zip|rar|7z|exe|dmg|iso)["'']'
