traits:
- id: plugin-directory-path-1
  desc: Generic plugin/extension path
  if:
    type: text
    regex: (?i)(plugins|extensions)/[^/\n]{0,40}(plugin|addon|ext)([^A-Za-z0-9_/][^/\n]{0,20})?/
  not:
  - substr: /node_modules/
  - substr: node_modules/.pnpm/
- id: plugin-directory-path-2
  desc: ComfyUI custom_nodes plugin path
  if:
    type: text
    regex: (?i)custom_nodes/.{0,50}/
- id: plugin-directory-path-3
  desc: Generic plugin/extension path
  if:
    type: text
    regex: (?i)(modules|middleware)/.{0,30}/(plugin|addon|extensions?)/
  not:
  - substr: /node_modules/
  - substr: node_modules/.pnpm/
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  crit: notable
  conf: 0.9
