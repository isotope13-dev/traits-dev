defaults:
  platforms: [windows, unix]
  for: [scripts, html]
  crit: component
  conf: 0.7

traits:
  - id: js-reference
    desc: JavaScript extension reference
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '["''][^"''\n]{1,120}\.js["'']'
    unless:
      - type: text
        regex: 'https?://[^"''\s]+\.js\b'

  # Relocated from objectives/command-and-control/dropper/staging/embedded/:
  # a bare `endsWith('.cmd')` is a filename-suffix test, not payload staging.
  # As standalone `suspicious` dropper traits these fired on ordinary Node
  # tooling that dispatches by extension -- including a test assertion that
  # Windows shell execution stays gated to .cmd shims. The dropper composites
  # reference them from here; the staging intent comes from their other legs.
  - id: js-batch-extension-check
    desc: JavaScript checks for .bat extension
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: literal
      regex: endsWith\(['"]\.(bat)['"]\)
  - id: js-cmd-extension-check
    desc: JavaScript checks for .cmd extension
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: literal
      regex: endsWith\(['"]\.(cmd)['"]\)
  - id: js-powershell-extension-check
    desc: JavaScript checks for .ps1 extension
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: literal
      regex: endsWith\(['"]\.(ps1)['"]\)
  - id: js-shell-extension-check
    desc: JavaScript checks for .sh extension
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: literal
      regex: endsWith\(['"]\.(sh)['"]\)

composite_rules:
  # Grouping atom for consumers that only care that the code branches on some
  # droppable payload suffix. Members stay individually notable.
  - id: js-payload-extension-check
    desc: JavaScript checks a payload file extension
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    any:
      - id: js-batch-extension-check
      - id: js-cmd-extension-check
      - id: js-powershell-extension-check
      - id: js-shell-extension-check
      - id: micro-behaviors/fs/path/extension::js-elf-extension-check
      - id: micro-behaviors/fs/path/extension::js-raw-binary-extension-check
      - id: micro-behaviors/fs/path/extension::js-executable-extension-check
