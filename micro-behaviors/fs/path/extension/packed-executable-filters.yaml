defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: executable-and-backup-filter-table
    desc: EXE, BAK and Ghost-image filter table
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: any
      pattern: '2E 42 41 4B 00 [3] 2E 62 61 6B 00 [3] 2E 47 48 4F 00 [3] 67 68 6F 00 2E 45 58 45 00'
