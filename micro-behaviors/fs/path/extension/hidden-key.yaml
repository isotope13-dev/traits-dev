defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, java, kotlin, c, cpp]
traits:
  - id: hidden-app-key-path
    desc: Hidden application .key path reference
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '[/~\\\\]\.[A-Za-z0-9._-]{2,64}/[A-Za-z0-9._-]{2,64}\.key\b'
    not:
      - regex: '[/~\\\\]\.ssh/'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/llm-scanner/
