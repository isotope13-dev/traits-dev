defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  crit: baseline
  conf: 0.5
traits:
- id: dot-exe-string
  desc: .exe string literal
  crit: component
  conf: 0.9
  attack: T1105
  for:
  - javascript
  - typescript
  if:
    type: string_literal
    exact: .exe
- id: die-extension-marker
  desc: References a .die filename extension
  crit: component
  conf: 0.98
  platforms:
  - windows
  for:
  - pe
  - dll
  - scripts
  if:
    type: text
    exact: .die
- id: source-executable-extension-check
  desc: Source checks an executable filename suffix
  crit: notable
  conf: 0.9
  for:
  - c
  - lua
  - python
  - javascript
  - typescript
  if:
    type: text
    regex: (?i)\bends?_?with\s*\(\s*["']\.(exe|elf|so)["']\s*\)
- id: js-executable-filename-literal
  desc: JavaScript literal names executable file
  crit: notable
  conf: 0.94
  for:
  - javascript
  - typescript
  if:
    type: literal
    kind: string
    regex: (?i)^[a-z0-9_.-]{1,96}\.exe$
  unless:
  - id: metadata/lang/source/declaration::pony-method-declaration-syntax
- id: js-elf-extension-check
  desc: JavaScript checks for .elf extension
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: literal
    regex: endsWith\(['"]\.(elf)['"]\)
- id: js-raw-binary-extension-check
  desc: JavaScript checks for .bin extension
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: literal
    regex: endsWith\(['"]\.(bin)['"]\)
- id: java-executable-reference
  desc: Java bytecode references an executable path
  crit: notable
  conf: 0.92
  for:
  - class
  - java_class
  if:
    type: value
    path: class.strings[*]
    regex: (?i)\.exe$
- id: exe-name-or-extension
  desc: References a Windows .exe filename or extension
  crit: baseline
  if:
    type: text
    word: .exe
  downgrade:
    any:
    - id: metadata/binary/resource/identity::pe-version-resource
  unless:
  - id: dot-exe-string
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: php-quoted-exe-filename
  desc: PHP string literal names a .exe file
  crit: baseline
  conf: 0.9
  for:
  - php
  if:
    type: text
    regex: '["''][^"''\r\n]{0,80}\.exe["'']'
- id: utf16-exe-suffix-token
  desc: UTF-16 exe filename suffix token
  crit: notable
  conf: 0.84
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: hex
    pattern: 65 00 78 00 65 00
    section: .text
- id: windows-exe-path-reference
  desc: Filesystem path ending in a .exe filename
  crit: baseline
  conf: 0.9
  platforms:
  - windows
  for:
  - vbs
  - javascript
  - batch
  - powershell
  if:
    type: text
    regex: (?i)([A-Za-z]:|%[A-Za-z_][A-Za-z0-9_]{0,64}%|\.{0,2})[\\/][^"\r\n\\/]{1,120}\.exe\b
- id: windows-exe-path-reference-binary
  desc: PE references an executable filesystem path
  crit: baseline
  conf: 0.88
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: text
    regex: (?i)[\\/][A-Za-z0-9_. -]{1,120}\.exe\b
- id: pe-exe-scr-extension-filter
  desc: Filters EXE and SCR suffixes
  crit: notable
  conf: 0.97
  platforms:
  - windows
  for:
  - pe
  - dll
  if:
    type: hex
    section: .rsrc
    pattern: 3D 2E 65 78 65 [1-8] 3D 2E 73 63 72
- id: dll-dup
  desc: .dll extension reference
  crit: baseline
  if:
    type: text
    word: .dll
- id: bat-dup
  desc: .bat extension reference
  crit: component
  platforms:
  - windows
  if:
    type: text
    regex: \.bat\b
  not:
  - substr: '*.bat'
  - substr: Batch Script (*.bat)|*.bat
  - substr: VsDevCmd.bat
- id: cmd-dup
  desc: .cmd extension reference
  crit: baseline
  platforms:
  - windows
  if:
    type: text
    regex: \.cmd(\s|["';,)]|$)
  unless:
  - id: micro-behaviors/data/format/mime::mime-types-with-extension-map
- id: ps1
  desc: .ps1 extension reference
  crit: baseline
  platforms:
  - windows
  if:
    type: text
    regex: \.ps1\b
  not:
  - substr: '"version":3,"file":'
  - regex: (^|[\\/]).+\.map$
  - substr: IdentifyConsole.ps1
  - substr: profile.ps1
  - substr: process.env.CMDER_ROOT
  - substr: vendor', 'profile.ps1
  - substr: process.env.CMDER_ROOT, 'vendor', 'profile.ps1'
  - substr: ConinMode.ps1
  - substr: IdentifyConsoleWindow.ps1
  - substr: endsWith('.ps1')
  - substr: opAsPath.endsWith('.ps1')
  - substr: builtin-plugins/tabby
  - substr: builtin-plugins/tabby-electron
  - substr: builtin-plugins/tabby-ssh
  - substr: process.env.CMDER_ROOT
  - substr: path.join(process.env.CMDER_ROOT
  - substr: to + ".ps1"
  - substr: to + '.ps1'
- id: vbs
  desc: .vbs extension reference
  crit: baseline
  platforms:
  - windows
  if:
    type: text
    regex: \.vbs\b
- id: msi
  desc: .msi extension reference
  crit: baseline
  platforms:
  - windows
  if:
    type: text
    regex: \.msi\b
