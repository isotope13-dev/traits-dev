defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: baseline
  conf: 0.5
traits:
  # A suffix test identifies a candidate executable; it does not imply that
  # the caller patches or corrupts that file. Keep the signal neutral so
  # launchers and build tools do not enter the impact/code-patching objective.
  - id: source-executable-extension-check
    desc: Source checks an executable filename suffix
    crit: component
    conf: 0.9
    for: [c, lua, python]
    if:
      type: text
      regex: '(?i)\bends?_?with\s*\(\s*["'']\.(exe|elf|so)["'']\s*\)'
  - id: js-executable-extension-check
    desc: JavaScript checks for .exe extension
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: string_literal
      regex: endsWith\(['"]\.(exe)['"]\)
  # Relocated from objectives/command-and-control/dropper/staging/embedded/:
  # a suffix test names a candidate payload format, it does not stage one.
  - id: js-elf-extension-check
    desc: JavaScript checks for .elf extension
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: literal
      regex: endsWith\(['"]\.(elf)['"]\)
  - id: js-raw-binary-extension-check
    desc: JavaScript checks for .bin extension
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: literal
      regex: endsWith\(['"]\.(bin)['"]\)
  - id: java-executable-reference
    desc: Java bytecode references an executable path
    crit: notable
    conf: 0.92
    for: [class, jar, zip]
    if:
      type: value
      path: class.strings[*]
      regex: '(?i)\.exe$'
  # KNOWN FP, no clean YAML fix -- do not "simplify" this note away.
  # `word:` compiles to `\b.exe\b`, which should not match inside `.exec(`, and on a
  # small hand-written fixture it does not. But it DOES match `").exec(document.
  # cookie))` in a real minified bundle: the text-run extractor split the run right
  # after `exe`, manufacturing the trailing `\b`. So any JS using `regex.exec()` can
  # report "References a Windows .exe filename" depending on where runs happen to be
  # cut. Three fixes were checked and none work at YAML level: a trailing
  # `([^A-Za-z0-9_]|$)` class still accepts the run-end that causes the FP; `not:`
  # cannot see the following `c` because it only sees the matched span; and `type: raw`
  # (whole-file bytes, immune to run splitting) is capped at 3 file types against this
  # trait's `for: [scripts, binaries]`. Fixing it properly belongs in the extractor.
  - id: exe-dup
    desc: References a Windows .exe filename or extension
    crit: baseline
    if:
      type: text
      word: .exe
    downgrade:
      any:
        - id: metadata/package/versioning::pe-version-resource
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
  - id: dll-dup
    desc: .dll extension reference
    crit: baseline
    if:
      type: text
      word: .dll
  - id: bat-dup
    desc: .bat extension reference
    crit: component
    platforms: [windows]
    if:
      type: text
      regex: \.bat\b
    not:
      - substr: '*.bat'
      - substr: Batch Script (*.bat)|*.bat
      - substr: VsDevCmd.bat
  - id: cmd-dup
    desc: .cmd extension reference
    crit: baseline
    platforms: [windows]
    if:
      type: text
      regex: '\.cmd(\s|["'';,)]|$)'
    unless:
      - id: well-known/lib/mime-db::javascript-mime-extension-map
  - id: ps1
    desc: .ps1 extension reference
    crit: baseline
    platforms: [windows]
    if:
      type: text
      regex: \.ps1\b
    not:
      - substr: '"version":3,"file":'
      - regex: (^|[\\/]).+\.map$
      - substr: IdentifyConsole.ps1
      - substr: profile.ps1
      - substr: process.env.CMDER_ROOT
      - substr: "vendor', 'profile.ps1"
      - substr: "process.env.CMDER_ROOT, 'vendor', 'profile.ps1'"
      - substr: ConinMode.ps1
      - substr: IdentifyConsoleWindow.ps1
      - substr: endsWith('.ps1')
      - substr: opAsPath.endsWith('.ps1')
      - substr: builtin-plugins/tabby
      - substr: builtin-plugins/tabby-electron
      - substr: builtin-plugins/tabby-ssh
      - substr: process.env.CMDER_ROOT
      - substr: path.join(process.env.CMDER_ROOT
      - substr: to + ".ps1"
      - substr: to + '.ps1'
  - id: vbs
    desc: .vbs extension reference
    crit: baseline
    platforms: [windows]
    if:
      type: text
      regex: \.vbs\b
  - id: msi
    desc: .msi extension reference
    crit: baseline
    platforms: [windows]
    if:
      type: text
      regex: \.msi\b
composite_rules:
  - id: windows-extension
    desc: Windows executable extension marker
    crit: baseline
    any:
      - id: micro-behaviors/fs/path/extension::exe-dup
      - id: micro-behaviors/fs/path/extension::dll-dup
      - id: micro-behaviors/fs/path/extension::bat-dup
      - id: micro-behaviors/fs/path/extension::cmd-dup
      - id: ps1
      - id: vbs
      - id: msi
      - id: micro-behaviors/fs/path/extension::scr-extension
