defaults:
  platforms: [windows]
  for: [javascript]
traits:
- id: batch-command-filename-literal
  desc: Literal filename ending in .bat or .cmd
  conf: 0.95
  crit: notable
  if:
    type: literal
    regex: '(?i)\.(bat|cmd)$'
  unless:
  - id: "metadata/file/naming::test-directory-component"
  - id: metadata/package/testing/presence/fixture::snapshot-file
  - id: metadata/package/documentation/page::static-documentation-html-page
