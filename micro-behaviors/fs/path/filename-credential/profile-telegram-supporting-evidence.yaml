---
defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
traits:
- id: common-password-dictionary-filename
  desc: Common-password dictionary filename
  crit: component
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: "\\bcommon-passwords\\.txt"
- id: secret-seed-document-filename
  desc: Secret or seed document filename reference
  crit: component
  conf: 0.92
  for:
  - python
  if:
    type: text
    regex: "\\b(secrets|seed[\\w-]*)\\.(txt|docx|xlsx)\\b"
- id: wallet-document-filename
  desc: Wallet document filename reference
  crit: component
  conf: 0.92
  for:
  - python
  if:
    type: text
    regex: "\\bwallet[\\w-]*\\.(txt|docx|xlsx)\\b"
composite_rules:
- id: sensitive-document-filename-reference
  desc: Sensitive document filename reference
  crit: component
  conf: 0.92
  any:
  - id: micro-behaviors/fs/path/filename-credential::credential-document-filename
  - id: micro-behaviors/fs/path/filename-credential::secret-seed-document-filename
  - id: micro-behaviors/fs/path/filename-credential::wallet-document-filename
