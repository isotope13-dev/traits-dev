defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source]

traits:
  - id: windows-sam-hive-path
    desc: References Windows SAM hive path
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)Windows[/\\]{1,2}System32[/\\]{1,2}config[/\\]{1,2}SAM\b'

  - id: windows-system-hive-path
    desc: References Windows SYSTEM hive path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)Windows[/\\]System32[/\\]config[/\\]SYSTEM\b'
