defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript, scripts, binaries]

traits:
  - id: codex-auth-accounts-directory
    desc: Codex saved-account credential directory
    conf: 0.9
    if:
      type: text
      regex: '\.codex[\\/]auth-accounts|["'']\.codex["'']\s*[,/]\s*["'']auth-accounts["'']'

  - id: codex-home-join-argument
    desc: Codex home directory path construction
    conf: 0.9
    if:
      type: text
      regex: '(join|resolve)[\s\S]{0,80}["'']\.codex["'']'

composite_rules:
  - id: codex-auth-json-path-join
    desc: Codex OAuth auth path constructed from path segments
    conf: 0.95
    near_lines: 12
    all:
      - id: codex-home-join-argument
      - id: auth-json-join-argument
