---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  crit: notable
  conf: 0.92
traits:
- id: credential-filename-extension
  desc: Credential-like filename extension
  if:
    type: literal
    kind: string
    regex: "(?i)\\b(password|credentials?)\\.(json|ya?ml|ini|cfg|env|pem|key|p12|pfx)\\b"
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  - id: well-known/lib/ai/pyaigis/
  - id: metadata/lang/scripted::dts-declaration-file
