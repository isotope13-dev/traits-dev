defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries]
  conf: 0.75

traits:
  - id: credentials-text-filename
    desc: References a credentials.txt filename
    crit: notable
    if:
      type: text
      substr: credentials.txt
  - id: password-text-filename
    desc: References a password.txt filename
    crit: notable
    if:
      type: text
      substr: password.txt
