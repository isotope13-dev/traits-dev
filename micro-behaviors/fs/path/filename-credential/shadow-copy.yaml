defaults:
  platforms: [windows]
  for: [scripts, source, binaries]

traits:
  - id: shadow-copy-registry-hive-path
    desc: References registry hive inside a VSS path
    crit: notable
    conf: 0.97
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '(?i)HarddiskVolumeShadowCopy\d+[^\r\n]{0,48}\bconfig[\\/](SAM|SECURITY|SYSTEM)\b'

