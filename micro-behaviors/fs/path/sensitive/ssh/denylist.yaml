defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  # Security guards commonly keep private-key filenames in a read-deny list.
  # This is defensive policy and must not be mistaken for a directory stealer.
  - id: denylist-context
    desc: SSH private-key filenames in a path denylist
    crit: baseline
    conf: 0.98
    if:
      type: text
      regex: 'DEFAULT_PATH_DENY\s*=\s*\[[^\]]{0,400}[/"'']id_(rsa|ed25519|ecdsa)'
