# Contexts in which a `.ssh/` path is the subject being described rather than a
# credential being read: the ssh client's own binary, and documentation that
# shows the path in a REPL transcript.
defaults:
  platforms: [unix, windows]
  crit: component
  conf: 0.9

traits:
  # The file *is* an ssh client, so a `.ssh/` path in it is the tool's own
  # configuration surface rather than someone else's key.