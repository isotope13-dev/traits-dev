defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript]

traits:
  # `/.ssh/` is a universal Unix path, not a macOS one. This trait lived in
  # macos.yaml under `platforms: [macos]`, so it could not match a Linux ELF or
  # a Windows PE -- leaving SSH key-directory access (T1552.004) undetected in
  # compiled binaries, and silently scoping all ten of its consumers to macOS.
  # Same directory, so the qualified id is unchanged.
  - id: keys
    for: [scripts, binaries]
    desc: SSH keys directory path literal
    crit: component
    conf: 0.8
    mbc: T1552.004
    attack: T1552.004
    if:
      type: text
      substr: /.ssh/
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
      - id: metadata/file/format/structured::sourcemap-sources-content
      # ECC.py documents an OpenSSH path but does not access the filesystem.
      - id: well-known/lib/crypto/pycryptodome::pycryptodome-bytecode-path
  - id: ssh-dir-reference
    desc: SSH configuration directory reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(\bls\b|\bcd\b)\s+(-[A-Za-z0-9-]+\s+)?~/?\.ssh\b'

  - id: node-ssh-home-path
    desc: Node builds home SSH directory path
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    attack: T1552.004
    if:
      type: text
      regex: 'homedir\s*\(\)[\s\S]{0,100}["'']\.ssh["'']'

  - id: node-ssh-home-env-path
    desc: Node builds HOME SSH directory path
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    attack: T1552.004
    if:
      type: text
      regex: 'process\.env\.HOME[\s\S]{0,100}["'']\.ssh["'']'

  - id: bash-history-artifact
    desc: Bash history artifact path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: .bash_history

  - id: ssh-config-artifact
    desc: SSH config artifact path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: .ssh/config
    unless:
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module

  # These path strings establish sensitive-file awareness, not access or
  # theft intent. Stock OpenSSH configuration templates embed both.
  - id: known-hosts-path-reference
    desc: References an SSH known_hosts path
    crit: notable
    conf: 0.92
    for: [binaries]
    platforms: [unix]
    attack: T1552.004
    if:
      type: text
      substr: .ssh/known_hosts

  - id: host-private-key-path-set
    desc: References RSA and Ed25519 SSH host-key paths
    crit: notable
    conf: 0.92
    for: [binaries]
    platforms: [unix]
    attack: T1552.004
    if:
      type: text
      regex: '/etc/ssh/ssh_host_rsa_key[\s\S]{0,220}/etc/ssh/ssh_host_ed25519_key'

composite_rules:
  - id: ssh-host-artifact-cluster
    desc: Multiple SSH host-artifact paths
    crit: notable
    conf: 0.96
    needs: 2
    any:
      - id: bash-history-artifact
      - id: micro-behaviors/fs/path/config/system::config-hosts
      - id: ssh-config-artifact
    unless:
      - id: metadata/file/string/identity::system-shell-basename
      - id: well-known/app/ai/vtcode::vtcode-agent-package
