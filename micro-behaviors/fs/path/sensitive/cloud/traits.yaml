defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, java, class, c, cpp]
  attack: T1552.005
  mbc: T1552.005
traits:
  - id: aws-credentials-text-reference
    for: [shell, python, go, rust, perl, javascript, typescript, powershell, c, cpp]
    desc: References an AWS credentials file path
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\.aws[/\\]credentials'
  - id: python-cloud-credential-dir-join
    for: [python]
    desc: Python joins cloud credential directory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'os\.path\.join\s*\([^)]{0,80}["'']\.(aws|kube)["'']'
  - id: aws-credentials-open
    for: [python, javascript, c, cpp, go, rust, shell]
    desc: Opens ~/.aws/credentials with open()
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      substr: open
      arg:
        kind: string
        substr: .aws/credentials
  - id: aws-credentials-path
    for: [python, javascript, c, cpp, go, rust, shell]
    desc: Constructs ~/.aws/credentials with Path()
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      substr: Path
      arg:
        kind: string
        substr: .aws/credentials
  - id: aws-credentials-pathlib-home
    for: [python]
    desc: Pathlib construction of ~/.aws/credentials
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bPath\.home\(\)\s*/\s*["'']\.aws/credentials["'']'
  # Stealers often pass expanduser("~/.aws/credentials") into archive.add or
  # similar helpers without calling open()/Path() on the credentials file.
  - id: aws-credentials-expanduser
    for: [python]
    desc: Expands home path to AWS credentials
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)expanduser\s*\(\s*["'']~/?\.aws/credentials["'']'
  - id: aws-credentials-path-components
    desc: AWS credentials path components
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'path\.join\s*\([^)]{0,160}["'']\.aws["''][^)]{0,80}["'']credentials["'']'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/library/structure/
      - id: well-known/lib/cloud/aws-sdk-js/
      - id: well-known/tool/detection/security-scanner/
  - id: azure-msal-token-cache
    desc: Azure MSAL token cache path reference
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: .azure/msal_token_cache.json
    unless:
      - id: well-known/app/infrastructure/teleport::go-module

composite_rules:
  - id: aws-credentials
    for: [python, javascript, c, cpp, go, rust, shell]
    desc: Opens or constructs ~/.aws/credentials
    crit: notable
    conf: 0.95
    any:
      - id: aws-credentials-open
      - id: aws-credentials-path
      - id: aws-credentials-pathlib-home
      - id: aws-credentials-expanduser
    unless:
      - id: metadata/file/catalog/identity/
      - id: well-known/lib/cloud/aws-sdk-ruby
      - id: well-known/lib/cloud/aws-sdk-js/
      - id: metadata/library/runtime::acquire-vscode-api
      - id: micro-behaviors/process/interpreter/vm/
      - id: well-known/tool/detection/llm-scanner/
      - id: micro-behaviors/fs/path/sensitive/credentials::syntax-bundle-context
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
    downgrade:
      any:
        - id: micro-behaviors/fs/path/sensitive/credentials::pyarrow-s3fs-module-context
