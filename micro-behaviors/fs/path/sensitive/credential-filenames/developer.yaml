defaults:
  platforms: [unix]
  for: [javascript, typescript]

composite_rules:
  - id: developer-credential-path-list
    desc: Multiple developer credential path references
    crit: notable
    conf: 0.96
    needs: 3
    any:
      - id: micro-behaviors/os/package-manager/config::npmrc-user-config-path
      - id: micro-behaviors/fs/path/sensitive/credentials
      - id: metadata/file/string/cloud::gcp-default-credentials
