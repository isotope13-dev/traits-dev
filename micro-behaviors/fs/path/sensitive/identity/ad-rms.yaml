# Per-user AD RMS identity material and cached use licenses. These are path
# references only; collection intent is established by the theft composites.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.97
  attack: T1552.001

traits:
  - id: ad-rms-drm-identity-cache-path
    desc: References AD RMS identity credential cache
    if:
      type: text
      regex: '(?i)(%LOCALAPPDATA%|AppData[\\/]+Local)[\\/]+Microsoft[\\/]+DRM([\\/]|["''])'

  - id: ad-rms-msipc-license-cache-path
    desc: References AD RMS use-license cache
    if:
      type: text
      regex: '(?i)(%LOCALAPPDATA%|AppData[\\/]+Local)[\\/]+Microsoft[\\/]+MSIPC([\\/]|["''])'
