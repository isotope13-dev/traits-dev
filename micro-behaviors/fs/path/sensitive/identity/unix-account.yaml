# Neutral path references to the Unix account and key material locations.
# Intent belongs to objectives/collection/file-targeting/identity-set, which
# requires several of these together.
defaults:
  platforms: [unix]
  for: [elf, macho, shell, python, perl, ruby, text]
  crit: component
  conf: 0.8
traits:
  - id: etc-passwd-path-literal
    desc: References the account database
    # Component and deliberately weightless on its own: Go's os/user reads
    # /etc/passwd, so this string sits in the standard library and appears in
    # every Go binary, including the corpus's do-nothing fixtures.
    if:
      type: text
      exact: /etc/passwd
  - id: ssh-directory-literal
    desc: References the user SSH directory
    # The directory rather than one key file: a sweep opens the folder and
    # takes what is in it.
    if:
      type: text
      regex: '(^|[^\w.])\.ssh(/|$|["'' ])'
