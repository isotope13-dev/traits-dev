defaults:
  platforms:
    - macos
  for:
    - applescript
    - macho
  attack: T1555.003
traits:
  - id: cp-quoted-form
    desc: Copy command with quoted form (AppleScript)
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: cp\s+-rf.{0,30}quoted\s+form\s+of
composite_rules:
  - id: browser-data-theft
    desc: Browser credential and extension theft via AppleScript
    crit: suspicious
    conf: 0.9
    needs: 2
    any:
      - id: micro-behaviors/fs/path/app-data::extension-settings-path
      - id: micro-behaviors/fs/path/cookie::cookies-path-concat
      - id: micro-behaviors/fs/path/password-store::login-data-path-concat