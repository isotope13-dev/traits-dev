# Chrome synced-passkey storage locations.
#
# Chrome's cloud (Google Password Manager) authenticator keeps two things on
# disk: the synced WebAuthn credential records live in the profile's Sync Data
# LevelDB, and the device's wrapped key material lives in a `passkey_enclave_state`
# file beside them. Referencing either path is a neutral capability — Chromium
# itself does, and so does anything that reads the synced-passkey store — so these
# stay notable; the credential-access composites under
# objectives/credential-access/browser/passkey/ decide intent.
#
# Documented by Unit 42, "The Risks of Passwordless Authentication"
# (Pass-ta-key / Silver / Golden Pass-ta-key), 2026-08.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, c, cpp]
  crit: notable
  conf: 0.85

traits:
  # Chrome's per-device passkey enclave state file. Holds the TPM-wrapped device
  # identity key and the wrapped security-domain secret; deleting it forces the
  # browser to re-enroll and re-fetch that material.
  - id: chrome-passkey-enclave-state-file
    desc: Chrome passkey enclave state file
    conf: 0.9
    if:
      type: text
      substr: passkey_enclave_state

  # The profile's Sync Data LevelDB — where synced WebAuthn credential records
  # are persisted. Distinct from the Local Storage leveldb (see generic.yaml);
  # this is the passkey/sync store specifically. Matched across a path
  # separator or a path.join() argument break.
  - id: chrome-sync-data-leveldb-dir
    desc: Chrome Sync Data LevelDB directory
    conf: 0.86
    if:
      type: text
      regex: '(?i)Sync Data["''\s,)/\\]{1,8}LevelDB'
