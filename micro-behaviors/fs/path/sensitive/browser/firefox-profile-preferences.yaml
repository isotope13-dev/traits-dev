# Firefox profile settings and add-on state, named the way code that reaches
# into a profile directly has to name them.
#
# Sibling of chromium-profile-preferences.yaml in this directory, which already
# holds Chromium preference *names* alongside profile paths; the same split is
# used here. Everything is a plain reference at notable -- Firefox itself and a
# profile-migration utility name these too. The composites that supply intent
# live in objectives/persistence/login/browser-extension/firefox.yaml and
# objectives/impact/ui/manipulation/traffic/.
#
# `substr` so the trait fires both on a binary's null-terminated string run and
# on the surrounding source line.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, data, pe, dll, elf]
  conf: 0.9

traits:
  - id: firefox-startup-homepage-pref
    desc: Firefox startup homepage preference name
    crit: notable
    if:
      type: text
      substr: browser.startup.homepage

  - id: firefox-selected-engine-pref
    desc: Firefox selected search engine preference
    crit: notable
    if:
      type: text
      substr: browser.search.selectedEngine

  # The add-on manager's own database. Firefox reads it through the AddonManager
  # API; code that names the file is going around that API to the raw store.
  - id: firefox-extensions-database-file
    desc: Firefox add-on database file
    crit: notable
    if:
      type: text
      substr: extensions.sqlite

  # Where an OpenSearch provider XML has to be dropped for Firefox to offer it
  # as a search engine.
  - id: firefox-search-plugins-directory
    desc: Firefox search plugins directory
    crit: notable
    if:
      type: text
      regex: 'browser[\\/]searchplugins'
