defaults:
  platforms: [windows, unix]
  for: [scripts, source, data, pe, dll, elf]
  conf: 0.82
traits:
- id: chromium-secure-preferences-file
  desc: Chromium Secure Preferences file
  crit: notable
  if:
    # `substr`, not `exact`: in a binary the extracted run is exactly the
    # null-terminated name, but in source it is the surrounding line, so an
    # `exact` match only ever fires on one of the two.
    type: text
    substr: Secure Preferences
- id: chromium-preferences-file
  desc: Chromium Preferences file
  crit: component
  conf: 0.68
  if:
    type: text
    exact: Preferences
- id: chromium-extensions-directory
  desc: Chromium profile Extensions directory
  crit: component
  conf: 0.7
  if:
    type: text
    # A bare /extensions/ path is common in source trees (for example,
    # Envoy's generated Go packages). Require browser-profile context.
    regex: '(?i)(Chrome|Chromium|Edge)[^"\r\n]{0,96}[/\\]Extensions([/\\]|$)'
- id: browser-extension-manifest-json
  desc: Browser extension manifest file
  crit: component
  conf: 0.76
  if:
    type: text
    exact: manifest.json
- id: chromium-secure-prefs-super-mac
  desc: Chromium Secure Preferences super_mac
  crit: component
  conf: 0.9
  if:
    type: text
    word: super_mac
- id: chromium-secure-prefs-encrypted-hash
  desc: Chromium encrypted hash field
  crit: component
  conf: 0.9
  if:
    # Leading `_` is a word character, so `word:` would not match the
    # `settings_encrypted_hash` spelling Chromium actually writes.
    type: text
    substr: _encrypted_hash
- id: chromium-profile-user-data-path
  desc: Chromium profile User Data path
  crit: notable
  conf: 0.95
  if:
    type: text
    # Word-bound the browser product: unanchored `Edge` matches inside
    # `acknowledge` / `knowledge` next to ordinary "user data" API text.
    regex: '(?i)\b(Chrome|Chromium|Edge)\b[^"\r\n]{0,80}\bUser Data\b'
- id: chromium-profile-secure-preferences-name
  desc: Secure Preferences under browser profile
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)User Data[/\\]+(Default|Profile[ _0-9]*)[/\\]+Secure Preferences'
- id: chromium-developer-mode-pref-path
  desc: Chromium developer_mode preference
  crit: notable
  conf: 0.95
  if:
    # Chromium's own pref key. Code that flips it off-browser is enabling
    # unpacked-extension loading; the dotted path is the stable spelling and
    # also covers the account_values.* mirror of the same pref.
    type: text
    substr: extensions.ui.developer_mode
- id: chromium-local-network-content-setting
  desc: Chromium local network content setting
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'content_settings\.exceptions\.(local|loopback)_network'
- id: chromium-tracked-prefs-reset
  desc: Chromium tracked prefs reset
  crit: component
  conf: 0.86
  if:
    type: text
    exact: prefs.tracked_preferences_reset
- id: chromium-json-mac-helper--computemacleaf
  desc: Chromium JSON MAC helper (ComputeMacLeaf)
  crit: component
  conf: 0.86
  if:
    type: text
    word: ComputeMacLeaf
- id: chromium-json-mac-helper--computemacmissing
  desc: Chromium JSON MAC helper (ComputeMacMissing)
  crit: component
  conf: 0.86
  if:
    type: text
    word: ComputeMacMissing
- id: chromium-json-mac-helper--calculateencryptedhash
  desc: Chromium JSON MAC (CalculateEncryptedHash)
  crit: component
  conf: 0.86
  if:
    type: text
    word: CalculateEncryptedHash

# Preference names Chromium keeps for its *own* defenses against side-loaded
# extensions. None of them is a setting a user or an application configures:
# the browser writes them and the browser reads them. They are named here
# because code outside Chromium that spells one of them out is reaching into
# that defensive state, and no rule in the tree named them before.
#
# Notable individually -- Chromium's own source and a preference-inspection
# tool reference them legitimately -- with the intent supplied by the composite
# in objectives/persistence/login/browser-extension/chromium.yaml.
- id: chromium-sideload-wipeout-exemption
  desc: Chromium sideload wipeout exemption pref
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: exclude_from_sideload_wipeout
- id: chromium-enable-warning-suppression
  desc: Chromium extension enable-warning pref
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: install_warning_on_enable
- id: chromium-known-disabled-extensions
  desc: Chromium known-disabled extensions pref
  crit: notable
  conf: 0.92
  if:
    type: text
    substr: extensions.known_disabled
composite_rules:
- id: chromium-profile-secure-preferences-path
  desc: Chromium profile Secure Preferences path
  crit: notable
  conf: 0.95
  all:
  - id: chromium-profile-user-data-path
  - id: chromium-profile-secure-preferences-name
  near_bytes: 256
- id: chromium-json-mac-helper
  desc: Chromium JSON MAC helper
  crit: component
  conf: 0.86
  any:
  - id: chromium-json-mac-helper--computemacleaf
  - id: chromium-json-mac-helper--computemacmissing
  - id: chromium-json-mac-helper--calculateencryptedhash
- id: chromium-profile-extension-files
  desc: Chromium extension profile files
  crit: notable
  conf: 0.86
  needs: 3
  any:
  - id: chromium-secure-preferences-file
  - id: chromium-preferences-file
  - id: chromium-extensions-directory
  - id: browser-extension-manifest-json
- id: chromium-secure-prefs-mac-fields
  desc: Chromium Secure Preferences MAC fields
  crit: suspicious
  conf: 0.9
  all:
  - id: chromium-secure-preferences-file
  any:
  - id: chromium-secure-prefs-super-mac
  - id: chromium-secure-prefs-encrypted-hash
  - id: chromium-tracked-prefs-reset
  - id: chromium-json-mac-helper
  needs: 2
