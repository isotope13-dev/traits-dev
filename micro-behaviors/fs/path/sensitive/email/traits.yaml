defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]

traits:
  - id: mail-client-profile-or-config-path
    desc: Embedded mail client profile or config path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)(^|/)(\.thunderbird|\.msmtp(rc)?)(/|$)'

  - id: mailstore-path-set
    desc: Embedded Unix mailstore path set
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/var/mail[\s\S]{0,220}/var/spool/mail'
