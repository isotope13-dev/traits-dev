# Credential-bearing configuration stores used by AI coding assistants. The
# full product-specific directory chain distinguishes these from generic files
# named secrets.json or config.yaml. Separate atoms cover literal paths and
# path.join-style segment construction without a broad prose matcher.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.97
  attack: T1552.001

traits:
  - id: cline-secrets-path-literal
    desc: Cline secrets store literal path
    if:
      type: text
      regex: '(?i)\.cline[/\\\\]data[/\\\\]secrets\.json\b'

  - id: cline-secrets-path-join
    desc: Joins Cline secrets store path
    if:
      type: text
      regex: '["'']\.cline["'']\s*,\s*["'']data["'']\s*,\s*["'']secrets\.json["'']'

  - id: continue-config-path-literal
    desc: Continue config store literal path
    if:
      type: text
      regex: '(?i)\.continue[/\\\\]config\.ya?ml\b'

  - id: continue-config-path-join
    desc: Joins Continue config store path
    if:
      type: text
      regex: '["'']\.continue["'']\s*,\s*["'']config\.ya?ml["'']'

composite_rules:
  - id: cline-secrets-json-store
    desc: Cline plaintext provider secret store
    any:
      - id: cline-secrets-path-literal
      - id: cline-secrets-path-join
    unless:
      - id: well-known/tool/detection/

  - id: continue-config-yaml-store
    desc: Continue AI provider config store
    any:
      - id: continue-config-path-literal
      - id: continue-config-path-join
    unless:
      - id: well-known/tool/detection/
