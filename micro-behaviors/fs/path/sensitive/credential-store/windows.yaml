defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, rust, go, python, powershell]
  crit: notable
  conf: 0.9

traits:
  - id: windows-dpapi-master-key-path
    desc: Windows DPAPI master-key path reference
    attack: T1555
    if:
      type: text
      regex: '(?i)Protect[/\\]+S-1-'

  - id: windows-roaming-credentials-path
    desc: Windows roaming credential-store path reference
    attack: T1555.004
    if:
      type: text
      regex: '(?i)AppData[/\\]+Roaming[/\\]+Microsoft[/\\]+Credentials'
