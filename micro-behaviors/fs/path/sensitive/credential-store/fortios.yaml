# Stable on-device FortiOS configuration and key-store paths.  These path
# references are useful on their own during appliance triage, but credential
# theft intent requires a reader to collect the VDOM configuration together
# with the device-specific secret.
defaults:
  platforms: [fortios, appliance, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.98
  attack: T1552.001

