# Stable on-device FortiOS configuration and key-store paths.  These path
# references are useful on their own during appliance triage, but credential
# theft intent requires a reader to collect the VDOM configuration together
# with the device-specific secret.
defaults:
  platforms: [fortios, appliance, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.98
  attack: T1552.001

traits:
  - id: fortios-global-config-archive-path
    desc: FortiOS global config archive path
    if:
      type: text
      substr: /data/config/sys_global.conf.gz

  - id: fortios-interface-config-archive-path
    desc: FortiOS interface config archive path
    if:
      type: text
      substr: /data/config/global_system_interface.gz

  - id: fortios-vdom-config-archive-path
    desc: FortiOS compressed VDOM config path
    if:
      type: text
      regex: '/data/config/sys_vd_[A-Za-z0-9_.+-]{1,96}\.conf\.gz'

  - id: fortios-device-secret-path
    desc: FortiOS device secret path
    if:
      type: text
      substr: /data/etc/fsv_sync.dat
