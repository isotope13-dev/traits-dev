defaults:
  platforms:
    - macos
    - ios
  crit: notable
  conf: 0.8
  for:
    - scripts
    - source
    - binaries
traits:
  - id: stickies-data
    desc: Reference to Apple Stickies data
    if:
      type: text
      regex: (?i)Library/Containers/com\.apple\.Stickies|Library/StickiesDatabase
  - id: keychain-data
    desc: Reference to Apple Keychain data
    if:
      type: text
      regex: (?i)(Library/)?Keychains
  - id: privileged-helper-tools-path
    desc: References macOS privileged helper directory
    conf: 0.9
    if:
      type: text
      substr: /Library/PrivilegedHelperTools
  - id: ios-mobile-preferences
    desc: Reference to iOS mobile preferences
    platforms:
      - unix
      - ios
    for:
      - lua
      - macho
    if:
      type: text
      substr: /var/mobile/Library/Preferences
  - id: ios-mobile-app-data
    desc: Reference to iOS application data
    platforms:
      - unix
      - ios
    for:
      - lua
      - macho
    if:
      type: text
      substr: /var/mobile/Containers/Data/Application
  - id: ios-mobile-gamekit-data
    desc: Reference to iOS GameKit data
    platforms:
      - unix
      - ios
    for:
      - lua
      - macho
    if:
      type: text
      substr: /var/mobile/Library/GameKit
  - id: ios-mobile-cookies-db
    desc: Reference to iOS cookies database
    platforms:
      - unix
      - ios
    for:
      - lua
      - macho
    if:
      type: text
      substr: /var/mobile/Library/Cookies/Cookies.db
  - id: notes-data
    desc: Reference to Apple Notes data
    if:
      type: text
      regex: (?is)Library.{0,160}group\.com\.apple\.notes
  - id: imessage-chat-db
    desc: Reference to iMessage chat.db
    if:
      type: text
      substr: Library/Messages/chat.db
  - id: apple-notes-store
    desc: Reference to Apple Notes store
    if:
      type: text
      regex: (?is)Library.{0,240}com\.apple\.notes.{0,120}NoteStore\.sqlite
  - id: safari-binary-cookies
    desc: Reference to Safari cookies
    if:
      # The old pattern required the word "Cookies" a second time before the
      # filename, which only the iOS layout (Library/Cookies/Cookies.binary-
      # cookies) satisfies. The macOS jar every desktop stealer actually reads
      # lives at ~/Library/Safari/Cookies.binarycookies and never matched.
      # The filename is distinctive on its own; Library keeps it path-anchored.
      type: text
      regex: (?is)Library.{0,240}Cookies\.binarycookies
  - id: telegram-tdata-session
    desc: Reference to Telegram sessions
    if:
      type: text
      regex: (?i)Library/Application\s+Support/Telegram\s+Desktop/tdata
  - id: macos-login-keychain
    desc: Reference to login keychain
    if:
      type: text
      substr: Library/Keychains/login.keychain
  - id: macos-login-keychain-db
    desc: Reference to login keychain database
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: login.keychain-db
  - id: alfred-clipboard-db
    desc: Reference to Alfred clipboard
    if:
      type: text
      substr: Library/Application Support/Alfred/Databases/clipboard.alfdb
  - id: ios-sms-db
    desc: Reference to iOS SMS database
    platforms:
      - ios
      - unix
    for:
      - python
      - macho
    if:
      type: text
      regex: '(?i)(/private)?/var/mobile/Library/SMS/sms\.db'
  - id: ios-call-history-db
    desc: Reference to iOS call history
    platforms:
      - ios
    for:
      - macho
    if:
      type: text
      substr: /private/var/mobile/Library/CallHistoryDB/CallHistory.storedata
  - id: ios-address-book-db
    desc: Reference to iOS contacts database
    platforms:
      - ios
    for:
      - macho
    if:
      type: text
      substr: /private/var/mobile/Library/AddressBook/AddressBook.sqlitedb

  - id: safari-history-path
    desc: Safari history database path reference
    crit: notable
    conf: 0.85
    platforms:
      - macos
    if:
      type: text
      regex: (Safari|WebKit)[/\\\\].{0,50}History\.db|History\.db.{0,30}Safari

composite_rules:
  - id: multi-sensitive-store-references
    desc: Multiple macOS sensitive-store references
    crit: notable
    conf: 0.9
    needs: 2
    # Apple Notes, Telegram sessions and the login keychain database are
    # sensitive stores by the same measure as the original three, and are
    # defined as traits directly above. Leaving them out meant a stealer that
    # swept Notes + Telegram + the keychain DB — the exact AmnesiaStealer
    # target list — registered as no sweep at all.
    any:
      - id: keychain-data
      - id: imessage-chat-db
      - id: safari-binary-cookies
      - id: apple-notes-store
      - id: telegram-tdata-session
      - id: macos-login-keychain-db
