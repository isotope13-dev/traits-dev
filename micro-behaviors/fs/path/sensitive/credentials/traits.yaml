defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001
traits:
  - id: shell-history-file-path
    desc: References a shell history file path
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      regex: '(?i)(\.bash|\.zsh|\.sh)_history\b|ConsoleHost_history\.txt\b'

  - id: pyarrow-s3fs-module-context
    desc: PyArrow S3 module context
    crit: notable
    conf: 1.0
    if:
      type: text
      substr: pyarrow._s3fs
  - id: syntax-bundle-context
    desc: Embedded syntax bundle/resource context
    crit: notable
    conf: 1.0
    if:
      type: text
      substr: sublime-syntax
  - id: podman-containers-auth
    # Podman/Buildah/Skopeo registry credentials (the Docker config.json
    # equivalent). Lives at ~/.config/containers/auth.json or
    # $XDG_RUNTIME_DIR/containers/auth.json — the path is registry-auth specific.
    desc: Podman containers auth.json path
    if:
      type: text
      regex: containers/auth\.json
    unless:
      - id: well-known/app/development/github-cli/
  - id: editor-filetype-dosini-marker
    desc: Vim dosini filetype identifier
    crit: baseline
    conf: 1.0
    if:
      type: text
      exact: dosini
  - id: editor-filetype-pipconf-marker
    desc: Vim filetype-table pip.conf entry
    crit: baseline
    conf: 1.0
    if:
      type: text
      exact: pip.conf
  # Consistent with pypirc-credentials (notable): a .npmrc path reference is a
  # credential-file capability, not standalone-suspicious (editors/JS tooling like
  # nvim reference it). Theft intent comes from composites.
composite_rules:
  - id: credential-config-path-corpus
    desc: Multiple account database paths
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/fs/path/account-db::credential-config-path-corpus--config
      - id: micro-behaviors/fs/path/account-db::credential-config-path-corpus--etc
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: package-or-netrc-credential-file
    desc: Package or netrc credential file reference
    crit: notable
    conf: 0.9
    for: [binaries, scripts, source]
    any:
      - id: micro-behaviors/fs/path/secret-config::npmrc-credentials
      - id: micro-behaviors/fs/path/secret-config::pypirc-credentials-file
      - id: micro-behaviors/fs/path/secret-config::netrc
  # Two distinct SSH private-key filename constants together is the readdir-based
  # key-enumeration fingerprint that the slash-joined ssh-private-key path
  # matcher misses. Any pair drawn from {rsa, ed25519, ecdsa} is the tell —
  # rsa+ed25519 is the most common stealer target list. ssh client tooling is
  # carved out via downgrade.
  - id: editor-filetype-detect-context
    desc: Editor filetype table context
    crit: baseline
    conf: 1.0
    all:
      - id: editor-filetype-dosini-marker
      - id: editor-filetype-pipconf-marker
  - id: container-credentials
    desc: Container/orchestration credential paths
    crit: notable
    conf: 0.95
    unless:
      # Unit tests intentionally enumerate credential paths to verify the
      # deny gate; they do not read or transmit those credentials.
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: well-known/app/ai/gateway/ollama::ollama-windows-signed-context
    any:
      - id: micro-behaviors/fs/path/secret-config::docker-config
      - id: micro-behaviors/fs/path/secret-config::docker-config-path-components
      - id: micro-behaviors/fs/path/token::container-run-secrets
    downgrade:
      any:
        # Six ways of saying "this is container/orchestration tooling", where a
        # service-account or registry credential path is the tool's own
        # configuration surface rather than someone else's secret.
        - id: container-orchestration-tooling-context
  - id: orchestration-credentials
    desc: Orchestration credential paths
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/fs/path/secret-config::kube-config
      - id: micro-behaviors/fs/path/secret-config::kube-config-path-components
    unless:
      - id: well-known/lib/ai/pyaigis/
  - id: developer-credential-stores
    desc: References developer credential store paths
    crit: notable
    conf: 0.92
    for: [scripts, binaries, source]
    any:
      - id: cloud-credentials
      - id: orchestration-credentials
      - id: package-or-netrc-credential-file
  # Referencing an SSH credential path is a sensitive-path file-access
  # capability (deploy/provisioning scripts and ssh tooling reference
  # ~/.ssh routinely). Notable as a capability; credential-theft intent is
  # inferred by objectives composites that combine it with reads + exfil.
  - id: ssh-credentials
    desc: SSH credential file paths
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/fs/path/private-key::ssh-private-key
      - id: micro-behaviors/fs/path/secret-config::ssh-dir
    unless:
      - id: well-known/lib/ai/pyaigis/
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
  - id: hidden-temp-secret-path
    desc: Hidden temp secret path
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/password-store::hidden-temp-password-path
      - id: micro-behaviors/fs/path/token::hidden-temp-token-path
      - id: micro-behaviors/fs/path/token::hidden-temp-secretish-path
    downgrade:
      any:
        - id: syntax-bundle-context
        - id: micro-behaviors/process/interpreter/vm/
  - id: local-app-credentials
    desc: Local app credential files
    crit: notable
    conf: 0.86
    any:
      - id: hidden-app-config-api-key
      - id: micro-behaviors/fs/path/token::hidden-app-key-file
  - id: hidden-app-config-api-key
    desc: References an API key in hidden config
    crit: notable
    conf: 0.84
    all:
      - id: micro-behaviors/fs/path/application/config::hidden-app-config-file
      - id: micro-behaviors/data/parse/vocabulary::credential-field
    near_bytes: 1000
  - id: generic-sensitive-credential-path
    desc: References a sensitive credential or environment file path
    crit: notable
    conf: 0.8
    for: [javascript, typescript]
    any:
      - id: micro-behaviors/fs/path/private-key::keys
      - id: micro-behaviors/fs/path/secret-config::aws-config
      - id: micro-behaviors/fs/path/secret-config::npmrc-credentials
      - id: metadata/package/config::dotenv-file

  # A `.ssh/` path inside ssh tooling itself, or in a shell/REPL transcript in
  # documentation, is the path being described rather than read. Both `ssh-dir`
  # and `ssh-private-key` spelled this out leg by leg; naming it once keeps
  # each downgrade short and keeps the two in step.
  - id: ssh-tooling-or-transcript-context
    desc: SSH tooling or documentation transcript
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/communications/ssh/
      - id: micro-behaviors/fs/path/secret-config::ssh-client-basename
      - id: micro-behaviors/fs/path/secret-config::ssh-path-in-repl-transcript

  - id: container-orchestration-tooling-context
    desc: Container or orchestration tooling
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/os/container/runtime/
      - id: well-known/tool/sysadmin/container/
      - id: well-known/tool/sysadmin/kubernetes/iac/
      - id: well-known/tool/development/dagdotdev/
      - id: well-known/app/infrastructure/kubeflow-community::notebook-scripts
      - id: well-known/dual-use/tunnel/shadowsocks-libev::shadowsocks-libev-source

