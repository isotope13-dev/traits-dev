# Cocoa loads every bundle under (~)/Library/InputManagers into each GUI app
# at launch (pre-Lion). A shell move/copy into that directory is the install
# step; the bundle's own plist keys are matched under persistence.
defaults:
  platforms: [macos]
  for: [macho, shell, applescript]

traits:
  - id: input-manager-shell-install
    desc: Shell moves a bundle into InputManagers
    crit: notable
    conf: 0.9
    attack: T1547
    if:
      type: text
      regex: '(mv|cp -R|cp -r|ditto) [^\n]{1,80} ~?/Library/InputManagers'

  - id: app-main-executable-format
    desc: Formats an app bundle executable path
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: '%s/Contents/MacOS/%s'
