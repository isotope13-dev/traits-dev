defaults:
  platforms:
    - unix
    - windows
  for: [elf]
traits:
  - id: sbin-watchdog
    # One trait for both shapes: the path is worth seeing in an ELF that
    # disables the watchdog to stop the device rebooting out of an
    # infection, and in the shell script that does the same.
    desc: Reference to /sbin/watchdog
    crit: notable
    conf: 0.84
    for: [elf, scripts]
    platforms:
      - unix
      - windows
      - android
    if:
      type: text
      exact: "/sbin/watchdog"
