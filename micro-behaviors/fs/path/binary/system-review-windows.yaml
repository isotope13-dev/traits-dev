defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: system32-executable-path
    desc: Unescaped System32 DLL, EXE or SYS path
    crit: notable
    conf: 0.85
    for: [scripts, binaries, source]
    if:
      type: text
      # Escaped source paths have a separate trait; do not match midway
      # through a doubled separator. Require actual path components.
      regex: '(?i)(^|[^\\])\\System32\\[\w.-][\w.\\-]{0,95}\.(dll|exe|sys)\b'
  - id: windows-system-executable-path
    desc: Windows system executable path
    crit: notable
    conf: 0.94
    platforms: [windows]
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)(\$env:WINDIR|%WINDIR%|[A-Z]:\\Windows)\\(System32|SysWOW64)\\[\w.-]+\.exe'
  # A literal reference to the 32-bit command interpreter on 64-bit Windows.
  # Unattend answer files, compat shims and ordinary installers all spell
  # this path in the clear, so the literal alone is a path fact, not proof
  # of a staged or hidden shell launch.
  - id: syswow64-cmd-path
    desc: SysWOW64 cmd.exe path reference
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)C:\\Windows\\SysWOW64\\cmd\.'
  - id: system32-bin
    desc: References .bin file in System32
    crit: suspicious
    if:
      type: text
      regex: \\SystemRoot\\System32\\[a-zA-Z0-9_]+\.bin
      case_insensitive: true
    downgrade:
      any:
        - id: micro-behaviors/os/kernel/routines/
        - id: micro-behaviors/process/terminate/kill::kernel-process-termination
