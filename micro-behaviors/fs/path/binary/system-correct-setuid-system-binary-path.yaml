defaults:
  platforms:
    - unix
    - windows
  for: [elf]
traits:
  - id: setuid-system-binary-path
    desc: Privilege-related system binary path
    crit: notable
    conf: 0.85
    for: [c, cpp, go, rust, python, binaries]
    if:
      type: text
      regex: /usr/bin/(su|passwd|sudo|chsh|chfn|newgrp|chage|gpasswd|mount)\b
