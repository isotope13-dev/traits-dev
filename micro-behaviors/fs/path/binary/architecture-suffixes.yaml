defaults:
  platforms: [linux, android]
  for: [elf]
traits:
- id: architecture-executable-arm-suffix
  desc: References ARM-suffixed executable name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '^([a-z0-9_.-]+/)?[a-z0-9]{3,32}[._-]arm[0-9]*$'
  not:
  - regex: '^internal/cpu\.'
- id: architecture-executable-mips-suffix
  desc: References MIPS-suffixed executable name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '^([a-z0-9_.-]+/)?[a-z0-9]{3,32}[._-](mips|mipsel|mpsl)$'
- id: architecture-executable-x86-suffix
  desc: References x86-suffixed executable name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '^([a-z0-9_.-]+/)?[a-z0-9]{3,32}[._-](x86(_64)?|i[3-6]86)$'
  not:
  - regex: '^internal/cpu\.'
- id: architecture-executable-risc-suffix
  desc: References PPC, SH4 or M68K executable name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '^([a-z0-9_.-]+/)?[a-z0-9]{3,32}[._-](ppc|sh4|m68k)$'
# SPARC rounds out the Mirai target set. It is its own trait rather than a
# fourth alternation in the RISC one because the validator caps a regex at
# three `|` outside a character class.
- id: architecture-executable-sparc-suffix
  desc: References SPARC-suffixed executable name
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '^([a-z0-9_.-]+/)?[a-z0-9]{3,32}[._-](spc|sparc)$'
composite_rules:
- id: repeated-architecture-suffixed-executable-names
  desc: Executable filename references span three processor families
  crit: notable
  conf: 0.96
  needs: 3
  any:
  - id: architecture-executable-arm-suffix
  - id: architecture-executable-mips-suffix
  - id: architecture-executable-x86-suffix
  - id: architecture-executable-risc-suffix
  - id: architecture-executable-sparc-suffix
