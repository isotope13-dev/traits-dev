defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
traits:
  # Go string data is concatenated, without C terminators. Restrict this
  # observation to Go so it supplements the canonical exact C-string rule.
  - id: bin-sh-rodata-substring
    desc: Read-only data contains /bin/sh bytes
    conf: 0.9
    if:
      type: raw
      substr: /bin/sh
      section: .rodata
composite_rules:
  - id: go-bin-sh-binary-reference
    desc: Go binary contains the /bin/sh path
    crit: notable
    conf: 0.95
    all:
      - id: metadata/lang/compiler/systems::go-binary
      - id: bin-sh-rodata-substring
