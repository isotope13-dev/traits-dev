defaults:
  platforms: [unix, windows]
  for: [elf, pe, shell, python, c, scripts, binaries]
traits:
  - id: toolchain-binary-path
    desc: Path names a toolchain executable
    crit: component
    conf: 0.8
    if:
      type: text
      regex: '\bbin/(strip|gcc|g\+\+|clang|ld|as|ar|cc|objcopy|ranlib|nm)\b'

