---
defaults:
  crit: notable
traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: python-executable-name
  desc: python.exe path
  if:
    type: string_literal
    substr: python.exe
- platforms:
  - windows
  for:
  - batch
  - c
  - cpp
  - csharp
  - go
  - rust
  - python
  - powershell
  - javascript
  - typescript
  id: windows-environment-executable-path
  desc: Environment-based executable path
  conf: 0.92
  if:
    type: text
    regex: (?i)%(TEMP|APPDATA|LOCALAPPDATA|PROGRAMDATA)%[\\/][^"\r\n]{0,120}\.exe\b
