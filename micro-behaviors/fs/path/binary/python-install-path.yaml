defaults:
  platforms: [windows, unix]
  for:
    - javascript
traits:
  # These literals describe paths; they do not establish execution hijacking.
  - id: python-three-long-version-path
    desc: Python3 path has long version suffix
    crit: notable
    conf: 0.75
    if:
      type: string_literal
      regex: 'Python3\d{3,}'
  - id: windows-path-backslash
    desc: Hardcoded Windows path separators
    crit: notable
    conf: 0.6
    unless:
      - type: string_literal
        substr: WOW6432Node\\Cygwin\\setup
      - id: micro-behaviors/fs/path/personal::pwsh-history-fetch-export
    if:
      type: string_literal
      regex: '[A-Za-z]+\\\\[A-Za-z]+\\\\[A-Za-z]+'
    not:
      - substr: Software\\Microsoft\\Windows
      - substr: Community\\Common7\\Tools\\VsDevCmd.bat
      - substr: Microsoft\\Windows\\PowerShell\\PSReadLine
