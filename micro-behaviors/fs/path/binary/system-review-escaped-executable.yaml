defaults:
  platforms: [windows]
  for: [javascript, html, makefile, vbs]
  crit: notable
  conf: 0.94
traits:
  - id: escaped-system32-image-path
    desc: Escaped Windows System32 image path
    crit: notable
    conf: 0.94
    for: [javascript, html, makefile, vbs, c, cpp]
    if:
      type: text
      regex: '(?i)\\\\windows\\\\system32\\\\[\w.-]{1,40}(\\\\[\w.-]{1,40}){0,4}\.(dll|exe)\b'
