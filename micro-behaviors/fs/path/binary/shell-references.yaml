defaults:
  crit: notable
  platforms: [unix]
  for: [elf, macho]
traits:
  - id: bash-path-reference
    desc: Native binary references Bash shell path
    conf: 0.75
    if:
      type: text
      # Bare `bash` is a syntax-highlighter language token in large toolchains
      # (pandoc, Kate, Pygments tables). Require a path-shaped reference.
      regex: '(^|[/\\\\"''])(/bin/bash|/usr/bin/bash)\b'
      section: rodata

  - id: local-prefix-bash-path
    desc: Native binary references /usr/local bash path
    conf: 0.85
    if:
      type: text
      regex: '(^|[/\\"''])/usr/local/bin/bash\b'


  - id: bin-sh-path-reference
    desc: References the /bin/sh shell path
    crit: notable
    conf: 0.65
    if:
      type: text
      exact: /bin/sh
    downgrade:
      any:
      - id: metadata/file/string/identity::system-shell-basename

composite_rules:
  - id: multiple-shell-path-references
    desc: References several shell interpreter paths
    conf: 0.9
    needs: 3
    any:
      - id: bash-path-reference
      - id: local-prefix-bash-path
      - id: micro-behaviors/fs/path/binary::bin-sh-path-reference
      - id: micro-behaviors/fs/path/binary::bin-busybox-path
