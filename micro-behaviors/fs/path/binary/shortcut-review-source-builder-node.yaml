defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript

traits:
- id: javascript-crontab-path-literal
  desc: JavaScript crontab path literal
  crit: notable
  conf: 0.9
  if:
    type: literal
    kind: string
    exact: /usr/bin/crontab
- id: javascript-wget-path-literal
  desc: JavaScript wget path literal
  crit: notable
  conf: 0.88
  if:
    type: literal
    kind: string
    exact: /usr/bin/wget
- id: javascript-cat-path-literal
  desc: JavaScript cat path literal
  crit: notable
  conf: 0.88
  if:
    type: literal
    kind: string
    exact: /usr/bin/cat
