defaults:
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
  platforms: [windows]
traits:
  - id: hash-subdir-executable-in-root
    desc: Hash-named executable under root subdirectory
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: (?i)[C-Z]:\\[a-f0-9]{8}\\[a-f0-9]{8}\.exe
  - id: users-public-executable-path
    desc: Executable path under Users\Public
    crit: notable
    conf: 0.9
    if:
      type: text
      # Match both runtime paths (single backslash) and source/JSON escapes
      # (`Users\\Public\\...exe`) used when the path is written as a string
      # literal or JSON value.
      regex: '(?i)(Users[\\/]+Public[\\/]+|%PUBLIC%[\\/]+)[^"''\r\n;]{0,120}\.exe\b'
  - id: programdata-executable-path
    desc: ProgramData executable file path
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\\ProgramData\\[^\\\r\n''"]{1,80}(\\[^\\\r\n''"]{1,80})?\.exe'
  - id: programdata-env-executable-path
    desc: Environment ProgramData executable path
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)%ProgramData%\\[^\\\r\n''"]{1,80}(\\[^\\\r\n''"]{1,80})?\.exe'
  - id: programdata-powershell-executable-path
    desc: PowerShell ProgramData executable path
    crit: notable
    conf: 0.86
    for: [powershell]
    if:
      type: text
      regex: '(?i)\$env:ProgramData\\[^\\\r\n''"]{1,80}(\\[^\\\r\n''"]{1,80})?\.exe'
