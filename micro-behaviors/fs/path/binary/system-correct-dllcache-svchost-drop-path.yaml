defaults:
  for:
    - pe
  platforms:
    - windows
  size_max: 5000000
traits:
  - id: dllcache-svchost-drop-path
    size_min: 512
    size_max: 500000000
    desc: DLL cache svchost path reference
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: "\\dllcache\\svchost.exe"
      section: ".text"
