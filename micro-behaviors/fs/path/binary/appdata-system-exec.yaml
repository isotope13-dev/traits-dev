# Windows AppData executable paths masquerading as system utilities.
defaults:
  platforms: [windows]
  for: [batch, powershell, pe]
  crit: suspicious
  conf: 0.95

traits:
  - id: appdata-taskmgr-path
    desc: AppData Taskmgr executable path
    if:
      type: text
      regex: '(?i)(LOCAL)?APPDATA%?[/\\][^\r\n\"\x27]{0,120}\\taskmgr\.exe\b'

  - id: appdata-msedge-path
    desc: AppData msedge executable path
    if:
      type: text
      regex: '(?i)(LOCAL)?APPDATA%?[/\\][^\r\n\"\x27]{0,120}\\msedge\.exe\b'
