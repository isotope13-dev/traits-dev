defaults:
  platforms: [windows]
  for: [javascript, powershell, batch]
traits:
  - id: users-public-short-executable-path
    desc: Short executable filename under Users Public
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)Users[\\/]+Public[\\/]+[a-z0-9_-]{5,8}\.(exe|dll|bin)\b'
