defaults:
  platforms:
    - unix
    - windows
  for:
    - shell
  crit: suspicious
traits:
  - id: object-file-in-source-unix
    desc: Unix object-file path extension
    crit: notable
    conf: 0.8
    size_max: 200000
    if:
      type: path
      regex: '(^|[\\/])[^\\/]{1,80}\.(o|lo)$'
    unless:
      - id: micro-behaviors/revision-control/repository::git-operations-1
      - id: metadata/lang/source/syntax/command/named-command::git-working-tree-command-reference
      - type: text
        regex: Generated by GNU Autoconf|ac_config_headers|exec_prefix=
