defaults:
  platforms:
    - unix
    - windows
  for: [elf]
traits:
  - id: rm-utility-path
    desc: Unix rm delete utility absolute path
    crit: notable
    conf: 0.5
    platforms: [unix]
    for: [source, binaries, scripts]
    if:
      type: text
      regex: '(^|\s|["''`(=|;&])/bin/rm(\b|$)'

  # /usr/bin/su, passwd, sudo and chsh are the setuid-root binaries a local
  # escalation drives: each is world-executable, runs as root, and loads
  # libraries and parses an attacker-supplied environment before dropping
  # privileges. Naming one is how an exploit selects its victim, and equally how
  # a login wrapper, a container entrypoint or a hardening script names a tool to
  # manage -- so this is the target fact, and the escalation composites that
  # reference it supply the primitive.
