# A quoted UNC path (\\host\share\x.bat), including the WebDAV redirector
# forms \\host@SSL\DavWWWRoot\... and \\host@8080\..., that ends in a script
# file name. Source-escaped backslashes (\\\\host\\share) are accepted.
# When Windows is told to run such a path it fetches and runs the remote
# file in place.
defaults:
  for: [vbs, javascript, xml]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  - id: quoted-unc-script-path
    desc: Quoted UNC path to a script file
    if:
      type: text
      regex: '(?i)\\{2,4}[\w.@-]{1,253}\\{1,2}[^"''\s]{1,200}\.(bat|cmd|vbs|vbe|js|jse|wsf|ps1|hta)["'']'
