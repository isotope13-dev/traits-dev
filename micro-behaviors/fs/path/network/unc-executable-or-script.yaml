defaults:
  platforms: [windows]
  for: [powershell]

traits:
- id: unc-executable-or-script
  desc: Executable or script path on UNC share
  crit: notable
  conf: 0.92
  if:
    # A UNC path starts a token; the leading-boundary group says so. Without
    # it the doubled backslashes of a JSON-escaped local path read as the UNC
    # prefix, and an installer printing `{ "shellPath": "C:\\path\\to\\bash.exe" }`
    # as help text was reported for GPO share delivery.
    type: text
    regex: '(?i)(^|[\s"''=(,;])\\\\[A-Za-z0-9_.-]{1,64}\\[^\r\n"'']{1,180}\.(exe|dll|ps1|bat)\b'
