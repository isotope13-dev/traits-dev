defaults:
  platforms: [windows, unix]
  for:
    - rtf
  crit: suspicious

traits:
  - id: unc-path-smb-ssl
    crit: notable
    desc: UNC path @SSL detected
    if:
      type: text
      regex: \\\\[a-zA-Z0-9\-\.]+@SSL\\
    conf: 0.95
  - id: unc-path-network-share
    crit: notable
    desc: Network UNC path reference
    if:
      type: text
      regex: \\\\\\\\[a-zA-Z0-9\-\.]+\\
    conf: 0.85
  - id: webdav-path
    crit: notable
    desc: WebDAV path detected
    if:
      type: text
      substr: DavWWWRoot
      case_insensitive: true
    conf: 0.9
  - id: remote-path-init-reference
    desc: Link or table path with init text
    if:
      type: text
      regex: \\.lNk\?init=|\\\\tables\\\\.{0,50}init|HYPERLINK.{0,50}init
    conf: 0.9
    crit: suspicious
