# A pair of encoded backslashes is path-prefix evidence, not code evaluation.
defaults:
  platforms: [unix, windows]
  for: [html]

traits:
  - id: html-entity-unc-prefix
    desc: HTML entities encode a UNC prefix
    crit: component
    conf: 0.95
    if:
      type: text
      substr: '&#x5c;&#x5c;'
      case_insensitive: true
