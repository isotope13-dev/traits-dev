---
defaults:
  platforms:
  - windows
  for:
  - lnk
composite_rules:
- id: lnk-webdav-or-smb-reference
  desc: LNK WebDAV or SMB path reference
  crit: suspicious
  conf: 0.85
  any:
  - id: micro-behaviors/communications/http/webdav::lnk-webdav-path
  - id: micro-behaviors/fs/path/network::lnk-smb-share
  - id: micro-behaviors/communications/http/webdav::lnk-webdav-unc-ip-port
- id: lnk-webdav-ip-port-js-reference
  desc: LNK WebDAV IP port and JS references
  crit: suspicious
  conf: 0.95
  all:
  - id: micro-behaviors/communications/http/webdav::lnk-webdav-unc-ip-port
  - id: micro-behaviors/fs/path/script::lnk-js-extension
