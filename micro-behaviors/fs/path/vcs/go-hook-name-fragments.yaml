defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.85

traits:
- id: go-pre-commit-hook-name
  desc: Go text has pre-commit name fragments
  if:
    type: text
    regex: '["`]pre["`]\s*,\s*["`]-commit["`]|["`]pre-commit["`]'
- id: go-pre-push-hook-name
  desc: Go text has pre-push name fragments
  if:
    type: text
    regex: '["`]pre["`]\s*,\s*["`]-push["`]|["`]pre-push["`]'
