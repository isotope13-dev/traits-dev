# Hook member paths are neutral activation surfaces, not execution evidence.
# Matchers and template exclusions preserved from the install-hook catalog.
defaults:
  platforms: [linux, macos, windows]
  for: [shell, batch, text]

traits:
  - id: git-precommit-hook-path
    desc: Git pre-commit hook path
    crit: notable
    conf: 0.9
    if:
      type: path
      regex: '(^|[\\/])?pre-commit$'
    unless:
      - type: path
        regex: '(^|[\\/])(templates?|examples?|skel)[\\/]'

  - id: git-postcheckout-hook-path
    desc: Git post-checkout hook path
    crit: notable
    conf: 0.9
    if:
      type: path
      regex: '(^|[\\/])?post-checkout$'
    unless:
      - type: path
        regex: '(^|[\\/])(templates?|examples?|skel)[\\/]'

