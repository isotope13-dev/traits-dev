---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
traits:
- for:
  - javascript
  - typescript
  id: pre-commit-hook-name-reference
  desc: References pre-commit hook name
  conf: 0.7
  if:
    type: text
    substr: pre-commit
- for:
  - javascript
  - typescript
  id: pre-push-hook-name-reference
  desc: References pre-push hook name
  conf: 0.7
  if:
    type: text
    substr: pre-push
- for:
  - source
  - scripts
  id: source-control-config-or-token-path-reference
  desc: Source control credential paths
  conf: 0.9
  if:
    type: text
    regex: "(\\.git-credentials|\\.config/gh/hosts\\.yml|\\.gitconfig)\\b"
  unless:
  - id: metadata/build/
