defaults:
  platforms: [unix, windows]
  for: [javascript, package.json]

composite_rules:
  - id: challenge-word-extension-context
    desc: Path-related and file-type text clues
    crit: notable
    conf: 0.985
    size_max: 1000000
    all:
      - id: challenge-word-filename-text
    any:
      - id: metadata/lang/source/literal/string/label::filter-keyword-list
      - id: metadata/lang/source/literal/string/label::filter-keyword-markdown
      - id: metadata/lang/source/literal/string/label::filter-keyword-html
      - id: metadata/lang/source/literal/string/label::filter-keyword-text
    needs: 2
