defaults:
  platforms: [windows]


composite_rules:
  - id: backup-path-reference-profile
    desc: Backup file path references
    crit: notable
    conf: 0.92
    for: [c, cpp, vbs, powershell, batch, python, go]
    any:
      - id: micro-behaviors/fs/path/application/shortcut::lnk-dot-backup-suffix-reference
      - id: micro-behaviors/fs/file/copy/call::copyfile-backup-suffix
      - id: micro-behaviors/fs/path/application/shortcut::lnk-backup-format-reference
      - id: micro-behaviors/fs/path/application/shortcut::shortcut-backup-path-reference
