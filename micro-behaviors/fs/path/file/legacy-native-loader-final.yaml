traits:
- id: small-loader-executable-name-text
  desc: Small PE with loader-named executable reference
  crit: notable
  conf: 0.7
  size_min: 512
  size_max: 102400
  if:
    type: text
    regex: (?i)\b[a-z0-9_-]*loader[a-z0-9._-]*\.exe\b
    section: .text
  for:
  - pe
  - dll
  platforms:
  - windows
