# Specific filename path observation; no executable behavior is implied.
defaults:
  platforms:
  - windows
  for:
  - text
  - scripts
traits:
- id: brass-audio-dll-asset-path
  desc: Brass audio DLL TypeScript asset path
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  - text
  if:
    type: path
    regex: brassAudio\.dll\.(ts|js)$
