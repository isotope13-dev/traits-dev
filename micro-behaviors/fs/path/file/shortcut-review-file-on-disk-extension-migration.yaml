---
defaults:
  platforms:
  - windows
  for:
  - lnk
composite_rules:
- id: lnk-relative-copy-suffix
  desc: LNK relative path has a copy suffix
  crit: suspicious
  conf: 0.92
  any:
  - id: micro-behaviors/fs/path/file::lnk-relative-installer-copy-suffix
  - id: micro-behaviors/fs/path/file::lnk-relative-config-copy-suffix
  - id: micro-behaviors/fs/path/file::lnk-relative-log-copy-suffix
