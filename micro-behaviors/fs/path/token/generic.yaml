# Bearer material: OAuth, API and session token files. Possession is use --
# no passphrase, no key exchange.
defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

traits:
  - id: secret-token-file-path
    desc: References a secret or token file path
    crit: notable
    conf: 0.75
    if:
      type: literal
      # Require a path separator.  Bare names such as `apt.token` are
      # cookie/storage keys or configuration fields, not file paths.
      regex: '[/\\][\w.-]*\.(secret|token)\b'
  - id: api-key-path-fragment
    desc: API key filename or path fragment
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: '(?i)([/~\\\\])[^\\s''"`]{0,80}(api[_-]?key|apikey)[^\\s''"`]{0,80}($|[/\\\\.])'
    # Do not interpret a slash-separated list of uppercase environment
    # variable names (for example, FOO_API_KEY/BAR_API_KEY in help text) as a
    # filesystem path.  Lowercase and mixed-case path names remain covered.
    not:
      - regex: '/[A-Z][A-Z0-9_]{0,80}API[_-]?KEY'
      # A URL query parameter (`?tavilyApiKey={key}`, `?api_key=...`) is a
      # network request detail, not a filesystem path: OpenHands's
      # live_status_app_conversation_service.py builds
      # `https://mcp.tavily.com/mcp/?tavilyApiKey={tavily_api_key}` to call
      # the Tavily search API. The capturing group anchors on the FIRST `/`
      # that lets the rest of the pattern succeed, which for a
      # `scheme://host/...` URL is the double slash right after the scheme
      # colon (matched evidence starts at "//mcp.tavily.com/...", not
      # "https://..." — the scheme itself sits before the match). Excluding
      # a leading `//<domain>/` catches that shape without touching real
      # path fragments, which never start with a bare double slash into a
      # dotted hostname.
      - regex: '(?i)^//[\w.-]+\.[a-z]{2,}(:\d+)?/'
  - id: hidden-app-key-file
    desc: Hidden app encryption key file
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '[/~\\\\]\.[A-Za-z0-9._-]{2,64}/[A-Za-z0-9._-]{2,64}\.(key|pem)\b'
    not:
      - regex: '[/~\\\\]\.ssh/'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/detection/llm-scanner/
