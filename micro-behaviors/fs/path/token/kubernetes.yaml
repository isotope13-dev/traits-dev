# Bearer-token path references; these do not establish file access.
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  - python
  crit: notable
traits:
- id: serviceaccount-token
  desc: Kubernetes service-account token path
  conf: 0.8
  if:
    type: text
    regex: (/var/run/secrets/kubernetes\.io/serviceaccount/token)
- id: projected-serviceaccount-token
  desc: Projected service-account token path
  conf: 0.82
  if:
    type: text
    regex: /var/run/secrets/[^"' \n]{1,120}/serviceaccount/token
