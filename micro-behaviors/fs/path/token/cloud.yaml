defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - java
  - class
  - c
  - cpp
  attack: T1552.005
traits:
- id: aws-credentials-text-reference
  for:
  - scripts
  - source
  - binaries
  desc: References an AWS credentials file path
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)\.aws[/\\]credentials
- id: python-cloud-credential-dir-join
  for:
  - python
  desc: Python joins cloud credential directory
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: os\.path\.join\s*\([^)]{0,80}["']\.(aws|kube)["']
- id: aws-credentials-open
  for:
  - python
  - javascript
  - c
  - cpp
  - go
  - rust
  - shell
  desc: Opens ~/.aws/credentials with open()
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: call
    substr: open
    arg:
      kind: string
      substr: .aws/credentials
- id: aws-credentials-path
  for:
  - python
  - javascript
  - c
  - cpp
  - go
  - rust
  - shell
  desc: Constructs ~/.aws/credentials with Path()
  crit: notable
  conf: 0.95
  if:
    type: symbol
    kind: call
    substr: Path
    arg:
      kind: string
      substr: .aws/credentials
- id: aws-credentials-pathlib-home
  for:
  - python
  desc: Pathlib construction of ~/.aws/credentials
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)\bPath\.home\(\)\s*/\s*["']\.aws/credentials["']
- id: aws-credentials-expanduser
  for:
  - python
  desc: Expands home path to AWS credentials
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)expanduser\s*\(\s*["']~/?\.aws/credentials["']
- id: aws-credentials-path-components
  desc: AWS credentials path components
  crit: notable
  conf: 0.92
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: path\.join\s*\([^)]{0,160}["']\.aws["'][^)]{0,80}["']credentials["']
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/build
  - id: well-known/lib/cloud/aws-sdk-js/
  - id: well-known/tool/detection/security-scanner/
- id: azure-msal-token-cache
  desc: Azure MSAL token cache path reference
  crit: notable
  conf: 0.94
  if:
    type: text
    substr: .azure/msal_token_cache.json
  unless:
  - id: well-known/app/infrastructure/teleport::go-module
composite_rules:
- id: aws-credentials-path-forms
  desc: Constructs or opens the AWS credentials file
  crit: component
  conf: 0.95
  any:
  - id: aws-credentials-open
  - id: aws-credentials-path
  - id: aws-credentials-pathlib-home
  - id: aws-credentials-expanduser
- id: cloud-credentials
  desc: Cloud provider credential file paths
  crit: notable
  conf: 0.95
  any:
  - id: aws-credentials
  - id: aws-credentials-path-components
  - id: micro-behaviors/fs/path/secret-config::aws-config
  - id: gcloud-credentials
  - id: azure-credentials
  unless:
  - id: well-known/lib/ai/pyaigis/
  - id: well-known/tool/sysadmin/kubernetes/minikube
  - id: well-known/tool/detection/
  - id: well-known/dual-use/tunnel/shadowsocks-libev::shadowsocks-libev-source
  - id: well-known/app/infrastructure/aws-vault/
  - id: well-known/tool/sysadmin/cloud/azcopy::azcopy-tool
  - id: well-known/tool/development/vcs/gitaly::go-module-path
  downgrade:
    any:
    - id: micro-behaviors/data/format/editor-syntax::syntax-bundle-context
