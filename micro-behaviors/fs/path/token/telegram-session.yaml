defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, csharp, package.json, rust, source]
  crit: notable
  conf: 0.85

traits:
  - id: telegram-data-path
    desc: Telegram session-data path
    if:
      type: text
      regex: 'Telegram[/\\]+tdata\b'
  - id: telegram-tdata-path-parts
    desc: Adjacent Telegram tdata path components
    if:
      type: text
      regex: >-
        Telegram( Desktop)?['"][ \t]{0,4},[ \t]{0,4}['"]tdata\b
  - id: telegram-appstore-data-path
    desc: Telegram App Store session-data path
    conf: 0.95
    if:
      type: text
      substr: '6N38VWS5BX.ru.keepcoder.Telegram/appstore'
  - id: telegram-desktop-tdata-compact-path
    desc: TelegramDesktop tdata path segment
    conf: 0.9
    if:
      type: text
      regex: '(?i)TelegramDesktop[/\\]tdata\b'

  # Native constant pools can contain long concatenated buffers omitted from
  # extracted text; this bounded matcher reads the bytes of the actual path.
  - id: compiled-telegram-support-tdata-path
    desc: Compiled Telegram support tdata path
    for: [elf, macho, pe]
    if:
      type: raw
      regex: 'Application Support[/\\]Telegram Desktop[/\\]tdata'
  - id: python-vault-session-glob
    desc: Recursively searches for vault session files
    for: [python]
    conf: 0.9
    if:
      type: text
      regex: '\*\*/\*\.vault|["'']\*\*/\*\.vault["'']|"\*\.vault"'
