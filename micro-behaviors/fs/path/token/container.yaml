# Bearer material: OAuth, API and session token files. Possession is use --
# no passphrase, no key exchange.
defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

traits:
  - id: container-run-secrets
    desc: Container runtime secrets path
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '/run/secrets(/|$)'
    downgrade:
      any:
        - id: micro-behaviors/os/container/runtime/
        - id: well-known/tool/sysadmin/container/
