traits:
- id: telegram-session-hash-prefix
  desc: Telegram session filename hash prefix
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: D877F783
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  - csharp
- id: telegram-session-hash
  desc: Telegram session filename hash
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: D877F783D5D3EF8C
  platforms:
  - windows
  - linux
  - macos
  for:
  - javascript
  - package.json
  - pe
  - elf
  - macho
  - python
- id: telegram-numbered-map-path
  desc: Telegram tdata numbered map path
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: tdata.{0,24}[\\/]map[0-9]{1,2}
  unless:
  - id: metadata/build/bundler/asset::js-image-data-url
  platforms:
  - windows
  - linux
  - macos
  for:
  - javascript
  - package.json
  - pe
  - elf
  - macho
  - python
composite_rules:
- id: telegram-map-location
  desc: Telegram session location and map references
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/fs/path/token::telegram-session-data-location
  any:
  - id: micro-behaviors/fs/path/token::telegram-session-hash
  - id: micro-behaviors/fs/path/token::telegram-numbered-map-path
  platforms:
  - windows
  - linux
  - macos
  for:
  - javascript
  - package.json
  - pe
  - elf
  - macho
  - python
