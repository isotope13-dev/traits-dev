# Bearer material: token caches and credential files that grant access by
# possession alone.

defaults:
  platforms:
    - macos
    - ios
  crit: notable
  conf: 0.8
  for:
    - scripts
    - source
    - binaries

traits:
  - id: telegram-tdata-session
    desc: Reference to Telegram sessions
    if:
      type: text
      regex: (?i)Library/Application\s+Support/Telegram\s+Desktop/tdata
