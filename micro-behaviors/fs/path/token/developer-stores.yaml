# Bearer material granting access by possession.

defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

composite_rules:
  - id: developer-credential-stores
    desc: References developer credential store paths
    crit: notable
    conf: 0.92
    for: [scripts, binaries, source]
    any:
      - id: micro-behaviors/fs/path/token::cloud-credentials
      - id: micro-behaviors/fs/path/secret-config::orchestration-credentials
      - id: micro-behaviors/fs/path/secret-config::package-or-netrc-credential-file
  # Referencing an SSH credential path is a sensitive-path file-access
  # capability (deploy/provisioning scripts and ssh tooling reference
  # ~/.ssh routinely). Notable as a capability; credential-theft intent is
  # inferred by objectives composites that combine it with reads + exfil.
