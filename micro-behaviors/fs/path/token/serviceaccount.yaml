# Canonical token-only resource set; not file access or runtime identity.
composite_rules:
- platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  - python
  id: serviceaccount-token-path
  desc: Service-account bearer-token path reference
  crit: notable
  conf: 0.92
  any:
  - id: micro-behaviors/fs/path/token::serviceaccount-token
  - id: micro-behaviors/fs/path/token::projected-serviceaccount-token
