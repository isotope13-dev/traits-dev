# LiteLLM 1.107.0's collector builds these token-store paths with os.path.join.
# Recognize the resource in other languages and in complete Windows/Unix paths;
# a path reference alone establishes neither a read nor credential theft.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.96

traits:
  - id: ai-cli-oauth-token-store-path
    desc: Gemini or Qwen CLI OAuth token-store path
    if:
      type: text
      regex: '(?i)\.(gemini|qwen)([/\\]{1,2}|["'']\s*[,/]\s*["''])oauth_creds\.json($|["''\s\x00])'
