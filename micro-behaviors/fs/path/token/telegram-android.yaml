# Android Python uses Linux; the engine rejects Android-only Python scope.
defaults:
  for:
  - python
  platforms:
  - linux
  - android
traits:
- id: telegram-android-auth-store
  desc: Telegram Android authentication-store filename
  crit: notable
  conf: 0.97
  if:
    type: literal
    regex: (?i)^(tgnet\.dat|userconf[0-9]*\.xml)$
    exclude_docstrings: true
