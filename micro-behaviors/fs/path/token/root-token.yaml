defaults:
  crit: notable
  platforms: [unix, windows]
traits:
  - for:
      - scripts
      - source
      - javascript
      - typescript
    id: root-token-path-reference
    desc: Root /token path or URL reference
    if:
      type: text
      regex: (^|["'`\s])(https?://[^/\s"']{1,253})?/token\b
