# Directory and credential indicators do not establish theft. Preserve the
# co-occurrence as a neutral credential-path observation.
defaults:
  platforms: [unix, windows]
composite_rules:
  - id: aws-directory-credential-references
    for:
    - shell
    - python
    - javascript
    - ruby
    - perl
    desc: AWS directory with credential references
    crit: notable
    conf: 0.85
    any:
    - id: micro-behaviors/fs/path/token::aws-credentials
    - id: micro-behaviors/data/format/credentials::aws-key-assignment
    - id: micro-behaviors/data/format/credentials::native-aws-key-assignment
    - id: micro-behaviors/data/format/credentials::native-decoded-aws-key-assignment
    all:
    - id: micro-behaviors/fs/path/secret-config::aws-config-directory-literal
