defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: serviceaccount-token-read
  desc: Postinstall references service token path
  crit: suspicious
  conf: 0.95
  if:
    type: value
    path: scripts.postinstall
    substr: "/var/run/secrets/kubernetes.io/serviceaccount/token"
