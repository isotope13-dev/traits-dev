# Bearer material: OAuth, API and session token files. Possession is use --
# no passphrase, no key exchange.
defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

traits:
  - id: gcloud-credentials
    desc: Google Cloud credentials path
    if:
      type: text
      substr: '.config/gcloud'
    unless:
      - id: well-known/tool/detection/repo-trust-scan::repo-trust-scan-context
  - id: azure-credentials
    desc: Azure credentials path
    if:
      type: text
      substr: '.azure/credentials'
  - id: git-credentials
    desc: Git credentials file
    crit: notable
    for: [binaries, scripts, python, java, class, kotlin, c, cpp, go, rust]
    if:
      type: text
      regex: '(^|[/\\~''"\s])\.git-credentials\b'
    downgrade:
      all:
        - id: metadata/signed/developer::johannes-schindelin
        - id: metadata/signed/certificate/identity::pe-signature-verified
  - id: vault-token-file
    desc: HashiCorp Vault token file
    crit: notable
    if:
      type: text
      regex: (^|[/~\\\\])\.vault-token\b
    unless:
      - type: basename
        exact: ksops
  - id: claude-channels-token-file
    desc: Claude channels token file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)(^|[/~\\\\])\.claude[/\\\\]channels[/\\\\]\.token\b
  # Notable, matching the `gh-cli-hosts` sibling directly below: both are
  # path constants naming a tool's credential file, and referencing one is
  # what an integration with that tool does. Serverless Framework's
  # resolvers/providers/terraform/terraform.js exists to read Terraform
  # Cloud credentials.
  - id: terraform-credentials
    desc: Terraform Cloud credentials file
    crit: notable
    if:
      type: text
      substr: '.terraform.d/credentials.tfrc.json'
    unless:
      - id: micro-behaviors/fs/path/password-store::credential-store-documentation-context
      - id: well-known/tool/detection/
      - id: well-known/app/ai/coding-agent/vtcode::vtcode-agent-package
  - id: gh-cli-hosts
    desc: GitHub CLI authentication hosts file
    crit: notable
    if:
      type: text
      substr: '.config/gh/hosts.yml'
    unless:
      - id: micro-behaviors/fs/path/password-store::credential-store-documentation-context
      - id: well-known/tool/detection/
      - id: well-known/app/development/calvyn-code
