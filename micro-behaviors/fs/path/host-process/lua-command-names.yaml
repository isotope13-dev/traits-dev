defaults:
  for: [lua]
  platforms: [windows, unix, network-appliance]
traits:
  - id: lua-certutil-name
    desc: Lua references the certutil command name
    crit: notable
    conf: 0.82
    if:
      type: text
      word: certutil

  - id: lua-mshta-name
    desc: Lua references the mshta command name
    crit: notable
    conf: 0.82
    if:
      type: text
      word: mshta

  - id: lua-rundll32-name
    desc: Lua references the rundll32 command name
    crit: notable
    conf: 0.82
    if:
      type: text
      word: rundll32

