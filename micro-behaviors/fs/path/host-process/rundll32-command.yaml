# `rundll32` as a whole string: the command prefix a program joins with a
# DLL path and entry point to build a rundll32 command line. Exact match;
# `rundll32.exe` alone also appears in browsers' blocklists.
defaults:
  conf: 0.9
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: rundll32-command-prefix
    desc: Bare rundll32 command-prefix string
    crit: notable
    if:
      type: text
      regex: '(?i)^rundll32$'
