defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1036.005

traits:
  - id: windows-application-frame-host-name
    desc: References Application Frame Host name
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: Application Frame Host.exe

  - id: windows-svchost-name
    desc: PE embeds svchost executable name
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: svchost.exe
    # Process managers commonly mention svchost in a protected-name
    # allowlist; that is not masquerading or a staged host process.
    unless:
      - type: text
        substr: SYSTEM_CRITICAL_NAMES
      - id: well-known/lib/platform/microsoft-restart-manager::restart-manager-system-context

  # Two spellings for the same host process: `RuntimeBroker.exe` is the image
  # name on disk, `Runtime Broker.exe` the display name Task Manager shows.
  # Malware picks the image name when it renames a dropped copy, so matching
  # only the spaced form missed the case that matters.
  - id: windows-runtime-broker-name
    desc: References the Runtime Broker image name
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'Runtime ?Broker\.exe'
      case_insensitive: true
    # Windows' own components and Microsoft-signed tooling name this host
    # process legitimately.
    unless:
      - id: metadata/signed/platform::microsoft
      - id: well-known/app/storage/onedrive::signed-onedrive-standalone-updater
      - id: well-known/app/system/iobit::iobit-component-context

  - id: windows-search-host-name
    desc: References Windows Search host executable name
    crit: suspicious
    conf: 0.96
    if:
      type: text
      substr: SearchProtocolHost.exe
    unless:
      - id: well-known/app/system/iobit::iobit-component-context
