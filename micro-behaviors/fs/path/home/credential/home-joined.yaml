defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  crit: notable
  conf: 0.9
traits:
- id: shell-home-store-dotpath
  desc: Shell path into a home credential store
  for:
  - shell
  - perl
  - php
  - ruby
  - lua
  platforms:
  - unix
  if:
    type: text
    regex: (\$HOME|\$\{HOME\}|~)[/\\]\.(ssh|aws|gnupg|gcloud)(/|["'\s);,]|$)
- id: windows-home-store-dotpath
  desc: Windows profile path into a credential store
  for:
  - batch
  - powershell
  platforms:
  - windows
  if:
    type: text
    regex: '%USERPROFILE%[/\\]\.(ssh|aws|gnupg|gcloud)'
- id: node-homedir-store-join
  desc: Node homedir joined to a credential dotpath
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: homedir\(\)\s*[,+]\s*["'][/\\]?~?[/\\]?\.(ssh|gnupg|gcloud)
- id: python-pathlib-home-store-dotpath
  desc: Pathlib path into home credential store
  for:
  - python
  if:
    type: text
    regex: Path\.home\(\)\s*/\s*["']\.(ssh|aws|gnupg|gcloud)
- id: python-expanduser-home-store-dotpath
  desc: Python expanduser home credential store
  for:
  - python
  if:
    type: text
    regex: expanduser\(\s*["']~[/\\]?\.(ssh|aws|gnupg|gcloud)
composite_rules:
- id: home-joined-credential-store-path
  desc: Resolves a credential store under the home directory
  conf: 0.9
  attack: T1552.001
  any:
  - id: micro-behaviors/fs/path/home/credential::python-pathlib-home-store-dotpath
  - id: micro-behaviors/fs/path/home/credential::python-expanduser-home-store-dotpath
  - id: micro-behaviors/fs/path/home/credential::shell-home-store-dotpath
  - id: micro-behaviors/fs/path/home/credential::windows-home-store-dotpath
  - id: micro-behaviors/fs/path/home/credential::node-homedir-store-join
