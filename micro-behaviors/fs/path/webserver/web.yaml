defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: public-html-php-path-reference
    desc: References a public_html PHP path
    crit: component
    conf: 0.9
    for: [php]
    if:
      type: text
      regex: '/home/[^"''\s]{1,80}/public_html/[^"''\s]{1,80}\.php'
  - id: hardcoded-path-var-www-html
    desc: Detects a hardcoded /var/www/html path.
    crit: notable
    if:
      type: text
      exact: /var/www/html
  - id: public-web-script-path-reference
    desc: Public web-root script path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(^|[\\/])(public|htdocs|w(ww|eb)root)[\\/][^"''\s]{1,60}\.(php|aspx?|jsp|cgi|pl|py)\b'
  - id: java-webapps-jsp-target-path
    desc: JSP path in Java webapps tree
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(^|[\\/])webapps[\\/]+[^"''\s\\/]{1,80}[\\/]+[^"''\s]{1,180}\.jspx?\b'
  - id: zimbra-jetty-webapps-jsp-path
    desc: JSP path in Zimbra Jetty webapps
    crit: notable
    conf: 0.99
    platforms: [unix]
    if:
      type: text
      regex: '/opt/zimbra/jetty(_base)?/webapps/[^"''\s]{1,240}\.jspx?\b'
  - id: aspnet-client-system-web
    desc: ASP.NET aspnet_client/system_web path
    crit: notable
    conf: 0.92
    platforms: [windows]
    for: [pe, dll, batch, powershell, csharp]
    if:
      type: text
      regex: 'aspnet_client[\\/]+system_web'
      case_insensitive: true
  - id: exchange-owa-auth-dir
    desc: Exchange Server OWA auth directory
    crit: notable
    conf: 0.92
    platforms: [windows]
    for: [pe, dll, batch, powershell, csharp]
    if:
      type: text
      regex: 'Exchange Server[\\/]+V15[\\/]+FrontEnd[\\/]+HttpProxy[\\/]+owa[\\/]+auth'
      case_insensitive: true
  - id: inetpub-wwwroot
    desc: inetpub wwwroot path
    crit: baseline
    conf: 0.85
    platforms: [windows]
    for: [pe, dll, batch, powershell, csharp]
    if:
      type: text
      regex: 'inetpub[\\/]+wwwroot'
      case_insensitive: true
  - id: managed-webroot-handler-path
    desc: ASP.NET handler path under a public webroot
    crit: notable
    conf: 0.95
    platforms: [windows]
    for: [scripts, source, pe, dll]
    if:
      type: text
      regex: '(?i)inetpub[\\/]+wwwroot[\\/]+[^"''\s]{1,100}\.(aspx?|ashx|asmx)\b'
  - id: aspx-error-page-name
    desc: error/errorFE ASP.NET page basename
    crit: component
    conf: 0.85
    platforms: [windows]
    for: [pe, dll, batch, powershell, csharp]
    if:
      type: path
      basename: true
      regex: '^(error|errorFE)\.(aspx|ashx)$'
      case_insensitive: true
  - id: aspx-signout-page-name
    desc: signout/warn ASP.NET page basename
    crit: component
    conf: 0.85
    platforms: [windows]
    for: [pe, dll, batch, powershell, csharp]
    if:
      type: path
      basename: true
      regex: '^(signout|warn)\.(aspx|ashx)$'
      case_insensitive: true
  - id: aspx-data-page-name
    desc: data/page ASP.NET page basename
    crit: component
    conf: 0.85
    platforms: [windows]
    for: [pe, dll, batch, powershell, csharp]
    if:
      type: path
      basename: true
      regex: '^(data|page)\.(aspx|ashx)$'
      case_insensitive: true
  - id: vmware-perfcharts-webapps-path
    desc: VMware perfcharts Tomcat webapps path
    crit: notable
    conf: 0.92
    for: [shell, python, javascript, java, html, go, ruby, perl]
    if:
      type: text
      substr: /usr/lib/vmware-perfcharts/
  - id: vmware-perfcharts-statsreport-jsp
    desc: JSP path under VMware perfcharts statsreport
    crit: notable
    conf: 0.95
    for: [shell, python, javascript, java, html, go, ruby, perl]
    if:
      type: text
      regex: '/usr/lib/vmware-perfcharts/[^"''\s]{0,80}/statsreport/[^"''\s]{0,80}\.jsp\b'
