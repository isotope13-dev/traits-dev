traits:
  - id: inetpub-webroot-path
    for: [batch, powershell, pe]
    platforms: [windows]
    desc: Repeated IIS webroot path
    crit: notable
    count_min: 2
    if:
      type: text
      substr: inetpub\wwwroot
      case_insensitive: true
  # A bare '--recursive' was dropped: every file tool's help text has it.
