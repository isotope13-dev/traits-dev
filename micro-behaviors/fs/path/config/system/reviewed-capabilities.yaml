traits:
- platforms:
  - windows
  for:
  - powershell
  - batch
  - scripts
  id: windows-system32-registry-hive-path
  desc: References a Windows System32 registry hive path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (?i)\\Windows\\System32\\config\\(SAM|SECURITY|SYSTEM|SOFTWARE)\b
