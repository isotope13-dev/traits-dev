# Evidence-specific placement; matching does not imply attacker intent.
traits:
- platforms:
  - linux
  for:
  - scripts
  - binaries
  id: supervisor-config-file-reference
  desc: Supervisor service configuration file path
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: /etc/(supervisor/conf\.d|supervisord\.d)/[^\s]{1,120}\.conf\b
  unless:
  - id: well-known/tool/detection/ai-guardrail/
defaults: {}
