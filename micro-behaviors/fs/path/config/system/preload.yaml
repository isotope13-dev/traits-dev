defaults:
  platforms: [linux]
  for: [scripts, binaries]
traits:
  - id: ld-so-preload-path
    desc: Loader preload configuration path
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '/([^/\s"'']{1,64}/){0,6}etc/ld\.so\.preload\b'
    unless:
      - type: basename
        regex: '^(ld\.so|ldconfig|ldd)(\.\d+)?$'
      - id: micro-behaviors/dylib/library/libc/
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
