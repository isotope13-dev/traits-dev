defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # Consecutive CLR user strings for Path.Combine("System32", "drivers",
  # "etc", "hosts"). The short gaps are heap terminators/length prefixes.
  # This records path components, not a write or successful path resolution.
  - id: managed-windows-hosts-path-components
    desc: Managed Windows hosts path component sequence
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: .text
      pattern: '53 00 79 00 73 00 74 00 65 00 6D 00 33 00 32 00 [1-4] 64 00 72 00 69 00 76 00 65 00 72 00 73 00 [1-4] 65 00 74 00 63 00 [1-4] 68 00 6F 00 73 00 74 00 73 00'
