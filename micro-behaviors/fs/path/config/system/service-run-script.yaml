defaults:
  platforms:
  - unix
  crit: notable
  conf: 0.9
traits:
- for:
  - shell
  - scripts
  - binaries
  id: runit-service-path
  desc: runit service directory path
  if:
    type: text
    regex: /etc/(sv|service)/[A-Za-z0-9_.@-]{1,80}/run\b
- for:
  - scripts
  - binaries
  id: s6-service-run-path
  desc: References an s6 service run-script path
  if:
    type: text
    regex: /etc/s6(-rc)?/[^\s]{1,160}/run\b
