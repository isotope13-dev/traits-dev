defaults:
  platforms: [linux]
traits:
  - id: ld-so-preload-file
    desc: References ld.so.preload file
    crit: notable
    conf: 0.9
    for: [scripts, binaries, c, cpp, rust, go]
    if:
      type: text
      regex: '(^|/([^/\s"'']{1,64}/){0,6}etc/)ld\.so\.preload\b'
    unless:
      - type: basename
        regex: '^(ld\.so|ldconfig|ldd)(\.\d+)?$'
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
