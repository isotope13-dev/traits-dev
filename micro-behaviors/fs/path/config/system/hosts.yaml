defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, jar, zip]

composite_rules:
  - id: hosts-file-path
    desc: Hosts file path reference
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/fs/path/config/system::windows-hosts-file
      - id: micro-behaviors/fs/path/config/system::windows-hosts-relative-path
      - id: micro-behaviors/fs/path/config/system::windows-hosts-template-path
      - id: micro-behaviors/fs/path/config/system::windows-hosts-backup-template
      - id: micro-behaviors/fs/path/config/system::config-hosts
