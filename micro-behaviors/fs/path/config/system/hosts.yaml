defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, jar, zip]

composite_rules:
  - id: hosts-file-path
    desc: Hosts file path reference
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/fs/path/config/system::windows-hosts-file
      - id: micro-behaviors/fs/path/config/system::windows-hosts-relative-path
      - id: micro-behaviors/fs/path/config/system::windows-hosts-template-path
      - id: micro-behaviors/fs/path/config/system::windows-hosts-backup-template
      - id: micro-behaviors/fs/path/config/system::config-hosts

  # The hosts path together with the Win32 calls that could rewrite it. This
  # is a *capability* observation and is named for one: SetFileAttributesA,
  # DeleteFileA and CopyFileA are the most generic file APIs Windows offers,
  # they are not tied to the hosts path by anything the matcher can see, and
  # every hosts editor, firewall, ad blocker, AV and network diagnostic that
  # ships as a PE carries this exact pair of observations. It previously lived
  # in objectives/evasion/hosts-file/block-security/ as
  # "windows-hosts-tamper-api" / "Hosts tamper with file APIs", which reported
  # tampering that was never observed — a signed IObit updater that merely
  # references System32\drivers\etc\hosts scored suspicious on it.
  #
  # Tampering intent belongs to the composites that consume this leg and add
  # the missing half: a security-vendor domain, a null-route redirect line, or
  # bulk domain blocking. Those still score hostile.
  - id: hosts-file-modification-api-set
    desc: Hosts path with file-modification APIs
    crit: notable
    conf: 0.9
    platforms: [windows]
    all:
      - id: micro-behaviors/fs/path/config/system::hosts-file-path
    needs: 2
    any:
      - id: micro-behaviors/fs/file/attributes::set-file-attributes-a
      - id: micro-behaviors/fs/file/delete::deletefile-a
      - id: micro-behaviors/fs/file/copy::copyfile-a
    unless:
      - id: metadata/signed/developer::adobe-inc.
