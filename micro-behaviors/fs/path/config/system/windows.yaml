defaults:
  platforms: [windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.7

traits:
  - id: windows-hosts-file
    desc: Windows hosts file path
    if:
      type: text
      regex: (?i)\\system32\\drivers\\etc\\hosts
  - id: windows-hosts-relative-path
    desc: Windows hosts path relative to system directory
    conf: 0.9
    if:
      type: text
      regex: (?i)\\drivers\\etc\\hosts\b
  - id: windows-hosts-template-path
    desc: Windows hosts path format string
    conf: 0.85
    if:
      type: text
      regex: (?i)%s\\drivers\\etc\\hosts
  - id: windows-hosts-backup-template
    desc: Hosts backup template reference
    conf: 0.85
    if:
      type: text
      regex: (?i)%s\\hosts\.sam
  - id: windows-termsrv-dll-path
    desc: Windows Terminal Services system DLL path
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '(?i)(System32|Dllcache)[\\/]{1,2}termsrv\.dll'
