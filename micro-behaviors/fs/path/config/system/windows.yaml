defaults:
  platforms: [windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.7

traits:
  - id: windows-termsrv-dll-path
    desc: Windows Terminal Services system DLL path
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)(System32|Dllcache)[\\/]{1,2}termsrv\.dll'
