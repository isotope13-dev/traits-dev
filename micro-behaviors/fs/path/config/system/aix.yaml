defaults:
  crit: notable
  platforms: [aix, unix]
  for: [elf, c, cpp, php, shell]
traits:
  - id: etc-inittab
    desc: "Access to /etc/inittab system init file"
    conf: 0.8
    if:
      type: string_literal
      exact: /etc/inittab
  - id: etc-rc-local
    desc: References /etc/rc.local boot script path
    conf: 0.8
    if:
      type: string_literal
      regex: /etc/rc(\.d/rc)?\.local
  - id: etc-security-passwd
    desc: Reference AIX security password file
    conf: 0.9
    if:
      type: string_literal
      exact: /etc/security/passwd
