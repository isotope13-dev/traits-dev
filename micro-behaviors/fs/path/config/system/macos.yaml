defaults:
  platforms: [macos]
  for: [scripts, source, binaries]

traits:
  - id: system-zshenv-path
    desc: macOS system-wide zsh startup path
    crit: notable
    conf: 0.92
    attack: T1546.004
    if:
      type: text
      substr: /etc/zshenv

  - id: root-at-crontab-path
    desc: References the macOS root at-job crontab path
    crit: notable
    conf: 0.94
    attack: T1053.003
    if:
      type: text
      substr: /var/at/tabs/root
