defaults:
  crit: notable
  platforms: [macos]
  for: [scripts, source, binaries]

traits:
  - id: system-zshenv-path
    desc: macOS system-wide zsh startup path
    conf: 0.92
    attack: T1546.004
    if:
      type: text
      substr: /etc/zshenv

  - id: root-at-crontab-path
    desc: References the macOS root at-job crontab path
    conf: 0.94
    attack: T1053.003
    if:
      type: text
      substr: /var/at/tabs/root

  - id: apple-setup-done-path
    desc: References macOS AppleSetupDone path
    conf: 0.9
    attack: T1082
    if:
      type: text
      substr: /var/db/.AppleSetupDone
  - id: macos-rc-script-path
    desc: macOS /etc/rc.common or rc.netboot path
    for: [scripts, binaries]
    conf: 0.84
    attack: T1037
    unless:
    - id: metadata/package/files/ecosystem::conda-shell-activation-layout
    - id: well-known/tool/development/build/homebrew::source-tree
    - id: well-known/tool/development/build/homebrew::source-tree-macos
    - type: path
      substr: linuxbrew
    - type: text
      substr: Homebrew
    - id: well-known/app/security/adguardhome::release-path
    - type: text
      substr: "#!/bin/sh /etc/rc.common"
    if:
      type: text
      regex: '/etc/(rc\.common|rc\.netboot)\b'
