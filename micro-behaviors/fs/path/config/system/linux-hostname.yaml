defaults:
  platforms: [unix]
  for: [javascript]
traits:
- id: linux-hostname-path
  desc: References /etc/hostname file
  crit: notable
  conf: 0.96
  unless:
  - id: well-known/tool/development/agent/anthropic-claude-agent/
  - id: metadata/package/testing/presence/harness::spec-test-filename
  if:
    type: text
    substr: "/etc/hostname"
