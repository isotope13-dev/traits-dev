# The alternatives include SYSTEM and SECURITY, so this is a registry-hive
# location, not specifically an account database or a credential filename.
defaults:
  platforms: [windows]
  for: [scripts, source, binaries]

traits:
  - id: shadow-copy-registry-hive-path
    desc: References registry hive inside a VSS path
    crit: notable
    conf: 0.97
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: 'HarddiskVolumeShadowCopy\d+[^\r\n]{0,48}\bconfig[\\/]{1,2}S(AM|ECURITY|YSTEM)\b'
      case_insensitive: true

