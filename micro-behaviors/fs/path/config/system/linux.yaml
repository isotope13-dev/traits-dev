defaults:
  platforms:
    - unix
    - windows
  for: [elf]
traits:
  - id: selinux-policy-extension-set-a
    desc: References an SELinux policy filename
    crit: notable
    conf: 0.8
    for: [scripts, binaries]
    platforms: [linux, android]
    if:
      type: text
      regex: 'policy\.(3[0-9]|pp|te)$'

  - id: selinux-policy-extension-set-b
    desc: References an SELinux policy support filename
    crit: notable
    conf: 0.8
    for: [scripts, binaries]
    platforms: [linux, android]
    if:
      type: text
      regex: 'policy\.(fc|if)$'

  - id: native-login-profile-target
    desc: Shell login profile path (.profile/.bashrc)
    crit: component
    conf: 0.88
    for: [c, cpp, objc, elf]
    platforms: [unix]
    # Path boundaries are required on both sides. A bare `\.(profile|bashrc)`
    # substring also matched dotted identifiers -- `perftools.profiles.Profile`
    # in pprof/gperftools code, `cfg.profile`, `.profiler`, `.profileData` --
    # none of which is a shell rc file. The leading class keeps the forms a
    # dropper actually writes: `~/.bashrc`, `"%s/.profile"`, `>>.bashrc`.
    if:
      type: text
      regex: '(^|[/~"\s=>])\.(profile|bashrc)\b'
  - id: config-etc
    desc: Reference to /etc configuration files
    crit: baseline
    conf: 0.66
    if:
      type: text
      substr: /etc/
  - id: modules-load-config-path
    desc: Kernel module autoload configuration path
    crit: notable
    conf: 0.84
    for: [scripts, binaries]
    platforms: [linux]
    if:
      type: text
      regex: '/etc/modules-load\.d/[^\s]{1,120}\.conf\b|/etc/modules\b'
  - id: config-passwd-resolver-sequence
    desc: References account and resolver config paths
    crit: notable
    conf: 0.9
    for: [scripts, binaries, source]
    platforms: [unix]
    if:
      type: text
      regex: '/etc/passwd[\s\S]{0,160}/etc/resolv\.conf'
  - id: selinux-policy-path
    desc: Reference to SELinux policy file path
    crit: notable
    conf: 0.8
    for: [scripts, binaries]
    platforms: [linux, android]
    if:
      type: text
      substr: /selinux/policy
  - id: config-watchdog-default
    # One trait for both shapes: the path is worth seeing in an ELF that
    # disables the watchdog to stop the device rebooting out of an
    # infection, and in the shell script that does the same.
    desc: Reference to /etc/default/watchdog
    crit: notable
    conf: 0.84
    for: [elf, scripts]
    platforms:
      - unix
      - windows
      - android
    if:
      type: text
      exact: "/etc/default/watchdog"
  - id: config-watchdog-default-xor14
    desc: XOR-obfuscated /etc/default/watchdog path
    crit: notable
    conf: 0.92
    if:
      type: hex
      section: .rodata
      pattern: 21 6B 7A 6D 21 6A 6B 68 6F 7B 62 7A 21 79 6F 7A 6D 66 6A 61 69
  - id: config-ld-so-cache
    desc: Reference to /etc/ld.so.cache
    crit: baseline
    conf: 0.8
    if:
      type: text
      exact: /etc/ld.so.cache
  - id: glibc-gconv-path
    desc: Reference to glibc gconv module path
    crit: baseline
    conf: 0.7
    if:
      type: text
      regex: /(usr/)?lib/gconv/?
  - id: apt-conf-dropin-path
    desc: APT apt.conf.d configuration path
    for: [scripts, binaries]
    platforms: [linux]
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: '/etc/apt/apt\.conf\.d/[^\s]{1,120}\b'
  - id: mail-forward-alias-path
    desc: Mail .forward or /etc/aliases path
    for: [scripts, binaries]
    platforms: [linux]
    crit: notable
    conf: 0.82
    if:
      type: text
      # A home-anchored ~/.forward, not any `/.forward` -- ML code formats
      # `{model}/.forward` into error strings.
      regex: '(~|HOME\}?|/root|/home/[\w.-]{1,32})/\.forward\b|/etc/aliases\b'
