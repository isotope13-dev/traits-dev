defaults:
  platforms:
    - unix
    - windows
  for: [elf]
traits:
  - id: selinux-policy-extension-set-a
    desc: References an SELinux policy filename
    crit: notable
    conf: 0.8
    for: [scripts, binaries]
    platforms: [linux, android]
    if:
      type: text
      regex: 'policy\.(3[0-9]|pp|te)$'

  - id: selinux-policy-extension-set-b
    desc: References an SELinux policy support filename
    crit: notable
    conf: 0.8
    for: [scripts, binaries]
    platforms: [linux, android]
    if:
      type: text
      regex: 'policy\.(fc|if)$'

  - id: native-login-profile-target
    desc: Shell login profile path (.profile/.bashrc)
    crit: component
    conf: 0.88
    for: [c, cpp, objc, elf]
    platforms: [unix]
    # Path boundaries are required on both sides. A bare `\.(profile|bashrc)`
    # substring also matched dotted identifiers -- `perftools.profiles.Profile`
    # in pprof/gperftools code, `cfg.profile`, `.profiler`, `.profileData` --
    # none of which is a shell rc file. The leading class keeps the forms a
    # dropper actually writes: `~/.bashrc`, `"%s/.profile"`, `>>.bashrc`.
    if:
      type: text
      regex: '(^|[/~"\s=>])\.(profile|bashrc)\b'
    unless:
    - type: trait
      id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
  - id: config-etc
    desc: Reference to /etc configuration files
    crit: baseline
    conf: 0.66
    if:
      type: text
      substr: /etc/
  - id: modules-load-config-path
    desc: Kernel module autoload configuration path
    crit: notable
    conf: 0.84
    for: [scripts, binaries]
    platforms: [linux]
    if:
      type: text
      regex: '/etc/modules-load\.d/[^\s]{1,120}\.conf\b|/etc/modules\b'
    unless:
      - id: well-known/tool/sysadmin/busybox::busybox-binary
  - id: config-hosts
    desc: References /etc/hosts
    crit: notable
    conf: 0.66
    for: [scripts, binaries]
    if:
      type: text
      substr: /etc/hosts
    downgrade:
      any:
        - id: metadata/file/string/identity::system-shell-basename
    unless:
      - id: metadata/lang/compiler/systems::go-binary
  - id: config-hosts-bytecode
    # JVM constant-pool probe: a raw hex hit for this ASCII literal only means
    # "bytecode references it" inside a class/jar. Bounded so it cannot claim a
    # hundreds-of-megabyte container (a FreeBSD install ISO reached this rule and
    # matched the literal in ordinary files it carries); no real class or jar is
    # this large.
    size_max: 67108864
    desc: Reference to /etc/hosts in JVM bytecode
    crit: notable
    conf: 0.86
    for: [class]
    if:
      type: hex
      pattern: 2F 65 74 63 2F 68 6F 73 74 73
    unless:
      - type: hex
        pattern: CF FA ED FE
      - id: metadata/package/manager::go-module-source-archive
  - id: hidden-hosts-backup-bytecode
    desc: Hidden hosts backup path in JVM bytecode
    crit: notable
    conf: 0.86
    for: [class]
    if:
      type: hex
      pattern: 2F 74 6D 70 2F 2E 68 6F 73 74 73 2E 62 61 6B
    unless:
      - type: hex
        pattern: CF FA ED FE
  - id: config-crontab
    desc: Reference to /etc/crontab
    crit: notable
    conf: 0.78
    for: [scripts, binaries, javascript]
    platforms: [unix]
    if:
      type: text
      substr: /etc/crontab
    unless:
      - id: metadata/file/format/
  - id: cron-d-path-reference
    desc: Reference to /etc/cron.d system path
    crit: notable
    conf: 0.7
    for: [scripts, binaries]
    platforms: [unix]
    if:
      type: text
      regex: '/etc/cron\.d(/|$)'
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/build/recognized-contexts::benign-app-fp-context
      - id: metadata/build/package/maintainer-scripts::pacman-post-remove-cron-cleanup
      - id: metadata/build/package/maintainer-scripts::debian-postrm-cron-cleanup
      - id: well-known/app/system/olares::cli-source-tree
      - id: objectives/supply-chain/install-hook/dropper/shell::cloudwatch-metrics-cron-marker
      - type: text
        regex: /etc/cron\.d/(glusterfs_snap_cron_tasks|gcron_update_task)
      - id: metadata/file/catalog/persistence-path::persistence-path-catalog-constant
  - id: cron-periodic-directory-path
    desc: Reference to a periodic /etc/cron job directory
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    platforms: [unix]
    if:
      type: text
      regex: '/etc/cron\.(daily|hourly|weekly|monthly)(/|$)'
    unless:
      - id: well-known/tool/detection/security-scanner/
      - id: metadata/file/catalog/persistence-path::persistence-path-catalog-constant
  - id: root-crontab-spool-path
    desc: Reference to root crontab spool path
    crit: notable
    conf: 0.86
    for: [scripts, binaries]
    platforms: [unix]
    if:
      type: text
      substr: /var/spool/cron/crontabs/root
  - id: var-spool-cron-path
    desc: Reference to user crontab spool path
    crit: notable
    conf: 0.7
    for: [scripts, binaries, source]
    platforms: [unix]
    if:
      type: text
      substr: /var/spool/cron
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: well-known/tool/sysadmin/busybox::busybox-binary
      - id: well-known/tool/detection/security-scanner/
  - id: config-resolv
    desc: References /etc/resolv.conf
    crit: notable
    conf: 0.9
    for: [scripts, binaries, source]
    platforms: [unix, android]
    if:
      type: text
      exact: /etc/resolv.conf
    unless:
      - id: metadata/lang/compiler/systems::go-binary
  - id: config-passwd-resolver-sequence
    desc: References account and resolver config paths
    crit: notable
    conf: 0.9
    for: [scripts, binaries, source]
    platforms: [unix]
    if:
      type: text
      regex: '/etc/passwd[\s\S]{0,160}/etc/resolv\.conf'
  - id: selinux-policy-path
    desc: Reference to SELinux policy file path
    crit: notable
    conf: 0.8
    for: [scripts, binaries]
    platforms: [linux, android]
    if:
      type: text
      substr: /selinux/policy
  - id: config-resolv-xor
    desc: XOR-obfuscated /etc/resolv.conf path
    crit: notable
    conf: 0.82
    if:
      type: hex
      section: .rodata
      pattern: 7B 31 20 37 7B 26 31 27 3B 38 22 7A 37 3B 3A 32 54
  - id: config-resolv-xor62
    desc: XOR-obfuscated /etc/resolv.conf path
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .rodata
      pattern: 4D 07 16 01 4D 10 07 11 0D 0E 14 4C 01 0D 0C 04 62
  - id: config-resolv-xor18
    desc: XOR-obfuscated /etc/resolv.conf path
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .rodata
      pattern: 37 7D 6C 7B 37 6A 7D 6B 77 74 6E 36 7B 77 76 7E
  - id: config-watchdog-default
    # One trait for both shapes: the path is worth seeing in an ELF that
    # disables the watchdog to stop the device rebooting out of an
    # infection, and in the shell script that does the same.
    desc: Reference to /etc/default/watchdog
    crit: notable
    conf: 0.84
    for: [elf, scripts]
    platforms:
      - unix
      - windows
      - android
    if:
      type: text
      exact: "/etc/default/watchdog"
  - id: config-watchdog-default-xor14
    desc: XOR-obfuscated /etc/default/watchdog path
    crit: notable
    conf: 0.92
    if:
      type: hex
      section: .rodata
      pattern: 21 6B 7A 6D 21 6A 6B 68 6F 7B 62 7A 21 79 6F 7A 6D 66 6A 61 69
  - id: config-ld-so-cache
    desc: Reference to /etc/ld.so.cache
    crit: baseline
    conf: 0.8
    if:
      type: text
      exact: /etc/ld.so.cache
  - id: glibc-gconv-path
    desc: Reference to glibc gconv module path
    crit: baseline
    conf: 0.7
    if:
      type: text
      regex: /(usr/)?lib/gconv/?
  - id: apt-conf-dropin-path
    desc: APT apt.conf.d configuration path
    for: [scripts, binaries]
    platforms: [linux]
    crit: notable
    conf: 0.84
    attack: T1546
    if:
      type: text
      regex: '/etc/apt/apt\.conf\.d/[^\s]{1,120}\b'
    unless:
    - id: well-known/app/infrastructure/docker::source-tree
    - id: well-known/app/infrastructure/docker::docker-source-archive-context
  - id: mail-forward-alias-path
    desc: Mail .forward or /etc/aliases path
    for: [scripts, binaries]
    platforms: [linux]
    crit: notable
    conf: 0.82
    attack: T1546
    if:
      type: text
      # A home-anchored ~/.forward, not any `/.forward` -- ML code formats
      # `{model}/.forward` into error strings.
      regex: '(~|HOME\}?|/root|/home/[\w.-]{1,32})/\.forward\b|/etc/aliases\b'
    unless:
    - id: micro-behaviors/dylib/library/family/
    - id: well-known/lib/native/glibc::libc-runtime
    - id: well-known/tool/development/toolchain/gcc-toolchain::gcc-bootstrap-benign-context
    - id: well-known/tool/development/toolchain/gcc-toolchain::conda-linux-gnu-triplet-path
    - type: basename
      regex: '^libc\.(a|so)'
