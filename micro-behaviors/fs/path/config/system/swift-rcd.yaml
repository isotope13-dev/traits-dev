defaults:
  platforms: [unix]
  for: [swift]
traits:
  - id: swift-local-rcd-path
    desc: References local BSD service directory
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: /usr/local/etc/rc.d

  - id: swift-system-rcd-path
    desc: References system BSD service directory
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: /etc/rc.d/
