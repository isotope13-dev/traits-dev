defaults:
  crit: notable
  conf: 0.94
  platforms: [unix]
  for: [scripts, source, binaries]

traits:
  - id: bsd-ppp-config-path
    desc: BSD PPP configuration path
    if:
      type: text
      substr: /etc/ppp/ppp.conf

  - id: openbsd-ipsec-secret-path
    desc: OpenBSD IPsec secret path
    for: [shell]
    if:
      type: text
      substr: /etc/ipsec.secrets

  - id: openbsd-ssl-private-pem
    desc: OpenBSD SSL private PEM path
    for: [shell]
    if:
      type: text
      substr: /etc/ssl/private/*.pem

  - id: freebsd-loader-boot-variable
    desc: FreeBSD loader boot variable
    for: [shell]
    if:
      type: text
      regex: 'autoboot_delay|vfs\.root\.mountfrom'
