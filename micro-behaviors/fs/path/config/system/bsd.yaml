defaults:
  platforms: [unix]
  for: [scripts, source, binaries]

traits:
  - id: bsd-ppp-config-path
    desc: BSD PPP configuration path
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: /etc/ppp/ppp.conf

  - id: freebsd-loader-boot-variable
    desc: FreeBSD loader boot variable
    crit: notable
    conf: 0.94
    for: [shell]
    if:
      type: text
      regex: 'autoboot_delay|vfs\.root\.mountfrom'
