defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: micro-behaviors/fs/path/config/system::etc-openal-path
    desc: /etc/openal path
    crit: notable
    if:
      type: text
      substr: "/etc/openal"
  - id: micro-behaviors/fs/path/config/system::etc-thermald-path
    desc: /etc/thermald path
    crit: notable
    if:
      type: text
      substr: "/etc/thermald"
