defaults:
  platforms: [linux, unix, android]
  for: [elf]
  crit: notable
composite_rules:
  - id: watchdog-config-path-reference
    desc: Plain or XOR-encoded watchdog configuration path
    conf: 0.95
    any:
      - id: config-watchdog-default
      - id: config-watchdog-default-xor14
  - id: watchdog-config-and-device-references
    desc: Watchdog configuration and device path references coexist
    conf: 0.95
    all:
      - id: watchdog-config-path-reference
      - id: micro-behaviors/fs/path/device/special::watchdog-device
