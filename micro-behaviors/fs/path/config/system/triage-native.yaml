traits:
- platforms:
  - linux
  for:
  - scripts
  - binaries
  id: udev-rules-file-path
  desc: References a udev rules file path
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: /(etc|lib|usr/lib)/udev/rules\.d/[^\s]{1,120}\.rules\b
  unless:
  - type: text
    regex: \$\((TARGET_DIR|DESTDIR)\)/(etc|lib|usr/lib)/udev/rules\.d/
- platforms:
  - linux
  for:
  - scripts
  - binaries
  id: network-if-up-down-hook-path
  desc: NetworkManager or if-up/down hook path
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: /etc/(NetworkManager/dispatcher\.d|network/(if-up|if-down)\.d)/
- platforms:
  - linux
  for:
  - scripts
  - binaries
  id: dhclient-hook-path
  desc: DHCP client enter/exit hook path
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: /etc/(dhcp/dhclient-(enter|exit)-hooks\.d)/
- platforms:
  - linux
  for:
  - scripts
  - binaries
  id: network-pre-up-post-down-hook-path
  desc: NetworkManager or pre-up/post-down hook path
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: /etc/(NetworkManager/dispatcher\.d|network/(if-pre-up|if-post-down)\.d)/
- platforms:
  - openwrt
  for:
  - scripts
  - source
  - elf
  - pyc
  - -perl
  id: openwrt-interface-hotplug-path
  desc: OpenWrt interface hotplug hook path
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: /etc/hotplug.d/iface
composite_rules:
- platforms:
  - linux
  for:
  - scripts
  - binaries
  id: network-dispatcher-hook-path
  desc: References Linux network dispatcher hook directories
  crit: notable
  conf: 0.86
  any:
  - id: micro-behaviors/fs/path/config/system::network-if-up-down-hook-path
  - id: micro-behaviors/fs/path/config/system::dhclient-hook-path
  - id: micro-behaviors/fs/path/config/system::network-pre-up-post-down-hook-path
