defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: windows-system-ini-reference
    desc: References the legacy Windows system.ini file
    for: [pe, dll, ne]
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: system.ini
      case_insensitive: true
  # Raw bytes, not text: NE string tables drop 8-byte literals such as \win.ini.
  - id: windows-win-ini-reference
    desc: References the legacy Windows win.ini file
    for: [pe, dll, ne]
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: '(?i)\bwin\.ini\b'
  - id: previous-setup-inf-name
    desc: References previous setup inf file
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: prev.inf
