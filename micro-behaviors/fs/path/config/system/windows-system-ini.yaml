defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: windows-system-ini-reference
    desc: References the legacy Windows system.ini file
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: system.ini
      case_insensitive: true
  - id: previous-setup-inf-name
    desc: References previous setup inf file
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: prev.inf
