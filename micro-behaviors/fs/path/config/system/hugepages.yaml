defaults:
  platforms: [linux]
  for: [scripts, binaries, source]
  crit: notable
  conf: 0.95

traits:
  # Used by miners, databases and memory-management utilities. The path
  # alone establishes neither a write nor unauthorized resource use.
  - id: hugepage-count-sysctl-path
    desc: References Linux hugepage count sysctl
    if:
      type: text
      regex: '/proc/sys/vm/nr_hugepages\b'

  - id: hugepage-count-sysfs-path
    desc: References Linux hugepage count in sysfs
    if:
      type: text
      regex: '/sys/[^\s]{1,96}/hugepages-[0-9]+kB/nr_hugepages\b'
