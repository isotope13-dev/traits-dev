defaults:
  platforms: [openwrt]
  for: [scripts, binaries, pyc, source]
  crit: notable
  conf: 0.88

traits:
  - id: openwrt-uci-command
    desc: OpenWrt UCI configuration command
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\buci\s+[a-z][a-z-]*\b'
  - id: openwrt-uci-export-command
    desc: OpenWrt UCI export command
    if:
      type: text
      regex: '\buci\s+export\b'
  - id: openwrt-uci-show-command
    desc: OpenWrt UCI show command
    if:
      type: text
      regex: '\buci\s+show\b'
  - id: openwrt-uci-system-change
    desc: OpenWrt UCI system configuration change
    if:
      type: text
      regex: '\buci\s+(set|commit)\s+system\b'
  - id: openwrt-network-config-path
    desc: OpenWrt network UCI config path
    for: [elf, shell]
    if:
      type: string_literal
      regex: '^/etc/config/(wireless|network|dhcp)$'
  - id: openwrt-service-config-path
    desc: OpenWrt service UCI config path
    for: [elf, shell]
    if:
      type: string_literal
      regex: '^/etc/config/(dropbear|luci|firewall)$'
  - id: openwrt-system-config-path
    desc: OpenWrt system UCI config path
    for: [elf, shell]
    if:
      type: string_literal
      regex: '^/etc/config/(system|ssh)$'
  - id: openwrt-platform-marker
    desc: OpenWrt platform and WAN-status marker
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'openwrt_release|\bBOARD_NAME\b|ifstatus wan'
  - id: openwrt-uhttpd-redirect-setting
    desc: OpenWrt uhttpd HTTPS redirect setting
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: uci set uhttpd.main.redirect

  - id: openwrt-sysupgrade-config-path
    desc: OpenWrt sysupgrade config path
    if:
      type: text
      substr: /etc/sysupgrade.conf

  # A path *inside* the UCI config tree, not the bare `/etc/config` prefix:
  # requiring a following segment keeps unrelated paths such as
  # `/etc/config.txt` out.
  - id: openwrt-uci-config-dir-path
    desc: OpenWrt UCI config tree path
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '/etc/config/[a-z][a-z0-9_.-]*'

composite_rules:
  - id: openwrt-uci-config-access
    desc: OpenWrt UCI configuration access
    crit: notable
    conf: 0.9
    any:
      - id: openwrt-uci-export-command
      - id: openwrt-uci-show-command
      - id: openwrt-network-config-path
      - id: openwrt-service-config-path
      - id: openwrt-system-config-path

  # Any signal that the analyzed code is written for OpenWrt specifically.
  # Objective composites use this as their "targets OpenWrt" leg instead of
  # matching the bare product name, which appears in every distro table.
  - id: openwrt-platform-context
    desc: OpenWrt platform configuration reference
    crit: notable
    conf: 0.88
    any:
      - id: openwrt-platform-marker
      - id: openwrt-uci-config-dir-path
      - id: openwrt-uci-command
      - id: openwrt-sysupgrade-config-path
