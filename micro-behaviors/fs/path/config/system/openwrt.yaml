defaults:
  platforms:
  - openwrt
  for:
  - scripts
  - binaries
  - pyc
  - source
  crit: notable
  conf: 0.88
traits:
- id: openwrt-uci-command
  desc: OpenWrt UCI configuration command
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \buci\s+[a-z][a-z-]*\b
- id: openwrt-uci-export-command
  desc: OpenWrt UCI export command
  if:
    type: text
    regex: \buci\s+export\b
- id: openwrt-uci-show-command
  desc: OpenWrt UCI show command
  if:
    type: text
    regex: \buci\s+show\b
- id: openwrt-uci-system-change
  desc: OpenWrt UCI system configuration change
  if:
    type: text
    regex: \buci\s+(set|commit)\s+system\b
- id: openwrt-network-config-path
  desc: OpenWrt network UCI config path
  for:
  - elf
  - shell
  if:
    type: string_literal
    regex: ^/etc/config/(wireless|network|dhcp)$
- id: openwrt-service-config-path
  desc: OpenWrt service UCI config path
  for:
  - elf
  - shell
  if:
    type: string_literal
    regex: ^/etc/config/(dropbear|luci|firewall)$
- id: openwrt-system-config-path
  desc: OpenWrt system UCI config path
  for:
  - elf
  - shell
  if:
    type: string_literal
    regex: ^/etc/config/(system|ssh)$
- id: openwrt-platform-marker
  desc: OpenWrt platform and WAN-status marker
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: openwrt_release|\bBOARD_NAME\b|ifstatus wan
- id: openwrt-uhttpd-redirect-setting
  desc: OpenWrt uhttpd HTTPS redirect setting
  crit: notable
  conf: 0.93
  if:
    type: text
    substr: uci set uhttpd.main.redirect
- id: openwrt-sysupgrade-config-path
  desc: OpenWrt sysupgrade config path
  if:
    type: text
    substr: /etc/sysupgrade.conf
- id: openwrt-uci-config-dir-path
  desc: OpenWrt UCI config tree path
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: /etc/config/[a-z][a-z0-9_.-]*
- for:
  - scripts
  - source
  - elf
  - pyc
  - -perl
  id: openwrt-root-crontab-path
  desc: References OpenWrt root crontab path
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: /etc/crontabs/root
- id: openwrt-preinit-hook-registration
  desc: OpenWrt preinit hook registration
  crit: notable
  conf: 0.95
  for: [shell]
  if:
    type: text
    substr: boot_hook_add preinit
- id: openwrt-uci-defaults-script
  desc: OpenWrt first-boot defaults script name
  crit: notable
  conf: 0.95
  for: [shell]
  if:
    # uci-defaults is the platform-mandated first-boot migration name:
    # /etc/uci-defaults/* runs once as root. Like SKILL.md/package.json,
    # a format-mandated name may gate.
    type: path
    basename: true
    exact: uci.defaults
- id: openwrt-bootdevice-export
  desc: OpenWrt boot-device export idiom
  crit: notable
  conf: 0.93
  for: [shell]
  if:
    type: text
    regex: 'export_(boot|part)device'
- id: openwrt-lua-platform-require
  desc: OpenWrt Lua platform binding require
  crit: notable
  conf: 0.93
  for: [lua]
  if:
    # nixio and luci.* ship only on OpenWrt; requiring them marks
    # firmware-tree Lua (daemons, hotplug handlers, QoS).
    type: text
    regex: 'require\s+"(nixio|luci\.)'
composite_rules:
- id: openwrt-uci-config-access
  desc: OpenWrt UCI configuration access
  crit: notable
  conf: 0.9
  any:
  - id: openwrt-uci-export-command
  - id: openwrt-uci-show-command
  - id: openwrt-network-config-path
  - id: openwrt-service-config-path
  - id: openwrt-system-config-path
- id: openwrt-platform-context
  desc: OpenWrt platform configuration reference
  crit: notable
  conf: 0.88
  any:
  - id: openwrt-platform-marker
  - id: openwrt-uci-config-dir-path
  - id: openwrt-uci-command
  - id: openwrt-sysupgrade-config-path
- id: openwrt-firmware-component-context
  desc: Recognized OpenWrt firmware-tree component
  crit: exception
  conf: 0.97
  for: [shell, lua]
  # First-boot provisioning (preinit hooks, uci-defaults migrations),
  # disk-sector config tooling (bootdevice exports) and firmware-tree Lua
  # (nixio/luci bindings) speak platform-only idioms. dd provisioning,
  # account-database assembly and helper-script loading there are
  # firmware-assembly surface, and objectives reference this from `unless:`.
  any:
  - id: openwrt-preinit-hook-registration
  - id: openwrt-uci-defaults-script
  - id: openwrt-bootdevice-export
  - id: openwrt-lua-platform-require
