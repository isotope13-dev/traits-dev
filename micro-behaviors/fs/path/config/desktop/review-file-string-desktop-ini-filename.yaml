defaults:
  platforms: [windows]
  for: [binaries, scripts]

traits:
  - id: desktop-ini-filename
    desc: desktop.ini filename reference
    crit: notable
    conf: 0.86
    if:
      type: text
      exact: desktop.ini

  # The .NET optimization service DLL, named by the CLR's own mscorsvw.exe and
  # by installers. The sideload-target composites count it among several
  # system DLL names a host probes for.
