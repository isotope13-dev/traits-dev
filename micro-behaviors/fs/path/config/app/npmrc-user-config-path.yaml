defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: npmrc-user-config-path
    desc: npm user configuration file path
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, ruby, powershell, batch, shell]
    if:
      type: literal
      kind: string
      substr: .npmrc
    unless:
      - id: objectives/supply-chain/install-hook/extconf::ruby-extconf-dev-home-artifacts-probe
