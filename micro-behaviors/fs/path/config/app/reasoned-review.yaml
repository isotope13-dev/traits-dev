# Evidence-specific placement; matching does not imply attacker intent.
traits:
- platforms:
  - unix
  - windows
  for:
  - go
  id: go-cloud-config-path-reference
  desc: Go references cloud configuration locations
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: '[~/]\.(aws|azure)/|application_default_credentials\.json'
  unless:
  - id: well-known/tool/detection/bagel::bagel-go-module-path
  - id: metadata/package/documentation/claims::go-cloud-default-credentials-doc-marker
  - id: well-known/app/infrastructure/docker::source-tree
  - id: well-known/app/infrastructure/docker::docker-source-archive-context
  - id: well-known/app/infrastructure/ovhcloud-cli::github-source-tree-member-path
  - id: well-known/app/infrastructure/ovhcloud-cli::github-source-archive-zip-name
defaults: {}
