# Neutral observations separated from attacker or product inferences.
traits:
- id: rdp-file-reference
  desc: References an RDP connection configuration file
  crit: notable
  conf: 0.75
  for:
  - python
  - javascript
  - powershell
  - perl
  - pe
  - macho
  if:
    type: text
    regex: (^|[/\\"'])[\w.-]{1,120}\.rdp($|["']|[\s?#,)])
  platforms:
  - windows
  - unix
