# Per-user editor extension directories.
#
# An unpacked extension dropped here is loaded by the editor on next launch
# with no marketplace round-trip and no signature check, which is why implants
# reach for this path as a persistence surface. Constructing the path is
# neutral on its own -- extension managers, dotfile installers and CI caches
# all touch it -- so the objective composites supply the intent.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: editor-user-extensions-dir
    desc: Builds a per-user editor extensions path
    crit: notable
    conf: 0.85
    if:
      type: text
      # Matches both a literal path (~/.vscode/extensions) and a joined one
      # (path.join(os.homedir(), '.vscode', 'extensions')). Covers the VS Code
      # forks that reuse the same on-disk layout.
      regex: '\.(vscode|cursor|windsurf)[\w-]*["'']?\s*[,/\\]\s*["'']?extensions\b'
