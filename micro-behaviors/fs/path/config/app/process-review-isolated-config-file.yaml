defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, shell]
  crit: notable
  conf: 0.9

traits:
  - id: agent-config-file-in-temp-directory
    desc: Agent config file inside temp directory
    if:
      type: text
      regex: 'join\(\s*(tempDir|tmpDir)\s*,\s*[''"][\w.-]{0,20}(opencode|codex|gemini)[\w.-]{0,12}\.json'
      case_insensitive: true

