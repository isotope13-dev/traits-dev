# Package-manager or netrc configuration filename references.

defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95

composite_rules:
  - id: package-manager-or-netrc-config-path
    desc: Npm, PyPI, or netrc configuration path
    crit: notable
    conf: 0.9
    for: [binaries, scripts, source]
    any:
      - id: micro-behaviors/fs/path/config/app::npmrc-path-literal
      - id: micro-behaviors/fs/path/secret-config::pypirc-credentials-file
      - id: micro-behaviors/fs/path/secret-config::netrc
