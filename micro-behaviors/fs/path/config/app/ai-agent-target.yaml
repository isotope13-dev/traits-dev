composite_rules:
- id: ai-agent-config-artifact-reference
  desc: References local AI-agent configuration artifacts
  crit: notable
  conf: 0.96
  any:
  - id: micro-behaviors/fs/path/config/app::claude-root-config-artifact-path
  - id: micro-behaviors/fs/path/config/app::codex-sensitive-config-artifact-path
  - id: micro-behaviors/fs/path/config/app::copilot-config-artifact-path
  - id: micro-behaviors/fs/path/config/app::gemini-sensitive-config-artifact-path
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - source
  - javascript
  - typescript
  - python
  - powershell
  - shell
  - go
  - rust
  - c
  - cpp
