defaults:
  platforms: [windows, macos, linux]
  for: [javascript, typescript, python, pe, elf, macho, batch]
traits:
  - id: discord-local-state-path
    desc: Discord Local State configuration path
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: (?i)[/\\]discord(canary|ptb)?[/\\]+Local State([^A-Za-z0-9_]|$)
