defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: elex-configure-xml
    desc: "Elex configure.xml path marker"
    crit: component
    conf: 0.95
    if:
      type: text
      regex: 'configure[/\\]configure\.xml'
  - id: elex-downloader-id
    desc: Elex Downloader_id marker
    crit: component
    if:
      type: text
      exact: Downloader_id
  - id: elex-site-id
    desc: Elex Site_id marker
    crit: component
    if:
      type: text
      exact: Site_id
  - id: elex-extra-download-url
    desc: Elex Extra_download_url marker
    crit: component
    if:
      type: text
      exact: Extra_download_url
composite_rules:
  - id: elex-downloader-tracking-ids
    desc: "Elex downloader tracking IDs"
    crit: component
    conf: 0.95
    any:
      - id: elex-downloader-id
      - id: elex-site-id
      - id: elex-extra-download-url
  - id: configure-xml-tracking-composite
    desc: "configure.xml with tracking IDs"
    crit: component
    conf: 0.95
    all:
      - id: elex-configure-xml
      - id: elex-downloader-tracking-ids
