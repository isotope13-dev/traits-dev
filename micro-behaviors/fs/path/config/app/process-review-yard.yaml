defaults:
  platforms: [unix, windows]
  for: [scripts, dockerfile, github-actions]
  crit: notable
  conf: 0.9
  attack: T1059

traits:
  - id: yard-options-file-path
    desc: YARD options file path reference
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '(^|[^\w.])\.yardopts\b'

  # The directive as it appears when a program writes the options file: at the
  # start of a line, or at the start of a string literal holding that line.
  # The loaded path is left unconstrained because a generator interpolates the
  # filename it just wrote; `.yardopts` proximity is what makes this precise.
