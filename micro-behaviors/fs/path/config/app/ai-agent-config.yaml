# Configuration artifacts created by local AI agents. These path
# atoms do not assert collection intent; objective composites combine them
# with file reads and cross-vendor targeting.
# Path separators and adjacent quoted join operands describe the same stores.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source]
  crit: notable
  conf: 0.94

traits:
  - id: claude-root-config-artifact-path
    desc: Claude Code root configuration artifact path
    if:
      type: text
      regex: '(?i)(^|[~\\/"''])\.claude\.json\b'

  - id: codex-sensitive-config-artifact-path
    desc: Codex configuration artifact path
    if:
      type: text
      regex: '(?i)\.codex([/\\]{1,2}|["'']\s*[,/]\s*["''])(config\.toml|\.env)\b'

  - id: copilot-config-artifact-path
    desc: GitHub Copilot configuration artifact path
    if:
      type: text
      regex: '(?i)\.copilot([/\\]{1,2}|["'']\s*[,/]\s*["''])config\.json\b'

  - id: gemini-sensitive-config-artifact-path
    desc: Gemini CLI configuration artifact path
    if:
      type: text
      regex: '(?i)\.gemini([/\\]{1,2}|["'']\s*[,/]\s*["''])(config\.json|\.env)\b'

  - id: codeium-config-artifact-path
    desc: Codeium configuration artifact path
    if:
      type: text
      regex: '(?i)\.codeium([/\\]{1,2}|["'']\s*[,/]\s*["''])config\.json\b'

  - id: verity-fpeek-legacy-config-migration
    desc: Legacy verity or fpeek CLI config path
    if:
      type: text
      regex: '\.(verity|fpeek|pythom)/config\.json'
