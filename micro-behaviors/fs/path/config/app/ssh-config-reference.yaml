traits:
  - id: ssh-config-path-reference
    desc: SSH configuration file path reference
    for: [shell, python, javascript, powershell, c, cpp]
    platforms: [linux, macos, windows]
    crit: notable
    conf: 0.5
    if:
      type: text
      # A following colon is a Docker bind-mount destination
      # (`config:/root/.ssh/config:z`), not a path being read.
      regex: '\.ssh/config(["''\s,);]|$)'
    unless:
    - id: metadata/package/testing/
    - id: well-known/tool/detection/llm-scanner/
    - id: well-known/lib/runtime/scripted/jruby
    - id: "metadata/file/naming::test-directory-component"
    downgrade:
      any:
      - id: micro-behaviors/communications/ssh/connect::openssh
      - id: well-known/tool/sysadmin/kubernetes
      - type: text
        regex: '(?i)~?/\.ssh/config'
