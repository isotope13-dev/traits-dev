defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: npmrc-path-literal
    desc: npm user configuration file path literal
    for:
    - binaries
    - scripts
    - python
    - java
    - class
    - kotlin
    - c
    - cpp
    - go
    - rust
    - javascript
    - typescript
    - groovy
    if:
      type: literal
      regex: (^|[/~\\\\])\.npmrc\b
    unless:
    - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context
    - id: objectives/supply-chain/install-hook/extconf::ruby-extconf-dev-home-artifacts-probe
