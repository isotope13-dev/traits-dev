# A named configuration file takes precedence over its app-data ancestor.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.85
traits:
  - id: nordvpn-config
    desc: NordVPN user.config file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: NordVPN[/\\].{0,50}user\.config
