defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, source]

traits:
  # Epic-compatible launchers and migration tools legitimately read these
  # locations. The path alone establishes local application data access, not
  # credential collection.
  - id: epic-launcher-local-data-path
    desc: Epic Games Launcher data path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)EpicGamesLauncher[\\/](Saved[\\/])?(Config|WebCache|Data)'
