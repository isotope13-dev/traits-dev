defaults:
  platforms: [windows, unix]
  for: [python, javascript, shell, go, pe]

composite_rules:
- id: ide-config-directory-reference
  desc: References VS Code or JetBrains IDE configuration directories
  crit: notable
  conf: 0.85
  any:
  - id: vscode-workspace-dir
  - id: jetbrains-idea-dir
  unless:
  - id: ide-directory-ignore-list
  - id: well-known/tool/development/agent/sap-ai-dev-toolkit::vsp-packaged-binary-basename
