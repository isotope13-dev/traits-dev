defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: suspicious
traits:
- id: js-env-home-cred-cargo
  desc: Cargo credentials path reference
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (^|[/\\~'"\s])[/\\]cargo[/\\]credentials\b
- id: js-env-home-cred-gem
  desc: Gem credentials path reference
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (^|[/\\~'"\s])[/\\]gem[/\\]credentials\b
