defaults:
  attack: T1546
  platforms:
    - windows
  for: [scripts, binaries]
traits:
  - id: pirch-events-config
    desc: pIRCh events.ini configuration path
    crit: notable
    conf: 0.85
    if:
      type: text
      case_insensitive: true
      # `C:\pirch98\events.ini` is the pIRCh IRC client's event script;
      # worms rewrite it so the client DCC-sends a planted copy to every
      # channel joiner. The separators around it are frequently chr()-built,
      # so match the client, config and extension tokens with gaps.
      regex: 'pirch[\s\S]{0,24}events[\s\S]{0,16}ini'
