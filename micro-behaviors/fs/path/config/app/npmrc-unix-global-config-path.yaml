defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: npmrc-unix-global-config-path
    desc: Unix global npm configuration path
    crit: notable
    conf: 0.92
    for: [javascript, typescript, python, ruby, powershell, batch, shell]
    if:
      type: literal
      kind: string
      substr: /etc/npmrc
