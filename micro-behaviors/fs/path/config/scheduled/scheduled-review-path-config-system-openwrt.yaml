defaults:
  platforms:
  - openwrt
  for:
  - scripts
  - binaries
  - pyc
  - source
  crit: notable
  conf: 0.88

traits:
- for:
  - scripts
  - source
  - elf
  - pyc
  - -perl
  id: openwrt-root-crontab-path
  desc: References OpenWrt root crontab path
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: /etc/crontabs/root
