defaults:
  for:
  - scripts
  - binaries
  platforms:
  - unix
  - windows
  crit: notable

traits:
- id: etc-cron-path
  desc: Reference to the /etc/cron directory
  conf: 0.7
  if:
    type: text
    regex: /etc/cron(/|$)
  unless:
  - id: metadata/file/format/
  - id: metadata/file/catalog/pattern-rules::secret-rule-category-declaration
  - id: metadata/file/catalog/pattern-rules::secret-rule-pattern-example-block

composite_rules:
- id: cron-configuration-path-reference
  desc: Reference to a system cron configuration path
  conf: 0.66
  any:
  - id: micro-behaviors/fs/path/config/scheduled::etc-cron-path
  - id: micro-behaviors/fs/path/config/scheduled::var-spool-cron-path
  - id: micro-behaviors/fs/path/config/scheduled::cron-d-path-reference
  unless:
  - id: well-known/tool/sysadmin/busybox::busybox-binary
  - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
  - id: well-known/tool/development/agent/kilocode::kilo-code-native-runtime
  - id: well-known/app/development/reg-devshell::developer-shell-application
  - id: metadata/path/directory::test-directory-component
