defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: micro-behaviors/fs/path/config/scheduled::cron-paths
    desc: Cron configuration paths
    crit: component
    any:
      - id: micro-behaviors/fs/path/config/scheduled::config-crontab
      - id: micro-behaviors/fs/path/config/scheduled::var-spool-cron-path
      - id: micro-behaviors/fs/path/config/scheduled::cron-d-path-reference
