defaults:
  platforms:
  - windows
  for:
  - pe
  - batch
  - powershell
  - vbs

traits:
  - id: bsd-at-job-spool-path
    desc: BSD at-job spool path
    crit: notable
    conf: 0.92
    platforms: [unix]
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)/var/at/(jobs|spool)'

