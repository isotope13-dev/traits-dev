defaults:
  platforms:
  - unix
  - windows
  for:
  - elf

traits:
  - id: config-crontab
    desc: Reference to /etc/crontab
    crit: notable
    conf: 0.78
    for: [scripts, binaries, javascript]
    platforms: [unix]
    if:
      type: text
      substr: /etc/crontab
  - id: cron-d-path-reference
    desc: Reference to /etc/cron.d system path
    crit: notable
    conf: 0.7
    for: [scripts, source, binaries]
    platforms: [unix]
    if:
      type: text
      regex: '/etc/cron\.d(/|$)'
  - id: cron-periodic-directory-path
    desc: Reference to a periodic /etc/cron job directory
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    platforms: [unix]
    if:
      type: text
      regex: '/etc/cron\.(daily|hourly|weekly|monthly)(/|$)'
  - id: root-crontab-spool-path
    desc: Reference to root crontab spool path
    crit: notable
    conf: 0.86
    for: [scripts, binaries]
    platforms: [unix]
    if:
      type: text
      substr: /var/spool/cron/crontabs/root
  - id: var-spool-cron-path
    desc: Reference to user crontab spool path
    crit: notable
    conf: 0.7
    for: [scripts, binaries, source]
    platforms: [unix]
    if:
      type: text
      substr: /var/spool/cron
