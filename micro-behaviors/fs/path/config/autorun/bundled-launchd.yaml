# Bundle paths describe where a job definition lives, not registration or
# unwanted reactivation. Keep the reference visible in ordinary app bundles.
defaults:
  platforms: [macos]
  for: [scripts, binaries]
  crit: notable
  conf: 0.88

traits:
  - id: app-bundled-launchd-path-reference
    desc: References app-bundled launchd job directory
    if:
      type: text
      regex: 'Contents/Library/Launch(Daemons|Agents)'
