# This is the Library-qualified path fragment, distinct from the bare
# LaunchDaemons directory-name reference. Neither proves job installation.
defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
- id: library-launchdaemons-path
  desc: References Library/LaunchDaemons path
  crit: notable
  conf: 0.99
  if:
    type: text
    substr: Library/LaunchDaemons
