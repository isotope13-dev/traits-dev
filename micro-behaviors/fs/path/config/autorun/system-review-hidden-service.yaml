# A path reference proves neither registration nor durable activation.
# Preserve the original unix/zig/elf scope while moving the observation.
defaults:
  platforms: [unix]
  for: [zig, elf]

traits:
  - id: hidden-systemd-service-unit-path
    desc: Hidden dot-named systemd service unit path
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '/etc/systemd/system/\.[A-Za-z0-9._-]+\.service'

