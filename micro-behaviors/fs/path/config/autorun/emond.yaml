defaults:
  platforms: [macos]
  for: [scripts, binaries]
traits:
- id: emond-rule-path
  desc: emond rule or client configuration path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '/etc/emond\.d|/var/db/emondClients|emond\.plist'
  unless:
  - id: well-known/app/utility/cmdchamp/
  - id: metadata/file/naming::generated-attack-map-context
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
