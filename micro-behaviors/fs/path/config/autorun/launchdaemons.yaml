# A directory-name reference does not establish a service operation.
defaults:
  platforms: [unix, ios]
  for: [scripts, c, objc, java, macho, plist, class]
  crit: notable
  conf: 0.85
traits:
  - id: launchdaemons-path
    desc: macOS LaunchDaemons directory-name reference
    if:
      type: text
      substr: LaunchDaemons
    unless:
      - id: well-known/tool/development/mobile/ipsw
