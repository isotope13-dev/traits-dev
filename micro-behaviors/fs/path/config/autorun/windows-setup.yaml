defaults:
  platforms: [windows]
  for: [scripts, source, binaries]

traits:
  - id: windows-setup-error-handler-path
    desc: References Windows Setup ErrorHandler.cmd script
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)[\\/]Setup[\\/]+Scripts[\\/]+ErrorHandler\.cmd\b'
