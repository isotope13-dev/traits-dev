defaults:
  platforms: [unix, windows]
  for: [scripts, source, elf]
traits:
  - id: build-tool-startup-script-directory
    desc: Build tool startup-script directory
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(init\.groovy\.d|\.gradle[/\\]init\.d)\b'

  - id: build-tool-startup-script-file
    desc: Names a file in a startup-script directory
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(init\.groovy\.d|\.gradle[/\\]init\.d)[/\\][\w.-]{1,40}'

