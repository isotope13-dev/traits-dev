defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
traits:
  - id: etc-group
    desc: /etc/group group database
    if:
      type: text
      substr: /etc/group
  - id: etc-gshadow
    desc: /etc/gshadow group passwords
    conf: 0.85
    if:
      type: text
      substr: /etc/gshadow
