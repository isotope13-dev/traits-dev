defaults:
  platforms: [unix, windows]
  for: [php, c, cpp, python, shell]

traits:
  # One file per trait: the previous `(my\.cnf|php-fpm\.conf)` alternation was
  # named "SQL database configuration path" even though php-fpm.conf is a PHP
  # process-manager pool file, so half of every match was mis-described --
  # and MariaDB's own SST helpers, which legitimately read my.cnf, were
  # reported as touching a web config.
  - id: mysql-config-path
    desc: MySQL/MariaDB server config path (my.cnf)
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: '(?i)\bmy\.cnf\b'

  - id: php-fpm-config-path
    desc: PHP-FPM process manager config path
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: '(?i)\bphp-fpm\.conf\b'

  - id: php-fpm-pool-config-path
    desc: PHP-FPM pool config path (www.conf)
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: '(?i)\bwww\.conf\b'

  - id: wordpress-config-path
    desc: WordPress wp-config.php credential file path
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: '(?i)\bwp-config\.php\b'

composite_rules:
  - id: database-config-path
    desc: Database or web application config path
    crit: component
    conf: 0.8
    any:
      - id: mysql-config-path
      - id: php-fpm-config-path
      - id: php-fpm-pool-config-path
      - id: wordpress-config-path
