# Installation-relative config paths of PHP web stores and CMSes. Each holds the
# site's database credentials. One path is ordinary (an installer, a migration
# tool); several distinct products' paths in one file is a search list.
defaults:
  conf: 0.85
  platforms: [unix, windows]
  for: [php, python, shell, javascript]
  crit: notable

traits:
  - id: magento-env-config-path
    desc: Magento app/etc/env.php config path
    if:
      type: string_literal
      regex: '(?i)\bapp/etc/env\.php\b'

  - id: drupal-settings-config-path
    desc: Drupal sites/default/settings.php path
    if:
      type: string_literal
      regex: '(?i)\bsites/default/settings\.php\b'

  - id: prestashop-config-path
    desc: PrestaShop config parameters/settings path
    if:
      type: string_literal
      regex: '(?i)\bconfig/(parameters|settings\.inc)\.php\b'

  - id: joomla-configuration-path
    desc: Joomla configuration.php path
    if:
      type: string_literal
      regex: '(?i)(^|/)configuration\.php$'

composite_rules:
  - id: multi-cms-config-paths
    desc: Lists config paths of several web CMSes
    conf: 0.9
    needs: 3
    any:
      - id: wordpress-config-path
      - id: magento-env-config-path
      - id: drupal-settings-config-path
      - id: prestashop-config-path
      - id: joomla-configuration-path
