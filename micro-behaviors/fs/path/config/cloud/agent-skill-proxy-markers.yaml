defaults:
  platforms: [windows, linux]
  for: [python, markdown]
traits:
  - id: proxy-cloud-credential-path
    desc: Cloud credential path marker
    # Composite vocabulary like the other legs here: an `~/.aws/credentials`
    # mention is standard AWS client documentation (pyarrow's S3 module), not
    # proxy-forwarding evidence on its own.
    crit: component
    conf: 0.97
    unless:
      - id: well-known/lib/cloud/botocore::aws-python-sdk-source
    if:
      type: text
      regex: '(?i)[/\\]\.aws[/\\]credentials'

