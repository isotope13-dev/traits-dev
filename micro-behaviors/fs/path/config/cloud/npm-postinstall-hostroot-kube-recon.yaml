defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: hostroot-kube-recon
  desc: Postinstall references hostroot Kubernetes paths
  crit: suspicious
  conf: 0.94
  if:
    type: value
    path: scripts.postinstall
    regex: "/tmp/hostroot/(etc/kubernetes|var/lib/kubelet/pods)"
