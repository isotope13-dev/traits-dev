defaults:
  platforms: [linux]
  for: [javascript]
  crit: notable
  conf: 0.94

traits:
  - id: dbus-service-directory-text
    desc: D-Bus service-directory path text
    if:
      type: text
      regex: 'dbus-1.{0,120}services'
    unless:
      - id: metadata/package/files/bsd::pkgsrc-plist-ident
      - id: metadata/package/files/bsd::pkgsrc-plist-basename
      - id: metadata/file/extension/identity::markdown-file-basename
      - type: path
        regex: '\.(pro|pri|build|mk|cmake)$|(^|[\\/])(CMakeLists\.txt|Makefile)$'
