defaults:
  platforms: [linux]
  for: [scripts, binaries, javascript]

traits:
- id: dbus-service-path
  desc: D-Bus service activation path
  crit: notable
  conf: 0.84
  if:
    type: text
    regex: '/(etc|usr/share|\.local/share)/dbus-1/(system-)?services/[^\s]{1,120}\.service\b'

- id: dbus-user-service-path
  desc: Per-user D-Bus session service path
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '\.local/share/dbus-1/services/[^\s]{1,120}\.service\b'
