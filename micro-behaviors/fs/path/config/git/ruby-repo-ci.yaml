defaults:
  platforms: [unix]
  for: [ruby]
traits:
  - id: ruby-repository-and-ci-config-paths
    desc: References Git and CI configuration paths
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\.git/config[\s\S]{0,180}\.github/workflows'
    unless:
      - id: metadata/package/testing/presence/harness::ruby-test-file
      - id: metadata/path/directory::test-directory-component
