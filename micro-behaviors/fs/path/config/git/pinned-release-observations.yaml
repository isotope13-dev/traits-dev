traits:
- crit: notable
  conf: 0.78
  id: post-merge-hook-name
  desc: References Git post-merge hook name
  if:
    type: text
    # "post-merge" also names ordinary merge-aftermath steps (a video
    # pipeline's post-merge stage); require the quoted hook-name form or a
    # hooks/hook context so unquoted prose stays unmatched.
    regex: '["'']post-merge["'']|hooks[^\n]{0,20}post-merge|post-merge[^\n]{0,20}hook'
- crit: notable
  conf: 0.78
  id: post-checkout-hook-name
  desc: References Git post-checkout hook name
  if:
    type: text
    # "post-checkout" also describes after-the-checkout steps; require the
    # quoted hook-name form or a hooks/hook context.
    regex: '["'']post-checkout["'']|hooks[^\n]{0,20}post-checkout|post-checkout[^\n]{0,20}hook'
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  - shell
