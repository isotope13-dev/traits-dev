defaults:
  crit: notable
  platforms: [unix, windows]
  for: [shell, scripts, source]

traits:
  - id: git-repository-config-path
    desc: References a Git repository configuration path
    conf: 0.9
    if:
      type: text
      regex: '(^|[\\/])\.git[\\/]config\b'
  - id: git-repository-head-path
    desc: Constructs a path to .git/HEAD
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'path\.join\s*\([^)]{0,160}["'']\.git["''][^)]{0,80}["'']HEAD["'']'
  - id: git-hooks-path
    desc: Constructs a Git hooks path
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: "path\\.join\\([^;\\n]{0,120}['\"]\\.git['\"][^;\\n]{0,120}['\"]hooks['\"]"
  - id: git-precommit-staged-files-check
    desc: Git pre-commit staged files check
    conf: 0.95
    for: [shell]
    if:
      type: text
      substr: '_STAGED_FILES=$(git diff --cached'
  - id: git-hooks-dir-join
    desc: Joins hooks dir onto Git directory
    conf: 0.85
    for: [javascript, typescript]
    # Complements git-hooks-path, which needs '.git' and 'hooks' in one join.
    # Code that first discovers a .git directory and keeps it in a variable
    # joins only the 'hooks' segment later.
    if:
      type: text
      regex: "path\\.join\\(\\s*\\w*(git|Git|GIT)\\w*\\s*,\\s*['\"]hooks['\"]"

  - id: git-project-hooks-directory
    desc: Constructs a repository-managed .githooks path
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: "(path\\.)?join\\(\\s*\\w+\\s*,\\s*['\"]\\.githooks['\"]\\s*,\\s*['\"]pre-commit['\"]"
  # A commit/push-time secret scanner documents its install into a git hook
  # (`.git/hooks/pre-commit`, `.git/hooks/pre-push`). The hook path alone is
  # ordinary installer documentation, not detection-tool identity.
  - id: git-hook-install-doc
    desc: Documents installing into a git hook
    conf: 0.94
    ref: sha256:15b68af14b2721adc97193944f548981b711137a036afa627c6baf02d74ed47a
    for: [python, shell]
    if:
      type: text
      regex: '\.git/hooks/(pre-commit|pre-push|update|post-merge)'
