# Drive-qualified path of a Windows or DOS boot-chain file. Naming one from
# a script is the target of a wipe or tamper step, not ordinary file handling.
traits:
  - id: boot-loader-drive-path
    desc: References drive-qualified boot loader file
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [batch, powershell, vbs]
    if:
      type: text
      regex: '(?i)\b[a-z]:\\(ntldr|ntdetect\.com|boot\.ini|bootmgr|io\.sys|msdos\.sys)\b'
