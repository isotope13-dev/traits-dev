# Drive-qualified path of a DOS system file (IO.SYS, MSDOS.SYS, COMMAND.COM)
# stored as an ASCIIZ operand in a small COM image. Written as YARA so the
# string is evaluated on images under the engine's size floor.
traits:
  - id: dos-boot-file-drive-path
    desc: References drive-qualified DOS boot file
    crit: notable
    conf: 0.9
    platforms: [windows, unix]
    for: [dos_com, data]
    size_max: 4096
    if:
      type: yara
      source: |
        rule dos_boot_file_drive_path {
          meta:
            filetypes = "dos_com,data"
          strings:
            $io = /[a-z]:\\(io|msdos|command)\.(sys|com)\x00/ nocase
          condition:
            $io
        }
