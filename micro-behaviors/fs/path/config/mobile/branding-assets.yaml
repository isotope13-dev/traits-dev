defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85

traits:
  - id: ios-splashscreen-imageset
    desc: iOS splashscreen image-set filename reference
    if:
      type: text
      substr: Splashscreen.imageset
  - id: android-launcher-mipmap-density
    desc: Android launcher mipmap density name reference
    if:
      type: text
      substr: mipmap-xxxhdpi
