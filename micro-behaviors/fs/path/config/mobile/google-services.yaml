defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85
traits:
  - id: android-google-services-config
    desc: Android Google services filename reference
    if:
      type: text
      substr: "google-services.json"
  - id: ios-google-service-info-config
    desc: iOS Google services filename reference
    if:
      type: text
      substr: "GoogleService-Info.plist"
