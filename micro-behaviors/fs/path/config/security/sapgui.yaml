defaults:
  platforms: [windows]
  for: [powershell, vbs, python, javascript, typescript, csharp, batch]
  crit: notable

traits:
  - id: sapgui-saprules-config-path
    desc: References SAP GUI saprules.xml policy file
    conf: 0.93
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(^|[/\\"''])saprules\.xml\b'
