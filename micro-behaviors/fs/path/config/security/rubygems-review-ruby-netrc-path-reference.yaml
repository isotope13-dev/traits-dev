defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-netrc-path-reference
    desc: Ruby .netrc path reference
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      substr: .netrc
    unless:
      # Listed in sensitive-file blocklists, not targeted for theft.
      - type: text
        regex: '(?i)sensitive_patterns|sensitive_file\?'
      - id: well-known/lib/format/ruby-netrc::netrc-library-context
      - id: well-known/lib/format/ruby-netrc::netrc-gem-path
      - id: well-known/lib/format/ruby-netrc::netrc-class
