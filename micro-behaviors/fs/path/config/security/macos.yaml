defaults:
  crit: notable
  platforms: [macos]
  for: [scripts, binaries]

traits:
  - id: authorizationdb-database-path
    desc: macOS AuthorizationDB database path
    conf: 0.9
    if:
      type: text
      substr: '/var/db/auth.db'

  - id: tcc-database-filename
    desc: macOS TCC database filename
    conf: 0.88
    if:
      type: text
      substr: TCC.db
