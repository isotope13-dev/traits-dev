defaults:
  platforms: [macos]
  for: [scripts, binaries]

traits:
  - id: authorizationdb-database-path
    desc: macOS AuthorizationDB database path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/var/db/auth\.db'

  - id: tcc-database-filename
    desc: macOS TCC database filename
    crit: notable
    conf: 0.88
    if:
      type: text
      substr: TCC.db
