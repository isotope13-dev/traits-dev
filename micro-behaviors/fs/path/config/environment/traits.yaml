# References to dotenv-style application configuration files.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
  conf: 0.9

traits:
  - id: env-file-path
    desc: References dotenv configuration file path
    if:
      type: text
      regex: '(^|/)\.env($|\.)'
  - id: env-example-file-name
    desc: References dotenv example file name
    # package.json scripts routinely name the sample env file (e.g. a setup
    # step copying `.env.example`), so this stays reachable to composites
    # that also fire on manifests.
    for: [scripts, package.json]
    if:
      type: text
      substr: .env.example

  - id: node-dotenv-file-path
    desc: Node constructs a dotenv file path
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'path\.join\s*\([^\n]{0,160}["'']\.env["'']\s*\)'
  - id: dotenv-config-path
    desc: Configures dotenv with an explicit path
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: "dotenv\\.config\\(\\{\\s*path:"
