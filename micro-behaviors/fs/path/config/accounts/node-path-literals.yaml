defaults:
  platforms: [unix]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: node-passwd-path-reference
    desc: Node references passwd file path
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: /etc/passwd
  - id: node-shadow-path-reference
    desc: Node references shadow file path
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: /etc/shadow
