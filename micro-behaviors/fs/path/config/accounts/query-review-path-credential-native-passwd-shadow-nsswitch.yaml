defaults:
  platforms:
  - unix
  for:
  - c
  - cpp
  - objc
  - elf

traits:
  - id: native-passwd-shadow-nsswitch-paths
    desc: Passwd, shadow and nsswitch paths
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '/etc/passwd[\s\S]{0,180}/etc/shadow[\s\S]{0,180}/etc/nsswitch\.conf'
