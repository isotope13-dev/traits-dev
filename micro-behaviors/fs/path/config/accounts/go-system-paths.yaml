defaults:
  platforms: [unix]
  for: [go, elf]

traits:
  - id: go-sudoers-file-path
    desc: Go sudoers file path reference
    crit: notable
    conf: 0.94
    for: [go]
    if:
      type: text
      # A sudoers policy file is account configuration, not a credential.
      regex: '/etc/sudoers([^.\w]|$)'
    unless:
      - id: well-known/tool/detection/clawker::source-tree
      - type: text
        substr: "--package-name=libc"
