defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]

traits:
  - id: unix-sensitive-unlock-targets
    desc: Account and privilege config path references
    crit: notable
    conf: 0.94
    if:
      # Require actual source literals; comments and documentation often list
      # these paths while a defensive monitor merely records them.
      type: literal
      kind: string
      regex: '/etc/shadow[\s\S]{0,180}/etc/passwd[\s\S]{0,180}/etc/sudoers'
composite_rules:
  - id: unix-sensitive-path-unlock-targets
    desc: Account and privilege config path references
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/os/privilege/paths::etc-shadow
      - id: micro-behaviors/fs/path/config/accounts::etc-passwd
      - id: micro-behaviors/fs/path/config/privesc::etc-sudoers
