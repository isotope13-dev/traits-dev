defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.85

traits:
  - id: database-backup-sql-path
    desc: Database backup SQL path
    if:
      type: text
      regex: '(?i)(^|[/\s"''=])[A-Za-z0-9_.-]*(backup|dump)\.sql\b'

  # A backup pathname alone says nothing about how the SSH configuration is
  # changed or whether access is enabled. Backdoor intent requires separate
  # modification and authentication evidence.
  - id: sshd-config-backup-path
    desc: SSH daemon backup config path
    conf: 0.9
    for: [shell, python]
    if:
      type: text
      regex: 'sshd_config\.(bak|backup|bak\.[0-9])\b'
    unless:
      - id: well-known/app/system/startos/
      - id: well-known/tool/detection/security-remediation::openscap-cis-remediation-script
