defaults:
  platforms: [routeros, appliance]
  for: [c, cpp]

traits:
  - id: routeros-flash-backup-path
    desc: RouterOS flash backup path
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /var/log/flash/backup.rsc

  - id: routeros-dot-config-backup-path
    desc: RouterOS dot config backup path
    crit: suspicious
    conf: 0.92
    platforms: [routeros, appliance, unix]
    for: [java, kotlin, rust, elf]
    if:
      type: text
      substr: /.config/backup.rsc
