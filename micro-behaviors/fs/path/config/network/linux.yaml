defaults:
  platforms:
    - unix
    - windows
  for: [elf]
traits:
  - id: config-hosts
    desc: References /etc/hosts
    crit: notable
    conf: 0.66
    for: [scripts, binaries, c, cpp]
    if:
      type: text
      substr: /etc/hosts
  - id: config-hosts-bytecode
    # JVM constant-pool probe: a raw hex hit for this ASCII literal only means
    # "bytecode references it" inside a class/jar. Bounded so it cannot claim a
    # hundreds-of-megabyte container (a FreeBSD install ISO reached this rule and
    # matched the literal in ordinary files it carries); no real class or jar is
    # this large.
    size_max: 67108864
    desc: Reference to /etc/hosts in JVM bytecode
    crit: notable
    conf: 0.86
    for: [class]
    if:
      type: hex
      pattern: 2F 65 74 63 2F 68 6F 73 74 73
    unless:
      - type: hex
        pattern: CF FA ED FE
      - id: metadata/package/manager::go-module-source-archive
  - id: hidden-hosts-backup-bytecode
    desc: Hidden hosts backup path in JVM bytecode
    crit: notable
    conf: 0.86
    for: [class]
    if:
      type: hex
      pattern: 2F 74 6D 70 2F 2E 68 6F 73 74 73 2E 62 61 6B
    unless:
      - type: hex
        pattern: CF FA ED FE
  - id: config-resolv-text
    desc: Resolver path text
    crit: component
    conf: 0.9
    for: [scripts, binaries, source]
    platforms: [unix, android]
    if:
      type: text
      exact: /etc/resolv.conf
  - id: config-resolv-shell-literal
    desc: Shell assigns resolver configuration path
    crit: component
    conf: 0.95
    for: [shell]
    platforms: [unix, android]
    if:
      type: tree-sitter
      language: shell
      query: |
        ((variable_assignment value: (string (string_content) @path))
          (#eq? @path "/etc/resolv.conf"))
  - id: config-resolv-xor
    desc: XOR-obfuscated /etc/resolv.conf path
    crit: notable
    conf: 0.82
    if:
      type: hex
      section: .rodata
      pattern: 7B 31 20 37 7B 26 31 27 3B 38 22 7A 37 3B 3A 32 54
  - id: config-resolv-xor62
    desc: XOR-obfuscated /etc/resolv.conf path
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .rodata
      pattern: 4D 07 16 01 4D 10 07 11 0D 0E 14 4C 01 0D 0C 04 62
  - id: config-resolv-xor18
    desc: XOR-obfuscated /etc/resolv.conf path
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .rodata
      pattern: 37 7D 6C 7B 37 6A 7D 6B 77 74 6E 36 7B 77 76 7E

composite_rules:
  - id: config-resolv
    desc: References /etc/resolv.conf
    crit: notable
    conf: 0.9
    for: [scripts, binaries, source]
    platforms: [unix, android]
    any:
      - id: config-resolv-text
      - id: config-resolv-shell-literal
    unless:
      - id: metadata/lang/compiler/systems::go-binary
