defaults:
  crit: notable
  platforms: [unix, windows]
  for: [scripts, binaries, jar, zip]

composite_rules:
  - id: hosts-file-path
    desc: Hosts file path reference
    conf: 0.8
    any:
      - id: micro-behaviors/fs/path/config/network::windows-hosts-file
      - id: micro-behaviors/fs/path/config/network::windows-hosts-relative-path
      - id: micro-behaviors/fs/path/config/network::windows-hosts-template-path
      - id: micro-behaviors/fs/path/config/network::windows-hosts-backup-template
      - id: micro-behaviors/fs/path/config/network::config-hosts
      - id: micro-behaviors/fs/path/config/network::managed-windows-hosts-path-components

