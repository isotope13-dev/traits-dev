defaults:
  platforms: [android, unix]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.98

traits:
  - id: android-wifi-config-store
    desc: Android saved Wi-Fi configuration store path
    if:
      type: text
      regex: '/data/misc/(apexdata/com\.android\.wifi|apns/[0-9]+)/WifiConfigStore\.xml\b'
