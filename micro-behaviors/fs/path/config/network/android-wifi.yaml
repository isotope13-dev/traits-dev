defaults:
  platforms: [android, unix]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.98

traits:
  - id: android-wifi-config-store
    desc: Android saved Wi-Fi configuration store path
    if:
      type: text
      # apexdata/com.android.wifi is the post-11 APEX location; wifi/ is the
      # legacy store used through Android 10.
      regex: '/data/misc/(apexdata/com\.android\.wifi|apns/[0-9]+|wifi)/WifiConfigStore\.xml\b'
