defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.95

traits:
  - id: powershell-profile-variable
    desc: References the PowerShell profile variable
    if:
      type: symbol
      kind: identifier
      exact: $PROFILE

  - id: powershell-profile-filename
    desc: References a PowerShell profile filename
    if:
      type: literal
      kind: string
      regex: '(?i)(Microsoft\.PowerShell_profile|profile)\.ps1$'

composite_rules:
  - id: powershell-profile-reference
    desc: References a PowerShell profile path
    any:
      - id: powershell-profile-variable
      - id: powershell-profile-filename
