# Bare references to a user shell rc filename. Relocated from
# objectives/impact/system/power/ (2026-07), where a `word: bashrc` match was
# filed with the reboot/shutdown sabotage rules: every installer, dotfile
# manager and distro maintainer script that mentions .bashrc (Debian
# base-files.postinst installs /root/.bashrc) was collecting system-power
# impact evidence. Naming a shell rc file is a path reference and nothing more;
# the sabotage intent comes from the writing/appending legs in the composites
# that reference these, which stay in their objective directories.
defaults:
  conf: 0.98
  platforms: [unix, windows]
  for: [javascript, typescript, shell]

traits:
  - id: bashrc-filename
    desc: .bashrc shell profile filename
    crit: notable
    unless:
      - id: well-known/app/ai/gateway/opencode-router
    if:
      type: text
      word: bashrc

  - id: bashrc-filename-encoded
    desc: Decoded .bashrc shell profile filename
    crit: component
    if:
      type: encoded
      exact: .bashrc

  - id: bash-profile-filename
    desc: .bash_profile shell profile filename
    crit: notable
    if:
      type: text
      word: bash_profile

  - id: zshrc-filename
    desc: .zshrc shell profile filename
    crit: notable
    unless:
      - id: well-known/app/ai/gateway/opencode-router
    if:
      type: text
      word: zshrc

  - id: zshrc-filename-encoded
    desc: Base64-encoded .zshrc shell profile filename
    crit: notable
    if:
      # The decoder intentionally ignores eight-byte Base64 candidates, so
      # match this filename's complete and invariant Base64 representation.
      type: text
      substr: LnpzaHJj

  - id: cshrc-filename
    desc: .cshrc shell profile filename
    crit: notable
    for: [binaries, scripts]
    if:
      type: text
      regex: '\.cshrc\b'

  - id: bash-rc-path-text
    desc: References a .bashrc or .bash_profile path
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: \.(bashrc|bash_profile)\b
    unless:
      - id: metadata/package/files/ecosystem::conda-shell-activation-layout

  - id: sh-login-profile-path-text
    desc: References a .bash_login or .profile path
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: \.(bash_login|profile)\b
    unless:
      - id: metadata/package/files/ecosystem::conda-shell-activation-layout

  - id: zsh-rc-path-text
    desc: References a .zshrc or .zprofile path
    crit: component
    conf: 0.82
    if:
      type: text
      regex: \.(zshrc|zprofile)\b
    unless:
      - id: metadata/package/files/ecosystem::conda-shell-activation-layout

composite_rules:
  - id: shell-rc-target-text
    desc: Shell RC file path reference
    crit: component
    conf: 0.82
    any:
      - id: bash-rc-path-text
      - id: sh-login-profile-path-text
      - id: zsh-rc-path-text
    unless:
      - id: metadata/package/files/ecosystem::conda-shell-activation-layout

