# Bare references to a user shell rc filename. Relocated from
# objectives/impact/system/power/ (2026-07), where a `word: bashrc` match was
# filed with the reboot/shutdown sabotage rules: every installer, dotfile
# manager and distro maintainer script that mentions .bashrc (Debian
# base-files.postinst installs /root/.bashrc) was collecting system-power
# impact evidence. Naming a shell rc file is a path reference and nothing more;
# the sabotage intent comes from the writing/appending legs in the composites
# that reference these, which stay in their objective directories.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, shell]

traits:
  - id: bashrc-filename
    desc: .bashrc shell profile filename
    crit: component
    conf: 0.98
    unless:
      - id: well-known/app/opencode-router
    if:
      type: text
      word: bashrc

  - id: zshrc-filename
    desc: .zshrc shell profile filename
    crit: component
    conf: 0.98
    unless:
      - id: well-known/app/opencode-router
    if:
      type: text
      word: zshrc
