defaults:
  platforms: [unix]
  for: [python, pyc]

traits:
- id: python-login-profile-targets
  desc: References bashrc and profile paths
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '~/.bashrc[\s\S]{0,220}~/.profile'
  unless:
    - id: well-known/app/development/calvyn-code
    - id: micro-behaviors/ui/help::shell-profile-setup-instruction
    - type: text
      substr: "MANPATH does not include"
    # Dotfile backup CLIs enumerate shell profiles as pack targets, not
    # persistence writes.
    - type: text
      substr: "ConfigGroup"
    - type: text
      substr: ".peridot"
