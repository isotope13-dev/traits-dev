defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: shell-profile-rc-name
    desc: References a shell startup filename
    if:
      # Require source punctuation before the dot. Template chunks such as
      # `${type}.profile` are stats keys, not paths; `${home}/.profile` is a path.
      type: text
      regex: '(["''`/~ ])\.(bashrc|zshrc|bash_profile|zprofile|zshenv|profile)\b'
