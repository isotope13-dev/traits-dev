defaults:
  platforms: [unix]
  for: [ruby]

traits:
  # Quoted or slash-delimited interactive shell startup file, as a Ruby
  # script names it when it opens the file (`"/root/.bashrc"`,
  # `File.expand_path('~/.zshrc')`).
  - id: ruby-shell-rc-path-literal
    desc: Ruby names a shell startup file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[/~]\.(bashrc|zshrc|bash_profile|bash_login|profile)["'']'
