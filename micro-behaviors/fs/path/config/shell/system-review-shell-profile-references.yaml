defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript, c, cpp, elf, macho]
  crit: notable
  conf: 0.84
traits:
  - id: system-profile-path
    desc: System-wide shell profile path reference
    if:
      type: text
      # Do not match the `/etc/profile` prefix of a more specific profile.d
      # path; profile.d has a separate path observation.
      regex: '/etc/profile($|[^.A-Za-z0-9_])'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: well-known/tool/detection/installtime-audit::installtime-audit-defensive-scanner-context

  - id: system-bashrc-path
    desc: System-wide Bash rc path reference
    if:
      type: text
      regex: '/etc/(bash\.)?bashrc\b'

