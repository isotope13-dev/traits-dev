# Original matchers and effective scopes are retained.
defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
traits:
- id: shell-bash-login-literal
  desc: Shell literal references .bash_login
  crit: notable
  conf: 0.75
  if:
    type: string_literal
    substr: .bash_login
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
- id: shell-cshrc-literal
  desc: Shell literal references .cshrc
  crit: notable
  conf: 1.0
  if:
    type: string_literal
    substr: .cshrc
  unless:
  - id: metadata/package/files/ecosystem::conda-shell-activation-layout
