# A directory reference does not identify a private key or establish access.
defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript]

traits:
  - id: ssh-directory-slash-reference
    for: [scripts, binaries]
    desc: References an SSH configuration directory path
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: /.ssh/
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: micro-behaviors/os/security/scan/signature::scanner-module-wording-context
      - id: metadata/file/format/source-map::sourcemap-sources-content
# ECC.py documents an OpenSSH path but does not access the filesystem.
      - id: well-known/lib/crypto/pycryptodome::pycryptodome-bytecode-path
