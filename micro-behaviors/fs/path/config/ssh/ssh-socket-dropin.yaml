defaults:
  platforms: [linux, macos, windows]
  for: [elf, pe, shell, python, systemd_service]
  conf: 0.96
  size_max: 1073741824
  crit: baseline
traits:
  - id: ssh-socket-dropin-path
    desc: SSH socket systemd drop-in path
    if:
      type: text
      regex: '/etc/systemd/system/ssh\.socket\.d/[A-Za-z0-9_.-]+\.conf'

  # Darling vendors OpenSSH as `src/external/openssh/openssh/`, with no
  # version in the path, so `source-tree-path` above never saw it and the
  # carve-outs that name it did nothing. These two are content markers, so
  # they identify the source however it was vendored: the upstream
  # development list appears in configure.ac and throughout the tree, and
  # the init-script variable is specific to contrib/solaris/buildpkg.sh.
