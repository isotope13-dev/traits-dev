traits:
- platforms:
  - unix
  - windows
  for:
  - binaries
  - scripts
  - python
  - java
  - class
  - kotlin
  - c
  - cpp
  crit: notable
  conf: 0.95
  id: ssh-dir
  desc: .ssh directory path
  if:
    type: text
    substr: .ssh/
  not:
  - substr: $HOME/.ssh/
  - substr: .ssh/authorized_keys
  - regex: \.ssh/config\b
  - substr: .ssh/known_hosts
  - regex: vagrant insecure public key
  unless:
  - type: text
    regex: \.ssh(/authorized_keys)? type=(dir|file)\b
