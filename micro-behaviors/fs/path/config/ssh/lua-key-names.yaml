defaults:
  platforms: [unix, appliance]
  for: [lua]

traits:
  - id: lua-ssh-private-key-name-pair
    desc: Lua names RSA/Ed25519 private-key files
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: 'id_rsa[\s\S]{0,120}id_ed25519'
  - id: lua-id-rsa-name
    desc: Lua text references the id_rsa key filename
    crit: notable
    conf: 0.82
    if:
      type: text
      word: id_rsa
  - id: lua-authorized-keys-name
    desc: Lua text references authorized_keys
    crit: notable
    conf: 0.82
    if:
      type: text
      word: authorized_keys
