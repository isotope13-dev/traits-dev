defaults:
  platforms: [unix]
  for: [scripts]

traits:
  - id: ssh-rc-file-command-text
    desc: SSH rc path near a file command
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(\b(cp|install|mv|chmod|touch)\s+.{0,60}|>>?\s*["'']?[^\s>"'']{0,60})(/\.ssh/rc|/sshrc)\b'
    unless:
      # spread harness scripts install ~/.ssh/rc on the disposable guest so
      # the runner can restore its workspace after recovery-mode reboots.
      - id: well-known/tool/development/testing/spread::spread-harness-environment
