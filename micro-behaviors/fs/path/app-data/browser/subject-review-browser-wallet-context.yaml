defaults:
  platforms: [unix, windows, android, ios]
  for: [scripts, binaries, source]
composite_rules:
  - id: browser-wallet-storage-references
    desc: Browser data files and wallet-store references
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/application/browser/profile::browser-data-files
    any:
      - id: micro-behaviors/os/application/target/wallet::wallet-extension-id-cluster
      - id: micro-behaviors/os/application/target/wallet::multiple-wallet-extension-ids
      - id: micro-behaviors/fs/path/credential/wallet::python-wallet-dat-reference
      - id: micro-behaviors/fs/path/credential/wallet::node-ethereum-keystore-path
      - id: micro-behaviors/fs/path/credential/wallet::node-wallet-vault-path
      - id: micro-behaviors/fs/path/credential/wallet::electrum-wallets-dir
      - id: micro-behaviors/fs/path/credential/wallet::electrum-wallet-file
      - id: micro-behaviors/fs/path/credential/wallet::electrum-default
      - id: micro-behaviors/fs/path/credential/wallet::coinomi-wallets-dir
      - id: micro-behaviors/fs/path/credential/wallet::coinomi-wallet-dat
      - id: micro-behaviors/fs/path/credential/wallet::atomic-local-storage
      - id: micro-behaviors/fs/path/credential/wallet::atomic-wallet-name
      - id: micro-behaviors/fs/path/credential/wallet::walletwasabi-lower
      - id: micro-behaviors/fs/path/credential/wallet::walletwasabi-upper
      - id: micro-behaviors/fs/path/app-data/application::binance-app-store
      - id: micro-behaviors/fs/path/credential/wallet::tonkeeper-config
      - id: micro-behaviors/fs/path/credential/wallet::ledger-live-dir
      - id: micro-behaviors/fs/path/credential/wallet::ledger-accounts
      - id: micro-behaviors/fs/path/credential/wallet::trezor-suite
      - id: micro-behaviors/fs/path/credential/wallet::guarda-local-storage
      - id: micro-behaviors/fs/path/credential/wallet::bitcoin-wallet-dat
      - id: micro-behaviors/fs/path/credential/wallet::bitcoin-wallets-dir
      - id: micro-behaviors/fs/path/credential/wallet::bitcoin-app-wallets
      - id: micro-behaviors/fs/path/credential/wallet::ethereum-keystore
      - id: micro-behaviors/fs/path/credential/wallet::mist-keystore
      - id: micro-behaviors/fs/path/credential/wallet::doteth-keystore
      - id: micro-behaviors/fs/path/credential/wallet::monero-wallets
      - id: micro-behaviors/fs/path/credential/wallet::bitmonero-wallets
      - id: micro-behaviors/fs/path/credential/wallet::litecoin-wallet-dat
      - id: micro-behaviors/fs/path/credential/wallet::litecoin-wallets
      - id: micro-behaviors/fs/path/credential/wallet::dashcore-wallets
      - id: micro-behaviors/fs/path/credential/wallet::dash-wallet-dat
      - id: micro-behaviors/fs/path/credential/wallet::electrum-ltc
      - id: micro-behaviors/fs/path/credential/wallet::electron-cash
      - id: micro-behaviors/fs/path/credential/wallet::dogecoin-wallets
      - id: micro-behaviors/fs/path/credential/wallet::dogecoin-wallet-dat
      - id: micro-behaviors/fs/path/credential/wallet::python-monero-wallet-directory
      - id: micro-behaviors/fs/path/credential/wallet::exodus-wallet-path
      - id: micro-behaviors/fs/path/credential/wallet::atomic-wallet-path
      - id: micro-behaviors/fs/path/credential/wallet::trezor-suite-path
