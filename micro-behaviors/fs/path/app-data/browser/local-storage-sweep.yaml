# Many separate Local Storage LevelDB paths in one file: a list of browser
# and Electron-app profiles to visit, not one application's own storage.
defaults:
  platforms: [windows, unix]
  for: [scripts]
traits:
  - id: many-local-storage-leveldb-paths
    desc: Lists four or more LevelDB storage paths
    crit: notable
    conf: 0.9
    count_min: 4
    if:
      type: text
      case_insensitive: true
      regex: '[/\\]local storage[/\\]{1,2}leveldb\b'
