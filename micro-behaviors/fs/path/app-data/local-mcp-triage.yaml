defaults:
  platforms: [windows, linux, macos]
  for: [javascript, package.json, pe, elf, macho, python]
  crit: notable

traits:
  - id: slack-storage-root
    desc: References Slack storage root directory
    crit: notable
    conf: 0.75
    if:
      type: text
      regex: (?i)[/\\]slack[/\\]storage[/\\]

  - id: slack-storage-local
    desc: References Slack Local Storage path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)Slack[/\\]Local Storage

  - id: slack-storage-session
    desc: References Slack Session Storage path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: (?i)Slack[/\\]Session Storage
    unless:
      - id: well-known/app/utility/macos-cleaners::macos-cleaner-app


composite_rules:
  - id: slack-data-path
    desc: References Slack Desktop storage paths
    crit: notable
    conf: 0.85
    any:
      - id: slack-storage-root
      - id: slack-storage-local
      - id: slack-storage-session
      - id: micro-behaviors/fs/path/app-data::slack-storage-indexeddb
      - id: micro-behaviors/fs/path/cookie::slack-storage-cookies
      - id: micro-behaviors/fs/path/cookie::slack-cookies-path
    unless:
      - id: well-known/app/utility/macos-cleaners::macos-cleaner-app

