# Neutral Windows application-data path references. A path literal does not
# imply environment hijacking; objective composites add the PATH mutation or
# credential-store context that establishes intent.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.7

traits:
  - id: javascript-appdata-directory-reference
    desc: JavaScript references the AppData directory
    if:
      type: string_literal
      word: AppData
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/harness/

  - id: javascript-localappdata-directory-reference
    desc: JavaScript references the LocalAppData directory
    if:
      type: string_literal
      substr: LocalAppData
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/harness/
