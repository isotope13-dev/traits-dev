# Application data directories and profile paths: a product's own storage.
# Sensitive as bulk user content, not as a credential.

defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries, csharp]
  crit: notable
  conf: 0.9
  attack: T1555.003

traits:
  - id: chromium-local-extension-settings-path
    desc: Chromium Local Extension Settings path
    crit: notable
    conf: 0.78
    for: [python, javascript, typescript, scripts, binaries]
    if:
      type: text
      substr: Local Extension Settings
