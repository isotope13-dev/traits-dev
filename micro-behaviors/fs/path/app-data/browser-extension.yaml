# Application data directories and profile paths: a product's own storage.
# Sensitive as bulk user content, not as a credential.

defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries, csharp]
  crit: notable
  conf: 0.9

traits:
  - id: chromium-local-extension-settings-path
    desc: Chromium Local Extension Settings path
    crit: notable
    conf: 0.78
    for: [python, javascript, typescript, scripts, binaries, rust, source]
    if:
      type: text
      substr: Local Extension Settings
  - id: chromium-sync-extension-settings-path
    desc: Chromium Sync Extension Settings directory
    if:
      type: text
      substr: /Sync Extension Settings/
  - id: indexeddb-directory-path
    desc: IndexedDB directory path
    if:
      type: text
      substr: /IndexedDB/
