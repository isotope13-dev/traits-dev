# Application data directories and profile paths: a product's own storage.
# Sensitive as bulk user content, not as a credential.

defaults:
  platforms: [windows, unix]
  for: [scripts, source, data, pe, dll, elf]
  conf: 0.9

traits:
  - id: firefox-extensions-database-file
    desc: Firefox add-on database file
    crit: notable
    if:
      type: text
      substr: extensions.sqlite

  # Where an OpenSearch provider XML has to be dropped for Firefox to offer it
  # as a search engine.
  - id: firefox-search-plugins-directory
    desc: Firefox search plugins directory
    crit: notable
    if:
      type: text
      regex: 'browser[\\/]searchplugins'
