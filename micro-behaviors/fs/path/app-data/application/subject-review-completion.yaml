defaults:
  platforms: [unix, windows]
  for: [python, shell]
  crit: notable

traits:
  - id: completion-marker-path
    desc: References marker or tracker completion filename
    conf: 0.85
    if:
      type: literal
      kind: string
      exclude_docstrings: true
      case_insensitive: true
      regex: '(^|[/\\])(marker|tracker)([._-][A-Za-z0-9]{1,12})?[.-](ran|done|exec)$'
