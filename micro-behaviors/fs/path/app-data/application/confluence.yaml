defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]

traits:
  - id: confluence-application-data-path
    desc: References Confluence application data directory
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)[\\/]+Atlassian[\\/]+Application Data[\\/]+Confluence\b'
  - id: onedrive-localappdata-path
    desc: LocalAppData Microsoft OneDrive path
    crit: notable
    conf: 0.9
    for: [python, rust, go, c, cpp, scripts]
    if:
      type: text
      regex: '(?i)%LocalAppData%\\Microsoft\\OneDrive|LocalAppData[/\\]Microsoft[/\\]OneDrive'
