defaults:
  platforms: [windows]
  for: [batch, powershell, text]
  crit: notable
  conf: 0.85

traits:
  - id: pip-user-scripts-exe-path
    desc: pip user install Scripts executable path
    if:
      type: text
      regex: '(?i)%APPDATA%\\Python\\(Python[0-9]+\\)?Scripts\\[^"''\s&|]{1,80}\.exe\b'
