# Application data and profile paths.

defaults:
  crit: notable
  platforms: [windows, unix]
  for: [scripts, source, data, pe, dll, elf]
  conf: 0.82

traits:
- id: chromium-secure-preferences-file
  desc: Chromium Secure Preferences file
  crit: notable
  if:
    # `substr`, not `exact`: in a binary the extracted run is exactly the
    # null-terminated name, but in source it is the surrounding line, so an
    # `exact` match only ever fires on one of the two.
    type: text
    substr: Secure Preferences
- id: chromium-preferences-file
  desc: Chromium Preferences file
  crit: notable
  conf: 0.68
  if:
    type: text
    exact: Preferences
- id: chromium-profile-secure-preferences-name
  desc: Secure Preferences under browser profile
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)User Data[/\\]+(Default|Profile[ _0-9]*)[/\\]+Secure Preferences'
