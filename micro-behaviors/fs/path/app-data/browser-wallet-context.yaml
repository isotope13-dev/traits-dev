defaults:
  platforms: [unix, windows, macos, android, ios]
  for: [scripts, binaries, source]
composite_rules:
  - id: browser-wallet-storage-references
    desc: Browser data files and wallet-store references
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/application/browser::browser-data-files
    any:
      - id: micro-behaviors/fs/file/open::wallet-dat-path
      - id: micro-behaviors/fs/path/wallet::node-ethereum-keystore-path
      - id: micro-behaviors/fs/path/wallet::node-wallet-vault-path
      - id: micro-behaviors/fs/path/wallet::electrum-wallets-dir
      - id: micro-behaviors/fs/path/wallet::electrum-wallet-file
      - id: micro-behaviors/fs/path/wallet::electrum-default
      - id: micro-behaviors/fs/path/wallet::coinomi-wallets-dir
      - id: micro-behaviors/fs/path/wallet::coinomi-wallet-dat
      - id: micro-behaviors/fs/path/wallet::atomic-local-storage
      - id: micro-behaviors/fs/path/wallet::atomic-wallet-name
      - id: micro-behaviors/fs/path/wallet::walletwasabi-lower
      - id: micro-behaviors/fs/path/wallet::walletwasabi-upper
      - id: micro-behaviors/fs/path/wallet::binance-app-store
      - id: micro-behaviors/fs/path/wallet::tonkeeper-config
      - id: micro-behaviors/fs/path/wallet::ledger-live-dir
      - id: micro-behaviors/fs/path/wallet::ledger-accounts
      - id: micro-behaviors/fs/path/wallet::trezor-suite
      - id: micro-behaviors/fs/path/wallet::guarda-local-storage
      - id: micro-behaviors/fs/path/wallet::bitcoin-wallet-dat
      - id: micro-behaviors/fs/path/wallet::bitcoin-wallets-dir
      - id: micro-behaviors/fs/path/wallet::bitcoin-app-wallets
      - id: micro-behaviors/fs/path/wallet::ethereum-keystore
      - id: micro-behaviors/fs/path/wallet::mist-keystore
      - id: micro-behaviors/fs/path/wallet::doteth-keystore
      - id: micro-behaviors/fs/path/wallet::monero-wallets
      - id: micro-behaviors/fs/path/wallet::bitmonero-wallets
      - id: micro-behaviors/fs/path/wallet::litecoin-wallet-dat
      - id: micro-behaviors/fs/path/wallet::litecoin-wallets
      - id: micro-behaviors/fs/path/wallet::dashcore-wallets
      - id: micro-behaviors/fs/path/wallet::dash-wallet-dat
      - id: micro-behaviors/fs/path/wallet::electrum-ltc
      - id: micro-behaviors/fs/path/wallet::electron-cash
      - id: micro-behaviors/fs/path/wallet::dogecoin-wallets
      - id: micro-behaviors/fs/path/wallet::dogecoin-wallet-dat
      - id: micro-behaviors/fs/path/wallet::python-monero-wallet-directory
      - id: micro-behaviors/fs/path/wallet::exodus-wallet-path
      - id: micro-behaviors/fs/path/wallet::atomic-wallet-path
      - id: micro-behaviors/fs/path/wallet::trezor-suite-path
