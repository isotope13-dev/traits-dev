# Application data directories and profile paths: a product's own storage.
# Sensitive as bulk user content, not as a credential.

defaults:
  platforms: [windows, unix]
  for: [scripts, source, data, pe, dll, elf]
  conf: 0.82

traits:
- id: chromium-extensions-directory
  desc: Chromium profile Extensions directory
  crit: notable
  conf: 0.7
  if:
    type: text
    # A bare /extensions/ path is common in source trees (for example,
    # Envoy's generated Go packages). Require browser-profile context.
    regex: '(?i)(Chrome|Chromium|Edge)[^"\r\n]{0,96}[/\\]Extensions([/\\]|$)'
- id: browser-extension-manifest-json
  desc: Browser extension manifest path
  crit: notable
  conf: 0.76
  if:
    type: text
    # A bare `manifest.json` run is not a browser-extension path: bundlers,
    # npm packages, and archive writers all carry the name (Sentry's symbolic
    # source-bundle manifest poisoned the credential-path composite through
    # the bare exact match). Require an extension-store-style directory
    # context around the filename.
    regex: '(?i)[/\\](extensions?|addons?|web-?ext)[/\\][^"\r\n]{0,96}[/\\]manifest\.json'
- id: chromium-profile-script-cache-path
  desc: Chromium profile ScriptCache directory
  crit: notable
  conf: 0.92
  if:
    # Chromium's service-worker script cache inside a browser profile. The
    # browser owns every byte of it; code outside the browser that names the
    # directory is staging or recovering content from a location that survives
    # deleting an extension and that no uninstall path clears.
    type: text
    regex: '(?i)Service Worker[/\\]+ScriptCache'
- id: chromium-profile-user-data-path
  desc: Chromium profile User Data path
  crit: notable
  conf: 0.95
  if:
    type: text
    # Word-bound the browser product: unanchored `Edge` matches inside
    # `acknowledge` / `knowledge` next to ordinary "user data" API text.
    regex: '(?i)\b(Chrome|Chromium|Edge)\b[^"\r\n]{0,80}\bUser Data\b'
- id: chromium-browser-product-path-component
  desc: Chromium product path component
  crit: notable
  conf: 0.78
  for: [python, go, csharp, javascript, typescript]
  if:
    type: literal
    regex: '^(Chrome|Chromium|Edge)$'
- id: chromium-user-data-path-component
  desc: Chromium User Data path component
  crit: notable
  conf: 0.78
  for: [python, go, csharp, javascript, typescript]
  if:
    type: literal
    exact: User Data

composite_rules:
  - id: chromium-profile-extension-files
    desc: Chromium extension profile files
    crit: notable
    conf: 0.86
    needs: 3
    any:
    - id: chromium-secure-preferences-file
    - id: chromium-preferences-file
    - id: chromium-extensions-directory
    - id: browser-extension-manifest-json
