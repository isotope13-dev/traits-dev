# Application storage locations and store wording, without a read or discovery
# claim. Keep the original selector's type/platform scope and OR semantics.
defaults:
  platforms: [unix, windows]
  for: [scripts, pe, elf, macho]

composite_rules:
  - id: local-storage-or-leveldb-reference
    desc: Local Storage path or LevelDB store reference
    crit: notable
    conf: 0.8
    any:
      - id: micro-behaviors/fs/path/app-data::local-storage-ref
      - id: micro-behaviors/data/db/leveldb::leveldb-ref
