defaults:
  for:
  - pe
  platforms:
  - windows
composite_rules:
- id: urlmon-appdata-windrx-profile
  desc: URLMon, AppData and windrx name clues
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/fs/path/basename::windrx-txt-name-reference
  - id: micro-behaviors/fs/path/app-data::appdata-env-path-reference
  - id: micro-behaviors/communications/http/client/urlmon::urlmon-dll-reference
- id: urlmon-appdata-windrx-file-api-profile
  desc: URLMon/AppData/windrx with file API clues
  crit: suspicious
  conf: 0.98
  all:
  - id: urlmon-appdata-windrx-profile
  any:
  - id: micro-behaviors/fs/path/construct::path-combine
  - id: micro-behaviors/fs/path/check::path-file-exists
  - id: micro-behaviors/fs/file/open::file-create-win
