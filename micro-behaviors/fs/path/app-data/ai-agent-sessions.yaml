# Session and chat stores created by local AI agents.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source]
  crit: notable
  conf: 0.94

traits:
  - id: cursor-global-storage-artifact-path
    desc: Cursor global state store path
    if:
      type: text
      regex: '\bCursor( - Insiders)?[/\\]+User[/\\]+globalStorage[/\\]+(state\.vscdb|storage\.json)\b'
      case_insensitive: true

  - id: codex-state-database-artifact-path
    desc: Codex state database path
    if:
      type: text
      regex: '(?i)state_5\.sqlite\b'

