# Session and chat stores created by local AI agents.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source, javascript, typescript, python, powershell, shell, go, rust, c, cpp]
  crit: notable
  conf: 0.94

traits:
  - id: cursor-global-storage-artifact-path
    desc: Cursor global state store path
    if:
      type: text
      regex: '(?i)Cursor[/\\]User[/\\]globalStorage[/\\](state\.vscdb|storage\.json)\b'

  - id: codex-state-database-artifact-path
    desc: Codex state database path
    if:
      type: text
      regex: '(?i)state_5\.sqlite\b'

