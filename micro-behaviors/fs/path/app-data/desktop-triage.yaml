defaults:
  platforms: [windows, linux, macos]
  for: [javascript, package.json, pe, elf, macho, python]
  crit: notable

traits:
  - id: signal-app-dir
    desc: References Signal application data directory
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: '(?i)(\.config|AppData|Application Support)[/\\].{0,12}Signal[/\\]'

  - id: signal-storage-indexeddb
    desc: References Signal IndexedDB storage path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)(\.config|AppData|Application Support)[/\\].{0,12}Signal[/\\]IndexedDB'

  - id: signal-storage-local
    desc: References Signal Local Storage path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)(\.config|AppData|Application Support)[/\\].{0,12}Signal[/\\]Local Storage'

  - id: signal-storage-session
    desc: References Signal Session Storage path
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)(\.config|AppData|Application Support)[/\\].{0,12}Signal[/\\]Session Storage'

  - id: signal-desktop-database-path
    desc: References Signal Desktop database path
    crit: notable
    conf: 0.92
    ref: sha256:2c2ea9613e294962bd4145978ab0a9b61b7cbe8ad3f7b29ae25e678d55b28a1f
    if:
      type: text
      regex: '(?i)(\.config|AppData|Application Support)[/\\].{0,12}Signal[/\\].{0,120}db\.sqlite'

  - id: slack-storage-indexeddb
    desc: References Slack IndexedDB storage path
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: Slack/IndexedDB


composite_rules:
  - id: signal-data-path
    desc: References Signal Desktop storage paths
    crit: notable
    conf: 0.9
    ref: sha256:2c2ea9613e294962bd4145978ab0a9b61b7cbe8ad3f7b29ae25e678d55b28a1f
    all:
      - id: signal-app-dir
    any:
      - id: signal-storage-indexeddb
      - id: signal-storage-local
      - id: signal-storage-session
      - id: micro-behaviors/fs/path/cookie::signal-storage-cookies
      - id: micro-behaviors/fs/path/cookie::signal-cookies-path
      - id: micro-behaviors/fs/path/config/app::signal-storage-config
      - id: signal-desktop-database-path
    unless:
      - id: well-known/app/utility/macos-cleaners::macos-cleaner-app

