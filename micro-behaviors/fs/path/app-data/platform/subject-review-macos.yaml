defaults:
  platforms: [macos]
  for: [macho, shell, go]
  crit: baseline

traits:
  - id: system-group-container-path
    desc: macOS shared group-container path
    conf: 0.6
    if:
      type: text
      substr: /Library/Group Containers/

  - id: system-application-support-path
    desc: macOS shared application-support path
    conf: 0.6
    if:
      type: text
      substr: "/Library/Application Support/"

  - id: user-application-support-path
    desc: macOS user application-support path
    conf: 0.7
    if:
      type: text
      substr: "Library/Application Support"
