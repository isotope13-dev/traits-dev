# Assembled user-profile DLL paths where the AppData root and the .dll
# filename sit in adjacent literals concatenated with a runtime subfolder.
defaults:
  platforms: [windows]
  for: [source, scripts]
  crit: notable

traits:
  - id: appdata-root-path-literal
    desc: Literal references AppData directory path
    conf: 0.85
    if:
      type: literal
      kind: string
      regex: '(?i)(%LOCALAPPDATA%|%APPDATA%|AppData[/\\]+(Local|Roaming))[/\\]'

  - id: dll-filename-subpath-literal
    desc: Literal ends with path-qualified .dll name
    conf: 0.85
    if:
      type: literal
      kind: string
      regex: '(?i)[/\\][A-Za-z0-9_.-]{1,64}\.dll$'

composite_rules:
  - id: concat-appdata-dll-path
    desc: Concatenates AppData directory and .dll subpath
    conf: 0.92
    near_bytes: 360
    all:
      - id: appdata-root-path-literal
      - id: dll-filename-subpath-literal

  - id: assembled-appdata-dll-path
    desc: References or builds AppData DLL path
    conf: 0.94
    any:
      - id: concat-appdata-dll-path
      - id: micro-behaviors/fs/path/app-data/platform::user-profile-dll-path
      - id: micro-behaviors/fs/path/app-data/platform::user-writable-dll-path-reference
