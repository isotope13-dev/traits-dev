defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.7

traits:
  - id: javascript-appdata-directory-reference
    desc: JavaScript references the AppData directory
    if:
      type: string_literal
      word: AppData
  - id: javascript-localappdata-directory-reference
    desc: JavaScript references the LocalAppData directory
    if:
      type: string_literal
      substr: LocalAppData
