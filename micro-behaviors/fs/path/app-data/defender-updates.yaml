traits:
- id: defender-programdata-directory
  desc: Microsoft Defender ProgramData directory path
  conf: 0.92
  if:
    type: text
    regex: (?i)ProgramData[\\/]{1,4}Microsoft[\\/]{1,4}Windows Defender\b
- id: defender-update-subdirectory
  desc: Defender update subdirectory path
  conf: 0.97
  if:
    type: text
    regex: (?i)Windows Defender[\\/]{1,4}(Platform|Definition Updates)\b
composite_rules:
- id: defender-update-directory
  desc: Microsoft Defender update directory path
  conf: 0.97
  near_lines: 1
  all:
  - id: micro-behaviors/fs/path/app-data::defender-programdata-directory
  - id: micro-behaviors/fs/path/app-data::defender-update-subdirectory
defaults:
  platforms:
  - windows
  for:
  - batch
  - scripts
  - c
  - cpp
  - csharp
  - go
  - rust
  - zig
  - python
  crit: notable
