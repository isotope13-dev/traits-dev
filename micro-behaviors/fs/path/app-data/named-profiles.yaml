defaults:
  platforms: [windows, unix]
  for: [binaries]
  conf: 0.95
traits:
  - id: windows-named-user-profile-reference
    desc: Named Windows account profile path
    crit: notable
    if:
      type: text
      regex: C:\\Users\\(Bruno|Joe Cage|John Doe|azure)[^\r\n"]{0,100}
      case_insensitive: true
    not:
      - regex: '(?i)\.(exe|dll|sys|pdb|obj|lib|cpp|cs|rs|go)$'
    unless:
      - id: well-known/app/utility/siw::siw-family-identity
      - id: micro-behaviors/os/env/system-info::serialized-windows-environment-block
