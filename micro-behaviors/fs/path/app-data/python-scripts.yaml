defaults:
  platforms: [windows]
  for: [batch, powershell, text]
  crit: notable
  conf: 0.85

traits:
  # pip --user installs console-script launchers into the per-user Python
  # Scripts directory (%APPDATA%\Python\Scripts, versioned installs use
  # %APPDATA%\Python\PythonNN\Scripts), so installer documentation for any
  # Python CLI package references an executable path here. That reference
  # alone is a packaging fact, not a staged-payload launch.
  - id: pip-user-scripts-exe-path
    desc: pip user install Scripts executable path
    if:
      type: text
      regex: '(?i)%APPDATA%\\Python\\(Python[0-9]+\\)?Scripts\\[^"''\s&|]{1,80}\.exe\b'
