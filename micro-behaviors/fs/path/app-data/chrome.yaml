# Application data directories and profile paths: a product's own storage.
# Sensitive as bulk user content, not as a credential.

defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  crit: baseline
  conf: 0.6

traits:
  - id: chrome-browser-data
    desc: References Chrome user data
    if:
      type: text
      regex: (?i)User Data.{0,100}Chrome
