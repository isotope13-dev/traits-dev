defaults:
  platforms: [linux]
  for: [source, binaries]
traits:
  # This names an unusual hidden application-data location, not a cache or
  # evidence that the referenced executable was installed or launched.
  - id: hidden-gvfs-executable-path
    desc: Hidden GVFS-named executable path reference
    crit: suspicious
    conf: 0.98
    if:
      type: text
      substr: .local/share/.gvfsd/gvfsd-user
