# Application data directories and profile paths: a product's own storage.
# Sensitive as bulk user content, not as a credential.

defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, c, cpp, rust, go, csharp]
  crit: notable
  conf: 0.85

traits:
  - id: chrome-sync-data-leveldb-dir
    desc: Chrome Sync Data LevelDB directory
    conf: 0.86
    if:
      type: text
      regex: '(?i)Sync Data["''\s,)/\\]{1,8}LevelDB'
