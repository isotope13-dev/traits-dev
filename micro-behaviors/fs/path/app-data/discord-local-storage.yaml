defaults:
  platforms: [windows, macos, linux]
  for: [scripts, source, binaries]
traits:
  - id: discord-local-storage-path
    desc: Discord Local Storage directory reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?i)discord(canary|ptb)?[/\\]+Local Storage
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      - id: well-known/game/steamtools::gameaccount-plugin
