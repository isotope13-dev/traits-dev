defaults:
  platforms: [linux]
  for: [javascript]

traits:
  - id: gnome-theme-resource-reference
    desc: References GNOME theme directories or stylesheet
    crit: notable
    conf: 0.94
    unless:
      # A `.themes` string in browser UI code is a DOM class selector
      # (jQuery `.find( '.themes' )` in WordPress admin), not a theme
      # directory. GJS extensions never create DOM elements.
      - id: micro-behaviors/data/collection/dom::document-create-element
    if:
      type: text
      # A bare '.themes' name also occurs in icon maps, not path access.
      regex: '~/\.themes|/usr/share/themes|gnome-shell\.css'
