defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, source]
traits:
  - id: ubisoft-launcher-data-path
    desc: Ubisoft launcher application-data directory path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)Ubisoft( Game Launcher| Connect)?[\\/](cache|config)([\\/]|$)'
