defaults:
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
  platforms: [windows]
traits:
  - id: windows-appdata-path-marker
    desc: Windows AppData path reference
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: '(?i)([\\/]AppData[\\/]|%APPDATA%|\$env:APPDATA)'

  - id: localappdata-marker
    desc: LOCALAPPDATA path marker
    crit: baseline
    conf: 0.95
    if:
      type: text
      exact: LOCALAPPDATA
  - id: roaming-appdata-executable-path
    desc: Roaming AppData executable path
    crit: notable
    conf: 0.82
    for: [scripts, binaries, go]
    if:
      type: text
      regex: (?i)\\AppData\\Roaming\\[^\\]{1,48}\\[^\\]{1,80}\.exe
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: localappdata-short-subdir
    desc: LocalAppData short staging directory
    crit: notable
    conf: 0.84
    for: [batch, powershell, pe, javascript, vbs]
    if:
      type: text
      regex: '(?i)%LOCALAPPDATA%\\[A-Za-z0-9_-]{3,8}\b'
  - id: windows-appdata-directory-path
    desc: Windows AppData directory path reference
    crit: notable
    conf: 0.82
    for: [python, c, cpp, csharp, rust, go, powershell, batch, pe, dll]
    if:
      type: text
      regex: '(?i)(%APPDATA%|%LOCALAPPDATA%|AppData)[\\/][A-Za-z0-9._ -]{1,64}'
    unless:
      - id: metadata/package/testing/harness/unit::rust-test
  - id: python-userprofile-local-appdata-path
    desc: Builds Local AppData path from USERPROFILE
    crit: notable
    conf: 0.94
    for: [python]
    if:
      type: text
      regex: '(?is)USERPROFILE.{0,48}["'']AppData["''].{0,24}["'']Local["'']'
  - id: appdata-powershell-script-path
    desc: References a PowerShell script under AppData
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?i)(\$env:APPDATA|AppData)[^\n]{0,80}\.ps1\b'
  - id: appdata-percent-dll
    desc: "%AppData% env var references DLL path"
    crit: suspicious
    if:
      type: text
      regex: '(?i)%appdata%[^"\r\n]{0,120}\.dll'
  - id: localappdata-percent-dll
    desc: "%LocalAppData% env var references DLL path"
    crit: suspicious
    if:
      type: text
      regex: '(?i)%localappdata%[^"\r\n]{0,120}\.dll'
  - id: ps-env-appdata-dll
    desc: PowerShell $env:AppData references DLL path
    crit: suspicious
    if:
      type: text
      regex: '(?i)\$env:appdata[^"\r\n]{0,120}\.dll'
  - id: ps-env-localappdata-dll
    desc: PowerShell $env:LocalAppData references DLL path
    crit: suspicious
    if:
      type: text
      regex: '(?i)\$env:localappdata[^"\r\n]{0,120}\.dll'
  - id: getenv-appdata-dll
    desc: getenv(APPDATA) references DLL path
    crit: suspicious
    if:
      type: text
      regex: '(?i)getenv\([''"]appdata[''"][^"\r\n]{0,80}\.dll'
  - id: getenv-localappdata-dll
    desc: getenv(LOCALAPPDATA) references DLL path
    crit: suspicious
    if:
      type: text
      regex: '(?i)getenv\([''"]localappdata[''"][^"\r\n]{0,80}\.dll'
  - id: windows-user-profile-data-path
    desc: Windows Documents/Desktop/Roaming path
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '(?i)\\Users\\[^\\\r\n]{1,40}\\(Documents|Desktop|AppData\\Roaming)'
  # User Downloads is a common writable staging dir for EXE droppers that avoid
  # %TEMP%/%ProgramData% (those are already covered elsewhere).
  - id: win-downloads-executable-path
    desc: Windows Downloads folder executable path
    crit: notable
    conf: 0.9
    for: [powershell, batch, pe]
    if:
      type: text
      regex: '(?i)USERPROFILE.{0,24}Downloads\\[^\\\n]{1,80}\.exe'
  - id: win-users-downloads-executable-path
    desc: Users profile Downloads executable path
    crit: notable
    conf: 0.9
    for: [powershell, batch, pe]
    if:
      type: text
      regex: '(?i)\\Users\\[^\\]{1,40}\\Downloads\\[^\\]{1,80}\.exe'
  - id: json-userprofile-downloads-executable
    desc: JSON path uses USERPROFILE Downloads executable
    crit: notable
    conf: 0.94
    platforms: [windows, unix]
    for: [json]
    if:
      type: value
      path: path
      regex: '(?i)^%USERPROFILE%\\Downloads\\[^\\]{1,80}\.exe$'
  - id: json-users-downloads-executable
    desc: JSON path uses Users Downloads executable
    crit: notable
    conf: 0.94
    platforms: [windows, unix]
    for: [json]
    if:
      type: value
      path: path
      regex: '(?i)^[A-Z]:\\Users\\[^\\]{1,40}\\Downloads\\[^\\]{1,80}\.exe$'
  - id: path-suspicious-appdata-exe
    desc: "Writes exe to %AppData% env var directly"
    if:
      type: text
      regex: (?i)%[A-Z0-9_]+%\.exe
composite_rules:
  - id: user-writable-dll-path-reference
    desc: DLL path references a user-writable directory
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/system::windows-dll-file-path-reference
    any:
      - id: micro-behaviors/fs/path/system::programdata-directory-path
      - id: windows-appdata-directory-path
      - id: micro-behaviors/fs/path/temp::windows-public-temp-directory-path
    near_bytes: 256
    unless:
      - id: well-known/app/productivity/1password::onepassword-sdk-context
      - id: well-known/app/productivity/1password::onepassword-sdk-desktop-ipc-context
  - id: user-profile-dll-path
    desc: User-profile env var references a DLL path
    crit: suspicious
    conf: 0.95
    any:
      - id: appdata-percent-dll
      - id: localappdata-percent-dll
      - id: ps-env-appdata-dll
      - id: ps-env-localappdata-dll
      - id: getenv-appdata-dll
      - id: getenv-localappdata-dll
  - id: json-win-downloads-executable-path
    desc: JSON path names Windows Downloads executable
    crit: notable
    conf: 0.95
    platforms: [windows, unix]
    for: [json]
    any:
      - id: json-userprofile-downloads-executable
      - id: json-users-downloads-executable
