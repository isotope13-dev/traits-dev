defaults:
  platforms:
  - windows
  - macos
  - linux
  for:
  - javascript
  - typescript
  - python
  - pe
  - elf
  - macho
  - batch

traits:
  - id: discord-appdata-reference
    desc: Discord AppData directory reference
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: (?i)(AppData[/\\](Roaming|Local)|%APPDATA%)[/\\]discord(canary|ptb)?
