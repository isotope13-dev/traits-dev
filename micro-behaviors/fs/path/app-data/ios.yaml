# Application data directories: a product's own storage, sensitive as bulk
# user content rather than as a credential.

defaults:
  platforms:
    - macos
    - ios
  crit: notable
  conf: 0.8
  for:
    - scripts
    - source
    - binaries

traits:
  - id: ios-mobile-preferences
    desc: Reference to iOS mobile preferences
    platforms:
      - unix
      - ios
    for:
      - lua
      - macho
    if:
      type: text
      substr: /var/mobile/Library/Preferences
  - id: ios-mobile-app-data
    desc: Reference to iOS application data
    platforms:
      - unix
      - ios
    for:
      - lua
      - macho
    if:
      type: text
      substr: /var/mobile/Containers/Data/Application
