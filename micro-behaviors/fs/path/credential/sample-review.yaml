# Neutral observations separated from attacker or product inferences.
composite_rules:
- id: key-and-connection-file-references
  desc: References two key or connection file types
  crit: notable
  conf: 0.85
  needs: 2
  any:
  - id: micro-behaviors/fs/path/private-key::putty-key-extension-reference
  - id: micro-behaviors/fs/path/certificate::pem-file-extension-reference
  - id: micro-behaviors/fs/path/config/app::rdp-file-reference
  - id: micro-behaviors/fs/path/secret-config::openvpn-path-or-config-ref
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - powershell
  - perl
  - pe
