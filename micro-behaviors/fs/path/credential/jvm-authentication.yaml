defaults:
  platforms: [unix, windows]
  for: [java, class]
traits:
  - id: jvm-cloud-or-netrc-path
    desc: JVM AWS or netrc credential path reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(\.aws/credentials|\.netrc)'

composite_rules:
  # One alternative in downstream sweeps, preserving the original OR/count.
  - id: jvm-authentication-path-reference
    desc: JVM authentication-file path reference
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/private-key::jvm-private-ssh-path
      - id: micro-behaviors/fs/path/public-key::jvm-authorized-keys-path
      - id: jvm-cloud-or-netrc-path
