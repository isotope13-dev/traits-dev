defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8

traits:
- id: wallet-keystore-file-path-wording
  desc: References wallet or keystore file/path wording
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)\b(wallet|keystore)\b.{0,24}\b(file|path)\b'
  # Dictionary word-salad padding pairs random nouns ("... wallet file ...").
  unless:
  - id: metadata/lang/source/comment::vbs-word-salad-comment-lines
