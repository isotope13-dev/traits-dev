# Unix login-secret file paths named in source or script text. A path literal
# is a sensitive-path capability; credential-access objectives combine it with
# read, sweep and exfiltration legs.

defaults:
  platforms: [unix, windows]
  for: [source, scripts]
  attack: T1552.001

traits:
  # Relocated from objectives/credential-access/files/config
  # (login-secret-file-paths--rx-6).
  - id: authorized-keys-or-shadow-path
    desc: authorized_keys or /etc/shadow path literal
    crit: notable
    conf: 0.9
    unless:
      - id: well-known/tool/detection/llm-scanner/
      - id: metadata/package/testing/presence/fixture::stub-secret-store-canary-wording
    if:
      type: text
      regex: '(\.ssh/authorized_keys|/etc/shadow)\b'
