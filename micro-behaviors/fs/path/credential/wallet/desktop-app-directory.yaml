# Installed Electron desktop-wallet application directory names.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell, powershell, batch, scripts, binaries]
  crit: notable
  attack: T1555.005

traits:
  - id: wallet-app-directory-literal
    desc: Desktop wallet app directory name
    conf: 0.85
    if:
      type: text
      regex: (?i)(^|['"`/\\])(exodus|atomic|coinomi|guarda|ledger live|trezor suite)['"`/\\]
