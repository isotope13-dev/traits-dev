# Installed Electron desktop-wallet application directory names.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell, powershell, batch, scripts, binaries]
  crit: notable
  attack: T1555.005

traits:
  - id: wallet-app-directory-names-a
    desc: Desktop wallet app directory name
    crit: notable
    if:
      type: text
      regex: (?i)(^|['"`/\\])(exodus|coinomi|guarda)['"`/\\]
  - id: wallet-app-directory-names-b
    desc: Desktop wallet app directory name
    crit: notable
    if:
      type: text
      regex: (?i)(^|['"`/\\])(ledger live|trezor suite)['"`/\\]

composite_rules:
  - id: wallet-app-directory-literal
    desc: Desktop wallet app directory name
    conf: 0.85
    any:
      - id: wallet-app-directory-names-a
      - id: wallet-app-directory-names-b
      - id: atomic-local-storage
