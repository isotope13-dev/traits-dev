defaults:
  platforms: [windows]
  for: [scripts, binaries]

traits:
  - id: windows-temp-sam-hive-staging
    desc: Temporary SAM hive path reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)C:\\Windows\\Temp\\SAM(\.save|\.hiv|\.bak)?\b'
  - id: windows-temp-system-hive-staging
    desc: Temporary SYSTEM hive path reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)C:\\Windows\\Temp\\SYSTEM(\.save|\.hiv|\.bak)?\b'
  - id: windows-temp-security-hive-staging
    desc: Temporary SECURITY hive path reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)C:\\Windows\\Temp\\SECURITY(\.save|\.hiv|\.bak)?\b'

