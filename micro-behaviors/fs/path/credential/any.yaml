# Aggregation point for "a credential-bearing path was referenced", regardless
# of which kind. The typed directories (`private-key/`, `token/`, …) exist so
# the ML feature space can tell an SSH key from a cookie jar; this composite
# exists because a handful of objectives legitimately want *any* of them —
# "archived and uploaded something sensitive" does not care which kind it was.
#
# Referencing this by id is deliberate: before the typed split those rules used
# a bare `fs/path/sensitive/` directory reference, which silently narrowed as
# traits moved out of that directory. A named umbrella cannot drift that way.
defaults:
  platforms: [unix, windows]

composite_rules:
  - id: any-credential-path
    desc: References a credential-bearing path
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/private-key/
      - id: micro-behaviors/fs/path/public-key/
      - id: micro-behaviors/fs/path/secret-config/
      - id: micro-behaviors/fs/path/token/
      - id: micro-behaviors/fs/path/account-db/
      # The not-yet-migrated remainder; drops out when `sensitive/` retires.
      - id: micro-behaviors/fs/path/sensitive/
