defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, binaries]

composite_rules:
  - id: bundled-agent-auth-store-references
    desc: Agent auth paths and keychain names
    crit: notable
    conf: 0.93
    # Names alone do not establish credential reads or a trust-boundary
    # crossing. Acquisition and transfer rules retain their stronger claims.
    all:
      - id: micro-behaviors/fs/path/credential/ai-agent::agent-config-dir-adjacent-auth-filename
      - id: micro-behaviors/os/security/keychain::claude-code-keychain-service-name
