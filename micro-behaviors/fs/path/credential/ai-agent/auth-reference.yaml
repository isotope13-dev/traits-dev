composite_rules:
- id: ai-agent-auth-artifact-reference
  desc: References local AI-agent authentication artifacts
  crit: notable
  conf: 0.96
  any:
  - id: micro-behaviors/fs/path/credential/ai-agent::codex-auth-artifact-path
  - id: micro-behaviors/fs/path/credential/ai-agent::claude-auth-artifact-path
  - id: micro-behaviors/fs/path/credential/ai-agent::copilot-hosts-auth-artifact-path
  - id: micro-behaviors/fs/path/credential/ai-agent::kiro-sso-auth-artifact-path
  - id: micro-behaviors/fs/path/credential/ai-agent::ai-cli-oauth-token-store-path
  - id: micro-behaviors/fs/path/credential/password-store::gemini-workspace-auth-artifact-path
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - source
