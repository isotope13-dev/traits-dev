defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
traits:
- id: terraform-credentials-path-reference
  desc: References Terraform Cloud credentials file
  conf: 0.92
  for: [scripts, binaries, python, java, class, kotlin, c, cpp, go, rust]
  if:
    type: text
    regex: (?i)\.terraform\.d[/\\]credentials\.tfrc\.json
  unless:
  - id: micro-behaviors/fs/path/credential/password-store::credential-store-documentation-context
  - id: well-known/app/ai/coding-agent/vtcode::vtcode-agent-package
  crit: notable
