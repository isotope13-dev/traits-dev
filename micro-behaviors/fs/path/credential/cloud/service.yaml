# Bearer material: OAuth, API and session token files. Possession is use --
# no passphrase, no key exchange.
defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp, go, rust]
  crit: notable
  conf: 0.95
  attack: T1552.001

traits:
  - id: gcloud-credentials
    desc: Google Cloud configuration directory reference
    for: [binaries, scripts, source]
    if:
      type: text
      # Preserve literal paths and recognize path-builder argument lists.
      # The collector uses os.path.join(home, '.config', 'gcloud', ...).
      regex: '\.config[/\\''"\s,]{1,12}gcloud([/\\''"\s,)]|$)'
    unless:
      - id: well-known/tool/detection/repo-trust-scan::repo-trust-scan-context
  - id: azure-credentials
    desc: Azure credentials path
    if:
      type: text
      substr: '.azure/credentials'
