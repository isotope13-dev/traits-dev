traits:
  - id: gcp-default-credentials
    desc: GCP default credential filename
    crit: notable
    conf: 0.8
    platforms: [unix, windows]
    for: [scripts, binaries]
    if:
      type: text
      substr: application_default_credentials.json
    unless:
      - id: well-known/lib/cloud/grpc-cpp::grpc-core-library-context
