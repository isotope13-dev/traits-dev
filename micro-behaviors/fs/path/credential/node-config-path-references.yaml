composite_rules:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  id: node-sensitive-config-path-references
  desc: Node SSH/cloud configuration path references
  crit: notable
  conf: 0.7
  any:
  - id: micro-behaviors/fs/path/private-key::ssh-id-rsa-filename-reference
  - id: micro-behaviors/fs/path/token::aws-credentials
  - id: micro-behaviors/fs/path/secret-config::kube-config
  unless:
  - id: well-known/tool/detection/ai-guardrail/
  - id: well-known/lib/cloud/aws-sdk-js/
  - id: well-known/app/infrastructure/podman-desktop::macos-app-bundle
  - id: well-known/app/infrastructure/podman-desktop::bundled-resource
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/package/documentation/page::documentation-web-page
