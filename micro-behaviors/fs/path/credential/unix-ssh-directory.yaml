# General SSH directory paths; no particular secret file is asserted.

defaults:
  platforms: [unix, windows]
  for: [elf, macho, shell, python, perl, ruby, text]
  crit: component
  conf: 0.8

traits:
  - id: ssh-directory-literal
    crit: notable
    desc: References a .ssh directory path
    # The directory rather than one key file: a sweep opens the folder and
    # takes what is in it.
    if:
      type: text
      regex: '(^|[^\w.])\.ssh(/|$|["'' ])'
