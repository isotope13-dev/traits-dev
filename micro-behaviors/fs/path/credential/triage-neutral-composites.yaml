---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
composite_rules:
- for:
  - python
  - markdown
  id: agent-browser-wallet-storage-reference
  desc: Skill content references browser or wallet storage
  conf: 0.96
  all:
  - id: metadata/package/agent-skill::agent-skill-reference-evidence
  any:
  - id: micro-behaviors/fs/path/password-store::agent-browser-database-reference
  - id: micro-behaviors/fs/path/application/browser/profile::chrome-linux-config-directory
  - id: micro-behaviors/fs/path/application/browser/profile::chrome-macos-support-path
  - id: micro-behaviors/communications/blockchain/wallet::wallet-data-terminology
- for:
  - source
  - scripts
  id: login-auth-or-history-file-reference
  desc: Authentication or shell-history path reference
  conf: 0.9
  any:
  - id: micro-behaviors/fs/path/private-key::ssh-private-key
  - id: micro-behaviors/fs/path/public-key::known-hosts-path-reference
  - id: micro-behaviors/fs/path/credential::authorized-keys-or-shadow-path
  - id: micro-behaviors/fs/path/activity-history::bash-zsh-history-path-text
