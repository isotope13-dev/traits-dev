---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
composite_rules:
- for:
  - python
  - markdown
  id: agent-browser-wallet-storage-reference
  desc: Skill content references browser or wallet storage
  conf: 0.96
  all:
  - id: metadata/package/agent-skill::agent-skill-reference-evidence
  any:
  - id: micro-behaviors/fs/path/password-store::agent-browser-database-reference
  - id: micro-behaviors/fs/path/application/browser::chrome-linux-config-directory
  - id: micro-behaviors/fs/path/application/browser::chrome-macos-support-path
  - id: micro-behaviors/crypto/library/blockchain/wallet::wallet-data-terminology
- for:
  - source
  - scripts
  id: developer-credential-path-reference
  desc: Credential path table in source
  conf: 0.9
  any:
  - id: micro-behaviors/fs/path/credential::npm-pypi-credential-file-reference
  - id: micro-behaviors/fs/path/credential::git-or-github-credential-file-reference
  - id: micro-behaviors/fs/path/private-key::ssh-private-key
  - id: micro-behaviors/fs/path/credential::terraform-credentials-path-reference
  - id: micro-behaviors/fs/path/credential::azure-gh-config-path-reference
- for:
  - source
  - scripts
  id: developer-auth-file-reference
  desc: References a developer credential file
  conf: 0.92
  any:
  - id: micro-behaviors/fs/path/token::aws-credentials-text-reference
  - id: micro-behaviors/fs/path/private-key::ssh-private-key
  - id: micro-behaviors/os/container/image::docker-config-json
  - id: micro-behaviors/fs/path/secret-config::kube-config
  - id: micro-behaviors/fs/path/credential::gcloud-config-path-reference
  - id: micro-behaviors/fs/path/credential::azure-credential-path-reference
  - id: micro-behaviors/fs/path/credential::terraform-credentials-path-reference
  - id: micro-behaviors/fs/path/token::aws-credentials
  - id: micro-behaviors/fs/path/secret-config::package-or-netrc-credential-file
  - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
- for:
  - source
  - scripts
  id: login-auth-or-history-file-reference
  desc: Login secret file paths
  conf: 0.9
  any:
  - id: micro-behaviors/fs/path/private-key::ssh-private-key
  - id: micro-behaviors/fs/path/public-key::known-hosts-path-reference
  - id: micro-behaviors/fs/path/credential::authorized-keys-or-shadow-path
  - id: micro-behaviors/fs/path/personal::bash-zsh-history-path-text
- for:
  - shell
  - python
  - go
  - rust
  - perl
  - javascript
  - typescript
  - powershell
  - c
  - cpp
  id: multiple-developer-credential-path-groups
  desc: References multiple developer credential path groups
  conf: 0.96
  needs: 3
  any:
  - id: micro-behaviors/fs/path/token::developer-credential-stores
  - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
  - id: micro-behaviors/fs/path/credential::ssh-key-or-host-store-reference
  - id: micro-behaviors/fs/path/credential::container-credentials
  - id: micro-behaviors/fs/path/token::vault-token-file
