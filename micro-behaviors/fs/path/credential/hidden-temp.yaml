# Cross-family credential-path concepts: umbrellas that span several secret
# types, and the contexts in which such a path is merely being listed (an
# editor filetype table, a syntax bundle) rather than opened.

defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

composite_rules:
  - id: hidden-temp-secret-path
    desc: Hidden temp secret path
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/password-store::hidden-temp-password-path
      - id: micro-behaviors/fs/path/token::hidden-temp-token-path
      - id: micro-behaviors/fs/path/token::hidden-temp-secretish-path
    downgrade:
      any:
        - id: micro-behaviors/data/format/editor-syntax::syntax-bundle-context
        - id: micro-behaviors/process/interpreter/vm/
