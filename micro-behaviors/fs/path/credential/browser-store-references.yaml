composite_rules:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - csharp
  crit: notable
  conf: 0.95
  id: browser-sensitive-data
  desc: Browser data store path references
  any:
  - id: micro-behaviors/fs/path/cookie::firefox-cookies
  - id: micro-behaviors/fs/path/cookie::chrome-cookies
  - id: micro-behaviors/fs/path/password-store::firefox-logins
  - id: micro-behaviors/fs/path/personal::firefox-formhistory
  - id: micro-behaviors/fs/path/password-store::browser-credit-cards
