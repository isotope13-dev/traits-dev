# Cross-family credential-path concepts and the guards that recognise a
# defensive check rather than an access.

defaults:
  platforms:
    - macos
    - ios
  crit: notable
  conf: 0.8
  for:
    - scripts
    - source
    - binaries

composite_rules:
  - id: multi-sensitive-store-references
    desc: Multiple macOS sensitive-store references
    crit: notable
    conf: 0.9
    needs: 2
    # Apple Notes, Telegram sessions and the login keychain database are
    # sensitive stores by the same measure as the original three, and are
    # defined as traits directly above. Leaving them out meant a stealer that
    # swept Notes + Telegram + the keychain DB — the exact AmnesiaStealer
    # target list — registered as no sweep at all.
    any:
      - id: micro-behaviors/fs/path/password-store::keychain-data
      - id: micro-behaviors/fs/path/personal::imessage-chat-db
      - id: micro-behaviors/fs/path/cookie::safari-binary-cookies
      - id: micro-behaviors/fs/path/personal::apple-notes-store
      - id: micro-behaviors/fs/path/token::telegram-tdata-session
      - id: micro-behaviors/fs/path/password-store::macos-login-keychain-db
