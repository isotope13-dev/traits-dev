# Cross-family credential-path concepts: umbrellas that span several secret
# types, and the contexts in which such a path is merely being listed (an
# editor filetype table, a syntax bundle) rather than opened.

defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

composite_rules:
  - id: container-credentials
    desc: Container/orchestration credential paths
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/fs/path/secret-config::docker-config
      - id: micro-behaviors/fs/path/secret-config::docker-config-path-components
      - id: micro-behaviors/fs/path/secret-store::runtime-secret-directory-literal
