defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable

traits:
- id: credential-path-segment
  desc: Password or credential path segment
  crit: notable
  conf: 0.92
  if:
    type: literal
    kind: string
    regex: '(?i)~?[/\\]([A-Za-z0-9._-]+[/\\]){0,5}(password|credentials?)([/\\.]|$)'
  unless:
    - id: well-known/lib/ai/pyaigis/
    - id: metadata/lang/scripted::dts-declaration-file

