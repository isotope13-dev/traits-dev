defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable

traits:
- id: credential-path-segment
  desc: Password or credential path segment
  crit: notable
  conf: 0.92
  if:
    type: literal
    kind: string
    regex: '(?i)~?[/\\]([A-Za-z0-9._-]+[/\\]){0,5}(password|credentials?)([/\\.]|$)'
  # A bare slash-prefixed credential word is also a route or command key.
  # Require additional path structure rather than guessing filesystem intent.
  not:
    - regex: '(?i)^[/\\](password|credentials?)$'
  unless:
    - id: well-known/lib/ai/pyaigis/
    - id: metadata/lang/scripted::dts-declaration-file

