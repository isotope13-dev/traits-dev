traits:
- for:
  - scripts
  - binaries
  - source
  - -pyc
  - -beam
  - -wasm
  id: claude-directory-credential-reference
  desc: Claude directory near credential-file wording
  conf: 0.88
  if:
    type: text
    regex: (?i)[/\\]\.claude[/\\].{0,80}credentials?
composite_rules:
- for:
  - scripts
  - binaries
  - python
  - pyc
  - rust
  - go
  - c
  - cpp
  - objc
  - javascript
  - typescript
  id: ssh-key-or-host-store-reference
  desc: References SSH key files or host inventory
  conf: 0.92
  any:
  - id: micro-behaviors/fs/path/private-key::ssh-private-key
  - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
  - id: micro-behaviors/fs/path/public-key::python-ssh-known-hosts-read
  unless:
  - id: well-known/app/network/openssh::openssh-package
  - id: well-known/lib/network/curl::windows-runtime-library
defaults:
  platforms:
  - unix
  - windows
  crit: notable
