defaults:
  platforms: [routeros, appliance, unix]
  for: [lua]
composite_rules:
- id: lua-unix-sensitive-file-path-set
  desc: References a set of Unix sensitive file paths
  crit: notable
  conf: 0.92
  any:
  - id: micro-behaviors/os/privilege/paths::etc-shadow
  - id: micro-behaviors/fs/path/private-key::ssh-private-key
  - id: micro-behaviors/fs/path/personal::bash-history-artifact
  needs: 2

