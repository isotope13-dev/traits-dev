defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: crowd-application-credential-config
    desc: Crowd application credential configuration path
    crit: notable
    conf: 0.98
    if:
      type: string_literal
      regex: '(?i)classes(/|\\|::|(%(25){0,2}3a){2}|%(25){0,2}2f)crowd\.properties'
