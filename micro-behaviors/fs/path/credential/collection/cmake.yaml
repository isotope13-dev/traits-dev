defaults:
  platforms: [unix, windows]
  for: [cmake]
  crit: notable
traits:
  - id: cmake-netrc-container-reference
    desc: CMake references registry credential paths
    if:
      type: text
      regex: '(?i)(~\.netrc\b|[\\/]\.netrc\b|docker/config\.json)'
  - id: cmake-cloud-ssh-reference
    desc: CMake references cloud or SSH credentials
    if:
      type: text
      regex: '(?i)(\.aws/credentials|\.ssh[\\/]id_rsa\b)'
composite_rules:
  - id: cmake-credential-file-reference
    desc: CMake references a credential file
    any:
      - id: cmake-netrc-container-reference
      - id: cmake-cloud-ssh-reference
