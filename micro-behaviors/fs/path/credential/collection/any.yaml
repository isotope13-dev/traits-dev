# Aggregation point for "a credential-bearing path was referenced", regardless
# of which service it belongs to. The children of `fs/path/credential/` exist
# so the feature space can tell an SSH key from a cloud token; this composite
# exists because a handful of objectives legitimately want *any* of them —
# "archived and uploaded something sensitive" does not care which kind it was.
#
# It covers key material, account databases, SSH artefacts and every
# service child. Wallets, password stores and cookie jars stay out: each has
# its own objective-level rules, and folding them in would let one browser or
# wallet path satisfy unrelated "sensitive file" composites. The children are
# listed rather than selecting `credential/` because this rule lives in
# `credential/collection` and must not select itself.
defaults:
  platforms: [unix, windows]

composite_rules:
  - id: any-credential-path
    desc: References a credential or sensitive configuration path
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/credential/private-key/
      - id: micro-behaviors/fs/path/credential/account-db/
      - id: micro-behaviors/fs/path/credential/ssh/
      - id: micro-behaviors/fs/path/credential/cloud/
      - id: micro-behaviors/fs/path/credential/container/
      - id: micro-behaviors/fs/path/credential/registry/
      - id: micro-behaviors/fs/path/credential/vcs/
      - id: micro-behaviors/fs/path/credential/database/
      - id: micro-behaviors/fs/path/credential/ai-agent/
      - id: micro-behaviors/fs/path/credential/application/
      - id: micro-behaviors/fs/path/credential/generic-basename/
      - id: micro-behaviors/fs/path/public-key/
      - id: micro-behaviors/fs/path/application/messaging::telegram-session-data-location
      - id: micro-behaviors/fs/path/extension::hidden-app-key-path
