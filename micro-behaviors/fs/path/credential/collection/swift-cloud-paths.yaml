defaults:
  platforms: [netscaler, appliance, unix]
  for: [swift]

traits:
  # Naming a cloud credential file is a reference, not an access. Kubernetes
  # and Docker tooling legitimately point at these paths, so the spelling alone
  # stays notable until a read or copy is shown.
  - id: swift-cloud-config-path-reference
    desc: Swift cloud configuration path reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(\.kube/config|terraform\.tfstate|\.docker/config\.json)'
