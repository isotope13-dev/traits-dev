# Cross-family credential path references. Category pairs require both
# resource kinds; multiple matcher hits in one kind are not sufficient. The
# kinds are a service credential file, key material, and a wallet.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
  attack: T1552.001
composite_rules:
- id: generic-sensitive-credential-path
  desc: References a credential, npm, or environment configuration path
  conf: 0.8
  any:
  - id: micro-behaviors/fs/path/credential/ssh::ssh-directory-slash-reference
  - id: micro-behaviors/fs/path/credential/cloud::aws-config
  - id: micro-behaviors/fs/path/credential/registry::npmrc-path-literal
  - id: metadata/package/config/format::dotenv-file
- id: multiple-credential-path-kinds
  desc: References multiple credential or configuration path categories
  any:
  - id: service-credential-and-private-key-paths
  - id: service-credential-and-wallet-paths
  - id: private-key-and-wallet-paths
  unless:
  - id: well-known/lib/network/node-ipc::node-ipc-tls-server-context
- id: service-credential-and-private-key-paths
  desc: Service credential file with private key paths
  all:
  - id: service-credential-path
  - id: micro-behaviors/fs/path/credential/private-key/
- id: service-credential-and-wallet-paths
  desc: Service credential file with wallet paths
  all:
  - id: service-credential-path
  - id: micro-behaviors/fs/path/credential/wallet/
- id: private-key-and-wallet-paths
  desc: Private key and wallet paths
  all:
  - id: micro-behaviors/fs/path/credential/private-key/
  - id: micro-behaviors/fs/path/credential/wallet/
# A service credential file: one of the service children, an SSH artefact, a
# generically named secret file, or a messaging session store.
- id: service-credential-path
  desc: References a service credential file path
  any:
  - id: micro-behaviors/fs/path/credential/ssh/
  - id: micro-behaviors/fs/path/credential/cloud/
  - id: micro-behaviors/fs/path/credential/container/
  - id: micro-behaviors/fs/path/credential/registry/
  - id: micro-behaviors/fs/path/credential/vcs/
  - id: micro-behaviors/fs/path/credential/database/
  - id: micro-behaviors/fs/path/credential/ai-agent/
  - id: micro-behaviors/fs/path/credential/application/
  - id: micro-behaviors/fs/path/credential/generic-basename/
  - id: micro-behaviors/fs/path/application/messaging::telegram-session-data-location
