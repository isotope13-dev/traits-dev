defaults:
  platforms: [unix]
  for: [go, elf]

composite_rules:
  - id: private-key-sensitive-path-cluster
    desc: Private-key and additional sensitive path references
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/credential/private-key::ssh-private-key
    any:
      - id: micro-behaviors/fs/path/credential/account-db::unix-account-database-path-reference
      - id: micro-behaviors/fs/path/credential/account-db::go-sudoers-file-path
      - id: micro-behaviors/fs/path/activity-history::root-bash-history-path
