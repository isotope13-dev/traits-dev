---
defaults:
  platforms:
  - unix
  - windows
  crit: notable
composite_rules:
- for:
  - source
  - scripts
  id: developer-credential-path-reference
  desc: Credential path table in source
  conf: 0.9
  any:
  - id: micro-behaviors/fs/path/credential/registry::npm-pypi-credential-file-reference
  - id: micro-behaviors/fs/path/credential/vcs::git-or-github-credential-file-reference
  - id: micro-behaviors/fs/path/credential/private-key::ssh-private-key
  - id: micro-behaviors/fs/path/credential/cloud::terraform-credentials-path-reference
  - id: micro-behaviors/fs/path/credential/account-db::repeated-shadow-path-reference
- for:
  - source
  - scripts
  id: developer-auth-file-reference
  desc: References a developer credential file
  conf: 0.92
  any:
  - id: micro-behaviors/fs/path/credential/cloud::aws-credentials-text-reference
  - id: micro-behaviors/fs/path/credential/private-key::ssh-private-key
  - id: micro-behaviors/fs/path/credential/container::docker-config
  - id: micro-behaviors/fs/path/credential/container::kube-config
  - id: micro-behaviors/fs/path/credential/cloud::gcloud-config-path-reference
  - id: micro-behaviors/fs/path/credential/cloud::azure-credential-path-reference
  - id: micro-behaviors/fs/path/credential/cloud::terraform-credentials-path-reference
  - id: micro-behaviors/fs/path/credential/cloud::aws-credentials
  - id: micro-behaviors/fs/path/credential/registry::package-manager-or-netrc-config-path
  - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
- for:
  - shell
  - python
  - go
  - rust
  - perl
  - javascript
  - typescript
  - powershell
  - c
  - cpp
  id: multiple-developer-credential-path-groups
  desc: References multiple developer credential stores
  conf: 0.96
  needs: 3
  any:
  - id: micro-behaviors/fs/path/credential/collection::developer-credential-stores
  - id: micro-behaviors/fs/path/vcs::source-control-config-or-token-path-reference
  - id: micro-behaviors/fs/path/credential/ssh::ssh-key-or-host-store-reference
  - id: micro-behaviors/fs/path/credential/container::container-credentials
  - id: micro-behaviors/fs/path/credential/application::vault-token-file
