# Cross-family credential-path concepts and the guards that recognise a
# defensive check rather than an access.

defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.92

traits:
  - id: ruby-sensitive-file-guard
    desc: Ruby sensitive_file? access guard
    if:
      type: text
      substr: sensitive_file?(
