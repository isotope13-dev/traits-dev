# Cross-family credential path references. Category pairs require both
# resource kinds; multiple matcher hits in one kind are not sufficient.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
  attack: T1552.001
composite_rules:
- id: generic-sensitive-credential-path
  desc: References a credential, npm, or environment configuration path
  conf: 0.8
  any:
  - id: micro-behaviors/fs/path/private-key::keys
  - id: micro-behaviors/fs/path/secret-config::aws-config
  - id: micro-behaviors/fs/path/config/app::npmrc-path-literal
  - id: metadata/package/config::dotenv-file
- id: multiple-credential-path-kinds
  desc: References multiple credential or configuration path categories
  any:
  - id: token-or-session-and-private-key-paths
  - id: token-or-session-and-secret-or-npm-config-paths
  - id: token-or-session-and-wallet-paths
  - id: private-key-and-secret-or-npm-config-paths
  - id: private-key-and-wallet-paths
  - id: secret-or-npm-config-and-wallet-paths
  unless:
  - id: well-known/lib/network/node-ipc::node-ipc-tls-server-context
- id: token-or-session-and-private-key-paths
  desc: Token or session store with private key paths
  any:
  - id: micro-behaviors/fs/path/token/
  - id: telegram-session-data-location
  all:
  - id: micro-behaviors/fs/path/private-key/
- id: token-or-session-and-secret-or-npm-config-paths
  desc: Token or session store with configuration paths
  any:
  - id: micro-behaviors/fs/path/token/
  - id: telegram-session-data-location
  all:
  - id: secret-or-npm-config-path
- id: token-or-session-and-wallet-paths
  desc: Token or session store with wallet paths
  any:
  - id: micro-behaviors/fs/path/token/
  - id: telegram-session-data-location
  all:
  - id: micro-behaviors/fs/path/wallet/
- id: private-key-and-secret-or-npm-config-paths
  desc: Private key plus secret or npm configuration paths
  all:
  - id: micro-behaviors/fs/path/private-key/
  - id: secret-or-npm-config-path
- id: private-key-and-wallet-paths
  desc: Private key and wallet paths
  all:
  - id: micro-behaviors/fs/path/private-key/
  - id: micro-behaviors/fs/path/wallet/
- id: secret-or-npm-config-and-wallet-paths
  desc: Wallet plus secret or npm configuration paths
  all:
  - id: secret-or-npm-config-path
  - id: micro-behaviors/fs/path/wallet/

- id: secret-or-npm-config-path
  desc: References secret or npm configuration paths
  any:
  - id: micro-behaviors/fs/path/secret-config/
  - id: micro-behaviors/fs/path/config/app::npmrc-path-literal
