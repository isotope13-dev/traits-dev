# Cross-family credential path references. Category pairs require both
# resource kinds; multiple matcher hits in one kind are not sufficient.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
  attack: T1552.001
composite_rules:
- id: generic-sensitive-credential-path
  desc: References a sensitive credential or environment file path
  conf: 0.8
  any:
  - id: micro-behaviors/fs/path/private-key::keys
  - id: micro-behaviors/fs/path/secret-config::aws-config
  - id: micro-behaviors/fs/path/secret-config::npmrc-credentials
  - id: metadata/package/config::dotenv-file
- id: multiple-credential-path-kinds
  desc: References multiple credential path categories
  any:
  - id: token-and-private-key-paths
  - id: token-and-secret-config-paths
  - id: token-and-wallet-paths
  - id: private-key-and-secret-config-paths
  - id: private-key-and-wallet-paths
  - id: secret-config-and-wallet-paths
  unless:
  - id: well-known/lib/network/node-ipc::node-ipc-tls-server-context
- id: token-and-private-key-paths
  desc: Token and private key paths
  all:
  - id: micro-behaviors/fs/path/token/
  - id: micro-behaviors/fs/path/private-key/
- id: token-and-secret-config-paths
  desc: Token and secret config paths
  all:
  - id: micro-behaviors/fs/path/token/
  - id: micro-behaviors/fs/path/secret-config/
- id: token-and-wallet-paths
  desc: Token and wallet paths
  all:
  - id: micro-behaviors/fs/path/token/
  - id: micro-behaviors/fs/path/wallet/
- id: private-key-and-secret-config-paths
  desc: Private key and secret config paths
  all:
  - id: micro-behaviors/fs/path/private-key/
  - id: micro-behaviors/fs/path/secret-config/
- id: private-key-and-wallet-paths
  desc: Private key and wallet paths
  all:
  - id: micro-behaviors/fs/path/private-key/
  - id: micro-behaviors/fs/path/wallet/
- id: secret-config-and-wallet-paths
  desc: Secret config and wallet paths
  all:
  - id: micro-behaviors/fs/path/secret-config/
  - id: micro-behaviors/fs/path/wallet/
