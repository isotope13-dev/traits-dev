defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  size_max: 5000000
traits:
- id: solana-or-cargo-secret-path-reference
  desc: Solana key path or Cargo-sensitive-path text
  crit: notable
  conf: 0.9
  if:
    type: text
    # A lone `Cargo.toml` mention is every Rust tool's manifest enumeration;
    # the cluster is the solana key path, or Cargo.toml paired with a
    # secret-bearing dev path inside the same window.
    regex: "/\\.config/solana/id\\.json|\\bCargo\\.toml\\b.{0,300}(\\.ssh|\\.npmrc|id_rsa)"
