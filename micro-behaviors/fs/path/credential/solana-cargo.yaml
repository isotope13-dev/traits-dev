defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  size_max: 5000000
traits:
- id: solana-or-cargo-secret-path-reference
  desc: Solana or Cargo-associated secret path
  crit: notable
  conf: 0.9
  if:
    type: text
    # A lone `Cargo.toml` mention is every Rust tool's manifest enumeration;
    # the cluster is the solana key path, or Cargo.toml paired with a
    # secret-bearing dev path inside the same window.
    regex: "/\\.config/solana/id\\.json|\\bCargo\\.toml\\b.{0,300}(\\.ssh|\\.npmrc|id_rsa)"
  not:
  - substr: "--manifest-path ../cli/Cargo.toml"
  - substr: cargo run --package
  - substr: msgid "Additional `Cargo.toml` to sync and vendor"
  - substr: msgid "Locate Cargo.toml of the workspace root"
  - substr: msgid "Path to Cargo.toml"
  - substr: msgid "Print a JSON representation of a Cargo.toml file's location"
  unless:
  - id: metadata/lang/locale::gettext-po-catalog
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/tool/detection/sast/
  - type: basename
    regex: "(^|!!)(playwright|jest|vitest)\\.config\\.[cm]?[jt]s$"
