composite_rules:
- platforms:
  - unix
  - windows
  for:
  - scripts
  id: credential-path-or-filename
  desc: Credential-like path segment or filename
  crit: notable
  conf: 0.92
  any:
  - id: micro-behaviors/data/parse/vocabulary::credential-path-segment
  - id: micro-behaviors/fs/path/filename-credential::credential-filename-extension
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  - id: metadata/file/naming::readme-requirements-install-basename
  - id: well-known/lib/cloud/aws-sdk-js/
  - id: well-known/app/ai/governance/nexus-agents::nexus-agents-governance-context
  - id: well-known/app/ai/governance/nexus-agents::nexus-agents-clawguard-emitter
