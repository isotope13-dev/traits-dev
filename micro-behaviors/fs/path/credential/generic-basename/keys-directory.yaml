traits:
- id: keys-directory-reference
  desc: References a keys directory
  crit: notable
  conf: 0.9
  for: [javascript]
  platforms: [unix, windows]
  if:
    type: text
    exclude_comments: true
    # Word boundary required: a bare 'keys/' substring also matched API
    # segments such as 'passkeys/', so a WebAuthn management endpoint
    # scored as a credential-file sweep.
    # A path segment, not prose ending a regex literal (`/needs the keys/`).
    regex: '(^|[/\\.~"''`])keys/'
