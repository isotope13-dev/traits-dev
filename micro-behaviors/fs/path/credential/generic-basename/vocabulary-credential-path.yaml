defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable

traits:
- id: credential-path-segment
  desc: Password or credential path segment
  crit: notable
  conf: 0.92
  if:
    type: literal
    kind: string
    # The optional router prefix is part of the match so the not: exception
    # below can see it; not: judges only the matched text.
    regex: '(?i)(/:[A-Za-z_]+)?~?[/\\]([A-Za-z0-9._-]+[/\\]){0,5}(password|credentials?)([/\\.]|$)'
  # A bare slash-prefixed credential word is also a route or command key.
  # Require additional path structure rather than guessing filesystem intent.
  # Conventional HTTP route namespaces do not identify local secret files.
  not:
    - regex: '(?i)^/(api|auth|console|v[0-9]+)(/|$)'
    - regex: '(?i)^[/\\](password|credentials?)$'
    # Router templates (/:locale/account/password) and account-settings
    # routes are web URL paths, not files on disk.
    - regex: '^/:[A-Za-z_]+/'
    - regex: '(?i)^/(account|accounts|user|users|settings|profile)/'
  unless:
    - id: well-known/lib/ai/pyaigis/
    - id: metadata/lang/scripted::dts-declaration-file

