# A credential store path BOUND to the user's home directory in one
# expression (`Path.home() / ".ssh"`, `expanduser("~/.aws")`, `$HOME/.gnupg`).
# The binding is the observation: a bare home reference plus store names
# elsewhere in the file is co-occurrence, and deny-lists that keep stores out
# of an index mention the same names without ever resolving them under HOME.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  # Shell-family spellings. Store-scoped: a dotfile manager's `~/.vimrc`
  # links its own config, not a credential store.
  - id: shell-home-store-dotpath
    desc: Shell path into a home credential store
    for: [shell, perl, php, ruby, lua]
    platforms: [unix]
    if:
      type: text
      regex: '(\$HOME|\$\{HOME\}|~)[/\\]\.(ssh|aws|gnupg|gcloud)(/|["''\s);,]|$)'
  - id: windows-home-store-dotpath
    desc: Windows profile path into a credential store
    for: [batch, powershell]
    platforms: [windows]
    if:
      type: text
      regex: '%USERPROFILE%[/\\]\.(ssh|aws|gnupg|gcloud)'
  # JS/TS: .aws is deliberately absent here — `path.join(os.homedir(),
  # '.aws', …)` is the AWS SDK's own config/cache shape in ordinary tooling;
  # a homedir join to an SSH/GPG/cloud-CLI store is not.
  - id: node-homedir-store-join
    desc: Node homedir joined to a credential dotpath
    for: [javascript, typescript]
    if:
      type: text
      regex: 'homedir\(\)\s*[,+]\s*["''][/\\]?~?[/\\]?\.(ssh|gnupg|gcloud)'

composite_rules:
  - id: home-joined-credential-store-path
    desc: Resolves a credential store under the home directory
    conf: 0.9
    attack: T1552.001
    any:
      # Python: Path.home() / ".x" or expanduser("~/.x") — the location tier's
      # home-joined hidden dot-entry binding.
      - id: micro-behaviors/fs/path/location::home-hidden-dotpath
      - id: shell-home-store-dotpath
      - id: windows-home-store-dotpath
      - id: node-homedir-store-join
