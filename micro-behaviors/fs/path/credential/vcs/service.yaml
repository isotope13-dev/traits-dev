# Bearer material: OAuth, API and session token files. Possession is use --
# no passphrase, no key exchange.
defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp, go, rust]
  crit: notable
  conf: 0.95
  attack: T1552.001

traits:
  - id: git-credentials
    desc: Git credentials file
    crit: notable
    for: [binaries, scripts, python, java, class, kotlin, c, cpp, go, rust, swift]
    if:
      type: text
      regex: '(^|[/\\~''"\s])\.git-credentials\b'
    downgrade:
      all:
        - id: metadata/signature/verified/
  - id: gh-cli-hosts
    desc: GitHub CLI authentication hosts path reference
    crit: notable
    for: [binaries, scripts, source]
    if:
      type: text
      # Also covers Path.Combine / filepath.Join / path.join components and
      # Windows separators, without depending on a collector's variable names.
      regex: '\.config[/\\''"\s,]{1,12}gh[/\\''"\s,]{1,12}hosts\.yml\b'
    unless:
      - id: micro-behaviors/fs/path/credential/password-store::credential-store-documentation-context
      - id: well-known/app/development/calvyn-code
      - id: well-known/app/development/paseo
