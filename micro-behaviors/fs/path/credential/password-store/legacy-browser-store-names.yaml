# Bare credential-store filenames (not paths) as they appear in a stealer's
# embedded target list: one browser each, so a single list naming several of
# them is a sweep of every browser profile rather than one browser's own code.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: opera-wand-dat-name
    desc: Opera wand.dat password store filename
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: wand.dat
  - id: firefox-signons-sqlite-name
    desc: Firefox signons SQLite store filename
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bsignons3?\.sqlite\b'
  - id: firefox-key3-db-name
    desc: Firefox key3.db key store filename
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: key3.db
  - id: chromium-login-data-journal-name
    desc: Chromium Login Data journal filename
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Login Data-journal
