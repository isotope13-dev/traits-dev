# Algebraic matching is necessary: the multiplier varies between builds.
# Require the full UTF-16 database name and its encoded NUL terminator.
defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: indexed-xor-login-data
    desc: Position-XOR concealed Login Data filename
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule indexed_xor_login_data {
          condition:
            for any s in (0..pe.number_of_sections-1) : (
              pe.sections[s].name == ".rdata" and
              pe.sections[s].raw_data_size >= 22 and
              pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size <= filesize and
              for any o in (pe.sections[s].raw_data_offset..pe.sections[s].raw_data_offset+pe.sections[s].raw_data_size-22) : (
                with key = uint16(o) ^ 76 : (
                  key != 0 and
                  (uint16(o+2) ^ ((2*key) & 65535)) == 111 and
                  for all j in (2..10) : (
                    (j >= 0 and j <= 7 and (uint16(o+j*2) ^ (((j+1)*key) & 65535)) == ((0x6144206e69676f4c >> ((j%8)*8)) & 255)) or (j >= 8 and j <= 10 and (uint16(o+j*2) ^ (((j+1)*key) & 65535)) == ((0x6174 >> ((j%8)*8)) & 255))
                  )
                )
              )
            )
        }
