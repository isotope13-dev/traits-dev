defaults:
  platforms: [unix]
  for: [java, class, jar]
  attack: T1041

traits:
  - id: account-and-root-ssh-path-pair
    desc: "Account-store and root SSH path pair"
    crit: suspicious
    conf: 0.94
    for: [shell, java, class]
    if:
      type: text
      regex: '/etc/master\.passwd[\s\S]{0,500}/root/\.ssh/(id_rsa|authorized_keys)'
