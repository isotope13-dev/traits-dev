---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  crit: notable
traits:
- conf: 0.9
  id: docker-config-path-reference
  desc: Docker credential config path
  if:
    type: text
    regex: "\\.docker.{0,10}config\\.json"
- conf: 0.9
  id: git-or-github-credential-file-reference
  desc: Git credential-file path literal
  if:
    type: text
    regex: "(\\.git-credentials|\\.config/gh/hosts\\.yml)"
- conf: 0.9
  id: gcloud-config-path-reference
  desc: References gcloud application credentials path
  if:
    type: text
    regex: "(?i)\\.config[/\\\\]gcloud"
- conf: 0.9
  id: npm-pypi-credential-file-reference
  desc: NPM or PyPI credential-file path
  if:
    type: text
    regex: "(\\.npmrc|\\.pypirc)"
  unless:
    - id: objectives/supply-chain/install-hook/extconf::ruby-extconf-dev-home-artifacts-probe
- id: azure-credential-path-reference
  desc: References Azure credentials file
  conf: 0.9
  if:
    type: text
    regex: "(?i)\\.azure[/\\\\]credentials"
- id: terraform-credentials-path-reference
  desc: References Terraform Cloud credentials file
  conf: 0.92
  if:
    type: text
    regex: "(?i)\\.terraform\\.d[/\\\\]credentials\\.tfrc\\.json"
