defaults:
  platforms: [qnx, unix]
  for: [javascript, typescript]
  attack: T1041

traits:
  # Two credential-file paths listed within a few hundred bytes of each other:
  # a deny list, scanner rule table or backup manifest reads the same way as
  # the target list of a stealer, so the path list alone is only notable; the
  # stealer composite supplies intent by also requiring the QNX targets and a
  # multipart upload.
  - id: ssh-key-and-shadow-path-list
    desc: SSH private key and /etc/shadow path list
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'id_ed25519[\s\S]{0,500}/etc/shadow'
  - id: qnx-node-qnx-secret-targets
    desc: QNX Node QNX secret targets
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '/var/qnx/etc/passwd[\s\S]{0,260}/etc/qssl/certs'
