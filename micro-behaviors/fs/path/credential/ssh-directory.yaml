defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
traits:
  - id: ssh-dir
    desc: .ssh directory path
    crit: notable
    if:
      type: text
      substr: '.ssh/'
    not:
      - substr: "$HOME/.ssh/"
      - substr: ".ssh/authorized_keys"
      - regex: '\.ssh/config\b'
      - substr: ".ssh/known_hosts"
      - regex: 'vagrant insecure public key'
    unless:
      - type: text
        regex: '\.ssh(/authorized_keys)? type=(dir|file)\b'
    downgrade:
      any:
        # Lives under fs/path/reference: it classifies how a .ssh path is
        # mentioned (ssh tooling, REPL transcript), it is not itself a
        # credential path, and credential aggregators must not be able
        # to select it as path evidence through a directory reference.
        - id: micro-behaviors/fs/path/reference::ssh-tooling-or-transcript-context
        - id: micro-behaviors/data/format/editor-syntax::syntax-bundle-context
        - id: well-known/tool/sysadmin/kubernetes/iac/
        - id: micro-behaviors/process/interpreter/vm/
  # Reading known_hosts is a sensitive-path capability, but the path alone
  # does not establish host harvesting or lateral movement intent.
