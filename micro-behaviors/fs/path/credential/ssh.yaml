# Cross-family credential-path concepts: umbrellas that span several secret
# types, and the contexts in which such a path is merely being listed (an
# editor filetype table, a syntax bundle) rather than opened.

defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp]
  crit: notable
  conf: 0.95
  attack: T1552.001

composite_rules:
  - id: ssh-credentials
    desc: SSH credential file paths
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/fs/path/private-key::ssh-private-key
      - id: micro-behaviors/fs/path/secret-config::ssh-dir
    unless:
      - id: well-known/lib/ai/pyaigis/
      - id: well-known/lib/ui/textmate::frozen-json-grammar-module
