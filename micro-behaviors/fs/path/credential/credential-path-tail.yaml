defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable

traits:
- id: credentials-path-tail
  desc: Path ending in credentials
  crit: notable
  conf: 0.4
  if:
    type: text
    # Require a real parent path segment (~, /dir or .dir): prose such as
    # "the user/credentials that ..." is not a path.
    regex: '(~|[/\\.][A-Za-z0-9._-]{1,40})[/\\]credentials([''"\s,)]|$)'
  unless:
  - type: text
    regex: '\.aws[/\\]credentials'
  - type: trait
    id: metadata/file/extension/identity::linux-kernel-package-artifact-basename

