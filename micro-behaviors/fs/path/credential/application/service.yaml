# Bearer material: OAuth, API and session token files. Possession is use --
# no passphrase, no key exchange.
defaults:
  platforms:
    - unix
    - windows
  for: [binaries, scripts, python, java, class, kotlin, c, cpp, go, rust]
  crit: notable
  conf: 0.95
  attack: T1552.001

traits:
  - id: vault-token-file
    desc: HashiCorp Vault token file
    crit: notable
    if:
      type: text
      # A quoted bare name is how catalogs list it (`[".npmrc", ".vault-token"]`)
      # before joining each entry onto the home directory.
      regex: (^|[/~\\\\"'])\.vault-token\b
    unless:
      - type: basename
        exact: ksops
