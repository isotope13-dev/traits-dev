# Naming several developer credential stores does not establish acquisition.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
composite_rules:
  - id: developer-credential-filename-catalog
    desc: References four or more developer credential stores
    crit: notable
    conf: 0.92
    needs: 4
    any:
      # npm publish token file
      - id: micro-behaviors/fs/path/secret-config::npmrc-credentials
      # PyPI upload credentials
      - id: micro-behaviors/fs/path/secret-config::pypirc-credentials-file
      # shared plaintext credentials for any network service
      - id: micro-behaviors/fs/path/secret-config::netrc
      # Git credential store
      - id: micro-behaviors/fs/path/token::git-credentials
      # SSH private key filename set (id_rsa / id_ecdsa / id_ed25519)
      - id: micro-behaviors/fs/path/private-key::ssh-private-key-filename-enum
      # HashiCorp Vault token file
      - id: micro-behaviors/fs/path/token::vault-token-file
