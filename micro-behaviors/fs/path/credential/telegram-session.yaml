# Telegram tdata is an authentication store, not a selected token.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, csharp, package.json, rust, source]
  crit: notable
  conf: 0.85

traits:
  - id: telegram-desktop-data-path
    desc: Telegram Desktop session-data path
    conf: 0.9
    if:
      type: text
      regex: '(?i)Telegram Desktop[/\\]+(tdata|[A-Za-z0-9_.-]+[/\\]+tdata)'

composite_rules:
  - id: telegram-session-data-location
    desc: References a Telegram session-data location
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/token::compiled-telegram-support-tdata-path
      - id: telegram-desktop-data-path
      - id: micro-behaviors/fs/path/token::telegram-data-path
      - id: micro-behaviors/fs/path/token::telegram-tdata-path-parts
      - id: micro-behaviors/fs/path/token::telegram-desktop-tdata-compact-path
