defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
composite_rules:
  - id: archive-sensitive-file-path-reference
    desc: Private-key or credential-store path reference
    conf: 0.95
    any:
      - id: micro-behaviors/fs/path/private-key::ssh-private-key
      - id: micro-behaviors/fs/path/token::developer-credential-stores
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/fs/path/secret-config::package-or-netrc-credential-file
