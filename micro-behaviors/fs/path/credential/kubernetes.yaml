# Directory-prefix references; no child resource or file access is established.
defaults:
  crit: notable
  platforms:
  - windows
  - unix
traits:
- for:
  - scripts
  - binaries
  id: kubernetes-secret-directory-text
  desc: Kubernetes secret-directory prefix text
  conf: 0.7
  if:
    type: text
    substr: /var/run/secrets/kubernetes
- conf: 0.85
  for:
  - go
  id: kubernetes-secret-directory-literal
  desc: Kubernetes secret-directory prefix literal
  if:
    type: string_literal
    substr: /var/run/secrets/kubernetes
