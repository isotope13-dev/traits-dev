# Generic secret-store locations: no particular token/key/config child is established.
defaults:
  crit: notable
traits:
- platforms:
  - unix
  for:
  - scripts
  - shell
  - binaries
  id: runtime-secret-directory-text
  desc: Runtime secret-directory text
  conf: 0.82
  if:
    type: text
    regex: (?i)(^|[^A-Za-z0-9_])/(var/)?run/secrets(/|$)
- platforms:
  - unix
  - windows
  for:
  - binaries
  - scripts
  - python
  - java
  - class
  - kotlin
  - c
  - cpp
  conf: 0.9
  attack: T1552.001
  id: runtime-secret-directory-literal
  desc: Runtime secret-directory literal
  if:
    type: literal
    kind: string
    regex: /run/secrets(/|$)
  downgrade:
    any:
    - id: micro-behaviors/os/container/runtime/
    - id: well-known/tool/sysadmin/container/
