defaults:
  platforms:
  - unix
  - windows
  crit: notable
composite_rules:
- for:
  - scripts
  - binaries
  - python
  - pyc
  - rust
  - go
  - c
  - cpp
  - objc
  - javascript
  - typescript
  id: ssh-key-or-host-store-reference
  desc: References SSH key files or host inventory
  conf: 0.92
  any:
  - id: micro-behaviors/fs/path/credential/private-key::ssh-private-key
  - id: micro-behaviors/fs/path/credential/private-key::ssh-private-key-filename-enum
  - id: micro-behaviors/fs/path/public-key::python-ssh-known-hosts-read
  unless:
  - id: well-known/app/network/openssh::package-context
  - id: well-known/lib/network/native/curl::windows-runtime-library
