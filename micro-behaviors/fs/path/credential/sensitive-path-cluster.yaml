defaults:
  platforms: [unix]
  for: [go, elf]

composite_rules:
  - id: private-key-sensitive-path-cluster
    desc: Private-key and additional sensitive path references
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/private-key::ssh-private-key
    any:
      - id: micro-behaviors/fs/path/config/accounts::go-system-secret-paths
      - id: micro-behaviors/fs/path/personal::root-bash-history-path
    unless:
      # Augustus ships root-credential path lists as detector probe corpus.
      - id: well-known/tool/detection/augustus::llm-probe-corpus-context
