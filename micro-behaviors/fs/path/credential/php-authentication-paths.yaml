defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
composite_rules:
  # Preserve one alternative in sensitive-path-panel's needs: 2 threshold.
  - id: php-account-or-ssh-public-key-path
    desc: PHP names an account or SSH authentication path
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/account-db::php-passwd-path-reference
      - id: micro-behaviors/fs/path/public-key::authorized-keys-path-reference
