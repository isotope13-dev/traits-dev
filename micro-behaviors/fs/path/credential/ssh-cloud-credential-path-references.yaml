composite_rules:
- platforms:
  - unix
  - windows
  - macos
  for:
  - scripts
  - binaries
  - source
  id: ssh-or-cloud-credential-path-references
  desc: SSH or cloud credential path references
  crit: notable
  any:
  - id: micro-behaviors/fs/path/private-key::ssh-id-rsa-filename-reference
  - id: micro-behaviors/fs/path/token::gcloud-credentials
  - id: micro-behaviors/fs/path/secret-config::gcp-default-credentials
