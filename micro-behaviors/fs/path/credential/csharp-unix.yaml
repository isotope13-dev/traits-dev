defaults:
  platforms: [unix, windows]
  for: [csharp, pe]
  attack: T1041

traits:
  - id: csharp-unix-secret-file-list
    desc: C# Unix secret file list
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\.ssh/id_rsa[\s\S]{0,260}\.netrc[\s\S]{0,260}\.aws/credentials'

  # `csharp-env-secret-filter` lived here. A single enumeration-plus-keyword
  # regex is a capability, not an objective, so it now lives as the neutral
  # `micro-behaviors/os/env/enumeration::dotnet-env-secret-filter` atom that
  # the composites below reference cross-directory.
