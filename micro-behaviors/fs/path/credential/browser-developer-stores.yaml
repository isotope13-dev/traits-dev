defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, python, pyc, rust, go, c, cpp, objc, javascript, typescript]
composite_rules:
  - id: browser-developer-ssh-store-paths
    desc: Browser, developer and SSH store references
    crit: notable
    conf: 0.96
    all:
      - id: browser-store-reference
      - id: micro-behaviors/fs/path/token::developer-credential-stores
      - id: micro-behaviors/fs/path/credential::ssh-key-or-host-store-reference
  - id: browser-ftp-credential-paths
    for: [binaries, '!dex', scripts, '!jcl']
    desc: Browser and FTP credential-store references
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/password-store::firefox-profile-credential-stores
      - id: micro-behaviors/fs/path/password-store::filezilla-configuration-path-references

  - id: browser-store-reference
    desc: Browser credential-store or profile references
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/fs/path/cookie::browser-sensitive-data
      - id: micro-behaviors/fs/path/password-store::login-data
      - id: micro-behaviors/fs/path/cookie::browser-cookies-file-path
      - id: micro-behaviors/fs/path/application/browser::profiles-ini
