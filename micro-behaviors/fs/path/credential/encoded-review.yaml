traits:
- id: encoded-kubernetes-serviceaccount-path
  desc: Decoded Kubernetes service-account artifact path
  conf: 0.95
  if:
    type: encoded
    regex: secrets/kubernetes\.io/serviceaccount/(token|ca\.crt|namespace)
composite_rules:
- id: encoded-cloud-or-registry-path-cluster
  desc: Decoded cloud and registry credential paths
  conf: 0.96
  all:
  - id: micro-behaviors/fs/path/credential::encoded-kubernetes-serviceaccount-path
  - id: micro-behaviors/fs/path/secret-config::encoded-registry-credential-path
defaults:
  platforms:
  - unix
  for:
  - python
  crit: notable
