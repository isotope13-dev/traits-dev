# Authentication artifacts created by local AI agents. These are neutral path
# capabilities; collection intent is inferred by objective composites.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source, javascript, typescript, python, powershell, shell, go, rust, c, cpp]
  crit: notable
  conf: 0.94

traits:
  - id: codex-auth-artifact-path
    desc: Codex authentication artifact path
    if:
      type: text
      regex: '(?i)\.codex[/\\]auth\.json\b'

  - id: claude-auth-artifact-path
    desc: Claude Code authentication artifact path
    if:
      type: text
      regex: '(?i)\.claude[/\\]\.credentials\.json\b'

  - id: copilot-hosts-auth-artifact-path
    desc: GitHub Copilot hosts auth artifact path
    if:
      type: text
      regex: '(?i)\.copilot[/\\]hosts\.json\b'

  - id: kiro-sso-auth-artifact-path
    desc: Kiro AWS SSO authentication artifact path
    if:
      type: text
      regex: '(?i)\.aws[/\\]sso[/\\]cache[/\\]kiro-auth-token\.json\b'

  # Bundled and minified modules build these artifact paths at runtime from
  # separate string literals -- join(home, ".codex"), ("auth.json") -- so the
  # joined-path atoms above never see them. Match the join-argument adjacency
  # instead: a config directory literal beside an auth filename literal is the
  # same store reference, whatever the bundler did to the path.
  - id: dot-agent-dir-adjacent-auth-filename
    desc: Agent dot-directory joined to auth filename
    conf: 0.92
    if:
      type: text
      regex: '["'']\.[a-z]{2,12}["'']\)?\s*,\s*["''](\.credentials\.json|auth\.json)["'']'

  - id: opencode-dir-adjacent-auth-filename
    desc: OpenCode directory joined to auth filename
    conf: 0.92
    if:
      type: text
      regex: '["'']opencode["'']\s*,\s*["'']auth\.json["'']'

  # The macOS generic-password item Claude Code persists its OAuth token
  # under (`security find-generic-password -s "Claude Code-credentials"`).
  # Tools that read the stored token spell the service name; its presence is
  # a store reference, not a read.
  - id: claude-code-keychain-service-name
    desc: Claude Code macOS keychain service name
    conf: 0.95
    if:
      type: text
      substr: 'Claude Code-credentials'

composite_rules:
  # Two distinct agent auth stores referenced through runtime-joined literals.
  - id: agent-config-dir-adjacent-auth-filename
    desc: Multiple agent auth stores joined at runtime
    conf: 0.92
    any:
      - id: dot-agent-dir-adjacent-auth-filename
      - id: opencode-dir-adjacent-auth-filename
    needs: 2
