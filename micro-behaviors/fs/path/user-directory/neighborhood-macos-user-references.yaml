# Home and user-directory references do not establish enumeration.
defaults:
  for:
  - macho
  - objc
  - swift
  - applescript
  platforms:
  - macos
  crit: notable
composite_rules:
- id: macos-user-location-references
  desc: Multiple macOS user location references
  crit: notable
  conf: 0.8
  needs: 2
  any:
  - id: micro-behaviors/fs/path/user-directory::user-library-path
  - id: micro-behaviors/fs/path/user-directory::downloads-folder-target
  - id: micro-behaviors/fs/path/user-directory::documents-folder-target
  - id: micro-behaviors/os/env/user-info::home-var
