defaults:
  for: [perl]
  platforms: [unix]

traits:
  - id: perl-home-root-binding
    desc: Perl binds home to HOME environment
    crit: notable
    if:
      type: text
      regex: '\$home\s*=\s*\$ENV\{HOME\}\s*(//|;|\))'
      exclude_comments: true

  - id: perl-personal-folder-word-list
    desc: Perl lists standard personal folder names
    crit: notable
    if:
      type: text
      regex: 'qw\s*\(\s*Documents\s+Desktop\s+Pictures\s*\)'
      exclude_comments: true

