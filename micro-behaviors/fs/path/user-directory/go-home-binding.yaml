defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable

traits:
- id: go-home-userhomedir-binding
  desc: Go binds home to UserHomeDir
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '\b[Hh]ome\s*(,\s*\w+\s*)?:?=\s*os\.UserHomeDir\(\)'
- id: go-home-env-binding
  desc: Go binds home from HOME variable
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b[Hh]ome\s*(,\s*\w+\s*)?:?=\s*os\.(Getenv|LookupEnv)\(\s*"HOME"\s*\)'
- id: go-home-field-binding
  desc: Go binds home to HomeDir field
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '\b[Hh]ome\s*:?=\s*\w+\.HomeDir\b'

composite_rules:
- id: go-home-root-binding
  desc: Go binds an identifier to a home-root source
  crit: notable
  conf: 0.9
  any:
  - id: go-home-userhomedir-binding
  - id: go-home-env-binding
  - id: go-home-field-binding
