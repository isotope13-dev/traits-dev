# Node.js user Documents directory resolution under os.homedir().
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92

traits:
  - id: node-homedir-documents-join
    desc: Resolves user Documents folder via homedir
    if:
      type: text
      regex: 'homedir\s*\(\s*\)\s*,\s*["'']Documents["'']'
