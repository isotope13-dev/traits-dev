---
defaults:
  platforms:
  - windows
  for:
  - lnk
traits:
- id: lnk-relative-user-staging-dir
  desc: LNK relative path references user directory
  crit: component
  conf: 0.88
  if:
    type: value
    path: lnk.relative_path
    regex: "(?i)[\\\\/](Desktop|Downloads|Local[\\\\/]Temp)[\\\\/]"
- id: lnk-workingdir-user-desktop
  desc: LNK working directory is user Desktop
  crit: notable
  conf: 0.84
  if:
    type: value
    path: lnk.working_directory
    regex: "(?i)^C:\\\\Users\\\\[^\\\\]+\\\\Desktop$"
- id: lnk-workingdir-user-downloads
  desc: LNK working directory is user Downloads
  crit: notable
  conf: 0.84
  if:
    type: value
    path: lnk.working_directory
    regex: "(?i)^C:\\\\Users\\\\[^\\\\]+\\\\Downloads$"
