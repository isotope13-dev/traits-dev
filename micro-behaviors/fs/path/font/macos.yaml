defaults:
  platforms: [macos]
  for: [macho, shell, go]

traits:
  - id: system-font-directory-path
    desc: macOS shared font directory path
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: /Library/Fonts/

  - id: hidden-system-font-file
    desc: Hidden file in macOS shared fonts
    crit: suspicious
    conf: 0.85
    attack: T1564.001
    if:
      type: text
      regex: /Library/Fonts/\.[a-zA-Z0-9_\-]+
