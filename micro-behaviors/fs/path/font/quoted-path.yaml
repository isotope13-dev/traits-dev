defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, ruby, php, shell, powershell]
  crit: notable
  conf: 0.9

traits:
  - id: quoted-font-path
    desc: References a quoted font file path
    if:
      type: text
      regex: '["\x27][^"\x27\n]{0,100}\.(woff2?|[ot]tf|eot)["\x27]'
      case_insensitive: true
