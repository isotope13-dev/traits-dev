defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, ruby, php, shell, powershell]
  crit: notable
  conf: 0.9

traits:
  - id: quoted-font-path
    desc: References a quoted font path or URL
    # A path needs a stem before the extension. A bare `'.woff2'` is one entry
    # in an extension list (binary-file filters, MIME tables), not a file.
    # Loader and carrier references pass through URLs as often as local
    # paths, so both spellings are reported.
    if:
      type: text
      regex: '["\x27][^"\x27\n]{1,100}\.(woff2?|[ot]tf|eot)["\x27]'
      case_insensitive: true
