# opencode's own config directories.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell, json, markdown]
  crit: notable
  conf: 0.93
traits:
  - id: opencode-config-directory
    desc: OpenCode config directory path
    if:
      type: text
      regex: '["'']\.opencode["'']|[\\/]\.opencode([\\/]|$)|\.opencode[\\/]'
  - id: opencode-agents-directory
    desc: OpenCode custom agents directory path
    conf: 0.94
    if:
      type: text
      regex: '\.?opencode[\\/]agents([\\/]|$)|["'']opencode["''],\s*["'']agents["'']'
