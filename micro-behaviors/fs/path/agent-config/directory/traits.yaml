# Config *directories* created by AI coding tools -- the dot-directory each
# agent keeps in a project or home dir.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell, markdown, text]
  crit: notable
  conf: 0.9
traits:
  - id: claude-config-directory
    desc: Claude Code config directory path
    unless:
      - id: metadata/file/format/markup::adblock-filter-list
      - id: well-known/tool/detection/repo-trust-scan::repo-trust-scan-context
      - id: metadata/file/string/corpus::hashed-text-record
    if:
      type: text
      # Quoted paths and real path separators. Single `\` before `.claude` in
      # prose Windows paths (e.g. C:\Users\Bob\.claude\plans) is not a config
      # reference — only escaped `\\` in source strings or `/` on Unix.
      regex: '["'']\.claude["'']|/\.claude([\\/]|$)|\\\\\.claude([\\/]|$)'
      not:
        - regex: '\.claude[\\/]CLAUDE\.md'
  - id: claude-session-projects-directory
    desc: Claude Code session projects directory path
    crit: notable
    conf: 0.97
    for: [javascript, typescript, python, shell]
    if:
      type: text
      regex: '(?i)[\\/]\.claude[\\/]projects([\\/]|$)|["'']\.claude["'']\s*(/|,)\s*["'']projects["'']'
  - id: gemini-config-directory
    desc: Gemini CLI config directory path
    unless:
      - id: micro-behaviors/fs/path/application/state::gemini-antigravity-brain-output
    if:
      type: text
      regex: '["'']\.gemini["'']|[\\/]\.gemini([\\/]|$)|\.gemini[\\/]'
  - id: codex-config-directory
    desc: Codex config directory path
    if:
      type: text
      regex: '["'']\.codex["'']|[\\/]\.codex([\\/]|$)|\.codex[\\/]'
  - id: codex-absolute-config-directory
    desc: Absolute Codex config directory path
    if:
      type: literal
      kind: string
      regex: '[\\/]\.codex$'
  - id: codex-skills-directory
    desc: Codex skills directory path
    if:
      type: text
      regex: '\.codex[\\/]skills[\\/]'

  # Claude's skill roots: `~/.agents/skills/` (Claude Code) and
  # `<Claude config>/agents/skills/` (Claude Desktop). Matched as path
  # segments, so any implementation hits regardless of what the surrounding
  # code names its variables.
  - id: agents-skills-directory
    desc: Claude agents skills directory path
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '[\\/]\.?agents[\\/]skills[\\/]'

  # Same directory, built segment-by-segment (path.join(h, '.agents',
  # 'skills', …) / os.path.join / Join-Path) rather than written as a literal.
  - id: claude-skills-directory
    desc: Claude Code skills directory path
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\.claude[\\/]skills[\\/]'
  - id: openclaw-workspace-assistant-skills-path
    desc: OpenClaw workspace-assistant skills path
    if:
      type: text
      regex: 'workspace-assistant-\$\{[A-Za-z_$][A-Za-z0-9_$]*\}.{0,80}["'']skills["'']'
  - id: openclaw-skills-path-join
    desc: OpenClaw skills directory path join
    if:
      type: text
      regex: 'join\(.{0,60},\s*["'']skills["'']\)'
  - id: openclaw-config-directory
    desc: OpenClaw config directory path
    if:
      type: text
      regex: '["'']\.openclaw["'']|[\\/]\.openclaw([\\/]|$)|\.openclaw[\\/]'
  - id: hermes-config-directory
    desc: Hermes agent config directory path
    crit: notable
    conf: 0.96
    for: [javascript, typescript, python, shell, powershell]
    if:
      type: text
      regex: '["'']\.hermes["'']|[\\/]\.hermes([\\/]|$)|\.hermes[\\/]'
  - id: claude-commands-directory
    desc: Claude commands directory path
    ref: sha256:f9b935ef1d644960445911670b391fed77ba2cc0a5024fc114eaa19c7b5c0aab
    unless:
      - id: metadata/file/format/markup::adblock-filter-list
    if:
      type: text
      regex: '\.claude[\\/]commands[\\/]'
  - id: gemini-antigravity-skills-directory
    desc: Gemini Antigravity skills directory path
    ref: sha256:f9b935ef1d644960445911670b391fed77ba2cc0a5024fc114eaa19c7b5c0aab
    if:
      type: text
      regex: '\.gemini[\\/]antigravity[\\/]skills[\\/]'
  - id: eigent-config-directory
    desc: Eigent config directory path
    if:
      type: text
      regex: '["'']\.eigent["'']|[\\/]\.eigent([\\/]|$)|\.eigent[\\/]'
  - id: cursor-config-directory
    desc: Cursor config directory path
    # The bare `\.cursor[\\/]` form must be a path segment, not a property
    # access followed by division (e.g. minified `o.cursor/100`), so require a
    # non-identifier delimiter before it (char class, not an extra alternation).
    unless:
      - id: metadata/file/format/markup::adblock-filter-list
      - id: well-known/tool/detection/repo-trust-scan::repo-trust-scan-context
      - id: well-known/lib/ui/monaco-editor/
    if:
      type: text
      regex: '["'']\.cursor["'']|[\\/]\.cursor([\\/]|$)|[\s"''`(=:,]\.cursor[\\/]'
  - id: opencode-skills-directory
    desc: OpenCode skills directory path
    ref: sha256:f9b935ef1d644960445911670b391fed77ba2cc0a5024fc114eaa19c7b5c0aab
    if:
      type: text
      regex: '\.opencode[\\/]skills[\\/]'
  - id: windsurf-config-directory
    desc: Windsurf config directory path
    if:
      type: text
      regex: '[\\/]\.windsurf([\\/]|$)|\.codeium[\\/]windsurf'
  - id: windsurf-quoted-config-directory
    desc: Windsurf quoted config directory
    if:
      type: text
      regex: '["'']\.windsurf["'']|\.windsurf[\\/]'
  - id: pearai-config-directory
    desc: PearAI config directory path
    if:
      type: text
      regex: '["'']\.pearai["'']|[\\/]\.pearai([\\/]|$)|\.pearai[\\/]'
composite_rules:
  - id: ai-coding-tool-config-directory-cluster
    desc: Multiple AI coding tool config directories
    crit: notable
    conf: 0.92
    needs: 2
    unless:
      - id: metadata/file/format/markup::adblock-filter-list
      - id: well-known/tool/detection/repo-trust-scan::repo-trust-scan-context
    any:
      - id: micro-behaviors/fs/path/agent-config/directory::cursor-config-directory
      - id: claude-config-directory
      - id: gemini-config-directory
      - id: codex-config-directory
      - id: micro-behaviors/fs/path/agent-config/directory::windsurf-config-directory
      - id: micro-behaviors/fs/path/agent-config/directory::windsurf-quoted-config-directory
      - id: micro-behaviors/fs/path/agent-config/directory::pearai-config-directory
      - id: eigent-config-directory
      - id: openclaw-config-directory
      - id: hermes-config-directory
  - id: ai-agent-skill-install-directory
    desc: AI agent skill install directory
    crit: notable
    conf: 0.93
    ref: sha256:f9b935ef1d644960445911670b391fed77ba2cc0a5024fc114eaa19c7b5c0aab
    any:
      - id: codex-skills-directory
      - id: claude-commands-directory
      - id: agents-skills-directory
      - id: micro-behaviors/fs/path/agent-config/file::agents-skills-path-join
      - id: claude-skills-directory
      - id: micro-behaviors/fs/path/agent-config/directory::opencode-skills-directory
      - id: gemini-antigravity-skills-directory
