traits:
- id: claude-config-file-operation
  desc: File commands reference Claude config directory
  conf: 0.92
  if:
    type: text
    regex: (?m)\b(curl|cp|mv|install)\b[^\n]{0,80}/\.claude/\S{1,80}
  crit: notable
  for:
  - shell
  - python
  - javascript
  - typescript
  - text
  - json
  platforms:
  - unix
