defaults:
  platforms: [windows, unix]
  for: [markdown, shell, python, javascript, typescript]
  crit: notable
  conf: 0.9
traits:
  - id: pi-global-agent-path
    desc: Pi global agent configuration directory path
    if:
      # Preserved from agent-instructions: this directory is also the models,
      # authentication and session store, so it cannot imply an AGENTS.md file.
      type: text
      regex: '(\.pi/agent|["'']\.pi["'']\s*,\s*["'']agent["''])'
