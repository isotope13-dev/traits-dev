# Individual config and settings files written by AI coding tools.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell, markdown, text]
  crit: notable
  conf: 0.9
traits:
  - id: claude-settings-json
    desc: Claude Code project settings JSON path
    crit: notable
    conf: 0.97
    for: [json]
    if:
      type: path
      regex: '(?i)(^|[\\/])\.claude[\\/]settings\.json$'
  - id: claude-settings-path-binary
    desc: Claude Code settings path in binary
    crit: notable
    conf: 0.97
    for: [binaries]
    if:
      type: text
      substr: .claude/settings.json
  - id: claude-project-settings-path
    desc: Claude Code project settings path
    crit: notable
    conf: 0.96
    for: [javascript, typescript, python, shell, powershell, ruby]
    if:
      type: string_literal
      regex: '(?i)(^|[\\/])\.claude[\\/]settings\.json$'
  - id: claude-global-settings-path
    desc: Claude Code global settings path
    crit: notable
    conf: 0.96
    for: [python, shell]
    if:
      type: text
      regex: '(?i)(~|[$]HOME)[\\/]\.claude[\\/]settings\.json|Path\.home\(\)\s*/\s*["'']\.claude["'']'
  - id: claude-global-settings-path-js
    desc: JavaScript Claude settings path
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: 'path\.join\(os\.homedir\(\),\s*["'']\.claude["'']\s*,\s*["'']settings\.json["'']\s*\)'

  # The constant name projects use for the path above.  Relocated from
  # well-known/app/ai/gateway/neurolink, where the same substring was described as a
  # "NeuroLink Claude settings path" and so attributed every unrelated
  # TypeScript project that names this constant to that product.
  - id: claude-settings-path-constant
    desc: CLAUDE_SETTINGS_PATH constant reference
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: 'CLAUDE_SETTINGS_PATH'
  - id: claude-session-history-file
    desc: Claude Code session history file path
    crit: notable
    conf: 0.97
    for: [javascript, typescript, python, shell]
    if:
      type: text
      regex: '(?i)[\\/]\.claude[\\/]history\.jsonl|["'']\.claude["'']\s*/\s*["'']history\.jsonl["'']'
  - id: codex-global-hooks-path
    desc: Codex global hooks path
    crit: notable
    conf: 0.96
    for: [python, shell]
    if:
      type: text
      regex: '(?i)(~|[$]HOME)[\\/]\.codex[\\/]hooks\.json|Path\.home\(\)\s*/\s*["'']\.codex["'']'
  - id: codex-config-toml
    desc: Codex config TOML path
    ref: sha256:a709234609a3c0423f68d9ebc1c219f349879cb4f29786d2d5e797e6b098cfd3
    if:
      type: text
      regex: '\.codex[\\/]config\.toml|["'']\.codex["'']\s*/\s*["'']config\.toml'
  - id: agents-skills-path-join
    desc: Joins a Claude agents skills directory path
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '["'']\.?agents["'']\s*,\s*["'']skills["'']'
  - id: openclaw-paired-operator-state
    desc: References OpenClaw paired operator state
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: 'paired\.json[\s\S]{0,700}(roles|scopes)[\s\S]{0,700}operator'
      case_insensitive: true
  - id: openclaw-workspace-soul-path
    desc: OpenClaw workspace SOUL identity path
    crit: notable
    conf: 0.98
    for: [javascript, typescript, python, shell]
    if:
      type: string_literal
      regex: '(?i)(^|[\\/])\.openclaw[\\/]workspace[\\/]SOUL\.md$'
  - id: openclaw-config-json-literal
    desc: Literal .openclaw/openclaw.json path segment
    crit: notable
    conf: 0.96
    for: [python, shell, javascript, typescript]
    if:
      type: text
      regex: '\.openclaw[\\/]openclaw\.json'
  - id: openclaw-config-json-path-join
    desc: Path.home join for openclaw.json
    crit: notable
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: 'Path\.home\(\)\s*/\s*["'']\.openclaw["'']\s*/\s*["'']openclaw\.json["'']'
  - id: ai-plugin-registry-files
    desc: AI plugin registry filenames
    crit: notable
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: text
      regex: 'known_marketplaces\.json[\s\S]{0,120}installed_plugins\.json'
  - id: claude-desktop-config-path
    desc: Claude Desktop configuration file path
    crit: notable
    conf: 0.96
    if:
      type: text
      # Require path/IO context; a help paragraph that merely names the
      # configuration file is not a file-path operation.
      regex: '(?i)\b(path|open|read|write)\b.{0,24}claude[_-]desktop[_-]config\.json'
  - id: claude-desktop-local-storage-path
    desc: Claude Desktop Local Storage path
    crit: notable
    conf: 0.9
    for: [scripts, binaries, source]
    if:
      type: text
      # This identifies the application-state directory only. Reading records
      # from its LevelDB can support benign session/group migration as well as
      # credential theft; secret terms supply that intent in the objective.
      regex: '(?i)Claude.{0,24}Local Storage.{0,24}(leveldb|Default)'

  # Claude Code hook *protocol* behaviors (PreToolUse, UserPromptSubmit, updatedInput,
  # hookSpecificOutput, …) live in micro-behaviors/communications/ipc/agent-hook/ —
  # they are agent IPC, not config paths. This file keeps only config-path detections.
  - id: codex-hook-script
    desc: Codex hook script path
    if:
      type: text
      regex: '\.codex[\\/]hooks[\\/].{1,120}\.sh'
  - id: agent-instruction-path-literal
    desc: References an AI agent instruction path
    for: [javascript, typescript, python, shell]
    if:
      type: literal
      regex: '(^|[\\/])(AGENTS|CLAUDE|GEMINI)\.md$'
composite_rules:
  - id: claude-settings-path-reference
    desc: Claude Code settings path reference
    crit: notable
    conf: 0.97
    any:
      - id: claude-settings-json
      - id: claude-settings-path-binary
      - id: claude-project-settings-path
      - id: claude-global-settings-path
      - id: claude-global-settings-path-js
  - id: openclaw-config-json-path
    desc: OpenClaw openclaw.json config path
    crit: notable
    conf: 0.96
    any:
      - id: openclaw-config-json-literal
      - id: openclaw-config-json-path-join
