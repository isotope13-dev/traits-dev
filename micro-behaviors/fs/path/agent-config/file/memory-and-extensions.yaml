# Files in these directories are loaded by coding agents as durable memory,
# commands, workflows, prompts, or agent definitions. Their presence is a
# neutral but notable control-plane fact; edit intent must come from the tool
# event that wrote them.
defaults:
  platforms: [unix, windows]
  for: [markdown, text, yaml, json]
  crit: notable
  conf: 0.94

traits:
  - id: agent-memory-store-path
    desc: AI agent durable memory path
    if:
      type: path
      regex: '[\\/](agent-memory(-local)?|memories|memory)[\\/]'

  - id: agent-command-definition-path
    desc: AI agent command definition path
    if:
      type: path
      regex: '\.(claude|codex|gemini)[\\/](commands|agents|prompts)[\\/]'

  - id: agent-workflow-definition-path
    desc: AI agent workflow definition path
    if:
      type: path
      regex: '\.(cursor|windsurf|cline)[\\/](agents|workflows)[\\/]'

  - id: claude-output-style-path
    desc: Claude output style definition path
    if:
      type: path
      regex: '\.claude[\\/]output-styles[\\/]'
