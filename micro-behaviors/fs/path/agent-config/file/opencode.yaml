# opencode config files, and the roll-up over every agent config file --
# which now sits with the traits it counts.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell, json, markdown]
  crit: notable
  conf: 0.93
traits:
  - id: opencode-config-json-path
    desc: OpenCode config JSON path
    conf: 0.96
    if:
      type: text
      regex: 'opencode[\\/]opencode\.json|["'']opencode\.json["'']'
composite_rules:
  - id: ai-agent-config-file-target
    desc: Targets an AI coding agent config file
    crit: notable
    conf: 0.94
    unless:
      - id: well-known/tool/detection/repo-trust-scan::repo-trust-scan-context
    any:
      - id: opencode-config-json-path
      - id: micro-behaviors/fs/path/agent-config/file::claude-settings-json
      - id: micro-behaviors/fs/path/agent-config/file::claude-project-settings-path
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js
      - id: micro-behaviors/fs/path/agent-config/file::codex-config-toml
      - id: micro-behaviors/fs/path/agent-config/file::openclaw-config-json-path
      - id: micro-behaviors/fs/path/agent-config/file::claude-desktop-config-path
      - id: micro-behaviors/fs/path/agent-config/mcp::kiro-settings-mcp-config-path
