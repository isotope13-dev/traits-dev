defaults:
  platforms: [unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: alibaba-staragent-config-path
    desc: Alibaba StarAgent configuration path
    if:
      type: text
      substr: '/home/staragent/conf/argusMonitor.conf'

  - id: container-escape-mountinfo-probe
    desc: Filters mountinfo for container sockets
    if:
      type: text
      regex: 'mountinfo[\s\S]{0,240}(docker\.sock|containerd\.sock|kubelet)'

  - id: proc-1-root-host-fs-path
    desc: References /proc/1/root host filesystem path
    if:
      type: text
      substr: '/proc/1/root'

  - id: proc-status-capeff-sys-admin-check
    desc: Checks CAP_SYS_ADMIN in process status
    if:
      type: text
      regex: 'CapEff:[\s\S]{0,320}CAP_SYS_ADMIN'
