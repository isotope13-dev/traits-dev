defaults:
  platforms: [unix]
  for: [shell, python]
  crit: notable
traits:
  - id: nfs-preserves-client-root
    desc: NFS export preserves client root privileges
    conf: 0.95
    if:
      type: text
      regex: '\([^()\n]{0,160}\bno_root_squash\b'
  - id: nfs-all-hosts-root-export
    desc: NFS export allows root from any host
    conf: 0.97
    if:
      type: text
      regex: '\*\([^()\n]{0,160}\bno_root_squash\b'
