# Remounting the root filesystem read-write. On Android and hardened Linux the
# root mount is read-only by default; a `mount -o rw,remount /` is the standard
# first step after gaining root to make the system partition writable. Neutral
# mechanic — rooting frameworks do it too; intent lives in composites.
defaults:
  platforms: [android, linux]
  for: [shell, java, kotlin, python, javascript, ruby, perl]

traits:
  - id: remount-root-writable
    desc: Remounts root filesystem read-write
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)mount\s+-o\s+\S*remount\S*\s+/(\s|;|\||$)'
