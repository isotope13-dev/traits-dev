# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: mount-syscall
    desc: Requests a filesystem mount
    crit: notable
    if:
      type: syscall
      name: [mount]
      arch: [x86_64, aarch64]
  - id: bind-mount-syscall
    desc: Requests a bind mount
    crit: notable
    if:
      type: syscall
      name: [mount]
      arch: [x86_64, aarch64]
      args:
        - index: 3
          mask: 4096
  - id: mount-api-syscall
    desc: Uses descriptor-based mount APIs
    crit: notable
    if:
      type: syscall
      name: [fsopen, fsconfig, fsmount, fspick, open_tree, move_mount, mount_setattr]
      arch: [x86_64, aarch64]
  - id: pivot-root-syscall
    desc: Changes the root mount
    crit: notable
    if:
      type: syscall
      name: [pivot_root]
      arch: [x86_64, aarch64]
