defaults:
  platforms: [linux]
  for: [scripts, source, binaries]
  crit: suspicious
traits:
  - id: bind-over-process-directory
    desc: Bind mount overlays process procfs metadata
    conf: 0.96
    if:
      type: text
      regex: '\bmount\s+(--bind|-o\s+bind)\s+\S+\s+/proc/(%[du]|\d+|\$\{?\w+\}?)\b'
