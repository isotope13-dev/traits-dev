defaults:
  platforms: [linux]
  for: [scripts, source, binaries]
  crit: suspicious
traits:
  - id: bind-over-process-directory
    desc: Bind-mount command targets process procfs
    conf: 0.96
    downgrade:
      any:
        - id: well-known/app/infrastructure/systemd::systemd-integration-test-path
    if:
      type: text
      regex: '\bmount\s+(-n\s+)?(--bind|-o\s+bind)\s+\S+\s+/proc/(%[dsu]|\d+|\$\{?\w+\}?)/?([\s"'';]|$)'
