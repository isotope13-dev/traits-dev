defaults:
  platforms: [linux]
  for: [scripts, source, binaries]
  crit: suspicious
traits:
  - id: bind-over-process-directory
    desc: Bind-mount command targets process procfs
    conf: 0.96
    if:
      type: text
      regex: '\bmount\s+(-n\s+)?(--bind|-o\s+bind)\s+\S+\s+/proc/(%[dsu]|\d+\b|\$\{?\w+\}?)'
