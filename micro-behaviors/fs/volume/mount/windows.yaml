defaults:
  platforms: [windows]
  for: [python, pe, dll]

traits:
  - id: net-use-unc-mount
    desc: Mounts a UNC share with net use
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: Mount a UNC network share using net use.

  - id: powershell-disk-image-mount
    desc: PowerShell mounts a disk image
    crit: notable
    conf: 0.97
    for: [powershell]
    if:
      type: symbol
      kind: call
      exact: Mount-DiskImage

  - id: embedded-powershell-disk-image-mount
    desc: Embeds a PowerShell Mount-DiskImage command
    crit: notable
    conf: 0.94
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)\bMount-DiskImage\b[^\r\n]{0,160}\b-ImagePath\b'

  - id: diskpart-virtual-disk-attach
    desc: Attaches a selected virtual disk with DiskPart
    crit: notable
    conf: 0.97
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?is)\bselect\s+vdisk\s+file\s*=.{1,240}\battach\s+vdisk\b'

  - id: open-virtual-disk-api
    desc: Opens a Windows virtual disk
    crit: notable
    conf: 0.94
    for: [c, cpp, csharp, go, rust, pe, dll]
    if:
      type: symbol
      exact: OpenVirtualDisk

  - id: attach-virtual-disk-api
    desc: Attaches a Windows virtual disk
    crit: notable
    conf: 0.96
    for: [c, cpp, csharp, go, rust, pe, dll]
    if:
      type: symbol
      exact: AttachVirtualDisk

  - id: powershell-disk-image-dismount
    desc: PowerShell dismounts a disk image
    crit: notable
    conf: 0.96
    for: [powershell]
    if:
      type: symbol
      kind: call
      exact: Dismount-DiskImage

  - id: embedded-powershell-disk-image-dismount
    desc: Embeds a PowerShell Dismount-DiskImage command
    crit: notable
    conf: 0.93
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)\bDismount-DiskImage\b[^\r\n]{0,160}\b-ImagePath\b'

  - id: diskpart-virtual-disk-detach
    desc: Detaches a selected virtual disk with DiskPart
    crit: notable
    conf: 0.96
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?is)\bselect\s+vdisk\s+file\s*=.{1,240}\bdetach\s+vdisk\b'

  - id: detach-virtual-disk-api
    desc: Detaches a Windows virtual disk
    crit: notable
    conf: 0.95
    for: [c, cpp, csharp, go, rust, pe, dll]
    if:
      type: symbol
      exact: DetachVirtualDisk

composite_rules:
  - id: virtual-disk-attach
    desc: Attaches a Windows virtual disk image
    crit: notable
    conf: 0.96
    for: [scripts, source, binaries]
    any:
      - id: powershell-disk-image-mount
      - id: embedded-powershell-disk-image-mount
      - id: diskpart-virtual-disk-attach
      - id: attach-virtual-disk-api

  - id: virtual-disk-detach
    desc: Detaches a Windows virtual disk image
    crit: notable
    conf: 0.95
    for: [scripts, source, binaries]
    any:
      - id: powershell-disk-image-dismount
      - id: embedded-powershell-disk-image-dismount
      - id: diskpart-virtual-disk-detach
      - id: detach-virtual-disk-api
