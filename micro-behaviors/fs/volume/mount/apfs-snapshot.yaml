# macOS APFS snapshot mounting.
#
# Time Machine keeps rolling local APFS snapshots of the boot volume. Mounting
# one produces a second, read-only view of the same files at a different path.
#
# These are neutral mechanics — Time Machine, Carbon Copy Cloner, ChronoSync
# and Apple's own installer tooling all mount snapshots legitimately. The
# evasion reading (a snapshot mountpoint is not the path TCC guards, so the
# same user data is readable there without consent) lives in
# objectives/evasion/tcc-manipulation/bypass/.
defaults:
  platforms: [macos]
  for: [scripts, source, macho]
  attack: T1006

traits:
  - id: apfs-snapshot-mount-command
    desc: Mounts an APFS volume or snapshot
    crit: notable
    conf: 0.92
    if:
      type: text
      word: mount_apfs

  - id: apfs-nobrowse-mount-option
    desc: Mounts a volume hidden from Finder (nobrowse)
    # nobrowse keeps the mountpoint off the desktop and out of Finder's
    # sidebar. Ordinary for helper mounts; worth surfacing because it is also
    # how a mount is kept invisible to the logged-in user.
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '-o\s+[a-z,]{0,24}nobrowse'

  - id: timemachine-local-snapshot-list
    desc: Enumerates Time Machine local APFS snapshots
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'tmutil\s+listlocalsnapshots?\b'

  - id: timemachine-snapshot-identifier
    desc: Time Machine APFS snapshot name prefix
    # Local snapshots are always named com.apple.TimeMachine.<date>-<seq>, so
    # code that builds or parses that prefix is addressing a snapshot by name.
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: com.apple.TimeMachine.
