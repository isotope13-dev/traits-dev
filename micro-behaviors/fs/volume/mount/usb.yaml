defaults:
  crit: notable
  platforms: [unix, ios]
  for: [binaries, scripts]

traits:
  - id: usb-device-sysfs-path
    desc: USB device sysfs path
    conf: 0.88
    if:
      type: text
      substr: /sys/bus/usb/devices
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: ios-media-directory
    desc: iOS media directory path
    conf: 0.86
    if:
      type: text
      substr: /private/var/mobile/Media
