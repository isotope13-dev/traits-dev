defaults:
  crit: notable
  conf: 0.66
  platforms: [linux, macos]
  for: [elf, macho, c]
traits:
  - id: mount-underscore
    desc: Mounts a file system via _mount
    if:
      type: symbol
      exact: _mount
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: mount-fn
    desc: Mounts a file system
    if:
      type: symbol
      exact: mount
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
composite_rules:
  - id: mount
    desc: Mount file systems
    any:
      - id: mount-underscore
      - id: mount-fn
