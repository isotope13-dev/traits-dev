defaults:
  crit: notable
  platforms:
    - unix
    - android
    - ios
  for:
    - shell
traits:
  - id: mount-keyword
    desc: References filesystem mounting
    conf: 0.6
    if:
      type: string_literal
      word: mount
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
    downgrade:
      any:
        # Package descriptions such as "sshfs: mount remotes" are metadata,
        # not a mount command executed by the recipe.
        - id: metadata/file/string/identity::pkgbuild-basename
  - id: fstab-file
    desc: References the fstab filesystem table
    conf: 0.7
    if:
      type: string_literal
      word: fstab
  - id: remount-keyword
    desc: remount keyword (remount filesystem)
    conf: 0.7
    if:
      type: string_literal
      word: remount
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: pseudo-filesystem-mount-command
    desc: Mounts devpts or tmpfs pseudo-filesystem
    conf: 0.92
    if:
      type: text
      regex: '(?m)^\s*mount\s+-t\s+(devpts|tmpfs)\s+\S+\s+/dev/(pts|shm)\b'
  # Match the option list, including reversed order and quoted arguments in
  # embedded commands. Require complete tokens: noexec is not exec. Other
  # options may precede the flags or separate remount from a final exec.
  # Require exec last, or followed only by remount, so a later noexec cannot
  # contradict the executable-remount claim.
  # The operation alone is neutral; service-launcher abuse is composed in
  # objectives/persistence/system/service/runit.
  - id: remount-executable-flag
    desc: Remount command requests executable permission
    conf: 0.94
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '\bmount\s+-o\s+["'']?[\w,]*\b(remount,[\w,]*\bexec|exec,remount)["'']?\s'
  # IoT botnets stage payloads over NFS: the injection mounts the operator's
  # export (host:/path source) with exec among the options, then runs the
  # binary straight from the mountpoint. A local exec remount has no
  # host:/path source and stays in the remount trait above.
  - id: remote-export-exec-mount
    desc: Mounts a remote export with exec permission
    conf: 0.9
    if:
      type: text
      regex: '\bmount\s+[^;|&\n]{0,80}-o\s+[a-z0-9_,]*exec[a-z0-9_,]*\s+\S+:/\S+'
composite_rules:
  - id: mount-context
    desc: References filesystem mounting commands or configuration
    conf: 0.6
    any:
      - id: fstab-file
      - id: remount-keyword
  - id: mount-command
    desc: Shell combines mount with fstab/remount
    conf: 0.66
    all:
      - id: mount-keyword
      - id: mount-context
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
