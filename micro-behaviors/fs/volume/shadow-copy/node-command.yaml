defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-vssadmin-delete-argument
    desc: Node child call carries VSS deletion
    crit: component
    conf: 0.97
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: [(identifier) @callee
            (member_expression property: (property_identifier) @callee)]
          arguments: (arguments . (string) @command))
          (#match? @callee "^exec(Sync)?$")
          (#match? @command "(?i)^['\"]vssadmin(\\.exe)?[ \\t]+delete[ \\t]+shadows\\b"))
  - id: node-powershell-shadow-delete-argument
    desc: Node child call carries shadow-copy removal
    crit: component
    conf: 0.97
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: [(identifier) @callee
            (member_expression property: (property_identifier) @callee)]
          arguments: (arguments . (string) @program .
            (array . (string) @flag . (string) @script)))
          (#match? @callee "^(execFile|spawn)(Sync)?$")
          (#match? @program "(?i)^['\"]powershell(\\.exe)?['\"]$")
          (#match? @flag "(?i)^['\"]-Command['\"]$")
          (#match? @script "(?i)Get-(Cim|Wmi)Instance[ \\t]+Win32_Shadowcopy")
          (#match? @script "(?i)\\|[ \\t]*Remove-(CimInstance|WmiObject)"))
composite_rules:
  - id: node-shadow-delete-child-command
    desc: Node invokes shadow-copy deletion
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/import/builtin::child-process-module-reference
    any:
      - id: node-vssadmin-delete-argument
      - id: node-powershell-shadow-delete-argument
