# Shadow-copy deletion capabilities; attack intent belongs to their consumers.
defaults:
  platforms:
  - windows
traits:
- id: wmic-shadowcopy-delete-command
  desc: WMIC shadow-copy deletion command reference
  crit: notable
  conf: 0.7
  for:
  - scripts
  - source
  - binaries
  if:
    type: text
    regex: (?i)\bwmic(\.exe)?[\s"',]{1,6}shadowcopy[\s"',]{1,6}delete\b
  unless:
  - id: metadata/file/extension/identity::markdown-file-basename
  - id: well-known/app
  - id: well-known/lib/runtime/scripted/sandbox-runtime/
  - id: well-known/tool
  - id: micro-behaviors/process/create/shell/guard/
  - id: micro-behaviors/metaprogramming/generation::configured-source-builder
  - id: metadata/build/generated::generated-attack-map-context
- for:
  - pe
  - dll
  id: dotnet-vssadmin-delete-arguments
  desc: .NET vssadmin shadow-delete arguments
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)^delete\s+shadows(\s+/all)?(\s+/quiet)?$
- for:
  - pe
  - dll
  id: dotnet-wmic-shadowcopy-delete-arguments
  desc: .NET WMIC shadow-copy delete arguments
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: (?i)^shadowcopy\s+delete$
- for:
  - scripts
  - source
  - binaries
  id: wmic-shadowcopy-where-delete
  desc: WMI shadow copy deletion filtered by ID
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?i)\bwmic(\.exe)?\s+shadowcopy\s+where\s+.{0,180}\bID\s*=\s*["'].{1,120}["']\s+delete\b
- for:
  - powershell
  id: ps-shadowcopy-delete-call
  desc: Shadow-copy class near a Delete call
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?is)\bWin32_Shadowcopy\b.{0,240}\.Delete\s*\(
  not:
  - substr: .Create(
- for:
  - pe
  - dll
  crit: suspicious
  id: native-wmi-shadow-delete
  desc: XOR-hidden shadow-copy query with deletion ABI
  conf: 0.95
  if:
    type: yara
    source: "import \"pe\"\nrule native_wmi_shadow_delete {\n  strings:\n    $select = \"SELECT *\" wide xor(1-255)\n    $from = \" FROM Wi\" wide xor(1-255)\n    $class = \"n32_Shad\" wide xor(1-255)\n    $delete = { (50|51|52|53|54|55|56|57)\n                (50|51|52|53|54|55|56|57)\n                (50|51|52|53|54|55|56|57) FF 75 ??\n                8B (00|01|02|03|06|07)\n                (50|51|52|53|54|55|56|57)\n                FF 50 40 85 C0 78 ?? }\n  condition:\n    pe.is_32bit() and\n    pe.imports(\"ole32.dll\", \"CoCreateInstance\") and\n    pe.imports(\"ole32.dll\", \"CoSetProxyBlanket\") and\n    for any s in pe.sections : (\n      s.name == \".text\" and\n      $delete in (s.raw_data_offset..s.raw_data_offset+s.raw_data_size) and\n      for any a in (1..#select) : (\n        @select[a] >= s.raw_data_offset and\n        @select[a] + 16 <= s.raw_data_offset + s.raw_data_size and\n        for any b in (1..#from) : (\n          @from[b] >= s.raw_data_offset and\n          @from[b]\
      \ + 16 <= s.raw_data_offset + s.raw_data_size and\n          for any c in (1..#class) : (\n            @class[c] >= s.raw_data_offset and\n            @class[c] + 16 <= s.raw_data_offset + s.raw_data_size and\n            uint8(@select[a]+1) == uint8(@from[b]+1) and\n            uint8(@from[b]+1) == uint8(@class[c]+1)\n          )\n        )\n      )\n    )\n}\n"
composite_rules:
- id: shadow-copy-deletion-reference
  desc: Shadow-copy deletion command or API references
  crit: notable
  conf: 0.97
  for:
  - binaries
  - scripts
  - source
  any:
  - id: micro-behaviors/fs/volume/shadow-copy::vssadmin-shadow-delete-command
  - id: micro-behaviors/fs/volume/shadow-copy::wmic-shadowcopy-delete-command
  - id: micro-behaviors/fs/volume/shadow-copy::dotnet-vssadmin-shadow-delete
  - id: micro-behaviors/fs/volume/shadow-copy::dotnet-wmic-shadowcopy-delete
  - id: micro-behaviors/fs/volume/shadow-copy::wmic-shadowcopy-where-delete
  - id: micro-behaviors/fs/volume/shadow-copy::ps-wmi-shadowcopy-delete
  - id: micro-behaviors/fs/volume/shadow-copy::wmi-shadow-delete-source
  - id: micro-behaviors/fs/volume/shadow-copy::native-wmi-shadow-delete
  unless:
  - id: micro-behaviors/metaprogramming/generation::configured-source-builder
  - id: well-known/tool/detection/security-scanner::eicar-test-string-reference
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/opencode-v2-security::package-name
- for:
  - pe
  - dll
  id: dotnet-vssadmin-shadow-delete
  desc: .NET vssadmin shadow-delete command references
  crit: notable
  conf: 0.97
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/fs/path/basename::vssadmin-executable-name
  - id: micro-behaviors/fs/volume/shadow-copy::dotnet-vssadmin-delete-arguments
  unless:
  - id: well-known/lib/runtime/scripted/sandbox-runtime::dangerous-command-registry
  - id: well-known/lib/runtime/scripted/sandbox-runtime::permission-dangerous-command-registry
  - id: metadata/build/generated::generated-attack-map-context
- for:
  - pe
  - dll
  id: dotnet-wmic-shadowcopy-delete
  desc: .NET WMIC shadowcopy-delete command references
  crit: notable
  conf: 0.97
  all:
  - id: metadata/binary/framework::dotnet-assembly
  - id: micro-behaviors/fs/path/basename::wmic-executable-reference
  - id: micro-behaviors/fs/volume/shadow-copy::dotnet-wmic-shadowcopy-delete-arguments
  unless:
  - id: well-known/lib/runtime/scripted/sandbox-runtime::dangerous-command-registry
  - id: well-known/lib/runtime/scripted/sandbox-runtime::permission-dangerous-command-registry
  - id: metadata/build/generated::generated-attack-map-context
- for:
  - scripts
  - source
  - binaries
  id: ps-wmi-shadowcopy-delete
  desc: PowerShell deletes Win32_Shadowcopy instances
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/os/wmi/query::shadowcopy-cmdlet-query
  - id: micro-behaviors/os/wmi/query::shadowcopy-class-reference
  any:
  - id: micro-behaviors/fs/volume/shadow-copy::ps-shadowcopy-delete-call
  - id: micro-behaviors/os/wmi/manipulate::remove-wmi-cim-instance
  near_lines: 1
- for:
  - scripts
  - source
  id: wmi-shadow-delete-source
  desc: Shadow-copy class near DeleteInstance call
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/os/wmi/query::shadowcopy-class-reference
  - id: micro-behaviors/os/wmi/manipulate::wmi-delete-instance
  near_bytes: 512
