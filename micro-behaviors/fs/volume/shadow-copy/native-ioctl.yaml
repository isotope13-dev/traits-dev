# Observed in Lynx 571f5de9...; x86 stdcall pushes the volume snapshot
# IOCTL before the handle and indirect call. No log text or family marker.
defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: x86-volsnap-ioctl-request
    desc: x86 volume snapshot IOCTL request
    crit: notable
    conf: 0.95
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: '68 28 C0 53 00 [1-8] FF 15 ?? ?? ?? ??'
composite_rules:
  - id: native-volsnap-ioctl
    desc: Volume snapshot IOCTL with device API
    crit: notable
    conf: 0.97
    all:
      - id: x86-volsnap-ioctl-request
      - id: micro-behaviors/fs/file/handle::device-io-control-win
