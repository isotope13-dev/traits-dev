# Windows Volume Shadow Copy command and path capabilities.  These are neutral
# mechanics; credential-access intent is expressed by composites that consume
# them under objectives/.
defaults:
  platforms: [windows]
  for: [scripts, binaries]

traits:
  - id: shadow-copy-path-reference
    desc: Volume Shadow Copy device path reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\\Device\\HarddiskVolumeShadowCopy'

  - id: shadow-copy-file-copy-command
    desc: Copies a file from a VSS path
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(copy|move|robocopy|xcopy)\b[^\r\n]{0,220}\\Device\\HarddiskVolumeShadowCopy'

  - id: vssadmin-shadow-list-command
    desc: Lists VSS copies with vssadmin
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bvssadmin(\.exe)?\s+list\s+shadows\b'

  - id: vssadmin-shadow-create-command
    desc: Creates a VSS copy with vssadmin
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bvssadmin(\.exe)?\s+create\s+shadow\b'

  - id: vss-backup-components-api
    desc: Volume Shadow Copy backup API usage
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      regex: '(?i)IVssBackupComponents'
    unless:
      - id: metadata/lang/source/
      - id: well-known/lib/platform/wine/
      - id: metadata/file/string/file::wine-include-source-path
      - type: path
        basename: true
        regex: '(?i).*\.(h|hh|hpp|hxx|inc)$'

composite_rules:
  - id: vssadmin-shadow-operation
    desc: Windows Volume Shadow Copy listing or creation command
    crit: notable
    conf: 0.92
    any:
      - id: vssadmin-shadow-list-command
      - id: vssadmin-shadow-create-command
