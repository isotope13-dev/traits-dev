# Windows Volume Shadow Copy command and path capabilities.  These are neutral
# mechanics; credential-access intent is expressed by composites that consume
# them under objectives/.
defaults:
  crit: notable
  platforms: [windows]
  for: [scripts, source, binaries]

traits:
  - id: shadow-copy-path-reference
    desc: Volume Shadow Copy device path reference
    conf: 0.9
    if:
      type: text
      regex: '(?i)\\{1,2}Device\\{1,2}HarddiskVolumeShadowCopy'

  - id: shadow-copy-file-copy-command
    desc: Copy command references a VSS device path
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b(copy|move|robocopy|xcopy)\b[^\r\n]{0,220}\\Device\\HarddiskVolumeShadowCopy'

  - id: vssadmin-shadow-list-command
    desc: Lists VSS copies with vssadmin
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bvssadmin(\.exe)?\s+list\s+shadows\b'

  - id: vssadmin-shadow-create-command
    desc: Creates a VSS copy with vssadmin
    conf: 0.9
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '(?i)\bvssadmin(\.exe)?\s+create\s+shadow\b'

  - id: vssadmin-shadow-delete-command
    desc: Vssadmin shadow-copy deletion command reference
    conf: 0.9
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '(?i)\bvssadmin(\.exe)?\W{1,24}delete\W{1,24}shadows\b[^\r\n]{0,40}'

  # Resizing shadow storage to a small cap evicts existing shadow copies
  # without an explicit delete; ransomware pairs it with (or substitutes
  # it for) `vssadmin delete shadows` per fixed drive.
  - id: vssadmin-shadow-resize-command
    desc: Resizes VSS shadow storage with vssadmin
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bvssadmin(\.exe)?\s+resize\s+shadowstorage\b'

  - id: vss-backup-components-api
    desc: Volume Shadow Copy backup API reference
    conf: 0.9
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      regex: '(?i)IVssBackupComponents'
  - id: vss-snapshot-mgmt-interface
    desc: Volume Shadow Copy management interface
    conf: 0.94
    platforms: [windows, unix]
    for: [python, c, cpp, csharp, powershell, pe, dll]
    if:
      type: text
      regex: '\b(IVss(DifferentialSoftware)?SnapshotMgmt|QuerySnapshotsByVolume)\b'

composite_rules:
  - id: vssadmin-shadow-operation
    desc: Windows Volume Shadow Copy listing or creation command
    conf: 0.92
    any:
      - id: vssadmin-shadow-list-command
      - id: vssadmin-shadow-create-command
