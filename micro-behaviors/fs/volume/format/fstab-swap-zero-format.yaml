defaults:
  platforms:
  - unix
  for:
  - shell
  crit: notable
  conf: 0.95
traits:
- id: shell-fstab-swap-zero-format
  desc: Zeroes then formats block-checked fstab swap
  if:
    type: tree-sitter
    language: shell
    query: "((program\n  (variable_assignment name: (variable_name) @assigned\n  \
      \  value: (command_substitution .\n      (command name: (command_name (word)\
      \ @awk)\n        . argument: (raw_string) @filter\n        . argument: [(word)\
      \ (raw_string) (string)] @table .) .))\n  . (if_statement\n    condition: (test_command\
      \ .\n      (unary_expression operator: (test_operator) @test [(string . (simple_expansion\
      \ (variable_name) @checked) .) (string . (expansion (variable_name) @checked)\
      \ .)]) .)\n    (command name: (command_name (word) @swapoff)\n      . argument:\
      \ (word) @all .)\n    . (command name: (command_name (word) @dd)\n      . argument:\
      \ (word) @input\n      . argument: (concatenation . (word) @output_prefix .\
      \ [(simple_expansion (variable_name) @output) (expansion (variable_name) @output)\
      \ (string . (simple_expansion (variable_name) @output) .) (string . (expansion\
      \ (variable_name) @output) .)] .)) @write\n    . (command name: (command_name\
      \ (word) @format) . argument: [(simple_expansion (variable_name) @formatted)\
      \ (expansion (variable_name) @formatted) (string . (simple_expansion (variable_name)\
      \ @formatted) .) (string . (expansion (variable_name) @formatted) .)] .)))\n\
      \  (#eq? @awk \"awk\")\n  (#eq? @filter \"'$3 == \\\"swap\\\" {print $1; exit}'\"\
      )\n  (#match? @table \"^['\\\"]?/etc/fstab['\\\"]?$\")\n  (#eq? @test \"-b\"\
      )\n  (#eq? @swapoff \"swapoff\")\n  (#eq? @all \"-a\")\n  (#eq? @dd \"dd\")\n\
      \  (#eq? @output_prefix \"of=\")\n  (#match? @input \"^if=/dev/zero$\")\n  (#match?\
      \ @write \"^dd\\\\s+if=/dev/zero\\\\s+of=\\\\S+(\\\\s+bs=[1-9][0-9]*[bkKmMgGw]?)?\\\
      \\s*$\")\n  (#eq? @assigned @checked)\n  (#eq? @assigned @output)\n  (#eq? @format\
      \ \"mkswap\")\n  (#eq? @assigned @formatted)\n)\n"
  unless:
  - type: symbol
    kind: function
    exact: dd
  - id: metadata/lang/source::shell-declares-awk-function
  - id: metadata/lang/source::shell-declares-swapoff-function
  - type: symbol
    kind: function
    exact: mkswap
  - id: metadata/lang/source::shell-parser-recovery-node
