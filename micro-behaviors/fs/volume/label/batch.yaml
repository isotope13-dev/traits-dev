defaults:
  platforms:
    - "windows"
  for:
    - "batch"
traits:
  - 
    id: "batch-volume-label-command"
    desc: "Sets drive volume label"
    crit: "notable"
    conf: 0.96
    if:
      type: "value"
      path: "source.batch.command_sites[*].text"
      regex: "(?i)^label\\s+[a-z]:\\s+\\S+"
