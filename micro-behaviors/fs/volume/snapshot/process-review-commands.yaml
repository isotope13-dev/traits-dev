defaults:
  platforms: [unix, windows]
  for: [shell, powershell]
  crit: notable
  conf: 0.94

traits:
  - id: wmic-shadowcopy-delete-command
    desc: Deletes Windows shadow copies
    platforms: [unix]
    for: [shell]
    if:
      type: text
      regex: '(?i)\bwmic(\.exe)?\s+shadowcopy\s+delete\b'

