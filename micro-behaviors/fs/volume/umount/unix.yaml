defaults:
  crit: notable
  conf: 0.66
  platforms: [linux, macos]
  for: [elf, macho, c]
traits:
  - id: umount-fn
    desc: Unmounts a file system
    if:
      type: symbol
      exact: umount
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: umount2-fn
    desc: Unmounts a file system with flags
    if:
      type: symbol
      exact: umount2
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
