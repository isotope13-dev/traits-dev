defaults:
  platforms: [linux, macos]
  for: [go]
  crit: notable
  conf: 0.95

traits:
  - id: go-umount-command
    desc: Go constructs an umount child command
    if:
      type: symbol
      kind: call
      exact: exec.Command
      arg:
        index: 0
        kind: string
        exact: umount
