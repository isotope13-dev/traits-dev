defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-quick-format-drive
    desc: Batch format command requests quick format
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?im)^\s*@?format(\.(com|exe))?\s+([a-z]:|%[a-z0-9_]+%)[^\r\n&|]{0,120}/q\b'

  - id: batch-smartdrv-disk-cache
    desc: Batch invokes SMARTDRV disk cache
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)(^\s*@?|[|&]\s*)([%a-z0-9_\\/:-]{0,60}\\)?smartdrv(\.exe)?\b'

  - id: batch-format-redirect-input
    desc: Batch format command redirects input
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?im)^\s*@?format(\.(com|exe))?\s+([a-z]:|%[a-z0-9_]+%)[^\r\n&|]{0,60}<\s*\S+'
