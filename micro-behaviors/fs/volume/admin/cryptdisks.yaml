defaults:
  crit: notable
  conf: 0.95
  for:
  - shell
  platforms:
  - linux
traits:
- id: shell-cryptdisks-start-invocation
  desc: Shell invokes cryptdisks_start
  if:
    type: tree-sitter
    language: shell
    query: '((command name: (command_name (word) @callee)) (#eq? @callee "cryptdisks_start"))'
  unless:
  - type: symbol
    kind: function
    exact: cryptdisks_start
