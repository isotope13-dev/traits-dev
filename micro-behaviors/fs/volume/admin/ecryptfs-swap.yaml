defaults:
  crit: notable
  conf: 0.95
  for:
  - shell
  platforms:
  - linux
traits:
- id: shell-ecryptfs-setup-swap-invocation
  desc: Shell invokes swap encryption helper
  if:
    type: symbol
    kind: call
    exact: ecryptfs-setup-swap
  unless:
  - type: symbol
    kind: function
    exact: ecryptfs-setup-swap
  - id: metadata/lang/source::shell-parser-recovery-node
- id: shell-logged-ecryptfs-setup-swap-invocation
  desc: Logging wrapper invokes swap encryption helper
  if:
    type: tree-sitter
    language: shell
    query: "((command name: (command_name [(word) (raw_string) (string)] @wrapper)\
      \ . argument: [(word) (raw_string) (string)] @program)\n  (#any-of? @wrapper\
      \ \"log-output\" \"\\\"log-output\\\"\" \"'log-output'\")\n  (#any-of? @program\
      \ \"ecryptfs-setup-swap\" \"\\\"ecryptfs-setup-swap\\\"\" \"'ecryptfs-setup-swap'\"\
      )\n)\n((command name: (command_name [(word) (raw_string) (string)] @wrapper)\
      \ . argument: [(word) (raw_string) (string)] @pass . argument: [(word) (raw_string)\
      \ (string)] @program)\n  (#any-of? @wrapper \"log-output\" \"\\\"log-output\\\
      \"\" \"'log-output'\")\n  (#any-of? @program \"ecryptfs-setup-swap\" \"\\\"\
      ecryptfs-setup-swap\\\"\" \"'ecryptfs-setup-swap'\")\n  (#any-of? @pass \"--pass-stdout\"\
      \ \"\\\"--pass-stdout\\\"\" \"'--pass-stdout'\")\n)\n((command name: (command_name\
      \ [(word) (raw_string) (string)] @wrapper) . argument: [(word) (raw_string)\
      \ (string)] @flag . argument: (_) @tag . argument: [(word) (raw_string) (string)]\
      \ @program)\n  (#any-of? @wrapper \"log-output\" \"\\\"log-output\\\"\" \"'log-output'\"\
      )\n  (#any-of? @program \"ecryptfs-setup-swap\" \"\\\"ecryptfs-setup-swap\\\"\
      \" \"'ecryptfs-setup-swap'\")\n  (#any-of? @flag \"-t\" \"\\\"-t\\\"\" \"'-t'\"\
      )\n)\n((command name: (command_name [(word) (raw_string) (string)] @wrapper)\
      \ . argument: [(word) (raw_string) (string)] @flag . argument: (_) @tag . argument:\
      \ [(word) (raw_string) (string)] @pass . argument: [(word) (raw_string) (string)]\
      \ @program)\n  (#any-of? @wrapper \"log-output\" \"\\\"log-output\\\"\" \"'log-output'\"\
      )\n  (#any-of? @program \"ecryptfs-setup-swap\" \"\\\"ecryptfs-setup-swap\\\"\
      \" \"'ecryptfs-setup-swap'\")\n  (#any-of? @flag \"-t\" \"\\\"-t\\\"\" \"'-t'\"\
      )\n  (#any-of? @pass \"--pass-stdout\" \"\\\"--pass-stdout\\\"\" \"'--pass-stdout'\"\
      )\n)\n((command name: (command_name [(word) (raw_string) (string)] @wrapper)\
      \ . argument: [(word) (raw_string) (string)] @pass . argument: [(word) (raw_string)\
      \ (string)] @flag . argument: (_) @tag . argument: [(word) (raw_string) (string)]\
      \ @program)\n  (#any-of? @wrapper \"log-output\" \"\\\"log-output\\\"\" \"'log-output'\"\
      )\n  (#any-of? @program \"ecryptfs-setup-swap\" \"\\\"ecryptfs-setup-swap\\\"\
      \" \"'ecryptfs-setup-swap'\")\n  (#any-of? @flag \"-t\" \"\\\"-t\\\"\" \"'-t'\"\
      )\n  (#any-of? @pass \"--pass-stdout\" \"\\\"--pass-stdout\\\"\" \"'--pass-stdout'\"\
      )\n)"
  unless:
  - type: symbol
    kind: function
    exact: log-output
  - id: metadata/lang/source::shell-parser-recovery-node
