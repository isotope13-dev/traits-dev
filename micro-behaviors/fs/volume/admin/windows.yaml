defaults:
  crit: notable
  conf: 0.8
  for: [pe, dll]
  platforms: [windows]
traits:
  # Specialised volume-admin APIs.  Most user programs never touch these —
  # seeing one appear in a supply-chain diff is a strong purpose-change
  # signal, so these are notable rather than baseline.
  - id: set-volume-label-w
    desc: Rename a volume label
    if:
      type: symbol
      exact: SetVolumeLabelW
  - id: delete-volume-mount-point-w
    desc: Remove a volume mount point
    if:
      type: symbol
      exact: DeleteVolumeMountPointW

  - id: batch-format-drive
    desc: Batch formats a drive letter
    crit: notable
    conf: 0.94
    for: [batch]
    if:
      type: text
      regex: '(?i)\bformat(\.(com|exe))?\s+[a-z]:'
  # The drive comes from a FOR variable or an environment expansion rather
  # than a literal letter, so one line can format whatever list it is fed.
  - id: batch-format-variable-drive
    desc: Batch formats a variable-named drive
    crit: notable
    conf: 0.92
    for: [batch]
    if:
      type: text
      regex: '(?i)\bformat(\.com)?\s+(%%~?[a-z]|%[a-z0-9_]{1,30}%|![a-z0-9_]{1,30}!):'
