# Password database locks coordinate access; they do not prove a write.
defaults:
  platforms: [linux]
  for: [elf, c]
  crit: notable
  conf: 0.9
traits:
  - id: lckpwdf
    desc: Locks the shadow password database
    conf: 0.92
    if:
      type: import
      exact: lckpwdf

  - id: ulckpwdf
    desc: Unlocks the shadow password database
    conf: 0.92
    if:
      type: import
      exact: ulckpwdf
