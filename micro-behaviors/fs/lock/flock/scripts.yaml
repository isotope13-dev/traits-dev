defaults:
  platforms: [linux, macos]
  for: [scripts]
traits:
  - id: flock-exclusive-blocking
    desc: Blocking exclusive file lock
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '\bflock\s*\([^,\n]{0,60},\s*LOCK_EX\b|\bflock\s+-x\b'
  - id: flock-nonblocking
    desc: Non-blocking file lock
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: 'flock\s*\(.{0,40},\s*LOCK_EX\s*\|\s*LOCK_NB|\bflock\s+-[A-Za-z]*n\b'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: python-fcntl-flock
    desc: Uses fcntl.flock() for advisory file locking
    crit: notable
    conf: 0.86
    for: [python]
    if:
      type: symbol
      kind: call
      exact: fcntl.flock
