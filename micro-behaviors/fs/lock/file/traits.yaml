defaults:
  platforms: [linux, windows, macos]
  for: [pe, elf, macho, c, cpp, rust, go]

traits:
  - id: printf-lock-sidecar-format
    desc: Formats a .lock sidecar filename
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '(?i)%s\.lock\b'

  - id: printf-journal-sidecar-format
    desc: Formats a .journal sidecar filename
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '(?i)%s\.journal\b'

  - id: x11-display-lockfile-path
    desc: References an X11 display lockfile under /tmp
    crit: notable
    conf: 0.92
    platforms: [linux]
    for: [scripts]
    if:
      type: text
      regex: '/tmp/\.X[a-zA-Z0-9%]{1,16}-lock'
