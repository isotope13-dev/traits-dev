# Log retention / rotation cleanup markers.
#
# Deleting or rotating old log files is benign housekeeping found in countless
# legitimate programs (logging libraries, services, build tooling), so these are
# neutral filesystem-maintenance capabilities — NOT disk-wipe / mass-delete
# intent. They live here per the taxonomy's "Matcher Defines Identity" rule
# (each matcher only detects a log-rotation symbol or phrase). The benign-context
# composites in objectives/impact/wipe/disk/mass-delete reference them
# cross-directory to SUPPRESS mass-delete false positives.
defaults:
  platforms: [windows, linux, macos]
  for: [scripts, binaries]
traits:
  - id: cleanup-old-logs
    desc: cleanupOldLogs log retention helper
    crit: baseline
    conf: 0.85
    if:
      type: text
      substr: cleanupOldLogs
  - id: app-log-file
    desc: App log file retention helper
    crit: baseline
    conf: 0.85
    if:
      type: text
      substr: isAppLogFile
  - id: rotation-phrase
    desc: Log rotation cleanup phrase
    crit: baseline
    conf: 0.85
    if:
      type: text
      substr: log rotation
  - id: clean-old-logs
    desc: cleanOldLogs log retention helper
    crit: baseline
    conf: 0.85
    if:
      type: text
      substr: cleanOldLogs
  - id: logrotate
    desc: LogRotate log retention marker
    crit: baseline
    conf: 0.85
    if:
      type: text
      substr: LogRotate
  - id: rotate-file
    desc: rotateFile log retention helper
    crit: baseline
    conf: 0.85
    if:
      type: text
      substr: rotateFile

  # Java services commonly prune active/rotated application logs and Derby's
  # diagnostic log as housekeeping. Keep those mechanics neutral here; an
  # evasion objective adds implant tasking context before calling them hostile.
  - id: java-active-server-log-name-check
    desc: Java checks active server log name
    crit: baseline
    conf: 0.98
    platforms: [unix, windows]
    for: [java]
    if:
      type: text
      regex: '(\.equals\s*\(\s*["'']server\.log["'']\s*\)|["'']server\.log["'']\s*\.equals\s*\()'

  - id: java-rotated-server-log-name-check
    desc: Java checks rotated server log prefix
    crit: baseline
    conf: 0.98
    platforms: [unix, windows]
    for: [java]
    if:
      type: text
      regex: '\.startsWith\s*\(\s*["'']server\.log\.["'']\s*\)'

  - id: java-rotated-server-log-delete
    desc: Java deletes rotated server logs
    crit: notable
    conf: 0.98
    platforms: [unix, windows]
    for: [java]
    if:
      type: text
      regex: '\.startsWith\s*\(\s*["'']server\.log\.["'']\s*\)[^;]{0,260}\.delete\s*\('

  - id: java-derby-log-delete
    desc: Java deletes Apache Derby log
    crit: notable
    conf: 0.97
    platforms: [unix, windows]
    for: [java]
    if:
      type: text
      regex: 'new\s+File\s*\(\s*["''][^"'']{0,160}derby\.log["'']\s*\)\s*\.delete\s*\(\s*\)'

  - id: java-nio-derby-log-delete
    desc: Java NIO deletes Apache Derby log
    crit: notable
    conf: 0.97
    platforms: [unix, windows]
    for: [java]
    if:
      type: text
      regex: 'Files\.delete(IfExists)?\s*\([^;\n]{0,120}derby\.log'
composite_rules:
  - id: log-rotation-cleanup-context
    desc: Log rotation cleanup context
    crit: component
    conf: 0.85
    any:
    - id: cleanup-old-logs
    - id: app-log-file
    - id: rotation-phrase
  - id: log-rotation-cleanup-context-js
    desc: JavaScript log rotation cleanup context
    crit: component
    conf: 0.85
    any:
    - id: clean-old-logs
    - id: logrotate
    - id: rotate-file

  - id: java-nio-rotated-server-log-delete
    desc: Java NIO deletes rotated server logs
    crit: notable
    conf: 0.98
    platforms: [unix, windows]
    for: [java]
    all:
      - id: java-rotated-server-log-name-check
    any:
      - id: micro-behaviors/fs/file/delete::java-files-delete
      - id: micro-behaviors/fs/file/delete::java-delete-if-exists
    needs: 1
    near_lines: 6

  - id: java-server-log-family-delete
    desc: Java deletes active and rotated server logs
    crit: notable
    conf: 0.98
    platforms: [unix, windows]
    for: [java]
    all:
      - id: java-active-server-log-name-check
    any:
      - id: java-rotated-server-log-delete
      - id: java-nio-rotated-server-log-delete
    needs: 1
    near_lines: 16

  - id: jvm-server-log-family-delete
    desc: JVM archive includes server-log deletion
    crit: notable
    conf: 0.98
    platforms: [unix, windows]
    for: [class, jar, zip]
    scope: outer
    all:
      - id: metadata/file/string/file::jvm-active-server-log-name
      - id: metadata/file/string/file::jvm-rotated-server-log-prefix
      - id: micro-behaviors/fs/directory/readdir::jvm-file-listfiles
    any:
      - id: micro-behaviors/fs/delete/file::java-file-delete-bytecode
      - id: micro-behaviors/fs/delete/file::java-nio-file-delete-bytecode
      - id: micro-behaviors/fs/delete/file::java-nio-file-delete-if-exists-bytecode
    needs: 1
