defaults:
  platforms:
  - unix
  for:
  - shell
  crit: notable
  conf: 0.95
traits:
- id: shell-disables-block-checked-fstab-swap
  desc: Disables swap after checking fstab block target
  if:
    type: tree-sitter
    language: shell
    query: "((program\n  (variable_assignment name: (variable_name) @assigned\n  \
      \  value: (command_substitution .\n      (command name: (command_name (word)\
      \ @awk)\n        . argument: (raw_string) @filter\n        . argument: [(word)\
      \ (raw_string) (string)] @table .) .))\n  . (if_statement\n    condition: (test_command\
      \ .\n      (unary_expression operator: (test_operator) @test [(string . (simple_expansion\
      \ (variable_name) @checked) .) (string . (expansion (variable_name) @checked)\
      \ .)]) .)\n    (command name: (command_name (word) @swapoff)\n      . argument:\
      \ (word) @all .)))\n  (#eq? @awk \"awk\")\n  (#eq? @filter \"'$3 == \\\"swap\\\
      \" {print $1; exit}'\")\n  (#match? @table \"^['\\\"]?/etc/fstab['\\\"]?$\"\
      )\n  (#eq? @test \"-b\")\n  (#eq? @swapoff \"swapoff\")\n  (#eq? @all \"-a\"\
      )\n  (#eq? @assigned @checked)\n)\n"
  unless:
  - id: metadata/lang/source::shell-declares-awk-function
  - id: metadata/lang/source::shell-declares-swapoff-function
  - id: metadata/lang/source::shell-parser-recovery-node
