traits:
- platforms:
  - openbsd
  for:
  - shell
  id: shell-swapoff-near-dd-input
  desc: Shell swapoff syntax near dd zero/random input
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: swapoff\s+["$][A-Za-z_][A-Za-z0-9_]*[\s\S]{0,240}\bdd\s+if=/dev/(u?random|zero)\b
  unless:
  - id: well-known/app/utility/util-linux::util-linux-source-tree
  - id: well-known/app/storage/clonezilla::package-context
  - id: well-known/app/storage/clonezilla::archive-name
  - id: well-known/app/storage/clonezilla::clonezilla-script-context
