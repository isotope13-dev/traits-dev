defaults:
  crit: notable
  conf: 0.95
  for:
  - shell
  platforms:
  - linux
traits:
- id: shell-swapon-invocation
  desc: Shell invokes swapon
  if:
    type: tree-sitter
    language: shell
    query: '((command name: (command_name (word) @callee)) (#eq? @callee "swapon"))'
  unless:
  - type: symbol
    kind: function
    exact: swapon
