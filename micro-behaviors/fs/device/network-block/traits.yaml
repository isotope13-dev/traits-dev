# Block storage exported or attached over the network: iSCSI target/initiator
# tooling and NBD. Distinct from local device access (the blkid/loop/mknod
# siblings) because the device is reachable off-host.
#
# Neutral capabilities — this is what storage operators, CSI drivers and SAN
# tooling do, and knowing an image ships them is exactly the "what is this
# thing" context an analyst wants when triaging a container. They are also a
# real primitive in the other direction: a process that stands up an iSCSI
# target can publish host block devices to the network, and NBD attaches a
# remote device locally. Intent belongs to composites that pair these with
# unexpected context, not to the capability itself.
defaults:
  platforms: [unix]
  for: [binaries, scripts]
  crit: notable

traits:
  - id: iscsi-target-daemon-tool
    desc: Linux SCSI target (tgt) admin tooling
    conf: 0.95
    for: [elf, shell, perl]
    if:
      type: path
      basename: true
      regex: '^tgt(d|adm|img|-admin|-setup-lun)$'

  - id: iscsi-initiator-tool
    desc: iSCSI initiator administration tool
    conf: 0.95
    for: [elf, shell, perl]
    if:
      type: path
      basename: true
      regex: '^iscsi(adm|d|uio)$'

  # RFC 3720 iSCSI Qualified Name: iqn.yyyy-mm.reversed-domain[:unique].
  - id: iscsi-qualified-name
    desc: iSCSI qualified name (IQN) reference
    conf: 0.9
    if:
      type: text
      regex: '\biqn\.[0-9]{4}-[0-9]{2}\.[a-z0-9.-]+'

  - id: nbd-device-path
    desc: Network block device path reference
    conf: 0.9
    if:
      type: text
      regex: '/dev/nbd[0-9]*\b'

composite_rules:
  # Tooling plus an actual target name: the component is configured to publish
  # storage, not merely linked against a SCSI library.
  - id: iscsi-target-export-capability
    desc: Exports block devices as an iSCSI target
    crit: notable
    conf: 0.95
    any:
      - id: iscsi-target-daemon-tool
      - id: iscsi-qualified-name
    needs: 2
