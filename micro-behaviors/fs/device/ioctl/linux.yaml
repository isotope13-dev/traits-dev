defaults:
  platforms: [linux, android]
  for: [c, cpp, rust, go, elf, shell]

traits:
  - id: watchdog-ioctl-macro
    desc: Linux watchdog ioctl macro request
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bioctl\s*\([^;\n]{0,180}\bWDIOC_(SETTIMEOUT|KEEPALIVE|SETOPTIONS)\b'
  - id: watchdog-ioctl-raw-request
    desc: Linux watchdog raw ioctl request
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bioctl\s*\([^;\n]{0,180}\b0x8004570[45]\b'
  - id: mtd-erase-ioctl
    desc: Linux MTD erase ioctl request
    crit: notable
    conf: 0.95
    attack: T1485
    for: [c, cpp, rust, go, python, javascript, elf]
    platforms: [unix]
    # Query, unlock, and out-of-band write requests are not erase operations.
    # Require the MTD erase request constant in the ioctl call text.
    if:
      type: text
      regex: '\bioctl\s*\([^;\n]{0,180}\bMEMERASE64?\b'

composite_rules:
  - id: linux-watchdog-control-request
    desc: Linux watchdog control ioctl request
    crit: notable
    conf: 0.94
    any:
      - id: watchdog-ioctl-macro
      - id: watchdog-ioctl-raw-request
  - id: watchdog-servicing-mechanism
    desc: Hardware watchdog servicing mechanism
    crit: notable
    conf: 0.94
    any:
      - id: watchdog-ioctl-macro
      - id: watchdog-ioctl-raw-request
      - id: micro-behaviors/fs/file/write/redirect::shell-watchdog-feed-redirect
      - id: micro-behaviors/fs/file/write/redirect::shell-watchdog-feed-dd
