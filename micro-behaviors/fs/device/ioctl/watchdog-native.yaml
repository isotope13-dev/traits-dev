defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86-64]
  crit: notable
traits:
  # WDIOC_SETOPTIONS = 0x80045704; WDIOS_DISABLECARD = 1.
  # The same stack slot is addressed and initialized before the call.
  # This is a device-control capability, not proof of defeating a defender.
  - id: x64-watchdog-disable-call
    desc: x64 watchdog-disable ioctl call pattern
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: >-
        48 8D 6C 24 30 89 DF BE 04 57 04 80 31 C0 48 89 EA
        C7 44 24 30 01 00 00 00 E8 [4]
