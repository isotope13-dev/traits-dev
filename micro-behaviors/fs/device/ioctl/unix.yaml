defaults:
  platforms: [unix]
  for: [python, javascript]
traits:
  # The canonical "this code issues device control requests" atom. It used to be
  # `kind: call` on script languages only, which left every compiled Unix
  # program invisible: a Mach-O or ELF reaches ioctl(2) through a libc import,
  # not a parsed call site, so a native binary whose entire purpose was a device
  # ioctl carried no evidence of it at all. Dropping `kind:` widens the lookup
  # across the whole symbol table (imports, exported/internal functions, call
  # sites); leading-underscore normalization makes the Mach-O `_ioctl` import
  # match `exact: ioctl`.
  #
  # Notable, not baseline: ioctl is not universal plumbing like read/mmap, it is
  # the entry point to whatever driver or terminal sits behind the fd, and the
  # request constant decides whether that is a window-size query or a raw-disk
  # write. Which device and which request is what the per-request traits under
  # this directory, hardware/, and process/tty/ pin down; this atom only says
  # the program talks to one.
  - id: ioctl
    desc: Device control request via ioctl
    crit: notable
    conf: 0.66
    # Native C/C++ calls are common in terminal and network libraries, and
    # the exact symbol still requires a real ioctl call rather than prose.
    for: [c, cpp, elf, macho, so, dylib, static-lib]
    if:
      type: symbol
      exact: ioctl
    unless:
      - id: metadata/signed/platform::apple
  - id: ioctl-iflags
    desc: ioctl operations for inode flags
    crit: notable
    conf: 0.66
    if:
      type: symbol
      regex: ioctl_iflags
