# KOMA-specific ioctl requests configure or pull work from the Linux kernel
# connection-multiplexor socket.  These are neutral device-control operations.
defaults:
  platforms: [linux]
  for: [c, cpp]
  crit: notable
  conf: 0.98

traits:
  - id: koma-attach-ioctl
    desc: KOMA socket attach ioctl
    if:
      type: symbol
      kind: call
      exact: ioctl
      arg:
        kind: identifier
        name: SIOCKOMAATTACH

  - id: koma-pull-ioctl
    desc: KOMA work-pull ioctl
    if:
      type: symbol
      kind: call
      exact: ioctl
      arg:
        kind: identifier
        name: SIOCKOMAPULL
