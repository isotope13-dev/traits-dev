defaults:
  platforms:
  - unix
  for:
  - binaries
  - scripts
  crit: notable
traits:
- id: iscsi-target-daemon-tool
  desc: Linux SCSI target (tgt) admin tooling
  conf: 0.95
  for:
  - elf
  - shell
  - perl
  if:
    type: path
    basename: true
    regex: ^tgt(d|adm|img|-admin|-setup-lun)$
- id: iscsi-initiator-tool
  desc: iSCSI initiator administration tool
  conf: 0.95
  for:
  - elf
  - shell
  - perl
  if:
    type: path
    basename: true
    regex: ^iscsi(adm|d|uio)$
- id: iscsi-qualified-name
  desc: iSCSI qualified name (IQN) reference
  conf: 0.9
  if:
    type: text
    regex: \biqn\.[0-9]{4}-[0-9]{2}\.[a-z0-9.-]+
- id: nbd-device-path
  desc: Network block device path reference
  conf: 0.9
  if:
    type: text
    regex: /dev/nbd[0-9]*\b
composite_rules:
- id: iscsi-target-export-capability
  desc: Exports block devices as an iSCSI target
  conf: 0.95
  any:
  - id: micro-behaviors/fs/device::iscsi-target-daemon-tool
  - id: micro-behaviors/fs/device::iscsi-qualified-name
  needs: 2
