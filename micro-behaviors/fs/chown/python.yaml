defaults:
  platforms:
  - linux
  - macos
  for:
  - python
traits:
- id: python-formatted-root-owner
  desc: Embeds root ownership for formatted path
  crit: notable
  if:
    type: text
    regex: '["'']/(usr/)?bin/chown\s+root:root\s+\{\w+\}'
    exclude_comments: true
- id: python-embedded-chown-command
  desc: Embedded chown command string
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: '["'']/(usr/)?bin/chown\s+[^"''\n]{1,180}'
    exclude_comments: true
- id: python-fchown-call
  desc: Python changes file-descriptor ownership
  crit: notable
  conf: 0.97
  if:
    type: symbol
    kind: call
    exact: os.fchown
