defaults:
  platforms: [linux, macos]
  for: [elf, macho, c, shell]
traits:
  - id: chown-fn
    desc: Change file ownership
    crit: notable
    conf: 0.66
    if:
      type: symbol
      exact: chown
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: fchown-fn
    desc: Change file ownership by fd
    crit: notable
    conf: 0.66
    if:
      type: symbol
      exact: fchown
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: fchownat-fn
    desc: Change file ownership by dirfd/path
    crit: notable
    conf: 0.66
    if:
      type: symbol
      exact: fchownat
  - id: lchown-fn
    desc: Change ownership of symlink
    crit: notable
    conf: 0.66
    if:
      type: symbol
      exact: lchown
  - id: chown-command
    desc: Shell chown command with path
    crit: notable
    conf: 0.82
    for: [shell]
    if:
      type: text
      # Require shell command context and a path-like operand so diagnostic
      # prose such as "chown error" in native strings is not a match.
      regex: '(?m)(^|[;&|]\s*)chown\s+(-[A-Za-z]+\s+)?\S+\s+(/\S+|\.?/\S+)'
    unless:
      - id: well-known/app/utility/cmdchamp::cli-trainer-source-context
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: chown-ssh-authorized-keys-path
    desc: Changes ownership on SSH authorized_keys path
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: 'chown.{0,120}\.ssh/(authorized_keys|authorized_keys2)\b|chown.{0,120}authorized_keys\b'
  - id: lua-posix-chown
    desc: Lua calls the POSIX chown API
    crit: notable
    conf: 0.85
    for: [lua, rpm]
    platforms: [linux]
    if:
      type: raw
      regex: 'posix\.chown\s*\('

composite_rules:
  - id: chown
    desc: Change file ownership
    crit: notable
    conf: 0.66
    any:
      - id: chown-fn
      - id: fchown-fn
      - id: fchownat-fn
      - id: lchown-fn
      - id: chown-command
