defaults:
  platforms: [unix]
  for: [php]
  mbc: E1222
  attack: T1222.002

traits:
  - id: chown-call
    desc: Changes file owner via PHP chown()
    crit: notable
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: chown

  - id: chgrp-call
    desc: Changes file group via PHP chgrp()
    crit: notable
    conf: 0.7
    if:
      type: symbol
      kind: call
      exact: chgrp
