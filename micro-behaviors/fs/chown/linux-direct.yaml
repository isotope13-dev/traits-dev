# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: chown-direct-syscall
    desc: Changes file ownership via Linux syscall
    crit: baseline
    if:
      type: syscall
      name: [chown, fchown, lchown, fchownat]
      arch: [x86_64, aarch64]
