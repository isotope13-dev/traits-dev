defaults:
  platforms: [unix]
  for: [python]
  crit: notable
  conf: 0.95
traits:
  - id: python-parted-mklabel-argv
    desc: Python passes parted mklabel argument list
    if:
      type: tree-sitter
      language: python
      query: |
        ((call arguments: (argument_list
          (list . (string (string_content) @tool) . (_) @device
                . (string (string_content) @operation))))
          (#eq? @tool "parted")
          (#eq? @operation "mklabel"))

  - id: python-mkfs-argv
    desc: Python passes filesystem formatter argument list
    if:
      type: tree-sitter
      language: python
      query: |
        ((call arguments: (argument_list
          (list . (string (string_content) @tool) . (_) @operand)))
          (#match? @tool "^mkfs(\\.[a-z0-9]+)?$"))
