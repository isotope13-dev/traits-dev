traits:
- platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  id: master-boot-record-text
  desc: Master boot record text reference
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: master boot record
    case_insensitive: true
  unless:
  - id: metadata/vendor/identity/
  - id: well-known/app/utility/kpango-dotfiles::kpango-dotfiles-source-path
  - id: well-known/tool/detection/ai-guardrail/
  - type: text
    regex: '%!PS-Adobe'
