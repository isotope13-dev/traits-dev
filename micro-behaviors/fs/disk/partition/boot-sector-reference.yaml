defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
traits:
- id: boot-sector-ref
  desc: boot sector reference
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: boot sector
    case_insensitive: true
  unless:
  - id: well-known/tool/sysadmin/busybox::busybox-binary
  not:
  - regex: '(?i)DOS/MBR boot sector'
