defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: mbr-reference
    desc: Master boot record abbreviation
    crit: notable
    conf: 0.6
    if:
      type: text
      # Bound the containing line to avoid tokens in large encoded blobs.
      regex: '(?m)^[^\n]{0,512}\bMBR\b[^\n]{0,512}$'
