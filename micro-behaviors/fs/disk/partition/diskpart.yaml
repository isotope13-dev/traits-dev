defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: diskpart-script-file
    desc: diskpart runs commands from a script file
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bdiskpart(\.exe)?\s+/s\s+\S+'

  - id: batch-write-format-command
    desc: Batch writes filesystem format command text
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?im)^[ \t]*@?echo +format +fs=[a-z0-9]+[^>&|\r\n]{0,160}>{1,2} *\S'

  - id: batch-pipe-to-diskpart
    desc: Batch pipes text to DiskPart
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?im)^[ \t]*@?(type|echo) +[^|&\r\n]{1,120}\| *diskpart\b'
