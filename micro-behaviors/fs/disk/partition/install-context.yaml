defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: fdisk-command
    desc: Shell invokes an fdisk partitioning tool
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^[ \t]*((sudo|command)[ \t]+)?fdisk([ \t]|$)'
  - id: disklabel-command
    desc: Shell invokes a disklabel partitioning tool
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bdisklabel(64)?\b'
  - id: filesystem-format-command
    desc: Shell invokes a filesystem formatter
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(newfs|mkfs)\w*\b'
  - id: mount-staged-root
    desc: Shell mounts a filesystem under /mnt
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^ *mount\w*[^\n]{0,80}/mnt\b'
  - id: copy-staged-root
    desc: Shell copies a root tree into /mnt
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?m)^ *(cpdup|chroot) [^\n]{0,80}/mnt\b'

composite_rules:
  - id: partition-command
    desc: Shell invokes a partitioning tool
    crit: notable
    conf: 0.9
    any:
      - id: fdisk-command
      - id: disklabel-command
  - id: bsd-disk-installation-context
    desc: BSD disk partition and staged-root installation workflow
    crit: exception
    conf: 0.95
    all:
      - id: partition-command
      - id: filesystem-format-command
      - id: mount-staged-root
      - id: copy-staged-root
