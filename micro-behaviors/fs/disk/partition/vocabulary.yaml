# Density of the word "partition" in a binary's read-only strings.
#
# This says the program's user-facing text is about disk partitions -- true of
# parted/fdisk/gdisk/GRUB and of any installer or imaging tool -- but it names
# no product, and "partition" is equally ordinary vocabulary in database and
# streaming engines (table partitions, topic partitions). It is therefore a
# capability-vocabulary observation, not a tool fingerprint; composites that
# want "this is a disk utility" should pair it with an actual disk-device or
# partition-table behavior.
defaults:
  for: [binaries]
  platforms: [unix, windows]
  # Vocabulary alone is incomplete evidence; disk operations provide the
  # analyst-relevant behavior and should be matched by separate traits.
  crit: component
  size_max: 10485760

traits:
  - id: partition-vocabulary-rodata
    desc: Dense partition vocabulary in read-only strings
    conf: 0.9
    count_min: 5
    if:
      type: text
      word: partition
      section: .rodata

composite_rules:
  - id: disk-partition-vocabulary-context
    desc: Partition vocabulary with block-device reference
    crit: notable
    conf: 0.85
    platforms: [linux]
    all:
      - id: partition-vocabulary-rodata
    any:
      - id: micro-behaviors/hardware/block/device::dev-sd
      - id: micro-behaviors/hardware/block/device::dev-dm
      - id: micro-behaviors/hardware/block/device::dev-mapper
