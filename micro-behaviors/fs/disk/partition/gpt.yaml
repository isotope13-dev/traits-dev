defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: sgdisk-new-partition
    desc: sgdisk creates a new GPT partition
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'sgdisk\b[^\n]{0,80}--new='
  - id: parted-mklabel
    desc: parted creates a new partition table
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'parted\b[^\n]{0,40}mklabel\b'

composite_rules:
  - id: shell-repartitions-disk
    desc: Script creates a new GPT partition or partition table
    crit: notable
    conf: 0.92
    any:
      - id: sgdisk-new-partition
      - id: parted-mklabel
