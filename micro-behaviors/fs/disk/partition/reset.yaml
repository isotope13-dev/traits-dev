defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.9
traits:
  - id: sfdisk-delete-partitions
    desc: sfdisk deletes partition-table entries
    if:
      type: text
      regex: '\bsfdisk[ \t]+--delete\b'
composite_rules:
  - id: small-partition-prefix-reset
    desc: Partition deletion near bounded device-variable zeroing
    all:
      - id: sfdisk-delete-partitions
      - id: micro-behaviors/fs/write/content::dd-small-prefix-zero
      - id: micro-behaviors/fs/disk/raw::dd-zero-to-device-var
    near_lines: 4
