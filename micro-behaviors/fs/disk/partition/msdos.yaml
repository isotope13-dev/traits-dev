defaults:
  for:
    - c
  platforms:
    - unix
    - windows
traits:
  - id: mbr-backup-sector-11h
    desc: MBR backup to sector 11h
    crit: suspicious
    conf: 0.97
    if:
      type: string_literal
      regex: (?i)(sector 11h|sector 17 \\(11h\\)|copy partition table to sector 11h)
  - id: partition-table-overwrite
    desc: Partition table overwrite logic
    crit: suspicious
    conf: 0.97
    if:
      type: string_literal
      regex: (?i)(overwrite partition table|overwrites the MBR)
  - id: boot-sector-overwrite-a
    desc: Drive A boot overwrite
    crit: suspicious
    conf: 0.97
    if:
      type: string_literal
      substr: 'overwrite boot sector of drive A:'
  - id: boot-sector-overwrite-b
    desc: Drive B boot overwrite
    crit: suspicious
    conf: 0.97
    if:
      type: string_literal
      substr: 'overwrite boot sector of drive B:'
  - id: dual-floppy-boot-overwrite
    desc: Dual floppy boot overwrite
    crit: suspicious
    conf: 0.97
    if:
      type: string_literal
      substr: 'boot sectors of drives A: and B:'
  # The signature must stand alone (0xAA55, "55AA") rather than fall inside a
  # longer hex run: an unbounded AA55 matched by coincidence inside crypto
  # test vectors (an AES-XTS ciphertext string in BoringSSL scored as a boot
  # sector). Surrounding hex digits are what disqualify a chance occurrence.
  - id: sector-marker-aa55
    desc: Boot sector AA55 marker
    crit: notable
    conf: 0.93
    if:
      type: string_literal
      regex: '(?i)(^|[^0-9a-f])(aa55|55aa)([^0-9a-f]|$)'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  # Split out of sector-marker-aa55: the human-readable phrase is an
  # independent signal from the two-byte signature and needs no hex guard.
  - id: sector-marker-phrase
    desc: End of sector marker phrase
    crit: notable
    conf: 0.93
    if:
      type: string_literal
      substr: end of sector marker
      case_insensitive: true
  - id: april-payload-banner
    desc: April prank payload banner
    crit: notable
    conf: 0.95
    if:
      type: string_literal
      regex: (?i)(April, April \\.{3}|April Fools)
composite_rules:
  - id: boot-record-overwrite-source
    desc: Boot record overwrite source
    crit: suspicious
    conf: 0.98
    all:
      - id: mbr-backup-sector-11h
      - id: partition-table-overwrite
    any:
      - id: dual-floppy-boot-overwrite
      - id: boot-sector-overwrite-a
      - id: boot-sector-overwrite-b
      - id: sector-marker-aa55
      - id: sector-marker-phrase
      - id: april-payload-banner
