defaults:
  platforms:
  - unix
  crit: notable
  conf: 0.99
  for:
  - go
traits:
- id: go-dd-zero-command-run-syntax
  desc: Go dd zero whole-device Run syntax
  crit: notable
  conf: 0.99
  if:
    type: tree-sitter
    query: "((call_expression\n function: (selector_expression\n  operand: (call_expression\n\
      \   function: (selector_expression operand: (identifier) @owner field: (field_identifier)\
      \ @command)\n   arguments: (argument_list . (interpreted_string_literal) @program\n\
      \    . (interpreted_string_literal) @input . (interpreted_string_literal) @output\n\
      \    . (interpreted_string_literal)? @block .))\n  field: (field_identifier)\
      \ @run)\n arguments: (argument_list) @run_args)\n (#eq? @run_args \"()\") (#eq?\
      \ @owner \"exec\") (#eq? @command \"Command\") (#eq? @run \"Run\")\n (#eq? @program\
      \ \"\\\"dd\\\"\") (#eq? @input \"\\\"if=/dev/zero\\\"\")\n (#match? @output\
      \ \"^\\\"of=/dev/(sd[a-z]+|x?vd[a-z]+|a?da[0-9]+|nvme[0-9]+n[0-9]+)\\\"$\")\n\
      \ (#match? @block \"^\\\"bs=[1-9][0-9]*[mMG]\\\"$\"))"
- id: go-dd-urandom-command-run-syntax
  desc: Go dd urandom whole-device Run syntax
  crit: notable
  conf: 0.99
  if:
    type: tree-sitter
    query: "((call_expression\n function: (selector_expression\n  operand: (call_expression\n\
      \   function: (selector_expression operand: (identifier) @owner field: (field_identifier)\
      \ @command)\n   arguments: (argument_list . (interpreted_string_literal) @program\n\
      \    . (interpreted_string_literal) @input . (interpreted_string_literal) @output\n\
      \    . (interpreted_string_literal)? @block .))\n  field: (field_identifier)\
      \ @run)\n arguments: (argument_list) @run_args)\n (#eq? @run_args \"()\") (#eq?\
      \ @owner \"exec\") (#eq? @command \"Command\") (#eq? @run \"Run\")\n (#eq? @program\
      \ \"\\\"dd\\\"\") (#eq? @input \"\\\"if=/dev/urandom\\\"\")\n (#match? @output\
      \ \"^\\\"of=/dev/(sd[a-z]+|x?vd[a-z]+|a?da[0-9]+|nvme[0-9]+n[0-9]+)\\\"$\")\n\
      \ (#match? @block \"^\\\"bs=[1-9][0-9]*[mMG]\\\"$\"))"
composite_rules:
- id: go-run-dd-zero-whole-device
  desc: Go runs dd zero whole-device argv
  unless:
  - id: metadata/lang/source::go-local-exec-name-binding
  all:
  - id: metadata/lang/source::go-exec-library-name-import
  - id: micro-behaviors/fs/disk/raw::go-dd-zero-command-run-syntax
- id: go-run-dd-urandom-whole-device
  desc: Go runs dd urandom whole-device argv
  unless:
  - id: metadata/lang/source::go-local-exec-name-binding
  all:
  - id: metadata/lang/source::go-exec-library-name-import
  - id: micro-behaviors/fs/disk/raw::go-dd-urandom-command-run-syntax
