defaults:
  platforms:
  - unix
  crit: notable
  conf: 0.99
traits:
- id: python-system-dd-zero-whole-device
  desc: Python shell dd zero-fills whole device
  if:
    type: symbol
    kind: call
    arg:
      index: 0
      kind: string
      from:
        whole_value: ^dd if=/dev/zero of=/dev/(sd[a-z]+|x?vd[a-z]+|a?da\d+|nvme\d+n\d+)(
          bs=[1-9]\d*[MG])?$
    exact: os.system
  for:
  - python
- id: c-system-dd-zero-whole-device
  desc: C shell dd zero-fills whole device
  if:
    type: symbol
    kind: call
    arg:
      index: 0
      kind: string
      from:
        whole_value: ^dd if=/dev/zero of=/dev/(sd[a-z]+|x?vd[a-z]+|a?da\d+|nvme\d+n\d+)(
          bs=[1-9]\d*[MG])?$
    exact: system
  for:
  - c
  unless:
  - type: symbol
    kind: function
    exact: system
- id: node-execsync-dd-zero-whole-device
  desc: Node shell dd zero-fills whole device
  if:
    type: symbol
    kind: call
    arg:
      index: 0
      kind: string
      from:
        whole_value: ^dd if=/dev/zero of=/dev/(sd[a-z]+|x?vd[a-z]+|a?da\d+|nvme\d+n\d+)(
          bs=[1-9]\d*[MG])?$
    regex: ^(child_process\.)?execSync$
  for:
  - javascript
  - typescript
  unless:
  - type: symbol
    kind: function
    exact: execSync
- id: python-system-dd-random-whole-device
  desc: Python shell dd random-fills whole device
  if:
    type: symbol
    kind: call
    arg:
      index: 0
      kind: string
