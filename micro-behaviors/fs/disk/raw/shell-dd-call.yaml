          bs=[1-9]\d*[MG])?$
    exact: os.system
  for:
  - python
- id: c-system-dd-random-whole-device
  desc: C shell dd random-fills whole device
  if:
    type: symbol
    kind: call
    arg:
      index: 0
      kind: string
