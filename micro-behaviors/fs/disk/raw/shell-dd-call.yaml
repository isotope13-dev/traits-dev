          bs=[1-9]\d*[MG])?$
    exact: system
  for:
  - c
  unless:
  - type: symbol
    kind: function
    exact: system
- id: node-execsync-dd-random-whole-device
  desc: Node shell dd random-fills whole device
  if:
    type: symbol
    kind: call
    arg:
      index: 0
      kind: string
      from:
        whole_value: ^dd if=/dev/u?random of=/dev/(sd[a-z]+|x?vd[a-z]+|a?da\d+|nvme\d+n\d+)(
          bs=[1-9]\d*[MG])?$
    regex: ^(child_process\.)?execSync$
  for:
