# A physical-disk open is useful analyst evidence even when the caller is a
# legitimate disk reader. The call argument distinguishes access from a path
# mentioned in documentation; it establishes neither a write nor destruction.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
traits:
  - id: node-opensync-physicaldrive-path
    desc: Node openSync targets a physical disk
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '(^|\.)openSync$'
      arg:
        index: 0
        kind: string
        regex: '(?i)^\\\\\.\\PhysicalDrive[0-9]+$'
