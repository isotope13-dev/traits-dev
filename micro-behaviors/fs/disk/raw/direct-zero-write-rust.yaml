defaults:
  platforms:
  - unix
  crit: notable
  conf: 0.99
traits:
- id: rust-raw-device-zero-write
  desc: Rust zero-writes an opened raw device
  for:
  - rust
  if:
    type: tree-sitter
    query: |
      ((block
        (let_declaration (mutable_specifier) pattern: (identifier) @handle
          value: (call_expression function: (field_expression
            value: (call_expression function: (field_expression
              value: (call_expression function: (field_expression
                value: (call_expression function: (field_expression
                  value: (call_expression function: (scoped_identifier
                    path: (identifier) @options name: (identifier) @new)
                    arguments: (arguments) @empty)
                  field: (field_identifier) @enable)
                  arguments: (arguments . (boolean_literal) @enabled .))
                field: (field_identifier) @flags)
                arguments: (arguments . (scoped_identifier path: (identifier) @libc name: (identifier) @mode) .))
              field: (field_identifier) @open)
              arguments: (arguments . (string_literal) @path .))
            field: (field_identifier) @unwrap) arguments: (arguments)))
        . (let_declaration value: (call_expression
            function: (field_expression value: (identifier) @sink field: (field_identifier) @write)
            arguments: (arguments . (reference_expression value: (_) @zeros) .))))
        (#eq? @empty "()") (#eq? @options "OpenOptions") (#eq? @new "new")
        (#eq? @enable "write") (#eq? @enabled "true")
        (#eq? @flags "custom_flags") (#eq? @libc "libc") (#eq? @mode "O_RDWR")
        (#eq? @open "open") (#match? @path "^\"/dev/(sd[a-z]+[0-9]*|x?vd[a-z]+[0-9]*|nvme[0-9]+n[0-9]+(p[0-9]+)?|a?da[0-9]+)\"$")
        (#match? @unwrap "^(unwrap|expect)$")
        (#eq? @write "write_all")
        (#match? @zeros "^(?:\\[\\s*0u8\\s*;\\s*[1-9][0-9]*(\\s*\\*\\s*[1-9][0-9]*)?\\s*\\]|vec!\\s*\\[\\s*0u8\\s*;\\s*[1-9][0-9]*(\\s*\\*\\s*[1-9][0-9]*)?\\s*\\])$")
        (#eq? @handle @sink))
