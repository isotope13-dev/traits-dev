# Slack terminology describes storage, including ordinary forensic examination.
# It establishes neither executable code caves nor self-modification.
defaults:
  platforms: [linux, macos, windows]
  for: [elf, pe, shell, python, javascript]
traits:
  - id: slack-space-reference
    desc: References disk or file slack space
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: slack space
      case_insensitive: true
