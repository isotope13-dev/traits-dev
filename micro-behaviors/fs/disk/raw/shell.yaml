defaults:
  platforms:
  - unix
  for:
  - shell
  crit: notable
traits:
- id: blkdiscard-dev
  desc: blkdiscard command names a device operand
  conf: 0.92
  if:
    type: text
    regex: \bblkdiscard\s+(-[A-Za-z]+\s+){0,3}["\']?/dev/[a-z][\w/-]*
  not:
  - regex: /dev/(null|zero|stdout|stderr)\b
  - regex: /dev/(stdin|random|urandom|full)\b
- id: dd-zero-to-device-var
  desc: dd zero-fills device-named shell variable
  conf: 0.9
  if:
    type: text
    regex: dd\s+if=/dev/zero\s+of\s*=\s*["']?\$\{?\w*(dev|disk|drive|swap)\w*\}?["']?
    case_insensitive: true
    not:
    - regex: \$\{?\w*file\w*\}?
  unless:
  - id: well-known/tool/detection/agent-glovebox::archive-context
  - type: text
    substr: mkswap
  - id: metadata/file/profile/test-indications::harness-metadata-or-directory-name
  - id: well-known/tool/sysadmin/initramfs/
  - id: well-known/app/infrastructure/rook/
  - type: text
    substr: _dd if=/dev/zero
  - id: well-known/app/storage/clonezilla/
  - id: well-known/app/utility/ventoy::disk-installer-context
  - id: micro-behaviors/fs/path/config/system::openwrt-firmware-component-context
