# A raw-drive reference and ReadFile imports do not bind a disk handle to
# the read or establish drive modification. Preserve the co-occurrence.
defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: unsigned-writable-entry-disk-socket-apis
    desc: Raw-disk and Winsock APIs in unsigned PE
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/dylib/lookup::unsigned-writable-entry-api-lookup-debugger-imports
      - id: micro-behaviors/communications/socket/connect::winsock-client-lifecycle
      - id: micro-behaviors/fs/disk/raw::windows-physicaldrive-read-profile
      - id: micro-behaviors/communications/ip/literal::external-ipv4-host-literal-binary
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/tool/reverse-engineering/

