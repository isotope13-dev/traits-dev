defaults:
  platforms:
  - unix
  crit: notable
  conf: 0.99
traits:
- id: javascript-raw-device-zero-write-loop
  desc: JS loop zero-fills opened raw device
  for:
  - javascript
  - typescript
  if:
    type: tree-sitter
    query: "((statement_block\n  (lexical_declaration (variable_declarator name: (identifier)\
      \ @handle\n    value: (call_expression function: (member_expression object:\
      \ (identifier) @fs property: (property_identifier) @open)\n      arguments:\
      \ (arguments . (string) @path . (string) @mode .))))\n  . (lexical_declaration\
      \ (variable_declarator name: (identifier) @buffer\n    value: (call_expression\
      \ function: (member_expression object: (identifier) @Buffer property: (property_identifier)\
      \ @alloc)\n      arguments: (arguments . (_) @size . (number)? @fill .))))\n\
      \  . (try_statement body: (statement_block . (for_statement !increment\n   \
      \ initializer: (empty_statement) condition: (empty_statement)\n    body: (expression_statement\
      \ (call_expression\n      function: (member_expression object: (identifier)\
      \ @writer property: (property_identifier) @write)\n      arguments: (arguments\
      \ . (identifier) @sink . (identifier) @data .)))) .)))\n  (#eq? @fs @writer)\
      \ (#eq? @open \"openSync\") (#eq? @write \"writeSync\")\n  (#match? @path \"\
      ^[\\\"']/dev/(sd|nvme|vd|xvd|da|ada)\")\n  (#match? @mode \"^[\\\"']r\\\\+[\\\
      \"']$\")\n  (#eq? @Buffer \"Buffer\") (#eq? @alloc \"alloc\") (#eq? @fill \"\
      0\")\n  (#match? @size \"^\\\\(?[ \\\\t]*[1-9][0-9]*(\\\\s*\\\\*\\\\s*[1-9][0-9]*)?[\
      \ \\\\t]*\\\\)?$\")\n  (#eq? @handle @sink) (#eq? @buffer @data))\n"
- id: c-raw-device-zero-write-loop
  desc: C loop zero-fills opened raw device
  for:
  - c
  if:
    type: tree-sitter
    query: "((compound_statement\n  (declaration declarator: (init_declarator declarator:\
      \ (identifier) @handle\n    value: (call_expression function: (identifier) @open\n\
      \      arguments: (argument_list . (string_literal) @path . (identifier) @mode))))\n\
      \  . (if_statement !alternative condition: (parenthesized_expression (binary_expression\
      \ left: (identifier) @checked_handle operator: \"<\" right: (number_literal)\
      \ @open_error)) consequence: (return_statement))?\n  . (declaration type: (primitive_type)\
      \ @type\n    declarator: (array_declarator declarator: (identifier) @buffer\
      \ size: (number_literal) @size))\n  . (expression_statement (call_expression\
      \ function: (identifier) @memset\n    arguments: (argument_list . (identifier)\
      \ @initialized . (number_literal) @fill\n      . (sizeof_expression value: (identifier)\
      \ @initialized_size) .)))\n  . (for_statement !initializer !condition !update\n\
      \    body: (compound_statement . (if_statement !alternative\n      condition:\
      \ (parenthesized_expression (binary_expression\n        left: (call_expression\
      \ function: (identifier) @write\n          arguments: (argument_list . (identifier)\
      \ @sink . (identifier) @data\n            . (sizeof_expression value: (identifier)\
      \ @written_size) .))\n        operator: \"<=\" right: (number_literal) @error))\n\
      \      consequence: (break_statement)) .)))\n  (#eq? @handle @checked_handle)\
      \ (#eq? @open_error \"0\")\n  (#eq? @open \"open\") (#eq? @mode \"O_RDWR\")\n\
      \  (#match? @path \"^\\\"/dev/(sd|nvme|vd|xvd|da|ada)\")\n  (#eq? @type \"char\"\
      ) (#match? @size \"^[1-9][0-9]*$\")\n  (#eq? @memset \"memset\") (#eq? @fill\
      \ \"0\")\n  (#eq? @buffer @initialized) (#eq? @buffer @initialized_size)\n \
      \ (#eq? @write \"write\") (#eq? @handle @sink)\n  (#eq? @buffer @data) (#eq?\
      \ @buffer @written_size) (#eq? @error \"0\"))\n"
- id: javascript-raw-device-zero-write
  desc: JS zero-writes an opened raw device
  for:
  - javascript
  - typescript
  if:
    type: tree-sitter
    query: "((statement_block\n (lexical_declaration (variable_declarator name: (identifier)\
      \ @handle value:\n  (call_expression function: (member_expression object: (identifier)\
      \ @fs property: (property_identifier) @open)\n   arguments: (arguments . (string)\
      \ @path . (string) @mode .))))\n . (expression_statement (call_expression function:\
      \ (member_expression object: (identifier) @writer property: (property_identifier)\
      \ @write)\n  arguments: (arguments . (identifier) @sink . (call_expression function:\n\
      \   (member_expression object: (identifier) @Buffer property: (property_identifier)\
      \ @alloc)\n   arguments: (arguments . (_) @size . (number)? @fill .)) .))))\n\
      \ (#eq? @fs @writer) (#eq? @open \"openSync\") (#eq? @write \"writeSync\")\n\
      \ (#match? @path \"^[\\\"']/dev/(sd[a-z]+[0-9]*|x?vd[a-z]+[0-9]*|a?da[0-9]+|nvme[0-9]+n[0-9]+(p[0-9]+)?)[\\\
      \"']$\") (#match? @mode \"^[\\\"']r\\\\+[\\\"']$\")\n (#eq? @Buffer \"Buffer\"\
      ) (#eq? @alloc \"alloc\") (#eq? @fill \"0\")\n (#match? @size \"^\\\\(?[ \\\\\
      t]*[1-9][0-9]*(\\\\s*\\\\*\\\\s*[1-9][0-9]*)?[ \\\\t]*\\\\)?$\") (#eq? @handle\
      \ @sink))\n"
- id: javascript-dd-zero-block-device-argv
  desc: JS dd zero uses bound device operands
  for:
  - javascript
  - typescript
  if:
    type: tree-sitter
    query: "((call_expression function: [(identifier) @callee (member_expression object:\
      \ (identifier) @owner property: (property_identifier) @callee)]\n arguments:\
      \ (arguments . (string) @program . (array . (string) @input . (string) @output\
      \  .) .))\n(#eq? @callee \"execFileSync\")\n(#eq? @owner \"child_process\")\n\
      (#match? @program \"^[\\\"']dd[\\\"']$\")\n(#match? @input \"^[\\\"']if=/dev/zero[\\\
      \"']$\")\n(#match? @output \"^[\\\"']of=/dev/(sd[a-z]+[0-9]*|x?vd[a-z]+[0-9]*|a?da[0-9]+|nvme[0-9]+n[0-9]+(p[0-9]+)?|loop[0-9]+|mmcblk[0-9]+(p[0-9]+)?)[\\\
      \"']$\"))\n((call_expression function: [(identifier) @callee (member_expression\
      \ object: (identifier) @owner property: (property_identifier) @callee)]\n arguments:\
      \ (arguments . (string) @program . (array . (string) @input . (string) @output\
      \  . (string) @bs .) .))\n(#eq? @callee \"execFileSync\")\n(#eq? @owner \"child_process\"\
      )\n(#match? @program \"^[\\\"']dd[\\\"']$\")\n(#match? @input \"^[\\\"']if=/dev/zero[\\\
      \"']$\")\n(#match? @output \"^[\\\"']of=/dev/(sd[a-z]+[0-9]*|x?vd[a-z]+[0-9]*|a?da[0-9]+|nvme[0-9]+n[0-9]+(p[0-9]+)?|loop[0-9]+|mmcblk[0-9]+(p[0-9]+)?)[\\\
      \"']$\")\n(#match? @bs \"^[\\\"']bs=[1-9][0-9]*[kKmMgG]?[\\\"']$\"))\n((call_expression\
      \ function: [(identifier) @callee (member_expression object: (identifier) @owner\
      \ property: (property_identifier) @callee)]\n arguments: (arguments . (string)\
      \ @program . (array . (string) @input . (string) @output  . (string) @count\
      \ .) .))\n(#eq? @callee \"execFileSync\")\n(#eq? @owner \"child_process\")\n\
      (#match? @program \"^[\\\"']dd[\\\"']$\")\n(#match? @input \"^[\\\"']if=/dev/zero[\\\
      \"']$\")\n(#match? @output \"^[\\\"']of=/dev/(sd[a-z]+[0-9]*|x?vd[a-z]+[0-9]*|a?da[0-9]+|nvme[0-9]+n[0-9]+(p[0-9]+)?|loop[0-9]+|mmcblk[0-9]+(p[0-9]+)?)[\\\
      \"']$\")\n(#match? @count \"^[\\\"']count=[1-9][0-9]*[\\\"']$\"))\n((call_expression\
      \ function: [(identifier) @callee (member_expression object: (identifier) @owner\
      \ property: (property_identifier) @callee)]\n arguments: (arguments . (string)\
      \ @program . (array . (string) @input . (string) @output  . (string) @bs . (string)\
      \ @count .) .))\n(#eq? @callee \"execFileSync\")\n(#eq? @owner \"child_process\"\
      )\n(#match? @program \"^[\\\"']dd[\\\"']$\")\n(#match? @input \"^[\\\"']if=/dev/zero[\\\
      \"']$\")\n(#match? @output \"^[\\\"']of=/dev/(sd[a-z]+[0-9]*|x?vd[a-z]+[0-9]*|a?da[0-9]+|nvme[0-9]+n[0-9]+(p[0-9]+)?|loop[0-9]+|mmcblk[0-9]+(p[0-9]+)?)[\\\
      \"']$\")\n(#match? @bs \"^[\\\"']bs=[1-9][0-9]*[kKmMgG]?[\\\"']$\")\n(#match?\
      \ @count \"^[\\\"']count=[1-9][0-9]*[\\\"']$\"))\n"
  unless:
  - type: symbol
    kind: function
    exact: execFileSync
