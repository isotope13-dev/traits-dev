defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  # Neutral co-occurrence: filesystem and storage utilities also issue IRPs.
  # This profile alone proves neither a disk write nor a boot-record change.
  - id: kernel-disk-irp-api-profile
    desc: Disk driver path and I/O request API profile
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/device/storage::disk-driver-object-path
      - id: micro-behaviors/fs/file/handle::io-build-asynchronous-fsd-request
      - id: micro-behaviors/os/kernel/device::iof-call-driver
