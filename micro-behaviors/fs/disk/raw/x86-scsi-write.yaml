# SCSI WRITE(10) CDB construction paired with IOCTL_SCSI_PASS_THROUGH.
# This is raw-write capability, not evidence of a destructive overwrite.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-scsi-write10-passthrough-setup
    desc: SCSI WRITE(10) passthrough request setup
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: 'C6 44 24 ?? 2A [80-128] 68 04 D0 04 00 (50|51|52|53|56|57) FF 15 ?? ?? ?? ??'
