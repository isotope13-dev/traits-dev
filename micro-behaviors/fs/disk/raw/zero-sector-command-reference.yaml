defaults:
  platforms: [unix]
  for: [elf, macho]

traits:
  - id: dd-zero-first-sector-command-reference
    desc: Text describes a single-sector zero write
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'dd\s+if=/dev/zero.{0,60}\bof=/dev/[A-Za-z0-9/_-]{1,60}.{0,60}bs=(446|512).{0,40}count=1'
    unless:
      - id: well-known/tool/detection/

