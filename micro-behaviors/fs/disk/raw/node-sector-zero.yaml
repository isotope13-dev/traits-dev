# Bind the writable physical-disk handle, freshly allocated zero sector and
# write operands in adjacent statements. Disk imaging can legitimately use
# this operation; silent destructive exports supply their own intent evidence.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
traits:
  - id: node-physicaldrive-first-sector-zero-write
    desc: Writes zero-filled first physical-disk sector
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator name: (identifier) @fd
            value: (call_expression function: (member_expression
              object: (identifier) @fs_open property: (property_identifier) @open)
              arguments: (arguments . (string) @device . (string) @mode .))))
          . (lexical_declaration (variable_declarator name: (identifier) @zeros
            value: (call_expression function: (member_expression
              object: (identifier) @buffer property: (property_identifier) @alloc)
              arguments: (arguments . (number) @size . (number) @fill .))))
          . (expression_statement (call_expression function: (member_expression
            object: (identifier) @fs_write property: (property_identifier) @write)
            arguments: (arguments . (identifier) @handle . (identifier) @data
              . (number) @offset . (number) @length . (number) @position .)))) @operation
          (#eq? @fs_open @fs_write)
          (#eq? @open "openSync") (#eq? @write "writeSync")
          (#match? @device "(?i)^[\"']\\\\{4}[.]\\\\{2}PhysicalDrive[0-9]+[\"']$")
          (#match? @mode "^[\"']r[+][\"']$")
          (#eq? @buffer "Buffer") (#eq? @alloc "alloc")
          (#eq? @size "512") (#eq? @fill "0")
          (#eq? @fd @handle) (#eq? @zeros @data)
          (#eq? @offset "0") (#eq? @length "512") (#eq? @position "0"))
