traits:
- platforms: &id001
  - unix
  - android
  - ios
  for: &id002
  - shell
  id: dd-zero-to-dev
  desc: dd zero-fill to device node
  crit: notable
  if:
    type: text
    regex: (?m)^\s*(sudo\s+)?dd\s+.{0,100}if=/dev/zero.{0,100}of=/dev/.{1,64}
    not:
    - regex: \bof=/dev/(null|zero|random|urandom|stdin|stdout|stderr)\b
    - regex: \bof=/dev/(fd|pts|shm|tty)(/|\b)
  unless:
  - id: micro-behaviors/os/console/io::command-targets-dev-stdout
- platforms: *id001
  for: *id002
  id: dd-urandom-to-dev
  desc: dd random-fill to device node
  crit: notable
  if:
    type: text
    regex: (?m)^\s*(sudo\s+)?dd\s+.{0,100}if=/dev/u?random.{0,100}of=/dev/.{1,64}
    not:
    - regex: \bof=/dev/(null|random|urandom)\b
  unless:
  - id: micro-behaviors/os/console/io::command-targets-dev-stdout
- crit: notable
  conf: 0.6
  platforms:
  - unix
  for:
  - scripts
  - source
  - binaries
  - text
  id: dd-zero-device-command
  desc: dd command text zero-fills a device target
  if:
    type: text
    regex: (BLOCK[ \t]+)?dd\s+if=/dev/zero[^\r\n]{0,50}of=/dev/[a-zA-Z0-9][a-zA-Z0-9._/-]{0,63}
  not:
  - regex: ^BLOCK[ \t]+
  - regex: \bof=/dev/(null|zero|full|random|urandom|stdin|stdout|stderr)\b
  - regex: \bof=/dev/(fd|pts|shm|tty)(/|\b)
  unless:
  - id: micro-behaviors/fs/disk/raw::device-command-defensive-context
  - id: micro-behaviors/fs/disk/partition::bsd-disk-installation-context
composite_rules:
- platforms: *id001
  for: *id002
  id: dd-fill-to-dev
  desc: dd zero or random fill written to a device node
  crit: notable
  conf: 0.85
  any:
  - id: micro-behaviors/fs/disk/raw::dd-zero-to-dev
  - id: micro-behaviors/fs/disk/raw::dd-urandom-to-dev
  unless:
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: metadata/file/naming::test-directory-component
  - id: well-known/app/utility/kpango-dotfiles/
  - id: well-known/app/storage/clonezilla/
  - id: metadata/package/documentation/source/
  - id: micro-behaviors/fs/path/config/system::openwrt-firmware-component-context
  - id: micro-behaviors/hardware/flash/device::firmware-upgrade-context
- crit: exception
  conf: 0.98
  platforms:
  - unix
  for:
  - scripts
  - binaries
  - text
  id: device-command-defensive-context
  desc: Block-device command safety or imaging context
  any:
  - id: micro-behaviors/process/create/shell/guard::command-guard-pattern-fixtures
  - id: well-known/app/utility/kpango-dotfiles/
  - id: well-known/app/storage/clonezilla/
