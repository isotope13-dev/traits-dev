      \ @open)\n      arguments: (argument_list . (interpreted_string_literal) @path\n\
      \        . (selector_expression field: (field_identifier) @mode)))))\n  . (if_statement\
      \ !alternative condition: (binary_expression left: (identifier) @checked_error\
