      \ @close)))?\n  . (short_var_declaration left: (expression_list (identifier)\
      \ @buffer)\n    right: (expression_list (call_expression function: (identifier)\
      \ @make\n      arguments: (argument_list . (slice_type element: (type_identifier)\
      \ @byte) . (_) @size))))\n  . (for_statement .\n    body: (block (statement_list\
      \ . (if_statement !alternative\n      initializer: (short_var_declaration right:\
      \ (expression_list\n        (call_expression function: (selector_expression\
