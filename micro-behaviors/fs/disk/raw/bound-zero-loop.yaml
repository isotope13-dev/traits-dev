- id: python-raw-device-zero-write-loop
  desc: Python loop zero-fills opened raw device
  for:
  - python
  if:
    type: tree-sitter
    query: "((with_statement\n  (with_clause (with_item value:\n    (as_pattern\n\
      \      (call function: (identifier) @open\n        arguments: (argument_list\
      \ . (string) @path . (string) @mode))\n      alias: (as_pattern_target (identifier)\
      \ @handle))))\n  body: (block\n    . (expression_statement (assignment left:\
      \ (identifier) @buffer\n      right: (binary_operator left: (string) @zero operator:\
      \ \"*\" right: (_) @size)))\n    . (while_statement condition: (true)\n    \
      \  body: (block . (try_statement .\n        body: (block . (expression_statement\n\
      \          (call function: (attribute object: (identifier) @sink attribute:\
      \ (identifier) @write)\n            arguments: (argument_list . (identifier)\
      \ @data .))) .)\n         . (except_clause (block . (break_statement) .)) .)\
      \ .)) .))\n  (#eq? @open \"open\")\n  (#match? @path \"^[\\\"']/dev/(sd|nvme|vd|xvd|da|ada)\"\
      )\n  (#match? @mode \"^[\\\"']r\\\\+b[\\\"']$\")\n  (#match? @zero \"^b[\\\"\
      ']\\\\\\\\(x00|0)[\\\"']$\")\n  (#match? @size \"^\\\\(?[ \\\\t]*[1-9][0-9]*(\\\
      \\s*\\\\*\\\\s*[1-9][0-9]*)?[ \\\\t]*\\\\)?$\")\n  (#eq? @handle @sink)\n  (#eq?\
      \ @buffer @data)\n  (#eq? @write \"write\"))\n"
  unless:
  - id: "metadata/lang/source/declaration::python-local-open-name-binding"
