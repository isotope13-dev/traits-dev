traits:
- for:
  - go
  id: go-openfile-block-device-path
  desc: Go OpenFile names block-device path
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: os\.OpenFile\s*\(\s*"/dev/(sd|nvme|vd|xvd|mmcblk|da|ada)
- for:
  - rust
  id: rust-open-block-device-path
  desc: Rust OpenOptions names block-device path
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: OpenOptions::new\(\)[\s\S]{0,200}\.open\s*\(\s*"/dev/(sd|nvme|vd|xvd|da|ada)
- for:
  - python
  id: python-open-block-device-update-mode
  desc: Python opens device path in update mode
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: open\s*\(\s*"/dev/(sd|nvme|vd|xvd|da|ada)[^"]{0,30}"\s*,\s*"r\+b"
- for:
  - javascript
  - typescript
  id: node-opensync-block-device-path
  desc: Node openSync names block-device path
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: openSync\s*\(\s*["']/dev/(sd|nvme|vd|xvd|da|ada)
- for:
  - c
  - cpp
  id: c-open-rdwr-block-device-path
  desc: C open names device path with O_RDWR
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: open\s*\(\s*"/dev/(sd|nvme|vd|xvd|da|ada)[^"]{0,30}"\s*,\s*O_RDWR
  not:
  - substr: /dev/vduse
defaults:
  platforms:
  - unix
