# Raw Windows disk access primitives. These describe capability only; destructive
# disk intent is inferred separately when a concrete overwrite target is present.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: windows-raw-disk-read-api-set
    desc: Windows raw disk read API set
    crit: component
    conf: 0.88
    all:
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/file/handle::device-io-control-win
      - id: micro-behaviors/fs/read/file/handle::read-file

  - id: windows-physicaldrive-read-profile
    desc: Reads a Windows physical drive through raw disk APIs
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/fs/path/device/storage::windows-physicaldrive-path
      - id: windows-raw-disk-read-api-set

  # Capability co-occurrence only: the legs match file-globally, so this does
  # not establish that the drive handle is the write target. Composites that
  # assert drive writes must add overwrite behavior (see
  # objectives/impact/wipe/disk/mbr/pe.yaml).
  - id: windows-physicaldrive-write-profile
    desc: PhysicalDrive path with file create and write APIs
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/device/storage::windows-physicaldrive-path
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/write/file/handle::write-file

  # Managed P/Invoke declarations are CLR metadata strings rather than PE
  # imports. Requiring both APIs and the device path distinguishes raw-disk
  # access from an ordinary managed application that merely writes files.
  - id: windows-managed-physicaldrive-write-profile
    desc: .NET P/Invoke opens and writes a Windows physical drive
    crit: notable
    conf: 0.96
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/fs/path/device/storage::windows-physicaldrive-path
      - id: micro-behaviors/fs/file/open::createfile-api-text-reference
      - id: micro-behaviors/fs/write/file/handle::native-binary-write-file-text
