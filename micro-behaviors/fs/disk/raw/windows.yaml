# Raw Windows disk access primitives. These describe capability only; destructive
# disk intent is inferred separately when a concrete overwrite target is present.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: windows-physicaldrive-read-profile
    desc: PhysicalDrive path beside read/control APIs
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/fs/path/device/storage::windows-physicaldrive-path
      - id: micro-behaviors/fs/file/open/unspecified::file-create-win
      - id: micro-behaviors/fs/file/handle::device-io-control-win
      - id: micro-behaviors/fs/read/file/handle::read-file

  - id: windows-drive-volume-raw-read-profile
    desc: Reads a drive-letter volume through raw file APIs
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/fs/path/device/storage::windows-drive-volume-device-template
      - id: micro-behaviors/fs/file/open/unspecified::file-create-win
      - id: micro-behaviors/fs/read/file/handle::read-file
      - id: micro-behaviors/fs/file/handle::set-file-pointer

  # These file-wide facts do not establish that a write targets the drive
  # handle. Keep the co-occurrence visible, but name it without claiming a
  # raw-drive write.
  - id: windows-physicaldrive-path-write-api-cooccurrence
    desc: PhysicalDrive path and file-write API occur in the same program
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/device/storage::windows-physicaldrive-path
      - id: micro-behaviors/fs/file/open/unspecified::file-create-win
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file

  # Managed P/Invoke declarations are CLR metadata strings rather than PE
  # imports. Requiring both APIs and the device path distinguishes raw-disk
  # access from an ordinary managed application that merely writes files.
  - id: windows-managed-physicaldrive-write-profile
    desc: .NET PhysicalDrive path with CreateFile and WriteFile references
    crit: notable
    conf: 0.96
    all:
      - id: metadata/lang/compiler/managed::dotnet-assembly
      - id: micro-behaviors/fs/path/device/storage::windows-physicaldrive-path
      - id: micro-behaviors/fs/file/open/unspecified::createfile-api-text-reference
      - id: micro-behaviors/fs/write/file/handle/unspecified::native-binary-write-file-text
