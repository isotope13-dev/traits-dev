defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]

traits:
  - id: disk-wipe-phrase
    desc: References disk wipe terminology
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: '\bdisk\s+wipe\b'
      case_insensitive: true
    unless:
      - id: metadata/binary/resource/identity::resource-only-dll-context
