# Manifest and symlink observations may occur in different archive members.
defaults:
  platforms: [unix]

composite_rules:
  - id: postinstall-system-bin-link-clues
    desc: Postinstall and system-bin symlink clues
    crit: notable
    conf: 0.95
    for: [npm, tar, package.json, javascript]
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/fs/link::system-bin-symlink-create
