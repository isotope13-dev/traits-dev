# Windows reparse-point creation. A reparse point can be ordinary filesystem
# plumbing, so these are capabilities; the placement/evasion objective combines
# them with directory creation and movement.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, powershell, batch, csharp]

traits:
  - id: create-symbolic-link-directory-api
    desc: Creates a Windows symbolic link
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      regex: '^CreateSymbolicLink[AW]?$'

  - id: directory-symbolic-link-flag
    desc: Directory symbolic-link flag
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp]
    if:
      type: text
      word: SYMBOLIC_LINK_FLAG_DIRECTORY

  - id: set-reparse-point-control-code
    desc: Sets an FSCTL reparse point
    crit: notable
    conf: 0.92
    for: [pe, dll, c, cpp, powershell, csharp]
    if:
      type: text
      word: FSCTL_SET_REPARSE_POINT

  - id: open-reparse-point-handle
    desc: Opens a handle at a reparse point
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, powershell, csharp]
    if:
      type: text
      word: FILE_FLAG_OPEN_REPARSE_POINT

  - id: powershell-new-item-junction
    desc: PowerShell creates a directory junction
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?im)^\s*(New-Item|ni)\s+[^\r\n;|#]{0,160}-ItemType\s+Junction\b'

  - id: mklink-directory-junction
    desc: Creates a directory junction with mklink
    crit: notable
    conf: 0.92
    for: [batch, powershell]
    if:
      type: text
      regex: '(?im)(^|[;&|])\s*(cmd\s+/c\s+)?mklink\s+/J\s+[^\r\n;&|#]{1,220}'

composite_rules:
  - id: windows-reparse-point-create
    desc: Creates a Windows directory reparse point
    crit: notable
    conf: 0.9
    any:
      - id: create-symbolic-link-directory-api
      - id: powershell-new-item-junction
      - id: mklink-directory-junction
      - id: set-reparse-point-control-code
