# Direct syscall instructions expose the same neutral capabilities as imports.
# Presence does not establish execution or malicious intent.
defaults:
  platforms: [linux]
  for: [elf]
  crit: baseline
  conf: 0.9
traits:
  - id: readlink-syscall
    desc: Reads symbolic link target via Linux syscall
    if:
      type: syscall
      name: [readlink, readlinkat]
