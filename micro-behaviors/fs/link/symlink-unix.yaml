defaults:
  platforms:
  - unix
  - windows
  for:
  - elf
  - shell
  - python
  - c
  - cpp
traits:
- id: symlink
  desc: Create symbolic links
  crit: baseline
  conf: 0.66
  if:
    type: symbol
    exact: symlink
- id: symlinkat
  desc: Create symbolic links
  crit: baseline
  conf: 0.66
  if:
    type: symbol
    exact: symlinkat
- id: readlink
  desc: Read symbolic link target path
  crit: notable
  conf: 0.8
  for:
  - elf
  - shell
  - python
  - objc
  if:
    type: symbol
    exact: readlink
  unless:
  - type: basename
    regex: \.so(\.\d+)*$
- id: readlinkat
  desc: Read symbolic link target path
  crit: baseline
  conf: 0.8
  if:
    type: symbol
    exact: readlinkat
- id: node-symlink-sync
  desc: Calls Node.js symlinkSync
  crit: notable
  conf: 0.85
  for:
  - javascript
  - typescript
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/build
  if:
    type: symbol
    kind: call
    regex: (^|\.)symlinkSync$
- id: shell-ln-symlink
  desc: Shell creates a symbolic link
  crit: notable
  conf: 0.88
  for:
  - shell
  if:
    type: text
    regex: (?m)(^|[;&|])[ \t]*ln[ \t]+-[A-Za-z]*s[ \t]+
composite_rules:
- id: system-bin-symlink-create
  desc: Symlink call near a system-bin path
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  platforms:
  - unix
  scope: file
  near_lines: 12
  all:
  - id: micro-behaviors/fs/link::node-symlink-sync
  any:
  - id: micro-behaviors/fs/path/binary::binary-usr-local
  - id: micro-behaviors/fs/path/binary::usr-bin-executable-path
- id: symlink-create
  desc: Create symbolic links
  crit: baseline
  conf: 0.66
  any:
  - id: micro-behaviors/fs/link::symlink
  - id: micro-behaviors/fs/link::symlinkat
  - id: micro-behaviors/fs/link::node-symlink-sync
  - id: micro-behaviors/fs/link::shell-ln-symlink
- id: symlink-read
  desc: Read symbolic link target path
  crit: baseline
  conf: 0.8
  any:
  - id: micro-behaviors/fs/link::readlink
  - id: micro-behaviors/fs/link::readlinkat
  - id: micro-behaviors/fs/link::readlink-syscall
