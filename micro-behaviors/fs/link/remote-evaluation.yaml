# Command structures also survive in pooled native strings and embedded scripts.
# These are traversal settings, not evidence of ransomware or privilege gain.
defaults:
  platforms: [windows]
  for: [pe, batch, powershell]
  crit: notable
  conf: 0.98

traits:
  - id: remote-to-remote-symlink-enable
    desc: Enables remote-to-remote symlink evaluation
    if:
      type: raw
      regex: '(?i)fsutil(\.exe)?\s+behavior\s+set\s+SymlinkEvaluation\s+R2R:1([^0-9]|$)'

  - id: remote-to-local-symlink-enable
    desc: Enables remote-to-local symlink evaluation
    if:
      type: raw
      regex: '(?i)fsutil(\.exe)?\s+behavior\s+set\s+SymlinkEvaluation\s+R2L:1([^0-9]|$)'
