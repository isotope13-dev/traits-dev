# Symbolic Link Operations
# MBC: E1222 (File Permission Modification)
# ATT&CK: T1222
defaults:
  platforms: [unix, windows]
  for: [elf, shell, python]
traits:
  - id: symlink
    desc: Create symbolic links
    crit: baseline
    conf: 0.66
    if:
      type: symbol
      exact: "symlink"
  - id: symlinkat
    desc: Create symbolic links
    crit: baseline
    conf: 0.66
    if:
      type: symbol
      exact: "symlinkat"
  - id: readlink
    desc: Read symbolic link target path
    crit: baseline
    conf: 0.8
    for: [elf, shell, python, objc]
    if:
      type: symbol
      exact: "readlink"
    unless:
      - type: basename
        regex: '\.so(\.\d+)*$'
  - id: readlinkat
    desc: Read symbolic link target path
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      exact: "readlinkat"
  - id: symlink-resolve
    desc: Resolve symbolic links to canonical
    crit: baseline
    conf: 0.66
    if:
      type: symbol
      regex: realpath
  - id: node-symlink-sync
    desc: Node.js creates symbolic links
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/library/structure/
    if:
      type: text
      regex: '\.symlinkSync\s*\('
  - id: shell-ln-symlink
    desc: Shell creates a symbolic link
    crit: notable
    conf: 0.88
    for: [shell]
    if:
      type: text
      # Require `ln` in shell command position and an option containing `s`;
      # ordinary prose or a variable named `ln` is not a link operation.
      regex: '(?m)(^|[;&|])[ \t]*ln[ \t]+-[A-Za-z]*s[ \t]+'
composite_rules:
  - id: symlink-create
    desc: Create symbolic links
    crit: baseline
    conf: 0.66
    any:
      - id: symlink
      - id: symlinkat
      - id: node-symlink-sync
      - id: shell-ln-symlink
  - id: symlink-read
    desc: Read symbolic link target path
    crit: baseline
    conf: 0.8
    any:
      - id: readlink
      - id: readlinkat
