# Source: https://sec-consult.com/vulnerability-lab/advisory/multiple-critical-vulnerabilities-in-multiple-tp-link-device-series/
# Root-target links are also used in administration and syscall regression tests.
# A root target alone proves neither share exposure nor a boundary crossing.
defaults:
  platforms: [unix]
  crit: notable
  conf: 0.95
traits:
  - id: shell-filesystem-root-target
    desc: Shell symlink targets filesystem root
    for: [shell]
    if:
      type: text
      regex: '(?m)(^|[;&|])\s*ln\s+-[a-zA-Z]*s[a-zA-Z]*\s+["'']?/["'']?\s+[^\s;|&]{1,80}'
  - id: api-filesystem-root-target
    desc: Symlink API targets filesystem root
    for: [python, javascript, typescript, c, cpp]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(symlink|symlinkSync)$'
      arg:
        index: 0
        kind: string
        exact: /
