# Windows reparse-point creation. A reparse point can be ordinary filesystem
# plumbing, so these are capabilities; the placement/evasion objective combines
# them with directory creation and movement.
defaults:
  crit: notable
  platforms: [windows]
  for: [binaries, source]

traits:
  - id: create-symbolic-link-directory-api
    desc: Windows symbolic-link creation API reference
    conf: 0.9
    for: [pe, dll, c, cpp]
    if:
      type: symbol
      regex: '^CreateSymbolicLink[AW]?$'

  - id: directory-symbolic-link-flag
    desc: Directory symbolic-link flag
    conf: 0.9
    for: [pe, dll, c, cpp, csharp]
    if:
      type: text
      word: SYMBOLIC_LINK_FLAG_DIRECTORY


composite_rules:
  - id: windows-directory-symlink-create
    desc: Windows directory symbolic-link API and flag
    crit: notable
    conf: 0.92
    all:
      - id: create-symbolic-link-directory-api
      - id: directory-symbolic-link-flag
