defaults:
  platforms: [android, unix]
  for: [javascript, typescript]
  attack: T1222

composite_rules:
  - id: termux-command-symlink-install
    desc: Installs package commands as Termux bin symlinks
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/application/prefix::termux-prefix-bin-construction
      - id: node-symlink-sync
      - id: micro-behaviors/fs/directory/traverse::traverse-readdir-walk-find
