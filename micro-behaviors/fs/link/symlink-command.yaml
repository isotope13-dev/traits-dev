defaults:
  platforms: [unix, windows]
  crit: notable

traits:
  - id: shell-ln-symbolic-link-command
    desc: Creates symbolic link with ln -s
    conf: 0.93
    platforms: [unix]
    for: [shell]
    if:
      type: text
      exclude_comments: true
      regex: '\bln\s+-[A-Za-z]*s[A-Za-z]*\s+'

  - id: python-os-symlink-call
    desc: Creates symbolic link via Python symlink call
    conf: 0.95
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)symlink$'

composite_rules:
  - id: script-symbolic-link-create
    desc: Script or source creates a symbolic link
    crit: notable
    conf: 0.93
    for: [scripts, go]
    any:
      - id: shell-ln-symbolic-link-command
      - id: python-os-symlink-call
      - id: micro-behaviors/fs/link::node-symlink-sync
      - id: micro-behaviors/fs/link::symlink-dup
      - id: micro-behaviors/fs/link::mklink-directory-symlink
