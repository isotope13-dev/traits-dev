defaults:
  for: [python]
  platforms: [macos]
  crit: notable
traits:
  - id: python-tcc-directory-target
    desc: Calls symlink with TCC policy target
    if:
      type: symbol
      kind: call
      regex: '^(os\.)?symlink$'
      arg:
        index: 0
        from:
          value: '/com\.apple\.TCC(/TCC\.db)?$'
