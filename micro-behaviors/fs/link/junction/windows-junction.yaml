defaults:
  crit: notable
  platforms: [windows]
  for: [binaries, source]

traits:
  - id: mount-point-reparse-tag
    desc: Windows mount-point reparse-tag reference
    conf: 0.94
    if:
      type: text
      word: IO_REPARSE_TAG_MOUNT_POINT

  - id: powershell-new-item-junction
    desc: PowerShell creates a directory junction
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(?im)^\s*(New-Item|ni)\s+[^\r\n;|#]{0,160}-ItemType\s+Junction\b'

  - id: mklink-directory-junction
    desc: Creates a directory junction with mklink
    conf: 0.92
    for: [batch, powershell]
    if:
      type: text
      regex: '(?im)(^|[;&|])\s*(cmd\s+/c\s+)?mklink\s+/J\s+[^\r\n;&|#]{1,220}'

composite_rules:
  - id: windows-reparse-point-create
    desc: Windows directory-junction creation references
    conf: 0.9
    any:
      - id: powershell-new-item-junction
      - id: mklink-directory-junction
      - id: native-junction-create-reference
  - id: native-junction-create-reference
    desc: Junction tag and reparse-setting code references
    conf: 0.92
    all:
      - id: micro-behaviors/fs/device/ioctl::set-reparse-point-control-code
      - id: mount-point-reparse-tag
