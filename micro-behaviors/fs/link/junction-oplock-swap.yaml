# These mechanics also occur in filesystem test tools. The protected target
# and payload-write context belong to the consuming escalation objective.
defaults:
  platforms: [windows]
  for: [pe, rust, c, go, csharp]

composite_rules:
  - id: oplock-disposition-reparse-apis
    desc: Oplock, delete-disposition, and reparse APIs
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/fs/file/oplock::oplock-primitive
      - id: micro-behaviors/fs/file/handle::nt-set-information-file
      - id: micro-behaviors/fs/file/handle::file-disposition-information
      - id: micro-behaviors/fs/device::set-reparse-point-control-code
      - id: micro-behaviors/fs/link::mount-point-reparse-tag
    near_bytes: 16384
