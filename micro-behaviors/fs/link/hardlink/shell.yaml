defaults:
  crit: notable
  conf: 0.95
  for:
  - shell
  platforms:
  - unix
traits:
- id: shell-ln-hardlink-operands
  desc: Shell ln syntax uses two hard-link operands
  if:
    type: tree-sitter
    language: shell
    query: "((command name: (command_name [(word) (string) (raw_string)] @callee)\
      \ . argument: [(word) (string) (raw_string)] @source . argument: [(word) (string)\
      \ (raw_string)] @target .)\n (#match? @callee \"^(ln|\\\"ln\\\"|'ln')$\")\n\
      \ (#not-match? @source \"^[\\\"']?-\") (#not-match? @target \"^[\\\"']?-\"))\n\
      ((command name: (command_name [(word) (string) (raw_string)] @callee) . argument:\
      \ (word) @force . argument: [(word) (string) (raw_string)] @source . argument:\
      \ [(word) (string) (raw_string)] @target .)\n (#match? @callee \"^(ln|\\\"ln\\\
      \"|'ln')$\")\n (#eq? @force \"-f\")\n (#not-match? @source \"^[\\\"']?-\") (#not-match?\
      \ @target \"^[\\\"']?-\"))\n"
  unless:
  - type: symbol
    kind: function
    exact: ln
  - id: metadata/lang/source::shell-parser-recovery-node
