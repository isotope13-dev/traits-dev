defaults:
  for: [scripts, binaries]
  platforms:
    - unix
    - windows
  mbc: F0003
traits:
  - id: mkfifo-reference
    desc: mkfifo shell command invocation
    crit: notable
    conf: 0.5
    platforms:
      - unix
    if:
      type: text
      regex: '(?m)(^|[;&|]\s*)(/usr/bin/)?mkfifo\s+[/~A-Za-z0-9._-]'
    downgrade:
      any:
        - type: metrics
          field: binary.string_density
          min: 50
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/file/format/
      - id: metadata/vendor/identity/
      - id: metadata/package/files/system-package::shell-completion-script
      - id: well-known/tool/detection/security-scanner::auditr-defensive-signature-catalog
      # Encyclopedia/docs mention mkfifo without creating pipes.
      - id: metadata/file/profile/identity/
  - id: mkfifo-variable-target
    desc: Creates FIFO at shell variable path
    crit: notable
    conf: 0.95
    platforms: [unix]
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: mkfifo
      arg:
        kind: string
        substr: "$"
