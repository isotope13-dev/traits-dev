# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: splice-syscall
    desc: Transfers data through pipes
    crit: baseline
    if:
      type: syscall
      name: [splice, tee, vmsplice]
      arch: [x86_64, aarch64]
