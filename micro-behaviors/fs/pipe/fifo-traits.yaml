defaults:
  crit: notable
  for:
  - scripts
  - binaries
  platforms:
  - unix
  mbc: F0003
traits:
- id: mkfifo-reference
  desc: mkfifo shell command invocation
  conf: 0.5
  if:
    type: text
    regex: '(?m)(^|[;&|"\x27]\s*)(/usr/bin/)?mkfifo\s+[/~A-Za-z0-9._-]'
  downgrade:
    any:
    - type: metrics
      field: text.string_density
      min: 50
  unless:
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: metadata/file/format/
  - id: metadata/vendor/identity/
  - id: metadata/package/files/system-package::shell-completion-script
  - id: metadata/file/profile/threat-scanning::auditr-defensive-signature-catalog
  - id: metadata/file/profile/identity/
  - id: metadata/file/catalog/pattern-rules::secret-rule-category-declaration
  - id: metadata/file/catalog/pattern-rules::secret-rule-pattern-example-block
- id: mkfifo-variable-target
  desc: Creates FIFO at shell variable path
  conf: 0.95
  for:
  - shell
  if:
    type: symbol
    kind: call
    exact: mkfifo
    arg:
      kind: string
      substr: $
