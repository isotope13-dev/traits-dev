defaults:
  crit: notable
  for:
  - scripts
  - binaries
  platforms:
  - unix
  mbc: F0003
traits:
- id: mkfifo-reference
  desc: mkfifo shell command text
  conf: 0.5
  if:
    type: text
    regex: '(?m)(^|[;&|"\x27]\s*)(/usr/bin/)?mkfifo\s+[/~A-Za-z0-9._-]'
- id: mkfifo-variable-target
  desc: Creates FIFO at shell variable path
  conf: 0.95
  for:
  - shell
  if:
    type: symbol
    kind: call
    exact: mkfifo
    arg:
      kind: string
      substr: $
