# Require the complete path expression, not unrelated split/join calls.
# The input need not be a URL: this records filename construction only.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-query-stripped-basename-join
    desc: Joins directory with query-stripped basename
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((call function: (attribute) @join
          arguments: (argument_list . (_) .
            (subscript value: (call
              function: (attribute object: (subscript
                value: (call function: (attribute attribute: (identifier) @split_path)
                  arguments: (argument_list . (string) @slash .))
                subscript: (unary_operator argument: (integer) @last) @negative)
                attribute: (identifier) @split_query)
              arguments: (argument_list . (string) @question .))
              subscript: (integer) @first) .)) @path
          (#eq? @join "os.path.join")
          (#eq? @split_path "split") (#eq? @split_query "split")
          (#match? @slash "^[\"']/[\"']$")
          (#match? @question "^[\"']\\?[\"']$")
          (#eq? @negative "-1") (#eq? @last "1") (#eq? @first "0"))
