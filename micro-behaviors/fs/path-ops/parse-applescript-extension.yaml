defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
traits:
  - id: applescript-extension-membership-filter
    desc: Extension read followed by membership test
    crit: notable
    conf: 0.94
    if:
      type: text
      # Bounded syntax; does not bind both expressions to the same value.
      regex: '(?is)name extension of.{1,140}?\bif\b.{1,80}?\bis in\b'
