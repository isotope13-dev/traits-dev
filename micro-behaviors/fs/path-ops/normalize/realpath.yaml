# Canonicalization resolves dot components and symbolic links.
defaults:
  platforms: [unix, windows]
  for: [elf, shell, python, c, cpp]
traits:
  - id: canonical-path-api
    desc: Canonical pathname resolution API reference
    crit: baseline
    conf: 0.66
    if:
      type: symbol
      exact: realpath

  - id: php-realpath-call
    desc: Resolves canonical filesystem path
    for: [php]
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: realpath
