defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  crit: notable
traits:
- id: final-path-by-handle-api-reference
  desc: Final filesystem path by handle API reference
  conf: 0.95
  if:
    type: text
    exact: GetFinalPathNameByHandle
    section: .text
- id: final-path-by-handle-import
  desc: Imports final filesystem path by handle API
  conf: 0.98
  if:
    type: import
    regex: ^GetFinalPathNameByHandle[AW]$
