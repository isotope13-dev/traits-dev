defaults:
  platforms:
  - macos
  - linux
  - windows
  for:
  - macho
  - elf
  - pe
  crit: notable
traits:
- id: relative-dotfile-path-format
  desc: Format string joins directory and dotfile
  conf: 0.94
  if:
    type: text
    regex: '%s[\\/]\.[A-Za-z0-9_.-]{3,32}'
- id: dot-prefixed-js-path-format
  desc: Format string for dot-prefixed JavaScript path
  conf: 0.95
  platforms:
  - windows
  for:
  - pe
  if:
    type: text
    regex: '%s\.[A-Za-z0-9_-]{0,16}%l?[dux]\.(js|mjs|cjs)'
