# A bare method-name string is ambiguous; require the Path API call.
defaults:
  platforms: [windows, unix]
  for: [csharp]
traits:
  - id: dotnet-get-directory-name-token
    desc: C# Path.GetDirectoryName call
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(System\.IO\.)?Path\s*\.\s*GetDirectoryName\s*\('
