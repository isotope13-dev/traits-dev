# A bare method-name string is ambiguous; require the Path API call.
defaults:
  platforms: [windows, unix]
  for: [csharp]
traits:
  - id: dotnet-combine-method-token
    desc: C# Path.Combine call
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\b(System\.IO\.)?Path\s*\.\s*Combine\s*\('
