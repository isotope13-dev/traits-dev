defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-dot-prefixed-joined-path
    desc: Python joins dot-prefixed path
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: os.path.join
      arg:
        kind: string
        regex: '^\.[A-Za-z0-9_.-]{3,}$'
