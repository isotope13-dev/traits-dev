defaults:
  platforms: [unix, windows]
  for: [python, go, csharp, javascript, typescript]

traits:
  - id: source-path-builder-call
    desc: Calls a path join or combine API
    crit: baseline
    conf: 0.95
    if:
      # A bare join/combine method also describes strings and collections.
      # Require a path API receiver rather than inferring it from the verb.
      type: symbol
      kind: call
      regex: '^(path\.join|os\.path\.join|filepath\.Join|Path\.Combine)$'
