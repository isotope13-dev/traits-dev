defaults:
  for: [text]
  platforms: [windows]
  crit: notable
  conf: 0.95
traits:
  - id: autocad-startup-script-path
    desc: Joins directory and AutoCAD startup filename
    if:
      type: text
      # Optional backslashes: AutoLISP joins a directory as "\\acaddoc.lsp".
      regex: '(?i)\(\s*strcat\s+\w+\s+"\\*acad(doc)?\.lsp"\s*\)'
