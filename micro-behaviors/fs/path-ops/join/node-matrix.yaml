defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-hidden-exec-dir-join
    desc: Joins parent and hidden directory segments
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: path.join
      args:
        - index: 1
          kind: string
          exact: '..'
        - index: 2
          kind: string
          regex: '^\.[\w-]+$'

  - id: node-os-arch-dir-join
    desc: Joins a platform-architecture directory path
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      regex: '^path\.join\([\s\S]{0,240}["'']-["'']\s*\+\s*arch\b'
