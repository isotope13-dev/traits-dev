# Package-local paths that resolve a native sidecar shipped beside Python code.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-parent-dotdir-join
    desc: Python joins parent path to dotdir
    if:
      type: text
      regex: 'parent\s*/\s*["'']\.[^"'']{1,24}["'']'
