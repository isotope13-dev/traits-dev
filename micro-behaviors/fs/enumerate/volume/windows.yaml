# Volume enumeration - Windows
# Used by ransomware to identify encryption targets
defaults:
  for: [pe, dll, c, cpp]
  platforms: [windows]
traits:
  - id: nt-query-volume-information-file
    desc: Native Windows volume-information query
    crit: notable
    conf: 0.94
    for: [pe, dll, c, cpp, csharp, go, rust, zig, python]
    if:
      type: text
      word: NtQueryVolumeInformationFile

  - id: nt-full-size-information-class
    desc: Native full-volume-size information class
    crit: notable
    conf: 0.94
    for: [pe, dll, c, cpp, csharp, go, rust, zig, python]
    if:
      type: text
      regex: '\bFileFsFullSizeInformation(Ex)?\b'

  - id: actual-available-allocation-units
    desc: Reads actual available volume allocation units
    crit: notable
    conf: 0.96
    for: [c, cpp, csharp, go, rust, zig, python]
    if:
      type: text
      word: ActualAvailableAllocationUnits

  - id: get-volume-info
    desc: Windows volume-information API name reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "(^|::)GetVolumeInformation[AW]?$"
    unless:
      - id: well-known/tool/development/cli/fzf::fzf-binary
  - id: find-first-volume
    desc: Begin volume enumeration
    crit: notable
    conf: 0.9
    attack: "T1083"
    if:
      type: symbol
      regex: "FindFirstVolume[AW]?$"
  - id: find-next-volume
    desc: Continue volume enumeration
    crit: notable
    conf: 0.9
    attack: "T1083"
    if:
      type: symbol
      regex: "FindNextVolume[AW]?$"
  - id: get-disk-free-space
    desc: GetDiskFreeSpace API import
    crit: notable
    conf: 0.9
    attack: "T1082"
    if:
      type: import
      regex: "^GetDiskFreeSpace(Ex)?[AW]?$"
  - id: find-volume-close
    desc: Close volume enumeration handle
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: "FindVolumeClose"
  - id: find-first-volume-source
    desc: Source begins volume enumeration
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '\bFindFirstVolume[AW]?\s*\('
    unless:
      - id: metadata/lang/source/
  - id: find-next-volume-source
    desc: Source continues volume enumeration
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: FindNextVolumeW
    unless:
      - id: metadata/lang/source/

composite_rules:
  - id: native-free-volume-capacity-query
    desc: Queries free capacity via native volume info
    crit: notable
    conf: 0.97
    for: [c, cpp, csharp, go, rust, zig, python]
    all:
      - id: nt-query-volume-information-file
      - id: nt-full-size-information-class
      - id: actual-available-allocation-units

  - id: volume-enumeration-continue
    desc: Continues Windows volume enumeration
    crit: notable
    conf: 0.92
    any:
      - id: find-next-volume
      - id: find-next-volume-source

  - id: volume-enumeration-workflow
    desc: Enumerates Windows volumes with first and next operations
    crit: notable
    conf: 0.94
    all:
      - id: windows-volume-enumeration
      - id: volume-enumeration-continue
