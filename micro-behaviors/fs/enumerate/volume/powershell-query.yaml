defaults:
  platforms: [windows]
  for: [scripts, source]
  crit: notable
  conf: 0.96

traits:
  - id: powershell-wmi-volume-query
    desc: PowerShell command queries WMI volume inventory
    if:
      type: text
      regex: '(?i)\bGet-WmiObject\s+-Class\s+Win32_Volume\b'

  - id: powershell-cluster-shared-volume-query
    desc: PowerShell cluster-volume query reference
    if:
      type: text
      word: Get-ClusterSharedVolume
