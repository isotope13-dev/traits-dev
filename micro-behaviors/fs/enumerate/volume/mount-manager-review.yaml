defaults:
  for:
    - pe
  platforms:
    - windows
composite_rules:
  - id: mountpoint-manager-enumeration
    desc: Mount manager and volume reference clues
    crit: notable
    conf: 0.9
    attack: T1083
    all:
      - id: micro-behaviors/fs/path/device/storage::mountpoint-manager-device
    any:
      - id: micro-behaviors/os/registry/explorer/reference::mountpoints2-volume-key
      - id: metadata/lang/natural/diagnostic::mountmgr-ioctl-log
  # Enumerating every drive letter and then recursing each one is how a Win32
  # program reaches "every file on the machine". Backup tools, installers,
  # indexers and antivirus scanners all do it, so this stays a capability;
  # objectives/impact/wipe/ and collection composites add the intent.
