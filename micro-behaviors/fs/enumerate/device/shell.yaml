# Shell patterns that enumerate block-device paths.
defaults:
  platforms: [unix, android, ios]
  for: [shell]

traits:
  - id: grep-sd-device-path
    desc: Grep for sd/xvd device paths
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '\^/dev/(\[?[shv]+\]?d|xvd)'

  - id: grep-nvme-device-path
    desc: Grep for NVMe/flash device paths
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '\^/dev/(nvme|mmcblk|mtd)'

  - id: grep-mapper-device-path
    desc: Grep for mapper/disk device paths
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '\^/dev/(mapper|disk|dm-)'

  - id: grep-loop-device-path
    desc: Grep for loop/optical device paths
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: '\^/dev/(loop|sr)'
    unless:
      - id: well-known/app/utility/util-linux::util-linux-source-tree
      - id: well-known/app/utility/util-linux::util-linux-test-script

  # Viasat/FreeDownloadManager-class wipers list every mounted /dev node via
  # `grep ^/dev /proc/mounts` rather than naming sd/nvme/mapper classes.
  - id: grep-proc-mounts-dev-prefix
    desc: Grep /proc/mounts for /dev paths
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'grep\b[^\n]{0,40}\^/dev[^\n]{0,60}/proc/mounts'

  - id: freebsd-geom-disk-list
    desc: geom command enumerates FreeBSD disk devices
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bgeom\s+disk\s+list\b'

composite_rules:
  - id: block-device-path-enumeration
    desc: Enumerates block devices by path
    crit: notable
    conf: 0.9
    any:
      - id: grep-sd-device-path
      - id: grep-nvme-device-path
      - id: grep-mapper-device-path
      - id: grep-loop-device-path
      - id: grep-proc-mounts-dev-prefix
