# Migrated from the legacy install-hook trigger bucket; the result owns this path.
defaults:
  platforms: [unix, windows]
  for: [javascript, package.json, shell]
traits:
- id: shell-data-directory-output-substitution
  desc: Shell substitution reads /data command output
  crit: notable
  conf: 0.97
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: "metadata/file/naming::test-directory-component"
  if:
    type: text
    regex: '\$\((ls\s+-[A-Za-z0-9]*R?\s+/data/?|cat\s+/data/[^)]{1,120})\)'

