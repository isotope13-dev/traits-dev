defaults:
  platforms: [windows, unix]
  for: [class, java_class]
traits:
  # File.listFiles(FileFilter|FilenameFilter): the call descriptor in the
  # constant pool, so it is a real call rather than prose.
  - id: jvm-listfiles-filter
    desc: Lists a directory through a file filter
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\(Ljava/io/File(name)?Filter;\)\[Ljava/io/File;'
