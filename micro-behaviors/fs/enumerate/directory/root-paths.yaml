defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: root-paths-array
    desc: 'Array containing root paths'
    crit: notable
    if:
      type: text
      regex: '\[\s*[''"]([A-Z]:\\\\|/)[''"]\s*,\s*[''"]([A-Z]:\\\\|/home)[''"]\s*

'
    unless:
      - id: well-known/lib/web/prototype::copyright
      - id: well-known/lib/web/prototype::header-x
      - id: metadata/package/completeness/
      - id: well-known/lib/web/syntaxhighlighter::syntaxhighlighter-brush
      - id: well-known/lib/data/ioredis::ioredis-auto-pipeline
