# File System Enumeration - JavaScript
# Capabilities related to traversing directories
#
# The `fs[\w$]{0,3}\.` namespace prefix, here and in fs/file/rename/javascript.yaml,
# is what makes these survive a bundler. esbuild deconflicts two modules that both
# do `import * as fs from 'fs'` by numbering them, so the shipped artifact reads
# `fs2.readdirSync(...)`; rollup emits `fs$1`, and `fs_1` also occurs. A matcher
# anchored on a bare `fs\.` therefore misses the enumeration in most published
# npm packages, since almost everything on the registry ships bundled.
#
# Measured on @adhdev/session-host's own CJS build: the file contains
# `fs2.readdirSync(this.runtimesDir, { withFileTypes: true })` and scored NOTHING
# from this directory, while the identical call spelled `fs.readdirSync` fires.
# Two one-line fixtures differing only in that digit confirmed it.
#
# The prefix is kept (rather than dropping to a bare `\.readdirSync`, which the
# unlinkSync/writeFileSync siblings use) so the atoms still assert an fs-namespace
# call rather than any object with a same-named method.
defaults:
  platforms: [windows, unix]
  for: [javascript]
traits:
  - id: node-recursive-executable-search
    desc: Node recursive search for EXE files
    crit: notable
    conf: 0.94
    attack: T1083
    if:
      type: text
      regex: 'readdirSync[\s\S]{0,900}statSync[\s\S]{0,900}endsWith\s*\(\s*["'']\.exe["'']\s*\)'
  # Same walk, spelled with path.extname().toLowerCase() === ".exe" instead
  # of endsWith. The receiver is often renamed, so this does not require `fs.`.
  - id: node-extname-exe-walk
    desc: Node walk collects exe by extension
    crit: notable
    conf: 0.93
    attack: T1083
    if:
      type: text
      regex: 'readdirSync[\s\S]{0,180}statSync[\s\S]{0,180}toLowerCase\(\)\s*===\s*["'']\.exe["'']'
  - id: file-search-exclude-common
    desc: References common system/dev directory names
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: '["'']node_modules["'']|["'']Program Files["'']|["'']AppData["'']'

composite_rules:
  - id: node-dot-ssh-readdir
    desc: Node enumerates a user's .ssh directory
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    attack: T1083,T1552.004
    # Bundles often contain an SSH client's home-path construction and an
    # unrelated library's readdirSync. Require the two operations to be local.
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/directory/readdir::node-readdir-sync-call
      - id: micro-behaviors/fs/path/secret-config::js-ssh-homedir-path
