defaults:
  platforms: [linux, windows, macos]
  for: [javascript, typescript]

traits:
  - id: javascript-json-filename-filter
    desc: JavaScript filters JSON filenames
    crit: component
    conf: 0.84
    unless:
      - id: well-known/tool/sysadmin/k9s
      - id: well-known/lib/format/json-ts
    if:
      type: text
      regex: "\\.json['\"`][\\s\\S]{0,180}(includes|indexOf)"
