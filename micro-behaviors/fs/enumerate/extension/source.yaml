defaults:
  platforms: [windows, unix]
  for: [c, text]

traits:
  # A wildcard is only a target-selection primitive. Infection intent comes
  # from composites that additionally require DOS file-open/write operations.
  - id: quoted-exe-wildcard-mask
    desc: Quoted wildcard EXE file mask
    crit: component
    conf: 0.93
    if:
      type: text
      regex: '(?i)["'']\*\.EXE["'']'
