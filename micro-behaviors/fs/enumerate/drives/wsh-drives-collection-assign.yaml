# `Set drives = fso.Drives` keeps the FileSystemObject drive collection for a
# later For Each walk; the inline `For Each d In fso.Drives` form lives in
# wsh.yaml.
defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1083

traits:
  - id: vbs-fso-drives-collection-assign
    desc: VBScript stores the FSO drive collection
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bSet\s+\w+\s*=\s*\w+\.Drives\b'
