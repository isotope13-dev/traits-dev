defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.86

traits:
  - id: drive-letter-existence-probe
    desc: Tests Windows drive-letter paths
    if:
      type: text
      regex: 'string\.ascii_uppercase[\s\S]{0,80}\.exists\s*\('

  - id: drive-list-api
    desc: Queries drive inventory through a Python API
    if:
      type: symbol
      kind: call
      regex: '(^|\.)list_drives$'

  - id: pywin32-get-logical-drives-call
    desc: Python queries the Windows logical-drive bitmask
    platforms: [windows]
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: win32api.GetLogicalDrives
