# .NET drive enumeration via DriveInfo API (System.IO)
defaults:
  for: [pe, dll, csharp]
  platforms: [windows]
  attack: T1083

traits:
  - id: get-drives-dotnet
    desc: DriveInfo.GetDrives drive enumeration
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: GetDrives
      exclude_comments: true

  - id: get-volume-label-dotnet
    desc: DriveInfo.VolumeLabel property query
    crit: notable
    conf: 0.87
    if:
      type: text
      exact: get_VolumeLabel

  - id: is-ready-check-dotnet
    desc: DriveInfo.IsReady readiness check
    crit: baseline
    conf: 0.8
    if:
      type: text
      exact: get_IsReady

  - id: dotnet-drive-type-reference
    desc: References .NET DriveType or property getter
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(get_DriveType\b|\bDriveType\s*\.)'
      exclude_comments: true

  - id: drive-info-class
    desc: DriveInfo class reference
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: DriveInfo
      exclude_comments: true

composite_rules:
  - id: dotnet-drive-enumeration
    desc: .NET drive enumeration via DriveInfo API
    crit: notable
    conf: 0.88
    all:
      - id: get-drives-dotnet
    any:
      - id: drive-info-class
      - id: dotnet-drive-type-reference
      - id: is-ready-check-dotnet
      - id: get-volume-label-dotnet

  - id: dotnet-drive-selection-by-label
    desc: .NET drive selection by volume label
    crit: notable
    conf: 0.9
    attack: T1091
    all:
      - id: get-drives-dotnet
      - id: get-volume-label-dotnet
    any:
      - id: dotnet-drive-type-reference
      - id: is-ready-check-dotnet
    downgrade:
      any:
        - id: metadata/lang/compiler/managed/
