defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.96
traits:
  - id: powershell-logical-disk-query
    desc: Queries logical disks using WMI or CIM
    if:
      type: symbol
      kind: call
      regex: '^Get-(WmiObject|CimInstance)$'
      arg:
        kind: identifier
        name: Win32_LogicalDisk
