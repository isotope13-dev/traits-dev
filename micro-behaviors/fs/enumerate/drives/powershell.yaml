defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.96
traits:
  - id: powershell-logical-disk-query
    desc: Queries logical disks using WMI or CIM
    if:
      type: symbol
      kind: call
      regex: '^Get-(WmiObject|CimInstance)$'
      arg:
        kind: identifier
        name: Win32_LogicalDisk
  - id: powershell-recursive-disk-user-targets
    desc: Recursive disk and user-root listing references
    if:
      type: yara
      source: |
        rule recursive_disk_user_targets {
          strings:
            $drives = /Get-(WmiObject|CimInstance)[ \t]+Win32_LogicalDisk\b/ nocase
            $recurse = /\b(gci|Get-ChildItem)\b[^\r\n]{0,100}-recurse\b/ nocase
            $users = /[A-Z]:\\Users["']/ nocase
          condition:
            all of them
        }
