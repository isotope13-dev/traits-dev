defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

composite_rules:
  - id: mobile-branding-asset-references
    desc: Mobile branding asset references co-occur
    needs: 2
    any:
      - id: micro-behaviors/fs/path/config/mobile::ios-splashscreen-imageset
      - id: micro-behaviors/fs/path/config/mobile::android-launcher-mipmap-density
      - id: metadata/lang/source/naming/action/token::react-native-splash-assets
  - id: white-label-config-references
    desc: White-label or configuration references co-occur
    for: [javascript, typescript, package.json]
    conf: 0.92
    needs: 2
    any:
      - id: metadata/package/keywords/capability::package-white-label-keyword
      - id: well-known/tool/development/mobile/react-native-white-label::react-native-white-label-title
      - id: well-known/tool/development/mobile/react-native-white-label::rnwl-config-path
      - id: well-known/tool/development/mobile/react-native-white-label::rnwl-output-manifest
      - id: metadata/lang/source/naming/action/token::white-label-apply-command
      - id: micro-behaviors/data/config/load::load-config-helper-call
