defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.85
composite_rules:
  - id: mobile-google-services-name-profile
    desc: Mobile Google services names co-occur
    crit: notable
    conf: 0.9
    needs: 2
    any:
      - id: micro-behaviors/fs/path/config/mobile::android-google-services-config
      - id: micro-behaviors/fs/path/config/mobile::ios-google-service-info-config
      - id: metadata/lang/source/naming/action/function-name::apply-android-google-services-symbol
      - id: metadata/lang/source/naming/action/function-name::apply-ios-google-services-symbol
  - id: mobile-config-or-white-label-context
    desc: Mobile configuration or white-label context
    for: [javascript, typescript, package.json]
    crit: notable
    conf: 0.95
    any:
      - id: micro-behaviors/fs/config/build::white-label-config-references
      - id: mobile-google-services-name-profile
      - id: micro-behaviors/fs/config/build::mobile-branding-asset-references
      - id: micro-behaviors/communications/url/scheme::mobile-deeplink-config-rewrite
      - id: micro-behaviors/fs/config/build::xcode-scheme-configuration-references
      - id: micro-behaviors/fs/config/build::android-manifest-identity-field-context
