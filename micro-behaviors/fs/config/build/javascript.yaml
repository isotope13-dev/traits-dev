# Writes to a JavaScript project's build manifest.
#
# Relocated from metadata/package/files/package-json::package-json-write, where
# it sat at suspicious/0.9. Two things were wrong with that placement. Writing a
# file is a behaviour, not a neutral structural fact about what the scanned file
# *is*, so metadata/ was the wrong tier — the trait even lived in a file called
# `code-behavior.yaml`. And at suspicious it convicted every scaffolder, version
# bumper, monorepo tool and settings migration that edits a manifest: the
# wjkang.lowcode VS Code extension (284k installs, publisher-verified, matching
# public repo) was rated suspicious for deleting its own renamed `yapi-code.*`
# configuration keys out of the workspace manifest.
#
# It sits beside the Gradle/Maven build-config trait here because package.json
# is the same kind of artifact — the project's build/dependency manifest — and
# that is what makes the write worth surfacing at all. An objective that cares
# about manifest tampering (an install hook injected into `scripts`, a
# dependency swapped at build time) should compose this with its own intent
# evidence rather than inferring it from the write alone.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-writes-package-json
    desc: Node writes to a package.json manifest
    crit: notable
    conf: 0.9
    if:
      type: literal
      regex: writeFileSync\s*\(.{0,220}package\.json|writeFile\s*\(.{0,220}package\.json
    unless:
      - id: metadata/package/testing/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - type: basename
        regex: '\.(test|spec)\.[cm]?[jt]sx?(\.map)?$'
