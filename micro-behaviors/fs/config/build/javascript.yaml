# Writes to a JavaScript project's build manifest.
#
# Relocated from metadata/package/files/package-json::package-json-write, where
# it sat at suspicious/0.9. Two things were wrong with that placement. Writing a
# file is a behaviour, not a neutral structural fact about what the scanned file
# *is*, so metadata/ was the wrong tier — the trait even lived in a file called
# `code-behavior.yaml`. And at suspicious it convicted every scaffolder, version
# bumper, monorepo tool and settings migration that edits a manifest: the
# wjkang.lowcode VS Code extension (284k installs, publisher-verified, matching
# public repo) was rated suspicious for deleting its own renamed `yapi-code.*`
# configuration keys out of the workspace manifest.
#
# It sits beside the Gradle/Maven build-config trait here because package.json
# is the same kind of artifact — the project's build/dependency manifest — and
# that is what makes the write worth surfacing at all. An objective that cares
# about manifest tampering (an install hook injected into `scripts`, a
# dependency swapped at build time) should compose this with its own intent
# evidence rather than inferring it from the write alone.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-writes-package-json
    desc: Node writes to a package.json manifest
    conf: 0.9
    if:
      type: literal
      regex: writeFileSync\s*\(.{0,220}package\.json|writeFile\s*\(.{0,220}package\.json
    unless:
      - id: metadata/package/testing/
      - type: basename
        regex: '\.(test|spec)\.[cm]?[jt]sx?(\.map)?$'

  # process.cwd() joined with a framework config filename: the code resolves
  # the config of whichever project it was invoked from. Build tools, test
  # suites and CLIs do this constantly; it is also how a nested dependency's
  # install script reaches the root project's config, so the injector
  # objective composes it with a nearby write. `__dirname` is deliberately not
  # matched -- it resolves beside the script itself, not the invoking project.
  # Relocated from objectives/supply-chain/trojanized/app/config-injection/,
  # where the atoms sat at suspicious as "Regex component marker".
  - id: cwd-postcss-tailwind-config-path
    desc: Resolves PostCSS/Tailwind config from cwd
    conf: 0.82
    if:
      type: text
      regex: process\.cwd\(\).{0,80}(postcss|tailwind)\.config
  - id: cwd-eslint-next-config-path
    desc: Resolves ESLint/Next.js config from cwd
    conf: 0.82
    if:
      type: text
      regex: process\.cwd\(\).{0,80}(eslint|next)\.config
  - id: cwd-vite-webpack-config-path
    desc: Resolves Vite/webpack config from cwd
    conf: 0.82
    if:
      type: text
      regex: process\.cwd\(\).{0,80}(vite|webpack)\.config
  - id: cwd-astro-vue-config-path
    desc: Resolves Astro/Vue config from cwd
    conf: 0.82
    if:
      type: text
      regex: process\.cwd\(\).{0,80}(astro|vue)\.config
  - id: cwd-vitest-playwright-config-path
    desc: Resolves Vitest/Playwright config from cwd
    conf: 0.82
    if:
      type: text
      regex: process\.cwd\(\).{0,80}(vitest|playwright)\.config
  - id: cwd-cypress-docusaurus-config-path
    desc: Resolves Cypress/Docusaurus config from cwd
    conf: 0.82
    if:
      type: text
      regex: process\.cwd\(\).{0,80}(cypress|docusaurus)\.config
  - id: cwd-remix-svelte-config-path
    desc: Resolves Remix/Svelte config from cwd
    conf: 0.82
    if:
      type: text
      regex: process\.cwd\(\).{0,80}(remix|svelte)\.config

composite_rules:
  - id: js-build-config-near-file-write
    desc: Build config reference near file write
    conf: 0.94
    # Proximity prevents an unrelated write elsewhere in a large module from
    # being described as configuration modification.
    near_lines: 12
    all:
      - id: metadata/build/config::js-build-config-target
    any:
      - id: micro-behaviors/fs/write/file
    unless:
      - id: metadata/build/bundler/asset::js-large-module-bundle
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      # Declaration files can only document these calls, not perform them.
      - id: metadata/lang/scripted::dts-declaration-file
      - id: well-known/tool/development/vcs/facebook-sapling::facebook-sapling-member-context
      # A build config that writes other files is not modifying itself.
      - id: metadata/build/config::js-build-config-direct-basename
      - id: metadata/build/config::next-config-direct-basename

  - id: cwd-framework-config-path
    desc: Resolves a framework config path from cwd
    conf: 0.82
    any:
      - id: cwd-postcss-tailwind-config-path
      - id: cwd-eslint-next-config-path
      - id: cwd-vite-webpack-config-path
      - id: cwd-astro-vue-config-path
      - id: cwd-vitest-playwright-config-path
      - id: cwd-cypress-docusaurus-config-path
      - id: cwd-remix-svelte-config-path
