defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: ini-copy-process-api-set
  desc: INI read/write, file-copy and process-launch API set
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/fs/file/copy/call::copyfile-w
  - id: metadata/binary/symbols/name/process::create-process-w
  - id: micro-behaviors/fs/config/system::ini-read-write-cycle
  any:
  - id: micro-behaviors/fs/delete/file/library::deletefile-w
  - id: micro-behaviors/fs/file/move::move-file-ex
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  needs: 2
