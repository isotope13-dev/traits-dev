defaults:
  for:
  - pe
  - dll
  platforms:
  - windows
composite_rules:
- id: ini-copy-process-api-set
  desc: INI read/write, file-copy and process-launch API set
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/fs/file/copy/call::copyfile-w
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/fs/config/system::ini-read-write-cycle
  any:
  - id: micro-behaviors/fs/delete/file/library::deletefile-w
  - id: micro-behaviors/fs/file/move::move-file-ex
  - id: micro-behaviors/fs/temp/file::temp-path-file-api-primitives
  needs: 2
  unless:
  - id: metadata/binary/vendor::microsoft-corp-versioninfo
  - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
  - id: metadata/binary/symbols/count::large-export-table
  - id: metadata/lang/compiler/managed/
  - id: metadata/binary/installer/
  - id: metadata/lang/compiled::autoit-compiled-script
  - id: well-known/tool
  - id: ini-api-known-utility-context
- id: ini-api-known-utility-context
  desc: Recognized utility context for INI API overlap
  crit: exception
  conf: 0.99
  any:
  - id: well-known/app/system/iobit::advanced-systemcare-component-context
  - id: well-known/app/system/iobit::iobit-component-context
  - id: well-known/app/utility/clipx::clipx-identity
