defaults:
  for: [ne]
  platforms: [windows]
traits:
  - id: win16-write-private-profile
    desc: References Win16 INI string-write API
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: WritePrivateProfileString
  - id: win16-read-private-profile
    desc: References Win16 INI string-read API
    crit: baseline
    conf: 0.85
    if:
      type: text
      substr: GetPrivateProfileString
