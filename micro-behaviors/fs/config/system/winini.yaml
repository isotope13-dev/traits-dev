# Legacy win.ini startup configuration.
#
# Before the registry Run keys, Windows launched login programs from the
# `[windows] run=` line of win.ini. The file is still honored for
# compatibility, so writing an executable path there persists it across
# logins with no registry write for startup monitors to see.
defaults:
  platforms: [windows]
  for: [mirc]
traits:
  - id: winini-run-entry-write
    desc: mIRC writes win.ini run entry
    crit: notable
    conf: 0.9
    attack: T1547.001
    if:
      type: text
      # The path may be built with mIRC concatenation (`$windows $+ \win.ini`),
      # so allow non-newline gap between the command and the filename. Only
      # the `run` value -- the login-persistence one -- matches.
      regex: '(?i)\b/?writeini\s+.{0,80}win\.ini\s+windows\s+run\b'
