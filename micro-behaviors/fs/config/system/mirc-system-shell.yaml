defaults:
  platforms: [windows]
  for: [mirc]
  crit: notable
traits:
  - id: mirc-write-system-ini-boot-shell
    desc: mIRC writes system.ini boot shell
    conf: 0.98
    if:
      type: text
      case_insensitive: true
      regex: 'writeini[^\r\n]{0,64}system\.ini[^\r\n]{0,12}boot\s+shell\b'
  - id: mirc-explorer-client-shell-value
    desc: Explorer shell value includes mIRC executable
    conf: 0.98
    if:
      type: text
      case_insensitive: true
      regex: 'boot\s+shell\s+Explorer\.exe\s+\$mircexe\b'
