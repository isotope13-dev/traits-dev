# macOS preference-database command surface.
#
# `defaults` is a neutral configuration interface. Persistence or defense
# impairment is inferred by objective-tier composites that consume these atoms.
defaults:
  crit: notable
  platforms: [macos]
  for: [scripts, binaries]

traits:
  - id: defaults-read-command
    desc: macOS defaults preference read command
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bdefaults\s+read\b|["'']defaults["'']\s*,\s*["'']read["'']'

  - id: defaults-write-command
    desc: macOS defaults preference write command
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bdefaults\s+write\b|["''](/usr/bin/)?defaults["'']\s*,\s*["'']write["'']'

composite_rules:
  - id: defaults-write-service-endpoint
    desc: Writes a service endpoint through macOS defaults
    crit: notable
    conf: 0.95
    near_lines: 48
    all:
      - id: defaults-write-command
      - id: micro-behaviors/data/config/syntax::service-endpoint-key

  - id: defaults-loopback-service-endpoint-write
    desc: macOS defaults points a service endpoint preference at a loopback WebSocket
    crit: suspicious
    conf: 0.97
    near_lines: 48
    all:
      - id: defaults-write-service-endpoint
      - id: micro-behaviors/communications/http/websocket::loopback-websocket-endpoint
