# macOS preference-database command surface.
#
# `defaults` is a neutral configuration interface. Persistence or defense
# impairment is inferred by objective-tier composites that consume these atoms.
defaults:
  crit: notable
  platforms: [macos]
  for: [scripts, source, binaries]

traits:
  - id: defaults-write-variable-argument
    desc: macOS defaults write uses a shell variable
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bdefaults\s+write\b[^\n]{0,80}["'']?\$[A-Za-z_]\w*'

  - id: defaults-read-command
    desc: macOS defaults preference read command
    conf: 0.95
    if:
      type: text
      regex: '(?im)(^|["'';|&])\s*defaults\s+read\b|["'']defaults["''],\s*["'']read["'']'

  - id: defaults-write-command
    desc: macOS defaults preference write command
    conf: 0.9
    if:
      # The verb may follow the tool directly (shell), as the next argv
      # entry, or as the first array element (execFileSync('defaults',
      # ['write', domain, ...])). One compact shape covers all three.
      type: text
      regex: '(?i)\bdefaults["''\s,]*(\[[^\]]{0,40})?["''\s,]*write\b'

  # Process builders commonly hold the executable and verb in separate
  # arguments (execFileSync('defaults', ['write', domain, ...])) rather
  # than one shell command. Same neutral interface, same level.
  - id: defaults-write-array-argument
    desc: macOS defaults write with array arguments
    conf: 0.9
    for: [javascript, typescript, python, ruby]
    if:
      type: text
      regex: '["'']defaults["'']\s*,\s*\[["'']write["'']'

composite_rules:
  - id: defaults-write-service-endpoint
    desc: defaults write beside endpoint-like literal
    crit: notable
    conf: 0.95
    near_lines: 48
    all:
      - id: defaults-write-command
      # A suffixed literal alone also matches callback names such as
      # restore_cached_endpoint. Keep that weak shape local to the operation
      # that supplies preference-writing context, rather than emitting an
      # independent service-configuration claim on every string literal.
      - id: metadata/lang/source/naming::endpoint-suffixed-identifier-literal

  - id: defaults-loopback-service-endpoint-write
    desc: macOS defaults points a service endpoint preference at a loopback WebSocket
    crit: suspicious
    conf: 0.97
    near_lines: 48
    all:
      - id: defaults-write-service-endpoint
      - id: micro-behaviors/communications/http/websocket::loopback-websocket-endpoint
