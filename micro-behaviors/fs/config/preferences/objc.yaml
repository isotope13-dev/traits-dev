# NSUserDefaults provides application preferences; it does not establish
# persistence, access to another application's settings, or a particular key.
defaults:
  crit: notable
  conf: 0.95
  platforms: [macos]
  for: [macho, dylib]

traits:
  - id: nsuserdefaults-import
    desc: Imports Cocoa application preferences interface
    if:
      type: import
      exact: 'OBJC_CLASS_$_NSUserDefaults'
