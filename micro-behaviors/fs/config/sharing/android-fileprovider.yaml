# A FileProvider mapping alone does not prove the provider is exported or
# that an external caller receives a URI grant. Keep the broad mapping visible.
defaults:
  platforms: [android]
  for: [xml]
traits:
  - id: fileprovider-filesystem-root-mapping
    desc: FileProvider maps the filesystem root
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '<root-path\b[^>]{0,240}\bpath\s*=\s*["''](\.|/)["'']'
