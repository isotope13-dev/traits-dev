defaults:
  platforms: [unix]

traits:
  - id: target-script-handoff
    desc: Hands off to target script
    crit: notable
    conf: 0.95
    for:
      - shell
    if:
      type: text
      substr: 'su "$NEW_USER" -c "$TARGET_SCRIPT"'
  - id: docker-group-membership
    desc: Adds temporary user to docker group
    crit: notable
    conf: 0.95
    for:
      - shell
    if:
      type: text
      substr: 'usermod -aG docker "$NEW_USER"'
  - id: docker-groupadd
    desc: Docker image creates docker group
    crit: notable
    conf: 0.95
    for:
      - shell
      - dockerfile
    if:
      type: text
      substr: groupadd -f docker
  - id: docker-user-switch
    desc: Docker image switches to docker user
    crit: notable
    conf: 0.95
    for:
      - shell
      - dockerfile
    if:
      type: text
      substr: USER docker
  - id: docker-user-unlock
    desc: Docker image unlocks docker user
    crit: notable
    conf: 0.95
    for:
      - shell
      - dockerfile
    if:
      type: text
      substr: passwd -u docker
  - id: builder-system-groupadd
    desc: Build script creates builder system group
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      substr: groupadd -r builder
  - id: builder-system-useradd
    desc: Build script creates builder system user
    crit: notable
    conf: 0.9
    for: [shell]
    if:
      type: text
      regex: 'useradd[^\n]{0,80}-g\s+builder\s+builder'
  - id: cmake-ninja-build-script
    desc: CMake Ninja build script context
    crit: notable
    conf: 0.86
    for: [shell]
    if:
      type: text
      substr: cmake -G Ninja
  - id: nopasswd-all-directive
    desc: 'Bare NOPASSWD: ALL sudoers directive'
    crit: notable
    conf: 0.5
    # Was [shell, python, php, elf], which is the set of languages the first
    # samples happened to be written in rather than the set that can write a
    # sudoers file. A Groovy build step, a Ruby provisioner and a Go installer
    # all shell out the same line; the directive is the evidence and the host
    # language is incidental.
    for: [shell, scripts, source, elf]
    if:
      type: text
      regex: '(?i)\bNOPASSWD\s*:\s*ALL\b'
    # Docs that warn against blanket NOPASSWD:ALL (e.g. "not … NOPASSWD:ALL")
    # must not satisfy the unrestricted drop-in composite.
    not:
      - regex: '(?im)^\s*#.*\bNOPASSWD\s*:\s*ALL\b'
      - regex: '(?i)\bnot\b[^\n]{0,40}\bNOPASSWD\s*:\s*ALL\b'
  - id: sudo-nopasswd
    desc: NOPASSWD sudo directive
    crit: notable
    conf: 0.85
    for:
      - elf
      - shell
    if:
      type: text
      regex: '(?i)\bALL\s*=\s*\(ALL(:ALL)?\)\s+NOPASSWD\s*:'
    unless:
      - id: metadata/build/ci/host::remote-wheel-build-host
      # The script creates the account in the same breath as it grants it.
      # That is build-container provisioning -- makepkg, rpmbuild and pbuilder
      # all refuse to run as root, so CI makes an unprivileged user and gives it
      # passwordless package installs (agent-glovebox's AUR smoke test).
      # Granting NOPASSWD to an account that already exists is the escalation
      # shape and still matches. This is an `unless:` rather than a `downgrade:`
      # because downgrade conditions do not apply to archive members, where most
      # build scripts are actually scanned. One pattern covers the useradd and
      # cloud-config spellings exactly (same windows, verified equivalent);
      # the passwd-write spelling keeps its own windows below.
      # The window covers a full container RUN stanza: Dockerfiles routinely
      # separate the useradd from the grant with explanatory comments and
      # sibling provisioning (group checks, usermod into the sudo group),
      # which runs past 200 bytes while still creating and granting the same
      # fresh account in one step.
      - type: text
        regex: '(?s)(\b(useradd|adduser)\b.{0,400}|#cloud-config.{0,400})NOPASSWD'
      # Some minimal CI images create their throwaway build account by writing
      # passwd/group records directly before granting that new account sudo.
      - type: text
        regex: '(?s)echo.{0,120}>>\s*/etc/passwd.{0,800}NOPASSWD'
      - id: metadata/package/testing/harness/runtime/
      - id: objectives/privilege-escalation/elevation-control/sudo::managed-service-account-sudo
      - id: well-known/lib/ai/tensorflow::tensorflow-user-wrapper
    # A commented-out NOPASSWD line is documentation, not a grant -- same
    # required-absence shape as the sibling rule's `not:` below.
    not:
      - regex: '(?im)^\s*#.*\bNOPASSWD\b'
    downgrade:
      any:
        # One CI-marker pattern covering both previous lists exactly (all
        # eight markers verified). No leading \b: the markers are distinctive
        # enough that only the trailing boundary does real work.
        - type: raw
          regex: '(CI_BUILD_\S+|GITHUB_ACTIONS|BUILDKITE|TF_BUILD|JENKINS_HOME|Docker|cloud(-init|.cfg))\b'
        - type: raw
          regex: 'Vagrant User[\s\S]{0,2048}vagrant insecure public key'
    attack: T1548.004

  # A sudoers entry that hands an account an interpreter is qualitatively
  # different from granting one narrowly scoped maintenance helper. Keep this
  # atomic neutral; the objective also proves that code installs the entry.
  - id: sudoers-nopasswd-shell-command
    desc: Sudoers grants a passwordless shell
    crit: notable
    conf: 0.98
    for: [shell, scripts, source]
    if:
      type: text
      regex: '(?m)^[^#\r\n]{0,80}NOPASSWD\s*:\s*/bin/(ba|da|z|k)?sh\b'
    not:
      - regex: '(?m)^\s*#'

  - id: sudoers-output-redirection
    desc: Redirects output into sudoers.d
    crit: notable
    conf: 0.96
    for: [shell, scripts, source]
    if:
      type: text
      regex: '>{1,2}\s*("?\$pkgdir"?)?/etc/sudoers\.d/'

  # `... | sudo tee /etc/sudoers.d/foo` is how the file actually gets written
  # in practice: a shell redirect is evaluated by the *unprivileged* shell, so
  # `echo ... > /etc/sudoers.d/x` fails as a normal user and every working
  # one-liner reaches for `tee` instead. Matching only the redirect caught the
  # spelling that does not work and missed the one that does.
  - id: sudoers-tee-target
    desc: Pipes into tee under sudoers.d
    crit: notable
    conf: 0.96
    for: [shell, scripts, source]
    if:
      type: text
      regex: '\btee\b[^\n|]{0,60}/etc/sudoers\.d/'

  - id: sudoers-install-target
    desc: Install command targets sudoers.d
    crit: notable
    conf: 0.96
    for: [shell, scripts, source]
    if:
      type: text
      regex: '\binstall\b[^\n]{0,160}/etc/sudoers\.d/'
  - id: python-writes-unrestricted-sudoers-rule
    desc: Python writes unrestricted sudoers rule
    crit: suspicious
    conf: 0.96
    for: [python]
    if:
      type: text
      regex: '\bALL\s*=\s*\(ALL(:ALL)?\)\s+NOPASSWD\s*:\s*ALL\b.{0,100}>{1,2}\s*/etc/sudoers\.d/'
      case_insensitive: true
    unless:
      - id: well-known/app/system/samba::samba-source-tree
      - id: well-known/lib/ai/ibm-watsonx-orchestrate::ibm-watsonx-orchestrate-context
      - type: text
        regex: '(?s)\b(useradd|adduser)\b.{0,400}NOPASSWD'
    attack: T1548.004
  - id: visudo-validate
    desc: visudo validates sudoers configuration
    crit: notable
    conf: 0.7
    for:
      - elf
      - shell
    if:
      type: text
      regex: '\bvisudo\s+-(c|q|cf)\b'
    unless:
      - id: well-known/tool/sysadmin/cubesandbox::cubesandbox-source-path

composite_rules:
  - id: writes-sudoers-dropin
    desc: Writes a sudoers drop-in file
    crit: notable
    conf: 0.96
    any:
      - id: sudoers-output-redirection
      - id: sudoers-install-target
      - id: sudoers-tee-target

  - id: benign-build-sudoers-context
    desc: Build helper sudoers.d context
    crit: component
    conf: 0.9
    any:
      - id: ci-user-handoff-sudo-context
      - id: container-ssh-user-sudo-context
      - id: container-builder-user-sudo-context
      - id: micro-behaviors/fs/path/config/privesc::etc-sudoers-d
  - id: ci-user-handoff-sudo-context
    desc: CI helper sudo handoff context
    crit: component
    conf: 0.95
    for:
      - shell
    all:
      - id: docker-group-membership
      - id: target-script-handoff
  - id: container-ssh-user-sudo-context
    desc: Container image sudo SSH user
    crit: component
    conf: 0.95
    for:
      - shell
      - dockerfile
    all:
      - id: docker-groupadd
      - id: docker-user-switch
      - id: docker-user-unlock
  - id: container-builder-user-sudo-context
    desc: Container build creates builder user with sudo
    crit: component
    conf: 0.93
    for: [shell]
    all:
      - id: builder-system-groupadd
      - id: builder-system-useradd
      - id: cmake-ninja-build-script
