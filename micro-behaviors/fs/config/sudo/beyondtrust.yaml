defaults:
  platforms: [linux]
  for: [scripts, source]
  crit: notable
  conf: 0.97

traits:
  - id: beyondtrust-sudoers-template-append
    desc: Appends to appliance sudoers template
    if:
      type: text
      regex: '>>\s*["'']?/ns/config/sudoers\.template\b'

  # Bind the grant to the command whose output is appended to the template.
  # The list form covers `grep ... || echo ... >> template`: Bash attaches
  # that redirection to the list, rather than just the final echo command.
  - id: beyondtrust-unrestricted-template-append
    desc: Appends passwordless appliance sudo grant
    for: [shell]
    if:
      type: tree-sitter
      query: |
        ((redirected_statement
          body: [
            (command name: (command_name (word) @writer)
              argument: [(raw_string) (string)] @grant)
            (list (command name: (command_name (word) @writer)
              argument: [(raw_string) (string)] @grant))
          ]
          redirect: (file_redirect ">>" destination: (_) @target)) @evidence
          (#eq? @writer "echo")
          (#match? @grant "^[\"'][%\\w${}.-]+\\s+ALL=\\(ALL(:ALL)?\\)\\s+NOPASSWD:\\s*ALL[\"']$")
          (#match? @target "^[\"']?/ns/config/sudoers\\.template[\"']?$"))

