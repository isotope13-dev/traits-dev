# Closed CommonJS program: home-derived destination is the actual copy target.
# No install-hook invocation, user consent or hostile helper behavior is inferred.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: node-home-agent-skill-copy
  desc: Copies skill into home agent instruction tree
  crit: suspicious
  conf: 0.99
  size_max: 16384
  unless:
  - id: metadata/lang/source/origin::heuristic-quoted-source
  if:
    type: tree-sitter
    language: javascript
    query: "((program\n . (lexical_declaration \"const\" . (variable_declarator\n  name: (object_pattern . (shorthand_property_identifier_pattern) @fs_first\n   . (shorthand_property_identifier_pattern) @fs_second .)\n  value: (call_expression function: (identifier) @require_fs\n   arguments: (arguments . (string . (string_fragment) @fs_module .) .))) .)\n . (lexical_declaration \"const\" . (variable_declarator\n  name: (object_pattern . (shorthand_property_identifier_pattern) @path_first\n   . (shorthand_property_identifier_pattern) @path_second .)\n  value: (call_expression function: (identifier) @require_path\n   arguments: (arguments . (string . (string_fragment) @path_module .) .))) .)\n . (lexical_declaration \"const\" . (variable_declarator name: (identifier) @os\n  value: (call_expression function: (identifier) @require_os\n   arguments: (arguments . (string . (string_fragment) @os_module .) .))) .)\n . (lexical_declaration \"const\" . (variable_declarator name: (identifier) @dest\n\
      \  value: (binary_expression\n   left: (call_expression function: (member_expression object: (identifier) @os_input\n    property: (property_identifier) @homedir) arguments: (arguments) @home_args)\n   operator: \"+\" right: (string . (string_fragment) @skill_path .))) .)\n . (expression_statement (call_expression function: (identifier) @mkdir\n  arguments: (arguments\n   . (call_expression function: (identifier) @dirname\n    arguments: (arguments . (identifier) @mkdir_dest .))\n   . (object . (pair key: (property_identifier) @recursive value: (true)) .) .)))\n . (expression_statement (call_expression function: (identifier) @copy\n  arguments: (arguments\n   . (call_expression function: (identifier) @join\n    arguments: (arguments . (identifier) @source_dir . (string)*\n     (string . (string_fragment) @source_name .) .) @source_args)\n   . (identifier) @copy_dest .))) @evidence .)\n (#eq? @require_fs \"require\")\n (#eq? @require_path \"require\")\n (#eq? @require_os \"require\"\
      )\n (#match? @fs_module \"^(node:)?fs$\")\n (#match? @path_module \"^(node:)?path$\")\n (#match? @os_module \"^(node:)?os$\")\n (#match? @fs_first \"^(copyFileSync|mkdirSync)$\")\n (#match? @fs_second \"^(copyFileSync|mkdirSync)$\")\n (#not-eq? @fs_first @fs_second)\n (#match? @path_first \"^(join|dirname)$\")\n (#match? @path_second \"^(join|dirname)$\")\n (#not-eq? @path_first @path_second)\n (#eq? @os @os_input)\n (#eq? @homedir \"homedir\")\n (#match? @home_args \"^\\\\([ \\\\t\\\\r\\\\n]*\\\\)$\")\n (#match? @skill_path \"^/[.](claude|codex|agents)/skills/[^/\\\\r\\\\n]+/SKILL[.]md$\")\n (#eq? @dest @mkdir_dest)\n (#eq? @dest @copy_dest)\n (#eq? @mkdir \"mkdirSync\")\n (#eq? @dirname \"dirname\")\n (#eq? @recursive \"recursive\")\n (#eq? @copy \"copyFileSync\")\n (#eq? @join \"join\")\n (#eq? @source_dir \"__dirname\")\n (#eq? @source_name \"SKILL.md\")\n (#match? @source_args \"^[(]\\\\s*__dirname(\\\\s*,\\\\s*['\\\"][./\\\\w-]+['\\\"])+\\\\s*[)]$\")\n (#not-eq? @os @dest)\n\
      \ (#not-match? @os \"^(require|__dirname|copyFileSync|mkdirSync|join|dirname)$\")\n (#not-match? @dest \"^(require|__dirname|copyFileSync|mkdirSync|join|dirname)$\")\n (#set! cleave.ignore-comments \"true\")\n)\n"
