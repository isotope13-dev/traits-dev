defaults:
  platforms: [unix, windows]
  for: [python]

traits:
- id: telemetry-pth-copy-clues
  desc: Python telemetry.pth and copy2 text clues
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?is)telemetry\.pth[\s\S]{0,240}shutil\.copy2\s*\(

# Generic form: shutil copies a .pth file. A .pth only activates from a
# site directory, so composites pair this with install-hook context.
- id: python-shutil-copy-pth
  desc: shutil copies a .pth file
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: 'shutil\.copy(2|file)?\([^\n]{0,160}\.pth["'']'
