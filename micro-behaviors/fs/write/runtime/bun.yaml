# Bun's direct file-write API is a runtime-specific form of file creation or
# modification; keep it separate from the portable Node.js write atoms.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: bun-write-file
    desc: Bun file-write API call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: Bun.write
