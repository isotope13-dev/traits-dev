# Python credential value writes
defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-formatted-password-write
    desc: Writes a directly formatted password field
    if:
      type: tree-sitter
      query: |
        ((call
          function: (attribute attribute: (identifier) @write)
          arguments: (argument_list
            (call function: (attribute object: (string) attribute: (identifier) @format)
              arguments: (argument_list
                (subscript subscript: (string) @field))))) @output
          (#eq? @write "write")
          (#eq? @format "format")
          (#match? @field "^[\"'](password|passwd|pwd)[\"']$"))
  - id: python-auth-variable-file-write
    desc: Writes auth variable to a file
    if:
      type: tree-sitter
      kind: call
      regex: '\b[A-Za-z_]\w*\.write\s*\(\s*(token|secret|password)\b'
  - id: python-key-variable-file-write
    desc: Writes key variable to a file
    if:
      type: tree-sitter
      kind: call
      regex: '\b[A-Za-z_]\w*\.write\s*\(\s*(api[_-]?key|credential)\b'
