defaults:
  platforms: [unix]
  for: [scripts, source]
traits:
  - id: shell-user-password-pair-append
    desc: Appends a user:password pair to a file
    crit: notable
    conf: 0.9
    if:
      # `echo ${user}:${pass} >> accounts_file` -- the cracker's output file.
      # Both halves must be named like the credential they hold. Any two
      # colon-joined variables matched before, which is the shape of ordinary
      # shell logging (`echo "declared:$SEKRIT:$NEEDLE" >> $log` in a test
      # fixture), not of a recovered account list.
      type: text
      regex: '(?i)echo[^\n]{0,30}\$\{?\w{0,8}(user|acct|login)\w*\}?:\$\{?\w{0,8}(pass|pwd)[^\n]{0,9}>>'
    unless:
      - id: micro-behaviors/os/service/config::rc-common-init-script-header

