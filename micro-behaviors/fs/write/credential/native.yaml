defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.95
traits:
  - id: native-password-buffer-file-write
    desc: Writes a plaintext password buffer
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)\bWriteFile\s*\([^,\n]{1,120},\s*(password|passwd|pwd)\s*->\s*Buffer\b'
