defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.96

traits:
  - id: shell-credential-labeled-variable-write
    desc: Writes credential-labeled shell variable to file
    if:
      # Require a real expansion in a quoted argument and an actual redirect.
      # A comment, a single-quoted example, or an echo to stdout is not a dump.
      type: tree-sitter
      query: |
        ((redirected_statement
          body: (command
            argument: (string [(expansion) (simple_expansion)]))
          redirect: (file_redirect [">" ">>"] destination: (_))) @write
         (#match? @write "^(echo|printf)\\s+[^\\n]*[A-Z_]*(TOKEN|KEY|PASSWORD)=\\$\\{?")
         (#not-match? @write ">\\s*/dev/null\\s*$"))
