defaults:
  platforms: [windows]
  for: [csharp]
  crit: notable
  conf: 0.98

traits:
  - id: csharp-store-request-authorization
    desc: Writes HTTP request authorization to file
    if:
      type: tree-sitter
      kind: call
      regex: 'File\.(Append|Write)AllText\(.{1,80},\s*\w+\.Request\.Headers\["Authorization"]'
