defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: suspicious
traits:
  - id: native-auth-plaintext-password-log
    desc: Logs username and plaintext password arguments
    conf: 0.99
    attack: T1556.004,T1056
    if:
      # The capture is one live authentication function, not a nearby comment,
      # a hash diagnostic, or a format string elsewhere in the source file.
      type: tree-sitter
      language: c
      query: |
        ((function_definition
           declarator: (function_declarator declarator: (identifier) @function)
           body: (compound_statement) @body)
         (#match? @body "\\bfprintf[ \\t\\r\\n]*\\([^;]{1,160}authctxt[ \\t]*->[ \\t]*user[ \\t]*,[ \\t]*password[ \\t]*[,)]"))
