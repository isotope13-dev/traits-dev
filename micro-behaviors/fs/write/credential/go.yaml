defaults:
  platforms: [windows, unix]
  for: [go]
  crit: notable
  conf: 0.95

traits:
  - id: go-password-variable-file-write
    desc: Writes password variable to file
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)\bos\.WriteFile\s*\([^,\n]{1,240},\s*(\[\]byte\s*\(\s*)?(password|passwd|passcode)\b'
