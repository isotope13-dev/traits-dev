defaults:
  platforms: [unix, windows]
  for: [shell]

traits:
  - id: shell-multiple-credential-variable-writes
    desc: Multiple credential-labeled shell write sites
    crit: notable
    conf: 0.94
    # Static write sites can be mutually exclusive credential provisioning.
    # Neither harvesting nor distinct runtime values follows from this count.
    count_min: 2
    if:
      id: micro-behaviors/fs/write/credential::shell-credential-labeled-variable-write
