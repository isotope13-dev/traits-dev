defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: notable
  conf: 0.96

traits:
  - id: ruby-writes-rubygems-credentials
    desc: Ruby writes a RubyGems credential file
    attack: T1552.001
    if:
      type: symbol
      kind: call
      exact: write
      arg:
        kind: string
        regex: '\.gem[/\\]credentials$'
