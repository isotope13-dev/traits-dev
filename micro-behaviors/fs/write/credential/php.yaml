defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1041

traits:
  - id: php-file-dumps-submitted-password
    desc: PHP writes submitted password to file
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      # Follow actual expression nodes, not POST text inside generated PHP.
      # Only sprintf is a recognized wrapper; password_hash output is distinct.
      query: |
        ((function_call_expression
           function: (name) @fn
           arguments: (arguments . (argument) . (argument [
        (subscript_expression
          (variable_name (name) @source)
          [(string (string_content) @field)
           (encapsed_string (string_content) @field)])
        (binary_expression (subscript_expression
          (variable_name (name) @source)
          [(string (string_content) @field)
           (encapsed_string (string_content) @field)]))
        (binary_expression (binary_expression (subscript_expression
          (variable_name (name) @source)
          [(string (string_content) @field)
           (encapsed_string (string_content) @field)])))
        (function_call_expression function: (name) @format
          arguments: (arguments (argument (subscript_expression
          (variable_name (name) @source)
          [(string (string_content) @field)
           (encapsed_string (string_content) @field)]))))])))
         (#eq? @fn "file_put_contents")
         (#eq? @format "sprintf")
         (#eq? @source "_POST")
         (#match? @field "^(pass|password|pwd)$"))
