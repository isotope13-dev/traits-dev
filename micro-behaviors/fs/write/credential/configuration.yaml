defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-credential-path-open-write
    desc: Opens a credential-named path for writing
    conf: 0.95
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)^open\s*\(\s*["''][^"''\n]{0,80}(pass|cred)[^"''\n]{0,80}["'']\s*,\s*["''][wax][bt+]*["'']'
  - id: python-password-store-config-write
    desc: Writes password storage settings
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)\.write\(.{0,80}(password-(db|stores)|store-(plaintext-)?passwords)\s*='
  - id: python-proxy-password-config-write
    desc: Writes HTTP proxy password setting
    conf: 0.9
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)\.write\(.{0,80}http-proxy-password\s*='
