defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.98

traits:
  - id: powershell-store-request-authorization
    desc: Writes HTTP request authorization header to file
    if:
      type: text
      regex: '(Add|Set)-Content\b.{0,120}-Value\s+\$\w+\.Request\.Headers\[["'']Authorization'
      case_insensitive: true

  - id: powershell-pipe-request-authorization
    desc: Pipes HTTP authorization header to file
    if:
      type: text
      regex: '\.Request\.Headers\[["'']Authorization["'']\]\s*\|\s*(Out-File|Add-Content)\b'
      case_insensitive: true

  - id: csharp-store-request-authorization
    desc: Writes HTTP request authorization header to file
    for: [csharp]
    if:
      type: tree-sitter
      query: |
        ((invocation_expression
           function: (member_access_expression) @fn
           arguments: (argument_list . (argument) .
             (argument (element_access_expression) @data)))
         (#match? @fn "^(System\\.IO\\.)?File\\.(Append|Write)AllText$")
         (#match? @data "\\.Request\\.Headers\\[\"Authorization\"\\]"))

composite_rules:
  - id: store-request-authorization
    desc: Writes an HTTP request authorization header
    for: [powershell, csharp]
    any:
      - id: powershell-store-request-authorization
      - id: powershell-pipe-request-authorization
      - id: csharp-store-request-authorization
