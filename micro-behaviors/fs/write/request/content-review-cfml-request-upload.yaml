defaults:
  platforms:
  - unix
  - windows
  for:
  - cfml
  crit: notable
  conf: 0.95
traits:
- id: cffile-member-upload-destination
  desc: Request member supplies upload destination
  if:
    type: symbol
    kind: call
    exact: cffile
    args:
    - index: 0
      from:
        field: action
        whole_value: (?i)^upload(all)?$
    - index: 0
      from:
        field: destination
        member: ^(form|url)\.
- id: cffile-parameter-upload-destination
  desc: Request parameter supplies upload destination
  if:
    type: symbol
    kind: call
    exact: cffile
    args:
    - index: 0
      from:
        field: action
        whole_value: (?i)^upload(all)?$
    - index: 0
      from:
        field: destination
        call: ^getpagecontext\.getrequest\.getparameter$
composite_rules:
- id: cffile-request-upload-destination
  desc: Request supplies file upload destination
  any:
  - id: cffile-member-upload-destination
  - id: cffile-parameter-upload-destination
