defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  # Both destination and contents must come from socket input. A fixed cache
  # path, local JSON document, or unrelated recv call supplies no such proof.
  - id: socket-json-selected-path-content
    desc: Socket input supplies write path and bytes
    crit: suspicious
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '\.write_bytes$'
      receiver:
        from:
          call: '(^|\.)recv$'
          through:
            - call: '^(pathlib\.)?Path$'
              arguments: [0]
            - call: '^json\.loads$'
              arguments: [0]
            - call: '\.decode$'
              receiver: true
      arg:
        index: 0
        from:
          call: '(^|\.)recv$'
          through:
            - call: '^json\.loads$'
              arguments: [0]
            - call: '^base64\.(b64decode|urlsafe_b64decode)$'
              arguments: [0]
            - call: '\.decode$'
              receiver: true
