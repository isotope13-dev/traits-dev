# Writing a site or user customize module: the file site.py imports at every
# interpreter start. Neutral alone (virtualenv tooling writes them);
# composites add the install-hook and payload context.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-customize-file-write
    desc: Opens a customize module for writing
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(site|user)customize\.py["'']\)*,\s*["''][wa]'

  - id: python-customize-write-text
    desc: write_text to a customize module
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(site|user)customize\.py["''][^\n]{0,120}write_text\s*\('
