defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, c, cpp, elf, macho, pe]
  crit: notable
  conf: 0.9

traits:
  - id: startup-init-file-redirect
    desc: Redirects output into an init directory
    if:
      type: text
      regex: '(?im)\b(cat|printf|echo)\b[^\n]{0,120}>>?\s*/etc/(init\.d|rc\.d)/'
  - id: startup-flash-file-redirect
    desc: Redirects output into an appliance flash path
    if:
      type: text
      regex: '(?im)\b(cat|printf|echo)\b[^\n]{0,120}>>?\s*/etc/flash/'
  - id: startup-splitdb-file-redirect
    desc: Redirects output into startup database
    if:
      type: text
      regex: '(?im)\b(cat|printf|echo)\b[^\n]{0,120}>>?\s*/tmp/splitDB/'

composite_rules:
  - id: system-startup-file-write
    desc: Operating-system startup file write
    crit: notable
    conf: 0.94
    any:
      - id: startup-init-file-redirect
      - id: startup-flash-file-redirect
      - id: startup-splitdb-file-redirect
