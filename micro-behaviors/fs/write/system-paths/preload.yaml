defaults:
  platforms: [linux]
  for: [shell]
  crit: notable
  conf: 0.98
traits:
  - id: system-preload-tee-write
    desc: Writes loader preload configuration through tee
    if:
      # Parsed commands distinguish execution from cat/echo inspection,
      # comments, and quoted documentation, while retaining quoted paths.
      type: tree-sitter
      query: |
        ((command
          name: (command_name (word) @utility)
          argument: (_) @path) @write
         (#eq? @utility "tee")
         (#match? @path "^['\"]?/etc/ld[.]so[.]preload['\"]?$"))
  - id: sudo-system-preload-tee-write
    desc: Writes system preload through sudo tee
    if:
      type: tree-sitter
      query: |
        ((command
          name: (command_name (word) @launcher)
          . argument: (word) @utility
          argument: (_) @path) @write
         (#eq? @launcher "sudo")
         (#eq? @utility "tee")
         (#match? @path "^['\"]?/etc/ld[.]so[.]preload['\"]?$"))
