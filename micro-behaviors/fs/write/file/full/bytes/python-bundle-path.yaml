defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: bundle-path-joined-write-bytes
    desc: Bundle path influences joined file write
    if:
      type: tree-sitter
      query: |
        ((for_statement
          body: (block
            (expression_statement (assignment
              left: (identifier) @relative
              right: (subscript subscript: (string) @field)))
            (expression_statement (assignment
              left: (identifier) @mapped
              right: (conditional_expression (identifier) @fallback)))
            (expression_statement (assignment
              left: (identifier) @target
              right: (binary_operator operator: "/" right: (identifier) @mapped_use)))
            (expression_statement (call
              function: (attribute object: (identifier) @write_target
                attribute: (identifier) @write_method)))))
          (#match? @field "^['\"]relativePath['\"]$")
          (#eq? @relative @fallback)
          (#eq? @mapped @mapped_use)
          (#eq? @target @write_target)
          (#eq? @write_method "write_bytes"))
