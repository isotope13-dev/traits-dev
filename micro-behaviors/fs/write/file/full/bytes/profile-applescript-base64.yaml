defaults:
  platforms:
    - macos
  for:
    - applescript
composite_rules:
  - id: applescript-base64-and-file-write
    desc: AppleScript uses Base64 decode and file-write APIs
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::nsdata-base64-decode
      - id: micro-behaviors/fs/write/file/full/bytes::nsdata-write-to-file
