defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: script-content-replaced-then-written
    desc: Writes transformed scriptContent to a file
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator name: (identifier) @script
              value: (call_expression
                function: (member_expression
                  object: (member_expression property: (property_identifier) @field)
                  property: (property_identifier) @replace))))
          (expression_statement
            (ternary_expression
              condition: (call_expression
                function: (member_expression property: (property_identifier) @write)
                arguments: (arguments . (_) . (identifier) @written)))))
          (#eq? @field "scriptContent")
          (#eq? @replace "replace")
          (#eq? @write "writeFile")
          (#eq? @script @written))
