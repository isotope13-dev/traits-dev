defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: node-write-joined-claude-json
    desc: Writes a joined Claude configuration path
    if:
      type: symbol
      kind: call
      # ECMAScript identifiers may spell these names with Unicode escapes.
      regex: '\.(writeFile(Sync)?|\\u0077\\u0072\\u0069\\u0074\\u0065\\u0046\\u0069\\u006[cC]\\u0065)$'
      arg:
        index: 0
        from:
          call: '\.(join|\\u006[aA]\\u006[fF]\\u0069\\u006[eE])$'
          argument: 1
          literal: '^\.claude\.json$'
