defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-write-base64-decoded-data
    desc: Writes Buffer-decoded Base64 bytes synchronously
    conf: 0.97
    if:
      # Bind the write's data argument directly to Buffer.from(_, "base64").
      # Provenance is unavailable inside this sample's anonymous bootstrap.
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @write)
          arguments: (arguments . (_) .
            (call_expression
              function: (member_expression
                object: (identifier) @buffer
                property: (property_identifier) @decode)
              arguments: (arguments . (_) .
                (string (string_fragment) @encoding))) @decoded)) @sink
          (#eq? @write "writeFileSync")
          (#eq? @buffer "Buffer")
          (#eq? @decode "from")
          (#eq? @encoding "base64"))
