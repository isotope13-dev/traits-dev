defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
  - id: php-writes-base64-data
    desc: PHP writes Base64-decoded file content
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: file_put_contents
      arg:
        index: 1
        from:
          call: '^base64_decode$'
  # Bare-PHP injections carry no opening tag and yield no call facts, so the
  # call-shape fallback matches the same operation as source text; text search
  # also reaches decoded string layers. The comma anchors the decoder to a
  # later argument so a decoded target path cannot satisfy this alone.
  - id: php-writes-base64-data-text
    desc: Writes Base64-decoded content (text shape)
    conf: 0.95
    for: [php, text, data]
    if:
      type: text
      case_insensitive: true
      regex: 'file_put_contents\s*\(.{0,120},\s*base64_decode\s*\('

composite_rules:
  # Two-step form: the decoder output is assigned to a variable, then the
  # variable is written; neither atom alone establishes the write of decoded
  # content, so the join is the finding. The decoded-data write claim stays
  # probable, not proven dataflow.
  - id: php-writes-base64-data-variable
    desc: Writes a variable decoded from Base64
    crit: notable
    conf: 0.9
    for: [php, text]
    near_lines: 6
    all:
      - id: micro-behaviors/fs/write/file/unspecified::file-put-contents
      - id: micro-behaviors/data/decode/base64/unspecified::php-base64-decode-assignment
  # The decoded-write observation across surfaces and call shapes: decoded
  # bytes passed inline (structured call or source text) or staged through a
  # variable. Consumers reference this instead of choosing one form.
  - id: php-writes-base64-data-any
    desc: PHP writes Base64-decoded content
    crit: notable
    conf: 0.9
    for: [php, text]
    any:
      - id: micro-behaviors/fs/write/file/full/bytes::php-writes-base64-data
      - id: micro-behaviors/fs/write/file/full/bytes::php-writes-base64-data-text
      - id: micro-behaviors/fs/write/file/full/bytes::php-writes-base64-data-variable
