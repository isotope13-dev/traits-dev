defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  # `java.nio.file.Files` is the JVM's, not Java-the-language's: Kotlin, Scala
  # and Groovy call it with the same spelling, and a Kotlin dropper writing its
  # payload through `Files.write` scored nothing here until they were listed.
  - id: java-files-write-source
    desc: Java Files.write usage
    conf: 0.9
    for: [java, kotlin, scala, groovy]
    if:
      type: text
      substr: Files.write
  - id: jvm-files-write-bytecode
    desc: JVM bytecode Files.write call
    conf: 0.9
    for: [class]
    if:
      type: import
      exact: java/nio/file/Files.write
  - id: jvm-files-writestring-bytecode
    desc: JVM bytecode Files.writeString
    conf: 0.9
    for: [class]
    if:
      type: symbol
      exact: java/nio/file/Files.writeString
  - id: kotlin-write-text-source
    desc: Kotlin writes text to a file
    conf: 0.88
    for: [kotlin]
    if:
      type: text
      regex: '\.writeText\s*\('
  - id: kotlin-direct-byte-write-source
    desc: Kotlin direct byte file write
    conf: 0.9
    platforms: [android, unix, windows]
    for: [kotlin]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(writeBytes|Files\.write(String)?)$'
  - id: kotlin-outputstream-write-source
    desc: Kotlin writes bytes to output stream
    conf: 0.9
    for: [kotlin]
    if:
      type: text
      regex: '\b[A-Za-z_]\w*\.write\s*\(\s*[A-Za-z_]\w*\s*\)'
