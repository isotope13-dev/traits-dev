defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.9
traits:
  # Matches both `fs.writeFileSync(` and the common inline-hook spelling
  # `require('fs').writeFileSync(` — the latter has `)` immediately before the
  # member access, so an identifier-only prefix misses proof-of-exec beacons.
  - id: npm-postinstall-write-file-sync
    desc: npm postinstall writes a file synchronously
    if:
      type: value
      path: scripts.postinstall
      regex: '(require\([''"]fs[''"]\)|[A-Za-z_$][A-Za-z0-9_$]{0,32})\.writeFileSync\s*\('
