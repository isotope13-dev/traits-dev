defaults:
  platforms: [windows]
  for: [powershell, text, pe, csharp]
traits:
  - id: dotnet-ps1-file-write
    desc: PS1 file written to disk
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)WriteAll(Text|Bytes)\(\s*["''][^"''\r\n]{1,100}\.ps1["'']'
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
