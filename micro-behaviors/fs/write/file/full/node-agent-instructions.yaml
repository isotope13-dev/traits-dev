defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: node-agent-instruction-path-write
    desc: Agent instruction filename in Node write path
    if:
      type: symbol
      kind: call
      regex: '(^|\.)writeFile(Sync)?$'
      arg:
        index: 0
        from:
          value: '(^|[\\/])(AGENTS|CLAUDE|GEMINI)\.md$'
          through:
            - call: '(^|\.)join$'
              arguments: [0, 1, 2, 3, 4]

