defaults:
  for: [csharp]
traits:
  - id: writeallbytes-call
    platforms: [windows, unix, openwrt]
    desc: File.WriteAllBytes call in C#
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(^|\.)File\.WriteAllBytes$'
  - id: writeallbytes-raw
    platforms: [windows, unix, openwrt]
    desc: File.WriteAllBytes source call
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: File.WriteAllBytes(
  - id: file-write-all-lines
    platforms: [windows, unix]
    desc: C# writes text lines to file
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)File\.WriteAllLines$'
composite_rules:
  - id: writeallbytes-any
    platforms: [windows, unix, openwrt]
    desc: File.WriteAllBytes invocation
    crit: notable
    conf: 0.93
    any:
      - id: micro-behaviors/fs/write/file/full::writeallbytes-call
      - id: micro-behaviors/fs/write/file/full::writeallbytes-raw
