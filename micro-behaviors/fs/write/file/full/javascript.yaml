defaults:
  for: [javascript, typescript]
traits:
  - id: write-file-sync
    platforms: [windows, unix]
    desc: Node fs writes to a file synchronously
    crit: notable
    conf: 0.95
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
    if:
      type: symbol
      kind: call
      regex: '^(fs|fsp|fsPromises|promises)\.writeFileSync$'
  - id: node-write-shell-script
    platforms: [windows, unix]
    desc: Node writes an embedded shell script
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\.writeFileSync\s*\([^;\n]{0,180}#!/bin/(ba)?sh'
    unless:
      - id: metadata/package/testing/
  - id: node-writes-serialized-yaml
    platforms: [windows, unix]
    desc: Node writes serialized YAML data
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'writeFileSync\s*\([^;\n]{0,220}\byaml\.dump\s*\('
  - id: write-file-async
    platforms: [windows, unix]
    desc: Node fs writes to a file asynchronously
    crit: baseline
    conf: 0.8
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/presence/harness/
      # Emscripten and similar WASM runtimes commonly expose a virtual
      # filesystem as `const fs = instance.FS`; its writeFile method is not a
      # host Node.js filesystem write.
      - type: text
        regex: '\b(const|let|var)\s+fs\s*=\s*[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)*\.FS\b'
    # The receiver tolerates a bundler alias. esbuild rewrites `import fs` to
    # `import_fs5.default`, webpack to `_fs__WEBPACK_IMPORTED_MODULE_0__`,
    # rollup to `fs$1` -- all of them keep the module name in the identifier,
    # and none of them matched a pattern anchored on a bare `fs.`. Every
    # published npm package is bundled, so that anchor made this atom blind to
    # the shipped form of the code while matching only the source form. The
    # peacenotwar payload inside node-ipc 11.0.0 writes through
    # `import_fs5.default.writeFile` and scored nothing here.
    if:
      type: text
      regex: '\b[\w$]{0,24}fs[\w$]{0,8}(\.default)?\.writeFile\s*\(\s*[^)\s]'
  - id: node-write-file-sync
    platforms: [unix, windows]
    desc: Node synchronously writes a file
    crit: notable
    if:
      type: symbol
      kind: member
      regex: '(^|\.)writeFileSync$'
  - id: node-write-file-sync-call
    platforms: [unix, windows]
    desc: Node calls imported writeFileSync
    crit: notable
    if:
      type: symbol
      kind: call
      # The extractor preserves the receiver for member calls (for example
      # `_store.writeFileSync`) but emits the bare name for destructured
      # imports.  Both forms are the same file-write API capability.
      regex: '(^|\.)writeFileSync$'
  - id: node-write-data-variable-sync
    platforms: [unix, windows]
    desc: Node synchronously writes a common data variable
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bwriteFileSync\s*\([^,\n]{1,200},\s*(body|data|buffer|content)\b'
  # Any receiver, not just a namespace literally spelled `fs`: bundlers rename
  # the namespace (`fs2`, `fs$1`) and obfuscator.io dispatches it through an
  # opaque local, so anchoring on `fs` missed most shipped code. Requiring the
  # call parens keeps type declarations and property tables out.
  #
  # `type: encoded` is required for the obfuscator.io spelling that hex-escapes
  # the property name (`obj['\x77\x72\x69\x74\x65\x46\x69\x6c\x65'](...)`);
  # raw text never contains the clear `writeFile` token.
  - id: js-bracket-file-write
    platforms: [unix, windows]
    desc: Node bracket-named file write call
    crit: notable
    conf: 0.86
    if:
      type: encoded
      regex: "[A-Za-z_$][\\w$]{0,24}\\[['\"]writeFile(Sync)?['\"]\\]\\s*\\("
  - id: node-prepends-import-to-source
    platforms: [unix, windows]
    desc: Node prepends an import to source
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)writeFileSync\s*\(\s*\w*(file|entry)\w*\s*,\s*\w*import\w*\s*\+'
  # `writeFileSync(p, readFileSync(p, 'utf8').replace(...))`: a file is edited
  # in place through a regex replace. Codemods and scaffolders do this to
  # project files; composites decide whether the target is one of those or an
  # installed module.
  - id: node-read-replace-write-in-place
    platforms: [unix, windows]
    desc: Edits a file in place with replace()
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'writeFileSync\s*\([^)]{0,40},\s*readFileSync\s*\([^)]{0,40}\)\s*\.replace\s*\('
  - id: js-fs-write-sync
    platforms: [unix, windows]
    desc: Writes file via Node.js fs
    crit: baseline
    if:
      type: text
      regex: 'fs\.write(File)?Sync\s*\('
  - id: node-write-file-promise
    platforms: [unix, windows]
    desc: Node asynchronously writes a file
    crit: notable
    conf: 0.9
    unless:
      # Emscripten and similar WASM runtimes commonly expose a virtual
      # filesystem as `const fs = instance.FS`; its writeFile method is not a
      # host Node.js filesystem write.
      - id: metadata/build/bundler/runtime::js-emscripten-fs-binding
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(fs[\w$]{0,3})\.writeFile$'
  - id: node-fs-promises-write-file
    platforms: [unix, windows]
    desc: Node fs.promises asynchronously writes a file
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: fs.promises.writeFile
  # `import { writeFile } from 'node:fs/promises'` leaves a bare call target,
  # so the receiver-anchored matcher above never sees the modern spelling —
  # a package that stages a downloaded file this way showed no write at all.
  # Pair the module import with the bare call rather than loosening the call:
  # an unqualified `writeFile(...)` alone is any project's own helper.
  - id: node-fs-promises-import
    platforms: [unix, windows]
    desc: Imports the Node fs/promises API
    crit: baseline
    conf: 0.95
    if:
      type: import
      regex: '^(node:)?fs/promises$'
  - id: write-file-call-target
    platforms: [unix, windows]
    desc: Calls an unqualified writeFile function
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: 'writeFile'
composite_rules:
  - id: js-file-write
    platforms: [windows, unix]
    desc: JavaScript file write operation
    crit: notable
    conf: 0.9
    unless:
      # TypeScript declaration files contain API documentation examples, not
      # executable Node.js file-write operations.
      - id: metadata/lang/scripted::dts-declaration-file
    any:
      - id: micro-behaviors/fs/write/file/full::write-file-sync
      - id: micro-behaviors/fs/write/file/append::append-file-sync
      - id: micro-behaviors/fs/write/file/full::write-file-async
      - id: micro-behaviors/fs/write/runtime::bun-write-file
      - id: micro-behaviors/fs/write/file/append::append-file-async
      - id: micro-behaviors/fs/write/file/stream::create-write-stream
      - id: micro-behaviors/fs/write/file/stream::adodb-stream-write
      - id: micro-behaviors/fs/write/file/handle::document-save-call
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
  - id: node-write-file-promise-destructured
    platforms: [unix, windows]
    desc: Node writes a file via destructured import
    crit: notable
    conf: 0.9
    all:
      - id: node-fs-promises-import
      - id: write-file-call-target
