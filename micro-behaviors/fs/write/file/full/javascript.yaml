defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: node-writefile-aliased-import
  desc: Imports aliased Node fs writeFile API
  conf: 0.94
  if:
    type: text
    regex: writeFile\s+as\s+\w+[\s\S]{0,80}from["'](node:)?fs/promises["']
- id: write-file-sync
  desc: Node fs writes to a file synchronously
  conf: 0.95
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/manifest::test-fixtures
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  if:
    type: symbol
    kind: call
    regex: ^(fs|fsp|fsPromises|promises)\.writeFileSync$
- id: writefilesync-name-literal
  desc: writeFileSync named by a string constant
  conf: 0.8
  if:
    type: literal
    kind: string
    exact: writeFileSync
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/package/testing/
  - id: metadata/build
  - id: metadata/path::test-directory-component
- id: node-write-shell-script
  desc: Writes embedded shell-script text
  conf: 0.96
  if:
    type: text
    regex: \.writeFileSync\s*\([^;\n]{0,180}#!/bin/(ba)?sh
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
- id: node-writes-serialized-yaml
  desc: Node writes serialized YAML data
  conf: 0.92
  if:
    type: text
    regex: writeFileSync\s*\([^;\n]{0,220}\byaml\.dump\s*\(
- id: write-file-async
  desc: Node fs writes to a file asynchronously
  conf: 0.8
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/manifest::test-fixtures
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/package/testing/presence/harness/
  - type: text
    regex: \b(const|let|var)\s+fs\s*=\s*[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)*\.FS\b
  - id: metadata/path::test-directory-component
  if:
    type: text
    regex: \b[\w$]{0,24}fs[\w$]{0,8}(\.default)?\.writeFile\s*\(\s*[^)\s]
- id: node-write-file-sync
  desc: References a writeFileSync member
  if:
    type: symbol
    kind: member
    regex: (^|\.)writeFileSync$
- id: node-write-file-sync-call
  desc: Calls the writeFileSync API
  if:
    type: symbol
    kind: call
    regex: (^|\.)writeFileSync$
- id: node-write-file-sync-statement
  desc: Synchronous file write via writeFileSync
  conf: 0.92
  for:
  - pe
  - elf
  if:
    type: raw
    regex: (?i)(fs\.)?writeFileSync\s*\(
- id: node-write-sync-buffer
  desc: Node writes bytes to file descriptor
  conf: 0.95
  if:
    type: symbol
    kind: call
    exact: fs.writeSync
- id: node-project-file-atomic-write
  desc: Node atomically writes a project file
  conf: 0.94
  if:
    type: symbol
    kind: call
    exact: writeProjectFileAtomically
- id: node-write-data-variable-sync
  desc: Writes a data variable to a file
  conf: 0.96
  if:
    type: text
    regex: \bwriteFileSync\s*\([^,\n]{1,200},\s*(body|data|buffer|content)\b
- id: json-stringify-write-sync
  desc: Writes JSON-serialized data with writeFileSync
  conf: 0.9
  if:
    type: text
    regex: writeFileSync.{0,500}JSON\.stringify
- id: js-bracket-file-write
  desc: Node bracket-named file write call
  conf: 0.86
  if:
    type: encoded
    regex: '[A-Za-z_$][\w$]{0,24}\[[''"]writeFile(Sync)?[''"]\]\s*\('
- id: node-prepends-import-to-source
  desc: Node prepends an import to source
  conf: 0.94
  if:
    type: text
    regex: (?i)writeFileSync\s*\(\s*\w*(file|entry)\w*\s*,\s*\w*import\w*\s*\+
- id: node-read-replace-write-in-place
  desc: Edits a file in place with replace()
  conf: 0.9
  if:
    type: text
    regex: writeFileSync\s*\([^)]{0,40},\s*readFileSync\s*\([^)]{0,40}\)\s*\.replace\s*\(
  not:
  - regex: writeFileSync\s*\(\s*(in|out|dest)File\b
- id: js-fs-write-sync
  desc: Writes file via Node.js fs
  if:
    type: symbol
    kind: call
    regex: ^fs\.write(File)?Sync$
  unless:
  - id: metadata/file/format/structured::serialized-news-article-catalog
- id: node-write-file-promise
  desc: Node asynchronously writes a file
  conf: 0.9
  unless:
  - id: metadata/build/bundler/runtime::js-emscripten-fs-binding
  if:
    type: symbol
    kind: call
    regex: (^|\.)(fs[\w$]{0,3})\.writeFile$
- id: node-fs-promises-write-file
  desc: Node fs.promises asynchronously writes a file
  conf: 0.92
  if:
    type: symbol
    kind: call
    exact: fs.promises.writeFile
- id: write-file-call-target
  desc: Calls an unqualified writeFile function
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: writeFile
- id: dotnet-writeallbytes-in-script
  desc: JavaScript embeds a .NET binary file write
  conf: 0.94
  if:
    type: text
    regex: (?i)\[IO\.File\]::\s*WriteAllBytes\s*\(
composite_rules:
- id: js-file-write
  desc: JavaScript file write operation
  conf: 0.9
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  any:
  - id: micro-behaviors/fs/write/file/full::write-file-sync
  - id: micro-behaviors/fs/write/file/append::append-file-sync
  - id: micro-behaviors/fs/write/file/full::write-file-async
  - id: micro-behaviors/fs/write/runtime::bun-write-file
  - id: micro-behaviors/fs/write/file/append::append-file-async
  - id: micro-behaviors/fs/write/file/stream::create-write-stream
  - id: micro-behaviors/fs/write/file/stream::adodb-stream-write
  - id: micro-behaviors/fs/write/file/handle::document-save-call
  - id: micro-behaviors/fs/write/stream::adodb-save-to-file
- id: node-write-file-promise-destructured
  desc: Node writes a file via destructured import
  conf: 0.9
  all:
  - id: metadata/import/npm/fs/promises
  - id: write-file-call-target
- id: synchronous-file-write-call-or-embedded-text
  desc: writeFileSync call or embedded call text
  conf: 0.92
  for:
  - javascript
  - typescript
  - pe
  - elf
  any:
  - id: node-write-file-sync-call
  - id: node-write-file-sync-statement
