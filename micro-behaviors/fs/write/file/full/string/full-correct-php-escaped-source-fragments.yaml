defaults:
  platforms: [unix, windows]
  for: [php]
  attack: T1505.003
  mbc: B0030
traits:
  - id: php-escaped-request-superglobal-in-source
    desc: PHP string embeds escaped request superglobal
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\\\$_(GET|POST|REQUEST)\['

  - id: php-escaped-eval-in-source
    desc: PHP string embeds eval of a variable
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'eval\(\s*\\\$\w{1,20}'
