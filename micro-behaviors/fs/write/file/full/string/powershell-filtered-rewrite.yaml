defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.88

traits:
  - id: powershell-filtered-content-rewrite
    desc: PowerShell filters and sets content
    conf: 0.95
    if:
      type: text
      regex: '(?is)Get-Content.{0,240}Where-Object.{0,160}-notmatch.{0,200}Set-Content'
