defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
  crit: notable
traits:
  - id: node-write-shell-script
    desc: Writes embedded shell-script text
    conf: 0.96
    if:
      type: text
      regex: \.writeFileSync\s*\([^;\n]{0,180}#!/bin/(ba)?sh
    unless:
      - id: metadata/package/testing/
      - id: metadata/path/directory::test-directory-component
