defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable

traits:
  - id: node-write-php-request-command
    desc: Writes GET/POST PHP command source
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(writeFile|writeFileSync)$'
      arg:
        index: 1
        from:
          value: '<\?php[\s\S]{0,320}\b(system|exec|passthru)\s*\(\s*\$_(GET|POST)\s*\['

  - id: node-write-php-request-command-request
    desc: Writes REQUEST-driven PHP command source
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(writeFile|writeFileSync)$'
      arg:
        index: 1
        from:
          value: '<\?php[\s\S]{0,320}\b(system|exec|passthru)\s*\(\s*\$_REQUEST\s*\['
