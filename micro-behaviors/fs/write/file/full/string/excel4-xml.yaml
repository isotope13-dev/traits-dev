# Excel 4.0 (XLM) file I/O: FOPEN returns a handle, FWRITE/FWRITELN emit text
# through it. Matched inside formula (<f>) elements of a macrosheet part.
defaults:
  for: [xml]
  platforms: [windows]
  crit: notable
  conf: 0.95

traits:
  - id: excel4-fopen-formula
    desc: XLM formula opens a file handle
    if:
      type: text
      regex: '<f\b[^<>]{0,60}>[^<]{0,600}\bFOPEN\('
  - id: excel4-fwrite-formula
    desc: XLM formula writes text to a file
    if:
      type: text
      regex: '<f\b[^<>]{0,60}>[^<]{0,80}\bFWRITE(LN)?\('

composite_rules:
  - id: excel4-fopen-fwriteln-text-file
    desc: XLM opens a file and writes lines
    all:
      - id: excel4-fopen-formula
      - id: excel4-fwrite-formula
    near_bytes: 4000
