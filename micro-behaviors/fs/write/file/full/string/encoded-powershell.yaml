defaults:
  platforms: [windows]
  for: [powershell]
traits:
  # Decoded text is available, but is not projected into source call facts.
  - id: encoded-powershell-variable-content-write
    desc: Encoded Set-Content writes variable data
    crit: notable
    conf: 0.95
    if:
      type: encoded
      regex: '(?i)\bSet-Content\s+(-Path\s+)?\$\w+\s+(-Value\s+)?\$\w+\b'
