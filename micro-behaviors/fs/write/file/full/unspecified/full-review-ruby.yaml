defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-file-write-call
    desc: Writes a file with Ruby File.write
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((call receiver: (constant) @receiver method: (identifier) @method) @call
          (#eq? @receiver "File")
          (#eq? @method "write"))
