defaults:
  crit: notable
  platforms: [windows, unix]
  for: [go]
composite_rules:
  - id: go-missing-path-write-pair
    desc: Go missing-path and write call clues
    conf: 0.88
    all:
      - id: micro-behaviors/fs/file/stat::go-os-stat-missing-check
      - id: micro-behaviors/fs/write/file/full/unspecified::go-os-writefile
    near_bytes: 1024
