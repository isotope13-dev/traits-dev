defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
  - id: php-missing-file-write
    desc: PHP missing-path test and matching write
    conf: 0.9
    if:
      # Tree shape keeps the write in the missing-file branch, including
      # after nested reconstruction loops. Equal argument syntax prevents
      # an unrelated existence check from lending context to the write;
      # this is not an interprocedural or variable-mutation flow proof.
      type: tree-sitter
      query: |
        ((if_statement
          condition: (parenthesized_expression
            (_ (function_call_expression
              function: (name) @exists
              arguments: (arguments . (argument) @checked .))) @negated)
          body: (compound_statement
            (expression_statement (function_call_expression
              function: (name) @write
              arguments: (arguments . (argument) @written))))) @branch
          (#match? @exists "(?i)^file_exists$")
          (#match? @negated "(?i)^!\\s*file_exists\\s*\\(")
          (#match? @write "(?i)^file_put_contents$")
          (#eq? @checked @written))
