traits:
- platforms:
  - windows
  for:
  - batch
  - powershell
  id: decoded-powershell-base64-batch-write
  desc: Decoded PowerShell Base64 batch write text
  crit: suspicious
  conf: 0.96
  if:
    type: encoded
    regex: \[IO\.File\]::WriteAllBytes\(\$batch,\s*\[Convert\]::FromBase64String\(\$payload\)\)
