defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-file-binwrite-call
    desc: Writes binary data with Ruby File.binwrite
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: File.binwrite
composite_rules:
  - id: ruby-file-output-call
    desc: Writes a file with Ruby File.write/binwrite
    crit: notable
    conf: 0.99
    any:
      - id: ruby-file-write-call
      - id: ruby-file-binwrite-call
