# OpenOffice/LibreOffice Basic saving a document model in place:
# `ThisComponent.store()` or a variable holding ThisComponent.
defaults:
  for: [xml]
  platforms: [windows, unix]
  conf: 0.9

traits:
  - id: starbasic-thiscomponent-store
    desc: Basic saves ThisComponent in place
    crit: notable
    if:
      type: text
      regex: '\bThisComponent\.store\s*\(\s*\)'
  - id: starbasic-thiscomponent-assignment
    desc: Basic assigns ThisComponent to a variable
    crit: component
    if:
      type: text
      regex: '\w\s*=\s*ThisComponent\b'
  - id: starbasic-store-call
    desc: Basic calls store() on a document object
    crit: component
    if:
      type: text
      regex: '\b\w+\.store\s*\(\s*\)'

composite_rules:
  - id: starbasic-thiscomponent-variable-store
    desc: Basic saves the ThisComponent document
    crit: notable
    all:
      - id: starbasic-thiscomponent-assignment
      - id: starbasic-store-call
    near_bytes: 3000
  - id: starbasic-current-document-store
    desc: Basic saves the current document in place
    crit: notable
    any:
      - id: starbasic-thiscomponent-store
      - id: starbasic-thiscomponent-variable-store
