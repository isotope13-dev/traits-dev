defaults:
  for: [go]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: go-writes-download-shell-pipeline
    desc: Go writes a download-to-shell pipeline
    if:
      type: symbol
      kind: call
      exact: os.WriteFile
      arg:
        index: 1
        from:
          value: '(curl|wget)\s+.{0,160}\|\s*(bash|zsh|sh)\b'
          through:
            - call: '^fmt\.Sprintf$'
              arguments: [0, 1, 2, 3, 4]
