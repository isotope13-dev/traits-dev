# `bread <file> <off> <len> &bin` stages local file bytes and
# `sockwrite <sock> &bin` pushes the staging variable to the peer: a raw
# socket file upload with no DCC handshake, the backdoor's quiet exfil path.
defaults:
  platforms: [unix, windows]
  for: [mirc]
traits:
  # `.filter -wf <query> <outfile> *` copies the query window's lines into a
  # staging file: the harvest half of chat-log theft.
- id: mirc-filter-query-to-file
  desc: mIRC filters query lines into file
  crit: notable
  conf: 0.9
  for: [mirc, text, data]
  if:
    type: text
    regex: '(?i)\.filter\s+-wf\s+\S+\s+\S+\s+\*'
  # `.timersend <n> 3 /sending`: a timer drips the staged lines to the owner
  # a few seconds apart, staying under flood limits.
