defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: dotnet-download-decode-gzip-write-references
    desc: Co-occurring .NET download, Base64, gzip and file-write APIs
    crit: notable
    conf: 0.9
    near_bytes: 16384
    all:
      - id: micro-behaviors/communications/http/client/managed::downloadstring
      - id: micro-behaviors/data/decode/base64::dotnet-frombase64string-text
      - id: "micro-behaviors/data/codec::gzipstream-dotnet"
      - id: micro-behaviors/fs/write/file/full::dotnet-writeallbytes-token
