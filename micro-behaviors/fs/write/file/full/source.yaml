defaults:
  platforms: [linux, macos, windows]
  for: [zig, csharp, java, kotlin, elixir, ruby, swift]
  crit: notable
  conf: 0.88

traits:
  - id: source-buffer-write-call
    desc: Source writes a file buffer
    if:
      type: symbol
      kind: call
      regex: '(^|[.])(Write|write|writeAll|binwrite)$'

  - id: repeated-buffer-write-token
    desc: Source uses a buffer write call
    if:
      type: text
      regex: '(?i)\b(binwrite|write_all|fwrite)\s*[(]'
