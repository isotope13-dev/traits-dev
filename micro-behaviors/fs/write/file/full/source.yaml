defaults:
  platforms: [linux, macos, windows]
  for: [zig, csharp, elixir, ruby, swift]
  crit: notable
  conf: 0.88

traits:
  - id: source-buffer-write-call
    desc: Source writes a file buffer
    if:
      type: symbol
      kind: call
      regex: '(^|[.])(Write|write|writeAll|binwrite)$'

  - id: perl-filehandle-print
    desc: Perl writes data to a filehandle
    for: [perl]
    if:
      type: text
      regex: '\bprint\s+\$[A-Za-z_]\w*\s+\$[A-Za-z_]\w*'

  - id: native-looped-write-call
    desc: Native loop contains a write call
    for: [c, cpp, objc]
    if:
      type: text
      regex: 'for\s*\([^)]{0,40}\)[\s\S]{0,40}write\s*\('
    unless:
      # Mercury/GPGME foreign C uses write loops for crypto buffers.
      - id: metadata/lang/compiler/systems::mercury-source

  # A generic Java write() may target HTTP, sockets, or collections. Require
  # the receiving variable to have an explicit file-stream declaration.
  - id: java-file-outputstream-write
    desc: Writes through a declared Java file stream
    for: [java]
    platforms: [unix, windows, android]
    conf: 0.96
    if:
      type: tree-sitter
      language: java
      query: |
        (block
          (local_variable_declaration
            type: (type_identifier) @type
            declarator: (variable_declarator name: (identifier) @file))
          (expression_statement (method_invocation
            object: (identifier) @receiver name: (identifier) @write))
          (#eq? @type "FileOutputStream")
          (#eq? @file @receiver)
          (#eq? @write "write"))
