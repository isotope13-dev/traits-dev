# Path proximity is a capability observation, not proof of a backdoor or
# proof that the write destination is PHP. Cache plugins use this surface too.
defaults:
  platforms: [unix, windows]
  for: [php]

composite_rules:
  - id: php-write-near-wp-mu-plugin-path
    desc: PHP file write near a WordPress MU-plugin path
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/fs/path/application/webapp::wp-mu-plugin-path
      - id: micro-behaviors/fs/write/file/full::php-file-put-contents
    near_bytes: 640
    unless:
      - id: metadata/package/tooling::rudel-source-tree
