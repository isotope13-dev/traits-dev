defaults:
  platforms: [windows]
  for: [pe]
  crit: notable
traits:
  - id: go-write-file-call
    desc: Go binary calls os.WriteFile
    if:
      type: symbol
      kind: call
      exact: sym.go.os.WriteFile
  - id: go-write-file-pclntab
    desc: Go binary references os.WriteFile symbol
    if:
      type: symbol
      exact: os.WriteFile

composite_rules:
  - id: go-write-file-reference
    desc: Go binary calls or references os.WriteFile
    any:
      - id: go-write-file-call
      - id: go-write-file-pclntab
