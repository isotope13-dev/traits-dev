defaults:
  for: [php]
  platforms: [windows, unix]
traits:
  - id: php-writes-request-eval-source
    desc: Writes PHP source that evaluates request input
    crit: notable
    conf: 0.98
    attack: T1505.003
    if:
      type: symbol
      kind: call
      exact: file_put_contents
      arg:
        index: 1
        kind: string
        regex: '<\?php\s+eval\s*\(\s*\$_(POST|GET|REQUEST)\s*\['
  - id: php-tagless-request-eval-source-write
    desc: Tagless fragment writes request-eval PHP source
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '^\s*file_put_contents\([^,]{1,100},\s*[''"]<\?php\s+eval\(\$_(POST|GET|REQUEST)'

composite_rules:
  - id: php-request-eval-source-write
    desc: Writes PHP source containing request evaluation
    crit: notable
    conf: 0.97
    any:
      - id: php-writes-request-eval-source
      - id: php-tagless-request-eval-source-write
