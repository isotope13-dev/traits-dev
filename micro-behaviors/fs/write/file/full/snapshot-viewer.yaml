defaults:
  for: [html, javascript]
  platforms: [windows]
traits:
  - id: snapshot-download-write-sequence
    desc: Sets Snapshot paths and invokes PrintSnapshot
    crit: notable
    conf: 0.98
    if:
      type: text
      exclude_html_comments: true
      regex: '\.SnapshotPath=.{1,80};.{1,40}\.CompressedPath=.{1,80};.{1,40}\.PrintSnapshot\('
