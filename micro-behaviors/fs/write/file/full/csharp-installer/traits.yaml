defaults:
  for: [csharp]
  platforms: [windows]

traits:
  - id: write-install-state
    desc: Writes install mode state file
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: File.WriteAllText(Constants.installedDir

composite_rules:
  - id: userland-installer-state-write
    desc: Per-user installer writes state file
    crit: suspicious
    conf: 0.97
    all:
      - id: micro-behaviors/os/package-manager/config::per-user-install-scope
      - id: micro-behaviors/fs/directory/create::create-install-dir
      - id: write-install-state
