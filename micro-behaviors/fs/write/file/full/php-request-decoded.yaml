defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.98

traits:
  # A decoded upload is a capability. Require the bytes as the write's data
  # argument; a nearby decode and an unrelated write do not prove this flow.
  - id: php-writes-base64-request-data
    desc: Writes Base64-decoded PHP request data
    if:
      type: tree-sitter
      query: |
        ((function_call_expression
          function: (name) @write
          arguments: (arguments
            (argument)
            (argument (function_call_expression
              function: (name) @decode
              arguments: (arguments
                (argument (subscript_expression
                  (variable_name) @request))))))) @call
          (#match? @write "(?i)^file_put_contents$")
          (#match? @decode "(?i)^base64_decode$")
          (#match? @request "^\\$_(GET|POST|REQUEST)$"))
