defaults:
  crit: notable
  platforms: [windows, unix]
  for: [go]
traits:
  - id: os-write-file
    desc: Write file via os.WriteFile
    conf: 0.8
    if:
      type: symbol
      exact: os.WriteFile
  - id: ioutil-write-file
    desc: Write file via ioutil.WriteFile
    conf: 0.8
    if:
      type: symbol
      exact: ioutil.WriteFile
  - id: go-write-file-method-call
    desc: Go WriteFile method call
    conf: 0.6
    if:
      type: text
      substr: .WriteFile(
composite_rules:
  - id: go-missing-path-write-pair
    desc: Go checks a missing path near a file write
    conf: 0.88
    all:
      - id: micro-behaviors/fs/file/stat::go-os-stat-missing-check
      - id: micro-behaviors/fs/write/file/full::go-os-writefile
    near_bytes: 1024
