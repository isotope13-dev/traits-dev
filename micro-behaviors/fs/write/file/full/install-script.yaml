defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

composite_rules:
  # This records co-occurrence only: CWD may be used for a lookup while the
  # writer targets the package itself. A basename also proves no lifecycle run.
  - id: postinstall-named-script-cwd-write-cooccurrence
    desc: Postinstall-named script references CWD and writes files
    conf: 0.9
    scope: file
    all:
      - id: metadata/package/files/lifecycle::postinstall-js-file
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
    any:
      - id: micro-behaviors/fs/path/construct::invocation-root-path-join
      - id: micro-behaviors/fs/path/self::cwd-reference
      - id: micro-behaviors/os/env/read::npm-init-cwd-read
