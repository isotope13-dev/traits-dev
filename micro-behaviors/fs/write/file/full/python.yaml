defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-pathlib-write-bytes
    crit: notable
    mbc: C0016
    desc: Writes bytes with pathlib.Path.write_bytes()
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(write_bytes)$'
  - id: python-pathlib-write-text
    crit: baseline
    mbc: C0016
    desc: Write text via pathlib
    conf: 0.85
    if:
      type: symbol
      substr: write_text
  - id: py-pathlib-write-call
    desc: pathlib write_text/write_bytes call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^Path\(\)\.write_(bytes|text)$'
  - id: python-path-open-write-binary
    desc: Python pathlib opens binary output
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '\.open$'
      arg:
        kind: string
        exact: wb
  - id: python-filtered-text-rewrite
    desc: Python filters and rewrites text file
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?s)\.read_text\(\).{0,360}\bif\b.{0,120}\bnot\s+in\b.{0,360}\.write_text\('
  # Code generators and stagers sometimes read an object's text property into
  # a local, then serialize that local as a Python source assignment. Keep this
  # atom neutral; consumers supply the object's meaning and execution context.
  - id: python-pathlib-write-repr-assignment
    desc: Writes object text into Python source
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?s)\.text.{0,500}\.py["''].{0,160}\.write_text\(\s*f["'']\w+\s*=\s*\{repr\('
  # The .py path sits just before write_text. A comment that merely mentions
  # both is not this shape.
  - id: python-source-write-text
    desc: Writes text to a .py file path
    crit: notable
    platforms: [unix, windows]
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\.py["''][\s\S]{0,160}write_text\('

composite_rules:
  - id: py-pathlib-write-executable-path
    desc: pathlib writes executable/script path
    crit: notable
    conf: 0.86
    all:
      - id: micro-behaviors/fs/write/file/full::py-pathlib-write-call
      - id: micro-behaviors/fs/write/file/target::py-pathlib-executable-path
