defaults:
  for: [python]
traits:
  - id: python-pathlib-write-bytes
    platforms: [windows, unix]
    crit: notable
    mbc: C0016
    desc: Writes bytes with pathlib.Path.write_bytes()
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(write_bytes)$'
  - id: python-pathlib-write-text
    platforms: [windows, unix]
    crit: baseline
    mbc: C0016
    desc: Write text via pathlib
    conf: 0.85
    if:
      type: symbol
      substr: write_text
  - id: py-pathlib-write-call
    platforms: [windows, unix]
    desc: pathlib write_text/write_bytes call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^Path\(\)\.write_(bytes|text)$'
  - id: python-path-open-write-binary
    platforms: [unix, windows]
    desc: Python pathlib opens binary output
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '\.open$'
      arg:
        kind: string
        exact: wb
composite_rules:
  - id: py-pathlib-write-executable-path
    platforms: [windows, unix]
    desc: pathlib writes executable/script path
    crit: notable
    conf: 0.86
    all:
      - id: micro-behaviors/fs/write/file/full::py-pathlib-write-call
      - id: micro-behaviors/fs/write/file/target::py-pathlib-executable-path
