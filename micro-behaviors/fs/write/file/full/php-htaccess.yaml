traits:
- platforms:
  - windows
  - unix
  for:
  - php
  - text
  id: php-htaccess-write
  desc: PHP writes an Apache .htaccess path
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: file_put_contents
    arg:
      index: 0
      from:
        value: '(^|[/\\])\.htaccess$'
