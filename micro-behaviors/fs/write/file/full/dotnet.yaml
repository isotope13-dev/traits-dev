defaults:
  crit: notable
  platforms: [windows, unix, openwrt]
  for: [pe, dll, csharp, asp]
traits:
  # Sync and async forms: modern .NET stagers call WriteAllBytesAsync and
  # never emit the sync WriteAllBytes token (exact misses the Async suffix).
  - id: dotnet-writeallbytes-token
    desc: .NET File.WriteAllBytes token
    conf: 0.86
    if:
      type: text
      regex: 'WriteAllBytes(Async)?'
    unless:
      - id: metadata/lang/compiler/managed::delphi
  - id: dotnet-writealltext-token
    desc: .NET File.WriteAllText token
    conf: 0.84
    if:
      type: text
      regex: 'WriteAllText|File\.WriteAllText'
    unless:
      - id: metadata/lang/compiler/managed::delphi

composite_rules:
  # One WriteAllBytes observation, whichever form proves it: the C# call
  # projection or the compiled-assembly token. Consumers that count roles
  # reference this group once so both forms of one call never satisfy a
  # two-role threshold together.
  - id: dotnet-writeallbytes-any-form
    desc: File.WriteAllBytes call or assembly token
    conf: 0.9
    any:
      - id: dotnet-writeallbytes-token
      - id: micro-behaviors/fs/write/file/full::writeallbytes-any
