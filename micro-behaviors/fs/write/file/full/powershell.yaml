# File Writing in PowerShell
defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.88

traits:
  - id: powershell-stream-buffer-write
    desc: PowerShell writes a stream buffer
    conf: 0.92
    if:
      type: text
      regex: '\$[A-Za-z_]\w*\.Write\s*\(\s*\$[A-Za-z_]\w*\s*,\s*0\s*,\s*\$[A-Za-z_]\w*\.Length\s*\)'
  - id: write-all-text
    for: [powershell, batch]
    conf: 0.9
    desc: Writes text data
    if:
      type: text
      regex: '(?i)\[(System\.)?IO\.File\]::\s*WriteAllText'
  - id: variable-static-write-all-text
    for: [powershell, batch]
    conf: 0.9
    desc: Variable static WriteAllText call
    if:
      type: text
      regex: '\$[A-Za-z_]\w*::\s*WriteAllText\s*\('
  - id: write-all-bytes
    for: [powershell, batch]
    conf: 0.9
    desc: Writes binary data
    if:
      type: text
      regex: '(?i)\[System\.IO\.File\]::\s*WriteAllBytes'
  - id: out-file
    conf: 0.9
    desc: Calls PowerShell Out-File
    if:
      type: symbol
      kind: call
      exact: Out-File
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
  - id: powershell-set-content-call
    mbc: C0047
    desc: PowerShell writes file with Set-Content
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: Set-Content
composite_rules:
  # Typed-variable form: $f='System.IO.File'-as[type]; $f::WriteAllText(...)
  - id: write-all-text-via-type
    desc: WriteAllText via typed File reference
    conf: 0.94
    near_bytes: 240
    all:
      - id: micro-behaviors/data/source/syntax/typecast::powershell-system-io-file-type-cast
      - id: variable-static-write-all-text
  - id: powershell-profile-write
    conf: 0.9
    desc: Writes PowerShell profile content
    near_bytes: 300
    all:
      - id: micro-behaviors/fs/path/config/shell::powershell-profile-reference
    any:
      - id: micro-behaviors/fs/write/file/full::out-file
      - id: micro-behaviors/fs/write/file/append::add-content
      - id: micro-behaviors/fs/write/file/full::powershell-set-content-call
