defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
  - id: php-writes-base64-data
    desc: PHP writes Base64-decoded file content
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: file_put_contents
      arg:
        index: 1
        from:
          call: '^base64_decode$'
