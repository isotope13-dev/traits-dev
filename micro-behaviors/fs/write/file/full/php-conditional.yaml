defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
  - id: php-missing-file-write
    desc: PHP missing-file check followed by write
    conf: 0.9
    if:
      type: text
      regex: 'if\s*\(\s*!\s*file_exists\s*\([^)]{1,160}\)\s*\)\s*\{[^}]{0,700}\bfile_put_contents\s*\('
