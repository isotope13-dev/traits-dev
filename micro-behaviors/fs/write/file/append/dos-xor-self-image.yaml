# Both calls must reach the same position-relative XOR routine; the output range contains the write and decoder. An arbitrary XOR loop near a write is insufficient.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-xor-wrapped-self-image-write
    desc: XOR-encodes own DOS image around file write
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_xor_wrapped_self_image_write {
          strings:
            $wrap = { E8 ?? ?? B4 40 8D 96 ?? ?? B9 ?? ?? CD 21 E8 ?? ?? }
            $decode = { E8 00 00 5F 81 EF ?? ?? B9 ?? ?? 8A 95 ?? ?? 30 95 ?? ?? 47 E2 F9 C3 }
          condition:
            for any w in (1..#wrap) : (
              for any d in (1..#decode) : (
                ((@wrap[w]+3+uint16(@wrap[w]+1)) % 65536) == @decode[d] and
                ((@wrap[w]+17+uint16(@wrap[w]+15)) % 65536) == @decode[d] and
                @decode[d]+3 >= uint16(@decode[d]+6) and
                @decode[d]+3-uint16(@decode[d]+6)+uint16(@wrap[w]+7) <= @wrap[w] and
                @decode[d]+3-uint16(@decode[d]+6)+uint16(@wrap[w]+7)+uint16(@wrap[w]+10) > @decode[d]+!decode[d] and
                @decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+17)+uint16(@decode[d]+9) <= filesize and
                @decode[d]+3-uint16(@decode[d]+6)+uint16(@decode[d]+13) < filesize and
                uint16(@decode[d]+13) >= uint16(@decode[d]+17)+uint16(@decode[d]+9)
              )
            )
        }
