defaults:
  platforms: [unix, windows]
  crit: notable
  for: [javascript, typescript]
traits:
  # appendFile is not the only way Node code appends data. Source patchers can
  # concatenate an original-content variable with a payload and overwrite the
  # path. Keep this atomic and neutral; a composite supplies the preceding read
  # and decides whether the target is an installed dependency.
  - id: write-file-sync-concatenated-values
    desc: Writes concatenated values to a file
    conf: 0.92
    if:
      type: text
      regex: '\bwriteFileSync\s*\([^,\n]{1,120},\s*[A-Za-z_$][\w$]*\s*\+\s*[A-Za-z_$][\w$]*\s*\)'

  - id: node-append-file-sync
    desc: Node synchronously appends to a file
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: appendFileSync
  - id: append-file-sync
    desc: Node fs appends to a file synchronously
    conf: 0.95
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
    if:
      type: symbol
      kind: call
      regex: '^(fs|fsp|fsPromises|promises)\.appendFileSync$'
  - id: append-file-async
    desc: Appends to file asynchronously
    conf: 0.8
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/presence/harness/
    # A symbol rather than source text, and `(^|\.)` rather than a required
    # `fs.` qualifier: a named ESM import calls it bare --
    # `import { appendFile } from 'fs/promises'` then `await appendFile(p, s)`
    # -- while the dotted `fs.appendFile(...)` arrives as a qualified symbol.
    if:
      type: symbol
      kind: call
      regex: '(^|\.)appendFile$'
