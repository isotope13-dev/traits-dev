defaults:
  platforms: [unix, windows]
  for: [lua]
traits:
  - id: lua-open-append-update-mode
    desc: Lua opens file for append/update writes
    crit: notable
    conf: 0.85
    platforms: [linux]
    if:
      # RPM stores Lua scriptlets in the package header rather than as a
      # standalone text member; string extraction still reaches them (cleave
      # runs `strings` over the whole file), so `text` sees the same bytes `raw` did.
      type: text
      regex: 'io\.open\s*\([^\)\r\n]{0,160},\s*["'']a\+["'']'
