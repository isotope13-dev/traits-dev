defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-random-file-append
    desc: Appends random bytes with random length
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule x86_random_file_append {
         strings:
          $padding = { 68 ?? ?? ?? ?? FF 75 08 FF 15 ?? ?? ?? ?? 59 59 89 45 FC 83 7D FC 00 74 62 FF 15 ?? ?? ?? ?? 99 B9 40 0D 03 00 F7 F9 89 55 F8 68 ?? ?? ?? ?? 8D 45 F0 50 E8 ?? ?? ?? ?? 59 59 83 65 F4 00 EB 07 8B 45 F4 40 89 45 F4 8B 45 F4 3B 45 F8 7D 22 FF 15 ?? ?? ?? ?? 99 B9 FF 00 00 00 F7 F9 88 55 F0 FF 75 FC 8D 45 F0 50 FF 15 ?? ?? ?? ?? 59 59 EB CF }
          $mode = "a\x00"
         condition:
          pe.machine == pe.MACHINE_I386 and
          all of them and
          for any s in pe.sections : (s.characteristics & pe.SECTION_MEM_EXECUTE != 0 and @padding >= s.raw_data_offset and @padding+!padding <= s.raw_data_offset+s.raw_data_size) and
          $mode at pe.rva_to_offset(uint32(@padding+1)-pe.image_base) and
          uint32(@padding+10) == pe.image_base+pe.import_rva("MSVCRT.dll","fopen") and
          uint32(@padding+27) == pe.image_base+pe.import_rva("MSVCRT.dll","rand") and
          uint32(@padding+81) == pe.image_base+pe.import_rva("MSVCRT.dll","rand") and
          uint32(@padding+105) == pe.image_base+pe.import_rva("MSVCRT.dll","fputs")
        }
