defaults:
  for: [dos_com, static-lib, data]
  platforms: [windows, unix]
  size_max: 65536
traits:
  # Build a near-jump header, write a buffer, rewind, and dispatch another
  # write. An EOF seek in the caller distinguishes appending from rewriting.
  - id: dos-jump-header-two-writes
    desc: DOS builds jump header and writes twice
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: 'A3 ?? ?? C6 06 ?? ?? E9 [0-12] B4 40 B9 ?? ?? 33 D2 E8 ?? ?? 32 C0 33 C9 33 D2 B4 42 E8 ?? ?? B4 40 E8 ?? ??'

  - id: dos-append-body-then-write-jump-header
    desc: DOS appends body then writes jump header
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: "B4 40 8B D5 81 EA ?? ?? 81 C2 ?? ?? 33 C9 B1 ?? CD 21 B8 FD 41 40 40 40 99 8B CA CD 21 8B C4 8B F8 40 40 40 96 AD 96 81 C6 ?? ?? 81 EE ?? ?? B0 E9 57 AA 96 AB 5A 33 C9 41 41 41 B4 40 CD 21 B4 3E CD 21"
