defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.95

traits:
  - id: tee-hidden-home-cache-append
    desc: tee append to hidden home cache path
    if:
      type: text
      regex: '\btee\s+-a\s+("?\$(HOME|\{HOME\})|~)/\.cache/\.[A-Za-z0-9_.-]+'

  # Match the redirections attached to one parsed statement. A quoted
  # heredoc containing a future command is data, but the outer >> is a write.
  - id: shell-heredoc-append-redirection
    desc: Shell appends output with heredoc input
    if:
      type: tree-sitter
      query: |
        (redirected_statement
          redirect: (file_redirect ">>" destination: (_) @destination)
          redirect: (heredoc_redirect)) @append
