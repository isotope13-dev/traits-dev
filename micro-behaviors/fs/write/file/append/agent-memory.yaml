defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript, markdown]
traits:
  - id: memory-md-append-redirection
    desc: Shell append redirection targets MEMORY.md
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)>>\s*["'']?[^"''\n]{0,40}MEMORY\.md\b'
