defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
- id: inject-appends-self-destruct-snippet
  desc: Injector name, append and self-destruct call
  crit: suspicious
  conf: 0.98
  for: [javascript, typescript]
  all:
  - id: metadata/filename/identity::inject-js-basename
  - id: micro-behaviors/fs/write/file/append::append-file-sync
  - id: micro-behaviors/data/control-flow/dispatch/named::js-self-destruct-call
