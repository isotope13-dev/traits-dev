defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # The FileStream name corroborates the CIL constructor's Append (6) and
  # Write (2) arguments. Tokens vary between builds. This is a probable
  # append-write profile, not a claim that every token has been resolved.
  - id: managed-filestream-append-buffer-profile
    desc: FileStream name and append-buffer CIL
    crit: notable
    conf: 0.94
    if:
      type: yara
      source: |
        import "pe"
        rule managed_filestream_append_buffer {
          strings:
            $stream = "FileStream" ascii fullword
            $layout = { 1C 18 73 ?? ?? ?? 0A 13 ?? [0-12]
                        20 ?? ?? ?? ?? 8D ?? ?? ?? 01 13 ??
                        73 ?? ?? ?? 0A 11 ?? 6F ?? ?? ?? 0A 00
                        11 ?? 11 ?? 16 11 ?? 8E 69 6F ?? ?? ?? 0A }
          condition:
            $stream and for any i in (0..pe.number_of_sections - 1) : (
              pe.sections[i].name == ".text" and
              $layout in (pe.sections[i].raw_data_offset..
                pe.sections[i].raw_data_offset + pe.sections[i].raw_data_size)
            )
        }

composite_rules:
  # The byte array is filled through a receiver call and then written.
  # NextBytes metadata corroborates the random-fill interpretation.
  # No system-file target, successful append, or overwrite is inferred.
  - id: managed-append-random-buffer-profile
    desc: Managed append-mode random-buffer write profile
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/os/random/prng/stdlib::random-nextbytes
      - id: managed-filestream-append-buffer-profile
