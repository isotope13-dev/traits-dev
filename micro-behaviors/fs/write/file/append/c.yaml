defaults:
traits:
  - id: fopen-hidden-temp-append
    platforms: [unix]
    for: [c, html]
    desc: Append-open hidden temp config
    crit: suspicious
    conf: 0.85
    if:
      type: text
      substr: 'fopen(&quot;/tmp/.ind&quot;,&quot;a+t&quot;)'
  # Neutral file-write capability. Persistence and infection objectives add
  # the destination/path context that gives an append operation intent.
  # The mode is a prefix match: "a", "ab", and "a+" are all append modes
  # (an "ab" credential-log open otherwise reads as a plain write).
  - id: c-fopen-append-mode
    platforms: [unix, windows]
    for: [c, cpp]
    desc: C opens a file in append mode
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: fopen
      arg:
        kind: string
        regex: '^a'
