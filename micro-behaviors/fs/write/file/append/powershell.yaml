# File Writing in PowerShell
defaults:
  platforms: [windows]
  for: [powershell, batch]
  crit: notable
  conf: 0.9
traits:
  - id: add-content
    desc: Calls PowerShell Add-Content
    ref: sha256:c0b1dd711360b1389cb8e44f2e984d971ba6d3ab8c59da42eb8b12bdc1b4189a
    for: [powershell]
    if:
      type: symbol
      kind: call
      exact: Add-Content
  - id: powershell-dotnet-append-text
    for: [powershell]
    desc: PowerShell invokes .NET File.AppendAllText
    conf: 0.98
    if:
      type: text
      regex: '(?i)\[(System\.IO\.)?File\]::AppendAllText\s*\('
