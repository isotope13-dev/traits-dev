defaults:
  platforms: [windows, unix, openwrt]
traits:
  - id: dotnet-appendalltext-token
    for: [pe, dll]
    desc: .NET File.AppendAllText token
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'AppendAllText|File\.AppendAllText'
    unless:
      - id: metadata/lang/compiler/managed::delphi
  - id: dotnet-filemode-append-token
    for: [csharp, pe, dll]
    desc: .NET append file mode token
    crit: notable
    conf: 0.84
    if:
      type: text
      regex: 'FileMode\.Append|FileMode[^A-Za-z0-9_]{0,24}Append'
