defaults:
  crit: notable
  for: [go]
traits:
  - id: go-append-file-method-call
    platforms: [windows, unix]
    desc: Go AppendFile method call
    conf: 0.75
    if:
      type: text
      substr: .AppendFile(
  - id: append-ssh-authorized-keys
    platforms: [unix]
    desc: Go appends to SSH authorized_keys
    conf: 0.94
    if:
      type: text
      regex: 'authorized_keys[\s\S]{0,220}os\.O_APPEND'
