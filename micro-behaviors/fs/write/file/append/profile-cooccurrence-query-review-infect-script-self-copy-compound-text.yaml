---
defaults:
  platforms:
  - windows
  for:
  - text
  - vbs
  - static-lib
traits:
- id: text-addline-getline
  desc: AddLine call contains GetLine call
  crit: component
  conf: 0.9
  if:
    type: text
    regex: "(?i)\\.AddLine\\s*\\([^)\\r\\n]{0,60}GetLine\\s*\\("
composite_rules:
- id: compound-appends-report-source
  desc: ERT lookup, stream and text calls co-occur
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/fs/search/name::findfirst-ert-reports
  - id: micro-behaviors/data/stream/transfer::compound-file2stream
  - id: micro-behaviors/fs/write/file/append::text-addline-getline
