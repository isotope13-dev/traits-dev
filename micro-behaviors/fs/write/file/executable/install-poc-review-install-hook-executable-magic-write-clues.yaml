defaults:
  platforms: [windows, linux, macos, unix]
  for: [python, javascript, typescript, shell, batch, powershell, ruby, php]
composite_rules:
  - id: install-hook-executable-magic-write-clues
    for: [javascript, package.json, npm]
    desc: Install hook has executable-magic array and file write clues
    crit: suspicious
    conf: 0.88
    scope: archive
    all:
      - id: micro-behaviors/os/package-manager/hook-install::npm-postinstall-runs-bundled-script
      - id: micro-behaviors/data/embedded/payload/array::executable-magic-byte-array
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call

