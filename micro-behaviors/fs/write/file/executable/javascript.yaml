defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-write-file-executable-mode
    size_max: 262144
    desc: Node file write requests executable mode
    crit: notable
    conf: 0.92
    attack: T1222.002
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: [(identifier) @callee
                     (member_expression property: (property_identifier) @callee)]
          arguments: (arguments . (_) . (_) . (object
            (pair key: [(property_identifier) @key
                        (string (string_fragment) @key)] value: (number) @mode)))
          (#match? @callee "^writeFile(Sync)?$")
          (#eq? @key "mode")
          (#match? @mode "^(0[oO]?[0-7]?([1357][0-7]{2}|[0-7][1357][0-7]|[0-7]{2}[1357])|448|0[xX]1[cC]0)$"))
