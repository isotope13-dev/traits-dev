defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-write-file-executable-mode
    desc: Node writes a file with executable permissions
    crit: notable
    conf: 0.92
    attack: T1222.002
    unless:
      # Filename/manifest test guards only. The is-test context also matches
      # the validation corpus's testdata/ directory, which would suppress
      # this atom on every fixture under it.
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: (member_expression property: (property_identifier) @callee)
          arguments: (arguments (_) (_) (object
            (pair key: (property_identifier) @key value: (number) @mode)))
          (#match? @callee "^writeFile(Sync)?$")
          (#eq? @key "mode")
          (#match? @mode "^0o([1357][0-7]{2}|[0-7][1357][0-7]|[0-7]{2}[1357])$"))
