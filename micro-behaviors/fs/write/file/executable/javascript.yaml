defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-write-file-executable-mode
    desc: Node writes a file with executable permissions
    crit: notable
    conf: 0.92
    attack: T1222.002
    unless:
      # Filename/manifest test guards only. The is-test context also matches
      # the validation corpus's testdata/ directory, which would suppress
      # this atom on every fixture under it.
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/presence/harness::test-directory-path
    if:
      type: text
      regex: 'writeFile(Sync)?.{0,300}\bmode\s*:.{0,100}\b0o755\b'
