defaults:
  platforms: [windows, unix]
  for: [python]
composite_rules:
  - id: python-write-chmod-exec
    crit: suspicious
    mbc: C0016
    desc: Write file and make executable
    conf: 0.95
    attack: T1222.002
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/write/file/handle::python-open-write-binary
      - id: micro-behaviors/fs/chmod/executable/mode::python-executable-mode
    unless:
      - id: micro-behaviors/communications/http/download/write::official-sandbox-agent-release-url
      - id: metadata/package/testing/harness/runtime::python-editor-test-harness
      - id: well-known/app/ai/assistant/personalclaw::personalclaw-sandbox-module
      - id: well-known/lib/ai/tvm::tvm-compiler-runtime
      # Staging a binary whose digest was pinned and checked first is an
      # installer, not a dropper -- a dropper's payload rotates, so it cannot
      # pin one.
      - id: micro-behaviors/crypto/hash/file::hash-pinned-download-context
