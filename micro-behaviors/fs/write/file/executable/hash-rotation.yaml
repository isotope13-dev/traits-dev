# Hash-changing diagnostics do not alone prove malicious intent.
defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: executable-hash-padding-diagnostic
    desc: Executable hash-padding diagnostic
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'mutate: hash changed (+%d bytes)'
      section: .rdata

  - id: exit-to-change-hash-diagnostic
    desc: Exits to change own file hash
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'exiting to chang\w* (the |its )?hash'
      section: .rdata

composite_rules:
  - id: self-hash-rotation-relaunch
    desc: Self-image padding and relaunch diagnostics
    crit: suspicious
    conf: 0.97
    all:
      - id: executable-hash-padding-diagnostic
      - id: exit-to-change-hash-diagnostic
    unless:
      - id: well-known/app/security/eupdate-helper::eupdate-helper-binary
