# Hash-changing diagnostics do not alone prove malicious intent.
defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: scheduled-image-rotation-diagnostic
    desc: Scheduled executable rotation diagnostic
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'rotate: cron triggered, rotating now'
      section: .rdata

  - id: standby-image-mutation-command
    desc: Standby executable mutation command template
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: '"%s" -standby-mutate "%s" %d'
      section: .rdata

  - id: executable-hash-padding-diagnostic
    desc: Executable hash-padding diagnostic
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'mutate: hash changed (+%d bytes)'
      section: .rdata

  - id: exit-to-change-hash-diagnostic
    desc: Exits to change own file hash
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'exiting to chang\w* (the |its )?hash'
      section: .rdata

composite_rules:
  # Application identity does not suppress observed hash rotation. Eupdate
  # Helper 4.0.1 appends random bytes to its own image and relaunches it;
  # retain this unusual capability even when the update mirror is benign.
  - id: self-hash-rotation-relaunch
    desc: Logs self-image padding and hash rotation
    crit: suspicious
    conf: 0.97
    all:
      - id: executable-hash-padding-diagnostic
      - id: exit-to-change-hash-diagnostic

  # Scheduling and standby handoff describe how rotation is performed, not
  # an anti-AV objective. Keep that capability visible independently of the
  # suspicious self-hash rotation above; these diagnostics prove no attack.
  - id: scheduled-self-image-rotation
    desc: Logs scheduled image padding via standby copy
    crit: notable
    conf: 0.98
    all:
      - id: self-hash-rotation-relaunch
      - id: scheduled-image-rotation-diagnostic
      - id: standby-image-mutation-command
