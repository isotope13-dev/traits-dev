defaults:
  for: [python]
  platforms: [unix, windows]
composite_rules:
  - id: appdata-exe-path-near-write
    desc: AppData EXE path near file write
    crit: suspicious
    conf: 0.92
    platforms: [windows]
    all:
      - id: micro-behaviors/fs/path/application/executable::appdata-exe-path
      - id: micro-behaviors/fs/write/file/target::write-exe
    near_lines: 40
    unless:
      - id: metadata/build/recognized-contexts::benign-app-fp-context
      - id: well-known/lib/data/market-data::dartlab-finance-context
