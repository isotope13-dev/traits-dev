defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: python-scr-exe-write-clues
  desc: Screensaver and executable suffixes with file write
  crit: suspicious
  conf: 0.98
  all:
  - id: metadata/lang/source/literal/string/fragment::scr-file-extension
  - id: micro-behaviors/fs/path/extension::exe-name-or-extension
  any:
  - id: micro-behaviors/fs/write/file/handle/unspecified::py-open-write-inline
