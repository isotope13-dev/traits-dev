defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: node-precommit-default-write
    desc: Writes pre-commit hook with default truncation
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((method_definition
          body: (statement_block
            (lexical_declaration
              (variable_declarator name: (identifier) @hook
                value: (call_expression function: (member_expression
                  property: (property_identifier) @join)
                  arguments: (arguments (identifier) (string (string_fragment) @name)))))
            (try_statement body: (statement_block
              (expression_statement (call_expression
                function: (member_expression object: (identifier) @fs property: (property_identifier) @write)
                arguments: (arguments . (identifier) @hook2 (identifier)
                  (object . (pair key: (property_identifier) @mode value: (number)) .) .)))))))
          (#eq? @join "join")
          (#eq? @name "pre-commit")
          (#eq? @fs "fs")
          (#eq? @write "writeFileSync")
          (#eq? @mode "mode")
          (#eq? @hook @hook2))
