defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: postinstall-user-data-executable-placeholder
    desc: Writes EXE to user-data output path
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: writeFileSync\s*\(\s*["']/mnt/user-data/outputs/[^"']{1,80}\.exe["']
