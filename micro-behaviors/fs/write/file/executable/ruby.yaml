# inreplace's third argument is replacement content, not the search pattern.
# Keep the file target and replacement tied to the same call.
defaults:
  for: [ruby]
  platforms: [unix]
  crit: notable
  conf: 0.95

traits:
  - id: ruby-inreplace-executable-shell-pipeline
    desc: Ruby replaces executable with shell pipeline
    if:
      type: symbol
      kind: call
      exact: inreplace
      args:
        - index: 0
          regex: '(^|/)(s?bin|libexec)/[^/]+$'
        - index: 2
          regex: '^\s*(curl|wget)\s+[^\n|]{0,160}(https?|ftp)://[^\s|]+[^\n|]{0,80}\|\s*(/bin/)?(ba|z)?sh\b'
