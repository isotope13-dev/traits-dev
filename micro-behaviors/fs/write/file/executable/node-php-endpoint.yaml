defaults:
  platforms: [unix, windows]
  for: [javascript]
  crit: notable

traits:
  - id: node-write-php-endpoint
    desc: Writes a PHP endpoint file
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(writeFile|writeFileSync)$'
      arg:
        index: 0
        from:
          whole_value: '\.php$'
