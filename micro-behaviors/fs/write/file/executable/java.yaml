defaults:
  platforms: [unix, windows]
  for: [java, kotlin]

traits:
  - id: java-set-executable-source
    desc: Java setExecutable call
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: setExecutable
composite_rules:
  - id: java-write-executable-file-source
    desc: Java writes executable file
    crit: suspicious
    conf: 0.94
    unless:
      - id: metadata/path/directory::test-directory-component
    near_lines: 16
    all:
      - id: micro-behaviors/fs/write/file/unspecified::java-files-write-source
      - id: micro-behaviors/fs/chmod/executable/mode::java-owner-execute-permission
  - id: kotlin-write-executable-file-source
    desc: Kotlin writes executable file
    crit: notable
    conf: 0.94
    for: [kotlin]
    near_lines: 12
    all:
      - id: micro-behaviors/fs/chmod/executable/mode::kotlin-set-executable-source
    any:
      - id: micro-behaviors/fs/write/file/full/string::kotlin-write-text-source
      - id: micro-behaviors/fs/write/file/append::kotlin-append-text-source
    needs: 1
