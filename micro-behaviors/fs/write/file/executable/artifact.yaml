defaults:
  platforms: [windows, linux, macos]
  for: [scripts, '!jcl']
  crit: notable
  conf: 0.9

composite_rules:
- id: executable-artifact-write
  desc: Writes an executable or bytecode artifact
  crit: notable
  conf: 0.9
  # Payload-staging writes only. Generic writers (config vaults, caches,
  # logs under file/full/, file/handle/, ...) do not establish a payload.
  any:
    - id: micro-behaviors/communications/http/download/cli::powershell-download-executable-output
    - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
    - id: micro-behaviors/fs/write/file/executable::python-write-chmod-exec
    - id: micro-behaviors/fs/write/file/bytecode::python-pyc-output-write
  unless:
    - id: metadata/file/format/structured::serialized-news-article-catalog
