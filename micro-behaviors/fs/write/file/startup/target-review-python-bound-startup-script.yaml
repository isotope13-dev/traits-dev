defaults:
  platforms: [windows]
  for: [python]
traits:
  - id: python-bound-startup-script-write
    desc: Writes a script into Windows Startup
    crit: suspicious
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        (block
          (expression_statement (assignment left: (identifier) @folder
            right: (call function: (attribute attribute: (identifier) @join)
              arguments: (argument_list (string) @startup))))
          (if_statement condition: (identifier) @checked
            consequence: (block
              (expression_statement (assignment left: (identifier) @path
                right: (call function: (attribute attribute: (identifier) @join2)
                  arguments: (argument_list (identifier) @root (string) @filename))))
              . (expression_statement (call
                function: (attribute
                  object: (call function: (identifier) @open
                    arguments: (argument_list (identifier) @opened (string) @mode))
                  attribute: (identifier) @write)
                arguments: (argument_list (string) @script)))))
          (#eq? @join "join") (#eq? @join2 "join")
          (#eq? @folder @checked) (#eq? @folder @root)
          (#eq? @path @opened) (#eq? @open "open") (#eq? @write "write")
          (#match? @startup "^[\"']Startup[\"']$")
          (#match? @filename "(?i)\\.pyw?[\"']$")
          (#match? @mode "[wa]")
          ) @match
