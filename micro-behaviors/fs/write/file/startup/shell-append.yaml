defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: variable-home-shell-rc-append
    desc: Appends to home shell startup file
    if:
      type: text
      regex: '>>[ \t]*["'']?\$\{?\w+\}?/\.(bashrc|profile|bash_profile)\b'
  - id: variable-directory-rcs-append
    desc: Appends to rcS boot script path
    if:
      type: text
      regex: '>>[ \t]*["'']?\$\{?\w+\}?/rcS\b'
  - id: hidden-command-rcs-append
    desc: Appends hidden command to rcS script
    if:
      type: text
      regex: 'echo\s+["'']\$\{?\w+\}?/\.[\w.-]{1,40}[^\n]{0,80}>>\s*["'']?\$\{?\w+\}?/rcS\b'
