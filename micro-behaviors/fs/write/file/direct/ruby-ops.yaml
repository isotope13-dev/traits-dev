defaults:
  for:
    - ruby
  platforms:
    - unix
    - windows
traits:
  - id: ruby-file-write-content
    desc: Writes file content with Ruby File.write
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: member
      exact: File.write
  # Ruby native-extension recipes normally emit their Makefile through mkmf's
  # create_makefile; hand-writing the file is the shape used both by gems that
  # stub out an optional extension and by install-time droppers that only need
  # `gem install` to succeed. Neutral on its own -- intent comes from what else
  # the recipe does.
  - id: ruby-makefile-write
    desc: Ruby writes a Makefile to disk
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bFile\.(open|write)\s*\(\s*([''"]Makefile[''"]|File\.join\([^)]{0,120}[''"]Makefile[''"]\))'
