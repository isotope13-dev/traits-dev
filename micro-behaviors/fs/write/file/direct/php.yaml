defaults:
  platforms: [windows, unix]
  for:
    - php
  mbc: C0052
traits:
  - id: file-put-contents
    desc: Creates or overwrites a local file
    crit: notable
    conf: 0.8
    attack: T1105
    if:
      type: text
      word: file_put_contents
    unless:
      - type: text
        regex: namespace\s+Nette
      # The structured PHP call trait is the canonical signal. Keep this
      # text matcher only as a parser-recovery fallback so one call cannot
      # contribute two findings in different feature directories.
      - id: micro-behaviors/fs/file/write/direct::php-file-put-contents

  - id: fwrite
    desc: Writes data to an open file
    crit: notable
    conf: 0.8
    if:
      type: text
      word: fwrite
    unless:
      - id: micro-behaviors/fs/file/write/direct::php-fwrite

  - id: fputs
    desc: Writes a string to an open file
    crit: notable
    conf: 0.8
    if:
      type: text
      word: fputs
    unless:
      - id: micro-behaviors/fs/file/write/direct::php-fputs

  - id: move-uploaded-file
    desc: Moves uploaded PHP file
    crit: notable
    conf: 0.85
    attack: T1105
    if:
      type: text
      word: move_uploaded_file
