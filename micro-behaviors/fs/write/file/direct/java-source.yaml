defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: java-open-output-stream-call
    desc: Java opens an output stream for writing
    crit: notable
    conf: 0.88
    for: [java]
    if:
      type: symbol
      kind: call
      exact: openOutputStream
  - id: java-fileoutputstream-source
    desc: Java FileOutputStream usage
    crit: notable
    conf: 0.8
    for: [java]
    if:
      type: text
      substr: new FileOutputStream
  - id: java-fos-simple
    desc: Java FileOutputStream class reference
    crit: notable
    conf: 0.88
    for: [java]
    if:
      type: text
      word: FileOutputStream
  - id: jvm-fileoutputstream-bytecode
    desc: JVM imports FileOutputStream class
    crit: notable
    conf: 0.86
    for: [class, jar]
    if:
      type: import
      exact: java/io/FileOutputStream
  - id: java-filewriter-source
    desc: Java FileWriter usage
    crit: notable
    conf: 0.8
    for: [java]
    if:
      type: text
      substr: new FileWriter
  - id: java-files-write-source
    desc: Java Files.write usage
    crit: notable
    conf: 0.9
    for: [java]
    if:
      type: text
      substr: Files.write
  - id: jvm-file-setreadable-bytecode
    desc: JVM changes a file's readable permission
    crit: notable
    conf: 0.92
    for: [class, jar, zip]
    if:
      type: import
      exact: java/io/File.setReadable
  - id: jvm-file-setexecutable-bytecode
    desc: JVM changes a file's executable permission
    crit: notable
    conf: 0.92
    for: [class, jar, zip]
    if:
      type: import
      exact: java/io/File.setExecutable
  - id: jvm-files-write-bytecode
    desc: JVM bytecode Files.write call
    crit: notable
    conf: 0.9
    for: [class, jar, zip]
    if:
      type: import
      exact: java/nio/file/Files.write
  - id: java-owner-execute-permission
    desc: Java sets owner execute permission
    crit: notable
    conf: 0.9
    for: [java, class, jar, zip]
    if:
      type: text
      substr: OWNER_EXECUTE
  - id: java-fileoutputstream-file-handle
    desc: Java FileOutputStream on File handle
    crit: notable
    conf: 0.8
    for: [java]
    if:
      type: text
      substr: new FileOutputStream(f)
  - id: java-world-readable-permission
    desc: Java sets world-readable permission
    crit: notable
    conf: 0.9
    for: [java]
    if:
      type: text
      substr: setReadable(true, false)
  - id: java-world-executable-permission
    desc: Java sets world-executable permission
    crit: notable
    conf: 0.9
    for: [java]
    if:
      type: text
      substr: setExecutable(true, false)
  - id: kotlin-write-text-source
    desc: Kotlin writes text to a file
    crit: notable
    conf: 0.88
    for: [kotlin]
    if:
      type: text
      regex: '\.writeText\s*\('
  - id: kotlin-append-text-source
    desc: Kotlin appends text to a file
    crit: notable
    conf: 0.88
    for: [kotlin]
    if:
      type: text
      regex: '\.appendText\s*\('
  - id: kotlin-set-executable-source
    desc: Kotlin marks a file executable
    crit: notable
    conf: 0.9
    for: [kotlin]
    if:
      type: text
      regex: '\.setExecutable\s*\(\s*true'
  - id: kotlin-direct-byte-write-source
    desc: Kotlin direct byte file write
    crit: notable
    conf: 0.9
    platforms: [android, unix, windows]
    for: [kotlin]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(writeBytes|Files\.write(String)?)$'
  - id: jvm-files-writestring-bytecode
    desc: JVM bytecode Files.writeString
    crit: notable
    conf: 0.9
    for: [class]
    if:
      type: symbol
      exact: java/nio/file/Files.writeString
  - id: jvm-owner-execute-permission
    desc: JVM bytecode owner execute perm
    crit: notable
    conf: 0.9
    for: [class]
    if:
      type: symbol
      exact: java/nio/file/attribute/PosixFilePermission.OWNER_EXECUTE
composite_rules:
  - id: jvm-direct-file-write-source
    desc: Java or Kotlin direct file write
    crit: notable
    conf: 0.9
    platforms: [android, unix, windows]
    for: [java, kotlin]
    any:
      - id: java-fileoutputstream-source
      - id: java-files-write-source
      - id: kotlin-direct-byte-write-source
  - id: java-write-executable-file-source
    desc: Java writes executable file
    crit: suspicious
    conf: 0.94
    unless:
      - id: metadata/package/testing/presence/harness/
    for: [java]
    all:
      - id: java-files-write-source
      - id: java-owner-execute-permission
  - id: kotlin-write-executable-file-source
    desc: Kotlin writes executable file
    crit: suspicious
    conf: 0.94
    for: [kotlin]
    near_lines: 12
    unless:
      - id: well-known/app/development/processing::processing-package-context
    all:
      - id: kotlin-set-executable-source
    any:
      - id: kotlin-write-text-source
      - id: kotlin-append-text-source
    needs: 1
