defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: write-node-modules-directory
    desc: Writes a file under node_modules
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: '(writeFile|writeFileSync|appendFile)\s*\(.{0,220}node_modules'
  - id: write-file-sync
    desc: Node fs writes to a file synchronously
    crit: notable
    conf: 0.95
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
    if:
      type: symbol
      kind: call
      regex: '^(fs|fsp|fsPromises|promises)\.writeFileSync$'

  - id: node-write-shell-script
    desc: Node writes an embedded shell script
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\.writeFileSync\s*\([^;\n]{0,180}#!/bin/(ba)?sh'
    unless:
      - id: metadata/package/testing/

  - id: node-writes-serialized-yaml
    desc: Node writes serialized YAML data
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'writeFileSync\s*\([^;\n]{0,220}\byaml\.dump\s*\('
  - id: append-file-sync
    desc: Appends to file synchronously
    crit: notable
    conf: 0.8
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
    if:
      type: text
      regex: '\.appendFileSync\s*\('
  - id: write-file-async
    desc: Node fs writes to a file asynchronously
    crit: baseline
    conf: 0.8
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/presence/harness/
      # Emscripten and similar WASM runtimes commonly expose a virtual
      # filesystem as `const fs = instance.FS`; its writeFile method is not a
      # host Node.js filesystem write.
      - type: text
        regex: '\b(const|let|var)\s+fs\s*=\s*[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)*\.FS\b'
    if:
      type: text
      regex: '\b(fs|fsp|fsPromises|promises)\.writeFile\s*\(\s*[^)\s]'
  - id: append-file-async
    desc: Appends to file asynchronously
    crit: notable
    conf: 0.8
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/presence/harness/
    if:
      type: text
      regex: '\.appendFile\s*\('
  - id: create-write-stream
    desc: Creates a write stream
    crit: notable
    conf: 0.8
    unless:
      - type: basename
        regex: \.map$|^(rimraf|run-(script-)?os|ipv6(grep)?)$
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
    if:
      type: symbol
      kind: call
      regex: '(^|\.)createWriteStream$'
  - id: adodb-stream-write
    desc: ADODB.Stream write operation
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'ADODB\.Stream[\s\S]{0,120}\.write(Text)?\s*\('
  - id: js-authorized-keys-variable-write
    desc: Node writes via authorized_keys path variable
    crit: component
    conf: 0.9
    if:
      type: text
      regex: "(appendFile(Sync)?|writeFile(Sync)?)\\s*\\(\\s*(authKeys|authorizedKeys)\\w*"
  - id: document-save-call
    desc: Calls document persistence function
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '\.saveDoc\s*\('
composite_rules:
  - id: js-file-write
    desc: JavaScript file write operation
    crit: notable
    conf: 0.9
    any:
      - id: write-file-sync
      - id: append-file-sync
      - id: write-file-async
      - id: micro-behaviors/fs/write/runtime::bun-write-file
      - id: append-file-async
      - id: create-write-stream
      - id: adodb-stream-write
      - id: document-save-call
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
