defaults:
  for: [oledoc, ooxml]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  # The ASCII token remains visible in the compressed OLE module stream.  A
  # SaveAs call is a clear file-writing capability, but is common in
  # spreadsheet automation.
  - id: vba-workbook-saveas
    desc: VBA saves workbook to a file
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "53 61 76 65 41 73"
