defaults:
  for: [oledoc, ooxml]
  platforms: [windows]
  crit: notable
  conf: 0.9

traits:
  # The ASCII token remains visible in the compressed OLE module stream.  A
  # SaveAs is a clear file-writing capability, but the bare token also
  # occurs in comments and metadata.  Require the nearby VBA named output
  # argument or workbook format so this remains an operation, not a word.
  - id: vba-workbook-saveas
    desc: VBA SaveAs call names output file
    crit: notable
    conf: 0.92
    if:
      type: raw
      regex: '(?i)SaveAs.{0,64}(Filename|xlOpenXMLWorkbook)'
