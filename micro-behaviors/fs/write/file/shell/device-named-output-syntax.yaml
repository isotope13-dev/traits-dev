traits:
- platforms:
  - unix
  for:
  - shell
  crit: notable
  id: dd-zero-to-device-named-var
  desc: dd zero-input syntax with device-named output
  conf: 0.9
  if:
    type: text
    regex: dd\s+if=/dev/zero\s+of\s*=\s*["']?\$\{?\w*(dev|disk|drive|swap)\w*\}?["']?
    case_insensitive: true
    not:
    - regex: \$\{?\w*file\w*\}?
  unless:
  - type: text
    substr: _dd if=/dev/zero
