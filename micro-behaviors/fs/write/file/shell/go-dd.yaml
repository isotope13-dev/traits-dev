# Source-local value relationship: a nearby mount query is not sufficient.
defaults:
  for: [go]
  platforms: [unix]
  crit: notable
  conf: 0.95

traits:
  - id: go-dd-mount-table-output
    desc: Go dd targets mounted device
    if:
      type: text
      regex: 'exec\.Command\("dd", "if=/dev/zero", "of="\+dev\b'
