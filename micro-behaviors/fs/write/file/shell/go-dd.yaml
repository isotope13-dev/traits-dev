# Source-local value relationship: a nearby mount query is not sufficient.
defaults:
  for: [go]
  platforms: [unix]
  crit: notable
  conf: 0.95

traits:
  - id: go-dd-mount-query-output
    desc: Go dd destination derives from mount query
    if:
      type: symbol
      kind: call
      exact: os/exec.Command
      arg:
        index: 2
        from:
          value: '^of=$'
      args:
        - index: 0
          exact: dd
        - index: 1
          exact: if=/dev/zero
        - index: 2
          from:
            call: '^os/exec\.Command$'
            literal: '^findmnt$'
            through:
              - call: '^os/exec\.Command\.Output$'
                receiver: true
              - call: '^string$'
                arguments: [0]
              - call: '^strings\.TrimSpace$'
                arguments: [0]

  - id: go-dd-mount-table-output
    desc: Go dd destination derives from mount table
    if:
      type: symbol
      kind: call
      exact: os/exec.Command
      arg:
        index: 2
        from:
          value: '^of=$'
      args:
        - index: 0
          exact: dd
        - index: 1
          exact: if=/dev/zero
        - index: 2
          from:
            call: '^os\.Open$'
            literal: '^/proc/mounts$'
            through:
              - call: '^bufio\.NewScanner$'
                arguments: [0]
              - call: '^[A-Za-z_][A-Za-z_0-9]*\.Text$'
                receiver: true
              - call: '^strings\.Fields$'
                arguments: [0]
