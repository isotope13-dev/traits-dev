traits:
- platforms:
  - openbsd
  for:
  - shell
  id: dd-random-device-named-output-syntax
  desc: dd random-input syntax with device-named output
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: dd\s+if=/dev/u?random\s+of\s*=\s*["']?\$[A-Za-z_]*(DEV|DISK|SWAP)[A-Za-z_]*
  not:
  - regex: \$[A-Za-z_]*FILE
