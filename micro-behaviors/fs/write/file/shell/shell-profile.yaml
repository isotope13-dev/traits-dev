# Direct writes that target shell startup files. Distinct from the bare
# rc-filename references under fs/path/config/shell/ (naming the file is a
# path reference; this directory's traits bind the write call to the rc
# target, so archive roll-up cannot pool an unrelated append with them).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: shell-profile-append-call
    desc: Appends with the appendFile API
    crit: notable
    conf: 0.9
    # Binds the call to its target in one match so archive roll-up cannot
    # pool a hook manifest with an unrelated append elsewhere: the rc name
    # must sit inside the append call's own argument window. The window
    # stops at statement separators rather than parens -- the rc literal is
    # usually an argument of a nested call (`path.join(os.homedir(),
    # '.bashrc')`) or a template literal, which a paren-bounded window
    # cannot span. Some install hooks first bind that path to a variable and
    # append the variable later; retain that specific homedir/path.join shape
    # so the write remains tied to the shell profile rather than matching an
    # unrelated append elsewhere in the file.
    if:
      type: text
      regex: 'appendFile(Sync)?\s*\('

  - id: shell-profile-rc-name
    desc: References a shell startup file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.(bashrc|zshrc|bash_profile|zprofile|profile)\b'

  - id: shell-profile-home-path
    desc: Builds a shell startup path from home
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'path\.join\s*\(\s*home\s*,\s*[''"]?\.(bashrc|zshrc|bash_profile|zprofile|profile)\b'

  - id: shell-profile-target-append
    desc: Appends to a shell profile target
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bappendFile\s*\(\s*target\s*,'

composite_rules:
  - id: append-shell-rc-direct
    desc: Appends directly to a shell startup file
    crit: notable
    conf: 0.9
    all:
      - id: shell-profile-append-call
      - id: shell-profile-rc-name
    near_bytes: 240

  - id: append-shell-rc-bound-target
    desc: Appends a home-derived shell startup target
    crit: notable
    conf: 0.9
    all:
      - id: shell-profile-home-path
      - id: shell-profile-target-append
    near_bytes: 256

  - id: append-shell-rc-file
    desc: Appends to shell startup file
    crit: notable
    conf: 0.9
    any:
      - id: append-shell-rc-direct
      - id: append-shell-rc-bound-target
