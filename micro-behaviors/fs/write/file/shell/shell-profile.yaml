# Direct writes that target shell startup files. Distinct from the bare
# rc-filename references under fs/path/config/shell/ (naming the file is a
# path reference; this directory's traits bind the write call to the rc
# target, so archive roll-up cannot pool an unrelated append with them).
# The append-call half of that binding lives with the other neutral Node
# append atoms under fs/write/file/append/ (a bare appendFile call carries
# no shell-profile meaning on its own); the composites below reference them
# cross-directory and supply the rc target themselves.
defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: shell-profile-rc-name
    desc: References a shell startup file
    if:
      # Match parser-confirmed string literals, not JavaScript members such as
      # `pkg.profile`.  The latter names an object field and is not a shell
      # startup-file reference.
      type: literal
      regex: '(^|[/~ ])\.(bashrc|zshrc|bash_profile|zprofile|zshenv|profile)\b'

  - id: shell-profile-home-path
    desc: Builds a shell startup path from home
    if:
      type: text
      regex: 'path\.join\s*\(\s*home\s*,\s*[''"]?\.(bashrc|zshrc|bash_profile|zprofile|zshenv|profile)\b'

  - id: shell-profile-target-append
    desc: Appends to a shell profile target
    if:
      type: text
      regex: '\bappendFile\s*\(\s*target\s*,'

  # Shell-language sibling of the /etc write atoms under
  # objectives/persistence/login/shell/rc/system-wide.yaml: an append redirect
  # or tee -a into a per-user startup file. Same building-block criticality --
  # appending an export line is the documented way installers and agent-skill
  # bootstrap guidance put a tool on PATH, so the write alone stays notable;
  # persistence composites supply the payload and intent. markdown scope:
  # agent-skill files carry the same redirect in fenced install commands.
  - id: shell-rc-append-redirect
    desc: Redirect appends into a user shell rc
    crit: notable
    conf: 0.88
    for: [shell, markdown]
    platforms: [unix]
    if:
      type: text
      regex: '>>[ \t]*["'']?(~|\$HOME)?/?\.(bashrc|zshrc|bash_profile|zprofile|zshenv|profile)\b'
  - id: shell-rc-tee-append
    desc: tee append into a user shell rc
    crit: notable
    conf: 0.88
    for: [shell, markdown]
    platforms: [unix]
    if:
      type: text
      regex: 'tee[ \t]+-[Aa] +["'']?(~|\$HOME)?/?\.(bashrc|zshrc|bash_profile|zprofile|zshenv|profile)\b'

  # Legs of the credential-strip shape below: a replace call whose pattern is
  # an `export <CREDENTIAL>=...` line and whose replacement is empty — the
  # startup file is being rewritten without that credential export.
  # Key-rotation helpers replace the old line with a new value, so the empty
  # replacement is what separates removal from rotation.
  - id: rc-export-line-replace-open
    desc: Replace pattern opens on an export line
    crit: component
    if:
      type: text
      regex: 'replace\(\s*/[^\r\n;]{0,40}\bexport\b'
  - id: rc-credential-export-name
    desc: Credential-named export assignment in pattern
    crit: component
    if:
      type: text
      regex: '(API_KEY|AUTH_TOKEN|ACCESS_TOKEN|_SECRET|_TOKEN)[A-Z_0-9]*='
  - id: rc-empty-replacement-close
    desc: Replace flags followed by empty replacement
    crit: component
    if:
      type: text
      regex: '/[a-z]*\s*,\s*[''"]{0,2}\)'

composite_rules:
  - id: append-shell-rc-direct
    desc: Appends directly to a shell startup file
    # The append legs are the canonical neutral Node append atoms: the call
    # alone says nothing about shell profiles, and the rc-name leg within
    # near_bytes supplies the target binding.
    all:
      - id: shell-profile-rc-name
    any:
      - id: micro-behaviors/fs/write/file/append::node-append-file-sync
      - id: micro-behaviors/fs/write/file/append::append-file-sync
      - id: micro-behaviors/fs/write/file/append::append-file-async
    near_bytes: 240

  - id: append-shell-rc-bound-target
    desc: Appends a home-derived shell startup target
    all:
      - id: shell-profile-home-path
      - id: shell-profile-target-append
    near_bytes: 256

  # The strip shape: one replace call rewriting an `export <CREDENTIAL>=`
  # line away. Bound to its target and the write-back in the composite
  # below, since a bare replace-call mention proves nothing about startup
  # files.
  - id: rc-credential-export-strip
    desc: Strips credential export lines from rc content
    crit: suspicious
    conf: 0.9
    all:
      - id: rc-export-line-replace-open
      - id: rc-credential-export-name
      - id: rc-empty-replacement-close
    near_bytes: 120

  # The strip atom bound to its target and the write-back: together this is
  # "this startup file is being rewritten without its credential exports",
  # which a bare replace-call mention does not establish.
  - id: rc-credential-strip-write-back
    desc: Rewrites startup file without credential exports
    crit: suspicious
    conf: 0.92
    all:
      - id: rc-credential-export-strip
      - id: shell-profile-rc-name
      - id: micro-behaviors/fs/write/file/full::js-file-write
    near_bytes: 600

# No any:-only rollup over the two mechanisms above: the engine filters a
# bare any:/needs<=1 composite from emitted findings, so a rollup here would
# match yet stay invisible to the archive-scope hostile composites that need
# it. Consumers reference both mechanisms directly in their own any: instead.
