defaults:
  crit: notable
traits:
  - id: touch-marker-file
    platforms: [unix, windows]
    for: [python, shell]
    desc: Creates a completion marker with touch
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '(?i)\btouch\s+[^"\r\n]{1,120}\.(ran|done|exec)\b'
  - id: dd-output-file
    attack: T1074.001
    mbc: E1074
    desc: Shell dd writes an output file
    crit: notable
    conf: 0.86
    platforms: [unix, android]
    for: [shell]
    if:
      type: text
      regex: '\bdd\b.{0,160}\bof[ \t]*=["'']?\S{1,160}'
  - id: android-dd-apk-temp-output
    attack: T1074.001
    mbc: E1074
    desc: Shell dd writes APK into Android temp
    crit: notable
    conf: 0.94
    platforms: [unix, android]
    for: [shell]
    if:
      type: text
      regex: '\bdd\b.{0,160}\bof[ \t]*=["'']?/data/local/tmp/\S{1,64}\.apk\b'
