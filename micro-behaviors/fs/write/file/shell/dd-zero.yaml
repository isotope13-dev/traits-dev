defaults:
  platforms: [unix, windows]
traits:
  - id: dd-zero-input-command
    desc: dd reads zeros as input
    crit: notable
    conf: 0.82
    for: [source, scripts, class, java_class]
    if:
      type: text
      regex: '["'']dd["''].{0,40}["'']if=/dev/zero["'']|\bdd\s+if=/dev/zero\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
