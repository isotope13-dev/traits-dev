defaults:
  platforms: [unix]
  for: [javascript]
  crit: notable
traits:
  - id: node-appends-home-profile-loop
    desc: Appends to home shell profile loop
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((for_in_statement
          left: (identifier) @profile
          operator: "of"
          right: (array (string (string_fragment) @rc))
          body: (statement_block
            (expression_statement
              (call_expression
                function: (member_expression
                  object: (identifier) @fs
                  property: (property_identifier) @append) @evidence
                arguments: (arguments . (call_expression
                  function: (member_expression
                    object: (identifier) @path
                    property: (property_identifier) @join)
                  arguments: (arguments
                    . (call_expression
                      function: (member_expression
                        object: (identifier) @os
                        property: (property_identifier) @home))
                    . (identifier) @used .)))))))
        (#eq? @fs "fs")
        (#eq? @append "appendFileSync")
        (#eq? @path "path")
        (#eq? @join "join")
        (#eq? @os "os")
        (#eq? @home "homedir")
        (#eq? @profile @used)
        (#match? @rc "^\\.(bashrc|zshrc|profile)$"))
