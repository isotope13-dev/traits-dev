defaults:
  platforms: [unix]
  for: [npm, tar, javascript, typescript]
composite_rules:
  - id: shell-startup-integration-write-clues
    desc: Shell startup filenames accompany writes and source commands
    crit: notable
    conf: 0.9
    scope: archive
    all:
      - id: micro-behaviors/fs/path/config/shell::shell-profile-rc-name
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
      - id: micro-behaviors/process/interpreter/eval/source::home-relative-source-command
