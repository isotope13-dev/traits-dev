defaults:
  crit: baseline
  conf: 0.66
  platforms: [unix]
  for: [c, cpp, rust, go, elf, macho]
traits:
  - id: fsync
    desc: Flushes file writes with fsync
    if:
      type: symbol
      exact: fsync
  - id: python-os-fsync
    desc: Python os.fsync descriptor flush
    for: [python]
    if:
      type: symbol
      kind: call
      exact: os.fsync
