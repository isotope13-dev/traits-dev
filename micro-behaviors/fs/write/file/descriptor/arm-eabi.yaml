defaults:
  platforms: [linux, android]
  for: [elf]
  arch: [arm]
  crit: notable
  conf: 0.95
traits:
  - id: arm-libc-write-syscall-forwarder
    desc: ARM libc write syscall argument forwarder
    if:
      type: hex
      section: .text
      # Shuffle fd/buffer/length into the cancellable syscall trampoline's
      # arguments, clear unused arguments, and select ARM Linux SYS_write=4.
      # The branch displacement and all paths are deliberately unpinned.
      pattern: "02 30 A0 E1 08 C0 8D E5 01 20 A0 E1 04 C0 8D E5 00 10 A0 E1 00 C0 8D E5 04 00 A0 E3 ?? ?? ?? EB"
