defaults:
  platforms: [macos, ios]
  for: [macho, dylib]
  mbc: C0052
traits:
  - id: nsfilehandle-seek
    desc: NSFileHandle seek to file offset
    crit: baseline
    conf: 0.6
    if:
      type: symbol
      regex: seekToFileOffset
composite_rules:
  - id: random-access-write
    desc: Random-access file writing (seek + write)
    crit: notable
    conf: 0.75
    all:
      - id: micro-behaviors/fs/write/file/handle::nsfilehandle-write
      - id: micro-behaviors/fs/write/file/descriptor::nsfilehandle-seek
