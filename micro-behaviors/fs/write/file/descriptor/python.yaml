defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-os-fdopen-write-mode
    desc: Python opens a file descriptor for writing
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: os.fdopen
      arg:
        kind: string
        regex: '^[wax][bt+]*$'
  - id: python-os-write-fd
    desc: Writes bytes through Python file descriptor
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: os.write
  - id: python-os-lseek-fd
    desc: Repositions Python file descriptor
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: os.lseek
  - id: python-file-truncate
    mbc: C0016
    desc: Truncate file (truncate())
    conf: 0.8
    if:
      type: text
      substr: .truncate(
