defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-os-fdopen-write-mode
    desc: Python opens a file descriptor for writing
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: os.fdopen
      arg:
        kind: string
        regex: '^[wax][bt+]*$'
  - id: python-os-write-fd
    desc: Writes bytes through Python file descriptor
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: os.write
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: python-os-lseek-fd
    desc: Repositions Python file descriptor
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: os.lseek
  - id: python-file-truncate
    crit: notable
    mbc: C0016
    desc: Truncate file (truncate())
    conf: 0.8
    if:
      type: string_literal
      regex: \.truncate\(
