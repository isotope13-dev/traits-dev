defaults:
  for: [dos_com]
  platforms: [windows, unix]

traits:
  # FCB record size is one byte and random record offset is zeroed.
  - id: dos-fcb-byte-record-zero-offset
    desc: DOS initializes byte-sized FCB records
    crit: notable
    if:
      type: hex
      pattern: "C7 45 0E 01 00 33 C0 89 45 21 89 45 23"

  # Copy the FCB file size to its random record field, then write a body.
  - id: dos-fcb-size-offset-random-write
    desc: DOS writes FCB records at file size
    crit: notable
    if:
      type: hex
      pattern: "8B 45 10 89 45 21 [0-24] B4 28 B9 ?? ?? CD 21"

  # Construct an entry marker followed by a relative jump displacement and
  # write those four bytes at FCB random record zero.
  - id: dos-fcb-entry-jump-write
    desc: DOS writes a constructed entry jump
    crit: notable
    if:
      type: hex
      pattern: "33 C0 89 45 21 8D 3C B8 4D E9 AB 58 AB [0-16] B4 28 B9 04 00 CD 21"
