defaults:
  platforms:
  - unix
  - windows
  for:
  - cfml
  crit: notable
  conf: 0.95
traits:
- id: cfml-java-file-output-stream
  desc: CFML creates FileOutputStream wrapper
  if:
    type: symbol
    kind: call
    exact: createobject
    args:
    - index: 0
      from:
        whole_value: (?i)^java$
    - index: 1
      from:
        whole_value: ^java\.io\.FileOutputStream$
