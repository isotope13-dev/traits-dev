defaults:
  platforms: [windows]
  for: [python, javascript, typescript, csharp, batch, vbs]

traits:
  - id: embedded-powershell-base64-write-all-bytes--rx-1
    desc: Base64-decode and binary-write method text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)FromBase64String[^\r\n]{0,240}WriteAllBytes\s*\('

  - id: embedded-powershell-base64-write-all-bytes--rx-2
    desc: Base64-decode and binary-write method text
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)WriteAllBytes[^\r\n]{0,240}FromBase64String\b'

composite_rules:
  - id: embedded-powershell-base64-write-all-bytes
    desc: Base64-decode and binary-write method text
    crit: notable
    conf: 0.95
    any:
      - id: embedded-powershell-base64-write-all-bytes--rx-1
      - id: embedded-powershell-base64-write-all-bytes--rx-2
