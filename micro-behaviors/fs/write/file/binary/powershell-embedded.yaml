defaults:
  platforms: [windows]
  for: [python, javascript, typescript, csharp, batch, vbs]

traits:
  - id: embedded-powershell-base64-write-all-bytes
    desc: Embedded PowerShell Base64 file write
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?is)\[Convert\]::FromBase64String\s*\(.{0,800}\[IO\.File\]::WriteAllBytes\s*\('
