defaults:
  for:
  - ruby
  platforms:
  - unix
  - windows
composite_rules:
- id: ruby-http-binary-write-launch-or-chmod
  desc: Ruby HTTP request and binary write near launch or chmod clue
  conf: 0.94
  crit: suspicious
  near_lines: 40
  unless:
  - id: well-known/lib/runtime/scripted/jruby/
  - id: well-known/lib/web/thor::actions-file-generator
  - id: well-known/lib/network/ruby-openuri::openuri-stdlib-module
  - id: well-known/lib/network/ruby-openuri::openuri-stdlib-meta
  - id: micro-behaviors/data/archive/extract/zip::ruby-unzip-helper-marker
  - id: well-known/lib/web/tina4ruby::tina4-module-declaration
  - id: well-known/lib/development/bundler::bundler-package-manager-context
  all:
  - id: micro-behaviors/communications/http/lib/netlib::request-ruby
  - id: micro-behaviors/fs/write/file/mode::ruby-file-open-write-binary
  any:
  - id: micro-behaviors/process/create/system::system-process-call
  - id: micro-behaviors/process/create/shell/lang::ruby-exec
  - id: micro-behaviors/fs/chmod/modify::ruby-chmod-method
  not:
  - regex: URI\.send\(:open,\s*source,\s*config\.fetch\(:http_headers
  - substr: URI.send(:open, source
  - substr: config.fetch(:http_headers, {})
  - substr: input.binmode.read
