defaults:
  for:
  - ruby
  platforms:
  - unix
  - windows
composite_rules:
- id: ruby-http-binary-write-launch-or-executable-chmod
  desc: Ruby HTTP binary write near process launch or executable chmod
  conf: 0.94
  crit: suspicious
  near_lines: 40
  unless:
  - id: well-known/lib/web/server/thor::actions-file-generator
  all:
  - id: micro-behaviors/communications/http/lib/netlib::request-ruby
  - id: micro-behaviors/fs/write/file/mode::ruby-file-open-write-binary
  any:
  - id: micro-behaviors/process/create/exec::system-process-call
  - id: micro-behaviors/process/replace::ruby-exec
  - id: micro-behaviors/fs/chmod/modify::ruby-chmod-call-with-octal-exec-mode
  - id: micro-behaviors/fs/chmod/modify::ruby-chmod-call-with-symbolic-exec-mode
  not:
  - regex: URI\.send\(:open,\s*source,\s*config\.fetch\(:http_headers
  - substr: URI.send(:open, source
  - substr: config.fetch(:http_headers, {})
  - substr: input.binmode.read
