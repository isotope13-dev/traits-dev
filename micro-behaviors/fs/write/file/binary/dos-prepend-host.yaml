defaults:
  for: [dos_com]
  platforms: [windows, unix]
traits:
  - id: dos-read-prepend-seek-write
    desc: DOS reads, seeks, and writes a file
    crit: notable
    if:
      type: hex
      pattern: 'B4 3F 8B D6 B9 ?? ?? CD 21 [0-20] 83 C0 ?? 50 2B C9 F7 E1 B4 42 CD 21 59 B4 40 5A 52 CD 21'
  - id: dos-copy-appended-host
    desc: Copies data past COM prefix to entry
    crit: notable
    if:
      type: hex
      pattern: '60 56 B5 FF 8B FE 83 C6 ?? F3 A4 A4'
