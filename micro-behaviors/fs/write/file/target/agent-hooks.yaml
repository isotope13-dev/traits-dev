# hooks.json, a filesystem write and a tool-hook key establish configuration
# mutation capability. They prove neither an npm lifecycle entrypoint nor
# unauthorized interception. Devflow's disclosed hook setup is a benign example.
# Preserve the original matcher/scope separately from the severity correction.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

composite_rules:
  - id: claude-tool-hooks-file-write-context
    desc: Claude hooks path and tool hook near file write
    conf: 0.85
    scope: file
    near_bytes: 4000
    all:
      - id: micro-behaviors/fs/path/agent-config/file::claude-hooks-json-path
      - id: metadata/file/profile/file-write-api::node-write-file-sync-call
    any:
      - id: micro-behaviors/communications/ipc/agent-hook::agent-pretooluse-hook
      - id: micro-behaviors/communications/ipc/agent-hook::agent-posttooluse-hook
      - id: micro-behaviors/communications/ipc/agent-hook::agent-pretooluse-hook-member
      - id: micro-behaviors/communications/ipc/agent-hook::agent-posttooluse-hook-member
  - id: node-write-global-agent-state-context
    desc: writeFileSync near a global agent instruction or state path
    conf: 0.88
    scope: file
    near_bytes: 1500
    all:
      - id: metadata/file/profile/file-write-api::node-write-file-sync-call
    any:
      - id: micro-behaviors/fs/path/agent-instructions::cursor-global-rules-path
      - id: micro-behaviors/fs/path/agent-instructions::claude-global-instructions-path
      - id: micro-behaviors/fs/path/agent-instructions::gemini-global-instructions-path
      - id: micro-behaviors/fs/path/agent-instructions::codex-global-instructions-path
      - id: micro-behaviors/fs/path/agent-config/directory::pi-global-agent-path
