defaults:
  for: [powershell]
  platforms: [windows]
traits:
- id: old-system32-template
  desc: References System32 path
  crit: component
  conf: 0.88
  attack: T1036
  unless:
  - id: well-known/tool/sysadmin/kubernetes
  if:
    type: text
    substr: '\system32'
- id: temp-exe-name
  desc: Builds temporary executable path
  crit: notable
  conf: 0.84
  if:
    type: symbol
    exact: GetTempFileName
