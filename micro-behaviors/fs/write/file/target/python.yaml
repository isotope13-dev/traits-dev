defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: write-exe
    crit: suspicious
    mbc: C0016
    desc: Write to .exe file
    conf: 0.9
    if:
      type: text
      regex: open\(\s*f?['"][^'"\r\n]{0,120}\.exe['"]\s*,\s*['"][wabtx+]{1,4}['"]
  - id: python-write-tmp
    crit: notable
    mbc: C0016
    desc: Write to /tmp directory
    conf: 0.85
    if:
      type: string_literal
      regex: open\(.{0,220}['"]?/tmp/
  - id: py-open-binary-path
    desc: Python open targets binary path
    crit: baseline
    conf: 0.82
    if:
      type: symbol
      kind: call
      exact: open
      arg:
        kind: string
        regex: '(?i)\.(exe|dll|so|dylib)$'
  - id: py-open-blob-path
    desc: Python open targets blob path
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: open
      arg:
        kind: string
        regex: '(?i)\.bin$'
  - id: py-open-script-path
    desc: Python open targets script path
    crit: baseline
    conf: 0.82
    if:
      type: symbol
      kind: call
      exact: open
      arg:
        kind: string
        regex: '(?i)\.(sh|py|ps1|js)$'
  - id: py-open-windows-script-path
    desc: Python open targets Windows script
    crit: baseline
    conf: 0.82
    if:
      type: symbol
      kind: call
      exact: open
      arg:
        kind: string
        regex: '(?i)\.(bat|cmd|vbs)$'
  - id: py-pathlib-binary-path
    desc: pathlib Path targets binary path
    crit: component
    conf: 0.82
    if:
      type: symbol
      kind: call
      exact: Path
      arg:
        kind: string
        regex: '(?i)\.(exe|dll|so|dylib)$'
  - id: py-pathlib-blob-path
    desc: pathlib Path targets blob path
    crit: component
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: Path
      arg:
        kind: string
        regex: '(?i)\.bin$'
  - id: py-pathlib-script-path
    desc: pathlib Path targets script path
    crit: component
    conf: 0.82
    if:
      type: symbol
      kind: call
      exact: Path
      arg:
        kind: string
        regex: '(?i)\.(sh|py|ps1|js)$'
  - id: py-pathlib-windows-script-path
    desc: pathlib Path targets Windows script
    crit: component
    conf: 0.82
    if:
      type: symbol
      kind: call
      exact: Path
      arg:
        kind: string
        regex: '(?i)\.(bat|cmd|vbs)$'
  - id: python-etc-passwd-open-write
    desc: Python opens /etc/passwd for writing
    crit: suspicious
    conf: 0.96
    if:
      type: tree-sitter
      kind: call
      regex: '\bopen\s*\(\s*["'']/etc/passwd["'']\s*,\s*["'']([wax][bt+]?|r[bt]?\+)["'']'
composite_rules:
  # `.bin` is deliberately NOT folded in here. It is a generic opaque-blob
  # extension -- key material, firmware images, cached DER, test fixtures --
  # not something an OS will execute, so counting it as an "executable path"
  # made every codegen script that dumps a blob and shells out read as a
  # payload drop. The blob atom stands on its own for rules that want it.
  - id: py-open-executable-path
    desc: Python open targets executable or script path
    crit: component
    conf: 0.82
    any:
      - id: micro-behaviors/fs/write/file/target::py-open-binary-path
      - id: micro-behaviors/fs/write/file/target::py-open-script-path
      - id: micro-behaviors/fs/write/file/target::py-open-windows-script-path
  - id: py-pathlib-executable-path
    desc: pathlib Path targets executable or script path
    crit: component
    conf: 0.82
    any:
      - id: micro-behaviors/fs/write/file/target::py-pathlib-binary-path
      - id: micro-behaviors/fs/write/file/target::py-pathlib-script-path
      - id: micro-behaviors/fs/write/file/target::py-pathlib-windows-script-path
