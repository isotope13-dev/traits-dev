defaults:
  platforms: [unix]
  for: [rust]
  crit: notable
  conf: 0.97
traits:
  - id: rust-appends-literal-ssh-key
    desc: Rust appends fixed key to authorized_keys
    if:
      type: tree-sitter
      language: rust
      query: |
        ((source_file
          (const_item name: (identifier) @key value: (string_literal (string_content) @keytext))
          (function_item body: (block
            (let_declaration pattern: (identifier) @auth
              value: (call_expression function: (field_expression field: (field_identifier) @join)
                arguments: (arguments . (string_literal (string_content) @keys) .)))
            (expression_statement (if_expression
              condition: (let_condition
                pattern: (tuple_struct_pattern (mut_pattern (identifier) @handle))
                value: (call_expression function: (field_expression
                  value: (call_expression function: (field_expression
                    value: (call_expression function: (field_expression
                      value: (call_expression function: (scoped_identifier) @new arguments: (arguments))
                      field: (field_identifier) @append) arguments: (arguments (boolean_literal) @append_true))
                    field: (field_identifier) @create) arguments: (arguments (boolean_literal) @create_true))
                  field: (field_identifier) @open)
                  arguments: (arguments . (reference_expression value: (identifier) @opened) .)))
              consequence: (block (let_declaration value: (macro_invocation macro: (identifier) @write
                (token_tree . (identifier) @handleuse . (string_literal) . (identifier) @keyuse)))))))))
          (#match? @keytext "^ssh-(ed25519|rsa) [A-Za-z0-9+/=]{12,}")
          (#eq? @join "join") (#eq? @keys "authorized_keys")
          (#match? @new "(^|::)OpenOptions::new$")
          (#eq? @append "append") (#eq? @create "create") (#eq? @open "open")
          (#eq? @append_true "true") (#eq? @create_true "true")
          (#eq? @auth @opened) (#eq? @handle @handleuse)
          (#eq? @write "writeln") (#eq? @key @keyuse))
