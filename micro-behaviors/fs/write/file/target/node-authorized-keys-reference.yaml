defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: authorized-keys-near-node-write
    desc: authorized_keys reference near Node file write
    crit: notable
    conf: 0.96
    unless:
      - id: well-known/tool/development/ci/cross-platform-actions::cross-platform-actions-context
      - id: well-known/tool/development/ci/cross-platform-actions::vm-ssh-bootstrap-source
      - id: well-known/tool/development/ci/cross-platform-actions::package-member-name
    if:
      type: text
      regex: "authorized_keys[^\\r\\n]{0,300}(appendFileSync|writeFileSync)"

