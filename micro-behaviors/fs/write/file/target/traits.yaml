# Neutral AI-agent configuration mutation capability. Objective traits compose
# this with approval bypasses or unattended install hooks before inferring
# security-control evasion or supply-chain intent.
defaults:
  crit: notable
traits:
  - id: writes-agent-skill-markdown
    platforms: [unix, windows]
    for: [javascript, typescript]
    desc: Writes an agent skill markdown file
    conf: 0.96
    if:
      type: text
      regex: 'writeFileSync\([^;\n]{0,160}SKILL\.md'
  # Published installers commonly stage the destination through a variable.
  # Keep the namespace signal separate so composites can pair it with a
  # structured filesystem-write atom instead of using a wide cross-file regex.
  - id: agent-skill-namespace
    platforms: [unix, windows]
    for: [javascript, typescript]
    desc: References an agent skill namespace
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(AGENT_SKILL_NAMESPACE|MCP_AGENT_SKILL_NAMESPACE)\b'
  # Local agent CLIs (Claude Code, Codex, PixelDirector, …) install a managed
  # Skill tree under ~/.agents|~/.claude|… — neutral capability. Hostile
  # websocket/obfuscated installers compose this with C2 legs in objectives/.
  - id: install-managed-skill-call
    platforms: [unix, windows]
    for: [javascript, typescript]
    desc: Managed agent skill install call
    conf: 0.95
    if:
      type: text
      word: installManagedSkill
  - id: hosts-file-append
    platforms: [unix, windows]
    for: [shell, batch, powershell, python]
    desc: Appends an entry to system hosts file
    conf: 0.92
    if:
      type: text
      regex: '(>>|tee\s+-a)[^\n]{0,40}etc[\\/]+hosts([^.A-Za-z0-9_]|$)'
  - id: hosts-file-cmdlet-write
    platforms: [unix, windows]
    desc: Writes system hosts file with a cmdlet
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(Add-Content|Out-File)[^\n]{0,60}etc[\\/]+hosts([^.A-Za-z0-9_]|$)'
  - id: hosts-file-python-write
    platforms: [unix, windows]
    desc: Python opens system hosts file for writing
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: 'open\([^)]{0,40}etc[\\/]+hosts["''][^)]{0,12}["''][aw]'
  - id: hosts-file-edit
    platforms: [unix, windows]
    desc: Edits system hosts file with sed
    conf: 0.92
    for: [shell, python]
    if:
      type: text
      regex: 'sed\s+-i[^\n]{0,60}etc[\\/]+hosts([^.A-Za-z0-9_]|$)'
  - id: users-public-path
    attack: T1074.001
    mbc: E1074
    conf: 0.8
    platforms: [windows]
    desc: Users\Public staging directory
    for: [javascript, batch, powershell]
    if:
      type: text
      regex: '(?i)(download|copy|write).{0,80}Users[\\\\/]+Public[\\\\/]'
  - id: users-public-path-utf16
    attack: T1074.001
    mbc: E1074
    conf: 0.8
    platforms: [windows]
    desc: Users\Public staging path (UTF-16)
    for: [javascript]
    if:
      type: text
      regex: "U\\x00s\\x00e\\x00r\\x00s\\x00.\\x00.\\x00P\\x00u\\x00b\\x00l\\x00i\\x00c"
  - id: java-dot-out-file-write
    platforms: [windows, unix]
    desc: Java writes a dot-out file
    conf: 0.96
    for: [java]
    if:
      type: text
      regex: 'Files\.write\s*\(\s*(Paths\.get|Path\.of)\s*\([^)]{0,200}["'']\.out["'']'
  - id: encrypted-suffix-output
    platforms: [windows, unix]
    for: [source, scripts]
    desc: File output uses distinctive encrypted suffix
    conf: 0.94
    if:
      type: text
      case_insensitive: true
      regex: '\b(write\w*|open|ofstream)\s*\([^;\n(]{0,160}["''`]\.(encrypted|locked|crypt|encrt)["''`]'
composite_rules:
  # Pair the namespace with an actual write/move operation. This catches both
  # bundled and MCP-fed skill installers without treating a namespace constant
  # alone as a filesystem mutation.
  - id: writes-agent-skill-tree
    platforms: [unix, windows]
    for: [javascript, typescript]
    desc: Writes files into an agent skill tree
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/fs/write/file/target::agent-skill-namespace
    any:
      - id: micro-behaviors/fs/write/file/full::write-file-call-target
      - id: micro-behaviors/fs/write/file/full::node-fs-promises-write-file
      - id: micro-behaviors/fs/file/rename::fs-promises-rename
    near_bytes: 12000
  - id: agent-config-file-mutation
    platforms: [unix, windows]
    for: [shell, python, javascript]
    desc: Writes or copies an AI agent configuration file
    conf: 0.93
    scope: file
    all:
      - id: micro-behaviors/fs/path/agent-config/file::ai-agent-config-file-target
    any:
      # Spelled out rather than as the parent directory: this rule now lives
      # under it, and a directory leg would expand to include itself.
      - id: micro-behaviors/fs/write/file/full
      - id: micro-behaviors/fs/write/file/handle
      - id: micro-behaviors/fs/write/file/append
      - id: micro-behaviors/fs/write/file/stream
      - id: micro-behaviors/fs/write/file/copy
      - id: micro-behaviors/fs/file/copy::shutil-copy
    # Associate the target with its actual write/copy operation rather than an
    # unrelated temporary-file write elsewhere in the same source file.
    near_lines: 80
  # Some installers construct a config directory first and only later join
  # the concrete filename (`join(home, ".codex")`, then
  # `join(codexDir, "config.toml")`). Requiring both Claude and Codex paths
  # keeps this global-agent signal distinct from project-local skill tooling.
  - id: ai-agent-config-directory-write
    platforms: [unix, windows]
    for: [shell, python, javascript]
    desc: Writes or copies files in Claude and Codex config directories
    crit: notable
    conf: 0.93
    scope: file
    all:
      - id: micro-behaviors/fs/path/agent-config/directory::ai-coding-tool-config-directory-cluster
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/path/agent-config/directory::codex-config-directory
    any:
      - id: micro-behaviors/fs/write/file/full
      - id: micro-behaviors/fs/write/file/handle
      - id: micro-behaviors/fs/write/file/append
      - id: micro-behaviors/fs/write/file/stream
      - id: micro-behaviors/fs/file/copy::js-copyfile-sync-import
    near_lines: 120
  - id: hosts-file-write
    platforms: [unix, windows]
    for: [shell, batch, powershell, python]
    desc: Writes an entry into system hosts file
    conf: 0.94
    any:
      - id: hosts-file-append
      - id: hosts-file-cmdlet-write
      - id: hosts-file-python-write
      # In-place `sed -i` is a write like any other; leaving it out meant an
      # edited entry counted as a hosts write only in the three spellings above.
      - id: hosts-file-edit
