# Observations classified by required evidence.
traits:
- id: sed-bashrc-edit
  desc: Sed edits shell startup file in place
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: sed\s+-i.{0,50}\.bashrc
  unless:
  - id: objectives/evasion/self-delete/process::installer-shell-profile-marker-cleanup
- id: sed-bash-profile-edit
  desc: Sed edits shell startup file in place
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: sed\s+-i.{0,50}\.bash_profile
  unless:
  - id: objectives/evasion/self-delete/process::installer-shell-profile-marker-cleanup
- id: sed-profile-edit
  desc: Sed edits shell startup file in place
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: sed\s+-i.{0,50}\.profile
  unless:
  - id: objectives/evasion/self-delete/process::installer-shell-profile-marker-cleanup
defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - elf
  - shell
