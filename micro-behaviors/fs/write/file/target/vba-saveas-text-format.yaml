# Saving the open document as plain text writes its body, including any
# text hidden in it, to a new file.
defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  crit: notable
  conf: 0.92

traits:
  - id: vba-document-saveas-plain-text
    desc: Saves the document body as plain text
    if:
      type: text
      regex: '(?i)\.SaveAs2?\b[^\r\n]{0,160}FileFormat\s*:=\s*(wdFormatText|wdFormatDOSText)\b'
