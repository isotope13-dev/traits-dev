defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: rendered-agent-config-write
    desc: Writes freshly rendered agent configuration
    conf: 0.96
    if:
      type: tree-sitter
      kind: call
      regex: '\bwriteFileSync\([^,]{1,100},\s*render[\w]*(Codex|Agent)[\w]*Config[\w]*\(\)'
