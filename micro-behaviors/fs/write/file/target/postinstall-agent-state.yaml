# Neutral evidence retained from the objective placement review.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - npm
  - tar
  - zip
  - whl
  - python-sdist
composite_rules:
- id: node-postinstall-and-global-agent-write-context
  desc: Node postinstall and agent-state writer coexist
  crit: notable
  conf: 0.9
  scope: archive
  for:
  - npm
  - tar
  - zip
  - package.json
  - javascript
  - typescript
  all:
  - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
  - id: micro-behaviors/fs/write/file/target::node-write-global-agent-state-context
  unless:
  - id: well-known/tool/detection/agent-glovebox::archive-context
  - id: metadata/package/scaffold::agent-rules-distribution-context
  - id: metadata/package/description/function::description-ai-coding-harness
  - id: metadata/package/description/function::description-ai-coding-orchestrator
  - id: well-known/app/ai/coding-agent/0xray::archive-context
  - id: well-known/app/ai/coding-agent/0xray::consumer-bridge-postinstall-marker
  - id: well-known/app/ai/coding-agent/kendex-pi-extension::archive-context

# Unlike archive pooling, this requires an import-time instruction-file write
# in the same module as the global-agent scope. It says nothing about an npm
# hook reaching that module. A script can legitimately configure an agent, so
# this boundary-changing behavior is suspicious rather than hostile.
- id: module-level-global-agent-instruction-write
  desc: Module-level instruction write near global path
  crit: suspicious
  conf: 0.93
  scope: file
  for: [javascript, typescript]
  near_bytes: 1500
  all:
    - id: micro-behaviors/fs/write/file/target::module-level-project-instruction-write
  any:
    - id: micro-behaviors/fs/path/agent-instructions::cursor-global-rules-path
    - id: micro-behaviors/fs/path/agent-instructions::claude-global-instructions-path
    - id: micro-behaviors/fs/path/agent-instructions::gemini-global-instructions-path
    - id: micro-behaviors/fs/path/agent-instructions::codex-global-instructions-path
    - id: micro-behaviors/fs/path/agent-instructions::pi-global-agent-path
