defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: write-node-modules-directory
    desc: Writes a file under node_modules
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: '(writeFile|writeFileSync|appendFile)\s*\(.{0,220}node_modules'
  - id: js-authorized-keys-variable-write
    desc: Node writes via authorized_keys path variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "(appendFile(Sync)?|writeFile(Sync)?)\\s*\\(\\s*(authKeys|authorizedKeys)\\w*"
  - id: node-writes-javascript-path
    desc: Node writes a JavaScript file path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'writeFileSync\s*\([^)]{0,180}\.m?js["'']'
  - id: node-writes-script-js
    desc: Node writes a script.js file
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: 'writeFile(Sync)?\s*\(\s*["''][^"'']{0,160}\bscript\.js["'']'
  - id: node-writes-wrapper-file
    desc: Node writes a wrapper file
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'fs\.writeFileSync\(\s*wrapperPath'
  - id: node-writes-hosts-path
    desc: Node writes to hosts file
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)(writeFile|appendFile)\w*\([^)\n]{0,60}etc[/\\]hosts'
  - id: node-writes-hosts-stream
    desc: Node creates write stream to hosts file
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)createWriteStream\s*\([^)\n]{0,60}etc[/\\]hosts'
  - id: node-writes-hosts-variable
    desc: Node writes to hosts path variable
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '(?i)(writeFile|appendFile)\w*\(\s*hosts[_\w]*\b'
composite_rules:
  - id: js-etc-hosts-write
    desc: Writes to /etc/hosts via Node.js
    crit: suspicious
    conf: 0.9
    attack: T1562.006
    any:
      - id: node-writes-hosts-path
      - id: node-writes-hosts-stream
      - id: node-writes-hosts-variable
