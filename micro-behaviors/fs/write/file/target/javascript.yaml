defaults:
  for: [javascript, typescript]
traits:
  - id: write-node-modules-directory
    platforms: [windows, unix]
    desc: Writes a file under node_modules
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: '(writeFile|writeFileSync|appendFile)\s*\(.{0,220}node_modules'
  - id: js-authorized-keys-variable-write
    platforms: [windows, unix]
    desc: Node writes via authorized_keys path variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "(appendFile(Sync)?|writeFile(Sync)?)\\s*\\(\\s*(authKeys|authorizedKeys)\\w*"
  - id: node-writes-javascript-path
    platforms: [unix, windows]
    desc: Node writes a JavaScript file path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'writeFileSync\s*\([^)]{0,180}\.m?js["'']'
  - id: node-temp-script-path
    platforms: [unix, windows]
    desc: Temporary script.js path
    crit: notable
    conf: 0.82
    if:
      type: text
      word: script.js
  - id: etc-hosts-literal
    platforms: [unix, windows]
    desc: References /etc/hosts path
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      exact: /etc/hosts
  - id: js-windows-hosts-path
    platforms: [unix, windows]
    desc: Windows hosts file path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(system32[\\/].{0,24}drivers[\\/].{0,24}etc[\\/]hosts|drivers[\\/]+etc[\\/]hosts)'
  - id: node-writes-wrapper-file
    platforms: [unix, windows]
    desc: Node writes a wrapper file
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'fs\.writeFileSync\(\s*wrapperPath'
composite_rules:
  - id: js-etc-hosts-write
    platforms: [unix, windows]
    desc: Writes to /etc/hosts via Node.js
    crit: suspicious
    conf: 0.9
    attack: T1562.006
    # Keep the write API and hosts path close together. A bundled @types/node
    # declaration can contain both writeFileSync() and documentation
    # mentioning /etc/hosts, but that is not a write operation.
    near_bytes: 128
    all:
      - id: micro-behaviors/fs/write/file/full::js-file-write
    any:
      - id: micro-behaviors/fs/write/file/target::etc-hosts-literal
      - id: micro-behaviors/fs/write/file/target::js-windows-hosts-path
