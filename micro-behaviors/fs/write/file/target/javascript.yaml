defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  # A hidden FILE (dotfile basename), not a write under a hidden directory
  # such as /home/runner/.copilot/mcp-config.json on GitHub Actions runners.
  - id: fs-append-hidden
    desc: Writes an absolute hidden file
    crit: suspicious
    conf: 0.75
    attack: T1564.001
    if:
      type: text
      regex: fs\.(appendFile|writeFile)Sync?\(["'](/|[A-Za-z]:)[^"']{0,48}[\\/]\.[^"'/]{1,40}["']
      not:
        - regex: '[-_.](probe|ready)["'']'

  - id: write-node-modules-directory
    desc: Writes a file under node_modules
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      regex: '(writeFile|writeFileSync|appendFile)\s*\(.{0,220}node_modules'
  - id: js-authorized-keys-variable-write
    desc: Writes via authKeys/authorizedKeys variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "(appendFile(Sync)?|writeFile(Sync)?)\\s*\\(\\s*(authKeys|authorizedKeys)\\w*"
  - id: node-writes-authorized-keys
    desc: Node.js writes to an authorized_keys path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(appendFile|writeFile|appendFileSync|writeFileSync)\s*\(.{0,200}authorized_keys'
  - id: node-writes-javascript-path
    desc: Node writes a JavaScript file path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'writeFileSync\s*\([^)]{0,180}\.m?js["'']'
  - id: node-writes-script-js
    desc: Node writes a script.js file
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: 'writeFile(Sync)?\s*\(\s*["''][^"'']{0,160}\bscript\.js["'']'
  - id: node-writes-wrapper-file
    desc: Node writes a wrapper file
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'fs\.writeFileSync\(\s*wrapperPath'
  - id: node-writes-hosts-variable
    desc: Node write targets hosts-named variable
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)(writeFile|appendFile)\w*\(\s*hosts(_?(path|file|dest|target|filepath))\b'
    # Shipped package tests deliberately pass a temporary hosts-file path to
    # exercise synchronization; the variable name does not make that path the
    # system hosts file.
    unless:
      - id: metadata/package/testing/
composite_rules:
  - id: js-etc-hosts-write
    desc: Node hosts-path or named-variable write
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/fs/write/file/hosts::node-writes-hosts-path
      - id: node-writes-hosts-variable
