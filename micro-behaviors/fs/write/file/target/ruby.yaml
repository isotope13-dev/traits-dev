defaults:
  crit: notable
  for: [ruby]
  platforms: [unix, windows]
traits:
  # Ruby native-extension recipes normally emit their Makefile through mkmf's
  # create_makefile; hand-writing the file is the shape used both by gems that
  # stub out an optional extension and by install-time droppers that only need
  # `gem install` to succeed. Neutral on its own -- intent comes from what else
  # the recipe does.
  - id: ruby-makefile-write
    desc: Ruby writes a Makefile to disk
    conf: 0.9
    if:
      type: text
      regex: '\bFile\.(open|write)\s*\(\s*([''"]Makefile[''"]|File\.join\([^)]{0,120}[''"]Makefile[''"]\))'
  - id: tmp-slash-string
    desc: /tmp/ directory path
    conf: 0.7
    if:
      id: micro-behaviors/fs/path/temp::temp-tmp
  - id: file-open-tmp-string
    desc: File.open to /tmp/ path
    conf: 0.85
    if:
      type: text
      substr: File.open(/tmp/
composite_rules:
  - id: ruby-file-write-tmp
    desc: Write file to /tmp directory
    conf: 0.9
    any:
      - id: micro-behaviors/fs/write/file/target::tmp-slash-string
      - id: micro-behaviors/fs/write/file/target::file-open-tmp-string
