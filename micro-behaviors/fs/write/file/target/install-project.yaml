# Archive-wide co-occurrence is setup context, not proof of hostile rewriting.
defaults:
  platforms: [unix, windows]
  for: [npm, tar, package.json, javascript, typescript]
  crit: notable
  conf: 0.9

composite_rules:
  - id: install-hook-project-write-context
    desc: Install hook, INIT_CWD read and project write co-occur
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/os/env/read::npm-init-cwd-read
      - id: micro-behaviors/fs/write/file/full::node-project-file-atomic-write

  - id: install-hook-agent-git-artifact-context
    desc: Install project writes accompany agent and Git hook paths
    scope: archive
    all:
      - id: install-hook-project-write-context
      - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
      - id: micro-behaviors/fs/path/agent-config/directory::claude-skills-directory
      - id: micro-behaviors/fs/path/vcs::pre-push-hook-name-reference
