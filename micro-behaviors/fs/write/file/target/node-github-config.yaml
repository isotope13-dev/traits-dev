defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  # A writer variable named workflowPath proves neither the destination nor an
  # install trigger. Bind the destination argument to a .github path component,
  # including paths assembled with nested joins. This is also ordinary setup
  # functionality; lifecycle and reporting evidence belong in its consumers.
  - id: node-writes-github-config-path
    desc: Node write targets a .github configuration path
    if:
      type: symbol
      kind: call
      regex: '(^|\.)writeFileSync$'
      arg:
        index: 0
        from:
          value: '(^|[\\/])\.github([\\/]|$)'
          through:
            - call: '^(path\.)?(join|resolve)$'
              arguments: [0, 1, 2, 3, 4]
