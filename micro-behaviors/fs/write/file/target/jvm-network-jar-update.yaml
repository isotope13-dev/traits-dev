defaults:
  platforms: [unix, windows]
  for: [class]
composite_rules:
  # References coexist in one class; the rule does not prove data flow or
  # that a received update is authenticated or malicious.
  - id: fabric-payload-jar-replacement-api-set
    desc: Fabric payload, Base64, JAR write and cleanup references
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/transfer::fabric-client-payload-send
      - id: micro-behaviors/data/parse/json::gson-json-parser-class
      - id: micro-behaviors/fs/delete/file/deferred::java-jar-write-shutdown-delete-api-set
  - id: fabric-update-chunk-jar-write-indicators
    desc: Fabric payload, update chunk and JAR write references co-occur
    crit: notable
    conf: 0.9
    all:
      - id: metadata/binary/symbols/name/token::jvm-update-chunk-handler-name
      - id: fabric-payload-jar-replacement-api-set
