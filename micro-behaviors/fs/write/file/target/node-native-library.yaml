# A library destination is an I/O capability. A .so mentioned in the DATA
# argument (for example a PAM policy) does not make the destination a library.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: node-writes-native-library-path
    desc: Node writes a DLL or SO destination
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(writeFile(Sync)?|createWriteStream)$'
      arg:
        index: 0
        kind: string
        regex: '(?i)\.(dll|so)(\.[0-9.]+)?$'
