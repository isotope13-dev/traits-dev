# A call to a local helper containing an instruction path and a writer is
# stronger evidence than an uninvoked setup function. This is lexical call
# evidence, not a complete reachability proof. Direct expression statements,
# top-level conditionals and ordinary setup-function bodies are covered.
# Dynamic dispatch, nested callbacks and aliases remain outside this query.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: calls-project-instruction-writer-helper
    desc: Calls project instruction writer helper
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        ((program
          (function_declaration
            name: (identifier) @helper
            body: (statement_block) @body)
          (expression_statement (call_expression function: (identifier) @called)) )
          (#eq? @helper @called)
          (#match? @body "(CLAUDE|AGENTS|GEMINI)\\.md|copilot-instructions\\.md|\\.(cursor|cline|windsurf)rules|\\.mdc")
          (#match? @body "writeFileSync"))

        ((program
          (expression_statement (call_expression function: (identifier) @called))
          (function_declaration
          name: (identifier) @helper
          body: (statement_block) @body) )
          (#eq? @helper @called)
          (#match? @body "(CLAUDE|AGENTS|GEMINI)\\.md|copilot-instructions\\.md|\\.(cursor|cline|windsurf)rules|\\.mdc")
          (#match? @body "writeFileSync"))
        ((program
          (function_declaration
            name: (identifier) @helper
            body: (statement_block) @body)
          (if_statement consequence: (statement_block (expression_statement (call_expression function: (identifier) @called)))) )
          (#eq? @helper @called)
          (#match? @body "(CLAUDE|AGENTS|GEMINI)\\.md|copilot-instructions\\.md|\\.(cursor|cline|windsurf)rules|\\.mdc")
          (#match? @body "writeFileSync"))
        ((program
          (if_statement consequence: (statement_block (expression_statement (call_expression function: (identifier) @called))))
          (function_declaration
          name: (identifier) @helper
          body: (statement_block) @body) )
          (#eq? @helper @called)
          (#match? @body "(CLAUDE|AGENTS|GEMINI)\\.md|copilot-instructions\\.md|\\.(cursor|cline|windsurf)rules|\\.mdc")
          (#match? @body "writeFileSync"))
        ((program
          (function_declaration
            name: (identifier) @helper
            body: (statement_block) @body)
          (function_declaration body: (statement_block (expression_statement (call_expression function: (identifier) @called)))) )
          (#eq? @helper @called)
          (#match? @body "(CLAUDE|AGENTS|GEMINI)\\.md|copilot-instructions\\.md|\\.(cursor|cline|windsurf)rules|\\.mdc")
          (#match? @body "writeFileSync"))
        ((program
          (function_declaration body: (statement_block (expression_statement (call_expression function: (identifier) @called))))
          (function_declaration
          name: (identifier) @helper
          body: (statement_block) @body) )
          (#eq? @helper @called)
          (#match? @body "(CLAUDE|AGENTS|GEMINI)\\.md|copilot-instructions\\.md|\\.(cursor|cline|windsurf)rules|\\.mdc")
          (#match? @body "writeFileSync"))

  - id: module-level-project-instruction-write
    desc: Writes agent instructions at module level
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)writeFileSync$'
      module_level: true
      arg:
        index: 0
        from:
          value: '(CLAUDE|AGENTS|GEMINI)\.md$|copilot-instructions\.md$|\.(cursor|cline|windsurf)rules$|\.mdc$'
          through:
            - call: '^(path\.)?(join|resolve)$'
              arguments: [0, 1, 2, 3, 4]
