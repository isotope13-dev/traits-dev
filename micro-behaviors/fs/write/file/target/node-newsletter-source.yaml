defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: node-writes-newsletter-timer-module
  desc: Writes newsletter-timer source to library path
  conf: 0.98
  if:
    type: symbol
    kind: call
    regex: (^|\.)writeFileSync$
    args:
    - index: 0
      from:
        call: ^(path\.)?join$
        argument: 1
        literal: ^lib$
    - index: 1
      from:
        value: setTimeout\([\s\S]{0,1200}newsletter\w*Query\(
