defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  # The path reference need not be a write or a credential in that directory.
  - id: postinstall-temp-package-credential-path-cleanup
    desc: Install hook stages package and references auth config
    crit: suspicious
    conf: 0.96
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: micro-behaviors/fs/write/file/target::postinstall-temporary-package-manifest
      - id: micro-behaviors/fs/write/file/target::postinstall-random-name-manifest-template
      - id: micro-behaviors/fs/path/secret-config::npm-script-auth-config-dotfile
      - id: micro-behaviors/fs/delete/directory::postinstall-removes-variable-directory
  - id: postinstall-parent-read-temp-package
    desc: Install hook reads parent and stages package
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/fs/read/file/target::postinstall-parent-relative-read-command
      - id: micro-behaviors/fs/write/file/target::postinstall-temporary-package-manifest
      - id: micro-behaviors/fs/write/file/target::postinstall-random-name-manifest-template
