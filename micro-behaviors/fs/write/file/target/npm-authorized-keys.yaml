defaults:
  platforms: [unix]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: postinstall-tmp-marker-command
    desc: Postinstall targets a /tmp marker file
    platforms: [unix, windows]
    # A marker name alone proves no testing purpose or harmlessness: a hook
    # may redirect actual private-key contents into the same named output.
    if:
      type: value
      path: scripts.postinstall
      regex: '(>|touch) /tmp/[A-Za-z0-9_-]{0,24}marker[A-Za-z0-9_-]{0,40}'

  - id: postinstall-authorized-keys-append
    desc: Postinstall echo appends SSH authorized_keys
    if:
      type: value
      path: scripts.postinstall
      regex: '(^|[;&|]) *echo [''"][^''"]{1,200}[''"] *>> *~/.ssh/authorized_keys\b'
    unless:
      - id: metadata/package/testing/harness/benchmark::adversarial-benchmark-corpus
      - id: metadata/file/naming::test-directory-component

  - id: postinstall-ed25519-key-append
    desc: Postinstall appends quoted Ed25519 key text
    # Require a complete Base64-sized token, its closing shell quote and the
    # following trust-store redirect. An unrelated key printed elsewhere in
    # the script cannot upgrade a placeholder append into a backdoor.
    if:
      type: value
      path: scripts.postinstall
      regex: 'ssh-ed25519 [A-Za-z0-9+/]{68}( [^"''\n]{0,40})?["''] *>> *~/.ssh/authorized_keys'

  - id: postinstall-ed25519-key-line-attempt
    desc: Postinstall appends Ed25519 SSH key line
    for: [npm]
    if:
      type: value
      path: npm.scripts.postinstall
      regex: 'ssh-ed25519 [A-Za-z0-9+/=_-]{1,100}( [^"''\n]{0,40})?["''] *>> *~/.ssh/authorized_keys'

  - id: postinstall-ssh-directory-create
    desc: Postinstall creates SSH configuration directory
    for: [npm]
    if:
      type: value
      path: npm.scripts.postinstall
      substr: 'mkdir -p ~/.ssh'

