defaults:
  platforms: [unix]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: postinstall-authorized-keys-append
    desc: Postinstall echo appends SSH authorized_keys
    if:
      type: value
      path: scripts.postinstall
      regex: '(^|[;&|]) *echo [''"][^''"]{1,200}[''"] *>> *~/.ssh/authorized_keys\b'
  - id: postinstall-ed25519-key-line-attempt
    desc: Postinstall appends Ed25519 SSH key line
    for: [npm]
    if:
      type: value
      path: npm.scripts.postinstall
      regex: 'ssh-ed25519 [A-Za-z0-9+/=_-]{1,100}( [^"''\n]{0,40})?["''] *>> *~/.ssh/authorized_keys'

  - id: postinstall-ssh-directory-create
    desc: Postinstall creates SSH configuration directory
    for: [npm]
    if:
      type: value
      path: npm.scripts.postinstall
      substr: 'mkdir -p ~/.ssh'
