# Reports the supported capability or configuration without inferring hostile intent.
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - pe
  - elf
  - macho
  - c
  - python
  - lua
traits:
- id: executable-suffix-write-bytes-cooccurrence
  desc: Executable suffix and byte-write call co-occur
  crit: notable
  conf: 0.9
  for:
  - c
  - python
  - lua
  if:
    type: text
    regex: (?i)\.(exe|dll|so)\b.{0,96}\bwrite_bytes\s*\(\s*\S
    not:
    - regex: (?i)write_bytes\s*\(\s*b["']
  unless:
  - type: path
    regex: (?i)(^|[\\/])(tests?|testdata|fixtures?)([\\/]|$)|(^|[\\/])test[-_][^\\/]+\.py$
  - type: path
    regex: (?i)\.test\.py$|(^|[\\/])[^\\/]+_test\.py$
