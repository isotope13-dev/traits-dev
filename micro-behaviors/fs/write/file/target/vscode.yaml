composite_rules:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - vsix
  id: vscode-host-paths-with-file-write
  desc: VS Code host paths co-occur with file writes
  crit: notable
  conf: 0.85
  scope: archive
  all:
  - id: micro-behaviors/fs/path/application/bundle::vscode-application-root-access
  - id: micro-behaviors/fs/path/application/bundle::vscode-host-main-file-reference
  - id: micro-behaviors/fs/path/application/bundle::vscode-host-workbench-file-reference
  - id: metadata/file/profile/file-write-context::js-file-write
  any:
  - id: micro-behaviors/fs/file/copy/call::js-exists-and-copy
  - id: micro-behaviors/fs/delete/directory::fs-rm-recursive
