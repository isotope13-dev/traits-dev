defaults:
  for: [powershell]
  platforms: [windows]
composite_rules:
- id: dropped-executable-with-timestomp
  desc: Drops executable and copies timestamps
  crit: suspicious
  conf: 0.95
  attack: T1070.006
  all:
  - id: micro-behaviors/fs/write/file/full::write-all-bytes-ungated
  - id: micro-behaviors/fs/file/timestamp::powershell-dotnet-set-file-time
  any:
  - id: micro-behaviors/fs/path/system::system32-path-reference
  - id: micro-behaviors/fs/write/file/target::temp-exe-name
