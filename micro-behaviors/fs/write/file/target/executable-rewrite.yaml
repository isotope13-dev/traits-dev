defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - pe
  - elf
  - macho
  - c
  - python
  - lua
traits:
- id: executable-suffix-pwrite
  desc: Pwrite targets executable suffix
  crit: notable
  conf: 0.9
  for:
  - c
  - python
  - lua
  if:
    type: text
    regex: (?i)\bpwrite\s*\([^;\n]{0,120}\.(exe|dll|so)\b
composite_rules:
- id: executable-image-byte-rewrite
  desc: Executable image byte-writing references
  crit: notable
  conf: 0.92
  any:
  - id: micro-behaviors/fs/write/file/target::executable-suffix-write-bytes-cooccurrence
  - id: executable-suffix-pwrite
