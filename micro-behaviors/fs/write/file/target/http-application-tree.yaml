# Reports the supported capability or configuration without inferring hostile intent.
defaults:
  platforms:
  - unix
  for:
  - shell
  - python
  - javascript
  - typescript
  - text
  - json
traits:
- id: http-download-application-tree
  desc: HTTP download into an application directory
  conf: 0.9
  if:
    type: text
    regex: \b(curl|wget)[^|\n]{0,80}\s-\w*[oO]\s/(opt|usr/(src|lib/node_modules)|app/data)/\S{2,120}
  not:
  - regex: /opt/[^/\s]+(\s|$)
  - regex: /opt/(local/|homebrew/)?(bin|lib)/|/opt/cache/bin/|/opt/(azure|aws|cni|kubectl|helm)/
  - regex: /opt/(go|rust|cargo|node|java|jdk|python)[0-9.]*/bin/
  - regex: (?i)/(vmlinu[xz]|kernel)\b
  - regex: (?i)\.(ext[234]|raw|qcow2?|vmdk|iso|img)\b
  - substr: .tar.gz
  - regex: (?i)\.(conf|ini|ya?ml|toml|json|jsonc|txt|md|crt|pem|key|pub|cfg)\b
  - regex: (?i)\.(tar|zip)\b
  - regex: (?i)\.(deb|rpm)\b
  unless:
  - id: metadata/package/tooling::proxmoxve-community-scripts
  - id: metadata/package/tooling::azure-agentbaker-tree
  - id: metadata/package/tooling::netris-agent-installer
  - id: well-known/app/media/photoprism::photoprism-source-tree-path
  - id: micro-behaviors/crypto/hash/digest::digest-mismatch-diagnostic
  - id: micro-behaviors/crypto/hash/file::sha256sum-check-command-text
  crit: notable
