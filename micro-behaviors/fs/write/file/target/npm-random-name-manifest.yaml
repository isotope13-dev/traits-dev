defaults:
  platforms: [unix]
  for: [package.json]
traits:
  - id: postinstall-random-name-manifest-template
    desc: Install hook writes randomized name template
    crit: notable
    conf: 0.97
    # The first name-format argument is an OpenSSL random substitution and
    # the same command redirects to package.json. This records the template,
    # not successful shell expansion, valid JSON, authentication or publication.
    if:
      type: value
      path: scripts.postinstall
      regex: '"name":"[^"]*%s[^'']*'' "\$\(openssl rand --?hex[^)]+\)"[^;]*>[^;]*package\.json'
