defaults:
  platforms:
  - windows
  - unix
  for:
  - dos_com
  - data
  size_max: 65536

composite_rules:
  - id: dos-boot-path-update-write-context
    desc: DOS boot path with update writes
    crit: notable
    conf: 0.99
    for: [dos_com]
    all:
      - id: micro-behaviors/fs/path/config/boot::dos-boot-file-drive-path
      - id: micro-behaviors/fs/file/open::dos-open-update-int
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write
