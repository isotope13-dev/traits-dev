traits:
  - id: go-dd-large-dynamic-output
    desc: Go dd zero-fills a dynamic destination
    crit: notable
    conf: 0.95
    for: [go]
    platforms: [unix]
    if:
      type: symbol
      kind: call
      exact: exec.Command
      arg:
        index: 2
        from:
          value: '^of=$'
      args:
        - index: 0
          exact: dd
        - index: 1
          exact: if=/dev/zero
        - index: 3
          exact: bs=1M
        - index: 4
          regex: '^count=[1-9][0-9]{2,}$'
        - index: 5
          exact: oflag=direct
        - index: 6
          exact: conv=notrunc
