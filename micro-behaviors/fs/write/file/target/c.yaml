defaults:
  crit: suspicious
  platforms: [unix]
  for: [c, html]
traits:
  - id: hidden-inetd-config-path
    desc: Hidden inetd config path
    conf: 0.9
    if:
      type: text
      substr: /tmp/.ind
  - id: inetd-shell-config-line
    desc: inetd shell config line
    conf: 0.95
    if:
      type: text
      regex: 5002\s+stream\s+tcp\s+nowait\s+root\s+/bin/sh\s+sh
composite_rules:
  - id: inetd-shell-config-source
    desc: Writes inetd shell config
    conf: 0.97
    all:
      - id: micro-behaviors/fs/write/file/target::hidden-inetd-config-path
      - id: micro-behaviors/fs/write/file/target::inetd-shell-config-line
    any:
      - id: micro-behaviors/fs/write/file/append::fopen-hidden-temp-append
