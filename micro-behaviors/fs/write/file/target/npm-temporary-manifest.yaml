defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: postinstall-temporary-package-manifest
    desc: Install hook creates temporary package manifest
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.postinstall
      regex: 'mktemp\s+-d.{0,256}>\s*\$\w{1,40}/package\.json'
