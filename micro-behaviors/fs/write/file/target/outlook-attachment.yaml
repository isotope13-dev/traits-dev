# Reviewed observation: no attacker intent is inferred by this matcher.
defaults:
  platforms:
  - windows
  for:
  - html
  - vbs
  crit: notable
  conf: 0.9
traits:
- id: object-saveasfile-reference
  desc: Object SaveAsFile method reference
  if:
    type: text
    regex: '(?i)\b\w+(\.Item\s*\(\s*\d+\s*\))?\.SaveAsFile\b'
