defaults:
  platforms: [linux]
  for: [shell]
  crit: notable
  conf: 0.9

traits:
  - id: makepkg-conf-system-write
    desc: Writes system makepkg.conf
    if:
      type: tree-sitter
      language: shell
      query: |
        ((file_redirect [">" ">>"] destination: (_) @target)
          (#match? @target "^[\"']?/etc/makepkg\\.conf[\"']?$"))

  - id: makepkg-conf-xdg-write
    desc: Writes XDG user makepkg.conf
    if:
      type: tree-sitter
      language: shell
      query: |
        ((file_redirect [">" ">>"] destination: (_) @target)
          (#match? @target "^[\"']?(~|\\$HOME)/\\.config/pacman/makepkg\\.conf[\"']?$"))

  - id: makepkg-conf-legacy-user-write
    desc: Writes legacy user .makepkg.conf
    if:
      type: tree-sitter
      language: shell
      query: |
        ((file_redirect [">" ">>"] destination: (_) @target)
          (#match? @target "^[\"']?(~|\\$HOME)/\\.makepkg\\.conf[\"']?$"))

composite_rules:
  - id: makepkg-conf-user-write
    desc: Writes user makepkg configuration
    any:
      - id: makepkg-conf-xdg-write
      - id: makepkg-conf-legacy-user-write

  - id: makepkg-conf-write
    desc: Writes a makepkg build configuration
    any:
      - id: makepkg-conf-system-write
      - id: makepkg-conf-user-write

  - id: pkgbuild-phase-makepkg-config-write
    desc: Build phase writes live makepkg configuration
    crit: suspicious
    near_lines: 25
    all:
      - id: makepkg-conf-write
    any:
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-build-fn
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-prepare-fn
      - id: metadata/build/package/recipe/pkgbuild::pkgbuild-package-fn
