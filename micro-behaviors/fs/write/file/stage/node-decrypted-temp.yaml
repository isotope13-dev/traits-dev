defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-write-decrypted-temp-file
    desc: Writes decrypted bytes to /tmp path
    conf: 0.94
    if:
      type: symbol
      kind: call
      regex: '(^|\.)writeFile(Sync)?$'
      args:
        - index: 0
          from:
            value: '^/tmp/'
        - index: 1
          from:
            call: '(^|\.)(decrypt[A-Za-z0-9_$]*|decipher\.[a-z]+)$'
