# Hidden files in a temporary directory are a staging capability, not an
# intent verdict.  Match the path construction itself across source languages;
# supply-chain objectives require an automatic trigger and subsequent process
# or network behavior before assigning hostile intent.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.92

traits:
  - id: source-temp-api-reference
    desc: Source references temporary directory API
    crit: component
    if:
      type: text
      regex: '(TempDir|gettempdir|tmpdir|temp_dir|GetTempPath|temporaryDirectory|NSTemporaryDirectory)'

  - id: source-temp-path-reference
    desc: Source references temporary path
    crit: component
    if:
      type: text
      regex: '(System[.]tmp_dir|sys_get_temp_dir|File::Spec->tmpdir|TMPDIR|/tmp)'

  - id: source-hidden-stage-filename
    desc: Source embeds hidden stage filename
    crit: component
    if:
      type: text
      regex: '[.][A-Za-z0-9_][A-Za-z0-9._-]{2,}[.]idx'

  # Native format strings commonly place the hidden relative path before the
  # getenv expression that supplies the temporary-directory prefix.
  - id: source-hidden-temp-format-path
    desc: Native formats hidden temporary path
    for: [c, cpp]
    if:
      type: text
      regex: '[''"]%s/[.][A-Za-z0-9_][A-Za-z0-9._-]{2,}[''"].{0,180}getenv'

  - id: jvm-temp-directory-property
    desc: JVM references temporary directory property
    crit: component
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      exact: java.io.tmpdir

  - id: jvm-hidden-stage-filename
    desc: JVM class contains hidden staged filename
    crit: component
    for: [class, java_class]
    if:
      type: value
      path: class.strings[*]
      regex: '^[.][A-Za-z0-9_][A-Za-z0-9._-]{2,}$'

composite_rules:
  - id: source-hidden-temp-path-construction
    desc: Source builds hidden temporary path
    crit: notable
    conf: 0.92
    near_bytes: 512
    all:
      - id: source-hidden-stage-filename
    any:
      - id: source-temp-api-reference
      - id: source-temp-path-reference
      - id: source-hidden-temp-format-path

  - id: hidden-temp-source-stage
    desc: Source stages hidden temporary file
    crit: suspicious
    conf: 0.95
    all:
      - id: source-hidden-temp-path-construction
    any:
      - id: micro-behaviors/fs/write/file/full/
      - id: micro-behaviors/fs/write/file/handle/
      - id: micro-behaviors/fs/write/file/redirect/
      - id: micro-behaviors/fs/file/open::fopen
      - id: micro-behaviors/process/io/write::go-write-method-call

  - id: jvm-hidden-temp-stage-path
    desc: JVM class stages a hidden temporary file
    crit: suspicious
    conf: 0.97
    for: [class, java_class]
    all:
      - id: jvm-temp-directory-property
      - id: jvm-hidden-stage-filename
      - id: micro-behaviors/fs/write/file/full::jvm-files-write-bytecode
