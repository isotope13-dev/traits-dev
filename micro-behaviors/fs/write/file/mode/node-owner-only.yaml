defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: node-write-owner-only-mode
    desc: Node file write requests owner-only 0600 mode
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: [(identifier) @writer
                     (member_expression property: (property_identifier) @writer)]
          arguments: (arguments
            . (_)
            . (_)
            . (object
                (pair key: [(property_identifier) @key
                            (string (string_fragment) @key)]
                      value: (number) @mode))))
          (#match? @writer "^(writeFile|writeFileSync)$")
          (#eq? @key "mode")
          (#match? @mode "^(0[oO]600|384|0[xX]180)$")) @write
