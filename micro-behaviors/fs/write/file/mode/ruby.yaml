defaults:
  crit: notable
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-write-mode-binary
    desc: Binary write mode ('wb', 'wb+')
    conf: 0.9
    if:
      type: string_literal
      regex: ^wb\+?$
  - id: binmode-string
    desc: .binmode string
    conf: 0.75
    if:
      type: string_literal
      substr: .binmode
  - id: binmode-symbol
    desc: binmode symbol
    conf: 0.75
    if:
      type: symbol
      regex: binmode
composite_rules:
  - id: ruby-file-open-write-binary
    desc: Write binary file
    conf: 0.92
    any:
      - id: micro-behaviors/fs/write/file/mode::ruby-write-mode-binary
      - id: micro-behaviors/fs/write/file/mode::binmode-string
      - id: micro-behaviors/fs/write/file/mode::binmode-symbol
