defaults:
  platforms:
  - unix
  - windows
  for:
  - ruby
traits:
- id: ruby-read-substitute-rewrite
  desc: Reads, substitutes and rewrites the same file
  crit: notable
  conf: 0.99
  if:
    type: tree-sitter
    query: |
      ((_ (assignment left: (identifier) @contents
            right: (call receiver: (constant) @read_file method: (identifier) @read
              arguments: (argument_list . (identifier) @read_path .)))
          . [(call receiver: (constant) @write_file method: (identifier) @write
        arguments: (argument_list . (identifier) @written_path .
          (call receiver: (identifier) @replaced method: (identifier) @substitute))) (if_modifier body: (call receiver: (constant) @write_file method: (identifier) @write
        arguments: (argument_list . (identifier) @written_path .
          (call receiver: (identifier) @replaced method: (identifier) @substitute))))])
        (#eq? @read_file "File") (#eq? @read "read")
        (#eq? @write_file "File") (#eq? @write "write")
        (#eq? @read_path @written_path) (#eq? @contents @replaced)
        (#match? @substitute "^(gsub|sub)$")
        (#set! cleave.ignore-comments "true"))
