# Facts identify the individual calls, but do not bind the source-relative
# path, substituted contents and interpolated stamp across the guarded block.
# A mere read/rewrite plus an unrelated PID query is insufficient.
defaults:
  platforms: [unix, windows]
  for: [ruby]
  crit: notable
  conf: 0.98
traits:
  - id: ruby-source-runtime-stamp
    desc: Rewrites adjacent source with time and PID
    if:
      type: tree-sitter
      query: |
        ((_ (assignment left: (identifier) @stamp
              right: (string (interpolation) @time (interpolation) @pid))
            . (assignment left: (identifier) @path
              right: (call receiver: (constant) @path_file method: (identifier) @join
                arguments: (argument_list . (call receiver: (constant) @self_file
                  method: (identifier) @dirname arguments: (argument_list . (identifier) @self .))
                  (string (string_content) @source) .)))
            . (if condition: (call receiver: (constant) @guard_file method: (identifier) @guard
                arguments: (argument_list . (identifier) @guard_path .))
              consequence: (then .
              (assignment left: (identifier) @contents right: (call receiver: (constant) @reader
                method: (identifier) @read arguments: (argument_list . (identifier) @read_path .)))
              . [(call receiver: (constant) @writer method: (identifier) @write
                arguments: (argument_list . (identifier) @write_path .
                  (call receiver: (identifier) @replaced method: (identifier) @sub
                    arguments: (argument_list . (string) . (identifier) @replacement .)) .))
                 (if_modifier body: (call receiver: (constant) @writer method: (identifier) @write
                arguments: (argument_list . (identifier) @write_path .
                  (call receiver: (identifier) @replaced method: (identifier) @sub
                    arguments: (argument_list . (string) . (identifier) @replacement .)) .)))])))
          (#match? @time "^#\\{Time\\.now[.}]")
          (#match? @pid "^#\\{Process\\.pid[.}]")
          (#eq? @path_file "File") (#eq? @join "join")
          (#eq? @self_file "File") (#eq? @dirname "dirname") (#eq? @self "__FILE__")
          (#match? @source "\\.rb$")
          (#eq? @guard_file "File") (#match? @guard "^(exist\\?|file\\?)$")
          (#eq? @guard_path @path)
          (#eq? @reader "File") (#eq? @read "read")
          (#eq? @writer "File") (#eq? @write "write")
          (#eq? @path @read_path) (#eq? @path @write_path)
          (#eq? @contents @replaced) (#eq? @stamp @replacement)
          (#match? @sub "^(gsub|sub)$")
          (#set! cleave.ignore-comments "true"))
