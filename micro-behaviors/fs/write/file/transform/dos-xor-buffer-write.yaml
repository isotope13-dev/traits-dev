# A counted byte loop XORs a buffer in place (load/XOR/store or XOR to
# memory, pointer increment, LOOP) and the next DOS service is a handle
# write (AH=40h, INT 21h). File infectors use this to store an encoded copy
# of the host bytes they displaced. The matcher does not bind the loop
# pointer to DX, so it records sequence, not proven same-buffer flow.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  size_max: 65536

traits:
  - id: dos-xor-loop-then-handle-write
    desc: DOS XOR loop precedes file handle write
    crit: notable
    conf: 0.88
    if:
      type: yara
      source: |
        rule dos_xor_loop_then_handle_write {
          meta:
            filetypes = "dos_com,static-lib,data"
          strings:
            $pre = { B4 40 [0-12] ( 8A 07 ( 34 | 32 ) ?? 88 07 43 | 8A 04 ( 34 | 32 ) ?? 88 04 46 | 8A 05 ( 34 | 32 ) ?? 88 05 47 | 80 37 ?? 43 | 80 34 ?? 46 | 80 35 ?? 47 | 30 27 43 | 30 24 46 | 30 25 47 ) E2 ?? [0-12] CD 21 }
            $post = { ( 8A 07 ( 34 | 32 ) ?? 88 07 43 | 8A 04 ( 34 | 32 ) ?? 88 04 46 | 8A 05 ( 34 | 32 ) ?? 88 05 47 | 80 37 ?? 43 | 80 34 ?? 46 | 80 35 ?? 47 | 30 27 43 | 30 24 46 | 30 25 47 ) E2 ?? [0-12] B4 40 [0-12] CD 21 }
          condition:
            $pre or $post
        }
