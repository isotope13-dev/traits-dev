# XLM FWRITELN formulas whose text is itself script that stores an HTTP
# response body and saves the stream to disk (XMLHTTP responseBody written to
# an ADODB.Stream, then SaveToFile). SaveToFile is matched by its prefix
# because droppers split it across concatenated literals.
defaults:
  for: [xml]
  platforms: [windows]
  conf: 0.93

traits:
  - id: excel4-fwrite-response-body
    desc: XLM writes script text using responseBody
    crit: notable
    if:
      type: text
      regex: '(?i)\bFWRITE(LN)?\([^<]{0,300}\bresponseBody\b'
  - id: excel4-fwrite-savetofile
    desc: XLM writes script text calling SaveToFile
    crit: notable
    if:
      type: text
      regex: '(?i)\bFWRITE(LN)?\([^<]{0,300}\.save\s*to\s*fi'

composite_rules:
  - id: excel4-fwriteln-response-body-save
    desc: XLM writes script saving HTTP response body
    crit: notable
    all:
      - id: excel4-fwrite-response-body
      - id: excel4-fwrite-savetofile
    near_bytes: 3000
