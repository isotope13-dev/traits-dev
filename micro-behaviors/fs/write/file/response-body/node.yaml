defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: node-write-body-reader-result
    desc: Writes text/arrayBuffer/buffer call result
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(writeFile|writeFileSync)$'
      arg:
        index: 1
        from:
          call: '\.(text|arrayBuffer|buffer)$'
          through:
            - call: '^Buffer\.from$'
              arguments: [0]
