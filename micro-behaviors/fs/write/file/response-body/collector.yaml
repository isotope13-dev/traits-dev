defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: request-result-body-collector-file
    desc: Saves awaited result body through array
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        (statement_block
          (lexical_declaration (variable_declarator
            name: (identifier) @result
            value: (await_expression (call_expression))))
          (if_statement consequence: (expression_statement (call_expression
            function: (member_expression object: (identifier) @collector
              property: (property_identifier) @push)
            arguments: (arguments (call_expression
              function: (member_expression
                object: (member_expression object: (identifier) @returned
                  property: (property_identifier) @body)
                property: (property_identifier) @slice))))))
          (expression_statement (call_expression
            function: (member_expression property: (property_identifier) @write)
            arguments: (arguments (_) (call_expression
              function: (member_expression object: (identifier) @saved
                property: (property_identifier) @join)))))
          (#eq? @result @returned)
          (#eq? @collector @saved)
          (#eq? @push "push")
          (#eq? @body "body")
          (#eq? @slice "slice")
          (#eq? @write "writeFileSync")
          (#eq? @join "join"))
