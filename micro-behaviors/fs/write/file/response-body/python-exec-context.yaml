# The response-content write and an execution primitive occur nearby, but
# the matcher does not bind the written file or response value to that sink.
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]

composite_rules:
  - id: python-http-response-write-exec-profile
    desc: Python HTTP-response write near exec/system
    crit: suspicious
    conf: 0.98
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-content
    any:
      - id: micro-behaviors/process/create/system::python-os-system
      - id: micro-behaviors/process/interpreter/eval/direct::exec-builtin
    unless:
      - id: metadata/package/testing/
      - id: metadata/build/recognized-contexts::benign-app-fp-context
      - id: metadata/package/files/vendored/
      - id: micro-behaviors/communications/http/server/listener::python-built-in-http-server-command
      - id: micro-behaviors/communications/http/server/listener::python-range-file-server-command
      - id: "metadata/file/naming::test-directory-component"
