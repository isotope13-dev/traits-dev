defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  mbc: C0016
traits:
  - id: python-write-response-content
    desc: Writes HTTP response content to file
    conf: 0.9
    if:
      type: string_literal
      regex: \.write\(.{0,220}\.content\)
  - id: python-write-response-text
    desc: Writes response text to a file
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\.write\(\s*response\.text\s*\)'
  - id: python-write-response-read
    desc: Writes an HTTP response body to file
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b\w+\.write\(\s*response\.read\(\)\s*\)'
  # The pathlib spelling of the two atoms above. `Path.write_text(resp.text)` /
  # `write_bytes(r.content)` is how httpx and requests bodies reach disk in
  # modern code, and neither the `.write(...content)` nor the
  # `.write(response.read())` pattern sees it — the sibling atoms both require
  # a `.write(` call. Materialising a fetched body on disk is the first half of
  # every dropper; on its own it is equally the shape of an HTTP cache.
  - id: python-write-response-body-path
    desc: Writes an HTTP response body via pathlib
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.write_(text|bytes)\(\s*(r|resp|response)\.(text|content)\b'
  - id: python-write-fetch-body-path
    desc: Writes fetched body through pathlib
    conf: 0.9
    if:
      type: text
      regex: '\.write_(text|bytes)\(\s*(fetch|download|http|response)\w*\.(body|content)\b'
