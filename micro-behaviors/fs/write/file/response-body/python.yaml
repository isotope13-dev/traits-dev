# Python HTTP-response bodies written through pathlib. Download wrappers often
# expose `.body` instead of requests' `.content`; this is a neutral write
# capability until paired with execution in objectives/.
defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  mbc: C0016

traits:
  - id: python-write-fetch-body-path
    desc: Writes fetched body through pathlib
    conf: 0.9
    if:
      type: text
      regex: '\.write_(text|bytes)\(\s*(fetch|download|http|response)\w*\.(body|content)\b'
