defaults:
  platforms: [windows, unix]
  for: [php, zip]

composite_rules:
  - id: php-curl-response-script-stage
    desc: PHP writes HTTP response to sibling script path
    crit: suspicious
    conf: 0.98
    scope: outer
    near_bytes: 400
    all:
      - id: micro-behaviors/communications/http/download/curl::php-curl-response-file-write
      - id: micro-behaviors/fs/path/construct::php-obfuscated-sibling-script-path
