# Bind the iterated metadata fetch result to the array saved as a file.
# A local diagnostic can perform this operation; this atom implies no theft.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: alibaba-metadata-text-file-loop
    desc: Alibaba metadata response loop saved to file
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        (statement_block
          (for_in_statement
            body: (statement_block
              (_ (variable_declarator
                name: (identifier) @result
                value: (await_expression (call_expression
                  arguments: (arguments (binary_expression
                    left: (string (string_fragment) @endpoint)
                    operator: "+"
                    right: (identifier)))))))
              (if_statement consequence: (expression_statement
                (call_expression
                  function: (member_expression
                    object: (identifier) @collector
                    property: (property_identifier) @push)
                  arguments: (arguments (call_expression
                    function: (member_expression
                      object: (member_expression
                        object: (identifier) @returned
                        property: (property_identifier) @text)
                      property: (property_identifier) @slice))))))))
          (expression_statement (call_expression
            function: (member_expression property: (property_identifier) @write)
            arguments: (arguments (_) (call_expression
              function: (member_expression
                object: (identifier) @saved
                property: (property_identifier) @join)))))
          (#eq? @result @returned)
          (#eq? @collector @saved)
          (#match? @endpoint "^http://100[.]100[.]100[.]200(/latest/meta-data/)?$")
          (#eq? @push "push")
          (#eq? @text "text")
          (#eq? @slice "slice")
          (#eq? @write "writeFileSync")
          (#eq? @join "join"))
