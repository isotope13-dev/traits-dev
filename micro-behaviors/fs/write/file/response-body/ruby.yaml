defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  - id: ruby-file-write-binary-response
    desc: Ruby writes binary HTTP response
    crit: suspicious
    conf: 0.9
    platforms: [windows]
    if:
      type: text
      regex: 'File\.write[\s\S]{0,120}response\.body[\s\S]{0,80}mode: .wb.'

  - id: ruby-binary-response-write
    desc: Ruby writes HTTP response as binary file
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'File\.binwrite\s*\([^\n]{0,120}\br\.body\b'
