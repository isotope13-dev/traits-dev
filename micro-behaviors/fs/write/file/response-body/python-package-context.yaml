# Package metadata adds context to a response-write/exec co-occurrence. It
# does not establish a hidden payload, installation trigger or executed file.
composite_rules:
  - id: python-package-response-write-exec-profile
    desc: Python package contains HTTP response write and exec clues
    crit: suspicious
    conf: 0.98
    platforms: [unix, windows]
    for: [python, pkginfo, whl, python-sdist]
    scope: archive
    all:
      - id: metadata/package/ecosystem::pkginfo-core-metadata
      - id: micro-behaviors/fs/write/file/response-body::python-http-response-write-exec-profile
