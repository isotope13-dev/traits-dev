defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
traits:
  - id: rust-ureq-get-body-to-file
    desc: Writes a ureq GET result to disk
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: std::fs::write
      arg:
        index: 1
        from:
          call: '^ureq::get\.call(\.\w+)*\.read_to_vec(\.unwrap)?$'
