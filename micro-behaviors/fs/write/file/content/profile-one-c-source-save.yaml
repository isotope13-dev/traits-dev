defaults:
  platforms: [windows]
  for: [text]
  crit: notable
  conf: 0.95

traits:
  - id: one-c-staged-source-save
    desc: Saves staged source for subsequent copying
    if:
      type: text
      case_insensitive: true
      regex: 'TargetText\.AddLine\(CurStr\);\s*enddo;\s*TargetText\.Write\(SourceTmp\);'

