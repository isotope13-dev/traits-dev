defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
  crit: notable
traits:
  - id: node-writes-serialized-yaml
    desc: Node writeFileSync and YAML dump text
    conf: 0.92
    if:
      type: text
      regex: writeFileSync\s*\([^;\n]{0,220}\byaml\.dump\s*\(
  - id: node-write-data-variable-sync
    desc: writeFileSync writes a data-named variable
    conf: 0.96
    if:
      type: text
      regex: \bwriteFileSync\s*\([^,\n]{1,200},\s*(body|data|buffer|content)\b
  - id: json-stringify-write-sync
    desc: writeFileSync and JSON stringify text
    conf: 0.9
    if:
      type: text
      regex: writeFileSync.{0,500}JSON\.stringify
  - id: js-bracket-file-write
    desc: Node bracket-named file write call
    conf: 0.86
    if:
      type: encoded
      regex: '[A-Za-z_$][\w$]{0,24}\[[''"]writeFile(Sync)?[''"]\]\s*\('
  - id: node-prepends-import-to-source
    desc: writeFileSync and import-named value text
    conf: 0.94
    if:
      type: text
      regex: (?i)writeFileSync\s*\(\s*\w*(file|entry)\w*\s*,\s*\w*import\w*\s*\+
  - id: node-read-replace-write-in-place
    desc: Node read, replace and write text
    conf: 0.9
    if:
      type: text
      regex: writeFileSync\s*\([^)]{0,40},\s*readFileSync\s*\([^)]{0,40}\)\s*\.replace\s*\(
    not:
      - regex: writeFileSync\s*\(\s*(in|out|dest)File\b
  # The write call's data argument directly embeds a host or user identity
  # expression (os.hostname(), os.userInfo(), or os.userInfo().username):
  # the collected identity is what gets written. Split into two atoms (one
  # per spelling family) to stay within the regex length budget; the
  # js-write-host-identity-data composite unions them. A variable-assigned
  # identity value written later is not covered; these bind only the
  # single-expression form.
  - id: js-write-os-identity-call-data
    desc: Write data embeds os identity call
    conf: 0.92
    if:
      type: text
      regex: '(write|append)File(Sync)?\s*\([^;]{0,220}os\.(hostname|userInfo)\(\)'
  - id: js-write-userinfo-username-data
    desc: Write data embeds username member
    conf: 0.92
    if:
      type: text
      regex: '(write|append)File(Sync)?\s*\([^;]{0,220}userInfo\(\)\.username'
composite_rules:
  - id: js-file-write
    desc: JavaScript file-write API evidence
    conf: 0.9
    any:
      - id: micro-behaviors/fs/write/file/full/unspecified::write-file-sync
      - id: micro-behaviors/fs/write/file/append::append-file-sync
      - id: micro-behaviors/fs/write/file/full/unspecified::write-file-async
      - id: micro-behaviors/fs/write/runtime::bun-write-file
      - id: micro-behaviors/fs/write/file/append::append-file-async
      - id: micro-behaviors/fs/write/file/stream::create-write-stream
      - id: micro-behaviors/fs/write/file/stream::adodb-stream-write
      - id: micro-behaviors/fs/write/file/handle/unspecified::document-save-call
      - id: micro-behaviors/fs/write/stream::adodb-save-to-file
  - id: js-write-host-identity-data
    desc: Write data embeds host or user identity
    conf: 0.92
    any:
      - id: js-write-os-identity-call-data
      - id: js-write-userinfo-username-data
  - id: node-write-file-promise-destructured
    desc: FS promises import and writeFile call
    conf: 0.9
    all:
      - id: metadata/import/npm/fs/promises
      - id: micro-behaviors/fs/write/file/unspecified::write-file-call-target
  - id: synchronous-file-write-call-or-embedded-text
    desc: writeFileSync call or embedded call text
    conf: 0.92
    for:
      - javascript
      - typescript
      - pe
      - elf
    any:
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-call
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync-statement
