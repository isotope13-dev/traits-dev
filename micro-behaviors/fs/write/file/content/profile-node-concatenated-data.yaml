defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92

traits:
  # Concatenated content says nothing about append/overwrite mode or a read of
  # the previous file. Source-patch composites supply their own target/read
  # evidence. The actual call's second argument excludes quoted source and
  # comments; an ordinary variable plus a newline is still just a write.
  - id: write-file-sync-concatenated-values
    size_max: 65536
    desc: Writes concatenated data through writeFileSync
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: [(identifier) @write
            (member_expression property: (property_identifier) @write)]
          arguments: (arguments . (_) . (binary_expression
            left: (identifier)
            operator: "+"
            right: [(identifier) (string) (template_string)])))
          (#eq? @write "writeFileSync")
          )
