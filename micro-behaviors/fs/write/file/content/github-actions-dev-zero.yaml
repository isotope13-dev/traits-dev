defaults:
  platforms: [windows, linux, macos]
  for: [github_actions]
traits:
  - id: github-actions-dev-zero-file-write
    desc: Workflow step writes a zero-filled file
    crit: notable
    conf: 0.9
    if:
      type: value
      path: runs.steps[*].run
      regex: '(?is)dd\s+if=/dev/zero\s+of=[^\s;]+\s+bs=\d+[kKmMgG]?\s+count=\d{2,}'
