defaults:
  for: [ruby]
  platforms: [unix, windows]

traits:
  # File.write(path, '') truncates the named file to zero bytes.
  - id: ruby-file-write-empty-string
    desc: Ruby overwrites a file with nothing
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'File\.write\(\s*[\w.\[\]]{1,30}\s*,\s*(''''|"")\s*\)'
