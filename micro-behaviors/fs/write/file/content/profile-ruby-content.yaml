# Ruby file-write capability shapes. Relocated (2026-10) from
# objectives/lateral-movement/infection/file, where a bare `.write(content)`
# call was filed as infector evidence. Writing a `content` variable (or a
# `file_target`-named receiver) to an open handle is a neutral filesystem
# write used by templating, generators and tests alike; the infector inference
# comes from the composites that reference this (self-read, extension rename
# and recursive glob legs).
defaults:
  for: [ruby]
  platforms: [unix, windows]
  crit: notable
  conf: 0.9
traits:
  - id: ruby-write-content-variable
    desc: Writes a content variable to a file
    unless:
      - id: well-known/lib/runtime/scripted/jruby::package-path
      - id: well-known/lib/runtime/scripted/jruby::module-marker
      - id: well-known/lib/runtime/scripted/jruby::jruby-home-path
    if:
      type: text
      regex: 'file_target\.write|\.write\s*\(\s*content'
