defaults:
  platforms: [linux]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: glib-remote-stylesheet-import-write
    desc: GLib writes remote stylesheet import
    if:
      type: symbol
      kind: call
      exact: GLib.file_set_contents
      arg:
        index: 1
        kind: string
        regex: '^@import url\([''" ]?https?://'
