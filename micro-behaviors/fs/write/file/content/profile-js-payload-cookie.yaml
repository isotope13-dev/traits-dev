defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
- id: js-payload-file-write-text
  desc: payload.js writeFileSync text
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: 'writeFileSync\s*\(\s*[''"]payload\.js[''"]'
- id: js-cookie-property-file-write-text
  desc: Cookie property writeFileSync text
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'writeFileSync\s*\(\s*[''"]payload\.js[''"]\s*,\s*[A-Za-z_$][A-Za-z0-9_$]*\.cookie'
