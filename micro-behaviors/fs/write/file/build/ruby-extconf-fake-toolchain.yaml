# StubMaker-class RubyGems install hook: fake native-extension toolchain.
# Instead of compiling, the recipe writes empty Makefile targets and no-op
# compiler stand-ins (make_stub / make_stub.bat) so `gem install` reports
# success while a relative helper performs network fetch/exec.
#
# Technique class — not campaign-name gated. Future gems that stub the
# extension phase the same way should still match.
defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  # The stub path is often built in a variable (`stub = File.join(dir,
  # 'make_stub')`), so match the name where it reaches a File call.
  - id: make-stub-unix-script
    desc: Ruby builds make_stub script path
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bFile\.(write|open|join)\b[^\r\n]{0,60}[''"]make_stub[''"]'
  # Batch twin written beside the stub as "#{stub}.bat".
  - id: make-stub-windows-batch
    desc: Ruby writes a make_stub batch file path
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bFile\.write\s*\(\s*(["'']make_stub\.bat["'']|"#\{\w+\}\.bat")'

composite_rules:
  - id: fake-extension-make-stubs
    desc: Ruby opens or writes make_stub files
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/fs/write/file/build::make-stub-unix-script
      - id: micro-behaviors/fs/write/file/build::make-stub-windows-batch
  - id: stubmaker-fake-toolchain
    desc: Empty Makefile and stub file clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/file/build::extconf-writes-empty-makefile
      - id: micro-behaviors/fs/write/file/build::fake-extension-make-stubs
