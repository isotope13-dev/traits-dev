defaults:
  platforms: [unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: javascript-etc-hosts-literal
    desc: Literal names the /etc/hosts file
    if:
      type: literal
      exact: /etc/hosts

  - id: javascript-tee-overwrite-hosts-pipe
    desc: Pipes text into tee overwriting a file
    if:
      type: text
      regex: '\|\s*(sudo\s+)?tee\s+[^\s>|]{1,80}\s*>\s*/dev/null'

  - id: javascript-loopback-hosts-entry-template
    desc: Builds loopback hostname lines for hosts
    platforms: [unix, windows]
    if:
      type: text
      regex: '127\.0\.0\.1 \$\{[A-Za-z_]{1,20}\}'

composite_rules:
  - id: javascript-hosts-overwrite-redirect
    desc: Rewrites /etc/hosts with loopback entries
    crit: notable
    conf: 0.92
    all:
      - id: javascript-etc-hosts-literal
      - id: javascript-tee-overwrite-hosts-pipe
      - id: javascript-loopback-hosts-entry-template
