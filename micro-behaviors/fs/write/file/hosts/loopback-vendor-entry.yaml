defaults:
  platforms: [windows, unix]
  for: [python, pyc]
  crit: notable
  conf: 0.88

traits:
  - id: loopback-hosts-entry-dotted-names
    desc: Loopback hosts line mapping dotted names
    if:
      type: text
      regex: '127\.0\.0\.1[ \t]+[a-z0-9-]{2,30}\.[a-z]{2,6}[ \t]+[a-z0-9-]{2,30}\.[a-z]{2,6}'
