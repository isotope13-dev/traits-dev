defaults:
  crit: notable
  platforms: [unix, windows]

traits:
  - id: hosts-file-append
    for:
      - shell
      - batch
      - powershell
      - python
    desc: Appends an entry to system hosts file
    conf: 0.92
    if:
      type: text
      regex: (>>|tee\s+-a)[^\n]{0,40}etc[\\/]+hosts([^.A-Za-z0-9_]|$)
  - id: hosts-file-cmdlet-write
    desc: Writes system hosts file with a cmdlet
    conf: 0.92
    for:
      - powershell
    if:
      type: text
      regex: (Add-Content|Out-File)[^\n]{0,60}etc[\\/]+hosts([^.A-Za-z0-9_]|$)
  - id: hosts-file-python-write
    desc: Python opens system hosts file for writing
    conf: 0.92
    for:
      - python
    if:
      type: text
      regex: open\([^)]{0,40}etc[\\/]+hosts["'][^)]{0,12}["'][aw]
  - id: hosts-file-edit
    desc: Edits system hosts file with sed
    conf: 0.92
    for:
      - shell
      - python
    if:
      type: text
      regex: sed\s+-i[^\n]{0,60}etc[\\/]+hosts([^.A-Za-z0-9_]|$)

composite_rules:
  - id: hosts-file-write
    for:
      - shell
      - batch
      - powershell
      - python
    desc: Writes an entry into system hosts file
    conf: 0.94
    any:
      - id: micro-behaviors/fs/write/file/hosts::hosts-file-append
      - id: micro-behaviors/fs/write/file/hosts::hosts-file-cmdlet-write
      - id: micro-behaviors/fs/write/file/hosts::hosts-file-python-write
      - id: micro-behaviors/fs/write/file/hosts::hosts-file-edit
