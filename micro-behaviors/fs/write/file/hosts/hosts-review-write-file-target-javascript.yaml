defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript

traits:
  - id: node-writes-hosts-path
    desc: Node writes to hosts file
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(writeFile(Sync)?|appendFile(Sync)?|createWriteStream)$'
      arg:
        index: 0
        from:
          value: '(?i)(^|[/\\])etc[/\\]hosts$'
