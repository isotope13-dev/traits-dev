defaults:
  platforms: [windows]
  for: [oledoc, ooxml, xlsx]
  crit: notable
  conf: 0.98

traits:
  - id: vba-adodb-stream-object
    desc: VBA creates an ADODB.Stream object
    crit: notable
    if:
      type: raw
      regex: '(?i)ADODB\.Stream'
  - id: vba-adodb-savetofile-call
    desc: VBA calls ADODB.Stream SaveToFile
    crit: notable
    if:
      type: raw
      regex: '(?i)SaveToFile'

  - id: vba-binary-file-open
    desc: VBA opens file for binary write
    if:
      type: text
      regex: '(?i)\bOpen\s+[^\r\n]{1,160}\bFor\s+Binary\s+Access\s+(Write|ReadWrite)\b'

  - id: vba-binary-file-put
    desc: VBA writes bytes with Put statement
    if:
      type: text
      regex: '(?i)\bPut\s+#\s*[A-Za-z_]\w*'

  - id: vba-random-access-file-open
    desc: VBA random-access write open
    for: [oledoc, ooxml, xlsx, vbs]
    if:
      type: text
      regex: '(?i)\bOpen\s+[^\r\n]{1,160}\bFor\s+Random\s+Access\s+Write\b'

  - id: vba-random-access-file-put
    desc: VBA random-access Put record
    for: [oledoc, ooxml, xlsx, vbs]
    if:
      type: text
      regex: '(?i)\bPut\s+#\s*[A-Za-z_]\w*\s*,\s*.{0,80}'

composite_rules:
  - id: vba-adodb-stream-file-write
    desc: VBA writes a stream to a file through ADODB.Stream
    crit: notable
    conf: 0.98
    all:
      - id: vba-adodb-stream-object
      - id: vba-adodb-savetofile-call
  - id: vba-binary-file-write
    desc: VBA writes a binary file with Open and Put
    crit: notable
    conf: 0.97
    all:
      - id: vba-binary-file-open
      - id: vba-binary-file-put
  - id: vba-random-access-file-write
    desc: VBA random-access file write
    for: [oledoc, ooxml, xlsx, vbs]
    crit: notable
    conf: 0.97
    all:
      - id: vba-random-access-file-open
      - id: vba-random-access-file-put
