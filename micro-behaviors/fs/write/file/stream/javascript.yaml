defaults:
  for: [javascript, typescript]
traits:
  - id: create-write-stream
    platforms: [windows, unix]
    desc: Creates a write stream
    crit: notable
    conf: 0.8
    unless:
      - type: basename
        regex: \.map$|^(rimraf|run-(script-)?os|ipv6(grep)?)$
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
    if:
      type: symbol
      kind: call
      regex: '(^|\.)createWriteStream$'
  - id: adodb-stream-write
    platforms: [windows, unix]
    desc: ADODB.Stream write operation
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: 'ADODB\.Stream[\s\S]{0,120}\.write(Text)?\s*\('
  - id: node-live-append-stream
    platforms: [unix, windows]
    desc: Creates a live append stream
    crit: notable
    conf: 0.9
    # Only the toolkit's private createLiveAppendStream API. Plain
    # fs.createWriteStream() is a truncating write stream, not a live append
    # stream, and is already the canonical atom
    # micro-behaviors/fs/write/file/stream::create-write-stream — matching it
    # here both mis-described it and duplicated that matcher.
    if:
      type: symbol
      kind: call
      exact: createLiveAppendStream
  - id: node-stream-record-write
    platforms: [unix, windows]
    desc: References a stream record writer
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: writeStreamLineLive
