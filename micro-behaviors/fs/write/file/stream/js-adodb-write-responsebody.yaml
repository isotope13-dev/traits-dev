defaults:
  conf: 0.9
  platforms: [windows, unix]
  for:
    - javascript
traits:
  - id: js-adodb-stream-write-responsebody--resp
    desc: Obfuscated ResponseBody fragment (Resp)
    crit: component
    size_max: 200000
    if:
      type: string_literal
      exact: Resp
  - id: js-adodb-stream-write-responsebody--onse
    desc: Obfuscated ResponseBody fragment (onse)
    crit: component
    size_max: 200000
    if:
      type: string_literal
      exact: onse
  - id: js-adodb-stream-write-responsebody--onse-body
    desc: Obfuscated ResponseBody fragment (onseBo)
    crit: notable
    size_max: 200000
    if:
      type: string_literal
      exact: onseBo
composite_rules:
  # One shard is not the split. "Resp" is also an ordinary message name.
  # Two of Resp / onse / onseBo within one statement block is the
  # ResponseBody concatenation.
  - id: js-adodb-stream-write-responsebody
    desc: Obfuscated ResponseBody write fragment cluster
    crit: suspicious
    size_max: 200000
    near_bytes: 800
    needs: 2
    any:
      - id: js-adodb-stream-write-responsebody--resp
      - id: js-adodb-stream-write-responsebody--onse
      - id: js-adodb-stream-write-responsebody--onse-body
