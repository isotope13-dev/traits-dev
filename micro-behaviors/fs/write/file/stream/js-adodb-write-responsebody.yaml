defaults:
  platforms: [windows, unix]
  for:
    - javascript
traits:
  - id: js-adodb-stream-write-responsebody--resp
    desc: Obfuscated ResponseBody fragment (Resp)
    crit: component
    conf: 0.9
    size_max: 200000
    if:
      type: string_literal
      exact: Resp
  - id: js-adodb-stream-write-responsebody--onse
    desc: Obfuscated ResponseBody fragment (onse)
    crit: component
    conf: 0.9
    size_max: 200000
    if:
      type: string_literal
      exact: onse
  - id: js-adodb-stream-write-responsebody--onse-body
    desc: Obfuscated ResponseBody fragment (onseBo)
    crit: component
    conf: 0.9
    size_max: 200000
    if:
      type: string_literal
      exact: onseBo
composite_rules:
  - id: js-adodb-stream-write-responsebody
    desc: Obfuscated ResponseBody write fragment cluster
    crit: suspicious
    conf: 0.9
    size_max: 200000
    any:
      - id: js-adodb-stream-write-responsebody--resp
      - id: js-adodb-stream-write-responsebody--onse
      - id: js-adodb-stream-write-responsebody--onse-body
