defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86]
traits:
  - id: x86-paired-input-file-stream-writes
    desc: x86 paired input copies to file stream
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule paired_stream_copy {
          strings:
            $code = { FF 75 ?? 56 59 50 E8 [4] FF 75 ?? 57 59 FF 75 ?? E8 [4] FF 75 ?? E8 [4] 59 56 59 E8 [4] 8B 45 ?? 40 50 E8 [4] 59 89 45 ?? FF 35 [4] 56 59 53 FF 75 ?? E8 [4] FF 75 ?? 56 59 FF 75 ?? E8 [4] FF 75 ?? 57 59 FF 75 ?? E8 [4] 56 59 E8 ?? ?? ?? ?? }
          condition:
            pe.machine == pe.MACHINE_I386 and (
              for any s in pe.sections : (
                (s.name == ".text" or s.characteristics & pe.SECTION_MEM_EXECUTE != 0) and
                $code in (s.raw_data_offset..s.raw_data_offset + s.raw_data_size)
              ) or (pe.overlay.size > 0 and $code in (pe.overlay.offset..filesize))
            )
        }
