traits:
- crit: notable
  conf: 0.8
  id: wsh-save-to-file-hex
  desc: Hex-escaped SaveToFile method reference
  if:
    type: string_literal
    case_insensitive: true
    regex: \\\\x73\\\\x61\\\\x76\\\\x65\\\\x54\\\\x6F\\\\x46\\\\x69\\\\x6C\\\\x65
composite_rules:
- crit: notable
  conf: 0.8
  id: wsh-save-to-file
  desc: SaveToFile method references
  unless:
  - id: metadata/build/bundler/asset::js-large-module-bundle
  - id: metadata/build/recognized-contexts::benign-build-tooling-context
  any:
  - id: micro-behaviors/fs/write/file/stream::savetofile-method-token
  - id: micro-behaviors/fs/write/file/stream::unicode-savetofile-reference
  - id: micro-behaviors/fs/write/stream::adodb-save-to-file-unicode
  - id: micro-behaviors/fs/write/file/stream::wsh-save-to-file-hex
  - id: micro-behaviors/fs/write/file/full::save-to-file-method-text
defaults:
  platforms:
  - windows
  for:
  - javascript
  - vbs
