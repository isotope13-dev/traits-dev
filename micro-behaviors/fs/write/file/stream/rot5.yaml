# Character codes shifted by +5, with nested percent-escaped punctuation.
defaults:
  platforms: [windows]
  for: [html, javascript, data]
  conf: 0.95

traits:
  - id: rot5-stream-save-to-file
    desc: ROT5 percent-encoded split SaveToFile invocation
    crit: notable
    if:
      type: text
      regex: '3Xf(%(25){0,4}2A(77|7G)){3}%(25){0,4}7BjYtKnqj%(25){0,4}2A7%(25){0,4}3D'
