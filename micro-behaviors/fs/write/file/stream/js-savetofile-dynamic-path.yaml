defaults:
  platforms: [windows, unix]
traits:
  # SaveToFile(path, 2) is also TypeScript's stock Windows Script Host
  # writeFile backend. The call proves a mode-selected file write; ADODB,
  # closing the stream, and malicious staging require separate evidence.
  - id: js-savetofile-dynamic-path-mode-2
    desc: SaveToFile variable path with mode 2
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: '(?i)(\.SaveToFile|\[\s*["'']SaveToFile["'']\s*\])\s*\(\s*\w+\s*,\s*2\s*\)'
