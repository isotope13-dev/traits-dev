defaults:
  platforms: [windows, unix]
traits:
  - id: js-adodb-stream-savetofile-dynamic-path
    desc: "Dynamic SaveToFile overwrite & close sequence"
    crit: suspicious
    conf: 0.9
    for: [javascript]
    if:
      type: text
      # The former computed-call shape matched arbitrary obfuscated bundles;
      # require the defining ADODB method name before claiming SaveToFile.
      regex: '(?i)(\.SaveToFile|\[\s*["'']SaveToFile["'']\s*\])\s*\(\s*\w+\s*,\s*2\s*\)'
