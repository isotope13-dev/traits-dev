defaults:
  for: [html, javascript]
  platforms: [windows]
  conf: 0.98
# ASCII SaveTofile encoded as decimal bytes XOR 10.
traits:
  - id: decimal-xor10-savetofile-token
    desc: "Decimal XOR-10 encoding of SaveTofile"
    crit: notable
    if:
      type: text
      substr: "89,107,124,111,94,101,108,99,102,111"
