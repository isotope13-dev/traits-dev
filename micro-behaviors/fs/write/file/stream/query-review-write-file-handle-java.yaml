defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries

traits:
  - id: java-fileoutputstream-source
    desc: Java FileOutputStream construction
    conf: 0.8
    platforms: [android, unix, windows]
    # `new FileOutputStream` is unambiguous JVM source inside JSP and other
    # content-classified carriers.
    for: [jsp, java, html, javascript, python, vbs]
    if:
      type: text
      regex: 'new\s+(java\.io\.)?FileOutputStream\s*\('
  - id: kotlin-fileoutputstream-source
    desc: Kotlin FileOutputStream construction
    conf: 0.9
    platforms: [android, unix, windows]
    for: [kotlin]
    if:
      type: symbol
      kind: call
      exact: FileOutputStream
  - id: java-filewriter-source
    desc: Java FileWriter usage
    conf: 0.8
    for: [java]
    if:
      type: text
      substr: new FileWriter

composite_rules:
  - id: jvm-fileoutputstream-source
    desc: JVM source constructs FileOutputStream
    conf: 0.9
    platforms: [android, unix, windows]
    for: [java, kotlin]
    any:
      - id: micro-behaviors/fs/write/file/stream::java-fileoutputstream-source
      - id: micro-behaviors/fs/write/file/stream::kotlin-fileoutputstream-source
