# The generated source does not load a pickle from disk or the network: the
# zlib stream (0x78 header byte followed by an escaped level byte) is inlined
# as a bytes literal in the text being written, so the dropped script carries
# its own opaque serialized payload.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-writes-inline-zlib-pickle-loader
    desc: Writes inline zlib-pickle loader source
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '\.write$'
      arg:
        index: 0
        kind: string
        regex: 'pickle\.loads\(\s*zlib\.decompress\(\s*b\\?[''"]x\\{1,2}x(9c|da|01|5e)'
