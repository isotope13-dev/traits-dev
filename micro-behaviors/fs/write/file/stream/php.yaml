defaults:
  platforms: [windows, unix]
  for: [php]
  attack: T1105

traits:
  - id: fopen-uploaded-temp-file
    desc: Opens a PHP uploaded temporary file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'fopen\s*\(\s*\$[A-Za-z_][A-Za-z0-9_]*\s*\[\s*[''\"]tmp_name[''\"]\s*\]'

composite_rules:
  - id: write-uploaded-temp-stream
    desc: Writes an uploaded temporary file stream
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/fs/file/write/direct::php-file-put-contents
      - id: fopen-uploaded-temp-file
    near_bytes: 256
