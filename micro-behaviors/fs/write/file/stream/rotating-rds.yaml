# Semantic alphabet lookup; independent of alphabet order, URLs and names.
defaults:
  for: [html, javascript]
  platforms: [windows]
  crit: notable
  conf: 0.98
  size_max: 262144
traits:
  - id: rotating-savetofile-member
    desc: Rotating substitution carries SaveToFile member
    if:
      type: yara
      source: |
        import "math"
        rule rotating_hex_savetofile {
        strings:
        $alphabet = /'([^'\\]|\\.){97}'/
        $argument = /[;}>]\w+\("/
        $slash = /[^\\]\\\\/
        condition:
        #alphabet >= 2 and $argument and
        for any d in (1..#alphabet) : (
        for any e in (1..#alphabet) : (
        @alphabet[e] != @alphabet[d] and
        @alphabet[e] < @alphabet[d]+300 and @alphabet[d] < @alphabet[e]+300 and
        with a = @alphabet[d]+1, b = @alphabet[e]+1 : (
        for any t in (1..#argument) : (
        for any rotation in (0..4) : (
        for any k0 in (0..!alphabet[e]-2) : (
        (k0 == 0 or uint8(b+k0-1) != 92 or (uint16(b+k0-2) == 0x5c5c and uint8(b+k0-3) != 92)) and
        (uint8(b+k0) == 83 or (uint8(b+k0) == 92 and uint8(b+k0+1) == 83)) and
        with oi0 = k0-math.count(92,b,k0)+(#slash in (b-1..b+k0-2)) : (
        for any j0 in (0..!alphabet[d]-2) : (
        (j0 == 0 or uint8(a+j0-1) != 92 or (uint16(a+j0-2) == 0x5c5c and uint8(a+j0-3) != 92)) and
        j0-math.count(92,a,j0)+(#slash in (a-1..a+j0-2)) == (oi0+rotation)%97 and
        for any p in (@argument[t]+!argument[t]..filesize-10) : (
        uint8(p) == uint8(a+j0) and
        (uint8(p) != 92 or uint8(p+1) == uint8(a+j0+1)) and
        (uint8(p-1) != 92 or (uint16(p-2) == 0x5c5c and uint8(p-3) != 92)) and
        for all quote in (@argument[t]+!argument[t]..p-1) : (
        uint8(quote) != 34 or
        (uint8(quote-1) == 92 and uint8(quote-2) != 92) or
        (uint8(quote-1) == 92 and uint16(quote-3) == 0x5c5c and
        uint8(quote-4) != 92)
        ) and
        with q0 = p,
        q1 = q0+1+math.count(92,q0,1),
        q2 = q1+1+math.count(92,q1,1),
        q3 = q2+1+math.count(92,q2,1),
        q4 = q3+1+math.count(92,q3,1),
        q5 = q4+1+math.count(92,q4,1),
        q6 = q5+1+math.count(92,q5,1),
        q7 = q6+1+math.count(92,q6,1),
        q8 = q7+1+math.count(92,q7,1),
        q9 = q8+1+math.count(92,q8,1) : (
        for all n in (1..9) : (
        for any q in (q1,q2,q3,q4,q5,q6,q7,q8,q9) : (
        ((n == 1 and q == q1) or
        (n == 2 and q == q2) or
        (n == 3 and q == q3) or
        (n == 4 and q == q4) or
        (n == 5 and q == q5) or
        (n == 6 and q == q6) or
        (n == 7 and q == q7) or
        (n == 8 and q == q8) or
        (n == 9 and q == q9)) and
        for any k in (0..!alphabet[e]-2) : (
        (k == 0 or uint8(b+k-1) != 92 or (uint16(b+k-2) == 0x5c5c and uint8(b+k-3) != 92)) and
        ((n == 1 and (uint8(b+k) == 97 or (uint8(b+k) == 92 and uint8(b+k+1) == 97))) or
        (n == 2 and (uint8(b+k) == 118 or (uint8(b+k) == 92 and uint8(b+k+1) == 118))) or
        (n == 3 and (uint8(b+k) == 101 or (uint8(b+k) == 92 and uint8(b+k+1) == 101))) or
        (n == 4 and (uint8(b+k) == 84 or (uint8(b+k) == 92 and uint8(b+k+1) == 84))) or
        (n == 5 and (uint8(b+k) == 111 or (uint8(b+k) == 92 and uint8(b+k+1) == 111))) or
        (n == 6 and (uint8(b+k) == 70 or (uint8(b+k) == 92 and uint8(b+k+1) == 70))) or
        (n == 7 and (uint8(b+k) == 105 or (uint8(b+k) == 92 and uint8(b+k+1) == 105))) or
        (n == 8 and (uint8(b+k) == 108 or (uint8(b+k) == 92 and uint8(b+k+1) == 108))) or
        (n == 9 and (uint8(b+k) == 101 or (uint8(b+k) == 92 and uint8(b+k+1) == 101)))) and
        with oi = k-math.count(92,b,k)+(#slash in (b-1..b+k-2)) : (
        for any j in (0..!alphabet[d]-2) : (
        (j == 0 or uint8(a+j-1) != 92 or (uint16(a+j-2) == 0x5c5c and uint8(a+j-3) != 92)) and
        j-math.count(92,a,j)+(#slash in (a-1..a+j-2)) == (oi+rotation)%97 and
        uint8(q) == uint8(a+j) and
        (uint8(q) != 92 or uint8(q+1) == uint8(a+j+1))
        )
        )
        )
        )
        )
        )
        )
        )
        )
        )
        )
        )
        )
        )
        )
        }
