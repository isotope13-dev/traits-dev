defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-writes-compressed-pickle-loader
    desc: Writes a compressed-pickle loader as source
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '\.write$'
      arg:
        index: 0
        kind: string
        regex: 'pickle\.loads\(zlib\.decompress\('
