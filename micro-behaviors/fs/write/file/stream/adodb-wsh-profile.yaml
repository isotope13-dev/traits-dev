defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
- id: adodb-savetofile-variants
  desc: ADODB SaveToFile call, literal or obfuscated
  crit: suspicious
  conf: 0.92
  any:
  - id: micro-behaviors/fs/write/file/stream::adodb-savetofile
  - id: micro-behaviors/fs/write/file/stream::adodb-savetofile-obfuscated-fragments
- id: wsh-run-or-computed-member-clues
  desc: WSH Run call or computed member-access clues
  crit: component
  conf: 0.5
  any:
  - id: micro-behaviors/process/create/shell/script-host::wscript-shell-run
  - id: micro-behaviors/data/property/access::wscript-function-key-prefix
  - id: micro-behaviors/data/property/access::wscript-bracket-member-access
- id: adodb-savetofile-wsh-member-profile
  desc: ADODB SaveToFile near WSH Run or computed member clues
  crit: suspicious
  conf: 0.98
  all:
  - id: adodb-savetofile-variants
  - id: wsh-run-or-computed-member-clues
