# Codec-specific ciphertext of the escaped API token below, split only at
# carrier boundaries. Key: ASCII hex MD5 of the encoder default password.
# \x73\x61\x76\x65\x74\x6F\x66\x69\x6C\x65
# These signatures describe encoded tokens, not observed API execution.
defaults:
  for: [html, javascript]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: md5-xor-savetofile-part-1
    desc: "Default MD5-XOR fragment of SaveToFile method"
    crit: component
    if:
      type: text
      substr: "oJRQiI%06P%3AHV%00n@%01PjJ%05Rd@"
  - id: md5-xor-savetofile-part-2
    desc: "Default MD5-XOR fragment of SaveToFile method"
    crit: component
    if:
      type: text
      substr: "SpnK%0FT9AW%00oJS%21iI%06T"
composite_rules:
  - id: md5-xor-savetofile
    desc: "Default MD5-XOR encoding of SaveToFile method"
    crit: notable
    all:
      - id: micro-behaviors/fs/write/file/stream::md5-xor-savetofile-part-1
      - id: micro-behaviors/fs/write/file/stream::md5-xor-savetofile-part-2
      - id: micro-behaviors/crypto/key/representation::md5-browser-default-passphrase
      - id: micro-behaviors/data/decode/custom::unescape-input-md5-argument-call
      - id: micro-behaviors/data/decode/xor::js-repeating-key-charcode-xor-decoder
