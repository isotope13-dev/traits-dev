# Stream.Write(buf) / .Write($buf) — neutral buffer-to-stream write. Not wipe
# intent on its own; wipe composites combine this with PhysicalDrive open.
defaults:
  platforms: [windows, unix]
  for: [powershell, csharp, python, javascript]
  crit: notable
  conf: 0.9

traits:
  - id: stream-write-buf-arg
    desc: Writes a buffer argument to a stream
    if:
      type: text
      regex: '(?i)\.Write\s*\(\s*\$?buf'
