defaults:
  platforms: [windows]
  for: [html, javascript]
  crit: notable
  conf: 0.95

traits:
  - id: encoded-reversed-responsebody-write
    desc: Encoded reversed response-body stream write
    if:
      type: encoded
      regex: '(?i)ydobesnopser\.[\w$]+\(etirw\.[\w$]+'

  - id: encoded-reversed-jpeg-save-call
    desc: Encoded reversed SaveToFile JPEG path
    if:
      type: encoded
      regex: '(?i)["'']gpj\.[^"'']{1,120}["'']\(elifotevas\.[\w$]+'
