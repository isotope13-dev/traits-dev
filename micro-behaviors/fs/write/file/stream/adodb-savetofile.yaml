defaults:
  platforms: [windows, unix]
  for:
    - javascript
    - vbs
traits:
  - id: savetofile-method-token
    desc: ADODB-compatible SaveToFile method token
    crit: notable
    conf: 0.94
    if:
      type: text
      word: SaveToFile
  - id: adodb-savetofile
    desc: Uses ADODB.Stream SaveToFile method
    crit: suspicious
    conf: 0.95
    if:
      type: string_literal
      regex: S\\x61veFile|ToF\\x69le
  - id: adodb-fragment-adod
    desc: Obfuscated ADODB fragment "ADOD"
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      substr: ADOD
    not:
      - substr: ADODB
  - id: adodb-fragment-stream
    desc: Obfuscated ADODB stream fragment ".Stre"
    crit: notable
    conf: 0.85
    if:
      type: string_literal
      substr: .Stre
    not:
      - substr: .Stream
  - id: savetofile-fragment-save
    desc: Obfuscated SaveToFile fragment "Save"
    crit: component
    conf: 0.8
    if:
      type: string_literal
      substr: Save
    not:
      - substr: Save layout as profile
      - substr: SaveTo
      - substr: Save as
      - substr: Saved
      - substr: compileOnSave
      - substr: OnSave
      - substr: PowerSave
      - substr: SaveDialog
      - substr: FileSaver
    unless:
      - id: metadata/lang/javascript-features::closure-externs-annotation
  - id: savetofile-fragment-tofil
    desc: Obfuscated SaveToFile fragment "ToFil"
    crit: notable
    conf: 0.8
    size_max: 20000
    if:
      type: string_literal
      substr: ToFil
    not:
      - substr: ToFile
      - substr: resolutionToFil
      - substr: pathToFil
  # Hex-split SaveToFile uses "ToF\x69" / decoded "ToFi" (not the ToFil shard).
  - id: savetofile-fragment-tofi
    desc: Obfuscated SaveToFile ToFi fragment
    crit: notable
    conf: 0.85
    size_max: 20000
    if:
      type: text
      substr: 'ToF\x69'
  - id: savetofile-hex-tofi-t
    desc: Hex-escaped SaveToFile ToFi fragment
    crit: notable
    conf: 0.85
    size_max: 20000
    if:
      type: text
      substr: '"\x54oFi"'
  - id: savetofile-hex-tofil-mixed
    desc: Mixed hex SaveToFile ToFil fragment
    crit: notable
    conf: 0.85
    size_max: 20000
    if:
      type: text
      substr: '"\x54o\x46\x69l"'
  - id: savetofile-hex-save-fragment
    desc: Hex-escaped SaveToFile Save fragment
    crit: notable
    conf: 0.85
    size_max: 20000
    if:
      type: text
      substr: '"S\x61ve"'
  - id: savetofile-hex-save-ave
    desc: Hex-escaped SaveToFile ave fragment
    crit: notable
    conf: 0.85
    size_max: 20000
    if:
      type: text
      substr: '"Sav\x65"'
  - id: savetofile-hex-save-s-av
    desc: Hex-escaped SaveToFile Sav fragment
    crit: notable
    conf: 0.85
    size_max: 20000
    if:
      type: text
      substr: '"\x53av\x65"'
  - id: savetofile-hex-s-ave-fragment
    desc: Hex-escaped SaveToFile S-ave fragment
    crit: notable
    conf: 0.85
    size_max: 20000
    if:
      type: text
      substr: '"\x53ave"'
  # Quoted hex-escaped ".Stre" — distinct from decoded string_literal `.Stre`.
  - id: adodb-hex-stre-fragment
    desc: Hex-escaped ADODB Stre fragment
    crit: notable
    conf: 0.85
    size_max: 20000
    if:
      type: text
      substr: '".\x53tre"'
  - id: adodb-hex-stre-r
    desc: Hex-escaped ADODB Stre r-fragment
    crit: notable
    conf: 0.85
    size_max: 20000
    if:
      type: text
      substr: '".St\x72e"'
  # Hex-escaped ".Str" (period+S+t), concatenated with "eam" into .Stream.
  - id: adodb-hex-dot-st-fragment
    desc: Hex-escaped ADODB dot-St fragment
    crit: notable
    conf: 0.85
    size_max: 20000
    if:
      type: text
      substr: '"\x2e\x53t'
composite_rules:
  - id: adodb-hex-stream-any
    desc: Hex-escaped ADODB stream fragment
    crit: notable
    conf: 0.85
    any:
      - id: adodb-hex-stre-fragment
      - id: adodb-hex-dot-st-fragment
      - id: adodb-hex-stre-r
  - id: savetofile-hex-save-any
    desc: Hex-escaped SaveToFile Save fragment
    crit: notable
    conf: 0.85
    any:
      - id: savetofile-hex-save-fragment
      - id: savetofile-hex-s-ave-fragment
      - id: savetofile-hex-save-ave
      - id: savetofile-hex-save-s-av
  - id: savetofile-hex-tofi-any
    desc: Hex-escaped SaveToFile ToFi fragment
    crit: notable
    conf: 0.85
    any:
      - id: savetofile-fragment-tofi
      - id: savetofile-hex-tofi-t
      - id: savetofile-hex-tofil-mixed
  - id: adodb-savetofile-obfuscated-fragments
    desc: Obfuscated ADODB.Stream SaveToFile fragment cluster
    crit: suspicious
    conf: 0.92
    # Keep every leg on source text. `.Stre` is a decoded-layer string_literal
    # and will not AND with hex Save/ToFi shards on the same unit.
    all:
      - id: adodb-hex-stream-any
      - id: savetofile-hex-save-any
    any:
      - id: savetofile-hex-tofi-any
      - id: savetofile-fragment-tofil
      - id: savetofile-fragment-save
    unless:
      - id: micro-behaviors/fs/write/file/stream::adodb-stream
