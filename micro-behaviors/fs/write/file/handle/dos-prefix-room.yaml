defaults:
  for: [batch, dos_com, data]
  platforms: [windows]
  size_max: 65536
traits:
  # Two calls share the same backwards block-copy helper; counter, buffer,
  # inserted stride and final CS:0100 write length are bound, not cooccurring.
  - id: micro-behaviors/fs/write/file/handle::dos-backward-file-shift-and-image-prefix
    desc: DOS shifts host and writes image prefix
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule dos_backward_room_and_image_prefix {
          strings:
            $shift = { A1 ?? ?? B1 0A D3 E0 89 C2 31 C9 B8 00 42 CD 21 BA ?? ?? 89 F9 B4 3F CD 21 A1 ?? ?? B1 0A D3 E0 05 ?? ?? 89 C2 31 C9 B8 00 42 CD 21 BA ?? ?? 89 F9 B4 40 CD 21 C3 }
            $loop = { BF 00 04 33 D2 F7 F7 A3 ?? ?? 89 16 ?? ?? 83 3E ?? ?? 00 74 0C 8B 3E ?? ?? E8 ?? ?? 72 2C BF 00 04 83 3E ?? ?? 00 74 0B FF 0E ?? ?? E8 ?? ?? 72 19 EB EE }
            $prefix = { 31 C9 31 D2 B8 00 42 CD 21 0E 1F BA 00 01 B9 ?? ?? B4 40 CD 21 73 01 F9 C3 }
          condition:
            #shift <= 16 and #loop <= 16 and #prefix <= 16 and
            for any s in (1..#shift) : (
          for any l in (1..#loop) : (
            for any p in (1..#prefix) : (
              @prefix[p] == @loop[l] + 51 and
              @loop[l] + 28 + int16(@loop[l] + 26) == @shift[s] and
              @loop[l] + 47 + int16(@loop[l] + 45) == @shift[s] and
              uint16(@shift[s] + 1) == uint16(@shift[s] + 26) and
              uint16(@shift[s] + 1) == uint16(@loop[l] + 8) and
              uint16(@shift[s] + 1) == uint16(@loop[l] + 35) and
              uint16(@shift[s] + 1) == uint16(@loop[l] + 42) and
              uint16(@loop[l] + 12) == uint16(@loop[l] + 16) and
              uint16(@loop[l] + 12) == uint16(@loop[l] + 23) and
              uint16(@loop[l] + 12) == uint16(@loop[l] + 8) + 2 and
              uint16(@shift[s] + 17) == uint16(@shift[s] + 45) and
              uint16(@shift[s] + 1) == uint16(@shift[s] + 17) + 1024 and
              uint16(@shift[s] + 33) == uint16(@prefix[p] + 15) and
              uint16(@prefix[p] + 15) > 0 and
              uint16(@shift[s] + 17) >= uint16(@prefix[p] + 15) + 256
            )
          )
        )
        }
