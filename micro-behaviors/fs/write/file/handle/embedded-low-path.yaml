defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: embedded-pe-low-path-write-profile
    desc: Embedded PEs, Low paths and file-write API
    crit: notable
    conf: 0.96
    all:
      - id: metadata/binary/layout/embedded::embedded-pe-three-plus
      - id: micro-behaviors/fs/path/reference::low-directory-executable-reference
      - id: micro-behaviors/fs/path/basename::search-host-variant-name-reference
      - id: micro-behaviors/fs/write/file/handle::write-file
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: metadata/binary/code/entropy::code-entropy-near-zero

