defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
- id: dos-rename-stored-batch-write-setup
  desc: Stored Batch write setup follows rename request
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule dos_rename_stored_batch_write_setup {\n strings:\n  $writer = { BA ?? ?? BF ?? ?? B4 56 CD 21\
      \ BA ?? ?? 33 C9 B4 3C CD 21 8B D8 B9 ?? ?? BA ?? ?? B4 40 CD 21 B4 3E CD 21 B4 4F E9 ?? ?? }\n  $template\
      \ = /@ECHO OFF\\r\\n[A-Za-z0-9_.~-]{1,60}\\r\\nRENAME [ \\x00]{31,160}\\r\\n[ \\x00]{1,80}\\r\\nRENAME [ \\\
      x00]{31,160}\\r\\n[A-Za-z0-9_.~-]{1,60}\\r\\n\\x1a/ nocase\n condition:\n  #writer > 0 and #writer <= 32 and\
      \ #template <= 32 and\n  for any w in (1..#writer) : (\n   for any t in (1..#template) : (\n    uint16(@writer[w]+25)\
      \ == @template[t]+256 and uint16(@writer[w]+22) == !template[t]\n   )\n  )\n}"
