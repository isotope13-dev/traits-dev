# LSEEK from the start of the open handle to offset 0 (AX=4200h, CX=DX=0),
# then WRITE from DS:0100h: the running COM image is written over the
# beginning of the file. Segment/handle reloads may sit between the steps.
defaults:
  for:
  - dos_com
  - static-lib
  - data
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
- id: dos-seek-start-own-image-write
  desc: DOS rewinds file, writes COM image
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: B8 00 42 [0-10] (33|31) C9 [0-2] (33|31) D2 [0-2] CD 21 [0-4] B4 40 [0-2] (B9 ?? ?? BA 00 01|BA 00 01 B9 ?? ??) [0-2] CD 21
