defaults:
  platforms: [windows, unix]
  for: [c, text]

traits:
  - id: dos-asm-write-handle
    desc: DOS source selects handle-write service
    crit: notable
    conf: 0.9
    if:
      type: text
      # DOS INT 21h/40h requires loading AH (or AX) with the function
      # number.  Do not treat an unrelated instruction such as `test ah,40h`
      # in a C/C++ documentation comment as a file-write operation.
      regex: '(?i)\bmov\s+(ah\s*,\s*0?40h|ax\s*,\s*0?40[0-9a-f]{2}h)\b'
    unless:
      # IJG libjpeg jmemdosa.asm uses INT 21h/40h for JPEG backing-store I/O.
      - id: well-known/lib/media/libjpeg::libjpeg-codec-sources
      - id: well-known/lib/media/libjpeg::ijg-copyright-banner

