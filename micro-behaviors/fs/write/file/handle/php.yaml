defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: fputs
    mbc: C0052
    desc: Writes a string to an open file
    crit: notable
    conf: 0.8
    if:
      type: text
      word: fputs
    unless:
      - id: micro-behaviors/fs/write/file/handle::php-fputs
  - id: php-fwrite
    attack: T1546
    desc: Calls PHP fwrite()
    crit: notable
    if:
      type: symbol
      kind: call
      exact: fwrite
  - id: php-fputs
    attack: T1546
    desc: Calls PHP fputs function
    crit: notable
    if:
      type: symbol
      kind: call
      exact: fputs
composite_rules:
  - id: php-file-write
    attack: T1546
    desc: Writes data using PHP file API
    crit: notable
    any:
      - id: micro-behaviors/fs/write/file/handle::php-fwrite
      - id: micro-behaviors/fs/write/file/handle::php-fputs
      - id: micro-behaviors/fs/write/file/full::php-file-put-contents
