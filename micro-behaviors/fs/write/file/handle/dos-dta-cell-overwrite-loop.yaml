defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
- id: micro-behaviors/fs/write/file/handle::dos-dta-cell-sized-own-image-overwrite-loop
  desc: DTA own-image overwrite uses stored word count
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule dos_dta_cell_sized_own_image_overwrite_loop {\n strings:\n\n$loop = { B4 4E BA ?? ?? CD 21 72\
      \ ?? B8 02 3D BA 9E 00 CD 21 93 B4 40 8B 0E ?? ?? BA 00 01 CD 21 B4 3E CD 21 B4 4F EB ?? }\n$mask = /\\*\\\
      .[A-Za-z0-9*?]{1,3}\\x00/ nocase\n\n condition:\n#loop > 0 and #loop <= 32 and #mask <= 32 and\nfor any l\
      \ in (1..#loop) : (\n uint16(@loop[l]+22) >= 256 and uint16(@loop[l]+22)-256+2 <= filesize and\n uint16(uint16(@loop[l]+22)-256)\
      \ > 0 and\n @loop[l]+37+int8(@loop[l]+36) == @loop[l]+5 and\n for any m in (1..#mask) : (@mask[m]+256 == uint16(@loop[l]+3))\n\
      )\n}"
