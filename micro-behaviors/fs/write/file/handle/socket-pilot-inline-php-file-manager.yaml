# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - php
  - html
  - text
  - data
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.94
traits:
- id: php-path-file-write-edit-form
  desc: Writes data through a file handle
  if:
    type: text
    substr: fwrite($open,$data)
