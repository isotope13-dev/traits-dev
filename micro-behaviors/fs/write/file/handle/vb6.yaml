defaults:
  platforms: [windows]
  for: [vbs]
traits:
  - id: vb6-put-owner3
    for: [pe]
    desc: VB6 runtime binary file write
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: vbaPutOwner3
  - id: vb6-put-owner3-text
    for: [pe]
    desc: References the VB6 binary file-write helper name
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: __vbaPutOwner3
    unless:
      - id: vb6-put-owner3
  - id: vb6-put-binary-source
    desc: VB6 binary file put
    crit: baseline
    conf: 0.88
    if:
      type: text
      substr: Put #
composite_rules:
  - id: vb6-temp-exe-binary-write
    desc: VB6 writes temporary executable
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/fs/write/file/handle::vb6-put-binary-source
      - id: micro-behaviors/fs/write/file/target::vb6-temp-exe-output
