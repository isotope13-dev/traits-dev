defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: vb6-put-exe-suffix
    desc: VB6 Put file write with exe suffix clue
    crit: notable
    conf: 0.93
    all:
      - id: vb6-put3
      - id: micro-behaviors/fs/path/extension::utf16-exe-suffix-token
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library

  - id: vb6-write-exe-suffix
    desc: VB6 file write with exe suffix clue
    crit: notable
    conf: 0.93
    all:
      - id: vb6-binary-file-write
      - id: micro-behaviors/fs/path/extension::utf16-exe-suffix-token
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/runtime/native-platform/vb-richclient::vb-richclient-runtime-library
