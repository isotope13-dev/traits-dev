defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib]
  size_max: 65536

traits:
  # MOV BH,40h / XCHG AX,BX leaves the write service in AH and the
  # returned handle in BX. The bytes before the write INT 21h load the
  # buffer (often the COM image at 0100h) and the transfer length.
  - id: dos-int21-handle-write-setup
    for: [dos_com, data, c]
    desc: DOS write setup or lossy instruction bytes
    crit: notable
    conf: 0.90
    if:
      type: hex
      pattern: "(CD 21 [0-4] 93 [0-4] B4 40|CD 21 93 EB|CD 21 [0-8] B7 40 [0-4] 93 [0-8] CD 21|CD 21 [0-8] B7 40 [0-4] 93 EB|EF BF BD 21 EF BF BD EF BF BD 40)"
  - id: dos-int21-write
    for: [dos_com, static-lib, data]
    desc: DOS writes a file via INT 21h
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 40 [0-32] CD 21"
  - id: dos-int21-write-ax
    for: [dos_com, static-lib, data]
    desc: DOS write via MOV AX
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B8 ?? 40 [0-32] CD 21"
  - id: dos-int21-write-ax-far
    for: [dos_com, static-lib, data]
    desc: DOS AX-load write via saved far vector
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 00 40 [0-12] 9C 2E FF 1E"
  - id: dos-int21-write-far
    for: [dos_com, static-lib, data]
    desc: DOS write through a far call
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 40 [0-16] 2E FF 1E"
  - id: dos-int21-write-saved-vector
    for: [dos_com, static-lib, data]
    desc: DOS write via a saved handler
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: "B4 40 [0-24] 9C [0-1] FF 1E ?? ??"

  # Resident handlers copy the INT 21h vector onto a free slot (INT 61h and
  # the other user interrupts) and issue AH=40h through that alias. The
  # interrupt is anything except 21h: the real DOS service would recurse
  # into the hook.
  - id: dos-aliased-int-write
    for: [dos_com, static-lib, data, text]
    desc: DOS write via an aliased interrupt
    crit: notable
    conf: 0.9
    if:
      type: yara
      source: |
        rule dos_aliased_int_write {
          strings:
            $write = { B4 40 CD ~21 }
          condition:
            $write
        }

  # DOS COM infectors can keep INT 21h service numbers in a table and load
  # AH from memory immediately before the interrupt, hiding the usual
  # MOV AH,imm8 signatures.
  - id: dos-int21-write-xchg-bx
    for: [dos_com, static-lib, data]
    desc: DOS write via MOV BH and XCHG
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B7 40 [0-4] 93 [0-32] CD 21"
  - id: dos-int21-write-batch
    for: [batch]
    desc: DOS writes a file via INT 21h
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 40 [0-16] CD 21"
  - id: dos-int21-write-com-image-dx
    for: [dos_com, static-lib, data]
    desc: DOS writes 0100h image, DX first
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "BA 00 01 [0-8] B4 40 [0-8] CD 21"

  - id: dos-int21-write-com-image-ah
    for: [dos_com, static-lib, data]
    desc: DOS writes 0100h image, AH first
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "B4 40 [0-8] BA 00 01 [0-8] CD 21"
  # The write-only SI-buffer form (3D01h) copies SI into DX and CX
  # before writing through the returned handle. The DTA
  # filename and returned handle remain bound to the image-buffer write.
  # The cwd/MOV DL form spells the same DX=009Eh open in three bytes
  # (CWD clears DX after the positive AX load) and points the write at
  # the 0100h image with INC DH after a CWD-clearing seek; up to 32 bytes
  # of host setup may separate the handle from the image write.
  # The write-only MOV BX,AX form keeps the handle with 8B D8 (not XCHG)
  # and writes a word-sized copy of the 0100h image.
  - id: dos-com-self-image-handle-write
    for: [dos_com, data]
    desc: DOS writes COM image through file handle
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: "(B8 02 3D BA 9E 00 CD 21 93 B4 40 83 C2 62 B1 ?? CD 21|B8 02 3D BA 9E 00 CD 21 93 B4 40 83 C2 62 B9 ?? ?? CD 21|B8 02 3D BA 9E 00 CD 21 93 B4 40 89 F2 CD 21|B8 01 3D BA 9E 00 CD 21 93 B4 40 8B D6 8B CE CD 21|B8 02 3D 99 B2 9E CD 21 93 [0-32] B4 40 FE C6 [0-4] CD 21|BA 1B BC 8B D8 F5 81 EA 1B BB B9 ?? ?? B4 4F 80 EC 0F [0-4] CD 21|B8 01 3D [0-4] BA 9E 00 [0-4] CD 21 [0-4] 8B D8 [0-6] BA 00 01 [0-6] B4 40 [0-6] B9 ?? ?? [0-4] CD 21)"
  - id: dos-int21-write-jump
    for: [dos_com, static-lib, data]
    desc: DOS write jumps to shared call
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 40 EB"

  - id: dos-int21-write-return-stub
    desc: DOS handle-write interrupt followed by RET
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 40 CD 21 C3"

composite_rules:
  - id: dos-int21-write-call
    for: [dos_com, static-lib, data, text, batch, c]
    desc: DOS write syscall
    crit: notable
    conf: 0.86
    any:
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write-batch
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write-ax
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write-xchg-bx
      - id: metadata/binary/code/control-transfer::x86-ah40-e8-byte-proximity
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write-far
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write-ax-far
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write-jump
      - id: micro-behaviors/os/msdos/interrupt::int21-write-carry-check
      - id: micro-behaviors/fs/write/file/handle::dos-int21-write-saved-vector
      - id: micro-behaviors/fs/write/file/handle::dos-aliased-int-write

  - id: dos-image-or-extension-patched-file-write
    for: [dos_com, static-lib, data]
    desc: DOS image or extension-patched file write
    crit: notable
    conf: 0.97
    any:
      - id: dos-int21-write-com-image-dx
      - id: dos-int21-write-com-image-ah
      - id: dos-com-self-image-handle-write
      - id: micro-behaviors/fs/file/create::dos-dta-extension-create-buffer-write
