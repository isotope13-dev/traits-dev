defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
- id: micro-behaviors/fs/write/file/handle::dos-encrypted-body-append-header-redirect
  desc: Encrypted body append and EXE header redirect
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule dos_encrypted_body_append_header_redirect {\n strings:\n  $read = { B4 3F B9 ?? ?? BA ?? ?? CD\
      \ 21 }\n  $entry = { B9 10 00 F7 F1 2B 06 ?? ?? 89 16 ?? ?? A3 ?? ?? 05 00 00 A3 ?? ?? C7 06 ?? ?? 00 00 }\n\
      \  $copy = { B4 2C CD 21 89 16 ?? ?? B8 ?? ?? 8E C0 BF 00 00 8B F7 B9 ?? ?? F3 A5 06 1F 33 ED E8 ?? ?? B4\
      \ 40 B9 ?? ?? BA 00 00 CD 21 }\n  $header = { B8 02 42 E8 ?? ?? B9 00 02 F7 F1 40 89 16 ?? ?? A3 ?? ?? B8\
      \ 00 42 E8 ?? ?? B9 ?? ?? BA ?? ?? B4 40 CD 21 }\n  $decoder = { 3E 8B 96 ?? ?? 8D B6 ?? ?? B9 ?? ?? 31 14\
      \ 46 46 E2 FA C3 }\n  $seek = { 33 C9 99 CD 21 C3 }\n condition:\n  #read > 0 and #read <= 32 and #entry >\
      \ 0 and #entry <= 32 and #copy > 0 and #copy <= 32 and #header > 0 and #header <= 32 and #decoder > 0 and\
      \ #decoder <= 32 and #seek > 0 and #seek <= 32 and\n  for any r in (1..#read) : (\n   uint16(@read[r]+3) >=\
      \ 26 and uint16(@read[r]+3) <= 128 and\n   for any e in (1..#entry) : (\n    @entry[e] > @read[r] and @entry[e]-@read[r]\
      \ < 1024 and\n    uint16(@entry[e]+7) == uint16(@read[r]+6)+8 and\n    uint16(@entry[e]+11) == uint16(@read[r]+6)+20\
      \ and\n    uint16(@entry[e]+14) == uint16(@read[r]+6)+22 and\n    uint16(@entry[e]+20) == uint16(@read[r]+6)+14\
      \ and\n    uint16(@entry[e]+24) == uint16(@read[r]+6)+16 and\n    for any c in (1..#copy) : (\n     @copy[c]\
      \ == @entry[e]+!entry[e] and\n     uint16(@copy[c]+19)*2 == uint16(@copy[c]+33) and\n     uint16(@copy[c]+33)\
      \ >= 64 and uint16(@copy[c]+33) <= filesize and\n     for any d in (1..#decoder) : (\n      @copy[c]+30+int16(@copy[c]+28)\
      \ == @decoder[d] and\n      uint16(@decoder[d]+3) == uint16(@copy[c]+6) and\n      uint16(@decoder[d]+10)\
      \ > 0 and\n      uint16(@decoder[d]+7)+2*uint16(@decoder[d]+10) <= uint16(@copy[c]+33) and\n      (uint16(@decoder[d]+3)\
      \ < uint16(@decoder[d]+7) or uint16(@decoder[d]+3) >= uint16(@decoder[d]+7)+2*uint16(@decoder[d]+10)) and\n\
      \      for any h in (1..#header) : (\n       @header[h] > @copy[c]+!copy[c] and @header[h]-@copy[c] < 64 and\n\
      \       uint16(@header[h]+14) == uint16(@read[r]+6)+2 and uint16(@header[h]+17) == uint16(@read[r]+6)+4 and\n\
      \       uint16(@header[h]+26) == uint16(@read[r]+3) and uint16(@header[h]+29) == uint16(@read[r]+6) and\n\
      \       for any sk in (1..#seek) : (\n        @header[h]+6+int16(@header[h]+4) == @seek[sk] and\n        @header[h]+25+int16(@header[h]+23)\
      \ == @seek[sk]\n       )\n      )\n     )\n    )\n   )\n  )\n}"
