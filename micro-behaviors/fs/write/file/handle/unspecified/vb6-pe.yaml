defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
  - id: vb6-binary-file-write
    desc: VB6 runtime opens and writes file
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/file/open/unspecified::vb6-file-open
    any:
      - id: micro-behaviors/fs/write/file/handle/unspecified::vb6-put-owner3
      - id: micro-behaviors/fs/write/file/handle/unspecified::vb6-put3
      - id: micro-behaviors/fs/write/file/handle/unspecified::vb6-print-file
