# Inspect the actual code argument of an interpreter call. Anchoring to the
# beginning excludes comments, printed examples and a mere method-name string.
# These cover direct, leading operations, not arbitrary embedded programs.
defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.96

traits:
  - id: shell-node-inline-file-write
    desc: Inline Node code starts with fs.writeFileSync
    if:
      type: symbol
      kind: call
      regex: '(^|/)(node|nodejs)(\.exe)?$'
      args:
        - kind: identifier
          name_regex: '^(-e|--eval)$'
        - kind: string
          regex: '^\s*require\(["''](node:)?fs["'']\)\.writeFileSync\s*\('

  - id: shell-perl-inline-overwrite
    desc: Inline Perl opens files for overwrite
    if:
      type: symbol
      kind: call
      regex: '(^|/)perl(\.exe)?$'
      args:
        - kind: identifier
          name: -e
        - kind: string
          regex: '^\s*open\(\s*\w+\s*,\s*["'']>["'']\s*,'
