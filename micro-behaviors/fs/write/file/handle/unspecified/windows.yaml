# Windows file write APIs in C/C++ source code
defaults:
  for: [c, cpp]
  platforms: [windows]
traits:
  - id: write-file-source
    desc: WriteFile API in source code
    crit: notable
    conf: 0.88
    if:
      # kind: call — on source a bare `type: symbol` matches only
      # imports/functions, never call targets, so without this the trait was
      # inert on the C/C++ source it is scoped to.
      type: symbol
      kind: call
      exact: WriteFile
  # Listing fallback where no parser provides call facts (HTML/text views
  # of C source); combined with the symbol leg by the reference below.
  - id: write-file-source-listing
    desc: Listing calls WriteFile to write data
    crit: notable
    conf: 0.85
    for: [html, text]
    if:
      type: text
      regex: '\bWriteFile\s*\('
composite_rules:
  - id: write-file-source-reference
    desc: WriteFile call in source or listing
    for: [c, cpp, html, text]
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file-source
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file-source-listing
