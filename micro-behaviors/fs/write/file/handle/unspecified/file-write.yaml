defaults:
  platforms: [windows, unix]
traits:
  - id: file-write-request-token
    desc: File-write request command token
    crit: notable
    conf: 0.88
    for: [pe, dll, c, cpp, csharp, python]
    if:
      type: literal
      regex: '^(WriteFile|WritePath|PutFile)$'
  - id: file-write
    crit: notable
    desc: Writes to a file
    for:
      - javascript
    if:
      type: string_literal
      substr: SaveToFile
  - id: write-file
    desc: Write data to file handle
    crit: baseline
    conf: 0.9
    for: [pe, dll]
    platforms: [windows]
    if:
      type: symbol
      exact: WriteFile
  - id: writefile-api
    desc: WriteFile API string reference
    crit: notable
    conf: 0.9
    for: [pe, dll]
    platforms: [windows]
    count_min: 2
    if:
      type: text
      word: WriteFile
    unless:
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
  - id: writefile-api-text-reference
    desc: WriteFile API name in PE text
    crit: notable
    conf: 0.9
    for: [pe, dll, pyc]
    platforms: [windows]
    if:
      type: text
      word: WriteFile
    unless:
      - id: micro-behaviors/fs/write/file/handle/unspecified::write-file
  - id: lwrite
    desc: Legacy file write API
    crit: notable
    conf: 0.88
    ref: sha256:68fa7c436e293739e98bb04034db6d6a3e40a9b9991de5d147368fb696044499
    for: [pe, dll]
    platforms: [windows]
    if:
      type: symbol
      regex: ^_?lwrite$
