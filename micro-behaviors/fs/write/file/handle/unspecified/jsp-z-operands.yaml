defaults:
  platforms: [unix, windows]
  for: [jsp]
  crit: notable
  conf: 0.99
traits:
  - id: jsp-z1-file-z2-content-writer
    desc: JSP writes z2 contents to z1 file
    if:
      type: text
      substr: 'BufferedWriter bw=new BufferedWriter(new OutputStreamWriter(new FileOutputStream(new File(z1))));bw.write(z2);'
      exclude_html_comments: true
    unless:
      - type: text
        regex: '(?s)\bbw\s*=.*\bbw\s*='
