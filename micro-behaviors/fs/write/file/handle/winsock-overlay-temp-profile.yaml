defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: winsock-overlay-temp-process-profile
  desc: Winsock, TEMP write and PE overlay clues
  crit: suspicious
  conf: 0.95
  size_max: 262144
  all:
  - id: micro-behaviors/communications/socket/multiplex::winsock-event-loop
  - id: micro-behaviors/fs/write/file/handle::pe-temp-write-process-api-profile
  - id: metadata/binary/layout/overlay::overlay-dominates-third
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
