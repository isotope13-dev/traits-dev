defaults:
  platforms:
  - windows
  - unix
  size_max: 65536
composite_rules:
- for:
  - dos_com
  - static-lib
  id: dos-write-dispatch
  desc: DOS write-service or saved-vector call bytes
  crit: notable
  conf: 0.86
  any:
  - id: micro-behaviors/fs/write/file/handle::dos-int21-write
  - id: micro-behaviors/fs/write/file/handle::dos-write-via-farcall
  - id: metadata/binary/code/control-transfer::x86-ah40-e8-byte-proximity
traits:
- for:
  - dos_com
  - static-lib
  - data
  id: dos-write-via-farcall
  desc: DOS writes through a saved vector
  crit: notable
  conf: 0.88
  if:
    type: hex
    pattern: B4 40 [0-6] 9C 2E FF 1E
