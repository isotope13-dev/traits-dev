defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: component
  conf: 0.92
traits:
  # The call-symbol projection also contains C++ stream methods named write.
  # Require a free function with the native API's three arguments.
  - id: native-write-file-call
    crit: notable
    desc: Calls native write or sys_write
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @function
          arguments: (argument_list . (_) . (_) . (_) .)) @call
          (#match? @function "^(write|sys_write)$"))
