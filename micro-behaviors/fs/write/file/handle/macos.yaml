defaults:
  platforms: [macos, ios]
  for: [macho, dylib]
  mbc: C0052
traits:
  - id: nsfilehandle-write-data
    desc: NSFileHandle file writing
    crit: notable
    conf: 0.7
    if:
      type: symbol
      exact: writeData
  - id: nsfilemanager-create
    desc: NSFileManager file creation
    crit: baseline
    conf: 0.6
    if:
      type: symbol
      regex: createFileAtPath
composite_rules:
  - id: nsfilehandle-write
    desc: NSFileHandle file writing
    crit: notable
    conf: 0.7
    any:
      - id: micro-behaviors/fs/write/file/handle::nsfilehandle-write-data
      - id: micro-behaviors/fs/write/file/full::nsfilehandle-write-to-file
