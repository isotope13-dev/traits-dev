defaults:
  platforms: [macos, ios]
  for: [macho, dylib]
  mbc: C0052
traits:
  - id: nsfilehandle-write-data
    desc: NSFileHandle file writing
    crit: notable
    conf: 0.7
    if:
      type: symbol
      exact: writeData
composite_rules:
  - id: nsfilehandle-write
    desc: NSFileHandle file writing
    crit: notable
    conf: 0.7
    any:
      - id: micro-behaviors/fs/write/file/handle::nsfilehandle-write-data
      - id: metadata/file/profile/file-write-api::nsfilehandle-write-to-file
