defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536

traits:
  - id: dos-xor-masked-self-image-write-setup
    desc: XOR-masked DOS self-image write setup
    crit: notable
    conf: 0.95
    size_max: 4096
    if:
      type: yara
      source: |
        rule dos_xor_masked_self_image_write_setup {
          meta:
            filetypes = "dos_com,data"
          strings:
            $loop = { B1 ?? CD 21 B9 ?? 00 BE 03 01 80 34 ?? 46 E2 FA }
            $loop_iota = { B9 ?? 00 BE ?? 01 80 34 ?? 46 E2 FA [0-4] CD 21 }
          condition:
            for any i in (1..#loop) : (
              @loop[i] < 256 and
              for any off in (3..48) : (
                off + 5 < @loop[i] and
                uint8(@loop[i] + 12) ^ uint8(off) == 0xB4 and
                uint8(@loop[i] + 12) ^ uint8(off + 1) == 0x40 and
                uint8(@loop[i] + 12) ^ uint8(off + 2) == 0xBA and
                uint8(@loop[i] + 12) ^ uint8(off + 3) == 0x00 and
                uint8(@loop[i] + 12) ^ uint8(off + 4) == 0x01 and
                uint8(@loop[i] + 12) ^ uint8(off + 5) == 0xE8
              )
            )
            or
            for any i in (1..#loop_iota) : (
              @loop_iota[i] < 256 and
              for any off in (3..48) : (
                off + 4 < @loop_iota[i] and
                uint8(@loop_iota[i] + 8) ^ uint8(off) == 0xB4 and
                uint8(@loop_iota[i] + 8) ^ uint8(off + 1) == 0x40 and
                uint8(@loop_iota[i] + 8) ^ uint8(off + 2) == 0xBA and
                uint8(@loop_iota[i] + 8) ^ uint8(off + 3) == 0x00 and
                uint8(@loop_iota[i] + 8) ^ uint8(off + 4) == 0x01
              )
            )
        }
