# TEMP, WriteFile, and a process API coexist in the PE. The predicate does
# not bind the path written by WriteFile to the launched process target.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: pe-temp-write-process-api-profile
    desc: PE TEMP write near process API
    crit: suspicious
    conf: 0.85
    size_max: 524288
    all:
      - id: micro-behaviors/fs/temp/directory::get-temp-path-name
      - id: micro-behaviors/fs/write/file/handle::write-file
    any:
      - id: micro-behaviors/process/create/spawn::create-process-a
      - id: micro-behaviors/process/create/shellexec::shell-execute-a
    downgrade:
      any:
        - id: metadata/binary/installer/
        - id: metadata/signed/platform/
        - id: metadata/binary/vendor/
        - id: metadata/package/versioning/scheme::pe-version-resource
        - id: micro-behaviors/data/embedded/certificate::pkcs7-signeddata-oid
        - id: metadata/binary/symbols/count::many-imports
        - id: micro-behaviors/os/service/config/
    unless:
      - id: well-known/lib/runtime/native-platform/dbus/
      - id: well-known/lib/runtime/compiled/gnu-libintl/
