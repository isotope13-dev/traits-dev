defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: pe-temp-write-process-api-profile
  desc: PE TEMP, file-write, and process API references
  crit: notable
  conf: 0.85
  size_max: 524288
  all:
  - id: micro-behaviors/os/sysinfo/directories::win32-temp-path-name
  - id: micro-behaviors/fs/write/file/handle::write-file
  any:
  - id: metadata/binary/symbols/name/process::create-process-a
  - id: micro-behaviors/process/create/shellexec::shell-execute-a
