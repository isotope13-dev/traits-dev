defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-open-write-binary
    crit: notable
    mbc: C0016
    desc: Python opens file for binary write
    conf: 0.85
    if:
      type: string_literal
      regex: open\(.{1,220}['"]wb['"]\)
    unless:
      - type: text
        substr: "Usage::"
      - type: text
        substr: "Example usage::"
  - id: py-write
    desc: Python write method call
    crit: baseline
    conf: 0.5
    if:
      type: symbol
      kind: call
      regex: '\.write(_bytes|_text)?$'
  - id: py-file-write-call
    desc: Python file handle write() call
    crit: baseline
    conf: 0.78
    if:
      type: text
      regex: '\b(file|fh|fp|handle)\.write\('
  - id: py-stream-write-call
    desc: Python stream write() call
    crit: baseline
    conf: 0.78
    if:
      type: text
      regex: '\b(stream|stdout|stderr|out)\.write\('
  - id: py-log-write-call
    desc: Python log write() call
    crit: baseline
    conf: 0.76
    if:
      type: text
      substr: log.write(
  - id: py-open-write-inline
    desc: Inline open().write() file creation
    crit: notable
    conf: 0.8
    downgrade:
      any:
        - id: well-known/lib/format/nokogiri::library-reference
        - id: well-known/lib/format/xml2
    if:
      type: symbol
      kind: call
      exact: open.write
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/build/toolchain::xcode-platform-args-build-context
  - id: py-pathlib-open-write-call
    desc: pathlib Path.open write mode
    crit: notable
    conf: 0.82
    if:
      type: symbol
      kind: call
      exact: Path.open
      arg:
        kind: string
        regex: '^[wabx][bt+]*$'
composite_rules:
  - id: py-write-call
    desc: Python file or stream write() call
    crit: baseline
    conf: 0.78
    any:
      - id: micro-behaviors/fs/write/file/handle::py-file-write-call
      - id: micro-behaviors/fs/write/file/handle::py-stream-write-call
      - id: micro-behaviors/fs/write/file/handle::py-log-write-call
      - id: micro-behaviors/fs/write/file/handle::py-write
  - id: py-inline-write-executable-path
    desc: Inline write to executable/script path
    crit: notable
    conf: 0.86
    all:
      - id: micro-behaviors/fs/write/file/handle::py-open-write-inline
      - id: micro-behaviors/fs/write/file/target::py-open-executable-path
  - id: py-pathlib-open-write-executable-path
    desc: pathlib open writes executable path
    crit: notable
    conf: 0.86
    all:
      - id: micro-behaviors/fs/write/file/handle::py-pathlib-open-write-call
      - id: micro-behaviors/fs/write/file/target::py-pathlib-executable-path
  - id: python-binary-write-pattern
    crit: notable
    mbc: C0016
    desc: Binary file write pattern
    conf: 0.85
    any:
      - id: python-open-write-binary
      - id: micro-behaviors/fs/write/file/full::python-pathlib-write-bytes
