defaults:
  platforms: [windows, unix]
  for: [rust]
  attack: T1041
traits:
  - id: rust-write-all
    desc: Named Rust file writer writes all bytes
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\b(file|output_file|file_writer)\.write_all\s*\('
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
