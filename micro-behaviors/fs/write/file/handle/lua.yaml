defaults:
  platforms: [unix, windows]
  for: [lua]
traits:
  - id: lua-open-write-mode
    desc: Lua opens file in write mode
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: 'io\.open\s*\(.{0,80},\s*"w"'
  - id: lua-open-append-mode
    desc: Lua opens a file for append
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: 'io\.open\s*\(.{0,80},\s*"a"'
