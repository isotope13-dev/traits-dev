# The decryptor's word key changes per infection. Compare encrypted words to
# that key so the interrupt hook and COM infection code survive re-encryption.
defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_max: 65536
  attack: T1080

traits:
  - id: resident-word-xor-com-write
    desc: XOR encoded COM infection and file writes
    crit: notable
    if:
      type: yara
      source: |
        rule dos_resident_word_xor_com_write {
          strings:
            $d = { 1e 06 50 0e 07 b9 a2 01 bf ?? ?? b8 ?? ?? 26 31 05 47 47 e2 f9 }
          condition:
            for any i in (1..#d) : (
              @d[i] + 0x1e2 < filesize and
              (uint16(@d[i] + 0xcd) ^ uint16(@d[i] + 12)) == 0x8126 and
              (uint16(@d[i] + 0xcf) ^ uint16(@d[i] + 12)) == 0x2e3d and
              (uint16(@d[i] + 0xd1) ^ uint16(@d[i] + 12)) == 0x7543 and
              (uint16(@d[i] + 0x1bb) ^ uint16(@d[i] + 12)) == 0x40b4 and
              (uint16(@d[i] + 0x1bd) ^ uint16(@d[i] + 12)) == 0x15b9
            )
        }

