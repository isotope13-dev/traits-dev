defaults:
  for: [text]
  platforms: [windows, unix]

traits:
  - id: dos-source-offset-buffer-call
    desc: DOS source selects offset write buffer
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)mov\s+ah,0?40h[\s\S]{0,180}mov\s+dx,offset\s+\w+'
  - id: dos-source-com-image-buffer
    desc: DOS write buffer selects COM image
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)mov\s+ah,0?40h[\s\S]{0,180}mov\s+dx,0?100h'
  - id: dos-source-five-byte-transfer
    desc: DOS source selects five-byte write
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)mov\s+ah,0?40h[\s\S]{0,120}mov\s+cx,5\b'
