defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: java-open-output-stream-call
    desc: Java opens an output stream for writing
    crit: notable
    conf: 0.88
    for: [java]
    if:
      type: symbol
      kind: call
      exact: openOutputStream
  - id: java-fileoutputstream-source
    desc: Java FileOutputStream construction
    crit: notable
    conf: 0.8
    platforms: [android, unix, windows]
    for: [java]
    if:
      type: text
      substr: new FileOutputStream
  - id: kotlin-fileoutputstream-source
    desc: Kotlin FileOutputStream construction
    crit: notable
    conf: 0.9
    platforms: [android, unix, windows]
    for: [kotlin]
    if:
      type: symbol
      kind: call
      exact: FileOutputStream
  - id: java-fos-simple
    desc: Java FileOutputStream class reference
    crit: notable
    conf: 0.88
    for: [java]
    if:
      type: text
      word: FileOutputStream
  - id: jvm-fileoutputstream-bytecode
    desc: JVM imports FileOutputStream class
    crit: notable
    conf: 0.86
    for: [class, jar]
    if:
      type: import
      exact: java/io/FileOutputStream
  - id: java-filewriter-source
    desc: Java FileWriter usage
    crit: notable
    conf: 0.8
    for: [java]
    if:
      type: text
      substr: new FileWriter
  - id: java-fileoutputstream-file-handle
    desc: Java FileOutputStream on File handle
    crit: notable
    conf: 0.8
    for: [java]
    if:
      type: text
      substr: new FileOutputStream(f)
composite_rules:
  - id: jvm-fileoutputstream-source
    desc: JVM source constructs FileOutputStream
    crit: notable
    conf: 0.9
    platforms: [android, unix, windows]
    for: [java, kotlin]
    any:
      - id: micro-behaviors/fs/write/file/handle::java-fileoutputstream-source
      - id: micro-behaviors/fs/write/file/handle::kotlin-fileoutputstream-source
  - id: jvm-direct-file-write-source
    desc: Java or Kotlin direct file write
    crit: notable
    conf: 0.9
    platforms: [android, unix, windows]
    for: [java, kotlin]
    any:
      - id: micro-behaviors/fs/write/file/handle::java-fileoutputstream-source
      - id: micro-behaviors/fs/write/file/handle::kotlin-fileoutputstream-source
      - id: micro-behaviors/fs/write/file/full::java-files-write-source
      - id: micro-behaviors/fs/write/file/full::kotlin-direct-byte-write-source
