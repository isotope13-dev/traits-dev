defaults:
  crit: notable
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: java-open-output-stream-call
    desc: Java opens an output stream for writing
    conf: 0.88
    for: [java]
    if:
      type: symbol
      kind: call
      exact: openOutputStream
  - id: java-randomaccessfile-write-mode
    desc: Java opens RandomAccessFile in write mode
    conf: 0.85
    platforms: [android, unix, windows]
    for: [jsp, java, kotlin, groovy, html, javascript, python, vbs]
    if:
      type: text
      regex: 'new\s+RandomAccessFile\s*\([^;]{0,120}["'']rw'
composite_rules:
  - id: jvm-direct-file-write-source
    desc: Java or Kotlin direct file write
    conf: 0.9
    platforms: [android, unix, windows]
    for: [java, kotlin]
    any:
      - id: micro-behaviors/fs/write/file/stream::java-fileoutputstream-source
      - id: micro-behaviors/fs/write/file/stream::kotlin-fileoutputstream-source
      - id: metadata/file/profile/file-write-api::java-files-write-source
      - id: micro-behaviors/fs/write/file/full/unspecified::kotlin-direct-byte-write-source
