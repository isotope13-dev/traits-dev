defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
- id: dos-time-dta-own-image-prefix-overwrite
  desc: Time-gated DTA own-image prefix overwrite loop
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule dos_time_dta_own_image_prefix_overwrite {\n strings:\n\n$loop = { B4 2C CD 21 80 FE ?? 7F ?? B0\
      \ ?? A2 ?? ?? B4 4E BA ?? ?? CD 21 72 ?? B8 01 3D BA 9E 00 CD 21 B7 40 BA 00 01 93 B1 ?? CD 21 B4 3E CD 21\
      \ FE 0E ?? ?? 74 ?? B4 4F EB ?? }\n$mask = /\\*\\.[A-Za-z0-9]{1,3}\\x00/ nocase\n condition:\n#loop > 0 and\
      \ #loop <= 32 and #mask <= 32 and\nfor any a in (1..#loop) : (\n uint8(@loop[a]+6) < 59 and uint16(@loop[a]+12)\
      \ == uint16(@loop[a]+47) and\n @loop[a]+55 + int8(@loop[a]+54) == @loop[a]+16 and\n for any m in (1..#mask)\
      \ : (@mask[m]+256 == uint16(@loop[a]+17))\n)\n}"
