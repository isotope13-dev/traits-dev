defaults:
  crit: notable
  platforms: [unix]
  for: [perl]
traits:
  - id: overwrite-target-open
    desc: Open target file for overwrite
    conf: 0.95
    not:
      - regex: 'open\s*\(\s*STD(IN|OUT|ERR)\s*,\s*">\s*/dev/null"\s*\)'
    if:
      type: text
      regex: 'open\s*\(?\s*\w+\s*,\s*">\s*[^&>\s"][^"\n]{0,120}"\s*\)?'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: print-buffer-to-target
    desc: Print buffer into target
    conf: 0.85
    if:
      type: text
      regex: 'print\s+[A-Za-z_][A-Za-z0-9_]*\s+\$[A-Za-z_][A-Za-z0-9_]*\s*;'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
composite_rules:
  - id: overwrite-file
    desc: Overwrite file with buffered content
    conf: 0.92
    all:
      - id: micro-behaviors/fs/write/file/handle::overwrite-target-open
      - id: micro-behaviors/fs/write/file/handle::print-buffer-to-target
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
