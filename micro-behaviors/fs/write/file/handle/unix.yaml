defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, dll, c, cpp, objc]
traits:
- id: fputc
  desc: Write single bytes to file
  crit: baseline
  conf: 0.66
  if:
    type: symbol
    exact: fputc
- id: write--fwrite
  desc: References fwrite file-write API
  crit: baseline
  conf: 0.66
  if:
    type: symbol
    exact: fwrite
