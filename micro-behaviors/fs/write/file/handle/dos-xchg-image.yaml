defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536

traits:
  # Create-new leaves CX=0100h; XCHG CX,DX makes it the write buffer.
  # Bind the transfer count to a span containing the complete write loop.
  - id: dos-xchg-image-write-find-next
    desc: Writes COM image then finds next match
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule dos_xchg_image_write_find_next {
          meta:
            filetypes = "dos_com,data"
          strings:
            $write = { B4 5B B9 00 01 CD 21 72 0A 93 B4 40 BA ?? ?? 87 D1 CD 21 B4 4F EB ?? }
            $write_shared = { B4 5B CD 21 72 ?? 93 B4 40 BA ?? ?? [0-1] 87 D1 EB ?? }
            $write_nop = { B4 5B CD 21 72 ?? 90 90 93 B4 40 BA ?? ?? 90 87 D1 EB ?? }
            $write_direct = { B4 5B CD 21 72 ?? 93 B4 40 BA ?? ?? [0-1] 87 D1 CD 21 [0-2] B4 4F EB ?? }
          condition:
            for any w in (1..#write) : (
              uint16(@write[w]+13) >= @write[w]+!write[w] and
              uint16(@write[w]+13) <= filesize
            ) or
            for any w in (1..#write_shared) : (
              uint16(@write_shared[w]+10) >= @write_shared[w]+!write_shared[w] and
              uint16(@write_shared[w]+10) <= filesize
            ) or
            for any w in (1..#write_nop) : (
              uint16(@write_nop[w]+12) >= @write_nop[w]+!write_nop[w] and
              uint16(@write_nop[w]+12) <= filesize
            ) or
            for any w in (1..#write_direct) : (
              uint16(@write_direct[w]+10) >= @write_direct[w]+!write_direct[w] and
              uint16(@write_direct[w]+10) <= filesize
            )
        }
