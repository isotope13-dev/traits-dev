# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - php
  - html
  - text
  - data
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.95
traits:
- id: php-path-upload-handler
  desc: Moves a received upload to a file
  if:
    type: text
    substr: move_uploaded_file($_FILES
