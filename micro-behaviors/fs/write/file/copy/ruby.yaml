defaults:
  for:
    - ruby
  platforms:
    - unix
    - windows
traits:
  - id: io-copy-stream
    desc: Ruby IO.copy_stream uses a filename
    crit: notable
    conf: 0.85
    if:
      type: tree-sitter
      query: |
        ((call receiver: (constant) @io method: (identifier) @copy
          arguments: (argument_list (string) @path)) @call
         (#eq? @io "IO") (#eq? @copy "copy_stream"))
  # Text form for `ruby -e '...'` command lines that do not parse as Ruby.
  - id: ruby-io-copy-stream-call-text
    desc: Ruby IO.copy_stream call in text
    crit: notable
    conf: 0.85
    for: [ruby, shell]
    if:
      type: text
      regex: '\bIO\.copy_stream\(\s*[a-z_]'
