defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  # An exact API symbol names a complete download-to-file operation, which is
  # independently useful evidence in a diff; it is not merely a fragment.
  crit: notable
  conf: 0.9

traits:
  - id: download-to-file-symbol
    desc: JavaScript download-to-file symbol
    if:
      type: symbol
      exact: downloadToFile
