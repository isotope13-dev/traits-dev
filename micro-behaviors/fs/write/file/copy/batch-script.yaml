defaults:
  for: [batch, html, javascript, powershell, vbs]
  platforms: [windows]
traits:
  - id: batch-loop-copy-to-script
    desc: Copies loop entry to temporary script
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bcopy\s+(/y\s+)?"?%%?\w"?\s+"?%(TEMP|LOCALAPPDATA)%[\\/][^"&]{1,80}\.(vbs|js|hta)\b'
