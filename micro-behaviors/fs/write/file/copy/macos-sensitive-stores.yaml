defaults:
  platforms: [macos]
  for: [python]
  crit: notable
traits:
  - id: python-keychain-db-copy-binding
    desc: Python copies a login-keychain path
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (block
          (expression_statement (assignment
            left: (identifier) @source
            right: (binary_operator right: (string (string_content) @suffix))))
          (if_statement consequence: (block
            (expression_statement (call
              function: (attribute object: (identifier) @module attribute: (identifier) @method)
              arguments: (argument_list . (identifier) @used_source)))) )
          (#eq? @source @used_source)
          (#eq? @module "shutil")
          (#eq? @method "copyfile")
          (#match? @suffix "(?i)/Library/Keychains/login\\.keychain-db$")
        )
  - id: python-ssh-directory-copy-binding
    desc: Python copies an SSH directory path
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (block
          (expression_statement (assignment
            left: (identifier) @source
            right: (binary_operator right: (string (string_content) @suffix))))
          (if_statement consequence: (block
            (expression_statement (call
              function: (attribute object: (identifier) @module attribute: (identifier) @method)
              arguments: (argument_list . (identifier) @used_source)))) )
          (#eq? @source @used_source)
          (#eq? @module "shutil")
          (#eq? @method "copytree")
          (#eq? @suffix "/.ssh")
        )
