defaults:
  platforms:
    - macos
    - ios
  for:
    - macho
    - dylib
  mbc: C0052
traits:
  - id: nsfilemanager-move
    desc: NSFileManager file move operation
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: moveItemAt(Path|URL):to(Path|URL)
  - id: nsfilemanager-copy
    desc: NSFileManager file copy operation
    crit: baseline
    conf: 0.6
    if:
      type: text
      regex: copyItemAt(URL|Path)
