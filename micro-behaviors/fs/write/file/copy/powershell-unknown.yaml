defaults:
  for: [powershell]
  platforms: [windows]
traits:
- id: copy-file-times
  desc: Copies file timestamps to payload
  crit: suspicious
  conf: 0.92
  attack: T1070.006
  if:
    type: text
    regex: '\[IO\.File\]::Set(Creation|LastAccess|LastWrite)Time'
  unless:
  - id: well-known/app/system/moonshiner::seed-fixture-tree
