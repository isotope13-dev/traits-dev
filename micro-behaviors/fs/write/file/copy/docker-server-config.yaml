# Neutral evidence; intent requires additional context.
traits:
- id: docker-server-config-copy
  desc: Docker COPY targets server configuration
  crit: notable
  conf: 0.85
  for:
  - dockerfile
  platforms:
  - unix
  if:
    regex: (?im)^\s*COPY\s[^\n]{1,60}/etc/(nginx|apache2|httpd)/
    type: text
