defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.98
traits:
  - id: desktop-full-environment-json
    desc: Writes full process environment to Desktop JSON
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((statement_block
          (lexical_declaration
            (variable_declarator name: (identifier) @desktop
              value: (call_expression function: (member_expression property: (property_identifier) @join)
                arguments: (arguments (call_expression function: (member_expression property: (property_identifier) @home))
                  (string (string_fragment) @desktop_literal)))))
          (lexical_declaration
            (variable_declarator name: (identifier) @info
              value: (object (pair key: (property_identifier) @key
                value: (member_expression object: (identifier) @process property: (property_identifier) @env)))))
          (lexical_declaration
            (variable_declarator name: (identifier) @destination
              value: (call_expression function: (member_expression property: (property_identifier) @join2)
                arguments: (arguments . (identifier) @desktop2 (string)))))
          (expression_statement
            (call_expression function: (member_expression property: (property_identifier) @write)
              arguments: (arguments . (identifier) @destination2
                (call_expression function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
                  arguments: (arguments . (identifier) @info2))))))
          (#eq? @join "join")
          (#eq? @join2 "join")
          (#eq? @home "homedir")
          (#eq? @desktop_literal "Desktop")
          (#eq? @key "env")
          (#eq? @process "process")
          (#eq? @env "env")
          (#eq? @write "writeFileSync")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @desktop @desktop2)
          (#eq? @destination @destination2)
          (#eq? @info @info2))
