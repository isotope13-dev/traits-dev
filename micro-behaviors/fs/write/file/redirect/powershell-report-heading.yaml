defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.98

traits:
- id: powershell-credential-report-heading-write
  desc: Writes credential/history report headings
  if:
    type: text
    regex: '(?im)"\[\*\](LOGINS|HISTORY|PASSWORDS|COOKIES)[^"\r\n]{0,20}"\s*\|\s*Out-File\b'
