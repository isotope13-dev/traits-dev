# Extensionless shell test inputs may be identified as text, without an AST.
# Require a complete quoted echo argument followed by an output operator and
# variable destination. A comparison or quoted '>' alone cannot satisfy this.
defaults:
  platforms: [unix]
  for: [text]
  crit: notable
  conf: 0.9
traits:
  - id: text-echo-variable-file-redirect
    desc: Echo command redirects output to variable path
    if:
      type: text
      regex: '(?m)^echo[ \t]+"[^"\\\r\n]{1,160}"[ \t]+>>?[ \t]*"?\$\{?[A-Za-z_]\w*'
