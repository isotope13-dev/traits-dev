# Evidence describes ordinary capabilities or static properties.
traits:
- platforms:
  - unix
  for:
  - shell
  id: base64-output-to-file
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  desc: Redirects Base64 decoder output to file
  crit: notable
  if:
    type: text
    regex: base64\s+(-d|--decode)\s*>\s*\$?[A-Za-z_]
