defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: shell-cat-heredoc-file-write
    desc: Shell cat writes heredoc to file
    crit: notable
    conf: 0.96
    if:
      # Some regression scripts deliberately exercise malformed/multiple
      # heredocs that terminate the parser's AST early. Retain the complete
      # cat + file output redirect + heredoc command form in those files.
      type: text
      regex: '(?m)^[ \t]*cat[ \t]+>>?[ \t]*[^ \t\r\n<>]{1,160}[ \t]+<<-?[ \t]*\w+'
