traits:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  id: echo-append-batch-script-text
  desc: ECHO append text targets Batch script suffix
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: echo\s+[^>]{0,120}>>[^\n]{0,120}\.(bat|cmd)
  unless:
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
