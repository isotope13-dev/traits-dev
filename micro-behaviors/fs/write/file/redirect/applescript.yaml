# Require both the shell-command construction and a quoted path operand
# after its output redirect. This is file I/O, without a collection claim.
defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  crit: notable
  conf: 0.95

traits:
  - id: applescript-shell-quoted-output-path
    desc: AppleScript shell redirects to a quoted path
    if:
      type: text
      regex: 'do shell script [^\r\n]{1,140}>[\\ ]*"\s*&\s*quoted form of \w+'

