defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: preinstall-writes-module-source
    desc: Preinstall declares redirection into source file
    crit: notable
    conf: 0.93
    if:
      type: value
      path: "scripts.preinstall"
      regex: '>\s*[\w./-]{0,40}\.(js|mjs|cjs|ts|py|rb)\b'
  - id: postinstall-writes-module-source
    desc: Postinstall redirects output into source file
    crit: notable
    conf: 0.93
    if:
      type: value
      path: "scripts.postinstall"
      regex: '>\s*[\w./-]{0,40}\.(js|mjs|cjs|ts|py|rb)\b'
