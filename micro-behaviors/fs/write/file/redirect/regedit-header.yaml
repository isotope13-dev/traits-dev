# Echoing a registry-format header writes file content; it does not import it.
defaults:
  platforms: [windows]
  for: [text, reg, ne, batch]
traits:
  - id: echo-regedit-header-redirect
    desc: Echo writes registry header to file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\becho\s+(REGEDIT\s?4?|Windows Registry Editor Version(\s+5\.00)?)\s*>>?'
