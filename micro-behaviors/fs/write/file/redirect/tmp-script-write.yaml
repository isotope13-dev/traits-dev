# Writing a helper script under a temp directory via cat redirection. The
# write and its tmp script target are the claim; whether the script is later
# executed is a separate observation (deployment consumers add that evidence).
# Moved here from privilege-escalation/modify-service: a tmp helper write is
# neutral staging evidence, not service modification or elevation.
defaults:
  platforms: [unix, windows]
  for: [shell]
  crit: notable
  conf: 0.9
traits:
- id: tmp-helper-script-write
  desc: Redirects cat output into a tmp script
  if:
    type: text
    regex: 'cat > \S*/tmp/\S*\.sh\b'
