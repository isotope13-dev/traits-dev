defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.93

traits:
  - id: printed-download-pipeline-append
    desc: Prints download-to-shell pipeline for appending
    if:
      type: text
      regex: '\b(printf|echo) .{0,40}\b(curl|wget) .{0,160}\|\s*(ba|z)?sh[\\''"]+\s*>>'
  - id: source-shell-startup-append-target
    desc: Shell startup filename follows append redirect
    if:
      type: text
      regex: '>>[^\r\n;|]{0,100}\.(bash(rc|_profile)|z(shrc|profile))\b'
