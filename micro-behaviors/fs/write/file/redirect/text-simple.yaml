defaults:
  platforms: [unix]
  for: [text]
  crit: notable
  conf: 0.94
traits:
  - id: text-echo-quoted-file-redirect
    desc: Quoted echo output redirected to named file
    if:
      type: text
      regex: '(?m)^echo[ \t]+"[^"\\\r\n]{0,160}"[ \t]+>[ \t]*[\w./-]+[ \t]*$'
  - id: text-echo-word-file-redirect
    desc: Echo word output redirected to named file
    if:
      type: text
      regex: '(?m)^echo[ \t]+[\w.-]+[ \t]+>[ \t]*[\w./-]+[ \t]*$'
  # Shebang-free regression inputs are classified as text. Require an echo
  # command, an unquoted word argument, and a quoted parameter destination;
  # quoted examples and comparison operators do not establish this write.
  - id: text-echo-word-parameter-file-redirect
    desc: Echo word redirects to quoted parameter path
    if:
      type: text
      regex: '(?m)^echo[ \t]+[\w.-]+[ \t]*>>?[ \t]*"\$[\w@*][^"\\$\r\n]{0,64}"[ \t]*$'
  - id: text-pid-suffixed-file-truncate
    desc: Truncating redirect to PID-suffixed filename
    if:
      type: text
      regex: '(?m)^[ \t]*>[ \t]*[A-Za-z_][\w.-]*\$\$([ \t]|$)'
