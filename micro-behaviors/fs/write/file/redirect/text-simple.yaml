defaults:
  platforms: [unix]
  for: [text]
  crit: notable
  conf: 0.94
traits:
  - id: text-echo-word-file-redirect
    desc: Echo word output redirected to named file
    if:
      type: text
      regex: '(?m)^echo[ \t]+[\w.-]+[ \t]+>[ \t]*[\w./-]+[ \t]*$'
  - id: text-pid-suffixed-file-truncate
    desc: Truncating redirect to PID-suffixed filename
    if:
      type: text
      regex: '(?m)^[ \t]*>[ \t]*[A-Za-z_][\w.-]*\$\$([ \t]|$)'
