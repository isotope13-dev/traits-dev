defaults:
  platforms: [windows]
  for: [html, javascript, powershell, batch]


traits:
  - id: findstr-temp-redirect
    desc: Findstr output redirected to TEMP
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bfindstr(\.exe)?\b[^>\r\n]{0,400}\\[^>\r\n]{0,80}>\s*["'']?%TEMP%'
    not:
      - regex: '(?i)\bfindstr(\.exe)?\b[^\r\n>]*\s/[a-z]*v'
      - regex: '(?i)\brequirements\.txt\b'
