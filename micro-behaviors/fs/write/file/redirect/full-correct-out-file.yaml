defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.88

traits:
  - id: out-file
    conf: 0.9
    desc: Calls PowerShell Out-File
    if:
      type: symbol
      kind: call
      regex: (?i)^Out-File$
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
