defaults:
  platforms:
    - "windows"
  for:
    - "batch"
traits:
  - 
    id: "regfile-registered-owner-echo"
    desc: "Writes owner identity into registry script"
    crit: "notable"
    conf: 0.96
    if:
      type: "text"
      regex: "(?im)^\\s*echo\\s+\"Registered(Owner|Organization)\"=\"[^\"\\r\\n]{1,120}\"\\s*>>"
