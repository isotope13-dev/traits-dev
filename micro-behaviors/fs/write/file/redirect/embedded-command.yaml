# Shell command text can be embedded in an agent configuration or instructions.
# A file destination plus 2>&1 establishes logging, not concealment.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json, yaml, markdown, text]
traits:
  - id: shell-file-output-and-stderr-merge
    desc: Shell text redirects both output streams
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '>{1,2}\s*/[A-Za-z0-9_./-]{1,160}\s+2>&1\b'
