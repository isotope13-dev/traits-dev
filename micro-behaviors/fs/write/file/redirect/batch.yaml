# Shell output redirection writes file content without a file API.
defaults:
  for: [batch]
  platforms: [windows]
traits:
  - id: batch-echo-redirect
    desc: Batch ECHO redirects content to file
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?im)^\s*\(?\s*e\^?c\^?h\^?o\s+.{1,200}>>?\s*'

  - id: batch-type-appends-to-param-path
    desc: Batch TYPE appends into parameter path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\btype\s+[^\s>\r\n]{1,60}>>\s*%+\d'

  - id: batch-append-redirect
    desc: Batch appends output to file path
    crit: notable
    conf: 0.75
    mbc: C0016
    unless:
      - id: batch-echo-redirect
      - id: batch-type-appends-to-param-path
      - type: basename
        regex: ^UpdateGenVersion\.bat$
    if:
      type: text
      # Ignore `>>` occurring in opaque padding and require a command-like
      # line rather than an arbitrary long variable-expansion token.
      regex: '(?m)^[ \t]*[A-Za-z][\w.-]{1,20}([ \t]+[^>\r\n]{0,200})?>>[ \t]*[\w%~\\./-]+'
      case_insensitive: true
