defaults:
  platforms:
  - windows
traits:
- id: batch-repeated-base64-alphabet-writes
  desc: Batch writes repeated base64-alphabet lines
  crit: suspicious
  conf: 0.9
  for:
  - batch
  count_min: 3
  if:
    type: tree-sitter
    language: batch
    query: "(redirect_stmt\n  (cmd (command_name) @tool (argument_list) @data)\n  (redirection (redirect_op) @op (redirect_target) @target)\n  (#match? @tool \"(?i)^echo$\")\n  (#match? @data \"^[A-Za-z0-9+/=]{80,}\\\\s*$\")\n  (#match? @op \"^1?>{1,2}$\"))"
