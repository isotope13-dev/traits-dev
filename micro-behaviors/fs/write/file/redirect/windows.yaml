defaults:
  crit: notable
  conf: 0.9
  platforms: [windows]
  for: [pe, c, cpp, go, rust, csharp]

traits:
  - id: disable-wow64-filesystem-redirection
    desc: Disables WOW64 filesystem redirection
    if:
      type: symbol
      exact: Wow64DisableWow64FsRedirection

  # cmd.exe form that names stdout before append (`1>>file`). Ordinary `>>`
  # redirection is common; the explicit `1>>` spelling is rarer and shows up in
  # operator manuals that capture recon output. The redirect target must be a
  # path character: allowing any non-space made FASTA/SSEARCH report headers
  # (" 1>>>sp|P55685|Y4WG_RHISN ...") read as a cmd.exe append.
  - id: cmd-stdout-append-redirect
    desc: cmd.exe appends via explicit stdout redirect
    for: [batch, powershell, scripts]
    if:
      type: text
      regex: '(?i)(^|[\s|&])1>>\s*[^\s>&|]'
