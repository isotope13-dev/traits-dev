defaults:
  crit: notable
  platforms: [unix]
  for: [shell]

traits:
  - id: shell-heredoc-system-config-write
    desc: Shell writes system config via heredoc
    conf: 0.94
    if:
      # A system configuration write is analyst-relevant, but neutral by
      # itself. Source-code concealment is inferred only when the staging
      # composite also finds an embedded program in the same shell script.
      type: text
      regex: '(?im)^\s*cat\s*>\s*/etc/\S{1,80}\.(conf|cfg)\b[^\r\n]{0,40}<<'
  - id: shell-watchdog-feed-redirect
    desc: Shell redirects data to hardware watchdog
    conf: 0.9
    platforms: [linux, android]
    if:
      type: text
      regex: '\b(printf|echo|dd)\b[^\n]{0,80}>\s*/dev/(misc/)?watchdog[0-9]*'
  - id: shell-watchdog-feed-dd
    desc: Shell dd writes to hardware watchdog
    conf: 0.88
    platforms: [linux, android]
    if:
      type: text
      regex: '\bdd\b[^\n]{0,80}of=/dev/(misc/)?watchdog[0-9]*'
  # Keep the text matchers for printf/dd, including dd's `of=` form. Echo uses
  # the parsed redirect node below: raw text cannot distinguish a real `>` from
  # angle-bracket placeholders inside a quoted usage string.
  # Plain text regex, broadened to binaries like noop-exit-shebang-script-write
  # below: a Go/ELF binary that shells out to `exec.Command("sh", "-c", ...)`
  # carries the same command string in its data section.
  - id: binary-shell-printf-file-write
    desc: Binary contains printf output redirect text
    conf: 0.86
    # File default platforms: [unix] silently drops Pe from `binaries` (a
    # Windows-only type) unless overridden here.
    platforms: [unix, windows]
    # Shell-only (plus binaries carrying shell command strings): in every
    # other script language `printf` is a function call, so a statement like
    # Ruby's `printf fmt, v.to_i > 9 ? ...` reads the `>` comparison as a
    # redirect. The `(^|[;&])` anchor already keeps this at statement
    # position, which is exactly where those calls live.
    for: [binaries]
    if:
      type: text
      # A backslash-newline continues this shell command before redirection.
      regex: '(?im)(^|[;&])\s*printf\b([^\r\n]|\\\r?\n){0,160}(>[^&]|of=)'
  - id: shell-printf-file-redirect
    desc: Shell printf redirects output to a file
    conf: 0.94
    if:
      type: tree-sitter
      query: |
        ([
          (redirected_statement
            body: (command name: (command_name (word) @command))
            redirect: (file_redirect [">" ">>"] destination: (_) @destination))
          (redirected_statement
            body: (list (command name: (command_name (word) @command)) .)
            redirect: (file_redirect [">" ">>"] destination: (_) @destination))
        ] @write
         (#eq? @command "printf")
         (#not-match? @destination "^[\"']?/dev/(tcp/|udp/|null[\"']?$)"))
  # No-op shebang body (`exit 0` / `true`) written via printf/echo — the write
  # half of a filesystem exec capability probe (create, chmod, run, delete),
  # not payload staging. Broadened to binaries so the same string in a Go/ELF
  # data section still identifies. Real droppers that printf a payload body
  # still match shell-printf-file-write / shell-echo-file-write without this.
  - id: noop-exit-shebang-script-write
    desc: Writes no-op exit-0 shebang script
    conf: 0.9
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)\b(printf|echo)\s+[''"]#!/((usr/bin/env\s+)|(bin/))(ba)?sh\\n(exit 0|true)\\n[''"]\s*>'
  - id: shell-echo-file-write
    desc: Shell echo redirects output to file
    conf: 0.86
    if:
      type: tree-sitter
      query: |
        ((redirected_statement
           body: (command
             name: (command_name (word) @command))
           redirect: (file_redirect
             [">" ">>"]
             destination: (_) @destination))
         (#eq? @command "echo")
         (#not-match? @destination "^/dev/null$"))
  - id: shell-dd-file-write
    desc: Shell dd writes output to a file
    conf: 0.86
    platforms: [unix, windows]
    for: [shell, binaries]
    if:
      type: text
      # Require an operand assignment or input redirection before a later
      # sink. Arbitrary positional words matched shuffled resource padding.
      regex: '(?m)(^|[;&])\s*dd\b\s*((\w+=|<\s*)\S+[^\n|;&]{0,160})?(\bof=|1?>[^&])'
      case_insensitive: true
    unless:
      - id: metadata/binary/installer/script::install4j-unix-sfx
      - id: metadata/lang/encoding::non-ascii-script-text
      - id: well-known/lib/data/sqlite::powershell-embedded-system-data-sqlite

  - id: shell-output-redirect-to-data
    desc: Shell output redirected into /data
    conf: 0.9
    if:
      type: text
      regex: '>\s*/data/'
    unless:
      - id: well-known/tool/sysadmin/cubesandbox::cubesandbox-source-path
  - id: shell-rc-redirect-write
    desc: Redirects output to user shell RC
    conf: 0.9
    if:
      type: text
      regex: '>>?\s*["'']?(\$HOME|~)/\.(bashrc|bash_profile|zshrc|zprofile|profile|zlogin)\b'
    unless:
      - id: metadata/package/files/ecosystem::conda-shell-activation-layout
  - id: shell-root-rc-redirect-write
    desc: Redirects output to root shell RC
    conf: 0.94
    if:
      type: text
      regex: '>>?\s*["'']?/root/\.(bashrc|bash_profile|zshrc|zprofile|profile|zlogin)\b'
  - id: shell-home-rc-redirect-write
    desc: Redirects output to home shell RC
    conf: 0.92
    if:
      type: text
      regex: '>>?\s*["'']?/home/[^/\s]{1,64}/\.(bashrc|bash_profile|zshrc|zprofile|profile|zlogin)\b'
  - id: shell-periodic-cron-redirect-write
    desc: Redirects output to periodic cron script
    conf: 0.94
    if:
      type: text
      regex: '>>?\s*["'']?/etc/cron\.(daily|hourly|weekly|monthly)/[A-Za-z0-9._-]+'

  - id: shell-resolver-config-redirect
    desc: Shell redirects resolver configuration content
    conf: 0.92
    if:
      type: text
      regex: '(?im)(^|[;&])\s*(echo|printf)\b.{0,120}>\s*/etc/resolv\.conf\b'
  - id: shell-truncating-redirect-variable-target
    desc: Shell truncating redirect into a variable path
    conf: 0.88
    if:
      # `> "$out"`, `echo > $f`, `: > $f` as the statement itself -- a
      # truncating (single-`>`) redirect whose target is a variable, with no
      # producing command. A `wget ... > $f` or `echo data > $f` form is an
      # ordinary capture and deliberately does not match: the redirect must
      # open the statement (after `;`, `&`, `|` or line start). Neutral
      # alone; it becomes evidence only when a consumer binds the variable
      # to something sensitive.
      type: text
      regex: '(?im)(^|[;&|])\s*(echo\s*)?(:\s*)?>\s*"?\$[a-zA-Z_]\w*"?'

  - id: shell-resolver-config-tee
    desc: Shell tees content into resolver configuration
    conf: 0.92
    if:
      type: text
      regex: '(?im)(^|[;&])\s*tee\s+(-a\s+)?/etc/resolv\.conf\b'
  - id: heredoc-writes-c-source
    desc: Heredoc writes C source to disk
    for: [shell, text]
    conf: 0.92
    if:
      type: text
      regex: '(cat|tee)\s*>+\s*\S+\.(c|cc|cpp|m)\s*<<'
  - id: local-program-output-redirect
    desc: Redirects local program output to a file
    for: [makefile, shell, text]
    conf: 0.85
    # `./bf-test>bf-test.out` -- the helper's stdout becomes a file.
    if:
      type: text
      regex: '\./[\w.-]{1,40}\s*>\s*\.?/?[\w.-]{1,40}'
  # The persisted line itself fetches remote content. A remote-fetch hint
  # elsewhere in the file (a reinstall pointer, a usage string) plus a PATH
  # prepend must not read as a bootstrap, so the cue and the redirect share
  # one line; proximity gates alone do not hold this apart on real files.
  - id: shell-rc-redirect-remote-fetch-line
    desc: RC redirect line fetches remote content
    conf: 0.92
    if:
      type: text
      regex: '(?i)(curl|wget|https?://)[^\n>]{0,40}>>?[^\n]{0,16}\.(bashrc|zshrc|profile|zlogin)\b'

composite_rules:
  - id: shell-printf-file-write
    desc: Shell printf redirects output to a file
    conf: 0.86
    platforms: [unix, windows]
    for: [shell, binaries]
    any:
      - id: shell-printf-file-redirect
      - id: binary-shell-printf-file-write
  - id: shell-watchdog-feed
    desc: Shell watchdog keepalive write
    conf: 0.9
    any:
      - id: shell-watchdog-feed-redirect
      - id: shell-watchdog-feed-dd
  # shell-echo-file-write is tree-sitter/AST-only and stays shell-only; the
  # printf/dd legs are plain text and now also cover binaries, so widen the
  # composite itself to match their union.
  - id: shell-file-write-command
    desc: Shell command writes output to a file
    conf: 0.86
    platforms: [unix, windows]
    for: [scripts, binaries]
    any:
      - id: shell-printf-file-write
      - id: shell-echo-file-write
      - id: shell-dd-file-write
  - id: shell-rc-redirect-operation
    desc: Redirects output to shell startup file
    any:
      - id: shell-rc-redirect-write
      - id: shell-root-rc-redirect-write
      - id: shell-home-rc-redirect-write
