defaults:
  platforms:
    - "windows"
  for:
    - "batch"
traits:
  - 
    id: "batch-user-host-collector-output"
    desc: "Collects output under user-host filename"
    crit: "notable"
    conf: 0.96
    if:
      type: "text"
      regex: "(?im)^\\s*\\S+\\.exe[^>\\r\\n]{0,80}>[^\\r\\n]{0,100}%username%[^\\r\\n]{0,30}%computername%"
