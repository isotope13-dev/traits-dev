# AUTOEXEC.BAT runs at every DOS boot. Appending the running script to it, or
# calling it straight away, is how a batch virus both persists and fires.
defaults:
  platforms: [windows]
  for: [batch]
  conf: 0.92
traits:
  - id: batch-type-self-append-autoexec
    desc: Batch appends own script to AUTOEXEC.BAT
    crit: suspicious
    if:
      type: text
      regex: '(?i)\btype\s+%0(\.bat)?\s*>>\s*"?[a-z]:\\autoexec\.bat\b'

  - id: batch-call-autoexec
    desc: Batch calls AUTOEXEC.BAT directly
    crit: notable
    if:
      type: text
      regex: '(?im)^\s*call\s+"?[a-z]:\\autoexec\.bat\b'
  # echo @call name >> C:\autoexec.bat plants a boot-time call.
  - id: batch-echo-call-autoexec
    desc: Echoes a CALL into AUTOEXEC.BAT
    crit: notable
    if:
      type: text
      regex: '(?i)echo\s+@?call\s+\S{1,40}\s*>>\s*"?[a-z]:\\autoexec\.bat'
