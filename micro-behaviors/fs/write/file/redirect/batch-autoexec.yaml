# AUTOEXEC.BAT runs at every DOS boot. Redirecting any command's output into
# it replaces the boot-time configuration with whatever the command prints;
# appending the running script to it, or calling it straight away, is how a
# batch virus both persists and fires. Collector-renamed batch files arrive
# as plain text, so the redirect atoms also scan the text scope.
defaults:
  platforms: [windows]
  for: [batch]
  conf: 0.92
traits:
  - id: batch-type-self-append-autoexec
    desc: Batch appends own script to AUTOEXEC.BAT
    crit: suspicious
    if:
      type: text
      regex: '(?i)\btype\s+%0(\.bat)?\s*>>\s*"?[a-z]:\\autoexec\.bat\b'

  - id: batch-call-autoexec
    desc: Batch calls AUTOEXEC.BAT directly
    crit: notable
    if:
      type: text
      regex: '(?im)^\s*call\s+"?[a-z]:\\autoexec\.bat\b'
  # echo @call name >> C:\autoexec.bat plants a boot-time call.
  - id: batch-echo-call-autoexec
    desc: Echoes a CALL into AUTOEXEC.BAT
    crit: notable
    if:
      type: text
      regex: '(?i)echo\s+@?call\s+\S{1,40}\s*>>\s*"?[a-z]:\\autoexec\.bat'
  # Any command whose output is redirected into the boot file overwrites or
  # appends to it (`dir c:\*.exe/s/b>c:\autoexec.bat`, `echo …>>c:\autoexec.bat`).
  # Replaces the echo-only spelling, which missed non-echo redirects.
  - id: batch-redirect-into-autoexec
    desc: Redirects command output into AUTOEXEC.BAT
    crit: suspicious
    conf: 0.94
    for: [batch, text]
    if:
      type: text
      regex: '(?im)^[\t ]*[^>][^\r\n]{0,120}>\s*"?[a-z]:\\autoexec\.bat\b'
  - id: batch-autoexec-recursion-payload
    desc: Echoes autoexec name into redirect
    crit: suspicious
    conf: 0.94
    for: [batch, text]
    if:
      type: text
      regex: '(?im)^[\t ]*@?echo\s+autoexec(\.bat)?>'
