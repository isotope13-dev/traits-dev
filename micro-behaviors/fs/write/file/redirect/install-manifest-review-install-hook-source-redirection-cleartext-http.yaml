defaults:
  platforms: [unix, windows]
  for: [package.json]
composite_rules:
  - id: install-hook-source-redirection-cleartext-http
    desc: Install hook has source redirection and cleartext HTTP clues
    crit: suspicious
    conf: 0.96
    for: [npm, tar, package.json, javascript, typescript, python, ruby]
    scope: archive
    any:
      - id: micro-behaviors/fs/write/file/redirect::preinstall-writes-module-source
      - id: micro-behaviors/fs/write/file/redirect::postinstall-writes-module-source
    all:
      - id: micro-behaviors/communications/http/request/target::cleartext-http-request-target
