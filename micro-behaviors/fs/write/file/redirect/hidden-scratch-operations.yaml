defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
  - python
  - javascript
  - elf
traits:
- id: hidden-scratch-redirect-text-14
  desc: Shell redirection text names hidden scratch path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '>\s*[^\n>]{0,120}(/var/tmp/|/dev/)\.[a-zA-Z0-9][\w.-]{2,120}\b'
- id: hidden-scratch-redirect-text-15
  desc: Shell redirection text names hidden scratch path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (^|\s)>\s*['"]?/(run|mnt)/\.[\w.-]+
  unless:
  - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-native-runtime
