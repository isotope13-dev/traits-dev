defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
  - python
  - javascript
  - elf
traits:
- id: hidden-scratch-redirect-text-14
  desc: Shell redirection text names hidden scratch path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '>\s*[^\n>]{0,120}(/var/tmp/|/dev/)\.[a-zA-Z0-9][\w.-]{2,120}\b'
  not:
    - substr: statSync("/run/.containerenv
    - regex: /(tmp|var/tmp|run|dev/shm)/\.(netdata|X11|ICE|Test|cache|gnupg|config)[a-zA-Z0-9._-]*
    - regex: mktemp\s+-d\s+/(tmp|var/tmp|run|dev/shm)/\.[A-Za-z0-9][A-Za-z0-9._-]{1,64}\.X{3,}
    - regex: /(tmp|var/tmp|run|dev/shm)/\.spinner\.pid\b
    - regex: /tmp/\.[A-Za-z0-9._-]*(check|probe|test)[A-Za-z0-9._-]*
- id: hidden-scratch-redirect-text-15
  desc: Shell redirection text names hidden scratch path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (^|\s)>\s*['"]?/(run|mnt)/\.[\w.-]+
  unless:
  - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-native-runtime
  not:
    - regex: /(tmp|var/tmp|run|dev/shm)/\.(netdata|X11|ICE|Test|cache|gnupg|config)[a-zA-Z0-9._-]*
    - regex: /(tmp|var/tmp|run|dev/shm)/\.spinner\.pid\b
