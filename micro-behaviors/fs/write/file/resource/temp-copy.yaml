defaults:
  for: [pe]
  platforms: [windows]
composite_rules:
- id: resource-edit-copy-temp-api-cluster
  desc: Resource-edit, copy and temporary-file APIs
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/fs/write/file/resource::begin-update-resource-a
  - id: micro-behaviors/fs/write/file/resource::update-resource-a
  - id: micro-behaviors/fs/write/file/resource::end-update-resource-a
  - id: micro-behaviors/fs/file/copy::copyfile-a
  - id: micro-behaviors/fs/temp/directory::get-temp-file-name
  any:
  - id: micro-behaviors/fs/directory/readdir::find-file-walker
  - id: micro-behaviors/data/embedded/payload/resource::pe-magic-in-rsrc
  unless:
  - id: metadata/binary/symbols/count::many-exports-200
  downgrade:
    any:
    - id: metadata/package/testing/presence/corpus::binary-test-fixture-member
