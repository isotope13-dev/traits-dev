defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

traits:
  - id: rcdata-update-between-overwrite-copies-x86
    desc: RCDATA update between linked overwrite copies
    crit: notable
    conf: 0.97
    if:
      type: yara
      # Two calls use the same IAT slot and the same frame-local path.
      # In the first it is the destination; in the second it is the source.
      # The intervening bytes must contain the RCDATA update-call layout.
      source: |
        rule copied_temp_path_overwrites_input_x86 {
          strings:
            $out = { 6A 00 8D 85 ?? ?? ?? ?? 50 8D 8D ?? ?? ?? ?? 51 FF 15 ?? ?? ?? ?? }
            $back = { 6A 00 8B 45 ?? 50 8D 8D ?? ?? ?? ?? 51 FF 15 ?? ?? ?? ?? }
            $resource = { 8B 85 ?? ?? ?? ?? 50 8B 8D ?? ?? ?? ?? 51 68 ?? ?? ?? ?? 6A ?? 6A 0A 8B 95 ?? ?? ?? ?? 52 FF 15 ?? ?? ?? ?? }
          condition:
            for any i in (1..#out) : (
              for any j in (1..#back) : (
                @back[j] > @out[i] and @back[j] - @out[i] < 1024 and
                uint32(@out[i] + 4) == uint32(@back[j] + 8) and
                uint32(@out[i] + 18) == uint32(@back[j] + 15) and
                $resource in (@out[i]..@back[j])
              )
            )
        }
