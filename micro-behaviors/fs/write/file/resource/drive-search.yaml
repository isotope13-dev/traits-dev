# API co-occurrence does not prove executable resource infection. In the
# reviewed Delphi program UpdateResourceA writes RT_ICON, not executable code.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: drive-exe-search-resource-edit-api-set
    desc: Drive and EXE search with resource-edit APIs
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/write/file/resource::begin-update-resource-a
      - id: micro-behaviors/fs/write/file/resource::update-resource-a
      - id: micro-behaviors/fs/write/file/resource::end-update-resource-a
      - id: micro-behaviors/fs/enumerate/drives::get-logical-drive-strings
      - id: micro-behaviors/fs/search::inline-exe-wildcard-mask
    any:
      - id: micro-behaviors/fs/directory/readdir::find-first-file-a
      - id: micro-behaviors/fs/directory/readdir::find-next-file-a
