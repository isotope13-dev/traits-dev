defaults:
  conf: 0.8
  platforms:
    - unix
    - windows
  for:
    - python
composite_rules:
  - id: python-file-write-evidence
    desc: Python file-write evidence
    crit: component
    any:
      - id: micro-behaviors/fs/write/file/handle/unspecified::python-open-write-binary
      - id: micro-behaviors/fs/write/file/response-body::python-write-response-content
      - id: micro-behaviors/fs/write/file/handle/unspecified::py-inline-write-executable-path
