defaults:
  platforms:
  - windows
  for:
  - powershell
  - pe
  - csharp
traits:
- id: dotnet-file-openwrite-text
  desc: System.IO.File OpenWrite text
  crit: notable
  conf: 0.72
  if:
    type: text
    regex: System\.IO\.File\.OpenWrite|\[System\.IO\.File\]::OpenWrite
- id: dotnet-file-append-text
  desc: System.IO.File append method text
  crit: notable
  conf: 0.68
  if:
    type: text
    regex: System\.IO\.File\.Append(All(Lines|Text)?|Text)?
- id: dotnet-file-create-text
  desc: System.IO.File create method text
  crit: notable
  conf: 0.66
  if:
    type: text
    regex: System\.IO\.File\.Create(Text)?
