defaults:
  platforms:
    - windows
    - unix
  for:
    - javascript
    - typescript
  crit: notable
traits:
  - id: node-writefile-aliased-import
    desc: Imports aliased Node fs writeFile API
    conf: 0.94
    if:
      type: text
      regex: writeFile\s+as\s+\w+[\s\S]{0,80}from["'](node:)?fs/promises["']
  - id: writefilesync-name-literal
    desc: writeFileSync named by a string constant
    conf: 0.8
    if:
      type: literal
      kind: string
      exact: writeFileSync
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
  - id: writefilesync-lower-first-b64-literal
    desc: writeFileSync named by lower-first Base64 string
    conf: 0.85
    if:
      type: literal
      kind: string
      regex: '^D3jPDgvgAwXLu3LUyW={0,2}$'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
  - id: node-write-file-sync
    desc: writeFileSync member reference
    if:
      type: symbol
      kind: member
      regex: (^|\.)writeFileSync$
  - id: node-write-file-sync-call
    desc: writeFileSync call name
    if:
      type: symbol
      kind: call
      regex: (^|\.)writeFileSync$
  - id: node-write-file-sync-statement
    desc: writeFileSync call text
    conf: 0.92
    for:
      - pe
      - elf
    if:
      type: raw
      regex: (?i)(fs\.)?writeFileSync\s*\(
  - id: node-project-file-atomic-write
    desc: writeProjectFileAtomically call name
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: writeProjectFileAtomically
  - id: js-fs-write-sync
    desc: Node fs writeSync or writeFileSync call
    if:
      type: symbol
      kind: call
      regex: ^fs\.write(File)?Sync$
    unless:
      - id: metadata/file/format/news::serialized-news-article-catalog
  - id: write-file-call-target
    desc: Unqualified writeFile call
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: writeFile
# One observation in three spellings: a member reference, a string
# constant, or the lower-first Base64 string-table form. Reference the
# group to keep its cardinality in enclosing needs: clauses.
composite_rules:
- id: write-file-sync-any-form
  desc: writeFileSync member, literal, or encoded
  conf: 0.9
  any:
  - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync
  - id: micro-behaviors/fs/write/file/unspecified::writefilesync-name-literal
  - id: micro-behaviors/fs/write/file/unspecified::writefilesync-lower-first-b64-literal
