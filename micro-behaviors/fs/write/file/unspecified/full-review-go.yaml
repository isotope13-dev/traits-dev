defaults:
  crit: notable
  platforms: [windows, unix]
  for: [go]
traits:
  - id: ioutil-write-file
    desc: ioutil.WriteFile symbol reference
    conf: 0.8
    if:
      type: symbol
      exact: ioutil.WriteFile
  # Stripped Go binaries keep the call only as a string-table name, where the
  # symbol fact never forms; the text twin preserves the write observation there.
  - id: ioutil-writefile-text
    desc: References io/ioutil.WriteFile by name
    conf: 0.8
    for: [go, elf, macho, pe]
    if:
      type: text
      word: io/ioutil.WriteFile
  - id: go-write-file-method-call
    desc: WriteFile method call text
    conf: 0.6
    if:
      type: text
      substr: .WriteFile(
