defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: findings-verdict-write-clues
    desc: Findings, verdict and file-write text
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: "findings\\.xml[^\\r\\n]{0,300}RESEARCHER_POISONED_VERDICT[^\\r\\n]{0,220}writeFileSync"
