composite_rules:
- platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
  for:
  - javascript
  - typescript
  id: node-local-write-process-clues
  desc: Node local write and process clues
  crit: component
  conf: 0.75
  not:
  - regex: execSync\s*\(\s*`?['"]?plutil\s+-convert\s+xml1
  all:
  - id: micro-behaviors/fs/write/file/full/unspecified::write-file-sync
  - id: micro-behaviors/fs/path/construct::javascript-local-path
  any:
  - id: micro-behaviors/process/create/shell/command-string::js-exec
  - id: micro-behaviors/process/create/shell/command-string::execSync-call
  - id: micro-behaviors/process/create/subprocess/launch::spawn-call
  near_lines: 80
  downgrade:
    any:
    - id: well-known/lib/development/prettier
  unless:
  - id: well-known/tool/development/mobile/react-native-white-label::xcode-white-label-project-context
