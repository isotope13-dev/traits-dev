defaults:
  platforms: [unix, windows]
  for: [javascript]
traits:
  - id: install-hook-hacked-marker-file
    desc: File write with compromise marker text
    # Injection tests write "hacked" canaries; the install-hook composite in
    # objectives/impact/deface/proof carries the intent.
    crit: notable
    conf: 0.94
    if:
      type: text
      case_insensitive: true
      regex: writeFileSync\([^)]{0,400}(hacked|hackeado|pwned|supply.{0,2}chain attack)
    unless:
      - id: metadata/package/documentation/security-advisory::osv-advisory-report-structure
      - id: metadata/file/format/news::serialized-news-article-catalog
      - type: text
        regex: '[→➜]\s*writeFileSync'
      - id: metadata/package/testing/presence/fixture::defanged-disabled-effect-context
      - id: metadata/path/directory::test-directory-component
