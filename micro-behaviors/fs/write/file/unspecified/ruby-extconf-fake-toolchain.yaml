# StubMaker-class RubyGems install hook: fake native-extension toolchain.
# Instead of compiling, the recipe writes empty Makefile targets and no-op
# compiler stand-ins (make_stub / make_stub.bat) so `gem install` reports
# success while a relative helper performs network fetch/exec.
#
# Technique class — not campaign-name gated. Future gems that stub the
# extension phase the same way should still match.
defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  - id: make-stub-unix-script
    desc: Ruby opens or writes make_stub
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bFile\.(write|open)\s*\(\s*[''"]make_stub[''"]'
  - id: make-stub-windows-batch
    desc: Ruby opens or writes make_stub.bat
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bFile\.(write|open)\s*\(\s*[''"]make_stub\.bat[''"]'

composite_rules:
  - id: fake-extension-make-stubs
    desc: Ruby opens or writes make_stub files
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/fs/write/file/unspecified::make-stub-unix-script
      - id: micro-behaviors/fs/write/file/unspecified::make-stub-windows-batch
  - id: stubmaker-fake-toolchain
    desc: Empty Makefile and stub file clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/fs/write/file/unspecified::extconf-writes-empty-makefile
      - id: micro-behaviors/fs/write/file/unspecified::fake-extension-make-stubs
