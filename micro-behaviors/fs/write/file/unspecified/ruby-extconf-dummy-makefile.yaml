# Supply Chain: Dummy Makefile Detection
# Detects pre-packaged Makefiles designed to bypass build failures
# ATT&CK: T1195.002 (Compromise Software Supply Chain)
defaults:
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.9
composite_rules:
  - id: extconf-writes-empty-makefile
    desc: extconf.rb writes a dummy Makefile with empty targets
    crit: suspicious
    conf: 0.95
    for: [ruby]
    scope: file
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/fs/write/file/target::ruby-makefile-write
    any:
      - id: metadata/lang/source/literal/embedded-source::empty-makefile-target-sequence
      - id: metadata/lang/source/literal/embedded-source::escaped-empty-makefile-target-sequence
    # A recipe that also builds through mkmf/rb_sys (create_makefile,
    # create_rust_makefile) writes the stub only on engines it cannot build
    # for (JRuby, TruffleRuby) and falls back to a pure-Ruby backend. The
    # fact stays visible to the stub-toolchain composites at notable.
    downgrade:
      any:
        - id: metadata/build/package/recipe/gemspec::extconf-mkmf-build-script
  # The gem declares a native extension, but the recipe never calls mkmf --
  # it hand-writes a Makefile so `gem install` reports success, then talks to
  # the network. Nothing is compiled; the extension declaration exists only to
  # obtain code execution on the installing host. The `unless` keeps recipes
  # that really do build something (and merely stub a Makefile on unsupported
  # platforms) out of this.
