defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
composite_rules:
  - id: postinstall-source-rewrite-clues
    for: [npm, package.json, javascript, typescript]
    desc: Postinstall package has source rewrite clues
    crit: suspicious
    conf: 0.96
    # The manifest hook delegates to a sibling helper; requiring all legs in
    # one leaf file misses the package-level rewrite behavior.
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/fs/write/file/unspecified::node-write-file-sync
    any:
      - id: micro-behaviors/fs/write/file/unspecified::postinstall-source-entry-write
      - id: micro-behaviors/fs/write/file/content::node-prepends-import-to-source
    unless:
      - id: well-known/app/development/codeam-cli::codeam-cli-benign-maintenance-context
