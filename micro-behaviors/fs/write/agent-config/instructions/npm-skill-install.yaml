defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, package.json]
composite_rules:
  - id: postinstall-bundled-skill-copy-clues
    desc: Postinstall and bundled skill copy clues
    crit: suspicious
    conf: 0.96
    for: [npm, tar, package.json, javascript, typescript, markdown]
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/fs/write/copy::node-home-agent-skill-copy
      - id: metadata/package/agent-skill::agent-skill-frontmatter
  - id: postinstall-remote-skill-write-clues
    desc: Postinstall, fetch and skill-write clues
    crit: suspicious
    conf: 0.93
    for: [javascript, typescript, package.json, npm]
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/communications/http/request/client::js-fetch-implementation-call
      - id: micro-behaviors/communications/ipc/mcp::mcp-resource-method-references
      - id: micro-behaviors/fs/write/file/target::writes-agent-skill-tree
      - id: micro-behaviors/fs/path/agent-config/directory::ai-agent-skill-install-directory
  - id: postinstall-auth-resource-skill-write-clues
    desc: Postinstall, auth resource and skill-write clues
    crit: suspicious
    conf: 0.96
    for: [javascript, typescript, package.json, npm]
    scope: archive
    all:
      - id: metadata/package/scripts/entrypoint::postinstall-runs-node-script
      - id: micro-behaviors/communications/ipc/mcp::mcp-resource-authentication-references
      - id: micro-behaviors/fs/write/file/target::writes-agent-skill-tree
      - id: micro-behaviors/fs/path/agent-config/directory::ai-agent-skill-install-directory
