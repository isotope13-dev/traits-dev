defaults:
  for: [javascript]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: node-write-soul-path
    desc: Writes response text to SOUL.md
    if:
      type: symbol
      kind: call
      regex: '(^|\.)writeFileSync$'
      args:
        - index: 0
          from:
            value: '(^|/)SOUL[.]md$'
            through:
              - call: '(^|\.)join$'
                arguments: [0, 1, 2, 3, 4]
        - index: 1
          from:
            call: '\.text$'
