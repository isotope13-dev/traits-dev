defaults:
  for: [javascript, typescript, python, lua, markdown]
  platforms: [unix, windows]
  crit: notable
composite_rules:
  - id: python-mcp-client-config-writer
    desc: Python writes an MCP client configuration
    crit: notable
    conf: 0.9
    for: [python]
    all:
      - id: micro-behaviors/fs/path/agent-config/mcp::mcp-config-json-filename
      - id: micro-behaviors/communications/mcp/client::mcp-client-config-key
      - id: micro-behaviors/fs/write/file/full/string::python-pathlib-write-text
    unless:
      - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-bundle-text
      - id: well-known/app/ai/agent-runtime/simba-ai::rlm-engine-path
      - id: well-known/app/ai/agent-runtime/ouroboros::codex-mcp-section-template
