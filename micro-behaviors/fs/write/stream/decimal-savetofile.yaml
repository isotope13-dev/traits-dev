# Delimited decimal character codes (any one-character separator) that spell
# the ADODB.Stream SaveToFile method, in either common capitalisation.
defaults:
  for: [html, javascript, vbs]
  platforms: [windows]
  crit: notable
  conf: 0.95
traits:
  - id: decimal-savetofile-method
    desc: Decimal char codes spell SaveToFile method
    if:
      type: text
      regex: '(^|\D)83\D97\D118\D101\D(84|116)\D111\D(70|102)\D105\D108\D101(\D|$)'
