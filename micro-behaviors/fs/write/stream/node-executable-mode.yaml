defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-write-stream-executable-mode
    size_max: 262144
    desc: Node write stream requests executable mode
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: [(identifier) @callee
                     (member_expression property: (property_identifier) @callee)]
          arguments: (arguments . (_) . (object
            (pair key: [(property_identifier) @key
                        (string (string_fragment) @key)] value: (number) @mode)))
          (#match? @callee "^(createWriteStream|WriteStream)$")
          (#eq? @key "mode")
          (#match? @mode "^(0[oO]?[0-7]?([1357][0-7]{2}|[0-7][1357][0-7]|[0-7]{2}[1357])|448|0[xX]1[cC]0)$"))
        (new_expression
          constructor: [(identifier) @callee
                        (member_expression property: (property_identifier) @callee)]
          arguments: (arguments . (_) . (object
            (pair key: [(property_identifier) @key
                        (string (string_fragment) @key)] value: (number) @mode)))
          (#eq? @callee "WriteStream")
          (#eq? @key "mode")
          (#match? @mode "^(0[oO]?[0-7]?([1357][0-7]{2}|[0-7][1357][0-7]|[0-7]{2}[1357])|448|0[xX]1[cC]0)$"))
