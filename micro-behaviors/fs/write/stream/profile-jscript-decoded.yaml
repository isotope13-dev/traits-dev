defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: jscript-base64-adodb-profile
    desc: JScript base64 and ADODB creation clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/data/decode/base64/unspecified::base64-decode-call-text
      - id: micro-behaviors/fs/write/file/stream::js-adodb-stream-create
