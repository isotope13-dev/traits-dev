# Default MD5-XOR escaped-code fingerprint of a stream Write call whose
# argument is an XMLHTTP ResponseBody member. Source variables are template
# structure; no endpoint, dropped filename or collected sample name is matched.
# Decoded expression: ["\167\162\151\164\145"](cuteqqcn["\x72\x65\x73\x70\x6F\x6E\x73\x65\x42\x6F\x64\x79"]);
defaults:
  for: [html, javascript]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
  - id: md5-xor-http-body-stream-write-part-1
    desc: MD5-XOR fragment of HTTP-body stream Write
    crit: component
    if:
      type: text
      substr: "h%1B%3ET%0FVe%0"
  - id: md5-xor-http-body-stream-write-part-2
    desc: MD5-XOR fragment of HTTP-body stream Write
    crit: component
    if:
      type: text
      substr: "2%04W%3E%04%04%01%3DW%06Uj%03%0C%02Gk%1AQ%13L%5D%14GQ%5Db@9AV%0BoJSWiI"
  - id: md5-xor-http-body-stream-write-part-3
    desc: MD5-XOR fragment of HTTP-body stream Write
    crit: component
    if:
      type: text
      substr: "%07R%3AHV%06n@%01%23jJ%04%23d@R%05nK%0FW9AU%0BoJS%24iI%06U%3AHV%0F%10e"
  - id: md5-xor-http-body-stream-write-part-4
    desc: MD5-XOR fragment of HTTP-body stream Write
    crit: component
    if:
      type: text
      substr: "%1E%5E"
composite_rules:
  - id: md5-xor-http-body-stream-write
    desc: MD5-XOR encoded HTTP-body stream Write call
    all:
      - id: micro-behaviors/fs/write/stream::md5-xor-http-body-stream-write-part-1
      - id: micro-behaviors/fs/write/stream::md5-xor-http-body-stream-write-part-2
      - id: micro-behaviors/fs/write/stream::md5-xor-http-body-stream-write-part-3
      - id: micro-behaviors/fs/write/stream::md5-xor-http-body-stream-write-part-4
      - id: micro-behaviors/crypto/key/representation::md5-browser-default-passphrase
      - id: micro-behaviors/data/decode/custom::unescape-input-md5-argument-call
      - id: micro-behaviors/data/decode/xor::js-repeating-key-charcode-xor-decoder
