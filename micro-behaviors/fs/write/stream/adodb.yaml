defaults:
  platforms: [windows]
  for: [javascript, vbs, powershell]
traits:
  - id: adodb-save-to-file
    desc: ADODB.Stream SaveToFile method call
    crit: notable
    if:
      type: text
      # JScript uses parentheses; VBScript invokes the same method with
      # comma-separated arguments (`.SaveToFile path, 2`).
      regex: '(?i)\.SaveToFile\b\s*(\(|[^\r\n]{1,96},\s*[012]\b)'
      case_insensitive: true
  - id: adodb-save-to-file-unicode
    desc: ADODB.Stream SaveToFile unicode escape
    crit: notable
    if:
      type: text
      substr: \u0073a\u0076\u0065T\u006F\u0046il\u0065
  - id: adodb-stream-progid
    desc: ADODB.Stream ProgID
    crit: component
    if:
      type: text
      substr: ADODB.Stream
  - id: adodb-type-binary-assignment
    desc: Binary stream type assignment
    crit: component
    if:
      type: text
      regex: (?i)(\.Type|\[['"]type['"]\])\s*=\s*1
  - id: adodb-type-binary-unicode
    desc: ADODB.Stream type set via unicode escape
    crit: notable
    if:
      type: text
      regex: "\\['\"]\\\\u0074y\\\\u0070e['\"]\\]\\s*=\\s*1"
  - id: adodb-type-binary-unicode-mixed
    desc: ADODB.Stream type set via mixed unicode escape
    crit: notable
    if:
      type: text
      regex: '\[[''"]\\u0074y\\u0070e[''"]\]\s*=\s*1\b'
  - id: adodb-type-binary-unicode-decoded
    desc: ADODB.Stream decoded unicode type set
    crit: notable
    if:
      type: encoded
      encoding: unicode-escape
      regex: \[['"]type['"]\]\s*=\s*1
  - id: stream-write-response-body
    desc: Stream Write receives HTTP ResponseBody
    crit: notable
    if:
      type: text
      regex: '\.Write\s*\([^)]{0,50}ResponseBody\b'
      case_insensitive: true
  - id: stream-write-response-body-unicode
    desc: Unicode-escaped Write receives HTTP ResponseBody
    crit: notable
    if:
      type: text
      regex: '\\u0077\\u0072\\u0069te.{0,80}Respo\\u006E\\u0073\\u0065\\u0042(ody|\\u006Fdy)\b'
  # Renamed from `adodb-open` / "ADODB.Stream Open method call", which asserted an
  # ADODB.Stream identity the matcher never checks: it is a case-insensitive `.open(`
  # on ANY receiver, so it reports on every JS/VBS/PowerShell `.open(` call whose
  # receiver is not literally named xhr/request/document/window -- minified XHR
  # wrappers (`m.open(g,f,t)`, the shape in every minified analytics/ajax bundle),
  # `fs.open(`, `db.open(`, `stream.open(`, `dialog.open(`. The four `unless:` legs
  # below are receiver-name whack-a-mole and cannot cover minified single-letter
  # receivers. The ADODB reading belongs to the composite: adodb-binary-file-write
  # pairs this with SaveToFile, `Type = 1` and `Write(...ResponseBody)`, which ARE
  # ADODB-specific -- deliberately NOT gated on adodb-stream-progid here, since a
  # dropper that builds the ProgID dynamically would escape while those three legs
  # still identify it. Stays `component`: a bare method name cannot name its object.
  - id: open-method-call
    desc: Calls an object's open() method
    crit: component
    if:
      type: text
      regex: (?i)(\.Open|\[['"]open['"]\])\s*\(
    unless:
      - type: text
        regex: \bdocument\.open\s*\(
      - type: text
        regex: \bxhr\.open\s*\(
      - type: text
        regex: \bwindow\.open\s*\(
      - type: text
        regex: \b[a-zA-Z0-9_]*(xhr|request)\.open\s*\(
  - id: adodb-open-unicode
    desc: ADODB.Stream unicode-escaped open method
    crit: component
    if:
      type: encoded
      encoding: unicode-escape
      regex: \[['"]open['"]\]\s*\(
composite_rules:
  - id: adodb-open-observed
    desc: ADODB.Stream open observed
    crit: component
    any:
      - id: open-method-call
      - id: adodb-open-unicode
  - id: adodb-save-to-file-observed
    desc: ADODB.Stream SaveToFile observed
    crit: notable
    any:
      - id: adodb-save-to-file
      - id: adodb-save-to-file-unicode
  - id: adodb-type-binary-observed
    desc: ADODB.Stream binary type observed
    crit: notable
    any:
      - id: adodb-type-binary
      - id: adodb-type-binary-unicode
      - id: adodb-type-binary-unicode-mixed
      - id: adodb-type-binary-unicode-decoded
  - id: adodb-type-binary
    desc: ADODB.Stream Type assignment
    crit: notable
    near_bytes: 500
    all:
      - id: adodb-stream-progid
      - id: adodb-type-binary-assignment
  - id: stream-write-response-body-observed
    desc: Stream Write receives HTTP response body
    crit: notable
    any:
      - id: stream-write-response-body
      - id: stream-write-response-body-unicode
  - id: adodb-binary-write
    desc: Writes binary data to file using ADODB.Stream
    crit: suspicious
    conf: 0.9
    all:
      - id: adodb-open-observed
      - id: adodb-save-to-file-observed
      - id: adodb-type-binary-observed
      - id: stream-write-response-body-observed
    unless:
      - id: well-known/tool/sysadmin/microsoft-office::offscrub-removal-benign-context
