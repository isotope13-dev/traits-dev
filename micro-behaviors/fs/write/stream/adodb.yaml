defaults:
  platforms: [windows]
  for: [javascript, vbs, powershell]
traits:
  - id: adodb-save-to-file
    desc: ADODB.Stream SaveToFile method call
    crit: notable
    if:
      type: text
      # SaveToFile takes a destination and an ADODB SaveOptions value. Requiring
      # both arguments distinguishes the COM method from ordinary application
      # helpers such as `saveToFile()` while retaining JScript's parenthesized
      # form and VBScript's statement form (`.SaveToFile path, 2`).
      regex: '(?i)\.SaveToFile\b\s*(\([^,\r\n]{1,120},\s*\w+\s*\)|[^\r\n]{1,120},\s*\w+)'
      case_insensitive: true
  # The method name fragmented so no literal `SaveToFile` exists in the
  # file ("sav" + "eToFile", "save" + "ToFile"), the form a CallByName
  # dispatch passes. The fragments only reassemble to this one stream API.
  - id: vbs-split-savetofile-reference
    desc: SaveToFile built from split string fragments
    crit: notable
    conf: 0.93
    for: [vbs]
    if:
      type: text
      regex: '(?i)"(s|sa|sav|save|savet|saveto|savetof)"\s*[+&]\s*"[a-z]{0,8}ile"'
  # The second half lives in a UserForm control instead of a literal:
  # CallByName obj, "sav" + F3.o3.Caption, VbMethod. No SaveToFile fragment
  # pair exists in the module text at all; the tail is read out of the
  # form at runtime. A SaveToFile prefix concatenated with a dotted
  # property read reassembles to this one stream API.
  - id: vbs-split-savetofile-caption
    desc: SaveToFile prefix joined to a control caption
    crit: notable
    conf: 0.9
    for: [vbs]
    if:
      type: text
      regex: '(?i)"(s|sa|sav|save|savet|saveto|savetof)"\s*[+&]\s*[A-Za-z_]\w*\.\w[\w.]{0,58}'
  - id: adodb-save-to-file-unicode
    desc: ADODB.Stream SaveToFile unicode escape
    crit: notable
    if:
      type: text
      substr: \u0073a\u0076\u0065T\u006F\u0046il\u0065
  - id: adodb-stream-progid
    desc: ADODB.Stream ProgID
    crit: notable
    # Also matched in document macros and in scripting-language sources that
    # embed a stream template (macro builders); the ProgID string is the same
    # observable wherever it appears.
    for: [scripts, oledoc, ooxml, text]
    if:
      type: text
      substr: ADODB.Stream
      case_insensitive: true
  - id: adodb-type-binary-unicode
    desc: ADODB.Stream type set via unicode escape
    crit: notable
    if:
      type: text
      regex: "\\['\"]\\\\u0074y\\\\u0070e['\"]\\]\\s*=\\s*1"
  - id: adodb-type-binary-unicode-mixed
    desc: ADODB.Stream type set via mixed unicode escape
    crit: notable
    if:
      type: text
      regex: '\[[''"]\\u0074y\\u0070e[''"]\]\s*=\s*1\b'
  - id: adodb-type-binary-unicode-decoded
    desc: ADODB.Stream decoded unicode type set
    crit: notable
    if:
      type: encoded
      encoding: unicode-escape
      regex: \[['"]type['"]\]\s*=\s*1
  - id: stream-write-response-body
    desc: Stream Write receives HTTP ResponseBody
    crit: notable
    if:
      type: text
      regex: '\.Write\s*\([^)]{0,50}ResponseBody\b'
      case_insensitive: true
  - id: stream-write-response-body-unicode
    desc: Unicode-escaped Write receives HTTP ResponseBody
    crit: notable
    if:
      type: text
      regex: '\\u0077\\u0072\\u0069te.{0,80}Respo\\u006E\\u0073\\u0065\\u0042(ody|\\u006Fdy)\b'
  - id: open-method-call
    desc: Calls an object's open() method
    crit: component
    if:
      type: text
      regex: (?i)(\.Open|\[['"]open['"]\])\s*\(
    unless:
      - id: well-known/lib/web/authoring/syntaxhighlighter::codepress-snippet-template-context
      - type: text
        regex: \bdocument\.open\s*\(
      - type: text
        regex: \bxhr\.open\s*\(
      - id: micro-behaviors/ui/window/navigation::browser-window-open-text-call
      - type: text
        regex: \b[a-zA-Z0-9_]*(xhr|request)\.open\s*\(
composite_rules:
  - id: adodb-open-observed
    desc: ADODB.Stream reference accompanies an open call
    crit: notable
    all:
      - id: adodb-stream-progid
    any:
      - id: open-method-call
      - id: micro-behaviors/data/control-flow/dispatch::encoded-bracket-open-call
    unless:
      - id: well-known/lib/web/authoring/syntaxhighlighter::codepress-snippet-template-context
  - id: adodb-save-to-file-observed
    desc: ADODB.Stream SaveToFile observed
    crit: notable
    any:
      - id: adodb-save-to-file
      - id: adodb-save-to-file-unicode
  # Either concealed SaveToFile shape: split across two literals, or a
  # literal prefix joined to a form/control caption read at runtime.
  - id: vbs-split-savetofile-observed
    desc: Split SaveToFile reference observed
    crit: notable
    for: [vbs]
    any:
      - id: vbs-split-savetofile-reference
      - id: vbs-split-savetofile-caption
  - id: adodb-type-binary-observed
    desc: ADODB.Stream binary type observed
    crit: notable
    any:
      - id: adodb-type-binary
      - id: adodb-type-binary-unicode
      - id: adodb-type-binary-unicode-mixed
      - id: adodb-type-binary-unicode-decoded
  - id: adodb-type-binary
    desc: ADODB.Stream reference near Type assignment
    crit: notable
    near_bytes: 500
    all:
      - id: adodb-stream-progid
      - id: micro-behaviors/data/property/assign::type-one-property-assignment
  - id: stream-write-response-body-observed
    desc: Stream Write receives HTTP response body
    crit: notable
    any:
      - id: stream-write-response-body
      - id: stream-write-response-body-unicode
  - id: adodb-binary-write
    desc: Writes binary data to file using ADODB.Stream
    crit: suspicious
    conf: 0.9
    all:
      - id: adodb-open-observed
      - id: adodb-save-to-file-observed
      - id: adodb-type-binary-observed
      - id: stream-write-response-body-observed
    unless:
      - id: well-known/tool/sysadmin/microsoft-office::offscrub-removal-benign-context
