defaults:
  for: [html, vbs]
  platforms: [windows]
  crit: notable
traits:
  - id: hex-vbs-write-responsebody
    desc: Hex-decoded VBScript writes HTTP response body
    if:
      type: encoded
      encoding: hex
      regex: '\.write\s+\w+\.responseBody\b'
      case_insensitive: true
  - id: hex-vbs-savetofile
    desc: Hex-decoded VBScript SaveToFile invocation
    if:
      type: encoded
      encoding: hex
      regex: '\.savetofile\s+\w+\s*,\s*[12]\b'
      case_insensitive: true
