# A ProgID reference and SaveToFile are present without a fetched-object
# handoff or a demonstrated launch of the saved path.
defaults:
  platforms: [windows]
  for: [html]

composite_rules:
  - id: html-adodb-stream-save-profile
    desc: HTML ADODB.Stream and SaveToFile clues
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/os/com/automation::html-adodb-stream-progid-reference
      - id: micro-behaviors/fs/write/stream::wsh-savetofile
