defaults:
  platforms: [windows]
  for: [text, vbs]
  crit: notable
traits:
  - id: sqlserver-ole-write-variable
    desc: SQL OLE writes a variable
    if:
      type: text
      regex: '(?i)\bsp_oamethod\s+@\w+,\s*''Write'',\s*NULL,\s*@\w+'
  - id: sqlserver-ole-save-executable
    desc: SQL OLE saves to an .exe path
    crit: suspicious
    if:
      type: text
      regex: '(?i)\bsp_oamethod\s+@\w+,\s*''SaveToFile'',\s*NULL,\s*''[^''\r\n]{1,180}\.exe'''
