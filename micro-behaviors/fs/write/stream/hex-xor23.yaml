# Matches API syntax in hex-recovered bytes before the runtime XOR-23 pass.
# No campaign domain, variable name or dropped filename is required.
defaults:
  for: [html, vbs]
  platforms: [windows]
  crit: notable
  conf: 0.96
traits:
- id: xor23-savetofile-method
  desc: Hex/XOR-23 SaveToFile method reference
  if:
    type: encoded
    encoding: hex
    regex: "[dD][vV][aA][rR][cC][xX][qQ][\\~\\^][\\{\\[][rR]"
# Raw form: the hex text itself, for payloads whose XOR-23 bytes include
# CR/LF (0x1A/0x1D) and therefore never become a hex-decoded string.
- id: xor23-hex-text-savetofile
  desc: SaveToFile spelled as XOR-23 hex text
  if:
    type: text
    regex: "(?i)[46]4[57]6[46]1[57]2[46]3[57]8[57]1[57]E[57]B[57]2"
