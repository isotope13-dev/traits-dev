defaults:
  for: [html, vbs]
  platforms: [windows]
  crit: notable
  conf: 0.97
traits:
- id: xor23-write-http-response-body
  desc: XOR-23 stream write of HTTP response
  if:
    type: encoded
    encoding: hex
    regex: '9@e~cr7[^\x1a]{1,64}9ErdgxydrUxsn'
# Raw form for multi-line payloads the hex decoder rejects; proves only the
# member reference, not the Write call that the decoded trait above requires.
- id: xor23-hex-text-responsebody
  desc: .ResponseBody spelled as XOR-23 hex text
  if:
    type: text
    regex: "(?i)39[46]5[57]2[46]4[46]7[57]8[57]9[46]4[57]2[57]5[57]8[57]3[46]E"
