defaults:
  platforms: [windows]
  for: [javascript, vbs, html]

traits:
  - id: wsh-savetofile
    desc: Script saves stream bytes to file
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)\b[A-Za-z_][A-Za-z0-9_]{0,40}\.\s*SaveToFile\b'
    unless:
      - id: metadata/document/html/
