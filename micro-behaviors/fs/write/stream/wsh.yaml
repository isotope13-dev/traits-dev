defaults:
  platforms: [windows]
  for: [javascript, vbs, html]

traits:
  - id: wsh-savetofile
    desc: Script saves stream bytes to file
    crit: notable
    conf: 0.92
    if:
      type: text
      # Three spellings of the same WSH stream drop:
      #   obj.SaveToFile(name, 2)   JScript/parenthesized two-argument call
      #   obj.SaveToFile name, 2    VBS sub-call without parens
      #   obj.SaveToFile(name), adSaveCreateOverWrite
      #                             VBS sub-call with the parenthesized first
      #                             argument and the save option as the named
      #                             ADO StreamSaveOptionsEnum constant
      # (adSaveCreateNotExist/adSaveCreateOverWrite) instead of a literal 1/2.
      regex: "(?i)\\.SaveToFile\\s*(\\([^,\\n]{1,80}(,\\s*[12]\\)|\\),\\s*adSaveCreate\\w*)|\\w+\\s*,\\s*[12]\\b)"
