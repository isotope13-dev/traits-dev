defaults:
  platforms: [windows]
  for: [text]
  crit: notable
  conf: 0.95

traits:
  - id: one-c-module-source-writeback
    desc: Saves text into report module stream
    if:
      type: text
      case_insensitive: true
      regex: 'Write\(TargetTmp\);\s*\w+\.File2stream\(FullName, TargetTmp, "MD Programm text"'
