defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: javascript-paired-device-state-write
    desc: Writes paired-device state from JavaScript
    conf: 0.98
    if:
      type: text
      regex: 'writeFile\s*\(\s*paired(Path|File)'
      case_insensitive: true
