defaults:
  platforms: [windows]
  for: [batch, powershell]
traits:
  - id: powershell-write-before-source-removal
    desc: PowerShell replaces file before source removal
    crit: notable
    conf: 0.97
    if:
      type: encoded
      encoding: base64
      regex: 'WriteAllBytes.{0,20}\$f\.FullName\s*\+[\s\S]{0,180}Remove-Item\s+\$f\.FullName'
