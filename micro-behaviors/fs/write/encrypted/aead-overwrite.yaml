defaults:
  platforms: [unix, windows]
  for: [rust, binaries]
  crit: notable
  conf: 0.95

traits:
  # Raw bytes preserve the embedded source's line breaks in native binaries.
  # The complete sequence is code syntax, independent of identifier names.
  - id: rust-encrypt-truncate-write-sequence
    desc: Encrypt call precedes truncating file write
    for: [macho, elf, pe]
    if:
      type: raw
      regex: '(?s)\.encrypt\(.{0,300}\.truncate\(true\).{0,180}\.write_all\('

  - id: rust-source-encrypt-truncate-write-text
    desc: Rust encrypt and truncating-write sequence
    for: [rust]
    if:
      type: text
      regex: '(?s)\.encrypt\(.{0,300}\.truncate\(true\).{0,180}\.write_all\('

  - id: python-encrypt-write-bytes-sequence
    desc: Encrypt result contributes to byte write
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '\.write_bytes$'
      arg:
        index: 0
        from:
          call: '\.encrypt$'

composite_rules:
  - id: rust-source-encrypt-truncate-write
    desc: Rust encrypt invocation with truncating write sequence
    for: [rust]
    all:
      - id: rust-source-encrypt-truncate-write-text
      - id: micro-behaviors/crypto/encrypt::encrypt-method-call
    near_bytes: 500

  - id: aead-file-overwrite-sequence
    desc: AES-GCM references with file overwrite sequence
    for: [rust, python, binaries]
    any:
      - id: rust-aead-file-overwrite
      - id: python-aead-file-overwrite

  - id: rust-aead-file-overwrite
    desc: AES-GCM references with truncating write sequence
    all:
      - id: micro-behaviors/crypto/symmetric/aes/gcm::rust-aes-gcm-type-reference
    any:
      - id: rust-encrypt-truncate-write-sequence
      - id: rust-source-encrypt-truncate-write
    near_bytes: 1800

  - id: python-aead-file-overwrite
    desc: AESGCM references with pathlib write sequence
    for: [python]
    all:
      - id: micro-behaviors/crypto/symmetric/aes/library::cryptography-aesgcm-api
      - id: python-encrypt-write-bytes-sequence
