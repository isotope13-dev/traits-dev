# Node file writes whose destination is a hidden dot-entry directly under the
# user's home directory. The destination is built from process.env.HOME,
# os.homedir() or path.join(homedir, '.name'); the leading dot is what conceals
# the file from casual listing. Ordinary tools also write dot-files at home
# (rc files, caches), so the composites are neutral building blocks: consumers
# supply the context that makes a write intent-bearing.
#
# Text matchers are used instead of tree-sitter queries: every tree-sitter form
# of these calls walked each call node of multi-megabyte bundles and cost tens
# of milliseconds per file. The module-level forms require the write to start
# its line at column zero, the layout of a top-level statement in ordinary
# source; minified or wrapped bundles drop that layout, which under-reports
# rather than over-reports.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: home-dotpath-write-env
    desc: Write path built from HOME or homedir
    crit: notable
    if:
      type: text
      exclude_comments: true
      regex: '(append|write)File(Sync)?\(\s*(process\.env\.HOME|(os\.)?homedir\(\))\s*\+\s*[''"`]/?\.\w'
  - id: home-dotpath-write-join
    desc: Write path joined from homedir dotfile
    crit: notable
    if:
      type: text
      exclude_comments: true
      regex: '(append|write)File(Sync)?\(\s*path\.join\(\s*(os\.)?homedir\(\)\s*,\s*[''"`]\.\w'
  - id: home-dotpath-module-write-env
    desc: Column-zero write path built from HOME
    crit: notable
    if:
      type: text
      exclude_comments: true
      regex: '(?m)^[\w.]*(append|write)File(Sync)?\(\s*process\.env\.HOME\s*\+\s*[''"`]/?\.\w'
  - id: home-dotpath-module-write-homedir
    desc: Column-zero write path built from homedir
    crit: notable
    if:
      type: text
      exclude_comments: true
      regex: '(?m)^[\w.]*(append|write)File(Sync)?\(\s*(os\.)?homedir\(\)\s*\+\s*[''"`]/?\.\w'
  - id: home-dotpath-module-write-join
    desc: Column-zero write joined from homedir dotfile
    crit: notable
    if:
      type: text
      exclude_comments: true
      regex: '(?m)^[\w.]*(append|write)File(Sync)?\(path\.join\(\s*(os\.)?homedir\(\)\s*,\s*[''"`]\.\w'

composite_rules:
  - id: node-write-hidden-home-dotpath
    desc: Node write targets a hidden home dotfile
    crit: notable
    conf: 0.9
    any:
      - id: home-dotpath-write-env
      - id: home-dotpath-write-join
  # Import-time form: the write is a top-level statement, so it runs as the
  # module loads without any caller invoking an API.
  - id: node-module-level-hidden-home-write
    desc: Module-level Node write to hidden home dotfile
    crit: notable
    conf: 0.9
    any:
      - id: home-dotpath-module-write-env
      - id: home-dotpath-module-write-homedir
      - id: home-dotpath-module-write-join
