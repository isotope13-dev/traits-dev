# Commands that land their output beneath a hidden dot-entry in the user's
# home. A redirect or a downloader/decrypter output option proves the write;
# the leading dot in the first path segment is what makes the destination
# concealed (dotfiles are skipped by casual listing); the XDG base directories
# (~/.local, ~/.cache, ~/.config) are excluded. Ordinary rc-file updates
# match the redirect form; this atom is a building block, and consumers supply
# the payload context.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.85

traits:
  - id: shell-redirect-hidden-home-dotpath
    desc: Shell writes output to a hidden dotpath
    if:
      type: text
      regex: '(>>?[ \t]*["'']?|(-out|-o|--output)[ \t]+["'']?)(~/|\$\{?HOME\}?["'']?/)\.[A-Za-z0-9_-]+'
    # XDG base directories are the expected home for application data and
    # caches, not a concealed destination.
    not:
      - regex: '\.(local|cache|config)$'
