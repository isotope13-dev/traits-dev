defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: node-module-writes-desktop-and-cloud-paths
    desc: Module writes Desktop and cloud paths
    crit: notable
    conf: 0.94
    if:
      type: tree-sitter
      # Unmentioned siblings may intervene without wildcard repetitions.
      query: |
        (program
          (function_declaration
            name: (identifier) @writer
            body: (statement_block
              (try_statement
                body: (statement_block
                  (expression_statement
                    (call_expression
                      function: (member_expression
                        property: (property_identifier) @write_method)))))))
          (if_statement
            consequence: (statement_block
              (expression_statement
                (call_expression
                  function: (identifier) @desktop_call
                  arguments: (arguments
                    (template_string) @desktop_path)))
              (expression_statement
                (call_expression
                  function: (identifier) @cloud_call
                  arguments: (arguments
                    (template_string) @cloud_path)))))
          (#eq? @writer @desktop_call)
          (#eq? @writer @cloud_call)
          (#match? @write_method "^writeFile(Sync)?$")
          (#match? @desktop_path "(?i)Desktop")
          (#match? @cloud_path "(?i)(OneDrive|Dropbox|iCloud)"))
