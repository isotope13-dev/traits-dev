defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: rpm-scriptlet-config-remote-fetch-clues
    for: [shell, rpm]
    desc: RPM scriptlet has config write and remote fetch clues
    crit: suspicious
    conf: 0.99
    scope: archive
    all:
      - id: metadata/build/package/maintainer-scripts::rpm-install-scriptlet-body
      - id: micro-behaviors/fs/write/file/redirect::shell-heredoc-system-config-write
      - id: micro-behaviors/communications/http/client/reference::curl-fail-silent-url-reference

