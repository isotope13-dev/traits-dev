defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-workflow-registry-post-clues
    desc: Node writes GitHub configuration and has registry POST clues
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/fs/write/file/target::node-writes-github-config-path
      - id: micro-behaviors/communications/http/curl/body::curl-post-flag
      - id: micro-behaviors/communications/http/url/api-path/route::package-registry-api-path-text
      - id: micro-behaviors/data/serialize/schema-object::repository-object-fields
