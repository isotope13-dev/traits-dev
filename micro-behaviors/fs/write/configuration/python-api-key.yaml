defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: pathlib-write-api-key-assignment
    desc: Writes interpolated API key assignment
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        ((call
          function: (attribute attribute: (identifier) @method)
          arguments: (argument_list
            (string (string_content) @prefix (interpolation)) @value))
          (#eq? @method "write_text")
          (#match? @prefix "(^|\\n)[A-Za-z0-9_]*API_KEY="))
