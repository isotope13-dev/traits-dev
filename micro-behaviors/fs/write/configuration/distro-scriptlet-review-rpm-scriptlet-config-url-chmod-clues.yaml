defaults:
  platforms: [linux]
  for: [shell]
composite_rules:
  - id: rpm-scriptlet-config-url-chmod-clues
    desc: RPM scriptlet has config write, URL, and chmod clues
    crit: suspicious
    conf: 0.98
    for: [shell, rpm]
    scope: archive
    all:
      - id: metadata/build/package/maintainer-scripts::rpm-install-scriptlet-body
      - id: micro-behaviors/fs/write/file/redirect::shell-heredoc-system-config-write
      - id: micro-behaviors/communications/url/reference::shell-http-url-reference
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path
