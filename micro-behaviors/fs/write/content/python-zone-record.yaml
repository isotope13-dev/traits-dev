defaults:
  platforms: [windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-write-local-zone-record
    desc: Writes text assigning the local-machine zone
    if:
      type: symbol
      kind: call
      regex: '\.write$'
      arg:
        index: 0
        kind: string
        substr: ZoneId=0
