# Neutral observations and discriminating identities.
composite_rules:
- platforms:
  - unix
  - windows
  for:
  - scripts
  - '!jcl'
  id: multiple-file-write-observations
  desc: Multiple file-write observations
  crit: notable
  conf: 0.9
  needs: 2
  any:
  - id: micro-behaviors/fs/write/file/executable/
  - id: micro-behaviors/fs/write/file/webshell/
  - id: micro-behaviors/fs/write/file/bytecode/
  - id: micro-behaviors/fs/write/file/response-body/
  - id: micro-behaviors/fs/write/file/stream/
  - id: micro-behaviors/fs/write/file/binary/
  - id: micro-behaviors/fs/write/file/npm-masquerade/
  - id: micro-behaviors/fs/write/file/stage/
  - id: micro-behaviors/fs/write/file/redirect/
  unless:
  - id: metadata/package/testing/corpus::inert-security-input-module
  - id: metadata/file/format/structured::serialized-news-article-catalog
