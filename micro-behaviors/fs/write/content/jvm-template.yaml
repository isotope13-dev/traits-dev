defaults:
  platforms: [unix]
  for: [class]
  crit: notable
  conf: 0.95

traits:
  - id: jvm-template-shell-echo-append
    desc: Embedded source constructs shell echo append
    if:
      type: value
      path: class.strings[*]
      regex: '["'']\s*\|\|\s*echo\s*["''][\s\S]{0,160}["'']\s*>>\s*["'']'
