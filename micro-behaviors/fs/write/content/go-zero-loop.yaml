defaults:
  platforms: [windows]
  for: [go]
  crit: notable
  conf: 0.97
traits:
  - id: go-sized-zero-buffer-write-loop
    desc: Zero-initialized buffer feeds size-bound writes
    if:
      type: tree-sitter
      query: |
        ((statement_list
          (short_var_declaration
            left: (expression_list (identifier) @buffer)
            right: (expression_list (call_expression
              function: (identifier) @make
              arguments: (argument_list (slice_type element: (type_identifier) @byte)
                (int_literal)))))
          . (for_statement
            (for_clause condition: (binary_expression operator: "<"))
            body: (block (statement_list . (expression_statement (call_expression
              function: (selector_expression field: (field_identifier) @write)
              arguments: (argument_list (identifier) @sent))) .)))) @overwrite
          (#eq? @make "make")
          (#eq? @byte "byte")
          (#eq? @write "Write")
          (#eq? @buffer @sent))
composite_rules:
  - id: go-free-space-query-and-zero-write-loop
    desc: Free-space sizing with zero-initialized writes
    all:
      - id: micro-behaviors/os/sysinfo/disk::go-disk-free-space-query
      - id: go-sized-zero-buffer-write-loop
    near_bytes: 1200
