defaults:
  platforms: [linux]
  for: [javascript, typescript]
  crit: suspicious
  conf: 0.94

traits:
  - id: glib-nautilus-filename-request-source-write
    desc: Writes provider source that sends file names
    # The complete write body contains the connected filename-to-URL source
    # expression. This is source content, not a provider-load/reachability proof.
    if:
      type: symbol
      kind: call
      exact: GLib.file_set_contents
      arg:
        index: 1
        kind: string
        substr: Nautilus.InfoProvider
        regex: "(?s)urlopen\\('https?://[^']+'\\s*\\+\\s*urllib\\.parse\\.quote\\(\\w+\\.get_name\\(\\)"
