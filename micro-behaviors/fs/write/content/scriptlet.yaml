defaults:
  platforms: [windows]
  for: [html, javascript]
traits:
  - id: object-document-property-assignment
    desc: Assigns content to an object Doc property
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b[\w$]{1,40}\.Doc\s*='
composite_rules:
  - id: document-write-call-cooccurrence
    desc: Document assignment and write call coexist
    crit: notable
    conf: 0.95
    all:
      - id: object-document-property-assignment
      - id: parameterless-write-method-call
