defaults:
  platforms: [windows]
  for: [html, javascript]
traits:
  - id: document-write-call-cooccurrence
    desc: Document assignment and write call coexist
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\b[\w$]{1,40}\.Doc\s*=[\s\S]{1,800}\b[\w$]{1,40}\.write\s*\(\s*\)'
