defaults:
  platforms: [windows]
  for: [html, javascript]
traits:
  # Scriptlet.TypeLib writes through the object whose Doc property was set.
  # Keep the assignment and call nearby to avoid treating arbitrary .Write()
  # calls as filesystem writes.
  - id: scriptlet-doc-assignment-write-call
    desc: Scriptlet Doc assignment near Write call
    crit: notable
    conf: 0.95
    for: [html, javascript, vbs]
    if:
      type: text
      regex: '(?i)\.Doc\s*=[\s\S]{0,400}?\.Write\s*\('
  # Scriptlet.TypeLib can write a nonempty Doc value to the assigned Path.
  # Keep this separate from the blanking matcher below: payload content is a
  # different, common overwrite form.
  - id: scriptlet-document-content-write
    desc: Nonempty Doc assignment precedes write call
    crit: notable
    conf: 0.96
    for: [html, javascript, vbs]
    if:
      type: text
      regex: '(?i)\.Doc\s*=\s*(3D)?"[^"\r\n]{1,400}";[\s\S]{0,40}\.write\s*\('
  # Both statement-form and parenthesized writes require the nearby empty Doc.
  - id: scriptlet-blanking-statement-write
    desc: Empty Doc assignment near Scriptlet write syntax
    crit: notable
    conf: 0.9
    for: [html, javascript, vbs]
    if:
      type: text
      regex: '(?i)\.Doc\s*=\s*""[\s\S]{0,80}?\.Write\b'
composite_rules:
  - id: document-write-call-cooccurrence
    desc: Scriptlet Doc assignment and write call coexist
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/com/automation::scriptlet-typelib-clsid
      - id: "metadata/lang/source/syntax/assignment::object-doc-property-assignment"
    any:
      - id: scriptlet-blanking-statement-write
      - id: metadata/lang/source/syntax/call/relationship::doc-assignment-before-write-call
