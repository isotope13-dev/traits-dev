defaults:
  platforms: [windows]
  for: [html, javascript]
traits:
  # VBScript statement-form blanking write (`FS.Doc="": FS.Write`): no
  # parentheses, so the parameterless-write-method-call atom misses it.
  # Empty content through a scriptlet object is file blanking, not a log.
  - id: scriptlet-blanking-statement-write
    desc: Blanks file with statement-form write
    crit: notable
    conf: 0.9
    for: [html, javascript, vbs]
    if:
      type: text
      regex: '(?i)\.Doc\s*=\s*""[\s\S]{0,80}?\.Write\b'
composite_rules:
  - id: document-write-call-cooccurrence
    desc: Scriptlet Doc assignment and write call coexist
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/com/automation::scriptlet-typelib-clsid
      - id: micro-behaviors/data/property/assign::object-doc-property-assignment
      - id: parameterless-write-method-call
