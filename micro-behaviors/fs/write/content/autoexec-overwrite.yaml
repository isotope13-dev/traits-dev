defaults:
  platforms: [windows]
  for: [html, vbs, javascript]
  crit: notable
  conf: 0.99
traits:
  - id: create-autoexec-overwrite
    desc: CreateTextFile requests overwriting AUTOEXEC.BAT
    if:
      type: text
      regex: '(?i)CreateTextFile\("[a-z]:\\autoexec\.bat",\s*True\)'
  - id: writeline-unattended-format
    desc: Writes an unattended drive-format batch command
    if:
      type: text
      regex: '(?i)\.WriteLine\s*\("format\s+/y\s+[a-z]:"\)'
  - id: writeline-system-extension-rename
    desc: Writes executable or driver wildcard renames
    if:
      type: text
      regex: '(?i)\.WriteLine\s*"rename\s+\*\.(exe|sys)\s+\*\.[a-z0-9]+"'
