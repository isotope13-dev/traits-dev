traits:
- platforms:
  - unix
  - windows
  for:
  - markdown
  - python
  - javascript
  - typescript
  - shell
  - powershell
  - ruby
  - perl
  - php
  id: agents-document-write-wording
  desc: Text describes writing or modifying AGENTS.md
  crit: notable
  conf: 0.95
  unless:
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
  if:
    type: text
    regex: (?i)\b(write|append|modify|persist)\b.{0,80}\bAGENTS\.md\b
  not:
  - substr: aui-agent-builder
