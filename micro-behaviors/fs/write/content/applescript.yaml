defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  crit: notable
  conf: 0.95

traits:
  - id: applescript-write-at-eof
    desc: AppleScript writes data at end of file
    if:
      type: text
      regex: '(?m)(^|")[ \t]*write \w+ to \w+ starting at eof(\r?$|\\?" & return)'
      case_insensitive: true
