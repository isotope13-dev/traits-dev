defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: node-replace-env-json-settings
    desc: Replaces settings env before writing JSON
    if:
      type: tree-sitter
      query: |
        ((function_declaration
          body: (statement_block
            (expression_statement (call_expression
              function: (member_expression object: (identifier) @object
                property: (property_identifier) @assign)
              arguments: (arguments . (identifier) @merged . (_) )))
            (expression_statement (assignment_expression
              left: (member_expression object: (identifier) @settings
                property: (property_identifier) @env)
              right: (identifier) @replacement))
            (try_statement body: (statement_block
              (expression_statement (call_expression
                function: (member_expression property: (property_identifier) @write)
                arguments: (arguments . (_) . (binary_expression
                  left: (call_expression
                    function: (member_expression object: (identifier) @json
                      property: (property_identifier) @stringify)
                    arguments: (arguments . (identifier) @serialized)))))) )))) @rewrite
          (#eq? @object "Object")
          (#eq? @assign "assign")
          (#eq? @merged @replacement)
          (#eq? @env "env")
          (#eq? @write "writeFileSync")
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @settings @serialized))
