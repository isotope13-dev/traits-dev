defaults:
  for: [asp, html, vbs]
  platforms: [windows]
  crit: notable
traits:
  - id: asp-request-text-write
    desc: Writes ASP request content to a stream
    conf: 0.98
    if:
      type: text
      regex: '(?i)\.WriteLine\s+Request\("[^"\r\n]{1,40}"\)'
  - id: asp-selected-path-text-file-create
    desc: Creates text file at selected ASP path
    conf: 0.98
    if:
      type: text
      regex: '(?i)\boutfile\s*=\s*\w+\.CreateTextFile\(whichfile\)'
