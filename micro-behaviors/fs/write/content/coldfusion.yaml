# ColdFusion performs every file mutation through one `<cffile>` tag, selected
# by its `action` attribute; the write-side actions live here and the delete /
# move actions live under their own operations.
#
# FileFacts identifies ColdFusion pages as `cfml`; see
# metadata/lang/scripted::cfml-output-tag for the language marker.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.88
traits:
  - id: cffile-write
    desc: ColdFusion cffile writes a file
    if:
      type: text
      regex: '<\s*cffile\s+action\s*=\s*["'']?(write|append)'
      case_insensitive: true
  - id: cffile-upload
    desc: ColdFusion cffile accepts an upload
    if:
      type: text
      regex: '<\s*cffile\s+action\s*=\s*["'']?upload'
      case_insensitive: true
