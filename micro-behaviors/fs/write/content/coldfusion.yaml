# ColdFusion performs every file mutation through one `<cffile>` tag, selected
# by its `action` attribute; the write-side actions live here and the delete /
# move actions live under their own operations.
#
# FileFacts identifies ColdFusion pages as `cfml`; see
# metadata/lang/scripted::cfml-output-tag for the language marker.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.88
traits:
  - id: cffile-write
    desc: ColdFusion cffile writes a file
    if:
      type: symbol
      kind: call
      exact: cffile
      arg:
        index: 0
        from:
          field: action
          whole_value: '(?i)^(write|append)$'
  - id: cffile-upload
    desc: ColdFusion cffile accepts an upload
    if:
      type: symbol
      kind: call
      exact: cffile
      arg:
        index: 0
        from:
          field: action
          whole_value: '(?i)^upload(all)?$'
  - id: cffile-request-write-path-content
    desc: CFML request supplies write path and content
    if:
      type: symbol
      kind: call
      exact: cffile
      args:
        - index: 0
          from:
            field: action
            whole_value: '(?i)^write$'
        - index: 0
          from:
            field: file
            member: '^(form|url)\.'
            through:
              - call: '^replace$'
                arguments: [0, 2]
        - index: 0
          from:
            field: output
            member: '^(form|url)\.'
