# These commands stage .reg file content; importing it is a separate behavior.
defaults:
  platforms:
  - windows
  for:
  - mirc
  - lua
  - text
  - data
  crit: notable
traits:
- id: mirc-stages-registry-file-header
  desc: mIRC writes a REGEDIT4 registry import header
  if:
    type: text
    regex: (?i)\bwrite\s+-[ac]\s+\S+\.reg\s+REGEDIT4\b
- id: mirc-stages-executable-registry-value
  desc: mIRC stages an executable registry value
  if:
    type: text
    regex: (?i)\bwrite\s+-a\s+\S+\.reg\s+"[^"\r\n]{1,40}"="[^|\r\n]{1,100}\.exe"
