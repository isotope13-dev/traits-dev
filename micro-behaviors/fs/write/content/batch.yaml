defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-echo-redirect-var
    desc: Batch echoes content into variable-selected file
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)>>?\s*"?%[A-Za-z_][A-Za-z0-9_]{0,30}%"?\s+echo\b'
    not:
      - substr: GITHUB_PATH
      - substr: GITHUB_
      - substr: HEADER_OUT_FILE
