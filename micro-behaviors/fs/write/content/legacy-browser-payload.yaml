defaults:
  platforms: [windows]
  for: [html, javascript]
  crit: notable
  conf: 0.98
traits:
  - id: object-startup-hta-path-assignment
    desc: Object Path assignment names a Startup HTA
    if:
      type: text
      regex: '(?i)\.Path\s*=[^;\r\n]{1,200}(StartUp|Autostart)\\+[^;\r\n]{1,80}\.hta'
  - id: percent-encoded-mz-construction
    desc: Builds percent-encoded MZ content
    if:
      type: text
      regex: '=\s*"MZ%u[0-9A-Fa-f]{4}"\s*\+\s*[\w$]{1,40}\(\d{1,4}\)\s*\+\s*"%[0-9A-Fa-f]{2}"'
  - id: debug-script-sector-write-registers
    desc: DEBUG sector-write and zero-buffer text
    if:
      type: text
      regex: '(?i)RAX.{0,60}0301.{0,180}F 200 L 200 0'
  - id: debug-script-first-hard-disk-sector
    desc: DEBUG sector-one and disk-80h register text
    if:
      type: text
      regex: '(?i)RCX.{0,60}0001.{0,60}RDX.{0,60}0080'
  - id: parameterless-write-method-call
    desc: Calls a parameterless write method
    unless:
    - id: metadata/lang/scripted::dts-declaration-file
    if:
      type: text
      regex: '(?i)\b[\w$]{1,40}\.write\s*\(\s*\)'
  - id: debug-script-int13-instruction
    desc: Writes a BIOS INT 13 instruction
    if:
      type: text
      regex: '(?i)\.WriteLine\(["'']INT 13["'']\)'
  - id: fso-open-as-text-stream-write
    desc: Opens a writable FSO text stream
    if:
      type: text
      regex: '(?i)\.OpenAsTextStream\s*\(\s*[28]\s*[,)]'
  # DEBUG.EXE staging: the script emits memory-edit commands (`e <addr>
  # <hex>...`) that debug.exe assembles into an executable, the classic
  # pre-PowerShell dropper idiom for smuggling a PE through a text channel.
  - id: debug-script-memory-edit
    desc: Stages DEBUG.EXE memory-write commands
    if:
      type: text
      regex: '(?i)\.WriteLine\(\s*["'']e [0-9A-Fa-f]{3,4}( [0-9A-Fa-f]{2}){2,16}'
