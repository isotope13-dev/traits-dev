defaults:
  platforms: [windows]
  for: [vbs, asp, html, javascript]

traits:
  - id: wsh-write-debug-memory-row
    desc: Writes debug.exe memory-enter hex row
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\.Write(Line)?[\s(]+["'']e\s*0?[1-9a-f][0-9a-f]{2}(\s+[0-9a-f]{2}){2,16}'
      case_insensitive: true

  - id: wsh-write-debug-rcx-command
    desc: Writes debug.exe rcx register directive
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\.Write(Line)?[\s(]+["'']rcx["'']'
      case_insensitive: true

  # Rows and directives joined with vbNewline inside one WriteLine string:
  # WriteLine "e 234" & vbNewline & "6C 63 ..." & vbNewline & "rcx" & ...
  - id: wsh-write-debug-split-row
    desc: Writes debug.exe row split by vbNewline
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '["'']e\s*0?[1-9a-f][0-9a-f]{2}["'']\s*&\s*vbNewline\s*&\s*["''](\s*[0-9a-f]{2}){2,16}'
      case_insensitive: true

  - id: wsh-write-debug-split-rcx
    desc: Writes debug.exe rcx after vbNewline
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '&\s*vbNewline\s*&\s*["'']rcx["'']\s*&\s*vbNewline'
      case_insensitive: true

composite_rules:
  - id: wsh-write-debug-split-memory-script
    desc: Writes debug.exe rows and rcx via vbNewline
    crit: notable
    conf: 0.97
    near_lines: 80
    all:
      - id: wsh-write-debug-split-row
      - id: wsh-write-debug-split-rcx

  - id: wsh-write-debug-memory-script
    desc: Writes debug.exe memory-enter and rcx commands
    crit: notable
    conf: 0.97
    near_lines: 80
    all:
      - id: wsh-write-debug-memory-row
      - id: wsh-write-debug-rcx-command
