defaults:
  platforms: [windows]
  for: [vbs, asp, html, javascript]

traits:
  - id: wsh-write-debug-memory-row
    desc: Writes debug.exe memory-enter hex row
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\.Write(Line)?[\s(]+["'']e\s*0?[1-9a-f][0-9a-f]{2}(\s+[0-9a-f]{2}){2,16}'
      case_insensitive: true

  - id: wsh-write-debug-rcx-command
    desc: Writes debug.exe rcx register directive
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\.Write(Line)?[\s(]+["'']rcx["'']'
      case_insensitive: true

composite_rules:
  - id: wsh-write-debug-memory-script
    desc: Writes debug.exe memory-enter and rcx commands
    crit: notable
    conf: 0.97
    near_lines: 80
    all:
      - id: wsh-write-debug-memory-row
      - id: wsh-write-debug-rcx-command
