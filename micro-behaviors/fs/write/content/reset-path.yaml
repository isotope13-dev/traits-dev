defaults:
  platforms: [windows]
  for: [html, javascript]
  crit: notable
  conf: 0.98
traits:
  - id: reset-path-write-sequence
    desc: Reset, Path assignment and write-call sequence
    if:
      type: text
      exclude_html_comments: true
      regex: '(?i)\.Reset\(\);\s*\w+\.Path=[^;]{1,100};\s*\w+\.write\(\)'
  - id: windows-ini-path-write-sequence
    desc: Windows INI Path assignment precedes write
    if:
      type: text
      regex: '(?i)\.Path="[a-z]:\\+WINDOWS\\+(SYSTEM|WIN)\.INI";\s*\w+\.write\(\)'
  - id: windows-executable-path-write-sequence
    desc: Windows EXE Path assignment precedes write
    if:
      type: text
      regex: '(?i)\.Path="[a-z]:\\+WINDOWS\\+\w{1,40}\.EXE";\s*\w+\.write\(\)'
