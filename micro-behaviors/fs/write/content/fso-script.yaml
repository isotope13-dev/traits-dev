defaults:
  platforms: [windows]
  for: [javascript, vbs, xml, html, asp]
traits:
- id: fso-append-unicode-mode
  desc: Opens an FSO file for Unicode append
  crit: notable
  for: [javascript, html, text, vbs]
  if:
    type: text
    regex: 'OpenTextFile\([^,)]{1,80},\s*8,\s*false,\s*true\)'
- id: write-mz-header
  desc: Writes a DOS executable MZ header
  crit: notable
  for: [javascript, html, text, vbs]
  if:
    type: text
    regex: '\.Write\(["'']MZ["'']\)'
- id: create-text-file-method-name
  desc: CreateTextFile invocation syntax
  for: [javascript, vbs, xml, html, asp, text, static-lib]
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\bCreateTextFile\s*(\(|[ \t]+[^\s?:=;])'
    case_insensitive: true
  unless:
    # The literal is the same call read off the AST; the text form would count
    # the one CreateTextFile call a second time.
    - id: create-text-file-literal
    - id: metadata/package/documentation/page::static-documentation-html-page
- id: create-text-file-literal
  desc: CreateTextFile literal in script
  for: [javascript, vbs, xml, html, asp, text, static-lib]
  crit: notable
  conf: 0.92
  if:
    type: string_literal
    exact: CreateTextFile
  unless:
    - id: metadata/package/documentation/page::static-documentation-html-page
- id: javascript-concat-ps1-extension
  desc: JS concatenates a .ps1 extension literal
  crit: notable
  conf: 0.92
  for: [javascript]
  if:
    type: text
    regex: '\+\s*["'']\.ps1["'']'

- id: js-fragmented-createtextfile-call
  desc: JS splits CreateTextFile across literals
  crit: notable
  conf: 0.94
  for: [javascript, vbs]
  if:
    type: text
    regex: '(?i)\(\s*["'']Cr["'']\s*\+\s*["'']ea["'']\s*\)\s*\+\s*\(\s*["'']teTe["'']\s*\+\s*["'']xt["'']\s*\)'
  unless:
    - id: metadata/package/documentation/page::static-documentation-html-page
- id: fso-text-file-then-write-call
  desc: Text-file API precedes Write-call syntax
  crit: notable
  conf: 0.85
  # A Write/WriteLine name alone also occurs in console APIs and XML API
  # documentation. Require nearby text-file call syntax; this does not bind
  # the writer receiver to that file.
  if:
    type: text
    regex: '(?s)(CreateTextFile|OpenTextFile)\(.{0,256}\.Write(Line|BlankLines)?\s*\('
  unless:
  - id: metadata/package/documentation/page::static-documentation-html-page
  - id: well-known/lib/web/authoring/syntaxhighlighter::codepress-snippet-template-context
- id: fso-open-text-file-write
  desc: FileSystemObject opens a text file for writing
  for: [javascript, vbs, xml, html, asp, text, static-lib]
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)OpenTextFile\s*\([^,()\r\n]{1,80}(\([^,()\r\n]{1,80}\))?\s*,\s*2\b'
  unless:
    - id: metadata/package/documentation/page::static-documentation-html-page
- id: fso-open-script-fullname-write
  desc: Opens the WSH script path for writing
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: '(?i)OpenTextFile\s*\(\s*WScript\.ScriptFullName\s*,\s*2\b'
- id: create-batch-or-command-file
  desc: Creates a Windows batch or command script
  conf: 0.95
  crit: notable
  if:
    type: text
    regex: '(?i)(CreateTextFile|OpenTextFile)\s*\(\s*[^,\r\n)]{1,180}\.(bat|cmd)["''](\s*,\s*\w+)?'
  not:
  - regex: '(?i)^OpenTextFile.*,\s*(1|ForReading)$'
  unless:
  - id: well-known/lib/runtime/scripted/php-runtime::source-tree
  - id: "metadata/file/naming::test-directory-component"
  - id: metadata/package/testing/presence/fixture::snapshot-file
  - id: metadata/package/documentation/page::static-documentation-html-page
- id: create-powershell-or-vbs-file
  desc: Creates a PowerShell or VBScript file
  conf: 0.95
  crit: notable
  if:
    type: text
    regex: '(?i)(CreateTextFile|OpenTextFile)\s*\(\s*[^,\r\n)]{1,180}\.(ps1|vbs)["''](\s*,\s*\w+)?'
  not:
  - regex: '(?i)^OpenTextFile.*,\s*(1|ForReading)$'
  unless:
  - id: well-known/lib/runtime/scripted/php-runtime::source-tree
  - id: "metadata/file/naming::test-directory-component"
  - id: metadata/package/testing/presence/fixture::snapshot-file
  - id: metadata/package/documentation/page::static-documentation-html-page
- id: create-javascript-file
  desc: Creates a JavaScript file using FileSystemObject
  conf: 0.95
  crit: notable
  if:
    type: text
    regex: '(?i)(CreateTextFile|OpenTextFile)\s*\(\s*[^,\r\n)]{1,180}\.js["''](\s*,\s*\w+)?'
  not:
  - regex: '(?i)^OpenTextFile.*,\s*(1|ForReading)$'
  unless:
  - id: well-known/lib/runtime/scripted/php-runtime::source-tree
  - id: "metadata/file/naming::test-directory-component"
  - id: metadata/package/testing/presence/fixture::snapshot-file
  - id: metadata/package/documentation/page::static-documentation-html-page
- id: ext-js
  desc: Reference to .js file extension
  crit: notable
  for: [vbs]
  if:
    type: text
    regex: '[\"\x27][^\"]{1,40}\.js[\"\x27]'
- id: fso-open-text-file-append
  desc: FileSystemObject opens a text file for append
  crit: notable
  conf: 0.95
  for: [javascript, vbs, xml, html, asp, text, static-lib]
  if:
    type: text
    regex: '(?i)OpenTextFile\s*\([^,()\r\n]{1,80}(\([^,()\r\n]{1,80}\))?\s*,\s*8\b'
  unless:
    - id: metadata/package/documentation/page::static-documentation-html-page
composite_rules:
- id: create-text-file-in-startup
  desc: Resolves WSH Startup folder near batch text-file creation
  crit: notable
  conf: 0.96
  for: [javascript]
  near_lines: 20
  all:
  - id: micro-behaviors/fs/path/autostart::wsh-special-folders-startup
  - id: create-batch-from-bound-path
- id: text-file-write-powershell-cradle
  desc: PowerShell WebClient cradle near a text-file write
  crit: notable
  conf: 0.96
  for: [javascript]
  near_lines: 20
  all:
  - id: micro-behaviors/process/deploy/script-eval::embedded-powershell-webclient-script-eval
  - id: fso-text-file-then-write-call
- id: fso-text-file-write-api
  desc: FSO creates or opens writable text files
  crit: notable
  for: [javascript, vbs, xml, html, asp, text, static-lib]
  any:
  - id: create-text-file-method-name
  - id: create-text-file-literal
  - id: fso-open-text-file-write
  - id: fso-open-text-file-append
  unless:
    - id: metadata/package/documentation/page::static-documentation-html-page
- id: create-batch-from-bound-path
  desc: Batch extension near text-file creation clues
  conf: 0.97
  # A script extension and text-file creation are neutral capabilities.
  # This proximity observation does not bind the extension to the written path.
  crit: notable
  for: [javascript]
  near_lines: 20
  all:
  - id: micro-behaviors/fs/path/extension::batch-command-extension-literal
  - id: fso-text-file-write-api
- id: powershell-extension-near-text-file-creation
  desc: PowerShell extension near text-file creation clues
  conf: 0.97
  # A script extension and text-file creation are neutral capabilities.
  # This proximity observation does not bind the extension to the written path.
  crit: notable
  for: [javascript]
  near_lines: 20
  all:
  - id: micro-behaviors/fs/path/extension::ps1
  - id: fso-text-file-write-api
- id: script-extension-with-text-file-creation
  desc: Windows script and text-file creation clues
  # Script creation is a capability; WSH dropper composites add execution,
  # download, or policy-bypass evidence before escalating it.
  crit: notable
  conf: 0.95
  any:
  - id: create-batch-or-command-file
  - id: create-batch-from-bound-path
  - id: create-powershell-or-vbs-file
  - id: powershell-extension-near-text-file-creation
