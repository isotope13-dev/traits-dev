defaults:
  for:
  - data
  - dos_com
  - pe
  - static-lib
  platforms:
  - windows
  - unix
  size_min: 482
  size_max: 8192
traits:
- id: dos-private-create-pit-sized-carrier
  desc: Creates path with PIT-sized resident write
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule dos_private_create_pit_sized_carrier {\n strings:\n$drop = { BA ?? ?? B4 5B B9 01 00 CD 18 72 ?? 93 B4 40 E4 40 0C 02 8A E8 B2 ?? CD 18 B4 3E CD 18 }\n $path = /[A-Za-z]:\\\\windows\\\\winstart\\.bat\\x00/ nocase\n condition:\n#drop > 0 and #drop <= 32 and #path > 0 and #path <= 32 and\n for any d in (1..#drop) : (for any p in (1..#path) :\n (uint16(@drop[d]+1)-@path[p] >= 0 and\n ((uint16(@drop[d]+1)&0xff00)+uint8(@drop[d]+22))-(uint16(@drop[d]+1)-@path[p]) >= 0 and\n ((uint16(@drop[d]+1)&0xff00)+uint8(@drop[d]+22))-(uint16(@drop[d]+1)-@path[p])+482 <= filesize and\n uint8(((uint16(@drop[d]+1)&0xff00)+uint8(@drop[d]+22))-(uint16(@drop[d]+1)-@path[p]))==0x3a and\n uint16(((uint16(@drop[d]+1)&0xff00)+uint8(@drop[d]+22))-(uint16(@drop[d]+1)-@path[p])+3)==0x0a0d))\n}"
