defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: php-request-selected-path-content
    desc: PHP request supplies file-write path and content
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((function_call_expression
          function: (name) @fn
          arguments: (arguments
            . (argument (subscript_expression (variable_name) @path))
            . (argument (subscript_expression (variable_name) @content)))) @call
          (#match? @fn "(?i)^file_put_contents$")
          (#match? @path "^\\$_(GET|POST|REQUEST)$")
          (#match? @content "^\\$_(GET|POST|REQUEST)$"))
