defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: vbs-encoded-textfile-create
    desc: Encoded assignment creates a text-file object
    crit: component
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      regex: '7A7A7A32.{0,60}64736662756675667975676A6D66'
  - id: vbs-encoded-write-template
    desc: Encoded write sends a template variable
    crit: component
    conf: 0.96
    if:
      type: text
      case_insensitive: true
      substr: '7A7A7A322F78736A7566217B7B79'
  - id: vbs-encoded-template-contains-payload-marker
    desc: Encoded payload marker reaches write
    crit: component
    conf: 0.95
    if:
      type: text
      case_insensitive: true
      regex: '7B7B79.{0,160}7B666F32.{0,999}7A7A7A322F78736A7566217B7B79'

composite_rules:
  - id: vbs-encoded-template-write
    desc: VBScript writes a decoded template to a text file
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/data/decode/custom::vbs-hex-offset-decode-execute
      - id: vbs-encoded-textfile-create
      - id: vbs-encoded-write-template
      - id: vbs-encoded-template-contains-payload-marker
