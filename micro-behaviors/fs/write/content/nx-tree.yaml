defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: generate-files-helper-call
    desc: Calls a generateFiles helper
    if:
      # Transpiled (0, module.method)(...) calls have no call target in the
      # symbol view. The live call node retains this standard API spelling.
      type: tree-sitter
      kind: call
      regex: '^(\(0,\s*)?[$\w]+\.generateFiles\)?\s*\('

composite_rules:
  - id: nx-devkit-generate-files
    desc: Nx Devkit import with template-file generation
    all:
      - id: metadata/import/npm/nx/devkit
      - id: generate-files-helper-call
