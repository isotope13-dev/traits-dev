---
defaults:
  platforms:
  - unix
  - windows
  for:
  - markdown
  - python
  - javascript
  - typescript
  - shell
  - powershell
  - ruby
  - perl
  - php
  crit: notable
  conf: 0.93
traits:
- id: soul-document-write-wording
  desc: SOUL.md write-action wording
  unless:
  - id: well-known/app/ai/agent-runtime/aui-agent-builder/
  if:
    type: text
    regex: "(?i)\\b(write|append|modify|persist)\\b.{0,80}\\bSOUL\\.md\\b"
  not:
  - substr: aui-agent-builder
