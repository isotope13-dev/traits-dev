defaults:
  platforms: [windows]
composite_rules:
  - id: wsh-hex-pe-write-context
    desc: FSO write, hex-MZ and decoder references
    crit: notable
    conf: 0.98
    near_lines: 16
    for: [html, vbs, javascript]
    all:
      - id: metadata/file/encoding/shape::assigned-mz-prefixed-hex-string
      - id: micro-behaviors/os/com/automation::filesystemobject-constructor
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
    any:
      - id: micro-behaviors/data/decode/hex::vb-chr-prefixed-hex-integer-text-reference
      - id: micro-behaviors/data/decode/hex::js-hex-charcode-decoder

