defaults:
  platforms: [windows]
composite_rules:
  - id: wsh-hex-pe-write-context
    desc: Hex executable decoding with writable FSO file
    crit: notable
    conf: 0.98
    near_lines: 16
    for: [html, vbs, javascript]
    all:
      - id: micro-behaviors/data/format/executable/header::script-hex-mz-assignment
      - id: micro-behaviors/os/com/automation::filesystemobject-constructor
      - id: micro-behaviors/fs/write/content::fso-text-file-write-api
    any:
      - id: micro-behaviors/data/decode/hex::vbscript-hex-pair-byte-conversion
      - id: micro-behaviors/data/decode/hex::js-hex-charcode-decoder

