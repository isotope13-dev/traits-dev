defaults:
  platforms: [windows]
  for: [html, javascript]
  crit: notable
  conf: 0.98
traits:
  - id: com-set-document-property
    desc: Sets COM DOC property from a variable
    if:
      type: text
      regex: '(?i)\.setProperty\s*\(["'']DOC["'']\s*,\s*\w+\s*\)'
  - id: com-set-path-property
    desc: Sets COM Path property by name
    if:
      type: text
      regex: '(?i)\.setProperty\s*\(["'']Path["'']\s*,'
