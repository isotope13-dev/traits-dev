defaults:
  platforms: [unix, windows]
  for: [npm, package.json, javascript]

composite_rules:
  # The manifest and operations may be in separate archive members. This
  # preserves the old match population without claiming the declared script
  # performs the write. Neither a postinstall declaration nor a settings
  # write establishes configuration poisoning or supply-chain compromise.
  - id: npm-postinstall-claude-settings-write-cooccurrence
    desc: npm hook, global Claude settings path and file write co-occur
    crit: notable
    conf: 0.97
    scope: archive
    all:
      - id: metadata/package/scripts/lifecycle::postinstall-hook-declaration
      - id: metadata/package/scripts/lifecycle::postinstall-runs-node-script
      - id: micro-behaviors/fs/path/agent-config/file::claude-global-settings-path-js-two-step
      - id: micro-behaviors/fs/write/file/full::node-write-file-sync-call
