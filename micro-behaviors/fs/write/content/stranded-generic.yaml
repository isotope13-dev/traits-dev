# Neutral observations reviewed from stranded members.
traits:
- id: powershell-out-file-ps1-path
  desc: Out-File references a PowerShell script path
  crit: notable
  conf: 0.9
  for:
  - batch
  - powershell
  if:
    type: text
    regex: Out-File[^\n]{0,120}\.ps1
  unless:
  - type: path
    regex: (^|[\\/])Create-IntuneRemediation\.ps1$
  - id: metadata/package/testing/
  - id: metadata/file/naming::test-directory-component
  platforms:
  - windows
