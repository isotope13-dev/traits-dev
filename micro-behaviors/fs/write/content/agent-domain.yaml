defaults:
  platforms: [unix, windows]
  for: [elf, pe, c, cpp, go, rust, python, shell]
  crit: notable
  conf: 0.93

traits:
  - id: agent-config-domain-injection-message
    desc: Diagnostic reports config domain injection
    if:
      type: text
      regex: '(?i)domain injected into [A-Za-z0-9_./\\-]{1,100}\.(msh|conf|ini|json)\b'
