defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

composite_rules:
  - id: file-write-near-public-web-script-path
    desc: File write near public web script path
    crit: notable
    conf: 0.9
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/path/webserver::public-web-script-path-reference
    any:
      - id: micro-behaviors/fs/file/write/
