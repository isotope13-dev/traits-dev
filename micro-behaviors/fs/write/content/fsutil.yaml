traits:
  - id: fsutil-file-setzerodata-command
    desc: fsutil file content zeroing command reference
    crit: notable
    platforms: [windows]
    for: [batch, powershell, pe, python, javascript, csharp]
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bfsutil(\.exe)?\s+file\s+setZeroData\b'

