defaults:
  crit: notable
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-file-write-tmp
    desc: Ruby File.write targets a literal temp path
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call receiver: (constant) @receiver
          method: (identifier) @method
          arguments: (argument_list . (string) @path)) @write
          (#eq? @receiver "File")
          (#eq? @method "write")
          (#match? @path "^[\"']/((var/)?tmp)/"))
