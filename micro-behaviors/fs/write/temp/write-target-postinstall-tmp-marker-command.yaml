defaults:
  platforms: [unix]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: postinstall-tmp-marker-command
    desc: Postinstall targets a /tmp marker file
    platforms: [unix, windows]
    # A marker name alone proves no testing purpose or harmlessness: a hook
    # may redirect actual private-key contents into the same named output.
    if:
      type: value
      path: scripts.postinstall
      regex: '(>|touch) /tmp/[A-Za-z0-9_-]{0,24}marker[A-Za-z0-9_-]{0,40}'
