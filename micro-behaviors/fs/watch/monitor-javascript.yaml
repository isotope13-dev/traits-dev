defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: vscode-filesystem-watcher
    desc: Creates a VS Code filesystem watcher
    conf: 0.92
    if:
      type: text
      regex: '\.createFileSystemWatcher\s*\('
    unless:
      # `vscode.d.ts` declares the signature; it does not call it.
      - id: metadata/lang/scripted::dts-declaration-file
  - id: node-watch-file
    desc: Node watches a file for changes
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(^|\.)watchFile$'
  - id: node-recursive-file-existence-poll
    desc: Node recursively polls for file existence
    conf: 0.92
    if:
      type: text
      regex: 'existsSync\s*\(.{0,80}\)[\s\S]{0,200}setTimeout\s*\(\s*\(\)\s*=>\s*\w+\s*\('
  - id: node-fs-watch-call
    desc: Calls Node fs.watch on a path
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: fs.watch
  # Sync/watch tools enumerate secret files (.env, *.pem, *.key) in order to
  # SKIP them, side by side with junk markers (.DS_Store, Thumbs.db) that no
  # harvester targets. The adjacency window is tight enough that it reads as
  # an exclusion array rather than prose or a target list.
  - id: ignore-list-secret-then-junk
    desc: Secret file entry adjacent to junk marker
    conf: 0.9
    if:
      type: text
      regex: '(\.env[\w.*-]*|\*\.pem|\*\.key)["'',\s]{1,6}\.DS_Store'
  - id: ignore-list-junk-then-secret
    desc: Junk marker entry adjacent to secret file
    conf: 0.9
    if:
      type: text
      regex: '\.DS_Store["'',\s]{1,6}(\.env|\*\.pem|\*\.key)'
  # A .gitignore template keeps secrets out of version control: the same
  # *.pem/*.key globs sit beside build-output entries (node_modules/, dist/).
  - id: ignore-list-secret-key-globs
    desc: Lists *.pem and *.key as ignore globs
    conf: 0.9
    if:
      type: text
      regex: '\*\.pem["'',\s]{1,6}\*\.key\b'
  - id: ignore-list-build-output-dirs
    desc: Lists node_modules and dist as ignore entries
    conf: 0.9
    if:
      type: text
      regex: 'node_modules/["'',\s]{1,6}dist/'

composite_rules:
  - id: capture-policy-ignores-secret-files
    desc: Capture policy skips secrets and junk
    conf: 0.9
    any:
      - id: ignore-list-secret-then-junk
      - id: ignore-list-junk-then-secret
  - id: gitignore-template-ignores-secret-files
    desc: Ignore template excludes secrets and build output
    conf: 0.9
    near_bytes: 400
    all:
      - id: ignore-list-secret-key-globs
      - id: ignore-list-build-output-dirs
