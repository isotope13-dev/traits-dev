defaults:
  platforms: [macos]
  for: [macho, dylib]

traits:
  - id: fseventstream-create-import
    desc: Imports macOS filesystem event-stream creation
    crit: notable
    conf: 0.98
    if:
      type: import
      exact: FSEventStreamCreate
  - id: fseventstream-start-call
    desc: Starts macOS filesystem event stream
    for: [c, objectivec]
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: FSEventStreamStart
    unless:
      - type: function
        exact: FSEventStreamStart
