defaults:
  for: [pe, dll, c, cpp]
  platforms: [windows]

traits:
  - id: read-directory-changes-w
    desc: ReadDirectoryChangesW directory monitoring
    crit: notable
    conf: 0.9
    attack: T1083
    mbc: C0046
    for: [pe, dll, c, cpp, csharp, go, rust, zig, python]
    if:
      type: symbol
      exact: ReadDirectoryChangesW

  - id: read-directory-size-changes-source
    desc: Monitors directory entry size changes
    crit: notable
    conf: 0.94
    for: [c, cpp, csharp, go, rust, zig, python]
    if:
      type: text
      regex: '(?s)\bReadDirectoryChangesW\s*\([^;]{0,700}\bFILE_NOTIFY_CHANGE_SIZE\b'
