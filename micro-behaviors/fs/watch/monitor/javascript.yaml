defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: vscode-filesystem-watcher
    desc: Creates a VS Code filesystem watcher
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\.createFileSystemWatcher\s*\('
  - id: node-watch-file
    desc: Node watches a file for changes
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(^|\.)watchFile$'
