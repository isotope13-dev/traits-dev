# Fanotify Filesystem Monitoring (Linux-specific)
# MBC: E1083 (File and Directory Discovery)
# ATT&CK: T1083
defaults:
  crit: notable
  conf: 0.66
  platforms: [linux]
  for: [elf, c]
traits:
  - id: fanotify-init
    desc: Creates a fanotify notification group
    if:
      type: symbol
      exact: "fanotify_init"
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: fanotify-mark
    desc: Marks a path for fanotify events
    if:
      type: symbol
      exact: "fanotify_mark"
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
