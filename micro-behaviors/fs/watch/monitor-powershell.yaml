# Polling LastWriteTime is a neutral file-monitoring mechanism.  Remote-tasking
# objectives combine it with file-content evaluation and result capture.
defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-last-write-time-poll
    desc: PowerShell polls a file's LastWriteTime
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\(\s*Get-Item\b[^\r\n)]{1,160}\)\s*\.\s*LastWriteTime\b'
