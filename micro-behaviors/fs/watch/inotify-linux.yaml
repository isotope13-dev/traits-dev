# Inotify Filesystem Monitoring (Linux-specific)
# MBC: E1083 (File and Directory Discovery)
# ATT&CK: T1083
defaults:
  crit: notable
  conf: 0.66
  platforms: [linux]
  for: [elf, c]
traits:
  - id: inotify-init
    desc: Creates an inotify instance
    if:
      type: symbol
      exact: "inotify_init"
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: inotify-init1
    desc: Creates an inotify instance with flags
    if:
      type: symbol
      exact: "inotify_init1"
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: inotify-add-watch
    desc: Adds an inotify watch on a path
    if:
      type: symbol
      exact: "inotify_add_watch"
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: inotify-rm-watch
    desc: Remove an inotify filesystem watch
    if:
      type: symbol
      exact: "inotify_rm_watch"
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path

  # Go source reaches the same syscalls through golang.org/x/sys/unix
  # wrappers rather than libc symbols, so the C matchers above never see it.
  - id: go-x-sys-inotify-init
    desc: Creates an inotify instance via x/sys/unix
    for: [go]
    conf: 0.85
    if:
      type: symbol
      exact: unix.InotifyInit

  - id: go-x-sys-inotify-add-watch
    desc: Adds an inotify watch via x/sys/unix
    for: [go]
    conf: 0.85
    if:
      type: symbol
      exact: unix.InotifyAddWatch

  - id: go-x-sys-inotify-rm-watch
    desc: Removes an inotify watch via x/sys/unix
    for: [go]
    conf: 0.85
    if:
      type: symbol
      exact: unix.InotifyRmWatch
