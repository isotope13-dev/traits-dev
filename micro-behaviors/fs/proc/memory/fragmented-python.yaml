defaults:
  platforms: [unix]
  for: [python]
  crit: notable
  conf: 0.95
traits:
  - id: python-split-proc-prefix
    desc: References possibly split procfs prefix
    if:
      type: text
      regex: '/p["'' +f]*r["'' +f]*o["'' +f]*c/'
  - id: python-split-maps-suffix
    desc: References possibly split process maps suffix
    if:
      type: text
      regex: '["'']/m["'' +]*a["'' +]*p["'' +]*s["'']'
  - id: python-split-mem-suffix
    desc: References possibly split process memory suffix
    if:
      type: text
      regex: '["'']/m["'' +]*e["'' +]*m["'']'
composite_rules:
  - id: python-fragmented-proc-memory-dump
    desc: Procfs maps/mem paths with ranged reads
    crit: suspicious
    conf: 0.98
    all:
      - id: python-split-proc-prefix
      - id: python-split-maps-suffix
      - id: python-split-mem-suffix
      - id: micro-behaviors/fs/read/file/partial::python-seek-read-address-range
