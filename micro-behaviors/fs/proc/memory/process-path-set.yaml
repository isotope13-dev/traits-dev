defaults:
  platforms: [unix]
  for: [scripts, source]

composite_rules:
  # Path co-occurrence does not establish writes, target selection or IPC.
  - id: procfs-cmdline-maps-mem-paths
    desc: Procfs cmdline, maps and memory templates
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/fs/proc/memory::process-variable-pid-maps
      - id: micro-behaviors/fs/proc/memory::process-pid-mem-format
      - id: micro-behaviors/fs/proc/info/pid::process-pid-cmdline-template
    unless:
      - id: metadata/file/profile/source-indications/
      - id: metadata/file/string/identity::chrome-crashpad-handler-basename
      - id: micro-behaviors/process/debug/tool-markers::org-gnu-gdb-marker
      - id: micro-behaviors/process/debug/tool-markers::gdb-debugger-text-marker
      - id: well-known/lib/runtime/managed/dotnet-runtime/
