defaults:
  platforms: [unix]
  for: [elf]

composite_rules:
  # Path references establish neither reads nor a credential-dumping target.
  - id: process-maps-and-mem-paths-elf
    desc: References proc PID, maps and memory paths
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/fs/proc/info/path::process-arbitrary
      - id: micro-behaviors/fs/proc/memory::process-variable-pid-maps
    any:
      - id: micro-behaviors/fs/proc/memory::process-variable-pid-mem
      - id: micro-behaviors/fs/proc/memory::process-other-pid-mem-template-rust
      - id: micro-behaviors/fs/proc/memory::process-pid-mem-format
