defaults:
  platforms: [netscaler, appliance, unix]
  for: [scripts, binaries, go, java, kotlin, csharp, swift]

traits:
  - id: numeric-proc-mem-path
    desc: Numeric process memory path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '/proc/\d{1,10}/mem([^a-z/]|$)'
  - id: shell-variable-proc-mem-path
    desc: Shell-variable process memory path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '/proc/\$\w{1,40}/mem([^a-z/]|$)'
  - id: symbolic-proc-mem-path
    desc: Symbolic process memory path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '/proc/(PID|getpid\(\))/mem([^a-z/]|$)'

composite_rules:
  - id: proc-mem-path-variants
    desc: Process memory path variants
    crit: component
    conf: 0.98
    any:
      - id: micro-behaviors/fs/proc/memory::numeric-proc-mem-path
      - id: micro-behaviors/fs/proc/info/memory::proc-self-mem-path
      - id: micro-behaviors/fs/proc/memory::process-pid-mem-format
      - id: micro-behaviors/fs/proc/memory::shell-variable-proc-mem-path
      - id: micro-behaviors/fs/proc/memory::symbolic-proc-mem-path
