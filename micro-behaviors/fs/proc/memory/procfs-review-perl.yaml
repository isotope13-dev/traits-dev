defaults:
  platforms: [esxi, unix]
  for: [perl]

traits:
  - id: perl-proc-mem-rdwr-open
    desc: Perl process-memory path and read/write open
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '/proc/\$[A-Za-z_]\w*/mem[\s\S]{0,220}open\([^,\n]{0,80},\s*[''"]\+<'
  - id: perl-proc-pid-maps-path
    desc: Perl process memory maps path
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '/proc/\$[A-Za-z_]\w*/maps'
