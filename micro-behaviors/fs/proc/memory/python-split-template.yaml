# Bind the constructed base and suffix to the resulting path. Neither a lone
# /pro fragment nor an unrelated /m+em concatenation proves a procfs path.
defaults:
  platforms: [linux]
  for: [python]
traits:
  - id: python-split-proc-memory-path
    desc: Constructs split procfs maps/mem path
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (module
          (expression_statement (assignment
            left: (identifier) @base
            right: (binary_operator
              left: (string (string_content) @proc)
              operator: "+"
              right: (string (string_content) @pid_prefix (interpolation)))))
          (expression_statement (assignment
            left: (identifier) @suffix
            right: (binary_operator
              left: (string (string_content) @slash_m)
              operator: "+"
              right: (string (string_content) @tail))))
          (expression_statement (assignment
            right: (binary_operator
              left: (identifier) @base_read
              operator: "+"
              right: (identifier) @suffix_read)))
          (#eq? @proc "/pro")
          (#eq? @pid_prefix "c/")
          (#eq? @slash_m "/m")
          (#match? @tail "^(em|aps)$")
          (#eq? @base @base_read)
          (#eq? @suffix @suffix_read)) @path
