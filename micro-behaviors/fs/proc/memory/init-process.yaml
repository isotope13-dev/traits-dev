# Reading the memory of PID 1.
#
# Inside a container PID 1 *is* the application runtime -- an agent harness, an
# app server, a language interpreter -- so its heap holds whatever secrets that
# runtime was handed: session tokens, vault material, decrypted configuration.
# Code that opens /proc/1/mem is reading the memory of the process that started
# it, which ordinary software has no reason to do: crash handlers, profilers
# and debuggers address /proc/self/mem or a variable PID instead.
#
# Relocated here from objectives/execution/exploit/memory/openbsd-native.yaml,
# where this bare path substring was filed as an OpenBSD exploit atom and
# scoped to `for: [c, elf]`. The matcher is a path, not an exploit, so it
# belongs with the other procfs memory capabilities -- and it has to be
# language-neutral, because the technique shows up in shell one-liners, Python
# droppers and Go implants alike. The OpenBSD composite now references it.
defaults:
  platforms: [unix, android]
  for: [scripts, source, binaries, -beam, -wasm, -pyc, -staticlib, -elixir, -clojure]

traits:
  - id: init-process-memory-read
    desc: Reads PID 1 memory via /proc/1/mem
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: /proc/1/mem
    not:
      # Hardening guides, seccomp profiles and container-escape write-ups name
      # the path in order to block it.
      - regex: '(?i)(block|deny|prevent)[^\r\n]{0,100}/proc/1/mem|/proc/1/mem[^\r\n]{0,100}(block|deny|prevent)'
    unless:
      - id: well-known/tool/detection/
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
