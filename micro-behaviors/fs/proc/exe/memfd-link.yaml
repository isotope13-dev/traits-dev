# readlink(/proc/<pid>/exe) of a process started from an anonymous memfd
# returns "/memfd:<name> (deleted)". Code that carries the "/memfd:" prefix as
# its own C string is testing whether a process runs a fileless image. The
# literal is shorter than string extraction keeps, so match its bytes.
defaults:
  platforms: [linux, android]
  for: [elf]
traits:
  - id: memfd-exe-link-prefix
    desc: Checks exe links for memfd fileless images
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: rodata
      pattern: '00 2F 6D 65 6D 66 64 3A 00'
