defaults:
  platforms: [unix]
  for: [python, javascript]
traits:
  - id: process-self-exe-path
    desc: References own executable procfs path
    crit: notable
    conf: 0.66
    for: [scripts, binaries, c, cpp, objc, macho, rust, go, python]
    if:
      type: text
      substr: /proc/self/exe
    unless:
      - id: well-known/app/ai/coding-agent/tabby::tabby-basename
  - id: process-self-exe-partial
    desc: Read own executable path (self/exe)
    crit: baseline
    conf: 0.66
    if:
      type: text
      substr: self/exe
    unless:
      - id: well-known/app/ai/coding-agent/tabby::tabby-basename
  - id: process-self-ex-fragment
    desc: Read own executable path fragment (self/ex)
    crit: baseline
    conf: 0.58
    platforms:
      - linux
    for:
      - elf
    if:
      type: text
      substr: self/ex
    unless:
      - id: micro-behaviors/fs/proc/exe::process-self-exe-partial
  - id: linux-process-pid-exe
    desc: Process exe path via /proc
    crit: notable
    conf: 0.66
    if:
      type: text
      regex: /proc/[0-9]{1,10}/exe
  - id: process-exe-xor
    # XOR-encoded raw bytes in .rodata: a binary-only shape (the file default
    # covers the plain-text /proc paths that scripts and polyglots can carry).
    for: [elf, macho, staticlib]
    desc: XOR-obfuscated process exe path
    crit: notable
    conf: 0.78
    if:
      type: hex
      section: .rodata
      pattern: 7B 31 2C 31 54
  - id: process-exe-xor14
    # XOR-encoded raw bytes in .rodata: a binary-only shape (the file default
    # covers the plain-text /proc paths that scripts and polyglots can carry).
    for: [elf, macho, staticlib]
    desc: XOR-obfuscated process exe path
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .rodata
      pattern: 21 6B 76 6B
  - id: process-exe-xor62
    # XOR-encoded raw bytes in .rodata: a binary-only shape (the file default
    # covers the plain-text /proc paths that scripts and polyglots can carry).
    for: [elf, macho, staticlib]
    desc: XOR-obfuscated process exe path
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .rodata
      pattern: 4D 12 10 0D 01 4D 47 06 4D 07 1A 07 62
  - id: procfs-process-exe-fragment-cluster
    desc: Procfs process executable path fragments
    crit: notable
    conf: 0.9
    for: [elf]
    platforms: [linux, android]
    if:
      type: raw
      regex: '/proc[\x00]{1,4}exe'
composite_rules:
  - id: process-self-exe
    desc: Read own executable path via /proc
    crit: baseline
    conf: 0.66
    any:
      - id: micro-behaviors/fs/proc/exe::process-self-exe-path
      - id: micro-behaviors/fs/proc/exe::process-self-exe-partial
