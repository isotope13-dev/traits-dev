defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
# A host "profile" means several DIFFERENT procfs sources read together --
# cpuinfo plus meminfo plus the routing table is how IoT bots fingerprint a
# device. The previous single regex with `count_min: 2` counted OCCURRENCES,
# not distinct paths, so one path read twice satisfied it: any mount-aware
# program (backup tools, container runtimes, installers, df/mount wrappers,
# Debian's own deluser, which consults /proc/mounts three times before
# removing a home directory) was labelled a host-profile path *set*.
# Composing the four existing per-path atoms with `needs: 2` makes the matcher
# mean what the name says. Real profiling still matches -- it reads more than
# one source by definition -- and the six Mirai/IoT/exfil composites that
# reference this id keep working unchanged.
composite_rules:
  - id: host-profile-path-set
    desc: Two or more distinct procfs host-profiling paths referenced
    crit: notable
    conf: 0.88
    needs: 2
    any:
      - id: micro-behaviors/fs/proc/system::system-cpuinfo
      - id: micro-behaviors/fs/proc/system::system-meminfo
      - id: micro-behaviors/fs/proc/network::network-route
      - id: micro-behaviors/fs/proc/mounts::proc-mounts-path
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: well-known/app/drivers/
