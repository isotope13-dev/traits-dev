defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
composite_rules:
  # Host profiling means reading several *different* procfs facets (CPU, RAM,
  # routing table, mount table) to fingerprint the machine. Each path already
  # has a canonical atom, so this references them instead of re-matching a
  # 4-way alternation; `needs: 2` requires two DISTINCT facets.
  #
  # The previous form counted raw regex hits, so a single path mentioned twice
  # (the open plus an error/log string naming it) satisfied a "path set". That
  # over-fires on ordinary mount and CPU tooling -- df/findmnt wrappers,
  # container runtimes, backup and installer scripts that read /proc/mounts and
  # name it again in a failure message -- none of which profile the host.
  - id: host-profile-path-set
    desc: Two or more distinct procfs host-profiling paths referenced
    crit: notable
    conf: 0.88
    any:
      - id: micro-behaviors/fs/proc/system::system-cpuinfo
      - id: micro-behaviors/fs/proc/system::system-meminfo
      - id: micro-behaviors/fs/proc/network::network-route
      - id: micro-behaviors/fs/proc/mounts::proc-mounts-path
    needs: 2
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: well-known/app/drivers/
