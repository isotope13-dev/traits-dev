defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: system-cpuinfo
    desc: References /proc/cpuinfo system information path
    conf: 0.66
    if:
      type: text
      substr: /proc/cpuinfo
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/lang/compiler/systems::rustc-path
      - id: metadata/lang/compiler/systems::rust-src-path
      - id: metadata/document/html/
  - id: cpuinfo-hypervisor-marker-check
    desc: Checks /proc/cpuinfo for a hypervisor marker
    # Host diagnostics and benchmarks use this marker; hostile severity comes
    # from combining it with explicit sandbox-evasion behavior.
    conf: 0.92
    platforms: [linux, android]
    for: [scripts, binaries, elf]
    if:
      type: text
      regex: '/proc/cpuinfo[\s\S]{0,260}(hypervisor|virtualbox|qemu)'
    unless:
      - id: metadata/document/html/
  - id: system-meminfo
    desc: Get memory info from /proc/meminfo
    conf: 0.66
    if:
      type: text
      substr: /proc/meminfo
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      # Static glibc's sysinfo implementation embeds this path as data.
      - id: metadata/binary/linking/runtime::glibc-runtime-markers
      - id: metadata/binary/linking/static::elf-needed-libs-zero
  - id: linux-system-profile-path-set
    desc: References adjacent Linux system proc paths
    conf: 0.91
    platforms: [linux]
    for: [rust, elf]
    if:
      type: text
      regex: '/proc/version[\s\S]{0,520}/proc/cpuinfo[\s\S]{0,520}/proc/meminfo'
  - id: system-stat
    desc: References /proc/stat system statistics path
    conf: 0.66
    if:
      type: text
      substr: /proc/stat
    unless:
      # This is also a string in static glibc's host-statistics code; it is
      # not proof that the application itself reads /proc/stat.
      - id: metadata/binary/linking/runtime::glibc-runtime-markers
      - id: metadata/binary/linking/static::elf-needed-libs-zero
  - id: system-stat-xor07
    desc: XOR-0x07 encoded /proc/stat path
    conf: 0.85
    platforms: [linux, android]
    for: [elf]
    if:
      type: hex
      section: .rodata
      pattern: 28 77 75 68 64 28 74 73 66 73
  - id: system-osrelease
    desc: "Get kernel version /proc/sys/kernel/osrelease"
    conf: 0.66
    if:
      type: text
      substr: /proc/sys/kernel/osrelease
  - id: pid-max-path-reference
    desc: References Linux kernel PID limit path
    conf: 0.8
    platforms: [linux]
    if:
      type: text
      substr: /proc/sys/kernel/pid_max
  - id: proc-kallsyms
    desc: /proc/kallsyms kernel symbol file
    conf: 0.75
    if:
      type: text
      substr: /proc/kallsyms
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: well-known/tool/development/debug/profiler
      - id: well-known/app/infrastructure/systemd::container-runtime-component-basename
  - id: proc-ksyms
    desc: /proc/ksyms legacy kernel symbol file
    conf: 0.75
    platforms: [linux, android]
    if:
      type: text
      substr: /proc/ksyms
