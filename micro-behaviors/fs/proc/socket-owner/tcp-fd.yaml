defaults:
  platforms: [linux, android]
  for: [elf]
  crit: notable
  conf: 0.95
composite_rules:
  - id: tcp-table-pid-fd-inode-paths
    desc: TCP table, process FD and socket-inode references
    all:
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/fs/proc/info/path::process-variable-fd-path
      - id: micro-behaviors/fs/proc/socket-owner::proc-socket-inode-prefix
