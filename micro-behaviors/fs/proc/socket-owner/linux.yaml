defaults:
  platforms: [linux, android]
  for: [elf]

traits:
  - id: proc-pid-fd-zero-suffix
    desc: Split procfs file-descriptor-zero path suffix
    crit: component
    conf: 0.9
    if:
      # Cleave omits this short fragment from this binary's readable-string
      # facts, so match its literal .rodata bytes.
      type: hex
      section: .rodata
      pattern: "2F 66 64 2F 30"
  - id: proc-socket-inode-prefix
    desc: Procfs socket-inode link prefix
    crit: component
    conf: 0.9
    if:
      type: hex
      section: .rodata
      pattern: "73 6F 63 6B 65 74 3A 5B"
  - id: proc-pid-stat-suffix
    desc: Split procfs process-stat path suffix
    crit: component
    conf: 0.85
    if:
      type: text
      exact: /stat
  - id: proc-pid-cmdline-suffix
    desc: Split procfs process-command-line path suffix
    crit: component
    conf: 0.85
    if:
      type: text
      exact: /cmdline

composite_rules:
  - id: proc-socket-owner-path-fragments
    desc: Maps TCP socket inodes to owning procfs processes
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: proc-pid-fd-zero-suffix
      - id: proc-socket-inode-prefix
      - id: proc-pid-stat-suffix
      - id: proc-pid-cmdline-suffix
