defaults:
  platforms: [linux, android]
  for: [elf]

traits:
  - id: proc-socket-inode-prefix
    desc: Procfs socket-inode link prefix
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .rodata
      pattern: "73 6F 63 6B 65 74 3A 5B"

composite_rules:
  - id: proc-socket-owner-path-fragments
    desc: Maps TCP socket inodes to owning procfs processes
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/fs/proc/info/path::proc-net-tcp
      - id: micro-behaviors/fs/proc/info/path::proc-pid-fd-zero-suffix
      - id: proc-socket-inode-prefix
      - id: micro-behaviors/fs/proc/info/path::proc-pid-stat-suffix
      - id: micro-behaviors/fs/proc/cmdline::proc-cmdline-suffix
