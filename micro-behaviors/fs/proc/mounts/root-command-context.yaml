composite_rules:
- id: mount-root-path-command-context
  desc: Mount namespace and root paths coexist with command execution
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/fs/path/location::top-level-root-tree-path
  - id: micro-behaviors/fs/proc/mounts::mounts-mountinfo
  any:
  - id: micro-behaviors/process/create/shell/spawn::system-fn
  - id: micro-behaviors/process/create/subprocess::process-execution
  near_lines: 30
  platforms:
  - unix
  for:
  - c
  - cpp
  - python
  - go
  - rust
