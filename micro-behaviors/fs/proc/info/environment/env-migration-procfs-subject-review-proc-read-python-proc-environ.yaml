traits:
- id: python-formatted-proc-environ-read
  desc: Reads a process environment through procfs
  if:
    type: tree-sitter
    language: python
    query: "((with_statement\n  (with_clause (with_item value: (as_pattern\n    (call function: (identifier) @open\n      arguments: (argument_list . (binary_operator\n        left: (string) @path operator: \"%\")))\n    alias: (as_pattern_target (identifier) @handle))))\n  body: (block . (expression_statement (assignment\n    right: (call function: (attribute\n      object: (identifier) @reader attribute: (identifier) @read)))))) @operation\n  (#eq? @open \"open\")\n  (#match? @path \"^['\\\"]/proc/%[0-9]*[ds]/environ['\\\"]$\")\n  (#eq? @handle @reader)\n  (#eq? @read \"read\"))\n"
  unless:
  - id: metadata/lang/source/origin::plain-source-layer-path
