    query: "((for_statement\n  left: (identifier) @selected\n  right: (_) @iterator\n  body: (block [\n(with_statement\n  (with_clause (with_item value: (as_pattern\n    (call function: (identifier) @open\n      arguments: (argument_list . (identifier) @opened))\n    alias: (as_pattern_target (identifier) @handle))))\n  body: (block\n    (expression_statement (assignment right: [\n      (call function: (attribute object: (identifier) @reader attribute: (identifier) @read))\n      (call function: (attribute\n        object: (call function: (attribute object: (identifier) @reader attribute: (identifier) @read))\n        attribute: (identifier) @decode))\n    ]))))\n(try_statement body: (block (with_statement\n  (with_clause (with_item value: (as_pattern\n    (call function: (identifier) @open\n      arguments: (argument_list . (identifier) @opened))\n    alias: (as_pattern_target (identifier) @handle))))\n  body: (block\n    (expression_statement (assignment right: [\n      (call function:\
      \ (attribute object: (identifier) @reader attribute: (identifier) @read))\n      (call function: (attribute\n        object: (call function: (attribute object: (identifier) @reader attribute: (identifier) @read))\n        attribute: (identifier) @decode))\n    ]))))))\n  ])) @operation\n  (#match? @iterator \"^glob\\\\s*\\\\.\\\\s*glob\\\\s*\\\\(\\\\s*[\\\"']/proc/(\\\\[0-9\\\\]\\\\*|\\\\*)/environ[\\\"']\\\\s*[,)]\")\n  (#eq? @selected @opened)\n  (#eq? @handle @reader)\n  (#eq? @open \"open\")\n  (#eq? @read \"read\"))\n"
