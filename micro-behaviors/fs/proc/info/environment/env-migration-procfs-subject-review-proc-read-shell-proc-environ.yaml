defaults:
  platforms:
  - linux
  for:
  - shell
traits:
- id: shell-proc-environ-loop-read
  desc: Reads globbed process environments through stdin
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    language: bash
    query: "((for_statement\n  variable: (variable_name) @iterator\n  value: (_) @source\n  body: (do_group\n    (redirected_statement\n      body: (command name: (command_name (word) @reader))\n      redirect: (file_redirect \"<\"\n        destination: (string\n          (simple_expansion (variable_name) @read))))))\n (#match? @source \"^/proc/(\\\\*|\\\\[0-9\\\\]\\\\*)/environ$\")\n (#eq? @iterator @read)\n (#eq? @reader \"tr\"))\n"
