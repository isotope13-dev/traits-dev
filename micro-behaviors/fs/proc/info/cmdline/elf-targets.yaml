# Command basenames searched in procfs cmdline data by compact IoT implants.
# The target function opens `cmdline`, reads it, then tests this adjacent table
# with substring comparisons; these are process targets, not executable paths.
defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.94

traits:
  - id: downloader-command-cmdline-target-table
    desc: Downloader command cmdline target table
    if:
      type: raw
      regex: 'echo[\x00]{1,8}wget[\x00]{1,8}curl[\x00]{1,8}printf[\x00]'
