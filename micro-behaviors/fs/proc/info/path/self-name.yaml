defaults:
  platforms: [unix]
  for: [c, cpp, rust, go, elf]
traits:
  - id: self-comm-or-cmdline-path
    desc: References own procfs comm or cmdline path
    crit: notable
    conf: 0.82
    if:
      type: text
      regex: '/proc/self/(comm|cmdline)'
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

