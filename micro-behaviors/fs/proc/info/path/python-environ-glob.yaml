defaults:
  platforms: [linux]
  for: [python]
traits:
  - id: python-proc-environ-glob
    desc: Pathlib glob selects process environment files
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((call
          function: (attribute
            object: (call function: (identifier) @path
              arguments: (argument_list . (string (string_content) @root)))
            attribute: (identifier) @glob)
          arguments: (argument_list . (string (string_content) @pattern))) @selection
          (#eq? @path "Path")
          (#eq? @root "/proc")
          (#eq? @glob "glob")
          (#match? @pattern "^(\\*|\\[0-9\\]\\*)/environ$"))
