# A glob reference does not prove a read, credential selection, or a transfer.
# Preserve the shell/workflow scope independently of the Python/JS glob rule.
# The former hostile glob-plus-tr composite added no read or data-flow proof:
# printf of this glob beside an unrelated tr command satisfied it as well.
# Keep both standalone observations instead of assigning intent to proximity.
defaults:
  platforms: [linux]
  for: [shell, github-actions]
  crit: notable
  conf: 0.96

traits:
  - id: shell-all-process-environ-glob
    desc: All-process procfs environment glob reference
    if:
      type: text
      # In a shell glob, + is a literal; [0-9]+ does not enumerate numeric PIDs.
      regex: '/proc/(\*|\[0-9\]\*)/environ\b'
