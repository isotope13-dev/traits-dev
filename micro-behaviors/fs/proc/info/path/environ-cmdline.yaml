# These paths are used by process inspectors as well as credential collectors.
# Neither a read, all-process enumeration, nor secret selection is required.
defaults:
  for: [python, javascript]
  platforms: [unix]
composite_rules:
  - id: process-environ-cmdline-paths
    desc: Process environment and command-line procfs paths
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/fs/proc/info/path::process-environ-targeting
      - id: micro-behaviors/fs/proc/cmdline::proc-cmdline-glob-or-variable-pid
