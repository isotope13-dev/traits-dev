defaults:
  platforms: [linux]
  for: [elf]
  attack: T1057
  mbc: E1057
composite_rules:
  - id: full-pid-attribute-walk
    desc: References multiple arbitrary-PID procfs attribute templates
    crit: notable
    conf: 0.94
    needs: 4
    any:
      - id: micro-behaviors/fs/proc/info/pid
    unless:
      - id: well-known/tool/sysadmin/container/
      - id: micro-behaviors/process/debug/tool-markers::debugger-tool-marker
      - id: metadata/path::valgrind-named-path-component
      - id: well-known/lib/observability/apm-insight::apm-insight-native-crash-monitor
