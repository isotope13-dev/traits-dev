defaults:
  platforms: [routeros, appliance, unix]
  for: [rust, elf]

traits:
  - id: rust-ptrace-scope-path
    desc: Rust Yama ptrace scope path
    # Referencing the YAMA sysctl path is neutral — debuggers, profilers and
    # sandboxes all read it, and the kernel docs name it. The evasion is a write
    # that sets it to 0; the path alone does not establish a change.
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /proc/sys/kernel/yama/ptrace_scope
    unless:
      - id: micro-behaviors/process/debug/tool-markers::gdb-banner-text
      - id: micro-behaviors/process/debug/tool-markers::lldb-debugserver-path-env
      - id: micro-behaviors/process/debug/tool-markers::org-gnu-gdb-marker
