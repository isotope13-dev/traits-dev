defaults:
  platforms: [unix, windows]
  crit: component
composite_rules:
  - id: proc-fd-path
    desc: Proc descriptor path reference
    crit: component
    conf: 0.5
    for:
    - scripts
    - binaries
    - c
    - cpp
    - rust
    - go
    - elf
    any:
    - id: micro-behaviors/fs/proc/info/path::self-fd-directory-reference
    - id: micro-behaviors/fs/proc/info/path::self-fd-path-literal
