defaults:
  for: [ruby]
  platforms: [linux]

traits:
  # "/proc/#{Process.pid}/fd/..." names one of this process's own descriptors.
  - id: ruby-own-process-fd-path
    desc: Ruby builds its own /proc fd path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '/proc/#\{(Process\.pid|\$\$|Process\.ppid)\}/fd\b'
