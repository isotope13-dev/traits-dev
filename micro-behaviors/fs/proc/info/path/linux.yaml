defaults:
  platforms: [unix]
  for: [python, javascript]
traits:
  - id: user-namespace-id-map-path
    desc: User namespace ID map path reference
    crit: notable
    conf: 0.78
    for: [binaries, scripts]
    platforms: [linux, android]
    if:
      type: text
      regex: '/proc/self/(uid_map|gid_map|setgroups)'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: procfs-path-reference
    desc: "/proc fs path in native binary"
    crit: baseline
    conf: 0.4
    for: [elf]
    platforms: [unix, android]
    if:
      type: text
      substr: /proc/
      section: .text
  - id: process-arbitrary
    desc: Access /proc for arbitrary PIDs
    crit: notable
    conf: 0.66
    if:
      type: text
      regex: '(/proc/[%{$][/\$\w\}]{0,12}|^/proc/%[^/]{1,12}$|/proc/\[0-9\]\*)'
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - type: basename
        regex: ^(node-pty|pty)\.node$
      - id: metadata/file/string/identity::chrome-sandbox-basename
      - type: basename
        exact: chrome_crashpad_handler
      - id: well-known/app/ai/tabby::tabby-basename
      - type: text
        substr: self/
  - id: process-self-exe-path
    desc: Read own executable path (/proc/self/exe)
    crit: baseline
    conf: 0.66
    for: [scripts, binaries, c, cpp, objc, macho, rust, go, python]
    if:
      type: literal
      kind: string
      substr: /proc/self/exe
    unless:
      - id: well-known/app/ai/tabby::tabby-basename
  - id: process-self-exe-partial
    desc: Read own executable path (self/exe)
    crit: baseline
    conf: 0.66
    if:
      type: text
      substr: self/exe
    unless:
      - id: well-known/app/ai/tabby::tabby-basename
  - id: process-self-fd-path
    desc: Access /proc/self/fd file descriptor path
    crit: notable
    conf: 0.7
    for: [elf, c, cpp, rust, go]
    platforms: [linux]
    if:
      type: text
      substr: /proc/self/fd/
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: well-known/app/system/drivers/
      - id: well-known/app/infrastructure/systemd::container-runtime-component-basename
  - id: process-variable-fd-path
    desc: Access variable process /proc fd path
    crit: notable
    conf: 0.84
    for: [scripts, elf, c, cpp, rust, go]
    platforms: [linux]
    if:
      type: text
      regex: '/proc/(\$|%)[^/\s]{1,40}/fd'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: python-self-process-fd-path
    desc: Python builds its own proc fd path
    crit: notable
    conf: 0.94
    for: [python]
    platforms: [linux]
    if:
      type: text
      regex: '/proc/\{(os\.)?getpid\(\)\}/fd/\{[A-Za-z_][A-Za-z0-9_]*\}'
  - id: process-fd-memfd-discovery
    desc: Scans proc fd links for memfd descriptor
    crit: notable
    conf: 0.9
    for: [scripts, elf, c, cpp, rust, go]
    platforms: [linux]
    # The behaviour is walking /proc/<pid>/fd and matching the "memfd:" link
    # target, so require the /fd path component. Without it the window was
    # wide enough to pair any /proc path with any nearby identifier spelled
    # memfd — bcc's usdt.cc opens "/proc/%d/mem" and names the returned
    # descriptor `memfd` on the next line.
    if:
      type: text
      regex: '(?is)/proc/[^"]{0,40}/fd.{0,160}\bmemfd\b'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      # runc's official memfd-bind helper legitimately inspects proc-fd
      # links while creating a sealed in-memory copy of the runc binary.
      - id: well-known/app/infrastructure/runc::runc-source-member-path
  - id: process-self-ex-fragment
    desc: Read own executable path fragment (self/ex)
    crit: baseline
    conf: 0.58
    platforms:
      - linux
    for:
      - elf
    if:
      type: text
      substr: self/ex
    unless:
      - type: text
        substr: self/exe
  - id: process-self-cmdline
    desc: References own command-line procfs path
    crit: notable
    conf: 0.66
    for: [scripts, binaries, c, cpp, rust, go]
    platforms: [unix, android]
    if:
      type: text
      substr: /proc/self/cmdline
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: process-self-comm
    desc: Access own process name via /proc/self/comm
    crit: notable
    conf: 0.66
    for: [scripts, binaries, c, cpp, rust, go]
    platforms: [unix, android]
    if:
      type: text
      substr: /proc/self/comm
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: process-self-status
    desc: References own process status procfs path
    crit: notable
    conf: 0.74
    for: [scripts, -javascript, -typescript, elf, c, cpp]
    platforms: [unix, android]
    if:
      type: text
      substr: /proc/self/status
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: process-self-environ
    desc: Read own process environment via procfs
    crit: notable
    conf: 0.92
    for: [scripts, -javascript, -typescript, binaries, c, cpp, rust, go]
    platforms: [linux, android]
    if:
      type: text
      substr: /proc/self/environ
  - id: process-parent-environ
    desc: Read parent process environment via procfs
    crit: notable
    conf: 0.94
    for: [shell, python, javascript, typescript, ruby, go]
    platforms: [linux, android]
    if:
      type: text
      regex: '/proc/(\$\{?[A-Za-z_][A-Za-z0-9_.]*\}?|%[A-Za-z_][A-Za-z0-9_.]*)/environ'
  # KNOWN DEFECT -- this matcher cannot fire on a compiled binary. stng's
  # character-class chaos filter drops the run "TracerPid:": its class runs are
  # [T][racer][P][id][:], giving 4 transitions and an average run length of
  # exactly 2.0, both on the MIN_TRANSITIONS_FOR_CHAOS /
  # MAX_AVG_RUN_LENGTH_CHAOS thresholds. Dropping the colon fixes matching but
  # duplicates kernel::ptrace-debugger (native), debugger-detect::tracerpid-
  # string (scripts) and java-tracerpid-check, which are deliberately disjoint
  # by `for:`. The correct fix is to delete this trait and repoint its 11
  # consumers at whichever of those three matches their file types.
  # Matches the `TracerPid:` field label. stng previously discarded that run
  # (its class pattern hit the chaos thresholds), so this could not fire on a
  # compiled binary; fixed upstream in stng, verified end-to-end on an ELF.
  #
  # This atom overlaps three other TracerPid atoms that are deliberately kept
  # disjoint by `for:` -- see the rationale comment on
  # debugger-detect/check::tracerpid-string. Consolidating them is a design
  # change, not a repair, so it is left alone here.
  - id: tracerpid-status-field
    desc: TracerPid process status field
    crit: notable
    conf: 0.7
    for: [scripts, binaries, c, cpp, rust, go]
    platforms: [unix, android]
    if:
      type: text
      substr: "TracerPid:"
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: metadata/library/structure::js-emscripten-embind-val-marker
      - id: well-known/lib/runtime/dotnet-runtime::minipal-debugger-header
  - id: process-self-maps
    desc: Read own process memory maps
    crit: notable
    conf: 0.66
    if:
      type: text
      substr: /proc/self/maps
    unless:
      - id: well-known/app/ai/tabby::tabby-basename
      - id: metadata/file/string/identity::python3-interpreter-basename
  - id: process-pid-maps
    desc: Read process memory maps via /proc/PID/maps
    crit: notable
    conf: 0.66
    if:
      type: text
      regex: /proc/[0-9]{1,10}/maps
  - id: process-pid-maps-format
    desc: Process maps path format
    crit: notable
    conf: 0.72
    if:
      type: text
      regex: ^/proc/%[^/]{1,12}/maps$
    unless:
      - type: basename
        exact: chrome_crashpad_handler
      - id: well-known/app/ai/tabby::tabby-basename
      - type: text
        substr: self/
  - id: process-variable-pid-maps
    desc: Builds a variable /proc PID maps path
    crit: notable
    conf: 0.88
    # The template syntax is shared by shell expansion, Python/Rust format
    # strings, C printf strings, and their compiled representations. Keep this
    # capability language-neutral so cross-process scrapers are not tied to the
    # implementation language of one campaign.
    for: [scripts, source, binaries, -beam, -wasm, -pyc, -staticlib, -elixir, -clojure]
    if:
      type: text
      regex: '/proc/(\{[^/]{1,40}\}|\$\{[^/]{1,40}\}|%[^/]{1,40})/maps'
  - id: process-pid-stdin-fd-path
    desc: Access process standard input via /proc
    crit: notable
    conf: 0.88
    for: [scripts, binaries, c, cpp, rust, go]
    platforms: [unix, android]
    if:
      type: text
      regex: '/proc/(\{[^/]{1,80}\}|\$\{[^/]{1,80}\}|%[^/]{1,80}|self|[0-9]{1,8})/fd/0\b'
  - id: process-pid-mem
    desc: Access process memory via /proc/*/mem
    crit: suspicious
    conf: 0.75
    if:
      type: text
      regex: /proc/[0-9]{1,10}/mem
    unless:
      # Permission and safety tests use /proc/PID/mem as a denied-path
      # fixture; the test string does not demonstrate memory scraping.
      - id: metadata/package/testing/presence/harness/
  - id: python-proc-memory-glob
    desc: Python enumerates arbitrary process memory files
    crit: suspicious
    conf: 0.93
    for: [python]
    if:
      type: text
      regex: '\bglob\.glob\s*\(\s*["'']/proc/\*/mem["'']\s*\)'
  - id: process-variable-pid-mem
    desc: Reads variable process memory via /proc
    crit: suspicious
    conf: 0.88
    for: [scripts, source, binaries, -beam, -wasm, -pyc, -staticlib, -elixir, -clojure]
    if:
      type: text
      regex: '/proc/(\{[^/]{1,40}\}|\$\{[^/]{1,40}\}|%[^/]{1,40})/mem'
    unless:
      # Chromium/Electron Crashpad reads /proc/%d/mem for the crashing process;
      # that is crash reporting, not credential scraping.
      - type: basename
        exact: chrome_crashpad_handler
      - id: metadata/file/string/identity::chrome-crashpad-handler-basename
      - id: well-known/lib/runtime/electron::standard-electron-jit-helper-basename
      # .NET CoreCLR / dbgshim / DAC open /proc/%lu/mem for dump and
      # managed-debugger attach; that is runtime diagnostics, not scraping.
      - id: well-known/lib/runtime/dotnet-runtime::dotnet-dbgshim-runtime-context
      - id: well-known/lib/runtime/dotnet-runtime::dotnet-coreclr-native-runtime-context
      - id: objectives/anti-analysis/debugger-detect/check::dotnet-runtime-debug-helper-marker
      - id: well-known/lib/native/box64/
      - id: well-known/app/infrastructure/runc::runc-source-tree-context
  - id: process-pid-mem-format
    desc: Process memory path format
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: ^/proc/%[^/]{1,12}/mem$
    unless:
      - type: basename
        exact: chrome_crashpad_handler
      - id: well-known/app/ai/tabby::tabby-basename
      - id: metadata/package/testing/presence/harness/
      - type: text
        substr: self/
  - id: process-pid-mem-template-rust
    desc: Rust procfs process memory path template
    crit: notable
    conf: 0.88
    for: [rust, elf]
    platforms: [routeros, appliance, unix]
    if:
      type: text
      regex: '/proc/(\{.{0,80}\}|self|[0-9]{1,8})/(task/[^/]{1,32}/)?mem\b'
    unless:
      - id: micro-behaviors/process/debug/tool-markers::gdb-debugger-text-marker
      - id: micro-behaviors/process/debug/tool-markers::org-gnu-gdb-marker
      - id: micro-behaviors/process/debug/tool-markers::lldb-ptrace-text-marker
    downgrade:
      any:
        - id: micro-behaviors/ui/help/
  - id: process-pid-cmdline
    desc: Read process command line via /proc/PID/cmdline
    crit: notable
    conf: 0.66
    if:
      type: text
      regex: /proc/[0-9]{1,10}/cmdline
  - id: process-pid-cmdline-format
    desc: Process cmdline path format
    crit: notable
    conf: 0.72
    for: [scripts, elf, c, cpp]
    platforms: [unix, android]
    if:
      type: text
      regex: ^/proc/%[^/]{1,12}/cmdline$
    unless:
      - type: basename
        regex: ^(node-pty|pty)\.node$
  - id: process-maps-cmdline-fragment-cluster
    desc: Split proc maps/cmdline path cluster
    crit: notable
    conf: 0.78
    for: [elf]
    platforms: [unix, android]
    if:
      type: raw
      regex: '/proc/\x00[\s\S]{0,128}/maps\x00[\s\S]{0,128}/cmdline\x00'
      section: .rodata
  - id: process-pid-cmdline-suffix
    desc: Process cmdline suffix format
    crit: notable
    conf: 0.74
    for: [elf]
    if:
      type: text
      regex: ^%[^/]{1,12}/cmdline$
  - id: process-pid-cmdline-suffix-xor
    desc: XOR-obfuscated process cmdline suffix
    crit: suspicious
    conf: 0.88
    for: [elf]
    if:
      type: encoded
      encoding: xor
      regex: ^%[^/]{1,12}/cmdline$
  - id: lua-process-info-path
    desc: Lua builds /proc process information paths
    crit: notable
    conf: 0.88
    for: [lua]
    if:
      type: text
      regex: '/proc/.{0,24}/(cmdline|comm|status)'
  - id: process-pid-environ
    desc: Read process environment via /proc/*/environ
    crit: suspicious
    unless:
      - id: well-known/tool/offensive/pentestkit/
    conf: 0.66
    if:
      type: text
      regex: '/proc/[0-9]{1,10}/environ'
    not:
      - exact: /proc/1/environ
      - substr: /proc/self/
    downgrade:
      any:
        - id: micro-behaviors/dylib/library/family/
  - id: proc-pid-environ-glob
    desc: Glob pattern for /proc/*/environ
    # Same capability as process-pid-environ (notable): enumerating environ via
    # a glob is ordinary process discovery (worker pools, psutil fallbacks), not
    # by itself suspicious intent.
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '/proc/\[0-9\]\*/environ'
  - id: proc-pid-cmdline-glob
    desc: Glob pattern for /proc/*/cmdline
    # Same capability as process-pid-cmdline (notable): enumerating cmdline via
    # a glob is ordinary process discovery, not by itself suspicious intent.
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '/(proc/\[0-9\]\*|\$[a-zA-Z_]\w*)/cmdline'
  - id: process-var-cmdline
    desc: Read process cmdline via /proc var path
    crit: notable
    conf: 0.7
    for: [shell, python, lua]
    if:
      type: string_literal
      regex: /proc/[\$\{%f].{0,20}/cmdline
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: process-var-environ
    desc: "Read process env via /proc var path"
    crit: notable
    conf: 0.7
    for:
      - shell
      - python
      - lua
    unless:
      - id: micro-behaviors/fs/proc/info/path::kde-dbus-session-environ
      # AI-agent observability tools read /proc env for telemetry.
      - id: well-known/tool/detection/ai-guardrail/
    if:
      type: string_literal
      regex: /proc/[\$\{%f].{0,20}/environ
  - id: lua-process-var-environ
    desc: Lua builds /proc process environment paths
    crit: suspicious
    conf: 0.88
    for: [lua]
    if:
      type: text
      regex: '/proc/.{0,30}/environ'
  - id: kde-dbus-session-environ
    desc: KDE DBus session lookup
    crit: notable
    conf: 0.9
    for:
      - shell
      - python
    if:
      type: text
      regex: DBUS_SESSION_BUS_ADDRESS.{0,120}/proc/[\$\{%f].{0,20}/environ
  - id: process-pid-environ-suffix
    desc: Read process environment suffix via proc
    crit: suspicious
    conf: 0.78
    for: [elf]
    if:
      type: text
      regex: ^%[^/]{1,12}/environ$
  - id: process-pid-environ-suffix-xor
    desc: XOR-obfuscated process environment suffix
    crit: suspicious
    conf: 0.9
    for: [elf]
    if:
      type: encoded
      encoding: xor
      regex: ^%[^/]{1,12}/environ$
  - id: process-pid-fd
    desc: References /proc/PID/fd path
    crit: notable
    conf: 0.66
    if:
      type: text
      regex: /proc/[0-9]{1,10}/fd
  - id: linux-process-pid-exe
    desc: Process exe path via /proc
    crit: notable
    conf: 0.66
    if:
      type: text
      regex: /proc/[0-9]{1,10}/exe
  - id: process-pid-cmdline-token
    desc: Procfs process command-line path fragment
    crit: component
    conf: 0.72
    for: [elf, c, cpp, objc, rust]
    platforms: [linux, android]
    if:
      type: text
      exact: cmdline
  - id: process-pid-status
    desc: Read process status via /proc/*/status
    crit: notable
    conf: 0.66
    if:
      type: text
      regex: /proc/[0-9]{1,10}/status
  - id: process-pid-stat
    desc: Read process statistics via /proc/*/stat
    crit: notable
    conf: 0.66
    if:
      type: text
      regex: /proc/[0-9]{1,10}/stat\b
  - id: process-pid-stat-template
    desc: Procfs process stat path template
    crit: notable
    conf: 0.8
    for: [elf, c, cpp, rust, go]
    platforms: [linux, android]
    if:
      type: text
      regex: /proc/%[sd]/stat\b
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: python-proc-path-join
    desc: os.path.join for /proc sensitive files
    crit: notable
    conf: 0.85
    if:
      # `os.path.join(proc_dir, "<pseudo-file>")` — the /proc pseudo-files are
      # exact path SEGMENTS. Anchor the arg so a bare substring no longer matches
      # ordinary filenames (e.g. "unicode_ind**exe**r.json", "...mem...", "...maps...").
      type: symbol
      kind: call
      exact: 'os.path.join'
      arg:
        kind: string
        regex: '^(cmdline|maps|mem|environ|exe)$'

  - id: process-oom
    desc: Adjust OOM score via procfs
    crit: suspicious
    conf: 0.66
    if:
      type: text
      regex: /proc/[0-9]{1,10}/oom_score_adj
  - id: self-oom-score-adj-path
    desc: References the self OOM score adjustment path
    crit: notable
    conf: 0.92
    for: [elf, c, cpp, rust, go]
    platforms: [linux, android]
    if:
      type: text
      # Source embeds the path inside open()/fopen() calls; exact: only
      # matches a whole trimmed line in raw-text mode.
      substr: /proc/self/oom_score_adj
  - id: self-oom-adj-path
    desc: References the legacy self OOM adjustment path
    crit: notable
    conf: 0.92
    for: [elf, c, cpp, rust, go]
    platforms: [linux, android]
    if:
      type: text
      substr: /proc/self/oom_adj

  - id: proc-net-tcp
    desc: TCP connection table path reference
    crit: notable
    conf: 0.7
    for: [scripts, elf, c, cpp, rust, go]
    platforms: [linux, android]
    if:
      type: text
      substr: /proc/net/tcp
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: procfs-process-fd-stat-walk
    desc: Traverse procfs process descriptors and stats
    crit: notable
    conf: 0.92
    for: [elf]
    platforms: [linux, android]
    if:
      type: raw
      regex: '/proc/[\x00]{1,2}/fd/[0-9][\x00-\xff]{0,96}/stat'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: proc-net-unix
    desc: Read Unix-domain socket table
    crit: notable
    conf: 0.8
    for: [scripts, elf, c]
    platforms: [linux, android]
    if:
      type: text
      exact: /proc/net/unix
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
