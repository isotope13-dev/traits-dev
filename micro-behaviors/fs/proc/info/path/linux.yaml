defaults:
  platforms: [unix]
  for: [python, javascript]
traits:
  # Referenced from the `unless:` legs that used to spell this inline in three
  # places; once the /proc traits were split across leaves those copies became
  # invisible duplicates of each other.
  - id: proc-self-path-fragment
    desc: References the /proc self path fragment
    crit: component
    conf: 0.5
    if:
      type: text
      substr: self/
  - id: user-namespace-id-map-path
    desc: User namespace ID map path reference
    crit: notable
    conf: 0.78
    for: [binaries, scripts]
    platforms: [linux, android]
    if:
      type: text
      regex: '/proc/self/(uid_map|gid_map|setgroups)'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: procfs-path-reference
    desc: "/proc fs path in native binary"
    crit: baseline
    conf: 0.4
    for: [elf]
    platforms: [unix, android]
    if:
      type: text
      substr: /proc/
      section: .text
  - id: process-arbitrary
    desc: Access /proc for arbitrary PIDs
    crit: notable
    conf: 0.66
    for: [elf, python, javascript]
    if:
      type: text
      regex: '(/proc/[%{$][/\$\w\}]{0,12}|^/proc/%[^/]{1,12}$|/proc/\[0-9\]\*)'
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - type: basename
        regex: ^(node-pty|pty)\.node$
      - id: metadata/file/string/identity::chrome-sandbox-basename
      - type: basename
        exact: chrome_crashpad_handler
      - id: well-known/app/ai/coding-agent/tabby::tabby-basename
      - id: micro-behaviors/fs/proc/info/path::proc-self-path-fragment
  - id: process-self-fd-path
    desc: References own file-descriptor procfs directory
    crit: notable
    conf: 0.7
    for: [elf, c, cpp, rust, go]
    platforms: [linux]
    if:
      type: text
      substr: /proc/self/fd/
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: well-known/app/system/drivers/
      - id: well-known/app/infrastructure/systemd::container-runtime-component-basename
  - id: process-variable-fd-path
    desc: Access variable process /proc fd path
    crit: notable
    conf: 0.84
    for: [scripts, elf, c, cpp, rust, go]
    platforms: [linux]
    if:
      type: text
      regex: '/proc/(\$|%)[^/\s]{1,40}/fd'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: python-self-process-fd-path
    desc: Python builds its own proc fd path
    crit: notable
    conf: 0.94
    for: [python]
    platforms: [linux]
    if:
      type: text
      regex: '/proc/\{(os\.)?getpid\(\)\}/fd/\{[A-Za-z_][A-Za-z0-9_]*\}'
  - id: process-self-comm
    desc: Access own process name via /proc/self/comm
    crit: notable
    conf: 0.66
    for: [scripts, binaries, c, cpp, rust, go]
    platforms: [unix, android]
    if:
      type: text
      substr: /proc/self/comm
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: variable-proc-comm-path
    desc: Builds variable process name path
    crit: notable
    conf: 0.9
    for: [scripts, c, cpp, rust, go, zig, elf, so]
    platforms: [linux]
    if:
      type: text
      regex: '/proc/(%[^/\s]{1,16}|\$\{?[^/\s]{1,32}\}?|\{[^/\s]{1,32}\})/comm'
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: process-self-status
    desc: References own process status procfs path
    crit: notable
    conf: 0.74
    for: [scripts, -javascript, -typescript, elf, c, cpp, go, rust]
    platforms: [unix, android]
    if:
      type: text
      substr: /proc/self/status
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: ptrace-scope-policy-path
    desc: References Linux ptrace scope policy
    crit: notable
    conf: 0.96
    for: [source]
    platforms: [linux]
    if:
      type: literal
      kind: string
      exact: /proc/sys/kernel/yama/ptrace_scope
  - id: process-self-environ
    desc: References own process environment procfs path
    crit: notable
    conf: 0.92
    for: [scripts, -javascript, -typescript, binaries, c, cpp, rust, go]
    platforms: [linux, android]
    if:
      type: text
      substr: /proc/self/environ
  # KNOWN DEFECT -- this matcher cannot fire on a compiled binary. stng's
  # character-class chaos filter drops the run "TracerPid:": its class runs are
  # [T][racer][P][id][:], giving 4 transitions and an average run length of
  # exactly 2.0, both on the MIN_TRANSITIONS_FOR_CHAOS /
  # MAX_AVG_RUN_LENGTH_CHAOS thresholds. Dropping the colon fixes matching but
  # duplicates kernel::ptrace-debugger (native), debugger-detect::tracerpid-
  # string (scripts) and java-tracerpid-check, which are deliberately disjoint
  # by `for:`. The correct fix is to delete this trait and repoint its 11
  # consumers at whichever of those three matches their file types.
  # Matches the `TracerPid:` field label. stng previously discarded that run
  # (its class pattern hit the chaos thresholds), so this could not fire on a
  # compiled binary; fixed upstream in stng, verified end-to-end on an ELF.
  #
  # This atom overlaps three other TracerPid atoms that are deliberately kept
  # disjoint by `for:` -- see the rationale comment on
  # debugger-detect/check::tracerpid-string. Consolidating them is a design
  # change, not a repair, so it is left alone here.
  - id: tracerpid-status-field
    desc: TracerPid process status field
    crit: notable
    conf: 0.7
    for: [scripts, binaries, c, cpp, rust, go]
    platforms: [unix, android]
    if:
      type: text
      substr: "TracerPid:"
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/build/bundler/runtime::js-emscripten-embind-val-marker
      - id: well-known/lib/runtime/managed/dotnet-runtime::minipal-debugger-header
  - id: process-pid-stdin-fd-path
    desc: Access process standard input via /proc
    crit: notable
    conf: 0.88
    for: [scripts, binaries, c, cpp, rust, go]
    platforms: [unix, android]
    if:
      type: text
      regex: '/proc/(\{[^/]{1,80}\}|\$\{[^/]{1,80}\}|%[^/]{1,80}|self|[0-9]{1,8})/fd/0\b'
  - id: lua-process-info-path
    desc: Lua builds /proc process information paths
    crit: notable
    conf: 0.88
    for: [lua]
    if:
      type: text
      regex: '/proc/.{0,24}/(cmdline|comm|status)'
  - id: process-pid-environ
    desc: Read process environment via /proc/*/environ
    crit: suspicious
    unless:
      - id: well-known/tool/offensive/pentestkit/
    conf: 0.66
    if:
      type: text
      regex: '/proc/[0-9]{1,10}/environ'
    not:
      - exact: /proc/1/environ
      - substr: /proc/self/
    downgrade:
      any:
        - id: micro-behaviors/dylib/library/family/
  - id: proc-init-environ
    desc: Reads PID 1 process environment
    crit: notable
    conf: 0.88
    if:
      type: text
      exact: /proc/1/environ
  - id: proc-pid-environ-glob
    desc: Glob pattern for /proc/*/environ
    # Same capability as process-pid-environ (notable): enumerating environ via
    # a glob is ordinary process discovery (worker pools, psutil fallbacks), not
    # by itself suspicious intent.
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: '/proc/[0-9]*/environ'
  - id: process-var-environ
    desc: Reads variable-PID environment via procfs
    crit: notable
    conf: 0.94
    for: [shell, python, javascript, typescript, ruby, go, lua]
    platforms: [linux, android]
    unless:
      - id: micro-behaviors/fs/proc/info/path::kde-dbus-session-environ
      # AI-agent observability tools read /proc env for telemetry.
      - id: well-known/tool/detection/ai-guardrail/
    if:
      type: text
      regex: '/proc/(\$\{?[A-Za-z_][\w.]*\}?|%[A-Za-z_][\w.]*|\{[A-Za-z_][\w.]*\})/environ'
  - id: lua-process-var-environ
    desc: Lua builds /proc process environment paths
    crit: suspicious
    conf: 0.88
    for: [lua]
    if:
      type: text
      regex: '/proc/.{0,30}/environ'
  - id: kde-dbus-session-environ
    desc: KDE DBus session lookup
    crit: notable
    conf: 0.9
    for:
      - shell
      - python
    if:
      type: text
      regex: DBUS_SESSION_BUS_ADDRESS.{0,120}/proc/[\$\{%f].{0,20}/environ
  - id: process-pid-environ-suffix
    desc: Read process environment suffix via proc
    crit: suspicious
    conf: 0.78
    for: [elf]
    if:
      type: text
      regex: ^%[^/]{1,12}/environ$
  - id: process-pid-environ-suffix-xor
    desc: XOR-obfuscated process environment suffix
    crit: suspicious
    conf: 0.9
    for: [elf]
    if:
      type: encoded
      encoding: xor
      regex: ^%[^/]{1,12}/environ$
  - id: process-pid-fd
    desc: References /proc/PID/fd path
    crit: notable
    conf: 0.66
    if:
      type: text
      regex: /proc/[0-9]{1,10}/fd
  - id: process-pid-status
    desc: Read process status via /proc/*/status
    crit: notable
    conf: 0.66
    if:
      type: text
      regex: /proc/[0-9]{1,10}/status
  - id: process-pid-stat
    desc: Read process statistics via /proc/*/stat
    crit: notable
    conf: 0.66
    if:
      type: text
      regex: /proc/[0-9]{1,10}/stat\b
  - id: process-pid-stat-template
    desc: Procfs process stat path template
    crit: notable
    conf: 0.8
    for: [elf, c, cpp, rust, go]
    platforms: [linux, android]
    if:
      type: text
      regex: /proc/%[sd]/stat\b
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: python-proc-path-join
    desc: os.path.join for /proc sensitive files
    crit: notable
    conf: 0.85
    if:
      # `os.path.join(proc_dir, "<pseudo-file>")` — the /proc pseudo-files are
      # exact path SEGMENTS. Anchor the arg so a bare substring no longer matches
      # ordinary filenames (e.g. "unicode_ind**exe**r.json", "...mem...", "...maps...").
      type: symbol
      kind: call
      exact: 'os.path.join'
      arg:
        kind: string
        regex: '^(cmdline|maps|mem|environ|exe)$'
  - id: process-oom
    desc: Adjust OOM score via procfs
    crit: suspicious
    conf: 0.66
    if:
      type: text
      regex: /proc/[0-9]{1,10}/oom_score_adj
  - id: self-oom-score-adj-path
    desc: References the self OOM score adjustment path
    crit: notable
    conf: 0.92
    for: [elf, c, cpp, rust, go]
    platforms: [linux, android]
    if:
      type: text
      # Source embeds the path inside open()/fopen() calls; exact: only
      # matches a whole trimmed line in raw-text mode.
      substr: /proc/self/oom_score_adj
  - id: self-oom-adj-path
    desc: References the legacy self OOM adjustment path
    crit: notable
    conf: 0.92
    for: [elf, c, cpp, rust, go]
    platforms: [linux, android]
    if:
      type: text
      substr: /proc/self/oom_adj
  - id: proc-net-tcp
    desc: TCP connection table path reference
    crit: notable
    conf: 0.7
    for: [scripts, elf, c, cpp, rust, go]
    platforms: [linux, android]
    if:
      type: text
      substr: /proc/net/tcp
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: procfs-process-fd-stat-walk
    desc: Traverse procfs process descriptors and stats
    crit: notable
    conf: 0.92
    for: [elf]
    platforms: [linux, android]
    if:
      type: raw
      regex: '/proc/[\x00]{1,2}/fd/[0-9][\x00-\xff]{0,96}/stat'
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: proc-net-unix
    desc: Read Unix-domain socket table
    crit: notable
    conf: 0.8
    for: [scripts, elf, c]
    platforms: [linux, android]
    if:
      type: text
      exact: /proc/net/unix
    unless:
      - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: proc-pid-format
    desc: /proc/<pid> path format string
    crit: notable
    conf: 0.3
    for: [elf]
    size_min: 512
    size_max: 200000
    if:
      type: text
      substr: /proc/%d
      section: .rodata
  - id: proc-net-tcp-xor
    # XOR-encoded raw bytes in .rodata: a binary-only shape (the file default
    # covers the plain-text /proc paths that scripts and polyglots can carry).
    for: [elf, macho, staticlib]
    desc: XOR-obfuscated TCP connection table path
    crit: notable
    conf: 0.82
    if:
      type: hex
      section: .rodata
      pattern: 7B 24 26 3B 37 7B 3A 31 20 7B 20 37 24 54
  - id: proc-net-tcp-xor62
    # XOR-encoded raw bytes in .rodata: a binary-only shape (the file default
    # covers the plain-text /proc paths that scripts and polyglots can carry).
    for: [elf, macho, staticlib]
    desc: XOR-obfuscated TCP connection table path
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .rodata
      pattern: 4D 12 10 0D 01 4D 0C 07 16 4D 16 01 12 62
  - id: proc-net-tcp-xor14
    # XOR-encoded raw bytes in .rodata: a binary-only shape (the file default
    # covers the plain-text /proc paths that scripts and polyglots can carry).
    for: [elf, macho, staticlib]
    desc: XOR-obfuscated TCP connection table path
    crit: notable
    conf: 0.92
    if:
      type: hex
      section: .rodata
      pattern: 21 7E 7C 61 6D 21 60 6B 7A 21 7A 6D 7E
  - id: proc-net-udp
    desc: Read UDP connection table
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: /proc/net/udp
  - id: proc-net-raw
    desc: Read raw socket table
    crit: notable
    conf: 0.75
    if:
      type: text
      substr: /proc/net/raw
  - id: proc-net-arp
    desc: Read ARP table
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: /proc/net/arp
  - id: proc-dir-xor
    # XOR-encoded raw bytes in .rodata: a binary-only shape (the file default
    # covers the plain-text /proc paths that scripts and polyglots can carry).
    for: [elf, macho, staticlib]
    desc: XOR-obfuscated /proc directory path
    crit: notable
    conf: 0.78
    if:
      type: hex
      section: .rodata
      pattern: 7B 24 26 3B 37 7B 54
  - id: proc-dir-xor14
    # XOR-encoded raw bytes in .rodata: a binary-only shape (the file default
    # covers the plain-text /proc paths that scripts and polyglots can carry).
    for: [elf, macho, staticlib]
    desc: XOR-obfuscated /proc directory path
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .rodata
      pattern: 21 7E 7C 61 6D 21
  - id: process-fd-xor
    # XOR-encoded raw bytes in .rodata: a binary-only shape (the file default
    # covers the plain-text /proc paths that scripts and polyglots can carry).
    for: [elf, macho, staticlib]
    desc: XOR-obfuscated process fd path
    crit: notable
    conf: 0.78
    if:
      type: hex
      section: .rodata
      pattern: 7B 32 30 54
  - id: process-status-xor
    # XOR-encoded raw bytes in .rodata: a binary-only shape (the file default
    # covers the plain-text /proc paths that scripts and polyglots can carry).
    for: [elf, macho, staticlib]
    desc: XOR-obfuscated process status path
    crit: notable
    conf: 0.78
    if:
      type: hex
      section: .rodata
      pattern: 7B 27 20 35 20 21 27 54
  - id: process-fd-xor62
    # XOR-encoded raw bytes in .rodata: a binary-only shape (the file default
    # covers the plain-text /proc paths that scripts and polyglots can carry).
    for: [elf, macho, staticlib]
    desc: XOR-obfuscated process fd path
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .rodata
      pattern: 4D 12 10 0D 01 4D 47 06 4D 04 06 62
  - id: process-status-xor62
    # XOR-encoded raw bytes in .rodata: a binary-only shape (the file default
    # covers the plain-text /proc paths that scripts and polyglots can carry).
    for: [elf, macho, staticlib]
    desc: XOR-obfuscated process status path
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .rodata
      pattern: 4D 12 10 0D 01 4D 47 06 4D 11 16 03 16 17 11 62
composite_rules:
  - id: self-oom-adjustment-paths
    desc: References current and legacy self OOM adjustment paths
    crit: notable
    conf: 0.94
    for: [elf, c, cpp, rust, go]
    platforms: [linux, android]
    all:
      - id: self-oom-score-adj-path
      - id: self-oom-adj-path
  - id: process-inspection-path-cluster
    desc: Procfs process enumeration path cluster
    crit: notable
    conf: 0.9
    for: [elf, rust, c]
    platforms: [linux, android]
    all:
      - id: micro-behaviors/fs/proc/info/pid::process-pid-exe-template
      - id: micro-behaviors/fs/proc/info/path::process-pid-stat-template
    any:
      - id: micro-behaviors/fs/proc/info/path::proc-pid-format
      - id: micro-behaviors/fs/proc/cmdline::process-pid-cmdline-token
      - id: micro-behaviors/fs/proc/memory::process-pid-maps-format
      - id: micro-behaviors/fs/proc/info/memory::c-procfs-maps-template
      - id: micro-behaviors/fs/proc/cmdline::process-pid-cmdline-format
      - id: micro-behaviors/fs/proc/info/cmdline::native-proc-pid-cmdline-path
  - id: process-environ-suffix-targeting
    desc: Read process environment suffix via proc
    crit: suspicious
    conf: 0.84
    for: [elf]
    all:
      - id: process-arbitrary
      - id: process-pid-environ-suffix
  - id: process-environ-suffix-targeting-xor
    desc: XOR-obfuscated process environment targeting
    crit: suspicious
    conf: 0.92
    for: [elf]
    all:
      - id: process-arbitrary
      - id: process-pid-environ-suffix-xor
  - id: process-environ-targeting
    desc: Read process environment via proc
    crit: notable
    conf: 0.82
    any:
      - id: process-pid-environ
      - id: process-var-environ
      - id: process-environ-suffix-targeting
      - id: process-environ-suffix-targeting-xor
  - id: process-inspection-xor
    # Every alternative below is one of the binary-only XOR shapes (.rodata
    # byte patterns), so this has to carry their scope rather than the file
    # default, which exists for the plain-text /proc paths scripts carry.
    for: [elf, macho, staticlib]
    desc: XOR-obfuscated proc process inspection
    crit: suspicious
    conf: 0.88
    needs: 4
    any:
      - id: proc-dir-xor
      - id: micro-behaviors/fs/proc/exe::process-exe-xor
      - id: process-fd-xor
      - id: micro-behaviors/fs/proc/memory::process-maps-xor
      - id: process-status-xor
      - id: proc-net-tcp-xor
      - id: micro-behaviors/fs/proc/exe::process-exe-xor62
      - id: process-fd-xor62
      - id: micro-behaviors/fs/proc/memory::process-maps-xor62
      - id: process-status-xor62
      - id: proc-net-tcp-xor62
      - id: micro-behaviors/fs/proc/cmdline::process-pid-cmdline-suffix-xor
      - id: process-pid-environ-suffix-xor
  - id: auth-daemon-proc-comm-search
    desc: Searches procfs for authentication daemons
    crit: notable
    conf: 0.96
    for: [scripts, c, cpp, rust, go, zig, elf, so]
    platforms: [linux]
    near_bytes: 600
    all:
      - id: variable-proc-comm-path
      - id: micro-behaviors/os/service/identity::unix-authentication-daemon-reference
