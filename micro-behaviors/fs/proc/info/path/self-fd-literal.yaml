traits:
- platforms:
  - unix
  - windows
  id: self-fd-path-literal
  desc: Literal references own procfs descriptor path
  crit: notable
  conf: 0.5
  for:
  - scripts
  if:
    type: string_literal
    substr: /proc/self/fd/
  unless:
  - id: well-known/tool/detection/ai-guardrail/
  - id: well-known/app/communication/telegram::telegram-desktop-third-party-source
  - id: well-known/app/development/calvyn-code
  - id: well-known/lib/stdlib/python-stdlib::python-stdlib-test-support
  - id: well-known/lib/stdlib/python-stdlib::python-stdlib-test-file
  - id: well-known/tool/detection/cilium-tetragon::source-path
  - id: well-known/app/system/omarchy::source-tree
  - id: well-known/lib/runtime/scripted/sandbox-runtime/
  - id: well-known/app/ai/coding-agent/reason-machines/
