# Split procfs path suffixes: the leaf component is stored apart from the
# /proc prefix and concatenated at runtime, so only the suffix bytes appear in
# the string table. These fragments feed composites that map sockets and
# processes to their owning PIDs; alone they are neutral path evidence.
defaults:
  platforms: [linux, android]
  for: [elf]

traits:
  - id: proc-pid-fd-zero-suffix
    desc: Split procfs file-descriptor-zero path suffix
    crit: notable
    conf: 0.9
    if:
      # Cleave omits this short fragment from this binary's readable-string
      # facts, so match its literal .rodata bytes.
      type: hex
      section: .rodata
      pattern: "2F 66 64 2F 30"
  - id: proc-pid-stat-suffix
    desc: Split procfs process-stat path suffix
    crit: component
    conf: 0.85
    if:
      type: text
      exact: /stat
