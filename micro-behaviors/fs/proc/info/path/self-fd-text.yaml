traits:
- platforms:
  - unix
  - windows
  id: self-fd-directory-reference
  desc: References own file descriptor procfs directory
  crit: notable
  conf: 0.5
  for:
  - scripts
  - binaries
  if:
    type: text
    substr: /proc/self/fd
  unless:
  - id: metadata/file/string/identity::chrome-sandbox-basename
  - id: well-known/app/ai/coding-agent/tabby::tabby-basename
  - type: text
    substr: gnulib/import/chdir-long.c
  - id: well-known/tool/reverse-engineering/windows-debugger/
  - id: metadata/build/
  - id: well-known/app/development/calvyn-code
  - id: well-known/lib/stdlib/python-stdlib
