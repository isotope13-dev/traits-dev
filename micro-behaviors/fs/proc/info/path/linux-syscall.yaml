defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.85

composite_rules:
  - id: self-exe-readlink-capability
    desc: Own-executable procfs path with readlink syscall
    # Co-occurrence establishes a capability, not resolved pointer dataflow.
    all:
      - id: process-self-exe-path
      - id: micro-behaviors/fs/link/symlink::readlink-syscall
