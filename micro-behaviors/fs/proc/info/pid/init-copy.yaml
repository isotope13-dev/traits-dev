defaults:
  platforms: [linux]
  for: [scripts, source, binaries]
  crit: notable
traits:
  - id: copy-init-process-metadata
    desc: Copies init metadata into temporary storage
    conf: 0.95
    if:
      type: text
      regex: '(copyfile|copy_file|\bcp)[^\n]{0,80}/proc/1/(stat|status|cmdline)\b[^\n]{0,60}/(var/)?tmp/'
  - id: init-process-metadata-procfs-access
    desc: References init process procfs metadata paths
    conf: 0.92
    for: [elf, c, cpp, go, rust, shell, scripts]
    if:
      type: text
      regex: '/proc/1/(stat|cmdline|status|statm)\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
