defaults:
  platforms: [linux, android]
  for: [elf, c, cpp, objc, rust, go]
traits:
  - id: process-pid-fd-format
    desc: Procfs process FD path template
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '^/proc/%[sd]/fd/?(%[sd])?$'
  - id: process-pid-exe-template
    desc: Process executable path template via /proc
    crit: notable
    conf: 0.7
    for: [elf, c, cpp, objc, rust]
    if:
      type: text
      regex: /proc/%[sd]/exe
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: process-pid-cmdline-template
    desc: Procfs process command-line path template
    crit: notable
    conf: 0.7
    for: [elf, c, cpp, objc, rust]
    if:
      type: text
      regex: /proc/%[sd]/cmdline
    unless:
      - id: well-known/lib/apm-insight::apm-insight-native-crash-monitor
  - id: process-pid-comm-template
    desc: Procfs process name path template
    crit: notable
    conf: 0.7
    for: [elf, c, cpp, objc, rust]
    if:
      type: text
      regex: /proc/%[sd]/comm
    unless:
      - id: well-known/lib/apm-insight::apm-insight-native-crash-monitor
  - id: process-pid-status-template
    desc: Procfs process status path template
    crit: notable
    conf: 0.7
    for: [elf, c, cpp, objc, rust]
    if:
      type: text
      regex: /proc/%[sd]/status
    unless:
      - id: metadata/binary/linking/runtime/
      - id: well-known/lib/apm-insight::apm-insight-native-crash-monitor
