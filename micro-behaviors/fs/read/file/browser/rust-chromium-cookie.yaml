defaults:
  platforms: [windows, unix]
  for: [rust]

traits:
  - id: rust-read-chromium-encrypted-key
    desc: Rust reads a Chromium encrypted key
    crit: notable
    if:
      type: text
      regex: '\bread_encrypted_key_blob\s*\(\s*&\w+\s*\)'
  - id: rust-read-cookies-with-master-key
    desc: Rust reads cookies with master key
    crit: notable
    if:
      type: text
      regex: '\bread_cookies\s*\(\s*&\w+\s*,\s*&master_key\b'

