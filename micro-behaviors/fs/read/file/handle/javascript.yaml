# File Read Operations - JavaScript/Node
# MBC: C0051 (Read File)
# ATT&CK: T1005
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: node-open-sync
  desc: Opens a file synchronously with Node.js
  crit: notable
  conf: 0.7
  unless:
  - id: metadata/build/
  if:
    type: symbol
    kind: call
    exact: openSync
