defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  crit: notable
  conf: 0.95

traits:
  - id: applescript-read-result-assignment
    desc: AppleScript assigns unbounded file-read result
    if:
      type: text
      # Require an unbounded read, without a "for N" or "from N" modifier.
      # An open handle may already have a file mark, so this does not claim
      # that the entire file is read from its beginning.
      # The second ending accepts a line in an embedded osascript expression.
      regex: '(?m)(^|")[ \t]*set [a-z_]\w* to read [a-z_]\w*(\r?$|\\?" & return)'
      case_insensitive: true
