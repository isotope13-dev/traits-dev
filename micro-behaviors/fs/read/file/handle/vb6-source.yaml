defaults:
  crit: baseline
  conf: 0.88
  platforms: [windows]
  for: [vbs]
traits:
  - id: vb6-binary-open-source
    desc: VB6 binary file open
    if:
      type: text
      regex: '(?im)^\s*Open\s+.{1,160}\s+For\s+Binary\s+As\s+#\d+'
  - id: vb6-get-binary-source
    desc: VB6 binary file get
    if:
      type: text
      regex: '(?im)^\s*Get\s+#\d+'
