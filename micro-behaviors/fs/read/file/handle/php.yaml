defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: fread
    desc: File read via fread
    crit: baseline
    conf: 0.75
    mbc: C0051
    if:
      type: string_literal
      regex: \bfread\s*\(
  - id: fgets
    desc: Line read via fgets
    crit: baseline
    conf: 0.6
    if:
      type: string_literal
      regex: \bfgets\s*\(
  - id: fopen-dup
    desc: File open operation
    crit: baseline
    conf: 0.6
    if:
      type: string_literal
      regex: \bfopen\s*\(
