defaults:
  platforms: [sapabap]
  for: [text, data]

traits:
  - id: abap-read-own-report
    desc: ABAP own-report read statement text
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?im)(^|\.)[ \t]*READ[ \t]+REPORT[ \t]+SY-REPID[ \t]+INTO[ \t]+[\w-]+'
  - id: abap-multiple-report-reads
    desc: Multiple ABAP report read statement texts
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?is)\bREAD\s+REPORT\s+[\w-]+\s+INTO\s+[\w-]+.{0,128}\bREAD\s+REPORT\b'
