defaults:
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
- for:
  - dos_com
  - static-lib
  id: dos-int21-read
  desc: DOS reads a file via INT 21h
  crit: notable
  conf: 0.84
  if:
    type: hex
    pattern: B4 3F [0-16] CD 21
- for:
  - dos_com
  - static-lib
  id: dos-int21-read-ax
  desc: DOS read via MOV AX
  crit: notable
  conf: 0.84
  if:
    type: hex
    pattern: B8 ?? 3F [0-16] CD 21
- for:
  - dos_com
  - static-lib
  - data
  id: dos-int21-read-saved-vector
  desc: DOS read via a saved handler
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: B4 3F [0-16] 9C [0-1] FF 1E ?? ??
composite_rules:
- for:
  - dos_com
  - static-lib
  id: dos-int21-read-call
  desc: DOS read syscall
  crit: notable
  conf: 0.84
  any:
  - id: micro-behaviors/fs/read/file/handle::dos-int21-read
  - id: micro-behaviors/fs/read/file/handle::dos-int21-read-ax
  - id: micro-behaviors/fs/read/file/handle::dos-int21-read-saved-vector
