defaults:
  platforms:
  - windows
  for:
  - pe
composite_rules:
- id: pe-module-path-file-io-imports
  desc: Module-path and file-I/O imports
  crit: notable
  conf: 0.8
  any:
  - id: micro-behaviors/fs/read/file/handle::ansi-module-path-file-io-import-set
  - id: micro-behaviors/fs/read/file/handle::pe-wide-module-path-file-io-imports
- id: pe-wide-module-path-file-io-imports
  desc: Unicode module-path and file-I/O imports
  crit: notable
  conf: 0.8
  all:
  - id: micro-behaviors/process/info/current::get-module-filename-wide
  - id: micro-behaviors/fs/file/open::file-create-win
  - id: micro-behaviors/fs/read/file/handle::read-file
  any:
  - id: micro-behaviors/fs/file/handle::set-file-pointer
  - id: micro-behaviors/fs/file/handle::set-file-pointer-ex
  - id: micro-behaviors/fs/file/stat::get-file-size
- id: pe-module-path-crt-file-io
  desc: Module-path and CRT file-I/O imports
  crit: notable
  conf: 0.82
  all:
  - id: micro-behaviors/process/info/current::get-module-filename-ansi
  - id: micro-behaviors/fs/file/open::open
  - id: micro-behaviors/fs/read/file/handle::c-fread
  - id: micro-behaviors/fs/file/binary::file-position-api
- id: pe-module-path-file-io-overlay
  desc: Module-path file I/O and overlay references
  crit: notable
  conf: 0.8
  all:
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-imports
  - id: metadata/binary/layout/overlay::large-overlay-64k
- id: pe-module-path-file-io-capability
  desc: Module-path and file-I/O references
  crit: notable
  conf: 0.82
  any:
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-crt-file-io
- id: pe-module-path-large-overlay
  desc: Module-path file I/O and large overlay
  crit: notable
  conf: 0.88
  all:
  - id: metadata/binary/layout/overlay::large-overlay-64k
  - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-capability
  any:
  - id: metadata/binary/layout/overlay::high-entropy-overlay
  - id: metadata/binary/layout/overlay::overlay-dominates-third
  size_max: 5000000
