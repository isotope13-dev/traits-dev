defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, c]
traits:
  # Renamed from `fread`: this directory's original `fread` is PHP's library
  # call, and merging the two read directories put both under one id. This one
  # is the C symbol, so the name says so.
  - id: c-fread
    desc: Read stream (C fread symbol)
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      regex: ^_?fread$
  - id: fread-text
    desc: References the CRT fread file-read routine
    crit: baseline
    conf: 0.62
    if:
      type: text
      word: fread
  - id: fscanf
    desc: Formatted input from file
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      regex: ^_?(fscanf|vfscanf|__isoc99_fscanf)$
