# Decode a repeated 32-bit XOR key from the first command word. Compare
# subsequent hex nibbles against the same key; no campaign key is pinned.
defaults:
  platforms: [windows]
  for: [data, text]
  crit: notable
traits:
  - id: xorhex-nsis-readfile
    desc: XOR-hex NSIS ReadFile command
    conf: 0.99
    if:
      type: yara
      source: |
        rule xorhex_nsis_readfile {
          strings:
            $hex = /[0-9A-F]{128,}/
          condition:
            for any r in (1..#hex) : (
              for any a in (@hex[r]..@hex[r]+!hex[r]-38) : (
                (uint32(a) != 0x35344234 or uint32(a+4) != 0x45343235) and
                for all i in (0..7) : (
                          (((uint8(a+i) & 15) + 9 * (uint8(a+i) >> 6)) ^ ((uint8(a+8+i) & 15) + 9 * (uint8(a+8+i) >> 6))) == ((0xE09617C >> ((7-i)*4)) & 15)
                        ) and
                for all i in (0..7) : (
                          (((uint8(a+i) & 15) + 9 * (uint8(a+i) >> 6)) ^ ((uint8(a+16+i) & 15) + 9 * (uint8(a+16+i) >> 6))) == ((0x717F002B >> ((7-i)*4)) & 15)
                        ) and
                for all i in (0..7) : (
                          (((uint8(a+i) & 15) + 9 * (uint8(a+i) >> 6)) ^ ((uint8(a+24+i) & 15) + 9 * (uint8(a+24+i) >> 6))) == ((0x2A211427 >> ((7-i)*4)) & 15)
                        ) and
                for all i in (0..5) : (
                          (((uint8(a+i) & 15) + 9 * (uint8(a+i) >> 6)) ^ ((uint8(a+32+i) & 15) + 9 * (uint8(a+32+i) >> 6))) == ((0x27207A >> ((5-i)*4)) & 15)
                        )
              )
            )
        }
