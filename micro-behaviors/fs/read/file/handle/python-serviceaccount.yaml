traits:
  - id: python-open-serviceaccount-token
    desc: Python opens Kubernetes service-account token
    crit: notable
    conf: 0.95
    platforms: [unix]
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)open$'
      arg:
        kind: string
        substr: serviceaccount/token
