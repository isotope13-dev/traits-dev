defaults:
  platforms: [unix]
  for: [python]

traits:
  - id: python-direct-open-serviceaccount-token
    desc: Python opens serviceaccount token directly
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)open$'
      arg:
        kind: string
        substr: serviceaccount/token

composite_rules:
  - id: python-serviceaccount-token-file-read
    desc: Kubernetes service-account path co-occurs with open call
    crit: notable
    conf: 0.93
    near_lines: 20
    all:
      - id: micro-behaviors/fs/path/token::python-serviceaccount-file-path
      - id: micro-behaviors/fs/file/open/unspecified::python-open-reference

  - id: python-open-serviceaccount-token
    desc: Python opens Kubernetes service-account token
    crit: notable
    conf: 0.95
    any:
      - id: python-direct-open-serviceaccount-token
      - id: python-serviceaccount-token-file-read
