defaults:
  platforms: [windows, unix]
  for: [c, text]

traits:
  - id: dos-asm-read-handle
    desc: DOS source selects handle-read service
    crit: notable
    conf: 0.88
    if:
      type: text
      # Instruction form only. The prose spelling this used to accept ("read
      # file") matched ordinary English in comments, protobuf definitions and
      # documentation — every DOS infector loads the function number anyway.
      regex: '(?i)\bah\s*,\s*0?3fh'

