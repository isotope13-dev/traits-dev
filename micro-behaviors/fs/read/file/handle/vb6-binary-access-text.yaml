defaults:
  platforms:
    - windows
  for: [pe]
traits:
  - id: vb6-binary-access-read-text
    desc: VB6 binary access read text
    crit: notable
    if:
      type: text
      substr: "For Binary Access Read As #"
composite_rules:
  - id: vb6-self-name-binary-read-clues
    desc: VB6 self name and binary read clues
    crit: suspicious
    conf: 0.87
    all:
      - id: metadata/file/profile/operation-reference::vb6-app-exename-reference
      - id: micro-behaviors/fs/read/file/handle::vb6-binary-access-read-text
    any:
      - id: metadata/file/profile/operation-reference::vb6-space-lof-reference
