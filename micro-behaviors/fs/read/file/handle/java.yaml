defaults:
  crit: notable
  platforms:
  - qnx
  - unix
  - windows
  for:
  - java
  - class
  - java_class
  - jar
traits:
- id: java-fileinputstream-class
  desc: Java imports the FileInputStream reader
  conf: 0.9
  for:
  - class
  if:
    type: import
    exact: java/io/FileInputStream
- id: java-source-fileinputstream-use
  desc: Java source references FileInputStream
  conf: 0.85
  for:
  - java
  - jsp
  if:
    type: text
    regex: \bjava\.io\.FileInputStream\b|\bnew\s+FileInputStream\s*\(
- id: jvm-files-newinputstream-bytecode
  desc: JVM calls Files.newInputStream
  conf: 0.9
  for:
  - class
  if:
    type: import
    exact: java/nio/file/Files.newInputStream
composite_rules:
- id: jvm-file-read-machinery
  desc: JVM references file-reading APIs
  for:
  - java
  - kotlin
  - class
  - java_class
  - jar
  any:
  - id: java-fileinputstream-class
  - id: jvm-files-newinputstream-bytecode
  - id: micro-behaviors/fs/read/file/full::java-readallbytes
  - id: micro-behaviors/fs/read/file/full::kotlin-file-read-call
