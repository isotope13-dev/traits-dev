defaults:
  crit: notable
  platforms: [qnx, unix, windows]
  for: [java, class, java_class, jar]
traits:
  - id: java-fileinputstream-class
    desc: Java imports the FileInputStream reader
    conf: 0.9
    for: [class]
    if:
      type: import
      exact: java/io/FileInputStream
  - id: java-source-fileinputstream-use
    desc: Java source references FileInputStream
    conf: 0.85
    for: [java, jsp]
    if:
      type: text
      regex: '\bjava\.io\.FileInputStream\b|\bnew\s+FileInputStream\s*\('
  - id: jvm-io-file-class-ref
    desc: JVM File API class reference
    conf: 0.86
    for: [class]
    if:
      type: value
      path: class.class_refs[*]
      regex: '^java/io/File(/|$)'
  - id: jvm-nio-file-class-ref
    desc: JVM NIO file API reference
    conf: 0.86
    for: [class]
    if:
      type: value
      path: class.class_refs[*]
      regex: '^java/nio/file(/|$)'
  - id: jvm-files-newinputstream-bytecode
    desc: JVM calls Files.newInputStream
    conf: 0.9
    for: [class]
    if:
      type: import
      exact: java/nio/file/Files.newInputStream
composite_rules:
  # Roll-up: any JVM file-open-for-read primitive. A bare key-filename
  # string is not a collection; the objectives/credential-access SSH
  # composites require this leg so inert constant pools (methodless class
  # husks carrying id_rsa/known_hosts and nothing else) cannot convict.
  - id: jvm-file-read-machinery
    desc: JVM code opens files for reading
    for: [java, kotlin, class, java_class, jar]
    any:
    - id: java-fileinputstream-class
    - id: jvm-io-file-class-ref
    - id: jvm-nio-file-class-ref
    - id: jvm-files-newinputstream-bytecode
    - id: micro-behaviors/fs/read/file/full::java-readallbytes
    - id: micro-behaviors/fs/read/file/full::kotlin-file-read-call
