defaults:
  crit: notable
  platforms: [qnx, unix, windows]
  for: [java, class, java_class, jar]
traits:
  - id: java-fileinputstream-class
    desc: Java imports the FileInputStream reader
    conf: 0.9
    for: [class]
    if:
      type: import
      exact: java/io/FileInputStream
  - id: java-source-fileinputstream-use
    desc: Java source references FileInputStream
    conf: 0.85
    for: [java]
    if:
      type: text
      regex: '\bjava\.io\.FileInputStream\b|\bnew\s+FileInputStream\s*\('
  - id: jvm-io-file-class-ref
    desc: JVM File API class reference
    conf: 0.86
    for: [class]
    if:
      type: value
      path: class.class_refs[*]
      regex: '^java/io/File(/|$)'
  - id: jvm-nio-file-class-ref
    desc: JVM NIO file API reference
    conf: 0.86
    for: [class]
    if:
      type: value
      path: class.class_refs[*]
      regex: '^java/nio/file(/|$)'
