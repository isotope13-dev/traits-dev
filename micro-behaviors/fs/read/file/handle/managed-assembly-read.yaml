defaults:
  for: [pe, dll]
  platforms: [windows]
  crit: component

traits:
  - id: dotnet-executing-assembly-call
    desc: Calls Assembly.GetExecutingAssembly
    if:
      type: symbol
      kind: call
      exact: System.Reflection.Assembly.GetExecutingAssembly

  - id: dotnet-executing-assembly-location-call
    desc: Gets executing assembly location
    if:
      type: symbol
      kind: call
      exact: System.Reflection.Assembly.get_Location

  - id: dotnet-file-stream-constructor-call
    desc: Calls managed FileStream constructor
    if:
      type: symbol
      kind: call
      exact: System.IO.FileStream..ctor

  - id: dotnet-stream-seek-call
    desc: Seeks a managed stream
    if:
      type: symbol
      kind: call
      exact: System.IO.Stream.Seek

  - id: dotnet-stream-read-call
    desc: Reads a managed stream
    if:
      type: symbol
      kind: call
      exact: System.IO.Stream.Read

composite_rules:
  - id: dotnet-module-file-read
    desc: Reads the executing assembly through a stream
    crit: notable
    conf: 0.98
    all:
      - id: dotnet-executing-assembly-call
      - id: dotnet-executing-assembly-location-call
      - id: dotnet-file-stream-constructor-call
      - id: dotnet-stream-seek-call
      - id: dotnet-stream-read-call
