composite_rules:
- id: ansi-module-path-file-io-import-set
  desc: ANSI module-path and file-I/O import set
  crit: notable
  conf: 0.8
  all:
  - id: micro-behaviors/os/module/load::get-module-filename-ansi
  - id: micro-behaviors/fs/file/open::file-create-win
  - id: micro-behaviors/fs/read/file/handle::read-file
  any:
  - id: micro-behaviors/fs/file/handle::set-file-pointer
  - id: micro-behaviors/fs/file/handle::set-file-pointer-ex
  - id: micro-behaviors/fs/file/stat::get-file-size
  unless:
  - id: well-known/app/system/miktex::miktex-setup-wizard
  - id: well-known/lib/platform/microsoft-wininet::wininet-system-context
  - id: well-known/app/network/juniper-setup-client::juniper-setup-client-identity
  - id: well-known/app/system/iobit::iobit-signed-component-context
  platforms:
  - windows
  for:
  - pe
