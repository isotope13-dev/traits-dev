defaults:
  platforms: [vmcms]
  for: [text, data]

traits:
  - id: cms-names-file-read-command
    desc: CMS command reads a NAMES file
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?im)^[ \t]*["'']EXECIO[ \t]+\*[ \t]+DISKR[^\r\n]{0,80}\bNAMES\b'
  - id: cms-netlog-file-read-command
    desc: CMS command reads a NETLOG file
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?im)^[ \t]*["'']EXECIO[ \t]+\*[ \t]+DISKR[^\r\n]{0,80}\bNETLOG\b'
