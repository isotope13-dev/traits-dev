defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: suspicious
  conf: 0.85

traits:
- id: js-execsync-passwd
  desc: JavaScript reads /etc/passwd file
  crit: suspicious
  conf: 0.98
  attack: "T1005"
  if:
    type: value
    path: "scripts.preinstall"
    substr: "cat /etc/passwd"
