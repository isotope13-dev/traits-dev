# Python file reading
# ATT&CK: T1005 (Data from Local System)
defaults:
  platforms: [windows, unix]
  mbc: E1005
  for: [python]
  attack: "T1005"
traits:
  - id: file-read-content
    desc: Reads file content (Python)
    crit: baseline
    conf: 0.6
    if:
      type: text
      regex: '\.read\('
    unless:
      - type: text
        regex: '(?i)(resp|response|req|request)\.read\('
      - type: text
        regex: '(?i)(sock|socket|urllib|url)\.read\('
  - id: python-pathlib-read-text
    desc: Read text via pathlib
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      substr: read_text
  - id: python-pathlib-read-bytes
    desc: Read bytes via pathlib
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      substr: read_bytes
  - id: file-open-content
    desc: Opens file in default read mode
    crit: baseline
    conf: 0.86
    if:
      # A one-argument open() uses Python's default read-only mode.  Matching
      # the call shape keeps `with open(path, "w")` writers out of read-based
      # credential-collection composites.
      type: tree-sitter
      language: python
      query: |
        (call
          function: (identifier) @fn
          arguments: (argument_list . (_) @path .)
          (#eq? @fn "open"))

  # Keep the sensitive-path indicator in the file-read capability namespace.
  # A bare string literal such as ".env" is only a path reference; it is not
  # evidence that the program reads that file.  The call shape below requires
  # Python's one-argument open() form, whose default mode is read-only.
  - id: python-sensitive-file-read
    desc: Python opens a sensitive path for reading
    crit: notable
    conf: 0.88
    if:
      type: tree-sitter
      language: python
      query: |
        (call
          function: (identifier) @fn
          arguments: (argument_list (string) @path)
          (#eq? @fn "open")
          (#match? @path "(?i)(\\.env|[/\\\\]\\.config[/\\\\]|credentials)"))

  - id: python-ssh-private-key-read
    desc: Python opens SSH key path
    crit: notable
    conf: 0.92
    attack: T1552.004
    if:
      type: tree-sitter
      language: python
      query: |
        (call
          function: (identifier) @fn
          arguments: (argument_list (string) @path)
          (#eq? @fn "open")
          (#match? @path "(?i)\\.ssh[/\\\\]id_(rsa|dsa|ecdsa|ed25519)"))
