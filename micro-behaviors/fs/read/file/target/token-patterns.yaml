defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  # Token-format patterns, file operations, and process APIs do not establish
  # harvesting: IDEs and secret scanners expose the same capabilities. Keep
  # this neutral and use bytes for proximity in minified application bundles.
  - id: js-token-pattern-file-process-apis
    desc: Token patterns near file and process APIs
    crit: notable
    conf: 0.98
    for: [javascript]
    near_bytes: 4096
    all:
      - id: micro-behaviors/fs/read/file/target::github-token-pattern-file-operations
    any:
      - id: micro-behaviors/process/create/shell/command-string::execSync-call
      - id: metadata/file/profile/execution-api::spawn-call
      - id: metadata/import/builtin::child-process-import-runtime
      - id: metadata/file/profile/execution-api::process-env-daemonized-flag
    unless:
      - id: metadata/lang/source/syntax/command/options::gh-auth-helper-text
      - id: micro-behaviors/data/string/redact::js-token-mask-redaction

  - id: github-token-pattern-file-operations
    desc: GitHub token patterns with file operations
    crit: notable
    conf: 0.95
    near_lines: 40
    all:
      - id: micro-behaviors/data/format/credentials::github-token-pattern-reference
    any:
      - id: micro-behaviors/fs/read/file/full::read-node
      - id: micro-behaviors/fs/directory/traverse::node-dirent-directory-walk
      - id: micro-behaviors/fs/directory/readdir/language::node-readdir-repeated
  - id: github-npm-pattern-file-operations
    desc: GitHub and npm patterns with file operations
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/fs/read/file/target::github-token-pattern-file-operations
      - id: micro-behaviors/data/format/credentials::npm-token-regex-format

  - id: github-npm-pattern-content-records
    desc: GitHub and npm patterns with file records
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/data/format/credentials::github-oauth-token-regex-pattern
      - id: micro-behaviors/data/format/credentials::npm-token-regex-format
      - id: micro-behaviors/fs/read/file/target::node-file-content-record
