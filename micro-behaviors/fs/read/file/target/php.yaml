defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: php-dotenv-read-into-variable
    desc: PHP reads dotenv into variable
    crit: notable
    conf: 0.97
    mbc: C0051
    if:
      type: text
      regex: '\$[A-Za-z_][A-Za-z0-9_]*\s*=\s*@?\s*file_get_contents\s*\([^;]{0,220}[/\\]\.env'
