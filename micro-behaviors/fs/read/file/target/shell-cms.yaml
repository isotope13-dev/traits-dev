defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  attack: T1005

traits:
  - id: shell-cat-wordpress-config
    desc: Cat reads WordPress configuration
    if:
      type: symbol
      kind: call
      exact: cat
      arg:
        name_regex: '(^|/)wp-config\.php$'

  - id: shell-cat-magento-config
    desc: Cat reads Magento configuration
    if:
      type: symbol
      kind: call
      exact: cat
      arg:
        name_regex: '(^|/)app/etc/env\.php$'

  - id: shell-cat-drupal-config
    desc: Cat reads Drupal configuration
    if:
      type: symbol
      kind: call
      exact: cat
      arg:
        name_regex: '(^|/)sites/default/settings\.php$'
