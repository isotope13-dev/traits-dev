defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.98

traits:
  - id: npm-preinstall-python-target-list-file-read
    desc: Preinstall stores files read from target list
    if:
      type: value
      path: scripts.preinstall
      regex: 'results\.update\(\{f:\s*open\(f\)\.read\(\)\}\)\s*for\s+f\s+in\s+targets'
