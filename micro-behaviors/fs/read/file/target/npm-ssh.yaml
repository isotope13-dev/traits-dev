defaults:
  platforms: [unix]
  for: [package.json]
  crit: notable
  conf: 0.95

traits:
  - id: postinstall-ssh-private-key-fallback-read
    desc: Postinstall fallback reads SSH private key
    if:
      type: value
      path: scripts.postinstall
      regex: '\|\|\s*cat\s+[^\s;&|]{1,50}/\.ssh/id_(rsa|ed25519|ecdsa)(\s|$)'
