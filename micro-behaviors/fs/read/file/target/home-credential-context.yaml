defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
composite_rules:
- id: home-credential-path-near-read
  desc: File read near home credential paths
  crit: notable
  conf: 0.85
  near_bytes: 512
  all:
  - id: micro-behaviors/fs/read/file/full::file-content-read-operation
  - id: micro-behaviors/fs/path/location::home-directory-resolution
  any:
  - id: micro-behaviors/fs/path/secret-config::npmrc-credentials
  - id: micro-behaviors/fs/path/token::git-credentials
  - id: micro-behaviors/fs/path/secret-config::cargo-credentials-path-marker
  - id: micro-behaviors/fs/path/secret-config::rubygems-credentials-path-marker
  not:
  - substr: 'userconfig:{default:be.join(process.env.HOME||nr.homedir(),".npmrc")}'
  - substr: 'cache:{default:be.join(process.env.HOME||nr.homedir(),".npm")}'
  - substr: 'configNames:{default:["npmrc",".npmrc"]}'
  unless:
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/tool/detection/sast/
  - id: well-known/tool/detection/security-scanner/
  - id: metadata/package/testing/
  - id: well-known/lib/
  - id: "metadata/file/naming::test-directory-component"
