defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
composite_rules:
- id: home-credential-path-near-read
  desc: File read near home credential paths
  crit: notable
  conf: 0.85
  near_bytes: 512
  all:
  - id: micro-behaviors/fs/read/file/full::file-content-read-operation
  - id: micro-behaviors/fs/path/location::home-directory-reference-or-resolution
  any:
  - id: micro-behaviors/fs/path/config/app::npmrc-path-literal
  - id: micro-behaviors/fs/path/token::git-credentials
  - id: micro-behaviors/fs/path/secret-config::cargo-credentials-path-marker
  - id: micro-behaviors/fs/path/secret-config::rubygems-credentials-path-marker
