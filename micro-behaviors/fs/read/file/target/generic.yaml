defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python, javascript, typescript, shell, powershell, ruby, perl, php]
traits:
  - id: shell-cat-root-or-home-path
    desc: Shell cat with root or home path
    conf: 0.86
    for: [shell]
    if:
      type: text
      regex: '(?i)cat[[:space:]]+(/|~|\\$HOME)'
    unless:
      - id: metadata/file/format/structured::serialized-news-article-catalog
  - id: python-shell-cat-root-home-file
    desc: Python reads root-home file via shell
    conf: 0.97
    for: [python]
    platforms: [unix]
    if:
      type: symbol
      kind: call
      exact: os.system
      arg:
        kind: string
        regex: '^(/bin/)?cat[ \t]+/root/[^ \t;&|]+'
