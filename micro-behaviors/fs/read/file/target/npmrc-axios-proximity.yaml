defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: npmrc-readfile-near-axios-request
  desc: npmrc readFile near an Axios request
  crit: notable
  conf: 0.9
  unless:
  - id: well-known/tool/detection/
  - id: well-known/tool/development/aube::aube-package-test-fixture
  if:
    type: text
    regex: 'readFile\s*\([^)]{0,60}\.npmrc[\s\S]{0,120}axios\s*\.\s*(post|put|request)\s*\('
- id: npmrc-readfilesync-near-axios-request
  desc: npmrc readFileSync near an Axios request
  crit: notable
  conf: 0.9
  unless:
  - id: well-known/tool/detection/
  - id: well-known/tool/development/aube::aube-package-test-fixture
  if:
    type: text
    regex: 'readFileSync\s*\([^)]{0,60}\.npmrc[\s\S]{0,120}axios\s*\.\s*(post|put|request)\s*\('
- id: npmrc-stream-near-axios-request
  desc: npmrc stream creation near Axios request
  crit: notable
  conf: 0.9
  unless:
  - id: well-known/tool/detection/
  - id: well-known/tool/development/aube::aube-package-test-fixture
  if:
    type: text
    regex: 'createReadStream\s*\([^)]{0,60}\.npmrc[\s\S]{0,120}axios\s*\.\s*(post|put|request)\s*\('
