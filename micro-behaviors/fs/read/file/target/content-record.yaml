defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: node-file-content-record
  desc: File reads with path/content records
  crit: notable
  conf: 0.84
  all:
  - id: micro-behaviors/fs/read/file/target::js-file-path-content-record
  - id: micro-behaviors/fs/read/file/full::file-content-read-operation
  unless:
    - id: well-known/lib/development/vscode::require-vscode
    - id: well-known/lib/development/vscode::vscode-extension-marker
    - id: metadata/package/runtime::vscode-extension
    - id: well-known/app/ai/coding-agent/baidu-comate::baidu-comate
