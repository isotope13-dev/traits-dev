traits:
- platforms:
  - windows
  - linux
  - macos
  for:
  - javascript
  - typescript
  - json
  id: node-read-asset-file
  desc: Reads a font or opaque-asset file
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: readFile(Sync)?\s*\(\s*['"`][^'"`]{0,70}\.(woff2?|[ot]tf|eot|llf|dat|bin)['"`]
    case_insensitive: true
