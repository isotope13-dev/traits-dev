traits:
- id: ip-list-read
  desc: Reads an IP/target/host list from a file
  conf: 0.7
  if:
    type: text
    regex: \bopen\([^)\n]{0,120}\b(ips?|targets?|hosts?)\b[^)\n]{0,40}\)\.read(lines)?\(\)
- id: ip-list-file-open
  desc: ip_list opens target file
  conf: 0.65
  if:
    type: text
    regex: \bip_list\s*=\s*open\([^)\n]{0,80}\b(ips?|targets?|hosts?)\b
  unless:
  - id: well-known/tool/detection/ai-guardrail/
- id: ip-list-readlines
  desc: ip_list assigned file lines
  conf: 0.55
  if:
    type: text
    regex: \bip_list\s*=\s*\w+\.readlines?\(\)
  unless:
  - id: well-known/tool/detection/ai-guardrail/
- id: ip-list-literal
  desc: ip_list literal IP targets
  conf: 0.7
  if:
    type: text
    regex: \bip_list\s*=\s*\[[^\]\n]{0,80}[0-9]{1,3}(\.[0-9]{1,3}){3}
  unless:
  - id: well-known/tool/detection/ai-guardrail/
- id: targets-word
  desc: Targets/hosts list file reference
  conf: 0.4
  if:
    type: text
    regex: \btargets?\.txt\b
composite_rules:
- id: ip-list-var
  desc: ip_list target collection source
  conf: 0.65
  any:
  - id: micro-behaviors/fs/read/file/target::ip-list-file-open
  - id: micro-behaviors/fs/read/file/target::ip-list-readlines
  - id: micro-behaviors/fs/read/file/target::ip-list-literal
  unless:
  - id: well-known/lib/ai/pyaigis/
  - id: well-known/tool/detection/ai-guardrail/
  - id: well-known/tool/development/mobile/adb-enhanced::adb-enhanced-script
defaults:
  for:
  - python
  platforms:
  - unix
  - windows
  crit: notable
