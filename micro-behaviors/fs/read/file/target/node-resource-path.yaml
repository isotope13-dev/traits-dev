defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
composite_rules:
- id: node-file-read-near-resource-path
  desc: Node file read near resource path
  conf: 0.9
  near_bytes: 8192
  all:
  - id: micro-behaviors/fs/read/file/full::read-node
  any:
  - id: micro-behaviors/fs/path/credential::any-credential-path
  - id: micro-behaviors/fs/path/app-data/
  - id: micro-behaviors/fs/path/application/messaging/
  - id: micro-behaviors/fs/path/application/vpn/
  - id: micro-behaviors/fs/path/application/extensions::chromium-local-extension-settings-path
  - id: micro-behaviors/fs/path/application/extensions::compiled-chromium-local-extension-settings-path
  - id: micro-behaviors/fs/path/application/extensions::chromium-sync-extension-settings-path
  - id: micro-behaviors/fs/path/application/browser::chrome-sync-data-leveldb-dir
  - id: micro-behaviors/fs/path/application/extensions::firefox-extensions-database-file
  - id: micro-behaviors/fs/path/application/extensions::firefox-search-plugins-directory
  - id: micro-behaviors/fs/path/library::codecs-directory-reference
  - id: micro-behaviors/fs/path/cache::chromium-profile-script-cache-path
  - id: micro-behaviors/fs/path/personal::desktop-path-token
  - id: micro-behaviors/fs/path/personal::windows-documents-or-desktop-path
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
