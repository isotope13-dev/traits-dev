defaults:
  platforms: [unix]
  for: [package.json]
traits:
  - id: postinstall-parent-relative-read-command
    desc: Install hook reads a parent-relative file path
    crit: notable
    conf: 0.9
    if:
      type: value
      path: scripts.postinstall
      regex: '\b(cat|head|tail)\s+[^;\n]{0,80}(\.\./){1,4}[^\s;)]+'
