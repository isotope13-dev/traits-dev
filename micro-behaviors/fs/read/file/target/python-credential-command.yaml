# Arguments passed to a command helper, not just path mentions. These are
# command construction observations; no local execution or theft is inferred.
defaults:
  for: [python]
  platforms: [unix]
  crit: notable
  conf: 0.95
traits:
  - id: python-git-credential-read-command
    desc: Passes a Git credential file read command
    if:
      type: symbol
      kind: call
      regex: '.'
      arg:
        index: 0
        regex: '^cat[ \t]+["'']?(~/|\$HOME/)\.git-credentials\b'
  - id: python-aws-credential-read-command
    desc: Passes an AWS credential file read command
    if:
      type: symbol
      kind: call
      regex: '.'
      arg:
        index: 0
        regex: '^cat[ \t]+["'']?(~/|\$HOME/)\.aws/credentials\b'
  - id: python-pgpass-read-command
    desc: Passes a PostgreSQL password file read command
    if:
      type: symbol
      kind: call
      regex: '.'
      arg:
        index: 0
        regex: '^cat[ \t]+["'']?(~/|\$HOME/)\.pgpass\b'
