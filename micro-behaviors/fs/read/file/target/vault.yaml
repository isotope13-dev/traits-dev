defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
traits:
  - id: python-vault-token-file-read
    desc: Reads home Vault token file through expanduser
    for: [python]
    if:
      type: tree-sitter
      language: python
      query: |
        (call
          function: (attribute
            object: (call
              function: (identifier) @open
              arguments: (argument_list
                (call
                  function: (attribute attribute: (identifier) @expand)
                  arguments: (argument_list (string) @path))))
            attribute: (identifier) @read)
          (#eq? @open "open")
          (#eq? @expand "expanduser")
          (#eq? @read "read")
          (#match? @path "^['\"]~/\\.vault-token['\"]$"))
  - id: node-vault-token-file-read
    desc: Reads Vault token file through joined path
    for: [javascript, typescript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: (member_expression property: (property_identifier) @read)
          arguments: (arguments
            (call_expression
              function: (member_expression property: (property_identifier) @join)
              arguments: (arguments (_) (string (string_fragment) @path))))
          (#eq? @read "readFileSync")
          (#eq? @join "join")
          (#eq? @path ".vault-token"))
composite_rules:
  - id: vault-token-file-read
    desc: Reads a local HashiCorp Vault token file
    for: [python, javascript, typescript]
    any:
      - id: python-vault-token-file-read
      - id: node-vault-token-file-read
  - id: node-vault-iac-read-proximity
    for: [javascript, typescript]
    desc: Node file read near Vault or Terraform credential path
    crit: notable
    conf: 0.94
    near_bytes: 256
    all:
      - id: micro-behaviors/fs/read/file/full::read-node
    any:
      - id: micro-behaviors/fs/path/token::vault-token-file
      - id: micro-behaviors/fs/path/token::terraform-credentials
