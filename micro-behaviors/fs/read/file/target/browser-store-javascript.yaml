defaults:
  platforms: [linux, macos, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-browser-store-read-cooccurrence
    desc: Browser store paths co-occur with Node file reads
    crit: notable
    conf: 0.97
    # Same-file evidence does not bind the referenced path to the read.
    all:
      - id: micro-behaviors/fs/path/cookie::browser-sensitive-data
      - id: micro-behaviors/fs/read/file/full::read-node
