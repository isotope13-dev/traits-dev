defaults:
  platforms: [windows]
  for: [python]
traits:
  - id: python-wmi-repository-content-read
    desc: Reads WMI repository object database
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((with_statement
          (with_clause (with_item value: (as_pattern
            (call function: (identifier) @open
              arguments: (argument_list (string) @path))
            alias: (as_pattern_target (identifier) @handle))))
          body: (block (expression_statement (assignment right:
            (call function: (attribute object: (identifier) @used
              attribute: (identifier) @read)))))) @operation
          (#eq? @open "open") (#eq? @read "read") (#eq? @handle @used)
          (#match? @path "(?i)wbem[/\\\\]+Repository[/\\\\]+OBJECTS[.]DATA"))
