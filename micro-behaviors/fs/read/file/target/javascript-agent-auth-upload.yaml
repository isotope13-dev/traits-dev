# Coding-agent authentication files read as raw text and placed in an
# outbound JSON request are credential export, even when the endpoint is a
# product's own synchronization service.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: agent-auth-json-raw-read
  desc: Raw-read helper near agent auth filenames
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: 'safeRead.{0,200}(auth\.json|credentials\.json)'
