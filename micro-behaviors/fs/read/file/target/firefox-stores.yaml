# Require the store path at the read operation. Merely mentioning the files,
# opening them for writing, or reading an unrelated file does not qualify.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
  for: [python, javascript, typescript, ruby]

traits:
  - id: python-firefox-logins-content-read
    desc: Reads a Firefox login store through open
    for: [python]
    if:
      type: symbol
      kind: call
      exact: open.read
      receiver:
        from:
          call: '^open$'
          literal: '(^|[/\\])logins\.json$'

  - id: python-firefox-key-database-content-read
    desc: Reads a Firefox key database through open
    for: [python]
    if:
      type: symbol
      kind: call
      exact: open.read
      receiver:
        from:
          call: '^open$'
          literal: '(^|[/\\])key[34]\.db$'

  - id: firefox-logins-byte-read
    desc: Reads bytes from a Firefox login store
    for: [javascript, typescript, ruby]
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])(readFileSync|binread)$'
      arg:
        index: 0
        from:
          value: '(^|[/\\])logins\.json$'

  - id: firefox-key-database-byte-read
    desc: Reads bytes from a Firefox key database
    for: [javascript, typescript, ruby]
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])(readFileSync|binread)$'
      arg:
        index: 0
        from:
          value: '(^|[/\\])key[34]\.db$'

composite_rules:
  - id: firefox-logins-content-read
    desc: Reads Firefox encrypted login records
    any:
      - id: python-firefox-logins-content-read
      - id: firefox-logins-byte-read

  - id: firefox-key-database-content-read
    desc: Reads Firefox password decryption key database
    any:
      - id: python-firefox-key-database-content-read
      - id: firefox-key-database-byte-read
