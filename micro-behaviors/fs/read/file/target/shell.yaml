# Shell reads a file whose name identifies credentials.
# ATT&CK: T1005 (Data from Local System)
defaults:
  crit: notable
  platforms: [unix, windows]
  mbc: E1005
  attack: T1005
  for: [shell]
traits:
  - id: shell-read-container-secret
    desc: Shell reads a container-mounted secret with cat
    conf: 0.9
    if:
      type: text
      regex: '\bcat\s+[^;\n]{0,100}/(host/)?run/secrets(/|\b)'
  - id: shell-read-credential-file
    desc: Shell reads a credential-named file with cat
    conf: 0.85
    if:
      type: text
      regex: '\bcat\s+[^<\n]{0,30}\bcredentials\b'
  # A dotenv file is application configuration and may contain credentials,
  # but reading it alone does not establish credential theft.
  - id: shell-cat-dotenv-file
    desc: Shell reads a .env file with cat
    conf: 0.9
    for: [shell, python, text]
    if:
      type: text
      regex: '(?m)(^|\s)cat\s+([~A-Za-z0-9_./-]*\.env)(\s|$|[|;&])'
  - id: shell-source-secret-dotenv
    desc: Shell sources dotenv from secret directory
    conf: 0.94
    if:
      type: text
      regex: '(source|\.)\s+["'']?[^;\r\n]{0,80}/\.?secrets/[^/\s"'']{1,80}\.env'
