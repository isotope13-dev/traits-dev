defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: npm-postinstall-python-hosts-read
  desc: Postinstall reads hosts beside HTTPX POST
  crit: notable
  conf: 0.98
  if:
    type: value
    path: scripts.postinstall
    regex: open\(["']/etc/hosts["'][^)]{0,20}\)\.read\(.{0,99}httpx\.post\(
