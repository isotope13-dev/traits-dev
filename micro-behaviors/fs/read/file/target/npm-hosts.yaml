defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: npm-postinstall-python-target-list-file-read
  desc: Postinstall stores files read from target list
  crit: notable
  conf: 0.98
  if:
    type: value
    path: scripts.postinstall
    regex: results\.update\(\{f:\s*open\(f\)\.read\(\)\}\)\s*for\s+f\s+in\s+targets
