defaults:
  # A Windows client can pass this command to a container on a Unix server.
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95
traits:
  - id: prefixed-password-database-read-command
    desc: Command reads password database below prefix
    if:
      type: text
      regex: '\b(cat|head|tail)[\s"'',]+[^;\n]{0,64}/[^\s;]{1,80}/etc/(shadow|master\.passwd)\b'
