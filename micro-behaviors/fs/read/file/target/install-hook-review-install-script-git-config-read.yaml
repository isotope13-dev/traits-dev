defaults:
  platforms: [unix, windows]
  for: [javascript]
composite_rules:
  - id: install-script-git-config-read
    desc: Install-named script reads Git configuration
    crit: notable
    conf: 0.95
    all:
      - id: metadata/package/files/included::install-or-beacon-js-basename
      - id: micro-behaviors/fs/read/file/target::git-config-file-read
