defaults:
  platforms: [windows, unix]
  for: [powershell]
  crit: notable
  conf: 0.86
traits:
  - id: powershell-history-save-path
    desc: Queries PowerShell history save path
    if:
      type: text
      regex: '(?i)\bGet-PSReadLineOption\b[^\r\n]{0,120}\bHistorySavePath\b'
  - id: powershell-reads-batch-source
    desc: PowerShell reads adjacent batch source
    crit: notable
    conf: 0.96
    for: [batch, powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)\[IO\.File\]::ReadAllText\(\s*['']%~dp0[A-Za-z0-9_.-]{1,80}\.bat['']\)'
  - id: ps-read-zip-variable
    desc: PowerShell reads ZIP variable
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)ReadAllBytes\(\$(zip|archive)[A-Za-z_]*\)'
    unless:
      - id: well-known/app/system/sysmanage::agent-package-context
      - id: well-known/app/system/sysmanage::windows-installer-script-path

