defaults:
  platforms: [unix, windows]
  for: [source, scripts]
composite_rules:
- id: credential-path-near-file-input
  desc: Credential path near a file-input operation
  crit: notable
  conf: 0.92
  # This is proximity, not provenance: a credential path appears near a
  # read, open, upload, or archive operation. Export objectives must bind
  # the sensitive content to a send rather than infer it from this context.
  near_bytes: 300
  all:
  - id: micro-behaviors/fs/path/credential::developer-auth-file-reference
  any:
  - id: micro-behaviors/fs/read/file/full::file-content-read-operation
  - id: micro-behaviors/fs/read/file/full::dotnet-readalltext-token
  - id: "micro-behaviors/fs/read/file/target::shell-cat-root-or-home-path"
  - id: micro-behaviors/fs/read/file/full::powershell-get-content-command
  - id: micro-behaviors/fs/file/open::os-open
  - id: micro-behaviors/communications/http/upload::curl-data-binary
  - id: micro-behaviors/communications/http/upload::curl-named-file-body-upload-command
  - id: micro-behaviors/data/archive/create/tar::tar-create
  unless:
  - id: well-known/tool/detection/cert-x-gen::scanner-source-member-context

