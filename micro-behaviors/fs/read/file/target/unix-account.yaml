defaults:
  platforms: [unix, windows]
  conf: 0.8
traits:
  - id: etc-passwd-read
    for: [scripts, -javascript, elf, c, cpp, objc, go, rust, java, class, kotlin, zig, csharp]
    desc: /etc/passwd read via read call
    crit: notable
    attack: T1033
    if:
      type: text
      regex: '(?i)\bread\w*\s*\([^\r\n(]{0,80}/etc/passwd\b'
    not:
      - substr: fs.readFile('/etc/passwd'
      - substr: file:///etc/passwd
    unless:
      - id: metadata/file/catalog/identity/
