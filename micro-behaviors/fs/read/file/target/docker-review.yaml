composite_rules:
- id: docker-config-path-near-read
  desc: Docker credential path near file-read operation
  conf: 0.9
  near_bytes: 256
  all:
  - id: micro-behaviors/fs/path/secret-config::docker-config-path-reference
  any:
  - id: micro-behaviors/fs/read/file/content/
  - id: micro-behaviors/fs/read/file/handle/
- id: registry-credential-path-read-cluster
  desc: Docker/package paths near credential-file reads
  conf: 0.95
  near_bytes: 8192
  all:
  - id: micro-behaviors/fs/read/file/target::docker-config-path-near-read
  - id: micro-behaviors/fs/path/config/app::package-manager-or-netrc-config-path
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  crit: notable
