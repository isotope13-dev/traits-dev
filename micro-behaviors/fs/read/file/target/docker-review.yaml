composite_rules:
- id: docker-config-path-near-read
  desc: Docker credential path near file-read operation
  conf: 0.9
  near_bytes: 256
  all:
  - id: micro-behaviors/fs/path/credential::docker-config-path-reference
  any:
  - id: micro-behaviors/fs/read/file/full/
  - id: micro-behaviors/fs/read/file/handle/
  unless:
  - id: well-known/tool/sysadmin/container/
  - id: well-known/tool/detection/security-scanner/
  - id: micro-behaviors/os/container/oci/
  - id: micro-behaviors/os/container/image/
  - id: metadata/lang/generated::python-protobuf-stub
  - id: metadata/lang/generated::python-mypy-protobuf-generated
- id: registry-credential-path-read-cluster
  desc: Docker/package paths near credential-file reads
  conf: 0.95
  near_bytes: 8192
  unless:
  - id: well-known/tool/sysadmin/container/
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/threat-intel/
  - id: metadata/lang/generated::python-protobuf-stub
  - id: metadata/lang/generated::python-mypy-protobuf-generated
  - id: well-known/tool/detection/agent-sentry/
  - id: well-known/lib/format/conda-package/
  - id: metadata/package/documentation/security-advisory::credential-rotation-guidance
  all:
  - id: micro-behaviors/fs/read/file/target::docker-config-path-near-read
  - id: micro-behaviors/fs/path/secret-config::package-or-netrc-credential-file
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  crit: notable
