defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - python
  - source
traits:
- id: git-config-file-read
  desc: Reads a Git configuration file
  crit: notable
  conf: 0.95
  attack: T1552.001
  if:
    type: text
    regex: (read(File|Stream)|open)[^\n]{0,16}\([\s\S]{0,16}git.?config
  unless:
  - id: well-known/tool/detection/tyre-kicker/
  downgrade:
    any:
    - id: metadata/build
