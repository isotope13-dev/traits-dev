# Node twin of python-sensitive-file-read, and kept in the same capability
# namespace for the same reason: reading a .env / .config / credentials path is
# a neutral file-read, not evidence of staging data for upload.
#
# Relocated from objectives/exfiltration/cloud/object-store, whose own header
# already records this refactor being made for the storage-endpoint atoms
# ("keeping it under an exfiltration path made every SDK that ships an endpoint
# table look like staging") -- the Node half of the pair was simply left
# behind, so every bundle carrying dotenv-style config loading was reported
# under an exfiltration objective.  The composite there still reaches for it
# cross-directory, exactly as it already did for the Python half.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-sensitive-file-read
    desc: Node reads a sensitive config path
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: >-
        (?i)\breadFileSync\s*\(.{0,120}['"][^'"]{0,64}(\.env|\.config|credentials)
    unless:
      - id: metadata/library/structure::vscode-extension-generated-asset
