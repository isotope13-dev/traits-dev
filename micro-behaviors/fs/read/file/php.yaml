defaults:
  platforms: [windows, unix]
  for:
    - php
traits:
  - id: file-get-contents
    desc: File read via file_get_contents
    crit: baseline
    conf: 0.75
    mbc: C0051
    if:
      type: symbol
      kind: call
      exact: file_get_contents
  - id: fread
    desc: File read via fread
    crit: baseline
    conf: 0.75
    mbc: C0051
    if:
      type: string_literal
      regex: \bfread\s*\(
  - id: fgets
    desc: Line read via fgets
    crit: baseline
    conf: 0.6
    if:
      type: string_literal
      regex: \bfgets\s*\(
  - id: readfile
    desc: Outputs file contents via readfile
    crit: notable
    conf: 0.9
    mbc: C0051
    # Call-site match, not a substring of any string literal that happens to
    # contain "readfile": PHP's readfile() streams a file straight to the
    # response body, which is the download primitive every file-serving
    # endpoint uses and the one a webshell reuses to exfiltrate.
    if:
      type: symbol
      kind: call
      exact: readfile
  - id: fopen-dup
    desc: File open operation
    crit: baseline
    conf: 0.6
    if:
      type: string_literal
      regex: \bfopen\s*\(
  - id: php-dotenv-read-into-variable
    desc: PHP reads dotenv into variable
    crit: notable
    conf: 0.97
    mbc: C0051
    if:
      type: text
      regex: '\$[A-Za-z_][A-Za-z0-9_]*\s*=\s*@?\s*file_get_contents\s*\([^;]{0,220}[/\\]\.env'
