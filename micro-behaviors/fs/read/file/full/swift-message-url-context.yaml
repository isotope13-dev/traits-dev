# Classified by required operations; references do not establish data flow.
defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
composite_rules:
  - id: swift-messages-credential-read
    desc: Swift file read with message URL and key refs
    crit: notable
    conf: 0.96
    for: [swift]
    platforms: [unix]
    all:
      - id: micro-behaviors/communications/http/url/api-path::swift-messages-endpoint
      - id: micro-behaviors/fs/read/file/full::swift-direct-file-read-api
      - id: micro-behaviors/fs/path/public-key::swift-authorized-keys-path

