defaults:
  for: [php]
  platforms: [unix, windows]
composite_rules:
  - id: php-ip-restricted-request-file-read
    desc: IP-restricted PHP page reads request-selected file
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/request/cgi::ip-allowlist-remote-addr-gate
      - id: micro-behaviors/fs/read/file/full::readfile-variable-path
      - id: micro-behaviors/communications/http/request/superglobal::request-isset-default-assignment

# The listing half of the same tool shape: a gated page that enumerates a
# request-chosen directory exposes the server layout to the operator for
# follow-on reads through the companion file endpoint.
