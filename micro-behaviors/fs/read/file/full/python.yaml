# Python file reading
# ATT&CK: T1005 (Data from Local System)
defaults:
  crit: baseline
  platforms: [windows, unix]
  mbc: E1005
  for: [python]
  attack: T1005
traits:
  - id: file-read-content
    desc: Reads file content (Python)
    conf: 0.6
    if:
      type: tree-sitter
      query: |
        ((call function: (attribute object: (call function: (identifier) @open) attribute: (identifier) @read)) @operation
         (#eq? @open "open") (#eq? @read "read"))
        ((_ (expression_statement (assignment left: (identifier) @handle right: (call function: (identifier) @open))) .
            (expression_statement (assignment right: (call function: (attribute object: (identifier) @used attribute: (identifier) @read))))) @operation
         (#eq? @open "open") (#eq? @read "read") (#eq? @handle @used))
        ((with_statement (with_clause (with_item value: (as_pattern (call function: (identifier) @open) alias: (as_pattern_target (identifier) @handle))))
           body: (block (expression_statement (assignment right: (call function: (attribute object: (identifier) @used attribute: (identifier) @read)))))) @operation
         (#eq? @open "open") (#eq? @read "read") (#eq? @handle @used))
  - id: python-pathlib-read-text
    desc: Read text via pathlib
    conf: 0.8
    if:
      type: symbol
      substr: read_text
  - id: python-pathlib-read-bytes
    desc: Read bytes via pathlib
    conf: 0.8
    if:
      type: symbol
      substr: read_bytes
