# AutoHotkey reading a whole file as raw bytes into a pre-sized buffer
# (VarSetCapacity + FileObject.RawRead). The DllCall staging idiom; ordinary
# AHK programs read text with FileRead or FileOpen loops instead.
defaults:
  platforms: [windows]
  for: [pe, text]
  crit: notable
  conf: 0.9

traits:
  - id: ahk-rawread-into-buffer
    desc: RawRead reads file bytes into buffer
    if:
      type: text
      regex: '\.\s*RawRead\s*\(\s*\w+'
