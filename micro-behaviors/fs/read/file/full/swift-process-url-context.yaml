# Classified by required operations; references do not establish data flow.
defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
composite_rules:
  - id: swift-powershell-credential-loader
    desc: Swift file read with PowerShell and HTTP refs
    crit: notable
    conf: 0.99
    for: [swift, zip, tar]
    scope: archive
    all:
      - id: micro-behaviors/process/create/shell/lang::powershell-keyword
      - id: micro-behaviors/fs/read/file/full::swift-direct-file-read-api
      - id: micro-behaviors/process/create/direct::swift-source-process-run
      - id: micro-behaviors/communications/http/post::swift-urlsession-data-task

