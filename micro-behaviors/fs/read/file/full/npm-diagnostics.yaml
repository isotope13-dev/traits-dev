defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: node-read-outside-install-diagnostics
    desc: File read outside install diagnostics
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((call_expression function: (member_expression
          object: (identifier) @fs
          property: (property_identifier) @read)) @call
          (#eq? @fs "fs")
          (#eq? @read "readFileSync")
          (#not-match? @call "^fs[.]readFileSync[(]manifest, *[\"']utf8[\"'][)]$")
          (#not-match? @call "^fs[.]readFileSync[(][\"']/proc/1/cgroup[\"'], *[\"']utf8[\"'][)]$"))
