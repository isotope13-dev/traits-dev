defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-file-content-base64-value-flow
    desc: Reads file content into Base64 encoding
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((_ (assignment left: (identifier) @content
              right: (call receiver: (constant) @file method: (identifier) @read))
            (assignment right: (hash (pair value: (call receiver: (constant) @base64
              method: (identifier) @encode arguments: (argument_list (identifier) @value))))))
          (#eq? @file "File") (#eq? @read "read") (#eq? @base64 "Base64")
          (#match? @encode "^(strict_encode64|urlsafe_encode64|encode64)$") (#eq? @content @value))
        ((_ (assignment left: (identifier) @content
              right: (call receiver: (constant) @file method: (identifier) @read))
            (assignment right: (call receiver: (constant) @base64 method: (identifier) @encode
              arguments: (argument_list (identifier) @value))))
          (#eq? @file "File") (#eq? @read "read") (#eq? @base64 "Base64")
          (#match? @encode "^(strict_encode64|urlsafe_encode64|encode64)$") (#eq? @content @value))
