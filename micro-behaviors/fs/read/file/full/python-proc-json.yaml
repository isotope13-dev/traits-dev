# Bind the selected procfs file, read result, dictionary and JSON input.
# The existing encrypted-dictionary POST matcher supplies the onward transfer.
defaults:
  platforms: [linux]
  for: [python]
traits:
  - id: python-proc-environ-json-bundle
    desc: Process environment reads enter JSON bundle
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((block
          (for_statement
            left: (identifier) @selected
            right: (call function: (attribute
              object: (call function: (identifier) @path
                arguments: (argument_list . (string (string_content) @root) .))
              attribute: (identifier) @glob)
              arguments: (argument_list . (string (string_content) @pattern) .))
            body: (block . (try_statement
              body: (block . (expression_statement (assignment
                left: (subscript value: (identifier) @bundle subscript: (_))
                right: (call function: (attribute
                  object: (call function: (attribute
                    object: (identifier) @reader attribute: (identifier) @read))
                  attribute: (identifier) @decode)))) .)
              (except_clause (identifier) @error (block . (pass_statement) .)) .) .))
          . (expression_statement (assignment
            right: (call function: (attribute
              object: (identifier) @gzip attribute: (identifier) @compress)
              arguments: (argument_list . (call function: (attribute
                object: (call function: (attribute
                  object: (identifier) @json attribute: (identifier) @dumps)
                  arguments: (argument_list . (identifier) @serialized .))
                attribute: (identifier) @encode)) .)))))
          (#eq? @path "Path")
          (#eq? @root "/proc")
          (#eq? @glob "glob")
          (#match? @pattern "^(\\*|\\[0-9\\]\\*)/environ$")
          (#eq? @selected @reader)
          (#eq? @read "read_bytes")
          (#eq? @decode "decode")
          (#eq? @error "OSError")
          (#eq? @bundle @serialized)
          (#eq? @gzip "gzip")
          (#eq? @compress "compress")
          (#eq? @json "json")
          (#eq? @dumps "dumps")
          (#eq? @encode "encode"))
    unless:
      - id: metadata/lang/source/origin::plain-source-layer-path
