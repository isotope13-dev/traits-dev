defaults:
  platforms: [windows]
  for: [vbs]
traits:
  - id: vb6-lof-buffer-read-source
    desc: VB6 full file buffer read
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bSpace\s*\(\s*LOF\s*\('
composite_rules:
  - id: vb6-full-binary-file-read-source
    desc: VB6 reads full binary file
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/fs/read/file/handle::vb6-binary-open-source
      - id: micro-behaviors/fs/read/file/full::vb6-lof-buffer-read-source
      - id: micro-behaviors/fs/read/file/handle::vb6-get-binary-source
