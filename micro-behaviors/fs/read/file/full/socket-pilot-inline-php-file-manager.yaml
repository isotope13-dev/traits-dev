# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - php
  - html
  - text
  - data
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.94
traits:
- id: php-path-file-read-edit-form
  desc: Reads a file beneath PATH
  if:
    type: text
    substr: file_get_contents(PATH."/"
