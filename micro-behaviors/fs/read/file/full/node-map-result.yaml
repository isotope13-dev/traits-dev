defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.98
traits:
- id: node-file-map-base64-result
  desc: File bytes encoded in Base64 result
  if:
    type: tree-sitter
    query: |
      (
        (statement_block
          (for_in_statement
            left: (identifier) @file
            body: (statement_block
              (try_statement
                body: (statement_block
                  (expression_statement
                    (assignment_expression
                      left: (subscript_expression
                        object: (identifier) @map
                        index: (identifier) @file_key)
                      right: (call_expression
                        function: (member_expression
                          object: (call_expression
                            function: (member_expression
                              object: (identifier) @fs
                              property: (property_identifier) @read)
                            arguments: (arguments
                              (identifier) @file_use))
                          property: (property_identifier) @strR)
                        arguments: (arguments (string (string_fragment) @b64R)))))))))
          (expression_statement
            (call_expression
              function: (identifier)
              arguments: (arguments
                (_)
                *
                (object
                  (pair
                    key: (property_identifier) @data
                    value: (call_expression
                      function: (member_expression
                        object: (call_expression
                          function: (member_expression
                            object: (identifier) @bufferO
                            property: (property_identifier) @fromO)
                          arguments: (arguments
                            (call_expression
                              function: (member_expression
                                object: (identifier) @jsonO
                                property: (property_identifier) @stringifyO)
                              arguments: (arguments
                                (identifier) @map_use))))
                        property: (property_identifier) @strO)
                      arguments: (arguments (string (string_fragment) @b64O)))))))))
        (#eq? @fs "fs")
        (#eq? @read "readFileSync")
        (#eq? @file @file_key)
        (#eq? @file @file_use)
        (#eq? @map @map_use)
        (#eq? @data "data")
        (#eq? @strR "toString")
        (#eq? @b64R "base64")
        (#eq? @bufferO "Buffer")
        (#eq? @fromO "from")
        (#eq? @strO "toString")
        (#eq? @b64O "base64")
        (#eq? @jsonO "JSON")
        (#eq? @stringifyO "stringify"))

      ((pair
        key: (property_identifier) @data_key
        value: (call_expression
          function: (member_expression
            object: (call_expression
              function: (member_expression
                object: (identifier) @fs_module
                property: (property_identifier) @read_method))
            property: (property_identifier) @string_method)
          arguments: (arguments (string (string_fragment) @encoding))))
       (#eq? @data_key "data")
       (#eq? @fs_module "fs")
       (#eq? @read_method "readFileSync")
       (#eq? @string_method "toString")
       (#eq? @encoding "base64"))
