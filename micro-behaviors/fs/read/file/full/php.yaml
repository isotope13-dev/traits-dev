defaults:
  mbc: C0051
  platforms: [windows, unix]
  for: [php]
traits:
  - id: file-get-contents
    desc: File read via file_get_contents
    crit: baseline
    conf: 0.75
    if:
      type: symbol
      kind: call
      exact: file_get_contents
  - id: readfile
    desc: Outputs file contents via readfile
    crit: notable
    conf: 0.9
    # Call-site match, not a substring of any string literal that happens to
    # contain "readfile": PHP's readfile() streams a file straight to the
    # response body, which is the download primitive every file-serving
    # endpoint uses and the one a webshell reuses to exfiltrate.
    if:
      type: symbol
      kind: call
      exact: readfile
  - id: readfile-variable-path
    desc: readfile serves a variable path
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: readfile
      arg:
        kind: identifier
  # Relocated from objectives/.../webshell/stager: the matcher only observes
  # the readfile name (string tables, dispatch maps, indirect calls), not a
  # call site or a download. Consumers establish the webshell context.
  - id: readfile-name-reference
    desc: Names the readfile output function
    crit: notable
    conf: 0.84
    if:
      type: text
      word: readfile
    unless:
      - id: micro-behaviors/fs/read/file/full::readfile
  - id: php-file-get-variable-source
    crit: notable
    desc: PHP reads content from a variable source
    conf: 0.88
    if:
      type: tree-sitter
      query: |
        ((function_call_expression
          function: (name) @read
          arguments: (arguments . (argument (variable_name)))) @call
          (#match? @read "(?i)^file_get_contents$"))
