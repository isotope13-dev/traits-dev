defaults:
  platforms: [unix]
  for: [javascript]
composite_rules:
- id: node-linux-config-file-set
  desc: Node file-read call with Linux configuration path references
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/fs/read/file/full::read-node
  any:
  - id: micro-behaviors/fs/path/config/accounts::etc-passwd
  - id: micro-behaviors/fs/path/config/system::config-hosts
  - id: micro-behaviors/fs/path/config/system::linux-hostname-path
  - id: micro-behaviors/fs/path/config/system::config-crontab
  needs: 3
