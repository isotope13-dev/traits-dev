# `<cffile action="read">` returns a file's contents to CFML code.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.88
traits:
  - id: cffile-read
    desc: ColdFusion cffile reads a file
    if:
      type: text
      regex: '<\s*cffile\s+action\s*=\s*["'']?read\b'
      case_insensitive: true
