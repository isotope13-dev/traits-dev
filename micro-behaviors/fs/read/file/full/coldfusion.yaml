# `<cffile action="read">` returns a file's contents to CFML code.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.88
traits:
  - id: cffile-read
    desc: ColdFusion cffile reads a file
    if:
      type: symbol
      kind: call
      exact: cffile
      arg:
        index: 0
        from:
          field: action
          whole_value: '(?i)^read(binary)?$'
  - id: cffile-request-read-path
    desc: CFML request member supplies file read path
    if:
      type: symbol
      kind: call
      exact: cffile
      args:
        - index: 0
          from:
            field: action
            whole_value: '(?i)^read(binary)?$'
        - index: 0
          from:
            field: file
            member: '^(form|url)\.'
  - id: cffile-parameter-read-path
    desc: CFML request parameter supplies file read path
    if:
      type: symbol
      kind: call
      exact: cffile
      args:
        - index: 0
          from:
            field: action
            whole_value: '(?i)^read(binary)?$'
        - index: 0
          from:
            field: file
            call: '^getpagecontext\.getrequest\.getparameter$'
composite_rules:
  - id: cffile-request-controlled-read
    desc: CFML reads a request-supplied file path
    any:
      - id: cffile-request-read-path
      - id: cffile-parameter-read-path
