defaults:
  platforms: [unix]
  for: [shell, python, elf, macho, go, c, cpp, objc]
composite_rules:
  - id: history-reference-with-file-read
    desc: History location and file-read capability coexist
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/fs/read/file/full::file-content-read-operation
    any:
      - id: micro-behaviors/fs/path/personal::shell-repl-history-filename-reference
      - id: micro-behaviors/fs/path/personal::database-client-history-filename-reference
      - id: micro-behaviors/fs/path/personal::fish-history-reference
      - id: micro-behaviors/fs/path/personal::consolehost-history-reference
    unless:
      - id: well-known/app/utility/cmdchamp/
      - id: well-known/app/utility/iris::iris-autocomplete-context
      - id: well-known/tool/detection/llm-scanner/
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
