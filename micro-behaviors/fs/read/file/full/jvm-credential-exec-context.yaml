# Classified by required operations; references do not establish data flow.
defaults:
  platforms: [windows]
  for: [scripts, source, class, java_class]
composite_rules:
  - id: jvm-credential-read-exec-context
    desc: JVM credential paths with file read and exec
    crit: notable
    conf: 0.99
    for: [class, java_class]
    platforms: [unix, macos]
    all:
      - id: micro-behaviors/fs/path/credential::jvm-authentication-path-reference
      - id: micro-behaviors/fs/read/file/full::java-readallbytes
      - id: micro-behaviors/process/create/spawn::java-runtime-exec-bytecode-symbol
      - id: micro-behaviors/communications/http/url/domain::http-url-binary

