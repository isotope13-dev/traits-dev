traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  id: node-package-credential-read-reference
  desc: JS references a package credential file read
  conf: 0.85
  if:
    type: text
    regex: (?i)(^|[^\w$])(readFile(Sync)?|createReadStream)\s*\([^)]{0,80}(\.npmrc|\.git-credentials)
  not:
  - substr: homedir(), '.npmrc'
  - substr: path.join(homedir(), '.npmrc')
  - substr: HOME']}/.npmrc
  - substr: 'userconfig: { default: path.join(os.homedir(), ''.npmrc'') }'
  - substr: 'configNames: { default: [''npmrc'', ''.npmrc''] }'
  unless:
  - id: well-known/app/ai/coding-agent/qwen-code::qwen-code-bundle-text
  - id: well-known/app/ai/coding-agent/acuvo-code::official-package-context
  - id: metadata/file/extension/identity::markdown-file-basename
