defaults:
  platforms: [ios, unix, windows]
  for: [csharp, pe, dll]
traits:
  - id: dotnet-readallbytes-token
    desc: .NET ReadAllBytes method reference
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'ReadAllBytes|File\.ReadAllBytes'
  - id: dotnet-file-openread-call
    desc: .NET opens a file for reading
    crit: notable
    conf: 0.92
    for: [csharp]
    if:
      type: symbol
      kind: call
      exact: File.OpenRead
  - id: dotnet-stream-readexactly-call
    desc: .NET reads an exact stream byte count
    crit: notable
    conf: 0.92
    for: [csharp]
    if:
      type: symbol
      kind: call
      regex: '(^|[.])ReadExactly$'

composite_rules:
  - id: dotnet-openread-readexactly
    desc: .NET reads file content through an exact-length stream read
    crit: notable
    conf: 0.96
    for: [csharp]
    near_lines: 16
    all:
      - id: dotnet-file-openread-call
      - id: dotnet-stream-readexactly-call
