defaults:
  platforms: [windows, unix]
  for: [powershell]
  crit: notable
  conf: 0.86
traits:
  - id: read-all-bytes
    desc: .NET reads all bytes from a file
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '(?i)(\[IO\.File\]|\[System\.IO\.File\])::ReadAllBytes\s*\('
  - id: get-content
    desc: PowerShell reads file content
    if:
      type: text
      word: Get-Content
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
  - id: get-content-raw
    desc: PowerShell reads a whole file
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\bGet-Content\b[^\r\n]{1,160}-Raw\b'
  - id: read-all-text
    desc: .NET reads text file
    if:
      type: text
      regex: '\[(System\.)?IO\.File\]::ReadAllText\b'
