defaults:
  platforms: [linux]
  for: [python]

traits:
  - id: python-globbed-proc-environ-read
    desc: Reads glob-selected process environment files
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((for_statement
          left: (identifier) @selected
          right: (call
            function: (attribute
              object: (call function: (identifier) @path
                arguments: (argument_list . (string (string_content) @root)))
              attribute: (identifier) @glob)
            arguments: (argument_list . (string (string_content) @pattern)))
          body: (block
            . (try_statement body: (block
              . (expression_statement (assignment
                right: (call function: (attribute
                  object: (call function: (attribute
                    object: (identifier) @reader
                    attribute: (identifier) @read))
                  attribute: (identifier) @decode)))))))) @read_loop
          (#eq? @path "Path")
          (#eq? @root "/proc")
          (#eq? @glob "glob")
          (#match? @pattern "^(\\*|\\[0-9\\]\\*)/environ$")
          (#eq? @selected @reader)
          (#eq? @read "read_bytes")
          (#eq? @decode "decode"))
    unless:
      - id: metadata/lang/source/origin::plain-source-layer-path
