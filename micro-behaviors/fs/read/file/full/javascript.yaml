# File Read Operations - JavaScript/Node
# MBC: C0051 (Read File)
# ATT&CK: T1005
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: read-node
  desc: Reads files with Node.js
  crit: notable
  conf: 0.9
  unless:
  - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: metadata/build/
  if:
    type: symbol
    kind: call
    regex: '(^|\.)fs(\.promises)?\.readFile(Sync)?$|^readFile(Sync)?$'
# Member/alias form survives bundler renames (node_fs.readFileSync, fs$1.readFileSync).
- id: readfilesync-call
  desc: Calls readFileSync
  crit: notable
  conf: 0.9
  if:
    # Large generated bundles can exceed the structural parser's limits, but
    # the call spelling remains unambiguous JavaScript file-read behavior.
    type: text
    regex: '\b([A-Za-z_$][A-Za-z0-9_$]*\.)?readFileSync\s*\('
  unless:
    # Type declarations contain callable signatures, not runtime calls.
    - id: metadata/lang/scripted::dts-declaration-file
    - id: metadata/lang/upstream::linux-kernel-secondary-tree-path
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
    - id: metadata/lang/upstream::linux-kernel-primary-tree-path
- id: node-bracket-read-file-sync
  desc: Node bracket readFileSync
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\s*\[\s*["'']readFileSync["'']\s*\]\s*\('
  unless:
    - id: metadata/package/testing/
- id: read-text-utf8
  desc: Reads file content as utf8
  crit: baseline
  conf: 0.72
  if:
    type: text
    regex: "readFile(Sync)?\\s*\\([^)]{0,120}['\\\"]utf8['\\\"]"
composite_rules:
- id: file-content-read-operation
  desc: File content read operation
  crit: baseline
  conf: 0.82
  platforms: [windows, unix, macos]
  for: [scripts, source, binaries]
  # "The contents of a file were read, by whatever means." Every leaf under the
  # read techniques below qualifies, so they are named as directories rather
  # than re-listed one at a time. The bare legs are this directory's own full
  # reads -- a directory reference to `full` would expand to include this rule.
  any:
  - id: micro-behaviors/fs/read/file/handle
  - id: micro-behaviors/fs/read/file/descriptor
  - id: micro-behaviors/fs/read/file/partial
  - id: micro-behaviors/fs/read/file/target
  - id: micro-behaviors/fs/read/stream
  - id: read-node
  - id: readfilesync-call
  - id: node-bracket-read-file-sync
  - id: read-text-utf8
  - id: os-readfile
  - id: ioutil-readfile
  - id: file-read-content
  - id: python-pathlib-read-text
  - id: python-pathlib-read-bytes
  - id: ruby-file-read-content
  - id: ruby-file-binread-content
  - id: rust-read-to-string
  - id: rust-read-to-end
  - id: rust-fs-read
  - id: get-content
  - id: get-content-raw
  - id: powershell-get-content-command
  - id: read-all-text
  - id: read-all-bytes
  - id: dotnet-read-all-text
  - id: dotnet-readallbytes-token
  - id: java-readallbytes
  - id: groovy-file-text-read
  - id: file-get-contents
  - id: readfile
  - id: php-show-source
  - id: objc-contents-of-file
  - id: objc-data-with-contents-of-file
  - id: swift-direct-file-read-api
  - id: swift-data-file-read
  - id: readall-text-file
  - id: vb6-full-binary-file-read-source
  - id: vb6-lof-buffer-read-source
