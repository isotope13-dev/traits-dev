# .NET file-read APIs
defaults:
  platforms: [windows, unix, openwrt]
  for: [pe, dll]
traits:
  - id: dotnet-read-all-text
    desc: .NET ReadAllText method reference
    crit: notable
    conf: 0.7
    if:
      type: text
      exact: ReadAllText
      # CLR MemberRef names normally live in .text, not native .rdata.
      # The token is a reference; it does not establish an executed read.
