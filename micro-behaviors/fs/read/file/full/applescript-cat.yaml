# A quoted form operand is passed to cat by the shell, rather than read
# from stdin. Also covers escaped AppleScript recovered from native code.
defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  crit: notable
  conf: 0.95

traits:
  - id: applescript-shell-cat-quoted-path
    desc: AppleScript shell cat reads a quoted path
    if:
      type: text
      regex: 'do shell script [\\]*"cat [\\]*"\s*&\s*quoted form of \w+'

