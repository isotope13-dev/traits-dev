# Ruby File Operations
# Generic file read/write capabilities
# ATT&CK: T1083 (File and Directory Discovery)
defaults:
  attack: T1083
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-file-read-content
    desc: Ruby File.read method reference
    crit: baseline
    conf: 0.95
    if:
      type: symbol
      kind: member
      exact: File.read
