defaults:
  platforms:
  - windows

traits:
  - id: batch-getcontent-raw-file
    desc: Get-Content raw file read reference
    crit: notable
    conf: 0.93
    for:
      - batch
    if:
      type: text
      regex: '(?i)Get-Content.{0,80}(\.tmp|\.b64|\.dat|\.txt|%[^%\r\n]{1,30}%)([''"\s]|$).{0,40}-Raw'
    unless:
      - id: well-known/tool/offensive/dalfox::dalfox-scanner-context
