# Direct request subscripts are not variable_name arguments; keep them
# distinct from the existing php-file-get-variable-source matcher.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.98
traits:
  - id: php-file-get-request-source
    desc: PHP reads a request-selected stream
    if:
      type: tree-sitter
      query: |
        ((function_call_expression
          function: (name) @fn
          arguments: (arguments
            . (argument (subscript_expression (variable_name) @source)))) @call
          (#match? @fn "(?i)^file_get_contents$")
          (#match? @source "^\\$_(GET|POST|REQUEST)$"))
