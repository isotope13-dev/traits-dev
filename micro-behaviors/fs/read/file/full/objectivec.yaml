defaults:
  crit: notable
  conf: 0.8
  platforms: [unix]
  for: [objc]
traits:
  - id: objc-contents-of-file
    desc: Objective-C reads file contents
    if:
      type: symbol
      kind: call
      exact: 'contentsOfFile:'
  - id: objc-data-with-contents-of-file
    desc: Objective-C reads file data
    if:
      type: symbol
      kind: call
      exact: 'dataWithContentsOfFile:'
