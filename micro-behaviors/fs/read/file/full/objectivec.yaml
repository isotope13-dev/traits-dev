defaults:
  crit: notable
  conf: 0.8
  platforms: [unix]
  for: [objc]

traits:
  - id: objc-contents-of-file
    desc: Objective-C reads file contents
    if:
      type: symbol
      kind: call
      exact: 'contentsOfFile:'

  - id: objc-data-with-contents-of-file
    desc: Objective-C reads file data
    if:
      type: symbol
      kind: call
      exact: 'dataWithContentsOfFile:'

  - id: foundation-dictionary-from-file
    desc: Foundation reads a dictionary from file
    crit: notable
    conf: 0.92
    platforms: [macos]
    for: [objc, macho, dylib]
    if:
      type: text
      substr: 'dictionaryWithContentsOfFile:'

  - id: foundation-property-list-at-path
    desc: Foundation parses a property list at path
    crit: notable
    conf: 0.92
    platforms: [macos]
    for: [objc, macho, dylib]
    if:
      type: text
      substr: 'plistsParseAtPath:result:'
