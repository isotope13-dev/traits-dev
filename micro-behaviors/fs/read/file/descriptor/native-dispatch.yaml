defaults:
  platforms: [macos, ios]
  for: [javascript, typescript]
  crit: notable
  conf: 0.86

traits:
  - id: posix-read-dispatch
    desc: Passes read routine to a dispatcher
    # The dispatcher name is arbitrary. This observes an API reference passed
    # as an argument; it does not establish that the callback was executed.
    if:
      type: symbol
      kind: call
      regex: '^[A-Za-z_$][A-Za-z0-9_$]*$'
      arg:
        index: 0
        kind: identifier
        name: read
    unless:
      - type: function
        exact: read
