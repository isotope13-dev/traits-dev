defaults:
  for: [python]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: python-shell-history-read-accumulate
    desc: Appends opened shell history contents
    if:
      type: tree-sitter
      query: |
        ((with_statement
          (with_clause (with_item value: (as_pattern
            (call function: (identifier) @open
              arguments: (argument_list (call arguments: (argument_list (string) @path))))
            alias: (as_pattern_target (identifier) @handle))))
          body: (block (expression_statement (augmented_assignment
            left: (identifier) @destination
            right: (call function: (attribute object: (identifier) @read_handle attribute: (identifier) @read))) @assignment)))
          (#eq? @open "open") (#eq? @read "read") (#eq? @handle @read_handle)
          (#match? @assignment "\\+=") (#match? @path "[.]bash_history"))
