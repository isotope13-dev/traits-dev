defaults:
  platforms: [linux, macos]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: node-read-resolver-config
    desc: readFileSync reads system resolver configuration
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '\.readFileSync$'
      arg:
        index: 0
        kind: string
        exact: /etc/resolv.conf
