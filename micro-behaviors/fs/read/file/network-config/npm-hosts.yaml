defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
traits:
- id: npm-postinstall-python-hosts-content-read
  desc: Postinstall Python reads /etc/hosts
  crit: notable
  conf: 0.98
  if:
    type: value
    path: scripts.postinstall
    regex: '\bopen\(\s*["'']/etc/hosts["'']\s*\)\.read\('
- id: npm-postinstall-target-list-contains-hosts-path
  desc: Postinstall target list names /etc/hosts
  crit: notable
  conf: 0.97
  if:
    type: value
    path: scripts.postinstall
    regex: 'targets\s*=\s*\[[^\]]{0,140}["'']/etc/hosts["'']'
- id: npm-postinstall-python-hosts-read
  desc: Postinstall reads hosts beside HTTPX POST
  crit: notable
  conf: 0.98
  if:
    type: value
    path: scripts.postinstall
    regex: open\(["']/etc/hosts["'][^)]{0,20}\)\.read\(.{0,99}httpx\.post\(
