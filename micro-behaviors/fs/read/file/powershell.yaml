defaults:
  platforms: [windows, unix]
  for: [powershell]
  crit: notable
  conf: 0.86
traits:
  - id: read-all-bytes
    desc: .NET reads all bytes from a file
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: '(?i)(\[IO\.File\]|\[System\.IO\.File\])::ReadAllBytes\s*\('

  - id: get-content
    desc: PowerShell reads file content
    if:
      type: text
      word: Get-Content
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context

  - id: powershell-history-save-path
    desc: Queries PowerShell history save path
    if:
      type: text
      regex: '(?i)\bGet-PSReadLineOption\b[^\r\n]{0,120}\bHistorySavePath\b'

  - id: read-all-text
    desc: .NET reads text file
    if:
      type: text
      regex: '\[(System\.)?IO\.File\]::ReadAllText\b'

  - id: powershell-reads-batch-source
    desc: PowerShell reads adjacent batch source
    crit: notable
    conf: 0.96
    for: [batch, powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)\[IO\.File\]::ReadAllText\(\s*['']%~dp0[A-Za-z0-9_.-]{1,80}\.bat['']\)'
