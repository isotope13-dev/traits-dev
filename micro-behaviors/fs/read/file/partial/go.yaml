defaults:
  crit: notable
  platforms: [unix, windows]
  for: [go, binaries]
traits:
  - id: go-buffer-read-string
    desc: Go reads a delimited line
    conf: 0.88
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.ReadString$'
composite_rules:
  - id: go-file-tail-reader
    desc: Go reads a file after seeking to end
    conf: 0.91
    for: [go]
    near_lines: 80
    all:
      - id: micro-behaviors/fs/file/open::os-openfile
      - id: micro-behaviors/data/buffer/transfer::go-seek-call
      - id: go-buffer-read-string
