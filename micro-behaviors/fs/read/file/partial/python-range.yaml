defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-seek-read-address-range
    desc: Seeks then reads an address range
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((block
          (expression_statement
            (call function: (attribute object: (identifier) @file1
              attribute: (identifier) @seek)
              arguments: (argument_list (identifier) @start)))
          (try_statement body: (block
            (expression_statement (assignment
              right: (call function: (attribute object: (identifier) @file2
                attribute: (identifier) @read)
                arguments: (argument_list (binary_operator
                  operator: "-" right: (identifier) @start2)))))))) @match
        (#eq? @file1 @file2)
        (#eq? @start @start2)
        (#eq? @seek "seek")
        (#eq? @read "read"))
