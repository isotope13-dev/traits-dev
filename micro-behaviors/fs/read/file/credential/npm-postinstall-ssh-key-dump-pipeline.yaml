defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
- id: postinstall-ssh-key-dump-pipeline
  desc: Postinstall reads files in SSH directory
  crit: suspicious
  conf: 0.98
  if:
    type: value
    path: "scripts.postinstall"
    regex: "\\bfind\\s+~/?\\.ssh\\b[^\\n|]{0,40}\\|\\s*xargs\\s+cat\\b"
