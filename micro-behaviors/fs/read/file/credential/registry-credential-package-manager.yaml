defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: suspicious
traits:
- id: pypirc-read
  desc: Reads .pypirc file
  crit: suspicious
  conf: 0.95
  if:
    type: text
    regex: open\s*\(.{0,50}\.pypirc
- id: py-pathlib-pypirc
  desc: Python pathlib reads pypirc
  crit: notable
  conf: 0.85
  for:
  - python
  if:
    type: text
    regex: Path\s*\(.{0,50}\.pypirc.{0,40}\)\.read_
- id: py-pathlib-netrc
  desc: Python pathlib reads netrc
  crit: notable
  conf: 0.85
  for:
  - python
  if:
    type: text
    regex: Path\s*\(.{0,50}\.netrc.{0,40}\)\.read_
- id: py-pathlib-aws-creds
  desc: Python pathlib reads AWS credentials
  crit: notable
  conf: 0.85
  for:
  - python
  if:
    type: text
    regex: Path\s*\(.{0,50}\.aws/credentials.{0,40}\)\.read_
- id: py-pathlib-ssh-private-key
  desc: Python pathlib reads SSH private key
  crit: notable
  conf: 0.85
  unless:
  - id: metadata/file/profile/scanner/threat::auditr-defensive-signature-catalog
  for:
  - python
  if:
    type: text
    regex: Path\s*\(.{0,50}\.ssh/id_[a-z0-9_]{2,16}.{0,40}\)\.read_
- id: shell-cat-npmrc
  desc: Shell reads .npmrc file
  crit: suspicious
  conf: 0.9
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/tracebit::community-action-step
    - id: micro-behaviors/os/package-manager/publish::npm-publish-command
  for:
  - shell
  unless:
  - id: well-known/tool/development/aube::aube-package-test-fixture
  if:
    type: text
    regex: cat\s+[^<>\n]{0,30}[\/~$][^<\n]{0,30}\.npmrc
  not:
  - substr: cat << EOF > "$HOME/.npmrc"
  - regex: cat\s+<<\s*EOF\s*>\s*"\$HOME/\.npmrc"
  - regex: cat\s*<<\s*\w+\s*>\s*"\$HOME/\.npmrc"
  - regex: \.npmrc\.bak\b
- id: shell-cat-pypirc
  desc: Shell reads .pypirc file
  crit: suspicious
  conf: 0.9
  for:
  - shell
  unless:
  - id: well-known/tool/detection/agent-glovebox::archive-context
  if:
    type: text
    regex: cat\s+[^<>\n]{0,30}\.pypirc
- id: shell-cat-netrc
  desc: Shell reads .netrc file
  crit: notable
  conf: 0.9
  for:
  - shell
  if:
    type: text
    regex: cat\s+[^<>\n]{0,30}\.netrc
- id: shell-cat-git-credentials
  desc: Shell reads .git-credentials file
  crit: suspicious
  conf: 0.9
  for:
  - shell
  if:
    type: text
    regex: cat\s+[^<>\n]{0,30}\.git-credentials

composite_rules:
- id: py-pathlib-cred
  desc: Python pathlib credential file
  crit: suspicious
  conf: 0.85
  for:
  - python
  any:
  - id: micro-behaviors/fs/read/file/credential::py-pathlib-pypirc
  - id: micro-behaviors/fs/read/file/credential::py-pathlib-netrc
  - id: micro-behaviors/fs/read/file/credential::py-pathlib-aws-creds
  - id: micro-behaviors/fs/read/file/credential::py-pathlib-ssh-private-key
  unless:
  - id: metadata/path/directory::test-directory-component
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/opencode-v2-security::package-name
- id: shell-cat-cred
  desc: Shell reads credential file
  crit: suspicious
  conf: 0.9
  downgrade:
    scope: archive
    any:
    - id: well-known/tool/detection/tracebit::community-action-step
    - id: micro-behaviors/os/package-manager/publish::npm-publish-command
  any:
  - id: micro-behaviors/fs/read/file/credential::shell-cat-npmrc
  - id: micro-behaviors/fs/read/file/credential::shell-cat-pypirc
  - id: micro-behaviors/fs/read/file/credential::shell-cat-netrc
  - id: micro-behaviors/fs/read/file/credential::shell-cat-git-credentials
