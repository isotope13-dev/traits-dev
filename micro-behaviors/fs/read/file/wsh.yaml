# Windows Script Host FileSystemObject text I/O. The COM method names are
# matched case-sensitively on purpose: JScript is case-sensitive so the COM
# spelling is the only one that can work, while a case-insensitive match also
# swallows ordinary camelCase JavaScript APIs (`vscode.openTextFile(uri, 1)`,
# an Arrow reader's `readAll()`) that have nothing to do with the filesystem.
defaults:
  platforms: [windows]
  for: [javascript, vbs]
traits:
- id: open-text-file-read
  desc: Reads text via FileSystemObject
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: 'OpenTextFile\s*\([^,)]{1,80},\s*1\b'
- id: script-fullname-reference
  desc: References the current WSH script path
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '\bWScript\.ScriptFullName\b'
- id: open-script-fullname-read
  desc: Opens the WSH script path for reading
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: 'OpenTextFile\s*\(\s*WScript\.ScriptFullName\s*,\s*1\b'
- id: readall-text-file
  desc: Reads a TextStream with ReadAll
  crit: notable
  conf: 0.8
  if:
    # No parenthesis requirement: VBScript reads the property form
    # (`Set s = f.ReadAll`) as often as the call form.
    type: text
    regex: '\.ReadAll\b'
