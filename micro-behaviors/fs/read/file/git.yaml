# Reading a Git configuration file is a neutral file access: CI helpers, git
# credential managers, and the test suites that exercise them all do it.
#
# Relocated from objectives/supply-chain/install-hook/scripts/hook-file, where
# it was named `postinstall-git-config-harvest` and rated suspicious even
# though the matcher never checks for an install hook -- it reported
# actions/checkout's own git-auth-helper Jest tests as a postinstall harvest.
# The install-hook composite there still reaches for it cross-directory and
# supplies the hook context from its own `hook-script-filename` leg.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, source]

traits:
  - id: git-config-file-read
    desc: Reads a Git configuration file
    crit: notable
    conf: 0.95
    attack: "T1552.001"
    if:
      # A path variable and an existence check are not a read.  Require the
      # same call expression to open the file, so code that only mounts a
      # user's config into a build container is not reported.
      type: text
      regex: '(read(File|Stream)|open)[^\n]{0,16}\([\s\S]{0,16}git.?config'
    unless:
      - id: well-known/tool/detection/tyre-kicker/
    downgrade:
      any:
        - id: metadata/library/structure/
