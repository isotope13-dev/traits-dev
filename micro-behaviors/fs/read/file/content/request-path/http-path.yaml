defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: http-response-file-path-read
    desc: Local file read uses HTTP-derived path
    if:
      type: symbol
      kind: call
      regex: '(^|\.)readFileSync$'
      arg:
        index: 0
        from:
          call: '^fetch$'
          through:
            - call: '\.(json|text)$'
              receiver: true
