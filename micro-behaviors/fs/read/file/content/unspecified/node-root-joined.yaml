defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-read-root-joined-file
    desc: Reads a file joined to filesystem root
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '(^|\.)readFileSync$'
      module_level: true
      arg:
        index: 0
        from:
          call: '(^|\.)join$'
          argument: 0
          literal: '^/$'
