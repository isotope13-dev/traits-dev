defaults:
  platforms: [unix, windows]
  for: [c, cpp, javascript, typescript, python, go]
  crit: baseline
  conf: 0.9

composite_rules:
  - id: source-file-content-read-api
    desc: File-content read calls or dispatched read routine
    # A tighter subset of file-content-read-operation: no standalone string
    # naming readFileSync, stream references, or arbitrary read-named members.
    any:
      - id: micro-behaviors/fs/read/file/handle::c-fread
      - id: micro-behaviors/fs/read/file/descriptor::posix-read-dispatch
      - id: read-node
      - id: readfilesync-call
      - id: file-read-content
      - id: python-pathlib-read-bytes
      - id: os-readfile
      - id: ioutil-readfile
