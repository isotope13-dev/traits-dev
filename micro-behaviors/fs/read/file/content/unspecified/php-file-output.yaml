# File output alone establishes neither a backdoor nor an include gadget.
defaults:
  platforms: [unix, windows]
  for: [php]
traits:
  - id: php-emits-variable-file-contents
    desc: Emits contents from a variable file path
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        ((_ (function_call_expression
              function: (name) @read
              arguments: (arguments . (argument (variable_name)) .))) @output
          (#match? @read "(?i)^(file_get_contents|readfile)$")
          (#match? @output "(?i)^(echo|print)\\s"))
