defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: node-feature-gated-file-read
  desc: Workflow-sync flag gates whole-file reading
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: '(?is)WORKFLOW_SYNC_ENABLED\s*!==\s*[\x27"]1[\x27"].{0,300}readFileSync\s*\('
