defaults:
  platforms: [unix]
  for: [shell, text]
  crit: notable
  conf: 0.9
traits:
  # A literal relative operand makes this a file read, rather than cat on
  # stdin or a heredoc. Do not mistake an option, comment, or quoted example
  # for the command and its file operand.
  - id: shell-cat-relative-file
    desc: Shell cat reads a relative file
    if:
      type: text
      regex: '(?m)^[ \t]*cat[ \t]+[A-Za-z0-9_.][\w./-]{0,79}([ \t]|$)'
