defaults:
  crit: baseline
  conf: 0.9
  platforms: [unix, windows]
  for: [go, binaries]
traits:
  - id: os-readfile
    desc: Read file contents via os.ReadFile
    for: [go]
    if:
      type: symbol
      exact: os.ReadFile
  - id: ioutil-readfile
    desc: Read file contents via ioutil.ReadFile
    for: [go]
    if:
      type: symbol
      exact: ioutil.ReadFile
  # Stripped Go binaries keep the call only as a string-table name, where the
  # symbol fact never forms; the text twin preserves the read observation there.
  - id: ioutil-readfile-text
    desc: References io/ioutil.ReadFile by name
    for: [go, elf, macho, pe]
    if:
      type: text
      word: io/ioutil.ReadFile
