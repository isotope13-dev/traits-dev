# ProDOS MLI $CA is READ. The relocated parameter block binds the read buffer
# to $2000; this records the loading behavior without claiming infection.
defaults:
  platforms: [apple2]
  for: [data]
  size_max: 57344
traits:
  - id: prodos-reads-file-into-system-image
    desc: ProDOS reads file into system image
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule prodos_reads_file_into_system_image {
          strings:
            $pages = { A0 00 B9 00 20 99 ?? ?? B9 00 21 99 ?? ?? C8 D0 ?? 4C ?? ?? }
            $read = { A9 20 8D ?? ?? 20 00 BF CA ?? ?? }
            $open = { 20 00 BF C8 ?? ?? }
          condition:
            uint8(0) == 0x4c and $open and
            for any p in (1..#pages) : (
              uint16(@pages[p] + 12) == uint16(@pages[p] + 6) + 0x100 and
              int8(@pages[p] + 16) < 0 and
              @pages[p] + 17 + int8(@pages[p] + 16) == @pages[p] + 2 and
              for any r in (1..#read) : (
                uint16(@read[r] + 3) == uint16(@read[r] + 9) + 3 and
                uint16(@read[r] + 9) >= uint16(@pages[p] + 6) and
                uint16(@read[r] + 9) - uint16(@pages[p] + 6) + 4 < filesize and
                uint8(uint16(@read[r] + 9) - uint16(@pages[p] + 6)) == 4 and
                uint8(uint16(@read[r] + 9) - uint16(@pages[p] + 6) + 2) == 0
              )
            )
        }
