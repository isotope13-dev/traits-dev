defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: read-node-symbol
  desc: Calls fs.readFile or readFile
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: (^|\.)fs(\.promises)?\.readFile(Sync)?$|^readFile(Sync)?$
- id: read-node-module-bound
  desc: Calls readFile on bound Node fs module
  crit: notable
  conf: 0.92
  if:
    type: symbol
    kind: call
    regex: '(^|\.)readFile(Sync)?$'
    receiver:
      from:
        call: '^require$'
        literal: '^(node:)?fs(/promises)?$'
- id: readfilesync-call
  desc: Calls readFileSync
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: '(^|\.)readFileSync$'
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
- id: readfilesync-name-literal
  desc: readFileSync named by a string constant
  crit: notable
  conf: 0.8
  if:
    type: literal
    kind: string
    exact: readFileSync
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: node-bracket-read-file-sync
  desc: Node bracket readFileSync
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \b[A-Za-z_$][A-Za-z0-9_$]*\s*\[\s*["']readFileSync["']\s*\]\s*\(
- id: read-text-utf8
  desc: Reads file content as utf8
  crit: baseline
  conf: 0.72
  if:
    type: text
    regex: readFile(Sync)?\s*\([^)]{0,120}['\"]utf8['\"]
- id: capacitor-filesystem-read
  desc: Reads app files via Capacitor plugin
  crit: notable
  conf: 0.95
  platforms:
  - unix
  - windows
  - android
  if:
    type: symbol
    kind: call
    regex: (Capacitor\.Plugins\.)?Filesystem\.(readFile|readDirectory)$
- id: capacitor-html-filesystem-read
  desc: HTML reads app files via Capacitor plugin
  crit: notable
  conf: 0.95
  platforms:
  - unix
  - windows
  - android
  for:
  - html
  if:
    type: text
    exclude_html_comments: true
    regex: \bFilesystem\s*\.\s*(readFile|readDirectory)\s*\(
composite_rules:
- id: read-node
  desc: Reads files with Node.js
  crit: notable
  conf: 0.9
  any:
  - id: read-node-symbol
  - id: read-node-module-bound
- id: file-content-read-operation
  desc: File content read operation
  crit: baseline
  conf: 0.82
  platforms:
  - windows
  - unix
  - macos
  for:
  - scripts
  - source
  - binaries
  any:
  - id: micro-behaviors/fs/read/file/handle
  - id: micro-behaviors/fs/read/file/descriptor
  - id: micro-behaviors/fs/read/file/partial
  - id: micro-behaviors/fs/read/file/target
  - id: micro-behaviors/fs/read/file/credential
  - id: micro-behaviors/fs/read/file/browser
  - id: micro-behaviors/fs/read/file/network-config
  - id: micro-behaviors/fs/read/file/private-key
  - id: micro-behaviors/fs/read/file/account
  - id: micro-behaviors/fs/read/stream
  - id: read-node
  - id: readfilesync-call
  - id: node-bracket-read-file-sync
  - id: readfilesync-name-literal
  - id: read-text-utf8
  - id: os-readfile
  - id: ioutil-readfile
  - id: file-read-content
  - id: python-pathlib-read-text
  - id: python-pathlib-read-bytes
  - id: ruby-file-read-content
  - id: micro-behaviors/fs/read/file/content/bytes::ruby-file-binread-content
  - id: rust-read-to-string
  - id: rust-read-to-end
  - id: rust-fs-read
  - id: get-content
  - id: get-content-raw
  - id: powershell-get-content-command
  - id: read-all-text
  - id: read-all-bytes
  - id: micro-behaviors/fs/read/file/content/characters::dotnet-read-all-text
  - id: dotnet-readalltext-token
  - id: dotnet-readallbytes-token
  - id: dotnet-openread-readexactly
  - id: java-readallbytes
  - id: micro-behaviors/fs/read/file/content/characters::groovy-file-text-read
  - id: file-get-contents
  - id: readfile
  - id: php-show-source
  - id: objc-contents-of-file
  - id: objc-data-with-contents-of-file
  - id: swift-direct-file-read-api
  - id: swift-data-file-read
