defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript

traits:
  - id: node-latin1-file-read
    desc: Node file read decoded as Latin-1
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'readFileSync\(join\(dir, f\)\)[\s\S]{0,100}toString\("latin1"\)'

