defaults:
  for: [python]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: python-cwd-listing-and-binary-open
    desc: Working directory listing near binary open
    if:
      type: text
      regex: '(?s)os\.listdir\(["'']\.["'']\).{0,160}open\(\w+,\s*["'']rb["'']\)'
  - id: python-file-read-accumulator
    desc: Appends a file read to a variable
    if:
      type: text
      regex: '(?m)^\s*\w+\s*\+=\s*\w+\.read\(\s*\)'
