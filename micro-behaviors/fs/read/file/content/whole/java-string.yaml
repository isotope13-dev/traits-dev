defaults:
  platforms: [unix, windows]
  crit: notable
traits:
  - id: java-files-readstring-source
    desc: Java reads a file as text
    for: [java]
    if:
      type: text
      regex: '\bFiles\.readString\s*\('
      exclude_comments: true
  - id: jvm-files-readstring-reference
    desc: JVM Files.readString method reference
    for: [class]
    if:
      type: import
      exact: java/nio/file/Files.readString
