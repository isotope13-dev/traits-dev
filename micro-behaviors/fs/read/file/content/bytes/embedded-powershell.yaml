defaults:
  for: [scripts, source, text, data]
  platforms: [windows, unix]
traits:
  - id: powershell-file-readallbytes
    desc: PowerShell reads a file as bytes
    crit: notable
    conf: 0.95
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '(?i)\[(System\.)?IO\.File\]\s*::\s*ReadAllBytes\s*\('
