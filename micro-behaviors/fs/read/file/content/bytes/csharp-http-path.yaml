# Adjacent declarations bind the HTTP text to the actual local file path.
# Sending the resulting bytes is deliberately not required: it is a read.
defaults:
  platforms: [unix, windows]
  for: [csharp]
  crit: notable
  conf: 0.97
traits:
  - id: csharp-http-response-file-path-read
    desc: Reads local file at HTTP-derived path
    if:
      type: tree-sitter
      query: |-
        ((block
          (local_declaration_statement (variable_declaration
            (variable_declarator name: (identifier) @path
              (await_expression (invocation_expression
                function: (member_access_expression name: (identifier) @get))))))
          .
          (local_declaration_statement (variable_declaration
            (variable_declarator
              (invocation_expression
                function: (member_access_expression) @read
                arguments: (argument_list . (argument (identifier) @used) .))))))
          (#eq? @get "GetStringAsync")
          (#eq? @read "File.ReadAllBytes")
          (#eq? @path @used))
