defaults:
  platforms: [unix]
  for: [package.json]
traits:
  - id: postinstall-cat-ssh-private-key
    desc: Postinstall prints SSH private key to stdout
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.postinstall
      # Do not call a pipe into ssh-keygen a private-key disclosure. This
      # observation requires stdout to remain attached to install output.
      regex: '(^|[;&])\s*cat\s+["'']?(~/|\$\{?HOME\}?/)\.ssh/id_\w+["'']?\s*(2>/dev/null)?\s*($|;|&&|\|\|)'

  - id: preinstall-cat-ssh-private-key
    desc: Preinstall prints SSH private key to stdout
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.preinstall
      regex: '(^|[;&])\s*cat\s+["'']?(~/|\$\{?HOME\}?/)\.ssh/id_\w+["'']?\s*(2>/dev/null)?\s*($|;|&&|\|\|)'

  - id: install-cat-ssh-private-key
    desc: Install hook prints private key to stdout
    crit: notable
    conf: 0.98
    if:
      type: value
      path: scripts.install
      regex: '(^|[;&])\s*cat\s+["'']?(~/|\$\{?HOME\}?/)\.ssh/id_\w+["'']?\s*(2>/dev/null)?\s*($|;|&&|\|\|)'
