# The read half of micro-behaviors/fs/write/stream/adodb.yaml. Loading a file
# through a stream's LoadFromFile method is how classic-ASP and WSH code reads
# binary content back off disk; paired with SaveToFile it is also how a bundled
# archive is unpacked, each member being located inside one blob and written
# back out.
defaults:
  platforms: [windows]
  for: [javascript, vbs, powershell]
  crit: notable
  conf: 0.9

traits:
  - id: stream-load-from-file
    desc: Calls a stream LoadFromFile method
    if:
      type: text
      # JScript calls it with parentheses; VBScript passes the path with no
      # parens (`.LoadFromFile path`), so accept a quote or bare identifier
      # after the required whitespace as well.
      regex: '(?i)\.LoadFromFile\b\s*[("''\w]'
