defaults:
  platforms: [windows]
  for: [text]
  crit: notable
  conf: 0.95

traits:
  - id: one-c-module-source-export
    desc: Exports report module to source file
    if:
      type: text
      case_insensitive: true
      regex: 'Stream2file\(FullName, "MD Programm text", SourceTmp, 1\)'

  - id: one-c-guarded-staged-source-read
    desc: Reads staged source after modification guard
    if:
      type: text
      case_insensitive: true
      regex: 'if Action = "Yes" then\s*SourceText\.Open\(SourceTmp\);'
