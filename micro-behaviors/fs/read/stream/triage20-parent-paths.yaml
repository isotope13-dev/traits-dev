defaults:
  for:
  - vbs
  platforms:
  - windows
  crit: notable
traits:
- desc: LoadFromFile uses parent-relative archive path
  conf: 0.85
  if:
    type: text
    regex: LoadFromFile\s+"\.\.[\\/][^"]{1,80}\.(zip|chm|cab)"
    case_insensitive: true
  id: vbs-loadfromfile-parent-archive-path
- desc: LoadFromFile uses parent-relative document path
  conf: 0.85
  if:
    type: text
    regex: LoadFromFile\s+"\.\.[\\/][^"]{1,80}\.(pdf|doc[xm]?|rtf)"
    case_insensitive: true
  id: vbs-loadfromfile-parent-document-path
- desc: LoadFromFile uses parent-relative image path
  conf: 0.85
  if:
    type: text
    regex: LoadFromFile\s+"\.\.[\\/][^"]{1,80}\.(jpg|png)"
    case_insensitive: true
  id: vbs-loadfromfile-parent-image-path
composite_rules:
- desc: LoadFromFile uses typed parent-relative path
  conf: 0.85
  any:
  - id: micro-behaviors/fs/read/stream::vbs-loadfromfile-parent-archive-path
  - id: micro-behaviors/fs/read/stream::vbs-loadfromfile-parent-document-path
  - id: micro-behaviors/fs/read/stream::vbs-loadfromfile-parent-image-path
  id: vbs-loadfromfile-parent-typed-path
