defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  - id: php-fgets-call
    desc: PHP reads a line from a stream
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: fgets

  - id: php-fpassthru-call
    desc: PHP outputs remaining stream contents
    crit: notable
    conf: 0.97
    mbc: C0051
    if:
      type: symbol
      kind: call
      exact: fpassthru
