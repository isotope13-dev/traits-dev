defaults:
  platforms: [android]
  for: [java]
  crit: notable
  conf: 0.97

traits:
  # Java's call projection retains only openInputStream, losing its receiver.
  # Require the nested resolver call in the AST rather than a method name.
  - id: android-content-resolver-input-stream
    desc: Opens content URI input stream
    if:
      type: tree-sitter
      query: |
        ((method_invocation
          object: (method_invocation
            name: (identifier) @resolver)
          name: (identifier) @open)
          (#eq? @resolver "getContentResolver")
          (#eq? @open "openInputStream"))
