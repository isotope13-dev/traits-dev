defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-find-variable-input
    desc: Batch FIND reads variable-selected file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bfind\s+"+[^"\r\n]{1,40}"+[^<\r\n]{0,20}<\s*%+[A-Za-z0-9_~$]+%?'
    not:
      - regex: '(?i)<\s*%+0\b'
