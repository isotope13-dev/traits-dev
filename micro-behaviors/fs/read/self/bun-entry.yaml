defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: bun-read-main-entry
    desc: Reads current Bun entrypoint as text
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (call_expression
          function: [
            (subscript_expression object: (call_expression
          function: [
            (subscript_expression object: (identifier) @runtime
              index: (string (string_fragment) @method))
            (member_expression object: (identifier) @runtime
              property: (property_identifier) @method)]
          arguments: (arguments . [
            (subscript_expression object: (identifier) @arg
              index: (string (string_fragment) @field))
            (member_expression object: (identifier) @arg
              property: (property_identifier) @field)]))
              index: (string (string_fragment) @reader))
            (member_expression object: (call_expression
          function: [
            (subscript_expression object: (identifier) @runtime
              index: (string (string_fragment) @method))
            (member_expression object: (identifier) @runtime
              property: (property_identifier) @method)]
          arguments: (arguments . [
            (subscript_expression object: (identifier) @arg
              index: (string (string_fragment) @field))
            (member_expression object: (identifier) @arg
              property: (property_identifier) @field)]))
              property: (property_identifier) @reader)]
          (#eq? @runtime "Bun") (#eq? @arg "Bun")
          (#eq? @method "file") (#eq? @field "main")
          (#eq? @reader "text")) @match
