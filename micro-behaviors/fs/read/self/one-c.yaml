defaults:
  platforms: [windows]
  for: [text]
  crit: notable
  conf: 0.95

traits:
  - id: one-c-current-report-path
    desc: Resolves current report path for reading
    if:
      type: text
      case_insensitive: true
      regex: '(?m)^[ \t]*FilePath\(Path, Name\);\s*FullName = Path \+ Name;'

composite_rules:
  - id: one-c-current-report-source-read
    desc: Reads current report module source
    near_lines: 4
    all:
      - id: one-c-current-report-path
      - id: micro-behaviors/fs/read/stream::one-c-module-source-export
