defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: bun-main-source-text-read
    desc: Reads Bun main module as source text
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      kind: call
      regex: 'Bun(\.file|\["file"\])\(Bun(\.main|\["main"\])\)(\.text|\["text"\])\(\)'
