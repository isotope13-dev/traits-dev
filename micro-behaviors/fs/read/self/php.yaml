# PHP Self-Reading Traits
# Detects scripts reading their own source code, a common viral technique.
defaults:
  platforms: [windows, unix]
  for: [php]
traits:
  - id: fopen-self-file
    desc: Opens own source via __FILE__ constant
    crit: notable
    conf: 0.9
    attack: T1005
    if:
      type: text
      regex: "fopen\\s*\\(\\s*__FILE__"

  - id: filesize-self
    desc: Measures own file size via __FILE__
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: "filesize\\s*\\(\\s*__FILE__"

composite_rules:
  - id: self-read-full
    desc: Reads own source code into memory
    crit: suspicious
    conf: 0.92
    attack: T1005
    near_bytes: 500
    all:
      - id: fopen-self-file
    any:
      - id: filesize-self
      - id: micro-behaviors/fs/read/file::fread
    unless:
      - id: well-known/lib/runtime/php-runtime::source-tree
