defaults:
  platforms: [windows, linux, macos]
  for: [go]
traits:
  - id: go-read-own-executable
    desc: Reads bytes from own executable path
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: os.ReadFile
      arg:
        index: 0
        from:
          call: '^os\.Executable$'
