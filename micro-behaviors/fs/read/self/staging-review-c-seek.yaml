defaults:
  platforms: [windows]
  for: [c, cpp]
composite_rules:
  - id: self-read-first-offset-seek-profile
    desc: Self-read and FIRST_OFFSET seek references
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/fs/read/self::commandline-self-read
      - id: micro-behaviors/fs/file/seek::first-offset-fseek-source
    any:
      - id: metadata/lang/source/syntax/comparison::file-number-equals-one-text
      - id: micro-behaviors/fs/file/seek::relative-input-fseek-text
