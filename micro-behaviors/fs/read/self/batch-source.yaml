defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-own-script-source-input
    desc: Batch self-path input argument syntax
    crit: notable
    conf: 0.94
    # COPY/XCOPY and TYPE have different outputs; the shared observation is
    # current-script input, not replication into another program.
    # `%0.bat` and `%0.cmd` are that same input with the extension written out.
    if:
      type: yara
      source: |
        rule batch_own_script_input {
          strings:
            $command = /\b(type|x?copy)(\.exe)?\b(\/[a-z-]{1,4})?([ \t]+\/[a-z-]{1,4}){0,6}[ \t]+["']?/ nocase
            $input = /%(0(\.(bat|cmd))?|~[sf]{1,2}0|~(dp)?nx0|~dp0%~nx0)["']?([ \t+]|$)/ nocase
          condition:
            for any c in (1..#command) : (
              for any a in (1..#input) : (
                @input[a] == @command[c] + !command[c]
              )
            )
        }
  - id: batch-find-current-script-input
    desc: FIND current-script stdin redirection text
    crit: notable
    conf: 0.92
    for: [batch, html]
    if:
      type: text
      regex: '(?i)\bfind\b[^\r\n]{0,80}<%0'
  - id: batch-more-current-script-slice
    desc: Batch slices its own source with MORE
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?im)^\s*@?more\s+\+\d+\s+["'']?%~f0["'']?'


composite_rules:
  - id: batch-own-script-data-input
    desc: Batch own-script input observations
    crit: notable
    conf: 0.94
    for: [batch, html]
    any:
      - id: micro-behaviors/fs/read/self::batch-own-script-source-input
      - id: batch-find-current-script-input
