defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-own-script-source-input
    desc: Batch tool consumes current script
    crit: suspicious
    conf: 0.94
    # COPY/XCOPY and TYPE have different outputs; the shared observation is
    # current-script input, not replication into another program.
    # `%0.bat` and `%0.cmd` are that same input with the extension written out.
    if:
      type: tree-sitter
      language: batch
      query: |
        (cmd
          (command_name) @tool
          (argument_list) @args
          (#match? @tool "(?i)^@?(copy|xcopy|type)(\\.exe)?$")
          (#match? @args "(?i)^\\s*(/[a-z-]+\\s+)*\"?%(~[fdpnxsatz]*)?0(\\.(bat|cmd))?(\"|\\s|$)"))
  - id: batch-find-current-script-input
    desc: FIND current-script stdin redirection text
    crit: suspicious
    conf: 0.92
    if:
      type: text
      regex: '(?i)\bfind\b[^\r\n]{0,80}<%0'


composite_rules:
  - id: batch-own-script-data-input
    desc: Batch own-script input observations
    crit: suspicious
    conf: 0.94
    any:
      - id: micro-behaviors/fs/read/self::batch-own-script-source-input
      - id: batch-find-current-script-input
