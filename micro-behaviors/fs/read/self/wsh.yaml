# Windows Script Host FileSystemObject text I/O. The COM method names are
# matched case-sensitively on purpose: JScript is case-sensitive so the COM
# spelling is the only one that can work, while a case-insensitive match also
# swallows ordinary camelCase JavaScript APIs (`vscode.openTextFile(uri, 1)`,
# an Arrow reader's `readAll()`) that have nothing to do with the filesystem.
defaults:
  crit: notable
  platforms: [windows]
  for: [javascript, vbs]
traits:
- id: open-script-fullname-read
  desc: Opens the WSH script path for reading
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: 'OpenTextFile\s*\(\s*WScript\.ScriptFullName(\s*,\s*1\b|\s*\))'
# Two-step form: `Set f = fso.GetFile(WScript.ScriptFullName)` then later
# `OpenTextFile(boundVar, 1)`. The direct open-text-file matcher cannot see
# across the alias, mirroring the Copy-side near-match in
# micro-behaviors/fs/file/copy/wsh-selfpath.yaml. Case-sensitive on purpose
# (see header): JScript is case-sensitive and a case-insensitive read also
# swallows unrelated camelCase text-file APIs.
- id: script-path-getfile
  desc: Captures own WSH script object
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'GetFile\s*\(\s*WScript\.ScriptFullName\s*\)'
composite_rules:
  - id: open-script-alias-read
    desc: Own script capture near text read
    crit: notable
    conf: 0.9
    near_lines: 30
    all:
      - id: script-path-getfile
      - id: micro-behaviors/fs/read/file/handle::open-text-file-read
  - id: wsh-own-script-read
    desc: WSH script read directly or via capture
    crit: notable
    conf: 0.93
    any:
      - id: open-script-fullname-read
      - id: open-script-alias-read
