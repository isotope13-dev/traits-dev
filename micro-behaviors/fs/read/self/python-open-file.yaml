defaults:
  platforms: [windows, unix]
  for: [python, pyc]
traits:
  - id: python-open-own-file
    desc: Opens its own source via open(__file__
    crit: notable
    if:
      type: text
      substr: open(__file__
  - id: python-open-abspath-own-file
    desc: Opens own file through its absolute path
    crit: notable
    if:
      type: text
      substr: open(os.path.abspath(__file__)
