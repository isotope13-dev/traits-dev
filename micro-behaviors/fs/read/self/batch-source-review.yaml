traits:
- id: embedded-batch-self-read
  desc: Embedded batch reads its own script
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?is)(findstr[^\r\n|]{0,48}%~f0|%~f0.{0,80}ReadAllLines|ReadAllLines.{0,80}%~f0)
  unless:
  - id: metadata/package/testing/
  - id: metadata/path/directory::test-directory-component
  for:
  - scripts
  - source
  - -batch
  platforms:
  - windows
