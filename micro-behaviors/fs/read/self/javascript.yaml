# File Read Operations - JavaScript/Node
# MBC: C0051 (Read File)
# ATT&CK: T1005
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
- id: read-own-source
  desc: Reads its own source file
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'fs\.readFileSync\(\s*(__filename|scriptPath)'
