# File Read Operations - JavaScript/Node
# MBC: C0051 (Read File)
# ATT&CK: T1005
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
# `__filename` proves the read target is the running module's own source. A
# bare `scriptPath` variable does not: installer code reads back generated
# launchers through same-named variables (e.g. twing's `~/.twing/bin`
# hook launcher idempotency check). Those reads stay visible through the
# generic readFileSync traits; only the self-proven form belongs here.
- id: read-own-source
  desc: Reads its own source file
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: 'fs\.readFileSync\(\s*__filename'
