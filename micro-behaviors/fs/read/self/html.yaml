# A page-URL file lookup precedes a bounded Read call. This is proximity
# evidence for a self-prefix read, not general alias/data-flow proof.
defaults:
  crit: notable
  conf: 0.93
  platforms: [windows]
  for: [html]
traits:
  - id: html-own-file-read
    desc: Page file lookup near a prefix read
    if:
      type: text
      regex: '(?s)GetFile\(location\.href.{0,160}OpenTextFile\(.{1,40}\)\.Read\('
