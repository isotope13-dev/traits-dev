defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: recursive-readdir-statsync-walk
    desc: Recurses into statSync directories
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((function_declaration name: (identifier) @walk
          body: (statement_block
            (lexical_declaration
              (variable_declarator name: (identifier) @entries
                value: (call_expression function: (member_expression
                  object: (identifier) @fs property: (property_identifier) @read))))
            (for_in_statement right: (identifier) @entries2
              body: (statement_block
                (lexical_declaration
                  (variable_declarator name: (identifier) @path)
                  (variable_declarator name: (identifier) @stat
                    value: (call_expression function: (member_expression
                      object: (identifier) @fs2 property: (property_identifier) @statmethod)
                      arguments: (arguments . (identifier) @path2 .))))
                (if_statement condition: (parenthesized_expression
                  (call_expression function: (member_expression object: (identifier) @stat2
                    property: (property_identifier) @isdir)))
                  consequence: (statement_block
                    (lexical_declaration (variable_declarator
                      value: (call_expression function: (identifier) @recurse
                        arguments: (arguments . (identifier) @path3))))))))))
          (#eq? @read "readdirSync")
          (#eq? @statmethod "statSync")
          (#eq? @isdir "isDirectory")
          (#eq? @entries @entries2)
          (#eq? @fs @fs2)
          (#eq? @path @path2)
          (#eq? @path @path3)
          (#eq? @stat @stat2)
          (#eq? @walk @recurse))
