# Windows cacls/icacls grant-permission patterns.
defaults:
  platforms: [windows]
  for: [scripts, binaries, asp, aspx]
  size_min: 100
  size_max: 100000000
  attack: T1222.001
traits:
  - id: cacls-grant-everyone-full
    desc: Grant Everyone Full Control via cacls
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bcacls\b[^\n]{0,200}/G\s+Everyone:F'
  - id: icacls-grant-everyone-full-shell
    desc: Shell invokes icacls Everyone grant
    crit: suspicious
    conf: 0.95
    for: [shell, batch, powershell]
    platforms: [windows, unix]
    if:
      type: text
      regex: '(?i)(^|[;&|]\s*)icacls\b[^\r\n]{0,200}/grant\s+Everyone:F'
  - id: icacls-grant-everyone-full
    desc: Node invokes icacls Everyone grant
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)(exec|spawn|execSync)\s*\([^)]{0,200}icacls[^)]{0,200}/grant\s+Everyone:F'

  # /grant:r replaces explicit grants for the named principal. It does not
  # remove other principals or change inheritance on its own.
  - id: icacls-grant-replace-admins-system
    desc: icacls replaces explicit admin or SYSTEM grants
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bicacls\b[^\r\n]{0,120}/grant:r\s+"?(Administrators|SYSTEM|\*S-1-5-32-544)\b'
  # S-1-1-0 is the well-known World (Everyone) SID; prefixing it with `*` in
  # icacls grants Full Control regardless of the OS display language.
  - id: icacls-grant-everyone-sid-full
    desc: Grants Everyone SID Full Control via icacls
    crit: notable
    conf: 0.96
    for: [scripts, binaries, go, c, cpp, csharp, rust]
    if:
      type: text
      regex: '(?i)\*S-1-1-0:(\([A-Z,]{1,12}\)){0,3}F\b'
    unless:
      - id: objectives/command-and-control/channel/proxy::hosts-command-permission-policy
