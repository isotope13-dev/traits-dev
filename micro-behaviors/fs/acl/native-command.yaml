defaults:
  platforms: [windows]
  for: [pe]

traits:
  # A command reference, including copies inside an embedded executable.
  # Granting permissions does not identify WannaCry or prove invocation.
  - id: icacls-current-directory-recursive-everyone-grant
    desc: Recursive dot-directory icacls Everyone grant
    crit: notable
    conf: 0.95
    attack: T1222.001
    if:
      type: text
      regex: '(?i)\bicacls\s+\.\s+/grant\s+Everyone:F\s+/T\b'
