---
defaults:
  for:
  - powershell
  platforms:
  - windows
traits:
- id: powershell-set-acl-literal-path
  desc: PowerShell Set-Acl literal path command
  crit: notable
  conf: 0.95
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: "(?i)Set-Acl\\s+-LiteralPath\\s+\\$path\\s+-AclObject\\s+\\$acl"
