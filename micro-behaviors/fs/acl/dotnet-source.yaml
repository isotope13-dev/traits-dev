# Text matching also covers UTF-16 JScript.NET snippets, whose typed syntax
# is not reliably projected into JavaScript call facts.
defaults:
  platforms: [windows]
  for: [csharp, javascript, aspx, powershell]
  crit: notable
  conf: 0.95

traits:
  - id: dotnet-directory-get-access-control
    desc: DirectoryInfo with ACL descriptor read
    if:
      type: text
      exclude_html_comments: true
      regex: '(?s)DirectoryInfo.{0,220}\.GetAccessControl\s*\('

  - id: dotnet-filesystem-rule-apply
    desc: Filesystem access rule with ACL apply call
    if:
      type: text
      exclude_html_comments: true
      regex: '(?s)FileSystemAccessRule.{0,300}\.SetAccessControl\s*\('

  - id: dotnet-filesystem-access-rule-constructor
    desc: Constructs a filesystem access-control rule
    if:
      type: text
      exclude_html_comments: true
      regex: '\bnew\s+(System\.Security\.AccessControl\.)?FileSystemAccessRule\s*\('

  - id: dotnet-filesystem-fullcontrol-rights
    desc: Specifies filesystem FullControl access rights
    if:
      type: text
      exclude_html_comments: true
      regex: '\bFileSystemRights\.FullControl\b'
