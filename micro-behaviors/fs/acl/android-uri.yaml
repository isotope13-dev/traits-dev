defaults:
  platforms: [android]
  for: [java, kotlin, javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: android-grant-uri-permission-call
    desc: Grants package access to content URI
    if:
      type: symbol
      kind: call
      regex: '(^|\.)grantUriPermission$'

  - id: android-take-persistable-uri-permission-call
    desc: Retains content URI access across restarts
    if:
      type: symbol
      kind: call
      regex: '(^|\.)takePersistableUriPermission$'
