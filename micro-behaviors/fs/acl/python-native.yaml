defaults:
  platforms:
  - windows
  - macos
  for:
  - python
traits:
- id: python-getnamedsecurityinfo-call
  desc: Python reads named file security descriptors
  crit: notable
  conf: 0.97
  if:
    type: symbol
    kind: call
    regex: (^|\.)GetNamedSecurityInfo[AW]$
- id: python-setnamedsecurityinfo-call
  desc: Python writes named file security descriptors
  crit: notable
  conf: 0.97
  if:
    type: symbol
    kind: call
    regex: (^|\.)SetNamedSecurityInfo[AW]$
- id: python-acl-get-fd-call
  desc: Python reads a file-descriptor ACL
  crit: notable
  conf: 0.97
  if:
    type: symbol
    kind: call
    regex: (^|\.)acl_get_fd_np$
- id: python-acl-set-fd-call
  desc: Python writes a file-descriptor ACL
  crit: notable
  conf: 0.97
  if:
    type: symbol
    kind: call
    regex: (^|\.)acl_set_fd_np$
