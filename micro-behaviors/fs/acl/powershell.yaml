defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-deny-fullcontrol-acl
    desc: PowerShell denies full control through ACL
    crit: suspicious
    conf: 0.98
    attack: T1222.001
    if:
      type: text
      regex: 'RegistryAccessRule[\s\S]{0,300}["'']FullControl["''][\s\S]{0,220}["'']Deny["'']'

