defaults:
  platforms: [windows]
  for: [powershell, batch]
  crit: notable
  conf: 0.95

traits:
  - id: icacls-grant-command
    desc: icacls command grants file access
    if:
      type: text
      regex: '(?im)^\s*@?icacls(\.exe)?[ \t]+[^\r\n]{1,160}/grant(:r)?[ \t]+'

  - id: icacls-inheritance-command
    desc: icacls command changes ACL inheritance
    if:
      type: text
      regex: '(?im)^\s*@?icacls(\.exe)?[ \t]+[^\r\n]{1,160}/inheritance:[edr]\b'
