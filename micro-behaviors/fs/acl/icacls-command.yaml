defaults:
  platforms: [windows]
  for: [powershell, batch]
  crit: notable
  conf: 0.95

traits:
  - id: icacls-grant-command
    desc: icacls command grants file access
    if:
      type: text
      regex: '(?im)^\s*@?icacls(\.exe)?[ \t]+[^\r\n]{1,160}/grant(:r)?[ \t]+'

  - id: icacls-inheritance-command
    desc: icacls command changes ACL inheritance
    if:
      type: text
      regex: '(?im)^\s*@?icacls(\.exe)?[ \t]+[^\r\n]{1,160}/inheritance:[edr]\b'

composite_rules:
  - id: hosts-file-takeown-acl-grant
    desc: Takes ownership of hosts file and grants ACL access
    crit: suspicious
    conf: 0.94
    for: [scripts, binaries]
    near_bytes: 2048
    all:
      - id: micro-behaviors/fs/path/config/system::hosts-file-path
      - id: micro-behaviors/fs/chown::takeown-file-command
      - id: icacls-grant-command
