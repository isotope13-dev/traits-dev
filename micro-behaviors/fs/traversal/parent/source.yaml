# A `..\` string literal in source. This is the path token only — it says
# nothing about whether the code ever changes directory, so it is a fragment,
# not a behavior. It was previously `parent-directory-switch` ("Switches into
# parent directory") in objectives/impact/infect/binary/source/, which claimed
# file-infector propagation for any Windows path-handling code that builds a
# relative path; libuv's test-fs.c fires it from its path unit tests. The
# infector composite there still requires it alongside root-directory-switch
# (which does match a real chdir call) and the copy-to-sysdir leg.
defaults:
  platforms: [windows]
  for: [c, cpp]
traits:
  - id: windows-parent-path-literal
    desc: Windows parent-directory path literal
    crit: component
    conf: 0.9
    if:
      type: string_literal
      exact: "..\\\\"
