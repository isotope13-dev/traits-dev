defaults:
  platforms: [windows]
  for: [lnk]
traits:
  # A deep relative target is a path-shape observation, not evidence that the
  # shortcut is a dropper. MSI-advertised application shortcuts commonly use
  # this form to resolve from a Start Menu directory back to Windows\Installer.
  # Objective rules add a staged directory or masqueraded payload before
  # inferring attacker intent.
  - id: lnk-relative-deep-parent-chain
    desc: LNK relative path uses deep traversal
    crit: notable
    conf: 0.95
    if:
      type: value
      path: lnk.relative_path
      regex: '(\.\.[\\/]){4,}'
  - id: utf16-drive-root-dll
    desc: UTF-16 volume-root dll.dll path
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: "43 00 3A 00 5C 00 64 00 6C 00 6C 00 2E 00 64 00 6C 00 6C 00"
