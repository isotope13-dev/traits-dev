defaults:
  platforms: [windows]
  for: [lnk]
traits:
  - id: lnk-utf16-relative-parent-chain
    desc: LNK contains UTF-16 parent traversal
    crit: component
    conf: 0.8
    if:
      type: hex
      pattern: "2E 00 2E 00 5C 00 2E 00 2E 00 5C 00"
  - id: utf16-drive-root-dll
    desc: UTF-16 volume-root dll.dll path
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: "43 00 3A 00 5C 00 64 00 6C 00 6C 00 2E 00 64 00 6C 00 6C 00"
