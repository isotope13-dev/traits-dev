# Drive-letter enumeration expressed in JavaScript/TypeScript source.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  crit: notable

traits:
  # The `C..Z` drive-letter alphabet used to iterate every mounted Windows
  # volume (`for (const c of "CDEFGHIJKLMNOPQRSTUVWXYZ") ...`). A neutral
  # filesystem-discovery capability: cross-platform Node libraries and installers
  # probe drive letters, so this locates the enumeration rather than convicting
  # it. Composites that care about the target (a stealer walking every drive, a
  # backdoor resolving a Windows SSH home) supply the intent.
  - id: js-windows-drive-enumeration
    desc: Windows drive-letter enumeration string
    conf: 0.9
    # A base64/base32 alphabet table contains C..Z as part of a longer A..Z
    # run; that is an encoding table, not drive enumeration.
    not:
      - regex: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'
    if:
      type: text
      substr: CDEFGHIJKLMNOPQRSTUVWXYZ
