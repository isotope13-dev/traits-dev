defaults:
  platforms: [windows]
  for: [batch]
  attack: T1083
  mbc: E1083

traits:
  # A literal run of ten or more single drive letters (`A;C;D;E;...`,
  # `(c d e f g ...)`) feeding a FOR loop or a set variable: the script means
  # to visit every volume rather than one it knows about.
  - id: batch-drive-letter-list
    desc: Batch lists ten or more drive letters
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)[=(]\s*[a-z]:?([\s,;]+[a-z]:?){9,}\s*(\)|$)'
