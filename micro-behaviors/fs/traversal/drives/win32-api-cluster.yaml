defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: win32-drive-file-timestamp-api-cluster
    desc: Drive, file write, and timestamp API cluster
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/fs/traversal/drives::get-logical-drives-text
      - id: micro-behaviors/fs/enumerate/directory::find-file-walker-wide-ex
      - id: micro-behaviors/fs/file/timestamp::set-file-time
      - id: micro-behaviors/fs/write/file/handle::write-file
