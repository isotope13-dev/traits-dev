defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1041

traits:
# Was `node-home-scan-paths`, whose alternation led with a bare `os.homedir()`.
# Per RULES those branches are not variants of one signal: drive-letter walking is
# stealer-specific, but `os.homedir()` is how essentially every Node CLI and daemon
# resolves its OWN config/state directory. A five-line program that does nothing but
# `path.join(os.homedir(), ".mytool")` and write a config file was reporting
# "Node scans user home or Windows drives" from exfiltration/stealer/file. Dropped
# that branch and named the trait for what remains. The neutral capability belongs to
# micro-behaviors/process/user/query::os-homedir-call (note that one is `type: symbol`
# and did NOT fire on the same file, so the stealer-flavoured text match was the only
# thing being reported -- backwards).
# Recall cost is nil: the single consumer, the hostile node-sensitive-files-formdata-exfil,
# takes its intent from the `all:` legs (FormData file-stream field + axios FormData
# POST + sensitive-document extension set) and keeps fs-readdir and
# node-recursive-dirent-walk as `any:` alternatives, which any directory-walking file
# stealer trips.
- id: node-windows-drive-enumeration
  desc: Enumerates Windows drive letters
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: "getWindowsDrives\\(|String\\.fromCharCode\\(code\\).{0,80}:\\\\\\\\"
