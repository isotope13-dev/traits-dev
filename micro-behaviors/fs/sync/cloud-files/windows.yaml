# Windows Cloud Files API observations. A sync root and its hydration
# callbacks are normal provider capabilities; the privilege-escalation
# objective combines them with Defender scan-path redirection and NT object
# manager aliases.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust]
  crit: notable
  conf: 0.93

traits:
  - id: sync-root-registration-api
    desc: Registers a Windows Cloud Files sync root
    if:
      type: text
      word: CfRegisterSyncRoot

  - id: sync-root-connection-api
    desc: Connects a Windows Cloud Files sync root
    if:
      type: text
      word: CfConnectSyncRoot

  - id: cloud-placeholder-creation-api
    desc: Creates Windows Cloud Files placeholders
    if:
      type: text
      word: CfCreatePlaceholders

  - id: cloud-transfer-key-api
    desc: Obtains a Cloud Files transfer key
    if:
      type: text
      word: CfGetTransferKey

  - id: cloud-provider-operation-api
    desc: Executes a Cloud Files provider operation
    if:
      type: text
      word: CfExecute

  - id: cloud-placeholder-hydration-api
    desc: Hydrates a Windows Cloud Files placeholder
    if:
      type: text
      word: CfHydratePlaceholder

composite_rules:
  - id: sync-root-provider-hydration
    desc: Implements a Cloud Files sync-root provider
    crit: notable
    conf: 0.96
    all:
      - id: sync-root-registration-api
      - id: sync-root-connection-api
    any:
      - id: cloud-placeholder-creation-api
      - id: cloud-transfer-key-api
      - id: cloud-provider-operation-api
      - id: cloud-placeholder-hydration-api
