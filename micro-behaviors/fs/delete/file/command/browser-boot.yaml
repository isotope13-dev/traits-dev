defaults:
  platforms: [windows]
  for: [html, javascript]
traits:
  - id: script-run-boot-file-delete
    desc: Run command deletes Windows boot executables
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(?i)\.run\s*\(\s*["'']command\s+/c\s+del\s+c:\\{1,8}(command\.com|windows\\{1,8}win\.com)'
