defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: comspec-process-delete-api-cluster
  desc: COMSPEC delete text and process/path APIs
  crit: notable
  conf: 0.94
  all:
    - id: micro-behaviors/os/env/user-paths::comspec-env-var
    - id: micro-behaviors/fs/delete/file/command::slash-c-del-fragment
    - id: micro-behaviors/fs/path/check::get-short-path-name
    - id: micro-behaviors/process/create/spawn::create-process-a
  any:
    - id: micro-behaviors/process/info/current::get-module-filename
    - id: micro-behaviors/os/module/load::get-module-filename-ansi
