defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  crit: notable
  conf: 0.96
  mbc: C0047

traits:
  - id: applescript-temp-zip-removal
    desc: AppleScript command removes a temporary ZIP
    if:
      type: text
      regex: 'do shell script \\?"rm\s+/(var/)?tmp/[^"\r\n]{1,80}\.zip'
