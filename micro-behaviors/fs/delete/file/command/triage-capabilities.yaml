traits:
- platforms:
  - unix
  for:
  - c
  - cpp
  - scripts
  - binaries
  id: hidden-tmp-rm-command
  desc: rm command targets a hidden temporary path
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: \brm\s+-[rf]{1,2}\s.{0,60}/tmp/\.
  unless:
  - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-native-runtime
