defaults:
  for: [vbs]
  platforms: [windows]
  crit: notable
  conf: 0.85
traits:
  - id: vb6-kill-file-source
    desc: VB6 Kill file deletion statement
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bKill\s+\w+'

  - id: vba-kill-file
    desc: VBA Kill file deletion
    if:
      type: string_literal
      regex: (?i)\bKill\s
