defaults:
  for: [powershell, batch, pe, lua]
  platforms: [windows]
traits:
- id: powershell-force-remove-variable-path
  desc: PowerShell force-removes a variable path
  crit: notable
  conf: 0.85
  if:
    type: text
    # -Path is Remove-Item's default positional parameter and is routinely
    # omitted (`Remove-Item $file -Force`), not just spelled out.
    regex: '(?i)Remove-Item\s+(-Path\s+)?\$[A-Za-z_][A-Za-z0-9_]*\s+-Force'
