defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: rm-c-source-file
    desc: Removes a C source file with rm
    crit: notable
    conf: 0.9
    for: [shell, makefile, text]
    if:
      type: text
      regex: '\brm\s+-[rf]{1,2}\s+[\w./-]{1,40}\.c\b'
    unless:
      - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-source-path
      - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree

  - id: sudoers-path-removal
    desc: Removes a sudoers-related path
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: rm
      arg:
        kind: string
        substr: SUDOERS
