defaults:
  platforms: [unix]
  for: [shell]
traits:
  - id: rm-python-script
    desc: Removes a Python script with rm
    crit: notable
    conf: 0.95
    for: [shell, makefile, markdown, text]
    if:
      type: text
      regex: '(?im)^\s*(\$\s*)?rm\s+(-[rf]+\s+)?[^\r\n;&]{1,80}\.py\b'

  - id: rm-c-source-file
    desc: Removes a C source file with rm
    crit: notable
    conf: 0.9
    for: [shell, makefile, text]
    if:
      type: text
      regex: '\brm\s+-[rf]{1,2}\s+[\w./-]{1,40}\.c([\s;&|)]|$)'
    unless:
      - id: well-known/tool/development/toolchain/go-toolchain::go-toolchain-source-path
  - id: sudoers-path-removal
    desc: Removes a sudoers-related path
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: rm
      arg:
        kind: string
        substr: SUDOERS

  - id: native-shell-rm-force
    desc: Native code runs rm -f via shell
    crit: notable
    conf: 0.9
    for: [c, cpp, objc, elf, macho]
    if:
      type: text
      regex: '(?i)\b(system|popen|exec)\s*\([^;\n]{0,160}\brm\s+-f\b'

  - id: shell-rm-wildcard-then-script
    desc: rm removes wildcard files and script
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)\brm[ \t][^\n;&|]{0,120}\*[^\n;&|]{0,120}[ \t][\w.-]{1,60}\.sh([ \t;&|]|$)'

  - id: shell-rm-script-then-wildcard
    desc: rm removes script and wildcard files
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?m)\brm[ \t]+([^\n;&|]{0,120}[ \t])?[\w.-]{1,60}\.sh[ \t][^\n;&|]{0,120}\*'

