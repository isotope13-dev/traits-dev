defaults:
  platforms: [windows]
  for: [vbs, batch, powershell, html]
  crit: notable
traits:
  - id: batch-deltree-tree-delete
    desc: Batch deletes a directory tree through DELTREE
    conf: 0.95
    for: [batch]
    if:
      type: text
      regex: '(?i)\bdeltree(\.exe)?\s+([/-]y\s+)?[a-z]:\\[^\s\r\n]{1,64}'
  - id: cmd-del-command
    desc: Runs file deletion through cmd.exe
    conf: 0.95
    for: [vbs, batch, powershell, html, python, asp]
    if:
      type: text
      regex: '(?i)\bcmd(\.exe)?\s+/c\s+del\b'
  # Command text attempts to remove the download marker. Legitimate file
  # unblocking uses the same operation; concealment requires separate evidence.
  - id: cmd-deletes-zone-identifier-stream
    desc: del command targets Zone.Identifier stream
    conf: 0.96
    attack: T1553.005
    for: [vbs, batch, powershell, html, javascript]
    if:
      type: text
      regex: '(?i)\bdel\b[^\r\n]{0,80}:Zone\.Identifier\b'
