defaults:
  platforms: [windows]
traits:
  - id: choice-delayed-file-delete-command
    desc: Choice delay followed by file deletion
    crit: notable
    conf: 0.95
    for: [c, cpp, pe, dll]
    if:
      type: text
      # The `choice` executable name is optional: some droppers launch cmd with
      # the choice switches alone (`cmd.exe /C Y /N /D Y /T 1 & Del`).
      regex: '(?i)(choice\s+)?/c\s+\w\s+/n\s+/d\s+\w\s+/t\s+\d+\s*&\s*del\b'

