defaults:
  platforms:
  - windows
  crit: notable
  conf: 0.94
traits:
- id: powershell-force-remove-file-path-text
  desc: Remove-Item force targets a file-shaped path
  for:
  - powershell
  - batch
  if:
    type: text
    regex: (?i)Remove-Item\b[^\r\n]{0,60}\.[a-z0-9]{1,8}[^\r\n]{0,40}-Force\b
  not:
  - regex: (?i)(HK(CU|LM):|HKEY_|Registry::)
- id: powershell-force-remove-bound-file-path
  desc: Forced Remove-Item with file-path binding
  for:
  - powershell
  if:
    type: tree-sitter
    query: |
      (statement_list
        (pipeline (assignment_expression
          (left_assignment_expression) @binding
          value: (pipeline) @path))
        . (pipeline)* @between
        . (pipeline (pipeline_chain (command
          command_name: (command_name) @operation
          command_elements: (command_elements
            (command_parameter) @parameter
            . (command_argument_sep)
            . (array_literal_expression (unary_expression (variable) @target))
            (command_parameter) @force))))
        (#match? @force "(?i)^-Force$")
        (#not-match? @between "(?m)^\\s*\\$[A-Za-z_]\\w*\\s*=")
        (#eq? @binding @target)
        (#match? @path "(?i)^['\"][A-Z]:\\\\[^\r\n]+\\.[a-z0-9]{1,8}['\"]$")
        (#match? @parameter "(?i)^-Path$")
        (#match? @operation "(?i)^Remove-Item$"))

      (statement_list
        (pipeline (assignment_expression
          (left_assignment_expression) @binding
          value: (pipeline) @path))
        . (pipeline)* @between
        . (pipeline (pipeline_chain (command
          command_name: (command_name) @operation
          command_elements: (command_elements
            . (command_argument_sep)
            . (array_literal_expression (unary_expression (variable) @target))
            (command_parameter) @force))))
        (#match? @force "(?i)^-Force$")
        (#not-match? @between "(?m)^\\s*\\$[A-Za-z_]\\w*\\s*=")
        (#eq? @binding @target)
        (#match? @path "(?i)^['\"][A-Z]:\\\\[^\r\n]+\\.[a-z0-9]{1,8}['\"]$")
        (#match? @operation "(?i)^Remove-Item$"))
