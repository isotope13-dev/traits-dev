defaults:
  platforms: [windows]
  for: [pe]
traits:
  - id: force-delete-string
    desc: Force Delete phrase
    crit: notable
    conf: 0.8
    size_max: 10485760
    if:
      type: text
      substr: Force Delete
    unless:
      - id: metadata/binary/layout/size::massive-executable
      - id: well-known/app/system/iobit::iobit-component-context
