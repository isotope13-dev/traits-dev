# Match a command argument, rather than a quoted example or an unrelated
# function name. Windows accepts repeated path separators in this command.
defaults:
  platforms: [windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: node-system32-dll-glob-delete-call
    desc: Exec call deletes Windows System32 DLL glob
    if:
      type: symbol
      kind: call
      regex: '^(exec|execSync)$'
      arg:
        index: 0
        kind: string
        regex: '(?i)^del\s+(/[fsq]\s+){1,3}[a-z]:\\+windows\\+system32\\+\*\.dll$'
