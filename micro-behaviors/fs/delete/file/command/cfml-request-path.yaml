defaults:
  platforms:
  - unix
  - windows
  for:
  - cfml
  crit: notable
  conf: 0.95
traits:
- id: cffile-request-delete-path
  desc: Request supplies file deletion path
  if:
    type: symbol
    kind: call
    exact: cffile
    args:
    - index: 0
      from:
        field: action
        whole_value: (?i)^delete$
    - index: 0
      from:
        field: file
        member: ^(form|url)\.
