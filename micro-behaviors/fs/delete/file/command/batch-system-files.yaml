defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: batch-delete-system-driver-archive
  desc: Deletes the Windows driver cabinet archive
  crit: notable
  conf: 0.98
  if:
    type: yara
    source: |
      rule batch_driver_archive_delete {
        strings:
          $delete = /(^|[\r\n])[ \t]*(del|erase)[ \t]+"?(%systemroot%|%windir%|[a-z]:\\Windows)\\Driver Cache\\i386\\driver\.cab"?([ \t\r\n]|$)/ nocase
        condition:
          $delete
      }
- id: batch-delete-device-manager-console
  desc: Deletes the Windows Device Manager console
  crit: notable
  conf: 0.98
  if:
    type: yara
    source: |
      rule batch_device_manager_delete {
        strings:
          $delete = /(^|[\r\n])[ \t]*(del|erase)[ \t]+"?(%systemroot%|%windir%|[a-z]:\\Windows)\\system32\\devmgmt\.msc"?([ \t\r\n]|$)/ nocase
        condition:
          $delete
      }
