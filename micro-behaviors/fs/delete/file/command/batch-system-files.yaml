defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: batch-delete-system-driver-archive
  desc: Deletes the Windows driver cabinet archive
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    language: batch
    query: |
      (cmd (command_name) @tool (argument_list) @args
        (#match? @tool "(?i)^(del|erase)$")
        (#match? @args "(?i)^\\s*\"?(%systemroot%|%windir%|[a-z]:\\\\Windows)\\\\Driver Cache\\\\i386\\\\driver\\.cab\"?($|\\s)"))
- id: batch-delete-device-manager-console
  desc: Deletes the Windows Device Manager console
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    language: batch
    query: |
      (cmd (command_name) @tool (argument_list) @args
        (#match? @tool "(?i)^(del|erase)$")
        (#match? @args "(?i)^\\s*\"?(%systemroot%|%windir%|[a-z]:\\\\Windows)\\\\system32\\\\devmgmt\\.msc\"?($|\\s)"))
