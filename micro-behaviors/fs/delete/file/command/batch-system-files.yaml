defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: batch-delete-system-driver-archive-systemroot-del
  desc: Deletes the Windows driver cabinet archive
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (^|[\r\n])[ \t]*del[ \t]+"?%systemroot%\\Driver Cache\\i386\\driver\.cab"?([
      \t\r\n]|$)
    case_insensitive: true
- id: batch-delete-system-driver-archive-systemroot-erase
  desc: Deletes the Windows driver cabinet archive
