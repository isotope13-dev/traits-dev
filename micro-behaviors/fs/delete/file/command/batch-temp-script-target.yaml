defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: batch-deletes-temp-bat
  desc: Batch deletes a temporary BAT script
  crit: suspicious
  conf: 0.9
  if:
    type: tree-sitter
    language: batch
    query: "(cmd (command_name) @tool\n  (argument_list [(string) (argument_value)] @target)\n  (#match? @tool \"(?i)^(del|erase)$\")\n  (#match? @target \"(?i)\\\\\\\\temp\\\\\\\\+[a-z0-9_.-]+\\\\.bat\\\"?$\"))"
