defaults:
  platforms:
  - windows
  for:
  - batch
  crit: notable
traits:
- id: batch-del-force-quiet-options
  desc: Batch requests forced quiet file deletion
  conf: 0.9
  if:
    type: tree-sitter
    language: batch
    query: "(cmd (command_name) @tool\n  [(argument_list (command_option) @force (command_option) @quiet)\n   (argument_list (command_option) @quiet (command_option) @force)]\n  (#match? @tool \"(?i)^(del|erase)$\")\n  (#match? @force \"(?i)^/f$\")\n  (#match? @quiet \"(?i)^/q$\"))"
  unless:
  - id: well-known/tool/development/vscode-extension/zephyr-ide::winget-install-script-path
  - id: well-known/tool/development/vscode-extension/zephyr-ide::zephyr-refresh-env-cmd
