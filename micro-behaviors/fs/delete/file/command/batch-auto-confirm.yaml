defaults:
  platforms: [windows]
  for: [batch]


composite_rules:
  - id: batch-wildcard-delete-confirmation-profile
    desc: Wildcard deletion with automatic yes input references
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/shell/pipeline::batch-echo-y-pipe
      - id: micro-behaviors/fs/delete/file/command::batch-del-star-glob

  # Quiet wildcard deletion alone also describes ordinary temporary/build
  # cleanup. Its full observation remains in fs/delete/file/command's
  # batch-del-star-nul; output redirection adds no destructive intent.
