defaults:
  platforms: [windows]
  for: [batch]
  crit: notable

traits:
  - id: batch-del-wildcard-target
    desc: Batch DEL with wildcard target
    conf: 0.88
    if:
      type: text
      regex: '(?im)^\s*(del|erase)\b[^\r\n]{0,60}\*\.(\*|\w{1,4})'
  - id: batch-del-all-wildcard
    desc: Batch DEL with all-files wildcard target
    conf: 0.91
    if:
      type: text
      regex: '(?im)^\s*(del|erase)\b[^\r\n]{0,60}\\\*\.\*'
