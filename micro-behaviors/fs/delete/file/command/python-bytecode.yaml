# Co-occurrence supports a detached cleanup capability, not a proven
# self-path target. Keep the observable mechanics in the neutral tier.
defaults:
  platforms: [windows]
  for: [pyc]
composite_rules:
  - id: pyc-detached-ping-delete-argv
    desc: Bytecode groups detached deletion and argv
    crit: suspicious
    conf: 0.9
    near_bytes: 768
    all:
      - id: micro-behaviors/fs/delete/file/command::embedded-ping-delete-command
      - id: micro-behaviors/process/daemonize/detach::pyc-detached-process-flag
      - id: micro-behaviors/process/argument/positional::pyc-argv-name
