# `<cffile action="delete">` / `<cfdirectory action="delete">` — the ColdFusion
# spelling of unlink/rmdir. FileFacts identifies ColdFusion pages as `cfml`.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.88
traits:
  - id: cffile-delete
    desc: ColdFusion cffile deletes a file
    if:
      type: text
      regex: '<\s*cffile\s+action\s*=\s*["'']?delete'
      case_insensitive: true
