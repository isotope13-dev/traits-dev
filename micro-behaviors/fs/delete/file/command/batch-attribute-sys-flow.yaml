defaults:
  for: [batch]
  platforms: [windows]
traits:
  - id: batch-entry-sys-delete-attribute-console-flow
    desc: Batch unprotects SYS glob before console mute
    crit: notable
    conf: 0.98
    # Parsed source-entry sequence with common current-directory scope.
    # SYS extension is not proof of installed system-file identity.
    if:
      type: tree-sitter
      language: batch
      query: |
        (program
          . (comment)*
          . (echo_off)?
          . (comment)*
          . [(cmd (command_name) @attrib (argument_list) @options)
             (redirect_stmt (cmd (command_name) @attrib (argument_list) @options))]
          . (comment)*
          . [(cmd (command_name) @del (argument_list) @glob)
             (redirect_stmt (cmd (command_name) @del (argument_list) @glob))]
          . (comment)*
          . [(cmd (command_name) @second)
             (redirect_stmt (cmd (command_name) @second))]?
          . (comment)*
          . (cmd (command_name) @ctty (argument_list) @console)
          (#match? @attrib "(?i)^attrib(\\.exe)?$")
          (#match? @options "(?i)^\\s*(-[hrs]\\s*){3}$")
          (#match? @options "(?i)-h\\b")
          (#match? @options "(?i)-r\\b")
          (#match? @options "(?i)-s\\b")
          (#match? @del "(?i)^(del|erase)$")
          (#match? @glob "(?i)^\\*\\.sys\\s*$")
          (#match? @second "(?i)^(del|erase)$")
          (#match? @ctty "(?i)^ctty$")
          (#match? @console "(?i)^nul\\s*$"))
