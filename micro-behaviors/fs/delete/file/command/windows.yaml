defaults:
  crit: notable
  platforms: [unix, windows]
traits:
  - id: batch-del-call
    desc: Batch contains DEL or ERASE calls
    conf: 0.85
    for: [batch]
    if:
      type: symbol
      kind: call
      regex: '(?i)^(del|erase)$'
  # The text fallback for batch-del-call above: on any batch file that parses,
  # both fire on the same `del`, so reporting this one too counted one delete
  # twice (Go's run.bat: `del env.bat`). Component keeps it resolving as a
  # composite leg -- five dropper/degrade rules name it directly.
  - id: del-command
    desc: Windows del command deletes files
    crit: component
    conf: 0.7
    for:
      - batch
    if:
      type: text
      regex: del %?[A-Za-z0-9_]+%?(\.exe)?
    unless:
      - type: basename
        exact: build-pty4j-libpty.bat
  - id: batch-del-star-glob
    desc: Batch deletes every file in cwd
    conf: 0.92
    for: [batch]
    if:
      type: text
      regex: '(?i)\bdel\s+\*\.\*'
  - id: batch-del-star-nul
    desc: Batch redirects wildcard deletion to NUL
    conf: 0.93
    for: [batch]
    if:
      type: text
      regex: '(?i)\bdel\s+\*\.\*[^\r\n]{0,20}>\s*nul\b'
    # `##batch-expansion@N` is a scanner-derived command-only view. It omits
    # the original script's working-directory context and is not a second file.
    unless:
      - type: path
        regex: '(?i)##batch-expansion@[0-9]+$'
  - id: batch-del-sys-glob-command-text
    desc: DEL or ERASE SYS-glob command text
    conf: 0.94
    for: [batch]
    if:
      type: text
      regex: '(?i)\b(del|erase)\s+\*\.sys\b'
  - id: batch-del-ini-glob
    desc: Batch deletes all INI files
    conf: 0.9
    for: [batch]
    if:
      type: text
      regex: '(?i)\b(del|erase)\s+\*\.ini\b'
  - id: del-variable-target
    desc: Windows del command with variable target
    conf: 0.9
    for: [batch]
    if:
      type: text
      regex: '(?i)\bdel\b[^\r\n]{0,20}%[A-Za-z0-9_]{3,}%\b'
  - id: cmd-del-force-quiet-text
    desc: Forced quiet DEL command text
    conf: 0.9
    for: [powershell, pe, python, javascript, csharp]
    if:
      type: text
      # /S may precede or separate /F and /Q; Windows accepts either order.
      # Keep the switches on the same command line.
      regex: '(?i)\b(del|erase)[ \t]+(/s[ \t]+)?(/f[ \t]+(/s[ \t]+)?/q|/q[ \t]+(/s[ \t]+)?/f)\b'
    unless:
      - id: well-known/tool/development/vscode-extension/zephyr-ide::winget-install-script-path
      - id: well-known/tool/development/vscode-extension/zephyr-ide::zephyr-refresh-env-cmd
  - id: exec-recursive-del-call
    desc: Exec call requests recursive DEL
    crit: notable
    conf: 0.97
    platforms: [windows]
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '^(exec|execSync)$'
      arg:
        index: 0
        kind: string
        regex: '(?i)^(del|erase)[ \t]+(/[fq][ \t]+){0,2}/s([ \t]|$)'
  - id: quiet-del-command-template
    desc: Quiet Windows del command template
    conf: 0.87
    for:
      - pe
      - c
      - cpp
    if:
      type: text
      exact: 'del "%s" /Q'
  - id: stack-built-del-format-x86
    desc: x86 stack-built ampersand-del format command
    conf: 0.96
    for: [pe, dll]
    platforms: [windows]
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: 'C6 45 ?? 26 C6 45 ?? 64 C6 45 ?? 65 C6 45 ?? 6C C6 45 ?? 20 C6 45 ?? 22 C6 45 ?? 25 C6 45 ?? 73 C6 45 ?? 22'
  - id: powershell-remove-item-script-path
    desc: Remove-Item targets a script path variable
    conf: 0.85
    for:
      - powershell
      - batch
    if:
      type: text
      # The variable's name marks it as the script's own path ($scriptPath,
      # $selfPath, $PSCommandPath). A Remove-Item of some other path
      # variable ($ShortcutPath, $installerPath) is an ordinary deletion
      # in the same script and must not bind to a stored self-path.
      regex: 'Remove-Item[^\n]{0,60}\$\w*(script|self|invocation|command)\w*'
      case_insensitive: true
composite_rules:
  - id: powershell-remove-item-force
    desc: Force-removes a file-shaped filesystem path
    conf: 0.94
    for: [powershell, batch]
    any:
      - id: powershell-force-remove-file-path-text
      - id: powershell-force-remove-bound-file-path
  - id: cmd-del-force-quiet
    desc: Forced quiet DEL command form
    conf: 0.9
    for: [batch, powershell, pe, python, javascript, csharp]
    any:
      - id: batch-del-force-quiet-options
      - id: cmd-del-force-quiet-text
  # Walks *.ps1 files, keeps those containing a fixed string, and removes
  # them: a script deleting other scripts selected by content rather than
  # by name, the way a later stage erases the stage that launched it.
  - id: powershell-delete-scripts-containing-marker
    desc: Deletes scripts that contain a marker string
    conf: 0.9
    for: [powershell]
    platforms: [windows]
    near_lines: 8
    all:
      - id: micro-behaviors/fs/search::powershell-enumerate-ps1-files
      - id: micro-behaviors/fs/search::powershell-select-string-quiet
      - id: powershell-remove-item-force
