# File-deletion capability expressed in an npm package.json script
# (rm -rf / rmdir / unlink). scripts[*] matches any script value, so this is
# generic across all lifecycle and dev scripts, not install-hook specific.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.85
  mbc: C0047
traits:
  - id: npm-script-unlink-file
    desc: Package script declares an unlink command
    if:
      type: value
      path: 'scripts[*]'
      regex: '\bunlink\b'
    unless:
      - type: value
        path: 'scripts[*]'
        regex: 'typescript-lib|typescript/lib'
