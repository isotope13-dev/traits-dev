defaults:
  platforms: [windows]
  for: [batch]

traits:
  # Output suppression does not establish destructive intent. Server startup
  # scripts use this exact command after entering an application temp directory.
  - id: batch-del-star-nul
    desc: DEL all-files wildcard with output suppressed
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bdel\s+\*\.\*[^\r\n]{0,20}>\s*nul\b'
