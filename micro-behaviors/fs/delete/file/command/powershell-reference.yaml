traits:
  - id: powershell-delete-command-literal
    platforms: [unix, windows]
    for: [powershell]
    desc: PowerShell deletion command in a string literal
    crit: notable
    conf: 0.6
    if:
      type: string_literal
      regex: '(^|[;|&\r\n])[ \t]*(Remove-Item|del|ri)[ \t]+[^ \t\r\n]'
      case_insensitive: true
