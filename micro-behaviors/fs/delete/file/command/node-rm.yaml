traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: node-spawn-rm-force
  desc: Node spawns rm with force deletion argument
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: call
    regex: ^(spawnSync|spawn)$
    args:
    - index: 0
      kind: string
      exact: rm
    - index: 1
      from:
        value: ^-f$
