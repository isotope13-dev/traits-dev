# Parameterized cleanup templates, including delayed-expansion targets.
# Neither form alone binds the target to the current executable.
defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: retry-delete-batch-template
    desc: Parameterized batch file-deletion template
    crit: notable
    conf: 0.92
    if:
      type: raw
      regex: '(?i)del\s+("%s"\s*\r?\n\s*if\s+exist\s+"%s"\s+goto\s+\w+|/f/a\s+"!\w{1,20}!")'

composite_rules:
  - id: retry-delete-resource-launch-ip-references
    desc: Delete template, resource, launch and IP refs
    crit: notable
    conf: 0.9
    all:
      - id: retry-delete-batch-template
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/os/handler/open::shell-execute
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
    unless:
      - id: metadata/installer/product/
