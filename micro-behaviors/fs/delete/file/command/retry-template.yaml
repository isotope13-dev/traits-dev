# A parameterized DEL/IF EXIST/GOTO loop. Installer cleanup uses it too.
# No evidence binds %s to the current image, so this is not self-deletion.
defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: retry-delete-batch-template
    desc: Retry-until-gone delete batch template
    crit: notable
    conf: 0.92
    if:
      type: raw
      regex: '(?i)del\s+"%s"\s*\r?\n\s*if\s+exist\s+"%s"\s+goto\s+\w+'

composite_rules:
  - id: retry-delete-resource-launch-ip-references
    desc: Retry-delete with resource, launch and IP refs
    crit: notable
    conf: 0.9
    all:
      - id: retry-delete-batch-template
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
      - id: micro-behaviors/process/create/shellexec::shell-execute
      - id: micro-behaviors/communications/ip/literal::external-ipv4-shaped-text-binary
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
