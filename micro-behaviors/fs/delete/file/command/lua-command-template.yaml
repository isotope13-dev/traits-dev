defaults:
  platforms: [unix, windows]
  for: [lua]
traits:
  - id: lua-format-delete-command
    desc: Formats a chained Windows del command
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: string.format
      arg:
        kind: string
        regex: '(?i)&&\s*del\s+"?%s"?'
