defaults:
  platforms: [windows]
  for: [lnk]
traits:
  - id: lnk-powershell-remove-variable-path
    desc: LNK removes a variable file path
    crit: notable
    conf: 0.96
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)(^|[;\r\n])\s*(rm|Remove-Item)\s+\$[A-Za-z_]\w*\s*;?\s*$'
