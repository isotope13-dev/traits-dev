defaults:
  platforms: [windows]
  for: [batch]

composite_rules:
  - id: batch-desktop-exe-delete-with-existence-check
    desc: Deletes desktop executable with existence branch
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/fs/delete/file/command::batch-deletes-desktop-exe
      - id: micro-behaviors/fs/path/check::batch-if-exist-goto-branch
    any:
      - id: micro-behaviors/fs/delete/file/command::batch-deletes-temp-bat
      - id: micro-behaviors/fs/delete/file/command::del-command
    near_lines: 12

