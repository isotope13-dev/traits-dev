defaults:
  platforms: [windows]
  for: [pe, dll, csharp, batch]
traits:
  - id: embedded-ping-delete-command
    for: [pe, pyc]
    desc: Embedded ping followed by file deletion
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)ping\s+.{0,20}-n\s+\d+.{0,40}del\b'

  - id: windows-ping-delete-fragment
    desc: Ping redirect followed by file deletion
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)ping\s+(1\.1\.1\.1|127\.0\.0\.1).{0,40}>\s*Nul\s*&\s*Del'
  - id: windows-cmd-ping-file-delete
    desc: Cmd ping followed by file deletion
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)/c\s+ping\s+(1\.1\.1\.1|127\.0\.0\.1).{0,60}&\s*Del'

composite_rules:
  - id: windows-ping-file-delete-command
    desc: Windows ping and file-delete command
    crit: notable
    conf: 0.95
    any:
      - id: windows-ping-delete-fragment
      - id: windows-cmd-ping-file-delete
    unless:
      - id: metadata/binary/installer/
      - id: metadata/signed/platform/
