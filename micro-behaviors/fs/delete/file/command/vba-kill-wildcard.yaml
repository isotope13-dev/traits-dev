defaults:
  platforms: [windows]
  for: [vbs, oledoc, ooxml]
  crit: notable
  conf: 0.92
  attack: T1485

traits:
  - id: vba-kill-absolute-wildcard
    desc: VBA Kill deletes all folder files
    if:
      type: text
      regex: '(?i)\bKill\s+"[A-Z]:\\[^"\r\n]{0,100}\*\.\*"'

  - id: vba-kill-wildcard-several-folders
    desc: VBA Kill empties three or more folders
    count_min: 3
    if:
      id: micro-behaviors/fs/delete/file/command::vba-kill-absolute-wildcard
