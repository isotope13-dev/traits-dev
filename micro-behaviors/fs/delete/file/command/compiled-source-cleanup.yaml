# Bind the compiler's input to the removed path. Removal can also be routine
# build cleanup, so this observation alone is not treated as malicious.
defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: shell-remove-compiled-source
    desc: Removes source after setuid binary build
    crit: notable
    conf: 0.94
    if:
      type: tree-sitter
      language: shell
      query: |
        ((compound_statement
          (command name: (command_name) @compiler
            argument: (word) @output_flag . argument: (word) @output .
            argument: (word) @source)
          (command name: (command_name) @chown . argument: (word) @owner .
            argument: (word) @owned)
          (command name: (command_name) @chmod . argument: (word) @mode .
            argument: (word) @permitted)
          (command name: (command_name) @remove . argument: (word) @removed))
          (#match? @compiler "(^|/)(gcc|cc|clang)$")
          (#eq? @output_flag "-o")
          (#eq? @chown "chown")
          (#match? @owner "^(root|0)(:(root|0))?$")
          (#eq? @chmod "chmod")
          (#match? @mode "^([ua]?\\+s|0?4[0-7]{3})$")
          (#match? @remove "(^|/)rm$")
          (#eq? @output @owned)
          (#eq? @output @permitted)
          (#eq? @source @removed))
