defaults:
  platforms: [windows]
  for: [powershell, batch]
traits:
  - id: del-script-file-command-literal
    desc: DEL command literal targets a script file
    crit: notable
    conf: 0.75
    if:
      type: literal
      regex: '\bdel\s+[^\r\n]{0,50}\.(ps1|bat|cmd|vbs)\b'
      case_insensitive: true
