# `<cffile action="delete">` / `<cfdirectory action="delete">` — the ColdFusion
# spelling of unlink/rmdir. See metadata/lang/scripted::cfml-output-tag for the
# carrier file types.
defaults:
  platforms: [unix, windows]
  for: [vbs, html, javascript]
  crit: notable
  conf: 0.88
traits:
  - id: cffile-delete
    desc: ColdFusion cffile deletes a file
    if:
      type: text
      regex: '<\s*cffile\s+action\s*=\s*["'']?delete'
      case_insensitive: true
  - id: cfdirectory-delete
    desc: ColdFusion cfdirectory deletes a directory
    if:
      type: text
      regex: '<\s*cfdirectory\s+action\s*=\s*["'']?delete'
      case_insensitive: true
  - id: cfm-java-file-delete
    desc: ColdFusion Java File object deletion
    if:
      type: text
      regex: 'CreateObject[\s\S]{0,100}java\.io\.File[\s\S]{0,180}delete\s*\('
      case_insensitive: true
