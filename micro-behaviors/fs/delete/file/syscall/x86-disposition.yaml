defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: x86-posix-delete-disposition-setup
    desc: x86 POSIX delete disposition setup
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: .text
      # FileDispositionInformationEx (64), four-byte flags buffer,
      # DELETE | POSIX_SEMANTICS | IGNORE_READONLY_ATTRIBUTE (0x13).
      # The caller supplies the NtSetInformationFile API evidence.
      pattern: '6A 40 6A 04 8D 85 ?? ?? ?? ?? C7 85 ?? ?? ?? ?? 13 00 00 00'
