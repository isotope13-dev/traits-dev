# File Delete Operations
# MBC: C0047 (Delete File)
# ATT&CK: T1070.004
defaults:
  platforms: [linux, macos]
  for: [elf, macho, shell, c, cpp]
traits:
  - id: unlinkat
    desc: Delete files by fd/path
    crit: notable
    conf: 0.3
    if:
      type: symbol
      exact: "unlinkat"
    unless:
      - id: well-known/app/ai/coding-agent/tabby::tabby-basename
      - id: metadata/file/string/identity::python3-interpreter-basename
    downgrade:
      any:
        - id: metadata/lang/compiled/
  - id: io-uring-unlinkat
    desc: Deletes files through io_uring
    crit: notable
    conf: 0.96
    platforms: [linux]
    for: [c, cpp, elf]
    if:
      type: symbol
      exact: io_uring_prep_unlinkat
