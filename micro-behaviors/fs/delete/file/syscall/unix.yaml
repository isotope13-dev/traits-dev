# File Delete Operations
# MBC: C0047 (Delete File)
# ATT&CK: T1070.004
defaults:
  crit: notable
  platforms: [linux, macos]
  for: [elf, macho, shell, c, cpp]
traits:
  - id: unlinkat
    desc: References unlinkat file-delete API
    conf: 0.3
    if:
      type: symbol
      exact: "unlinkat"
    downgrade:
      any:
        - id: metadata/lang/compiled/
  - id: io-uring-unlinkat
    desc: Deletes files through io_uring
    conf: 0.96
    platforms: [linux]
    for: [c, cpp, elf]
    if:
      type: symbol
      exact: io_uring_prep_unlinkat
