# Statically linked libc code may retain syscall stubs without symbols.
defaults:
  platforms: [linux]
  for: [elf]
  arch: [x86]
  crit: notable
  conf: 0.99
traits:
  - id: i386-unlink-syscall-stub
    desc: x86 Linux unlink syscall stub
    if:
      type: hex
      section: .text
      pattern: 53 89 (FB|C3|F3) B8 0A 00 00 00 CD 80 5B
