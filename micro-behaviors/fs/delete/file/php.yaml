defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
  - id: php-unlink
    desc: Calls PHP unlink()
    unless:
      - id: php-unlink-after-is-link
      - id: php-unlink-before-symlink
    if:
      type: symbol
      kind: call
      exact: unlink
  - id: php-unlink-name-call
    desc: Calls unlink() on name
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: unlink
      arg:
        kind: identifier
        name: "$name"

  - id: php-rmdir-name-call
    desc: Calls rmdir() on name
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: rmdir
      arg:
        kind: identifier
        name: "$name"

  - id: php-unlink-after-is-link
    desc: PHP unlink after is_link check
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'is_link\s*\([^)]{1,120}\)[\s\S]{0,240}unlink\s*\('

  - id: php-unlink-before-symlink
    desc: PHP unlink before symlink recreation
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'unlink\s*\([^)]{1,120}\)[\s\S]{0,240}symlink\s*\('

composite_rules:
  - id: php-variable-name-delete-call
    desc: Deletes variable named name
    conf: 0.86
    any:
      - id: php-unlink-name-call
      - id: php-rmdir-name-call
