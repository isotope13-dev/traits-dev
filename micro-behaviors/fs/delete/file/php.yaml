defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
  - id: php-unlink
    desc: Calls PHP unlink()
    if:
      type: symbol
      kind: call
      exact: unlink
  - id: php-unlink-name-call
    desc: Calls unlink() on name
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: unlink
      arg:
        kind: identifier
        name: "$name"

  - id: php-rmdir-name-call
    desc: Calls rmdir() on name
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: rmdir
      arg:
        kind: identifier
        name: "$name"

composite_rules:
  - id: php-variable-name-delete-call
    desc: Deletes variable named name
    conf: 0.86
    any:
      - id: php-unlink-name-call
      - id: php-rmdir-name-call
