defaults:
  for: [vbs]
  platforms: [windows]
  crit: notable
  conf: 0.95
traits:
  - id: wsh-public-executable-delete
    desc: Deletes executable from public profile
    if:
      type: text
      regex: '(?i)\.DeleteFile[ \t(]{1,8}"[A-Z]:\\Users\\Public\\[^"\r\n]{1,80}\.exe"'
      exclude_comments: true
  - id: wsh-public-script-delete
    desc: Deletes VBScript from public profile
    if:
      type: text
      regex: '(?i)\.DeleteFile[ \t(]{1,8}"[A-Z]:\\Users\\Public\\[^"\r\n]{1,80}\.vbs"'
      exclude_comments: true
