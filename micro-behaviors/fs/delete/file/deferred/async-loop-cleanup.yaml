defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: async-loop-unlink-same-path
    desc: Async and loop calls share unlinked path
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (try_statement body: (statement_block
            (expression_statement (await_expression
              (call_expression function: (identifier)
                arguments: (arguments (_) (identifier) @acquired))))))
          (for_in_statement body: (expression_statement
            (binary_expression left: (call_expression function: (identifier)
              arguments: (arguments (_) (identifier) @installed)))))
          (try_statement body: (statement_block
            (expression_statement (call_expression
              function: [
                (subscript_expression index: (string (string_fragment) @remove))
                (member_expression property: (property_identifier) @remove)]
              arguments: (arguments (identifier) @removed))))))
          (#eq? @remove "unlinkSync")
          (#eq? @acquired @installed)
          (#eq? @acquired @removed))
