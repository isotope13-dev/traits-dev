# A close-event cleanup callback is not self-deletion: its target may be a
# downloaded child script, a temporary file, or any other filesystem entry.
# Text matching also covers JavaScript embedded in deployment configurations.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, json]
  crit: notable
  conf: 0.95
  mbc: C0047

traits:
  - id: node-close-callback-unlink-sync
    desc: Close-event arrow callback calls fs.unlinkSync
    if:
      type: text
      regex: '\.on\(\s*["'']close["'']\s*,\s*\(\)\s*=>\s*\{\s*fs\.unlinkSync\s*\('
