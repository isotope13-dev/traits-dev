defaults:
  platforms: [windows]
  for: [c, cpp, pe]

composite_rules:
- id: stale-contact-self-delete
  desc: Heartbeat and deferred file/registry API set
  crit: notable
  conf: 0.97
  for: [c, cpp]
  all:
  - id: micro-behaviors/time/timing/check::stale-heartbeat-check
  - id: micro-behaviors/os/registry/manipulate::reg-delete-value-w-symbol
  - id: micro-behaviors/fs/delete/file/deferred::movefile-delay-until-reboot-flag
  any:
  - id: micro-behaviors/fs/file/move::move-file-ex
  - id: micro-behaviors/fs/file/move::self-temp-move
