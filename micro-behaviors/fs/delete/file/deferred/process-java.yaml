defaults:
  platforms: [windows, unix, android]
  # Class-scoped: the delete/sleep/wait/exec legs are per-class bytecode
  # symbols. Allowing jar/apk lets an archive root pool them from unrelated
  # member jars, so any multi-library JVM distribution matches by coincidence.
  for: [class]
composite_rules:
  - id: java-delete-with-process-wait-sleep
    desc: JVM file deletion with process wait and sleep references
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/delete/file/library::java-file-delete-bytecode
      - id: micro-behaviors/process/control/wait::java-process-waitfor-bytecode
      - id: micro-behaviors/time/sleep/interval::java-thread-sleep-bytecode
    any:
      - id: micro-behaviors/process/create/exec::java-runtime-exec-bytecode-reference
      - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode
    unless:
      - id: well-known/tool/development/build/gradle-wrapper::gradle-wrapper-jar
      - id: well-known/tool/development/build/gradle-wrapper::gradle-wrapper-archive-member
      - id: metadata/build/bundler/vscode::vscode-language-server-library
