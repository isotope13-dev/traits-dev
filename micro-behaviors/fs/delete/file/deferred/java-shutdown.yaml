defaults:
  platforms:
  - windows
  - unix
  for:
  - class
composite_rules:
- id: jvm-file-delete-api-or-command
  desc: JVM file deletion API or command references
  crit: notable
  conf: 0.93
  any:
  - id: micro-behaviors/fs/delete/file/library
  - id: micro-behaviors/fs/delete/file/command
- id: java-selfpath-shutdown-delete-api-set
  desc: JVM self-path, shutdown and deletion API references
  crit: notable
  conf: 0.9
  near_bytes: 65536
  unless:
  - id: well-known/lib/development/scala-compiler
  all:
  - id: micro-behaviors/process/info/selfpath::java-protection-domain
  - id: micro-behaviors/process/info/current::getlocation-ref
  - id: metadata/file/extension/declaration::java-jar-extension-string
  - id: micro-behaviors/process/lifecycle/shutdown::java-shutdown-hook-registration
  - id: jvm-file-delete-api-or-command
  any:
  - id: metadata/lang/source/naming/function::java-plus-minutes-reference
  - id: micro-behaviors/process/create/subprocess::java-processbuilder-bytecode
- id: java-jar-write-shutdown-delete-api-set
  desc: JVM Base64, JAR write, shutdown and deletion references
  crit: notable
  conf: 0.93
  all:
  - id: micro-behaviors/data/decode/base64::java-base64-decode-bytecode-call
  - id: micro-behaviors/fs/write/file/full::jvm-files-write-bytecode
  - id: metadata/file/extension/declaration::java-jar-extension-string
  - id: micro-behaviors/process/lifecycle/shutdown::java-shutdown-hook-registration
  - id: micro-behaviors/process/create/subprocess::java-processbuilder-start-bytecode
  - id: jvm-file-delete-api-or-command
