defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: movefile-reboot-text-and-api-clues
    desc: MoveFileEx and reboot flag references
    crit: component
    conf: 0.9
    all:
      - id: metadata/binary/symbols/name/function::movefileex-api-symbol
      - id: micro-behaviors/fs/delete/file/deferred::movefile-delay-until-reboot-flag
  - id: module-path-delete-reboot-clues
    desc: Module path and reboot-deletion API clues
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: micro-behaviors/fs/delete/file/library::delete-win
    any:
      - id: movefile-reboot-text-and-api-clues
      - id: micro-behaviors/fs/delete/file/reboot::x86-movefileex-delete-reboot-arguments
