# Deferred file deletion from mIRC scripts.
#
# mIRC has no sleep primitive, so scripts defer work with `.timer <reps>
# <interval> <command>`. A timer that fires once after tens of seconds just
# to `remove` a file deletes evidence after the current handler finishes --
# the import/extract runs now, the staged file is gone before anyone looks.
defaults:
  platforms: [windows]
  for: [mirc]
traits:
  - id: mirc-timer-deferred-remove
    desc: mIRC removes a file on a timer
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)\.timer\s+\d+\s+\d+\s+remove\s+\S'
