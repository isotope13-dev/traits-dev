defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
  - id: cil-self-image-delete-line-construction
    desc: CIL self-image batch deletion-line construction
    crit: notable
    conf: 0.94
    if:
      type: yara
      source: |
        import "pe"
        rule cil_self_image_delete_line_construction {
          strings:
            $line = { 72 ?? ?? ?? 70 28 ?? ?? ?? 0A 28 ?? ?? ?? 0A
                      72 ?? ?? ?? 70 28 ?? ?? ?? 0A 6F ?? ?? ?? 0A }
            $delete = "DEL \"" wide
            $flags = "\" /f /q" wide
            $self = "get_ExecutablePath" ascii fullword
            $name = "GetFileName" ascii fullword
            $writer = "WriteLine" ascii fullword
            $startup = "get_StartupPath" ascii fullword
          condition:
            for any s in pe.sections : (
              s.name == ".text" and
              for all of them : (
                $ in (s.raw_data_offset .. s.raw_data_offset + s.raw_data_size - 1)
              )
            )
        }
