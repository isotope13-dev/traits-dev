# `rm "$0"` is a running shell script removing its own file. Temporary
# restart and installer helpers clean up this way; droppers do too, so
# objectives/evasion/self-delete/scripts supplies the dropper context.
defaults:
  platforms: [unix]
  for: [shell]
  attack: T1070.004
  mbc: F0007
traits:
  - id: shell-dollar-zero-self-delete
    desc: Shell script deletes itself via $0
    crit: notable
    conf: 0.9
    if:
      # A commented-out `# rm -- "$0"` is disabled cleanup, not self-deletion.
      type: text
      exclude_comments: true
      regex: '(?m)\brm[ \t]+([^\s;&|]{1,80}[ \t]+){0,6}"?\$\{?0\}?"?([ \t;&|]|$)'
