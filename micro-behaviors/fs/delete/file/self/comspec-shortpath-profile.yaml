# API co-occurrence plus a shell deletion command; does not establish evasion.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: comspec-shortpath-self-delete-profile
    desc: Self-path, shell and deletion command references
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/os/env/runtime::comspec-env-var
      - id: micro-behaviors/fs/delete/file/command::slash-c-del-fragment
      - id: micro-behaviors/fs/path/check::get-short-path-name
      - id: micro-behaviors/process/create/shellexec::shell-execute-ex-a
    any:
      - id: micro-behaviors/process/info/current::get-module-filename
      - id: micro-behaviors/process/info/current::get-module-filename-ansi
    unless:
      - id: well-known/app/system/iobit::advanced-systemcare-component-context
      - id: well-known/app/system/far-manager::far-manager-versioninfo-company
