# Self-removal of the currently executing script file in Ruby and Python.
# Self-removal alone is a capability (temporary updaters and bootstrap scripts
# also clean up); evasion consumers pair it with exfiltration, covert staging,
# or package hook abuse. PHP and Node.js equivalents live in sibling files.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.95
  attack: T1070.004

traits:
  - id: ruby-delete-self-file
    for: [ruby]
    desc: Ruby call deletes current script (__FILE__)
    if:
      type: symbol
      kind: call
      regex: '^(File\.(delete|unlink)|FileUtils\.(rm|rm_f|rm_rf|remove|remove_file|safe_unlink))$'
      arg:
        index: 0
        kind: identifier
        name: __FILE__

  - id: python-delete-self-file
    for: [python]
    desc: Python call deletes current script (__file__)
    if:
      type: symbol
      kind: call
      regex: '^(os\.(remove|unlink)|posix\.(remove|unlink))$'
      arg:
        index: 0
        kind: identifier
        name: __file__
