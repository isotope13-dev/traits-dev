defaults:
  platforms: [windows, linux, macos]
  for: [go]

traits:
  - id: go-remove-own-executable-path
    desc: os.Remove targets the running executable path
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: os.Remove
      arg:
        index: 0
        from:
          call: '^os\.Executable$'

