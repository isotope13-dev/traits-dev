defaults:
  platforms: [unix, windows]
traits:
  - id: batch-self-delete
    desc: Batch script self-deletion command
    crit: notable
    conf: 0.95
    attack: T1070.004
    for:
      - batch
      - shell
    if:
      type: text
      regex: (?i)del\s+(/[a-z]\s+){0,3}"?%~f0"?

  - id: powershell-self-delete
    desc: PowerShell removes its current script path
    crit: notable
    conf: 0.96
    platforms: [windows]
    for: [powershell]
    if:
      type: text
      regex: '(?i)Remove-Item\s+(-\w+\s+)?["'']?\$(PSCommandPath|MyInvocation\.MyCommand\.Path)\b'
