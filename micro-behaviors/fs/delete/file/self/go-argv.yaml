defaults:
  platforms: [unix, windows]
  for: [go]
traits:
  - id: go-remove-argv-zero
    desc: Removes the path in Go argv zero
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (selector_expression operand: (identifier) @os
            field: (field_identifier) @remove)
          arguments: (argument_list . (index_expression
            operand: (selector_expression operand: (identifier) @argv_os
              field: (field_identifier) @args)
            index: (int_literal) @zero) .)) @delete
          (#eq? @os "os") (#eq? @remove "Remove")
          (#eq? @argv_os "os") (#eq? @args "Args") (#eq? @zero "0"))
