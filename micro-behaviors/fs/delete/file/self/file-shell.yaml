# File Delete Operations - Shell
# MBC: C0047 (Delete File)
# ATT&CK: T1070.004
defaults:
  attack: T1070.004
  mbc: C0047
  platforms: [unix]
  for: [shell]
traits:
# `rm -f "$SCRIPT_PATH"` / `rm -rf "$self"`: the deleted variable is named for
# the running script. The generic variable-target atom above says only that
# *some* variable is deleted, which a loop body sweeping `$gio_module` or
# `$tmpfile` satisfies just as well, so self-delete composites need this one.
- id: rm-force-self-path-variable
  desc: Force-deletes a script-path variable
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?im)(^|[;&|])\s*rm\s+-[rf]*f[rf]*\s+(--\s+)?["\x27]?\$\{?(self|script|this|me|prog|src)'
