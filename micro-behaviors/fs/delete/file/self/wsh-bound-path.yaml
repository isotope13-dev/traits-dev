defaults:
  for:
  - javascript
  platforms:
  - windows
traits:
- id: wsh-delete-bound-own-script
  desc: DeleteFile targets bound ScriptFullName path
  crit: notable
  conf: 0.99
  if:
    type: tree-sitter
    query: |-
      ((program
       (variable_declaration (variable_declarator
        name: (identifier) @path
        value: (member_expression object: (identifier) @host property: (property_identifier) @self)))
       (if_statement consequence: (statement_block
        (expression_statement (call_expression
         function: (member_expression property: (property_identifier) @delete)
         arguments: (arguments (identifier) @target (_))))))) @cleanup
       (#eq? @host "WScript")
       (#eq? @self "ScriptFullName")
       (#eq? @delete "DeleteFile")
       (#eq? @path @target))
