defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
composite_rules:
  - id: native-rename-posix-delete-setup
    desc: Handle rename beside POSIX delete setup
    crit: notable
    conf: 0.95
    near_bytes: 128
    all:
      - id: micro-behaviors/fs/file/rename::x86-file-rename-info-call-setup
      - id: micro-behaviors/fs/delete/file/syscall::x86-posix-delete-disposition-setup
  - id: native-stream-self-removal-profile
    desc: Self-path APIs with stream rename and POSIX delete setup
    crit: suspicious
    conf: 0.95
    all:
      - id: native-rename-posix-delete-setup
      - id: micro-behaviors/fs/path/stream::native-stream-basename
      - id: micro-behaviors/process/info/current::get-module-filename-wide
      - id: micro-behaviors/fs/file/handle::set-file-information-by-handle
      - id: micro-behaviors/fs/file/handle::nt-set-information-file
