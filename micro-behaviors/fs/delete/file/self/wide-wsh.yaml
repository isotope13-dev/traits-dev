defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # A native program can carry a generated WSH cleanup script. This matches
  # the script's own-file deletion command, not native-image self-removal.
  - id: wide-wsh-script-self-delete-command
    desc: Embedded wide WSH script deletes itself
    crit: notable
    conf: 0.98
    if:
      type: encoded
      encoding: [wide, utf16le]
      regex: '(?i)\.DeleteFile\s*\(\s*WScript\.ScriptFullName\s*\)'
