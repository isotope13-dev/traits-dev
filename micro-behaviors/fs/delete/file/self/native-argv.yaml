defaults:
  platforms: [unix, windows]

traits:
  - id: unlink-argv0-source
    desc: Unlinks the argv[0] executable path
    crit: notable
    conf: 0.86
    for: [c, cpp, elf]
    if:
      type: text
      regex: '\bunlink\s*\(\s*argv\s*\[\s*0\s*\]\s*\)'
    unless:
      - id: well-known/app/network/freeradius::freeradius-build-plugin-context
