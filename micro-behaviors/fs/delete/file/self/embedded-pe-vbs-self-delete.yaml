defaults:
  platforms: [windows]
  for: [pe, data]

traits:
  - id: embedded-fso-object-create
    desc: Embedded binary creates FileSystemObject
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: Scripting.FileSystemObject

  - id: embedded-wscript-sleep-delay
    desc: Embedded binary includes Wscript.Sleep delay
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: Wscript.Sleep

  - id: embedded-fso-deletefile-call
    desc: Embedded binary includes fso.DeleteFile call
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bfso\.DeleteFile\s*\('

composite_rules:
  # A PE that carries a VBScript that sleeps, then deletes a file through a
  # FileSystemObject. Droppers use this template to delete the stage that
  # launched them; a standalone FSO string proves nothing.
  - id: embedded-pe-vbs-self-delete-template
    desc: PE embeds a VBS script that deletes a file after a delay
    crit: notable
    conf: 0.9
    all:
      - id: embedded-fso-object-create
      - id: embedded-wscript-sleep-delay
      - id: embedded-fso-deletefile-call
