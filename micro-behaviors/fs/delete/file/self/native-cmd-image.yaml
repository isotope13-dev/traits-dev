defaults:
  for:
  - c
  - cpp
  platforms:
  - windows
traits:
- id: native-cmd-self-image-delete
  desc: Executes cmd del targeting own image path
  crit: notable
  conf: 0.99
  if:
    type: tree-sitter
    query: |-
      ((function_definition
       declarator: (function_declarator declarator: (identifier) @deleter)
       body: (compound_statement
        (expression_statement (call_expression function: (identifier) @module
         arguments: (argument_list (_) @handle (identifier) @path (_))))
        (expression_statement (call_expression function: (identifier) @format
         arguments: (argument_list (identifier) @cmd (_) (string_literal) @template
          (identifier) @formatted)))
        (expression_statement (call_expression function: (identifier) @execute
         arguments: (argument_list (identifier) @executed (_)))))) @selfdelete
       (#match? @module "^GetModuleFileName[AW]?$")
       (#eq? @format "snprintf")
       (#match? @template "cmd /c del[ \"'\\\\]*%s")
       (#match? @handle "^(NULL|0)$")
       (#eq? @execute "WinExec")
       (#eq? @path @formatted)
       (#eq? @cmd @executed))
