# Self-removal is a capability: temporary update helpers use it legitimately.
# Intent-specific consumers supply manifest replacement or source scrubbing.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  # The flow producer does not follow bindings inside all function expressions.
  # Bind the local name to the first removal argument in adjacent statements;
  # const prevents reassignment between the binding and the call.
  - id: unlink-const-filename-alias
    desc: Removes current script through const alias
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((_
          (lexical_declaration
            kind: "const"
            (variable_declarator
              name: (identifier) @alias
              value: (identifier) @self))
          .
          (expression_statement
            [
              (call_expression
                function: [
                  (member_expression property: (property_identifier) @remove)
                  (identifier) @remove]
                arguments: (arguments . (identifier) @target))
              (sequence_expression
                (call_expression
                  function: [
                    (member_expression property: (property_identifier) @remove)
                    (identifier) @remove]
                  arguments: (arguments . (identifier) @target)))
            ]))
          (#eq? @self "__filename")
          (#eq? @alias @target)
          (#match? @remove "^(unlink|unlinkSync|rm|rmSync)$"))
  - id: unlink-filename
    desc: Unlink call targets the current script
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)unlink(Sync)?$'
      arg:
        index: 0
        kind: identifier
        name: __filename
  - id: rm-filename
    desc: Remove call targets the current script
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)rm(Sync)?$'
      arg:
        index: 0
        kind: identifier
        name: __filename
  - id: empty-unlink-callback
    desc: Script unlink call ignores callback errors
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: fs\.unlink\s*\(\s*__filename\s*,\s*\(\)\s*=>\s*\{\s*\}\s*\)
composite_rules:
  - id: node-self-delete
    desc: Node.js script self-deletion
    crit: notable
    conf: 0.9
    any:
      - id: unlink-const-filename-alias
      - id: unlink-filename
      - id: rm-filename
      - id: empty-unlink-callback
