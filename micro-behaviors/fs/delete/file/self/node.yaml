# Self-removal is a capability: temporary update helpers use it legitimately.
# Intent-specific consumers supply manifest replacement or source scrubbing.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: unlink-filename
    desc: Unlink call targets the current script
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)unlink(Sync)?$'
      arg:
        index: 0
        kind: identifier
        name: __filename
  - id: rm-filename
    desc: Remove call targets the current script
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)rm(Sync)?$'
      arg:
        index: 0
        kind: identifier
        name: __filename
  - id: empty-unlink-callback
    desc: Script unlink call ignores callback errors
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: fs\.unlink\s*\(\s*__filename\s*,\s*\(\)\s*=>\s*\{\s*\}\s*\)
composite_rules:
  - id: node-self-delete
    desc: Node.js script self-deletion
    crit: notable
    conf: 0.9
    any:
      - id: unlink-filename
      - id: rm-filename
      - id: empty-unlink-callback
