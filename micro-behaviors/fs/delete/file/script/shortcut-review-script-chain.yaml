defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-arg-delete-temp-script
    desc: LNK argument deletes a temp script
    crit: suspicious
    conf: 0.93
    if:
      type: value
      path: lnk.arguments
      regex: '\bdel\s+\S{0,40}%TEMP%\\\\?\S{1,40}\.(vbs|ps1|js)'
      case_insensitive: true
  - id: lnk-arg-delete-temp-batch
    desc: LNK argument deletes temp batch or HTA
    crit: suspicious
    conf: 0.93
    if:
      type: value
      path: lnk.arguments
      regex: '\bdel\s+\S{0,40}%TEMP%\\\\?\S{1,40}\.(bat|cmd|hta)'
      case_insensitive: true
