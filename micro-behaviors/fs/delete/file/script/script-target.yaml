defaults:
  platforms: [windows]
  crit: notable

traits:
  - id: del-script-file-command-literal
    desc: DEL command literal targets a script file
    conf: 0.75
    for: [powershell, batch]
    if:
      type: literal
      regex: '\bdel\s+[^\r\n]{0,50}\.(ps1|bat|cmd|vbs)\b'
      case_insensitive: true
  - id: batch-del-script-target
    desc: Batch DEL targets a script file
    conf: 0.88
    for: [batch, text]
    if:
      type: text
      regex: '(?im)^\s*(del|erase)\b[^\r\n]{0,50}\b[a-z0-9_.-]+\.(vbs|bat|cmd|ps1|js)\b'
