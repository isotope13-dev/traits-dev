defaults:
  platforms: [windows]
  for: [scripts, source, batch]
traits:
  - id: quiet-delete-temp-script-command
    desc: Quietly deletes a script from temp
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bdel\s+/[qQfF]{1,2}\s+"?%(TEMP|TMP)%[^"\n]{0,60}\.(bat|cmd|ps1|vbs|js)'
