defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: x86-movefileex-delete-reboot-arguments
    desc: MoveFileEx null destination and reboot flag
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule x86_movefileex_delete_reboot_arguments {
          strings:
            $api = "MoveFileExA"
            $args = { 6A 04 8D 44 24 ?? 6A 00 50 FF 15 ?? ?? ?? ?? }
          condition:
            $api and $args
        }
