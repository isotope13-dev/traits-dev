defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, dll]
  mbc: C0047
  attack: T1070.004
traits:
  - id: static-unlink-symbol-text
    desc: Static executable contains unlink symbol
    crit: notable
    conf: 0.72
    for: [elf]
    platforms: [linux]
    if:
      type: text
      regex: '^(__)?unlink$'
    unless:
      - id: micro-behaviors/fs/delete/file/syscall::unlinkat
      - id: metadata/lang/compiler/systems::go-binary
  - id: delete-files-symbol
    desc: Native delete-files symbol
    crit: notable
    conf: 0.8
    if:
      type: symbol
      regex: deleteFiles?
