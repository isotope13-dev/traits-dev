defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: node-remove-processed-input
  desc: Deletes input passed to preceding helper
  crit: notable
  conf: 0.96
  if:
    type: tree-sitter
    query: "((statement_block\n (expression_statement (call_expression function: (identifier) @extract arguments: (arguments (identifier) @source (identifier))))\n (try_statement body: (statement_block (expression_statement (call_expression function: (member_expression object: (identifier) @fs property: (property_identifier) @unlink) arguments: (arguments (identifier) @deleted)))))\n) @cleanup\n (#eq? @fs \"fs\") (#eq? @unlink \"unlinkSync\") (#eq? @source @deleted))"
