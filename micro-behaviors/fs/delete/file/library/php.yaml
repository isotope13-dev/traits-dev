defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
  # A bare __FILE__ reference is normal in PHP libraries (for example, to
  # locate an adjacent resource or determine a MIME type).  Keep the atom
  # tied to a deletion call so that ordinary path discovery is not treated as
  # self-deletion.
  - id: self-delete-file-constant
    desc: unlink() targets PHP __FILE__ path
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      kind: call
      regex: '^unlink\s*\(\s*__FILE__\s*\)$'
  - id: php-unlink
    desc: Calls PHP unlink()
    unless:
      - id: php-unlink-after-is-link
      - id: php-unlink-before-symlink
    if:
      type: symbol
      kind: call
      exact: unlink
  - id: php-unlink-name-call
    desc: Calls unlink() on name
    conf: 0.86
    if:
      type: symbol
      kind: call
      exact: unlink
      arg:
        kind: identifier
        name: "$name"
  - id: php-unlink-after-is-link
    desc: PHP unlink after is_link check
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'is_link\s*\([^)]{1,120}\)[\s\S]{0,240}unlink\s*\('
  - id: php-unlink-before-symlink
    desc: PHP unlink before symlink recreation
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'unlink\s*\([^)]{1,120}\)[\s\S]{0,240}symlink\s*\('
composite_rules:
  - id: php-variable-name-delete-call
    desc: Deletes variable named name
    conf: 0.86
    any:
      - id: php-unlink-name-call
      - id: micro-behaviors/fs/delete/directory::php-rmdir-name-call
