defaults:
  platforms: [unix]
  for: [perl]
  crit: notable
  attack: T1070.004
  mbc: C0047
traits:
  - id: perl-unlink-call
    desc: Perl unlink file deletion call
    if:
      type: text
      # Word matcher — avoids matching prose "unlinks" from a bare prefix regex.
      word: unlink
    unless:
      # `.pl` is also the Prolog extension. Prolog facts parsed heuristically
      # as Perl can contain `unlink` in a quoted predicate name, not a call.
      - id: metadata/lang/source/syntax/directive::prolog-module-directive
