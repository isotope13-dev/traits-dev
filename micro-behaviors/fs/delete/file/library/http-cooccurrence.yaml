defaults:
  platforms:
  - linux
  - macos
  - windows
  - unix
  - android
  - ios
composite_rules:
- id: upload-cleanup
  desc: HTTP POST and file deletion APIs co-occur
  crit: notable
  conf: 0.9
  for:
  - python
  near_lines: 15
  all:
  - id: micro-behaviors/communications/http/post::http-post-client-call
  any:
  - id: micro-behaviors/fs/delete/directory::shutil-rmtree
  - id: micro-behaviors/fs/delete/file/library::py-remove
