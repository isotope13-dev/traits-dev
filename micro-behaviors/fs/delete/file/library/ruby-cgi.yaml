defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-cgi-decoded-file-delete
    desc: Deletes CGI-decoded request file path
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      language: ruby
      query: |
        (elsif
          condition: (binary left: (parenthesized_statements
            (binary right: (string (string_content) @route))))
          consequence: (then
            (assignment left: (identifier) @path right: (call receiver: (constant) @cgi method: (identifier) @decode))
            (if consequence: (then
              (if consequence: (then
                (call receiver: (constant) @file method: (identifier) @delete
                  arguments: (argument_list . (identifier) @path1 .)))))))
          (#eq? @route "/?delete_file") (#eq? @cgi "CGI") (#eq? @decode "unescape")
          (#eq? @file "File") (#eq? @delete "delete") (#eq? @path @path1)) @delete_handler
