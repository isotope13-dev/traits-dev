defaults:
  crit: notable
  platforms: [windows, unix, android]
  for: [class, jar, zip, apk]
  attack: T1070.004
traits:
  - id: java-file-delete-bytecode
    desc: Java bytecode file deletion
    conf: 0.94
    if:
      type: import
      exact: java/io/File.delete
  - id: java-nio-file-delete-bytecode
    desc: Java bytecode NIO file deletion
    conf: 0.94
    if:
      type: import
      exact: java/nio/file/Files.delete
  - id: java-nio-file-delete-if-exists-bytecode
    desc: Java bytecode conditional NIO deletion
    conf: 0.94
    if:
      type: import
      exact: java/nio/file/Files.deleteIfExists
  - id: java-file-delete-source
    desc: Java File deletion call
    conf: 0.92
    for: [java]
    if:
      type: text
      regex: '\bFile\s+[A-Za-z_$][A-Za-z0-9_$]*[\s\S]{0,900}\.[[:space:]]*delete\(\)'
  - id: kotlin-file-delete-source
    desc: Kotlin typed File deletion call
    conf: 0.92
    for: [kotlin]
    if:
      type: text
      regex: '\b(val|var)\s+[A-Za-z_$][A-Za-z0-9_$]*\s*:\s*File\b[\s\S]{0,900}\.\s*delete\s*\(\s*\)'
composite_rules:
  - id: jvm-file-delete-source
    desc: JVM source deletes a File
    conf: 0.92
    for: [java, kotlin]
    any:
      - id: java-file-delete-source
      - id: kotlin-file-delete-source
