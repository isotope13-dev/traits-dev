defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  # Co-occurrence profile; the imports and target strings do not prove that
  # every deletion uses those masks or paths. Ordinary temp cleaners qualify.
  - id: windows-temp-executable-archive-deletion-profile
    desc: Temp path and EXE/RAR masks with enumeration/deletion APIs
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/fs/path/temp::win-temp-path
      - id: micro-behaviors/fs/search::exe-wildcard-data-bytes
      - id: micro-behaviors/fs/path/basename::rar-filename-wildcard-reference
      - id: micro-behaviors/fs/directory/readdir::find-first-file
      - id: micro-behaviors/fs/directory/readdir::find-next-file
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
