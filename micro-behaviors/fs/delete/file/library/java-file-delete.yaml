traits:
  - id: java-file-delete-call
    desc: Calls Java File.delete()
    platforms: [unix, windows]
    crit: notable
    conf: 0.78
    for: [java]
    if:
      type: text
      # java.io.File.delete() takes no arguments; '.delete(handle, key)' and
      # '.delete(id)' are database/collection APIs (RocksDB, JPA, maps).
      regex: '\.delete\s*\(\s*\)'
