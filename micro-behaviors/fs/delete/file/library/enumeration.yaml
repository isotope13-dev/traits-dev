defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, source]
composite_rules:
  - id: file-removal-near-directory-enumeration
    desc: File-removal API near directory enumeration
    crit: notable
    conf: 0.88
    scope: leaf
    near_lines: 30
    all:
      - id: micro-behaviors/fs/directory/traverse::traverse-readdir-walk-find
    any:
      - id: micro-behaviors/fs/delete/file/library::fs-unlinkSync
      - id: micro-behaviors/fs/delete/file/library::py-remove
      - id: micro-behaviors/fs/directory/traverse::delete-shell
    unless:
      - id: metadata/build/minifier::js-large-minified-bundle
      - id: well-known/lib/development/ts-compiler-lib::typescript-compiler-lib-context
      - id: well-known/tool/development/testing/webdriver-manager::selenium-webdriver-driver-manager-package
      - id: well-known/tool/development/agent/dotnet-agent-skills::dotnet-agent-skills-identity
