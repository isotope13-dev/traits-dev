defaults:
  platforms:
  - unix
  - windows
traits:
- id: java-rotated-server-log-delete
  desc: Java deletes rotated server logs
  crit: notable
  conf: 0.98
  for:
  - java
  if:
    type: text
    regex: \.startsWith\s*\(\s*["']server\.log\.["']\s*\)[^;]{0,260}\.delete\s*\(
- id: java-derby-log-delete
  desc: Java deletes Apache Derby log
  crit: notable
  conf: 0.97
  for:
  - java
  if:
    type: text
    regex: new\s+File\s*\(\s*["'][^"']{0,160}derby\.log["']\s*\)\s*\.delete\s*\(\s*\)
- id: java-nio-derby-log-delete
  desc: Java NIO deletes Apache Derby log
  crit: notable
  conf: 0.97
  for:
  - java
  if:
    type: text
    regex: Files\.delete(IfExists)?\s*\([^;\n]{0,120}derby\.log
composite_rules:
- id: java-nio-rotated-server-log-delete
  desc: Java log name near NIO deletion
  crit: notable
  conf: 0.98
  for:
  - java
  all:
  - id: micro-behaviors/fs/path/log/application::java-rotated-server-log-name
  any:
  - id: micro-behaviors/fs/delete/file/library::java-files-delete
  - id: micro-behaviors/fs/delete/file/library::java-delete-if-exists
  needs: 1
  near_lines: 6
- id: java-server-log-family-delete
  desc: Server-log names with deletion calls
  crit: notable
  conf: 0.98
  for:
  - java
  all:
  - id: micro-behaviors/fs/path/log/application::java-active-server-log-name
  any:
  - id: java-rotated-server-log-delete
  - id: java-nio-rotated-server-log-delete
  needs: 1
  near_lines: 16
- id: jvm-server-log-family-delete
  desc: JVM server-log and file-deletion references
  crit: notable
  conf: 0.98
  for:
  - class
  - jar
  - zip
  scope: outer
  all:
  - id: metadata/file/string/file::jvm-active-server-log-name
  - id: metadata/file/string/file::jvm-rotated-server-log-prefix
  - id: micro-behaviors/fs/directory/readdir::jvm-file-listfiles
  any:
  - id: micro-behaviors/fs/delete/file/library::java-file-delete-bytecode
  - id: micro-behaviors/fs/delete/file/library::java-nio-file-delete-bytecode
  - id: micro-behaviors/fs/delete/file/library::java-nio-file-delete-if-exists-bytecode
  needs: 1
