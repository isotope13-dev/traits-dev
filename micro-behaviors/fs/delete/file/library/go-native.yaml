defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: go-x86-delete-disposition-call-setup
    desc: Go x86 true delete-disposition call setup
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        import "pe"
        rule go_x86_true_delete_disposition_setup {
          strings:
            // Set BOOL true; pass that same local buffer, class 4, size 4.
            $setup = {
              C7 84 24 ?? ?? ?? ?? 01 00 00 00 89 04 24
              C7 44 24 04 04 00 00 00 8D 84 24 ?? ?? ?? ??
              89 44 24 08 C7 44 24 0C 04 00 00 00 E8 ?? ?? ?? ??
            }
          condition:
            // Unpacked/dumped images keep the executable section flag
            // even when the original .text section name is lost.
            for any s in (0..pe.number_of_sections-1) : (
              (pe.sections[s].name == ".text" or
               (pe.sections[s].characteristics & pe.SECTION_MEM_EXECUTE) != 0) and
              for any i in (1..#setup) : (
                @setup[i] >= pe.sections[s].raw_data_offset and
                @setup[i] + !setup[i] <= pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size and
                uint32(@setup[i] + 3) == uint32(@setup[i] + 25)
              )
            )
        }
