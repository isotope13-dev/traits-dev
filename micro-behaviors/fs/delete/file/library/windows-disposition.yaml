defaults:
  platforms: [windows]
  for: [c, cpp]
traits:
  - id: windows-delete-file-flag
    desc: Sets Windows DeleteFile flag true
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\.DeleteFile\s*=\s*(TRUE|true|1)\s*;'
  - id: windows-set-delete-disposition
    desc: Calls Windows file-disposition setter
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: SetFileInformationByHandle
      arg:
        index: 1
        kind: identifier
        name: FileDispositionInfo
composite_rules:
  - id: windows-delete-disposition-request
    desc: DeleteFile flag near file-disposition setter
    crit: notable
    conf: 0.95
    near_bytes: 256
    all:
      - id: windows-delete-file-flag
      - id: windows-set-delete-disposition
