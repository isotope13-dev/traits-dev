defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: js-bracket-deletefile-call
    desc: Bracketed DeleteFile method call
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (subscript_expression
            index: (string (string_fragment) @method))
          arguments: (arguments . (_))) @call
          (#eq? @method "DeleteFile"))
