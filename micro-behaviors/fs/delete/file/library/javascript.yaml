---
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  crit: baseline
  conf: 0.9
  mbc: C0047
  attack: T1070.004
traits:
- id: node-rm-sync
  desc: Node synchronously removes a file or directory
  if:
    type: symbol
    kind: call
    exact: rmSync
- id: fs-unlink
  desc: Delete file (fs.unlink)
  if:
    type: symbol
    kind: call
    regex: "^(fs|import_fs[0-9]*\\.default)\\.unlink$"
- id: js-repeated-unlink-call
  desc: Repeated Node unlink calls
  crit: notable
  conf: 0.6
  count_min: 2
  if:
    type: text
    regex: "\\bfs\\.unlink(Sync)?\\s*\\("
  not:
  - substr: options.unlink(p, er =>
  - substr: fs.unlink(fdPath[1], _handler)
- id: fs-unlinkSync
  desc: Calls synchronous Node unlink method
  crit: notable
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)unlinkSync$"
- id: js-temp-file-unlink-call
  desc: Removes a temporary download file
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: unlinkSync\s*\(\s*temp(Binary|File)\s*\)
- id: fs-rm
  desc: Delete file or directory (fs.rm)
  if:
    type: symbol
    kind: call
    exact: fs.rm
- id: fs-rmSync
  desc: Delete file or directory sync
  if:
    type: symbol
    kind: call
    exact: fs.rmSync
- id: shelljs-rm
  desc: Deletes a file or directory through shelljs
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: shelljs.rm
- id: promises-unlink
  desc: Delete file (promises API)
  if:
    type: text
    regex: "\\b(promises|[A-Za-z_$][\\w$]*\\.promises)\\.unlink\\s*\\("
- id: node-fs-promises-unlink
  desc: Node asynchronously deletes a file
  crit: baseline
  conf: 0.9
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)fs\\.unlink$"
composite_rules:
- id: js-failed-download-temp-cleanup
  desc: Removes failed-download temporary file
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/fs/path/check::js-temp-file-existence-check
  - id: micro-behaviors/fs/delete/file/library::js-temp-file-unlink-call
  near_lines: 8
