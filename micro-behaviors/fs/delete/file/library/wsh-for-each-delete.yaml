# A For Each loop over a file collection whose first statement deletes the
# current item: every file in the folder is removed, with no name, extension
# or age test in between.
defaults:
  platforms: [windows]
  for: [vbs, html]
  attack: T1070.004

traits:
  - id: vbs-for-each-unfiltered-file-delete
    desc: VBScript deletes every file in a collection
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)For\s+Each\s+\w+\s+In\s+[\w.]+[ \t]*\r?\n\s*\w+\.Delete\b'
