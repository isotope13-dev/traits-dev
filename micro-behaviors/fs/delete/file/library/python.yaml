defaults:
  platforms: [windows, unix]
  for: [python]
  crit: baseline
  conf: 0.8
traits:
  - id: py-remove
    desc: File deletion (os.remove/os.unlink)
    if:
      type: text
      regex: os\.(remove|unlink)\(
  - id: py-aliased-os-remove
    desc: Python aliased os file deletion
    crit: notable
    conf: 0.88
    if:
      type: text
      # Common short aliases are frequent in compact downloaders. Require the
      # import and the matching method form so ordinary collection.remove()
      # calls do not become file-deletion findings.
      regex: 'import\s+os\s+as\s+(o|_os)\b[\s\S]{0,600}\b(o|_os)\.(remove|unlink)\s*\('
  - id: python-short-alias-remove
    desc: Short os alias deletes a file
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\bo\.remove\s*\('
  - id: py-remove-monkey-patch
    desc: Python replaces os.remove with a wrapper
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: os\.remove\s*=\s*[A-Za-z_]\w*
  # `rmtree` deletes a directory tree, which is what this file's own
  # description said while sitting under fs/file/delete/ — and it duplicated
  # the matcher of micro-behaviors/fs/delete/directory::shutil-rmtree,
  # so one call (`shutil.rmtree(path)`) was reported twice and split across two
  # ML features. That trait is now the canonical one and covers the bare
  # `from shutil import rmtree` spelling this regex was reaching for.
