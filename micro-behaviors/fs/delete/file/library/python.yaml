---
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  crit: baseline
  conf: 0.8
traits:
- id: py-remove
  desc: File deletion (os.remove/os.unlink)
  crit: notable
  if:
    type: text
    regex: os\.(remove|unlink)\(
- id: pathlib-unlink
  desc: Python Path.unlink deletes a file
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "\\bPath\\([^\\n)]{1,160}\\)\\.unlink\\s*\\("
- id: py-aliased-os-remove
  desc: Python aliased os file deletion
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: import\s+os\s+as\s+(o|_os)\b[\s\S]{0,600}\b(o|_os)\.(remove|unlink)\s*\(
- id: python-short-alias-remove
  desc: Short os alias deletes a file
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: "\\bo\\.remove\\s*\\("
