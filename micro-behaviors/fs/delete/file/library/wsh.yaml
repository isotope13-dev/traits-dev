traits:
  # Notable, not suspicious: `.DeleteFile` alone is ordinary file management,
  # and every filesystem layer names it (adm-zip, LSP, Monaco's virtual FS, agent
  # executors, JupyterLab, contools, spandsp each needed a carve-out at
  # suspicious). The destructive signal is objectives/impact/destroy/file-deletion's
  # wsh-copy-then-delete-as-txt;
  # the not: filters keep this leg to the WSH call form for that composite.
  - id: wsh-deletefile-call
    desc: WSH DeleteFile call
    crit: notable
    conf: 0.88
    platforms: [windows]
    for: [vbs, javascript, text, static-lib]
    if:
      type: text
      # Call shape only: the WSH form is `.DeleteFile <path>` or
      # `.DeleteFile(<path>[, force])`. A bare `.DeleteFile` followed by `=`
      # (Me.DeleteFile = New ...Button()), `.` (Me.DeleteFile.Text), `)` or `,`
      # (Controls.Add(Me.DeleteFile)) is a VB.NET control reference, never a
      # filesystem call. The trailing context is kept so the not: filters below
      # still see the argument they exclude on.
      regex: '(?i)\.DeleteFile\b\s*(\(|["'']|\w)[^\r\n]{0,48}'
    not:
      # adm-zip: zip.deleteFile(entryName). Not WSH FileSystemObject.DeleteFile.
      - substr: entryName
      # LSP WorkspaceEdit DeleteFile.create, not a script call.
      - substr: DeleteFile.create
      # JS method definition or assignment: prototype.deleteFile=function, o.deleteFile=e.deleteFile
      - substr: deleteFile=
      # camelCase deleteFile member (workspace/agent FS), not WSH DeleteFile.
      - regex: '\.deleteFile\b'
      # Highlight.js keyword chain, not a filesystem call.
      - substr: DeleteFile.Delete
