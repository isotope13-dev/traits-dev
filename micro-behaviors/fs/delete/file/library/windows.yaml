---
defaults:
  crit: notable
  platforms:
  - unix
  - windows
traits:
- id: deletefile
  desc: Delete files (Windows API)
  conf: 0.66
  for:
  - pe
  - c
  - cpp
  if:
    type: symbol
    exact: DeleteFile
- id: deletefile-a
  desc: Delete files (Windows API ANSI)
  conf: 0.66
  for:
  - pe
  - c
  - cpp
  if:
    type: symbol
    exact: DeleteFileA
- id: deletefile-a-text
  desc: DeleteFileA API name in binary text
  conf: 0.64
  for:
  - pe
  - c
  - cpp
  if:
    type: text
    word: DeleteFileA
  unless:
  - id: micro-behaviors/fs/delete/file/library::deletefile-a
- id: deletefile-w
  desc: DeleteFileW API symbol
  conf: 0.66
  for:
  - pe
  - c
  - cpp
  if:
    type: symbol
    exact: DeleteFileW
- id: vb6-rtckillfiles-name
  desc: VB6 runtime file deletion import
  conf: 0.84
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1070.004
  if:
    type: symbol
    exact: rtcKillFiles
- id: vb6-rtckillfiles-ordinal
  desc: VB6 runtime ordinal 529 import
  conf: 0.7
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1070.004
  if:
    type: symbol
    exact: ORDINAL 529
composite_rules:
- id: delete-win
  desc: Delete files (Windows API)
  conf: 0.66
  any:
  - id: micro-behaviors/fs/delete/file/library::deletefile
  - id: micro-behaviors/fs/delete/file/library::deletefile-a
  - id: micro-behaviors/fs/delete/file/library::deletefile-a-text
  - id: micro-behaviors/fs/delete/file/library::deletefile-w
- id: vb6-rtckillfiles
  desc: VB6 runtime file deletion helper
  conf: 0.9
  platforms:
  - windows
  for:
  - pe
  - dll
  attack: T1070.004
  any:
  - id: micro-behaviors/fs/delete/file/library::vb6-rtckillfiles-name
  - id: micro-behaviors/fs/delete/file/library::vb6-rtckillfiles-ordinal
  all:
  - id: micro-behaviors/dylib/load/runtime::vb6-runtime-dll-reference
