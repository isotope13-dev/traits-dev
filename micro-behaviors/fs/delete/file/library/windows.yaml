defaults:
  platforms: [unix, windows]
traits:
  - id: deletefile
    desc: Delete files (Windows API)
    crit: notable
    conf: 0.66
    for:
      - pe
      - c
      - cpp
    if:
      type: symbol
      exact: DeleteFile
  - id: deletefile-a
    desc: Delete files (Windows API ANSI)
    crit: notable
    conf: 0.66
    for:
      - pe
      - c
      - cpp
    if:
      type: symbol
      exact: DeleteFileA
  - id: deletefile-a-text
    desc: DeleteFileA API name in binary text
    crit: notable
    conf: 0.64
    for:
      - pe
      - c
      - cpp
    if:
      type: text
      word: DeleteFileA
    unless:
      # Fires only where the import does not: an imported API's name is in the
      # binary's strings too, so without this the same fact counted twice.
      - id: deletefile-a
  - id: deletefile-w
    desc: DeleteFileW API symbol
    crit: notable
    conf: 0.66
    for:
      - pe
      - c
      - cpp
    if:
      type: symbol
      exact: DeleteFileW
composite_rules:
  - id: delete-win
    desc: Delete files (Windows API)
    crit: notable
    conf: 0.66
    any:
      - id: deletefile
      - id: deletefile-a
      - id: deletefile-a-text
      - id: deletefile-w
