defaults:
  crit: notable
  platforms: [unix, windows]
traits:
  - id: deletefile
    desc: Delete files (Windows API)
    conf: 0.66
    for:
      - pe
      - c
      - cpp
    if:
      type: symbol
      exact: DeleteFile
  - id: deletefile-a
    desc: Delete files (Windows API ANSI)
    conf: 0.66
    for:
      - pe
      - c
      - cpp
    if:
      type: symbol
      exact: DeleteFileA
  - id: deletefile-a-text
    desc: DeleteFileA API name in binary text
    conf: 0.64
    for:
      - pe
      - c
      - cpp
    if:
      type: text
      word: DeleteFileA
    unless:
      # Fires only where the import does not: an imported API's name is in the
      # binary's strings too, so without this the same fact counted twice.
      - id: deletefile-a
  - id: deletefile-w
    desc: DeleteFileW API symbol
    conf: 0.66
    for:
      - pe
      - c
      - cpp
    if:
      type: symbol
      exact: DeleteFileW
  - id: vb6-rtckillfiles-name
    desc: VB6 runtime file deletion import
    conf: 0.84
    platforms: [windows]
    for: [pe, dll]
    attack: T1070.004
    if:
      type: symbol
      exact: rtcKillFiles
  - id: vb6-rtckillfiles-ordinal
    desc: VB6 runtime ordinal 529 import
    conf: 0.7
    platforms: [windows]
    for: [pe, dll]
    attack: T1070.004
    if:
      type: symbol
      exact: ORDINAL 529
composite_rules:
  - id: delete-win
    desc: Delete files (Windows API)
    conf: 0.66
    any:
      - id: deletefile
      - id: deletefile-a
      - id: deletefile-a-text
      - id: deletefile-w
  - id: vb6-rtckillfiles
    desc: VB6 runtime file deletion helper
    conf: 0.9
    platforms: [windows]
    for: [pe, dll]
    attack: T1070.004
    any:
      - id: vb6-rtckillfiles-name
      - id: vb6-rtckillfiles-ordinal
    all:
      - id: micro-behaviors/dylib/load/runtime::vb6-runtime-dll-reference
