defaults:
  for: [pyc]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: pyc-remove-name-record
    desc: Bytecode contains remove name record
    conf: 0.8
    if:
      type: raw
      regex: '(?-u:[\x7a\x5a\xfa\xda]\x06remove)'
    unless:
      # CPython stdlib modules calling warnings._deprecated(..., remove=(3, X))
      # carry the keyword name "remove" for their "in Python {remove}" message.
      - type: text
        substr: "in Python {remove}"
