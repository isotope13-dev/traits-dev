# File Delete Operations
# MBC: C0047 (Delete File)
# ATT&CK: T1070.004
defaults:
  platforms: [linux, macos]
  for: [elf, macho, shell, c, cpp]
traits:
  # Go runtime and standard library use unlink/remove for temp file cleanup
  # and normal file operations — downgrade on Go binaries so only deliberate
  # use in non-Go binaries stays at notable.
  - id: unlink
    desc: References unlink file-delete API
    crit: notable
    conf: 0.3
    if:
      type: symbol
      exact: "unlink"
    unless:
      - id: metadata/file/string/identity::python3-interpreter-basename
    downgrade:
      any:
        - id: metadata/lang/compiled/
        - id: metadata/file/string/identity::system-shell-basename
        - id: metadata/lang/compiler/systems::go-binary
  - id: remove-binary-symbol
    desc: References native remove file-deletion symbol
    crit: notable
    conf: 0.3
    for: [elf, macho, shell]
    if:
      type: symbol
      exact: "remove"
    unless:
      - id: metadata/file/extension/identity::python-type-stub-extension
      - id: well-known/lib/native/math::bundled-math-native-library-context
  - id: remove-source-call
    desc: Calls C remove with one pathname argument
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @function
          arguments: (argument_list . (_) .)) @call
          (#eq? @function "remove"))
  - id: js-fs-remove
    desc: Delete files (fs)
    crit: notable
    conf: 0.5
    if:
      type: symbol
      regex: '(fs|fse|fsExtra)\.remove'
composite_rules:
  - id: remove
    desc: References native file-removal API
    crit: notable
    conf: 0.9
    any:
      - id: remove-binary-symbol
      - id: remove-source-call
  - id: delete-comp
    desc: References native file-deletion APIs
    crit: component
    conf: 0.3
    any:
      - id: unlink
      - id: micro-behaviors/fs/delete/file/syscall::unlinkat
      - id: remove
    downgrade:
      any:
        - id: metadata/lang/compiled/
        - id: metadata/lang/compiler/systems::go-binary
