defaults:
  platforms: [windows]
  for: [vbs, asp, html]

traits:
  - id: chr-frag-dot-de
    desc: Chr-encoded fragment matching ".De"
    crit: component
    conf: 0.78
    if:
      type: text
      regex: 'chrw?\(\s*46\s*\)\s*[&+]\s*chrw?\(\s*(68|100)\s*\)\s*[&+]\s*chrw?\(\s*(69|101)\s*\)'
      case_insensitive: true

  - id: chr-frag-tef-mid
    desc: Chr-encoded fragment matching "teF"
    crit: component
    conf: 0.78
    if:
      type: text
      regex: 'chrw?\(\s*(84|116)\s*\)\s*[&+]\s*chrw?\(\s*(69|101)\s*\)\s*[&+]\s*chrw?\(\s*(70|102)\s*\)'
      case_insensitive: true

  - id: chr-frag-fil-tail
    desc: Chr-encoded fragment matching "Fil"
    crit: component
    conf: 0.78
    if:
      type: text
      regex: 'chrw?\(\s*(70|102)\s*\)\s*[&+]\s*chrw?\(\s*(73|105)\s*\)\s*[&+]\s*chrw?\(\s*(76|108)\s*\)'
      case_insensitive: true

composite_rules:
  - id: chr-encoded-fso-deletefile
    desc: Chr-encoded FSO DeleteFile call
    crit: notable
    conf: 0.95
    near_bytes: 160
    all:
      - id: chr-frag-dot-de
      - id: chr-frag-tef-mid
      - id: chr-frag-fil-tail
