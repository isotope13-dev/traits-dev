defaults:
  platforms: [android]
  for: [apk]
  crit: notable
  conf: 0.86
  attack: T1485

# The random-access file handle this composite overwrites through lives in
# micro-behaviors/fs/file/read-write::android-random-access-file -- referencing
# a class is not by itself a shredder, so the neutral capability stays there and
# the shredder context is assembled here.
traits:
  - id: android-sync-write-mode
    desc: Java synchronous write mode string
    crit: component
    conf: 0.9
    if:
      type: string_literal
      exact: "rws"

  - id: android-shredder-workflow
    desc: Android shredder workflow strings
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: "Shredder(File|Document|ImagesVideo)|shredFiles"

  - id: android-shredder-resource-assets
    desc: Android shredder resource assets
    crit: component
    conf: 0.9
    if:
      type: text
      regex: "res/.{0,80}/(ic_|bg_).{0,80}shredder"

composite_rules:
  - id: android-secure-overwrite-delete
    desc: Android secure overwrite deletion
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/fs/file/read-write::android-random-access-file
      - id: android-sync-write-mode
      - id: android-shredder-workflow
      - id: micro-behaviors/fs/delete/file::java-file-delete-bytecode

  - id: android-file-shredder-module
    desc: Android file shredder module
    crit: component
    conf: 0.91
    all:
      - id: android-shredder-resource-assets
      - id: metadata/package/files/mobile-package::apk-multiple-secondary-dex
