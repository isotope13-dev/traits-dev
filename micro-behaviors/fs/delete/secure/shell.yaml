defaults:
  platforms: [unix]
  for: [shell, binaries]
  crit: notable
  conf: 0.8
  mbc: F0005
traits:
  # `shred -<flag> <target>` overwrites target contents. GNU shred only unlinks
  # the target when requested with -u. This neutral secure-wipe capability is
  # used by privacy tools and scripts clearing temporary secrets; destructive
  # raw-device wiping is detected separately under impact/wipe/disk/device.
  - id: shred-file-overwrite
    desc: shred command overwrites target contents
    if:
      type: text
      substr: shred -
    unless:
      - id: metadata/package/files/system-package::shell-completion-script
