defaults:
  crit: notable
  platforms: [windows]
  for:
    - pe
    - dll
    - c
    - cpp
  attack: T1485
  mbc: F0005
traits:
  - id: sdelete-command-reference
    desc: SDelete secure deletion command
    conf: 0.96
    attack: T1070.004
    for: [powershell, batch]
    if:
      type: text
      regex: '(?i)\bSDelete(\.exe)?\b'

  - id: sdelete-usage-text
    desc: SDelete secure deletion usage text
    conf: 0.98
    if:
      type: text
      substr: "usage: sdelete [-p passes]"
  - id: sdelete-tempfiles
    desc: SDelete temporary overwrite files
    conf: 0.96
    count_min: 2
    if:
      type: text
      substr: SDELTEMP
  - id: fsctl-set-zero-data
    desc: Windows sparse file zeroing control
    conf: 0.94
    if:
      type: text
      substr: FSCTL_SET_ZERO_DATA
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: metadata/lang/compiler/managed::delphi
  - id: cipher-free-space-overwrite
    desc: Windows Cipher overwrites unused volume space
    conf: 0.98
    attack: T1070.004
    for: [scripts, source, binaries]
    if:
      type: text
      # /w:<directory> is Cipher's free-space overwrite operation. Accept a
      # drive root or subdirectory while keeping the matcher on command syntax.
      regex: '(?i)\bcipher(\.exe)?\s+/w:([A-Z]:)?[\\/][^\s"''<>|]{0,180}'
composite_rules:
  - id: sdelete-secure-delete
    desc: SDelete secure deletion capability
    conf: 0.97
    any:
      - id: sdelete-usage-text
      - id: sdelete-tempfiles
