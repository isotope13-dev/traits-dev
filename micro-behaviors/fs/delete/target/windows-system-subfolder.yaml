# DEL, RD or DELTREE aimed at the Windows System or System32 folder. These
# folders hold the OS libraries and drivers, so deleting from them breaks
# the install.
traits:
  - id: batch-delete-windows-system-folder
    desc: Batch deletes from Windows System folder
    crit: suspicious
    conf: 0.93
    attack: T1485
    platforms: [windows]
    for: [batch]
    if:
      type: text
      regex: '(?im)^\s*@?(deltree|rd|rmdir|del|erase)\b[^\r\n]{0,30}[a-z]:\\win(dows|nt)\\system(32)?\\'
