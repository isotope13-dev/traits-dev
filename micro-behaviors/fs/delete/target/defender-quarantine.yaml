defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-delete-defender-quarantine
    desc: Batch deletes Windows Defender quarantine files
    crit: notable
    conf: 0.96
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^(del|erase|rmdir|rd)\b[^\r\n]{0,160}\\Windows Defender\\Quarantine(\\|"|\s|$)'
  - id: batch-delete-defender-scan-history
    desc: Batch deletes Windows Defender scan history
    crit: notable
    conf: 0.96
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^(del|erase|rmdir|rd)\b[^\r\n]{0,160}\\Windows Defender\\Scans\\History(\\|"|\s|$)'
