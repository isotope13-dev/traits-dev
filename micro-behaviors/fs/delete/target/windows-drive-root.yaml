defaults:
  platforms: [windows]
  for: [batch]
  attack: T1485

# RD / RMDIR with /S aimed at a bare drive letter (`rmdir /s /q C:`) removes
# every file and folder on that volume that is not locked.
traits:
  - id: windows-drive-root-recursive-delete
    desc: Batch recursively removes a drive root
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '(?im)^\s*rm?d(ir)?\s+((/[sq]\s+){1,2}[a-z]:\\?|[a-z]:\\?\s+(/[sq]\s*){1,2})\s*$'
  - id: batch-del-drive-root-wildcard
    desc: Batch deletes files from drive root
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?im)^\s*del\b[^\r\n]{0,30}[a-z]:\\\*\.\*'
  - id: batch-del-drive-root-multi-drive
    desc: Batch deletes roots across multiple drives
    crit: notable
    conf: 0.95
    count_min: 3
    if:
      type: text
      regex: '(?im)^\s*del\b[^\r\n]{0,30}[a-z]:\\\*\.\*'
