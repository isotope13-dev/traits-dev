defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
  attack: T1485
traits:
  - id: windows-system32-delete-cmd-first
    desc: Delete command precedes System32 target path
    crit: suspicious
    platforms:
      - windows
    if:
      type: text
      # The rmdir/rd/remove branch captures the rest of the path so the
      # nested-file exclusion below can see it.
      regex: \b(rmdir|rd|remove)\b.{0,40}[Ss]ystem32\S{0,40}|\bdel\b.{0,40}[Ss]ystem32\\[^\n"]{0,24}
      not:
        - regex: '@%systemroot%\\system32\\[^",<]+,-[0-9]+'
        - substr: .lnk
        # A named file two or more folders below System32 (an mIRC bot
        # removing its own staged `Setup\drona\mirc.reg`) is one file in a
        # private staging folder, not System32 deletion. Wildcards, System32
        # itself, `drivers\x.sys` and `drivers\etc\hosts` still match.
        - regex: '(?i)system32\\[^\\\s*]+\\[^\\\s*]+\\[^\\\s*]+\.[a-z0-9]{1,4}'
        # Safety-rule catalogs abbreviate the blocked command (`rd /s /q
        # ...System32`) or store it as a regex (`/rd\s+.*System32/`).
        - regex: '(?i)\.\.\.System32'
        - regex: '(?i)\b(rd|rmdir|del|remove)\\s'
    unless:
      - id: metadata/signed/platform/
      - id: metadata/package/testing/harness/runtime::bun-assertion-suite
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
      - id: well-known/lib/native/pywin32::pywin32-binding-module
      # A Go binary stores its string constants back to back with no
      # separator, so `...system32` and an unrelated `/C del` constant look
      # adjacent in a string dump.
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/lang/compiler/systems::go-pe-binary-context
      # Windows image servicing deletes named files out of an offline mount
      # (`del /f /q "%_mount%\Windows\System32\downlevel\wdscore.dll"`), not
      # out of the running system.
      - id: well-known/tool/development/cli/batch-scripts::uup-converter-wimlib-batch
  - id: windows-system32-delete-path-first
    desc: System32 target precedes deletion command
    crit: suspicious
    platforms:
      - windows
    if:
      type: text
      regex: '(?i)System32(\\\\\*|["'' ])[^\])]{0,40}\b(del|rd|rmdir)($|[\s/\\",;=+&|<>])'
    not:
      # Adjacent deny-list entries (`"…System32","del /f …"`) are two quoted
      # rules, not one command that deletes System32.
      - regex: '(?i)","\s*(del|rd|rmdir)\b'
    unless:
      - id: well-known/lib/ai/unsloth::unsloth-package-context
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
      # Agent safety scanners quote destructive commands (mklink + del) as
      # detection corpus; CodeBuddy's headless CLI carries those guards.
      - id: well-known/app/ai/coding-agent/codebuddy::codebuddy-headless-context
      - id: well-known/app/ai/agent-runtime/aui-agent-builder/
      - id: well-known/lib/native/pywin32::pywin32-binding-module
      # Go string constants sit back to back with no separator (see the
      # delete-command-first trait above), so a `system32` constant can abut an
      # unrelated `/C del` constant in a compiled Go program.
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/lang/compiler/systems::go-pe-binary-context
  - id: windows-delete-target-systemroot
    desc: Deletion command targets SYSTEMROOT path
    crit: notable
    platforms:
      - windows
    if:
      type: text
      regex: '(?i)\b(del|erase|rd|rmdir)\b[^\r\n]{0,160}%SYSTEMROOT%'
    unless:
      - id: metadata/file/string/application-name::microsoft-activation-script-benign-context
composite_rules:
  - id: windows-system32-delete
    desc: Deletion command references System32 target
    crit: suspicious
    conf: 0.95
    platforms:
      - windows
    any:
      - id: windows-system32-delete-cmd-first
      - id: windows-system32-delete-path-first
