# The same Windows system folder removed on more than one drive letter: the
# author does not know where the OS lives and sweeps every candidate.
traits:
  - id: windows-dir-delete-multi-drive
    desc: Removes Windows folder on several drives
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [batch]
    count_min: 2
    if:
      type: text
      regex: '(?im)^[ \t]*rm?d(ir)?\b.{0,30}\b[a-z]:\\windows\b'
