traits:
- platforms:
  - unix
  - windows
  id: windows-delete-target-windir-text
  desc: Deletion text references a WINDIR path
  crit: notable
  if:
    type: text
    regex: (?i)\b(del|erase|rd|rmdir)\b[^\r\n]{0,160}%WINDIR%
    platforms:
    - windows
  unless:
  - id: metadata/file/string/application-name::microsoft-activation-script-benign-context
composite_rules:
- platforms:
  - unix
  - windows
  id: windows-delete-system-path-observations
  desc: Deletion text references Windows system paths
  crit: notable
  any:
  - id: micro-behaviors/fs/delete/target::windows-delete-target-windir-text
  - id: micro-behaviors/fs/delete/target::windows-delete-target-systemroot
- platforms:
  - windows
  id: windows-delete-system-path-profile
  desc: Windows deletion and system-path observations
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/fs/delete/directory::recursive-remove-system-path-profile
  - id: micro-behaviors/fs/delete/file/command::forced-quiet-delete-system-path-profile
defaults:
  for:
  - scripts
  - binaries
