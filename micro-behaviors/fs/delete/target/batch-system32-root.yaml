defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-rmdir-system32-root
    desc: RMDIR targets the System32 directory
    crit: notable
    conf: 0.98
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^r(mdir|d)\s+.{0,12}(Windows|%windir%|%SystemRoot%)\\System32("|\s|$)'
