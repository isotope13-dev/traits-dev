traits:
- platforms:
  - windows
  for:
  - batch
  - powershell
  id: decoded-powershell-batch-updatepath-removal
  desc: Decoded PowerShell batch and update-path removal
  crit: suspicious
  conf: 0.95
  if:
    type: encoded
    regex: Remove-Item\s+\$batch\s+-Force[\s\S]{0,180}Remove-Item\s+\$env:UPDATEPATH
