defaults:
  platforms: [unix, windows]

composite_rules:
  - id: recursive-delete-loop-system-path-cooccurrence
    for: [python, javascript]
    desc: Recursive delete near loop and system paths
    crit: notable
    conf: 0.95
    near_bytes: 1024
    all:
      - id: micro-behaviors/fs/delete/directory::recursive-delete
      - id: micro-behaviors/data/control-flow/iteration::iteration-related-source-observations
      - id: micro-behaviors/fs/path/reference::system-or-library-path-references
    unless:
      - id: micro-behaviors/os/security/command-policy::root-wipe-safety-context
