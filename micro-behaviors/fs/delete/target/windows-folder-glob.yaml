# Wildcard deletes under the Windows folder (`del c:\windows\*.exe`) remove
# system binaries in bulk; a named file is a targeted removal instead.
traits:
  - id: batch-del-windows-folder-glob
    desc: Batch deletes wildcard files in Windows folder
    crit: suspicious
    conf: 0.93
    attack: T1485
    platforms: [windows]
    for: [batch]
    if:
      type: text
      regex: '(?im)^\s*(del|erase)\b[^\r\n]{0,30}[a-z]:\\win(dows|nt)\\\*\.(\*|\w{1,4})'
