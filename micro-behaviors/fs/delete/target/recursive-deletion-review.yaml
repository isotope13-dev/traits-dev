defaults:
  platforms: [windows, unix]
  crit: baseline
  conf: 0.85

traits:
  - id: shell-find-root-delete
    desc: Shell find deletes root filesystem entries
    crit: suspicious
    conf: 0.98
    attack: T1485
    for: [shell]
    if:
      type: text
      # Require a command-line-shaped root traversal and the destructive
      # find action. This does not match prose or comments prefixed with #.
      # A -name/-iname predicate other than a catch-all `*` selects specific
      # entries (patch leftovers, editor backups). That is cleanup, not a
      # root wipe. Path predicates stay in scope: wipers use -path/-prune
      # to skip /proc and /sys while deleting the rest of /.
      regex: '(?m)^[ \t]*find[ \t]+/[ \t]+.{0,180}\-delete\b.{0,80}$'
      not:
        - regex: "-i?name\\s+\\x27[^\\x27]*[^\\x27*][^\\x27]*\\x27[^\\n]{0,80}-delete\\b"
        - regex: "-i?name\\s+\"[^\"]*[^\"*][^\"]*\"[^\\n]{0,80}-delete\\b"
        - regex: "-i?name\\s+(?:\\\\?\\*[^\\s*\\\\]+|[^*\\s\\x27\\x22\\\\])[^\\n]{0,80}-delete\\b"
composite_rules:
  - id: top-level-tree-recursive-delete
    desc: Recursively deletes top-level tree contents
    crit: suspicious
    conf: 0.96
    for: [scripts, source]
    all:
      - id: micro-behaviors/fs/search/command::absolute-tree-top-level-find
      - id: micro-behaviors/fs/search/command::find-exec-recursive-remove
    near_lines: 1
    unless:
      - id: micro-behaviors/fs/search/command::find-age-filter
      # A prune that spares entries by name (keep the `en*` locales) is
      # trimming an image or cache; a wipe deletes everything it finds.
      - id: micro-behaviors/fs/search/command::find-name-exclusion-filter
      - id: micro-behaviors/fs/search/command::find-name-filter
