# VB.NET/VB6 source is not parsed into call sites, so the symbol-based
# sh-empty-recycle-bin atom cannot see a VB call; match the call text.
defaults:
  platforms: [windows]
  for: [vbs]

traits:
  - id: vb-sh-empty-recycle-bin-call
    desc: VB calls SHEmptyRecycleBin
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^[ \t]*SHEmptyRecycleBin[AW]?\('
