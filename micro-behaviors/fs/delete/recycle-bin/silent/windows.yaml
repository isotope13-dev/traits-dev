defaults:
  platforms: [windows]
  for: [c, cpp, binaries, scripts]
composite_rules:
  - id: silent-recycle-bin-empty
    desc: Silent recycle bin emptying
    crit: suspicious
    conf: 0.9
    attack: T1485
    all:
      - id: micro-behaviors/fs/delete/recycle-bin/call::sh-empty-recycle-bin
      - id: micro-behaviors/fs/delete/recycle-bin/flag::sherb-noconfirmation
    downgrade:
      any:
        - id: metadata/binary/framework/
        - id: metadata/binary/symbols/count::many-imports
    unless:
      - id: metadata/lang/source/
      # Zig ships musl and mingw-w64 under lib/zig/libc/ and its own std
      # library under lib/zig/std/: the tree that *defines* these APIs, not
      # one that calls them.
      - id: well-known/lib/development/zig-stdlib/
