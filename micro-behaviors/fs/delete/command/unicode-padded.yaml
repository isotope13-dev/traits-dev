defaults:
  platforms: [windows]
  for: [javascript]

traits:
  - id: unicode-padded-remove-verb
    desc: Unicode-padded Remove verb fragment
    crit: component
    if:
      type: text
      regex: '(?i)R\P{ASCII}{1,32}e\P{ASCII}{1,32}m\P{ASCII}{1,32}o\P{ASCII}{1,32}v\P{ASCII}{1,32}e'

  - id: unicode-padded-item-noun
    desc: Unicode-padded Item noun fragment
    crit: component
    if:
      type: text
      regex: '(?i)-I\P{ASCII}{1,32}t\P{ASCII}{1,32}e\P{ASCII}{1,32}m\s+-'

composite_rules:
  - id: unicode-padded-remove-item-command
    desc: Unicode-padded Remove-Item command fragments
    crit: notable
    conf: 0.95
    near_bytes: 1536
    all:
      - id: unicode-padded-remove-verb
      - id: unicode-padded-item-noun
