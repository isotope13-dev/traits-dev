defaults:
  crit: notable
  platforms: [windows]
  for: [pe, dll, scripts, rust]
traits:
- id: cmd-exe-c-file-delete-command
  desc: Windows cmd.exe /c file deletion command
  conf: 0.9
  if:
    type: literal
    kind: string
    regex: '(?i)\bcmd(\.exe)?\s*/c\s+del\b'
- id: batch-mass-rd
  desc: Removes many directories
  crit: notable
  conf: 0.9
  for: [batch, static-lib]
  count_min: 20
  unless:
    - type: basename
      regex: '(?i)^clean\.(bat|cmd)$'
  if:
    type: text
    regex: '(?im)^rd \S'
