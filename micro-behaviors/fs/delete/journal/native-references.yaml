defaults:
  for: [pe, dll, c, cpp]
  platforms: [windows]
  crit: notable
  conf: 0.96
traits:
  - id: fsctl-delete-usn-journal-name
    desc: Names FSCTL_DELETE_USN_JOURNAL control code
    if:
      type: text
      substr: FSCTL_DELETE_USN_JOURNAL
  - id: usn-delete-flag-name
    desc: Names USN_DELETE_FLAG_DELETE flag
    if:
      type: text
      substr: USN_DELETE_FLAG_DELETE
  - id: delete-usn-journal-data-name
    desc: Names DeleteUsnJournalData structure
    if:
      type: text
      substr: DeleteUsnJournalData
