defaults:
  for: [c, cpp, python, csharp, rust]
  platforms: [windows]
  crit: notable
  conf: 0.97
traits:
  - id: device-io-usn-delete-name
    desc: DeviceIoControl requests USN journal deletion
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])DeviceIoControl$'
      arg:
        index: 1
        kind: identifier
        name: FSCTL_DELETE_USN_JOURNAL
  - id: device-io-usn-delete-code
    desc: DeviceIoControl uses USN journal delete code
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])DeviceIoControl$'
      arg:
        index: 1
        kind: number
        value: 590072
  - id: native-fs-usn-delete-name
    desc: Nt/ZwFsControlFile requests USN journal deletion
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(Nt|Zw)FsControlFile$'
      arg:
        index: 5
        kind: identifier
        name: FSCTL_DELETE_USN_JOURNAL
  - id: native-fs-usn-delete-code
    desc: Nt/ZwFsControlFile uses USN journal delete code
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(Nt|Zw)FsControlFile$'
      arg:
        index: 5
        kind: number
        value: 590072
