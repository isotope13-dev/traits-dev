defaults:
  platforms: [unix]
  for: [shell]
  crit: notable

traits:
  - id: shell-recursive-delete
    desc: Shell recursively removes a path
    conf: 0.9
    # Parse a command, not a line of text: indentation, quoted examples and
    # heredoc bodies must not decide whether this is an rm invocation. Only
    # option words may precede the recursive flag, so `rm -- -r` is excluded.
    if:
      type: tree-sitter
      language: shell
      query: |
        (command
          name: (command_name (word) @tool)
          . argument: (word)* @options
          . argument: (word) @recursive
          argument: (_)
          (#match? @tool "^(/(usr/)?bin/)?rm$")
          (#match? @options "^-[dfiIPRrvW]+$")
          (#match? @recursive "^(-[dfiIPRrvW]*[rR][dfiIPRrvW]*|--recursive)$"))
        (command
          name: (command_name (word) @sudo)
          . argument: (word) @tool
          . argument: (word)* @options
          . argument: (word) @recursive
          argument: (_)
          (#eq? @sudo "sudo")
          (#match? @tool "^(/(usr/)?bin/)?rm$")
          (#match? @options "^-[dfiIPRrvW]+$")
          (#match? @recursive "^(-[dfiIPRrvW]*[rR][dfiIPRrvW]*|--recursive)$"))
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
