defaults:
  platforms: [unix]
  for: [shell]
  crit: notable

traits:
  - id: shell-recursive-delete
    desc: Shell recursively removes a path
    conf: 0.9
    # The flag set has to actually contain -r/-R (or --recursive).  Accepting a
    # lone -f made every `rm -f "$tmpfile"` cleanup line — build scripts, test
    # harnesses, packaging and CI shell — a recursive directory-delete finding,
    # which is neither what the name says nor what the code does.  Matches the
    # stricter non-shell sibling fs/directory/delete/recursive::rm-rf.
    if:
      type: text
      regex: '(?m)(^|[;&|][ \t]*)(sudo[ \t]+)?rm[ \t]+(-[a-zA-Z]*[rR]|--recursive)'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
