defaults:
  platforms: [unix]
  for: [shell]
  crit: notable

traits:
  - id: shell-recursive-delete
    desc: Shell recursively removes a path
    conf: 0.9
    # Parse a command, not a line of text: indentation, quoted examples and
    # heredoc bodies must not decide whether this is an rm invocation. Keep
    # the AST match to one command capture and check its source text in one
    # predicate; repeated wildcard argument captures were a measured query
    # cost outlier on ordinary shell files.
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command) @cmd
          (#match? @cmd "^\\s*(sudo\\s+)?(/(usr/)?bin/)?rm\\s+(-[dfiIPRrvW]+\\s+){0,3}(-[dfiIPRrvW]*[rR][dfiIPRrvW]*|--recursive)(\\s|$)"))
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script

  # The deleted path is an /opt application prefix. Uninstall and teardown
  # scripts clear the add-on package tree the FHS reserves under /opt; seeing
  # the tree removed says the script is removing an installed product, which
  # firewall/agent teardown composites use as context.
  - id: opt-directory-recursive-delete
    desc: Shell recursively removes an /opt directory
    conf: 0.9
    if:
      type: text
      regex: '\brm\s+(--\s+)?(-[a-zA-Z]+\s+){1,3}/opt/\S'

  # Resetting a signing keyring or uninstalling credentials is also legitimate.
  # Observe the operation here; destruction consumers must supply attack context.
  - id: shell-home-credential-directory-delete
    desc: Shell force-removes a HOME credential directory
    conf: 0.96
    if:
      type: tree-sitter
      language: shell
      query: |
        (command
          name: (command_name (word) @tool)
          . argument: (word) @flags
          argument: (_) @target
          (#eq? @tool "rm")
          (#eq? @flags "-rf")
          (#match? @target "^\"?\\$HOME/\\.(ssh|aws|gnupg)(/\\*)?\"?$"))
