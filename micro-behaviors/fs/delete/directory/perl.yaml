defaults:
  platforms: [unix]
  for: [perl]
  crit: notable

traits:
  - id: perl-rmdir-call
    desc: Perl rmdir directory deletion call
    if:
      type: text
      regex: '(?m)^\s*rmdir\b'

  - id: perl-remove-tree-call
    desc: Perl recursively removes a directory tree
    if:
      type: symbol
      kind: call
      regex: '^(File::Path::)?remove_tree$'
