defaults:
  for: [shell]
  platforms: [unix]
traits:
  - id: shell-ssh-config-directory-removal
    desc: Removes SSH daemon config directory variable
    crit: notable
    conf: 0.96
    # Bind actual expansions, not unrelated rm and sshd strings. This is a
    # lexical relationship; intervening variable assignments are not resolved.
    if:
      type: tree-sitter
      language: shell
      query: |
        ((program
          (command name: (command_name (word) @server)
            argument: (word) @configflag
            . argument: (string
              . [(simple_expansion (variable_name) @configured)
                 (expansion (variable_name) @configured)]
              . (string_content) @suffix .))
          (command name: (command_name (word) @remove)
            argument: (word) @recursive
            argument: (string
              . [(simple_expansion (variable_name) @deleted)
                 (expansion (variable_name) @deleted)] .)) @evidence)
          (#match? @server "(^|/)sshd$") (#eq? @configflag "-f")
          (#match? @suffix "^/[^/]+$")
          (#match? @remove "(^|/)rm$")
          (#match? @recursive "^(-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)$")
          (#eq? @configured @deleted))
