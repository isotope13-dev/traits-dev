# File Delete Operations - Shell
# MBC: C0047 (Delete File)
# ATT&CK: T1070.004
defaults:
  attack: T1070.004
  mbc: C0047
  platforms: [unix]
  for: [shell]
traits:
- id: mass-tmp-removal
  desc: Recursively removes the /tmp root
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?m)^\s*rm\s+-rf\s+/tmp/\s*(#.{0,80})?$'
