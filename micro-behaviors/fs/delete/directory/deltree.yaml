defaults:
  platforms: [windows]
  crit: notable
  for: [batch, text]
traits:
  - id: deltree-absolute-path-command
    desc: DELTREE targets an absolute directory path
    conf: 0.95
    if:
      type: text
      regex: '(?im)^[\t ]*@?deltree(\.exe)?\s*([/-]y[\s]*)?([a-z]:)?\\[^\s\r\n]{1,64}'
  - id: deltree-no-confirmation
    desc: DELTREE runs with confirmation suppressed
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^[\t ]*@?deltree\s*/y\b'
