defaults:
  platforms: [windows]
  crit: notable
  for: [batch, text]
traits:
  - id: deltree-absolute-path-command
    desc: DELTREE targets an absolute directory path
    conf: 0.95
    if:
      type: text
      regex: '(?im)^[\t ]*@?deltree(\.exe)?\s*([/-]y[\s]*)?([a-z]:)?\\[^\s\r\n]{1,64}'
  - id: deltree-no-confirmation
    desc: DELTREE runs with confirmation suppressed
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?im)^[\t ]*@?deltree\s*/y\b'
  # Scrambled joke-bat form (Trojan.BAT.KillFiles class): the wildcard
  # target comes first, DELTREE second, and the assume-yes switch is
  # spelled with a backslash, so the line defeats command-position
  # matchers and does not execute as written.
  - id: deltree-reversed-argument-order
    desc: DELTREE appears after its wildcard target
    conf: 0.9
    if:
      type: text
      regex: '(?im)^[\t ]*\*[^ \t\r\n,;]{0,12}[ \t]+deltree(\.exe)?[ \t]+[\\/][a-z]\b'
