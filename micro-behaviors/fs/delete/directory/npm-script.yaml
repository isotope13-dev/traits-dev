# Recursive removal and rmdir support directory deletion; unlink is separate.
defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.85
traits:
  - id: npm-script-directory-delete-command
    desc: Package script declares directory removal
    if:
      type: value
      path: scripts[*]
      regex: '\brm\s+-rf\b|\brmdir\b'
    unless:
      - type: value
        path: scripts[*]
        regex: 'typescript-lib|typescript/lib'
      - id: well-known/app/development/1interface-voice-shell::peer-react-postinstall-dedup
