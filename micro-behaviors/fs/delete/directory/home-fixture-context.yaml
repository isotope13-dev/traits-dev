# Benign-context probes for the home-wipe rules in this directory: ways a
# `home` identifier gets bound to something that is not the user's home root.
# Each states the binding it recognizes; the wipe composites reference them
# from `unless:`. Kept beside the rules they suppress.
defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.85
  for: [go]

traits:
  # A tempdir-backed fake home directory in a test harness or script:
  - id: go-home-mkdtemp-assignment
    desc: Go assigns home from MkdirTemp
    if:
      type: text
      regex: '\b[Hh]ome\s*(,\s*\w+\s*)?:?=\s*(os\.)?MkdirTemp'

  # `t.TempDir()`-style per-test scratch home:
  - id: go-home-tempdir-method-assignment
    desc: Go assigns home from a TempDir method
    if:
      type: text
      regex: '\b[Hh]ome\s*:?=\s*\w+\.TempDir\(\)'

  # The suite itself swaps HOME for a scratch directory, so any in-file
  # `home` binding refers to the fake (os.Setenv("HOME", tempdir)):
  - id: go-home-setenv-replacement
    desc: Go replaces the HOME environment variable
    if:
      type: text
      regex: 'Setenv\(\s*"HOME"'

  # Joined subdirectory or temp prefix (not bare home root):
  - id: go-home-join-assignment
    desc: Go assigns home from filepath.Join
    if:
      type: text
      regex: '\b[Hh]ome\s*:?=\s*filepath\.Join'

  # Ephemeral/isolated home directory created in sandbox/tempdir. A naming
  # fragment, not a binding: it only corroborates fixture context.
  - id: go-home-isolated-naming
    desc: Isolated home directory naming
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'Isolated\w*Home'

  # Application home directory returned by a `.Home()` accessor, not the
  # user's home root: `home, err := c.Home()` in Ignite's chain InitChain
  # is the blockchain node's data dir (`~/.<app>` or a configured chain
  # home), removed as documented pre-init cleanup. `os.UserHomeDir()`
  # has no `.Home()` call and still matches.
  - id: go-home-accessor-binding
    desc: Go binds home from a Home accessor
    if:
      type: text
      regex: '\b[Hh]ome\s*(,\s*\w+\s*)?:?=\s*\w+\.Home\(\)'
