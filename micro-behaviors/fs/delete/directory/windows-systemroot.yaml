defaults:
  platforms: [windows]

traits:
  - id: batch-delete-target-systemroot
    desc: Windows deletion command targets SystemRoot
    for: [batch]
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?im)^\s*@?(del|erase|rmdir|rd|deltree)\s+[/a-z \t]{0,30}"?%systemroot%([\\/]|"?(\s|$))'

  - id: embedded-delete-target-systemroot
    desc: Embedded Windows command deletes SystemRoot
    for: [binaries, shell, javascript, powershell]
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b(del|erase|rmdir|rd|deltree)\s+(/[a-z]\s{1,8}){0,6}"?%systemroot%([\\/]|"?(\s|$))'

composite_rules:
  - id: windows-delete-target-systemroot
    desc: Windows deletion command targets SystemRoot
    for: [binaries, scripts]
    crit: notable
    conf: 0.98
    any:
      - id: batch-delete-target-systemroot
      - id: embedded-delete-target-systemroot
