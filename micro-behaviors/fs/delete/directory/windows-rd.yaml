defaults:
  platforms: [unix, windows]
traits:
  - id: windows-rd-recursive-command
    desc: Recursive rd/rmdir deletion command text
    crit: component
    for: [scripts, binaries, -python, -javascript, -typescript]
    if:
      type: text
      regex: \br(d|mdir)\s+/s\b
      platforms:
        - windows
  - id: windows-rd-recursive-string
    desc: Recursive rd/rmdir deletion command text
    crit: component
    for: [python, javascript, typescript]
    if:
      type: literal
      regex: \br(d|mdir)\s+/s\b
      platforms:
        - windows
composite_rules:
  - id: windows-rd-recursive
    desc: Recursive rd/rmdir deletion command text
    crit: notable
    for: [scripts, binaries]
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
    any:
      - id: windows-rd-recursive-command
      - id: windows-rd-recursive-string
