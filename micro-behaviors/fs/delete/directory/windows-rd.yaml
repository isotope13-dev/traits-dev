traits:
  - id: windows-rd-recursive
    desc: Recursive delete via rd/rmdir /s
    platforms: [unix, windows]
    for: [scripts, binaries]
    crit: notable
    if:
      type: text
      regex: \br(d|mdir)\s+/s\b
      platforms:
        - windows
    unless:
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context
