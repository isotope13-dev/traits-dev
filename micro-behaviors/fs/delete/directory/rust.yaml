# File Delete Operations - Rust
# MBC: C0047 (Delete File)
# ATT&CK: T1070.004
defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  attack: T1070.004
  mbc: C0047
  for: [rust]
traits:
  - id: fs-remove_dir
    desc: Delete directory
    if:
      type: symbol
      kind: call
      exact: "fs::remove_dir"
  - id: fs-remove_dir_all
    desc: Recursive directory deletion
    if:
      type: symbol
      kind: call
      exact: "fs::remove_dir_all"
