defaults:
  platforms: [windows, unix]
  for: [pe, dll]
traits:
  - id: dotnet-directory-delete-call
    desc: Calls managed directory deletion API
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: System.IO.Directory.Delete

  - id: dotnet-directory-delete-import
    desc: Imports managed directory deletion API
    crit: notable
    conf: 0.99
    if:
      type: import
      exact: System.IO.Directory.Delete
