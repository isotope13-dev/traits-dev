defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-deltree-repeated-drive-wildcards
    desc: Repeated DELTREE drive-wildcard commands
    crit: notable
    conf: 0.98
    count_min: 2
    if:
      type: text
      regex: '(?im)^\s*@?deltree\s*/y\s+[a-z]:\\?\*\.\*'
  - id: batch-deltree-repeated-drive-roots
    desc: Repeated DELTREE commands target roots
    crit: notable
    conf: 0.98
    count_min: 2
    if:
      type: text
      regex: '(?im)^\s*@?deltree\s*/y\s+[a-z]:\\[ \t]*[>\r\n]'
