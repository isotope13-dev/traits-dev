defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.96

traits:
  - id: shell-multiple-home-content-targets
    desc: rm targets distinct home content directories
    # Call facts flatten quoted expansions and single-quoted literal dollars
    # into the same string. Require actual HOME expansions in the syntax tree.
    # Exact top-level operands exclude cache subtrees and relative fixtures.
    unless:
      # A script-local HOME or rm definition makes the host-target inference
      # uncertain. No new policy-specific engine facts are needed for this.
      - type: symbol
        kind: bind
        exact: HOME
      - type: symbol
        kind: function
        exact: rm
    if:
      type: tree-sitter
      language: shell
      query: |
        (command
          name: (command_name (word) @tool)
          argument: (string
            . [(simple_expansion (variable_name)) (expansion)] @home1
            . (string_content) @folder1 .)
          argument: (string
            . [(simple_expansion (variable_name)) (expansion)] @home2
            . (string_content) @folder2 .)
          (#match? @tool "^(/(usr/)?bin/)?rm$")
          (#match? @home1 "^\\$(HOME|\\{HOME\\})$")
          (#match? @home2 "^\\$(HOME|\\{HOME\\})$")
          (#match? @folder1 "^/(Documents|Desktop|Pictures)$")
          (#match? @folder2 "^/(Documents|Desktop|Pictures)$")
          (#not-eq? @folder1 @folder2))
