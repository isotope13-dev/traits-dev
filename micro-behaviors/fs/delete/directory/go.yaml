defaults:
  platforms: [windows, linux, macos]
  mbc: C0047
  attack: T1070.004
traits:
  - id: os-RemoveAll
    desc: Recursive directory deletion
    crit: notable
    conf: 0.9
    for:
      - go
    if:
      type: symbol
      kind: call
      exact: os.RemoveAll
  - id: os-RemoveAll-string
    desc: os.RemoveAll string in binary
    # Baseline for the same reason as os-Remove-string.
    crit: baseline
    conf: 0.7
    for: [scripts, binaries]
    if:
      type: text
      substr: os.RemoveAll
