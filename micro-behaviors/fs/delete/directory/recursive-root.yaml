defaults:
  platforms:
    - unix
    - windows
  # This is a shell-command observation.  Do not scan Python, Go, or other
  # source/binary strings: prompt fixtures and documentation commonly quote
  # the command without executing it.
  for: [shell, batch, powershell]
traits:
  - id: recursive-root
    desc: Recursive Root Directory Deletion
    crit: suspicious
    conf: 1.0
    unless:
      - id: objectives/supply-chain/trojanized/app/debug-probe/
      - id: micro-behaviors/os/security/command-policy/gate::command-policy-implementation-context
      - id: micro-behaviors/os/security/command-policy/gate::packed-destructive-shell-command-table
      - id: micro-behaviors/os/security/command-policy/denylist-data::deny-rule-policy-file
      - id: well-known/tool/detection/code-analysis/semgrep::rule-test-annotation
      - id: metadata/file/catalog/pattern-rules::cleave-trait-definition-file
    if:
      type: text
      # Match an executable command line, including a trailing shell control
      # operator.  `rm -rf /*&` is still a root wipe; `&` only backgrounds it.
      # The command may follow a separator or subshell paren (`(` also covers `$(`), under sudo,
      # with extra flags (`-rfv`). A leading quote or comment remains excluded
      # so documentation and prompt examples do not become wiper behavior.
      # `Bash(rm -rf /*)` is an agent permission rule naming a command to
      # deny, not a subshell; the optional prefix lets `not` reject it.
      regex: '(?m)(Bash\(|^|[;&|(])\s*(sudo\s+)?rm\s+-\w*[rRfF]\w*\s+/\*\s*([;&|)]{1,3}\s*)?(#.{0,99})?$'
    not:
      - regex: '^Bash\('
  # The preserve-root bypass names no glob: `rm -rf --no-preserve-root /`
  # removes the root filesystem as surely as `rm -rf /*`. The flag alone is
  # not the claim: `rm --no-preserve-root -rf /tmp/test` only names a temp
  # path, so the regex requires a bare `/` target after the flag.
  - id: recursive-root-no-preserve
    desc: rm --no-preserve-root targets filesystem root
    crit: suspicious
    conf: 0.95
    unless:
      - id: objectives/supply-chain/trojanized/app/debug-probe/
      - id: micro-behaviors/os/security/command-policy/gate::command-policy-implementation-context
      - id: micro-behaviors/os/security/command-policy/gate::packed-destructive-shell-command-table
      - id: micro-behaviors/os/security/command-policy/denylist-data::deny-rule-policy-file
      - id: well-known/tool/detection/code-analysis/semgrep::rule-test-annotation
      - id: metadata/file/catalog/pattern-rules::cleave-trait-definition-file
    if:
      type: text
      regex: '(?m)(^|[;&|(])\s*(sudo\s+)?rm\s.{0,60}--no-preserve-root.{0,40}\s/([\s*;&|)"'']|$)'
    not:
      - regex: '^Bash\('
  # Split flags (`rm -r -f /*`) put the recursive flag in its own token.
  - id: recursive-root-split-flags
    desc: Recursive root glob removal with split flags
    crit: suspicious
    conf: 0.95
    unless:
      - id: objectives/supply-chain/trojanized/app/debug-probe/
      - id: micro-behaviors/os/security/command-policy/gate::command-policy-implementation-context
      - id: micro-behaviors/os/security/command-policy/gate::packed-destructive-shell-command-table
      - id: micro-behaviors/os/security/command-policy/denylist-data::deny-rule-policy-file
      - id: well-known/tool/detection/code-analysis/semgrep::rule-test-annotation
      - id: metadata/file/catalog/pattern-rules::cleave-trait-definition-file
    if:
      type: text
      # Two flag tokens, one holding the recursive flag, so `rm -rf /*` stays
      # with recursive-root and only the split spelling lands here.
      # The `Bash\(` alternative lets `not` reject an agent permission rule
      # such as `Bash(rm -r -f /*)`, as recursive-root does.
      regex: '(Bash\(|^|[;&|(])\s*(sudo\s+)?rm\s+(-\w+\s+-\w*[rR]\w*|-\w*[rR]\w*\s+-\w+)\s+/\*'
    not:
      - regex: '^Bash\('
