defaults:
  platforms:
    - unix
    - windows
  # This is a shell-command observation.  Do not scan Python, Go, or other
  # source/binary strings: prompt fixtures and documentation commonly quote
  # the command without executing it.
  for: [shell, batch, powershell]
traits:
  - id: recursive-root
    desc: Recursive Root Directory Deletion
    crit: suspicious
    conf: 1.0
    unless:
      - id: micro-behaviors/process/create/shell/guard/
      - id: well-known/tool/detection/
      - id: objectives/supply-chain/trojanized/app/debug-probe/
      # Linters and their fixtures state the wipe as the pattern under test:
      # a Rust unit-test harness (`#[cfg(test)]`, `#[test]`, test_snippet)
      # or a path under a test directory is detector content, not an
      # execution path.
      - id: metadata/package/testing/harness/unit/
      - id: metadata/path::test-directory-component
    if:
      type: text
      # Match an executable command line, including a trailing shell control
      # operator.  `rm -rf /*&` is still a root wipe; `&` only backgrounds it.
      # A leading quote or comment remains excluded so documentation and prompt
      # examples do not become wiper behavior.
      regex: '(?m)^[ \t]*rm\s+-[rRfF]{1,2}\s+/\*[ \t]*([;&|]{1,2}[ \t]*)?(#.{0,120})?$'
