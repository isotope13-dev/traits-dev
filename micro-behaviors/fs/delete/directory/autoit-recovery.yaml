defaults:
  platforms: [windows]
  for: [text, data, vbs]
traits:
  - id: autoit-remove-system-volume-information
    desc: AutoIt deletes System Volume Information
    crit: notable
    conf: 0.99
    if:
      type: raw
      regex: '(?i)\bDirRemove\s*\([^\r\n]{0,48}\\system volume information"\s*,\s*1\s*\)'
