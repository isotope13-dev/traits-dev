# Recursive deletion of the user's home *root* -- not a subtree under it.
#
# The two existing neighbours only see this through a shell: `recursive-root`
# matches `rm -rf /*` in shell/batch/powershell text, and
# `shell-multiple-home-content-targets` needs two distinct `$HOME/Documents`
# -style operands in a tree-sitter shell query. A compiled or interpreted
# program that calls the deletion API directly was invisible -- there is no
# Rust or Go recursive-delete atom anywhere in the tree, and the Python and
# Node ones are neutral `notable`s that say nothing about the operand.
#
# Found on the `vplsfpoael` crate, a joke esolang whose interpreter implements
# `delete_home_directory` as `std::fs::remove_dir_all(home::home_dir())`. Joke
# or not, those are the bytes, and they scored nothing at all.
#
# What makes this precise is the *shape of the argument*, not proximity: the
# home root has to be the whole operand. An uninstaller deleting
# `home_dir.join(".cache")` or `~/.config/app` has something after the home
# reference and does not match; only a program handing the bare home directory
# to a recursive delete does. That is why each language gets its own atom
# rather than a near_bytes pairing of "deletes recursively" with "knows where
# home is" -- every uninstaller on the registry has both of those.
#
# Seven languages because the operand shape, not the API, is the invariant:
# a variant that ports this to Go or C# is the same behaviour spelled
# differently, and the next one will be in whichever language is convenient.
defaults:
  platforms: [unix, windows]
  crit: suspicious
  conf: 0.95
  attack: T1485
  mbc: C0047

traits:
  # `remove_dir_all(home_dir)`, `remove_dir_all(&home)`. The `\)` immediately
  # after the home token is what excludes `home_dir.join(".cache")`.
  - id: rust-home-directory-wipe
    desc: Rust recursively deletes the home directory
    for: [rust]
    if:
      type: text
      # The `\w{0,12}` prefix this used to carry matched `codex_home` in
      # cc-switch-cli -- an application's own `XXX_HOME` config directory,
      # which is a subdirectory of the real home and an extremely common
      # Rust identifier. `home` has to start the name.
      regex: 'remove_dir_all\s*\(\s*&?home\w{0,10}\s*\)'
    unless:
      # A Rust test that fabricates a HOME in a tempdir, points `$HOME` at it
      # and removes it again is the single most common way this pattern
      # appears in honest code -- CodeWhale's config crate does exactly that
      # to exercise its config migration. The variable really is called
      # `home` and really is a home directory; it is just not the user's.
      # A wipe that only exists inside `#[cfg(test)]` never runs on anyone.
      - id: metadata/package/testing/harness/unit::rust-test
      - id: metadata/package/testing/presence/harness::rust-tests-directory-path
      # `if let Some(home) = &codex_home { remove_dir_all(home) }`: the binding
      # is renamed `home`, but it holds an application's own data directory
      # (OpenAI Codex's sandbox uninstaller removes the CODEX_HOME it created),
      # not the user's home root.
      - type: text
        regex: 'Some\(home\)\s{0,3}=\s{0,3}&?(codex|app|sandbox)\w{0,12}_home\b'
      - id: rust-temp-home-cleanup

  # `os.RemoveAll(os.UserHomeDir())` and the two-step form that binds the
  # result first (`home, _ := os.UserHomeDir(); os.RemoveAll(home)`).
  - id: go-home-directory-wipe
    desc: Go recursively deletes the home directory
    for: [go]
    if:
      type: text
      # `homeDir` is a local fixture (`RemoveAll(homeDir)` in an e2e helper).
      # The wipe is `RemoveAll(home)` or `RemoveAll(os.UserHomeDir())`.
      regex: 'RemoveAll\s*\(\s*(os\.UserHomeDir\(\)|[Hh]ome)\s*[,)]'
    unless:
      # Same shape as the Rust carve-out above, in the language that does it
      # most: snapd's `snapshotstate_test.go` builds two fake home directories
      # in a tempdir and tears them down with `os.RemoveAll(homedirB)`. A wipe
      # that only runs under `go test` never reaches a user's home.
      - id: metadata/package/testing/harness/unit::go-test
      # Tempdir-backed fake home directory in a test harness or script:
      - type: text
        regex: '\bhome\s*,\s*\w+\s*:?=\s*(os\.)?MkdirTemp'
      # Joined subdirectory or temp prefix (not bare home root):
      - type: text
        regex: '\bhome\s*:?=\s*filepath\.Join'
      # Ephemeral/isolated home directory created in sandbox/tempdir:
      - type: text
        regex: 'Isolated\w*Home'



  # `shutil.rmtree(Path.home())` / `shutil.rmtree(os.path.expanduser("~"))`.
  # The `~` has to be bare: `expanduser("~/.ssh")` is a different behaviour
  # and is covered by the credential-path traits.
  - id: python-home-directory-wipe
    desc: Python recursively deletes the home directory
    for: [python]
    if:
      type: text
      regex: 'rmtree\s*\(\s*(Path\.home\(\)|[\w.]{0,20}expanduser\(\s*["'']~["'']\))\s*[,)]'

  # `fs.rmSync(os.homedir(), {recursive: true})` and the rmdir spellings.
  - id: node-home-directory-wipe
    desc: Node deletion call targets the home root
    for: [javascript, typescript]
    if:
      type: text
      regex: '\.rm(dir)?(Sync)?\s*\(\s*(os\.)?homedir\(\)'

  # `rm -rf $HOME` / `rm -rf ~` with nothing following the home reference.
  # A trailing comment or shell operator is still the same command; a trailing
  # path component (`rm -rf ~/.cache`) is not and does not match.
  #
  # Written command text only. Text conditions also scan compiled binaries as
  # extracted string runs, and the run splitter cuts Rust's adjacent string
  # literals at punctuation: watchmen-cli's `rm -rf ~/.cache` cleanup surfaced
  # as a bare `rm -rf ~` run -- byte-for-byte a wipe line -- while the same
  # binary's real strings were a cache cleanup and its documented uninstall
  # instruction. Fragment runs cannot be told from written commands, so
  # compiled binaries are excluded outright; an embedded wipe needs
  # call-shaped evidence, which the run fragments do not preserve either way.
  - id: shell-home-directory-wipe
    desc: Shell recursively deletes the home directory
    crit: notable
    conf: 0.9
    for: [shell]
    platforms: [unix]
    if:
      type: text
      # Leading [^\n]{0,30} brings the line start into the match so `not:`
      # can filter out commented-out examples and documentation.
      regex: '(?m)^[^\n]{0,30}[;"''|&]?\s*rm\s+-[rRfF]{1,2}\s+["'']?(\$\{?HOME\}?|~/?)["'']?\s*([;&|#]|$)'
    not:
      - substr: DANGEROUS_COMMAND_BLOCKED
      - regex: '^\s*(#|//|\*|--)'
    unless:
      # `for: [shell]` still evaluates text extracted from a PE. A command in
      # a compiled binary's read-only string table is only a reference; this
      # line matcher cannot establish that the program invokes it. Keep shell
      # script detections, and require call-shaped evidence for binary cases.
      - id: metadata/file/magic/identity::pe-dos-stub
      - id: micro-behaviors/process/create/shell/guard/
      - id: metadata/package/testing/
      - id: metadata/file/naming::test-directory-component
      - id: metadata/file/encoding::go-test-base64-layer
      - id: well-known/tool/offensive/dalfox::dalfox-scanner-context
      - type: path
        regex: 'regex-derivations-v[0-9]+\.json##base64@[0-9a-fx]+$'
      - type: section
        regex: '(\.text|__text|\.code)'

  # Commons-IO `FileUtils.deleteDirectory(new File(System.getProperty("user.home")))`
  # and the Kotlin `deleteRecursively()` spelling.
  - id: java-home-directory-wipe
    desc: JVM recursively deletes the home directory
    for: [java, kotlin, java_class, class]
    if:
      type: text
      regex: '(deleteDirectory|deleteRecursively)\s*\([^)\n]{0,40}user\.home'

  # `Directory.Delete(Environment.GetFolderPath(...UserProfile), true)` -- the
  # trailing `true` is the recursive flag, and without it this is a no-op on a
  # non-empty home.
  - id: csharp-home-directory-wipe
    desc: C# recursively deletes the home directory
    for: [csharp]
    if:
      type: text
      regex: 'Directory\.Delete\s*\([^,\n]{0,40}UserProfile[^)\n]{0,20},\s*true'

  - id: rust-temp-directory-reference
    desc: Rust references the system temporary directory
    crit: notable
    for: [rust]
    if:
      type: text
      substr: 'std::env::temp_dir()'

  - id: rust-home-helper-binding
    desc: Rust binds home from a helper
    crit: notable
    for: [rust]
    if:
      type: text
      regex: '\blet\s+home\s*=\s*\w+\(\)'

composite_rules:
  # A benchmark or example can call its temporary fixture `home`; the temp
  # root plus a local home binding are enough to distinguish that cleanup from
  # handing the user's home root to remove_dir_all.
  - id: rust-temp-home-cleanup
    desc: Rust removes a home fixture built under the system temporary directory
    crit: exception
    conf: 0.9
    all:
      - id: rust-temp-directory-reference
      - id: rust-home-helper-binding
    near_bytes: 16000

  # Language dispatch, not evidence accumulation -- every leg is the same
  # behaviour spelled for a different runtime, so there is no `needs:`. A bare
  # `any:` performs no intent inference and the engine caps it at suspicious
  # for exactly that reason; the hostile reading lives in
  # objectives/impact/destroy/user-data/home-root.yaml,
  # where the delete is joined
  # to a second destructive primitive.
  - id: home-directory-wipe
    desc: Recursively deletes the user home directory
    crit: suspicious
    conf: 0.95
    any:
      - id: rust-home-directory-wipe
      - id: go-home-directory-wipe
      - id: python-home-directory-wipe
      - id: node-home-directory-wipe
      - id: shell-home-directory-wipe
      - id: java-home-directory-wipe
      - id: csharp-home-directory-wipe
    unless:
      - id: well-known/tool/detection/
      - id: well-known/tool/detection/tirith::tirith-embedded-command-corpus-context
      - id: micro-behaviors/process/create/shell/guard/
      - id: well-known/tool/detection/pattern-catalog::dangerous-command-exec-gateway
