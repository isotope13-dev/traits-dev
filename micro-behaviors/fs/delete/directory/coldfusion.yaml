# `<cffile action="delete">` / `<cfdirectory action="delete">` — the ColdFusion
# spelling of unlink/rmdir. FileFacts identifies ColdFusion pages as `cfml`.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.88
traits:
  - id: cfdirectory-delete
    desc: ColdFusion cfdirectory deletes a directory
    if:
      type: symbol
      kind: call
      exact: cfdirectory
      arg:
        index: 0
        from:
          field: action
          whole_value: '(?i)^delete$'
