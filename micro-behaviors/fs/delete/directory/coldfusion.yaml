# `<cffile action="delete">` / `<cfdirectory action="delete">` — the ColdFusion
# spelling of unlink/rmdir. See metadata/lang/scripted::cfml-output-tag for the
# carrier file types.
defaults:
  platforms: [unix, windows]
  for: [vbs, html, javascript]
  crit: notable
  conf: 0.88
traits:
  - id: cfdirectory-delete
    desc: ColdFusion cfdirectory deletes a directory
    if:
      type: text
      regex: '<\s*cfdirectory\s+action\s*=\s*["'']?delete'
      case_insensitive: true
