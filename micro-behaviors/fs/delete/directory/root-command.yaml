defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - -python
  - binaries
traits:
- id: root-deletion-command-reference
  desc: Root filesystem deletion command
  crit: notable
  conf: 0.95
  if:
    type: text
      # A following prose word (for example, "rm -rf / which translates...")
      # describes the command rather than terminating one. Python rmtree calls
      # are covered by the dedicated structured trait below.
      # The match starts at the line so a shell comment that only quotes the
      # command includes its leading '#', which `not` rejects.
    regex: '(?m)^[^\n]{0,80}rm\s+-rf\s+/(\*(\s|$|[;&|)"''])|\s+--no-preserve-root|[;&|]|\s*$)'
  not:
  - substr: '#'
  unless:
  - id: well-known/tool/development/vscode-extension/tencent-codebuddy::codebuddy-marker
  - id: objectives/impact/system/directory::root-command-defensive-context
  - id: metadata/file/profile/test-indications/
  - id: objectives/supply-chain/trojanized/app/debug-probe/
  - id: well-known/app/ai/coding-agent/
  - type: path
    regex: (?i)(^|[\\/])tests?[\\/]|\.d\.ts$
  - id: micro-behaviors/os/security/command-policy::command-policy-implementation-context
- id: root-deletion-unsafe-target
  desc: Root glob deletion or preserve-root bypass
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?m)^[^\n]{0,80}rm\s+-rf\s+/(\*|\s+--no-preserve-root)'
  not:
  - substr: '#'
