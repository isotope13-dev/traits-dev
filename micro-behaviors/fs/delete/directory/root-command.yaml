defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - -python
  - binaries
traits:
- id: root-deletion-command-reference
  desc: Root filesystem deletion command text
  crit: notable
  conf: 0.95
  # A paired deny policy names the destructive command as a guardrail. Suppress
  # the textual component findings in that specific context as well as the
  # root-wipe composite.
  unless:
  - id: micro-behaviors/os/security/command-policy/denylist-data::denied-root-wipe-policy-entry
  - id: well-known/tool/detection/code-analysis/semgrep::rule-test-annotation
  # A labeled command-rule fixture quotes `rm -rf /` as the input it expects a
  # rule to see. The leg is the only place that wording can satisfy root-wipe,
  # so suppressing it here also stops the composite without a written entry there.
  - id: metadata/file/catalog/pattern-rules::event-command-rule-tests
  if:
    type: text
      # A following prose word (for example, "rm -rf / which translates...")
      # describes the command rather than terminating one. Python rmtree calls
      # are covered by the dedicated structured trait below.
      # The match starts at the line so a shell comment that only quotes the
      # command includes its leading '#', which `not` rejects.
    # Flags are any run of word characters, spaces, and hyphens holding an
    # r-flag, ending at a lone '/' argument. Bounded classes replace nested
    # flag groups. A literal space keeps the run on one line.
    regex: '^.{0,80}rm\s[\w -]*-\w*[rR][\w -]*\s/(\*([\s;&|)"'']|$)|\s+--no-preserve-root|[;&|]|\s*$)'
  not:
  - substr: '#'
  # A quoted sentence that mentions the command ("Linux aws down by rm -rf
  # /*" in a search-query word list) quotes it; a command string starts at rm.
  - regex: '"[A-Z][a-z]+(\s+[A-Za-z]+){2,}\s+rm\s'
  # `Bash(rm -rf /*)` is an agent permission rule naming a command to deny.
  - regex: 'Bash\(rm\s'
- id: root-deletion-unsafe-target
  desc: Root glob deletion or preserve-root bypass
  crit: notable
  conf: 0.95
  unless:
  - id: micro-behaviors/os/security/command-policy/denylist-data::denied-root-wipe-policy-entry
  - id: well-known/tool/detection/code-analysis/semgrep::rule-test-annotation
  if:
    type: text
    # The preserve-root branch needs a lone `/` argument after the flag. The
    # flag alone is the option-text trait's claim; `/tmp/test` is not root.
    regex: '^.{0,80}rm\s([\w -]*-\w*[rR][\w -]*\s/\*|[\w -]*--no-preserve-root[\w -]*/)([\s;&|)"'']|$)'
  not:
  - substr: '#'
  # A quoted sentence that mentions the command ("Linux aws down by rm -rf
  # /*" in a search-query word list) quotes it; a command string starts at rm.
  - regex: '"[A-Z][a-z]+(\s+[A-Za-z]+){2,}\s+rm\s'
  # `Bash(rm -rf /*)` is an agent permission rule naming a command to deny.
  - regex: 'Bash\(rm\s'
