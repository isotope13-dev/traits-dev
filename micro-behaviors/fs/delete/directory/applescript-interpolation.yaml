defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
traits:
  - id: applescript-recursive-rm-interpolated-target
    desc: AppleScript builds variable-target recursive rm
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'do shell script [\\]*"rm -r [\\]*"\s*&\s*[a-zA-Z_]\w*'
