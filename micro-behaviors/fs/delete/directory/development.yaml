defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]
  crit: component
  conf: 0.9

traits:
  - id: git-directory-delete-target
    crit: notable
    desc: Delete command directly targets .git
    if:
      type: text
      regex: '(?i)\b(del(ete)?|remove|rm(tree|dir)?)(Sync)?\b[^\r\n;]{0,80}\.git[\\/''" \t)\r\n]'

  - id: node-modules-delete-target
    crit: notable
    desc: Delete command directly targets node_modules
    if:
      type: text
      regex: '(?i)\b(del(ete)?|remove|rm(tree|dir)?)(Sync)?\b[^\r\n;]{0,80}node_modules[\\/''" \t)\r\n]'

  - id: source-directory-delete-target
    crit: notable
    desc: Delete command directly targets src
    if:
      type: text
      regex: '(?i)\b(del(ete)?|remove|rm(tree|dir)?)(Sync)?\b[^\r\n;]{0,80}src[\\/''" \t)\r\n]'
