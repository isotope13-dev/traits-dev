defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]
  crit: component
  conf: 0.9

# A `)` terminator is deliberately absent from all three: it admitted call
# arguments (`np.delete(np.arange(len(src)), 3)`) where the "directory" is a
# local variable, never a literal path target. Quoted, slashed, spaced, and
# end-of-line forms still match.
traits:
  - id: git-directory-remove-call
    crit: notable
    desc: Removal API receives a Git directory path
    for: [javascript, python, ruby, php, perl]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(rm|rmdir|rmtree|remove)(Sync)?$'
      arg:
        index: 0
        kind: string
        regex: '(^|[/\\])\.git([/\\]|$)'

  - id: git-directory-remove-command
    crit: notable
    desc: Removal command names a Git directory
    if:
      type: text
      regex: '(?i)\b(rm|rmdir|del)\s+[-/a-zA-Z \t]{0,30}["'']?\.git[\\/''" \t\r\n]'

  - id: node-modules-delete-target
    crit: notable
    desc: Delete command directly targets node_modules
    if:
      type: text
      regex: '(?i)\b(del(ete)?|remove|rm(tree|dir)?)(Sync)?\b[^\r\n;&|]{0,80}node_modules[\\/''" \t\r\n]'

  - id: source-directory-delete-target
    crit: notable
    desc: Delete command directly targets src
    if:
      type: text
      regex: '(?i)\b(del(ete)?|remove|rm(tree|dir)?)(Sync)?\b[^\r\n;&|]{0,80}src[\\/''" \t\r\n]'

composite_rules:
  - id: git-directory-delete-target
    crit: notable
    desc: Removal call or command targets Git directory
    any:
      - id: git-directory-remove-call
      - id: git-directory-remove-command
