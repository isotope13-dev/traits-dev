defaults:
  platforms: [windows, unix]
  crit: baseline
  conf: 0.85

composite_rules:
  - id: go-recursive-removeall
    desc: Go recursive filesystem traversal and deletion
    crit: notable
    conf: 0.78
    for: [pe, elf, macho]
    platforms: [windows, unix, macos]
    size_max: 52428800
    all:
      - id: micro-behaviors/fs/directory/traverse::filepath-walk
      - id: micro-behaviors/fs/delete/directory::os-RemoveAll-string
  - id: delete-shell
    desc: Shell deletion operation
    crit: baseline
    conf: 0.85
    for: [shell]
    any:
      - id: micro-behaviors/fs/search/command::delete-flag-shell
      - id: micro-behaviors/fs/delete/directory::rm-rf
