defaults:
  platforms:
  - unix
  - windows
  for:
  - source
  - c
  - cpp
  - go
  - java
  - java_class
  - class
  - kotlin
  - ruby
  - python
  - javascript
  - typescript
  - csharp
  - php
  - perl
  - swift
  - rust
  - zig
  - elixir

traits:
- id: source-recursive-remove-command
  desc: Source contains an rm -rf command
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'rm\s+-rf'
