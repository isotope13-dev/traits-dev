defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.98
traits:
  - id: dex-delete-data-root-call
    desc: Deletion helper receives Android data root
    if:
      type: symbol
      kind: call
      regex: ';->(deleteFile|deleteDirectory|removeDirectory)$'
      arg: {index: 0, kind: string, regex: '^/data/?$'}
  - id: dex-delete-system-root-call
    desc: Deletion helper receives Android system root
    if:
      type: symbol
      kind: call
      regex: ';->(deleteFile|deleteDirectory|removeDirectory)$'
      arg: {index: 0, kind: string, regex: '^/(system|sys)/?$'}
  - id: dex-delete-emulated-storage-root-call
    desc: Deletion helper receives shared storage root
    if:
      type: symbol
      kind: call
      regex: ';->(deleteFile|deleteDirectory|removeDirectory)$'
      arg: {index: 0, kind: string, regex: '^/storage/emulated/0/?$'}
  - id: dex-delete-sdcard-root-call
    desc: Deletion helper receives sdcard root
    if:
      type: symbol
      kind: call
      regex: ';->(deleteFile|deleteDirectory|removeDirectory)$'
      arg: {index: 0, kind: string, regex: '^/sdcard/?$'}
