defaults:
  platforms: [unix, windows]
  for: [package.json]
traits:
  - id: postinstall-removes-variable-directory
    desc: Install hook recursively removes variable path
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.postinstall
      regex: '(^|;)\s*rm\s+-rf\s+\$\w{1,40}\s*(;|$)'
