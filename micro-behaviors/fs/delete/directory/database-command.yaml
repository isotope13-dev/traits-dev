defaults:
  for: [python, javascript, typescript, ruby, perl, lua, php]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: postgresql-cluster-recursive-delete-command
    desc: PostgreSQL cluster recursive deletion command
    conf: 0.97
    if:
      type: literal
      kind: string
      exclude_docstrings: true
      regex: '\brm\s+-[fivRr]*[rR][fivRr]*\s+/var/lib/postgresql/[^/\s;]+/main(\s|$)'
