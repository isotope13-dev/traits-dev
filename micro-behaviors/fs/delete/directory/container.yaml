# Recursive deletion of the Docker daemon's container store
# (/var/lib/docker/containers). Legitimate in Docker reset/uninstall tooling;
# destructive capability against every container's on-disk data anywhere else.
defaults:
  crit: suspicious
  platforms: [unix]
  for: [shell, go, python, javascript, typescript, rust, c, cpp]

traits:
  - id: docker-containers-rm-rf
    desc: Recursively deletes the Docker container store
    conf: 0.94
    ref: sha256:08296de3be194910931847709d8b0909836ed01961bc98d638f8fa7ed43378a8
    if:
      type: text
      regex: '(?i)rm["'',\s]+-[rf]{2,}["'',\s]+/var/lib/docker/containers\b'
    unless:
      - id: well-known/app/infrastructure/docker::source-tree
      - id: well-known/app/infrastructure/docker::docker-source-archive-context
  - id: docker-containers-removeall
    desc: Removes the Docker container store (RemoveAll)
    conf: 0.9
    ref: sha256:08296de3be194910931847709d8b0909836ed01961bc98d638f8fa7ed43378a8
    if:
      type: text
      regex: 'RemoveAll\s*\(\s*["'']/var/lib/docker/containers'
    unless:
      - id: well-known/app/infrastructure/docker::source-tree
      - id: well-known/app/infrastructure/docker::docker-source-archive-context
