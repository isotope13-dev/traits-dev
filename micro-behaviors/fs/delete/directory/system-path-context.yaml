defaults:
  platforms: [unix, windows]

composite_rules:
  - id: root-wipe-safety-context
    desc: Script guards or blocks root deletion
    for: [scripts, binaries]
    crit: exception
    conf: 0.9
    any:
      - id: micro-behaviors/process/create/shell/guard::command-blocked-marker
      - id: micro-behaviors/fs/delete/directory::destructive-action-prohibition-text

  - id: destructive-action-prohibition-text
    desc: Deletion syntax near destructive action prohibition
    crit: notable
    conf: 0.88
    for: [scripts, -shell, -jcl]
    all:
      - id: metadata/file/line::destructive-action-prohibition-phrase
      - id: micro-behaviors/fs/delete/directory::rm-rf
    near_lines: 2
  - id: recursive-delete-loop-system-path-cooccurrence
    for: [python, javascript]
    desc: Recursive delete near loop and system paths
    crit: notable
    conf: 0.95
    near_bytes: 1024
    all:
      - id: micro-behaviors/fs/delete/directory::recursive-delete
      - id: micro-behaviors/data/control-flow/analysis::iteration-loop-pattern
      - id: micro-behaviors/fs/path/reference::system-or-library-path-references
    unless:
      - id: micro-behaviors/fs/delete/directory::root-wipe-safety-context
