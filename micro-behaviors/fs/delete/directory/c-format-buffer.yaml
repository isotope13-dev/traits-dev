defaults:
  platforms: [unix]
  for: [c]
  crit: notable
  conf: 0.97

traits:
  - id: c-runs-formatted-recursive-remove-command
    desc: Runs formatted recursive directory removal
    if:
      type: tree-sitter
      language: c
      query: |
        ((compound_statement
         (declaration type: (primitive_type) @buffer_type
             declarator: (array_declarator declarator: (identifier) @buffer size: (number_literal) @buffer_size))
         . (expression_statement (call_expression function: (identifier) @formatter
             arguments: (argument_list . (identifier) @output . (sizeof_expression value: (parenthesized_expression (identifier) @sized_buffer)) . [(string_literal) (concatenated_string)] @template . (_) .)) @evidence)
         . [
         (declaration declarator: (init_declarator value: (call_expression
           function: (identifier) @executor arguments: (argument_list . (identifier) @executed .))))
         (expression_statement (call_expression function: (identifier) @executor
           arguments: (argument_list . (identifier) @executed .)))
         ]
         )
         (#eq? @buffer_type "char")
         (#eq? @formatter "snprintf")
         (#eq? @executor "system")
         (#eq? @buffer @output)
         (#eq? @buffer @executed)
         (#eq? @buffer @sized_buffer)
         (#match? @buffer_size "^[1-9][0-9]*$")
         (#eq? @template "\"rm -rf -- %s\""))
