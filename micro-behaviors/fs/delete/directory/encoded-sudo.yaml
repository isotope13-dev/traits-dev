# A decoded command can expose privileged directory removal even when its
# containing artifact is a native launcher rather than an AppleScript file.
# This observes command text, not execution, password provenance or intent.
# Keep the parsed AppleScript literal rule and its consumers unchanged.
defaults:
  platforms: [unix]
  for: [macho, elf, shell, python, javascript, applescript]

traits:
  - id: decoded-sudo-recursive-remove-command
    desc: Decoded command contains sudo recursive rm
    crit: notable
    conf: 0.96
    if:
      type: encoded
      regex: '\bsudo\s+-S\s+rm\s+-r(f)?\s'
