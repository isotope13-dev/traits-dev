---
defaults:
  platforms:
  - linux
  - macos
  for:
  - elf
  - macho
  - shell
  - c
  - cpp
traits:
- id: remove-source-call
  desc: C remove call with one pathname argument
  crit: notable
  conf: 0.9
  for:
  - c
  - cpp
  if:
    type: tree-sitter
    query: |
      ((call_expression
        function: (identifier) @function
        arguments: (argument_list . (_) .)) @call
        (#eq? @function "remove"))
