---
defaults:
  platforms:
  - linux
  - macos
  for:
  - elf
  - macho
  - shell
  - c
  - cpp
traits:
- id: unlink
  desc: References unlink API symbol
  crit: notable
  conf: 0.3
  if:
    type: symbol
    exact: unlink
  unless:
  - id: micro-behaviors/fs/path/application/interpreter::python3-interpreter-basename
  downgrade:
    any:
    - id: metadata/lang/compiled/
    - id: micro-behaviors/fs/path/application/interpreter::system-shell-basename
    - id: metadata/lang/compiler/systems::go-binary
composite_rules:
- id: native-remove-api-or-call-clues
  desc: Native remove API or call clues
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/fs/delete/path::remove-binary-symbol
  - id: micro-behaviors/fs/delete/path::remove-source-call
- id: native-unlink-remove-evidence
  desc: References native file-deletion APIs
  crit: component
  conf: 0.3
  any:
  - id: micro-behaviors/fs/delete/path::unlink
  - id: micro-behaviors/fs/delete/file/syscall::unlinkat
  - id: micro-behaviors/fs/delete/path::native-remove-api-or-call-clues
  downgrade:
    any:
    - id: metadata/lang/compiled/
    - id: metadata/lang/compiler/systems::go-binary
- id: file-unlink-capability
  desc: File deletion API or syscall
  crit: notable
  conf: 0.85
  platforms: [unix, windows]
  for: [binaries, source, scripts]
  any:
  - id: micro-behaviors/fs/delete/path::unlink
  - id: micro-behaviors/fs/delete/file/syscall::unlink-syscall
  - id: micro-behaviors/fs/delete/file/syscall::unlinkat
  - id: micro-behaviors/fs/delete/file/library/
