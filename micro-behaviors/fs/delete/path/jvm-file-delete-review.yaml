---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  - android
  for:
  - class
  - jar
  - zip
  - android_apk
traits:
- id: java-file-delete-source
  desc: Java File path-deletion clues
  conf: 0.92
  for:
  - java
  if:
    type: text
    regex: "\\bFile\\s+[A-Za-z_$][A-Za-z0-9_$]*[\\s\\S]{0,900}\\.[[:space:]]*delete\\(\\)"
- id: kotlin-file-delete-source
  desc: Kotlin File path-deletion clues
  conf: 0.92
  for:
  - kotlin
  if:
    type: text
    regex: "\\b(val|var)\\s+[A-Za-z_$][A-Za-z0-9_$]*\\s*:\\s*File\\b[\\s\\S]{0,900}\\.\\s*delete\\s*\\(\\s*\\)"
composite_rules:
- id: jvm-file-delete-source
  desc: JVM File path-deletion clues
  conf: 0.92
  for:
  - java
  - kotlin
  any:
  - id: micro-behaviors/fs/delete/path::java-file-delete-source
  - id: micro-behaviors/fs/delete/path::kotlin-file-delete-source
