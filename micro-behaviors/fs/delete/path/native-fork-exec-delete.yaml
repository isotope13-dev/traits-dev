                    (code.flags & 0x80000000) != 0 and code.sectname == "__text" and
                    for any linkseg in macho.segments : (
                      for any stubs in linkseg.sections : (
                        (stubs.flags & 0xFF) == 8 and stubs.reserved2 > 0 and
                        with delta = code.addr - code.offset : (
                          for any i in (1..#cb) : (
                            @cb[i] % 4 == 0 and
                            @cb[i] >= code.offset + 4 and @cb[i] + 20 <= code.offset + code.size and
                            for any pre in (4, 12) : (
                              @cb[i] >= code.offset + pre and
                              (
                                (pre == 4 and (uint32(@cb[i]) & 0x1F) == 0) or
                                (pre == 12 and (
                                  (
                                    (uint32(@cb[i] - 8) & 0xFFC003FF) == 0xB90003E0 and
                                    (uint32(@cb[i] - 4) & 0xFFC003E0) == 0xB94003E0 and
                                    ((uint32(@cb[i] - 8) >> 10) & 0xFFF) == ((uint32(@cb[i] - 4) >> 10) & 0xFFF) and
                                    (uint32(@cb[i]) & 0x1F) == (uint32(@cb[i] - 4) & 0x1F)
                                  ) or
                                  (
                                    (uint32(@cb[i] - 8) & 0xFFE00FFF) == 0xB80003A0 and
                                    (uint32(@cb[i] - 4) & 0xFFE00FE0) == 0xB84003A0 and
                                    ((uint32(@cb[i] - 8) >> 12) & 0x1FF) == ((uint32(@cb[i] - 4) >> 12) & 0x1FF) and
                                    (uint32(@cb[i]) & 0x1F) == (uint32(@cb[i] - 4) & 0x1F)
                                  )
                                ))
                              ) and
                              with f_off = @cb[i] - pre,
                                   arm1_start = @cb[i] + 4,
                                   target = @cb[i] + ((((uint32(@cb[i]) >> 5) & 0x7FFFF) ^ 0x40000) - 0x40000) * 4 : (
                                (uint32(f_off) & 0xFC000000) == 0x94000000 and
                                target >= arm1_start + 8 and target <= arm1_start + 64 and
                                target + 8 <= code.offset + code.size and
                                with f_va = delta + f_off + (((uint32(f_off) & 0x03FFFFFF) ^ 0x02000000) - 0x02000000) * 4 : (
                                  f_va >= stubs.addr and f_va < stubs.addr + stubs.size and
                                  (f_va - stubs.addr) % stubs.reserved2 == 0 and
                                  with nf = uint32(indirect + 4 * (stubs.reserved1 + (f_va - stubs.addr) \ stubs.reserved2)) : (
                                    nf < macho.symtab.nsyms and
                                    for any kf in (1..#fork_name) : (
                                      macho.symtab.stroff + macho.symtab.nlists[nf].n_strx == @fork_name[kf]
                                    )
                                  )
                                ) and
                                for any kd in (1..28) : (
                                  with d_off = arm1_start + 4 * kd : (
                                    d_off + 4 <= code.offset + code.size and
                                    d_off <= target + 48 and
                                    (uint32(d_off) & 0xFC000000) == 0x94000000 and
                                    not (for any kr in (0..kd) : (uint32(arm1_start + 4 * kr) == 0xD65F03C0)) and
                                    for any d_arm in (arm1_start, target) : (
                                      ((d_arm == arm1_start and d_off < target) or (d_arm == target and d_off >= target + 4)) and
                                      with d_va = delta + d_off + (((uint32(d_off) & 0x03FFFFFF) ^ 0x02000000) - 0x02000000) * 4 : (
                                        d_va >= stubs.addr and d_va < stubs.addr + stubs.size and
                                        (d_va - stubs.addr) % stubs.reserved2 == 0 and
                                        with nd = uint32(indirect + 4 * (stubs.reserved1 + (d_va - stubs.addr) \ stubs.reserved2)) : (
                                          nd < macho.symtab.nsyms and
                                          (
                                            (for any kd1 in (1..#del_name1) : (macho.symtab.stroff + macho.symtab.nlists[nd].n_strx == @del_name1[kd1])) or
                                            (for any kd2 in (1..#del_name2) : (macho.symtab.stroff + macho.symtab.nlists[nd].n_strx == @del_name2[kd2]))
                                          )
                                        )
                                      ) and
                                      with e_arm = (arm1_start + target) - d_arm : (
                                        for any ke in (1..28) : (
                                          with e_off = arm1_start + 4 * ke : (
                                            e_off + 4 <= code.offset + code.size and
                                            e_off <= target + 48 and
                                            ((e_arm == arm1_start and e_off < target) or (e_arm == target and e_off >= target + 4)) and
                                            (uint32(e_off) & 0xFC000000) == 0x94000000 and
                                            not (for any kr2 in (0..ke) : (uint32(arm1_start + 4 * kr2) == 0xD65F03C0)) and
                                            with e_va = delta + e_off + (((uint32(e_off) & 0x03FFFFFF) ^ 0x02000000) - 0x02000000) * 4 : (
                                              e_va >= stubs.addr and e_va < stubs.addr + stubs.size and
                                              (e_va - stubs.addr) % stubs.reserved2 == 0 and
                                              with ne = uint32(indirect + 4 * (stubs.reserved1 + (e_va - stubs.addr) \ stubs.reserved2)) : (
                                                ne < macho.symtab.nsyms and
                                                for any ke_i in (1..#exec_name) : (
                                                  macho.symtab.stroff + macho.symtab.nlists[ne].n_strx == @exec_name[ke_i]
                                                )
                                              )
                                            ) and
                                            (
                                              not $wait_name or
                                              d_off <= d_arm + 4 or
                                              not (
                                                for any kw in (0..(d_off - d_arm) \ 4 - 1) : (
                                                  with w_off = d_arm + 4 * kw : (
                                                    (uint32(w_off) & 0xFC000000) == 0x94000000 and
                                                    with w_va = delta + w_off + (((uint32(w_off) & 0x03FFFFFF) ^ 0x02000000) - 0x02000000) * 4 : (
                                                      w_va >= stubs.addr and w_va < stubs.addr + stubs.size and
                                                      (w_va - stubs.addr) % stubs.reserved2 == 0 and
                                                      with nw = uint32(indirect + 4 * (stubs.reserved1 + (w_va - stubs.addr) \ stubs.reserved2)) : (
                                                        nw < macho.symtab.nsyms and
                                                        for any kw_i in (1..#wait_name) : (
                                                          macho.symtab.stroff + macho.symtab.nlists[nw].n_strx == @wait_name[kw_i]
                                                        )
                                                      )
                                                    )
                                                  )
                                                )
                                              )
                                            ) and
                                            for any jd in (0..(d_off - d_arm) \ 4 - 1) : (
                                              for any je in (0..(e_off - e_arm) \ 4 - 1) : (
                                                with ld_d = d_arm + 4 * jd,
                                                     ld_e = e_arm + 4 * je,
                                                     wd = uint32(d_arm + 4 * jd),
                                                     we = uint32(e_arm + 4 * je) : (
                                                  ld_d + 8 >= d_off and
                                                  (
                                                    (
                                                      ((wd & 0xFFC003FF) == 0xF94003E0 or (wd & 0xFFE00FFF) == 0xF84003A0) and
                                                      wd == we
                                                    ) or
                                                    (
                                                      (wd & 0xFFE0FFFF) == 0xAA0003E0 and
                                                      ((wd >> 16) & 0x1F) >= 19 and ((wd >> 16) & 0x1F) <= 28 and
                                                      wd == we
                                                    ) or
                                                    (
                                                      (wd & 0x9F00001F) == 0x10000000 and
                                                      (we & 0x9F00001F) == 0x10000000 and
                                                      ld_d + ((((wd >> 5) & 0x7FFFF) * 4 + ((wd >> 29) & 3)) ^ 0x100000) - 0x100000 ==
                                                      ld_e + ((((we >> 5) & 0x7FFFF) * 4 + ((we >> 29) & 3)) ^ 0x100000) - 0x100000
                                                    ) or
                                                    (
                                                      ld_d + 8 <= d_off and ld_e + 8 <= e_off and
                                                      (wd & 0x9F00001F) == 0x90000000 and
                                                      (we & 0x9F00001F) == 0x90000000 and
                                                      (uint32(ld_d + 4) & 0xFFC003FF) == 0x91000000 and
                                                      (uint32(ld_e + 4) & 0xFFC003FF) == 0x91000000 and
                                                      (((delta + ld_d) & ~0xFFF) + ((((((wd >> 5) & 0x7FFFF) * 4 + ((wd >> 29) & 3)) ^ 0x100000) - 0x100000) * 4096)) + ((uint32(ld_d + 4) >> 10) & 0xFFF) ==
                                                      (((delta + ld_e) & ~0xFFF) + ((((((we >> 5) & 0x7FFFF) * 4 + ((we >> 29) & 3)) ^ 0x100000) - 0x100000) * 4096)) + ((uint32(ld_e + 4) >> 10) & 0xFFF)
                                                    )
                                                  )
                                                )
                                              )
                                            )
                                          )
                                        )
                                      )
                                    )
                                  )
                                )
                              )
                            )
                          )
                        )
                      )
                    )
                  )
                )
              )
            )
        }

