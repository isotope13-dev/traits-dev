---
defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  crit: baseline
  conf: 0.9
traits:
- id: fs-rm
  desc: Delete file or directory (fs.rm)
  if:
    type: symbol
    kind: call
    exact: fs.rm
- id: fs-rmSync
  desc: Delete file or directory sync
  if:
    type: symbol
    kind: call
    exact: fs.rmSync
- id: shelljs-rm
  desc: Deletes a file or directory through shelljs
  crit: notable
  conf: 0.9
  if:
    type: symbol
    kind: call
    exact: shelljs.rm
- id: script-file-unlink-call
  desc: Calls file remove, unlink, or DeleteFile
  crit: notable
  for:
  - lua
  - python
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    regex: '^(os\.remove|(os\.|fs\.)?unlink(Sync)?|([A-Za-z_.]+\.)?DeleteFile[AW])$'
