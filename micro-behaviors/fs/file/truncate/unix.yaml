defaults:
  crit: baseline
  platforms: [unix]
  for: [elf, macho, c, cpp, objc]
traits:
  - id: truncate
    desc: Truncate file
    conf: 0.5
    if:
      type: symbol
      regex: ^_?(truncate|ftruncate|truncate64|ftruncate64)$
  - id: open-o-trunc-flag
    desc: O_TRUNC open flag
    crit: notable
    conf: 0.65
    for: [c, cpp, objc]
    if:
      type: text
      word: O_TRUNC
  - id: python-os-truncate
    desc: Calls Python os.truncate or os.ftruncate
    crit: notable
    conf: 0.85
    platforms: [unix, windows]
    for: [python]
    if:
      type: symbol
      regex: '(^|\.)f?truncate$'
composite_rules:
  - id: file-truncate-capability
    desc: File truncation API, syscall, or open flag
    crit: notable
    conf: 0.82
    platforms: [unix, windows]
    for: [binaries, source, python, powershell]
    any:
      - id: truncate
      - id: truncate-syscall
      - id: open-o-trunc-flag
      - id: python-os-truncate
      - id: set-end-of-file-win
      - id: set-end-of-file-source
