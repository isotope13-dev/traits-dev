traits:
  - id: python-seek-write-truncate
    desc: Seeks, writes, then truncates a file object
    platforms: [unix, windows]
    crit: notable
    conf: 0.86
    for:
      - python
    size_max: 50000
    if:
      type: text
      regex: \.seek\(\s*0\s*\)[\s\S]{0,220}\.write\([\s\S]{0,220}\.truncate\(
