defaults:
  for:
  - text
  platforms:
  - windows
  - linux
  - macos

traits:
  - id: matlab-listed-file-truncate
    desc: MATLAB open-with-write-mode text for listed file
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: "\\bfopen\\(strcat\\([^\\r\\n]{1,45}\\.name\\),'w'\\)"
