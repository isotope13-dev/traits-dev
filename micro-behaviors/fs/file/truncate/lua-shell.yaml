defaults:
  for: [lua]
  platforms: [unix, windows]
traits:
  - id: lua-wrapper-truncates-system-log
    desc: Lua shell helper truncates a system log
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: lua
      query: |
        ((chunk
         (function_declaration name: (identifier) @helper
         parameters: (parameters (identifier) @parameter)
         body: (block
          (variable_declaration (assignment_statement
           (expression_list (function_call name: (dot_index_expression) @popen
            arguments: (arguments (binary_expression left: (identifier) @input operator: ".."))))))))
         (function_declaration body: (block
          (function_call name: (identifier) @called arguments: (arguments (string) @command)))))
         (#eq? @helper @called) (#eq? @parameter @input) (#eq? @popen "io.popen")
         (#match? @command "echo.{0,20}> /var/(adm/messages|log/syslog)"))
