# Yahoo Widget writeFile(path, data) defaults to replacement. The closing
# parenthesis after data excludes the optional append-mode argument.
defaults:
  for: [html, javascript]
  platforms: [windows, macos]
  crit: notable
  conf: 0.99
traits:
  - id: widget-desktop-file-replacement
    desc: Widget source replaces listed Desktop files
    if:
      type: text
      regex: 'writeFile\(system\.userDesktopFolder.{0,64}fileList\[\w+\],\s*data\)'
  - id: widget-pictures-file-replacement
    desc: Widget source replaces listed Pictures files
    if:
      type: text
      regex: 'writeFile\(system\.userPicturesFolder.{0,64}fileList\[\w+\],\s*data\)'
  - id: widget-music-file-replacement
    desc: Widget source replaces listed Music files
    if:
      type: text
      regex: 'writeFile\(system\.userMusicFolder.{0,64}fileList\[\w+\],\s*data\)'
composite_rules:
  - id: widget-personal-folder-file-replacements
    desc: Widget source replaces listed personal files
    all:
      - id: widget-desktop-file-replacement
      - id: widget-pictures-file-replacement
      - id: widget-music-file-replacement
