defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  crit: notable
  conf: 0.95

traits:
  - id: applescript-set-eof-zero
    desc: AppleScript truncates a file to zero bytes
    if:
      type: text
      regex: '(?m)(^|")[ \t]*set eof of [a-z_]\w* to 0(\r?$|\\?" & return)'
      case_insensitive: true
