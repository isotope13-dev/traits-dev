# Direct syscall instructions expose the same neutral capabilities as imports.
# Presence does not establish execution or malicious intent.
defaults:
  platforms: [linux]
  for: [elf]
  crit: baseline
  conf: 0.9
traits:
  - id: truncate-syscall
    desc: Changes file length via a Linux syscall
    crit: notable
    if:
      type: syscall
      name: [truncate, ftruncate]
