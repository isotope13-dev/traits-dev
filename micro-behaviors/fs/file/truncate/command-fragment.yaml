traits:
  # Names a zero-size truncate command fragment, not successful execution or
  # the identity of its target. Objective composites must establish that link.
  - id: truncate-zero-command-fragment
    desc: truncate -s 0 zero-size command fragment
    platforms: [unix]
    for: [elf, go, rust, shell]
    crit: component
    conf: 0.9
    if:
      type: text
      regex: 'truncate\s+-s\s*0\s+'
