# An empty second argument uses writeFileSync's default truncating mode.
# An explicit third argument may select append or exclusive creation instead.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-nested-file-truncation-loop
    desc: Node truncates files during nested traversal
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        (for_in_statement
            left: (identifier) @drive
            right: (identifier) @root_list
            body: (statement_block (try_statement body: (statement_block
              (lexical_declaration (variable_declarator
                name: (identifier) @entries
                value: (call_expression
                  function: (member_expression object: (identifier) @fs1
                    property: (property_identifier) @read)
                  arguments: (arguments . (identifier) @read_dir .))))
              (for_in_statement
                left: (identifier) @entry
                right: (identifier) @entry_list
                body: (statement_block (try_statement body: (statement_block
                  (lexical_declaration (variable_declarator
                    name: (identifier) @full
                    value: (call_expression
                      function: (member_expression object: (identifier) @path
                        property: (property_identifier) @join)
                      arguments: (arguments . (identifier) @join_dir . (identifier) @join_entry .))))
                  (if_statement
                    condition: (parenthesized_expression (call_expression
                      function: (member_expression
                        object: (call_expression
                          function: (member_expression object: (identifier) @fs2
                            property: (property_identifier) @stat)
                          arguments: (arguments . (identifier) @stat_path .))
                        property: (property_identifier) @isfile)
                      arguments: (arguments)))
                    consequence: (statement_block
                      (expression_statement (call_expression
                        function: (member_expression object: (identifier) @fs3
                          property: (property_identifier) @write)
                        arguments: (arguments . (identifier) @write_path . (string) @empty .)))))))))))) @operation
          (#eq? @drive @read_dir)
          (#eq? @entries @entry_list)
          (#eq? @entry @join_entry)
          (#eq? @drive @join_dir)
          (#eq? @full @stat_path)
          (#eq? @full @write_path)
          (#eq? @fs1 "fs") (#eq? @fs2 @fs1) (#eq? @fs3 @fs1)
          (#eq? @path "path") (#eq? @read "readdirSync")
          (#eq? @join "join") (#eq? @stat "statSync")
          (#eq? @isfile "isFile") (#eq? @write "writeFileSync")
          (#match? @empty "^([\"]{2}|[']{2})$")
        )

  - id: node-empty-write-default-mode
    desc: Node empty file write uses default mode
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression object: (identifier) @fs
            property: (property_identifier) @write)
          arguments: (arguments . (_) . (string) @empty .)) @call
          (#eq? @fs "fs")
          (#eq? @write "writeFileSync")
          (#match? @empty "^([\"]{2}|[']{2})$"))
