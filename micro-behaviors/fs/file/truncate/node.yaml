# An empty second argument uses writeFileSync's default truncating mode.
# An explicit third argument may select append or exclusive creation instead.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-empty-write-default-mode
    desc: Node empty file write uses default mode
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression object: (identifier) @fs
            property: (property_identifier) @write)
          arguments: (arguments . (_) . (string) @empty .)) @call
          (#eq? @fs "fs")
          (#eq? @write "writeFileSync")
          (#match? @empty "^([\"]{2}|[']{2})$"))
