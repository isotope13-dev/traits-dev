defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: set-end-of-file-win
    desc: Truncate file via SetEndOfFile
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: "SetEndOfFile"
  - id: set-end-of-file-source
    desc: SetEndOfFile or TRUNCATE_EXISTING truncation
    crit: notable
    conf: 0.9
    for: [c, cpp, csharp, go, rust, python, powershell]
    if:
      type: text
      regex: '\b(SetEndOfFile|TRUNCATE_EXISTING)\b'
