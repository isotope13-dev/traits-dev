# Positional and seek-based descriptor read/write capabilities.
defaults:
  platforms: [linux, macos, windows]
  crit: baseline
  conf: 0.8

traits:
  - id: lseek-symbol
    desc: References POSIX lseek file-offset API
    for: [elf, macho, pe, dll, c, cpp, objc]
    if:
      type: symbol
      regex: '^_?(lseek|lseek64)$'

  - id: lseek-syscall
    desc: Repositions file offset via Linux lseek syscall
    platforms: [linux]
    for: [elf]
    conf: 0.9
    if:
      type: syscall
      name: [lseek, _llseek]

  - id: pread-api
    desc: Reads a file at an explicit offset
    crit: notable
    conf: 0.85
    for: [elf, macho, c, cpp, objc, python, go, rust]
    if:
      type: symbol
      regex: '(^|\.)_?(pread|pread64|ReadAt)$'

  - id: pwrite-api
    desc: Writes a file at an explicit offset
    crit: notable
    conf: 0.85
    for: [elf, macho, c, cpp, objc, python, go, rust]
    if:
      type: symbol
      regex: '(^|\.)_?(pwrite|pwrite64|WriteAt)$'

composite_rules:
  - id: pread-and-pwrite
    desc: Positional file read and write APIs
    crit: notable
    conf: 0.88
    for: [binaries, source, python]
    all:
      - id: pread-capability
      - id: pwrite-capability

  - id: pread-capability
    desc: Positional file-read capability
    crit: notable
    conf: 0.85
    for: [binaries, source, python]
    any:
      - id: pread-api
      - id: micro-behaviors/fs/read/file/partial::pread-syscall

  - id: pwrite-capability
    desc: Positional file-write capability
    crit: notable
    conf: 0.85
    for: [binaries, source, python]
    any:
      - id: pwrite-api
      - id: micro-behaviors/fs/write/file/descriptor::write--pwrite
      - id: micro-behaviors/fs/write/file/descriptor::write--pwrite64
      - id: micro-behaviors/fs/write/file/descriptor::pwrite-syscall

  - id: lseek-and-descriptor-write
    desc: File-offset lseek paired with descriptor write
    crit: notable
    conf: 0.84
    for: [binaries, source, python]
    any:
      - id: lseek-symbol
      - id: lseek-syscall
      - id: micro-behaviors/fs/write/file/descriptor::python-os-lseek-fd
    all:
      - id: descriptor-write-any

  - id: descriptor-write-any
    desc: Descriptor or syscall file-write capability
    crit: baseline
    conf: 0.75
    for: [binaries, source, python]
    any:
      - id: micro-behaviors/fs/write/file/descriptor::write
      - id: micro-behaviors/fs/write/file/descriptor::write-syscall
      - id: pwrite-capability

  - id: positional-descriptor-rewrite
    desc: Positional or seeked file-descriptor rewrite capability
    crit: notable
    conf: 0.86
    for: [binaries, source, python]
    any:
      - id: pread-and-pwrite
      - id: lseek-and-descriptor-write
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiler/systems::rust-binary

  - id: inplace-or-positional-file-rewrite
    desc: Binary or positional file-rewrite capability
    crit: notable
    conf: 0.86
    for: [binaries, source, python]
    any:
      - id: micro-behaviors/fs/file/binary::file-content-io
      - id: micro-behaviors/fs/file/binary::source-file-content-io
      - id: positional-descriptor-rewrite
