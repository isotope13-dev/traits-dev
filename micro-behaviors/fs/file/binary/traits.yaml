defaults:
  platforms:
  - linux
  - macos
  - windows
  crit: baseline
traits:
- id: write-binary
  desc: Opens file in binary write
  crit: baseline
  conf: 0.6
  for: [scripts, binaries]
  if:
    type: text
    regex: \\b"wb"\\b|\\bfopen\\s*\\(.{1,220},\\s*"wb"\\)
- id: write-read-binary
  desc: Opens file in binary write+read
  crit: baseline
  conf: 0.6
  for: [scripts, binaries]
  if:
    type: text
    regex: \\b"w\\+b"\\b|\\bfopen\\s*\\(.{1,220},\\s*"w\\+b"\\)
- id: read-write-binary
  desc: Opens file in binary read+write
  crit: baseline
  conf: 0.6
  for: [scripts, binaries]
  if:
    type: text
    regex: \\b"r\\+b"\\b|\\bfopen\\s*\\(.{1,220},\\s*"r\\+b"\\)
- id: read-binary
  desc: Opens file in binary read
  crit: baseline
  conf: 0.5
  for: [scripts, binaries]
  if:
    type: text
    regex: \\b"rb"\\b|\\bfopen\\s*\\(.{1,220},\\s*"rb"\\)
- id: fcopyfile-macos
  desc: Copies files on macOS using
  crit: notable
  conf: 0.7
  platforms:
  - macos
  for:
  - macho
  if:
    type: symbol
    substr: fcopyfile
- id: fseek-func
  desc: Seeks to position in file
  crit: baseline
  conf: 0.4
  for: [elf, macho, pe]
  if:
    type: symbol
    substr: fseek
- id: fseek-text
  desc: References the CRT fseek file-position routine
  crit: baseline
  conf: 0.5
  for: [elf, macho, pe]
  if:
    type: text
    exact: fseek
composite_rules:
# fseek symbol + fseek text are the same capability counted twice; requiring a
# real fopen binary mode (rb/wb/…) keeps this from firing on every libc consumer
# that merely seeks, while still catching payload writers that open binary streams.
- id: binary-read-write-ops
  desc: Binary file read/write mode operations
  crit: notable
  conf: 0.7
  any:
  - id: write-binary
  - id: write-read-binary
  - id: read-write-binary
  - id: read-binary
- id: file-manipulation
  desc: File content manipulation (read/write/seek)
  crit: notable
  conf: 0.75
  needs: 2
  any:
  - id: fseek-func
  - id: micro-behaviors/fs/file/read
  - id: micro-behaviors/fs/file/write/direct::write
  - id: binary-read-write-ops
  downgrade:
    any:
    - id: metadata/lang/compiler/systems::go-binary
    - id: metadata/lang/compiled/
