defaults:
  platforms:
  - linux
  - macos
  - windows
  crit: baseline
traits:
- id: write-binary
  desc: Opens file in binary write
  crit: baseline
  conf: 0.6
  for: [scripts, binaries]
  if:
    type: text
    regex: \\b"wb"\\b|\\bfopen\\s*\\(.{1,220},\\s*"wb"\\)
- id: write-read-binary
  desc: Opens file in binary write+read
  crit: baseline
  conf: 0.6
  for: [scripts, binaries]
  if:
    type: text
    regex: \\b"w\\+b"\\b|\\bfopen\\s*\\(.{1,220},\\s*"w\\+b"\\)
- id: read-write-binary
  desc: Opens file in binary read+write
  crit: baseline
  conf: 0.6
  for: [scripts, binaries]
  if:
    type: text
    regex: \\b"r\\+b"\\b|\\bfopen\\s*\\(.{1,220},\\s*"r\\+b"\\)
- id: read-binary
  desc: Opens file in binary read
  crit: baseline
  conf: 0.5
  for: [scripts, binaries]
  if:
    type: text
    regex: \\b"rb"\\b|\\bfopen\\s*\\(.{1,220},\\s*"rb"\\)
- id: fcopyfile-macos
  desc: Copies files with macOS fcopyfile
  crit: notable
  conf: 0.7
  platforms:
  - macos
  for:
  - macho
  if:
    type: symbol
    substr: fcopyfile
- id: fseek-func
  desc: Seeks to position in file
  crit: baseline
  conf: 0.4
  for: [elf, macho, pe]
  if:
    type: symbol
    substr: fseek
- id: fseek-text
  desc: References the CRT fseek file-position routine
  crit: baseline
  conf: 0.5
  for: [elf, macho, pe]
  if:
    type: text
    exact: fseek
- id: ftell-import
  desc: References the CRT ftell position routine
  crit: baseline
  conf: 0.7
  for: [elf, macho, pe]
  if:
    type: import
    exact: ftell
composite_rules:
# fseek symbol + fseek text are the same capability counted twice; requiring a
# binary stream mode or a seeked file descriptor keeps this from firing on
# every libc consumer that merely reads and writes a pipe.
- id: binary-read-write-ops
  desc: Binary file read/write mode operations
  crit: notable
  conf: 0.7
  any:
  - id: write-binary
  - id: write-read-binary
  - id: read-write-binary
  - id: read-binary
- id: file-position-api
  desc: References a file-position API
  crit: notable
  conf: 0.78
  any:
  - id: fseek-func
  - id: fseek-text
  - id: ftell-import
- id: seek-and-descriptor-io
  desc: Reads or writes a seeked file descriptor
  crit: notable
  conf: 0.8
  all:
  - id: file-position-api
  any:
  - id: micro-behaviors/fs/file/read::read
  - id: micro-behaviors/fs/file/write/direct::write
- id: file-content-io
  desc: File content I/O via binary mode or a seeked file descriptor
  crit: notable
  conf: 0.8
  any:
  - id: binary-read-write-ops
  - id: seek-and-descriptor-io
  downgrade:
    any:
    - id: metadata/lang/compiler/systems::go-binary
    - id: metadata/lang/compiled/

- id: source-file-content-io
  desc: C source reads and writes file content
  crit: notable
  conf: 0.84
  for: [c, cpp]
  all:
  - id: micro-behaviors/fs/file/read::fread
  - id: micro-behaviors/fs/file/write/direct::write--fwrite
