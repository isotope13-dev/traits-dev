# file -b classifies a quoted pathname; it is not a directory traversal,
# content-exfiltration or privileged-operation claim.
defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  crit: notable
traits:
  - id: applescript-shell-file-classification
    desc: AppleScript builds file-type inspection command
    conf: 0.95
    if:
      type: text
      regex: '(?m)(^|& ")set \w+ to \(do shell script \\?"file -b \\?" & \w+'
