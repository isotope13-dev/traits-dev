defaults:
  platforms: [linux]
  for: [c, cpp]

traits:
  - id: process-inode-helper-call
    desc: Process inode helper reference
    crit: notable
    if:
      type: symbol
      regex: '(^|::)get_inode_of_process$'
  - id: file-inode-helper-call
    desc: File inode helper reference
    crit: notable
    if:
      type: symbol
      regex: '(^|::)get_inode_of_file$'
  - id: inode-list-append
    desc: Inode collection append call text
    crit: notable
    if:
      type: text
      regex: '\binodes\s*\.\s*push_back\s*\('
