defaults:
  platforms: [unix, windows]
  for: [ruby]

traits:
  - id: ruby-extconf-dev-home-artifacts-probe
    desc: Ruby checks home for developer artifacts
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'File\.exist\?\(File\.join\(home,\s*[''"]\.(ssh|gitconfig|gem|npmrc|bundle)'
