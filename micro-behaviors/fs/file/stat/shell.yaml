# Shell file-state predicates. `test -d` / `test -w` are ordinary POSIX shell
# conditionals present in nearly every install, service and wrapper script, so
# they are neutral capabilities here rather than dropper components: the
# writability-probe intent lives in the composites that combine them with a
# chmod and a cleanup delete.
defaults:
  platforms: [unix]
  for: [shell]
  crit: baseline
  conf: 0.9
traits:
  - id: shell-test-directory
    desc: Shell tests a path is a directory
    if:
      type: text
      substr: "test -d"
  - id: shell-test-writable
    desc: Shell tests a path is writable
    if:
      type: text
      substr: "test -w"
