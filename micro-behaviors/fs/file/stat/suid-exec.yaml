composite_rules:
  - id: suid-check-near-exec
    desc: SUID mode check near process execution
    crit: notable
    conf: 0.94
    for: [c, cpp]
    platforms: [linux]
    all:
      - id: suid-mode-check
      - id: stat
    any:
      - id: micro-behaviors/process/create/exec::execve-import
      - id: micro-behaviors/process/create/exec::c-exec-family-source
      - id: micro-behaviors/process/create/execv::execve-fn
    near_lines: 32
    unless:
      - id: well-known/app/infrastructure/openzfs::openzfs-source-context
      - id: well-known/app/system/mozc/
      - id: well-known/tool/reverse-engineering/radare2::radare2-source-identity
      - id: well-known/lib/crypto/uuid::libuuid-source-identity
      # Preserve the existing test-harness exclusion during relocation.
      - id: metadata/package/testing/presence/harness::c-source-test-directory
