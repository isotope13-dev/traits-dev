composite_rules:
  - id: suid-check-near-exec
    desc: SUID mode check near process execution
    crit: notable
    conf: 0.94
    for: [c, cpp]
    platforms: [linux]
    all:
      - id: suid-mode-check
      - id: stat
    any:
      - id: metadata/binary/symbols/name/process::execve-import
      - id: micro-behaviors/process/replace::c-exec-family-source
      - id: metadata/binary/symbols/name/process::execve-fn
    near_lines: 32
