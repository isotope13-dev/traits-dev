# Reading a file's set-user-ID mode is neutral by itself.  It is separated
# from generic stat() so privilege-escalation composites can require evidence
# that the selected file is intended to execute with elevated identity.
defaults:
  crit: notable
  conf: 0.9
  platforms: [unix]
  for: [c, cpp, go, rust, elf]

traits:
  - id: suid-mode-constant
    desc: S_ISUID set-user-ID mode constant
    if:
      type: text
      word: S_ISUID

  - id: go-suid-mode-constant
    desc: Go set-user-ID mode constant
    for: [go]
    if:
      type: text
      word: ModeSetuid

composite_rules:
  - id: suid-mode-check
    desc: Checks set-user-ID mode
    any:
      - id: suid-mode-constant
      - id: go-suid-mode-constant
