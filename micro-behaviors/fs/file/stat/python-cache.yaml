defaults:
  platforms:
  - unix
  for:
  - python
  crit: notable
traits:
- id: python-hidden-cache-existence-check
  desc: Tests existence of hidden macOS cache path
  conf: 0.98
  if:
    type: symbol
    kind: call
    exact: os.path.exists
    arg:
      index: 0
      from:
        call: ^os.path.expanduser$
        literal: Library[/\\]Caches[/\\][^\n]{0,80}\.[\w-]{2,40}
