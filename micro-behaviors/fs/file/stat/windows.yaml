defaults:
  platforms:
    - windows
  for:
    - pe
    - dll
traits:
  # Moved here from fs/sync/fsync/ — querying a file's size is a stat
  # operation, not a flush-to-disk one.
  - id: get-file-size
    desc: Get file size
    crit: baseline
    conf: 0.65
    if:
      type: symbol
      exact: GetFileSize
  - id: sfc-is-file-protected
    desc: Queries Windows file protection
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: SfcIsFileProtected
