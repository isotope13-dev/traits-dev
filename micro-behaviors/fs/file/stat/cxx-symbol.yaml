defaults:
  platforms: [linux, macos, windows]
  for: [binaries]
  attack: T1041
  mbc: E1041

traits:
  - id: cxx-get-file-size-symbol
    desc: C++ GetFileSize routine symbol
    crit: notable
    conf: 0.86
    size_min: 500000
    size_max: 8000000
    if:
      type: text
      exact: _Z11GetFileSizePc
      section: .strtab
