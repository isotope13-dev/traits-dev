defaults:
  platforms: [linux, macos, windows]
  for: [elf, macho, pe, go]
  size_min: 512
  size_max: 524288000
traits:
  - id: is-file-identifier
    desc: File-type flag or predicate named is_file
    crit: notable
    conf: 0.92
    if:
      type: text
      word: is_file

    unless:
    - type: trait
      id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
