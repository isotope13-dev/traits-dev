defaults:
  platforms: [linux]
  for: [c, cpp]

traits:
  - id: parent-process-inode-helper-call
    desc: Parent PID passed to inode lookup helper
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      language: cpp
      query: |
        ((call_expression
          function: (qualified_identifier name: (identifier) @lookup)
          arguments: (argument_list
            (call_expression function: (identifier) @parent
              arguments: (argument_list))))
          (#eq? @lookup "get_inode_of_process")
          (#eq? @parent "getppid"))
