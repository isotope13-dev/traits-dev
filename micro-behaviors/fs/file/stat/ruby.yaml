defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-file-exists
    desc: Ruby File.exist? tests path existence
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((call receiver: (constant) @receiver
          method: (identifier) @method) @test
          (#eq? @receiver "File")
          (#eq? @method "exist?"))
