# Direct syscall instructions expose the same neutral capabilities as imports.
# Presence does not establish execution or malicious intent.
defaults:
  platforms: [linux]
  for: [elf]
  crit: baseline
  conf: 0.9
traits:
  - id: stat-syscall
    desc: Reads file metadata via a Linux syscall
    if:
      type: syscall
      name: [stat, fstat, lstat, newfstatat, fstatat, statx]
