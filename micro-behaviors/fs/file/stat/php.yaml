defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [php]

traits:
  - id: fileperms-call
    desc: Reads file permission mode
    if:
      type: symbol
      kind: call
      exact: fileperms
  - id: clearstatcache-call
    desc: Clears cached file metadata
    if:
      type: symbol
      kind: call
      exact: clearstatcache
