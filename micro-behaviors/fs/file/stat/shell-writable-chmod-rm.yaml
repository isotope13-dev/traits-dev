defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: micro-behaviors/fs/file/stat::writability-test
    desc: Directory tests with chmod and rm clues
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/fs/file/stat::shell-test-dir-and-write
      - id: micro-behaviors/fs/chmod/executable/mode::shell-chmod-any
      - id: micro-behaviors/fs/delete/directory::rm-f
