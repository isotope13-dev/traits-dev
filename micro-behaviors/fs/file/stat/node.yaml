defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: node-stat-sync-call
    desc: Node synchronously reads file metadata
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: fs.statSync

  - id: node-stat-isfile-call
    desc: Node stat result checked for regular file
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: fs.statSync.isFile

  - id: node-isdirectory-call
    desc: Calls a Node-style isDirectory method
    crit: baseline
    conf: 0.72
    count_min: 2
    if:
      type: symbol
      kind: call
      regex: '\.isDirectory$'
