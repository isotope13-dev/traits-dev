defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: micro-behaviors/fs/file/stat::shell-test-dir-and-write
    desc: Tests both directory existence and writability
    crit: component
    all:
      - id: micro-behaviors/fs/file/stat::shell-test-writable
      - id: micro-behaviors/fs/file/stat::shell-test-directory
