defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.96

traits:
  - id: shell-missing-file-exit-guard
    desc: Shell exits on missing file
    if:
      type: tree-sitter
      query: |
        ((if_statement
          condition: (test_command) @test
          (command name: (command_name (word) @exit)
            argument: (number) @status)) @guard
          (#match? @test "^\\[[ \\t]+![ \\t]+-(e|f)[ \\t]+")
          (#eq? @exit "exit") (#eq? @status "0"))
