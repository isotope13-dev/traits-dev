# Executable-file mode markers in unified patches.
# This is a neutral file-mode capability; Git-hook intent is inferred by
# objective composites that combine it with a hooks-path patch target.
defaults:
  platforms: [unix, windows]
  for: [scripts]

traits:
  - id: patch-new-file-executable-mode
    desc: Unified patch adds executable file
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?m)^new file mode 100755$'
