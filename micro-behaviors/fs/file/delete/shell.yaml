# File Delete Operations - Shell
# MBC: C0047 (Delete File)
# ATT&CK: T1070.004
defaults:
  attack: T1070.004
  mbc: C0047
  platforms: [unix]
  for: [shell]
traits:
- id: rm-option-terminator
  desc: rm command uses option terminator
  crit: notable
  conf: 0.7
  if:
    type: text
    # Require shell command position so commented examples are not treated as
    # executed deletion.
    regex: '(?m)(^|[;&|])[ \t]*rm\s+(-[a-z]{1,8}\s+){0,4}--\s+'
  unless:
  - id: metadata/lang/source::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/source::linux-kernel-primary-tree-path
  - type: text
    regex: '(xargs|find)\b.{0,80}\brm\s'
  - type: text
    word: libtoolize
- id: mass-tmp-removal
  desc: Recursively removes the /tmp root
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?m)^\s*rm\s+-rf\s+/tmp/\s*(#.{0,80})?$'
- id: delete-rm-hardcoded
  desc: Deletes files in /tmp, /var/tmp, or /dev
  crit: notable
  conf: 0.66
  if:
    type: text
    regex: 'rm +\-[a-zA-Z]?f[a-zA-Z]? /(tmp|var/tmp|dev)/'
  unless:
  - id: metadata/lang/source::linux-kernel-secondary-tree-path
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
  - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: micro-behaviors/fs/path/package-manager::apt-lists
- id: force-delete-temp-shell-script
  desc: Force-deletes a temporary shell script
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?m)^\s*rm\s+-[rf]*f[rf]*\s+(--\s+)?["'']?/(var/)?tmp/\S{1,80}\.(ba)?sh\b'
- id: shell-delete-installer-artifact
  desc: Shell deletes installer artifact
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: '(?i)\brm\s+(-[rf]+\s+)?\.?[a-z0-9_-]*(install|setup)\.[a-z0-9]+\b'
# Canonical `rm -f "$VAR"` atom. micro-behaviors/fs/delete/variable-target and
# objectives/anti-static/obfuscation/encoding/shell each carried a second copy
# of this matcher, so every shell script that force-deletes a variable path
# reported the same behaviour two or three times under different directories
# (and different ML features); the self-delete and staged-decoder composites
# now reference this one. A command separator is accepted in place of the line
# start so the one-liner form (`... ; rm -f $tmp`) that the removed copies
# covered is not lost.
- id: rm-force-variable-target
  desc: Force-deletes a shell variable target
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?m)(^|[;&|])\s*rm\s+-[rf]*f[rf]*\s+(--\s+)?["\x27]?\$\{?[A-Za-z_]\w*'
# `rm -f "$SCRIPT_PATH"` / `rm -rf "$self"`: the deleted variable is named for
# the running script. The generic variable-target atom above says only that
# *some* variable is deleted, which a loop body sweeping `$gio_module` or
# `$tmpfile` satisfies just as well, so self-delete composites need this one.
- id: rm-force-self-path-variable
  desc: Force-deletes a script-path variable
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '(?im)(^|[;&|])\s*rm\s+-[rf]*f[rf]*\s+(--\s+)?["\x27]?\$\{?(self|script|this|me|prog|src)'
- id: selinux-context-cache-delete
  desc: Deletes SELinux context cache files
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: '(?m)^\s*rm\s+-f\s+/etc/selinux/[A-Za-z0-9._-]{1,64}/contexts/files/\*\.bin\s*$'
composite_rules: []
