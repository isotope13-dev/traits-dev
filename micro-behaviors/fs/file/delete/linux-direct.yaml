# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: unlink-syscall
    desc: Unlinks files via Linux syscall
    crit: baseline
    if:
      type: syscall
      name: [unlink, unlinkat]
      arch: [x86_64, aarch64]
