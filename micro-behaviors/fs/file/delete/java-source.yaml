defaults:
  platforms: [unix, windows]
  for: [java]
  mbc: C0047
  attack: T1070.004
traits:
  - id: java-files-delete
    desc: Java deletes file through NIO
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bFiles\.delete\s*\('
  - id: java-delete-if-exists
    desc: Java deletes file if present
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: Files.deleteIfExists
