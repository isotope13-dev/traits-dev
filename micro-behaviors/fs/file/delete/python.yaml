defaults:
  platforms: [windows, unix]
  for:
    - python
  crit: baseline
  conf: 0.8
traits:
  - id: py-remove
    desc: File deletion (os.remove/os.unlink)
    if:
      type: text
      regex: os\.(remove|unlink)\(
  - id: py-aliased-os-remove
    desc: Python aliased os file deletion
    crit: notable
    conf: 0.88
    if:
      type: text
      # Common short aliases are frequent in compact downloaders. Require the
      # import and the matching method form so ordinary collection.remove()
      # calls do not become file-deletion findings.
      regex: 'import\s+os\s+as\s+(o|_os)\b[\s\S]{0,600}\b(o|_os)\.(remove|unlink)\s*\('
  - id: py-remove-monkey-patch
    desc: Python replaces os.remove with a wrapper
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: os\.remove\s*=\s*[A-Za-z_]\w*
  - id: py-rmtree
    desc: Recursive directory deletion (rmtree)
    crit: notable
    if:
      type: string_literal
      regex: \.rmtree\(
