defaults:
  platforms:
    - unix
    - windows
traits:
  # Relocated from objectives/command-and-control/infrastructure/framework/source
  # (as `go-smb-delete-on-close-state`, "Go SMB delete-on-close state",
  # suspicious/0.9). It was mined alongside genuine Sliver C2 identifiers
  # (CredsCmd, con.Rpc.Creds), but unlike those this token is plain Win32: the
  # FILE_FLAG_DELETE_ON_CLOSE create flag and the DeleteOnClose field of
  # FILE_DISPOSITION_INFORMATION, used by anything that wants a file removed
  # when its last handle closes. It convicted Go's own standard library
  # (`func TestRootOpenFileDeleteOnClose` in os/root_windows_test.go). Kept
  # notable — self-deleting temp files are worth surfacing in a diff — with the
  # SMB C2 composite referencing it cross-directory for the framework reading.
  - id: windows-delete-on-close-flag
    desc: Windows delete-on-close file disposition
    crit: notable
    conf: 0.8
    for: [pe, c, cpp, go, csharp]
    if:
      type: text
      # Keep Qt::WA_DeleteOnClose (widget lifetime) out of this Win32 file
      # disposition trait while retaining Go/Win32 DeleteOnClose fields.
      word: DeleteOnClose
  - id: deletefile
    desc: Delete files (Windows API)
    crit: notable
    conf: 0.66
    for:
      - pe
      - c
      - cpp
    if:
      type: symbol
      exact: DeleteFile
  - id: deletefile-a
    desc: Delete files (Windows API ANSI)
    crit: notable
    conf: 0.66
    for:
      - pe
      - c
      - cpp
    if:
      type: symbol
      exact: DeleteFileA
  - id: deletefile-a-text
    desc: DeleteFileA API name in binary text
    crit: component
    conf: 0.64
    for:
      - pe
      - c
      - cpp
    if:
      type: text
      word: DeleteFileA
    unless:
      - id: deletefile-a
  - id: deletefile-w
    desc: DeleteFileW API symbol
    crit: notable
    conf: 0.66
    for:
      - pe
      - c
      - cpp
    if:
      type: symbol
      exact: DeleteFileW
  - id: del-command
    desc: Windows del command deletes files
    crit: notable
    conf: 0.7
    for:
      - batch
    if:
      type: text
      regex: del %?[A-Za-z0-9_]+%?(\.exe)?
    unless:
      - type: basename
        exact: build-pty4j-libpty.bat
  - id: del-variable-target
    desc: Windows del command with variable target
    crit: notable
    conf: 0.9
    for: [batch]
    if:
      type: text
      regex: '(?i)\bdel\b[^\r\n]{0,20}%[A-Za-z0-9_]{3,}%\b'
  - id: cmd-del-force-quiet
    desc: cmd force-quiet file delete
    crit: notable
    conf: 0.9
    for: [batch, powershell, pe, python, javascript, csharp]
    if:
      type: text
      regex: '(?i)\b(del|erase)\s+/f\s+/q\b'
    unless:
      - id: well-known/app/development/vscode-extension/zephyr-ide::winget-install-script-path
      - id: well-known/app/development/vscode-extension/zephyr-ide::zephyr-refresh-env-cmd
  - id: batch-self-delete
    desc: Batch script self-deletion command
    crit: notable
    conf: 0.95
    attack: T1070.004
    for:
      - batch
      - shell
    if:
      type: text
      regex: (?i)del\s+(/[a-z]\s+){0,3}"?%~f0"?
  - id: quiet-del-command-template
    desc: Quiet Windows del command template
    crit: notable
    conf: 0.87
    for:
      - pe
      - c
      - cpp
    if:
      type: text
      exact: 'del "%s" /Q'
  - id: stack-built-del-format-x86
    desc: x86 stack-built ampersand-del format command
    crit: notable
    conf: 0.96
    for: [pe, dll]
    platforms: [windows]
    arch: [x86]
    if:
      type: hex
      section: .text
      pattern: 'C6 45 ?? 26 C6 45 ?? 64 C6 45 ?? 65 C6 45 ?? 6C C6 45 ?? 20 C6 45 ?? 22 C6 45 ?? 25 C6 45 ?? 73 C6 45 ?? 22'
  - id: powershell-remove-item-force
    desc: PowerShell Remove-Item with -Force
    crit: notable
    conf: 0.7
    for:
      - powershell
    if:
      type: text
      regex: Remove-Item.{0,50}-Force
      case_insensitive: true
composite_rules:
  - id: delete-win
    desc: Delete files (Windows API)
    crit: notable
    conf: 0.66
    any:
      - id: deletefile
      - id: deletefile-a
      - id: deletefile-a-text
      - id: deletefile-w
