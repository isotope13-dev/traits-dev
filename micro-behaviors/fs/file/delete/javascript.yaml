# File Delete Operations - JavaScript/Node.js
# MBC: C0047 (Delete File)
# ATT&CK: T1070.004
#
# NOTE: Individual file deletion is a normal operation (baseline).
# Only suspicious in context (mass deletion, targeting system files, etc.)
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: baseline
  conf: 0.9
  mbc: "C0047"
  attack: "T1070.004"
traits:
  # The npm `del` package removes files or directories. Matching its structured
  # import avoids treating unrelated local functions named `del` as filesystem
  # operations while retaining aliased calls such as `require('del').sync`.
  - id: node-del-package-import
    desc: Imports Node del filesystem helper
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'from ["'']del["'']|require\(["'']del["'']\)'

  - id: node-rm-sync
    desc: Node synchronously removes a file or directory
    if:
      type: symbol
      kind: call
      exact: rmSync

  - id: fs-unlink
    desc: Delete file (fs.unlink)
    if:
      type: symbol
      kind: call
      regex: '^(fs|import_fs[0-9]*\.default)\.unlink$'
  - id: fs-unlinkSync
    desc: Calls synchronous Node unlink method
    if:
      type: symbol
      kind: call
      # Preserve the filesystem operation through imported aliases (`u.unlinkSync`).
      regex: '(^|\.)unlinkSync$'
  - id: fs-rm
    desc: Delete file or directory (fs.rm)
    if:
      type: symbol
      kind: call
      exact: "fs.rm"
  - id: fs-rmSync
    desc: Delete file or directory sync
    if:
      type: symbol
      kind: call
      exact: "fs.rmSync"
  - id: shelljs-rm
    desc: Deletes a file or directory through shelljs
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: shelljs.rm
  - id: fs-rmdir
    desc: Delete empty directory (fs.rmdir)
    if:
      type: symbol
      kind: call
      exact: "fs.rmdir"
  - id: promises-unlink
    desc: Delete file (promises API)
    if:
      type: symbol
      kind: call
      exact: "promises.unlink"

  - id: node-fs-promises-unlink
    desc: Node asynchronously deletes a file
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(^|\.)fs\.unlink$'
