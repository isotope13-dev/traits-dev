# C# file deletion operations.
# ATT&CK: T1070.004 (Indicator Removal: File Deletion)
defaults:
  platforms: [windows, unix]
  for: [csharp]
  attack: T1070.004

traits:
  - id: csharp-delete-combined-path
    desc: C# deletes a combined-path file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Path\.Combine[\s\S]{0,220}File\.Exists[\s\S]{0,220}File\.Delete'

  - id: dotnet-file-delete-call
    desc: .NET code deletes a named file
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\bFile\.Delete\s*\(\s*[A-Za-z_][A-Za-z0-9_]*\s*\)'
