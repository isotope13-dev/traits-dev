# C# file deletion operations.
# ATT&CK: T1070.004 (Indicator Removal: File Deletion)
defaults:
  platforms: [windows, unix]
  for: [csharp]
  attack: T1070.004

traits:
  - id: dotnet-file-delete-call
    desc: .NET code deletes a named file
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\bFile\.Delete\s*\(\s*[A-Za-z_][A-Za-z0-9_]*\s*\)'

  # Narrower sibling: the deleted path variable is itself named for a
  # certificate. Composites that claim "removes the staged certificate" need
  # this, not the generic delete above — otherwise any unrelated File.Delete
  # in the same source file satisfies the claim.
  - id: dotnet-certificate-file-delete-call
    desc: .NET code deletes a certificate file
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bFile\.Delete\s*\(\s*\w{0,24}cert\w{0,24}\s*\)'
