# C# file deletion operations.
# ATT&CK: T1070.004 (Indicator Removal: File Deletion)
defaults:
  platforms: [windows, unix]
  for: [csharp]
  attack: T1070.004

traits:
  - id: dotnet-file-delete-call
    desc: .NET code deletes a named file
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '\bFile\.Delete\s*\(\s*[A-Za-z_][A-Za-z0-9_]*\s*\)'
