defaults:
  crit: notable
  platforms: [windows]
  for: [vbs]

traits:
  - id: vb6-encryptfile-declaration
    desc: VB6 EncryptFile name reference
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bFunction\s+EncryptFile\s*\('

  - id: vb6-encryptdata-call
    desc: VB6 EncryptData name reference
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bEncryptData\s*\('

composite_rules:
  - id: vb6-file-encryption-overwrite
    desc: VB6 encrypt-and-rewrite file flow
    crit: notable
    conf: 0.92
    all:
      - id: vb6-encryptfile-declaration
      - id: vb6-encryptdata-call
      - id: micro-behaviors/fs/delete/file/command::vb6-kill-file-source
      - id: micro-behaviors/fs/write/file/binary::vb6-binary-file-write-source
    near_lines: 20
