defaults:
  platforms: [linux, windows]
  for: [pe, elf, c, cpp, rust, go]

traits:
  - id: native-file-encryption-routine
    desc: Native file or volume encryption function
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: function
      regex: '(?i)(^|[./:])((encrypt|crypt)[_-]?files?|encrypt[_-]?volumes?)$'
