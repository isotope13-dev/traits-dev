# Concatenation joins multiple sources into one output, distinct from copying.
# The FTP variant requires its local-command ! prefix; examples without it do not match.
defaults:
  platforms:
  - windows
  for:
  - scripts
  crit: notable
  conf: 0.9
traits:
- id: cmd-binary-file-concatenation
  desc: Copy /b joins fragments into executable
  crit: notable
  conf: 0.98
  for:
  - batch
  - cmd
  - powershell
  if:
    type: text
    regex: (?im)^\s*copy[^\r\n]{0,24}/b\s+[^\r\n]{1,200}\+[^\r\n]{1,200}\.exe\b
- id: ftp-local-binary-file-concatenation
  desc: FTP copy joins binary data into executable
  crit: notable
  conf: 0.98
  for:
  - text
  - batch
  - cmd
  if:
    type: text
    regex: (?im)^![ \t]*copy[^\r\n]{0,24}/b\s+[^\r\n]{1,200}\+[^\r\n]{1,200}\.exe\b
- id: cmd-wildcard-script-concatenation
  desc: Joins wildcard fragments into script
  crit: notable
  conf: 0.97
  for:
  - batch
  - powershell
  if:
    type: text
    regex: (?im)^\s*copy\s+/b\s+.{0,99}\\\*\.\w{1,8}.{0,99}\.(cmd|bat|ps1|js|vbs)\b
- id: cmd-html-wrapper-concatenation
  desc: Wraps data file in HTML fragments
  crit: notable
  conf: 0.98
  for:
  - batch
  - powershell
  if:
    type: text
    regex: (?im)^\s*copy\s+/b\s+.{0,99}\.html?.{0,99}\+.{0,99}\.xhtml?.{0,99}\.html?\b
