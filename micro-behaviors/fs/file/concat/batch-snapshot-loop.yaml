defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: batch-seeded-snapshot-concat-loop
  desc: Seed append feeds a bound snapshot loop
  crit: notable
  conf: 0.97
  if:
    type: metrics
    field: source.batch.seeded_snapshot_concat_loops
    min: 1
- id: batch-unbounded-snapshot-concat-loop
  desc: Unbounded bound snapshot concatenation loop
  crit: suspicious
  conf: 0.97
  if:
    type: metrics
    field: source.batch.unbounded_snapshot_concat_loops
    min: 1
