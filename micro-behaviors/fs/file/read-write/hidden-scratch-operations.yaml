defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
  - python
  - javascript
  - elf
traits:
- id: hidden-scratch-write-text-7
  desc: Write text names hidden /tmp or /dev/shm
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \b(creat|write)\s*\([^\r\n\x00]{0,50}["'](/dev/shm/|/tmp/)\.[\w.-]{3,80}
- id: hidden-scratch-write-text-8
  desc: Write text names hidden /var/tmp or /dev
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (creat|write)[^\n]{0,80}(/var/tmp/|/dev/)\.[a-zA-Z0-9][\w.-]{2,80}\b
- id: hidden-scratch-write-text-9
  desc: Write text names hidden /run or /mnt
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (creat|write)[^\n]{0,80}(/run/|/mnt/)\.[a-zA-Z0-9][\w.-]{2,80}\b
  unless:
  - id: well-known/lib/ai/haystack-ai::haystack-telemetry-containerenv-doc
