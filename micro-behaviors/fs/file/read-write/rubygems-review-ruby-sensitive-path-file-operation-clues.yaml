defaults:
  platforms: [unix, windows]
  for: [ruby]
traits:
  - id: ruby-credential-path-file-operation
    desc: Ruby operates on a credential file path
    crit: suspicious
    conf: 0.94
    if:
      type: tree-sitter
      query: |
        ((call receiver: [(constant) (scope_resolution)] @owner
          method: (identifier) @method
          arguments: (argument_list . (_) @path)) @operation
          (#match? @owner "^(::)?(File|IO|FileUtils)$")
          (#any-of? @method "read" "binread" "readlines" "foreach" "open" "write"
            "binwrite" "copy" "copy_stream" "cp" "cp_r" "mv" "move" "rename"
            "delete" "unlink" "rm" "rm_f" "rm_rf")
          (#match? @path "(?i)\\.ssh[/\\\\]+id_\\w+|\\.aws[/\\\\]+credentials|Login Data")
          (#not-match? @path "(?i)\\.pub\\W?$"))
        ((call receiver: [(constant) (scope_resolution)] @owner
          method: (identifier) @method
          arguments: (argument_list . (_) . (_) @path)) @operation
          (#match? @owner "^(::)?(File|IO|FileUtils)$")
          (#any-of? @method "copy" "copy_stream" "cp" "cp_r" "mv" "move" "rename")
          (#match? @path "(?i)\\.ssh[/\\\\]+id_\\w+|\\.aws[/\\\\]+credentials|Login Data")
          (#not-match? @path "(?i)\\.pub\\W?$"))
composite_rules:
  - id: ruby-sensitive-path-file-operation-clues
    desc: Ruby file operation near a sensitive path
    crit: notable
    conf: 0.9
    near_lines: 30
    # Keep this as supporting evidence. A nearby path can configure another
    # subsystem while the filesystem calls work on ordinary project files.
    all:
      - id: micro-behaviors/fs/file/read-write::ruby-file-read-write-or-fileutils
    unless:
      # An SSH client resolves key paths because that is what it does; a linter
      # or compliance cop that DETECTS them names the same paths. net-ssh,
      # hrr_rb_ssh, cookstyle's Chef/Security/SshPrivateKey cop and inspec's
      # ssh_key resource all tripped this from inside vendored .gem caches.
      - id: well-known/lib/network/rubygems/net-ssh/
      - id: well-known/lib/network/rubygems/hrr/
      - id: well-known/lib/format/ruby-netrc/
      - id: well-known/tool/sysadmin/capistrano::stage-config-template-context
    any:
      - id: micro-behaviors/fs/path/credential/private-key::ssh-private-key
      - id: micro-behaviors/fs/path/credential/cloud::aws-credentials
      - id: micro-behaviors/fs/path/credential/password-store::login-data
      - id: micro-behaviors/fs/path/app-data/browser::ruby-chrome-config-path
