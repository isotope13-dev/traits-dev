# java.io.RandomAccessFile is the JVM's seek-anywhere read/write file handle.
#
# Relocated from micro-behaviors/fs/delete/secure (2026-08). The matcher only
# observes that an app references the class -- which every app that patches a
# record in place, resumes a partial download, or reads a container header
# does -- so filing it as a shredder primitive under a data-destruction
# attack id described ordinary random-access I/O as secure deletion. The
# overwrite composite still references it from here and supplies the shredder
# context (sync write mode + shred workflow + delete call) itself.
defaults:
  platforms: [android]
  for: [apk]
  crit: notable
  conf: 0.86

traits:
  - id: android-random-access-file
    desc: Android seek-based random-access file handle
    if:
      type: text
      substr: "Ljava/io/RandomAccessFile;"
