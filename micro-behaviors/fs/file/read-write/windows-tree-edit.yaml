defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]


composite_rules:
  - id: windows-file-tree-edit-api-profile
    desc: File overwrite, deletion and traversal references
    crit: notable
    conf: 0.995
    for: [c, cpp]
    all:
      - id: micro-behaviors/fs/write/file/descriptor::positioned-file-overwrite
      - id: micro-behaviors/fs/delete/file/library::delete-win
      - id: micro-behaviors/fs/enumerate/drives::drive-and-file-tree-traversal-source
    unless:
      # Ruby MRI win32.c implements the interpreter's Windows FS layer with
      # CreateFile/SetFilePointer/DeleteFile/FindFirstFile across the file;
      # that is not a mass-overwrite wiper.
      - id: well-known/lib/runtime/scripted/cruby::source-tree
