defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  size_max: 65536

traits:
  - id: dos-four-byte-read-mz-check
    desc: DOS four-byte read and M-byte check
    crit: notable
    conf: 0.93
    if:
      type: hex
      pattern: 'B4 3F B1 04 0E 1F BA ?? ?? CD 21 80 3E ?? ?? 4D (74|75)'

  - id: dos-shared-write-seek-dispatch
    desc: DOS shared write and seek dispatch bytes
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: 'B4 40 EB ?? 32 C0 33 C9 B4 42 33 D2 CD 21 C3'
