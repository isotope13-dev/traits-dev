defaults:
  platforms: [linux, macos, windows]
  for: [binaries, scripts]
composite_rules:
  - id: binary-file-ops
    desc: Opens, reads, or writes file data
    crit: baseline
    conf: 0.8
    any:
      - id: micro-behaviors/fs/file/open::fopen
      - id: micro-behaviors/fs/file/open::open-base
      - id: micro-behaviors/fs/read/file/
      - id: micro-behaviors/fs/write/file/descriptor::write
  - id: file-overwrite-routine
    desc: In-place file overwrite routine
    crit: baseline
    conf: 0.72
    for: [macho]
    platforms: [macos]
    all:
      - id: micro-behaviors/fs/file/open::fopen
      - id: micro-behaviors/fs/read/file/handle::c-fread
      - id: micro-behaviors/fs/write/file/descriptor::write
      - id: micro-behaviors/fs/file/binary::fseek-func
  - id: legacy-win32-file-rewrite
    desc: Legacy Win32 file rewrite APIs
    crit: notable
    conf: 0.9
    ref: sha256:68fa7c436e293739e98bb04034db6d6a3e40a9b9991de5d147368fb696044499
    for: [pe, dll]
    platforms: [windows]
    all:
      - id: micro-behaviors/fs/file/open::legacy-lopen
      - id: micro-behaviors/fs/read/file/handle::legacy-lread
      - id: micro-behaviors/fs/write/file/handle::lwrite
      - id: micro-behaviors/fs/file/handle::legacy-llseek
    any:
      - id: micro-behaviors/fs/file/open::legacy-lcreat
      - id: micro-behaviors/fs/file/timestamp::set-file-time
  - id: ruby-file-read-write-or-fileutils
    desc: Ruby file read/write or concrete FileUtils operation
    for: [ruby]
    platforms: [unix, windows]
    crit: baseline
    conf: 0.5
    any:
      - id: micro-behaviors/fs/read/file/full::ruby-file-read-content
      - id: metadata/lang/source/syntax/member::ruby-file-write-reference
      - id: micro-behaviors/fs/file/copy/call::ruby-fileutils-copy
      - id: micro-behaviors/fs/file/rename::ruby-fileutils-mv
      - id: micro-behaviors/fs/delete/file/library::ruby-file-delete-call
      - id: micro-behaviors/fs/delete/directory::ruby-fileutils-rm-rf
      - id: micro-behaviors/fs/directory/create::ruby-fileutils-mkdir-p
  - id: php-unlink-recreate-pattern
    desc: PHP unlink near file write or open
    for: [php]
    platforms: [unix, windows]
    crit: notable
    conf: 0.92
    near_bytes: 500
    unless:
      - id: well-known/lib/web/
      - id: metadata/package/testing/harness/unit/
    all:
      - id: micro-behaviors/fs/delete/file/library::php-unlink
    any:
      - id: micro-behaviors/fs/file/io-mode::php-write-capable-open-mode
      - id: micro-behaviors/fs/write/file/full::php-file-put-contents
      - id: micro-behaviors/fs/file/io-mode::php-append-file-mode
