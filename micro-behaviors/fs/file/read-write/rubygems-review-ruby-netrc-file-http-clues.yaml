defaults:
  platforms: [unix, windows]
  for: [ruby]
composite_rules:
  - id: ruby-netrc-file-http-clues
    desc: Ruby .netrc path, file operation, and HTTP client clues
    crit: suspicious
    conf: 0.9
    scope: leaf
    all:
      - id: micro-behaviors/fs/path/config/security::ruby-netrc-path-reference
      - id: micro-behaviors/fs/file/read-write::ruby-file-read-write-or-fileutils
      - id: metadata/import/package::ruby-http-client-imports
    unless:
      - id: well-known/lib/format/ruby-netrc::netrc-library-context
      - id: well-known/lib/format/ruby-netrc::netrc-gem-path
      - id: well-known/lib/format/ruby-netrc::netrc-class
