defaults:
  for: [ruby]
  platforms: [unix, windows]
traits:
  - id: ruby-home-relative-file-reader
    desc: Helper reads a caller-chosen home file
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (method parameters: (method_parameters (identifier) @path)
          body: (body_statement
            (call receiver: (call receiver: (constant) @file method: (identifier) @read
              arguments: (argument_list (call receiver: (constant) @join_file method: (identifier) @join
                arguments: (argument_list (call receiver: (constant) @dir method: (identifier) @home)
                  (identifier) @joined)))) method: (identifier) @slice))
          (#eq? @file "File") (#eq? @read "read") (#eq? @join_file "File")
          (#eq? @join "join") (#eq? @dir "Dir") (#eq? @home "home")
          (#eq? @path @joined) (#eq? @slice "slice"))
