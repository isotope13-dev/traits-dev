# Co-occurrence only: these byte patterns do not bind calls to one file.
defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib]
  size_max: 65536

traits:
  - id: dos-counted-file-generation-loop
    for: [dos_com, data]
    desc: DOS loop writes numbered output files
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "B4 3C (33 C9|31 C9) BA ?? ?? CD 21 50 [12-32] E8 ?? ?? 5B B4 40 CD 21 B4 3E CD 21 [0-8] (FE 47 01 80 7F 01 39|FE 06 ?? ?? 80 3E ?? ?? 39)"

composite_rules:
  - id: dos-search-write-time-sequences
    desc: DOS search, write and set-time sequences
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/fs/search/command::dos-int21-find-first-call
      - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-write-call
      - id: micro-behaviors/fs/file/timestamp::dos-int21-set-file-time
    any:
      - id: metadata/binary/code/control-transfer::dos-al-two-near-call
      - id: micro-behaviors/fs/file/open/write::dos-open-update-dispatch

  - id: dos-read-seek-write-time-sequences
    desc: DOS read, seek, write and set-time sequences
    crit: suspicious
    conf: 0.94
    all:
      - id: micro-behaviors/fs/read/file/handle::dos-int21-read-call
      - id: micro-behaviors/fs/file/seek::dos-seek-end-int
      - id: micro-behaviors/fs/write/file/handle/int21::dos-int21-write-call
      - id: micro-behaviors/fs/file/seek::dos-seek-start-int
      - id: micro-behaviors/fs/file/timestamp::dos-int21-set-file-time

  - id: dos-e9-store-and-file-write-sequences
    for: [dos_com]
    desc: DOS E9 store and file-write sequences
    crit: suspicious
    conf: 0.9
    all:
      - id: metadata/binary/code/control-transfer::dos-store-e9-byte
      - id: micro-behaviors/fs/write/file/handle/int21::dos-write-dispatch
