defaults:
  platforms: [windows, unix]
  for: [rust]

traits:
  - id: rust-write-file-identifier
    desc: Rust write_file identifier
    crit: notable
    conf: 0.8
    if:
      type: text
      word: write_file
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
    - id: micro-behaviors/fs/file/copy::python-write-file-helper-call
