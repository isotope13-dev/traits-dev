# Multiple file operations also occur in ordinary maintenance pages.
defaults:
  platforms: [unix, windows]
  for: [cfml]
composite_rules:
  - id: cfml-multiple-file-operations
    desc: CFML page combines multiple file operations
    crit: notable
    conf: 0.9
    all:
      - id: metadata/lang/scripted::cfml-output-tag
    any:
      - id: micro-behaviors/fs/write/content::cffile-write
      - id: micro-behaviors/fs/write/content::cffile-upload
      - id: micro-behaviors/fs/delete/file/command::cffile-delete
      - id: micro-behaviors/fs/delete/directory::cfdirectory-delete
      - id: micro-behaviors/fs/delete/file/library::cfm-java-file-delete
      - id: micro-behaviors/fs/file/move::cffile-move
      - id: micro-behaviors/fs/file/copy::cffile-copy
      - id: micro-behaviors/fs/directory/readdir::cfdirectory-list
      - id: micro-behaviors/fs/directory/mkdir::cfdirectory-create
    needs: 3
