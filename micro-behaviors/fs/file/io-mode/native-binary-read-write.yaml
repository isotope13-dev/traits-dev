defaults:
  platforms: [windows, unix]
  for: [c, cpp, binaries]
traits:
- id: mode-read-write-binary
  desc: References binary read/write file mode
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '"[rw]b\+"'
  unless:
    - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
