defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
  - id: php-write-capable-open-mode
    desc: PHP opens a stream in writable mode
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((function_call_expression
          function: (name) @fn
          arguments: (arguments . (argument) . (argument [
            (string (string_content) @mode)
            (encapsed_string (string_content) @mode)])))
          (#eq? @fn "fopen")
          (#match? @mode "^[wxc]b?\\+?$"))
