# `binmode` changes the stream's text/binary handling for reads or writes.
defaults:
  for: [ruby]
  platforms: [unix, windows]

traits:
  - id: ruby-stream-binmode-call
    desc: Ruby sets stream to binary I/O mode
    crit: baseline
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: binmode

  - id: ruby-write-append-mode
    desc: Ruby opens file for writing or appending
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: File.open
      arg:
        index: 1
        kind: string
        regex: '^[wa][bt+]*$'
