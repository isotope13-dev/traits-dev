traits:
  - id: perl-open-write-truncate
    desc: Perl opens a file for overwriting
    platforms: [unix]
    for: [perl, static-lib]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'open\s*\(\s*\w+\s*,\s*["'']>[^>]'
  - id: perl-open-append
    desc: Perl opens a file for appending
    platforms: [unix]
    for: [perl, static-lib]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'open\s*\(\s*\w+\s*,\s*["'']>>'
  - id: perl-open-write-variable-path
    desc: Perl opens a variable path for writing
    crit: notable
    conf: 0.88
    platforms: [unix, windows]
    for: [static-lib, text]
    if:
      type: hex
      pattern: "6F 70 65 6E 28 [0-16] 22 3E 24"
      offset_range: [0, 4096]
