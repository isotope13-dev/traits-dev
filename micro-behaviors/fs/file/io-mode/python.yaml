defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
traits:
- id: python-open-rplusb
  desc: Opens a file in read-write binary mode
  conf: 0.72
  if:
    type: text
    regex: open\([^)]{0,140}['"]r\+b['"]
  downgrade:
    any:
    - id: metadata/package/testing/presence/harness/
    - id: metadata/package/testing/scripted/
    - id: metadata/path::test-directory-component
- id: python-open-file-var-wb
  desc: Opens a 'file' variable for binary write
  conf: 0.83
  if:
    type: text
    regex: with\s+open\(\s*file\s*,\s*['"]wb['"]
  downgrade:
    any:
    - id: metadata/package/testing/presence/harness/
    - id: metadata/package/testing/scripted/
    - id: metadata/path::test-directory-component
