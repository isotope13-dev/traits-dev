defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
traits:
- id: python-open-file-var-wb
  desc: Opens a 'file' variable for binary write
  conf: 0.83
  if:
    type: text
    regex: with\s+open\(\s*file\s*,\s*['"]wb['"]
  downgrade:
    any:
    - id: metadata/package/testing/scripted/
    - id: metadata/path/directory::test-directory-component
