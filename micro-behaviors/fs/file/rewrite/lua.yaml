defaults:
  for:
    - "lua"
  platforms:
    - "unix"
    - "windows"
traits:
  - id: "lua-read-rewrite-same-path"
    desc: "Lua opens same path for read/replacement"
    crit: "notable"
    conf: 0.96
    if:
      type: "tree-sitter"
      language: "lua"
      query: |
        ((function_declaration body: (block
          (variable_declaration (assignment_statement (expression_list
            (function_call name: (dot_index_expression) @readopen
              arguments: (arguments (identifier) @input (string) @rb)))))
          (variable_declaration (assignment_statement (expression_list
            (function_call name: (dot_index_expression) @writeopen
              arguments: (arguments (identifier) @output (string) @wb)))))))
          (#eq? @readopen "io.open") (#eq? @writeopen "io.open")
          (#eq? @input @output) (#match? @rb "[\"']rb[\"']") (#match? @wb "[\"']wb[\"']"))
