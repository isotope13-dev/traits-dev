# Retains the former disk/raw::delayed-delete-until-reboot matcher unchanged.
# MoveFileEx with a non-NULL destination schedules a rename, not deletion;
# proximity to the flag alone establishes neither destruction nor a wipe.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]

traits:
  - id: movefile-reboot-delay-cooccurrence
    desc: MoveFileEx near a reboot-delay flag
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'MoveFileEx[AW]?[\s\S]{0,240}MOVEFILE_DELAY_UNTIL_REBOOT'
