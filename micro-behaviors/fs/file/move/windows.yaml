# File moving and renaming - Windows
# General file operation; T1486 (ransomware) mapping belongs in composites
# that combine MoveFile with encryption indicators
defaults:
  crit: baseline
  for: [pe, dll, c, cpp]
  platforms: [windows]
traits:
  - id: move-file
    desc: Move or rename file
    conf: 0.9
    if:
      type: symbol
      regex: "MoveFile[AW]?$"
  - id: move-file-import-a
    desc: Move or rename file through MoveFileA import
    conf: 0.9
    if:
      type: import
      exact: MoveFileA
  - id: move-file-import-a-symbol
    desc: MoveFileA symbol in import table
    conf: 0.9
    if:
      type: symbol
      exact: MoveFileA
  - id: move-file-ex
    desc: Move or rename file with options
    conf: 0.9
    if:
      type: symbol
      regex: "MoveFileEx[AW]?$"
  - id: move-file-with-progress
    desc: Move file with progress callback/options
    conf: 0.9
    if:
      type: symbol
      regex: "MoveFileWithProgress[AW]?$"

  - id: move-file-to-extension
    desc: Win32 move to dotted extension
    conf: 0.88
    for: [c, cpp]
    if:
      type: text
      regex: '(?i)MoveFile[AW]?.{0,180}\.[a-z][a-z0-9]{2,11}'

  # Relocated from objectives/evasion/self-delete/process. The matcher only
  # sees the MoveFile name -- MinGW headers embed MoveFile/MoveFileEx the same
  # way -- so the .NET melt context comes from dotnet-melt-delete-workflow.
  - id: move-file-name-reference
    desc: References the MoveFile API by name
    for: [pe, dll, csharp, batch]
    conf: 0.68
    if:
      type: text
      word: MoveFile

composite_rules:
  - id: movefile-a-rewrite-api
    desc: MoveFileA API for host file rewrite
    crit: notable
    conf: 0.9
    for: [pe, dll]
    unless:
      - id: metadata/binary/installer/family/
    any:
      - id: move-file-import-a
      - id: move-file-import-a-symbol
      - id: move-file
