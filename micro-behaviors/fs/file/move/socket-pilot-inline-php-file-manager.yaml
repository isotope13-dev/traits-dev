# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - php
  - html
  - text
  - data
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.95
traits:
- id: php-path-upload-handler
  desc: PHP upload-move call with file request data
  if:
    type: text
    regex: '(?i:move_uploaded_file)\s*\(\s*\$_FILES'
