# `<cffile action="move|rename">` relocates a file.
# FileFacts identifies ColdFusion pages as `cfml`.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.88
traits:
  - id: cffile-move
    desc: ColdFusion moves or renames a file
    if:
      type: symbol
      kind: call
      exact: cffile
      arg:
        index: 0
        from:
          field: action
          whole_value: '(?i)^(move|rename)$'
