# `<cffile action="move|copy|rename">` — the ColdFusion spelling of mv/cp.
# FileFacts identifies ColdFusion pages as `cfml`.
defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.88
traits:
  - id: cffile-relocate
    desc: ColdFusion cffile moves or copies a file
    if:
      type: text
      regex: '<\s*cffile\s+action\s*=\s*["'']?(move|copy|rename)'
      case_insensitive: true
