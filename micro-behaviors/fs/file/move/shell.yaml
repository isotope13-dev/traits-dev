defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.86

traits:
  - id: mv-command
    desc: Shell invokes mv
    crit: baseline
    conf: 0.75
    if:
      type: symbol
      kind: call
      regex: ^(mv|"mv"|'mv')$
    unless:
    - type: symbol
      kind: function
      exact: mv
    - id: "metadata/lang/source/shape::shell-parser-recovery-node"
  - id: mv-log-to-system-bin
    desc: Moves log file into system bin
    conf: 0.92
    attack: T1036.005
    if:
      type: text
      regex: '(^|[;&|()]\s*)mv\s+[^;&|`\n]{1,180}\.log\s+/usr/bin/[A-Za-z0-9._-]{1,80}\b'
  - id: quiet-mv-command
    desc: mv command suppresses stderr
    conf: 0.86
    if:
      type: text
      regex: '(^|[;&|()]\s*)mv\s+[^;&|`''\n]{1,220}\s+2>/dev/null'
    not:
      - regex: '\.(new|tmp)["'']?\s+2>/dev/null'
  - id: mv-before-local-exec
    desc: Renames a file before local execution
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: (?ms)^\s*mv\s+\S{1,80}\s+\S{1,80}[\s\S]{0,180}^\s*\./\S{1,80}

  # `mktemp "$dest/.name.XXXXXX"` creates the staging file inside the
  # destination directory so the later `mv` is an atomic same-filesystem
  # rename. Installers stage, probe and publish this way; a dropper hides
  # its payload under a different name instead.
  - id: mktemp-destination-staging
    desc: mktemp stages hidden file beside target
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: 'mktemp\s+"\$\{?\w+\}?/\.'
  - id: upgrade-rollback-guard-mv
    desc: Upgrade guard restores backup with mv
    conf: 0.9
    if:
      type: text
      regex: '\|\|\s*\{\s*\[\s*-f.{0,160}\bmv\s'

composite_rules:
  - id: quiet-mv-chmod-executable
    desc: Quiet mv followed by executable chmod
    crit: suspicious
    conf: 0.94
    attack: T1036.005
    near_lines: 5
    all:
      - id: quiet-mv-command
      - id: micro-behaviors/fs/chmod/executable/mode::shell-owner-executable-numeric-mode
    # An atomic-upgrade rollback guard (`[ -e new ] || { [ -f backup ] && mv
    # backup new ...; }`) restores the previous version when an update was cut
    # off mid-swap; installers emit it beside the chmod of their own launcher.
    # That guard shape is upgrade hygiene, not masquerading.
    unless:
      - id: upgrade-rollback-guard-mv
      - id: mktemp-destination-staging
      - id: metadata/binary/linking/runtime::ape-binary-marker
      - id: metadata/binary/linking/runtime::cosmopolitan-marker
      - id: well-known/app/ai/coding-agent/claude-multiacc::archive-context
      - id: well-known/app/ai/coding-agent/claude-multiacc::claude-pool-path
      - id: well-known/app/ai/coding-agent/claude-multiacc::codex-pool-path
      - id: well-known/app/ai/coding-agent/claude-multiacc::pool-manager-script
