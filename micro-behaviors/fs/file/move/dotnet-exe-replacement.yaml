defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: managed-exe-replacement-api-set
    desc: Managed EXE traversal and replacement API set
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule managed_exe_replacement_api_set {
          strings:
            $clr = "BSJB"
            $drives = "GetDrives" ascii fullword
            $read = "ReadAllBytes" ascii fullword
            $write = "WriteByte" ascii fullword
            $move = "Move" ascii fullword
            $delete = "Delete" ascii fullword
            $files = "GetFiles" ascii fullword
            $exe = ".exe" wide
            condition:
         uint16(0) == 0x5a4d and all of them
        }
