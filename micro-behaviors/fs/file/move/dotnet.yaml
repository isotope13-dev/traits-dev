defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: dotnet-file-move-import
    desc: Imports .NET File.Move
    crit: notable
    conf: 1.0
    if:
      type: import
      exact: System.IO.File.Move
  - id: dotnet-file-move-call
    desc: Calls .NET File.Move
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: System.IO.File.Move
