defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536
  conf: 0.98
traits:
- id: dos-entry-com-extension-to-dta
  desc: Copies entry COM extension into DTA name
  crit: notable
  if:
    type: hex
    pattern: 43 4F 4D [0-24] BF 9E 00 8B D7 B8 2E 5B AE 75 FD A5 A4 CD 21
    offset: 0

# SI starts at 0100h. PUSH SI saves the image pointer; two LODSWs
# advance SI to the embedded COM bytes. MOVSW/MOVSB copy that extension
# into the DTA filename. POP DX restores the saved image for AH=40h.
# CX is initialized from AX; the write count and trailing padding vary.
- id: dos-entry-image-create-extension-twin
  desc: Creates DTA extension twin from own image
  crit: notable
  if:
    type: hex
    offset: 0
    pattern: "2A 2E 45 2A 43 4F 4D 56 91 (8B D6|89 F2) AD AD B4 4E CD 21 72 ?? BA 9E 00 B8 2E 5B AE 75 ?? A5 A4 CD 21 5A 72 ?? 93 (B1 ??|B9 ?? ??) B4 40 CD 21"

# This fixed instruction layout puts the extension at entry+29h and the
# shared CWD dispatcher at entry+0Bh. Pin those operand targets so the
# matcher proves both the extension source and write-buffer restoration.
- id: dos-cwd-image-create-extension-twin
  desc: Creates COM twin via shared image dispatch
  crit: notable
  if:
    type: hex
    offset: 0
    pattern: "2A 2E (65|45) 2A B4 4E B9 9E 00 87 CE 99 FE C6 CD 21 73 01 C3 B2 29 87 D6 AF B0 2E F2 AE A5 A4 B4 5B CD 21 72 03 93 B4 40 EB E2 (63 6F 6D|43 4F 4D)"

# Mask-first form with a 32-bit extension store: the "*.e*" mask is the
# first entry bytes, so SI=0100h doubles as the find-first mask pointer.
# REPNE SCASB finds the DTA name's dot, a DWORD store writes "COM\0" over the
# extension, and a CALL to the next instruction lets the create INT 21h
# return into the AH=40h write, which ends in RET. Written as YARA so the
# tiny-image sequence is evaluated on files under the engine's size floor.
- id: dos-entry-mask-dword-com-extension-twin
  desc: Creates COM twin via DWORD extension store
  crit: notable
  if:
    type: yara
    source: |
      rule dos_entry_mask_dword_com_extension_twin {
        meta:
          filetypes = "dos_com,data"
        strings:
          $twin = { 2A 2E ( 45 | 65 ) 2A 8B D6 B4 4E CD 21 BA 9E 00 B8 2E 5B F2 AE 66 C7 05 43 4F 4D 00 [0-4] E8 00 00 CD 21 93 B4 40 [0-4] C3 }
        condition:
          $twin at 0
      }

# Mask-first form with the DTA pointer in DI: the "*.e*" mask is the first
# entry bytes (SI=0100h), the find-first INT 21h is followed by a SCASB scan
# of the DTA name for its dot, a DWORD store replaces the extension, and the
# create-new result is exchanged into BX for an AH=40h write that loops
# through a short JMP. Written as YARA so the tiny-image sequence is
# evaluated on files under the engine's size floor.
- id: dos-entry-mask-scasb-com-extension-twin
  desc: Creates COM twin via SCASB dot scan
  crit: notable
  if:
    type: yara
    source: |
      rule dos_entry_mask_scasb_com_extension_twin {
        meta:
          filetypes = "dos_com,data"
        strings:
          $twin = { 2A 2E ( 45 | 65 ) 2A BF 9E 00 91 B4 4E 8B D6 CD 21 8B D7 B8 2E 5B AE 75 FD 66 C7 05 ?? ?? ?? ?? CD 21 72 ?? 93 B4 40 [0-4] EB ?? C3 }
        condition:
          $twin at 0
      }

# Mask-first form that takes the find-first mask pointer from SI with
# PUSH SI / POP DX and writes the image once. The "*.e*" mask is the first
# entry bytes, the dot scan is SCASB, a DWORD store writes "com\0", and the
# create-new handle is exchanged into BX for an AH=40h write from 0100h.
# Written as YARA so the tiny image is evaluated under the engine's size floor.
- id: dos-entry-mask-push-pop-com-extension-twin
  desc: Creates COM twin from pushed SI mask
  crit: notable
  if:
    type: yara
    source: |
      rule dos_entry_mask_push_pop_com_extension_twin {
        meta:
          filetypes = "dos_com,data"
        strings:
          $twin = { 2A 2E ( 45 | 65 ) 2A 91 B4 4E 56 5A CD 21 BA 9E 00 B8 2E 5B AE 75 FD 66 C7 05 ?? ?? ?? ?? CD 21 93 B4 40 [0-4] BA 00 01 CD 21 C3 }
        condition:
          $twin at 0
      }

# Mask-first form that scans the DTA name with LODSB / CMP AL,2Eh / JNZ and
# stores the new extension through SI. The "*.e*" mask is the first entry
# bytes, find-first is issued with the mask moved through CX/DX, create-new
# returns the handle for an AH=40h write, and a short JMP loops to the next
# match. Written as YARA so the tiny image is evaluated under the engine's
# size floor.
- id: dos-entry-mask-lodsb-com-extension-twin
  desc: Creates COM twin from LODSB dot scan
  crit: notable
  if:
    type: yara
    source: |
      rule dos_entry_mask_lodsb_com_extension_twin {
        meta:
          filetypes = "dos_com,data"
        strings:
          $twin = { 2A 2E ( 45 | 65 ) 2A B9 9E 00 B4 4E 87 CE 8B D1 CD 21 73 01 C3 8B D6 AC 3C 2E 75 FB 66 C7 04 ?? ?? ?? ?? B4 5B CD 21 72 ?? 93 B4 40 [0-4] 87 D1 EB ?? }
        condition:
          $twin at 0
      }

# Same companion flow as the SCASB forms above, padded with JMP $+2 and NOP
# junk between the real instructions and ending in a bare RET. Written as
# YARA so the tiny image is evaluated under the engine's size floor.
- id: dos-entry-mask-junk-padded-com-extension-twin
  desc: Creates COM twin through junk-padded flow
  crit: notable
  if:
    type: yara
    source: |
      rule dos_entry_mask_junk_padded_com_extension_twin {
        meta:
          filetypes = "dos_com,data"
        strings:
          $twin = { 2A 2E ( 45 | 65 ) 2A 91 B4 4E EB 00 EB 00 E8 01 00 90 8B D6 90 CD 21 BA 9E 00 B8 2E 5B EB 00 AE 75 FB 66 C7 05 ?? ?? ?? ?? CD 21 90 93 B4 40 B1 ?? EB 00 C3 }
        condition:
          $twin at 0
      }

# LODSB dot scan with the DTA name pointer in SI (SI=009Eh from the entry),
# a DWORD extension store, create-new, and a NOP-padded JMP loop. Written as
# YARA so the tiny image is evaluated under the engine's size floor.
- id: dos-entry-mask-si-lodsb-com-extension-twin
  desc: Creates COM twin from SI LODSB scan
  crit: notable
  if:
    type: yara
    source: |
      rule dos_entry_mask_si_lodsb_com_extension_twin {
        meta:
          filetypes = "dos_com,data"
        strings:
          $twin = { 2A 2E ( 45 | 65 ) 2A BE 9E 00 91 B4 4E BA 00 01 CD 21 73 03 90 90 C3 8B D6 AC 3C 2E 75 FB 66 C7 04 ?? ?? ?? ?? B4 5B CD 21 72 ?? 93 B4 40 B1 ?? 90 90 EB ?? }
        condition:
          $twin at 0
      }

# Mask-first form whose extension store goes through the stack: the "*.e*"
# mask opens the image, REPNE SCASB finds the dot, a stack word is popped
# into the name (FF /5 operand then POP [DI]), and create-new is followed by
# the handle exchange and AH=40h write. Written as YARA so the tiny image is
# evaluated under the engine's size floor.
- id: dos-entry-mask-stack-store-com-extension-twin
  desc: Creates COM twin via stack-word store
  crit: notable
  if:
    type: yara
    source: |
      rule dos_entry_mask_stack_store_com_extension_twin {
        meta:
          filetypes = "dos_com,data"
        strings:
          $twin = { 2A 2E ( 45 | 65 ) 2A B4 4E 89 F2 CD 21 BA 9E 00 B8 2E 5B F2 AE FF AF ?? ?? 8F 05 8B CE CD 21 93 B4 40 73 ?? C3 }
        condition:
          $twin at 0
      }

# Mask-first form with a CALL $+3 / PUSH SI / POP DX pair that sets the
# find-first mask pointer from SI, then SCASB with DI=009Eh, a DWORD extension
# store, create-new, and one AH=40h write ending in RET. Written as YARA so
# the tiny image is evaluated under the engine's size floor.
- id: dos-entry-mask-call-pop-com-extension-twin
  desc: Creates COM twin via CALL-POP mask
  crit: notable
  if:
    type: yara
    source: |
      rule dos_entry_mask_call_pop_com_extension_twin {
        meta:
          filetypes = "dos_com,data"
        strings:
          $twin = { 2A 2E ( 45 | 65 ) 2A BF 9E 00 91 B4 4E E8 00 00 56 5A CD 21 8B D7 B8 2E 5B AE 75 FD 66 C7 05 ?? ?? ?? ?? CD 21 93 B4 40 B1 ?? C3 }
        condition:
          $twin at 0
      }

# Mask-first form with DI=009Eh as the SCASB cursor and DX copied from DI,
# a DWORD extension store, create-new with a JC skip, then the handle
# exchange, a CL byte count and AH=40h before a short JMP back. Written as
# YARA so the tiny image is evaluated under the engine's size floor.
- id: dos-entry-mask-di-scasb-com-extension-twin
  desc: Creates COM twin from DI SCASB scan
  crit: notable
  if:
    type: yara
    source: |
      rule dos_entry_mask_di_scasb_com_extension_twin {
        meta:
          filetypes = "dos_com,data"
        strings:
          $twin = { 2A 2E ( 45 | 65 ) 2A BF 9E 00 91 B4 4E 8B D6 CD 21 8B D7 B8 2E 5B AE 75 FD 66 C7 05 ?? ?? ?? ?? CD 21 72 07 93 B1 ?? B4 40 EB ?? C3 }
        condition:
          $twin at 0
      }

# Mask-first form like the DI SCASB twin above, but find-first is followed by
# JNC +1 / RET (leave when nothing matches) and the loop closes with a JMP
# after CL is loaded behind AH=40h. Written as YARA so the tiny image is
# evaluated under the engine's size floor.
- id: dos-entry-mask-jnc-ret-com-extension-twin
  desc: Creates COM twin after JNC-RET search
  crit: notable
  if:
    type: yara
    source: |
      rule dos_entry_mask_jnc_ret_com_extension_twin {
        meta:
          filetypes = "dos_com,data"
        strings:
          $twin = { 2A 2E ( 45 | 65 ) 2A BF 9E 00 91 B4 4E 8B D6 CD 21 73 01 C3 8B D7 B8 2E 5B AE 75 FD 66 C7 05 ?? ?? ?? ?? CD 21 72 ?? 93 B4 40 B1 ?? EB ?? }
        condition:
          $twin at 0
      }

# Entry-mask companion maker whose find-first is reached through a NOP /
# XCHG CX,AX preamble and a zero-displacement CALL, with the mask passed in
# DX from SI. The DTA name is scanned for its dot, the extension is
# overwritten with "com ", the new file is created and the image written
# from its first bytes. Written as YARA so the tiny image is evaluated under
# the engine's size floor.
- id: dos-entry-mask-nop-call-com-extension-twin
  desc: Creates COM twin after NOP-CALL search
  crit: notable
  if:
    type: yara
    source: |
      rule dos_entry_mask_nop_call_com_extension_twin {
        meta:
          filetypes = "dos_com,data"
        strings:
          $twin = { 2A 2E ( 45 | 65 ) 2A 90 91 B4 4E E8 00 00 8B D6 EB 00 CD 21 BA 9E 00 B8 2E 5B AE 75 FD 66 C7 05 ?? ?? ?? ?? CD 21 93 B4 40 B1 ?? C3 }
        condition:
          $twin at 0
      }

