defaults:
  platforms: [windows]
  for: [dos_com, data]
  arch: [x86]
  size_max: 65536

traits:
  - id: dos-jump-padded-create-image-write
    desc: DOS create, image-buffer write and close
    crit: notable
    conf: 0.98
    if:
      type: hex
      offset_range: [0, 1024]
      # DX names the file; CX=0 supplies normal attributes. AL in AX=3Cxx
      # does not set attributes. EB 01 90 skips a NOP between operations.
      pattern: 'BA ?? ?? EB 01 90 33 C9 EB 01 90 B8 ?? 3C EB 01 90 CD 21 EB 01 90 93 EB 01 90 B4 40 EB 01 90 B9 ?? ?? EB 01 90 BA 00 01 EB 01 90 CD 21 EB 01 90 B4 3E EB 01 90 CD 21'
  - id: dos-command-com-create-target
    desc: DOS create targets root COMMAND.COM
    crit: notable
    conf: 0.99
    if:
      # Bind the create target to DS:DX, accepting a PSP-bearing memory
      # image and a PSP-stripped COM. An unrelated path mention fails.
      type: yara
      source: |
        rule dos_create_targets_command_interpreter {
          meta:
            filetypes = "dos_com,data"
          strings:
            $create = { BA ?? ?? EB 01 90 33 C9 EB 01 90 B8 ?? 3C EB 01 90 CD 21 }
            $path = /[a-z]:\\command\.com\x00/ nocase
          condition:
            for any i in (1..#create) : (
              @create[i] < 1024 and (
                $path at uint16(@create[i] + 1) or
                (uint16(@create[i] + 1) >= 256 and
                 $path at (uint16(@create[i] + 1) - 256))
              )
            )
        }
