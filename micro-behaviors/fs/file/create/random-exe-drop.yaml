defaults:
  platforms:
    - windows
  for:
    - pe
traits:
  - id: random-named-exe-in-root
    desc: Random-named executable in root directory
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: C:\\[a-zA-Z0-9]{8}\.exe
    unless:
      # Malware corpora sometimes append large lists of synthetic sandbox
      # paths as inert overlay padding.  Those references do not show that the
      # executable creates any of the named files.
      - id: micro-behaviors/fs/path/padding::sandbox-paths
  - id: random-named-exe-in-temp
    desc: Hash-named executable in temp directory
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: C:\\Users\\[a-zA-Z0-9_\- ]{1,50}\\AppData\\Local\\Temp\\[a-fA-F0-9]{32,64}\.exe
    unless:
      - id: micro-behaviors/fs/path/padding::sandbox-paths
  - id: gcc-random-lowercase-exe-name
    desc: Generates a randomized lowercase exe name
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # GCC's signed division-by-26 sequence maps rand() into a-z. Require the
      # same routine to append ".exe" so this is a filename, not alphabet math.
      pattern: 'BA 4F EC C4 4E 89 C8 F7 EA 89 D0 C1 F8 03 89 CA C1 FA 1F 29 D0 6B D0 1A 89 C8 29 D0 83 C0 61 [16-96] C7 00 2E 65 78 65'
