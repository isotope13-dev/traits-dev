defaults:
  platforms:
    - windows
  for:
    - pe
traits:
  - id: random-named-exe-in-root
    desc: Random-named executable in root directory
    crit: suspicious
    conf: 0.8
    if:
      type: text
      regex: C:\\[a-zA-Z0-9]{8}\.exe
    unless:
      # Malware corpora sometimes append large lists of synthetic sandbox
      # paths as inert overlay padding.  Those references do not show that the
      # executable creates any of the named files.
      - id: micro-behaviors/fs/path/padding::sandbox-paths
  - id: random-named-exe-in-temp
    desc: Hash-named executable in temp directory
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: C:\\Users\\[a-zA-Z0-9_\- ]{1,50}\\AppData\\Local\\Temp\\[a-fA-F0-9]{32,64}\.exe
    unless:
      - id: micro-behaviors/fs/path/padding::sandbox-paths
