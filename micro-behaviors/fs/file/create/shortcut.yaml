defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: internet-shortcut-content
    desc: Embeds Windows Internet Shortcut content
    if:
      type: literal
      substr: '[InternetShortcut]'

  - id: electron-desktop-path
    desc: Electron resolves the desktop directory
    if:
      type: symbol
      kind: call
      regex: '(^|\.)app\.getPath$'
      arg:
        kind: string
        exact: desktop

composite_rules:
  - id: desktop-internet-shortcut-write
    desc: Writes desktop Internet Shortcut files
    near_bytes: 512
    all:
      - id: internet-shortcut-content
      - id: electron-desktop-path
      - id: micro-behaviors/fs/file/write/direct::node-write-file-sync
