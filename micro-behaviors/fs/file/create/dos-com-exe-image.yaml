# After create (AH=3Ch), MOV BH,40h / XCHG AX,BX puts the write service in
# AH and the new handle in BX, then INT 21h writes the image.
defaults:
  for: [dos_com, data]
  platforms: [windows, unix]
  size_max: 65536
traits:
  - id: dos-create-xchg-image-write
    desc: Creates a file then writes image
    crit: notable
    conf: 0.94
    if:
      type: yara
      source: |
        rule dos_create_xchg_image_write {
          meta:
            filetypes = "dos_com,data"
          strings:
            $w = { B4 3C [0-6] CD 21 [0-10] B7 40 93 [0-4] CD 21 }
          condition:
            $w in (0..256)
        }
  # Create (AH=3Ch), exchange the handle, load AH=40h, then a far jump
  # into the saved INT 21h performs the write.
  - id: dos-create-far-write
    desc: Create then far-calls a write
    crit: notable
    conf: 0.94
    if:
      type: yara
      source: |
        rule dos_create_far_write {
          meta:
            filetypes = "dos_com,data"
          strings:
            $c = { B4 3C CD 21 93 [0-8] B4 40 EA }
          condition:
            $c in (0..256)
        }
