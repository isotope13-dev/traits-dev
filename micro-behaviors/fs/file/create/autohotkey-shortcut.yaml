defaults:
  platforms: [windows]
  for: [text]
traits:
  - id: autohotkey-shortcut-chained-start
    desc: AutoHotkey LNK that chains start commands
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?im)^[ \t]*FileCreateShortcut[ \t]*,.{0,160}\bstart\b.{0,80}&.{0,30}\bstart\b'
