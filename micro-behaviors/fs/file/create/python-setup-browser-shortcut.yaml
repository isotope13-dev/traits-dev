defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
- id: pypi-browser-shortcut-target
  desc: PyPI installer targets browser shortcut
  crit: suspicious
  conf: 0.9
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/fs/file/create::browser-target-path
  - id: micro-behaviors/fs/file/create::shortcut-target-path
  any:
  - id: micro-behaviors/fs/file/create::shortcut-arguments
  - id: micro-behaviors/fs/file/create::create-shortcut
