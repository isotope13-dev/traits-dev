defaults:
  platforms: [windows]
  for: [vbs, html]

composite_rules:
  - id: hta-obfuscated-shortcut-create-context
    for: [html]
    desc: HTA creates obfuscated Windows shortcut
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/data/decode/custom::hta-hex-xor-string-decoder
      - id: micro-behaviors/os/com/automation::script-computed-activex-object
      - id: micro-behaviors/fs/file/create::html-create-shortcut-call
      - id: micro-behaviors/fs/file/create::html-shortcut-target-path
      - id: micro-behaviors/fs/file/create::shortcut-save
