# NSFileManager's file-creation selector belongs with file creation.
defaults:
  platforms: [macos, ios]
  for: [macho, dylib]
  mbc: C0052
traits:
  - id: nsfilemanager-create
    desc: NSFileManager file creation
    crit: baseline
    conf: 0.6
    if:
      type: symbol
      regex: createFileAtPath
