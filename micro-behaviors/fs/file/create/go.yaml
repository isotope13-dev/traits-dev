defaults:
  platforms: [windows, unix]
  for: [go]
traits:
  - id: os-create
    desc: Create file via os.Create
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      exact: os.Create
  - id: go-create-startup-shortcut
    desc: Go creates file through named Startup path
    crit: notable
    conf: 0.95
    platforms: [windows]
    attack: T1547.001
    if:
      type: symbol
      kind: call
      exact: os.Create
      arg:
        kind: identifier
        name: startupShortcut
