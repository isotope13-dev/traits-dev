defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  size_max: 65536

traits:
  - id: dos-int21-create-new
    desc: DOS create-new file via INT 21h
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 5B [0-16] CD 21"
  - id: dos-int21-create-new-ax
    desc: DOS create-new file via MOV AX
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B8 ?? 5B [0-16] CD 21"

  # DTA filename: scan its dot, copy three extension bytes, create-new,
  # restore saved buffer pointer, transfer the handle, write that buffer.
  # Fourth arm: the no-pop discipline (Dikshev.Comp.45) stages DX through DI,
  # keeps the length in DL across create and swaps it into CX with XCHG
  # instead of popping a saved pointer and moving an immediate count.
  # Fifth arm (Dikshev.Comp.38): REPNE SCASB finds the dot, a 32-bit store
  # writes "COM\0", and a CALL to the next instruction makes the create
  # INT 21h return into the write, ending in RET.
  # Sixth arm (Dikshev.Comp.41): DI=009Eh is the SCASB cursor, a DWORD store
  # replaces the extension, create-new returns the handle, and a short JMP
  # loops back to the interrupt for the write. Seventh arm (Companion.40)
  # has no JMP loop: create-new is followed by XCHG, AH=40h and a write from
  # 0100h. Eighth arm (Dikshev.Comp.47) scans the DTA name with LODSB / CMP
  # AL,2Eh / JNZ, stores the extension through SI, and loops by short JMP.
  # Ninth arm (Trivial.49.b) pads the same flow with JMP $+2 and NOP filler.
  # Tenth arm (Dikshev.Comp.49.b) is the LODSB scan with NOP padding before a
  # JMP back instead of the register exchange.
  # Eleventh arm (Trivial.34.e) scans with REPNE SCASB, then reaches the
  # extension store through a stack word (FF /5 operand then POP [DI]).
  # Twelfth arm (Dikshev.Comp.40) is the SCASB scan with DX taken from DI,
  # a DWORD store, create-new and a single write that ends in RET.
  # Thirteenth arm (Dikshev.Comp.41.b) keeps the DI scan, skips on a failed
  # create (JC +7), loads CL before AH=40h and loops with a short JMP.
  # Fourteenth arm (Dikshev.Comp.43.b) loads CL after AH=40h and jumps back
  # without a trailing RET.
  # Fifteenth arm (Small.41) loads DX=009Eh before the dot scan, creates
  # without a failure branch, and ends with RET after CL is loaded.
  # Sixteenth arm (Dikshev.Comp.40.b) pushes DI=009Eh, scans for the dot with
  # REPNE SCASB, takes the buffer from SI and the count from CX=SI.
  # Seventeenth arm (Dikshev.Comp.46.b) walks the DTA name from SI with LODSB
  # to the dot, stores the extension through SI, creates (AH=5Bh) with the
  # byte count saved on the stack, and loops back after the write.
  # Eighteenth arm (Dikshev.Comp.44.b) scans for the dot with REPNE SCASB and
  # copies the extension with a DWORD MOVSD before creating with AH=5Bh.
  # Nineteenth arm (Dikshev.Comp.48) stores the extension as a word and a byte
  # (MOV WORD [SI] / MOV BYTE [SI+2]) and sets the count through DL / XCHG.
  - id: dos-dta-extension-create-buffer-write
    desc: DOS patches extension, creates, writes buffer
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: "(BA 9E 00 B8 2E 5B AE 75 ?? A5 A4 CD 21 5A 72 ?? 93 B1 ?? B4 40 CD 21|BA 9E 00 B8 2E 5B AE 75 ?? A5 A4 CD 21 5A 72 ?? 93 B9 ?? ?? B4 40 CD 21|B0 2E F2 AE A5 A4 B4 5B CD 21 72 ?? 93 B4 40 EB ??|BF 9E 00 8B D7 B8 2E 5B AE 75 ?? A5 A4 CD 21 72 ?? 93 B2 ?? 87 D1 B4 40 CD 21|BA 9E 00 B8 2E 5B F2 AE 66 C7 05 43 4F 4D 00 [0-4] E8 00 00 CD 21 93 B4 40 [0-4] C3|8B D7 B8 2E 5B AE 75 FD 66 C7 05 ?? ?? ?? ?? CD 21 72 ?? 93 B4 40 [0-4] EB ??|BA 9E 00 B8 2E 5B AE 75 FD 66 C7 05 ?? ?? ?? ?? CD 21 93 B4 40 [0-4] BA 00 01 CD 21|8B D6 AC 3C 2E 75 FB 66 C7 04 ?? ?? ?? ?? B4 5B CD 21 72 ?? 93 B4 40 [0-4] 87 D1 EB ??|BA 9E 00 B8 2E 5B EB 00 AE 75 FB 66 C7 05 ?? ?? ?? ?? CD 21 90 93 B4 40 B1 ?? EB 00 C3|8B D6 AC 3C 2E 75 FB 66 C7 04 ?? ?? ?? ?? B4 5B CD 21 72 ?? 93 B4 40 B1 ?? 90 90 EB ??|BA 9E 00 B8 2E 5B F2 AE FF AF ?? ?? 8F 05 8B CE CD 21 93 B4 40 73 ?? C3|8B D7 B8 2E 5B AE 75 FD 66 C7 05 ?? ?? ?? ?? CD 21 93 B4 40 B1 ?? C3|8B D7 B8 2E 5B AE 75 FD 66 C7 05 ?? ?? ?? ?? CD 21 72 07 93 B1 ?? B4 40 EB ?? C3|8B D7 B8 2E 5B AE 75 FD 66 C7 05 ?? ?? ?? ?? CD 21 72 ?? 93 B4 40 B1 ?? EB ??|BA 9E 00 B8 2E 5B AE 75 FD 66 C7 05 ?? ?? ?? ?? CD 21 93 B4 40 B1 ?? C3|BF 9E 00 57 B8 2E 5B F2 AE 66 C7 05 ?? ?? ?? ?? 5A 8B CE E8 00 00 CD 21 93 B4 40 8B D6 C3|8B D6 AC 3C 2E 75 FB 50 66 C7 04 ?? ?? ?? ?? B4 5B CD 21 59 72 ?? 93 B4 40 EB ??|B0 2E F2 AE 66 A5 B4 5B CD 21 72 ?? 93 B4 40 EB ??|8B D6 AC 3C 2E 75 FB C7 04 ?? ?? C6 44 02 ?? B4 5B CD 21 72 ?? 93 B4 40 B2 ?? 87 D1 EB ??)"

  # Companion form: scan the copied filename for its dot, overwrite the
  # extension with a literal "COM", probe it with a read-only open and,
  # only when that open fails, create it. The created handle then
  # receives the body through a near-call writer, so the write is not
  # bound here. Status flag stores between the services are skipped.
  - id: dos-dot-scan-com-extension-probe-create
    desc: DOS creates absent COM-extension twin
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "B0 2E F2 AE C7 05 43 4F C6 45 02 4D [0-12] B8 00 3D CD 21 73 ?? [0-8] B4 3C B9 ?? 00 CD 21"

  # REPNE SCASB finds the dot, a DWORD store writes "com" or "COM", and
  # create-new (AX=5B2Eh) is followed by a write that jumps to a shared INT 21h.
  - id: dos-repne-scasb-com-create
    desc: DOS scans dot then creates COM
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "B8 2E 5B 8B D7 F2 AE 66 C7 05 (63 6F 6D|43 4F 4D) 00 [0-6] CD 21 [0-8] B4 40 EB"
