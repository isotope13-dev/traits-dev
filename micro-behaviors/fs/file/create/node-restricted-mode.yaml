defaults:
  platforms: [unix]
  for: [javascript, typescript]

traits:
  - id: node-create-restricted-mode
    desc: Node create call specifies mode 0600/0700
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: [(identifier) @method
            (member_expression property: (property_identifier) @method)]
          arguments: (arguments (object
            (pair key: (property_identifier) @key value: (number) @mode))))
          (#match? @method "^(mkdir|writeFile)Sync$")
          (#eq? @key "mode")
          (#match? @mode "^0o(600|700)$"))
