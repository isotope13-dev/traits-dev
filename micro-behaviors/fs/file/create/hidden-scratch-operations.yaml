defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
  - python
  - javascript
  - elf
traits:
- id: hidden-scratch-touch-mktemp-text-1
  desc: Touch/mktemp text names hidden /tmp or /dev/shm
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (touch[^\n]{0,120}|mktemp\s+)(/dev/shm/|/tmp/)\.[a-zA-Z0-9][\w.-]{2,120}\b
- id: hidden-scratch-touch-mktemp-text-2
  desc: Touch/mktemp text names hidden /var/tmp or /dev
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (touch|mktemp)[^\n]{0,120}(/var/tmp/|/dev/)\.[a-zA-Z0-9][\w.-]{2,120}\b
- id: hidden-scratch-touch-mktemp-text-3
  desc: Touch/mktemp text names hidden /run or /mnt
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (touch|mktemp)[^\n]{0,120}(/run/|/mnt/)\.[a-zA-Z0-9][\w.-]{2,120}\b
