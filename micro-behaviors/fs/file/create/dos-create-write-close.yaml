# Create with cleared attributes (AH=3Ch, CX=0), exchange the handle, load
# the byte count and buffer, write (AH=40h) and close (AH=3Eh): a program
# dropping a file image of itself. Written as YARA so the sequence is
# evaluated on images under the engine's size floor.
traits:
  - id: dos-create-write-close-image
    desc: DOS creates file, writes buffer, closes it
    crit: notable
    conf: 0.88
    platforms: [windows, unix]
    for: [dos_com, data]
    size_max: 4096
    if:
      type: yara
      source: |
        rule dos_create_write_close_image {
          meta:
            filetypes = "dos_com,data"
          strings:
            $seq = { B4 3C 33 C9 CD 21 93 [0-4] B4 40 B9 ?? ?? BA ?? ?? CD 21 B4 3E CD 21 }
          condition:
            $seq in (0..512)
        }
