defaults:
  platforms: [unix]
  for: [c, cpp]
traits:
  - id: lseek-code-cave-offset
    desc: lseek uses a code-cave offset variable
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: lseek
      arg:
        index: 1
        kind: identifier
        name: cave_addr
  - id: lseek-got-offset
    desc: lseek uses a GOT offset variable
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: lseek
      arg:
        index: 1
        kind: identifier
        name: got_addr
