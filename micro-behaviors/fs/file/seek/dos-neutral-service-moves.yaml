defaults:
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
- for:
  - dos_com
  - static-lib
  id: dos-seek-int-stub
  desc: DOS seek-service interrupt helper ending in RET
  crit: notable
  conf: 0.9
  if:
    type: hex
    # The interrupt number can be an alias; this helper alone is not infection.
    pattern: "B4 42 CD ?? C3"
- for:
  - dos_com
  - static-lib
  id: dos-seek-ah-cwd
  desc: DOS seek-service load and sign-extension bytes
  crit: notable
  conf: 0.88
  if:
    type: hex
    pattern: B4 42 99 [0-4] CD
- for:
  - dos_com
  - static-lib
  - data
  id: dos-seek-end-e8
  desc: DOS EOF-seek service setup before near-call
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: B8 02 42 [0-8] E8
- for:
  - dos_com
  - static-lib
  - data
  id: dos-seek-end-inc-ax
  desc: Incremented AX EOF-seek service setup bytes
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: B8 FF 41 40 40 40
- for:
  - dos_com
  - static-lib
  id: dos-seek-end-int
  desc: DOS EOF-seek setup or interrupt bytes
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: (B8 02 42 99|B8 02 42 [0-6] CD)
- for:
  - dos_com
  - static-lib
  id: dos-seek-or-ah
  desc: DOS seek-service OR setup and interrupt
  crit: notable
  conf: 0.88
  if:
    type: hex
    pattern: 80 CC 42 [0-8] CD
- for:
  - dos_com
  - static-lib
  id: dos-seek-start-int
  desc: DOS seeks to start of file
  crit: notable
  conf: 0.88
  if:
    type: hex
    pattern: B8 00 42 [0-6] CD
- for:
  - dos_com
  - static-lib
  id: dos-int21-seek
  desc: DOS seeks within a file
  crit: notable
  conf: 0.86
  if:
    type: hex
    pattern: B4 42 [0-8] CD 21
- for:
  - dos_com
  - static-lib
  id: dos-int21-seek-ax
  desc: DOS seek via MOV AX
  crit: notable
  conf: 0.86
  if:
    type: hex
    pattern: B8 ?? 42 [0-12] CD 21
- for:
  - dos_com
  - static-lib
  - data
  id: dos-int21-seek-eof-saved-vector
  desc: DOS seek-to-EOF via a saved handler
  crit: notable
  conf: 0.92
  if:
    type: hex
    pattern: B8 02 42 [0-16] 9C [0-1] FF 1E ?? ??
- for:
  - dos_com
  - static-lib
  - data
  id: dos-seek-end-far
  desc: DOS seeks to end through a vector
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: B8 02 42 [0-8] 9C 2E FF 1E
- for:
  - dos_com
  - static-lib
  id: dos-seek-via-farcall
  desc: DOS seeks through a saved vector
  crit: notable
  conf: 0.88
  if:
    type: hex
    pattern: B4 42 [0-6] 9C [0-1] 2E FF 1E
composite_rules:
- for:
  - dos_com
  - static-lib
  id: dos-seek-end-dispatch
  desc: DOS file-seek setup or invocation sequence
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/fs/file/seek::dos-seek-end-int
  - id: micro-behaviors/fs/file/seek::dos-seek-or-ah
  - id: micro-behaviors/fs/file/seek::dos-seek-end-far
  - id: micro-behaviors/fs/file/seek::dos-seek-start-int
  - id: micro-behaviors/fs/file/seek::dos-seek-end-e8
  - id: micro-behaviors/fs/file/seek::dos-seek-ah-cwd
  - id: micro-behaviors/fs/file/seek::dos-int21-seek
  - id: micro-behaviors/fs/file/seek::dos-seek-end-inc-ax
  - id: micro-behaviors/fs/file/seek::dos-seek-via-farcall
- for:
  - dos_com
  - static-lib
  id: dos-int21-seek-call
  desc: DOS seek syscall
  crit: notable
  conf: 0.86
  any:
  - id: micro-behaviors/fs/file/seek::dos-int21-seek
  - id: micro-behaviors/fs/file/seek::dos-int21-seek-ax
  - id: micro-behaviors/fs/file/seek::dos-int21-seek-eof-saved-vector
