defaults:
  platforms:
  - windows
  for:
  - lnk
traits:
- id: lnk-stream-seek
  desc: LNK command seeks within an input stream
  crit: notable
  conf: 0.95
  if:
    type: value
    path: lnk.arguments
    regex: (?i)\.Seek\(\s*(0x[0-9a-f]+|\d+(KB|MB)?)\s*,\s*(['"]|\[[\w.]{0,10}SeekOrigin\]::)Begin

# Locates its own .lnk on disk by its exact byte length, so the command can
# re-open the shortcut and carve data appended after the link structure.
- id: lnk-find-self-by-exact-length
  desc: LNK finds a file by exact length
  crit: notable
  conf: 0.93
  if:
    type: value
    path: lnk.arguments
    regex: (?i)where(-object)?\s*\{\s*\$_\.length\s*-eq\s*(0x[0-9a-f]+|\d{3,})\s*\}

- id: lnk-xor-byte-loop
  desc: LNK XORs bytes with a constant
  crit: notable
  conf: 0.9
  if:
    type: value
    path: lnk.arguments
    regex: (?i)\$\w+\[\$\w+\]\s*=\s*\$\w+\s*-bxor\s*(0x[0-9a-f]{1,2}|\d{1,3})\b

- id: lnk-schtasks-create-from-xml
  desc: LNK registers a scheduled task from XML
  crit: notable
  conf: 0.92
  if:
    type: value
    path: lnk.arguments
    regex: (?i)/create\s+/tn\s+\S+[^;]{0,120}/xml\s+\S+

- id: lnk-decoy-named-after-self
  desc: LNK writes a decoy named after itself
  crit: notable
  conf: 0.92
  if:
    type: value
    path: lnk.arguments
    regex: (?i)\.replace\(\s*['"]\.lnk['"]\s*,\s*['"]\.(xlsx?|docx?|pdf|hwpx?|pptx?|rtf|txt)['"]\s*\)
