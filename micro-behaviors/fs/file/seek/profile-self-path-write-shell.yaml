defaults:
  platforms: [windows]
  for: [c, cpp, html, text]
composite_rules:
  - id: c-source-self-path-seek-open-shell
    desc: Self path, seek, write-open and ShellExecute clues
    crit: suspicious
    conf: 0.93
    near_lines: 90
    all:
      - id: micro-behaviors/fs/path/self::source-self-module-path-read
      - id: micro-behaviors/fs/file/seek::source-setfilepointer-from-begin
      - id: micro-behaviors/fs/file/open/write::source-createfile-write-access
      - id: micro-behaviors/os/handler/open::source-shellexecute-open-call
