defaults:
  platforms: [unix, android, ios]
  crit: notable
  for: [scripts, source, binaries]

traits:
  # Relocated unchanged mechanics; timestamp copying alone is neutral.
  - id: touch-reference-multiple
    desc: Multiple timestamp copy operations
    crit: notable
    conf: 0.95
    for: [shell]
    # Conda recipe build scripts legitimately restore timestamps after
    # replacing compiler-generated files.  UCSC genome automation pipelines
    # propagate source mtimes onto derived artifacts the same way.
    unless:
      - id: metadata/build/conda::conda-recipe-build-script
      # Test fixtures legitimately copy timestamps to verify that a tool
      # preserves mtimes or performs idempotent writes.
      - id: metadata/package/testing/presence/harness::test-directory
      - type: path
        regex: 'kent[/\\]src[/\\]hg[/\\]utils[/\\]automation'
      - id: metadata/build/package/recipe/gentoo::gentoo-ebuild-recipe
      # RPM spec %install sections restore source mtimes for reproducible builds.
      - id: metadata/build/package/maintainer-scripts::rpm-spec-recipe-context
    not:
      - substr: "touch -r $(SRCDIR)"
      # Generated-file installers commonly copy mtimes from build variables or
      # .last snapshots.  Those are build reproducibility operations rather
      # than timestomping an unrelated file.
      - regex: '(?i)touch\s+-r\s+["'']?\$[A-Za-z_][A-Za-z0-9_]*(?:[/\\][^[:space:]"'']+)?["'']?'
      - regex: '(?i)touch\s+-r\s+["'']?[^[:space:]"'']+\.last["'']?'
    if:
      type: text
      # Require an executable shell position: a newline or a command
      # separator immediately before `touch`. Anchoring on the line start
      # alone missed the trojaned sendmail configure test, which chained
      # `cp out <file>;touch -r /etc/motd <file>` on one line. A `#` comment
      # still cannot reach this prefix, so the documentation exclusion the
      # original anchor existed for still holds.
      regex: '[\n;&|][ \t]*touch\s+-r\s+\S+'
    count_min: 2

  - id: touch-runit-launcher-reference
    desc: Timestamp copy command targets runit launcher
    conf: 0.95
    if:
      type: text
      regex: '(^|[\n"''`])\s*touch +(-r +|--reference[= ]+)\S+ +\S*/etc/s(v|ervice)/[\w.@-]+/run\b'
