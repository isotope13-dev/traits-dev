# Get and save the DOS date/time, then reuse both stored words while setting
# the low five time bits to 1Fh (the nonstandard 62-second infection marker).
# Require one decoder key/range and the same DOS interrupt alias at both calls.
defaults:
  for: [dos_com]
  platforms: [windows, unix]
  size_max: 65536
traits:
  - id: dos-xor-saved-time-seconds-marker
    desc: Reapplies DOS timestamp with seconds marker
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_xor_saved_time_marker {
          strings:
            $dec = { E8 00 00 (32|30) E4 8B FC CD 1A 36 8B 2D 83 ED ?? 83 C4 02 1E 06 0E 0E 1F 07 8D B6 ?? ?? B9 ?? ?? 80 34 ?? 46 E2 FA }
            $get = "\xb8\x00\x57\xcd" xor(1-255)
            $set = "\xb8\x01\x57\x8b\x16" xor(1-255)
          condition:
            for any d in (1..#dec) : (
              @get >= (@dec[d]+3-uint8(@dec[d]+14))+uint16(@dec[d]+26) and
              @get+16 <= (@dec[d]+3-uint8(@dec[d]+14))+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@get) ^ 184) == uint8(@dec[d]+33) and
              @set >= (@dec[d]+3-uint8(@dec[d]+14))+uint16(@dec[d]+26) and
              @set+16 <= (@dec[d]+3-uint8(@dec[d]+14))+uint16(@dec[d]+26)+uint16(@dec[d]+29) and
              (uint8(@set) ^ 184) == uint8(@dec[d]+33) and
              (uint8(@get+5) ^ uint8(@dec[d]+33)) == 137 and
              (uint8(@get+6) ^ uint8(@dec[d]+33)) == 14 and
              (uint8(@get+9) ^ uint8(@dec[d]+33)) == 137 and
              (uint8(@get+10) ^ uint8(@dec[d]+33)) == 22 and
              @set > @get and
              uint16(@set+5) == uint16(@get+11) and
              uint16(@set+9) == uint16(@get+7) and
              (uint16(@set+7) ^ (uint8(@dec[d]+33)*257)) == 0x0e8b and
              (uint32(@set+11) ^ (uint8(@dec[d]+33)*16843009)) == 0xcd1fc983 and
              uint8(@set+15) == uint8(@get+4)
            )
        }
