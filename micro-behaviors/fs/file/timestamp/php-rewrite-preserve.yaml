defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  crit: notable
traits:
- id: php-inplace-rewrite-mtime-restore
  desc: Rewrites file and restores captured mtime
  conf: 0.98
  if:
    type: tree-sitter
    query: |
      (
        (_
          (expression_statement
            (assignment_expression left:
              (variable_name) @mtime right: [
              (function_call_expression function:
                (name) @stat arguments:
                (arguments
                  (argument
                    (variable_name) @statpath)))
              (error_suppression_expression
                (function_call_expression function:
                  (name) @stat arguments:
                  (arguments
                    (argument
                      (variable_name) @statpath)))) ])) .
          (expression_statement [
            (function_call_expression function:
              (name) @write arguments:
              (arguments
                (argument
                  (variable_name) @writepath) .
                (argument)))
            (error_suppression_expression
              (function_call_expression function:
                (name) @write arguments:
                (arguments
                  (argument
                    (variable_name) @writepath) .
                  (argument)))) ]) .
          (expression_statement [
            (function_call_expression function:
              (name) @touch arguments:
              (arguments
                (argument
                  (variable_name) @touchpath) .
                (argument
                  (variable_name) @savedtime)))
            (error_suppression_expression
              (function_call_expression function:
                (name) @touch arguments:
                (arguments
                  (argument
                    (variable_name) @touchpath) .
                  (argument
                    (variable_name) @savedtime)))) ]))
        (#eq? @stat "filemtime")
        (#eq? @write "file_put_contents")
        (#eq? @touch "touch")
        (#eq? @statpath @writepath)
        (#eq? @statpath @touchpath)
        (#eq? @mtime @savedtime)
        (#not-eq? @mtime @statpath)) @restore
      (
