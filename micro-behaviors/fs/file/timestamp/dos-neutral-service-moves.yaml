defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib, data]
  size_max: 65536

traits:
- id: dos-int21-set-file-time
  desc: DOS sets a file timestamp
  crit: notable
  conf: 0.9
  if:
    type: hex
    # Literal 5701h loads, plus the size-optimized get-then-set-back
    # spelling: AX=5700h reads the file's date/time, INC AL turns the
    # service into 5701h, and the second INT 21h writes it back with
    # CX/DX untouched. Resident infectors restore the host timestamp
    # this way after appending their body.
    pattern: (B8 01 57 [0-16] CD 21|B4 57 B0 01 [0-16] CD 21|B8 00 57 CD 21 FE C0 CD 21)
- id: dos-int21-set-file-time-near-call
  desc: DOS sets file timestamp via call helper
  crit: notable
  conf: 0.9
  if:
    type: hex
    # Same AX=5701h service issued through a near-call helper instead of
    # INT 21h directly: resident infectors that dispatch every DOS call
    # through a saved-vector stub still restore the host timestamp.
    pattern: B8 01 57 [0-8] E8 ?? ??
