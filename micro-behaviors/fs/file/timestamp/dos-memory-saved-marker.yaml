defaults:
  for: [dos_com, static-lib, data]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-memory-saved-time-seconds-marker
    desc: DOS reapplies saved time with seconds marker
    crit: notable
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_memory_saved_time_seconds_marker {
          meta:
            filetypes = "dos_com,static-lib,data"
          strings:
            $get = { B8 00 57 CD ?? 72 ?? 2E 89 0E ?? ?? 2E 89 16 ?? ?? }
            $set = { B8 01 57 2E 8B 0E ?? ?? 2E 8B 16 ?? ?? 80 E1 E0 FE C1 CD ?? B4 3E CD ?? }
          condition:
            for any g in (1..#get) : (
              for any s in (1..#set) : (
                @set[s] > @get[g] and @set[s]-@get[g] < 1024 and
                uint16(@get[g]+10) == uint16(@set[s]+6) and
                uint16(@get[g]+15) == uint16(@set[s]+11) and
                uint8(@get[g]+4) == uint8(@set[s]+19) and
                uint8(@get[g]+4) == uint8(@set[s]+23)
              )
            )
        }
