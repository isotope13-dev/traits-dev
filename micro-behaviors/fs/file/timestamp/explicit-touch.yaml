defaults:
  platforms: [unix, android, ios]
  for: [shell]

traits:
  - id: touch-explicit-timestamp
    desc: Sets an explicit file timestamp with touch
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(^|[\n;&|])[ \t]*touch\s+(-[am]{1,2}\s+){0,2}-t\s+\d+'
    not:
      - regex: '(^|[\n;&|])[ \t]*touch\s+(-[am]{1,2}\s+){0,2}-t\s+1970\d+'

  - id: touch-variable-timestamp
    desc: Sets file timestamp from variable with touch
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(^|[\n;&|])[ \t]*touch\s+(-[am]{1,2}\s+){0,2}-[tdr]\s+["\x27]?\$[A-Za-z_{]'

  - id: shell-file-mtime-capture
    desc: Captures file mtime with date or stat
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '\b(date\s+-r|stat\s+-[cf]\s+["\x27]?%[yYmZ])\s+["\x27]?(\$|\S*/)'
