defaults:
  platforms: [unix, android, ios]
  for: [shell]

traits:
  - id: touch-explicit-timestamp
    desc: Sets an explicit file timestamp with touch
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(^|\n)[ \t]*touch\s+-t\s+\d+'
    not:
      - regex: '(^|\n)[ \t]*touch\s+-t\s+1970\d+'
