# Windows File Timestamp APIs
# Atomic traits for file time query/modification
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.8
traits:
  - id: get-file-time-import
    desc: Imports GetFileTime timestamp query API
    crit: notable
    conf: 0.99
    if:
      type: import
      exact: GetFileTime
  - id: get-file-attributes-ex
    desc: Query file attributes and timestamps
    if:
      type: symbol
      regex: "^GetFileAttributesEx[AW]$"
  # Moved here from fs/sync/fsync/, which named itself for flushing data to
  # disk but contained only timestamp and size traits. SetFileTime is the
  # timestomping primitive (T1070.006); the indicator-removal objectives
  # reference it from this directory.
  - id: compare-file-time
    desc: Compare file modification times
    crit: baseline
    conf: 0.7
    if:
      type: symbol
      exact: CompareFileTime
  - id: set-file-time
    desc: Modify file creation/access/write times
    crit: notable
    conf: 0.85
    attack: T1070.006
    if:
      type: text
      exact: SetFileTime
    unless:
      # Go's Windows runtime ships this API name even when the application
      # performs no file-time modification.
      - id: metadata/lang/compiler/systems::go-binary-comp
  # Import names and GetProcAddress strings live in read-only data. The same
  # bytes inside a resource are the embedded payload's, not the stub's call.
  - id: set-file-time-rdata
    desc: SetFileTime name in read-only data
    crit: notable
    conf: 0.85
    attack: T1070.006
    if:
      type: text
      exact: SetFileTime
      section: rdata
    unless:
      # Go's Windows runtime ships this API name even when the application
      # performs no file-time modification.
      - id: metadata/lang/compiler/systems::go-binary-comp
  # The binary implements SetFileTime rather than calling it: kernel32 /
  # kernelbase and their Wine/ReactOS re-implementations. Callers that
  # timestomp import the name; they do not export it.
  - id: export-set-file-time
    desc: Exports the SetFileTime API
    crit: baseline
    conf: 0.9
    if:
      type: export
      exact: SetFileTime
  - id: set-file-time-source
    desc: Modify file times in source
    crit: notable
    conf: 0.85
    attack: T1070.006
    for:
      - c
    if:
      type: string_literal
      substr: SetFileTime
  - id: shell-application-modify-date
    desc: Script assigns the Shell ModifyDate property
    crit: notable
    conf: 0.9
    attack: T1070.006
    for: [vbs, html, javascript]
    if:
      type: text
      regex: '(?i)\.Modifydate\s*=\s*[^=]'
