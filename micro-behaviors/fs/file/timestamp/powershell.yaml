defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable

traits:
  - id: powershell-lastwrite-lower-bound
    desc: PowerShell filters newer file timestamps
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bLastWriteTime(Utc)?\s+-ge\s+\$\w+\b'

  - id: powershell-dotnet-set-file-time
    desc: PowerShell sets file timestamps via .NET IO.File
    conf: 0.92
    attack: T1070.006
    if:
      type: text
      regex: '\[IO\.File\]::Set(Creation|LastAccess|LastWrite)Time'
    unless:
      - id: well-known/app/system/moonshiner::seed-fixture-tree
