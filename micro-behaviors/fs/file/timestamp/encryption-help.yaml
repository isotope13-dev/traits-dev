# Help bytes share a merged run with an encoded note; text extraction skips it.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: encryption-restores-write-date-help
  desc: Encryption help restores original write date
  crit: notable
  conf: 0.97
  if:
    type: hex
    section: .rdata
    pattern: 45 6E 63 72 79 70 74 20 66 69 6C 65 73 20 61 6E 64 20 72 65 73 74 6F
      72 65 20 6F 72 69 67 69 6E 61 6C 20 6C 61 73 74 20 77 72 69 74 65 20 64 61 74
      65
