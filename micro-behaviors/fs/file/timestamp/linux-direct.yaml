# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: timestamp-direct-syscall
    desc: Changes timestamps via Linux syscall
    crit: baseline
    if:
      type: syscall
      name: [utime, utimes, futimesat, utimensat]
      arch: [x86_64, aarch64]
