defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
- id: dos-saved-time-seconds-marker
  desc: DOS saved timestamp gets fixed seconds bits
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule dos_saved_time_seconds_marker {\n strings:\n  $get = { B8 00 57 CD 21 52 51 80 E1 1F 80 F1 ??\
      \ (74|75) ?? }\n  $set = { B8 01 57 59 5A 80 C9 ?? 80 E1 ?? CD 21 B4 3E CD 21 }\n condition:\n  #get > 0 and\
      \ #get <= 32 and #set > 0 and #set <= 32 and\n  for any a in (1..#get) : (\n   uint8(@get[a]+12) <= 29 and\n\
      \   for any b in (1..#set) : (\n    (uint8(@set[b]+7) & 224) == 0 and (uint8(@set[b]+10) & 224) == 224 and\n\
      \    @set[b] > @get[a]+!get[a] and @set[b]-@get[a] < 4096 and\n    (uint8(@set[b]+7) & uint8(@set[b]+10) &\
      \ 31) == uint8(@get[a]+12) and\n    (uint8(@set[b]+7) | (uint8(@set[b]+10) ^ 255)) & 31 == 31\n   )\n  )\n\
      }"
