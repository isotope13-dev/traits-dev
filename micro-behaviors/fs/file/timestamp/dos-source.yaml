defaults:
  platforms: [windows, unix]
  for: [c, text]

traits:
  - id: dos-asm-get-file-time
    desc: DOS source selects file timestamp query
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '(?i)mov\s+ax,0?5700h'

  - id: dos-asm-set-file-time
    desc: DOS source selects file timestamp update
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)mov\s+ax,0?5701h'

