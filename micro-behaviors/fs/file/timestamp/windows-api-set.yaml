composite_rules:
# Moved from objectives/evasion/indicator-removal/timestamps (as
# timestomp-with-file-copy). These are imports that co-occur in the CLR's
# mscorwks.dll and Tcl's tcl86t.dll: nothing here copies another file's time,
# so the capability is notable and the malware composites supply intent.
- id: set-file-time-with-walk-and-self-path
  desc: SetFileTime with directory walk and own path
  for: [pe, dll]
  platforms: [windows]
  crit: notable
  conf: 0.85
  all:
    - id: micro-behaviors/fs/file/timestamp::set-file-time
    - id: micro-behaviors/fs/directory/readdir::find-file-walker-any-variant
    - id: micro-behaviors/process/info/current::get-module-filename
  any:
    - id: micro-behaviors/fs/write/file/handle::write-file
    - id: micro-behaviors/fs/file/open::file-create-win
  unless:
    # Stock 7-Zip SFX restores archived timestamps after extraction.
    - id: well-known/tool/sysadmin/7zip::sevenzip-archive-timestamp-preservation
    - id: well-known/app/productivity/ruexcel::ruexcel-inno-uninstaller
    - id: well-known/tool/reverse-engineering/frida/
    - id: well-known/app/communication/telegram::telegram-desktop-signed-client-context
    - id: well-known/app/system/miktex::miktex-setup-wizard
