defaults:
  crit: notable
  platforms: [unix, windows]
  for: [php]

traits:
  - id: php-dispatched-touch-explicit-time
    desc: PHP dispatches touch with an explicit timestamp
    conf: 0.97
    if:
      type: tree-sitter
      kind: call
      regex: '::\w+\s*\(\s*["'']touch["'']\s*,\s*\$\w+\s*,\s*\$\w+'

  - id: php-touch-function-name-table-entry
    desc: PHP stores Base64 touch function name
    conf: 0.97
    if:
      type: text
      regex: '["'']touch["'']\s*=>\s*["'']dG91Y2g='

  - id: php-stored-mtime-helper-argument
    desc: PHP passes stored mtime to a helper
    conf: 0.96
    if:
      type: tree-sitter
      node: scoped_call_expression
      regex: '::\w+\s*\(\s*\$\w+\s*,\s*\$\w+\s*\[\s*["'']mtime["'']\s*\]'

composite_rules:
  # This is a capability profile, not proof of concealment or of the helper's
  # data flow. Archive/copy tools legitimately preserve timestamps.
  - id: php-touch-function-table-dispatch
    desc: PHP Base64 touch name and callback dispatch cooccur
    conf: 0.97
    all:
      - id: php-touch-function-name-table-entry
      - id: micro-behaviors/process/interpreter/reflection/dispatch::php-callback-array-dispatch

  - id: php-dispatched-mtime-copy-profile
    desc: PHP stored-mtime helper and explicit touch dispatch
    conf: 0.96
    all:
      - id: php-stored-mtime-helper-argument
    any:
      - id: php-dispatched-touch-explicit-time
      - id: php-touch-function-table-dispatch
    needs: 1
