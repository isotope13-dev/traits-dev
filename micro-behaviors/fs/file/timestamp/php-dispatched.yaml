defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - php
traits:
- id: php-touch-helper-explicit-time-arguments
  desc: PHP helper takes touch and timestamp arguments
  conf: 0.97
  if:
    type: tree-sitter
    kind: call
    regex: ::\w+\s*\(\s*["']touch["']\s*,\s*\$\w+\s*,\s*\$\w+
- id: php-stored-mtime-helper-argument
  desc: PHP helper receives an mtime field
  conf: 0.96
  if:
    type: tree-sitter
    node: scoped_call_expression
    regex: ::\w+\s*\(\s*\$\w+\s*,\s*\$\w+\s*\[\s*["']mtime["']\s*\]
composite_rules:
- id: php-touch-function-table-dispatch
  desc: PHP Base64 touch name and callback dispatch cooccur
  conf: 0.97
  all:
  - id: metadata/file/encoding/shape::php-base64-touch-table-entry
  - id: micro-behaviors/metaprogramming/reflection/invoke::php-callback-array-dispatch
- id: php-mtime-helper-touch-context
  desc: PHP mtime helper and touch arguments cooccur
  conf: 0.96
  all:
  - id: php-stored-mtime-helper-argument
  any:
  - id: php-touch-helper-explicit-time-arguments
  - id: php-touch-function-table-dispatch
  needs: 1
