defaults:
  platforms:
  - windows
  for:
  - python
traits:
- id: python-getfiletime-call
  desc: Python queries Windows file timestamps
  crit: notable
  conf: 0.97
  if:
    type: symbol
    kind: call
    regex: (^|\.)GetFileTime$
- id: python-setfiletime-call
  desc: Python modifies Windows file timestamps
  crit: notable
  conf: 0.97
  if:
    type: symbol
    kind: call
    regex: (^|\.)SetFileTime$
