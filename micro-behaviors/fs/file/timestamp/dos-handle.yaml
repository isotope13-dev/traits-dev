defaults:
  for: [batch, dos_com, data]
  platforms: [windows]
  size_max: 65536
traits:
  - id: dos-handle-time-read-writeback-close
    desc: DOS handle time writeback before close
    crit: notable
    conf: 0.98
    # CX/DX and BX remain untouched between GET and SET for the same handle.
    if:
      type: hex
      pattern: 'B8 00 57 CD 21 B8 01 57 CD 21 B4 3E CD 21'
