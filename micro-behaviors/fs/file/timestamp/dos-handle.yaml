defaults:
  for: [batch, dos_com, data]
  platforms: [windows]
  size_max: 65536
traits:
  - id: dos-handle-time-read-writeback-close
    desc: DOS handle time writeback before close
    crit: notable
    conf: 0.98
    # CX/DX and BX remain untouched between GET and SET for the same handle.
    if:
      type: hex
      pattern: 'B8 00 57 CD 21 B8 01 57 CD 21 B4 3E CD 21'
  # DTA offsets +16h (time) and +18h (date) loaded into CX/DX and applied with
  # INT 21h AX=5701h.
  - id: dos-dta-time-restore
    platforms: [windows, unix]
    for: [dos_com, static-lib, data]
    desc: DOS restores file timestamp from DTA fields
    crit: notable
    conf: 0.96
    if:
      type: hex
      pattern: "B8 01 57 [0-4] (8B 4F 16 8B 57 18|8B 57 18 8B 4F 16|8B 4C 16 8B 54 18) [0-4] CD 21"
