defaults:
  crit: notable
  platforms: [windows, unix]
  for: [php]

traits:
  - id: php-touch-call
    desc: PHP touch() sets file timestamps
    conf: 0.9
    attack: T1070.006
    if:
      type: symbol
      kind: call
      exact: touch
  # `touch($f)` creates a file or bumps mtime to now -- ordinary behaviour.
  # Timestomping is `touch($f, $orig)`: an EXPLICIT timestamp, restoring a
  # file's mtime after modifying it. `php-touch-call` above cannot tell them
  # apart, so `php-timestomp` fired on Symfony's http-kernel/Kernel.php, which
  # touches a cache-warmup marker and writes files, in four separate samples.
  - id: php-touch-explicit-timestamp
    desc: PHP touch sets an explicit timestamp
    conf: 0.95
    attack: T1070.006
    if:
      type: tree-sitter
      query: |
        (function_call_expression
          function: (name) @f
          arguments: (arguments (argument) (argument))
          (#eq? @f "touch"))
  - id: php-filemtime-call
    desc: Reads file modification time
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: filemtime
  # `touch($f, $saved)` restores a timestamp the same script captured earlier,
  # rather than stamping "now". Archive extractors and mtime-preserving copies
  # do this legitimately, so the atom stays notable; the anti-forensic reading
  # comes from the composites that pair it with an in-place rewrite of the very
  # file whose mtime was captured.
  - id: php-touch-restores-captured-mtime
    desc: touch() restores a captured modification time
    conf: 0.93
    attack: T1070.006
    if:
      type: tree-sitter
      # A call, not a declaration: WP_Filesystem_SSH2 declares (but never
      # implements) touch($file, $time, $atime), which the old text regex
      # read as a restore. The second argument must be a variable or a
      # filemtime() call -- stamping "now" or a literal is ordinary touch().
      query: |
        ((function_call_expression
           function: (name) @f
           arguments: (arguments (argument) . (argument) @second))
         (#eq? @f "touch")
         (#match? @second "^\\s*(\\$|filemtime)"))
