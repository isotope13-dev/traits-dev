defaults:
  platforms: [windows, unix]
  for: [php]

traits:
  - id: php-touch-call
    desc: PHP touch() sets file timestamps
    crit: notable
    conf: 0.9
    attack: T1070.006
    if:
      type: symbol
      kind: call
      exact: touch
  - id: php-filemtime-call
    desc: Reads file modification time
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: filemtime
  # `touch($f, $saved)` restores a timestamp the same script captured earlier,
  # rather than stamping "now". Archive extractors and mtime-preserving copies
  # do this legitimately, so the atom stays notable; the anti-forensic reading
  # comes from the composites that pair it with an in-place rewrite of the very
  # file whose mtime was captured.
  - id: php-touch-restores-captured-mtime
    desc: touch() restores a captured modification time
    crit: notable
    conf: 0.93
    attack: T1070.006
    if:
      type: text
      regex: '@?touch\s*\(\s*\$\w+\s*,\s*(\$\w+|filemtime\s*\()'
