# The decoded candidate handler snapshots DTA date/time into shared words,
# writes those words back with AH=57h/AL=1 on the same saved handle, then
# restores the candidate's saved attributes through AH=43h/AL=1.
defaults:
  platforms: [windows, unix]
  for: [dos_com, data, text]
  size_max: 65536

traits:
  - id: dos-xor-target-time-and-attributes-preservation
    desc: DOS restores target file metadata after update
    crit: suspicious
    conf: 0.99
    if:
      type: yara
      source: |
        rule dos_xor_target_time_and_attributes_preservation {
          meta:
            filetypes = "dos_com,data,text"
          strings:
            $save = "\xbb\x80\x00\x8b\x47\x15\xa3\x5d\x01\x8b\x47\x16\xa3\x59\x01\x8b\x47\x18\xa3\x5b\x01" xor(1-255)
            $clear = "\xba\x9e\x00\xb9\x00\x00\xb0\x01\xb4\x43\xcd\x21" xor(1-255)
            $time = "\x8b\x1e\x5f\x01\x8b\x0e\x59\x01\x8b\x16\x5b\x01\xb0\x01\xb4\x57\xcd\x21" xor(1-255)
            $restore = "\x8b\x0e\x5d\x01\xb0\x01\xba\x9e\x00\xb4\x43\xcd\x21\xc3" xor(1-255)
          condition:
            for any s in (1..#save) : ((uint8(@save[s]) ^ 0xbb) == uint8(8)) and
            for any c in (1..#clear) : ((uint8(@clear[c]) ^ 0xba) == uint8(8)) and
            for any t in (1..#time) : ((uint8(@time[t]) ^ 0x8b) == uint8(8)) and
            for any r in (1..#restore) : ((uint8(@restore[r]) ^ 0x8b) == uint8(8))
        }
