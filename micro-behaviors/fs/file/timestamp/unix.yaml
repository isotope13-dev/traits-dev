defaults:
  platforms: [linux, macos]
  for: [elf, macho, c, cpp]
  crit: baseline
traits:
  - id: utime-symbol
    desc: References utime timestamp API
    conf: 0.6
    if:
      type: symbol
      exact: utime
  - id: utimes-symbol
    desc: References utimes timestamp API
    conf: 0.6
    if:
      type: symbol
      exact: utimes
  - id: utimensat-symbol
    desc: References utimensat timestamp API
    conf: 0.6
    if:
      type: symbol
      exact: utimensat
  - id: futimens-symbol
    desc: References futimens timestamp API
    conf: 0.6
    if:
      type: symbol
      exact: futimens
  - id: lutimes-symbol
    desc: lutimes() modifies symlink timestamp
    conf: 0.6
    if:
      type: symbol
      exact: lutimes
composite_rules:
  - id: unix-timestamp-modification
    desc: References Unix timestamp modification APIs
    conf: 0.6
    any:
      - id: utime-symbol
      - id: utimes-symbol
      - id: utimensat-symbol
      - id: futimens-symbol
      - id: lutimes-symbol
