defaults:
  crit: notable
  conf: 0.95
  for:
  - shell
  platforms:
  - unix
traits:
- id: shell-touch-invocation
  desc: Shell invokes touch timestamp utility
  if:
    type: symbol
    kind: call
    regex: ^(touch|"touch"|'touch')$
  unless:
  - type: symbol
    kind: function
    exact: touch
  - id: metadata/lang/source::shell-parser-recovery-node
