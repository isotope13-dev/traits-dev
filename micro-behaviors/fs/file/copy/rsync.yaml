defaults:
  platforms: [unix, windows]
  for: [python, shell]
  crit: notable
  conf: 0.85

traits:
  - id: rsync-command
    desc: Invokes rsync to synchronize files
    if:
      type: text
      regex: '(?i)(^|[\s"'';&|])rsync(\.exe)?([\s-]|$)'

  - id: rsync-exclude-argument
    desc: Supplies an exclusion pattern to rsync
    if:
      type: text
      regex: '\brsync\b[^\n]{0,160}--exclude|--exclude[^\n]{0,160}\brsync\b'

  - id: rsync-remote-host-target
    desc: rsync transfers to a named remote host
    conf: 0.9
    if:
      type: text
      regex: '(?i)\brsync\b[^#\r\n]{0,120}([\w.-]+@[\w.-]+|[\w.-]+\.[a-z]{2,}):\S'

  - id: rsync-remote-variable-target
    desc: rsync targets a variable remote host
    conf: 0.9
    if:
      type: text
      regex: '\brsync\b[^#\r\n]{0,120}\$\{?\w+\}?:\S'

composite_rules:
  - id: rsync-with-excludes
    desc: Synchronizes files with rsync exclusion patterns
    crit: notable
    conf: 0.9
    all:
      - id: rsync-command
      - id: rsync-exclude-argument
