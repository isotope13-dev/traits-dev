defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: notable
  conf: 0.75
traits:
  - id: fs-copyfile
    desc: Copy file (fs.copyFile)
    if:
      type: text
      regex: '\b(fs|[A-Za-z_$][\w$]*\.promises)\.copyFile\s*\('
  - id: fs-copyfileSync
    desc: Copy file sync (fs.copyFileSync)
    if:
      type: text
      regex: '\b(fs|[A-Za-z_$][\w$]*\.promises)\.copyFileSync\s*\('
  - id: js-exists-and-copy
    desc: JavaScript checks then copies a local file
    crit: component
    conf: 0.82
    for: [javascript, typescript]
    if:
      type: text
      regex: 'existsSync\s*\(\s*[A-Za-z_$][\w$]*\s*\)[\s\S]{0,160}copyFile(Sync)?\s*\('
composite_rules:
  - id: fs-copy
    desc: Copy file (Node fs)
    crit: notable
    conf: 0.75
    any:
      - id: fs-copyfile
      - id: fs-copyfileSync
