defaults:
  platforms: [windows]
  for: [javascript, text]

traits:
  # Two-step form: `Set f = fso.GetFile(WScript.ScriptFullName)` then later
  # `f.Copy (dest)`. The file-copy leaf's chained regex cannot see across it.
  - id: wsh-self-getfile-near-copy
    desc: WSH self-path GetFile near Copy call
    crit: notable
    conf: 0.9
    for: [javascript, text, vbs, static-lib]
    if:
      type: text
      regex: '(?i)GetFile\s*\(\s*WScript\.ScriptFullName\s*\)[\s\S]{0,300}?\.Copy\s*\('


composite_rules:
  - id: wsh-copy-with-selfpath-reference
    desc: WSH file-copy API with a self-path reference
    crit: notable
    conf: 0.94
    for: [javascript, vbs]
    all:
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
      - id: micro-behaviors/process/info/selfpath::wscript-scriptfullname
    any:
      - id: micro-behaviors/fs/file/copy::wsh-file-copy-call
      - id: wsh-self-getfile-near-copy
      - id: micro-behaviors/fs/file/copy::fso-copyfile
      - id: micro-behaviors/fs/file/copy::copy-family-y-option

