defaults:
  platforms: [windows]
  for: [lnk]
traits:
  - id: lnk-config-to-batch-copy
    desc: Shortcut copies config content into batch file
    crit: notable
    conf: 0.97
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\btype\s+"[^"\r\n]+\.(ini|cfg)"\s*>\s*"[^"\r\n]+\.(bat|cmd)"'
