defaults:
  platforms:
  - unix
  - windows
  crit: suspicious
composite_rules:
- id: rust-build-rs-copy-out-dir
  desc: Cargo OUT_DIR and file copy clues
  crit: component
  conf: 0.88
  for:
  - rust
  all:
  - id: metadata/build/ecosystem::cargo-build-script-basename
  - id: micro-behaviors/os/env/read/named::cargo-out-dir-reference
  - id: micro-behaviors/fs/file/copy/source-destination::rust-fs-copy
