defaults:
  platforms: [windows]
  for: [batch]

traits:
- id: batch-copy-from-windows-temp
  for: [batch, text]
  desc: Batch copies file from Windows temp
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?im)\bcopy\s+[^\r\n]{0,30}\\Windows\\TEMP\\[^\s;&|]{1,40}\s+'

- id: batch-copy-to-windows-system-path
  desc: Copies executable into Windows directory
  crit: notable
  conf: 0.95
  if:
    type: value
    path: source.batch.command_sites[*].text
    regex: '(?i)^x?copy\s+\S+\s+%windir%\\[^\s";]{1,60}\.exe\b'
