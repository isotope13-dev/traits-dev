defaults:
  platforms: [windows]
  for: [powershell, batch, scripts, pe]
  attack: "T1484.001"
composite_rules:
  - id: netlogon-path-copy-command-clues
    for: [scripts, '!applescript', '!jcl', '!shell']
    desc: NETLOGON path near file-copy command
    crit: component
    conf: 0.92
    attack: T1570
    all:
      - id: micro-behaviors/network/share::netlogon-share-path
    any:
      - id: micro-behaviors/fs/file/copy/source-destination::windows-copy-command
      - id: micro-behaviors/fs/file/copy/command::powershell-copy-item-command
    needs: 1
    near_lines: 1
