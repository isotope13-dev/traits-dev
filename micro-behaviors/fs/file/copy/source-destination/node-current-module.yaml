defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  # Callback, promise and recursive-copy APIs carry the same self-copy act;
  # the __filename source argument, not the API spelling, is the evidence.
  - id: node-copy-current-module
    desc: Copies the current Node module file
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(copyFile|copyFileSync|cp|cpSync)$'
      arg:
        index: 0
        kind: identifier
        name: __filename
