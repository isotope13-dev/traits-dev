defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: node-copy-current-module
    desc: Copies the current Node module file
    if:
      type: symbol
      kind: call
      regex: '(^|\.)copyFileSync$'
      arg:
        index: 0
        kind: identifier
        name: __filename
