defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: node-copy-with-agent-rule-path
    desc: Node file-copy call accompanies agent rules dotfile path
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/path/agent-instructions::agent-rules-dotfile-path
    any:
      - id: micro-behaviors/fs/file/copy/call::js-copyfile-sync-call
      - id: micro-behaviors/fs/file/copy/call::fs-copyfile
      - id: micro-behaviors/fs/file/copy/call::node-cp-sync-call
