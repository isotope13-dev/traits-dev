defaults:
  platforms:
  - unix
  - windows
  for:
  - cfml
  crit: notable
  conf: 0.95
traits:
- id: cffile-request-copy-paths
  desc: Request supplies both file-copy paths
  if:
    type: symbol
    kind: call
    exact: cffile
    args:
    - index: 0
      from:
        field: action
        whole_value: (?i)^copy$
    - index: 0
      from:
        field: source
        member: ^(form|url)\.
    - index: 0
      from:
        field: destination
        member: ^(form|url)\.
