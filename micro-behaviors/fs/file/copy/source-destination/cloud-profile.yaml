defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: shell-cloud-profile-directory-copy
    desc: Copies a cloud or container profile directory
    conf: 0.98
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @copy
           argument: (_) @source argument: (_) @destination)
         (#match? @copy "^(/(usr/)?bin/)?cp$")
         (#match? @source "^[\"']?(~|\\$HOME|\\$\\{HOME\\})/\\.(aws|docker|config/gcloud)/?[\"']?$")
         (#not-match? @destination "^(-|[12]?>)"))
