# A ProgramData copy may install data or a ticket; it does not prove autorun.
defaults:
  for: [batch]
  platforms: [windows]
  crit: notable
traits:
  - id: batch-copy-programdata-command
    desc: Copy command references ProgramData path
    conf: 0.9
    if:
      type: text
      regex: '(?im)(^|[&|(])[ \t]*@?(x?copy|robocopy|move)\b[^\r\n]{0,80}%ProgramData%[\\/]'
