defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: batch-own-source-marker-digit-step
  desc: Own-source copy advances a marker digit
  crit: notable
  conf: 0.98
  if:
    type: yara
    source: "rule batch_own_source_marker_digit_step {\n strings:\n  $guard = /if exist %[A-Za-z_][A-Za-z0-9_]{0,31}%\\\
      \\[A-Za-z0-9_.~\\-]{1,80}[0-8] copy %(0|~f0) / nocase\n  $phasecopy = / copy %(0|~f0) / nocase\n  $dest =\
      \ /%[A-Za-z_][A-Za-z0-9_]{0,31}%\\\\[A-Za-z0-9_.~\\-]{1,80}[1-9] > nul/ nocase\n condition:\n  #guard > 0\
      \ and #guard <= 32 and #phasecopy <= 32 and #dest > 0 and #dest <= 32 and\n  for any a in (1..#guard) : (\n\
      \   (@guard[a] == 0 or uint8(@guard[a]-1) == 10) and\n   for any h in (1..#phasecopy) : (\n   @phasecopy[h]\
      \ > @guard[a] and @phasecopy[h]+!phasecopy[h] == @guard[a]+!guard[a] and\n   for any b in (1..#dest) : (\n\
      \    @dest[b] == @guard[a]+!guard[a] and\n    @phasecopy[h]-@guard[a]-9 == !dest[b]-6 and\n    uint8(@dest[b]+!dest[b]-7)\
      \ == uint8(@phasecopy[h]-1)+1 and\n    for all k in (0..!dest[b]-8) : ((uint8(@guard[a]+9+k)|32) == (uint8(@dest[b]+k)|32))\n\
      \   )\n  )\n  )\n}"
