defaults:
  platforms: [windows]
  for: [batch]
traits:
  - id: batch-browser-store-copy
    desc: Copies a browser profile credential store
    crit: notable
    conf: 0.97
    if:
      type: value
      path: source.batch.command_sites[*].text
      regex: '(?i)^x?copy\s+.{0,80}(User Data|Firefox\\Profiles)\\.{0,80}(Login Data|cookies)'
