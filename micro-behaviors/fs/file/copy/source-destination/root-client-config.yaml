# Copying a database client config or public SSH trust file does not prove
# that secret values were present or extracted. Keep the observation neutral.
defaults:
  platforms: [linux]
  crit: notable
  conf: 0.95

traits:
  - id: shell-root-client-config-copy
    desc: Copies root MySQL or SSH configuration
    for: [shell]
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @tool
           argument: (_) @source
           argument: (_) @following) @copy
         (#match? @tool "^(/(usr/)?bin/)?cp$")
         (#match? @source "^[\"']?/root/(\\.?my\\.cnf|\\.ssh/(authorized_keys|known_hosts))[\"']?$")
         (#not-match? @following "^[\"']?-")
         (#not-match? @copy "[ \\t](-[A-Za-z]*t|--target-directory)"))
  - id: call-root-client-config-copy
    desc: Copies root MySQL or SSH configuration
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^shutil\.(copy|copy2|copyfile)$'
      arg:
        index: 0
        from:
          whole_value: '^/root/(\.?my\.cnf|\.ssh/(authorized_keys|known_hosts))$'
  - id: php-root-client-config-copy
    desc: Copies root MySQL or SSH configuration
    for: [php]
    if:
      type: symbol
      kind: call
      exact: copy
      arg:
        index: 0
        regex: '^/root/(\.?my\.cnf|\.ssh/(authorized_keys|known_hosts))$'
