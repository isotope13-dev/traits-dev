defaults:
  for: [lua]
  platforms: [unix]
traits:
  - id: lua-script-copy-to-discovered-mount
    desc: Lua copies scripts into discovered mount paths
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: lua
      query: |
        ((chunk
          (function_declaration name: (identifier) @helper
            parameters: (parameters . (identifier) @parameter .)
            body: (block
              (variable_declaration (assignment_statement
                (expression_list (function_call name: (dot_index_expression) @popen
                  arguments: (arguments (binary_expression left: (identifier) @input operator: ".."))))))))
          (function_declaration body: (block
            (for_statement body: (block
              (variable_declaration (assignment_statement
                (variable_list . (identifier) @mount .)
                (expression_list (function_call name: (identifier) @discovery
                  arguments: (arguments . (binary_expression left: (string) @mountcmd) .)))))
              . (if_statement consequence: (block
                (function_call name: (identifier) @copy
                  arguments: (arguments . (binary_expression left: (string) @cp
                    right: (binary_expression right: (binary_expression right:
                      (binary_expression left: (identifier) @destination right: (string) @script)))) .)))))))))
          (#eq? @helper @discovery) (#eq? @helper @copy)
          (#eq? @parameter @input) (#eq? @popen "io.popen")
          (#eq? @mount @destination)
          (#match? @mountcmd "[\"']mount ") (#match? @cp "[\"']cp ")
          (#match? @script "\\.sh")
          (#set! cleave.ignore-comments "true"))
