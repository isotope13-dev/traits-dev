defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable
traits:
  - id: lnk-temp-config-to-batch-copy
    desc: LNK arguments copy TEMP config as batch
    conf: 0.98
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bcopy\s+"%TEMP%\\[^"]+\.(ini|cfg)"\s+"%TEMP%\\[^"]+\.(bat|cmd)"'
