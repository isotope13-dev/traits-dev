defaults:
  platforms:
    - "windows"
  for:
    - "batch"
traits:
  - 
    id: "batch-system-script-copy"
    desc: "Copies script between Windows system paths"
    crit: "notable"
    conf: 0.96
    if:
      type: "value"
      path: "source.batch.command_sites[*].text"
      regex: "(?i)^copy\\s+%systemroot%\\\\system32\\\\[^\\s\"]{1,80}\\.bat\\s+%systemroot%\\\\system\\\\"
