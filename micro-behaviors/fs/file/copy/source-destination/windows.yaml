defaults:
  platforms:
  - windows
  for:
  - scripts
  crit: notable
  conf: 0.9
traits:
- id: windows-copy-command
  desc: Uses Windows copy command
  for:
  - scripts
  - text
  if:
    type: text
    regex: (?im)(^|[&|]| /c)[ \t]*(copy|xcopy|robocopy) +[^\s;&|]{0,60}[\\/.*%][^\s;&|]{0,60} +\S
  unless:
  - id: metadata/file/format/log::windows-event-csv-records
  - id: metadata/build/docker::embedded-dockerfile-copy-stage
- id: windows-if-exist-copy-command
  desc: Conditional Windows file copy
  if:
    type: text
    regex: (?im)^ *if +(not +)?exist +.{1,240} +(copy|xcopy|robocopy) +\S
- id: copy-family-y-option
  desc: Copy-family command with a /Y option
  crit: notable
  conf: 0.9
  for:
  - scripts
  - batch
  if:
    type: text
    regex: (?i)\b(copy|xcopy|robocopy)\s+/y\b
- id: batch-copy-stripped-source
  desc: Copy source uses substring-removal expansion
  crit: suspicious
  conf: 0.85
  for:
  - batch
  if:
    type: text
    regex: (?im)^[ \t]*(copy|xcopy)[ \t]+[^\r\n]{0,40}%[A-Za-z_]\w*:[A-Za-z0-9_]{3,}=%
- id: robocopy-backup-mode
  desc: Robocopy backup mode (/B) switch
  crit: notable
  conf: 0.93
  for:
  - scripts
  - source
  - python
  - batch
  - cmd
  if:
    type: text
    regex: (?i)\brobocopy\b[^\n]{0,200}(\s/B\b|"/B")
- id: esentutl-raw-file-copy
  desc: Esentutl raw file copy
  crit: notable
  conf: 0.96
  for:
  - scripts
  - source
  - binaries
  if:
    type: text
    regex: (?i)\besentutl(\.exe)?\s+/y\s+["']?[^"'\r\n]{1,220}["']?\s+/d\s+["']?[^"'\r\n]{1,220}["']?
- id: esentutl-vss-copy
  desc: Esentutl copies via Volume Shadow Copy
  crit: notable
  conf: 0.97
  for:
  - scripts
  - source
  - binaries
  if:
    type: text
    regex: (?i)\besentutl(\.exe)?\s+/y\s+/vss\b
- id: copy-to-windir-percent-var
  desc: Copies variable-selected file into Windows
  crit: notable
  conf: 0.94
  for:
  - batch
  - elixir
  - text
  - html
  if:
    type: text
    regex: (?i)copy\s+(%[^%\s]{1,40}%){1,4}(\.[A-Za-z0-9]{1,4})?\s+%windir%
composite_rules:
- id: self-copy-relaunch-api-set
  desc: Imports self-copy and relaunch APIs
  conf: 0.94
  for:
  - pe
  - dll
  attack: T1129
  all:
  - id: micro-behaviors/fs/file/copy/call::copyfile-w
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/fs/path/check::get-module-filename
  - id: micro-behaviors/fs/delete/file/library::deletefile-w
  - id: micro-behaviors/fs/file/open::file-create-win
  - id: micro-behaviors/fs/file/handle::set-file-pointer
  - id: micro-behaviors/fs/write/file/handle::write-file
  - id: micro-behaviors/time/query::get-tick-count
  unless:
  - id: metadata/lang/compiled::autoit-compiled-script
  - id: well-known/tool
  - id: well-known/app/system/iobit::iobit-component-context
  - id: well-known/lib/native/madexcept/
