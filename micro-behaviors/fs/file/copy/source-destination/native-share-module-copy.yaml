defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1021.002

composite_rules:
  - id: native-share-module-copy
    desc: Enumerates SMB resources, connects to shares and copies its module
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/communications/socket/share::wnet-share-scan
      - id: micro-behaviors/network/share::wnet-add-connection
      - id: micro-behaviors/fs/file/copy/call::copyfile-module-path-api-pair
    unless:
      - id: metadata/installer/product/
      # Microsoft's own thunk layers (MSLU unicows.dll) wrap every WNet and
      # CopyFile API.
      - id: metadata/signature/verified/platform::microsoft
