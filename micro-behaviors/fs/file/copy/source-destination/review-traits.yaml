composite_rules:
- platforms:
  - windows
  - unix
  for:
  - javascript
  crit: component
  conf: 0.95
  id: node-project-scaffold-template-writer
  desc: Node project scaffolder writes template files
  all:
  - id: metadata/build/scaffold::template-package-json-path
  - id: micro-behaviors/fs/directory/cwd::process-cwd-call
  - id: micro-behaviors/fs/file/copy/call::fs-copy
  any:
  - id: metadata/build/scaffold::template-js-build-config-path
  - id: metadata/build/scaffold::template-css-build-config-path
  - id: metadata/build/scaffold::template-package-json-file-path
  - id: micro-behaviors/fs/path/agent-config/directory::claude-config-directory
