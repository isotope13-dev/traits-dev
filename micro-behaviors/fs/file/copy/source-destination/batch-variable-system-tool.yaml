defaults:
  platforms:
    - "windows"
  for:
    - "batch"
traits:
  - 
    id: "batch-variable-system-tool-to-temp"
    desc: "Copies variable system tool into Temp"
    crit: "notable"
    conf: 0.96
    if:
      type: "value"
      path: "source.batch.command_sites[*].text"
      regex: "(?i)^x?copy\\s+%\\w+%\\\\system32\\\\(%[^%]{1,40}%){1,4}\\.exe\\s+%temp%\\\\\\S+\\.exe\\b"
