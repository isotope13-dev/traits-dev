defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable
traits:
  - id: lnk-unc-file-copy
    desc: LNK command copies a UNC file
    conf: 0.98
    if:
      type: value
      path: lnk.arguments
      # Command boundary, remote source, and a destination operand. The file
      # need not have a .tar suffix or be staged under a particular variable.
      regex: '(?i)(^|[&|]\s*|/c\s+)copy\s+"?\\\\[^"&\r\n]+"?\s+[^\s&|]+'
