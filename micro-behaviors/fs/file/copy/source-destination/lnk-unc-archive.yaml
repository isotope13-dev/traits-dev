defaults:
  platforms: [windows]
  for: [lnk]
  crit: notable
traits:
  - id: lnk-unc-tar-copy-to-userprofile
    desc: LNK copies UNC tar archive into USERPROFILE
    conf: 0.98
    if:
      type: value
      path: lnk.arguments
      regex: '(?i)\bcopy\s+"?\\\\[^&\r\n]{1,240}\.tar"?\s+"?%USERPROFILE%\\'
