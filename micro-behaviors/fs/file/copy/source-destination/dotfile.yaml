defaults:
  platforms: [unix, appliance]
  for: [shell]
traits:
  - id: cp-nonconfig-hidden-dotfile
    desc: Copies file to hidden dotfile
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      query: |
        ((command name: (command_name) @cmd
          argument: (_) @src
          . argument: (_) @dest) @copy
          (#eq? @cmd "cp")
          (#match? @dest "(^|/)\\.[A-Za-z0-9_-][A-Za-z0-9_.-]*[\"']?$")
          (#not-match? @dest "(^|/)\\.(bashrc|bash_profile|profile|zshrc|gitconfig|vimrc|tmux\\.conf|npmrc|dependency-cruiser([._-][A-Za-z0-9_.-]+)?|env([._-][A-Za-z0-9_.-]+)?)[\"']?$"))

