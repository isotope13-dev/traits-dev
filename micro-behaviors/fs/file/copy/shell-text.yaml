defaults:
  platforms: [unix]

traits:
- platforms:
  for:
  - scripts
  - source
  crit: notable
  conf: 0.9
  id: cp-command-text
  desc: Source contains cp file-copy command
  if:
    type: text
    regex: (^|[\r\n;&|`$({]|["'])cp[ \t]+[-~$/.%"'\w][^\r\n;&|]{0,240}($|[\r\n;&|])

- for: [elf]
  id: cp-command-elf-rodata
  desc: ELF read-only data contains cp command
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(^|[\r\n;&|`$({]|["''])cp[ \t]+[-~$/.%"''\w][^\r\n;&|]{0,240}($|[\r\n;&|])'
    section: .rodata

composite_rules:
  - id: cp-command
    desc: Source or ELF data contains a cp file-copy command
    crit: notable
    conf: 0.9
    for: [scripts, source, elf]
    any:
      - id: cp-command-text
      - id: cp-command-elf-rodata
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/kernel::linux-kernel-drm-ci-build-script
      - id: metadata/package/files/system-package::shell-completion-script
    downgrade:
      any:
        # package() normally copies staged files into $pkgdir.
        - id: metadata/file/string/identity::pkgbuild-basename
