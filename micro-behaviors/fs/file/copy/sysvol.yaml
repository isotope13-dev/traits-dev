composite_rules:
  # SYSVOL copies also occur in administration and backups. Intent comes from
  # additional evidence in the GPO staging and tunnel-service composites.
  - id: sysvol-script-file-transfer
    platforms: [windows]
    for: [scripts, '!applescript', '!jcl', '!shell']
    desc: File copy command references SYSVOL scripts
    crit: notable
    conf: 0.92
    attack: T1570
    all:
      - id: micro-behaviors/os/security/policy::sysvol-scripts-share-path
    any:
      - id: micro-behaviors/fs/file/copy::windows-copy-command
      - id: micro-behaviors/fs/file/copy::powershell-copy-item-command
    needs: 1
    near_lines: 2
