defaults:
  for: [csharp]
  platforms: [windows]
traits:
  - id: file-copy-source
    desc: File.Copy call in C# source
    crit: notable
    conf: 0.88
    if:
      type: symbol
      kind: call
      exact: File.Copy
    unless:
      - id: well-known/game/mod::bedrockboot-source-repository
  - id: current-process-path
    desc: C# resolves the current executable path
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: member
      exact: Environment.ProcessPath
  - id: running-executable-copy
    desc: C# copies its current executable
    crit: notable
    conf: 0.94
    if:
      # The current-executable expression must be the source argument. Merely
      # naming an updaterExecutablePath as File.Copy's destination is an
      # ordinary updater operation, not self-copying propagation.
      type: text
      regex: 'File\.Copy\(\s*[^,\r\n]{0,120}(ExecutablePath|ProcessPath|MainModule)\b'
  - id: self-copy-random-exe
    desc: Self-copy to randomized exe name
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'File\.Copy\(\w+,\s*.{0,80}\+\s*\w+\s*\+\s*"\.exe"\)'
