# AppleScript `quoted form of` around a copy command.

defaults:
  platforms:
    - macos
  for:
    - applescript
    - macho
  attack: T1555.003

traits:
  - id: cp-quoted-form
    desc: Copy command with quoted form (AppleScript)
    crit: notable
    conf: 0.7
    if:
      type: text
      regex: cp\s+-rf.{0,30}quoted\s+form\s+of
