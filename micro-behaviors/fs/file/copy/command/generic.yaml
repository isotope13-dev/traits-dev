defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [elf, macho, pe, c, cpp]
traits:
  - id: windows-shell-copy-command
    desc: Windows shell copy command template
    conf: 0.87
    for: [pe, c, cpp]
    platforms: [windows]
    if:
      type: text
      exact: 'copy "%s" "%s"'
  - id: powershell-copy-item-command
    desc: References the PowerShell Copy-Item command
    conf: 0.9
    for: [batch, vbs, powershell, javascript, pe, dll]
    platforms: [windows]
    if:
      type: text
      substr: Copy-Item
    unless:
      - id: well-known/tool/detection/owasp-modsecurity-crs::owasp-crs-powershell-catalog-context
  - id: shell-cat-variable-append-copy
    desc: Shell appends a variable-path file
    conf: 0.94
    for: [shell]
    platforms: [unix]
    if:
      type: text
      regex: '(?m)(^|[;&])\s*cat\s+["'']?\$\{?[A-Za-z_]\w*\}?["'']?\s*>>\s*["'']?\$\{?[A-Za-z_]\w*\}?'
