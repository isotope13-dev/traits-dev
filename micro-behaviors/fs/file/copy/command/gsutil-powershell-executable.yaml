defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.98
traits:
  - id: gsutil-copy-executable-path
    desc: gsutil copies to an executable path
    if:
      type: tree-sitter
      query: |
        ((command
          command_name: [(command_name) (command_name_expr)] @tool) @command
          (#match? @tool "(?i)^[\"']?gsutil(?:\\.exe)?[\"']?$")
          (#match? @command "(?i)^[& \\t]*[\"']?gsutil(?:\\.exe)?[\"']?[ \\t]+(?:-m[ \\t]+)?cp[ \\t]+[^\\r\\n]+[ \\t]+[\"']?[a-z]:\\\\[^\\r\\n\"']+\\.exe[\"']?[ \\t]*$"))
