defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.95
traits:
  - id: gcloud-storage-copy-command
    desc: Shell invokes gcloud storage copy
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @program
          . argument: (word) @storage . argument: (word) @action
          argument: (_) @source argument: (_) @destination)
          (#match? @program "(^|/)gcloud$")
          (#eq? @storage "storage")
          (#eq? @action "cp"))

  - id: gcloud-copy-chmod-same-path
    desc: gcloud copy destination equals chmod target
    if:
      type: tree-sitter
      language: shell
      query: |
        ((_ (command name: (command_name) @program
              . argument: (word) @storage . argument: (word) @action
              . argument: (_) @source . argument: (_) @destination .)
            (command name: (command_name) @chmod
              . argument: (word) @mode . argument: (_) @target .))
          (#match? @program "(^|/)gcloud$")
          (#eq? @storage "storage")
          (#eq? @action "cp")
          (#match? @chmod "(^|/)chmod$")
          (#eq? @mode "+x")
          (#eq? @destination @target))
