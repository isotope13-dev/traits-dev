defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: temp-jpg-payload-copy--binary
  desc: Batch copies JPG to EXE or DLL
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: '(?i)copy.{0,40}%temp%\\.{1,80}\.jpg.{0,120}\.(exe|dll)'
- id: temp-jpg-payload-copy--other
  desc: Batch copies JPG to CMD MSI INI
  crit: suspicious
  conf: 0.92
  if:
    type: text
    regex: '(?i)copy.{0,40}%temp%\\.{1,80}\.jpg.{0,120}\.(cmd|msi|ini)'
composite_rules:
- id: temp-jpg-payload-copy
  desc: Batch copies JPG to another file type
  crit: suspicious
  conf: 0.92
  any:
  - id: micro-behaviors/fs/file/copy/command::temp-jpg-payload-copy--binary
  - id: micro-behaviors/fs/file/copy/command::temp-jpg-payload-copy--other
