defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: shell-copy-allow-all-extension-path
    desc: cp references allow-all extension path
    crit: notable
    conf: 0.92
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name (word) @cmd) argument: (word) @path)
          (#eq? @cmd "cp")
          (#match? @path "(^|/)[^/]*allow-all[^/]*extension(/|$)"))
