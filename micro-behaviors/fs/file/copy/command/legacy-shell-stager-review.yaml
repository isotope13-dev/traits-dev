defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
  attack: T1059.004
traits:
- id: variable-suffixed-file-to-variable
  desc: Copies variable-suffixed file to variable
  crit: notable
  conf: 0.96
  if:
    type: text
    exclude_comments: true
    regex: \bcat\s+[A-Za-z0-9._/-]+\.\$[A-Za-z_][A-Za-z0-9_]*\s*>\s*\$[A-Za-z_][A-Za-z0-9_]*
