defaults:
  crit: notable
  conf: 0.95
  for: [scripts, source]
  platforms: [unix]
traits:
  - id: shell-copy-login-keychain
    desc: Shell copies login Keychain database
    if:
      type: text
      regex: '(?m)^ *cp +[^\n]{0,100}/login\.keychain(-db)?["'']? +[^\n]{1,120}'
  - id: shell-copy-npmrc
    desc: Shell copies npm credentials configuration
    if:
      type: text
      regex: '(?m)^ *cp +[^\n]{0,100}/\.npmrc["'']? +[^\n]{1,120}'
  - id: shell-copy-ssh-directory
    desc: Shell recursively copies SSH directory
    if:
      type: text
      regex: '(?m)^ *cp +-[A-Za-z]*[Rr][A-Za-z]* +[^\n]{0,100}/\.ssh/?["'']? +[^\n]{1,120}'
