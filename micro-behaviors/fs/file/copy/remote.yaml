defaults:
  platforms: [windows, unix]
  for: [scripts]

traits:
  - id: copy-verb-to-named-remote
    desc: Data-copy verb targets named remote
    crit: notable
    conf: 0.9
    if:
      type: text
      # Keep the span command-like: prose and object literals can place a
      # colon near these verbs, but CLI operands do not contain quotes,
      # commas, braces, or arbitrary prose before the named remote.
      regex: '(?im)^[ \t]*(copy|sync|move)[ \t]+[\w./\\-]+[ \t]+\w+:[\w./~%-]+'

  - id: executable-invokes-copy-verb
    desc: Executable uses a data-copy verb
    crit: notable
    conf: 0.88
    for: [batch, powershell, shell, scripts]
    if:
      type: text
      regex: '(?i)\.exe\b[^b\n]{0,100}\b(copy|sync|move)\b'

composite_rules:
  - id: executable-copy-to-named-remote
    desc: Executable copies data to named remote
    crit: notable
    conf: 0.9
    all:
      - id: executable-invokes-copy-verb
      - id: copy-verb-to-named-remote
    near_lines: 4
