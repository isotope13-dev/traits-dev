defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: object-file-stage-command
    desc: Stages a Windows object or library
    crit: notable
    conf: 0.8
    size_max: 10000
    if:
      type: text
      regex: '(?m)^ *(cp|mv|install) .{0,120}\.(obj|lib)\b'
    unless:
      - type: basename
        regex: "\\.mk$"
      - id: metadata/build/conda::conda-recipe-build-script
    not:
      - substr: "$lib.dll.lib"
      - substr: "/$lib.lib"
  - id: copy-to-etc-path
    desc: Copies a file into /etc
    crit: notable
    conf: 0.88
    for: [shell, c, cpp, elf, macho, python, javascript]
    if:
      type: text
      regex: '\b(cp|install|mv)\s+[^\n]{1,120}\s/etc/'
  - id: copy-to-executable-directory
    desc: Copies a file into executable directory
    crit: notable
    conf: 0.88
    for: [shell, c, cpp, elf, macho, python, javascript]
    if:
      type: text
      regex: '\b(cp|install|mv)\s+[^\n]{1,120}\s/(usr/(local/)?bin|opt)/'

composite_rules:
  - id: copy-to-system-executable-path
    desc: Copies file into system executable path
    crit: notable
    conf: 0.9
    for: [shell, c, cpp, elf, macho, python, javascript]
    any:
      - id: copy-to-etc-path
      - id: copy-to-executable-directory
