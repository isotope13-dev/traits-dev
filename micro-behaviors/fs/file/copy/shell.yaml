defaults:
  crit: notable
  platforms:
  - unix
  for:
  - shell
traits:
- id: macos-updater-app-copy
  desc: macOS updater copies a discovered application
  conf: 0.95
  platforms:
  - macos
  if:
    type: text
    regex: (?m)^\s*cp\s+-R\s+.{0,200}\bAPP_NAME\b
- id: object-file-stage-command
  desc: Stages a Windows object or library
  conf: 0.8
  size_max: 10000
  if:
    type: text
    regex: (?m)^ *(cp|mv|install) .{0,120}\.(obj|lib)\b
  unless:
  - type: basename
    regex: \.mk$
  - id: metadata/build/conda::conda-recipe-build-script
  not:
  - substr: $lib.dll.lib
  - substr: /$lib.lib
- id: release-executable-copy-to-named-output
  desc: Copies release executable to named output
  conf: 0.95
  if:
    type: text
    regex: (?mi)^\s*cp\s+["']?target/\S+/release/\S+\.exe["']?\s+["']?\S*\$[A-Z_]*NAME
