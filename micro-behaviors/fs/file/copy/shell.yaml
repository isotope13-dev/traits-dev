defaults:
  platforms: [unix]
  for: [shell]

traits:
  - id: macos-updater-app-copy
    desc: macOS updater copies a discovered application
    crit: notable
    conf: 0.95
    platforms: [macos]
    if:
      type: text
      regex: '(?m)^\s*cp\s+-R\s+.{0,200}\bAPP_NAME\b'
  - id: object-file-stage-command
    desc: Stages a Windows object or library
    crit: notable
    conf: 0.8
    size_max: 10000
    if:
      type: text
      regex: '(?m)^ *(cp|mv|install) .{0,120}\.(obj|lib)\b'
    unless:
      - type: basename
        regex: "\\.mk$"
      - id: metadata/build/conda::conda-recipe-build-script
    not:
      - substr: "$lib.dll.lib"
      - substr: "/$lib.lib"
  # The leading `[^\n]{0,48}` exists purely so the line prefix lands INSIDE the
  # evidence, which is the only thing `not:` can filter on. Without it, install
  # instructions written in a comment ("##  cp FILE /etc/bash_completion.d/..."
  # in node-dashdash's completion template) were reported as a copy into /etc.
  - id: copy-to-etc-path
    desc: Copies a file into /etc
    crit: notable
    conf: 0.88
    for: [shell, c, cpp, elf, macho, python, javascript]
    if:
      type: text
      regex: '(?m)^[^\n]{0,48}\b(cp|install|mv)\s+[^\n]{1,120}\s/etc/'
    not:
      - regex: '^\s*(#|//|\*|--)'
  - id: copy-to-executable-directory
    desc: Copies a file into executable directory
    crit: notable
    conf: 0.88
    for: [shell, c, cpp, elf, macho, python, javascript]
    if:
      type: text
      regex: '(?m)^[^\n]{0,48}\b(cp|install|mv)\s+[^\n]{1,99}\s/(usr/(local/)?bin|opt)/'
    not:
      - regex: '^\s*(#|//|\*|--)'

composite_rules:
  - id: copy-to-system-executable-path
    desc: Copies file into system executable path
    crit: notable
    conf: 0.9
    for: [shell, c, cpp, elf, macho, python, javascript]
    any:
      - id: copy-to-etc-path
      - id: copy-to-executable-directory
