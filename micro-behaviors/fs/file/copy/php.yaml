defaults:
  platforms: [unix, windows]
  for: [php]

traits:
  - id: copy-call
    desc: Copies file via copy()
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: copy
  - id: php-upload-temp-file-access
    desc: PHP accesses uploaded temporary file path
    crit: notable
    conf: 0.9
    if:
      type: string_literal
      exact: tmp_name

  - id: php-copy-uploaded-temp-file
    desc: Copies uploaded PHP temp file
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'copy\s*\(\s*\$_FILES\[[^)]{1,120}\[''tmp_name''\]'
    unless:
      - id: metadata/lang/source::yara-rule-source
      - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
