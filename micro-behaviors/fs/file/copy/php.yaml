defaults:
  crit: notable
  platforms: [unix, windows]
  for: [php]

traits:
  - id: php-write-own-source-copy
    desc: Writes a copy of its PHP source
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        ((function_call_expression
          function: (name) @write
          arguments: (arguments .
            (argument)
            (argument (function_call_expression
              function: (name) @read
              arguments: (arguments . (argument (name) @self)))))) @copy
          (#match? @write "(?i)^file_put_contents$")
          (#match? @read "(?i)^file_get_contents$")
          (#eq? @self "__FILE__"))
  - id: copy-call
    desc: Copies file via copy()
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: copy
  - id: php-copy-uploaded-temp-file
    desc: PHP copy call takes $_FILES tmp_name expression
    conf: 0.92
    if:
      type: tree-sitter
      language: php
      query: |
        [
          (function_call_expression
            function: (name) @fn
            (#match? @fn "(?i)^copy$")
            arguments: (arguments .
              (argument
                [
                  (subscript_expression
                    (subscript_expression
                      (variable_name (name) @root)
                      (_))
                    [
                      (string (string_content) @key)
                      (encapsed_string (string_content) @key)
                    ])
                  (subscript_expression
                    (subscript_expression
                      (subscript_expression
                        (variable_name (name) @root)
                        (_))
                      [
                        (string (string_content) @key)
                        (encapsed_string (string_content) @key)
                      ])
                    (_))
                ]))
            (#eq? @root "_FILES")
            (#eq? @key "tmp_name"))
          (function_call_expression
            function: (qualified_name (name) @fn) @fq
            (#match? @fn "(?i)^copy$")
            (#match? @fq "(?i)^\\\\copy$")
            arguments: (arguments .
              (argument
                [
                  (subscript_expression
                    (subscript_expression
                      (variable_name (name) @root)
                      (_))
                    [
                      (string (string_content) @key)
                      (encapsed_string (string_content) @key)
                    ])
                  (subscript_expression
                    (subscript_expression
                      (subscript_expression
                        (variable_name (name) @root)
                        (_))
                      [
                        (string (string_content) @key)
                        (encapsed_string (string_content) @key)
                      ])
                    (_))
                ]))
            (#eq? @root "_FILES")
            (#eq? @key "tmp_name"))
        ]
    unless:
      - id: "metadata/lang/source/syntax::yara-rule-source"
      - id: well-known/tool/detection/security-scanner::anteumbra-package-tree-member
