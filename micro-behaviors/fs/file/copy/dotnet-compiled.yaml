# Compiled .NET self-copy evidence. A compiled assembly cannot carry the
# `File.Copy(<self>, ...)` source expression this leaf's C# rules match; the
# same operation survives as three adjacent metadata tokens: the reflection
# entry point, the running assembly's location getter, and the Copy member.
# Each token alone is generic; the tight co-location is the self-copy claim.
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
- id: get-entry-assembly-token
  desc: GetEntryAssembly reflection token
  crit: component
  conf: 0.9
  if:
    type: text
    exact: GetEntryAssembly
- id: assembly-location-getter-token
  desc: Assembly location getter token
  crit: component
  conf: 0.9
  if:
    type: text
    exact: get_Location
- id: managed-copy-member-token
  desc: Managed Copy member token
  crit: component
  conf: 0.9
  if:
    type: text
    word: Copy
composite_rules:
- id: dotnet-self-assembly-copy
  desc: Managed self-assembly copy evidence
  crit: notable
  conf: 0.9
  near_bytes: 256
  all:
  - id: get-entry-assembly-token
  - id: assembly-location-getter-token
  - id: managed-copy-member-token
