# Metadata-name proximity records references, not a source-to-copy binding.
defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
- id: managed-assembly-path-copy-references
  desc: Entry-assembly, location and Copy names co-occur
  crit: notable
  conf: 0.9
  near_bytes: 256
  all:
  - id: micro-behaviors/metaprogramming/reflection::dotnet-get-entry-assembly-reference
  - id: metadata/binary/symbols/name/token::location-getter-name
  - id: metadata/binary/symbols/name/token::copy-member-name
