defaults:
  platforms: [windows]
  for: [batch]
traits:
- id: batch-copy-to-appdata
  desc: Copy command references an AppData path
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: '(?i)\b(copy|xcopy|robocopy)\b[^&|\r\n]{0,240}%AppData%[\\/]'
  unless:
    - id: micro-behaviors/fs/path/library::resharper-user-plugin-path
