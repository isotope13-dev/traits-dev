defaults:
  for: [batch, html, javascript, powershell, vbs]
  platforms: [windows]
traits:
  - id: batch-for-file-to-temp-script
    desc: Copies FOR-selected file into temporary script
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '(?i)\bcopy\s+(/y\s+)?"?%{1,2}[a-z]"?\s+"?%T(E)?MP%[\\/][^"\r\n&]{1,80}\.(vbs|js|hta|ps1)\b'
