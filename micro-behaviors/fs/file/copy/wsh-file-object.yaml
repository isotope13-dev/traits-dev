defaults:
  platforms: [windows]
  for: [javascript, text, vbs, static-lib]
  attack: T1080

traits:
  - id: wsh-file-copy-call
    desc: WSH File object Copy call
    crit: notable
    conf: 0.86
    if:
      type: text
      # Preserve canonical COM casing and whole destination identifiers:
      # lowercase Buffer.copy(target2, ...) must not match.
      regex: '(?i:GetFile\s*\([^;\n]{0,80}\)\s*\.\s*Copy\s*\()|\.Copy\s*\(\s*(dest|target)\b'
