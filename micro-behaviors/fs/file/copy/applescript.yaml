defaults:
  platforms: [macos]
  for: [applescript]
  attack: T1005

traits:
  - id: duplicate-file-into-folder
    desc: AppleScript duplicates a file into folder
    crit: notable
    conf: 0.92
    for: [applescript, shell, python, javascript, swift, go, macho]
    if:
      type: text
      regex: '(?i)\bduplicate\s+(file\s+)?[^\r\n]{1,140}\s+to\s+folder\b'
