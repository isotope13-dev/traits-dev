defaults:
  platforms: [macos]
  for: [applescript]

traits:
  - id: applescript-duplicate-to-location
    desc: AppleScript duplicate to filesystem location
    crit: notable
    conf: 0.92
    for: [scripts, source, macho]
    if:
      type: text
      regex: '(?i)\bduplicate\b[^\r\n]{0,160}\bto\b[^\r\n]{0,40}(POSIX file|folder|alias)'
