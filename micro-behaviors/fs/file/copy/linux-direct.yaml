# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: copy-range-syscall
    desc: Copies data between file descriptors
    crit: baseline
    if:
      type: syscall
      name: [copy_file_range]
      arch: [x86_64, aarch64]
  - id: sendfile-syscall
    desc: Transfers data between file descriptors
    crit: baseline
    if:
      type: syscall
      name: [sendfile]
      arch: [x86_64, aarch64]
