# A name in a dispatch table establishes neither WSH ownership nor persistence.
# Keep token boundaries: prepareCopyFile is a different identifier.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: copyfile-name-token
    desc: CopyFile name in script text
    crit: notable
    conf: 0.9
    if:
      type: text
      word: CopyFile
