defaults:
  for: [text]
  platforms: [windows]
  crit: notable
  conf: 0.9
traits:
  - id: autolisp-line-copy-loop
    desc: AutoLISP line-reading and line-writing loop
    if:
      type: text
      regex: '(?is)\(\s*while\s*\(\s*setq\b.{0,64}\(\s*read-line\b.{0,40}\(\s*write-line\b'

  - id: autolisp-readline-compare-write
    desc: AutoLISP write-line follows a line compare
    if:
      type: text
      regex: '(?is)read-line\b.{0,40}\(\s*=\s+\w+\s+\w+\).{0,64}write-line\b'
