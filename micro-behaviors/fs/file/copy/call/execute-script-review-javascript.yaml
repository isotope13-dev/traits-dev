defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  conf: 0.95
  for: [javascript, xml]

traits:
- id: wsf-fso-variable-copy
  desc: WSF FileSystemObject copies variables
  crit: suspicious
  conf: 0.92
  platforms: [windows]
  for: [xml]
  if:
    type: text
    regex: '(?is)CreateObject.{0,80}FileSystemObject.{0,700}\.CopyFile\s+e\s*,\s*h\s*,\s*True'
