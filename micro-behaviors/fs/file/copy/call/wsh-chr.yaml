defaults:
  platforms: [windows]
  for: [vbs, asp, html]

traits:
  - id: chr-frag-dot-co
    desc: Chr-encoded fragment matching ".Co"
    crit: component
    conf: 0.78
    if:
      type: text
      regex: 'chrw?\(\s*46\s*\)\s*[&+]\s*chrw?\(\s*(67|99)\s*\)\s*[&+]\s*chrw?\(\s*(79|111)\s*\)'
      case_insensitive: true

  - id: chr-frag-pyf-mid
    desc: Chr-encoded fragment matching "pyF"
    crit: component
    conf: 0.78
    if:
      type: text
      regex: 'chrw?\(\s*(80|112)\s*\)\s*[&+]\s*chrw?\(\s*(89|121)\s*\)\s*[&+]\s*chrw?\(\s*(70|102)\s*\)'
      case_insensitive: true

  - id: chr-frag-ile-end
    desc: Chr-encoded fragment matching "ile"
    crit: component
    conf: 0.78
    if:
      type: text
      regex: 'chrw?\(\s*(73|105)\s*\)\s*[&+]\s*chrw?\(\s*(76|108)\s*\)\s*[&+]\s*chrw?\(\s*(69|101)\s*\)'
      case_insensitive: true

composite_rules:
  - id: chr-encoded-fso-copyfile
    desc: Chr-encoded FSO CopyFile call
    crit: notable
    conf: 0.95
    near_bytes: 150
    all:
      - id: chr-frag-dot-co
      - id: chr-frag-pyf-mid
      - id: chr-frag-ile-end
