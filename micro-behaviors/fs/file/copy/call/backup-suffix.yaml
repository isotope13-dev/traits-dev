defaults:
  platforms: [windows]


traits:
  - id: copyfile-backup-suffix
    desc: CopyFile reference with backup suffix
    crit: notable
    conf: 0.9
    for: [c, cpp, vbs, powershell, batch, python, go]
    # Require the Win32 CopyFileA/W spelling so Python shutil.copyfile(...'.backup')
    # (installer rc-file backups) does not match.
    if:
      type: text
      regex: 'CopyFile[AW]\s*\(.{0,80}\.backup'
    unless:
      - id: well-known/app/infrastructure/azure-cli::azure-cli-source-tree
      - id: well-known/app/infrastructure/azure-cli::azure-cli-context
