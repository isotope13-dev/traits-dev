defaults:
  platforms: [unix, windows]
  for: [cfml]
  crit: notable
  conf: 0.88
traits:
  - id: cffile-copy
    desc: ColdFusion copies a file
    if:
      type: symbol
      kind: call
      exact: cffile
      arg:
        index: 0
        from:
          field: action
          whole_value: '(?i)^copy$'
