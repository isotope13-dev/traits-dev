defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [elf, macho, pe, c, cpp]
traits:
  - id: copyfile
    desc: Copy files
    conf: 0.66
    if:
      type: symbol
      regex: "^(copyfile|CopyFile)$"
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: copyfile-a
    desc: Copy files (Windows API ANSI)
    conf: 0.66
    if:
      type: symbol
      exact: CopyFileA
  - id: copyfile-w
    desc: Copy files (Windows API wide)
    conf: 0.66
    if:
      type: symbol
      exact: CopyFileW
    unless:
      - id: well-known/lib/runtime/scripted/electron::electron-enable-logging-env
      - type: metrics
        field: exports.count
        min: 100
      - id: metadata/file/extension/identity::uninstaller-exe-basename
  - id: copyfile-ex-w
    desc: Copy files with progress callback
    conf: 0.72
    platforms: [windows]
    for: [pe, dll]
    if:
      type: symbol
      exact: CopyFileExW
  # VB6 linkers often import MSVBVM60 by ordinal (576 = rtcFileCopy); bind the
  # ordinal to the VB6 runtime so MFC42 and other ordinal tables cannot match.
  - id: vb6-rtcfilecopy
    desc: VB6 runtime file copy
    conf: 0.84
    platforms: [windows]
    for: [pe, dll]
    if:
      type: yara
      source: |
        import "pe"
        rule vb6_rtcfilecopy {
          condition:
            pe.imports("msvbvm60.dll", "rtcFileCopy") or
            pe.imports("msvbvm60.dll", 576)
        }

composite_rules:
  - id: copy
    desc: Copy files
    conf: 0.66
    any:
      - id: copyfile
      - id: copyfile-a
      - id: copyfile-w
      - id: copyfile-ex-w
      - id: vb6-rtcfilecopy
      - id: micro-behaviors/fs/file/copy/command::windows-shell-copy-command
