defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [elf, macho, pe, c, cpp]
traits:
  - id: copyfile
    desc: Copy files
    conf: 0.66
    if:
      type: symbol
      regex: "^(copyfile|CopyFile)$"
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: copyfile-a
    desc: Copy files (Windows API ANSI)
    conf: 0.66
    if:
      type: symbol
      exact: CopyFileA
  - id: copyfile-w
    desc: Copy files (Windows API wide)
    conf: 0.66
    if:
      type: symbol
      exact: CopyFileW
    unless:
      - id: well-known/lib/runtime/scripted/electron::electron-enable-logging-env
      - type: metrics
        field: exports.count
        min: 100
      - id: metadata/binary/installer/script/
      - id: metadata/file/extension/identity::uninstaller-exe-basename
  - id: copyfile-ex-w
    desc: Copy files with progress callback
    conf: 0.72
    platforms: [windows]
    for: [pe, dll]
    if:
      type: symbol
      exact: CopyFileExW
  - id: vb6-rtcfilecopy
    desc: VB6 runtime file copy
    conf: 0.84
    platforms: [windows]
    for: [pe, dll]
    if:
      type: import
      exact: rtcFileCopy

composite_rules:
  - id: copy
    desc: Copy files
    conf: 0.66
    any:
      - id: copyfile
      - id: copyfile-a
      - id: copyfile-w
      - id: copyfile-ex-w
      - id: vb6-rtcfilecopy
      - id: micro-behaviors/fs/file/copy/command::windows-shell-copy-command
