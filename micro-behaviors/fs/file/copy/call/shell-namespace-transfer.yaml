# Shell.Application folder objects copy or move items with CopyHere /
# MoveHere: `sh.Namespace(dest).CopyHere sh.Namespace(src).ParseName(f)`.
defaults:
  crit: notable
  platforms: [windows]
  for: [vbs, javascript, asp, html]

traits:
  - id: shell-namespace-copyhere-movehere
    desc: Copies or moves files via Shell.Application
    conf: 0.9
    if:
      type: text
      regex: '(?i)\.Namespace\s*\([^)\r\n]{1,60}\)\.(CopyHere|MoveHere)\b'
