# The duplicate verb does not identify the receiving application. Finder
# attribution requires the independent tell-target observation.
defaults:
  crit: notable
  platforms: [macos]
  for: [scripts, source, macho]
traits:
  - id: applescript-duplicate-replacing
    desc: AppleScript duplicate allows replacement
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bduplicate\b[^\r\n]{0,80}\bto\b[^\r\n]{0,80}\bwith replacing\b'
