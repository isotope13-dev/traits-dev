defaults:
  platforms: [windows]
  for: [c, cpp, csharp, python]
  crit: notable
  conf: 0.94

traits:
  - id: copyfile-replace-existing
    desc: Copies a file permitting destination replacement
    # Third parameter is bFailIfExists; false permits overwriting. Match
    # the call structure because symbol arg filters cannot test bool values.
    if:
      type: text
      regex: '\bCopyFile[AW]\s*\(\s*[^,;\r\n]{1,160},\s*[^,;\r\n]{1,160},\s*(FALSE|[Ff]alse|0)\s*\)'
