# Scripting.FileSystemObject.CopyFile -- the file-copy method every Windows
# Script Host language (JScript, VBScript, HTA) reaches for. Copying a file is a
# neutral capability: installers, uninstallers and self-copying droppers all do
# it, so the intent lives in the composites that reference these atoms
# (Startup self-copy, UNC-EXE dropper, VBA drop-and-execute) rather than here.
defaults:
  platforms: [windows, unix]
  for: [javascript, vbs, html]
  crit: notable
  conf: 0.85
traits:
  # Case-sensitive on purpose: JScript is case-sensitive, so the FSO method is
  # always PascalCase `CopyFile`. Matching case-insensitively also catches
  # Node's `fs.promises.copyFile` / `fs.copyFileSync`, which are covered by
  # javascript.yaml's fs-copyfile / fs-copyfileSync and are not FSO at all.
  - id: copyfile-method-call
    desc: Calls a method named CopyFile
    if:
      type: symbol
      kind: call
      regex: '(^|\.)CopyFile$'
  # Oversized junk-padded JScript often exhausts the call-fact budget before the
  # clear Startup self-copy runs, so keep a text atom for the same API surface.
  # VBScript calls the method without parentheses (`oFso.CopyFile a, b, True`),
  # so the atom anchors on the member access rather than on a call paren.
  - id: copyfile-member-text
    desc: References a CopyFile member
    conf: 0.84
    if:
      type: text
      regex: '\.CopyFile\b'
    unless:
      - id: copyfile-method-call
      - id: metadata/document/html/
  # Case-insensitive member evidence includes VBScript and Node.js. Only
  # the factory-and-member composite below establishes FileSystemObject.
  - id: copyfile-case-variant-member
    desc: References a case-variant copyFile member
    conf: 0.82
    for: [javascript, vbs, html, text, static-lib]
    if:
      type: text
      regex: '(?i)\.copyfile\b'
    unless:
      - id: metadata/document/html/
      - id: fs-copyfile
composite_rules:
  - id: fso-copyfile
    desc: Copy file via FileSystemObject
    crit: notable
    conf: 0.9
    # A FileSystemObject factory and an unrelated `.copyFile()` method may
    # coexist in one JS file (for example, a Node wrapper that stages a VBS
    # cleanup script). Require the COM identity and the copy call to be local
    # to the same code region before naming this as an FSO capability.
    near_bytes: 2048
    all:
      - id: micro-behaviors/os/com/automation::filesystemobject-progid
    any:
      - id: copyfile-method-call
      - id: copyfile-member-text
      - id: copyfile-case-variant-member
    needs: 1
