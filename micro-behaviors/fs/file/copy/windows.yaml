defaults:
  platforms: [windows]
  for: [scripts]
  crit: notable
  conf: 0.9

traits:
  - id: windows-copy-command
    desc: Uses Windows copy command
    if:
      type: text
      # Require a command-style argument list.  JavaScript object keys such
      # as `copy: "..."` are not Windows copy commands.  The first operand
      # must additionally carry a path/switch/mask character, so ordinary
      # English prose that opens a line with the verb ("copy lacked NFKC
      # normalisation, ...") is not read as a copy command invocation.
      regex: '(?im)^[ \t]*(copy|xcopy|robocopy)[ \t]+[^ \r\n;&|]{0,60}[\\/.*%][^ \r\n;&|]{0,60}[ \t]+\S'
    unless:
      # Dockerfile COPY is an image-build instruction, not cmd.exe file copy.
      - id: metadata/build/docker::embedded-dockerfile-copy-stage

  - id: windows-if-exist-copy-command
    desc: Conditional Windows file copy
    if:
      type: text
      regex: '(?im)^ *if +(not +)?exist +.{1,240} +(copy|xcopy|robocopy) +\S'

  - id: cmd-binary-file-concatenation
    desc: Copy /b joins fragments into executable
    crit: notable
    conf: 0.98
    for: [text, batch, cmd, powershell]
    if:
      type: text
      regex: '(?im)^!?\s*copy[^\r\n]{0,24}/b\s+[^\r\n]{1,200}\+[^\r\n]{1,200}\.exe\b'

  - id: cmd-wildcard-script-concatenation
    desc: Joins wildcard fragments into script
    crit: notable
    conf: 0.97
    for: [batch, powershell]
    if:
      type: text
      regex: '(?im)^\s*copy\s+/b\s+.{0,99}\\\*\.\w{1,8}.{0,99}\.(cmd|bat|ps1|js|vbs)\b'

  - id: cmd-html-wrapper-concatenation
    desc: Wraps data file in HTML fragments
    crit: notable
    conf: 0.98
    for: [batch, powershell]
    if:
      type: text
      regex: '(?im)^\s*copy\s+/b\s+.{0,99}\.html?.{0,99}\+.{0,99}\.xhtml?.{0,99}\.html?\b'

  # /B enables backup mode (SeBackupPrivilege). Legitimate admins use it for
  # locked system files; paired with messaging session paths it is hostile.
  - id: robocopy-backup-mode
    desc: Robocopy backup mode (/B) switch
    crit: notable
    conf: 0.93
    for: [scripts, source, python, batch, cmd]
    if:
      type: text
      regex: '(?i)\brobocopy\b[^\n]{0,200}(\s/B\b|"/B")'
