defaults:
  platforms: [windows]
  for: [scripts]
  crit: notable
  conf: 0.9

traits:
  - id: windows-copy-command
    desc: Uses Windows copy command
    if:
      type: text
      # Require a command-style argument list.  JavaScript object keys such
      # as `copy: "..."` are not Windows copy commands.  The first operand
      # must additionally carry a path/switch/mask character, so ordinary
      # English prose that opens a line with the verb ("copy lacked NFKC
      # normalisation, ...") is not read as a copy command invocation.
      regex: '(?im)^[ \t]*(copy|xcopy|robocopy)[ \t]+[^ \r\n;&|]{0,60}[\\/.*%][^ \r\n;&|]{0,60}[ \t]+\S'
    unless:
      # Dockerfile COPY is an image-build instruction, not cmd.exe file copy.
      - id: metadata/build/docker::embedded-dockerfile-copy-stage

  - id: windows-if-exist-copy-command
    desc: Conditional Windows file copy
    if:
      type: text
      regex: '(?im)^ *if +(not +)?exist +.{1,240} +(copy|xcopy|robocopy) +\S'

  # Copies from a substring-stripped path (`copy %M:TOKEN=% ...`): the source
  # only materializes after cmd removes every TOKEN occurrence, so static
  # readers never see what is staged. Stripping to empty is the tell --
  # substitutions that replace text (`%X:a=b%`) do not match. Rarely
  # legitimate, so suspicious rather than notable.
  - id: batch-copy-stripped-source
    desc: Batch copies from a stripped variable path
    crit: suspicious
    conf: 0.85
    for: [batch]
    if:
      type: text
      regex: '(?im)^[ \t]*(copy|xcopy)[ \t]+[^\r\n]{0,40}%[A-Za-z_]\w*:[A-Za-z0-9_]{3,}=%'

  - id: cmd-binary-file-concatenation
    desc: Copy /b joins fragments into executable
    crit: notable
    conf: 0.98
    for: [text, batch, cmd, powershell]
    if:
      type: text
      regex: '(?im)^!?\s*copy[^\r\n]{0,24}/b\s+[^\r\n]{1,200}\+[^\r\n]{1,200}\.exe\b'

  - id: cmd-wildcard-script-concatenation
    desc: Joins wildcard fragments into script
    crit: notable
    conf: 0.97
    for: [batch, powershell]
    if:
      type: text
      regex: '(?im)^\s*copy\s+/b\s+.{0,99}\\\*\.\w{1,8}.{0,99}\.(cmd|bat|ps1|js|vbs)\b'

  - id: cmd-html-wrapper-concatenation
    desc: Wraps data file in HTML fragments
    crit: notable
    conf: 0.98
    for: [batch, powershell]
    if:
      type: text
      regex: '(?im)^\s*copy\s+/b\s+.{0,99}\.html?.{0,99}\+.{0,99}\.xhtml?.{0,99}\.html?\b'

  # /B enables backup mode (SeBackupPrivilege). Legitimate admins use it for
  # locked system files; paired with messaging session paths it is hostile.
  - id: robocopy-backup-mode
    desc: Robocopy backup mode (/B) switch
    crit: notable
    conf: 0.93
    for: [scripts, source, python, batch, cmd]
    if:
      type: text
      regex: '(?i)\brobocopy\b[^\n]{0,200}(\s/B\b|"/B")'

  - id: esentutl-raw-file-copy
    desc: Esentutl raw file copy
    crit: notable
    conf: 0.96
    for: [scripts, source, binaries]
    if:
      type: text
      # Esentutl is a database utility, but /y is its raw file-copy mode.
      # Require both source and destination operands so prose and bare tool
      # inventories do not read as an executed copy operation.
      regex: '(?i)\besentutl(\.exe)?\s+/y\s+["'']?[^"''\r\n]{1,220}["'']?\s+/d\s+["'']?[^"''\r\n]{1,220}["'']?'

  - id: esentutl-vss-copy
    desc: Esentutl copies via Volume Shadow Copy
    crit: notable
    conf: 0.97
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)\besentutl(\.exe)?\s+/y\s+/vss\b'

  - id: copy-to-windir-percent-var
    desc: Copies percent-var payload into Windows dir
    crit: suspicious
    conf: 0.94
    for: [batch, elixir, text, html]
    if:
      type: text
      regex: '(?i)copy\s+(%[^%\s]{1,40}%){1,4}(\.[A-Za-z0-9]{1,4})?\s+%windir%'

  - id: batch-set-plus-obfuscated-var
    desc: Assigns digit-suffixed camouflage batch vars
    crit: notable
    conf: 0.9
    for: [batch, elixir, text]
    count_min: 4
    if:
      type: text
      regex: '(?im)^set\s+[a-z]{2,6}[0-9]{8,}='
