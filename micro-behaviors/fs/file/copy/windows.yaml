defaults:
  platforms: [windows]
  for: [scripts]
  crit: notable
  conf: 0.9

traits:
  - id: windows-copy-command
    desc: Uses Windows copy command
    if:
      type: text
      # Require a command-style argument list.  JavaScript object keys such
      # as `copy: "..."` are not Windows copy commands.
      regex: '(?i)^[ \t]*(copy|xcopy|robocopy)[ \t]+[^ \t\r\n;&|]{1,200}[ \t]+[^ \r\n;&|]{1,200}'
