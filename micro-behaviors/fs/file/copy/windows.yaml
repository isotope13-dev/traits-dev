defaults:
  platforms: [windows]
  for: [scripts]
  crit: notable
  conf: 0.9

traits:
  - id: windows-copy-command
    desc: Uses Windows copy command
    if:
      type: text
      # Require a command-style argument list.  JavaScript object keys such
      # as `copy: "..."` are not Windows copy commands.  The first operand
      # must additionally carry a path/switch/mask character, so ordinary
      # English prose that opens a line with the verb ("copy lacked NFKC
      # normalisation, ...") is not read as a copy command invocation.
      regex: '(?i)^[ \t]*(copy|xcopy|robocopy)[ \t]+[^ \r\n;&|]{0,60}[\\/.*%][^ \r\n;&|]{0,60}[ \t]+\S'
