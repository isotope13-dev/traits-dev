defaults:
  platforms: [windows]
  for: [scripts]
  crit: notable
  conf: 0.9

traits:
  - id: windows-copy-command
    desc: Uses Windows copy command
    if:
      type: text
      # Include command chains and inline /c command payloads.
      # Require a command-style argument list.  JavaScript object keys such
      # as `copy: "..."` are not Windows copy commands.  The first operand
      # must additionally carry a path/switch/mask character, so ordinary
      # English prose that opens a line with the verb ("copy lacked NFKC
      # normalisation, ...") is not read as a copy command invocation.
      regex: '(?im)(^|[&|]| /c)[ \t]*(copy|xcopy|robocopy) +[^\s;&|]{0,60}[\\/.*%][^\s;&|]{0,60} +\S'
    unless:
      # Dockerfile COPY is an image-build instruction, not cmd.exe file copy.
      - id: metadata/build/docker::embedded-dockerfile-copy-stage

  - id: windows-if-exist-copy-command
    desc: Conditional Windows file copy
    if:
      type: text
      regex: '(?im)^ *if +(not +)?exist +.{1,240} +(copy|xcopy|robocopy) +\S'

  - id: copy-family-y-option
    desc: Copy-family command with a /Y option
    crit: notable
    conf: 0.9
    for: [scripts, batch]
    if:
      type: text
      regex: '(?i)\b(copy|xcopy|robocopy)\s+/y\b'

  # Copies from a substring-stripped path (`copy %M:TOKEN=% ...`): the source
  # only materializes after cmd removes every TOKEN occurrence, so static
  # readers never see what is staged. Stripping to empty is the tell --
  # substitutions that replace text (`%X:a=b%`) do not match. Rarely
  # legitimate, so suspicious rather than notable.
  - id: batch-copy-stripped-source
    desc: Copy source uses substring-removal expansion
    crit: suspicious
    conf: 0.85
    for: [batch]
    if:
      type: text
      regex: '(?im)^[ \t]*(copy|xcopy)[ \t]+[^\r\n]{0,40}%[A-Za-z_]\w*:[A-Za-z0-9_]{3,}=%'

  # /B enables backup mode (SeBackupPrivilege).
  - id: robocopy-backup-mode
    desc: Robocopy backup mode (/B) switch
    crit: notable
    conf: 0.93
    for: [scripts, source, python, batch, cmd]
    if:
      type: text
      regex: '(?i)\brobocopy\b[^\n]{0,200}(\s/B\b|"/B")'

  - id: esentutl-raw-file-copy
    desc: Esentutl raw file copy
    crit: notable
    conf: 0.96
    for: [scripts, source, binaries]
    if:
      type: text
      # Esentutl is a database utility, but /y is its raw file-copy mode.
      # Require both source and destination operands so prose and bare tool
      # inventories do not read as an executed copy operation.
      regex: '(?i)\besentutl(\.exe)?\s+/y\s+["'']?[^"''\r\n]{1,220}["'']?\s+/d\s+["'']?[^"''\r\n]{1,220}["'']?'

  - id: esentutl-vss-copy
    desc: Esentutl copies via Volume Shadow Copy
    crit: notable
    conf: 0.97
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)\besentutl(\.exe)?\s+/y\s+/vss\b'

  - id: copy-to-windir-percent-var
    desc: Copies percent-var payload into Windows dir
    crit: suspicious
    conf: 0.94
    for: [batch, elixir, text, html]
    if:
      type: text
      regex: '(?i)copy\s+(%[^%\s]{1,40}%){1,4}(\.[A-Za-z0-9]{1,4})?\s+%windir%'

  - id: batch-set-plus-obfuscated-var
    desc: Assigns digit-suffixed camouflage batch vars
    crit: notable
    conf: 0.9
    for: [batch, elixir, text]
    count_min: 4
    if:
      type: text
      regex: '(?im)^set\s+[a-z]{2,6}[0-9]{8,}='

composite_rules:
  # Relocated from objectives/.../dropper/execution/windows-loader
  # (self-copy-relaunch-loader, suspicious). Every leg is an ordinary Win32
  # file/process import and nothing binds the copy source to the module path
  # or the spawned image to the copy, so this is the API set a self-copying
  # relauncher needs -- and equally what installers, updaters and .NET
  # Framework tools (WFServicesReg.exe) import. Loader and Elex composites
  # reference it and supply the staging evidence.
  - id: self-copy-relaunch-api-set
    desc: Imports self-copy and relaunch APIs
    conf: 0.94
    for: [pe, dll]
    attack: T1129
    all:
      - id: micro-behaviors/fs/file/copy::copyfile-w
      - id: micro-behaviors/process/create/spawn::create-process-w
      - id: micro-behaviors/fs/path/check::get-module-filename
      - id: micro-behaviors/fs/delete/file/library::deletefile-w
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/file/handle::set-file-pointer
      - id: micro-behaviors/fs/write/file/handle::write-file
      - id: micro-behaviors/time/query::get-tick-count
    unless:
      - id: metadata/lang/compiled::autoit-compiled-script
      - id: well-known/tool/
      - id: well-known/app/system/iobit::iobit-component-context
      # madExcept restart/send-report paths use copy + relaunch primitives.
      - id: well-known/lib/native/madexcept/
