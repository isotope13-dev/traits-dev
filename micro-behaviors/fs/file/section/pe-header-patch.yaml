defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  # Compiled x86 loop: validate the PE signature, walk NumberOfSections to
  # the final IMAGE_SECTION_HEADER, then OR its characteristics with RWX.
  # This is an unusual binary-rewriter primitive, but infection intent comes
  # from the objective that combines it with target discovery and timestomping.
  - id: pe-last-section-rwx-patch
    desc: Makes last PE section RWX
    crit: suspicious
    conf: 0.98
    attack: T1554
    if:
      type: hex
      section: .rsrc
      pattern: >-
        66 81 3F 50 45 [8-64] 0F B7 4F 06 49 83 C3 28 E2 FB
        [8-96] 81 4B 24 00 00 00 E0
