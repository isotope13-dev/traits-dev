    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '81 48 24 00 00 00 E0 8B 85 ?? ?? ?? ?? 66 81 60 5E BF FE 66 83 48 16 01 83 78 74 04 C7 40 58 00 00 00 00 76 ?? C7 80 98 00 00 00 00 00 00 00 C7 80 9C 00 00 00 00 00 00 00'
