# Source-level references to a file extension.  The metadata rule for an
# artifact whose basename already ends in a given suffix is separate; these
# atoms cover code that constructs, stores, or prints an extension — including
# lockers that build a rename target, whose intent comes from the composites in
# objectives/impact/ransom/ rather than from the extension string itself.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, go]

traits:
  - id: native-filename-extension-assignment
    desc: Native source filename extension assignment
    crit: notable
    conf: 0.88
    for: [c, cpp]
    if:
      type: text
      # A typed native string assignment is a filename-extension reference;
      # it is not evidence that the extension denotes encrypted data.
      regex: '(?i)\b(const )?(wchar_t|char)\s*\*?\s*\w+\s*=\s*L?["\x27]\.[A-Za-z][\w-]{1,15}["\x27]'

  - id: locked-extension-reference
    # The matcher only proves a string literal ends in `.locked`; it cannot
    # tell a locker's rename target from Bundler's `gems.locked` lockfile, so
    # the description must not assert "encrypted". The ransomware reading
    # comes from composites that add encrypt-and-rename behavior.
    desc: References .locked filename suffix
    crit: notable
    conf: 0.9
    # Compiled Python has a separate bytecode-string matcher whose boundary
    # requirements differ from parser-extracted source literals.
    for: [scripts, go]
    if:
      # Structured literals exclude comments and property access such as
      # `msg.locked` or the documented `ReadableStream.locked` member.
      type: literal
      regex: '(?i)\.locked$'
