# Source-level references to encrypted-file suffixes.  The metadata rule for
# an artifact whose basename already ends in `.locked` is separate; this atom
# covers lockers that construct or print the suffix before renaming files.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, go]

traits:
  - id: locked-extension-reference
    # The matcher only proves a `.locked` suffix appears as a string literal;
    # it cannot tell a locker's rename target from Bundler's `gems.locked`
    # lockfile, so the description must not assert "encrypted". The ransomware
    # reading comes from the composites in objectives/impact/ransom/ that
    # reference this atom alongside the encrypt-and-rename legs.
    desc: References the .locked file extension
    crit: notable
    conf: 0.9
    if:
      type: text
      # String literals and concatenations (e.g. `+ ".locked"`), not property
      # access such as keyboard-lock state (`msg.locked`) or ReadableStream.locked.
      regex: '(?i)(["\x27`]\.locked|\.locked["\x27`]|\+\s*["\x27`]\.locked|\.locked\s*\+)'
