defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-credential-named-file
    desc: Opens a credential-named file
    conf: 0.9
    if:
      type: tree-sitter
      language: python
      query: |
        (call
          function: (identifier) @fn
          arguments: (argument_list . (_) @path)
          (#eq? @fn "open")
          (#match? @path "(?i)(imap|mail|password)"))
