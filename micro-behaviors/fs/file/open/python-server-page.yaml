defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  - id: python-server-page-open
    desc: Opens a server-executable page file
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: open
      arg:
        index: 0
        from:
          value: '\.(jsp|aspx?|php)$'
