defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-method-open-write-binary
    desc: Calls Python open method with wb argument
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '\.open$'
      arg:
        kind: string
        exact: wb
