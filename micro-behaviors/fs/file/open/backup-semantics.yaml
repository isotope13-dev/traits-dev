# Opening files with Windows backup semantics — used by backup tools and by
# malware that reads locked session/credential files via SeBackupPrivilege.
defaults:
  platforms: [windows]
  for: [scripts, source, pe, dll, c, cpp]
  crit: notable
  attack: T1005

traits:
  - id: file-flag-backup-semantics
    desc: FILE_FLAG_BACKUP_SEMANTICS open flag
    crit: notable
    conf: 0.94
    if:
      type: text
      word: FILE_FLAG_BACKUP_SEMANTICS
