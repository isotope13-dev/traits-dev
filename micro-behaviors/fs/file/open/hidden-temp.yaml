defaults:
  platforms: [unix, windows]
  for: [python, c, cpp, php, ruby, perl, elf, macho, pe]
traits:
  - id: open-hidden-temp-path
    desc: "File-open call names hidden temporary path"
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\b(open|fopen)\s*\(\s*["''](/dev/shm/|/tmp/)\.[a-zA-Z0-9][\w.-]{2,60}\b'
