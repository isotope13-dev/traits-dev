defaults:
  platforms: [windows, unix]
traits:
  - id: python-library-write-open
    desc: Python opens a native library for writing
    for:
      - python
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(open|Path)\s*\([^)\n]{0,240}\.(dll|so|dylib)\b[^)\n]{0,80}["'']w[b]?["'']'
    unless:
      - id: well-known/lib/ai/tvm::tvm-compiler-runtime
      - id: metadata/package/testing/presence/harness::python-test-file
