defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib]
  size_max: 65536

traits:
  - id: dos-int21-open
    desc: DOS opens a file via INT 21h
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B4 3D [0-16] CD 21"
  - id: dos-int21-open-ax
    desc: DOS open via MOV AX
    crit: notable
    conf: 0.84
    if:
      type: hex
      pattern: "B8 ?? 3D [0-16] CD 21"
  - id: dos-int21-open-dta-filename
    for: [dos_com, data, c]
    desc: DOS opens or creates default DTA filename
    crit: notable
    conf: 0.90
    if:
      type: hex
      pattern: "(B8 02 3D [0-4] BA 9E 00|B4 3D [0-4] BA 9E 00|B4 3C [0-4] BA 9E 00|BA 9E 00 [0-4] B8 02 3D|BA 9E 00 [0-4] B4 3D|BA 9E 00 [0-4] B4 3C|EF BF BD 3C [0-4] EF BF BD EF BF BD 00) [0-4] (CD 21|EF BF BD 21)"
  - id: dos-int21-open-update-saved-vector
    for: [dos_com, static-lib, data]
    desc: DOS update-open via a saved handler
    crit: notable
    conf: 0.94
    if:
      type: hex
      pattern: "B4 3D B0 82 [0-16] 9C [0-1] FF 1E ?? ??"
composite_rules:
  - id: dos-int21-open-or-create-call
    for: [dos_com, static-lib, data, c]
    desc: DOS open or create-new service sequence
    crit: notable
    conf: 0.84
    any:
      - id: micro-behaviors/fs/file/open::dos-int21-open
      - id: micro-behaviors/fs/file/open::dos-int21-open-ax
      - id: micro-behaviors/fs/file/open::dos-int21-open-update-saved-vector
      - id: micro-behaviors/fs/file/open::dos-int21-open-dta-filename
      - id: micro-behaviors/fs/file/create::dos-int21-create-new
      - id: micro-behaviors/fs/file/create::dos-int21-create-new-ax
