defaults:
  for: [text, static-lib]
  platforms: [windows]
  crit: notable
  conf: 0.95
traits:
  - id: autolisp-truncate-and-close
    desc: AutoLISP truncates and immediately closes file
    if:
      type: text
      regex: '(?i)\(\s*close\s*\(\s*open\s+\w+\s+"w"\s*\)\s*\)'

  - id: autolisp-append-mode
    desc: AutoLISP opens a file in append mode
    if:
      type: text
      regex: '(?i)\(\s*open\s+[\w]+\s+"a"\s*\)'
