# Opening a descriptor does not establish a read: r+ also permits writes.
# Source calls retain their receiver, e.g. fs.openSync; bare imported calls
# remain supported. This observes the API call, not a successful open.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-open-sync
    desc: Calls a synchronous openSync API
    crit: notable
    conf: 0.7
    unless:
      - id: metadata/build/
    if:
      type: symbol
      kind: call
      regex: '(^|\.)openSync$'
