defaults:
  platforms: [unix, windows]
  for: [go]
traits:
  - id: os-open
    desc: Open file via os.Open
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: os.Open
  - id: os-openfile
    desc: Open file with explicit flags via os.OpenFile
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: os.OpenFile
  - id: os-openfile-append
    desc: os.OpenFile with O_APPEND flag
    crit: baseline
    conf: 0.85
    if:
      type: text
      regex: 'os\.OpenFile\([^)]{0,200}O_APPEND'
  - id: os-openfile-create-flag
    desc: os.OpenFile flags reference O_CREATE
    crit: notable
    conf: 0.9
    if:
      # Inspect the flags argument, independently of nested path calls.
      # The call projection records this bitwise expression as opaque.
      type: tree-sitter
      query: |
        ((call_expression
          function: (selector_expression
            operand: (identifier) @pkg
            field: (field_identifier) @fn)
          arguments: (argument_list . (_) . (_) @flags . (_)))
          (#eq? @pkg "os")
          (#eq? @fn "OpenFile")
          (#match? @flags "\\bos\\.O_CREATE\\b"))
  - id: os-openfile-rdwr
    desc: os.OpenFile with O_RDWR read-write flag
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'os\.OpenFile\(.{0,50}os\.O_RDWR'
