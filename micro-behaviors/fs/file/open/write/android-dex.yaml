defaults:
  platforms: [android]
  for: [dex]
traits:
  - id: dex-file-output-constructor
    desc: DEX constructs file output stream
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/io/FileOutputStream;-><init>'
  - id: dex-file-output-write-call
    desc: DEX writes file output stream
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: 'Ljava/io/FileOutputStream;->write'
