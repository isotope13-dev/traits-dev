# A name in opaque data is an API reference, not a recovered write call.
defaults:
  platforms: [windows, macos, linux]
  for: [data]
  crit: notable
  conf: 0.95
traits:
  - id: node-create-write-stream-api-name
    desc: References Node createWriteStream API name
    if:
      type: text
      substr: createWriteStream
