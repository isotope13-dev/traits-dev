defaults:
  platforms: [windows]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: python-zone-stream-open-write
    desc: Opens a Zone.Identifier stream for writing
    if:
      type: symbol
      kind: call
      exact: open
      args:
        - index: 0
          from:
            value: ':Zone\.Identifier$'
        - index: 1
          kind: string
          exact: w
