# Bind the request-selected source and mode to the same fopen call.
# Opening a writable stream does not establish a write or code execution.
defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
  conf: 0.98
traits:
  - id: php-request-writable-stream
    desc: PHP opens a request-selected writable stream
    if:
      type: tree-sitter
      query: |
        ((function_call_expression
          function: (name) @fn
          arguments: (arguments
            . (argument (subscript_expression (variable_name) @source))
            . (argument [
              (string (string_content) @mode)
              (encapsed_string (string_content) @mode)]))) @call
          (#match? @fn "(?i)^fopen$")
          (#match? @source "^\\$_(GET|POST|REQUEST)$")
          (#match? @mode "^([waxc][bt]?\\+?|[rwaxc]\\+[bt]|r[bt]?\\+)$"))
