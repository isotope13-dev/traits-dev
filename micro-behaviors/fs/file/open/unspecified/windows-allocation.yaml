defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, zig, python]

traits:
  - id: ntcreatefile-explicit-allocation
    desc: NtCreateFile receives an allocation-size pointer
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bNtCreateFile\s*\(\s*&?\w+\s*,[^,;]{1,160},\s*&?\w+\s*,\s*&?\w+\s*,\s*&\w+\s*,'

