defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.95
traits:
  - id: native-file-open-disposition
    desc: Opens Windows file with explicit disposition
    if:
      type: tree-sitter
      kind: call
      regex: '\bCreateFile[AW]?\s*\([^;]{1,300}\b(OPEN_ALWAYS|CREATE_ALWAYS|OPEN_EXISTING)\b'
