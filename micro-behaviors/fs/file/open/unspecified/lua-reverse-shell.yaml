defaults:
  platforms: [unix, windows]
  for: [lua]
traits:
  - id: lua-open-reverse-shell-file-flow
    desc: Opens a reverse-shell-named file in Lua
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: io.open
      arg:
        index: 0
        from:
          value: '(?i)reverse[_. -]?shell'
  - id: lua-open-reverse-shell-file-local
    desc: Lua opens a reverse-shell-named local path
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      language: lua
      query: |
        ((function_declaration body: (block
          (variable_declaration (assignment_statement
            (variable_list . (identifier) @path .)
            (expression_list . (string (string_content) @name) .)))
          (variable_declaration (assignment_statement
            (expression_list (function_call
              name: (dot_index_expression table: (identifier) @lib field: (identifier) @open)
              arguments: (arguments . (identifier) @used)))))))
          (#eq? @path @used) (#eq? @lib "io") (#eq? @open "open")
          (#match? @name "(?i)reverse[_. -]?shell"))
composite_rules:
  - id: lua-open-reverse-shell-file
    desc: Lua opens a reverse-shell-named file
    crit: notable
    conf: 0.98
    any:
      - id: lua-open-reverse-shell-file-flow
      - id: lua-open-reverse-shell-file-local
