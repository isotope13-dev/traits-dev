defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, zig, python]

traits:
  - id: ntcreatefile-execute-access
    desc: NtCreateFile requests executable access
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?s)\bNtCreateFile\s*\([^;]{0,900}\bFILE_EXECUTE\b'

  - id: share-read-only-open-disposition
    desc: Read-only sharing precedes open disposition
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bFILE_SHARE_READ\s*,\s*FILE_OPEN\b'

composite_rules:
  - id: ntcreatefile-executable-share-read-only
    desc: Opens executable content with read-only sharing
    crit: notable
    conf: 0.96
    near_lines: 24
    all:
      - id: ntcreatefile-execute-access
      - id: share-read-only-open-disposition
