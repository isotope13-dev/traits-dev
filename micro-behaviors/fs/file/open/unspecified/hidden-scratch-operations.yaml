defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
  - python
  - javascript
  - elf
traits:
- id: hidden-scratch-open-text-5
  desc: Open text names hidden /var/tmp or /dev
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (open|fopen)[^\n]{0,60}(/var/tmp/|/dev/)\.[a-zA-Z0-9][\w.-]{2,60}\b
- id: hidden-scratch-open-text-6
  desc: Open text names hidden /run or /mnt
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (open|fopen)[^\n]{0,60}(/run/|/mnt/)\.[a-zA-Z0-9][\w.-]{2,60}\b
