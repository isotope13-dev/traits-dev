defaults:
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
- for:
  - dos_com
  - static-lib
  id: dos-open-al-update
  desc: DOS read-write open-service load and interrupt
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: B4 3D B0 02 [0-2] CD
- for:
  - dos_com
  - static-lib
  - data
  id: dos-open-update-e8
  desc: DOS read-write open-service setup before call
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: B8 02 3D [0-6] E8
- for:
  - dos_com
  - static-lib
  - data
  id: dos-open-update-inc-ax
  desc: Incremented AX read-write open setup bytes
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: B8 FF 3C 40 40 40
- for:
  - dos_com
  - static-lib
  id: dos-open-update-int
  desc: DOS read-write open-service load and interrupt
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: B8 02 3D [0-6] CD
- for:
  - dos_com
  - static-lib
  id: dos-open-update-near
  desc: DOS read-write open-service setup before call
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: B8 02 3D 9C 0E E8
- for:
  - dos_com
  - static-lib
  - data
  id: dos-open-update-far
  desc: DOS opens for update through a vector
  crit: notable
  conf: 0.9
  if:
    type: hex
    pattern: B8 02 3D 9C 2E FF 1E
composite_rules:
- for:
  - dos_com
  - static-lib
  id: dos-open-update-dispatch
  desc: DOS read-write open-service setup bytes
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/fs/file/open::dos-open-update-int
  - id: micro-behaviors/fs/file/open::dos-open-update-inc-ax
  - id: micro-behaviors/fs/file/open::dos-open-al-update
  - id: micro-behaviors/fs/file/open::dos-open-update-far
  - id: micro-behaviors/fs/file/open::dos-open-update-near
  - id: micro-behaviors/fs/file/open::dos-open-update-e8
