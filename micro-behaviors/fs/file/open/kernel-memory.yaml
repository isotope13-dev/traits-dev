defaults:
  platforms: [unix]
  for: [c, cpp]

traits:
  - id: c-kernel-memory-device-open
    desc: C opens the kernel memory device
    crit: suspicious
    conf: 0.94
    if:
      type: text
      substr: open("/dev/kmem"
    unless:
    - id: well-known/tool/offensive/nmap::nmap-source-tree
    - id: well-known/tool/reverse-engineering/crash-utility::crash-utility-source
    - type: basename
      regex: ^loadav\.c$
