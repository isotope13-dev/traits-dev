# Direct syscall instructions expose the same neutral capabilities as imports.
# Presence does not establish execution or malicious intent.
defaults:
  platforms: [linux]
  for: [elf]
  crit: baseline
  conf: 0.9
traits:
  - id: open-syscall
    desc: Opens a file via a Linux syscall
    if:
      type: syscall
      name: [open, openat, openat2, creat]

  - id: open-read-write-syscall
    desc: Opens a file read-write via direct syscall
    crit: notable
    if:
      type: syscall
      name: [open]
      args:
        - index: 1
          mask: 2

  - id: openat-read-write-syscall
    desc: Opens file read-write via openat syscall
    crit: notable
    if:
      type: syscall
      name: [openat]
      args:
        - index: 2
          mask: 2
