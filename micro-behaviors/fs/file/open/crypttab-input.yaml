defaults:
  crit: notable
  conf: 0.95
  for:
  - shell
  platforms:
  - linux
traits:
- id: shell-crypttab-input-redirect
  desc: Shell opens crypttab as input
  if:
    type: tree-sitter
    language: shell
    query: "((file_redirect \"<\" destination: [(word) (string) (raw_string)] @target)\n\
      \  (#match? @target \"^[\\\"']?/etc/crypttab[\\\"']?$\"))"
