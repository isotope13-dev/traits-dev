defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
  crit: notable
  conf: 0.95

traits:
  - id: applescript-open-write-permission
    desc: AppleScript opens a file with write permission
    if:
      type: text
      regex: '(?m)(^|["(])[ \t]*open for access [a-z_]\w* with write permission\b'
      case_insensitive: true
