defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-opens-named-path
    desc: Python opens a path variable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(builtins\.|io\.)?open$'
      arg:
        index: 0
        kind: identifier

composite_rules:
  - id: python-opens-path-near-filename-join
    desc: Python opens path near filename join
    conf: 0.9
    all:
      - id: micro-behaviors/fs/path/construct::python-joins-named-filename
      - id: python-opens-named-path
    near_lines: 8
