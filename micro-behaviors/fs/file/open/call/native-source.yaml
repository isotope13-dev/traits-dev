defaults:
  platforms: [unix]
  for: [c, cpp, rust]
  crit: component
  conf: 0.92

traits:
  - id: native-open-file-call
    crit: notable
    desc: Calls open or sys_open
    if:
      type: symbol
      kind: call
      regex: '^(open|sys_open)$'
      # open(2) takes a path; a bare `open();` is a class's own method.
      arg: {index: 0}
