defaults:
  platforms: [windows, unix]
  for:
    - python
    - pyc
traits:
  - id: dotenv-path
    desc: Python opens a dotenv file
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '\bopen\s*\(\s*["'']([^"''\n]{1,100}[/\\])?\.env["'']'

  - id: generic-dup
    desc: Calls Python open() on a file
    crit: baseline
    conf: 0.9
    unless:
      - id: metadata/build/toolchain::xcode-platform-args-build-context
    if:
      type: text
      regex: \bopen\(
  - id: binary-read-mode
    desc: File opened for binary read
    crit: baseline
    conf: 0.82
    if:
      type: text
      regex: '\bopen\([^(\n]{0,120}["'']rb["'']'
  - id: binary-rw
    desc: Python opens a binary stream for read/write
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: open\([^)]{0,120}['"]r\+b['"]
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: binary-write-mode
    desc: Opens a file in binary write mode
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: '\bopen\([^(\n]{0,120}["'']wb["'']'
  # Covers text and binary modes alike (`w`, `a`, `x`, and their `b`/`t`/`+`
  # suffixes); the narrower `binary-write-mode` above matches only `wb`.
  - id: python-open-key-write
    desc: Python opens literal .key for writing
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '\bopen\s*\(\s*["''][^"''\\\n]{1,200}\.key["'']\s*,\s*["'']([wax][bt+]*|r[bt]?\+)["'']'
  - id: cookiejar-exclusion
    desc: Exclude standard cookiejar implementation
    crit: baseline
    if:
      type: text
      substr: cookiejar
  - id: python-open-hardcoded-tmp-path
    desc: Opens a hard-coded /tmp path
    for: [python]
    crit: notable
    conf: 0.9
    if:
      # Path construction alone does not open a file.
      type: symbol
      kind: call
      exact: open
      arg:
        index: 0
        kind: string
        substr: /tmp/
