defaults:
  platforms: [windows, unix]
  for:
    - python
    - pyc
traits:
  - id: generic-dup
    desc: Calls Python open() on a file
    crit: baseline
    conf: 0.9
    unless:
      - id: metadata/build/toolchain::xcode-platform-args-build-context
    if:
      type: text
      regex: \bopen\(
  - id: binary-read-mode
    desc: File opened for binary read
    crit: baseline
    conf: 0.82
    if:
      type: text
      regex: '\bopen\([^(\n]{0,120}["'']rb["'']'
  - id: binary-rw
    desc: Python opens a binary stream for read/write
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: open\([^)]{0,120}['"]r\+b['"]
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
  - id: binary-write-mode
    desc: Opens a file in binary write mode
    crit: baseline
    conf: 0.8
    if:
      type: text
      regex: '\bopen\([^(\n]{0,120}["'']wb["'']'
  # Covers text and binary modes alike (`w`, `a`, `x`, and their `b`/`t`/`+`
  # suffixes); the narrower `binary-write-mode` above matches only `wb`.
  - id: write-append-create-mode
    desc: Python file opened for write or append
    crit: notable
    conf: 0.85
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '^open\s*\(\s*[^,\n]{1,200},\s*["''][wax][bt+]*["'']'
    unless:
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/toolchain::xcode-platform-args-build-context
      - id: well-known/app/system/archlinux-kernel::versioned-lts-update-helper
  - id: python-open-key-write
    desc: Python opens literal .key for writing
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: tree-sitter
      kind: call
      regex: '\bopen\s*\(\s*["''][^"''\\\n]{1,200}\.key["'']\s*,\s*["'']([wax][bt+]*|r[bt]?\+)["'']'
  - id: key4-db-path
    desc: Firefox key database
    crit: baseline
    conf: 0.7
    if:
      type: text
      substr: key4.db
  - id: wallet-dat-path
    desc: Bitcoin wallet.dat file
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: wallet.dat
  - id: cookiejar-exclusion
    desc: Exclude standard cookiejar implementation
    crit: baseline
    if:
      type: text
      substr: cookiejar
