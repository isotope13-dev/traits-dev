defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
  - python
  - javascript
  - elf
traits:
- id: hidden-scratch-open-text-5
  desc: Open text names hidden /var/tmp or /dev
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (open|fopen)[^\n]{0,60}(/var/tmp/|/dev/)\.[a-zA-Z0-9][\w.-]{2,60}\b
  not:
    - substr: statSync("/run/.containerenv
    - regex: /(tmp|var/tmp|run|dev/shm)/\.(netdata|X11|ICE|Test|cache|gnupg|config)[a-zA-Z0-9._-]*
    - regex: mktemp\s+-d\s+/(tmp|var/tmp|run|dev/shm)/\.[A-Za-z0-9][A-Za-z0-9._-]{1,64}\.X{3,}
    - regex: /(tmp|var/tmp|run|dev/shm)/\.spinner\.pid\b
    - regex: /tmp/\.[A-Za-z0-9._-]*(check|probe|test)[A-Za-z0-9._-]*
- id: hidden-scratch-open-text-6
  desc: Open text names hidden /run or /mnt
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: (open|fopen)[^\n]{0,60}(/run/|/mnt/)\.[a-zA-Z0-9][\w.-]{2,60}\b
  not:
    - substr: statSync("/run/.containerenv
    - regex: /(tmp|var/tmp|run|dev/shm)/\.(netdata|X11|ICE|Test|cache|gnupg|config)[a-zA-Z0-9._-]*
    - regex: mktemp\s+-d\s+/(tmp|var/tmp|run|dev/shm)/\.[A-Za-z0-9][A-Za-z0-9._-]{1,64}\.X{3,}
    - regex: /(tmp|var/tmp|run|dev/shm)/\.spinner\.pid\b
    - regex: /tmp/\.[A-Za-z0-9._-]*(check|probe|test)[A-Za-z0-9._-]*
