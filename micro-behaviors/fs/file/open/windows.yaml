defaults:
  for:
  - pe
  - dll
  - c
  - cpp
  platforms:
  - windows
traits:
- id: file-create-win
  desc: Windows file creation/open API
  crit: baseline
  conf: 0.9
  if:
    type: symbol
    regex: ^_?CreateFile[AW](@\d+)?$
- id: pywin32-create-file
  desc: Python opens Windows file or device handle
  crit: baseline
  conf: 0.9
  for:
  - python
  if:
    type: symbol
    kind: call
    exact: win32file.CreateFile
- id: createfile-api
  desc: CreateFile API string reference
  crit: baseline
  conf: 0.9
  if:
    type: text
    regex: \bCreateFile
  downgrade:
    any:
    - id: metadata/lang/compiled/
  unless:
  - id: well-known/app
  - id: well-known/lib
  - id: well-known/tool
- id: createfile-api-text-reference
  desc: CreateFile API name in PE text
  crit: baseline
  conf: 0.9
  for:
  - pe
  - dll
  if:
    type: text
    regex: \bCreateFile(A|W)?\b
  unless:
  - id: file-create-win
- id: createfile-a-container-string
  desc: CreateFileA API name in opaque content
  crit: notable
  conf: 0.96
  for:
  - data
  if:
    type: text
    exact: CreateFileA
- id: dotnet-file-open
  desc: Opens a file stream via .NET File::Open
  crit: notable
  conf: 0.9
  for:
  - powershell
  - csharp
  if:
    type: text
    regex: (?i)File\s*::\s*Open\s*\(|\[System\.IO\.File\]::Open\s*\(
- id: nt-create-file
  desc: NtCreateFile API reference
  crit: notable
  conf: 0.93
  if:
    type: symbol
    exact: NtCreateFile
- id: legacy-lopen
  desc: Legacy file open API
  crit: baseline
  conf: 0.88
  ref: sha256:68fa7c436e293739e98bb04034db6d6a3e40a9b9991de5d147368fb696044499
  if:
    type: symbol
    exact: _lopen
- id: legacy-lcreat
  desc: Legacy file create API
  crit: baseline
  conf: 0.88
  ref: sha256:68fa7c436e293739e98bb04034db6d6a3e40a9b9991de5d147368fb696044499
  if:
    type: symbol
    exact: _lcreat
