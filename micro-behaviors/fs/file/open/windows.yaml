defaults:
  for:
    - pe
    - dll
    - c
    - cpp
  platforms:
    - windows
traits:
  - id: file-create-win
    desc: Windows file creation/open API
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      regex: ^_?CreateFile[AW](@\d+)?$
  - id: pywin32-create-file
    desc: Python opens Windows file or device handle
    crit: baseline
    conf: 0.9
    for: [python]
    if:
      type: symbol
      kind: call
      exact: win32file.CreateFile
  - id: createfile-api
    desc: CreateFile API string reference
    crit: baseline
    conf: 0.9
    if:
      type: text
      regex: \bCreateFile
    downgrade:
      # Go's os package statically imports CreateFileW for every Windows build.
      any:
        - id: metadata/lang/compiled/
    unless:
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/
  - id: createfile-api-text-reference
    desc: CreateFile API name in PE text
    crit: component
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      word: CreateFileA
    unless:
      - type: symbol
        regex: '^_?CreateFileA(@\\d+)?$'
  # Relocated from metadata/file/format/iso::iso-createfilea (2026-08). Same
  # observation as the atom above, for carriers cleave cannot descend; under
  # the old path a bare CreateFileA run was reported as an ISO-format fact on
  # ordinary PEs. The two `for:` lists are disjoint, so only one can fire.
  - id: createfile-a-container-string
    desc: CreateFileA API name in opaque content
    crit: notable
    conf: 0.96
    for: [archive, data]
    if:
      type: text
      exact: CreateFileA
  # Relocated from objectives/impact/wipe/disk/raw/windows-script (2026-08).
  # The matcher only sees the .NET file-open call; nothing in it names a raw
  # drive. Opening a stream with explicit share/access modes is what any
  # PowerShell that hashes, tails, or copies a locked file does, so the
  # PhysicalDrive intent has to come from the drive-path leg of the wiper
  # composite that references this atom.
  - id: dotnet-file-open
    desc: Opens a file stream via .NET File::Open
    crit: notable
    conf: 0.9
    for: [powershell, csharp]
    if:
      type: text
      regex: '(?i)File\s*::\s*Open\s*\(|\[System\.IO\.File\]::Open\s*\('
  - id: nt-create-file
    desc: NtCreateFile API import
    crit: notable
    conf: 0.93
    if:
      type: symbol
      exact: NtCreateFile
  - id: legacy-lopen
    desc: Legacy file open API
    crit: baseline
    conf: 0.88
    ref: sha256:68fa7c436e293739e98bb04034db6d6a3e40a9b9991de5d147368fb696044499
    if:
      type: symbol
      exact: _lopen
  - id: legacy-lcreat
    desc: Legacy file create API
    crit: baseline
    conf: 0.88
    ref: sha256:68fa7c436e293739e98bb04034db6d6a3e40a9b9991de5d147368fb696044499
    if:
      type: symbol
      exact: _lcreat
