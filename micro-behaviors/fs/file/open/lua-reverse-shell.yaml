defaults:
  platforms: [unix, windows]
  for: [lua]
traits:
  - id: lua-open-reverse-shell-file
    desc: Opens a reverse-shell-named file in Lua
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: io.open
      arg:
        index: 0
        from:
          value: '(?i)reverse[_. -]?shell'
