defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: powershell-io-filestream-constructor
    desc: Constructs a PowerShell IO.FileStream
    crit: notable
    conf: 0.92
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: text
      regex: '(?i)New-Object\s+IO\.FileStream\s*\('

