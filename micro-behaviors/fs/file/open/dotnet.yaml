defaults:
  platforms: [ios, unix, windows]
  for: [csharp, pe, dll]

traits:
  - id: powershell-file-openread
    desc: PowerShell calls .NET File.OpenRead
    crit: notable
    conf: 0.98
    for: [powershell]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)\[(system\.)?io\.file\]::OpenRead\s*\('

  - id: dotnet-file-openread-call
    desc: .NET opens a file for reading
    crit: notable
    conf: 0.92
    for: [csharp]
    if:
      type: symbol
      kind: call
      exact: File.OpenRead
