defaults:
  for: [elf]
  platforms: [linux]
  arch: [x86-64]
traits:
  - id: x64-syscall-open-create-0777-arguments
    desc: x64 syscall open/create 0777 arguments
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # syscall(SYS_open, path, O_WRONLY|O_CREAT|O_TRUNC, 0777).
      # This is argument setup; the caller must establish syscall dispatch.
      pattern: 'B9 FF 01 00 00 [0-12] BA 41 02 00 00 [0-12] BF 02 00 00 00 [0-8] E8 ?? ?? ?? ??'
