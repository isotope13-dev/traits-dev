defaults:
  for: [elf]
  platforms: [linux]
  arch: [x86]
  crit: notable

traits:
  - id: native-open-create-mode-0777-x86
    desc: x86 open/create arguments with mode 0777
    conf: 0.98
    if:
      type: hex
      section: .text
      # cdecl open(path, O_WRONLY|O_CREAT|O_TRUNC, 0777).
      # Require the three-argument open(2) forwarding wrapper as context.
      pattern: "83 EC 0C FF 74 24 18 FF 74 24 18 FF 74 24 18 6A 05 E8 ?? ?? ?? ?? 83 C4 1C C3 [0-512] 68 FF 01 00 00 68 41 02 00 00 68 ?? ?? ?? ?? E8 ?? ?? ?? ??"
