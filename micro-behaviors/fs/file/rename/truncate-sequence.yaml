defaults:
  platforms: [unix, windows]
  for: [macho, elf, pe]

traits:
  - id: rust-truncate-then-rename
    desc: Truncating file open precedes rename call
    crit: notable
    conf: 0.9
    if:
      type: raw
      regex: '(?s)\.truncate\(true\).{0,900}\brename\('

  - id: rust-source-truncate-then-rename
    desc: Rust truncation precedes file rename syntax
    for: [rust]
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?s)\.truncate\(true\).{0,900}\brename\('
