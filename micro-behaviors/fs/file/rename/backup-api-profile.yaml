composite_rules:
- for:
  - pe
  - dll
  platforms:
  - windows
  id: backup-temp-executable-rename-delete-api-profile
  desc: Backup/temp names with rename and delete APIs
  crit: notable
  conf: 0.92
  unless:
  - id: metadata/binary/installer/family/
  all:
  - id: micro-behaviors/fs/path/extension::bak-extension-reference
  - id: micro-behaviors/fs/path/temp::tmp-extension-reference
  - id: micro-behaviors/fs/delete/file/library::delete-win
  - id: micro-behaviors/fs/file/rename::any-rename
  any:
  - id: micro-behaviors/fs/path/extension::exe-name-or-extension
  - id: micro-behaviors/fs/path/extension::windows-exe-path-reference-binary
