defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  - id: go-x86-file-rename-info-call-setup
    desc: Go x86 FileRenameInfo-shaped call setup
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: .text
      # Handle, information class 3, buffer and length, then a direct call.
      # The consuming profile separately requires the setter API reference.
      pattern: '89 0C 24 C7 44 24 04 03 00 00 00 89 5C 24 08 89 44 24 0C E8 ?? ?? ?? ??'
