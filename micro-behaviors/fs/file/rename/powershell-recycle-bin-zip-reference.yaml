---
traits:
- platforms:
  - windows
  for:
  - powershell
  - scripts
  - binaries
  id: powershell-recycle-bin-rename-zip-clues
  desc: PowerShell Recycle Bin and ZIP rename text
  crit: suspicious
  conf: 0.9
  if:
    type: text
    regex: "(?is)\\$RECYCLE\\.BIN.{0,160}Rename-Item.{0,160}\\.zip"
