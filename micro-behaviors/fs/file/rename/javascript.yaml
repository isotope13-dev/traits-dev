defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: baseline
  conf: 0.85
traits:
- id: fs-rename-sync
  desc: fs.renameSync file movement
  if:
    type: text
    regex: '\bfs[\w$]{0,3}\.renameSync\s*\('
- id: fs-rename
  desc: fs.rename file movement
  if:
    type: text
    regex: '\bfs[\w$]{0,3}\.rename\s*\(\s*[^)\s]'
- id: fs-promises-rename
  desc: fs.promises.rename file movement
  if:
    type: text
    regex: '\bfs[\w$]{0,3}\.promises\.rename\s*\('
- id: rename-target-exe-js--rx-1
  desc: Regex component marker
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\.(rename(Sync)?|move)\s*\([^)\n]{0,160}["'']?\.(exe|dll)["'']?\s*\)'
- id: rename-target-exe-js--rx-2
  desc: Regex component marker
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\.(rename(Sync)?|move)\s*\([^)\n]{0,160}["'']?\.(scr|com)["'']?\s*\)'
- id: rename-target-exe-js--rx-3
  desc: Regex component marker
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: '\.(rename(Sync)?|move)\s*\([^)\n]{0,160}["'']?\.(cpl|pif)["'']?\s*\)'
# Atomic install: write to a temp path, then rename that temp path into its
# final name. The written file is kept; any delete nearby is failure cleanup
# of the temp file, not removal of something that ran.
- id: node-temp-write-then-rename
  desc: Node renames written temp file into place
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: 'writeFile(Sync)?\(\s*(tmp|temp)\w*[\s\S]{0,240}rename(Sync)?\(\s*(tmp|temp)\w*\s*,'
composite_rules:
- id: rename-target-exe-js
  desc: Rename target with .exe extension
  crit: notable
  conf: 0.92
  any:
  - id: rename-target-exe-js--rx-1
  - id: rename-target-exe-js--rx-2
  - id: rename-target-exe-js--rx-3
