defaults:
  platforms:
  - windows
  - unix
  for:
  - rust
  crit: notable
traits:
- id: rust-fs-rename
  desc: Renames a path with Rust fs::rename
  conf: 0.86
  if:
    type: text
    substr: fs::rename(
- id: current-exe-swap-rename
  desc: Renames current executable path
  conf: 0.92
  if:
    type: text
    regex: fs::rename\(&((current_exe,\s*&\w+)|(\w+,\s*&current_exe))
  unless:
  - type: text
    substr: skip_replace_binary
  - id: metadata/package/testing/
  - type: text
    substr: SelfUpdateError
  - type: text
    substr: max_download_size
  - id: metadata/path::test-directory-component
