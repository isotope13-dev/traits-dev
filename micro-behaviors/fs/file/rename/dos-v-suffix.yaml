# Copy a pathname with LODSB/STOSB until NUL, force the byte before that
# NUL to 'V', then rename (AH=56h). Companion infectors use this so the
# host keeps its bytes under a new suffix and the original name is free.
defaults:
  for:
  - dos_com
  - data
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
  # Immediate form stores 56h, then loads AH=56h for the rename. The AH
  # form loads the rename service first and writes that same AH into the
  # byte before NUL, so both encodings force a trailing 'V'.
  - id: dos-lodsb-v-suffix-rename
    desc: Renames by forcing a V suffix
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule dos_lodsb_v_suffix_rename {
          meta:
            filetypes = "dos_com,data"
          strings:
            $imm = { AC AA 0A C0 75 ?? 26 C6 45 FE 56 B4 56 [0-6] CD 21 }
            $ah = { AC AA 0A C0 75 ?? B4 56 26 88 65 FE [0-6] CD 21 }
          condition:
            $imm or $ah
        }
