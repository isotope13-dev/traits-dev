# Copy a pathname with LODSB/STOSB until NUL, force the byte before that
# NUL to 'V', then rename (AH=56h). Companion infectors use this so the
# host keeps its bytes under a new suffix and the original name is free.
defaults:
  for:
  - dos_com
  - data
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
  - id: dos-lodsb-v-suffix-rename
    desc: Renames by forcing a V suffix
    crit: notable
    conf: 0.95
    if:
      type: hex
      pattern: "AC AA 0A C0 75 ?? 26 C6 45 FE 56 B4 56 [0-6] CD 21"
