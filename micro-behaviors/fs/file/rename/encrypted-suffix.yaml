defaults:
  platforms: [windows, unix]
  for: [source, scripts]

traits:
  - id: encrypted-suffix-target
    desc: File rename uses distinctive encrypted suffix
    crit: notable
    conf: 0.94
    if:
      type: text
      case_insensitive: true
      regex: '\b(rename\w*|replace|move\w*)\s*\([^;\n(]{0,160}["''`]\.(encrypted|locked|crypt|encrt)["''`]'

  - id: encrypted-suffix-variable-append
    desc: Appends encrypted suffix variable
    crit: component
    conf: 0.9
    if:
      type: text
      case_insensitive: true
      regex: '\+\s*encrypted_?(suffix|extension)\b'

composite_rules:
  - id: encrypted-suffix-variable-target
    desc: File rename appends encrypted suffix variable
    crit: notable
    conf: 0.94
    all:
      - id: encrypted-suffix-variable-append
    any:
      - id: micro-behaviors/fs/file/rename::os-rename
      - id: micro-behaviors/fs/file/rename::os-replace
      - id: micro-behaviors/fs/file/rename::shutil-move
      - id: micro-behaviors/fs/file/rename::fs-rename-sync
      - id: micro-behaviors/fs/file/rename::fs-rename
      - id: micro-behaviors/fs/file/rename::fs-promises-rename
      - id: micro-behaviors/fs/file/rename::rust-fs-rename
      - id: micro-behaviors/fs/file/rename::rename-base
    near_lines: 2
