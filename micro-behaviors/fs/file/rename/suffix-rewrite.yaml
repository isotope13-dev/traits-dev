# A co-occurrence profile does not prove a renamed file is executed.
defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - typescript
composite_rules:
- id: rename-with-executable-suffix-rewrite
  desc: Rename API and executable suffix rewriting co-occur
  crit: notable
  conf: 0.97
  all:
  - id: script-file-rename-api
  any:
  - id: micro-behaviors/data/string/replace::suffix-slice-and-append
  - id: micro-behaviors/data/string/replace::suffix-literal-replace
  unless:
  - id: metadata/file/extension/identity::jsonl-data-file
- id: script-file-rename-api
  desc: Python or Node.js file rename API
  crit: notable
  conf: 0.95
  any:
  - id: os-rename
  - id: os-replace
  - id: shutil-move
  - id: fs-rename-sync
  - id: fs-rename
  - id: fs-promises-rename
