# Ruby rename calls with executable destination arguments. The first rule
# also requires an image-suffixed source argument in the same call.
defaults:
  for: [ruby]
  platforms: [unix, windows]

traits:
  - id: ruby-rename-image-to-executable
    desc: Renames image path to executable suffix
    crit: suspicious
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: rename
      args:
        - {kind: string, regex: '\.(png|jpe?g|gif|bmp)$'}
        - {kind: string, regex: '\.(exe|com|bat|cmd)$'}

  - id: ruby-rename-executable-argument
    desc: Ruby rename call has .exe argument
    crit: suspicious
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: rename
      arg:
        kind: string
        regex: '\.exe[''"]?$'
