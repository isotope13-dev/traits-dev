defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
- id: dos-rename-host-build-batch-wrapper
  desc: Renames host and builds its Batch wrapper
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule dos_rename_host_build_batch_wrapper {\n meta:\n filetypes = \"com,dos\"\n strings:\n\n$names = { BE ?? ?? BF ?? ?? B9 0C 00 F3 A4\
      \ BE ?? ?? BF ?? ?? B9 0C 00 F3 A4 FC BF ?? ?? B0 2E B9 09 00 F2 AE 51 [0-16] BE ?? ?? B9 03 00 F3 A4 59 BE\
      \ ?? ?? F3 A4 }\n$save = { BE ?? ?? BF ?? ?? B9 0C 00 F3 A4 BF ?? ?? B0 2E B9 09 00 F2 AE 51 BE ?? ?? B9 03\
      \ 00 F3 A4 59 BE ?? ?? F3 A4 }\n$ext = { BE ?? ?? B9 03 00 F3 A4 59 BE ?? ?? F3 A4 }\n$writer = { BA ?? ??\
      \ BF ?? ?? B4 56 CD 21 BA ?? ?? (33|31) C9 B4 3C CD 21 8B D8 B9 ?? ?? BA ?? ?? B4 40 CD 21 B4 3E CD 21 B4\
      \ 4F (EB ??|E9 ?? ??) }\n$dta = { B4 1A 8D 16 ?? ?? CD 21 B4 4E 8D 16 ?? ?? CD 21 72 ?? }\n$firstcall = /@ECHO\
      \ OFF\\r\\n[A-Za-z0-9_.~\\-]{1,60}\\r\\nRENAME / nocase\n$hostline = /\\r\\n[ \\x00]{1,80}\\r\\nRENAME / nocase\n\
      $patch = { BE ?? ?? BF ?? ?? B9 0C 00 F3 A4 }\n$template = /@ECHO OFF\\r\\n[A-Za-z0-9_.~\\-]{1,60}\\r\\nRENAME\
      \ [ \\x00]{31,160}\\r\\n[ \\x00]{1,80}\\r\\nRENAME [ \\x00]{31,160}\\r\\n[A-Za-z0-9_.~\\-]{1,60}\\r\\n\\x1a/\
      \ nocase\n\n condition:\n#names > 0 and #names <= 32 and #save > 0 and #save <= 32 and #ext <= 64 and #writer\
      \ > 0 and #writer <= 32 and #patch <= 64 and #template > 0 and #template <= 16 and #dta > 0 and #dta <= 32\
      \ and #firstcall <= 16 and #hostline <= 16 and\nfor any a in (1..#names) : (\n uint16(@names[a]+4) == uint16(@names[a]+12)\
      \ and uint16(@names[a]+15) == uint16(@names[a]+24) and\n for any b in (1..#save) : (\n  @save[b] >= @names[a]+!names[a]\
      \ and @save[b]-@names[a] < 512 and\n  uint16(@save[b]+1) == uint16(@names[a]+4) and uint16(@save[b]+4) ==\
      \ uint16(@save[b]+12) and\n  for any e in (1..#ext) : (\n   @ext[e]+!ext[e] == @names[a]+!names[a] and\n \
      \  uint16(@ext[e]+1) >= 256 and uint16(@ext[e]+1)-256+3 <= filesize and\n   (uint8(uint16(@ext[e]+1)-256)|32)\
      \ == 98 and (uint8(uint16(@ext[e]+1)-255)|32) == 97 and (uint8(uint16(@ext[e]+1)-254)|32) == 116 and\n   for\
      \ any w in (1..#writer) : (\n    @writer[w] > @save[b]+!save[b] and @writer[w]-@save[b] < 512 and\n    uint16(@writer[w]+1)\
      \ == uint16(@names[a]+4) and uint16(@writer[w]+4) == uint16(@save[b]+4) and uint16(@writer[w]+11) == uint16(@names[a]+15)\
      \ and\n    for any t in (1..#template) : (\n     @template[t]+256 == uint16(@writer[w]+25) and !template[t]\
      \ == uint16(@writer[w]+22) and\n     for any dt in (1..#dta) : (\n      uint16(@dta[dt]+4)+30 == uint16(@names[a]+1)\
      \ and @dta[dt] < @names[a] and\n      uint16(@dta[dt]+12) >= 256 and uint16(@dta[dt]+12)-256+6 <= filesize\
      \ and\n      uint8(uint16(@dta[dt]+12)-256) == 42 and uint8(uint16(@dta[dt]+12)-255) == 46 and\n      (uint8(uint16(@dta[dt]+12)-254)|32)\
      \ == 101 and (uint8(uint16(@dta[dt]+12)-253)|32) == 120 and (uint8(uint16(@dta[dt]+12)-252)|32) == 101 and\
      \ uint8(uint16(@dta[dt]+12)-251) == 0 and\n      for any fc in (1..#firstcall) : (\n       @firstcall[fc]\
      \ == @template[t] and\n       for any hl in (1..#hostline) : (\n        @hostline[hl] > @firstcall[fc]+!firstcall[fc]\
      \ and @hostline[hl]+!hostline[hl] < @template[t]+!template[t] and\n        for all role in (0..4) : (\n  \
      \       for any p in (1..#patch) : (\n          @patch[p] > @save[b] and @patch[p] < @writer[w] and (\n  \
      \         (role == 0 and uint16(@patch[p]+1) == uint16(@save[b]+4) and uint16(@patch[p]+4) == @firstcall[fc]+!firstcall[fc]+256)\
      \ or\n           (role == 1 and uint16(@patch[p]+1) == uint16(@names[a]+4) and uint16(@patch[p]+4) == @firstcall[fc]+!firstcall[fc]+275)\
      \ or\n           (role == 2 and uint16(@patch[p]+1) == uint16(@names[a]+4) and uint16(@patch[p]+4) == @hostline[hl]+258)\
      \ or\n           (role == 3 and uint16(@patch[p]+1) == uint16(@names[a]+4) and uint16(@patch[p]+4) == @hostline[hl]+!hostline[hl]+256)\
      \ or\n           (role == 4 and uint16(@patch[p]+1) == uint16(@save[b]+4) and uint16(@patch[p]+4) == @hostline[hl]+!hostline[hl]+275)\n\
      \          )\n         )\n        )\n       )\n      )\n     )\n    )\n   )\n  )\n )\n)\n}"
