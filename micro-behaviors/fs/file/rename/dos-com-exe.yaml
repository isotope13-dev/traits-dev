# Copy a pathname through the dot, then plant the COM and EXE extension
# bytes and rename. One side receives "CO" and the other "EXE".
defaults:
  for: [dos_com, data]
  platforms: [windows, unix]
  size_max: 65536
traits:
  - id: dos-dot-com-exe-rename
    desc: Renames between COM and EXE names
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule dos_dot_com_exe_rename {
          meta:
            filetypes = "dos_com,data"
          strings:
            $ren = { 80 3C 2E A4 75 ?? C7 04 43 4F B8 45 58 AB [0-2] AB 5F B4 56 CD 21 B4 3C }
          condition:
            $ren in (0..256)
        }
  # SCASB finds the dot, STOSW/STOSB writes EXE, then the same spot gets COM.
  - id: dos-dot-exe-then-com-plant
    desc: Stosb plants EXE then COM
    crit: notable
    conf: 0.95
    if:
      type: yara
      source: |
        rule dos_dot_exe_then_com_plant {
          meta:
            filetypes = "dos_com,data"
          strings:
            $p = { B0 2E F2 AE [0-6] B8 45 58 AB AA [0-24] B8 43 4F AB [0-2] B0 4D AA }
          condition:
            $p in (0..256)
        }
