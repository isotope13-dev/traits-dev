defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  - batch
  - text
traits:
- id: cmd-wildcard-to-exe-suffix
  desc: Command renames wildcard files to EXE
  crit: notable
  conf: 0.98
  if:
    type: yara
    source: |
      rule cmd_wildcard_to_exe_suffix {
        strings:
          $rename = /\bren\s+\*\.[a-z0-9]{1,12}\s+\*\.exe\b/ ascii wide nocase
        condition:
          $rename
      }
  not:
  - regex: (?i)\bren\s+\*\.exe\s+\*\.exe\b
