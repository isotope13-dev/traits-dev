defaults:
  platforms: [windows, unix]
  for: [python]
  crit: baseline
  conf: 0.9
traits:
  - id: os-rename
    desc: os.rename file movement
    if:
      type: symbol
      kind: call
      exact: os.rename
  - id: os-replace
    desc: os.replace file movement
    if:
      type: symbol
      kind: call
      exact: os.replace
  - id: shutil-move
    desc: shutil.move file movement
    if:
      type: symbol
      kind: call
      exact: shutil.move
  # Bind the destination argument to a filesystem primitive. String.replace
  # on sys.executable is string editing, even when its result ends in .exe.
  - id: rename-target-exe
    desc: Rename target with .exe extension
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '^(os\.(rename|replace)|shutil\.move)$'
      arg:
        index: 1
        kind: string
        regex: '\.exe$'
