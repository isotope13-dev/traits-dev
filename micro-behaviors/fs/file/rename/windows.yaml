# File rename operations - Windows
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: cmd-rename-quoted-target
    desc: Embedded cmd rename with quoted source
    crit: notable
    conf: 0.97
    if:
      type: text
      exact: 'cmd /c rename "'

  # ASCII shell syntax in UTF-16 requires zero high bytes. Corrupted high
  # bytes encode different characters, even when the low bytes still resemble
  # a command. Do not turn those damaged strings into a shell capability.
  - id: utf16-cmd-rename-quoted-target
    desc: UTF-16 cmd rename with quoted source
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: 63 00 6d 00 64 00 20 00 2f 00 63 00 20 00 72 00 65 00 6e 00 61 00 6d 00 65 00 20 00 22 00
      section: .text

  - id: set-file-short-name-w
    desc: Rewrite a file's 8.3 short name
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: SetFileShortNameW
  - id: windows-file-rename-info
    desc: Renames a Windows handle with FileRenameInfo
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?is)\bSetFileInformationByHandle\s*\([^;]{0,320}\bFileRenameInfo\b'
  - id: powershell-item-move-or-rename
    desc: PowerShell moves or renames an item
    crit: notable
    conf: 0.88
    for: [powershell]
    if:
      type: text
      regex: '(?im)^\s*(Move-Item|Rename-Item)\s+[^\r\n;|#]{1,220}'
composite_rules:
  - id: windows-file-rename-to-alternate-stream
    desc: Renames file to an alternate NTFS stream
    crit: notable
    conf: 0.98
    for: [c]
    all:
      - id: micro-behaviors/fs/path/stream::ntfs-stream-basename-literal
      - id: windows-file-rename-info
    near_bytes: 1024

  - id: cmd-target-die-extension-rename
    near_bytes: 128
    desc: Cmd rename fragment beside .die suffix
    crit: suspicious
    conf: 0.995
    any:
      - id: cmd-rename-quoted-target
      - id: utf16-cmd-rename-quoted-target
    all:
      - id: micro-behaviors/fs/path/extension::die-extension-marker

  - id: any-rename
    desc: Rename or move file on Windows
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/fs/file/rename::rename-base
      - id: micro-behaviors/fs/file/move::move-file
      - id: micro-behaviors/fs/file/move::move-file-ex
      - id: micro-behaviors/fs/file/rename::rename-text
