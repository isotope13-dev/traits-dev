# File rename operations - Windows
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: cmd-rename-quoted-target
    desc: Embedded cmd rename with quoted source
    crit: notable
    conf: 0.97
    if:
      type: text
      exact: 'cmd /c rename "'

  # Polymorphic VB6 replicas can corrupt the UTF-16 high bytes while leaving
  # the ASCII code units executable. Match the command's low bytes so later
  # generations retain the same behavioral signal.
  - id: utf16-cmd-rename-quoted-target
    desc: UTF-16 cmd rename with quoted source
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: 63 ?? 6d ?? 64 ?? 20 ?? 2f ?? 63 ?? 20 ?? 72 ?? 65 ?? 6e ?? 61 ?? 6d ?? 65 ?? 20 ?? 22 ??
      section: .text

  - id: set-file-short-name-w
    desc: Rewrite a file's 8.3 short name
    crit: notable
    conf: 0.8
    if:
      type: symbol
      exact: SetFileShortNameW
  - id: windows-file-rename-info
    desc: Renames a Windows handle with FileRenameInfo
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?is)\bSetFileInformationByHandle\s*\([^;]{0,320}\bFileRenameInfo\b'
  - id: powershell-item-move-or-rename
    desc: PowerShell moves or renames an item
    crit: notable
    conf: 0.88
    for: [powershell]
    if:
      type: text
      regex: '(?im)^\s*(Move-Item|Rename-Item)\s+[^\r\n;|#]{1,220}'
composite_rules:
  - id: cmd-target-die-extension-rename
    desc: Embedded cmd rename changes a target to the .die extension
    crit: suspicious
    conf: 0.995
    any:
      - id: cmd-rename-quoted-target
      - id: utf16-cmd-rename-quoted-target
    all:
      - id: micro-behaviors/fs/path/extension::die-extension-marker

  - id: any-rename
    desc: Rename or move file on Windows
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/fs/file/rename::rename-base
      - id: micro-behaviors/fs/file/move::move-file
      - id: micro-behaviors/fs/file/move::move-file-ex
