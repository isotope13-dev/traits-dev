# An executable-suffix rename in Ruby's extconf.rb build hook is a package
# installation concern. No launch of the renamed file is required here.
defaults:
  platforms: [unix, windows]

composite_rules:
  - id: extconf-executable-rename
    desc: extconf.rb renames file to .exe
    crit: suspicious
    conf: 0.95
    all:
      - id: metadata/build/package/recipe/gemspec::filename-extconf
      - id: micro-behaviors/fs/file/rename::ruby-rename-executable-argument
