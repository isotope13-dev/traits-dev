# Console I/O Operations
# Console input/output and handle manipulation
defaults:
  for: ["pe", "dll", "c", "cpp"]
  platforms: ["windows"]
traits:
  - id: nt-device-io-control-file
    desc: NtDeviceIoControlFile native API name
    crit: component
    conf: 0.9
    if:
      type: text
      exact: NtDeviceIoControlFile
  - id: nt-set-information-file
    desc: NtSetInformationFile API import
    crit: notable
    conf: 0.93
    for: [pe, dll, c, cpp, csharp, go, rust, powershell]
    if:
      type: symbol
      exact: NtSetInformationFile
  - id: file-disposition-information
    desc: Marks a file for disposition
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, go, rust, powershell]
    if:
      type: text
      word: FileDispositionInformation
    unless:
      - id: metadata/library/generated::winmd-metadata
  - id: device-io-control-win
    desc: DeviceIoControl API usage
    crit: notable
    conf: 0.85
    if:
      type: symbol
      exact: DeviceIoControl
    unless:
      - type: metrics
        field: exports.count
        min: 100
      - id: metadata/binary/framework::electron-desktop-runtime
      - id: metadata/binary/installer/script/
      - id: metadata/file/extension/identity::uninstaller-exe-basename
  # Managed and script-hosted loaders commonly declare the API in source text
  # (for example, through Add-Type/PInvoke) instead of importing a native
  # symbol. Keep this as a text-reference companion to the precise symbol
  # atom above; intent is supplied by objective composites.
  - id: device-io-control-api-reference
    desc: DeviceIoControl API reference
    crit: notable
    conf: 0.84
    for: [batch, powershell, csharp, c, cpp, go, rust, python]
    if:
      type: text
      regex: '(?i)\bDeviceIoControl[AW]?\s*\('
  - id: kernel-device-handle
    desc: Opens a Windows kernel device handle
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, go, rust, powershell]
    if:
      type: text
      # Match both the runtime form (`\\.\Name`) and C/C++ source escapes
      # (`\\\\.\\Name`) so device opens in injector source are visible.
      regex: '(?i)(\\\\\.\\|\\\\\\\\\.\\\\)([A-Za-z_][A-Za-z0-9_.-]{2,80}|\{[0-9a-f-]{8,80}\})'
    not:
      # `\\.\pipe\` and `\\.\mailslot\` are IPC endpoints, not devices, and have
      # their own traits under communications/ipc/; calling them a kernel device
      # handle mis-describes every ordinary named-pipe server.
      - regex: '(?i)^(\\\\\.\\|\\\\\\\\\.\\\\)(pipe|mailslot)$'
  - id: set-file-information-by-handle
    desc: Modify file metadata attributes
    crit: baseline
    conf: 0.85
    if:
      type: symbol
      exact: SetFileInformationByHandle
  # === Standard Handle Management ===
  - id: get-std-handle
    desc: Get standard I/O handle
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "GetStdHandle"
  - id: set-std-handle
    desc: Set standard I/O handle
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "SetStdHandle"
  - id: get-console-mode
    desc: Get console input/output mode
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "GetConsoleMode"
  - id: get-console-output-cp
    desc: Get console output code page
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "GetConsoleOutputCP"
  # === File Handle Control ===
  - id: flush-file-buffers
    desc: Flush file buffer to disk
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "FlushFileBuffers"
  - id: set-file-pointer-ex
    desc: Set file position extended
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "SetFilePointerEx"
  - id: set-file-attributes-ex
    desc: Modify Windows file attributes
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, powershell]
    if:
      type: symbol
      regex: '^SetFileAttributesEx[AW]?$'
  - id: set-file-pointer
    desc: Set file position
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "SetFilePointer"
  - id: legacy-llseek
    desc: Legacy file seek API
    crit: baseline
    conf: 0.88
    ref: sha256:68fa7c436e293739e98bb04034db6d6a3e40a9b9991de5d147368fb696044499
    if:
      type: symbol
      exact: _llseek
  - id: get-file-type
    desc: Get file handle type
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "GetFileType"

composite_rules:
  # Either spelling of "issue an IOCTL to a device" — the Win32 entry point or
  # the NT native one. Neutral: reparse-point and volume code in every Windows
  # filesystem layer calls it (libuv's src/win/fs.c does, for FSCTL_*).
  # objectives/privilege-escalation/exploit/kernel/windows-afd.yaml references
  # this and supplies the AFD-specific evidence itself; it previously carried a
  # local copy named `afd-device-ioctl` ("Windows AFD device IOCTL reference"),
  # which claimed AFD kernel-exploit context for any DeviceIoControl caller.
  - id: device-io-control-win32-or-nt
    desc: DeviceIoControl Win32 or NT native call
    crit: notable
    conf: 0.9
    any:
      - id: device-io-control-api-reference
      - id: nt-device-io-control-file

  - id: kernel-device-io-control
    desc: Controls a Windows kernel device
    crit: notable
    conf: 0.94
    all:
      - id: kernel-device-handle
    any:
      - id: device-io-control-win
      - id: device-io-control-api-reference
