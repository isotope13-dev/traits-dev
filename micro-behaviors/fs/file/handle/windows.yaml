# Console I/O Operations
# Console input/output and handle manipulation
defaults:
  for: ["pe", "dll", "c", "cpp"]
  platforms: ["windows"]
traits:
  - id: nt-device-io-control-file
    desc: NtDeviceIoControlFile native API name
    crit: component
    conf: 0.9
    if:
      type: text
      exact: NtDeviceIoControlFile
  - id: nt-set-information-file
    desc: Sets native file information
    crit: notable
    conf: 0.93
    for: [pe, dll, c, cpp, csharp, go, rust, powershell]
    if:
      type: symbol
      exact: NtSetInformationFile
  - id: file-disposition-information
    desc: Marks a file for disposition
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, go, rust, powershell]
    if:
      type: text
      word: FileDispositionInformation
  - id: device-io-control-win
    desc: DeviceIoControl API usage
    crit: notable
    conf: 0.85
    if:
      type: symbol
      exact: DeviceIoControl
    unless:
      - type: metrics
        field: exports.count
        min: 100
      - id: metadata/binary/framework::electron-desktop-runtime
      - id: metadata/binary/installer/script/
      - id: metadata/file/extension/identity::uninstaller-exe-basename
  # Managed and script-hosted loaders commonly declare the API in source text
  # (for example, through Add-Type/PInvoke) instead of importing a native
  # symbol. Keep this as a text-reference companion to the precise symbol
  # atom above; intent is supplied by objective composites.
  - id: device-io-control-api-reference
    desc: DeviceIoControl API reference
    crit: notable
    conf: 0.84
    for: [batch, powershell, csharp, c, cpp, go, rust, python]
    if:
      type: text
      regex: '(?i)\bDeviceIoControl[AW]?\s*\('
  - id: kernel-device-handle
    desc: Opens a Windows kernel device handle
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, go, rust, powershell]
    if:
      type: text
      regex: '(?i)\\\\\.\\\\[A-Za-z_][A-Za-z0-9_.-]{2,80}|\\\\\.\\\\\\{[0-9a-f-]{8,80}\\\\\\}'
  - id: set-file-information-by-handle
    desc: Modify file metadata attributes
    crit: baseline
    conf: 0.85
    if:
      type: symbol
      exact: SetFileInformationByHandle
  # === Standard Handle Management ===
  - id: get-std-handle
    desc: Get standard I/O handle
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "GetStdHandle"
  - id: set-std-handle
    desc: Set standard I/O handle
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "SetStdHandle"
  - id: get-console-mode
    desc: Get console input/output mode
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "GetConsoleMode"
  - id: get-console-output-cp
    desc: Get console output code page
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "GetConsoleOutputCP"
  # === File Handle Control ===
  - id: flush-file-buffers
    desc: Flush file buffer to disk
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "FlushFileBuffers"
  - id: set-file-pointer-ex
    desc: Set file position extended
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "SetFilePointerEx"
  - id: set-file-pointer
    desc: Set file position
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "SetFilePointer"
  - id: legacy-llseek
    desc: Legacy file seek API
    crit: baseline
    conf: 0.88
    ref: sha256:68fa7c436e293739e98bb04034db6d6a3e40a9b9991de5d147368fb696044499
    if:
      type: symbol
      exact: _llseek
  - id: get-file-type
    desc: Get file handle type
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "GetFileType"
