composite_rules:
- id: module-path-copy-rewrite-api-set
  desc: Module-path, file-copy and handle-rewrite API references
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/fs/read/file/handle::ansi-module-path-file-io-import-set
  - id: micro-behaviors/fs/file/copy/call::copyfile-a
  - id: micro-behaviors/fs/write/file/handle::write-file
  - id: micro-behaviors/fs/file/handle::set-file-pointer
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: metadata/binary/installer/sfx/
  - id: well-known/lib/platform/microsoft-wininet::wininet-system-context
  - id: well-known/app/enterprise/athoc::athocafrc-legacy-module-context
  - id: well-known/app/infrastructure/vmware-tools::vmware-tools-upgrader-context
  - id: well-known/app/network/juniper-setup-client::juniper-setup-client-identity
  - id: well-known/app/enterprise/citrix-receiver::citrix-receiver-context
- id: minimal-unsigned-copy-rewrite-api-profile
  desc: Unsigned copy/rewrite API profile without listed application APIs
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/fs/file/handle::module-path-copy-rewrite-api-set
  - id: micro-behaviors/fs/file/stat::get-file-size
  - id: metadata/signed/trust-level::unsigned-missing-signature-record
  unless:
  - id: micro-behaviors/fs/file/handle::application-api-beyond-file-copy
  - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-text
- id: application-api-beyond-file-copy
  desc: Listed application APIs beyond file copying
  crit: exception
  conf: 0.9
  any:
  - id: micro-behaviors/process/create/exec::create-process-a
  - id: micro-behaviors/process/create/spawn::create-process-w
  - id: micro-behaviors/process/create/launch::create-process-api-name
  - id: micro-behaviors/process/create/shellexec::shell-execute
  - id: micro-behaviors/process/create/exec::winexec
  - id: micro-behaviors/os/registry/access::registry-create-key-api
  - id: micro-behaviors/os/registry/access::registry-set-value-api
  - id: micro-behaviors/communications/socket/init::wsa-startup
  - id: micro-behaviors/communications/socket/init::winsock-startup-ordinal
  - id: micro-behaviors/communications/http/client/wininet::internet-open
  - id: micro-behaviors/communications/ipc/named-pipe::create-named-pipe
  - id: micro-behaviors/os/service/dispatch::service-control-dispatch
  - id: micro-behaviors/fs/enumerate/drives::get-logical-drives
  - id: micro-behaviors/fs/directory/readdir/native::file-enumeration-with-access
  - id: micro-behaviors/fs/directory/readdir/native::find-file-walker
  - id: micro-behaviors/ui/window/control::create-window-ex
defaults:
  platforms:
  - windows
  for:
  - pe
