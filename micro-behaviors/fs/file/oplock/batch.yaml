# Numeric and symbolic representations of the same batch-oplock request.
# An oplock is ordinary synchronization; the target and redirection establish
# an exploit. Match the control argument at the actual DeviceIoControl call.
defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust, python, powershell]
  crit: notable
  conf: 0.98

traits:
  - id: batch-oplock-numeric-call
    desc: Requests batch oplock by numeric control code
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])DeviceIoControl$'
      arg:
        index: 1
        kind: number
        value: 589832

  - id: batch-oplock-symbolic-call
    desc: Requests batch oplock by symbolic control code
    if:
      type: symbol
      kind: call
      regex: '(^|[.:])DeviceIoControl$'
      arg:
        index: 1
        kind: identifier
        name: FSCTL_REQUEST_BATCH_OPLOCK

composite_rules:
  - id: batch-oplock-request
    desc: Requests a Windows batch oplock
    any:
      - id: batch-oplock-numeric-call
      - id: batch-oplock-symbolic-call
