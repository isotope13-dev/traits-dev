# File Attribute Manipulation - Scripts
# Detects use of 'attrib +h' to set the hidden attribute on files via command line
defaults:
  platforms: [windows, unix]
  for: [python, shell, batch, powershell, vbs]
  attack: T1564.001
traits:
  # Scripting.FileSystemObject hidden-attribute set: `file.Attributes = file.Attributes | 2`
  # (JScript) or `.Attributes = .Attributes Or 2` (VBScript). Bit 2 is
  # FILE_ATTRIBUTE_HIDDEN. Neutral capability — file-hiding intent lives in the
  # objectives/evasion composites that reference it.
  - id: fso-set-hidden-attribute
    desc: FSO sets hidden file attribute
    crit: notable
    conf: 0.85
    for: [javascript, vbs, html]
    if:
      type: text
      regex: '\.Attributes\s*(=\s*[^=\n]{0,60}(\||\bOr\b)\s*2\b|\|=\s*2\b)'
  # Case-sensitive on purpose. `.attributes` in lower case is the standard DOM
  # property on every Element, so the case-insensitive form matched browser
  # JavaScript — jQuery's Sizzle feature probe `d.attributes = ce(...)` fired
  # this "FSO changes file attributes" rule on every page that ships jQuery
  # (cairomm's Doxygen output among them). VBScript is case-insensitive as a
  # language, but ASP/WSH code spells COM members capitalised, and the DOM
  # property never is, so capitalisation separates the two cleanly. The
  # `for:` list stays broad because classic ASP is often typed as html/js.
  #
  # Capitalisation alone was not enough: TypeScript compiles a namespaced enum
  # to `(r = n.Attributes || (n.Attributes = {}))`, and `Attributes` is an
  # ordinary enum name in bundled UI code (the Eclipse Memory Inspector webview
  # hit it). An FSO attribute assignment sets a numeric bitmask, or ORs the
  # property against itself; it never assigns an object literal, so requiring
  # that right-hand shape separates the two.
  - id: fso-attribute-mutation
    desc: FSO changes file attributes or modification time
    crit: notable
    conf: 0.9
    for: [javascript, vbs, html]
    if:
      type: text
      regex: '\.(Attributes|ModifyDate)\s*=\s*(\d|[A-Za-z_]\w*\.(Attributes|ModifyDate))'
  - id: fso-vbs-attribute-mutation
    desc: VBScript FSO changes file metadata
    crit: notable
    conf: 0.92
    for: [vbs]
    if:
      type: text
      regex: '(?i)\.(attributes|modifydate)\s*=\s*(\d|[A-Za-z_]\w*(\.(attributes|modifydate))?)'
  - id: fso-vbs-set-hidden-system-attributes
    desc: VBScript sets hidden system attributes
    crit: notable
    conf: 0.95
    for: [vbs]
    if:
      type: text
      regex: '(?i)\.attributes\s*=\s*(2\s*\+\s*4|4\s*\+\s*2|6)\b'
  - id: attrib-hidden
    desc: Windows attrib +h sets file hidden
    crit: suspicious
    conf: 0.9
    unless:
      - type: text
        substr: PlugIn.ico
      - type: text
        substr: bloat directories in Users Files
      - id: well-known/app/infrastructure/kubeflow-community::notebook-scripts
      - id: well-known/app/infrastructure/virtualbox::unattended-template
    if:
      type: text
      regex: 'attrib.{0,10}\+h'
    downgrade:
      any:
        - id: well-known/tool/development/batch-scripts::undeletable-dir-example-path
  - id: attrib-hidden-system
    desc: Windows attrib sets hidden and system
    crit: suspicious
    conf: 0.93
    unless:
      - type: text
        substr: PlugIn.ico
      - type: text
        substr: bloat directories in Users Files
      - id: well-known/app/infrastructure/virtualbox::unattended-template
    if:
      type: text
      regex: '(?i)attrib.{0,20}\+(h|s).{0,20}\+(h|s)'
    downgrade:
      any:
        - id: well-known/tool/development/batch-scripts::undeletable-dir-example-path
