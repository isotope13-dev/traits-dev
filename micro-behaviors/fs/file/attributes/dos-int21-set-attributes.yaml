defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536

traits:
  - id: dos-int21-set-attributes
    desc: DOS sets file attributes via INT 21h
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B8 01 43 [0-8] CD 21"
  - id: dos-int21-set-attributes-near-call
    desc: DOS sets file attributes via call helper
    crit: notable
    conf: 0.88
    if:
      type: hex
      # AX=4301h issued through a near-call helper instead of INT 21h
      # directly; attribute clears inside a resident infector's infection
      # transaction use this spelling.
      pattern: "B8 01 43 [0-8] E8 ?? ??"
  - id: dos-dta-attribute-byte-load
    desc: Loads matched file attribute byte from DTA
    crit: notable
    conf: 0.92
    if:
      type: hex
      pattern: "(33 C9 BB 80 00 8A 4F 15|31 C9 BB 80 00 8A 4F 15|33 C9 BE 80 00 8A 4C 15|31 C9 BE 80 00 8A 4C 15|33 C9 8A 0E 95 00|31 C9 8A 0E 95 00|8A 0E 95 00 30 ED|8A 0E 95 00 B5 00) [0-4] (E8 ?? ??|B8 01 43 CD 21)"
