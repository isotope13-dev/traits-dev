defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536

traits:
  - id: dos-int21-set-attributes
    desc: DOS sets file attributes via INT 21h
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B8 01 43 [0-8] CD 21"
  - id: dos-int21-set-attributes-near-call
    desc: DOS sets file attributes via call helper
    crit: notable
    conf: 0.88
    if:
      type: hex
      # AX=4301h issued through a near-call helper instead of INT 21h
      # directly; attribute clears inside a resident infector's infection
      # transaction use this spelling.
      pattern: "B8 01 43 [0-8] E8 ?? ??"
