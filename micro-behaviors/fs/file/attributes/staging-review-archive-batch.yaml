traits:
- platforms:
  - windows
  for:
  - powershell
  id: powershell-extract-hidden-attribute-text
  desc: PowerShell extraction and Hidden attribute text
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: (?is)\b(ExtractToFile|Expand-Archive)\b.{0,500}\.Attributes\s*=.{0,100}\bHidden\b
