defaults:
  for: [dos_com, data]
  platforms: [windows, unix]
  size_max: 65536

traits:
  - id: dos-open-then-set-hidden-attribute
    desc: DOS opens file and sets hidden attribute
    crit: notable
    conf: 0.98
    if:
      type: hex
      # AL=2 is ORed into the queried attributes; XCHG preserves the
      # returned handle in BX while selecting AX=4301h. This adds hidden,
      # rather than clearing read-only (bit zero).
      pattern: 'B4 43 CD 21 B8 02 3D (0A C8|08 C1) CD 21 BB 01 43 93 CD 21'
