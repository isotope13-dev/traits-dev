defaults:
  for:
  - dos_com
  platforms:
  - windows
  - unix
  size_max: 65536
traits:
- id: dos-self-image-readonly-hidden-path
  desc: Makes self-image path read-only and hidden
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule dos_self_image_readonly_hidden_path {\n meta:\n filetypes = \"com,dos\"\n strings:\n$drop = { BA ?? ?? B9 00 00 B4 3C CD 21 8B D8\
      \ B9 ?? ?? BA 00 01 B4 40 CD 21 B4 3E CD 21 }\n$name = /[A-Za-z0-9_.~\\-]{1,60}\\.(COM|EXE)\\x00/ nocase\n\
      $attrs = { BA ?? ?? B9 03 00 B8 01 43 CD 21 }\n condition:\n#drop > 0 and #drop <= 32 and #name <= 32 and\n\
      for any a in (1..#drop) : (\n uint16(@drop[a]+13) > 0 and uint16(@drop[a]+13) <= filesize and\n for any n\
      \ in (1..#name) : (@name[n]+256 == uint16(@drop[a]+1))\n and #attrs > 0 and #attrs <= 32 and\n for any b in\
      \ (1..#attrs) : (\n  @attrs[b] == @drop[a]+!drop[a] and uint16(@attrs[b]+1) == uint16(@drop[a]+1)\n )\n)\n\
      }"
