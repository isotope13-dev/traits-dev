defaults:
  platforms: [windows, unix]
  for: [c, text]

traits:
  - id: dos-asm-get-attributes
    desc: DOS source selects file attribute query
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)mov\s+ax,0?4300h'

  - id: dos-asm-set-attributes
    desc: DOS source selects file attribute update
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)mov\s+ax,0?4301h'

