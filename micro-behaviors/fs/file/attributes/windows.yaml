# File Attribute Manipulation - Windows
# Modifying file attributes (hidden, system, read-only)
defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: file-name-length-field
    desc: FileNameLength structure field reference
    crit: notable
    conf: 0.9
    for: [binaries, c, cpp, rust, go, csharp]
    if:
      type: text
      word: FileNameLength
    unless:
      - id: metadata/build/generated::winmd-metadata

  - id: set-file-attributes-a
    desc: Set file attributes (ANSI)
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: "SetFileAttributesA"
  - id: set-file-attributes-w
    desc: Set file attributes (Unicode)
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: "SetFileAttributesW"
  - id: set-file-attributes-source
    desc: SetFileAttributes API in source
    crit: baseline
    conf: 0.88
    for: [c, cpp]
    if:
      type: symbol
      exact: "SetFileAttributes"
  - id: hidden-file-create-flag
    desc: CreateFile uses hidden attribute flag
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '(?is)\bCreateFile(A|W)?\s*\([^)]{0,240}\bFILE_ATTRIBUTE_HIDDEN\b'
  - id: hidden-attribute-usage
    desc: FileAttributes.Hidden usage
    crit: notable
    conf: 0.9
    # VB.NET source is identified as `vbs` and spells this BCL enum the same.
    for: [csharp, vbs]
    if:
      type: text
      substr: FileAttributes.Hidden
  # The System attribute is what turns a merely hidden file into one Explorer
  # will not show even with "show hidden files" on. Applications set Hidden;
  # setting System on a file the program just wrote is a concealment choice.
  - id: system-attribute-usage
    desc: FileAttributes.System usage
    crit: notable
    conf: 0.9
    for: [csharp, vbs]
    if:
      type: text
      substr: FileAttributes.System
  - id: managed-set-attributes-method
    # Relocated (2026-09) from objectives/evasion/masquerade/process/name,
    # where a bare `word: SetAttributes` was filed as a shadow-deployer token
    # and matched unrelated Go methods such as `report.Finding.SetAttributes`.
    # Anchored to the receiver types of the managed API it actually names.
    desc: Managed File.SetAttributes attribute write
    crit: baseline
    conf: 0.9
    for: [csharp, vbs, pe, dll]
    if:
      type: text
      regex: '\b(File|FileInfo|DirectoryInfo)\.SetAttributes\b'
  - id: set-file-attributes-go
    desc: Go SetFileAttributes call
    crit: baseline
    conf: 0.86
    for: [go, pe]
    if:
      type: text
      substr: 'windows.SetFileAttributes'
  - id: vb6-rtcsetfileattr
    desc: VB6 runtime file attribute setter
    crit: baseline
    conf: 0.98
    if:
      type: symbol
      exact: rtcSetFileAttr
composite_rules:
  - id: vb6-set-file-attributes
    desc: VB6 rtcSetFileAttr runtime helper import
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/dylib/load/runtime::vb6-runtime-dll-reference
    any:
      - id: vb6-rtcsetfileattr
      - id: metadata/binary/framework::vb6-runtime-ordinal-580
