defaults:
  platforms:
    - "windows"
  for:
    - "batch"
traits:
  - 
    id: "batch-hide-os-directory"
    desc: "Hides Windows OS directories"
    crit: "notable"
    conf: 0.96
    if:
      type: "text"
      regex: "(?im)^\\s*attrib\\s+\\+r\\s+\\+h\\s+\\+s\\s+[a-z]:\\\\(winnt|windows)(\\\\system32)?\\s*$"
