defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: writes-agent-skill-markdown
    desc: Writes an agent skill markdown file
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'writeFileSync\([^;\n]{0,160}SKILL\.md'
  # Local agent CLIs (Claude Code, Codex, PixelDirector, …) install a managed
  # Skill tree under ~/.agents|~/.claude|… — neutral capability. Hostile
  # websocket/obfuscated installers compose this with C2 legs in objectives/.
  - id: install-managed-skill-call
    desc: Managed agent skill install call
    crit: notable
    conf: 0.95
    if:
      type: text
      word: installManagedSkill

