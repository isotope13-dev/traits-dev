defaults:
  platforms: [unix, windows]
  for: [c, cpp]

traits:
  # Neutral file-write capability. Persistence and infection objectives add
  # the destination/path context that gives an append operation intent.
  - id: c-fopen-append-mode
    desc: C opens a file in append mode
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: fopen
      arg:
        kind: string
        exact: a
