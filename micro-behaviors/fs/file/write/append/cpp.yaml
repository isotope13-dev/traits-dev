defaults:
  platforms: [unix, windows]
  for: [c, cpp]

traits:
  # `std::ofstream f(path, std::ios::app)` — the C++ spelling of opening a file
  # for append. Neutral on its own: log writers, replay recorders and telemetry
  # buffers all use it, and so does a keystroke logger draining its buffer.
  # Composites that mean the latter (objectives/collection/keylog/) reference
  # this alongside the key-state polling that makes the write a keylog.
  - id: cpp-ofstream-append-mode
    desc: C++ opens output file in append mode
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'ofstream[\s\S]{0,120}(ios_base::app|std::ios::app)'
