# Opening a file, seeking inside it and writing at the new offset. This is the
# in-place overwrite primitive a wiper builds on, but it is also how patchers,
# archivers, database engines and installers rewrite a record in the middle of
# an existing file, so it stays a capability. The wiper intent is composed in
# objectives/impact/wipe/disk/overwrite/.
defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp]

composite_rules:
  - id: positioned-file-overwrite
    desc: Opens a file, seeks, and writes at the new offset
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: micro-behaviors/fs/file/handle::set-file-pointer-ex
    any:
      - id: micro-behaviors/fs/file/write/direct::write-file-source
      - id: micro-behaviors/fs/file/write/direct::writefile-api
