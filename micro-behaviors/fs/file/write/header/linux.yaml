defaults:
  platforms: [linux]
  for: [elf, data]
  crit: notable
  conf: 0.95
traits:
- id: pwrite-file-header-syscall
  desc: Direct 64-byte pwrite at file offset zero
  for: [elf]
  if:
    type: syscall
    name: [pwrite64]
    arch: [x86_64, aarch64]
    args:
    - index: 2
      value: 64
    - index: 3
      value: 0
- id: x64-pwrite-file-header-bytes
  desc: Contains x86-64 header-write code
  if:
    type: hex
    pattern: 45 31 D2 B8 12 00 00 00 BA 40 00 00 00 48 8D 74 24 ?? 0F 05
    offset_range: [0, 1048576]
composite_rules:
# Includes embedded instruction sequences in non-executable data sections.
# This is carried code, not proof the outer program executes that syscall.
- id: x64-pwrite-file-header
  desc: Contains code for 64-byte header writes
  any:
  - id: pwrite-file-header-syscall
  - id: x64-pwrite-file-header-bytes
