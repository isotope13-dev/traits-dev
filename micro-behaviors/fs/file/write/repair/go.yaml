defaults:
  platforms: [windows, unix]
  for: [go]

composite_rules:
  - id: go-missing-path-write-pair
    desc: Go checks a missing path near a file write
    crit: notable
    conf: 0.88
    all:
      - id: micro-behaviors/fs/file/stat::go-os-stat-missing-check
      - id: micro-behaviors/fs/file/write/direct::go-os-writefile
    near_bytes: 1024
