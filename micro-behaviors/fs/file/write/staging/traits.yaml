# File Staging Path Detection
# Detects use of common malware staging directories
defaults:
  attack: T1074.001
  mbc: E1074
  crit: notable
  conf: 0.8
  platforms: [windows]
traits:
  - id: users-public-path
    desc: Users\Public staging directory
    for: [javascript, batch, powershell]
    if:
      type: text
      regex: '(?i)(download|copy|write).{0,80}Users[\\\\/]+Public[\\\\/]'
  - id: users-public-path-utf16
    desc: Users\Public staging path (UTF-16)
    for: [javascript]
    if:
      type: text
      regex: "U\\x00s\\x00e\\x00r\\x00s\\x00.\\x00.\\x00P\\x00u\\x00b\\x00l\\x00i\\x00c"
  - id: dd-output-file
    desc: Shell dd writes an output file
    crit: notable
    conf: 0.86
    platforms: [unix, android]
    for: [shell]
    if:
      type: text
      regex: '\bdd\b.{0,160}\bof[ \t]*=["'']?\S{1,160}'
  - id: android-dd-apk-temp-output
    desc: Shell dd writes APK into Android temp
    crit: notable
    conf: 0.94
    platforms: [unix, android]
    for: [shell]
    if:
      type: text
      regex: '\bdd\b.{0,160}\bof[ \t]*=["'']?/data/local/tmp/\S{1,64}\.apk\b'
