# PE resource modification APIs.
defaults:
  platforms: [windows]
  for: [pe]

traits:
  - id: update-resource-a
    desc: "Modify PE resources via UpdateResourceA"
    crit: notable
    if:
      type: symbol
      exact: UpdateResourceA
  - id: begin-update-resource-a
    desc: "Begin modifying PE resources"
    crit: notable
    if:
      type: symbol
      exact: BeginUpdateResourceA
  - id: end-update-resource-a
    desc: "Commit PE resource modifications"
    crit: notable
    if:
      type: symbol
      exact: EndUpdateResourceA
  - id: update-resource-w
    desc: "Modify PE resources via UpdateResourceW"
    crit: notable
    if:
      type: symbol
      exact: UpdateResourceW
  - id: begin-update-resource-w
    desc: "Begin modifying PE resources (Unicode)"
    crit: notable
    if:
      type: symbol
      exact: BeginUpdateResourceW

# ANSI/Unicode umbrellas. Which spelling a binary links is a build-time
# detail with no bearing on what the code does, so composites that mean
# "this program rewrites another PE's resources" should reach for these
# rather than pin one variant -- pinning is how a resource-rewriting
# infector that happened to use the ANSI entry points read as clean.
composite_rules:
  - id: begin-update-resource-any
    desc: Begin modifying PE resources
    crit: notable
    conf: 0.9
    any:
      - id: begin-update-resource-a
      - id: begin-update-resource-w
  - id: update-resource-any
    desc: Modify PE resources
    crit: notable
    conf: 0.9
    any:
      - id: update-resource-a
      - id: update-resource-w
  - id: end-update-resource-any
    desc: Commit PE resource modifications
    crit: notable
    conf: 0.9
    any:
      - id: end-update-resource-a
      - id: micro-behaviors/data/embedded/payload/resource::end-update-resource-w
