defaults:
  for: [pe]
  platforms: [windows]

traits:
  # Native-code imports do not expose VB6 p-code's Open/Put statements. This
  # sequence is the p-code OpenFile output opcode followed by a Put record;
  # requiring two sites distinguishes a rebuild-plus-append workflow from an
  # ordinary one-record settings write.
  - id: vb6-pcode-repeated-binary-record-write
    desc: VB6 p-code repeats binary record writes
    crit: notable
    conf: 0.98
    count_min: 2
    if:
      type: hex
      pattern: 'FE 5D 20 02 [0-128] FC (77|78)'
      section: .text
