# .NET source-level file writes through stream objects (FileStream,
# StreamWriter). The wipe/overwrite composites reference these.
defaults:
  for: [csharp]
  platforms: [windows, unix]

traits:
  - id: filestream-write-access
    desc: FileStream opened with write access
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)new\s+FileStream\s*\([^\r\n)]{0,180}FileAccess\.Write'
  - id: streamwriter-file-write
    desc: C# StreamWriter writes file contents
    crit: notable
    conf: 0.91
    if:
      type: text
      regex: '(?is)new\s+StreamWriter\s*\([^;]{0,180}\)\s*;[\s\S]{0,180}\.\s*Write(Line)?\s*\('
  # Any object named `stream`/`fileStream` having Write() called on it -- the
  # spelling used by embedded C# in PowerShell as well as plain C#. The name of
  # the variable is all this can see, so it covers network and memory streams
  # too; the objective composites add what makes a write destructive (a
  # relative seek, a random fill, a target path).
  - id: stream-object-write-call
    desc: Calls Write on a .NET stream object
    crit: notable
    conf: 0.93
    for: [csharp, powershell]
    if:
      type: text
      regex: '(?i)\b(stream|fileStream)\s*\.\s*Write\s*\('
