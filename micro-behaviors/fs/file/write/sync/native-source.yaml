defaults:
  platforms: [unix]
  for: [c, cpp]
  crit: component
  conf: 0.92

traits:
  # `write` only denotes the POSIX file-descriptor syscall in C/C++. The old
  # `type: text` regex over the whole `source` group matched any declaration or
  # call spelled `write(` — Rust's `std::hash::Hasher::write` (hashbrown's
  # src/hasher.rs forwards a dozen of them), `io::Write::write`, Java streams —
  # and reported them as native file writes. Matching call symbols in C/C++ only
  # mirrors the native-close-file-call sibling this composite is paired with.
  - id: native-write-file-call
    desc: Calls native write or sys_write
    if:
      type: symbol
      kind: call
      regex: '^(write|sys_write)$'
