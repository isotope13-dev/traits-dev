defaults:
  platforms: [unix, windows]
  for: [package.json]
  crit: notable
  conf: 0.9
traits:
  - id: npm-postinstall-write-file-sync
    desc: npm postinstall writes a file synchronously
    if:
      type: value
      path: scripts.postinstall
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]{0,32}\.writeFileSync\s*\('
