defaults:
  platforms: [unix]
  for: [rust]
traits:
  - id: rust-authorized-keys-write-flow
    desc: Writes a path derived from SSH authorized_keys
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(std::)?fs::write$'
      arg:
        index: 0
        from:
          value: '(^|[/\\])authorized_keys($|[/\\])'
          through:
            - call: '\.join$'
              arguments: [0]
              receiver: true
            - call: '^(std::path::)?(Path|PathBuf)::(new|from)$'
              arguments: [0]
            - call: '\.(to_path_buf|as_path)$'
              receiver: true
