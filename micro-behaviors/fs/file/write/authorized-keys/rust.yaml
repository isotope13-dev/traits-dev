defaults:
  platforms: [unix]
  for: [rust]
traits:
  - id: rust-authorized-keys-write
    desc: Writes to an SSH authorized_keys path
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '^(std::)?fs::write$'
      arg:
        kind: string
        substr: authorized_keys
