# Indirect Node file-write dispatch
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-write-file-sync-text
    desc: Calls a dotted writeFileSync method
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\b[A-Za-z_$][A-Za-z0-9_$]*\.writeFileSync\s*\('
