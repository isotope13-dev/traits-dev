defaults:
  platforms: [windows, unix]
  for: [source, scripts]

traits:
  - id: encrypted-suffix-output
    desc: File output uses distinctive encrypted suffix
    crit: notable
    conf: 0.94
    if:
      type: text
      case_insensitive: true
      regex: '\b(write\w*|open|ofstream)\s*\([^;\n]{0,160}["''`]\.(encrypted|locked|crypt|encrt)["''`]'
