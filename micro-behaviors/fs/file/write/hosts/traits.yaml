defaults:
  platforms: [unix, windows]
  for: [shell, batch, powershell, python]

traits:
  - id: hosts-file-append
    desc: Appends an entry to system hosts file
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(>>|tee\s+-a)[^\n]{0,40}etc[\\/]+hosts'

  - id: hosts-file-cmdlet-write
    desc: Writes system hosts file with a cmdlet
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(Add-Content|Out-File)[^\n]{0,60}etc[\\/]+hosts'

  - id: hosts-file-python-write
    desc: Python opens system hosts file for writing
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: 'open\([^)]{0,40}etc[\\/]+hosts[^)]{0,12}["''][aw]'

  - id: hosts-file-edit
    desc: Edits system hosts file with sed
    crit: notable
    conf: 0.92
    for: [shell, python]
    if:
      type: text
      regex: 'sed\s+-i[^\n]{0,60}etc[\\/]+hosts'

composite_rules:
  - id: hosts-file-write
    desc: Writes an entry into system hosts file
    crit: notable
    conf: 0.94
    any:
      - id: hosts-file-append
      - id: hosts-file-cmdlet-write
      - id: hosts-file-python-write
