# The system hosts file only. `/etc/hosts.allow` and `/etc/hosts.deny` are the
# tcp_wrappers access-control lists, a different subsystem with a different
# meaning — writing them is host access control, not name resolution. Every
# matcher below therefore requires a path terminator right after `hosts`, or it
# would report an emptied deny list as a DNS-override edit. Those files are
# covered by objectives/impact/degrade/firewall.
defaults:
  platforms: [unix, windows]
  for: [shell, batch, powershell, python]

traits:
  - id: hosts-file-append
    desc: Appends an entry to system hosts file
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(>>|tee\s+-a)[^\n]{0,40}etc[\\/]+hosts([^.A-Za-z0-9_]|$)'

  - id: hosts-file-cmdlet-write
    desc: Writes system hosts file with a cmdlet
    crit: notable
    conf: 0.92
    for: [powershell]
    if:
      type: text
      regex: '(Add-Content|Out-File)[^\n]{0,60}etc[\\/]+hosts([^.A-Za-z0-9_]|$)'

  - id: hosts-file-python-write
    desc: Python opens system hosts file for writing
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: text
      regex: 'open\([^)]{0,40}etc[\\/]+hosts["''][^)]{0,12}["''][aw]'

  - id: hosts-file-edit
    desc: Edits system hosts file with sed
    crit: notable
    conf: 0.92
    for: [shell, python]
    if:
      type: text
      regex: 'sed\s+-i[^\n]{0,60}etc[\\/]+hosts([^.A-Za-z0-9_]|$)'

composite_rules:
  - id: hosts-file-write
    desc: Writes an entry into system hosts file
    crit: notable
    conf: 0.94
    any:
      - id: hosts-file-append
      - id: hosts-file-cmdlet-write
      - id: hosts-file-python-write
      # In-place `sed -i` is a write like any other; leaving it out meant an
      # edited entry counted as a hosts write only in the three spellings above.
      - id: hosts-file-edit
