defaults:
  platforms: [unix, windows]
  for: [python, shell]
  crit: notable
  conf: 0.9

traits:
  - id: touch-marker-file
    desc: Creates a completion marker with touch
    crit: notable
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '(?i)\btouch\s+[^"\r\n]{1,120}\.(ran|done|exec)\b'
