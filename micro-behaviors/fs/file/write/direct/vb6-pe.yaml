defaults:
  for: [pe]
  platforms: [windows]

traits:
  - id: vb6-put-owner3
    desc: VB6 runtime binary file write
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: vbaPutOwner3

  - id: vb6-put-owner3-text
    desc: References the VB6 binary file-write helper name
    crit: notable
    conf: 0.9
    if:
      type: text
      exact: __vbaPutOwner3
    unless:
      - id: vb6-put-owner3

composite_rules:
  - id: vb6-binary-file-write
    desc: VB6 runtime opens and writes file
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/fs/file/open::vb6-file-open
      - id: vb6-put-owner3
