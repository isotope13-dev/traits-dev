defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  # The npm `write` module is a thin file-writing helper. An import establishes
  # the capability even when its call target is aliased (for example
  # `write.sync(...)`) and therefore cannot be recognized as an fs member call.
  - id: node-write-helper-import
    desc: Imports Node write file helper
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'from ["'']write["'']|require\(["'']write["'']\)'

  - id: node-write-file-sync
    desc: Node synchronously writes a file
    crit: notable
    if:
      type: symbol
      kind: member
      regex: '(^|\.)writeFileSync$'

  - id: node-write-file-sync-call
    desc: Node calls imported writeFileSync
    crit: notable
    if:
      type: symbol
      kind: call
      # The extractor preserves the receiver for member calls (for example
      # `_store.writeFileSync`) but emits the bare name for destructured
      # imports.  Both forms are the same file-write API capability.
      regex: '(^|\.)writeFileSync$'

  - id: node-writes-javascript-path
    desc: Node writes a JavaScript file path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'writeFileSync\s*\([^)]{0,180}\.m?js["'']'
  - id: node-prepends-import-to-source
    desc: Node prepends an import to source
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)writeFileSync\s*\(\s*\w*(file|entry)\w*\s*,\s*\w*import\w*\s*\+'
  - id: node-temp-script-path
    desc: Temporary script.js path
    crit: component
    conf: 0.82
    if:
      type: text
      word: script.js
  - id: node-append-file-sync
    desc: Node synchronously appends to a file
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: appendFileSync

  - id: js-file-write
    desc: Writes file via Node.js fs
    crit: baseline
    if:
      type: text
      regex: 'fs\.write(File)?Sync\s*\('

  # Any receiver, not just a namespace literally spelled `fs`: bundlers rename
  # the namespace (`fs2`, `fs$1`) and obfuscator.io dispatches it through an
  # opaque local, so anchoring on `fs` missed most shipped code. Requiring the
  # call parens keeps type declarations and property tables out.
  #
  # `type: encoded` is required for the obfuscator.io spelling that hex-escapes
  # the property name (`obj['\x77\x72\x69\x74\x65\x46\x69\x6c\x65'](...)`);
  # raw text never contains the clear `writeFile` token.
  - id: js-bracket-file-write
    desc: Node bracket-named file write call
    crit: notable
    conf: 0.86
    if:
      type: encoded
      regex: "[A-Za-z_$][\\w$]{0,24}\\[['\"]writeFile(Sync)?['\"]\\]\\s*\\("
  - id: etc-hosts-literal
    desc: References /etc/hosts path
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      exact: /etc/hosts
  - id: js-windows-hosts-path
    desc: Windows hosts file path
    crit: component
    conf: 0.94
    if:
      type: text
      regex: '(?i)(system32[\\/].{0,24}drivers[\\/].{0,24}etc[\\/]hosts|drivers[\\/]+etc[\\/]hosts)'
  # `writeFileSync(p, readFileSync(p, 'utf8').replace(...))`: a file is edited
  # in place through a regex replace. Codemods and scaffolders do this to
  # project files; composites decide whether the target is one of those or an
  # installed module.
  - id: node-read-replace-write-in-place
    desc: Edits a file in place with replace()
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'writeFileSync\s*\([^)]{0,40},\s*readFileSync\s*\([^)]{0,40}\)\s*\.replace\s*\('
composite_rules:
  - id: js-etc-hosts-write
    desc: Writes to /etc/hosts via Node.js
    crit: suspicious
    conf: 0.9
    attack: T1562.006
    # Keep the write API and hosts path close together. A bundled @types/node
    # declaration can contain both writeFileSync() and documentation
    # mentioning /etc/hosts, but that is not a write operation.
    near_bytes: 128
    all:
      - id: js-file-write
    any:
      - id: etc-hosts-literal
      - id: js-windows-hosts-path
