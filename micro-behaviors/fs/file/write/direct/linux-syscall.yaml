# Direct syscall instructions expose the same neutral capabilities as imports.
# Presence does not establish execution or malicious intent.
defaults:
  platforms: [linux]
  for: [elf]
  crit: baseline
  conf: 0.9
traits:
  - id: write-syscall
    desc: Writes file descriptor via Linux syscall
    if:
      type: syscall
      name: [write, writev]
  - id: pwrite-syscall
    desc: Writes a file at an explicit offset
    if:
      type: syscall
      name: [pwrite64, pwritev, pwritev2]
