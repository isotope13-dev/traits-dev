defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-write-file-promise
    desc: Node asynchronously writes a file
    crit: notable
    conf: 0.9
    unless:
      # Emscripten and similar WASM runtimes commonly expose a virtual
      # filesystem as `const fs = instance.FS`; its writeFile method is not a
      # host Node.js filesystem write.
      - type: text
        regex: '\b(const|let|var)\s+fs\s*=\s*[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)*\.FS\b'
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(fs[\w$]{0,3})\.writeFile$'

  - id: node-fs-promises-write-file
    desc: Node fs.promises asynchronously writes a file
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: fs.promises.writeFile

  # `import { writeFile } from 'node:fs/promises'` leaves a bare call target,
  # so the receiver-anchored matcher above never sees the modern spelling —
  # a package that stages a downloaded file this way showed no write at all.
  # Pair the module import with the bare call rather than loosening the call:
  # an unqualified `writeFile(...)` alone is any project's own helper.
  - id: node-fs-promises-import
    desc: Imports the Node fs/promises API
    crit: baseline
    conf: 0.95
    if:
      type: import
      regex: '^(node:)?fs/promises$'

  - id: write-file-call-target
    desc: Calls an unqualified writeFile function
    crit: component
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^writeFile$'

composite_rules:
  - id: node-write-file-promise-destructured
    desc: Node writes a file via destructured import
    crit: notable
    conf: 0.9
    all:
      - id: node-fs-promises-import
      - id: write-file-call-target
