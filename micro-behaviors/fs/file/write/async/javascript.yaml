defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-write-file-promise
    desc: Node asynchronously writes a file
    crit: notable
    conf: 0.9
    unless:
      # Emscripten and similar WASM runtimes commonly expose a virtual
      # filesystem as `const fs = instance.FS`; its writeFile method is not a
      # host Node.js filesystem write.
      - type: text
        regex: '\b(const|let|var)\s+fs\s*=\s*[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)*\.FS\b'
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(fs[\w$]{0,3})\.writeFile$'
