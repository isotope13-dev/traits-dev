defaults:
  platforms:
    - unix
    - windows
  for: [go, binaries]
traits:
  - id: read-go
    desc: Go os.File Read method
    crit: baseline
    conf: 0.66
    if:
      type: text
      regex: os\.\(\*File\)\.Read
  - id: os-readfile
    desc: Read file contents via os.ReadFile
    crit: baseline
    conf: 0.9
    for: [go]
    if:
      type: symbol
      exact: os.ReadFile
  - id: ioutil-readfile
    desc: Read file contents via ioutil.ReadFile
    crit: baseline
    conf: 0.9
    for: [go]
    if:
      type: symbol
      exact: ioutil.ReadFile

  - id: go-buffer-read-string
    desc: Go reads a delimited line
    crit: notable
    conf: 0.88
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.ReadString$'

composite_rules:
  - id: go-file-tail-reader
    desc: Go reads a file after seeking to end
    crit: notable
    conf: 0.91
    for: [go]
    near_lines: 80
    all:
      - id: micro-behaviors/fs/file/open::os-openfile
      - id: micro-behaviors/data/buffer::go-seek-call
      - id: go-buffer-read-string
