defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, shell, powershell, ruby, perl, php]

traits:
  - id: file-read-request-token
    desc: File-read request command token
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp, csharp, python]
    if:
      type: literal
      regex: '^(ReadFile|ReadPath|FetchFile|GetFile)$'
  - id: file-read-api-call
    desc: Calls JavaScript readFile API
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)readFile$'

  - id: powershell-get-content-command
    desc: Reads file content with PowerShell Get-Content
    crit: notable
    conf: 0.9
    for: [powershell]
    if:
      type: text
      regex: '(?i)(^|[;|\n]\s*)Get-Content\s+'

  - id: shell-cat-absolute-path-read
    desc: Shell cat command reads an absolute path
    crit: notable
    conf: 0.86
    for: [shell]
    if:
      type: text
      regex: '(?i)cat[[:space:]]+(/|~|\\$HOME)'

  - id: python-shell-cat-root-home-file
    desc: Python reads root-home file via shell
    crit: notable
    conf: 0.97
    for: [python]
    platforms: [unix]
    if:
      type: symbol
      kind: call
      exact: os.system
      arg:
        kind: string
        regex: '^(/bin/)?cat[ \t]+/root/[^ \t;&|]+'
