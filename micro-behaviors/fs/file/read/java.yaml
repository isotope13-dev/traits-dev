defaults:
  platforms: [qnx, unix, windows]
  for: [java, class, java_class, jar]

traits:
  - id: java-fileinputstream-class
    desc: Java imports the FileInputStream reader
    crit: component
    conf: 0.9
    for: [class, jar, zip]
    if:
      type: import
      exact: java/io/FileInputStream

  - id: jvm-io-file-class-ref
    desc: JVM File API class reference
    crit: component
    conf: 0.86
    for: [class, jar, zip]
    if:
      type: value
      path: class.class_refs[*]
      regex: '^java/io/File(/|$)'

  - id: jvm-nio-file-class-ref
    desc: JVM NIO file API reference
    crit: component
    conf: 0.86
    for: [class, jar, zip]
    if:
      type: value
      path: class.class_refs[*]
      regex: '^java/nio/file(/|$)'

  # Single canonical readAllBytes atom. There used to be a second one,
  # `jvm-readallbytes-bytecode`, whose hex pattern
  # (72 65 61 64 41 6C 6C 42 79 74 65 73) is the ASCII of this very substring,
  # scoped to a subset of these file types -- so every .class and .jar reported
  # the same call twice under two ids, splitting one signal across two ML
  # features. The composites that referenced the bytecode spelling now
  # reference this atom, which already covered class/jar.
  - id: java-readallbytes
    desc: Java reads whole file bytes
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: readAllBytes

  - id: java-dot-cmd-file-read
    desc: Java reads bytes from dot-cmd file
    crit: notable
    conf: 0.96
    for: [java]
    if:
      type: text
      regex: 'Files\.readAllBytes\s*\(\s*(Paths\.get|Path\.of)\s*\([^)]{0,200}["'']\.cmd["'']'
