defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.95

traits:
  - id: pread-file-header-syscall
    desc: Reads 64-byte header at file offset zero
    if:
      type: syscall
      name: [pread64]
      args:
        - index: 2
          value: 64
        - index: 3
          value: 0
