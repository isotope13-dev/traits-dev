defaults:
  for: [pe]
  platforms: [windows]

traits:
  # VB6 p-code OpenFile input followed by GetRec3. The opcodes encode file
  # access performed by the interpreter and therefore have no Win32 IAT leg.
  - id: vb6-pcode-binary-record-read
    desc: VB6 p-code reads a binary record
    crit: notable
    conf: 0.97
    if:
      type: hex
      pattern: 'FE 5D 20 01 [0-128] FC 75'
      section: .text
