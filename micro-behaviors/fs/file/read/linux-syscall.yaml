# Direct syscall instructions expose the same neutral capabilities as imports.
# Presence does not establish execution or malicious intent.
defaults:
  platforms: [linux]
  for: [elf]
  crit: baseline
  conf: 0.9
traits:
  - id: read-syscall
    desc: Reads file descriptor via Linux syscall
    if:
      type: syscall
      name: [read, readv]
  - id: pread-syscall
    desc: Reads a file at an explicit offset
    if:
      type: syscall
      name: [pread64, preadv, preadv2]
