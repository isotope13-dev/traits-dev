defaults:
  platforms: [ios, openwrt, windows]
  for: [csharp, pe, dll]

traits:
  - id: filestream-open-read
    desc: FileStream open for read
    crit: baseline
    conf: 0.86
    for: [csharp]
    platforms: [windows]
    if:
      type: text
      regex: 'new FileStream\(\w+,\s*FileMode\.Open,\s*FileAccess\.Read\)'
    not:
      - regex: 'new\s+BinaryReader\s*\(\s*new FileStream\('

  - id: dotnet-readallbytes-token
    desc: .NET ReadAllBytes method reference
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: 'ReadAllBytes|File\.ReadAllBytes'
