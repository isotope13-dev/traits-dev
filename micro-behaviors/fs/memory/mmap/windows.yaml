defaults:
  for:
    - pe
    - dll
  platforms:
    - windows
traits:
  - id: win32-file-mapping
    conf: 0.8
    crit: baseline
    desc: Uses Windows API for file mapping
    if:
      type: text
      regex: (CreateFileMapping[AW]|MapViewOfFile|UnmapViewOfFile)
  - id: win32-file-mapping-source
    conf: 0.86
    crit: notable
    desc: Uses Win32 file mapping in source
    for:
      - c
    if:
      type: string_literal
      regex: (CreateFileMapping[AW]|MapViewOfFile|UnmapViewOfFile)
  # Relocated from objectives/impact/infect/binary/windows-executable, where it
  # was named `pe-asm-mapped-file-edit` ("PE source maps file for edit"). The
  # matcher only sees the mandatory Win32 mmap call pair — you cannot memory-map
  # a file on Windows without both — so every portable mmap wrapper (CaboCha,
  # MeCab, LevelDB, SQLite, any cross-platform reader) read as an infector. The
  # infection intent lives in the composites' other legs, which still reference
  # this atom cross-directory.
  - id: win32-file-mapping-pair-source
    conf: 0.94
    crit: notable
    desc: Win32 CreateFileMapping+MapViewOfFile pair
    for:
      - c
      - cpp
      - text
    if:
      type: text
      regex: 'CreateFileMapping[A-Z]?[\s\S]{0,800}MapViewOfFile'
    unless:
      - id: well-known/tool/sysadmin/chroot-win/
      - id: well-known/app/obs-studio
      - id: well-known/lib/ggml
      - id: well-known/lib/hpc
      - id: metadata/package/files/dependency::node-modules-path
      - type: text
        substr: CreateFileMappingFromApp
  - id: create-file-w-source
    conf: 0.72
    crit: component
    desc: Uses CreateFileW in source
    for:
      - c
    if:
      type: string_literal
      substr: CreateFileW
  - id: create-file-mapping-w
    desc: Create a named file-mapping object (wide)
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      exact: CreateFileMappingW
  - id: create-file-mapping-w-import
    desc: CreateFileMappingW API call
    crit: component
    if:
      type: text
      word: CreateFileMappingW
  - id: map-view-of-file
    desc: Map a file section into memory
    crit: baseline
    conf: 0.8
    if:
      type: symbol
      exact: MapViewOfFile
composite_rules:
  - id: ntdll-image-remap-cluster
    desc: NTDLL image remap API cluster
    crit: suspicious
    conf: 0.9
    attack: T1027
    mbc: B0032
    all:
      - id: micro-behaviors/fs/file/open::file-create-win
      - id: create-file-mapping-w
      - id: map-view-of-file
      - id: micro-behaviors/os/module/load::get-module-handle-ansi
      - id: micro-behaviors/process/enumerate/psapi::k32-get-module-information
    any:
      - id: micro-behaviors/mem/protect/modify::virtual-alloc
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-dup
      - id: micro-behaviors/process/inject/runtime/call::read-process-memory
    unless:
      - id: well-known/app/bitwarden::bitwarden-app
      - id: micro-behaviors/process/inject/dll::create-remote-thread
      - id: metadata/binary/metrics/threshold::many-imports-100
      - id: metadata/binary/metrics/threshold::many-exports-100
  - id: win32-file-mapping-source-cluster
    desc: File mapping infection workflow in source
    crit: notable
    conf: 0.9
    any:
      - id: win32-file-mapping-source
      - id: create-file-w-source
    downgrade:
      any:
        - id: metadata/library/python-runtime::python-runtime
