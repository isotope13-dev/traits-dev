defaults:
  crit: baseline
  platforms: [linux, macos]
  for: [elf, macho, c, cpp]
traits:
  - id: mmap-fn
    desc: Maps files or devices with mmap
    conf: 0.86
    for: [c, cpp]
    if:
      type: symbol
      exact: mmap
  - id: mmap64-fn
    desc: Maps files or devices into memory
    conf: 0.66
    if:
      type: symbol
      exact: mmap64
  - id: munmap
    desc: Unmap files from memory
    conf: 0.66
    if:
      type: symbol
      regex: munmap
    unless:
      # The anchored import atom below is canonical on binaries (the symbol
      # family includes imports, so both would otherwise report the same
      # import twice). Keep this atom for static binaries and sources, where
      # no import record exists.
      - id: micro-behaviors/fs/memory/mmap::munmap-import
  - id: munmap-import
    desc: Unmap memory import (munmap)
    conf: 0.9
    if:
      type: import
      regex: '^_?munmap$'
composite_rules:
  - id: mmap
    desc: Maps files or devices into memory
    conf: 0.66
    any:
      - id: mmap-fn
      - id: micro-behaviors/mem/alloc/executable::mmap-symbol
      - id: mmap64-fn
