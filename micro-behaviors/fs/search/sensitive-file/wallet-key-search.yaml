defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.94

traits:
  - id: find-ethereum-keystore-pattern
    desc: Find uses Ethereum keystore filename pattern
    if:
      type: symbol
      kind: call
      exact: find
      arg:
        kind: string
        exact: UTC--*

  - id: grep-extended-private-key-reference
    desc: Grep argument references private key prefix
    if:
      type: symbol
      kind: call
      regex: '^(grep|egrep|rg)$'
      arg:
        kind: string
        substr: xprv

  - id: find-seed-phrase-pattern
    desc: Find uses a seed phrase filename pattern
    if:
      type: text
      exclude_comments: true
      regex: '(?im)^\s*find\b[^\n]{0,160}-i?name\s+["''][^"'']{0,30}(seed.{0,20}phrase|mnemonic)'
