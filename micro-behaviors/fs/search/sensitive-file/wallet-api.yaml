defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.8
traits:
- id: wallet-path-glob-or-walk-call
  desc: Globs or walks a quoted wallet path
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)\b(glob|walk)\s*\(\s*["'][^"'\n]{0,60}\b(wallet|keystore)\b
