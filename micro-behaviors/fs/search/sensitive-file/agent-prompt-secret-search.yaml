# A natural-language task that tells an agent to walk the filesystem for wallet
# keystores, environment files or private keys. The prompt is text only: it
# establishes that a search is requested, not that an agent ran it. The
# search-task phrase is a capability fact about what the instruction asks an
# agent to do; the attack claim comes from the objective composite.
defaults:
  platforms: [unix, windows]
  for: [source, scripts]
  attack: T1552.001

traits:
  - id: agent-prompt-secret-search
    desc: Agent prompt recursively finds secret files
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)recursively search[\s\S]{0,800}\b(wallet|keystore|id_rsa|\.env)'
