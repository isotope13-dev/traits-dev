defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: python-node-path-lookup
    desc: Looks up Node.js on PATH with shutil.which
    crit: notable
    conf: 0.99
    if:
      type: symbol
      kind: call
      exact: shutil.which
      arg:
        index: 0
        kind: string
        exact: node
