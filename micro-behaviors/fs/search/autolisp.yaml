defaults:
  for: [text]
  platforms: [windows]
  crit: notable
  conf: 0.95
traits:
  - id: autocad-startup-script-lookup
    desc: Resolves AutoCAD startup script search path
    if:
      type: text
      regex: '(?i)\(\s*findfile\s+"acad(doc)?\.lsp"\s*\)'
  - id: autocad-support-directory-lookup
    desc: Resolves AutoCAD base.dcl support file
    if:
      type: text
      regex: '(?i)\(\s*findfile\s+"base\.dcl"\s*\)'

  - id: autolisp-lsp-file-listing
    desc: AutoLISP enumerates Lisp source filenames
    for: [text, static-lib]
    conf: 0.9
    if:
      type: text
      regex: '(?i)vl-directory-files[^\r\n]{0,60}\.lsp'

  - id: autolisp-mnl-file-listing
    desc: AutoLISP enumerates menu Lisp filenames
    if:
      type: text
      regex: '(?i)vl-directory-files[^\r\n]{0,60}\.mnl'

  - id: autocad-menu-lisp-lookup
    desc: Resolves AutoCAD menu Lisp path
    if:
      type: text
      regex: '(?i)\(\s*findfile\s+"acad\.mnl"\s*\)'

  - id: autocad-executable-lookup
    desc: Resolves AutoCAD executable search path
    if:
      type: text
      regex: '(?i)\(\s*findfile\s+"acad\.exe"\s*\)'
