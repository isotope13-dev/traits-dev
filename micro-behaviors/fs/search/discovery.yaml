# Cross-mechanism discovery evidence used by acquisition consumers.
# A filename-predicate search still supplies traversal evidence after relocation.
composite_rules:
- id: recursive-file-discovery
  desc: Traversal or application-bundle search evidence
  crit: component
  conf: 0.9
  platforms: [unix, windows, android]
  any:
  - id: micro-behaviors/fs/directory/traverse/
  - id: micro-behaviors/fs/search::find-app-bundle
