defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, shell, batch, powershell, python]
  crit: notable
  conf: 0.9

traits:
  - id: vscode-cli-path-probe
    desc: Probes PATH for the VS Code CLI
    if:
      type: literal
      kind: string
      regex: '^(which|where)(\.exe)?\s+code(-insiders)?\s*($|[;&|])'

  - id: vscodium-cli-path-probe
    desc: Probes PATH for the VSCodium CLI
    if:
      type: literal
      kind: string
      regex: '\b(which|where)\s+(vs)?codium\b'

  - id: vscode-fork-cli-path-probe
    desc: Probes PATH for a VS Code fork
    if:
      type: literal
      kind: string
      regex: '\b(which|where)\s+(cursor|windsurf|positron)\b'

  # Bundled stagers commonly construct `which <name> --...` from fragments,
  # so the literal command is not present as one token. This remains a
  # neutral process-discovery capability; editor identity is separate below.
  - id: cli-path-probe-command-builder
    desc: Builds a which CLI path-probe command
    if:
      type: text
      regex: "['\"]which['\"]\\s*\\+\\s*['\"]\\\\x20['\"]"

