# DOS environment block `PATH=` prefix used when scanning the PSP environment
# segment (`CS:[002Ch]`) for executable search directories.
defaults:
  platforms: [windows, unix]
  for: [dos_com]
  size_max: 65536

traits:
  - id: dos-psp-env-path-marker
    desc: DOS PATH= environment search marker
    crit: notable
    conf: 0.85
    if:
      type: hex
      pattern: "50 41 54 48 3D"
