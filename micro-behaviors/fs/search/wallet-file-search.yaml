defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
  attack: T1552.001

traits:
- id: shell-find-wallet-glob
  desc: "find command with wallet-name wildcard"
  crit: notable
  conf: 0.92
  platforms: [unix]
  for: [shell, python, javascript, typescript, ruby, go, applescript]
  if:
    type: text
    regex: '\bfind\b[^\n]{0,180}-iname\s+["'']\*wallet\*["'']'
- id: shell-find-keystore-glob
  desc: "Keystore-name search predicate"
  crit: notable
  conf: 0.9
  platforms: [unix]
  for: [shell, python, javascript, typescript, ruby, go, applescript]
  if:
    type: text
    regex: '-iname\s+["'']\*keystore\*["'']'
- id: shell-find-id-json-name
  desc: "id.json name search predicate"
  crit: notable
  conf: 0.86
  platforms: [unix]
  for: [shell, python, javascript, typescript, ruby, go, applescript]
  if:
    type: text
    regex: '-iname\s+["'']id\.json["'']'
- id: macho-shell-find-iname-filter
  desc: "Case-insensitive filename-search option"
  crit: component
  conf: 0.9
  platforms: [macos]
  for: [macho]
  if:
    type: text
    substr: -iname
- id: macho-shell-find-maxdepth
  desc: "File-search depth-limit option"
  crit: component
  conf: 0.88
  platforms: [macos]
  for: [macho]
  if:
    type: text
    substr: -maxdepth
- id: applescript-find-command
  desc: "find command token"
  crit: component
  conf: 0.9
  platforms: [unix]
  for: [applescript]
  if:
    type: text
    word: find
- id: applescript-find-wallet-glob
  desc: "Wallet-name wildcard text"
  crit: component
  conf: 0.9
  platforms: [unix]
  for: [applescript]
  if:
    type: text
    substr: '*wallet*'
- id: applescript-find-keystore-glob
  desc: "Keystore-name wildcard text"
  crit: component
  conf: 0.88
  platforms: [unix]
  for: [applescript]
  if:
    type: text
    substr: '*keystore*'
- id: powershell-wallet-glob
  desc: "Wallet-name wildcard literal"
  crit: component
  conf: 0.9
  for: [powershell]
  if:
    type: literal
    substr: '*wallet*'
- id: powershell-keystore-glob
  desc: "Keystore-name wildcard literal"
  crit: component
  conf: 0.88
  for: [powershell]
  if:
    type: literal
    substr: '*keystore*'
composite_rules:
- id: applescript-find-wallet-target
  desc: "find token near wallet-name wildcard"
  crit: component
  platforms: [unix]
  for: [applescript]
  near_bytes: 512
  all:
  - id: micro-behaviors/fs/search::applescript-find-command
  - id: micro-behaviors/fs/search::applescript-find-wallet-glob
- id: applescript-find-keystore-target
  desc: "find token near keystore-name wildcard"
  crit: component
  platforms: [unix]
  for: [applescript]
  near_bytes: 512
  all:
  - id: micro-behaviors/fs/search::applescript-find-command
  - id: micro-behaviors/fs/search::applescript-find-keystore-glob
- id: applescript-find-id-json-target
  desc: "find token near id.json filename"
  crit: component
  platforms: [unix]
  for: [applescript]
  near_bytes: 512
  all:
  - id: micro-behaviors/fs/search::applescript-find-command
  - id: micro-behaviors/fs/path/config/app::id-json-filename-text
- id: shell-find-wallet-target
  desc: "Wallet-name search evidence"
  crit: component
  platforms: [unix]
  for: [shell, python, javascript, typescript, ruby, go, applescript]
  any:
  - id: micro-behaviors/fs/search::shell-find-wallet-glob
  - id: micro-behaviors/fs/search::applescript-find-wallet-target
- id: shell-find-keystore-target
  desc: "Keystore-name search evidence"
  crit: component
  platforms: [unix]
  for: [shell, python, javascript, typescript, ruby, go, applescript]
  any:
  - id: micro-behaviors/fs/search::shell-find-keystore-glob
  - id: micro-behaviors/fs/search::applescript-find-keystore-target
- id: shell-find-id-json-target
  desc: "id.json filename-search evidence"
  crit: component
  platforms: [unix]
  for: [shell, python, javascript, typescript, ruby, go, applescript]
  any:
  - id: micro-behaviors/fs/search::shell-find-id-json-name
  - id: micro-behaviors/fs/search::applescript-find-id-json-target
- id: wallet-shell-search
  desc: "Wallet-name search with related file targets"
  crit: suspicious
  conf: 0.94
  platforms: [unix]
  for: [shell, python, javascript, typescript, ruby, go, applescript]
  near_bytes: 512
  all:
  - id: micro-behaviors/fs/search::shell-find-wallet-target
  any:
  - id: micro-behaviors/fs/search::shell-find-keystore-target
  - id: micro-behaviors/fs/search::shell-find-id-json-target
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/threat-intel/
- id: wallet-powershell-search
  desc: "Recursive search with wallet-name targets"
  crit: suspicious
  conf: 0.94
  for: [powershell]
  near_bytes: 512
  all:
  - id: micro-behaviors/fs/directory/traverse::powershell-recursive-child-item
  - id: micro-behaviors/fs/search::powershell-wallet-glob
  any:
  - id: micro-behaviors/fs/search::powershell-keystore-glob
  - id: micro-behaviors/fs/path/config/app::id-json-filename-literal
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/threat-intel/
- id: id-json-search-options
  desc: "id.json search options and stderr suppression"
  crit: suspicious
  conf: 0.94
  platforms: [macos]
  for: [macho]
  near_bytes: 512
  all:
  - id: micro-behaviors/fs/search::macho-shell-find-maxdepth
  - id: micro-behaviors/fs/search::macho-shell-find-iname-filter
  - id: micro-behaviors/fs/path/config/app::id-json-filename-text
  - id: micro-behaviors/os/console/io::stderr-to-dev-null
  unless:
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/threat-intel/
