defaults:
  platforms: [unix, windows]
  for: [php]
  crit: notable
traits:
  - id: php-glob-call
    desc: PHP searches paths with a glob pattern
    if:
      type: symbol
      kind: call
      exact: glob
  - id: php-recursive-php-extension-filter
    desc: PHP recursively filters for .php files
    conf: 0.92
    if:
      type: text
      regex: 'RecursiveIteratorIterator[\s\S]{0,260}getExtension\(\) !== .php'
