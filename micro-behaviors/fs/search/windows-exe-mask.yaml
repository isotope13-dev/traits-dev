defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
  - id: exe-wildcard-data-bytes
    desc: EXE wildcard search-mask bytes
    crit: notable
    conf: 0.9
    if:
      type: hex
      # ANSI or UTF-16 \*.exe; compilers place masks in differing sections.
      pattern: "(5C 2A 2E 65 78 65 | 5C 00 2A 00 2E 00 65 00 78 00 65 00)"
      offset_range: [0, null]

