defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
traits:
  # Four CString suffix comparisons jump to the same filename action.
  # Retain the converging branch distances; mask addresses and frame offsets.
  # This is a selection capability, not a claim that the action is hostile.
  - id: x86-four-suffix-shared-action
    desc: x86 four-suffix shared-action filter
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: any
      pattern: '8B 54 24 ?? 68 ?? ?? ?? ?? 52 FF D5 83 C4 08 85 C0 74 49 8B 44 24 ?? 68 ?? ?? ?? ?? 50 FF D5 83 C4 08 85 C0 74 36 8B 4C 24 ?? 68 ?? ?? ?? ?? 51 FF D5 83 C4 08 85 C0 74 23 8B 54 24 ?? 68 ?? ?? ?? ?? 52 FF D5 83 C4 08 85 C0 74 10 [16] 8B 4C 24 ?? 51 FF 15 ?? ?? ?? ??'
