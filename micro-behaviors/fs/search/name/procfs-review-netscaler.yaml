defaults:
  platforms: [netscaler, appliance, unix]
  for: [scripts, binaries, go, java, kotlin, csharp, swift]

traits:
  - id: nsconfig-lua-find-command
    desc: NetScaler configuration Lua file search command
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'find /nsconfig -name .{0,40}\*\.lua'
