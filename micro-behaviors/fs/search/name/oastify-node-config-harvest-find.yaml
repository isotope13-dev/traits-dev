defaults:
  platforms: [windows, unix]
  for: [package.json]
traits:
  - id: node-config-harvest-find
    desc: Searches for config, JSON and INI files
    crit: notable
    conf: 0.98
    if:
      type: value
      path: "scripts.preinstall"
      substr: 'find /tmp/home -maxdepth 4 -name "*config*" -o -name "*.json" -o -name "*.ini"'
