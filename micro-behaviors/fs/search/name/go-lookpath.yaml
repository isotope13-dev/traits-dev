defaults:
  platforms: [windows, unix]
  for: [go]
traits:
  - id: exec-lookpath
    desc: "Go exe path resolution via exec.LookPath"
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: "exec.LookPath"
  - id: exec-lookpath-gdb
    desc: Checks for the GDB executable
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: exec.LookPath
      arg:
        kind: string
        exact: gdb
    unless:
      - id: well-known/tool/detection/stackrox::vm-fixture-context
  - id: exec-lookpath-lldb
    desc: Checks for the LLDB executable
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: exec.LookPath
      arg:
        kind: string
        exact: lldb
    unless:
      - id: well-known/tool/detection/stackrox::vm-fixture-context
  - id: exec-lookpath-strace
    desc: Checks for the strace executable
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: exec.LookPath
      arg:
        kind: string
        exact: strace
    unless:
      - id: well-known/tool/detection/stackrox::vm-fixture-context
  - id: exec-lookpath-ltrace
    desc: Checks for the ltrace executable
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: exec.LookPath
      arg:
        kind: string
        exact: ltrace
    unless:
      - id: well-known/tool/detection/stackrox::vm-fixture-context
  - id: exec-lookpath-dtrace
    desc: Checks for the dtrace executable
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: exec.LookPath
      arg:
        kind: string
        exact: dtrace
    unless:
      - id: well-known/tool/detection/stackrox::vm-fixture-context
composite_rules:
  - id: debugger-tool-lookup
    desc: Checks for debugger or tracing executables
    crit: notable
    conf: 0.9
    any:
      - id: exec-lookpath-gdb
      - id: exec-lookpath-lldb
      - id: exec-lookpath-strace
      - id: exec-lookpath-ltrace
      - id: exec-lookpath-dtrace
