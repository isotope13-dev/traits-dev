defaults:
  platforms:
  - unix
  - windows
  for:
  - php
  crit: notable
traits:
- id: glob-call
  desc: Calls glob for filename search
  if:
    type: symbol
    kind: call
    regex: (^|\.)glob$
  for:
  - php
  - python
  - pyc
- id: php-recursive-php-extension-filter
  desc: PHP recursively filters for .php files
  conf: 0.92
  if:
    type: text
    regex: RecursiveIteratorIterator[\s\S]{0,260}getExtension\(\) !== .php
