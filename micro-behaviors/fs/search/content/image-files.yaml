defaults:
  platforms: [windows, unix]
  for: [python, shell, powershell, javascript, typescript]

traits:
  - id: search-image-extensions
    desc: "Image filename wildcard literals"
    crit: notable
    conf: 0.8
    if:
      type: string_literal
      regex: '\*\.jpe?g|\*\.png'
      case_insensitive: true
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
