defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: walk-skips-dotdirs
    desc: Directory walk filters hidden directories
    if:
      type: text
      regex: 'dirs\[:\][^\n]{0,60}not\s+\w+\.startswith\(\s*["\x27]\.["\x27]'


  - id: walk-skips-dotfiles
    desc: Continues past dot-prefixed loop entries
    if:
      type: text
      regex: 'if\s+\w+\.startswith\(\s*["'']\.["'']\s*\)\s*:\s*continue\b'

