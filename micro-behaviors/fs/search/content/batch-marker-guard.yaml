defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-extracts-marked-self-lines
    desc: FIND extracts marked self lines to file
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)find\s+"[^"\r\n]{1,24}"<%0\.bat>[A-Za-z]:\\[^\s\r\n>]{1,32}'

  - id: batch-skips-marker-bearing-parameter-file
    desc: Batch skips marker-bearing parameter files
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)find /i ".{1,32}"<%1>nul[\s\S]{0,80}if not errorlevel 1 goto'
