defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
  - gyp
  attack: T1567

traits:
  # grep's recursive flag: the content-search form of a filesystem sweep.
  - id: grep-recursive-flag
    desc: grep command carries recursive flag
    crit: baseline
    conf: 0.9
    for: [shell, javascript, typescript, gyp]
    if:
      type: raw
      regex: 'grep\s+[^|\n;&]{0,30}-[a-zA-Z]*r[a-zA-Z]*\s'
composite_rules:
- id: grep-two-system-root-args
  desc: Grep command names two system-root operands
  crit: notable
  conf: 0.98
  for: [shell, javascript, typescript, gyp]
  any:
  - id: shell-grep-system-root-operands
  - id: embedded-grep-system-root-command
# One recursive content grep across several system roots (/root, /etc, /opt,
# /var, /tmp, /workspace, /home). A single root is ordinary administration;
# sweeping many at once is harvest-shaped. The intent comes from consumers
# that pair it with an outbound sink.
- id: grep-content-multi-system-root-sweep
  desc: Recursive grep has system-root arguments
  crit: notable
  conf: 0.9
  for: [shell, javascript, typescript, gyp]
  near_bytes: 300
  all:
  - id: grep-recursive-flag
  - id: grep-two-system-root-args
- id: wallet-file-search
  desc: Wallet filename-search evidence
  crit: component
  for:
  - scripts
  - source
  any:
  - id: micro-behaviors/fs/search/sensitive-file::wallet-shell-search
  - id: micro-behaviors/fs/search/sensitive-file::wallet-powershell-search
