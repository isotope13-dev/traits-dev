defaults:
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
traits:
  - id: shell-grep-system-root-operands
    desc: Grep call names two system-root arguments
    for: [shell]
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @grep
           argument: (_) @first argument: (_) @second)
         (#match? @grep "^(/(usr/)?bin/)?grep$")
         (#match? @first "^['\"]?/(root|etc|opt|var|tmp|workspace|home)/?['\"]?$")
         (#match? @second "^['\"]?/(root|etc|opt|var|tmp|workspace|home)/?['\"]?$"))
  - id: embedded-grep-system-root-command
    desc: Embedded grep command names system directories
    for: [javascript, typescript, gyp]
    if:
      type: text
      regex: '\bgrep[ \t]+[^|\n;&]{0,100}(/(root|etc|opt|var|tmp|workspace|home)/?[\s''"]+){2}'
