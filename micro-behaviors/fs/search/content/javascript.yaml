defaults:
  platforms: [linux, windows, macos]
  for: [javascript, typescript]

traits:
  - id: javascript-json-filename-filter
    desc: JavaScript filters JSON filenames
    crit: notable
    conf: 0.84
    unless:
      - id: well-known/tool/sysadmin/k9s
      - id: well-known/lib/format/json-ts
    if:
      # Filtering needs a selection call: a bare .json literal near an
      # includes/indexOf also matches path construction beside an enum or
      # CLI-flag membership probe.
      type: text
      regex: "\\.json['\"`][\\s\\S]{0,180}\\.(filter|find)\\([^()]{0,120}(includes|indexOf)"

  - id: javascript-jsonl-filename-suffix-filter
    desc: JavaScript filters JSONL filenames by suffix
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\.endsWith\s*\(\s*[''"]\.jsonl[''"]\s*\)'
