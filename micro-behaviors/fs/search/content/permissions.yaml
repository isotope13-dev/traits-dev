defaults:
  platforms: [unix]
  for: [shell, python, javascript, typescript, go, rust, java]

traits:
  - id: suid-sgid-file-discovery-command
    desc: Find enumerates SUID or SGID files
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?i)\bfind\b[^\r\n]{0,220}\s+-perm\s+(-0?[42]000|/[42]000|-[ug]=s)\b'
