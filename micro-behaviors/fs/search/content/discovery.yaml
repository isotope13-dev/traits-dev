# Cross-mechanism discovery evidence used by acquisition consumers.
# A filename-predicate search still supplies traversal evidence after relocation.
composite_rules:
- id: recursive-file-discovery
  desc: Traversal or application-bundle search evidence
  crit: component
  conf: 0.9
  platforms: [unix, windows, android]
  any:
  - id: micro-behaviors/fs/directory/traverse/
  - id: micro-behaviors/fs/delete/target::top-level-tree-recursive-delete
  - id: micro-behaviors/fs/search/command::find-exec-recursive-remove
  - id: micro-behaviors/fs/delete/target::shell-find-root-delete
  - id: micro-behaviors/fs/delete/file/script::python-temp-cache-file-cleanup
  - id: micro-behaviors/fs/search/command::python-walk-or-shell-find
  - id: micro-behaviors/fs/directory/enumerate::findfirst
  - id: micro-behaviors/fs/directory/enumerate::findnext
  - id: micro-behaviors/fs/search/command::find-app-bundle
