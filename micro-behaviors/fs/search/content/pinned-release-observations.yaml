traits:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - python
  - ruby
  - php
  - lua
  - perl
  id: source-code-glob-argument
  desc: Glob call with source-code string argument
  crit: notable
  conf: 0.92
  if:
    type: symbol
    kind: call
    regex: (^|\.)(rglob|glob)$
    arg:
      kind: string
      regex: (?i)source\s+code
