defaults:
  platforms: [windows, unix]
  for: [package.json]
traits:
  - id: node-config-harvest-grep
    desc: Searches file content for secret keywords
    crit: suspicious
    conf: 0.98
    if:
      type: value
      path: "scripts.preinstall"
      substr: 'grep -lE "password|pwd|connection|key"'
