defaults:
  platforms: [linux, macos]
  for: [applescript, shell, javascript, typescript]
  crit: component
traits:
- id: locate-token
  desc: locate file-search command token
  for: [shell, applescript]
  if:
    type: text
    word: locate
    case_insensitive: true
- id: grep-keyword
  desc: Contains the grep command keyword
  conf: 0.7
  if:
    type: text
    word: grep
# `find / -type f` is a whole-filesystem sweep. It is the recon step of an
# install-hook harvester, but it is equally a Docker build or an admin cleanup
# script, so the trait is the neutral capability and the intent comes from the
# composites that reference it (e.g. supply-chain recon + database clients).
- id: find-from-filesystem-root
  desc: Sweeps every file from the filesystem root
  crit: notable
  conf: 0.94
  for: [scripts, source]
  platforms: [unix]
  if:
    type: text
    regex: 'find\s+/\s+-type\s+f'
  unless:
  - id: well-known/app/ai/aui-agent-builder/
  - id: well-known/app/productivity/stirling-pdf::source-tree
- id: js-env-file-finder-helper
  desc: JavaScript dotenv finder helper
  for: [javascript, typescript]
  platforms: [unix, windows]
  if:
    type: text
    regex: "find.{0,10}[Ee]nv.{0,10}[Ff]ile"
- id: recursive-secret-key-grep
  desc: Recursively greps files for secret keys
  crit: notable
  conf: 0.9
  for: [shell, python, javascript, go, ruby, perl]
  platforms: [unix]
  if:
    type: text
    regex: 'grep\s+-[A-Za-z]{0,4}r[A-Za-z]{0,4}\s+[''"][^''"]{0,48}(assword|ecret|Seed)'
  unless:
  - id: well-known/app/utility/cmdchamp/
composite_rules:
- id: js-env-file-search
  desc: JavaScript enumerates dotenv configuration files
  crit: notable
  conf: 0.88
  for: [javascript, typescript]
  platforms: [unix, windows]
  near_bytes: 500
  all:
  - id: js-env-file-finder-helper
  - id: micro-behaviors/fs/path/config/environment::env-file-path
