defaults:
  platforms: [windows, unix]
  size_max: 65536
traits:
  - id: dos-int21-find-next
    for: [dos_com, static-lib, data, batch]
    desc: DOS find-next via INT 21h
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 4F [0-32] CD 21"
  - id: dos-int21-find-next-ax
    for: [dos_com, static-lib, data]
    desc: DOS find-next via MOV AX
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 ?? 4F [0-6] CD 21"
  - id: dos-int21-find-next-near
    for: [dos_com, static-lib, data]
    desc: DOS find-next through a near call
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 4F [0-8] E8"
