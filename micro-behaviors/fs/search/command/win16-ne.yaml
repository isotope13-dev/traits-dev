defaults:
  for: [ne]
  platforms: [windows]
  crit: notable

traits:
  - id: win16-ne-int21-find-first
    desc: NE finds first file via INT 21h
    conf: 0.90
    if:
      type: hex
      pattern: "B4 4E [0-16] CD 21"

  - id: win16-ne-int21-find-next
    desc: NE finds next file via INT 21h
    conf: 0.90
    if:
      type: hex
      pattern: "B4 4F [0-16] CD 21"
