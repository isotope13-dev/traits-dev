defaults:
  platforms: [windows]
  for: [lnk]

traits:
  - id: lnk-args-findstr-lnk
    desc: LNK arguments search a shortcut with findstr
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: lnk.arguments
      regex: '\bfindstr(\.exe)?\b.{0,240}\.lnk\b|\.lnk\b.{0,240}\bfindstr(\.exe)?\b'
      case_insensitive: true
  - id: lnk-args-find-lnk
    desc: LNK arguments search a shortcut with find
    crit: suspicious
    conf: 0.9
    if:
      type: value
      path: lnk.arguments
      regex: '\bfind(\.exe)?\b.{0,240}\.lnk\b|\.lnk\b.{0,240}\bfind(\.exe)?\b'
      case_insensitive: true
  - id: lnk-args-select-string-lnk
    desc: LNK args reference Select-String and shortcut
    crit: suspicious
    conf: 0.94
    if:
      type: value
      path: lnk.arguments
      regex: '\bSelect-String\b.{0,240}\.lnk\b|\.lnk\b.{0,240}\bSelect-String\b'
      case_insensitive: true
