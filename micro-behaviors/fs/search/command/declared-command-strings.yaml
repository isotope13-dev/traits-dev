traits:
- id: egrep-credential-keywords-command-string
  desc: String contains egrep for credential keywords
  crit: notable
  conf: 0.95
  platforms:
  - unix
  for:
  - scripts
  - source
  - -shell
  - -batch
  if:
    type: literal
    kind: string
    regex: (?i)\begrep\s+-i\s+["'][^"']{0,60}(token|secret|password)
    exclude_docstrings: true
