defaults:
  platforms: [windows]
  for: [powershell]
traits:
  # Select-String -Quiet returns only whether a file contains the pattern,
  # the form used to pick files by content.
  - id: powershell-select-string-quiet
    desc: Tests a file for a string match
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)\bSelect-String\b[^\r\n]{0,200}-Quiet\b'

  - id: powershell-enumerate-ps1-files
    desc: Enumerates PowerShell script files
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '(?i)(EnumerateFiles|Get-ChildItem)\b[^\r\n]{0,120}\*\.ps1'
