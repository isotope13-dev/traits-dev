defaults:
  platforms: [windows]
  for: [batch]

traits:
  - id: batch-script-extension-loop
    desc: Batch enumerates script file extensions
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)for\s+%+[A-Za-z]\s+in\s*\(\s*"?\*\.(bat|cmd|wbt)"?\s*\)'
  - id: batch-loops-over-bats-and-calls-helper
    desc: Batch calls a helper for BAT files
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)for %%\w[^(]{0,8}\([^)]{0,65}\*\.bat[^)]{0,20}\) do call \S+ %%\w _'
  - id: batch-recursive-executable-enumeration
    desc: Batch recursively enumerates executable files
    crit: notable
    conf: 0.94
    attack: T1083
    mbc: C0049
    if:
      type: text
      regex: '(?i)for\s+/r\s+"\."\s+%%[A-Za-z]\s+in\s+\(\*\.exe\)'
