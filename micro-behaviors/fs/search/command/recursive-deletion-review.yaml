defaults:
  platforms: [windows, unix]
  crit: baseline
  conf: 0.85

traits:
  - id: python-walk-or-shell-find
    desc: References Python walk or recursive find command
    for: [javascript, typescript, python, shell]
    if:
      type: text
      regex: os\.walk|find\s+\./?\s
    unless:
      - id: micro-behaviors/os/security/scan/signature::code-pattern-catalog
  - id: delete-flag-shell
    desc: Shell find command uses delete action
    for: [shell]
    if:
      type: tree-sitter
      language: shell
      query: |
        ((command name: (command_name) @find argument: (_) @flag)
          (#match? @find "(^|/)find$")
          (#match? @flag "^['\"]?-delete['\"]?$"))
        ((command name: (command_name) @sudo argument: (word) @find argument: (_) @flag)
          (#match? @sudo "(^|/)(sudo|busybox|command|exec)$")
          (#match? @find "(^|/)find$")
          (#match? @flag "^['\"]?-delete['\"]?$"))
  - id: absolute-tree-top-level-find
    desc: Find limits absolute tree traversal depth
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\bfind\s+/[A-Za-z0-9_./-]{1,160}\s+[^\r\n]{0,160}-maxdepth\s+1\b'
  - id: find-exec-recursive-remove
    desc: Find recursively removes each match
    crit: notable
    conf: 0.92
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)-exec\s+rm\s+-[a-z]*(rf|fr)[a-z]*\s+\{\}\s+\+'
  - id: find-age-filter
    desc: Find filters by modification age
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)(^|\s)-[amc](min|time)\s+[+-]?\d+\b'
  - id: find-name-exclusion-filter
    desc: Find skips entries matching a name pattern
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\bfind\s[^\r\n]{0,160}\s(!|-not)\s+-(i?name|i?path)\s'
