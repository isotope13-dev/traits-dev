defaults:
  platforms: [macos]
  for: [applescript]
traits:
  - id: applescript-find-command
    desc: AppleScript shell command invokes find
    crit: notable
    conf: 0.96
    if:
      # A word-boundary match also found security's find-generic-password.
      # Require the command position, including escaped embedded script text.
      type: text
      regex: '(?i)\bdo shell script\s+["\\]+(/usr/bin/|/bin/)?find[ \t]+'
