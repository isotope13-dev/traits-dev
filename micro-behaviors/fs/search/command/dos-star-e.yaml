defaults:
  platforms: [windows, unix]
  for: [dos_com, data]
  size_max: 65536

traits:
  # The address loaded into DX must point to the wildcard, rather than
  # merely finding two strings somewhere in the same file.
  - id: dos-star-e-mask-find-first
    desc: DOS searches names with star-e mask
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule dos_star_e_mask_find_first {
          meta:
            filetypes = "dos_com,data"
          strings:
            $find = { BA ?? ?? B4 4E [0-2] ((33 | 31) C9 | 87 CE) CD 21 73 (01 | 03) [0-2] C3 }
            $mask = { 2A 2E (45 | 65) 2A }
          condition:
            for any f in (1..#find) : (
              for any m in (1..#mask) : (
                uint16(@find[f]+1) == 256+@mask[m]
              )
            )
        }
