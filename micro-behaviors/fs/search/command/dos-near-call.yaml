defaults:
  for: [dos_com, static-lib, data]
  platforms: [windows, unix]
  size_max: 65536
traits:
  - id: dos-int21-find-first-near
    desc: Calls DOS find-first through interrupt wrapper
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule dos_find_first_near_wrapper {
          strings:
            $call = { B4 4E E8 ?? ?? }
            $args = { B4 4E (BA ?? ??|8D 96 ?? ??|B9 ?? ??) E8 ?? ?? }
            $helper = { CD 21 C3 }
          condition:
            for any h in (1..#helper) : (
              for any c in (1..#call) : (
                ((@call[c]+5+uint16(@call[c]+3)) % 65536) == @helper[h]
              ) or
              for any a in (1..#args) : (
                ((@args[a]+!args[a]+uint16(@args[a]+!args[a]-2)) % 65536) == @helper[h]
              )
            )
        }
