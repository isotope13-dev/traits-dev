---
defaults:
  platforms:
  - windows
  - unix
  for:
  - php
traits:
- id: php-repeated-ls-text
  desc: Matches 'ls -la'
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: ls -la
- id: php-repeated-find-text
  desc: Matches 'find \. -type f'
  crit: notable
  conf: 0.88
  count_min: 3
  if:
    type: text
    substr: find \. -type f
