defaults:
  platforms: [windows, unix]
  for: [dos_com, static-lib]
  size_max: 65536

traits:
  - id: dos-entry-mask-find-first
    for: [dos_com, data, c]
    desc: DOS entrypoint search mask before find-first
    crit: notable
    conf: 0.90
    if:
      type: hex
      pattern: "2A 2E 2A 00 [0-8] (B4|EF BF BD) 4E"
      offset: 0
  - id: dos-int21-find-first
    for: [dos_com, static-lib, data]
    desc: DOS find-first via INT 21h
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 4E [0-32] CD 21"
  - id: dos-int21-find-first-ax
    for: [dos_com, static-lib, data]
    desc: DOS find-first via MOV AX
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B8 ?? 4E [0-32] CD 21"
  - id: dos-int21-find-first-jump
    for: [dos_com, static-lib, data]
    desc: DOS find-first after a short jump
    crit: notable
    conf: 0.88
    if:
      type: hex
      pattern: "B4 4E EB [0-40] CD 21"
  - id: dos-int21-find-first-near
    for: [dos_com, static-lib, data]
    desc: DOS find-first through a near call
    crit: notable
    conf: 0.86
    if:
      type: hex
      pattern: "B4 4E [0-12] E8"
  - id: dos-int21-find-first-batch
    for: [batch]
    desc: DOS find-first via INT 21h
    crit: notable
    conf: 0.9
    if:
      type: hex
      pattern: "B4 4E [0-16] CD 21"
composite_rules:
  - id: dos-int21-find-first-call
    for: [dos_com, static-lib, data, batch, c]
    desc: DOS find-first syscall
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/fs/search::dos-int21-find-first
      - id: micro-behaviors/fs/search::dos-int21-find-first-batch
      - id: micro-behaviors/fs/search::dos-int21-find-first-ax
      - id: micro-behaviors/fs/search::dos-int21-find-first-near
      - id: micro-behaviors/fs/search::dos-int21-find-first-jump
      - id: micro-behaviors/fs/search::dos-entry-mask-find-first
