defaults:
  for: [batch]
  platforms: [windows]
  size_max: 65536
traits:
  # Entry near jump -> CALL -> default-DTA BAT walk -> mover CALL.
  # No shell label, temporary alias, collector name, or family name is gated.
  - id: micro-behaviors/fs/search::dos-entry-bat-walk-calls-mover
    desc: DOS BAT walk calls file mover
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule dos_entry_bat_walk_mover {
          strings:
            $entry = { 40 47 4F 54 4F 20 ?? 0D 0A 52 45 4D 20 C4 58 58 BC ?? ?? 50 B4 4A BB ?? ?? CD 21 E9 ?? ?? }
            $call = { E8 ?? ?? C3 }
            $walk = { B9 ?? ?? BA ?? ?? B4 4E CD 21 72 4A BA 9E 00 B8 02 3D CD 21 72 3A 89 C3 B9 02 00 BA ?? ?? B4 3F CD 21 81 3E ?? ?? ?? ?? 74 22 31 C9 31 D2 B8 02 42 CD 21 83 FA 00 75 14 3D ?? ?? 73 0F E8 ?? ?? 72 14 ( B8 00 57 CD 21 B8 01 57 CD 21 | 90 90 90 90 90 90 90 90 90 90 ) B4 3E CD 21 B4 4F CD 21 73 B6 C3 }
            $mover = { BF 00 04 33 D2 F7 F7 A3 ?? ?? 89 16 ?? ?? 83 3E ?? ?? 00 74 0C 8B 3E ?? ?? E8 ?? ?? 72 2C BF 00 04 83 3E ?? ?? 00 74 0B FF 0E ?? ?? E8 ?? ?? 72 19 EB EE }
            $mask = { 2A 2E 42 41 54 00 }
          condition:
            #call <= 64 and #walk <= 16 and #mover <= 16 and #mask <= 64 and
            $entry at 0 and
            for any c in (1..#call) : (
              @call[c] == 30 + int16(28) and
              uint16(@call[c] + 4) == 0x0a0d and
              uint8(@call[c] + 6) == 0x3a and
              uint8(@call[c] + 7) == uint8(6) and
              uint16(@call[c] + 8) == 0x0a0d and
              for any w in (1..#walk) : (
                @call[c] + 3 + int16(@call[c] + 1) == @walk[w] and
                uint16(@walk[w] + 28) == uint16(@walk[w] + 36) and
                uint16(@walk[w] + 57) > 0 and
                for any m in (1..#mover) : (
                  @walk[w] + 64 + int16(@walk[w] + 62) == @mover[m]
                ) and
                for any b in (1..#mask) : (
                  uint16(@walk[w] + 4) == @mask[b] + 256
                )
              )
            )
        }
