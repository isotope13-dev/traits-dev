defaults:
  platforms: [windows, unix]
  crit: baseline
  conf: 0.85
traits:
- id: find-name-filter
  desc: Find filters entries matching a name pattern
  crit: notable
  conf: 0.9
  for: [scripts, source]
  if:
    type: text
    regex: '(?i)\bfind\s[^\r\n]{0,160}\s-i?name\s+[''"][^''"\r\n]{1,60}[''"]'
    not:
      - regex: '(?i)\bfind\s[^\r\n]{0,160}\s-i?name\s+[''"]\*[''"]'
