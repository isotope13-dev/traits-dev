# .NET assemblies that hunt for dotenv files on disk (FindEnvFiles /
# ParseEnvFile). Neutral capability; theft intent lives in collection
# composites that pair this with auto-exec and HTTP.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, dll, csharp]
  crit: notable
  conf: 0.92

traits:
  - id: find-env-files-method
    desc: .NET method searches for env files
    if:
      type: text
      substr: FindEnvFiles
      section: text

  - id: parse-env-file-method
    desc: .NET method parses an env file
    if:
      type: text
      substr: ParseEnvFile
      section: text
