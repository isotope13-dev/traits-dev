# Windows cacls/icacls grant-permission patterns.
defaults:
  platforms: [windows]
  for: [scripts, binaries]
  size_min: 100
  size_max: 100000000
  attack: T1222.001
traits:
  - id: cacls-grant-everyone-full
    desc: Grant Everyone Full Control via cacls
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\bcacls\b[^\n]{0,200}/G\s+Everyone:F'
  - id: icacls-grant-everyone-full-shell
    desc: Shell invokes icacls Everyone grant
    crit: suspicious
    conf: 0.95
    for: [shell, batch, powershell]
    platforms: [windows, unix]
    if:
      type: text
      regex: '(?i)(^|[;&|]\s*)icacls\b[^\r\n]{0,200}/grant\s+Everyone:F'
  - id: icacls-grant-everyone-full
    desc: Node invokes icacls Everyone grant
    crit: suspicious
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)(exec|spawn|execSync)\s*\([^)]{0,200}icacls[^)]{0,200}/grant\s+Everyone:F'
