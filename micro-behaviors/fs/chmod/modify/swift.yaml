defaults:
  platforms: [linux, macos]
  for: [swift]
  crit: notable
  conf: 0.95
traits:
  - id: swift-directory-posix-permissions
    desc: Swift creates directory with POSIX mode
    if:
      type: tree-sitter
      query: |
        ((call_expression
          (navigation_expression
            suffix: (navigation_suffix suffix: (simple_identifier) @method))
          (call_suffix (value_arguments
            (value_argument
              name: (value_argument_label (simple_identifier) @argument)
              value: (dictionary_literal
                key: (prefix_expression target: (simple_identifier) @key))))))
          (#eq? @method "createDirectory")
          (#eq? @argument "attributes")
          (#eq? @key "posixPermissions"))
