defaults:
  platforms: [windows, unix]
  for: [go, rust]
  mbc: E1222
  attack: T1222.002
traits:
  # Both APIs change permissions without necessarily granting execute bits.
  # Keep this outside executable/mode: directory selectors there feed
  # executable-permission staging claims, including for mode 0600.
  - id: set-permissions-call
    desc: Calls filesystem permission-change API
    crit: notable
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '^(os\.Chmod|(std::)?fs::set_permissions)$'
