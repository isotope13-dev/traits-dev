defaults:
  platforms:
  - windows
  for:
  - batch
traits:
- id: autorun-directory-acl-delete-launch-write
  desc: Replaces Autorun blocker with launch template
  crit: notable
  conf: 0.99
  if:
    type: yara
    source: "rule autorun_directory_acl_delete_launch_write {\n strings:\n$guard = /if exist \"%[A-Za-z_][A-Za-z0-9_]{0,23}%\\\
      \\autorun\\.inf\\\\\" \\(echo\\.y\\|cacls \"%[A-Za-z_][A-Za-z0-9_]{0,23}%\\\\autorun\\.inf\" \\/p everyone:f\\\
      r?\\nrd \"%[A-Za-z_][A-Za-z0-9_]{0,23}%\\\\autorun\\.inf\" \\/s \\/q\\)/ nocase\n$guardhead = /if exist \"\
      %[A-Za-z_][A-Za-z0-9_]{0,23}%\\\\autorun\\.inf\\\\\"/ nocase\n$acl = /cacls \"%[A-Za-z_][A-Za-z0-9_]{0,23}%\\\
      \\autorun\\.inf\" \\/p everyone:f/ nocase\n$rd = /rd \"%[A-Za-z_][A-Za-z0-9_]{0,23}%\\\\autorun\\.inf\" \\\
      /s \\/q/ nocase\n$infcall = /call:[A-Za-z_][A-Za-z0-9_]{0,23} >%[A-Za-z_][A-Za-z0-9_]{0,23}%\\\\autorun\\\
      .inf/ nocase\n$head = /call:[A-Za-z_][A-Za-z0-9_]{0,23} / nocase\n$infdef = /:[A-Za-z_][A-Za-z0-9_]{0,23}\\\
      r?\\necho\\.\\[AutoRun\\]\\r?\\necho\\.open=wscript\\.exe %~n0\\.vbe\\r?\\necho\\.shell\\\\open\\\\Command=wscript\\\
      .exe %~n0\\.vbe/ nocase\n condition:\n#guard > 0 and #guard <= 32 and #guardhead > 0 and #guardhead <= 32\
      \ and #acl > 0 and #acl <= 32 and #rd > 0 and #rd <= 32 and #infcall > 0 and #infcall <= 32 and #head > 0\
      \ and #head <= 32 and #infdef > 0 and #infdef <= 32 and\nfor any g in (1..#guard) : (\nfor any gh in (1..#guardhead)\
      \ : (\nfor any a in (1..#acl) : (\nfor any d in (1..#rd) : (\nfor any ic in (1..#infcall) : (\nfor any ih\
      \ in (1..#head) : (\nfor any id in (1..#infdef) : (\n(@infcall[ic] == 0 or uint8(@infcall[ic]-1) == 10) and\n\
      @head[ih] == @infcall[ic] and\n(@infdef[id] == 0 or uint8(@infdef[id]-1) == 10) and (uint8(@infdef[id]+1+(!head[ih]-6))\
      \ == 13 or uint8(@infdef[id]+1+(!head[ih]-6)) == 10) and (!head[ih]-6) == (!head[ih]-6) and for all k in (0..(!head[ih]-6)-1)\
      \ : ((uint8(@head[ih]+5+k) | 32) == (uint8(@infdef[id]+1+k) | 32)) and\n(@guard[g] == 0 or uint8(@guard[g]-1)\
      \ == 10) and\n@acl[a] > @guard[g] and @rd[d] > @acl[a] and @rd[d]+!rd[d]+1 == @guard[g]+!guard[g] and\n@guardhead[gh]\
      \ == @guard[g] and\n(!guardhead[gh]-26) == (!acl[a]-36) and for all k in (0..(!guardhead[gh]-26)-1) : ((uint8(@guardhead[gh]+11+k)\
      \ | 32) == (uint8(@acl[a]+8+k) | 32)) and\n(!acl[a]-36) == (!rd[d]-25) and for all k in (0..(!acl[a]-36)-1)\
      \ : ((uint8(@acl[a]+8+k) | 32) == (uint8(@rd[d]+5+k) | 32)) and\n(!acl[a]-36) == (!infcall[ic]-!head[ih]-15)\
      \ and for all k in (0..(!acl[a]-36)-1) : ((uint8(@acl[a]+8+k) | 32) == (uint8(@infcall[ic]+!head[ih]+2+k)\
      \ | 32)) and\n@infcall[ic] > @guard[g]+!guard[g] and @infcall[ic]-@guard[g] < 2048\n)\n)\n)\n)\n)\n)\n)\n}"
