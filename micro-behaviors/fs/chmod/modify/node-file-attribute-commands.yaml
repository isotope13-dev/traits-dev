defaults:
  platforms: [macos]
  for: [javascript, typescript]

traits:
  - id: node-chmod-user-rw
    desc: Node executes chmod u+rw
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(execSync|spawnSync|execFileSync)\s*\(\s*[`"'']chmod u\+rw'

composite_rules:
  - id: node-macos-file-unlock
    desc: Node file-attribute change commands
    crit: notable
    conf: 0.98
    needs: 2
    any:
      - id: micro-behaviors/fs/attributes/chflags::node-chflags-nouchg
      - id: micro-behaviors/fs/chmod/modify::node-chmod-user-rw
      - id: micro-behaviors/fs/attributes/xattr::node-xattr-clear
