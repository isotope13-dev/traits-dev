defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
  - python
  - javascript
  - elf
traits:
- id: chmod-hidden-temp-or-device-path
  desc: Chmod text names hidden temp/device path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: chmod[^\n]{0,120}(/(var/)?tmp/|/dev/(shm/)?)\.[\da-zA-Z][\w.-]{2,120}\b
- id: hidden-scratch-chmod-text-12
  desc: Chmod text names hidden scratch path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: chmod[^\n]{0,120}(/run/|/mnt/)\.[a-zA-Z0-9][\w.-]{2,120}\b
