traits:
- id: hidden-scratch-chmod-text-11
  desc: Chmod text names hidden scratch path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: chmod[^\n]{0,120}(/var/tmp/|/dev/)\.[a-zA-Z0-9][\w.-]{2,120}\b
- id: hidden-scratch-chmod-text-12
  desc: Chmod text names hidden scratch path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: chmod[^\n]{0,120}(/run/|/mnt/)\.[a-zA-Z0-9][\w.-]{2,120}\b
