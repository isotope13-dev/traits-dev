defaults:
  platforms: [linux, macos]
  for: [elf, macho]
traits:
  - id: umask
    desc: References umask file-creation mask API
    crit: notable
    conf: 0.4
    if:
      type: symbol
      exact: umask
  # Bare substring, so it also hits `fchmod`, a `chmod` usage/help string, the
  # imported symbol name in .dynstr, and any comment -- i.e. /bin/chmod, tar,
  # rsync, install, dpkg and every distro maintenance tool. That is why it stays
  # `component`: it cannot tell a call from a mention. Previously named
  # `unix-chmod-unlock-symbol` / "Unix chmod unlock symbol", which asserted two
  # things the matcher never checks -- a file-*unlock* intent, and a *symbol*
  # match. The unlock reading belongs to the composite that ANDs this with flock
  # and chown (objectives/evasion/file-unlock/permissions), not to this atom.
  # For a real call site on ELF/Mach-O prefer the sibling symbol trait
  # micro-behaviors/fs/chmod/modify::syscall-chmod.
  - id: chmod-text-reference
    desc: References chmod in file text
    crit: component
    conf: 0.86
    platforms: [unix]
    for: [c, cpp, objc, elf]
    if:
      type: text
      substr: chmod
    unless:
      - id: well-known/app/drivers/
      - type: trait
        id: metadata/file/extension/identity::linux-kernel-package-artifact-basename
