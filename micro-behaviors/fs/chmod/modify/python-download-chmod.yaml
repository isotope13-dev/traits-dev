composite_rules:
# The Python spelling of the same shell installer pattern above: a helper
# downloads a binary over HTTPS, chmods it executable, then clears
# quarantine so Gatekeeper does not block the tool's own just-fetched
# dependency. Requiring both the download and the chmod call alongside
# the xattr removal distinguishes a binary-installer utility from an
# actual defense-evasion script that only ever clears quarantine.
- id: python-urlopen-near-chmod
  desc: urlopen call near an os.chmod call
  crit: notable
  conf: 0.95
  for: [python]
  platforms: [macos]
  near_lines: 200
  all:
    - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen
    - id: micro-behaviors/fs/chmod/modify::python-path-chmod
