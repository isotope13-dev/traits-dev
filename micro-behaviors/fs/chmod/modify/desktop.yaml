defaults:
  platforms: [linux]
  for: [desktop-entry]
  crit: notable
  conf: 0.92
  attack: T1222.002

traits:
  - id: desktop-exec-chmod-exec
    desc: Desktop Exec makes file executable
    if:
      type: value
      path: desktop_entry.exec
      regex: '\bchmod\s+\+x\b'

  - id: desktop-exec-chmod-octal
    desc: Desktop Exec sets executable mode
    conf: 0.88
    if:
      type: value
      path: desktop_entry.exec
      regex: '\bchmod\s+[0-7]*[1357][0-7]*\s'

composite_rules:
  - id: desktop-exec-chmod
    desc: Desktop Exec sets executable permission
    crit: notable
    conf: 0.92
    any:
      - id: desktop-exec-chmod-exec
      - id: desktop-exec-chmod-octal
