# The matcher sees a chmod call; it does not inspect the mode argument.
defaults:
  for: [ruby]
  platforms: [unix, windows]

traits:
  - id: ruby-chmod-call-ast
    desc: Ruby chmod method call
    crit: notable
    conf: 0.9
    attack: T1222
    if:
      type: tree-sitter
      query: |
        (call receiver: (_) @receiver
          method: (identifier) @method
          (#eq? @method "chmod"))
