defaults:
  platforms: [unix]
  for: [php]
traits:
  - id: php-system-remove-write-mode
    desc: PHP chmod command removes write access
    crit: notable
    conf: 0.98
    attack: T1222.002
    if:
      type: symbol
      kind: call
      exact: system
      arg:
        index: 0
        kind: string
        regex: '^chmod\s+[augo]+-w\s+\S+'
