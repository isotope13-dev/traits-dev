defaults:
  platforms: [android]
  for: [dex]
  crit: notable
  conf: 0.8

traits:
  # Dex string-table entries are length-prefixed MUTF-8; the text extractor
  # drops a six-byte entry with a trailing space, so match the entry itself:
  # length 6, "chmod ", NUL.  Code builds the full command by appending the
  # mode and path to this prefix.
  - id: dex-chmod-command-prefix
    desc: DEX holds a chmod command prefix string
    if:
      type: raw
      regex: '\x06chmod \x00'
