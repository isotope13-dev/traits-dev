defaults:
  platforms: [unix]
  for: [c, cpp, objc, elf]

traits:
  - id: unix-unlock-permission-calls
    desc: Chmod, flock, and chown tokens in source
    crit: notable
    conf: 0.9
    for: [c, cpp, objc]
    if:
      type: text
      regex: '\bchmod\b[^\n]{0,700}\bflock\b[^\n]{0,700}\bchown\b'
composite_rules:
  - id: unix-unlock-symbol-cluster
    for: [elf, c]
    desc: Chmod, flock, and chown API references
    crit: component
    conf: 0.9
    all:
      - id: micro-behaviors/fs/chmod/modify::chmod-text-reference
      - id: micro-behaviors/fs/lock::flock
      - id: micro-behaviors/fs/chown::chown
  - id: unix-sensitive-file-unlock
    for: [c, objectivec]
    desc: Permission APIs and account config references
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/fs/path/config/accounts::unix-sensitive-path-unlock-targets
      - id: micro-behaviors/fs/chmod/modify::unix-unlock-permission-calls
  - id: unix-sensitive-file-unlock-binary
    desc: Permission APIs and account and SSH paths
    crit: notable
    conf: 0.96
    for: [elf]
    all:
      - id: micro-behaviors/fs/path/config/accounts::unix-sensitive-path-unlock-targets
      - id: micro-behaviors/fs/chmod/modify::unix-unlock-symbol-cluster
      - id: micro-behaviors/os/service/config::sshd-config-path
