defaults:
  platforms: [unix]
  for: [elf, macho]
  mbc: E1222
  attack: T1222.002

traits:
  - id: go-os-chmod-binary
    desc: Go binary links os.Chmod
    crit: baseline
    conf: 0.95
    if:
      type: text
      exact: os.Chmod
      section: .gopclntab

composite_rules:
  - id: go-daemon-chmod-capability
    desc: Go daemon routine with file permission change capability
    crit: notable
    conf: 0.95
    all:
      - id: go-os-chmod-binary
      - id: micro-behaviors/communications/ipc/unix-socket::go-main-daemon-mode-symbol
