defaults:
  platforms: [windows, unix]
  for: [go]
  mbc: E1222
  attack: T1222.002

traits:
  - id: go-chmod-executable
    desc: Go source sets executable file permissions
    crit: notable
    conf: 0.85
    if:
      # Argument facts expose numeric equality, but not an executable-bit mask.
      # Keep executable decimal 7xx values accepted by the previous text rule.
      # Decimal 770/772/774 have no execute bits and must not match.
      type: tree-sitter
      query: |
        ((call_expression
          function: (selector_expression
            operand: (identifier) @pkg
            field: (field_identifier) @method)
          arguments: (argument_list . (_) (int_literal) @mode .)) @call
          (#eq? @pkg "os")
          (#eq? @method "Chmod")
          (#match? @mode "^(0[oO]?_?7_?[0-7]_?[0-7]|7[0-6][0-7]|77[13567])$"))
