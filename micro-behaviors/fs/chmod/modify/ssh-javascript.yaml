defaults:
  platforms: [unix]
  for: [javascript, typescript]
traits:
- id: js-chmod-ssh-path
  desc: Node chmod expression referencing SSH
  crit: notable
  conf: 0.86
  if:
    type: text
    regex: "chmodSync\\s*\\([^)]{0,120}(\\.ssh|authorized_keys|ssh)"
composite_rules:
- id: js-ssh-chmod-owner-only-mode-cooccurrence
  desc: SSH chmod references beside owner-only modes
  crit: notable
  conf: 0.86
  all:
  - id: micro-behaviors/fs/chmod/modify::js-chmod-ssh-path
  any:
  - id: micro-behaviors/fs/chmod/modify::node-chmod-owner-only-700
  - id: micro-behaviors/fs/chmod/modify::node-chmod-owner-only-600
