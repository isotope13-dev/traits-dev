# JavaScript permission changes. The matchers under fs/chmod/executable/mode/
# read the mode out of the source text, so they only see a written-out 0o755;
# a call whose mode is a named constant or a variable is the same permission
# change and still belongs on an analyst's diff. This is the JS counterpart of
# fs/chmod/modify::python-path-chmod.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-chmod-call
    desc: Node calls chmod to change permissions
    crit: notable
    conf: 0.85
    # Tree-sitter call shape also covers TypeScript's (0, fs_1.chmodSync).
    if:
      type: tree-sitter
      query: |
        ((call_expression function: (_) @callee) @call
          (#match? @callee "(^|\\.)chmod(Sync)?[\\s)]*$"))
