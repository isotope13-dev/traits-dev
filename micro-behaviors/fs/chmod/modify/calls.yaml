defaults:
  platforms:
  - windows
  - linux
  - macos
traits:
- id: chmod-symbol
  desc: References chmod permission-change API
  crit: notable
  conf: 0.66
  for:
  - elf
  - macho
  if:
    type: symbol
    exact: chmod
- id: static-chmod-symbol-text
  desc: Static executable chmod name reference
  crit: notable
  conf: 0.72
  platforms:
  - linux
  for:
  - elf
  if:
    type: text
    regex: ^(__)?chmod$
  unless:
  - id: chmod-symbol
  - type: value
    path: elf.interpreter
    exists: true
- id: fchmod-symbol
  desc: References fchmod permission-change API
  crit: notable
  conf: 0.66
  for:
  - elf
  - macho
  if:
    type: symbol
    exact: fchmod
- id: fchmodat-symbol
  desc: References fchmodat permission-change API
  crit: notable
  conf: 0.66
  for:
  - elf
  - macho
  if:
    type: symbol
    exact: fchmodat
- id: lchmod-symbol
  desc: References lchmod permission-change API
  crit: notable
  conf: 0.66
  for:
  - elf
  - macho
  if:
    type: symbol
    exact: lchmod
- id: python-os-chmod
  desc: Python os.chmod call
  crit: notable
  conf: 0.85
  for:
  - python
  if:
    type: text
    substr: os.chmod(
  unless:
  - type: symbol
    kind: call
    exact: os.chmod
- id: python-path-chmod
  desc: Python chmod method call reference
  crit: notable
  conf: 0.85
  for:
  - python
  if:
    type: symbol
    kind: call
    regex: (^|\.)chmod$
- id: python-fchmod
  desc: Python file-descriptor permission change
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: symbol
    kind: call
    exact: os.fchmod
- id: python-umask
  desc: Python file-creation mask call
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: symbol
    kind: call
    exact: os.umask
- id: ruby-file-chmod
  desc: Ruby File.chmod call
  crit: notable
  conf: 0.75
  for:
  - ruby
  if:
    type: string_literal
    substr: File.chmod
- id: ruby-chmod-method
  desc: Changes file permissions with Ruby chmod
  crit: notable
  conf: 0.75
  for:
  - ruby
  if:
    type: text
    substr: .chmod(
- id: ruby-chmod-symbol
  desc: Ruby chmod symbol reference
  crit: baseline
  conf: 0.75
  for:
  - ruby
  if:
    type: text
    substr: :chmod
- id: node-chmod
  desc: Node.js chmod call
  crit: notable
  conf: 0.7
  for:
  - javascript
  if:
    type: text
    regex: \.chmod(Sync)?\s*\(
  not:
  - substr: options.chmod(p, 0o666
  - substr: fs.fchmod(fd, mode
- id: lua-posix-chmod
  desc: Lua calls the POSIX chmod API
  crit: notable
  conf: 0.85
  for:
  - lua
  platforms:
  - linux
  if:
    type: text
    regex: posix\.chmod\s*\(
composite_rules:
- id: syscall
  desc: chmod permission-change API family
  crit: component
  conf: 0.66
  any:
  - id: chmod-symbol
  - id: fchmod-symbol
  - id: fchmodat-symbol
  - id: lchmod-symbol
  downgrade:
    any:
    - id: metadata/lang/compiled/
    - id: metadata/lang/compiler/systems::go-binary
- id: ruby-comp
  desc: Ruby file permission modification
  crit: notable
  conf: 0.8
  any:
  - id: ruby-file-chmod
  - id: ruby-chmod-method
  - id: ruby-chmod-symbol
