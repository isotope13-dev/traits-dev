defaults:
  platforms: [windows, linux, macos]
  mbc: E1222
  attack: T1222
traits:
  # The four `syscall-*` ids below match LINKED SYMBOLS (`type: symbol`), i.e.
  # the libc wrappers recorded in .dynsym -- not direct `syscall`/`int 0x80`
  # invocation, which is a separate cleave condition type and a distinct
  # evasion signal. The descriptions said "chmod syscall", which reads in
  # triage as "this binary issues a raw syscall"; they now name the API the
  # matcher actually finds, matching the house style of the sibling atoms
  # (`References umask file-creation mask API`). The ids keep their legacy
  # spelling because `chmod-call` and `chmod-text-reference` are already taken
  # in this directory and four external composites reference `syscall-chmod`.
  - id: syscall-chmod
    desc: References chmod permission-change API
    crit: notable
    conf: 0.66
    for:
      - elf
      - macho
    if:
      type: symbol
      exact: chmod
    downgrade:
      # Go's os package statically imports chmod for os.Chmod / file.Chmod; all
      # Go Unix binaries link it regardless of whether they actually chmod.
      any:
        - id: metadata/lang/compiler/systems::go-binary-macho
        - id: metadata/lang/compiled/
        - id: metadata/lang/compiler/systems::go-binary
  - id: syscall-fchmod
    desc: References fchmod permission-change API
    crit: notable
    conf: 0.66
    for:
      - elf
      - macho
    if:
      type: symbol
      exact: fchmod
    downgrade:
      any:
        - id: metadata/file/string/identity::system-shell-basename
  - id: syscall-fchmodat
    desc: References fchmodat permission-change API
    crit: notable
    conf: 0.66
    for:
      - elf
      - macho
    if:
      type: symbol
      exact: fchmodat
  - id: syscall-lchmod
    desc: References lchmod permission-change API
    crit: notable
    conf: 0.66
    for:
      - elf
      - macho
    if:
      type: symbol
      exact: lchmod
  - id: python-os-chmod
    desc: Python os.chmod call
    crit: notable
    conf: 0.85
    for:
      - python
    if:
      type: text
      regex: os\.chmod\(
    unless:
      - id: micro-behaviors/fs/chmod/executable/mode
      - type: symbol
        kind: call
        exact: os.chmod
  - id: python-path-chmod
    desc: Python calls chmod to change permissions
    crit: notable
    conf: 0.85
    for:
      - python
    if:
      type: symbol
      kind: call
      regex: '(^|\.)chmod$'
    unless:
      - id: well-known/app/development/jennifer/
      - type: path
        regex: '(?i)\\.j$'
      - id: metadata/lang/source::linux-kernel-secondary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-scripts
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-extra
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-mmfs
      - id: metadata/lang/source::linux-kernel-primary-tree-path
  - id: python-fchmod
    desc: Python file-descriptor permission change
    crit: notable
    conf: 0.9
    for:
      - python
    if:
      type: symbol
      kind: call
      exact: os.fchmod
  - id: python-umask
    desc: Python file-creation mask call
    crit: notable
    conf: 0.9
    for:
      - python
    if:
      type: symbol
      kind: call
      exact: os.umask
  - id: ruby-file-chmod
    desc: Ruby File.chmod call
    crit: notable
    conf: 0.75
    for:
      - ruby
    if:
      type: string_literal
      substr: File.chmod
  - id: ruby-chmod-method
    desc: Changes file permissions with Ruby chmod
    crit: notable
    conf: 0.75
    for:
      - ruby
    if:
      type: text
      substr: .chmod(
  - id: ruby-chmod-symbol
    desc: Ruby chmod symbol reference
    crit: baseline
    conf: 0.75
    for:
      - ruby
    if:
      type: text
      substr: :chmod
  - id: node-chmod
    desc: Node.js chmod call
    crit: notable
    conf: 0.7
    for:
      - javascript
    unless:
      - id: well-known/app/ai/coding-agent/tabby::tabby-builtin-plugin-path
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/package/testing/presence/harness/
      - id: metadata/library/structure/
    if:
      type: text
      regex: \.chmod(Sync)?\s*\(
    not:
      - substr: options.chmod(p, 0o666
      - substr: fs.fchmod(fd, mode
  - id: go-os-chmod
    desc: Go os.Chmod call
    crit: notable
    conf: 0.8
    for:
      - go
    if:
      type: text
      substr: os.Chmod(
  - id: lua-posix-chmod
    desc: Lua calls the POSIX chmod API
    crit: notable
    conf: 0.85
    for: [lua, rpm]
    platforms: [linux]
    if:
      type: raw
      regex: 'posix\.chmod\s*\('

composite_rules:
  - id: syscall
    desc: chmod permission-change API family
    crit: notable
    conf: 0.66
    any:
      - id: syscall-chmod
      - id: syscall-fchmod
      - id: syscall-fchmodat
      - id: syscall-lchmod
  - id: ruby-comp
    desc: Ruby file permission modification
    crit: notable
    conf: 0.8
    any:
      - id: ruby-file-chmod
      - id: ruby-chmod-method
      - id: ruby-chmod-symbol
