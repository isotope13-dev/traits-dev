defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.97
traits:
  - id: printf-chmod-name-format
    desc: printf constructs a chmod command name
    if:
      type: symbol
      kind: call
      exact: printf
      arg:
        index: 0
        kind: string
        regex: '^(c|\\143|\\x63)(h|\\150|\\x68)(m|\\155|\\x6d)(o|\\157|\\x6f)(d|\\144|\\x64)$'
  - id: printf-chmod-name-percent-b
    desc: printf constructs a chmod command name
    if:
      type: symbol
      kind: call
      exact: printf
      args:
        - index: 0
          kind: string
          exact: '%b'
        - index: 1
          kind: string
          regex: '^(c|\\143|\\x63)(h|\\150|\\x68)(m|\\155|\\x6d)(o|\\157|\\x6f)(d|\\144|\\x64)$'


composite_rules:
  - id: printf-chmod-name
    desc: printf constructs a chmod command name
    conf: 0.97
    any:
      - id: printf-chmod-name-format
      - id: printf-chmod-name-percent-b
