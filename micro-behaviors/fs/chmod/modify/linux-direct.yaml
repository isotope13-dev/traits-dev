# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: chmod-direct-syscall
    desc: Changes file mode via Linux syscall
    crit: baseline
    if:
      type: syscall
      name: [chmod, fchmod, fchmodat]
      arch: [x86_64, aarch64]
  - id: chmod-setuid-syscall
    desc: Requests the set-user-ID file mode
    crit: notable
    if:
      type: syscall
      name: [chmod, fchmod]
      arch: [x86_64, aarch64]
      args:
        - index: 1
          mask: 2048
  - id: fchmodat-setuid-syscall
    desc: Requests set-user-ID mode relative to directory
    crit: notable
    if:
      type: syscall
      name: [fchmodat]
      arch: [x86_64, aarch64]
      args:
        - index: 2
          mask: 2048
  # The AArch64 producer may retain this newer ABI number without a name.
  - id: fchmodat2-direct-syscall
    desc: Changes file mode with fchmodat2
    crit: baseline
    if:
      type: syscall
      number: [452]
      arch: [x86_64, aarch64]
  - id: fchmodat2-setuid-syscall
    desc: Requests set-user-ID mode with fchmodat2
    crit: notable
    if:
      type: syscall
      number: [452]
      arch: [x86_64, aarch64]
      args:
        - index: 2
          mask: 2048
