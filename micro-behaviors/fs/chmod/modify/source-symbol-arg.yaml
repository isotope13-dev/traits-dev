# Matches chmod calls that receive a specific mode near the call site.
defaults:
  platforms: [unix]
  for: [scripts]
  mbc: E1222
  attack: T1222
  crit: notable
traits:
  - id: chmod-call-with-octal-777
    desc: chmod call with 0o777 arg (call-site specific)
    conf: 0.95
    crit: notable
    if:
      type: text
      regex: 'chmod\s*\([^\r\n)]{0,120}\b0o777\b'
    not:
      - regex: 'chmod\s*\([^\r\n)]{0,120}&\s*0o777\b'
    unless:
      - id: metadata/package/testing/presence/harness/
      - id: metadata/package/testing/harness/unit/

  # Was micro-behaviors/process/create/agent::agent-executable-hook-write,
  # "Agent writes an executable hook". The matcher only ever saw an os.chmod
  # mode argument — no hook, no agent — so it fired on every installer that
  # marks a downloaded file runnable (huggingface_hub's `hf extensions install`
  # among them). The agent-hook intent comes from the git-hooks legs of the
  # composite that consumes this, not from the mode bits.
  - id: python-chmod-call-with-exec-bit
    desc: Python chmod call sets the executable bit
    conf: 0.95
    crit: notable
    for: [python]
    platforms: [unix, windows]
    if:
      type: text
      regex: '(?i)os\.chmod\([^\n]{0,100}0o?7(55|75)\b'
