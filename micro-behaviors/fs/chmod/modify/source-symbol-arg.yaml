defaults:
  conf: 0.95
  platforms:
  - unix
  for:
  - scripts
  mbc: E1222
  attack: T1222
  crit: notable
traits:
- id: chmod-call-with-octal-777
  desc: chmod call with 0o777 arg (call-site specific)
  if:
    type: text
    regex: chmod\s*\([^\r\n)]{0,120}\b0o777\b
  not:
  - regex: chmod\s*\([^\r\n)]{0,120}&\s*0o777\b
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/package/testing/harness/unit/
  - id: metadata/path::test-directory-component
- id: python-chmod-call-with-exec-bit
  desc: Python chmod call sets the executable bit
  for:
  - python
  platforms:
  - unix
  - windows
  if:
    type: text
    regex: (?i)os\.chmod\([^\n]{0,100}0o?7(55|75)\b
- id: ruby-chmod-call-with-octal-exec-mode
  desc: Ruby chmod octal mode includes execute bit
  for:
  - ruby
  if:
    type: text
    regex: (?i)chmod\s*\(\s*0o?[1357][0-7]{2}\b
- id: ruby-chmod-call-with-symbolic-exec-mode
  desc: Ruby chmod symbolic mode grants execute bit
  for:
  - ruby
  if:
    type: text
    regex: (?i)chmod\s*\(\s*["\x27][^"\x27]{0,50}(\+x|=.{0,25}x)
