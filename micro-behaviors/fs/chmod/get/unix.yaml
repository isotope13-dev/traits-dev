defaults:
  platforms: [linux, macos]
  for: [elf, macho, c, cpp]
traits:
  - id: get-dup
    desc: Look up file permissions
    crit: baseline
    conf: 0.66
    # Only getmode(3) is a permission-mode query. The stat-family members
    # duplicated micro-behaviors/fs/file/stat::stat-core under the wrong
    # directory and description (stat reports file status, not permissions).
    if:
      type: symbol
      regex: ^_?getmode$
