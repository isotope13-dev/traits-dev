defaults:
  crit: notable
  conf: 0.9
  platforms: [unix]
  for: [shell]
  attack: T1021.004

traits:
  - id: ssh-chmod-shell-command
    desc: Shell text contains SSH chmod command
    # Keep chmod on the SSH command line: whitespace across separate
    # local commands does not establish remote execution.
    for: [shell, c, cpp, python]
    if:
      type: text
      regex: '(?im)^[ \t]*["'']?(ssh|sudo[ \t]+ssh)[ \t]+[^\n;]{0,180}\bchmod\b'
    not:
      - regex: '(?i)\bssh\s+keys?\b'
  - id: go-ssh-chmod-process-command
    desc: Go process call text references SSH chmod
    for: [go]
    if:
      type: text
      regex: '(?is)\bexec\.Command\s*\([^)]{0,300}\bssh\b[^)]{0,300}\bchmod\b'
  - id: python-ssh-chmod-process-command
    desc: Python process call text references SSH chmod
    for: [python]
    if:
      type: text
      regex: '(?is)\bsubprocess\.(Popen|run|call)\s*\([^)]{0,300}\bssh\b[^)]{0,300}\bchmod\b'
  - id: rust-ssh-chmod-process-command
    desc: Rust process call text references SSH chmod
    for: [rust]
    if:
      type: text
      regex: '(?is)\bCommand::new\s*\([^)]{0,300}\bssh\b[^)]{0,300}\bchmod\b'
  - id: chmod-executable-mode-string
    desc: Embedded chmod executable-mode command string
    platforms: [unix, windows]
    for: [python, go, rust, ruby, perl, c, cpp, powershell]
    if:
      type: text
      regex: '\bchmod\s+([augo]*\+x|0?7[057][057])\s+\S+'

composite_rules:
  - id: executable-permission-staging
    desc: Stages executable file permissions locally or over SSH
    platforms: [unix, windows]
    for: [scripts, source]
    any:
      - id: micro-behaviors/fs/chmod/modify::chmod-command
      - id: micro-behaviors/fs/chmod/executable/mode/
      - id: micro-behaviors/fs/chmod/executable/dangerous/
      - id: ssh-chmod-shell-command
      - id: go-ssh-chmod-process-command
      - id: python-ssh-chmod-process-command
      - id: rust-ssh-chmod-process-command
      - id: chmod-executable-mode-string

  - id: local-or-remote-staged-launch
    desc: Local, detached, or SSH-staged executable launch
    platforms: [unix, windows]
    for: [shell, python, perl, ruby, go, c, cpp]
    any:
      - id: micro-behaviors/process/create/path-execution::local-execution
      - id: micro-behaviors/process/daemonize/detach::nohup-shell-launch
      - id: chmod-executable-mode-string
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-literal-target
