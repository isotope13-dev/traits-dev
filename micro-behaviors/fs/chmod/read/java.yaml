# Neutral evidence separated from its objective consumers.
traits:
- id: java-file-setreadable-bytecode
  desc: Java File readable-permission API reference
  conf: 0.92
  for: [class, dex]
  if:
    type: import
    regex: '^(java/io/File\.|Ljava/io/File;->)setReadable$'
  crit: notable
  platforms:
  - unix
  - windows
  - android

- id: java-world-readable-permission
  desc: Java sets world-readable permission
  conf: 0.9
  for:
  - java
  if:
    type: text
    substr: setReadable(true, false)
  crit: notable
  platforms:
  - unix
  - windows
