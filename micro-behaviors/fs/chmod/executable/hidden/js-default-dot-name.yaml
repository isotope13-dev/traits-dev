defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1222.002

traits:
  - id: js-default-dot-relative-name
    desc: Default argument names dot-relative file
    crit: notable
    conf: 0.8
    # A trailing default parameter naming a dot-prefixed or parent-relative
    # file, such as `asset = '.ls'` or `asset = '../ls'`. The name resolves
    # against the caller's working directory, not a path the library writes.
    # Requiring a closing paren keeps `'./bin/tool'` and mid-list defaults out.
    if:
      type: text
      regex: '\w+\s*=\s*[''"](\.\.\/|\.)\w[\w.-]{0,40}[''"]\s*\)'
