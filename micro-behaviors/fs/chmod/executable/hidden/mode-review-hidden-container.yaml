defaults:
  platforms:
    - linux
    - macos
    - windows
  for:
    - scripts
    - manifests
    - html
    - xml
    - dockerfile
    - package-lock.json
    - groovy
composite_rules:
  - id: chmod-hidden-path-command-container
    desc: Hidden-path chmod command reference
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/fs/chmod/executable/hidden::chmod-hidden-tmp-executable
      - id: micro-behaviors/fs/chmod/executable/hidden::chmod-hidden-shm-executable
      - id: micro-behaviors/fs/chmod/executable/hidden::chmod-hidden-home-executable
