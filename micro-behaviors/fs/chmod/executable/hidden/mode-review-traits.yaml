defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  mbc: E1222
  attack: T1222
  crit: notable

traits:
  - id: chmod-hidden-tmp-executable
    desc: chmod command text targets hidden temporary path
    # A chmod atom is only a capability.  Download/execute composites below
    # promote it when it is paired with staging or process execution.
    crit: notable
    conf: 0.94
    for: [scripts, source, manifests, -pyproject.toml]
    if:
      type: text
      regex: '\bchmod\s+(\+x|0?7[57][57])\s+["'']?/(var/)?tmp/\.'
  - id: chmod-hidden-shm-executable
    desc: Marks hidden shared-memory file executable
    crit: suspicious
    conf: 0.94
    for: [shell]
    if:
      type: text
      regex: '\bchmod\s+(\+x|0?7[57][57])\s+["'']?/dev/shm/\.'
  - id: chmod-hidden-home-executable
    desc: Marks hidden home path executable
    crit: notable
    conf: 0.92
    for: [shell]
    if:
      type: text
      regex: '\bchmod\s+(\+x|0?7[57][57])\s+["'']?(\$HOME|~)/(\.local/share/)?\.[^\s"'']{0,40}'
    # Consume the path so not: can see Termux:Boot's ~/.termux/boot/ helper
    # dir; a `/ \.` span stopped at the first dot and missed the rest.
    not:
      - substr: '.termux/boot/'
      # Coursier's documented bootstrap writes ~/.coursier/coursier.
      - substr: '.coursier/'
      # cargo and cargo-dist install the built binary into ~/.cargo/bin.
      - substr: '/.cargo/bin'
      # XDG user executables are ordinary install destinations. Keep hidden
      # basenames such as ~/.local/bin/.stage eligible for stage detection.
      - regex: '/\.local/bin/[^./][^/]*$'
      # ~/.bin is also an ordinary user executable install destination.
      - regex: '/\.bin/[^./][^/]*$'
      # `~/.local/share` is the XDG data dir, and the same reasoning applies:
      # installing a file-manager action there is what the freedesktop specs
      # tell an application to do. PeaZip's two-line integration scripts
      # (`cp ./KDE6-dolphin/peazip-kde6.desktop ~/.local/share/kio/servicemenus/`
      # then `chmod +x` it) scored suspicious for it. Every component after
      # `share/` must be visible, so ~/.local/share/foo/.stage still counts --
      # which is what the optional `(\.local/share/)?` in the matcher above
      # was written to preserve.
      - regex: '/\.local/share/([^./][^/]*/)*[^./][^/]*$'
    unless:
      - id: well-known/app/ai/knowledge/animica::rag-documentation-context
