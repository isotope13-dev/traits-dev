defaults:
  for: [scripts, manifests, html, xml, dockerfile, package-lock.json, groovy]
  platforms: [linux, macos, windows]

traits:
- id: dockerfile-chmod-hidden-temp-executable
  desc: Dockerfile makes hidden temp path executable
  crit: suspicious
  conf: 0.97
  for: [dockerfile]
  if:
    type: text
    # Keep the permission and hidden target in one chmod command. Nearby
    # commands can be unrelated, such as making /logs writable next to the
    # standard sticky /tmp/.ICE-unix directory.
    regex: '(?i)\bchmod\s+(\+x|0?7[57][57])\s+["'']?(/var)?/tmp/\.[A-Za-z0-9_][A-Za-z0-9_.-]*'
- id: dockerfile-tmp-cache-dir-mode-777
  desc: Makes /tmp/.cache tool dir world-writable
  crit: notable
  conf: 0.9
  for:
    - dockerfile
  if:
    type: text
    regex: '(?m)chmod\s+(-R\s+)?0?777\s+/tmp/\.cache/[\w.-]+/?\s*$'

composite_rules:
- id: dockerfile-chmod-hidden-tmp-clues
  desc: Dockerfile chmod and hidden temp path clues
  crit: suspicious
  conf: 0.97
  for:
    - dockerfile
  near_lines: 1
  # Images that run as a non-root user open a shared tool cache dir
  # (HOME=/tmp -> /tmp/.cache/<tool>) with mode 777; nothing is staged there.
  unless:
    - id: dockerfile-tmp-cache-dir-mode-777
  all:
    - id: micro-behaviors/fs/chmod/executable/mode::chmod-make-executable
    - id: micro-behaviors/fs/path/hidden::tmp-hidden-file
