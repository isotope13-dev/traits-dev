defaults:
  for:
  - python
  platforms:
  - unix
traits:
- id: python-chmod-hidden-temp
  desc: Shell enables hidden temporary executable
  crit: notable
  conf: 0.98
  if:
    type: symbol
    kind: call
    exact: os.system
    arg:
      index: 0
      kind: string
      regex: chmod\s+\+x\s+/tmp/\.[\w.-]+
