defaults:
  platforms:
    - linux
    - macos
    - windows
composite_rules:
  - for:
      - scripts
      - manifests
      - html
      - xml
      - dockerfile
      - package-lock.json
      - groovy
      - c
      - cpp
      - objc
    id: chmod-hidden-path-reference
    desc: Executable chmod targets a hidden path
    crit: notable
    conf: 0.94
    any:
      - id: micro-behaviors/fs/chmod/executable/hidden::chmod-hidden-path-command-container
      - id: micro-behaviors/fs/chmod/executable/hidden::chmod-hidden-path-source
  - for:
      - c
      - cpp
    id: chmod-hidden-path-source
    desc: Shell execution and hidden-path chmod text
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/process/create/subprocess/reference::c-source-command-execution
    any:
      - id: micro-behaviors/fs/chmod/executable/hidden::chmod-hidden-tmp-executable
      - id: micro-behaviors/fs/chmod/executable/hidden::chmod-hidden-shm-executable
      - id: micro-behaviors/fs/chmod/executable/hidden::chmod-hidden-home-executable
