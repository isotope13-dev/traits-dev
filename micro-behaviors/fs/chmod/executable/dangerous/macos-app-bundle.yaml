defaults:
  platforms: [macos]
  mbc: E1222
  attack: T1222.002
  crit: notable

traits:
  - id: shell-chmod-777-quoted-macos-app
    desc: Sets mode 777 on quoted /Applications app
    conf: 0.92
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: chmod
      args:
        - kind: number
          value: 777
        - kind: string
          regex: '^/Applications/[^/\r\n]{1,96}\.app(/|$)'

  - id: shell-chmod-777-unquoted-macos-app
    desc: Sets mode 777 on /Applications app
    conf: 0.92
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: chmod
      args:
        - kind: number
          value: 777
        - kind: identifier
          name_regex: '^/Applications/[^/\r\n]{1,96}\.app(/|$)'

  - id: shell-chmod-symbolic-rwx-quoted-macos-app
    desc: Sets world-rwx on quoted /Applications app
    conf: 0.92
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: chmod
      args:
        - kind: identifier
          name_regex: '^(a|ugo)\+rwx$'
        - kind: string
          regex: '^/Applications/[^/\r\n]{1,96}\.app(/|$)'

  - id: shell-chmod-symbolic-rwx-unquoted-macos-app
    desc: Sets world-rwx on /Applications app
    conf: 0.92
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: chmod
      args:
        - kind: identifier
          name_regex: '^(a|ugo)\+rwx$'
        - kind: identifier
          name_regex: '^/Applications/[^/\r\n]{1,96}\.app(/|$)'

  - id: embedded-chmod-777-macos-app-text
    desc: Command text sets 777 on /Applications app
    conf: 0.9
    for: [applescript, python, macho]
    if:
      type: text
      exclude_comments: true
      regex: '\bchmod\s+(-[Rfv]+\s+)?(0?777|a\+rwx)\s+["'']?/Applications/[^/\r\n]{1,48}\.app\b'

composite_rules:
  - id: chmod-777-macos-app-bundle
    desc: Sets world-writable mode on /Applications app
    conf: 0.92
    for: [shell, applescript, python, macho]
    any:
      - id: shell-chmod-777-quoted-macos-app
      - id: shell-chmod-777-unquoted-macos-app
      - id: shell-chmod-symbolic-rwx-quoted-macos-app
      - id: shell-chmod-symbolic-rwx-unquoted-macos-app
      - id: embedded-chmod-777-macos-app-text
