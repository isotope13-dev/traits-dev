traits:
  # ExtUtils::Command and the perl test suite call chmod(0777) as the
  # utility itself. World-writable mode is a capability; the infector
  # composites in objectives/impact/infect/script/self-copy add the self-copy.
  - id: perl-chmod-0777
    desc: Perl chmod(0777, ...) call
    platforms: [unix]
    for: [perl, static-lib]
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bchmod\s*\(\s*0777\s*,'
