defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
  conf: 0.9
traits:
  # Exclude full-line comments while preserving actual command text.
  - id: sudo-chmod-777-tmp
    desc: sudo chmod 777 in temp paths
    if:
      type: text
      regex: '(?m)^[ \t]*(sudo|[^#\n][^\n]{0,200}sudo)\s+chmod\s+777\s+(/tmp/|/var/tmp/|/dev/shm/|\./)'
  - id: sudo-chmod-777-user
    desc: sudo chmod 777 in user-writable paths
    if:
      type: text
      regex: '(?m)^[ \t]*(sudo|[^#\n][^\n]{0,200}sudo)\s+chmod\s+777\s+(/home/|/root/|/usr/local/bin/)'
composite_rules:
  - id: sudo-chmod-777
    desc: sudo chmod 777 on writable paths
    any:
      - id: sudo-chmod-777-tmp
      - id: sudo-chmod-777-user
