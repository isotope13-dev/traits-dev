traits:
  - id: chmod-setuid-shell
    desc: chmod enables SUID on system shells
    crit: suspicious
    conf: 0.99
    platforms: [unix]
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '\bchmod\s+(0?[4567][0-7]{3}|[ua]\+s|\+s)\s+["'']?/(usr/)?bin/(sh|bash|dash|ksh|zsh)\b'
      exclude_comments: true
    unless:
      - id: metadata/file/catalog/threat-pattern::policy-command-test-catalog
      - id: metadata/package/testing/harness/unit::go-test-source-file
      - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
      - id: metadata/package/testing/corpus/command-classifiers::python-risk-command-corpus
