defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  mbc: E1222
  attack: T1222
  crit: notable
traits:
  - id: shell-777-decimal
    desc: Shell calls chmod with mode 777
    conf: 0.8
    for: [shell, batch]
    if:
      type: symbol
      kind: call
      exact: chmod
      arg:
        kind: number
        value: 777
  - id: shell-777-octal
    desc: Shell calls chmod with octal mode 0777
    conf: 0.8
    for: [shell, batch]
    if:
      type: symbol
      kind: call
      exact: chmod
      arg:
        kind: number
        value: 511
  - id: busybox-chmod-plus-x
    desc: BusyBox makes a file executable
    crit: notable
    conf: 0.9
    for: [elf, shell, binaries]
    platforms: [unix, android]
    attack: T1222.002
    if:
      type: text
      regex: '(?i)\bbusybox\s+chmod\s+\+x\b'
  - id: shell-666-decimal
    desc: Shell calls chmod with decimal mode 666
    crit: notable
    conf: 0.7
    for: [shell, batch]
    if:
      type: symbol
      kind: call
      exact: chmod
      arg:
        kind: number
        value: 666
  - id: shell-666-octal
    desc: Shell calls chmod with octal mode 0666
    crit: notable
    conf: 0.7
    for: [shell, batch]
    if:
      type: symbol
      kind: call
      exact: chmod
      arg:
        kind: number
        value: 438
  - id: shell-775-decimal
    desc: Shell calls chmod with decimal mode 775
    crit: notable
    conf: 0.7
    for: [shell, batch]
    if:
      type: symbol
      kind: call
      exact: chmod
      arg:
        kind: number
        value: 775
  - id: shell-775-octal
    desc: Shell calls chmod with octal mode 0775
    crit: notable
    conf: 0.7
    for: [shell, batch]
    if:
      type: symbol
      kind: call
      exact: chmod
      arg:
        kind: number
        value: 509
  - id: shell-888
    desc: Shell calls chmod with invalid mode 888
    crit: notable
    conf: 0.7
    for: [shell, batch]
    if:
      type: symbol
      kind: call
      exact: chmod
      arg:
        kind: number
        value: 888
  - id: python-777
    desc: Python chmod 777
    conf: 0.85
    for: [python]
    if:
      type: string_literal
      regex: chmod\([^)]{0,120}0?o?777\)
  - id: ruby-0777-parens
    desc: Ruby chmod(0777)
    conf: 0.85
    for: [ruby]
    if:
      type: text
      substr: chmod(0777)
  - id: ruby-0777-space
    desc: Ruby chmod 0777
    conf: 0.85
    for: [ruby]
    if:
      type: string_literal
      substr: chmod 0777
  - id: ruby-0o777
    desc: Ruby chmod(0o777)
    conf: 0.85
    for: [ruby]
    if:
      type: text
      substr: chmod(0o777)
  - id: native-chmod-0777-command
    desc: Native code builds chmod 0777 command
    crit: notable
    conf: 0.95
    for: [elf, macho]
    if:
      type: text
      substr: chmod 0777
  - id: sticky-1777
    desc: chmod 1777 sticky bit (legitimate)
    crit: baseline
    conf: 1.0
    for: [shell, batch]
    if:
      type: text
      regex: chmod\s+0?1777
  - id: var-tmp-777
    desc: chmod 777 /var/tmp (legitimate temp dir)
    crit: baseline
    conf: 1.0
    for: [shell, batch]
    if:
      type: text
      regex: \bchmod 0777 /var/tmp\b
composite_rules:
  - id: generic-shell-chmod
    desc: Dangerous chmod values (world-writable)
    for: [shell, batch]
    any:
      - id: shell-777
      - id: shell-666
      - id: shell-775
      - id: shell-888
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/package/testing/harness/runtime/
    downgrade:
      any:
        - id: metadata/signed/platform::apple
        - id: metadata/package/testing/presence/platform_suites::autoconf-testsuite
        - id: metadata/package/testing/presence/platform_suites::gnu-coreutils-test
  - id: shell-777
    desc: chmod 777 (world-writable+executable)
    conf: 0.8
    for: [shell, batch]
    any:
      - id: shell-777-decimal
      - id: shell-777-octal
    unless:
      - id: metadata/package/testing/harness/runtime/
    downgrade:
      any:
        - id: metadata/package/testing/presence/platform_suites::autoconf-testsuite
        - id: metadata/package/testing/presence/platform_suites::gnu-coreutils-test
  - id: shell-666
    desc: chmod 666 (world-writable)
    crit: notable
    conf: 0.7
    for: [shell, batch]
    any:
      - id: shell-666-decimal
      - id: shell-666-octal
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: shell-775
    desc: chmod 775 (group-writable+executable)
    crit: notable
    conf: 0.7
    for: [shell, batch]
    any:
      - id: shell-775-decimal
      - id: shell-775-octal
  - id: chmod-777
    desc: World-writable+executable permissions (777)
    crit: suspicious
    conf: 0.85
    any:
      - id: shell-777
      - id: python-777
      - id: ruby-0777-parens
      - id: ruby-0777-space
      - id: ruby-0o777
    unless:
      - id: sticky-1777
      - id: var-tmp-777
