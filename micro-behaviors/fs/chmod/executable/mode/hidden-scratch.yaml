traits:
- id: chmod-hidden-scratch-target
  desc: Chmod command targets hidden scratch path
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: \bchmod\s+[^\n]{0,120}(/dev/shm/|/tmp/)\.[a-zA-Z0-9][\w.-]{2,120}\b
defaults:
  platforms:
  - unix
  - android
  - ios
  for:
  - shell
  - python
  - javascript
  - elf
