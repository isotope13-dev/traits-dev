defaults:
  platforms:
  - unix
  for:
  - shell
traits:
- id: install-owner-execute-mode-option
  desc: install text specifies an owner-execute mode
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: (^|[\s;&|(])install\s+[^\n;]{0,80}-[A-Za-z]*m\s*[0-7]*[1357][0-7][0-7]\b
  unless:
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
