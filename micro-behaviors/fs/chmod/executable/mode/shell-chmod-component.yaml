defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: micro-behaviors/fs/chmod/executable/mode::shell-chmod-any
    desc: Any chmod executable command
    crit: component
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::shell-plus-x
      - id: micro-behaviors/fs/chmod/executable/mode::shell-chmod-0755
