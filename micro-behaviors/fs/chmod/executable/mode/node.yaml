defaults:
  platforms:
    - unix
    - windows
  for:
    - javascript
    - typescript
  mbc: E1222
  attack: T1222
  crit: notable
traits:
  - id: node-chmod-exec-mode-755
    desc: Node chmod sets 0o755 executable mode
    conf: 0.9
    if:
      type: symbol
      kind: call
      substr: chmod
      arg:
        kind: number
        value: 493
        radix: 8
  - id: node-chmod-exec-mode-string-755
    desc: Node chmod sets string 0755 executable mode
    conf: 0.9
    if:
      type: symbol
      kind: call
      substr: chmod
      arg:
        kind: string
        exact: '755'
  - id: node-chmod-exec-mode-777
    desc: Node chmod sets 0o777 executable mode
    conf: 0.9
    if:
      type: symbol
      kind: call
      substr: chmod
      arg:
        kind: number
        value: 511
        radix: 8
  - id: node-chmod-exec-mode-text
    desc: Node chmod with owner-executable octal mode
    conf: 0.82
    if:
      type: text
      regex: chmod(Sync)?\s*\([^,)\n]{0,80},\s*0o?[57][0-57][0-57]\b
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
  - id: node-chmod-exec-mode-decimal-493
    desc: Node chmod sets decimal 0755 executable mode
    conf: 0.82
    if:
      type: text
      regex: chmod(Sync)?\s*\([^,)\n]{0,80},\s*493\b
  - id: node-computed-chmod-member
    desc: Node calls computed chmodSync property
    conf: 0.85
    if:
      type: text
      regex: \[\s*["']chmod["']\s*\+\s*["']Sync["']\s*\]\s*\(
  - id: node-chmod-octal-755-argument
    desc: Node parses an octal 0755 mode
    conf: 0.85
    if:
      type: text
      regex: parseInt\s*\(\s*["']755["']\s*,\s*8\s*\)
  - id: node-sudo-prompt-chmod-executable
    desc: Node sudo-prompt grants executable permission
    conf: 0.92
    if:
      type: text
      regex: (?i)sudo[-_]prompt[\s\S]{0,160}chmod\s+\+x
composite_rules:
  - id: node-chmod-make-executable
    desc: Node requests executable file permissions
    conf: 0.88
    any:
      - id: node-chmod-exec-mode-755
      - id: node-chmod-exec-mode-string-755
      - id: node-chmod-exec-mode-777
      - id: node-chmod-exec-mode-text
      - id: node-chmod-exec-mode-decimal-493
      - id: node-computed-chmod-exec-mode-755
      - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
      - id: micro-behaviors/fs/write/stream::node-write-stream-executable-mode
  - id: node-computed-chmod-exec-mode-755
    desc: Node computed chmod sets executable 0755 mode
    conf: 0.9
    attack: T1222.002
    all:
      - id: node-computed-chmod-member
      - id: node-chmod-octal-755-argument
    near_bytes: 256
