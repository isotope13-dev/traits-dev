defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  mbc: E1222
  attack: T1222
  crit: notable
traits:
- id: javascript-owner-executable-mode-option
  desc: JavaScript specifies owner-only 0700 mode
  conf: 0.9
  if:
    type: text
    regex: \bmode\s*:\s*(0o700|0700|448)\b
- id: node-chmod-exec-mode-755
  desc: Node chmod sets 0o755 executable mode
  conf: 0.9
  if:
    type: symbol
    kind: call
    substr: chmod
    arg:
      kind: number
      value: 493
      radix: 8
- id: node-chmod-exec-mode-string-755
  desc: Node chmod sets string 0755 executable mode
  conf: 0.9
  if:
    type: symbol
    kind: call
    substr: chmod
    arg:
      kind: string
      exact: '755'
- id: node-chmod-exec-mode-777
  desc: Node chmod sets 0o777 executable mode
  conf: 0.9
  if:
    type: symbol
    kind: call
    substr: chmod
    arg:
      kind: number
      value: 511
      radix: 8
- id: node-chmod-exec-mode-text
  desc: Node chmod with owner-executable octal mode
  conf: 0.82
  if:
    type: text
    regex: chmod(Sync)?\s*\([^,)\n]{0,80},\s*0o?[57][0-57][0-57]\b
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/manifest::test-fixtures
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/build
- id: node-chmod-exec-mode-decimal-493
  desc: Node chmod sets decimal 0755 executable mode
  conf: 0.82
  if:
    type: text
    regex: chmod(Sync)?\s*\([^,)\n]{0,80},\s*493\b
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/manifest::test-fixtures
  - id: metadata/package/testing/presence/fixture::test-filename-pattern
  - id: metadata/build
- id: node-computed-chmod-member
  desc: Node calls computed chmodSync property
  conf: 0.85
  if:
    type: text
    regex: \[\s*["']chmod["']\s*\+\s*["']Sync["']\s*\]\s*\(
- id: node-chmod-octal-755-argument
  desc: Node parses an octal 0755 mode
  conf: 0.85
  if:
    type: text
    regex: parseInt\s*\(\s*["']755["']\s*,\s*8\s*\)
- id: node-write-mode-executable-option
  desc: Node write sets executable file mode
  conf: 0.88
  if:
    type: text
    regex: (WriteStream|writeFile|openSync)\w*\([^)]{0,160}mode:\s*0o?[1357][0-7][0-7]
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/manifest::test-fixtures
- id: node-fs-promises-write-executable-mode
  desc: fs.promises writes owner-executable file
  conf: 0.92
  attack: T1222.002
  if:
    type: text
    regex: fs\.promises\.writeFile.{0,240}mode:\s*0o700
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: metadata/package/testing/presence/manifest::test-fixtures
- id: node-sudo-prompt-chmod-executable
  desc: Node sudo-prompt grants executable permission
  conf: 0.92
  if:
    type: text
    regex: (?i)sudo[-_]prompt[\s\S]{0,160}chmod\s+\+x
composite_rules:
- id: node-writefile-owner-executable-mode
  desc: Node writeFile creates owner-executable file
  conf: 0.96
  all:
  - id: micro-behaviors/fs/write/file/full::node-writefile-aliased-import
  - id: javascript-owner-executable-mode-option
- id: node-chmod-make-executable
  desc: Node makes a file executable
  conf: 0.88
  any:
  - id: node-chmod-exec-mode-755
  - id: node-chmod-exec-mode-string-755
  - id: node-chmod-exec-mode-777
  - id: node-chmod-exec-mode-text
  - id: node-chmod-exec-mode-decimal-493
  - id: node-computed-chmod-exec-mode-755
  - id: node-write-mode-executable-option
  - id: micro-behaviors/fs/write/file/executable::node-write-file-executable-mode
- id: node-computed-chmod-exec-mode-755
  desc: Node computed chmod sets executable 0755 mode
  conf: 0.9
  attack: T1222.002
  all:
  - id: node-computed-chmod-member
  - id: node-chmod-octal-755-argument
  near_bytes: 256
