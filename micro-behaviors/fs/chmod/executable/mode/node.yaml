# Node.js "make a file executable" — fs.chmod/chmodSync with an owner-executable
# octal mode. Neutral capability (a legitimate native-module installer also
# chmods its downloaded binary); it becomes a dropper signal only when paired
# with remote download + process execution in the composites under
# objectives/command-and-control/dropper/, which reference these cross-dir.
#
# Two surfaces: the call-fact form keys on the parsed numeric argument so it is
# style-independent and radix-discriminated (a deliberate `0o755` octal mode,
# value 493 written in radix 8 — never an incidental decimal 493); the text form
# is a fallback for variant exec modes and chained `.then(()=>fs.chmod(...))`.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  mbc: E1222
  attack: T1222
  crit: notable
traits:
  - id: node-chmod-exec-mode-755
    desc: Node chmod sets 0o755 executable mode
    conf: 0.9
    if:
      type: symbol
      kind: call
      substr: chmod
      arg:
        kind: number
        value: 493
        radix: 8
  - id: node-chmod-exec-mode-string-755
    desc: Node chmod sets string 0755 executable mode
    conf: 0.9
    if:
      type: symbol
      kind: call
      substr: chmod
      arg:
        kind: string
        exact: "755"
  - id: node-chmod-exec-mode-777
    desc: Node chmod sets 0o777 executable mode
    conf: 0.9
    if:
      type: symbol
      kind: call
      substr: chmod
      arg:
        kind: number
        value: 511
        radix: 8
  - id: node-chmod-exec-mode-text
    desc: Node chmod with owner-executable octal mode
    conf: 0.82
    if:
      type: text
      regex: 'chmod(Sync)?\s*\([^,)\n]{0,80},\s*0o?[57][0-57][0-57]\b'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/library/structure/
  - id: node-chmod-exec-mode-decimal-493
    desc: Node chmod sets decimal 0755 executable mode
    conf: 0.82
    if:
      type: text
      regex: 'chmod(Sync)?\s*\([^,)\n]{0,80},\s*493\b'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - id: metadata/library/structure/
  - id: node-computed-chmod-member
    desc: Node calls computed chmodSync property
    conf: 0.85
    if:
      type: text
      regex: '\[\s*["'']chmod["'']\s*\+\s*["'']Sync["'']\s*\]\s*\('
  - id: node-chmod-octal-755-argument
    desc: Node parses an octal 0755 mode
    conf: 0.85
    if:
      type: text
      regex: 'parseInt\s*\(\s*["'']755["'']\s*,\s*8\s*\)'
  # Node can hand a file its execute bit at CREATION time via the `mode` option
  # on createWriteStream/writeFile/openSync, so a stager never has to call
  # chmod at all — Snyk's own CLI downloader does exactly this
  # (`fs.createWriteStream(path, { mode: 0o766 })`), and so does any dropper
  # that pipes a fetched binary straight to disk. Owner-executable modes only:
  # the first octal digit must carry the x bit (1/3/5/7).
  - id: node-write-mode-executable-option
    desc: Node write sets executable file mode
    conf: 0.88
    if:
      type: text
      regex: '(WriteStream|writeFile|openSync)\w*\([^)]{0,160}mode:\s*0o?[1357][0-7][0-7]'
    # Deliberately NOT excluded on metadata/library/structure/: that directory
    # matches tsc/bundler re-export helpers, which are present in every
    # TypeScript-compiled JS file — including every compiled stager.
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
  - id: node-fs-promises-write-executable-mode
    desc: fs.promises writes owner-executable file
    conf: 0.92
    attack: T1222.002
    if:
      type: text
      regex: 'fs\.promises\.writeFile.{0,240}mode:\s*0o700'
    unless:
      - id: metadata/package/testing/harness/runtime/
      - id: metadata/package/testing/presence/manifest::test-fixtures
  - id: node-sudo-prompt-chmod-executable
    desc: Node sudo-prompt grants executable permission
    conf: 0.92
    if:
      type: text
      regex: '(?i)sudo[-_]prompt[\s\S]{0,160}chmod\s+\+x'
composite_rules:
  - id: node-chmod-make-executable
    desc: Node makes a file executable
    crit: notable
    conf: 0.88
    any:
      - id: node-chmod-exec-mode-755
      - id: node-chmod-exec-mode-string-755
      - id: node-chmod-exec-mode-777
      - id: node-chmod-exec-mode-text
      - id: node-chmod-exec-mode-decimal-493
      - id: node-computed-chmod-exec-mode-755
      - id: node-write-mode-executable-option
  - id: node-computed-chmod-exec-mode-755
    desc: Node computed chmod sets executable 0755 mode
    crit: notable
    conf: 0.9
    attack: T1222.002
    all:
      - id: node-computed-chmod-member
      - id: node-chmod-octal-755-argument
    near_bytes: 256
