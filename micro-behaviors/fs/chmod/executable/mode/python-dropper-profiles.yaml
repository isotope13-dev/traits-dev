defaults:
  for: [python]
  platforms: [unix, windows]
composite_rules:
  - id: python-curl-output-chmod-profile
    desc: Python shell curl output and chmod
    crit: suspicious
    conf: 0.9
    all:
      - id: micro-behaviors/process/create/shell-subprocess::shell-true
      - id: micro-behaviors/communications/http/download/curl::curl-slo-variable-output
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-plusx-variable-output
  - id: python-os-system-curl-chmod-profile
    desc: os.system with curl output and chmod
    crit: suspicious
    conf: 0.96
    platforms: [unix]
    near_lines: 6
    all:
      - id: micro-behaviors/process/create/shell/command-mode::python-os-system
      - id: micro-behaviors/communications/http/download/curl::curl-output-file
      - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-tmp-file
