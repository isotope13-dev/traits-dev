# Temp-path, chmod, download and subprocess clues do not show that the child
# runs the fetched or chmodded file.
defaults:
  platforms: [linux, macos, windows, unix, android, ios]
  for: [python]

composite_rules:
  - id: python-temp-download-chmod-subprocess-profile
    desc: Python temp, chmod, download and subprocess clues
    crit: suspicious
    conf: 0.95
    scope: file
    near_lines: 40
    all:
      - id: micro-behaviors/fs/path/temp::unix-temp
      - id: micro-behaviors/fs/chmod/executable/mode::python-executable
      - id: micro-behaviors/process/create/subprocess::python-subprocess-launch-calls
    any:
      - id: micro-behaviors/communications/http/get::requests-get
      - id: micro-behaviors/communications/http/client/exchange::urllib-urlopen-call
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlretrieve-dup
    unless:
      - id: metadata/build/recognized-contexts::command-gated-vendor-tunnel-bootstrap
      - id: micro-behaviors/process/info/selfpath::self-update-or-pinned-bootstrap-context
      - id: micro-behaviors/communications/http/url/endpoint::mcp-connection-test-doc-range-target
