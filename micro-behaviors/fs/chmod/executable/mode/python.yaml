# Executable permission bits applied from Python, as a numeric literal or via
# the stat constants. Held apart from the write so the mode reads as its own
# signal wherever the bytes came from.
defaults:
  conf: 0.9
  platforms: [windows, unix]
  for:
    - python
  crit: notable
  mbc: C0016
composite_rules:
  - id: python-executable-mode-literal
    desc: Python executable mode literal
    crit: component
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::python-executable
      - id: micro-behaviors/fs/chmod/executable/mode::python-owner-executable-bit
  - id: python-executable-mode-stat
    desc: Python executable mode stat constant
    crit: component
    any:
      - id: micro-behaviors/fs/chmod/executable/mode::python-stat-iexec
      - id: micro-behaviors/fs/chmod/executable/mode::python-stat-ixusr
  - id: python-executable-mode
    desc: Python applies an executable permission mode
    crit: component
    any:
      - id: python-executable-mode-literal
      - id: python-executable-mode-stat
