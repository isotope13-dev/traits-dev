defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.94
traits:
  - id: curl-output-chmod-same-path
    desc: curl output path equals chmod target
    if:
      type: tree-sitter
      language: shell
      query: |
        ((_
          (command name: (command_name) @curl
            argument: (word) @output_flag . argument: (_) @output
            argument: (_) @url)
          (command name: (command_name) @chmod
            argument: (word) @mode . argument: (_) @target))
          (#match? @curl "(^|/)curl$")
          (#match? @output_flag "^(-o|--output)$")
          (#match? @url "^['\"]?https?://")
          (#match? @chmod "(^|/)chmod$")
          (#eq? @mode "+x")
          (#eq? @output @target))
