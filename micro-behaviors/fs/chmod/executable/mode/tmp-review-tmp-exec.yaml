defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.8
traits:
  - id: android-tmp-chmod-path-clues
    desc: Android temp chmod and path clues
    crit: notable
    conf: 0.92
    platforms: [unix, android]
    for: [elf, shell, c, cpp]
    if:
      type: text
      regex: 'chmod\s+\+x\s+/data/local/tmp/.{1,40}/data/local/tmp/'
