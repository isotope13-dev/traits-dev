defaults:
  platforms: [macos]
  for: [pkg]
composite_rules:
- id: macpkg-hook-chmod-staged-fetch
  desc: Installer hook, curl, and executable chmod clues
  crit: suspicious
  conf: 0.97
  platforms: [macos, windows, linux]
  for: [pkg, shell]
  all:
    - id: metadata/build/package/recipe/installer::macos-installer-hook-basename
    - id: micro-behaviors/communications/http/curl/command::curl-command-remote-url
    - id: micro-behaviors/fs/chmod/executable/mode::chmod-exec-absolute-path

