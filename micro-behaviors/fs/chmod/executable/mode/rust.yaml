defaults:
  crit: notable
  platforms: [linux, macos]
  for: [rust]

traits:
  - id: rust-command-chmod-plus-x
    desc: Rust child command runs chmod +x
    conf: 0.94
    attack: T1222.002
    if:
      type: text
      regex: 'Command::new\s*\(\s*"chmod"\s*\)[\s\S]{0,240}\.(args|arg)\s*\([\s\S]{0,120}"\+x"'

  - id: set-permissions-call
    desc: Rust set permissions call
    conf: 0.84
    if:
      type: text
      substr: fs::set_permissions(

  - id: permissions-from-mode-755
    desc: Rust sets mode 0755
    conf: 0.9
    if:
      type: text
      regex: 'Permissions::from_mode\(\s*0o755\s*\)'

  # PermissionsExt::set_mode is the other spelling of the same mode bits.
  # `perms.set_mode(0o755)` then `fs::set_permissions` is how a build script
  # marks a dropped file executable without constructing Permissions::from_mode.
  - id: permissions-set-mode-755
    desc: Rust set_mode uses mode 0755
    conf: 0.9
    if:
      type: text
      regex: '\.set_mode\(\s*0o755\s*\)'

composite_rules:
  - id: rust-executable-permissions
    desc: Rust sets executable permissions
    conf: 0.91
    all:
      - id: set-permissions-call
    any:
      - id: permissions-from-mode-755
      - id: permissions-set-mode-755
    needs: 1
