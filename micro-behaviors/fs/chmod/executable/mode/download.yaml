traits:
- id: native-download-then-chmod
  desc: Embedded download followed by executable chmod
  crit: notable
  conf: 0.98
  if:
    type: text
    regex: (?i)(wget|curl)[^\n]{0,120}chmod\s+(\+x|777)
  unless:
  - id: well-known/tool/detection/ascan::ascan-defensive-scanner-context
  - id: well-known/tool/detection/ascan::ascan-package-context
  - id: well-known/tool/detection/ascan::ascan-package-path
defaults:
  platforms:
  - linux
  - android
  for:
  - elf
