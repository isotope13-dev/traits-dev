traits:
- id: native-download-then-chmod
  desc: Embedded download followed by executable chmod
  crit: notable
  conf: 0.98
  if:
    type: text
    # Numeric modes are common in native installers and bot launchers. The
    # final octal digit is odd when it grants an execute bit to any class.
    regex: (?i)(wget|curl)[^\n]{0,120}chmod\s+(\+x|[0-7]*[1357])
  unless:
  - id: well-known/tool/detection/ascan::ascan-defensive-scanner-context
  - id: well-known/tool/detection/ascan::ascan-package-context
  - id: well-known/tool/detection/ascan::ascan-package-path
defaults:
  platforms:
  - linux
  - android
  for:
  - elf
