traits:
  - id: chmod-setuid-shell
    desc: chmod enables SUID on system shells
    crit: suspicious
    conf: 0.99
    platforms: [unix]
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '\bchmod\s+(0?[4567][0-7]{3}|[ua]\+s|\+s)\s+["'']?/(usr/)?bin/(sh|bash|dash|ksh|zsh)\b'
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::cybersecurity-skill-template-guide
      # A privesc writeup quotes `chmod u+s /bin/bash` as prose; the quoted
      # command is documentation, not a permission change the file performs.
      - id: metadata/file/extension/identity::markdown-file-basename
