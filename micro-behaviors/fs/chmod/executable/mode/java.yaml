# Permission bits a JVM program sets on a file it wrote. The write itself is
# ordinary; the mode is what decides whether the result is a config file or
# something the loader will run, so it is measured here rather than beside the
# write.
defaults:
  crit: notable
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: java-file-setexecutable-bytecode
    desc: Java File executable-permission API reference
    conf: 0.92
    for: [class, dex]
    platforms: [unix, windows, android]
    if:
      type: import
      regex: '^(java/io/File\.|Ljava/io/File;->)setExecutable$'
  # PosixFilePermission is a JVM-wide enum; Kotlin, Scala and Groovy name the
  # constant exactly as Java does.
  - id: java-owner-execute-permission
    desc: Java sets owner execute permission
    conf: 0.9
    for: [class, java, groovy, kotlin, scala]
    if:
      type: text
      substr: OWNER_EXECUTE
  - id: java-world-executable-permission
    desc: Java sets world-executable permission
    conf: 0.9
    for: [java]
    if:
      type: text
      substr: setExecutable(true, false)
  - id: kotlin-set-executable-source
    desc: Kotlin marks a file executable
    conf: 0.9
    for: [kotlin]
    if:
      type: text
      regex: '\.setExecutable\s*\(\s*true'
  - id: jvm-owner-execute-permission
    desc: JVM bytecode owner execute perm
    conf: 0.9
    for: [class]
    if:
      type: symbol
      exact: java/nio/file/attribute/PosixFilePermission.OWNER_EXECUTE
