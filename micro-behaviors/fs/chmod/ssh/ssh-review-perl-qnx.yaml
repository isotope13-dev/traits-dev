defaults:
  platforms: [qnx, unix]
  for: [perl]

traits:
  - id: perl-authorized-keys-chmod-clues
    desc: Perl authorized_keys and chmod text
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'authorized_keys[\s\S]{0,800}chmod\s+0600|chmod\s+0600[\s\S]{0,800}authorized_keys'

