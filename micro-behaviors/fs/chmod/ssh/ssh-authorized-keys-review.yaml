defaults:
  crit: suspicious
  for: [scripts, binaries]
  platforms:
  - unix
  size_max: 104857600
traits:
- id: chmod-ssh-dir
  desc: Sets permissions on .ssh directory
  crit: component
  conf: 0.7
  if:
    type: text
    regex: chmod\s+[0-9]+.{0,30}\.ssh
- id: chmod-ssh-go-eq
  desc: Restricts group other SSH perms
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: chmod\s+-R\s+go=\s+~?/?\.ssh
