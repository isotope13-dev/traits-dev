defaults:
  for: [macho]
  platforms: [macos]
  conf: 0.98
traits:
  - id: sequential-32-36-byte-wipes
    desc: Sequential 32-byte and 36-byte buffer wipes
    crit: notable
    size_max: 33554432
    if:
      type: yara
      source: |
        rule sequential_salt_password_wipe {
          strings:
            $wipe = { C6 84 05 ?? ?? ?? ?? 00 48 FF C0 48 83 F8 20 75 ?? 31 C0 C6 84 05 ?? ?? ?? ?? 00 48 FF C0 48 83 F8 24 75 }
          condition:
            $wipe
        }
