defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-zero-loop-before-release-call
    desc: Zeroes buffer before memory-release call
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      # Two-byte unrolled zero fill, restored allocation pointer, then
      # MEM_RELEASE with zero size. Import displacement is unconstrained.
      pattern: 'C6 00 00 48 83 C0 02 C6 40 FF 00 48 39 C1 75 ?? 48 8B 8C 24 [4] 41 B8 00 80 00 00 31 D2 FF 15 [4]'
