# Explicit initialization belongs with memory filling, not data-buffer
# allocation. Preserve the original matcher, scope, confidence and severity.
# A zero first argument alone or quoted source does not supply the fill operand.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-explicit-zero-fill-buffer
    desc: Node Buffer allocation explicitly fills zeros
    crit: baseline
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: Buffer.alloc
      arg:
        index: 1
        kind: number
        value: 0
