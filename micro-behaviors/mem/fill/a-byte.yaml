defaults:
  platforms: [unix, windows]
  for: [c, cpp, perl]
  crit: notable
  conf: 0.9
traits:
  - id: memset-a-byte-fill
    desc: Fills memory with A bytes
    for: [c, cpp]
    if:
      type: text
      regex: '\bmemset\s*\([^;\n]{0,60}[''"]A[''"]'

  - id: perl-a-byte-fill
    desc: Perl generates string filled with A bytes
    for: [perl]
    if:
      type: text
      substr: '"A" x 4096'
