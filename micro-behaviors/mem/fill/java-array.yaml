defaults:
  platforms: [windows, unix]
  for: [java]

traits:
  - id: java-array-fill-byte-constant
    desc: Fills array with byte constant
    crit: baseline
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '\bArrays\.fill\(\s*[A-Za-z_$][\w$]*\s*,\s*\(\s*byte\s*\)\s*0x[0-9a-fA-F]+\s*\)'
