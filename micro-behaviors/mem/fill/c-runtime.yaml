# C Runtime Memory Operations
# Standard C library memory management
defaults:
  for: ["pe", "dll"]
  platforms: ["windows"]
traits:
  - id: memset
    desc: Memory fill operation
    crit: baseline
    conf: 0.90
    for: [pe, dll, c, cpp]
    platforms: [windows, linux, macos]
    if:
      type: symbol
      exact: "memset"
  - id: nonzero-memset-source
    desc: Fills memory with a nonzero byte
    crit: baseline
    conf: 0.94
    for: [c, cpp, csharp]
    platforms: [windows, linux, macos]
    if:
      type: text
      regex: '\bmemset\s*\([^,]{1,120},\s*(0x[1-9A-Fa-f][0-9A-Fa-f]*|[1-9][0-9]*|''[^\\0]'')\s*,'
  - id: vectorized-zero-fill
    desc: Vectorized zero-fill instruction sequence
    crit: notable
    conf: 0.6
    arch: [x86-64]
    size_max: 5242880
    count_min: 3
    if:
      type: hex
      section: .text
      pattern: 0F 57 C0 0F 11
