# A bounded space-fill call setup, followed by moving the destination past
# that page. The memset reference corroborates the probable memory operation;
# only the SHC consumer identifies the buffer as a shell script argument.
defaults:
  platforms: [macos]
  for: [macho]
  arch: [x86-64]

traits:
  - id: x64-space-fill-page-prefix
    desc: memset space/page-prefix call shape
    crit: notable
    conf: 0.9
    if:
      type: yara
      source: |
        rule x64_space_fill_page_prefix {
          strings:
            $memset = "_memset" ascii
            $fill = { BE 20 00 00 00 BA 00 10 00 00 [0-16] E8 [4]
                      [0-32] 48 81 C7 00 10 00 00 }
          condition:
            $memset and $fill
        }
