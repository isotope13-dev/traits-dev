defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  # Output is terminated and copied into a string object; the input and
  # output scratch buffers are then wiped by separate bytewise loops.
  - id: x86-string-copy-scratch-wipe
    desc: Buffer handoff then two bytewise wipe loops
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: '8B 4D ?? 57 C6 04 37 00 E8 ?? ?? ?? ?? 8B 4D ?? 8B C1 85 F6 74 ?? C6 00 00 40 83 EE 01 75 ?? 8B C7 C6 00 00 40 83 EB 01 75 ??'
