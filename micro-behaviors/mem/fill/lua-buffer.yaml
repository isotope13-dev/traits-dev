defaults:
  for: [lua]
  platforms: [windows, unix]
  crit: notable
  conf: 0.96
traits:
  - id: lua-allocated-buffer-zero-fill
    desc: Lua zero-fills an allocated indexed buffer
    if:
      type: tree-sitter
      language: lua
      query: |
        (_
          (variable_declaration
            (assignment_statement
              (variable_list name: (identifier) @buffer)
              (expression_list value: (function_call
                name: (dot_index_expression field: (identifier) @new)
                arguments: (arguments (string))))))
          (for_statement
            clause: (for_numeric_clause name: (identifier) @index start: (number) @start)
            body: (block
              (assignment_statement
                (variable_list name: (bracket_index_expression
                  table: (identifier) @destination field: (identifier) @subscript))
                (expression_list value: (number) @zero))))
          (#eq? @new "new") (#eq? @buffer @destination)
          (#eq? @index @subscript) (#eq? @start "0") (#eq? @zero "0"))
