defaults:
  platforms: [windows]
  for: [data]
traits:
  - id: x64-opaque-import-name-erasure
    desc: Erases import names after pointer resolution
    crit: notable
    conf: 0.98
    if:
      type: hex
      # Indirect resolver call, write resolved pointer, clear the hint word,
      # then clear each character of IMAGE_IMPORT_BY_NAME until NUL.
      pattern: '41 FF D5 48 8B 4C 24 ?? 45 33 DB 48 89 01 48 8B 44 24 ?? 66 44 89 18 48 83 C0 02 EB ?? 44 88 18 48 FF C0 44 38 18 75 ??'
