defaults:
  platforms:
    - linux
    - macos
traits:
  - id: prot-exec-const
    desc: PROT_EXEC memory protection constant
    crit: baseline
    conf: 0.6
    for:
      - elf
      - macho
      - rust
    if:
      type: text
      substr: PROT_EXEC
    unless:
      # A -g3 build copies every #include'd macro name into the debug string
      # pool, so <sys/mman.h> alone puts "PROT_EXEC 0x4" in any unstripped
      # binary that never maps an executable page.
      - id: metadata/binary/section/label::dwarf-macro-table
