defaults:
  platforms: [windows]
traits:
  - id: page-execute-readwrite
    desc: PAGE_EXECUTE_READWRITE flag name reference
    crit: notable
    conf: 0.9
    for:
      - pe
      - dll
      - c
      - cpp
      - csharp
      - rust
      - powershell
    if:
      type: text
      substr: PAGE_EXECUTE_READWRITE
  - id: page-execute-constant
    desc: PAGE_EXECUTE flag name reference
    crit: notable
    conf: 0.8
    for: [pe, dll]
    if:
      type: text
      word: PAGE_EXECUTE
