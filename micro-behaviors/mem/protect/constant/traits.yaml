defaults:
  platforms: [linux, macos, windows]
  for: [elf, pe, macho, so, dll, c, cpp, python, shell, javascript]
traits:
  - id: repeated-rw-rx-page-flag-sequence
    desc: Repeated RW to RX protection flag sequence
    crit: component
    conf: 0.82
    platforms: [windows]
    for: [pe]
    arch: [x86-64]
    size_max: 5242880
    count_min: 3
    if:
      type: hex
      section: .text
      pattern: 41 (B8|B9) 04 00 00 00 [0-256] 41 (B8|B9) 20 00 00 00

  - id: page-noaccess-source
    desc: PAGE_NOACCESS memory protection constant
    crit: notable
    conf: 0.98
    platforms: [windows]
    for: [c, cpp, csharp, rust, go]
    if:
      type: text
      word: PAGE_NOACCESS

  - id: prot-write
    desc: PROT_WRITE memory protection constant
    crit: baseline
    conf: 0.6
    ref: sha256:98cf2b942c5daa7a4e2e32ed3a4cf83d1b8f86ae6868bfae35392621fca6b5a9
    if:
      type: text
      word: PROT_WRITE
    unless:
      - id: well-known/tool/detection/malware-config-parser
      - id: metadata/package/testing/
      - id: metadata/lang/compiler/systems/
      - id: metadata/build/bundler/runtime::js-emscripten-preamble-marker
      - id: metadata/build/autotools::autoconf-generated-script
      - type: path
        regex: 'Cython[\\/]Includes[\\/]posix[\\/]mman\.pxd$'
      - id: "metadata/file/naming::test-directory-component"
