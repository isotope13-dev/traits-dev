# Memory Protection - Python
# ATT&CK: T1055 (Process Injection)
defaults:
  platforms: [windows]
  for: [python]

traits:
  - id: virtualprotect-ctypes
    desc: VirtualProtect via Python ctypes
    crit: suspicious
    conf: 0.85
    attack: "T1055"
    if:
      type: symbol
      kind: call
      exact: "ctypes.windll.kernel32.VirtualProtect"

  - id: python-virtualprotect-rwx
    desc: RWX VirtualProtect call in Python text
    crit: suspicious
    conf: 0.96
    if:
      # Require the executable+writable protection argument at the call site;
      # a binding or mention of VirtualProtect alone does not establish use.
      type: text
      regex: '(?s)\bVirtualProtect\s*\(.{0,200}?(0x40|64)\s*,'
