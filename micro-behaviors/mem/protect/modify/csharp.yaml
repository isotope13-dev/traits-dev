# Windows memory-protection APIs reached through C# P/Invoke.
defaults:
  platforms: [windows]
  for: [csharp]

traits:
  - id: virtual-protect-pinvoke
    desc: C# P/Invokes VirtualProtect
    crit: notable
    conf: 0.96
    attack: T1620
    if:
      type: text
      regex: '(?is)DllImport.{0,120}(kernel32|kernelbase)\.dll.{0,120}VirtualProtect(Ex)?\s*\('
