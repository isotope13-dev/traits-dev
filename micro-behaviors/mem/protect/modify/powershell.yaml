# PowerShell references to the page-protection APIs.
#
# These are name references and nothing more, which is why they are notable
# capability facts rather than an objective: a script that flips page
# protection is doing something worth an analyst's eye, but the reason could be
# a memory patcher, a shellcode loader, or a legitimate interop wrapper. The
# same pair for VirtualAlloc already lives in
# micro-behaviors/mem/alloc/executable/powershell.yaml, and the PE and
# JavaScript spellings in ../traits.yaml; PowerShell was the gap, so these two
# atoms had been filed under objectives/evasion/anti-av/platform/defender as
# `virtualprotect-word` at `crit: suspicious`. That reported "Defender evasion"
# to an analyst on the strength of one word -- Metasploit's own
# rex-powershell payload templates read that way -- so they moved here and the
# AMSI composites that consume them reference them across directories.
defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable

traits:
  - id: powershell-virtualprotect-name
    desc: PowerShell references VirtualProtect
    conf: 0.8
    if:
      type: text
      word: VirtualProtect

  - id: powershell-virtualprotect-name-encoded
    desc: VirtualProtect named in an encoded blob
    conf: 0.92
    if:
      type: encoded
      word: VirtualProtect
