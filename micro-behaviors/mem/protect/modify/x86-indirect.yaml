defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  crit: notable
traits:
  - id: x86-indirect-rwx-protect-call
    desc: x86 indirect call with RWX protection arguments
    conf: 0.94
    if:
      type: hex
      section: text
      # VirtualProtect-shaped call: address, length, PAGE_EXECUTE_READWRITE,
      # old-protection pointer. Addresses and payload length are wildcarded.
      pattern: 'B9 40 00 00 00 BA ?? ?? ?? ?? 68 ?? ?? ?? ?? 51 68 ?? ?? ?? ?? 52 FF D0'
