# These independent matches establish co-occurrence, not payload data flow,
# encryption, execution of resource bytes, or malware identity.
defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
- id: resource-process-protection-api-set
  desc: Memory protection API with resource and process APIs
  crit: notable
  conf: 0.97
  all:
    - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
    - id: micro-behaviors/data/embedded/payload/resource::pe-resource-loader-api-chain
    - id: micro-behaviors/mem/protect/modify::virtual-protect
    - id: micro-behaviors/process/enumerate/snapshot::toolhelp-process-enumeration
    - id: micro-behaviors/process/create/spawn::child-process-creation-api
  unless:
    - id: metadata/signed/platform/
    - id: metadata/binary/installer/family/
    - id: metadata/binary/framework/
    - id: well-known/app/security/itop-vpn::benign-context
    - id: well-known/dual-use/transfer/winscp/
    - id: well-known/tool/browser::chromium-family-setup

