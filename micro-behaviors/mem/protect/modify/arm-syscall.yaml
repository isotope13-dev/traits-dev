defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98

traits:
  # musl aligns the address and length to pages before the syscall. The
  # intervening arithmetic defeats conservative syscall-number recovery.
  # Match the alignment instructions as well as the number and SVC, with
  # no wildcard gap that could conceal an overwrite of the syscall register.
  - id: aarch64-mprotect-page-alignment-wrapper
    desc: AArch64 page-aligned mprotect syscall wrapper
    arch: [aarch64]
    if:
      type: hex
      section: text
      pattern: '48 1C 80 D2 42 7C 40 93 04 ?? ?? F9 FE 0F 1F F8 E5 03 04 CB 84 04 00 D1 84 00 01 8B 60 00 05 8A 61 00 04 8B 21 00 05 8A 21 00 00 CB 01 00 00 D4'
    unless:
      - id: mprotect-syscall

  - id: arm-mprotect-page-alignment-wrapper
    desc: ARM EABI page-aligned mprotect syscall wrapper
    arch: [arm]
    if:
      type: hex
      section: text
      pattern: '7D 70 A0 E3 00 E0 6C E2 01 C0 4C E2 01 C0 8C E0 0C 10 83 E0 0E 00 03 E0 0E 10 01 E0 00 10 41 E0 00 00 00 EF'
    unless:
      - id: mprotect-syscall
