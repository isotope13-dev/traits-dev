defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98

traits:
  - id: aarch64-mprotect-page-alignment-wrapper
    desc: AArch64 page-aligned mprotect syscall wrapper
    arch: [aarch64]
    if:
      type: hex
      section: text
      pattern: '48 1C 80 D2 42 7C 40 93 04 ?? ?? F9 FE 0F 1F F8 E5 03 04 CB 84 04 00 D1 84 00 01 8B 60 00 05 8A
        61 00 04 8B 21 00 05 8A 21 00 00 CB 01 00 00 D4'
    unless:
      - id: micro-behaviors/mem/protect/modify/unspecified::mprotect-syscall
