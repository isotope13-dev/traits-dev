defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.98

traits:
  - id: arm-mprotect-page-alignment-wrapper
    desc: ARM EABI page-aligned mprotect syscall wrapper
    arch: [arm]
    if:
      type: hex
      section: text
      pattern: '7D 70 A0 E3 00 E0 6C E2 01 C0 4C E2 01 C0 8C E0 0C 10 83 E0 0E 00 03 E0 0E 10 01 E0 00 10 41 E0
        00 00 00 EF'
    unless:
      - id: micro-behaviors/mem/protect/modify/unspecified::mprotect-syscall
