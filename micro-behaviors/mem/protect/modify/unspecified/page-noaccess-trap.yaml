# x64 sequence that page-aligns an address (`and reg, -0x1000`), invokes a
# memory-protection helper with PAGE_NOACCESS (1), and immediately branches
# into the protected target so execution traps into an exception handler.
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]

traits:
  - id: x64-page-noaccess-trap-call
    desc: Protects page NOACCESS then branches into it
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .text
      pattern: 'BA 01 00 00 00 [0-8] 48 81 E1 00 F0 FF FF [0-8] E8 ?? ?? ?? ?? [0-8] FF (15 ?? ?? ?? ??|D0|D3|D6|D7)'
