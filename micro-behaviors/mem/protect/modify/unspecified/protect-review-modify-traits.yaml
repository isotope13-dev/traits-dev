defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
traits:
  - id: virtual-protect-source-call
    desc: Calls VirtualProtect in native source
    crit: notable
    conf: 0.92
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: VirtualProtect
    unless:
      - id: well-known/lib/development/sanitizer-runtime::sanitizer-runtime-source-path

  - id: nt-protect-virtual-memory-source
    desc: Calls NtProtectVirtualMemory in source
    crit: notable
    conf: 0.94
    mbc: C0021
    for: [c, cpp, rust, go, python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)NtProtectVirtualMemory$'
