defaults:
  crit: notable
  platforms: [linux, macos]
traits:
  - id: native-mprotect-source-call
    desc: Calls mprotect to change memory-page permissions
    conf: 0.95
    platforms: [unix]
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: mprotect
  - id: mprotect-symbol
    desc: Calls mprotect memory-protection API
    conf: 0.95
    for: [shell, python]
    if:
      type: symbol
      kind: call
      regex: "(^|\\.)mprotect$"
    unless:
      - id: well-known/app/ai/coding-agent/tabby::tabby-basename
      - id: well-known/lib/data/polars::cpu-check-module
      - id: well-known/tool/development/debug/debugpy::source-path-marker
  - id: mprotect-syscall
    desc: Changes memory protection via direct syscall
    conf: 0.6
    platforms: [linux]
    for: [elf]
    if:
      type: syscall
      name: [mprotect]
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiler/systems::go-version-string
  # Require the protection bits on a resolved syscall. The integer 7 in
  # headers, relocations or unrelated data is not a memory-permission request.
