defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-gui-buffer-rwx-protect-call
    desc: x86 buffer protection call with RWX flag
    crit: notable
    conf: 0.97
    if:
      type: hex
      section: .text
      pattern: '6A 40 23 CE [0-12] 51 50 B8 04 00 00 00 A3 [4] A1 [4] FF D0'
