defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86]
  crit: notable
  conf: 0.95
traits:
  - id: tls-buffer-rwx-arguments-x86
    desc: Passes TLS buffer with RWX protection arguments
    if:
      type: hex
      section: .text
      # old-protection pointer, PAGE_EXECUTE_READWRITE, arbitrary size,
      # buffer loaded through fs:[0x2c], then runtime-resolved function call.
      pattern: '8D 4D ?? 51 6A 40 68 ?? ?? ?? ?? 64 8B 15 2C 00 00 00 8B 02 8B 88 ?? ?? ?? ?? 51 FF 15 ?? ?? ?? ??'
