defaults:
  platforms: [windows, linux, macos]
  for: [binaries]

traits:
- id: xor-decoded-virtual-protect-api
  desc: XOR-decoded VirtualProtect API name
  if:
    type: encoded
    encoding: xor
    regex: (?i)^VirtualProtect$
  crit: suspicious
  conf: 0.95
  unless:
  - id: well-known/app/security/convertmaccode::convertmaccode-binary
- id: xor-decoded-virtual-protect-ex-api
  desc: XOR-decoded VirtualProtectEx API name
  if:
    type: encoded
    encoding: xor
    regex: (?i)^VirtualProtectEx$
  crit: suspicious
  conf: 0.95
  unless:
  - id: well-known/app/security/convertmaccode::convertmaccode-binary
