defaults:
  platforms:
  - windows
composite_rules:
- id: executable-memory-api-indicator
  desc: Executable-memory API evidence in source or binary
  crit: notable
  conf: 0.95
  for:
  - c
  - cpp
  - pe
  - dll
  any:
  - id: metadata/binary/instruction/sequence::allocation-like-argument-patterns
  - id: micro-behaviors/mem/protect/modify::source-rwx-memory-api-call
  unless:
  - id: metadata/lang/compiler/native::python-msvc-extension
  - id: well-known/lib/runtime
