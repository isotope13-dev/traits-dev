defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86]
traits:
  - id: x86-block-buffer-protect-jump
    desc: Block buffer protected before indirect jump
    crit: suspicious
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule tea_buffer_transfer {
          strings:
            $protect = { FF 75 FC FF 35 ?? ?? ?? ?? FF 35 ?? ?? ?? ?? FF 15 ?? ?? ?? ?? }
            $blocks = { A1 ?? ?? ?? ?? 8B 0D ?? ?? ?? ?? 81 EC ?? ?? ?? ?? 56 C1 E8 03 }
            $jump = { A1 ?? ?? ?? ?? A3 ?? ?? ?? ?? FF E0 }
            $rwx = { C7 45 FC 20 00 00 00 83 45 FC 20 }
          condition:
            for any s in (0..pe.number_of_sections - 1): (
              pe.sections[s].name == ".text" and
              $blocks in (pe.sections[s].raw_data_offset..
                pe.sections[s].raw_data_offset + pe.sections[s].raw_data_size) and
              $protect and $jump and $rwx in (@protect - 32..@protect) and
              uint32(@blocks + 1) == uint32(@protect + 5) and
              uint32(@blocks + 7) == uint32(@protect + 11) and
              uint32(@jump + 1) == uint32(@blocks + 7)
            )
        }
