defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
composite_rules:
  - id: integer-loads-protection-thread-apis
    desc: x64 integer loads with protection and thread APIs
    crit: notable
    conf: 0.9
    for: [pe, dll]
    arch: [x86-64]
    all:
      - id: metadata/binary/instruction/operand::x64-load-r8-r9-04
      - id: metadata/binary/instruction/operand::x64-load-r8-r9-20
      - id: micro-behaviors/mem/protect/modify/api-reference::page-protection-api-x64
      - id: micro-behaviors/process/thread/create::thread-start-api-x64
