composite_rules:
- id: virtual-protect-local-or-remote-reference
  desc: Local or remote VirtualProtect reference
  crit: component
  conf: 0.9
  any:
  - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
  - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-source-call
  - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-ex
  for:
  - c
  - cpp
  - rust
  - go
  - python
  - javascript
  - typescript
  - csharp
  - java
  - pe
  - dll
  - elf
  - macho
  - binaries
  - source
  platforms:
  - linux
  - macos
  - windows
