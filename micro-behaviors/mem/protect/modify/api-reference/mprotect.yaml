defaults:
  crit: notable
  platforms: [linux, macos]
composite_rules:
  - id: mprotect
    desc: Changes native memory-page protection
    conf: 0.9
    for: [elf, macho, c, cpp, rust, go, python, shell]
    any:
      - id: micro-behaviors/mem/protect/modify/unspecified::mprotect-symbol
      - id: micro-behaviors/mem/protect/modify/api-reference::mprotect-import
      - id: micro-behaviors/mem/protect/modify/unspecified::mprotect-syscall
      - id: micro-behaviors/mem/protect/modify/unspecified::aarch64-mprotect-page-alignment-wrapper
      - id: micro-behaviors/mem/protect/modify/unspecified::arm-mprotect-page-alignment-wrapper
      - id: micro-behaviors/mem/protect/modify/unspecified::native-mprotect-source-call
      - id: micro-behaviors/mem/protect/modify/unspecified::rust-libc-mprotect-call
      - id: micro-behaviors/mem/protect/modify/unspecified::go-syscall-mprotect
