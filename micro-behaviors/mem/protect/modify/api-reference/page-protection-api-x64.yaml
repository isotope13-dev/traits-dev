defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
composite_rules:
  - id: page-protection-api-x64
    desc: x64 memory-protection API (imported or resolved)
    crit: notable
    conf: 0.92
    for: [pe, dll]
    arch: [x86-64]
    any:
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/mem/protect/modify/executable::virtualprotect-executable-resolved-x64
      - id: micro-behaviors/mem/protect/modify/executable::virtualprotect-executable-read-register-x64
  # These independent observations do not establish a memory transition,
  # data flow into a thread, or remote process injection.
