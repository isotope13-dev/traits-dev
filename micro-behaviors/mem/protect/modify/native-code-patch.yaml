defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-rwx-copy-restore-sequence
    desc: Sets RWX copies buffer restores saved protection
    crit: suspicious
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '8B D7 4C 8D 4D ?? 48 8B CB 41 B8 40 00 00 00 E8 ?? ?? ?? ?? 85 C0 74 ?? 44 8B CF 48 8B CE 4C 8B C3 33 D2 E8 ?? ?? ?? ?? 8B D7 4C 8D 4D ?? 48 8B CB 44 8B 45 ?? E8 ?? ?? ?? ??'
