defaults:
  crit: notable
  for: [pe, dll]
  platforms: [windows]
  attack: T1055
traits:
  - id: virtual-protect-prefix-no-import
    desc: Hidden VirtualProtect string fragment
    conf: 0.9
    if:
      type: text
      exact: VirtualProte
    unless:
      - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: virtual-alloc-ex-name
    desc: VirtualAllocEx API name reference
    conf: 0.88
    # A PE that resolves this dynamically (djb2 hash lookup) can still carry
    # the plain string as a decoy/fallback reference.
    for: [powershell, batch, javascript, pe, dll]
    if:
      type: text
      substr: VirtualAllocEx
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/binary/symbols/count::many-imports
        - id: metadata/binary/symbols/count::many-exports-100
    unless:
        # The symbol records the API being used; this also sees the name sitting in
        # data. Standing down there keeps one use from counting twice.
        - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
