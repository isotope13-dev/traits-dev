defaults:
  for:
    - pe
  platforms:
    - windows
traits:
  - id: loadlibrarya-virtualprotect-pair
    desc: LoadLibraryA then VirtualProtect strings
    crit: component
    conf: 0.88
    if:
      type: text
      regex: LoadLibraryA.{0,32}VirtualProtect
      section: .rdata
  - id: virtualalloc-virtualprotect-pair
    desc: VirtualAlloc then VirtualProtect strings
    crit: component
    conf: 0.86
    if:
      type: text
      regex: VirtualAlloc.{0,32}VirtualProtect
      section: .rdata
  - id: virtualprotect-virtualalloc-pair
    desc: VirtualProtect then VirtualAlloc strings
    crit: component
    conf: 0.86
    if:
      type: text
      regex: VirtualProtect.{0,32}VirtualAlloc
      section: .rdata
  - id: managed-native-memory-loader-api-cluster--move-memory
    desc: Native memory loader API (RtlMoveMemory)
    crit: component
    conf: 0.96
    if:
      type: text
      word: RtlMoveMemory
composite_rules:
  - id: managed-native-memory-loader-api-cluster
    desc: Managed native memory loader API names
    crit: component
    conf: 0.96
    any:
      # Reuse the established PE atoms; their scoped exceptions avoid known
      # benign runtime and debugger hits without weakening this aggregate.
      - id: micro-behaviors/mem/protect/modify::virtual-alloc-string
      - id: micro-behaviors/mem/protect/modify::virtual-protect-text-pe
      - id: managed-native-memory-loader-api-cluster--move-memory
      - id: micro-behaviors/os/module/load::get-proc-address-reference
  - id: getprocaddr-memory-loader-primitives
    desc: Resolves VirtualAlloc and VirtualProtect
    crit: suspicious
    conf: 0.92
    all:
      - id: micro-behaviors/os/module/load::get-proc-address-import
      - id: metadata/package/metrics::import-count-under-80
    any:
      - id: loadlibrarya-virtualprotect-pair
      - id: virtualalloc-virtualprotect-pair
      - id: virtualprotect-virtualalloc-pair
    unless:
      - id: well-known/tool/reverse-engineering/x64dbg/
    downgrade:
      any:
        - id: well-known/app/system/drivers/
