# Memory Protection - Unix
# mprotect is a neutral memory-protection operation; process-injection
# inferences belong in composites that add cross-process evidence.
defaults:
  crit: notable
  platforms: [linux, macos]
traits:
  - id: mprotect-symbol
    desc: Calls mprotect memory-protection API
    conf: 0.95
    for: [shell, python]
    if:
      type: symbol
      kind: call
      regex: "(^|\\.)mprotect$"
    unless:
      - id: well-known/app/ai/coding-agent/tabby::tabby-basename
      - id: well-known/lib/data/polars::cpu-check-module
      - id: well-known/tool/development/debug/debugpy::source-path-marker
  - id: mprotect-import
    desc: Imports mprotect memory protection
    conf: 0.9
    for: [elf]
    if:
      type: import
      regex: "^_?mprotect$"
  - id: direct-mprotect-syscall-wrapper
    desc: References direct mprotect syscall wrapper
    conf: 0.9
    platforms: [macos]
    for: [macho]
    if:
      type: text
      substr: syscall_mprotect
  # Resolved direct mprotect syscall instruction (no libc wrapper). filefacts
  # resolves constant syscall numbers and arguments. Computed values may stay
  # unresolved. Static runtimes legitimately contain these instructions.
  - id: mprotect-syscall
    desc: Changes memory protection via direct syscall
    conf: 0.6
    platforms: [linux]
    for: [elf]
    if:
      type: syscall
      name: [mprotect]
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiler/systems::go-version-string
  # Require the protection bits on a resolved syscall. The integer 7 in
  # headers, relocations or unrelated data is not a memory-permission request.
  - id: mprotect-rwx-syscall
    desc: mprotect requests executable writable memory
    conf: 0.95
    for: [elf, dylib]
    if:
      type: syscall
      name: [mprotect]
      args:
        - index: 2
          mask: 7

composite_rules:
  # Canonical native memory-protection operation across dynamically linked,
  # direct-syscall, and source-language forms. Objective rules can depend on
  # this behavior without assuming how a future loader reaches mprotect.
  - id: mprotect
    desc: Changes native memory-page protection
    conf: 0.9
    for: [elf, macho, c, cpp, rust, go, python, shell]
    any:
      - id: mprotect-symbol
      - id: mprotect-import
      - id: mprotect-syscall
      - id: micro-behaviors/mem/protect/modify::rust-libc-mprotect-call
      - id: micro-behaviors/mem/protect/modify::go-syscall-mprotect
