defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: allocation-protection-opaque-image
  desc: Allocation and protection APIs in a large or high-entropy image
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/mem/protect/modify::virtual-alloc
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  any:
  - id: metadata/binary/section/ratio::largest-section-at-least-90-percent
  - id: metadata/binary/layout/entropy::high-overall-entropy-70
  unless:
  - id: metadata/binary/section/label::upx-section
  - id: metadata/binary/symbols/exports::no-exports
  - id: metadata/binary/layout/ratio::svk-packed-section
  downgrade:
    any:
    - id: metadata/binary/vendor::microsoft-corp-marker-rsrc
    - id: metadata/signed/platform/
    - id: metadata/binary/installer/script/
