defaults:
  platforms: [windows]
  for: [python]
traits:
  # Local page protection alone does not establish process injection (T1055).
  - id: virtualprotect-ctypes
    desc: VirtualProtect via Python ctypes
    crit: suspicious
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: "ctypes.windll.kernel32.VirtualProtect"
