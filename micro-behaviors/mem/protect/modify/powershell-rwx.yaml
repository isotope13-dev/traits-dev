defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.96

traits:
  - id: powershell-typed-allocation-delegate
    desc: Typed delegate called with null memory address
    conf: 0.96
    if:
      type: text
      regex: '(?i)\$\w+\.Invoke\(\[IntPtr\]::Zero,\s*\[uint32\]'

  - id: powershell-allocation-delegate-rwx-flags
    desc: Delegate allocation call ends with RWX flag
    conf: 0.96
    if:
      type: text
      regex: '(?i)\[uint32\]0x[0-9a-f]+,\s*\[uint32\]0x40\)'

  - id: powershell-virtualalloc-rwx-argument
    desc: VirtualAlloc fourth argument requests RWX
    if:
      type: text
      regex: '(?i)VirtualAlloc(\.Invoke)?\(([^,();]{0,100},\s*){3}0x40\s*\)'

  - id: powershell-virtualprotect-rwx-argument
    desc: VirtualProtect third argument requests RWX
    if:
      type: text
      regex: '(?i)VirtualProtect(\.Invoke)?\(([^,();]{0,100},\s*){2}0x40\s*,'

  - id: powershell-virtualallocex-rwx-argument
    desc: VirtualAllocEx fifth argument requests RWX
    if:
      type: text
      regex: '(?i)VirtualAllocEx(\.Invoke)?\(([^,();]{0,100},\s*){4}0x40\s*\)'

  - id: powershell-virtualprotectex-rwx-argument
    desc: VirtualProtectEx fourth argument requests RWX
    if:
      type: text
      regex: '(?i)VirtualProtectEx(\.Invoke)?\(([^,();]{0,100},\s*){3}0x40\s*,'

composite_rules:
  - id: powershell-delegate-rwx-alloc-arguments
    desc: PowerShell delegate requests RWX memory
    conf: 0.96
    near_bytes: 140
    all:
      - id: powershell-typed-allocation-delegate
      - id: powershell-allocation-delegate-rwx-flags

  - id: powershell-rwx-protection-evidence
    desc: Named RWX protection or memory API argument
    any:
      - id: micro-behaviors/mem/protect/constant::page-execute-readwrite
      - id: micro-behaviors/mem/alloc/executable::powershell-virtualalloc-commit-rwx-call
      - id: powershell-delegate-rwx-alloc-arguments
      - id: powershell-virtualalloc-rwx-argument
      - id: powershell-virtualprotect-rwx-argument
      - id: powershell-virtualallocex-rwx-argument
      - id: powershell-virtualprotectex-rwx-argument
