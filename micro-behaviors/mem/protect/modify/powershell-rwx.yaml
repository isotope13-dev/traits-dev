defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.96

traits:
  - id: powershell-virtualalloc-rwx-argument
    desc: VirtualAlloc fourth argument requests RWX
    if:
      type: text
      regex: '(?i)VirtualAlloc(\.Invoke)?\(([^,();]{0,100},\s*){3}0x40\s*\)'

  - id: powershell-virtualprotect-rwx-argument
    desc: VirtualProtect third argument requests RWX
    if:
      type: text
      regex: '(?i)VirtualProtect(\.Invoke)?\(([^,();]{0,100},\s*){2}0x40\s*,'

  - id: powershell-virtualallocex-rwx-argument
    desc: VirtualAllocEx fifth argument requests RWX
    if:
      type: text
      regex: '(?i)VirtualAllocEx(\.Invoke)?\(([^,();]{0,100},\s*){4}0x40\s*\)'

  - id: powershell-virtualprotectex-rwx-argument
    desc: VirtualProtectEx fourth argument requests RWX
    if:
      type: text
      regex: '(?i)VirtualProtectEx(\.Invoke)?\(([^,();]{0,100},\s*){3}0x40\s*,'

composite_rules:
  - id: powershell-rwx-protection-evidence
    desc: Named RWX protection or memory API argument
    any:
      - id: micro-behaviors/mem/alloc/executable::page-execute-readwrite
      - id: powershell-virtualalloc-rwx-argument
      - id: powershell-virtualprotect-rwx-argument
      - id: powershell-virtualallocex-rwx-argument
      - id: powershell-virtualprotectex-rwx-argument
