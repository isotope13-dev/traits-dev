# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  crit: notable
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: mprotect-executable-syscall
    desc: Requests executable memory protection
    if:
      type: syscall
      name: [mprotect]
      arch: [x86_64, aarch64]
      args:
        - index: 2
          mask: 4
  - id: mprotect-writable-executable-syscall
    desc: Requests writable executable protection
    if:
      type: syscall
      name: [mprotect]
      arch: [x86_64, aarch64]
      args:
        - index: 2
          mask: 6
