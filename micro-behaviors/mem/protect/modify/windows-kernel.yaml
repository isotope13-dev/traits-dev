defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9
  attack: T1055

traits:
  - id: zw-protect-virtual-memory
    desc: Kernel virtual memory protection change
    if:
      type: symbol
      exact: ZwProtectVirtualMemory
  - id: zw-protect-virtual-memory-xoradd-string
    desc: Encoded ZwProtectVirtualMemory string
    conf: 0.94
    if:
      type: text
      substr: 'nBfEWM_XHkWM44#/'
  - id: zw-protect-virtual-memory-atbash-string
    desc: Atbash-obfuscated ZwProtectVirtualMemory string
    conf: 0.98
    if:
      type: text
      substr: 'AdKilgvxgErigfzoNvnlib'
  - id: compiled-gui-module-target
    desc: Compiled win32kfull.sys module target
    conf: 0.95
    if:
      type: hex
      section: llvmmsvc
      pattern: '48 BE 77 69 6E 33 32 6B 66 75'
  - id: compiled-inline-patch-bytes
    desc: Compiled inline patch byte sequence
    conf: 0.93
    if:
      type: hex
      section: llvmmsvc
      pattern: '8B ?? 85 C0'

composite_rules:
  - id: kernel-virtual-memory-protect
    desc: Kernel virtual memory protection change
    crit: notable
    conf: 0.95
    any:
      - id: zw-protect-virtual-memory
      - id: zw-protect-virtual-memory-xoradd-string
      - id: zw-protect-virtual-memory-atbash-string
