defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86-64]
  crit: notable
traits:
  - id: x64-rx-buffer-thread-argument
    desc: x64 RX call then buffer thread argument
    conf: 0.99
    # VirtualProtect(buffer, length, PAGE_EXECUTE_READ, &old), then
    # CreateThread with the buffer in lpParameter. API identities are
    # required by the consuming composite, not inferred from FF 15 alone.
    if:
      type: hex
      section: .text
      pattern: '4C 8D 4C 24 ?? 4C 89 E2 41 B8 20 00 00 00 FF 15 [4] 49 89 D9 31 D2 31 C9 48 C7 44 24 ?? 00 00 00 00 4C 8D 05 [4] C7 44 24 ?? 00 00 00 00 FF 15'
