defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
traits:
  - id: page-execute-constant
    desc: PAGE_EXECUTE protection constant
    crit: component
    conf: 0.8
    for: [pe, dll]
    if:
      type: text
      substr: PAGE_EXECUTE
  - id: getprocaddress-virtualprotect-source
    desc: Resolves VirtualProtect via GetProcAddress
    crit: notable
    conf: 0.93
    mbc: C0021
    for: [c, cpp]
    if:
      type: text
      regex: GetProcAddress[\s\S]{0,160}["']VirtualProtect["']
  - id: page-execute-read-source
    desc: PAGE_EXECUTE_READ constant in source
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      word: PAGE_EXECUTE_READ
  - id: virtual-protect
    desc: Modify memory page protection
    crit: notable
    conf: 0.95
    mbc: C0021
    if:
      type: import
      exact: VirtualProtect
    unless:
      - id: metadata/lang/source::linux-kernel-primary-tree-path
      - id: well-known/game/mod::bedrockboot-preload-cpp-pdb
  - id: virtual-protect-text-pe
    desc: Hidden VirtualProtect string reference
    crit: component
    conf: 0.9
    for: [pe, dll]
    if:
      type: text
      word: VirtualProtect
    unless:
      - id: virtual-protect
  - id: vr-virtual-alloc-string
    desc: VirtualAlloc name in .vr unpacker section
    crit: component
    conf: 0.94
    for: [pe, dll]
    if:
      type: text
      exact: VirtualAlloc
      section: .vr
  - id: vr-virtual-free-string
    desc: VirtualFree name in .vr unpacker section
    crit: component
    conf: 0.94
    for: [pe, dll]
    if:
      type: text
      exact: VirtualFree
      section: .vr
  - id: vr-virtual-protect-string
    desc: VirtualProtect name in .vr unpacker section
    crit: component
    conf: 0.94
    for: [pe, dll]
    if:
      type: text
      exact: VirtualProtect
      section: .vr
  - id: virtual-protect-string
    desc: VirtualProtect API string reference
    crit: component
    conf: 0.9
    for: [javascript]
    if:
      type: text
      word: VirtualProtect
  - id: virtual-protect-ex
    desc: Modify memory protection with VirtualProtectEx
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: VirtualProtectEx
    downgrade:
      any:
        - type: text
          substr: Valve Corp.
  - id: virtual-alloc
    desc: Allocate virtual memory
    crit: baseline
    conf: 0.9
    attack: T1587.001
    if:
      type: import
      exact: VirtualAlloc
    unless:
      - id: well-known/game/mod::bedrockboot-preload-cpp-pdb
  - id: virtual-alloc-string
    desc: VirtualAlloc API string reference
    crit: component
    conf: 0.9
    attack: T1587.001
    for: [pe, javascript]
    if:
      type: text
      word: VirtualAlloc
    unless:
      - id: metadata/lang/compiler/systems::go-pe-symtab
      - id: well-known/tool/sysadmin/logapi::logapi-pipe-marker
      - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
      - id: metadata/binary/layout::svk-packed-section
  - id: virtual-alloc-ex-python-source
    desc: Python VirtualAllocEx remote memory allocation
    crit: notable
    conf: 0.97
    attack: T1055
    mbc: C0032
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)VirtualAllocEx$'
  - id: virtual-free
    desc: Free virtual memory
    crit: baseline
    conf: 0.9
    if:
      type: import
      exact: VirtualFree
  - id: virtual-free-ex
    desc: Release memory allocated in a remote process
    crit: notable
    conf: 0.95
    attack: T1055
    mbc: C0032
    if:
      type: import
      exact: VirtualFreeEx
    unless:
      - id: well-known/game/mod::bedrockboot-preload-injector-pdb
  - id: virtualprotect-rwx-stack-arg-x86
    desc: VirtualProtect RWX stack argument
    crit: notable
    conf: 0.9
    attack: T1620
    arch: [x86]
    for: [pe, dll]
    size_max: 5242880
    if:
      type: hex
      section: .text
      # x86 callers commonly materialize the old-protection out parameter
      # between PAGE_EXECUTE_READWRITE and the imported thunk.
      pattern: 'C7 44 24 08 40 00 00 00 [0-32] FF 15 ?? ?? ?? ??'
  - id: virtualprotect-rwx-direct-call-x86
    desc: RWX protection followed by direct call
    crit: suspicious
    conf: 0.9
    attack: T1620
    arch: [x86]
    for: [pe, dll]
    size_max: 5242880
    if:
      type: hex
      section: .text
      pattern: '8D 05 ?? ?? ?? ?? 89 04 24 C7 44 24 04 ?? ?? ?? ?? C7 44 24 08 40 00 00 00 8D 45 ?? 89 44 24 0C FF 15 ?? ?? ?? ?? 83 EC 10 [0-8] E8 ?? ?? ?? ??'

  - id: rwx-current-process-arg-call-x86
    desc: x86 RWX/current-process stack-call signature
    crit: notable
    conf: 0.84
    arch: [x86]
    for: [pe, dll]
    size_max: 5242880
    if:
      type: hex
      section: .text
      # x86 stack arguments: PAGE_EXECUTE_READWRITE, a size/address pair,
      # current-process pseudo-handle, then an indirect imported call.
      pattern: '6A 40 [0-4] 6A FF FF 15 ?? ?? ?? ??'
  - id: virtualprotect-executable-resolved-x64
    desc: Resolved x64 executable memory protection
    crit: notable
    conf: 0.95
    attack: T1620
    arch: [x86-64]
    for: [pe, dll]
    if:
      type: hex
      section: .text
      # PAGE_EXECUTE_READWRITE (0x40), an old-protection pointer, and an
      # indirect call are characteristic of a runtime-resolved VirtualProtect.
      pattern: '4C 8D 8C 24 ?? ?? ?? ?? 41 B8 40 00 00 00 [0-32] FF 94 24 ?? ?? ?? ??'
  - id: virtualprotect-executable-read-register-x64
    desc: Resolved x64 VirtualProtect executable-read
    crit: notable
    conf: 0.95
    attack: T1620
    arch: [x86-64]
    for: [pe, dll]
    size_max: 5242880
    if:
      type: hex
      section: .text
      # VirtualProtect(address, size, PAGE_EXECUTE_READ, old_protection)
      # followed by a register-indirect call.
      pattern: '4C 8D 4? ?? 41 B8 20 00 00 00 [0-32] 41 FF (D0|D1|D2|D3|D4|D5|D6|D7)'

  # These atoms describe the code-writing primitive itself.  They are kept at
  # the neutral capability tier because instrumentation, profilers, and
  # compatibility shims can all install an in-process trampoline.
  - id: x64-relative-jump-patch-writer
    desc: Writes an x64 relative JMP patch
    crit: notable
    conf: 0.95
    for: [pe, dll]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: 'C6 01 E9 ?? ?? ?? ?? 89 51'
  - id: x64-indirect-jump-patch-writer
    desc: Writes an x64 indirect JMP patch
    crit: notable
    conf: 0.95
    for: [pe, dll]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: '66 C7 01 FF 25 ?? ?? ?? ?? 48 89 51'

composite_rules:
  - id: virtual-memory-api-string-triad
    desc: VirtualAlloc Free and Protect API string triad
    crit: notable
    conf: 0.96
    for: [pe, dll]
    all:
      - id: vr-virtual-alloc-string
      - id: vr-virtual-free-string
      - id: vr-virtual-protect-string
  - id: non-pagespeed-memory-protection
    desc: Memory protection change outside PageSpeed
    crit: notable
    conf: 0.9
    any:
      - id: virtual-protect
      - id: virtual-protect-ex
    unless:
      - id: well-known/app/system/weamp-pagespeed/
  - id: virtual-memory-allocation-protection-api-pair
    desc: Imports virtual-memory allocation and protection APIs
    crit: notable
    conf: 0.9
    for: [pe, dll]
    all:
      - id: virtual-alloc
      - id: virtual-protect
  # Union of the surfaces that actually produce executable memory: the
  # PAGE_EXECUTE_* constant in the clear, or a call site whose protection
  # argument is the executable constant. A bare VirtualAlloc/VirtualProtect
  # import pair is deliberately NOT a member -- every JIT and loader has one.
  - id: executable-memory-staging
    desc: Stages memory with executable page protection
    crit: notable
    conf: 0.9
    for: [pe, dll]
    any:
      - id: micro-behaviors/mem/alloc/executable::page-execute-readwrite
      - id: virtualprotect-rwx-stack-arg-x86
      - id: virtualprotect-rwx-direct-call-x86
      - id: rwx-current-process-arg-call-x86
      - id: virtualprotect-executable-resolved-x64
      - id: virtualprotect-executable-read-register-x64
  # Neutral union of the x64 page-protection surfaces (plain VirtualProtect
  # import or a resolved/register-indirect call to it). A bare import
  # satisfies it — every runtime that JITs or maps code has one — so it
  # stays baseline; objectives/evasion/process/injection/ composites add the
  # RW->RX transition that makes it a loader signal.
  - id: page-protection-api-x64
    desc: x64 memory-protection API (imported or resolved)
    crit: baseline
    conf: 0.92
    for: [pe, dll]
    arch: [x86-64]
    any:
      - id: virtual-protect
      - id: virtualprotect-executable-resolved-x64
      - id: virtualprotect-executable-read-register-x64
  # A neutral x64 RW-to-RX transition paired with a thread-start API. Intent
  # comes from the objective composites that reference this capability.
  - id: rw-to-rx-protection-with-thread-start
    desc: x64 RW-to-RX protection with thread start
    crit: notable
    conf: 0.9
    for: [pe, dll]
    arch: [x86-64]
    all:
      - id: micro-behaviors/mem/alloc/executable::page-readwrite-arg-x64
      - id: micro-behaviors/mem/alloc/executable::page-execute-read-arg-x64
      - id: page-protection-api-x64
      - id: micro-behaviors/process/thread/create::thread-start-api-x64
    unless:
      - id: well-known/lib/runtime/electron/
      - id: well-known/lib/media/ffmpeg/
      - id: well-known/app/development/plutolang/
      - id: metadata/binary/framework::dotnet-metadata
      - id: metadata/lang/compiler/aot::nativeaot-runtime-markers
      - id: metadata/binary/installer/family/
      - id: well-known/lib/crypto/keyring::zowe-secrets-native-keyring-source
    downgrade:
      any:
        - id: metadata/signed/platform/
        - id: metadata/library/automation/
  - id: x64-inline-jump-patch-capability
    desc: x64 binary writes inline jump trampolines
    crit: notable
    conf: 0.95
    for: [pe, dll]
    arch: [x86-64]
    all:
      - id: virtual-protect-ex
      - id: micro-behaviors/mem/sync/cache::flush-instruction-cache
    any:
      - id: x64-relative-jump-patch-writer
      - id: x64-indirect-jump-patch-writer
