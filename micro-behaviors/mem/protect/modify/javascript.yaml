# JavaScript source that calls a memory-protection helper with executable
# permissions. The browser-exploit objective pairs this with a corrupted
# WebAssembly entry point and an embedded byte array.
defaults:
  platforms: [windows, unix, android]
  for: [javascript, typescript, html]

traits:
  - id: js-rwx-memory-protection-stage
    desc: Uses mprotect with RWX flag
    crit: suspicious
    conf: 0.99
    if:
      type: text
      regex: 'mprotect.{0,600}\b7n\b'

  - id: js-virtualprotect-rwx-stage
    desc: Uses VirtualProtect for RWX memory
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '(?i)VirtualProtect.{0,600}PAGE_EXECUTE_READWRITE'
