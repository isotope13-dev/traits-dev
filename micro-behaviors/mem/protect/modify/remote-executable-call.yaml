defaults:
  platforms: [windows]
  for: [c, cpp]
traits:
  - id: remote-executable-protection-call
    desc: Requests read-execute remote-memory protection
    crit: suspicious
    conf: 0.97
    if:
      type: symbol
      kind: call
      exact: VirtualProtectEx
      arg:
        index: 3
        kind: identifier
        name: PAGE_EXECUTE_READ
