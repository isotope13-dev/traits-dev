defaults:
  for: [pe, dll]
  platforms: [windows]
  arch: [x86-64]
  crit: notable
traits:
  - id: x86-rx-buffer-thread-argument
    desc: x86 0x20 and thread-argument call bytes
    conf: 0.99
    arch: [x86]
    # Same sequence as the x64 sibling: VirtualProtect(buffer, length,
    # PAGE_EXECUTE_READ, &old), then CreateThread with the buffer passed as
    # lpParameter. The consuming composite supplies the API identities.
    if:
      type: hex
      section: .text
      pattern: 'C7 44 24 08 20 00 00 00 FF 15 [4] 83 EC 10 89 ?? 24 0C C7 44 24 14 00 00 00 00 C7 44 24 10 00 00
        00 00 C7 44 24 08 [4] C7 44 24 04 00 00 00 00 C7 04 24 00 00 00 00 FF 15'
