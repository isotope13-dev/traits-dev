defaults:
  crit: suspicious
  platforms: [windows, unix, android]
  for: [javascript, typescript, html]
traits:
  - id: js-virtualprotect-rwx-text
    desc: VirtualProtect and RWX flag text
    conf: 0.98
    if:
      type: text
      regex: '(?i)VirtualProtect.{0,600}PAGE_EXECUTE_READWRITE'
    unless:
      # A GitHub blob page can render these two source tokens hundreds of
      # bytes apart without its own JavaScript calling VirtualProtect.
      - id: well-known/tool/development/vcs/github-web::blob-page-rendered-source
      # Doxygen source listings can contain this C/C++ call as escaped page
      # content; the HTML page itself is not requesting executable memory.
      - id: metadata/document/html/generated::generated-doc-doxygen
