defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.96

traits:

  - id: powershell-virtualprotectex-rwx-argument
    desc: VirtualProtectEx fourth argument requests RWX
    if:
      type: text
      regex: '(?i)VirtualProtectEx(\.Invoke)?\(([^,();]{0,100},\s*){3}(\[uint32\])?(0x40|64)\s*,'

