defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.96

traits:
  - id: powershell-virtualprotect-rwx-argument
    desc: VirtualProtect third argument requests RWX
    if:
      type: text
      # `[^,;]` rather than `[^,();]`: an argument may itself be a call,
      # `[UIntPtr]::new($sc.Length)`; commas still bound the argument count.
      regex: '(?i)VirtualProtect(\.Invoke)?\(([^,;]{0,100},\s*){2}0x40\s*,'

  - id: powershell-virtualprotectex-rwx-argument
    desc: VirtualProtectEx fourth argument requests RWX
    if:
      type: text
      regex: '(?i)VirtualProtectEx(\.Invoke)?\(([^,();]{0,100},\s*){3}0x40\s*,'

