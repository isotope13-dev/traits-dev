defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

traits:
  - id: x64-rwx-buffer-direct-call
    desc: Makes buffer RWX and calls its address
    crit: suspicious
    conf: 0.99
    if:
      type: yara
      source: |
        import "pe"
        rule x64_rwx_buffer_direct_call {
          strings:
            // RDI is both VirtualProtect's address and the call target.
            $run = { 41 B8 40 00 00 00 [0-16] 48 8B CF [0-12] FF 15 ?? ?? ?? ?? FF D7 }
          condition:
            pe.is_64bit() and $run and
            for any s in pe.sections : (
              s.characteristics & 0x20000000 != 0 and
              for any i in (1..#run) : (
                @run[i] >= s.raw_data_offset and
                @run[i] + !run[i] <= s.raw_data_offset + s.raw_data_size and
                s.virtual_address + @run[i] + !run[i] - 2 - s.raw_data_offset +
                  int32(@run[i] + !run[i] - 6) ==
                  pe.import_rva("kernel32.dll", "VirtualProtect")
              )
            )
        }
