defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.97

traits:
  - id: powershell-virtualprotect-symbolic-execute
    desc: VirtualProtect requests executable enum flag
    if:
      type: text
      # Third argument, not a declaration or an unrelated executable flag.
      # The enum spelling and the numeric PAGE_EXECUTE variants are supported.
      regex: 'VirtualProtect\s*\(([^,;]{1,99},\s*){2}\[[^]]{1,99}\]\s*::\s*Execute(Read(Write)?)?\s*,'
      case_insensitive: true

  - id: powershell-virtualprotect-numeric-execute
    desc: VirtualProtect requests executable page flag
    if:
      type: text
      regex: '(?i)VirtualProtect\s*\(([^,;\r\n]{1,120},\s*){2}(0x(10|20|40|80)|16|32|64|128)\s*,'

composite_rules:
  - id: powershell-virtualprotect-execute-argument
    desc: VirtualProtect requests executable memory
    any:
      - id: powershell-virtualprotect-symbolic-execute
      - id: powershell-virtualprotect-numeric-execute
