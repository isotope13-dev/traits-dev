defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
traits:
  - id: virtualprotect-rwx-direct-call-x86
    desc: Indirect call with 0x40 argument
    crit: suspicious
    conf: 0.9
    arch: [x86]
    for: [pe, dll]
    size_max: 5242880
    if:
      type: hex
      section: .text
      pattern: '8D 05 ?? ?? ?? ?? 89 04 24 C7 44 24 04 ?? ?? ?? ?? C7 44 24 08 40 00 00 00 8D 45 ?? 89 44 24 0C
        FF 15 ?? ?? ?? ?? 83 EC 10 [0-8] E8 ?? ?? ?? ??'
