defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
composite_rules:
  - id: virtualprotect-rwx-stack-arg-x86
    desc: VirtualProtect import and 0x40 call argument
    crit: notable
    conf: 0.9
    arch: [x86]
    for: [pe, dll]
    size_max: 5242880
    all:
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: metadata/binary/instruction/operand::x86-call-third-arg-0x40
