defaults:
  platforms: [windows]
  for: [c, cpp]
traits:
  - id: remote-executable-protection-call
    desc: Process-handle executable protection call
    crit: suspicious
    conf: 0.97
    unless:
      - id: well-known/lib/platform/wine::wine-compatibility-test-source
      - id: own-process-ex-memory-call
    if:
      type: symbol
      kind: call
      exact: VirtualProtectEx
      arg:
        index: 3
        kind: identifier
        name: PAGE_EXECUTE_READ

  # The *Ex memory APIs on the caller's own pseudo-handle are local code
  # patching, not cross-process injection: Mozilla's WindowsDllInterceptor
  # (vendored by SumatraPDF) re-protects its trampolines this way, and the
  # ant engine's debugger thunks allocate and fill RWX pages for itself.
  - id: own-process-ex-memory-call
    desc: Ex memory API on the current process
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(VirtualAllocEx|WriteProcessMemory|VirtualProtectEx)\s*\(\s*GetCurrentProcess\s*\(\s*\)'
