defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
composite_rules:
  - id: executable-page-protection-evidence
    desc: Executable-page constant or protection argument
    crit: notable
    conf: 0.9
    for: [pe, dll]
    any:
      - id: micro-behaviors/mem/protect/constant::page-execute-readwrite
      - id: micro-behaviors/mem/protect/modify/executable::virtualprotect-rwx-stack-arg-x86
      - id: micro-behaviors/mem/protect/modify/executable::virtualprotect-rwx-direct-call-x86
      - id: micro-behaviors/mem/protect/modify/executable::virtualprotect-executable-resolved-x64
      - id: micro-behaviors/mem/protect/modify/executable::virtualprotect-executable-read-register-x64
  # Neutral union of the x64 page-protection surfaces (plain VirtualProtect
  # import or a resolved/register-indirect call to it). A bare import
  # satisfies it; callers must supply their own attack-specific evidence.
