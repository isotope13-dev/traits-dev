# CUDA allocation structures. The Rowhammer objective interprets their
# combination as GPU page-table massaging.
defaults:
  crit: notable
  platforms: [linux, windows]
  for: [c, cpp, python]

traits:
  - id: cuda-vram-availability-query
    desc: Queries available CUDA VRAM
    conf: 0.96
    if:
      type: text
      regex: '\b(cudaMemGetInfo|cuMemGetInfo(_v2)?)\s*\('
