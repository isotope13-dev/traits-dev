defaults:
  for: [pe, dll]
  platforms: [windows]

traits:
- id: is-bad-read-ptr
  desc: IsBadReadPtr memory accessibility check
  crit: notable
  conf: 0.82
  if:
    type: symbol
    exact: IsBadReadPtr
- id: is-bad-write-ptr
  desc: IsBadWritePtr memory accessibility check
  crit: notable
  conf: 0.82
  if:
    type: symbol
    exact: IsBadWritePtr
