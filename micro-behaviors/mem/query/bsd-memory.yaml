defaults:
  platforms: [unix]
  for: [c, cpp, rust, python]
  crit: notable
  conf: 0.95

traits:
  - id: bsd-kernel-malloc-stats-ref
    desc: References BSD kernel allocator statistics
    if:
      type: text
      word: KERN_MALLOCSTATS

  - id: sysv-shm-positive-count-abort
    desc: Rejects positive SHM attachment counts
    for: [c, cpp, rust]
    # This can be an ordinary live-attachment check. Only the objective
    # composite adds the stale-mapping and fork-amplification evidence.
    if:
      type: tree-sitter
      kind: conditional
      regex: 'shm_nattch\s*>\s*0\s*\)?\s*\{?\s*(errx|abort|exit|panic!)\s*\('
