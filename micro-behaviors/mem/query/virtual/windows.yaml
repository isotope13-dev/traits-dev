defaults:
  for:
    - pe
    - dll
  platforms:
    - windows

traits:
  - id: nt-query-virtual-memory
    desc: NtQueryVirtualMemory mapping query
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: NtQueryVirtualMemory

  - id: nt-query-virtual-memory-source
    desc: Source references NtQueryVirtualMemory
    crit: notable
    conf: 0.94
    for: [c, cpp, csharp, rust, go, python]
    if:
      type: text
      word: NtQueryVirtualMemory

  - id: zw-query-virtual-memory
    desc: ZwQueryVirtualMemory import
    crit: notable
    conf: 0.7
    if:
      type: symbol
      exact: ZwQueryVirtualMemory
  - id: zw-query-virtual-memory-xoradd-string
    desc: Encoded ZwQueryVirtualMemory string
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: 'nBgB]KCmUOJJ!-'
