defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, csharp, go, rust, powershell]
  crit: notable
  conf: 0.9

traits:
- id: nt-map-view-section-api-string
  desc: Names an NT section mapping API
  if:
    type: text
    regex: '\b(Nt|Zw)MapViewOfSection(Ex)?\b'
  unless:
    - id: metadata/build/generated::winmd-metadata
