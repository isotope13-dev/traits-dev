defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: mm-map-io-space
    desc: Map physical I/O space in kernel
    for: [pe, dll, c, cpp, rust, go, csharp]
    if:
      type: symbol
      regex: '^MmMapIoSpace(Ex)?$'

  - id: mm-map-io-space-xoradd-string
    desc: Encoded MmMapIoSpaceEx string
    conf: 0.9
    if:
      type: text
      substr: 'yX{VHpUhL\]Z'

  - id: mm-map-io-space-atbash-string
    desc: Atbash-obfuscated MmMapIoSpace string
    conf: 0.98
    if:
      type: text
      substr: 'NnNzkRlHkzxv'
