defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-sec-image-readonly-call-setup
    desc: x64 SEC_IMAGE read-only mapping call setup
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .text
      # R8D = PAGE_READONLY | SEC_IMAGE; zero size/name, RCX = file handle.
      pattern: '41 B8 02 00 00 01 48 89 54 24 ?? 31 D2 89 4C 24 ?? 48 89 C1 FF 15 ?? ?? ?? ??'
