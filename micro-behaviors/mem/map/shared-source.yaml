defaults:
  platforms: [unix]
  for: [elf, macho, so, dylib, c, cpp, rust]
  crit: notable
  conf: 0.94

traits:
  - id: mmap-shared-write-source
    desc: Maps a shared region writable with mmap
    if:
      type: text
      regex: 'mmap\s*\([^;]{0,320}PROT_WRITE[^;]{0,240}MAP_SHARED'

  - id: mmap-shared-read-source
    desc: Maps a shared region with read permission
    for: [c, cpp, rust, go, python, elf]
    if:
      type: text
      regex: 'mmap\s*\([^;]{0,320}(PROT_READ[^;]{0,240}MAP_SHARED|MAP_SHARED[^;]{0,240}PROT_READ)'

