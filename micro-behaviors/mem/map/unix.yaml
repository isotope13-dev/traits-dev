defaults:
  crit: baseline
  platforms: [linux, macos]
  for: [elf, macho, c, cpp]
traits:
  - id: mmap-fn
    desc: Maps files or devices with mmap
    conf: 0.86
    for: [c, cpp]
    if:
      type: symbol
      exact: mmap
  - id: mmap64-fn
    desc: Maps files or devices into memory
    conf: 0.66
    if:
      type: symbol
      exact: mmap64
composite_rules:
  - id: mmap
    desc: Maps files or devices into memory
    conf: 0.66
    any:
      - id: mmap-fn
      - id: "micro-behaviors/mem/map::mmap-symbol"
      - id: mmap64-fn
