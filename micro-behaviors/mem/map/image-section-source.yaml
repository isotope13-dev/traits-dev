defaults:
  platforms: [windows]
  crit: notable
  conf: 0.96
traits:
  - id: sec-image-creation-native-source
    desc: Creates a SEC_IMAGE file mapping
    for: [c, cpp]
    # Symbol facts retain the call but not identifiers inside its flag expression.
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @fn
          arguments: (argument_list . (_) . (_) .
            [(identifier) @flag
             (binary_expression (identifier) @flag)])) @evidence
          (#match? @fn "^CreateFileMapping[AW]$")
          (#eq? @flag "SEC_IMAGE"))
  - id: sec-image-creation-python
    desc: Creates a SEC_IMAGE file mapping
    for: [python]
    if:
      type: tree-sitter
      query: |
        ((call
          function: (attribute attribute: (identifier) @fn)
          arguments: (argument_list . (_) . (_) .
            [(identifier) @flag
             (binary_operator (identifier) @flag)])) @evidence
          (#match? @fn "^CreateFileMapping[AW]$")
          (#eq? @flag "SEC_IMAGE"))
  - id: sec-image-creation-numeric-source
    desc: Creates an image mapping with numeric flags
    for: [c, cpp, python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)CreateFileMapping[AW]$'
      arg:
        index: 2
        kind: number
        value: 16777218
composite_rules:
  - id: sec-image-creation-source
    desc: Creates a Windows image-section mapping
    for: [c, cpp, python]
    any:
      - id: sec-image-creation-native-source
      - id: sec-image-creation-python
      - id: sec-image-creation-numeric-source
