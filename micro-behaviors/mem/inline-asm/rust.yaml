# Inline Assembly - Rust
# MBC: B0006 (Inline Assembly)
defaults:
  crit: notable
  conf: 1.0
  platforms: [windows, unix]
  for: [rust]
traits:
  - id: rust-asm-macro
    desc: Rust asm! inline assembly macro
    # The `asm!( … )` macro invocation. `\b` before `asm` keeps it from matching
    # inside `global_asm!` (handled by `rust-global-asm-macro` below).
    if:
      type: text
      regex: '\basm!\s*[(\[{]'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: rust-global-asm-macro
    desc: Rust global_asm! module-level assembly
    if:
      type: text
      substr: "global_asm!"
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
