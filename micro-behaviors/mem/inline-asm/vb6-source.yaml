# VB6/VBA assembling machine code at runtime: a hex string decoded into a
# byte array, then reached through a raw pointer. VB has no inline asm, so
# these primitives exist only to run bytes the language cannot express.
defaults:
  platforms: [windows]
  for: [vbs]
  crit: suspicious
traits:
  - id: vb-hex-string-to-byte-buffer
    desc: VB builds byte buffer from hex string
    conf: 0.88
    if:
      type: text
      regex: '(?i)CByte\s*\(\s*"&h"\s*&\s*Mid'
  - id: vb-self-vtable-pointer
    desc: VB takes its own object vtable pointer
    conf: 0.9
    if:
      type: text
      regex: '(?i)ObjPtr\s*\(\s*Me\s*\)'
  - id: vb-pointer-target-overwrite
    desc: VB copies pointer into raw address
    conf: 0.88
    if:
      type: text
      regex: '(?i)Copy(Memory|Bytes).{0,14}ByVal \w+, ?VarPtr\('
