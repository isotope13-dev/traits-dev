# x86 assembly mnemonics written out as text (assembly source, inline asm,
# syntax-highlighter keyword lists). A mnemonic alone names an instruction,
# not a technique.
traits:

  - id: x86-lodsw-mnemonic
    conf: 0.85
    crit: component
    desc: x86 lodsw mnemonic in text
    for: [binaries, scripts, c]
    platforms: [unix, windows]
    if:
      type: text
      word: lodsw
