defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: rwx-commit-protection-and-mutex-api-set
    desc: Push-call bytes with protection and mutex APIs
    crit: notable
    conf: 0.95
    all:
      - id: metadata/binary/instruction/call::push-40-1000-indirect-call-raw
      - id: micro-behaviors/mem/protect/modify::allocation-protection-opaque-image
      - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
      - id: micro-behaviors/process/sync/mutex::create-mutex
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
