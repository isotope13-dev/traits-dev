defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: rwx-commit-protection-and-mutex-api-set
    desc: RWX allocation stub with protection and mutex API references
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/mem/alloc/executable::virtualalloc-rwx-commit-x86-raw
      - id: micro-behaviors/mem/protect/modify::allocation-protection-opaque-image
      - id: micro-behaviors/dylib/lookup::sparse-pe-dynamic-linking
      - id: micro-behaviors/process/sync/mutex::create-mutex
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
