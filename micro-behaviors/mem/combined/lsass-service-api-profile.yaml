defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
  - id: lsass-service-memory-api-profile
    desc: Service APIs alongside LSASS and memory access
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/os/service/dispatch::service-dispatch-triad
      - id: micro-behaviors/process/info/name::lsass-process-reference
    any:
      - id: micro-behaviors/mem/read/cross-process::read-process-memory
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-binary
