defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [scripts, binaries]
composite_rules:
  - id: jit-executable-memory-api-profile
    desc: JIT reference with executable memory APIs
    conf: 0.9
    all:
      - id: metadata/lang/runtime::jit-compilation-runtime-reference
    any:
      - id: "micro-behaviors/mem/map::mmap-exec"
      - id: micro-behaviors/mem/protect/modify::executable-page-protection-evidence
