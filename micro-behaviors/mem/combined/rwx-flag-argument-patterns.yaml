defaults:
  platforms: [windows]

composite_rules:
  - id: rwx-flag-or-argument-patterns
    desc: RWX flag or allocation-like byte pattern
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp]
    any:
      - id: micro-behaviors/mem/protect/constant::page-execute-readwrite
      - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
