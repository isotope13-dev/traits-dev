defaults:
  platforms: [windows]

composite_rules:
  - id: rwx-flag-or-argument-patterns
    desc: RWX flag or allocation-like byte pattern
    crit: notable
    conf: 0.9
    for: [pe, dll, c, cpp]
    any:
      - id: micro-behaviors/mem/protect/constant::page-execute-readwrite
      - id: metadata/binary/instruction/sequence::allocation-like-argument-patterns
    unless:
      - id: micro-behaviors/process/sync/mutex::cpython-gil-ensure
      - id: metadata/signed/leaf::microsoft-corporation
      - id: well-known/tool/development/debug/debugpy/
      - id: well-known/lib/development/sanitizer-runtime::sanitizer-runtime-source-path
    downgrade:
      any:
        - id: metadata/binary/framework/
        - id: well-known/dual-use/tunnel/netch/
