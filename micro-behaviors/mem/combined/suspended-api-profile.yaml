  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-text
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-binary
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-script
  for:
  - go
  - rust
  - c
  - cpp
  - csharp
  - pe
  - dll
  - powershell
