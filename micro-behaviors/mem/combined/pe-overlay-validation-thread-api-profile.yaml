# Whole-binary API/overlay co-occurrence does not bind the bytes read to
# executable memory or prove that a debugger result gates a payload.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: pe-overlay-validation-thread-api-profile
    desc: PE overlay, validation and thread API profile
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/fs/read/file/handle::pe-module-path-file-io-overlay
      - id: micro-behaviors/data/format/pe-parser::inline-pe-signature-check
      - id: micro-behaviors/mem/combined::virtual-memory-allocation-protection-api-pair
      - id: micro-behaviors/process/thread/create::create-thread
    unless:
      - id: well-known/app/productivity/winmerge::winmerge-signed-main-binary
      - id: well-known/app/utility/hxd::hxd-editor-context
      - id: well-known/lib/runtime/scripted/node-runtime::bundled-node-v8-runtime
      - id: well-known/lib/platform/advanced-installer::advanced-installer-bootstrapper
