defaults:
  platforms: [windows]
composite_rules:
- id: suspended-write-resume-api-profile
  desc: Suspended flag, memory and resume API references
  crit: notable
  conf: 0.95
  for:
  - go
  - rust
  - c
  - cpp
  - csharp
  - pe
  - dll
  - powershell
  all:
  - id: micro-behaviors/process/config::create-suspended-flag-reference
  - id: micro-behaviors/mem/combined::remote-allocation-or-write-api-references
  - id: micro-behaviors/process/thread/lifecycle::thread-resume-api-references
  downgrade:
    any:
    - id: well-known/tool/reverse-engineering/cuckoo::cuckoo-instrumentation-source
