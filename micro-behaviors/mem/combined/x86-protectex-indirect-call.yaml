defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: x86-protectex-indirect-call-profile
    desc: VirtualProtectEx with indirect-call code nearby
    crit: notable
    conf: 0.98
    near_bytes: 512
    all:
      - id: metadata/binary/instruction/operand::x86-40-minus-one-indirect-call
      - id: micro-behaviors/mem/protect/modify::virtual-protect-ex
      - id: metadata/binary/instruction/sequence::x86-global-pointer-indirect-call
    unless:
      - id: metadata/signed/platform/
      - id: well-known/tool/reverse-engineering/
