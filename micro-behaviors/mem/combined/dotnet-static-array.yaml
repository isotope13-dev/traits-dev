defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: dotnet-large-array-native-memory-api-profile
    desc: Unsigned CLR array with memory and thread APIs
    crit: notable
    conf: 0.98
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/code/entropy::high-code-entropy
      - id: metadata/binary/symbols/compiler::dotnet-large-static-array-marker
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-symbol-or-name
      - id: micro-behaviors/process/thread/create::create-thread-symbol-or-name
    any:
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/mem/protect/modify::virtual-protect-text-pe
