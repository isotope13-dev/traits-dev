defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
traits:
  - id: source-execute-memory-request
    desc: Memory API and executable flag text
    crit: notable
    conf: 0.92
    for: [c, cpp, csharp, rust, go, source]
    if:
      type: text
      regex: '(?i)\bVirtual(Alloc|Protect)\w{0,2}\s*\([^;\n]{0,140}(0x40|PAGE_EXECUTE_READ)'
