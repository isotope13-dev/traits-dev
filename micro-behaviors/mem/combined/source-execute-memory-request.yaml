defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
traits:
  - id: source-execute-memory-request
    desc: Memory API and executable flag text
    crit: notable
    conf: 0.92
    for: [c, cpp, csharp, rust, go, source]
    # Go loaders call the lazily loaded procedure as `VirtualAlloc.Call(`.
    if:
      type: text
      case_insensitive: true
      regex: '\bVirtual(Alloc|Protect)\w{0,2}(\.Call)?\s*\([^;\n]{0,140}(0x40|PAGE_EXECUTE_READ)'
