defaults:
  platforms: [windows]
  for: [c, cpp, csharp, go, rust]
composite_rules:
  - id: native-memory-thread-api-cluster-source
    desc: Nearby NT memory and thread API names
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/os/syscall/invoke::nt-native-memory-api-source
    any:
      - id: micro-behaviors/process/info/thread::nt-get-context-name-source
      - id: micro-behaviors/process/thread/config::nt-set-context-name-source
      - id: micro-behaviors/process/thread/lifecycle::nt-resume-name-source
    near_lines: 80
    unless:
      - id: well-known/lib/platform/wine/
      - id: well-known/tool/reverse-engineering/radare2::radare2-source-identity
      - id: metadata/file/naming::rizin-source-tree-path
      - id: well-known/tool/offensive/cobalt-strike::cobalt-strike-beacon-sdk-header
