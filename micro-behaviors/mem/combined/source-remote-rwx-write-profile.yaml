defaults:
  platforms: [windows]
  for: [c, cpp]

traits:
  # One path-only trait carries both suppression paths: a documentation
  # extension and the vendored pydevd attach-to-process injector directory.
  # The unless list admits at most one path-only trait. The injector source
  # has no debugpy or pydevd text, so its directory is the only evidence.
  - id: documentation-or-injector-path
    desc: Path is documentation or pydevd injector
    crit: component
    if:
      type: path
      regex: '(?i)(\.(md|markdown|rst|txt|adoc)$|pydevd_attach_to_process)'

composite_rules:
  - id: source-remote-rwx-write-profile
    desc: Source combines remote RWX allocation and write
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
    any:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-rwx-source
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-rwx-numeric-source
    unless:
      # The RWX codecave is one facet of a fuller suspended-staging assessment
      # on the same file: the same allocation and write sites satisfy both
      # profiles, so report the staging verdict once instead of counting the
      # same evidence cluster twice. The RWX atoms below still record the
      # primitive, and this profile still fires on its own where the
      # suspended-staging profile does not match.
      - id: micro-behaviors/mem/combined::suspended-remote-executable-staging
      # Every call targets GetCurrentProcess(): self-patching, not remote.
      - id: micro-behaviors/mem/protect/modify/executable::own-process-ex-memory-call
      # The documented Windows JVM attach mechanism injects its stub this way.
      - id: well-known/lib/runtime/managed/openjdk::jdk-attach-native-source
      # Wine's own test suite drives VirtualAllocEx/WriteProcessMemory against a
      # debuggee or self-test child (for example dlls/kernel32/tests/debugger.c).
      - id: well-known/lib/platform/wine::wine-compatibility-test-source
      # debugpy's vendored pydevd attach-to-process injector is the documented
      # remote-attach feature of that debugger package, not a payload loader.
      # The composite pairs the source tree with the attach entry point; the
      # path trait below covers injector files that carry no pydevd text.
      - id: well-known/tool/development/debug/debugpy::pydevd-attach-source-tree
      # Cleave types a Markdown tutorial with a C fence as C (extension mismatch).
      # Fenced injection examples in documentation are not compiled source.
      - id: documentation-or-injector-path
