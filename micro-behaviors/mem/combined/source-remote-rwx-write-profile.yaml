defaults:
  platforms: [windows]
  for: [c, cpp]

composite_rules:
  - id: source-remote-rwx-write-profile
    desc: Source combines remote RWX allocation and write
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
    any:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-rwx-source
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-rwx-numeric-source
    unless:
      # The RWX codecave is one facet of a fuller suspended-staging assessment
      # on the same file: the same allocation and write sites satisfy both
      # profiles, so report the staging verdict once instead of counting the
      # same evidence cluster twice. The RWX atoms below still record the
      # primitive, and this profile still fires on its own where the
      # suspended-staging profile does not match.
      - id: micro-behaviors/mem/combined::suspended-remote-executable-staging
