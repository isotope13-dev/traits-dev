defaults:
  platforms: [windows]
  for: [c, cpp]

composite_rules:
  - id: source-remote-rwx-write-profile
    desc: Source combines remote RWX allocation and write
    crit: suspicious
    conf: 0.93
    all:
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
    any:
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-rwx-source
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-rwx-numeric-source
    unless:
      - id: well-known/lib/platform/wine::wine-source-tree
      - id: well-known/tool/reverse-engineering/radare2::radare2-release-source-tree
      - id: well-known/tool/sysadmin/chroot-win/
      - id: well-known/game/mod::dalamud-source-tree
      - id: well-known/game/mod::thcrap-source-tree
      - id: well-known/lib/platform/sack/
