defaults:
  for: [pe, dll]
  platforms: [windows]
composite_rules:
- id: native-unmap-write-resume-api-profile
  desc: Native unmap, memory-write and thread-resume API references
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/mem/unmap::native-section-unmap-api-references
  - id: micro-behaviors/mem/write/arbitrary::remote-memory-write-api-references
  - id: micro-behaviors/process/inject/runtime/ntapi::nt-resume-thread
  unless:
  - id: metadata/signed/platform/
  - id: metadata/lang/upstream::windows-system-implementer-dll
  - id: well-known/lib/platform/wine/
  - id: well-known/tool/reverse-engineering/
  - id: well-known/lib/runtime/scripted/node-runtime::windows-runtime-identity
