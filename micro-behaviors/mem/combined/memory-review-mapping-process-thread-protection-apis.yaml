defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: mapping-process-thread-protection-apis
    crit: suspicious
    desc: File mapping, process, thread and memory API clues
    conf: 0.97
    all:
      - id: micro-behaviors/communications/ipc/file-mapping::mapping-event-api-set
      - id: metadata/binary/instruction/sequence/unspecified::allocation-like-argument-patterns
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/process/attach/rights::open-process
      - id: micro-behaviors/process/info/thread::open-thread
    unless:
      - id: well-known/app/development/hp-digital-imaging::hp-signed-scanner-component
      - id: well-known/app/development/hp-digital-imaging::hp-scanapi-component
      - id: well-known/tool/sysadmin/sandboxie::sandboxie-known-signed-context
