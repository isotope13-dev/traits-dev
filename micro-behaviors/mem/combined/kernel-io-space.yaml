defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

composite_rules:
  - id: kernel-io-space-map-or-unmap
    desc: Kernel I/O-space map or unmap references
    crit: notable
    conf: 0.98
    for: [pe, dll, c, cpp, rust, go, csharp]
    any:
      - id: micro-behaviors/mem/map::mm-map-io-space
      - id: micro-behaviors/mem/map::mm-map-io-space-atbash-string
      - id: micro-behaviors/mem/unmap::mm-unmap-io-space-atbash-string
