# Preserve the complete former observation without asserting a memory read.
# A real reviewed assembly opens LSASS but never invokes ReadProcessMemory;
# its allocation/write APIs belong to an unrelated injection routine.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: managed-lsass-lookup-with-remote-memory-apis
    desc: Managed LSASS lookup and remote-memory API references
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/binary/framework::dotnet-assembly
      - id: micro-behaviors/process/info/name::lsass-target-token
      - id: micro-behaviors/process/enumerate/managed::get-processes-by-name
      - id: micro-behaviors/os/privilege/token::sedebug-privilege-name
      - id: micro-behaviors/mem/combined::remote-process-memory-api-cluster
    unless:
      - id: metadata/signed/platform/
