defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
- id: pe-allocation-protection-resolution-api-set
  desc: PE memory, loader and validation API set
  crit: notable
  conf: 0.93
  all:
    - id: micro-behaviors/os/sysinfo/hardware::get-native-system-info
    - id: micro-behaviors/mem/query::is-bad-read-ptr
    - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
    - id: micro-behaviors/mem/protect/modify::virtual-protect
    - id: micro-behaviors/dylib/lookup::get-proc-address-import
  any:
    - id: micro-behaviors/dylib/load/runtime::load-library-a
    - id: micro-behaviors/dylib/load/unload::free-library
  unless:
    - id: metadata/signed/platform/
    - id: well-known/tool/reverse-engineering/
    - id: metadata/binary/installer/family/
    - id: metadata/binary/section/label::upx0-section-name
    - id: metadata/binary/section/label::cape-sandbox-dump-section
    - id: well-known/app/utility/modmanager::modmanager-product-name
