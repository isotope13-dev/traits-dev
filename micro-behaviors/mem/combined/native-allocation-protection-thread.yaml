defaults:
  platforms: [windows, unix]
  for: [rust, go, python, javascript, typescript, shell, c, cpp]
traits:
- id: native-allocation-protection-thread-calls
  desc: Calls allocation, protection and thread APIs
  crit: notable
  conf: 0.9
  if:
    type: text
    exclude_comments: true
    regex: '(?s)\bVirtualAlloc\s*\(.{0,240}\bVirtualProtect\s*\(.{0,240}\bCreateThread\s*\('
