    # facts. One alternative alone does not identify a particular operation;
    # concrete API constituents keep their own notable severity.
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/mem/protect/modify/
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-java-ref
