defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: suspicious
  conf: 0.9
composite_rules:
  - id: dotnet-unmap-process-target-clues
    desc: Unmap, process and target-placeholder clues
    crit: suspicious
    conf: 0.97
    any:
      - id: metadata/file/profile/binary-strings::dotnet-itself-placeholder
      - id: metadata/file/profile/binary-strings::dotnet-regasm-placeholder
    all:
      - id: micro-behaviors/mem/unmap::nt-unmap-view-of-section-name
      - id: micro-behaviors/process/create/exec::create-process-api-name
  - id: dotnet-unmap-message-placeholder-clues
    desc: Unmap and message-placeholder clues
    crit: suspicious
    conf: 0.95
    any:
      - id: metadata/file/profile/binary-strings::dotnet-message-text-placeholder
      - id: metadata/file/profile/binary-strings::dotnet-message-title-placeholder
    all:
      - id: micro-behaviors/mem/unmap::nt-unmap-view-of-section-name
