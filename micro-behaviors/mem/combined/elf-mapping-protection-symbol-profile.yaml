defaults:
  platforms: [linux, macos, windows]
  for: [elf, pe, shell, python, javascript]
composite_rules:
  - id: elf-mapping-protection-symbol-profile
    desc: ELF mapping, protection and lookup APIs
    crit: notable
    conf: 0.85
    platforms: [linux, macos]
    for: [elf]
    all:
      - id: micro-behaviors/mem/protect/modify/api-reference::mprotect-import
