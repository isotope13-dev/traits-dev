defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
  - id: x86-pe-validation-allocation-export-api-set
    desc: x86 PE validation with allocation and export lookup APIs
    crit: notable
    conf: 0.97
    arch: [x86]
    all:
      - id: micro-behaviors/data/embedded/payload/header::x86-inline-pe-header-validation-sequence
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/dylib/lookup::get-proc-address-import
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/app/
      - id: well-known/lib/
      - id: well-known/tool/reverse-engineering/
