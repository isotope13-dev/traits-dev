defaults:
  platforms: [windows]
composite_rules:
  - id: source-rwx-memory-copy-api-profile
    desc: Source RWX and memory-copy API co-occurrence
    crit: notable
    conf: 0.85
    for: [c, cpp]
    near_lines: 20
    all:
      - id: micro-behaviors/mem/combined::allocation-pattern-or-rwx-api-reference
    any:
      - id: "micro-behaviors/mem/copy::memcpy"
      - id: micro-behaviors/mem/copy::source-memcpy-shellcode-or-rwx-context
