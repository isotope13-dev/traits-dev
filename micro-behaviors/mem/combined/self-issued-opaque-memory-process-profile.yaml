defaults:
  platforms:
    - windows
composite_rules:
  - id: self-issued-opaque-memory-process-profile
    desc: Self-issued opaque memory and process API profile
    crit: suspicious
    conf: 0.93
    all:
      - id: metadata/signature/certificate/chain::pe-cert-leaf-self-issued
      - id: micro-behaviors/mem/combined::allocation-protection-opaque-image
      - id: metadata/binary/section/entropy::high-entropy-rdata-section
    any:
      - id: micro-behaviors/os/handler/open::win-shellexecute
      - id: micro-behaviors/process/terminate/kill::terminate-process
      - id: micro-behaviors/fs/delete/file/library::deletefile-a
      - id: micro-behaviors/os/privilege/token/use::get-token-information
    needs: 2
    unless:
      - id: metadata/installer/product/
    for: [pe, dll]
