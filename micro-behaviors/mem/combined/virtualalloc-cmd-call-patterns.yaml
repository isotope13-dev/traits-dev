# These APIs and a command-interpreter name may coexist in JITs, installers,
# launchers or ransomware. No receive-to-command or cross-process flow is bound.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: virtualalloc-cmd-call-patterns
    desc: VirtualAlloc, cmd name and call bytes
    crit: notable
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: metadata/binary/instruction/sequence::allocation-like-argument-patterns
      - id: micro-behaviors/fs/path/application/interpreter::cmd-exe-image-name
