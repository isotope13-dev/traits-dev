# No cipher direction, algorithm or source-to-execution link is required.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
composite_rules:
- id: cbc-pe-header-protection-api-profile
  desc: CBC, PE checks and protection APIs co-occur
  crit: notable
  conf: 0.95
  all:
  - id: micro-behaviors/crypto/cipher::bcrypt-cbc-mode-references
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  - id: micro-behaviors/data/embedded/payload/header::inline-pe-header-validation-sequence
  any:
  - id: micro-behaviors/mem/alloc/heap::heap-alloc
  - id: micro-behaviors/dylib/lookup::get-proc-address-import
  needs: 2
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/installer/family/
  - id: well-known/tool/offensive/mimikatz/
