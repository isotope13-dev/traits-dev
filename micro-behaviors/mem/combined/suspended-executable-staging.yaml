# Remote executable-page staging and a suspended/resumed child are a
# security-sensitive capability even when a complete injection chain is absent.
# This profile does not assert that an APC is queued or that a payload executes.
defaults:
  platforms: [windows]
  for: [c, cpp]
composite_rules:
  - id: suspended-remote-executable-staging
    desc: Suspended child and remote executable memory
    crit: suspicious
    conf: 0.95
    all:
      - id: suspended-write-resume-api-profile
      - id: metadata/file/profile/memory-protection-context::source-execute-memory-request
      - id: metadata/file/profile/memory-protection-api::virtual-protect-ex
      - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex
