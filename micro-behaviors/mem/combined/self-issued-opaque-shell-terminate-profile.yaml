defaults:
  platforms:
    - windows
composite_rules:
  - id: self-issued-opaque-shell-terminate-profile
    desc: Self-issued opaque image with shell and termination APIs
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/mem/combined::self-issued-opaque-memory-process-profile
      - id: micro-behaviors/os/handler/open::win-shellexecute
      - id: micro-behaviors/process/terminate/kill::terminate-process
    for: [pe, dll]
