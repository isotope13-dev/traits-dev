defaults:
  for: [pe, dll, c, cpp]
  platforms: [windows]
composite_rules:
- id: rwx-process-ipc-api-profile
  desc: RWX allocation with multiple process/IPC APIs
  crit: suspicious
  conf: 0.9
  all:
  - id: micro-behaviors/mem/alloc/executable::rwx-allocation
  any:
  - id: micro-behaviors/mem/read/cross-process::read-process-memory
  - id: micro-behaviors/communications/ipc/named-pipe::named-pipe-api-usage
  - id: micro-behaviors/communications/ipc/mailslot::create-mailslot
  needs: 2
  unless:
  - id: well-known/lib/runtime/native-platform/cygwin::cygwin-family-runtime
  - id: well-known/tool/development/vcs/git-for-windows::mingit-getprocaddr-helper
  - id: metadata/signed/platform/
  - id: metadata/binary/framework::dotnet-metadata
  - id: well-known/tool/sysadmin/conemu/
  - id: well-known/tool/reverse-engineering/radare2/
  - id: well-known/lib/runtime/scripted/nwjs::windows-runtime-context
  - id: well-known/app/storage/syncback/
  - id: well-known/tool/browser::chromium-process-host-product
