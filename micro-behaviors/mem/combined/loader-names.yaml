defaults:
  platforms: [windows]
  for: [pe, dll]

composite_rules:
- id: virtual-memory-api-name-triad
  desc: VirtualAlloc/Free/Protect names in .vr
  crit: notable
  conf: 0.96
  all:
  - id: micro-behaviors/mem/alloc/virtual::vr-virtual-alloc-string
  - id: micro-behaviors/mem/free::vr-virtual-free-string
  - id: micro-behaviors/mem/protect/modify::vr-virtual-protect-string
