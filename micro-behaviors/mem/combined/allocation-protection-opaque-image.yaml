defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: allocation-protection-opaque-image
    desc: Allocation and protection APIs in a large or high-entropy image
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
    any:
      - id: metadata/binary/section/ratio::largest-section-at-least-90-percent
      - id: metadata/file/entropy::high-overall-entropy-70
    unless:
      - id: metadata/binary/section/label/packing::upx-section
      - id: metadata/binary/symbols/exports::no-exports
      - id: metadata/binary/layout/ratio::svk-packed-section
    downgrade:
      any:
        - id: metadata/vendor/string::microsoft-corp-marker-rsrc
        - id: metadata/installer/recognition::installer-script-evidence
