composite_rules:
- id: enumerated-remote-memory-write-api-profile
  desc: Process enumeration with remote-memory write and read/allocation APIs
  crit: suspicious
  conf: 0.97
  all:
  - id: micro-behaviors/process/enumerate/snapshot::toolhelp-snapshot-reference
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  any:
  - id: micro-behaviors/mem/read/cross-process::read-process-memory
  - id: micro-behaviors/mem/alloc/remote::virtual-alloc-ex-dup
  needs: 1
  unless:
  - id: metadata/binary/layout/embedded::repeated-standard-pe-images
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: well-known/game/mod/
- id: game-reference-remote-memory-read-api-profile
  desc: Game names with process enumeration and remote-memory read APIs
  crit: notable
  conf: 0.92
  all:
  - id: micro-behaviors/process/enumerate/snapshot::toolhelp-snapshot-reference
  - id: micro-behaviors/mem/combined::game-process-or-module-reference
  - id: micro-behaviors/mem/read/cross-process::read-process-memory
  unless:
  - id: metadata/binary/layout/embedded::repeated-standard-pe-images
  - id: metadata/signed/platform/
  - id: metadata/binary/vendor/
  - id: well-known/game/mod/
  - id: well-known/tool/offensive/pvz-tools/
- id: game-process-or-module-reference
  desc: Game process or module filename reference
  crit: notable
  conf: 0.86
  any:
  - id: micro-behaviors/fs/path/library::unity-game-module-reference
  - id: micro-behaviors/process/info/name::mainstream-game-executable-name
  - id: micro-behaviors/fs/path/binary::source-engine-game-executable-reference
defaults:
  platforms:
  - windows
  for:
  - pe
