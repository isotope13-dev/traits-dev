# Co-occurrence of fiber, section mapping and protection API references.
# These names also occur in ordinary native runtimes; no ordering is proved.
defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: fiber-section-memory-api-profile
    desc: Fiber and section-mapping memory API references
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/process/create/fiber::create-fiber-api-string
      - id: micro-behaviors/mem/create/shared::nt-section-map-dynamic-apis
      - id: micro-behaviors/mem/protect/modify::virtual-protect
      - id: micro-behaviors/dylib/load/runtime::load-library-a
    unless:
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: well-known/lib/crypto/openssl/
      - id: well-known/lib/runtime/native-platform/mozilla-nspr/
