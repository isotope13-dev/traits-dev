defaults:
  platforms: [windows]
  for: [powershell]
# API-resolution and memory primitives do not establish execution or evasion.
composite_rules:
  - id: powershell-delegate-alloc-copy-protect
    desc: PowerShell delegate memory API preparation
    conf: 0.97
    crit: notable
    all:
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-function-pointer-delegate
      - id: micro-behaviors/mem/alloc/executable::powershell-virtualalloc-call
      - id: micro-behaviors/mem/protect/modify::powershell-virtualprotect-name
      - id: "micro-behaviors/mem/copy::marshal-copy-powershell"

  - id: powershell-msil-pointer-block-copy
    desc: PowerShell MSIL pointers and raw block copying
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-msil-ldftn
      - id: micro-behaviors/process/interpreter/reflection/runtime::powershell-msil-cpblk
      - id: micro-behaviors/mem/copy::marshal-copy-powershell
