defaults:
  platforms: [windows]
  for: [powershell]
# API-resolution and memory primitives do not establish execution or evasion.
composite_rules:
  - id: powershell-delegate-alloc-copy-protect
    desc: PowerShell delegate memory API preparation
    conf: 0.97
    crit: notable
    all:
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-function-pointer-delegate
      - id: micro-behaviors/mem/alloc/virtual::powershell-virtualalloc-reference
      - id: metadata/file/profile/memory-protection-api::powershell-virtualprotect-name
      - id: "micro-behaviors/mem/copy::marshal-copy-powershell"

  - id: powershell-msil-pointer-block-copy
    desc: PowerShell MSIL pointers and raw block copying
    crit: suspicious
    conf: 0.96
    all:
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::powershell-msil-ldftn
      - id: micro-behaviors/metaprogramming/reflection/inspect/class::powershell-msil-cpblk
      - id: micro-behaviors/mem/copy::marshal-copy-powershell

  - id: powershell-xor-memory-delegate-references
    desc: PowerShell XOR, RWX and delegate text references
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/data/encoding/xor::powershell-modulo-xor-references
      - id: micro-behaviors/mem/alloc/virtual::powershell-virtualalloc-reference
      - id: metadata/file/profile/memory-protection-context::powershell-rwx-protection-evidence
      - id: micro-behaviors/os/api-resolution/dynamic::powershell-function-pointer-dynamicinvoke-text

