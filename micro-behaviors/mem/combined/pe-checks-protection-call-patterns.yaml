composite_rules:
- id: pe-checks-protection-call-patterns
  desc: PE checks, protection API and call bytes
  # Signature comparisons and page APIs co-occur; no source-to-sink claim.
  crit: notable
  for: [pe, dll]
  platforms: [windows]
  conf: 0.98
  all:
  - id: micro-behaviors/data/format/pe-parser::inline-mz-magic-check
  - id: micro-behaviors/data/format/pe-parser::inline-pe-signature-check
  - id: metadata/binary/instruction/sequence::allocation-like-argument-patterns
  - id: micro-behaviors/mem/protect/modify::virtual-protect
  unless:
  - id: metadata/signed/platform/
  - id: metadata/binary/framework::dotnet-assembly
  - id: metadata/binary/installer/family/
  # Stock WinRAR SFX code validates embedded PE modules and changes their
  # page protection. A separately detected RWX copy-and-jump stage still
  # identifies a patched or trojanized SFX carrier.
  - id: metadata/binary/installer/sfx::winrar-sfx

