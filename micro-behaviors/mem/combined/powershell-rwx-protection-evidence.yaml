defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.96

composite_rules:
  - id: powershell-rwx-protection-evidence
    desc: Named RWX protection or memory API argument
    any:
      - id: micro-behaviors/mem/protect/constant::page-execute-readwrite
      - id: micro-behaviors/mem/alloc/virtual::powershell-virtualalloc-commit-rwx-call
      - id: micro-behaviors/mem/alloc/virtual::powershell-delegate-rwx-alloc-arguments
      - id: micro-behaviors/mem/alloc/virtual::powershell-virtualalloc-rwx-argument
      - id: micro-behaviors/mem/protect/modify/executable::powershell-virtualprotect-rwx-argument
      - id: micro-behaviors/mem/alloc/virtual::powershell-virtualallocex-rwx-argument
      - id: micro-behaviors/mem/protect/modify/executable::powershell-virtualprotectex-rwx-argument
