defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: tick-count-pe-protection-api-profile
    desc: Tick count with CBC/PE/protection API profile
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/time/query::get-tick-count
      - id: micro-behaviors/mem/combined::cbc-pe-header-protection-api-profile
    any:
      - id: metadata/binary/layout/overlay::has-overlay
      - id: micro-behaviors/mem/protect/modify::integer-loads-protection-thread-apis
    needs: 1
    unless:
      - id: metadata/signed/platform/
