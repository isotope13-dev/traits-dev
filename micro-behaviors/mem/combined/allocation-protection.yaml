defaults:
  for: [scripts, binaries, source]
  platforms: [windows, unix]
composite_rules:
  - id: virtual-allocation-or-page-protection
    desc: Allocation/protection evidence alternative
    # The legacy directory includes incomplete flags and baseline runtime
    # facts. One alternative alone does not identify a particular operation;
    # concrete API constituents keep their own notable severity.
    crit: component
    conf: 0.9
    any:
      - id: micro-behaviors/mem/protect/modify/
      # Preserve this selector's former execute-flag member after relocation.
      - id: micro-behaviors/mem/protect/constant::page-execute-constant
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-string
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-string-text-section
      - id: micro-behaviors/mem/alloc/virtual::vr-virtual-alloc-string
      - id: micro-behaviors/mem/free::vr-virtual-free-string
      - id: virtual-memory-api-name-triad
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
