defaults:
  conf: 0.75
  platforms:
    - windows
  for:
    - pe
    - dll
  crit: notable
traits:
  - id: flush-instruction-cache
    desc: FlushInstructionCache code synchronization
    if:
      type: text
      substr: FlushInstructionCache
    unless:
      - id: metadata/build/generated::winmd-metadata
  - id: nt-flush-instruction-cache
    desc: NtFlushInstructionCache code synchronization
    if:
      type: text
      substr: NtFlushInstructionCache
    unless:
      - id: metadata/build/generated::winmd-metadata
  - id: clflush-intrinsic-call
    desc: Flushes a CPU cache line in source
    conf: 0.92
    for: [c, cpp, rust]
    platforms: [windows, unix]
    if:
      type: symbol
      kind: call
      regex: '(^|::)(_{0,2}mm_clflush(opt)?|clflush(opt)?)$'
composite_rules:
  # Instruction-cache consumers must not inherit mapped-file writeback.
  - id: instruction-cache-flush
    desc: References an instruction-cache flush operation
    crit: notable
    conf: 0.75
    platforms: [windows, linux]
    for: [pe, dll, elf]
    any:
      - id: flush-instruction-cache
      - id: nt-flush-instruction-cache
      - id: mips-cacheflush-syscall
