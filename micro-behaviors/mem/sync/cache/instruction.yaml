defaults:
  conf: 0.75
  platforms:
    - windows
  for:
    - pe
    - dll
  crit: notable
traits:
  - id: flush-instruction-cache
    desc: FlushInstructionCache code synchronization
    if:
      type: text
      substr: FlushInstructionCache
    unless:
      - id: metadata/build/generated::winmd-metadata
  - id: nt-flush-instruction-cache
    desc: NtFlushInstructionCache code synchronization
    if:
      type: text
      substr: NtFlushInstructionCache
    unless:
      - id: metadata/build/generated::winmd-metadata
