defaults:
  conf: 0.75
  platforms:
    - windows
  for:
    - pe
    - dll
  crit: notable
traits:
  - id: flush-instruction-cache
    desc: FlushInstructionCache code synchronization
    if:
      type: text
      substr: FlushInstructionCache
    unless:
      - id: metadata/build/generated::winmd-metadata
  - id: flush-instruction-cache-source
    desc: Calls Windows instruction-cache synchronization
    conf: 0.95
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      regex: '^(Nt)?FlushInstructionCache$'
  - id: nt-flush-instruction-cache
    desc: NtFlushInstructionCache code synchronization
    if:
      type: text
      substr: NtFlushInstructionCache
    unless:
      - id: metadata/build/generated::winmd-metadata
  # Darwin/libc exposes the same operation as __clear_cache; packed loaders
  # import it to run bytes they generated or decrypted in memory.
  - id: clear-cache-import
    desc: __clear_cache instruction-cache flush import
    for: [macho, so, dylib, elf]
    platforms: [macos, linux]
    if:
      type: import
      exact: clear_cache
  - id: clflush-intrinsic-call
    desc: Flushes a CPU cache line in source
    conf: 0.92
    for: [c, cpp, rust]
    platforms: [windows, unix]
    if:
      type: symbol
      kind: call
      regex: '(^|::)(_{0,2}mm_clflush(opt)?|clflush(opt)?)$'
  - id: prefetch-intrinsic-call
    desc: Hints CPU cache prefetch via intrinsic
    conf: 0.9
    for: [c, cpp, rust]
    platforms: [windows, unix]
    if:
      type: symbol
      kind: call
      regex: '(^|::)(_{0,2}mm_prefetch|__builtin_prefetch|prefetch_(read|write)_data)$'
  - id: x86-prefetch-inline-asm
    desc: Emits x86 cache prefetch mnemonic
    conf: 0.88
    for: [c, cpp, rust, go]
    platforms: [windows, unix]
    if:
      type: text
      regex: '(?i)\bprefetch(nta|t[012]|w)\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: x86-rdtsc-prefetch-sequence
    desc: Brackets x86 prefetch with RDTSC reads
    conf: 0.95
    for: [pe, elf, macho]
    arch: [x86-64, x86]
    platforms: [windows, unix]
    if:
      type: hex
      section: .text
      # RDTSC (0F 31), optional fences/moves, PREFETCH{NTA,T0,T1,T2} m8
      # (0F 18 /0..3 => ModRM 00..1F, 40..5F, 80..9F; excludes 0F 18 /4..7 NOPs),
      # optional fences/shifts, then second RDTSC (0F 31).
      pattern: '0F 31 [0-24] 0F 18 (0?|1?|4?|5?|8?|9?) [0-32] 0F 31'
  - id: x86-fence-intrinsic-or-asm
    desc: Issues x86 lfence or mfence in source
    conf: 0.85
    for: [c, cpp, rust]
    platforms: [windows, unix]
    if:
      type: text
      regex: '\b(_{0,2}mm_[lm]fence|[lm]fence)\b'
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
  - id: x86-fence-opcode
    desc: Contains x86 lfence or mfence opcodes
    crit: baseline
    conf: 0.85
    for: [pe, elf, macho]
    arch: [x86-64, x86]
    platforms: [windows, unix]
    count_min: 2
    if:
      type: hex
      section: .text
      pattern: '0F AE (E8|F0)'
composite_rules:
  - id: x86-memory-fence
    desc: Uses x86 lfence or mfence barriers
    crit: notable
    conf: 0.88
    platforms: [windows, unix]
    for: [c, cpp, rust, pe, elf, macho]
    any:
      - id: x86-fence-intrinsic-or-asm
      - id: x86-fence-opcode
  # Instruction-cache consumers must not inherit mapped-file writeback.
  - id: instruction-cache-flush
    desc: References an instruction-cache flush operation
    crit: notable
    conf: 0.75
    platforms: [windows, linux]
    for: [pe, dll, elf]
    any:
      - id: flush-instruction-cache
      - id: nt-flush-instruction-cache
      - id: mips-cacheflush-syscall
