defaults:
  attack: T1055
  mbc: B0033
  platforms:
    - unix
    - windows
    - macos
  for:
    - elf
traits:
  - id: memfd-create
    desc: References the memfd_create anonymous-memory API
    crit: notable
    conf: 0.8
    for: [elf, c, cpp, rust, go]
    platforms:
      - linux
    if:
      type: symbol
      regex: memfd_create
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
      - id: well-known/lib/runtime/php-runtime::source-tree
      - id: well-known/tool/reverse-engineering/radare2::radare2-go-module-source-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: well-known/app/communication/telegram::telegram-desktop-third-party-source
    downgrade:
      any:
        - id: metadata/file/string/identity::system-shell-basename
  - id: memfd-create-syscall-number-x86
    desc: Raw syscall invokes memfd_create by number (x86)
    crit: notable
    conf: 0.8
    arch: [x86]
    platforms:
      - linux
    if:
      type: hex
      section: text
      # push imm32 0x164 (356, the i386 memfd_create syscall number) followed
      # by a call — the generic libc syscall() wrapper invoked with a literal
      # syscall number in place of the named import, so no `memfd_create`
      # symbol is present to match on.
      pattern: '68 64 01 00 00 [0-6] E8'
  - id: memfd-create-python
    desc: Python calls a memfd_create wrapper
    crit: notable
    conf: 0.95
    platforms: [linux]
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '^(os|libc)\.memfd_create$'
    unless:
      - id: metadata/library/python-stdlib::python-stdlib-test-file
      - id: metadata/package/files/dependency::python-type-stub-path
  - id: python-libc-memfd-create
    desc: Python invokes memfd_create via libc
    crit: notable
    conf: 0.96
    platforms: [linux]
    for: [python]
    if:
      type: text
      regex: '\bsyscall\s*\(\s*SYS_memfd_create\b'
    unless:
      - id: metadata/library/python-stdlib::python-stdlib-test-file
  # Same capability as the memfd-create symbol above (notable) — the Go wrapper is
  # no more suspicious. memfd_create is used legitimately by JIT/runtime code
  # (clangd/LLVM, Go programs); fileless-exec intent comes from composites.
  - id: memfd-create-go
    desc: Go MemfdCreate reference
    crit: notable
    conf: 0.8
    platforms:
      - linux
    if:
      type: text
      substr: MemfdCreate
