defaults:
  platforms:
  - linux
composite_rules:
- id: anonymous-file-reference-group
  desc: Anonymous-file API or syscall references
  crit: notable
  conf: 0.95
  for:
  - elf
  - c
  any:
  - id: micro-behaviors/mem/anonymous/create::memfd-create
  - id: metadata/lang/source/naming/interface::sys-memfd-create-reference
  unless:
  - id: metadata/package/files/system-package::libc-syscall-number-header
  - id: well-known/tool/offensive/pwntools::pwntools-distribution
  - id: well-known/tool/reverse-engineering/e9patch::source-context
