# The matcher has response, memfd, write and exec APIs, without binding the
# response bytes or the executable path to that anonymous descriptor.
defaults:
  platforms: [unix, windows]
  for: [python]

composite_rules:
  - id: python-http-memfd-write-exec-profile
    desc: Python HTTP response, memfd, write and exec clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/communications/http/client/response-body::requests-response-body-access
      - id: micro-behaviors/communications/ip/literal::http-ip-url
      - id: micro-behaviors/mem/anonymous/create::python-libc-memfd-create
      - id: micro-behaviors/fs/write/file/descriptor::python-os-write-fd
    any:
      - id: micro-behaviors/process/create/direct::python-os-execve-call
      - id: micro-behaviors/process/create/direct::python-os-execv-call
