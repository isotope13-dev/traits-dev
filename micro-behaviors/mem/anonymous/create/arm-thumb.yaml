defaults:
  platforms: [linux]
  for: [elf]
  arch: [arm]
  crit: notable
traits:
  - id: arm-thumb-memfd-wrapper-arguments
    desc: Thumb memfd syscall argument sequence
    conf: 0.95
    if:
      type: hex
      section: .text
      # movw r0,385; ldr r1,<name>; movs r2,1; blx <wrapper>.
      pattern: '40 F2 81 10 ?? 49 01 22 ?? F? ?? E?'
composite_rules:
  - id: arm-thumb-memfd-syscall-wrapper
    desc: Thumb memfd arguments with syscall import
    conf: 0.96
    all:
      - id: arm-thumb-memfd-wrapper-arguments
      - id: micro-behaviors/os/syscall/invoke::syscall-wrapper-import
