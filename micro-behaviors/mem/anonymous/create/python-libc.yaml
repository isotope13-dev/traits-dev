# Anonymous files also store ordinary application data. Execution and evasion
# require separate evidence in the consuming objective composite.
defaults:
  for: [python]
  platforms: [linux]
  crit: notable
  conf: 0.92
  size_max: 300000
traits:
  - id: python-libc-memfd-create
    desc: Python libc memfd_create call
    if:
      type: text
      regex: 'libc\.memfd_create\s*\('
