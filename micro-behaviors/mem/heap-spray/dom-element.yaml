# DOM-element heap spraying: legacy IE exploit code builds a string of
# heap blocks with shellcode at a chosen offset and assigns it to a
# SMIL/TIME element's `values` property so the browser heap fills with
# controlled blocks. The atoms are exploit-kit vocabulary; intent is
# assembled by the objectives composites that pair them.
defaults:
  for: [javascript, html]
  platforms: [windows, unix]
  crit: notable
  conf: 0.9

traits:
  - id: animatecolor-time-element
    desc: Injects an ANIMATECOLOR TIME element
    if:
      type: text
      substr: '<t:ANIMATECOLOR'

  - id: shellcode-buffer-append
    desc: Appends shellcode into a string buffer
    if:
      type: text
      regex: '\+=\s*("[^"]{0,8}"\s*\+\s*)?shellcode\b'

  - id: time-element-values-assignment
    desc: Assigns an element values property
    crit: component
    if:
      type: text
      regex: '\.values\s*='

  - id: heap-spray-block-size
    desc: Heap spray block size parameter
    crit: component
    if:
      type: text
      substr: heapBlockSize
