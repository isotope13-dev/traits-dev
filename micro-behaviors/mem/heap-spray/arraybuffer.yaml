defaults:
  for: [javascript, typescript, html]
  platforms: [windows, unix, android]
  crit: notable
  conf: 0.92

traits:
  - id: arraybuffer-reclaim-loop
    desc: Allocates buffers in a spray loop
    if:
      type: text
      regex: 'for\s*\([^)]{0,160}SPRAY_COUNT[^)]{0,160}\)[\s\S]{0,300}new\s+ArrayBuffer\([^)]{1,40}\)'
