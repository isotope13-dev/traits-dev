defaults:
  for: [javascript, typescript, html]
  platforms: [windows, unix, android]
traits:
  - id: js-typed-array-heap-spray
    desc: Allocates large arrays into collection
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)new\s+(big[u]?int64array|float64array|array)\(0x[0-9a-f]{5,}\)[\s\S]{1,150}\.push\('
