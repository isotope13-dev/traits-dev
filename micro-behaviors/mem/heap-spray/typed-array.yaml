defaults:
  for: [javascript, typescript, html]
  platforms: [windows, unix, android]
traits:
  - id: js-typed-array-heap-spray
    desc: Allocates large arrays into collection
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'new\s+(BigU?Int64Array|Float64Array|Array)\(0x[0-9a-fA-F]{5,}\)[\s\S]{1,150}\.push\('
