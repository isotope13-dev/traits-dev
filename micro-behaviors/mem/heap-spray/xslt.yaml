# XSLTProcessor parameter heap spray: in browser exploits (e.g. Firefox CVE-2024-9680),
# repeatedly calling setParameter with long strings allocates controlled heap
# buffers to reclaim freed objects.
defaults:
  platforms: [windows, unix, android]
  for: [javascript, typescript, html]
  crit: suspicious
  conf: 0.92

traits:
  - id: xslt-parameter-spray
    desc: Sprays heap via XSLTProcessor parameters
    if:
      type: text
      regex: '(?s)new\s+XSLTProcessor\b.{0,300}setParameter\('
