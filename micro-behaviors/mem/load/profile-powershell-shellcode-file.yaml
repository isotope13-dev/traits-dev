defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: powershell-shellcode-bin-path
    desc: PowerShell shellcode bin path
    crit: notable
    conf: 0.86
    if:
      type: text
      substr: shellcode.bin

composite_rules:
  - id: powershell-shellcode-bin-bytearray
    desc: PowerShell shellcode file path and byte-array output clues
    crit: suspicious
    conf: 0.9
    all:
      - id: powershell-shellcode-bin-path
      - id: metadata/file/profile/process/injection::powershell-bytearray-type-text
