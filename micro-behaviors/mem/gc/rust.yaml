# Rust ownership/reclamation mechanics: code that deliberately prevents a
# value's destructor from running. Neutral on its own -- guard types,
# ManuallyDrop hand-offs and FFI ownership transfers all rely on it -- but it
# is the leg that turns a spawned child handle into a detached process, which
# is why objectives and process composites reference it.
defaults:
  platforms: [unix, windows]
  for: [rust]

traits:
  - id: rust-mem-forget
    desc: Rust skips a value's destructor with mem::forget
    crit: baseline
    conf: 0.96
    if:
      type: text
      regex: '(std::)?mem::forget\s*\(\s*\w+\s*\)'
