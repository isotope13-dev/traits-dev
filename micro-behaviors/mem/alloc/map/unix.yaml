defaults:
  platforms: [linux, macos]
  for: [elf, macho, c, cpp]
traits:
  - id: map-anonymous-const
    desc: Unix MAP_ANONYMOUS memory-map constant
    crit: baseline
    conf: 0.6
    if:
      type: text
      substr: MAP_ANONYMOUS
    unless:
      - id: metadata/lang/compiler/systems/
      # A -g3 build copies every #include'd macro name into the debug string
      # pool, so <sys/mman.h> alone puts "MAP_ANONYMOUS 0x20" in any unstripped
      # binary that never maps a page.
      - id: metadata/binary/section/names::dwarf-macro-table
  - id: direct-mmap-syscall-wrapper
    desc: References direct mmap syscall wrapper
    crit: notable
    conf: 0.9
    platforms: [macos]
    for: [macho]
    if:
      type: text
      substr: syscall_mmap
  # Resolved direct mmap/mremap syscall instructions (no libc wrapper).
  # filefacts decodes the number at each raw syscall site. Static Go/musl
  # runtimes map memory this way constantly, so these stay low — mapping is
  # near-universal; RWX intent lives in a composite that joins the protection
  # flags, which a stripped binary rarely exposes.
  - id: mmap-syscall
    desc: Maps memory via direct mmap syscall
    crit: baseline
    conf: 0.5
    platforms: [linux]
    for: [elf]
    if:
      type: syscall
      name: [mmap]
  - id: mremap-syscall
    desc: Remaps a memory mapping via direct syscall
    crit: notable
    conf: 0.6
    platforms: [linux]
    for: [elf]
    if:
      type: syscall
      name: [mremap]
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiler/systems::go-version-string
