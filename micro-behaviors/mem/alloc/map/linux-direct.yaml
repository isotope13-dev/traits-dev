# Static syscall capabilities. Presence does not prove runtime execution.
# Argument predicates apply to one recovered instruction site.
defaults:
  crit: notable
  platforms: [linux]
  for: [elf]
  conf: 0.9
traits:
  - id: mmap-executable-syscall
    desc: Requests an executable memory mapping
    if:
      type: syscall
      name: [mmap]
      arch: [x86_64, aarch64]
      args:
        - index: 2
          mask: 4
  - id: mmap-writable-executable-syscall
    desc: Requests writable executable memory
    if:
      type: syscall
      name: [mmap]
      arch: [x86_64, aarch64]
      args:
        - index: 2
          mask: 6
