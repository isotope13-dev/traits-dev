# AutoIt has no structured source producer; match typed FFI call arguments.
defaults:
  platforms: [windows]
  for: [text, data, vbs]
  crit: notable
  conf: 0.97
traits:
  - id: autoit-remote-rwx-allocation-call
    desc: AutoIt typed remote RWX allocation
    if:
      type: raw
      regex: '(?i)"VirtualAllocEx"[^\r\n]{1,300}"dword"[ \t]*,[ \t]*64[ \t]*\)'
