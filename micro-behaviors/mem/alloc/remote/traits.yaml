# Remote-process memory allocation surfaces. These are memory allocation
# operations; process-injection objectives combine them with process and thread
# primitives to infer intent.
defaults:
  crit: notable
  for: [pe, dll, c, cpp, csharp, rust]
  platforms: [windows]
  attack: T1055

traits:
  - id: virtual-alloc-ex
    desc: Remote-process VirtualAllocEx allocation
    conf: 0.95
    mbc: C0032
    if:
      type: import
      exact: VirtualAllocEx
    unless:
      - id: well-known/game/mod::bedrockboot-preload-injector-pdb
  - id: virtual-alloc-ex-text
    desc: VirtualAllocEx API string reference
    conf: 0.9
    mbc: C0032
    for: [pe, dll, rust]
    if:
      type: text
      word: VirtualAllocEx
    unless:
      # The symbol records the API being used; this also sees the name sitting in
      # data. Standing down there keeps one use from counting twice.
      - id: virtual-alloc-ex-source
      # The symbol records the API being used; this also sees the name sitting in
      # data. Standing down there keeps one use from counting twice.
      - id: virtual-alloc-ex

  - id: virtual-alloc-ex-source
    desc: VirtualAllocEx remote allocation in source
    conf: 0.95
    mbc: C0032
    for: [c, cpp, csharp, rust]
    if:
      type: symbol
      kind: call
      exact: VirtualAllocEx
    unless:
      - id: virtual-alloc-ex

composite_rules:
  - id: virtual-alloc-ex-dup
    desc: VirtualAllocEx remote-process allocation reference
    conf: 0.95
    any:
      - id: virtual-alloc-ex
      - id: virtual-alloc-ex-text
      - id: virtual-alloc-ex-source
