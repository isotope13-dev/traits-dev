# Remote-process memory allocation surfaces. These are memory allocation
# operations; process-injection objectives combine them with process and thread
# primitives to infer intent.
defaults:
  for: [pe, dll, c, cpp, csharp, rust]
  platforms: [windows]
  attack: T1055

traits:
  - id: virtual-alloc-ex
    desc: Remote-process VirtualAllocEx allocation
    crit: notable
    conf: 0.95
    mbc: C0032
    if:
      type: import
      exact: VirtualAllocEx
    unless:
      - id: well-known/game/mod::bedrockboot-preload-injector-pdb
  - id: virtual-alloc-ex-text
    desc: VirtualAllocEx API string reference
    crit: notable
    conf: 0.9
    mbc: C0032
    for: [pe, dll, rust]
    if:
      type: text
      word: VirtualAllocEx
    unless:
      - id: virtual-alloc-ex

composite_rules:
  - id: virtual-alloc-ex-dup
    desc: VirtualAllocEx remote-process allocation reference
    crit: notable
    conf: 0.95
    any:
      - id: virtual-alloc-ex
      - id: virtual-alloc-ex-text
