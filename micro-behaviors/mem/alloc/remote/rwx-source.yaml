defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.95

traits:
  - id: virtual-alloc-ex-rwx-source
    desc: Source requests remote RWX allocation
    if:
      type: symbol
      kind: call
      exact: VirtualAllocEx
      arg:
        index: 4
        kind: identifier
        name: PAGE_EXECUTE_READWRITE
  - id: virtual-alloc-ex-rwx-numeric-source
    desc: Source requests remote allocation with 0x40
    if:
      type: symbol
      kind: call
      exact: VirtualAllocEx
      arg:
        index: 4
        kind: number
        value: 64
