# VirtualAllocEx can address either the current process or another process.
# A separate target observation is needed to claim cross-process allocation.
defaults:
  crit: notable
  for: [pe, dll, c, cpp, csharp, rust, class]
  platforms: [windows]

traits:
  - id: virtual-alloc-ex
    desc: VirtualAllocEx import reference
    conf: 0.95
    mbc: C0007
    if:
      type: import
      exact: VirtualAllocEx
  - id: virtual-alloc-ex-text
    desc: VirtualAllocEx API string reference
    conf: 0.9
    mbc: C0007
    # Go names the API through syscall.MustFindProc("VirtualAllocEx").
    for: [pe, dll, go, rust, class, powershell, batch, javascript]
    if:
      type: text
      word: VirtualAllocEx
    unless:
      # The symbol records the API being used; this also sees the name sitting in
      # data. Standing down there keeps one use from counting twice.
      - id: virtual-alloc-ex-source
      # The symbol records the API being used; this also sees the name sitting in
      # data. Standing down there keeps one use from counting twice.
      - id: virtual-alloc-ex

  - id: virtual-alloc-ex-source
    desc: VirtualAllocEx call in source
    conf: 0.95
    mbc: C0007
    for: [c, cpp, csharp, rust]
    if:
      type: symbol
      kind: call
      exact: VirtualAllocEx
    unless:
      - id: virtual-alloc-ex

  - id: serialized-virtualallocex-name
    desc: Serialized Python VirtualAllocEx name
    crit: notable
    conf: 0.95
    for: [pe, dll]
    if:
      type: text
      exact: aVirtualAllocEx

composite_rules:
  - id: virtual-alloc-ex-dup
    desc: VirtualAllocEx allocation evidence
    conf: 0.95
    any:
      - id: serialized-virtualallocex-name
      - id: virtual-alloc-ex
      - id: virtual-alloc-ex-text
      - id: virtual-alloc-ex-source
