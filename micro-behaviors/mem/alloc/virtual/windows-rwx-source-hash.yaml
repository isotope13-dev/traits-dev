defaults:
  platforms: [windows]

traits:
  - id: virtualalloc-rwx-source-reference
    desc: VirtualAlloc call text with RWX flag name
    crit: notable
    conf: 0.94
    for: [c, cpp, csharp, rust]
    if:
      type: text
      # Calls are commonly split one argument per line in source and decompiler
      # output. Stay inside the same call statement while accepting that layout.
      regex: '(?is)\bVirtualAlloc[AW]?\s*\([^;]{0,240}\bPAGE_EXECUTE_READWRITE\b'

  - id: virtualalloc-rwx-commit-ror13-x86
    desc: x86 hashed VirtualAlloc RWX call bytes
    crit: notable
    conf: 0.99
    for: [pe, dll]
    arch: [x86]
    size_max: 5242880
    if:
      type: hex
      # VirtualAlloc(NULL, size, MEM_COMMIT, PAGE_EXECUTE_READWRITE), followed
      # by the canonical ROR13 API hash and a call through the resolver.
      pattern: '6A 40 68 00 10 00 00 (50|51|52|53|56|57) 6A 00 68 58 A4 53 E5 FF D5'
      offset_range: [0, null]

  - id: virtualalloc-rwx-commit-ror13-x64
    desc: x64 hashed VirtualAlloc RWX call bytes
    crit: notable
    conf: 0.99
    for: [pe, dll]
    arch: [x86-64]
    size_max: 5242880
    if:
      type: hex
      # VirtualAlloc(NULL, size, MEM_COMMIT, PAGE_EXECUTE_READWRITE) through ROR13 hash
      pattern: '6A 40 41 59 68 00 10 00 00 41 58 [0-16] 41 BA 58 A4 53 E5 FF D5'
      offset_range: [0, null]
