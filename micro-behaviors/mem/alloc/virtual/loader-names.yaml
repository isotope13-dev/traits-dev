defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
- id: vr-virtual-alloc-string
  desc: VirtualAlloc name in .vr unpacker section
  crit: notable
  conf: 0.94
  if:
    type: text
    exact: VirtualAlloc
    section: .vr
  unless:
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-source
- id: virtual-alloc-string
  desc: VirtualAlloc API string reference
  crit: notable
  conf: 0.9
  for:
  - pe
  - javascript
  if:
    type: text
    word: VirtualAlloc
  unless:
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-source
  - id: vr-virtual-alloc-string
  - id: metadata/lang/compiler/systems::go-pe-symtab
  - id: well-known/tool/sysadmin/logapi::logapi-pipe-marker
  - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
  - id: metadata/binary/layout/ratio::svk-packed-section
- id: virtual-alloc-string-text-section
  desc: VirtualAlloc string in PE code section
  crit: notable
  conf: 0.94
  for:
  - pe
  if:
    type: text
    word: VirtualAlloc
    section: .text
  unless:
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
  - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-source
