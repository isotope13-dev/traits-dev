defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.96

traits:
  - id: powershell-virtualalloc-allocation-flags
    desc: VirtualAlloc name beside commit or reserve flags
    if:
      type: text
      regex: '(?is)\bVirtualAlloc\w*\b.{0,180}\b(0x[123]000|12288|4096|8192|MEM_COMMIT|MEM_RESERVE)\b'
