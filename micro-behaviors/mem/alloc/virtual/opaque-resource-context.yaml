defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: opaque-resource-pe-virtualalloc-api-profile
    desc: VirtualAlloc API in unsigned PE with opaque-resource access
    crit: notable
    conf: 0.96
    # This is an allocation-API observation qualified by resource context.
    # Imports do not bind resource bytes to an allocation or prove concealment.
    # Preserve the former stub-loader rule's exact population and exclusions.
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
      - id: metadata/binary/resource/entropy::large-high-entropy-rsrc-section
      - id: micro-behaviors/data/embedded/payload/resource::pe-resource-full-extraction
    unless:
      - id: metadata/lang/compiler/managed::delphi-pngimage-unit
      - id: metadata/binary/installer/family/
      - id: metadata/binary/framework/
      - id: well-known/app/
