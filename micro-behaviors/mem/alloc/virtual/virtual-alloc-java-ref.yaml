defaults:
  for: [class, java]
  platforms: [windows, unix]
traits:
  - id: virtual-alloc-java-ref
    desc: VirtualAlloc string reference
    crit: notable
    conf: 0.9
    if:
      type: text
      word: VirtualAlloc
    unless:
    # The symbol records the API being used; this also sees the name sitting in
    # data. Standing down there keeps one use from counting twice.
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-source
