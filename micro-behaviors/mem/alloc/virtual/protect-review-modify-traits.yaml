defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
traits:
  - id: virtual-alloc-ex-python-source
    desc: Python VirtualAllocEx allocation call
    crit: notable
    conf: 0.97
    attack: T1055
    mbc: C0032
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)VirtualAllocEx$'
