defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-virtualalloc-near-rwx-number
    desc: VirtualAlloc text near 0x40 or 64
    conf: 0.96
    platforms: [windows]
    # Python loaders are sometimes deliberately stored under data/text
    # extensions and handed directly to pythonw.exe. Raw call syntax remains
    # observable even when filename-driven classification reports `text`.
    for: [python, text]
    if:
      type: text
      regex: '(?i)\bVirtualAlloc\s*\([\s\S]{0,240}\b(0x40|64)\b'
