defaults:
  for: [c, cpp, csharp, rust]
  platforms: [windows]

traits:
  - id: virtual-alloc-source
    desc: VirtualAlloc call in source
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: VirtualAlloc
  - id: nt-allocate-virtual-memory-api
    desc: NtAllocateVirtualMemory API reference
    crit: notable
    conf: 0.85
    for: [pe, dll, c, cpp, csharp, rust]
    if:
      type: text
      word: NtAllocateVirtualMemory
    unless:
      - id: metadata/binary/resource::kernel-driver-idata
  - id: mem-commit-reserve-source
    desc: Source requests committed reserved memory
    crit: baseline
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '\bMEM_COMMIT\b.{0,10}\bMEM_RESERVE\b'

  # PAGE_READWRITE commit is ordinary allocation. Reflective-loading
  # objectives pair these atoms with a later executable transition.
  - id: virtualalloc-readwrite-commit-resolved-x64
    desc: Resolved x64 VirtualAlloc read-write buffer
    crit: notable
    conf: 0.94
    arch: [x86-64]
    for: [pe, dll]
    if:
      type: hex
      section: .text
      pattern: '41 B9 04 00 00 00 41 B8 00 30 00 00 [0-32] FF 15 ?? ?? ?? ??'

  - id: virtualalloc-readwrite-commit-resolved-x64-register-order
    desc: x64 RW VirtualAlloc register-order variant
    crit: notable
    conf: 0.94
    arch: [x86-64]
    for: [pe, dll]
    if:
      type: hex
      section: .text
      pattern: '41 B8 00 30 00 00 41 B9 04 00 00 00 [0-32] FF 15 ?? ?? ?? ??'

  - id: virtualalloc-readwrite-commit-stack-x64
    desc: Stack-indirect x64 VirtualAlloc RW buffer
    crit: notable
    conf: 0.94
    arch: [x86-64]
    for: [pe, dll]
    if:
      type: hex
      section: .text
      pattern: '41 B9 04 00 00 00 41 B8 00 30 00 00 [0-32] FF 94 24 ?? ?? ?? ??'

  - id: virtualalloc-readwrite-commit-register-x64
    desc: Register-resolved x64 VirtualAlloc RW buffer
    crit: notable
    conf: 0.95
    arch: [x86-64]
    for: [pe, dll]
    size_max: 5242880
    if:
      type: hex
      section: .text
      pattern: '41 B9 04 00 00 00 [0-24] 41 B8 00 30 00 00 [0-32] 41 FF (D0|D1|D2|D3|D4|D5|D6|D7)'
