defaults:
  for: [c, cpp, csharp, rust]
  platforms: [windows]

traits:
  - id: virtual-alloc-source
    desc: VirtualAlloc call in source
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: VirtualAlloc
  - id: nt-allocate-virtual-memory-api
    desc: NtAllocateVirtualMemory API reference
    crit: notable
    conf: 0.85
    for: [pe, dll, c, cpp, csharp, rust]
    if:
      type: text
      word: NtAllocateVirtualMemory
    unless:
      - id: metadata/binary/resource::kernel-driver-idata
  - id: mem-commit-reserve-source
    desc: Source requests committed reserved memory
    crit: baseline
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: '\bMEM_COMMIT\b.{0,10}\bMEM_RESERVE\b'
