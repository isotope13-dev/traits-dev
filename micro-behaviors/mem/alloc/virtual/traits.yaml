defaults:
  for: [c, cpp, csharp, rust]
  platforms: [windows]

traits:
  - id: alloc-memory-sym--ntallocatevirtualmemory
    desc: References the NtAllocateVirtualMemory API
    crit: notable
    for:
    - pe
    - dll
    if:
      type: symbol
      exact: NtAllocateVirtualMemory
  - id: virtual-alloc-source
    desc: VirtualAlloc call in source
    crit: notable
    conf: 0.92
    if:
      type: symbol
      kind: call
      exact: VirtualAlloc
  - id: virtual-alloc-decoded-text
    desc: VirtualAlloc call in decoded data
    crit: notable
    conf: 0.9
    for: [data]
    if:
      type: text
      regex: '\bVirtualAlloc\s*\([^)]{0,100}\)'
  - id: nt-allocate-virtual-memory-api
    desc: NtAllocateVirtualMemory API reference
    crit: notable
    conf: 0.85
    for: [pe, dll, c, cpp, csharp, rust]
    if:
      type: text
      word: NtAllocateVirtualMemory
    unless:
      # The symbol records the API being used; this also sees the name sitting in
      # data. Standing down there keeps one use from counting twice.
      - id: alloc-memory-sym--ntallocatevirtualmemory
  # PAGE_READWRITE commit is ordinary allocation. Reflective-loading
  # objectives pair these atoms with a later executable transition.
  - id: virtualalloc-readwrite-commit-resolved-x64
    desc: x64 read-write virtual allocation call pattern
    crit: notable
    conf: 0.94
    arch: [x86-64]
    for: [pe, dll]
    if:
      type: hex
      section: .text
      pattern: '41 B9 04 00 00 00 41 B8 00 30 00 00 [0-32] FF 15 ?? ?? ?? ??'

  - id: virtualalloc-readwrite-commit-resolved-x64-register-order
    desc: x64 read-write allocation register pattern
    crit: notable
    conf: 0.94
    arch: [x86-64]
    for: [pe, dll]
    if:
      type: hex
      section: .text
      pattern: '41 B8 00 30 00 00 41 B9 04 00 00 00 [0-32] FF 15 ?? ?? ?? ??'

  - id: virtualalloc-readwrite-commit-stack-x64
    desc: x64 read-write allocation stack-call pattern
    crit: notable
    conf: 0.94
    arch: [x86-64]
    for: [pe, dll]
    if:
      type: hex
      section: .text
      pattern: '41 B9 04 00 00 00 41 B8 00 30 00 00 [0-32] FF 94 24 ?? ?? ?? ??'

  - id: virtualalloc-readwrite-commit-register-x64
    desc: x64 read-write allocation register-call pattern
    crit: notable
    conf: 0.95
    arch: [x86-64]
    for: [pe, dll]
    if:
      type: hex
      section: .text
      pattern: '41 B9 04 00 00 00 [0-24] 41 B8 00 30 00 00 [0-32] 41 FF (D0|D1|D2|D3|D4|D5|D6|D7)'
