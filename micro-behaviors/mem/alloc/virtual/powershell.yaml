defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.96

traits:
  - id: powershell-virtualalloc-pinvoke-declaration
    desc: PowerShell VirtualAlloc P/Invoke declaration
    if:
      type: text
      regex: '(?is)DllImport\s*\(\s*["'']kernel32(\.dll)?["''].{0,250}\bVirtualAlloc\b'

  - id: powershell-virtualalloc-reference
    desc: PowerShell references the VirtualAlloc API
    if:
      type: text
      word: VirtualAlloc
    unless:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-source

  - id: powershell-fragmented-virtualalloc
    desc: Quoted fragments spell the VirtualAlloc name
    if:
      type: text
      regex: "(?is)'Virt'[\\s\\S]{0,80}'ualA'[\\s\\S]{0,80}'lloc'"

  - id: powershell-virtualalloc-allocation-flags
    desc: VirtualAlloc name beside commit or reserve flags
    if:
      type: text
      regex: '(?is)\bVirtualAlloc\w*\b.{0,180}\b(0x[123]000|MEM_COMMIT|MEM_RESERVE)\b'

composite_rules:
  - id: powershell-virtualalloc-allocation-flag-evidence
    desc: Virtual allocation commit or reserve evidence
    any:
      - id: powershell-virtualalloc-allocation-flags
      - id: micro-behaviors/mem/alloc/executable::powershell-virtualalloc-commit-rwx-call
