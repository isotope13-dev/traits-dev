defaults:
  for: [pe]
  platforms: [windows]
  arch: [x86-64]
traits:
  - id: x64-rwx-allocation-jump-arguments
    desc: x64 RWX allocation arguments before jump
    crit: notable
    conf: 0.95
    if:
      type: hex
      section: .text
      pattern: '31 C9 BA [4] 41 B8 00 30 00 00 41 B9 40 00 00 00 [0-48] FF E0 48 85 C0'
composite_rules:
  - id: x64-virtualalloc-rwx-jump
    desc: VirtualAlloc code reference beside RWX allocation jump arguments
    crit: notable
    conf: 0.97
    near_bytes: 160
    all:
      - id: virtual-alloc-string-text-section
      - id: x64-rwx-allocation-jump-arguments
