defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  - id: managed-virtual-alloc-ex-call
    desc: Managed call to VirtualAllocEx
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)VirtualAllocEx$'
    unless:
      - type: value
        path: pe.clr.runtime_version
        exists: false
