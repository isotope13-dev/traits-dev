defaults:
  for: [pe, dll, c, cpp, csharp, rust]
  platforms: [windows]
traits:
  - id: virtual-alloc
    desc: Imports VirtualAlloc memory allocation API
    crit: notable
    conf: 0.9
    if:
      type: import
      exact: VirtualAlloc
    unless:
      - id: metadata/lang/compiler/systems::go-binary
      - id: metadata/lang/compiler/systems::go-binary-comp
      - id: well-known/game/mod::bedrockboot-preload-cpp-pdb
