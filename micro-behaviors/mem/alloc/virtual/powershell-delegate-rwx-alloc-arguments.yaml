defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.96

composite_rules:
  - id: powershell-delegate-rwx-alloc-arguments
    desc: PowerShell delegate requests RWX memory
    conf: 0.96
    near_bytes: 140
    all:
      - id: micro-behaviors/mem/alloc/virtual::powershell-typed-allocation-delegate
      - id: micro-behaviors/mem/alloc/virtual::powershell-allocation-delegate-rwx-flags
