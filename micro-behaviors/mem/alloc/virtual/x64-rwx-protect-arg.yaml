# x64 call whose 4th argument (r9d) is set to 0x40, PAGE_EXECUTE_READWRITE,
# just before an indirect import call: the VirtualAlloc(addr, size, type,
# PAGE_EXECUTE_READWRITE) shape. Compilers spell it `mov r9d, 0x40` or
# `or r9d, 0x40`. RWX allocation alone is neutral -- system DLLs, JITs and
# runtimes do it -- so this is a memory capability, not a payload claim.
# (Moved from objectives/execution/payload/module-load.)
defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]

traits:
  - id: x64-call-rwx-protect-fourth-arg
    desc: x64 call passes RWX protection argument
    crit: notable
    conf: 0.85
    # JavaScript engines allocate RWX pages for JIT code; a Bun-compiled CLI
    # (Oven's runtime embedded in the executable) carries that call by design.
    unless:
      - id: well-known/lib/runtime/scripted/bun-runtime/
    if:
      type: hex
      section: .text
      pattern: >-
        (41 B9 40 00 00 00 [0-20] FF 15 ?? ?? ?? ?? |
        41 83 C9 40 [0-20] FF 15 ?? ?? ?? ?? |
        41 B9 40 00 00 00 31 C9 BA ?? ?? ?? ?? 41 B8 00 30 00 00 41 FF D? 48 85 C0 |
        41 B9 40 00 00 00 31 C9 BA ?? ?? ?? ?? 41 B8 00 30 00 00 FF D? 48 85 C0)
