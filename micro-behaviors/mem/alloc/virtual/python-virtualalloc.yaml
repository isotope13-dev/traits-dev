defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-virtualalloc-call
    desc: Python VirtualAlloc call
    conf: 0.94
    platforms: [windows]
    if:
      type: symbol
      kind: call
      regex: '^(kernel32\.)?VirtualAlloc$|^(ctypes\.)?windll\.kernel32\.VirtualAlloc$'
