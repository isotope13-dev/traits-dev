defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.96

traits:
  - id: powershell-virtualalloc-commit-rwx-call
    desc: VirtualAlloc reserve/commit RWX call text
    if:
      type: text
      regex: '(?i)\bVirtualAlloc\w*\([^;\r\n]{0,100},\s*0x[123]000\s*,\s*0x40\s*\)'

