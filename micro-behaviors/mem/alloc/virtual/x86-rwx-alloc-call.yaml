# x86 VirtualAlloc(0, n, MEM_COMMIT, PAGE_EXECUTE_READWRITE) whose result is
# stored, filled byte by byte and then called through: a buffer allocated to
# run what is written into it.
defaults:
  platforms: [windows]
  for: [pe, dll]
  attack: T1055
traits:
  - id: x86-rwx-alloc-then-call-buffer
    desc: x86 RWX allocation filled then called
    crit: notable
    conf: 0.9
    if:
      type: hex
      section: .text
      pattern: '6A 40 68 00 10 00 00 68 ?? ?? ?? ?? 6A 00 FF 15 ?? ?? ?? ?? 89 45 ?? [16-120] 88 ?? [8-80] FF 55 ??'
