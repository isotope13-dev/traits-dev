# C Runtime Memory Operations
# Standard C library memory management
defaults:
  for: ["pe", "dll"]
  platforms: ["windows"]
traits:
  # === Dynamic Allocation ===
  - id: malloc
    desc: C runtime malloc symbol reference
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "malloc"
  - id: calloc
    desc: C runtime calloc symbol reference
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "calloc"
