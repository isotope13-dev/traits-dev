# Keep non-executable and session pool enum references when excluding usage
# fields from the historical NonPagedPool substring matcher.
defaults:
  for: [pe, dll, c, cpp]
  platforms: [windows]
traits:
  - id: nonpaged-pool-nx-session-flag-reference
    desc: Nonpaged NX or session pool-flag reference
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bNonPagedPool(Nx|Session)[A-Za-z]*\b'
    unless:
      - id: metadata/lang/compiler/managed::delphi
      - id: metadata/binary/framework::dotnet-singlefilehost-pdb
