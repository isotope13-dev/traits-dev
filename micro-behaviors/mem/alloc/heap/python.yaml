defaults:
  platforms: [windows]
  for: [python]

traits:
  - id: python-heapalloc-call
    desc: Python calls the Windows HeapAlloc API
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b[A-Za-z_]\w*\.HeapAlloc\s*\('
  - id: python-heapcreate-call
    desc: Python calls the Windows HeapCreate API
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)\b[A-Za-z_]\w*\.HeapCreate\s*\('
  # HEAP_CREATE_ENABLE_EXECUTE (0x40000) as the creation flag makes the
  # heap itself executable, so staged bytes need no VirtualProtect call
  # before entry. Ordinary ctypes users never request this flag.
  - id: python-heapcreate-execute-flag
    desc: Python creates an executable Windows heap
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bHeapCreate\s*\(\s*(262144|0x0*40000|HEAP_CREATE_ENABLE_EXECUTE)\b'
