# Marshal allocation names describe local unmanaged storage, not API lookup.
defaults:
  crit: notable
  platforms: [windows]
  for: [pe, csharp]
traits:
  - id: dotnet-unmanaged-allocation-name
    desc: .NET unmanaged allocation API reference
    conf: 0.88
    if:
      type: text
      regex: '(?i)\bAlloc(HGlobal|CoTaskMem)\b'
  - id: dotnet-unicode-string-allocation
    desc: .NET UTF-16 unmanaged string allocation
    conf: 0.88
    if:
      type: text
      exact: StringToHGlobalUni
