defaults:
  for: [javascript, typescript, html]
  platforms: [windows, unix, android]
  crit: notable
  conf: 0.92

traits:
  - id: arraybuffer-in-loop-syntax
    desc: ArrayBuffer construction inside loop syntax
    if:
      type: text
      regex: 'for\s*\([^)]{1,40}\)\s*\{[^}]{0,80}new\s+ArrayBuffer\('
