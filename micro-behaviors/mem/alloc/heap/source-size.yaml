defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.86

traits:
  - id: megabyte-size-constant
    desc: Megabyte-scale size constant in source
    # A bare size constant, not proof of allocation: allocation intent comes
    # from the composites referencing this trait. The 1024*1024 alternative
    # requires an opening delimiter so a scaled product (10 * 1024 * 1024)
    # does not match on its trailing factor, and 1048576 is word-bounded so
    # a 10485760 (10 MB) limit does not match a span it merely starts with.
    if:
      type: text
      regex: '(1\s*(<<|<<<)\s*20|1\s+shl\s+20|1\s*-shl\s*20|1048576\b|[;=(,\[{]\s*1024\s*[*]\s*1024)'
