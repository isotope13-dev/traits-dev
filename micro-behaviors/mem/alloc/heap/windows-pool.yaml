defaults:
  platforms: [windows]
  for: [c, cpp, pe, dll]

traits:
  - id: kernel-pool-allocator-symbol
    desc: Windows kernel pool allocator symbol reference
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: ExAllocatePoolWithTag
    downgrade:
      any:
        - id: micro-behaviors/mem/map::ntoskrnl-image-name
  - id: nonpaged-pool-flag-reference
    desc: NonPagedPool allocation flag reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bNonPagedPool(Execute|CacheAligned)?\b'
    unless:
      - id: metadata/lang/compiler/managed::delphi
      - id: metadata/binary/framework::dotnet-singlefilehost-pdb
