defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-unbounded-megabyte-retention
    desc: Unbounded loop retains megabyte allocations
    crit: suspicious
    conf: 0.97
    if:
      type: tree-sitter
      language: python
      query: |
        (while_statement
          condition: (true)
          body: (block
            . (expression_statement (assignment
              left: (identifier) @buffer
              right: (binary_operator
                left: (binary_operator left: (string) right: (integer) @scale_a)
                right: (integer) @scale_b)))
            . (expression_statement (call
              function: (attribute object: (identifier) attribute: (identifier) @append)
              arguments: (argument_list (identifier) @retained)))
             .)
          (#eq? @buffer @retained)
          (#eq? @append "append")
          (#match? @scale_a "^(1024|2048|4096)$")
          (#match? @scale_b "^(1024|2048|4096)$")) @match
        (while_statement
          condition: (true)
          body: (block
            . (expression_statement (assignment
              left: (identifier) @buffer
              right: (binary_operator
                left: (binary_operator left: (string) right: (integer) @scale_a)
                right: (integer) @scale_b)))
            . (expression_statement (call
              function: (attribute object: (identifier) attribute: (identifier) @append)
              arguments: (argument_list (identifier) @retained)))
            . (expression_statement (call
              function: (attribute object: (identifier) @clock attribute: (identifier) @pause)
              arguments: (argument_list (float)) )) .)
          (#eq? @clock "time")
          (#eq? @pause "sleep")
          (#eq? @buffer @retained)
          (#eq? @append "append")
          (#match? @scale_a "^(1024|2048|4096)$")
          (#match? @scale_b "^(1024|2048|4096)$")) @match
