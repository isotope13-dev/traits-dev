# Rust manual heap allocation through the global allocator. Safe Rust never
# reaches these APIs — Vec/Box/String own their memory — so a crate that builds
# its own Layout and calls alloc/dealloc is managing raw buffers by hand.
# Ordinary for collection and arena crates (hashbrown's SwissTable storage is
# built this way); also how a Rust loader stages a decoded payload buffer.
# Intent-bearing composites (RWX staging, shellcode copy) live in objectives/.
defaults:
  platforms: [windows, unix]
  for: [rust]
  crit: notable
  conf: 0.9

traits:
  # `Layout::from_size_align[_unchecked]` is the computed-size form: the caller
  # derived the byte count at runtime rather than taking it from a type. That is
  # the shape used to size a buffer for arbitrary incoming data.
  - id: rust-alloc-layout-from-size-align
    desc: Rust builds heap Layout from computed size
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bLayout::from_size_align(_unchecked)?\s*\('

  - id: rust-alloc-zeroed-call
    desc: Rust calls alloc_zeroed
    crit: notable
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: alloc_zeroed
