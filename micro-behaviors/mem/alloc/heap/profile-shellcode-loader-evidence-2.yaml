defaults:
  platforms: [windows]

composite_rules:
  - id: peb-executable-heap-api-clues
    desc: PEB access with HeapCreate and executable-heap option constant
    crit: suspicious
    conf: 0.96
    for:
      - pe
      - dll
    arch:
      - x86-64
    size_max: 5242880
    all:
      - id: micro-behaviors/process/info/query::peb-access-x64
      - id: micro-behaviors/mem/create/heap::heap-create-enable-execute-flag
    unless:
      - id: metadata/signature/verified/platform::microsoft
      - id: metadata/signature/verified/signer::microsoft-corporation
      - id: well-known/tool/sysadmin/conemu::conemu-setup-signature
      - id: well-known/tool/sysadmin/conemu::conemu-background-plugin
