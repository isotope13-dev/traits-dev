# Memory Allocation (Windows)
# Standard heap and local memory allocation APIs
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.9
traits:
  - id: heap-alloc
    desc: Heap memory allocation
    if:
      type: symbol
      exact: "HeapAlloc"
  - id: heap-create
    desc: Create private heap (HeapCreate)
    crit: notable
    conf: 0.9
    if:
      type: symbol
      exact: "HeapCreate"
    downgrade:
      any:
        - id: metadata/binary/symbols/count::many-imports-50
        - id: metadata/binary/framework::dotnet-metadata
        - id: metadata/signed/platform/
  - id: local-alloc
    desc: Local memory allocation
    if:
      type: symbol
      exact: "LocalAlloc"

composite_rules:
  - id: heap-create-enable-execute-flag
    desc: HeapCreate reference with a 0x40000 first-argument register load
    crit: notable
    conf: 0.85
    arch: [x86-64]
    size_max: 5242880
    all:
      - id: heap-create
      - id: metadata/binary/code/arguments::x64-ecx-immediate-0x40000
