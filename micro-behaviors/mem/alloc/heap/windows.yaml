# Memory Allocation (Windows)
# Standard heap and local memory allocation APIs
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.9
traits:
  - id: heap-alloc
    desc: HeapAlloc symbol reference
    if:
      type: symbol
      exact: "HeapAlloc"
  - id: local-alloc
    desc: LocalAlloc symbol reference
    if:
      type: symbol
      exact: "LocalAlloc"
