defaults:
  platforms: [windows]
  for: [powershell]
  crit: notable
  conf: 0.96

traits:
  - id: powershell-virtualalloc-commit-rwx-call
    desc: VirtualAlloc requests reserve/commit and RWX
    if:
      type: text
      regex: '(?i)\bVirtualAlloc\w*\([^;\r\n]{0,100},\s*0x[123]000\s*,\s*0x40\s*\)'

  - id: powershell-memory-delegate-invoke
    desc: PowerShell invokes memory-backed delegate
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'GetDelegateForFunctionPointer[\s\S]{0,120}DynamicInvoke'
