defaults:
  platforms: [windows]
  for: [powershell]
  attack: T1620

traits:
  - id: powershell-virtualalloc-pinvoke
    desc: PowerShell P/Invokes VirtualAlloc
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)DllImport\s*\(\s*["'']kernel32\.dll["''].{0,80}\)[\s\S]{0,180}\bVirtualAlloc\b'

  - id: powershell-virtualalloc-call
    desc: PowerShell calls VirtualAlloc
    crit: notable
    conf: 0.96
    if:
      type: text
      word: VirtualAlloc

  - id: powershell-virtualalloc-commit-flag
    desc: PowerShell supplies commit or reserve flags
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)\bVirtualAlloc\w*\b.{0,240}\b(0x1000|MEM_COMMIT|0x2000|MEM_RESERVE)\b'

  # PAGE_EXECUTE_READWRITE, by name or as the 0x40 numeric constant.  The
  # numeric branch requires argument position (`, 0x40,`) because a bare 0x40 is
  # an ordinary number — a bit mask, a length, a colour — in unrelated scripts.
  # Named for the constant rather than for VirtualAlloc: the same flag is passed
  # to VirtualProtect/VirtualProtectEx and NtProtectVirtualMemory.
  - id: powershell-rwx-protection-flag
    desc: Supplies PAGE_EXECUTE_READWRITE flag
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)(\bPAGE_EXECUTE_READWRITE\b|,\s*0x40\s*,)'

  - id: powershell-memory-delegate-invoke
    desc: PowerShell invokes memory-backed delegate
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: 'GetDelegateForFunctionPointer[\s\S]{0,120}DynamicInvoke'
