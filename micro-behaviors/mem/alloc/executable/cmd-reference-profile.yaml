# These APIs and a command-interpreter name may coexist in JITs, installers,
# launchers or ransomware. No receive-to-command or cross-process flow is bound.
defaults:
  platforms: [windows]
  for: [pe]
composite_rules:
  - id: executable-allocation-cmd-name-profile
    desc: Executable allocation with cmd.exe name reference
    crit: notable
    conf: 0.98
    scope: file
    all:
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc
      - id: micro-behaviors/mem/alloc/executable::executable-allocation-indicator
      - id: micro-behaviors/fs/path/application/executable::cmd-exe-image-name
