defaults:
  platforms: [windows]
  for: [javascript, typescript]
  attack: T1055

traits:
  - id: javascript-virtualalloc-rwx-call
    desc: JavaScript requests RWX VirtualAlloc
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?is)\bVirtualAlloc\b.{0,500}(0x40\b|PAGE_EXECUTE_READWRITE)'
