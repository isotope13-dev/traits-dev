defaults:
  platforms: [windows]
  for: [javascript, typescript]

traits:
  - id: javascript-virtualalloc-rwx-reference
    desc: VirtualAlloc reference near RWX constant
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '(?is)\bVirtualAlloc\b.{0,500}(0x40\b|PAGE_EXECUTE_READWRITE)'
