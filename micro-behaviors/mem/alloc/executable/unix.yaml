defaults:
  platforms:
    - linux
    - macos
traits:
  - id: mmap-symbol
    desc: mmap memory mapping function
    crit: baseline
    conf: 0.5
    for: [elf, macho, so]
    if:
      type: import
      exact: mmap
  - id: mmap-import
    desc: mmap memory mapping import
    crit: baseline
    conf: 0.85
    for: [elf, macho, so]
    if:
      type: import
      regex: '^_?mmap$'
  - id: prot-exec-const
    desc: PROT_EXEC memory protection constant
    crit: baseline
    conf: 0.6
    for:
      - elf
      - macho
    if:
      type: text
      substr: PROT_EXEC
    unless:
      # A -g3 build copies every #include'd macro name into the debug string
      # pool, so <sys/mman.h> alone puts "PROT_EXEC 0x4" in any unstripped
      # binary that never maps an executable page.
      - id: metadata/binary/section/names::dwarf-macro-table
  # Source-level form of the same capability the mmap-exec composite detects in
  # compiled binaries. Mapping executable memory is what every JIT, dynamic
  # loader and interpreter does (CPython, PHP, the kernel), so this is a neutral
  # capability; dropper/injection composites supply the intent.
  - id: mmap-exec-source
    desc: Source maps memory with execute permission
    crit: notable
    conf: 0.9
    for: [c, cpp]
    if:
      type: text
      regex: 'mmap[\s\S]{0,160}PROT_EXEC'
    not:
      - substr: perf trampoline
    unless:
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-tree-path-any
  # Direct mmap whose prot argument includes PROT_EXEC (filefacts resolves the
  # immediate at the raw syscall site). Unlike the mmap-exec composite above,
  # this needs no PROT_EXEC string, so it catches the stripped, libc-bypassing
  # form — the shellcode / JIT-payload shape. Downgraded for the Go runtime,
  # which maps executable memory through its own syscall path.
  - id: mmap-exec-syscall
    desc: Direct mmap maps executable memory
    crit: suspicious
    conf: 0.8
    platforms: [linux]
    for: [elf]
    if:
      type: syscall
      name: [mmap]
      # prot (arg 2) has PROT_EXEC (0x4) set.
      args: [{ index: 2, mask: 4 }]
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiler/systems::go-version-string
  # The stronger, more specific shape: a direct mmap that is BOTH executable
  # (prot arg has PROT_EXEC) AND anonymous (flags arg has MAP_ANONYMOUS, 0x20) —
  # executable memory with no file backing. That is the textbook shellcode /
  # in-memory-payload allocation, matched as a conjunction on one call. Kept
  # alongside mmap-exec-syscall because the anonymity raises confidence; a
  # file-backed executable mmap (a JIT mapping its own cache) trips only the
  # former. Still downgraded for the Go runtime.
  - id: mmap-anon-exec-syscall
    desc: Direct mmap of anonymous executable memory
    crit: suspicious
    conf: 0.9
    platforms: [linux]
    for: [elf]
    if:
      type: syscall
      name: [mmap]
      # prot (arg 2) has PROT_EXEC (0x4); flags (arg 3) has MAP_ANONYMOUS (0x20).
      args:
        - { index: 2, mask: 4 }
        - { index: 3, mask: 32 }
    downgrade:
      any:
        - id: metadata/lang/compiler/systems::go-binary
        - id: metadata/lang/compiler/systems::go-version-string
composite_rules:
  - id: mmap-exec
    desc: Memory mapping with execute permission
    crit: notable
    conf: 0.75
    attack: T1055
    for:
      - elf
      - macho
    all:
      - id: prot-exec-const
    any:
      - id: mmap-symbol
      - id: mmap-import
