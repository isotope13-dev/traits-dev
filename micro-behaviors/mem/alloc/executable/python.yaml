# Executable native buffers allocated through Python's ctypes bridge.
defaults:
  platforms: [windows, unix]
  for: [python]
  attack: T1055.001

traits:
  - id: python-virtualalloc-call
    desc: Python VirtualAlloc call
    crit: notable
    conf: 0.94
    platforms: [windows]
    if:
      type: symbol
      kind: call
      regex: '^(kernel32\.)?VirtualAlloc$|^(ctypes\.)?windll\.kernel32\.VirtualAlloc$'

  - id: python-virtualalloc-executable-protection
    desc: Python executable VirtualAlloc protection
    crit: notable
    conf: 0.96
    platforms: [windows]
    if:
      type: text
      regex: '(?i)VirtualAlloc.{0,120}0x40'

  - id: python-mmap-prot-exec
    desc: Python mmap with execute permission
    crit: notable
    conf: 0.95
    platforms: [unix]
    if:
      type: text
      # Nested calls like len(code) appear inside the argument list, so do not
      # stop at the first ')'.
      regex: 'mmap\.mmap\s*\([\s\S]{0,200}PROT_EXEC'
