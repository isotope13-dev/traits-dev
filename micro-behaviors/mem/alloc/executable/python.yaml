# Executable native buffers allocated through Python's ctypes bridge.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]
  attack: T1055.001

traits:
  - id: python-virtualalloc-call
    desc: Python VirtualAlloc call
    conf: 0.94
    platforms: [windows]
    if:
      type: symbol
      kind: call
      regex: '^(kernel32\.)?VirtualAlloc$|^(ctypes\.)?windll\.kernel32\.VirtualAlloc$'

  - id: python-virtualalloc-executable-protection
    desc: Python executable VirtualAlloc protection
    conf: 0.96
    platforms: [windows]
    # Python loaders are sometimes deliberately stored under data/text
    # extensions and handed directly to pythonw.exe. Raw call syntax remains
    # observable even when filename-driven classification reports `text`.
    for: [python, text]
    if:
      type: text
      regex: '(?i)\bVirtualAlloc\s*\([\s\S]{0,240}\b(0x40|64)\b'

composite_rules:
  - id: python-executable-buffer-allocation
    desc: Python allocates an executable native buffer
    crit: notable
    conf: 0.96
    any:
      - id: micro-behaviors/mem/alloc/executable::python-virtualalloc-executable-protection
      - id: micro-behaviors/mem/map::python-mmap-prot-exec
