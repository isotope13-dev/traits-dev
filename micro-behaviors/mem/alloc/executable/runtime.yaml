defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [scripts, binaries]

traits:
  # Binaries only: a JIT engine linked into the image is what allocates
  # executable memory. A script that names one (`start luajit.exe x.txt`,
  # a Node comment about V8's JIT) only launches or discusses it.
  - id: jit-runtime-reference
    desc: Binary embeds a JIT compilation runtime
    conf: 0.85
    for: [binaries]
    if:
      type: text
      regex: '(?i)jit_compile|jit_runtime|libjit|LuaJIT|V8 JIT'

composite_rules:
  - id: jit-executable-memory
    desc: JIT runtime uses executable memory
    conf: 0.9
    all:
      - id: jit-runtime-reference
    any:
      - id: micro-behaviors/mem/alloc/executable::mmap-exec
      - id: micro-behaviors/mem/protect/modify::executable-memory-staging
