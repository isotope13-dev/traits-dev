# Rust equivalent of the mmap-exec composite that unix.yaml expresses for
# compiled binaries and C/C++ source. A crate that maps a page and asks for
# execute permission is doing what a JIT, an FFI trampoline or a dynamic loader
# does — and what a Rust shellcode stager does first. Neutral capability;
# dropper/injection composites in objectives/ supply the intent.
#
# Both legs are matched separately and joined by proximity rather than by one
# ordered regex, because the protection flags are usually computed into a local
# (`let prot = libc::PROT_READ | libc::PROT_EXEC;`) before the mmap call, so the
# constant can appear on either side of it.
composite_rules:
  - id: rust-mmap-exec
    desc: Rust maps memory with execute permission
    crit: notable
    conf: 0.9
    attack: T1055
    mbc: C0007
    platforms: [linux, macos]
    for: [rust]
    all:
      - id: micro-behaviors/mem/alloc/map::rust-libc-mmap-call
      - id: prot-exec-const
    near_lines: 20
