# CUDA allocation structures. The Rowhammer objective interprets their
# combination as GPU page-table massaging.
defaults:
  platforms: [linux, windows]
  for: [c, cpp, python]

traits:
  - id: cuda-vram-availability-query
    desc: Queries available CUDA VRAM
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\b(cudaMemGetInfo|cuMemGetInfo(_v2)?)\s*\('

  - id: cuda-managed-memory-allocation
    desc: Allocates CUDA managed memory
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: '\b(cudaMallocManaged|cuMemAllocManaged)\s*\('

  - id: available-bytes-derived-count
    desc: Derives count from available-byte quantity
    crit: notable
    conf: 0.9
    if:
      type: text
      # Bare `free` occurs frequently in prose before a slash. Require a
      # variable name that explicitly identifies the quantity as bytes.
      regex: '(?i)\b(free|available)_?bytes\b[^;\n]{0,60}/[^;\n]{1,60};'

  - id: cuda-managed-allocation-two-mib-size
    desc: CUDA managed allocation includes 2 MiB
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bcudaMallocManaged\s*\([^;]{0,200}2ULL\s*\*\s*1024\s*\*\s*1024'

  - id: cuda-managed-allocation-four-kib-size
    desc: CUDA managed allocation includes 4 KiB
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '\bcudaMallocManaged\s*\([^;]{0,220}4ULL\s*\*\s*1024'

composite_rules:
  - id: cuda-near-capacity-managed-allocation-loop
    desc: CUDA managed allocations consume available VRAM
    crit: notable
    conf: 0.94
    near_lines: 20
    all:
      - id: cuda-vram-availability-query
      - id: cuda-managed-memory-allocation
      - id: available-bytes-derived-count

  - id: cuda-two-mib-plus-four-kib-managed-allocation
    desc: CUDA 2 MiB plus 4 KiB allocation
    crit: notable
    conf: 0.96
    near_lines: 4
    all:
      - id: cuda-managed-allocation-two-mib-size
      - id: cuda-managed-allocation-four-kib-size
