# CUDA unified-memory call text and related size observations.
defaults:
  crit: notable
  platforms: [linux, windows]
  for: [c, cpp, python]

traits:

  - id: cuda-managed-memory-allocation
    desc: CUDA managed-memory allocation call text
    conf: 0.97
    if:
      type: text
      regex: '\b(cudaMallocManaged|cuMemAllocManaged)\s*\('

  - id: cuda-managed-allocation-two-mib-size
    desc: CUDA allocation text includes 2 MiB
    conf: 0.96
    if:
      type: text
      regex: '\bcudaMallocManaged\s*\([^;]{0,200}2ULL\s*\*\s*1024\s*\*\s*1024'

  - id: cuda-managed-allocation-four-kib-size
    desc: CUDA allocation text includes 4 KiB
    conf: 0.96
    if:
      type: text
      regex: '\bcudaMallocManaged\s*\([^;]{0,220}4ULL\s*\*\s*1024'

composite_rules:
  - id: cuda-allocation-near-available-byte-division
    desc: CUDA allocation near available-byte division
    conf: 0.94
    near_lines: 20
    all:
      - id: "micro-behaviors/mem/query::cuda-vram-availability-query"
      - id: cuda-managed-memory-allocation
      - id: metadata/lang/source/syntax/operator::available-bytes-derived-count

  - id: cuda-two-mib-plus-four-kib-managed-allocation
    desc: CUDA allocation text includes both sizes
    conf: 0.96
    near_lines: 4
    all:
      - id: cuda-managed-allocation-two-mib-size
      - id: cuda-managed-allocation-four-kib-size
