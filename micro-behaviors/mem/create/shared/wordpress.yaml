defaults:
  platforms: [unix, windows]
  for: [php]
composite_rules:
  - id: wordpress-shm-option-api-profile
    desc: WordPress shared-memory and option API profile
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/mem/create/shared::shm-open
      - id: micro-behaviors/mem/create/shared::shm-read
      - id: micro-behaviors/mem/create/shared::shm-write
      - id: micro-behaviors/data/db/access::php-get-option
      - id: micro-behaviors/data/config/write::wordpress-update-option
      - id: micro-behaviors/process/hook/event::wordpress-early-plugins-loaded-hook
    any:
      - id: micro-behaviors/fs/path/application/webapp::wp-mu-plugin-path
      - id: micro-behaviors/data/compression::wordpress-option-gzipped-base64-blob
    near_bytes: 2400
