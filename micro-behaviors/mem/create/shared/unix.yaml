defaults:
  platforms: [unix]
  for: [elf, macho, so, dylib, c, cpp, rust]
  crit: notable
  conf: 0.94

traits:
  - id: shm-open-existing-read-write
    desc: Opens existing POSIX shared memory read-write
    if:
      type: symbol
      kind: call
      exact: shm_open
      args:
        - kind: identifier
          name: O_RDWR
        - kind: number
          value: 0
