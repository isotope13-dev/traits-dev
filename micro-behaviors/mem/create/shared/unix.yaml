defaults:
  platforms: [unix]
  for: [elf, macho, so, dylib, c, cpp, rust]
  crit: notable
  conf: 0.94

traits:
  - id: shm-open-existing-read-write
    desc: Opens existing POSIX shared memory read-write
    if:
      type: symbol
      kind: call
      exact: shm_open
      args:
        - kind: identifier
          name: O_RDWR
        - kind: number
          value: 0

  - id: mmap-shared-write-source
    desc: Maps a shared region writable with mmap
    if:
      type: text
      regex: 'mmap\s*\([^;]{0,320}PROT_WRITE[^;]{0,240}MAP_SHARED'

  - id: msync-call
    desc: Synchronizes changes to a memory-mapped region
    if:
      type: symbol
      kind: call
      exact: msync
