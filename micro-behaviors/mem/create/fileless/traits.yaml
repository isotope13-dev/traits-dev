traits:
  - id: syscall-memfd-create
    desc: Calls memfd_create syscall
    crit: notable
    conf: 0.8
    platforms: [linux]
    for: [elf]
    if:
      type: syscall
      name: ["memfd_create"]
  - id: nscreate-objectfile-memory
    desc: In-memory dylib load (fileless exec)
    crit: suspicious
    conf: 0.9
    platforms: [macos]
    for: [macho]
    if:
      type: text
      substr: "NSCreateObjectFileImageFromMemory"
    unless:
      - id: well-known/lib/runtime/tcl-tk::tcl-tk-runtime-component
    downgrade:
      any:
        - id: metadata/signed/platform::apple
  - id: nslink-module-api
    desc: References the legacy Mach-O module-linking API
    crit: notable
    conf: 0.9
    platforms: [macos]
    for: [macho]
    if:
      type: text
      substr: "NSLinkModule"
    unless:
      - id: well-known/lib/runtime/tcl-tk::tcl-tk-runtime-component
    downgrade:
      any:
        - id: metadata/signed/platform::apple
  - id: nslookup-symbol-module-api
    desc: Resolves symbol in memory module
    crit: notable
    conf: 0.88
    platforms: [macos]
    for: [macho]
    if:
      type: text
      substr: "NSLookupSymbolInModule"
    unless:
      - id: well-known/lib/runtime/tcl-tk::tcl-tk-runtime-component
  - id: nsaddress-symbol-api
    desc: Resolves Mach-O symbol address
    crit: notable
    conf: 0.86
    platforms: [macos]
    for: [macho]
    if:
      type: text
      substr: "NSAddressOfSymbol"
    unless:
      - id: well-known/lib/runtime/tcl-tk::tcl-tk-runtime-component
  - id: nsdestroy-objectfile-api
    desc: Destroys in-memory object image
    crit: notable
    conf: 0.84
    platforms: [macos]
    for: [macho]
    if:
      type: text
      substr: "NSDestroyObjectFileImage"
    unless:
      - id: well-known/lib/runtime/tcl-tk::tcl-tk-runtime-component
  - id: dyld4-jit-loader-maker
    desc: Resolves dyld4 JustInTimeLoader construction API
    crit: notable
    conf: 0.92
    platforms: [macos]
    for: [macho]
    if:
      type: text
      substr: JustInTimeLoader4make
  - id: dyld4-segment-layout-api
    desc: Resolves dyld4 Mach-O segment layout API
    crit: notable
    conf: 0.92
    platforms: [macos]
    for: [macho]
    if:
      type: text
      substr: analyzeSegmentsLayout
  - id: dyld4-fixup-api
    desc: Resolves dyld4 fixup API
    crit: notable
    conf: 0.92
    platforms: [macos]
    for: [macho]
    if:
      type: text
      substr: applyFixups
  - id: dyld4-initializer-api
    desc: Resolves dyld4 initializer API
    crit: notable
    conf: 0.92
    platforms: [macos]
    for: [macho]
    if:
      type: text
      substr: runInitializersBottomUpPlusUpwardLinks
  - id: sec-image-section-flag
    desc: Creates executable image section
    crit: notable
    conf: 0.9
    platforms: [windows]
    for: [pe, dll, c, cpp, csharp, go, rust, powershell]
    if:
      type: text
      word: SEC_IMAGE
    unless:
      - id: metadata/library/generated::winmd-metadata
  - id: custom-memory-loader-module
    desc: Custom memory loader marker
    crit: notable
    conf: 0.94
    platforms: [windows, unix]
    for: [pe, dll, javascript, typescript]
    if:
      type: text
      substr: memload
composite_rules:
  - id: fileless
    desc: Fileless execution - memfd_create + execve
    conf: 0.95
    crit: suspicious
    platforms: [linux]
    for: [elf]
    all:
      - id: syscall-memfd-create
      - id: micro-behaviors/process/create/execv::syscall-execve-elf
    unless:
      # libc.so.N implements memfd_create + execve as the C library ABI —
      # SONAME alone is enough (GNU, NetBSD, …); see libc-soname rationale.
      - id: well-known/lib/native/glibc::libc-soname
      - id: well-known/lib/native/glibc::libc-runtime
      # musl exports memfd_create and execve wrappers in its dynamic loader;
      # those libc implementations are not fileless payload execution.
      - id: metadata/binary/linking/runtime::musl-loader-basename
      # FreeBSD libsys exports syscall wrappers, including memfd_create and
      # execve; their co-occurrence is libc plumbing, not fileless execution.
      # Matched on SONAME as well as basename: inside a disk image the member
      # path is not always intact, and the dynamic section always is.
      - id: metadata/binary/linking/runtime::freebsd-libsys-basename
      - id: metadata/binary/linking/runtime::freebsd-libsys-soname
      # uruntime deliberately expands an AppImage into a memfd and execs it.
      # That packaging bootstrap is not fileless malware execution.
      - id: well-known/lib/runtime/uruntime::appimage-fileless-context
      # BusyBox is a multi-call userland and carries independent syscall
      # wrappers for applets; co-occurrence does not prove a memfd exec chain.
      - id: well-known/tool/sysadmin/busybox::busybox-binary-basename
  - id: fileless-macos-hostile
    desc: Fileless execution with hidden tmp file on macOS
    conf: 0.95
    crit: suspicious
    platforms: [macos]
    for: [macho]
    all:
      - id: nscreate-objectfile-memory
      - id: micro-behaviors/fs/path/temp::tmp-hidden-file
  - id: mach-o-legacy-memory-module-loader
    desc: Mach-O in-memory module loader through NS APIs
    conf: 0.96
    crit: suspicious
    platforms: [macos]
    for: [macho]
    all:
      - id: nscreate-objectfile-memory
      - id: nslink-module-api
    any:
      - id: nslookup-symbol-module-api
      - id: nsaddress-symbol-api
      - id: nsdestroy-objectfile-api
    unless:
      - id: well-known/lib/runtime/tcl-tk::tcl-tk-runtime-component
    downgrade:
      any:
        - id: metadata/signed/platform::apple
  - id: mach-o-dyld4-memory-module-loader
    desc: Mach-O in-memory module loader through dyld4 APIs
    conf: 0.96
    crit: suspicious
    platforms: [macos]
    for: [macho]
    all:
      - id: dyld4-jit-loader-maker
      - id: dyld4-segment-layout-api
      - id: dyld4-fixup-api
      - id: dyld4-initializer-api
  - id: mach-o-memory-module-loader
    desc: Mach-O in-memory module loader
    conf: 0.96
    crit: suspicious
    platforms: [macos]
    for: [macho]
    any:
      - id: mach-o-legacy-memory-module-loader
      - id: mach-o-dyld4-memory-module-loader
    downgrade:
      any:
        - id: metadata/signed/platform::apple
