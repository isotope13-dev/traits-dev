defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  # NtUnmapViewOfSection is the same ntdll service under its Nt name.
  - id: managed-section-unmap-call
    desc: Managed call to Nt/ZwUnmapViewOfSection
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(Nt|Zw)UnmapViewOfSection$'
