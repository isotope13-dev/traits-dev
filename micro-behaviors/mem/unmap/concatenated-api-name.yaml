# Adjacent API names lack word boundaries. The ordinary word-name
# matcher handles separated names; this variant covers concatenated data.
defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
traits:
- id: concatenated-unmap-view-api-name
  desc: Concatenated NtUnmapViewOfSection API name
  crit: notable
  conf: 0.97
  if:
    type: text
    regex: NtUnmapViewOfSection[A-Za-z]
