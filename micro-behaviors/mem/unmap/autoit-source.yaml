# AutoIt has no structured source producer; match typed FFI call arguments.
defaults:
  platforms: [windows]
  for: [text, data, vbs]
  crit: notable
  conf: 0.97
traits:
  - id: autoit-unmap-process-image-call
    desc: AutoIt typed NtUnmapViewOfSection call
    if:
      type: raw
      regex: '(?i)"int"[ \t]*,[ \t]*"NtUnmapViewOfSection"[ \t]*,[ \t]*"ptr"'
