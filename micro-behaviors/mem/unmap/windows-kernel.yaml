defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
  conf: 0.9

traits:
  - id: mm-unmap-io-space
    desc: Unmap physical I/O space in kernel
    for: [pe, dll, c, cpp, rust, go, csharp]
    if:
      type: symbol
      exact: MmUnmapIoSpace

  - id: mm-unmap-io-space-xoradd-string
    desc: Encoded MmUnmapIoSpace string
    conf: 0.9
    if:
      type: text
      substr: 'yXcYUXJrSnN^'

  - id: mm-unmap-io-space-atbash-string
    desc: Atbash-obfuscated MmUnmapIoSpace string
    conf: 0.98
    if:
      type: text
      substr: 'NnFmnzkRlHkzxv'
