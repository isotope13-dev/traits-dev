# Recovered from static string-decoder review. This matches an API name,
# not an invocation; the objective consumer supplies the attack context.
defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: indexed-xor-native-unmap-name
    desc: Index-add/XOR concealed native unmap name
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule indexed_xor_native_unmap_name {
          strings:
            $name = "\x5b\x79\x58\x72\x72\x67\x77\x5e\x72\x6f\x82\x5b\x73\x61\x74\x73\x85\x7b\x82\x82" xor(0-255)
          condition:
            $name
        }
