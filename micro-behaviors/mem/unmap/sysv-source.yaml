defaults:
  platforms: [unix]
  for: [c, cpp, rust]
  crit: notable
  conf: 0.9

traits:
  - id: c-sysv-attach-unmap-loop
    desc: Loop unmaps the shmat result
    for: [c, cpp]
    if:
      type: tree-sitter
      query: |
        ((for_statement
          body: (compound_statement
            (expression_statement
              (assignment_expression
                left: (identifier) @mapped
                right: (call_expression function: (identifier) @attach)))
            (expression_statement
              (call_expression
                function: (identifier) @unmap
                arguments: (argument_list . (identifier) @target)))))
         (#eq? @attach "shmat")
         (#eq? @unmap "munmap")
         (#eq? @mapped @target))

  - id: rust-sysv-attach-unmap-loop
    desc: Rust loop unmaps the shmat result
    for: [rust]
    if:
      type: tree-sitter
      query: |
        ((for_expression
          body: (block
            (let_declaration
              pattern: (identifier) @mapped
              value: (call_expression
                function: (scoped_identifier name: (identifier) @attach)))
            (expression_statement
              (call_expression
                function: (scoped_identifier name: (identifier) @unmap)
                arguments: (arguments . (identifier) @target)))))
         (#eq? @attach "shmat")
         (#eq? @unmap "munmap")
         (#eq? @mapped @target))

composite_rules:
  - id: sysv-attach-unmap-loop
    desc: Loop unmaps its shared-memory attachment
    any:
      - id: c-sysv-attach-unmap-loop
      - id: rust-sysv-attach-unmap-loop
