# Rust source that maps pages through the libc mmap family rather than going
# through the global allocator. Normal for arena/allocator crates, page-aligned
# buffers, and mmap-backed test allocators (hashbrown ships one under
# `#[cfg(test)]`); it is also how a Rust loader carves out a page to stage a
# decoded payload. Neutral capability — execute-permission mapping is the
# separate composite in ../executable/rust.yaml.
defaults:
  platforms: [linux, macos]
  for: [rust]
  crit: notable
  conf: 0.92
  mbc: C0044

traits:

  - id: rust-libc-munmap-call
    desc: Rust releases a mapping through libc munmap
    conf: 0.9
    if:
      type: text
      substr: "libc::munmap"
