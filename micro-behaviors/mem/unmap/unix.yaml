defaults:
  crit: baseline
  platforms: [linux, macos]
  for: [elf, macho, c, cpp]
traits:
  - id: munmap
    desc: Unmap files from memory
    conf: 0.66
    if:
      type: symbol
      regex: munmap
    unless:
      # The anchored import atom below is canonical on binaries (the symbol
      # family includes imports, so both would otherwise report the same
      # import twice). Keep this atom for static binaries and sources, where
      # no import record exists.
      - id: micro-behaviors/mem/unmap::munmap-import
  - id: munmap-import
    desc: Unmap memory import (munmap)
    conf: 0.9
    if:
      type: import
      regex: '^_?munmap$'
