defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: zw-unmap-section-name
    desc: References ZwUnmapViewOfSection
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: ZwUnmapViewOfSection
  - id: nt-unmap-view-of-section-import
    desc: Imports native section-unmapping API
    crit: notable
    conf: 0.97
    for: [pe, dll, class]
    if:
      type: import
      exact: NtUnmapViewOfSection
composite_rules:
  - id: native-section-unmap-api-references
    desc: Section unmapping APIs
    crit: notable
    conf: 0.85
    any:
      - id: micro-behaviors/mem/unmap::nt-unmap-view-of-section-name
      - id: micro-behaviors/mem/unmap::zw-unmap-section-name
      - id: micro-behaviors/mem/unmap::nt-unmap-view-of-section-import
