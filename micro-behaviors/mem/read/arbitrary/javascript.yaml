# JavaScript source patterns that construct native-address and arbitrary-memory
# primitives. These are memory-access capabilities; browser exploit intent is
# inferred only when an objective composite assembles the complete primitive.
defaults:
  platforms: [windows, unix, android]
  for: [javascript, typescript, html]

traits:
  - id: js-addrof-primitive
    desc: Defines addrof object-address helper
    crit: suspicious
    conf: 0.98
    if:
      type: text
      regex: '\bfunction\s+addrof\s*\('

  - id: js-addressof-primitive
    desc: Defines addressOf memory primitive
    crit: suspicious
    conf: 0.96
    if:
      type: text
      regex: 'function\s+addressOf[\s\S]{0,600}(ArrayBuffer|DataView|BigInt)'

  - id: js-object-address-helper
    desc: Defines an object-address helper
    crit: suspicious
    conf: 0.94
    if:
      type: text
      regex: '\bfunction\s+(objectAddress|leakAddress)\s*\('

  - id: js-native-memory-read64-helper
    desc: Word read after backing-pointer redirection
    # Require backing-pointer redirection, not an ordinary integer decoder.
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\b(read64|cageRead)\(\w+\) \{ \w+\[\d+\] = \w+\(\w+\); return \w+\[0\];'

  - id: js-memory-read-pointer-helper
    desc: Defines readPointer helper
    # Emscripten's embind runtime defines `function readPointer(pointer){
    # return this.fromWireType(HEAPU32[...])}` in every WASM-binding bundle it
    # generates — an ordinary wasm-linear-memory struct accessor, not a browser
    # exploit primitive.  Browser exploit intent is assembled by the JIT
    # composites from several independent primitives.
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bfunction\s+readPointer\s*\('

  - id: js-jit-bce-integer-overflow-read
    desc: JIT BCE integer overflow array read
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\(\w+\s*\+\s*(0x7fffffff|0x80000000|214748364[78])\)\s*\|\s*0'

  - id: js-nan-boxed-pointer-tag-check
    desc: Checks NaN-boxed pointer or value tag
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)(0xfffe0000|0xfff88000|0x00007ff0)'
    unless:
      # WebAssembly text tests spell the same constants as load/store offsets
      # (`i32.load offset=0xfffe0000`); they are address-range probes, not
      # NaN-boxed engine values.
      - type: path
        regex: '(?i)\.(wast|wat)$'
      # A named bit-mask declaration (`PREV_MASK = 0xFFFE0000`, Angular's
      # StylingRange enum) uses the constant as a field mask, not as a NaN-boxed
      # engine tag.
      - type: text
        regex: '(?i)\w*mask\w*\s*=\s*0x(fffe0000|fff88000|00007ff0)'

  # NOTE: a bare `.length !== 0x...` comparison was retired from this file
  # (formerly js-sprayed-array-length-corruption-probe). That matcher detects
  # an ordinary size validation, not a memory primitive: it fired on benign
  # fixed-table checks such as a font CMap `length !== 0x10000` guard. The
  # spray-scale recheck now lives at
  # micro-behaviors/data/collection/array::js-spray-scale-length-recheck,
  # which requires a megabyte-scale constant ordinary validations do not
  # reach; exploit intent is assembled only by the heap-spray composite that
  # pairs it with large-array spraying.
