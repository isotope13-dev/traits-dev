defaults:
  for: [html, javascript, typescript]
  platforms: [unix, windows, android]
traits:
  - id: array-pointer-string-byte-read
    desc: Array-slot update followed by string byte read
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: '\w+\[1\] = \w+\(\w+\);\s*return BigInt\(\w+\.charCodeAt\(0\)\);'
