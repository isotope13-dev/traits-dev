defaults:
  conf: 0.95
  for: [scripts, binaries]
  platforms:
  - windows
traits:
- id: comsvcs-dump--rx-2
  desc: Embedded comsvcs MiniDump command string
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)\brundll32(\.exe)?\s+[^,\r\n]{0,120}\bcomsvcs(\.dll)?\s*,\s*(MiniDump|MiniDumpW)\b'
  unless:
  - id: metadata/file/format/log::windows-event-csv-records
- id: comsvcs-ordinal-dump--rx-1
  desc: Embedded comsvcs ordinal dump command
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)\brundll32(\.exe)?\s+[^,\r\n]{0,120}\bcomsvcs(\.dll)?\s*,\s*#0*24\b'
- id: comsvcs-spaced-argv-dump--rx-3
  desc: Spaced comsvcs MiniDump invocation
  crit: notable
  conf: 0.93
  if:
    # The comma form above only matches `rundll32 comsvcs,MiniDump`. Live
    # usage is just as often space-separated (`rundll32.exe
    # C:\Windows\System32\comsvcs.dll MiniDump <pid> <out> full`) or an argv
    # list (`["rundll32.exe", "...comsvcs.dll", "MiniDump", ...]`), where
    # quotes and commas sit between the tokens.
    type: text
    regex: '(?i)\brundll32(\.exe)?["'',\s]+\S[^\r\n]{0,160}\bcomsvcs(\.dll)?\b["'',\s]+MiniDumpW?\b'
  unless:
  - id: metadata/file/format/log::windows-event-csv-records
composite_rules:
- id: comsvcs-dump
  desc: Comsvcs process-dump command marker
  crit: notable
  conf: 0.95
  any:
  - id: comsvcs-dump--rx-2
  - id: comsvcs-ordinal-dump--rx-1
  - id: comsvcs-spaced-argv-dump--rx-3
