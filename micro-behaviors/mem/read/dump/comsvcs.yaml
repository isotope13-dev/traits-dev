defaults:
  for: [scripts, binaries]
  platforms:
  - windows
  attack: T1003.001
traits:
- id: comsvcs-dump--rx-2
  desc: Embedded comsvcs MiniDump command string
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)\brundll32(\.exe)?\s+[^,\r\n]{0,120}\bcomsvcs(\.dll)?\s*,\s*(MiniDump|MiniDumpW)\b'
  count_max: 1007261
  unless:
  - id: well-known/lib/platform/microsoft-catsrv::microsoft-catsrv-library-context
  - id: well-known/lib/platform/microsoft-catsrv::microsoft-catsrvut-library-context
  - id: well-known/lib/platform/microsoft-clbcatq::microsoft-clbcatq-library-context
- id: comsvcs-ordinal-dump--rx-1
  desc: Embedded comsvcs ordinal dump command
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: '(?i)\brundll32(\.exe)?\s+[^,\r\n]{0,120}\bcomsvcs(\.dll)?\s*,\s*#0*24\b'
  unless:
  - id: well-known/lib/platform/microsoft-catsrv::microsoft-catsrv-library-context
  - id: well-known/lib/platform/microsoft-catsrv::microsoft-catsrvut-library-context
  - id: well-known/lib/platform/microsoft-clbcatq::microsoft-clbcatq-library-context
composite_rules:
- id: comsvcs-dump
  desc: Comsvcs process-dump command marker
  crit: suspicious
  conf: 0.95
  any:
  - id: comsvcs-dump--rx-2
  - id: comsvcs-ordinal-dump--rx-1
  unless:
  - id: well-known/app/system/samba::samba-source-tree
  - id: well-known/lib/platform/wine/
  - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
  - id: well-known/lib/platform/microsoft-com-catalog::microsoft-com-catalog-context
  - id: well-known/lib/platform/microsoft-comsvcs::microsoft-comsvcs-library-context
  - id: well-known/lib/platform/microsoft-clbcatq::microsoft-clbcatq-library-context
