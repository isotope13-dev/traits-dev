defaults:
  platforms: [windows]
  for: [scripts, binaries]
  attack: T1003.001

composite_rules:
  - id: comsvcs-lsass-memory-dump
    desc: LSASS memory dump through comsvcs
    crit: notable
    conf: 0.99
    all:
      - id: micro-behaviors/process/info/name::lsass-target-token
      - id: micro-behaviors/mem/read/dump::comsvcs-dump
    near_bytes: 160
    unless:
      - id: metadata/file/naming::generated-attack-map-context
      - id: well-known/tool/detection/pattern-catalog/
