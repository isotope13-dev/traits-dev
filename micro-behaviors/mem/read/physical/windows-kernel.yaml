defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, rust, go, csharp]

traits:
  - id: physical-memory-copy
    desc: Copy memory through physical address API
    crit: notable
    conf: 0.96
    if:
      type: symbol
      exact: MmCopyMemory
  - id: physical-address-translation
    desc: Resolve physical address from virtual pointer
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: MmGetPhysicalAddress
  - id: page-table-root-reference
    desc: Reference x64 page-table root
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\b(PML4E?|CR3)\b'
    unless:
      - id: metadata/binary/installer/family/
