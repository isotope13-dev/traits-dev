defaults:
  platforms: [windows]
  for: [pe, dll, c, cpp, rust, go, csharp]

traits:
  - id: physical-memory-copy
    desc: Copy memory through physical address API
    crit: notable
    conf: 0.96
    if:
      type: symbol
      exact: MmCopyMemory
  - id: physical-address-translation
    desc: Resolve physical address from virtual pointer
    crit: notable
    conf: 0.95
    if:
      type: symbol
      exact: MmGetPhysicalAddress
  - id: x64-page-table-root-name
    desc: References an x64 PML4 page-table root
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\b(PML4E?|__readcr3|read_cr3)\b'
  - id: x86-cr3-register-access
    desc: Accesses the x86 CR3 page-table register
    crit: notable
    conf: 0.96
    if:
      type: text
      # Bare `CR3` is also a POSIX terminal-delay constant and a PowerPC
      # condition register. Require an x86 register-transfer expression.
      regex: '(?i)\bmov\b.{0,48}\bcr3\b|\bcr3\b.{0,48}\bmov\b'
    unless:
      - id: metadata/binary/installer/family/
  - id: x86-cr3-register-read-opcode
    desc: Reads and page-aligns the x86-64 CR3 register
    crit: notable
    conf: 0.99
    arch: [x86-64]
    for: [pe, dll]
    if:
      type: hex
      section: .text
      pattern: 0F 20 D8 48 25 00 F0 FF FF

composite_rules:
  - id: page-table-root-reference
    desc: Accesses an x64 page-table root
    crit: notable
    conf: 0.94
    any:
      - id: x64-page-table-root-name
      - id: x86-cr3-register-access
      - id: x86-cr3-register-read-opcode
    unless:
      - id: metadata/binary/installer/family/
