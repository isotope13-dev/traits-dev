# Reading another process's memory and synthesizing mouse input after walking
# its module list is the whole mechanic of an external game aimbot, and also
# of debuggers, console emulators, remote-control agents and accessibility
# tools. The combination names no game and no target, so it is a capability.
defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: process-memory-read-with-mouse-synthesis
    desc: Reads process memory and synthesizes mouse input
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/mem/read/cross-process::read-process-memory
      - id: micro-behaviors/hardware/input/mouse::mouse-event
      - id: micro-behaviors/process/enumerate/snapshot::module32-first
