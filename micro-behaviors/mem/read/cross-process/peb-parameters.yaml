defaults:
  platforms: [windows]
  for: [c, cpp, csharp, rust, go, python]


composite_rules:
  - id: remote-peb-process-parameter-read-profile
    desc: PEB parameters with remote-read API references
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/process/inject/memory::peb-base-address-member
      - id: micro-behaviors/process/inject/memory::peb-process-parameters-member
      - id: micro-behaviors/process/control/info::nt-query-information-process-source
      - id: micro-behaviors/mem/read/cross-process::nt-read-virtual-memory-reference
