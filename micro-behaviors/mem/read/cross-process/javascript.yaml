# Cross-process memory read named in JavaScript or TypeScript source.
#
# A Node or Electron module reaches kernel32 through an embedded C# or
# PowerShell payload written to disk at run time, so the API name appears as
# plain script text rather than as an imported symbol.
defaults:
  for: [javascript, typescript]
  platforms: [windows]

traits:
  - id: read-process-memory-text
    desc: ReadProcessMemory named in script text
    crit: notable
    conf: 0.85
    mbc: "C0008"
    if:
      type: text
      word: ReadProcessMemory
