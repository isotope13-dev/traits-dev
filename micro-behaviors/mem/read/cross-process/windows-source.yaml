# Cross-process memory read - Windows native source
defaults:
  for: [c, cpp, rust]
  platforms: [windows]
traits:
  - id: read-process-memory-source
    desc: ReadProcessMemory cross-process read
    crit: notable
    conf: 0.9
    mbc: "C0008"
    if:
      type: symbol
      exact: "ReadProcessMemory"
  # Installers read the PEB command line so they can spare the process that
  # is already performing the upgrade. That is not a memory-signature scan.
  - id: peb-command-line-memory-read
    desc: PEB process command line read
    crit: notable
    conf: 0.93
    for: [c, cpp]
    if:
      type: text
      regex: 'PebBaseAddress[\s\S]{0,500}CommandLine'
  - id: toolhelp-process-vmread-source
    desc: Opens snapshot process with VM_READ
    crit: notable
    conf: 0.94
    for: [c, cpp]
    if:
      type: text
      regex: 'CreateToolhelp32Snapshot\(TH32CS_SNAPPROCESS[\s\S]{0,900}OpenProcess\(PROCESS_VM_READ'
