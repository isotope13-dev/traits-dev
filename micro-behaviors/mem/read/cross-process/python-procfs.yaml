# Bind the proc-memory path variable to its open() context manager, then the
# read handle and the bytes written. This is the mapped-region loop used by
# ordinary memory diagnostics as well as CI-runner dumpers. Names and targets
# are deliberately unconstrained; credential targeting belongs in objectives.
defaults:
  platforms: [unix]
  for: [python]
  crit: notable
  conf: 0.98

traits:
  - id: python-proc-region-read-to-write
    desc: Writes bytes read from a proc-memory region
    if:
      type: tree-sitter
      query: |
        ((_
          (expression_statement
            (assignment left: (identifier) @path right: (string) @memory))
          . (comment)* .
          (with_statement
            (with_clause
              (with_item value: (as_pattern
                (call function: (identifier) @open
                  arguments: (argument_list (identifier) @used))
                alias: (as_pattern_target (identifier) @handle))))
            body: (block
              (for_statement body: (block
                (if_statement consequence: (block
                  (try_statement body: (block
                    (expression_statement
                      (assignment left: (identifier) @bytes
                        right: (call
                          function: (attribute object: (identifier) @reader
                            attribute: (identifier) @read))))
                    . (comment)* .
                    (expression_statement
                      (call function: (attribute) @write
                        arguments: (argument_list (identifier) @output)))))))))))) @dump
          (#eq? @open "open")
          (#eq? @path @used)
          (#match? @memory "^f?[\"']/proc/[^\r\n]{1,80}/mem[\"']$")
          (#eq? @handle @reader)
          (#eq? @read "read")
          (#eq? @bytes @output)
          (#match? @write "\\.write$"))
