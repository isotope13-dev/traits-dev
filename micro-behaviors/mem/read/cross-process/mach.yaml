defaults:
  platforms: [macos, ios]
  for: [c, cpp, objectivec, swift, javascript, python, macho]
  crit: notable
  conf: 0.96
traits:
  - id: mach-task-memory-read
    desc: References Mach task-memory read API
    # Mach accepts a task port, including a remote task. A read API alone
    # establishes neither unauthorized access nor credential collection.
    if:
      type: symbol
      regex: '^(mach_)?vm_read(_overwrite)?$'
