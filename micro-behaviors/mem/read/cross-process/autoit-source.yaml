# AutoIt has no structured source producer; match typed FFI call arguments.
defaults:
  platforms: [windows]
  for: [text, data, vbs]
  crit: notable
  conf: 0.97
traits:
  - id: autoit-read-process-memory-call
    desc: AutoIt typed ReadProcessMemory call
    if:
      type: raw
      regex: '(?i)"bool"[ \t]*,[ \t]*"ReadProcessMemory"[ \t]*,[ \t]*"ptr"'
