defaults:
  platforms: [linux, android]
  for: [elf]
  crit: notable

traits:
  - id: process-vm-readv-import
    desc: Imports Linux cross-process memory read API
    conf: 1.0
    if:
      type: import
      exact: process_vm_readv

  - id: process-vm-readv-source-call
    desc: Calls Linux cross-process memory read API
    conf: 1.0
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      regex: '^(::)?process_vm_readv$'
