defaults:
  platforms: [windows]
  for: [python]
traits:
  - id: read-process-memory-call
    desc: Calls the Windows cross-process memory reader
    crit: notable
    conf: 0.97
    for: [pe, dll, c, cpp, rust, csharp, python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)ReadProcessMemory$'
composite_rules:
  - id: python-lsass-default-reader
    desc: LSASS target accompanies cross-process memory reads
    crit: suspicious
    conf: 0.97
    all:
      - id: metadata/lang/source/syntax/declaration::class-default-lsass-process-name
      - id: read-process-memory-call
