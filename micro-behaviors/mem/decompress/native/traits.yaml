defaults:
  crit: notable
  for:
    - pe
    - dll
  platforms:
    - windows
  attack: T1140
traits:
  - id: rtl-decompress-buffer-source
    desc: Windows RtlDecompressBuffer source call
    conf: 0.93
    for: [c, cpp, csharp, go, rust, python]
    if:
      type: text
      regex: '(?i)\bRtlDecompressBuffer\b'
    unless:
      - id: metadata/build/generated::winmd-metadata

  - id: rtl-decompress-buffer
    desc: RtlDecompressBuffer native decompression
    conf: 0.8
    if:
      type: text
      substr: RtlDecompressBuffer
    unless:
      - id: metadata/build/generated::winmd-metadata
