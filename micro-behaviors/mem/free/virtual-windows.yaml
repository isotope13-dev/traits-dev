defaults:
  for: [pe, dll]
  platforms: [windows]
traits:
  - id: virtual-free-ex
    desc: VirtualFreeEx process-memory release API
    crit: notable
    conf: 0.95
    if:
      type: import
      exact: VirtualFreeEx
    unless:
      - id: well-known/game/mod::bedrockboot-preload-injector-pdb

  - id: virtual-free
    for: [pe, dll, c, cpp, csharp, rust]
    desc: Free virtual memory
    crit: baseline
    conf: 0.9
    if:
      type: import
      exact: VirtualFree
