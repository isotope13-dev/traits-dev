defaults:
  platforms: [unix]
  for: [c, cpp, rust, python]
  crit: notable
  conf: 0.95

traits:
  - id: sysv-shm-remove-source-call
    desc: Marks System V shared memory for removal
    if:
      type: symbol
      kind: call
      regex: '(^|\.|::)shmctl$'
      arg:
        index: 1
        kind: identifier
        name: IPC_RMID
