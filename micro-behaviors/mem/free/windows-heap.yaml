# Windows heap and local-memory release
# API-reference evidence; does not establish invocation or success.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.9
traits:
  - id: heap-free
    desc: Heap memory deallocation
    if:
      type: symbol
      exact: "HeapFree"
  - id: local-free
    desc: Local memory deallocation
    if:
      type: symbol
      exact: "LocalFree"
