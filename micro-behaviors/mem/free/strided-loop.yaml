# Strided deallocation opens holes during ER 11 heap grooming. The capability
# also occurs in ordinary allocators: no exploitation claim or hostile weight.
# Bind the updated index to the freed array element; names/counts are free.
defaults:
  platforms: [windows, linux, macos]
  for: [c, cpp]
traits:
  - id: strided-indexed-heap-free
    desc: Strided loop frees indexed heap allocations
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        (for_statement
          update: (assignment_expression
            left: (identifier) @index
            operator: "+=")
          body: [
            (compound_statement
              (expression_statement
                (call_expression
                  function: (identifier) @release
                  arguments: (argument_list
                    (subscript_expression index: (identifier) @freed_index)))))
            (_ (compound_statement
              (expression_statement
                (call_expression
                  function: (identifier) @release
                  arguments: (argument_list
                    (subscript_expression index: (identifier) @freed_index))))))
            (compound_statement
              (if_statement
                consequence: (compound_statement
                  (expression_statement
                    (call_expression
                      function: (identifier) @release
                      arguments: (argument_list
                        (subscript_expression index: (identifier) @freed_index)))))))
          ]
          (#match? @release "^(HeapFree|free)$")
          (#eq? @index @freed_index)) @deallocation
  - id: range-step-indexed-heap-free
    desc: Range-step loop frees indexed heap allocations
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: tree-sitter
      query: |
        (_
          (expression_statement
            (assignment
              left: (identifier) @allocator
              right: (call
                function: (attribute attribute: (identifier) @loader))))
          (for_statement
            left: (identifier) @index
            right: (call
              function: (identifier) @range
              arguments: (argument_list (_) (_) (_)))
            body: (block
              (expression_statement
                (call
                  function: (attribute
                    object: (identifier) @allocator_use
                    attribute: (identifier) @release)
                  arguments: (argument_list
                    (subscript subscript: (identifier) @freed_index))))))
          (#match? @loader "^(CDLL|WinDLL)$")
          (#eq? @allocator @allocator_use)
          (#eq? @range "range")
          (#match? @release "^(HeapFree|free)$")
          (#eq? @index @freed_index)) @deallocation
