# Windows heap and local-memory resizing
# API-reference evidence; does not establish invocation or success.
defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: baseline
  conf: 0.9
traits:
  - id: heap-realloc
    desc: Heap memory reallocation
    if:
      type: symbol
      exact: "HeapReAlloc"
  - id: local-realloc
    desc: Local memory reallocation
    if:
      type: symbol
      exact: "LocalReAlloc"
