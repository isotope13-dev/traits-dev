defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
  crit: notable
  conf: 0.99
traits:
  - id: x64-write-invalidarg-return
    desc: Writes E_INVALIDARG and RET instruction bytes
    if:
      type: hex
      section: .text
      pattern: 'C7 03 B8 57 00 07 [0-16] 66 C7 43 04 80 C3'
  - id: x64-write-zero-return
    desc: Writes XOR EAX and RET instruction bytes
    if:
      type: hex
      section: .text
      # Both stores put 33 C0 at the destination. The byte store at +2
      # completes the return stub even when the first store is a dword:
      # its upper immediate bytes are overwritten or follow the RET.
      pattern: '(66 C7 03 33 C0 | C7 03 33 C0 ?? ??) [0-16] C6 43 02 C3'
