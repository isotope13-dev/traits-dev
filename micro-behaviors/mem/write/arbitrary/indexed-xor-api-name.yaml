# Recovered from static string-decoder review. This matches an API name,
# not an invocation; the objective consumer supplies the attack context.
defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: indexed-xor-native-write-name
    desc: Index-add/XOR concealed native write name
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule indexed_xor_native_write_name {
          strings:
            $name = "\x5b\x79\x5a\x76\x6e\x7a\x6c\x5e\x72\x7c\x7f\x81\x6e\x7a\x5c\x75\x7e\x81\x85\x8d" xor(0-255)
          condition:
            $name
        }
