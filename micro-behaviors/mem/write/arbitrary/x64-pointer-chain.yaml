defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]

traits:
  # Read *(p + 0x60), then write *(result + 0x10). Compiled Go may
  # interleave substantial code between the two operations. This atom does
  # not identify p as a TEB; the loader composite supplies that context.
  - id: x64-pointer-60-field-10-store
    desc: Writes through offsets 0x60 then 0x10
    crit: notable
    conf: 0.96
    if:
      type: hex
      section: .text
      pattern: '48 83 C0 60 48 8B 00 [0-4096] 48 83 C0 10 48 8B 8C 24 [4] 48 89 08'
