defaults:
  platforms: [windows]
  crit: notable
  conf: 0.95
traits:
  - id: c-pe-base-relocation-directory-loop
    desc: C parses IMAGE_DIRECTORY_ENTRY_BASERELOC blocks
    for: [c, cpp]
    if:
      type: text
      regex: '(?s)IMAGE_DIRECTORY_ENTRY_BASERELOC.{0,600}IMAGE_BASE_RELOCATION'
composite_rules:
  - id: c-pe-import-descriptor-manual-resolve
    desc: C manually resolves IMAGE_IMPORT_DESCRIPTOR IAT
    for: [c, cpp]
    all:
      - id: micro-behaviors/process/hook/interception::pe-import-directory-source
      - id: micro-behaviors/data/format/executable/header::pe-first-thunk-member-access
      - id: micro-behaviors/dylib/lookup::get-proc-address-source-call
  - id: c-sec-image-carrier-flush-icache
    desc: C flushes instruction cache on SEC_IMAGE view
    for: [c, cpp]
    all:
      - id: micro-behaviors/mem/map::sec-image-mapping-flag
      - id: micro-behaviors/mem/sync/cache::flush-instruction-cache-source
  - id: image-creation-and-mapped-pe-copy-source
    desc: Image creation with mapped PE copying
    for: [c, cpp]
    all:
      - id: micro-behaviors/mem/map::sec-image-creation-source
      - id: micro-behaviors/process/deploy/image-map::mapped-pe-raw-section-copy-source
  - id: image-view-pe-section-copy-x64
    desc: Image mapping setup with PE section copying
    for: [pe, dll]
    arch: [x86-64]
    all:
      - id: micro-behaviors/mem/map::map-view-of-file
      - id: micro-behaviors/mem/protect/modify/unspecified::virtual-protect-import
      - id: micro-behaviors/process/deploy/image-map::image-section-copy-code-x64
  - id: image-creation-and-mapped-pe-copy-python
    desc: Image creation with mapped PE copying
    for: [python]
    all:
      - id: micro-behaviors/mem/map::sec-image-creation-source
      - id: micro-behaviors/process/deploy/image-map::mapped-pe-raw-section-copy-python
