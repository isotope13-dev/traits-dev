defaults:
  for: [dos_com, data]
  platforms: [windows, unix]
  size_max: 65536
traits:
  - id: dos-three-byte-entry-copy-and-jump
    desc: Copies COM entry bytes and resumes execution
    crit: notable
    conf: 0.99
    if:
      type: hex
      pattern: 'B9 03 00 33 ED BF 00 01 8A 82 ?? ?? 45 AA E2 F8 BF 00 01 FF E7'
