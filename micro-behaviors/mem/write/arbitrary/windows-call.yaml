defaults:
  platforms: [windows]
  for: [pe, dll]
  crit: notable
traits:
  # WriteProcessMemory wraps the ntdll NtWriteVirtualMemory service; callers
  # that bypass kernel32 invoke the Nt/Zw name directly.
  - id: process-memory-write-call
    desc: Calls a process-memory write API
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(WriteProcessMemory|(Nt|Zw)WriteVirtualMemory)$'
