defaults:
  platforms: [windows]
  for: [pe, dll]
composite_rules:
  - id: process-inject-api-source
    desc: Remote process injection API references in source
    crit: notable
    conf: 0.72
    for:
      - c
      - cpp
      - csharp
      - rust
    needs: 3
    any:
      - id: micro-behaviors/process/inject/remote-thread::create-remote-thread-source
      - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
      - id: micro-behaviors/mem/alloc/virtual::virtual-alloc-ex-source
      - id: micro-behaviors/process/inject/runtime/call::ntdll-write-memory-api-references
