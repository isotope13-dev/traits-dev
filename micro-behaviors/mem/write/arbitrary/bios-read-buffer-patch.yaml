defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]

traits:
  - id: embedded-bios-buffer-far-call-patch
    desc: Embedded buffer patch with relocated far call
    crit: notable
    conf: 0.98
    if:
      type: hex
      section: .data
      # Write operand-size-prefixed CALL FAR, construct its linear target
      # from CS<<4 plus a payload offset, and set the code selector.
      pattern: '26 C7 05 66 9A 66 33 C0 8C C8 66 C1 E0 04 66 05 ?? ?? ?? ?? 66 26 89 45 02 26 C7 45 06 ?? ??'
