# Encoded API reference; no invocation or import-concealment claim.
defaults:
  platforms: [windows, linux, macos]
  for: [pe, elf, macho, static-lib]
  crit: notable
  conf: 0.95
traits:
  - id: xor-writeprocessmemory-name-prefix
    desc: XOR-masked WriteProcessMemory name prefix
    if:
      type: yara
      source: |
        rule xor_remote_memory_write_name {
          strings:
            $name = "WriteProcessMemo" xor(1-255)
          condition:
            $name
        }
