# AutoIt has no structured source producer; match typed FFI call arguments.
defaults:
  platforms: [windows]
  for: [text, data, vbs]
  crit: notable
  conf: 0.97
traits:
  - id: autoit-write-process-memory-call
    desc: AutoIt typed WriteProcessMemory call
    if:
      type: raw
      regex: '(?i)"bool"[ \t]*,[ \t]*"WriteProcessMemory"[ \t]*,[ \t]*"handle"'
