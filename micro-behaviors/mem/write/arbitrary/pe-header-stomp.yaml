# Bind the header length, fresh overwrite array and foreign-memory view.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: javascript-native-header-buffer-overwrite
    desc: Overwrites native memory for PE header length
    crit: suspicious
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((method_definition body: (statement_block
          (lexical_declaration (variable_declarator name: (identifier) @len
            value: (member_expression property: (property_identifier) @headers)))
          (lexical_declaration (variable_declarator name: (identifier) @buffer
            value: (new_expression constructor: (identifier) @array
              arguments: (arguments . (identifier) @buffer_length .))))
          (expression_statement (call_expression function: (member_expression
            object: (new_expression constructor: (identifier) @view_array
              arguments: (arguments . (call_expression function: (member_expression
                property: (property_identifier) @view)
                arguments: (arguments . (_) . (identifier) @view_length .)) .))
            property: (property_identifier) @set)
            arguments: (arguments . (identifier) @written .)))))
          (#eq? @headers "sizeOfHeaders") (#eq? @len @buffer_length)
          (#eq? @len @view_length) (#eq? @buffer @written)
          (#eq? @array "Uint8Array") (#eq? @view_array "Uint8Array")
          (#eq? @view "view") (#eq? @set "set"))
