# API observations retain their original scope and exclusions.
defaults:
  platforms:
  - windows
  crit: notable
traits:
- for:
  - pe
  - dll
  id: write-memory-sym--ntwritevirtualmemory
  desc: References the NtWriteVirtualMemory API
  if:
    type: symbol
    exact: NtWriteVirtualMemory
- for:
  - pe
  - dll
  - class
  id: write-process-memory-binary
  desc: WriteProcessMemory API reference
  conf: 0.95
  attack: T1055
  mbc: C0032
  if:
    type: import
    exact: WriteProcessMemory
  unless:
  - id: well-known/game/mod::bedrockboot-preload-injector-pdb
  downgrade:
    any:
    - id: metadata/binary/symbols/plugin::ollydbg-plugin-export
    - id: metadata/lang/compiled/
- for:
  - rust
  id: write-process-memory-rust-text
  desc: Rust source WriteProcessMemory API reference
  conf: 0.9
  attack: T1055
  mbc: C0032
  if:
    type: text
    word: WriteProcessMemory
  unless:
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
- for:
  - powershell
  - batch
  - vbs
  - javascript
  id: write-process-memory-script
  desc: WriteProcessMemory API reference in script
  conf: 0.95
  attack: T1055
  mbc: C0032
  if:
    type: symbol
    exact: WriteProcessMemory
  unless:
  - id: metadata/package/testing/
  - id: metadata/file/naming::test-directory-component
- for:
  - pe
  - dll
  id: serialized-writeprocessmemory-name
  desc: Serialized Python WriteProcessMemory name
  conf: 0.95
  if:
    type: text
    exact: aWriteProcessMemory
composite_rules:
- for:
  - binaries
  - source
  - scripts
  id: write-process-memory-dup
  desc: WriteProcessMemory API reference
  conf: 0.95
  attack: T1055
  mbc: C0032
  any:
  - id: micro-behaviors/mem/write/arbitrary::serialized-writeprocessmemory-name
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-binary
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-source
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-rust-text
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-script
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-text
