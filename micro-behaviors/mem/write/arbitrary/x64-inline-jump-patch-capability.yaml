defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
composite_rules:
  - id: x64-inline-jump-patch-capability
    desc: x64 binary writes inline jump trampolines
    crit: notable
    conf: 0.95
    for: [pe, dll]
    arch: [x86-64]
    all:
      - id: micro-behaviors/mem/protect/modify/api-reference::virtual-protect-ex
      - id: micro-behaviors/mem/sync/cache::flush-instruction-cache
    any:
      - id: micro-behaviors/mem/write/arbitrary::x64-relative-jump-patch-writer
      - id: micro-behaviors/mem/write/arbitrary::x64-indirect-jump-patch-writer
