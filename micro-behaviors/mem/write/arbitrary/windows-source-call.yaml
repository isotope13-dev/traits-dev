defaults:
  platforms: [windows]
  for: [pe, dll]

traits:
- id: write-process-memory-source
  desc: WriteProcessMemory API reference in source
  crit: notable
  conf: 0.95
  mbc: C0032
  for: [c, cpp, csharp, python, rust]
  if:
    type: symbol
    kind: call
    regex: '(^|\.)WriteProcessMemory$'
  unless:
  - id: well-known/tool/development/debug/debugpy
  downgrade:
    any:
    - type: basename
      regex: '(?i)(debugpy|pydevd|inject_dll\.cpp)'
    - type: text
      regex: debugpy
    - type: text
      regex: pydevd_attach_to_process
    - type: text
      regex: pydevd
