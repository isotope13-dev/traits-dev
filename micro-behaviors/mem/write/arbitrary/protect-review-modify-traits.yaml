defaults:
  for:
    - pe
    - dll
    - c
    - cpp
    - csharp
    - rust
  platforms:
    - windows
traits:
  - id: x64-relative-jump-patch-writer
    desc: Writes an x64 relative JMP patch
    crit: notable
    conf: 0.95
    for: [pe, dll]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: 'C6 01 E9 ?? ?? ?? ?? 89 51'
  - id: x64-indirect-jump-patch-writer
    desc: Writes an x64 indirect JMP patch
    crit: notable
    conf: 0.95
    for: [pe, dll]
    arch: [x86-64]
    if:
      type: hex
      section: .text
      pattern: '66 C7 01 FF 25 ?? ?? ?? ?? 48 89 51'

