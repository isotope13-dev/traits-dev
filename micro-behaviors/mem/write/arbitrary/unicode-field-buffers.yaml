defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]
traits:
  - id: x64-field-60-70-buffer-pointer-stores
    desc: Replaces buffers at offsets 0x60 and 0x70
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        import "pe"
        rule x64_field_60_70_buffer_pointer_stores {
          strings:
            $field60 = { 48 8D 72 60 48 89 B4 24 ?? ?? ?? ?? }
            $field70 = { 48 83 C2 70 48 89 94 24 ?? ?? ?? ?? }
            $store = { 48 8B B4 24 ?? ?? ?? ?? 48 89 56 08 }
          condition:
            pe.is_64bit() and all of them and
            for any a in (1..#field60) : (
              pe.sections[pe.section_index(@field60[a])].characteristics & pe.SECTION_MEM_EXECUTE != 0 and
              for any b in (1..#store) : (
                @store[b] > @field60[a] and @store[b] - @field60[a] <= 4096 and
                uint32(@field60[a]+8) == uint32(@store[b]+4) and
                for any c in (1..#field70) : (
                  @field70[c] > @store[b] and @field70[c] - @field60[a] <= 16384 and
                  uint32(@field60[a]+8) == uint32(@field70[c]+8) and
                  for any d in (1..#store) : (
                    @store[d] > @field70[c] and @store[d] - @field70[c] <= 4096 and
                    uint32(@field70[c]+8) == uint32(@store[d]+4) and
                    pe.section_index(@field60[a]) == pe.section_index(@store[d])
                  )
                )
              )
            )
        }
