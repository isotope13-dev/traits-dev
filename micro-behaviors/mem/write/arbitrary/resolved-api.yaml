defaults:
  platforms: [windows]
traits:
- id: write-process-memory-text
  desc: WriteProcessMemory named, not imported
  crit: notable
  conf: 0.9
  # Go reaches the API by name through syscall.MustFindProc("WriteProcessMemory"),
  # so the call site is a string literal rather than an import.
  for: [pe, dll, go, powershell, batch, vbs, javascript, xml, class]
  if:
    type: text
    word: WriteProcessMemory
  not:
    # Security reviews cite the API in backtick-quoted threat-model prose,
    # not as a runtime import or call site.
    - regex: '`WriteProcessMemory`'
  unless:
  # The symbol records the API being used; this also sees the name sitting in
  # data. Standing down there keeps one use from counting twice.
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-script
  # The symbol records the API being used; this also sees the name sitting in
  # data. Standing down there keeps one use from counting twice.
  - id: micro-behaviors/process/inject/runtime/call::write-process-memory-binary
  - id: well-known/game/mod::bedrockboot-preload-injector-pdb
