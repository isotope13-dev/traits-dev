defaults:
  for: [pe, dll, c, cpp]
  platforms: [windows]
composite_rules:
- id: rwx-process-write-resource-input-apis
  for:
  - pe
  desc: RWX, process-write, resource and input API clues
  crit: suspicious
  conf: 0.94
  all:
  - id: micro-behaviors/mem/combined::rwx-flag-or-argument-patterns
  - id: micro-behaviors/mem/write/arbitrary::write-process-memory-dup
  - id: micro-behaviors/data/embedded/payload/resource::native-resource-api-resolution
  any:
  - id: micro-behaviors/os/handler/open::win-shellexecute
  - id: micro-behaviors/hardware/input/keyboard/poll::get-async-key-state-str
  needs: 2
