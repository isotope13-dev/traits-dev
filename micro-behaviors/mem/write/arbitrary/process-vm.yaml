defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: process-vm-writev-source-reference
    desc: Source references process_vm_writev API
    crit: notable
    conf: 0.86
    for: [c, cpp, rust, go]
    if:
      type: symbol
      exact: process_vm_writev
    unless:
      # pwntools ships syscall tables and shellcraft templates as reference data.
      - id: well-known/tool/offensive/pwntools::pwntools-distribution
      - id: well-known/lib/native/hpc
      - id: well-known/app/utility/sudo::source-tree
      # nix/libc/rustix exist to expose the syscall to Rust callers, so the
      # binding crate always contains the symbol — declaring it is not
      # injecting. Same carve-out the sys-memfd-create-source sibling uses.
      - id: well-known/lib/platform/rust-system-bindings::rust-syscall-binding-crate
      - type: text
        substr: getpid()
      - id: metadata/file/format/markup::roff-document
      # Zig ships musl and mingw-w64 under lib/zig/libc/ and its own std
      # library under lib/zig/std/: the tree that *defines* these APIs, not
      # one that calls them.
      - id: well-known/lib/development/zig-stdlib/
  - id: process-vm-writev-symbol-reference
    desc: References process_vm_writev remote-memory API
    crit: notable
    conf: 0.85
    size_max: 2097152
    if:
      type: symbol
      regex: process_vm_writev
    unless:
      - id: micro-behaviors/dylib/library/libc/
      - id: micro-behaviors/dylib/library/family/
      - id: metadata/file/format/markup::roff-document
