defaults:
  platforms: [windows]
  for: [c, cpp]
traits:
  - id: protected-pointer-replacement
    desc: Replaces pointer after VirtualProtect succeeds
    crit: notable
    conf: 0.97
    if:
      type: tree-sitter
      query: |
        ((if_statement
          condition: (parenthesized_expression
            (call_expression
              function: (identifier) @protect
              arguments: (argument_list (identifier) @slot)))
          consequence: (compound_statement
            (expression_statement
              (assignment_expression
                left: (pointer_expression argument: (identifier) @target)
                right: (_) @replacement)))) @statement
          (#eq? @protect "VirtualProtect")
          (#eq? @slot @target))
