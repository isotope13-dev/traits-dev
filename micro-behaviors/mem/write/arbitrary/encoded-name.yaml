defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: base64-write-process-memory-name
    desc: Base64 WriteProcessMemory API name
    crit: notable
    conf: 0.96
    if:
      # This unpadded spelling is also valid Base58. The generic decoder
      # selects Base58 and misses the API name; match its Base64 bytes here.
      type: text
      exact: V3JpdGVQcm9jZXNzTWVtb3J5
