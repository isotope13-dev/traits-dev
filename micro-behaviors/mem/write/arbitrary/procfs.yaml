# Proximity does not bind the write descriptor to the procfs open.
defaults:
  platforms: [unix]
  for: [c, cpp]

traits:
  - id: proc-pid-mem-write-api-source
    platforms: [linux]
    desc: pwrite call containing procfs path prefix
    crit: notable
    conf: 0.86
    for: [c, cpp, rust, go]
    if:
      type: text
      regex: 'pwrite\s*\([^;\n]{0,120}/proc/%'
    unless:
      - id: metadata/file/profile/source-indications/

composite_rules:
  - id: proc-mem-rdwr-write-references
    desc: Procfs read-write memory path near write
    crit: suspicious
    conf: 0.96
    near_bytes: 512
    all:
      - id: micro-behaviors/fs/proc/memory::proc-pid-mem-rdwr-open
      - id: micro-behaviors/fs/write/file/handle::native-write-file-call

  - id: proc-pid-mem-write-source
    platforms: [linux]
    desc: Procfs memory format with pwrite references
    crit: suspicious
    conf: 0.9
    for: [c, cpp, rust, go]
    all:
      - id: micro-behaviors/fs/proc/memory::process-pid-mem-format
      - type: trait
        id: proc-pid-mem-write-api-source
    unless:
      - id: metadata/file/profile/source-indications/
