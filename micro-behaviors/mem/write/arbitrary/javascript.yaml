# JavaScript source patterns that construct native-address and arbitrary-memory
# primitives. These are memory-access capabilities; browser exploit intent is
# inferred only when an objective composite assembles the complete primitive.
defaults:
  platforms: [windows, unix, android]
  for: [javascript, typescript, html]

traits:
  - id: js-native-memory-write64-helper
    desc: Word write after backing-pointer redirection
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\b(write64|cageWrite)\(\w+, \w+\) \{ \w+\[\d+\] = \w+\(\w+\); \w+\[0\] = \w+;'

  - id: js-memory-write-pointer-helper
    desc: Defines writePointer helper
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '\bfunction\s+writePointer\s*\(\s*(addr|address|ptr|target|offset|dest|pointer)\s*,'
    unless:
      - id: metadata/package/testing/
      - id: "metadata/file/naming::test-directory-component"

  - id: js-jit-bce-integer-overflow-write
    desc: JIT BCE integer overflow array write
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '(?i)\(\w+\s*\+\s*(0x7fffffff|0x80000000|214748364[78])\)\s*\|\s*0[\s\S]{1,120}\[\w+\]\s*='

  - id: js-signed-range-bce-array-write
    desc: Signed-range calculation feeds array write
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\w+\s*\*=\s*2\s*\*\*\s*30[\s\S]{1,400}\w+\[\w+\]\s*='
