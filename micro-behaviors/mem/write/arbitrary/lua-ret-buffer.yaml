defaults:
  platforms: [windows]
  for: [lua]
  crit: notable
  conf: 0.98
traits:
  - id: lua-nt-write-ret-buffer
    desc: Lua native memory write uses RET-prefixed buffer
    if:
      type: tree-sitter
      query: |
        ((block
          (variable_declaration (assignment_statement
            (variable_list . (identifier) @buffer .)
            (expression_list . (function_call name: (dot_index_expression field: (identifier) @new)) .)))
          . (assignment_statement
            (variable_list . (bracket_index_expression table: (identifier) @stored field: (number) @index) .)
            (expression_list . (number) @ret .))
          (assignment_statement (expression_list . (function_call
            name: (dot_index_expression field: (identifier) @writer)
            arguments: (arguments . (_) . (_) . (identifier) @written . (_) . (_) .)) @evidence .)))
          (#eq? @new "new") (#eq? @index "0") (#eq? @ret "195")
          (#eq? @writer "NtWriteVirtualMemory")
          (#eq? @buffer @stored) (#eq? @buffer @written))

composite_rules:
  - id: lua-return-instruction-write
    desc: Lua writes return-instruction machine code
    any:
      - id: lua-cast-pointer-zero-return-stores
      - id: lua-nt-write-ret-buffer
