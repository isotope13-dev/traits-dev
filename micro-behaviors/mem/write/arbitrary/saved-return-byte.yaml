defaults:
  platforms: [windows]
  for: [pe, dll]
  arch: [x86-64]
traits:
  - id: x64-save-byte-overwrite-ret
    desc: x64 saves original byte then writes RET
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      pattern: '0F B6 03 BA 01 00 00 00 88 47 08 48 8B CB C6 03 C3 44 8B 44 24 ??'
