defaults:
  platforms: [linux]
  for: [c, cpp, rust, go]
  crit: suspicious
composite_rules:
  # Authentication targeting and ptrace writes do not prove credential capture
  # or execution transfer. Debugging and instrumentation remain plausible.
  - id: authentication-daemon-ptrace-write-attempt
    desc: Targets auth daemon with ptrace memory writes
    conf: 0.995
    all:
      - id: micro-behaviors/fs/proc/info/path::auth-daemon-proc-comm-references
      - id: micro-behaviors/fs/proc/memory::process-variable-pid-maps
      - id: micro-behaviors/process/attach/debugger::ptrace-attach-constant
      - id: micro-behaviors/mem/write/arbitrary::ptrace-poke-source-call

