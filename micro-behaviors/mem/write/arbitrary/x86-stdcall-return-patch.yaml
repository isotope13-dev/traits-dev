defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86]
  crit: notable
  conf: 0.99
traits:
  # Two immediate stores reconstruct MOV EAX,80070057h; RET 18h.
  # Match the same destination register in both stores.
  - id: x86-write-invalidarg-stdcall-return
    desc: Writes E_INVALIDARG and stdcall return bytes
    if:
      type: hex
      section: .text
      pattern: '(C7 03 B8 57 00 07 C7 43 04 80 C2 18 00 | C7 06 B8 57 00 07 C7 46 04 80 C2 18 00 | C7 07 B8 57 00 07 C7 47 04 80 C2 18 00)'
  # The low four bytes are XOR EAX,EAX; RET 14h (high byte zero
  # is written separately). This atom asserts the store, not its target.
  - id: x86-write-zero-stdcall-return
    desc: Writes zero-result stdcall return bytes
    if:
      type: hex
      section: .text
      pattern: 'C7 (00|01|02|03|06|07) 31 C0 C2 14'
composite_rules:
  - id: x86-security-return-patch-pair
    desc: Nearby error and zero-result stdcall patch writes
    near_bytes: 256
    all:
      - id: x86-write-invalidarg-stdcall-return
      - id: x86-write-zero-stdcall-return
