defaults:
  for: [lua]
  platforms: [windows, unix]
  crit: notable
  conf: 0.98
traits:
  - id: lua-cast-pointer-zero-return-stores
    desc: Lua pointer receives x86 zero-return bytes
    if:
      type: tree-sitter
      language: lua
      query: |
        (_
          (variable_declaration
            (assignment_statement
              (variable_list name: (identifier) @pointer)
              (expression_list value: (function_call
                name: (dot_index_expression field: (identifier) @cast)
                arguments: (arguments (string) @ctype)))))
          (assignment_statement
            (variable_list name: (bracket_index_expression
              table: (identifier) @p0 field: (number) @i0))
            (expression_list value: (number) @v0))
          . (assignment_statement
            (variable_list name: (bracket_index_expression
              table: (identifier) @p1 field: (number) @i1))
            (expression_list value: (number) @v1))
          . (assignment_statement
            (variable_list name: (bracket_index_expression
              table: (identifier) @p2 field: (number) @i2))
            (expression_list value: (number) @v2))
          (#eq? @cast "cast")
          (#match? @ctype "(\\*|\\\\0?42|\\\\x2[aA])")
          (#eq? @pointer @p0) (#eq? @p0 @p1) (#eq? @p1 @p2)
          (#eq? @i0 "0") (#eq? @i1 "1") (#eq? @i2 "2")
          (#eq? @v0 "49") (#eq? @v1 "192") (#eq? @v2 "195"))

  - id: lua-nt-write-memory-name-argument
    desc: Lua passes native memory-write API name
    platforms: [windows]
    if:
      type: symbol
      kind: call
      regex: '.'
      arg:
        kind: string
        exact: NtWriteVirtualMemory
