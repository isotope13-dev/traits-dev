defaults:
  platforms: [windows]
  for: [python]

composite_rules:
  - id: python-remote-memory-allocation-write
    desc: Python references remote allocation and memory writing
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/mem/protect/modify::virtual-alloc-ex-python-source
      - id: micro-behaviors/process/inject/runtime/call::write-process-memory-source
    unless:
      - id: well-known/tool/development/debug/debugpy::source-path-marker
      - id: well-known/lib/platform/pywinauto::pywinauto-windows-gui-automation
      - id: well-known/lib/platform/pywinauto::remote-memory-block-context
      - id: well-known/lib/platform/pythonforwindows::process-api-module
      # Pymem's own modules expose its documented remote-memory read/write
      # API; trojanized forks still trip the packed-payload dropper traits.
      - id: well-known/lib/platform/pymem::remote-memory-api-context
