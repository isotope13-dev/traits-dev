defaults:
  platforms:
  - windows
  for:
  - pe
  - dll
  arch:
  - x86-64
  - x86
# The immediate contains x64 instructions even when an x86 WoW64
# process writes them. Keep the historical ID for existing consumers.
traits:
- id: x64-store-zero-return-stub
  desc: Stores x86 or x64 return-zero bytes
  crit: notable
  conf: 0.98
  if:
    type: hex
    pattern: C7 (00|01|02|03|06|07) (48 33 C0 C3 | 33 C0 C3 ??)
    section: any
