# C Runtime Memory Operations
# Standard C library memory management
defaults:
  for: ["pe", "dll"]
  platforms: ["windows"]
traits:
  # === Dynamic Allocation ===
  - id: malloc
    desc: Allocate memory (C runtime)
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "malloc"
  - id: calloc
    desc: Allocate zeroed memory
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "calloc"
