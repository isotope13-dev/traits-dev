# Native memory operations reached through Python's ctypes bridge.
defaults:
  platforms: [windows]
  for: [python]

traits:
  - id: python-ctypes-memmove
    desc: ctypes copies bytes to native memory
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: ctypes.memmove

  - id: text-python-ctypes-memmove-call
    desc: Text-carried Python ctypes memmove call
    crit: notable
    conf: 0.92
    for: [text]
    if:
      type: text
      regex: '(?m)\bctypes\.memmove\s*\('
