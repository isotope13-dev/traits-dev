defaults:
  platforms: [windows]
  for: [powershell]

traits:
  - id: marshal-copy
    desc: Copies between managed and unmanaged memory
    crit: notable
    conf: 0.9
    if:
      type: text
      word: Marshal.Copy

  - id: marshal-copy-powershell
    desc: PowerShell copies bytes into unmanaged memory
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\[\s*(System\.)?Runtime\.InteropServices\.Marshal\s*\]\s*::\s*Copy\s*\('

  # MoveMemory / RtlMoveMemory by name. Neutral for the same reason as the
  # VirtualProtect atoms in micro-behaviors/mem/protect/modify/powershell.yaml:
  # naming the API is a capability observation, and the AMSI-patch reading
  # comes from the composite that pairs it with amsi.dll and the scan-buffer
  # symbol. Previously `movememory-word` under
  # objectives/evasion/anti-av/platform/defender at `crit: suspicious`.
  - id: powershell-movememory-name
    desc: PowerShell references MoveMemory
    crit: notable
    conf: 0.8
    if:
      type: text
      word: MoveMemory

  - id: powershell-movememory-name-encoded
    desc: MoveMemory named in an encoded blob
    crit: notable
    conf: 0.92
    if:
      type: encoded
      word: MoveMemory

  - id: marshal-copy-encoded
    desc: Encoded Marshal.Copy memory operation
    crit: suspicious
    conf: 0.92
    if:
      type: encoded
      word: Marshal.Copy

  # The Marshal type bound to a variable, then invoked as `$var::Copy(...)`.
  # Neither `marshal-copy` (needs the dotted `Marshal.Copy` spelling) nor
  # `marshal-copy-powershell` (needs the bracketed type literal at the call
  # site) sees this split form, which memory patchers use to keep the type name
  # away from the call.  Matched as a pair so the `$var::Copy(` half never
  # counts on its own — any type can be reached that way.
  - id: marshal-type-variable-binding
    desc: Marshal type bound to a variable
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)\$\w+\s*=\s*\[\s*(System\.)?Runtime\.InteropServices\.Marshal\s*\]'

  - id: type-variable-copy-call
    desc: Static Copy call via a type variable
    crit: component
    conf: 0.85
    if:
      type: text
      regex: '\$\w+\s*::\s*Copy\s*\('

composite_rules:
  - id: marshal-copy-via-type-variable
    desc: Marshal.Copy through a type variable
    crit: notable
    conf: 0.95
    all:
      - id: marshal-type-variable-binding
      - id: type-variable-copy-call
