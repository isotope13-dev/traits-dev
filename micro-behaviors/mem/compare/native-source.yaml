defaults:
  platforms: [unix, windows]
  for: [c, cpp]
  crit: notable
  conf: 0.9

traits:
  - id: native-buffer-cmp-call
    desc: Calls native buffer or string comparison API
    if:
      type: symbol
      kind: call
      regex: '^(memcmp|bcmp|strcmp|strncmp|strcasecmp|strncasecmp|wcscmp|wcsncmp)$'
