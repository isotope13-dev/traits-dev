defaults:
  platforms: [windows, unix]
  for: [java]

traits:
  - id: java-array-byte-constant-check
    desc: Compares array element to byte constant
    crit: baseline
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '\b[A-Za-z_$][\w$]*\s*\[\s*[A-Za-z_$][\w$]*\s*\]\s*!=\s*\(\s*byte\s*\)\s*0x[0-9a-fA-F]+'
