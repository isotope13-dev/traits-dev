# C Runtime Memory Operations
# Standard C library memory management
defaults:
  for: ["pe", "dll"]
  platforms: ["windows"]
traits:
  - id: memcmp
    desc: Memory compare
    crit: baseline
    conf: 0.90
    for: ["pe", "dll", "elf", "macho", "c", "cpp"]
    platforms: ["windows", "linux", "macos"]
    if:
      type: symbol
      exact: "memcmp"
