defaults:
  platforms: [windows]
  for: [pyc]

traits:
  - id: pyc-rtlmovememory-name
    desc: Bytecode references RtlMoveMemory name
    crit: notable
    conf: 0.92
    if:
      type: text
      exact: RtlMoveMemory
  - id: pyc-memmove-reference
    crit: notable
    desc: Python bytecode references native memmove
    conf: 0.98
    if:
      type: text
      word: memmove
