defaults:
  platforms: [windows, linux, macos]
traits:
  - id: native-memcpy-byte-copy
    desc: Copies bytes with native memcpy
    crit: notable
    conf: 0.85
    for: [c, cpp]
    if:
      type: symbol
      kind: call
      exact: memcpy

  - id: native-memcpy-import
    desc: Imports native memory copy routine
    crit: baseline
    conf: 0.9
    for: [elf, macho, pe]
    if:
      type: import
      regex: '^_?memcpy$'

composite_rules:
  - id: native-memory-copy
    desc: Native memory copy operation
    crit: baseline
    conf: 0.9
    for: [c, cpp, elf, macho, pe]
    any:
      - id: native-memcpy-byte-copy
      - id: native-memcpy-import
      - id: "micro-behaviors/mem/copy::memcpy"
