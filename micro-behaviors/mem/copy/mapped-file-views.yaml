defaults:
  platforms: [windows]
  for: [c, cpp]
  crit: notable
  conf: 0.98

traits:
  - id: mapped-file-view-copy
    desc: Copies bytes between mapped file views
    if:
      type: symbol
      kind: call
      regex: '^(memcpy|memmove)$'
      args:
        - index: 0
          from:
            call: '^MapViewOfFile$'
        - index: 1
          from:
            call: '^MapViewOfFile$'
  - id: mapped-file-view-flush
    desc: Flushes a mapped file view
    if:
      type: symbol
      kind: call
      exact: FlushViewOfFile
      arg:
        index: 0
        from:
          call: '^MapViewOfFile$'
