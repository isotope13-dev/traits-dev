defaults:
  platforms: [windows]
  for: [pe]
  arch: [x86-64]

traits:
  - id: x64-module-code-backward-copy
    desc: Copies bytes into PE code memory
    crit: notable
    conf: 0.99
    if:
      type: hex
      section: .text
      # RDX is a loaded module, RAX its e_lfanew. Derive the destination
      # from OptionalHeader.BaseOfCode (NT+0x2c), call the resolved protection
      # function, then copy the source backwards into the destination.
      # Wildcard the configuration address, stack slot, and saved local.
      pattern: '48 63 40 3C 48 03 D9 44 8B 05 [4] 8B 71 08 8B 7C 10 2C 44 8B 61 04 48 03 FA 48 8B CF 44 89 AD [4] 8B D6 4C 8D 3C 33 FF 54 24 ?? 4C 8D 04 37 49 8B CF 4C 3B FB 76 ?? 0F B6 41 FF 4D 8D 40 FF 48 FF C9 41 88 00 48 3B CB 77 ??'
