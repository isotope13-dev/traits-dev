defaults:
  platforms:
    - macos
  for:
    - macho
  size_min: 16384
  size_max: 3145728
traits:
  - id: memcpy-symbol-macho
    # Local Mach-O-scoped copy of
    # micro-behaviors/mem/copy/c-runtime::{memcpy,memset}, which are for:
    # [pe, dll] only and so can never match this family's Mach-O payload.
    desc: Memory copy operation
    crit: baseline
    conf: 0.9
    if:
      type: symbol
      exact: memcpy
