# Native memory operations reached through Python's ctypes bridge.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [python]

traits:
  - id: python-ctypes-memmove
    desc: ctypes copies bytes to native memory
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: ctypes.memmove

  - id: text-python-ctypes-memmove-call
    desc: Text-carried Python ctypes memmove call
    conf: 0.92
    for: [text]
    if:
      type: text
      regex: '(?m)\bctypes\.memmove\s*\('

  - id: png-python-ctypes-memmove-call
    desc: Python PNG source copies native bytes
    crit: notable
    conf: 0.96
    for: [png]
    platforms: [windows]
    if:
      type: text
      regex: '(?m)^\s*ctypes\.memmove\s*\([^,\n]{1,40},\s*sc_bytes\s*,'
