defaults:
  for: [oledoc, ooxml, vbs]
  platforms: [windows]
  crit: notable
  conf: 0.92

traits:
  - id: vba-declare-memcopy-primitive
    desc: VBA Declare imports a memory-copy primitive
    crit: suspicious
    if:
      type: import
      regex: '^(Rtl)?(Move|Copy)Memory$'
    unless:
      # xlwings copies strings and byte arrays with MoveMemory / CopyMemory.
      - id: metadata/document/office/macro::xlwings-package-path

  # --- Thread / control-flow handover ---
