defaults:
  platforms: [windows]
traits:
- id: source-memcpy-shellcode-or-rwx-context
  desc: Memcpy name beside shellcode or RWX flag
  crit: notable
  conf: 0.9
  for: [c, cpp]
  if:
    type: text
    regex: '(?is)\bshellcode\b.{0,120}\bmemcpy\b|\bPAGE_EXECUTE_READWRITE\b[\s\S]{0,120}\bmemcpy\b'
