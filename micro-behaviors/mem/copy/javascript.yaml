defaults:
  platforms: [windows]
  for: [javascript, typescript]
traits:
  - id: javascript-rtlmovememory-reference
    desc: JavaScript literal references RtlMoveMemory
    crit: notable
    conf: 0.96
    if:
      type: literal
      word: RtlMoveMemory

  - id: javascript-copy-target-from-virtualalloc
    desc: Memory copy writes to a VirtualAlloc result
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^(RtlMoveMemory|RtlCopy|memcpy)$'
      arg:
        index: 0
        from:
          call: '^VirtualAlloc$'
