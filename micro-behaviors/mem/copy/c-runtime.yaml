# C Runtime Memory Operations
# Standard C library memory management
defaults:
  for: ["pe", "dll"]
  platforms: ["windows"]
traits:
      # === Memory Operations ===
  - id: memcpy
    desc: Memory copy operation
    crit: baseline
    conf: 0.90
    if:
      type: symbol
      exact: "memcpy"
  - id: memmove
    desc: Memory move with overlap
    crit: baseline
    conf: 0.90
    for: ["pe", "dll", "elf", "macho", "c", "cpp"]
    platforms: ["windows", "linux", "macos"]
    if:
      type: symbol
      exact: "memmove"
