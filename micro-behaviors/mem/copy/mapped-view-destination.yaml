defaults:
  platforms: [windows]
  for: [c, cpp, python]
traits:
  - id: mapped-view-copy-destination
    desc: Copies bytes into a mapped view
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(mem(cpy|move)|(Rtl)?CopyMemory)$'
      arg:
        index: 0
        from:
          call: '(^|\.)MapViewOfFile(Ex)?$'
