defaults:
  platforms: [windows]
  for: [pe, dll]
traits:
  - id: x86-fixed-length-stack-copy
    desc: x86 stack reservation and fixed-length copy
    crit: notable
    conf: 0.9
    arch: [x86]
    size_max: 262144
    if:
      type: hex
      section: .text
      pattern: 81 EC 68 0B 00 00 [8-32] B9 65 0B 00 00 [0-16] BE ?? ?? ?? ?? F3 A4
