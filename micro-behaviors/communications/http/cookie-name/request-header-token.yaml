defaults:
  crit: notable
  platforms: [unix, android]
  for: [c, cpp, rust, go, elf, shell, python]
  mbc: C0002
traits:
  - id: cookie-request-header-token
    desc: HTTP Cookie request header token
    conf: 0.9
    if:
      type: text
      # Require HTTP cookie-value syntax.  A bare "Cookie: " also occurs in
      # unrelated diagnostics such as X11's XInputWireToCookie errors.
      regex: 'Cookie:\s(%[-+.#0-9]*s|[!#$%&''*+.^_`A-Za-z0-9|~-]{1,64}=)'
