defaults:
  crit: notable
  conf: 0.9
  platforms: [windows]
  for: [pe]
traits:
  # Roblox account-session cookie name. Read from .rdata as raw bytes because
  # large binaries exceed the text string cap before reaching this table.
  - id: roblox-security-cookie-name-raw
    desc: Roblox session cookie name in large PE
    size_min: 8000000
    if:
      type: raw
      substr: ROBLOSECURITY
      section: .rdata
