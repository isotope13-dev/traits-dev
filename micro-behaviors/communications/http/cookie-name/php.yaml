defaults:
  crit: notable
  platforms: [unix, windows]
  for: [scripts, source]

traits:
  # PHP's engine-mandated session cookie name in assignment form, as it
  # appears in Set-Cookie/Cookie literals in any implementation language.
  - id: php-session-cookie-name
    desc: PHPSESSID cookie name literal
    conf: 0.95
    if:
      type: literal
      substr: 'PHPSESSID='
