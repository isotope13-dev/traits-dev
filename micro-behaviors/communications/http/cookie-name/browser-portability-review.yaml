traits:
- for:
  - binaries
  - scripts
  id: apisid-sapisid-cookie-pair
  desc: APISID and SAPISID cookies
  conf: 0.84
  if:
    type: text
    regex: APISID.{0,80}SAPISID|SAPISID.{0,80}APISID
- for:
  - html
  - javascript
  - php
  - powershell
  - python
  - typescript
  conf: 0.9
  id: entra-session-cookie-name
  desc: Microsoft Entra ID session cookie name
  if:
    type: text
    regex: \bESTSAUTH(PERSISTENT|LIGHT)?\b
- for:
  - html
  - javascript
  - php
  - powershell
  - python
  - typescript
  conf: 0.9
  id: microsoft-signin-state-cookie-name
  desc: Microsoft sign-in state cookie name
  if:
    type: text
    word: SignInStateCookie
- for:
  - go
  - javascript
  - markdown
  - package.json
  - php
  - pkginfo
  - python
  - ruby
  - rust
  - source
  - text
  - typescript
  conf: 0.9
  id: cloudflare-clearance-reference
  desc: References Cloudflare challenge clearance
  if:
    type: text
    regex: (?i)\bcf_clearance\b
- for:
  - go
  - javascript
  - markdown
  - package.json
  - php
  - pkginfo
  - python
  - ruby
  - rust
  - source
  - text
  - typescript
  conf: 0.9
  id: alibaba-acw-challenge-reference
  desc: References Alibaba Cloud WAF challenge cookie
  if:
    type: text
    regex: (?i)\bacw_sc__v2\b|\bacw_tc\b
composite_rules:
- for:
  - html
  - javascript
  - php
  - powershell
  - python
  - typescript
  conf: 0.92
  id: idp-session-cookie-named
  desc: Names an identity-provider session cookie
  any:
  - id: micro-behaviors/communications/http/cookie-name::entra-session-cookie-name
  - id: micro-behaviors/communications/http/cookie-name::microsoft-signin-state-cookie-name
  - id: micro-behaviors/communications/http/cookie-name::google-auth-cookie-name
- for:
  - html
  - javascript
  - php
  - powershell
  - python
  - typescript
  conf: 0.94
  id: idp-session-cookie-targeting
  desc: Names several IdP session cookies at once
  needs: 2
  any:
  - id: micro-behaviors/communications/http/cookie-name::entra-session-cookie-name
  - id: micro-behaviors/communications/http/cookie-name::microsoft-signin-state-cookie-name
  - id: micro-behaviors/communications/http/cookie-name::google-auth-cookie-name
  unless:
  - id: well-known/lib/crypto/
  - id: well-known/tool/detection/
  - id: metadata/package/testing/presence/fixture/
  - id: well-known/app/ai/browser-agent/pi-web-access::browser-cookie-reader-context
  - id: well-known/app/ai/browser-agent/pi-web-access::gemini-cookie-reader-module
defaults:
  crit: notable
  platforms:
  - unix
  - windows
