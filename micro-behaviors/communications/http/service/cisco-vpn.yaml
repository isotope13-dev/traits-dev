# Cisco Secure Firewall configuration markers that identify remote-access VPN
# listeners.  These are neutral product/configuration facts; exploit intent is
# inferred only when they occur with a structured malformed HTTP request.
defaults:
  platforms: [unix, windows, appliance]
  for: [scripts, binaries, text]

traits:
  - id: cisco-ssl-vpn-webvpn-enable
    desc: Cisco ASA/FTD SSL VPN listener config
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '(?im)\bwebvpn[ \t]*\r?\n[ \t]*enable[ \t]+[A-Za-z][A-Za-z0-9_.-]*\b'

  - id: cisco-ssl-vpn-webvpn-enable-inline
    desc: Cisco inline SSL VPN listener config
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '(?im)\bwebvpn[ \t]+enable[ \t]+[A-Za-z][A-Za-z0-9_.-]*\b'

  - id: cisco-ikev2-client-services-enable
    desc: Cisco IKEv2 client-services config
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '(?i)\bcrypto\s+ikev2\s+enable\s+\S+\s+client-services\s+port\s+[0-9]+'

  - id: cisco-ftd-zero-trust-enable
    desc: Cisco FTD Zero Trust listener config
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '(?im)\bzero-trust[ \t]*\r?\n[ \t]*enable[ \t]*$'

  - id: cisco-ftd-zero-trust-enable-inline
    desc: Cisco inline Zero Trust listener config
    crit: notable
    conf: 0.98
    if:
      type: literal
      kind: string
      regex: '(?im)\bzero-trust[ \t]+enable\b'

composite_rules:
  - id: cisco-remote-access-vpn-listener-config
    desc: Cisco ASA/FTD remote-access VPN listener config
    crit: notable
    conf: 0.98
    any:
      - id: cisco-ssl-vpn-webvpn-enable
      - id: cisco-ssl-vpn-webvpn-enable-inline
      - id: cisco-ikev2-client-services-enable
      - id: cisco-ftd-zero-trust-enable
      - id: cisco-ftd-zero-trust-enable-inline
