defaults:
  platforms: [unix, windows]
  for: [html]
  crit: notable
  conf: 0.92

traits:
  - id: html-jquery-ajax-get
    desc: HTML text configures jQuery AJAX GET
    if:
      type: text
      exclude_html_comments: true
      case_insensitive: true
      regex: '(\$|jQuery)\.ajax\s*\(\s*\{[^}]{0,240}\btype\s*:\s*["'']get["'']'
