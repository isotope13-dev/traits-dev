defaults:
  platforms: [unix, windows]
  # Dart sources are currently extracted through the JavaScript frontend.
  for: [javascript, text]
  crit: notable
  conf: 0.92
traits:
  - id: uri-parse-get-call
    desc: GET call takes a parsed URI
    if:
      type: text
      regex: '\.\s*get\s*\(\s*Uri\.parse\s*\('
