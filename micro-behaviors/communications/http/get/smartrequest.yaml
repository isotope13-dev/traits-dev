defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: smartrequest-get-chain
    desc: Calls SmartRequest fluent HTTP GET
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)SmartRequest\.create\.url(\.[a-zA-Z]+){0,3}\.get$'
