defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.92
traits:
  - id: python-request-get-method
    desc: Calls Python request with GET method
    if:
      type: symbol
      kind: call
      regex: '(^|\.)request$'
      arg:
        index: 0
        kind: string
        exact: GET
  - id: python-request-get-keyword
    desc: Python request call specifies method GET
    if:
      type: symbol
      kind: call
      regex: '(^|\.)request$'
      arg:
        from:
          field: method
          whole_value: '^GET$'
  - id: python-primp-client-get
    desc: Calls GET on a primp HTTP client
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(^|\.)get$'
      receiver:
        from:
          call: '^primp\.Client$'
