defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
  conf: 0.92
traits:
  - id: python-request-get-method
    desc: Calls Python request with GET method
    if:
      type: symbol
      kind: call
      regex: '(^|\.)request$'
      arg:
        index: 0
        kind: string
        exact: GET
