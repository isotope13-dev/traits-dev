defaults:
  platforms:
    - unix
    - windows
  crit: notable
  conf: 0.7
  for: [binaries]
traits:
  - id: get
    desc: HTTP GET method
    if:
      type: text
      regex: \bGET\s+\S+\s+HTTP/1\.[01]\b
      case_insensitive: false
  - id: binary-get-path
    desc: Binary HTTP GET path fragment
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '\bGET\s+/[A-Za-z0-9][A-Za-z0-9._/?%=&-]{2,159}'
      case_insensitive: false
  - id: binary-bins-payload-get-path
    desc: HTTP GET from /bins payload path
    crit: notable
    conf: 0.96
    platforms: [linux, android]
    for: [elf]
    if:
      type: text
      regex: '\bGET\s+/bins/[A-Za-z0-9_-]{2,64}\.'
      case_insensitive: false
  - id: javascript-get-method-text
    desc: Configures an HTTP GET request
    crit: notable
    conf: 0.72
    for: [javascript, typescript]
    if:
      type: text
      regex: "method\\s*:\\s*['\\\"]GET['\\\"]"
    unless:
      - id: metadata/file/format/structured::sourcemap-sources-content
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/testing/harness/runtime/

  - id: no-cors-before-get
    desc: no-cors mode before GET method
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'mode:\s*["'']no-cors["''].{0,80}method:\s*["'']GET["'']'

  - id: get-before-no-cors
    desc: GET method before no-cors mode
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'method:\s*["'']GET["''].{0,80}mode:\s*["'']no-cors["'']'

  - id: xml-http-get-method-literal
    desc: XML contains an HTTP GET method literal
    crit: notable
    conf: 0.88
    for: [xml]
    platforms: [windows]
    if:
      type: text
      regex: "'GET'|\"GET\""

composite_rules:
  - id: no-cors-get-request
    desc: Fetch GET request uses no-cors mode
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    any:
      - id: no-cors-before-get
      - id: get-before-no-cors
