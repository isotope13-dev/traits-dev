defaults:
  crit: notable
  platforms: [windows, linux, macos]
  for: [python]
traits:
  - id: requests-get
    desc: Calls requests.get in Python
    conf: 0.85
    if:
      type: symbol
      kind: call
      exact: requests.get
    unless:
      - id: well-known/app/system/archlinux-kernel::versioned-lts-update-helper
      - id: well-known/tool/detection/agentskillmap/
