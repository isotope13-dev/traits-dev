defaults:
  platforms: [macos, ios, linux]
  for: [swift]
  crit: notable
  conf: 0.97

traits:
  # The URL overload supplies a GET, unlike data(for:), whose URLRequest can
  # select POST. Swift's call facts omit argument labels, so inspect the call
  # node rather than treating an arbitrary .data member as this operation.
  - id: swift-urlsession-shared-data-from
    desc: Swift shared URLSession fetches URL data
    if:
      type: tree-sitter
      kind: call
      regex: '^URLSession\.shared\.data\(\s*from\s*:'
