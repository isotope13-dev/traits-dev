# Axios HTTP GET
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  attack: T1071.001
traits:
  - id: axios-get-call
    desc: axios.get() HTTP GET request
    conf: 0.8
    if:
      type: symbol
      kind: call
      exact: axios.get
  - id: axios-require-get-call
    desc: require('axios').get HTTP GET request
    conf: 0.82
    if:
      type: text
      regex: 'require\(["'']axios["'']\)\.get\s*\('
    unless:
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
  # Obfuscators hide `get` behind a decoder lookup. The empty string forces URL
  # coercion before a base and a second value are concatenated into the path.
  - id: axios-computed-method-base-data-concat
    desc: Computed Axios method joins base and data
    conf: 0.94
    if:
      type: text
      regex: 'axios\s*\[[^]]{1,80}\]\s*\(\s*["'']{2}\s*\+\s*\w+\s*\+\s*\w+\s*\)'
  # Caller-controlled path/query glued onto a base URL constant via template
  # literals (`axios.get(`${API_BASE_URL}${data}`)`). Benign SDKs usually pass
  # structured params; this shape is the npm silent-relay fingerprint.
  - id: axios-get-template-base-concat
    desc: axios.get joins template base with caller data
    conf: 0.93
    if:
      type: text
      regex: 'axios\.get\s*\(\s*`\$\{[A-Za-z_$][\w]*\}\$\{[A-Za-z_$][\w]*\}`'
