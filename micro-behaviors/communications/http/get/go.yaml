defaults:
  platforms: [windows, linux, macos]
  for: [go, elf, pe, macho]
  mbc: C0002
  attack: T1071.001
traits:
  - id: http-get
    desc: Go http.Get call
    crit: notable
    conf: 0.85
    if:
      type: symbol
      exact: http.Get
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
  - id: go-http-get-url-call
    desc: Go HTTP client Get URL call
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: symbol
      kind: call
      regex: '\.Get$'
      arg:
        kind: string
        regex: '(?i)^https?://[a-z0-9]'
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
