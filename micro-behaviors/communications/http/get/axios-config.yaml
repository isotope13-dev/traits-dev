defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: axios-get-config-call
    desc: Axios call specifies GET in configuration
    if:
      # Anonymous exported functions currently omit flow-value projections.
      # Bind the method property to this actual call's configuration object.
      type: tree-sitter
      query: |
        ((call_expression
          function: (identifier) @client
          arguments: (arguments
            (object (pair
              key: (property_identifier) @key
              value: (string (string_fragment) @method))))) @request
          (#eq? @client "axios")
          (#eq? @key "method")
          (#match? @method "^(get|GET)$"))
