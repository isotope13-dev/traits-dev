# A literal attachment URL reaches the URL parameter actually passed to GET.
# An unrelated CDN link elsewhere in the module cannot satisfy this trait.
defaults:
  for: [python]
  platforms: [windows, unix]
  crit: notable
traits:
  - id: python-helper-get-discord-executable-url
    desc: Helper GET receives a Discord executable URL
    conf: 0.98
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (function_definition name: (identifier) @helper
            parameters: (parameters . (identifier) @url (_)* )
            body: (block
              (with_statement
                (with_clause (with_item value: (as_pattern
                  (call function: (attribute) @get
                    arguments: (argument_list . (identifier) @requested (_)*))
                  alias: (as_pattern_target (identifier))))))))
          (function_definition body: (block
            (expression_statement (assignment left: (identifier) @configured
              right: (string) @endpoint))
            (if_statement consequence: (block
              (expression_statement (assignment right: (call
                function: (identifier) @invoked
                arguments: (argument_list . (identifier) @supplied (_)*))))))))) @bound_get
          (#eq? @get "requests.get") (#eq? @url @requested)
          (#eq? @helper @invoked) (#eq? @configured @supplied)
          (#match? @endpoint "^[\"']https?://(cdn|media)\\.discordapp\\.(com|net)/attachments/[0-9]+/[0-9]+/[^\"'/?\\s]{1,128}\\.(exe|dll|bat|ps1|sh)([?][^\"']{0,512})?[\"']$"))
