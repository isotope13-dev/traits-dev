# Node HTTPS GET source is often staged as a string by a package written in
# another language. These atoms intentionally inspect the cached source text,
# not a language-specific AST, because the inner JavaScript is data to the
# outer parser.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]

traits:
  - id: node-https-get-text
    desc: References Node HTTPS GET call syntax
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bhttps[.]get\s*\('
