defaults:
  crit: notable
  for: [ruby]
  platforms: [unix, windows]
  attack: T1071.001
  mbc: C0002
traits:
  - id: ruby-net-http-get-call
    desc: Net::HTTP.get() method call
    conf: 0.8
    if:
      type: tree-sitter
      query: |
        (call receiver: (scope_resolution) @receiver
          method: (identifier) @method
          (#eq? @receiver "Net::HTTP")
          (#eq? @method "get"))

  - id: ruby-http-get-assign
    desc: Net::HTTP.get response assigned to a variable
    conf: 0.9
    if:
      type: tree-sitter
      query: |
        (assignment left: (identifier) @binding
          right: (call receiver: (scope_resolution) @receiver
            method: (identifier) @method
            (#eq? @receiver "Net::HTTP")
            (#eq? @method "get")))
