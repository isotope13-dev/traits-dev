# Reviewed observation: no attacker intent is inferred by this matcher.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: module-https-get-empty-catch-context
  desc: Module-level HTTPS GET near an empty catch
  crit: notable
  conf: 0.88
  scope: file
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/get::module-level-https-get-call
  - id: micro-behaviors/data/control-flow/error-handling::empty-named-catch-text
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
