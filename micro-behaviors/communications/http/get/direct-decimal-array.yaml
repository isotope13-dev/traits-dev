# Decimal character codes preserve the source operation without claiming runtime success.
defaults:
  for: [html, javascript]
  platforms: [windows]
  crit: notable
traits:
  - id: direct-decimal-array-synchronous-get
    desc: Decimal array opens synchronous HTTP GET
    if:
      type: text
      substr: '80,111,112,46,79,112,101,110,32,34,71,34,38,34,69,84,34,44,32,67,110,76,82,85,44,32,70,97,108,115,101'
