defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
  conf: 0.75
  mbc: C0002

traits:
  - id: malformed-get-path-request
    size_min: 512
    size_max: 500000000
    desc: GET request without method-path separator
    if:
      type: text
      # A payload-search fingerprint such as GET/dlr. is not a request.
      # Require a request target followed by an actual protocol version.
      regex: 'GET/[a-z]{2,8}\.[^\r\n ]{0,64} HTTP/1\.[01]'
      section: .rodata
