defaults:
  platforms: [windows]
  for: [c, cpp]
traits:
  - id: winhttp-get-request
    desc: Opens a WinHTTP GET request handle
    crit: notable
    conf: 0.98
    if:
      # Wide-string arguments are opaque in the current C call projection.
      type: text
      regex: '\bWinHttpOpenRequest\s*\(\s*[^,;\r\n]{1,80},\s*L?"GET"\s*,'
