defaults:
  platforms: [windows, linux, macos]
  for: [go]
  crit: notable
  conf: 0.95
  mbc: C0002

traits:
  # MethodGet can also appear as a URL or body argument to a different method.
  # Bind the method to argument zero, or one for NewRequestWithContext. Go's
  # flow facts currently leave the MethodGet member expression unresolved.
  - id: go-http-get-request-construction
    desc: Go constructs an HTTP GET request
    if:
      type: tree-sitter
      language: go
      query: |
        ((call_expression
          function: (selector_expression) @constructor
          arguments: (argument_list . (_) @method)) @request
          (#eq? @constructor "http.NewRequest")
          (#match? @method "^(http\\.MethodGet|\"GET\"|`GET`)$"))
        ((call_expression
          function: (selector_expression) @constructor
          arguments: (argument_list . (_) . (_) @method)) @request
          (#eq? @constructor "http.NewRequestWithContext")
          (#match? @method "^(http\\.MethodGet|\"GET\"|`GET`)$"))
