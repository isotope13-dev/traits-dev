defaults:
  platforms: [linux]
  for: [elf]
  crit: notable
traits:
  - id: native-random-query-get-template
    desc: HTTP GET template with hexadecimal cache buster
    conf: 0.96
    if:
      type: text
      # Zig/LLD keeps this template in .data.rel.ro, not only .rodata.
      regex: 'GET /\?%0?[0-9]{0,2}x HTTP/1\.[01]'
