defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-cleartext-get-to-hex-label-host
    desc: Python HTTP GET targets a hex-label hostname
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '^(requests\.get|httpx\.get|urllib\.request\.urlopen)$'
      arg:
        index: 0
        from:
          value: '(?i)^http://[a-z0-9-]+\.[0-9a-f]{8}\.[a-z0-9-]+\.[a-z]{2,}([:/?#]|$)'
