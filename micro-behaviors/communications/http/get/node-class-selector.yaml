defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  # Match the selector behavior at its class, avoiding a file-root query that
  # joins every top-level declaration in large bundles. Module requirements
  # are checked by the composites below.
  - id: node-class-selected-get-shape
    desc: Class selects a client and calls GET
    crit: notable
    conf: 0.96
    if:
      type: tree-sitter
      query: |
        ((class_declaration
          body: (class_body
            (method_definition
              name: (property_identifier) @selector
              body: (statement_block
                (return_statement
                  (ternary_expression
                    condition: (binary_expression
                      left: (member_expression
                        property: (property_identifier) @protocol)
                      operator: "==="
                      right: (string (string_fragment) @scheme))
                    consequence: (identifier) @http_result
                    alternative: (identifier) @https_result))))
            (method_definition
              body: (statement_block
                [(lexical_declaration
                   (variable_declarator
                     name: (identifier) @client
                     value: (call_expression
                       function: (member_expression
                         object: (this)
                         property: (property_identifier) @selector_call)
                       arguments: (arguments . (identifier) @url))))
                 (variable_declaration
                   (variable_declarator
                     name: (identifier) @client
                     value: (call_expression
                       function: (member_expression
                         object: (this)
                         property: (property_identifier) @selector_call)
                       arguments: (arguments . (identifier) @url))))]
                (return_statement
                  (call_expression
                    function: (member_expression
                      object: (new_expression
                        arguments: (arguments
                          (arrow_function
                            body: (statement_block
                              (return_statement
                                (call_expression
                                  function: (member_expression
                                    object: (identifier) @get_client
                                    property: (property_identifier) @get)
                                  arguments: (arguments . (identifier) @get_url))))))))))))))
        (#eq? @protocol "protocol")
        (#eq? @scheme "http:")
        (#not-eq? @http_result @https_result)
        (#eq? @selector @selector_call)
        (#eq? @client @get_client)
        (#eq? @url @get_url)
        (#eq? @get "get"))

composite_rules:
  - id: node-class-selector-http-get
    desc: GET uses class-selected Node HTTP client
    crit: notable
    conf: 0.96
    all:
      - id: node-class-selected-get-shape
      - id: metadata/import/builtin::node-http-module-required
      - id: metadata/import/builtin::node-https-module-required
