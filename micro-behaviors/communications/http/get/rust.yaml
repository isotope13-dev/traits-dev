# Rust HTTP GET request APIs.
defaults:
  platforms: [unix, windows]
  for: [rust]
  attack: T1071.001
  mbc: C0002

traits:
  - id: rust-ureq-direct-get
    desc: Rust ureq sends direct GET request
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bureq::get\s*\('

  - id: rust-ureq-agent-client
    desc: Rust configures a ureq agent
    crit: component
    conf: 0.92
    if:
      type: text
      regex: '\bureq::(AgentBuilder|Agent)\b'

  # NOTE: the bare `.get(` method-call atom moved to
  # micro-behaviors/data/source/property/read::rust-get-accessor-call.
  # It matches every map/slice/Option lookup in Rust (hashbrown's bitmask code
  # among them), so it is a property accessor, not an HTTP verb. The ureq
  # composite below still references it; `ureq::Agent` supplies the HTTP context.

composite_rules:
  - id: rust-ureq-agent-get
    desc: Rust ureq agent sends GET request
    crit: notable
    conf: 0.92
    near_bytes: 2000
    all:
      - id: rust-ureq-agent-client
      - id: micro-behaviors/data/source/property/read::rust-get-accessor-call

  - id: rust-ureq-get-request
    desc: Rust sends HTTP GET with ureq
    crit: notable
    conf: 0.94
    any:
      - id: rust-ureq-direct-get
      - id: rust-ureq-agent-get
