# Reviewed observation: no attacker intent is inferred by this matcher.
defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
composite_rules:
- id: get-empty-response-import-empty-catch-context
  desc: GET, empty response, import call and catch context
  crit: notable
  conf: 0.97
  for:
  - npm
  - tar
  - package.json
  - javascript
  - typescript
  scope: archive
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/data/control-flow/module-exec::module-level-imported-method-call
  - id: micro-behaviors/data/control-flow/error-handling::empty-catch-block
  any:
  - id: micro-behaviors/communications/http/get::node-http-get-empty-arrow-callback
  - id: micro-behaviors/communications/http/get::node-http-get-empty-function-callback
  - id: micro-behaviors/communications/http/get::node-http-get-resume-drain-callback
  - id: micro-behaviors/communications/http/get::node-http-get-resume-drain-function
  needs: 1
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/file/naming::test-directory-component
