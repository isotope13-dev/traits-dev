defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: got-http-get-call
  desc: got HTTP client invokes get()
  crit: notable
  conf: 0.94
  if:
    type: symbol
    kind: call
    exact: got.get
- id: node-http-get-reference
  desc: JavaScript HTTP client get member reference
  crit: notable
  conf: 0.7
  if:
    type: symbol
    exact: http.get
- id: node-https-get-reference
  desc: Node HTTPS get member reference
  crit: notable
  conf: 0.7
  if:
    type: symbol
    exact: https.get
- id: module-level-https-get-call
  desc: Module-level https.get call on required client
  crit: notable
  conf: 0.9
  # Proven receiver origin and module-level scope: the request itself is
  # initiated while the module loads, not by a function a caller invokes.
  # A call inside a top-level block still counts; one inside a function
  # body does not.
  if:
    type: symbol
    kind: call
    exact: https.get
    module_level: true
    receiver:
      from:
        call: '^require$'
