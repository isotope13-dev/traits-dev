defaults:
  platforms:
  - windows
  - linux
  - macos
  for:
  - pe
  - elf
  - macho
  crit: notable
  conf: 0.98
traits:
- id: go-native-http-get-reference
  desc: Compiled Go HTTP Client.Get API reference
  if:
    # The Go pclntab name adjoins binary records that string extraction skips.
    # NUL delimiters distinguish Get from longer method names such as Getter.
    type: yara
    source: |
      rule go_native_http_client_get {
        strings:
          $method = "\x00net/http.(*Client).Get\x00" ascii
        condition:
          $method
      }
