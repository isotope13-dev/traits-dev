defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-ecs-credential-get
    desc: HTTP get uses ECS credential URI
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      kind: call
      regex: '\.get\s*\([^,\r\n]{0,180}process\.env\.AWS_CONTAINER_CREDENTIALS_RELATIVE_URI'
