defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-base64-buffer-get-url
    desc: HTTP GET URL carries Base64 Buffer output
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '^https?\.get$'
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?https?$'
      arg:
        index: 0
        from:
          call: '^Buffer\.from\.toString$'
          argument: 0
          literal: '^base64$'
