defaults:
  platforms: [unix, windows]
  for: [html, markdown]
traits:
- id: html-remote-image-source
  desc: HTML references a remote image
  crit: notable
  conf: 0.9
  for: [html]
  if:
    type: text
    regex: '(?i)<img\b[^>]{0,240}\bsrc\s*=\s*["'']https?://'

- id: markdown-remote-image-source
  desc: Markdown references a remote image
  crit: notable
  conf: 0.9
  for: [markdown]
  if:
    type: text
    regex: '(?i)!\[[^\]]{0,120}\]\(\s*https?://[^)\s]{1,220}\.(jpe?g|png|gif|webp)\b'

composite_rules:
- id: remote-image-source
  desc: Markup references a remote image
  crit: notable
  conf: 0.9
  any:
  - id: html-remote-image-source
  - id: markdown-remote-image-source
