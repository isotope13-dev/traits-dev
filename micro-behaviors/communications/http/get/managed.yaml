defaults:
  crit: notable
  conf: 0.8
  for: [pe, dll, csharp, powershell]
  platforms: [windows]

composite_rules:
- id: getasync
  desc: .NET HttpClient and GetAsync references
  crit: notable
  conf: 0.86
  all:
  - id: micro-behaviors/communications/http/client/managed::httpclient-reference-or-construction
  any:
  - id: metadata/binary/symbols/name::dotnet-getasync-method-name
  - id: metadata/file/function::getasync-name-reference
  unless:
  - id: well-known/game/mod::bedrockboot-source-repository

# Method-specific retrieval belongs under GET; a constructor also anchors
# source that uses a short HttpClient name. These are co-occurrence profiles.
- id: getstringasync
  desc: HttpClient and async GET text method references
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/client/managed::httpclient-reference-or-construction
  - id: micro-behaviors/data/string/access::dotnet-getstringasync-reference
  unless:
  - id: well-known/game/mod::bedrockboot-source-repository
  - id: metadata/build/generated::winmd-metadata

- id: getbytearrayasync
  desc: HttpClient and async GET byte method references
  crit: notable
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/client/managed::httpclient-reference-or-construction
  - id: micro-behaviors/data/buffer/read::dotnet-getbytearrayasync-reference
