defaults:
  platforms: [unix, windows, android]
  for: [java, kotlin]
  crit: notable
  conf: 0.97
traits:
  - id: jvm-set-request-method-get
    desc: Calls setRequestMethod with GET
    if:
      type: symbol
      kind: call
      regex: '(^|\.)setRequestMethod$'
      arg:
        index: 0
        kind: string
        exact: GET
  - id: kotlin-urlconnection-request-method-get
    desc: Sets URL connection method to GET
    for: [kotlin]
    if:
      type: text
      regex: '\.requestMethod\s*=\s*["\x27]GET["\x27]'
