# HTTP GET request construction fragments in tiny native Windows PE stagers.
defaults:
  platforms: [windows]
  for: [pe]
  mbc: C0002
  attack: T1071.001

traits:
  - id: pe-get-method-prefix-fragment
    desc: PE HTTP GET method prefix fragment
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bGET\s+H'

  - id: pe-http-version-split-fragment
    desc: PE split HTTP version fragment
    crit: component
    conf: 0.88
    if:
      type: text
      substr: TP/1

composite_rules:
  - id: pe-http-get-request-fragments
    desc: PE builds HTTP GET from split string fragments
    crit: notable
    conf: 0.92
    all:
      - id: pe-get-method-prefix-fragment
      - id: pe-http-version-split-fragment
