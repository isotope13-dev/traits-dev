defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
traits:
  # Inspect the same call when excluding a fixed reserved target. A separate
  # documentation URL elsewhere must not suppress a real traversal request.
  - id: requests-get-without-reserved-literal-prefix
    desc: requests.get lacks a reserved literal URL prefix
    conf: 0.95
    # An identifier argument may resolve to any URL. This observes the call's
    # written prefix, not the destination of a dynamic request.
    if:
      type: tree-sitter
      query: |
        ((call
          function: (attribute
            object: (identifier) @client
            attribute: (identifier) @method)) @request
         (#eq? @client "requests")
         (#eq? @method "get")
         (#not-match? @request "^requests\\.get\\s*\\(\\s*['\"]https?://[^/'\"]+\\.(test|example|invalid)[/'\"]")
         (#not-match? @request "^requests\\.get\\s*\\(\\s*['\"]https?://[^/'\"]+\\.localhost[/'\"]"))
