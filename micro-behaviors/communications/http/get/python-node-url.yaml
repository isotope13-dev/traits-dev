defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: python-node-id-url-to-get-helper
    desc: Node identifier enters HTTP helper URL
    conf: 0.97
    # Bind the interpolated node ID to the URL passed to a helper, and bind
    # that helper's parameter to requests.get. No campaign strings or names.
    if:
      type: tree-sitter
      language: python
      query: |
        ((module
          (function_definition
            name: (identifier) @sender
            parameters: (parameters (identifier) @parameter)
            body: (block
              (try_statement body: (block
                (expression_statement (assignment right: (call
                  function: (attribute object: (identifier) @client
                    attribute: (identifier) @method)
                  arguments: (argument_list (identifier) @sent_parameter))))))))
          (function_definition body: (block
            (expression_statement (assignment
              left: (identifier) @url
              right: (binary_operator left: (binary_operator right: (string
                (interpolation expression: (call function: (attribute
                  object: (identifier) @uuid attribute: (identifier) @getnode))))))))
            (expression_statement (call function: (identifier) @dispatch
              arguments: (argument_list (string
                (interpolation expression: (identifier) @sent_url))))))))
          (#eq? @sender @dispatch)
          (#eq? @parameter @sent_parameter)
          (#eq? @url @sent_url)
          (#eq? @client "requests")
          (#eq? @method "get")
          (#eq? @uuid "uuid")
          (#eq? @getnode "getnode"))
