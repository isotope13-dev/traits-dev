# A Node HTTP(S) GET whose response handler is an empty function does nothing
# with the response: no status check, no body read, no redirect handling. The
# request still discloses the victim's address and timing to the remote host,
# which is the whole point of a dependency-confusion ping or a C2 heartbeat.
# Legitimate callers inspect the response (or at least its status); an empty
# handler paired with swallowed errors means the call cannot fail visibly.
#
# The URL span excludes `)` so the callback must be a direct argument of the
# get call: without that bound the span bridges across `).on('error', ...)`
# into a chained error handler, misdescribing error suppression as a
# discarded response. The resume-drain atom below covers the sibling idiom
# `r => r.resume()`, which drains and discards the body without reading it.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.93

traits:
  - id: node-http-get-empty-arrow-callback
    desc: GET uses empty arrow response callback
    if:
      type: text
      regex: '\bhttps?\.get\s*\([^;\n)]{1,200},\s*\(\s*\w{0,20}\s*\)\s*=>\s*\{\s*\}'
  - id: node-http-get-empty-function-callback
    desc: GET uses empty function response callback
    if:
      type: text
      regex: '\bhttps?\.get\s*\([^;\n)]{1,200},\s*function\s*\(\s*\w{0,20}\s*\)\s*\{\s*\}'
  - id: node-http-get-resume-drain-callback
    desc: GET drains response via resume
    if:
      type: text
      regex: '\bhttps?\.get\s*\([^;\n)]{1,200},\s*\w{1,20}\s*=>\s*\{?\s*\w{1,20}\.resume\s*\(\)'
  - id: node-http-get-resume-drain-function
    desc: GET drains response via resume function
    if:
      type: text
      regex: '\bhttps?\.get\s*\([^;\n)]{1,200},\s*function\s*\(\w{0,20}\)\{\s*\w{1,20}\.resume\s*\(\)'
