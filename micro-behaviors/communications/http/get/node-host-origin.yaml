defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-host-identity-get-url
    desc: HTTP GET URL carries Node host/user output
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^https?\.get$'
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?https?$'
      arg:
        index: 0
        from:
          call: '^os\.(hostname|userInfo)$'
          through:
            - call: '^JSON\.stringify$'
              arguments: [0]
            - call: '^Buffer\.from$'
              arguments: [0]
            - call: '^Buffer\.from\.toString$'
              receiver: true
  - id: node-passwd-file-get-url
    platforms: [unix]
    desc: HTTP GET URL carries passwd-file contents
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '^https?\.get$'
      receiver:
        from:
          call: '^require$'
          literal: '^(node:)?https?$'
      arg:
        index: 0
        from:
          call: '(^|\.)readFileSync$'
          literal: '^/etc/passwd$'
          through:
            - call: '^JSON\.stringify$'
              arguments: [0]
            - call: '^Buffer\.from$'
              arguments: [0]
            - call: '^Buffer\.from\.toString$'
              receiver: true
