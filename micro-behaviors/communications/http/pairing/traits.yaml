# A client that posts its own pairing secret to a route ending in /pair is
# presenting a credential to enroll, not copying a stolen secret out.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.96

traits:
  - id: pairing-secret-post-to-pair-route
    desc: Posts pairing secret to a pair route
    if:
      type: text
      regex: '(?s)"secret"\s*:\s*\w+.{0,400}/pair\b'
