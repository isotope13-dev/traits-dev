# Header role review; original matchers and effective defaults preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - powershell
  - rust
  - pe
  - elf
  mbc: C0002
  attack: T1071.001
traits:
- id: host-header-override
  desc: Explicit HTTP Host header override
  crit: notable
  conf: 0.85
  for:
  - scripts
  - source
  if:
    type: text
    regex: (?i)(headers?\.(set|add)|setRequestHeader)\(\s*["']Host["']
  unless:
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
- id: node-ip-host-custom-header
  desc: Node HTTPS IP host with Host header
  crit: suspicious
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: 'host\s*:\s*[''"][0-9]{1,3}(\.[0-9]{1,3}){3}[''"].{0,120}headers\s*:\s*\{.{0,60}Host\s*:'
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
