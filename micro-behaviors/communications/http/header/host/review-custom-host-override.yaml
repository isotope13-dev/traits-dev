# Header role review; original matchers and effective defaults preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  crit: notable
  attack: T1071.001
traits:
- id: curl-host-header-argument
  desc: curl request supplies an explicit Host header
  conf: 0.96
  for:
  - shell
  - batch
  - powershell
  if:
    type: symbol
    kind: call
    regex: "(?i)^curl(\\.exe)?$"
    arg:
      kind: string
      regex: "(?i)^Host\\s*:"
- id: host-header-map-entry
  desc: Request header map overrides the Host header
  conf: 0.9
  for:
  - python
  - javascript
  - typescript
  - ruby
  if:
    type: text
    regex: (?i)\bheaders?\s*[:=]\s*\{[^}\r\n]{0,240}["']Host["']\s*(:|=>)
