# A bracketed IPv6 literal is valid. These forms instead put URL delimiters
# after a DNS/IPv4-shaped value, or enclose a non-IPv6 value in brackets.
defaults:
  for: [text]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: hostname-url-delimiter
    desc: Host header has misplaced delimiter
    if:
      type: text
      regex: '(?im)^Host:[ \t]*[a-z0-9._-]{1,253}[\]/?#]'
  - id: bracketed-hostname
    desc: Host header brackets a non-IPv6 name
    if:
      type: text
      regex: '(?im)^Host:[ \t]*\[[a-z0-9._-]{1,253}\]?[ \t]*\r?$'
composite_rules:
  - id: malformed-host-header
    desc: HTTP Host header uses malformed authority
    any:
      - id: hostname-url-delimiter
      - id: bracketed-hostname
