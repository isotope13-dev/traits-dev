# Bind the routing header to its value in wire requests, source mappings,
# indexed assignments, or parsed setter arguments (including Ruby => and Go Set).
# Merely naming X-DSCGI-PATH or a target path does not satisfy these matchers.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, text, json]
  crit: notable
  conf: 0.98

traits:
  # Java call projections retain literal arguments, but chained builder calls
  # with concatenated values have no corresponding flow node. Bind the header
  # name and path prefix to the same invocation instead of nearby literals.
  - id: ivanti-temporary-cgi-java-builder
    desc: Java builder selects temporary CGI route
    for: [java]
    if:
      type: tree-sitter
      query: |
        ((method_invocation name: (identifier) @setter
          arguments: (argument_list . (string_literal) @key .
            [(string_literal) @path
             (binary_expression left: (string_literal) @path)])) @evidence
          (#eq? @setter "header")
          (#match? @key "(?i)^\"X-DSCGI-PATH\"$")
          (#match? @path "^\"/home/runtime/tmp/"))

  - id: ivanti-protected-cgi-header-field
    desc: Ivanti header selects protected CGI handlers
    if:
      type: text
      regex: '(?i)X-DSCGI-PATH["''\]\s]*[:=][>\s"'']*/home/webserver/htdocs/dana/'

  - id: ivanti-temporary-cgi-header-field
    desc: Ivanti header selects temporary CGI files
    if:
      type: text
      regex: '(?i)X-DSCGI-PATH["''\]\s]*[:=][>\s"'']*/home/runtime/tmp/'

  - id: ivanti-protected-cgi-header-setter
    desc: Sets Ivanti protected CGI routing header
    for: [javascript, typescript, go, java, csharp, python, ruby]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(set|add|header)$'
      args:
        - index: 0
          kind: string
          regex: '(?i)^X-DSCGI-PATH$'
        - index: 1
          kind: string
          regex: '^/home/webserver/htdocs/dana/'

  # Follow the value argument to retain a literal path prefix when callers
  # append a filename dynamically; never borrow a path from another argument.
  - id: ivanti-temporary-cgi-header-setter
    desc: Sets Ivanti temporary CGI routing header
    for: [javascript, typescript, go, java, csharp, python, ruby]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(set|add|header)$'
      args:
        - index: 0
          kind: string
          regex: '(?i)^X-DSCGI-PATH$'
        - index: 1
          from:
            value: '^/home/runtime/tmp/'

composite_rules:
  - id: ivanti-protected-cgi-header
    desc: Ivanti header selects protected CGI handlers
    any:
      - id: ivanti-protected-cgi-header-field
      - id: ivanti-protected-cgi-header-setter

  - id: ivanti-temporary-cgi-header
    desc: Ivanti header selects temporary CGI files
    any:
      - id: ivanti-temporary-cgi-header-field
      - id: ivanti-temporary-cgi-header-setter
      - id: ivanti-temporary-cgi-java-builder
