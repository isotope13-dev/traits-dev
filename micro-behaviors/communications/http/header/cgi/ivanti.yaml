# Bind the routing header to its value in wire requests, source mappings,
# indexed assignments, or setter arguments (including Ruby => and Go Set).
# Merely naming X-DSCGI-PATH or a target path does not satisfy these matchers.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, text, json]
  crit: notable
  conf: 0.98

traits:
  - id: ivanti-protected-cgi-header
    desc: Ivanti header selects protected CGI handlers
    if:
      type: text
      regex: '(?i)X-DSCGI-PATH["''\]\s]*[:=,][>\s"'']*/home/webserver/htdocs/dana/'

  - id: ivanti-temporary-cgi-header
    desc: Ivanti header selects temporary CGI files
    if:
      type: text
      regex: '(?i)X-DSCGI-PATH["''\]\s]*[:=,][>\s"'']*/home/runtime/tmp/'
