# FortiWeb's fwbcgi handler parses the CGIINFO HTTP header for session context.
defaults:
  platforms: [fortios, unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.96

traits:
  - id: fortiweb-cgiinfo-header
    desc: Sets FortiWeb CGIINFO HTTP header
    if:
      type: text
      regex: '(?i)(["'']CGIINFO["'']\s*[:=,]|CGIINFO[ \t]*:[ \t]*[A-Za-z0-9+/=$"{])'
