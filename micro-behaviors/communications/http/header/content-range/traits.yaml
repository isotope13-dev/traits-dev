defaults:
  crit: notable
  conf: 0.94
  platforms: [windows, unix]
  for: [scripts, binaries]
  mbc: C0002
  attack: T1071.001

traits:
  - id: content-range-bytes-header
    desc: HTTP Content-Range bytes header
    if:
      type: text
      regex: '(?i)(^[ \t]*|["''`])Content-Range\s*:\s*bytes\b'

  - id: source-content-range-bytes-header
    desc: HTTP Content-Range bytes header in source
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)["''`]\s*Content-Range\s*:\s*bytes\b'

  - id: source-content-range-send-header
    desc: Source sets an HTTP Content-Range bytes header
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)(send_header|set_header)\s*\(\s*["''`]Content-Range["''`]\s*,\s*(f["''`])?bytes\b'
