# Request headers that reverse proxies and applications may trust as the
# "real" client address or the routed path. Each atom records one quoted header
# name; a script that carries many of them, including non-standard ones, is a
# probe set used to impersonate an internal client or rewrite the routed path.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, ruby, go]
  crit: notable
  conf: 0.85
  attack: T1090

traits:
  - id: x-originating-ip-header
    desc: X-Originating-IP header name
    if:
      type: literal
      exact: X-Originating-IP
      case_insensitive: true

  - id: x-remote-addr-header
    desc: X-Remote-Addr header name
    if:
      type: literal
      exact: X-Remote-Addr
      case_insensitive: true

  - id: x-remote-ip-header
    desc: X-Remote-IP header name
    if:
      type: literal
      exact: X-Remote-IP
      case_insensitive: true

  - id: x-client-ip-header
    desc: X-Client-IP header name
    if:
      type: literal
      exact: X-Client-IP
      case_insensitive: true

  - id: x-cluster-client-ip-header
    desc: X-Cluster-Client-IP header name
    if:
      type: literal
      exact: X-Cluster-Client-IP
      case_insensitive: true

  - id: true-client-ip-header
    desc: True-Client-IP header name
    if:
      type: literal
      exact: True-Client-IP
      case_insensitive: true

  - id: x-proxyuser-ip-header
    desc: X-ProxyUser-IP header name
    if:
      type: literal
      exact: X-ProxyUser-IP
      case_insensitive: true

  - id: x-true-ip-header
    desc: X-True-IP header name
    if:
      type: literal
      exact: X-True-IP
      case_insensitive: true

  # X-Custom-IP-Authorization is not a header any standard proxy emits; it is
  # carried by access-control bypass wordlists.
  - id: x-custom-ip-authorization-header
    desc: X-Custom-IP-Authorization header name
    conf: 0.9
    if:
      type: literal
      exact: X-Custom-IP-Authorization
      case_insensitive: true

  - id: x-rewrite-url-header
    desc: X-Rewrite-URL path override header
    if:
      type: literal
      exact: X-Rewrite-URL
      case_insensitive: true

composite_rules:
  # IP-extraction helpers read a handful of these; probe sets carry dozens.
  - id: client-address-header-name-list
    desc: Lists many client-address override headers
    scope: file
    needs: 6
    any:
      - id: x-originating-ip-header
      - id: x-remote-addr-header
      - id: x-remote-ip-header
      - id: x-client-ip-header
      - id: x-cluster-client-ip-header
      - id: true-client-ip-header
      - id: x-proxyuser-ip-header
      - id: x-true-ip-header
      - id: x-real-ip
      - id: x-forwarded-for
