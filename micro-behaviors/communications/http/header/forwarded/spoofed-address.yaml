defaults:
  platforms: [linux]
  for: [elf]
  attack: T1090

traits:
  # A printf-style %u.%u.%u.%u address inside X-Forwarded-For means the client
  # address is generated per request rather than taken from a real connection.
  - id: spoofed-forwarded-for-address-template
    desc: Forwarded-For header from random address
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)X-Forwarded-For\s*:\s*%u\.%u\.%u\.%u'
