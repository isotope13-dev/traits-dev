# Header role review; original matchers and effective defaults preserved.
---
defaults:
  crit: notable
  conf: 0.9
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - typescript
  - powershell
  - go
  - pe
  - elf
traits:
- id: x-forwarded-host
  desc: X-Forwarded-Host proxy header
  for:
  - scripts
  - source
  if:
    type: literal
    substr: X-Forwarded-Host
