# Header role review; original matchers and effective defaults preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - powershell
  - rust
  - pe
  - elf
  mbc: C0002
  attack: T1071.001
traits:
- id: x-forwarded-for
  desc: X-Forwarded-For proxy header
  for:
  - python
  - javascript
  - powershell
  - rust
  - pe
  - elf
  - kotlin
  - class
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: X-Forwarded-For
- id: x-original-url-header
  desc: X-Original-URL override header
  for:
  - python
  - javascript
  - powershell
  - rust
  - pe
  - elf
  - kotlin
  - class
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: X-Original-URL
- id: php-server-x-forwarded-for
  desc: PHP reads X-Forwarded-For server header
  crit: notable
  conf: 0.8
  for:
  - php
  if:
    type: string_literal
    substr: HTTP_X_FORWARDED_FOR
- id: php-server-http-client-ip
  desc: PHP reads HTTP client IP server header
  crit: notable
  conf: 0.8
  for:
  - php
  if:
    type: string_literal
    substr: HTTP_CLIENT_IP
- id: x-real-ip
  desc: X-Real-IP proxy header
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: X-Real-IP
