defaults:
  platforms: [windows]
  for: [powershell]
traits:
  - id: encoded-stage-opaque-useragent-value
    desc: Encoded source assigns a long opaque value
    crit: component
    conf: 0.97
    if:
      type: encoded
      encoding: base64
      regex: '(?i)\$userAgent\s*=\s*["''][A-Za-z0-9]{80,256}["'']'
