defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, python, php]
composite_rules:
  - id: inbound-user-agent-read
    desc: Reads an inbound HTTP User-Agent
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/header/user-agent-read::node-user-agent-read
      - id: micro-behaviors/communications/http/header/user-agent-read::node-user-agent-get
      - id: micro-behaviors/communications/http/user-agent::read-server-ua-php
      - id: micro-behaviors/communications/http/header/user-agent-read::python-user-agent-read
