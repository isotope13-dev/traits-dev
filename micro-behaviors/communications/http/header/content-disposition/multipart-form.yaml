# Multipart form-data header and builder markers. Like sibling filename-bearing
# Content-Disposition headers, these indicate multipart framing rather than a
# completed file transfer on their own.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text]
  crit: notable
  conf: 0.85

traits:
  - id: multipart-form-upload-marker
    desc: Multipart form upload body or call
    if:
      type: text
      regex: 'Content-Disposition:\s*form-data|\bmultipart/form-data\b|\bCreateFormFile\s*\('
