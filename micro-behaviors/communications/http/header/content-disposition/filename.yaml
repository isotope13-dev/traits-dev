# Filename-bearing Content-Disposition also occurs in multipart uploads.
# It does not establish a response, retrieval, or file transfer.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, powershell, rust, php, pe, elf]
  crit: notable

traits:
  - id: filename-reference
    desc: Content-Disposition line mentions a filename
    conf: 0.95
    if:
      type: text
      regex: 'Content-Disposition.{0,40}filename'
      case_insensitive: true
  - id: empty-filename-multipart-disposition-fragment
    desc: Multipart form-data header with empty filename
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      exclude_comments: true
      regex: '(?i);\s*filename\s*=\s*(\\?"\\?"|'''')'
