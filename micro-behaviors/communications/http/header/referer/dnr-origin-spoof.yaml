# A session DNR rule that SETs Referer and Origin for a domain makes requests to
# that domain look like they came from a page on it. Hotlink-tolerant image
# clients and API proxies do this for their own origin; the header pair plus the
# session-rule update is the observation, not a claim about the purpose.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: dnr-referer-set-operation
    desc: DNR modify-headers rule sets the Referer header
    if:
      type: text
      regex: 'header:\s*["''\x60]Referer["''\x60],\s*operation'

  - id: dnr-origin-set-operation
    desc: DNR modify-headers rule sets the Origin header
    if:
      type: text
      regex: 'header:\s*["''\x60]Origin["''\x60],\s*operation'

composite_rules:
  - id: dnr-referer-origin-rewrite
    desc: Session DNR rule rewrites Referer and Origin request headers
    conf: 0.9
    all:
      - id: dnr-referer-set-operation
      - id: dnr-origin-set-operation
      - id: micro-behaviors/communications/http/intercept::chrome-dnr-update-session-rules
