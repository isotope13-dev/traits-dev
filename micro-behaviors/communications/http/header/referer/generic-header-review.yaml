---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - powershell
  - rust
  - pe
  - elf
  mbc: C0002
  attack: T1071.001
traits:
- id: referer-header
  desc: HTTP Referer header
  crit: notable
  conf: 0.6
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: "(?i)\\bReferer\\s*:(\\s*[A-Za-z]+)?"
  not:
  - regex: referer\s*:\s*(string|boolean|number|any)\b
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: utf16-referer-header-pe
  desc: UTF-16 Referer header in PE
  crit: notable
  conf: 0.85
  for:
  - pe
  - dll
  if:
    type: hex
    section: ".rdata"
    pattern: 52 00 65 00 66 00 65 00 72 00 65 00 72 00 3A 00
composite_rules:
- id: google-homepage-referer
  for:
  - elf
  - pe
  - python
  - javascript
  - powershell
  desc: Google homepage Referer header
  crit: notable
  conf: 0.82
  all:
  - id: micro-behaviors/communications/http/services/google::google-homepage-url
  any:
  - id: micro-behaviors/communications/http/header/referer::referer-header
  - id: micro-behaviors/communications/http/header/referer::utf16-referer-header-pe
