# The Retry-After response header.
#
# Servers send Retry-After with 429 and 503 to tell a client how long to wait.
# Code that reads it by name is consuming a throttle hint programmatically,
# which is a neutral capability on its own.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -applescript, -vbs, -beam, -clojure, -staticlib, -pyc]
  mbc: C0002

traits:
  - id: retry-after-header-name-reference
    desc: References the Retry-After header name
    crit: notable
    conf: 0.9
    if:
      # A quoted header name is a structured string value. This deliberately
      # describes a reference/allowlist entry, not a read operation: the same
      # literal can be used when forwarding or filtering response headers.
      type: text
      regex: '(?i)["'']Retry-After["'']'
