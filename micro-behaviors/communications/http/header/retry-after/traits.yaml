# The Retry-After response header.
#
# Servers send Retry-After with 429 and 503 to tell a client how long to wait.
# Code that reads it by name is consuming a throttle hint programmatically,
# which is a neutral capability on its own.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, -applescript, -vbs, -beam, -clojure, -staticlib, -pyc]
  attack: T1590
  mbc: C0002

traits:
  - id: retry-after-header-read
    desc: Reads the Retry-After throttle header
    crit: notable
    conf: 0.9
    if:
      # Quoted header name only: the bare word appears in RFC text, comments
      # and HTTP documentation, while a quoted lookup key is a real read.
      type: text
      regex: '(?i)["'']Retry-After["'']'
