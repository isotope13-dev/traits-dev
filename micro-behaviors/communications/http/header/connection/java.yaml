defaults:
  platforms: [unix, windows]
  for: [java]
  mbc: C0002
  attack: T1071.001

traits:
  - id: java-connection-keepalive-header
    desc: Java HTTP keep-alive header
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: '(?i)\bConnection:\s*keep-alive\b'

  - id: java-bytecode-connection-keepalive-header
    # JVM constant-pool probe: a raw hex hit for this ASCII literal only means
    # "bytecode references it" inside a class/jar. Bounded so it cannot claim a
    # hundreds-of-megabyte container (a FreeBSD install ISO reached this rule and
    # matched the literal in ordinary files it carries); no real class or jar is
    # this large.
    size_max: 67108864
    desc: Java bytecode HTTP keep-alive header
    crit: notable
    conf: 0.8
    for: [class, jar]
    if:
      type: hex
      pattern: 43 6f 6e 6e 65 63 74 69 6f 6e 3a 20 6b 65 65 70 2d 61 6c 69 76 65
