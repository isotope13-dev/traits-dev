defaults:
  platforms: [unix, windows]
  for: [elf, pe, macho, c, cpp, go, rust, javascript, typescript, python]
  crit: notable
  conf: 0.9
traits:
  - id: proxy-connection-header-text
    desc: References Proxy-Connection header text
    # Native parsers can assemble this name beside the next header name.
    # This is a text reference, not proof of a proxy connection or tunnel.
    if:
      type: text
      substr: Proxy-Connection
      case_insensitive: true
