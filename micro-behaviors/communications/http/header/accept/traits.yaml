defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  attack: T1071.001
  mbc: C0002

traits:
  - id: browser-html-accept-header
    desc: Requests browser-oriented HTML content
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'text/html,\s*application/xhtml\+xml'

  - id: accept-json-header
    desc: Requests a JSON HTTP response
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '\bAccept["'']?\s*[:=]\s*["'']?application/json\b'
      case_insensitive: true

  - id: accept-github-raw-media-type
    desc: Requests GitHub API raw media type
    crit: notable
    conf: 0.95
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '(?i)\bAccept["'']?\s*[:=]\s*["'']?application/vnd\.github(\.[a-z0-9_-]{1,16})?\.raw\b'
