defaults:
  platforms: [windows, unix]
  for: [csharp]
  crit: notable
traits:
  - id: csharp-github-raw-media-type
    desc: Constructs GitHub raw media type
    if:
      type: symbol
      kind: call
      exact: MediaTypeWithQualityHeaderValue
      arg:
        index: 0
        kind: string
        regex: '^application/vnd\.github(\.[a-z0-9_-]{1,16})?\.raw$'
