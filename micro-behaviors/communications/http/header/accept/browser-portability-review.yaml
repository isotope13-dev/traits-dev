composite_rules:
- platforms:
  - unix
  - windows
  for:
  - javascript
  - php
  - python
  - ruby
  - shell
  - typescript
  id: script-client-browser-header-pair
  desc: HTTP client and browser header literals co-occur
  crit: notable
  conf: 0.9
  scope: file
  all:
  - id: micro-behaviors/communications/http/header/accept::browser-html-accept-header
  - id: micro-behaviors/communications/http/user-agent::browser-mozilla-5-0
  - id: micro-behaviors/communications/http/client/exchange::http-client-markers-or-response-stream
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
