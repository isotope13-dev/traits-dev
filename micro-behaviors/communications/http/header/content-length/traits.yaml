defaults:
  crit: notable
  conf: 0.9
  platforms: [windows, unix]
  for: [elf, c, cpp, objc, rust]
  mbc: C0002

traits:
  - id: content-length-header
    desc: HTTP Content-Length header
    for: [scripts, binaries]
    if:
      type: text
      substr: "Content-Length:"

  # A body of >= 100 MB. Neutral on its own (large downloads, media streaming,
  # captured HTTP traces); bandwidth-probe and bulk-upload composites pair it
  # with the endpoint that receives the body.
  - id: large-content-length-header
    desc: HTTP Content-Length header of 100MB or more
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)Content-Length:\s*[1-9][0-9]{8,}\b'

  - id: source-content-length-header
    desc: HTTP Content-Length header literal in source
    for: [source]
    if:
      type: literal
      kind: string
      regex: '(?i)Content-Length\s*:'

  - id: python-content-length-header
    desc: Python HTTP Content-Length header
    for: [python]
    if:
      type: text
      substr: "Content-Length"

  - id: duplicate-content-length-literal
    desc: Duplicate Content-Length in one literal
    crit: notable
    conf: 0.98
    for: [scripts, binaries, source, '!staticlib', '!applescript', '!vbs']
    if:
      # Restrict framing evidence to one parser-extracted string literal.
      # Source text also includes prose comments and unrelated literals:
      # Orca's empty-body forwarding explanation mentions the same header
      # twice without constructing any duplicate-header request.
      type: literal
      kind: string
      regex: '(?is)Content-Length\s*:\s*\d.{0,480}(\\r\\n|\r?\n)\s*Content-Length\s*:\s*\d'
    # A blank line terminates the header block; do not cross into a body
    # or a subsequent message inside the same literal.
    not:
      - regex: '(\\r\\n){2}|(\\n){2}'
      - regex: '\r?\n\r?\n'
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/package/testing/presence/harness::unittests-directory-path
      - id: metadata/package/testing/compiled::c-test-framework-marker
      - id: metadata/package/testing/http-fixtures::http-parser-framing-fixture-context
      - id: well-known/app/development/jennifer/
      - id: well-known/lib/runtime/scripted/php-runtime::source-tree

  # One literal must contain both the ambiguous framing and a subsequent
  # request. Separate request fixtures in nearby tests are not a pipeline.
  - id: duplicate-length-pipelined-request-literal
    desc: Duplicate length headers with pipelined request
    crit: notable
    conf: 0.98
    for: [source]
    if:
      type: literal
      kind: string
      regex: '(?is)Content-Length:.{1,80}Content-Length:.{1,480}[A-Z]+ /\S* HTTP/1\.[01]'
