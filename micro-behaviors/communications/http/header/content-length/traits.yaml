defaults:
  crit: notable
  conf: 0.9
  platforms:
  - windows
  - unix
  for:
  - elf
  - c
  - cpp
  - objc
  - rust
  mbc: C0002
traits:
- id: content-length-header
  desc: HTTP Content-Length header
  for:
  - scripts
  - binaries
  if:
    type: text
    substr: 'Content-Length:'
- id: large-content-length-header
  desc: HTTP Content-Length header of 100MB or more
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)Content-Length:\s*[1-9][0-9]{8,}\b
- id: source-content-length-header
  desc: HTTP Content-Length header literal in source
  for:
  - source
  if:
    type: literal
    kind: string
    regex: '(?i)Content-Length\s*:'
- id: python-content-length-header
  desc: Python HTTP Content-Length header
  for:
  - python
  if:
    type: text
    substr: Content-Length
- id: duplicate-content-length-literal
  desc: Duplicate Content-Length in one literal
  conf: 0.98
  for:
  - scripts
  - binaries
  - source
  - '!staticlib'
  - '!applescript'
  - '!vbs'
  if:
    type: literal
    kind: string
    regex: (?is)Content-Length\s*:\s*\d.{0,480}(\\r\\n|\r?\n)\s*Content-Length\s*:\s*\d
  not:
  - regex: (\\r\\n){2}|(\\n){2}
  - regex: \r?\n\r?\n
  unless:
  - id: metadata/package/testing/presence/harness::go-test-file
  - id: metadata/path::test-directory-component
  - id: metadata/package/testing/presence/harness::unittests-directory-path
  - id: metadata/package/testing/compiled::c-test-framework-marker
  - id: metadata/package/testing/http-fixtures::http-parser-framing-fixture-context
  - id: well-known/app/development/jennifer/
  - id: well-known/lib/runtime/scripted/php-runtime::source-tree
- id: duplicate-length-pipelined-request-literal
  desc: Duplicate length headers with pipelined request
  conf: 0.98
  for:
  - source
  if:
    type: literal
    kind: string
    regex: (?is)Content-Length:.{1,80}Content-Length:.{1,480}[A-Z]+ /\S* HTTP/1\.[01]
