defaults:
  platforms: [windows, unix]
  for: [elf, c, cpp, objc, rust]
  mbc: C0002
  attack: T1071.001

traits:
  - id: content-length-header
    desc: HTTP Content-Length header
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    if:
      type: text
      substr: "Content-Length:"

  # A body of >= 100 MB. Neutral on its own (large downloads, media streaming,
  # captured HTTP traces); bandwidth-probe and bulk-upload composites pair it
  # with the endpoint that receives the body.
  - id: large-content-length-header
    desc: HTTP Content-Length header of 100MB or more
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    if:
      type: text
      regex: 'Content-Length:\s*[0-9]{8,}'

  - id: source-content-length-header
    desc: HTTP Content-Length header literal in source
    crit: notable
    conf: 0.9
    for: [source]
    if:
      type: text
      regex: '["''`]\s*Content-Length\s*:'

  - id: python-content-length-header
    desc: Python HTTP Content-Length header
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      substr: "Content-Length"
