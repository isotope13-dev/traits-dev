defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: wide-analytics-user-cookie-fields
    desc: Wide analytics and user cookie-field fragments
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule wide_analytics_user_cookie_fields {
          strings:
            $gid = "; _gid=" wide
            $gat = "; _gat=" wide
            $user = "; _u=" wide
          condition:
            all of them
        }
