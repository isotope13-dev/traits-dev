defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  mbc: C0002
  attack: T1071.001

traits:
  - id: accept-ranges-bytes-header
    desc: HTTP Accept-Ranges bytes header
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(^[ \t]*|["''`])Accept-Ranges\s*:\s*bytes\b'

  - id: source-accept-ranges-bytes-header
    desc: Source sets an HTTP Accept-Ranges bytes header
    crit: notable
    conf: 0.94
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)(send_header|set_header)\s*\(\s*["''`]Accept-Ranges["''`]\s*,\s*["''`]bytes["''`]'
