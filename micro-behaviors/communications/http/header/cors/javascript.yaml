defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json]
  crit: notable
  conf: 0.95

traits:
  - id: wildcard-cors-array-value
    desc: Defines wildcard CORS response-header array
    if:
      type: text
      regex: '(?i)["'']Access-Control-Allow-Origin["'']\s*:\s*\[\s*["'']\*["'']\s*\]'

  - id: wildcard-cors-header-value
    desc: CORS header entry specifies wildcard origin
    if:
      type: text
      regex: '(?i)Access-Control-Allow-Origin["''][^{}]{0,80}\bvalue["'']?\s*:\s*["'']\*["'']'

  - id: wildcard-cors-value-header
    desc: Wildcard value precedes CORS header name
    if:
      type: text
      regex: '(?i)\bvalue["'']?\s*:\s*["'']\*["''][^{}]{0,80}Access-Control-Allow-Origin["'']'

composite_rules:
  # responseHeaders also belongs to Electron and HTTP servers. A DNR claim
  # requires the actual modifyHeaders action, not the generic property name.
  - id: dnr-wildcard-cors-response
    desc: Browser rule sets wildcard CORS origin
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/headers::dnr-modify
    any:
      - id: wildcard-cors-header-value
      - id: wildcard-cors-value-header
