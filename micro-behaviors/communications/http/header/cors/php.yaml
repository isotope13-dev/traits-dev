defaults:
  platforms: [unix, windows]
  for: [php]

traits:
- id: php-cors-extension-origin
  desc: PHP allows extension-origin CORS
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '(?i)Access-Control-Allow-Origin:\s*(chrome|moz)-extension://'

- id: php-cors-post-only
  desc: PHP CORS response limited to POST
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '(?i)Access-Control-Allow-Methods:\s*POST\b'
