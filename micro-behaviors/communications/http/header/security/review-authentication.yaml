traits:
- platforms:
  - android
  for:
  - java
  - kotlin
  crit: notable
  conf: 0.95
  id: android-custom-token-header-source
  desc: Sets custom token header in Android HTTP
  if:
    type: text
    regex: (?i)\.(addHeader|header)\s*\(\s*["']X-[A-Za-z0-9_-]{0,32}(Token|Auth|Key)
- platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - binaries
  - text
  - data
  - json
  id: aws-imds-token-header
  desc: AWS EC2 metadata token header
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: X-aws-ec2-metadata-token
- platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - binaries
  - text
  - data
  - json
  id: aws-imds-token-ttl-header
  desc: AWS EC2 metadata token TTL header
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: X-aws-ec2-metadata-token-ttl-seconds
- platforms:
  - unix
  - windows
  for:
  - class
  crit: notable
  conf: 0.95
  id: anthropic-api-key-header-bytecode
  desc: Anthropic X-Api-Key request header
  if:
    type: hex
    pattern: 58 2D 41 70 69 2D 4B 65 79
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: x-access-key-header-map-entry
  desc: Configures an X-Access-Key HTTP header
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '["'']X-Access-Key["'']\s*:'
    case_insensitive: true
- platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  id: bearrtoken-header-map-entry
  desc: Configures a misspelled bearrtoken HTTP header
  crit: suspicious
  conf: 0.98
  if:
    type: text
    regex: headers\s*:\s*\{[\s\S]{0,80}bearrtoken\s*:\s*["'][\w-]{1,32}["']
- platforms:
  - linux
  - macos
  - windows
  for:
  - javascript
  - typescript
  id: shopify-access-token-header
  desc: Shopify access-token HTTP header
  crit: notable
  conf: 0.95
  if:
    type: literal
    regex: ^X-Shopify-(Access|Storefront-Access)-Token$
