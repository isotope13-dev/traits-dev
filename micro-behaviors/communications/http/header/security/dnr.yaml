defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json]

traits:
  - id: dnr-csp-response-header
    desc: DNR response rule names CSP
    crit: component
    conf: 0.9
    if:
      type: value
      path: 'root[*].action.responseHeaders[*].header'
      exact: Content-Security-Policy
      case_insensitive: true
  - id: dnr-csp-unsafe-eval-value
    desc: CSP value permits unsafe-eval
    crit: component
    conf: 0.9
    if:
      type: value
      path: 'root[*].action.responseHeaders[*].value'
      substr: unsafe-eval
  - id: dnr-empty-response-header-value
    desc: DNR response header has an empty value
    crit: component
    conf: 0.95
    if:
      type: value
      path: 'root[*].action.responseHeaders[*].value'
      regex: '^$'
  - id: dnr-response-header-set-operation
    desc: DNR response header uses the set operation
    crit: component
    conf: 0.95
    if:
      type: value
      path: 'root[*].action.responseHeaders[*].operation'
      exact: set
composite_rules:
  - id: dnr-csp-unsafe-eval
    desc: DNR CSP permits unsafe-eval
    crit: notable
    conf: 0.9
    all:
      - id: dnr-csp-response-header
      - id: dnr-csp-unsafe-eval-value
  - id: dnr-csp-empty-set
    desc: DNR clears the CSP response header
    crit: notable
    conf: 0.96
    all:
      - id: dnr-csp-response-header
      - id: dnr-empty-response-header-value
      - id: dnr-response-header-set-operation
