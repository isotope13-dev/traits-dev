defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: response-headers-filter-csp
    desc: Filters CSP from response headers
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((call_expression
          function: (member_expression
            object: (member_expression property: (property_identifier) @headers)
            property: (property_identifier) @filter)
          arguments: (arguments
            (arrow_function
              parameter: (identifier) @param
              body: (binary_expression
                left: (call_expression
                  function: (member_expression
                    object: (member_expression
                      object: (identifier) @receiver
                      property: (property_identifier) @name)
                    property: (property_identifier) @lower))
                operator: ["!==" "!="]
                right: (string) @policy))))
          (#eq? @headers "responseHeaders")
          (#eq? @filter "filter")
          (#eq? @param @receiver)
          (#eq? @name "name")
          (#eq? @lower "toLowerCase")
          (#match? @policy "^['\"]content-security-policy['\"]$"))
