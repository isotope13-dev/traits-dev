# JSP has no Java call projection; require header-setting call syntax.
defaults:
  platforms: [unix, windows]
  for: [jsp]
traits:
  - id: jsp-sets-csp-header
    desc: JSP sets Content-Security-Policy header
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?m)^\s*\w+\.setHeader\s*\(\s*["'']Content-Security-Policy["'']\s*,'
