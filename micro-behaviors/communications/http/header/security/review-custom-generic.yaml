# Header role review; original matchers and effective defaults preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - powershell
  - rust
  - pe
  - elf
  mbc: C0002
  attack: T1071.001
traits:
- id: js-csrf-token-header-from-meta
  desc: Sets anti-CSRF header from page meta tag
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  - html
  if:
    type: text
    regex: (?i)setRequestHeader\(\s*['"]x-csrf-token['"]\s*,\s*\$\(['"]meta
