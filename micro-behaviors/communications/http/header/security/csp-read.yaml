defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - powershell
  - rust
  - pe
  - elf
traits:
  - id: csp-response-header-read
    desc: Reads Content-Security-Policy response header
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      substr: headers.get
      arg:
        kind: string
        exact: content-security-policy
