# Header role review; original matchers and effective defaults preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: csrf-token-header-from-variable
  desc: Sends anti-CSRF token header from variable
  conf: 0.92
  if:
    type: text
    regex: '["'']X-[CX]SRF-TOKEN["'']\s*:\s*[A-Za-z_$][\w$]*\s*[,}]'
    case_insensitive: true
