defaults:
  platforms: [unix, windows]
  for: [python, powershell, shell]
  crit: notable
traits:
  - id: filemaker-wpe-extended-privilege-header
    desc: FileMaker X-FMI-PE-ExtendedPrivilege header
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      word: X-FMI-PE-ExtendedPrivilege
      case_insensitive: true
  - id: filemaker-xml-resultset-endpoint
    desc: FileMaker XML fmresultset.xml endpoint
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      regex: '(?i)/fmi/xml/(fmresultset|FMPXMLRESULT)\.xml\b'
