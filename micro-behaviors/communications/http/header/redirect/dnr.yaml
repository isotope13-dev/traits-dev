# The Location response header is how a server moves a client somewhere else.
# A declarativeNetRequest rule that names it is reaching into another site's
# navigation control, so the header is worth recording on its own.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json]

traits:
  - id: dnr-location-header-field
    desc: DNR rule names the Location response header
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '["'']?(header|name)["'']?\s*:\s*["'']location["'']'
      case_insensitive: true
