defaults:
  platforms:
    - windows
    - unix
  for:
    - scripts
    - binaries
traits:
  - id: dnr-modify
    desc: DNR action uses modifyHeaders
    crit: notable
    conf: 0.9
    for:
      - javascript
      - typescript
      - json
    if:
      type: text
      regex: '["'']?type["'']?\s*:\s*["'']modifyHeaders["'']'
      case_insensitive: true
  - id: dnr-origin
    desc: DNR exact Origin header name
    crit: notable
    conf: 0.6
    for:
      - javascript
      - typescript
      - json
    if:
      type: text
      regex: '["'']?header["'']?\s*:\s*["'']?Origin["'']?'
      case_insensitive: true
  - id: dnr-set-operation
    desc: DNR operation set
    crit: notable
    conf: 0.8
    for:
      - javascript
      - typescript
      - json
    if:
      type: text
      regex: '["'']?(operation|headerOperation)["'']?\s*:\s*["'']set["'']'
  - id: dnr-access-control-credentials-set
    desc: DNR sets CORS credentials response header
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"Access-Control-Allow-Credentials"[\s\S]{0,160}"operation"\s*:\s*"set"'
  - id: dnr-origin-empty-set
    desc: DNR clears Origin request header
    crit: notable
    conf: 0.85
    for:
      - javascript
      - typescript
      - json
    if:
      type: text
      regex: '"Origin"[\s\S]{0,160}"value"\s*:\s*""'
  - id: dnr-client-hints-remove
    desc: DNR removes Sec-CH-UA headers
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '"Sec-Ch-Ua(-Mobile|-Platform)?"[\s\S]{0,160}"operation"\s*:\s*"remove"'
  - id: dnr-location-response-header
    desc: DNR response rule names the Location header
    crit: notable
    conf: 0.98
    for:
      - json
    if:
      type: value
      path: root[*].action.responseHeaders[*].header
      exact: location
      case_insensitive: true
  - id: dnr-location-remove-after-header
    desc: DNR removes Location after header field
    crit: suspicious
    conf: 0.98
    for:
      - json
    if:
      type: text
      regex: (?i)["']location["'][^{}]{0,80}["']operation["']\s*:\s*["']remove["']
    unless:
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
      - id: well-known/app/browser-extension/content-blocker::ublock-fork-filters-path
  - id: dnr-location-remove-before-header
    desc: DNR removes Location before header field
    crit: suspicious
    conf: 0.98
    for:
      - json
    if:
      type: text
      regex: (?i)["']operation["']\s*:\s*["']remove["'][^{}]{0,80}["']location["']
    unless:
      - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
  - id: client-identity-headers
    desc: Client identity HTTP headers
    crit: notable
    conf: 0.84
    for:
      - javascript
      - typescript
    if:
      type: text
      regex: X-Client-(OS|IP|User)
  - id: dnr-origin-header-set
    for:
      - javascript
    desc: DNR header object sets Origin
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ([
          (object
            (pair key: (_) @header-key value: (string) @header-name)
            (pair key: (_) @operation-key value: (string) @operation))
          (object
            (pair key: (_) @operation-key value: (string) @operation)
            (pair key: (_) @header-key value: (string) @header-name))
        ] @rule
          (#match? @header-key "^['\"]?header['\"]?$")
          (#match? @header-name "(?i)^['\"]Origin['\"]$")
          (#match? @operation-key "^['\"]?operation['\"]?$")
          (#match? @operation "^['\"]set['\"]$"))
  - id: dnr-origin-strip
    for:
      - javascript
    desc: DNR removes an Origin header
    crit: suspicious
    conf: 0.96
    unless:
      - id: well-known/app/productivity/web-to-epub::wte-extension-context
      - id: well-known/app/browser-extension/translator::translator-security-context
      - id: well-known/app/ai/gateway/ollama::browser-extension-loopback-origin-cors
    if:
      type: tree-sitter
      query: |
        (([
          (object
            (pair key: (_) @type-key value: (string) @action-type)
            (pair key: (_) @headers-key value:
              (array
                (object
                  (pair key: (_) @header-key value: (string) @header-name)
                  (pair key: (_) @operation-key value: (string) @operation)))))
          (object
            (pair key: (_) @type-key value: (string) @action-type)
            (pair key: (_) @headers-key value:
              (array
                (object
                  (pair key: (_) @operation-key value: (string) @operation)
                  (pair key: (_) @header-key value: (string) @header-name)))))
          (object
            (pair key: (_) @headers-key value:
              (array
                (object
                  (pair key: (_) @header-key value: (string) @header-name)
                  (pair key: (_) @operation-key value: (string) @operation))))
            (pair key: (_) @type-key value: (string) @action-type))
          (object
            (pair key: (_) @headers-key value:
              (array
                (object
                  (pair key: (_) @operation-key value: (string) @operation)
                  (pair key: (_) @header-key value: (string) @header-name))))
            (pair key: (_) @type-key value: (string) @action-type))
        ] @rule)
          (#match? @type-key "^['\"]?type['\"]?$")
          (#match? @action-type "^['\"]modifyHeaders['\"]$")
          (#match? @headers-key "^['\"]?(requestHeaders|responseHeaders)['\"]?$")
          (#match? @header-key "^['\"]?header['\"]?$")
          (#match? @header-name "(?i)^['\"]Origin['\"]$")
          (#match? @operation-key "^['\"]?operation['\"]?$")
          (#match? @operation "^['\"]remove['\"]$"))
  - id: dnr-referer-header-strip
    for:
      - javascript
    desc: DeclarativeNetRequest removes a Referer header
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        (([
          (object
            (pair key: (_) @type-key value: (string) @action-type)
            (pair key: (_) @headers-key value:
              (array
                (object
                  (pair key: (_) @header-key value: (string) @header-name)
                  (pair key: (_) @operation-key value: (string) @operation)))))
          (object
            (pair key: (_) @type-key value: (string) @action-type)
            (pair key: (_) @headers-key value:
              (array
                (object
                  (pair key: (_) @operation-key value: (string) @operation)
                  (pair key: (_) @header-key value: (string) @header-name)))))
          (object
            (pair key: (_) @headers-key value:
              (array
                (object
                  (pair key: (_) @header-key value: (string) @header-name)
                  (pair key: (_) @operation-key value: (string) @operation))))
            (pair key: (_) @type-key value: (string) @action-type))
          (object
            (pair key: (_) @headers-key value:
              (array
                (object
                  (pair key: (_) @operation-key value: (string) @operation)
                  (pair key: (_) @header-key value: (string) @header-name))))
            (pair key: (_) @type-key value: (string) @action-type))
        ] @rule)
          (#match? @type-key "^['\"]?type['\"]?$")
          (#match? @action-type "^['\"]modifyHeaders['\"]$")
          (#match? @headers-key "^['\"]?(requestHeaders|responseHeaders)['\"]?$")
          (#match? @header-key "^['\"]?header['\"]?$")
          (#match? @header-name "(?i)^['\"]Referer['\"]$")
          (#match? @operation-key "^['\"]?operation['\"]?$")
          (#match? @operation "^['\"]remove['\"]$"))
composite_rules:
  - id: dnr-security-header-remove
    desc: DNR removes CSP or frame headers
    crit: notable
    conf: 0.96
    for:
      - javascript
      - typescript
      - json
    all:
      - id: micro-behaviors/communications/http/header/custom::header-remove-operation
    any:
      - id: micro-behaviors/communications/http/header/security::dnr-csp-header-field
      - id: micro-behaviors/communications/http/header/security::dnr-legacy-csp-header-field
      - id: micro-behaviors/communications/http/header/security::dnr-frame-options-header-field
    near_bytes: 120
  - id: dnr-location-header-strip
    for:
      - javascript
      - typescript
      - json
    desc: DNR removes Location response header
    crit: notable
    conf: 0.94
    near_bytes: 160
    all:
      - id: micro-behaviors/communications/http/header/modify::dnr-modify
      - id: micro-behaviors/communications/http/header/custom::header-remove-operation
      - id: micro-behaviors/communications/http/header/redirect::dnr-location-header-field
  - id: dnr-sec-fetch-spoof
    for:
      - javascript
    desc: DNR modifies Sec-Fetch request header
    crit: notable
    conf: 0.85
    all:
      - id: micro-behaviors/communications/http/header/modify::dnr-modify
      - id: micro-behaviors/communications/http/header/custom::sec-fetch-request-header
  - id: dnr-cors-origin-rewrite
    for:
      - javascript
    desc: DeclarativeNetRequest rule rewrites CORS allow-origin response header
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/header/modify::dnr-modify
      - id: micro-behaviors/communications/http/header/modify::dnr-access-control-allow-origin-set
  - id: dnr-referer-header-set
    for:
      - javascript
    desc: DNR sets Referer header
    crit: notable
    conf: 0.8
    all:
      - id: micro-behaviors/communications/http/header/custom::referer-header-context
      - id: micro-behaviors/communications/http/header/modify::dnr-set-operation
    near_bytes: 240
  - id: dnr-cors-credentials-rewrite
    for:
      - javascript
    desc: DeclarativeNetRequest rule rewrites credentialed CORS response headers
    crit: notable
    conf: 0.92
    all:
      - id: micro-behaviors/communications/http/header/modify::dnr-cors-origin-rewrite
      - id: micro-behaviors/communications/http/header/modify::dnr-access-control-credentials-set
  - id: dnr-access-control-allow-origin-set
    for:
      - javascript
    desc: DNR sets Access-Control-Allow-Origin response header
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/header/cors::access-control-allow-origin-header
      - id: micro-behaviors/communications/http/header/modify::dnr-set-operation
    near_bytes: 240
  - id: dnr-access-control-allow-methods-set
    for:
      - javascript
    desc: DNR sets Access-Control-Allow-Methods response header
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/header/cors::access-control-allow-methods-header
      - id: micro-behaviors/communications/http/header/modify::dnr-set-operation
    near_bytes: 240
  - id: dnr-access-control-allow-headers-set
    for:
      - javascript
    desc: DNR sets Access-Control-Allow-Headers response header
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/header/cors::access-control-allow-headers-header
      - id: micro-behaviors/communications/http/header/modify::dnr-set-operation
    near_bytes: 240
  - id: dnr-access-control-expose-headers-set
    for:
      - javascript
    desc: DNR sets Access-Control-Expose-Headers response header
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/header/cors::access-control-expose-headers-header
      - id: micro-behaviors/communications/http/header/modify::dnr-set-operation
    near_bytes: 240
  - id: dnr-cors-permissive-response
    for:
      - javascript
    desc: DNR sets multiple permissive CORS response headers
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/header/modify::dnr-modify
    any:
      - id: micro-behaviors/communications/http/header/modify::dnr-access-control-allow-origin-set
      - id: micro-behaviors/communications/http/header/modify::dnr-access-control-allow-methods-set
      - id: micro-behaviors/communications/http/header/modify::dnr-access-control-allow-headers-set
      - id: micro-behaviors/communications/http/header/modify::dnr-access-control-expose-headers-set
    needs: 2
  - id: dnr-additional-security-header-modification
    desc: DNR adds an additional security-header modification
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/header/modify::dnr-cors-credentials-rewrite
      - id: micro-behaviors/communications/http/header/modify::dnr-sec-fetch-spoof
      - id: micro-behaviors/communications/http/header/modify::dnr-client-hints-remove
      - id: micro-behaviors/communications/http/header/modify::dnr-cors-permissive-response
  - id: dnr-request-context-header-set
    for:
      - javascript
    desc: DNR sets Origin or Referer request header
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/communications/http/header/modify::dnr-modify
    any:
      - id: micro-behaviors/communications/http/header/modify::dnr-referer-header-set
      - id: micro-behaviors/communications/http/header/modify::dnr-origin-header-set
    unless:
      - id: well-known/app/productivity/web-to-epub::wte-extension-context
      - id: micro-behaviors/communications/http/header/modify::dnr-origin-empty-set
  - id: dnr-cors-request-context-rewrite
    desc: DNR rewrites CORS and request-context headers
    crit: notable
    conf: 0.95
    for:
      - javascript
    all:
      - id: micro-behaviors/communications/http/header/modify::dnr-cors-origin-rewrite
      - id: micro-behaviors/communications/http/header/modify::dnr-request-context-header-set
    any:
      - id: micro-behaviors/communications/http/header/modify::dnr-additional-security-header-modification
    unless:
      - id: well-known/app/browser-extension/translator::translator-security-context
  - id: dnr-security-strip-permissive-header-context
    desc: DNR removes security headers with wildcard CORS
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/intercept::declarative-net-request-update
      - id: micro-behaviors/communications/http/header/modify::dnr-security-header-remove
    any:
      - id: micro-behaviors/communications/http/header/cors::dnr-wildcard-cors-response
