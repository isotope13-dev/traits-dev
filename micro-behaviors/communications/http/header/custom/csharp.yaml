# Server-side .NET handlers that decode a request-header value directly. The
# header name is deliberately unconstrained: private tasking protocols routinely
# rename it, while the dataflow from Headers[...] into FromBase64String remains.
defaults:
  platforms: [windows]
  for: [csharp]
  crit: notable
  conf: 0.97
  attack: T1071.001
  mbc: C0002

traits:
  - id: dotnet-base64-request-header
    desc: Base64-decodes a .NET HTTP request header
    if:
      type: text
      regex: 'Convert\.FromBase64String\s*\(\s*[A-Za-z_][A-Za-z0-9_]*(\.Request)?\.Headers\s*\['
