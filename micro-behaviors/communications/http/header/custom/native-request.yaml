defaults:
  platforms: [unix, android]
  for: [elf]

traits:
  - id: native-forwarded-for-header
    desc: Native HTTP X-Forwarded-For header reference
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)X-Forwarded-For\s*:'
    unless:
      - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-native-runtime
      - id: well-known/tool/detection/malcontent::malcontent-defensive-scanner-context

  - id: maxint-http-content-length-header
    desc: Max signed-integer HTTP Content-Length header
    crit: notable
    conf: 0.96
    platforms: [unix]
    if:
      type: text
      exact: 'Content-Length: 2147483647'
      section: rodata
