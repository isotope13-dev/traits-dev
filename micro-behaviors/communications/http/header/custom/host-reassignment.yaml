# HTTP forwarding-header context belongs with HTTP headers, not host names.
defaults:
  crit: notable
  platforms: [linux, macos, windows]
  for: [javascript, typescript, scripts]
composite_rules:
  - id: host-reassignment-near-forwarded-host
    desc: URL host reassignment near forwarding header
    conf: 0.94
    near_lines: 20
    all:
      - id: micro-behaviors/communications/url/construction/fragment::url-host-property-assignment
      - id: micro-behaviors/communications/http/header/custom::x-forwarded-host
