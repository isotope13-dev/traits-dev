# Variable names do not establish wallet secrets. Keep the request-header
# operation neutral; wallet-source evidence belongs in consuming objectives.
# Bind the header map to fetch's options argument, rather than scanning across
# a completed call into response headers or a neighboring JSON response body.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: fetch-header-seed-variable
    desc: Fetch header takes a seed-named value
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: [(identifier) @fetch
                     (member_expression property: (property_identifier) @fetch)]
          arguments: (arguments . (_) . (object
            (pair key: [(property_identifier) (string)] @headers
              value: (object
                (pair value: (_) @value)))))) @request
        (#eq? @fetch "fetch")
        (#match? @headers "^[\"']?headers[\"']?$")
        (#match? @value "^seed([^a-zA-Z0-9_$]|$)"))

  - id: fetch-header-mnemonic-variable
    desc: Fetch header takes a mnemonic-named value
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: [(identifier) @fetch
                     (member_expression property: (property_identifier) @fetch)]
          arguments: (arguments . (_) . (object
            (pair key: [(property_identifier) (string)] @headers
              value: (object
                (pair value: (_) @value)))))) @request
        (#eq? @fetch "fetch")
        (#match? @headers "^[\"']?headers[\"']?$")
        (#match? @value "^mnemonic([^a-zA-Z0-9_$]|$)"))
