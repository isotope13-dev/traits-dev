defaults:
  platforms: [macos]
  for: [applescript, shell, macho]
traits:
- id: build-id-header
  desc: BuildID HTTP header-name syntax
  crit: notable
  conf: 0.9
  unless:
  - id: metadata/lang/generated::python-protobuf-stub
  - id: metadata/lang/generated::python-mypy-protobuf-generated
  if:
    type: text
    # Qualified debug types such as zig.BuildId:Payload are not headers.
    regex: "(?i)(^|[^A-Za-z0-9_.])buildid:"
