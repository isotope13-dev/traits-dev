defaults:
  platforms: [macos]
  for: [applescript, shell]
traits:
- id: build-id-header
  desc: BuildID HTTP header label
  crit: notable
  conf: 0.9
  unless:
  - id: metadata/lang/generated::python-protobuf-stub
  - id: metadata/lang/generated::python-mypy-protobuf-generated
  if:
    type: text
    regex: "(?i)buildid:"
