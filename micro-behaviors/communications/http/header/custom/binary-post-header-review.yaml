---
defaults:
  crit: notable
  for:
  - shell
  - python
  platforms:
  - unix
traits:
- id: curl-filename-header-option
  desc: Sets an X-Filename HTTP header
  conf: 0.86
  if:
    type: text
    regex: '-H\s+["'']X-Filename:'
- id: pe-filename-header
  desc: PE X-Filename header
  conf: 0.92
  for:
  - pe
  - dll
  platforms:
  - windows
  if:
    type: text
    substr: 'X-Filename:'
