defaults:
  for: [python]
  platforms: [unix, windows]
traits:
  - id: nextjs-middleware-subrequest-name
    desc: Next.js middleware subrequest header name
    crit: notable
    conf: 0.99
    if:
      type: literal
      exclude_docstrings: true
      exact: x-middleware-subrequest

  - id: nextjs-server-action-header-name
    desc: Next.js server action header name
    crit: notable
    conf: 0.99
    if:
      type: literal
      exclude_docstrings: true
      regex: '(?i)^Next-Action$'
