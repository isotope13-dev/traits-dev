# Explicit Host header construction is a neutral protocol capability.  In a
# gated package callback it is useful evidence that the destination identity
# is supplied independently of the socket or URL endpoint.
defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: source-explicit-host-header
    desc: Source constructs an explicit HTTP Host header
    if:
      type: string_literal
      regex: '(^|\r?\n)Host:\s*[A-Za-z0-9.-]+[.]([A-Za-z]{2,}|example)(:\d+)?(\r?\n|$)'

  - id: swift-host-header-setter
    desc: Swift sets HTTP Host header
    for: [swift]
    if:
      type: text
      regex: 'forHTTPHeaderField\s*:\s*[''"]Host[''"]'

  - id: objc-host-header-setter
    desc: Objective-C sets HTTP Host header
    for: [objc, objectivec]
    if:
      type: text
      regex: 'forHTTPHeaderField\s*:\s*@[''"]Host[''"]'

composite_rules:
  - id: source-host-header-setter
    desc: Source sets HTTP Host header
    any:
      - id: swift-host-header-setter
      - id: objc-host-header-setter
