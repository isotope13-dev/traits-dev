defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
traits:

  - id: gcp-metadata-flavor-header
    desc: References the GCP Metadata-Flavor header
    crit: notable
    conf: 0.9
    for: [python, scripts, source, javascript, typescript]
    if:
      type: text
      substr: Metadata-Flavor
