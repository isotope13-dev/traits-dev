defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-cloudfront-header-reversed-value
    desc: CloudFront header value reverses data
    crit: notable
    conf: 0.97
    if:
      type: text
      # A colon ends the value at the next header; an unrelated reversal
      # elsewhere in the request must not supply the concealment evidence.
      regex: '[''"](?i:x-amz-cf-(id|pop))[''"]\s*:\s*[\w$]+\.[^:;{}]{0,80}\.reverse\('
