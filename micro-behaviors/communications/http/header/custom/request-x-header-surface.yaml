defaults:
  platforms: [unix, windows]
  crit: notable

traits:
  - id: binary-custom-x-header-name
    desc: Non-standard multi-part X- HTTP header token
    conf: 0.82
    for: [elf, macho, pe, dll, so, dylib, c, cpp]
    if:
      type: text
      regex: '\bX-[A-Z][A-Za-z0-9]{1,15}-[A-Z][A-Za-z0-9-]{1,20}\b'
    not:
      - substr: X-Forwarded-
      - substr: X-Frame-Options
      - substr: X-Content-Type-Options
      - substr: X-XSS-Protection
      - substr: X-Requested-With
      - substr: X-Powered-By
      - substr: X-Real-IP
      - substr: X-UA-Compatible
      - substr: X-Request-ID
      - substr: X-Request-Id
      - substr: X-Permitted-Cross-Domain
      - substr: X-Download-Options
      - substr: X-DNS-Prefetch-Control
      - substr: X-Robots-Tag

  - id: go-request-x-header-get
    desc: Go handler reads custom X- request header
    conf: 0.9
    for: [go]
    if:
      type: text
      exclude_comments: true
      regex: '\.Header\.(Get|Values)\s*\(\s*["`]X-[A-Za-z0-9-]+["`]\s*\)'

  - id: python-request-x-header-get
    desc: Python handler reads custom X- request header
    conf: 0.9
    for: [python]
    if:
      type: text
      exclude_comments: true
      regex: '(headers|environ)\s*(\.get\s*\(|\[)\s*["\x27](HTTP_)?[Xx]-[A-Za-z0-9_-]+'

  - id: js-request-x-header-get
    desc: JS handler reads custom X- request header
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      exclude_comments: true
      regex: '\b(req(uest)?|event)(\.headers)?(\s*\[|\.(get|header)\s*\()\s*["\x27`][Xx]-'
