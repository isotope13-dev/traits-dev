# Servlet-side header reads. `getHeader(name)` is the only way a Java web
# component inspects an inbound request header, so it is the surface both
# ordinary applications and request-gated backdoors use to look at User-Agent,
# Referer or a private trigger header.
defaults:
  platforms: [unix, windows]
  for: [java, kotlin, groovy, scala, html, javascript, python, vbs]
  crit: notable
  conf: 0.82

traits:
  # Java call facts carry no receiver, so a bare `getHeader` matched every
  # unrelated API of that name — bnd reads OSGi manifest headers with
  # `bnd.getHeader(Constants.EXPORT, file)`, and CSV/table/mail libraries all
  # define one. Requiring a string-literal argument keeps the servlet reads
  # that matter here (a request-gated backdoor names its trigger header) while
  # dropping the variable-keyed lookups those other APIs use.
  - id: servlet-get-header-call
    desc: Java servlet reads a named request header
    mbc: C0002
    for: [java, kotlin, groovy, scala]
    if:
      type: symbol
      kind: call
      exact: getHeader
      arg:
        kind: string

  - id: windchill-command-header
    desc: Servlet reads Windchill command header
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'getHeader\s*\(\s*["'']X-windchill-req["'']\s*\)'
