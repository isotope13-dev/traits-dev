defaults:
  platforms:
  - unix
  - windows
  for:
  - java
  - kotlin
  - groovy
  - scala
  - html
  - javascript
  - python
  - vbs
  crit: notable
  conf: 0.82
traits:
- id: servlet-get-header-call
  desc: Java servlet reads a named request header
  mbc: C0002
  for:
  - java
  - kotlin
  - groovy
  - scala
  if:
    type: symbol
    kind: call
    exact: getHeader
    arg:
      kind: string
- id: windchill-command-header
  desc: Servlet reads Windchill command header
  conf: 0.97
  if:
    type: text
    regex: getHeader\s*\(\s*["']X-windchill-req["']\s*\)
- id: windchill-param-header
  desc: Servlet reads Windchill parameter header
  conf: 0.95
  if:
    type: text
    regex: getHeader\s*\(\s*["']X-windchill-prm["']\s*\)
