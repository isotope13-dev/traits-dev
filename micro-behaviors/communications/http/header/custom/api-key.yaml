# Bare `api-key` request header field (not X-API-Key). Observed on MacSync-class
# C2/exfil clients and reusable by non-curl HTTP libraries.
defaults:
  platforms: [macos, linux, windows]
  for: [scripts, source]
  crit: notable
  mbc: C0002
  attack: T1071.001

traits:
  - id: api-key-header-map-entry
    desc: Configures a bare api-key request header
    conf: 0.9
    if:
      type: text
      regex: '["'']api-key["'']\s*:'
      case_insensitive: true
