# Protocol fields, independently useful without a family or attacker claim.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.96

traits:
  - id: x25519-key-exchange-header-field
    desc: X-KEX header field specifies X25519
    if:
      type: text
      regex: '(?i)\bX-KEX([ \t]*:[ \t]*|["''][ \t]*:[ \t]*["''])x25519\b'

  - id: x25519-key-exchange-header-setter
    desc: Sets X-KEX field to X25519
    for: [csharp, java, go, javascript, typescript, python]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(Add|Set|setRequestHeader|setRequestProperty|addHeader)$'
      args:
        - index: 0
          kind: string
          regex: '(?i)^X-KEX$'
        - index: 1
          kind: string
          regex: '(?i)^x25519$'

  - id: chunk-index-header-name
    desc: X-Chunk-Index HTTP header-name reference
    if:
      type: text
      word: X-Chunk-Index
      case_insensitive: true

composite_rules:
  - id: x25519-key-exchange-header
    desc: X-KEX header specifies X25519
    any:
      - id: x25519-key-exchange-header-field
      - id: x25519-key-exchange-header-setter
