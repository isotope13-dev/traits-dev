# Android bot check-in headers. StreamRat-class Android RATs open their C2
# channel by upgrading an HTTP GET to WebSocket while attaching bespoke
# device-fingerprint headers (X-Device-Id, X-Device-Model, X-Api-Level). The
# header names are protocol fields of that check-in design and are reusable
# across families that adopt the same pattern.
defaults:
  platforms: [android]
  for: [java, kotlin, apk, dex, zip]
  crit: notable
  conf: 0.9
  attack: T1071.001
  mbc: C0002

traits:
  - id: android-x-device-id-header
    desc: Android sets an X-Device-Id request header
    if:
      type: text
      word: X-Device-Id

  - id: android-x-device-model-header
    desc: Android sets an X-Device-Model request header
    if:
      type: text
      word: X-Device-Model

  - id: android-x-api-level-header
    desc: Android sets an X-Api-Level request header
    if:
      type: text
      word: X-Api-Level
