# x-amz-cf-id and x-amz-cf-pop are headers CloudFront adds to its own
# responses; a client header map setting them makes a request look like CDN
# traffic. Neutral alone: edge functions and test fixtures name them too.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: js-cloudfront-header-map-entry
    desc: Header map sets a CloudFront x-amz-cf field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '[''"]x-amz-cf-(id|pop)[''"]\s*:'
