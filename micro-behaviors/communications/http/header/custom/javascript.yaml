defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
traits:
- id: meta-asbd-id-header
  desc: References Meta X-ASBD-ID API header
  conf: 0.96
  if:
    type: text
    word: x-asbd-id
    case_insensitive: true
- id: instagram-private-api-headers
  desc: References Instagram private API headers
  conf: 0.96
  if:
    type: text
    regex: x-instagram-ajax|x-ig-www-claim
    case_insensitive: true
- id: base64-json-request-header
  desc: Parses Base64 JSON from request header
  conf: 0.98
  if:
    type: text
    substr: JSON.parse(Buffer.from(String(req.headers[
- id: x-request-id-header-map-entry
  desc: Configures an X-Request-Id HTTP header
  conf: 0.9
  if:
    type: text
    regex: '["'']X-Request-Id["'']\s*:'
    case_insensitive: true
- id: x-client-context-header-map-entry
  desc: Configures an X-Client-Context header
  conf: 0.94
  if:
    type: text
    regex: '["'']x-client-context["'']\s*:'
    case_insensitive: true
- id: x-download-password-header
  desc: X-Download-Password request header
  conf: 0.94
  if:
    type: text
    word: X-Download-Password
- id: csrf-token-header-from-variable
  desc: Sends anti-CSRF token header from variable
  conf: 0.92
  if:
    type: text
    regex: '["'']X-[CX]SRF-TOKEN["'']\s*:\s*[A-Za-z_$][\w$]*\s*[,}]'
    case_insensitive: true
