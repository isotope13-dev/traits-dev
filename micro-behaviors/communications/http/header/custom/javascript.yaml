defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: base64-json-request-header
    desc: Parses Base64 JSON from request header
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'JSON\.parse\(Buffer\.from\(String\(req\.headers\['

  - id: x-request-id-header-map-entry
    desc: Configures an X-Request-Id HTTP header
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']X-Request-Id["'']\s*:'
      case_insensitive: true
  - id: x-access-key-header-map-entry
    desc: Configures an X-Access-Key HTTP header
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']X-Access-Key["'']\s*:'
      case_insensitive: true

  - id: x-client-context-header-map-entry
    desc: Configures an X-Client-Context header
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '["'']x-client-context["'']\s*:'
      case_insensitive: true

  - id: x-download-password-header
    desc: X-Download-Password request header
    crit: notable
    conf: 0.94
    if:
      type: text
      word: X-Download-Password

  # Misspelled authorization-like header used by several remote JSON loaders.
  # Keep the atom neutral: only composites can infer what the response does.
  - id: bearrtoken-header-map-entry
    desc: Configures a misspelled bearrtoken HTTP header
    crit: suspicious
    conf: 0.98
    attack: T1071.001
    if:
      type: text
      regex: 'headers\s*:\s*\{[\s\S]{0,80}bearrtoken\s*:\s*["''][\w-]{1,32}["'']'
