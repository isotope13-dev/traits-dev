# A custom header name reference establishes no response direction or payload execution.
traits:
- platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
  mbc: C0002
  id: x-payload-header-prefix
  desc: HTTP x-payload header prefix
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)x-payload(-b64)?\b
