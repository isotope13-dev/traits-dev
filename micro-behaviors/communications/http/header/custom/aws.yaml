defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, text, data, json]
traits:
  - id: aws-imds-token-header
    desc: AWS EC2 metadata token header
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: X-aws-ec2-metadata-token

  - id: aws-imds-token-ttl-header
    desc: AWS EC2 metadata token TTL header
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: X-aws-ec2-metadata-token-ttl-seconds
