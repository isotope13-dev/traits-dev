defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript, powershell, go, pe, elf]

traits:
  - id: x-forwarded-host
    desc: X-Forwarded-Host proxy header
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      type: literal
      substr: X-Forwarded-Host

  - id: custom-token-header
    desc: Sets custom X-prefixed token header
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)["'']X-[A-Za-z0-9_-]{2,24}(Token|Key|Auth)["'']\s*:'

  - id: custom-owner-identity-header
    desc: Custom HTTP owner identity header
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)X-[A-Za-z0-9_-]{0,24}(Owner|Client|Device|User)[-_]?ID\s*:'

  - id: x-machine-id-header
    desc: X-Machine-Id host identity header
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)\bX-Machine-Id\s*:'

  - id: application-user-agent
    desc: Application-specific User-Agent header
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)["'']User-Agent["'']\s*:\s*["''][A-Za-z][A-Za-z0-9._-]{2,40}/[0-9]+(\.[0-9]+){0,3}["'']'

  # Non-Mozilla UA values are ordinary for app clients; Ray's browser-deny
  # heuristic is intent that composites supply (CVE-2025-62593 objectives).
  - id: non-mozilla-user-agent-header
    desc: Sets a non-Mozilla User-Agent header
    crit: notable
    conf: 0.9
    if:
      type: text
      # Linear-time engine: no lookaround. Match a User-Agent assignment, then
      # exclude the Mozilla prefix Ray's deny_browser_requests checks for.
      regex: '(?i)["'']User-Agent["'']\s*:\s*["''][A-Za-z0-9._/+ -]{1,64}["'']'
    not:
      - regex: '(?i)["'']User-Agent["'']\s*:\s*["'']Mozilla'
    unless:
      - type: text
        substr: User-Agent","axios/
      - type: text
        substr: User-Agent":"axios/
      - type: text
        substr: X-Stainless-Lang
      - type: text
        substr: "user-agent': 'vscode-ripgrep"
      - id: well-known/tool/development/stainless::stainless-generated-sdk
      - id: well-known/tool/sysadmin/ripgrep::vscode-scoped-ripgrep-package-path
      - id: well-known/app/development/vscode-extension/saropa-lints::vibrancy-user-agent
      - id: well-known/app/development/vscode-extension/saropa-lints::saropa-lints-extension-context
      - id: well-known/app/ai/usage/ai-box::ai-box-extension-context
