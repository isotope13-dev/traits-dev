---
defaults:
  crit: notable
  conf: 0.9
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - typescript
  - powershell
  - go
  - pe
  - elf
traits:
- id: custom-owner-identity-header
  desc: Custom HTTP owner identity header
  for:
  - scripts
  - source
  if:
    type: text
    regex: "(?i)X-[A-Za-z0-9_-]{0,24}(Owner|Client|Device|User)[-_]?ID\\s*:"
- id: host-identity-header
  desc: HTTP machine or device identity header
  if:
    type: text
    regex: "(?i)\\bX-(Machine-ID|MachineId|HWID|Device-ID)\\s*:"
