defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript, powershell, go, pe, elf]
traits:
  - id: x-forwarded-host
    desc: X-Forwarded-Host proxy header
    for: [scripts, source]
    if:
      type: literal
      substr: X-Forwarded-Host
  - id: custom-token-header
    desc: Sets custom X-prefixed token header
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)["'']X-[A-Za-z0-9_-]{2,24}(Token|Key|Auth)["'']\s*:'
  - id: custom-owner-identity-header
    desc: Custom HTTP owner identity header
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)X-[A-Za-z0-9_-]{0,24}(Owner|Client|Device|User)[-_]?ID\s*:'
  - id: x-machine-id-header
    desc: X-Machine-Id host identity header
    if:
      type: text
      regex: '(?i)\bX-Machine-Id\s*:'
