defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript, powershell, go, pe, elf]

traits:
  - id: custom-token-header
    desc: Custom HTTP token header line
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)X-[A-Za-z0-9_-]{2,24}(Token|Key|Auth)\s*:'

  - id: custom-owner-identity-header
    desc: Custom HTTP owner identity header
    crit: notable
    conf: 0.9
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)X-[A-Za-z0-9_-]{0,24}(Owner|Client|Device|User)[-_]?ID\s*:'

  - id: application-user-agent
    desc: Application-specific User-Agent header
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)["'']User-Agent["'']\s*:\s*["''][A-Za-z][A-Za-z0-9._-]{2,40}/[0-9]+(\.[0-9]+){0,3}["'']'
