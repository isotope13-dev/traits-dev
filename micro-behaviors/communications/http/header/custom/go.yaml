defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: go-spoof-headers-symbol
    desc: Go header-spoofing routine symbol
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: main.spoofHeaders
      section: .gopclntab
  - id: go-content-type-set
    desc: Sets HTTP Content-Type header
    # Source call syntax, not a compiled artifact: `.Header.Set(` is written
    # in Go and compiled away, leaving only the "Content-Type" literal. The
    # file default is elf for its sibling .gopclntab symbol trait; this one
    # only ever matches Go source, which is all its consumers ask for.
    for: [go]
    if:
      type: text
      regex: '\.Header\.Set\s*\(\s*"Content-Type"\s*,'
