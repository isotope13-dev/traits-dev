defaults:
  platforms: [linux]
  for: [elf]
traits:
  - id: go-spoof-headers-symbol
    desc: Go header-spoofing routine symbol
    crit: notable
    conf: 0.96
    if:
      type: text
      exact: main.spoofHeaders
      section: .gopclntab
  - id: go-content-type-set
    desc: Sets HTTP Content-Type header
    if:
      type: text
      regex: '\.Header\.Set\s*\(\s*"Content-Type"\s*,'
