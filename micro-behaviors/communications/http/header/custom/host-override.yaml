# Explicit HTTP authority overrides. These are neutral client mechanics: they
# are common in virtual-host tests and reverse-proxy tooling, but materially
# useful in triage because the server authority no longer follows the URL.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  attack: T1071.001

traits:
  # Command arguments are available as parsed symbols, so this observes an
  # actual curl invocation rather than matching a command quoted in prose or a
  # comment.
  - id: curl-host-header-argument
    desc: curl request supplies an explicit Host header
    conf: 0.96
    for: [shell, batch, powershell]
    if:
      type: symbol
      kind: call
      regex: '(?i)^curl(\.exe)?$'
      arg:
        kind: string
        regex: '(?i)^Host\s*:'

  # Requests and other mapping-based clients express custom headers as a
  # dictionary/object entry. Keep this as a capability atom: only objective
  # composites should interpret why the caller separates Host from its URL.
  - id: host-header-map-entry
    desc: Request header map overrides the Host header
    conf: 0.9
    for: [python, javascript, typescript, ruby]
    if:
      type: text
      regex: '(?i)\bheaders?\s*[:=]\s*\{[^}\r\n]{0,240}["'']Host["'']\s*(:|=>)'
