defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, go, java, csharp, ruby]

traits:
  - id: powered-by-response-header-read
    desc: Reads X-Powered-By response header
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(headers?\.get|getheader)$'
      arg:
        kind: string
        regex: '(?i)^X-Powered-By$'
