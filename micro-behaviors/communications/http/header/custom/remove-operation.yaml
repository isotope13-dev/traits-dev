defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, json]
  crit: notable
  conf: 0.88
traits:
  - id: header-before-remove-operation
    desc: Header field precedes a remove operation
    if:
      type: text
      regex: '["'']?header["'']?\s*:[^{}]{0,80}operation["'']?\s*:\s*["'']remove'
      case_insensitive: true
  - id: remove-operation-before-header
    desc: Remove operation precedes a header field
    if:
      type: text
      regex: 'operation["'']?\s*:\s*["'']remove["''][^{}]{0,80}header["'']?\s*:'
      case_insensitive: true
composite_rules:
  - id: header-remove-operation
    desc: Header rule specifies a remove operation
    any:
      - id: header-before-remove-operation
      - id: remove-operation-before-header
