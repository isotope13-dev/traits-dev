# Binary data POST upload patterns
defaults:
  crit: notable
  for: [shell, python]
  platforms: [unix]

traits:
  - id: curl-filename-header-option
    desc: Sets an X-Filename HTTP header
    conf: 0.86
    if:
      type: text
      regex: '-H\s+["'']X-Filename:'
  - id: pe-filename-header
    desc: PE X-Filename header
    conf: 0.92
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      substr: "X-Filename:"
  - id: pe-browser-type-header
    desc: PE X-Browser-Type header
    conf: 0.94
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      substr: "X-Browser-Type:"
  - id: pe-profile-name-header
    desc: PE X-Profile-Name header
    conf: 0.94
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      substr: "X-Profile-Name:"
