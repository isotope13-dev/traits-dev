defaults:
  platforms: [unix, windows]
traits:
- id: traceparent-header-string
  desc: W3C traceparent header name literal
  crit: notable
  conf: 0.8
  for: [c, elf]
  if:
    type: text
    regex: '(?i)\btraceparent\b'
  unless:
    - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-native-runtime
    - id: well-known/lib/network/grpc-ruby::grpc-ruby-c-extension-artifact
