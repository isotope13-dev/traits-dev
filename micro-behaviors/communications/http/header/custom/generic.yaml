defaults:
  platforms: [unix, windows]
  for: [python, javascript, powershell, rust, pe, elf]
  mbc: C0002
  attack: T1071.001
traits:
  - id: python-request-add-header
    desc: Python HTTP request adds header
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: symbol
      kind: call
      exact: req.add_header
  - id: request-spec-headers-lookup
    desc: Reads headers from HTTP request specification
    crit: notable
    conf: 0.84
    for: [python]
    if:
      type: text
      substr: 'spec.get("headers"'
  - id: python-request-header-map-copy
    desc: Copies complete Python request headers
    crit: notable
    conf: 0.95
    for: [python]
    if:
      type: text
      regex: 'dict\s*\(\s*request\.headers\s*\)'
  - id: python-payload-header-map
    desc: Python header map carries data field
    crit: notable
    conf: 0.9
    for: [python]
    if:
      type: text
      regex: '(?is)\bheaders.{0,300}["''](x[-_])?(archive|payload|data|filename)["'']\s*:'
  - id: csp-response-header-read
    desc: Reads Content-Security-Policy response header
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      substr: headers.get
      arg:
        kind: string
        exact: content-security-policy
  # Co-occurrence of Content-Length and chunked Transfer-Encoding headers. Present
  # in any HTTP stack that handles both (node, proxies); the request-smuggling
  # (CL.TE desync) intent is supplied by composites that add an exploit target.
  - id: http-content-length-te-chunked
    desc: Content-Length + chunked Transfer-Encoding
    crit: notable
    conf: 0.6
    if:
      type: text
      regex: 'Content-Length:[\s\S]{0,120}Transfer-Encoding: chunked'
  - id: json-content-type-charset
    desc: JSON content type charset
    crit: baseline
    conf: 0.75
    if:
      type: string_literal
      regex: application/json.{0,50}charset=utf-8
  - id: dense-request-header-set
    desc: Dense HTTP request headers in small binary
    crit: notable
    conf: 0.88
    for: [pe, elf, macho]
    size_max: 100000
    per_kb_min: 0.3
    unless:
      - type: text
        substr: "->read_response_header"
      - type: text
        substr: "Django's URL keyword arguments to determine the version."
      - id: well-known/lib/crypto/oauth::oauthlib-rfc6749-source
      - id: metadata/package/testing/presence/harness::python-test-file
      - id: metadata/package/testing/presence/path::test-spec-path-benign-context
    if:
      type: text
      regex: '(?i)(User-Agent:\s|Host:\s)'
  - id: headers-encoding
    desc: Accept-Encoding header
    crit: baseline
    conf: 0.66
    if:
      type: text
      substr: Accept-Encoding
  - id: host-header-override
    desc: Explicit HTTP Host header override
    crit: notable
    conf: 0.85
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)(headers?\.(set|add)|setRequestHeader)\(\s*["'']Host["'']'
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
  - id: referer-header
    desc: HTTP Referer header
    crit: notable
    conf: 0.6
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)\bReferer\s*:'
  - id: sec-fetch-request-header
    desc: Sec-Fetch request header literal
    crit: notable
    conf: 0.8
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)\bSec-Fetch-(Dest|Mode|Site)\s*:'
  - id: utf16-referer-header-pe
    desc: UTF-16 Referer header in PE
    crit: notable
    conf: 0.85
    for: [pe, dll]
    if:
      type: hex
      section: .rdata
      pattern: 52 00 65 00 66 00 65 00 72 00 65 00 72 00 3A 00
  - id: google-homepage-url
    desc: Google homepage URL
    crit: notable
    conf: 0.78
    for: [scripts, binaries]
    if:
      type: text
      exact: https://www.google.com/
  - id: x-forwarded-for
    desc: X-Forwarded-For proxy header
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: "X-Forwarded-For"
  - id: php-server-x-forwarded-for
    desc: PHP reads X-Forwarded-For server header
    crit: notable
    conf: 0.8
    for: [php]
    if:
      type: string_literal
      substr: HTTP_X_FORWARDED_FOR
  - id: php-server-http-client-ip
    desc: PHP reads HTTP client IP server header
    crit: notable
    conf: 0.8
    for: [php]
    if:
      type: string_literal
      substr: HTTP_CLIENT_IP
  - id: x-real-ip
    desc: X-Real-IP proxy header
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: "X-Real-IP"
  - id: boundary-param
    desc: Contains an HTTP multipart boundary parameter
    crit: baseline
    conf: 0.5
    if:
      type: text
      substr: boundary=
  - id: content-length-template
    desc: Content-Length printf template
    crit: baseline
    conf: 0.55
    if:
      type: text
      exact: 'Content-Length: %d'
  - id: content-disposition-filename
    desc: File-download response (Content-Disposition)
    crit: baseline
    conf: 0.5
    for: [python, javascript, powershell, rust, php, pe, elf]
    if:
      type: text
      regex: Content-Disposition.{0,30}filename
  - id: form-data-header
    desc: HTTP multipart form-data header
    crit: notable
    conf: 0.5
    for: [binaries, c, cpp, csharp, rust, go, python, php]
    if:
      type: text
      substr: 'Content-Disposition: form-data'
  # Setting the anti-CSRF header from the page's own meta tag is how a
  # same-origin XHR/fetch proves it is calling its own app's backend with the
  # current session's credentials, not an attacker-controlled endpoint: a
  # remote C2 server does not issue or check the victim page's CSRF token.
  - id: js-csrf-token-header-from-meta
    desc: Sets anti-CSRF header from page meta tag
    crit: notable
    conf: 0.9
    for: [javascript, typescript, html]
    if:
      type: text
      regex: "(?i)setRequestHeader\\(\\s*['\"]x-csrf-token['\"]\\s*,\\s*\\$\\(['\"]meta"
composite_rules:
  - id: google-homepage-referer
    for: [elf, pe, python, javascript, powershell]
    desc: Google homepage Referer header
    crit: notable
    conf: 0.82
    all:
      - id: google-homepage-url
    any:
      - id: referer-header
      - id: utf16-referer-header-pe
  - id: bot-headers
    desc: Bot identification HTTP headers
    crit: notable
    conf: 0.7
    any:
      - id: micro-behaviors/communications/http/header/implant-id
    unless:
      - id: well-known/dual-use/transfer/aria2::aria2-downloader-context
  # `content-disposition-filename` is deliberately NOT a leg here. It is named
  # and described for the opposite direction -- "File-download response
  # (Content-Disposition)" -- and matches `Content-Disposition: attachment;
  # filename=`, which is how a server streams a file *out*. Including it made
  # every download endpoint report an inbound upload; it scored the ASP file
  # packer in the tennc collection, whose only Content-Disposition is the
  # `attachment; filename=` it sends to the browser. The three legs kept below
  # are upload-only spellings: the multipart content type, its boundary
  # parameter, and the `form-data` disposition that appears inside a part.
  - id: multipart-upload
    desc: Multipart form data upload
    crit: notable
    conf: 0.6
    any:
      - id: micro-behaviors/communications/http/form::multipart-form
      - id: boundary-param
      - id: form-data-header
  - id: file-upload-headers
    desc: HTTP file upload header stack
    crit: notable
    conf: 0.78
    all:
      - id: multipart-upload
    any:
      - id: content-length-template
      - id: micro-behaviors/communications/email/mime::mime-octet-stream
      - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-com
      - id: micro-behaviors/communications/http/post::url-encoded-content-type
    needs: 2
