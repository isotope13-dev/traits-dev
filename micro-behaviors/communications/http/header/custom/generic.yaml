---
defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  - javascript
  - powershell
  - rust
  - pe
  - elf
  mbc: C0002
  attack: T1071.001
traits:
- id: request-spec-headers-lookup
  desc: Reads headers from HTTP request specification
  crit: notable
  conf: 0.84
  for:
  - python
  if:
    type: text
    substr: spec.get("headers"
- id: python-request-header-map-copy
  desc: Copies complete Python request headers
  crit: notable
  conf: 0.95
  for:
  - python
  if:
    type: text
    regex: dict\s*\(\s*request\.headers\s*\)
- id: python-payload-header-map
  desc: Python header map carries data field
  crit: notable
  conf: 0.9
  for:
  - python
  if:
    type: text
    regex: '(?i)headers["'']?\s*[=:]\s?\{[^{}]{0,300}["''](x.)?(archive|payload|data|filename)["'']\s*:'
- id: request-header-token-density
  desc: HTTP header-token density in small binary
  crit: notable
  conf: 0.88
  for:
  - pe
  - elf
  - macho
  size_max: 100000
  per_kb_min: 0.3
  unless:
  - type: text
    substr: "->read_response_header"
  - type: text
    substr: Django's URL keyword arguments to determine the version.
  - id: well-known/lib/crypto/oauth::oauthlib-rfc6749-source
  - id: metadata/package/testing/presence/harness::python-test-file
  - id: metadata/package/testing/presence/path::test-spec-path-benign-context
  if:
    type: text
    regex: "(?i)(User-Agent:\\s|Host:\\s)"
- id: referer-header
  desc: HTTP Referer header
  crit: notable
  conf: 0.6
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: "(?i)\\bReferer\\s*:(\\s*[A-Za-z]+)?"
  not:
  - regex: referer\s*:\s*(string|boolean|number|any)\b
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: sec-fetch-request-header
  desc: Sec-Fetch request header literal
  crit: notable
  conf: 0.8
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: "(?i)\\bSec-Fetch-(Dest|Mode|Site)\\s*:"
- id: utf16-referer-header-pe
  desc: UTF-16 Referer header in PE
  crit: notable
  conf: 0.85
  for:
  - pe
  - dll
  if:
    type: hex
    section: ".rdata"
    pattern: 52 00 65 00 66 00 65 00 72 00 65 00 72 00 3A 00
- id: content-disposition-filename
  desc: File-download response (Content-Disposition)
  crit: baseline
  conf: 0.5
  for:
  - python
  - javascript
  - powershell
  - rust
  - php
  - pe
  - elf
  if:
    type: text
    regex: Content-Disposition.{0,40}filename
composite_rules:
- id: google-homepage-referer
  for:
  - elf
  - pe
  - python
  - javascript
  - powershell
  desc: Google homepage Referer header
  crit: notable
  conf: 0.82
  all:
  - id: micro-behaviors/communications/http/services/google::google-homepage-url
  any:
  - id: micro-behaviors/communications/http/header/custom::referer-header
  - id: micro-behaviors/communications/http/header/custom::utf16-referer-header-pe
- id: identity-or-x-prefixed-headers
  desc: Custom identity or X-prefixed header syntax
  crit: notable
  conf: 0.7
  any:
  - id: micro-behaviors/communications/http/header/implant-id
  - id: micro-behaviors/communications/http/header/custom::header-user
  - id: micro-behaviors/communications/http/header/value::x-header-hex-value
  unless:
  - id: well-known/dual-use/transfer/aria2::aria2-downloader-context
