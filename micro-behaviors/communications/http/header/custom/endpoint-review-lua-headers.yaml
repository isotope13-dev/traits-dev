defaults:
  platforms: [netscaler, appliance, unix]
  for: [lua]

traits:
  - id: lua-x-encoded-header-text
    desc: Lua X-Encoded text
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: X-Encoded

  - id: lua-x-payload-type-header-text
    desc: Lua X-Payload-Type text
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: X-Payload-Type

composite_rules:
  - id: lua-collect-encoded-header-profile
    desc: Lua collect path with header text
    crit: notable
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/url/api-path/route::target-url-near-collect-path
      - id: lua-x-encoded-header-text
    any:
      - id: lua-x-payload-type-header-text
