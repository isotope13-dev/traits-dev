# Response cache-validator header access. Reading ETag is a neutral HTTP
# capability; covert tasking intent is supplied by C2 composites that pair it
# with another response header and process execution.
defaults:
  platforms: [unix, windows]
  for: [python]
  attack: T1071.001
  mbc: C0002

traits:
  - id: python-response-etag-header-read
    desc: Python response object reads ETag header
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      regex: '(^|\.)headers\.get$'
      arg:
        kind: string
        regex: '(?i)^ETag$'
    unless:
      - id: metadata/package/testing/presence/fixture::test-filename-pattern
      - type: path
        regex: '[\\/]tests?[\\/]'
