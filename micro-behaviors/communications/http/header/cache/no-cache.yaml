defaults:
  platforms: [unix, windows]
  for: [scripts, source]
traits:
  - id: cache-control-no-cache-header
    desc: HTTP Cache-Control no-cache header literal
    crit: notable
    conf: 0.97
    if:
      type: literal
      regex: '(?i)^Cache-Control:[ \t]*no-cache([, \t\r\n]|$)'
      exclude_docstrings: true
