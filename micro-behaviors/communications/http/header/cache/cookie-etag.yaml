defaults:
  platforms: [unix, windows]
  for: [python, c, cpp, pe, dll]
traits:
  - id: winhttp-query-cookie-constant
    desc: WinHTTP Cookie query constant reference
    crit: notable
    conf: 0.92
    if:
      type: text
      word: WINHTTP_QUERY_COOKIE
  - id: winhttp-query-etag-constant
    desc: WinHTTP ETag query constant reference
    crit: notable
    conf: 0.92
    if:
      type: text
      word: WINHTTP_QUERY_ETAG
composite_rules:
  - id: winhttp-cookie-etag-header-queries
    desc: WinHTTP Cookie and ETag query constant references
    crit: notable
    conf: 0.96
    near_bytes: 2048
    all:
      - id: winhttp-query-cookie-constant
      - id: winhttp-query-etag-constant
  - id: python-set-cookie-etag-response-reads
    desc: Reads both Set-Cookie and ETag response headers in Python
    crit: notable
    conf: 0.97
    for: [python]
    near_lines: 12
    all:
      - id: micro-behaviors/communications/http/cookies::python-response-set-cookie-header-read
      - id: python-response-etag-header-read
  - id: cookie-etag-response-header-clues
    desc: Cookie and ETag query constants or Python response-header reads
    crit: notable
    conf: 0.97
    any:
      - id: winhttp-cookie-etag-header-queries
      - id: python-set-cookie-etag-response-reads
