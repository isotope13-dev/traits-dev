defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
traits:
  - id: cache-policy-revalidation-headers
    desc: Builds HTTP cache revalidation headers
    if:
      type: symbol
      kind: call
      regex: '\.revalidationHeaders$'
  - id: cache-policy-response-headers
    desc: Builds headers for a cached HTTP response
    if:
      type: symbol
      kind: call
      regex: '\.responseHeaders$'
