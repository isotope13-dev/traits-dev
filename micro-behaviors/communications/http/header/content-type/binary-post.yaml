# Binary data POST upload patterns
defaults:
  crit: notable
  for: [shell, python]
  platforms: [unix]

traits:
  - id: pe-octet-stream-content-type
    desc: PE octet-stream content type header
    conf: 0.9
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      substr: "Content-Type: application/octet-stream"
  - id: jpeg-content-type-header
    desc: JPEG content type header
    conf: 0.86
    for: [pe, dll, c, cpp, csharp]
    platforms: [windows]
    if:
      type: text
      regex: '(?i)Content-Type:\s*image/(jpeg|jpg)'
