traits:
- id: form-urlencoded-header-pe
  desc: PE contains form-urlencoded Content-Type header
  crit: notable
  conf: 0.85
  if:
    type: text
    substr: 'Content-Type: application/x-www-form-urlencoded'
  for:
  - pe
  - dll
  platforms:
  - windows
- id: java-json-content-type
  for:
  - class
  desc: JVM string declares JSON content type
  crit: notable
  conf: 0.78
  if:
    type: value
    path: class.strings[*]
    exact: application/json
  platforms:
  - windows
  - unix
  - android
