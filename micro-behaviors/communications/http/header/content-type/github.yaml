defaults:
  platforms: [unix, windows]
traits:
- id: github-json-media-type
  desc: GitHub vendor JSON media-type reference
  crit: notable
  conf: 0.95
  for: [python, python_bytecode, pyc, shell, javascript, typescript]
  if:
    type: text
    regex: 'application/vnd\.github(\.[a-z0-9._+-]+)?\+json'
