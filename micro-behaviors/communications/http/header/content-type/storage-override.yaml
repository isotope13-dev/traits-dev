defaults:
  platforms: [windows, unix]
  for: [scripts, source, html, xml, text]
  crit: notable
  conf: 0.95

traits:
  - id: object-response-html-type-override
    desc: Object storage response HTML type override
    if:
      type: text
      case_insensitive: true
      regex: 'response-?content-?type["'']?\s*[:=]\s*["'']?text(/|%2f)html\b'
