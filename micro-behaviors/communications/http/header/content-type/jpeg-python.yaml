defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: python-call-jpeg-header
    desc: Call supplies JPEG Content-Type header
    # Nested headers dictionaries are not exposed by arg.from.field. Capture
    # the call so composites can require other facts on this same invocation.
    if:
      type: tree-sitter
      language: python
      query: |
        ((call arguments: (argument_list
          (keyword_argument name: (identifier) @kw value: (dictionary
            (pair key: (string) @key value: (string) @value))))) @evidence
          (#eq? @kw "headers")
          (#match? @key "(?i)^['\"]content-type['\"]$")
          (#match? @value "(?i)^['\"]image/jpeg['\"]$"))
