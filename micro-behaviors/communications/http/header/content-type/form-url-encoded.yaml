defaults:
  platforms: [windows, unix]
  for: [python, javascript, powershell, php, html, shell, pe, elf]
  mbc: C0002
  attack: T1071.001
traits:
  - id: url-encoded-content-type
    desc: Uses URL-encoded HTTP form content
    crit: notable
    conf: 0.7
    unless:
      - type: text
        substr: google/protobuf/descriptor.proto
      - id: well-known/lib/vendor-sdk/vungle::vungle-mraid-template-banner
      - type: basename
        exact: System.Net.Http.dll
    if:
      type: text
      substr: application/x-www-form-urlencoded
