defaults:
  platforms: [windows]
  for: [vbs, asp, html]

traits:
  - id: http-content-type-application-hta
    desc: Sets HTTP Content-Type to application/hta
    crit: notable
    conf: 0.96
    for: [vbs, asp, html, javascript, php, python]
    if:
      type: text
      regex: '(ContentType|Content-Type)\s*[:=]\s*["'']?application/hta\b'
      case_insensitive: true

  - id: chr-frag-on-slash
    desc: Chr-encoded fragment matching "on/"
    crit: component
    conf: 0.75
    if:
      type: text
      regex: 'chrw?\(\s*(79|111)\s*\)\s*[&+]\s*chrw?\(\s*(78|110)\s*\)\s*[&+]\s*chrw?\(\s*47\s*\)'
      case_insensitive: true

  - id: chr-frag-hta-word
    desc: Chr-encoded fragment matching "hta"
    crit: component
    conf: 0.8
    if:
      type: text
      regex: 'chrw?\(\s*(72|104)\s*\)\s*[&+]\s*chrw?\(\s*(84|116)\s*\)\s*[&+]\s*chrw?\(\s*(65|97)\s*\)'
      case_insensitive: true

composite_rules:
  - id: chr-encoded-application-hta
    desc: Chr-encoded Application/Hta MIME media type
    crit: notable
    conf: 0.97
    near_bytes: 96
    all:
      - id: chr-frag-on-slash
      - id: chr-frag-hta-word

  - id: any-application-hta-content-type
    desc: HTTP Application/Hta Content-Type header
    crit: notable
    conf: 0.96
    for: [vbs, asp, html, javascript, php, python]
    any:
      - id: http-content-type-application-hta
      - id: chr-encoded-application-hta
