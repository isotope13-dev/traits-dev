# OCSP is a certificate-status protocol. Its HTTP media type identifies an
# ordinary certificate validation request, not command-and-control traffic.
defaults:
  platforms: [unix, windows, android]
  for: [binaries, scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: ocsp-request-content-type
    desc: References the OCSP request media type
    if:
      type: text
      substr: application/ocsp-request
