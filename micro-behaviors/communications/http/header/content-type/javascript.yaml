defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: grpc-web-protobuf-content-type
    desc: Uses the gRPC-Web Protocol Buffers media type
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: application/grpc-web+proto

  - id: archive-media-type-reference
    desc: References an archive media type
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)application/(zip|x-7z-compressed|x-tar)'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
      - id: metadata/package/files/runtime::javascript-dist-tree-artifact
