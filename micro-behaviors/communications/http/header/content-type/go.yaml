defaults:
  platforms: [linux]
  for: [go]
traits:
  - id: go-content-type-set
    desc: Sets HTTP Content-Type header
    crit: notable
    # Source call syntax, not a compiled artifact: `.Header.Set(` is written
    # in Go and compiled away, leaving only the "Content-Type" literal.
    # This observation applies to source, including its existing consumers.
    if:
      type: text
      regex: '\.Header\.Set\s*\(\s*"Content-Type"\s*,'
