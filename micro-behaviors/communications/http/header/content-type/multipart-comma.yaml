# PHP accepts this nonstandard separator where MIME specifies a semicolon.
# Observe the syntax here; the WAF-bypass consumer supplies exploit context.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, data]
  crit: notable
  conf: 0.98

traits:
  - id: multipart-comma-boundary
    desc: Multipart boundary uses comma separator
    if:
      type: text
      # Cover both wire tabs and tabs escaped in request-builder strings.
      regex: '(?i)multipart/form-data([ \t]|\\t)*,([ \t]|\\t)*boundary([ \t]|\\t)*='
