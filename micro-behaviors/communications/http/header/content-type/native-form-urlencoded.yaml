defaults:
  platforms: [windows, unix]
  # Native binary group restricted to the original ELF/Mach-O/PE coverage.
  for: [binaries, -class, -pyc, -beam, -wasm, -dex, -static-lib, c, cpp, python, javascript, powershell, php, html, shell]
  mbc: C0002
  attack: T1071.001
traits:
  - id: native-url-encoded-content-type
    desc: URL-encoded HTTP form content type string
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: application/x-www-form-urlencoded
