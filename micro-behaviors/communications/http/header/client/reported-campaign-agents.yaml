# Reported custom HTTP User-Agent tokens from automated Entra ID, Key Vault,
# SharePoint, and Azure DevOps secret-crawling activity (Todyl / Microsoft,
# November 2026). Kept strictly separate from behavioral detections so renamed
# or standard-client variants remain covered.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, json, text]
  crit: notable
  conf: 0.96
  mbc: C0002
  attack: T1071.001

traits:
  - id: sait-tenant-deep-user-agent
    desc: Reported sait-tenant-deep User-Agent token
    if:
      type: text
      regex: '\bsait-tenant-deep/[0-9.]+\b'

  - id: task177-crawler-user-agent
    desc: Reported task177-f2267 User-Agent token
    if:
      type: text
      regex: '\btask177-f2267/[0-9.]+\b'
