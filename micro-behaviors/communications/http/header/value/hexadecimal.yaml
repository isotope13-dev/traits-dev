# A hexadecimal client version is ordinary data, not proof of encoding
# or of an implant identity. Preserve the same textual observation.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, powershell, rust, pe, elf]
traits:
  - id: x-header-hex-value
    desc: X-prefixed header with hexadecimal string value
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '["'']X-[A-Za-z0-9-]+["'']\s*:\s*["''][a-fA-C0-9]{16,}["'']'
