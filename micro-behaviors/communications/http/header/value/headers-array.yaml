defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, text]

traits:
  - id: javascript-headers-entries-array
    desc: Converts HTTP header entries to an array
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bArray\.from\s*\(\s*\w{1,24}\.headers\.entries\s*\(\s*\)\s*\)'
