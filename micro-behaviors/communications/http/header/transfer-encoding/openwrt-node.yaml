defaults:
  platforms: [openwrt]
  for: [javascript, typescript]
  attack: T1041

traits:
  - id: node-chunked-transfer-encoding
    desc: "Chunked HTTP transfer-encoding header"
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'Transfer-Encoding["'']?\s*:\s*["'']chunked'
      case_insensitive: true
