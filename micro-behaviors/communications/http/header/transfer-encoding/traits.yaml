defaults:
  platforms: [windows, unix]
  for: [binaries, scripts]
  mbc: C0002
  attack: T1071.001

traits:
  - id: chunked-transfer-encoding
    desc: HTTP chunked transfer encoding
    crit: notable
    conf: 0.85
    if:
      type: text
      substr: "Transfer-Encoding: chunked"

  - id: source-chunked-transfer-encoding
    desc: HTTP chunked transfer encoding literal in source
    crit: notable
    conf: 0.85
    for: [source]
    if:
      type: text
      regex: '["''`]\s*Transfer-Encoding\s*:\s*chunked'
