defaults:
  platforms: [windows, unix]
  crit: suspicious
  for: [python, shell]

traits:
  - id: curl-numeric-cookie-option
    desc: curl command with numeric cookie value
    crit: notable
    conf: 0.80
    if:
      type: text
      regex: "\\bcurl\\b[^\\n]{0,80}(--cookie(\\s|=)|\\s-b(\\s|=))[^\\n]{0,50}[0-9]{10,}"
