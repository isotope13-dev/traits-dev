defaults:
  platforms: [unix, windows]
  for: [python, javascript, powershell, rust, pe, elf]
  mbc: C0002
  attack: T1071.001
traits:
  - id: header-user
    desc: HTTP header user/userid
    crit: notable
    conf: 0.5
    for: [shell]
    if:
      type: text
      regex: '-H\s+["'']?(user|userid):'
  - id: header-client
    desc: HTTP header client
    crit: notable
    conf: 0.5
    for: [shell]
    if:
      type: text
      regex: '-H\s+["'']?client:'
  - id: header-bot
    desc: HTTP header bot
    crit: notable
    conf: 0.6
    for: [shell]
    if:
      type: text
      regex: '-H\s+["'']?bot:'
  - id: header-build
    desc: HTTP header build
    crit: notable
    conf: 0.5
    for: [shell]
    if:
      type: text
      regex: '-H\s+["'']?build:'
  - id: header-hwid
    desc: HTTP header hwid
    crit: notable
    conf: 0.6
    for: [shell]
    if:
      type: text
      regex: '-H\s+["'']?hwid:'
  - id: header-machine
    desc: HTTP header machine
    crit: notable
    conf: 0.5
    for: [shell]
    if:
      type: text
      regex: '-H\s+["'']?machine:'
  - id: x-header-user
    desc: X-User header
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: '(?i)\bX-User\s*:'
  - id: x-header-client
    desc: X-Client header
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: '(?i)\bX-Client\s*:'
  - id: x-header-bot
    desc: X-Bot header
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: X-Bot
  - id: x-header-build
    desc: X-Build header
    crit: notable
    conf: 0.5
    if:
      type: text
      regex: '(?i)(["'']X-Build["'']|\bX-Build)\s*:'
  - id: x-header-hwid
    desc: X-HWID header
    crit: notable
    conf: 0.6
    if:
      type: text
      substr: X-HWID
  - id: x-header-data-hex
    desc: X- header with hex-encoded data
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '["'']X-[A-Za-z0-9-]+["'']\s*:\s*["''][a-fA-C0-9]{16,}["'']'
  - id: x-header-single-letter
    desc: Single-letter X- header in request construction
    crit: baseline
    conf: 0.85
    if:
      type: text
      regex: '(setRequestHeader\s*\(\s*["'']X-[A-Z]["'']|-[Hh]\s+["'']X-[A-Z]\s*:|["'']X-[A-Z]\s*:)'
