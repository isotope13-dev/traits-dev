# Browser context storage state (cookies and origin localStorage) read through
# browser automation, and the same object placed in an outgoing message. Test
# suites save storage state to a file, so only the message form is informative.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  # Snapshot forms only. A storageState({path}) file save is owned by
  # micro-behaviors/os/security/auth/session::browser-storage-state-save.
  - id: browser-storage-state-read
    desc: Reads browser context storage state
    if:
      type: text
      regex: '\.storageState\s*\(\s*\)|\.storageState\s*\(\s*\{\s*indexedDB\s*:\s*true\s*\}\s*\)'

  - id: storage-state-sent-via-message
    desc: Sends browser storage state in a message
    if:
      type: text
      # Direct object literal, or one wrapped in JSON.stringify(...) before the send.
      regex: '\bsend\s*\([^)]{0,60}\{[^}]{0,200}storageState\s*:'
