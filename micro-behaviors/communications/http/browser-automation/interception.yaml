# Request/response interception exposed by browser automation drivers, plus
# the session-redirect endpoints such interception is aimed at. Dual-use:
# test harnesses stub responses the same way, so intent comes from the
# credential-access composites that reference these.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
  - id: gmail-session-redirect-marker
    desc: References Gmail's SetOSID session redirect
    conf: 0.95
    if:
      type: text
      substr: mail.google.com/accounts/SetOSID

  - id: request-interception-response
    desc: Intercepts browser request response
    conf: 0.9
    if:
      type: text
      regex: 'request\.(respond|continue)\s*\('

composite_rules:
  - id: gmail-session-redirect-interception
    desc: Intercepts Gmail's session redirect request
    crit: suspicious
    conf: 0.97
    all:
      - id: gmail-session-redirect-marker
      - id: request-interception-response
