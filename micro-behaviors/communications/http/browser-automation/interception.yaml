# Request/response interception exposed by browser automation drivers, plus
# the session-redirect endpoints such interception is aimed at. Dual-use:
# test harnesses stub responses the same way, so intent comes from the
# credential-access composites that reference these.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
  - id: gmail-session-redirect-marker
    desc: References Gmail's SetOSID session redirect
    conf: 0.95
    if:
      type: text
      substr: mail.google.com/accounts/SetOSID

  - id: browser-request-interception-enabled
    desc: Enables browser request interception
    crit: component
    if:
      type: text
      regex: '\b\w+\.setRequestInterception\s*\(\s*true\s*\)'

  - id: browser-request-event-handler
    desc: Registers browser request event handler
    crit: component
    if:
      type: text
      regex: '\.on\s*\(\s*[''\"]request[''\"]'

  - id: browser-request-resolution-call
    desc: Calls browser request resolution method
    crit: component
    if:
      type: text
      regex: 'request\.(respond|continue)\s*\('

composite_rules:
  - id: request-interception-response
    desc: Resolves browser request interception
    crit: notable
    conf: 0.9
    all:
      - id: browser-request-interception-enabled
      - id: browser-request-event-handler
      - id: browser-request-resolution-call
    near_lines: 8

  - id: gmail-session-redirect-interception
    desc: Intercepts Gmail's session redirect request
    crit: suspicious
    conf: 0.97
    all:
      - id: gmail-session-redirect-marker
      - id: request-interception-response
