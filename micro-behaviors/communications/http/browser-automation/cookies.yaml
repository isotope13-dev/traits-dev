# Cookie transfer operations exposed by browser automation APIs. These calls
# are dual-use (testing and profile migration also use them); attack intent is
# established by session-hijack composites that require local store access.
defaults:
  crit: notable
  platforms: [windows, unix]
  for: [javascript, typescript, python, java, csharp, ruby, php]

traits:
  - id: cookie-insertion-api-call
    desc: Calls a cookie insertion API
    # Names such as addCookies also occur in HTTP cookie jars. Browser intent
    # is established by the session-hijack composites that consume this atom.
    crit: component
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(setCookie|addCookie|addCookies|add_cookie|add_cookies|AddCookie|AddCookies)$'

  - id: selenium-cookie-collection-read
    desc: WebDriver cookie collection read
    conf: 0.95
    attack: T1539
    if:
      type: symbol
      kind: call
      regex: '(^|\.)(getCookies|get_cookies|GetCookies)$'

  - id: named-cookie-collection-search
    desc: Searches a named cookie collection
    conf: 0.92
    attack: T1539
    if:
      type: symbol
      kind: call
      regex: '(?i)cookies\.(find|filter|select|first_or_default)$'

  - id: authentication-token-name-literal
    desc: Authentication token name literal
    conf: 0.9
    if:
      type: literal
      kind: string
      regex: '(?i)^[A-Za-z0-9_.-]{0,24}(oauth|auth|access|session)[_-]?token$'

composite_rules:
  - id: browser-automation-cookie-read
    desc: Reads cookies from an automated browser page or context
    conf: 0.97
    attack: T1539
    any:
      - id: micro-behaviors/communications/http/cookie-store::browser-page-cookie-read
      - id: micro-behaviors/communications/http/cookies::playwright-browser-context-cookie-read
      - id: selenium-cookie-collection-read
