defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: playwright-page-route
    desc: Registers a browser page request route
    if:
      type: symbol
      kind: call
      regex: '(^|\.)page\.route$'

  - id: playwright-route-fulfill
    desc: Fulfills an intercepted browser request
    if:
      type: symbol
      kind: call
      regex: '(^|\.)route\.fulfill$'
