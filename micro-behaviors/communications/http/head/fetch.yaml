defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.99

traits:
  - id: fetch-head-call
    desc: Calls fetch with HEAD method option
    if:
      type: symbol
      kind: call
      exact: fetch
      arg:
        index: 1
        from:
          field: method
          whole_value: '^HEAD$'
