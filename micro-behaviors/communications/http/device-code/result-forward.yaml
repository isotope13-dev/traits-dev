defaults:
  platforms: [windows, unix]
  for: [python]
traits:
  - id: device-status-json-forward
    desc: Posts JSON from device-status GET response
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      exact: httpx.post
      args:
        - index: 0
          kind: string
          regex: '^https?://'
        - index: 1
          from:
            field: json
            call: '^(httpx|requests)\.get$'
            argument: 0
            literal: '/(api/)?device/(poll|status|state)\b'
            through:
              - call: '\.json$'
                receiver: true
composite_rules:
  # A broker can legitimately forward a result to another service. This is a
  # reviewable authentication-boundary crossing, not proof of stolen tokens.
  - id: device-authorization-result-forwarding
    desc: Forwards polled device-authorization result
    crit: suspicious
    conf: 0.97
    all:
      - id: device-code-user-handoff
      - id: device-code-polling-loop
      - id: device-status-json-forward
    near_lines: 80
