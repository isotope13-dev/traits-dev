defaults:
  platforms: [windows, unix]
  for: [html, scripts, source]

composite_rules:
  # SkyW4lker and legitimate device-flow wrappers both give the visitor a
  # provider code while polling an intermediary's opaque session handle.
  # This is a neutral capability; phishing classifiers supply attack context.
  - id: device-code-query-session-relay
    desc: Device authorization relayed through session query polling
    crit: notable
    conf: 0.95
    all:
      - id: device-code-user-handoff
      - id: device-code-polling-loop
      - id: micro-behaviors/communications/http/query::session-poll-query
    near_lines: 80

  # Location tagging is also used for ordinary sign-in risk assessment. It
  # does not establish phishing, geofencing, or unauthorized token access.
  - id: profiled-device-code-query-relay
    desc: Device-code relay includes visitor IP and country
    crit: notable
    conf: 0.93
    all:
      - id: device-code-query-session-relay
      - id: micro-behaviors/communications/http/query::session-start-location-query
    near_lines: 100
