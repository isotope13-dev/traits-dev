defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1105
  mbc: C0002

traits:
  - id: forwarded-fetch-url-options
    desc: Fetch forwarded with URL and options
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\(\s*fetch\s*,\s*\w+\s*,\s*\{\s*method\s*:'

  # Some SDK proxies seed generated methods with a placeholder URL before
  # replacing those methods with callbacks to the supplied API handler.
  - id: zero-port-ip-url-string
    desc: Zero-port IP URL string literal
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "https://1.2.3.4:0"
  - id: provider-handler-forwarding-call
    desc: API methods forwarded to handler
    crit: notable
    conf: 0.97
    if:
      type: text
      regex: 'forwardRequests\(\w+,\s*param0\s+as\s+ApiRequestHandler\)'
  - id: provider-handler-forwarding-call-transpiled
    desc: Transpiled API calls forwarded to handler
    crit: notable
    conf: 0.97
    if:
      type: text
      # ESM output keeps the imported call bare; CommonJS output rewrites it
      # through the module namespace. Both forms forward Remote-provider
      # requests to the caller's handler instead of sending them to the
      # placeholder URL.
      regex: '(\(0,\s*\w+\.forwardRequests\)|forwardRequests)\(\w+,\s*param0\)'

composite_rules:
  - id: zero-port-provider-proxy-forwarder
    desc: Zero-port IP proxy forwards provider calls
    crit: exception
    conf: 0.97
    near_bytes: 300
    all:
      - id: zero-port-ip-url-string
    any:
      - id: provider-handler-forwarding-call
      - id: provider-handler-forwarding-call-transpiled
    needs: 1
