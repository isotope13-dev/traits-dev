defaults:
  platforms:
    - unix
    - windows
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

composite_rules:
  - id: bearer-header-from-storage
    desc: Bearer header from storage
    crit: notable
    conf: 0.93
    all:
      - id: micro-behaviors/data/db/web-storage::dom-storage-getitem
      - id: micro-behaviors/communications/http/authorization-header::auth-header-dup
      - id: micro-behaviors/communications/http/authorization-header::bearer-authorization-prefix
