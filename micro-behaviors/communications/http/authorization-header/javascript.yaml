defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1071.001
  mbc: C0002

traits:
  # Bare "Bearer" token, with no Authorization context required. Component
  # only: on its own this is a word, and the surrounding header/credential
  # evidence comes from the composites that reference it.
  - id: bearer-authorization-prefix
    desc: Contains an HTTP Bearer authorization prefix
    crit: component
    conf: 0.93
    if:
      type: text
      substr: Bearer
