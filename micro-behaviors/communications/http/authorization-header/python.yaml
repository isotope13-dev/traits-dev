defaults:
  platforms: [unix, windows]
  for: [python, pyc]
  attack: T1041

traits:
  - id: github-cli-download-auth-token-fragment
    desc: "GitHub CLI download authz header fragment"
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: 'GH_CLI_DOWNLOAD_LINK=$(curl -H "Authorization:token $GITHUB_TOKEN"'

  - id: python-getenv-in-request-headers
    desc: Python passes env value in HTTP headers
    crit: notable
    conf: 0.92
    for: [python]
    mbc: C0002
    attack: T1071.001
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx)\.(get|post|put)$'
      arg:
        from:
          field: headers
          call: '^(os\.)?(getenv|environ\.get)$'
          through:
            - call: '^\.format$'
              arguments: [0, 1, 2, 3]

composite_rules:
  - id: python-env-authorization-header
    desc: Python sets HTTP Authorization from env
    crit: notable
    conf: 0.95
    for: [python]
    mbc: C0002
    attack: T1071.001
    near_bytes: 256
    all:
      - id: micro-behaviors/communications/http/authorization-header::authorization-header-map-entry
      - id: python-getenv-in-request-headers
