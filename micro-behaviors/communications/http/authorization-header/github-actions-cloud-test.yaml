defaults:
  platforms: [unix, windows]
  for: [typescript]
  crit: component

traits:
  - id: reads-github-actions-token
    desc: Reads GitHub Actions token from environment
    if:
      type: text
      regex: '\bprocess\.env\.GITHUB_TOKEN\b'

  - id: uses-auth-as-bearer-header
    desc: Uses resolved auth as HTTP authorization
    if:
      type: text
      regex: 'authorization:\s*authHeaderValue\(auth\)'

  - id: submits-hosted-test-job
    desc: Submits a hosted Peach test job
    if:
      type: text
      substr: /api/sootsim/runner/jobs

composite_rules:
  - id: github-actions-token-to-hosted-test
    desc: Forwards GitHub Actions token to Peach hosted tests
    crit: notable
    conf: 0.98
    for: [npm, tar, javascript, typescript]
    scope: package
    all:
      - id: micro-behaviors/communications/http/authorization-header::reads-github-actions-token
      - id: micro-behaviors/communications/http/authorization-header::uses-auth-as-bearer-header
      - id: micro-behaviors/communications/http/authorization-header::submits-hosted-test-job
