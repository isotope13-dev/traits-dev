# Authentication subject review; original matchers and effective defaults preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - github-actions
  crit: component
  conf: 0.9
traits:
- id: workflow-secret-bearer-auth
  crit: notable
  desc: Workflow secret in HTTP auth header
  if:
    type: text
    regex: (?i)(authorization|bearer)[^"'\n]{0,40}\$\{\{\s*secrets\.
