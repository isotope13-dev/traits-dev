defaults:
  crit: notable
  platforms: [windows, unix]
  for: [scripts, binaries]
  mbc: C0002
  attack: T1071.001
traits:
  - id: jvm-authorization-request-property
    desc: Sets JVM HTTP Authorization property
    conf: 0.95
    platforms: [android, unix, windows]
    for: [java, kotlin]
    if:
      type: symbol
      kind: call
      exact: setRequestProperty
      arg:
        kind: string
        exact: Authorization

  - id: bearer-prefix
    desc: HTTP Bearer authorization header prefix
    conf: 0.72
    platforms: [android, windows, unix]
    for: [scripts, source, binaries, -mirc, -ircii, -beam, -static-lib]
    if:
      type: text
      # HTTP field names and authentication schemes are case-insensitive.
      regex: '(?i)Authorization.{0,48}Bearer'

  # `Authorization: Bearer ${TOKEN}` -- a bearer credential interpolated from an
  # environment variable rather than hardcoded. In JavaScript/TypeScript template
  # literals, `${UPPER}` interpolates an ordinary lexical binding unless an env
  # object (`process.env` / `import.meta.env`) is referenced.
  - id: shell-or-config-bearer-env-var
    desc: Shell or config Bearer env-var placeholder
    crit: component
    conf: 0.95
    for: [scripts, source, markdown, text, -javascript, -typescript]
    if:
      type: text
      regex: '(?i:Authorization.{0,80}Bearer)\s+\$\{[A-Z][A-Z0-9_]{1,40}\}'

  - id: js-bearer-env-var-template
    desc: JS template Bearer env-var interpolation
    crit: component
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)Authorization.{0,48}Bearer\s+\$\{(process|import\.meta)\.env\.\w+'

composite_rules:
  - id: bearer-token-from-env-var
    desc: Bearer credential interpolated from an env var
    conf: 0.95
    for: [scripts, source, markdown, text]
    any:
      - id: shell-or-config-bearer-env-var
      - id: js-bearer-env-var-template

  - id: jvm-bearer-request-property
    desc: JVM source sets an HTTP Authorization property to a Bearer value
    conf: 0.96
    platforms: [android, unix, windows]
    for: [java, kotlin]
    near_lines: 2
    all:
      - id: jvm-authorization-request-property
      - id: bearer-prefix
