defaults:
  crit: notable
  platforms: [windows, unix]
  for: [scripts, binaries]
  mbc: C0002
  attack: T1071.001
traits:
  - id: jvm-authorization-request-property
    desc: Sets JVM HTTP Authorization property
    conf: 0.95
    platforms: [android, unix, windows]
    for: [java, kotlin]
    if:
      type: symbol
      kind: call
      exact: setRequestProperty
      arg:
        kind: string
        exact: Authorization

  - id: bearer-prefix
    desc: HTTP Bearer authorization header prefix
    conf: 0.72
    platforms: [android, windows, unix]
    for: [scripts, binaries, java, kotlin]
    if:
      type: text
      # HTTP field names and authentication schemes are case-insensitive.
      regex: '(?i)Authorization.{0,48}Bearer'

  # `Authorization: Bearer ${TOKEN}` -- a bearer credential interpolated from an
  # environment variable rather than hardcoded. This is the recommended way to
  # authenticate an HTTP or MCP client, so it is neutral on its own; it matters
  # when a composite establishes that the destination is not the credential's
  # owner, which is the shape the untrusted-MCP exfiltration composites convict.
  - id: bearer-token-from-env-var
    desc: Bearer credential interpolated from an env var
    conf: 0.95
    for: [scripts, source, markdown, text]
    if:
      type: text
      regex: '(?i)Authorization.{0,80}Bearer\s+\$\{[A-Z0-9_]+\}'

composite_rules:
  - id: jvm-bearer-request-property
    desc: JVM source sets an HTTP Authorization property to a Bearer value
    conf: 0.96
    platforms: [android, unix, windows]
    for: [java, kotlin]
    near_lines: 2
    all:
      - id: jvm-authorization-request-property
      - id: bearer-prefix
