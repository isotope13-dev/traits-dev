# Authentication subject review; original matchers and effective defaults preserved.
---
defaults:
  platforms:
  - windows
  - unix
  for:
  - scripts
  - source
  crit: notable
  conf: 0.92
traits:
- id: bearer-header-from-variable
  desc: Builds Bearer authorization header from variable
  crit: notable
  conf: 0.94
  if:
    type: text
    regex: (?i)Authorization["'`]?\s*[:=,]\s*[fFrRuUbB]?["'`]Bearer\s+(["'`]\s*\+|\$|\{)
