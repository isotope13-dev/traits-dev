defaults:
  platforms: [windows, unix]
traits:
  - id: auth-header-dup
    for: [binaries, scripts]
    desc: Authorization header
    crit: baseline
    conf: 0.5
    mbc: C0002
    attack: T1071.001
    if:
      type: text
      exact: Authorization
      case_insensitive: true
  - id: hardcoded-auth-token
    for: [binaries, scripts]
    desc: Hardcoded HTTP Authorization credential
    crit: notable
    conf: 0.85
    mbc: C0002
    attack: T1071.001
    if:
      type: text
      regex: '(?i)Authorization["''`]??\s*[:=]\s*["''`]?\s*(Token|Bearer|Basic)\s+[0-9a-fA-F]{16,}'
    unless:
      - type: text
        substr: "'Authorization': 'Bearer AAAAAA"
  - id: hardcoded-token-config-field
    desc: Hardcoded token-bearing configuration field
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b[A-Za-z_][A-Za-z0-9_]*Token\s*:\s*["''][A-Za-z0-9._~-]{16,}["'']'
    not:
      - regex: '\b[A-Za-z_][A-Za-z0-9_]*Token\s*:\s*["''][A-Za-z_][A-Za-z0-9_]*Token["'']'
      # Syntax-highlighter grammars assign dotted lowercase TextMate scope
      # names to `token:` / `defaultToken:` keys (Ace's
      # `defaultToken:"comment.doc.body"`). That is a highlight class, not a
      # credential; a real hardcoded token is not all-lowercase dotted words.
      - regex: 'Token\s*:\s*["''][a-z]+(\.[a-z0-9-]+)+["'']'
      # Human-readable labels such as "github-access-token" and
      # "test-access-token" are fixture placeholders, not credentials.
      - regex: 'Token\s*:\s*["''][a-z]+(?:-[a-z]+)*-token["'']'
  - id: x-admin-token-header
    desc: x-admin-token request header
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: '["'']x-admin-token["'']\s*:'
  - id: python-x-session-token-header-access
    mbc: C0002
    attack: T1071.001
    desc: Reads X-Session-Token request header
    crit: notable
    conf: 0.92
    for: [python]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)headers\.get$'
      arg:
        kind: string
        exact: X-Session-Token
  - id: auth-header
    mbc: C0002
    attack: T1071.001
    desc: Authorization header-name literal
    crit: notable
    conf: 0.5
    # JavaScript/TypeScript use the structured Authorization bind/map traits
    # below so commented examples are not reported as live request headers.
    for: [python, powershell, rust, pe, elf]
    unless:
      - id: metadata/build/recognized-contexts::benign-build-tooling-context
      - id: metadata/package/testing/presence/fixture/
      - id: metadata/package/testing/presence/harness/
    if:
      # Match a parsed string literal, not prose such as a comment saying
      # "Authorization: Bearer ...". This identifies header vocabulary, not
      # a live request; map-style headers are handled below.
      type: string_literal
      regex: '(?i)^Authorization(:|$)'
  - id: authorization-header-map-entry
    for: [python, javascript, powershell, rust, pe, elf]
    mbc: C0002
    attack: T1071.001
    desc: Defines an HTTP Authorization header mapping
    crit: notable
    conf: 0.88
    ref: sha256:fab39b4045be97c3d98a8425a3486b5561cca80ba0f61721a2070935eeba7846
    if:
      type: text
      regex: '["'']Authorization["'']\s*:'
    unless:
      - id: metadata/file/string/corpus::hashed-text-record
  # `Basic ${...}` inside a template literal is how JavaScript assembles an
  # HTTP Basic credential header, whether the base64 is computed inline
  # (`Basic ${Buffer.from(`${user}:${pass}`).toString("base64")}`) or hoisted
  # into a variable (`Basic ${auth}`). The previous matcher was a single
  # verbatim call site copied from one sample and matched nothing else.
  - id: javascript-basic-auth-header
    mbc: C0002
    attack: T1071.001
    desc: JavaScript Basic Authorization header
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'Basic \$\{[^\n}]{1,60}\}'
    unless:
      - id: metadata/package/files/runtime::javascript-dist-tree-artifact
  - id: authorization-header-index-assignment
    mbc: C0002
    attack: T1071.001
    desc: Authorization header property assignment
    crit: notable
    conf: 0.88
    for: [javascript, typescript, python, powershell, rust]
    if:
      type: symbol
      kind: bind
      regex: '(^|\.)Authorization$'
  - id: x-api-key-header-map-entry
    for: [python, javascript, powershell, rust, pe, elf]
    mbc: C0002
    attack: T1071.001
    desc: Configures an X-API-Key request header
    crit: notable
    conf: 0.88
    if:
      type: text
      regex: '["'']x-api-key["'']\s*:'
      case_insensitive: true
  - id: x-session-id-header-map-entry
    mbc: C0002
    attack: T1071.001
    desc: Configures an X-Session-ID request header
    crit: notable
    conf: 0.9
    for: [javascript, typescript, python, powershell, rust]
    if:
      type: text
      regex: '["'']x-session-id["'']\s*:'
      case_insensitive: true
  - id: x-api-key-header
    mbc: C0002
    attack: T1071.001
    desc: X-API-Key HTTP request header
    crit: notable
    conf: 0.9
    for: [shell, batch, powershell, ruby]
    if:
      type: text
      regex: '(?i)\bX-API-Key\s*:'
  - id: token-auth-header
    mbc: C0002
    attack: T1071.001
    desc: Token Authorization header
    crit: notable
    conf: 0.92
    # Agent-skill docs and shell helpers spell the same GitHub-style
    # `Authorization: token <pat>` header, so they are in scope here.
    for: [python, javascript, powershell, rust, pe, elf, markdown, shell]
    ref: sha256:09053f004eadcee4af595d8cba0d1f82e9de546e9a244420cfe43154a2acf2d6
    if:
      type: text
      regex: 'Authorization\s*[:=].{0,80}\bToken\b'
  - id: bearer-token
    for: [python, javascript, powershell, rust, pe, elf]
    mbc: C0002
    attack: T1071.001
    desc: Bearer token authentication
    crit: notable
    conf: 0.5
    unless:
      - id: metadata/package/testing/presence/fixture/
      - id: metadata/package/testing/presence/harness/
      # Rust unit-test modules commonly contain redaction/test-token strings.
      - type: text
        regex: '#\[cfg\(test\)\]'
    if:
      type: text
      regex: '(Authorization|Authenticate)[^\r\n]{0,24}Bearer\s+[A-Za-z0-9._~+\-/=]{8,}'
  - id: bearer-header-from-token
    for: [python, javascript, powershell, rust, pe, elf]
    mbc: C0002
    attack: T1071.001
    desc: Bearer header from token
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: 'Authorization.{0,40}Bearer.{0,40}\b(token|jwt|access_token|session)\b'
    not:
      - substr: "Bearer mytoken"
    unless:
      - id: metadata/package/testing/presence/harness/
  - id: basic-auth
    for: [python, javascript, powershell, rust, pe, elf]
    mbc: C0002
    attack: T1071.001
    desc: Basic authentication
    crit: notable
    conf: 0.5
    unless:
      - type: text
        substr: Basic Zm9vOmJhcg==
      - type: text
        substr: Basic dXNlcjpwYXNz
    if:
      type: text
      regex: (Authorization|Authenticate).{0,20}Basic\s+[A-Za-z0-9+/_=-]{4,}
    not:
      - substr: libcurl/
      - substr: '["Authorization"] == "Basic'
      - substr: 'Authorization"] == "Basic'
  - id: auth-like-constant-assignment
    mbc: C0002
    attack: T1071.001
    desc: Auth-like constant assignment
    crit: notable
    conf: 0.8
    for: [scripts, binaries]
    if:
      type: text
      regex: '\b[A-Za-z_$][\w$]*(AUTHORIZATION|AUTH|TOKEN)[A-Za-z0-9_$]*\s*='
  - id: basic-auth-credential-literal
    mbc: C0002
    attack: T1071.001
    desc: Basic auth credential literal
    crit: notable
    conf: 0.86
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)(Authorization|Authenticate)[^\r\n]{0,40}Basic\s+[A-Za-z0-9+/]{12,}={0,2}'
    not:
      - substr: Basic dXNlcjpwYXNz
      - substr: Basic Zm9vOmJhcg==

    unless:
      # Canonical test:test credentials are placeholders, not a secret.
      - type: encoded
        encoding: base64
        substr: test:test
composite_rules:
  - id: headers-auth
    for: [python, javascript, powershell, rust, pe, elf]
    mbc: C0002
    attack: T1071.001
    desc: HTTP Authorization header
    crit: notable
    conf: 0.66
    any:
      - id: auth-header
      - id: bearer-token
      - id: bearer-header-from-token
      - id: basic-auth
      - id: hardcoded-basic-auth-credential
  - id: hardcoded-basic-auth-credential
    for: [elf, pe, python, javascript, powershell]
    mbc: C0002
    attack: T1071.001
    desc: Hardcoded HTTP Basic auth credential
    crit: suspicious
    conf: 0.86
    all:
      - id: auth-like-constant-assignment
      - id: basic-auth-credential-literal
    near_bytes: 256
    unless:
      - id: well-known/app/ai/coding-agent/tabby/
      - id: well-known/app/publishing/orientdb::studio-bundled-web-asset
