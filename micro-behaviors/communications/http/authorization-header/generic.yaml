---
defaults:
  platforms:
  - windows
  - unix
  attack: T1071.001
traits:
- id: auth-header-dup
  for:
  - binaries
  - scripts
  desc: Authorization header
  crit: baseline
  conf: 0.5
  mbc: C0002
  if:
    type: text
    exact: Authorization
    case_insensitive: true
- id: hardcoded-auth-token
  for:
  - binaries
  - scripts
  desc: Hardcoded HTTP Authorization credential
  crit: notable
  conf: 0.85
  mbc: C0002
  if:
    type: text
    regex: (?i)Authorization["'`]??\s*[:=]\s*["'`]?\s*(Token|Bearer|Basic)\s+[0-9a-fA-F]{16,}
  unless:
  - type: text
    substr: "'Authorization': 'Bearer AAAAAA"
- id: auth-header
  mbc: C0002
  desc: Authorization header-name literal
  crit: notable
  conf: 0.5
  for:
  - python
  - powershell
  - rust
  - pe
  - elf
  if:
    type: string_literal
    regex: "(?i)^Authorization(:|$)"
- id: authorization-header-map-entry
  for:
  - python
  - javascript
  - powershell
  - rust
  - pe
  - elf
  mbc: C0002
  desc: Defines an HTTP Authorization header mapping
  crit: notable
  conf: 0.88
  ref: sha256:fab39b4045be97c3d98a8425a3486b5561cca80ba0f61721a2070935eeba7846
  if:
    type: text
    regex: '["'']Authorization["'']\s*:'
  unless:
  - id: metadata/file/string/corpus::hashed-text-record
- id: javascript-basic-auth-header
  mbc: C0002
  desc: JavaScript Basic Authorization header
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: Basic \$\{[^\n}]{1,60}\}
  unless:
  - id: metadata/package/files/runtime::javascript-dist-tree-artifact
- id: authorization-header-index-assignment
  mbc: C0002
  desc: Authorization header property assignment
  crit: notable
  conf: 0.88
  for:
  - javascript
  - typescript
  - python
  - powershell
  - rust
  if:
    type: symbol
    kind: bind
    regex: "(^|\\.)Authorization$"
- id: x-api-key-header-map-entry
  for:
  - python
  - javascript
  - powershell
  - rust
  - pe
  - elf
  mbc: C0002
  desc: Configures an X-API-Key request header
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: '["'']x-api-key["'']\s*:'
    case_insensitive: true
- id: anthropic-version-header-map-entry
  for:
  - python
  - javascript
  - typescript
  - rust
  desc: Configures an anthropic-version request header
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '["'']anthropic-version["'']\s*:'
    case_insensitive: true
- id: x-goog-api-key-header-map-entry
  for:
  - javascript
  - typescript
  - python
  mbc: C0002
  desc: Configures Google's API-key request header
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '["'']x-goog-api-key["'']\s*:'
    case_insensitive: true
- id: x-session-id-header-map-entry
  mbc: C0002
  desc: Configures an X-Session-ID request header
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  - python
  - powershell
  - rust
  if:
    type: text
    regex: '["'']x-session-id["'']\s*:'
    case_insensitive: true
- id: x-api-key-header
  mbc: C0002
  desc: X-API-Key HTTP request header
  crit: notable
  conf: 0.9
  for:
  - shell
  - batch
  - powershell
  - ruby
  if:
    type: text
    regex: "(?i)\\bX-API-Key\\s*:"
- id: token-auth-header
  mbc: C0002
  desc: Token Authorization header
  crit: notable
  conf: 0.92
  for:
  - python
  - javascript
  - powershell
  - rust
  - pe
  - elf
  - markdown
  - shell
  ref: sha256:09053f004eadcee4af595d8cba0d1f82e9de546e9a244420cfe43154a2acf2d6
  if:
    type: text
    regex: Authorization\s*[:=].{0,80}\bToken\b
- id: bearer-token
  for:
  - python
  - javascript
  - powershell
  - rust
  - pe
  - elf
  mbc: C0002
  desc: Bearer token authentication
  crit: notable
  conf: 0.5
  unless:
  - type: text
    regex: "#\\[cfg\\(test\\)\\]"
  if:
    type: text
    regex: "(Authorization|Authenticate)[^\\r\\n]{0,24}Bearer\\s+[A-Za-z0-9._~+\\-/=]{8,}"
- id: bearer-header-from-token
  for:
  - python
  - javascript
  - powershell
  - rust
  - pe
  - elf
  mbc: C0002
  desc: Bearer header from token
  crit: notable
  conf: 0.93
  if:
    type: text
    regex: Bearer[ \t]*(["']\s*[+%,]\s*|\$?\{|#\{)(token|jwt|access_token|session)\b
  not:
  - substr: Bearer mytoken
- id: basic-auth
  for:
  - python
  - javascript
  - powershell
  - rust
  - pe
  - elf
  mbc: C0002
  desc: Basic authentication
  crit: notable
  conf: 0.5
  unless:
  - type: text
    substr: Basic Zm9vOmJhcg==
  - type: text
    substr: Basic dXNlcjpwYXNz
  if:
    type: text
    regex: "(Authorization|Authenticate).{0,20}Basic\\s+[A-Za-z0-9+/_=-]{4,}"
  not:
  - substr: libcurl/
  - substr: '["Authorization"] == "Basic'
  - substr: Authorization"] == "Basic
- id: basic-auth-credential-literal
  mbc: C0002
  desc: Basic auth credential literal
  crit: notable
  conf: 0.86
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: "(?i)(Authorization|Authenticate)\\W*[:=]\\W*Basic\\s+[A-Za-z0-9+/]{12,}={0,2}"
  not:
  - substr: Basic dXNlcjpwYXNz
  - substr: Basic Zm9vOmJhcg==
  unless:
  - type: encoded
    encoding: base64
    substr: test:test
composite_rules:
- id: headers-auth
  for:
  - python
  - javascript
  - powershell
  - rust
  - pe
  - elf
  mbc: C0002
  desc: HTTP Authorization header
  crit: notable
  conf: 0.66
  any:
  - id: micro-behaviors/communications/http/authorization-header::auth-header
  - id: micro-behaviors/communications/http/authorization-header::bearer-token
  - id: micro-behaviors/communications/http/authorization-header::bearer-header-from-token
  - id: micro-behaviors/communications/http/authorization-header::basic-auth
  - id: micro-behaviors/communications/http/authorization-header::hardcoded-basic-auth-credential
- id: hardcoded-basic-auth-credential
  for:
  - elf
  - pe
  - python
  - javascript
  - powershell
  mbc: C0002
  desc: Hardcoded HTTP Basic auth credential
  crit: suspicious
  conf: 0.86
  all:
  - id: metadata/lang/source/syntax/assignment/name::auth-token-variable-assignment
  - id: micro-behaviors/communications/http/authorization-header::basic-auth-credential-literal
  near_bytes: 256
