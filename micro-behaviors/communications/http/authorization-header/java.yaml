# Servlet-side header reads. `getHeader(name)` is the only way a Java web
# component inspects an inbound request header, so it is the surface both
# ordinary applications and request-gated backdoors use to look at User-Agent,
# Referer or a private trigger header.
defaults:
  platforms: [unix, windows]
  for: [java, kotlin, groovy, scala, html, javascript, python, vbs]
  crit: notable
  conf: 0.82
traits:
  - id: airlift-authorization-header-bytecode
    for: [class, java_class, jar]
    desc: Airlift HTTP Authorization header use
    crit: notable
    conf: 0.96
    if:
      type: import
      exact: io/airlift/http/client/HeaderNames.AUTHORIZATION
