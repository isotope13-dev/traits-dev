# HTTP Authorization headers using the "token <credential>" scheme (commonly
# used with GitHub and Gitea REST/raw APIs) constructed from script variables.
defaults:
  platforms: [windows, unix]
  for: [powershell, python, javascript, typescript, shell, ruby, php]
  crit: notable
  mbc: C0002
  attack: T1071.001

traits:
  - id: token-scheme-variable-header
    desc: HTTP token Authorization header from variable
    conf: 0.92
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bAuthorization["'']?\s*[:=]\s*["'']token\s+(\$[A-Za-z_]\w*|["'']\s*\+\s*\$?[A-Za-z_]\w*)'
