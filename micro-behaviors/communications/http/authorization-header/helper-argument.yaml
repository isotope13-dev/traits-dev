defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
traits:
  - id: authorization-header-name-argument
    desc: Passes Authorization to a function
    crit: notable
    conf: 0.96
    if:
      type: symbol
      kind: call
      regex: '.'
      arg:
        kind: string
        exact: Authorization
composite_rules:
  - id: request-hook-authorization-name-context
    desc: Request hook references Authorization nearby
    crit: notable
    conf: 0.94
    near_bytes: 1600
    all:
      - id: authorization-header-name-argument
    any:
      - id: micro-behaviors/process/hook/xhr::window-fetch-eq
      - id: micro-behaviors/process/hook/xhr::xhr-prototype-open-eq
