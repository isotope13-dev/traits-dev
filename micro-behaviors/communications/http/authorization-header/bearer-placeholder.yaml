defaults:
  for: [go]
  platforms: [unix, windows]
  crit: notable
traits:
- id: bearer-placeholder-literal
  desc: Placeholder or internal Bearer token
  conf: 0.98
  if:
    type: literal
    regex: '(?i)^Bearer (your[-_]token|my[-_]token|[a-z0-9_-]*(internal|placeholder)[a-z0-9_-]*)$'
# Self-negating token values ("Bearer not-the-session-token") mark a probe or
# negative test: the literal asserts it is not the real credential. Auth-probe
# code sends such a token to detect whether a peer endpoint is guarded --
# a guarded peer rejects it and an open one accepts it, which is the signal.
- id: bearer-self-negating-literal
  desc: Bearer literal denies it is a token
  conf: 0.98
  if:
    type: literal
    regex: '(?i)^Bearer [a-z0-9_-]*(not-|fake|invalid|wrong|bogus|redacted)[a-z0-9_-]*$'
# Dictionary stand-ins such as "conformance-fixture" are labels for a harness,
# not credentials baked into a client.
- id: bearer-stand-in-word-literal
  desc: Stand-in word in Bearer literal
  conf: 0.98
  if:
    type: literal
    regex: '(?i)^Bearer [a-z0-9_-]*(fixture|example|dummy|sample)[a-z0-9_-]*$'
