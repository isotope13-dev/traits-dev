# Code-forge subject review; original matchers and effective defaults preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - ruby
  crit: notable
traits:
- id: github-python-token-auth-header-bracket
  desc: Python GitHub token auth hdr from os.environ
  crit: notable
  conf: 0.88
  for:
  - python
  if:
    type: text
    regex: Authorization.{0,80}os\.environ\[['"]GITHUB_TOKEN
- id: github-python-token-auth-header-get
  desc: github python token auth header get
  crit: notable
  conf: 0.88
  for:
  - python
  if:
    type: text
    regex: Authorization.{0,80}os\.environ\.get\(['"]GITHUB_TOKEN
- id: github-python-token-auth-header-var
  desc: Python GitHub token auth header from variable
  crit: notable
  conf: 0.86
  for:
  - python
  if:
    type: text
    regex: Authorization.{0,80}GITHUB_TOKEN
- id: github-shell-token-auth-header
  desc: Shell GitHub token Authorization header
  crit: notable
  conf: 0.9
  for:
  - shell
  if:
    type: text
    regex: Authorization:\s*token\s+\$GITHUB_TOKEN
- id: github-js-token-auth-header-env
  desc: JS GitHub token auth from process.env
  crit: notable
  conf: 0.88
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: Authorization.{0,120}process\.env\.GITHUB_TOKEN
composite_rules:
- id: github-python-token-auth-header
  desc: Python GitHub token auth header
  crit: component
  conf: 0.88
  for:
  - python
  any:
  - id: micro-behaviors/communications/http/authorization-header::github-python-token-auth-header-bracket
  - id: micro-behaviors/communications/http/authorization-header::github-python-token-auth-header-get
  - id: micro-behaviors/communications/http/authorization-header::github-python-token-auth-header-var
- id: github-js-token-auth-header
  desc: JavaScript GitHub API token auth header
  crit: component
  conf: 0.88
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/communications/http/services/github::github-api-host
  - id: micro-behaviors/communications/http/authorization-header::github-js-token-auth-header-env
