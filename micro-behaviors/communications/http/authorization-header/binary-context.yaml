defaults:
  platforms: [unix, windows]
  for: [elf, macho, pe]

composite_rules:
  - id: binary-auth-header-references
    desc: HTTP Authorization header references
    any:
      - id: micro-behaviors/communications/http/authorization-header::auth-header
      - id: micro-behaviors/communications/http/authorization-header::authorization-header-map-entry
      - id: micro-behaviors/communications/http/authorization-header::hardcoded-auth-token
      - id: micro-behaviors/communications/http/lib/netlib::go-http-header-auth
    crit: notable
