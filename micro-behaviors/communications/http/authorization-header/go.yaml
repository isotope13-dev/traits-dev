defaults:
  platforms: [unix, windows]
  for: [elf, go]
traits:
  - id: go-authorization-set
    desc: Sets HTTP Authorization header
    crit: notable
    if:
      type: text
      regex: '(?i)\.Header\.Set\s*\(\s*["'']authorization["'']\s*,'
  - id: go-bearer-auth-set
    desc: Literal Bearer token in header
    crit: suspicious
    conf: 0.9
    unless:
    - id: metadata/package/testing/harness/runtime/
    - id: metadata/package/testing/presence/harness/
    - type: basename
      regex: _test\.go$
    - id: metadata/package/documentation/agent-safety::security-example-documentation
    - id: micro-behaviors/communications/http/authorization-header::bearer-placeholder-literal
    - id: "metadata/file/naming::test-directory-component"
    if:
      type: text
      regex: \.Header\.Set\s*\(\s*"Authorization"\s*,\s*"Bearer\s+[A-Za-z0-9._~+\-/=]{8,}"
  # The key is read from the program's stored settings (`settings.APIKey`,
  # `cfg.Token`) at request time -- a vendor client authenticating as the user
  # who configured it, as opposed to a literal token baked into the binary.
  - id: go-bearer-key-from-settings
    desc: Bearer header built from a stored key
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: 'Header\.Set\("Authorization",\s*"Bearer\s+"\s*\+\s*\w+\.\w*(Key|Token)\b'

composite_rules:
  # Go clients that call a service as the user who configured them: OAuth
  # device/PKCE flows, or a stored API key sent as a Bearer header. Host and
  # platform reporting next to such a POST is the client identifying itself.
  - id: go-user-authorized-client-context
    desc: Go client authorized as its configuring user
    crit: exception
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/oauth::oauth-pkce-code-challenge
      - id: micro-behaviors/communications/http/oauth::oauth-pkce-code-verifier
      - id: micro-behaviors/communications/http/oauth::oauth-device-authorization-path
      - id: micro-behaviors/communications/http/oauth::oauth-device-grant-type
      - id: go-bearer-key-from-settings
