# These required observations do not bind the assignment to the listener,
# establish a Bearer scheme, or show the ownership of an OAuth credential.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

composite_rules:
  - id: microsoft-client-request-header-rewrite
    desc: Request hook and Authorization assignment with Microsoft client ID
    all:
      - id: micro-behaviors/process/hook/webextension::webrequest-before-send-headers-listener
      - id: authorization-header-index-assignment
      - id: micro-behaviors/communications/http/oauth::microsoft-first-party-client-id
    near_bytes: 8192
    unless:
      - id: well-known/tool/detection/
