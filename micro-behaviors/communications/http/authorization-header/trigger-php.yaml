defaults:
  platforms: [windows, unix]
  for: [php]
  mbc: B0030
  attack: T1071.001
traits:
  - id: http-x-auth-header
    desc: Custom authentication header
    crit: notable
    conf: 0.75
    if:
      # The matcher includes the PHP superglobal access syntax, not just the
      # header-name literal extracted from inside the brackets.
      type: text
      regex: \$_SERVER\s*\[['"]HTTP_X_[A-Z_]*(AUTH|TOKEN|KEY|PASS)[A-Z_]*['"]\]
