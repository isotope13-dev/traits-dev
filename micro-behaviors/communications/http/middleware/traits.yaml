# HTTP middleware modules that deliberately disable TLS verification for
# development or integration testing (distinct from covert bypass).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.92

traits:
  - id: opt-in-tls-bypass-middleware-path
    desc: Opt-in TLS verification disable middleware path
    if:
      type: path
      regex: '(?i)(^|[\\/])disable[-_]ssl'
