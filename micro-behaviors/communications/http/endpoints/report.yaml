defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
  - id: api-report-path
    desc: HTTP report endpoint path
    crit: notable
    conf: 0.85
    if:
      type: text
      # Require an endpoint delimiter.  A word boundary also matched API
      # documentation pages such as `/api/report.html`.
      regex: '/api/(v[0-9]+/)?report([/?#"'' ]|$)'
    unless:
      - id: metadata/file/string/corpus::hashed-text-record
