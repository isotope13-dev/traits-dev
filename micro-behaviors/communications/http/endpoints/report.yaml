defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]

traits:
  - id: api-report-path
    desc: HTTP report endpoint path
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '/api/(v[0-9]+/)?report\b'
    unless:
      - id: metadata/file/string/corpus::hashed-text-record
