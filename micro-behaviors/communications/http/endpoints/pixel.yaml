defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
  conf: 0.9

traits:
  - id: tracking-pixel-path
    desc: Image-tracking pixel request path
    if:
      type: text
      regex: '(?i)/(t/)?pixel\.gif\?'

  - id: tracking-pixel-status-query
    desc: Tracking pixel status parameter fragment
    crit: component
    if:
      type: text
      regex: '(?i)\?(m|s|status)='

composite_rules:
  - id: tracking-pixel-status-url
    desc: Image pixel carries status query
    crit: notable
    all:
      - id: tracking-pixel-path
      - id: tracking-pixel-status-query
    near_bytes: 120
