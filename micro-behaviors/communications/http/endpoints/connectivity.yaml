defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
traits:
  - id: google-web-host
    desc: Google web hostname
    crit: notable
    conf: 0.78
    if:
      # A documentation comment naming a site is not an endpoint use.
      type: string_literal
      regex: 'https?://(www[.])?google[.]com([/[:space:]"'']|$)'
    unless:
      - id: metadata/document/html::doctype
      # A Python docstring is itself a string literal, so `string_literal`
      # does not keep documentation out on this language: huggingface_hub's
      # `>>> http_backoff("GET", "https://www.google.com")` doctest scored as
      # an endpoint.  A doctest prompt marks the file's examples as prose.
      - id: metadata/package/documentation/source-documentation::python-doctest-prompt
