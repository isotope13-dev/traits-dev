# Neutral /api/v1/gateway path fragment. Appears in cloud control-plane
# clients, appliance APIs (including NetScaler), and health probes — not by
# itself a dropper signal. Hostile NetScaler composites combine it with
# polyglot decode/eval chains.
defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, go, php]
  crit: notable
  conf: 0.85

traits:
  - id: api-v1-gateway-path
    desc: /api/v1/gateway HTTP API path
    if:
      type: text
      substr: /api/v1/gateway
