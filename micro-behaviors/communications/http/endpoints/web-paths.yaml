# Generic HTTP endpoint path fragments (/home, /index.php, /profile). Neutral:
# these appear in countless legitimate web applications and embedded request
# strings. Malware C2 composites combine them with a known C2 domain or mutex.
defaults:
  platforms: [windows]
  for: [pe]
  crit: component
  conf: 0.9
traits:
  - id: fetch-http-scheme-url
    desc: Fetches an HTTP(S)-scheme URL
    crit: notable
    conf: 0.82
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: fetch
      arg:
        kind: string
        substr: http
    unless:
      - id: well-known/tool/detection/skill-scanner::typescript-test-context
  - id: home-endpoint-path
    desc: /home HTTP endpoint path
    if:
      type: text
      exact: /home
      section: .rdata
  - id: index-php-endpoint-path
    desc: /index.php HTTP endpoint path
    if:
      type: text
      exact: /index.php
      section: .rdata
  - id: profile-endpoint-path
    desc: /profile HTTP endpoint path
    if:
      type: text
      exact: /profile
      section: .rdata
