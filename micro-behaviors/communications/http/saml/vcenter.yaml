defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.99

traits:
  - id: saml-administrator-nameid
    desc: SAML NameID asserts an administrator
    if:
      type: text
      regex: '<[A-Za-z0-9_:.-]*NameID[^>]{0,160}>[Aa]dministrator@'

  - id: vcenter-saml-consumer-path
    desc: vCenter SAML consumer endpoint path
    if:
      type: text
      substr: /ui/saml/websso/sso
