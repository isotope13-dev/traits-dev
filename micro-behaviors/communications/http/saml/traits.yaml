# SAML authentication message structure.  These are neutral protocol artifacts;
# credential-access composites add malformed-signature or key-confusion evidence
# before inferring an authentication bypass.
defaults:
  platforms: [unix, windows]
  for: [php, python, javascript, typescript, scripts, source, xml, html, text]
  crit: notable
  conf: 0.96

traits:
  - id: xml-signature-method-element
    desc: XML SignatureMethod element
    if:
      type: text
      regex: '(?i)<([A-Za-z_][A-Za-z0-9_.-]*:)?SignatureMethod[ >]'

  - id: xmldsig-hmac-sha1-uri
    desc: XMLDSIG HMAC-SHA1 algorithm URI
    conf: 0.99
    if:
      type: text
      substr: xmldsig#hmac-sha1

  - id: saml-signature-value-element
    desc: SAML XML SignatureValue element
    if:
      type: text
      regex: '(?i)<([A-Za-z_][A-Za-z0-9_.-]*:)?SignatureValue[ >]'

  - id: saml-nameid-markup
    desc: SAML NameID markup element
    if:
      type: text
      regex: '(?i)<([A-Za-z_][A-Za-z0-9_.-]*:)?NameID[ >]'

  - id: saml-nameid-identifier
    desc: SAML NameID element identifier
    if:
      type: string_literal
      regex: '(^|[}:])NameID$'

  - id: saml-response-parameter
    desc: SAMLResponse form or URL parameter
    if:
      type: text
      regex: '(?i)(["'']SAMLResponse["'']\s*[:=]|\bname\s*=\s*["'']SAMLResponse["'']|(^|[?&])SAMLResponse=)'

  - id: saml-relaystate-parameter
    desc: RelayState form or URL parameter
    if:
      type: text
      regex: '(?i)(["'']RelayState["'']\s*[:=]|\bname\s*=\s*["'']RelayState["'']|(^|[?&])RelayState=)'

  - id: saml-assertion-markup
    desc: SAML Assertion markup element
    if:
      type: text
      regex: '(?i)<([A-Za-z_][A-Za-z0-9_.-]*:)?Assertion[ >]'

  - id: saml-response-markup
    desc: SAML Response markup element
    if:
      type: text
      # XML element names are case-sensitive; SAML uses Response. A lowercase
      # <response body ...> placeholder is log text, not markup. Require a
      # namespace prefix or an attribute so TS generics such as
      # Promise<Response> and JSX components do not match.
      regex: '(<[A-Za-z_][A-Za-z0-9_.-]*:Response([ >])|<Response\s+[A-Za-z_][A-Za-z0-9_.:-]*\s*=)'

  - id: xml-signature-element-pattern
    desc: XML Signature element tag pattern
    for: [php, python, javascript, typescript, scripts, source]
    if:
      type: text
      regex: '(?i)<([A-Za-z0-9_.\\*-]+:)?Signature(\\b|\b|[ >])'

  - id: xml-regex-strip-call
    desc: Regex substitution or removal call
    crit: component
    conf: 0.85
    for: [php, python, javascript, typescript, scripts, source]
    if:
      type: text
      regex: '\b(ReplaceAll(String)?|re\.sub|preg_replace)\s*\('

  - id: saml-response-form-call
    desc: SAMLResponse form setter method call
    for: [php, python, javascript, typescript, scripts, source]
    if:
      type: text
      regex: '(?i)\.(set|add|append)\s*\(\s*["'']SAMLResponse["'']'

composite_rules:
  - id: saml-response-field
    desc: SAMLResponse form, query, or parameter field
    crit: notable
    conf: 0.97
    any:
      - id: saml-response-parameter
      - id: saml-response-form-call

  - id: saml-signature-strip-operation
    desc: Strips XML Signature elements from markup
    crit: notable
    conf: 0.96
    for: [php, python, javascript, typescript, scripts, source]
    all:
      - id: xml-signature-element-pattern
    any:
      - id: xml-regex-strip-call
      - id: metadata/lang/source/syntax/call/invocation::replace-member-call-syntax
    near_lines: 6

  - id: saml-nameid-element
    desc: SAML asserted NameID element
    crit: notable
    conf: 0.98
    any:
      - id: saml-nameid-markup
      - id: saml-nameid-identifier

  - id: saml-hmac-sha1-signature-method
    desc: SAML XML signature selects HMAC-SHA1
    crit: notable
    conf: 0.99
    all:
      - id: xml-signature-method-element
      - id: xmldsig-hmac-sha1-uri
    near_bytes: 1024
