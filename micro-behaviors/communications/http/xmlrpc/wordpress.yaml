# WordPress exposes authentication through the wp.getUsersBlogs XML-RPC
# method. These traits describe protocol mechanics; credential validation and
# password guessing are composed in objectives.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.97
  mbc: C0002
  attack: T1071.001

traits:
  - id: wordpress-login-method
    desc: WordPress XML-RPC login method
    if:
      type: string_literal
      substr: wp.getUsersBlogs

  - id: python-fault-absence-success-check
    desc: Python accepts a fault-free XML-RPC response
    for: [python]
    if:
      type: text
      regex: 'if\s+b?["'']<fault>["'']\s+not\s+in\s+[A-Za-z_]\w*(\.(text|content))?\s*:'
