# Server-side XML-RPC mechanics: the program answers XML-RPC method calls.
# Client builders live in php-perl.yaml; this records the exposed dispatch
# table that makes request-fed handler bugs remotely reachable.
defaults:
  platforms: [unix, windows]
  for: [php]
  mbc: C0002
  attack: T1071.001
traits:
  - id: xmlrpc-server-dispatch
    desc: Instantiates an XML-RPC method server
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'new\s+XML_RPC_Server\s*\('
