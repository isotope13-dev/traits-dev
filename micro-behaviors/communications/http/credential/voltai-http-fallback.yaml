# A configured server URL can override the plaintext default; this finding
# records a conditional exposure, not proof that any token was transmitted.
defaults:
  platforms: [windows, unix]
  for: [javascript]
  crit: suspicious
  conf: 0.97
traits:
  - id: voltai-bearer-over-http-fallback
    desc: Voltai token may use plaintext fallback
    if:
      type: yara
      source: |
        rule voltai_bearer_over_http_fallback {
          strings:
            $fallback = "http://166.117.3.52" ascii
            $select = "n&&n[1]?n[1]:Vm" ascii
            $route = "/structural_info/" ascii
            $token = "n=Ce()" ascii
            $authorization = "Authorization:`Bearer ${n}`" ascii
          condition:
            all of them and @token < @authorization and
            @authorization - @token < 500 and @route > @token and @route < @authorization
        }
