defaults:
  platforms: [windows, unix]

traits:
  - id: javascript-model-catalog-fetch
    desc: Calls fetch with model catalog URL
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      exact: fetch
      arg:
        index: 0
        kind: string
        regex: '(^|/)v1/models([?#]|$)'
  - id: ollama-api-tags-path
    desc: Ollama model-list API path
    crit: notable
    conf: 0.98
    for: [python]
    if:
      type: text
      substr: /api/tags
