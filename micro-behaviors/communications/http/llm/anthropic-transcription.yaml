# Anthropic-compatible gateways use these environment keys for their own tokens.
# Fallback plus a bearer header does not establish credential theft.
defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
  crit: notable
  conf: 0.95

traits:
  - id: js-anthropic-token-fallback-chain
    desc: Falls back to Anthropic-style tokens
    if:
      type: text
      regex: 'pick\([^)]{0,240}ANTHROPIC_AUTH_TOKEN[^)]{0,120}ANTHROPIC_API_KEY'

  - id: js-transcription-endpoint
    desc: References a transcription endpoint
    crit: component
    if:
      type: text
      substr: /transcribe

  - id: js-bearer-key-template
    desc: Builds a Bearer header from key
    crit: component
    if:
      type: text
      substr: 'authorization: `Bearer ${key}`'

composite_rules:
  - id: js-anthropic-credential-to-transcription-gateway
    desc: Transcription uses Anthropic-style token authentication
    crit: notable
    conf: 0.96
    near_bytes: 4096
    all:
      - id: js-anthropic-token-fallback-chain
      - id: js-transcription-endpoint
      - id: js-bearer-key-template
