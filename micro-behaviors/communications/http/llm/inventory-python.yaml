defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.95
traits:
- id: python-compatible-models-request
  desc: Requests an OpenAI-compatible models API path
  if:
    type: symbol
    kind: call
    regex: \.get$
    arg:
      index: 0
      from:
        value: /v1/models\b
