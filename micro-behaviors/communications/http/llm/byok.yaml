# Bring-your-own-key LLM connection context.
#
# An extension or app whose LLM traffic is keyed by the user's own API key is
# disclosing where its page/report text goes: the destination is a hosted chat
# API the user chose and authorized, not an operator endpoint. These atoms
# recognize that disclosed configuration surface so exfiltration composites
# can distinguish it from silent harvesting to a first-party collector.
#
# They are capability facts, not verdicts: a BYOK surface does not excuse
# other channels (telemetry uploads, credential theft) elsewhere in the
# package.
defaults:
  platforms: [unix, windows]
  for: [json, javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: byok-provider-catalog
    desc: JSON data lists multiple chat endpoint URLs
    for: [json]
    conf: 0.9
    count_min: 2
    if:
      type: text
      substr: chat/completions

  - id: byok-user-key-prompt
    desc: Prompts user to supply their API key
    conf: 0.9
    if:
      type: text
      regex: '(?i)(set|enter|add)\b.{0,30}\byour\b.{0,30}api[_ -]?key'
