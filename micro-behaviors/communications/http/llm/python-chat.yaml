defaults:
  platforms: [windows, unix]
  for: [python]

traits:
  - id: requests-chat-completions-post
    desc: POSTs to a chat-completions API path
    crit: notable
    conf: 0.95
    if:
      type: symbol
      kind: call
      exact: requests.post
      arg:
        index: 0
        kind: string
        substr: /chat/completions
