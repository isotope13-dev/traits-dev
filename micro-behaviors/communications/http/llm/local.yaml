# Local LLM inference endpoints.  These are neutral communication capabilities
#; objective rules decide whether returned code is being weaponized.
defaults:
  platforms: [unix, windows]
  for: [python, go, lua, shell, javascript, typescript, powershell, rust, html]
  attack: T1071.001
  mbc: C0002

traits:
  - id: loopback-host-with-llm-port
    desc: Loopback host with Ollama port or hostname
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(localhost|127\.0\.0\.1)[^\r\n]{0,64}(11434|ollama)'

  - id: loopback-host-with-generate-path
    desc: Loopback host with an LLM generate path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(localhost|127\.0\.0\.1)[^\r\n]{0,64}/generate'

  - id: loopback-host-with-openai-path
    desc: Loopback host with an OpenAI-compatible LLM path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(localhost|127\.0\.0\.1)[^\r\n]{0,64}chat/completions'

  # The value side of ANTHROPIC_BASE_URL.  Redirecting an AI CLI's base URL
  # means very different things depending on where it points: a loopback
  # target is a proxy already running on the same machine, so the prompts and
  # the accompanying token stay local.  Matched in one regex rather than by
  # pairing the ANTHROPIC_BASE_URL atom with a loopback-URL atom, because when
  # two atoms match the same line only one of them is reported.
  - id: anthropic-base-url-with-loopback-host
    desc: Anthropic base URL set to loopback host
    crit: notable
    conf: 0.9
    for: [binaries, shell, python, javascript, typescript, powershell, go, json]
    if:
      type: text
      regex: 'ANTHROPIC_BASE_URL\W{1,8}https?://(127\.0\.0\.1|localhost|0\.0\.0\.0)'

  - id: anthropic-branded-off-vendor-origin-literal
    desc: Anthropic-branded non-vendor API origin
    crit: notable
    conf: 0.95
    for: [javascript, typescript, json]
    if:
      type: string_literal
      regex: '(?i)https://[\w.-]*anthropic\.(help|app|ai|net|io|dev|xyz)'

  - id: local-llm-generate-path
    desc: Local LLM generate or chat API path
    crit: notable
    conf: 0.92
    if:
      type: text
      # Root /api/{generate,chat} or after a host:port — not nested app routes
      # like /__dev/api/chat.
      regex: '(?i)(^|[^\w/]|:\d{2,5})/api/(generate|chat)\b'

  - id: ollama-api-create-path
    desc: Ollama model create API path
    crit: notable
    conf: 0.94
    if:
      type: text
      # Ollama routes are exactly these bare paths; a sub-resource such as
      # /api/create/user is some other REST API, not the Ollama endpoint.
      # No lookaround (the linear-time engine rejects it): the segment must
      # end here, i.e. next is neither a word char nor a path separator.
      regex: '(?i)/api/create([^/\w]|$)'

  - id: ollama-api-show-path
    desc: Ollama model show API path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)/api/show([^/\w]|$)'

  - id: ollama-model-api-path
    desc: Ollama model inventory or management API path
    crit: notable
    conf: 0.9
    if:
      # Model inventory/read paths plus model-store mutation paths.  These are
      # neutral API surfaces; exploit composites add the vulnerable operation.
      # Bare routes only: /api/create/user is not the Ollama endpoint.
      type: text
      regex: '(?i)/api/(tags|show|create|pull|delete|copy|ps)([^/\w]|$)'

  # A poisoned Ollama template smuggles an EXTRA chat system turn in after the
  # user's rendered {{ .System }} field. Legitimate chat templates place the
  # role-open token BEFORE the field; an additional system-role opener right
  # AFTER .System is the injection structure the NemoClaw (CVE-2026-65105)
  # template-poisoning attack writes via /api/create. One atom per chat format.
  - id: go-template-system-then-chatml-system
    desc: Go template appends ChatML system after .System
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\{\{\s*\.System\s*\}\}[\s\S]{0,80}<\|im_start\|>\s*system'

  - id: go-template-system-then-llama3-system
    desc: Go template appends Llama-3 system after .System
    crit: suspicious
    conf: 0.9
    if:
      type: text
      regex: '\{\{\s*\.System\s*\}\}[\s\S]{0,80}<\|start_header_id\|>\s*system'

  # `{{ .System }}` followed by `<<SYS>>`/`[INST]` IS the Llama-2 chat prompt
  # format as Ollama's Modelfile spells it, so any tool that emits Modelfiles
  # carries it -- unsloth's `ollama_template_mappers.py` exists to generate
  # them. Recording which prompt template a file builds is useful; the template
  # itself asserts nothing about intent.
  - id: go-template-system-then-llama2-system
    desc: Go template appends Llama-2 system after .System
    crit: suspicious
    conf: 0.9
    if:
      type: text
      # Only the *opening* `<<SYS>>` counts. `[INST]` opens a user turn, and
      # the stock Llama-2 Modelfile puts one after the rendered system field
      # on every subsequent turn -- `{{- else }}[INST] {{ if .System }}{{
      # .System }}` -- so including it reported the unmodified template as a
      # poisoned one. The legitimate placement is `<<SYS>>{{ .System }}<</SYS>>`
      # with the marker *before* the field, which this no longer matches.
      regex: '\{\{\s*\.System\s*\}\}[\s\S]{0,80}<<SYS>>'

  - id: go-system-message-template
    desc: Go template emits System field
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '\{\{\s*\.System\s*\}\}'

  # URL construction alone is the standard self-hosted-frontend pattern: a
  # config module resolving its own backend from the origin it is served
  # from (Open-WebUI-style) never fires the composite. The suspicious claim
  # needs the request that uses the endpoint -- the rebinding/drive-by class
  # reaches the daemon through a fetch of its own.
  - id: page-host-ollama-url-builder
    desc: Builds Ollama URL from page hostname
    crit: notable
    conf: 0.95
    for: [javascript, typescript, html]
    if:
      type: text
      regex: 'location\.(hostname|host).{0,48}:11434'

  # The OpenAI-compatible `/v1/chat/completions` and `/v1/responses` paths are
  # already canonical atoms in this directory (proxy.yaml).  A second copy here
  # both duplicated those matchers and asserted a locality its regex never
  # checked, so every hosted vendor client scored as a "Local ... API path" --
  # huggingface_hub's Together AI provider (api.together.xyz) among them.
  # The composite below now reaches for the canonical atoms instead.

composite_rules:
  # Keeps the identifier the objective consumers already reference; the
  # request leg is what separates a page driving the endpoint from a config
  # module that only resolves it.
  - id: page-host-ollama-port
    desc: Sends requests to page-host Ollama endpoint
    crit: suspicious
    conf: 0.9
    for: [javascript, typescript, html]
    all:
      - id: page-host-ollama-url-builder
    any:
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/request/html::html-fetch-post-call
    needs: 1
    near_lines: 40

  # Any chat-format variant of the poisoned-template shape: the user's rendered
  # System field immediately followed by a second, attacker-supplied system
  # turn. Suspicious on its own; objectives pair it with the /api/create write.
  - id: go-template-injected-system-role
    desc: Template appends extra system turn after .System
    crit: suspicious
    conf: 0.9
    any:
      - id: go-template-system-then-chatml-system
      - id: go-template-system-then-llama3-system
      - id: go-template-system-then-llama2-system

  - id: loopback-llm-api-host
    desc: Loopback host in a local LLM endpoint
    crit: notable
    conf: 0.94
    any:
      - id: loopback-host-with-llm-port
      - id: loopback-host-with-generate-path
      - id: loopback-host-with-openai-path

  - id: local-llm-inference-endpoint
    desc: Loopback local LLM inference endpoint
    crit: notable
    conf: 0.94
    all:
      - id: loopback-llm-api-host
    any:
      - id: local-llm-generate-path
      - id: micro-behaviors/communications/http/llm-proxy::llm-chat-completions-path
      - id: micro-behaviors/communications/http/llm-proxy::go-llm-chat-completions-path
      - id: micro-behaviors/communications/http/llm-proxy::llm-responses-path
    near_bytes: 160
