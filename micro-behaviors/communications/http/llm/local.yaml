# Local LLM inference endpoints.  These are neutral communication capabilities
#; objective rules decide whether returned code is being weaponized.
defaults:
  platforms: [unix, windows]
  for: [python, go, lua, shell, javascript, typescript, powershell, rust]
  attack: T1071.001
  mbc: C0002

traits:
  - id: loopback-llm-api-host
    desc: Loopback host for local LLM API
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(127\.0\.0\.1|localhost|\[::1\])'

  - id: local-llm-generate-path
    desc: Local LLM generate or chat API path
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)/api/(generate|chat)\b'

  - id: local-llm-openai-path
    desc: Local OpenAI-compatible LLM API path
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?i)/v1/(chat/completions|responses)\b'

composite_rules:
  - id: local-llm-inference-endpoint
    desc: Loopback local LLM inference endpoint
    crit: notable
    conf: 0.94
    all:
      - id: loopback-llm-api-host
    any:
      - id: local-llm-generate-path
      - id: local-llm-openai-path
    near_bytes: 160
