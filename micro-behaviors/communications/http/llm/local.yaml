# Local LLM inference endpoints.  These are neutral communication capabilities
#; objective rules decide whether returned code is being weaponized.
defaults:
  platforms: [unix, windows]
  for: [python, go, lua, shell, javascript, typescript, powershell, rust]
  attack: T1071.001
  mbc: C0002

traits:
  - id: loopback-host-with-llm-port
    desc: Loopback host with Ollama port or hostname
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(localhost|127\.0\.0\.1)[^\r\n]{0,64}(11434|ollama)'

  - id: loopback-host-with-generate-path
    desc: Loopback host with an LLM generate path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(localhost|127\.0\.0\.1)[^\r\n]{0,64}/generate'

  - id: loopback-host-with-openai-path
    desc: Loopback host with an OpenAI-compatible LLM path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)(localhost|127\.0\.0\.1)[^\r\n]{0,64}chat/completions'

  # The value side of ANTHROPIC_BASE_URL.  Redirecting an AI CLI's base URL
  # means very different things depending on where it points: a loopback
  # target is a proxy already running on the same machine, so the prompts and
  # the accompanying token stay local.  Matched in one regex rather than by
  # pairing the ANTHROPIC_BASE_URL atom with a loopback-URL atom, because when
  # two atoms match the same line only one of them is reported.
  - id: anthropic-base-url-with-loopback-host
    desc: Anthropic base URL set to loopback host
    crit: notable
    conf: 0.9
    for: [binaries, shell, python, javascript, typescript, powershell, go, json]
    if:
      type: text
      regex: 'ANTHROPIC_BASE_URL\W{1,8}https?://(127\.0\.0\.1|localhost|0\.0\.0\.0)'

  - id: local-llm-generate-path
    desc: Local LLM generate or chat API path
    crit: notable
    conf: 0.92
    if:
      type: text
      # Root /api/{generate,chat} or after a host:port — not nested app routes
      # like /__dev/api/chat.
      regex: '(?i)(^|[^\w/]|:\d{2,5})/api/(generate|chat)\b'

  # The OpenAI-compatible `/v1/chat/completions` and `/v1/responses` paths are
  # already canonical atoms in this directory (proxy.yaml).  A second copy here
  # both duplicated those matchers and asserted a locality its regex never
  # checked, so every hosted vendor client scored as a "Local ... API path" --
  # huggingface_hub's Together AI provider (api.together.xyz) among them.
  # The composite below now reaches for the canonical atoms instead.

composite_rules:
  - id: loopback-llm-api-host
    desc: Loopback host in a local LLM endpoint
    crit: notable
    conf: 0.94
    any:
      - id: loopback-host-with-llm-port
      - id: loopback-host-with-generate-path
      - id: loopback-host-with-openai-path

  - id: local-llm-inference-endpoint
    desc: Loopback local LLM inference endpoint
    crit: notable
    conf: 0.94
    all:
      - id: loopback-llm-api-host
    any:
      - id: local-llm-generate-path
      - id: micro-behaviors/communications/http/llm::llm-chat-completions-path
      - id: micro-behaviors/communications/http/llm::llm-responses-path
    near_bytes: 160
