# OpenAI-compatible response schema shared by many LLM providers.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: openai-compatible-content-access-python
    desc: Reads OpenAI-compatible chat response content
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: \[\s*['"]choices['"]\s*\]\s*\[\s*0\s*\]\s*\[\s*['"]message['"]\s*\]\s*\[\s*['"]content['"]
  # An allow/deny verdict recovered from the model's free text: lowercase the
  # answer and test it for reject/true/false.
  - id: llm-reject-verdict-check
    desc: Checks LLM response for a reject verdict
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'reject[^t\n]{1,100}false[^e\n]{1,100}lower[^r\n]{1,100}true'

composite_rules:
  # Control flow handed to the model: read the answer, coerce it into JSON --
  # the quote repair is there because the model returns Python repr, not JSON --
  # then branch on the verdict it contains.
  #
  # Neutral by itself. LLM moderation is written this way legitimately, which is
  # why this is a capability and not an objective: it says what the code does,
  # not who benefits. It is worth surfacing because the judged content is
  # normally user-supplied, so whoever controls that content is also positioned
  # to steer the verdict, and the lenient parse widens what still parses.
  #
  # Arrived from a malware-family directory, where it was hostile at conf 1.0
  # on these three generic legs alone; the family, not the pattern, carried that.
  - id: llm-response-verdict-branch
    desc: Branches on a verdict parsed from LLM output
    crit: notable
    conf: 0.9
    all:
      - id: openai-compatible-content-access-python
      - id: llm-reject-verdict-check
      - id: micro-behaviors/data/serialize/json::json-quote-replace

