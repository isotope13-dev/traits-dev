# Reasoning-control parameters shared across LLM chat APIs. These are
# vendor-neutral request/response fields: `reasoning_effort` is the
# OpenAI-compatible knob (also carried by Codex, OpenRouter and the
# OpenAI-compatible mode of most providers), and "thinking mode" is the
# equivalent toggle used by Anthropic, Qwen and DeepSeek clients.
#
# They say only "this code drives an LLM's reasoning depth" — a neutral
# capability, not a provider identity. Provider-specific hosts and fields
# live under communications/http/services/<provider>/; composites there
# reference these atoms to pin a request to a given vendor.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  attack: T1071.001
  mbc: C0002
  crit: notable
  conf: 0.88

traits:
  - id: llm-reasoning-effort-parameter
    desc: LLM reasoning_effort request parameter
    if:
      type: text
      word: reasoning_effort

  - id: llm-thinking-mode-parameter
    desc: LLM thinking-mode request parameter
    if:
      type: text
      regex: '\bthinking[_ -]mode\b'

  # These provider-neutral fields are the client-visible reasoning envelope.
  # They are useful capabilities on their own; the replay-and-transcription
  # objective supplies the malicious intent.
  - id: llm-encrypted-content-field
    desc: Encrypted reasoning content field
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'encrypted_content(\s*[:.]|["'']\s*[\]\)])'

  - id: llm-thinking-signature-field
    desc: Thinking signature field
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'thinkingSignature(\s*[:.]|["'']\s*[\]\)])'

  - id: llm-thought-signature-field
    desc: Thought signature field
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'thought_signature(\s*[:.]|["'']\s*[\]\)])'

  - id: llm-thinking-block-type
    desc: Thinking block type field
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: 'type\s*[:=]\s*["'']thinking["'']'

  - id: llm-signature-field
    desc: Signed reasoning field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'signature(\s*[:.]|["'']\s*[\]\)])'

  - id: llm-assistant-model-role
    desc: Assistant or model message role
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["'']?role["'']?\s*[:=]\s*["''](assistant|model)["'']'

  - id: llm-repeated-encrypted-content-field
    desc: Repeated encrypted reasoning field
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '["'']encrypted_content["'']\s*:'
    count_min: 2

  - id: llm-repeated-thinking-signature-field
    desc: Repeated thinking signature field
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '["'']thinkingSignature["'']\s*:'
    count_min: 2

  - id: llm-repeated-thought-signature-field
    desc: Repeated thought signature field
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '["'']thought_signature["'']\s*:'
    count_min: 2

  - id: llm-repeated-thought-signature-property
    desc: Repeated thought signature property access
    crit: suspicious
    conf: 0.95
    if:
      type: text
      regex: '\.thought_signature\b'
    count_min: 2

  - id: llm-repeated-signature-field
    desc: Repeated signed reasoning field
    crit: suspicious
    conf: 0.93
    if:
      type: text
      regex: '["'']signature["'']\s*:'
    count_min: 2

composite_rules:
  - id: llm-opaque-reasoning-envelope-field
    desc: Opaque LLM reasoning envelope field
    crit: notable
    conf: 0.96
    any:
      - id: llm-encrypted-content-field
      - id: llm-thinking-signature-field
      - id: llm-thought-signature-field
      - id: llm-thinking-block-type
    near_bytes: 512

  - id: llm-opaque-reasoning-envelope-repeated
    desc: Repeated opaque reasoning envelope field
    crit: suspicious
    conf: 0.95
    any:
      - id: llm-repeated-encrypted-content-field
      - id: llm-repeated-thinking-signature-field
      - id: llm-repeated-thought-signature-field
      - id: llm-repeated-thought-signature-property
      - id: llm-repeated-signature-field

  - id: llm-opaque-reasoning-model-turn
    desc: Opaque reasoning attached to model turn
    crit: notable
    conf: 0.94
    all:
      - id: llm-assistant-model-role
      - id: llm-opaque-reasoning-envelope-field
    near_bytes: 1000
