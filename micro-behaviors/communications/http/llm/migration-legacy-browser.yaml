defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
# Same-file evidence avoids combining a selection reader in one extension
# component with an unrelated LLM client in another.
- id: selection-read-llm-post-cooccurrence
  desc: Selection read beside JSON POST to LLM
  crit: notable
  conf: 0.93
  scope: file
  all:
  - id: micro-behaviors/browser-extension/action::context-menu-selected-text-read
  - id: micro-behaviors/communications/http/llm::llm-chat-api-endpoint
  - id: micro-behaviors/communications/http/post::fetch-post-call
  - id: micro-behaviors/communications/http/request/json::json-body-post
  - id: micro-behaviors/communications/http/authorization-header::bearer-header-from-variable
