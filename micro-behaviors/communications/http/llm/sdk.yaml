# Vendor SDK packages that exist to talk to a hosted LLM inference endpoint.
#
# Importing one is the same neutral capability as `llm-chat-api-endpoint` in the
# sibling endpoint.yaml, observed one layer up: the dependency name rather than
# the request path. It is notable because a supply-chain diff that grows an LLM
# client is worth an analyst's attention, and because objective composites need
# to say "this code can reach a model" without naming an HTTP route.
#
# These are the SDK *package names* the vendors publish, so they carry no
# product identity of their own -- any project that calls the service imports
# the same string. Fingerprints for a specific product that happens to use one
# belong in well-known/, and reference these atoms from there.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95
  mbc: C0002

traits:
  - id: aws-bedrock-runtime-sdk-import
    desc: Imports the AWS Bedrock runtime SDK
    if:
      type: import
      exact: '@aws-sdk/client-bedrock-runtime'

  # Python: constructing the vendors' client classes rather than importing
  # the package. One layer up from the API path again — code that builds an
  # AsyncOpenAI/AsyncAnthropic client is wiring authenticated calls to that
  # provider. A multi-provider integration module (playground routers, LLM
  # gateways) constructs several in one file; that context is what explains
  # provider API-key reads in the same file. (AWS SDK sessions are filed with
  # the AWS service traits — boto3 is not LLM-specific.)
  - id: python-openai-sdk-client
    desc: Constructs an OpenAI SDK client
    for: [python]
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(Async)?(Azure)?OpenAI$'
  - id: python-anthropic-sdk-client
    desc: Constructs an Anthropic SDK client
    for: [python]
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '^(anthropic\.)?(Async)?Anthropic$'
