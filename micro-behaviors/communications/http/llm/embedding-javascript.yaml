# Hosted embedding SDKs transmit their input text to the selected service.
# This is expected for remote semantic-search products, but it is a material
# data-boundary fact during triage, especially when the endpoint is configurable.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: openai-sdk-embedding-text-batch
    desc: OpenAI SDK submits text batches for embedding
    conf: 0.98
    if:
      type: text
      regex: '(?is)\.embeddings\.create\s*\(\s*\{[\s\S]{0,500}\binput\s*:\s*texts\.(map|slice)\s*\('

  - id: configurable-openai-base-url-option
    desc: Sets a configurable OpenAI base URL
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\bopts\.baseURL\s*=\s*[A-Za-z_$][A-Za-z0-9_$.]*base_url\b'

  - id: openai-client-from-options
    desc: Constructs OpenAI client from options
    crit: component
    conf: 0.96
    if:
      type: text
      regex: '\bnew\s+OpenAI\s*\(\s*opts\s*\)'

composite_rules:
  - id: configurable-openai-api-base-url
    desc: OpenAI client uses configurable API base URL
    crit: notable
    conf: 0.97
    near_bytes: 512
    all:
      - id: configurable-openai-base-url-option
      - id: openai-client-from-options

  - id: configurable-embedding-text-upload
    desc: Sends text to a configurable embedding API
    crit: notable
    conf: 0.99
    all:
      - id: openai-sdk-embedding-text-batch
      - id: configurable-openai-api-base-url
