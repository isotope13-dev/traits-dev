defaults:
  platforms: [unix, windows]
  for: [php]
composite_rules:
  - id: magento-module-install-telemetry-exfil
    desc: Magento install telemetry clues
    crit: notable
    conf: 0.98
    all:
      - id: metadata/lang/source/naming/declaration::php-magento-install-reporter-class
      - id: micro-behaviors/communications/url/http-path/resource::php-install-notification-endpoint-path
      - id: micro-behaviors/communications/http/curl/binding::php-curl-request
      - id: micro-behaviors/data/serialize/json::php-json-encode
      - id: metadata/file/profile/product-reference::php-magento-module-version-payload-field

  - id: archive-magento-install-telemetry-module
    desc: Archive has Magento telemetry clues
    crit: notable
    conf: 0.98
    scope: archive
    for: [zip, tar, php, composer-json]
    all:
      - id: magento-module-install-telemetry-exfil
      - id: metadata/package/ecosystem::composer-package-manifest
