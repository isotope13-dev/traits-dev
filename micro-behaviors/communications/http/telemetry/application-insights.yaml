# Microsoft Application Insights telemetry. This is a neutral reporting
# capability; a product identity or an objective chain must supply intent.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, php, elf, macho, pe]
  crit: notable
  conf: 0.94

traits:
  - id: application-insights-track-endpoint
    desc: Microsoft Application Insights track endpoint
    if:
      type: text
      regex: 'https?://dc\.services\.visualstudio\.com/v2/track'
  - id: application-insights-host-profile
    desc: Application Insights host profile fields
    # Bare platform.system() is a generic OS probe
    # (micro-behaviors/os/sysinfo/platform/runtime::platform-system), not AI.
    if:
      type: text
      regex: 'socket\.gethostname|\bNODE_NAME\b'
    not:
      - regex: '(?i)node_name|nodeName|node\.name'
    unless:
      - id: well-known/lib/data/elastic-elasticsearch-js::elasticsearch-js-api-types-marker
  - id: application-insights-license-profile
    desc: Application Insights license key field
    if:
      type: text
      # A generic license_key field also appears in editor configuration.  A
      # nearby Application Insights marker is required for this telemetry
      # profile atom to retain its product-specific meaning.
      regex: '(?i)app(lication)?insights.{0,160}(LicenseKey|license[_ ]key)'
  - id: application-insights-runtime-fields
    desc: Application Insights runtime fields
    if:
      type: text
      regex: '(?i)(CallingTechnology)'
    not:
      - regex: 'ClusterStats.*OperatingSystem|ClusterOperatingSystem'
    unless:
      - id: well-known/lib/data/elastic-elasticsearch-js::elasticsearch-js-api-types-marker

composite_rules:
  - id: application-insights-runtime-telemetry
    desc: Reports runtime and license profile to Application Insights
    crit: notable
    conf: 0.97
    all:
      - id: application-insights-track-endpoint
      - id: application-insights-license-profile
      - id: application-insights-runtime-fields
    any:
      - id: application-insights-host-profile
      - id: micro-behaviors/os/sysinfo/platform/runtime::platform-system
    near_bytes: 2400
