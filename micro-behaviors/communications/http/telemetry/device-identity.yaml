# Device identity fields reported to a remote HTTP endpoint. These are neutral
# telemetry capabilities; malicious intent is inferred only when paired with a
# command listener or another backdoor behavior.
defaults:
  platforms: [unix, windows, appliance]
  for: [shell, python, javascript, c, cpp, elf, macho, pe]
  crit: notable
  conf: 0.86

traits:
  - id: public-ip-report-parameter
    desc: HTTP report includes public IP parameter
    if:
      type: text
      regex: '(?i)([?&]|\b)(public_?ip|external_?ip|ip)='
  - id: hardware-address-report-parameter
    desc: HTTP report includes hardware address parameter
    if:
      type: text
      regex: '(?i)([?&]|\b)(mac|mac_?address|device_?mac)='
  - id: listener-port-report-parameter
    desc: HTTP report includes listener port parameter
    if:
      type: text
      regex: '(?i)([?&]|\b)(listen_?port|bind_?port|port)='
  - id: device-model-report-parameter
    desc: HTTP report includes device model parameter
    if:
      type: text
      regex: '(?i)([?&]|\b)(brand|model|module)='

composite_rules:
  - id: device-identity-report-parameter-set
    desc: HTTP report carries multiple device identity fields
    crit: notable
    conf: 0.92
    needs: 3
    any:
      - id: public-ip-report-parameter
      - id: hardware-address-report-parameter
      - id: listener-port-report-parameter
      - id: device-model-report-parameter
