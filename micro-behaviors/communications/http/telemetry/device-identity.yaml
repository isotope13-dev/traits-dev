# Device identity fields reported to a remote HTTP endpoint. These are neutral
# telemetry capabilities; malicious intent is inferred only when paired with a
# command listener or another backdoor behavior.
defaults:
  platforms: [unix, windows, appliance]
  for: [shell, python, javascript, c, cpp, elf, macho, pe]
  crit: notable
  conf: 0.86

traits:
  - id: public-ip-report-parameter
    desc: HTTP query has ip or public-ip parameter
    if:
      # A literal distinguishes a URL/query parameter from JavaScript's
      # ternary operator (`condition ? ip = value`).
      type: literal
      kind: string
      regex: '(?i)[?&](public_?ip|external_?ip|ip)='
  - id: listener-port-report-parameter
    desc: HTTP query includes listener port parameter
    if:
      type: literal
      kind: string
      # Require the HTTP scheme in the same literal. Database DSNs also use a
      # port query parameter but are not HTTP device telemetry.
      regex: '(?i)https?://[^\s"'']{0,240}[?&](listen_?port|bind_?port|port)='

  # A curl invocation carrying a device_id field: the identifier travels
  # with an HTTP request. The call fact keeps comments and echoed usage
  # text out. Whether the identifier is hardware-derived is established
  # by the referencing composite, not this atom.
  - id: device-id-request-parameter
    desc: curl request carries device_id field
    conf: 0.9
    for: [shell]
    if:
      type: symbol
      kind: call
      regex: '(?i)^curl(\.exe)?$'
      arg:
        kind: string
        regex: 'device_id\s*='

composite_rules:
  - id: device-identity-report-parameter-set
    desc: HTTP query carries multiple device identity fields
    crit: notable
    conf: 0.92
    needs: 3
    any:
      - id: public-ip-report-parameter
      - id: micro-behaviors/communications/http/message::urlencoded-mac-address-field
      - id: listener-port-report-parameter
      - id: micro-behaviors/communications/url/query/profile::device-model-parameter
