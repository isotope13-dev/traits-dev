# Preserve the former setup-specific matcher, but describe its actual scope:
# ordered API call text. There is no installer context or payload binding.
defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-host-user-get-call-text
    desc: Host/user call text near requests.get
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: '(?s)socket\.gethostname\(\).{0,240}getpass\.getuser\(\).{0,240}requests\.get\('
