defaults:
  platforms: [windows]
  for: [pe]

composite_rules:
  - id: unsigned-loader-http-mac-query-references
    desc: Unsigned driver-loader references with HTTP MAC query field
    crit: notable
    conf: 0.96
    all:
      - id: micro-behaviors/communications/http/url/scheme::cleartext-http-url
      - id: micro-behaviors/communications/http/telemetry::hardware-address-report-parameter
      - id: micro-behaviors/os/kernel/module::zwload-driver-api-reference
      - id: metadata/signed/trust-level::unsigned-missing-signature-record
    unless:
      - id: metadata/signed/platform/
      - id: well-known/app/
