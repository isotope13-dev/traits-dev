# Write-side observability intake APIs — the endpoints that push events, logs,
# and crash reports *into* a monitoring backend.
#
# Shipping telemetry is ordinary operations work, so these are neutral. They
# are named separately from read/query endpoints because the write side is the
# one an outsider can reach with a leaked client-side key, and anything written
# there is later read back by on-call humans and the agents they delegate to.
defaults:
  platforms: [unix, windows]
  for: [json, text, markdown, scripts, source]
  crit: notable
  conf: 0.93

traits:
  - id: datadog-event-intake-api-path
    desc: Datadog event or log intake API path
    if:
      type: text
      regex: 'datadoghq\.(com|eu)/api/v[12]/(events|logs)'

  - id: datadog-log-intake-host
    desc: Datadog log intake hostname
    if:
      type: text
      regex: '\b(http-intake\.logs|browser-intake)[.-]datadoghq'

  - id: datadog-api-key-header
    desc: Datadog API key request header
    if:
      type: text
      regex: '\bDD-(API|APPLICATION)-KEY\b'
      case_insensitive: true

  - id: sentry-event-store-api-path
    desc: Sentry event store or envelope API path
    if:
      type: text
      regex: '/api/\d{1,12}/(store|envelope)/'

  - id: sentry-ingest-auth-header
    desc: Sentry ingest authentication header or key
    if:
      type: text
      regex: '\bX-Sentry-Auth\b|\bsentry_key='

  - id: splunk-hec-event-api-path
    desc: Splunk HTTP event collector API path
    if:
      type: text
      regex: '/services/collector/(event|raw)\b'

  - id: loki-log-push-api-path
    desc: Grafana Loki log push API path
    if:
      type: text
      substr: /loki/api/v1/push

  - id: newrelic-log-intake-api-path
    desc: New Relic log intake API path
    if:
      type: text
      regex: 'log-api\.(eu\.)?newrelic\.com/log/v1'

composite_rules:
  - id: observability-intake-endpoint
    desc: Observability event-intake endpoint reference
    crit: notable
    conf: 0.92
    any:
      - id: datadog-event-intake-api-path
      - id: datadog-log-intake-host
      - id: sentry-event-store-api-path
      - id: splunk-hec-event-api-path
      - id: loki-log-push-api-path
      - id: newrelic-log-intake-api-path

  - id: observability-event-ingest-write
    desc: Writes events or logs into an observability backend
    crit: notable
    conf: 0.94
    near_bytes: 320
    all:
      - id: observability-intake-endpoint
    any:
      - id: micro-behaviors/communications/http/patch::patch-method-detection
      - id: micro-behaviors/communications/http/post::fetch-post-call
      - id: micro-behaviors/communications/http/post::post-method-detection
      - id: micro-behaviors/communications/http/request/result::http-put-client-call
      - id: micro-behaviors/communications/http/request/result::http-post-client-call
      - id: micro-behaviors/communications/http/curl::curl-post-flag
      - id: micro-behaviors/communications/http/lib/requests::requests-post
