defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: node-host-profile-json-http-context
    desc: Host queries near JSON HTTP request code
    crit: notable
    conf: 0.96
    near_bytes: 8192
    # Co-occurrence does not bind a host profile to the outgoing body.
    # Keep this useful capability context neutral. Exfiltration consumers
    # must supply their own sensitive source and sink relationship.
    all:
      - id: micro-behaviors/communications/http/request/configuration::node-http-request-configured-any
      - id: micro-behaviors/communications/http/request/body::node-http-request-stream-body
      - id: micro-behaviors/data/serialize/json::json-stringify-call
    any:
      - id: micro-behaviors/os/sysinfo/profile::node-host-information-query-set
      - id: micro-behaviors/os/sysinfo/profile::node-four-host-query-kinds
      - id: micro-behaviors/os/env/read::node-env-json-serialization-context
