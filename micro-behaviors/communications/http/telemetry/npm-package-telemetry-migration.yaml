defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: npm-package-telemetry
    desc: Collects npm package metadata for telemetry
    crit: suspicious
    conf: 0.7
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/env/package-manager::npm-package-info
      - id: micro-behaviors/communications/http/post
      - id: micro-behaviors/data/serialize/json::json-stringify-package-named-argument
    unless:
      - id: metadata/lang/source/naming/function/communication::agent-session-presence-marker
      - id: well-known/tool/development/vscode-extension/tencent-codebuddy::tencent-codebuddy
  - id: npm-package-json-telemetry-post
    desc: Posts local package metadata over HTTP
    crit: suspicious
    conf: 0.9
    attack: T1041
    size_max: 20000
    all:
      - id: micro-behaviors/fs/read/file/target::require-local-package-json
      - id: micro-behaviors/communications/http/request/verb::post-method-text
      - id: micro-behaviors/data/serialize/json::json-stringify-package-named-argument
  - id: npm-invocation-project-name-post
    desc: Posts npm invocation directory name at module load
    crit: suspicious
    conf: 0.95
    attack: T1041
    size_max: 20000
    all:
      - id: 
          micro-behaviors/communications/http/request/body/construction::node-request-writes-directory-basename
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  - id: npm-optout-gated-telemetry-post
    desc: Env-gated npm telemetry POST
    crit: suspicious
    conf: 0.9
    attack: T1041
    size_max: 20000
    all:
      - id: npm-package-json-telemetry-post
      - id: micro-behaviors/os/env/reference::npm-disable-telemetry-env-gate
      - id: micro-behaviors/communications/http/request/client::node-https-request-h-alias
  - id: npm-config-gated-telemetry-post
    desc: Remote config gates npm telemetry POST
    crit: suspicious
    conf: 0.92
    attack: T1041
    all:
      - id: npm-package-json-telemetry-post
      - id: micro-behaviors/communications/http/url/api-path/resource::npm-config-query-pkg
      - id: micro-behaviors/communications/url/resource-path/collection::telemetry-api-path
  - id: repo-package-metadata-post
    desc: Collects git revision and local package metadata for HTTP POST
    crit: suspicious
    conf: 0.9
    attack: T1041
    all:
      - id: micro-behaviors/revision-control/git/read::git-rev-parse-head
      - id: micro-behaviors/fs/read/file/target::require-cwd-package-json
      - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: repo-package-metadata-post-alt-http
    desc: Reports local repo metadata to alternate HTTP service
    crit: suspicious
    conf: 0.92
    attack: T1041
    all:
      - id: repo-package-metadata-post
      - id: micro-behaviors/communications/url/host/port-http::http-alt-port-8080
  - id: npm-dependency-changeset-addkey-post
    desc: Dependency changesets and addKey POST clues
    crit: suspicious
    conf: 0.97
    attack: T1041
    all:
      - id: repo-package-metadata-post
      - id: micro-behaviors/communications/url/query/command::hbase-named-addkey-query
      - id: micro-behaviors/communications/http/telemetry::dependency-changesets-row
    any:
      - id: micro-behaviors/communications/http/telemetry::package-changesets-table-name
      - id: micro-behaviors/communications/url/construction/fragment::js-fragmented-url-protocol
      - id: micro-behaviors/communications/url/host/port-http::http-alt-port-8080
  - id: npm-publish-repo-metadata-telemetry
    for:
      - npm
      - tar
      - javascript
      - package.json
    desc: npm publish helper reports local repo and package metadata
    crit: suspicious
    conf: 0.93
    attack: T1195.002
    all:
      - id: metadata/package/scripts/build::npm-publish-hooks
      - id: repo-package-metadata-post
    any:
      - id: micro-behaviors/communications/url/host/port-http::http-alt-port-8080
      - id: metadata/import/builtin::require-child-process
