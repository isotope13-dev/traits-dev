# Reviewed observation: no attacker intent is inferred by this matcher.
defaults:
  platforms:
  - unix
  - windows
  for:
  - package.json
composite_rules:
- id: package-import-get-user-env-context
  desc: Package GET, import call, user environment and empty catch
  crit: notable
  conf: 0.97
  for:
  - npm
  - tar
  - package.json
  - javascript
  scope: archive
  all:
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  - id: micro-behaviors/data/control-flow/module-exec::module-level-imported-method-call
  - id: micro-behaviors/os/env/user-info::node-user-identity-env-reference
  - id: micro-behaviors/data/control-flow/error-handling::empty-named-catch-text
  any:
  - id: metadata/package/versioning/scheme::npm-multidigit-major-starting-nine
  - id: metadata/package/description/disclosure::description-placeholder-poc-or-squat-claim
  - id: metadata/package/description/function::description-simple
  needs: 1
  unless:
  - id: metadata/package/testing/presence/harness/
  - id: metadata/path::test-directory-component
