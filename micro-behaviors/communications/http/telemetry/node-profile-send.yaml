defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-host-profile-json-http-send
    desc: Sends collected hostname as HTTP JSON
    crit: notable
    conf: 0.98
    # Bind the collected object to JSON.stringify and the HTTP request to
    # write(). Nearby, unrelated telemetry must not establish this flow.
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (variable_declaration (variable_declarator
            name: (identifier) @profile
            value: (object (pair value: (call_expression
              function: (member_expression object: (identifier) @os
                property: (property_identifier) @hostname))))))
          (function_declaration body: (statement_block
            (try_statement body: (statement_block
              (variable_declaration (variable_declarator
                name: (identifier) @request
                value: (call_expression function: (member_expression
                  object: (identifier) @http
                  property: (property_identifier) @request_method))))
              (expression_statement (call_expression
                function: (member_expression object: (identifier) @sent_request
                  property: (property_identifier) @write)
                arguments: (arguments (call_expression
                  function: (member_expression object: (identifier) @json
                    property: (property_identifier) @stringify)
                  arguments: (arguments (identifier) @sent_profile))))))))))
          (#eq? @os "os") (#eq? @hostname "hostname")
          (#match? @http "^https?$") (#eq? @request_method "request")
          (#eq? @request @sent_request) (#eq? @write "write")
          (#eq? @json "JSON") (#eq? @stringify "stringify")
          (#eq? @profile @sent_profile)) @transfer
