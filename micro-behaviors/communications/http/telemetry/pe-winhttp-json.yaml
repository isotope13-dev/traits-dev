defaults:
  platforms: [windows]
  for: [pe]
  attack: T1041

composite_rules:
- id: winhttp-json-report-flow
  desc: WinHTTP JSON reporting request flow
  crit: suspicious
  conf: 0.96
  all:
  - id: micro-behaviors/communications/http/client/winhttp::winhttp-request-flow
  - id: micro-behaviors/communications/http/header/content-type::json-header
  any:
  - id: micro-behaviors/communications/http/user-agent::systeminfo-client-user-agent
  - id: micro-behaviors/communications/http/url/telemetry::api-report-path
