defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: node-host-env-assigned-to-h
    desc: Assigns hostname environment value to h
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bh\s*=\s*\(process\.env\.(HOSTNAME|COMPUTERNAME)'

  - id: node-user-env-added-to-h
    desc: Adds username environment value to h
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '\bh\s*=\s*[\s\S]{0,120}\+\s*\(process\.env\.(USER|USERNAME)'

  - id: node-https-get-hex-h-query
    desc: HTTPS GET query hex-encodes h
    crit: notable
    conf: 0.94
    if:
      type: symbol
      kind: call
      exact: https.get
      arg:
        index: 0
        substr: "?h=${Buffer.from(h).toString('hex')}"

composite_rules:
  - id: node-host-user-env-hex-get-query
    desc: HTTPS GET query encodes host and user environment values
    crit: notable
    conf: 0.96
    scope: file
    near_bytes: 2048
    all:
      - id: node-host-env-assigned-to-h
      - id: node-user-env-added-to-h
      - id: node-https-get-hex-h-query

  - id: node-accenture-npm-host-identity-get-query
    desc: Host identity hex query targets Accenture callback
    crit: suspicious
    conf: 0.98
    scope: file
    near_bytes: 2048
    all:
      - id: node-host-user-env-hex-get-query
      - id: micro-behaviors/communications/url/host/domain-http::accenture-npm-azure-callback-reference
