defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-request-body-host-identity-origin
    desc: HTTP request body derives from host identity
    crit: notable
    conf: 0.98
    if:
      type: symbol
      kind: call
      regex: '\.(write|end)$'
      receiver:
        from:
          call: '^(http|https)\.request$'
      arg:
        index: 0
        from:
          call: '^os\.(hostname|userInfo)$'
          through:
            - call: '^JSON\.stringify$'
              arguments: [0]
