# Telemetry SDK HTTP header name literals.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, pe, dll, scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: client-id-request-header
    desc: Client-Id HTTP request header literal
    if:
      type: text
      regex: '(?i)["'']Client-Id["'']'
