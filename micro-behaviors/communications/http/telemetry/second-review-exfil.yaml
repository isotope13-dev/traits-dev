composite_rules:
- platforms:
  - unix
  - windows
  for:
  - python
  id: python-setup-encoded-host-report-cooccurrence
  desc: Setup host queries beside Base64 and HTTP
  crit: notable
  conf: 0.95
  all:
  - id: metadata/build/pip::root-setup-py
  - id: micro-behaviors/os/sysinfo/profile::python-host-information-query-combination
  - id: micro-behaviors/data/encode/base64::b64encode-call
  - id: micro-behaviors/communications/http/request/client::request-python
  any:
  - id: metadata/package/files/wheel-sdist::setuptools
  - id: metadata/package/files/wheel-sdist::distutils-command-import-content
