defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

composite_rules:
  - id: python-runtime-profile-post-context
    desc: Runtime profile fields co-occur with HTTP POST
    conf: 0.95
    all:
      - id: micro-behaviors/data/source/syntax/schema::os-version-string-key
      - id: micro-behaviors/data/source/syntax/schema::python-version-string-key
      - id: micro-behaviors/data/serialize/schema-object::python-architecture-field-key
      - id: micro-behaviors/data/source/syntax/schema::has-gpu-string-key
      - id: micro-behaviors/communications/http/request/client::httpx-client-post-request
