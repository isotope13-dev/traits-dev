defaults:
  platforms: [unix, windows]
  for: [python, whl, python-sdist, zip]

# A named-secret request may be legitimate. These archive contexts bind
# neither a returned secret nor its authentication token to an upload.
composite_rules:
  - id: kaggle-secret-query-tracking-json-context
    desc: Kaggle secret RPC and tracking JSON coexist
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/communications/http/post::kaggle-api-key-secret-request-context
      - id: micro-behaviors/communications/http/request/body::tracking-metrics-json-payload

  - id: kaggle-secret-query-notebook-upload-context
    desc: Kaggle secret-query and fingerprint-upload contexts coexist
    crit: notable
    conf: 0.96
    scope: archive
    all:
      - id: micro-behaviors/communications/http/post::kaggle-api-key-secret-request-context
      - id: micro-behaviors/communications/rpc::secret-read-rpc-session-token-context
      - id: micro-behaviors/communications/http/telemetry::python-remote-fingerprint-host-profile-upload-context
