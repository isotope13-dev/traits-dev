# Tracking uploads and identity queries are useful analyst observations.
# Co-occurrence does not establish unauthorized transfer. Authenticating a
# secret-store RPC and parsing its error establishes neither secret extraction
# nor export of the session token.
defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: python-remote-browser-visitor-id
    desc: Gets visitor ID from remote fingerprint code
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: 'FingerprintJS\.load\(\)[\s\S]{0,120}visitorId'

composite_rules:
  - id: python-tracking-metrics-json-upload
    desc: Uploads collected tracking metrics as JSON
    crit: notable
    conf: 0.95
    near_lines: 30
    all:
      - id: micro-behaviors/communications/http/request/body::tracking-metrics-json-payload
      - id: micro-behaviors/communications/http/post::python-file-post-wrapper-call

  - id: secret-error-identity-tracking-upload-context
    desc: Secret-error identity lookup coexists with tracking upload
    crit: notable
    conf: 0.95
    for: [python, whl, python-sdist, zip]
    scope: archive
    all:
      - id: micro-behaviors/data/parse/regex::secret-rpc-error-visitor-identity-context
      - id: python-tracking-metrics-json-upload

  - id: python-remote-fingerprint-host-profile-upload
    desc: Uploads host identity alongside a remote browser fingerprint
    crit: notable
    conf: 0.98
    for: [python, whl, python-sdist, zip]
    scope: archive
    all:
      - id: micro-behaviors/os/module/require::python-remote-es-module-import
      - id: micro-behaviors/communications/http/request/body::tracking-metrics-json-payload
      - id: micro-behaviors/communications/http/telemetry::python-host-profile-post-context
      - id: python-remote-browser-visitor-id

  - id: python-notebook-identity-tracking-upload
    desc: Uploads notebook identity tracking after a secret-store error lookup
    crit: notable
    conf: 0.95
    for: [python, whl, python-sdist, zip]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/telemetry::secret-error-identity-tracking-upload-context
      - id: micro-behaviors/communications/http/telemetry::python-remote-fingerprint-host-profile-upload

  - id: python-host-profile-post-context
    desc: Host identity queries coexist with HTTP POST
    crit: notable
    conf: 0.9
    for: [python, whl, python-sdist, zip]
    scope: archive
    all:
      - id: micro-behaviors/os/sysinfo/network::python-uuid-getnode-call
      - id: micro-behaviors/process/identity/query::python-current-username
      - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
      - id: micro-behaviors/communications/http/ip-discovery::ipify-api
      - id: micro-behaviors/communications/http/post::http-post-client-call
