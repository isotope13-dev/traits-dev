defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
composite_rules:
- id: python-tracking-json-file-post-context
  desc: Tracking JSON serialization near file-POST wrapper
  conf: 0.95
  near_lines: 30
  all:
  - id: metadata/lang/source/syntax/call/arguments::tracking-metrics-json-payload
  - id: micro-behaviors/communications/http/post::python-file-post-wrapper-call
- id: secret-error-identity-tracking-upload-context
  desc: Secret-error identity lookup coexists with tracking upload
  conf: 0.95
  for:
  - python
  - whl
  - python-sdist
  - zip
  scope: archive
  all:
  - id: micro-behaviors/data/parse/regex::secret-rpc-error-visitor-identity-context
  - id: python-tracking-json-file-post-context
- id: python-remote-fingerprint-host-profile-upload-context
  desc: Fingerprint, host-query, and tracking-upload contexts coexist
  conf: 0.98
  for:
  - python
  - whl
  - python-sdist
  - zip
  scope: archive
  all:
  - id: micro-behaviors/os/module/require::python-remote-es-module-import
  - id: metadata/lang/source/syntax/call/arguments::tracking-metrics-json-payload
  - id: micro-behaviors/communications/http/telemetry::python-host-profile-post-context
  - id: micro-behaviors/os/sysinfo/hardware::python-embedded-fingerprintjs-visitor-context
- id: python-notebook-identity-tracking-upload-context
  desc: Notebook identity and tracking-upload contexts coexist
  conf: 0.95
  for:
  - python
  - whl
  - python-sdist
  - zip
  scope: archive
  all:
  - id: micro-behaviors/communications/http/telemetry::secret-error-identity-tracking-upload-context
  - id: micro-behaviors/communications/http/telemetry::python-remote-fingerprint-host-profile-upload-context
- id: python-host-profile-post-context
  desc: Host identity queries coexist with HTTP POST
  conf: 0.9
  for:
  - python
  - whl
  - python-sdist
  - zip
  scope: archive
  all:
  - id: micro-behaviors/os/sysinfo/network::python-uuid-getnode-call
  - id: micro-behaviors/process/identity/query::python-current-username
  - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
  - id: micro-behaviors/communications/http/ip-discovery::ipify-api
  - id: micro-behaviors/communications/http/post::http-post-client-call
