defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  attack: T1119

traits:
- id: sentry-self-hosted-dsn
  desc: Self-hosted Sentry DSN endpoint
  crit: notable
  conf: 0.92
  if:
    type: literal
    kind: string
    regex: 'https://[a-f0-9]{16,}@[a-z0-9.-]+/[0-9]+'
    case_insensitive: true
  not:
  - regex: 'https://[a-f0-9]{16,}@o[0-9]+\.ingest\.[a-z0-9.-]*sentry\.io/[0-9]+'
