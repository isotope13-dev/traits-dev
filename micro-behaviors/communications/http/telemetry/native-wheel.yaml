# These archive-wide references establish co-occurrence, not data flow or
# unauthorized collection. Native-only packaging and absent dist-info do not
# turn device/session checks into a supply-chain attack. Preserve the evidence
# as a telemetry capability without claiming execution or a hidden payload.
defaults:
  platforms: [windows, unix]

composite_rules:
  - id: native-wheel-firebase-device-session
    desc: Native-only wheel contains Firebase, device ID and session heartbeat references
    crit: notable
    conf: 0.93
    for: [whl, pe, dll, so]
    scope: archive
    all:
      - id: metadata/package/files/wheel-sdist::wheel-missing-dist-info
      - id: metadata/package/files/wheel-sdist::wheel-native-only-code
      - id: micro-behaviors/os/sysinfo/machine-id::python-device-id-getter
      - id: micro-behaviors/time/schedule/interval::heartbeat-routine-label
      - id: micro-behaviors/os/security/auth/session::session-token-field
      - id: micro-behaviors/communications/http/services/firebase::pyrebase-client
      - id: micro-behaviors/communications/http/services/google::google-api-key-packed
