defaults:
  platforms:
  - macos
  for:
  - macho
  attack: T1555.003,T1005,T1041,T1132.001
traits:
- id: go-encrypted-post-method
  desc: Encrypted data posting method reference
  crit: notable
  conf: 0.93
  if:
    type: text
    substr: main.postEncryptedData
- id: go-server-post-method
  desc: Server posting method reference
  crit: notable
  conf: 0.93
  if:
    type: text
    substr: main.postToServer
composite_rules:
- id: go-encrypted-server-reporting-methods
  desc: Encrypted posting and server URL method references
  crit: suspicious
  conf: 0.93
  needs: 3
  any:
  - id: micro-behaviors/communications/http/telemetry::go-encrypted-post-method
  - id: micro-behaviors/communications/http/telemetry::go-server-post-method
  - id: micro-behaviors/communications/http/url/build::go-server-url-method
