# Loggly log-shipper construction and credential configuration.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: loggly-transport-construct
    desc: Constructs Loggly log transport
    if:
      type: text
      substr: 'new Loggly('

  - id: loggly-shipper-reference
    desc: References winston-loggly-bulk log shipper
    if:
      type: text
      regex: '["'']winston-loggly-bulk["'']'

  # A `token:`/`subdomain:` field filled by decoding a string array (rather
  # than a literal or environment read) hides the log-service credentials
  # from static review. Generic over the decoder name so variants that rename
  # the helper still match; the field names are what make it a credential.
  - id: log-service-chunked-credential
    desc: Log-service credential decoded from string array
    crit: suspicious
    conf: 0.78
    if:
      type: text
      # The array must open with a string chunk: `toCustomProperty([...path])`
      # builds a name from a spread list and decodes nothing.
      regex: '(token|subdomain):\s*[A-Za-z_$][\w$]*\(\[\s*["''`][^\]]{0,240}\]\)'
