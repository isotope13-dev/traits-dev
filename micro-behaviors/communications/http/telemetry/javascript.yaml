defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
# User Activity Exfiltration

traits:
  - id: application-usage-telemetry-endpoint
    desc: Application usage telemetry endpoint path
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '(?i)/(telemetry|usage)/(run|event|events|usage)([/?#"'']|$)'
  - id: heartbeat-path-literal
    desc: "Heartbeat endpoint path literal"
    crit: component
    conf: 0.8
    if:
      type: literal
      kind: string
      exact: /hb
  - id: extension-uninstall-endpoint
    desc: Extension uninstall telemetry endpoint
    crit: component
    conf: 0.9
    if: { type: text, substr: '/un/?uninstall=true' }
composite_rules:
  - id: browser-identity-near-periodic-request
    desc: Browser identity near periodic request
    crit: notable
    conf: 0.92
    near_bytes: 8192
    all:
      - id: micro-behaviors/os/sysinfo/platform/browser::navigator-platform-read
      - id: micro-behaviors/communications/http/user-agent::navigator-useragent-read
      - id: micro-behaviors/communications/url/navigation-http::browser-location-host-read
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
      - id: micro-behaviors/data/serialize/json::json-stringify-call
      - id: micro-behaviors/time/schedule/interval::setInterval
    unless:
      - id: metadata/package/testing/

  - id: extension-periodic-heartbeat
    desc: Browser extension sends hourly heartbeat
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/request/client::image-src-network-request
      - id: micro-behaviors/time/schedule/webextension::chrome-alarms-create
      - id: micro-behaviors/communications/http/telemetry::heartbeat-path-literal
      - id: micro-behaviors/time/schedule/webextension::hourly-alarm-interval
