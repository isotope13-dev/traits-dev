# Bind the source stream, multipart object, upload callback body, parsed URL,
# and reporting argument. These are normal capabilities until a consumer adds
# evidence that the advertised destination is being bypassed.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-file-upload-response-url-reported
    desc: File upload response URL enters reporting call
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      language: javascript
      query: |
        ((function_declaration
          parameters: (formal_parameters . (identifier) @file .)
          body: (statement_block
            (lexical_declaration (variable_declarator name: (identifier) @form
              value: (object (pair key: (property_identifier) @filekey
                value: (call_expression function: (member_expression
                  property: (property_identifier) @read)
                  arguments: (arguments . (identifier) @opened .))))))
            (return_statement (call_expression
              function: (member_expression property: (property_identifier) @post)
              arguments: (arguments
                . (object
                  (pair key: (property_identifier) @urlkey
                    value: (string (string_fragment) @endpoint))
                  (pair key: (property_identifier) @formkey value: (identifier) @sentform))
                . (function_expression
                  parameters: (formal_parameters . (_) . (_) . (identifier) @response .)
                  body: (statement_block
                    (lexical_declaration (variable_declarator name: (identifier) @parsed
                      value: (call_expression function: (member_expression
                        object: (identifier) @json property: (property_identifier) @parse)
                        arguments: (arguments . (identifier) @body .))))
                    (lexical_declaration (variable_declarator name: (identifier) @imageurl
                      value: (member_expression object: (member_expression
                        object: (identifier) @parsedused) property: (property_identifier) @urlfield)))
                    (expression_statement (call_expression function: (identifier) @report
                      arguments: (arguments (_)
                        (object (pair value: (object
                          (pair key: (property_identifier) @reportedkey
                            value: (template_string (template_substitution (identifier) @reportedurl))))))))))))))))
          (#eq? @file @opened) (#eq? @read "createReadStream") (#eq? @filekey "file")
          (#eq? @post "post") (#eq? @urlkey "url") (#eq? @formkey "formData")
          (#eq? @form @sentform) (#eq? @response @body)
          (#eq? @json "JSON") (#eq? @parse "parse") (#eq? @parsed @parsedused)
          (#match? @endpoint "^https?://[^/]+/(v[0-9]+/)?(uploadFile|files/upload|images/upload)([/?#]|$)")
          (#match? @urlfield "^(imgUrl|imageUrl|fileUrl|url)$")
          (#match? @report "(?i)(report|telemetry|track|log)")
          (#eq? @reportedkey "url") (#eq? @imageurl @reportedurl))
