defaults:
  platforms: [unix, windows]
  for: [python, whl]

# The hardware resource fields themselves (cpu/memory/disk/gpu dict keys) are
# neutral config syntax and live in
# micro-behaviors/os/sysinfo/hardware/resource-fields.yaml; the composites
# below reference them cross-directory; no unauthorized transfer is established.

composite_rules:
  - id: python-task-host-profile-http-context
    desc: Task process, host profile and HTTP clues coexist
    crit: notable
    conf: 0.98
    scope: archive
    all:
      - id: micro-behaviors/data/property/assign::device-id-field-python
      - id: micro-behaviors/os/sysinfo/hostname::python-host-name-mapping-call
      - id: micro-behaviors/os/sysinfo/hardware::python-hardware-resource-field
      - id: micro-behaviors/communications/http/telemetry::python-aigc-post-marker
      - id: micro-behaviors/process/create/subprocess::python-task-api-process-context
      - id: micro-behaviors/process/argument/option::python-widget-process-arguments
      - id: micro-behaviors/communications/http/request/client::request-python
