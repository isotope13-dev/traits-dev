defaults:
  platforms: [unix, windows]
  for: [python]

traits:
  - id: dask-ingest-samples-endpoint
    desc: Dask samples ingest endpoint
    crit: notable
    conf: 0.93
    ref: sha256:f641c73a90cccdd02a5c5c29a1f550adb4cdfd260d05403d99db4b379db070ff
    if:
      type: literal
      substr: /ingest/samples

  - id: dask-ingest-graph-endpoint
    desc: Dask graph ingest endpoint
    crit: notable
    conf: 0.93
    ref: sha256:f641c73a90cccdd02a5c5c29a1f550adb4cdfd260d05403d99db4b379db070ff
    if:
      type: literal
      substr: /ingest/graph

  - id: dask-ingest-death-endpoint
    desc: Dask death event ingest endpoint
    crit: notable
    conf: 0.93
    ref: sha256:f641c73a90cccdd02a5c5c29a1f550adb4cdfd260d05403d99db4b379db070ff
    if:
      type: literal
      substr: /ingest/death

composite_rules:
  - id: dask-worker-telemetry-http-reporting
    desc: Dask worker telemetry HTTP reporting
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/data/plugin::dask-worker-plugin-subclass
      - id: micro-behaviors/data/plugin::dask-worker-state-task-access
      - id: micro-behaviors/os/sysinfo/performance/monitoring::python-psutil-process-metrics
      - id: micro-behaviors/os/sysinfo/performance/monitoring::dask-worker-runtime-metrics
      - id: dask-ingest-samples-endpoint
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/communications/http/post::python-post-method-literal

  - id: dask-scheduler-death-event-http-reporting
    desc: Dask scheduler death-event HTTP reporting
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/data/plugin::dask-scheduler-plugin-subclass
      - id: micro-behaviors/data/plugin::dask-scheduler-worker-removal-hook
      - id: dask-ingest-death-endpoint
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/communications/http/post::python-post-method-literal

  - id: dask-graph-source-http-reporting
    desc: Dask graph source HTTP reporting
    crit: notable
    conf: 0.9
    all:
      - id: micro-behaviors/data/plugin::dask-graph-source-upload-fields
      - id: dask-ingest-graph-endpoint
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call
      - id: micro-behaviors/communications/http/post::python-post-method-literal
