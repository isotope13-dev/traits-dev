defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.97
traits:
- id: python-hostname-post-json-flow
  desc: Hostname lookup contributes to POST JSON body
  if:
    type: symbol
    kind: call
    exact: requests.post
    arg:
      from:
        field: json
        call: ^socket\.gethostname$
        through:
          - call: '^json\.dumps$'
            arguments: [0]
          - call: '^base64\.b64encode$'
            arguments: [0]
          - call: '\.(encode|decode)$'
            receiver: true
