# An embedded DSN identifies a telemetry destination, not a proven upload.
# Native string pools need the text surface rather than a source literal AST.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.95

traits:
  - id: native-sentry-ingest-dsn
    desc: Native Sentry telemetry destination DSN
    if:
      type: text
      regex: 'https://[a-f0-9]{16,}@o[0-9]+\.ingest(\.[a-z]+)?\.sentry\.io/[0-9]+'
      case_insensitive: true
