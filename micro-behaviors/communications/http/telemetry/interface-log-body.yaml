# Follow a named interface-query helper into an IP-labelled JSON notice and
# the same POST options passed to the imported HTTP client. Binary-expression
# variants allow extra notice fields without relying on local variable names.
# This is reporting capability, not evidence of authorization or abuse.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-interface-helper-result-in-post-log
