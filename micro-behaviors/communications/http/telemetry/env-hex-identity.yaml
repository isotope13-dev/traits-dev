# Reviewed observation: no attacker intent is inferred by this matcher.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: node-env-hex-identity-get-context
  desc: Host/user environment reads near hex encoding and HTTPS GET
  crit: notable
  conf: 0.97
  scope: file
  near_bytes: 2048
  all:
  - id: micro-behaviors/os/env/user-info::node-user-identity-env-reference
  - id: micro-behaviors/os/env/system-info::node-host-identity-env-reference
  - id: micro-behaviors/data/encode/hex::buffer-hex
  - id: micro-behaviors/communications/http/get::node-https-get-reference
  unless:
  - id: metadata/package/testing/
  - id: metadata/path::test-directory-component
