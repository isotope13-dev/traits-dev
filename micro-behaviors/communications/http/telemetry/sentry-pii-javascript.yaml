defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  attack: T1119
  mbc: E1119

traits:
- id: sentry-default-pii-enabled
  desc: Sentry default PII enabled
  crit: notable
  conf: 0.94
  if:
    type: tree-sitter
    query: |
      ((pair
        key: (property_identifier) @key
        value: (true) @value)
       (#eq? @key "sendDefaultPii"))
- id: sentry-ip-address-user-field
  desc: IP field passed in a Sentry.setUser object
  crit: notable
  conf: 0.9
  unless:
  - id: well-known/lib/observability/sentry-js::sentry-js-sdk
  if:
    type: tree-sitter
    query: |
      (call_expression
        function: (member_expression
          object: (identifier) @object
          property: (property_identifier) @method)
        arguments: (arguments
          (object
            (pair
              key: (property_identifier) @key)))
        (#eq? @object "Sentry")
        (#eq? @method "setUser")
        (#eq? @key "ip_address"))
