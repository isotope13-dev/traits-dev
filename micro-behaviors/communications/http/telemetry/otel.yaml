defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, python]
  crit: notable
  conf: 0.97

traits:
  - id: otel-exporter-http-endpoint
    desc: Sets an HTTP(S) OpenTelemetry collector URL
    if:
      type: text
      regex: 'OTEL_EXPORTER_OTLP_ENDPOINT["'']?\]?\s*[:=]\s*["'']https?://[^\s"''`<>]{1,256}'

  - id: otel-exporter-hardcoded-bearer-header
    desc: Bundled bearer token in OTLP exporter headers
    if:
      type: text
      # Collector tokens also use URL-safe, dotted and padded spellings.
      # Require the closing quote so a literal prefix of an interpolated token
      # is not mistaken for a fully bundled credential.
      regex: 'OTEL_EXPORTER_OTLP_HEADERS["'']?\]?\s*[:=]\s*["'']Authorization=Bearer\s+[-\w.~+/=]{16,}["'']'
