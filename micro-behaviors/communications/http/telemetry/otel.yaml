defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, json, python]
  crit: notable
  conf: 0.97

traits:
  - id: otel-exporter-http-endpoint
    desc: Configures an HTTP telemetry collector endpoint
    if:
      type: text
      regex: 'OTEL_EXPORTER_OTLP_ENDPOINT["'']?\s*[:=]\s*["'']https?://'

  - id: otel-exporter-hardcoded-bearer-header
    desc: Hardcoded bearer token in OTEL exporter headers
    if:
      type: text
      regex: 'OTEL_EXPORTER_OTLP_HEADERS["'']?\s*[:=]\s*["'']Authorization=Bearer\s+[0-9a-f]{16,}'
