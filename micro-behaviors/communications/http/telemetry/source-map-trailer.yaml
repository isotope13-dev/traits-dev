# A generated identifier and platform field are ordinary analytics data.
# Appending code after a source-map directive does not prove bundle tampering
# or host profiling. Preserve the observable trailer/API context neutrally.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
- id: source-map-trailer-identity-post
  desc: Source-map trailer with ID and POST references
  crit: notable
  conf: 0.99
  attack: T1195.002,T1041,T1082
  scope: file
  all:
  - id: metadata/build/bundler/asset::executable-code-after-source-map
  - id: metadata/import/builtin::require-http
  - id: metadata/import/builtin::require-https
  - id: micro-behaviors/process/identity/query::node-os-alias-homedir-call
  - id: micro-behaviors/fs/write/file/full::node-write-file-sync
  - id: micro-behaviors/communications/http/request/verb::post-method-text
  - id: micro-behaviors/communications/url/host/domain-http::js-remote-host-url
  - id: micro-behaviors/data/serialize/schema-object::identity-platform-json-payload
