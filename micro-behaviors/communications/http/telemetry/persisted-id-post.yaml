defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.96

traits:
  - id: node-read-write-id-json-post
    desc: Reads, writes, and posts local identifier
    if:
      type: tree-sitter
      language: javascript
      query: |
        (statement_block
          (try_statement body: (statement_block
            (expression_statement (assignment_expression
              left: (identifier) @id
              right: (call_expression function: (member_expression
                object: (call_expression
                  function: (member_expression property: (property_identifier) @read)
                  arguments: (arguments . (identifier) @path))
                property: (property_identifier) @trim))))))
          (if_statement consequence: (statement_block
            (try_statement body: (statement_block
              (expression_statement (call_expression
                function: (member_expression property: (property_identifier) @write)
                arguments: (arguments . (identifier) @path2 . (identifier) @id2)))))))
          (variable_declaration (variable_declarator name: (identifier) @payload
            value: (call_expression
              function: (member_expression object: (identifier) @json property: (property_identifier) @stringify)
              arguments: (arguments (object (pair key: (property_identifier) @key value: (identifier) @id3))))))
          (variable_declaration (variable_declarator name: (identifier) @request
            value: (call_expression
              function: (member_expression property: (property_identifier) @request_fn)
              arguments: (arguments (object (pair key: (property_identifier) @method value: (string (string_fragment) @post)))))))
          (expression_statement (call_expression
            function: (member_expression object: (identifier) @request2 property: (property_identifier) @send)
            arguments: (arguments . (identifier) @payload2 .)))
          (#eq? @read "readFileSync")
          (#eq? @trim "trim")
          (#eq? @write "writeFileSync")
          (#eq? @id @id2)
          (#eq? @id @id3)
          (#eq? @path @path2)
          (#eq? @json "JSON")
          (#eq? @stringify "stringify")
          (#eq? @key "id")
          (#eq? @request_fn "request")
          (#eq? @method "method")
          (#eq? @post "POST")
          (#eq? @request @request2)
          (#eq? @send "write")
          (#eq? @payload @payload2))
