composite_rules:
- platforms:
  - unix
  - windows
  for:
  - python
  id: python-host-cwd-post-cooccurrence
  desc: Hostname or user and cwd queries beside POST
  crit: notable
  conf: 0.95
  near_lines: 30
  all:
  - id: micro-behaviors/communications/http/post::requests-post
  - id: micro-behaviors/fs/directory/cwd::python-os-getcwd
  any:
  - id: micro-behaviors/os/sysinfo/hostname::python-socket-gethostname
  - id: micro-behaviors/os/sysinfo/hostname::python-os-uname-nodename
  - id: micro-behaviors/process/identity/query::python-getpass-user
  unless:
  - id: metadata/package/testing/harness/runtime/
  - id: well-known/tool/detection/security-scanner/
  - id: well-known/tool/detection/llm-scanner/
