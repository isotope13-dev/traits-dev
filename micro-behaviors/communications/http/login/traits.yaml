# Login request structure is a neutral HTTP capability. The public-tunnel
# objective combines it with a destination class and persistence surface.
defaults:
  platforms: [unix, windows]
  for: [scripts]
  crit: notable
  conf: 0.88
  attack: T1071.001

traits:
  # Anchored and space-free so the literal actually looks like a route: a
  # bare `/login\b` also matched prose such as "Opening payment/login page…"
  # in a log message, which references no HTTP route at all.
  - id: http-login-path
    desc: HTTP login path
    if:
      type: literal
      kind: string
      regex: '^[^\s]{0,60}/login\b'
  - id: http-login-username-field
    desc: HTTP login username field
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)(["''](user(name)?|login|email)["'']\s*[:=]|(^|[?&])(user(name)?|login|email)=)'
  - id: http-login-password-field
    desc: HTTP login password field
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '(?i)(["''](pass(word)?|passwd)["'']\s*[:=]|(^|[?&])(pass(word)?|passwd)=)'
  # "the request method is POST" is not a login capability and is not defined
  # here: it matched `<form method="post">` in ordinary admin pages while
  # keying a communications/http/login feature. The composite below reaches
  # the canonical POST atoms in communications/http/post/ instead.

composite_rules:
  - id: http-login-credential-form
    desc: HTTP login form carries credentials
    near_bytes: 512
    all:
      - id: http-login-path
      - id: http-login-username-field
      - id: http-login-password-field
  - id: http-login-credential-post
    desc: HTTP login credentials submitted by POST
    conf: 0.92
    near_bytes: 1024
    all:
      - id: http-login-credential-form
    any:
      - id: micro-behaviors/communications/http/post::request-options-post-method
      - id: micro-behaviors/communications/http/post::html-form-post-method
      - id: micro-behaviors/communications/http/curl::curl-post-flag
      - id: micro-behaviors/communications/http/post::post
