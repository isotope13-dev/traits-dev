# Encoded servlet login routes are not proof of successful exploitation.
# Match request lines embedded in access logs as well as raw HTTP requests.
defaults:
  platforms: [unix, windows, appliance]
  for: [text, data, scripts, source]
  crit: notable
  conf: 0.98

traits:
  - id: servlet-login-encoded-position-0
    desc: Servlet login POST percent-encodes character 1
    if:
      type: text
      regex: '(?m)\bPOST /%6[aA]_security_check HTTP/1\.[01]\b'

  - id: servlet-login-encoded-position-1
    desc: Servlet login POST percent-encodes character 2
    if:
      type: text
      regex: '(?m)\bPOST /j%5[fF]security_check HTTP/1\.[01]\b'

  - id: servlet-login-encoded-position-2
    desc: Servlet login POST percent-encodes character 3
    if:
      type: text
      regex: '(?m)\bPOST /j_%73ecurity_check HTTP/1\.[01]\b'

  - id: servlet-login-encoded-position-3
    desc: Servlet login POST percent-encodes character 4
    if:
      type: text
      regex: '(?m)\bPOST /j_s%65curity_check HTTP/1\.[01]\b'

  - id: servlet-login-encoded-position-4
    desc: Servlet login POST percent-encodes character 5
    if:
      type: text
      regex: '(?m)\bPOST /j_se%63urity_check HTTP/1\.[01]\b'

  - id: servlet-login-encoded-position-5
    desc: Servlet login POST percent-encodes character 6
    if:
      type: text
      regex: '(?m)\bPOST /j_sec%75rity_check HTTP/1\.[01]\b'

  - id: servlet-login-encoded-position-6
    desc: Servlet login POST percent-encodes character 7
    if:
      type: text
      regex: '(?m)\bPOST /j_secu%72ity_check HTTP/1\.[01]\b'

  - id: servlet-login-encoded-position-7
    desc: Servlet login POST percent-encodes character 8
    if:
      type: text
      regex: '(?m)\bPOST /j_secur%69ty_check HTTP/1\.[01]\b'

  - id: servlet-login-encoded-position-8
    desc: Servlet login POST percent-encodes character 9
    if:
      type: text
      regex: '(?m)\bPOST /j_securi%74y_check HTTP/1\.[01]\b'

  - id: servlet-login-encoded-position-9
    desc: Servlet login POST percent-encodes character 10
    if:
      type: text
      regex: '(?m)\bPOST /j_securit%79_check HTTP/1\.[01]\b'

  - id: servlet-login-encoded-position-10
    desc: Servlet login POST percent-encodes character 11
    if:
      type: text
      regex: '(?m)\bPOST /j_security%5[fF]check HTTP/1\.[01]\b'

  - id: servlet-login-encoded-position-11
    desc: Servlet login POST percent-encodes character 12
    if:
      type: text
      regex: '(?m)\bPOST /j_security_%63heck HTTP/1\.[01]\b'

  - id: servlet-login-encoded-position-12
    desc: Servlet login POST percent-encodes character 13
    if:
      type: text
      regex: '(?m)\bPOST /j_security_c%68eck HTTP/1\.[01]\b'

  - id: servlet-login-encoded-position-13
    desc: Servlet login POST percent-encodes character 14
    if:
      type: text
      regex: '(?m)\bPOST /j_security_ch%65ck HTTP/1\.[01]\b'

  - id: servlet-login-encoded-position-14
    desc: Servlet login POST percent-encodes character 15
    if:
      type: text
      regex: '(?m)\bPOST /j_security_che%63k HTTP/1\.[01]\b'

  - id: servlet-login-encoded-position-15
    desc: Servlet login POST percent-encodes character 16
    if:
      type: text
      regex: '(?m)\bPOST /j_security_chec%6[bB] HTTP/1\.[01]\b'

  - id: sdwan-reserved-username-field
    desc: SD-WAN reserved username field
    crit: notable
    if:
      type: text
      regex: '(?m)^username=viptela-reserved-[A-Za-z0-9_.-]+'

  - id: sdwan-reserved-account-log-field
    desc: SD-WAN reserved account in authentication log
    crit: notable
    if:
      type: text
      regex: '\[UserUtils\][^\r\n]{0,240}\(viptela-reserved-[A-Za-z0-9_.-]+\)'

composite_rules:
  - id: percent-encoded-servlet-login-post
    desc: Percent-encoded servlet login POST
    crit: notable
    conf: 0.85
    any:
      - id: servlet-login-encoded-position-0
      - id: servlet-login-encoded-position-1
      - id: servlet-login-encoded-position-2
      - id: servlet-login-encoded-position-3
      - id: servlet-login-encoded-position-4
      - id: servlet-login-encoded-position-5
      - id: servlet-login-encoded-position-6
      - id: servlet-login-encoded-position-7
      - id: servlet-login-encoded-position-8
      - id: servlet-login-encoded-position-9
      - id: servlet-login-encoded-position-10
      - id: servlet-login-encoded-position-11
      - id: servlet-login-encoded-position-12
      - id: servlet-login-encoded-position-13
      - id: servlet-login-encoded-position-14
      - id: servlet-login-encoded-position-15
