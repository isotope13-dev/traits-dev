defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: login-route-username-password-references
    desc: Login route near username and password names
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: /auth/login[\s\S]{0,700}username[\s\S]{0,300}password
