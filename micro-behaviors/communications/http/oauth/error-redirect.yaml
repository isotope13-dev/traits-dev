# OAuth authorization-request fields used by silent authentication flows. These
# are protocol observations, not phishing verdicts: legitimate clients also use
# prompt=none and registered redirect URIs. Objective rules add the deliberate
# failure or credential-relay behavior that establishes abuse.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, html]
  crit: notable
  conf: 0.94

traits:
  - id: oauth-authorization-endpoint-url
    desc: OAuth authorization endpoint URL
    if:
      type: text
      regex: '(?i)https?://[^/"''\s]{1,80}/[^"''\s]{0,120}(oauth2?|oidc)/(v[\d.]+/)?(authorize|auth)\b'

  - id: oauth-silent-prompt-parameter
    desc: OAuth request suppresses interactive prompts
    if:
      type: text
      regex: '(?i)([?&](amp;)?prompt=none\b|["'']prompt["'']?\s*[:=]\s*["'']none["''])'

  - id: oauth-invalid-scope-query-parameter
    desc: OAuth URL declares an invalid scope
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)[?&](amp;)?scope=(invalid|nonexistent)([_-]?scope)?\b'
    unless:
      - id: metadata/package/testing/presence/fixture/
      - id: well-known/tool/detection/

  - id: oauth-invalid-scope-mapping-parameter
    desc: OAuth parameter map declares an invalid scope
    crit: suspicious
    conf: 0.97
    if:
      type: text
      regex: '(?i)["'']scope["'']?\s*[:=]\s*["''](invalid|nonexistent)([_-]?scope)?["'']'
    unless:
      - id: metadata/package/testing/presence/fixture/
      - id: well-known/tool/detection/
      # VS Code bundles color-theme JSON as a frozen string. Its TextMate
      # token catalog legitimately contains `"scope":"invalid"`; that is a
      # highlight class, not an OAuth request parameter.
      - id: metadata/library/vscode::vscode-color-theme-json-module

composite_rules:
  - id: oauth-explicit-invalid-scope-parameter
    desc: OAuth request declares an invalid scope
    crit: suspicious
    conf: 0.97
    any:
      - id: oauth-invalid-scope-query-parameter
      - id: oauth-invalid-scope-mapping-parameter
