# Microsoft identity-provider protocol fields used by Windows Hello assertion
# proof-of-concept code. These remain neutral HTTP/OAuth observations; the
# credential-access objective combines them with CNG key reuse.
defaults:
  platforms: [windows]
  for: [powershell, csharp, cpp, python, go, rust, pe, dll]

traits:
  - id: microsoft-oauth-token-endpoint
    desc: Microsoft OAuth token endpoint
    crit: notable
    conf: 0.94
    platforms: [windows, unix]
    for: [scripts, pe, elf]
    if:
      type: text
      regex: '(?i)login\.microsoftonline\.com/[^/"''\s]{1,128}/oauth2/(v2\.0/)?token\b'

  - id: microsoft-oauth-server-challenge-grant
    desc: Requests Microsoft OAuth server challenge
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: grant_type=srv_challenge

  - id: microsoft-ngc-jwt-use-claim
    desc: Uses Microsoft NGC JWT key claim
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\buse\s*[:=]\s*["'']ngc["'']'

  - id: microsoft-aza-ugs-scope
    desc: Requests Microsoft aza ugs token scope
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\bscope\s*[:=]\s*["'']openid\s+aza\s+ugs["'']'
