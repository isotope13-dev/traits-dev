# Graph returns an added password in secretText. These source structures use
# that property as an OAuth client_secret, rather than merely printing it.
# They are neutral authentication fields, not proof of unauthorized access.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.94

traits:
  # Subscripts and JsonElement.GetProperty are equivalent property reads.
  - id: client-secret-from-secrettext-property
    desc: OAuth client_secret reads secretText property
    for: [python, javascript, typescript, ruby, csharp]
    if:
      type: text
      regex: '\bclient_secret["''\]]{1,2}\s*[:=]\s*\w+(\[|\.GetProperty\()["'']secretText["'']'

  - id: client-secret-from-secrettext-member
    desc: OAuth client_secret reads Graph secret member
    for: [powershell, javascript, typescript, python, csharp]
    if:
      type: text
      regex: '(?i)\bclient_secret["''\]]{0,2}\s*[:=]\s*\$?[\w.]+\.secret_?text\b'

