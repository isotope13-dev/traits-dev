defaults:
  platforms: [unix, windows]
  for: [html, javascript]

traits:
- id: google-gmail-scope-mail
  desc: Google Mail full-access scope URL
  crit: notable
  conf: 0.95
  if:
    # A full-mail scope uses the bare https://mail.google.com/ origin; deep links
    # such as https://mail.google.com/mail/u/0#inbox/... are not the scope.
    type: text
    # A visible Gmail link is also common in browser-extension landing pages,
    # so require nearby OAuth/scope context in either direction.
    regex: '(?i)\b(scope|scopes|oauth|authorize)\b.{0,80}https://mail\.google\.com/'
