# Microsoft first-party application IDs.
#
# These GUIDs identify Microsoft's own public clients — Office, Azure CLI,
# Azure PowerShell, Teams.  They are pre-consented in every tenant and belong
# to the "family of client IDs" (FOCI), so a refresh token issued for one can
# be redeemed for another without further consent.
#
# That property is why token-abuse tooling hardcodes them: an operator holding
# a stolen refresh token needs no app registration of their own and triggers no
# consent prompt.  AADInternals, roadtx, TokenTactics and the OctoLink tooling
# shipped with device-code phishing kits all carry these constants.
#
# Legitimate code contains them too — MSAL samples, deployment scripts and
# documentation — so identity only.  The abuse objectives supply the intent.
defaults:
  platforms: [windows, unix]
  for: [powershell, python, javascript, typescript, csharp, html, shell, batch]
  crit: notable
  conf: 0.95

traits:
  - id: office-desktop-client-id
    desc: Microsoft Office first-party client ID
    if:
      type: text
      substr: d3590ed6-52b3-4102-aeff-aad2292ab01c

  - id: azure-cli-client-id
    desc: Azure CLI first-party client ID
    if:
      type: text
      substr: 04b07795-8ddb-461a-bbee-02f9e1bf7b46

  - id: azure-powershell-client-id
    desc: Azure PowerShell first-party client ID
    if:
      type: text
      substr: 1950a258-227b-4e31-a9cf-717495945fc2

  - id: teams-desktop-client-id
    desc: Microsoft Teams first-party client ID
    if:
      type: text
      substr: 1fec8e78-bce4-4aaf-ab1b-5451cc387264

composite_rules:
  - id: microsoft-first-party-client-id
    desc: Uses a Microsoft first-party client ID
    crit: notable
    conf: 0.95
    any:
      - id: office-desktop-client-id
      - id: azure-cli-client-id
      - id: azure-powershell-client-id
      - id: teams-desktop-client-id
