defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
- id: google-userinfo-endpoint
  desc: Google OAuth userinfo endpoint
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: https://www.googleapis.com/oauth2/v3/userinfo



composite_rules:
- id: extension-google-profile-flow
  desc: Extension Google identity and profile JSON
  crit: notable
  conf: 0.96
  near_bytes: 1200
  all:
    - id: "micro-behaviors/os/security/auth/session::browser-identity-auth-token-call"
    - id: google-userinfo-endpoint
    - id: micro-behaviors/communications/http/authorization-header::bearer-auth-header-template
    - id: micro-behaviors/data/serialize/schema-object::email-profile-json
    - id: micro-behaviors/communications/http/request/client::js-fetch-call
