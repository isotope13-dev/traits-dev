---
defaults:
  crit: notable
  platforms:
  - windows
  - unix
  for:
  - javascript
  - typescript
traits:
- id: supabase-google-oauth-flow
  desc: Supabase Google OAuth flow
  conf: 0.95
  if:
    type: text
    regex: signInWithOAuth[\s\S]{0,260}provider:\s*['\"]google['\"]
- id: password-grant-login-endpoint
  desc: Supabase password-grant login endpoint
  conf: 0.95
  if:
    type: text
    substr: auth/v1/token?grant_type=password
- id: supabase-auth-storage-bridge
  desc: Supabase auth storage bridge
  conf: 0.92
  if:
    type: text
    regex: supabaseAuthStorage[\s\S]{0,220}chrome\.storage\.local
