# Supabase OAuth and token-storage APIs are ordinary application capabilities.
# Browser-extension token theft requires the higher-level objective composite.
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: supabase-google-oauth-flow
    desc: Supabase Google OAuth flow
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'signInWithOAuth[\s\S]{0,260}provider:\s*[''\"]google[''\"]'

  # Named for the field it actually finds. The old id/desc claimed token
  # *storage*, which the matcher never checks — `provider_token` and
  # `provider_refresh_token` are the GoTrue session fields, present in every copy
  # of the SDK. Two extra alternates (`persistGoogleCalendarTokens`,
  # `getFreshGoogleAccessToken`) were function names lifted from one extension;
  # they convicted only that codebase, and the calendar composite already
  # requires the identity permission, the calendar OAuth scope and the Google
  # sign-in call, so nothing depended on them.
  - id: oauth-provider-token-field
    desc: OAuth provider token session field
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bprovider_(refresh_)?token\b'
    unless:
      - id: well-known/lib/cloud/supabase::auth-js-web3-module

  - id: supabase-auth-storage-bridge
    desc: Supabase auth storage bridge
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'supabaseAuthStorage[\s\S]{0,220}chrome\.storage\.local'
