# Browser authentication helpers commonly read a token that the user has
# just obtained through an interactive login.  These are capabilities, not
# credential-theft objectives; the objective tier requires a remote sink.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript]

traits:
  - id: wildcard-scope-literal
    desc: Triple-wildcard scope-like string literal
    crit: notable
    conf: 0.86
    if:
      type: literal
      kind: string
      exact: '*:*:*'

composite_rules:
  - id: wildcard-oauth-scope
    desc: OAuth token flow uses a triple-wildcard scope
    crit: notable
    conf: 0.88
    all:
      - id: wildcard-scope-literal
      - id: micro-behaviors/communications/http/oauth::access-token

  - id: browser-storage-oauth-token-access
    desc: Reads an OAuth token from browser storage
    crit: notable
    conf: 0.95
    all:
      - id: micro-behaviors/data/db/web-storage::window-localstorage-getitem
      - id: micro-behaviors/communications/http/oauth::access-token
    any:
      - id: micro-behaviors/process/create/script/automation::playwright-page-evaluate
      - id: wildcard-oauth-scope

  - id: browser-profile-jwt-token-access
    desc: Reads compact JWTs from a Chromium profile's Local Storage
    crit: notable
    conf: 0.94
    all:
      - id: micro-behaviors/data/string/search::jwt-compact-regex
      - id: micro-behaviors/fs/path/sensitive/browser::chromium-leveldb-local-storage
    any:
      - id: micro-behaviors/fs/read/file::python-pathlib-read-bytes
      - id: micro-behaviors/fs/enumerate/directory/

  - id: browser-token-access
    desc: Reads an OAuth or session token from browser state
    crit: notable
    conf: 0.95
    any:
      - id: browser-storage-oauth-token-access
      - id: browser-profile-jwt-token-access
