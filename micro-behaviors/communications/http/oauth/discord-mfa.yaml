defaults:
  platforms: [unix, windows]
composite_rules:
  - id: discord-vanity-mfa-session-automation
    desc: Discord vanity and MFA authorization endpoints
    crit: notable
    conf: 0.93
    for: [javascript, typescript, npm, tar, tgz]
    scope: archive
    all:
      - id: micro-behaviors/communications/http/services/discord::guild-vanity-url-api
      - id: micro-behaviors/communications/http/services/discord::mfa-finish-endpoint
    any:
      - id: micro-behaviors/communications/http/services/discord::discord-mfa-authorization-header
      - id: micro-behaviors/communications/http/authorization-header::authorization-header-map-entry
