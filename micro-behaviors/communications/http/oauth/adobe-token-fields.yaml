defaults:
  for: [pe]
  platforms: [windows]
  size_min: 500000
  size_max: 5000000
composite_rules:
- id: alternate-device-bearer-token-field
  desc: Alternate device or bearer token field
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/communications/http/oauth::new-device-token-field
  - id: micro-behaviors/communications/http/oauth::device-token-variant
  - id: micro-behaviors/communications/http/oauth::bearer-token-field
- id: access-device-token-field-set
  desc: Access and device OAuth token field set
  crit: notable
  conf: 0.85
  all:
  - id: micro-behaviors/communications/http/oauth::access-token-field
  - id: micro-behaviors/communications/http/oauth::device-token-field
  - id: micro-behaviors/communications/http/oauth::alternate-device-bearer-token-field
