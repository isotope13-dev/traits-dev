# Parameters can occur in either order, in a URL or a source-language map.
# Require field assignments, not the words redirect_uri and state in prose.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, html]
  crit: notable
  conf: 0.94

traits:
  - id: oauth-redirect-before-state-fields
    desc: OAuth redirect field precedes state field
    if:
      type: text
      regex: '\bredirect_uri["'']?\s*[:=][\s\S]{0,160}\bstate["'']?\s*[:=]'

  - id: oauth-state-before-redirect-fields
    desc: OAuth state field precedes redirect field
    if:
      type: text
      regex: '\bstate["'']?\s*[:=][\s\S]{0,160}\bredirect_uri["'']?\s*[:=]'

composite_rules:
  - id: oauth-redirect-state-pair
    desc: OAuth redirect and state parameter assignments
    any:
      - id: oauth-redirect-before-state-fields
      - id: oauth-state-before-redirect-fields
