---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: google-oauth-authorize-url
  desc: Google OAuth authorize URL
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: https?://accounts\.google\.com/o/oauth2(/v2)?/auth\b
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/lib/development/vscode-webview::acquire-vscode-api
- id: google-userinfo-profile-scope
  desc: Requests Google profile identity scope
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: googleapis.com/auth/userinfo.profile
- id: google-userinfo-email-scope
  desc: Requests Google email identity scope
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: googleapis.com/auth/userinfo.email
- id: google-gmail-compose-scope
  desc: Google Gmail compose OAuth scope
  crit: notable
  conf: 0.88
  if:
    type: text
    substr: googleapis.com/auth/gmail.compose
- id: google-oauth-device-code
  desc: Google OAuth device authorization endpoint
  crit: notable
  conf: 0.86
  if:
    type: text
    substr: oauth2.googleapis.com/device/code
- id: oauth-workers-redirect-uri
  desc: OAuth callback uses Workers endpoint
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: redirect_uri.{0,160}workers\.dev/oauth2callback
- id: oauth-callback-email-param-read
  desc: Reads email from OAuth callback URL
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: extractURLParameter\([^)]{0,80}['"]mail['"]
- id: oauth-keyword-reference
  desc: References an OAuth endpoint marker
  crit: notable
  conf: 0.5
  if:
    type: text
    regex: "(?i)\\boauth[/:._-](authorize|token|callback)\\b"
- id: oauth-redirect-uri-parameter
  desc: OAuth redirect URI parameter
  crit: notable
  conf: 0.86
  if:
    type: literal
    word: redirect_uri
  unless:
  - id: metadata/document/html::doctype
  - id: metadata/document/html::legacy-doctype
- id: oauth-protocol-reference
  desc: References the OAuth 2 protocol
  crit: notable
  conf: 0.5
  if:
    type: text
    regex: "(?i)\\boauth[[:space:]]*2([.]0)?\\b"
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
  - id: metadata/file/profile/identifier-population::js-exported-object-cluster
  - id: metadata/file/profile/threat-scanning::auditr-defensive-signature-catalog
  - id: metadata/build/scaffold::antlr-generated-parser
  - type: path
    regex: "(?i)\\.lang$"
- id: oauth-offline-access-scope
  desc: Requests the offline_access OAuth scope
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "(?i)scope.{0,80}offline_access"
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: oauth-offline-access-url
  desc: OAuth URL requests offline access
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "[?&]access_type=offline\\b|access_type%3Doffline\\b"
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: password-grant-type
  desc: OAuth password grant_type field
  crit: notable
  conf: 0.85
  for:
  - scripts
  - binaries
  - csharp
  - typescript
  - go
  if:
    type: text
    regex: grant_type["']?\s*[:=,]\s*["']password["']
- id: google-accounts
  desc: Google Accounts domain marker
  crit: notable
  conf: 0.6
  for:
  - scripts
  - binaries
  - html
  if:
    type: text
    substr: accounts.google.com
  unless:
  - id: metadata/build/minifier::js-minified-template-guard
- id: googleapis-oauth
  desc: Google OAuth path marker
  crit: notable
  conf: 0.6
  if:
    type: text
    substr: googleapis.com/oauth
- id: dropbox-oauth-authorize
  desc: Dropbox OAuth authorization endpoint
  crit: notable
  conf: 0.9
  if:
    type: text
    substr: www.dropbox.com/oauth2/authorize
- id: openid-email-profile-scope-string
  desc: Space-separated openid email profile scopes
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: "\\bopenid\\s+email\\s+profile\\b"
- id: openid-email-profile-scope-array
  desc: Array of openid email profile scope tokens
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '["'']openid["'']\s*,\s*["'']email["'']\s*,\s*["'']profile["'']'
- id: oauth-client-secret-field
  desc: OAuth client_secret field
  crit: notable
  conf: 0.65
  for:
  - scripts
  - binaries
  - csharp
  - go
  if:
    type: text
    regex: "\\b(client_secret|clientSecret)\\b"
- id: google-oauth-client-secret-value
  desc: Embedded Google OAuth client secret value
  crit: notable
  conf: 0.95
  if:
    type: text
    regex: "\\bGOCSPX-[A-Za-z0-9_-]{20,}"
- id: oauth-authorize-endpoint-field
  desc: OAuth authorize endpoint field
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: authorizeEndpoint
- id: oauth-token-endpoint-field
  desc: OAuth token endpoint field
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: tokenEndpoint
- id: oauth-authorization-server-metadata-path
  desc: OAuth authorization-server metadata path
  crit: notable
  conf: 0.9
  for:
  - scripts
  - source
  - json
  if:
    type: text
    regex: "/\\.well-known/oauth-authorization-server\\b"
- id: oauth-registration-endpoint-field
  desc: OAuth dynamic client registration endpoint field
  crit: notable
  conf: 0.9
  for:
  - python
  - javascript
  - typescript
  - go
  - java
  if:
    type: text
    word: registration_endpoint
- id: oauth-userinfo-endpoint-field
  desc: OAuth userinfo endpoint field
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: userinfoEndpoint
- id: oauth-revoke-endpoint-field
  desc: OAuth revoke endpoint field
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: revokeEndpoint
- id: oauth-authorization-code-grant
  desc: OAuth authorization-code grant field
  crit: notable
  conf: 0.8
  if:
    type: text
    substr: authorization_code
- id: oauth-pkce-code-verifier
  desc: OAuth PKCE code-verifier field
  crit: notable
  conf: 0.8
  for:
  - scripts
  - binaries
  - go
  if:
    type: text
    regex: "(?i)(^|[^A-Za-z])code[_-]?verifier([^A-Za-z]|$)"
- id: oauth-pkce-code-challenge
  desc: OAuth PKCE code-challenge field
  crit: notable
  conf: 0.8
  for:
  - scripts
  - binaries
  - go
  if:
    type: text
    regex: "(?i)(^|[^A-Za-z])code[_-]?challenge([^A-Za-z]|$)"
- id: oauth-device-authorization-path
  desc: OAuth device authorization endpoint path
  crit: notable
  conf: 0.9
  for:
  - html
  - scripts
  - binaries
  - go
  if:
    type: text
    regex: "(?i)/device[_-]authorization\\b"
- id: oauth-device-code-path
  desc: OAuth device code endpoint path
  crit: notable
  conf: 0.9
  for:
  - html
  - scripts
  - binaries
  - go
  if:
    type: text
    regex: "(?i)/device[_-]?code\\b"
- id: sap-commerce-authorization-token-path
  desc: SAP Commerce OAuth token path
  crit: notable
  conf: 0.96
  for:
  - scripts
  - binaries
  - go
  - java
  if:
    type: text
    regex: "(?i)/authorizationserver/oauth/token\\b"
- id: oauth-client-credentials-grant-type
  desc: OAuth client_credentials grant type
  crit: notable
  conf: 0.92
  for:
  - html
  - scripts
  - binaries
  - go
  - java
  if:
    type: text
    regex: (?i)grant[_-]?type["']?\s*(=>|[:,=])\s*["']?client[_-]?credentials\b
- id: oauth-device-grant-type
  desc: OAuth device_code grant type
  crit: notable
  conf: 0.9
  for:
  - html
  - scripts
  - binaries
  - go
  if:
    type: text
    regex: (?i)grant[_-]type["']?\s*[:=]\s*["']?(\S{0,35}:)?device[_-]?code\b
- id: oauth-refresh-grant-type
  desc: OAuth refresh_token grant type
  crit: notable
  conf: 0.9
  for:
  - html
  - scripts
  - typescript
  - binaries
  if:
    type: text
    regex: (?i)grant[_-]type["']?\s*[:=]\s*["']?refresh[_-]?token\b
- id: microsoft-graph-mail-scope
  desc: Microsoft Graph mail OAuth scope
  crit: notable
  conf: 0.9
  for:
  - scripts
  if:
    type: literal
    kind: string
    regex: "\\bMail\\.Read(Write)?\\b"
composite_rules:
- id: oauth-client-id-field
  desc: Client ID token accompanies OAuth protocol markers
  crit: notable
  conf: 0.85
  all:
  - id: metadata/lang/source/naming/setting::client-id-token
  any:
  - id: micro-behaviors/communications/http/oauth::oauth-protocol-reference
  - id: micro-behaviors/communications/http/oauth::oauth-keyword-reference
  - id: micro-behaviors/communications/http/oauth::oauth-redirect-uri-parameter
  - id: micro-behaviors/communications/http/oauth::oauth-client-credentials-grant-type
  near_bytes: 1000
- id: google-oauth-permission-scope-pack
  desc: Multiple Google OAuth permission scopes
  crit: notable
  conf: 0.95
  platforms:
  - windows
  for:
  - pe
  all:
  - id: micro-behaviors/communications/http/oauth::google-accounts
  any:
  - id: micro-behaviors/communications/http/services/drive-google::google-drive-auth-scope
  - id: micro-behaviors/communications/http/oauth::google-gmail-compose-scope
  - id: micro-behaviors/communications/http/services/google::contacts-readonly-scope
  - id: micro-behaviors/communications/http/oauth::google-userinfo-profile-scope
  needs: 2
- id: oauth-callback-handler-name
  desc: Callback handler name with OAuth protocol markers
  crit: notable
  conf: 0.8
  any:
  - id: metadata/lang/source/naming/action/function-name::handle-callback-name-text
  - id: metadata/lang/source/naming/action/function-name::authorization-url-name-text
  all:
  - id: micro-behaviors/communications/http/oauth::oauth
  near_bytes: 1000
- id: generated-api-model-field-context
  desc: Generated API model field context
  crit: component
  conf: 0.95
  any:
  - id: metadata/lang/generated::generated-do-not-edit-text
  - id: metadata/lang/generated::python-datamodel-codegen-generated
- id: oauth
  desc: OAuth protocol or endpoint markers
  crit: notable
  conf: 0.66
  any:
  - id: micro-behaviors/communications/http/oauth::oauth-keyword-reference
  - id: micro-behaviors/communications/http/oauth::oauth-protocol-reference
- id: oauth-google
  desc: Google OAuth
  crit: component
  conf: 0.66
  any:
  - id: micro-behaviors/communications/http/oauth::google-accounts
  - id: micro-behaviors/communications/http/oauth::googleapis-oauth
- id: openid-email-profile-scopes
  desc: OpenID email and profile scope token sequence
  crit: notable
  conf: 0.9
  any:
  - id: micro-behaviors/communications/http/oauth::openid-email-profile-scope-string
  - id: micro-behaviors/communications/http/oauth::openid-email-profile-scope-array
- id: multi-provider-oauth-endpoints
  desc: Multiple cloud OAuth provider endpoints
  crit: notable
  conf: 0.88
  any:
  - id: micro-behaviors/communications/http/oauth::google-accounts
  - id: micro-behaviors/communications/http/oauth::dropbox-oauth-authorize
  - id: micro-behaviors/communications/http/services/microsoft::identity-or-graph-domain
  needs: 2
- id: oauth-client-credentials
  desc: OAuth client credential fields
  crit: notable
  conf: 0.86
  all:
  - id: micro-behaviors/communications/http/oauth::oauth-client-id-field
  - id: micro-behaviors/communications/http/oauth::oauth-client-secret-field
- id: oauth-client-sdk-context
  desc: OAuth client SDK token lifecycle context
  crit: component
  conf: 0.95
  needs: 5
  any:
  - id: micro-behaviors/communications/http/oauth::oauth-client-id-field
  - id: micro-behaviors/communications/http/token-auth::access-token
  - id: micro-behaviors/communications/http/token-auth::refresh-token
  - id: micro-behaviors/communications/http/oauth::oauth-authorize-endpoint-field
  - id: micro-behaviors/communications/http/oauth::oauth-token-endpoint-field
  - id: micro-behaviors/communications/http/oauth::oauth-userinfo-endpoint-field
  - id: micro-behaviors/communications/http/oauth::oauth-revoke-endpoint-field
  - id: micro-behaviors/communications/http/oauth::oauth-authorization-code-grant
  - id: micro-behaviors/communications/http/oauth::oauth-pkce-code-verifier
  - id: micro-behaviors/communications/http/oauth::oauth-pkce-code-challenge
  - id: micro-behaviors/communications/http/oauth::oauth-callback-handler-name
- id: oauth-pkce-code-pair-context
  desc: OAuth PKCE verifier and challenge implementation
  crit: exception
  conf: 0.9
  for:
  - ruby
  - python
  all:
  - id: micro-behaviors/communications/http/oauth::oauth-pkce-code-verifier
  - id: micro-behaviors/communications/http/oauth::oauth-pkce-code-challenge
  unless:
  - id: micro-behaviors/os/env/read::getenv-user
  - id: micro-behaviors/os/env/user-info::ruby-user-identity-env-reference
  - id: micro-behaviors/os/env/user-info::python-user-identity-env-reference
  - id: micro-behaviors/communications/url/host/http::ruby-numeric-host-url-reference
- id: oauth-pkce-flow-context
  desc: OAuth PKCE authorization exchange flow context
  crit: exception
  conf: 0.95
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/communications/http/oauth::oauth-pkce-code-verifier
  - id: micro-behaviors/communications/http/oauth::oauth-pkce-code-challenge
  - id: micro-behaviors/communications/http/request/json::http-post-json
  unless:
  - id: micro-behaviors/os/env/enumerate::js-process-env-spread
  - id: micro-behaviors/os/env/read::js-filtered-env-copy
  - id: micro-behaviors/os/env/cloud/
  - id: micro-behaviors/os/env/ci-credentials/
  - id: micro-behaviors/os/env/ssh/
- id: oauth-refresh-token-flow-context
  desc: OAuth refresh token exchange flow context
  crit: exception
  conf: 0.95
  for:
  - javascript
  - typescript
  all:
  - id: micro-behaviors/communications/http/oauth::oauth-refresh-grant-type
  any:
  - id: micro-behaviors/communications/http/oauth::oauth-client-id-field
  - id: micro-behaviors/communications/http/oauth::oauth-client-secret-field
  - id: micro-behaviors/communications/http/token-auth::refresh-token
  - id: micro-behaviors/communications/http/token-auth::refresh-token-snake-assign
  unless:
  - id: micro-behaviors/os/env/enumerate::js-process-env-spread
  - id: micro-behaviors/os/env/read::js-filtered-env-copy
  - id: micro-behaviors/os/env/cloud/
  - id: micro-behaviors/os/env/ci-credentials/
  - id: micro-behaviors/os/env/ssh/
