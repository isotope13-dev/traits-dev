defaults:
  platforms: [windows, unix]
  for: [html, javascript]
  crit: notable
  conf: 0.96
traits:
  - id: installer-affiliate-query
    desc: HTTP query carries an affiliate identifier
    if:
      type: text
      regex: '[?&]affiliate_id=[0-9]+(&|["''\s])'
  - id: installer-hardware-query
    desc: HTTP query carries a hardware identifier
    if:
      type: text
      regex: '[?&]hardware_id=[0-9]+(&|["''\s])'
  - id: installer-instance-query
    desc: HTTP query carries an installer identifier
    if:
      type: text
      regex: '[?&]installer_id=[0-9]+(&|["''\s])'
