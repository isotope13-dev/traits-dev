defaults:
  platforms: [windows]
  for: [csharp, asp, html]
  crit: notable
traits:
  - id: asp-request-querystring-read
    desc: ASP reads the Request.QueryString collection
    conf: 0.96
    if:
      type: text
      regex: \b(Request|HttpContext\s*\.\s*Current\s*\.\s*Request)\s*\.\s*QueryString\b
