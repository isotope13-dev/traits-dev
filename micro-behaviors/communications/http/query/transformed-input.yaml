# Bind a helper's input parameter to the value transformed inside fetch's URL.
# The helper need not be an encoder; this only claims transformed input transfer.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: fetch-query-transformed-function-input
    desc: HTTP query carries transformed function input
    crit: notable
    conf: 0.95
    if:
      type: tree-sitter
      query: |
        ((function_declaration
          parameters: (formal_parameters (identifier) @input)
          body: (statement_block
            (lexical_declaration (variable_declarator value: (await_expression
              (call_expression function: (identifier) @fetch
                arguments: (arguments [
                  (binary_expression left: (string) @base right: (call_expression arguments: (arguments (identifier) @sent)))
                  (binary_expression left: (binary_expression left: (string) @base right: (call_expression arguments: (arguments (identifier) @sent))))
                  (binary_expression left: (binary_expression left: (binary_expression left: (string) @base right: (call_expression arguments: (arguments (identifier) @sent)))))
                ])))))))
          (#eq? @fetch "fetch")
          (#eq? @input @sent)
          (#match? @base "https?://[^ ]+[?&]"))
