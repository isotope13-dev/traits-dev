defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: new-url-endpoint
    desc: Builds URL from endpoint
    crit: notable
    conf: 0.84
    if:
      type: text
      substr: new URL(endpoint)
  - id: elex-query-format-string
    desc: Elex C2 query string format
    crit: baseline
    conf: 0.9
    for: [pe]
    if:
      type: text
      exact: 'v=%s&nuuid=%s'
  - id: urlsearchparams-timestamp-field
    desc: Adds a timestamp URL query parameter
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'searchParams\.set\(\s*[''\"]timestamp[''\"]'
  - id: urlsearchparams-instance-name-field
    desc: Adds an instanceName URL query parameter
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'searchParams\.set\(\s*[''\"]instanceName[''\"]'
  - id: urlsearchparams-ip-field
    desc: Adds an IP URL query parameter
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'searchParams\.set\(\s*[''\"]ip[''\"]'
  - id: urlsearchparams-engine-field
    desc: Adds an engine URL query parameter
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'searchParams\.set\(\s*[''\"]engine[''\"]'

composite_rules:
  - id: url-derived-http-get
    desc: URL object drives an HTTP GET request
    crit: notable
    conf: 0.96
    all:
      - id: new-url-endpoint
      - id: micro-behaviors/communications/url/construction/fragment::url-hostname-option
      - id: micro-behaviors/communications/url/construction/fragment::url-path-search-option
      - id: micro-behaviors/communications/http/get::get
