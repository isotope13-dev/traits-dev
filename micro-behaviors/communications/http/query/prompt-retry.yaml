defaults:
  platforms: [windows, unix]
  for: [html, javascript]
traits:
  - id: recurring-prompt-retry-parameters
    desc: URL requests recurring prompts and retries
    crit: notable
    conf: 0.98
    if:
      type: text
      exclude_html_comments: true
      regex: '[?&]recurrence=always&retry=[2-9][0-9]*(&|["''])'
