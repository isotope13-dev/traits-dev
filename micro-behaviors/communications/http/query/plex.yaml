# Source/request material uses a complete field name. Binary metadata can
# additionally name accessors with a prefix or suffix around the same name.
defaults:
  for: [scripts, source, binaries, data, text]
  platforms: [unix, windows]
  crit: notable
  conf: 0.99
traits:
  - id: plex-transcoder-h264-options
    for: [scripts, source, data, text]
    desc: Plex H264 transcoder preference key
    if:
      type: text
      word: TranscoderH264Options
  - id: plex-transcoder-h264-options-binary
    desc: Plex H264 option-name text in binary
    for: [binaries]
    if:
      type: text
      substr: TranscoderH264Options
