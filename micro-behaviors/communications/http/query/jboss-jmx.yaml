defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
  conf: 0.98
traits:
- id: jmx-invoke-operation-query
  desc: References JMX invoke-operation URL query
  if:
    type: text
    substr: /jmx-console/HtmlAdaptor?action=invokeOp

- id: jmx-main-deployer-query
  desc: References JBoss MainDeployer deployment query
  if:
    type: text
    substr: name=jboss.system:service=MainDeployer&methodIndex=19&arg0=
