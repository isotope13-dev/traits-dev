defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: node-env-credential-numeric-host-query
    desc: Env credential enters numeric-host HTTPS query
    # Bind immutable top-level declarations to the transmitted query value.
    # Local flow currently projects these process.env reads as unknown.
    if:
      type: tree-sitter
      query: |
        (
          (program
            (lexical_declaration
              "const"
              (variable_declarator
                name: (identifier) @client
                value: (call_expression
                  function: (identifier) @require
                  arguments: (arguments
                    . (string (string_fragment) @module) .))))
            (lexical_declaration
              "const"
              (variable_declarator
                name: (identifier) @secret
                value: [
                  (member_expression) @source
                  (binary_expression
                    left: (member_expression) @source
                    operator: "||")
                  (binary_expression
                    left: (binary_expression
                      left: (member_expression) @source
                      operator: "||")
                    operator: "||")
                ]))
            (expression_statement
              (call_expression
                function: (member_expression
                  object: (identifier) @receiver
                  property: (property_identifier) @method)
                arguments: (arguments
                  . (binary_expression
                    left: (string (string_fragment) @url)
                    operator: "+"
                    right: (call_expression
                      function: (identifier) @encoder
                      arguments: (arguments . (identifier) @sent .)))))) @send)
          (#eq? @require "require")
          (#eq? @module "https")
          (#eq? @client @receiver)
          (#eq? @method "get")
          (#eq? @encoder "encodeURIComponent")
          (#eq? @secret @sent)
          (#match? @source "^process\\.env\\.[A-Z_]*(KEY|TOKEN|SECRET|PASSWORD)[A-Z_]*$")
          (#match? @url "^https://[0-9.]+(:[0-9]+)?/[^ ]*[?&][A-Za-z][A-Za-z0-9_.-]*=$")
        )
