defaults:
  platforms: [windows, unix]
  for: [html, scripts, source]
  crit: notable
  conf: 0.96

traits:
  # Wire grammar from the article's repeated session_public.php requests.
  # Neither the PHP filename nor the parameter order identifies the behavior.
  - id: session-poll-query-identifier
    desc: Poll action URL carries session identifier
    if:
      type: text
      regex: '(?i)[?&]action=poll(&[^&\s"''<>]{1,64}){0,4}&session[_-]?id='

  - id: session-query-identifier-poll
    desc: Session identifier URL carries poll action
    if:
      type: text
      regex: '(?i)[?&]session[_-]?id=[^&\s"'']{1,128}(&[^&\s"'']{1,64}){0,4}&action=poll\b'

composite_rules:
  - id: session-poll-query
    desc: Session polling URL with identifier
    any:
      - id: session-poll-query-identifier
      - id: session-query-identifier-poll
