defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98
traits:
  - id: encoded-array-chunk-query-request
    desc: Array chunk encoded into HTTP query URL
    if:
      type: tree-sitter
      query: |
        ((call_expression
          function: (member_expression property: (property_identifier) @foreach)
          arguments: (arguments
            (arrow_function
              parameters: (formal_parameters (identifier) @chunk)
              body: (statement_block
                (lexical_declaration
                  (variable_declarator
                    name: (identifier) @url
                    value: (binary_expression
                      right: (call_expression
                        function: (member_expression
                          object: (call_expression
                            function: (member_expression property: (property_identifier) @map)
                            arguments: (arguments
                              (arrow_function
                                body: (binary_expression
                                  right: (call_expression
                                    function: (identifier) @encode
                                    arguments: (arguments
                                      (ternary_expression
                                        alternative: (ternary_expression
                                          alternative: (ternary_expression
                                            alternative: (identifier) @encoded_chunk)))))))))
                          property: (property_identifier) @join)))))
                . (expression_statement
                  [
                    (call_expression
                      function: (member_expression) @fetch
                      arguments: (arguments (identifier) @sent_url))
                    (call_expression
                      function: (identifier) @fetch
                      arguments: (arguments (identifier) @sent_url))
                    (call_expression
                      function: (member_expression
                        object: (call_expression
                          function: (identifier) @fetch
                          arguments: (arguments (identifier) @sent_url))))
                  ]))) @sender)) @upload
          (#eq? @foreach "forEach")
          (#eq? @map "map")
          (#eq? @join "join")
          (#eq? @encode "encodeURIComponent")
          (#match? @fetch "^(fetch|navigator\\.sendBeacon)$")
          (#eq? @chunk @encoded_chunk)
          (#eq? @url @sent_url))
