defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: module-iife-shell-output-fetch-query
    desc: Module IIFE sends shell output via fetch
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (program
          (expression_statement
            (call_expression
              function: (parenthesized_expression
                (function_expression
                  body: (statement_block
                    (variable_declaration
                      (variable_declarator
                        name: (identifier) @sender
                        value: (function_expression
                          parameters: (formal_parameters (identifier) @param)
                          body: (statement_block
                            (try_statement
                              body: (statement_block
                                (expression_statement
                                  (call_expression
                                    function: (member_expression
                                      object: (call_expression
                                        function: (identifier) @fetch
                                        arguments: (arguments
                                          (binary_expression
                                            left: (binary_expression
                                              right: (string (string_fragment) @query))
                                            right: (identifier) @sent))))))))))))
                    (if_statement
                      consequence: (statement_block
                        (try_statement
                          body: (statement_block
                            (variable_declaration
                              (variable_declarator
                                name: (identifier) @output
                                value: (call_expression
                                  function: (member_expression
                                    object: (call_expression
                                      function: (member_expression
                                        property: (property_identifier) @exec)
                                      arguments: (arguments
                                        (string (string_fragment) @command)))
                                    property: (property_identifier) @trim))))
                            (expression_statement
                              (call_expression
                                function: (identifier) @dispatch
                                arguments: (arguments
                                  (binary_expression
                                    right: (call_expression
                                      function: (identifier) @encode
                                      arguments: (arguments (identifier) @encoded)))))))))))))))
          (#eq? @sender @dispatch)
          (#eq? @param @sent)
          (#eq? @output @encoded)
          (#eq? @fetch "fetch")
          (#eq? @query "?")
          (#eq? @exec "execSync")
          (#eq? @trim "trim")
          (#eq? @encode "encodeURIComponent")
          (#match? @command "^(whoami|id|hostname|pwd)$"))
