defaults:
  platforms: [unix, windows]
  for: [csharp, pe]
traits:
  # The parameter name occurs in ordinary authentication traffic too; it does
  # not establish a beacon, exfiltration, or the implementation language.
  - id: credentials-query-parameter
    desc: Credentials HTTP query parameter
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: "&creds="
