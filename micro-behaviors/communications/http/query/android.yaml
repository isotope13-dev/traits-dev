defaults:
  conf: 0.96
  platforms: [android]
  for: [java, kotlin]
  attack: T1041

traits:
  - id: session-token-query-concatenation
    desc: Session token query concatenation
    crit: notable
    if:
      type: text
      regex: '(?i)["''][?&][^"'']{0,80}(session|access)[_-]?token=[^\r\n)]{0,160}\+'

composite_rules:
  - id: jvm-session-token-query-construction
    desc: JVM URL concatenates a session token query
    crit: suspicious
    near_lines: 1
    near_bytes: 256
    all:
      - id: micro-behaviors/communications/http/request/url-computed::jvm-dynamic-url-construction
      - id: session-token-query-concatenation
