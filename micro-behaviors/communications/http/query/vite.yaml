defaults:
  platforms: [linux, macos, windows]
  for: [scripts, source]
  conf: 0.94

traits:
  - id: vite-fs-raw-bypass-query
    desc: Vite filesystem URL uses raw bypass
    crit: suspicious
    if:
      type: literal
      kind: string
      regex: '(?i)/@fs/[^?\s"'']{0,300}\?(raw(\?\?)?|raw\?import)$'

  - id: vite-fs-import-bypass-query
    desc: Vite filesystem URL uses import bypass
    crit: suspicious
    if:
      type: literal
      kind: string
      regex: '(?i)/@fs/[^?\s"'']{0,300}\?(import&(raw(\?\?)?|url&inline)|inline&import)$'

composite_rules:
  - id: vite-fs-bypass-query-catalog
    desc: Contains multiple Vite filesystem bypass queries
    crit: suspicious
    all:
      - id: micro-behaviors/communications/url/http-path::vite-fs-route-reference
    needs: 2
    any:
      - id: vite-fs-raw-bypass-query
      - id: vite-fs-import-bypass-query
