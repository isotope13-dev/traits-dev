defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
traits:
  - id: browser-url-query-enumeration
    desc: Enumerates a constructed URLSearchParams object
    crit: notable
    conf: 0.94
    # Bind the constructor and iteration to the same receiver. Mere proximity
    # of URLSearchParams and an unrelated forEach does not establish iteration.
    if:
      type: tree-sitter
      query: |
        [
          ((call_expression
            function: (member_expression
              object: (new_expression constructor: (identifier) @ctor)
              property: (property_identifier) @method)) @iteration
            (#eq? @ctor "URLSearchParams")
            (#eq? @method "forEach"))
          ((_ (lexical_declaration
                (variable_declarator
                  name: (identifier) @binding
                  value: (new_expression constructor: (identifier) @ctor)))
              .
              (expression_statement
                (call_expression
                  function: (member_expression
                    object: (identifier) @receiver
                    property: (property_identifier) @method)) @iteration))
            (#eq? @ctor "URLSearchParams")
            (#eq? @method "forEach")
            (#eq? @binding @receiver))
        ]
