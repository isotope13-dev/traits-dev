# A value cut into fixed-width slices, each URL-encoded into the query string
# of an opaque `no-cors` GET. The sender never reads a response; the data
# rides in the URL so it needs no request body and no CORS preflight. Tolerates
# bracket-notation member calls and junk statements that defeat the
# structural `encoded-array-chunk-query-request` query. Neutral capability:
# what is chunked and why lives in objective composites.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
composite_rules:
  - id: chunked-no-cors-query-send
    desc: Sends data chunks in no-cors fetch URLs
    near_bytes: 4096
    all:
      - id: micro-behaviors/data/buffer/chunk::js-slice-chunk-push
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
      - id: micro-behaviors/communications/http/request/privacy::fetch-no-cors-mode
