defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - javascript
  - package.json
  - npm

composite_rules:
  - id: node-shell-uri-http-context
    desc: Shell execution and URI encoding near HTTP client
    conf: 0.99
    for: [javascript, typescript]
    scope: file
    near_bytes: 1024
    all:
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
    any:
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/client::node-http
    needs: 1


  - id: module-http-shell-uri-context
    desc: Module HTTP activity near shell and URI encoding
    conf: 0.995
    for: [javascript, typescript]
    scope: file
    near_bytes: 4096
    all:
      - id: micro-behaviors/communications/http/request/client::module-execution-http-call
      - id: micro-behaviors/process/create/shell/bridge::execSync-call
      - id: micro-behaviors/data/encode/url::encode-uri-component-call
      - id: micro-behaviors/communications/http/url/php-endpoint::url-php-endpoint-script

