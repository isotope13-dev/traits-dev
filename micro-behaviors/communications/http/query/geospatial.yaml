# OGC web-service query fields and functions are neutral protocol mechanics.
# Exploit rules combine them with injection syntax under objectives/.
defaults:
  crit: notable
  platforms: [unix, windows]
  for: [scripts, python, javascript, typescript, java, go, rust, php, ruby, shell, c, cpp, csharp]

traits:
  - id: ogc-jsonarraycontains-filter
    desc: Builds an OGC jsonArrayContains filter
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bjsonArrayContains\s*\('

  - id: wfs-getfeature-operation
    desc: Requests the WFS GetFeature operation
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?i)\bGetFeature\b'

  - id: cql-filter-parameter
    desc: Uses the CQL_FILTER HTTP request parameter
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?i)\bCQL_FILTER\b'
