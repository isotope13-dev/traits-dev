# OData request query fields and response pagination properties. These are
# protocol mechanics shared by Microsoft Graph, Dataverse, and other OData
# services; provider-specific intent belongs in composites that reference them.
defaults:
  platforms: [windows, unix]
  for: [scripts, source, html, json]
  crit: notable
  conf: 0.72

traits:
  - id: odata-next-page-link
    desc: Reads an OData next-page link
    conf: 0.98
    if:
      type: literal
      kind: string
      exact: '@odata.nextLink'

  - id: odata-filter-or-select-query
    desc: OData filter or select query field
    if:
      type: text
      regex: '[?&]\$(filter|select)='

  - id: odata-top-or-orderby-query
    desc: OData top or orderby query field
    if:
      type: text
      regex: '[?&]\$(top|orderby)='

  - id: odata-expand-query
    desc: OData expand query field
    if:
      type: text
      regex: '[?&]\$expand='

composite_rules:
  - id: odata-query-marker
    desc: Uses OData query parameters
    any:
      - id: odata-filter-or-select-query
      - id: odata-top-or-orderby-query
      - id: odata-expand-query
