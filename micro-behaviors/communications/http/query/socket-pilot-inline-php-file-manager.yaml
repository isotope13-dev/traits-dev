# Canonical placement from the socket-shell cohort audit.
defaults:
  for:
  - php
  - html
  - text
  - data
  platforms:
  - unix
  - windows
  crit: notable
  conf: 0.92
traits:
- id: php-get-path-router-p
  desc: Tests whether GET parameter p exists
  if:
    type: text
    substr: if (isset($_GET['p']))
- id: php-get-path-router-q
  desc: Tests whether GET parameter q exists
  if:
    type: text
    substr: elseif (isset($_GET['q']))
