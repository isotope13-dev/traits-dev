defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
traits:
  - id: command-output-query-encoding
    desc: URI-encodes command-labelled query output
    conf: 0.98
    if:
      type: tree-sitter
      kind: call
      regex: 'cmd=[^"\r\n]{1,40}&out=["'']\s*\+\s*encodeURIComponent\('
