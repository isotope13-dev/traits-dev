defaults:
  for: [scripts, source, data, text]
  platforms: [unix, windows]
  crit: notable
  conf: 0.98
traits:
  - id: protocol-field-full-http-url
    desc: Protocol field assigned a full HTTP URL
    if:
      type: text
      # Ruby/PHP hash arrows and HTTP(S) are equivalent field spellings.
      regex: 'protocol["'']?\s*[:=]>?\s*\(?["'']?https?(:|%3a)(/|%2f){2}'
      case_insensitive: true
