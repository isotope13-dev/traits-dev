# Quote-context escape and a file-backed observation channel, independent of
# product routes, parameter names, service identity, and chosen log basename.
defaults:
  platforms: [unix, windows]
  for: [scripts]
traits:
  - id: query-quote-breakout-echo
    desc: Query value closes shell quote before echo
    crit: notable
    conf: 0.99
    if:
      type: literal
      regex: '(?i)[?&][A-Za-z_][A-Za-z0-9_]{0,31}=[^&#\r\n]{0,48}(%27|\x27)(%3b|;)echo(%20|\+| )'

  - id: query-substitution-log-append
    desc: Query substitution appends output to log
    crit: notable
    conf: 0.99
    if:
      type: literal
      regex: '(?i)[?&]\w+=[^&#]{0,160}%24%28\w+%29[^&#]{0,160}%3e%3e%20/[^&#]{1,120}\.log'
composite_rules:
  - id: http-quote-breakout-log-probe
    desc: HTTP client sends quote breakout with log output
    crit: suspicious
    conf: 0.99
    all:
      - id: query-quote-breakout-echo
      - id: query-substitution-log-append
    any:
      - id: micro-behaviors/communications/http/request/client::http-client
      - id: micro-behaviors/communications/http/get::http-get
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-call-symbol
      - id: micro-behaviors/communications/http/post::fetch-post-call
    near_bytes: 2048
