# These are proximity observations, not proof of enumeration or data flow.
# p4code's Hacker News reader builds a discussion link and fetches published
# story IDs in a nearby loop. A changed object-ID URL is still useful evidence;
# only a consumer requiring an abuse mechanism can infer an attack from it.
defaults:
  platforms: [windows, unix]
  for: [scripts, '!jcl']
  crit: notable
  conf: 0.95

composite_rules:
  - id: object-id-query-loop-context
    desc: Interpolated ID query near HTTP client and loop
    all:
      - id: micro-behaviors/communications/http/url/query::dynamic-object-id-query
      - id: micro-behaviors/data/control-flow/loop
      - id: micro-behaviors/communications/http/request/client::http-client
    near_bytes: 1024
    unless:
      - id: well-known/tool/development/lint/rumdl::benchmark-rule-generator
      - id: well-known/tool/development/lint/rumdl::benchmark-rule-binary-path
      - id: metadata/package/testing/presence/path::benchdata-directory-path
      - id: well-known/lib/platform/browser-automation/automation-context::puppeteer-library-present
      - id: micro-behaviors/communications/http/url/path::loopback-client-url-cooccurrence

  - id: concatenated-object-id-query-loop-context
    desc: Concatenated ID query near HTTP client and loop
    all:
      - id: micro-behaviors/communications/http/url/query::dynamic-object-id-query-concat
      - id: micro-behaviors/data/control-flow/loop
      - id: micro-behaviors/communications/http/request/client::http-client
    near_bytes: 1024
    unless:
      - id: well-known/app/publishing/wordpress-plugins/catalog::known-wordpress-plugin
      - id: well-known/app/publishing/wordpress-plugins/builder::wordpress-plugin-path-ui
      - id: micro-behaviors/communications/http/url/query::gtag-js-measurement-id-query
      - id: well-known/lib/ai/langchain::langchain-community-package-path
      - id: well-known/lib/ai/langchain::legacy-langchain-package-path
