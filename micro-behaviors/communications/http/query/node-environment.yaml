defaults:
  for:
  - javascript
  - typescript
  platforms:
  - unix
  - windows
traits:
- id: node-environment-query-fetch
  desc: Environment-derived query passed to fetch
  crit: notable
  conf: 0.98
  if:
    type: tree-sitter
    query: |-
      ((lexical_declaration
        (variable_declarator name: (identifier) @query value: (new_expression
          constructor: (identifier) @params arguments: (arguments . (object
            (pair value: (call_expression function: [
              (member_expression object: (identifier) @json)
              (subscript_expression object: (identifier) @json)]
              arguments: (arguments . (member_expression object: (identifier) @process
                property: (property_identifier) @env) .)))) .)))
        (variable_declarator value: (await_expression
          (call_expression function: (identifier) @fetch
            arguments: (arguments . (binary_expression right: (identifier) @sent) .))))) @operation
        (#eq? @params "URLSearchParams") (#eq? @json "JSON")
        (#eq? @process "process") (#eq? @env "env") (#eq? @fetch "fetch")
        (#eq? @query @sent))
