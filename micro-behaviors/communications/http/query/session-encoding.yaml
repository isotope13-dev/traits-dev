# Neutral observations reviewed against great-cto release drift.
defaults:
  platforms:
  - windows
  - unix
  for:
  - html
  - javascript
  crit: notable
  size_max: 524288
traits:
- id: cookie-session-query-key-reference
  desc: Cookie or session URL query-key reference
  conf: 0.86
  if:
    type: text
    regex: \?[A-Za-z0-9_-]*(cookie|session|sid)[A-Za-z0-9_-]*=
composite_rules:
- id: cookie-session-query-encoding-cooccurrence
  desc: Cookie/session query key near URI encoding
  conf: 0.88
  all:
  - id: micro-behaviors/communications/http/query::cookie-session-query-key-reference
  - id: micro-behaviors/data/encode/url::session-value-uri-encoded
  any:
  - id: micro-behaviors/data/encode/url::cookie-session-argument
  - id: micro-behaviors/data/encode/url::session-identifier-encode-argument
  near_bytes: 240
