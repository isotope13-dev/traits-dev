defaults:
  for: [pe]
  platforms: [windows]
traits:
  - id: native-query-mode-data-field-fragments
    desc: Mode/data query parameter fragments
    crit: notable
    conf: 0.97
    if:
      type: yara
      source: |
        rule native_query_mode_data_field_fragments {
          strings:
            $mode = /\?[A-Za-z]{1,8}=/
            $data = /&[A-Za-z]{1,8}=/
            $ok = "200 OK"
          condition:
            all of them
        }
