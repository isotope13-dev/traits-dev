composite_rules:
- id: url-discovery-command-literal
  for:
  - python
  - javascript
  - typescript
  - go
  desc: Raw URL query contains a complete discovery command
  conf: 0.96
  any:
  - id: micro-behaviors/communications/http/query::url-discovery-short-literal
  - id: micro-behaviors/communications/http/query::url-discovery-host-literal
- id: url-shell-command-token
  for:
  - python
  - javascript
  desc: URL query contains an OS command token
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/message::http-url-literal
  any:
  - id: micro-behaviors/communications/http/query::url-unix-shell-token
  - id: micro-behaviors/communications/http/query::url-unix-shell-token-literal
  - id: micro-behaviors/communications/http/query::url-windows-shell-token
  - id: micro-behaviors/communications/http/query::url-windows-shell-token-literal
  - id: micro-behaviors/communications/http/query::url-discovery-command-token
  - id: micro-behaviors/communications/http/query::url-discovery-command-literal
  - id: micro-behaviors/communications/http/query::url-network-command-token
  - id: micro-behaviors/communications/http/query::url-network-command-literal
  - id: micro-behaviors/communications/http/query::url-substitution-downloader-command
  - id: micro-behaviors/communications/http/query::url-pipe-control
  - id: micro-behaviors/communications/http/query::url-semicolon-control
  - id: micro-behaviors/communications/http/query::url-semicolon-control-literal
  - id: micro-behaviors/communications/http/query::url-semicolon-network-command
  - id: micro-behaviors/communications/http/query::url-semicolon-network-command-literal
  - id: micro-behaviors/communications/http/query::url-semicolon-shell-command
  - id: micro-behaviors/communications/http/query::url-semicolon-shell-command-literal
  - id: micro-behaviors/communications/http/query::url-semicolon-destructive-command
  - id: micro-behaviors/communications/http/query::url-semicolon-destructive-command-literal
  near_bytes: 1024
  unless:
  - id: well-known/tool/media/yt-dlp/
  - id: well-known/lib/ai/ray/
  - id: metadata/package/testing/harness/unit::node-test-runner-import
  - id: metadata/build/generated::go-bindata-generated-file
  downgrade:
    any:
    - id: metadata/package/testing/presence/harness::python-test-file
- id: url-discovery-command-token
  for:
  - python
  - javascript
  - typescript
  - go
  desc: URL query contains a complete discovery command
  conf: 0.96
  any:
  - id: micro-behaviors/communications/http/query::url-discovery-short-token
  - id: micro-behaviors/communications/http/query::url-discovery-host-token
- id: url-pipe-control
  for:
  - python
  - javascript
  - typescript
  - go
  desc: URL query pipes into a shell command
  conf: 0.96
  any:
  - id: micro-behaviors/communications/http/query::url-pipe-discovery-network-raw
  - id: micro-behaviors/communications/http/query::url-pipe-interpreter-raw
  - id: micro-behaviors/communications/http/query::url-pipe-command-encoded
traits:
- id: url-discovery-host-literal
  for:
  - python
  - javascript
  - typescript
  - go
  desc: Raw command has host discovery
  conf: 0.96
  if:
    type: text
    regex: (?i)[?&](cmd|command|exec(ute)?)=(whoami|ipconfig)([&#]|$)
- id: url-discovery-short-literal
  for:
  - python
  - javascript
  - typescript
  - go
  desc: Raw command has id or uname
  conf: 0.96
  if:
    type: text
    regex: (?i)[?&](cmd|command|exec(ute)?)=(id|uname)([&#]|$)
- id: url-unix-shell-token
  for:
  - python
  - javascript
  - typescript
  - go
  desc: URL query value contains Unix shell token
  conf: 0.97
  if:
    type: encoded
    encoding: url
    regex: (?i)[?&]\w{1,24}=[^&#\r\n"'<>]{0,48}/bin/(ba)?sh\b
- id: url-unix-shell-token-literal
  for:
  - python
  - javascript
  - typescript
  - go
  desc: Raw URL query contains Unix shell token
  conf: 0.97
  if:
    type: literal
    kind: string
    regex: (?i)^https?://\S{1,120}[?&]\w{1,24}=[^\s#]{0,96}/bin/(ba)?sh\b
- id: url-windows-shell-token
  for:
  - python
  - javascript
  - typescript
  - go
  desc: URL query value contains Windows shell token
  conf: 0.97
  if:
    type: encoded
    encoding: url
    regex: (?i)[?&]\w{1,24}=[^&#\r\n"'<>]{0,48}(cmd|powershell)(\.exe)?\s*/[cCeE]\b
- id: url-windows-shell-token-literal
  for:
  - python
  - javascript
  - typescript
  - go
  desc: Raw URL query contains Windows shell token
  conf: 0.97
  if:
    type: literal
    kind: string
    regex: (?i)[?&][^=&]{1,24}=[^#]{0,96}(cmd|powershell)(\.exe)?\s*/[cCeE]\b
- id: url-network-command-token
  for:
  - python
  - javascript
  - typescript
  - go
  desc: URL query value contains network command
  conf: 0.96
  if:
    type: encoded
    encoding: url
    regex: (?i)[?&]\w{1,24}=(curl|wget|nc)([&#]|$)
  not:
  - regex: (?i)edge=curl
  - regex: (?i)lang=curl
- id: url-network-command-literal
  for:
  - python
  - javascript
  - typescript
  - go
  desc: Raw URL query contains network command
  conf: 0.96
  if:
    type: literal
    kind: string
    regex: (?i)[?&][^=&]{1,24}=(curl|wget|nc)([&#]|$)
  not:
  - regex: (?i)edge=curl
  - regex: (?i)lang=curl
- id: url-substitution-downloader-command
  for:
  - python
  - javascript
  - typescript
  - go
  desc: URL query substitution invokes a downloader
  conf: 0.99
  if:
    type: literal
    kind: string
    regex: (?i)[?&]\w{1,24}=[^&#]{0,48}(\$\(\s*|%24%28(%20|\+)*)(busybox(\s|%20)+)?(curl|wget|tftp)\b
- id: url-semicolon-control
  for:
  - python
  - javascript
  - typescript
  - go
  desc: Semicolon plus discovery command
  conf: 0.96
  if:
    type: encoded
    encoding: url
    regex: (?i)https?://[^\s"'<>]{0,120}[?&]\w{1,24}=[\w.%~+/-]{0,48};\s*(id|uname|whoami|ipconfig)\b
- id: url-semicolon-control-literal
  for:
  - python
  - javascript
  - typescript
  - go
  desc: Encoded semicolon plus discovery command
  conf: 0.96
  if:
    type: literal
    kind: string
    regex: (?i)[?&][^=&]{1,24}=[^&#]{0,96}%3[bB]%20(id|uname|whoami|ipconfig)\b
- id: url-semicolon-network-command
  for:
  - python
  - javascript
  - typescript
  - go
  desc: Semicolon plus network command
  conf: 0.96
  if:
    type: encoded
    encoding: url
    regex: (?i)[?&]\w{1,24}=[^&#\r\n"'<>]{0,48};\s*(curl|wget|nc)\b
- id: url-semicolon-network-command-literal
  for:
  - python
  - javascript
  - typescript
  - go
  desc: Encoded semicolon plus network command
  conf: 0.96
  if:
    type: literal
    kind: string
    regex: (?i)[?&][^=&]{1,24}=[^&#]{0,96}%3[bB]%20(curl|wget|nc)\b
- id: url-semicolon-shell-command
  for:
  - python
  - javascript
  - typescript
  - go
  desc: Semicolon plus interpreter command
  conf: 0.96
  if:
    type: encoded
    encoding: url
    regex: (?i)[?&]\w{1,24}=[^&#\r\n"'<>]{0,48};\s*(sh|bash|python|node)\b
- id: url-semicolon-shell-command-literal
  for:
  - python
  - javascript
  - typescript
  - go
  desc: Encoded semicolon plus interpreter command
  conf: 0.96
  if:
    type: literal
    kind: string
    regex: (?i)[?&][^=&]{1,24}=[^&#]{0,96}%3[bB]%20(sh|bash|python|node)\b
- id: url-semicolon-destructive-command
  for:
  - python
  - javascript
  - typescript
  - go
  desc: Semicolon plus destructive command
  conf: 0.96
  if:
    type: encoded
    encoding: url
    regex: (?i)[?&]\w{1,24}=[^&#\r\n"'<>]{0,48};\s*(rm|chmod|chown|kill)\b
- id: url-semicolon-destructive-command-literal
  for:
  - python
  - javascript
  - typescript
  - go
  desc: Encoded semicolon plus destructive command
  conf: 0.96
  if:
    type: literal
    kind: string
    regex: (?i)[?&][^=&]{1,24}=[^&#]{0,96}%3[bB]%20(rm|chmod|chown|kill)\b
- id: url-discovery-short-token
  for:
  - python
  - javascript
  - typescript
  - go
  desc: Command parameter contains id or uname
  crit: notable
  conf: 0.96
  if:
    type: encoded
    encoding: url
    regex: (?i)[?&](cmd|command|exec(ute)?)=(id|uname)([&#]|$)
- id: url-discovery-host-token
  for:
  - python
  - javascript
  - typescript
  - go
  desc: Command parameter contains host discovery
  crit: notable
  conf: 0.96
  if:
    type: encoded
    encoding: url
    regex: (?i)[?&](cmd|command|exec(ute)?)=(whoami|ipconfig)([&#]|$)
- id: url-pipe-discovery-network-raw
  for:
  - python
  - javascript
  - typescript
  - go
  desc: URL query pipe to discovery/network command
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)[?&]\w{1,24}=[^&#\\\[\]\r\n"'<>()]{0,48}\| *(id|uname|whoami|curl|wget|nc)\b
- id: url-pipe-interpreter-raw
  for:
  - python
  - javascript
  - typescript
  - go
  desc: URL query pipe to script interpreter
  crit: notable
  conf: 0.96
  if:
    type: text
    regex: (?i)[?&]\w{1,24}=[^&#\\\[\]\r\n"'<>()]{0,48}\| *(sh|bash|python|node)\b
- id: url-pipe-command-encoded
  for:
  - python
  - javascript
  - typescript
  - go
  desc: Encoded URL pipe precedes shell command
  crit: notable
  conf: 0.96
  if:
    type: literal
    kind: string
    regex: (?i)[?&]\w{1,24}=[^&#]{0,48}%7c(%20|\+)*(id|uname|whoami|curl|wget|nc|sh|bash)\b
defaults:
  platforms:
  - unix
  - windows
  crit: notable
  attack: T1059
  mbc: E1059
