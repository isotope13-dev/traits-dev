defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]

traits:
  - id: node-runtime-fetch-api-exposure
    desc: Exposes fetch through runtime object
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'Object\s*\[\s*["'']defineProperty["'']\s*\]\s*\([^\n]{0,220}["'']fetch["'']'

  - id: node-global-https-module-exposure
    desc: Exposes Node https module through globalThis
    crit: notable
    conf: 0.9
    if:
      type: tree-sitter
      kind: assignment
      regex: 'globalThis\s*\[\s*["'']https["'']\s*\]\s*='
