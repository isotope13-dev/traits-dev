defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable
traits:
  - id: wfs-stored-feature-id
    desc: Uses WFS stored feature identifier query
    if:
      type: literal
      exact: urn:ogc:def:query:OGC-WFS::GetFeatureById
  - id: wfs-resource-attribute-breakout
    desc: Closes attribute before FES property element
    if:
      type: text
      regex: '[''""]\s*/>\s*<[A-Za-z_][\w.-]{0,24}:PropertyName\b'
