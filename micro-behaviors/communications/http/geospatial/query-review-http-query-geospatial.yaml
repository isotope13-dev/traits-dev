defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - scripts
  - python
  - javascript
  - typescript
  - java
  - go
  - rust
  - php
  - ruby
  - shell
  - c
  - cpp
  - csharp

traits:
  - id: ogc-jsonarraycontains-filter
    desc: References jsonArrayContains filter syntax
    conf: 0.96
    if:
      type: text
      regex: '(?i)\bjsonArrayContains\s*\('

  - id: wfs-getfeature-operation
    desc: References the WFS GetFeature operation name
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?i)\bGetFeature\b'

  - id: cql-filter-parameter
    desc: References the CQL_FILTER request field
    conf: 0.95
    if:
      type: literal
      kind: string
      regex: '(?i)\bCQL_FILTER\b'
