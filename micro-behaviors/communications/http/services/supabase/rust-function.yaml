defaults:
  platforms: [unix, windows]
  for: [rust]
traits:
  - id: rust-supabase-webhook-function-url
    desc: Rust quotes Supabase webhook function URL
    crit: notable
    conf: 0.99
    if:
      type: string_literal
      regex: '(?i)^https://[\w-]+\.supabase\.co/functions/v1/[\w-]*(webhook|oob)[\w-]*$'
