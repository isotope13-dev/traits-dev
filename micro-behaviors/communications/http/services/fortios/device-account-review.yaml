defaults:
  platforms: [appliance]
  for: [javascript, typescript, text, python, pyc, go]

traits:
  - id: fortios-super-admin
    desc: super_admin near FortiOS admin API
    crit: notable
    conf: 0.9
    platforms: [fortios]
    if:
      type: text
      regex: '(/cmdb/system/admin[\s\S]{0,1000}super_admin|super_admin[\s\S]{0,1000}/cmdb/system/admin)'
composite_rules:
  - id: fortios-admin-api-password-clues
    for: [python, javascript, go]
    desc: FortiOS admin API and password field clues
    crit: suspicious
    conf: 0.98
    platforms: [fortios]
    all:
      - id: micro-behaviors/communications/http/services/fortios::admin-api-path
      - id: micro-behaviors/communications/http/services/fortios::fortios-super-admin
      - id: micro-behaviors/data/format/credentials::password-field-source-value
