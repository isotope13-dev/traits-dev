# FortiOS REST API endpoint references. The endpoint alone identifies a
# management capability; persistence traits add administrator role and
# credential evidence before assigning attacker intent.
defaults:
  platforms: [fortios]
  for: [scripts, source]

traits:
  - id: admin-api-path
    desc: FortiOS administrator API endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /cmdb/system/admin

  - id: fortiweb-fwbcgi-endpoint
    desc: FortiWeb fwbcgi CGI endpoint path
    crit: notable
    conf: 0.95
    platforms: [fortios, unix, windows]
    for: [scripts, source, binaries]
    if:
      type: text
      substr: /cgi-bin/fwbcgi

  - id: fortios-config-backup-api-path
    desc: FortiOS configuration backup API endpoint
    crit: notable
    conf: 0.95
    platforms: [fortios, unix, windows]
    for: [scripts, source, binaries]
    if:
      type: text
      substr: /monitor/system/config/backup
