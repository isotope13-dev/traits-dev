defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
# User Activity Exfiltration

traits:
  - id: extension-attribution-field
    desc: Click-attribution parameter field
    crit: component
    conf: 0.9
    for: [javascript, typescript, html]
    if:
      type: text
      regex: '\b(gclid|msclkid|fbclid|aff_sub[2-5]?)\b'
