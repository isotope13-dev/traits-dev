# Telemetry event payloads that carry an opaque base64-encoded free-text
# value. Standard analytics integrations send structured, named event
# properties; wrapping caller-supplied text in btoa() inside the event
# properties is how stealers hide harvested secrets inside ordinary-looking
# collector traffic. This is the payload-shape fact; the exfiltration
# conviction pairs it with a credential-entry surface in objectives/.
# Member-file scope only: archive-scoped composites pool these findings up
# to the container node.
defaults:
  platforms: [windows, unix]
  for: [javascript, html]
  crit: notable
  conf: 0.94

traits:
  - id: encoded-event-property
    desc: Telemetry event property carries a btoa value
    if:
      type: text
      regex: '(?i)(encoded|payload|content|data)["'']?\s*:\s*btoa\s*\('
