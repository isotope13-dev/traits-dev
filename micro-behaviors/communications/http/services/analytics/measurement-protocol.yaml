defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: google-analytics-mp-collect-endpoint
    desc: GA4 Measurement Protocol collection endpoint
    if:
      type: text
      # The optional segment selects GA4's debug endpoint, including templates
      # that choose debug/ or an empty string at runtime. This is a URL
      # reference, not proof of an HTTP request or exported data.
      regex: 'google-analytics\.com/(debug/|\$\{[\w$]{1,40}\})?mp/collect'

