defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, rust]
  crit: notable
  conf: 0.9

traits:
  - id: posthog-host-reference
    desc: References the PostHog service domain
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: 'posthog\.com'
      case_insensitive: true
  - id: posthog-sdk-event-capture
    desc: Builds a PostHog analytics client or event
    crit: notable
    conf: 0.93
    for: [rust]
    if:
      type: text
      regex: 'posthog_rs::(client|Event::new)\b'

