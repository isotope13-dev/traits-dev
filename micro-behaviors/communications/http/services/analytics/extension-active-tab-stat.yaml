defaults:
  for: [javascript]
  platforms: [unix, windows]
traits:
  - id: extension-active-tab-url-feature-stat
    desc: Includes active tab URL in feature telemetry
    crit: notable
    conf: 0.98
    if:
      type: yara
      source: |
        rule extension_active_tab_url_feature_stat {
          strings:
            $stat = "async sendStat(feature)"
            $query = "chrome.tabs.query({active:true,lastFocusedWindow:true})"
            $post = "fetch(url,{method:\"POST\",body:body"
            $header = "\"Tsvb-Referer\":(_a=tabs[0])==null?void 0:_a.url"
          condition:
            all of them
        }
