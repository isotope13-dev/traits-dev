defaults:
  platforms: [unix, windows]
  for: [markdown, html, text, javascript, typescript]
  crit: notable
  conf: 0.97

traits:
  - id: scarf-analytics-pixel-url
    desc: References a Scarf analytics pixel URL
    if:
      type: text
      regex: 'https://static\.scarf\.sh/a\.png\?x-pxid=[a-fA-F0-9-]{36}\b'
