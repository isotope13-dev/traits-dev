defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  mbc: C0002
  attack: T1071.001

traits:
  - id: google-analytics-mp-api-first
    desc: "GA collect: API secret then measurement ID"
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'google-analytics\.com/mp/collect\?.{0,80}api_secret=[^&]{1,64}&measurement_id='
  - id: google-analytics-mp-measurement-first
    desc: "GA collect: measurement ID then API secret"
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'google-analytics\.com/mp/collect\?.{0,80}measurement_id=[^&]{1,32}&api_secret='
  - id: analytics-track-endpoint
    desc: Analytics track endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /analytics/track
  - id: pageview-event-token
    desc: Pageview analytics event token
    crit: notable
    conf: 0.86
    unless:
      - id: metadata/lang/generated::generated-apollo-icon-enum-source
    if:
      type: text
      regex: '(?i)\bpage[_-]?view\b'
    not:
      # UI shell/router class names (e.g. @operato/shell PageView), not GA events.
      - regex: '\bPageView\b'
      - substr: '@operato/shell'
  - id: pageview-url-field
    desc: Analytics event records a page URL
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '\bpage_url\s*:'
  - id: click-event-token
    desc: Analytics event includes click token
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\b(analytics|gtag|track)\b[^\n]{0,80}\bclick\b'
  - id: form-submit-event-token
    desc: Form submit analytics event token
    crit: notable
    conf: 0.86
    if:
      type: text
      word: form_submit
  - id: scroll-depth-event-token
    desc: Scroll depth analytics event token
    crit: notable
    conf: 0.86
    if:
      type: text
      word: scroll_depth
  - id: page-exit-event-token
    desc: Page exit analytics event token
    crit: notable
    conf: 0.86
    if:
      type: text
      word: page_exit

composite_rules:
  - id: google-analytics-measurement-protocol
    desc: GA Measurement Protocol event POST
    crit: notable
    conf: 0.92
    any:
      - id: google-analytics-mp-api-first
      - id: google-analytics-mp-measurement-first
  - id: google-analytics-pageview-url
    desc: Google Analytics page_view event includes the page URL
    crit: notable
    conf: 0.95
    all:
      - id: pageview-event-token
      - id: pageview-url-field
    any:
      - id: google-analytics-mp-api-first
      - id: google-analytics-mp-measurement-first
  - id: interaction-event-tokens
    desc: Interaction analytics event tokens
    crit: component
    conf: 0.86
    needs: 2
    any:
      - id: click-event-token
      - id: form-submit-event-token
      - id: scroll-depth-event-token
      - id: page-exit-event-token
  - id: browser-analytics-event-beacon
    desc: Browser analytics event beacon
    crit: notable
    conf: 0.94
    all:
      - id: analytics-track-endpoint
    any:
      - id: micro-behaviors/communications/http/request/beacon::browser-send-beacon
      - id: pageview-event-token
      - id: click-event-token
      - id: form-submit-event-token
      - id: scroll-depth-event-token
      - id: page-exit-event-token
    needs: 2
