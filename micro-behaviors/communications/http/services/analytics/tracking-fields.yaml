defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]

traits:
- id: extension-user-guid-field
  desc: Extension telemetry user GUID field
  crit: component
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    word: userGuid
- id: webextension-api-marker
  desc: WebExtension API context
  crit: component
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '\b(chrome|browser)\.(tabs|storage|runtime|cookies|alarms)\b'
- id: distributer-id-field
  desc: Distributer ID affiliate tracking field
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: distributer[_-]?id
- id: ga-cookie-polling-interval
  desc: Google Analytics cookie name
  crit: component
  conf: 0.75
  if:
    type: text
    substr: _ga_
