# Segment analytics client usage. Neutral capability: many legitimate SDKs
# (including Airbyte's agent SDK) ship opt-out product telemetry through
# Segment with a hardcoded write key. The key itself is not a secret —
# Segment write keys are public by design — but its presence identifies the
# telemetry channel for triage.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: notable
  conf: 0.88

traits:
  - id: segment-write-key-reference
    desc: References a Segment analytics write key
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(write_key|SEGMENT_WRITE_KEY)\b'
  - id: segment-track-call
    desc: Calls the Segment track method
    conf: 0.9
    if:
      type: text
      regex: '\banalytics\.track\s*\('

composite_rules:
  - id: segment-track-anonymous-id
    desc: Segment track call passes an anonymous ID
    crit: notable
    conf: 0.9
    all:
      - id: segment-write-key-reference
      - id: segment-track-call
      - id: micro-behaviors/data/serialize/object::anonymous-id-field-reference
    near_bytes: 512
