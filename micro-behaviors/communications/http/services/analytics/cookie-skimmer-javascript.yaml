defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  attack: "T1539"

traits:
- id: vwo-token
  desc: "VWO analytics token"
  crit: component
  conf: 0.8
  if:
    type: text
    word: vwo
- id: vis-opt-token
  desc: "VIS_OPT analytics token"
  crit: notable
  conf: 0.8
  if:
    type: text
    word: vis_opt
composite_rules:
- id: vwo-or-vis-opt-token
  desc: "VWO or VIS_OPT analytics token"
  crit: component
  conf: 0.8
  any:
  - id: micro-behaviors/communications/http/services/analytics::vwo-token
  - id: micro-behaviors/communications/http/services/analytics::vis-opt-token
