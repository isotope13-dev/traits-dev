defaults:
  platforms:
  - windows
  - unix
  for:
  - python
  - javascript
  - powershell
  - pe
  crit: notable
  conf: 0.8

traits:
  - id: gtag-js-measurement-id-query
    desc: Google gtag.js measurement id query
    crit: notable
    conf: 0.95
    for: [scripts, source]
    if:
      type: text
      substr: googletagmanager.com/gtag/js?id=

  - id: ga4-measurement-protocol-id-query
    desc: GA4 Measurement Protocol measurement_id query
    crit: notable
    conf: 0.95
    for: [scripts, source]
    if:
      type: text
      substr: google-analytics.com/mp/collect?measurement_id=

  - id: gtm-js-container-id-query
    desc: Google Tag Manager container id query
    crit: notable
    conf: 0.95
    for: [scripts, source]
    if:
      type: text
      substr: googletagmanager.com/gtm.js?id=


