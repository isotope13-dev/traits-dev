defaults:
  conf: 0.9
  platforms:
    - unix
    - windows
  crit: notable
  for: [binaries]
traits:
  - id: steam-profile-url
    desc: steamcommunity.com profile URL
    crit: notable
    if:
      type: text
      regex: steamcommunity\.com/(profiles|id)/
    unless:
      - id: metadata/package/ecosystem/
      - id: metadata/package/description/length::pkginfo-single-word-summary
  - id: steam-profile-fetch
    desc: HTTP request to fetch Steam community profile
    crit: notable
    if:
      type: text
      regex: (?i)\b(get|fetch|request)\b.{0,60}steamcommunity\.com
    unless:
      - id: metadata/package/ecosystem/
      - id: metadata/package/description/length::pkginfo-single-word-summary
