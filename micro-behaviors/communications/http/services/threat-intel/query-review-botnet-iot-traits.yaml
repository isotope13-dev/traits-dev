defaults:
  platforms:
  - unix
  - windows
  for:
  - elf
  - shell

traits:
  - id: html-malwarebazaar-sample-link
    desc: "MalwareBazaar sample link"
    crit: notable
    conf: 0.9
    platforms: [unix]
    for: [html]
    if:
      type: text
      substr: "bazaar.abuse.ch/sample/"
  - id: html-virustotal-file-link
    desc: "VirusTotal file page link"
    crit: notable
    conf: 0.85
    platforms: [unix]
    for: [html]
    if:
      type: text
      regex: "virustotal\\.com/gui/file/[A-Fa-f0-9]{16}"
