defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.98
traits:
  - id: gcs-project-bucket-list-url
    desc: Cloud Storage project bucket-list URL
    if:
      type: literal
      substr: 'storage.googleapis.com/storage/v1/b?project='
      exclude_docstrings: true
  - id: gcs-bucket-object-list-url
    desc: Cloud Storage bucket object-list URL
    if:
      type: literal
      regex: 'storage\.googleapis\.com/storage/v1/b/[^/\s]{1,100}/o\?'
      exclude_docstrings: true
  - id: gcs-bucket-iam-url
    desc: Cloud Storage bucket IAM policy URL
    if:
      type: literal
      regex: 'storage\.googleapis\.com/storage/v1/b/[^/\s]{1,100}/iam\b'
      exclude_docstrings: true
