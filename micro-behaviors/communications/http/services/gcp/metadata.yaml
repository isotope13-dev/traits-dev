defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, rust, elf]
  crit: notable
traits:
  - id: gcp-service-account-token-path
    desc: GCP service account access-token path
    conf: 0.9
    if:
      type: text
      substr: /computeMetadata/v1/instance/service-accounts/default/token
    unless:
      - id: well-known/lib/network/grpc-ruby::grpc-ruby-c-extension-artifact
  - id: gcp-service-accounts-metadata-path
    desc: GCP service accounts metadata path
    conf: 0.9
    if:
      type: text
      substr: /computeMetadata/v1/instance/service-accounts
    unless:
      - id: well-known/lib/network/grpc-ruby::grpc-ruby-c-extension-artifact
  - id: gcp-default-service-account-email-path
    desc: GCP default service-account email path
    conf: 0.92
    if:
      type: text
      substr: /computeMetadata/v1/instance/service-accounts/default/email
    downgrade:
      any:
        - id: micro-behaviors/fs/path/credential::gcp-default-credentials
    unless:
      - id: well-known/lib/network/grpc-ruby::grpc-ruby-c-extension-artifact

  - id: gcp-metadata-client-import
    desc: Imports the gcp-metadata client library
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: import
      exact: gcp-metadata

  - id: gcp-metadata-client-query-call
    desc: Queries GCP instance metadata via SDK client
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(?i)gcp_?metadata\.(instance|project|universe)$'

  - id: gcp-metadata-endpoint
    desc: GCP metadata endpoint string in native binary
    crit: notable
    conf: 0.85
    for: [elf, c, cpp, rust, go]
    if:
      type: text
      substr: metadata.google.internal
      section: .rodata
    unless:
      - id: well-known/lib/network/grpc-ruby::grpc-ruby-c-extension-artifact
  # Node code that queries the GCE/GKE instance metadata server through the
  # official `gcp-metadata` client never spells out metadata.google.internal or
  # 169.254.169.254, so the endpoint traits above miss it entirely. Cloud
  # credential-harvesting code prefers the SDK for exactly that reason.

  - id: gcp-metadata-endpoint-reference
    desc: Google Cloud metadata host reference
    crit: notable
    conf: 0.9
    for: [scripts, source, javascript, typescript]
    if:
      type: text
      regex: '(?i)\bmetadata\.google\.internal\b'

  - id: gcp-metadata-endpoint-go-source
    desc: GCP metadata endpoint in Go source
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: text
      substr: metadata.google.internal
