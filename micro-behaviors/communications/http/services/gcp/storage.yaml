# Google Cloud Storage client operations. Uploading a string is how a program
# puts bytes in a bucket; the exfil objective decides when that upload is the
# payload.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9

traits:
  - id: python-gcs-storage-import
    desc: Imports the Google Cloud Storage client
    conf: 0.92
    if:
      type: text
      substr: 'from google.cloud import storage'
  - id: python-gcs-upload-string
    desc: Uploads a string to a storage blob
    conf: 0.93
    if:
      type: symbol
      kind: call
      regex: '(^|\.)upload_from_string$'
  # These modules are the upload implementation, not a program using it
  # to move stolen data.
  - id: vertex-or-aiplatform-uploader
    desc: Vertex or AI Platform storage helper
    crit: notable
    if:
      type: path
      regex: '(^|[\\/])(vertexai|aiplatform)[\\/]'
  - id: celery-gcs-backend-path
    desc: Celery GCS result backend module
    crit: notable
    if:
      type: path
      regex: '(^|[\\/])backends[\\/]gcs\.py$'
