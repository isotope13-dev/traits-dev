# Neutral observations relocated from attacker-objective rules.
traits:
  - id: native-metadata-host-and-flavor-header
    desc: GCP metadata host near Metadata-Flavor text
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: metadata\.google\.internal[\s\S]{0,360}Metadata-Flavor
    unless:
    - id: well-known/tool/development/agent/anthropic-claude-agent::claude-agent-native-runtime
    - id: well-known/tool/development/agent/kilocode::kilo-code-native-runtime
    - id: metadata/package/testing/presence/harness::go-test-file
    - id: metadata/package/testing/harness/unit/
    platforms:
    - unix
    for:
    - go
    - elf
