# Google Cloud control-plane operations referenced by cloud audit logs and
# SDKs. Intent-bearing chains belong under objectives/; these atoms only
# describe the API operation or policy field.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  crit: notable
  conf: 0.94

traits:
  - id: cloud-kms-endpoint
    desc: GCP Cloud KMS endpoint
    conf: 0.84
    for: [javascript, typescript, python, shell]
    if:
      type: text
      substr: cloudkms.googleapis.com

  - id: gcp-set-org-policy-call
    desc: GCP SetOrgPolicy SDK call
    for: [python, javascript, typescript, go, java, csharp, php]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)set[_-]?org[_-]?policy$'

  - id: gcp-set-org-policy-event
    desc: GCP SetOrgPolicy audit event
    for: [json]
    if:
      type: text
      regex: '(?i)"methodName"\s*:\s*".{0,120}SetOrgPolicy"'

  - id: gcp-set-iam-policy-call
    desc: GCP SetIamPolicy SDK call
    for: [python, javascript, typescript, go, java, csharp, php]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)set[_-]?iam[_-]?policy$'

  - id: gcp-set-iam-policy-event
    desc: GCP SetIamPolicy audit event
    for: [json]
    if:
      type: text
      regex: '(?i)"methodName"\s*:\s*".{0,120}SetIamPolicy"'

  - id: gcp-allowed-policy-member-domains-field
    desc: GCP allowed member domains policy field
    for: [scripts, source]
    if:
      type: literal
      exact: allowedPolicyMemberDomains

  - id: gcp-allowed-policy-member-domains-event-field
    desc: GCP allowed member domains event field
    for: [json]
    if:
      type: text
      regex: '(?i)"allowedPolicyMemberDomains"\s*:'

  - id: gcp-external-editor-binding
    desc: GCP email-backed member binding
    for: [scripts, source]
    if:
      type: literal
      regex: '(?i)^user:[^@\s]+@[^@\s]+$|^group:[^@\s]+@[^@\s]+$'

  - id: gcp-editor-role-literal
    desc: GCP editor role literal
    for: [scripts, source]
    if:
      type: literal
      exact: roles/editor

  - id: gcp-editor-role-event
    desc: GCP editor role event field
    for: [json]
    if:
      type: text
      regex: '(?i)"role"\s*:\s*"roles/editor"'

  - id: gcp-external-member-event
    desc: GCP external email member event field
    for: [json]
    if:
      type: text
      regex: '(?i)"members"\s*:\s*\[[^\]]{0,240}(user|group):[^@\s"]{1,64}@[^\s"]{1,120}'

composite_rules:
  - id: gcp-org-policy-change-operation
    desc: GCP organization-policy change operation
    crit: notable
    any:
      - id: gcp-set-org-policy-call
      - id: gcp-set-org-policy-event

  - id: gcp-iam-policy-write-operation
    desc: GCP IAM policy write operation
    crit: notable
    any:
      - id: gcp-set-iam-policy-call
      - id: gcp-set-iam-policy-event

  - id: gcp-allowed-policy-member-domains
    desc: GCP allowed member domains policy setting
    crit: notable
    any:
      - id: gcp-allowed-policy-member-domains-field
      - id: gcp-allowed-policy-member-domains-event-field
