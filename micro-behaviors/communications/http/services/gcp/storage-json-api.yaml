# Co-occurrence of these references does not establish authorization or data flow.
defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: gcs-and-instance-token-references
    desc: GCS URL and instance token path references
    crit: notable
    all:
      - id: well-known/app/storage/google-cloud-storage::gcs-url
      - id: micro-behaviors/communications/http/services/gcp::gcp-service-account-token-path
