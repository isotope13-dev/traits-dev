# A shell helper that talks to Cloud Storage over its JSON API with a bearer
# token fetched from the VM's own metadata server uploads to storage.googleapis.com
# with the instance's identity. Reading the token and POSTing a file with
# `curl --data-binary` is the same shape as exfiltration to a collector, so the
# destination is what decides: the provider's own storage endpoint, authorized by
# the instance's service account, is an object-store client.
defaults:
  platforms: [unix]
  for: [shell]

composite_rules:
  - id: gcs-client-with-instance-token
    desc: Cloud Storage client using the instance token
    crit: exception
    all:
      - id: micro-behaviors/communications/http/url/cloud::gcs-url
      - id: micro-behaviors/communications/http/services/gcp::gcp-service-account-token-path
