defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: billing-account-api-literal
    desc: GCP billing-account API literal
    if:
      type: literal
      exclude_docstrings: true
      regex: '^https://cloudbilling\.googleapis\.com/v1/billingAccounts/'

  - id: billing-admin-gmail-binding-append
    for: [python, javascript, typescript]
    desc: Appends Gmail billing administrator binding
    if:
      type: symbol
      kind: call
      regex: '\.(append|push)$'
      args:
        - index: 0
          from:
            field: role
            whole_value: '^roles/billing\.admin$'
        - index: 0
          from:
            field: members
            value: '^user:[^@\s]+@gmail\.com$'

  - id: iam-policy-rest-post
    for: [python, javascript, typescript, ruby, php]
    desc: POST to Google IAM policy write endpoint
    if:
      type: symbol
      kind: call
      regex: '(^|\.)post$'
      arg:
        index: 0
        from:
          value: ':setIamPolicy$'

  - id: iam-policy-rest-fetch-post
    desc: Fetch POST to Google IAM policy endpoint
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)fetch$'
      args:
        - index: 0
          from:
            value: ':setIamPolicy$'
        - index: 1
          from:
            field: method
            whole_value: '^POST$'

  - id: billing-project-link-cli
    desc: gcloud links project to billing account
    for: [shell, powershell, batch]
    if:
      type: symbol
      kind: call
      exact: gcloud
      args:
        - name: billing
        - name: projects
        - name: link

composite_rules:
  - id: iam-policy-rest-write
    desc: Google IAM policy REST write operation
    any:
      - id: iam-policy-rest-post
      - id: iam-policy-rest-fetch-post
