defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: billing-account-api-literal
    desc: GCP billing-account API literal
    if:
      type: literal
      exclude_docstrings: true
      regex: '^https://cloudbilling\.googleapis\.com/v1/billingAccounts/'

  - id: billing-project-api-literal
    desc: GCP billing-project API literal
    if:
      type: literal
      exclude_docstrings: true
      regex: '^https://cloudbilling\.googleapis\.com/v1/projects/'

  - id: billing-admin-gmail-binding-append
    for: [python, javascript, typescript]
    desc: Appends Gmail billing administrator binding
    if:
      type: text
      regex: 'roles/billing\.admin.{1,60}user:[^@\s]{1,40}@gmail\.com'

  - id: iam-policy-rest-post
    for: [python, javascript, typescript, ruby, php]
    desc: POST to Google IAM policy write endpoint
    if:
      type: symbol
      kind: call
      regex: '(^|\.)post$'
      arg:
        index: 0
        from:
          value: ':setIamPolicy$'

  - id: iam-policy-rest-fetch-post
    desc: Fetch POST to Google IAM policy endpoint
    for: [javascript, typescript]
    if:
      type: text
      regex: 'fetch\([^)]{1,80}:setIamPolicy.{1,40}POST'

  - id: billing-project-link-cli
    desc: gcloud links project to billing account
    for: [shell, powershell, batch]
    if:
      type: symbol
      kind: call
      exact: gcloud
      args:
        - name: billing
        - name: projects
        - name: link

  - id: billing-admin-binding-remove-cli
    desc: gcloud removes billing administrator IAM binding
    for: [shell, powershell, batch]
    if:
      type: symbol
      kind: call
      exact: gcloud
      args:
        - name: billing
        - name: accounts
        - name: remove-iam-policy-binding
        - name_regex: '^--role=roles/billing\.admin$'

  - id: billing-project-info-rest-put
    for: [python, javascript, typescript, ruby, php]
    desc: PUT to Google project billingInfo endpoint
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)put$'
      arg:
        index: 0
        from:
          value: '/billingInfo$'

composite_rules:
  - id: iam-policy-rest-write
    desc: Google IAM policy REST write operation
    any:
      - id: iam-policy-rest-post
      - id: iam-policy-rest-fetch-post
