defaults:
  platforms: [unix, windows]
  for: [python]
traits:
  - id: python-gcs-ci-metadata-upload
    desc: Uploads CI identifiers to object storage
    crit: notable
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '\.upload_from_string$'
      arg:
        index: 0
        from:
          call: '^os\.getenv$'
          literal: '^(RUN|PIPELINE|STEP)$'
composite_rules:
  - id: python-import-time-ci-upload-profile
    desc: CI uploads beside eager class initialization
    crit: suspicious
    conf: 0.94
    for: [python, whl]
    # Co-occurrence in one source file, not proof of a call edge from the
    # initializer to the upload helper. Never pool unrelated archive members.
    scope: leaf
    all:
      - id: python-gcs-ci-metadata-upload
      - id: micro-behaviors/data/control-flow/module-exec::python-class-eager-thread-start
      - id: micro-behaviors/process/thread/create::python-thread-target-eager-call
