# A structured Cloud Logging write is ordinary in services. Its meaning as an
# outbound channel comes from the payload composed beside it, which the
# objectives/exfiltration/cloud/saas composites judge.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.9
traits:
  - id: gcp-logging-struct-write
    desc: Writes a structured Google Cloud Logging entry
    if:
      type: symbol
      kind: call
      regex: '\.log_struct$'
