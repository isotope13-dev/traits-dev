# IAM Credentials API methods, including shell payloads embedded in workflows.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.98
traits:
  - id: service-account-access-token-endpoint
    desc: GCP service account token issuance endpoint
    if:
      type: text
      regex: 'iamcredentials\.googleapis\.com/v1/[^"\s]{1,220}:generateAccessToken'
  - id: service-account-sign-jwt-endpoint
    desc: GCP service account JWT signing endpoint
    if:
      type: text
      regex: 'iamcredentials\.googleapis\.com/v1/[^"\s]{1,220}:signJwt'
