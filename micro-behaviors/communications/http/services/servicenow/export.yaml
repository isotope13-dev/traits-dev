# Direct table export is a normal ServiceNow capability. Intent requires
# other evidence; a CSV filename or a bare sys_user mention is insufficient.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.96

traits:
  - id: servicenow-user-export-source-path
    desc: ServiceNow user-table export path literal
    for: [scripts, source]
    if:
      type: literal
      kind: string
      exclude_docstrings: true
      regex: '(?i)/sys_user(_list)?\.do\?CSV([&#]|$)'

  - id: servicenow-user-export-binary-path
    desc: ServiceNow user-table export path in binary
    for: [binaries]
    if:
      type: text
      regex: '(?i)/sys_user(_list)?\.do\?CSV([&#]|$)'

composite_rules:
  - id: servicenow-user-export-path
    desc: ServiceNow user-table export path reference
    any:
      - id: servicenow-user-export-source-path
      - id: servicenow-user-export-binary-path
