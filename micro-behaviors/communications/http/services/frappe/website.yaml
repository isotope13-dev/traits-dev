defaults:
  platforms: [unix, windows]
  for: [scripts, source, text, json, html]

traits:
  - id: web-form-accept-endpoint
    desc: Frappe public web form submission endpoint
    crit: notable
    conf: 1.0
    if:
      type: text
      substr: /api/method/frappe.website.doctype.web_form.web_form.accept

  - id: account-deletion-form-selector
    desc: Selects Frappe account deletion web form
    crit: notable
    conf: 1.0
    if:
      type: text
      regex: '["'']?web_form["'']?\s*[:=]\s*["'']request-to-delete-data["'']'
