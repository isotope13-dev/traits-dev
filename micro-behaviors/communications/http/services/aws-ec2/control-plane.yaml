# AWS control-plane API operations are neutral capabilities on their own.
# Objective composites under objectives/ add intent by requiring related
# operations from the same attack chain.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  crit: notable
  conf: 0.92
traits:
  - id: subnet-delete-operation
    desc: AWS subnet deletion operation
    if:
      type: text
      regex: '(?i)\bdelete[_-]?subnet\b'
    unless:
      - id: well-known/lib/cloud/alibaba-cloud-go::alibaba-cloud-go-library
      - id: well-known/lib/cloud/botocore::aws-python-sdk-source
  - id: aws-instance-export-call
    desc: AWS EC2 instance export call
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)create[_-]?instance[_-]?export[_-]?task$'
  - id: aws-run-instances-call
    desc: AWS EC2 instance launch call
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)run[_-]?instances$'
    unless:
      - id: well-known/lib/cloud/alibaba-cloud-go::alibaba-cloud-go-library
  # Anchor the field to an instance-launch API or request type. `UserData` by
  # itself is a common application-model property.
  - id: aws-user-data-call-parameter
    desc: AWS EC2 user-data call parameter
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: text
      regex: '(?is)\b(runInstances|RunInstancesRequest).{0,256}\bUserData\s*[:=]'
    unless:
      # `type UserData = {...}` / `interface UserData` / `class UserData` is a
      # locally declared shape (type-fest's docs use exactly this name), not a
      # RunInstances parameter — the `=` there is a declaration, not an arg.
      - type: text
        regex: '\b(type|interface|class)\s+UserData\b'
  - id: aws-instance-export-event
    desc: AWS EC2 instance export event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"CreateInstanceExportTask"'
  - id: aws-run-instances-event
    desc: AWS EC2 instance launch event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"RunInstances"'
  - id: aws-user-data-event-parameter
    desc: AWS EC2 user-data event parameter
    for: [json]
    if:
      type: text
      regex: '(?i)"userData"\s*:'
composite_rules:
  - id: aws-instance-export-operation
    desc: AWS EC2 instance export operation
    crit: notable
    any:
      - id: aws-instance-export-call
      - id: aws-instance-export-event
  - id: aws-run-instances-operation
    desc: AWS EC2 instance launch operation
    crit: notable
    any:
      - id: aws-run-instances-call
      - id: aws-run-instances-event
  - id: aws-user-data-parameter
    desc: AWS EC2 user-data parameter
    crit: notable
    any:
      - id: aws-user-data-call-parameter
      - id: aws-user-data-event-parameter
