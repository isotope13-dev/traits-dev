defaults:
  platforms: [unix, windows]
  for: [python, text, github-actions]
  crit: baseline
  size_max: 5242880
traits:
  - id: devto-cli-publish-script
    desc: Dev.to CLI publish script
    conf: 0.9
    for: [package.json]
    if:
      type: value
      path: scripts[*]
      substr: "@sinedied/devto-cli push"
  - id: devto-token-env-script
    desc: Dev.to token environment in publish script
    crit: notable
    conf: 0.9
    for: [package.json]
    if:
      type: value
      path: scripts[*]
      substr: "DEVTO_TOKEN"
composite_rules:
  - id: devto-publish-script
    desc: Dev.to publish pipeline script
    crit: notable
    conf: 0.94
    for: [package.json]
    all:
      - id: micro-behaviors/communications/http/services/devto::devto-cli-publish-script
      - id: micro-behaviors/communications/http/services/devto::devto-token-env-script
