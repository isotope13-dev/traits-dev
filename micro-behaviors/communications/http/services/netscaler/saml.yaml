# NetScaler SAML assertion-consumer and clientless-VPN protocol artifacts.
# Exploit intent is inferred only when objectives combine these neutral routes
# and session markers with a structurally invalid nFactor context.
defaults:
  platforms: [unix, windows, appliance]
  for: [scripts, source, text, data]
  crit: notable
  conf: 0.98

traits:
  - id: netscaler-saml-auth-endpoint
    desc: NetScaler SAML assertion-consumer endpoint
    if:
      type: text
      substr: /cgi/samlauth

  - id: netscaler-saml-auth-post-request
    desc: POST targets NetScaler SAML consumer
    if:
      type: text
      regex: '(?im)^POST[ \t]+/cgi/samlauth[ \t]'

  - id: repeated-netscaler-saml-auth-posts
    desc: Repeated POSTs hit NetScaler SAML consumer
    crit: suspicious
    count_min: 2
    if:
      type: text
      regex: '(?im)^POST[ \t]+/cgi/samlauth[ \t]'

  - id: netscaler-clientless-mode-endpoint
    desc: NetScaler clientless VPN mode-selection endpoint
    if:
      type: text
      regex: '/cgi/setclient\?cvpn([&\s"'']|$)'

  - id: netscaler-aaac-session-cookie
    desc: NetScaler AAA session cookie
    if:
      type: text
      regex: '\bNSC_AAAC='
