defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, shell]
  crit: notable
  conf: 0.9
  mbc: C0002
  attack: T1071.001

traits:
  - id: terraform-cloud-api
    desc: Terraform Cloud API endpoint
    if:
      type: text
      regex: 'app\.terraform\.io|/api/v2/(organizations|workspaces)/'
  - id: consul-http-api
    desc: HashiCorp Consul HTTP API
    if:
      type: text
      regex: 'X-Consul-Token|/v1/(session|kv)/'
  - id: consul-token-header
    desc: Consul token HTTP header
    if:
      type: text
      substr: X-Consul-Token
  - id: vault-sys-mounts-api
    desc: HashiCorp Vault sys mounts API endpoint
    if:
      type: literal
      kind: string
      substr: /v1/sys/mounts
  - id: vault-kv-data-path
    desc: Vault-style KV data path
    crit: component
    if:
      type: literal
      kind: string
      regex: '/v1/[^"''\s]{1,80}/data/'
  - id: vault-client-context
    desc: Vault client address or token literal
    crit: component
    if:
      type: literal
      kind: string
      regex: '^(X-Vault-Token|VAULT_(ADDR|URL|TOKEN|ROLE_ID|SECRET_ID))$'
  - id: vault-kv-list-parameter
    desc: Vault KV list query parameter
    if:
      type: text
      substr: list=true
  - id: terraform-cloud-bearer-auth
    desc: Terraform Cloud bearer authorization
    if:
      type: text
      regex: 'Authorization.{0,80}Bearer\s+(tfe_|atlasv1)'

composite_rules:
  # Many services have /v1/<resource>/data routes. The path alone does not
  # identify Vault; retain nested mount paths when Vault context is present.
  - id: vault-kv-data-api
    desc: HashiCorp Vault KV data API endpoint
    all:
      - id: vault-kv-data-path
    any:
      - id: vault-client-context
      - id: vault-sys-mounts-api
  - id: hashicorp-infra-api
    desc: HashiCorp infrastructure API usage
    crit: notable
    conf: 0.9
    any:
      - id: terraform-cloud-api
      - id: consul-http-api
  - id: hashicorp-infra-api-token-auth
    desc: HashiCorp infrastructure API token auth
    crit: notable
    conf: 0.9
    all:
      - id: hashicorp-infra-api
    any:
      - id: consul-token-header
      - id: terraform-cloud-bearer-auth
