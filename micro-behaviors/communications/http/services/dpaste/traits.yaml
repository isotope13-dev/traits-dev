defaults:
  crit: notable
  conf: 0.9
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: dpaste-api
    desc: Dpaste API usage
    if:
      type: text
      substr: 'dpaste.com/api'
  - id: dpaste-api-go
    desc: Dpaste API usage in Go
    for: [go]
    if:
      type: string_literal
      substr: dpaste.com/api
