defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: dpaste-api
    desc: Dpaste API usage
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: 'dpaste.com/api'
  - id: dpaste-api-go
    desc: Dpaste API usage in Go
    crit: notable
    conf: 0.9
    for: [go]
    if:
      type: string_literal
      substr: dpaste.com/api
