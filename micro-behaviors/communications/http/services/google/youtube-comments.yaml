defaults:
  platforms: [unix, windows]
  for: [binaries, scripts, source]
  crit: notable
  conf: 0.98

traits:
  - id: youtube-comment-threads-endpoint
    desc: YouTube commentThreads API endpoint reference
    if:
      type: text
      regex: 'googleapis\.com/youtube/v3/commentThreads([?/#"''\s]|$)'

  - id: youtube-comment-original-text-field
    desc: References YouTube original comment text field
    if:
      type: text
      exact: '"textOriginal"'
