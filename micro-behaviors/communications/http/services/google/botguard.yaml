# YouTube BotGuard (PO token) endpoints. The youtube.com web player fetches a
# challenge interpreter and exchanges integrity tokens over these WAA/JNN
# endpoints; downloader libraries that generate PO tokens embed the same
# endpoint strings. Endpoint recognition alone establishes no contact and no
# abuse intent — it identifies which Google anti-abuse surface the artifact
# is built to talk to.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json, html]
  crit: notable
  conf: 0.93

traits:
  # The URLs are commonly assembled from template fragments
  # (`${O?"https://www.youtube.com":"https://jnn-pa.googleapis.com"}/...`),
  # so match each protocol marker, not one concatenated literal.
  - id: youtube-jnn-waa-challenge-endpoint
    desc: YouTube BotGuard WAA challenge endpoint
    if:
      type: text
      regex: '(jnn-pa\.googleapis\.com|google\.internal\.waa\.v1\.Waa|youtube\.com/api/jnn/v1)'
