defaults:
  platforms: [windows, unix]
  for: [html, javascript]

traits:
  - id: classroom-product-icon-url
    desc: References a Google Classroom icon URL
    crit: notable
    conf: 0.99
    if:
      type: text
      regex: '(classroom/ic_product_classroom_|s2/favicons\?domain=classroom\.google\.com)'
