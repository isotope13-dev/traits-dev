defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94
  mbc: C0002

traits:
  - id: google-calendar-bearer-api
    desc: Google Calendar API bearer request
    if:
      type: text
      regex: 'googleapis\.com/calendar/v3[\s\S]{0,260}Authorization:\s*`?Bearer'

  - id: google-calendar-events-list-call
    desc: Lists Google Calendar events through a client
    if:
      type: symbol
      kind: call
      regex: '(^|\.)calendar\.events\.list$'

  - id: google-calendar-events-rest-endpoint
    desc: Google Calendar events REST endpoint
    for: [scripts, binaries]
    if:
      type: text
      regex: '(www\.)?googleapis\.com/calendar/v[0-9]+/calendars/[^/?#\s]{1,80}/events\b'

composite_rules:
  - id: google-calendar-events-listing
    desc: Lists events from a Google calendar
    for: [scripts, binaries]
    any:
      - id: google-calendar-events-list-call
      - id: google-calendar-events-rest-endpoint
