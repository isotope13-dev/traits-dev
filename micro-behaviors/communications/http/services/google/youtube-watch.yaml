defaults:
  platforms: [unix, windows]
  for: [javascript, html]
traits:
  - id: youtube-watch-url-reference
    desc: References a YouTube watch URL
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: www.youtube.com/watch

  - id: youtube-embed-url-reference
    desc: References a YouTube embed URL
    crit: notable
    conf: 0.95
    if:
      type: text
      regex: '(?i)(https?:)?//(www\.)?youtube(-nocookie)?\.com/embed/'

  - id: youtube-innertube-api-path
    desc: YouTube InnerTube private API path
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: youtubei/v1/

