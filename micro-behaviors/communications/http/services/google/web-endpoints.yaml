defaults:
  platforms: [unix, windows]
  for: [javascript, html]
  crit: notable
  conf: 0.95

traits:
  - id: google-apis-host-reference
    crit: notable
    desc: Google APIs host reference
    if:
      type: text
      substr: apis.google.com

  - id: google-recaptcha-url-reference
    crit: notable
    desc: Google reCAPTCHA URL reference
    if:
      type: text
      substr: "google.com/recaptcha"

  - id: google-recaptcha-api-script-url
    desc: Google reCAPTCHA API script URL
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: "https://www.google.com/recaptcha/api.js"

