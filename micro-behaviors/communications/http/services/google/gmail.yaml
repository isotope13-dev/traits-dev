# Google Gmail message access mechanics. Individual operations are neutral:
# mail clients, migration tools, and backup products use the same API. The
# objective tier combines enumeration, full-message retrieval, and OAuth use.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.95
  mbc: C0002

traits:
  - id: localhost-google-oauth-callback
    desc: Google OAuth callback on localhost
    if:
      type: text
      regex: 'https?://localhost[:/][^"''\s]{0,80}auth/google'

  # Match the separate origin constant used by session-authenticated workers.
  - id: gmail-webmail-origin
    desc: Gmail webmail origin literal
    for: [javascript, typescript]
    if:
      type: literal
      regex: '^https://mail\.google\.com(/|$)'

  - id: gmail-account-feed-path
    desc: Indexed Gmail unread feed path
    for: [javascript, typescript]
    if:
      type: text
      regex: '/mail/u/[\s\S]{0,400}/feed/atom'
      exclude_comments: true

  - id: gmail-raw-message-view-url
    desc: Gmail raw message view URL
    for: [javascript, typescript]
    if:
      type: text
      # Accept multiline concatenation between message ID and display options.
      regex: '[?&]view=att&th=[\s\S]{0,120}&disp=comp'
      exclude_comments: true

composite_rules:
  - id: gmail-atom-feed-url
    desc: Gmail Atom unread feed URL
    for: [javascript, typescript]
    all:
      - id: gmail-webmail-origin
      - id: gmail-account-feed-path
