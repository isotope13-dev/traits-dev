# Google Gmail message access mechanics. Individual operations are neutral:
# mail clients, migration tools, and backup products use the same API. The
# objective tier combines enumeration, full-message retrieval, and OAuth use.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.95
  mbc: C0002

traits:
  - id: google-gmail-messages-list-call
    desc: Lists Gmail messages through a client API
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.users\.messages\.list$'

  - id: google-gmail-messages-get-call
    desc: Retrieves a Gmail message through a client
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)[A-Za-z_$][A-Za-z0-9_$]*\.users\.messages\.get$'

  - id: google-gmail-messages-rest-collection
    desc: Gmail messages REST collection endpoint
    if:
      type: text
      regex: '(gmail|www)\.googleapis\.com/gmail/v[0-9]+/users/[^/?#\s]{1,80}/messages\b'

  - id: google-gmail-full-format-parameter
    desc: Requests full Gmail message representation
    crit: component
    for: [scripts]
    if:
      type: text
      regex: '(?i)["'']?format["'']?\s*[:=]\s*["'']full["'']'

composite_rules:
  - id: google-gmail-message-listing
    desc: Lists messages in a Gmail mailbox
    any:
      - id: google-gmail-messages-list-call
      - id: google-gmail-messages-rest-collection

  - id: google-gmail-message-retrieval
    desc: Retrieves full Gmail message content
    any:
      - id: google-gmail-messages-get-call
      - id: google-gmail-rest-full-message-request

  - id: google-gmail-rest-full-message-request
    desc: Retrieves full Gmail content through REST
    all:
      - id: google-gmail-messages-rest-collection
      - id: google-gmail-full-format-parameter
    near_bytes: 1200
