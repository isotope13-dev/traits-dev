# Google Gmail message access mechanics. Individual operations are neutral:
# mail clients, migration tools, and backup products use the same API. The
# objective tier combines enumeration, full-message retrieval, and OAuth use.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.95
  mbc: C0002

traits:
  - id: localhost-google-oauth-callback
    desc: Google OAuth callback on localhost
    if:
      type: text
      regex: 'https?://localhost[:/][^"''\s]{0,80}auth/google'

  # Mail notifiers legitimately poll the Atom feed and webmail clients fetch
  # raw messages; either alone is neutral. The objective tier in
  # objectives/collection/email supplies the covert-collection context.
  - id: gmail-atom-feed-url
    desc: Gmail Atom unread feed URL
    for: [javascript, typescript]
    if:
      type: text
      # The account base is often stored once and the feed path appended later.
      regex: 'mail\.google\.com/mail/u/[\s\S]{0,400}/feed/atom'
  - id: gmail-raw-message-view-url
    desc: Gmail raw message view URL
    for: [javascript, typescript]
    if:
      type: text
      # Original-message download form, with or without the host in the literal.
      regex: '(mail\.google\.com/mail/u/[^\n]{1,60}|[?&])view=att&th=[^\n]{0,60}&disp=comp'
