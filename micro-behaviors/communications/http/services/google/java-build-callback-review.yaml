defaults:
  platforms: [unix, windows]
  for: [jar]

traits:
  - id: callback-google-uberproxy
    desc: Google corporate uberproxy URL reference
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: https://uberproxy.corp.google.com/procz
  - id: callback-google-pack
    desc: Google pack status URL reference
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: https://r2---sn-5goenes.c.pack.google.com/statusz
  - id: callback-google-sandbox
    desc: Google sandbox URL reference
    crit: notable
    conf: 0.99
    if:
      type: text
      substr: https://test-scone-pa-googleapis.sandbox.google.com
