# Google Sheets API mechanics.  The service is widely used legitimately; C2
# intent belongs in the deaddrop composites that combine these atoms with a
# command envelope and a read/write loop.
defaults:
  platforms: [unix, windows]
  for: [source, binaries]
  crit: notable
  conf: 0.9
  mbc: C0002
  attack: T1071.001

traits:
  - id: google-sheets-api-endpoint
    desc: Google Sheets API spreadsheet endpoint
    if:
      type: text
      regex: '(?i)(sheets\.googleapis\.com|googleapis\.com)/v[34]/spreadsheets([/:?"''\s]|$)'

  - id: google-sheets-values-read-api
    desc: Google Sheets values read operation
    if:
      type: text
      regex: '(?i)(/values/|spreadsheets\.values\.(get|batchGet)|values:(get|batchGet))'

  - id: google-sheets-values-write-api
    desc: Google Sheets values write operation
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: valueInputOption=

  - id: google-sheets-values-append-api
    desc: Google Sheets values append or update operation
    if:
      type: text
      regex: 'values:(append|update)'

composite_rules:
  - id: google-sheets-api-service
    desc: Google Sheets API service access
    crit: notable
    conf: 0.94
    any:
      - id: google-sheets-api-endpoint
      - id: google-sheets-values-read-api
      - id: google-sheets-values-write-flow

  - id: google-sheets-values-write-flow
    desc: Google Sheets values write flow
    crit: notable
    conf: 0.94
    all:
      - id: google-sheets-api-endpoint
    any:
      - id: google-sheets-values-write-api
      - id: google-sheets-values-append-api
    near_bytes: 1600
