# Google Sheets API mechanics.  The service is widely used legitimately; C2
# intent belongs in the deaddrop composites that combine these atoms with a
# command envelope and a read/write loop.
defaults:
  platforms: [unix, windows]
  for: [source, binaries]
  crit: notable
  conf: 0.9
  mbc: C0002
  attack: T1071.001

traits:
  - id: google-sheets-api-endpoint
    desc: Google Sheets API spreadsheet endpoint
    if:
      type: text
      regex: '(?i)(sheets\.googleapis\.com|googleapis\.com)/v[34]/spreadsheets([/:?"''\s]|$)'

  - id: google-sheets-go-client
    desc: Official Google Sheets v4 Go client reference
    if:
      type: text
      substr: google.golang.org/api/sheets/v4

  - id: google-sheets-values-read-api
    desc: Google Sheets values read operation
    if:
      type: text
      regex: '(?i)(spreadsheets\.values\.(get|batchGet)|values:(get|batchGet))'

  - id: google-sheets-values-get-symbol
    desc: Google Sheets client values read symbol
    for: [pe, elf, macho]
    if:
      type: symbol
      regex: '(?i)(spreadsheets\.values\.(get|batchget)|spreadsheetsvalues(batch)?getcall)'

  - id: google-sheets-values-write-api
    desc: Google Sheets values write operation
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: valueInputOption=

  - id: google-sheets-values-append-api
    desc: Google Sheets values append or update operation
    if:
      type: text
      regex: 'values:(append|update)'

  - id: google-sheets-values-write-call
    desc: Google Sheets client values write call
    for: [go, pe, elf, macho]
    if:
      type: symbol
      regex: '(?i)spreadsheets\.values\.(append|update|batchupdate)'

  - id: google-sheets-values-write-symbol
    desc: Google Sheets compiled values write symbol
    for: [go, pe, elf, macho]
    if:
      type: symbol
      regex: '(?i)spreadsheetsvalues(append|update|batchupdate)call'

composite_rules:
  - id: google-sheets-api-service
    desc: Google Sheets API service access
    crit: notable
    conf: 0.94
    any:
      - id: google-sheets-api-endpoint
      - id: google-sheets-go-client
      - id: google-sheets-values-read-flow
      - id: google-sheets-values-write-flow

  - id: google-sheets-values-read-flow
    desc: Google Sheets values read flow
    crit: notable
    conf: 0.95
    any:
      - id: google-sheets-rest-values-read
      - id: google-sheets-values-read-api
      - id: google-sheets-values-get-symbol

  - id: google-sheets-rest-values-read
    desc: Google Sheets REST values read
    crit: notable
    conf: 0.94
    all:
      - id: google-sheets-api-endpoint
      - id: micro-behaviors/communications/http/url/path::values-path-segment
    near_bytes: 1600

  - id: google-sheets-http-values-write-flow
    desc: Google Sheets REST values write flow
    crit: notable
    conf: 0.94
    all:
      - id: google-sheets-api-endpoint
    any:
      - id: google-sheets-values-write-api
      - id: google-sheets-values-append-api
    near_bytes: 1600

  - id: google-sheets-go-values-write-flow
    desc: Google Sheets Go client values write flow
    crit: notable
    conf: 0.96
    all:
      - id: google-sheets-go-client
      - id: google-sheets-client-values-write
    near_bytes: 4096

  - id: google-sheets-client-values-write
    desc: Google Sheets client values write
    crit: notable
    conf: 0.95
    any:
      - id: google-sheets-values-write-call
      - id: google-sheets-values-write-symbol

  - id: google-sheets-values-write-flow
    desc: Google Sheets values write flow
    crit: notable
    conf: 0.96
    any:
      - id: google-sheets-http-values-write-flow
      - id: google-sheets-go-values-write-flow
