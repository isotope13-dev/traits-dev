# TwiML Gather of a short numeric PIN: the recorded-call channel of
# Activation-Lock phishing kits collects a 4- or 6-digit device passcode.
defaults:
  platforms: [unix, windows]
  for: [xml, php, html]
  attack: T1056.002
  mbc: C0002

traits:
  - id: twilio-gather-short-pin
    desc: TwiML Gather of 4 or 6 digits
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)<Gather\b[^>]{0,80}NumDigits=["''][46]["'']'
