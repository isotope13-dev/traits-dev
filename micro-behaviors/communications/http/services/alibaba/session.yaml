defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: alibaba-imds-token-endpoint
    desc: Alibaba metadata session token URL
    conf: 0.97
    if:
      type: literal
      substr: 100.100.100.200/latest/api/token

  - id: alibaba-imds-session-header
    desc: Alibaba metadata session authentication header
    conf: 0.97
    if:
      type: literal
      exact: X-aliyun-ecs-metadata-token

  - id: alibaba-imds-session-ttl-header
    desc: Alibaba metadata session lifetime header
    conf: 0.97
    if:
      type: literal
      exact: X-aliyun-ecs-metadata-token-ttl-seconds
