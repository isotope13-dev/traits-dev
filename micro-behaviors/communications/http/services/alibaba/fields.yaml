defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: alibaba-imds-hostname
    desc: References Alibaba metadata hostname field
    conf: 0.9
    if:
      type: text
      substr: 100.100.100.200/latest/meta-data/hostname
  - id: alibaba-imds-instance-account-fields
    desc: References Alibaba instance and account metadata
    conf: 0.92
    if:
      type: text
      regex: '100\.100\.100\.200/latest/meta-data/(instance-id|owner-account-id)'
  - id: alibaba-imds-ram-role-list
    desc: References Alibaba instance role metadata
    crit: notable
    conf: 0.95
    attack: T1552.005
    if:
      type: text
      regex: '(100\.100\.100\.200)?/latest/meta-data/ram/security-credentials/?'

  # Clients often build the URL from a host constant plus a path segment and
  # a field name, so the full literal above never appears. Each leg here is
  # ordinary on its own; the composite below needs all three.
  - id: alibaba-imds-meta-data-path-segment
    desc: Alibaba-style meta-data path segment
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: /latest/meta-data/

  - id: alibaba-imds-identity-field-name
    desc: Names an instance identity metadata field
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: "['\"](hostname|instance-id|vpc-id|private-ipv4|region-id)['\"]"

composite_rules:
  - id: alibaba-imds-identity-field-sweep
    desc: Reads Alibaba instance identity fields from IMDS
    crit: notable
    conf: 0.93
    scope: file
    all:
      - id: micro-behaviors/communications/ip/ipv4::alibaba-metadata-service-address
      - id: micro-behaviors/communications/http/services/alibaba::alibaba-imds-meta-data-path-segment
      - id: micro-behaviors/communications/http/services/alibaba::alibaba-imds-identity-field-name
