# Source literals require parsed literal evidence; binary strings use text.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - binaries
  - scripts
  - source
  crit: notable
  conf: 0.9
  size_min: 1
traits:
- id: bsc-publicnode-provider--source
  desc: BSC PublicNode JSON-RPC provider
  conf: 0.82
  for:
  - scripts
  - source
  crit: component
  if:
    type: string_literal
    substr: bsc-rpc.publicnode.com
- id: bsc-publicnode-provider--binary
  desc: BSC PublicNode JSON-RPC provider
  conf: 0.82
  for:
  - binaries
  crit: component
  if:
    type: text
    substr: bsc-rpc.publicnode.com
composite_rules:
- id: bsc-publicnode-provider
  desc: BSC PublicNode JSON-RPC provider
  conf: 0.82
  crit: notable
  any:
  - id: bsc-publicnode-provider--source
  - id: bsc-publicnode-provider--binary
