# Apache Felix OSGi management-console endpoint. The web console at
# /system/console lists, installs and starts bundles and is shipped by Felix
# embedders such as ForgeRock/PingIDM OpenIDM and Adobe AEM. Reaching it is an
# administrative capability, not by itself an attack.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: felix-web-console-route
    desc: Apache Felix OSGi web console path
    if:
      type: text
      regex: '/system/console(/|["'' ?])'
