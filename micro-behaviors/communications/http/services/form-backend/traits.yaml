# Hosted form backends: services that accept a POST to /<form-id> and email
# or store the fields for the form's owner. Static sites use them for
# contact forms; phishing pages use them as a credential drop that needs no
# server of the attacker's own.
defaults:
  platforms: [windows, unix]
  for: [html, javascript, text, php]
  conf: 0.9

traits:
  - id: form-backend-formspree-getform-url
    desc: Formspree, Getform or Basin form endpoint URL
    crit: notable
    if:
      type: text
      regex: 'https?://(www\.)?(formspree\.io|getform\.io|usebasin\.com)/f/[\w@.-]{4,}'

  - id: form-backend-formsubmit-url
    desc: FormSubmit-style form endpoint URL
    crit: notable
    if:
      type: text
      regex: 'https?://(www\.)?(submit-form\.com|formsubmit\.co|form\.taxi/s)/[\w@.-]{4,}'

  - id: form-backend-formcarry-url
    desc: Formcarry-style form endpoint URL
    crit: notable
    if:
      type: text
      regex: 'https?://(www\.)?(formcarry\.com|formbold\.com|ssgform\.com)/s/[\w@.-]{4,}'

  - id: form-backend-web3forms-url
    desc: Web3Forms form endpoint URL
    crit: notable
    if:
      type: text
      regex: 'https?://(www\.)?api\.web3forms\.com/submit/[\w@.-]{4,}'

composite_rules:
  - id: form-backend-endpoint-url
    desc: Hosted form-backend submission endpoint
    crit: notable
    any:
      - id: form-backend-formspree-getform-url
      - id: form-backend-formsubmit-url
      - id: form-backend-formcarry-url
      - id: form-backend-web3forms-url
