defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, typescript]
  crit: notable

traits:
  - id: imds-v2-token-path
    desc: Cloud metadata session token endpoint path
    conf: 0.88
    if:
      type: text
      substr: /latest/api/token

  - id: imds-token-path-codepoint-array
    desc: Compact numeric array spells metadata token path
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      substr: '[47,108,97,116,101,115,116,47,97,112,105,47,116,111,107,101,110]'

  - id: base64-metadata-service-address
    desc: Base64 cloud instance metadata service address
    conf: 0.96
    for: [javascript, typescript]
    if:
      type: encoded
      encoding: base64
      regex: '^(https?://)?(100\.100\.100\.200|169\.254\.169\.254)(/|$)'
