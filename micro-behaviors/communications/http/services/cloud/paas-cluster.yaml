defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: paas-hostname-suffix-cluster
    desc: Heroku Vercel Netlify domain cluster
    conf: 0.95
    size_min: 0
    if:
      type: text
      regex: herokuapp\.com[\s\S]{0,160}vercel\.app[\s\S]{0,160}netlify\.app

composite_rules:
  - id: paas-hostname-suffix-trio
    desc: References Heroku, Vercel and Netlify domains
    crit: notable
    conf: 0.95
    all:
      - id: herokuapp-domain-reference
      - id: micro-behaviors/communications/http/url/domain::vercel-app-suffix-text
      - id: netlify-domain-reference
