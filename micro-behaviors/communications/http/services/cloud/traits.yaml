defaults:
  platforms: [unix, windows]
  for: [scripts, source, javascript, typescript, text, package.json]

traits:
  - id: cloud-instance-metadata-link-local-host
    desc: Cloud instance metadata link-local address
    crit: notable
    conf: 0.88
    for: [scripts, binaries, source, text, data, json]
    if:
      type: text
      substr: '169.254.169.254'

  - id: maton-gateway-endpoint
    desc: References Maton integration gateway
    crit: notable
    conf: 0.98
    for: [markdown, text, python, javascript]
    if:
      type: text
      substr: 'gateway.maton.ai'

  - id: ray-jobs-api
    desc: Ray Jobs API runtime environment reference
    crit: notable
    conf: 0.94
    for: [javascript, typescript, python, go, java, html]
    if:
      type: text
      # Port-adjacent Jobs path, Jobs path with runtime_env, or the job_agent
      # variant used by some Ray deployments (CVE-2025-62593 / related RCE).
      regex: '(:8265|8265).{0,160}/api/jobs|/api/jobs.{0,200}runtime_env|(?i)/api/job_agent/jobs/?'

  - id: ray-jobs-entrypoint
    desc: Ray Jobs API entrypoint field
    crit: notable
    conf: 0.94
    for: [javascript, typescript, python, go, java, html]
    if:
      type: text
      regex: '(?i)/api/(job_agent/)?jobs/?.{0,240}\bentrypoint\b'

  - id: curl-aws-metadata-query
    desc: curl queries an AWS instance metadata path
    crit: notable
    conf: 0.96
    for: [shell, python, javascript, typescript, package.json]
    if:
      # Shell parsers preserve a curl URL as an identifier rather than a
      # string-literal fact.  Text is the common representation across shell,
      # source, and generated command wrappers.
      type: text
      regex: '(?i)\bcurl\b.{0,80}latest/(meta-data|api/token)'
  - id: bytedance-cloudapi-endpoint
    desc: References ByteDance Cloud API endpoint
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: 'https?://cloudapi\.bytedance\.net([/:?#]|$)'
  - id: repeated-public-cloud-provider-name--aws
    desc: Public cloud provider name (AWS)
    crit: component
    conf: 0.4
    if:
      type: text
      word: AWS
  - id: repeated-public-cloud-provider-name--azure
    desc: Public cloud provider name (Azure)
    crit: notable
    conf: 0.4
    if:
      type: text
      word: Azure
  - id: repeated-public-cloud-provider-name--cloudflare
    desc: Public cloud provider name (Cloudflare)
    crit: notable
    conf: 0.4
    if:
      type: text
      word: Cloudflare
  - id: repeated-public-cloud-provider-name--fastly
    desc: Public cloud provider name (Fastly)
    crit: notable
    conf: 0.4
    if:
      type: text
      word: Fastly
  - id: repeated-google-cloud-provider-name
    desc: Repeated Google Cloud provider name
    crit: notable
    conf: 0.82
    count_min: 2
    if:
      type: text
      regex: '\bGoogle Cloud\b'
    unless:
      - id: metadata/binary/installer/script::install4j-unix-sfx
      - id: metadata/file/data-blob::high-byte-script-text

  - id: repeated-gcp-provider-name
    desc: Repeated GCP provider name
    crit: notable
    conf: 0.82
    count_min: 2
    if:
      type: text
      word: GCP

  - id: repeated-cloudfront-provider-name
    desc: Repeated Cloudfront provider name
    crit: notable
    conf: 0.82
    count_min: 2
    if:
      type: text
      word: Cloudfront

  - id: remote-admin-password-change-call
    desc: Remote admin password change API call
    crit: notable
    conf: 0.93
    for: [python, javascript, shell, powershell, go, ruby]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(set|change)[_-]?(admin|device|router|switch|gateway)[_-]?password$'
composite_rules:
  # Provider endpoints and token paths are content references. They support
  # an access capability inference but do not prove a request was sent.
  - id: cloud-metadata-endpoint-reference
    desc: References a cloud metadata endpoint
    crit: notable
    conf: 0.85
    for: [scripts, binaries, package.json, rust]
    any:
      - id: micro-behaviors/communications/http/services/aws::aws-metadata-endpoint
      - id: micro-behaviors/communications/http/services/gcp::gcp-metadata-endpoint
      - id: micro-behaviors/communications/http/services/azure::azure-metadata-endpoint
      - id: micro-behaviors/communications/http/services/azure::azure-managed-identity-token-path
      - id: micro-behaviors/communications/http/services/alibaba::alibaba-metadata-endpoint-reference
      - id: micro-behaviors/communications/http/services/tencent::tencent-metadata-host-endpoint-reference
      - id: micro-behaviors/communications/http/services/tencent::tencent-metadata-ip-endpoint-reference
    unless:
      - id: metadata/package/testing/harness/benchmark::adversarial-benchmark-corpus

  - id: repeated-google-provider-name
    desc: Repeated Google cloud provider name
    crit: notable
    conf: 0.82
    any:
      - id: repeated-google-cloud-provider-name
      - id: repeated-gcp-provider-name

  - id: repeated-public-cloud-provider-name
    desc: Repeated public cloud provider name
    crit: component
    conf: 0.4
    any:
      - id: repeated-public-cloud-provider-name--aws
      - id: repeated-public-cloud-provider-name--azure
      - id: repeated-public-cloud-provider-name--cloudflare
      - id: repeated-public-cloud-provider-name--fastly
    unless:
      - id: well-known/lib/cloud/boto3-stubs::generated-stub-member
      - id: metadata/binary/installer/script::install4j-unix-sfx
      - id: metadata/file/data-blob::high-byte-script-text
