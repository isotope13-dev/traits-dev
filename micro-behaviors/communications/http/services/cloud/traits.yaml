defaults:
  platforms: [unix, windows]
  for: [scripts, source, javascript, typescript, text, package.json]

traits:
  - id: ray-jobs-api
    desc: Ray Jobs API runtime environment reference
    crit: notable
    conf: 0.94
    for: [javascript, typescript, python, go, java, html]
    if:
      type: text
      # Port-adjacent Jobs path, Jobs path with runtime_env, or the job_agent
      # variant used by some Ray deployments (CVE-2025-62593 / related RCE).
      regex: '(:8265|8265).{0,160}/api/jobs|/api/jobs.{0,200}runtime_env|(?i)/api/job_agent/jobs/?'

  - id: ray-jobs-entrypoint
    desc: Ray Jobs API entrypoint field
    crit: notable
    conf: 0.94
    for: [javascript, typescript, python, go, java, html]
    if:
      type: text
      regex: '(?i)/api/(job_agent/)?jobs/?.{0,240}\bentrypoint\b'

  - id: curl-aws-metadata-query
    desc: curl queries an AWS instance metadata path
    crit: notable
    conf: 0.96
    for: [shell, python, javascript, typescript, package.json]
    if:
      # Shell parsers preserve a curl URL as an identifier rather than a
      # string-literal fact.  Text is the common representation across shell,
      # source, and generated command wrappers.
      type: text
      regex: '\bcurl\b.{0,80}latest/meta-data'
  - id: gcp-metadata-endpoint-reference
    desc: Google Cloud metadata endpoint reference
    crit: notable
    conf: 0.9
    for: [scripts, source, javascript, typescript]
    if:
      type: text
      regex: '(?i)(http://|https://)metadata\.google\.internal([/:?#]|$)'
  - id: gcp-metadata-endpoint
    desc: GCP metadata endpoint string in native binary
    crit: component
    conf: 0.85
    for: [elf, c, cpp, rust, go]
    if:
      type: text
      substr: metadata.google.internal
      section: .rodata
  # Node code that queries the GCE/GKE instance metadata server through the
  # official `gcp-metadata` client never spells out metadata.google.internal or
  # 169.254.169.254, so the endpoint traits above miss it entirely. Cloud
  # credential-harvesting code prefers the SDK for exactly that reason.
  - id: gcp-metadata-client-import
    desc: Imports the gcp-metadata client library
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: import
      exact: gcp-metadata
  - id: gcp-metadata-client-query-call
    desc: Queries GCP instance metadata via SDK client
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(?i)gcp_?metadata\.(instance|project|universe)$'
  - id: gcp-metadata-flavor-header
    desc: Sends the GCP Metadata-Flavor request header
    crit: notable
    conf: 0.9
    for: [scripts, source, javascript, typescript]
    if:
      type: text
      substr: Metadata-Flavor
  - id: bytedance-cloudapi-endpoint
    desc: References ByteDance Cloud API endpoint
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: 'https?://cloudapi\.bytedance\.net([/:?#]|$)'
  - id: repeated-public-cloud-provider-name--aws
    desc: Public cloud provider name (AWS)
    crit: component
    conf: 0.4
    if:
      type: text
      word: AWS
  - id: repeated-public-cloud-provider-name--azure
    desc: Public cloud provider name (Azure)
    crit: component
    conf: 0.4
    if:
      type: text
      word: Azure
  - id: repeated-public-cloud-provider-name--cloudflare
    desc: Public cloud provider name (Cloudflare)
    crit: component
    conf: 0.4
    if:
      type: text
      word: Cloudflare
  - id: repeated-public-cloud-provider-name--fastly
    desc: Public cloud provider name (Fastly)
    crit: component
    conf: 0.4
    if:
      type: text
      word: Fastly
  - id: repeated-google-cloud-provider-name
    desc: Repeated Google Cloud provider name
    crit: component
    conf: 0.82
    if:
      type: text
      regex: '\b(Google Cloud|GCP|Cloudfront)\b'
    unless:
      - id: metadata/binary/installer/script::install4j-unix-sfx
      - id: metadata/file/metrics::high-byte-script-text

  - id: remote-admin-password-change-call
    desc: Remote admin password change API call
    crit: notable
    conf: 0.93
    for: [python, javascript, shell, powershell, go, ruby]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(set|change)[_-]?(admin|device|router|switch|gateway)[_-]?password$'
composite_rules:
  - id: repeated-public-cloud-provider-name
    desc: Repeated public cloud provider name
    crit: component
    conf: 0.4
    any:
      - id: repeated-public-cloud-provider-name--aws
      - id: repeated-public-cloud-provider-name--azure
      - id: repeated-public-cloud-provider-name--cloudflare
      - id: repeated-public-cloud-provider-name--fastly
    unless:
      - id: well-known/lib/cloud/boto3-stubs::generated-stub-member
      - id: metadata/binary/installer/script::install4j-unix-sfx
      - id: metadata/file/metrics::high-byte-script-text
