traits:
- platforms:
  - unix
  - windows
  for:
  - python
  id: cloud-metadata-host-reference
  desc: Cloud metadata endpoint hostname reference
  crit: notable
  conf: 0.9
  unless:
  - id: well-known/lib/cloud/botocore::aws-python-sdk-source
  - id: well-known/lib/cloud/awscli::awscli-wheel-context
  - id: metadata/package/testing/
  if:
    type: literal
    regex: 169\.254\.169\.254|metadata\.google\.internal
