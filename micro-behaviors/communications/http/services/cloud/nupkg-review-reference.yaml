defaults:
  platforms: [windows, unix]
  for: [go, python, javascript, java, class, jar, pe, elf]
composite_rules:
  - id: cloud-metadata-or-credential-path-reference
    desc: Cloud metadata endpoint or credential path reference
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/services/aws::aws-metadata-endpoint
      - id: micro-behaviors/os/security/auth/cloud::gcp-metadata-credential-reference
      - id: micro-behaviors/communications/http/services/gcp::gcp-default-service-account-email-path
      - id: micro-behaviors/communications/http/services/azure::azure-metadata-endpoint
    unless:
      - id: well-known/tool/detection/innerwarden::innerwarden-defensive-tool-context
      - id: well-known/lib/network/grpc-ruby::grpc-ruby-c-extension-artifact
