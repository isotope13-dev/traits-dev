# Neutral endpoint references shared by legitimate SDKs and collectors.
# A service-account path need not request a token; an IP alone is not an
# endpoint path. Neither finding establishes exploitation or credential theft.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, xml, html]
  crit: notable
  conf: 0.94

traits:
  - id: cloud-identity-endpoint-path
    desc: Cloud metadata identity endpoint path
    if:
      type: text
      exclude_html_comments: true
      regex: '(/metadata/identity/oauth2/token|/computeMetadata/v1/instance/service-accounts/)'

composite_rules:
  - id: cloud-metadata-service-reference
    desc: Cloud metadata service reference
    any:
      - id: micro-behaviors/communications/http/services/aws::ec2-imds-iam-credentials-endpoint
      - id: micro-behaviors/communications/http/services/aws::iam-credentials-path-reference
      - id: micro-behaviors/communications/ip/ipv4::metadata-service-link-local-address
      - id: cloud-identity-endpoint-path

