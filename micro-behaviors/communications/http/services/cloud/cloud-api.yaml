defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: notable
  conf: 0.8
traits:
- id: aws-api-endpoint
  desc: References an AWS API endpoint
  if:
    type: string_literal
    substr: amazonaws.com
- id: facebook-graph-api
  desc: Facebook Graph API endpoint
  if:
    type: string_literal
    substr: graph.facebook.com
- id: cloud-account-management-api-path
  desc: Cloud account management API path
  conf: 0.82
  if:
    type: text
    substr: /admin/management/cloud_accounts
- id: aws-api-gateway
  desc: AWS API Gateway endpoint
  conf: 0.5
  if:
    type: text
    regex: execute-api\.[a-z0-9-]+\.amazonaws\.com
- id: azure-websites
  desc: Azure Websites endpoint
  conf: 0.5
  if:
    type: text
    regex: '[a-z0-9-]+\.azurewebsites\.net'
- id: google-cloud-functions
  desc: Google Cloud Functions endpoint
  conf: 0.5
  if:
    type: text
    regex: '[a-z0-9-]+\.cloudfunctions\.net'
- id: vercel-app
  desc: References a Vercel-hosted domain
  conf: 0.5
  for:
  - scripts
  - binaries
  - html
  - php
  if:
    type: text
    regex: (?i)(^|[^a-z0-9_.-])[a-z0-9-]+\.vercel\.app([/:?#\s"'<>)]|$)
- id: railway-app
  desc: References a Railway-hosted domain
  conf: 0.75
  if:
    type: text
    regex: '[a-z0-9-]+\.railway\.app'
- id: replit-dev
  desc: Replit.dev endpoint
  conf: 0.6
  if:
    type: text
    regex: ([a-z0-9-]{1,63}\.){1,6}replit\.dev
- id: repl-co
  desc: Repl.co endpoint
  conf: 0.6
  if:
    type: text
    regex: 'https?://([a-z0-9-]{1,63}\.){1,6}repl\.co([/?#: ]|$)'
- id: netlify-app
  desc: Netlify app endpoint
  conf: 0.5
  for:
  - scripts
  - binaries
  - html
  - php
  if:
    type: text
    regex: '[a-z0-9-]+\.netlify\.app'
- id: netlify-api-endpoint
  desc: Netlify management API endpoint
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: literal
    regex: ^https://api\.netlify\.com/api/v\d(/|$)
- id: github-pages
  desc: References a GitHub Pages host
  conf: 0.5
  if:
    type: string_literal
    substr: .github.io
- id: aliyun-oss-object-url
  desc: Alibaba OSS object URL
  conf: 0.5
  for:
  - scripts
  - html
  if:
    type: text
    regex: (?i)https?://[A-Za-z0-9._-]+\.oss-[A-Za-z0-9-]+\.aliyuncs\.com/[A-Za-z0-9._~/-]+
- id: tencent-cloud-scf-endpoint
  desc: References Tencent Cloud SCF endpoint
  conf: 0.7
  for:
  - scripts
  if:
    type: text
    regex: https://[a-z0-9-]+\.ap-[a-z0-9-]+\.tencentscf\.com
- id: vercel-download-command
  desc: curl/wget fetches from a vercel.app host
  conf: 0.88
  for:
  - shell
  - batch
  - powershell
  - text
  if:
    type: text
    regex: \b(curl|wget)\b[^\n]{1,220}vercel\.app
  not:
  - substr: fnm.vercel.app
  - substr: install-node.vercel.app
  - substr: create-awesome-vlang-app.vercel.app
composite_rules:
- id: managed-cloud-host
  desc: References a managed cloud hosting domain
  conf: 0.7
  any:
  - id: aws-api-gateway
  - id: azure-websites
  - id: google-cloud-functions
  - id: vercel-app
  - id: netlify-app
  - id: tencent-cloud-scf-endpoint
  - id: replit-dev
  - id: repl-co
