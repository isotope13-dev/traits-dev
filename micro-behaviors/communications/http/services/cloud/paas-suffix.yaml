defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, javascript, python, ruby, php]
  crit: notable
  conf: 0.9
  size_min: 16384

traits:
  - id: herokuapp-domain-reference
    desc: References the herokuapp.com domain
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: herokuapp.com

  - id: netlify-domain-reference
    desc: References the netlify.app domain
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: netlify.app

