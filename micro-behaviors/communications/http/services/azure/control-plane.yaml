# Azure control-plane operations as neutral capabilities. Abuse of a VM Run
# Command surface is inferred only when it is paired with root shell code and
# a Kubernetes-node context or cloud credential pillaging under objectives/.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, json]
  crit: notable
  conf: 0.94

traits:
  - id: azure-vm-run-command-call
    desc: Azure VM Run Command SDK call
    for: [python, javascript, typescript, go, java, csharp, php]
    if:
      type: symbol
      kind: call
      regex: '(?i)(virtual[_-]?machines|run[_-]?commands)\.(begin[_-]?)?run[_-]?command'

  - id: azure-vm-run-command-rest-path
    desc: Azure VM Run Command provider path
    for: [scripts, source, binaries]
    if:
      type: text
      exclude_comments: true
      regex: '(?i)Microsoft\.Compute/virtualMachines/[^"''\s]{1,160}/runCommand\b'

  - id: azure-vm-run-command-query-path
    desc: Azure VM runCommand API query path
    for: [scripts, source, binaries]
    if:
      type: text
      exclude_comments: true
      regex: '(?i)/runCommand\?api-version=20[0-9]{2}-'

  - id: azure-vm-run-command-script-id
    desc: Azure VM Run Command shell script commandId
    for: [scripts, source, binaries, json, -elf, -macho, -pe]
    if:
      type: text
      exclude_comments: true
      regex: '([''":=\s]|^)(RunShellScript|RunPowerShellScript)\b'

  - id: azure-vm-run-command-script-id-binary
    desc: Raw Azure Run Command script ID
    for: [elf, macho, pe]
    size_max: 50000000
    if:
      type: raw
      regex: '([''":=\s]|^)(RunShellScript|RunPowerShellScript)\b'

  - id: azure-vm-run-command-event
    desc: Azure VM Run Command audit action
    for: [json]
    if:
      type: text
      regex: '(?i)"action"\s*:\s*"Microsoft\.Compute/virtualMachines/runCommand/action"'

composite_rules:
  - id: azure-vm-run-command-operation
    desc: Azure VM Run Command operation
    crit: notable
    any:
      - id: azure-vm-run-command-call
      - id: azure-vm-run-command-rest-path
      - id: azure-vm-run-command-query-path
      - id: azure-vm-run-command-event

  - id: azure-vm-run-command-script-selector
    desc: Azure VM Run Command shell or PowerShell script selector
    crit: notable
    any:
      - id: azure-vm-run-command-script-id
      - id: azure-vm-run-command-script-id-binary
