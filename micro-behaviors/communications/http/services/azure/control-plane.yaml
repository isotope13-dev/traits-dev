# Azure control-plane operations as neutral capabilities. Abuse of a VM Run
# Command surface is inferred only when it is paired with root shell code and
# a Kubernetes-node context under objectives/.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  crit: notable
  conf: 0.94

traits:
  - id: azure-vm-run-command-call
    desc: Azure VM Run Command SDK call
    for: [python, javascript, typescript, go, java, csharp, php]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(begin[_-])?run[_-]?command$'

  - id: azure-vm-run-command-event
    desc: Azure VM Run Command audit action
    for: [json]
    if:
      type: text
      regex: '(?i)"action"\s*:\s*"Microsoft\.Compute/virtualMachines/runCommand/action"'

  # A provider/platform word alone is not node targeting. Require an explicit
  # node, VM, instance, or host term on the same line so generic tool-name
  # inventories such as `"kubernetes"` do not match this Azure context.
  - id: azure-kubernetes-provider-near-node
    desc: AKS token near Kubernetes node target
    crit: component
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\b(aks|kubernetes|kubelet)\b[^\r\n]{0,120}\b(node|vm|instance|host)\b'

  - id: azure-kubernetes-node-near-provider
    desc: Kubernetes node target near AKS token
    crit: component
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)\b(node|vm|instance|host)\b[^\r\n]{0,120}\b(aks|kubernetes|kubelet)\b'

  - id: azure-kubernetes-node-context-event
    desc: Azure Kubernetes node event context
    for: [json]
    if:
      type: text
      regex: '(?i)"(resource|target|vmName)"\s*:\s*".{0,120}(aks|kubernetes|kubelet).{0,120}"'

composite_rules:
  - id: azure-kubernetes-node-context
    desc: References an AKS or Kubernetes node target
    crit: notable
    any:
      - id: azure-kubernetes-provider-near-node
      - id: azure-kubernetes-node-near-provider

  - id: azure-vm-run-command-operation
    desc: Azure VM Run Command operation
    crit: notable
    any:
      - id: azure-vm-run-command-call
      - id: azure-vm-run-command-event

  - id: azure-kubernetes-node-target
    desc: Azure Kubernetes node target
    crit: notable
    any:
      - id: azure-kubernetes-node-context
      - id: azure-kubernetes-node-context-event
