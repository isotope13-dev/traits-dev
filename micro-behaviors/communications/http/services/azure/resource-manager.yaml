# Neutral Azure Resource Manager (ARM) host, OAuth scope, discovery routes, and
# credential-returning management operations across REST and SDK callers.
# Malicious multi-service credential pillaging is inferred under objectives/.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.92

traits:
  - id: arm-management-host
    desc: Azure Resource Manager API host reference
    conf: 0.9
    if:
      type: text
      exclude_comments: true
      substr: management.azure.com

  - id: arm-default-token-scope
    desc: Azure Resource Manager default OAuth scope
    conf: 0.94
    if:
      type: text
      exclude_comments: true
      substr: https://management.azure.com/.default

  - id: arm-subscriptions-path
    desc: Azure subscription enumeration endpoint path
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(management\.azure\.com/subscriptions\b|/subscriptions\?api-version=20[0-9]{2}-)'

  - id: arm-role-assignments-path
    desc: Azure RBAC role-assignments API path
    if:
      type: text
      exclude_comments: true
      regex: '(?i)Microsoft\.Authorization/roleAssignments\b'

  - id: arm-sql-servers-provider
    desc: Azure SQL servers resource provider
    if:
      type: text
      exclude_comments: true
      case_insensitive: true
      substr: microsoft.sql/servers

  - id: firewall-rules-subresource-path
    desc: firewallRules REST subresource segment
    crit: component
    conf: 0.7
    if:
      type: text
      exclude_comments: true
      regex: '(?i)/firewallRules(["''`?\s/]|$)'

  - id: arm-sql-firewall-rules-query-path
    desc: Azure SQL firewallRules API query path
    if:
      type: text
      exclude_comments: true
      regex: '(?i)/firewallRules\?api-version=20[0-9]{2}-'

  - id: arm-cognitive-deployments-path
    desc: Azure Cognitive Services deployments API path
    if:
      type: text
      exclude_comments: true
      regex: '(?i)Microsoft\.CognitiveServices/accounts/.{1,120}/deployments\b'

  - id: arm-deployments-query-path
    desc: Azure ARM deployments API query path
    if:
      type: text
      exclude_comments: true
      regex: '(?i)/deployments\?api-version=20[0-9]{2}-'

  - id: arm-list-keys-operation
    desc: Azure ARM resource listKeys operation
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(/listKeys\?api-version=20[0-9]{2}-|\bstorage_?accounts\.list_?keys\b)'

  - id: arm-webapp-secrets-list-path
    desc: Azure App Service secret-list API path
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '(?i)/config/(appsettings|connectionstrings|publishingcredentials)/list\b'

  - id: arm-webapp-config-list-method
    desc: Azure Web App settings list method
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\blist_?(application_?settings|connection_?strings)\b'

  - id: arm-webapp-publishing-list-method
    desc: Azure Web App publishing-creds method
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\blist_?publishing_?credentials\b'

  - id: arm-aks-cluster-credential-path
    desc: Azure AKS cluster credential API path
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '(?i)/listCluster(User|Admin)Credentials?\b'

  - id: arm-aks-cluster-credentials-method
    desc: Azure AKS cluster credentials method
    conf: 0.96
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\blist_?cluster_?(user|admin)_?credentials\b'

  - id: arm-ml-datastore-secrets-operation
    desc: Azure ML datastore listSecrets operation
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(/listSecrets\?api-version=20[0-9]{2}-|\bdatastores\.list_?secrets\b)'

  - id: binary-oauth-client-credentials-token
    desc: OAuth client_credentials grant token in binary
    for: [binaries]
    conf: 0.85
    if:
      type: text
      word: client_credentials

composite_rules:
  - id: arm-sql-firewall-rules-path
    desc: Azure SQL server firewall-rules API path
    all:
      - id: arm-sql-servers-provider
      - id: firewall-rules-subresource-path
    near_bytes: 512

  - id: arm-webapp-secrets-list-operation
    desc: Azure App Service secret or publishing-credential list operation
    conf: 0.96
    any:
      - id: arm-webapp-secrets-list-path
      - id: arm-webapp-config-list-method
      - id: arm-webapp-publishing-list-method

  - id: arm-aks-cluster-credentials-operation
    desc: Azure AKS cluster credential-listing operation
    conf: 0.96
    any:
      - id: arm-aks-cluster-credential-path
      - id: arm-aks-cluster-credentials-method

  - id: microsoft-service-principal-token-request
    desc: Microsoft Entra OAuth client_credentials token request
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/oauth::microsoft-oauth-token-endpoint
    any:
      - id: micro-behaviors/communications/http/oauth::oauth-client-credentials-grant-type
      - id: binary-oauth-client-credentials-token

  - id: arm-authenticated-client
    desc: Authenticated Azure Resource Manager client
    conf: 0.93
    all:
      - id: arm-management-host
    any:
      - id: micro-behaviors/communications/http/authorization-header::bearer-prefix
      - id: micro-behaviors/communications/http/oauth::microsoft-oauth-token-endpoint
