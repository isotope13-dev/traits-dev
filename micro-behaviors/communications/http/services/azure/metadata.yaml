defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable

traits:
  - id: azure-metadata-endpoint
    desc: Azure IMDS endpoint
    conf: 0.85
    if:
      type: text
      substr: 169.254.169.254/metadata/instance
    downgrade:
      any:
        - id: well-known/lib/runtime/managed/dotnet-identity::msal-namespace
        - id: well-known/lib/runtime/managed/dotnet-identity::azure-identity-namespace

  - id: azure-imds-instance-path
    desc: Azure IMDS instance metadata path
    conf: 0.88
    if:
      type: text
      substr: /metadata/instance
    downgrade:
      any:
        - id: well-known/lib/runtime/managed/dotnet-identity::msal-namespace
        - id: well-known/lib/runtime/managed/dotnet-identity::azure-identity-namespace

  - id: azure-managed-identity-token-path
    desc: Azure managed identity token endpoint
    conf: 0.9
    if:
      type: text
      substr: /metadata/identity/oauth2/token
    downgrade:
      any:
        - id: well-known/lib/runtime/managed/dotnet-identity::msal-namespace
        - id: well-known/lib/runtime/managed/dotnet-identity::azure-identity-namespace
