defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.96
traits:
  - id: python-ado-oidc-request
    desc: Builds Azure DevOps OIDC request URL
    if:
      type: symbol
      kind: call
      regex: '^(urllib\.request\.Request|(requests|httpx)\.post)$'
      arg:
        index: 0
        from:
          call: '^(os\.)?(getenv|environ\.get)$'
          argument: 0
          literal: '^SYSTEM_OIDCREQUESTURI$'
  - id: python-managed-identity-request
    desc: Builds Azure managed identity request
    if:
      type: symbol
      kind: call
      regex: '^(urllib\.request\.(Request|urlopen)|(requests|httpx)\.get)$'
      arg:
        index: 0
        from:
          value: '/metadata/identity/oauth2/token'
  # App Service supplies a local endpoint through the environment. Requiring
  # provenance on the request URL avoids treating a nearby variable name as
  # an identity request, and does not require an unused IMDS fallback string.
  - id: python-app-service-identity-request
    desc: Builds App Service identity request
    if:
      type: symbol
      kind: call
      regex: '^(urllib\.request\.(Request|urlopen)|(requests|httpx)\.get)$'
      arg:
        index: 0
        from:
          call: '^(os\.)?(getenv|environ\.get)$'
          argument: 0
          literal: '^(IDENTITY_ENDPOINT|MSI_ENDPOINT)$'
