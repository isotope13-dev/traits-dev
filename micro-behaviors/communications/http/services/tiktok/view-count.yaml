defaults:
  platforms: [windows, unix]
  for: [python, scripts, source]
  crit: suspicious
  conf: 0.91
  attack: T1491

traits:
  - id: tiktok-mobile-view-stats-path
    desc: TikTok mobile view stats endpoint
    if:
      type: text
      substr: /aweme/v1/aweme/stats/

  - id: tiktok-view-play-delta-body
    desc: Builds a TikTok play-count increment body
    if:
      type: text
      regex: 'item_id=.{0,64}&play_delta=1'

