# Source literals require parsed literal evidence; binary strings use text.
---
defaults:
  platforms:
  - linux
  - macos
  - windows
  for:
  - binaries
  - scripts
  - source
  crit: notable
  conf: 0.82
  size_min: 1
traits:
- id: aptos-fullnode-provider--source
  desc: Aptos fullnode mainnet endpoint
  crit: component
  if:
    type: string_literal
    substr: fullnode.mainnet.aptoslabs.com
  for:
  - scripts
  - source
- id: aptos-fullnode-provider--binary
  desc: Aptos fullnode mainnet endpoint
  crit: component
  if:
    type: text
    substr: fullnode.mainnet.aptoslabs.com
  for:
  - binaries
composite_rules:
- id: aptos-fullnode-provider
  desc: Aptos fullnode mainnet endpoint
  crit: notable
  any:
  - id: aptos-fullnode-provider--source
  - id: aptos-fullnode-provider--binary
