# First-party Anthropic OAuth API endpoints. These identify the destination of
# a network request; composites decide whether the surrounding token handling
# is ordinary authentication or credential transfer to an unrelated service.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.99

traits:
  - id: oauth-token-endpoint
    desc: Anthropic OAuth token endpoint
    if:
      type: string_literal
      exact: https://console.anthropic.com/v1/oauth/token

  # Claude Code moved its OAuth issuer from console.anthropic.com to
  # platform.claude.com; both are Anthropic first-party token endpoints, and
  # tooling that refreshes the local Claude Code credential POSTs its
  # refresh_token grant here.
  - id: claude-platform-oauth-token-endpoint
    desc: Claude platform.claude.com OAuth token endpoint
    if:
      type: string_literal
      exact: https://platform.claude.com/v1/oauth/token

  - id: oauth-usage-endpoint
    desc: Anthropic OAuth usage endpoint
    if:
      type: string_literal
      exact: https://api.anthropic.com/api/oauth/usage
  # Local `which claude` plus the Messages API is the CLI-then-API fallback.
  # It is not a fetched program. The lookup lives here because it only
  # exists to pair with that endpoint.
  - id: claude-which-lookup
    desc: Shell lookup of the claude executable
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bwhich\s+claude\b'
composite_rules:
  - id: claude-cli-which-with-messages-api
    desc: Resolves the claude CLI and calls the Messages API
    for: [javascript, typescript]
    all:
      - id: claude-which-lookup
      - id: micro-behaviors/communications/http/llm-proxy::llm-provider-anthropic-messages-endpoint
