# An installer endpoint reference does not identify the containing program.
defaults:
  platforms: [unix, windows]
  crit: notable
traits:
- id: claude-official-installer-url
  desc: References official Claude Code installer URL
  crit: notable
  conf: 0.99
  for: [javascript, typescript, html, markdown, shell, powershell, batch]
  if:
    type: text
    regex: 'https://claude\.ai/install\.(sh|ps1|cmd)\b'
- id: claude-bootstrap-endpoint-reference
  desc: References Claude Code bootstrap endpoint
  crit: notable
  conf: 0.95
  for: [scripts, markdown, text, html, javascript, typescript, shell, powershell]
  if:
    type: text
    regex: 'claude\.ai/install\.(sh|ps1)\b'
