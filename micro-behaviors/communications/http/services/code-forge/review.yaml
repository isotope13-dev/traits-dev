# Source code that embeds a directive to publish a prepared pull-request body.
# This is a neutral code-forge communication action; exfiltration objectives
# add the sensitivity of the content being placed in that public review field.
defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, typescript, ruby, go, rust, powershell]
  crit: notable
  conf: 0.94

traits:
  - id: agent-authored-contribution-context
    desc: Names agent-authored contribution
    if:
      type: string_literal
      regex: '(?i)\b(if|when) an? (AI )?(agent|assistant) (opened|created|submitted) (this|it)\b'

  - id: pull-request-body-publication-directive
    desc: Directs pull-request body publication
    if:
      type: string_literal
      regex: '(?i)(\bopen\b.{0,32}\buse\b|\b(submit|publish)\b).{0,48}\b(PR|pull request) body\b'
