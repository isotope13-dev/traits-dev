# Cross-forge public or enterprise code-search API endpoints.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.94

composite_rules:
  - id: code-forge-code-search-endpoint
    desc: GitHub or Azure DevOps code search API endpoint
    any:
      - id: micro-behaviors/communications/http/services/github/security::github-code-search-endpoint
      - id: micro-behaviors/communications/http/services/devops-azure::code-search-api-endpoint
