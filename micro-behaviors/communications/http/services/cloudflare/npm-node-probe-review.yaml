defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

composite_rules:
  - id: trycloudflare-near-fetch-post
    desc: Cloudflare tunnel domain near HTTP POST
    crit: notable
    conf: 0.94
    near_bytes: 2048
    all:
      - id: well-known/dual-use/tunnel/cloudflared::trycloudflare-domain
      - id: micro-behaviors/communications/http/post::fetch-post-call
