defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.94

traits:
  - id: trace-endpoint
    desc: Cloudflare client trace endpoint
    if:
      type: string_literal
      exact: https://cloudflare.com/cdn-cgi/trace
  - id: cloudflare-api-host
    desc: Cloudflare API host reference
    conf: 0.86
    for: [javascript, typescript, python, shell, ruby]
    if:
      type: text
      substr: api.cloudflare.com
  # The zone-scoped TXT query path, as a PE-embedded URL template. Lookup of
  # TXT records is a DNS-management read; the dead-drop claim needs a fetch.
  - id: cloudflare-dns-txt-records
    desc: Queries Cloudflare DNS TXT records via API
    crit: notable
    conf: 0.9
    for: [pe, dll]
    platforms: [windows]
    if:
      type: text
      substr: 'dns_records?type=TXT'
