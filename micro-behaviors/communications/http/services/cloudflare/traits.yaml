defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.94

traits:
  - id: trace-endpoint
    desc: Cloudflare client trace endpoint
    if:
      type: string_literal
      exact: https://cloudflare.com/cdn-cgi/trace
  - id: cloudflare-api-host
    desc: Cloudflare API host reference
    conf: 0.86
    for: [javascript, typescript, python, shell, ruby]
    if:
      type: text
      substr: api.cloudflare.com
