defaults:
  platforms: [unix, windows]
  for: [javascript, typescript, html, php]
  crit: notable
  conf: 0.95

traits:
  - id: turnstile-integration-url
    desc: Cloudflare Turnstile integration URL
    if:
      type: text
      substr: cloudflare.com/products/turnstile
  - id: turnstile-challenge-api-script
    desc: Cloudflare Turnstile challenge API script URL
    if:
      type: text
      substr: challenges.cloudflare.com/turnstile
  - id: cloudflare-challenge-platform-url-pattern
    desc: Cloudflare challenge-platform reference
    if:
      type: text
      regex: 'cloudflare.{0,120}challenge-platform'
