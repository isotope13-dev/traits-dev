defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.86

traits:
  - id: r2-put-reference
    desc: PUT terminology near R2 configuration
    if:
      type: text
      regex: '\b(PUT|putObject)\b.{0,180}(r2\.cloudflarestorage\.com|R2_ACCESS_KEY|CLOUDFLARE_R2)'
  - id: r2-upload-method-reference
    desc: Upload terminology near R2 configuration
    if:
      type: text
      regex: '\b(PutObject|Upload)\b.{0,180}(r2\.cloudflarestorage\.com|R2_ACCESS_KEY|CLOUDFLARE_R2)'

composite_rules:
  - id: r2-upload-reference
    desc: R2 endpoint and upload references
    conf: 0.92
    all:
      - id: well-known/app/storage/cloudflare-r2::cloudflare-r2-url
    any:
      - id: r2-put-reference
      - id: r2-upload-method-reference
