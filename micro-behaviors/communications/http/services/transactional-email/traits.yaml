# Hosted transactional-email send endpoints. An application that holds its own
# provider API key and POSTs a message to the provider is ordinary mail
# delivery; the key never leaves for a third party.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: provider-send-endpoint
    desc: Resend or SendGrid email send API endpoint
    if:
      type: text
      regex: 'https://api\.(resend\.com/emails|sendgrid\.com/v3/mail/send)'
