# ForgeRock / PingIDM OpenIDM REST surface. These routes and the inline-script
# object are stable OpenIDM primitives: the scripting service runs arbitrary
# Groovy/JavaScript, the scheduler invokes it on a timer, and managed/user is
# the account store. The paths and object shape survive host, port and TLS
# changes, so they identify the platform independent of any one deployment.
# Each atom is a neutral administrative capability; abuse is inferred elsewhere.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.9

traits:
  - id: openidm-script-route
    desc: OpenIDM scripting service route
    if:
      type: text
      substr: /openidm/script

  - id: openidm-scheduler-route
    desc: OpenIDM scheduler service route
    if:
      type: text
      substr: /openidm/scheduler

  - id: openidm-managed-user-route
    desc: OpenIDM managed-user object route
    if:
      type: text
      substr: /openidm/managed/user

  - id: openidm-inline-script-object
    desc: OpenIDM inline Groovy/JS script object
    if:
      type: text
      regex: '"type"\s*:\s*"(groovy|text/javascript)"[\s\S]{0,160}"source"'

  - id: openidm-managed-user-password-patch
    desc: OpenIDM patch replaces account password
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '"(replace|add)"[\s\S]{0,80}"/password"'

  - id: openidm-managed-user-mail-patch
    desc: OpenIDM patch replaces account email
    crit: component
    conf: 0.9
    if:
      type: text
      regex: '"(replace|add)"[\s\S]{0,80}"/(mail|email)"'

composite_rules:
  - id: openidm-managed-user-credential-overwrite
    desc: Overwrites an OpenIDM account email and password
    crit: notable
    conf: 0.95
    near_bytes: 600
    all:
      - id: openidm-managed-user-route
      - id: openidm-managed-user-password-patch
      - id: openidm-managed-user-mail-patch
