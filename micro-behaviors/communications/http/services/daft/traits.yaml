# Daft's distributed query engine dashboard broadcasts query telemetry to a
# local or configured dashboard service with bearer token authentication.
# These neutral client observations distinguish intended dashboard telemetry
# from environment credential exfiltration composites.
defaults:
  platforms: [linux, macos, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: daft-dashboard-env-config
    desc: Daft dashboard environment configuration
    if:
      type: text
      regex: '\bDAFT_DASHBOARD_(URL|AUTH_TOKEN|ENV_ENABLED|RUN_ID|QUERIES_URL)\b'

  - id: daft-dashboard-authenticated-broadcast
    desc: Daft auth token near Authorization
    if:
      type: text
      regex: '(?is)DAFT_DASHBOARD_AUTH_TOKEN[\s\S]{0,240}Authorization'

composite_rules:
  - id: daft-dashboard-authenticated-request
    desc: Daft dashboard authenticated query broadcast request
    crit: exception
    conf: 0.95
    all:
      - id: daft-dashboard-authenticated-broadcast
      - id: micro-behaviors/communications/http/request/json::urllib-json-request-body
