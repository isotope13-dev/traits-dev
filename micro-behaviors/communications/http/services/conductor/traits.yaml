# Conductor's workflow-definition and workflow-start routes. These identify
# which service an HTTP client addresses; exploit intent comes from the
# malicious evaluator expression paired with both operations.
defaults:
  platforms: [windows, unix]
  for: [json, python, javascript, typescript, java, go, ruby]
  crit: notable
  conf: 0.98
  attack: T1071.001

traits:
  - id: workflow-registration-api
    desc: Conductor workflow registration API path
    if:
      type: text
      substr: /api/metadata/workflow

  - id: workflow-start-api
    desc: Conductor workflow start API path
    if:
      type: text
      substr: /api/workflow/
