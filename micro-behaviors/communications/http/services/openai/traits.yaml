defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.96

traits:
  - id: authentication-host
    desc: OpenAI authentication service host
    if:
      type: string_literal
      substr: 'https://auth.openai.com/'

  - id: sentinel-request-endpoint
    desc: OpenAI Sentinel anti-abuse request endpoint
    if:
      type: string_literal
      exact: https://sentinel.openai.com/backend-api/sentinel/req

  - id: passwordless-otp-endpoint
    desc: OpenAI passwordless sign-in OTP endpoint
    if:
      type: string_literal
      exact: https://auth.openai.com/api/accounts/passwordless/send-otp

  - id: email-otp-validation-endpoint
    desc: OpenAI email OTP validation endpoint
    if:
      type: string_literal
      exact: https://auth.openai.com/api/accounts/email-otp/validate

  - id: email-otp-send-endpoint
    desc: OpenAI email OTP delivery endpoint
    if:
      type: string_literal
      exact: https://auth.openai.com/api/accounts/email-otp/send

  - id: account-authorize-continue-endpoint
    desc: OpenAI account authorization continuation
    if:
      type: string_literal
      exact: https://auth.openai.com/api/accounts/authorize/continue

  - id: account-password-registration-endpoint
    desc: OpenAI password account-registration endpoint
    if:
      type: string_literal
      exact: https://auth.openai.com/api/accounts/user/register

  - id: account-creation-endpoint
    desc: OpenAI account creation endpoint
    if:
      type: string_literal
      exact: https://auth.openai.com/api/accounts/create_account

  - id: workspace-select-endpoint
    desc: OpenAI account workspace selection endpoint
    if:
      type: string_literal
      exact: https://auth.openai.com/api/accounts/workspace/select

  - id: codex-consent-endpoint
    desc: OpenAI Codex OAuth consent endpoint
    if:
      type: string_literal
      exact: https://auth.openai.com/sign-in-with-chatgpt/codex/consent

  - id: oauth-token-endpoint
    desc: OpenAI OAuth token endpoint
    if:
      type: string_literal
      exact: https://auth.openai.com/oauth/token

  - id: sentinel-token-header
    desc: OpenAI Sentinel anti-abuse token header
    if:
      type: string_literal
      exact: openai-sentinel-token

  - id: sentinel-account-token-header
    desc: OpenAI Sentinel account-creation token header
    if:
      type: string_literal
      exact: openai-sentinel-so-token

  - id: models-list-endpoint
    desc: OpenAI models-list API endpoint
    if:
      type: text
      regex: 'https?://api\.openai\.com/v1/models\b'
