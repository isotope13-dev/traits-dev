defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries]
  attack: "T1102.001"
  mbc: "C0002"

traits:
  - id: google-apps-script-host
    desc: script.google.com Apps Script host
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: script.google.com

  - id: google-apps-script-macros-path
    desc: Apps Script macros deployment path
    crit: notable
    conf: 0.95
    unless:
      - id: well-known/app/development/vscode-extension/competitive-programming-helper::cph-extension-context
      - id: well-known/app/development/vscode-extension/competitive-programming-helper::cph-package-identity
      - id: google-apps-script-user-feedback-context
    if:
      type: text
      regex: "script\\.google\\.com/macros/s/[A-Za-z0-9_-]{20,}"

  - id: google-apps-script-akfycb-deployment
    desc: Apps Script AKfycb deployment ID prefix
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: "AKfycb[A-Za-z0-9_-]{30,}"

  - id: google-apps-script-fetch-target
    desc: Fetches an Apps Script deployment URL
    crit: notable
    conf: 0.93
    for: [javascript, typescript]
    if:
      type: text
      regex: 'fetch\s*\(\s*["'']https?://script\.google\.com/macros/s/'

  - id: google-apps-script-fetch-constant
    desc: Fetches through an Apps Script URL constant
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'fetch\s*\(\s*[A-Z][A-Z0-9_]*(APP|SCRIPT)[A-Z0-9_]*\s*,'

  - id: apps-script-user-uuid-field
    desc: Apps Script per-user UUID field
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      word: userUuid

  - id: login-name-code-parameters
    desc: Login request carries name and code fields
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'name=\$\{[^}]{1,80}\}&code=\$\{'

  - id: failed-logs-key
    desc: Failed logs storage key
    crit: notable
    conf: 0.82
    if:
      type: text
      substr: failed_logs

  - id: feedback-json-name-email-comment
    desc: Feedback JSON name email comment fields
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'JSON\.stringify\(\s*\{[^}]{0,160}name:[^}]{0,100}email:[^}]{0,100}comment:'

  - id: feedback-json-name-email-fields
    desc: Feedback JSON name and email fields
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'JSON\.stringify\(\s*\{[^}]{0,100}name:[^}]{0,100}email:'

  - id: feedback-json-title-content-fields
    desc: Feedback title/content JSON fields
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      regex: 'JSON\.stringify\(\s*\{[^}]{0,240}(title|subject):[^}]{0,160}(content|message):'

  - id: feedback-json-name-email-title-content-shape
    desc: Feedback JSON support payload shape
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'name:[\s\S]{0,100}email:[\s\S]{0,100}title:[\s\S]{0,100}content:'

  - id: feedback-support-form-marker
    desc: Support-form submission status marker
    crit: notable
    conf: 0.88
    for: [javascript, typescript]
    # "Send Message" alone is a button label in any messaging, chat, or
    # device-console UI (it fired on VS Code Serial Monitor's l10n strings);
    # only the confirmation phrasing identifies a submitted feedback form.
    # The "Help & Support" section heading is a plain UI label with no
    # submission semantics — it lives in micro-behaviors/ui/help/ and is
    # OR-ed in by the feedback exception composites below.
    if:
      type: text
      substr: 'Message sent successfully'
      case_insensitive: true

  - id: feedback-formdata-rating-append
    desc: Appends a rating field to FormData
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)append$'
      arg:
        kind: string
        exact: rating

  - id: feedback-formdata-field
    desc: Appends a feedback field to FormData
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)append$'
      arg:
        kind: string
        exact: feedback

  - id: feedback-formdata-feature-field
    desc: References a feature-request form field
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: literal
      kind: string
      exact: feature_request

  - id: slides-presentation-id-fields
    desc: Google Slides presentation ID fields
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: presentationIds

  - id: extension-lifecycle-telemetry-payload
    desc: Extension install-update telemetry payload
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: 'uuid[A-Z][A-Za-z0-9_]*[\s\S]{0,900}(dateTime|reason|[A-Za-z]+Version)'
    not:
      - substr: uuidEvents

  - id: google-sheet-webhook-marker
    desc: Google Sheet webhook marker
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      substr: Google Sheet Webhook

  - id: webhook-fallback-marker
    desc: Webhook fallback marker
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    if:
      type: text
      substr: webhook_fallback_

  - id: legacy-google-analytics-collect-endpoint
    desc: Google Analytics legacy collect endpoint
    crit: notable
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      substr: google-analytics.com/collect

  - id: extension-ad-configuration-request
    desc: Extension requests remote ad configuration
    crit: notable
    conf: 0.9
    for: [javascript, typescript]
    if:
      type: text
      substr: action=getAds

  # These are complete request-body shapes used by browser applications.  They
  # are notable because they explain what an Apps Script backend receives; the
  # endpoint alone does not establish C2 or exfiltration intent.
  - id: product-page-url-telemetry-payload
    desc: Product-page URL telemetry payload
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: 'JSON\.stringify\(\s*\{[^}]{0,180}\burl\s*:[^,}]{1,180},\s*type\s*:\s*["'']pdp["'']'

  - id: purchase-order-transmit-action
    desc: Purchase-order transmit action marker
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '\baccion\s*:\s*["'']transmitir["'']'

  - id: purchase-order-products-field
    desc: Purchase-order products field
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '\bproductos\s*:'

  - id: interactive-login-action
    desc: Interactive login action marker
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '\baccion\s*:\s*["'']login["'']'

  - id: interactive-login-user-field
    desc: Login action with user field
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      # A standalone email/username property is common in ordinary data
      # models (and in .d.ts declarations).  Tie this atom to the Apps Script
      # login action so it describes a credential-request payload rather than
      # merely a field name.
      regex: 'accion\s*:\s*["'']login["''][\s\S]{0,240}(usuario|username|email)\s*\??\s*:'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: interactive-login-user-field-before-action
    desc: User field before login action
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(usuario|username|email)\s*\??\s*:[\s\S]{0,240}accion\s*:\s*["'']login["'']'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: interactive-login-password-field
    desc: Login action with password field
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: 'accion\s*:\s*["'']login["''][\s\S]{0,240}password\s*\??\s*:'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

  - id: interactive-login-password-field-before-action
    desc: Password field before login action
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: 'password\s*\??\s*:[\s\S]{0,240}accion\s*:\s*["'']login["'']'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file

composite_rules:
  - id: purchase-order-transmission-payload
    desc: Purchase-order transmission payload
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: purchase-order-transmit-action
      - id: purchase-order-products-field
    near_bytes: 800

  - id: interactive-login-user-field-context
    desc: Login action user-field context
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    any:
      - id: interactive-login-user-field
      - id: interactive-login-user-field-before-action

  - id: interactive-login-credential-payload
    desc: Interactive login credential payload
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: interactive-login-action
      - id: interactive-login-user-field-context
      - id: interactive-login-password-field-context
    near_bytes: 800

  - id: interactive-login-password-field-context
    desc: Login action password-field context
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    any:
      - id: interactive-login-password-field
      - id: interactive-login-password-field-before-action

  - id: feedback-formdata-field-set
    desc: Feedback form rating and comment field set
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/post::formdata-class
      - id: feedback-formdata-rating-append
      - id: feedback-formdata-field
      - id: feedback-formdata-feature-field

  - id: extension-analytics-fallback-marker
    desc: Google Sheet webhook fallback marker
    crit: notable
    conf: 0.95
    for: [javascript, typescript]
    any:
      - id: google-sheet-webhook-marker
      - id: webhook-fallback-marker

  - id: google-apps-script-telemetry-context
    desc: Apps Script telemetry logging context
    crit: exception
    conf: 0.9
    all:
      - id: google-apps-script-macros-path
    any:
      - id: micro-behaviors/os/telemetry/logging/event::log-event-identifier
      - id: failed-logs-key
      - id: micro-behaviors/ui/help::user-feedback-submission-marker
    near_bytes: 1400

  # User feedback forms POSTed to Apps Script. Does not require the
  # macros-path atom — that atom references this exception in unless:, so
  # including it here would be circular.
  - id: google-apps-script-json-feedback-context
    desc: Apps Script JSON user feedback form submission
    crit: exception
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: feedback-json-name-email-fields
      - id: feedback-json-title-content-fields
    any:
      - id: micro-behaviors/ui/help::user-feedback-submission-marker
      - id: feedback-json-name-email-comment
      - id: feedback-support-form-marker
      - id: micro-behaviors/ui/help::help-support-section-label

  - id: google-apps-script-user-feedback-context
    desc: Apps Script user feedback form submission
    crit: exception
    conf: 0.95
    for: [javascript, typescript]
    any:
      - id: google-apps-script-json-feedback-context
      - id: feedback-formdata-field-set
      - id: google-apps-script-formdata-feedback-context

  - id: google-apps-script-formdata-feedback-context
    desc: Apps Script FormData feedback submission
    crit: exception
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/post::formdata-class
      - id: feedback-formdata-field
      - id: micro-behaviors/communications/http/request/client::js-fetch-call

  - id: google-apps-script-license-validation-context
    desc: Apps Script extension license-validation context
    crit: exception
    conf: 0.9
    all:
      - id: google-apps-script-macros-path
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    any:
      - id: micro-behaviors/os/privilege/licensing
      - id: micro-behaviors/os/sysinfo/machine-id::machineid-identifier-field

  - id: google-slides-merge-client
    desc: Legitimate Google Slides merge client
    crit: exception
    conf: 0.95
    all:
      - id: google-apps-script-macros-path
      - id: slides-presentation-id-fields
      - id: micro-behaviors/communications/http/lib/requests::requests-post

  - id: google-apps-script-extension-lifecycle-telemetry
    desc: Extension reports install-update lifecycle telemetry to Apps Script
    crit: exception
    conf: 0.94
    all:
      - id: google-apps-script-macros-path
      - id: extension-lifecycle-telemetry-payload
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 2500

  - id: google-apps-script-extension-analytics-context
    desc: Extension analytics telemetry sent to Apps Script
    crit: exception
    conf: 0.97
    for: [javascript, typescript]
    all:
      - id: google-apps-script-macros-path
      - id: micro-behaviors/os/telemetry/logging/event::extension-analytics-event-payload
      - id: extension-analytics-fallback-marker
      - id: legacy-google-analytics-collect-endpoint
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 3000

  - id: google-apps-script-extension-installation-analytics
    desc: Extension installation analytics sent to Apps Script
    crit: exception
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: google-apps-script-macros-path
      - id: micro-behaviors/os/telemetry/logging/event::extension-analytics-installation-payload
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 1800

  - id: google-apps-script-login-validation-context
    desc: Extension login validation via Apps Script
    crit: exception
    conf: 0.96
    for: [javascript, typescript]
    all:
      - id: google-apps-script-macros-path
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
      - id: micro-behaviors/communications/http/request/params::login-action-parameter
      - id: login-name-code-parameters

  - id: google-apps-script-extension-install-startup-telemetry
    desc: Extension sends install and startup telemetry to Apps Script
    crit: exception
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: google-apps-script-macros-path
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-installed
      - id: micro-behaviors/browser-extension/lifecycle::chrome-runtime-on-startup
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
    near_bytes: 4000

  - id: google-apps-script-extension-ad-fetch-context
    desc: Extension fetches ad configuration from Apps Script
    crit: exception
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: google-apps-script-macros-path
      - id: extension-ad-configuration-request
      - id: micro-behaviors/communications/http/request/client::js-fetch-call

  # A Web App deployment used as the backend for a newsletter / contact form
  # on a static or hosted storefront: the page hangs a submit handler on a
  # visible form, reads the field the user typed, and posts it as urlencoded
  # parameters. Exfiltration to Apps Script harvests from storage, cookies or
  # other pages instead — it does not wait on a user form submission.
  - id: google-apps-script-subscribe-form-context
    desc: Apps Script backs a page subscribe form
    crit: exception
    conf: 0.95
    for: [javascript, typescript, html]
    all:
      - id: google-apps-script-macros-path
      - id: micro-behaviors/communications/http/form::form-submit-listener
      - id: micro-behaviors/ui/window/form-input::browser-form-control-value-read
      - id: micro-behaviors/communications/http/url/query::js-urlsearchparams-construction

  # Spreadsheet-backed applications commonly expose a small CRUD API.  The
  # explicit action and per-user UUID fields distinguish that application data
  # synchronization from a generic Apps Script POST.
  - id: google-apps-script-spreadsheet-crud-context
    desc: Apps Script spreadsheet CRUD synchronization
    crit: exception
    conf: 0.95
    for: [javascript, typescript]
    all:
      - id: google-apps-script-macros-path
      - id: google-apps-script-post-request
      - id: micro-behaviors/data/serialize/json::json-object-action-field
      - id: apps-script-user-uuid-field
    near_bytes: 3500

  - id: google-apps-script-non-c2-context
    desc: Known non-C2 Apps Script context
    crit: exception
    conf: 0.95
    any:
      - id: micro-behaviors/communications/http/services/google-apps-script-exceptions/
      - id: metadata/signed/platform/
      - id: metadata/binary/installer/family/
      - id: google-apps-script-spreadsheet-crud-context

  - id: google-apps-script-post-request
    desc: Posts to an Apps Script deployment
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/post::request-options-post-method
    any:
      - id: google-apps-script-fetch-target
      - id: google-apps-script-fetch-constant
    near_bytes: 320
