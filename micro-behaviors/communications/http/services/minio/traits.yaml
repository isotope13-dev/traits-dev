# MinIO and other self-hosted S3-compatible object stores, addressed the way a
# workload inside a cluster reaches them: a service name and the S3 API port.
# Neutral on their own -- every in-cluster client names its store. Intent comes
# from objectives/ composites that pair them with credential material.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source]
  crit: notable
traits:
  - id: minio-service-url
    desc: URL addresses a MinIO service
    conf: 0.85
    if:
      type: text
      regex: 'https?://minio(\.[a-z0-9-]{1,40}){0,4}(:\d{2,5})?\b'
  # Candidate in-cluster endpoints for an S3-compatible store: a bare service
  # name (optionally namespace/`svc`-qualified) or the container host gateway,
  # on the S3 API port. One atom per naming family so the list composite
  # below counts distinct guesses rather than repeats of one.
  - id: minio-s3-port-url
    desc: MinIO URL on S3 port 9000
    conf: 0.85
    if:
      type: text
      regex: 'https?://minio(\.[a-z0-9-]{1,40}){0,4}:9000'
  - id: s3-service-s3-port-url
    desc: s3 service URL on port 9000
    conf: 0.8
    if:
      type: text
      regex: 'https?://s3(\.[a-z0-9-]{1,40}){0,4}:9000'
  - id: storage-service-s3-port-url
    desc: storage service URL on port 9000
    conf: 0.8
    if:
      type: text
      regex: 'https?://storage(\.[a-z0-9-]{1,40}){0,4}:9000'
  - id: container-gateway-s3-port-url
    desc: Container host gateway on port 9000
    conf: 0.85
    if:
      type: text
      regex: 'https?://host\.(docker|containers)\.internal:9000'

composite_rules:
  # Several candidate hosts for one store is a search, not a configuration:
  # a client is given its endpoint, a prober walks a list of guesses.
  # Documentation examples use `localhost` or a public host, which none of
  # the families above match.
  - id: s3-endpoint-candidate-list
    desc: Lists several in-cluster S3 endpoint guesses
    crit: notable
    conf: 0.85
    any:
      - id: minio-s3-port-url
      - id: s3-service-s3-port-url
      - id: storage-service-s3-port-url
      - id: container-gateway-s3-port-url
    needs: 3
