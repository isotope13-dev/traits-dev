# Exact AWS EC2 Describe* operations from the article's discovery
# correlation. This leaf contains only the listed operations, so a
# directory-level needs: 10 remains narrower than all AWS APIs.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript, java, ruby, go, json]
  crit: notable
  conf: 0.92

traits:
  - id: describe-instances-call
    desc: AWS EC2 instance enumeration call
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)describe[_-]?instances$'
    unless:
      - id: well-known/lib/cloud/alibaba-cloud-go::alibaba-cloud-go-library
  - id: describe-instance-types-call
    desc: AWS EC2 instance-type query call
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)describe[_-]?instance[_-]?types$'
    unless:
      - id: well-known/lib/cloud/alibaba-cloud-go::alibaba-cloud-go-library
  - id: describe-instance-offerings-call
    desc: AWS EC2 offering query call
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)describe[_-]?instance[_-]?type[_-]?offerings$'
    unless:
      - id: well-known/lib/cloud/alibaba-cloud-go::alibaba-cloud-go-library
  - id: describe-account-attributes-call
