# Azure Key Vault endpoint shapes are neutral HTTP service indicators. Secret
# theft intent requires the cloud-resource, enumeration, and reader context in
# the credential-access composites that reference these traits.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.9

traits:
  - id: resource-url
    desc: Azure Key Vault resource URL
    if:
      type: text
      exclude_comments: true
      substr: https://vault.azure.net
  - id: token-scope
    desc: Requests an Azure Key Vault token scope
    if:
      type: text
      exclude_comments: true
      substr: https://vault.azure.net/.default
  - id: data-plane-host
    desc: Azure Key Vault data-plane URL
    for: [scripts, source]
    if:
      type: literal
      kind: string
      exclude_docstrings: true
      regex: '(?i)^https://[a-z0-9-]{3,127}\.vault\.azure\.net([/:?]|$)'
  - id: vault-domain-reference
    desc: Azure Key Vault hostname reference
    if:
      type: text
      exclude_comments: true
      regex: '(?i)[a-z0-9}{$_%-]{1,127}\.vault\.azure\.net\b'
  - id: management-vault-list-path
    desc: Azure Key Vault management listing path
    if:
      type: text
      exclude_comments: true
      substr: Microsoft.KeyVault/vaults
  - id: secret-list-path
    desc: Azure Key Vault secret-listing path
    if:
      type: text
      exclude_comments: true
      substr: /secrets?api-version=
  - id: secret-value-path
    desc: Azure Key Vault secret-value path
    if:
      type: text
      exclude_comments: true
      regex: '/secrets/.{1,80}\?api-version='
  - id: secret-item-version-query
    desc: Interpolated Key Vault 7.x version query
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(["''`]|%[sv]|\}|\$[A-Za-z0-9_{]+)\?api-version=7\.[0-9]'

composite_rules:
  - id: vault-service-reference
    desc: Azure Key Vault service endpoint or scope reference
    any:
      - id: resource-url
      - id: token-scope
      - id: data-plane-host
      - id: vault-domain-reference

  - id: secret-value-access-reference
    desc: Azure Key Vault secret-value request endpoint
    any:
      - id: secret-value-path
      - id: secret-item-version-query
