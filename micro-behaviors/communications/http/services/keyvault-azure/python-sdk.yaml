# SDK calls keep their resource-specific meaning without a literal vault host.
# Receiver provenance distinguishes SecretClient operations from names alone.
defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: python-secret-list
    desc: Lists Azure Key Vault secret properties
    if:
      type: symbol
      kind: call
      regex: '\.list_properties_of_secrets$'
      receiver:
        from:
          call: '(^|\.)SecretClient$'

  - id: python-secret-read
    desc: Retrieves an Azure Key Vault secret
    if:
      type: symbol
      kind: call
      regex: '\.get_secret$'
      receiver:
        from:
          call: '(^|\.)SecretClient$'
