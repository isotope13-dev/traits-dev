---
defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - ruby
  crit: notable
traits:
- id: github-authenticated-user-endpoint
  desc: GitHub authenticated-user API endpoint
  crit: notable
  conf: 0.94
  for:
  - scripts
  - source
  if:
    type: text
    regex: https?://api\.github\.com/user\b
- id: github-get-authenticated-user
  desc: GitHub authenticated user lookup API
  conf: 0.8
  if:
    type: text
    regex: "\\.getAuthenticated\\s*\\(|users\\]\\[[^]]{0,40}get"
