defaults:
  for: [javascript, typescript]
  platforms: [unix, windows]
traits:
  - id: fetch-star-url
    desc: Fetch call targets GitHub star endpoint
    crit: notable
    if:
      type: text
      regex: '\bfetch\s*\(\s*`https://api\.github\.com/user/starred/'
composite_rules:
  - id: fetch-star-repository
    desc: GitHub star endpoint fetch with PUT method nearby
    crit: notable
    near_lines: 4
    all:
      - id: fetch-star-url
      - id: micro-behaviors/communications/http/request/result::http-put-method
  - id: authenticated-star-request
    desc: GitHub star request with token authentication nearby
    crit: notable
    near_lines: 10
    all:
      - id: fetch-star-repository
      - id: micro-behaviors/communications/http/authorization-header::js-token-header-from-variable
