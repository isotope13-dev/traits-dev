---
defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - ruby
  crit: notable
traits:
- id: github-octokit-pull-request-create
  desc: Octokit creates GitHub pull request
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)pulls\\.create$"
- id: github-octokit-pull-request-review
  desc: Octokit creates pull request review
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)pulls\\.createReview(Comment)?$"
- id: github-octokit-pull-request-merge
  desc: Octokit merges GitHub pull request
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)pulls\\.merge$"
- id: github-issue-label-api
  desc: GitHub issue label endpoint path
  conf: 0.84
  if:
    type: text
    regex: /repos/[^'"\s]{1,160}/(labels|issues/[^'"\s]{1,80}/labels)\b
  not:
  - substr: "/repos/{owner}/{repo}/labels"
  - substr: "/repos/{owner}/{repo}/issues/"
  - regex: /repos/:[^/'"\s]+/:[^/'"\s]+/
  - substr: "/repos/${"
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: github-issue-comment-api
  desc: GitHub issue comment API path
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: /repos/[^'"\s]{1,160}/issues/[^'"\s]{1,80}/comments\b
  not:
  - substr: "/repos/{owner}/{repo}/issues/"
- id: github-pr-comments-url-field
  desc: Reads GitHub pull request comments URL
  crit: notable
  conf: 0.98
  for:
  - shell
  if:
    type: symbol
    kind: call
    exact: jq
    arg:
      kind: identifier
      name: ".pull_request.comments_url"
- id: github-issues-api
  desc: GitHub issues API path
  crit: notable
  conf: 0.88
  for:
  - python
  - javascript
  - typescript
  - shell
  if:
    type: text
    regex: api\.github\.com/repos/.{1,120}/issues(\?|/(\{.{1,20}\}|[0-9]+)(/comments)?)?\b
- id: github-issues-search-api
  desc: GitHub issues search API endpoint
  crit: notable
  conf: 0.9
  for:
  - csharp
  - python
  - javascript
  - typescript
  - powershell
  - go
  if:
    type: text
    regex: api\.github\.com/search/issues\b
composite_rules:
- id: github-python-issue-maintenance
  desc: Python GitHub issue maintenance flow
  crit: component
  conf: 0.9
  for:
  - python
  all:
  - id: micro-behaviors/communications/http/authorization-header::github-python-token-auth-header
  - id: micro-behaviors/communications/http/services/github/collaboration::github-issues-api
