---
defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - ruby
  crit: notable
traits:
- id: github-app-installation-token-api
  desc: GitHub App installation token endpoint path
  conf: 0.88
  for:
  - javascript
  - typescript
  - python
  - shell
  if:
    type: text
    substr: "/app/installations/"
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: github-actions-secret-inventory-endpoint
  desc: GitHub Actions secrets API endpoint
  crit: notable
  conf: 0.94
  for:
  - scripts
  - source
  - binaries
  - github-actions
  size_max: 1000000
  if:
    type: text
    regex: /repos/[^'"\s]{1,160}/actions/(secrets|organization-secrets)\b($|[^/]|/[^p])
  not:
  - substr: "/repos/{owner}/{repo}/actions/"
  - regex: /repos/:[^/'"\s]+/:[^/'"\s]+/actions/
  - substr: "/repos/{}/actions/"
  - substr: "/actions/secrets/public-key"
  - regex: "/actions/secrets/public-key\\b"
- id: github-environment-secret-inventory-endpoint
  desc: GitHub environment secrets API endpoint
  crit: notable
  conf: 0.96
  for:
  - scripts
  - source
  - binaries
  - github-actions
  if:
    type: text
    regex: "/repos/[^/\\r\\n]{1,80}/[^/\\r\\n]{1,80}/environments/[^/\\r\\n]{1,160}/secrets\\b"
  not:
  - substr: "/repos/{owner}/{repo}/environments/"
  - regex: /repos/:[^/'"\s]+/:[^/'"\s]+/environments/
- id: github-org-secret-scanning-alerts-endpoint
  desc: GitHub organization scanning-alerts endpoint
  crit: notable
  conf: 0.96
  for:
  - scripts
  - source
  - binaries
  - github-actions
  if:
    type: text
    regex: /(orgs|organizations)/[^/'"\s]{1,100}/secret-scanning/alerts\b
  not:
  - regex: "/(orgs|organizations)/\\{(org|organization)\\}/secret-scanning/alerts"
  - regex: /(orgs|organizations)/:[^/'"\s]+/secret-scanning/alerts
- id: github-code-search-url
  desc: GitHub code search API URL
  crit: notable
  conf: 0.94
  for:
  - scripts
  - source
  - binaries
  if:
    type: text
    exclude_comments: true
    regex: '(?i)(api\.github\.com/search/code\b|/search/code\?(q=|[^\s"'']{1,80}&q=))'
- id: github-code-search-path
  desc: Code search API route fragment
  crit: notable
  conf: 0.72
  for:
  - scripts
  - source
  - binaries
  if:
    type: text
    exclude_comments: true
    regex: '(?i)(^|["''`\}])/search/code(["''`?\s]|$)'
composite_rules:
- id: github-code-search-endpoint
  desc: GitHub code search API endpoint
  crit: notable
  conf: 0.94
  for:
  - scripts
  - source
  - binaries
  any:
  - id: github-code-search-url
  - id: github-split-code-search-endpoint
- id: github-split-code-search-endpoint
  desc: GitHub API host with code search route
  crit: notable
  conf: 0.93
  for:
  - scripts
  - source
  - binaries
  all:
  - id: micro-behaviors/communications/http/services/github/client::github-api-host
  - id: github-code-search-path
  near_bytes: 1024
