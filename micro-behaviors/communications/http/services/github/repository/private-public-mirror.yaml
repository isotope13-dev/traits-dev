defaults:
  platforms: [unix, windows]
  for: [shell, javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: github-private-internal-org-repository-list
    desc: Lists private and internal org repositories
    if:
      type: text
      regex: '/orgs/[^"\s]{1,80}/repos\?type=private,internal'
      exclude_comments: true

  # Accept escaped quotes in an embedded script as well as a shell helper.
  # The JSON body and PATCH route must stay together, not anywhere in a bundle.
  - id: github-public-visibility-patch-script
    desc: Script pairs public visibility and repo PATCH
    if:
      type: text
      regex: '(?s)private\\?"\s*:\s*false.{0,280}/repos/[^"\r\n]{1,120}\\?"\s+\\?"PATCH'
      exclude_comments: true
