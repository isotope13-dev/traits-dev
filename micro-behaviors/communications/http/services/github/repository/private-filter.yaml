# Lists the authenticated user's repositories and keeps the private ones.
# Normal for GitHub clients; context for token-misuse composites.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: github-user-repos-private-filter
    desc: Lists user repos and filters private ones
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: api\.github\.com/user/repos\b[\s\S]{0,600}\.filter\(\s*\(?\w+\)?\s*=>\s*\w+\.private\b
