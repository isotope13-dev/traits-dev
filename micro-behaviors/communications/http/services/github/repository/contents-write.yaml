# PUT observations require their own GitHub contents destination.
# Fetch currently requires inline options with literal keys and one method.
# Explicit nonempty alternatives avoid zero-length quantified-anchor ambiguity.
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  - python
  crit: notable
  conf: 0.94
traits:
- id: github-contents-client-put
  desc: Client PUT to GitHub file contents
  if:
    type: symbol
    kind: call
    regex: ^(requests|httpx|axios)\.put$
    arg:
      index: 0
      kind: string
      regex: ^https?://api\.github\.com/repos/[^/?#]+/[^/?#]+/contents/[^?#]+
- id: github-contents-fetch-put
  desc: Fetch PUT to GitHub file contents
  for:
  - javascript
  - typescript
  if:
    type: tree-sitter
    language: javascript
    query: |
      (call_expression
       function: (identifier) @callee
       arguments: (arguments . (string (string_fragment) @url) . [
      (object . (pair key: [(property_identifier) @method (string (string_fragment) @method)] value: (string (string_fragment) @verb)) .)
      (object . (pair key: [(property_identifier) @method (string (string_fragment) @method)] value: (string (string_fragment) @verb)) . (pair key: [(property_identifier) @other (string (string_fragment) @other)] value: (_))+ .)
      (object . (pair key: [(property_identifier) @other (string (string_fragment) @other)] value: (_))+ . (pair key: [(property_identifier) @method (string (string_fragment) @method)] value: (string (string_fragment) @verb)) .)
      (object . (pair key: [(property_identifier) @other (string (string_fragment) @other)] value: (_))+ . (pair key: [(property_identifier) @method (string (string_fragment) @method)] value: (string (string_fragment) @verb)) . (pair key: [(property_identifier) @other (string (string_fragment) @other)] value: (_))+ .)] .)
       (#eq? @callee "fetch")
       (#match? @url "^https?://api\\.github\\.com/repos/[^/?#]+/[^/?#]+/contents/[^?#]+")
       (#eq? @method "method")
       (#eq? @verb "PUT")
       (#not-eq? @other "method"))
