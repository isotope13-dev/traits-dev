---
defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - ruby
  crit: notable
traits:
- id: github-octokit-repository-read
  desc: Octokit reads GitHub repository metadata
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)rest\\.repos\\.get$"
- id: github-gist-api-url
  desc: References the GitHub Gist API endpoint
  crit: notable
  conf: 0.84
  for:
  - scripts
  - binaries
  if:
    type: text
    substr: api.github.com/gists/
- id: github-create-repo-http-request
  desc: Explicit GitHub repository creation HTTP request
  crit: notable
  conf: 0.9
  for:
  - python
  - javascript
  - typescript
  if:
    type: text
    regex: (?i)\b\w*request\s*\(\s*['"](POST\s+/user/repos|/user/repos['"]\s*,\s*['"]POST)['"]
- id: github-authenticated-user-repositories-list-api
  desc: Lists authenticated user repositories
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  - python
  - shell
  - ruby
  - go
  - powershell
  if:
    type: text
    regex: /user/repos\?[^\s"'`]{1,320}
- id: github-create-repo-shell-request
  desc: Shell posts to GitHub repository endpoint
  crit: notable
  conf: 0.9
  for:
  - shell
  - batch
  - powershell
  - github-actions
  if:
    type: text
    regex: "(?i)\\b(curl|wget)\\b[^\\n]{0,160}(-X|--request)\\s+POST[^\\n]{0,160}/user/repos\\b"
- id: github-repository-archive-api-endpoint
  desc: GitHub repository source-archive API endpoint
  crit: notable
  conf: 0.94
  for:
  - scripts
  - source
  if:
    type: text
    regex: (api\.github\.com)?/repos/[^/\s"']{1,80}/[^/\s"']{1,80}/(zipball|tarball)([/?#"']|$)
- id: github-graphql-create-commit-on-branch
  desc: GitHub GraphQL createCommitOnBranch mutation
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  - python
  - shell
  - powershell
  - ruby
  if:
    type: string_literal
    regex: "(?i)\\bcreateCommitOnBranch\\b"
- id: github-create-repo-octokit-call
  desc: Octokit creates authenticated repository
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: "\\.createForAuthenticatedUser\\s*\\("
- id: github-create-repo-org-call
  desc: Octokit creates organization repository
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: "\\.createInOrg\\s*\\("
- id: github-create-or-update-file-contents
  desc: GitHub file contents write API
  conf: 0.92
  if:
    type: text
    regex: (\.|\[['"])createOrUpdateFileContents['"]?\]?\s*\(
- id: github-contents-template-api
  desc: GitHub contents API template
  conf: 0.86
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: api.github.com/repos/${
- id: github-contents-api-endpoint
  desc: GitHub repository contents API endpoint
  conf: 0.86
  for:
  - source
  - scripts
  - binaries
  if:
    type: text
    regex: "(api\\.github\\.com/repos/[\\s\\S]{1,160}/contents(/|\\b)|/repos/\\$\\{.{0,80}\\}/contents/)"
- id: github-contents-read-endpoint
  desc: GitHub repository contents read endpoint path
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: GET /repos/{owner}/{repo}/contents/{path}
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: github-contents-write-endpoint
  desc: GitHub repository contents write endpoint path
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: PUT /repos/{owner}/{repo}/contents/{path}
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: github-contents-delete-endpoint
  desc: GitHub repository contents delete endpoint path
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: DELETE /repos/{owner}/{repo}/contents/{path}
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: github-git-blob-api-endpoint
  desc: GitHub Git blob API endpoint
  conf: 0.88
  for:
  - javascript
  - typescript
  - python
  - shell
  if:
    type: text
    regex: api\.github\.com.{0,80}/git/blobs
- id: github-git-trees-api-endpoint
  desc: GitHub Git trees API endpoint
  crit: notable
  conf: 0.92
  for:
  - scripts
  - source
  - binaries
  - github-actions
  if:
    type: text
    regex: /repos/[^/\s"']{1,80}/[^/\s"']{1,80}/git/trees/
  not:
  - substr: "/repos/{owner}/{repo}/git/trees/"
  - regex: /repos/:[^/'"\s]+/:[^/'"\s]+/git/trees/
- id: github-org-repositories-endpoint
  desc: GitHub organization repositories API endpoint
  crit: notable
  conf: 0.94
  for:
  - scripts
  - source
  - binaries
  - github-actions
  if:
    type: text
    regex: /orgs/[^/'"\s]{1,100}/repos(["'`?,)]|$)
  not:
  - regex: "/orgs/\\{(org|organization)\\}/repos"
  - regex: /orgs/:[^/'"\s]+/repos
- id: github-private-repository-filter
  desc: Private repository-list filter
  crit: component
  conf: 0.9
  for:
  - scripts
  - source
  - binaries
  - github-actions
  if:
    type: text
    regex: \btype["'`]?\s*(=|:)\s*["'`]?private["'`]?\b
- id: github-private-repository-visibility-filter
  desc: Private visibility repository-list filter
  crit: component
  conf: 0.94
  for:
  - scripts
  - source
  - binaries
  - github-actions
  if:
    type: text
    regex: \bvisibility["'`]?\s*(=|:)\s*["'`]?private["'`]?\b
- id: github-repository-affiliation-filter
  desc: Repository-list affiliation option
  crit: component
  conf: 0.92
  for:
  - scripts
  - source
  - binaries
  - github-actions
  if:
    type: text
    regex: \baffiliation["'`]?\s*(=|:)\s*["'`]?[a-z_]+,[a-z_,]+
- id: github-git-ref-create-request
  desc: GitHub API git reference creation body
  crit: notable
  conf: 0.92
  for:
  - shell
  - python
  - javascript
  - typescript
  if:
    type: text
    regex: '"ref":\s*"refs/tags/'
- id: github-event-git-refs-url
  desc: Git refs URL from workflow event payload
  crit: notable
  conf: 0.94
  for:
  - shell
  if:
    type: text
    substr: repository.git_refs_url
composite_rules:
- id: github-git-trees-recursive-api
  desc: Recursively lists a GitHub repository tree
  crit: notable
  conf: 0.94
  for:
  - scripts
  - source
  - binaries
  - github-actions
  all:
  - id: micro-behaviors/communications/http/services/github/repository::github-git-trees-api-endpoint
  - id: micro-behaviors/data/config/syntax::recursive-option-enabled-text
  near_bytes: 256
- id: github-private-org-repository-list
  desc: Lists private GitHub organization repositories
  crit: notable
  conf: 0.94
  for:
  - scripts
  - source
  - binaries
  - github-actions
  all:
  - id: micro-behaviors/communications/http/services/github/repository::github-org-repositories-endpoint
  - id: micro-behaviors/communications/http/services/github/repository::github-private-repository-filter
  near_bytes: 320
- id: github-paginated-private-org-repository-list
  desc: Private GitHub organization repository-list endpoint with per-page option
  crit: notable
  conf: 0.96
  for:
  - scripts
  - source
  - binaries
  - github-actions
  all:
  - id: micro-behaviors/communications/http/services/github/repository::github-org-repositories-endpoint
  - id: micro-behaviors/communications/http/services/github/repository::github-private-repository-filter
  - id: micro-behaviors/communications/url/query/selection::per-page-query-parameter
  near_bytes: 640
- id: github-paginated-private-user-repository-list
  desc: Private GitHub user repository-list endpoint with per-page option
  crit: notable
  conf: 0.97
  for:
  - scripts
  - source
  - binaries
  - github-actions
  all:
  - id: micro-behaviors/communications/http/services/github/repository::github-authenticated-user-repositories-list-api
  - id: micro-behaviors/communications/http/services/github/repository::github-private-repository-visibility-filter
  - id: micro-behaviors/communications/http/services/github/repository::github-repository-affiliation-filter
  - id: micro-behaviors/communications/url/query/selection::per-page-query-parameter
  near_bytes: 640
- id: github-gist-file-write-api
  desc: GitHub Gist file write API request
  crit: notable
  conf: 0.94
  for:
  - scripts
  - "!jcl"
  all:
  - id: micro-behaviors/communications/http/services/github/repository::github-gist-api-url
  - id: micro-behaviors/data/serialize/schema-object::files-object-field
  - id: micro-behaviors/data/serialize/schema-object::content-object-field
  any:
  - id: micro-behaviors/communications/http/patch::http-patch-client-call
  - id: micro-behaviors/communications/http/patch::quoted-patch-token
  near_bytes: 1400
- id: github-graphql-create-commit
  desc: GitHub GraphQL repository commit write
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  - python
  - shell
  - powershell
  - ruby
  all:
  - id: micro-behaviors/communications/http/services/github/repository::github-graphql-create-commit-on-branch
  any:
  - id: micro-behaviors/communications/http/services/github/client::github-graphql-api-endpoint
  - id: micro-behaviors/communications/http/services/github/client::github-graphql-options-endpoint
  near_bytes: 2048
- id: github-create-repo-api
  desc: Explicit GitHub repository creation API request
  crit: notable
  conf: 0.9
  for:
  - shell
  - batch
  - powershell
  - python
  - javascript
  - typescript
  - github-actions
  any:
  - id: micro-behaviors/communications/http/services/github/repository::github-create-repo-http-request
  - id: micro-behaviors/communications/http/services/github/repository::github-create-repo-shell-request
  - id: micro-behaviors/communications/http/services/github/repository::github-user-repo-client-post
  - id: micro-behaviors/communications/http/services/github/repository::github-user-repo-fetch-post
- id: github-contents-api-write-flow
  desc: GitHub repository contents API write request
  crit: notable
  conf: 0.94
  for:
  - shell
  - python
  - javascript
  - rust
  - go
  - powershell
  all:
  - id: micro-behaviors/communications/http/services/github/repository::github-contents-api-endpoint
  any:
  - id: micro-behaviors/communications/http/request/result::http-put-client-call
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::powershell-put-client-call
  - id: micro-behaviors/communications/http/request/result::http-fetch-put-request
  - id: micro-behaviors/communications/http/request/result::http-curl-put-request
  - id: micro-behaviors/communications/http/put::axios-put-call
  - id: micro-behaviors/communications/http/put::net-http-put
  - id: micro-behaviors/communications/http/put::javascript-put-request-body
  - id: micro-behaviors/communications/http/put::rust-reqwest-client-put
  near_bytes: 1024
- id: github-create-repo
  desc: GitHub repository creation workflow API
  crit: notable
  conf: 0.9
  for:
  - shell
  - batch
  - powershell
  - python
  - javascript
  - typescript
  - github-actions
  any:
  - id: micro-behaviors/communications/http/services/github/repository::github-create-repo-api
  - id: micro-behaviors/communications/http/services/github/repository::github-create-repo-octokit-call
  - id: micro-behaviors/communications/http/services/github/repository::github-create-repo-org-call
- id: github-create-repo-and-contents-write
  desc: GitHub creation and contents-write APIs
  crit: notable
  conf: 0.95
  for:
  - shell
  - python
  - javascript
  - typescript
  - github-actions
  all:
  - id: micro-behaviors/communications/http/services/github/repository::github-create-repo
  any:
  - id: micro-behaviors/communications/http/services/github/repository::github-contents-client-put
  - id: micro-behaviors/communications/http/services/github/repository::github-contents-fetch-put
  - id: micro-behaviors/communications/http/services/github/repository::github-contents-write-endpoint
  - id: micro-behaviors/communications/http/services/github/repository::github-create-or-update-file-contents
