defaults:
  platforms: [unix]
  for: [shell]
  crit: notable

traits:
  - id: commit-status-path
    desc: Commit-status API path expression
    if:
      type: text
      regex: '/statuses/([0-9a-fA-F]{40}|\$\{?[A-Za-z_][A-Za-z0-9_]{0,63})'
      exclude_comments: true

composite_rules:
  # This is request-code proximity, not proof that the server accepted it.
  # GitHub host context is required by the objective, since the API base may
  # be assigned far away from the actual curl request.
  - id: success-commit-status-post-clues
    desc: Success-state JSON near a commit-status POST
    near_lines: 6
    all:
      - id: commit-status-path
      - id: micro-behaviors/data/format/json::success-state-field
      - id: micro-behaviors/communications/http/curl/body::curl-post-flag
