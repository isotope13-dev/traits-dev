# A POST bound to the authenticated user's repository endpoint.
# The collection URL alone also appears in harmless repository listing code.
defaults:
  platforms: [unix, windows]
  for: [python, javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  # Encoded routes can hide the endpoint while the request body still exposes
  # GitHub's creation fields. These atoms describe the fields, not exfiltration.
  - id: github-private-flag-false
    desc: GitHub repo private flag is false
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: "['\"]?private['\"]?\\s*:\\s*(false|!0x1)"

  - id: github-auto-init-true
    desc: GitHub repo auto-init flag is true
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: "['\"]?auto_init['\"]?\\s*:\\s*(true|!0x0)"

  # Both fields are the GitHub contents-write schema. Keep the sequences
  # bounded to one object so generic message/content use does not fire.
  - id: github-contents-write-fields-message-first
    desc: GitHub contents fields message then content
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: "['\"]?message['\"]?[^}]{0,160}['\"]?content['\"]?"

  - id: github-contents-write-fields-content-first
    desc: GitHub contents fields content then message
    crit: notable
    conf: 0.9
    for: [javascript]
    if:
      type: text
      regex: "['\"]?content['\"]?[^}]{0,160}['\"]?message['\"]?"

  - id: github-user-repo-client-post
    desc: Client POST creates a GitHub repository
    if:
      type: symbol
      kind: call
      regex: '^(requests|httpx|axios)\.post$'
      arg:
        index: 0
        kind: string
        regex: '^https://api\.github\.com/user/repos$'

  - id: github-user-repo-fetch-post
    desc: Fetch POST creates a GitHub repository
    for: [javascript, typescript]
    if:
      type: tree-sitter
      language: javascript
      query: |
        (call_expression
          function: (identifier) @callee
          arguments: (arguments
            . (string (string_fragment) @url)
            . (object
              (pair
                key: [(property_identifier) @method (string (string_fragment) @method)]
                value: (string (string_fragment) @verb))))
          (#eq? @callee "fetch")
          (#eq? @url "https://api.github.com/user/repos")
          (#eq? @method "method")
          (#eq? @verb "POST"))

composite_rules:
  - id: github-public-repo-create-body-shape
    desc: Public GitHub repo body shape
    crit: notable
    conf: 0.93
    for: [javascript]
    near_bytes: 300
    all:
      - id: github-private-flag-false
      - id: github-auto-init-true

  - id: github-contents-write-body-shape
    desc: GitHub contents write body shape
    crit: notable
    conf: 0.92
    for: [javascript]
    any:
      - id: github-contents-write-fields-message-first
      - id: github-contents-write-fields-content-first

  - id: github-public-repo-creation
    desc: Creates GitHub repository near public flag
    for: [python, javascript, typescript, shell]
    crit: notable
    conf: 0.9
    near_bytes: 400
    all:
      - id: metadata/lang/source/syntax/key-value::private-false-object-field
      - id: github-create-repo

  - id: github-repository-write-call
    for: [javascript, typescript, python, shell]
    desc: GitHub API writes repository contents
    crit: notable
    conf: 0.94
    # The host and the write must be one request. A module docstring can name
    # createCommitOnBranch beside a settings path while the only api.github.com
    # literals are example curls many kilobytes later; file-wide joining made
    # that docstring look like the write.
    near_bytes: 2048
    all:
      - id: micro-behaviors/communications/http/services/github/client::github-api-host
    any:
      - id: micro-behaviors/communications/http/services/github/repository::github-graphql-create-commit-on-branch
      - id: micro-behaviors/communications/http/services/github/repository::github-contents-api-write-flow
