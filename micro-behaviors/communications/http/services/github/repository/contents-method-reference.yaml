# A method-name reference is useful API evidence but proves no upload, stolen
# item or hostile intent. Preserve the old observation's exact matching scope.
defaults:
  platforms: [unix, windows]
  for: [javascript]

traits:
  - id: github-contents-write-method-reference
    desc: References GitHub contents-write method
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: createOrUpdateFileContents
