---
defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - ruby
  crit: notable
traits:
- id: github-camo-image-proxy-url
  desc: References GitHub Camo image proxy
  crit: notable
  conf: 0.98
  for:
  - scripts
  - source
  if:
    type: text
    substr: camo.githubusercontent.com/
- id: github-octokit-repository-read
  desc: Octokit reads GitHub repository metadata
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)rest\\.repos\\.get$"
- id: github-octokit-pull-request-create
  desc: Octokit creates GitHub pull request
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)pulls\\.create$"
- id: github-octokit-pull-request-review
  desc: Octokit creates pull request review
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)pulls\\.createReview(Comment)?$"
- id: github-octokit-pull-request-merge
  desc: Octokit merges GitHub pull request
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)pulls\\.merge$"
- id: github-gist-api-url
  desc: References the GitHub Gist API endpoint
  crit: notable
  conf: 0.84
  for:
  - scripts
  - binaries
  if:
    type: text
    substr: api.github.com/gists/
- id: github-create-repo-http-request
  desc: Explicit GitHub repository creation HTTP request
  crit: notable
  conf: 0.9
  for:
  - python
  - javascript
  - typescript
  if:
    type: text
    regex: (?i)\b\w*request\s*\(\s*['"](POST\s+/user/repos|/user/repos['"]\s*,\s*['"]POST)['"]
- id: github-authenticated-user-repositories-list-api
  desc: Lists authenticated user repositories
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  - python
  - shell
  - ruby
  - go
  - powershell
  if:
    type: text
    regex: /user/repos\?[^\s"'`]{1,320}
- id: github-create-repo-shell-request
  desc: Shell posts to GitHub repository endpoint
  crit: notable
  conf: 0.9
  for:
  - shell
  - batch
  - powershell
  - github-actions
  if:
    type: text
    regex: "(?i)\\b(curl|wget)\\b[^\\n]{0,160}(-X|--request)\\s+POST[^\\n]{0,160}/user/repos\\b"
- id: github-api-host
  desc: GitHub API host reference
  crit: notable
  conf: 0.86
  for:
  - javascript
  - typescript
  - python
  - shell
  - ruby
  if:
    type: text
    substr: api.github.com
- id: github-repository-archive-api-endpoint
  desc: GitHub repository source-archive API endpoint
  crit: notable
  conf: 0.94
  for:
  - scripts
  - source
  if:
    type: text
    regex: (api\.github\.com)?/repos/[^/\s"']{1,80}/[^/\s"']{1,80}/(zipball|tarball)([/?#"']|$)
- id: github-authenticated-user-endpoint
  desc: GitHub authenticated-user API endpoint
  crit: notable
  conf: 0.94
  for:
  - scripts
  - source
  if:
    type: text
    regex: https?://api\.github\.com/user\b
- id: github-legacy-api-path
  desc: References legacy GitHub v2 API endpoint
  crit: notable
  conf: 0.95
  for:
  - javascript
  - typescript
  - python
  - shell
  - ruby
  if:
    type: literal
    substr: github.com/api/v2/
- id: github-graphql-api-endpoint
  desc: GitHub GraphQL API endpoint
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  - python
  - shell
  - powershell
  - ruby
  if:
    type: text
    regex: api\.github\.com[ \t\r\n\x22\x27+]{0,24}/graphql\b
- id: github-graphql-create-commit-on-branch
  desc: GitHub GraphQL createCommitOnBranch mutation
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  - python
  - shell
  - powershell
  - ruby
  if:
    type: string_literal
    regex: "(?i)\\bcreateCommitOnBranch\\b"
- id: github-copilot-chat-api
  desc: GitHub Copilot chat completions API
  crit: notable
  conf: 0.88
  for:
  - javascript
  - typescript
  - python
  - shell
  if:
    type: text
    substr: api.githubcopilot.com
- id: github-models-inference-api
  desc: References GitHub Models inference API endpoint
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  - python
  - shell
  if:
    type: text
    substr: models.github.ai
- id: github-app-installation-token-api
  desc: GitHub App installation token endpoint path
  conf: 0.88
  for:
  - javascript
  - typescript
  - python
  - shell
  if:
    type: text
    substr: "/app/installations/"
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: octokit-configure
  desc: Configures the Octokit GitHub API client
  crit: notable
  conf: 0.95
  for:
  - ruby
  if:
    type: text
    substr: Octokit.configure
- id: github-create-repo-octokit-call
  desc: Octokit creates authenticated repository
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: "\\.createForAuthenticatedUser\\s*\\("
- id: github-create-repo-org-call
  desc: Octokit creates organization repository
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: "\\.createInOrg\\s*\\("
- id: github-create-or-update-file-contents
  desc: GitHub file contents write API
  conf: 0.92
  if:
    type: text
    regex: (\.|\[['"])createOrUpdateFileContents['"]?\]?\s*\(
- id: github-contents-template-api
  desc: GitHub contents API template
  conf: 0.86
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: api.github.com/repos/${
- id: github-contents-api-endpoint
  desc: GitHub repository contents API endpoint
  conf: 0.86
  for:
  - source
  - scripts
  - binaries
  if:
    type: text
    regex: "(api\\.github\\.com/repos/[\\s\\S]{1,160}/contents(/|\\b)|/repos/\\$\\{.{0,80}\\}/contents/)"
- id: github-contents-read-endpoint
  desc: GitHub repository contents read endpoint path
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: GET /repos/{owner}/{repo}/contents/{path}
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: github-contents-write-endpoint
  desc: GitHub repository contents write endpoint path
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: PUT /repos/{owner}/{repo}/contents/{path}
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: github-contents-delete-endpoint
  desc: GitHub repository contents delete endpoint path
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: DELETE /repos/{owner}/{repo}/contents/{path}
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: github-git-blob-api-endpoint
  desc: GitHub Git blob API endpoint
  conf: 0.88
  for:
  - javascript
  - typescript
  - python
  - shell
  if:
    type: text
    regex: api\.github\.com.{0,80}/git/blobs
- id: github-git-trees-api-endpoint
  desc: GitHub Git trees API endpoint
  crit: notable
  conf: 0.92
  for:
  - scripts
  - source
  - binaries
  - github-actions
  if:
    type: text
    regex: /repos/[^/\s"']{1,80}/[^/\s"']{1,80}/git/trees/
  not:
  - substr: "/repos/{owner}/{repo}/git/trees/"
  - regex: /repos/:[^/'"\s]+/:[^/'"\s]+/git/trees/
- id: github-actions-secret-inventory-endpoint
  desc: GitHub Actions secrets API endpoint
  crit: notable
  conf: 0.94
  for:
  - scripts
  - source
  - binaries
  - github-actions
  size_max: 1000000
  if:
    type: text
    regex: /repos/[^'"\s]{1,160}/actions/(secrets|organization-secrets)\b($|[^/]|/[^p])
  not:
  - substr: "/repos/{owner}/{repo}/actions/"
  - regex: /repos/:[^/'"\s]+/:[^/'"\s]+/actions/
  - substr: "/repos/{}/actions/"
  - substr: "/actions/secrets/public-key"
  - regex: "/actions/secrets/public-key\\b"
  unless:
  - id: well-known/app/infrastructure/azure-cli::azure-cli-source-tree
  - id: well-known/app/infrastructure/azure-cli::azure-cli-context
  - id: well-known/app/infrastructure/ansible::ansible-module-source-context
  - id: well-known/app/ai/knowledge/lean-ctx::source-tree-path
- id: github-environment-secret-inventory-endpoint
  desc: GitHub environment secrets API endpoint
  crit: notable
  conf: 0.96
  for:
  - scripts
  - source
  - binaries
  - github-actions
  if:
    type: text
    regex: "/repos/[^/\\r\\n]{1,80}/[^/\\r\\n]{1,80}/environments/[^/\\r\\n]{1,160}/secrets\\b"
  not:
  - substr: "/repos/{owner}/{repo}/environments/"
  - regex: /repos/:[^/'"\s]+/:[^/'"\s]+/environments/
- id: github-org-secret-scanning-alerts-endpoint
  desc: GitHub organization scanning-alerts endpoint
  crit: notable
  conf: 0.96
  for:
  - scripts
  - source
  - binaries
  - github-actions
  if:
    type: text
    regex: /(orgs|organizations)/[^/'"\s]{1,100}/secret-scanning/alerts\b
  not:
  - regex: "/(orgs|organizations)/\\{(org|organization)\\}/secret-scanning/alerts"
  - regex: /(orgs|organizations)/:[^/'"\s]+/secret-scanning/alerts
- id: github-org-repositories-endpoint
  desc: GitHub organization repositories API endpoint
  crit: notable
  conf: 0.94
  for:
  - scripts
  - source
  - binaries
  - github-actions
  if:
    type: text
    regex: /orgs/[^/'"\s]{1,100}/repos(["'`?,)]|$)
  not:
  - regex: "/orgs/\\{(org|organization)\\}/repos"
  - regex: /orgs/:[^/'"\s]+/repos
- id: github-private-repository-filter
  desc: Private repository-list filter
  crit: component
  conf: 0.9
  for:
  - scripts
  - source
  - binaries
  - github-actions
  if:
    type: text
    regex: \btype["'`]?\s*(=|:)\s*["'`]?private["'`]?\b
- id: github-private-repository-visibility-filter
  desc: Private visibility repository-list filter
  crit: component
  conf: 0.94
  for:
  - scripts
  - source
  - binaries
  - github-actions
  if:
    type: text
    regex: \bvisibility["'`]?\s*(=|:)\s*["'`]?private["'`]?\b
- id: github-repository-affiliation-filter
  desc: Repository-list affiliation option
  crit: component
  conf: 0.92
  for:
  - scripts
  - source
  - binaries
  - github-actions
  if:
    type: text
    regex: \baffiliation["'`]?\s*(=|:)\s*["'`]?[a-z_]+,[a-z_,]+
- id: github-get-authenticated-user
  desc: GitHub authenticated user lookup API
  conf: 0.8
  if:
    type: text
    regex: "\\.getAuthenticated\\s*\\(|users\\]\\[[^]]{0,40}get"
- id: github-release-api
  desc: GitHub REST releases endpoint
  conf: 0.6
  for:
  - shell
  - python
  - javascript
  - typescript
  - go
  - ruby
  - github-actions
  if:
    type: text
    regex: api\.github\.com/repos/[^\s"']{1,120}/releases
  not:
  - substr: "/repos/eugeny/tabby/releases"
  - substr: "/repos/Microsoft/vscode-linux-bu"
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: github-repo-runner-registration-path
  desc: Concrete GitHub repo runner registration path
  conf: 0.94
  for:
  - shell
  - python
  - javascript
  - typescript
  if:
    type: text
    regex: repos/[^{}:/\s]{1,80}/[^{}:/\s]{1,80}/actions/runners/registration-token
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: github-org-runner-registration-path
  desc: Concrete GitHub org runner registration path
  conf: 0.94
  for:
  - shell
  - python
  - javascript
  - typescript
  if:
    type: text
    regex: orgs/[^{}:/\s]{1,80}/actions/runners/registration-token
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: github-runner-registration-octokit-call
  desc: Octokit requests runner registration token
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: "\\.(createRegistrationTokenFor(Repo|Org)|generateRunnerJitconfigFor(Repo|Org))\\s*\\("
- id: github-issue-label-api
  desc: GitHub issue label endpoint path
  conf: 0.84
  if:
    type: text
    regex: /repos/[^'"\s]{1,160}/(labels|issues/[^'"\s]{1,80}/labels)\b
  not:
  - substr: "/repos/{owner}/{repo}/labels"
  - substr: "/repos/{owner}/{repo}/issues/"
  - regex: /repos/:[^/'"\s]+/:[^/'"\s]+/
  - substr: "/repos/${"
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: github-issue-comment-api
  desc: GitHub issue comment API path
  crit: notable
  conf: 0.92
  if:
    type: text
    regex: /repos/[^'"\s]{1,160}/issues/[^'"\s]{1,80}/comments\b
  not:
  - substr: "/repos/{owner}/{repo}/issues/"
  unless:
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/tool/detection/sast/
- id: github-pr-comments-url-field
  desc: Reads GitHub pull request comments URL
  crit: notable
  conf: 0.98
  for:
  - shell
  if:
    type: symbol
    kind: call
    exact: jq
    arg:
      kind: identifier
      name: ".pull_request.comments_url"
- id: github-actions-environments-api
  desc: GitHub Actions environments API path
  conf: 0.9
  for:
  - javascript
  - typescript
  - python
  - shell
  if:
    type: text
    regex: /repos/[^'"\s]{1,160}/environments\b
  not:
  - substr: "/repos/{owner}/{repo}/environments"
- id: github-issues-api
  desc: GitHub issues API path
  crit: notable
  conf: 0.88
  for:
  - python
  - javascript
  - typescript
  - shell
  if:
    type: text
    regex: api\.github\.com/repos/.{1,120}/issues(\?|/(\{.{1,20}\}|[0-9]+)(/comments)?)?\b
- id: github-issues-search-api
  desc: GitHub issues search API endpoint
  crit: notable
  conf: 0.9
  for:
  - csharp
  - python
  - javascript
  - typescript
  - powershell
  - go
  if:
    type: text
    regex: api\.github\.com/search/issues\b
- id: github-git-ref-create-request
  desc: GitHub API git reference creation body
  crit: notable
  conf: 0.92
  for:
  - shell
  - python
  - javascript
  - typescript
  if:
    type: text
    regex: '"ref":\s*"refs/tags/'
- id: github-event-git-refs-url
  desc: Git refs URL from workflow event payload
  crit: notable
  conf: 0.94
  for:
  - shell
  if:
    type: text
    substr: repository.git_refs_url
- id: github-rest-api-version-header
  desc: GitHub REST API version header
  crit: notable
  conf: 0.9
  for:
  - javascript
  - typescript
  - python
  - shell
  if:
    type: text
    substr: X-GitHub-Api-Version
composite_rules:
- id: github-git-trees-recursive-api
  desc: Recursively lists a GitHub repository tree
  crit: notable
  conf: 0.94
  for:
  - scripts
  - source
  - binaries
  - github-actions
  all:
  - id: micro-behaviors/communications/http/services/github::github-git-trees-api-endpoint
  - id: micro-behaviors/data/config/syntax::recursive-option-enabled-text
  near_bytes: 256
- id: github-private-org-repository-list
  desc: Lists private GitHub organization repositories
  crit: notable
  conf: 0.94
  for:
  - scripts
  - source
  - binaries
  - github-actions
  all:
  - id: micro-behaviors/communications/http/services/github::github-org-repositories-endpoint
  - id: micro-behaviors/communications/http/services/github::github-private-repository-filter
  near_bytes: 320
- id: github-paginated-private-org-repository-list
  desc: Private GitHub organization repository-list endpoint with per-page option
  crit: notable
  conf: 0.96
  for:
  - scripts
  - source
  - binaries
  - github-actions
  all:
  - id: micro-behaviors/communications/http/services/github::github-org-repositories-endpoint
  - id: micro-behaviors/communications/http/services/github::github-private-repository-filter
  - id: micro-behaviors/communications/url/query/selection::per-page-query-parameter
  near_bytes: 640
- id: github-paginated-private-user-repository-list
  desc: Private GitHub user repository-list endpoint with per-page option
  crit: notable
  conf: 0.97
  for:
  - scripts
  - source
  - binaries
  - github-actions
  all:
  - id: micro-behaviors/communications/http/services/github::github-authenticated-user-repositories-list-api
  - id: micro-behaviors/communications/http/services/github::github-private-repository-visibility-filter
  - id: micro-behaviors/communications/http/services/github::github-repository-affiliation-filter
  - id: micro-behaviors/communications/url/query/selection::per-page-query-parameter
  near_bytes: 640
- id: github-gist-file-write-api
  desc: GitHub Gist file write API request
  crit: notable
  conf: 0.94
  for:
  - scripts
  - "!jcl"
  all:
  - id: micro-behaviors/communications/http/services/github::github-gist-api-url
  - id: micro-behaviors/data/serialize/schema-object::files-object-field
  - id: micro-behaviors/data/serialize/schema-object::content-object-field
  any:
  - id: micro-behaviors/communications/http/patch::http-patch-client-call
  - id: micro-behaviors/communications/http/patch::quoted-patch-token
  near_bytes: 1400
- id: github-graphql-options-endpoint
  desc: GitHub GraphQL endpoint request options
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/services/github::github-api-host
  - id: micro-behaviors/communications/http/graphql::graphql-path-literal
  near_bytes: 512
- id: github-graphql-create-commit
  desc: GitHub GraphQL repository commit write
  crit: notable
  conf: 0.98
  for:
  - javascript
  - typescript
  - python
  - shell
  - powershell
  - ruby
  all:
  - id: micro-behaviors/communications/http/services/github::github-graphql-create-commit-on-branch
  any:
  - id: micro-behaviors/communications/http/services/github::github-graphql-api-endpoint
  - id: micro-behaviors/communications/http/services/github::github-graphql-options-endpoint
  near_bytes: 2048
- id: github-create-repo-api
  desc: Explicit GitHub repository creation API request
  crit: notable
  conf: 0.9
  for:
  - shell
  - batch
  - powershell
  - python
  - javascript
  - typescript
  - github-actions
  any:
  - id: micro-behaviors/communications/http/services/github::github-create-repo-http-request
  - id: micro-behaviors/communications/http/services/github::github-create-repo-shell-request
  - id: micro-behaviors/communications/http/services/github::github-user-repo-client-post
  - id: micro-behaviors/communications/http/services/github::github-user-repo-fetch-post
- id: github-contents-api-write-flow
  desc: GitHub repository contents API write request
  crit: notable
  conf: 0.94
  for:
  - shell
  - python
  - javascript
  - rust
  - go
  - powershell
  all:
  - id: micro-behaviors/communications/http/services/github::github-contents-api-endpoint
  any:
  - id: micro-behaviors/communications/http/request/result::http-put-client-call
  - id: micro-behaviors/communications/http/lib/invoke-webrequest::powershell-put-client-call
  - id: micro-behaviors/communications/http/request/result::http-fetch-put-request
  - id: micro-behaviors/communications/http/request/result::http-curl-put-request
  - id: micro-behaviors/communications/http/put::axios-put-call
  - id: micro-behaviors/communications/http/put::net-http-put
  - id: micro-behaviors/communications/http/put::javascript-put-request-body
  - id: micro-behaviors/communications/http/put::rust-reqwest-client-put
  near_bytes: 1024
- id: github-create-release-api
  desc: GitHub create release API call
  conf: 0.85
  for:
  - shell
  - python
  - javascript
  - typescript
  - github-actions
  all:
  - id: micro-behaviors/communications/http/services/github::github-release-api
  any:
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/http/post::node-http-request-post
- id: github-create-repo
  desc: GitHub repository creation workflow API
  crit: notable
  conf: 0.9
  for:
  - shell
  - batch
  - powershell
  - python
  - javascript
  - typescript
  - github-actions
  any:
  - id: micro-behaviors/communications/http/services/github::github-create-repo-api
  - id: micro-behaviors/communications/http/services/github::github-create-repo-octokit-call
  - id: micro-behaviors/communications/http/services/github::github-create-repo-org-call
- id: github-create-repo-and-contents-write
  desc: GitHub creation and contents-write APIs
  crit: notable
  conf: 0.95
  for:
  - shell
  - python
  - javascript
  - typescript
  - github-actions
  all:
  - id: micro-behaviors/communications/http/services/github::github-create-repo
  any:
  - id: micro-behaviors/communications/http/services/github::github-contents-client-put
  - id: micro-behaviors/communications/http/services/github::github-contents-fetch-put
  - id: micro-behaviors/communications/http/services/github::github-contents-write-endpoint
  - id: micro-behaviors/communications/http/services/github::github-create-or-update-file-contents
- id: github-python-issue-maintenance
  desc: Python GitHub issue maintenance flow
  crit: component
  conf: 0.9
  for:
  - python
  all:
  - id: micro-behaviors/communications/http/authorization-header::github-python-token-auth-header
  - id: micro-behaviors/communications/http/services/github::github-issues-api
