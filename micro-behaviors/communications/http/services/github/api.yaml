defaults:
  platforms: [unix, windows]
  for: [shell, python, javascript, ruby]
  crit: notable
traits:
- id: github-gist-api-url
  desc: References the GitHub Gist API endpoint
  crit: notable
  conf: 0.84
  for: [python, javascript, typescript, shell]
  if:
    type: string_literal
    substr: api.github.com/gists/
- id: github-create-repo-http-request
  desc: Explicit GitHub repository creation HTTP request
  crit: notable
  conf: 0.9
  for: [python, javascript, typescript]
  if:
    type: text
    regex: '(?i)\brequest\s*\(\s*[''\"]POST\s+/user/repos\b'
- id: github-create-repo-shell-request
  desc: Shell posts to GitHub repository endpoint
  crit: notable
  conf: 0.9
  for: [shell, batch, powershell, github-actions]
  if:
    type: text
    regex: '(?i)\b(curl|wget)\b[^\n]{0,160}(-X|--request)\s+POST[^\n]{0,160}/user/repos\b'
- id: github-api-host
  desc: GitHub API host reference
  crit: baseline
  conf: 0.86
  for: [javascript, typescript, python, shell]
  if:
    type: text
    substr: api.github.com
- id: github-app-installation-token-api
  desc: GitHub App installation token API
  conf: 0.88
  for: [javascript, typescript, python, shell]
  if:
    type: text
    substr: /app/installations/
- id: github-create-repo-octokit-call
  desc: Octokit creates authenticated repository
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '\.createForAuthenticatedUser\s*\('
- id: github-create-repo-org-call
  desc: Octokit creates organization repository
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    regex: '\.createInOrg\s*\('
- id: github-create-or-update-file-contents
  desc: GitHub file contents write API
  conf: 0.92
  if:
    type: text
    regex: \.createOrUpdateFileContents\s*\(
- id: github-contents-template-api
  desc: GitHub contents API template
  conf: 0.86
  for: [javascript, typescript]
  if:
      type: text
      substr: "api.github.com/repos/${"
- id: github-contents-api-endpoint
  desc: GitHub repository contents API endpoint
  conf: 0.86
  for: [javascript, typescript, python, shell, rust, go, c, cpp, pe, dll]
  if:
    type: text
    regex: 'api\.github\.com/repos/.{1,120}/contents/'
- id: github-contents-read-request
  desc: GitHub repository contents read request
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    substr: 'GET /repos/{owner}/{repo}/contents/{path}'
- id: github-contents-write-request
  desc: GitHub repository contents write request
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    substr: 'PUT /repos/{owner}/{repo}/contents/{path}'
- id: github-contents-delete-request
  desc: GitHub repository contents delete request
  crit: notable
  conf: 0.9
  for: [javascript, typescript]
  if:
    type: text
    substr: 'DELETE /repos/{owner}/{repo}/contents/{path}'
- id: github-git-blob-api-endpoint
  desc: GitHub Git blob API endpoint
  conf: 0.88
  for: [javascript, typescript, python, shell]
  if:
    type: text
    regex: 'api\.github\.com.{0,80}/git/blobs'
- id: github-get-authenticated-user
  desc: GitHub authenticated user lookup API
  conf: 0.8
  if:
    type: text
    regex: \.getAuthenticated\s*\(|users\]\[[^]]{0,40}get
- id: github-release-api
  desc: GitHub releases API path
  conf: 0.6
  for: [shell, python, javascript, typescript, github-actions]
  if:
    type: text
    regex: /repos/.{0,60}/releases
  not:
  - substr: /repos/eugeny/tabby/releases
  - substr: /repos/Microsoft/vscode-linux-bu
- id: github-runner-registration-api
  desc: GitHub Actions runner registration API call
  conf: 0.9
  if:
    type: text
    substr: actions/runners/registration-token
- id: github-issue-label-api
  desc: GitHub issue label API path
  conf: 0.84
  if:
    type: text
    regex: '/repos/[^''"\s]{1,160}/(labels|issues/[^''"\s]{1,80}/labels)\b'
  not:
  - substr: /repos/{owner}/{repo}/labels
  - substr: /repos/{owner}/{repo}/issues/
- id: github-issue-comment-api
  desc: GitHub issue comment API path
  crit: component
  conf: 0.92
  if:
    type: text
    regex: '/repos/[^''"\s]{1,160}/issues/[^''"\s]{1,80}/comments\b'
  not:
  - substr: /repos/{owner}/{repo}/issues/
  unless:
  - id: micro-behaviors/process/interpreter/vm/
  - id: well-known/tool/detection/sast/
- id: github-actions-environments-api
  desc: GitHub Actions environments API path
  conf: 0.9
  for: [javascript, typescript, python, shell]
  if:
    type: text
    regex: '/repos/[^''"\s]{1,160}/environments\b'
  not:
  - substr: /repos/{owner}/{repo}/environments
- id: github-issues-api
  desc: GitHub issues API path
  crit: component
  conf: 0.88
  for: [python, javascript, typescript, shell]
  if:
    type: text
    regex: 'api\.github\.com/repos/.{1,120}/issues(\?|/(\{.{1,20}\}|[0-9]+)(/comments)?)?\b'
- id: github-python-token-auth-header-bracket
  desc: "Python GitHub token auth hdr from os.environ"
  crit: component
  conf: 0.88
  for: [python]
  if:
    type: text
    regex: 'Authorization.{0,80}os\.environ\[[''"]GITHUB_TOKEN'
- id: github-python-token-auth-header-get
  desc: 'github python token auth header get'
  crit: component
  conf: 0.88
  for: [python]
  if:
    type: text
    regex: 'Authorization.{0,80}os\.environ\.get\([''"]GITHUB_TOKEN'
- id: github-python-token-auth-header-var
  desc: Python GitHub token auth header from variable
  crit: component
  conf: 0.86
  for: [python]
  if:
    type: text
    regex: 'Authorization.{0,80}GITHUB_TOKEN'
- id: github-python-client-import
  desc: Python imports the PyGithub client
  crit: component
  conf: 0.95
  for: [python]
  if:
    type: import
    exact: Github
- id: github-python-client-token
  desc: PyGithub client initialized with token
  crit: component
  conf: 0.92
  for: [python]
  if:
    type: text
    regex: 'Github\s*\(\s*[A-Za-z_][A-Za-z0-9_.]*token[A-Za-z0-9_.]*\s*\)'
- id: github-js-token-auth-header-env
  desc: JS GitHub token auth from process.env
  crit: component
  conf: 0.88
  for: [javascript, typescript]
  if:
    type: text
    regex: 'Authorization.{0,120}process\.env\.GITHUB_TOKEN'
- id: github-rest-api-version-header
  desc: GitHub REST API version header
  crit: component
  conf: 0.9
  for: [javascript, typescript, python, shell]
  if:
    type: text
    substr: X-GitHub-Api-Version
- id: github-create-repo-auto-init-field
  desc: GitHub create-repo auto-init field
  crit: component
  conf: 0.84
  for: [javascript, typescript, python, shell]
  if:
    type: text
    substr: auto_init
composite_rules:
- id: github-create-repo-api
  desc: Explicit GitHub repository creation API request
  crit: notable
  conf: 0.9
  for: [shell, batch, powershell, python, javascript, typescript, github-actions]
  any:
  - id: github-create-repo-http-request
  - id: github-create-repo-shell-request
- id: github-contents-api-write-flow
  desc: GitHub repository contents API write request
  crit: notable
  conf: 0.94
  for: [shell, python, javascript, typescript, powershell, ruby, go, rust]
  all:
  - id: github-contents-api-endpoint
  any:
  - id: micro-behaviors/communications/http/request/result::http-put-client-call
  - id: micro-behaviors/communications/http/request/result::http-fetch-put-request
  - id: micro-behaviors/communications/http/request/result::http-curl-put-request
  - id: micro-behaviors/communications/http/put::axios-put-call
  - id: micro-behaviors/communications/http/put::net-http-put
  - id: micro-behaviors/communications/http/put::javascript-put-request-body
  near_bytes: 512
- id: github-create-release-api
  desc: GitHub create release API call
  conf: 0.85
  for: [shell, python, javascript, typescript, github-actions]
  all:
  - id: github-release-api
  any:
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/http/post::node-https-request-post
- id: github-create-repo
  desc: GitHub repository creation workflow API
  crit: notable
  conf: 0.9
  for: [shell, batch, powershell, python, javascript, typescript, github-actions]
  any:
  - id: github-create-repo-api
  - id: github-create-repo-octokit-call
  - id: github-create-repo-org-call
  - id: github-create-repo-rest-fields
- id: github-create-repo-rest-fields
  desc: GitHub repository creation request fields
  crit: notable
  conf: 0.88
  for: [javascript, typescript, python, shell]
  near_bytes: 8192
  all:
  - id: github-rest-api-version-header
  - id: github-create-repo-auto-init-field
- id: github-python-token-auth-header
  desc: Python GitHub token auth header
  crit: component
  conf: 0.88
  for: [python]
  any:
  - id: github-python-token-auth-header-bracket
  - id: github-python-token-auth-header-get
  - id: github-python-token-auth-header-var
- id: github-python-token-client
  desc: Python configures an authenticated PyGithub client
  crit: notable
  conf: 0.92
  for: [python]
  all:
  - id: github-python-client-import
  - id: github-python-client-token
- id: github-js-token-auth-header
  desc: JavaScript GitHub API token auth header
  crit: component
  conf: 0.88
  for: [javascript, typescript]
  all:
  - id: github-api-host
  - id: github-js-token-auth-header-env
- id: github-python-issue-maintenance
  desc: Python GitHub issue maintenance flow
  crit: component
  conf: 0.9
  for: [python]
  all:
  - id: github-python-token-auth-header
  - id: github-issues-api
