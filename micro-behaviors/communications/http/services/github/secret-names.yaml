defaults:
  platforms: [unix, windows]
  for: [scripts, source]

composite_rules:
- id: secret-names-with-actions-api
  desc: Secret names with GitHub Actions endpoint references
  crit: notable
  conf: 0.94
  all:
  - id: micro-behaviors/os/env/secret-name::deployment-secret-name-list
  any:
  - id: micro-behaviors/communications/http/services/github::github-actions-secret-inventory-endpoint
  - id: micro-behaviors/communications/http/services/github::github-workflow-dispatch-api
  unless:
  - id: well-known/tool/development/toolchain/deno::source-archive-context
