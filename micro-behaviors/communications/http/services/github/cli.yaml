defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: gh-issue-mgmt
    desc: GitHub CLI repository workflow operations
    crit: notable
    unless:
      - type: basename
        regex: '\.typ$'
    if:
      type: text
      regex: gh (issue|label|repo|pr)\b
  - id: gh-issue-edit
    desc: GitHub CLI edits an issue
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bgh\s+issue\s+edit\b'
