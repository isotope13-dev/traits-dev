defaults:
  platforms:
    - unix
    - windows
  for: [scripts, binaries]
traits:
  - id: gh-issue-mgmt
    desc: GitHub CLI repository workflow operations
    crit: notable
    unless:
      - type: basename
        regex: '\.typ$'
    if:
      type: text
      regex: '(?i)(^|[^A-Za-z0-9_-])gh\s+(issue|label|repo|pr)\b'
  - id: gh-issue-edit
    desc: GitHub CLI edits an issue
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '\bgh\s+issue\s+edit\b'
  # Relocated from objectives/exfiltration/http/agentic-ci (2026-08). Passing
  # a body is the documented way to use this command -- it is what `gh issue
  # edit` exists for, and the GitHub CLI's own implementation and docs trip it.
  # The exfiltration composite that consumes this gets its intent from the
  # /proc/<ppid>/environ read it pairs this with, not from the flag.
  - id: gh-issue-edit-body-flag
    desc: GitHub CLI issue edit with body
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?is)\bgh\s+issue\s+edit\b[^\n]{0,96}--body\b'
