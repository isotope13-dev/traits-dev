defaults:
  crit: notable
  for: [shell, python, javascript, typescript, github-actions]
  platforms: [unix, windows]
composite_rules:
  - id: github-release-asset-publisher
    desc: GitHub release and transfer clues
    conf: 0.88
    all:
      - id: well-known/app/development/code-forge/github::github-uploads-api
    any:
      - id: micro-behaviors/communications/http/services/github/release::github-create-release-api
      - id: micro-behaviors/communications/http/curl/body::curl-data-binary
      - id: micro-behaviors/communications/http/request/body/construction::node-http-request-stream-body
      - id: micro-behaviors/communications/http/lib/urllib::urllib-urlopen-data
