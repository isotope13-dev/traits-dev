---
defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - ruby
  crit: notable
traits:
- id: github-release-api
  desc: GitHub REST releases endpoint
  conf: 0.6
  for:
  - shell
  - python
  - javascript
  - typescript
  - go
  - ruby
  - github-actions
  if:
    type: text
    regex: api\.github\.com/repos/[^\s"']{1,120}/releases
  not:
  - substr: "/repos/eugeny/tabby/releases"
  - substr: "/repos/Microsoft/vscode-linux-bu"
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: octokit-release-query
  desc: Queries GitHub release metadata through Octokit
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)repos\\.(getLatestRelease|listReleases)$"
- id: octokit-release-assets-list
  desc: Lists GitHub release assets through Octokit
  crit: notable
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: symbol
    kind: call
    regex: "(^|\\.)repos\\.listReleaseAssets$"
- id: github-release-latest-api-template
  desc: GitHub latest-release API URL template
  conf: 0.95
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: 'https://api\.github\.com/repos/[^`"''\s]{1,100}/releases/latest'
- id: github-asset-download-url-field
  desc: References release asset download URL
  conf: 0.95
  for:
  - javascript
  - typescript
  if:
    type: text
    substr: browser_download_url
composite_rules:
- id: github-latest-release-asset-download
  desc: Latest GitHub release and asset URL
  crit: notable
  conf: 0.95
  for:
  - javascript
  - typescript
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/http/services/github/release::github-release-latest-api-template
  - id: micro-behaviors/communications/http/services/github/release::github-asset-download-url-field
- id: github-create-release-api
  desc: GitHub create release API call
  conf: 0.85
  for:
  - shell
  - python
  - javascript
  - typescript
  - github-actions
  all:
  - id: micro-behaviors/communications/http/services/github/release::github-release-api
  any:
  - id: micro-behaviors/communications/http/post::axios-post-call
  - id: micro-behaviors/communications/http/post::node-http-request-post
