---
defaults:
  platforms:
  - unix
  - windows
  for:
  - shell
  - python
  - javascript
  - ruby
  crit: notable
traits:
- id: github-repo-runner-registration-path
  desc: Concrete GitHub repo runner registration path
  conf: 0.94
  for:
  - shell
  - python
  - javascript
  - typescript
  if:
    type: text
    regex: repos/[^{}:/\s]{1,80}/[^{}:/\s]{1,80}/actions/runners/registration-token
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: github-org-runner-registration-path
  desc: Concrete GitHub org runner registration path
  conf: 0.94
  for:
  - shell
  - python
  - javascript
  - typescript
  if:
    type: text
    regex: orgs/[^{}:/\s]{1,80}/actions/runners/registration-token
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: github-runner-registration-octokit-call
  desc: Octokit requests runner registration token
  conf: 0.96
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: "\\.(createRegistrationTokenFor(Repo|Org)|generateRunnerJitconfigFor(Repo|Org))\\s*\\("
- id: github-actions-environments-api
  desc: GitHub Actions environments API path
  conf: 0.9
  for:
  - javascript
  - typescript
  - python
  - shell
  if:
    type: text
    regex: /repos/[^'"\s]{1,160}/environments\b
  not:
  - substr: "/repos/{owner}/{repo}/environments"
