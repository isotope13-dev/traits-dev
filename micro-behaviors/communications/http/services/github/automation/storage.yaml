# These are storage protocol clues, also present in legitimate cache clients.
# They establish available code paths, not successful uploads or stolen data.
defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
  conf: 0.98

traits:
  - id: actions-cache-service-path
    desc: Actions cache Twirp service path
    if:
      type: text
      substr: /twirp/github.actions.results.api.v1.CacheService
      exclude_comments: true

  - id: actions-cache-create-path
    desc: Actions cache entry creation path
    if:
      type: text
      substr: /CreateCacheEntry
      exclude_comments: true

  - id: actions-cache-finalize-path
    desc: Actions cache upload finalization path
    if:
      type: text
      substr: /FinalizeCacheEntryUpload
      exclude_comments: true

  - id: actions-legacy-cache-api-path
    desc: Actions legacy cache API path
    if:
      type: text
      substr: _apis/artifactcache
      exclude_comments: true

  - id: actions-artifact-container-url-field
    desc: Actions artifact container URL field
    if:
      type: text
      word: fileContainerResourceUrl
      exclude_comments: true

  - id: actions-artifact-workflow-api-path
    desc: Actions workflow artifact API path
    if:
      type: text
      substr: _apis/pipelines/workflows/
      exclude_comments: true

composite_rules:
  - id: actions-cache-v2-upload-paths
    desc: Actions cache creation and upload finalization paths
    all:
      - id: actions-cache-service-path
      - id: actions-cache-create-path
      - id: actions-cache-finalize-path

  - id: actions-artifact-storage-paths
    desc: Actions workflow artifact API and upload container field
    near_lines: 40
    all:
      - id: actions-artifact-workflow-api-path
      - id: actions-artifact-container-url-field

  # Each alternative supplies the same role: an Actions storage protocol.
  - id: actions-storage-upload-paths
    desc: Actions cache or artifact storage API clues
    any:
      - id: actions-cache-v2-upload-paths
      - id: actions-legacy-cache-api-path
      - id: actions-artifact-storage-paths
