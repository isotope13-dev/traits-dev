# A Firebase hostname is a network-service observation; it does not establish
# command-and-control intent by itself.
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, python, javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: firebase-rtdb-endpoint
    desc: Firebase Realtime Database endpoint
    if:
      type: text
      regex: '(?i)\b[a-z0-9-]+\.firebaseio\.com\b'
    not:
      - substr: hacker-news.firebaseio.com
  - id: firebase-auth-signup-endpoint
    desc: Firebase Authentication account-signup endpoint
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: identitytoolkit.googleapis.com/v1/accounts:signUp
  - id: firebase-secure-token-request
    desc: Firebase secure-token request field
    crit: notable
    conf: 0.98
    for: [scripts, source]
    if:
      type: text
      regex: 'returnSecureToken\\?["'']\s*:\s*[Tt]rue'
  - id: firestore-rest-project-root
    desc: Firestore REST project root path
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: firestore.googleapis.com/v1/projects/
  - id: firestore-rest-documents-suffix
    desc: Firestore REST documents collection path
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: /databases/(default)/documents
  - id: firestore-rest-users-collection
    desc: Firestore REST users-collection listing path
    crit: notable
    conf: 0.98
    for: [scripts, source]
    if:
      type: text
      regex: '/databases/\(default\)/documents/users([?"''[:space:]]|$)'
  - id: firebase-password-reset-endpoint
    desc: Firebase out-of-band action endpoint
    crit: notable
    conf: 0.99
    for: [scripts, source]
    if:
      type: text
      substr: identitytoolkit.googleapis.com/v1/accounts:sendOobCode
  - id: firebase-password-reset-request
    desc: Firebase password-reset request payload
    crit: notable
    conf: 0.98
    for: [scripts, source]
    if:
      type: text
      regex: '(?i)requestType\\?["'']\s*:\s*\\?["'']PASSWORD_RESET'
  - id: firebase-auth-domain
    desc: Firebase authentication domain reference
    if:
      type: text
      substr: .firebaseapp.com
  - id: firebase-storage-domain
    desc: Firebase application storage domain reference
    if:
      type: text
      substr: .firebasestorage.app
  - id: pyrebase-client
    desc: Pyrebase Firebase client reference
    if:
      type: text
      substr: pyrebase
      case_insensitive: true
  # The Firebase Admin SDK reads its whole project configuration, database
  # endpoint included, from the FIREBASE_CONFIG environment variable. A
  # program that references this channel assembles its backend from the
  # environment rather than from a declared endpoint, so the database the
  # code answers to need not appear in the artifact at all.
  - id: firebase-config-env-override
    desc: Firebase config environment override reference
    conf: 0.9
    if:
      type: text
      substr: FIREBASE_CONFIG
composite_rules:
  - id: firebase-rest-signup-token-flow
    desc: Obtains a Firebase identity token through REST signup
    crit: notable
    conf: 0.98
    for: [shell, python, javascript]
    all:
      - id: firebase-auth-signup-endpoint
      - id: firebase-secure-token-request
      - id: micro-behaviors/communications/http/device-code::id-token-camel-field
  - id: firestore-rest-documents
    desc: Firestore REST documents API path
    crit: notable
    conf: 0.96
    near_bytes: 512
    all:
      - id: firestore-rest-project-root
      - id: firestore-rest-documents-suffix
