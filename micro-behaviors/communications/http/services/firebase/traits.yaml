# A Firebase hostname is a network-service observation; it does not establish
# command-and-control intent by itself.
defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, python, javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: firebase-rtdb-endpoint
    desc: Firebase Realtime Database endpoint
    if:
      type: text
      regex: '(?i)\b[a-z0-9-]+\.firebaseio\.com\b'
    not:
      - substr: hacker-news.firebaseio.com
  - id: firebase-auth-signup-endpoint
    desc: Firebase Authentication account-signup endpoint
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: identitytoolkit.googleapis.com/v1/accounts:signUp
  - id: firestore-rest-project-root
    desc: Firestore REST project root path
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: firestore.googleapis.com/v1/projects/
  - id: firestore-rest-documents-suffix
    desc: Firestore REST documents collection path
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: /databases/(default)/documents
composite_rules:
  - id: firestore-rest-documents
    desc: Firestore REST documents API path
    crit: notable
    conf: 0.96
    near_bytes: 512
    all:
      - id: firestore-rest-project-root
      - id: firestore-rest-documents-suffix
