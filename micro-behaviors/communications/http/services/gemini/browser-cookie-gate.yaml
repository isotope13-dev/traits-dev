defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: browser-cookie-gated-web-search
    desc: Gemini Web search under cookie opt-in
    if:
      # Call facts do not preserve the enclosing conditional. Require the
      # positive setting check and the call in its consequence, not merely
      # a setting name elsewhere in the archive or in documentation.
      type: tree-sitter
      query: |
        ((if_statement
          condition: (parenthesized_expression
            (member_expression property: (property_identifier) @setting))
          consequence: (statement_block
            (expression_statement
              (assignment_expression
                right: (await_expression
                  (call_expression function: (identifier) @call)))))) @gate
          (#eq? @setting "browserCookieAccess")
          (#eq? @call "geminiWebSearch"))
