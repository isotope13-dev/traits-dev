defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: browser-cookie-gated-web-search
    desc: Gemini Web search under cookie opt-in
    if:
      # Call facts do not preserve the enclosing conditional. Require the
      # positive setting check and the call in its consequence, not merely
      # a setting name elsewhere in the archive or in documentation.
      type: tree-sitter
      query: |
        ((if_statement
          condition: (parenthesized_expression
            (member_expression property: (property_identifier) @setting))
          consequence: (statement_block
            (expression_statement
              (assignment_expression
                right: (await_expression
                  (call_expression function: (identifier) @call)))))) @gate
          (#eq? @setting "browserCookieAccess")
          (#eq? @call "geminiWebSearch"))

  - id: browser-cookie-gated-read
    desc: Browser cookie read inside cookie opt-in branch
    if:
      # The opt-in claim is about the cookie-store read itself, not about
      # one gated consumer: a reader called outside the branch harvests
      # cookies regardless of who gated their own call site. Require the
      # positive setting check to enclose an awaited read/get-cookies call,
      # so a renamed reader that truly gates the read matches while the
      # same package's ungated reader call sites elsewhere do not.
      type: tree-sitter
      query: |
        ((if_statement
          condition: (parenthesized_expression
            (member_expression property: (property_identifier) @setting))
          consequence: (statement_block) @optin)
          (#eq? @setting "browserCookieAccess")
          (#match? @optin "(?i)await[ ]+[A-Za-z0-9_.$]*(read|get)[A-Za-z0-9_.$]*cookies"))
