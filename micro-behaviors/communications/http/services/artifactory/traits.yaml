defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.95

traits:
  - id: service-route
    desc: References a JFrog Artifactory HTTP route
    if:
      type: text
      regex: '/artifactory/[A-Za-z0-9][A-Za-z0-9._/-]{0,180}([?"'']|\b)'

  - id: storage-item-api-route
    desc: References the Artifactory storage item API
    for: [scripts, source, binaries]
    if:
      type: text
      regex: '/(artifactory/)?api/storage/'

  - id: stash-results-route
    desc: Artifactory stash-results API route
    if:
      type: text
      regex: '/(artifactory/)?ui/stashResults(/export)?([?"'']|\b)'

  - id: client-uri-override-header
    desc: Artifactory internal URI override header
    if:
      type: text
      substr: X-Orig-Client-Uri

  - id: package-api-route
    desc: Artifactory Helm or npm API route
    if:
      type: text
      regex: '/artifactory/(api/)?(helm|npm)/'

  - id: go-api-route
    desc: Artifactory Go module API route
    if:
      type: text
      substr: '/artifactory/api/go/'

  - id: internal-metadata-route
    desc: Artifactory internal .jfrog metadata route
    if:
      type: text
      regex: '/artifactory/[^\s"'']{1,180}/\.jfrog([/"'']|\b)'

  - id: token-create-route
    desc: References the Artifactory token-creation API
    if:
      type: text
      regex: '/access/api/v1/tokens([?"'']|\b)|/artifactory/api/security/token([?"'']|\b)'

  - id: registry-join-route
    desc: References the Artifactory registry join API
    if:
      type: text
      regex: '/access/api/v1/registry/join([?"'']|\b)'

  - id: join-key-route
    desc: References the Artifactory cluster join-key API
    if:
      type: text
      regex: '/access/api/v1/system/security/join_key([?"'']|\b)'

  - id: users-api-route
    desc: References the Artifactory user-management API
    if:
      type: text
      regex: '/(artifactory/)?api/security/users([/"'']|\b)|/access/api/(ui|v1)/users([/"'']|\b)'

  - id: plugin-execute-route
    desc: References the Artifactory plugin execution API
    if:
      type: text
      regex: '/(artifactory/)?api/plugins/execute([/"'']|\b)'

  - id: system-configuration-route
    desc: References the Artifactory system config API
    if:
      type: text
      regex: '/(artifactory/)?api/system/configuration([?"'']|\b)'

  - id: admin-grant-field
    desc: Artifactory admin grant field in API payload
    if:
      type: text
      substr: artifactory_admin

  - id: platform-admin-token-scope
    desc: Artifactory platform-administrator token scope
    if:
      type: string_literal
      exact: applied-permissions/admin

  - id: wildcard-platform-token-audience
    desc: Artifactory token targets all service audiences
    if:
      type: text
      regex: '(?i)["'']?audience["'']?\s*[:=]\s*["'']\*@\*["'']'

  - id: nonexpiring-token-request-field
    desc: Artifactory token request disables expiration
    if:
      type: text
      regex: '(?i)["'']?expires_in["'']?\s*[:=]\s*(0|["'']0["''])'

composite_rules:
  - id: nonexpiring-global-admin-token-request
    desc: Requests a non-expiring Artifactory token with global administrator scope
    crit: suspicious
    conf: 0.99
    near_bytes: 600
    all:
      - id: platform-admin-token-scope
      - id: wildcard-platform-token-audience
      - id: nonexpiring-token-request-field

  - id: set-item-properties
    desc: Sets Artifactory item properties through the storage API
    crit: notable
    conf: 0.98
    near_bytes: 4096
    all:
      - id: storage-item-api-route
      - id: micro-behaviors/communications/http/request/route::properties-assignment-query-literal
    any:
      - id: micro-behaviors/communications/http/request/verb::put-method-literal
      - id: micro-behaviors/communications/http/request/result::http-put-client-call
      - id: micro-behaviors/communications/http/request/result::http-put-option
      - id: micro-behaviors/communications/http/lib/requests::requests-put
      - id: micro-behaviors/communications/http/put::put

  - id: get-item-properties
    desc: Retrieves Artifactory item properties through the storage API
    crit: notable
    conf: 0.98
    near_bytes: 4096
    all:
      - id: storage-item-api-route
      - id: micro-behaviors/communications/http/request/route::properties-query-literal
    any:
      - id: micro-behaviors/communications/http/request/verb::get-method-literal
      - id: micro-behaviors/communications/http/lib/requests::requests-get
      - id: micro-behaviors/communications/http/get::fetch-get-call
      - id: micro-behaviors/communications/http/get::http-get
      - id: micro-behaviors/communications/http/get::get
