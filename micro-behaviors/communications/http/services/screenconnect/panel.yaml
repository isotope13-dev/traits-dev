defaults:
  for: [powershell]
  platforms: [windows]
  crit: notable
traits:
  - id: panel-live-data-uri
    desc: References panel live-data API URI
    if:
      type: text
      exclude_comments: true
      regex: '(?i)/PageService\.ashx/GetLiveData\b'
  - id: panel-session-events-uri
    desc: References panel session-events API URI
    if:
      type: text
      exclude_comments: true
      regex: '(?i)/PageService\.ashx/AddSessionEvents\b'
  - id: queued-command-event
    desc: Configures a queued command event
    if:
      type: text
      exclude_comments: true
      regex: '(?i)\bEventType\s*=\s*[''"]QueuedCommand[''"]'
