defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.95

traits:
  - id: api-sports-service-url
    desc: API-Sports service URL
    if:
      type: literal
      regex: '^https?://v[0-9]+\.[a-z-]+\.api-sports\.io(/|$)'

  - id: live-sports-fixture-path
    desc: Live sports fixture query path
    if:
      type: literal
      regex: '^/(fixtures|games)\?live='
