defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9
  mbc: C0002

traits:
  # Native clients and malware may store these strings as UTF-16 or construct
  # them on the stack, while scripts expose them directly as text.
  - id: api-domain
    desc: Dropbox API service domain
    for: [pe, dll, elf, macho]
    conf: 0.8
    if:
      type: encoded
      regex: 'api\.dropbox(api)?\.com'

  - id: api-domain-text
    desc: Dropbox API service domain in script text
    for: [python, javascript, powershell, typescript]
    conf: 0.8
    if:
      type: text
      regex: 'api\.dropbox(api)?\.com'

  - id: content-domain
    desc: Dropbox content API service domain
    for: [pe, dll, elf, macho]
    conf: 0.8
    if:
      type: encoded
      substr: content.dropboxapi.com

  - id: content-domain-text
    desc: Dropbox content API domain in scripts
    for: [python, javascript, powershell, typescript]
    conf: 0.8
    if:
      type: text
      substr: content.dropboxapi.com

  - id: content-domain-shell
    desc: Dropbox content API domain in shell
    for: [shell]
    if:
      type: text
      substr: content.dropboxapi.com

  - id: files-endpoint
    desc: Dropbox files or sharing API path
    for: [pe, dll, elf, macho]
    conf: 0.82
    if:
      type: encoded
      regex: '/2/(files|sharing)/|/1/fileops/'

  - id: files-endpoint-text
    desc: Dropbox file or sharing path in scripts
    for: [python, javascript, powershell, typescript]
    conf: 0.82
    if:
      type: text
      regex: '/2/(files|sharing)/|/1/fileops/'

  - id: upload-method
    desc: Dropbox client upload method
    for: [pe, dll, elf, macho, python, javascript, powershell]
    conf: 0.8
    if:
      type: encoded
      regex: dropbox.{0,50}upload
    unless:
      - id: metadata/package/testing/presence/harness::example-directory
      - id: metadata/package/testing/harness/runtime/

  - id: syncwithdropbox-call
    desc: syncWithDropbox method name
    crit: component
    conf: 0.88
    if:
      type: text
      substr: syncWithDropbox

  - id: encryptvaultdata-call
    desc: encryptVaultData method name
    crit: component
    conf: 0.88
    if:
      type: text
      substr: encryptVaultData

  - id: uploadtodropbox-call
    desc: uploadToDropbox method name
    crit: component
    conf: 0.88
    if:
      type: text
      substr: uploadToDropbox

  - id: files-upload-path
    desc: Dropbox /2/files/upload API path
    for: [pe, dll, elf, macho]
    conf: 0.92
    if:
      type: encoded
      substr: /2/files/upload

  - id: files-upload-path-text
    desc: Dropbox /2/files/upload API path in script text
    for: [python, javascript, powershell, typescript]
    conf: 0.92
    if:
      type: text
      substr: /2/files/upload

  - id: files-upload-path-shell
    desc: Dropbox /2/files/upload API path in shell text
    for: [shell]
    conf: 0.94
    if:
      type: text
      substr: /2/files/upload

composite_rules:
  - id: upload-path
    desc: Dropbox upload API path variant
    crit: component
    any:
      - id: files-upload-path
      - id: files-upload-path-text

  - id: encrypted-vault-sync
    desc: Encrypted vault data synced to Dropbox
    crit: notable
    conf: 0.88
    near_bytes: 800
    all:
      - id: syncwithdropbox-call
      - id: encryptvaultdata-call
      - id: uploadtodropbox-call

  - id: api-access
    desc: Dropbox API client capability
    conf: 0.9
    needs: 2
    any:
      - id: api-domain
      - id: api-domain-text
      - id: content-domain
      - id: content-domain-text
      - id: files-endpoint
      - id: files-endpoint-text
      - id: upload-method
    unless:
      - id: metadata/package/testing/presence/harness::example-directory
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/lib/crypto/better-auth::dropbox-oauth-provider-context

  - id: content-upload-client
    desc: Dropbox client content upload capability
    conf: 0.95
    all:
      - id: upload-path
    any:
      - id: content-domain
      - id: content-domain-text
      - id: api-domain
      - id: api-domain-text
      - id: api-access
    unless:
      - id: well-known/app/storage/syncback/

  - id: content-upload-shell
    desc: Dropbox content upload in shell text
    conf: 0.96
    for: [shell]
    all:
      - id: files-upload-path-shell
      - id: content-domain-shell
    near_bytes: 300
