defaults:
  platforms:
  - windows
  - unix
composite_rules:
- id: telegram-hardcoded-bot-config
  desc: Telegram host, token and chat ID configuration
  crit: notable
  conf: 0.96
  for:
  - binaries
  - scripts
  - source
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/http/services/telegram::telegram-api-host
  - id: micro-behaviors/communications/messaging/send::hardcoded-chat-id-literal
  any:
  - id: micro-behaviors/communications/http/auth::hardcoded-telegram-bot-token-literal
  - id: micro-behaviors/communications/http/auth::powershell-telegram-bot-token-literal
