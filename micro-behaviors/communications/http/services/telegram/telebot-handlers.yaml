defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.9
traits:
- id: py-telebot-handler
  desc: Python bot message-handler decorator text
  if:
    type: text
    substr: '@bot.message_handler'
- id: py-telebot-polling
  desc: Python bot infinity_polling call text
  if:
    type: text
    regex: \b(bot|telebot)\.infinity_polling\s*\(
