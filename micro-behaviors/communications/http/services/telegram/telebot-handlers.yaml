defaults:
  platforms:
  - unix
  - windows
  for:
  - python
  crit: notable
  conf: 0.9
traits:
- id: py-telebot-handler
  desc: Python telebot message handler
  unless:
  - id: well-known/lib/network/pyTelegramBotAPI::telebot-package-path
  - id: well-known/lib/network/pyTelegramBotAPI::pytelegrambotapi-package-archive
  - id: well-known/lib/network/pyTelegramBotAPI::pytelegrambotapi-source-distribution
  - id: well-known/lib/network/pyTelegramBotAPI::github-repository
  - id: metadata/package/testing/presence/harness::example-directory
  - id: metadata/package/testing/presence/harness::python-test-file
  - id: metadata/filename/identity::uppercase-readme-md-basename
  if:
    type: text
    substr: '@bot.message_handler'
- id: py-telebot-polling
  desc: Python telebot polling loop
  unless:
  - id: well-known/lib/network/pyTelegramBotAPI::telebot-package-path
  - id: well-known/lib/network/pyTelegramBotAPI::pytelegrambotapi-package-archive
  - id: well-known/lib/network/pyTelegramBotAPI::pytelegrambotapi-source-distribution
  - id: well-known/lib/network/pyTelegramBotAPI::github-repository
  - id: metadata/package/testing/presence/harness::example-directory
  - id: metadata/package/testing/presence/harness::python-test-file
  - id: metadata/filename/identity::uppercase-readme-md-basename
  if:
    type: text
    regex: \b(bot|telebot)\.infinity_polling\s*\(
