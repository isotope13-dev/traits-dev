defaults:
  platforms:
  - unix
  - windows
  for:
  - binaries
  - scripts
  - source
composite_rules:
- id: telegram-file-api-and-loop
  desc: Telegram file API references coexist with loop
  crit: notable
  conf: 0.97
  near_bytes: 16384
  all:
  - id: micro-behaviors/communications/http/services/telegram::telegram-update-and-file-api-references
  any:
  - id: micro-behaviors/data/control-flow/analysis::while-loop
  - id: micro-behaviors/data/control-flow/loop::infinite-loop-header
  - id: micro-behaviors/data/control-flow/loop::embedded-powershell-while-true
