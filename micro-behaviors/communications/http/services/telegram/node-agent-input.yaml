# Telegram updates can be a user-configured input channel for a local agent.
# Keep the individual message, prompt and process observations neutral; the
# compound capability says only that updates from the configured chat reach an
# agent process, not that the chat is attacker-controlled.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94
  mbc: C0002

traits:
  - id: javascript-telegram-configured-chat-id-gate
    desc: Checks message against configured chat ID
    if:
      type: text
      regex: 'String\(m\.chat\?\.id\)\s*!==\s*String\(cfg\.chatId\)'

  - id: javascript-telegram-message-text-read
    desc: Reads text from a Telegram message object
    if:
      type: text
      regex: 'm\.text\s*\|\|'

  - id: javascript-telegram-message-in-agent-prompt
    desc: Telegram text enters an agent prompt
    if:
      type: text
      regex: 'THEIR NEW TEXT:\\n\$\{said\s*\|\|'

  - id: javascript-agent-process-stdin-prompt
    desc: Child process receives prompt through stdin
    if:
      type: text
      substr: 'child.stdin.end(prompt)'

composite_rules:
  - id: telegram-update-to-configured-agent-input
    desc: Telegram updates from a configured chat reach a local agent process
    crit: notable
    conf: 0.96
    near_bytes: 32768
    all:
      - id: telegram-api-host
      - id: telegram-get-updates-path
      - id: javascript-telegram-configured-chat-id-gate
      - id: javascript-telegram-message-text-read
      - id: javascript-telegram-message-in-agent-prompt
      - id: micro-behaviors/process/create/exec::child-process-execution
      - id: micro-behaviors/process/create/spawn::child-process-creation-api
      - id: javascript-agent-process-stdin-prompt
