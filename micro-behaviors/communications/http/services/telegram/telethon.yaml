defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable

traits:
  - id: telegram-client-open-call
    desc: Constructs a Telegram session client
    conf: 0.92
    if:
      type: symbol
      exact: TelegramClient
  - id: telegram-session-authorization-check
    desc: Checks Telegram session authorization
    conf: 0.94
    if:
      type: text
      regex: '\.is_user_authorized\s*\('

composite_rules:
  - id: telegram-session-client-validation
    desc: Validates a Telegram session client
    conf: 0.97
    near_bytes: 2400
    all:
      - id: telegram-client-open-call
      - id: telegram-session-authorization-check
