# Python code that feeds Telegram messages into a local agent's work queue.
# These observe where incoming chat text goes, nothing more: a personal
# assistant with an opt-in bot does the same as a remote-control implant.
# Whether it is control over the host is decided by the composites that add
# what happens to the queued text.
defaults:
  platforms: [unix, windows]
  for: [python, whl]
  attack: T1102

traits:
  - id: python-telegram-message-to-agent-job
    desc: Telegram message queues an agent job
    crit: notable
    conf: 0.97
    for: [python]
    if:
      type: text
      regex: 'def\s+handle_message_text\s*\([^)]{0,120}\)[\s\S]{0,700}\.jobs\.put\s*\(\s*BridgeJob'
  - id: python-telegram-input-queue
    desc: Telegram input enters agent queue
    crit: notable
    conf: 0.97
    for: [python]
    if:
      type: text
      regex: 'input_queue\.put\(\s*\{\s*["'']source["'']\s*:\s*["'']telegram["'']'

