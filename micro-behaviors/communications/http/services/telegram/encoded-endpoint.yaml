defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
traits:
- id: encoded-bot-api-endpoint
  desc: Telegram bot endpoint in encoded string
  crit: notable
  conf: 0.95
  for:
  - scripts
  - -jcl
  - -applescript
  if:
    type: encoded
    regex: 'api\.telegram\.org/bot[0-9]{6,12}:'
