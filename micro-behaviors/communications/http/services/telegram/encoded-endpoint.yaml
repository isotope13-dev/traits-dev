defaults:
  platforms:
  - windows
  - unix
  for:
  - binaries
  - scripts
traits:
- id: encoded-bot-api-endpoint
  desc: Telegram bot endpoint in encoded string
  crit: notable
  conf: 0.95
  for:
  - scripts
  - javascript
  - typescript
  - -jcl
  - -applescript
  if:
    type: encoded
    regex: 'api\.telegram\.org/bot[0-9]{6,12}:'

- id: base64-telegram-bot-host-prefix
  desc: Base64 Telegram Bot API host prefix
  crit: notable
  conf: 0.98
  for: [javascript, typescript]
  if:
    type: encoded
    encoding: base64
    exact: https://api.telegram.org/bot

- id: base64-telegram-bot-token
  desc: Base64-encoded Telegram bot token
  crit: notable
  conf: 0.98
  for: [javascript, typescript]
  if:
    type: encoded
    encoding: base64
    regex: '^[0-9]{8,12}:[A-Za-z0-9_-]{30,}$'

- id: base64-telegram-send-document-path
  desc: Base64 Telegram sendDocument path
  crit: notable
  conf: 0.98
  for: [javascript, typescript]
  if:
    type: encoded
    encoding: base64
    exact: /sendDocument

composite_rules:
- id: plaintext-telegram-document-upload-endpoint
  desc: Telegram document upload endpoint with bot token
  crit: notable
  conf: 0.98
  for: [javascript, typescript]
  scope: file
  near_bytes: 12000
  all:
  - id: telegram-api-host
  - id: micro-behaviors/communications/http/auth::hardcoded-telegram-bot-token-literal
  - id: micro-behaviors/communications/messaging/send::chat-send-document
  - id: micro-behaviors/communications/http/post::fetch-post-call

- id: encoded-telegram-document-upload-endpoint
  desc: Base64-split Telegram document upload endpoint
  crit: notable
  conf: 0.98
  for: [javascript, typescript]
  scope: file
  near_bytes: 12000
  all:
  - id: base64-telegram-bot-host-prefix
  - id: base64-telegram-bot-token
  - id: base64-telegram-send-document-path
  - id: micro-behaviors/communications/http/post::fetch-post-call
