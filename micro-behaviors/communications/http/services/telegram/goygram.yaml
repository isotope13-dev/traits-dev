defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.95

traits:
  - id: goygram-import-reference
    desc: Imports the GoyGram Telegram client library
    if:
      type: text
      regex: '(?i)\bfrom\s+goygram\b|\bimport\s+goygram\b'

  - id: telegram-session-vault-glob
    desc: Recursively glob-searches for .vault files
    conf: 0.92
    if:
      type: text
      regex: '(?i)(glob|rglob)\(.{0,80}\.vault'
