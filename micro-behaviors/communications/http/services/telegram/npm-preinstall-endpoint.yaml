defaults:
  platforms: [unix, windows]
  for: [package.json]

traits:
  - id: preinstall-telegram-send-message-url
    desc: Preinstall references Telegram sendMessage URL
    crit: notable
    conf: 0.95
    if:
      type: value
      path: scripts.preinstall
      regex: '(?i)api\.telegram\.org/bot[^\s"'']{1,100}/sendMessage\b'

  - id: preinstall-telegram-encoded-json-message
    desc: Preinstall encodes a serialized JSON message
    crit: notable
    conf: 0.92
    if:
      type: value
      path: scripts.preinstall
      regex: '(?s)encodeURIComponent\(.{0,250}JSON\.stringify\('
