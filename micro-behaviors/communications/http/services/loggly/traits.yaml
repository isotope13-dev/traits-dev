# Loggly log-ingestion endpoint references (SolarWinds Loggly over HTTPS).
#
# The atoms below detect a client pointed at Loggly's ingestion API: the
# winston transport module plus the `new Loggly()` construction whose options
# carry the account token and the customer subdomain (the subdomain IS the
# endpoint address — `<subdomain>.loggly.com`). A legitimate server
# application ships this openly beside its own logging calls, so every rule
# here stays notable; the consuming composite supplies the reason the
# destination matters (runtime-decoded credentials, a host-fingerprint
# payload, a load-time trigger).
defaults:
  crit: notable
  conf: 0.9
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: winston-loggly-transport-require
    desc: Requires winston Loggly transport module
    conf: 0.95
    if:
      type: text
      regex: 'require\(\s*["'']winston-loggly-bulk["'']\s*\)|from\s+["'']winston-loggly-bulk["'']'
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
  - id: loggly-client-construction
    desc: Constructs Loggly client
    conf: 0.92
    if:
      type: text
      regex: 'new\s+Loggly\s*\('
    unless:
      - id: metadata/lang/scripted::dts-declaration-file
composite_rules:
  - id: loggly-transport-construction
    desc: Loggly log transport configured
    conf: 0.93
    near_bytes: 2000
    all:
      - id: winston-loggly-transport-require
      - id: loggly-client-construction
