defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable

traits:
  - id: ocr-space-host-reference
    desc: OCR.Space API host reference
    conf: 0.98
    if:
      type: text
      substr: api.ocr.space

  - id: ocr-space-parse-image-endpoint
    desc: OCR.Space image parsing endpoint
    conf: 0.98
    if:
      type: text
      regex: 'api\.ocr\.space/Parse/Image([/?#]|$)'
