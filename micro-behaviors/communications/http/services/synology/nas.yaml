# Synology NAS Web API references
# Detects Synology DSM Web API strings used by NAS upload/exfiltration tools
# ATT&CK: T1071 (Application Layer Protocol)
defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, shell]
  attack: T1071
  mbc: C0002
traits:
  - id: syno-filestation-upload
    desc: Synology FileStation upload API reference
    crit: notable
    conf: 0.98
    if:
      type: text
      word: "SYNO.FileStation.Upload"

  - id: syno-filestation-sharing
    desc: Synology FileStation sharing API reference
    crit: notable
    conf: 0.98
    if:
      type: text
      word: "SYNO.FileStation.Sharing"

  - id: syno-api-auth
    desc: Synology API authentication reference
    crit: notable
    conf: 0.98
    if:
      type: text
      word: "SYNO.API.Auth"

  # substr, not exact: on source files a text `exact:` has to consume a whole
  # extracted run, and these endpoints are always built inside a larger
  # expression (`${cfg.HOST}/webapi/entry.cgi`), so the exact form never fired.
  - id: synology-webapi-auth-cgi
    desc: Synology authentication CGI endpoint
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "/webapi/auth.cgi"

  - id: synology-webapi-entry-cgi
    desc: Synology Web API entry endpoint
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: "/webapi/entry.cgi"

  - id: synology-session-filestation
    desc: Synology FileStation session parameter
    crit: notable
    conf: 0.95
    if:
      type: text
      exact: 'session: "FileStation"'

composite_rules:
  - id: synology-nas-api
    desc: Synology NAS Web API usage
    crit: notable
    conf: 0.95
    needs: 2
    any:
      - id: micro-behaviors/communications/http/services/synology::syno-api-auth
      - id: micro-behaviors/communications/http/services/synology::syno-filestation-sharing
      - id: micro-behaviors/communications/http/services/synology::syno-filestation-upload
      - id: micro-behaviors/communications/http/services/synology::synology-session-filestation
      - id: micro-behaviors/communications/http/services/synology::synology-webapi-auth-cgi
      - id: micro-behaviors/communications/http/services/synology::synology-webapi-entry-cgi
  # Documented CLI that streams a user-chosen local file into FileStation.
  # Hex-encoded SID bootstrap is still unusual (see hex-encoded-https-list),
  # but this is not a silent stealer: the operator picks the path.
  - id: synology-nas-cli-uploader
    desc: Synology NAS CLI uploader with usage help
    crit: exception
    conf: 0.98
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/communications/http/services/synology::synology-nas-api
      - id: micro-behaviors/ui/help::script-usage-screen
      - id: micro-behaviors/communications/http/upload::node-local-file-formdata-stream
