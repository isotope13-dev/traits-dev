defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable

traits:
  - id: external-task-creation-request
    desc: Calls external CAPTCHA task creation endpoint
    conf: 0.97
    if:
      type: symbol
      kind: call
      regex: '^(window\.|globalThis\.)?fetch$|^axios(\.post)?$'
      arg:
        index: 0
        regex: '^https://(api\.)?((2captcha|anti-captcha|capsolver)\.com|capmonster\.cloud)/createTask\b'

  - id: captcha-task-id-reference
    desc: CAPTCHA name near taskId field
    conf: 0.9
    if:
      type: text
      regex: '(?i)captcha.{0,160}taskId|taskId.{0,160}captcha'
