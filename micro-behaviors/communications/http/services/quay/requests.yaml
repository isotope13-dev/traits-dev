# Requests-based clients; endpoint spelling is verified in the outgoing URL.
defaults:
  for: [python]
  platforms: [unix, windows]
  crit: notable

traits:
  - id: registry-auth-url-origin
    desc: Requests a registry authentication token
    if:
      type: symbol
      kind: call
      exact: requests.get
      arg:
        index: 0
        from:
          value: '/v2/auth'

  - id: service-key-url-origin
    desc: Uploads a Quay service signing key
    if:
      type: symbol
      kind: call
      exact: requests.put
      arg:
        index: 0
        from:
          value: '/keys/services/quay/keys/'

  - id: registry-auth-url-argument
    desc: GET URL names registry auth endpoint
    if:
      type: symbol
      kind: call
      exact: requests.get
      arg:
        index: 0
        regex: '/v2/auth$'

  - id: service-key-url-argument
    desc: PUT URL names Quay signing keys
    if:
      type: symbol
      kind: call
      exact: requests.put
      arg:
        index: 0
        regex: '/keys/services/quay/keys/'

composite_rules:
  - id: registry-auth-request
    desc: Requests a registry authentication token
    any:
      - id: registry-auth-url-origin
      - id: registry-auth-url-argument

  - id: service-key-upload
    desc: Uploads a Quay service signing key
    any:
      - id: service-key-url-origin
      - id: service-key-url-argument
