defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  - json

composite_rules:
  - id: aws-iam-key-and-assumed-role-events
    for: [json]
    desc: IAM key and assumed-role events near each other
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/services/aws-iam::iam-access-key-create-event
      - id: micro-behaviors/communications/http/services/aws-iam::aws-assumed-role-identity-event
    near_bytes: 512

