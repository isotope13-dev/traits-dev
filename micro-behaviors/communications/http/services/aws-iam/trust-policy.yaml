# An IAM role's own trust policy (AssumeRolePolicyDocument) controls who can
# assume it. Unlike a resource policy (S3/KMS), a trust policy that grants
# sts:AssumeRole to a bare wildcard principal with no account/org condition
# lets anyone in AWS assume the role — a recognized critical misconfiguration,
# not a pattern legitimate trust policies use.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json, github-actions]

traits:
  - id: go-iam-integration-test-package
    desc: Go IAM integration test package
    crit: notable
    for: [go]
    if:
      type: text
      regex: '(?m)^package integration\s*$'

  - id: go-iam-integration-test-assertion
    desc: IAM integration test checks API errors
    crit: notable
    for: [go]
    if:
      type: symbol
      kind: call
      exact: checkIAMApiErr

  - id: update-assume-role-policy-cli
    desc: AWS CLI rewrites a role trust policy
    crit: notable
    conf: 0.97
    for: [shell, powershell, batch]
    if:
      type: symbol
      kind: call
      exact: aws
      args:
        - name: iam
        - name: update-assume-role-policy

  - id: update-assume-role-policy-call
    desc: AWS SDK UpdateAssumeRolePolicy call
    crit: notable
    conf: 0.93
    for: [python, javascript, typescript, go, java, csharp, php, ruby]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)update[_-]?assume[_-]?role[_-]?policy$'

  - id: update-assume-role-policy-workflow
    desc: Workflow rewrites an AWS role trust policy
    crit: notable
    for: [github-actions]
    if:
      type: value
      path: jobs.*.steps[*].run
      regex: '(?m)^\s*(timeout +[0-9]+ +)?aws +iam +update-assume-role-policy\b'

  - id: update-assume-role-policy-wrapped-shell
    desc: Timeout invokes AWS IAM trust rewrite
    crit: notable
    for: [shell]
    if:
      type: symbol
      kind: call
      exact: timeout
      args:
        - index: 1
          name: aws
        - index: 2
          name: iam
        - index: 3
          name: update-assume-role-policy

  - id: trust-policy-wildcard-aws-principal
    desc: Trust policy names a wildcard AWS principal
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"Principal"\s*:\s*\{\s*"AWS"\s*:\s*"\*"'

  - id: sts-assume-role-trust-action
    desc: Policy names sts:AssumeRole action
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '"Action"\s*:\s*"sts:AssumeRole"'

  - id: trust-policy-allow-effect
    desc: Policy statement has an Allow effect
    crit: notable
    if:
      type: text
      regex: '"Effect"\s*:\s*"Allow"'

  - id: trust-policy-condition-field
    desc: Policy contains a Condition field
    crit: notable
    if:
      type: text
      regex: '"Condition"\s*:'

composite_rules:
  - id: go-iam-integration-test-context
    desc: Go IAM integration test checks API errors
    crit: exception
    for: [go]
    all:
      - id: go-iam-integration-test-package
      - id: go-iam-integration-test-assertion

  - id: update-assume-role-policy-operation
    for: [scripts, typescript, go, java, csharp, github-actions, -lua, -perl, -applescript, -vbs, -mirc, -ircii]
    desc: AWS role trust-policy rewrite operation
    crit: notable
    conf: 0.95
    any:
      - id: update-assume-role-policy-cli
      - id: update-assume-role-policy-call
      - id: update-assume-role-policy-workflow
      - id: update-assume-role-policy-wrapped-shell

  - id: assume-role-trust-policy-open-to-all
    desc: Trust policy permits any AWS account
    crit: suspicious
    conf: 0.95
    attack: T1098
    all:
      - id: trust-policy-wildcard-aws-principal
      - id: trust-policy-allow-effect
      - id: sts-assume-role-trust-action
    near_bytes: 120
    unless:
      - id: metadata/package/testing/harness/unit::go-test-source-file
      - id: go-iam-integration-test-context
      - id: trust-policy-condition-field
      - id: micro-behaviors/data/config/syntax::aws-caller-account-condition-key
