# IAM credential issuance across SDK and CLI forms. API operations remain
# neutral; the persistence consumer requires an administrator grant as well.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  crit: notable
  conf: 0.95

traits:
  - id: iam-user-create-js-command
    desc: AWS IAM CreateUser SDK command
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)CreateUserCommand$'

  - id: iam-access-key-create-js-command
    desc: AWS IAM CreateAccessKey SDK command
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)CreateAccessKeyCommand$'

  - id: iam-access-key-create-cli
    desc: AWS IAM create-access-key invocation
    for: [shell, powershell, batch]
    if:
      type: symbol
      kind: call
      exact: aws
      args:
        - name: iam
        - name: create-access-key

composite_rules:
  - id: iam-access-key-create-operation
    desc: AWS IAM access key creation
    any:
      - id: iam-access-key-create-call
      - id: iam-access-key-create-js-command
      - id: iam-access-key-create-cli
      - id: iam-access-key-create-event
