defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.94

traits:
  - id: git-items-api-url
    desc: References the Azure DevOps Git Items API
    if:
      type: text
      exclude_comments: true
      regex: 'dev\.azure\.com/[^\s"'']{1,160}/_apis/git/repositories/'
  - id: code-search-api-endpoint
    desc: Azure DevOps code search API endpoint
    conf: 0.95
    if:
      type: text
      exclude_comments: true
      regex: '(?i)(almsearch\.dev\.azure\.com|/_apis/search/codesearchresults\b)'
