defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  attack: T1071.001
  mbc: C0002
  crit: notable
  conf: 0.9

traits:
  - id: feishu-openapi-domain
    desc: Feishu OpenAPI endpoint domain
    if:
      type: text
      substr: open.feishu.cn

  - id: feishu-incoming-webhook
    desc: Feishu incoming bot webhook path
    crit: notable
    conf: 0.94
    for: [python, javascript, typescript]
    if:
      type: text
      substr: open.feishu.cn/open-apis/bot/v2/hook/

  - id: feishu-hardcoded-incoming-webhook
    desc: Feishu webhook embeds a recipient token
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: 'open\.feishu\.cn/open-apis/bot/v2/hook/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'

  - id: feishu-hardcoded-error-hook
    desc: Feishu error webhook embeds a recipient token
    crit: suspicious
    conf: 0.98
    for: [javascript, typescript]
    if:
      type: text
      regex: 'errorHook\s*:\s*["'']https://open\.feishu\.cn/open-apis/bot/v2/hook/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'

  - id: feishu-provider-fallback
    desc: Uses Feishu when no logger is configured
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)(provider|loggerProvider)\s*=.{0,24}\|\|\s*["'']feishu["'']'

  - id: feishu-import-provider-fallback
    desc: Falls back to the Feishu logger implementation
    crit: notable
    conf: 0.92
    for: [javascript, typescript]
    if:
      type: text
      regex: '\|\|\s*import_feishu\.feishuLoggerProvider'

  - id: feishu-record-body-builder
    desc: Serializes application record data into a Feishu post body
    crit: notable
    conf: 0.94
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?is)record\.(payload|extra)[\s\S]{0,800}msg_type\s*:\s*["'']post["'']'

  - id: feishu-tenant-token-endpoint
    desc: Feishu tenant token endpoint
    if:
      type: text
      substr: /open-apis/auth/v3/tenant_access_token/internal

  - id: feishu-app-credential-fields
    desc: Feishu credential field name
    crit: component
    conf: 0.86
    if:
      type: text
      regex: '(?i)\bapp[_-](id|secret)\b'

  - id: larksuite-node-sdk-dependency
    desc: LarkSuite Node SDK dependency
    for: [package.json]
    if:
      type: value
      path: dependencies
      substr: '@larksuiteoapi/node-sdk'

composite_rules:
  - id: feishu-openapi-client
    desc: Feishu OpenAPI client usage
    crit: notable
    conf: 0.94
    all:
      - id: feishu-openapi-domain
    any:
      - id: feishu-tenant-token-endpoint
      - id: feishu-app-credential-fields
      - id: larksuite-node-sdk-dependency
