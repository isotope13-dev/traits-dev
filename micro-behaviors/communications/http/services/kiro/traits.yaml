# First-party Kiro OAuth API endpoints. A gateway that reads the local Kiro
# SSO token and POSTs its refresh_token grant back to Kiro's own issuer is
# round-tripping the credential to its rightful owner, not exfiltrating it
# to a third party.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.99

traits:
  - id: desktop-social-refresh-endpoint
    desc: Kiro desktop social refresh endpoint
    if:
      type: text
      substr: 'https://prod.us-east-1.auth.desktop.kiro.dev/refreshToken'
