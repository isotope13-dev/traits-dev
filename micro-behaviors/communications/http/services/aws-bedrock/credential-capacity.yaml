defaults:
  platforms: [unix, windows]
  for: [scripts, source]

composite_rules:
  - id: aws-bedrock-credential-capacity-probe
    desc: Explicit AWS credentials with Bedrock discovery and inference calls
    crit: notable
    conf: 0.97
    all:
      - id: micro-behaviors/communications/http/token-auth::aws-access-key-live-check
      - id: bedrock-model-discovery-operation
      - id: bedrock-model-invocation-operation
