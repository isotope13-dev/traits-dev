composite_rules:
- id: python-aws-authentication-header-reference
  desc: Python AWS authentication or target header references
  crit: notable
  conf: 0.9
  platforms:
  - unix
  - windows
  for:
  - python
  any:
  - id: micro-behaviors/communications/http/services/aws::sigv4-algorithm-constant
  - id: micro-behaviors/communications/http/header/custom::aws-target-header-reference
  - id: micro-behaviors/communications/http/token-auth::aws-security-token-header-reference
  unless:
  - id: metadata/package/testing/
  - id: well-known/lib/cloud/botocore::aws-python-sdk-source
  - id: metadata/path::test-directory-component
