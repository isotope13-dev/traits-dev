defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
composite_rules:
- id: javascript-imds-v2-credential-endpoint-set
  desc: IMDSv2 token and IAM credential endpoints with TTL header
  crit: notable
  conf: 0.98
  near_bytes: 2048
  all:
  - id: micro-behaviors/communications/http/services/aws::aws-imds-v2-token-endpoint
  - id: micro-behaviors/communications/http/header/security::aws-imds-token-ttl-header
  - id: micro-behaviors/communications/http/services/aws::ec2-imds-iam-credentials-endpoint
  unless:
  - id: metadata/package/testing/
  - id: well-known/lib/cloud/aws-sdk-js/
  - id: well-known/lib/format/stacksjs-ts-cloud::ts-cloud-aws-runtime-context
