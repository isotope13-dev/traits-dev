# Amazon Bedrock model-runtime and audit-surface operations, plus the
# Bedrock API-key (IAM service-specific credential) markers. Neutral
# capabilities on their own: subscribing to and invoking a foundation
# model, or issuing a long-term Bedrock key, is ordinary account usage.
# The LLMjacking objective composites under
# objectives/impact/cryptojacking/remote-compute/ add intent by combining
# these with identity creation, AdministratorAccess grants, marketplace
# subscription and audit-log deletion from the same attack chain.
defaults:
  platforms: [unix, windows]
  # Source languages and CloudTrail JSON share the operation vocabulary.
  for: [scripts, source, json]
  crit: notable
  conf: 0.92

traits:
  # `invoke_model` / `invoke_model_with_response_stream` (boto3),
  # `InvokeModel` (Java/Go v2 SDKs) — the model-invocation entry points.
  - id: bedrock-invoke-model-call
    desc: Amazon Bedrock model invocation call
    for: [python, javascript, typescript, java, ruby, go, csharp, php]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)invoke[_-]?model([_-]?with[_-]?response[_-]?stream)?$'

  - id: bedrock-converse-stream-call
    desc: Amazon Bedrock streaming converse call
    for: [python, javascript, typescript, java, ruby, go, csharp, php]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)converse[_-]?stream$'

  # `aws bedrock-runtime invoke-model|converse` CLI form.
  - id: bedrock-invoke-model-cli
    desc: Amazon Bedrock model invocation command
    for: [shell, batch, powershell]
    if:
      type: text
      regex: '\baws\s+bedrock-runtime\s+(invoke[_-]?model|converse)\b'

  # JS SDK v3 InvokeModelCommand / ConverseStreamCommand constructors.
  - id: bedrock-invoke-model-js-command
    desc: Amazon Bedrock model invocation SDK command
    for: [javascript, typescript]
    if:
      type: text
      regex: '\b(InvokeModel(WithResponseStream)?|ConverseStream)Command\b'

  # Bedrock model invocation as a CloudTrail (data) event.
  - id: bedrock-invoke-model-event
    desc: Amazon Bedrock model invocation event
    for: [json]
    if:
      type: text
      regex: '"eventName"\s*:\s*"(InvokeModel|InvokeModelWithResponseStream|Converse|ConverseStream)"'

  # Bedrock invocation logging captures request-level detail CloudTrail
  # does not; deleting the configuration removes that audit surface.
  - id: bedrock-invocation-logging-delete-call
    desc: Bedrock invocation logging deletion call
    for: [python, javascript, typescript, java, ruby, go, csharp, php]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)delete[_-]?invocation[_-]?logging[_-]?configuration$'

  - id: bedrock-invocation-logging-delete-cli
    desc: Bedrock invocation logging deletion command
    for: [shell, batch, powershell]
    if:
      type: text
      regex: '\baws\s+bedrock\s+delete[_-]?invocation[_-]?logging[_-]?configuration\b'

  - id: bedrock-invocation-logging-delete-event
    desc: Bedrock invocation logging deletion event
    for: [json]
    if:
      type: text
      regex: '"eventName"\s*:\s*"DeleteInvocationLoggingConfiguration"'

  # The ServiceName parameter that scopes an IAM service-specific
  # credential to Bedrock — the long-term Bedrock API key. Matches the
  # boto3/SDK keyword argument, the `--service-name bedrock.amazonaws.com`
  # CLI flag value, and the CloudTrail requestParameters field.
  - id: bedrock-service-credential-parameter
    desc: Bedrock service credential ServiceName arg
    if:
      type: text
      regex: '(?i)service[_-]?name["'']?\s*[:= ]\s*["'']?bedrock\.amazonaws\.com'

  # Environment variable holding a Bedrock API key bearer token.
  - id: bedrock-api-key-bearer-token-env
    desc: Bedrock API key bearer token env variable
    for: [scripts, source]
    if:
      type: text
      substr: AWS_BEARER_TOKEN_BEDROCK

composite_rules:
  - id: bedrock-model-invocation-operation
    desc: Amazon Bedrock model invocation operation
    crit: notable
    any:
      - id: bedrock-invoke-model-call
      - id: bedrock-converse-stream-call
      - id: bedrock-invoke-model-cli
      - id: bedrock-invoke-model-js-command
      - id: bedrock-invoke-model-event

  - id: bedrock-invocation-logging-delete-operation
    desc: Bedrock invocation logging deletion operation
    crit: notable
    any:
      - id: bedrock-invocation-logging-delete-call
      - id: bedrock-invocation-logging-delete-cli
      - id: bedrock-invocation-logging-delete-event
