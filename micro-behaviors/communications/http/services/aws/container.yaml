# Ordinary AWS credential-provider configuration; no theft claim.
# Intent remains in consumers that require collection and C2 evidence.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: node-ecs-relative-credential-endpoint-reference
    desc: ECS credential URI beside link-local host
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: "AWS_CONTAINER_CREDENTIALS_RELATIVE_URI[^\\r\\n]{0,260}169\\.254\\.170\\.2"

