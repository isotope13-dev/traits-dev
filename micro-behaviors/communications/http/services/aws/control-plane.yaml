# AWS control-plane operations are neutral capabilities on their own. The
# account-abuse composite below needs executable-looking method-call syntax;
# generated SDK models and PHPDoc contain operation names without invoking them.
defaults:
  platforms: [unix, windows]
  # Script text, source languages, and CloudTrail JSON share the operation
  # spelling. This directory is allowlisted for broad service text matchers.
  for: [scripts, source, json]
  crit: notable
  conf: 0.92

traits:
  - id: serial-console-enable-operation
    desc: AWS serial console enable method call
    for: [php]
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)(->|\.)\s*enable[_-]?serial[_-]?console[_-]?access\s*\('

  - id: iam-user-create-operation
    desc: AWS IAM CreateUser method call
    for: [php]
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)(->|\.)\s*create[_-]?user\s*\('

  - id: iam-access-key-create-operation
    desc: AWS IAM CreateAccessKey method call
    for: [php]
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)(->|\.)\s*create[_-]?access[_-]?key\s*\('

  - id: iam-password-policy-update-operation
    desc: AWS IAM password-policy update method call
    for: [php]
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)(->|\.)\s*update[_-]?account[_-]?password[_-]?policy\s*\('

  - id: subnet-delete-operation
    desc: AWS subnet deletion operation
    if:
      type: text
      regex: '(?i)\bdelete[_-]?subnet\b'

  - id: domain-transfer-lock-disable-operation
    desc: AWS domain-lock disable operation
    if:
      type: text
      regex: '(?i)\bdisable[_-]?domain[_-]?transfer[_-]?lock\b'

  - id: lambda-function-list-operation
    desc: AWS Lambda function-list operation
    for: [python, javascript, typescript, ruby, php, java]
    if:
      type: symbol
      kind: call
      regex: '(?i)^list[_-]?functions(20150331)?$'

  - id: kms-decrypt-operation
    desc: AWS KMS decrypt operation
    if:
      type: text
      regex: '(?i)(\bkms[.:_-]decrypt\b|\bdecryptcommand\b|"event(Name|\.action)"\s*:\s*"Decrypt")'

  - id: s3-replication-write-operation
    desc: AWS S3 replication configuration write
    if:
      type: text
      regex: '(?i)\bput[_-]?bucket[_-]?replication\b'
