# AWS control-plane API operations are neutral capabilities on their own.
# Objective composites under objectives/ add intent by requiring related
# operations from the same attack chain.
defaults:
  platforms: [unix, windows]
  # Source languages and CloudTrail JSON share the operation vocabulary.
  for: [scripts, source, json]
  crit: notable
  conf: 0.92

traits:
  - id: serial-console-enable-operation
    desc: AWS serial console enable method call
    for: [php]
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)(->|\.)\s*enable[_-]?serial[_-]?console[_-]?access\s*\('

  # The AWS SDK for PHP spells its operations in camelCase (`->createUser(`).
  # Keeping this matcher exact avoids matching ordinary CMS create_user calls.
  - id: iam-user-create-call
    desc: AWS IAM CreateUser method call
    for: [php]
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)(->|\.)\s*createuser\s*\('
    unless:
      - id: metadata/package/testing/presence/fixture::php-test-file

  # boto3-style `iam.create_user(` / `iam_client.create_user(`. The iam-prefixed
  # receiver keeps this off unrelated create_user methods (Django managers, ORMs).
  - id: iam-user-create-python
    desc: AWS IAM CreateUser client call
    for: [python]
    if:
      type: text
      regex: '\biam[a-z0-9_]*\.create_user\s*\('

  - id: iam-user-create-cli
    desc: AWS IAM create-user CLI invocation
    for: [shell, batch, powershell]
    if:
      type: text
      regex: '(?i)\baws\s+iam\s+create[_-]?user\b'

  # CloudTrail records the same operation as an eventName.
  - id: iam-user-create-event
    desc: AWS IAM CreateUser event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"CreateUser"'

  - id: iam-access-key-create-operation
    desc: AWS IAM CreateAccessKey method call
    for: [python, javascript, typescript, go, java, csharp, php]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)create[_-]?access[_-]?key$'

  # CloudTrail records carry the same operation as an eventName rather than
  # as a source call. Keep this structural so prose that mentions the API
  # does not look like an access-key creation event.
  - id: iam-access-key-create-event
    desc: AWS IAM CreateAccessKey event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"CreateAccessKey"'

  - id: aws-assumed-role-identity-event
    desc: AWS CloudTrail assumed-role caller
    for: [json]
    if:
      type: text
      regex: '(?is)"userIdentity"\s*:\s*\{.{0,160}"type"\s*:\s*"AssumedRole"'

  # IAM service-specific credentials are long-term keys scoped to one
  # service. Bedrock API keys are issued through this mechanism; the
  # bedrock-scoped parameter lives in aws/bedrock.yaml.
  - id: iam-service-specific-credential-call
    desc: AWS IAM service-specific credential call
    for: [python, javascript, typescript, java, ruby, go, csharp, php]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(create|reset|update|delete)[_-]?service[_-]?specific[_-]?credential$'

  - id: iam-service-specific-credential-cli
    desc: AWS IAM service-specific credential CLI
    for: [shell, batch, powershell]
    if:
      type: text
      regex: '(?i)\baws\s+iam\s+(create|reset|update|delete)[_-]service[_-]specific[_-]credential\b'

  - id: iam-service-specific-credential-event
    desc: AWS IAM service-specific credential event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"(Create|Reset|Update|Delete)ServiceSpecificCredential"'

  # AWS Marketplace Agreement Service operations — the control-plane
  # surface for subscribing an account to paid offers such as foundation
  # models (CLI: `aws marketplace-agreement ...`).
  - id: marketplace-agreement-call
    desc: AWS Marketplace agreement method call
    for: [python, javascript, typescript, java, ruby, go, csharp, php]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(create|accept|cancel)[_-]?agreement([_-]?request)?$'

  - id: marketplace-agreement-cli
    desc: AWS Marketplace agreement CLI invocation
    for: [shell, batch, powershell]
    if:
      type: text
      regex: '(?i)\baws\s+marketplace[_-]agreement\s+(create|accept|cancel)\b'

  - id: marketplace-agreement-event
    desc: AWS Marketplace agreement event
    for: [json]
    if:
      type: text
      regex: '"eventName"\s*:\s*"(Create|Accept|Cancel)AgreementRequest"'

  # The AWS Marketplace Agreement Service endpoint, as a CloudTrail
  # eventSource or an API URL in source/scripts.
  - id: marketplace-agreement-service-host
    desc: AWS Marketplace agreement service endpoint
    if:
      type: text
      regex: 'agreement[-]?marketplace\.amazonaws\.com'

  # The AWS-managed policy ARN granting full account control. Referencing
  # it is legitimate IaC; combining it with credential issuance is the
  # objective composites' job.
  - id: iam-administratoraccess-policy-reference
    desc: AWS AdministratorAccess policy ARN
    if:
      type: text
      regex: '(?i)\barn:aws:iam::aws:policy/AdministratorAccess\b'

  - id: iam-password-policy-update-operation
    desc: AWS IAM password-policy update operation
    for: [php]
    if:
      type: tree-sitter
      kind: call
      regex: '(?i)(->|\.)\s*update[_-]?account[_-]?password[_-]?policy\s*\('

  - id: subnet-delete-operation
    desc: AWS subnet deletion operation
    if:
      type: text
      regex: '(?i)\bdelete[_-]?subnet\b'
    unless:
      - id: well-known/lib/cloud/alibaba-cloud-go::alibaba-cloud-go-library
      - id: metadata/library/cloud-sdk::aws-python-sdk-source

  - id: domain-transfer-lock-disable-operation
    desc: AWS domain-lock disable operation
    if:
      type: text
      regex: '(?i)\bdisable[_-]?domain[_-]?transfer[_-]?lock\b'

  - id: lambda-function-list-operation
    desc: AWS Lambda function-list operation
    for: [python, javascript, typescript, ruby, php, java]
    if:
      type: symbol
      kind: call
      regex: '(?i)^list[_-]?functions(20150331)?$'

  - id: kms-decrypt-operation
    desc: AWS KMS decrypt operation
    if:
      type: text
      regex: '(?i)(\bkms[.:_-]decrypt\b|\bdecryptcommand\b|"event(Name|\.action)"\s*:\s*"Decrypt")'
    unless:
      - id: well-known/lib/cloud/alibaba-cloud-go::alibaba-cloud-go-library

  - id: s3-replication-write-operation
    desc: AWS S3 replication configuration write
    if:
      type: text
      regex: '(?i)\bput[_-]?bucket[_-]?replication\b'

  - id: aws-assume-role-call
    desc: AWS STS AssumeRole call
    for: [python, javascript, typescript, java, ruby, go, php]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)assume[_-]?role$'

  - id: aws-assume-role-event
    desc: AWS STS AssumeRole event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"AssumeRole"'

  - id: aws-iam-role-arn
    desc: AWS IAM role ARN with account ID
    for: [python, javascript, typescript, java, ruby, go, php, json]
    if:
      type: text
      regex: '(?i)arn:aws:iam::[0-9]{12}:role/'
    unless:
      - id: metadata/package/testing/presence/harness::go-test-file

  # Source AST calls cover Python, JavaScript, Java and other supported
  # languages without matching an API name in a prose comment.
  - id: aws-key-pair-creation-call
    desc: AWS EC2 key-pair creation call
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)create[_-]?key[_-]?pair$'
    unless:
      - id: well-known/lib/cloud/alibaba-cloud-go::alibaba-cloud-go-library

  - id: aws-ssh-public-key-call
    desc: AWS SSH public-key injection call
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)send[_-]?ssh[_-]?public[_-]?key$'

  - id: aws-serial-console-ssh-key-call
    desc: AWS serial-console SSH key call
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)send[_-]?serial[_-]?console[_-]?ssh[_-]?public[_-]?key$'

  - id: aws-openid-provider-call
    desc: AWS OpenID provider modification call
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(add|create)[A-Za-z0-9_-]*open[_-]?id[_-]?connect[_-]?provider$'

  - id: aws-saml-provider-call
    desc: AWS SAML provider modification call
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(create|update|delete)[_-]?saml[_-]?provider$'

  - id: aws-cloudtrail-log-disable-call
    desc: AWS CloudTrail logging disable call
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(delete[_-]?trail|stop[_-]?logging)$'
    unless:
      - id: well-known/lib/cloud/alibaba-cloud-go::alibaba-cloud-go-library

  - id: aws-cloudtrail-log-update-call
    desc: AWS CloudTrail trail update call
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)update[_-]?trail$'
    unless:
      - id: well-known/lib/cloud/alibaba-cloud-go::alibaba-cloud-go-library

  - id: aws-flow-logs-delete-call
    desc: AWS VPC Flow Logs deletion call
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)delete[_-]?flow[_-]?logs$'

  - id: aws-guardduty-detector-call
    desc: AWS GuardDuty detector change call
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)(delete|update)[_-]?detector$'

  - id: aws-guardduty-ip-set-call
    desc: AWS GuardDuty IP-set change call
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)create[_-]?ip[_-]?set$'

  - id: aws-instance-export-call
    desc: AWS EC2 instance export call
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)create[_-]?instance[_-]?export[_-]?task$'

  - id: aws-run-instances-call
    desc: AWS EC2 instance launch call
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)run[_-]?instances$'
    unless:
      - id: well-known/lib/cloud/alibaba-cloud-go::alibaba-cloud-go-library

  # Anchor the field to an instance-launch API or request type. `UserData` by
  # itself is a common application-model property.
  - id: aws-user-data-call-parameter
    desc: AWS EC2 user-data call parameter
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: text
      regex: '(?is)\b(runInstances|RunInstancesRequest).{0,256}\bUserData\s*[:=]'
    unless:
      # `type UserData = {...}` / `interface UserData` / `class UserData` is a
      # locally declared shape (type-fest's docs use exactly this name), not a
      # RunInstances parameter — the `=` there is a declaration, not an arg.
      - type: text
        regex: '\b(type|interface|class)\s+UserData\b'

  # CloudTrail eventName is a structural field, so this does not match the
  # article's prose or a comment that merely names an API.
  - id: aws-key-pair-creation-event
    desc: AWS EC2 key-pair creation event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"CreateKeyPair"'

  - id: aws-ssh-public-key-event
    desc: AWS SSH public-key injection event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"(SendSSHPublicKey|SendSerialConsoleSSHPublicKey)"'

  - id: aws-openid-provider-event
    desc: AWS OpenID provider change event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"CreateOpenIDConnectProvider"'

  - id: aws-openid-provider-client-event
    desc: AWS OpenID provider client-add event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"AddClientIDToOpenIDConnectProvider"'

  - id: aws-saml-provider-event
    desc: AWS SAML provider change event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"(CreateSAMLProvider|UpdateSAMLProvider|DeleteSAMLProvider)"'

  - id: aws-cloudtrail-logging-event
    desc: AWS CloudTrail logging change event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"(DeleteTrail|StopLogging|UpdateTrail)"'

  - id: aws-flow-logs-delete-event
    desc: AWS VPC Flow Logs deletion event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"DeleteFlowLogs"'

  - id: aws-guardduty-detector-event
    desc: AWS GuardDuty detector change event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"(DeleteDetector|UpdateDetector)"'

  - id: aws-guardduty-ip-set-event
    desc: AWS GuardDuty IP-set change event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"CreateIPSet"'

  - id: aws-instance-export-event
    desc: AWS EC2 instance export event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"CreateInstanceExportTask"'

  - id: aws-run-instances-event
    desc: AWS EC2 instance launch event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"RunInstances"'

  - id: aws-user-data-event-parameter
    desc: AWS EC2 user-data event parameter
    for: [json]
    if:
      type: text
      regex: '(?i)"userData"\s*:'

  - id: iam-attach-user-policy-call
    desc: AWS IAM AttachUserPolicy call
    for: [python, javascript, typescript, java, ruby, go]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)attach[_-]?user[_-]?policy$'

  - id: iam-attach-user-policy-event
    desc: AWS IAM AttachUserPolicy event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"AttachUserPolicy"'

  - id: iam-deny-all-policy-reference
    desc: AWS IAM AWSDenyAll policy ARN
    if:
      type: text
      regex: '(?i)\barn:aws:iam::aws:policy/AWSDenyAll\b'

  # Root console authentication is represented as a sign-in event rather than
  # an ordinary IAM API call. Repeated structural fields are neutral log facts;
  # the password-spray objective combines them with repeated failures.
  - id: multiple-aws-cloudtrail-root-identities
    desc: Multiple AWS CloudTrail root identities
    for: [json]
    count_min: 2
    if:
      type: text
      regex: '(?is)"userIdentity"\s*:\s*\{[^\}]{0,512}"type"\s*:\s*"Root"'

  - id: multiple-aws-signin-service-events
    desc: Multiple AWS sign-in service events
    for: [json]
    count_min: 2
    if:
      type: text
      regex: '(?i)"eventSource"\s*:\s*"signin\.amazonaws\.com"'

  - id: multiple-aws-console-login-events
    desc: Multiple AWS console login events
    for: [json]
    count_min: 2
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"ConsoleLogin"'

composite_rules:
  - id: iam-user-create-operation
    desc: AWS IAM CreateUser operation
    crit: notable
    any:
      - id: iam-user-create-call
      - id: iam-user-create-python
      - id: iam-user-create-cli
      - id: iam-user-create-event

  - id: iam-service-specific-credential-operation
    desc: AWS IAM service-specific credential operation
    crit: notable
    any:
      - id: iam-service-specific-credential-call
      - id: iam-service-specific-credential-cli
      - id: iam-service-specific-credential-event

  - id: marketplace-agreement-operation
    desc: AWS Marketplace agreement operation
    crit: notable
    any:
      - id: marketplace-agreement-call
      - id: marketplace-agreement-cli
      - id: marketplace-agreement-event
      - id: marketplace-agreement-service-host

  - id: multiple-aws-root-console-login-events
    desc: Multiple AWS root console login events
    crit: notable
    for: [json]
    all:
      - id: multiple-aws-cloudtrail-root-identities
      - id: multiple-aws-signin-service-events
      - id: multiple-aws-console-login-events

  - id: aws-key-pair-creation-operation
    desc: AWS EC2 key-pair creation operation
    crit: notable
    any:
      - id: aws-key-pair-creation-call
      - id: aws-key-pair-creation-event

  - id: aws-ssh-public-key-operation
    desc: AWS SSH public-key injection operation
    crit: notable
    any:
      - id: aws-ssh-public-key-call
      - id: aws-serial-console-ssh-key-call
      - id: aws-ssh-public-key-event

  - id: aws-identity-provider-operation
    desc: AWS identity-provider modification operation
    crit: notable
    any:
      - id: aws-openid-provider-call
      - id: aws-saml-provider-call
      - id: aws-openid-provider-event
      - id: aws-saml-provider-event

  - id: aws-cloudtrail-logging-operation
    desc: AWS CloudTrail logging modification
    crit: notable
    any:
      - id: aws-cloudtrail-log-disable-call
      - id: aws-cloudtrail-log-update-call
      - id: aws-cloudtrail-logging-event

  - id: aws-flow-logs-operation
    desc: AWS VPC Flow Logs deletion
    crit: notable
    any:
      - id: aws-flow-logs-delete-call
      - id: aws-flow-logs-delete-event

  - id: iam-attach-user-policy-operation
    desc: AWS IAM AttachUserPolicy operation
    crit: notable
    any:
      - id: iam-attach-user-policy-call
      - id: iam-attach-user-policy-event

  - id: aws-guardduty-detector-operation
    desc: AWS GuardDuty detector modification
    crit: notable
    any:
      - id: aws-guardduty-detector-call
      - id: aws-guardduty-detector-event

  - id: aws-guardduty-ip-set-operation
    desc: AWS GuardDuty IP-set modification
    crit: notable
    any:
      - id: aws-guardduty-ip-set-call
      - id: aws-guardduty-ip-set-event

  - id: aws-instance-export-operation
    desc: AWS EC2 instance export operation
    crit: notable
    any:
      - id: aws-instance-export-call
      - id: aws-instance-export-event

  - id: aws-run-instances-operation
    desc: AWS EC2 instance launch operation
    crit: notable
    any:
      - id: aws-run-instances-call
      - id: aws-run-instances-event

  - id: aws-assume-role-operation
    desc: AWS STS AssumeRole operation
    crit: notable
    any:
      - id: aws-assume-role-call
      - id: aws-assume-role-event

  - id: aws-user-data-parameter
    desc: AWS EC2 user-data parameter
    crit: notable
    any:
      - id: aws-user-data-call-parameter
      - id: aws-user-data-event-parameter
