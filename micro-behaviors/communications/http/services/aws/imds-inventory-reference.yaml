defaults:
  platforms:
  - unix
  - windows
  for:
  - python
composite_rules:
- id: python-imds-secret-inventory-references
  desc: AWS IMDS and secret-inventory references
  crit: notable
  conf: 0.97
  all:
  - id: micro-behaviors/communications/http/services/aws::aws-imds-v2-token-endpoint
  - id: micro-behaviors/communications/http/services/cloud::secret-inventory-method-set
  any:
  - id: micro-behaviors/communications/http/services/aws::python-aws-authentication-header-reference
  - id: metadata/lang/source/naming/action::aws-header-generator-symbol
