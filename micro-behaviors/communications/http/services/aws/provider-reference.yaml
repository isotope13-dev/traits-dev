defaults:
  platforms: [unix, windows]
  for: [python, shell, javascript, typescript, php, go, source]
composite_rules:
  - id: aws-metadata-reference
    desc: AWS instance metadata endpoint reference
    crit: notable
    conf: 0.9
    unless:
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: metadata/package/documentation/agent-safety::security-example-documentation
    any:
      - id: micro-behaviors/communications/http/services/aws::aws-metadata-endpoint
      - id: micro-behaviors/communications/http/services/aws::aws-ecs-task-credentials-endpoint
      - id: micro-behaviors/communications/http/services/aws::aws-imds-v2-token-path
      - id: micro-behaviors/communications/http/header/custom::aws-imds-token-ttl-header
      - id: micro-behaviors/os/security/auth/cloud::node-aws-container-credential-uri
