defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable

traits:
  - id: aws-imds-v2-token-endpoint
    for: [scripts, source, binaries, text, data, json]
    desc: AWS IMDSv2 token endpoint
    conf: 0.9
    if:
      type: text
      substr: 169.254.169.254/latest/api/token

  - id: aws-user-data-endpoint
    desc: AWS EC2 user-data endpoint
    conf: 0.9
    entropy_max: 7.8
    if:
      type: text
      regex: '(https?://)?169\.254\.169\.254/latest/user-data/?\b'

  - id: aws-imds-v2-token-path
    desc: AWS IMDSv2 token request path
    conf: 0.88
    if:
      type: text
      substr: /latest/api/token

  - id: aws-instance-id-metadata-path
    desc: AWS instance-id metadata path
    conf: 0.88
    if:
      type: text
      substr: /latest/meta-data/instance-id
    unless:
      - id: well-known/tool/sysadmin/unix-benign::openbsd-cloud-agent
      - type: basename
        exact: cloud-agent

  - id: aws-metadata-endpoint
    desc: AWS EC2 metadata endpoint
    conf: 0.85
    if:
      type: text
      substr: '169.254.169.254/latest/meta-data'
    unless:
      - id: micro-behaviors/data/parse/vocabulary::labeled-attack-traffic-corpus
      - id: metadata/package/testing/presence/manifest::test-fixtures
      - id: metadata/package/testing/harness/runtime/
      - id: well-known/tool/development/vscode-extension/vscode-marketplace::m365-agents-toolkit-vsix

  - id: aws-instance-metadata-relative-path
    desc: AWS instance metadata relative path
    conf: 0.85
    if:
      type: text
      substr: instance-data/latest/meta-data

  - id: aws-ecs-credentials-base-path
    desc: AWS ECS task credentials base endpoint
    conf: 0.95
    for: [scripts, package.json, binaries, source, text]
    if:
      type: text
      regex: '169\.254\.170\.2/v[0-9]+/credentials'

  - id: aws-ecs-task-credentials-endpoint
    desc: AWS ECS task credentials endpoint
    conf: 0.95
    for: [scripts, package.json, binaries]
    if:
      type: text
      regex: '169\.254\.170\.2/v[0-9]+/[A-Za-z0-9][A-Za-z0-9-]{15,}'

  - id: aws-ecs-iam-metadata-path
    desc: AWS ECS host with IAM metadata path
    conf: 0.95
    for: [scripts, package.json, binaries]
    if:
      type: text
      regex: '169\.254\.170\.2[\s\S]{0,360}/latest/meta-data/iam/security-credentials'
