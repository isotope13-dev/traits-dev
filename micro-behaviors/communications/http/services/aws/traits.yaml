defaults:
  platforms: [unix, windows]
  for:
    - javascript
    - typescript
traits:
  # AWS Signature Version 4 algorithm identifier. This is the universal SigV4
  # constant emitted by every AWS request signer (aws4, aws-sdk, boto3, ...),
  # not the fingerprint of any single library. Neutral cloud-signing capability.
  # The file default is JS/TS, but SigV4 signers exist in every language --
  # aws-sdk-go-v2, botocore and every S3-compatible client emit this same
  # constant -- so this atom widens past that default.
  - id: sigv4-algorithm-constant
    desc: AWS Signature V4 signing algorithm constant
    crit: notable
    conf: 0.9
    for: [scripts, source, binaries]
    if:
      type: text
      substr: AWS4-HMAC-SHA256

  # EC2 Instance Metadata Service (IMDS) IAM security-credentials endpoint.
  # Reading this path retrieves the instance role's temporary AWS credentials.
  - id: ec2-imds-iam-credentials-endpoint
    desc: EC2 instance-metadata IAM credentials endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: '169.254.169.254/latest/meta-data/iam/security-credentials'

  # metadata/file/string/cloud::aws-iam-credentials-metadata-path was a second
  # atom for this same path (`/latest/meta-data/iam/security-credentials`, a
  # strict subset of the substring below) with the same description, so the two
  # fired together on one string: the analyst read the same sentence twice and
  # the signal split across two ML features. Consolidated here -- reaching the
  # instance role-credential endpoint is a communications fact, not a file
  # property -- and widened to the file types that atom covered.
  - id: iam-credentials-path-reference
    for: [scripts, binaries, source]
    desc: AWS IAM credentials metadata path
    crit: notable
    conf: 0.7
    if:
      type: text
      substr: iam/security-credentials
    unless:
      - id: well-known/tool/development/anthropic-claude-agent/
      - id: metadata/library/data/
      - id: well-known/tool/detection/security-scanner/
      - id: well-known/lib/data/mongodb/
    downgrade:
      any:
        - id: metadata/library/data::aws-sdk-dotnet-core
        - id: metadata/binary/metrics/size::massive-executable

  - id: python-secrets-manager-reference
    for: [python]
    desc: Python references AWS Secrets Manager
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: secretsmanager

  - id: boto3-client-supplied-credentials
    desc: boto3 client receives explicit AWS credentials
    crit: notable
    conf: 0.9
    for: [python]
    unless:
      - id: well-known/app/productivity/keepercommander/
    if:
      type: text
      regex: 'boto3\.client\s*\([\s\S]{0,500}aws_access_key_id\s*='

  - id: javascript-sqs-send-message
    desc: JavaScript sends an AWS SQS message
    crit: notable
    conf: 0.92
    if:
      type: text
      regex: 'new\s+[\w$.]*SQSClient\s*\([^)]{0,256}\)[\s\S]{0,512}new\s+[\w$.]*SendMessageCommand\s*\('

  # aws-cli stamps its userAgent with the execution environment inside the
  # browser-based AWS CloudShell terminal. The marker is structural (an
  # execution-env field value), not a product mention in prose.
  - id: cloudshell-exec-env-user-agent
    for: [json, scripts, source]
    desc: AWS CloudShell execution-environment user agent
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: exec-env/CloudShell

  # CloudTrail sessionContext attribute stating the session was not
  # authenticated with MFA. A log fact on its own; composites give it weight.
  - id: cloudtrail-session-without-mfa
    for: [json]
    desc: AWS CloudTrail session without MFA
    crit: notable
    conf: 0.85
    if:
      type: text
      regex: '"mfaAuthenticated"\s*:\s*"false"'
