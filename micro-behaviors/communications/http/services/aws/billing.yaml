defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  crit: notable
  conf: 0.92

traits:
  - id: billing-get-credits-call
    desc: AWS Billing GetCredits API call
    for: [python, javascript, typescript, java, ruby, go, csharp, php]
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)get[_]?credits$'

  - id: billing-get-credits-js-command
    desc: AWS Billing GetCredits SDK command construction
    for: [javascript, typescript]
    if:
      type: symbol
      kind: call
      regex: '(^|\.)GetCreditsCommand$'

  - id: billing-get-credits-cli
    desc: AWS Billing GetCredits CLI command
    for: [shell, batch, powershell]
    if:
      type: text
      regex: '\baws\s+billing\s+get-credits\b'

composite_rules:
  - id: billing-credit-enumeration-operation
    desc: AWS Billing promotional credit enumeration operation
    any:
      - id: billing-get-credits-call
      - id: billing-get-credits-js-command
      - id: billing-get-credits-cli
