# Neutral observations relocated from attacker-objective rules.
traits:
  - id: native-imds-endpoint-reference
    desc: AWS instance metadata endpoint URL reference
    crit: notable
    conf: 0.94
    unless:
    - type: text
      substr: TryDiscoverPublicIP
    - id: metadata/package/testing/presence/harness::go-test-file
    - id: metadata/package/testing/harness/unit/
    - id: well-known/app/system/olares::cli-source-tree
    if:
      type: text
      substr: http://169.254.169.254/latest/meta-data/
    platforms:
    - unix
    for:
    - go
    - elf
