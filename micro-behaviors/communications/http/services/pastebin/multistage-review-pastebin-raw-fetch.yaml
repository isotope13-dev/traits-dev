defaults:
  platforms: [windows, unix]
  for: [python]

traits:
- id: pastebin-raw-fetch
  desc: Raw Pastebin URL passed to Requests GET
  crit: notable
  conf: 0.92
  if:
    type: symbol
    kind: call
    exact: requests.get
    arg:
      index: 0
      from:
        value: (?i)^https?://pastebin\.com/raw/
