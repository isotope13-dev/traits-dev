defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, package.json]
  attack: T1071.001
  mbc: C0002
  crit: notable
  conf: 0.9

traits:
  - id: dingtalk-oapi-domain
    desc: DingTalk OpenAPI endpoint domain
    if:
      type: literal
      kind: string
      substr: oapi.dingtalk.com

  - id: dingtalk-api-domain
    desc: DingTalk API endpoint domain
    if:
      type: literal
      kind: string
      substr: api.dingtalk.com

  - id: dingtalk-robot-send-endpoint
    desc: DingTalk robot send endpoint
    if:
      type: literal
      kind: string
      substr: /robot/send?access_token=

  - id: dingtalk-token-field
    desc: DingTalk token field
    crit: notable
    conf: 0.86
    if:
      type: literal
      kind: string
      exact: dingToken

  # NOTE: there is deliberately no DingTalk `clientSecret` atom here. That
  # literal is generic OAuth vocabulary shared by every OAuth client; the
  # canonical atom is
  # `micro-behaviors/communications/http/oauth::oauth-client-secret-field`,
  # and DingTalk composites below gate it on a DingTalk endpoint so a bare
  # OAuth client is never attributed to DingTalk.
composite_rules:
  - id: dingtalk-api-endpoint
    desc: DingTalk API endpoint usage
    crit: notable
    conf: 0.92
    any:
      - id: dingtalk-oapi-domain
      - id: dingtalk-api-domain
      - id: dingtalk-robot-send-endpoint

  - id: dingtalk-openapi-client
    desc: DingTalk OpenAPI client usage
    crit: notable
    conf: 0.94
    all:
      - id: dingtalk-api-endpoint
    any:
      - id: dingtalk-token-field
      - id: micro-behaviors/communications/http/oauth::oauth-client-secret-field

  - id: dingtalk-client-context
    desc: DingTalk client context
    crit: component
    conf: 0.9
    any:
      - id: dingtalk-openapi-client
      - id: dingtalk-token-field
