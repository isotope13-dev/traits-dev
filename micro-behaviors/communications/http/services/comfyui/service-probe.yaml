defaults:
  platforms: [windows, unix]
  for: [shell, python]
  crit: suspicious
  conf: 0.9

traits:
  - id: python-json-load-sys-stdin
    desc: Stdin JSON parsing near object-info path
    if:
      type: text
      regex: json\.load\(sys\.stdin\).{0,80}/object_info

composite_rules:
  - id: comfyui-hostile-scanner
    desc: ComfyUI object-info JSON parsing clues
    crit: suspicious
    conf: 0.98
    all:
      - id: micro-behaviors/communications/http/services/comfyui::object-info-endpoint
      - id: python-json-load-sys-stdin
  - id: comfyui-scanner
    desc: ComfyUI object-info curl probe clues
    crit: suspicious
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/comfyui::service-keyword
      - id: micro-behaviors/communications/http/curl/command::curl-command-url-or-option
      - id: micro-behaviors/communications/http/services/comfyui::object-info-endpoint
    near_bytes: 256
