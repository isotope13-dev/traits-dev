# Neutral ComfyUI service references.  A port, service name, or endpoint is
# not a network scan by itself; scanner intent comes from active probe context.
defaults:
  platforms: [windows, unix]
  for: [python, shell]
  crit: notable
  conf: 0.9

traits:
  - id: default-port-8188
    desc: ComfyUI default service port reference
    if:
      type: string_literal
      substr: ':8188'
    unless:
      - id: well-known/app/calvyn-code

  - id: service-keyword
    desc: ComfyUI service name reference
    crit: component
    if:
      type: string_literal
      word: comfyui

  - id: object-info-endpoint
    desc: ComfyUI object-info endpoint reference
    if:
      type: string_literal
      substr: '/object_info'
