# FOFA is an internet asset-search service. The endpoint is a neutral service
# identity; offensive intent belongs in objective composites that combine it
# with unattended targeting and vulnerability-probing behavior.
defaults:
  platforms: [windows, unix]
  for: [python, javascript, typescript, shell, powershell, go, rust, java, json]

traits:
  - id: search-api-endpoint
    desc: Connects to the FOFA asset-search API
    crit: notable
    conf: 0.98
    if:
      type: text
      regex: 'https?://fofa\.info/api/v1/search/all'
