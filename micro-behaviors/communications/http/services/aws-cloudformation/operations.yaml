# CloudFormation stack operations in AWS CLI argv and CloudTrail event
# forms. Stack creation is a neutral deployment capability; the
# cryptojacking and deployment-intent composites under objectives/ combine
# these with payload and session evidence.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, json]
  crit: notable
  conf: 0.9

traits:
  - id: aws-cli-cloudformation-create-stack
    desc: AWS CLI CloudFormation stack creation
    if:
      type: text
      regex: '(?i)\baws\s+cloudformation\s+(create-stack|deploy)\b'

  - id: cloudformation-create-stack-event
    desc: CloudFormation CreateStack CloudTrail event
    for: [json]
    if:
      type: text
      regex: '(?i)"eventName"\s*:\s*"CreateStack"'
