# Structural atoms for CloudFormation template bodies (JSON form). These
# identify what a template declares -- EC2 instance resources, base64
# bootstrap user data, compute-optimized instance families -- without any
# judgment about intent. Objective composites under
# objectives/impact/cryptojacking/remote-compute/ add the payload and
# session context that turns deployment structure into a conviction.
defaults:
  platforms: [unix, windows]
  for: [json]
  crit: notable
  conf: 0.9

traits:
  - id: cfn-ec2-instance-resource
    desc: CloudFormation EC2 instance resource
    if:
      type: text
      regex: '"Type"\s*:\s*"AWS::EC2::Instance"'

  - id: cfn-user-data-base64
    desc: CloudFormation base64 instance bootstrap
    if:
      # UserData wrapping the Fn::Base64 intrinsic is the template grammar
      # for a first-boot script handed to every launched instance.
      type: text
      regex: '(?is)"UserData"\s*:\s*\{.{0,240}"Fn::Base64"'

  - id: cfn-compute-optimized-instance-type
    desc: CloudFormation compute-heavy instance type
    conf: 0.85
    if:
      # Compute (c*), GPU (g*/p*), and xlarge memory families are the
      # hardware mining fleets are built from; t*/general web workloads
      # are not.
      type: text
      regex: '"InstanceType"\s*:\s*"[cgpx][1-9][a-z0-9]*\.([248x]|16)?xlarge"'
