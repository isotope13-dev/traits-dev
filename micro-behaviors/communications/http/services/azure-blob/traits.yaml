defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.85
  mbc: C0002

traits:
  - id: storage-url
    desc: Azure Blob storage URL
    if:
      type: text
      regex: https?://[a-z0-9-]+\.blob\.core\.windows\.net/
    unless:
      - id: metadata/package/files/runtime::javascript-dist-tree-artifact
  - id: block-blob-put-header
    desc: Azure Block Blob upload header
    crit: notable
    conf: 0.97
    for: [javascript, typescript]
    if:
      type: text
      regex: "['\"]x-ms-blob-type['\"]\\s*:\\s*['\"]BlockBlob['\"]"
