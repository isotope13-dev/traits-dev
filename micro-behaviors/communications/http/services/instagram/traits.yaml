defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, html]
  crit: notable
  conf: 0.95
  mbc: C0002

traits:
  - id: instagram-friendship-create-endpoint
    desc: Instagram friendship-create API endpoint
    if:
      type: text
      regex: '(?i)instagram\.com/api/v[0-9]+/friendships/create/'

  - id: instagram-friendship-destroy-endpoint
    desc: Instagram friendship-destroy API endpoint
    if:
      type: text
      regex: '(?i)instagram\.com/api/v[0-9]+/friendships/destroy/'

  - id: instagram-friendship-query-endpoint
    desc: Instagram friendship query API endpoint
    if:
      type: text
      regex: '(?i)instagram\.com/api/v[0-9]+/friendships/(show|show_many)/'
