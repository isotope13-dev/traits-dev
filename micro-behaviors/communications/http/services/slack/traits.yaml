defaults:
  platforms: [unix, windows, fortios]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9
  mbc: C0002

traits:
  - id: slack-incoming-webhook-url
    desc: Slack incoming webhook endpoint
    for: [scripts, binaries]
    conf: 0.94
    if:
      type: literal
      regex: '(^|[^A-Za-z0-9-])hooks\.slack\.com/services/[A-Z0-9]{8,}/[A-Z0-9]{8,}/[A-Za-z0-9]{16,}'
    not:
      - substr: "slack.com/apps/new/"
      - substr: "hooks.slack.com/services/..."
      - substr: "https://hooks.slack.com/"
      - regex: 'hooks\.slack\.com/services/T0{8}/B0{8}/X{16,}'

  - id: slack-web-api-import
    desc: Slack Web API import
    if:
      type: string_literal
      exact: "@slack/web-api"

  - id: slack-socket-mode-import
    desc: Slack Socket Mode import
    if:
      type: string_literal
      exact: "@slack/socket-mode"

  - id: slack-web-client
    desc: WebClient class construction
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\bnew\s+[^;\n]{0,40}WebClient\s*\('

  - id: slack-socket-client
    desc: SocketModeClient class construction
    crit: component
    conf: 0.88
    if:
      type: text
      regex: '\bnew\s+[^;\n]{0,40}SocketModeClient\s*\('

  - id: slack-chat-post
    desc: Slack chat postMessage call
    conf: 0.9
    if:
      type: text
      substr: .chat.postMessage(

  - id: slack-file-upload
    desc: Slack files uploadV2 call
    conf: 0.92
    if:
      type: text
      substr: .files.uploadV2(

  - id: slack-private-download
    desc: Slack private file download
    conf: 0.9
    if:
      type: text
      substr: url_private_download

  - id: go-slack-chat-post-api
    desc: Go posts messages through Slack Web API
    crit: notable
    conf: 0.96
    for: [go]
    if:
      type: string_literal
      regex: 'https://slack\.com/api/chat\.postMessage'

composite_rules:
  - id: slack-incoming-webhook-post
    desc: Posts data to a Slack incoming webhook
    crit: notable
    conf: 0.95
    for: [shell, python, javascript, typescript, powershell, ruby]
    near_bytes: 4096
    all:
      - id: slack-incoming-webhook-url
    any:
      - id: micro-behaviors/communications/http/curl::curl-post-flag
      - id: micro-behaviors/communications/http/lib/requests::requests-post
      - id: micro-behaviors/communications/http/post::axios-post-call
      - id: micro-behaviors/communications/http/request/client::post-method-text

  - id: slack-bot-api-client
    desc: Slack bot API client
    crit: notable
    conf: 0.94
    all:
      - id: slack-web-api-import
    any:
      - id: slack-web-client
      - id: slack-chat-post
      - id: slack-file-upload

  - id: slack-socket-mode-client
    desc: Slack Socket Mode client
    crit: notable
    conf: 0.94
    all:
      - id: slack-socket-mode-import
    any:
      - id: slack-socket-client
      - id: slack-private-download
