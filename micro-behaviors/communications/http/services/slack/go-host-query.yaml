# A notifier can legitimately query host/user identity beside a Slack URL.
defaults:
  platforms:
  - unix
  - windows
  for:
  - go
composite_rules:
- id: go-slack-host-user-query-cooccurrence
  desc: Slack message endpoint with host/user queries
  crit: notable
  conf: 0.98
  all:
  - id: micro-behaviors/communications/http/services/slack::go-slack-chat-post-api
  - id: micro-behaviors/os/sysinfo/hostname::host-and-user-identity-query
