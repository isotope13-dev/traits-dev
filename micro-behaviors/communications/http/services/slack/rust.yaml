# Rust-specific Slack Web API markers not shared with the Go atoms in go.yaml.
defaults:
  platforms: [unix, windows]
  for: [rust]
  crit: notable
  conf: 0.95

traits:
  - id: rust-slack-chat-post
    desc: Rust posts via Slack chat.postMessage
    if:
      type: string_literal
      exact: chat.postMessage
