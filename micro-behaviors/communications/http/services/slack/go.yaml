# Raw Slack Web API primitives in Go. API use is neutral until combined with
# encryption, task retrieval, payload execution, or host-data collection.
defaults:
  platforms: [unix, windows]
  for: [go]
  crit: notable
  conf: 0.95

traits:
  - id: go-slack-api-base-url
    desc: Uses Slack Web API base URL
    if:
      type: string_literal
      exact: "https://slack.com/api/"

  - id: go-slack-conversations-history
    desc: Go source requests Slack conversation history
    if:
      type: string_literal
      exact: conversations.history

  - id: go-slack-auth-test
    desc: Go source authenticates a Slack bot
    if:
      type: string_literal
      exact: auth.test
