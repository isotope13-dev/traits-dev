# Raw Slack Web API primitives in Go and Rust. API use is neutral until
# combined with encryption, task retrieval, payload execution, or host-data
# collection.
defaults:
  platforms: [unix, windows]
  for: [go, rust]
  crit: notable
  conf: 0.95

traits:
  - id: go-slack-api-base-url
    desc: Uses Slack Web API base URL
    if:
      type: string_literal
      exact: "https://slack.com/api/"

  - id: go-slack-conversations-history
    desc: Requests Slack conversation history
    if:
      type: string_literal
      exact: conversations.history

  - id: go-slack-auth-test
    desc: Authenticates a Slack bot via auth.test
    if:
      type: string_literal
      exact: auth.test
