# Have I Been Pwned: the breach-notification and password-exposure API. Code
# that checks passwords against it uses the word "pwned" constantly, which is
# why the defacement/taunt rules -- which read "pwned" as a boast -- treat
# these references as a service integration instead.
defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source]
  crit: notable
  conf: 0.9
traits:
  - id: hibp-service-name
    desc: Have I Been Pwned service reference
    if:
      type: text
      substr: haveibeenpwned
  - id: hibp-pwned-password-phrase
    desc: Pwned-password check phrase
    crit: baseline
    if:
      type: text
      substr: pwned password
