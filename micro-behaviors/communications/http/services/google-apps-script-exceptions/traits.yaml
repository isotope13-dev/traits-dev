      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-macros-path

  - id: google-apps-script-login-validation-context
    desc: Extension login validation context
    crit: exception
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-login-validation-context
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-macros-path

  - id: google-apps-script-extension-feedback-context
    desc: Extension feedback form context
    crit: exception
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-extension-feedback-context
