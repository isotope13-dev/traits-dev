defaults:
  platforms: [windows, unix]
  for: [scripts, source, binaries]

composite_rules:
  - id: google-apps-script-extension-install-startup-telemetry
    desc: Extension install-startup telemetry context
    crit: exception
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-extension-install-startup-telemetry
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-macros-path

  - id: google-apps-script-extension-ad-fetch-context
    desc: Extension ad configuration context
    crit: exception
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-extension-ad-fetch-context
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-macros-path

  - id: google-apps-script-telemetry-context
    desc: Apps Script telemetry logging context
    crit: exception
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-telemetry-context
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-macros-path

  - id: google-apps-script-license-validation-context
    desc: Apps Script license validation context
    crit: exception
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-license-validation-context
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-macros-path

  - id: google-slides-merge-client
    desc: Google Slides merge client context
    crit: exception
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/google-apps-script::google-slides-merge-client
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-macros-path

  - id: google-apps-script-extension-lifecycle-telemetry
    desc: Extension lifecycle telemetry context
    crit: exception
    conf: 0.95
    all:
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-extension-lifecycle-telemetry
      - id: micro-behaviors/communications/http/services/google-apps-script::google-apps-script-macros-path

  - id: google-apps-script-extension-analytics-context
    desc: Extension analytics context
    crit: exception
