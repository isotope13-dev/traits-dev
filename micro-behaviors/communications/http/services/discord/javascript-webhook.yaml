defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: js-discord-webhook-target
    desc: Discord webhook URL or constant
    if:
      type: text
      regex: '([\x27"]https://(ptb\.|canary\.)?discord(app)?\.com/api/webhooks/|DISCORD_WEBHOOK_URL\b)'

composite_rules:
  - id: js-axios-post-discord-webhook
    desc: Axios POST to Discord webhook
    near_bytes: 32
    all:
      - id: micro-behaviors/communications/http/post::axios-default-post-call
      - id: js-discord-webhook-target
