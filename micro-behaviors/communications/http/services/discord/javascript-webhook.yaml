defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94

traits:
  - id: js-discord-webhook-url-target
    desc: Discord webhook URL or constant
    if:
      type: text
      regex: '(["'']https://(ptb\.|canary\.)?discord(app)?\.com/api/webhooks/|DISCORD_WEBHOOK_URL\b)'
  - id: js-discord-hostname-field
    desc: Discord hostname field in request options
    crit: component
    if:
      type: text
      regex: 'hostname:\s*["''](ptb\.|canary\.)?discord(app)?\.com["'']'
  - id: js-webhook-path-field
    desc: Webhook path field in request options
    crit: component
    if:
      type: text
      regex: 'path:\s*["'']/api/webhooks/'

composite_rules:
  - id: js-discord-webhook-host-path
    desc: Discord webhook host and path
    near_bytes: 160
    all:
      - id: js-discord-hostname-field
      - id: js-webhook-path-field
  - id: js-discord-webhook-target
    desc: Discord webhook URL or constant
    any:
      - id: js-discord-webhook-url-target
      - id: js-discord-webhook-host-path
  - id: js-axios-post-discord-webhook
    desc: Axios POST to Discord webhook
    near_bytes: 32
    all:
      - id: micro-behaviors/communications/http/post::axios-default-post-call
      - id: js-discord-webhook-target
  - id: js-https-request-post-discord-webhook
    desc: https.request POST to Discord webhook
    near_bytes: 512
    all:
      - id: micro-behaviors/communications/http/request/client/call::https-request
      - id: micro-behaviors/communications/http/post::request-options-post-method
      - id: js-discord-webhook-target
  - id: js-discord-webhook-post
    desc: JavaScript POST to Discord webhook
    any:
      - id: js-axios-post-discord-webhook
      - id: js-https-request-post-discord-webhook
