defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - source
  crit: notable
traits:
- id: discord-api-users-me-url
  desc: Discord current-user API URL or request route
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: '(discord(app)?\.com)?/api/(v[0-9]+/)?users/@me\b'
