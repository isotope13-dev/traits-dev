defaults:
  platforms:
  - windows
  - macos
  - linux
  for:
  - javascript
  - typescript
  - python
  - pe
  - elf
  - macho
  - batch
  crit: notable
traits:
- id: api-billing
  desc: Discord billing/payment API endpoint
  conf: 0.95
  if:
    type: text
    regex: discord(app)?\.com/api/(v[0-9]+/)?users/@me/billing
- id: api-payment-sources
  desc: Discord billing payment-sources endpoint
  conf: 0.95
  if:
    type: text
    regex: discord(app)?\.com/api/(v[0-9]+/)?users/@me/billing/payment-sources
