defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:

  - id: discord-invite-url
    desc: Discord invite URL
    crit: notable
    conf: 0.8
    for: [elf, macho, pe, javascript, typescript]
    size_min: 64
    size_max: 500000000
    if:
      type: text
      regex: discord\.gg/[a-zA-Z0-9]+

