defaults:
  for: [python]
  platforms: [windows, unix]
  crit: notable
  conf: 0.97

traits:
  - id: python-rest-channel-delete
    desc: Calls Discord channel deletion endpoint
    if:
      type: symbol
      kind: call
      regex: '(^|\.)delete$'
      arg:
        index: 0
        regex: '^https://discord(app)?\.com/api/v[0-9]+/channels/'

  - id: python-rest-role-delete
    desc: Calls Discord role deletion endpoint
    if:
      type: symbol
      kind: call
      regex: '(^|\.)delete$'
      arg:
        index: 0
        regex: '^https://discord(app)?\.com/api/v[0-9]+/guilds/[^/]{1,80}/roles/'

composite_rules:
  - id: python-rest-guild-resource-delete
    desc: Calls Discord guild resource deletion endpoint
    any:
      - id: python-rest-channel-delete
      - id: python-rest-role-delete
