defaults:
  platforms: [windows, unix]
  for: [class]
traits:
  - id: jvm-configurable-fixed-attachment-webhook-profile
    desc: Webhook embeds multipart-upload destination
    crit: suspicious
    conf: 0.96
    if:
      type: yara
      source: |
        rule jvm_configurable_fixed_attachment_webhook_profile {
          strings:
            $endpoint = /https:\/\/discord(app)?\.com\/api\/webhooks\/[0-9]+\/[A-Za-z0-9_-]+/
            $field = "webhook"
            $text = "com/github/kevinsawicki/http/HttpRequest"
            $file = "java/io/FileInputStream"
            $post = "org/apache/http/client/methods/HttpPost"
            $multipart = "org/apache/http/entity/mime/MultipartEntity"
            $body = "org/apache/http/entity/mime/content/InputStreamBody"
            $payload = "payload_json"
          condition:
            uint32be(0) == 0xcafebabe and all of them
        }
