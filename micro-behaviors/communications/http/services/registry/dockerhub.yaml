# Docker Hub — the canonical container registry. Its documented API-token
# login (POST hub.docker.com/v2/users/login with the registry credential)
# is the standard CI pattern for tag cleanup and repository management: the
# secret travels to the service that issued it. Supply-chain composites use
# this to separate registry maintenance from credential exfiltration to a
# foreign endpoint.
defaults:
  platforms: [unix, windows]
  for: [github-actions, shell, batch, powershell, text, markdown]
  crit: notable
  conf: 0.95

traits:
  - id: dockerhub-api-token-login
    desc: Docker Hub API token login endpoint
    if:
      type: text
      substr: hub.docker.com/v2/users/login
