defaults:
  platforms: [windows, unix]
  # RubyGems credentials and API paths retain the same syntax when embedded in
  # Ruby, shell, or another script language. Language-specific builders below
  # narrow themselves back to JavaScript.
  for: [scripts]
composite_rules:
  - id: rubygems-token-publish-upload
    desc: RubyGems token and publishing API clues
    crit: suspicious
    conf: 0.99
    for: [javascript, typescript]
    all:
      - id: micro-behaviors/data/format/credentials::rubygems-api-token-shaped-text
      - id: micro-behaviors/communications/http/services/registry::rubygems-api-v1-gems-path
      - id: micro-behaviors/data/format/mime::mime-octet-stream
    any:
      - id: metadata/package/files/rubygems::js-gem-archive-builder
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
