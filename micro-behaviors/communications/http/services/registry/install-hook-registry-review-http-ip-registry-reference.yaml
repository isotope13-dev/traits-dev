defaults:
  platforms: [unix, windows]
  for: [javascript, text, markdown]
traits:
  - id: http-ip-registry-reference
    desc: HTTP registry configured with an IP address
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '--registry[= ]http://[0-9.]+|registry\s*[:= ]\s*[''"]?http://[0-9.]+'
      not:
        - regex: 'http://(127\.|0\.0\.0\.0)'

