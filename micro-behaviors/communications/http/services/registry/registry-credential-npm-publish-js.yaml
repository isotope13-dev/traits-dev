defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
composite_rules:
  - id: github-oidc-npm-publish
    desc: npm registry OIDC publishing
    crit: notable
    conf: 0.98
    near_bytes: 1600
    all:
    - id: micro-behaviors/communications/http/services/registry::npm-oidc-exchange-endpoint
    - id: micro-behaviors/os/env/ci-credentials::github-actions-oidc-token-request-env
    - id: micro-behaviors/communications/http/services/registry::npm-registry-put-request
