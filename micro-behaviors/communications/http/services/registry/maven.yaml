# Maven Central — the canonical Maven artifact registry. A download from
# repo1.maven.org/maven2 is a build or release script fetching a published
# artifact, not a command-and-control fetch; supply-chain composites use it
# to separate release assembly from artifact replacement.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, build, github-actions, text, markdown]
  crit: notable
  conf: 0.95

traits:
  - id: maven-central-artifact-url
    desc: Maven Central artifact URL
    if:
      type: text
      regex: 'https?://repo1\.maven\.org/maven2/'
