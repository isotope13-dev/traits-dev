defaults:
  platforms: [windows, unix]
  for: [scripts]
traits:
  - id: rubygems-api-v1-gems-path
    desc: RubyGems gems API path reference
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: /api/v1/gems
  - id: ruby-gem-output-publish
    desc: Ruby code publishes to RubyGems
    crit: notable
    conf: 0.98
    for: [ruby]
    if:
      type: text
      regex: '(rubygems\.org/api/v1/gems|\bgem\s+push\b)'
  - id: ruby-gem-webhook-api
    desc: Ruby code registers RubyGems webhooks
    crit: notable
    conf: 0.98
    for: [ruby]
    if:
      type: text
      substr: rubygems.org/api/v1/web_hooks
