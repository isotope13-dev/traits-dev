defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: npm-maintainer-search-api
    desc: References npm maintainer search endpoint
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(registry\.npmjs\.org)?/v1/search\?text=maintainer:'

  - id: npm-registry-package-request
    desc: Requests package metadata from npm registry
    if:
      type: symbol
      kind: call
      exact: https.get
      arg:
        kind: string
        substr: registry.npmjs.org/

  - id: npm-dist-tags-read
    desc: Reads npm registry distribution tags
    conf: 0.85
    if:
      type: literal
      kind: string
      exact: dist-tags
  - id: python-npm-registry-package-url
    desc: Python constructs npm package metadata URL
    for: [python]
    if:
      type: text
      regex: 'registry\.npmjs\.org\s*/\s*\{'

  # Relocated from objectives/supply-chain/credential-theft/registry/: a PUT
  # beside a registry URL is the registry's own write API -- publish,
  # ownership change, dist-tags -- used verbatim by release tooling such as
  # pnpm's owner command. The credential-theft and OIDC-publish composites
  # reference it and supply the intent-specific context.
  - id: npm-put-before-registry
    desc: PUT method near npm registry URL
    conf: 0.92
    if:
      type: text
      regex: 'method\s*:\s*["'']PUT["''][\s\S]{0,400}registry\.npmjs\.org'
  - id: npm-put-after-registry
    desc: npm registry URL near PUT method
    conf: 0.92
    if:
      type: text
      regex: 'registry\.npmjs\.org[\s\S]{0,400}method\s*:\s*["'']PUT["'']'

composite_rules:
  - id: npm-registry-put-request
    desc: npm registry PUT request
    conf: 0.92
    any:
      - id: npm-put-before-registry
      - id: npm-put-after-registry

  # Cooccurrence of normal publication APIs does not prove worm propagation.
  # Keep both observations available without an attacker-intent classification.
  - id: npm-search-with-github-commit-api
    desc: npm search with GitHub commit API references
    conf: 0.94
    all:
      - id: micro-behaviors/communications/http/services/registry::npm-maintainer-search-api
      - id: micro-behaviors/communications/http/services/github::github-graphql-create-commit-on-branch
