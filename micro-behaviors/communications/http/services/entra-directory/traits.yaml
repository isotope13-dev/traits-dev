defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.92

# Microsoft Graph tenant-wide directory resources.  These path atoms are
# neutral capabilities; the discovery objective requires several together.
traits:
  - id: organization-path-token
    desc: Microsoft Graph organization endpoint
    crit: component
    if:
      type: text
      regex: '/organization\b'

  - id: user-collection-path-token
    desc: Microsoft Graph user collection endpoint
    crit: component
    if:
      type: text
      regex: '/users\b'

  - id: group-collection-path-token
    desc: Microsoft Graph group collection endpoint
    crit: component
    if:
      type: text
      regex: '/groups\b'

  - id: domain-collection-path-token
    desc: Microsoft Graph domain collection endpoint
    crit: component
    if:
      type: text
      regex: '/domains\b'

composite_rules:
  - id: organization-path
    desc: Microsoft Graph organization path
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
      - id: organization-path-token
    near_bytes: 240

  - id: user-collection-path
    desc: Microsoft Graph user collection path
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
      - id: user-collection-path-token
    near_bytes: 240

  - id: group-collection-path
    desc: Microsoft Graph group collection path
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
      - id: group-collection-path-token
    near_bytes: 240

  - id: domain-collection-path
    desc: Microsoft Graph domain collection path
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
      - id: domain-collection-path-token
    near_bytes: 240
