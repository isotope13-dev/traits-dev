defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  conf: 0.92

# Microsoft Graph endpoints require both the host and a nearby directory path.
composite_rules:
  - id: organization-path
    desc: Microsoft Graph organization path
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
      - id: micro-behaviors/communications/http/url/endpoint::organization-path-token
    near_bytes: 240

  - id: user-collection-path
    desc: Microsoft Graph user collection path
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
      - id: micro-behaviors/communications/http/url/endpoint::user-collection-path-token
    near_bytes: 240

  - id: group-collection-path
    desc: Microsoft Graph group collection path
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
      - id: micro-behaviors/communications/http/url/endpoint::group-collection-path-token
    near_bytes: 240

  - id: domain-collection-path
    desc: Microsoft Graph domain collection path
    all:
      - id: micro-behaviors/communications/http/services/microsoft::graph-service-host
      - id: micro-behaviors/communications/http/url/endpoint::domain-collection-path-token
    near_bytes: 240
