---
defaults:
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
  crit: notable
  conf: 0.9
traits:
- id: graph-manager-recon-path
  desc: Microsoft Graph manager path
  crit: baseline
  conf: 0.92
  for:
  - scripts
  if:
    type: text
    regex: "(/|me/)manager\\b"
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: graph-direct-reports-recon-path
  desc: Microsoft Graph direct-reports path
  crit: baseline
  conf: 0.92
  for:
  - scripts
  if:
    type: text
    regex: "(/|me/)directReports\\b"
  unless:
  - id: metadata/lang/scripted::dts-declaration-file
- id: graph-service-principal-role-assignment-path
  desc: Microsoft Graph role-assignment endpoint
  for:
  - scripts
  if:
    type: text
    regex: "(?i)(graph\\.microsoft\\.com/v[0-9.]+/)?servicePrincipals/.{0,80}/appRoleAssignedTo\\b"
- id: graph-user-directory-listing
  desc: Graph tenant user directory listing
  for:
  - scripts
  if:
    type: text
    regex: "(?i)/users\\?\\$(select|filter|top|expand)\\b"
- id: graph-user-directory-bulk-page
  desc: Graph user directory bulk page request
  crit: notable
  conf: 0.95
  for:
  - scripts
  - binaries
  - json
  - text
  if:
    type: text
    regex: "(?i)/users\\?.{0,80}\\$top=[1-9][0-9]{2,}\\b"
- id: graph-user-directory-finance-search
  desc: Graph payroll or finance user search
  crit: notable
  conf: 0.96
  for:
  - scripts
  - binaries
  - json
  - text
  if:
    type: text
    regex: "(?i)/users\\?.{0,100}\\$search.{0,100}\\b(payroll|finance)\\b"
- id: graph-user-directory-hr-search
  desc: Graph HR user search
  crit: notable
  conf: 0.95
  for:
  - scripts
  - binaries
  - json
  - text
  if:
    type: text
    regex: "(?i)/users\\?.{0,100}\\$search.{0,100}\\bhr\\b"
- id: graph-user-directory-skiptoken
  desc: Graph user directory skiptoken pagination
  crit: notable
  conf: 0.94
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: "(?i)/users\\?.{0,160}\\$skiptoken="
- id: graph-service-principals-path
  desc: Graph service-principal collection path
  crit: notable
  conf: 0.94
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)(^|[/"'])servicePrincipals([/\?]|$)
- id: graph-directory-roles-path
  desc: Graph directory-roles collection path
  crit: notable
  conf: 0.94
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)(^|[/"'])directoryRoles\b
- id: graph-applications-path
  desc: Graph application-registration collection path
  crit: notable
  conf: 0.92
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: "(?i)graph\\.microsoft\\.com.{0,80}/applications\\b"
- id: delegated-permission-schema-field
  desc: References delegated permission schema
  crit: notable
  conf: 0.9
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: "(?i)(delegatedPermissions?|requiredResourceAccess)"
- id: entra-external-auth-callback
  desc: Entra external authentication callback
  crit: notable
  conf: 0.99
  for:
  - scripts
  - binaries
  - html
  - json
  - text
  if:
    type: text
    regex: "(?i)login\\.microsoftonline\\.com/common/federation/externalauthprovider\\b"
- id: graph-external-auth-method-policy-path
  desc: Graph authentication-method policy path
  crit: notable
  conf: 0.98
  for:
  - scripts
  - binaries
  - json
  - text
  if:
    type: text
    substr: "/beta/policies/authenticationMethodsPolicy/"
- id: graph-external-auth-method-config-type
  desc: Graph external-auth configuration type
  crit: notable
  conf: 0.98
  for:
  - scripts
  - binaries
  - json
  - text
  if:
    type: text
    substr: "#microsoft.graph.externalAuthenticationMethodConfiguration"
- id: graph-role-management-path
  desc: Graph directory role-management path
  crit: notable
  conf: 0.95
  for:
  - scripts
  - binaries
  if:
    type: text
    regex: (?i)(^|[/"'])roleManagement/directory/(roleAssignments|roleDefinitions)\b
composite_rules:
- id: graph-app-authority-path
  desc: Graph application or role-authority path
  crit: notable
  conf: 0.93
  for:
  - scripts
  - binaries
  any:
  - id: micro-behaviors/communications/http/services/entra-directory::graph-applications-path
  - id: micro-behaviors/communications/http/services/entra-directory::graph-role-management-path
- id: graph-external-auth-method-registration
  desc: Entra external authentication-method configuration context
  crit: notable
  conf: 0.99
  for:
  - scripts
  - binaries
  - json
  - text
  near_bytes: 4096
  all:
  - id: micro-behaviors/communications/http/services/entra-directory::graph-external-auth-method-policy-path
  - id: micro-behaviors/communications/http/services/entra-directory::graph-external-auth-method-config-type
