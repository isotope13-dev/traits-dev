defaults:
  platforms: [unix]
  for: [shell]
  crit: notable
traits:
  - id: github-actions-identity-issuer
    desc: GitHub Actions federation issuer URL
    if:
      type: text
      substr: 'https://token.actions.githubusercontent.com'
  - id: azure-token-exchange-audience
    desc: Azure federation token exchange audience
    if:
      type: text
      substr: 'api://AzureADTokenExchange'
  - id: application-federated-credential-endpoint
    desc: Entra application federation credential endpoint
    if:
      type: text
      regex: 'graph\.microsoft\.com/v1\.0/applications/[^/"\s]{1,80}/federatedIdentityCredentials'
  - id: application-federated-credential-post
    desc: Posts Entra federation credential request
    if:
      type: symbol
      kind: call
      exact: curl
      args:
        - name: -X
        - name: POST
        - regex: 'graph\.microsoft\.com/v1\.0/applications/[^/"\s]{1,80}/federatedIdentityCredentials'
