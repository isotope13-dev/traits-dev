# Graph path evidence is neutral. The discovery consumer requires a survey
# across distinct resources, rather than inferring intent from one API path.
# Relative paths support SDK clients and split base-URL construction; source
# literals exclude documentation comments. OData type casts are API syntax,
# not network hosts (Microsoft.graph.ServicePrincipal is not a domain).
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.96

traits:
  - id: resource-tenants-source-path
    desc: Graph resource-tenant discovery path literal
    for: [scripts, source]
    if:
      type: literal
      kind: string
      exclude_docstrings: true
      regex: '(?i)/tenantRelationships/getResourceTenants([?(]|$)'

  - id: resource-tenants-binary-path
    desc: Graph resource-tenant discovery path in binary
    for: [binaries]
    if:
      type: text
      regex: '(?i)/tenantRelationships/getResourceTenants([?(]|$)'

  - id: user-transitive-roles-source-path
    desc: Graph transitive directory-role path literal
    for: [scripts, source]
    if:
      type: literal
      kind: string
      exclude_docstrings: true
      regex: '(?i)/users/[^/\s]{1,160}/roleManagement/directory/transitiveRoleAssignments\b'

  - id: user-transitive-roles-binary-path
    desc: Graph transitive directory-role path in binary
    for: [binaries]
    if:
      type: text
      regex: '(?i)/users/[^/\s]{1,160}/roleManagement/directory/transitiveRoleAssignments\b'

  - id: user-owned-service-principals-source-path
    desc: Graph user-owned service-principal path literal
    for: [scripts, source]
    if:
      type: literal
      kind: string
      exclude_docstrings: true
      regex: '(?i)/(users/[^/\s]{1,160}|me)/ownedObjects/microsoft\.graph\.ServicePrincipal\b'

  - id: user-owned-service-principals-binary-path
    desc: Graph owned service-principal path in binary
    for: [binaries]
    if:
      type: text
      regex: '(?i)/(users/[^/\s]{1,160}|me)/ownedObjects/microsoft\.graph\.ServicePrincipal\b'

composite_rules:
  - id: resource-tenants-path
    desc: Graph resource-tenant discovery path reference
    any:
      - id: resource-tenants-source-path
      - id: resource-tenants-binary-path

  - id: user-transitive-roles-path
    desc: Graph transitive directory-role path reference
    any:
      - id: user-transitive-roles-source-path
      - id: user-transitive-roles-binary-path

  - id: user-owned-service-principals-path
    desc: Graph user-owned service-principal path reference
    any:
      - id: user-owned-service-principals-source-path
      - id: user-owned-service-principals-binary-path
