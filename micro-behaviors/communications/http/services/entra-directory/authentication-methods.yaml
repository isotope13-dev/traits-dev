# Microsoft Entra ID device-registration and authentication-method facts.
#
# The Device Registration Service is the resource a client must hold a
# token for to join a device to a tenant; Graph's authentication-method
# collections are where MFA methods live.  OS device join, MDM and
# help-desk tooling use these APIs legitimately, so the endpoint and GUID
# atoms are capability facts.  Objectives assemble the abusive shapes
# (bulk replay redeeming a DRS token, wiping and re-registering a victim's
# authenticator).
#
# Path and type names are the documented Graph / DRS wire vocabulary, so
# these atoms hold across SDKs and languages.
defaults:
  platforms: [windows, unix]
  for: [scripts, source]
  crit: notable
  conf: 0.93

traits:
  - id: device-registration-service-resource-id
    desc: Device Registration Service resource ID
    conf: 0.96
    if:
      type: text
      substr: 01cb2876-7ebd-4aa4-9cc9-d28bd4d359a9

  - id: enterprise-registration-host
    desc: Entra enterprise registration endpoint host
    if:
      type: text
      substr: enterpriseregistration.windows.net

  - id: graph-devices-collection-endpoint
    desc: Graph directory devices collection endpoint
    if:
      type: text
      regex: '(?i)graph\.microsoft\.com/(v1\.0|beta)/devices\b'

  - id: graph-authentication-methods-endpoint
    desc: Graph authentication methods collection endpoint
    if:
      type: text
      regex: '(?i)/authentication/(\w+Methods|methods)\b'

  - id: graph-microsoft-authenticator-methods-endpoint
    desc: Graph Microsoft Authenticator methods endpoint
    if:
      type: text
      regex: '(?i)/authentication/microsoftAuthenticatorMethods\b'

  - id: microsoft-authenticator-method-odata-type
    desc: Microsoft Authenticator method OData type
    conf: 0.96
    if:
      type: text
      substr: '#microsoft.graph.microsoftAuthenticatorAuthenticationMethod'

composite_rules:
  - id: entra-device-service-reference
    desc: DRS or Graph directory-device service reference
    crit: notable
    conf: 0.95
    any:
      - id: device-registration-service-resource-id
      - id: enterprise-registration-host
      - id: graph-devices-collection-endpoint
