# Cacti request surfaces used by both ordinary clients and exploit chains.
defaults:
  for: [shell]
  platforms: [unix]
  crit: notable
traits:
  - id: profile-setting-field
    desc: Cacti preview page-size form field
    if:
      type: text
      substr: name=preview_graphs_per_page
      exclude_comments: true
  - id: profile-update-route
    desc: Cacti profile update request route
    if:
      type: text
      regex: 'auth_profile[.]php\?[^"\s]{0,120}\baction=update_data\b'
      exclude_comments: true
  - id: realtime-init-route
    desc: Cacti realtime poller request route
    if:
      type: text
      regex: 'graph_realtime[.]php\?[^"\s]{0,120}\baction=init\b'
      exclude_comments: true
  - id: graph-preview-route
    desc: Cacti graph preview request route
    if:
      type: text
      regex: 'graph_view[.]php\?[^"\s]{0,120}\baction=preview\b'
      exclude_comments: true
