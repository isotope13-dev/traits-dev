# School learning-platform hosts. A host name in a preset table is a neutral
# reference; masking intent comes from the tab-disguise composite.
defaults:
  platforms: [unix, windows]
  for: [html, javascript]

traits:
  - id: lms-school-platform-domain-preset
    desc: Names a school learning-platform host
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: '["''](classroom\.google\.com|www\.instructure\.com|www\.schoology\.com|clever\.com)["'']'
