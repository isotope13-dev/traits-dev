# Native AWS S3 service references.  These identify network capability; intent
# is inferred only by objective composites that add a sensitive data source.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
  conf: 0.8
traits:
- id: amazonaws-domain
  desc: Amazon S3 service domain
  if:
    type: text
    regex: https?://s3\.amazonaws\.com/
- id: regional-bucket-domain
  desc: Regional S3 bucket domain
  conf: 0.82
  if:
    type: text
    regex: https?://[a-z0-9][a-z0-9.-]{2,80}\.s3\.[a-z0-9-]+\.amazonaws\.com/
- id: upload-api
  desc: Calls an Amazon S3 upload method
  for: [javascript, typescript]
  if:
    type: symbol
    kind: call
    regex: '(?i)(^|\.)s3[a-z0-9_$]{0,24}\.upload$'
  unless:
    - id: metadata/library/cloud-sdk::aws-python-sdk-source
    - id: well-known/lib/cloud/boto3::boto3-aws-sdk-wheel-context
    - id: well-known/lib/cloud/botocore::botocore-aws-sdk-wheel-context

# AWS CLI s3api subcommands are the scriptable form of the S3 REST
# operations (REST.COPY.OBJECT, REST.DELETE.OBJECT, listings). The
# ``aws ... s3api <op>`` argv shape is command-line grammar, not prose.
- id: aws-cli-s3api-copy-object
  desc: AWS CLI S3 server-side object copy
  conf: 0.9
  for: [scripts, source, json]
  if:
    type: text
    regex: '(?i)\baws\s+s3api\s+copy-object\b'
- id: aws-cli-s3api-delete-object
  desc: AWS CLI S3 object deletion
  conf: 0.9
  for: [scripts, source, json]
  if:
    type: text
    regex: '(?i)\baws\s+s3api\s+delete-objects?\b'
- id: aws-cli-s3api-list-objects
  desc: AWS CLI S3 object listing
  conf: 0.88
  for: [scripts, source, json]
  if:
    type: text
    regex: '(?i)\baws\s+s3api\s+(list-objects(-v2)?|get-bucket( |\b))'
- id: aws-cli-s3api-list-buckets
  desc: AWS CLI S3 bucket enumeration
  conf: 0.88
  for: [scripts, source, json]
  if:
    type: text
    regex: '(?i)\baws\s+s3api\s+list-buckets\b'

# CloudTrail eventName forms of the same operations. The JSON field makes
# these structural log evidence rather than a mention in prose.
- id: s3-copy-object-event
  desc: S3 CopyObject CloudTrail event
  conf: 0.9
  for: [json]
  if:
    type: text
    regex: '(?i)"eventName"\s*:\s*"CopyObject"'
- id: s3-delete-object-event
  desc: S3 DeleteObject CloudTrail event
  conf: 0.9
  for: [json]
  if:
    type: text
    regex: '(?i)"eventName"\s*:\s*"DeleteObjects?"'
- id: s3-list-buckets-event
  desc: S3 ListBuckets CloudTrail event
  conf: 0.9
  for: [json]
  if:
    type: text
    regex: '(?i)"eventName"\s*:\s*"ListBuckets"'

composite_rules:
  # Language-agnostic umbrellas: the CopyObject and DeleteObject operations
  # in whichever call, CLI, or CloudTrail-event form the artifact carries.
  # Objective composites (S3 extortion, exfiltration) combine these with
  # intent-bearing legs instead of duplicating per-language matchers.
  - id: s3-object-copy-operation
    desc: S3 object copy operation
    crit: notable
    conf: 0.9
    for: [scripts, source, json]
    any:
      - id: micro-behaviors/communications/http/services/aws-s3::s3-copy-object-python
      - id: micro-behaviors/communications/http/services/aws-s3::s3-copy-object
      - id: micro-behaviors/communications/http/services/aws-s3::aws-cli-s3api-copy-object
      - id: micro-behaviors/communications/http/services/aws-s3::s3-copy-object-event
  - id: s3-object-delete-operation
    desc: S3 object deletion operation
    crit: notable
    conf: 0.9
    for: [scripts, source, json]
    any:
      - id: micro-behaviors/communications/http/services/aws-s3::s3-delete-objects
      - id: micro-behaviors/communications/http/services/aws-s3::s3-delete-object
      - id: micro-behaviors/communications/http/services/aws-s3::s3-delete-object-typescript
      - id: micro-behaviors/communications/http/services/aws-s3::aws-cli-s3api-delete-object
      - id: micro-behaviors/communications/http/services/aws-s3::s3-delete-object-event
  - id: s3-bucket-enumeration-operation
    desc: S3 bucket enumeration operation
    crit: notable
    conf: 0.9
    for: [scripts, source, json]
    any:
      - id: micro-behaviors/communications/http/services/aws-s3::s3-list-buckets-operation
      - id: micro-behaviors/communications/http/services/aws-s3::s3-ruby-list-buckets-operation
      - id: micro-behaviors/communications/http/services/aws-s3::s3-list-buckets-command
      - id: micro-behaviors/communications/http/services/aws-s3::aws-cli-s3api-list-buckets
      - id: micro-behaviors/communications/http/services/aws-s3::s3-list-buckets-event
