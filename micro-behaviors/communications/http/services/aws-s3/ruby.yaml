# AWS S3 API Operations - Ruby
#
# Operations match call symbols with receiver prefix anchoring (`(^|\.)op$`),
# matching both direct calls and method invocations on S3 clients while avoiding
# unrelated identifier substring collisions.
defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: notable
traits:
  - id: s3-client
    desc: AWS S3 client initialization
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|:|\.)(Aws::)?S3::(Client|Resource)\.new$'
  - id: s3-get-object
    desc: S3 get_object operation
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)get_object$'
  - id: s3-put-object
    desc: S3 put_object operation
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)put_object$'
  - id: s3-delete-object
    desc: S3 delete_object operation
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)delete_object$'
  - id: s3-list-objects
    desc: S3 list_objects operation
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)list_objects(_v2)?$'
  - id: s3-ruby-list-buckets-operation
    desc: Calls the S3 list-buckets operation
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: list_buckets
  - id: s3-head-object
    desc: S3 head_object operation
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)head_object$'
  - id: s3-copy-object
    desc: S3 copy_object operation
    conf: 0.85
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)copy_object$'
  - id: s3-presigned-url
    desc: S3 presigned URL generation
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)presigned_url$'
  - id: s3-presigned-post
    desc: S3 presigned POST
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)presigned_post$'
  - id: s3-presigner
    desc: S3 Presigner class
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|:|\.)(Aws::)?S3::Presigner\.new$'
