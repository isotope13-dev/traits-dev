# AWS S3 API Operations - Ruby
#
# AWS-specific method names (``presigned_url``, ``Presigner``, ``S3::Client``)
# match on the name alone. Bare operation names that ordinary application
# models also define (``get_object``, ``put_object``, ``delete_object``,
# ``list_objects``, ``head_object``, ``copy_object``, ``list_buckets``)
# additionally require an S3-shaped receiver, as the Python sibling does:
# Origami's PDF XRefTable defines ``delete_object`` and object-storage SDKs
# reuse the same CRUD spellings, so a generic receiver named ``client`` is not
# AWS evidence. Ruby allows omitting parentheses on no-argument calls, so
# these text matchers end at the method name.
defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: notable
traits:
  - id: s3-client
    desc: AWS S3 client initialization
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|:|\.)(Aws::)?S3::(Client|Resource)\.new$'
  - id: s3-get-object
    desc: S3 get_object operation
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(s3[\w_-]*|aws[_-]?s3[\w_-]*)\s*\.\s*get_object'
  - id: s3-put-object
    desc: S3 put_object operation
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(s3[\w_-]*|aws[_-]?s3[\w_-]*)\s*\.\s*put_object'
  - id: s3-delete-object
    desc: S3 delete_object operation
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(s3[\w_-]*|aws[_-]?s3[\w_-]*)\s*\.\s*delete_object'
  - id: s3-list-objects
    desc: S3 list_objects operation
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(s3[\w_-]*|aws[_-]?s3[\w_-]*)\s*\.\s*list_objects(_v2)?'
  - id: s3-ruby-list-buckets-operation
    desc: Calls the S3 list-buckets operation
    conf: 0.9
    if:
      type: text
      regex: '(?i)\b(s3[\w_-]*|aws[_-]?s3[\w_-]*)\s*\.\s*list_buckets'
  - id: s3-head-object
    desc: S3 head_object operation
    conf: 0.85
    if:
      type: text
      regex: '(?i)\b(s3[\w_-]*|aws[_-]?s3[\w_-]*)\s*\.\s*head_object'
  - id: s3-copy-object
    desc: S3 copy_object operation
    conf: 0.85
    if:
      type: text
      regex: '(?i)\b(s3[\w_-]*|aws[_-]?s3[\w_-]*)\s*\.\s*copy_object'
  - id: s3-presigned-url
    desc: S3 presigned URL generation
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)presigned_url$'
  - id: s3-presigned-post
    desc: S3 presigned POST
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)presigned_post$'
  - id: s3-presigner
    desc: S3 Presigner class
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|:|\.)(Aws::)?S3::Presigner\.new$'
