# AWS S3 API Operations - Ruby
#
# The `*_object` operation names are matched with `word:`, not `substr:`.
# A substring match on `put_object` also fires on GraphQL's
# `:input_object` (in|put_object) and on any other identifier that merely
# ends in one of these names, which reported an S3 upload in code that has
# no AWS client at all. `list_objects` below was already fixed this way.
defaults:
  platforms: [windows, unix]
  for: [ruby]
  crit: notable
traits:
  - id: s3-client
    desc: AWS S3 client initialization
    conf: 0.9
    if:
      type: string_literal
      regex: Aws::S3::Client|S3::Client
  - id: s3-get-object
    desc: S3 get_object operation
    conf: 0.9
    if:
      type: string_literal
      word: get_object
  - id: s3-put-object
    desc: S3 put_object operation
    conf: 0.9
    if:
      type: string_literal
      word: put_object
  - id: s3-delete-object
    desc: S3 delete_object operation
    conf: 0.9
    if:
      type: string_literal
      word: delete_object
  - id: s3-list-objects
    desc: S3 list_objects operation
    conf: 0.9
    if:
      type: string_literal
      word: list_objects
  - id: s3-ruby-list-buckets-operation
    desc: Calls the S3 list-buckets operation
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: list_buckets
  - id: s3-head-object
    desc: S3 head_object operation
    conf: 0.85
    if:
      type: string_literal
      word: head_object
  - id: s3-copy-object
    desc: S3 copy_object operation
    conf: 0.85
    if:
      type: string_literal
      word: copy_object
  - id: s3-presigned-url
    desc: S3 presigned URL generation
    conf: 0.9
    if:
      type: string_literal
      substr: presigned_url
  - id: s3-presigned-post
    desc: S3 presigned POST
    conf: 0.9
    if:
      type: symbol
      kind: call
      exact: presigned_post
  - id: s3-presigner
    desc: S3 Presigner class
    conf: 0.9
    if:
      type: string_literal
      word: Presigner
