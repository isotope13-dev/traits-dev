defaults:
  platforms: [windows, unix]
  for: [python]
  crit: notable
traits:
  - id: boto3-s3-client
    desc: boto3 S3 client initialization
    conf: 0.85
    if:
      type: text
      regex: '(boto3|session)\.client\(\s*["'']s3["'']'
    unless:
      - id: metadata/library/cloud-sdk::aws-python-sdk-source
  - id: generate-presigned-url
    desc: S3 presigned URL generation
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(^|\.)generate_presigned_(url|post)$'
  - id: s3-create-bucket
    desc: S3 bucket creation
    conf: 0.9
    if:
      # A bare ``create_bucket`` name is not AWS-specific — object-storage
      # SDKs and hosted-bucket APIs (e.g. huggingface_hub) define the same
      # method. Require an S3/client receiver, as ``s3-delete-objects`` does.
      type: text
      regex: '(?i)\b(s3|s3[_-]?client|s3client)\s*\.\s*create_bucket\s*\('
  - id: s3-block-public-access
    desc: S3 public access block
    conf: 0.9
    if:
      type: symbol
      exact: put_public_access_block
  - id: s3-list-buckets-operation
    desc: S3 bucket enumeration operation
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)list_buckets$'
    unless:
      - id: metadata/library/cloud-sdk::aws-python-sdk-source
  - id: s3-get-public-access-block
    desc: Reads an S3 public-access-block configuration
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)get_public_access_block$'
  - id: s3-get-bucket-policy-status
    desc: Reads S3 bucket policy public status
    conf: 0.92
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)get_bucket_policy_status$'
  - id: s3-get-bucket-policy
    desc: Reads an S3 bucket policy
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)get_bucket_policy$'
  - id: s3-get-bucket-acl
    desc: Reads an S3 bucket ACL
    conf: 0.9
    if:
      type: symbol
      kind: call
      regex: '(?i)(^|\.)get_bucket_acl$'
  - id: s3-bucket-encryption
    desc: S3 bucket encryption configuration
    conf: 0.9
    if:
      type: symbol
      exact: put_bucket_encryption
  - id: s3-lifecycle-configuration
    desc: S3 lifecycle configuration
    conf: 0.88
    if:
      type: symbol
      exact: put_bucket_lifecycle_configuration
  - id: s3-put-object-python
    desc: S3 object upload
    conf: 0.88
    if:
      type: symbol
      exact: put_object
  - id: s3-delete-objects
    desc: S3 object deletion
    conf: 0.88
    if:
      # A generic ``delete_objects`` method is common in application models.
      # Require an S3/client receiver so methods such as
      # ``HierarchySync.delete_objects`` are not misclassified as AWS calls.
      type: text
      regex: '(?i)\b(s3|s3[_-]?client|s3client)\s*\.\s*delete_objects\s*\('
  - id: aws-cli-s3-sync
    desc: AWS CLI S3 sync
    conf: 0.88
    if:
      type: text
      substr: aws s3 sync
  - id: aws-cli-s3-copy
    desc: AWS CLI S3 copy
    conf: 0.88
    if:
      type: text
      substr: aws s3 cp

composite_rules:
  - id: s3-download-file
    desc: S3 file download
    crit: notable
    conf: 0.92
    all:
      - id: boto3-s3-client
      - id: micro-behaviors/communications/http/download/helper::download-file-method-call

  - id: s3-bucket-hardening
    desc: S3 bucket hardening
    crit: notable
    conf: 0.92
    needs: 2
    any:
      - id: s3-block-public-access
      - id: s3-bucket-encryption
      - id: s3-lifecycle-configuration

  - id: s3-output-sync
    desc: S3 output synchronization
    crit: notable
    conf: 0.9
    any:
      - id: aws-cli-s3-sync
      - id: s3-put-object-python
      - id: s3-download-file

  - id: s3-permission-read-operation
    desc: Reads multiple S3 permission surfaces
    crit: notable
    conf: 0.93
    needs: 2
    any:
      - id: s3-get-public-access-block
      - id: s3-get-bucket-policy-status
      - id: s3-get-bucket-policy
      - id: s3-get-bucket-acl
