# Neutral bucket inventory capabilities. Listing and permission reads alone
# do not establish reconnaissance intent or bind the results to one bucket.
defaults:
  platforms: [unix, windows]
  for: [json, python, javascript, typescript, ruby, go, java, php]

composite_rules:
  - id: s3-bucket-enumeration
    desc: Enumerates S3 buckets
    crit: notable
    conf: 0.93
    unless:
      - id: well-known/lib/cloud/botocore::aws-python-sdk-source
      # A Prefix-scoped ListBuckets with no unscoped call finds one owned
      # bucket (e.g. cdkd deploying), not an account-wide listing.
      - id: s3-prefix-scoped-bucket-lookup
    any:
      - id: micro-behaviors/communications/http/services/aws-s3::s3-list-buckets-operation
      - id: micro-behaviors/communications/http/services/aws-s3::s3-list-buckets-command

  - id: s3-permission-surface-read
    desc: Reads S3 bucket permission metadata
    crit: notable
    conf: 0.93
    any:
      - id: micro-behaviors/communications/http/services/aws-s3::s3-permission-read-operation
      - id: micro-behaviors/communications/http/services/aws-s3::s3-permission-read-command

  - id: s3-permission-surface-enumeration
    desc: S3 bucket listing co-occurs with permission reads
    crit: notable
    conf: 0.97
    unless:
      # A Prowler check module is written in the shape of the control it audits.
      - id: well-known/tool/detection/prowler::scanner-check-corpus
      - id: well-known/app/system/anthropic-cybersecurity-skills::defensive-cybersecurity-skills-repository
      - id: well-known/lib/cloud/oss2::oss2-sdk-source-context
      # The official SDK implements bucket listing and permission reads as
      # client operations; its own command-barrel members are not
      # reconnaissance.
      - id: well-known/lib/cloud/aws-sdk-js::v3-client-command-barrel
      # Both Ansible entries mean "this file belongs to Ansible"; one
      # vendor-identity reference expresses it and keeps this list under
      # the suppression cap.
      - id: well-known/app/infrastructure/ansible/
      - id: "metadata/file/naming::test-directory-component"
      - id: metadata/package/testing/presence/harness::unittests-directory-path
      # RegScale's S3Collector inventories buckets and policies as its
      # compliance job -- same benign scanner shape as the Prowler carve-out.
      - id: well-known/app/enterprise/regscale::regscale-cli-benign-context
    all:
      - id: s3-bucket-enumeration
      - id: s3-permission-surface-read

  - id: s3-prefix-scoped-bucket-lookup
    desc: Prefix-scoped S3 bucket lookup without unscoped calls
    crit: notable
    conf: 0.85
    for: [javascript, typescript]
    unless:
      - id: micro-behaviors/communications/http/services/aws-s3::s3-list-buckets-unscoped-call
    all:
      - id: micro-behaviors/communications/http/services/aws-s3::s3-list-buckets-prefix-lookup

