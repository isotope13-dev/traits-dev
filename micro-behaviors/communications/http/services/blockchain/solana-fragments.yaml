defaults:
  platforms: [unix, windows]
  for: [scripts, binaries, source]

traits:
  - id: solana-pocket-rpc-host-fragment
    desc: Solana or Pocket RPC hostname fragment
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)(lana-rpc\.(p|com)|ocket\.network)'
  - id: getblock-host-fragment
    desc: GetBlock provider hostname fragment
    crit: notable
    conf: 0.86
    if:
      type: text
      regex: '(?i)\.getblock\.'
