defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: notable

# Public blockchain RPC and explorer names identify an intended service.  They
# are not C2 by themselves: wallet, bridge, explorer, and indexer software
# routinely embeds the same endpoints.  C2 composites should add transport,
# staging, decoding, or execution evidence before using these atoms.
traits:
- id: polygon-publicnode
  desc: Polygon PublicNode RPC endpoint
  conf: 0.9
  if:
    type: string_literal
    substr: polygon-bor-rpc.publicnode.com
- id: polygon-lava-build
  desc: Polygon Lava RPC endpoint
  conf: 0.9
  if:
    type: string_literal
    substr: polygon.lava.build
- id: polygon-drpc
  desc: Polygon dRPC endpoint
  conf: 0.82
  if:
    type: string_literal
    substr: polygon.drpc.org
- id: trongrid-api
  desc: TronGrid API endpoint
  conf: 0.82
  if:
    type: string_literal
    substr: api.trongrid.io
- id: etherscan-api-prefix
  desc: Etherscan API endpoint
  conf: 0.8
  if:
    type: string_literal
    substr: api.etherscan.io
- id: etherscan-api-suffix
  desc: Etherscan API path
  conf: 0.8
  if:
    type: string_literal
    substr: etherscan.io/api
- id: bscscan-api
  desc: BscScan explorer endpoint
  conf: 0.85
  if:
    type: string_literal
    regex: api\.bscscan\.com|bscscan\.com/api
- id: polygonscan-api
  desc: PolygonScan explorer endpoint
  conf: 0.85
  if:
    type: string_literal
    regex: api\.polygonscan\.com|polygonscan\.com/api
- id: ethereum-jsonrpc-get-code-method
  desc: Ethereum JSON-RPC getCode method
  conf: 0.7
  if:
    type: string_literal
    substr: eth_getCode
