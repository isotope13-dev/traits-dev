defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: notable

# Public blockchain RPC and explorer names identify an intended service.  They
# are not C2 by themselves: wallet, bridge, explorer, and indexer software
# routinely embeds the same endpoints.  C2 composites should add transport,
# staging, decoding, or execution evidence before using these atoms.
traits:
- id: polygon-publicnode
  desc: Polygon PublicNode RPC endpoint
  conf: 0.9
  if:
    type: string_literal
    substr: polygon-bor-rpc.publicnode.com
- id: polygon-lava-build
  desc: Polygon Lava RPC endpoint
  conf: 0.9
  if:
    type: string_literal
    substr: polygon.lava.build
- id: polygon-drpc
  desc: Polygon dRPC endpoint
  conf: 0.82
  if:
    type: string_literal
    substr: polygon.drpc.org
- id: trongrid-api
  desc: TronGrid API endpoint
  conf: 0.82
  if:
    type: string_literal
    substr: api.trongrid.io
- id: etherscan-api-prefix
  desc: Etherscan API endpoint
  conf: 0.8
  if:
    type: string_literal
    substr: api.etherscan.io
- id: etherscan-api-suffix
  desc: Etherscan API path
  conf: 0.8
  if:
    type: string_literal
    substr: etherscan.io/api
- id: bscscan-api
  desc: BscScan explorer endpoint
  conf: 0.85
  if:
    type: string_literal
    regex: api\.bscscan\.com|bscscan\.com/api
- id: polygonscan-api
  desc: PolygonScan explorer endpoint
  conf: 0.85
  if:
    type: string_literal
    regex: api\.polygonscan\.com|polygonscan\.com/api
- id: ethereum-jsonrpc-get-code-method
  desc: Ethereum JSON-RPC getCode method
  conf: 0.7
  if:
    type: string_literal
    substr: eth_getCode
# Relocated from objectives/command-and-control/infrastructure/blockchain/, where
# a bare public Polygon RPC hostname was filed as C2 infrastructure. The matchers
# only recognize the provider's host; wallets, bridges, explorers and indexers
# embed the same tables. The etherhiding/loader composites reference them here.
- id: polygon-nodies
  desc: Polygon nodies RPC endpoint
  conf: 0.82
  # The EtherHiding family also matched this host from Lua/batch sidecar
  # loaders, so the consolidated atom keeps those file types too.
  for: [html, javascript, typescript, lua, batch]
  if:
    type: text
    substr: polygon-public.nodies.app
- id: polygon-subquery
  desc: Polygon subquery RPC endpoint
  conf: 0.82
  if:
    type: text
    substr: polygon.rpc.subquery.network/public
- id: polygon-pokt
  desc: Polygon pokt endpoint
  conf: 0.82
  if:
    type: text
    substr: polygon-pokt.nodies.app
- id: polygon-tenderly
  desc: Polygon Tenderly RPC endpoint
  conf: 0.82
  if:
    type: text
    substr: polygon.gateway.tenderly.co
- id: polygon-tenderly-public
  desc: Tenderly public Polygon endpoint
  conf: 0.82
  if:
    type: text
    substr: gateway.tenderly.co/public/polygon
- id: polygon-zan
  desc: Polygon zan endpoint
  conf: 0.82
  if:
    type: text
    substr: api.zan.top/polygon-mainnet
# Arweave permaweb gateways. Same reasoning: the gateway host names an intended
# storage service, not a channel purpose.
- id: arweave-net-gateway
  desc: Arweave.net gateway
  conf: 0.6
  for: [javascript, typescript]
  if:
    type: string_literal
    substr: arweave.net/
- id: ar-io-net-gateway
  desc: AR-IO.net gateway
  conf: 0.6
  for: [javascript, typescript]
  if:
    type: string_literal
    substr: ar-io.net/
# Relocated from objectives/command-and-control/infrastructure/blockchain/polygon/,
# which matched `polygon.(drpc|publicnode).*` in one regex. dRPC already has an
# atom above, and one host matching two atoms would inflate the provider counts
# below, so only the publicnode half is kept here.
- id: polygon-publicnode-host
  desc: Polygon publicnode RPC endpoint
  conf: 0.9
  if:
    type: text
    regex: '(?i)https?://polygon\.publicnode\.[a-z0-9.-]+'
- id: polygon-quiknode
  desc: Polygon QuikNode RPC endpoint
  conf: 0.9
  if:
    type: text
    substr: rpc-mainnet.matic.quiknode.pro
- id: polygon-tatum
  desc: Polygon Tatum RPC endpoint
  conf: 0.9
  if:
    type: text
    substr: polygon-mainnet.gateway.tatum.io

# Provider-count roll-ups. Objectives that mean "this code reaches Polygon
# through N different public providers" reference these instead of restating
# the host list, which also keeps the host atoms defined exactly once. Each
# host contributes to at most one atom, so the counts are counts of hosts.
composite_rules:
- id: polygon-public-rpc-host
  desc: Public Polygon RPC host
  crit: notable
  conf: 0.85
  any: &polygon-rpc-hosts
  - id: polygon-publicnode
  - id: polygon-lava-build
  - id: polygon-drpc
  - id: polygon-nodies
  - id: polygon-subquery
  - id: polygon-pokt
  - id: polygon-tenderly
  - id: polygon-tenderly-public
  - id: polygon-zan
  - id: polygon-publicnode-host
  - id: polygon-quiknode
  - id: polygon-tatum
- id: polygon-public-rpc-hosts-2
  desc: Two public Polygon RPC hosts
  crit: notable
  conf: 0.85
  needs: 2
  any: *polygon-rpc-hosts
- id: polygon-public-rpc-hosts-3
  desc: Three public Polygon RPC hosts
  crit: notable
  conf: 0.85
  needs: 3
  any: *polygon-rpc-hosts
