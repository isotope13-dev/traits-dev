defaults:
  platforms: [unix, windows]
  for: [javascript, python, shell]
traits:
  - id: blockcypher-api
    desc: BlockCypher API hostname reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: api.blockcypher.com
      case_insensitive: true
  - id: trongrid-host-reference
    desc: TronGrid provider hostname reference
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: trongrid.io
      case_insensitive: true
composite_rules:
  - id: tron-or-blockcypher-host
    desc: TronGrid or BlockCypher provider reference
    crit: notable
    conf: 0.9
    any:
      - id: trongrid-host-reference
      - id: blockcypher-api
