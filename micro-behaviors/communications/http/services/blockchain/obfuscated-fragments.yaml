# Fragments that survive obfuscator.io string-array packing when full RPC /
# explorer URLs are split across table entries (EtherHiding npm droppers).
# Use type:text so split pieces still match; pair with obfuscation evidence
# before treating as C2.
#
# Split dRPC / 1RPC host fragments live in http/url/rpc/ethereum.yaml
# (ethereum-drpc-host-fragment, ethereum-1rpc-path-fragment).
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: explorer-module-account-fragment
    desc: Block-explorer module=account query fragment
    conf: 0.88
    if:
      type: text
      substr: '?module=ac'
