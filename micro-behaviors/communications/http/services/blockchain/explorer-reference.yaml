defaults:
  platforms: [windows, unix]
  for: [javascript, python, shell]
  crit: notable
  conf: 0.75

traits:
  - id: etherscan-host-reference
    desc: References the Etherscan explorer hostname
    if:
      type: text
      regex: '(?i)\betherscan\.io\b'
  - id: polygonscan-host-reference
    desc: References the PolygonScan explorer hostname
    if:
      type: text
      regex: '(?i)\bpolygonscan\.com\b'

composite_rules:
  - id: ethereum-or-polygon-explorer-reference
    desc: References an Ethereum or Polygon explorer hostname
    any:
      - id: etherscan-host-reference
      - id: polygonscan-host-reference
