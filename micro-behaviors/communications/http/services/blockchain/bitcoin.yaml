defaults:
  platforms: [windows, unix]
  for: [scripts, binaries]
  crit: notable
traits:
  - id: bitcoin-opreturn-source
    desc: Source parses Bitcoin OP_RETURN data
    crit: notable
    conf: 0.94
    for: [source, class, java_class, csharp, java, kotlin, elixir, ruby, zig]
    if:
      type: string_literal
      regex: '(?i)(op_return|scriptpubkey)'

  - id: bitcoin-opreturn-source-text
    desc: Source references Bitcoin script data
    crit: notable
    conf: 0.9
    for: [source]
    if:
      type: text
      regex: '(?i)(op_return|scriptpubkey).{0,40}(hex|data|script)'


  - id: mempool-space-endpoint
    desc: mempool.space Bitcoin explorer endpoint
    conf: 0.9
    if:
      type: text
      regex: '\bmempool\.space(:[0-9]{2,5}|[/?:#\s"''<>]|$)'
  - id: blockstream-explorer-endpoint
    desc: Blockstream Bitcoin explorer endpoint
    conf: 0.9
    if:
      type: text
      regex: 'https?://blockstream\.info([:/?#\s"''<>]|$)'
  - id: blockstream-green-websocket-endpoint
    desc: Blockstream Green wallet WebSocket endpoint
    conf: 0.92
    if:
      type: text
      regex: 'wss?://green-[A-Za-z0-9.-]+\.blockstream\.com([:/?#\s"''<>]|$)'
