defaults:
  platforms:
  - windows
  - unix
  for:
  - javascript
  - python
  - shell
  crit: notable
  conf: 0.75
traits:
- id: tronscan-or-bscscan-host-reference
  desc: Tronscan or BscScan hostname reference
  unless:
  - id: metadata/file/format/source-map::sourcemap
  - id: metadata/path::js-distribution-output-path
  if:
    type: text
    regex: (?i)(tronscan\.org|bscscan\.com)
- id: solscan-or-aptoslabs-host-reference
  desc: Solscan or Aptos Labs hostname reference
  if:
    type: text
    regex: (?i)(solscan\.io|aptoslabs\.com)
- id: etherscan-or-bscscan-api-name-reference
  desc: Etherscan or BscScan API name reference
  if:
    type: text
    regex: (?i)(etherscan-api|bscscan-api)
