defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source

traits:
  - id: gdrive-domain
    desc: Google Drive web domain
    crit: notable
    conf: 0.8
    if:
      type: text
      substr: drive.google.com
    unless:
      - id: metadata/lang/upstream::linux-kernel-primary-tree-path
      - id: micro-behaviors/os/syscall/invoke::linux-kernel-source-context
      - id: metadata/build/minifier::js-minified-template-guard
  - id: googleapis-drive
    desc: Google Drive API reference
    crit: notable
    conf: 0.8
    for: [scripts, source, binaries]
    if:
      type: text
      regex: googleapis\.com/(upload/)?drive/v[0-9]+/
    unless:
      - id: metadata/build/minifier::js-minified-template-guard
      - id: metadata/path/directory::test-directory-component
  - id: google-drive-auth-scope
    desc: Google Drive OAuth authorization scope
    crit: notable
    conf: 0.88
    for: [scripts, binaries]
    if:
      type: text
      substr: googleapis.com/auth/drive
    unless:
      - id: metadata/package/testing/
      - id: metadata/path/directory::test-directory-component
  - id: google-drive-direct-download-url
    desc: Google Drive direct download URL
    crit: notable
    conf: 0.8
    if:
      type: text
      regex: drive\.google\.com/uc\?export=download&id=|drive\.usercontent\.google\.com/download
    not:
      - substr: "/view?usp="
  - id: google-drive-files-list-call
    desc: Lists Google Drive files
    crit: notable
    conf: 0.92
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)\bdrive\.files\.list\s*\('
  - id: google-drive-files-rest-collection
    desc: Google Drive files REST collection endpoint
    crit: notable
    conf: 0.95
    for: [scripts, binaries]
    if:
      type: text
      regex: 'https://(www\.)?googleapis\.com/drive/v[0-9]+/files([?#"''\s]|$)'
  - id: google-drive-files-get-call
    desc: Google Drive files.get API call
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)\bdrive\.files\.get\s*\('
  - id: google-drive-alt-media-param
    desc: Drive download alt=media parameter
    crit: component
    conf: 0.88
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)\balt["'']?\s*[:=]\s*["'']media["'']'
  - id: google-drive-files-create-upload
    desc: Creates or uploads a Google Drive file
    crit: notable
    conf: 0.9
    for: [scripts, binaries]
    if:
      type: text
      regex: '(?i)\bdrive\.files\.(create|update)\s*\('
  - id: google-drive-js-client
    desc: googleapis Drive client construction
    crit: notable
    conf: 0.88
    for: [javascript, typescript]
    if:
      type: text
      regex: '(?i)\bgoogle\.drive\s*\(\s*\{[^}]{0,80}version\s*:'


composite_rules:
  - id: google-drive-api
    desc: Google Drive service access
    crit: notable
    conf: 0.9
    any:
      - id: micro-behaviors/communications/http/services/drive-google::gdrive-domain
      - id: micro-behaviors/communications/http/services/drive-google::googleapis-drive

  - id: google-drive-files-get-media
    desc: Downloads Google Drive file media content
    crit: notable
    conf: 0.92
    for: [scripts, binaries]
    all:
      - id: micro-behaviors/communications/http/services/drive-google::google-drive-files-get-call
      - id: micro-behaviors/communications/http/services/drive-google::google-drive-alt-media-param
    near_bytes: 160

  - id: google-drive-rest-media-download
    desc: Downloads file content through Drive REST
    crit: notable
    conf: 0.96
    for: [scripts, binaries]
    all:
      - id: micro-behaviors/communications/http/services/drive-google::google-drive-files-rest-collection
      - id: micro-behaviors/communications/http/services/drive-google::google-drive-alt-media-param
    near_bytes: 2200

  - id: google-drive-file-listing
    desc: Lists files through the Google Drive API
    crit: notable
    conf: 0.95
    for: [scripts, binaries]
    any:
      - id: micro-behaviors/communications/http/services/drive-google::google-drive-files-list-call
      - id: micro-behaviors/communications/http/services/drive-google::google-drive-files-rest-collection

  - id: google-drive-content-download
    desc: Downloads Google Drive file content
    crit: notable
    conf: 0.95
    for: [scripts, binaries]
    any:
      - id: micro-behaviors/communications/http/services/drive-google::google-drive-files-get-media
      - id: micro-behaviors/communications/http/services/drive-google::google-drive-rest-media-download

  # Two independent Drive markers -- endpoint, client construction, or OAuth
  # scope -- rather than a single URL mention. Still neutral: it says the code
  # is a Drive API client, not what it uses the Drive for.
  - id: google-drive-api-client-surface
    desc: Google Drive API client surface
    crit: notable
    conf: 0.93
    for: [scripts, binaries]
    any:
      - id: micro-behaviors/communications/http/services/drive-google::googleapis-drive
      - id: micro-behaviors/communications/http/services/drive-google::google-drive-js-client
      - id: micro-behaviors/communications/http/services/drive-google::google-drive-auth-scope
    needs: 2

  - id: google-drive-periodic-two-way-sync
    desc: Periodic two-way Google Drive synchronization
    crit: notable
    conf: 0.98
    for: [javascript]
    all:
      - id: micro-behaviors/communications/http/services/drive-google::google-drive-api-client-surface
      - id: micro-behaviors/communications/http/services/drive-google::google-drive-files-list-call
      - id: micro-behaviors/communications/http/services/drive-google::google-drive-files-get-media
      - id: micro-behaviors/communications/http/services/drive-google::google-drive-files-create-upload
      - id: micro-behaviors/time/schedule/interval::setInterval-reference
    near_bytes: 12000
