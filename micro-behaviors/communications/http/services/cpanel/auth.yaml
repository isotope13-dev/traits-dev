defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - source
  crit: notable
  conf: 0.95
traits:
- id: internal-auth-timestamp-line-literal
  desc: cPanel internal authentication timestamp line
  if:
    type: literal
    regex: (^|\r?\n)successful_internal_auth_with_timestamp=[0-9]+\r?\n
    exclude_docstrings: true
- id: internal-auth-timestamp-line-decoded
  desc: Decoded cPanel internal-auth timestamp line
  if:
    type: encoded
    regex: (^|\r?\n)successful_internal_auth_with_timestamp=[0-9]+\r?\n
  for:
  - python
  - javascript
  - go
  - powershell
- id: root-privilege-assertion-literal
  desc: cPanel record asserts root privileges
  if:
    type: literal
    regex: (^|\r?\n)hasroot=1(\r?\n|$)
    exclude_docstrings: true
- id: root-privilege-assertion-decoded
  desc: Decoded cPanel root privilege assertion
  if:
    type: encoded
    regex: (^|\r?\n)hasroot=1(\r?\n|$)
  for:
  - python
  - javascript
  - go
  - powershell
- id: two-factor-assertion-literal
  desc: cPanel record asserts two-factor verification
  if:
    type: literal
    regex: (^|\r?\n)tfa_verified=1(\r?\n|$)
    exclude_docstrings: true
- id: two-factor-assertion-decoded
  desc: Decoded cPanel two-factor assertion
  if:
    type: encoded
    regex: (^|\r?\n)tfa_verified=1(\r?\n|$)
  for:
  - python
  - javascript
  - go
  - powershell
- id: preauth-login-path
  desc: cPanel preauthentication login path
  if:
    type: literal
    regex: /login/\?login_only=1\b
    exclude_docstrings: true
- id: whm-session-cookie
  desc: WHM session cookie name
  if:
    type: literal
    exact: whostmgrsession
    exclude_docstrings: true
- id: session-propagation-path
  desc: WHM account-list session propagation path
  if:
    type: literal
    substr: /scripts2/listaccts
    exclude_docstrings: true
- id: python-account-list-request
  desc: Requests the WHM hosting account list
  for:
  - python
  if:
    type: symbol
    kind: call
    regex: \.get$
    arg:
      index: 0
      from:
        value: /json-api/listaccts\b
- id: python-preauth-login-request
  desc: POST targets cPanel preauthentication login
  for:
  - python
  if:
    type: symbol
    kind: call
    regex: \.post$
    arg:
      index: 0
      from:
        value: /login/\?login_only=1\b
composite_rules:
- id: internal-auth-timestamp-line
  desc: cPanel internal authentication timestamp line
  any:
  - id: internal-auth-timestamp-line-literal
  - id: internal-auth-timestamp-line-decoded
- id: root-privilege-assertion
  desc: cPanel record asserts root privileges
  any:
  - id: root-privilege-assertion-literal
  - id: root-privilege-assertion-decoded
- id: two-factor-assertion
  desc: cPanel record asserts two-factor verification
  any:
  - id: two-factor-assertion-literal
  - id: two-factor-assertion-decoded
- id: python-preauth-session-handling
  desc: WHM login request with session-cookie and Basic-auth handling
  crit: notable
  conf: 0.9
  near_lines: 40
  all:
  - id: micro-behaviors/communications/http/services/cpanel::python-preauth-login-request
  - id: micro-behaviors/communications/http/services/cpanel::whm-session-cookie
  - id: micro-behaviors/communications/http/basic-auth::basic-scheme-literal
  for:
  - python
