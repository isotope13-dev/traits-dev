defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.96

traits:
  - id: api-host
    desc: Mail.tm disposable-mail API host
    if:
      type: string_literal
      substr: https://api.mail.tm





composite_rules:
  - id: account-inbox-route-set
    desc: Mail.tm account, token and inbox route references
    crit: notable
    all:
      - id: api-host
      - id: micro-behaviors/communications/http/url/path::account-create-route
      - id: micro-behaviors/communications/http/url/path::account-token-route
      - id: micro-behaviors/communications/http/url/path::message-list-route
      - id: micro-behaviors/communications/http/url/path::message-read-route
