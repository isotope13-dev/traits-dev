defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.96

traits:
  - id: api-host
    desc: Mail.tm disposable-mail API host
    if:
      type: string_literal
      substr: https://api.mail.tm

  - id: account-create-route
    desc: Account-creation route fragment
    crit: component
    if:
      type: text
      regex: '/accounts\b'

  - id: account-token-route
    desc: Account-token route fragment
    crit: component
    if:
      type: text
      regex: '/token\b'

  - id: message-list-route
    desc: Message-list route fragment
    crit: component
    if:
      type: text
      regex: '/messages\b'

  - id: message-read-route
    desc: Individual-message route fragment
    crit: component
    if:
      type: text
      substr: /messages/

composite_rules:
  - id: disposable-mail-account-inbox-lifecycle
    desc: Creates and reads a disposable-mail inbox
    crit: notable
    all:
      - id: api-host
      - id: account-create-route
      - id: account-token-route
      - id: message-list-route
      - id: message-read-route
