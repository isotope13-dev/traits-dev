defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable
  conf: 0.96

traits:
  - id: api-host
    desc: Mail.tm disposable-mail API host
    if:
      type: string_literal
      substr: https://api.mail.tm





composite_rules:
  - id: account-inbox-route-set
    desc: Mail.tm account, token and inbox route references
    crit: notable
    all:
      - id: api-host
      - id: micro-behaviors/communications/url/resource-path/identity::account-collection-route
      - id: micro-behaviors/fs/path/token::root-token-path-reference
      - id: micro-behaviors/communications/url/resource-path/content::message-collection-route
      - id: micro-behaviors/communications/url/resource-path/content::message-item-route
