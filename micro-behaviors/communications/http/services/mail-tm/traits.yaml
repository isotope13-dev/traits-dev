defaults:
  platforms: [unix, windows]
  for: [python]
  crit: notable
  conf: 0.96

traits:
  - id: api-host
    desc: Mail.tm disposable-mail API host
    if:
      type: string_literal
      exact: https://api.mail.tm

  - id: account-create-route
    desc: Mail.tm disposable-mail account creation route
    if:
      type: text
      regex: 'MAILTM_BASE\s*\}/accounts\b'

  - id: account-token-route
    desc: Mail.tm disposable-mail account token route
    if:
      type: text
      regex: 'MAILTM_BASE\s*\}/token\b'

  - id: message-list-route
    desc: Mail.tm disposable-mail inbox listing route
    if:
      type: text
      regex: 'MAILTM_BASE\s*\}/messages\b'

  - id: message-read-route
    desc: Mail.tm disposable-mail message retrieval route
    if:
      type: text
      regex: 'MAILTM_BASE\s*\}/messages/\{msg_id\}'
