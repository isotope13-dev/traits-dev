defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.9

traits:
  - id: webhdfs-api-url-port-50070
    desc: WebHDFS API URL uses legacy port 50070
    if:
      type: text
      regex: '(?i)https?://[^\s"'']{1,255}:50070/webhdfs/v1\b'

  - id: webhdfs-open-operation-url
    desc: WebHDFS URL requests the OPEN operation
    if:
      type: text
      regex: '(?i)/webhdfs/v1[^\s"'']{0,255}[?&]op=OPEN\b'
