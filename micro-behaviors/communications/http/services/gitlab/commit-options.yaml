defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: gitlab-repository-commit-post-options
    desc: Passes GitLab repository commit POST options
    crit: notable
    conf: 0.98
    if:
      type: tree-sitter
      query: |
        (call_expression
          arguments: (arguments
            (binary_expression right: (string (string_fragment) @endpoint))
            . (object
              (pair key: [(property_identifier) @method (string (string_fragment) @method)]
                value: (string (string_fragment) @verb))))
          (#eq? @endpoint "/repository/commits")
          (#eq? @method "method") (#eq? @verb "POST")) @match
