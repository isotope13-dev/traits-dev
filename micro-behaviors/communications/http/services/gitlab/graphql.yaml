# GitLab GraphQL request surfaces. These atoms describe ordinary service
# routes and query syntax; exploit intent is composed under objectives.
defaults:
  platforms: [unix, windows]
  for: [scripts, source]
  crit: notable

traits:
  - id: public-project-list-route
    desc: GitLab API enumerates public projects
    conf: 0.95
    if:
      type: text
      regex: '(?i)/api/v4/projects\?[^\s"''#]{0,160}\bvisibility=public\b'

  - id: graphql-public-object-selector
    desc: GitLab GraphQL selects public object
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b(project\s*\(\s*fullPath|user\s*\(\s*username)\s*:'

  - id: graphql-gl-introduced-directive
    desc: GraphQL gl_introduced version directive
    conf: 0.98
    if:
      type: text
      regex: '(?i)@gl_introduced\s*\(\s*version\s*:'
