defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  crit: suspicious
traits:
- id: gitlab-api-client-set-base-url
  desc: GitLab client sets its API base URL
  crit: notable
  conf: 0.88
  for:
  - javascript
  - typescript
  if:
    type: text
    regex: (?i)(glGot|gl-got|gitlab)[^;\n]{0,160}setBaseUrl
