defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.94
  mbc: C0002

traits:
  - id: ssm-decrypted-parameter-read
    desc: SSM parameter command text requests decryption
    if:
      type: text
      regex: 'GetParameters?Command\s*\(\s*\{[^}]{0,320}WithDecryption\s*:\s*true\b'
