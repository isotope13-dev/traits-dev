# Linked method names of the Tencent COS Go SDK (cos-go-sdk-v5) in a compiled
# Go binary. The Go linker drops unreferenced methods, so the surviving
# BucketService/ObjectService methods record which storage operations the
# program actually performs: listing a bucket, fetching objects, writing them.
defaults:
  platforms: [unix, windows]
  for: [binaries]
  crit: notable
  conf: 0.95
  attack: T1102
  # A linked Go binary cannot be small: the runtime alone is over a megabyte.
  size_min: 1000000

traits:
  - id: go-cos-bucket-list-method
    desc: Go COS client lists bucket contents
    if:
      type: text
      substr: 'cos-go-sdk-v5.(*BucketService).Get'
  - id: go-cos-object-get-method
    desc: Go COS client downloads objects
    if:
      type: text
      substr: 'cos-go-sdk-v5.(*ObjectService).Get'
  - id: go-cos-object-put-method
    desc: Go COS client uploads objects
    if:
      type: text
      substr: 'cos-go-sdk-v5.(*ObjectService).Put'

composite_rules:
  - id: go-cos-list-get-put-client
    desc: Go COS client lists, downloads and uploads objects
    all:
      - id: go-cos-bucket-list-method
      - id: go-cos-object-get-method
      - id: go-cos-object-put-method
