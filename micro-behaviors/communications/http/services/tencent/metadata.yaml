defaults:
  platforms: [unix, windows]
  crit: notable
  for: [scripts, binaries, package.json]
traits:
  - id: tencent-metadata-host-endpoint-reference
    desc: Tencent metadata hostname endpoint reference
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: metadata.tencentyun.com/latest/meta-data

  - id: tencent-metadata-ip-endpoint-reference
    desc: Tencent metadata IP endpoint reference
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: 169.254.0.23/latest/meta-data
