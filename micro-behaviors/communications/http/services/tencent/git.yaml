defaults:
  platforms: [unix, windows]
  crit: notable
  for: [scripts, source]
traits:
  - id: tencent-git-woa-endpoint
    desc: References Tencent internal Git host
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'git.woa.com'

  - id: tencent-gongfeng-cli-mirror-endpoint
    desc: Tencent Gongfeng CLI mirror endpoint
    crit: notable
    conf: 0.98
    if:
      type: text
      substr: 'mirrors.tencent.com/repository/generic/gongfeng-cli'
