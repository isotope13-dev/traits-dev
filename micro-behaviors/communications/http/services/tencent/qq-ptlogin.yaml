# Tencent ptlogin endpoints. The QQ desktop client runs a local HTTPS server
# (localhost.ptlogin2.qq.com:4301) that lists logged-in accounts and issues a
# client key; /jump exchanges that key for web cookies (skey, p_skey).
# Tencent's own login pages use these, so each atom is a neutral reference.
defaults:
  platforms: [windows, macos]
  for: [binaries, scripts, javascript]
  crit: notable
  conf: 0.9

traits:
  - id: ptlogin-local-quick-login-host
    desc: References QQ local quick-login server
    if:
      type: text
      substr: localhost.ptlogin2.qq.com
  - id: ptlogin-client-key-request
    desc: Requests QQ client session ticket by UIN
    if:
      type: text
      substr: 'pt_get_st?clientuin='
  - id: ptlogin-account-list-request
    desc: Requests logged-in QQ account list
    if:
      type: text
      substr: 'pt_get_uins?callback='
  - id: ptlogin-jump-client-key
    desc: QQ ptlogin jump exchanges client key
    if:
      type: text
      regex: '/jump\?clientuin=\S{0,12}&keyindex=\d'
  - id: qun-manager-member-api
    desc: QQ group manager member or friend API
    if:
      type: text
      regex: '/cgi-bin/qun_mgr/(get_friend_list|search_group_members|get_group_list)'
