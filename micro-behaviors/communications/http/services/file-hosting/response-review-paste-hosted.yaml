defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, php, ruby, powershell, shell]
traits:
  - id: paste-service-raw-path
    desc: Paste service raw content path
    crit: notable
    conf: 0.93
    unless:
      - id: metadata/file/format/log::windows-event-csv-records
    if:
      type: literal
      regex: '(pastebin|hastebin|controlc|ghostbin|dpaste)\.\w{2,4}/raw'

  # Node's `https.get({hostname, path})` form never puts the host and the path
  # in one string, so a matcher that only knows the joined URL misses it. The
  # raw-content path is distinctive on its own: a short opaque slug under
  # `/raw/`, which is the paste-service permalink shape.
