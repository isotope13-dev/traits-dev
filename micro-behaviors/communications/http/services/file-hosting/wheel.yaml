# Hosting provenance does not establish dependency impersonation or a download.
# Retain the original 96-byte proximity and complete pre-move service set.
defaults:
  platforms: [unix, windows, android]
  for: [scripts, binaries]

composite_rules:
  - id: wheel-url-near-file-host
    for: [binaries, '!dex', scripts, '!jcl']
    desc: Wheel URL near a file-host reference
    crit: notable
    conf: 0.96
    near_bytes: 96
    all:
      - id: micro-behaviors/communications/http/url/archive::python-wheel-url-reference
    any:
      - id: pastebin
      - id: bullethost-cloud
      - id: anonfiles-com
      - id: gofile-io
      - id: gofile-uploadfile-endpoint
      - id: gofile-download-link-prefix
      - id: transfer-sh
      - id: tmpfiles-org
      - id: split-tmpfiles-org-fragments
      - id: catbox-moe
      - id: uguu-se
      - id: pomf-cat
      - id: 0x0-st
      - id: x0-at
      - id: file-io
      - id: filedropper-com
      - id: doko-moe
      - id: freehostia-com
      - id: keyval-api-host
      - id: herokuapp-com
      - id: blogspot-url-binary
      - id: yourjavascript-com-script-host
      - id: public-file-or-payload-hosting
      - id: multi-public-file-hosting-services
      - id: public-file-hosting-with-upload-evidence
