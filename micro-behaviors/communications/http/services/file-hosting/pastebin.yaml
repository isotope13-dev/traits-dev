defaults:
  platforms: [windows, linux, macos]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9

traits:
- id: pastebin
  desc: References the Pastebin host
  if:
    type: text
    regex: '.{0,60}pastebin\.com'
  not:
    - regex: '(//|/\*|#)\s[^\n]{0,60}pastebin\.com'
  unless:
    - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
# A Pastebin-style host abused to stage payloads (Malwarebytes classifies the
# domain as riskware). The host alone is a reference, not C2: consumers that
# bind it to a fetch-and-run add the intent. Source must hold it in a string
# literal: comments and docstrings are documentation, not a configured
# endpoint. Binaries expose no literal surface, so they use extracted text.
- id: klgrth-io
  desc: References the klgrth.io paste host
  for: [scripts, source]
  if:
    type: literal
    kind: string
    regex: '(?i)\bklgrth\.io\b'
    exclude_docstrings: true
- id: klgrth-io-binary-string
  desc: Binary references the klgrth.io paste host
  for: [binaries]
  if:
    type: text
    regex: '(?i)\bklgrth\.io\b'
