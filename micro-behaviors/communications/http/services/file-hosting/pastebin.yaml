defaults:
  platforms: [windows, linux, macos]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9

traits:
- id: pastebin
  desc: References the Pastebin host
  if:
    type: text
    regex: '.{0,60}pastebin\.com'
  not:
    - regex: '(//|/\*|#)\s[^\n]{0,60}pastebin\.com'
  unless:
    - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
# A Pastebin-style host with no mainstream use, abused to stage payloads
# (Malwarebytes classifies the domain as riskware), hence suspicious where
# Pastebin itself is notable. Consumers that bind it to a fetch-and-run add
# the intent. Source must hold it in a string
# literal: comments and docstrings are documentation, not a configured
# endpoint. Binaries expose no literal surface, so they use extracted text.
- id: klgrth-io
  desc: References the klgrth.io paste host
  crit: suspicious
  for: [scripts, source]
  if:
    type: literal
    kind: string
    regex: '(?i)\bklgrth\.io\b'
    exclude_docstrings: true
- id: klgrth-io-binary-string
  desc: Binary references the klgrth.io paste host
  crit: suspicious
  for: [binaries]
  if:
    type: text
    regex: '(?i)\bklgrth\.io\b'
