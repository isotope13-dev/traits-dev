defaults:
  platforms: [windows, linux, macos]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9

traits:
- id: pastebin
  desc: References the Pastebin host
  if:
    type: text
    regex: '.{0,60}pastebin\.com'
  not:
    - regex: '(//|/\*|#)\s[^\n]{0,60}pastebin\.com'
  unless:
    - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
