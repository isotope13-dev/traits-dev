defaults:
  platforms: [windows, linux, macos]
  for: [scripts, binaries]
  crit: notable
  conf: 0.9

traits:
- id: pastebin
  desc: References the Pastebin host
  if:
    type: text
    regex: '.{0,60}pastebin\.com'
  not:
    - regex: '(//|/\*|#)\s[^\n]{0,60}pastebin\.com'
- id: klgrth-io
  desc: References the klgrth.io paste host
  crit: suspicious
  for: [scripts, source]
  if:
    type: literal
    kind: string
    regex: '(?i)\bklgrth\.io\b'
    exclude_docstrings: true
- id: klgrth-io-binary-string
  desc: Binary references the klgrth.io paste host
  crit: suspicious
  for: [binaries]
  if:
    type: text
    regex: '(?i)\bklgrth\.io\b'
