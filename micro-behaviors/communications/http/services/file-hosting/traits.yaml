defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
  - source
  mbc: C0002
traits:
- id: bullethost-cloud
  desc: Bullethost.cloud file hosting
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: bullethost.cloud
- id: anonfiles-com
  desc: Anonfiles.com file hosting
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: anonfiles.com
- id: gofile-io
  desc: Gofile.io file hosting
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: gofile.io
- id: gofile-uploadfile-endpoint
  desc: Gofile uploadfile API endpoint
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)upload\.gofile\.io/uploadfile
- id: gofile-download-link-prefix
  desc: Gofile public download-link prefix
  crit: notable
  conf: 0.85
  if:
    type: text
    regex: (?i)https?://gofile\.io/d/
- id: transfer-sh
  desc: Transfer.sh file hosting
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: (?i)\btransfer\.sh([/?:#&\s"']|$)
- id: tmpfiles-org
  desc: Tmpfiles.org file hosting
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: tmpfiles.org
- id: split-tmpfiles-org-fragments
  desc: Split Tmpfiles.org host fragments
  crit: notable
  conf: 0.9
  if:
    type: text
    regex: '["'']tmp["'']\s*,\s*["'']files["'']\s*,\s*["'']\.org["'']'
- id: catbox-moe
  desc: Catbox.moe file hosting
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: catbox.moe
- id: uguu-se
  desc: Uguu.se file hosting
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: uguu.se
- id: pomf-cat
  desc: Pomf.cat file hosting
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: pomf.cat
- id: 0x0-st
  desc: 0x0.st file hosting
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: 0x0.st
- id: x0-at
  desc: x0.at ephemeral file hosting
  crit: notable
  conf: 0.8
  if:
    type: text
    regex: https?://x0\.at/
- id: file-io
  desc: File.io file hosting
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: (^|[^\w.])file\.io([^\w.]|$)
  unless:
  - id: metadata/lang/upstream::linux-kernel-primary-tree-path
- id: filedropper-com
  desc: Filedropper.com file hosting
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: filedropper.com
  unless:
  - id: well-known/app/browser-extension/content-blocker::adblock-filter-resource
- id: doko-moe
  desc: Doko.moe file hosting (commonly abused)
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: doko.moe
- id: freehostia-com
  desc: Freehostia.com free web hosting
  crit: notable
  conf: 0.7
  if:
    type: text
    substr: freehostia.com
  unless:
  - id: metadata/build/recognized-contexts/
- id: keyval-api-host
  desc: api.keyval.org public key-value endpoint
  crit: notable
  conf: 0.92
  for:
  - html
  - javascript
  - typescript
  if:
    type: text
    substr: api.keyval.org
- id: herokuapp-com
  desc: Heroku app-hosted endpoint reference
  crit: notable
  conf: 0.7
  if:
    type: text
    regex: '[a-z0-9-]+\.herokuapp\.com'
  not:
  - substr: mm-resource-service.herokuapp.com
- id: blogspot-url-binary
  desc: Blogspot URL reference
  crit: notable
  conf: 0.75
  for:
  - binaries
  size_max: 10485760
  if:
    type: string_literal
    regex: 'https?://[^\s]{1,120}blogspot\.com([/?#: ]|$)'
  not:
  - regex: (?i)(https?://\S+blogspot\.com\S{0,80})\s*\*/
  unless:
  - id: metadata/package/testing/
  - id: well-known/tool/development/debug/debugpy
  - id: metadata/path::test-directory-component
- id: yourjavascript-com-script-host
  desc: Yourjavascript.com free script hosting
  crit: notable
  conf: 0.85
  for:
  - html
  - javascript
  if:
    type: text
    substr: yourjavascript.com/
composite_rules:
- id: public-file-or-payload-hosting
  desc: References public file or payload hosting service
  crit: notable
  conf: 0.95
  any:
  - id: bullethost-cloud
  - id: anonfiles-com
  - id: gofile-io
  - id: transfer-sh
  - id: tmpfiles-org
  - id: split-tmpfiles-org-fragments
  - id: catbox-moe
  - id: uguu-se
  - id: pomf-cat
  - id: 0x0-st
  - id: x0-at
  - id: file-io
  - id: filedropper-com
  - id: doko-moe
  - id: freehostia-com
  - id: blogspot-url-binary
- id: multi-public-file-hosting-services
  desc: References multiple public file-hosting services
  crit: notable
  conf: 0.9
  all:
  - id: catbox-moe
  - id: tmpfiles-org
  - id: uguu-se
- id: public-file-hosting-with-upload-evidence
  desc: File-hosting reference with HTTP upload evidence
  crit: notable
  conf: 0.94
  unless:
  - id: metadata/file/format/log::windows-event-csv-records
  all:
  - id: public-file-or-payload-hosting
  any:
  - id: micro-behaviors/communications/http/upload
