defaults:
  platforms: [windows, unix]
  for: [javascript, typescript, python, php, ruby, powershell, shell]
traits:
  - id: paste-service-host-group-a
    desc: Paste-service host reference
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\b(pastebin\.com|hastebin\.com|ghostbin\.(com|site|co)|paste\.ee)\b'
  - id: paste-service-host-group-b
    desc: Paste-service host reference
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\b(pastefy\.app|dpaste\.(com|org)|privatebin\.net|rentry\.(co|org))\b'
  - id: paste-service-host-group-c
    desc: Paste-service host reference
    crit: notable
    conf: 0.93
    if:
      type: text
      regex: '(?i)\b(ctrlv\.it|termbin\.com|pastery\.net|textbin\.net|shz\.al|controlc\.com)\b'
composite_rules:
  - id: paste-service-host-reference
    desc: Paste-service host reference
    crit: notable
    conf: 0.93
    any:
      - id: paste-service-host-group-a
      - id: paste-service-host-group-b
      - id: paste-service-host-group-c
  - id: paste-host-and-raw-path-clues
    desc: Paste-service host and raw-path clues
    crit: notable
    conf: 0.93
    scope: file
    all:
      - id: micro-behaviors/communications/url/path::raw-identifier-path-literal
      - id: paste-service-host-reference
