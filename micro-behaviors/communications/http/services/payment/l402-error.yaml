# Call facts do not express attachment to the exact value a throw consumes.
# Keep serialization/logging between the challenge and Error, but reject
# intervening reassignments of either binding.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
traits:
  - id: l402-challenge-attached-to-thrown-error
    desc: Throws Error with attached L402 challenge
    crit: notable
    conf: 0.99
    if:
      type: tree-sitter
      query: |
        ((statement_block
          (lexical_declaration (variable_declarator name: (identifier) @challenge
            value: (object (pair key: (property_identifier) @code
              value: (string (string_fragment) @payment_code)))))
          . [(lexical_declaration (variable_declarator value: (call_expression)))
             (expression_statement (call_expression))]*
          . (lexical_declaration (variable_declarator name: (identifier) @error
              value: (new_expression constructor: (identifier) @constructor)))
          . (expression_statement (assignment_expression
                left: (member_expression object: (identifier)
                  property: (property_identifier)) right: (string)))?
          . (expression_statement (assignment_expression
              left: (member_expression object: (identifier) @attached property: (property_identifier))
              right: (identifier) @details))
          . (throw_statement (identifier) @thrown))
          (#eq? @code "code") (#eq? @payment_code "L402_PAYMENT_REQUIRED")
          (#eq? @constructor "Error") (#eq? @challenge @details)
          (#eq? @error @attached) (#eq? @attached @thrown)
          (#set! cleave.ignore-comments "true"))
