# Ordinary paid-service errors are not extortion. This matches wording
# and throw syntax nearby, without claiming lockout or a bound payment flow.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: payment-wording-before-error-throw
    desc: Payment-required wording before Error throw
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?is)(payment.{0,20}required|pay.{0,20}(invoice|sats)).{0,400}throw new Error'
