defaults:
  platforms: [windows, unix]
  for: [javascript, typescript]
  crit: notable
  conf: 0.8

traits:
- id: x402-wrap-fetch-with-payment
  desc: x402 wrapFetchWithPayment call
  if:
    type: symbol
    exact: wrapFetchWithPayment
- id: x402-client-constructor
  desc: x402 client constructor
  if:
    type: text
    word: x402Client
- id: x402-payment-header
  desc: x402 payment header
  if:
    type: text
    word: X-PAYMENT
- id: x402-payment-protocol-header
  desc: x402 payment protocol header
  if:
    type: text
    word: X-Payment-Protocol
- id: l402-payment-challenge-code
  desc: L402 payment required challenge code
  if:
    type: text
    regex: '(?i)\bL402_PAYMENT_REQUIRED\b'
- id: l402-payment-protocol-reference
  desc: L402 payment protocol reference
  if:
    type: text
    regex: '(?i)["'']L402(/x402)?["'']'
- id: lightning-bolt11-invoice-reference
  desc: References Lightning Network BOLT11 invoice
  if:
    type: text
    regex: '(?i)\bbolt11\b'

- id: lightning-address-literal-destination
  desc: Sets a hardcoded Lightning payment address
  crit: component
  if:
    type: text
    exclude_comments: true
    regex: '\bpayment_(destination|address)["'']?\s*:\s*["''][\w.+-]+@[\w.-]+\.[a-zA-Z]{2,}'

- id: throws-lightning-payment-challenge
  desc: Attaches Lightning challenge to thrown error
  crit: component
  if:
    type: text
    exclude_comments: true
    regex: '\.l402\s*=\s*[\w$]+\s*;?\s*throw\s+[\w$]+'

composite_rules:
- id: hardcoded-lightning-challenge-error
  desc: Throws a Lightning payment challenge with a hardcoded receiver
  conf: 0.94
  near_lines: 28
  all:
  - id: lightning-address-literal-destination
  - id: throws-lightning-payment-challenge
  any:
  - id: l402-payment-challenge-code
  - id: lightning-bolt11-invoice-reference
