# VDO.Ninja -- a free peer-to-peer WebRTC service that relays a browser tab's
# audio/video (including `screenshare`) or an OBS/device feed to a remote
# viewer. Legitimate for streamers, but a standard covert screen/audio/video
# redirection channel for observing a target host or impersonating a webcam
# without installing native remote-access software. Matched on the service's
# URL as it appears in browser history / cache artifacts
# (`hxxps://vdo.ninja/?push=...&screenshare`). Neutral service identity;
# covert-capture intent is composed in objectives/collection/.
defaults:
  platforms: [unix, windows]
  for: [text]
  crit: notable
  conf: 0.92

traits:
  - id: vdo-ninja-url
    desc: VDO.Ninja media streaming URL
    if:
      type: text
      regex: '(?i)vdo\.ninja'
