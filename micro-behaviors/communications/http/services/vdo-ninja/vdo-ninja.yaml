# VDO.Ninja is a peer-to-peer WebRTC service that relays browser-tab audio and
# video or an OBS/device feed. These traits match URL structure recovered from
# browser history/cache, including the `push` and `screenshare` parameters used
# to send a host display. The service is legitimate streaming infrastructure;
# covert-presence intent is composed in objectives/collection/.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries, data, registry, -text, -objectivec, -swift,
        -groovy, -scala, -zig, -elixir, -clojure]
  crit: notable
  conf: 0.92

traits:
  - id: vdo-ninja-url
    desc: VDO.Ninja media streaming URL
    if:
      type: text
      regex: '(?i)(https?|hxxps?)://(www\.)?vdo\.ninja([/?#]|$)'

  - id: vdo-ninja-push-url
    desc: VDO.Ninja outbound media push URL
    if:
      type: text
      regex: '(?i)vdo\.ninja/[^\s"''<>]{0,900}[?&]push=[^&\s"''<>]{1,256}'

  - id: vdo-ninja-screenshare-url
    desc: VDO.Ninja screen-sharing URL
    if:
      type: text
      regex: '(?i)vdo\.ninja/[^\s"''<>]{0,900}[?&]screenshare([=&]|[?#\s"''<>]|$)'

composite_rules:
  - id: vdo-ninja-screen-share-push
    desc: Pushes a screen-sharing feed through VDO.Ninja
    crit: notable
    all:
      - id: vdo-ninja-push-url
      - id: vdo-ninja-screenshare-url
    near_bytes: 64
