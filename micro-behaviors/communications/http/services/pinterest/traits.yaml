defaults:
  platforms: [windows, unix]
  for: [binaries, scripts, source, -class, -pyc, -beam, -wasm, -staticlib]
  crit: notable
  mbc: C0002

traits:
  - id: pinterest-profile-url
    desc: Pinterest user profile URL
    conf: 0.92
    if:
      type: text
      regex: '(?i)https?://(www\.)?pinterest\.[a-z.]{2,8}/[A-Za-z0-9_-]{3,80}'
    not:
      - regex: '(?i)/pin$'
      - regex: '(?i)/ideas$'
      - regex: '(?i)/search$'
      - regex: '(?i)/business$'
      - regex: '(?i)/settings$'
      - regex: '(?i)/login$'
      - regex: '(?i)/logout$'
      - regex: '(?i)/join$'

  - id: pinterest-pin-share-url
    desc: Pinterest Pin sharing endpoint
    conf: 0.98
    if:
      type: text
      regex: '(?i)https?://(www\.)?pinterest\.[a-z.]{2,8}/pin/create/button/'
