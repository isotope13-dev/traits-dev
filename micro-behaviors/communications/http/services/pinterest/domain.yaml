defaults:
  platforms: [windows, unix]
  for: [html, javascript, typescript]
  crit: notable
  conf: 0.98

traits:
  - id: pinterest-domain
    desc: Pinterest domain reference
    if:
      type: text
      regex: '(?i)https?://([a-z0-9-]+\.)?pinterest\.(com|co\.uk|ca|de|fr|es|it|jp|com\.au)\b'

  - id: pinterest-cdn-domain
    desc: Pinterest pinimg CDN domain reference
    if:
      type: text
      regex: '(?i)https?://[a-z0-9-]+\.pinimg\.com\b'

composite_rules:
  - id: pinterest-web-context
    desc: Pinterest endpoint reference context
    crit: exception
    any:
      - id: pinterest-domain
      - id: pinterest-cdn-domain
