# Facebook embeds the per-session anti-CSRF token (fb_dtsg) in page HTML
# under DTSGInitialData. Code that pulls it out can submit the site's own
# internal forms (friend requests, messages) as the signed-in user without
# the user clicking anything. Facebook's own scripts never parse it from text.
defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]

traits:
  - id: dtsg-session-token-extract
    desc: Extracts Facebook DTSG session token
    crit: notable
    conf: 0.9
    if:
      type: text
      regex: 'DTSGInitialData\\?"?(\.\*\?|\[\^)'
