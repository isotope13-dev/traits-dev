defaults:
  platforms: [unix, windows]
  for: [scripts, binaries]
  crit: notable
  attack: T1071.001
traits:
  - id: huggingface-hub-python-client-import
    desc: Imports the Hugging Face Hub Python client
    conf: 0.98
    for: [python]
    if:
      type: import
      exact: huggingface_hub

  - id: hf-space-reference
    desc: Hugging Face Spaces host reference
    conf: 0.75
    if:
      type: text
      regex: '(?i)[a-zA-Z0-9.-]+\.hf\.space'
    unless:
      # Was `well-known/lib/data/`, now dissolved into well-known/ and the
      # package-file facts. `hf.space` is a public suffix, so an embedded PSL contains it.
      - id: well-known/lib/network/public-suffix-list/

# A Hugging Face Space can be an ordinary application backend (for example,
# document conversion or image generation).  The provider marker plus a
# download capability is therefore neutral; command-line staging is kept as
# the objective-level signal.
composite_rules:
  - id: huggingface-hub-bidirectional-file-exchange
    desc: Hugging Face Hub client downloads and uploads repository files
    crit: notable
    conf: 0.97
    for: [python]
    all:
      - id: huggingface-hub-python-client-import
      - id: micro-behaviors/communications/http/client/library::huggingface-hub-download-call
      - id: micro-behaviors/fs/file/read-write::python-upload-file-call

  - id: hf-space-download-capability
    desc: Hugging Face Space reference with download capability
    crit: notable
    conf: 0.8
    all:
      - id: hf-space-reference
      - id: micro-behaviors/communications/http/download/
