# Commercial voice-agent control-plane used by vishing panels to list
# rented personas (GET /assistant) rather than embedding a local TTS stack.
defaults:
  platforms: [unix, windows]
  for: [php, javascript, python, html]
  attack: T1071.001
  mbc: C0002

traits:
  - id: vapi-assistant-api-path
    desc: VAPI assistant API path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '(?i)api\.vapi\.ai/assistant'
