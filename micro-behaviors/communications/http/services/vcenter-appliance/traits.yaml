# vCenter appliance management REST API (VAMI). Creating a local account and
# toggling SSH/Bash are each routine administration; the combination with a
# role grant is evidence of a self-service root backdoor.
defaults:
  platforms: [unix, windows]
  for: [python, go, javascript, typescript, shell]
  crit: notable
  conf: 0.95

traits:
  - id: vcenter-local-account-create-path
    desc: vCenter appliance local-account creation path
    if:
      type: text
      substr: /rest/appliance/local-accounts/

  - id: vcenter-superadmin-role-assignment
    desc: Assigns vCenter superAdmin role in request
    if:
      type: text
      regex: '"roles"\s*:\s*\[\s*"superAdmin"\s*\]'

  - id: vcenter-ssh-access-enable-path
    desc: vCenter appliance SSH-access toggle path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: /rest/appliance/access/ssh

  - id: vcenter-shell-access-enable-path
    desc: vCenter appliance Bash-access toggle path
    crit: suspicious
    conf: 0.9
    if:
      type: text
      substr: /rest/appliance/access/shell
