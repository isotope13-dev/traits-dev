# Behavioral migration: scope and predicates preserved; see bounded-behavior-migration audit.
defaults:
  crit: notable
  platforms:
  - unix
  - windows
  for:
  - javascript
  - typescript
traits:
- id: metabase-api-list-databases
  desc: Metabase database-list route reference
  conf: 0.9
  if:
    type: text
    substr: /api/database?include=tables
- id: metabase-api-database-metadata
  desc: Metabase database-metadata route reference
  conf: 0.9
  if:
    type: text
    substr: /api/database/${e}/metadata
- id: metabase-api-database-schemas
  desc: Metabase database-schema route reference
  conf: 0.9
  if:
    type: text
    substr: /api/database/${e}/schemas
- id: metabase-api-database-fields
  desc: Metabase database-field route reference
  conf: 0.9
  if:
    type: text
    substr: /api/database/${e}/fields
- id: metabase-api-card-access
  desc: Metabase saved-question route reference
  conf: 0.9
  if:
    type: text
    substr: /api/card/
- id: metabase-api-native-dataset
  desc: Metabase native-dataset route reference
  conf: 0.9
  if:
    type: text
    substr: /api/dataset/native
composite_rules:
- id: metabase-api-schema-client
  desc: Metabase schema API route set
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/services/metabase::metabase-api-list-databases
  - id: micro-behaviors/communications/http/services/metabase::metabase-api-database-metadata
  - id: micro-behaviors/communications/http/services/metabase::metabase-api-database-schemas
  - id: micro-behaviors/communications/http/services/metabase::metabase-api-database-fields
- id: metabase-card-sql-client
  desc: Metabase saved-query API route set
  conf: 0.9
  all:
  - id: micro-behaviors/communications/http/services/metabase::metabase-api-card-access
  - id: micro-behaviors/communications/http/services/metabase::metabase-api-native-dataset
