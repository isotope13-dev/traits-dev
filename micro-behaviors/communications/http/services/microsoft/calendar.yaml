# Microsoft Graph calendar API capabilities. Calendar access is neutral; the
# cloud-mailbox objective combines these structures into a dead-drop C2 channel
# when code reads and writes opaque event attachments.
defaults:
  platforms: [windows, unix]
  for: [csharp, python, javascript, typescript, powershell, go, pe, dll]
  attack: T1102
  mbc: C0002

traits:
  - id: graph-calendar-view-path
    desc: Microsoft Graph calendarView path
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: /calendarView

  - id: graph-calendar-event-attachments-path
    desc: Graph calendar event attachments path
    crit: notable
    conf: 0.94
    if:
      type: text
      regex: '/events/[\s\S]{0,120}/attachments'

  - id: graph-calendar-events-write-path
    desc: Microsoft Graph calendar event write path
    crit: notable
    conf: 0.92
    if:
      type: text
      substr: /calendar/events

  - id: graph-file-attachment-object
    desc: Microsoft Graph fileAttachment object
    crit: notable
    conf: 0.93
    if:
      type: text
      substr: fileAttachment

  - id: graph-attachment-content-bytes
    desc: Graph attachment contentBytes field
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: contentBytes

composite_rules:
  - id: graph-calendar-attachment-api
    desc: Microsoft Graph calendar attachment API
    crit: notable
    conf: 0.96
    all:
      - id: graph-calendar-event-attachments-path
      - id: graph-file-attachment-object
      - id: graph-attachment-content-bytes
