# Microsoft service subject review; original matchers and effective defaults preserved.
---
defaults:
  platforms:
  - unix
  - windows
  for:
  - scripts
  - binaries
traits:
- id: microsoft-graph-mail-api
  desc: Microsoft Graph mail API
  crit: notable
  conf: 0.82
  if:
    type: text
    regex: graph\.microsoft\.com.{0,180}(mailFolders|messages|sendMail|reply)
- id: microsoft-graph-todo-api
  desc: Graph To Do endpoint or task permission
  crit: notable
  conf: 0.88
  if:
    type: text
    regex: graph\.microsoft\.com/v1\.0/me/todo/(lists|tasks)|Tasks\.ReadWrite
composite_rules:
- id: microsoft-graph-list-channel
  desc: Graph SharePoint list-items endpoint context
  crit: notable
  conf: 0.8
  all:
  - id: micro-behaviors/communications/http/services/microsoft::microsoft-graph-domain
  - id: micro-behaviors/communications/http/url/api-path::graph-sharepoint-list-items
