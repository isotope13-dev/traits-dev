# AD RMS SOAP surface. Match stable service paths, method names, and response
# field structure rather than lab hosts or SharpRMS branding so alternate
# clients and future implementations inherit the coverage.
defaults:
  platforms: [unix, windows]
  for: [scripts, source, binaries]
  crit: notable
  conf: 0.97
  attack: T1046

traits:
  - id: rms-certification-service-endpoint
    desc: References AD RMS certification SOAP service
    if:
      type: text
      regex: '(?i)/_wmcs/certification/(server|certification)\.asmx\b'

  - id: rms-template-distribution-endpoint
    desc: References AD RMS template-distribution service
    if:
      type: text
      regex: '(?i)/_wmcs/licensing/TemplateDistribution\.asmx\b'

  - id: rms-admin-manager-endpoint
    desc: References an AD RMS administrative service
    if:
      type: text
      regex: '(?i)/_wmcs/admin/(ClusterInfoMgr|TemplateMgr)\.asmx\b'

  - id: rms-acquire-template-information
    desc: Invokes AD RMS template enumeration operation
    if:
      type: text
      word: AcquireTemplateInformation

  - id: rms-key-protection-information
    desc: Invokes AD RMS key-protection query
    if:
      type: text
      word: GetServicePrivateKeyProtectionInformation

  - id: rms-software-private-key-field
    desc: References AD RMS software-key result field
    if:
      type: text
      word: IsServicePrivateKeySoftwareBased

  - id: rms-database-connection-field
    desc: References AD RMS database result field
    if:
      type: text
      word: DatabaseConnectionString

composite_rules:
  - id: rms-key-protection-result-fields
    desc: Parses AD RMS key-protection result fields
    all:
      - id: rms-software-private-key-field
      - id: rms-database-connection-field
    near_bytes: 600
