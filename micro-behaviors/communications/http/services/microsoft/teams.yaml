# Microsoft Teams HTTP service surfaces used for TURN credential minting and
# media relays. These are neutral capability atoms; hostile use (visitor authz
# from non-Teams clients, SOCKS over Teams TURN) lives in objectives/.
defaults:
  platforms: [windows, unix]
  for: [scripts, binaries, python]
  crit: notable
  conf: 0.92
  attack: T1071.001

traits:
  - id: teams-auth-service-endpoint
    desc: Microsoft Teams auth service endpoint
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: authsvc.teams.microsoft.com

  - id: teams-visitor-authz-endpoint
    desc: Teams anonymous visitor authz endpoint
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: /api/authsvc/v1.0/authz/visitor

  - id: teams-trap-exp-tokens-endpoint
    desc: Teams TURN credential token endpoint
    crit: notable
    conf: 0.95
    if:
      type: text
      substr: /trap-exp/tokens

  - id: teams-auth-type-explicit-login
    desc: Teams ExplicitLogin auth-type header
    crit: notable
    conf: 0.94
    if:
      type: text
      substr: Ms-Teams-Auth-Type

  - id: teams-turn-relay-host
    desc: Microsoft Teams TURN relay hostname
    crit: notable
    conf: 0.96
    if:
      type: text
      regex: '(?i)\b[\w.-]*relay\.teams\.microsoft\.com\b'

  - id: teams-skype-token-header
    desc: Skype token request header
    crit: notable
    conf: 0.9
    if:
      type: text
      substr: X-Skypetoken

composite_rules:
  - id: teams-turn-credential-fetch
    desc: Fetches Teams TURN credentials via visitor authz
    crit: notable
    conf: 0.96
    all:
      - id: teams-visitor-authz-endpoint
      - id: teams-trap-exp-tokens-endpoint
    any:
      - id: teams-auth-type-explicit-login
      - id: teams-skype-token-header
