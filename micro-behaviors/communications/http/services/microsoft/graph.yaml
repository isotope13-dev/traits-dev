defaults:
  platforms: [unix, windows]
  for: [javascript, typescript]
  crit: notable
  conf: 0.9

traits:
  - id: graph-drive-api
    desc: Microsoft Graph drive API access
    if:
      type: text
      regex: 'graph\.microsoft\.com/v[0-9.]+/me/drive\b'

  - id: graph-drive-file-content
    desc: Microsoft Graph drive file-content endpoint
    if:
      type: text
      regex: 'graph\.microsoft\.com/v[0-9.]+/me/drive/root:|\$\{GRAPH_ROOT\}/root:'

composite_rules:
  - id: graph-drive-file-sync
    desc: Microsoft Graph drive file synchronization
    crit: notable
    conf: 0.95
    all:
      - id: graph-drive-api
      - id: graph-drive-file-content
      - id: micro-behaviors/communications/http/request/client::js-fetch-call
